unit: integration-techniques
course: calculus-2
module: "Techniques of Integration"
topics:
  - id: integration-by-parts-single
    name: Integration by Parts (Single Application)
    core: true
    difficulty: 0.55
    drill: false
    answer_kind: numeric
    expected_time_secs: 150
    prerequisites:
      - id: integration-substitution
        weight: 0.7
        key: true
      - id: antiderivatives
        weight: 0.6
        key: true
      - id: product-rule
        weight: 0.5
      - id: derivatives-exp-log
        weight: 0.5
    knowledge_points:
      - id: kp1
        name: Polynomial times exponential or trig
        key_prerequisites: [antiderivatives, derivatives-exp-log]
        step_check:
          step: 'Choose $u = x$ (the polynomial)'
          question: 'Why is $u = x$ the better choice here?'
          options:
            - 'The longer factor in the integrand should always be chosen as $u$ in a parts integral'
            - 'Differentiating $x$ gives $1$, so the new integral is simpler than the old one'
            - 'The factor that is easiest to integrate should always be chosen as $u$, as a general rule'
          answer: 'Differentiating $x$ gives $1$, so the new integral is simpler than the old one'
          why: 'The formula replaces $\int u\,dv$ by $\int v\,du$. Differentiating $x$ removes the polynomial, so the leftover integral is a basic one.'
        exemplars:
          - problem: 'Evaluate $\int x e^x \, dx$.'
            answer: '(x - 1)*e^x + C'
            answer_contract: {"kind": "function", "vars": ["x"], "up_to_constant": true}
            solution_sketch: 'Take $u = x$ and $dv = e^x\,dx$, so $du = dx$ and $v = e^x$. Then $\int x e^x\,dx = xe^x - \int e^x\,dx = xe^x - e^x + C$. Differentiating $(x - 1)e^x$ gives $e^x + (x-1)e^x = xe^x$, which confirms the result.'
          - problem: 'Find $\int x\cos x \, dx$.'
            answer: 'x*sin(x) + cos(x) + C'
            answer_contract: {"kind": "function", "vars": ["x"], "up_to_constant": true}
            solution_sketch: 'Take $u = x$ and $dv = \cos x\,dx$, so $du = dx$ and $v = \sin x$. Then $\int x\cos x\,dx = x\sin x - \int \sin x\,dx = x\sin x + \cos x + C$.'
          - problem: 'Evaluate $\int x e^{2x} \, dx$.'
            answer: 'x*e^(2x)/2 - e^(2x)/4 + C'
            answer_contract: {"kind": "function", "vars": ["x"], "up_to_constant": true}
            solution_sketch: 'Take $u = x$ and $dv = e^{2x}\,dx$, so $du = dx$ and $v = \frac{e^{2x}}{2}$. Then $\int x e^{2x}\,dx = \frac{x e^{2x}}{2} - \frac{1}{2}\int e^{2x}\,dx = \frac{x e^{2x}}{2} - \frac{e^{2x}}{4} + C$.'
          - problem: 'Find $\int (2x + 1)\cos x \, dx$.'
            answer: '(2x + 1)*sin(x) + 2*cos(x) + C'
            answer_contract: {"kind": "function", "vars": ["x"], "up_to_constant": true}
            solution_sketch: 'Take $u = 2x + 1$ and $dv = \cos x\,dx$, so $du = 2\,dx$ and $v = \sin x$. Then the integral is $(2x+1)\sin x - 2\int \sin x\,dx = (2x+1)\sin x + 2\cos x + C$.'
          - problem: 'A particle moves along a line with velocity $v(t) = t e^{t}$ metres per second. How far does it travel between $t = 0$ and $t = 1$ seconds?'
            answer: '1'
            answer_contract: {"kind": "unit", "quantity": "length", "unit": "m", "allow_omitted": true}
            solution_sketch: 'The velocity is positive, so the distance is $\int_0^1 t e^t\,dt$. Parts with $u = t$ and $dv = e^t\,dt$ give the antiderivative $(t - 1)e^t$. Then $[(t-1)e^t]_0^1 = 0 - (-1) = 1$, so the particle travels $1$ metre.'
          - problem: 'A cart has velocity $v(t) = t\sin t$ metres per second. At time $0$ it is at position $s(0) = 2$ metres. Find its position $s(t)$ in metres.'
            answer: 'sin(t) - t*cos(t) + 2'
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: 'The position is the antiderivative of the velocity. Parts with $u = t$ and $dv = \sin t\,dt$ give $\int t\sin t\,dt = -t\cos t + \sin t + K$. The condition $s(0) = K = 2$ fixes the constant, so $s(t) = \sin t - t\cos t + 2$.'
          - problem: 'Sam writes $\int x\sin x\,dx = x\cos x + \sin x + C$. What is the correct antiderivative?'
            answer: '-x*cos(x) + sin(x) + C'
            answer_contract: {"kind": "function", "vars": ["x"], "up_to_constant": true}
            solution_sketch: 'With $u = x$ and $dv = \sin x\,dx$ we get $v = -\cos x$, so the formula gives $-x\cos x + \int \cos x\,dx = -x\cos x + \sin x + C$. Sam lost the minus sign of $v$. Differentiating the wrong answer gives $2\cos x - x\sin x$, which is not the integrand.'
          - problem: 'The speed of a cart is $v(t) = t\sin t$ metres per second for $0 \le t \le \pi$ seconds. What is its average speed over this time interval?'
            answer: '1'
            answer_contract: {"kind": "unit", "quantity": "speed", "unit": "m/s", "allow_omitted": true}
            solution_sketch: 'The average speed is the total distance divided by the elapsed time $\pi$. The distance is $\int_0^\pi t\sin t\,dt = [-t\cos t + \sin t]_0^\pi = \pi$. So the average speed is $\frac{\pi}{\pi} = 1$ metre per second.'
        constraints: "integrand is (linear polynomial) x (e^{ax}, sin ax, or cos ax) with a in {1, 2, 3}, in a bare integral or in a context; one application of parts suffices; small integer coefficients"
      - id: kp2
        name: Choosing u and dv (LIATE)
        key_prerequisites: [antiderivatives, product-rule]
        step_check:
          step: 'LIATE puts Algebraic before Exponential'
          question: 'Why does LIATE put Algebraic before Exponential when choosing $u$?'
          options:
            - 'Exponential factors are always harder to integrate than powers of $x$, so they come last'
            - 'A power of $x$ becomes simpler when integrated, but an exponential never does, so $x$ is first'
            - 'A power of $x$ becomes simpler when differentiated, but an exponential never does'
          answer: 'A power of $x$ becomes simpler when differentiated, but an exponential never does'
          why: 'The factor chosen as $u$ is differentiated, the other is integrated. Differentiating $x$ gives $1$, while $e^{2x}$ keeps its form either way.'
        exemplars:
          - problem: 'Evaluate $\int x e^{-x} \, dx$.'
            answer: '-(x + 1)*e^(-x) + C'
            answer_contract: {"kind": "function", "vars": ["x"], "up_to_constant": true}
            solution_sketch: 'Take $u = x$ and $dv = e^{-x}\,dx$, so $du = dx$ and $v = -e^{-x}$. Then $\int x e^{-x}\,dx = -xe^{-x} + \int e^{-x}\,dx = -xe^{-x} - e^{-x} + C = -(x + 1)e^{-x} + C$.'
          - problem: 'Evaluate $\int x \cos 2x \, dx$.'
            answer: 'x*sin(2x)/2 + cos(2x)/4 + C'
            answer_contract: {"kind": "function", "vars": ["x"], "up_to_constant": true}
            solution_sketch: 'Take $u = x$ and $dv = \cos 2x\,dx$, so $du = dx$ and $v = \frac{\sin 2x}{2}$. Then $\int x\cos 2x\,dx = \frac{x\sin 2x}{2} - \frac{1}{2}\int \sin 2x\,dx = \frac{x\sin 2x}{2} + \frac{\cos 2x}{4} + C$.'
          - problem: 'Find $\int x \sin 3x \, dx$.'
            answer: '-x*cos(3x)/3 + sin(3x)/9 + C'
            answer_contract: {"kind": "function", "vars": ["x"], "up_to_constant": true}
            solution_sketch: 'LIATE ranks the algebraic factor $x$ before the trig factor, so $u = x$ and $dv = \sin 3x\,dx$. Then $v = -\frac{\cos 3x}{3}$, and $\int x\sin 3x\,dx = -\frac{x\cos 3x}{3} + \frac{1}{3}\int \cos 3x\,dx = -\frac{x\cos 3x}{3} + \frac{\sin 3x}{9} + C$.'
          - problem: 'Sam tries $\int x e^{x}\,dx$ with $u = e^{x}$ and $dv = x\,dx$. After applying the parts formula, is the new integral easier than the original one?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["no", "it is harder", "harder", "not easier", "no it is not"], ["yes", "it is easier", "easier"]]}
            solution_sketch: 'With $u = e^x$ and $dv = x\,dx$ we get $du = e^x\,dx$ and $v = \frac{x^2}{2}$. The new integral is $\int \frac{x^2}{2}e^x\,dx$, which has a higher power of $x$ than the original. So the new integral is harder, and the choice $u = x$ is the right one.'
          - problem: 'Evaluate $\int x e^{3x} \, dx$.'
            answer: 'x*e^(3x)/3 - e^(3x)/9 + C'
            answer_contract: {"kind": "function", "vars": ["x"], "up_to_constant": true}
            solution_sketch: 'LIATE puts the algebraic factor first, so $u = x$ and $dv = e^{3x}\,dx$. Then $du = dx$ and $v = \frac{e^{3x}}{3}$. So $\int x e^{3x}\,dx = \frac{xe^{3x}}{3} - \frac{1}{3}\int e^{3x}\,dx = \frac{xe^{3x}}{3} - \frac{e^{3x}}{9} + C$.'
          - problem: 'The current in a circuit is $i(t) = t\cos 2t$ amperes. Find the charge $Q(t)$ that has passed by time $t$, given that $Q(0) = 0$.'
            answer: 't*sin(2t)/2 + cos(2t)/4 - 1/4'
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: 'The charge is the antiderivative of the current. Parts with $u = t$ and $dv = \cos 2t\,dt$ give $\int t\cos 2t\,dt = \frac{t\sin 2t}{2} + \frac{\cos 2t}{4} + K$. The condition $Q(0) = \frac{1}{4} + K = 0$ gives $K = -\frac{1}{4}$.'
          - problem: 'Water flows into a tank at the rate $r(t) = te^{-t}$ litres per minute. How many litres flow in during the first minute, to two decimal places?'
            answer: '0.26'
            answer_contract: {"decimals": 2, "kind": "approx"}
            solution_sketch: 'The volume is $\int_0^1 te^{-t}\,dt$. Parts with $u = t$ and $dv = e^{-t}\,dt$ give the antiderivative $-(t+1)e^{-t}$. Then $[-(t+1)e^{-t}]_0^1 = 1 - 2e^{-1} \approx 0.26$, so about $0.26$ litres flow in.'
          - problem: 'Evaluate $\int_0^{\pi/2} x \sin x \, dx$.'
            answer: '1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Take $u = x$ and $dv = \sin x\,dx$, so an antiderivative is $-x\cos x + \sin x$. At $x = \frac{\pi}{2}$ it equals $0 + 1 = 1$, and at $x = 0$ it equals $0$. The value of the definite integral is $1$.'
          - problem: 'Evaluate $\int x \cos 3x \, dx$.'
            answer: 'x*sin(3x)/3 + cos(3x)/9 + C'
            answer_contract: {"kind": "function", "vars": ["x"], "up_to_constant": true}
            solution_sketch: 'Take $u = x$ and $dv = \cos 3x\,dx$, so $du = dx$ and $v = \frac{\sin 3x}{3}$. Then $\int x\cos 3x\,dx = \frac{x\sin 3x}{3} - \frac{1}{3}\int \sin 3x\,dx = \frac{x\sin 3x}{3} + \frac{\cos 3x}{9} + C$.'
        constraints: "integrand is one algebraic factor times one exponential or trig factor, in a bare integral or in a context; LIATE ordering decides u; one item asks whether a reversed choice of u and dv helps"
      - id: kp3
        name: Logarithmic and inverse-trig integrands
        key_prerequisites: [derivatives-exp-log, integration-substitution]
        step_check:
          step: 'set $u = \arcsin x$ and $dv = dx$'
          question: 'Why is $u = \arcsin x$, with $dv = dx$, the right choice here?'
          options:
            - 'We cannot integrate $\arcsin x$ directly, but its derivative is an algebraic function'
            - 'The derivative of $\arcsin x$ is $\frac{1}{x}$, so the new integral is a simple logarithm'
            - 'The factor $dx$ has no antiderivative, so it must be placed in $u$ instead of $dv$'
          answer: 'We cannot integrate $\arcsin x$ directly, but its derivative is an algebraic function'
          why: 'We only know the derivative $\frac{1}{\sqrt{1-x^2}}$ of $\arcsin x$, not an antiderivative. Putting it in $u$ turns it into an algebraic function.'
        try_first:
          problem: 'Evaluate $\int_1^{e^2} \ln x \, dx$.'
          answer_contract: {"kind": "exact"}
          answer: 'e^2 + 1'
          reveal: 'The function $\ln x$ has no basic antiderivative, so write the integrand as $\ln x \cdot 1$ and let $u = \ln x$ and $dv = dx$. Parts give $[x\ln x - x]_1^{e^2} = (2e^2 - e^2) - (-1) = e^2 + 1$.'
        exemplars:
          - problem: 'Evaluate $\int \ln x \, dx$.'
            answer: 'x*ln(x) - x + C'
            answer_contract: {"kind": "function", "vars": ["x"], "up_to_constant": true}
            solution_sketch: 'Take $u = \ln x$ and $dv = dx$, so $du = \frac{dx}{x}$ and $v = x$. Then $\int \ln x\,dx = x\ln x - \int x\cdot\frac{1}{x}\,dx = x\ln x - x + C$.'
          - problem: 'Evaluate $\int x \ln x \, dx$.'
            answer: 'x^2*ln(x)/2 - x^2/4 + C'
            answer_contract: {"kind": "function", "vars": ["x"], "up_to_constant": true}
            solution_sketch: 'Take $u = \ln x$ and $dv = x\,dx$, so $du = \frac{dx}{x}$ and $v = \frac{x^2}{2}$. Then $\int x\ln x\,dx = \frac{x^2}{2}\ln x - \int \frac{x}{2}\,dx = \frac{x^2}{2}\ln x - \frac{x^2}{4} + C$.'
          - problem: 'Evaluate $\int \arctan x \, dx$.'
            answer: 'x*arctan(x) - ln(1 + x^2)/2 + C'
            answer_contract: {"kind": "function", "vars": ["x"], "up_to_constant": true}
            solution_sketch: 'Take $u = \arctan x$ and $dv = dx$, so $du = \frac{dx}{1+x^2}$ and $v = x$. Then $\int \arctan x\,dx = x\arctan x - \int \frac{x}{1+x^2}\,dx$. The substitution $w = 1 + x^2$ gives $\int \frac{x}{1+x^2}\,dx = \frac{1}{2}\ln(1+x^2)$.'
          - problem: 'Find $\int \frac{\ln x}{x^2} \, dx$.'
            answer: '-ln(x)/x - 1/x + C'
            answer_contract: {"kind": "function", "vars": ["x"], "up_to_constant": true}
            solution_sketch: 'Take $u = \ln x$ and $dv = x^{-2}\,dx$, so $du = \frac{dx}{x}$ and $v = -\frac{1}{x}$. Then the integral is $-\frac{\ln x}{x} + \int \frac{1}{x^2}\,dx = -\frac{\ln x}{x} - \frac{1}{x} + C$.'
          - problem: 'Water flows into a tank at the rate $r(t) = \ln t$ litres per minute between $t = 1$ and $t = e$ minutes. How many litres flow in during this time?'
            answer: '1'
            answer_contract: {"kind": "unit", "quantity": "volume", "unit": "L", "allow_omitted": true}
            solution_sketch: 'The volume is $\int_1^e \ln t\,dt$, and the rate is never negative on this interval. An antiderivative is $t\ln t - t$. Then $[t\ln t - t]_1^e = (e - e) - (0 - 1) = 1$, so $1$ litre flows in.'
          - problem: 'Evaluate $\int_0^1 \arctan x \, dx$.'
            answer: 'pi/4 - ln(2)/2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'An antiderivative is $x\arctan x - \frac{1}{2}\ln(1+x^2)$. At $x = 1$ it equals $\frac{\pi}{4} - \frac{1}{2}\ln 2$, and at $x = 0$ it equals $0$. The value is $\frac{\pi}{4} - \frac{\ln 2}{2}$.'
          - problem: 'Sam evaluates $\int x^3 \ln x\,dx$ and writes $\frac{x^4}{4}\ln x - \frac{x^4}{4} + C$. What is the correct antiderivative?'
            answer: 'x^4*ln(x)/4 - x^4/16 + C'
            answer_contract: {"kind": "function", "vars": ["x"], "up_to_constant": true}
            solution_sketch: 'With $u = \ln x$ and $dv = x^3\,dx$ we get $v = \frac{x^4}{4}$, so $\int x^3\ln x\,dx = \frac{x^4}{4}\ln x - \frac{1}{4}\int x^3\,dx = \frac{x^4}{4}\ln x - \frac{x^4}{16} + C$. Sam forgot the factor $\frac{1}{4}$ in the leftover integral.'
          - problem: 'A rectangle with base $e - 1$ has the same area as the region under $y = \ln x$ between $x = 1$ and $x = e$. How tall is the rectangle?'
            answer: '1/(e - 1)'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The area under $y = \ln x$ from $1$ to $e$ is $[x\ln x - x]_1^e = 1$. The rectangle has area $(e - 1)\cdot h$, so $h = \frac{1}{e - 1}$. This is also the average value of $\ln x$ on the interval.'
        constraints: "integrand involves ln x or an inverse trig function, in a bare integral or in a context; choose u = the log/inverse function, dv = the rest"
    diagnostic_exemplar:
      problem: 'Evaluate $\int x^2 \ln x \, dx$.'
      answer: '$\frac{x^3}{3}\ln x - \frac{x^3}{9} + C$'
      solution_sketch: 'LIATE picks $u = \ln x$, $dv = x^2dx$: $\frac{x^3}{3}\ln x - \int \frac{x^2}{3}dx$.'
    anki_seeds:
      - front: "Integration by parts formula?"
        back: '$\int u \, dv = uv - \int v \, du$'
        type: basic
      - front: "LIATE heuristic: pick u in this priority order..."
        back: "Logarithmic, Inverse trig, Algebraic, Trigonometric, Exponential"
        type: basic

  - id: integration-by-parts
    name: Integration by Parts
    core: true
    difficulty: 0.62
    drill: false
    answer_kind: expression
    expected_time_secs: 180
    prerequisites:
      - id: integration-by-parts-single
        weight: 0.8
        key: true
      - id: integration-substitution
        weight: 0.5
        key: true
      - id: definite-integrals-ftc
        weight: 0.5
      - id: derivatives-exp-log
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: Definite integrals by parts
        key_prerequisites: [integration-by-parts-single, definite-integrals-ftc]
        step_check:
          step: 'Evaluate the boundary term'
          question: 'Why is the boundary term $[uv]_a^b$ worked out at both limits and subtracted?'
          options:
            - 'It is a constant of integration, so it is added to the answer without any change'
            - 'The limits are only needed for the leftover integral and not for this term'
            - 'It is the change in $uv$ from $a$ to $b$, so it is a number and not a function'
          answer: 'It is the change in $uv$ from $a$ to $b$, so it is a number and not a function'
          why: 'The parts formula gives $uv$ as an antiderivative piece. Over $[a, b]$ the integral uses its change, $uv$ at $b$ minus $uv$ at $a$.'
        exemplars:
          - problem: 'Evaluate $\int_0^{\pi} x\sin x \, dx$.'
            answer: 'pi'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Take $u = x$ and $dv = \sin x\,dx$, so an antiderivative is $-x\cos x + \sin x$. At $x = \pi$ it equals $\pi + 0$, and at $x = 0$ it equals $0$. The value is $\pi$.'
          - problem: 'Evaluate $\int_0^1 xe^x \, dx$.'
            answer: '1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'With $u = x$ and $dv = e^x\,dx$, an antiderivative is $(x - 1)e^x$. Then $[(x-1)e^x]_0^1 = 0 - (-1) = 1$.'
          - problem: 'Evaluate $\int_1^2 \ln x \, dx$.'
            answer: '2*ln(2) - 1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'With $u = \ln x$ and $dv = dx$, an antiderivative is $x\ln x - x$. Then $[x\ln x - x]_1^2 = (2\ln 2 - 2) - (0 - 1) = 2\ln 2 - 1$.'
          - problem: 'Evaluate $\int_0^1 xe^{-x} \, dx$.'
            answer: '1 - 2/e'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'With $u = x$ and $dv = e^{-x}\,dx$, an antiderivative is $-(x + 1)e^{-x}$. Then $[-(x+1)e^{-x}]_0^1 = -2e^{-1} + 1 = 1 - \frac{2}{e}$.'
          - problem: 'Evaluate $\int_1^e x\ln x \, dx$.'
            answer: '(e^2 + 1)/4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'With $u = \ln x$ and $dv = x\,dx$, an antiderivative is $\frac{x^2}{2}\ln x - \frac{x^2}{4}$. At $x = e$ it equals $\frac{e^2}{2} - \frac{e^2}{4} = \frac{e^2}{4}$, and at $x = 1$ it equals $-\frac{1}{4}$. The value is $\frac{e^2 + 1}{4}$.'
          - problem: 'A cart has velocity $v(t) = t\cos t$ metres per second for $0 \le t \le \frac{\pi}{2}$ seconds. How far does it travel?'
            answer: 'pi/2 - 1'
            answer_contract: {"kind": "unit", "quantity": "length", "unit": "m", "allow_omitted": true}
            solution_sketch: 'The velocity is not negative on this interval, so the distance is $\int_0^{\pi/2} t\cos t\,dt$. An antiderivative is $t\sin t + \cos t$. Then $[t\sin t + \cos t]_0^{\pi/2} = \frac{\pi}{2} - 1$, about $0.57$ metres.'
          - problem: 'The temperature along a metal rod of length $2$ metres is $T(x) = xe^{x}$ degrees, at distance $x$ metres from one end. What is the average temperature along the rod?'
            answer: '(e^2 + 1)/2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The average value is the integral divided by the length $2$. An antiderivative of $xe^x$ is $(x-1)e^x$, so $\int_0^2 xe^x\,dx = e^2 + 1$. The average is $\frac{e^2 + 1}{2}$ degrees.'
          - problem: 'Sam evaluates $\int_0^{\pi} x\cos x\,dx$ and stops after finding $[x\sin x]_0^{\pi} = 0$. What is the correct value of the integral?'
            answer: '-2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The parts formula gives $[x\sin x]_0^{\pi} - \int_0^{\pi}\sin x\,dx$. Sam stopped after the boundary term and left out the second part. The second part is $[-\cos x]_0^{\pi} = 2$, so the value is $0 - 2 = -2$.'
          - problem: 'Find the area of the region bounded by $y = \ln x$, the $x$-axis and the lines $x = 1$ and $x = 3$.'
            answer: '3*ln(3) - 2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The curve lies above the $x$-axis for $x \ge 1$, so the area is $\int_1^3 \ln x\,dx$. Then $[x\ln x - x]_1^3 = (3\ln 3 - 3) - (0 - 1) = 3\ln 3 - 2$.'
        constraints: "bounds are small integers, e, or multiples of pi, in a bare integral or in a context; the boundary evaluation must simplify cleanly"
      - id: kp2
        name: Repeated integration by parts
        key_prerequisites: [integration-by-parts-single]
        step_check:
          step: 'Set up the second application'
          question: 'Why is a second application of parts needed after the first one?'
          options:
            - 'The new integral $\int x e^{2x}\,dx$ still has a polynomial factor, so it is not basic'
            - 'The first application always leaves an integral that is equal to the original integral'
            - 'The formula needs two applications whenever the polynomial has any coefficient that is not $1$'
          answer: 'The new integral $\int x e^{2x}\,dx$ still has a polynomial factor, so it is not basic'
          why: 'Each application lowers the degree of the polynomial by one. After one application $x$ is left, and a second application removes it.'
        exemplars:
          - problem: 'Evaluate $\int x^2 e^x \, dx$.'
            answer: '(x^2 - 2x + 2)*e^x + C'
            answer_contract: {"kind": "function", "vars": ["x"], "up_to_constant": true}
            solution_sketch: 'Take $u = x^2$ and $dv = e^x\,dx$, so $\int x^2e^x\,dx = x^2e^x - 2\int xe^x\,dx$. A second application gives $\int xe^x\,dx = (x-1)e^x$. So the result is $x^2e^x - 2(x-1)e^x + C = (x^2 - 2x + 2)e^x + C$.'
          - problem: 'Evaluate $\int x^2 \sin x \, dx$.'
            answer: '-x^2*cos(x) + 2x*sin(x) + 2*cos(x) + C'
            answer_contract: {"kind": "function", "vars": ["x"], "up_to_constant": true}
            solution_sketch: 'Take $u = x^2$ and $dv = \sin x\,dx$, so $\int x^2\sin x\,dx = -x^2\cos x + 2\int x\cos x\,dx$. A second application gives $\int x\cos x\,dx = x\sin x + \cos x$. So the result is $-x^2\cos x + 2x\sin x + 2\cos x + C$.'
          - problem: 'Evaluate $\int x^2 e^{-x} \, dx$.'
            answer: '-(x^2 + 2x + 2)*e^(-x) + C'
            answer_contract: {"kind": "function", "vars": ["x"], "up_to_constant": true}
            solution_sketch: 'Take $u = x^2$ and $dv = e^{-x}\,dx$, so $\int x^2e^{-x}\,dx = -x^2e^{-x} + 2\int xe^{-x}\,dx$. A second application gives $\int xe^{-x}\,dx = -(x+1)e^{-x}$. So the result is $-x^2e^{-x} - 2(x+1)e^{-x} + C = -(x^2 + 2x + 2)e^{-x} + C$.'
          - problem: 'Evaluate $\int x^2 \cos 2x \, dx$.'
            answer: 'x^2*sin(2x)/2 + x*cos(2x)/2 - sin(2x)/4'
            answer_contract: {"kind": "function", "vars": ["x"], "up_to_constant": true}
            solution_sketch: 'Take $u = x^2$ and $dv = \cos 2x\,dx$, so $\int x^2\cos 2x\,dx = \frac{x^2\sin 2x}{2} - \int x\sin 2x\,dx$. A second application gives $\int x\sin 2x\,dx = -\frac{x\cos 2x}{2} + \frac{\sin 2x}{4}$. So the result is $\frac{x^2\sin 2x}{2} + \frac{x\cos 2x}{2} - \frac{\sin 2x}{4} + C$.'
          - problem: 'Evaluate $\int (\ln x)^2 \, dx$.'
            answer: 'x*ln(x)^2 - 2x*ln(x) + 2x + C'
            answer_contract: {"kind": "function", "vars": ["x"], "up_to_constant": true}
            solution_sketch: 'Take $u = (\ln x)^2$ and $dv = dx$, so $du = \frac{2\ln x}{x}\,dx$ and $\int(\ln x)^2\,dx = x(\ln x)^2 - 2\int \ln x\,dx$. A second application gives $\int\ln x\,dx = x\ln x - x$. So the result is $x(\ln x)^2 - 2x\ln x + 2x + C$.'
          - problem: 'A runner has velocity $v(t) = t^2e^{-t}$ metres per second and starts at position $s(0) = 0$. Find the position $s(t)$ in metres.'
            answer: '2 - (t^2 + 2t + 2)*e^(-t)'
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: 'Two applications of parts give $\int t^2e^{-t}\,dt = -(t^2 + 2t + 2)e^{-t} + K$. The condition $s(0) = -2 + K = 0$ gives $K = 2$. So $s(t) = 2 - (t^2 + 2t + 2)e^{-t}$.'
          - problem: 'Evaluate $\int_0^1 x^2 e^x \, dx$.'
            answer: 'e - 2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'An antiderivative is $(x^2 - 2x + 2)e^x$. At $x = 1$ it equals $e$, and at $x = 0$ it equals $2$. The value is $e - 2$.'
          - problem: 'A signal has strength $f(t) = t^2\sin t$ for $0 \le t \le \pi$. What is its average strength over this interval?'
            answer: 'pi - 4/pi'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The average is the integral divided by the length $\pi$. An antiderivative is $-t^2\cos t + 2t\sin t + 2\cos t$, so $\int_0^\pi t^2\sin t\,dt = (\pi^2 - 2) - 2 = \pi^2 - 4$. The average is $\frac{\pi^2 - 4}{\pi} = \pi - \frac{4}{\pi}$.'
          - problem: 'Sam evaluates $\int x^2\cos x\,dx$ and writes $x^2\sin x + 2x\cos x + C$. What is the correct antiderivative?'
            answer: 'x^2*sin(x) + 2x*cos(x) - 2*sin(x) + C'
            answer_contract: {"kind": "function", "vars": ["x"], "up_to_constant": true}
            solution_sketch: 'Two applications give $x^2\sin x - 2\int x\sin x\,dx = x^2\sin x - 2(-x\cos x + \sin x)$. This equals $x^2\sin x + 2x\cos x - 2\sin x + C$. Sam stopped before the last term $-2\sin x$.'
        constraints: "quadratic polynomial (or (ln x)^2) times e^{ax}, sin ax, or cos ax, in a bare integral, a definite integral or a context; exactly two applications of parts"
      - id: kp3
        name: Boomerang integrals (the integral reappears)
        key_prerequisites: [integration-by-parts-single]
        step_check:
          step: 'the original integral has reappeared'
          question: 'Why does it help that the original integral has reappeared?'
          options:
            - 'It shows that the integral cannot be found, so the method has failed here'
            - 'The result is an equation with $I$ on both sides, so we can solve for $I$'
            - 'It means the leftover integral is $0$, so $I$ is just the boundary term here'
          answer: 'The result is an equation with $I$ on both sides, so we can solve for $I$'
          why: 'The equation $I = (\text{known terms}) - \frac{1}{4}I$ is linear in $I$. Moving the $I$ terms to one side gives the value of $I$.'
        try_first:
          problem: 'Evaluate $\int_0^{\pi/2} e^x \sin x \, dx$.'
          answer_contract: {"kind": "exact"}
          answer: '(e^(pi/2) + 1)/2'
          reveal: 'Parts twice return the original integral, so $I = [e^x\sin x - e^x\cos x]_0^{\pi/2} - I$ and $2I = e^{\pi/2} + 1$. The value is $\frac{e^{\pi/2} + 1}{2}$.'
        exemplars:
          - problem: 'Evaluate $\int e^x \cos x \, dx$.'
            answer: 'e^x*(sin(x) + cos(x))/2 + C'
            answer_contract: {"kind": "function", "vars": ["x"], "up_to_constant": true}
            solution_sketch: 'Apply parts twice, with $u = \cos x$ and then $u = \sin x$; the original integral $I$ reappears. This gives $I = e^x\sin x + e^x\cos x - I$. Solving for $I$ gives $I = \frac{e^x(\sin x + \cos x)}{2} + C$.'
          - problem: 'Evaluate $\int e^x \sin x \, dx$.'
            answer: 'e^x*(sin(x) - cos(x))/2 + C'
            answer_contract: {"kind": "function", "vars": ["x"], "up_to_constant": true}
            solution_sketch: 'Apply parts twice; the original integral $I$ reappears. This gives $I = -e^x\cos x + e^x\sin x - I$. Solving for $I$ gives $I = \frac{e^x(\sin x - \cos x)}{2} + C$.'
          - problem: 'Evaluate $\int e^{2x} \sin x \, dx$.'
            answer: 'e^(2x)*(2*sin(x) - cos(x))/5 + C'
            answer_contract: {"kind": "function", "vars": ["x"], "up_to_constant": true}
            solution_sketch: 'Two applications of parts give $I = -e^{2x}\cos x + 2e^{2x}\sin x - 4I$. Then $5I = e^{2x}(2\sin x - \cos x)$. So $I = \frac{e^{2x}(2\sin x - \cos x)}{5} + C$.'
          - problem: 'Evaluate $\int e^{-x} \cos x \, dx$.'
            answer: 'e^(-x)*(sin(x) - cos(x))/2 + C'
            answer_contract: {"kind": "function", "vars": ["x"], "up_to_constant": true}
            solution_sketch: 'Two applications of parts give $I = e^{-x}\sin x - e^{-x}\cos x - I$. Then $2I = e^{-x}(\sin x - \cos x)$. So $I = \frac{e^{-x}(\sin x - \cos x)}{2} + C$.'
          - problem: 'Evaluate $\int e^{x} \cos 2x \, dx$.'
            answer: 'e^x*(cos(2x) + 2*sin(2x))/5 + C'
            answer_contract: {"kind": "function", "vars": ["x"], "up_to_constant": true}
            solution_sketch: 'Two applications of parts give $I = e^x\cos 2x + 2e^x\sin 2x - 4I$. Then $5I = e^x(\cos 2x + 2\sin 2x)$. So $I = \frac{e^x(\cos 2x + 2\sin 2x)}{5} + C$.'
          - problem: 'A damped oscillator has velocity $v(t) = e^{-t}\cos t$ metres per second and starts at position $s(0) = 0$. Find its position $s(t)$ in metres.'
            answer: 'e^(-t)*(sin(t) - cos(t))/2 + 1/2'
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: 'Two applications of parts give $\int e^{-t}\cos t\,dt = \frac{e^{-t}(\sin t - \cos t)}{2} + K$. The condition $s(0) = -\frac{1}{2} + K = 0$ gives $K = \frac{1}{2}$. So $s(t) = \frac{e^{-t}(\sin t - \cos t)}{2} + \frac{1}{2}$.'
          - problem: 'A voltage is $V(t) = e^{t}\cos t$ volts for $0 \le t \le \pi$ seconds. What is its average value over this time interval?'
            answer: '-(e^pi + 1)/(2*pi)'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'An antiderivative is $\frac{e^t(\sin t + \cos t)}{2}$. At $t = \pi$ it equals $-\frac{e^\pi}{2}$, and at $t = 0$ it equals $\frac{1}{2}$, so the integral is $-\frac{e^\pi + 1}{2}$. Dividing by the length $\pi$ gives the average $-\frac{e^\pi + 1}{2\pi}$.'
          - problem: 'Sam finds $\int e^{3x}\cos x\,dx$ and writes $\frac{e^{3x}(3\cos x + \sin x)}{9} + C$. What is the correct antiderivative?'
            answer: 'e^(3x)*(3*cos(x) + sin(x))/10 + C'
            answer_contract: {"kind": "function", "vars": ["x"], "up_to_constant": true}
            solution_sketch: 'Two applications of parts give $I = \frac{e^{3x}\cos x}{3} + \frac{e^{3x}\sin x}{9} - \frac{I}{9}$. Collecting the $I$ terms gives $\frac{10}{9}I$, so Sam should divide by $10$, not by $9$. The result is $I = \frac{e^{3x}(3\cos x + \sin x)}{10} + C$.'
        constraints: "boomerang type limited to e^{ax} sin bx / e^{ax} cos bx with a in {-1, 1, 2, 3} and b in {1, 2}, in a bare integral, a definite integral or a context"
    diagnostic_exemplar:
      problem: 'Evaluate $\int_0^{\pi} e^x \sin x \, dx$.'
      answer: '$(e^{\pi} + 1)/2$'
      solution_sketch: 'Two rounds of parts return the integral: $\int e^x\sin x\,dx = e^x(\sin x - \cos x)/2$; evaluating from $0$ to $\pi$ gives $e^{\pi}/2 + 1/2$.'
    anki_seeds:
      - front: "Boomerang integral (e.g. $\\int e^x \\cos x\\,dx$): what's the move?"
        back: "Apply parts twice; the original integral I reappears — solve the resulting equation for I algebraically."
        type: basic
      - front: '$\int x^n e^x \, dx$ requires how many applications of parts?'
        back: '$n$ (each application lowers the polynomial degree by one)'
        type: basic

  - id: tabular-integration-by-parts
    name: Tabular Integration by Parts
    core: false                # shortcut subsumed by integration by parts
    difficulty: 0.65
    drill: false
    answer_kind: expression
    expected_time_secs: 180
    prerequisites:
      - id: integration-by-parts
        weight: 0.8
        key: true
      - id: derivatives-of-polynomials
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: Tabular method for polynomial times exponential
        key_prerequisites: [integration-by-parts]
        step_check:
          step: 'Multiply diagonally with alternating signs'
          question: 'Why do the signs in the table alternate $+, -, +, -$?'
          options:
            - 'The signs alternate because the derivatives of $x^3$ change their sign each time'
            - 'Each further use of parts subtracts the new leftover integral, so signs flip'
            - 'The signs alternate so that the last term of the table always has a plus sign'
          answer: 'Each further use of parts subtracts the new leftover integral, so signs flip'
          why: 'The parts formula is $\int u\,dv = uv - \int v\,du$, so each leftover integral enters with a minus sign. Repeating it flips the sign each time.'
        exemplars:
          - problem: 'Use the tabular method to evaluate $\int x^3 e^x \, dx$.'
            answer: '(x^3 - 3x^2 + 6x - 6)*e^x + C'
            answer_contract: {"kind": "function", "vars": ["x"], "up_to_constant": true}
            solution_sketch: 'The derivative column is $x^3, 3x^2, 6x, 6, 0$ and the integral column is $e^x$ in every row. Multiplying diagonally with signs $+, -, +, -$ gives $x^3e^x - 3x^2e^x + 6xe^x - 6e^x + C$. This equals $(x^3 - 3x^2 + 6x - 6)e^x + C$.'
          - problem: 'Use the tabular method to evaluate $\int x^2 e^{-x} \, dx$.'
            answer: '-(x^2 + 2x + 2)*e^(-x) + C'
            answer_contract: {"kind": "function", "vars": ["x"], "up_to_constant": true}
            solution_sketch: 'The derivative column is $x^2, 2x, 2, 0$ and the integral column is $-e^{-x}, e^{-x}, -e^{-x}$. Multiplying diagonally with signs $+, -, +$ gives $-x^2e^{-x} - 2xe^{-x} - 2e^{-x} + C$. This equals $-(x^2 + 2x + 2)e^{-x} + C$.'
          - problem: 'Use the tabular method to evaluate $\int (x^2 + x) e^x \, dx$.'
            answer: '(x^2 - x + 1)*e^x + C'
            answer_contract: {"kind": "function", "vars": ["x"], "up_to_constant": true}
            solution_sketch: 'The derivative column is $x^2 + x, 2x + 1, 2, 0$ and the integral column is $e^x$ in every row. Multiplying diagonally with signs $+, -, +$ gives $(x^2 + x)e^x - (2x + 1)e^x + 2e^x + C$. This equals $(x^2 - x + 1)e^x + C$.'
          - problem: 'Use the tabular method to evaluate $\int x^3 e^{2x} \, dx$.'
            answer: '(x^3/2 - 3x^2/4 + 3x/4 - 3/8)*e^(2x) + C'
            answer_contract: {"kind": "function", "vars": ["x"], "up_to_constant": true}
            solution_sketch: 'The derivative column is $x^3, 3x^2, 6x, 6, 0$ and the integral column is $\frac{e^{2x}}{2}, \frac{e^{2x}}{4}, \frac{e^{2x}}{8}, \frac{e^{2x}}{16}$. Multiplying diagonally with signs $+, -, +, -$ gives $e^{2x}\left(\frac{x^3}{2} - \frac{3x^2}{4} + \frac{3x}{4} - \frac{3}{8}\right) + C$.'
          - problem: 'Use the tabular method to evaluate $\int x^3 e^{-x} \, dx$.'
            answer: '-(x^3 + 3x^2 + 6x + 6)*e^(-x) + C'
            answer_contract: {"kind": "function", "vars": ["x"], "up_to_constant": true}
            solution_sketch: 'The derivative column is $x^3, 3x^2, 6x, 6, 0$ and the integral column is $-e^{-x}, e^{-x}, -e^{-x}, e^{-x}$. Multiplying diagonally with signs $+, -, +, -$ gives $-x^3e^{-x} - 3x^2e^{-x} - 6xe^{-x} - 6e^{-x} + C$. This equals $-(x^3 + 3x^2 + 6x + 6)e^{-x} + C$.'
          - problem: 'A particle has velocity $v(t) = t^2e^{t}$ metres per second and starts at position $s(0) = 0$. Use the tabular method to find its position $s(t)$ in metres.'
            answer: '(t^2 - 2t + 2)*e^t - 2'
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: 'The derivative column is $t^2, 2t, 2, 0$ and the integral column is $e^t$ in every row, so $\int t^2e^t\,dt = (t^2 - 2t + 2)e^t + K$. The condition $s(0) = 2 + K = 0$ gives $K = -2$. So $s(t) = (t^2 - 2t + 2)e^t - 2$.'
          - problem: 'Evaluate $\int_0^1 x^3 e^x \, dx$.'
            answer: '6 - 2*e'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The tabular method gives the antiderivative $(x^3 - 3x^2 + 6x - 6)e^x$. At $x = 1$ it equals $-2e$, and at $x = 0$ it equals $-6$. The value is $-2e - (-6) = 6 - 2e$.'
          - problem: 'The speed of a robot is $v(t) = t^2e^{t}$ metres per second for $0 \le t \le 2$ seconds. What is its average speed over this time interval?'
            answer: 'e^2 - 1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The average speed is the distance divided by the time $2$. The antiderivative $(t^2 - 2t + 2)e^t$ gives the distance $2e^2 - 2$ over $[0, 2]$, because it equals $2e^2$ at $t = 2$ and $2$ at $t = 0$. The average speed is $\frac{2e^2 - 2}{2} = e^2 - 1$ metres per second.'
          - problem: 'Sam uses a table for $\int x^2e^{2x}\,dx$ but writes every sign as plus, getting $\left(\frac{x^2}{2} + \frac{x}{2} + \frac{1}{4}\right)e^{2x} + C$. What is the correct antiderivative?'
            answer: '(x^2/2 - x/2 + 1/4)*e^(2x) + C'
            answer_contract: {"kind": "function", "vars": ["x"], "up_to_constant": true}
            solution_sketch: 'The derivative column is $x^2, 2x, 2, 0$ and the integral column is $\frac{e^{2x}}{2}, \frac{e^{2x}}{4}, \frac{e^{2x}}{8}$. The signs must alternate $+, -, +$, which gives $\left(\frac{x^2}{2} - \frac{x}{2} + \frac{1}{4}\right)e^{2x} + C$. Sam used $+$ for the middle term.'
        constraints: "polynomial of degree 2 or 3 times e^{ax} with a in {-1, 1, 2}, in a bare integral, a definite integral or a context; the derivative column must terminate at 0"
      - id: kp2
        name: Tabular method for polynomial times trig
        key_prerequisites: [integration-by-parts]
        step_check:
          step: 'differentiate repeatedly until you hit $0$'
          question: 'Why can the table stop once the derivative column reaches $0$?'
          options:
            - 'The integral column would run out of trig functions at that row'
            - 'The sine and cosine functions repeat after four rows, so the table must close'
            - 'Every further row would multiply by $0$, so the leftover integral is $0$'
          answer: 'Every further row would multiply by $0$, so the leftover integral is $0$'
          why: 'The last leftover integral has the derivative $0$ as its $du$, so it equals $0$. No more terms are needed and the answer is exact.'
        exemplars:
          - problem: 'Use the tabular method to evaluate $\int x^3 \cos x \, dx$.'
            answer: '(x^3 - 6x) sin x + (3x^2 - 6) cos x'
            answer_contract: {"kind": "function", "vars": ["x"], "up_to_constant": true}
            solution_sketch: 'The derivative column is $x^3, 3x^2, 6x, 6, 0$ and the integral column is $\sin x, -\cos x, -\sin x, \cos x$. Multiplying diagonally with signs $+, -, +, -$ gives $x^3\sin x + 3x^2\cos x - 6x\sin x - 6\cos x + C$.'
          - problem: 'Use the tabular method to evaluate $\int x^2 \cos x \, dx$.'
            answer: 'x^2*sin(x) + 2x*cos(x) - 2*sin(x) + C'
            answer_contract: {"kind": "function", "vars": ["x"], "up_to_constant": true}
            solution_sketch: 'The derivative column is $x^2, 2x, 2, 0$ and the integral column is $\sin x, -\cos x, -\sin x$. Multiplying diagonally with signs $+, -, +$ gives $x^2\sin x + 2x\cos x - 2\sin x + C$. Differentiating this recovers $x^2\cos x$.'
          - problem: 'Use the tabular method to evaluate $\int x^2 \sin 2x \, dx$.'
            answer: '-x^2*cos(2x)/2 + x*sin(2x)/2 + cos(2x)/4'
            answer_contract: {"kind": "function", "vars": ["x"], "up_to_constant": true}
            solution_sketch: 'The derivative column is $x^2, 2x, 2, 0$ and the integral column is $-\frac{\cos 2x}{2}, -\frac{\sin 2x}{4}, \frac{\cos 2x}{8}$. Multiplying diagonally with signs $+, -, +$ gives $-\frac{x^2\cos 2x}{2} + \frac{x\sin 2x}{2} + \frac{\cos 2x}{4} + C$.'
          - problem: 'Use the tabular method to evaluate $\int (x^2 + 1) \cos x \, dx$.'
            answer: '(x^2 - 1)*sin(x) + 2x*cos(x) + C'
            answer_contract: {"kind": "function", "vars": ["x"], "up_to_constant": true}
            solution_sketch: 'The derivative column is $x^2 + 1, 2x, 2, 0$ and the integral column is $\sin x, -\cos x, -\sin x$. Multiplying diagonally with signs $+, -, +$ gives $(x^2 + 1)\sin x + 2x\cos x - 2\sin x + C$. This equals $(x^2 - 1)\sin x + 2x\cos x + C$.'
          - problem: 'Use the tabular method to evaluate $\int (x^3 + x) \cos x \, dx$.'
            answer: '(x^3 - 5x) sin x + (3x^2 - 5) cos x'
            answer_contract: {"kind": "function", "vars": ["x"], "up_to_constant": true}
            solution_sketch: 'The derivative column is $x^3 + x, 3x^2 + 1, 6x, 6, 0$ and the integral column is $\sin x, -\cos x, -\sin x, \cos x$. Multiplying diagonally with signs $+, -, +, -$ gives $(x^3 + x)\sin x + (3x^2 + 1)\cos x - 6x\sin x - 6\cos x + C$. Grouping the terms gives $(x^3 - 5x)\sin x + (3x^2 - 5)\cos x + C$.'
          - problem: 'The current in a circuit is $i(t) = t^2\cos t$ amperes. Use the tabular method to find the charge $Q(t)$ that has passed by time $t$, given that $Q(0) = 0$.'
            answer: 't^2*sin(t) + 2t*cos(t) - 2*sin(t)'
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: 'The tabular method gives $\int t^2\cos t\,dt = t^2\sin t + 2t\cos t - 2\sin t + K$. At $t = 0$ every term is $0$, so $Q(0) = K = 0$. So $Q(t) = t^2\sin t + 2t\cos t - 2\sin t$.'
          - problem: 'Evaluate $\int_0^{\pi} x^2\cos x \, dx$.'
            answer: '-2*pi'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The tabular method gives the antiderivative $x^2\sin x + 2x\cos x - 2\sin x$. At $x = \pi$ it equals $0 - 2\pi - 0 = -2\pi$, and at $x = 0$ it equals $0$. The value is $-2\pi$.'
          - problem: 'A signal has strength $f(t) = t^2\cos t$ for $0 \le t \le \pi$. What is its average strength over this interval?'
            answer: '-2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The average is the integral divided by the length $\pi$. The integral is $-2\pi$, so the average is $\frac{-2\pi}{\pi} = -2$. The negative sign shows that the negative part of the signal is larger than the positive part.'
          - problem: 'Sam uses a table for $\int x^2\sin x\,dx$ and writes $-x^2\cos x - 2x\sin x - 2\cos x + C$. What is the correct antiderivative?'
            answer: '-x^2*cos(x) + 2x*sin(x) + 2*cos(x) + C'
            answer_contract: {"kind": "function", "vars": ["x"], "up_to_constant": true}
            solution_sketch: 'The derivative column is $x^2, 2x, 2, 0$ and the integral column is $-\cos x, -\sin x, \cos x$. The signs must alternate $+, -, +$, which gives $-x^2\cos x + 2x\sin x + 2\cos x + C$. Sam used $-$ for the middle term and the last term.'
        constraints: "polynomial of degree 2 or 3 times sin ax or cos ax with a in {1, 2}, in a bare integral, a definite integral or a context; coefficients stay small"
    diagnostic_exemplar:
      problem: 'Use the tabular method to evaluate $\int x^3 \sin x \, dx$.'
      answer: '$-x^3 \cos x + 3x^2 \sin x + 6x \cos x - 6\sin x + C$'
      solution_sketch: 'Derivatives $x^3, 3x^2, 6x, 6, 0$; integrals $-\cos x, -\sin x, \cos x, \sin x$; alternate signs and sum.'
    anki_seeds:
      - front: "Tabular integration by parts: what goes in the two columns?"
        back: "Left: successive derivatives of the polynomial (down to 0). Right: successive antiderivatives of the other factor. Multiply diagonally with alternating signs +, -, +, ..."
        type: basic
      - front: "When does the tabular method terminate?"
        back: "When the derivative column reaches 0 — so it needs a factor that differentiates to 0, i.e. a polynomial."
        type: basic

  - id: trig-integrals-odd-powers
    name: Trig Integrals with Odd Powers
    core: true
    difficulty: 0.58
    drill: false
    answer_kind: numeric
    expected_time_secs: 150
    prerequisites:
      - id: integration-substitution
        weight: 0.7
        key: true
      - id: trig-identities-basic
        weight: 0.6
        key: true
      - id: derivatives-trig
        weight: 0.5
    knowledge_points:
      - id: kp1
        name: One factor ready for substitution
        key_prerequisites: [integration-substitution, derivatives-trig]
        step_check:
          step: 'and $\cos x$ is the derivative of $\sin x$'
          question: 'Why does $u = \sin x$ work for the integrand $\sin^3 x\cos x$?'
          options:
            - 'The integrand contains the highest power of $\sin x$, and that choice always works'
            - 'The substitution turns $\sin^3 x$ into $u^3$, and $\cos x\,dx$ is just $du$'
            - 'The substitution removes $\cos x$ from the integrand, so that only $dx$ is left'
          answer: 'The substitution turns $\sin^3 x$ into $u^3$, and $\cos x\,dx$ is just $du$'
          why: 'A substitution works when the rest of the integrand is $du$. Here $du = \cos x\,dx$ uses the leftover factor, and $\int u^3\,du$ is a power rule.'
        exemplars:
          - problem: 'Evaluate $\int \sin^2 x \cos x \, dx$.'
            answer: 'sin(x)^3/3 + C'
            answer_contract: {"kind": "function", "vars": ["x"], "up_to_constant": true}
            solution_sketch: 'Let $u = \sin x$, so $du = \cos x\,dx$. The integral becomes $\int u^2\,du = \frac{u^3}{3} + C$. Substituting back gives $\frac{\sin^3 x}{3} + C$.'
          - problem: 'Evaluate $\int \cos^2 x \sin x \, dx$.'
            answer: '-cos(x)^3/3 + C'
            answer_contract: {"kind": "function", "vars": ["x"], "up_to_constant": true}
            solution_sketch: 'Let $u = \cos x$, so $du = -\sin x\,dx$ and $\sin x\,dx = -du$. The integral becomes $-\int u^2\,du = -\frac{u^3}{3} + C$. Substituting back gives $-\frac{\cos^3 x}{3} + C$.'
          - problem: 'Evaluate $\int \sin^3 x \cos x \, dx$.'
            answer: 'sin(x)^4/4 + C'
            answer_contract: {"kind": "function", "vars": ["x"], "up_to_constant": true}
            solution_sketch: 'Let $u = \sin x$, so $du = \cos x\,dx$. The integral becomes $\int u^3\,du = \frac{u^4}{4} + C$. Substituting back gives $\frac{\sin^4 x}{4} + C$.'
          - problem: 'Evaluate $\int_0^{\pi/2} \sin^4 x \cos x \, dx$.'
            answer: '1/5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Let $u = \sin x$, so $du = \cos x\,dx$. The limits $x = 0$ and $x = \frac{\pi}{2}$ become $u = 0$ and $u = 1$. Then $\int_0^1 u^4\,du = \frac{1}{5}$.'
          - problem: 'A particle has velocity $v(t) = \cos^2 t\,\sin t$ metres per second and starts at position $s(0) = 1$ metre. Find its position $s(t)$ in metres.'
            answer: '4/3 - cos(t)^3/3'
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: 'Let $u = \cos t$, so $\int \cos^2 t\sin t\,dt = -\frac{\cos^3 t}{3} + K$. The condition $s(0) = -\frac{1}{3} + K = 1$ gives $K = \frac{4}{3}$. So $s(t) = \frac{4}{3} - \frac{\cos^3 t}{3}$.'
          - problem: 'Evaluate $\int_0^{\pi/2} \cos^3 x \sin x \, dx$.'
            answer: '1/4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Let $u = \cos x$, so $du = -\sin x\,dx$. The limits become $u = 1$ and $u = 0$, so the integral is $-\int_1^0 u^3\,du = \int_0^1 u^3\,du = \frac{1}{4}$.'
          - problem: 'Sam finds $\int \cos^4 x \sin x\,dx$ and writes $\frac{\cos^5 x}{5} + C$. What is the correct antiderivative?'
            answer: '-cos(x)^5/5 + C'
            answer_contract: {"kind": "function", "vars": ["x"], "up_to_constant": true}
            solution_sketch: 'Let $u = \cos x$, so $du = -\sin x\,dx$ and $\sin x\,dx = -du$. The integral becomes $-\int u^4\,du = -\frac{u^5}{5} + C$. Sam lost the minus sign. Differentiating $\frac{\cos^5 x}{5}$ gives $-\cos^4 x\sin x$, the opposite of the integrand.'
          - problem: 'The strength of a signal is $f(t) = \sin^2 t\cos t$ for $0 \le t \le \frac{\pi}{2}$. What is its average strength over this interval?'
            answer: '2/(3*pi)'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The average is the integral divided by the length $\frac{\pi}{2}$. With $u = \sin t$, the integral is $\int_0^1 u^2\,du = \frac{1}{3}$. The average is $\frac{1/3}{\pi/2} = \frac{2}{3\pi}$.'
        constraints: "integrand is sin^m x cos x or cos^n x sin x with m, n <= 4, in a bare integral, a definite integral or a context; single one-step u-substitution"
      - id: kp2
        name: Splitting off one factor from an odd power
        key_prerequisites: [trig-identities-basic, integration-substitution]
        step_check:
          step: 'replace $\cos^2 x$ using $\cos^2 x = 1 - \sin^2 x$'
          question: 'Why is $\cos^2 x$ rewritten with $\cos^2 x = 1 - \sin^2 x$ here?'
          options:
            - 'The substitution $u = \sin x$ needs all other factors written with $\sin x$'
            - 'The identity makes the integrand shorter, and a shorter integrand is always easier'
            - 'The identity turns $\cos^2 x$ into a constant, so the integral becomes a power rule'
          answer: 'The substitution $u = \sin x$ needs all other factors written with $\sin x$'
          why: 'After $\cos x\,dx$ is set aside as $du$, all that remains must be a function of $u = \sin x$. The identity does exactly that for the even power.'
        try_first:
          problem: 'Evaluate $\int_0^{\pi/2} \cos^3 x \, dx$.'
          answer_contract: {"kind": "exact"}
          answer: '2/3'
          reveal: 'Set aside one $\cos x$ and write $\cos^2 x = 1 - \sin^2 x$. With $u = \sin x$ the integral becomes $\int_0^1 (1 - u^2)\,du = 1 - \frac{1}{3} = \frac{2}{3}$.'
        exemplars:
          - problem: 'Evaluate $\int \sin^3 x \, dx$.'
            answer: '-cos(x) + cos(x)^3/3 + C'
            answer_contract: {"kind": "function", "vars": ["x"], "up_to_constant": true}
            solution_sketch: 'Set aside one factor $\sin x$ and write $\sin^2 x = 1 - \cos^2 x$, so $\sin^3 x = (1 - \cos^2 x)\sin x$. With $u = \cos x$ and $du = -\sin x\,dx$ the integral is $-\int (1 - u^2)\,du = -u + \frac{u^3}{3} + C$. So the result is $-\cos x + \frac{\cos^3 x}{3} + C$.'
          - problem: 'Evaluate $\int \cos^3 x \, dx$.'
            answer: 'sin(x) - sin(x)^3/3 + C'
            answer_contract: {"kind": "function", "vars": ["x"], "up_to_constant": true}
            solution_sketch: 'Set aside one factor $\cos x$ and write $\cos^2 x = 1 - \sin^2 x$, so $\cos^3 x = (1 - \sin^2 x)\cos x$. With $u = \sin x$ and $du = \cos x\,dx$ the integral is $\int (1 - u^2)\,du = u - \frac{u^3}{3} + C$. So the result is $\sin x - \frac{\sin^3 x}{3} + C$.'
          - problem: 'Evaluate $\int \sin^5 x \, dx$.'
            answer: '-cos(x) + 2cos(x)^3/3 - cos(x)^5/5 + C'
            answer_contract: {"kind": "function", "vars": ["x"], "up_to_constant": true}
            solution_sketch: 'Write $\sin^5 x = (1 - \cos^2 x)^2\sin x$. With $u = \cos x$ and $du = -\sin x\,dx$ the integral is $-\int (1 - 2u^2 + u^4)\,du = -u + \frac{2u^3}{3} - \frac{u^5}{5} + C$. So the result is $-\cos x + \frac{2\cos^3 x}{3} - \frac{\cos^5 x}{5} + C$.'
          - problem: 'Evaluate $\int \sin x \cos^3 x \, dx$.'
            answer: '-cos(x)^4/4 + C'
            answer_contract: {"kind": "function", "vars": ["x"], "up_to_constant": true}
            solution_sketch: 'The factor $\sin x\,dx$ is already $-du$ for $u = \cos x$, so no identity is needed. The integral becomes $-\int u^3\,du = -\frac{u^4}{4} + C$. So the result is $-\frac{\cos^4 x}{4} + C$.'
          - problem: 'Evaluate $\int \cos^5 x \, dx$.'
            answer: 'sin(x) - 2sin(x)^3/3 + sin(x)^5/5 + C'
            answer_contract: {"kind": "function", "vars": ["x"], "up_to_constant": true}
            solution_sketch: 'Write $\cos^5 x = (1 - \sin^2 x)^2\cos x$. With $u = \sin x$ and $du = \cos x\,dx$ the integral is $\int (1 - 2u^2 + u^4)\,du = u - \frac{2u^3}{3} + \frac{u^5}{5} + C$. So the result is $\sin x - \frac{2\sin^3 x}{3} + \frac{\sin^5 x}{5} + C$.'
          - problem: 'Find the area of the region under $y = \sin^3 x$ from $x = 0$ to $x = \pi$.'
            answer: '4/3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The curve lies above the $x$-axis on this interval, so the area is $\int_0^\pi \sin^3 x\,dx$. An antiderivative is $-\cos x + \frac{\cos^3 x}{3}$. At $x = \pi$ it equals $1 - \frac{1}{3} = \frac{2}{3}$, and at $x = 0$ it equals $-\frac{2}{3}$, so the area is $\frac{4}{3}$.'
          - problem: 'Evaluate $\int_0^{\pi/2} \sin^3 x \cos^3 x \, dx$.'
            answer: '1/12'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Set aside one $\cos x$ and write $\cos^2 x = 1 - \sin^2 x$. With $u = \sin x$ the limits become $u = 0$ and $u = 1$, and the integral is $\int_0^1 u^3(1 - u^2)\,du = \frac{1}{4} - \frac{1}{6} = \frac{1}{12}$.'
          - problem: 'The height of a wave is $h(x) = \sin^3 x$ metres for $0 \le x \le \frac{\pi}{2}$ metres. What is its average height over this stretch?'
            answer: '4/(3*pi)'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The average is the integral divided by the length $\frac{\pi}{2}$. The integral of $\sin^3 x$ over $[0, \frac{\pi}{2}]$ is $\frac{2}{3}$, because $-\cos x + \frac{\cos^3 x}{3}$ goes from $-\frac{2}{3}$ to $0$. The average is $\frac{2/3}{\pi/2} = \frac{4}{3\pi}$ metres.'
          - problem: 'Sam evaluates $\int \sin^3 x\cos^2 x\,dx$ by writing $\sin^3 x = (1 + \cos^2 x)\sin x$ and gets $-\frac{\cos^3 x}{3} - \frac{\cos^5 x}{5} + C$. What is the correct antiderivative?'
            answer: 'cos(x)^5/5 - cos(x)^3/3 + C'
            answer_contract: {"kind": "function", "vars": ["x"], "up_to_constant": true}
            solution_sketch: 'The identity is $\sin^2 x = 1 - \cos^2 x$, not $1 + \cos^2 x$. So the integrand is $(1 - \cos^2 x)\cos^2 x\sin x$, and with $u = \cos x$ the integral is $-\int (u^2 - u^4)\,du = -\frac{u^3}{3} + \frac{u^5}{5} + C$. The result is $\frac{\cos^5 x}{5} - \frac{\cos^3 x}{3} + C$.'
        constraints: "sin^m x cos^n x with at least one of m, n odd and both <= 5, in a bare integral, a definite integral or a context; save one factor from the odd power, convert the rest via sin^2 + cos^2 = 1"
    diagnostic_exemplar:
      problem: 'Evaluate $\int \cos^3 x \sin^2 x \, dx$.'
      answer: '$\frac{\sin^3 x}{3} - \frac{\sin^5 x}{5} + C$'
      solution_sketch: '$\cos^3 x \sin^2 x = (1 - \sin^2 x)\sin^2 x \cos x$; $u = \sin x$ gives $\int (u^2 - u^4)\,du$.'
    anki_seeds:
      - front: "Odd power of sine in an integrand: what's the move?"
        back: 'Save one factor of $\sin x$, convert the rest with $\sin^2 x = 1 - \cos^2 x$, substitute $u = \cos x$.'
        type: basic
      - front: "Odd power of cosine in an integrand: what's the move?"
        back: 'Save one factor of $\cos x$, convert the rest with $\cos^2 x = 1 - \sin^2 x$, substitute $u = \sin x$.'
        type: basic

  - id: tangent-secant-integrals
    name: Tangent and Secant Integrals
    core: true
    difficulty: 0.62
    drill: false
    answer_kind: numeric
    expected_time_secs: 180
    prerequisites:
      - id: integration-substitution
        weight: 0.7
        key: true
      - id: derivatives-trig
        weight: 0.5
        key: true
      - id: reciprocal-trig-functions
        weight: 0.4
      - id: trig-integrals-odd-powers
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: The basic tan, cot, sec, and csc integrals
        key_prerequisites: [integration-substitution, derivatives-trig]
        step_check:
          step: 'multiply and divide by $\sec 4x + \tan 4x$'
          question: 'Why do we multiply and divide by $\sec 4x + \tan 4x$ in this step?'
          options:
            - 'It turns $\sec 4x$ into a sine, which is then easy to integrate directly'
            - 'The numerator becomes a constant multiple of the derivative of the denominator'
            - 'Multiplying by a fraction equal to $1$ lowers the power of the whole integrand'
            - 'It removes the factor $4$ from the argument, so no rescaling is needed'
          answer: 'The numerator becomes a constant multiple of the derivative of the denominator'
          why: 'The numerator $\sec 4x(\sec 4x + \tan 4x)$ is $\frac{1}{4}$ of the derivative of the denominator. So with $u$ equal to the denominator, the integral is $\frac{1}{4}\int \frac{du}{u}$.'
        try_first:
          problem: 'Let $F(x) = \ln|\sec x + \tan x|$. Find $F''(\pi/3)$.'
          answer_contract: {"kind": "exact"}
          answer: '2'
          reveal: 'The derivative of $F$ is $\sec x$, so $F$ is an antiderivative of $\sec x$. The multiplying trick of this lesson is a way to find such an $F$ when nobody gives it.'
        exemplars:
          - problem: 'Evaluate $\int \tan x\,dx$ for $0 < x < \frac{\pi}{2}$.'
            answer: '-ln(cos(x)) + C'
            answer_contract: {"kind": "function", "vars": ["x"], "up_to_constant": true, "domain": {"x": ["1/10", "1"]}}
            solution_sketch: 'Write $\tan x = \frac{\sin x}{\cos x}$ and let $u = \cos x$, so $du = -\sin x\,dx$. The integral becomes $-\int \frac{du}{u} = -\ln|u| + C$. On this interval $\cos x > 0$, so the answer is $-\ln(\cos x) + C$, which equals $\ln(\sec x) + C$.'
          - problem: 'Find $\int \cot x\,dx$ for $0 < x < \pi$.'
            answer: 'ln(sin(x)) + C'
            answer_contract: {"kind": "function", "vars": ["x"], "up_to_constant": true, "domain": {"x": ["1/10", "3"]}}
            solution_sketch: 'Write $\cot x = \frac{\cos x}{\sin x}$ and let $u = \sin x$, so $du = \cos x\,dx$. The integral becomes $\int \frac{du}{u} = \ln|u| + C$. On this interval $\sin x > 0$, so the answer is $\ln(\sin x) + C$.'
          - problem: 'Find $\int \sec 2x\,dx$ for $0 < x < \frac{\pi}{4}$.'
            answer: '(1/2)ln(sec(2x)+tan(2x)) + C'
            answer_contract: {"kind": "function", "vars": ["x"], "up_to_constant": true, "domain": {"x": ["1/10", "1/2"]}}
            solution_sketch: 'Let $w = 2x$, so $dx = \frac{1}{2}\,dw$. Then $\int \sec w\,dw = \ln|\sec w + \tan w|$, and the factor $\frac{1}{2}$ stays in front. Putting back $w = 2x$ gives $\frac{1}{2}\ln(\sec 2x + \tan 2x) + C$, because both functions are positive here.'
          - problem: 'Evaluate $\int_0^{\pi/4} \tan x\,dx$.'
            answer: 'ln(2)/2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'An antiderivative of $\tan x$ is $-\ln(\cos x)$. At $x = \frac{\pi}{4}$ it is $-\ln\frac{\sqrt{2}}{2} = \frac{1}{2}\ln 2$, and at $x = 0$ it is $0$. The value of the integral is $\frac{\ln 2}{2}$.'
          - problem: 'Evaluate $\int_{\pi/3}^{\pi/2} \csc x\,dx$.'
            answer: 'ln(3)/2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'An antiderivative of $\csc x$ is $\ln|\csc x - \cot x|$. At $x = \frac{\pi}{2}$ it is $\ln(1 - 0) = 0$, and at $x = \frac{\pi}{3}$ it is $\ln\left(\frac{2}{\sqrt{3}} - \frac{1}{\sqrt{3}}\right) = -\frac{1}{2}\ln 3$. The difference is $\frac{\ln 3}{2}$.'
          - problem: 'A ramp has slope $\tan x$ at a horizontal distance of $x$ metres from its start, for $0 \le x \le \frac{\pi}{4}$. Find the average slope of the ramp over this stretch.'
            answer: '2*ln(2)/pi'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The average value is the integral divided by the length $\frac{\pi}{4}$ of the interval. The integral of $\tan x$ over the interval is $\frac{\ln 2}{2}$. Dividing gives $\frac{\ln 2}{2} \cdot \frac{4}{\pi} = \frac{2\ln 2}{\pi}$.'
          - problem: 'Find the area of the region bounded by $y = \cot x$, the $x$-axis, and the lines $x = \frac{\pi}{6}$ and $x = \frac{\pi}{2}$.'
            answer: 'ln(2)'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The curve lies above the $x$-axis on this interval, so the area is $\int_{\pi/6}^{\pi/2} \cot x\,dx$. An antiderivative is $\ln(\sin x)$. At $x = \frac{\pi}{2}$ it is $0$ and at $x = \frac{\pi}{6}$ it is $\ln\frac{1}{2}$, so the area is $\ln 2$.'
          - problem: 'The integral $\int_0^b \sec x\,dx$ with $0 < b < \frac{\pi}{2}$ equals $\ln(2 + \sqrt{3})$. Find $b$.'
            answer: 'pi/3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The integral equals $\ln(\sec b + \tan b)$, so $\sec b + \tan b = 2 + \sqrt{3}$. At $b = \frac{\pi}{3}$ we have $\sec b = 2$ and $\tan b = \sqrt{3}$, and their sum is $2 + \sqrt{3}$. The sum $\sec b + \tan b$ increases on the interval, so $b = \frac{\pi}{3}$ is the only solution.'
          - problem: 'A drone flies along a straight line with velocity $v(t) = \sec t$ metres per second for $0 \le t \le \frac{\pi}{4}$ seconds. How far does it travel in this time, to two decimal places?'
            answer: '0.88'
            answer_contract: {"kind": "approx", "decimals": 2}
            solution_sketch: 'The distance is $\int_0^{\pi/4} \sec t\,dt = \ln(\sec t + \tan t)\Big|_0^{\pi/4} = \ln(\sqrt{2} + 1)$. This is about $0.8814$, so the drone travels about $0.88$ metres.'
          - problem: 'Sam writes $\int \tan 3x\,dx = -\ln(\cos 3x) + C$. Differentiate to check this, then find the correct antiderivative for $0 < x < \frac{\pi}{6}$.'
            answer: '-ln(cos(3x))/3 + C'
            answer_contract: {"kind": "function", "vars": ["x"], "up_to_constant": true, "domain": {"x": ["1/10", "1/2"]}}
            solution_sketch: 'Differentiating Sam''s answer gives $3\tan 3x$, which is $3$ times too large. With $u = 3x$ we have $dx = \frac{1}{3}\,du$, so the factor $\frac{1}{3}$ belongs in front of the logarithm. The correct antiderivative is $-\frac{1}{3}\ln(\cos 3x) + C$.'
          - problem: 'Evaluate $\int_0^{\pi/8} \tan 2x\,dx$.'
            answer: 'ln(2)/4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Let $u = 2x$, so $dx = \frac{1}{2}\,du$ and $u$ runs from $0$ to $\frac{\pi}{4}$. The integral becomes $\frac{1}{2}\int_0^{\pi/4} \tan u\,du = \frac{1}{2} \cdot \frac{\ln 2}{2}$. The value is $\frac{\ln 2}{4}$.'
        constraints: 'the four basic quotient integrals (tan, cot, sec, csc), also with a linear argument such as sec 2x; logarithm answers, with the interval named so the logarithm is defined'
      - id: kp2
        name: Powers via sec^2 = 1 + tan^2
        key_prerequisites: [trig-integrals-odd-powers, derivatives-trig]
        step_check:
          step: 'split $\sec^4 x = \sec^2 x \cdot \sec^2 x$'
          question: 'Why does the rewrite keep one factor of $\sec^2 x$ untouched?'
          options:
            - 'The identity $\sec^2 x = 1 + \tan^2 x$ can be used on one factor only'
            - 'Keeping it makes the power of $\sec x$ even, so no substitution is needed'
            - 'Replacing both factors would change the value of the integral'
            - 'It is needed as $du$, because the derivative of $\tan x$ is $\sec^2 x$'
          answer: 'It is needed as $du$, because the derivative of $\tan x$ is $\sec^2 x$'
          why: 'With $u = \tan x$ we get $du = \sec^2 x\,dx$, so one factor $\sec^2 x$ must stay beside $dx$. The other factor becomes $1 + u^2$.'
        exemplars:
          - problem: 'Evaluate $\int \tan^2 x\,dx$.'
            answer: 'tan(x) - x + C'
            answer_contract: {"kind": "function", "vars": ["x"], "up_to_constant": true, "domain": {"x": ["1/10", "1"]}}
            solution_sketch: 'Use $\tan^2 x = \sec^2 x - 1$. The integral of $\sec^2 x$ is $\tan x$, and the integral of $1$ is $x$. So the answer is $\tan x - x + C$.'
          - problem: 'Evaluate $\int \sec^4 x\,dx$.'
            answer: 'tan(x) + tan(x)^3/3 + C'
            answer_contract: {"kind": "function", "vars": ["x"], "up_to_constant": true, "domain": {"x": ["1/10", "1"]}}
            solution_sketch: 'Write $\sec^4 x = (1 + \tan^2 x)\sec^2 x$ and let $u = \tan x$, so $du = \sec^2 x\,dx$. The integral becomes $\int (1 + u^2)\,du = u + \frac{u^3}{3}$. The answer is $\tan x + \frac{\tan^3 x}{3} + C$.'
          - problem: 'Find the value of $\int_0^{\pi/4} \tan^2 x\,dx$.'
            answer: '1 - pi/4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'An antiderivative of $\tan^2 x$ is $\tan x - x$. At $x = \frac{\pi}{4}$ it is $1 - \frac{\pi}{4}$, and at $x = 0$ it is $0$. The value is $1 - \frac{\pi}{4}$.'
          - problem: 'Evaluate $\int \tan^3 x\,dx$ for $0 < x < \frac{\pi}{2}$.'
            answer: 'tan(x)^2/2 + ln(cos(x)) + C'
            answer_contract: {"kind": "function", "vars": ["x"], "up_to_constant": true, "domain": {"x": ["1/10", "1"]}}
            solution_sketch: 'Write $\tan^3 x = \tan x(\sec^2 x - 1) = \tan x\sec^2 x - \tan x$. The first piece, with $u = \tan x$, gives $\frac{\tan^2 x}{2}$. The second piece gives $-\int \tan x\,dx = \ln(\cos x)$, so the answer is $\frac{\tan^2 x}{2} + \ln(\cos x) + C$.'
          - problem: 'Evaluate $\int_0^{\pi/4} \sec^4 x\,dx$.'
            answer: '4/3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'An antiderivative is $\tan x + \frac{\tan^3 x}{3}$. At $x = \frac{\pi}{4}$ the tangent is $1$, so the value is $1 + \frac{1}{3}$. At $x = 0$ the value is $0$, so the integral is $\frac{4}{3}$.'
          - problem: 'The region under $y = \tan x$ from $x = 0$ to $x = \frac{\pi}{4}$ is rotated about the $x$-axis. Find the volume of the solid.'
            answer: 'pi - pi^2/4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'By the disk method the volume is $\pi\int_0^{\pi/4} \tan^2 x\,dx$. The integral equals $1 - \frac{\pi}{4}$, so the volume is $\pi\left(1 - \frac{\pi}{4}\right) = \pi - \frac{\pi^2}{4}$ cubic units.'
          - problem: 'A signal has power $\tan^2 t$ watts at time $t$ seconds, for $0 \le t \le \frac{\pi}{4}$. Find the average power over this interval.'
            answer: '4/pi - 1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The average is the total $\int_0^{\pi/4} \tan^2 t\,dt = 1 - \frac{\pi}{4}$ divided by the length $\frac{\pi}{4}$. So the average is $\frac{4}{\pi}\left(1 - \frac{\pi}{4}\right) = \frac{4}{\pi} - 1$ watts.'
          - problem: 'Sam says $\int \tan^4 x\,dx = \frac{\tan^5 x}{5} + C$. Find the correct antiderivative for $0 < x < \frac{\pi}{2}$.'
            answer: 'tan(x)^3/3 - tan(x) + x + C'
            answer_contract: {"kind": "function", "vars": ["x"], "up_to_constant": true, "domain": {"x": ["1/10", "1"]}}
            solution_sketch: 'Sam used the power rule as if $\tan x$ were the variable, but the derivative of $\tan x$ is not $1$. Write $\tan^4 x = \tan^2 x(\sec^2 x - 1)$ and split it. The first piece gives $\frac{\tan^3 x}{3}$, and the second piece gives $-\int \tan^2 x\,dx = -\tan x + x$.'
          - problem: 'Evaluate $\int \sec^6 x\,dx$.'
            answer: 'tan(x) + 2*tan(x)^3/3 + tan(x)^5/5 + C'
            answer_contract: {"kind": "function", "vars": ["x"], "up_to_constant": true, "domain": {"x": ["1/10", "1"]}}
            solution_sketch: 'Write $\sec^6 x = (1 + \tan^2 x)^2\sec^2 x$ and let $u = \tan x$. The integral becomes $\int (1 + 2u^2 + u^4)\,du = u + \frac{2u^3}{3} + \frac{u^5}{5}$. Back-substituting gives the answer $\tan x + \frac{2\tan^3 x}{3} + \frac{\tan^5 x}{5} + C$.'
        constraints: 'powers of tan up to 4, powers of sec up to 6; use sec^2 = 1 + tan^2 to peel off a sec^2 or to convert tan^2; the interval is named when a logarithm appears'
      - id: kp3
        name: Products of tangents and secants
        key_prerequisites: [integration-substitution, derivatives-trig]
        step_check:
          step: 'the power of tangent is odd, so peel off one factor of $\sec x \tan x$ and let $u = \sec x$'
          question: 'Why does an odd power of $\tan x$ lead to the substitution $u = \sec x$?'
          options:
            - 'The factor $\sec x \tan x\,dx$ is exactly $du$, and the tangents left are even'
            - 'Odd powers of $\tan x$ always integrate straight to a power of $\sec x$ with no work'
            - 'The substitution $u = \sec x$ removes every factor $\tan x$ from the integrand at once'
            - 'The derivative of $\sec x$ is $\sec^2 x$, which is already in the integrand'
          answer: 'The factor $\sec x \tan x\,dx$ is exactly $du$, and the tangents left are even'
          why: 'The derivative of $\sec x$ is $\sec x \tan x$, so that factor becomes $du$. The even power of tangent left over is rewritten with $\tan^2 x = \sec^2 x - 1$, giving a polynomial in $u$.'
        exemplars:
          - problem: 'Evaluate $\int \tan^3 x \sec x\,dx$ for $0 < x < \frac{\pi}{2}$.'
            answer: 'sec(x)^3/3 - sec(x) + C'
            answer_contract: {"kind": "function", "vars": ["x"], "up_to_constant": true, "domain": {"x": ["1/10", "1"]}}
            solution_sketch: 'The power of tangent is odd, so save $\sec x \tan x\,dx = du$ with $u = \sec x$. Then $\tan^2 x = u^2 - 1$ and the integral is $\int (u^2 - 1)\,du = \frac{u^3}{3} - u$. The answer is $\frac{\sec^3 x}{3} - \sec x + C$.'
          - problem: 'Evaluate $\int \tan^3 x \sec^4 x\,dx$ for $0 < x < \frac{\pi}{2}$.'
            answer: 'tan(x)^4/4 + tan(x)^6/6 + C'
            answer_contract: {"kind": "function", "vars": ["x"], "up_to_constant": true, "domain": {"x": ["1/10", "1"]}}
            solution_sketch: 'The power of secant is even, so save $\sec^2 x\,dx = du$ with $u = \tan x$. The other $\sec^2 x$ becomes $1 + u^2$, and the integral is $\int u^3(1 + u^2)\,du = \frac{u^4}{4} + \frac{u^6}{6}$. The answer is $\frac{\tan^4 x}{4} + \frac{\tan^6 x}{6} + C$.'
          - problem: 'Find $\int \tan^5 x \sec^3 x\,dx$ for $0 < x < \frac{\pi}{2}$.'
            answer: 'sec(x)^7/7 - 2sec(x)^5/5 + sec(x)^3/3'
            answer_contract: {"kind": "function", "vars": ["x"], "up_to_constant": true, "domain": {"x": ["1/10", "1"]}}
            solution_sketch: 'The power of tangent is odd, so save $\sec x \tan x\,dx = du$ with $u = \sec x$. Then $\tan^4 x = (u^2 - 1)^2$ and the integral is $\int (u^2 - 1)^2 u^2\,du = \int (u^6 - 2u^4 + u^2)\,du$. The answer is $\frac{\sec^7 x}{7} - \frac{2\sec^5 x}{5} + \frac{\sec^3 x}{3} + C$.'
          - problem: 'Evaluate $\int_0^{\pi/3} \tan^3 x \sec x\,dx$.'
            answer: '4/3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Let $u = \sec x$, so $du = \sec x \tan x\,dx$, and the bounds become $u = 1$ and $u = 2$. The integral is $\int_1^2 (u^2 - 1)\,du = \left(\frac{8}{3} - 2\right) - \left(\frac{1}{3} - 1\right)$. The value is $\frac{4}{3}$.'
          - problem: 'Evaluate $\int_0^{\pi/4} \tan^2 x \sec^4 x\,dx$.'
            answer: '8/15'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Let $u = \tan x$, so $du = \sec^2 x\,dx$ and $u$ runs from $0$ to $1$. The integral is $\int_0^1 u^2(1 + u^2)\,du = \frac{1}{3} + \frac{1}{5}$. The value is $\frac{8}{15}$.'
          - problem: 'A cart moves along a track with velocity $v(t) = \tan t \sec^2 t$ metres per second. How far does it move between $t = 0$ and $t = \frac{\pi}{4}$ seconds?'
            answer: '1/2'
            answer_contract: {"kind": "unit", "quantity": "length", "unit": "m", "allow_omitted": true}
            solution_sketch: 'The distance is $\int_0^{\pi/4} \tan t \sec^2 t\,dt$. With $u = \tan t$ and $du = \sec^2 t\,dt$ this is $\int_0^1 u\,du = \frac{1}{2}$. The cart moves $\frac{1}{2}$ metre.'
          - problem: 'The height of a hill profile is modelled by $h(x) = \tan^3 x \sec x$ metres for $0 \le x \le \frac{\pi}{3}$. Find the average height.'
            answer: '4/pi'
            answer_contract: {"kind": "unit", "quantity": "length", "unit": "m", "allow_omitted": true}
            solution_sketch: 'The integral of $h$ over the interval is $\frac{4}{3}$. The average is this integral divided by the length $\frac{\pi}{3}$ of the interval. So the average height is $\frac{4}{3} \cdot \frac{3}{\pi} = \frac{4}{\pi}$ metres.'
          - problem: 'Sam finds $\int \tan x \sec^2 x\,dx = \frac{\tan^2 x}{2} + C$. Ana substitutes $u = \sec x$ and finds $\frac{\sec^2 x}{2} + C$. Can both answers be correct?'
            answer: 'yes'
            answer_contract: {"kind": "label", "options": [["yes", "both can be correct", "both are correct", "it is possible", "yes, both are correct", "yes, both can be correct", "both correct"], ["no", "only one is correct", "they cannot both be correct", "no, only one is correct"]]}
            solution_sketch: 'The two answers differ by $\frac{\sec^2 x - \tan^2 x}{2} = \frac{1}{2}$, which is a constant. Two antiderivatives of the same function always differ by a constant, so both answers are correct.'
          - problem: 'Evaluate $\int_0^{\pi/4} \tan x \sec^3 x\,dx$.'
            answer: '(2*sqrt(2) - 1)/3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The power of tangent is odd, so let $u = \sec x$ with $du = \sec x \tan x\,dx$. The bounds become $u = 1$ and $u = \sqrt{2}$, and the integral is $\int_1^{\sqrt{2}} u^2\,du = \frac{u^3}{3}$. The value is $\frac{2\sqrt{2} - 1}{3}$.'
        constraints: 'products tan^m x sec^n x with n even (save sec^2, u = tan x) or m odd (save sec x tan x, u = sec x); definite versions with new bounds; powers of sec up to 5'
    diagnostic_exemplar:
      problem: 'Evaluate $\int \tan^3 x \sec^3 x \, dx$.'
      answer: '$\frac{\sec^5 x}{5} - \frac{\sec^3 x}{3} + C$'
      solution_sketch: 'Split off $\sec x\tan x\,dx$ and use $\tan^2 x = \sec^2 x - 1$: with $u = \sec x$ the integral is $\int (u^2 - 1)u^2\,du$.'
    anki_seeds:
      - front: '$\int \tan x \, dx = $ ?'
        back: '$\ln|\sec x| + C$ (equivalently $-\ln|\cos x| + C$)'
        type: basic
      - front: '$\int \sec x \, dx = $ ?'
        back: '$\ln|\sec x + \tan x| + C$'
        type: basic
      - front: "Product tan^m x sec^n x with n even: what's the substitution?"
        back: 'Save a factor of $\sec^2 x$, convert the rest to tangents, substitute $u = \tan x$.'
        type: basic

  - id: trigonometric-integrals
    name: Trigonometric Integrals
    core: true
    difficulty: 0.65
    drill: false
    answer_kind: expression
    expected_time_secs: 180
    prerequisites:
      - id: trig-integrals-odd-powers
        weight: 0.7
        key: true
      - id: double-half-angle-identities
        weight: 0.7
        key: true
      # Phase C (gap I-1, Wave-2 edge): the identities kp2 rests on are now taught
      # in precalculus (product-to-sum-identities) instead of being handed to the
      # learner in the problem stem. Key moved here from trig-identities-basic
      # (which stays as background algebra) to hold the 3-key cap.
      - id: product-to-sum-identities
        weight: 0.6
        key: true
      - id: trig-identities-basic
        weight: 0.6
      - id: tangent-secant-integrals
        weight: 0.5
      - id: integration-substitution
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: Even powers via half-angle identities
        key_prerequisites: [double-half-angle-identities, integration-substitution]
        step_check:
          step: 'the integrand is an even power of cosine'
          question: 'Why does an even power of cosine call for a half-angle identity?'
          options:
            - 'Even powers of cosine are always equal to $1$ on every interval of integration'
            - 'The half-angle identity gives the integral of $\cos^2 x$ directly, with no further steps'
            - 'Splitting off one cosine leaves a lone cosine that cannot be written with sines'
            - 'A substitution $u = \cos x$ works only when the power of cosine is an even number'
          answer: 'Splitting off one cosine leaves a lone cosine that cannot be written with sines'
          why: 'With $\cos^2 x$ the leftover factor is a single $\cos x$, which sine cannot replace. The identity $\cos^2 x = \frac{1 + \cos 2x}{2}$ lowers the power, and the new terms are easy to integrate.'
        exemplars:
          - problem: 'Evaluate $\int \sin^2 x\,dx$.'
            answer: 'x/2 - sin(2x)/4 + C'
            answer_contract: {"kind": "function", "vars": ["x"], "up_to_constant": true}
            solution_sketch: 'Use $\sin^2 x = \frac{1 - \cos 2x}{2}$. The integral of $\frac{1}{2}$ is $\frac{x}{2}$, and the integral of $-\frac{\cos 2x}{2}$ is $-\frac{\sin 2x}{4}$. The answer is $\frac{x}{2} - \frac{\sin 2x}{4} + C$.'
          - problem: 'Evaluate $\int_0^{\pi} \cos^2 x\,dx$.'
            answer: 'pi/2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Use $\cos^2 x = \frac{1 + \cos 2x}{2}$, which has the antiderivative $\frac{x}{2} + \frac{\sin 2x}{4}$. At $x = \pi$ this is $\frac{\pi}{2}$, and at $x = 0$ it is $0$. The value is $\frac{\pi}{2}$.'
          - problem: 'Find $\int \sin^2 x \cos^2 x\,dx$.'
            answer: 'x/8 - sin(4x)/32 + C'
            answer_contract: {"kind": "function", "vars": ["x"], "up_to_constant": true}
            solution_sketch: 'Since $\sin x \cos x = \frac{\sin 2x}{2}$, the integrand is $\frac{\sin^2 2x}{4} = \frac{1 - \cos 4x}{8}$. Integrating term by term gives $\frac{x}{8} - \frac{\sin 4x}{32} + C$.'
          - problem: 'Evaluate $\int_0^{\pi/4} \sin^2 2x\,dx$.'
            answer: 'pi/8'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Use $\sin^2 2x = \frac{1 - \cos 4x}{2}$, which has the antiderivative $\frac{x}{2} - \frac{\sin 4x}{8}$. At $x = \frac{\pi}{4}$ this is $\frac{\pi}{8} - 0$, and at $x = 0$ it is $0$. The value is $\frac{\pi}{8}$.'
          - problem: 'Find $\int \cos^2 3x\,dx$.'
            answer: 'x/2 + sin(6x)/12 + C'
            answer_contract: {"kind": "function", "vars": ["x"], "up_to_constant": true}
            solution_sketch: 'Use $\cos^2 3x = \frac{1 + \cos 6x}{2}$. The integral of $\frac{1}{2}$ is $\frac{x}{2}$, and the integral of $\frac{\cos 6x}{2}$ is $\frac{\sin 6x}{12}$. The answer is $\frac{x}{2} + \frac{\sin 6x}{12} + C$.'
          - problem: 'The power drawn by a lamp is $P(t) = 60\sin^2 t$ watts, with $t$ in seconds. Find the average power over the interval $0 \le t \le \pi$.'
            answer: '30'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The average is $\frac{1}{\pi}\int_0^{\pi} 60\sin^2 t\,dt$. Since $\int_0^{\pi} \sin^2 t\,dt = \frac{\pi}{2}$, the average is $60 \cdot \frac{1}{\pi} \cdot \frac{\pi}{2} = 30$ watts.'
          - problem: 'The region under $y = \sin x$ from $x = 0$ to $x = \pi$ is rotated about the $x$-axis. Find the volume of the solid.'
            answer: 'pi^2/2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'By the disk method the volume is $\pi\int_0^{\pi} \sin^2 x\,dx$. The integral equals $\frac{\pi}{2}$, so the volume is $\pi \cdot \frac{\pi}{2} = \frac{\pi^2}{2}$ cubic units.'
          - problem: 'Sam says $\int_0^{2\pi} \cos^2 x\,dx = 0$ because the cosine takes positive and negative values equally. What is the correct value?'
            answer: 'pi'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Sam forgot that $\cos^2 x$ is never negative, so the positive and negative parts do not cancel. Use $\cos^2 x = \frac{1 + \cos 2x}{2}$, so the integral is $\left[\frac{x}{2} + \frac{\sin 2x}{4}\right]_0^{2\pi} = \pi$.'
          - problem: 'The integral $\int_0^k \sin^2 x\,dx$ equals $\frac{\pi}{4}$, where $0 < k < \pi$. Find $k$.'
            answer: 'pi/2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The integral equals $\frac{k}{2} - \frac{\sin 2k}{4}$. At $k = \frac{\pi}{2}$ this is $\frac{\pi}{4} - 0 = \frac{\pi}{4}$. The integrand is positive, so the integral increases with $k$ and $k = \frac{\pi}{2}$ is the only solution.'
        constraints: 'powers 2 (and sin^2 x cos^2 x, or a linear argument such as cos^2 3x) by the half-angle identities; definite integrals and measured contexts over [0, pi], [0, pi/2] or [0, 2 pi]'
      - id: kp2
        name: Products sin(mx) cos(nx) via product-to-sum
        key_prerequisites: [product-to-sum-identities, sum-difference-identities, trig-identities-basic]
        step_check:
          step: 'Compute $A+B=6x$ and $A-B=2x$'
          question: 'Why does the identity need both the sum $A+B$ and the difference $A-B$?'
          options:
            - 'The identity writes the product as a sum of one sine of each angle'
            - 'The two angles are the limits of integration, and both must be used'
            - 'Each factor of the product is replaced by one of these two angles'
            - 'The sum and the difference are two ways to check the same answer'
          answer: 'The identity writes the product as a sum of one sine of each angle'
          why: 'The product $\sin A\cos B$ equals $\frac{1}{2}[\sin(A+B) + \sin(A-B)]$. So both angles appear, and each term has a single frequency that we can integrate.'
        exemplars:
          - problem: 'Evaluate $\int \sin 3x \cos x\,dx$.'
            answer: '-cos(4x)/8 - cos(2x)/4 + C'
            answer_contract: {"kind": "function", "vars": ["x"], "up_to_constant": true}
            solution_sketch: 'Use $\sin A\cos B = \frac{1}{2}[\sin(A+B) + \sin(A-B)]$ with $A = 3x$ and $B = x$, so $\sin 3x\cos x = \frac{1}{2}[\sin 4x + \sin 2x]$. Integrating each sine gives $-\frac{\cos 4x}{8} - \frac{\cos 2x}{4} + C$.'
          - problem: 'Evaluate $\int \sin 2x \sin x\,dx$.'
            answer: 'sin(x)/2 - sin(3x)/6 + C'
            answer_contract: {"kind": "function", "vars": ["x"], "up_to_constant": true}
            solution_sketch: 'Use $\sin A\sin B = \frac{1}{2}[\cos(A-B) - \cos(A+B)]$, so $\sin 2x\sin x = \frac{1}{2}[\cos x - \cos 3x]$. Integrating each cosine gives $\frac{\sin x}{2} - \frac{\sin 3x}{6} + C$.'
          - problem: 'Evaluate $\int \cos 3x \cos x\,dx$.'
            answer: 'sin(4x)/8 + sin(2x)/4 + C'
            answer_contract: {"kind": "function", "vars": ["x"], "up_to_constant": true}
            solution_sketch: 'Use $\cos A\cos B = \frac{1}{2}[\cos(A-B) + \cos(A+B)]$, so $\cos 3x\cos x = \frac{1}{2}[\cos 2x + \cos 4x]$. Integrating each cosine gives $\frac{\sin 4x}{8} + \frac{\sin 2x}{4} + C$.'
          - problem: 'Evaluate $\int_0^{\pi/2} \sin 3x \cos x\,dx$.'
            answer: '1/2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Since $\sin 3x\cos x = \frac{1}{2}[\sin 4x + \sin 2x]$, an antiderivative is $-\frac{\cos 4x}{8} - \frac{\cos 2x}{4}$. At $x = \frac{\pi}{2}$ it is $-\frac{1}{8} + \frac{1}{4} = \frac{1}{8}$, and at $x = 0$ it is $-\frac{3}{8}$. The difference is $\frac{1}{2}$.'
          - problem: 'Sam writes $\sin 2x\cos 5x = \frac{1}{2}[\sin 7x + \sin 3x]$ and integrates. Find the correct antiderivative of $\sin 2x\cos 5x$.'
            answer: '-cos(7x)/14 + cos(3x)/6 + C'
            answer_contract: {"kind": "function", "vars": ["x"], "up_to_constant": true}
            solution_sketch: 'With $A = 2x$ and $B = 5x$, the difference is $A - B = -3x$, and $\sin(-3x) = -\sin 3x$. So $\sin 2x\cos 5x = \frac{1}{2}[\sin 7x - \sin 3x]$. Integrating gives $-\frac{\cos 7x}{14} + \frac{\cos 3x}{6} + C$.'
          - problem: 'A particle moves along a line with velocity $v(t) = \sin 5t \cos 2t$ metres per second. Find its displacement from $t = 0$ to $t = \frac{\pi}{3}$ seconds.'
            answer: '31/84'
            answer_contract: {"kind": "unit", "quantity": "length", "unit": "m", "allow_omitted": true}
            solution_sketch: 'Write $\sin 5t\cos 2t = \frac{1}{2}[\sin 7t + \sin 3t]$, which has the antiderivative $-\frac{\cos 7t}{14} - \frac{\cos 3t}{6}$. At $t = \frac{\pi}{3}$ it is $-\frac{1}{28} + \frac{1}{6}$, and at $t = 0$ it is $-\frac{1}{14} - \frac{1}{6}$. The difference is $\frac{31}{84}$ metres.'
          - problem: 'A voltage is modelled by $V(t) = \sin 2t \sin t$ volts, with $t$ in seconds. Find its average value over the interval $0 \le t \le \frac{\pi}{2}$.'
            answer: '4/(3*pi)'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The integral of $\sin 2t\sin t = \frac{1}{2}[\cos t - \cos 3t]$ over the interval is $\frac{1}{2}\left(1 + \frac{1}{3}\right) = \frac{2}{3}$. The average is this integral divided by the length $\frac{\pi}{2}$, which gives $\frac{2}{3} \cdot \frac{2}{\pi} = \frac{4}{3\pi}$ volts.'
          - problem: 'Evaluate $\int \cos 5x \cos 2x\,dx$.'
            answer: 'sin(3x)/6 + sin(7x)/14 + C'
            answer_contract: {"kind": "function", "vars": ["x"], "up_to_constant": true}
            solution_sketch: 'Use $\cos A\cos B = \frac{1}{2}[\cos(A-B) + \cos(A+B)]$, so $\cos 5x\cos 2x = \frac{1}{2}[\cos 3x + \cos 7x]$. Integrating each cosine gives $\frac{\sin 3x}{6} + \frac{\sin 7x}{14} + C$.'
          - problem: 'Evaluate $\int \sin 4x \sin 2x\,dx$.'
            answer: 'sin(2x)/4 - sin(6x)/12 + C'
            answer_contract: {"kind": "function", "vars": ["x"], "up_to_constant": true}
            solution_sketch: 'Use $\sin A\sin B = \frac{1}{2}[\cos(A-B) - \cos(A+B)]$, so $\sin 4x\sin 2x = \frac{1}{2}[\cos 2x - \cos 6x]$. Integrating each cosine gives $\frac{\sin 2x}{4} - \frac{\sin 6x}{12} + C$.'
        constraints: 'products sin(mx) cos(nx), sin(mx) sin(nx), cos(mx) cos(nx) with m and n small positive integers, m != n; the identity may be restated in the stem but is not needed'
      - id: kp3
        name: General strategy for sin^m x cos^n x
        key_prerequisites: [trig-integrals-odd-powers, double-half-angle-identities, trig-identities-basic]
        step_check:
          step: 'here $m = 3$ is odd, so the substitution route applies'
          question: 'Why does an odd power of sine allow the substitution route?'
          options:
            - 'Odd powers of sine always integrate to a power of cosine with no extra work'
            - 'One sine splits off as $du$, and the even power of sines left becomes cosines'
            - 'The odd power can be lowered by a half-angle identity to a single first power of sine'
            - 'Only an odd power makes $u = \cos x$ equal to a constant on the interval'
          answer: 'One sine splits off as $du$, and the even power of sines left becomes cosines'
          why: 'Splitting off one $\sin x$ leaves an even power of sine, which is a power of $\sin^2 x = 1 - \cos^2 x$. With $u = \cos x$ we have $du = -\sin x\,dx$, so everything is a polynomial in $u$.'
        exemplars:
          - problem: 'Evaluate $\int \sin^5 x\,dx$.'
            answer: '-cos(x) + 2cos(x)^3/3 - cos(x)^5/5 + C'
            answer_contract: {"kind": "function", "vars": ["x"], "up_to_constant": true}
            solution_sketch: 'The power of sine is odd, so split off one $\sin x$ and write $\sin^4 x = (1 - \cos^2 x)^2$. With $u = \cos x$ and $du = -\sin x\,dx$ the integral is $-\int (1 - 2u^2 + u^4)\,du$. The answer is $-\cos x + \frac{2\cos^3 x}{3} - \frac{\cos^5 x}{5} + C$.'
          - problem: 'Evaluate $\int \sin^4 x\,dx$.'
            answer: '3x/8 - sin(2x)/4 + sin(4x)/32 + C'
            answer_contract: {"kind": "function", "vars": ["x"], "up_to_constant": true}
            solution_sketch: 'Both exponents are even, so use $\sin^4 x = \left(\frac{1 - \cos 2x}{2}\right)^2 = \frac{3}{8} - \frac{\cos 2x}{2} + \frac{\cos 4x}{8}$. Integrating term by term gives $\frac{3x}{8} - \frac{\sin 2x}{4} + \frac{\sin 4x}{32} + C$.'
          - problem: 'Evaluate $\int \sin^3 x \cos^3 x\,dx$.'
            answer: 'sin(x)^4/4 - sin(x)^6/6 + C'
            answer_contract: {"kind": "function", "vars": ["x"], "up_to_constant": true}
            solution_sketch: 'Both powers are odd, so split off one $\cos x$ and write $\cos^2 x = 1 - \sin^2 x$. With $u = \sin x$ the integral is $\int (u^3 - u^5)\,du = \frac{u^4}{4} - \frac{u^6}{6}$. The answer is $\frac{\sin^4 x}{4} - \frac{\sin^6 x}{6} + C$.'
          - problem: 'Evaluate $\int_0^{\pi/2} \cos^4 x\,dx$.'
            answer: '3*pi/16'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Both exponents are even, so $\cos^4 x = \frac{3}{8} + \frac{\cos 2x}{2} + \frac{\cos 4x}{8}$. Over $\left[0, \frac{\pi}{2}\right]$ the cosine terms integrate to $0$, so only the constant $\frac{3}{8}$ survives. The value is $\frac{3}{8} \cdot \frac{\pi}{2} = \frac{3\pi}{16}$.'
          - problem: 'Evaluate $\int_0^{\pi/2} \sin^3 x \cos^4 x\,dx$.'
            answer: '2/35'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The power of sine is odd, so let $u = \cos x$ with $du = -\sin x\,dx$. The bounds $0$ and $\frac{\pi}{2}$ become $u = 1$ and $u = 0$, and the integral is $\int_0^1 (1 - u^2)u^4\,du = \frac{1}{5} - \frac{1}{7}$. The value is $\frac{2}{35}$.'
          - problem: 'The region under $y = \sin^2 x$ from $x = 0$ to $x = \pi$ is rotated about the $x$-axis. Find the volume of the solid.'
            answer: '3*pi^2/8'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'By the disk method the volume is $\pi\int_0^{\pi} \sin^4 x\,dx$. Using $\sin^4 x = \frac{3}{8} - \frac{\cos 2x}{2} + \frac{\cos 4x}{8}$, the integral equals $\frac{3\pi}{8}$. So the volume is $\frac{3\pi^2}{8}$ cubic units.'
          - problem: 'The height of a wave crest is modelled by $h(x) = \sin^3 x$ metres for $0 \le x \le \pi$. Find the average height.'
            answer: '4/(3*pi)'
            answer_contract: {"kind": "unit", "quantity": "length", "unit": "m", "allow_omitted": true}
            solution_sketch: 'The power of sine is odd, so $\int_0^{\pi} \sin^3 x\,dx = \int_{-1}^{1} (1 - u^2)\,du = \frac{4}{3}$ with $u = \cos x$. The average is this integral divided by the length $\pi$ of the interval, which gives $\frac{4}{3\pi}$ metres.'
          - problem: 'Evaluate $\int_0^{\pi/2} \sin^6 x\,dx$.'
            answer: '5*pi/32'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Both exponents are even, so $\sin^6 x = \left(\frac{1 - \cos 2x}{2}\right)^3$. After expanding and reducing the powers of $\cos 2x$ once more, the constant term is $\frac{5}{16}$ and all other terms integrate to $0$ over $\left[0, \frac{\pi}{2}\right]$. The value is $\frac{5}{16} \cdot \frac{\pi}{2} = \frac{5\pi}{32}$.'
        constraints: 'sin^m x cos^n x with m + n <= 6; an odd power present -> substitution route, both even -> half-angle route; decide the route from the exponents'
    diagnostic_exemplar:
      problem: 'Evaluate $\int \cos^4 x \, dx$.'
      answer: '$3x/8 + \sin(2x)/4 + \sin(4x)/32 + C$'
      solution_sketch: 'Two half-angle reductions give $\cos^4 x = \frac{3}{8} + \frac{\cos 2x}{2} + \frac{\cos 4x}{8}$.'
    anki_seeds:
      - front: "Half-angle identity for sin^2 x?"
        back: '$\sin^2 x = \frac{1 - \cos 2x}{2}$'
        type: basic
      - front: "Both powers even in sin^m x cos^n x: what's the strategy?"
        back: "Half-angle identities to reduce the powers (no substitution works directly)."
        type: basic
      - front: 'Product-to-sum: $\sin A \cos B = $ ?'
        back: '$\frac{1}{2}[\sin(A+B) + \sin(A-B)]$'
        type: basic

  - id: completing-the-square-integrands
    name: Completing the Square in Integrands
    core: true
    difficulty: 0.62
    drill: false
    answer_kind: numeric
    expected_time_secs: 180
    prerequisites:
      - id: completing-the-square
        weight: 0.6
        key: true
      - id: integration-substitution
        weight: 0.7
        key: true
      - id: derivatives-inverse-trig
        weight: 0.5
    knowledge_points:
      - id: kp1
        name: Arctangent forms
        key_prerequisites: [completing-the-square, derivatives-inverse-trig]
        step_check:
          step: 'take half of the $x$-coefficient, $-8/2 = -4$, and square it to get $16$'
          question: 'Why do we square half of the coefficient of $x$ in this step?'
          options:
            - 'Adding $16$ makes $x^2 - 8x + 16$ a perfect square, namely $(x - 4)^2$'
            - 'The square $16$ is the number that makes the whole denominator equal to zero'
            - 'Squaring the coefficient $-8$ is how the integrand gets its constant factor'
            - 'A square is always positive, so the denominator can never reach zero'
          answer: 'Adding $16$ makes $x^2 - 8x + 16$ a perfect square, namely $(x - 4)^2$'
          why: 'The first two terms $x^2 - 8x$ and the number $16$ form $(x - 4)^2$. To keep the value the same, we then subtract $16$ again, which turns the denominator into $(x - 4)^2 + 4$.'
        exemplars:
          - problem: 'Evaluate $\int \frac{dx}{x^2 + 2x + 5}$.'
            answer: 'atan((x+1)/2)/2 + C'
            answer_contract: {"kind": "function", "vars": ["x"], "up_to_constant": true}
            solution_sketch: 'Complete the square: $x^2 + 2x + 5 = (x + 1)^2 + 4$. With $u = x + 1$ and $a = 2$ the arctangent rule gives $\frac{1}{2}\arctan\frac{x + 1}{2} + C$.'
          - problem: 'Evaluate $\int \frac{dx}{x^2 - 4x + 13}$.'
            answer: 'atan((x-2)/3)/3 + C'
            answer_contract: {"kind": "function", "vars": ["x"], "up_to_constant": true}
            solution_sketch: 'Complete the square: $x^2 - 4x + 13 = (x - 2)^2 + 9$. With $u = x - 2$ and $a = 3$ the arctangent rule gives $\frac{1}{3}\arctan\frac{x - 2}{3} + C$.'
          - problem: 'Evaluate $\int \frac{dx}{x^2 + 6x + 10}$.'
            answer: 'atan(x+3) + C'
            answer_contract: {"kind": "function", "vars": ["x"], "up_to_constant": true}
            solution_sketch: 'Complete the square: $x^2 + 6x + 10 = (x + 3)^2 + 1$. With $u = x + 3$ and $a = 1$ the arctangent rule gives $\arctan(x + 3) + C$.'
          - problem: 'Evaluate $\int_1^3 \frac{dx}{x^2 - 2x + 5}$.'
            answer: 'pi/8'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Complete the square: $x^2 - 2x + 5 = (x - 1)^2 + 4$. With $u = x - 1$, the bounds become $0$ and $2$, and the integral is $\frac{1}{2}\arctan\frac{u}{2}\Big|_0^2 = \frac{1}{2} \cdot \frac{\pi}{4}$. The value is $\frac{\pi}{8}$.'
          - problem: 'An antiderivative of $\frac{1}{q(x)}$ is $\frac{1}{3}\arctan\frac{x - 1}{3} + C$, where $q(x)$ is a quadratic with leading coefficient $1$ and integer coefficients. Find $q(x)$.'
            answer: 'x^2-2x+10'
            answer_contract: {"kind": "required_form", "form": "standard_form_polynomial"}
            solution_sketch: 'Compare with the pattern $\frac{1}{a}\arctan\frac{x - h}{a}$: here $a = 3$ and $h = 1$. So $q(x) = (x - 1)^2 + 9$, and expanding gives $x^2 - 2x + 10$. Differentiating the antiderivative returns $\frac{1}{x^2 - 2x + 10}$.'
          - problem: 'Find the area of the region bounded by $y = \frac{1}{x^2 + 4x + 5}$, the $x$-axis, and the lines $x = -3$ and $x = -1$.'
            answer: 'pi/2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Complete the square: $x^2 + 4x + 5 = (x + 2)^2 + 1$. With $u = x + 2$ the bounds become $-1$ and $1$, and the area is $\arctan u\Big|_{-1}^{1} = \frac{\pi}{4} + \frac{\pi}{4}$. The area is $\frac{\pi}{2}$.'
          - problem: 'The temperature along a bar is modelled by $f(x) = \frac{1}{x^2 - 4x + 8}$ degrees at $x$ metres, for $2 \le x \le 4$. Find the average temperature over this stretch.'
            answer: 'pi/16'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Complete the square: $x^2 - 4x + 8 = (x - 2)^2 + 4$. The integral over $[2, 4]$ is $\frac{1}{2}\arctan\frac{u}{2}\Big|_0^2 = \frac{\pi}{8}$. The average is this integral divided by the length $2$, so it is $\frac{\pi}{16}$ degrees.'
          - problem: 'A robot has velocity $v(t) = \frac{3}{t^2 - 4t + 13}$ metres per second. How far does it move between $t = 2$ and $t = 5$ seconds?'
            answer: 'pi/4'
            answer_contract: {"kind": "unit", "quantity": "length", "unit": "m", "allow_omitted": true}
            solution_sketch: 'Complete the square: $t^2 - 4t + 13 = (t - 2)^2 + 9$. With $u = t - 2$ the bounds become $0$ and $3$, and the distance is $3 \cdot \frac{1}{3}\arctan\frac{u}{3}\Big|_0^3 = \arctan 1$. The robot moves $\frac{\pi}{4}$ metres.'
          - problem: 'Sam completes the square as $x^2 + 6x + 13 = (x + 3)^2 + 13$ and finds $\int \frac{dx}{x^2 + 6x + 13} = \frac{1}{\sqrt{13}}\arctan\frac{x + 3}{\sqrt{13}} + C$. Find the correct antiderivative.'
            answer: 'atan((x+3)/2)/2 + C'
            answer_contract: {"kind": "function", "vars": ["x"], "up_to_constant": true}
            solution_sketch: 'Sam added $9$ but then forgot to take it away: $x^2 + 6x + 13 = (x + 3)^2 + 4$. With $u = x + 3$ and $a = 2$ the arctangent rule gives $\frac{1}{2}\arctan\frac{x + 3}{2} + C$.'
        constraints: 'irreducible quadratic denominators with integer centre and radius a in {1, 2, 3, 4}; indefinite and definite integrals, and measured or area contexts'
      - id: kp2
        name: Arcsine forms
        key_prerequisites: [completing-the-square, derivatives-inverse-trig]
        step_check:
          step: 'group the $x$ terms, $5 - 4x - x^2 = 5 - (x^2 + 4x)$'
          question: 'Why do we factor out a minus sign before completing the square?'
          options:
            - 'The root of a negative number is not real, so the sign must go outside the bracket'
            - 'A minus sign in front lets the arcsine rule be applied to the constant term'
            - 'The coefficient of $x^2$ must be $1$ inside the bracket to complete the square'
            - 'Factoring out a minus sign makes the whole quadratic positive for every value of $x$'
          answer: 'The coefficient of $x^2$ must be $1$ inside the bracket to complete the square'
          why: 'The rule for completing the square half-and-squares the $x$-coefficient of a bracket that starts with $x^2$. After $-x^2 - 4x = -(x^2 + 4x)$ the bracket can be completed as $(x+2)^2 - 4$.'
        exemplars:
          - problem: 'Evaluate $\int \frac{dx}{\sqrt{24 - 2x - x^2}}$.'
            answer: 'asin((x+1)/5) + C'
            answer_contract: {"kind": "function", "vars": ["x"], "up_to_constant": true, "domain": {"x": ["-5", "7/3"]}}
            solution_sketch: 'Complete the square: $24 - 2x - x^2 = 25 - (x + 1)^2$. With $u = x + 1$ and $a = 5$ the arcsine rule gives $\arcsin\frac{x + 1}{5} + C$.'
          - problem: 'Evaluate $\int \frac{dx}{\sqrt{6x - x^2 - 5}}$ for $1 < x < 5$.'
            answer: 'asin((x-3)/2) + C'
            answer_contract: {"kind": "function", "vars": ["x"], "up_to_constant": true, "domain": {"x": ["3/2", "9/2"]}}
            solution_sketch: 'Complete the square: $6x - x^2 - 5 = 4 - (x - 3)^2$. With $u = x - 3$ and $a = 2$ the arcsine rule gives $\arcsin\frac{x - 3}{2} + C$.'
          - problem: 'Evaluate $\int \frac{dx}{\sqrt{21 + 4x - x^2}}$.'
            answer: 'asin((x-2)/5) + C'
            answer_contract: {"kind": "function", "vars": ["x"], "up_to_constant": true, "domain": {"x": ["-2", "31/5"]}}
            solution_sketch: 'Complete the square: $21 + 4x - x^2 = 25 - (x - 2)^2$. With $u = x - 2$ and $a = 5$ the arcsine rule gives $\arcsin\frac{x - 2}{5} + C$.'
          - problem: 'Evaluate $\int_1^3 \frac{dx}{\sqrt{3 + 2x - x^2}}$.'
            answer: 'pi/2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Complete the square: $3 + 2x - x^2 = 4 - (x - 1)^2$. With $u = x - 1$ the bounds become $0$ and $2$, and the integral is $\arcsin\frac{u}{2}\Big|_0^2 = \frac{\pi}{2}$.'
          - problem: 'Evaluate $\int_3^4 \frac{dx}{\sqrt{6x - x^2 - 5}}$.'
            answer: 'pi/6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Complete the square: $6x - x^2 - 5 = 4 - (x - 3)^2$. With $u = x - 3$ the bounds become $0$ and $1$, and the integral is $\arcsin\frac{u}{2}\Big|_0^1 = \arcsin\frac{1}{2}$. The value is $\frac{\pi}{6}$.'
          - problem: 'Find the area of the region under $y = \frac{1}{\sqrt{10x - x^2 - 9}}$ from $x = 5$ to $x = 5 + 2\sqrt{2}$.'
            answer: 'pi/4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Complete the square: $10x - x^2 - 9 = 16 - (x - 5)^2$. With $u = x - 5$ the bounds become $0$ and $2\sqrt{2}$, and the area is $\arcsin\frac{u}{4}\Big|_0^{2\sqrt{2}} = \arcsin\frac{\sqrt{2}}{2}$. The area is $\frac{\pi}{4}$.'
          - problem: 'The width of a channel at position $x$ metres is $w(x) = \frac{1}{\sqrt{21 + 4x - x^2}}$ metres, for $2 \le x \le \frac{9}{2}$. Find the average width.'
            answer: 'pi/15'
            answer_contract: {"kind": "unit", "quantity": "length", "unit": "m", "allow_omitted": true}
            solution_sketch: 'Complete the square: $21 + 4x - x^2 = 25 - (x - 2)^2$. The integral over $\left[2, \frac{9}{2}\right]$ is $\arcsin\frac{u}{5}\Big|_0^{5/2} = \arcsin\frac{1}{2} = \frac{\pi}{6}$. The average is this integral divided by the length $\frac{5}{2}$, so it is $\frac{\pi}{6} \cdot \frac{2}{5} = \frac{\pi}{15}$ metres.'
          - problem: 'A sled has speed $v(t) = \frac{2}{\sqrt{12t - t^2 - 27}}$ metres per second for $6 \le t \le \frac{15}{2}$. How far does it move between $t = 6$ and $t = \frac{15}{2}$ seconds?'
            answer: 'pi/3'
            answer_contract: {"kind": "unit", "quantity": "length", "unit": "m", "allow_omitted": true}
            solution_sketch: 'Complete the square: $12t - t^2 - 27 = 9 - (t - 6)^2$. With $u = t - 6$ the bounds become $0$ and $\frac{3}{2}$, and the distance is $2\arcsin\frac{u}{3}\Big|_0^{3/2} = 2\arcsin\frac{1}{2}$. The sled moves $\frac{\pi}{3}$ metres.'
          - problem: 'Sam completes the square as $8 - 2x - x^2 = 9 - (x - 1)^2$ and writes $\int \frac{dx}{\sqrt{8 - 2x - x^2}} = \arcsin\frac{x - 1}{3} + C$. Find the correct antiderivative.'
            answer: 'asin((x+1)/3) + C'
            answer_contract: {"kind": "function", "vars": ["x"], "up_to_constant": true, "domain": {"x": ["-2", "1"]}}
            solution_sketch: 'Check: $9 - (x - 1)^2 = 8 + 2x - x^2$, so Sam changed the sign of $2x$. Correctly, $8 - 2x - x^2 = 9 - (x + 1)^2$. With $u = x + 1$ and $a = 3$ the arcsine rule gives $\arcsin\frac{x + 1}{3} + C$.'
        constraints: 'quadratics with negative leading coefficient under a square root; completed square has integer centre and radius; indefinite integrals state no interval, definite integrals and contexts stay inside the interval where the root is real'
      - id: kp3
        name: Linear numerators (split into log + arctan)
        key_prerequisites: [completing-the-square, integration-substitution]
        step_check:
          step: 'write $4x+1 = 2(2x+4)+c$'
          question: 'Why do we write the numerator using the derivative $2x + 4$ of the denominator?'
          options:
            - 'It makes the numerator a constant, so that no integral of a fraction remains at all'
            - 'The multiple of $2x + 4$ integrates to a logarithm, by $u = $ the denominator'
            - 'The derivative of the denominator is always the only correct numerator to use here'
            - 'It shows that the denominator factors into two different linear factors over the reals'
          answer: 'The multiple of $2x + 4$ integrates to a logarithm, by $u = $ the denominator'
          why: 'A term $\frac{k(2x+4)}{x^2+4x+13}$ has the form $k\frac{u''}{u}$, so it integrates to $k\ln(x^2+4x+13)$. The leftover constant $c$ gives an arctangent after completing the square.'
        exemplars:
          - problem: 'Evaluate $\int \frac{2x + 3}{x^2 + 2x + 5}\,dx$.'
            answer: 'ln(x^2+2x+5) + atan((x+1)/2)/2 + C'
            answer_contract: {"kind": "function", "vars": ["x"], "up_to_constant": true}
            solution_sketch: 'Write $2x + 3 = (2x + 2) + 1$, where $2x + 2$ is the derivative of the denominator. The first part gives $\ln(x^2 + 2x + 5)$. The second part is $\int \frac{dx}{(x + 1)^2 + 4} = \frac{1}{2}\arctan\frac{x + 1}{2}$.'
          - problem: 'Evaluate $\int \frac{4x + 1}{x^2 + 4x + 13}\,dx$.'
            answer: '2ln(x^2+4x+13) - 7atan((x+2)/3)/3 + C'
            answer_contract: {"kind": "function", "vars": ["x"], "up_to_constant": true}
            solution_sketch: 'Write $4x + 1 = 2(2x + 4) - 7$. The first part gives $2\ln(x^2 + 4x + 13)$. Since $x^2 + 4x + 13 = (x + 2)^2 + 9$, the second part gives $-7 \cdot \frac{1}{3}\arctan\frac{x + 2}{3}$.'
          - problem: 'Evaluate $\int \frac{2x + 2}{x^2 + 2x + 5}\,dx$.'
            answer: 'ln(x^2+2x+5) + C'
            answer_contract: {"kind": "function", "vars": ["x"], "up_to_constant": true}
            solution_sketch: 'The numerator $2x + 2$ is exactly the derivative of the denominator. With $u = x^2 + 2x + 5$ we get $\int \frac{du}{u} = \ln u$, and $u$ is always positive. The answer is $\ln(x^2 + 2x + 5) + C$.'
          - problem: 'Find $A$ and $B$ so that $6x - 2 = A(2x - 2) + B$ for every $x$.'
            answer: 'A = 3; B = 4'
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "A"}, {"contract": {"kind": "exact"}, "name": "B"}]}
            solution_sketch: 'Compare the coefficients of $x$: $2A = 6$, so $A = 3$. Compare the constant terms: $-2A + B = -2$, so $B = -2 + 6 = 4$. So $A = 3$ and $B = 4$.'
          - problem: 'Evaluate $\int_1^3 \frac{2x + 2}{x^2 - 2x + 5}\,dx$.'
            answer: 'ln(2) + pi/2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Write $2x + 2 = (2x - 2) + 4$. The first part gives $\ln(x^2 - 2x + 5)\Big|_1^3 = \ln 8 - \ln 4 = \ln 2$. The second part is $4 \cdot \frac{1}{2}\arctan\frac{x - 1}{2}\Big|_1^3 = 2 \cdot \frac{\pi}{4}$. The value is $\ln 2 + \frac{\pi}{2}$.'
          - problem: 'A rod lies along the $x$-axis from $x = -1$ to $x = 1$ metres. Its density is $\rho(x) = \frac{2x + 5}{x^2 + 2x + 5}$ kilograms per metre. Find the mass of the rod to two decimal places.'
            answer: '1.87'
            answer_contract: {"kind": "approx", "decimals": 2}
            solution_sketch: 'The mass is $\int_{-1}^{1} \rho(x)\,dx$. Write $2x + 5 = (2x + 2) + 3$. The first part gives $\ln(x^2 + 2x + 5)\Big|_{-1}^{1} = \ln 8 - \ln 4 = \ln 2$. The second part is $3 \cdot \frac{1}{2}\arctan\frac{x + 1}{2}\Big|_{-1}^{1} = \frac{3\pi}{8}$. The mass is $\ln 2 + \frac{3\pi}{8} \approx 1.8712$, so it is $1.87$ kilograms.'
          - problem: 'A quantity is modelled by $f(x) = \frac{6x - 2}{x^2 - 2x + 5}$ for $1 \le x \le 3$. Find its average value on this interval.'
            answer: '3*ln(2)/2 + pi/4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Write $6x - 2 = 3(2x - 2) + 4$. The integral over $[1, 3]$ is $3\ln 2 + 4 \cdot \frac{1}{2} \cdot \frac{\pi}{4} = 3\ln 2 + \frac{\pi}{2}$. The average is this integral divided by the length $2$, so it is $\frac{3\ln 2}{2} + \frac{\pi}{4}$.'
          - problem: 'Sam writes $4x + 7 = 2(2x - 2) + 3$ and integrates $\frac{4x + 7}{x^2 - 2x + 5}$ from this. Find the correct antiderivative.'
            answer: '2ln(x^2-2x+5) + 11atan((x-1)/2)/2 + C'
            answer_contract: {"kind": "function", "vars": ["x"], "up_to_constant": true}
            solution_sketch: 'Expanding Sam''s numerator gives $4x - 1$, not $4x + 7$. The correct split is $4x + 7 = 2(2x - 2) + 11$. So the integral is $2\ln(x^2 - 2x + 5) + 11 \cdot \frac{1}{2}\arctan\frac{x - 1}{2} + C$.'
        constraints: 'numerator of degree 1 over an irreducible quadratic; write the numerator as (a multiple of the derivative of the denominator) + a constant, then split into a logarithm and an arctangent'
    diagnostic_exemplar:
      problem: 'Evaluate $\int \frac{2x + 6}{x^2 + 4x + 5} \, dx$.'
      answer: '$\ln(x^2 + 4x + 5) + 2\arctan(x + 2) + C$'
      answer_contract: {kind: none}
      solution_sketch: 'Write $2x + 6 = (2x + 4) + 2$: the first part is a logarithm, the second is $2\int \frac{dx}{(x+2)^2 + 1}$.'
    anki_seeds:
      - front: '$\int \frac{du}{u^2 + a^2} = $ ?'
        back: '$\frac{1}{a}\arctan\left(\frac{u}{a}\right) + C$'
        type: basic
      - front: '$\int \frac{du}{\sqrt{a^2 - u^2}} = $ ?'
        back: '$\arcsin\left(\frac{u}{a}\right) + C$'
        type: basic

  - id: trigonometric-substitution
    name: Trigonometric Substitution
    core: true
    difficulty: 0.72
    drill: false
    answer_kind: numeric
    expected_time_secs: 240
    prerequisites:
      - id: trigonometric-integrals
        weight: 0.6
        key: true
      - id: integration-substitution
        weight: 0.6
        key: true
      - id: completing-the-square-integrands
        weight: 0.5
      - id: right-triangle-trig
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: The pattern a^2 - x^2 (x = a sin theta)
        key_prerequisites: [trigonometric-integrals, right-triangle-trig]
        step_check:
          step: 'set $x = 3\sin\theta$'
          question: 'Why is $x = 3\sin\theta$ the right substitution for $\sqrt{9 - x^2}$?'
          options:
            - 'Because $\sin\theta$ is the derivative of $x$, so $dx$ is replaced exactly'
            - 'Because $9 - x^2 = 9\cos^2\theta$, so the square root becomes $3\cos\theta$'
            - 'Because $x$ must stay between $0$ and $1$, which is the range of $\sin\theta$'
            - 'Because $9 - x^2$ equals $9\sin^2\theta$, so the root is $3\sin\theta$'
          answer: 'Because $9 - x^2 = 9\cos^2\theta$, so the square root becomes $3\cos\theta$'
          why: 'Since $9 - 9\sin^2\theta = 9\cos^2\theta$, the root has no radical left. The integral then becomes a trigonometric integral in $\theta$.'
        try_first:
          problem: 'Find $\int_0^3 \sqrt{9 - x^2}\,dx$. Hint: draw the graph of $y = \sqrt{9 - x^2}$.'
          answer_contract: {"kind": "exact"}
          answer: '9*pi/4'
          reveal: 'The graph of $y = \sqrt{9 - x^2}$ is a quarter of a circle of radius $3$, so the area is $\frac{9\pi}{4}$. The substitution $x = 3\sin\theta$ finds the same value by algebra, and it also works when the region is not a circle.'
        exemplars:
          - problem: 'Evaluate $\int \sqrt{4 - x^2}\,dx$.'
            answer: '2asin(x/2) + x*sqrt(4-x^2)/2 + C'
            answer_contract: {"kind": "function", "vars": ["x"], "up_to_constant": true, "domain": {"x": ["1/5", "9/5"]}}
            solution_sketch: 'Let $x = 2\sin\theta$, so $dx = 2\cos\theta\,d\theta$ and $\sqrt{4 - x^2} = 2\cos\theta$. The integral is $4\int \cos^2\theta\,d\theta = 2\theta + 2\sin\theta\cos\theta$. With $\sin\theta = \frac{x}{2}$ and $\cos\theta = \frac{\sqrt{4 - x^2}}{2}$, the answer is $2\arcsin\frac{x}{2} + \frac{x\sqrt{4 - x^2}}{2} + C$.'
          - problem: 'Evaluate $\int \frac{dx}{x^2\sqrt{4 - x^2}}$ for $0 < x < 2$.'
            answer: '-sqrt(4-x^2)/(4x) + C'
            answer_contract: {"kind": "function", "vars": ["x"], "up_to_constant": true, "domain": {"x": ["1/5", "9/5"]}}
            solution_sketch: 'Let $x = 2\sin\theta$, so $dx = 2\cos\theta\,d\theta$ and $\sqrt{4 - x^2} = 2\cos\theta$. The integral is $\int \frac{2\cos\theta}{4\sin^2\theta \cdot 2\cos\theta}\,d\theta = \frac{1}{4}\int \csc^2\theta\,d\theta = -\frac{\cot\theta}{4}$. With $\cot\theta = \frac{\sqrt{4 - x^2}}{x}$, the answer is $-\frac{\sqrt{4 - x^2}}{4x} + C$.'
          - problem: 'Evaluate $\int \frac{x^2}{\sqrt{9 - x^2}}\,dx$.'
            answer: '9asin(x/3)/2 - x*sqrt(9-x^2)/2 + C'
            answer_contract: {"kind": "function", "vars": ["x"], "up_to_constant": true, "domain": {"x": ["1/5", "14/5"]}}
            solution_sketch: 'Let $x = 3\sin\theta$, so $dx = 3\cos\theta\,d\theta$ and $\sqrt{9 - x^2} = 3\cos\theta$. The integral is $9\int \sin^2\theta\,d\theta = \frac{9}{2}(\theta - \sin\theta\cos\theta)$. With $\sin\theta = \frac{x}{3}$ and $\cos\theta = \frac{\sqrt{9 - x^2}}{3}$, the answer is $\frac{9}{2}\arcsin\frac{x}{3} - \frac{x\sqrt{9 - x^2}}{2} + C$.'
          - problem: 'Evaluate $\int_0^2 \sqrt{4 - x^2}\,dx$.'
            answer: 'pi'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The graph of $y = \sqrt{4 - x^2}$ is a quarter of a circle of radius $2$, so the area is $\frac{1}{4}\pi \cdot 2^2 = \pi$. With $x = 2\sin\theta$ the integral is $4\int_0^{\pi/2} \cos^2\theta\,d\theta = 4 \cdot \frac{\pi}{4}$, which also gives $\pi$.'
          - problem: 'Evaluate $\int_0^1 \frac{dx}{(4 - x^2)^{3/2}}$.'
            answer: 'sqrt(3)/12'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Let $x = 2\sin\theta$, so $dx = 2\cos\theta\,d\theta$ and $(4 - x^2)^{3/2} = 8\cos^3\theta$. The integral is $\frac{1}{4}\int \sec^2\theta\,d\theta = \frac{\tan\theta}{4}$, and the bounds are $\theta = 0$ and $\theta = \frac{\pi}{6}$. The value is $\frac{1}{4} \cdot \frac{1}{\sqrt{3}} = \frac{\sqrt{3}}{12}$.'
          - problem: 'A circular window has radius $4$ metres. A straight bar is fixed $2\sqrt{2}$ metres from the centre of the window. Find the area of the smaller piece of glass that the bar cuts off.'
            answer: '4*pi - 8'
            answer_contract: {"kind": "unit", "quantity": "area", "unit": "m^2", "allow_omitted": true}
            solution_sketch: 'Place the centre at the origin. The piece is $2\int_{2\sqrt{2}}^4 \sqrt{16 - x^2}\,dx$, because the height of the piece at $x$ is $2\sqrt{16 - x^2}$. With $x = 4\sin\theta$, an antiderivative is $8\arcsin\frac{x}{4} + \frac{x\sqrt{16 - x^2}}{2}$. It equals $4\pi$ at $x = 4$ and $2\pi + 4$ at $x = 2\sqrt{2}$, so the area is $2(4\pi - 2\pi - 4) = 4\pi - 8$ square metres.'
          - problem: 'Find the area enclosed by the ellipse $\frac{x^2}{9} + \frac{y^2}{4} = 1$.'
            answer: '6*pi'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'By symmetry the area is $4\int_0^3 \frac{2}{3}\sqrt{9 - x^2}\,dx$, because the upper half is $y = \frac{2}{3}\sqrt{9 - x^2}$. The integral $\int_0^3 \sqrt{9 - x^2}\,dx$ is a quarter of a disk, $\frac{9\pi}{4}$. So the area is $4 \cdot \frac{2}{3} \cdot \frac{9\pi}{4} = 6\pi$.'
          - problem: 'The height of an arch is $h(x) = \sqrt{4 - x^2}$ metres at a horizontal distance of $x$ metres from the centre line, for $0 \le x \le 2$. Find the average height of the arch over this stretch.'
            answer: 'pi/2'
            answer_contract: {"kind": "unit", "quantity": "length", "unit": "m", "allow_omitted": true}
            solution_sketch: 'The integral $\int_0^2 \sqrt{4 - x^2}\,dx$ is $\pi$. The average is this integral divided by the length $2$ of the interval. So the average height is $\frac{\pi}{2}$ metres.'
          - problem: 'Sam substitutes $x = \sin\theta$ in $\int_0^1 \sqrt{1 - x^2}\,dx$ and gets $\int_0^1 \cos\theta\,d\theta = \sin 1$. Find the correct value of the integral.'
            answer: 'pi/4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Sam kept the old bounds, but they belong to $x$. When $x = \sin\theta$, the bounds $0$ and $1$ become $\theta = 0$ and $\theta = \frac{\pi}{2}$, and $dx = \cos\theta\,d\theta$ gives $\int_0^{\pi/2} \cos^2\theta\,d\theta = \frac{\pi}{4}$.'
        constraints: 'a^2 - x^2 under a root or in a power, a in {1, 2, 3, 5}; substitute x = a sin(theta); indefinite integrals (state the interval where needed), definite integrals, and area contexts; the answer back-substitutes through a reference triangle'
      - id: kp2
        name: The pattern a^2 + x^2 (x = a tan theta)
        key_prerequisites: [trigonometric-integrals, integration-substitution]
        step_check:
          step: '$4 + x^2 = 4 + 4\tan^2\theta = 4\sec^2\theta$'
          question: 'Why does $4 + 4\tan^2\theta$ equal $4\sec^2\theta$?'
          options:
            - 'Because $1 + \tan^2\theta = \sec^2\theta$, after factoring out $4$'
            - 'Because $\tan^2\theta$ and $\sec^2\theta$ are equal for every angle'
            - 'Because the factor $4$ is the derivative of $\tan^2\theta$ here'
            - 'Because we square both sides of $x = 2\tan\theta$ to get $\sec$'
          answer: 'Because $1 + \tan^2\theta = \sec^2\theta$, after factoring out $4$'
          why: 'Factoring gives $4(1 + \tan^2\theta)$, and the Pythagorean identity $1 + \tan^2\theta = \sec^2\theta$ turns this into $4\sec^2\theta$. This is why $x = a\tan\theta$ suits $a^2 + x^2$.'
        exemplars:
          - problem: 'Evaluate $\int \frac{dx}{(1 + x^2)^{3/2}}$.'
            answer: 'x/sqrt(1+x^2) + C'
            answer_contract: {"kind": "function", "vars": ["x"], "up_to_constant": true}
            solution_sketch: 'Let $x = \tan\theta$, so $dx = \sec^2\theta\,d\theta$ and $(1 + x^2)^{3/2} = \sec^3\theta$. The integral is $\int \cos\theta\,d\theta = \sin\theta$. With $\sin\theta = \frac{x}{\sqrt{1 + x^2}}$, the answer is $\frac{x}{\sqrt{1 + x^2}} + C$.'
          - problem: 'Evaluate $\int \frac{dx}{x^2\sqrt{x^2 + 4}}$ for $x > 0$.'
            answer: '-sqrt(x^2+4)/(4x) + C'
            answer_contract: {"kind": "function", "vars": ["x"], "up_to_constant": true, "domain": {"x": ["1/5", "5"]}}
            solution_sketch: 'Let $x = 2\tan\theta$, so $dx = 2\sec^2\theta\,d\theta$ and $\sqrt{x^2 + 4} = 2\sec\theta$. The integral is $\frac{1}{4}\int \frac{\sec\theta}{\tan^2\theta}\,d\theta = \frac{1}{4}\int \frac{\cos\theta}{\sin^2\theta}\,d\theta = -\frac{1}{4\sin\theta}$. With $\sin\theta = \frac{x}{\sqrt{x^2 + 4}}$, the answer is $-\frac{\sqrt{x^2 + 4}}{4x} + C$.'
          - problem: 'Evaluate $\int_0^1 \frac{dx}{(1 + x^2)^{3/2}}$.'
            answer: 'sqrt(2)/2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'An antiderivative is $\frac{x}{\sqrt{1 + x^2}}$. At $x = 1$ it is $\frac{1}{\sqrt{2}} = \frac{\sqrt{2}}{2}$, and at $x = 0$ it is $0$. The value is $\frac{\sqrt{2}}{2}$.'
          - problem: 'Evaluate $\int_0^4 \frac{x^2}{(x^2 + 9)^{3/2}}\,dx$.'
            answer: 'ln(3) - 4/5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Let $x = 3\tan\theta$, so the integrand becomes $\frac{\tan^2\theta}{\sec\theta}\,d\theta = (\sec\theta - \cos\theta)\,d\theta$. An antiderivative is $\ln(\sec\theta + \tan\theta) - \sin\theta$. At $x = 4$ we have $\tan\theta = \frac{4}{3}$, $\sec\theta = \frac{5}{3}$ and $\sin\theta = \frac{4}{5}$, so the value is $\ln 3 - \frac{4}{5}$.'
          - problem: 'Evaluate $\int \frac{dx}{(9 + x^2)^{3/2}}$.'
            answer: 'x/(9sqrt(x^2+9)) + C'
            answer_contract: {"kind": "function", "vars": ["x"], "up_to_constant": true}
            solution_sketch: 'Let $x = 3\tan\theta$, so $dx = 3\sec^2\theta\,d\theta$ and $(9 + x^2)^{3/2} = 27\sec^3\theta$. The integral is $\frac{1}{9}\int \cos\theta\,d\theta = \frac{\sin\theta}{9}$. With $\sin\theta = \frac{x}{\sqrt{x^2 + 9}}$, the answer is $\frac{x}{9\sqrt{x^2 + 9}} + C$.'
          - problem: 'Evaluate $\int_0^2 \frac{dx}{x^2 + 4}$.'
            answer: 'pi/8'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Let $x = 2\tan\theta$, so $dx = 2\sec^2\theta\,d\theta$ and $x^2 + 4 = 4\sec^2\theta$. The integral is $\frac{1}{2}\int_0^{\pi/4} d\theta$, because $x = 2$ gives $\tan\theta = 1$. The value is $\frac{\pi}{8}$.'
          - problem: 'Find the area of the region under $y = \frac{1}{(4 + x^2)^{3/2}}$ from $x = 0$ to $x = 2\sqrt{3}$.'
            answer: 'sqrt(3)/8'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'An antiderivative is $\frac{x}{4\sqrt{4 + x^2}}$. At $x = 2\sqrt{3}$ it is $\frac{2\sqrt{3}}{4 \cdot 4}$, because $\sqrt{4 + 12} = 4$, and at $x = 0$ it is $0$. The area is $\frac{\sqrt{3}}{8}$.'
          - problem: 'The thickness of a plate is $t(x) = \frac{1}{(1 + x^2)^{3/2}}$ centimetres at a distance of $x$ centimetres from its edge, for $0 \le x \le \sqrt{3}$. Find the average thickness.'
            answer: '1/2'
            answer_contract: {"kind": "unit", "quantity": "length", "unit": "cm", "allow_omitted": true}
            solution_sketch: 'An antiderivative is $\frac{x}{\sqrt{1 + x^2}}$, so the integral over the interval is $\frac{\sqrt{3}}{2} - 0$. The average is this integral divided by the length $\sqrt{3}$ of the interval. So the average thickness is $\frac{1}{2}$ centimetre.'
          - problem: 'Sam sets $x = 2\tan\theta$ in $\int \frac{dx}{(x^2 + 4)^{3/2}}$ and writes $dx = 2\sec\theta\,d\theta$. Find the correct antiderivative.'
            answer: 'x/(4sqrt(x^2+4)) + C'
            answer_contract: {"kind": "function", "vars": ["x"], "up_to_constant": true}
            solution_sketch: 'Sam differentiated incorrectly: the derivative of $\tan\theta$ is $\sec^2\theta$, so $dx = 2\sec^2\theta\,d\theta$. Then $(x^2 + 4)^{3/2} = 8\sec^3\theta$ and the integral is $\frac{1}{4}\int \cos\theta\,d\theta = \frac{\sin\theta}{4}$. The answer is $\frac{x}{4\sqrt{x^2 + 4}} + C$.'
          - problem: 'A particle moves along a line with velocity $v(t) = \frac{1}{(t^2 + 9)^{3/2}}$ metres per second. How far does it move between $t = 0$ and $t = 3\sqrt{3}$ seconds?'
            answer: 'sqrt(3)/18'
            answer_contract: {"kind": "unit", "quantity": "length", "unit": "m", "allow_omitted": true}
            solution_sketch: 'An antiderivative of $\frac{1}{(t^2 + 9)^{3/2}}$ is $\frac{t}{9\sqrt{t^2 + 9}}$, found with $t = 3\tan\theta$. At $t = 3\sqrt{3}$ it is $\frac{3\sqrt{3}}{9 \cdot 6}$, because $\sqrt{27 + 9} = 6$, and at $t = 0$ it is $0$. The particle moves $\frac{\sqrt{3}}{18}$ metres.'
        constraints: 'a^2 + x^2 in a power or under a root, a in {1, 2, 3}; substitute x = a tan(theta); the exponent on (a^2 + x^2) is 1 or 3/2, or the factor 1/x^2 sits beside the root'
      - id: kp3
        name: The pattern x^2 - a^2 and completed squares
        key_prerequisites: [trigonometric-integrals, completing-the-square-integrands]
        step_check:
          step: 'with $\theta \in [0, \pi/2)$, where $\tan\theta \ge 0$'
          question: 'Why is $\theta$ restricted to $[0, \pi/2)$ in this substitution?'
          options:
            - 'Because the substitution only works for angles whose sine is a positive number'
            - 'Because $\sec\theta$ is not defined at any angle outside this whole interval'
            - 'So that $\sqrt{\tan^2\theta}$ equals $\tan\theta$ and not $-\tan\theta$'
            - 'Because the formula for the integral of $\sec\theta$ is valid only for such angles'
          answer: 'So that $\sqrt{\tan^2\theta}$ equals $\tan\theta$ and not $-\tan\theta$'
          why: 'The root of $9\tan^2\theta$ is $3|\tan\theta|$. On $[0, \pi/2)$ the tangent is not negative, so the root is $3\tan\theta$, which matches the root of $x^2 - 9$ for $x > 3$.'
        exemplars:
          - problem: 'Evaluate $\int \frac{dx}{\sqrt{x^2 - 4}}$ for $x > 2$.'
            answer: 'ln(x+sqrt(x^2-4)) + C'
            answer_contract: {"kind": "function", "vars": ["x"], "up_to_constant": true, "domain": {"x": ["21/10", "6"]}}
            solution_sketch: 'Let $x = 2\sec\theta$ with $\theta$ in $\left[0, \frac{\pi}{2}\right)$, so $dx = 2\sec\theta\tan\theta\,d\theta$ and $\sqrt{x^2 - 4} = 2\tan\theta$. The integral is $\int \sec\theta\,d\theta = \ln(\sec\theta + \tan\theta)$. With $\sec\theta = \frac{x}{2}$ and $\tan\theta = \frac{\sqrt{x^2 - 4}}{2}$, the answer is $\ln(x + \sqrt{x^2 - 4}) + C$, after the constant $-\ln 2$ is absorbed into $C$.'
          - problem: 'Evaluate $\int \frac{\sqrt{x^2 - 9}}{x}\,dx$ for $x > 3$.'
            answer: 'sqrt(x^2-9) - 3acos(3/x) + C'
            answer_contract: {"kind": "function", "vars": ["x"], "up_to_constant": true, "domain": {"x": ["7/2", "6"]}}
            solution_sketch: 'Let $x = 3\sec\theta$, so $\sqrt{x^2 - 9} = 3\tan\theta$ and $dx = 3\sec\theta\tan\theta\,d\theta$. The integrand becomes $3\tan^2\theta = 3(\sec^2\theta - 1)$, which integrates to $3\tan\theta - 3\theta$. With $\tan\theta = \frac{\sqrt{x^2 - 9}}{3}$ and $\theta = \arccos\frac{3}{x}$, the answer is $\sqrt{x^2 - 9} - 3\arccos\frac{3}{x} + C$.'
          - problem: 'Evaluate $\int \frac{dx}{x^2\sqrt{x^2 - 4}}$ for $x > 2$.'
            answer: 'sqrt(x^2-4)/(4x) + C'
            answer_contract: {"kind": "function", "vars": ["x"], "up_to_constant": true, "domain": {"x": ["21/10", "6"]}}
            solution_sketch: 'Let $x = 2\sec\theta$, so $dx = 2\sec\theta\tan\theta\,d\theta$ and $\sqrt{x^2 - 4} = 2\tan\theta$. The integral is $\frac{1}{4}\int \cos\theta\,d\theta = \frac{\sin\theta}{4}$. With $\sin\theta = \frac{\sqrt{x^2 - 4}}{x}$, the answer is $\frac{\sqrt{x^2 - 4}}{4x} + C$.'
          - problem: 'Evaluate $\int_4^8 \frac{dx}{x\sqrt{x^2 - 16}}$.'
            answer: 'pi/12'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Let $x = 4\sec\theta$, so $dx = 4\sec\theta\tan\theta\,d\theta$ and $x\sqrt{x^2 - 16} = 16\sec\theta\tan\theta$. The integrand becomes $\frac{1}{4}\,d\theta$. The bounds are $\theta = 0$ and $\theta = \frac{\pi}{3}$, so the value is $\frac{1}{4} \cdot \frac{\pi}{3} = \frac{\pi}{12}$.'
          - problem: 'Evaluate $\int_{2\sqrt{2}}^{4} \frac{dx}{(x^2 - 4)^{3/2}}$.'
            answer: 'sqrt(2)/4 - sqrt(3)/6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Let $x = 2\sec\theta$, so $(x^2 - 4)^{3/2} = 8\tan^3\theta$ and the integrand becomes $\frac{\cos\theta}{4\sin^2\theta}\,d\theta$. An antiderivative is $-\frac{1}{4\sin\theta} = -\frac{x}{4\sqrt{x^2 - 4}}$. It equals $-\frac{\sqrt{3}}{6}$ at $x = 4$ and $-\frac{\sqrt{2}}{4}$ at $x = 2\sqrt{2}$, so the value is $\frac{\sqrt{2}}{4} - \frac{\sqrt{3}}{6}$.'
          - problem: 'Evaluate $\int \frac{dx}{(x^2 - 6x + 13)^{3/2}}$.'
            answer: '(x-3)/(4sqrt(x^2-6x+13)) + C'
            answer_contract: {"kind": "function", "vars": ["x"], "up_to_constant": true}
            solution_sketch: 'Complete the square: $x^2 - 6x + 13 = (x - 3)^2 + 4$. Let $u = x - 3$ and $u = 2\tan\theta$, so the integral is $\frac{1}{4}\int \cos\theta\,d\theta = \frac{\sin\theta}{4}$. With $\sin\theta = \frac{u}{\sqrt{u^2 + 4}}$, the answer is $\frac{x - 3}{4\sqrt{x^2 - 6x + 13}} + C$.'
          - problem: 'Evaluate $\int_3^4 \frac{dx}{(x^2 - 2x)^{3/2}}$.'
            answer: '2sqrt(3)/3 - 3sqrt(2)/4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Complete the square: $x^2 - 2x = (x - 1)^2 - 1$. With $u = x - 1$ and $u = \sec\theta$, an antiderivative is $-\frac{u}{\sqrt{u^2 - 1}} = -\frac{x - 1}{\sqrt{x^2 - 2x}}$. At $x = 4$ it is $-\frac{3\sqrt{2}}{4}$ and at $x = 3$ it is $-\frac{2\sqrt{3}}{3}$. The value is $\frac{2\sqrt{3}}{3} - \frac{3\sqrt{2}}{4}$.'
          - problem: 'Find the area of the region under $y = \frac{1}{\sqrt{x^2 - 9}}$ from $x = \frac{15}{4}$ to $x = 5$.'
            answer: 'ln(3/2)'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'An antiderivative is $\ln(x + \sqrt{x^2 - 9})$. At $x = 5$ it is $\ln(5 + 4) = \ln 9$, and at $x = \frac{15}{4}$ it is $\ln\left(\frac{15}{4} + \frac{9}{4}\right) = \ln 6$. The area is $\ln 9 - \ln 6 = \ln\frac{3}{2}$.'
          - problem: 'A cyclist has speed $v(t) = \frac{3}{t\sqrt{t^2 - 9}}$ metres per second. How far does she ride between $t = 2\sqrt{3}$ and $t = 6$ seconds?'
            answer: 'pi/6'
            answer_contract: {"kind": "unit", "quantity": "length", "unit": "m", "allow_omitted": true}
            solution_sketch: 'Let $t = 3\sec\theta$, so the integrand becomes $3 \cdot \frac{1}{3}\,d\theta = d\theta$. The bounds are $\sec\theta = \frac{2}{\sqrt{3}}$, so $\theta = \frac{\pi}{6}$, and $\sec\theta = 2$, so $\theta = \frac{\pi}{3}$. The distance is $\frac{\pi}{3} - \frac{\pi}{6} = \frac{\pi}{6}$ metres.'
          - problem: 'The depth of a trench is $d(x) = \frac{\sqrt{x^2 - 9}}{x}$ metres at a position of $x$ metres, for $3 \le x \le 6$. Find the average depth.'
            answer: '(3*sqrt(3) - pi)/3'
            answer_contract: {"kind": "unit", "quantity": "length", "unit": "m", "allow_omitted": true}
            solution_sketch: 'An antiderivative is $\sqrt{x^2 - 9} - 3\arccos\frac{3}{x}$. At $x = 6$ it is $3\sqrt{3} - 3 \cdot \frac{\pi}{3}$, and at $x = 3$ it is $0$. So the integral is $3\sqrt{3} - \pi$, and dividing by the length $3$ gives $\frac{3\sqrt{3} - \pi}{3}$ metres.'
          - problem: 'Sam sets $x = 3\sec\theta$ in $\int_3^{3\sqrt{2}} \frac{\sqrt{x^2 - 9}}{x}\,dx$ and simplifies $\sqrt{x^2 - 9}$ as $3\sec\theta - 3$. Find the correct value of the integral.'
            answer: '3 - 3*pi/4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Sam took the root of each term separately, but $\sqrt{9\sec^2\theta - 9} = 3\tan\theta$ by the identity $\sec^2\theta - 1 = \tan^2\theta$. The integrand becomes $3\tan^2\theta$, and the bounds are $\theta = 0$ and $\theta = \frac{\pi}{4}$. The value is $3\tan\theta - 3\theta$ there, which is $3 - \frac{3\pi}{4}$.'
        constraints: 'sqrt(x^2 - a^2) with x = a sec(theta) on a stated domain x > a; completed squares with integer centre and radius reduce to this pattern or to a^2 + u^2; each interval or domain is stated so the root is real'
    diagnostic_exemplar:
      problem: 'Evaluate $\int \frac{dx}{(x^2 - 4x + 8)^{3/2}}$.'
      answer: '$\frac{x - 2}{4\sqrt{x^2 - 4x + 8}} + C$'
      solution_sketch: 'Complete the square to $(x-2)^2 + 4$ and set $x - 2 = 2\tan\theta$; the integral becomes $\frac{1}{4}\int\cos\theta\,d\theta = \frac{\sin\theta}{4}$.'
    anki_seeds:
      - front: 'For $\sqrt{a^2 - x^2}$, substitute...'
        back: '$x = a\sin\theta$ (so the radical becomes $a\cos\theta$)'
        type: basic
      - front: 'For $\sqrt{a^2 + x^2}$ and $\sqrt{x^2 - a^2}$, substitute...'
        back: '$x = a\tan\theta$ and $x = a\sec\theta$ respectively'
        type: basic

  - id: partial-fractions-linear-factors
    name: Partial Fractions with Distinct Linear Factors
    core: true
    difficulty: 0.62
    drill: false
    answer_kind: numeric
    expected_time_secs: 180
    prerequisites:
      - id: rational-expressions
        weight: 0.6
        key: true
      - id: integration-substitution
        weight: 0.6
        key: true
      - id: definite-integrals-ftc
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: Decomposing into partial fractions
        key_prerequisites: [rational-expressions]
        try_first:
          problem: 'Combine $\frac{1}{x - 1} - \frac{1}{x + 1}$ into one fraction. The result has the form $\frac{k}{(x - 1)(x + 1)}$. What is $k$?'
          answer_contract: {"kind": "exact"}
          answer: '2'
          reveal: '$\frac{1}{x - 1} - \frac{1}{x + 1} = \frac{(x + 1) - (x - 1)}{(x - 1)(x + 1)} = \frac{2}{(x - 1)(x + 1)}$. A partial fraction decomposition runs this addition backwards: it splits one fraction into simpler ones.'
        step_check:
          step: 'the $B$ term vanishes'
          question: 'Why does the $B$ term vanish when $x = -2$ is put into $5x + 11 = A(x + 3) + B(x + 2)$?'
          options:
            - 'The constant $B$ is always $0$ until the value of $A$ is found'
            - 'The factor $x + 2$ multiplies $B$ and is $0$ at $x = -2$'
            - 'Both sides of the equation become $0$ at the root $x = -2$'
            - 'The factor $x + 3$ equals $0$ and removes every term at once'
          answer: 'The factor $x + 2$ multiplies $B$ and is $0$ at $x = -2$'
          why: 'The term $B(x + 2)$ contains the factor $x + 2$, which is $0$ at $x = -2$. What remains is $A(x + 3)$, so $A$ can be read off alone.'
        exemplars:
          - problem: 'Find the constants $A$ and $B$ for which $\frac{3x + 5}{(x + 1)(x + 3)} = \frac{A}{x + 1} + \frac{B}{x + 3}$.'
            answer: 'A = 1; B = 2'
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "A"}, {"contract": {"kind": "exact"}, "name": "B"}]}
            solution_sketch: 'Clearing the denominators gives $3x + 5 = A(x + 3) + B(x + 1)$. Setting $x = -1$ removes the $B$ term and leaves $A = 1$. Setting $x = -3$ removes the $A$ term and leaves $B = 2$. So $A = 1$ and $B = 2$.'
          - problem: 'Find the constants $A$ and $B$ for which $\frac{1}{x(x + 1)} = \frac{A}{x} + \frac{B}{x + 1}$.'
            answer: 'A = 1; B = -1'
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "A"}, {"contract": {"kind": "exact"}, "name": "B"}]}
            solution_sketch: 'Clearing the denominators gives $1 = A(x + 1) + Bx$. Setting $x = 0$ removes the $B$ term and leaves $A = 1$. Setting $x = -1$ removes the $A$ term and leaves $B = -1$. So $A = 1$ and $B = -1$.'
          - problem: 'Find the constants $A$ and $B$ for which $\frac{7x - 11}{(x - 1)(x - 3)} = \frac{A}{x - 1} + \frac{B}{x - 3}$.'
            answer: 'A = 2; B = 5'
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "A"}, {"contract": {"kind": "exact"}, "name": "B"}]}
            solution_sketch: 'Clearing the denominators gives $7x - 11 = A(x - 3) + B(x - 1)$. Setting $x = 1$ removes the $B$ term and leaves $A = 2$. Setting $x = 3$ removes the $A$ term and leaves $B = 5$. So $A = 2$ and $B = 5$.'
          - problem: 'A population $P$ (in thousands) satisfies $\frac{dP}{dt} = P(10 - P)$. Separating the variables gives $\int \frac{dP}{P(10 - P)} = \int dt$. To integrate the left side, write $\frac{1}{P(10 - P)} = \frac{A}{P} + \frac{B}{10 - P}$. Find $A$ and $B$.'
            answer: 'A = 1/10; B = 1/10'
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "A"}, {"contract": {"kind": "exact"}, "name": "B"}]}
            solution_sketch: 'Clearing the denominators gives $1 = A(10 - P) + BP$. Setting $P = 0$ gives $1 = 10A$, so $A = \frac{1}{10}$. Setting $P = 10$ gives $1 = 10B$, so $B = \frac{1}{10}$.'
          - problem: 'Find the constants $A$ and $B$ for which $\frac{x + 13}{(x - 5)(x - 2)} = \frac{A}{x - 5} + \frac{B}{x - 2}$.'
            answer: 'A = 6; B = -5'
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "A"}, {"contract": {"kind": "exact"}, "name": "B"}]}
            solution_sketch: 'Clearing the denominators gives $x + 13 = A(x - 2) + B(x - 5)$. Setting $x = 5$ removes the $B$ term and leaves $A = 6$. Setting $x = 2$ removes the $A$ term and leaves $B = -5$. So $A = 6$ and $B = -5$.'
          - problem: 'Sam splits $\frac{4x + 1}{(x - 1)(x + 2)}$ as $\frac{4}{x - 1} + \frac{1}{x + 2}$ by copying the coefficients of the numerator. Find the correct constants $A$ and $B$ in $\frac{4x + 1}{(x - 1)(x + 2)} = \frac{A}{x - 1} + \frac{B}{x + 2}$.'
            answer: 'A = 5/3; B = 7/3'
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "A"}, {"contract": {"kind": "exact"}, "name": "B"}]}
            solution_sketch: 'The numerator coefficients are not the constants $A$ and $B$. Clearing the denominators gives $4x + 1 = A(x + 2) + B(x - 1)$. Setting $x = 1$ gives $5 = 3A$, so $A = \frac{5}{3}$. Setting $x = -2$ gives $-7 = -3B$, so $B = \frac{7}{3}$.'
          - problem: 'In a second-order reaction the amount $x$ of product satisfies $\frac{dx}{dt} = k(2 - x)(5 - x)$. Separating the variables leads to $\int \frac{dx}{(2 - x)(5 - x)}$. Write $\frac{1}{(2 - x)(5 - x)} = \frac{A}{2 - x} + \frac{B}{5 - x}$ and find $A$ and $B$.'
            answer: 'A = 1/3; B = -1/3'
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "A"}, {"contract": {"kind": "exact"}, "name": "B"}]}
            solution_sketch: 'Clearing the denominators gives $1 = A(5 - x) + B(2 - x)$. Setting $x = 2$ gives $1 = 3A$, so $A = \frac{1}{3}$. Setting $x = 5$ gives $1 = -3B$, so $B = -\frac{1}{3}$.'
          - problem: 'Maya wants the sum $\frac{1}{1 \cdot 2} + \frac{1}{2 \cdot 3} + \frac{1}{3 \cdot 4} + \cdots + \frac{1}{99 \cdot 100}$. She notices that each term has the form $\frac{1}{n(n + 1)}$ and splits it into two fractions. Find the sum.'
            answer: '99/100'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Splitting gives $\frac{1}{n(n + 1)} = \frac{1}{n} - \frac{1}{n + 1}$. In the sum, each $-\frac{1}{n + 1}$ cancels the next term $+\frac{1}{n + 1}$. Only the first and last pieces remain: $1 - \frac{1}{100} = \frac{99}{100}$.'
          - problem: 'Find the constants $A$ and $B$ for which $\frac{2x - 14}{(x + 2)(x - 4)} = \frac{A}{x + 2} + \frac{B}{x - 4}$.'
            answer: 'A = 3; B = -1'
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "A"}, {"contract": {"kind": "exact"}, "name": "B"}]}
            solution_sketch: 'Clearing the denominators gives $2x - 14 = A(x - 4) + B(x + 2)$. Setting $x = -2$ removes the $B$ term and leaves $A = 3$. Setting $x = 4$ removes the $A$ term and leaves $B = -1$. So $A = 3$ and $B = -1$.'
        constraints: "two distinct linear factors with integer roots; numerator degree <= 1; coefficients found by plugging in roots (cover-up)"
      - id: kp2
        name: Integrating distinct linear factors
        key_prerequisites: [rational-expressions, integration-substitution]
        step_check:
          step: 'multiply both sides by $(x-1)(x+2)$'
          question: 'Why do we multiply both sides by $(x-1)(x+2)$?'
          options:
            - 'To make the numerator of the fraction equal to $1$ on both sides'
            - 'To cancel the constants $A$ and $B$ from both sides of it'
            - 'To clear the denominators and leave polynomials only'
            - 'To find the two roots of the denominator without solving'
          answer: 'To clear the denominators and leave polynomials only'
          why: 'Multiplying by the full denominator removes every fraction. We are left with $2x + 7 = A(x + 2) + B(x - 1)$, which holds for every $x$, so we may substitute the roots.'
        exemplars:
          - problem: 'Find $\int \frac{5x - 4}{(x - 2)(x + 1)}\,dx$ for $x > 2$.'
            answer: '2 ln(x - 2) + 3 ln(x + 1)'
            answer_contract: {"kind": "function", "vars": ["x"], "up_to_constant": true, "domain": {"x": ["2.5", "9"]}}
            solution_sketch: 'Write $\frac{5x - 4}{(x - 2)(x + 1)} = \frac{A}{x - 2} + \frac{B}{x + 1}$. Setting $x = 2$ gives $A = 2$, and setting $x = -1$ gives $B = 3$. Each term integrates to a logarithm, so the antiderivative is $2\ln(x - 2) + 3\ln(x + 1) + C$.'
          - problem: 'Find $\int \frac{1}{(x - 2)(x + 4)}\,dx$ for $x > 2$.'
            answer: '(1/6) ln(x - 2) - (1/6) ln(x + 4)'
            answer_contract: {"kind": "function", "vars": ["x"], "up_to_constant": true, "domain": {"x": ["2.5", "9"]}}
            solution_sketch: 'Write $\frac{1}{(x - 2)(x + 4)} = \frac{A}{x - 2} + \frac{B}{x + 4}$. Setting $x = 2$ gives $A = \frac{1}{6}$, and setting $x = -4$ gives $B = - \frac{1}{6}$. Each term integrates to a logarithm, so the antiderivative is $\frac{1}{6}\ln(x - 2) - \frac{1}{6}\ln(x + 4) + C$.'
          - problem: 'A particle moves along a line with velocity $v(t) = \frac{5t + 7}{(t + 1)(t + 2)}$ metres per second for $t \ge 0$, and its position at $t = 0$ is $s(0) = 0$. Find its position $s(t)$ in metres.'
            answer: '2 ln(t+1) + 3 ln(t+2) - 3 ln(2)'
            answer_contract: {"kind": "function", "vars": ["t"], "domain": {"t": ["1.1", "9.3"]}}
            solution_sketch: 'The position is an antiderivative of the velocity. Partial fractions give $\frac{5t + 7}{(t + 1)(t + 2)} = \frac{2}{t + 1} + \frac{3}{t + 2}$, so $s(t) = 2\ln(t + 1) + 3\ln(t + 2) + K$. Since $s(0) = 3\ln 2 + K = 0$, we get $K = -3\ln 2$ and $s(t) = 2\ln(t + 1) + 3\ln(t + 2) - 3\ln 2$.'
          - problem: 'A fraction has denominator $(x - 2)(x + 7)$. For $x > 2$ its antiderivative is $3\ln(x - 2) + 4\ln(x + 7) + C$. Find the numerator of the fraction.'
            answer: '7x + 13'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Differentiating the antiderivative gives the fraction: $\frac{3}{x - 2} + \frac{4}{x + 7}$. Over the common denominator this is $\frac{3(x + 7) + 4(x - 2)}{(x - 2)(x + 7)}$. The numerator is $3x + 21 + 4x - 8 = 7x + 13$.'
          - problem: 'Find $\int \frac{4}{x(x - 4)}\,dx$ for $x > 4$.'
            answer: '-ln(x) + ln(x - 4)'
            answer_contract: {"kind": "function", "vars": ["x"], "up_to_constant": true, "domain": {"x": ["4.5", "9"]}}
            solution_sketch: 'Write $\frac{4}{x(x - 4)} = \frac{A}{x} + \frac{B}{x - 4}$. Setting $x = 0$ gives $A = -1$, and setting $x = 4$ gives $B = 1$. Each term integrates to a logarithm, so the antiderivative is $-\ln(x) + \ln(x - 4) + C$.'
          - problem: 'Find $\int \frac{4x + 22}{(x - 5)(x + 1)}\,dx$ for $x > 5$.'
            answer: '7 ln(x - 5) - 3 ln(x + 1)'
            answer_contract: {"kind": "function", "vars": ["x"], "up_to_constant": true, "domain": {"x": ["5.5", "9"]}}
            solution_sketch: 'Write $\frac{4x + 22}{(x - 5)(x + 1)} = \frac{A}{x - 5} + \frac{B}{x + 1}$. Setting $x = 5$ gives $A = 7$, and setting $x = -1$ gives $B = -3$. Each term integrates to a logarithm, so the antiderivative is $7\ln(x - 5) - 3\ln(x + 1) + C$.'
          - problem: 'In a reaction the amount $x$ of product (in moles) satisfies $\frac{dx}{dt} = (2 - x)(3 - x)$ with $x = 0$ at time $t = 0$ hours. Find the time $t$ at which the amount of product is $x$, for $0 \le x < 2$.'
            answer: 'ln((3-x)/(2-x)) - ln(3/2)'
            answer_contract: {"kind": "function", "vars": ["x"], "domain": {"x": ["0.3", "1.7"]}}
            solution_sketch: 'Separating the variables gives $t = \int \frac{dx}{(2 - x)(3 - x)}$. Partial fractions give $\frac{1}{(2 - x)(3 - x)} = \frac{1}{2 - x} - \frac{1}{3 - x}$, so $t = -\ln(2 - x) + \ln(3 - x) + K$. Since $t = 0$ at $x = 0$, $K = -\ln\frac{3}{2}$, so $t = \ln\frac{3 - x}{2 - x} - \ln\frac{3}{2}$.'
          - problem: 'Sam splits $\frac{1}{(x - 1)(x + 2)}$ as $\frac{1}{x - 1} + \frac{1}{x + 2}$ and integrates. What is the correct antiderivative for $x > 1$?'
            answer: '(1/3) ln(x-1) - (1/3) ln(x+2)'
            answer_contract: {"kind": "function", "vars": ["x"], "up_to_constant": true, "domain": {"x": ["1.5", "9"]}}
            solution_sketch: 'Sam''s two fractions add to $\frac{2x + 1}{(x - 1)(x + 2)}$, not $\frac{1}{(x - 1)(x + 2)}$. The correct split is $\frac{1}{3}\cdot\frac{1}{x - 1} - \frac{1}{3}\cdot\frac{1}{x + 2}$, from $A = \frac{1}{3}$ at $x = 1$ and $B = -\frac{1}{3}$ at $x = -2$. So the antiderivative is $\frac{1}{3}\ln(x - 1) - \frac{1}{3}\ln(x + 2) + C$.'
        constraints: "denominator = product of two distinct linear factors with integer roots; numerator degree <= 1"
      - id: kp3
        name: Definite integrals with partial fractions
        key_prerequisites: [integration-substitution, definite-integrals-ftc]
        step_check:
          step: 'Subtract and combine'
          question: 'Why is the value at the lower bound subtracted from the value at the upper bound?'
          options:
            - 'The two logarithms always have opposite signs, so one is subtracted'
            - 'The lower bound is smaller, so it is removed to avoid double counting'
            - 'The constant $C$ appears twice, and subtracting makes it cancel out'
            - 'The integral equals $F(b) - F(a)$ for an antiderivative $F$'
          answer: 'The integral equals $F(b) - F(a)$ for an antiderivative $F$'
          why: 'By the Fundamental Theorem of Calculus, $\int_a^b f\,dx = F(b) - F(a)$. Here $F = \ln\frac{x + 2}{x + 3}$, so we subtract its value at $0$ from its value at $1$.'
        exemplars:
          - problem: 'Evaluate $\int_{0}^{1} \frac{1}{(x + 1)(x + 2)}\,dx$ to three decimal places.'
            answer: '0.288'
            answer_contract: {"kind": "approx", "decimals": 3}
            solution_sketch: 'Write the integrand as $\frac{1}{x + 1} - \frac{1}{x + 2}$ using the cover-up method. Its antiderivative is $\ln(x + 1) - \ln(x + 2)$. Evaluating from $0$ to $1$ gives $\ln\frac{4}{3}$, which is about $0.288$.'
          - problem: 'Evaluate $\int_{1}^{3} \frac{1}{x(x + 1)}\,dx$ to three decimal places.'
            answer: '0.405'
            answer_contract: {"kind": "approx", "decimals": 3}
            solution_sketch: 'Write the integrand as $\frac{1}{x} - \frac{1}{x + 1}$ using the cover-up method. Its antiderivative is $\ln(x) - \ln(x + 1)$. Evaluating from $1$ to $3$ gives $\ln\frac{3}{2}$, which is about $0.405$.'
          - problem: 'Find the positive number $b$ for which $\int_0^b \frac{dx}{(x + 2)(x + 3)} = \ln\frac{5}{4}$.'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Partial fractions give $\frac{1}{(x + 2)(x + 3)} = \frac{1}{x + 2} - \frac{1}{x + 3}$, so the integral is $\ln\frac{b + 2}{b + 3} - \ln\frac{2}{3} = \ln\frac{3(b + 2)}{2(b + 3)}$. Setting $\frac{3(b + 2)}{2(b + 3)} = \frac{5}{4}$ gives $12b + 24 = 10b + 30$, so $b = 3$.'
          - problem: 'A tank drains at the rate $\frac{60}{(t + 1)(t + 2)}$ litres per minute, where $t$ is in minutes. Find, to three decimal places, how many litres drain between $t = 2$ and $t = 3$.'
            answer: '3.872'
            answer_contract: {"kind": "approx", "decimals": 3}
            solution_sketch: 'The volume drained is the integral of the rate. Since $\frac{60}{(t + 1)(t + 2)} = \frac{60}{t + 1} - \frac{60}{t + 2}$, the antiderivative is $60\ln\frac{t + 1}{t + 2}$. From $t = 2$ to $t = 3$ this gives $60\ln\frac{16}{15}$, which is about $3.872$ litres.'
          - problem: 'The average value of a function $f$ on $[a, b]$ is $\frac{1}{b - a}\int_a^b f(x)\,dx$. Find the average value of $f(x) = \frac{1}{(x + 1)(x + 2)}$ on $[0, 2]$, to three decimal places.'
            answer: '0.203'
            answer_contract: {"kind": "approx", "decimals": 3}
            solution_sketch: 'First find the integral. Since $\frac{1}{(x + 1)(x + 2)} = \frac{1}{x + 1} - \frac{1}{x + 2}$, the integral over $[0, 2]$ is $\ln\frac{3}{4} - \ln\frac{1}{2} = \ln\frac{3}{2}$. The interval has length $2$, so the average value is $\frac{1}{2}\ln\frac{3}{2}$, which is about $0.203$.'
          - problem: 'Find the area under the curve $y = \frac{6}{(x + 1)(x + 3)}$ from $x = 1$ to $x = 3$, to three decimal places.'
            answer: '0.863'
            answer_contract: {"kind": "approx", "decimals": 3}
            solution_sketch: 'The area is the integral of $y$. Since $\frac{6}{(x + 1)(x + 3)} = \frac{3}{x + 1} - \frac{3}{x + 3}$, the antiderivative is $3\ln\frac{x + 1}{x + 3}$. From $x = 1$ to $x = 3$ this is $3\ln\frac{4}{6} - 3\ln\frac{2}{4} = 3\ln\frac{4}{3}$, about $0.863$ square units.'
          - problem: 'Evaluate $\int_{2}^{4} \frac{x + 5}{(x - 1)(x + 1)}\,dx$ to three decimal places.'
            answer: '2.274'
            answer_contract: {"kind": "approx", "decimals": 3}
            solution_sketch: 'Write the integrand as $\frac{3}{x - 1} - \frac{2}{x + 1}$ using the cover-up method. Its antiderivative is $3\ln(x - 1) - 2\ln(x + 1)$. Evaluating from $2$ to $4$ gives $\ln\frac{243}{25}$, which is about $2.274$.'
          - problem: 'Water flows into a reservoir at the rate $\frac{30}{(t + 2)(t + 5)}$ thousand litres per day. Find, to three decimal places, how many thousand litres flow in during the first $4$ days.'
            answer: '5.108'
            answer_contract: {"kind": "approx", "decimals": 3}
            solution_sketch: 'Since $\frac{30}{(t + 2)(t + 5)} = \frac{10}{t + 2} - \frac{10}{t + 5}$, the antiderivative is $10\ln\frac{t + 2}{t + 5}$. From $t = 0$ to $t = 4$ this gives $10\ln\frac{6}{9} - 10\ln\frac{2}{5} = 10\ln\frac{5}{3}$, which is about $5.108$ thousand litres.'
        constraints: "bounds avoid all roots of the denominator; logarithmic values are rounded to three decimals, rational values stay exact"
    diagnostic_exemplar:
      problem: 'Evaluate $\int_2^3 \frac{dx}{x(x - 1)}$.'
      answer: '$\ln\frac{4}{3}$'
      solution_sketch: '$\frac{1}{x(x-1)} = \frac{1}{x-1} - \frac{1}{x}$; $[\ln|x-1| - \ln|x|]_2^3 = (\ln 2 - \ln 3) - (0 - \ln 2) = \ln\frac{4}{3}$.'
    anki_seeds:
      - front: "Cover-up method: to find A in A/(x - a) for distinct linear factors..."
        back: "multiply through by (x - a), then set x = a in what remains"
        type: basic
      - front: '$\int \frac{dx}{x - a} = $ ?'
        back: '$\ln|x - a| + C$'
        type: basic

  - id: partial-fractions-integration
    name: Integration by Partial Fractions
    core: true
    difficulty: 0.7
    drill: false
    answer_kind: numeric
    expected_time_secs: 240
    prerequisites:
      - id: partial-fractions-linear-factors
        weight: 0.8
        key: true
      - id: polynomial-division
        weight: 0.5
        key: true
      - id: integration-substitution
        weight: 0.4
      - id: derivatives-exp-log
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: Repeated linear factors
        key_prerequisites: [partial-fractions-linear-factors]
        try_first:
          problem: 'Write $\frac{1}{x + 1} + \frac{3}{(x + 1)^2}$ as one fraction over $(x + 1)^2$. The numerator has the form $x + k$. What is $k$?'
          answer_contract: {"kind": "exact"}
          answer: '4'
          reveal: '$\frac{1}{x + 1} + \frac{3}{(x + 1)^2} = \frac{(x + 1) + 3}{(x + 1)^2} = \frac{x + 4}{(x + 1)^2}$. A fraction over $(x + 1)^2$ with a numerator of degree $1$ comes from two terms, one for each power of $x + 1$.'
        step_check:
          step: 'linear and repeated'
          question: 'Why does the repeated factor $(x + 2)^2$ need two terms, $\frac{A}{x + 2}$ and $\frac{B}{(x + 2)^2}$?'
          options:
            - 'The factor $(x + 2)^2$ has two roots, so each root needs its own separate term'
            - 'Each power of the factor must be integrated by a different rule, one per term'
            - 'A lone $\frac{B}{(x + 2)^2}$ has a constant numerator, but $3x + 5$ does not'
            - 'The term $\frac{A}{x + 2}$ is needed to produce the logarithm in the answer'
          answer: 'A lone $\frac{B}{(x + 2)^2}$ has a constant numerator, but $3x + 5$ does not'
          why: 'A single term $\frac{B}{(x + 2)^2}$ has a constant numerator, so it cannot match $3x + 5$. Including $\frac{A}{x + 2}$ as well gives the numerator $A(x + 2) + B$, which has degree $1$.'
        exemplars:
          - problem: 'Find $\int \frac{2x + 3}{(x + 1)^2}\,dx$ for $x > -1$.'
            answer: '2 ln(x + 1) - 1/(x + 1)'
            answer_contract: {"kind": "function", "vars": ["x"], "up_to_constant": true, "domain": {"x": ["-0.6", "9.3"]}}
            solution_sketch: 'Write $\frac{2x + 3}{(x + 1)^2} = \frac{A}{x + 1} + \frac{B}{(x + 1)^2}$, so $2x + 3 = A(x + 1) + B$. Matching the $x$ coefficients gives $A = 2$, and setting $x = -1$ gives $B = 1$. Then $\int \frac{2}{x + 1}\,dx = 2\ln(x + 1)$ and $\int \frac{1}{(x + 1)^2}\,dx = -\frac{1}{x + 1}$, so the antiderivative is $2\ln(x + 1) - \frac{1}{x + 1} + C$.'
          - problem: 'Find $\int \frac{1}{x^2(x + 1)}\,dx$ for $x > 0$.'
            answer: '-ln(x) - 1/x + ln(x+1)'
            answer_contract: {"kind": "function", "vars": ["x"], "up_to_constant": true, "domain": {"x": ["0.3", "9.3"]}}
            solution_sketch: 'Because $x$ is repeated, write $\frac{1}{x^2(x + 1)} = \frac{A}{x} + \frac{B}{x^2} + \frac{D}{x + 1}$, so $1 = Ax(x + 1) + B(x + 1) + Dx^2$. Setting $x = 0$ gives $B = 1$, and setting $x = -1$ gives $D = 1$. Matching the $x^2$ coefficients gives $A + D = 0$, so $A = -1$. Integrating each term gives $-\ln x - \frac{1}{x} + \ln(x + 1) + C$.'
          - problem: 'Find the constants $A$ and $B$ for which $\frac{5x + 6}{(x + 2)^2} = \frac{A}{x + 2} + \frac{B}{(x + 2)^2}$.'
            answer: 'A = 5; B = -4'
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "A"}, {"contract": {"kind": "exact"}, "name": "B"}]}
            solution_sketch: 'Write $\frac{5x + 6}{(x + 2)^2} = \frac{A}{x + 2} + \frac{B}{(x + 2)^2}$, so $5x + 6 = A(x + 2) + B$. Matching the $x$ coefficients gives $A = 5$, and setting $x = -2$ gives $B = -4$. So $A = 5$ and $B = -4$.'
          - problem: 'A particle moves along a line with velocity $v(t) = \frac{4t + 5}{(t + 1)^2}$ metres per second for $t \ge 0$, and $s(0) = 0$. Find its position $s(t)$ in metres.'
            answer: '4 ln(t+1) - 1/(t+1) + 1'
            answer_contract: {"kind": "function", "vars": ["t"], "domain": {"t": ["1.1", "9.3"]}}
            solution_sketch: 'The position is an antiderivative of the velocity. Since $4t + 5 = 4(t + 1) + 1$, we have $\frac{4t + 5}{(t + 1)^2} = \frac{4}{t + 1} + \frac{1}{(t + 1)^2}$. Integrating gives $s(t) = 4\ln(t + 1) - \frac{1}{t + 1} + K$. Since $s(0) = -1 + K = 0$, $K = 1$, so $s(t) = 4\ln(t + 1) - \frac{1}{t + 1} + 1$.'
          - problem: 'Find $\int \frac{3x + 4}{(x + 2)^2}\,dx$ for $x > -2$.'
            answer: '3 ln(x + 2) + 2/(x + 2)'
            answer_contract: {"kind": "function", "vars": ["x"], "up_to_constant": true, "domain": {"x": ["-1.6", "9.3"]}}
            solution_sketch: 'Write $\frac{3x + 4}{(x + 2)^2} = \frac{A}{x + 2} + \frac{B}{(x + 2)^2}$, so $3x + 4 = A(x + 2) + B$. Matching the $x$ coefficients gives $A = 3$, and setting $x = -2$ gives $B = -2$. Then $\int \frac{3}{x + 2}\,dx = 3\ln(x + 2)$ and $\int \frac{-2}{(x + 2)^2}\,dx = \frac{2}{x + 2}$, so the antiderivative is $3\ln(x + 2) + \frac{2}{x + 2} + C$.'
          - problem: 'Sam writes $\frac{3x + 4}{(x - 1)^2} = \frac{3}{x - 1} + \frac{4}{(x - 1)^2}$ by copying the numerator coefficients. Find the correct constants $A$ and $B$ in $\frac{3x + 4}{(x - 1)^2} = \frac{A}{x - 1} + \frac{B}{(x - 1)^2}$.'
            answer: 'A = 3; B = 7'
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "A"}, {"contract": {"kind": "exact"}, "name": "B"}]}
            solution_sketch: 'Write $\frac{3x + 4}{(x - 1)^2} = \frac{A}{x - 1} + \frac{B}{(x - 1)^2}$, so $3x + 4 = A(x - 1) + B$. Matching the $x$ coefficients gives $A = 3$, and setting $x = 1$ gives $B = 7$. So $A = 3$ and $B = 7$.'
          - problem: 'Find $\int \frac{2x + 1}{x(x + 1)^2}\,dx$ for $x > 0$.'
            answer: 'ln(x) - ln(x+1) - 1/(x+1)'
            answer_contract: {"kind": "function", "vars": ["x"], "up_to_constant": true, "domain": {"x": ["0.3", "9.3"]}}
            solution_sketch: 'Write $\frac{2x + 1}{x(x + 1)^2} = \frac{A}{x} + \frac{B}{x + 1} + \frac{D}{(x + 1)^2}$. Setting $x = 0$ gives $A = 1$, and setting $x = -1$ gives $-1 = -D$, so $D = 1$. Matching the $x^2$ coefficients gives $A + B = 0$, so $B = -1$. Integrating gives $\ln x - \ln(x + 1) - \frac{1}{x + 1} + C$.'
          - problem: 'A drug enters the bloodstream at the rate $\frac{3t + 4}{(t + 2)^2}$ milligrams per hour, where $t$ is in hours. Find, to three decimal places, how many milligrams enter during the first $2$ hours.'
            answer: '1.579'
            answer_contract: {"kind": "approx", "decimals": 3}
            solution_sketch: 'The amount is the integral of the rate. Since $3t + 4 = 3(t + 2) - 2$, the rate equals $\frac{3}{t + 2} - \frac{2}{(t + 2)^2}$, with antiderivative $3\ln(t + 2) + \frac{2}{t + 2}$. From $t = 0$ to $t = 2$ this gives $\left(3\ln 4 + \frac{1}{2}\right) - \left(3\ln 2 + 1\right) = 3\ln 2 - \frac{1}{2}$, about $1.579$ milligrams.'
          - problem: 'Find the constants $A$ and $B$ for which $\frac{5x - 1}{(x - 3)^2} = \frac{A}{x - 3} + \frac{B}{(x - 3)^2}$.'
            answer: 'A = 5; B = 14'
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "A"}, {"contract": {"kind": "exact"}, "name": "B"}]}
            solution_sketch: 'Write $\frac{5x - 1}{(x - 3)^2} = \frac{A}{x - 3} + \frac{B}{(x - 3)^2}$, so $5x - 1 = A(x - 3) + B$. Matching the $x$ coefficients gives $A = 5$, and setting $x = 3$ gives $B = 14$. So $A = 5$ and $B = 14$.'
        constraints: "one repeated linear factor of multiplicity 2; total denominator degree <= 3"
      - id: kp2
        name: Improper fractions (divide first)
        key_prerequisites: [polynomial-division, partial-fractions-linear-factors]
        step_check:
          step: 'Divide first'
          question: 'Why must $x^3$ be divided by $x^2 - 1$ before partial fractions are used?'
          options:
            - 'Division removes the logarithms, so the power rule alone finishes the integral'
            - 'Partial fractions need a numerator of lower degree than the denominator'
            - 'Partial fractions are never allowed when the numerator contains the term $x^3$'
            - 'The division is needed only because the denominator $x^2 - 1$ can be factored'
          answer: 'Partial fractions need a numerator of lower degree than the denominator'
          why: 'Terms such as $\frac{A}{x - 1}$ have a constant numerator, so they can only add up to a fraction whose numerator has lower degree than its denominator. Division first leaves such a remainder.'
        exemplars:
          - problem: 'Evaluate $\int_0^2 \frac{4x^2 + 6x + 3}{x^2 + 3x + 2}\,dx$ to four decimal places.'
            answer: '4.2466'
            answer_contract: {"kind": "approx", "decimals": 4}
            solution_sketch: 'The numerator and denominator both have degree $2$, so divide first: $4x^2 + 6x + 3 = 4(x^2 + 3x + 2) + (-6x - 5)$. The remainder fraction splits as $\frac{-6x - 5}{(x + 1)(x + 2)} = \frac{1}{x + 1} - \frac{7}{x + 2}$. So the antiderivative is $4x + \ln(x + 1) - 7\ln(x + 2)$, and from $0$ to $2$ it gives $8 + \ln\frac{3}{128}$, about 4.2466.'
          - problem: 'Evaluate $\int_2^3 \frac{x^3 - 3x^2 - 4x + 3}{x^2 - 5x + 4}\,dx$.'
            answer: '9/2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The numerator has degree $3$ and the denominator has degree $2$, so divide first: $x^3 - 3x^2 - 4x + 3 = (x + 2)(x^2 - 5x + 4) + (2x - 5)$. The remainder fraction $\frac{2x - 5}{x^2 - 5x + 4}$ has the derivative of the denominator on top, so it integrates to $\ln|x^2 - 5x + 4|$. This equals $\ln 2$ at both $x = 2$ and $x = 3$, so it contributes $0$. The rest is $\int_2^3 (x + 2)\,dx = \frac{9}{2}$.'
          - problem: 'Find $\int \frac{x^2 + 3x + 3}{(x + 1)(x + 2)}\,dx$ for $x > -1$.'
            answer: 'x + ln(x+1) - ln(x+2)'
            answer_contract: {"kind": "function", "vars": ["x"], "up_to_constant": true, "domain": {"x": ["-0.6", "9.3"]}}
            solution_sketch: 'The numerator and denominator both have degree $2$, so divide first: $x^2 + 3x + 3 = (x^2 + 3x + 2) + 1$. The integrand is $1 + \frac{1}{(x + 1)(x + 2)} = 1 + \frac{1}{x + 1} - \frac{1}{x + 2}$. Integrating gives $x + \ln(x + 1) - \ln(x + 2) + C$.'
          - problem: 'A particle moves along a line with velocity $v(t) = \frac{3t^2 + 10t + 5}{t^2 + 3t + 2}$ metres per second. Find its displacement in metres from $t = 0$ to $t = 4$, to four decimal places.'
            answer: '12.0770'
            answer_contract: {"kind": "approx", "decimals": 4}
            solution_sketch: 'Displacement is the integral of the velocity. The numerator and denominator both have degree $2$, so divide first: $3t^2 + 10t + 5 = 3(t^2 + 3t + 2) + (t - 1)$. The remainder fraction splits as $\frac{t - 1}{(t + 1)(t + 2)} = \frac{-2}{t + 1} + \frac{3}{t + 2}$. The antiderivative is $3t - 2\ln(t + 1) + 3\ln(t + 2)$, and from $0$ to $4$ it gives $12 + \ln\frac{27}{25}$, about 12.0770 metres.'
          - problem: 'Evaluate $\int_3^5 \frac{3x^3 + 5x^2 - 25x + 18}{x^2 + 2x - 8}\,dx$ to four decimal places.'
            answer: '23.9459'
            answer_contract: {"kind": "approx", "decimals": 4}
            solution_sketch: 'The numerator has degree $3$ and the denominator has degree $2$, so divide first: $3x^3 + 5x^2 - 25x + 18 = (3x - 1)(x^2 + 2x - 8) + (x + 10)$. The remainder fraction splits as $\frac{x + 10}{(x - 2)(x + 4)} = \frac{2}{x - 2} - \frac{1}{x + 4}$. The antiderivative is $\frac{3x^2}{2} - x + 2\ln(x - 2) - \ln(x + 4)$, and from $3$ to $5$ it gives $22 + \ln 7$, about 23.9459.'
          - problem: 'A particle moves along a line with velocity $v(t) = \frac{5t^2 - 13t - 23}{t^2 - 3t - 4}$ metres per second. Find its displacement in metres from $t = 0$ to $t = 3$.'
            answer: '15'
            answer_contract: {"kind": "unit", "quantity": "length", "unit": "m", "allow_omitted": true}
            solution_sketch: 'Displacement is the integral of the velocity. Divide first: $5t^2 - 13t - 23 = 5(t^2 - 3t - 4) + (2t - 3)$. The remainder fraction $\frac{2t - 3}{t^2 - 3t - 4}$ has the derivative of the denominator on top, so it integrates to $\ln|t^2 - 3t - 4|$. This equals $\ln 4$ at both $t = 0$ and $t = 3$, so it contributes $0$. The rest is $\int_0^3 5\,dt = 15$, so the displacement is $15$ metres.'
          - problem: 'A particle moves along a line with velocity $v(t) = \frac{3t^2 - 5t - 18}{t^2 - 3t - 4}$ metres per second. Find its average velocity from $t = 0$ to $t = 3$.'
            answer: '3'
            answer_contract: {"kind": "unit", "quantity": "speed", "unit": "m/s", "allow_omitted": true}
            solution_sketch: 'Average velocity is the displacement divided by the elapsed time. Divide first: $3t^2 - 5t - 18 = 3(t^2 - 3t - 4) + (4t - 6)$. The remainder fraction integrates to $2\ln|t^2 - 3t - 4|$, which equals $2\ln 4$ at both ends, so it contributes $0$. The displacement is $\int_0^3 3\,dt = 9$ metres, and dividing by $3$ seconds gives $3$ metres per second.'
          - problem: 'Evaluate $\int_0^1 \frac{4x^2 + x + 5}{2x^2 + 7x + 3}\,dx$ to four decimal places.'
            answer: '1.0221'
            answer_contract: {"kind": "approx", "decimals": 4}
            solution_sketch: 'The numerator and denominator both have degree $2$, so divide first: $4x^2 + x + 5 = 2(2x^2 + 7x + 3) + (-13x - 1)$. The remainder fraction splits as $\frac{-13x - 1}{(2x + 1)(x + 3)} = \frac{11}{5(2x + 1)} - \frac{38}{5(x + 3)}$. So the antiderivative is $2x + \frac{11}{10}\ln(2x + 1) - \frac{38}{5}\ln(x + 3)$, and from $0$ to $1$ it gives about 1.0221.'
        constraints: "numerator degree >= denominator degree; quotient is degree <= 1; remainder decomposes over distinct linear factors"
      - id: kp3
        name: Irreducible quadratic factors
        key_prerequisites: [partial-fractions-linear-factors, integration-substitution]
        step_check:
          step: 'since $x^2+4$ is irreducible'
          question: 'Why is the numerator over $x^2 + 4$ written as $Bx + C$ and not as a constant?'
          options:
            - 'Because $x^2 + 4$ has two real roots, one root for $B$ and one root for $C$'
            - 'Because $C$ is needed to produce the logarithm in the final answer'
            - 'Because $Bx + C$ is always the derivative of the quadratic $x^2 + 4$'
            - 'Because an unfactorable quadratic can have a numerator of degree $1$'
          answer: 'Because an unfactorable quadratic can have a numerator of degree $1$'
          why: 'A quadratic factor with no real roots cannot be split into linear factors. The numerator over it may have degree $1$, one less than the quadratic, so it is written $Bx + C$.'
        exemplars:
          - problem: 'Evaluate $\int_1^2 \frac{dx}{x(x^2 + 1)}$ to four decimal places.'
            answer: '0.2350'
            answer_contract: {"kind": "approx", "decimals": 4}
            solution_sketch: 'Because $x^2 + 1$ is irreducible, write $\frac{1}{x(x^2 + 1)} = \frac{A}{x} + \frac{Bx + C}{x^2 + 1}$. This gives $A = 1$, $B = -1$ and $C = 0$, so the integrand is $\frac{1}{x} - \frac{x}{x^2 + 1}$. The antiderivative is $\ln x - \frac{1}{2}\ln(x^2 + 1)$, and from $1$ to $2$ it gives $\frac{3}{2}\ln 2 - \frac{1}{2}\ln 5$, about 0.2350.'
          - problem: 'Find the constants $A$, $B$ and $C$ for which $\frac{5}{(x + 2)(x^2 + 1)} = \frac{A}{x + 2} + \frac{Bx + C}{x^2 + 1}$.'
            answer: 'A = 1; B = -1; C = 2'
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "A"}, {"contract": {"kind": "exact"}, "name": "B"}, {"contract": {"kind": "exact"}, "name": "C"}]}
            solution_sketch: 'Clearing the denominators gives $5 = A(x^2 + 1) + (Bx + C)(x + 2)$. Setting $x = -2$ gives $5 = 5A$, so $A = 1$. Matching the $x^2$ coefficients gives $A + B = 0$, so $B = -1$, and matching the constant terms gives $A + 2C = 5$, so $C = 2$.'
          - problem: 'Find $\int \frac{dx}{x(x^2 + 1)}$ for $x > 0$.'
            answer: 'ln(x) - (1/2) ln(x^2+1)'
            answer_contract: {"kind": "function", "vars": ["x"], "up_to_constant": true, "domain": {"x": ["0.3", "9.3"]}}
            solution_sketch: 'Write $\frac{1}{x(x^2 + 1)} = \frac{A}{x} + \frac{Bx + C}{x^2 + 1}$. Setting $x = 0$ gives $A = 1$. Matching the $x^2$ coefficients gives $A + B = 0$, so $B = -1$, and matching the $x$ coefficients gives $C = 0$. The integrand is $\frac{1}{x} - \frac{x}{x^2 + 1}$, and the substitution $u = x^2 + 1$ gives $\ln x - \frac{1}{2}\ln(x^2 + 1) + K$.'
          - problem: 'Evaluate $\int_1^4 \frac{4}{x(x^2 + 4)}\,dx$ to four decimal places.'
            answer: '0.6931'
            answer_contract: {"kind": "approx", "decimals": 4}
            solution_sketch: 'Because $x^2 + 4$ is irreducible, write $\frac{4}{x(x^2 + 4)} = \frac{A}{x} + \frac{Bx + C}{x^2 + 4}$. This gives $A = 1$, $B = -1$ and $C = 0$. The antiderivative is $\ln x - \frac{1}{2}\ln(x^2 + 4)$, and from $1$ to $4$ it gives $\ln 4 - \frac{1}{2}\ln 20 + \frac{1}{2}\ln 5 = \ln 2$, about 0.6931.'
          - problem: 'Evaluate $\int_1^4 \frac{x^2 + 1}{x(x^2 + 4)}\,dx$ to four decimal places.'
            answer: '0.8664'
            answer_contract: {"kind": "approx", "decimals": 4}
            solution_sketch: 'Write $\frac{x^2 + 1}{x(x^2 + 4)} = \frac{A}{x} + \frac{Bx + C}{x^2 + 4}$. Setting $x = 0$ gives $A = \frac{1}{4}$, then $A + B = 1$ gives $B = \frac{3}{4}$, and $C = 0$. The antiderivative is $\frac{1}{4}\ln x + \frac{3}{8}\ln(x^2 + 4)$, and from $1$ to $4$ it gives $\frac{5}{4}\ln 2$, about 0.8664.'
          - problem: 'Find the constants $A$, $B$ and $C$ for which $\frac{2x}{(x - 1)(x^2 + 4)} = \frac{A}{x - 1} + \frac{Bx + C}{x^2 + 4}$.'
            answer: 'A = 2/5; B = -2/5; C = 8/5'
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "A"}, {"contract": {"kind": "exact"}, "name": "B"}, {"contract": {"kind": "exact"}, "name": "C"}]}
            solution_sketch: 'Clearing the denominators gives $2x = A(x^2 + 4) + (Bx + C)(x - 1)$. Setting $x = 1$ gives $2 = 5A$, so $A = \frac{2}{5}$. Matching the $x^2$ coefficients gives $A + B = 0$, so $B = -\frac{2}{5}$. Matching the constant terms gives $4A - C = 0$, so $C = \frac{8}{5}$.'
          - problem: 'Evaluate $\int_2^4 \frac{2x^2 + 4}{x(x^2 + 4)}\,dx$ to four decimal places.'
            answer: '1.1513'
            answer_contract: {"kind": "approx", "decimals": 4}
            solution_sketch: 'Write $\frac{2x^2 + 4}{x(x^2 + 4)} = \frac{A}{x} + \frac{Bx + C}{x^2 + 4}$. Setting $x = 0$ gives $A = 1$, then $A + B = 2$ gives $B = 1$, and $C = 0$. The antiderivative is $\ln x + \frac{1}{2}\ln(x^2 + 4)$, and from $2$ to $4$ it gives $\frac{1}{2}\ln 10$, about 1.1513.'
          - problem: 'The average value of a function $f$ on $[a, b]$ is $\frac{1}{b - a}\int_a^b f(x)\,dx$. Find the average value of $f(x) = \frac{4}{x(x^2 + 4)}$ on $[1, 4]$, to four decimal places.'
            answer: '0.2310'
            answer_contract: {"kind": "approx", "decimals": 4}
            solution_sketch: 'Write $\frac{4}{x(x^2 + 4)} = \frac{1}{x} - \frac{x}{x^2 + 4}$. Its integral over $[1, 4]$ is $\ln 2$. The interval has length $4 - 1 = 3$, so the average value is $\frac{\ln 2}{3}$, about 0.2310.'
          - problem: 'A river carries a pollutant past a gauge at the rate $\frac{8}{t(t^2 + 4)}$ kilograms per hour, where $t$ is in hours. Find, to four decimal places, how many kilograms pass between $t = 1$ and $t = 3$.'
            answer: '1.2417'
            answer_contract: {"kind": "approx", "decimals": 4}
            solution_sketch: 'The mass is the integral of the rate. Write $\frac{8}{t(t^2 + 4)} = \frac{2}{t} - \frac{2t}{t^2 + 4}$, with antiderivative $2\ln t - \ln(t^2 + 4)$. From $t = 1$ to $t = 3$ this gives $2\ln 3 - \ln 13 + \ln 5 = \ln\frac{45}{13}$, about 1.2417 kilograms.'
          - problem: 'Sam tries $\frac{1}{x(x^2 + 1)} = \frac{A}{x} + \frac{B}{x^2 + 1}$ and finds no constants that work. Using the correct form $\frac{A}{x} + \frac{Bx + C}{x^2 + 1}$, find $A$, $B$ and $C$.'
            answer: 'A = 1; B = -1; C = 0'
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "A"}, {"contract": {"kind": "exact"}, "name": "B"}, {"contract": {"kind": "exact"}, "name": "C"}]}
            solution_sketch: 'A constant over $x^2 + 1$ cannot supply the $x$ term, so the numerator must be $Bx + C$. Clearing the denominators gives $1 = A(x^2 + 1) + (Bx + C)x$. Setting $x = 0$ gives $A = 1$. Matching the $x^2$ coefficients gives $A + B = 0$, so $B = -1$, and matching the $x$ coefficients gives $C = 0$.'
        constraints: "at most one irreducible quadratic factor (x^2 + 1 or x^2 + 4); Bx + C numerator handled by u = the quadratic"
    diagnostic_exemplar:
      problem: 'Evaluate $\int \frac{x^2 + 2}{x(x^2 + 1)} \, dx$.'
      answer: '$2\ln|x| - \frac{1}{2}\ln(x^2 + 1) + C$'
      answer_contract: {kind: none}
      solution_sketch: 'The irreducible quadratic needs $\frac{A}{x} + \frac{Bx + C}{x^2+1}$; matching coefficients gives $A = 2$, $B = -1$, $C = 0$.'
    anki_seeds:
      - front: "Partial fraction form for a repeated factor (x - a)^2?"
        back: '$\frac{A}{x - a} + \frac{B}{(x - a)^2}$'
        type: basic
      - front: "Before decomposing a rational integrand, check that..."
        back: "the numerator degree is less than the denominator degree — otherwise do polynomial long division first"
        type: basic
      - front: "Partial fraction numerator over an irreducible quadratic factor?"
        back: '$\frac{Bx + C}{x^2 + bx + c}$ (a full linear numerator, not just a constant)'
        type: basic

  - id: weierstrass-substitution
    name: Weierstrass Substitution
    core: false                # special-case technique; nothing downstream
    difficulty: 0.75
    drill: false
    answer_kind: numeric
    expected_time_secs: 240
    prerequisites:
      - id: trigonometric-integrals
        weight: 0.6
        key: true
      - id: partial-fractions-linear-factors
        weight: 0.5
        key: true
      - id: integration-substitution
        weight: 0.5
      - id: trig-identities-basic
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: The substitution t = tan(x/2)
        key_prerequisites: [trig-identities-basic, integration-substitution]
        try_first:
          problem: 'Let $t = \tan(x/2)$. What is the value of $t$ when $x = \frac{\pi}{2}$?'
          answer_contract: {"kind": "exact"}
          answer: '1'
          reveal: 'At $x = \frac{\pi}{2}$ we have $t = \tan\frac{\pi}{4} = 1$. The substitution $t = \tan(x/2)$ turns every limit $x = c$ into $t = \tan(c/2)$, and it turns a trigonometric integrand into a rational function of $t$.'
        step_check:
          step: 'Form the $t$-integral'
          question: 'Why does the integral reduce to the simple $\int dt$ in this step?'
          options:
            - 'The factors $1 + t^2$ and $2$ in $dx$ cancel those in the denominator'
            - 'The value of $\cos x$ is replaced by $0$ whenever $t$ is used in it'
            - 'Because $\tan(x/2)$ is the derivative of $x$ taken with respect to $t$'
            - 'Because the integral of $\frac{1}{1 + \cos x}$ is always a plain constant'
          answer: 'The factors $1 + t^2$ and $2$ in $dx$ cancel those in the denominator'
          why: 'The numerator $\frac{2\,dt}{1 + t^2}$ and the denominator $\frac{2}{1 + t^2}$ have the same factors, so they cancel and only $dt$ remains.'
        exemplars:
          - problem: 'Find $\int \frac{dx}{1 + \sin x}$ for $-\frac{\pi}{2} < x < \frac{\pi}{2}$.'
            answer: '-2/(1 + tan(x/2))'
            answer_contract: {"kind": "function", "vars": ["x"], "up_to_constant": true, "domain": {"x": ["-1.2", "1.3"]}}
            solution_sketch: 'Let $t = \tan(x/2)$, so $\sin x = \frac{2t}{1 + t^2}$ and $dx = \frac{2\,dt}{1 + t^2}$. Then $1 + \sin x = \frac{(1 + t)^2}{1 + t^2}$, and the integral becomes $\int \frac{2\,dt}{(1 + t)^2} = -\frac{2}{1 + t} + C$. Putting back $t = \tan(x/2)$ gives $-\frac{2}{1 + \tan(x/2)} + C$.'
          - problem: 'Evaluate $\int_0^{\pi/2} \frac{dx}{1 + \sin x}$.'
            answer: '1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'With $t = \tan(x/2)$ the integral becomes $\int \frac{2\,dt}{(1 + t)^2} = -\frac{2}{1 + t}$. The limits change: $x = 0$ gives $t = \tan 0 = 0$, and $x = \frac{\pi}{2}$ gives $t = \tan\frac{\pi}{4} = 1$. So the value is $-\frac{2}{2} - \left(-\frac{2}{1}\right) = 1$.'
          - problem: 'Find $\int \frac{dx}{1 - \cos x}$ for $0 < x < \pi$.'
            answer: '-1/tan(x/2)'
            answer_contract: {"kind": "function", "vars": ["x"], "up_to_constant": true, "domain": {"x": ["0.7", "2.9"]}}
            solution_sketch: 'Let $t = \tan(x/2)$, so $\cos x = \frac{1 - t^2}{1 + t^2}$ and $dx = \frac{2\,dt}{1 + t^2}$. Then $1 - \cos x = \frac{2t^2}{1 + t^2}$, and the integral becomes $\int \frac{dt}{t^2} = -\frac{1}{t} + C$. Putting back $t = \tan(x/2)$ gives $-\frac{1}{\tan(x/2)} + C$, which is $-\cot\frac{x}{2} + C$.'
          - problem: 'Let $t = \tan(x/2)$. Express $\sin x$ in terms of $t$.'
            answer: '2t/(1+t^2)'
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: 'Since $\sin x = 2\sin\frac{x}{2}\cos\frac{x}{2}$, divide by $1 = \sin^2\frac{x}{2} + \cos^2\frac{x}{2}$. Then divide the numerator and the denominator by $\cos^2\frac{x}{2}$. This gives $\sin x = \frac{2t}{1 + t^2}$.'
          - problem: 'Water flows into a tank at the rate $\frac{2}{1 + \cos t}$ litres per minute, where $t$ is in minutes. How many litres flow in during the first $\frac{\pi}{2}$ minutes?'
            answer: '2'
            answer_contract: {"kind": "unit", "quantity": "volume", "unit": "L", "allow_omitted": true}
            solution_sketch: 'The volume is the integral of the rate. With $u = \tan(t/2)$ we get $1 + \cos t = \frac{2}{1 + u^2}$, so $\frac{2\,dt}{1 + \cos t}$ becomes $2\,du$. The antiderivative is $2\tan\frac{t}{2}$. From $t = 0$ to $t = \frac{\pi}{2}$ this gives $2\tan\frac{\pi}{4} - 0 = 2$ litres.'
          - problem: 'With $t = \tan(x/2)$, the integral $\int \frac{dx}{1 + \sin x}$ becomes $\int g(t)\,dt$. Find $g(t)$.'
            answer: '2/(1+t)^2'
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: 'Replace $\sin x$ by $\frac{2t}{1 + t^2}$ and $dx$ by $\frac{2\,dt}{1 + t^2}$. The denominator is $1 + \frac{2t}{1 + t^2} = \frac{(1 + t)^2}{1 + t^2}$. So $g(t) = \frac{2}{1 + t^2}\cdot\frac{1 + t^2}{(1 + t)^2} = \frac{2}{(1 + t)^2}$.'
          - problem: 'Find the average value of $f(x) = \frac{1}{1 + \cos x}$ on $\left[0, \frac{\pi}{2}\right]$.'
            answer: '2/pi'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The average value is the integral divided by the length of the interval. With $t = \tan(x/2)$ we get $\int \frac{dx}{1 + \cos x} = \tan\frac{x}{2}$, so the integral from $0$ to $\frac{\pi}{2}$ is $\tan\frac{\pi}{4} = 1$. The interval has length $\frac{\pi}{2}$, so the average value is $1 \div \frac{\pi}{2} = \frac{2}{\pi}$.'
          - problem: 'Evaluate $\int_{-\pi/2}^{\pi/2} \frac{dx}{1 + \cos x}$.'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'With $t = \tan(x/2)$ the integral becomes $\int dt = t$. The limits change: $x = -\frac{\pi}{2}$ gives $t = -1$, and $x = \frac{\pi}{2}$ gives $t = 1$. So the value is $1 - (-1) = 2$.'
          - problem: 'Let $t = \tan(x/2)$. Express $\cos x$ in terms of $t$.'
            answer: '(1-t^2)/(1+t^2)'
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: 'Since $\cos x = \cos^2\frac{x}{2} - \sin^2\frac{x}{2}$, divide by $1 = \sin^2\frac{x}{2} + \cos^2\frac{x}{2}$. Then divide the numerator and the denominator by $\cos^2\frac{x}{2}$. This gives $\cos x = \frac{1 - t^2}{1 + t^2}$.'
          - problem: 'Evaluate $\int_{\pi/3}^{\pi/2} \frac{dx}{1 - \cos x}$.'
            answer: 'sqrt(3) - 1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'With $t = \tan(x/2)$ the integral becomes $\int \frac{dt}{t^2} = -\frac{1}{t}$. The limits change: $x = \frac{\pi}{3}$ gives $t = \tan\frac{\pi}{6} = \frac{1}{\sqrt{3}}$, and $x = \frac{\pi}{2}$ gives $t = 1$. So the value is $-1 + \sqrt{3} = \sqrt{3} - 1$.'
          - problem: 'Sam substitutes $t = \tan(x/2)$ and writes $dx = \frac{dt}{1 + t^2}$. The correct substitution is $dx = h(t)\,dt$. Find $h(t)$.'
            answer: '2/(1+t^2)'
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: 'From $t = \tan(x/2)$ we get $\frac{dt}{dx} = \frac{1}{2}\sec^2\frac{x}{2} = \frac{1 + t^2}{2}$. Sam dropped the factor $\frac{1}{2}$ from the chain rule. Solving for $dx$ gives $dx = \frac{2}{1 + t^2}\,dt$, so $h(t) = \frac{2}{1 + t^2}$.'
          - problem: 'Find $\int \frac{dx}{1 + \cos x}$ for $-\pi < x < \pi$.'
            answer: 'tan(x/2)'
            answer_contract: {"kind": "function", "vars": ["x"], "up_to_constant": true, "domain": {"x": ["-1.3", "1.4"]}}
            solution_sketch: 'Let $t = \tan(x/2)$. Then $1 + \cos x = \frac{2}{1 + t^2}$ and $dx = \frac{2\,dt}{1 + t^2}$, so the integral becomes $\int dt = t + C$. Putting back $t = \tan(x/2)$ gives $\tan\frac{x}{2} + C$.'
          - problem: 'A vat fills at the rate $\frac{4}{1 - \cos t}$ litres per minute, where $t$ is in minutes. How many litres flow in between $t = \frac{\pi}{2}$ and $t = \pi$?'
            answer: '4'
            answer_contract: {"kind": "unit", "quantity": "volume", "unit": "L", "allow_omitted": true}
            solution_sketch: 'The volume is the integral of the rate. With $u = \tan(t/2)$ we get $1 - \cos t = \frac{2u^2}{1 + u^2}$, so the integral becomes $\int \frac{4\,du}{u^2} = -\frac{4}{u}$. At $t = \frac{\pi}{2}$ we have $u = 1$ and the value is $-4$. At $t = \pi$ we have $u \to \infty$ and the value is $0$, so $0 - (-4) = 4$ litres flow in.'
        constraints: "denominators of the form 1 ± sin x or 1 ± cos x; the t-integral is a power of t or of a linear factor; includes the formulas for sin x, cos x and dx in t"
      - id: kp2
        name: Rational functions of sin and cos
        key_prerequisites: [partial-fractions-linear-factors, trigonometric-integrals]
        step_check:
          step: 'Integrate the arctan pattern'
          question: 'Why does $\int \frac{2\,dt}{3 + t^2}$ lead to an arctangent with $\sqrt{3}$ inside?'
          options:
            - 'The numerator $2$ is the derivative of the denominator $3 + t^2$, so a logarithm appears'
            - 'The $t^2$ term must be integrated by parts before $3$ is used'
            - 'It matches $\frac{1}{a}\arctan\frac{t}{a}$ for $a^2 = 3$, so $a = \sqrt{3}$'
            - 'The number $3$ is the upper limit that appears in the answer'
          answer: 'It matches $\frac{1}{a}\arctan\frac{t}{a}$ for $a^2 = 3$, so $a = \sqrt{3}$'
          why: 'The denominator has the form $a^2 + t^2$ with $a^2 = 3$, so $a = \sqrt{3}$. The standard pattern then gives $\frac{1}{a}\arctan\frac{t}{a}$, multiplied here by the numerator $2$.'
        exemplars:
          - problem: 'Find $\int \frac{dx}{4 + 3\cos x}$ for $-\pi < x < \pi$.'
            answer: '(2/sqrt(7)) atan(tan(x/2)/sqrt(7))'
            answer_contract: {"kind": "function", "vars": ["x"], "up_to_constant": true, "domain": {"x": ["-1.3", "1.4"]}}
            solution_sketch: 'Let $t = \tan(x/2)$. Then $4 + 3\cos x = \frac{4(1 + t^2) + 3(1 - t^2)}{1 + t^2} = \frac{7 + t^2}{1 + t^2}$, and the integral becomes $\int \frac{2\,dt}{7 + t^2}$. This is the arctangent pattern with $a = \sqrt{7}$, so it equals $\frac{2}{\sqrt{7}}\arctan\frac{t}{\sqrt{7}}$. Putting back $t = \tan(x/2)$ gives $\frac{2}{\sqrt{7}}\arctan\left(\frac{\tan(x/2)}{\sqrt{7}}\right) + C$.'
          - problem: 'Evaluate $\int_0^{\pi/2} \frac{dx}{4 + 5\sin x}$.'
            answer: 'ln(2)/3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Let $t = \tan(x/2)$. Then $4 + 5\sin x = \frac{4t^2 + 10t + 4}{1 + t^2}$, and the integral becomes $\int_0^1 \frac{dt}{2t^2 + 5t + 2} = \int_0^1 \frac{dt}{(2t + 1)(t + 2)}$. Partial fractions give $\frac{1}{(2t + 1)(t + 2)} = \frac{2/3}{2t + 1} - \frac{1/3}{t + 2}$, with antiderivative $\frac{1}{3}\ln(2t + 1) - \frac{1}{3}\ln(t + 2)$. From $t = 0$ to $t = 1$ this gives $0 + \frac{1}{3}\ln 2 = \frac{\ln 2}{3}$.'
          - problem: 'With $t = \tan(x/2)$, the integral $\int \frac{dx}{3 + \cos x}$ becomes $\int g(t)\,dt$. Find $g(t)$.'
            answer: '1/(2+t^2)'
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: 'Replace $\cos x$ by $\frac{1 - t^2}{1 + t^2}$ and $dx$ by $\frac{2\,dt}{1 + t^2}$. The denominator is $3 + \frac{1 - t^2}{1 + t^2} = \frac{4 + 2t^2}{1 + t^2}$. So $g(t) = \frac{2}{1 + t^2}\cdot\frac{1 + t^2}{4 + 2t^2} = \frac{2}{4 + 2t^2} = \frac{1}{2 + t^2}$.'
          - problem: 'Find $\int \frac{dx}{2 + \sin x + \cos x}$ for $-\pi < x < \pi$.'
            answer: 'sqrt(2) atan((tan(x/2) + 1)/sqrt(2))'
            answer_contract: {"kind": "function", "vars": ["x"], "up_to_constant": true, "domain": {"x": ["-1.3", "1.4"]}}
            solution_sketch: 'Let $t = \tan(x/2)$. Then $2 + \sin x + \cos x = \frac{2(1 + t^2) + 2t + (1 - t^2)}{1 + t^2} = \frac{t^2 + 2t + 3}{1 + t^2}$, and the integral becomes $\int \frac{2\,dt}{t^2 + 2t + 3}$. Completing the square gives $\int \frac{2\,dt}{(t + 1)^2 + 2} = \frac{2}{\sqrt{2}}\arctan\frac{t + 1}{\sqrt{2}}$. Since $\frac{2}{\sqrt{2}} = \sqrt{2}$, the answer is $\sqrt{2}\arctan\left(\frac{\tan(x/2) + 1}{\sqrt{2}}\right) + C$.'
          - problem: 'The signal $f(x) = \frac{1}{3 + \cos x}$ is measured for $0 \le x \le \frac{\pi}{2}$. Find its average value over this interval, to three decimal places.'
            answer: '0.277'
            answer_contract: {"kind": "approx", "decimals": 3}
            solution_sketch: 'The average value is the integral divided by the length $\frac{\pi}{2}$. With $t = \tan(x/2)$ the integral becomes $\int_0^1 \frac{dt}{2 + t^2} = \frac{1}{\sqrt{2}}\arctan\frac{1}{\sqrt{2}}$, which is about 0.4352. Multiplying by $\frac{2}{\pi}$ gives an average value of about 0.277.'
          - problem: 'Find $\int \frac{dx}{4 + \sin x}$ for $-\pi < x < \pi$.'
            answer: '2/sqrt(15) atan((4tan(x/2)+1)/sqrt(15))'
            answer_contract: {"kind": "function", "vars": ["x"], "up_to_constant": true, "domain": {"x": ["-1.3", "1.4"]}}
            solution_sketch: 'Let $t = \tan(x/2)$. Then $4 + \sin x = \frac{4(1 + t^2) + 2t}{1 + t^2} = \frac{4t^2 + 2t + 4}{1 + t^2}$, and the integral becomes $\int \frac{2\,dt}{4t^2 + 2t + 4} = \int \frac{dt}{2t^2 + t + 2}$. Completing the square gives $2\left[\left(t + \frac{1}{4}\right)^2 + \frac{15}{16}\right]$, so the integral is $\frac{2}{\sqrt{15}}\arctan\frac{4t + 1}{\sqrt{15}}$. Putting back $t = \tan(x/2)$ gives $\frac{2}{\sqrt{15}}\arctan\left(\frac{4\tan(x/2) + 1}{\sqrt{15}}\right) + C$.'
          - problem: 'Find $\int \frac{dx}{3 + 2\sin x + 2\cos x}$ for $-\pi < x < \pi$.'
            answer: '2 atan(tan(x/2) + 2)'
            answer_contract: {"kind": "function", "vars": ["x"], "up_to_constant": true, "domain": {"x": ["-1.3", "1.4"]}}
            solution_sketch: 'Let $t = \tan(x/2)$. Then $3 + 2\sin x + 2\cos x = \frac{3(1 + t^2) + 4t + 2(1 - t^2)}{1 + t^2} = \frac{t^2 + 4t + 5}{1 + t^2}$, and the integral becomes $\int \frac{2\,dt}{t^2 + 4t + 5} = \int \frac{2\,dt}{(t + 2)^2 + 1}$. This equals $2\arctan(t + 2)$. Putting back $t = \tan(x/2)$ gives $2\arctan(\tan(x/2) + 2) + C$.'
          - problem: 'Find the area under the curve $y = \frac{1}{5 + 4\cos x}$ from $x = 0$ to $x = \frac{\pi}{2}$, to three decimal places.'
            answer: '0.215'
            answer_contract: {"kind": "approx", "decimals": 3}
            solution_sketch: 'Let $t = \tan(x/2)$. Then $5 + 4\cos x = \frac{9 + t^2}{1 + t^2}$, and the integral becomes $\int_0^1 \frac{2\,dt}{9 + t^2} = \frac{2}{3}\arctan\frac{1}{3}$. The area is about 0.215 square units.'
          - problem: 'Find $\int \frac{dx}{3 + \cos x}$ for $-\pi < x < \pi$.'
            answer: '1/sqrt(2) atan(tan(x/2)/sqrt(2))'
            answer_contract: {"kind": "function", "vars": ["x"], "up_to_constant": true, "domain": {"x": ["-1.3", "1.4"]}}
            solution_sketch: 'Let $t = \tan(x/2)$. Then $3 + \cos x = \frac{4 + 2t^2}{1 + t^2}$, and the integral becomes $\int \frac{dt}{2 + t^2}$. This is the arctangent pattern with $a = \sqrt{2}$, so it equals $\frac{1}{\sqrt{2}}\arctan\frac{t}{\sqrt{2}}$. Putting back $t = \tan(x/2)$ gives $\frac{1}{\sqrt{2}}\arctan\left(\frac{\tan(x/2)}{\sqrt{2}}\right) + C$.'
        constraints: "integrand rational in sin x and cos x with small integer coefficients; the t-integral is an arctan pattern or splits over distinct linear factors"
    diagnostic_exemplar:
      problem: 'Evaluate $\int \frac{dx}{2 + \cos x}$.'
      answer: '$\frac{2}{\sqrt{3}}\arctan\left(\frac{\tan(x/2)}{\sqrt{3}}\right) + C$'
      answer_contract: {kind: none}
      solution_sketch: 'With $t = \tan(x/2)$ the integrand becomes $\frac{2\,dt}{3 + t^2}$.'
    anki_seeds:
      - front: 'Weierstrass substitution $t = \tan(x/2)$: the three replacement formulas?'
        back: '$\sin x = \frac{2t}{1+t^2}$, $\cos x = \frac{1-t^2}{1+t^2}$, $dx = \frac{2\,dt}{1+t^2}$'
        type: basic
      - front: "When is the Weierstrass substitution the right tool?"
        back: "When the integrand is a rational function of sin x and cos x that no simpler identity or u-substitution handles."
        type: basic

  - id: improper-integrals-infinite-limits
    name: Improper Integrals with Infinite Limits
    core: true
    difficulty: 0.6
    drill: false
    answer_kind: expression
    expected_time_secs: 150
    prerequisites:
      - id: definite-integrals-ftc
        weight: 0.7
        key: true
      - id: limits-at-infinity-rational
        weight: 0.6
        key: true
      - id: antiderivatives
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: One infinite endpoint as a limit
        key_prerequisites: [definite-integrals-ftc, limits-at-infinity-rational]
        try_first:
          problem: 'Find $\int_1^{10} \frac{dx}{x^2}$.'
          answer_contract: {"kind": "exact"}
          answer: '9/10'
          reveal: 'The value is $\left[-\frac{1}{x}\right]_1^{10} = 1 - \frac{1}{10} = \frac{9}{10}$. With an upper limit $b$ in place of $10$ the value is $1 - \frac{1}{b}$, and an improper integral is defined as the limit of such values as $b$ grows.'
        step_check:
          step: 'as $b\to\infty$ the term $\frac{1}{2b^2}\to 0$'
          question: 'Why does $\frac{1}{2b^2}$ tend to $0$ as $b \to \infty$?'
          options:
            - 'Because $b$ stands for the infinite endpoint, and any fraction containing $b$ equals $0$'
            - 'Because the lower limit $2$ cancels the term when it is subtracted'
            - 'Because the denominator $2b^2$ grows without bound while the numerator stays $1$'
            - 'Because the power rule makes every term with a negative exponent vanish'
          answer: 'Because the denominator $2b^2$ grows without bound while the numerator stays $1$'
          why: 'The numerator stays at $1$ while $2b^2$ becomes arbitrarily large, so the fraction gets as close to $0$ as we like. That leaves $\frac{1}{8}$ as the limit.'
        exemplars:
          - problem: 'Evaluate $\int_1^{\infty} \frac{dx}{x^2}$.'
            answer: '1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Replace the infinite limit by $b$ and take the limit: $\lim_{b\to\infty}\int_1^b x^{-2}\,dx = \lim_{b\to\infty}\left[-\frac{1}{x}\right]_1^b$. This equals $\lim_{b\to\infty}\left(1 - \frac{1}{b}\right) = 1$. The limit is finite, so the integral converges to $1$.'
          - problem: 'Does $\int_1^{\infty} \frac{dx}{x}$ converge or diverge?'
            answer: 'diverges'
            answer_contract: {"kind": "label", "options": [["diverges", "diverge", "it diverges", "the integral diverges", "divergent", "does not converge", "diverges to infinity", "does not exist"], ["converges", "converge", "it converges", "the integral converges", "convergent"]]}
            solution_sketch: 'Replace the infinite limit by $b$: $\int_1^b \frac{dx}{x} = \ln b$. As $b \to \infty$ the value $\ln b$ grows without bound, even though $\frac{1}{x} \to 0$. So the limit is not finite and the integral diverges.'
          - problem: 'Evaluate $\int_1^{\infty} \frac{2}{x^4}\,dx$.'
            answer: '2/3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Write the integral as $\lim_{b\to\infty}\int_1^b 2x^{-4}\,dx = \lim_{b\to\infty}\left[-\frac{2}{3x^3}\right]_1^b$. This equals $\lim_{b\to\infty}\left(\frac{2}{3} - \frac{2}{3b^3}\right) = \frac{2}{3}$. The limit is finite, so the integral converges to $\frac{2}{3}$.'
          - problem: 'The lifetime $X$ of a part, in years, has density $f(x) = \frac{3}{x^4}$ for $x \ge 1$. The probability that the part lasts more than $2$ years is $\int_2^{\infty} f(x)\,dx$. Find this probability.'
            answer: '1/8'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Write the integral as $\lim_{b\to\infty}\int_2^b 3x^{-4}\,dx = \lim_{b\to\infty}\left[-\frac{1}{x^3}\right]_2^b$. This equals $\lim_{b\to\infty}\left(\frac{1}{8} - \frac{1}{b^3}\right) = \frac{1}{8}$. So the probability is $\frac{1}{8}$.'
          - problem: 'Evaluate $\int_{-\infty}^{-2} \frac{dx}{x^2}$.'
            answer: '1/2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Replace the infinite limit by $a$: $\lim_{a\to-\infty}\int_a^{-2} x^{-2}\,dx = \lim_{a\to-\infty}\left[-\frac{1}{x}\right]_a^{-2}$. This equals $\lim_{a\to-\infty}\left(\frac{1}{2} + \frac{1}{a}\right) = \frac{1}{2}$. The limit is finite, so the integral converges to $\frac{1}{2}$.'
          - problem: 'Evaluate $\int_4^{\infty} \frac{dx}{x^{3/2}}$.'
            answer: '1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Write the integral as $\lim_{b\to\infty}\int_4^b x^{-3/2}\,dx = \lim_{b\to\infty}\left[-\frac{2}{\sqrt{x}}\right]_4^b$. This equals $\lim_{b\to\infty}\left(1 - \frac{2}{\sqrt{b}}\right) = 1$. The limit is finite, so the integral converges to $1$.'
          - problem: 'A drug is absorbed into the blood at the rate $\frac{12}{t^2}$ milligrams per hour for $t \ge 2$, where $t$ is in hours. How many milligrams are absorbed in total if the absorption continues forever?'
            answer: '6'
            answer_contract: {"kind": "unit", "quantity": "mass", "unit": "mg", "allow_omitted": true}
            solution_sketch: 'The total is the integral of the rate from $t = 2$ with no upper bound. Write it as $\lim_{b\to\infty}\int_2^b 12t^{-2}\,dt = \lim_{b\to\infty}\left[-\frac{12}{t}\right]_2^b$. This equals $\lim_{b\to\infty}\left(6 - \frac{12}{b}\right) = 6$ milligrams.'
          - problem: 'A spacecraft is pulled by a force of $\frac{20}{x^2}$ newtons when it is $x$ metres from a planet. How much work, in joules, does the force do as the craft moves from $x = 2$ to infinity?'
            answer: '10'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Work is the integral of force over distance, so the work is $\int_2^{\infty} 20x^{-2}\,dx$. Write it as $\lim_{b\to\infty}\left[-\frac{20}{x}\right]_2^b = \lim_{b\to\infty}\left(10 - \frac{20}{b}\right) = 10$. So the work is $10$ joules.'
          - problem: 'The lifetime $X$ of a part, in years, has density $f(x) = \frac{3}{x^4}$ for $x \ge 1$. Its mean lifetime in years is $\int_1^{\infty} x\,f(x)\,dx$. Find the mean lifetime.'
            answer: '3/2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The integrand is $x\cdot\frac{3}{x^4} = 3x^{-3}$. Write the integral as $\lim_{b\to\infty}\left[-\frac{3}{2x^2}\right]_1^b = \lim_{b\to\infty}\left(\frac{3}{2} - \frac{3}{2b^2}\right) = \frac{3}{2}$. So the mean lifetime is $\frac{3}{2}$ years.'
          - problem: 'Find the smallest whole number $p$ for which $\int_1^{\infty} x^{-p}\,dx$ converges.'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'For $p \ne 1$, $\int_1^b x^{-p}\,dx = \frac{b^{1-p} - 1}{1 - p}$. This has a finite limit as $b \to \infty$ only when $1 - p < 0$, that is $p > 1$. For $p = 1$ the integral is $\ln b$, which diverges. So the smallest whole number is $p = 2$.'
        constraints: "one infinite endpoint; power-function integrands; always write the limit explicitly"
      - id: kp2
        name: Exponential and arctangent integrands
        key_prerequisites: [definite-integrals-ftc, antiderivatives]
        step_check:
          step: 'an antiderivative is $-\tfrac{1}{3}e^{-3x}$'
          question: 'Why does the antiderivative of $e^{-3x}$ carry the factor $-\tfrac{1}{3}$?'
          options:
            - 'Differentiating gives a factor $-3$, so we divide by $-3$'
            - 'The lower limit $0$ makes the sign negative, and $3$ is the limit'
            - 'The factor $\tfrac{1}{3}$ is the final value of the improper integral'
            - 'The exponent must be lowered by $1$ and divided by the new exponent'
          answer: 'Differentiating gives a factor $-3$, so we divide by $-3$'
          why: 'By the chain rule, $\frac{d}{dx}e^{-3x} = -3e^{-3x}$. To undo the factor $-3$, the antiderivative needs the factor $-\tfrac{1}{3}$ in front of $e^{-3x}$.'
        exemplars:
          - problem: 'Evaluate $\int_0^{\infty} e^{-2x}\,dx$.'
            answer: '1/2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Write the integral as $\lim_{b\to\infty}\int_0^b e^{-2x}\,dx = \lim_{b\to\infty}\left[-\frac{1}{2}e^{-2x}\right]_0^b$. This equals $\lim_{b\to\infty}\left(\frac{1}{2} - \frac{1}{2}e^{-2b}\right) = \frac{1}{2}$, because $e^{-2b} \to 0$. The integral converges to $\frac{1}{2}$.'
          - problem: 'Evaluate $\int_0^{\infty} \frac{dx}{1 + x^2}$.'
            answer: 'pi/2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'An antiderivative is $\arctan x$, so the integral is $\lim_{b\to\infty}(\arctan b - \arctan 0)$. As $b \to \infty$, $\arctan b \to \frac{\pi}{2}$, and $\arctan 0 = 0$. So the integral converges to $\frac{\pi}{2}$.'
          - problem: 'Evaluate $\int_0^{\infty} \frac{dx}{4 + x^2}$.'
            answer: 'pi/4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'An antiderivative is $\frac{1}{2}\arctan\frac{x}{2}$, so the integral is $\lim_{b\to\infty}\frac{1}{2}\arctan\frac{b}{2}$. As $b \to \infty$, $\arctan\frac{b}{2} \to \frac{\pi}{2}$. So the value is $\frac{1}{2}\cdot\frac{\pi}{2} = \frac{\pi}{4}$.'
          - problem: 'Evaluate $\int_2^{\infty} e^{-x}\,dx$.'
            answer: 'e^(-2)'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Write the integral as $\lim_{b\to\infty}\left[-e^{-x}\right]_2^b = \lim_{b\to\infty}\left(e^{-2} - e^{-b}\right)$. Since $e^{-b} \to 0$, the limit is $e^{-2}$. The integral converges to $e^{-2}$.'
          - problem: 'A plant releases waste into a lake at the rate $8e^{-t/4}$ kilograms per year, where $t$ is in years. How many kilograms are released in total if the release goes on forever?'
            answer: '32'
            answer_contract: {"kind": "unit", "quantity": "mass", "unit": "kg", "allow_omitted": true}
            solution_sketch: 'The total is the integral of the rate from $t = 0$ with no upper bound. An antiderivative is $-32e^{-t/4}$, so the integral is $\lim_{b\to\infty}\left(32 - 32e^{-b/4}\right)$. Since $e^{-b/4} \to 0$, the total is $32$ kilograms.'
          - problem: 'The waiting time $T$ in hours for a bus has density $f(t) = \frac{1}{3}e^{-t/3}$ for $t \ge 0$. The probability of waiting more than $3$ hours is $\int_3^{\infty} f(t)\,dt$. Find this probability.'
            answer: 'e^(-1)'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'An antiderivative of $\frac{1}{3}e^{-t/3}$ is $-e^{-t/3}$. So the integral is $\lim_{b\to\infty}\left(e^{-1} - e^{-b/3}\right) = e^{-1}$. The probability is $e^{-1}$, about $0.37$.'
          - problem: 'Does $\int_0^{\infty} e^{x}\,dx$ converge or diverge?'
            answer: 'diverges'
            answer_contract: {"kind": "label", "options": [["diverges", "diverge", "it diverges", "the integral diverges", "divergent", "does not converge", "diverges to infinity", "does not exist"], ["converges", "converge", "it converges", "the integral converges", "convergent"]]}
            solution_sketch: 'Replace the infinite limit by $b$: $\int_0^b e^x\,dx = e^b - 1$. As $b \to \infty$ this grows without bound, so the limit is not finite. The integral diverges.'
          - problem: 'Evaluate $\int_3^{\infty} \frac{dx}{9 + x^2}$.'
            answer: 'pi/12'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'An antiderivative is $\frac{1}{3}\arctan\frac{x}{3}$. The integral is $\lim_{b\to\infty}\frac{1}{3}\arctan\frac{b}{3} - \frac{1}{3}\arctan 1 = \frac{1}{3}\cdot\frac{\pi}{2} - \frac{1}{3}\cdot\frac{\pi}{4}$. This equals $\frac{\pi}{12}$.'
          - problem: 'Evaluate $\int_{-\infty}^0 e^{3x}\,dx$.'
            answer: '1/3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Write the integral as $\lim_{a\to-\infty}\left[\frac{1}{3}e^{3x}\right]_a^0 = \lim_{a\to-\infty}\left(\frac{1}{3} - \frac{1}{3}e^{3a}\right)$. Since $e^{3a} \to 0$ as $a \to -\infty$, the limit is $\frac{1}{3}$. The integral converges to $\frac{1}{3}$.'
        constraints: "antiderivative is e^{-ax} or arctan; a in {1, 2, 3}"
      - id: kp3
        name: Doubly infinite intervals and divergence by oscillation
        key_prerequisites: [definite-integrals-ftc, limits-at-infinity-rational]
        step_check:
          step: 'Split at zero'
          question: 'Why must each half of the doubly infinite integral converge on its own?'
          options:
            - 'Because the integrand is only defined on one side of zero'
            - 'Because the integral converges only if both halves have finite limits'
            - 'Because the two limits $a \to -\infty$ and $b \to \infty$ must be equal'
            - 'Because the point $0$ is always where the antiderivative changes sign'
          answer: 'Because the integral converges only if both halves have finite limits'
          why: 'The integral is defined as the sum of two limits. If either limit is infinite or does not exist, the sum has no meaning, so both halves must converge.'
        exemplars:
          - problem: 'Evaluate $\int_{-\infty}^{\infty} \frac{dx}{1 + x^2}$.'
            answer: 'pi'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Split at $0$. The right half is $\lim_{b\to\infty}\arctan b = \frac{\pi}{2}$, and the left half is $-\lim_{a\to-\infty}\arctan a = \frac{\pi}{2}$. Both halves converge, so the sum is $\frac{\pi}{2} + \frac{\pi}{2} = \pi$.'
          - problem: 'Evaluate $\int_{-\infty}^{\infty} \frac{dx}{9 + x^2}$.'
            answer: 'pi/3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Split at $0$. An antiderivative is $\frac{1}{3}\arctan\frac{x}{3}$, so the right half is $\frac{1}{3}\cdot\frac{\pi}{2} = \frac{\pi}{6}$ and the left half is also $\frac{\pi}{6}$. Both halves converge, so the total is $\frac{\pi}{6} + \frac{\pi}{6} = \frac{\pi}{3}$.'
          - problem: 'Evaluate $\int_{-\infty}^{\infty} x e^{-x^2}\,dx$.'
            answer: '0'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Split at $0$. An antiderivative is $-\frac{1}{2}e^{-x^2}$, so the right half is $0 - \left(-\frac{1}{2}\right) = \frac{1}{2}$ and the left half is $-\frac{1}{2} - 0 = -\frac{1}{2}$. Both halves converge on their own, so the total is $\frac{1}{2} - \frac{1}{2} = 0$.'
          - problem: 'Does $\int_0^{\infty} \cos x\,dx$ converge or diverge?'
            answer: 'diverges'
            answer_contract: {"kind": "label", "options": [["diverges", "diverge", "it diverges", "the integral diverges", "divergent", "does not converge", "diverges to infinity", "does not exist"], ["converges", "converge", "it converges", "the integral converges", "convergent"]]}
            solution_sketch: 'Replace the infinite limit by $b$: $\int_0^b \cos x\,dx = \sin b$. As $b \to \infty$ the value $\sin b$ keeps oscillating between $-1$ and $1$ and does not settle on one number. So the limit does not exist and the integral diverges.'
          - problem: 'A function $f(x) = \frac{k}{1 + x^2}$ is a probability density on the whole real line when $\int_{-\infty}^{\infty} f(x)\,dx = 1$. Find the constant $k$.'
            answer: '1/pi'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Take $k$ out of the integral: $k\int_{-\infty}^{\infty}\frac{dx}{1 + x^2} = k\pi$, because each half contributes $\frac{\pi}{2}$. Setting $k\pi = 1$ gives $k = \frac{1}{\pi}$.'
          - problem: 'Evaluate $\int_{-\infty}^{\infty} \frac{6}{x^2 + 9}\,dx$.'
            answer: '2*pi'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Split at $0$. An antiderivative is $2\arctan\frac{x}{3}$, so each half contributes $2\cdot\frac{\pi}{2} = \pi$. Both halves converge, so the total is $\pi + \pi = 2\pi$.'
          - problem: 'A random variable $X$ has density $f(x) = \frac{1}{\pi(1 + x^2)}$ on the whole real line. Find the probability $P(X > 1) = \int_1^{\infty} f(x)\,dx$.'
            answer: '1/4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'An antiderivative is $\frac{1}{\pi}\arctan x$. The integral is $\lim_{b\to\infty}\frac{1}{\pi}\arctan b - \frac{1}{\pi}\arctan 1 = \frac{1}{\pi}\left(\frac{\pi}{2} - \frac{\pi}{4}\right) = \frac{1}{4}$.'
          - problem: 'Evaluate $\int_{-\infty}^{\infty} \frac{dx}{x^2 + 2x + 5}$.'
            answer: 'pi/2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Complete the square: $x^2 + 2x + 5 = (x + 1)^2 + 4$. An antiderivative is $\frac{1}{2}\arctan\frac{x + 1}{2}$. As $x \to \infty$ it tends to $\frac{\pi}{4}$ and as $x \to -\infty$ it tends to $-\frac{\pi}{4}$. So the integral is $\frac{\pi}{4} + \frac{\pi}{4} = \frac{\pi}{2}$.'
        constraints: "split doubly infinite integrals at 0; include one oscillating-divergence example"
    diagnostic_exemplar:
      problem: 'Evaluate $\int_{-\infty}^{\infty} \frac{dx}{4 + x^2}$ or state that it diverges.'
      answer: '$\pi/2$'
      solution_sketch: 'Split at $0$ and take limits: $\frac12\arctan(x/2)$ runs from $-\frac{\pi}{4}$ to $\frac{\pi}{4}$ on each side, giving $\frac{\pi}{4} + \frac{\pi}{4}$.'
    anki_seeds:
      - front: 'Definition: $\int_a^{\infty} f(x)\,dx = $ ?'
        back: '$\lim_{b\to\infty} \int_a^b f(x)\,dx$ (convergent iff the limit is finite)'
        type: basic
      - front: '$\int_{-\infty}^{\infty} f(x)\,dx$ converges iff...'
        back: "both halves (split at any finite point) converge separately"
        type: basic

  - id: improper-integrals-discontinuous
    name: Improper Integrals with Discontinuous Integrands
    core: true
    difficulty: 0.62
    drill: false
    answer_kind: expression
    expected_time_secs: 180
    prerequisites:
      - id: definite-integrals-ftc
        weight: 0.7
        key: true
      - id: one-sided-limits
        weight: 0.6
        key: true
      - id: improper-integrals-infinite-limits
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: 'Vertical asymptote at an endpoint'
        key_prerequisites: [definite-integrals-ftc, one-sided-limits]
        step_check:
          step: 'since the trouble is at the lower endpoint'
          question: 'Why is it the lower limit $0$, and not the upper limit $1$, that is replaced by $a$?'
          options:
            - 'An improper integral always replaces its lower limit by a variable'
            - 'The integrand is undefined at $x=0$, the lower limit'
            - 'The antiderivative $x^{2/3}$ is not defined at the upper limit $1$'
            - 'Replacing the lower limit gives a simpler antiderivative to find'
          answer: 'The integrand is undefined at $x=0$, the lower limit'
          why: 'The integrand $x^{-1/3}$ is undefined at $0$, so the integral is defined by a limit as $a\to0^+$; at the upper limit $1$ everything is finite.'
        try_first:
          problem: 'Evaluate $\int_0^1 \frac{dx}{x^{4/5}}$.'
          answer_contract: {"kind":"exact"}
          answer: '5'
          reveal: 'The integrand grows without bound at $0$, yet $\lim_{a\to0^+}5\left(1-a^{1/5}\right)=5$ is finite. Replacing the bad endpoint by $a$ and taking a limit gives the value of such an integral.'
        exemplars:
          - problem: 'Evaluate $\int_0^1 \frac{dx}{\sqrt{x}}$.'
            answer: '2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The integrand is undefined at $x=0$, so replace the lower limit by $a$ and let $a\to0^+$. Then $\int_a^1 x^{-1/2}\,dx=2-2\sqrt{a}$, which tends to $2$. The integral converges to $2$.'
          - problem: 'Does $\int_0^1 \frac{dx}{x^2}$ converge or diverge?'
            answer: 'diverges'
            answer_contract: {"kind":"label","options":[["diverges","it diverges","divergent","diverge","does not converge","doesn't converge","diverges to infinity","infinite"],["converges","it converges","convergent","converge","finite","the integral converges","converges to a finite value","it is convergent"]]}
            solution_sketch: 'The integrand blows up at $x=0$, so write the integral as $\lim_{a\to0^+}\int_a^1 x^{-2}\,dx$. Here $\int_a^1 x^{-2}\,dx=\frac1a-1$, and this grows without bound as $a\to0^+$. The integral diverges.'
          - problem: 'Find the area of the region under the curve $y=x^{-2/3}$ between $x=0$ and $x=8$. The curve rises without bound as $x$ approaches $0$.'
            answer: '6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The area is the improper integral $\int_0^8 x^{-2/3}\,dx=\lim_{a\to0^+}\left[3x^{1/3}\right]_a^8$. This equals $3\cdot2-0=6$. So the region has the finite area $6$.'
          - problem: 'A drug is absorbed into the blood at the rate $r(t)=\frac{6}{\sqrt{t}}$ milligrams per hour, $t$ hours after it is taken. The rate is very large just after $t=0$. How much drug is absorbed during the first $4$ hours?'
            answer: '24'
            answer_contract: {"kind":"unit","quantity":"mass","unit":"mg","allow_omitted":true}
            solution_sketch: 'The total is $\int_0^4 6t^{-1/2}\,dt$, which is improper at $t=0$. Then $\lim_{a\to0^+}\left[12\sqrt{t}\right]_a^4=12\cdot2=24$. So $24$ milligrams are absorbed.'
          - problem: 'A heater draws power at the rate $p(t)=\frac{1}{\sqrt{t}}$ kilowatts, $t$ hours after it is switched on at $t=0$; it draws most just after switch-on. What fraction of the energy used in the first $9$ hours is used in the first hour?'
            answer: '1/3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The energy used up to time $T$ is $\int_0^T t^{-1/2}\,dt=2\sqrt{T}$. So $2\sqrt{1}=2$ is used in the first hour and $2\sqrt{9}=6$ in the first nine hours. The fraction is $2\div6=\frac13$.'
          - problem: 'Evaluate $\int_0^{16} x^{-3/4}\,dx$.'
            answer: '8'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The antiderivative is $\int x^{-3/4}\,dx=4x^{1/4}$. Then $\lim_{a\to0^+}\left[4x^{1/4}\right]_a^{16}=4\cdot2-0=8$. The integral converges to $8$.'
          - problem: 'Sam evaluates $\int_0^1 x^{-1/3}\,dx$ by writing the antiderivative as $x^{2/3}$, and gets $1$. What is the correct value?'
            answer: '3/2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Sam raised the exponent but did not divide by the new exponent $\frac23$. The correct antiderivative is $\frac32x^{2/3}$, and $\lim_{a\to0^+}\left[\frac32x^{2/3}\right]_a^1=\frac32$. The value is $\frac32$.'
          - problem: 'Evaluate $\int_2^6 \frac{dx}{\sqrt{x-2}}$.'
            answer: '4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The integrand is undefined at the lower endpoint $x=2$. Then $\lim_{a\to2^+}\left[2\sqrt{x-2}\right]_a^6=2\cdot2-0=4$. The integral converges to $4$.'
        constraints: "single vertical asymptote at an endpoint of the interval; integrand of the form x^{-p}; context items: area, absorbed amount, fraction of a total"
      - id: kp2
        name: 'Asymptotes at the upper endpoint'
        key_prerequisites: [definite-integrals-ftc, one-sided-limits]
        step_check:
          step: 'the integrand is undefined at $x=4$'
          question: 'Why is the limit taken as $t\to4^-$ rather than $t\to4^+$?'
          options:
            - 'The limit from the right would give a negative value'
            - 'Limits are always taken from the left in improper integrals'
            - 'Only values $t<4$ lie inside the interval $[0,4]$'
            - 'The antiderivative is only defined for $t>4$'
          answer: 'Only values $t<4$ lie inside the interval $[0,4]$'
          why: 'The integral runs over $[0,4]$, so $t$ must approach $4$ from inside the interval, that is from the left.'
        exemplars:
          - problem: 'Evaluate $\int_0^1 \frac{dx}{\sqrt{1-x}}$.'
            answer: '2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The integrand is undefined at the upper endpoint $x=1$, so write $\lim_{b\to1^-}\int_0^b(1-x)^{-1/2}\,dx$. An antiderivative is $-2\sqrt{1-x}$, so the integral up to $b$ is $2-2\sqrt{1-b}$. As $b\to1^-$ this tends to $2$.'
          - problem: 'Does $\int_0^1 \frac{dx}{1-x}$ converge or diverge?'
            answer: 'diverges'
            answer_contract: {"kind":"label","options":[["diverges","it diverges","divergent","diverge","does not converge","doesn't converge","diverges to infinity","infinite"],["converges","it converges","convergent","converge","finite","the integral converges","converges to a finite value","it is convergent"]]}
            solution_sketch: 'The integrand blows up at $x=1$, so write $\lim_{b\to1^-}\int_0^b\frac{dx}{1-x}$. An antiderivative is $-\ln(1-x)$, so the integral up to $b$ is $-\ln(1-b)$. As $b\to1^-$ this tends to infinity, so the integral diverges.'
          - problem: 'Evaluate $\int_0^8 \frac{dx}{(8-x)^{1/3}}$.'
            answer: '6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The integrand is undefined at $x=8$. An antiderivative is $-\frac32(8-x)^{2/3}$, so $\lim_{b\to8^-}\left[-\frac32(8-x)^{2/3}\right]_0^b=0+\frac32\cdot4=6$. The integral converges to $6$.'
          - problem: 'Water drains from a tank at the rate $r(t)=\frac{10}{\sqrt{25-t}}$ litres per minute, $t$ minutes after the valve opens. The drain speeds up as $t$ approaches $25$, when the tank is empty. How much water drains from the tank in total?'
            answer: '100'
            answer_contract: {"kind":"unit","quantity":"volume","unit":"L","allow_omitted":true}
            solution_sketch: 'The total is $\int_0^{25}10(25-t)^{-1/2}\,dt$, which is improper at $t=25$. Then $\lim_{b\to25^-}\left[-20\sqrt{25-t}\right]_0^b=0+20\cdot5=100$. So $100$ litres drain in total.'
          - problem: 'Water drains from a tank at the rate $r(t)=\frac{10}{\sqrt{25-t}}$ litres per minute, $t$ minutes after the valve opens, until the tank is empty at $t=25$. What fraction of all the water drains during the first $16$ minutes?'
            answer: '2/5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The amount drained up to time $T$ is $\int_0^T10(25-t)^{-1/2}\,dt=20\left(5-\sqrt{25-T}\right)$. At $T=16$ this is $20(5-3)=40$, and as $T\to25$ it tends to $100$. The fraction is $40\div100=\frac25$.'
          - problem: 'Evaluate $\int_1^9 \frac{dx}{\sqrt{9-x}}$.'
            answer: '4*sqrt(2)'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The integrand is undefined at $x=9$, and an antiderivative is $-2\sqrt{9-x}$. Then $\lim_{b\to9^-}\left[-2\sqrt{9-x}\right]_1^b=0+2\sqrt{8}=4\sqrt{2}$. The integral converges to $4\sqrt{2}$.'
          - problem: 'Sam evaluates $\int_0^2 \frac{dx}{\sqrt{2-x}}$ with the antiderivative $2\sqrt{2-x}$ and gets $-2\sqrt{2}$, which is negative although the integrand is positive. What is the correct value?'
            answer: '2*sqrt(2)'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'By the chain rule the derivative of $2\sqrt{2-x}$ is $-\frac{1}{\sqrt{2-x}}$, so the correct antiderivative is $-2\sqrt{2-x}$. Then $\lim_{b\to2^-}\left[-2\sqrt{2-x}\right]_0^b=0+2\sqrt2$. The value is $2\sqrt{2}$.'
          - problem: 'Evaluate $\int_0^1 \frac{dx}{(1-x)^{3/4}}$.'
            answer: '4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The integrand is undefined at $x=1$, and an antiderivative is $-4(1-x)^{1/4}$. Then $\lim_{b\to1^-}\left[-4(1-x)^{1/4}\right]_0^b=0+4=4$. The integral converges to $4$.'
        constraints: "asymptote at the upper endpoint; integrand (b - x)^{-p} with p in {1/3, 1/2, 3/4, 1}; context items: drained volume and the fraction of a total"
      - id: kp3
        name: 'Interior discontinuities (split the integral)'
        key_prerequisites: [definite-integrals-ftc, one-sided-limits]
        step_check:
          step: 'so the FTC cannot be used on $[0,4]$ directly'
          question: 'Why can the Fundamental Theorem of Calculus not be applied on $[0,4]$ directly?'
          options:
            - 'The integrand is undefined at $x=2$, inside the interval'
            - 'The antiderivative $3(x-2)^{1/3}$ is not a polynomial function'
            - 'The interval $[0,4]$ is too long for the theorem to hold true'
            - 'The integrand takes negative values on part of the interval'
          answer: 'The integrand is undefined at $x=2$, inside the interval'
          why: 'The theorem needs a continuous integrand on the whole interval; with a break at $x=2$ the shortcut gives wrong values, for example a negative area for a positive function.'
        exemplars:
          - problem: 'Evaluate $\int_{-1}^{8} \frac{dx}{x^{2/3}}$.'
            answer: '9'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The integrand is undefined at $x=0$, which lies inside the interval, so split there. Each piece uses $\int x^{-2/3}\,dx=3x^{1/3}$: on $[-1,0]$ the limit gives $3\cdot1=3$, and on $[0,8]$ it gives $3\cdot2=6$. The sum is $3+6=9$.'
          - problem: 'Sam applies the Fundamental Theorem of Calculus directly to $\int_{-1}^{1} \frac{dx}{x^2}$ and gets $-2$. Does this integral converge or diverge?'
            answer: 'diverges'
            answer_contract: {"kind":"label","options":[["diverges","it diverges","divergent","diverge","does not converge","doesn't converge","diverges to infinity","infinite"],["converges","it converges","convergent","converge","finite","the integral converges","converges to a finite value","it is convergent"]]}
            solution_sketch: 'The integrand is undefined at $x=0$, inside the interval, so the Fundamental Theorem cannot be used across it. Split at $0$: $\int_0^1 x^{-2}\,dx=\lim_{a\to0^+}\left(\frac1a-1\right)$ is infinite. One divergent half makes the whole integral diverge, and the value $-2$ is meaningless for a positive integrand.'
          - problem: 'Evaluate $\int_0^3 \frac{dx}{(x-1)^{1/3}}$.'
            answer: '3/2*2^(2/3) - 3/2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The integrand is undefined at $x=1$, inside the interval, so split there. On $[0,1]$ the antiderivative $\frac32(x-1)^{2/3}$ gives $0-\frac32=-\frac32$, and on $[1,3]$ it gives $\frac32\cdot2^{2/3}-0$. The sum is $\frac32\cdot2^{2/3}-\frac32$.'
          - problem: 'Evaluate $\int_{-4}^{4} \frac{dx}{\sqrt{|x|}}$.'
            answer: '8'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The integrand is undefined at $x=0$, so split there. By symmetry both halves are equal, and $\int_0^4 x^{-1/2}\,dx=\lim_{a\to0^+}\left[2\sqrt{x}\right]_a^4=4$. The sum is $4+4=8$.'
          - problem: 'Evaluate $\int_0^4 \frac{dx}{(x-2)^{1/3}}$.'
            answer: '0'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The integrand is undefined at $x=2$, so split there. On $[0,2]$ the limit gives $-\frac32\cdot2^{2/3}$, and on $[2,4]$ it gives $+\frac32\cdot2^{2/3}$. Both halves are finite, so the integral converges, and the sum is $0$.'
          - problem: 'A rod lies along the $x$-axis from $x=1$ to $x=6$ metres. Its density is $\rho(x)=\frac{3}{\sqrt{|x-5|}}$ kilograms per metre, which is very large near $x=5$. What is the mass of the rod?'
            answer: '18'
            answer_contract: {"kind":"unit","quantity":"mass","unit":"kg","allow_omitted":true}
            solution_sketch: 'The mass is $\int_1^6 \frac{3}{\sqrt{|x-5|}}\,dx$, which is improper at $x=5$, so split there. On $[1,5]$ the integral is $3\cdot2\sqrt{4}=12$, and on $[5,6]$ it is $3\cdot2\sqrt{1}=6$. The mass is $12+6=18$ kilograms.'
          - problem: 'A rod lies along the $x$-axis from $x=-8$ to $x=27$ metres. Its density is $\rho(x)=\frac{1}{\sqrt[3]{x^2}}$ kilograms per metre. What is the average density of the rod over its length?'
            answer: '3/7'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The mass is $\int_{-8}^{27}x^{-2/3}\,dx$, which is improper at $x=0$, so split there. The pieces are $3\cdot2=6$ on $[-8,0]$ and $3\cdot3=9$ on $[0,27]$, so the mass is $15$. The length is $35$ metres, so the average density is $\frac{15}{35}=\frac37$ kilograms per metre.'
        constraints: "one interior discontinuity; always split there and evaluate each one-sided limit; include the classic false-FTC trap; context items: mass of a rod and its average density"
    diagnostic_exemplar:
      problem: 'Evaluate $\int_0^2 \frac{dx}{(x - 1)^{2/3}}$.'
      answer: '6'
      solution_sketch: 'The integrand blows up at the interior point $x = 1$, so split there: each piece is $[3(x-1)^{1/3}]$ and contributes $3$.'
    anki_seeds:
      - front: "An integrand with a vertical asymptote inside [a, b]: what must you do?"
        back: "Split the integral at the discontinuity and require BOTH one-sided improper integrals to converge."
        type: basic
      - front: "Warning sign that you integrated across a hidden discontinuity?"
        back: "e.g. a negative result for a positive integrand — the FTC does not apply across an asymptote"
        type: basic

  - id: improper-integrals
    name: Improper Integrals
    core: true
    difficulty: 0.68
    drill: false
    answer_kind: numeric
    expected_time_secs: 180
    prerequisites:
      - id: improper-integrals-infinite-limits
        weight: 0.7
        key: true
      - id: improper-integrals-discontinuous
        weight: 0.6
        key: true
      - id: integration-substitution
        weight: 0.4
      - id: partial-fractions-linear-factors
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: 'The p-test at infinity and at zero'
        key_prerequisites: [improper-integrals-infinite-limits, improper-integrals-discontinuous]
        step_check:
          step: 'the term $x^{1-p}$ tends to $0$ exactly when $1-p<0$'
          question: 'Why does $x^{1-p}$ tend to $0$ as $x\to\infty$ only when $1-p<0$?'
          options:
            - 'A negative power of $x$ shrinks as $x$ grows large'
            - 'A positive power of $x$ shrinks as $x$ grows large'
            - 'Every power of $x$ tends to $0$ when $x$ gets large'
            - 'The exponent $1-p$ must be an integer for the limit to exist'
          answer: 'A negative power of $x$ shrinks as $x$ grows large'
          why: 'For $x>1$ the power $x^{k}$ with $k<0$ equals $1/x^{|k|}$, which tends to $0$; with $k>0$ it grows without bound.'
        exemplars:
          - problem: 'For which values of $p$ does $\int_1^{\infty} \frac{dx}{x^p}$ converge?'
            answer: 'p > 1'
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'For $p\neq1$ the antiderivative is $\frac{x^{1-p}}{1-p}$, and it has a finite limit as $x\to\infty$ exactly when $1-p<0$. For $p=1$ the integral is $\lim_{b\to\infty}\ln b$, which diverges. So the integral converges exactly when $p>1$.'
          - problem: 'For which values of $p$ does $\int_0^{1} \frac{dx}{x^p}$ converge?'
            answer: 'p < 1'
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'For $p\neq1$ the antiderivative is $\frac{x^{1-p}}{1-p}$, and it has a finite limit as $x\to0^+$ exactly when $1-p>0$. For $p=1$ the integral is $\lim_{a\to0^+}\left(-\ln a\right)$, which diverges. So the integral converges exactly when $p<1$.'
          - problem: 'Evaluate $\int_1^{\infty} \frac{dx}{x^{3/2}}$.'
            answer: '2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Replace the upper limit by $b$ and let $b\to\infty$. The antiderivative is $-2x^{-1/2}$, so $\left[-2x^{-1/2}\right]_1^b=2-2b^{-1/2}$. As $b\to\infty$ this tends to $2$.'
          - problem: 'Does $\int_0^1 \frac{dx}{x^{2/3}}$ converge or diverge?'
            answer: 'converges'
            answer_contract: {"kind":"label","options":[["converges","it converges","convergent","converge","finite","the integral converges","converges to a finite value","it is convergent"],["diverges","it diverges","divergent","diverge","does not converge","doesn't converge","diverges to infinity","infinite"]]}
            solution_sketch: 'The integrand blows up at $x=0$, and here $p=\frac23<1$. So $\int_a^1 x^{-2/3}\,dx=3-3a^{1/3}$ tends to $3$ as $a\to0^+$. The integral converges.'
          - problem: 'Evaluate $\int_1^{\infty} \frac{dx}{x^{4/3}}$.'
            answer: '3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The antiderivative is $-3x^{-1/3}$, so $\left[-3x^{-1/3}\right]_1^b=3-3b^{-1/3}$. As $b\to\infty$ this tends to $3$. The integral converges to $3$.'
          - problem: 'Evaluate $\int_0^1 \frac{dx}{x^{3/4}}$.'
            answer: '4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The integrand is undefined at $x=0$, so replace the lower limit by $a$. The antiderivative is $4x^{1/4}$, so $\left[4x^{1/4}\right]_a^1=4-4a^{1/4}$, which tends to $4$ as $a\to0^+$. The integral converges to $4$.'
          - problem: 'A particle sits at distance $x$ metres from a fixed centre, and the centre attracts it with force $F(x)=\frac{12}{x^2}$ newtons. How much work, in joules, is needed to pull the particle from $x=2$ out to infinity?'
            answer: '6'
            answer_contract: {"kind":"unit","quantity":"energy","unit":"joule","allow_omitted":true}
            solution_sketch: 'The work is the improper integral $\int_2^{\infty}12x^{-2}\,dx=\lim_{b\to\infty}\left[-12x^{-1}\right]_2^b$. This equals $0+\frac{12}{2}=6$. So $6$ joules of work are needed.'
          - problem: 'A chemical leaks into a lake at the rate $r(t)=\frac{20}{t^3}$ kilograms per day, $t$ days after the leak is detected, from $t=1$ on, and the leak never stops. What fraction of all the chemical that will ever leak has leaked by the end of day $2$?'
            answer: '3/4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The total is $\int_1^{\infty}20t^{-3}\,dt=\left[-10t^{-2}\right]_1^{\infty}=10$. By the end of day $2$ the amount is $\int_1^2 20t^{-3}\,dt=10-\frac{10}{4}=7.5$. The fraction is $7.5\div10=\frac34$.'
          - problem: 'Sam checks $\int_0^1 \frac{dx}{x^2}$ with the rule that $\int_1^{\infty}\frac{dx}{x^p}$ converges when $p>1$, and decides that it converges. Is Sam right? Does the integral converge or diverge?'
            answer: 'diverges'
            answer_contract: {"kind":"label","options":[["diverges","it diverges","divergent","diverge","does not converge","doesn't converge","diverges to infinity","infinite"],["converges","it converges","convergent","converge","finite","the integral converges","converges to a finite value","it is convergent"]]}
            solution_sketch: 'The rule with $p>1$ belongs to the interval $[1,\infty)$. On $[0,1]$ the integral converges only for $p<1$, and here $p=2$. In fact $\int_a^1 x^{-2}\,dx=\frac1a-1$ grows without bound, so the integral diverges.'
        constraints: "p-integrals with p an integer or a simple fraction; contrast the two p-tests explicitly; context items: work and a fraction of a total"
      - id: kp2
        name: 'Substitution and partial fractions in improper integrals'
        key_prerequisites: [integration-substitution, partial-fractions-linear-factors]
        step_check:
          step: 'since $\frac{b}{b+2}\to 1$ as $b\to\infty$'
          question: 'Why does $\tfrac12\ln\frac{b}{b+2}$ tend to $0$ as $b\to\infty$?'
          options:
            - 'The factor $\tfrac12$ is small, so the whole expression becomes small'
            - 'The logarithm of a large quantity is always close to $0$'
            - 'The fraction inside tends to $1$, and the logarithm of $1$ is $0$'
            - 'The numerator $b$ is smaller than the denominator $b+2$'
          answer: 'The fraction inside tends to $1$, and the logarithm of $1$ is $0$'
          why: 'As $b$ grows, $\frac{b}{b+2}$ gets as close to $1$ as we like, and $\ln$ is continuous with $\ln1=0$.'
        exemplars:
          - problem: 'Evaluate $\int_0^{\infty} x e^{-x^2}\,dx$.'
            answer: '1/2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Substitute $u=x^2$, so $x\,dx=\frac12\,du$ and the limits $0$ and $\infty$ stay the same. Then $\frac12\int_0^{\infty}e^{-u}\,du=\frac12\left(0+1\right)=\frac12$. The integral converges to $\frac12$.'
          - problem: 'Evaluate $\int_0^{\infty} \frac{dx}{(x+1)(x+2)}$.'
            answer: 'ln(2)'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Partial fractions give $\frac{1}{(x+1)(x+2)}=\frac{1}{x+1}-\frac{1}{x+2}$, so an antiderivative is $\ln\frac{x+1}{x+2}$. As $x\to\infty$ the fraction tends to $1$, so the log tends to $0$; at $x=0$ it is $\ln\frac12=-\ln2$. The value is $0+\ln 2=\ln 2$.'
          - problem: 'Evaluate $\int_0^{\infty} x e^{-2x^2}\,dx$.'
            answer: '1/4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Substitute $u=2x^2$, so $du=4x\,dx$ and $x\,dx=\frac14\,du$. Then $\frac14\int_0^{\infty}e^{-u}\,du=\frac14\left(0+1\right)=\frac14$. The integral converges to $\frac14$.'
          - problem: 'Evaluate $\int_2^{\infty} \frac{dx}{x(x+2)}$.'
            answer: 'ln(2)/2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Partial fractions give $\frac{1}{x(x+2)}=\frac12\left(\frac1x-\frac{1}{x+2}\right)$, so an antiderivative is $\frac12\ln\frac{x}{x+2}$. As $x\to\infty$ it tends to $0$, and at $x=2$ it is $\frac12\ln\frac12=-\frac12\ln2$. The value is $0+\frac12\ln2=\frac{\ln 2}{2}$.'
          - problem: 'Evaluate $\int_0^{\infty} \frac{x}{(x^2+3)^2}\,dx$.'
            answer: '1/6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Substitute $u=x^2+3$, so $x\,dx=\frac12\,du$ and the lower limit becomes $3$. Then $\frac12\int_3^{\infty}u^{-2}\,du=\frac12\left[-u^{-1}\right]_3^{\infty}=\frac12\cdot\frac13=\frac16$. The integral converges to $\frac16$.'
          - problem: 'Evaluate $\int_3^{\infty} \frac{dx}{x(x+3)}$.'
            answer: 'ln(2)/3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Partial fractions give $\frac{1}{x(x+3)}=\frac13\left(\frac1x-\frac{1}{x+3}\right)$, so an antiderivative is $\frac13\ln\frac{x}{x+3}$. As $x\to\infty$ it tends to $0$, and at $x=3$ it is $\frac13\ln\frac12=-\frac13\ln2$. The value is $0+\frac13\ln2=\frac{\ln 2}{3}$.'
          - problem: 'A factory releases a pollutant at the rate $r(t)=6te^{-t^2}$ kilograms per hour, $t$ hours after a valve opens. The release slows down but never stops completely. How much pollutant is released in total?'
            answer: '3'
            answer_contract: {"kind":"unit","quantity":"mass","unit":"kg","allow_omitted":true}
            solution_sketch: 'The total is $\int_0^{\infty}6te^{-t^2}\,dt$. With $u=t^2$ this is $3\int_0^{\infty}e^{-u}\,du=3\cdot1=3$. So $3$ kilograms are released in total.'
          - problem: 'A factory releases a pollutant at the rate $r(t)=6te^{-t^2}$ kilograms per hour, $t$ hours after a valve opens, and the release never stops completely. What fraction of all the pollutant that will ever be released is released during the first $2$ hours?'
            answer: '1 - e^(-4)'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The total is $\int_0^{\infty}6te^{-t^2}\,dt=3$. In the first $2$ hours the amount is $\int_0^2 6te^{-t^2}\,dt=3\left(1-e^{-4}\right)$. The fraction is $3\left(1-e^{-4}\right)\div3=1-e^{-4}$.'
        constraints: "substitutions limited to one step; partial-fraction cases with distinct linear factors; the limit at infinity of ln(x/(x+c)) must be justified; context items: total and fraction of a released amount"
      - id: kp3
        name: 'The direct comparison test'
        key_prerequisites: [improper-integrals-infinite-limits]
        step_check:
          step: 'taking reciprocals'
          question: 'Why does taking reciprocals turn $x^4+2\ge x^4$ into $\frac{1}{x^4+2}\le\frac{1}{x^4}$?'
          options:
            - 'Taking reciprocals never changes the direction of an inequality'
            - 'A larger positive denominator gives a smaller fraction'
            - 'The $2$ is dropped, which makes the fraction itself smaller'
            - 'Squaring both sides turns the inequality around'
          answer: 'A larger positive denominator gives a smaller fraction'
          why: 'For positive numbers, a larger denominator means a smaller fraction, so the order of the two sides reverses.'
        exemplars:
          - problem: 'Does $\int_1^{\infty} \frac{dx}{x^3+4}$ converge or diverge?'
            answer: 'converges'
            answer_contract: {"kind":"label","options":[["converges","it converges","convergent","converge","finite","the integral converges","converges to a finite value","it is convergent"],["diverges","it diverges","divergent","diverge","does not converge","doesn't converge","diverges to infinity","infinite"]]}
            solution_sketch: 'For $x\geq1$ we have $x^3+4>x^3$, so $0<\frac{1}{x^3+4}<\frac{1}{x^3}$ on the whole interval. The integral $\int_1^{\infty}\frac{dx}{x^3}$ converges because $p=3>1$. By direct comparison the given integral converges.'
          - problem: 'Compare $\frac{1}{x^3+1}$ with $\frac{1}{x^3}$ on $[1,\infty)$. What upper bound does the comparison test give for $\int_1^{\infty}\frac{dx}{x^3+1}$?'
            answer: '1/2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'For $x\geq1$ we have $0<\frac{1}{x^3+1}<\frac{1}{x^3}$. Then $\int_1^{\infty}\frac{dx}{x^3}=\left[-\frac{1}{2x^2}\right]_1^{\infty}=\frac12$. So the integral is at most $\frac12$.'
          - problem: 'Since $x^2\geq x$ for $x\geq1$, the comparison test bounds $\int_1^{\infty}e^{-x^2}\,dx$ above by $\int_1^{\infty}e^{-x}\,dx$. What is that bound?'
            answer: 'e^(-1)'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'We have $0<e^{-x^2}\leq e^{-x}$ for $x\geq1$ because $x^2\geq x$. The bounding integral is $\int_1^{\infty}e^{-x}\,dx=\left[-e^{-x}\right]_1^{\infty}=e^{-1}$. So $\int_1^{\infty}e^{-x^2}\,dx\leq e^{-1}$.'
          - problem: 'Water flows into a reservoir at the rate $r(t)=\frac{3}{t^2+5}$ litres per minute, $t$ minutes after a pump starts. Compare with $\frac{3}{t^2}$ on $[1,\infty)$. What upper bound does this give for the total volume that flows in from $t=1$ on?'
            answer: '3'
            answer_contract: {"kind":"unit","quantity":"volume","unit":"L","allow_omitted":true}
            solution_sketch: 'For $t\geq1$ we have $0<\frac{3}{t^2+5}<\frac{3}{t^2}$. Then $\int_1^{\infty}3t^{-2}\,dt=\left[-3t^{-1}\right]_1^{\infty}=3$. So no more than $3$ litres flow in after $t=1$.'
          - problem: 'A server receives requests at the rate $r(t)=\frac{2+\sin t}{t}$ per second, $t$ seconds after a test begins, for $t\geq1$. Does the total number of requests over all time stay finite, or does it grow without bound?'
            answer: 'grows without bound'
            answer_contract: {"kind":"label","options":[["grows without bound","it grows without bound","diverges","it diverges","unbounded","infinite","does not stay finite"],["stays finite","it stays finite","converges","it converges","finite","bounded"]]}
            solution_sketch: 'Since $\sin t\geq-1$, we have $2+\sin t\geq1$, so $r(t)\geq\frac1t$ for $t\geq1$. The integral $\int_1^{\infty}\frac{dt}{t}$ diverges because $p=1$. By comparison the total number of requests grows without bound.'
          - problem: 'For $x\geq4$ we have $\frac{1}{\sqrt{x}-1}\geq\frac{1}{\sqrt{x}}$, and $\int_4^{b}\frac{dx}{\sqrt{x}}=2\sqrt{b}-4$. For which value of $b$ does this lower bound for $\int_4^{b}\frac{dx}{\sqrt{x}-1}$ equal $100$?'
            answer: '2704'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'We need $2\sqrt{b}-4=100$, so $2\sqrt{b}=104$ and $\sqrt{b}=52$. Then $b=52^2=2704$. Since $2\sqrt b$ grows without bound, the integral of $\frac{1}{\sqrt{x}-1}$ over $[4,\infty)$ diverges.'
          - problem: 'Compare $\frac{1}{x^3+x}$ with $\frac{1}{x^3}$ on $[2,\infty)$. What upper bound does the comparison test give for $\int_2^{\infty}\frac{dx}{x^3+x}$?'
            answer: '1/8'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'For $x\geq2$ we have $0<\frac{1}{x^3+x}<\frac{1}{x^3}$. Then $\int_2^{\infty}x^{-3}\,dx=\left[-\frac{1}{2x^2}\right]_2^{\infty}=\frac18$. So the integral is at most $\frac18$.'
          - problem: 'Since $\cos x\leq1$, we have $\frac{2+\cos x}{x^3}\leq\frac{3}{x^3}$ for $x\geq1$. What upper bound does the comparison test give for $\int_1^{\infty}\frac{2+\cos x}{x^3}\,dx$?'
            answer: '3/2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'For $x\geq1$ we have $0<\frac{2+\cos x}{x^3}\leq\frac{3}{x^3}$. Then $\int_1^{\infty}3x^{-3}\,dx=\left[-\frac{3}{2x^2}\right]_1^{\infty}=\frac32$. So the integral is at most $\frac32$.'
        constraints: "comparisons against p-integrals or e^{-x}; the inequality must hold on the whole interval and be stated; questions ask for the verdict, the comparison bound, or a quantity read from the bound; context items: reservoir and server"
    diagnostic_exemplar:
      problem: 'Determine whether $\int_1^{\infty} \frac{dx}{\sqrt{x^6 + 1}}$ converges.'
      answer: 'converges — $\frac{1}{\sqrt{x^6 + 1}} \le \frac{1}{x^3}$ and $\int_1^{\infty} x^{-3}\,dx$ converges'
      answer_contract: {kind: none}
      solution_sketch: '$\sqrt{x^6 + 1} \ge x^3$, so the integrand is dominated by a convergent $p = 3$ integral.'
    anki_seeds:
      - front: '$\int_1^{\infty} x^{-p} \, dx$ converges exactly when...'
        back: '$p > 1$'
        type: basic
      - front: '$\int_0^1 x^{-p} \, dx$ converges exactly when...'
        back: '$p < 1$'
        type: basic
      - front: 'Comparison test for improper integrals: if $0 \le f \le g$ on $[a,\infty)$...'
        back: '$\int g$ converges $\Rightarrow$ $\int f$ converges; $\int f$ diverges $\Rightarrow$ $\int g$ diverges'
        type: basic

  - id: choosing-integration-technique
    name: Choosing an Integration Technique
    core: false                # mixed-practice strategy capstone
    difficulty: 0.75
    drill: false
    answer_kind: numeric
    expected_time_secs: 240
    prerequisites:
      - id: integration-by-parts
        weight: 0.6
        key: true
      - id: trigonometric-substitution
        weight: 0.5
        key: true
      - id: partial-fractions-integration
        weight: 0.6
        key: true
      - id: trigonometric-integrals
        weight: 0.5
    knowledge_points:
      - id: kp1
        name: 'Recognizing the right technique'
        key_prerequisites: [integration-by-parts, partial-fractions-integration, trigonometric-substitution]
        step_check:
          step: 'the derivative of the inside function $x^3$ is $3x^2$, which is present up to the constant $3$'
          question: 'Why does the factor $x^2$ in $\int x^2e^{x^3}\,dx$ point to substitution?'
          options:
            - 'A power of $x$ times an exponential always needs parts'
            - 'The exponent $x^3$ is too complicated for any other technique'
            - 'The integrand is a rational function with a factored denominator'
            - 'It is a multiple of the derivative of the inside function $x^3$'
          answer: 'It is a multiple of the derivative of the inside function $x^3$'
          why: 'Since $\frac{d}{dx}x^3=3x^2$, substituting $u=x^3$ turns $x^2\,dx$ into $\frac13\,du$ and the integral becomes $\frac13\int e^u\,du$.'
        exemplars:
          - problem: 'Evaluate $\int x e^{x^2}\,dx$.'
            answer: 'e^(x^2)/2'
            answer_contract: {"kind":"function","vars":["x"],"up_to_constant":true}
            solution_sketch: 'The derivative of the inside function $x^2$ is $2x$, which appears in the integrand up to the constant $2$. So substitute $u=x^2$, giving $x\,dx=\frac12\,du$. Then $\frac12\int e^u\,du=\frac{e^{x^2}}{2}+C$.'
          - problem: 'Which technique is the most direct way to evaluate $\int x\cos(4x)\,dx$?'
            answer: 'integration by parts'
            answer_contract: {"kind":"label","options":[["u-substitution","substitution","u substitution","u-sub"],["integration by parts","by parts","parts","integrate by parts"],["partial fractions","partial fraction","partial fraction decomposition"],["trigonometric substitution","trig substitution","trig sub","trigonometric sub"],["trigonometric integrals","trigonometric integral","trig integrals","trig integral","trig identities","trigonometric identities","trig identity","powers of trig functions"]]}
            solution_sketch: 'The integrand is a product of the polynomial $x$ and the trigonometric function $\cos(4x)$. No inner function has its derivative present, so substitution does not help. Integration by parts with $u=x$ and $dv=\cos(4x)\,dx$ removes the polynomial factor.'
          - problem: 'Evaluate $\int_0^1 \frac{dx}{x^2+3x+2}$ to three decimal places.'
            answer: '0.288'
            answer_contract: {"kind":"approx","decimals":3}
            solution_sketch: 'The denominator factors as $(x+1)(x+2)$, so use partial fractions: $\frac{1}{x^2+3x+2}=\frac{1}{x+1}-\frac{1}{x+2}$. Then $\left[\ln\frac{x+1}{x+2}\right]_0^1=\ln\frac23-\ln\frac12=\ln\frac43$. This is $0.288$ to three decimal places.'
          - problem: 'Evaluate $\int_0^4 \sqrt{16-x^2}\,dx$.'
            answer: '4*pi'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The radical has the form $a^2-x^2$ with $a=4$, which calls for $x=4\sin\theta$. Then $\sqrt{16-x^2}=4\cos\theta$ and $dx=4\cos\theta\,d\theta$, and $\theta$ runs from $0$ to $\frac{\pi}{2}$. So the integral is $16\int_0^{\pi/2}\cos^2\theta\,d\theta=16\cdot\frac{\pi}{4}=4\pi$.'
          - problem: 'A particle moves along a line with velocity $v(t)=t\sin(t^2)$ metres per second. What is its displacement from $t=0$ to $t=\sqrt{\pi}$?'
            answer: '1'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'The displacement is $\int_0^{\sqrt{\pi}}t\sin(t^2)\,dt$, and the derivative of $t^2$ is present as the factor $t$ up to the constant $2$. With $u=t^2$ the limits become $0$ and $\pi$, and the integral is $\frac12\int_0^{\pi}\sin u\,du=\frac12\cdot2=1$. The displacement is $1$ metre.'
          - problem: 'Evaluate $\int x^2\ln x\,dx$.'
            answer: 'x^3*ln(x)/3 - x^3/9'
            answer_contract: {"kind":"function","vars":["x"],"up_to_constant":true}
            solution_sketch: 'The integrand is a product of a power and a logarithm, and substitution does not apply. Use integration by parts with $u=\ln x$ and $dv=x^2\,dx$, so $du=\frac{dx}{x}$ and $v=\frac{x^3}{3}$. Then $\frac{x^3}{3}\ln x-\frac13\int x^2\,dx=\frac{x^3\ln x}{3}-\frac{x^3}{9}+C$.'
          - problem: 'Which technique is the most direct way to evaluate $\int \sin^2 x\cos^2 x\,dx$?'
            answer: 'trigonometric integrals'
            answer_contract: {"kind":"label","options":[["u-substitution","substitution","u substitution","u-sub"],["integration by parts","by parts","parts","integrate by parts"],["partial fractions","partial fraction","partial fraction decomposition"],["trigonometric substitution","trig substitution","trig sub","trigonometric sub"],["trigonometric integrals","trigonometric integral","trig integrals","trig integral","trig identities","trigonometric identities","trig identity","powers of trig functions"]]}
            solution_sketch: 'The integrand is a product of even powers of sine and cosine. No inner function has its derivative present, and there is no radical or fraction. Write $\sin x\cos x=\frac12\sin 2x$ and then a half-angle identity, which is the method of trigonometric integrals.'
          - problem: 'Sam tries integration by parts on $\int_0^3 \frac{x}{x^2+9}\,dx$, and the integrals get harder at each step. What is the value of the integral?'
            answer: 'ln(2)/2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The derivative of $x^2+9$ is $2x$, which is present up to the constant $2$, so substitution is the better technique. With $u=x^2+9$ the limits become $9$ and $18$, and $\frac12\int_9^{18}\frac{du}{u}=\frac12\ln\frac{18}{9}=\frac12\ln2$.'
          - problem: 'Water flows into a tank at the rate $r(t)=te^{-t}$ litres per minute, $t$ minutes after a valve opens. How many litres flow in during the first $2$ minutes?'
            answer: '1 - 3*e^(-2)'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The integrand is a product of a polynomial and an exponential, so use integration by parts with $u=t$ and $dv=e^{-t}\,dt$. This gives $\left[-te^{-t}-e^{-t}\right]_0^2=-2e^{-2}-e^{-2}+1$. The volume is $1-3e^{-2}$ litres.'
          - problem: 'What is the average value of $f(x)=xe^{x^2}$ on the interval $[0,2]$?'
            answer: '(e^4 - 1)/4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The average value is $\frac{1}{2-0}\int_0^2 xe^{x^2}\,dx$. With $u=x^2$ the integral is $\frac12\int_0^4e^u\,du=\frac{e^4-1}{2}$. Dividing by the length $2$ of the interval gives $\frac{e^4-1}{4}$.'
          - problem: 'Evaluate $\int \frac{(\ln x)^2}{x}\,dx$.'
            answer: '(ln(x))^3/3'
            answer_contract: {"kind":"function","vars":["x"],"up_to_constant":true}
            solution_sketch: 'The derivative of the inside function $\ln x$ is $\frac1x$, and it is present as the factor $\frac1x$. So substitute $u=\ln x$, which gives $\int u^2\,du=\frac{u^3}{3}$. Back-substituting gives $\frac{(\ln x)^3}{3}+C$.'
          - problem: 'Evaluate $\int_3^5 \frac{dx}{x^2-1}$ to three decimal places.'
            answer: '0.144'
            answer_contract: {"kind":"approx","decimals":3}
            solution_sketch: 'The integrand is a rational function and its denominator factors as $(x-1)(x+1)$, so use partial fractions: $\frac{1}{x^2-1}=\frac12\left(\frac{1}{x-1}-\frac{1}{x+1}\right)$. An antiderivative is $\frac12\ln\frac{x-1}{x+1}$, which is $\frac12\ln\frac23$ at $x=5$ and $\frac12\ln\frac12$ at $x=3$. The value is $\frac12\ln\frac43$, which is $0.144$ to three decimal places.'
        constraints: "classification items name the most direct technique among substitution, parts, partial fractions, trigonometric substitution and trigonometric integrals; every listed integral must be genuinely best solved by the named technique; context items: displacement, volume, average value"
      - id: kp2
        name: 'Substitution before another technique'
        key_prerequisites: [integration-by-parts, trigonometric-substitution]
        step_check:
          step: 'what remains is a product'
          question: 'Why is integration by parts the right second step after substituting $t=\sqrt{x}$?'
          options:
            - 'The integral now holds a trigonometric function, which always needs parts'
            - 'A product $t\cos t$ remains, and no further substitution fits it'
            - 'Parts is the only technique that can remove a square root'
            - 'The substitution made the integrand longer, so parts must undo it'
          answer: 'A product $t\cos t$ remains, and no further substitution fits it'
          why: 'The factor $t$ is not the derivative of anything inside $\cos t$, so parts, which differentiates $t$ away, is the way to finish.'
        exemplars:
          - problem: 'Evaluate $\int e^{\sqrt{x}}\,dx$.'
            answer: '2*(sqrt(x) - 1)*e^(sqrt(x))'
            answer_contract: {"kind":"function","vars":["x"],"up_to_constant":true}
            solution_sketch: 'The root hides a product, so substitute first and finish with a second technique. Let $t=\sqrt{x}$, so $x=t^2$ and $dx=2t\,dt$. The integral becomes $2\int te^t\,dt$, and integration by parts gives $2(t-1)e^t$. Back-substituting $t=\sqrt{x}$ gives $2(\sqrt{x}-1)e^{\sqrt{x}}+C$.'
          - problem: 'Evaluate $\int x^3\sqrt{x^2+1}\,dx$.'
            answer: '(x^2+1)^(5/2)/5 - (x^2+1)^(3/2)/3'
            answer_contract: {"kind":"function","vars":["x"],"up_to_constant":true}
            solution_sketch: 'A substitution simplifies the inside first, and a second step finishes the job. Let $u=x^2+1$, so $x\,dx=\frac12\,du$ and $x^2=u-1$. Then $\frac12\int(u-1)\sqrt{u}\,du=\frac12\left(\frac25u^{5/2}-\frac23u^{3/2}\right)$. Back-substituting gives $\frac{(x^2+1)^{5/2}}{5}-\frac{(x^2+1)^{3/2}}{3}+C$.'
          - problem: 'Evaluate $\int x^3e^{x^2}\,dx$.'
            answer: '(x^2 - 1)*e^(x^2)/2'
            answer_contract: {"kind":"function","vars":["x"],"up_to_constant":true}
            solution_sketch: 'A substitution simplifies the inside first, and a second step finishes the job. Let $u=x^2$, so $x^3\,dx=x^2\cdot x\,dx=\frac12u\,du$. The integral becomes $\frac12\int ue^u\,du$, and integration by parts gives $\frac12(u-1)e^u$. Back-substituting gives $\frac12\left(x^2-1\right)e^{x^2}+C$.'
          - problem: 'Evaluate $\int \frac{x^3}{\sqrt{x^2+1}}\,dx$.'
            answer: 'sqrt(x^2+1)*(x^2 - 2)/3'
            answer_contract: {"kind":"function","vars":["x"],"up_to_constant":true}
            solution_sketch: 'A substitution simplifies the inside first, and a second step finishes the job. Let $u=x^2+1$, so $x\,dx=\frac12\,du$ and $x^2=u-1$. Then $\frac12\int(u-1)u^{-1/2}\,du=\frac12\left(\frac23u^{3/2}-2u^{1/2}\right)$. Back-substituting and factoring gives $\frac{\sqrt{x^2+1}\,(x^2-2)}{3}+C$.'
          - problem: 'Evaluate $\int x^3\cos(x^2)\,dx$.'
            answer: '(x^2*sin(x^2) + cos(x^2))/2'
            answer_contract: {"kind":"function","vars":["x"],"up_to_constant":true}
            solution_sketch: 'A substitution simplifies the inside first, and a second step finishes the job. Let $u=x^2$, so $x^3\,dx=\frac12u\,du$. The integral becomes $\frac12\int u\cos u\,du$, and integration by parts gives $\frac12(u\sin u+\cos u)$. Back-substituting gives $\frac12\left(x^2\sin x^2+\cos x^2\right)+C$.'
          - problem: 'Evaluate $\int x^5\sqrt{x^3+1}\,dx$.'
            answer: '2*(x^3+1)^(3/2)*(3*x^3 - 2)/45'
            answer_contract: {"kind":"function","vars":["x"],"up_to_constant":true}
            solution_sketch: 'A substitution simplifies the inside first, and a second step finishes the job. Let $u=x^3+1$, so $x^2\,dx=\frac13\,du$ and $x^3=u-1$. Then $\frac13\int(u-1)\sqrt{u}\,du=\frac13\left(\frac25u^{5/2}-\frac23u^{3/2}\right)$. Back-substituting and factoring gives $\frac{2(x^3+1)^{3/2}(3x^3-2)}{45}+C$.'
          - problem: 'A particle moves along a line with velocity $v(t)=\cos\sqrt{t}$ metres per second. What is its displacement from $t=0$ to $t=\pi^2$?'
            answer: '-4'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'The root makes this hard to integrate directly, so substitute first. Let $s=\sqrt{t}$, so $dt=2s\,ds$ and the limits become $0$ and $\pi$. Then $2\int_0^{\pi}s\cos s\,ds=2\left[s\sin s+\cos s\right]_0^{\pi}=2(-1)-2(1)=-4$. The displacement is $-4$ metres.'
          - problem: 'What is the average value of $f(x)=x^3e^{x^2}$ on the interval $[0,2]$?'
            answer: '(3*e^4 + 1)/4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The antiderivative is $\frac12\left(x^2-1\right)e^{x^2}$, so $\int_0^2x^3e^{x^2}\,dx=\frac12\left(3e^4+1\right)$. The average value is this divided by the length $2$ of the interval. So the average value is $\frac{3e^4+1}{4}$.'
        constraints: "a preliminary algebraic substitution converts the integral to a parts or power-rule form; two-stage solutions only; context items: displacement and average value"
      - id: kp3
        name: 'Combining parts with other techniques'
        key_prerequisites: [integration-by-parts, partial-fractions-integration]
        step_check:
          step: 'the fraction is improper'
          question: 'Why must $\frac{2x^2}{x^2+4}$ be rewritten before it is integrated?'
          options:
            - 'Top and bottom have the same degree, so no direct rule fits'
            - 'Its denominator is irreducible, so only a substitution can follow'
            - 'A fraction with $x^2$ on top always calls for another round of parts'
            - 'The constant $2$ in the numerator must be moved out of the integral'
          answer: 'Top and bottom have the same degree, so no direct rule fits'
          why: 'Dividing gives $\frac{2x^2}{x^2+4}=2-\frac{8}{x^2+4}$, a constant plus an arctangent pattern, and both pieces are easy to integrate.'
        exemplars:
          - problem: 'Evaluate $\int \ln(x^2+1)\,dx$.'
            answer: 'x*ln(x^2+1) - 2*x + 2*atan(x)'
            answer_contract: {"kind":"function","vars":["x"],"up_to_constant":true}
            solution_sketch: 'Use integration by parts with $u=\ln(x^2+1)$ and $dv=dx$, so $du=\frac{2x}{x^2+1}\,dx$ and $v=x$. This gives $x\ln(x^2+1)-\int\frac{2x^2}{x^2+1}\,dx$. Split $\frac{2x^2}{x^2+1}=2-\frac{2}{x^2+1}$ to get $x\ln(x^2+1)-2x+2\arctan x+C$.'
          - problem: 'Evaluate $\int_0^1 x\arctan x\,dx$.'
            answer: 'pi/4 - 1/2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Use parts with $u=\arctan x$ and $dv=x\,dx$, taking $v=\frac{x^2+1}{2}$. This gives $\frac{x^2+1}{2}\arctan x-\frac12\int\frac{x^2}{x^2+1}\,dx$, and $\frac{x^2}{x^2+1}=1-\frac{1}{x^2+1}$ gives the antiderivative $\frac{x^2+1}{2}\arctan x-\frac{x}{2}$. At $x=1$ it is $\frac{\pi}{4}-\frac12$ and at $x=0$ it is $0$.'
          - problem: 'Evaluate $\int_0^1 x\ln(x+1)\,dx$.'
            answer: '1/4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Use parts with $u=\ln(x+1)$ and $dv=x\,dx$. This gives $\frac{x^2}{2}\ln(x+1)-\frac12\int\frac{x^2}{x+1}\,dx$, and $\frac{x^2}{x+1}=x-1+\frac{1}{x+1}$. At $x=1$ the logarithms cancel and the value is $-\frac12\left(\frac12-1\right)=\frac14$, and at $x=0$ it is $0$.'
          - problem: 'Evaluate $\int_0^1 x^3\arctan x\,dx$.'
            answer: '1/6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Use parts with $u=\arctan x$ and $dv=x^3\,dx$, so $v=\frac{x^4}{4}$. This gives $\frac{x^4}{4}\arctan x-\frac14\int\frac{x^4}{1+x^2}\,dx$, and $\frac{x^4}{1+x^2}=x^2-1+\frac{1}{1+x^2}$. At $x=1$ the arctangent terms cancel and the value is $-\frac14\left(\frac13-1\right)=\frac16$.'
          - problem: 'A drone flies with speed $v(t)=\arctan t$ metres per second. How far, in metres, does it fly from $t=0$ to $t=1$?'
            answer: 'pi/4 - ln(2)/2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The distance is $\int_0^1\arctan t\,dt$. Use parts with $u=\arctan t$ and $dv=dt$, giving $t\arctan t-\int\frac{t}{1+t^2}\,dt=t\arctan t-\frac12\ln(1+t^2)$. At $t=1$ this is $\frac{\pi}{4}-\frac12\ln2$, and at $t=0$ it is $0$.'
          - problem: 'A sensor signal is $s(t)=\ln(t^2+1)$ volts for $0\leq t\leq2$ seconds. What is the average value of the signal over this interval?'
            answer: 'ln(5) - 2 + atan(2)'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The antiderivative of $\ln(t^2+1)$ is $t\ln(t^2+1)-2t+2\arctan t$, found by parts. At $t=2$ it is $2\ln5-4+2\arctan2$, and at $t=0$ it is $0$. Dividing by the length $2$ of the interval gives the average value $\ln5-2+\arctan2$.'
          - problem: 'Evaluate $\int_0^{1/\sqrt{3}} x\arctan x\,dx$.'
            answer: 'pi/9 - sqrt(3)/6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Use the antiderivative $\frac{x^2+1}{2}\arctan x-\frac{x}{2}$ from parts and the split $\frac{x^2}{x^2+1}=1-\frac{1}{x^2+1}$. At $x=\frac{1}{\sqrt3}$ we have $\arctan x=\frac{\pi}{6}$ and $\frac{x^2+1}{2}=\frac23$, so the value is $\frac23\cdot\frac{\pi}{6}-\frac{1}{2\sqrt3}=\frac{\pi}{9}-\frac{\sqrt3}{6}$.'
          - problem: 'Evaluate $\int_0^1 x^2\ln(x^2+1)\,dx$.'
            answer: 'ln(2)/3 + 4/9 - pi/6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Use parts with $u=\ln(x^2+1)$ and $dv=x^2\,dx$, so $v=\frac{x^3}{3}$. This gives $\frac{x^3}{3}\ln(x^2+1)-\frac23\int\frac{x^4}{x^2+1}\,dx$, and $\frac{x^4}{x^2+1}=x^2-1+\frac{1}{x^2+1}$. At $x=1$ the value is $\frac{\ln2}{3}-\frac23\left(\frac13-1+\frac{\pi}{4}\right)=\frac{\ln2}{3}+\frac49-\frac{\pi}{6}$, and at $x=0$ it is $0$.'
        constraints: "exactly two techniques chained; the follow-up integral must be an improper-fraction split or an arctan pattern; context items: distance and average value"
    diagnostic_exemplar:
      problem: 'Evaluate $\int x \sec^2 x \, dx$.'
      answer: '$x \tan x + \ln|\cos x| + C$'
      answer_contract: {kind: none}
      solution_sketch: 'Parts with $u = x$, $dv = \sec^2 x\,dx$: $x\tan x - \int \tan x\,dx = x\tan x + \ln|\cos x| + C$.'
    anki_seeds:
      - front: "First question to ask before choosing an integration technique?"
        back: "Is the derivative of an inner function present (up to a constant)? If so, u-substitution first."
        type: basic
      - front: "Rational function integrand: the decision procedure?"
        back: "If the numerator degree >= denominator degree, divide; then factor the denominator and use partial fractions."
        type: basic
