          - problem: 'Evaluate $\int_1^{\infty} \frac{dx}{x^2}$ or state that it diverges.'
            answer: "1"
            solution_sketch: '$\lim_{b\to\infty} [-\frac{1}{x}]_1^b = \lim_{b\to\infty} (1 - \frac{1}{b}) = 1$.'
          - problem: "Evaluate the improper integral $\\int_1^{\\infty} \\frac{dx}{x}$. Select the correct outcome."
            answer: "infinity"
            answer_contract: {"kind": "label", "options": [["infinity", "inf", "oo"], ["DNE", "does not exist"], ["-infinity", "-inf", "-oo"], ["0"]]}
            solution_sketch: "Write the improper integral as a limit: $\\int_1^{\\infty} \\frac{dx}{x} = \\lim_{b\\to\\infty} \\int_1^b \\frac{dx}{x}$. By the Fundamental Theorem of Calculus, $\\lim_{b\\to\\infty} [\\ln(x)]_1^b = \\lim_{b\\to\\infty} \\ln(b)$, and this limit is infinity. A choice of DNE would mistake an infinite limit for a nonexistent limit, -infinity would come from a sign error, and 0 would confuse the growth of $\\ln(b)$ with the decay of $1/b$. The answer is infinity."
          - problem: "Evaluate the improper integral $\\int_2^{\\infty} x^{-3}\\,dx$ or state that it diverges. Give the answer as a fraction."
            answer: "1/8"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Write the improper integral as a limit: $\\int_2^{\\infty} x^{-3}\\,dx = \\lim_{b\\to\\infty} \\int_2^b x^{-3}\\,dx$. By the power rule for antiderivatives, the antiderivative is $-1/(2x^2)$, so the limit is $\\lim_{b\\to\\infty} (-1/(2b^2) + 1/8)$. Since $-1/(2b^2)$ tends to 0, the value is $1/8$. The answer is 1/8."
          - problem: "Evaluate the improper integral $\\int_3^{\\infty} \\frac{dx}{x^2}$ or state that it diverges. Give the answer as a fraction."
            answer: "1/3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Write the improper integral as a limit: $\\int_3^{\\infty} \\frac{dx}{x^2} = \\lim_{b\\to\\infty} \\int_3^b x^{-2}\\,dx$. By the power rule for antiderivatives, the antiderivative is $-1/x$, so the limit is $\\lim_{b\\to\\infty} (-1/b + 1/3)$. Since $-1/b$ tends to 0, the value is $1/3$. The answer is 1/3."
          - problem: "Evaluate the improper integral $\\int_1^{\\infty} \\frac{2}{x^4}\\,dx$ or state that it diverges. Give the answer as a fraction."
            answer: "2/3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Write the improper integral as a limit: $\\int_1^{\\infty} \\frac{2}{x^4}\\,dx = \\lim_{b\\to\\infty} \\int_1^b 2x^{-4}\\,dx$. By the power rule for antiderivatives, the antiderivative is $-2/(3x^3)$, so the limit is $\\lim_{b\\to\\infty} (-2/(3b^3) + 2/3)$. Since $-2/(3b^3)$ tends to 0, the value is $2/3$. The answer is 2/3."
          - problem: "Evaluate the improper integral $\\int_{-\\infty}^{-2} \\frac{dx}{x^2}$ or state that it diverges. Give the answer as a fraction."
            answer: "1/2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Write the improper integral as a limit: $\\int_{-\\infty}^{-2} \\frac{dx}{x^2} = \\lim_{a\\to-\\infty} \\int_a^{-2} x^{-2}\\,dx$. By the power rule for antiderivatives, the antiderivative is $-1/x$, so the limit is $\\lim_{a\\to-\\infty} (-1/(-2) + 1/a) = 1/2 + 0$. The value is $1/2$. The answer is 1/2."
        constraints: "one infinite endpoint; power-function integrands; always write the limit explicitly"
      - id: kp2
        name: Exponential and arctangent integrands
        key_prerequisites: [definite-integrals-ftc, antiderivatives]
        exemplars:
          - problem: 'Evaluate $\int_0^{\infty} e^{-x} \, dx$.'
            answer: "1"
            solution_sketch: '$\lim_{b\to\infty} [-e^{-x}]_0^b = 0 - (-1) = 1$.'
          - problem: 'Evaluate $\int_0^{\infty} e^{-2x} \, dx$.'
            answer: '$1/2$'
            solution_sketch: '$\lim_{b\to\infty} [-\frac{1}{2}e^{-2x}]_0^b = \frac{1}{2}$.'
          - problem: 'Evaluate $\int_0^{\infty} \frac{dx}{1 + x^2}$.'
            answer: '$\pi/2$'
            solution_sketch: '$\lim_{b\to\infty} \arctan b - \arctan 0 = \frac{\pi}{2}$.'
          - problem: "Evaluate $\\int_0^{\\infty} e^{-3x} \\, dx$."
            answer: "1/3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Definition of an improper integral: write it as $\\lim_{b\\to\\infty} \\int_0^b e^{-3x}\\,dx$. The exponential antiderivative rule gives $\\int e^{-3x}\\,dx = -\\frac{1}{3}e^{-3x}$. The Fundamental Theorem of Calculus gives $[-\\frac{1}{3}e^{-3x}]_0^b = -\\frac{1}{3}e^{-3b} + \\frac{1}{3}$. The limit at infinity of $e^{-3b}$ is $0$, so the value is 1/3."
          - problem: "Evaluate $\\int_0^{\\infty} \\frac{dx}{4 + x^2}$."
            answer: "pi/4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Definition of an improper integral: write it as $\\lim_{b\\to\\infty} \\int_0^b \\frac{dx}{4+x^2}$. The arctangent antiderivative rule with $a=2$ gives $\\int \\frac{dx}{a^2+x^2} = \\frac{1}{a}\\arctan(x/a)$, so here it is $\\frac{1}{2}\\arctan(x/2)$. The Fundamental Theorem of Calculus gives $[\\frac{1}{2}\\arctan(x/2)]_0^b = \\frac{1}{2}\\arctan(b/2) - 0$. The limit at infinity of $\\arctan(b/2)$ is $\\pi/2$, so the value is pi/4."
          - problem: "Evaluate $\\int_2^{\\infty} e^{-x} \\, dx$."
            answer: "e^(-2)"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Definition of an improper integral: write it as $\\lim_{b\\to\\infty} \\int_2^b e^{-x}\\,dx$. The exponential antiderivative rule gives $\\int e^{-x}\\,dx = -e^{-x}$. The Fundamental Theorem of Calculus gives $[-e^{-x}]_2^b = -e^{-b} + e^{-2}$. The limit at infinity of $e^{-b}$ is $0$, so the value is e^(-2)."
        constraints: "antiderivative is e^{-ax} or arctan; a in {1, 2, 3}"
      - id: kp3
        name: Doubly infinite intervals and divergence by oscillation
        key_prerequisites: [definite-integrals-ftc, limits-at-infinity-rational]
        exemplars:
          - problem: 'Evaluate $\int_{-\infty}^{\infty} \frac{dx}{1 + x^2}$.'
            answer: '$\pi$'
            solution_sketch: 'Split at $0$: each half contributes $\frac{\pi}{2}$ (both limits must exist separately).'
          - problem: 'Evaluate $\int_0^{\infty} \cos x \, dx$ or state that it diverges.'
            answer: 'diverges'
            answer_contract: {kind: none}
            solution_sketch: 'The limit of $[\sin x]_0^b = \sin b$ oscillates between $-1$ and $1$, so the improper integral diverges.'
        constraints: "split doubly infinite integrals at 0; include one oscillating-divergence example"
    diagnostic_exemplar:
      problem: 'Evaluate $\int_{-\infty}^{\infty} \frac{dx}{4 + x^2}$ or state that it diverges.'
      answer: '$\pi/2$'
      solution_sketch: 'Split at $0$ and take limits: $\frac12\arctan(x/2)$ runs from $-\frac{\pi}{4}$ to $\frac{\pi}{4}$ on each side, giving $\frac{\pi}{4} + \frac{\pi}{4}$.'
    anki_seeds:
      - front: 'Definition: $\int_a^{\infty} f(x)\,dx = $ ?'
        back: '$\lim_{b\to\infty} \int_a^b f(x)\,dx$ (convergent iff the limit is finite)'
        type: basic
      - front: '$\int_{-\infty}^{\infty} f(x)\,dx$ converges iff...'
        back: "both halves (split at any finite point) converge separately"
        type: basic

  - id: improper-integrals-discontinuous
    name: Improper Integrals with Discontinuous Integrands
    core: true
    difficulty: 0.62
    drill: false
    answer_kind: expression
    expected_time_secs: 180
    prerequisites:
      - id: definite-integrals-ftc
        weight: 0.7
        key: true
      - id: one-sided-limits
        weight: 0.6
        key: true
      - id: improper-integrals-infinite-limits
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: Vertical asymptote at an endpoint
        key_prerequisites: [definite-integrals-ftc, one-sided-limits]
        exemplars:
          - problem: 'Evaluate $\int_0^1 \frac{dx}{\sqrt{x}}$ or state that it diverges.'
            answer: "2"
            solution_sketch: '$\lim_{a\to 0^+} [2\sqrt{x}]_a^1 = 2 - 0 = 2$.'
          - problem: "Evaluate $\\int_0^1 x^{-2}\\,dx$. Select the correct statement."
            answer: "diverges"
            answer_contract: {"kind": "label", "options": [["diverges"], ["converges to 1"], ["converges to 2"], ["converges to 3"]]}
            solution_sketch: "The improper integral is $\\int_0^1 x^{-2}\\,dx$. Step 1: find the antiderivative: $\\int x^{-2}\\,dx = -x^{-1}$ by the power rule. Step 2: replace the lower limit with $a$ and take the limit: $\\lim_{a\\to 0^+}[-x^{-1}]_a^1 = \\lim_{a\\to 0^+}(1/a - 1) = \\infty$. The option 'converges to 1' is wrong because it uses only the upper-limit value; 'converges to 2' is wrong because it confuses the exponent with $1/2$; 'converges to 3' is wrong because it reverses the exponent. The integral diverges."
          - problem: 'Evaluate $\int_0^4 \frac{dx}{\sqrt{x}}$.'
            answer: "4"
            solution_sketch: '$\lim_{a\to 0^+} [2\sqrt{x}]_a^4 = 4$.'
          - problem: "Evaluate $\\int_0^1 x^{-1/3}\\,dx$. Give the answer as a fraction."
            answer: "3/2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The improper integral is $\\int_0^1 x^{-1/3}\\,dx$. Step 1: find the antiderivative: $\\int x^{-1/3}\\,dx = \\frac{3}{2}x^{2/3}$ by the power rule. Step 2: replace the lower limit with $a$ and take the limit: $\\lim_{a\\to 0^+} \\left[\\frac{3}{2}x^{2/3}\\right]_a^1 = \\frac{3}{2} - 0 = \\frac{3}{2}$. The answer is 3/2."
          - problem: "Evaluate $\\int_0^8 x^{-2/3}\\,dx$."
            answer: "6"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The improper integral is $\\int_0^8 x^{-2/3}\\,dx$. Step 1: find the antiderivative: $\\int x^{-2/3}\\,dx = 3x^{1/3}$ by the power rule. Step 2: replace the lower limit with $a$ and take the limit: $\\lim_{a\\to 0^+} \\left[3x^{1/3}\\right]_a^8 = 3 \\cdot 2 - 0 = 6$. The answer is 6."
          - problem: "Evaluate $\\int_0^{16} x^{-3/4}\\,dx$."
            answer: "8"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The improper integral is $\\int_0^{16} x^{-3/4}\\,dx$. Step 1: find the antiderivative: $\\int x^{-3/4}\\,dx = 4x^{1/4}$ by the power rule. Step 2: replace the lower limit with $a$ and take the limit: $\\lim_{a\\to 0^+} \\left[4x^{1/4}\\right]_a^{16} = 4 \\cdot 2 - 0 = 8$. The answer is 8."
        constraints: "single vertical asymptote at an endpoint of the interval; integrand of the form x^{-p}"
      - id: kp2
        name: Asymptotes at the upper endpoint
        key_prerequisites: [definite-integrals-ftc, one-sided-limits]
        exemplars:
          - problem: 'Evaluate $\int_0^1 \frac{dx}{\sqrt[3]{1 - x}}$ or state that it diverges.'
            answer: '$3/2$'
            solution_sketch: '$\lim_{b\to 1^-} [-\frac{3}{2}(1-x)^{2/3}]_0^b = 0 + \frac{3}{2} = \frac{3}{2}$.'
          - problem: "The improper integral $\\int_0^1 \\frac{dx}{1 - x}$ has an asymptote at its upper endpoint. Which of these describes the value of the integral?"
            answer: "infinity"
            answer_contract: {"kind": "label", "options": [["DNE", "does not exist"], ["infinity", "inf", "oo"], ["-infinity", "-inf", "-oo"], ["0"]]}
            solution_sketch: "The full object is $\\int_0^1 \\frac{dx}{1 - x}$, whose integrand has an asymptote at x = 1. Step 1 (definition of an improper integral with a discontinuous integrand): write it as $\\lim_{b \\to 1^-} \\int_0^b \\frac{dx}{1 - x}$. Step 2 (Fundamental Theorem of Calculus): an antiderivative is $-\\ln(1 - x)$, so the truncated value is $-\\ln(1 - b) + \\ln(1) = -\\ln(1 - b)$. Step 3 (one-sided limit): as b tends to 1 from the left, $-\\ln(1 - b)$ grows without bound, so there is no finite value and the integral diverges to infinity. The option -infinity comes from dropping the minus sign in the antiderivative; the option DNE comes from assuming a signed limit cannot exist; the option 0 comes from treating the truncated values as shrinking toward zero. The answer is infinity."
          - problem: "Evaluate $\\int_0^4 \\frac{dx}{\\sqrt{4 - x}}$ or state that it diverges."
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full object is $\\int_0^4 \\frac{dx}{\\sqrt{4 - x}}$, with an asymptote at the upper endpoint x = 4. Step 1 (definition for a discontinuous integrand): replace the endpoint by b and write $\\lim_{b \\to 4^-} \\int_0^b (4 - x)^{-1/2} dx$. Step 2 (Fundamental Theorem of Calculus with the power rule): an antiderivative is $-2(4 - x)^{1/2}$, so the truncated value is $-2\\sqrt{4 - b} + 2\\sqrt{4}$. Step 3 (one-sided limit): as b tends to 4 from the left the term $-2\\sqrt{4 - b}$ vanishes and $2\\sqrt{4} = 4$ remains. The answer is 4."
          - problem: "The integrand of $\\int_1^9 \\frac{dx}{\\sqrt{9 - x}}$ blows up at the upper endpoint. Find the value of the integral, or state that it diverges."
            answer: "4sqrt(2)"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full object is $\\int_1^9 \\frac{dx}{\\sqrt{9 - x}}$, whose integrand blows up at x = 9. Step 1 (improper integral definition): write it as $\\lim_{b \\to 9^-} \\int_1^b (9 - x)^{-1/2} dx$. Step 2 (Fundamental Theorem of Calculus): the antiderivative $-2\\sqrt{9 - x}$ gives the truncated value $-2\\sqrt{9 - b} + 2\\sqrt{8}$. Step 3 (one-sided limit): as b tends to 9 from the left the first term vanishes and $2\\sqrt{8} = 4\\sqrt{2}$. The answer is 4sqrt(2)."
          - problem: "Evaluate $\\int_0^8 \\frac{dx}{(8 - x)^{1/3}}$ or state that it diverges."
            answer: "6"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full object is $\\int_0^8 \\frac{dx}{(8 - x)^{1/3}}$, which has an asymptote at the upper endpoint x = 8. Step 1 (improper integral definition): write $\\lim_{b \\to 8^-} \\int_0^b (8 - x)^{-1/3} dx$. Step 2 (Fundamental Theorem of Calculus with the power rule): an antiderivative is $-(3/2)(8 - x)^{2/3}$, so the truncated value is $-(3/2)(8 - b)^{2/3} + (3/2)8^{2/3}$. Step 3 (one-sided limit): as b tends to 8 from the left the first term vanishes, and $(3/2)8^{2/3} = (3/2)(4) = 6$. The answer is 6."
          - problem: "The integrand of $\\int_0^1 \\frac{dx}{(1 - x)^2}$ blows up at the upper endpoint. Which of these is the value of the integral?"
            answer: "diverges"
            answer_contract: {"kind": "label", "options": [["diverges"], ["converges to 0"], ["converges to 1"], ["converges to 2"]]}
            solution_sketch: "The full object is $\\int_0^1 \\frac{dx}{(1 - x)^2}$, whose integrand blows up at x = 1. Step 1 (improper integral definition): write it as $\\lim_{b \\to 1^-} \\int_0^b (1 - x)^{-2} dx$. Step 2 (Fundamental Theorem of Calculus with the power rule): an antiderivative is $1/(1 - x)$, so the truncated value is $1/(1 - b) - 1$. Step 3 (one-sided limit): as b tends to 1 from the left, $1/(1 - b) - 1$ grows without bound, so no finite value exists. The option converges to 0 comes from assuming the truncated values fall toward zero; the option converges to 1 comes from evaluating the truncated integral at b = 1/2; the option converges to 2 comes from substituting b = 1/2 into the antiderivative instead of taking the limit. The answer is diverges."
        constraints: "asymptote at the upper endpoint; integrand (b - x)^{-p} with p in {1/3, 1/2, 1, 2}"
      - id: kp3
        name: Interior discontinuities (split the integral)
        key_prerequisites: [definite-integrals-ftc, one-sided-limits]
        exemplars:
          - problem: 'Evaluate $\int_0^3 \frac{dx}{(x - 1)^{2/3}}$ or state that it diverges.'
            answer: '3 + 3*2^(1/3)'
            solution_sketch: 'Split at $x = 1$: $[3(x-1)^{1/3}]$ gives $3$ on $[0,1]$ and $3\sqrt[3]{2}$ on $[1,3]$; both one-sided limits exist.'
          - problem: "A student applies the FTC directly to ∫_{-1}^{1} dx/x^2 and gets -2, but the integrand blows up at x = 0. Which classification of the integral is correct?"
            answer: "diverges to infinity"
            answer_contract: {"kind": "label", "options": [["diverges to infinity"], ["converges to -2"], ["converges to 2"], ["converges to 0"]]}
            solution_sketch: "The full object is the integral ∫_{-1}^{1} dx/x^2, which has an interior discontinuity at x = 0. Step 1: split the integral at the discontinuity, as the method requires. Step 2: evaluate the right one-sided limit, lim_{a→0+} ∫_a^1 dx/x^2 = lim_{a→0+} (1/a - 1) = infinity. Step 3: a divergent half makes the whole integral divergent. The wrong option converges to -2 comes from applying the FTC across the discontinuity; the wrong option converges to 2 comes from treating the singularity as integrable; the wrong option converges to 0 comes from cancelling the two positive halves. The correct classification is diverges to infinity."
          - problem: "The integrand of ∫_0^4 dx/(x - 2)^{2/3} blows up at x = 2. Split the integral at x = 2 and evaluate it, or state that it diverges. Give the exact value."
            answer: "6*2^(1/3)"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full object is ∫_0^4 dx/(x - 2)^{2/3} with an interior discontinuity at x = 2. Step 1: split at x = 2. Step 2: left one-sided limit, lim_{b→2-} ∫_0^b (2 - x)^{-2/3} dx = lim_{b→2-} [ -3(2 - x)^{1/3} ]_0^b = 3*2^(1/3). Step 3: right one-sided limit, lim_{a→2+} ∫_a^4 (x - 2)^{-2/3} dx = lim_{a→2+} [ 3(x - 2)^{1/3} ]_a^4 = 3*2^(1/3). Step 4: add the two finite limits to get 6*2^(1/3). The value is 6*2^(1/3)."
          - problem: "The integral ∫_{-4}^{4} dx/sqrt(abs(x)) has an interior discontinuity at x = 0. Split the integral at x = 0 and evaluate each one-sided limit. State the verdict and the value."
            answer: "verdict = converges; L = 8"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["converges"], ["diverges"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "L"}]}
            solution_sketch: "The full object is ∫_{-4}^{4} dx/sqrt(abs(x)), with an interior discontinuity at x = 0. Step 1: split at x = 0. Step 2: left one-sided limit, lim_{b→0-} ∫_{-4}^{b} (-x)^{-1/2} dx = lim_{b→0-} [ -2(-x)^{1/2} ]_{-4}^{b} = 0 - (-4) = 4. Step 3: right one-sided limit, lim_{a→0+} ∫_{a}^{4} x^{-1/2} dx = lim_{a→0+} [ 2sqrt(x) ]_{a}^{4} = 4 - 0 = 4. Step 4: both one-sided limits are finite, so the integral converges to 4 + 4 = 8. The result is verdict = converges; L = 8."
          - problem: "Evaluate ∫_0^3 dx/(x - 1)^{1/3}, which has an interior discontinuity at x = 1. Split at x = 1 and evaluate each one-sided limit. Give the exact value."
            answer: "3/2*2^(2/3) - 3/2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full object is ∫_0^3 dx/(x - 1)^{1/3}, with an interior discontinuity at x = 1. Step 1: split at x = 1. Step 2: left one-sided limit, lim_{b→1-} ∫_0^b (x - 1)^{-1/3} dx = lim_{b→1-} [ (3/2)(1 - x)^{2/3} ]_0^b = -3/2. Step 3: right one-sided limit, lim_{a→1+} ∫_a^3 (x - 1)^{-1/3} dx = lim_{a→1+} [ (3/2)(x - 1)^{2/3} ]_a^3 = (3/2)*2^(2/3). Step 4: add the limits to get 3/2*2^(2/3) - 3/2. The value is 3/2*2^(2/3) - 3/2."
          - problem: "Evaluate ∫_0^4 dx/(x - 2)^{1/3}. The integrand is discontinuous at x = 2 inside the interval. Split at x = 2 and evaluate the two one-sided limits. Give the exact value."
            answer: "0"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full object is ∫_0^4 dx/(x - 2)^{1/3}, with an interior discontinuity at x = 2. Step 1: split at x = 2. Step 2: left one-sided limit, lim_{b→2-} ∫_0^b (x - 2)^{-1/3} dx = lim_{b→2-} [ (3/2)(2 - x)^{2/3} ]_0^b = -(3/2)*2^(2/3). Step 3: right one-sided limit, lim_{a→2+} ∫_a^4 (x - 2)^{-1/3} dx = lim_{a→2+} [ (3/2)(x - 2)^{2/3} ]_a^4 = (3/2)*2^(2/3). Step 4: add the limits to get 0. The value is 0."
        constraints: "one interior discontinuity; always split there and evaluate each one-sided limit; include the classic false-FTC trap"
    diagnostic_exemplar:
      problem: 'Evaluate $\int_0^2 \frac{dx}{(x - 1)^{2/3}}$ or state that it diverges.'
      answer: '6'
      solution_sketch: 'The integrand blows up at the interior point $x = 1$, so split there: each piece is $[3(x-1)^{1/3}]$ and contributes $3$.'
    anki_seeds:
      - front: "An integrand with a vertical asymptote inside [a, b]: what must you do?"
        back: "Split the integral at the discontinuity and require BOTH one-sided improper integrals to converge."
        type: basic
      - front: "Warning sign that you integrated across a hidden discontinuity?"
        back: "e.g. a negative result for a positive integrand — the FTC does not apply across an asymptote"
        type: basic

  - id: improper-integrals
    name: Improper Integrals
    core: true
    difficulty: 0.68
    drill: false
    answer_kind: numeric
    expected_time_secs: 180
    prerequisites:
      - id: improper-integrals-infinite-limits
        weight: 0.7
        key: true
      - id: improper-integrals-discontinuous
        weight: 0.6
        key: true
      - id: integration-substitution
        weight: 0.4
      - id: partial-fractions-linear-factors
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: The p-test at infinity and at zero
        key_prerequisites: [improper-integrals-infinite-limits, improper-integrals-discontinuous]
        exemplars:
          - problem: 'For which $p$ does $\int_0^1 \frac{dx}{x^p}$ converge?'
            answer: '$p < 1$'
            solution_sketch: 'Near $0$ the antiderivative $\frac{x^{1-p}}{1-p}$ has a finite limit iff $1 - p > 0$; the two p-tests are mirror images.'
          - problem: "For the integral $\\int_1^{\\infty} \\frac{dx}{x^{3/2}}$, state whether it has a finite value and give that value."
            answer: "verdict = converges; value = 2"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["converges"], ["diverges"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "value"}]}
            solution_sketch: "The integral is $\\int_1^{\\infty} x^{-3/2}\\,dx$. First apply the p-test at infinity: $\\int_1^{\\infty} x^{-p}\\,dx$ converges exactly when $p > 1$. Here $p = 3/2 > 1$, so the integral converges. Then compute it: the antiderivative is $\\frac{x^{1-p}}{1-p} = -2x^{-1/2}$, and the limit at infinity is $0$ while the value at $1$ is $-2$. Thus the integral is $0 - (-2) = 2$. The option diverges is the error of using the zero-limit p-test at infinity. The verdict is converges and the value is 2, so verdict = converges; value = 2."
          - problem: "Evaluate $\\int_1^{\\infty} \\frac{dx}{x^2}$."
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The integral is $\\int_1^{\\infty} x^{-2}\\,dx$. Apply the p-test at infinity with $p=2$, so the integral converges. The antiderivative is $-1/x$. Evaluate at the limits: $\\lim_{b\\to\\infty}(-1/b) - (-1/1) = 0 + 1 = 1$. The integral equals 1."
          - problem: "Evaluate $\\int_0^1 \\frac{dx}{x^{1/2}}$."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The integral is $\\int_0^1 x^{-1/2}\\,dx$. This is a p-test at zero with $p=1/2 < 1$, so it converges. The antiderivative is $2x^{1/2}$. Take the limit $a\\to 0^+$: $2\\sqrt{1} - 2\\sqrt{a} \\to 2$. The integral equals 2."
          - problem: "For which $p$ does $\\int_1^{\\infty} \\frac{dx}{x^p}$ converge? Give the answer as an inequality in $p$."
            answer: "p > 1"
            answer_contract: {"kind": "inequality_union"}
            solution_sketch: "The condition asked is for the integral $\\int_1^{\\infty} x^{-p}\\,dx$. This is the p-test at infinity. For $p \\neq 1$, the antiderivative is $\\frac{x^{1-p}}{1-p}$; it has a finite limit at infinity exactly when $1-p < 0$. For $p=1$ the integral is $\\int_1^{\\infty} dx/x = \\lim_{b\\to\\infty}\\ln b$, which diverges. The convergence condition is p > 1."
          - problem: "Evaluate $\\int_1^{\\infty} \\frac{dx}{x^3}$."
            answer: "1/2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The integral is $\\int_1^{\\infty} x^{-3}\\,dx$. Apply the p-test at infinity with $p=3 > 1$, so it converges. The antiderivative is $-1/(2x^2)$. The limit at infinity is $0$, and the value at $1$ is $-1/2$, so the integral is $0 - (-1/2) = 1/2$. The integral equals 1/2."
        constraints: "p in {1/2, 1, 3/2, 2, 3}; contrast the two p-tests explicitly"
      - id: kp2
        name: Substitution and partial fractions in improper integrals
        key_prerequisites: [integration-substitution, partial-fractions-linear-factors]
        exemplars:
          - problem: 'Evaluate $\int_0^{\infty} x e^{-x^2} \, dx$.'
            answer: '$1/2$'
            solution_sketch: '$u = x^2$: $\frac{1}{2}\int_0^{\infty} e^{-u}\,du = \frac{1}{2}$.'
          - problem: 'Evaluate $\int_1^{\infty} \frac{dx}{x(x + 1)}$.'
            answer: '$\ln 2$'
            solution_sketch: 'Partial fractions: $[\ln\frac{x}{x+1}]_1^{\infty} = 0 - \ln\frac{1}{2} = \ln 2$.'
          - problem: "Evaluate $\\int_0^{\\infty} x e^{-2x^2} \\, dx$."
            answer: "1/4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Let $u = 2x^2$, so $du = 4x\\,dx$ and $x\\,dx = du/4$. Substitution gives $\\frac14 \\int_0^{\\infty} e^{-u}\\,du$. The antiderivative is $-\\frac14 e^{-u}$, and the limit gives $\\frac14(0 + 1) = 1/4$. The answer is 1/4."
          - problem: "Evaluate $\\int_2^{\\infty} \\frac{dx}{x(x+2)}$. Give the answer to 4 decimals."
            answer: "0.3466"
            answer_contract: {"decimals": 4, "kind": "approx"}
            solution_sketch: "Partial fractions with distinct linear factors give $\\frac{1}{x(x+2)} = \\frac12\\left(\\frac1x - \\frac{1}{x+2}\\right)$. Integrate: $\\frac12\\left[\\ln\\frac{x}{x+2}\\right]_2^{\\infty}$. As $x\\to\\infty$, $\\frac{x}{x+2}\\to 1$, so $\\ln\\frac{x}{x+2}\\to 0$; at $x=2$ the log is $\\ln\\frac{2}{4} = -\\ln 2$. The value is $\\frac12(0 + \\ln 2) = \\frac{\\ln 2}{2} = 0.3466$. The answer is 0.3466."
          - problem: "Evaluate $\\int_0^{\\infty} \\frac{x}{(x^2+3)^2} \\, dx$."
            answer: "1/6"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Let $u = x^2+3$, so $du = 2x\\,dx$ and $x\\,dx = du/2$. Substitution gives $\\frac12\\int_3^{\\infty} u^{-2}\\,du$. The antiderivative is $-\\frac12 u^{-1}$, so the value is $\\frac12\\left(0 + \\frac13\\right) = 1/6$. The answer is 1/6."
          - problem: "Evaluate $\\int_1^{\\infty} \\frac{dx}{x(x+3)}$. Give the answer to 4 decimals."
            answer: "0.4621"
            answer_contract: {"decimals": 4, "kind": "approx"}
            solution_sketch: "Partial fractions with distinct linear factors give $\\frac{1}{x(x+3)} = \\frac13\\left(\\frac1x - \\frac{1}{x+3}\\right)$. Integrate: $\\frac13\\left[\\ln\\frac{x}{x+3}\\right]_1^{\\infty}$. As $x\\to\\infty$, $\\frac{x}{x+3}\\to 1$, so $\\ln\\frac{x}{x+3}\\to 0$; at $x=1$ the log is $\\ln\\frac14 = -\\ln 4$. The value is $\\frac13(0 + \\ln 4) = \\frac{\\ln 4}{3} = 0.4621$. The answer is 0.4621."
        constraints: "substitutions limited to one step; partial-fraction cases with distinct linear factors; the limit at infinity of ln(x/(x+1)) must be justified"
      - id: kp3
        name: The direct comparison test
        key_prerequisites: [improper-integrals-infinite-limits]
        exemplars:
          - problem: "Consider the improper integral of 1/(x^3 + 1) from 1 to infinity. Use the direct comparison test. Give a comparison function g(x) and select the correct outcome."
            answer: "verdict = converges; g = 1/x^3"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["converges"], ["diverges"]]}, "name": "verdict"}, {"contract": {"kind": "function", "vars": ["x"]}, "name": "g"}]}
            solution_sketch: "The integral is 1/(x^3 + 1) from 1 to infinity. For x >= 1, x^3 + 1 >= x^3, so 0 <= 1/(x^3 + 1) <= 1/x^3. Thus g(x) = 1/x^3. Since p = 3 > 1, the comparison integral 1/x^3 from 1 to infinity converges. By the direct comparison test, the original integral converges. The wrong outcome diverges would come from thinking the comparison integral diverges. verdict = converges; g = 1/x^3."
          - problem: "Consider the improper integral of (2 + sin x)/x from 1 to infinity. Use the direct comparison test. Give a comparison function g(x) and select the correct outcome."
            answer: "verdict = diverges; g = 1/x"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["converges"], ["diverges"]]}, "name": "verdict"}, {"contract": {"kind": "function", "vars": ["x"]}, "name": "g"}]}
            solution_sketch: "The integral is (2 + sin x)/x from 1 to infinity. For x >= 1, 2 + sin x >= 1, so (2 + sin x)/x >= 1/x > 0. Thus g(x) = 1/x. Since p = 1, the comparison integral 1/x from 1 to infinity diverges. By the direct comparison test, the original integral diverges. The wrong outcome converges would come from ignoring that the integrand dominates a divergent integral. verdict = diverges; g = 1/x."
          - problem: "Consider the improper integral of e^(-x^2) from 1 to infinity. Use the direct comparison test. Give a comparison function g(x) and select the correct outcome."
            answer: "verdict = converges; g = e^(-x)"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["converges"], ["diverges"]]}, "name": "verdict"}, {"contract": {"kind": "function", "vars": ["x"]}, "name": "g"}]}
            solution_sketch: "The integral is e^(-x^2) from 1 to infinity. For x >= 1, x^2 >= x, so e^(-x^2) <= e^(-x), and both are positive. Thus g(x) = e^(-x). The comparison integral e^(-x) from 1 to infinity evaluates to 1/e, so it converges. By the direct comparison test, the original integral converges. The wrong outcome diverges would come from thinking e^(-x) diverges. verdict = converges; g = e^(-x)."
          - problem: "The improper integral of 1/(x^2 + 5) from 1 to infinity is known to converge. Give a comparison function g(x) that proves convergence with the direct comparison test."
            answer: "1/x^2"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "The integral is 1/(x^2 + 5) from 1 to infinity. For x >= 1, x^2 + 5 >= x^2, so 0 <= 1/(x^2 + 5) <= 1/x^2. Thus g(x) = 1/x^2. Since p = 2 > 1, the comparison integral 1/x^2 from 1 to infinity converges. By the direct comparison test, the original integral converges. The answer is 1/x^2."
          - problem: "The improper integral of 1/(sqrt(x) - 1) from 4 to infinity is known to diverge. Give a comparison function g(x) that proves divergence with the direct comparison test."
            answer: "1/sqrt(x)"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "The integral is 1/(sqrt(x) - 1) from 4 to infinity. For x >= 4 we have sqrt(x) >= 1, so sqrt(x) - 1 <= sqrt(x), and hence 0 < 1/sqrt(x) <= 1/(sqrt(x) - 1); this inequality holds on the whole interval. Thus g(x) = 1/sqrt(x). The comparison integral of 1/sqrt(x) from 4 to infinity is a p-integral with p = 1/2 <= 1, so it diverges. By the direct comparison test, the original integral diverges. The answer is 1/sqrt(x)."
          - problem: "Consider the improper integral of 1/(x^4 + x) from 1 to infinity. Use the direct comparison test. Give a comparison function g(x) and select the correct outcome."
            answer: "verdict = converges; g = 1/x^4"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["converges"], ["diverges"]]}, "name": "verdict"}, {"contract": {"kind": "function", "vars": ["x"]}, "name": "g"}]}
            solution_sketch: "The integral is 1/(x^4 + x) from 1 to infinity. For x >= 1, x^4 + x >= x^4, so 0 <= 1/(x^4 + x) <= 1/x^4. Thus g(x) = 1/x^4. Since p = 4 > 1, the comparison integral 1/x^4 from 1 to infinity converges. By the direct comparison test, the original integral converges. The wrong outcome diverges would come from thinking the comparison integral diverges. verdict = converges; g = 1/x^4."
        constraints: "comparisons against p-integrals or e^{-x}; the inequality must hold on the whole interval and be stated"
    diagnostic_exemplar:
      problem: 'Determine whether $\int_1^{\infty} \frac{dx}{\sqrt{x^6 + 1}}$ converges.'
      answer: 'converges — $\frac{1}{\sqrt{x^6 + 1}} \le \frac{1}{x^3}$ and $\int_1^{\infty} x^{-3}\,dx$ converges'
      answer_contract: {kind: none}
      solution_sketch: '$\sqrt{x^6 + 1} \ge x^3$, so the integrand is dominated by a convergent $p = 3$ integral.'
    anki_seeds:
      - front: '$\int_1^{\infty} x^{-p} \, dx$ converges exactly when...'
        back: '$p > 1$'
        type: basic
      - front: '$\int_0^1 x^{-p} \, dx$ converges exactly when...'
        back: '$p < 1$'
        type: basic
      - front: 'Comparison test for improper integrals: if $0 \le f \le g$ on $[a,\infty)$...'
        back: '$\int g$ converges $\Rightarrow$ $\int f$ converges; $\int f$ diverges $\Rightarrow$ $\int g$ diverges'
        type: basic

  - id: choosing-integration-technique
    name: Choosing an Integration Technique
    core: false                # mixed-practice strategy capstone
    difficulty: 0.75
    drill: false
    answer_kind: numeric
    expected_time_secs: 240
    prerequisites:
      - id: integration-by-parts
        weight: 0.6
        key: true
      - id: trigonometric-substitution
        weight: 0.5
        key: true
      - id: partial-fractions-integration
        weight: 0.6
        key: true
      - id: trigonometric-integrals
        weight: 0.5
    knowledge_points:
      - id: kp1
        name: Recognizing the right technique
        key_prerequisites: [integration-by-parts, partial-fractions-integration, trigonometric-substitution]
        exemplars:
          - problem: 'Name the best technique for each: (a) $\int x e^{x^2}\,dx$, (b) $\int x \ln x\,dx$, (c) $\int \frac{dx}{x^2 - 9}$, (d) $\int \sqrt{4 - x^2}\,dx$.'
            answer: '(a) u-substitution ($u = x^2$), (b) integration by parts, (c) partial fractions, (d) trigonometric substitution'
            answer_contract: {kind: none}
            solution_sketch: '(a) the derivative of $x^2$ is present up to a constant; (b) algebraic times log; (c) $x^2 - 9 = (x-3)(x+3)$; (d) the $a^2 - x^2$ radical pattern.'
          - problem: 'Evaluate $\int x e^{x^2} \, dx$.'
            answer: '$\frac{e^{x^2}}{2} + C$'
            solution_sketch: 'Substitution beats parts here: $u = x^2$, $du = 2x\,dx$.'
        constraints: "classification lists mix substitution, parts, partial fractions, trig integrals, and trig substitution; every listed integral must be genuinely best solved by the named technique"
      - id: kp2
        name: Substitution before another technique
        key_prerequisites: [integration-by-parts, trigonometric-substitution]
        exemplars:
          - problem: 'Evaluate $\int e^{\sqrt{x}} \, dx$.'
            answer: '$2(\sqrt{x} - 1)e^{\sqrt{x}} + C$'
            solution_sketch: '$t = \sqrt{x}$, $dx = 2t\,dt$: $2\int t e^t\,dt = 2(t - 1)e^t + C$; back-substitute.'
          - problem: 'Evaluate $\int x^3 \sqrt{x^2 + 1} \, dx$.'
            answer: '$\frac{(x^2 + 1)^{5/2}}{5} - \frac{(x^2 + 1)^{3/2}}{3} + C$'
            solution_sketch: '$u = x^2 + 1$: $\frac{1}{2}\int (u - 1)\sqrt{u}\,du = \frac{u^{5/2}}{5} - \frac{u^{3/2}}{3} + C$ — no trig substitution needed.'
          - problem: "Evaluate $\\int x^3 e^{x^2} \\, dx$."
            answer: "1/2(x^2 - 1)e^(x^2) + C"
            answer_contract: {"kind": "function", "up_to_constant": true, "vars": ["x"]}
            solution_sketch: "The integral is $\\int x^3 e^{x^2}\\,dx$. Use the substitution $u=x^2$, so $du=2x\\,dx$ and $x^3\\,dx = x^2 \\cdot x\\,dx = u\\,du/2$. This gives $\\frac{1}{2}\\int u e^u\\,du$. Apply integration by parts with $a=u$ and $db=e^u\\,du$: $\\int u e^u\\,du = (u-1)e^u$. Back-substitute $u=x^2$ to get $\\frac{1}{2}(x^2-1)e^{x^2}+C$. The final answer is 1/2(x^2 - 1)e^(x^2) + C."
          - problem: "Evaluate $\\int \\frac{x^3}{\\sqrt{x^2+1}} \\, dx$."
            answer: "sqrt(x^2+1)(x^2 - 2)/3 + C"
            answer_contract: {"kind": "function", "up_to_constant": true, "vars": ["x"]}
            solution_sketch: "The integral is $\\int x^3/\\sqrt{x^2+1}\\,dx$. Use the substitution $u=x^2+1$, so $du=2x\\,dx$ and $x^2=u-1$. Then $x^3\\,dx = x^2 \\cdot x\\,dx = (u-1)\\,du/2$, giving $\\frac{1}{2}\\int (u-1)u^{-1/2}\\,du$. Apply the power rule: $\\frac{1}{2}\\int (u^{1/2}-u^{-1/2})\\,du = \\frac{1}{3}u^{3/2}-u^{1/2}$. Back-substitute $u=x^2+1$ and factor to get $\\sqrt{x^2+1}(x^2-2)/3+C$. The final answer is sqrt(x^2+1)(x^2 - 2)/3 + C."
          - problem: "Evaluate $\\int x^3 \\cos(x^2) \\, dx$."
            answer: "1/2(x^2 sin(x^2) + cos(x^2)) + C"
            answer_contract: {"kind": "function", "up_to_constant": true, "vars": ["x"]}
            solution_sketch: "The integral is $\\int x^3\\cos(x^2)\\,dx$. Use the substitution $u=x^2$, so $du=2x\\,dx$ and $x^3\\,dx = x^2 \\cdot x\\,dx = u\\,du/2$. This gives $\\frac{1}{2}\\int u\\cos u\\,du$. Apply integration by parts with $a=u$ and $db=\\cos u\\,du$: $\\int u\\cos u\\,du = u\\sin u+\\cos u$. Back-substitute $u=x^2$ to get $\\frac{1}{2}(x^2\\sin(x^2)+\\cos(x^2))+C$. The final answer is 1/2(x^2 sin(x^2) + cos(x^2)) + C."
          - problem: "Evaluate $\\int x^5 \\sqrt{x^3+1} \\, dx$."
            answer: "2(x^3+1)^(3/2)(3x^3 - 2)/45 + C"
            answer_contract: {"kind": "function", "up_to_constant": true, "vars": ["x"]}
            solution_sketch: "The integral is $\\int x^5\\sqrt{x^3+1}\\,dx$. Use the substitution $u=x^3+1$, so $du=3x^2\\,dx$ and $x^3=u-1$. Then $x^5\\,dx = x^3 \\cdot x^2\\,dx = (u-1)\\,du/3$, giving $\\frac{1}{3}\\int (u-1)\\sqrt{u}\\,du$. Apply the power rule: $\\frac{1}{3}\\int (u^{3/2}-u^{1/2})\\,du = \\frac{2}{15}u^{5/2}-\\frac{2}{9}u^{3/2}$. Back-substitute and factor to get $2(x^3+1)^{3/2}(3x^3-2)/45+C$. The final answer is 2(x^3+1)^(3/2)(3x^3 - 2)/45 + C."
        constraints: "a preliminary algebraic substitution converts the integral to a parts or power-rule form; two-stage solutions only"
      - id: kp3
        name: Combining parts with other techniques
        key_prerequisites: [integration-by-parts, partial-fractions-integration]
        exemplars:
          - problem: "Evaluate the definite integral from 0 to 1 of x atan(x) dx."
            answer: "pi/4 - 1/2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The object is the definite integral from 0 to 1 of x atan(x) dx. Step 1 uses integration by parts with u = atan(x) and dv = x dx, giving ((x^2+1)/2) atan(x) - (1/2) times the integral of x^2/(1+x^2) dx. Step 2 uses an improper-fraction split because x^2/(1+x^2) = 1 - 1/(1+x^2), so the antiderivative is ((x^2+1)/2) atan(x) - x/2. Step 3 evaluates at 1 and at 0: at 1 it is pi/4 - 1/2 and at 0 it is 0. The answer is pi/4 - 1/2."
          - problem: "Evaluate the definite integral from 0 to 1 of ln(x^2+1) dx. Give the answer to 4 decimals."
            answer: "0.2639"
            answer_contract: {"decimals": 4, "kind": "approx"}
            solution_sketch: "The object is the definite integral from 0 to 1 of ln(x^2+1) dx. Step 1 uses integration by parts with u = ln(x^2+1) and dv = dx, giving x ln(x^2+1) - the integral of 2x^2/(x^2+1) dx. Step 2 uses an improper-fraction split because 2x^2/(x^2+1) = 2 - 2/(x^2+1), so the antiderivative is x ln(x^2+1) - 2x + 2 atan(x). Step 3 evaluates at 1 and 0: the exact value is ln(2) + pi/2 - 2, which is 0.2639 to 4 decimals. The answer is 0.2639."
          - problem: "Evaluate the definite integral from 0 to 1 of x ln(x+1) dx."
            answer: "1/4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The object is the definite integral from 0 to 1 of x ln(x+1) dx. Step 1 uses integration by parts with u = ln(x+1) and dv = x dx, giving (x^2/2) ln(x+1) - (1/2) times the integral of x^2/(x+1) dx. Step 2 uses an improper-fraction split because x^2/(x+1) = x - 1 + 1/(x+1), so the antiderivative is (x^2/2) ln(x+1) - (1/2)(x^2/2 - x + ln(x+1)). Step 3 evaluates at 1 and at 0: the logarithm terms cancel and the value is 1/4. The answer is 1/4."
          - problem: "Evaluate the definite integral from 0 to 1 of x^3 atan(x) dx."
            answer: "1/6"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The object is the definite integral from 0 to 1 of x^3 atan(x) dx. Step 1 uses integration by parts with u = atan(x) and dv = x^3 dx, giving (x^4/4) atan(x) - (1/4) times the integral of x^4/(1+x^2) dx. Step 2 uses an improper-fraction split because x^4/(1+x^2) = x^2 - 1 + 1/(1+x^2), so the antiderivative is (x^4/4) atan(x) - (1/4)(x^3/3 - x + atan(x)). Step 3 evaluates at 1 and at 0: at 1 it is pi/16 - 1/12 + 1/4 - pi/16, and the atan(1) terms cancel, leaving 1/6; at 0 it is 0. The answer is 1/6."
          - problem: "Evaluate the definite integral from 0 to 1/sqrt(3) of x atan(x) dx."
            answer: "pi/9 - sqrt(3)/6"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The object is the definite integral from 0 to 1/sqrt(3) of x atan(x) dx. Step 1 uses integration by parts with u = atan(x) and dv = x dx, giving ((x^2+1)/2) atan(x) - (1/2) times the integral of x^2/(1+x^2) dx. Step 2 uses an improper-fraction split because x^2/(1+x^2) = 1 - 1/(1+x^2), so the antiderivative is ((x^2+1)/2) atan(x) - x/2. Step 3 evaluates at the upper limit, where atan(1/sqrt(3)) = pi/6: (2/3)(pi/6) - sqrt(3)/6, and at 0 it is 0. The answer is pi/9 - sqrt(3)/6."
          - problem: "Evaluate the definite integral from 0 to 1 of x^2 ln(x^2+1) dx. Give the answer to 4 decimals."
            answer: "0.1519"
            answer_contract: {"decimals": 4, "kind": "approx"}
            solution_sketch: "The object is the definite integral from 0 to 1 of x^2 ln(x^2+1) dx. Step 1 uses integration by parts with u = ln(x^2+1) and dv = x^2 dx, giving (x^3/3) ln(x^2+1) - (2/3) times the integral of x^4/(x^2+1) dx. Step 2 uses an improper-fraction split because x^4/(x^2+1) = x^2 - 1 + 1/(x^2+1), so the antiderivative is (x^3/3) ln(x^2+1) - (2/3)(x^3/3 - x + atan(x)). Step 3 evaluates at 1 and 0: the exact value is ln(2)/3 - pi/6 + 4/9, which is 0.1519 to 4 decimals. The answer is 0.1519."
        constraints: "exactly two techniques chained; the follow-up integral must be an improper-fraction split or an arctan pattern"
    diagnostic_exemplar:
      problem: 'Evaluate $\int x \sec^2 x \, dx$.'
      answer: '$x \tan x + \ln|\cos x| + C$'
      answer_contract: {kind: none}
      solution_sketch: 'Parts with $u = x$, $dv = \sec^2 x\,dx$: $x\tan x - \int \tan x\,dx = x\tan x + \ln|\cos x| + C$.'
    anki_seeds:
      - front: "First question to ask before choosing an integration technique?"
        back: "Is the derivative of an inner function present (up to a constant)? If so, u-substitution first."
        type: basic
      - front: "Rational function integrand: the decision procedure?"
        back: "If the numerator degree >= denominator degree, divide; then factor the denominator and use partial fractions."
        type: basic
