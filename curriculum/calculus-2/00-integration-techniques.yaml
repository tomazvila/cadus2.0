unit: integration-techniques
course: calculus-2
module: "Techniques of Integration"
topics:
  - id: integration-by-parts-single
    name: Integration by Parts (Single Application)
    core: true
    difficulty: 0.55
    drill: false
    answer_kind: numeric
    expected_time_secs: 150
    prerequisites:
      - id: integration-substitution
        weight: 0.7
        key: true
      - id: antiderivatives
        weight: 0.6
        key: true
      - id: product-rule
        weight: 0.5
      - id: derivatives-exp-log
        weight: 0.5
    knowledge_points:
      - id: kp1
        name: Polynomial times exponential or trig
        key_prerequisites: [antiderivatives, derivatives-exp-log]
        exemplars:
          - problem: 'Evaluate $\int x e^x \, dx$.'
            answer: '$(x - 1)e^x + C$'
            solution_sketch: 'Take $u = x$, $dv = e^x\,dx$: $xe^x - \int e^x\,dx = xe^x - e^x + C$. Check by differentiating: $e^x + (x-1)e^x = xe^x$.'
          - problem: 'Evaluate $\int x \cos x \, dx$.'
            answer: '$x \sin x + \cos x + C$'
            solution_sketch: '$u = x$, $dv = \cos x\,dx$: $x\sin x - \int \sin x\,dx = x\sin x + \cos x + C$.'
          - problem: 'Evaluate $\int x e^{2x} \, dx$.'
            answer: '$\frac{(2x - 1)e^{2x}}{4} + C$'
            solution_sketch: '$u = x$, $dv = e^{2x}\,dx$: $\frac{x e^{2x}}{2} - \frac{1}{2}\int e^{2x}\,dx = \frac{x e^{2x}}{2} - \frac{e^{2x}}{4} + C$.'
        constraints: "integrand is (linear polynomial) x (e^{ax}, sin ax, or cos ax) with a in {1, 2, 3}; one application of parts suffices; small integer coefficients"
      - id: kp2
        name: Choosing u and dv (LIATE)
        key_prerequisites: [antiderivatives, product-rule]
        exemplars:
          - problem: 'Evaluate $\int x e^{-x} \, dx$.'
            answer: '$-(x + 1)e^{-x} + C$'
            solution_sketch: '$u = x$, $dv = e^{-x}\,dx$: $-xe^{-x} + \int e^{-x}\,dx = -xe^{-x} - e^{-x} + C$.'
          - problem: 'Evaluate $\int x \cos 2x \, dx$.'
            answer: '$\frac{x \sin 2x}{2} + \frac{\cos 2x}{4} + C$'
            solution_sketch: '$u = x$, $dv = \cos 2x\,dx$: $\frac{x\sin 2x}{2} - \frac{1}{2}\int \sin 2x\,dx = \frac{x\sin 2x}{2} + \frac{\cos 2x}{4} + C$.'
          - problem: "Evaluate $\\int x \\sin x \\, dx$."
            answer: "-x cos(x) + sin(x) + C"
            answer_contract: {"kind": "function", "up_to_constant": true, "vars": ["x"]}
            solution_sketch: "For ∫ x sin(x) dx, LIATE orders the algebraic factor x before the trigonometric factor sin(x), so choose u = x and dv = sin(x) dx for integration by parts. Then du = dx by differentiation and v = -cos(x) by the antiderivative rule. Integration by parts gives ∫ x sin(x) dx = -x cos(x) - ∫ -cos(x) dx = -x cos(x) + ∫ cos(x) dx. The remaining integral is sin(x). The integral is -x cos(x) + sin(x) + C."
          - problem: "Evaluate $\\int x e^{3x} \\, dx$."
            answer: "x e^(3x)/3 - e^(3x)/9 + C"
            answer_contract: {"kind": "function", "up_to_constant": true, "vars": ["x"]}
            solution_sketch: "For ∫ x e^(3x) dx, choose u = x and dv = e^(3x) dx by LIATE, because the algebraic factor x comes before the exponential. Then du = dx and v = e^(3x)/3. Integration by parts gives ∫ x e^(3x) dx = x e^(3x)/3 - ∫ e^(3x)/3 dx = x e^(3x)/3 - e^(3x)/9 + C. The integral is x e^(3x)/3 - e^(3x)/9 + C."
          - problem: "Evaluate $\\int x \\cos 3x \\, dx$."
            answer: "(x sin(3x))/3 + cos(3x)/9 + C"
            answer_contract: {"kind": "function", "up_to_constant": true, "vars": ["x"]}
            solution_sketch: "For ∫ x cos(3x) dx, choose u = x and dv = cos(3x) dx by LIATE, since the algebraic factor x comes before cosine. Then du = dx and v = sin(3x)/3. Integration by parts gives ∫ x cos(3x) dx = x sin(3x)/3 - (1/3)∫ sin(3x) dx. The remaining integral is -cos(3x)/3, so the antiderivative is (x sin(3x))/3 + cos(3x)/9 + C. The integral is (x sin(3x))/3 + cos(3x)/9 + C."
          - problem: "Evaluate $\\int_0^{\\pi/2} x \\sin x \\, dx$."
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "For ∫_0^{π/2} x sin(x) dx, choose u = x and dv = sin(x) dx by LIATE. Then du = dx and v = -cos(x), so the antiderivative is -x cos(x) + sin(x). Evaluate at the limits: [-x cos(x) + sin(x)] from 0 to pi/2 = (0 + 1) - (0 + 0) = 1. The value of the definite integral is 1."
        constraints: "LIATE ordering decides u; integrands limited to one algebraic factor times one exponential/trig factor"
      - id: kp3
        name: Logarithmic and inverse-trig integrands
        key_prerequisites: [derivatives-exp-log, integration-substitution]
        exemplars:
          - problem: 'Evaluate $\int \ln x \, dx$.'
            answer: '$x \ln x - x + C$'
            solution_sketch: '$u = \ln x$, $dv = dx$: $x\ln x - \int x \cdot \frac{1}{x}\,dx = x\ln x - x + C$.'
          - problem: 'Evaluate $\int x \ln x \, dx$.'
            answer: '$\frac{x^2}{2}\ln x - \frac{x^2}{4} + C$'
            solution_sketch: '$u = \ln x$, $dv = x\,dx$: $\frac{x^2}{2}\ln x - \int \frac{x}{2}\,dx$. Derivative check: $x\ln x + \frac{x}{2} - \frac{x}{2} = x\ln x$.'
          - problem: 'Evaluate $\int \arctan x \, dx$.'
            answer: '$x \arctan x - \frac{1}{2}\ln(1 + x^2) + C$'
            answer_contract: {kind: none}
            solution_sketch: '$u = \arctan x$, $dv = dx$: $x\arctan x - \int \frac{x}{1+x^2}\,dx$; the remaining integral is a $u$-substitution giving $\frac{1}{2}\ln(1+x^2)$.'
        constraints: "integrand involves ln x or an inverse trig function; choose u = the log/inverse function, dv = the rest"
    diagnostic_exemplar:
      problem: 'Evaluate $\int x^2 \ln x \, dx$.'
      answer: '$\frac{x^3}{3}\ln x - \frac{x^3}{9} + C$'
      solution_sketch: 'LIATE picks $u = \ln x$, $dv = x^2dx$: $\frac{x^3}{3}\ln x - \int \frac{x^2}{3}dx$.'
    anki_seeds:
      - front: "Integration by parts formula?"
        back: '$\int u \, dv = uv - \int v \, du$'
        type: basic
      - front: "LIATE heuristic: pick u in this priority order..."
        back: "Logarithmic, Inverse trig, Algebraic, Trigonometric, Exponential"
        type: basic

  - id: integration-by-parts
    name: Integration by Parts
    core: true
    difficulty: 0.62
    drill: false
    answer_kind: expression
    expected_time_secs: 180
    prerequisites:
      - id: integration-by-parts-single
        weight: 0.8
        key: true
      - id: integration-substitution
        weight: 0.5
        key: true
      - id: definite-integrals-ftc
        weight: 0.5
      - id: derivatives-exp-log
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: Definite integrals by parts
        key_prerequisites: [integration-by-parts-single, definite-integrals-ftc]
        exemplars:
          - problem: 'Evaluate $\int_0^{\pi} x \sin x \, dx$.'
            answer: '$\pi$'
            solution_sketch: '$[-x\cos x + \sin x]_0^{\pi} = (\pi + 0) - (0 + 0) = \pi$.'
          - problem: 'Evaluate $\int_0^1 x e^x \, dx$.'
            answer: "1"
            solution_sketch: '$[(x - 1)e^x]_0^1 = 0 - (-1) = 1$.'
          - problem: 'Evaluate $\int_1^2 \ln x \, dx$.'
            answer: '$2\ln 2 - 1$'
            solution_sketch: '$[x\ln x - x]_1^2 = (2\ln 2 - 2) - (0 - 1) = 2\ln 2 - 1$.'
        constraints: "bounds are small integers or multiples of pi; the boundary evaluation must simplify cleanly"
      - id: kp2
        name: Repeated integration by parts
        key_prerequisites: [integration-by-parts-single]
        exemplars:
          - problem: 'Evaluate $\int x^2 e^x \, dx$.'
            answer: '$(x^2 - 2x + 2)e^x + C$'
            solution_sketch: 'Parts twice: $x^2 e^x - 2\int x e^x\,dx = x^2 e^x - 2(x-1)e^x + C$. Derivative check: $(2x - 2)e^x + (x^2 - 2x + 2)e^x = x^2 e^x$.'
          - problem: 'Evaluate $\int x^2 \sin x \, dx$.'
            answer: '$-x^2 \cos x + 2x \sin x + 2\cos x + C$'
            solution_sketch: '$u = x^2$ gives $-x^2\cos x + 2\int x\cos x\,dx$; a second application finishes it.'
        constraints: "quadratic polynomial times e^{ax}, sin x, or cos x; exactly two applications of parts"
      - id: kp3
        name: Boomerang integrals (the integral reappears)
        key_prerequisites: [integration-by-parts-single]
        exemplars:
          - problem: 'Evaluate $\int e^x \cos x \, dx$.'
            answer: '$e^x(\sin x + \cos x)/2 + C$'
            solution_sketch: 'Apply parts twice; the original integral reappears with a minus sign. Solve $I = e^x\sin x + e^x\cos x - I$ to get $I = e^x(\sin x + \cos x)/2 + C$.'
          - problem: 'Evaluate $\int e^x \sin x \, dx$.'
            answer: '$e^x(\sin x - \cos x)/2 + C$'
            solution_sketch: 'Parts twice returns $I = -e^x\cos x + e^x\sin x - I$; solve for $I$.'
          - problem: 'Evaluate $\int e^{2x} \sin x \, dx$.'
            answer: '$\exp(2x)(2\sin x - \cos x)/5 + C$'
            solution_sketch: 'Two applications give $I = -e^{2x}\cos x + 2e^{2x}\sin x - 4I$, so $5I = e^{2x}(2\sin x - \cos x)$.'
        constraints: "boomerang type limited to e^{ax} sin bx / e^{ax} cos bx with a, b in {1, 2}"
    diagnostic_exemplar:
      problem: 'Evaluate $\int_0^{\pi} e^x \sin x \, dx$.'
      answer: '$(e^{\pi} + 1)/2$'
      solution_sketch: 'Two rounds of parts return the integral: $\int e^x\sin x\,dx = e^x(\sin x - \cos x)/2$; evaluating from $0$ to $\pi$ gives $e^{\pi}/2 + 1/2$.'
    anki_seeds:
      - front: "Boomerang integral (e.g. $\\int e^x \\cos x\\,dx$): what's the move?"
        back: "Apply parts twice; the original integral I reappears — solve the resulting equation for I algebraically."
        type: basic
      - front: '$\int x^n e^x \, dx$ requires how many applications of parts?'
        back: '$n$ (each application lowers the polynomial degree by one)'
        type: basic

  - id: tabular-integration-by-parts
    name: Tabular Integration by Parts
    core: false                # shortcut subsumed by integration by parts
    difficulty: 0.65
    drill: false
    answer_kind: expression
    expected_time_secs: 180
    prerequisites:
      - id: integration-by-parts
        weight: 0.8
        key: true
      - id: derivatives-of-polynomials
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: Tabular method for polynomial times exponential
        key_prerequisites: [integration-by-parts]
        exemplars:
          - problem: 'Use the tabular method to evaluate $\int x^3 e^x \, dx$.'
            answer: '$(x^3 - 3x^2 + 6x - 6)e^x + C$'
            solution_sketch: 'Derivatives column: $x^3, 3x^2, 6x, 6, 0$; integrals column: $e^x$ repeated. Alternate signs: $x^3 e^x - 3x^2 e^x + 6x e^x - 6e^x + C$.'
          - problem: 'Use the tabular method to evaluate $\int x^2 e^{-x} \, dx$.'
            answer: '$-(x^2 + 2x + 2)/e^x + C$'
            solution_sketch: 'Derivatives $x^2, 2x, 2, 0$ against integrals $-e^{-x}, e^{-x}, -e^{-x}$ with alternating signs gives $-x^2 e^{-x} - 2x e^{-x} - 2e^{-x} + C$, i.e. $-(x^2 + 2x + 2)/e^x + C$.'
          - problem: "Use the tabular method to evaluate the integral of x^2 e^x dx. Give the antiderivative with + C."
            answer: "(x^2-2x+2)e^x+C"
            answer_contract: {"kind": "function", "up_to_constant": true, "vars": ["x"]}
            solution_sketch: "For the integral of x^2 e^x dx, set the derivative column to x^2, 2x, 2, 0 and the integral column to e^x repeated. Apply the tabular integration by parts rule with alternating signs, giving x^2 e^x - 2x e^x + 2e^x + C. The antiderivative is (x^2-2x+2)e^x+C."
          - problem: "Use the tabular method to evaluate the integral of x^3 e^(2x) dx. Give the antiderivative with + C."
            answer: "(x^3/2-3x^2/4+3x/4-3/8)e^(2x)+C"
            answer_contract: {"kind": "function", "up_to_constant": true, "vars": ["x"]}
            solution_sketch: "For the integral of x^3 e^(2x) dx, build the derivative column x^3, 3x^2, 6x, 6, 0 and the integral column with e^(2x) factors. Apply the tabular integration by parts rule with alternating signs and divide by successive powers of 2, giving (x^3/2 - 3x^2/4 + 3x/4 - 3/8)e^(2x) + C. The antiderivative is (x^3/2-3x^2/4+3x/4-3/8)e^(2x)+C."
          - problem: "Use the tabular method to evaluate the integral of x^2 e^(2x) dx. Give the antiderivative with + C."
            answer: "(x^2/2-x/2+1/4)e^(2x)+C"
            answer_contract: {"kind": "function", "up_to_constant": true, "vars": ["x"]}
            solution_sketch: "For the integral of x^2 e^(2x) dx, list derivatives x^2, 2x, 2, 0 and repeated integrals of e^(2x). Apply the tabular integration by parts rule with alternating signs and the factor 1/2, giving (x^2/2 - x/2 + 1/4)e^(2x) + C. The antiderivative is (x^2/2-x/2+1/4)e^(2x)+C."
          - problem: "Use the tabular method to evaluate the integral of x^3 e^(-x) dx. Give the antiderivative with + C."
            answer: "-(x^3+3x^2+6x+6)/e^x+C"
            answer_contract: {"kind": "function", "up_to_constant": true, "vars": ["x"]}
            solution_sketch: "For the integral of x^3 e^(-x) dx, use derivative column x^3, 3x^2, 6x, 6, 0 and integral column of e^(-x). Apply the tabular integration by parts rule with alternating signs, which gives -(x^3+3x^2+6x+6)/e^x + C. The antiderivative is -(x^3+3x^2+6x+6)/e^x+C."
        constraints: "polynomial degree 2 or 3 times e^{ax} with a in {-1, 1, 2}; the derivative column must terminate at 0"
      - id: kp2
        name: Tabular method for polynomial times trig
        key_prerequisites: [integration-by-parts]
        exemplars:
          - problem: 'Use the tabular method to evaluate $\int x^3 \cos x \, dx$.'
            answer: '$x^3 \sin x + 3x^2 \cos x - 6x \sin x - 6\cos x + C$'
            solution_sketch: 'Derivatives $x^3, 3x^2, 6x, 6, 0$; integrals $\sin x, -\cos x, -\sin x, \cos x$; combine with alternating signs.'
          - problem: 'Use the tabular method to evaluate $\int x^2 \cos x \, dx$.'
            answer: '$x^2 \sin x + 2x \cos x - 2\sin x + C$'
            solution_sketch: 'Derivatives $x^2, 2x, 2, 0$; integrals $\sin x, -\cos x, -\sin x$; alternating signs give the sum. Derivative check recovers $x^2\cos x$.'
        constraints: "polynomial degree 2 or 3 times sin x or cos x; coefficients stay small integers"
    diagnostic_exemplar:
      problem: 'Use the tabular method to evaluate $\int x^3 \sin x \, dx$.'
      answer: '$-x^3 \cos x + 3x^2 \sin x + 6x \cos x - 6\sin x + C$'
      solution_sketch: 'Derivatives $x^3, 3x^2, 6x, 6, 0$; integrals $-\cos x, -\sin x, \cos x, \sin x$; alternate signs and sum.'
    anki_seeds:
      - front: "Tabular integration by parts: what goes in the two columns?"
        back: "Left: successive derivatives of the polynomial (down to 0). Right: successive antiderivatives of the other factor. Multiply diagonally with alternating signs +, -, +, ..."
        type: basic
      - front: "When does the tabular method terminate?"
        back: "When the derivative column reaches 0 — so it needs a factor that differentiates to 0, i.e. a polynomial."
        type: basic

  - id: trig-integrals-odd-powers
    name: Trig Integrals with Odd Powers
    core: true
    difficulty: 0.58
    drill: false
    answer_kind: numeric
    expected_time_secs: 150
    prerequisites:
      - id: integration-substitution
        weight: 0.7
        key: true
      - id: trig-identities-basic
        weight: 0.6
        key: true
      - id: derivatives-trig
        weight: 0.5
    knowledge_points:
      - id: kp1
        name: One factor ready for substitution
        key_prerequisites: [integration-substitution, derivatives-trig]
        exemplars:
          - problem: 'Evaluate $\int \sin^2 x \cos x \, dx$.'
            answer: '$\frac{\sin^3 x}{3} + C$'
            solution_sketch: '$u = \sin x$, $du = \cos x\,dx$: $\int u^2\,du = \frac{u^3}{3} + C$.'
          - problem: 'Evaluate $\int \cos^4 x \sin x \, dx$.'
            answer: '$-\frac{\cos^5 x}{5} + C$'
            solution_sketch: '$u = \cos x$, $du = -\sin x\,dx$: $-\int u^4\,du = -\frac{u^5}{5} + C$.'
          - problem: "Evaluate the integral of sin(x)^3 cos(x) dx."
            answer: "sin(x)^4/4 + C"
            answer_contract: {"kind": "function", "up_to_constant": true, "vars": ["x"]}
            solution_sketch: "Let u = sin(x), so du = cos(x) dx by the derivative of sine. The integral becomes the integral of u^3 du, and the power rule gives u^4/4 + C. Substitute back: sin(x)^4/4 + C."
          - problem: "Evaluate the integral of cos(x)^2 sin(x) dx."
            answer: "-cos(x)^3/3 + C"
            answer_contract: {"kind": "function", "up_to_constant": true, "vars": ["x"]}
            solution_sketch: "Let u = cos(x), so du = -sin(x) dx by the derivative of cosine. The integral becomes the integral of -u^2 du, and the power rule gives -u^3/3 + C. Substitute back: -cos(x)^3/3 + C."
          - problem: "Evaluate the definite integral from 0 to pi/2 of sin(x)^4 cos(x) dx."
            answer: "1/5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Let u = sin(x), so du = cos(x) dx. The limits become u = 0 and u = 1. The integral becomes the integral from 0 to 1 of u^4 du, and the power rule gives u^5/5 from 0 to 1, so the value is 1/5."
          - problem: "Evaluate the definite integral from 0 to pi/2 of cos(x)^3 sin(x) dx."
            answer: "1/4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Let u = cos(x), so du = -sin(x) dx. The limits become u = 1 and u = 0. The integral becomes the negative of the integral from 1 to 0 of u^3 du, which equals the integral from 0 to 1 of u^3 du, and the power rule gives 1/4."
        constraints: "integrand is sin^m x cos x or cos^n x sin x with m, n <= 4; single one-step u-substitution"
      - id: kp2
        name: Splitting off one factor from an odd power
        key_prerequisites: [trig-identities-basic, integration-substitution]
        exemplars:
          - problem: 'Evaluate $\int \sin^3 x \, dx$.'
            answer: '$-\cos x + \frac{\cos^3 x}{3} + C$'
            solution_sketch: 'Write $\sin^3 x = (1 - \cos^2 x)\sin x$; substitute $u = \cos x$: $\int (u^2 - 1)\,du = \frac{u^3}{3} - u + C$.'
          - problem: 'Evaluate $\int \cos^3 x \, dx$.'
            answer: '$\sin x - \frac{\sin^3 x}{3} + C$'
            solution_sketch: '$\cos^3 x = (1 - \sin^2 x)\cos x$; $u = \sin x$.'
          - problem: "Evaluate $\\int \\sin x \\cos^3 x \\, dx$."
            answer: "-cos(x)^4/4 + C"
            answer_contract: {"kind": "function", "up_to_constant": true, "vars": ["x"]}
            solution_sketch: "Start with $\\int \\sin x \\cos^3 x \\, dx$. The cosine power is odd, so split off one cosine factor and use $\\cos^2 x = 1 - \\sin^2 x$ on the remaining cosine square. Substitute $u = \\sin x$ with $du = \\cos x \\, dx$: $\\int u(1 - u^2) \\, du = u^2/2 - u^4/4 + C = \\sin^2 x/2 - \\sin^4 x/4 + C$. Since $-\\cos^4 x/4$ differs from this by a constant, the answer is -cos(x)^4/4 + C."
          - problem: 'Evaluate $\int \sin^3 x \cos^2 x \, dx$.'
            answer: '$\frac{\cos^5 x}{5} - \frac{\cos^3 x}{3} + C$'
            solution_sketch: '$\sin^3 x \cos^2 x = (1 - \cos^2 x)\cos^2 x \sin x$; $u = \cos x$ gives $\int (u^4 - u^2)\,du = \frac{u^5}{5} - \frac{u^3}{3} + C$.'
          - problem: "Evaluate $\\int \\sin^3 x \\cos x \\, dx$."
            answer: "sin(x)^4/4 + C"
            answer_contract: {"kind": "function", "up_to_constant": true, "vars": ["x"]}
            solution_sketch: "Start with $\\int \\sin^3 x \\cos x \\, dx$. The sine power is odd, so split off one sine factor and use $\\sin^2 x = 1 - \\cos^2 x$ on the remaining sine square. Substitute $u = \\cos x$ with $du = -\\sin x \\, dx$: $-\\int (1 - u^2)u \\, du = -u^2/2 + u^4/4 + C = -\\cos^2 x/2 + \\cos^4 x/4 + C$. This simplifies to $\\sin^4 x/4 + C$. The answer is sin(x)^4/4 + C."
          - problem: "Evaluate $\\int_0^{\\pi/2} \\sin^3 x \\, \\cos^3 x \\, dx$."
            answer: "1/12"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Start with the definite integral from 0 to pi/2 of sin^3 x cos^3 x dx. Both powers are odd, so split off one cosine factor and convert cos^2 x to 1 - sin^2 x. Substitute u = sin x with du = cos x dx; the bounds x = 0 and x = pi/2 become u = 0 and u = 1. Compute the integral of u^3(1 - u^2) from 0 to 1: u^4/4 - u^6/6 evaluated at the bounds gives 1/4 - 1/6 = 1/12. The answer is 1/12."
        constraints: "sin^m x cos^n x with at least one of m, n odd and both <= 3; save one factor from the odd power, convert the rest via sin^2 + cos^2 = 1"
    diagnostic_exemplar:
      problem: 'Evaluate $\int \cos^3 x \sin^2 x \, dx$.'
      answer: '$\frac{\sin^3 x}{3} - \frac{\sin^5 x}{5} + C$'
      solution_sketch: '$\cos^3 x \sin^2 x = (1 - \sin^2 x)\sin^2 x \cos x$; $u = \sin x$ gives $\int (u^2 - u^4)\,du$.'
    anki_seeds:
      - front: "Odd power of sine in an integrand: what's the move?"
        back: 'Save one factor of $\sin x$, convert the rest with $\sin^2 x = 1 - \cos^2 x$, substitute $u = \cos x$.'
        type: basic
      - front: "Odd power of cosine in an integrand: what's the move?"
        back: 'Save one factor of $\cos x$, convert the rest with $\cos^2 x = 1 - \sin^2 x$, substitute $u = \sin x$.'
        type: basic

  - id: tangent-secant-integrals
    name: Tangent and Secant Integrals
    core: true
    difficulty: 0.62
    drill: false
    answer_kind: numeric
    expected_time_secs: 180
    prerequisites:
      - id: integration-substitution
        weight: 0.7
        key: true
      - id: derivatives-trig
        weight: 0.5
        key: true
      - id: reciprocal-trig-functions
        weight: 0.4
      - id: trig-integrals-odd-powers
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: The basic tan, cot, sec, and csc integrals
        key_prerequisites: [integration-substitution, derivatives-trig]
        exemplars:
          - problem: "Evaluate the definite integral of tan(x) with respect to x, taken from x = 0 to x = pi/4. Give the answer to 4 decimals."
            answer: "0.3466"
            answer_contract: {"decimals": 4, "kind": "approx"}
            solution_sketch: "The full object is the definite integral of tan(x) dx from 0 to pi/4. Use the basic tangent integral: write tan(x) = sin(x)/cos(x) and substitute u = cos(x), so an antiderivative is -ln(abs(cos(x))) = ln(abs(sec(x))). Evaluate at the bounds by the Fundamental Theorem: ln(sec(pi/4)) - ln(sec(0)) = ln(sqrt(2)) - 0 = ln(2)/2, about 0.346573. Rounded to four decimals, the value of the integral is 0.3466."
          - problem: "Evaluate the definite integral of cot(x) with respect to x, taken from x = pi/6 to x = pi/3. Give the answer to 4 decimals."
            answer: "0.5493"
            answer_contract: {"decimals": 4, "kind": "approx"}
            solution_sketch: "The full object is the definite integral of cot(x) dx from pi/6 to pi/3. Use the basic cotangent integral: write cot(x) = cos(x)/sin(x) and substitute u = sin(x), so an antiderivative is ln(abs(sin(x))). Evaluate at the bounds by the Fundamental Theorem: ln(sin(pi/3)) - ln(sin(pi/6)) = ln(sqrt(3)/2) - ln(1/2) = ln(sqrt(3)), about 0.549306. Rounded to four decimals, the value of the integral is 0.5493."
          - problem: "Evaluate the definite integral of sec(x) with respect to x, taken from x = 0 to x = pi/4. Give the answer to 4 decimals."
            answer: "0.8814"
            answer_contract: {"decimals": 4, "kind": "approx"}
            solution_sketch: "The full object is the definite integral of sec(x) dx from 0 to pi/4. Use the basic secant integral: multiply sec(x) by (sec(x)+tan(x))/(sec(x)+tan(x)); since the numerator becomes the derivative of the denominator, an antiderivative is ln(abs(sec(x)+tan(x))). Evaluate at the bounds by the Fundamental Theorem: ln(sqrt(2)+1) - ln(1+0) = ln(1+sqrt(2)), about 0.881374. Rounded to four decimals, the value of the integral is 0.8814."
          - problem: "Evaluate the definite integral of csc(x) with respect to x, taken from x = pi/6 to x = pi/2. Give the answer to 4 decimals."
            answer: "1.3170"
            answer_contract: {"decimals": 4, "kind": "approx"}
            solution_sketch: "The full object is the definite integral of csc(x) dx from pi/6 to pi/2. Use the basic cosecant integral: multiply csc(x) by (csc(x)-cot(x))/(csc(x)-cot(x)); since the numerator becomes the derivative of the denominator, an antiderivative is ln(abs(csc(x)-cot(x))). Evaluate at the bounds by the Fundamental Theorem: ln(1-0) - ln(2-sqrt(3)) = -ln(2-sqrt(3)) = ln(2+sqrt(3)), about 1.316958. Rounded to four decimals, the value of the integral is 1.3170."
          - problem: "Evaluate the definite integral of tan(2x) with respect to x, taken from x = 0 to x = pi/8. Give the answer to 4 decimals."
            answer: "0.1733"
            answer_contract: {"decimals": 4, "kind": "approx"}
            solution_sketch: "The full object is the definite integral of tan(2x) dx from 0 to pi/8. Use the basic tangent integral together with the substitution u = 2x, so du = 2 dx and the integral becomes one half of the integral of tan(u) du. An antiderivative is (1/2) ln(abs(sec(u))) = (1/2) ln(abs(sec(2x))). Evaluate at the bounds by the Fundamental Theorem: (1/2)(ln(sec(pi/4)) - ln(sec(0))) = (1/2) ln(sqrt(2)) = ln(2)/4, about 0.173287. Rounded to four decimals, the value of the integral is 0.1733."
          - problem: "The definite integral of sec(x) with respect to x, taken from x = 0 to x = b with 0 < b < pi/2, has the value ln(2 + sqrt(3)). Find b as an exact multiple of pi."
            answer: "pi/3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full object is the equation stating that the definite integral of sec(x) dx from 0 to b equals ln(2 + sqrt(3)). Use the basic secant integral: an antiderivative of sec(x) is ln(abs(sec(x)+tan(x))), so the integral equals ln(sec(b)+tan(b)) - ln(1+0). Set sec(b) + tan(b) = 2 + sqrt(3). Recognize the special values sec(pi/3) = 2 and tan(pi/3) = sqrt(3), whose sum is 2 + sqrt(3). The bound is b = pi/3."
        constraints: "the four basic quotient integrals (tan, cot, sec, csc); answers as logarithms with absolute values"
      - id: kp2
        name: Powers via sec^2 = 1 + tan^2
        key_prerequisites: [trig-integrals-odd-powers, derivatives-trig]
        exemplars:
          - problem: 'Evaluate $\int \tan^2 x \, dx$.'
            answer: '$\tan x - x + C$'
            solution_sketch: '$\tan^2 x = \sec^2 x - 1$.'
          - problem: 'Evaluate $\int \sec^4 x \, dx$.'
            answer: '$\tan x + \frac{\tan^3 x}{3} + C$'
            solution_sketch: '$\sec^4 x = (1 + \tan^2 x)\sec^2 x$; $u = \tan x$ gives $\int (1 + u^2)\,du$.'
          - problem: 'Evaluate $\int \tan^3 x \, dx$.'
            answer: '$\frac{\tan^2 x}{2} + \ln|\cos x| + C$'
            answer_contract: {kind: none}
            solution_sketch: '$\tan^3 x = \tan x(\sec^2 x - 1)$; the first piece is $u = \tan x$, the second is $-\int \tan x\,dx$.'
        constraints: "powers of tan <= 3, powers of sec <= 4; use sec^2 = 1 + tan^2 to peel off a sec^2 or convert tan^2"
      - id: kp3
        name: Products of tangents and secants
        key_prerequisites: [integration-substitution, derivatives-trig]
        exemplars:
          - problem: 'Evaluate $\int \sec^2 x \tan x \, dx$.'
            answer: '$\frac{\tan^2 x}{2} + C$'
            solution_sketch: '$u = \tan x$, $du = \sec^2 x\,dx$: $\frac{u^2}{2} + C$. (Equivalently $\frac{\sec^2 x}{2} + C$; the answers differ by a constant.)'
          - problem: 'Evaluate $\int \tan^2 x \sec^2 x \, dx$.'
            answer: '$\frac{\tan^3 x}{3} + C$'
            solution_sketch: '$u = \tan x$: $\int u^2\,du$.'
          - problem: 'Evaluate $\int \tan^3 x \sec x \, dx$.'
            answer: '$\frac{\sec^3 x}{3} - \sec x + C$'
            solution_sketch: 'Save $\sec x \tan x$: $\tan^3 x \sec x = (\sec^2 x - 1)\sec x \tan x$; $u = \sec x$ gives $\int (u^2 - 1)\,du$.'
          - problem: "Evaluate $\\int \\tan^3 x \\sec^4 x \\, dx$."
            answer: "tan(x)^4/4 + tan(x)^6/6 + C"
            answer_contract: {"kind": "function", "up_to_constant": true, "vars": ["x"]}
            solution_sketch: "For the integral of tan(x)^3 sec(x)^4 dx, the power of secant is even, so save sec(x)^2 dx and substitute u = tan(x), du = sec(x)^2 dx. Then sec(x)^4 = sec(x)^2 times sec(x)^2, and one sec(x)^2 is absorbed into du; the remaining sec(x)^2 equals 1 + tan(x)^2 = 1 + u^2. The integral becomes the integral of u^3(1 + u^2) du = (u^3 + u^5) du. By the general power rule this is u^4/4 + u^6/6 + C. Replacing u with tan(x), the antiderivative is tan(x)^4/4 + tan(x)^6/6 + C."
          - problem: "Evaluate $\\int \\tan^5 x \\sec x \\, dx$."
            answer: "sec(x)^5/5 - 2sec(x)^3/3 + sec(x) + C"
            answer_contract: {"kind": "function", "up_to_constant": true, "vars": ["x"]}
            solution_sketch: "For the integral of tan(x)^5 sec(x) dx, the power of tangent is odd, so save sec(x) tan(x) dx and substitute u = sec(x), du = sec(x) tan(x) dx. Write tan(x)^5 sec(x) dx = tan(x)^4 (sec(x) tan(x) dx) = (u^2 - 1)^2 du = (u^4 - 2u^2 + 1) du. Integrating term by term gives u^5/5 - 2u^3/3 + u + C. Replacing u with sec(x), the antiderivative is sec(x)^5/5 - 2sec(x)^3/3 + sec(x) + C."
          - problem: "Evaluate $\\int_0^{\\pi/3} \\tan^3 x \\sec x \\, dx$. Give the answer as a fraction."
            answer: "4/3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "For the definite integral of tan(x)^3 sec(x) dx from 0 to pi/3, the power of tangent is odd, so save sec(x) tan(x) dx and substitute u = sec(x), du = sec(x) tan(x) dx. Then tan(x)^2 = u^2 - 1, so the integrand tan(x)^3 sec(x) dx becomes (u^2 - 1) du. The bounds change with u: at x = 0 we get u = sec(0) = 1, and at x = pi/3 we get u = sec(pi/3) = 2. The integral of (u^2 - 1) du from 1 to 2 is (u^3/3 - u) evaluated from 1 to 2, which is (8/3 - 2) - (1/3 - 1) = 4/3. The definite integral equals 4/3."
        constraints: "even power of sec: save sec^2 and substitute u = tan x; odd power of tan: save sec x tan x and substitute u = sec x"
    diagnostic_exemplar:
      problem: 'Evaluate $\int \tan^3 x \sec^3 x \, dx$.'
      answer: '$\frac{\sec^5 x}{5} - \frac{\sec^3 x}{3} + C$'
      solution_sketch: 'Split off $\sec x\tan x\,dx$ and use $\tan^2 x = \sec^2 x - 1$: with $u = \sec x$ the integral is $\int (u^2 - 1)u^2\,du$.'
    anki_seeds:
      - front: '$\int \tan x \, dx = $ ?'
        back: '$\ln|\sec x| + C$ (equivalently $-\ln|\cos x| + C$)'
        type: basic
      - front: '$\int \sec x \, dx = $ ?'
        back: '$\ln|\sec x + \tan x| + C$'
        type: basic
      - front: "Product tan^m x sec^n x with n even: what's the substitution?"
        back: 'Save a factor of $\sec^2 x$, convert the rest to tangents, substitute $u = \tan x$.'
        type: basic

  - id: trigonometric-integrals
    name: Trigonometric Integrals
    core: true
    difficulty: 0.65
    drill: false
    answer_kind: expression
    expected_time_secs: 180
    prerequisites:
      - id: trig-integrals-odd-powers
        weight: 0.7
        key: true
      - id: double-half-angle-identities
        weight: 0.7
        key: true
      # Phase C (gap I-1, Wave-2 edge): the identities kp2 rests on are now taught
      # in precalculus (product-to-sum-identities) instead of being handed to the
      # learner in the problem stem. Key moved here from trig-identities-basic
      # (which stays as background algebra) to hold the 3-key cap.
      - id: product-to-sum-identities
        weight: 0.6
        key: true
      - id: trig-identities-basic
        weight: 0.6
      - id: tangent-secant-integrals
        weight: 0.5
      - id: integration-substitution
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: Even powers via half-angle identities
        key_prerequisites: [double-half-angle-identities, integration-substitution]
        exemplars:
          - problem: 'Evaluate $\int \sin^2 x \, dx$.'
            answer: '$x/2 - \sin(2x)/4 + C$'
            solution_sketch: '$\sin^2 x = \frac{1 - \cos 2x}{2}$, so the integral is $x/2 - \sin(2x)/4 + C$.'
          - problem: 'Evaluate $\int_0^{\pi} \cos^2 x \, dx$.'
            answer: '$\pi/2$'
            solution_sketch: '$\cos^2 x = \frac{1 + \cos 2x}{2}$; $[\frac{x}{2} + \frac{\sin 2x}{4}]_0^{\pi} = \frac{\pi}{2}$.'
          - problem: 'Evaluate $\int \sin^2 x \cos^2 x \, dx$.'
            answer: '$x/8 - \sin(4x)/32 + C$'
            solution_sketch: '$\sin^2 x\cos^2 x = \frac{\sin^2 2x}{4} = \frac{1 - \cos 4x}{8}$; integrate term by term.'
        constraints: "powers 2 only (or sin^2 x cos^2 x via double half-angle); definite integrals over [0, pi] or [0, pi/2]"
      - id: kp2
        name: Products sin(mx) cos(nx) via product-to-sum
        key_prerequisites: [product-to-sum-identities, sum-difference-identities, trig-identities-basic]
        exemplars:
          - problem: 'Evaluate $\int \sin 3x \cos x \, dx$.'
            answer: '$-\cos(4x)/8 - \cos(2x)/4 + C$'
            solution_sketch: '$\sin 3x\cos x = \frac{1}{2}[\sin 4x + \sin 2x]$; integrate each sine.'
          - problem: 'Evaluate $\int \sin 2x \sin x \, dx$.'
            answer: '$\sin(x)/2 - \sin(3x)/6 + C$'
            solution_sketch: '$\sin 2x\sin x = \frac{1}{2}[\cos x - \cos 3x]$; integrate each cosine.'
          - problem: 'Evaluate $\int \cos 3x \cos x \, dx$.'
            answer: '$\sin(4x)/8 + \sin(2x)/4 + C$'
            solution_sketch: '$\cos 3x\cos x = \frac{1}{2}[\cos 4x + \cos 2x]$.'
        constraints: "m, n small positive integers with m != n; learner recalls the product-to-sum identities (taught in product-to-sum-identities); restating one in the stem remains acceptable"
      - id: kp3
        name: General strategy for sin^m x cos^n x
        key_prerequisites: [trig-integrals-odd-powers, double-half-angle-identities, trig-identities-basic]
        exemplars:
          - problem: 'Evaluate $\int \sin^4 x \, dx$.'
            answer: '$3x/8 - \sin(2x)/4 + \sin(4x)/32 + C$'
            solution_sketch: '$\sin^4 x = \left(\frac{1 - \cos 2x}{2}\right)^2 = \frac{1}{4}(1 - 2\cos 2x + \frac{1 + \cos 4x}{2})$; integrate term by term.'
          - problem: 'Evaluate $\int_0^{\pi/2} \cos^4 x \, dx$.'
            answer: '$3\pi/16$'
            solution_sketch: 'Half-angle twice: $\cos^4 x = \frac{3}{8} + \frac{\cos 2x}{2} + \frac{\cos 4x}{8}$; only the constant survives the integration over $[0, \pi/2]$.'
          - problem: 'Evaluate $\int \sin^3 x \cos^3 x \, dx$.'
            answer: '$\sin^4(x)/4 - \sin^6(x)/6 + C$'
            solution_sketch: 'One power is odd: $\sin^3 x\cos^3 x = \sin^3 x(1 - \sin^2 x)\cos x$; $u = \sin x$ gives $\int (u^3 - u^5)\,du$.'
        constraints: "m + n <= 6; odd power present -> substitution route, both even -> half-angle route; state which strategy applies"
    diagnostic_exemplar:
      problem: 'Evaluate $\int \cos^4 x \, dx$.'
      answer: '$3x/8 + \sin(2x)/4 + \sin(4x)/32 + C$'
      solution_sketch: 'Two half-angle reductions give $\cos^4 x = \frac{3}{8} + \frac{\cos 2x}{2} + \frac{\cos 4x}{8}$.'
    anki_seeds:
      - front: "Half-angle identity for sin^2 x?"
        back: '$\sin^2 x = \frac{1 - \cos 2x}{2}$'
        type: basic
      - front: "Both powers even in sin^m x cos^n x: what's the strategy?"
        back: "Half-angle identities to reduce the powers (no substitution works directly)."
        type: basic
      - front: 'Product-to-sum: $\sin A \cos B = $ ?'
        back: '$\frac{1}{2}[\sin(A+B) + \sin(A-B)]$'
        type: basic

  - id: completing-the-square-integrands
    name: Completing the Square in Integrands
    core: true
    difficulty: 0.62
    drill: false
    answer_kind: numeric
    expected_time_secs: 180
    prerequisites:
      - id: completing-the-square
        weight: 0.6
        key: true
      - id: integration-substitution
        weight: 0.7
        key: true
      - id: derivatives-inverse-trig
        weight: 0.5
    knowledge_points:
      - id: kp1
        name: Arctangent forms
        key_prerequisites: [completing-the-square, derivatives-inverse-trig]
        exemplars:
          - problem: "Evaluate the indefinite integral of 1/(x^2 + 2x + 5) dx."
            answer: "atan((x+1)/2)/2 + C"
            answer_contract: {"kind": "function", "up_to_constant": true, "vars": ["x"]}
            solution_sketch: "The integral is the indefinite integral of 1/(x^2 + 2x + 5) dx. Complete the square in the denominator: x^2 + 2x + 5 = (x+1)^2 + 4. Substitute u = x + 1 and use the arctangent pattern with a = 2, so the antiderivative is atan((x+1)/2)/2 + C. The answer is atan((x+1)/2)/2 + C."
          - problem: "Evaluate the indefinite integral of 1/(x^2 - 4x + 13) dx."
            answer: "atan((x-2)/3)/3 + C"
            answer_contract: {"kind": "function", "up_to_constant": true, "vars": ["x"]}
            solution_sketch: "The integral is the indefinite integral of 1/(x^2 - 4x + 13) dx. Complete the square: x^2 - 4x + 13 = (x-2)^2 + 9. Substitute u = x - 2 and use the arctangent pattern with a = 3, so the antiderivative is atan((x-2)/3)/3 + C. The answer is atan((x-2)/3)/3 + C."
          - problem: "Evaluate the indefinite integral of 1/(x^2 + 6x + 10) dx."
            answer: "atan(x+3) + C"
            answer_contract: {"kind": "function", "up_to_constant": true, "vars": ["x"]}
            solution_sketch: "The integral is the indefinite integral of 1/(x^2 + 6x + 10) dx. Complete the square: x^2 + 6x + 10 = (x+3)^2 + 1. Substitute u = x + 3 and use the arctangent pattern with a = 1, so the antiderivative is atan(x+3) + C. The answer is atan(x+3) + C."
          - problem: "Evaluate the definite integral of 1/(x^2 - 2x + 5) dx from x = 1 to x = 3. Give the answer exactly, as a multiple of pi."
            answer: "pi/8"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Complete the square in the denominator: x^2 - 2x + 5 = (x - 1)^2 + 4. Substitute u = x - 1, so u runs from 0 to 2, and apply the arctangent pattern with a = 2: the integral becomes (1/2)atan(u/2) evaluated from 0 to 2. That equals (1/2)(atan(1) - atan(0)) = (1/2)(pi/4 - 0). The answer is pi/8."
          - problem: "An antiderivative of 1/q(x) is (1/3)atan((x - 1)/3) + C, where q(x) is a monic quadratic with integer coefficients. Find q(x)."
            answer: "x^2-2x+10"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Compare the given antiderivative with the arctangent pattern (1/a)atan((x - h)/a) + C: here a = 3 and the center is h = 1. The completed-square denominator is therefore (x - 1)^2 + 9. Expanding (x - 1)^2 + 9 gives x^2 - 2x + 10, and differentiating the antiderivative confirms 1/(x^2 - 2x + 10). The answer is x^2-2x+10."
          - problem: "Evaluate the indefinite integral of 1/(x^2 - 6x + 10) dx."
            answer: "atan(x-3) + C"
            answer_contract: {"kind": "function", "up_to_constant": true, "vars": ["x"]}
            solution_sketch: "The integral is the indefinite integral of 1/(x^2 - 6x + 10) dx. Complete the square: x^2 - 6x + 10 = (x-3)^2 + 1. Substitute u = x - 3 and use the arctangent pattern with a = 1, so the antiderivative is atan(x-3) + C. The answer is atan(x-3) + C."
        constraints: "irreducible quadratic with integer center and radius; a in {1, 2, 3}"
      - id: kp2
        name: Arcsine forms
        key_prerequisites: [completing-the-square, derivatives-inverse-trig]
        exemplars:
          - problem: "Evaluate $\\int \\frac{dx}{\\sqrt{24 - 2x - x^2}}$."
            answer: "asin((x+1)/5) + C"
            answer_contract: {"kind": "function", "up_to_constant": true, "vars": ["x"]}
            solution_sketch: "Write the full integrand as $\\int \\frac{dx}{\\sqrt{24 - 2x - x^2}}$. Complete the square: $24 - 2x - x^2 = 25 - (x+1)^2$. Use the arcsine antiderivative rule $\\int \\frac{du}{\\sqrt{a^2 - u^2}} = \\arcsin(u/a)$ with $u = x+1$ and $a = 5$. The answer is asin((x+1)/5) + C."
          - problem: "Evaluate $\\int \\frac{dx}{\\sqrt{8 - 2x - x^2}}$."
            answer: "asin((x+1)/3) + C"
            answer_contract: {"kind": "function", "up_to_constant": true, "vars": ["x"]}
            solution_sketch: "Write the full integrand as $\\int \\frac{dx}{\\sqrt{8 - 2x - x^2}}$. Complete the square: $8 - 2x - x^2 = 9 - (x+1)^2$. Use the arcsine antiderivative rule with $u = x+1$ and $a = 3$. The answer is asin((x+1)/3) + C."
          - problem: "Evaluate $\\int \\frac{dx}{\\sqrt{6x - x^2 - 5}}$."
            answer: "asin((x-3)/2) + C"
            answer_contract: {"kind": "function", "up_to_constant": true, "vars": ["x"]}
            solution_sketch: "Write the full integrand as $\\int \\frac{dx}{\\sqrt{6x - x^2 - 5}}$. Complete the square: $6x - x^2 - 5 = 4 - (x-3)^2$. Use the arcsine antiderivative rule with $u = x-3$ and $a = 2$. The answer is asin((x-3)/2) + C."
          - problem: "Evaluate $\\int \\frac{dx}{\\sqrt{3 + 2x - x^2}}$."
            answer: "asin((x-1)/2) + C"
            answer_contract: {"kind": "function", "up_to_constant": true, "vars": ["x"]}
            solution_sketch: "Write the full integrand as $\\int \\frac{dx}{\\sqrt{3 + 2x - x^2}}$. Complete the square: $3 + 2x - x^2 = 4 - (x-1)^2$. Use the arcsine antiderivative rule with $u = x-1$ and $a = 2$. The answer is asin((x-1)/2) + C."
          - problem: "Evaluate $\\int \\frac{dx}{\\sqrt{21 + 4x - x^2}}$."
            answer: "asin((x-2)/5) + C"
            answer_contract: {"kind": "function", "up_to_constant": true, "vars": ["x"]}
            solution_sketch: "Write the full integrand as $\\int \\frac{dx}{\\sqrt{21 + 4x - x^2}}$. Complete the square: $21 + 4x - x^2 = 25 - (x-2)^2$. Use the arcsine antiderivative rule with $u = x-2$ and $a = 5$. The answer is asin((x-2)/5) + C."
          - problem: "Evaluate $\\int \\frac{dx}{\\sqrt{10x - x^2 - 9}}$."
            answer: "asin((x-5)/4) + C"
            answer_contract: {"kind": "function", "up_to_constant": true, "vars": ["x"]}
            solution_sketch: "Write the full integrand as $\\int \\frac{dx}{\\sqrt{10x - x^2 - 9}}$. Complete the square: $10x - x^2 - 9 = 16 - (x-5)^2$. Use the arcsine antiderivative rule $\\int \\frac{du}{\\sqrt{a^2 - u^2}} = \\arcsin(u/a)$ with $u = x-5$ and $a = 4$. The answer is asin((x-5)/4) + C."
        constraints: "negative-leading-coefficient quadratics under a square root; completed square has integer center and radius"
      - id: kp3
        name: Linear numerators (split into log + arctan)
        key_prerequisites: [completing-the-square, integration-substitution]
        exemplars:
          - problem: "Evaluate $\\int \\frac{2x + 3}{x^2 + 2x + 5} \\, dx$. Give the antiderivative as a function of x."
            answer: "ln(x^2+2x+5)+atan((x+1)/2)/2+C"
            answer_contract: {"kind": "function", "up_to_constant": true, "vars": ["x"]}
            solution_sketch: "Split the numerator by the derivative of the denominator: 2x+3 = (2x+2) + 1. The first term gives ln(x^2+2x+5) by substitution. Complete the square: x^2+2x+5 = (x+1)^2+4, so the second term gives (1/2) atan((x+1)/2). The answer is ln(x^2+2x+5)+atan((x+1)/2)/2+C."
          - problem: "Evaluate $\\int \\frac{4x + 1}{x^2 + 4x + 13} \\, dx$. Give the antiderivative as a function of x."
            answer: "2ln(x^2+4x+13)-7atan((x+2)/3)/3+C"
            answer_contract: {"kind": "function", "up_to_constant": true, "vars": ["x"]}
            solution_sketch: "Split the numerator: 4x+1 = 2(2x+4) - 7. The first part integrates to 2 ln(x^2+4x+13) by substitution. Complete the square: x^2+4x+13 = (x+2)^2+9. The remainder gives -7/3 atan((x+2)/3). The answer is 2ln(x^2+4x+13)-7atan((x+2)/3)/3+C."
          - problem: 'Evaluate $\int \frac{2x + 2}{x^2 + 2x + 5} \, dx$.'
            answer: '$\ln(x^2 + 2x + 5) + C$'
            solution_sketch: 'The numerator is exactly the derivative of the denominator: $u = x^2 + 2x + 5$.'
          - problem: "Find A and B so that $\\frac{6x - 2}{x^2 - 2x + 5} = \\frac{A(2x - 2) + B}{x^2 - 2x + 5}$. Give the constants in the form A = a; B = b."
            answer: "A = 3; B = 4"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "A"}, {"contract": {"kind": "exact"}, "name": "B"}]}
            solution_sketch: "Set the numerator equal to A times the derivative of the denominator plus B. The derivative is 2x - 2, so 6x - 2 = A(2x - 2) + B. Compare x terms: 2A = 6, so A = 3. Compare constants: -2A + B = -2, so B = 4. The answer is A = 3; B = 4."
          - problem: "For the integral $\\int \\frac{6x + 1}{x^2 + 4x + 13} \\, dx$, write the numerator as $A(2x + 4) + B$. Find the constant B."
            answer: "-11"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The derivative of the denominator is 2x + 4. Expand A(2x + 4) + B = 2A x + (4A + B). Match the x coefficient: 2A = 6, so A = 3. Match the constant: 4A + B = 1, so B = 1 - 12 = -11. The answer is -11."
          - problem: "For the integral $\\int \\frac{4x + 7}{x^2 - 2x + 5} \\, dx$, write the numerator as $A(2x - 2) + B$. Find the constant A."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The derivative of the denominator is 2x - 2. Expand A(2x - 2) + B = 2A x + (B - 2A). Match the x coefficient: 2A = 4, so A = 2. The constant B then follows from B - 2A = 7. The answer is 2."
        constraints: "numerator degree 1; split as (multiple of the derivative of the denominator) + constant"
    diagnostic_exemplar:
      problem: 'Evaluate $\int \frac{2x + 6}{x^2 + 4x + 5} \, dx$.'
      answer: '$\ln(x^2 + 4x + 5) + 2\arctan(x + 2) + C$'
      answer_contract: {kind: none}
      solution_sketch: 'Write $2x + 6 = (2x + 4) + 2$: the first part is a logarithm, the second is $2\int \frac{dx}{(x+2)^2 + 1}$.'
    anki_seeds:
      - front: '$\int \frac{du}{u^2 + a^2} = $ ?'
        back: '$\frac{1}{a}\arctan\left(\frac{u}{a}\right) + C$'
        type: basic
      - front: '$\int \frac{du}{\sqrt{a^2 - u^2}} = $ ?'
        back: '$\arcsin\left(\frac{u}{a}\right) + C$'
        type: basic

  - id: trigonometric-substitution
    name: Trigonometric Substitution
    core: true
    difficulty: 0.72
    drill: false
    answer_kind: numeric
    expected_time_secs: 240
    prerequisites:
      - id: trigonometric-integrals
        weight: 0.6
        key: true
      - id: integration-substitution
        weight: 0.6
        key: true
      - id: completing-the-square-integrands
        weight: 0.5
      - id: right-triangle-trig
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: The pattern a^2 - x^2 (x = a sin theta)
        key_prerequisites: [trigonometric-integrals, right-triangle-trig]
        exemplars:
          - problem: 'Evaluate $\int \frac{dx}{\sqrt{4 - x^2}}$.'
            answer: '$\arcsin\left(\frac{x}{2}\right) + C$'
            answer_contract: {kind: none}
            solution_sketch: '$x = 2\sin\theta$, $dx = 2\cos\theta\,d\theta$, $\sqrt{4 - x^2} = 2\cos\theta$: $\int d\theta = \theta + C$.'
          - problem: 'Evaluate $\int \sqrt{1 - x^2} \, dx$.'
            answer: '$\frac{1}{2}\left(\arcsin x + x\sqrt{1 - x^2}\right) + C$'
            answer_contract: {kind: none}
            solution_sketch: '$x = \sin\theta$: $\int \cos^2\theta\,d\theta = \frac{\theta}{2} + \frac{\sin 2\theta}{4} = \frac{\theta + \sin\theta\cos\theta}{2}$; back-substitute.'
          - problem: 'Evaluate $\int_0^2 \sqrt{4 - x^2} \, dx$.'
            answer: '$\pi$'
            solution_sketch: 'Quarter of the disk of radius $2$: $\frac{1}{4}\pi(2)^2 = \pi$; or $x = 2\sin\theta$ turns it into $4\int_0^{\pi/2}\cos^2\theta\,d\theta = \pi$.'
        constraints: "a in {1, 2, 3}; results should back-substitute cleanly via a reference right triangle"
      - id: kp2
        name: The pattern a^2 + x^2 (x = a tan theta)
        key_prerequisites: [trigonometric-integrals, integration-substitution]
        exemplars:
          - problem: 'Evaluate $\int \frac{dx}{(1 + x^2)^{3/2}}$.'
            answer: '$\frac{x}{\sqrt{1 + x^2}} + C$'
            solution_sketch: '$x = \tan\theta$: $\int \frac{\sec^2\theta}{\sec^3\theta}\,d\theta = \int \cos\theta\,d\theta = \sin\theta = \frac{x}{\sqrt{1+x^2}}$. Derivative check: $(1 + x^2)^{-3/2}$.'
          - problem: "Evaluate the definite integral of 1/(x^2+9) from x = 0 to x = 3. Give the answer as an exact value."
            answer: "pi/12"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Use the trigonometric substitution x = 3 tan(theta), so dx = 3 sec^2(theta) dtheta. The denominator becomes 9 sec^2(theta), so the integral simplifies to 1/3 dtheta. The bounds become theta = 0 to theta = pi/4. The value is pi/12."
          - problem: "Evaluate the indefinite integral of 1/(x^2+4) with respect to x. Give the answer as a function of x with + C."
            answer: "1/2 atan(x/2) + C"
            answer_contract: {"kind": "function", "up_to_constant": true, "vars": ["x"]}
            solution_sketch: "Use x = 2 tan(theta), so dx = 2 sec^2(theta) dtheta. The denominator x^2+4 becomes 4 sec^2(theta), and the integral is theta/2. Since theta = atan(x/2), the antiderivative is 1/2 atan(x/2) + C."
          - problem: "Evaluate the definite integral of 1/(1+x^2)^(3/2) from x = 0 to x = 1. Give the answer as an exact value."
            answer: "sqrt(2)/2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Use x = tan(theta), so dx = sec^2(theta) dtheta. The denominator (1+x^2)^(3/2) becomes sec^3(theta), and the integral is cos(theta) dtheta. The bounds are theta = 0 to pi/4, so the value is sin(pi/4) = sqrt(2)/2."
          - problem: "Evaluate the indefinite integral of 1/(x^2+4)^(3/2) with respect to x. Give the answer as a function of x with + C."
            answer: "x/(4 sqrt(x^2+4)) + C"
            answer_contract: {"kind": "function", "up_to_constant": true, "vars": ["x"]}
            solution_sketch: "Use x = 2 tan(theta), so dx = 2 sec^2(theta) dtheta. The denominator (x^2+4)^(3/2) becomes 8 sec^3(theta), so the integral is (1/4) cos(theta) dtheta. This gives (1/4) sin(theta), and back-substitution gives x/(4 sqrt(x^2+4)) + C."
          - problem: "Evaluate the definite integral of 1/(1+x^2) from x = 0 to x = 1. Give the answer as an exact value."
            answer: "pi/4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Use x = tan(theta), so dx = sec^2(theta) dtheta. The denominator 1+x^2 becomes sec^2(theta), so the integral is 1 dtheta. The bounds become theta = 0 to pi/4, so the value is pi/4."
        constraints: "a in {1, 2, 3}; exponent on (a^2 + x^2) is 1 or 3/2"
      - id: kp3
        name: The pattern x^2 - a^2 and completed squares
        key_prerequisites: [trigonometric-integrals, completing-the-square-integrands]
        exemplars:
          - problem: 'Evaluate $\int \frac{dx}{(x^2 + 2x + 2)^{3/2}}$.'
            answer: '$\frac{x + 1}{\sqrt{x^2 + 2x + 2}} + C$'
            solution_sketch: 'Complete the square: $x^2 + 2x + 2 = (x+1)^2 + 1$; $u = x + 1$ then $u = \tan\theta$ gives $\int \cos\theta\,d\theta = \sin\theta = \frac{u}{\sqrt{u^2 + 1}}$.'
          - problem: "Evaluate the definite integral from 2sqrt(2) to 4 of dx/(x^2 - 4)^(3/2), taken on the domain x > 2. Give the exact value."
            answer: "sqrt(2)/4 - sqrt(3)/6"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full object is the definite integral from 2sqrt(2) to 4 of dx/(x^2-4)^(3/2). Use the secant substitution x = 2 sec(theta) on the interval where theta lies in (0, pi/2); then dx = 2 sec(theta) tan(theta) dtheta and (x^2-4)^(3/2) = 8 tan^3(theta). The integrand reduces to (1/4) cos(theta)/sin^2(theta); with u = sin(theta) its antiderivative is -(1/4)csc(theta), which back-substitutes to -x/(4 sqrt(x^2-4)). By the fundamental theorem of calculus, subtract the endpoint values: at x = 4 this is -sqrt(3)/6 and at x = 2sqrt(2) it is -sqrt(2)/4. The exact value is sqrt(2)/4 - sqrt(3)/6."
          - problem: "Evaluate the integral of 1/(x^2 - 6x + 13)^(3/2) with respect to x. Give the antiderivative in terms of x."
            answer: "(x-3)/(4sqrt(x^2-6x+13))+C"
            answer_contract: {"kind": "function", "up_to_constant": true, "vars": ["x"]}
            solution_sketch: "The full object is the integral of dx/(x^2-6x+13)^(3/2). Complete the square: x^2-6x+13 = (x-3)^2+4, an integer center 3 and radius 2. Let u = x-3 and u = 2 tan(theta); then du = 2 sec^2(theta) dtheta and (u^2+4)^(3/2) = 8 sec^3(theta), so the trig integral rule reduces the problem to (1/4) times the integral of cos(theta) dtheta. This equals (1/4) sin(theta), and the reference triangle gives sin(theta) = u/sqrt(u^2+4). Back-substitute u = x-3. The antiderivative is (x-3)/(4sqrt(x^2-6x+13))+C."
          - problem: "Evaluate the definite integral from 3 to 3sqrt(2) of sqrt(x^2 - 9)/x dx, taken where x > 3 so sqrt(x^2 - 9) is nonnegative. Give the exact value."
            answer: "3 - 3pi/4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full object is the definite integral from 3 to 3sqrt(2) of sqrt(x^2-9)/x dx. Use the secant substitution x = 3 sec(theta) with theta in (0, pi/2); then dx = 3 sec(theta) tan(theta) dtheta and sqrt(x^2-9) = 3 tan(theta). The integrand becomes 3 tan^2(theta) = 3(sec^2(theta) - 1) by the Pythagorean identity, and the trig integral rule gives 3 tan(theta) - 3 theta. Back-substitute tan(theta) = sqrt(x^2-9)/3 and theta = acos(3/x); then F(3sqrt(2)) = 3 - 3pi/4 while F(3) = 0. The exact value is 3 - 3pi/4."
          - problem: "Evaluate the definite integral from 4 to 8 of dx/(x sqrt(x^2 - 16)), taken on the domain x > 4 where sqrt(x^2 - 16) is nonnegative. Give the exact value."
            answer: "pi/12"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full object is the definite integral from 4 to 8 of dx/(x sqrt(x^2-16)). Use the secant substitution x = 4 sec(theta); then dx = 4 sec(theta) tan(theta) dtheta and the denominator x sqrt(x^2-16) = 16 sec(theta) tan(theta). The integrand simplifies by cancellation to (1/4) dtheta, whose antiderivative by the constant multiple rule is theta/4. Since sec(theta) = x/4, theta = acos(4/x); at x = 8 this is pi/3 and at x = 4 it is 0, so the difference is (pi/3 - 0)/4. The exact value is pi/12."
          - problem: "Evaluate the definite integral from 3 to 4 of 1/(x^2 - 2x)^(3/2) dx, taken where x > 2 so the square root is nonnegative. Give the exact value."
            answer: "2sqrt(3)/3 - 3sqrt(2)/4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full object is the definite integral from 3 to 4 of dx/(x^2-2x)^(3/2). Complete the square: x^2-2x = (x-1)^2 - 1, an integer center 1 and radius 1. Substitute u = x-1 and then the secant substitution u = sec(theta) with theta in (0, pi/2); then du = sec(theta) tan(theta) dtheta and (u^2-1)^(3/2) = tan^3(theta), so the integrand becomes cos(theta)/sin^2(theta). The substitution w = sin(theta) gives the antiderivative -csc(theta), which back-substitutes to -u/sqrt(u^2-1) = -(x-1)/sqrt(x^2-2x). By the fundamental theorem of calculus, evaluate at the endpoints: at x = 4 this is -3/sqrt(8) = -3sqrt(2)/4 and at x = 3 it is -2/sqrt(3) = -2sqrt(3)/3. The exact value is 2sqrt(3)/3 - 3sqrt(2)/4."
        constraints: "secant substitutions stated on a domain where sqrt(x^2 - a^2) >= 0; completed squares have integer center and radius"
    diagnostic_exemplar:
      problem: 'Evaluate $\int \frac{dx}{(x^2 - 4x + 8)^{3/2}}$.'
      answer: '$\frac{x - 2}{4\sqrt{x^2 - 4x + 8}} + C$'
      solution_sketch: 'Complete the square to $(x-2)^2 + 4$ and set $x - 2 = 2\tan\theta$; the integral becomes $\frac{1}{4}\int\cos\theta\,d\theta = \frac{\sin\theta}{4}$.'
    anki_seeds:
      - front: 'For $\sqrt{a^2 - x^2}$, substitute...'
        back: '$x = a\sin\theta$ (so the radical becomes $a\cos\theta$)'
        type: basic
      - front: 'For $\sqrt{a^2 + x^2}$ and $\sqrt{x^2 - a^2}$, substitute...'
        back: '$x = a\tan\theta$ and $x = a\sec\theta$ respectively'
        type: basic

  - id: partial-fractions-linear-factors
    name: Partial Fractions with Distinct Linear Factors
    core: true
    difficulty: 0.62
    drill: false
    answer_kind: numeric
    expected_time_secs: 180
    prerequisites:
      - id: rational-expressions
        weight: 0.6
        key: true
      - id: integration-substitution
        weight: 0.6
        key: true
      - id: definite-integrals-ftc
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: Decomposing into partial fractions
        key_prerequisites: [rational-expressions]
        exemplars:
          - problem: 'Decompose $\frac{3x + 5}{(x + 1)(x + 3)}$ into partial fractions.'
            answer: '$\frac{1}{x + 1} + \frac{2}{x + 3}$'
            solution_sketch: '$3x + 5 = A(x+3) + B(x+1)$; $x = -1$ gives $A = 1$, $x = -3$ gives $B = 2$.'
          - problem: 'Decompose $\frac{1}{x(x + 1)}$ into partial fractions.'
            answer: '$\frac{1}{x} - \frac{1}{x + 1}$'
            solution_sketch: '$1 = A(x+1) + Bx$; $x = 0$ gives $A = 1$, $x = -1$ gives $B = -1$.'
          - problem: "Find the partial fraction decomposition of (7x-11)/((x-1)(x-3))."
            answer: "2/(x-1)+5/(x-3)"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "Write the form (7x-11)/((x-1)(x-3)) = A/(x-1) + B/(x-3). Use cover-up at x = 1: A = (7*1-11)/(1-3) = (-4)/(-2) = 2. Use cover-up at x = 3: B = (7*3-11)/(3-1) = 10/2 = 5. The answer is 2/(x-1)+5/(x-3)."
          - problem: "Find the partial fraction decomposition of (2x-14)/((x+2)(x-4))."
            answer: "3/(x+2)-1/(x-4)"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "Write the form (2x-14)/((x+2)(x-4)) = A/(x+2) + B/(x-4). Use cover-up at x = -2: A = (2*(-2)-14)/(-2-4) = (-18)/(-6) = 3. Use cover-up at x = 4: B = (2*4-14)/(4+2) = (-6)/6 = -1. The answer is 3/(x+2)-1/(x-4)."
          - problem: "The fraction (5x+7)/((x+2)(x+3)) can be written as A/(x+2) + B/(x+3). Find A and B."
            answer: "A = -3; B = 8"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "A"}, {"contract": {"kind": "exact"}, "name": "B"}]}
            solution_sketch: "Write the form (5x+7)/((x+2)(x+3)) = A/(x+2) + B/(x+3), so 5x+7 = A(x+3) + B(x+2). Use cover-up at x = -2: A = (5*(-2)+7)/(-2+3) = (-3)/1 = -3. Use cover-up at x = -3: B = (5*(-3)+7)/(-3+2) = (-8)/(-1) = 8. Check by recombining: -3(x+3) + 8(x+2) = 5x+7. The answer is A = -3; B = 8."
          - problem: "The fraction (5x+5)/((x-1)(x+4)) can be written as A/(x-1) + B/(x+4). Find A + B."
            answer: "5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Write the form (5x+5)/((x-1)(x+4)) = A/(x-1) + B/(x+4). Use cover-up at x = 1: A = (5*1+5)/(1+4) = 10/5 = 2. Use cover-up at x = -4: B = (5*(-4)+5)/(-4-1) = (-15)/(-5) = 3. Then A + B = 2 + 3 = 5. The answer is 5."
        constraints: "two distinct linear factors with integer roots; numerator degree <= 1; coefficients found by plugging in roots (cover-up)"
      - id: kp2
        name: Integrating distinct linear factors
        key_prerequisites: [rational-expressions, integration-substitution]
        exemplars:
          - problem: "The antiderivative of 1/((x-2)(x+4)) with respect to x has the form A ln(abs(x-2)) + B ln(abs(x+4)) + C for constants A and B. Find A and B."
            answer: "A = 1/6; B = -1/6"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "A"}, {"contract": {"kind": "exact"}, "name": "B"}]}
            solution_sketch: "Write the partial fraction form 1/((x-2)(x+4)) = A/(x-2) + B/(x+4), so 1 = A(x+4) + B(x-2) after clearing fractions. The cover-up substitution x = 2 gives 1 = 6A, so A = 1/6, and the substitution x = -4 gives 1 = -6B, so B = -1/6. The log rule then integrates each term to (1/6) ln(abs(x-2)) - (1/6) ln(abs(x+4)) + C, so the coefficients are A = 1/6; B = -1/6."
          - problem: "The antiderivative of (5x-4)/((x-2)(x+1)) with respect to x has the form A ln(abs(x-2)) + B ln(abs(x+1)) + C for constants A and B. Find A and B."
            answer: "A = 2; B = 3"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "A"}, {"contract": {"kind": "exact"}, "name": "B"}]}
            solution_sketch: "Set up the partial fraction form (5x-4)/((x-2)(x+1)) = A/(x-2) + B/(x+1), so 5x - 4 = A(x+1) + B(x-2) after clearing fractions. The cover-up substitution x = 2 gives 6 = 3A, so A = 2, and the substitution x = -1 gives -9 = -3B, so B = 3. The log rule then integrates each term to 2 ln(abs(x-2)) + 3 ln(abs(x+1)) + C, so the coefficients are A = 2; B = 3."
          - problem: "A fraction with a linear numerator over (x-1)(x+2) has the partial fraction decomposition 4/(x-1) - 3/(x+2). Find its numerator as a polynomial in x."
            answer: "x+11"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Recombine the two terms 4/(x-1) and -3/(x+2) over the common denominator (x-1)(x+2) by adding the fractions. The numerator is 4(x+2) - 3(x-1). Expanding gives 4x + 8 - 3x + 3, and collecting like terms gives the polynomial. The numerator is x+11."
          - problem: "The antiderivative of (4x+22)/((x-5)(x+1)) with respect to x has the form 7 ln(abs(x-5)) + B ln(abs(x+1)) + C. Find the value of B."
            answer: "-3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The given form comes from the partial fraction decomposition (4x+22)/((x-5)(x+1)) = 7/(x-5) + B/(x+1). Clearing fractions gives 4x + 22 = 7(x+1) + B(x-5). The cover-up substitution x = -1 eliminates the first term: 18 = -6B, so B = -3. The value of B is -3."
          - problem: "The fraction (x+13)/((x-5)(x-2)) is decomposed into partial fractions. Select the correct decomposition."
            answer: "6/(x-5) - 5/(x-2)"
            answer_contract: {"kind": "label", "options": [["6/(x-5) - 5/(x-2)"], ["5/(x-5) - 6/(x-2)"], ["6/(x-5) + 5/(x-2)"], ["-6/(x-5) + 5/(x-2)"]]}
            solution_sketch: "Write (x+13)/((x-5)(x-2)) = A/(x-5) + B/(x-2), so x + 13 = A(x-2) + B(x-5) after clearing fractions. The cover-up substitution x = 5 gives 18 = 3A, so A = 6, and the substitution x = 2 gives 15 = -3B, so B = -5. The option 5/(x-5) - 6/(x-2) swaps the two coefficients, the option 6/(x-5) + 5/(x-2) makes a sign error on the second coefficient, and the option -6/(x-5) + 5/(x-2) flips the sign of both terms. The correct decomposition is 6/(x-5) - 5/(x-2)."
          - problem: "A certain fraction has denominator (x-2)(x+7), and its antiderivative with respect to x is 3 ln(abs(x-2)) + 4 ln(abs(x+7)) + C. Find the numerator of that fraction as a polynomial in x."
            answer: "7x+13"
            answer_contract: {"kind": "exact"}
            solution_sketch: "By the log rule, the antiderivative 3 ln(abs(x-2)) + 4 ln(abs(x+7)) + C comes from the partial fraction decomposition 3/(x-2) + 4/(x+7). Recombine the two terms over the common denominator (x-2)(x+7): the numerator is 3(x+7) + 4(x-2). Expanding gives 3x + 21 + 4x - 8, and collecting like terms gives the polynomial. The numerator is 7x+13."
        constraints: "denominator = product of two distinct linear factors with integer roots; numerator degree <= 1"
      - id: kp3
        name: Definite integrals with partial fractions
        key_prerequisites: [integration-substitution, definite-integrals-ftc]
        exemplars:
          - problem: 'Evaluate $\int_0^1 \frac{dx}{(x + 1)(x + 2)}$.'
            answer: '$\ln\frac{4}{3}$'
            solution_sketch: '$\frac{1}{(x+1)(x+2)} = \frac{1}{x+1} - \frac{1}{x+2}$; $[\ln\frac{x+1}{x+2}]_0^1 = \ln\frac{2}{3} - \ln\frac{1}{2} = \ln\frac{4}{3}$.'
          - problem: 'Evaluate $\int_1^3 \frac{dx}{x(x + 1)}$.'
            answer: '$\ln\frac{3}{2}$'
            solution_sketch: '$[\ln\frac{x}{x+1}]_1^3 = \ln\frac{3}{4} - \ln\frac{1}{2} = \ln\frac{3}{2}$.'
          - problem: "Evaluate $\\int_0^1 \\frac{dx}{(x + 2)(x + 3)}$. Give the answer to 4 decimals."
            answer: "0.1178"
            answer_contract: {"decimals": 4, "kind": "approx"}
            solution_sketch: "Partial fractions: 1/((x+2)(x+3)) = 1/(x+2) - 1/(x+3). Integrate with the log rule to get ln((x+2)/(x+3)). Evaluate at 1 and 0: ln(3/4) - ln(2/3) = ln(9/8). ln(9/8) = 0.11778... The answer to 4 decimals is 0.1178."
          - problem: "Evaluate $\\int_0^2 \\frac{dx}{(x + 3)(x + 4)}$. Give the answer to 4 decimals."
            answer: "0.1054"
            answer_contract: {"decimals": 4, "kind": "approx"}
            solution_sketch: "Partial fractions: 1/((x+3)(x+4)) = 1/(x+3) - 1/(x+4). Integrate with the log rule to get ln((x+3)/(x+4)). Evaluate at 2 and 0: ln(5/6) - ln(3/4) = ln(10/9). ln(10/9) = 0.10536... The answer to 4 decimals is 0.1054."
          - problem: "Find the positive value of $b$ such that $\\int_0^b \\frac{dx}{(x + 2)(x + 3)} = \\ln\\frac{5}{4}$."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Partial fractions: write 1/((x+2)(x+3)) = 1/(x+2) - 1/(x+3). Integrate with the log rule to get ln((b+2)/(b+3)) - ln(2/3). Set this equal to ln(5/4) and solve 3(b+2)/(2(b+3)) = 5/4, which gives b = 3. The answer is 3."
          - problem: "A tank drains at a rate of $\\frac{1}{(t + 1)(t + 2)}$ liters per minute from $t = 2$ to $t = 3$. Find the total volume drained in liters. Give the answer to 4 decimals."
            answer: "0.0645"
            answer_contract: {"decimals": 4, "kind": "approx"}
            solution_sketch: "Partial fractions: 1/((t+1)(t+2)) = 1/(t+1) - 1/(t+2). Integrate with the log rule to get ln((t+1)/(t+2)). Evaluate from 2 to 3: ln(4/5) - ln(3/4) = ln(16/15). ln(16/15) = 0.06454... The answer to 4 decimals is 0.0645."
        constraints: "bounds avoid all roots of the denominator; combine logs into a single ln of a rational number"
    diagnostic_exemplar:
      problem: 'Evaluate $\int_2^3 \frac{dx}{x(x - 1)}$.'
      answer: '$\ln\frac{4}{3}$'
      solution_sketch: '$\frac{1}{x(x-1)} = \frac{1}{x-1} - \frac{1}{x}$; $[\ln|x-1| - \ln|x|]_2^3 = (\ln 2 - \ln 3) - (0 - \ln 2) = \ln\frac{4}{3}$.'
    anki_seeds:
      - front: "Cover-up method: to find A in A/(x - a) for distinct linear factors..."
        back: "multiply through by (x - a), then set x = a in what remains"
        type: basic
      - front: '$\int \frac{dx}{x - a} = $ ?'
        back: '$\ln|x - a| + C$'
        type: basic

  - id: partial-fractions-integration
    name: Integration by Partial Fractions
    core: true
    difficulty: 0.7
    drill: false
    answer_kind: numeric
    expected_time_secs: 240
    prerequisites:
      - id: partial-fractions-linear-factors
        weight: 0.8
        key: true
      - id: polynomial-division
        weight: 0.5
        key: true
      - id: integration-substitution
        weight: 0.4
      - id: derivatives-exp-log
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: Repeated linear factors
        key_prerequisites: [partial-fractions-linear-factors]
        exemplars:
          - problem: "Evaluate $\\int \\frac{2x + 3}{(x + 1)^2} \\, dx$. Give the antiderivative as a function of $x$."
            answer: "2 ln(x+1) - 1/(x+1) + C"
            answer_contract: {"kind": "function", "up_to_constant": true, "vars": ["x"]}
            solution_sketch: "Start from the full integral of (2x + 3)/(x + 1)^2 dx. By the partial fraction decomposition for a repeated linear factor, write (2x + 3)/(x + 1)^2 = A/(x + 1) + B/(x + 1)^2, so 2x + 3 = A(x + 1) + B. Matching the x coefficient gives A = 2, and setting x = -1 gives B = 1. Integrating each term with the logarithm and power rules gives 2 ln(x+1) - 1/(x+1) + C. The key is 2 ln(x+1) - 1/(x+1) + C."
          - problem: "Evaluate $\\int \\frac{1}{x^2 (x + 1)} \\, dx$. Give the antiderivative as a function of $x$."
            answer: "-ln(x) - 1/x + ln(x+1) + C"
            answer_contract: {"kind": "function", "up_to_constant": true, "vars": ["x"]}
            solution_sketch: "Start from the full integral of 1/(x^2(x + 1)) dx. By the partial fraction decomposition with the repeated factor x^2, write 1/(x^2(x + 1)) = A/x + B/x^2 + D/(x + 1), so 1 = A x(x + 1) + B(x + 1) + D x^2. Setting x = 0 gives B = 1, setting x = -1 gives D = 1, and matching the x^2 coefficient gives A = -1. Integrating each term gives -ln(x) - 1/x + ln(x+1) + C. The key is -ln(x) - 1/x + ln(x+1) + C."
          - problem: "Compute the indefinite integral $\\int \\frac{3x + 4}{(x + 2)^2} \\, dx$. Give the antiderivative as a function of $x$."
            answer: "3 ln(x+2) + 2/(x+2) + C"
            answer_contract: {"kind": "function", "up_to_constant": true, "vars": ["x"]}
            solution_sketch: "Start from the full integral of (3x + 4)/(x + 2)^2 dx. By the partial fraction decomposition for the repeated linear factor (x + 2)^2, write (3x + 4)/(x + 2)^2 = A/(x + 2) + B/(x + 2)^2, so 3x + 4 = A(x + 2) + B. Matching the x coefficient by coefficient comparison gives A = 3, and setting x = -2 by root substitution gives B = -2. Integrating each term with the logarithm and power rules gives 3 ln(x+2) + 2/(x+2) + C. The key is 3 ln(x+2) + 2/(x+2) + C."
          - problem: "Write $\\frac{5x + 6}{(x + 2)^2} = \\frac{A}{x + 2} + \\frac{B}{(x + 2)^2}$, where A and B are constants. Give A and B."
            answer: "A = 5; B = -4"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "A"}, {"contract": {"kind": "exact"}, "name": "B"}]}
            solution_sketch: "Start from the full equation 5x + 6 = A(x + 2) + B, obtained by multiplying the decomposition (5x + 6)/(x + 2)^2 = A/(x + 2) + B/(x + 2)^2 by (x + 2)^2. Matching the x coefficient by the coefficient-comparison rule gives A = 5. Setting x = -2 by the root-substitution rule gives 5(-2) + 6 = -4, so B = -4. The key is A = 5; B = -4."
          - problem: "Evaluate $\\int \\frac{2x + 1}{x (x + 1)^2} \\, dx$. Give the antiderivative as a function of $x$."
            answer: "ln(x) - ln(x+1) - 1/(x+1) + C"
            answer_contract: {"kind": "function", "up_to_constant": true, "vars": ["x"]}
            solution_sketch: "Start from the full integral of (2x + 1)/(x(x + 1)^2) dx. By the partial fraction decomposition with the repeated factor (x + 1)^2, write (2x + 1)/(x(x + 1)^2) = A/x + B/(x + 1) + D/(x + 1)^2, so 2x + 1 = A(x + 1)^2 + B x(x + 1) + D x. Setting x = 0 gives A = 1, setting x = -1 gives D = 1, and matching the x^2 coefficient gives B = -1. Integrating each term gives ln(x) - ln(x+1) - 1/(x+1) + C. The key is ln(x) - ln(x+1) - 1/(x+1) + C."
          - problem: "The fraction $(5x - 1)/(x - 3)^2$ has the form $A/(x - 3) + B/(x - 3)^2$. Find B."
            answer: "14"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Use the partial fraction setup: set (5x - 1)/(x - 3)^2 = A/(x - 3) + B/(x - 3)^2. Multiply by (x - 3)^2 to get 5x - 1 = A(x - 3) + B. Matching the x coefficient gives A = 5. Setting x = 3 by the root-substitution rule gives 14 = B. The value is 14."
        constraints: "one repeated linear factor of multiplicity 2; total denominator degree <= 3"
      - id: kp2
        name: Improper fractions (divide first)
        key_prerequisites: [polynomial-division, partial-fractions-linear-factors]
        exemplars:
          - problem: "Evaluate the definite integral $\\int_0^2 \\frac{4x^2 + 6x + 3}{x^2 + 3x + 2}\\,dx$. Give the answer to 4 decimals."
            answer: "4.2466"
            answer_contract: {"decimals": 4, "kind": "approx"}
            solution_sketch: "Start with the improper fraction (4x^2 + 6x + 3)/(x^2 + 3x + 2). Divide first by polynomial division: it equals 4 + (-6x - 5)/((x+1)(x+2)). Decompose the remainder over the distinct linear factors by partial fractions: -6x - 5 = A(x+2) + B(x+1), so A = 1 and B = -7, giving 4 + 1/(x+1) - 7/(x+2). Integrate term by term with the power rule and the log rule: F(x) = 4x + ln(x+1) - 7ln(x+2). Evaluate from 0 to 2: (8 + ln3 - 7ln4) - (0 + ln1 - 7ln2) = 8 + ln3 - 7ln2, which is about 4.2466. The answer is 4.2466."
          - problem: "Evaluate the definite integral $\\int_2^3 \\frac{x^3 - 3x^2 - 4x + 3}{x^2 - 5x + 4}\\,dx$. Give the answer as a fraction."
            answer: "9/2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Start with the improper fraction (x^3 - 3x^2 - 4x + 3)/(x^2 - 5x + 4). Divide first by polynomial division: the quotient is x + 2 and the remainder is 2x - 5, so the integrand is x + 2 + (2x - 5)/((x-1)(x-4)). Decompose the remainder over the distinct linear factors by partial fractions: 2x - 5 = (x - 4) + (x - 1), so it is 1/(x-1) + 1/(x-4). Integrate with the power rule and the log rule: F(x) = x^2/2 + 2x + ln|x-1| + ln|x-4|. Evaluate from 2 to 3: (9/2 + 6 + ln2) - (2 + 4 + ln2) = 9/2, because the ln2 terms at the two limits cancel. The answer is 9/2."
          - problem: "A particle moves along a line with velocity $v(t) = \\frac{3t^2 + 10t + 5}{t^2 + 3t + 2}$ meters per second. Find the displacement over the interval from $t = 0$ to $t = 4$. Give the answer to 4 decimals."
            answer: "12.0770"
            answer_contract: {"decimals": 4, "kind": "approx"}
            solution_sketch: "Start with the improper fraction (3t^2 + 10t + 5)/(t^2 + 3t + 2). Divide first by polynomial division: it equals 3 + (t - 1)/((t+1)(t+2)). Decompose the remainder over the distinct linear factors by partial fractions: t - 1 = A(t+2) + B(t+1), so A = -2 and B = 3, giving 3 - 2/(t+1) + 3/(t+2). Integrate with the power rule and the log rule: F(t) = 3t - 2ln(t+1) + 3ln(t+2). The displacement is F(4) - F(0) = (12 - 2ln5 + 3ln6) - 3ln2 = 12 - 2ln5 + 3ln3, which is about 12.0770. The answer is 12.0770."
          - problem: "Evaluate the definite integral $\\int_3^5 \\frac{3x^3 + 5x^2 - 25x + 18}{x^2 + 2x - 8}\\,dx$. Give the answer to 4 decimals."
            answer: "23.9459"
            answer_contract: {"decimals": 4, "kind": "approx"}
            solution_sketch: "Start with the improper fraction (3x^3 + 5x^2 - 25x + 18)/(x^2 + 2x - 8). Divide first by polynomial division: the quotient is 3x - 1 and the remainder is x + 10, so the integrand is 3x - 1 + (x + 10)/((x-2)(x+4)). Decompose the remainder over the distinct linear factors by partial fractions: x + 10 = A(x+4) + B(x-2), so A = 2 and B = -1, giving 3x - 1 + 2/(x-2) - 1/(x+4). Integrate with the power rule and the log rule: F(x) = 3x^2/2 - x + 2ln|x-2| - ln|x+4|. Evaluate from 3 to 5: F(5) = 32.5 + 2ln3 - ln9 = 32.5 and F(3) = 10.5 - ln7, so the value is 22 + ln7, which is about 23.9459. The answer is 23.9459."
          - problem: "A particle moves along a line with velocity $v(t) = \\frac{5t^2 - 13t - 23}{t^2 - 3t - 4}$ meters per second. Find the displacement over the interval from $t = 0$ to $t = 3$."
            answer: "15"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Start with the improper fraction (5t^2 - 13t - 23)/(t^2 - 3t - 4). Divide first by polynomial division: it equals 5 + (2t - 3)/((t+1)(t-4)). Decompose the remainder over the distinct linear factors by partial fractions: 2t - 3 = (t - 4) + (t + 1), so it is 1/(t+1) + 1/(t-4). Integrate with the power rule and the log rule: F(t) = 5t + ln(t+1) + ln|t-4|. The displacement is F(3) - F(0) = (15 + ln4 + ln1) - (0 + ln1 + ln4) = 15, because the logarithm terms cancel. The answer is 15."
          - problem: "Evaluate the definite integral $\\int_0^1 \\frac{4x^2 + x + 5}{2x^2 + 7x + 3}\\,dx$. Give the answer to 4 decimals."
            answer: "1.0221"
            answer_contract: {"decimals": 4, "kind": "approx"}
            solution_sketch: "Start with the improper fraction (4x^2 + x + 5)/(2x^2 + 7x + 3), whose denominator factors as (2x+1)(x+3). Divide first by polynomial division: it equals 2 + (-13x - 1)/((2x+1)(x+3)). Decompose the remainder over the distinct linear factors by partial fractions: -13x - 1 = A(x+3) + B(2x+1); x = -3 gives B = -38/5 and x = -1/2 gives A = 11/5, so it is (11/5)/(2x+1) - (38/5)/(x+3). Integrate with the power rule and the log rule, using the chain factor 1/2 for 2x+1: F(x) = 2x + (11/10)ln(2x+1) - (38/5)ln(x+3). Evaluate from 0 to 1: 2 + (11/10)ln3 - (38/5)ln4 + (38/5)ln3 = 2 + (87/10)ln3 - (38/5)ln4, which is about 1.0221. The answer is 1.0221."
        constraints: "numerator degree >= denominator degree; quotient is degree <= 1; remainder decomposes over distinct linear factors"
      - id: kp3
        name: Irreducible quadratic factors
        key_prerequisites: [partial-fractions-linear-factors, integration-substitution]
        exemplars:
          - problem: "Evaluate the definite integral of 1/(x*(x^2+1)) with respect to x from x = 1 to x = 2. Give the answer to 4 decimals."
            answer: "0.2350"
            answer_contract: {"decimals": 4, "kind": "approx"}
            solution_sketch: "Decompose the integrand by partial fractions with one linear factor and one irreducible quadratic factor: 1/(x*(x^2+1)) = 1/x - x/(x^2+1). Antidifferentiate each term: the logarithm rule gives ln(abs(x)) for 1/x, and the substitution u = x^2+1 gives -ln(x^2+1)/2 for -x/(x^2+1). Apply the Fundamental Theorem of Calculus from 1 to 2: the value is ln(2) - ln(5/2)/2 = 0.235001, which is 0.2350 to 4 decimals."
          - problem: "Evaluate the definite integral of 4/(x*(x^2+4)) with respect to x from x = 1 to x = 4. Give the answer to 4 decimals."
            answer: "0.6931"
            answer_contract: {"decimals": 4, "kind": "approx"}
            solution_sketch: "Decompose the integrand by partial fractions with an irreducible quadratic factor: 4/(x*(x^2+4)) = 1/x - x/(x^2+4). Antidifferentiate each term: the logarithm rule gives ln(abs(x)), and the substitution u = x^2+4 turns -x/(x^2+4) into -ln(x^2+4)/2. Apply the Fundamental Theorem of Calculus from 1 to 4: ln(4) - ln(20)/2 + ln(5)/2 = ln(2) = 0.693147, which is 0.6931 to 4 decimals."
          - problem: "Evaluate the definite integral of (x^2+1)/(x*(x^2+4)) with respect to x from x = 1 to x = 4. Give the answer to 4 decimals."
            answer: "0.8664"
            answer_contract: {"decimals": 4, "kind": "approx"}
            solution_sketch: "Set up the partial fraction decomposition with an irreducible quadratic: (x^2+1)/(x*(x^2+4)) = A/x + (Bx)/(x^2+4). Clearing denominators, A*(x^2+4) + Bx^2 = x^2+1, so 4A = 1 and A + B = 1, giving A = 1/4 and B = 3/4. Antidifferentiate with the logarithm rule and the substitution u = x^2+4: F(x) = (1/4)*ln(abs(x)) + (3/8)*ln(x^2+4). The Fundamental Theorem of Calculus from 1 to 4 gives (5/4)*ln(2) = 0.866434, which is 0.8664 to 4 decimals."
          - problem: "The rational function 5/((x+2)*(x^2+1)) decomposes into partial fractions as A/(x+2) + (Bx+C)/(x^2+1). Find the values of A, B and C."
            answer: "A = 1; B = -1; C = 2"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "A"}, {"contract": {"kind": "exact"}, "name": "B"}, {"contract": {"kind": "exact"}, "name": "C"}]}
            solution_sketch: "Clear denominators in the decomposition 5/((x+2)*(x^2+1)) = A/(x+2) + (Bx+C)/(x^2+1): A*(x^2+1) + (Bx+C)*(x+2) = 5. Match coefficients of like powers: A + B = 0, 2B + C = 0, A + 2C = 5. Solve the system: C = -2B and A = -B, so -B - 4B = 5 gives B = -1, hence A = 1 and C = 2. The values are A = 1; B = -1; C = 2."
          - problem: "Evaluate the definite integral of (2x^2+4)/(x*(x^2+4)) with respect to x from x = 2 to x = 4. Give the answer to 4 decimals."
            answer: "1.1513"
            answer_contract: {"decimals": 4, "kind": "approx"}
            solution_sketch: "Set up the partial fraction decomposition: (2x^2+4)/(x*(x^2+4)) = A/x + (Bx)/(x^2+4). Clearing denominators, A*(x^2+4) + Bx^2 = 2x^2+4, so 4A = 4 and A + B = 2, giving A = 1 and B = 1. Antidifferentiate with the logarithm rule and the substitution u = x^2+4: F(x) = ln(abs(x)) + (1/2)*ln(x^2+4). The Fundamental Theorem of Calculus from 2 to 4 gives ln(2) + ln(20/8)/2 = 1.151292, which is 1.1513 to 4 decimals."
          - problem: "The rational function 2x/((x-1)*(x^2+4)) decomposes into partial fractions as A/(x-1) + (Bx+C)/(x^2+4). Find the values of A, B and C."
            answer: "A = 2/5; B = -2/5; C = 8/5"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "A"}, {"contract": {"kind": "exact"}, "name": "B"}, {"contract": {"kind": "exact"}, "name": "C"}]}
            solution_sketch: "Clear denominators in the decomposition 2x/((x-1)*(x^2+4)) = A/(x-1) + (Bx+C)/(x^2+4): A*(x^2+4) + (Bx+C)*(x-1) = 2x. Match coefficients of like powers: A + B = 0, C - B = 2, 4A - C = 0. Solve the system: C = 4A and B = -A, so 4A + A = 2, giving A = 2/5, B = -2/5 and C = 8/5. The values are A = 2/5; B = -2/5; C = 8/5."
        constraints: "at most one irreducible quadratic factor (x^2 + 1 or x^2 + 4); Bx + C numerator handled by u = the quadratic"
    diagnostic_exemplar:
      problem: 'Evaluate $\int \frac{x^2 + 2}{x(x^2 + 1)} \, dx$.'
      answer: '$2\ln|x| - \frac{1}{2}\ln(x^2 + 1) + C$'
      answer_contract: {kind: none}
      solution_sketch: 'The irreducible quadratic needs $\frac{A}{x} + \frac{Bx + C}{x^2+1}$; matching coefficients gives $A = 2$, $B = -1$, $C = 0$.'
    anki_seeds:
      - front: "Partial fraction form for a repeated factor (x - a)^2?"
        back: '$\frac{A}{x - a} + \frac{B}{(x - a)^2}$'
        type: basic
      - front: "Before decomposing a rational integrand, check that..."
        back: "the numerator degree is less than the denominator degree — otherwise do polynomial long division first"
        type: basic
      - front: "Partial fraction numerator over an irreducible quadratic factor?"
        back: '$\frac{Bx + C}{x^2 + bx + c}$ (a full linear numerator, not just a constant)'
        type: basic

  - id: weierstrass-substitution
    name: Weierstrass Substitution
    core: false                # special-case technique; nothing downstream
    difficulty: 0.75
    drill: false
    answer_kind: numeric
    expected_time_secs: 240
    prerequisites:
      - id: trigonometric-integrals
        weight: 0.6
        key: true
      - id: partial-fractions-linear-factors
        weight: 0.5
        key: true
      - id: integration-substitution
        weight: 0.5
      - id: trig-identities-basic
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: The substitution t = tan(x/2)
        key_prerequisites: [trig-identities-basic, integration-substitution]
        exemplars:
          - problem: "With $t = \\tan(x/2)$, express $\\sin x$ and $\\cos x$ in terms of $t$. Give sinx and cosx."
            answer: "sinx = 2t/(1+t^2); cosx = (1-t^2)/(1+t^2)"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "function", "vars": ["t"]}, "name": "sinx"}, {"contract": {"kind": "function", "vars": ["t"]}, "name": "cosx"}]}
            solution_sketch: "Let t = tan(x/2), so sin(x/2) = t cos(x/2) and 1 + t^2 = 1/cos^2(x/2). Double-angle identity for sine: sin x = 2 sin(x/2) cos(x/2) = 2t/(1 + t^2). Double-angle identity for cosine: cos x = cos^2(x/2) - sin^2(x/2) = (1 - t^2)/(1 + t^2). The answer is sinx = 2t/(1+t^2); cosx = (1-t^2)/(1+t^2)."
          - problem: 'Evaluate $\int \frac{dx}{1 + \sin x}$.'
            answer: '$-\frac{2}{1 + \tan(x/2)} + C$'
            solution_sketch: '$t = \tan(x/2)$: $\int \frac{2\,dt}{(1+t^2)(1 + \frac{2t}{1+t^2})} = \int \frac{2\,dt}{(1+t)^2} = -\frac{2}{1+t} + C$.'
          - problem: 'Evaluate $\int_0^{\pi/2} \frac{dx}{1 + \sin x}$.'
            answer: "1"
            solution_sketch: '$t$ runs from $0$ to $1$: $[-\frac{2}{1+t}]_0^1 = -1 + 2 = 1$.'
          - problem: "Evaluate $\\int \\frac{dx}{1 + \\cos x}$."
            answer: "tan(x/2) + C"
            answer_contract: {"kind": "function", "up_to_constant": true, "vars": ["x"]}
            solution_sketch: "Use the half-angle substitution t = tan(x/2). Then cos x = (1 - t^2)/(1 + t^2) and dx = 2 dt/(1 + t^2), so 1 + cos x = 2/(1 + t^2). The integrand becomes (2 dt/(1 + t^2)) times ((1 + t^2)/2) = dt, and the t-integral is t + C. Substitute back t = tan(x/2); the answer is tan(x/2) + C."
          - problem: "Evaluate $\\int_{-\\pi/2}^{\\pi/2} \\frac{dx}{1 + \\cos x}$."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Use the half-angle substitution t = tan(x/2). The integrand becomes dt and the limits become t = tan(-pi/4) = -1 and t = tan(pi/4) = 1. The antiderivative in t is t, so the definite integral is 1 - (-1) = 2. The answer is 2."
          - problem: "With $t = \\tan(x/2)$, the integral $\\int \\frac{dx}{1 + \\sin x}$ becomes $\\int g(t)\\, dt$. Find g(t)."
            answer: "2/(1+t)^2"
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: "Set t = tan(x/2), so sin x = 2t/(1 + t^2) and dx = 2 dt/(1 + t^2). The denominator becomes 1 + 2t/(1 + t^2) = (1 + t)^2/(1 + t^2). Dividing gives (2 dt/(1 + t^2)) times ((1 + t^2)/(1 + t)^2) = 2 dt/(1 + t)^2. The answer is 2/(1+t)^2."
        constraints: "denominators of the form 1 + sin x or 1 + cos x; the t-integral must be a single power of a linear factor"
      - id: kp2
        name: Rational functions of sin and cos
        key_prerequisites: [partial-fractions-linear-factors, trigonometric-integrals]
        exemplars:
          - problem: 'Evaluate $\int \frac{dx}{3 + 5\cos x}$.'
            answer: '$\frac{1}{4}\ln\left|\frac{2 + \tan(x/2)}{2 - \tan(x/2)}\right| + C$'
            answer_contract: {kind: none}
            solution_sketch: '$t = \tan(x/2)$: the integrand becomes $\frac{2}{8 - 2t^2} = \frac{1}{4 - t^2}$; partial fractions give $\frac{1}{4}\ln\left|\frac{2+t}{2-t}\right|$.'
          - problem: 'Evaluate $\int \frac{dx}{5 + 4\cos x}$.'
            answer: '$\frac{2}{3}\arctan\left(\frac{\tan(x/2)}{3}\right) + C$'
            answer_contract: {kind: none}
            solution_sketch: '$t = \tan(x/2)$: $5 + 4\cos x = \frac{9 + t^2}{1 + t^2}$, so the integral is $\int \frac{2\,dt}{9 + t^2} = \frac{2}{3}\arctan\frac{t}{3}$.'
          - problem: 'Evaluate $\int \csc x \, dx$ using $t = \tan(x/2)$.'
            answer: '$\ln\left|\tan\frac{x}{2}\right| + C$'
            answer_contract: {kind: none}
            solution_sketch: '$\csc x\,dx = \frac{1+t^2}{2t}\cdot\frac{2\,dt}{1+t^2} = \frac{dt}{t}$.'
        constraints: "integrand rational in sin x and cos x with small integer coefficients; the t-integral is an arctan pattern or splits over distinct linear factors"
    diagnostic_exemplar:
      problem: 'Evaluate $\int \frac{dx}{2 + \cos x}$.'
      answer: '$\frac{2}{\sqrt{3}}\arctan\left(\frac{\tan(x/2)}{\sqrt{3}}\right) + C$'
      answer_contract: {kind: none}
      solution_sketch: 'With $t = \tan(x/2)$ the integrand becomes $\frac{2\,dt}{3 + t^2}$.'
    anki_seeds:
      - front: 'Weierstrass substitution $t = \tan(x/2)$: the three replacement formulas?'
        back: '$\sin x = \frac{2t}{1+t^2}$, $\cos x = \frac{1-t^2}{1+t^2}$, $dx = \frac{2\,dt}{1+t^2}$'
        type: basic
      - front: "When is the Weierstrass substitution the right tool?"
        back: "When the integrand is a rational function of sin x and cos x that no simpler identity or u-substitution handles."
        type: basic

  - id: improper-integrals-infinite-limits
