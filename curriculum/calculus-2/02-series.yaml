      solution_sketch: 'It is $\sum_{n=1}^{\infty} 36 (10^{-2})^n = \frac{36/100}{1 - 1/100} = \frac{36}{99} = \frac{4}{11}$ (the ratio $1/100$ has modulus below $1$).'
