          - problem: "For the series sum_{n=1}^\\infty 3^n/n!, a factorial and an exponential suggest a test. Find the limit L = lim_{n->\\infty} a_{n+1}/a_n."
            answer: "0"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full series is sum 3^n/n!. Step 1: use the ratio test because of the factorial and exponential. Write a_{n+1}/a_n = (3^{n+1}/(n+1)!)/(3^n/n!) = 3/(n+1). Step 2: take the limit as n goes to infinity, which is 0. Step 3: the ratio test limit is L = 0. The limit is L = 0."
