  - id: comparison-tests
    name: Comparison Tests
    core: true
    difficulty: 0.7
    drill: false
    answer_kind: numeric
    expected_time_secs: 180
    prerequisites:
      - id: direct-comparison-test
        weight: 0.8
        key: true
      - id: integral-p-series-tests
        weight: 0.4
      - id: sequences-convergence
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: Limit comparison
        key_prerequisites: [direct-comparison-test, sequences-convergence]
        exemplars:
          - problem: 'Use limit comparison to decide whether $\sum_{n=1}^{\infty} \frac{1}{2n + 1}$ converges.'
            answer: 'diverges (limit comparison with $\sum \frac{1}{n}$: $L = \frac{1}{2}$)'
            answer_contract: {kind: none}
            solution_sketch: '$\lim \frac{1/(2n+1)}{1/n} = \frac{1}{2} \in (0, \infty)$, so both series share the harmonic series'' fate.'
          - problem: 'Use limit comparison to decide whether $\sum_{n=1}^{\infty} \frac{3n^2 + n}{n^4 + 2}$ converges.'
            answer: 'converges (limit comparison with $\sum \frac{1}{n^2}$: $L = 3$)'
            answer_contract: {kind: none}
            solution_sketch: 'Dominant behavior is $\frac{3n^2}{n^4} = \frac{3}{n^2}$; the limit of the ratio is $3$.'
          - problem: 'Use limit comparison to decide whether $\sum_{n=1}^{\infty} \sin\left(\frac{1}{n}\right)$ converges.'
            answer: 'diverges (limit comparison with $\sum \frac{1}{n}$: $L = 1$)'
            answer_contract: {kind: none}
            solution_sketch: '$\frac{\sin(1/n)}{1/n} \to 1$, so the series behaves like the harmonic series.'
        constraints: "L must land in (0, infinity); state L explicitly in the verdict"
      - id: kp2
        name: Choosing a comparator by dominant terms
        key_prerequisites: [direct-comparison-test, integral-p-series-tests]
        exemplars:
          - problem: "The series has terms sqrt(n)/(n^2 + 5) for integers n >= 1. State whether it converges or diverges, and give the exponent p of its p-series comparator as a fraction."
            answer: "verdict = converges; p = 3/2"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["converges"], ["diverges"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "p"}]}
            solution_sketch: "The full series has terms sqrt(n)/(n^2 + 5). Step 1, dominant-term rule: the numerator behaves like n^(1/2) and the denominator behaves like n^2, so the comparator is n^(1/2)/n^2 = 1/n^(3/2), giving p = 3/2. Step 2, p-series rule: a p-series converges when p > 1, so this series converges, and the option diverges is wrong because p = 3/2 is greater than 1. The answer is verdict = converges; p = 3/2."
          - problem: "The series has terms 2^n/(5^n + n) for integers n >= 1. Give the common ratio r of its geometric comparator r^n as a fraction."
            answer: "2/5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full series has terms 2^n/(5^n + n). Step 1, dominant-term rule: the added term n is negligible against 5^n, so the terms behave like 2^n/5^n = (2/5)^n. Step 2, geometric-series rule: the geometric comparator is r^n with r = 2/5. The answer is 2/5."
          - problem: "The series has terms (7n + 5)/(n^3 + 4n) for integers n >= 1. Give the exponent p of the p-series comparator 1/n^p, as a whole number."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full series has terms (7n + 5)/(n^3 + 4n). Step 1, dominant-term rule: the numerator behaves like 7n and the denominator behaves like n^3, so the terms behave like 7n/n^3 = 7/n^2. Step 2, p-series rule: the comparator is 1/n^p with p = 2. The answer is 2."
          - problem: "The series has terms (4n + 1)/sqrt(n^3 + 2) for integers n >= 1. Give the exponent p of its p-series comparator 1/n^p, as a fraction."
            answer: "1/2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full series has terms (4n + 1)/sqrt(n^3 + 2). Step 1, dominant-term rule: the numerator behaves like 4n and the denominator behaves like n^(3/2), so the terms behave like 4n/n^(3/2) = 4/n^(1/2). Step 2, p-series rule: the comparator is 1/n^p with p = 1/2. The answer is 1/2."
          - problem: "The series has terms (9n^2 + 4)/(3n^7 + 1) for integers n >= 1. Give its p-series comparator in the form 1/n^p, as a function of n."
            answer: "1/n^5"
            answer_contract: {"kind": "function", "vars": ["n"]}
            solution_sketch: "The full series has terms (9n^2 + 4)/(3n^7 + 1). Step 1, dominant-term rule: the numerator behaves like 9n^2 and the denominator behaves like 3n^7, so the terms behave like 9n^2/(3n^7) = 3/n^5. Step 2, p-series rule: the comparator is 1/n^5, a function of n. The answer is 1/n^5."
          - problem: "The series has terms (3^n + n)/(2^n + 1) for integers n >= 1. State whether it converges or diverges, and give the common ratio r of its geometric comparator r^n as a fraction."
            answer: "verdict = diverges; r = 3/2"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["converges"], ["diverges"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "r"}]}
            solution_sketch: "The full series has terms (3^n + n)/(2^n + 1). Step 1, dominant-term rule: the terms n and 1 are negligible against the exponentials, so the terms behave like 3^n/2^n = (3/2)^n. Step 2, geometric-series rule: a geometric series diverges when the common ratio has absolute value greater than 1, and r = 3/2 is greater than 1, so the option converges is wrong. The answer is verdict = diverges; r = 3/2."
        constraints: "comparator read off from dominant numerator/denominator terms; mixed polynomial-exponential allowed"
      - id: kp3
        name: Direct vs. limit comparison strategy
        key_prerequisites: [direct-comparison-test, sequences-convergence]
        exemplars:
          - problem: "Consider the series with terms 1/(sqrt(n)+sqrt(n+1)) for n from 1 to infinity. State its convergence behavior, and give the limit L in a limit comparison with the series with terms 1/sqrt(n)."
            answer: "verdict = diverges; L = 1/2"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["converges"], ["diverges"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "L"}]}
            solution_sketch: "The series is 1/(sqrt(n)+sqrt(n+1)) for n from 1 to infinity. For large n the denominator is about 2 sqrt(n), so a direct bound is awkward and limit comparison with the p-series 1/sqrt(n) is essential. The limit is L = limit of sqrt(n)/(sqrt(n)+sqrt(n+1)) = limit of 1/(1+sqrt(1+1/n)) = 1/2 by dividing numerator and denominator by sqrt(n). The p-series with p = 1/2 is less than 1, so the comparator diverges, and the given series diverges. A converges verdict would be the error of treating the sum of two radicals as a p-series with p = 3/2. Answer: verdict = diverges; L = 1/2."
          - problem: "Consider the series with terms 1/(n*2^n) for n from 1 to infinity. State its convergence behavior, and give the sum of the geometric comparator with terms 1/2^n that bounds it term by term."
            answer: "verdict = converges; bound = 1"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["converges"], ["diverges"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "bound"}]}
            solution_sketch: "The series is 1/(n*2^n) for n from 1 to infinity. For every n at least 1, 1/(n*2^n) is at most 1/2^n, so a direct comparison with the geometric series 1/2^n works. The geometric series has first term 1/2 and ratio 1/2, so its sum is (1/2)/(1 - 1/2) = 1. A diverges verdict would be the error of ignoring the exponential decay in 1/2^n. Answer: verdict = converges; bound = 1."
          - problem: "Consider the series with terms (n+2)/(n^2+3n) for n from 1 to infinity. State its convergence behavior, and give the limit L in a limit comparison with the series with terms 1/n."
            answer: "verdict = diverges; L = 1"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["converges"], ["diverges"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "L"}]}
            solution_sketch: "The series is (n+2)/(n^2+3n) for n from 1 to infinity. Use limit comparison with the harmonic series 1/n. The limit is L = limit of n(n+2)/(n^2+3n) = limit of (n^2+2n)/(n^2+3n) = 1. The harmonic series diverges, so the given series diverges. A converges verdict would be the error of treating the extra n in the denominator as a p-series with p = 2. Answer: verdict = diverges; L = 1."
          - problem: "Consider the series with terms 1/(n^(3/2)+1) for n from 1 to infinity. State its convergence behavior, and give the limit L in a limit comparison with the series with terms 1/n^(3/2)."
            answer: "verdict = converges; L = 1"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["converges"], ["diverges"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "L"}]}
            solution_sketch: "The series is 1/(n^(3/2)+1) for n from 1 to infinity. Use limit comparison with the p-series 1/n^(3/2). The limit is L = limit of n^(3/2)/(n^(3/2)+1) = 1. Since p = 3/2 is greater than 1, the comparator series converges, so the given series converges. A diverges verdict would be the error of using p = 1/2 from the exponent in the denominator. Answer: verdict = converges; L = 1."
          - problem: "Consider the series with terms (3n^2+1)/(n^4+5) for n from 1 to infinity. In a limit comparison with the series with terms 1/n^2, find the limit L."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The series is (3n^2+1)/(n^4+5) for n from 1 to infinity. The limit comparison ratio is ((3n^2+1)/(n^4+5)) / (1/n^2) = (3n^4+n^2)/(n^4+5). Divide numerator and denominator by n^4 to get L = 3. Answer: 3."
          - problem: "Consider the series with terms 1/(n*3^n) for n from 1 to infinity. Find the sum of the geometric series with terms 1/3^n that bounds it term by term."
            answer: "1/2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The series is 1/(n*3^n) for n from 1 to infinity. For every n at least 1, 1/(n*3^n) is at most 1/3^n, so the direct comparison bound is the geometric series 1/3^n. That geometric series has first term 1/3 and ratio 1/3, so its sum is (1/3)/(1 - 1/3) = 1/2. Answer: 1/2."
        constraints: "one problem where limit comparison is essential, one where a direct bound is quicker"
    diagnostic_exemplar:
      problem: 'Decide whether $\sum_{n=1}^{\infty} \frac{2n + 1}{n^3 + 4}$ converges. Name the test, comparator, and limit.'
      answer: 'converges (limit comparison with $\sum \frac{1}{n^2}$: $L = 2$)'
      answer_contract: {kind: none}
      solution_sketch: 'Dominant behavior $\frac{2n}{n^3} = \frac{2}{n^2}$; the ratio tends to $2 \in (0, \infty)$.'
    anki_seeds:
      - front: 'Limit comparison test: if $\lim a_n/b_n = L$ with $0 < L < \infty$, then...'
        back: '$\sum a_n$ and $\sum b_n$ both converge or both diverge'
        type: basic
      - front: "To pick a comparator series, keep only the..."
        back: "dominant term of the numerator and of the denominator"
        type: basic

  - id: ratio-test
    name: The Ratio Test
    core: true
    difficulty: 0.64
    drill: false
    answer_kind: numeric
    expected_time_secs: 150
    prerequisites:
      - id: geometric-series-convergence
        weight: 0.6
        key: true
      - id: sequences-convergence
        weight: 0.4
      - id: factorial-notation
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: Ratio test with factorials and exponentials
        key_prerequisites: [geometric-series-convergence, factorial-notation]
        exemplars:
          - problem: 'Use the ratio test on $\sum_{n=1}^{\infty} \frac{2^n}{n!}$.'
            answer: 'converges ($L = \lim \frac{2}{n+1} = 0 < 1$)'
            answer_contract: {kind: none}
            solution_sketch: '$\frac{a_{n+1}}{a_n} = \frac{2^{n+1} n!}{(n+1)!\, 2^n} = \frac{2}{n+1} \to 0$.'
          - problem: 'Use the ratio test on $\sum_{n=1}^{\infty} \frac{n!}{10^n}$.'
            answer: 'diverges ($L = \lim \frac{n+1}{10} = \infty$)'
            answer_contract: {kind: none}
            solution_sketch: 'Factorials beat exponentials; the ratio $\frac{n+1}{10}$ grows without bound.'
          - problem: 'Use the ratio test on $\sum_{n=1}^{\infty} \frac{n}{2^n}$.'
            answer: 'converges ($L = \frac{1}{2} < 1$)'
            answer_contract: {kind: none}
            solution_sketch: '$\frac{a_{n+1}}{a_n} = \frac{n+1}{2n} \to \frac{1}{2}$.'
        constraints: "terms built from n!, c^n, and powers of n; always state L and compare to 1"
      - id: kp2
        name: Simplifying the ratio
        key_prerequisites: [factorial-notation, sequences-convergence]
        exemplars:
          - problem: 'Simplify $\frac{(n+1)!}{(n-1)!}$.'
            answer: '$n(n+1)$'
            solution_sketch: '$(n+1)! = (n+1) \cdot n \cdot (n-1)!$.'
          - problem: "Use the ratio test on $\\sum_{n=1}^{\\infty} \\frac{3^n}{n\\,2^n}$. Give the convergence verdict and the limit $L$ of the ratio $a_{n+1}/a_n$."
            answer: "verdict = diverges; L = 3/2"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["converges"], ["diverges"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "L"}]}
            solution_sketch: "The ratio is $\\frac{a_{n+1}}{a_n} = \\frac{3^{n+1}}{(n+1)2^{n+1}} \\cdot \\frac{n 2^n}{3^n} = \\frac{3}{2} \\cdot \\frac{n}{n+1}$. Cancel the powers of 3 and 2 to get the simplified ratio. Then $L = \\lim_{n\\to\\infty} \\frac{3}{2} \\cdot \\frac{n}{n+1} = \\frac{3}{2}$. Since $L > 1$, the series diverges. The answer is verdict = diverges; L = 3/2."
          - problem: "Use the ratio test on $\\sum_{n=1}^{\\infty} \\frac{n!}{n^n}$. Give the convergence verdict and the limit $L$ of the ratio $a_{n+1}/a_n$."
            answer: "verdict = converges; L = 1/e"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["converges"], ["diverges"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "L"}]}
            solution_sketch: "The ratio is $\\frac{a_{n+1}}{a_n} = \\frac{(n+1)!}{(n+1)^{n+1}} \\cdot \\frac{n^n}{n!} = \\frac{(n+1)n^n}{(n+1)^{n+1}} = \\left(\\frac{n}{n+1}\\right)^n$. Cancel the factorials to get the simplified ratio. Then $L = \\lim_{n\\to\\infty} \\left(\\frac{n}{n+1}\\right)^n = e^{-1}$. Since $L < 1$, the series converges. The answer is verdict = converges; L = 1/e."
          - problem: "Use the ratio test on $\\sum_{n=1}^{\\infty} \\frac{n^2}{2^n}$. Find the limit $L$ of the ratio $a_{n+1}/a_n$."
            answer: "1/2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The ratio is $\\frac{a_{n+1}}{a_n} = \\frac{(n+1)^2}{2^{n+1}} \\cdot \\frac{2^n}{n^2} = \\frac{1}{2} \\cdot \\frac{(n+1)^2}{n^2}$. Cancel the powers of 2. Then $L = \\lim_{n\\to\\infty} \\frac{1}{2} \\left(1+\\frac{1}{n}\\right)^2 = \\frac{1}{2}$. The answer is 1/2."
          - problem: "Use the ratio test on $\\sum_{n=1}^{\\infty} \\frac{n^3}{3^n}$. Find the limit $L$ of the ratio $a_{n+1}/a_n$."
            answer: "1/3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The ratio is $\\frac{a_{n+1}}{a_n} = \\frac{(n+1)^3}{3^{n+1}} \\cdot \\frac{3^n}{n^3} = \\frac{1}{3} \\cdot \\frac{(n+1)^3}{n^3}$. Cancel the powers of 3. Then $L = \\lim_{n\\to\\infty} \\frac{1}{3} \\left(1+\\frac{1}{n}\\right)^3 = \\frac{1}{3}$. The answer is 1/3."
          - problem: "Use the ratio test on $\\sum_{n=1}^{\\infty} \\frac{4^n}{n^2\\,3^n}$. Give the convergence verdict and the limit $L$ of the ratio $a_{n+1}/a_n$."
            answer: "verdict = diverges; L = 4/3"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["converges"], ["diverges"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "L"}]}
            solution_sketch: "The ratio is $\\frac{a_{n+1}}{a_n} = \\frac{4^{n+1}}{(n+1)^2 3^{n+1}} \\cdot \\frac{n^2 3^n}{4^n} = \\frac{4}{3} \\cdot \\frac{n^2}{(n+1)^2}$. Cancel the powers of 4 and 3. Then $L = \\lim_{n\\to\\infty} \\frac{4}{3} \\left(\\frac{n}{n+1}\\right)^2 = \\frac{4}{3}$. Since $L > 1$, the series diverges. The answer is verdict = diverges; L = 4/3."
        constraints: "cancel factorials and exponentials fully before taking the limit; L may involve e"
      - id: kp3
        name: Mixed products
        key_prerequisites: [geometric-series-convergence, sequences-convergence]
        exemplars:
          - problem: "Use the ratio test on the series with terms $a_n = n^2/2^n$. State the verdict and find the exact value L."
            answer: "verdict = converges; L = 1/2"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["converges"], ["diverges"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "L"}]}
            solution_sketch: "Write the ratio a_{n+1}/a_n for the series with terms n^2/2^n. Simplify: the polynomial factor gives ((n+1)/n)^2 and the exponential factor gives 1/2, so the quotient is (1/2)(1+1/n)^2. Take the limit as n goes to infinity to get L = 1/2. The option diverges is wrong because L is less than 1, so the ratio test gives verdict = converges; L = 1/2."
          - problem: "Use the ratio test on the series with terms $a_n = (2n)!/(n!)^2$. State the verdict and find the exact value L."
            answer: "verdict = diverges; L = 4"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["converges"], ["diverges"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "L"}]}
            solution_sketch: "Write the ratio a_{n+1}/a_n for the series with terms (2n)!/(n!)^2. Simplify the factorials: (2n+2)(2n+1)/(n+1)^2. Take the limit as n goes to infinity to get L = 4. The option converges is wrong because L is greater than 1, so the ratio test gives verdict = diverges; L = 4."
          - problem: "Use the ratio test on the series with terms $a_n = (2n)!/(3^n (n!)^2)$. State the verdict and find the exact value L."
            answer: "verdict = diverges; L = 4/3"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["converges"], ["diverges"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "L"}]}
            solution_sketch: "Write the ratio a_{n+1}/a_n for the series with terms (2n)!/(3^n (n!)^2). Simplify: the factorial factors give (2n+2)(2n+1)/(n+1)^2 and the exponential factor gives 1/3, so the quotient is 2(2n+1)/(3(n+1)). Take the limit as n goes to infinity to get L = 4/3. The option converges is wrong because L is greater than 1, so the ratio test gives verdict = diverges; L = 4/3."
          - problem: "Use the ratio test on the series with terms $a_n = (3n)!/(n!)^3$. State the verdict and find the exact value L."
            answer: "verdict = diverges; L = 27"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["converges"], ["diverges"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "L"}]}
            solution_sketch: "Write the ratio a_{n+1}/a_n for the series with terms (3n)!/(n!)^3. Simplify the factorials: (3n+3)(3n+2)(3n+1)/(n+1)^3. Take the limit as n goes to infinity to get L = 27. The option converges is wrong because L is greater than 1, so the ratio test gives verdict = diverges; L = 27."
          - problem: "Use the ratio test on the series with terms $a_n = 2^n/n!$. Find the exact value L."
            answer: "0"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Write the ratio a_{n+1}/a_n for the series with terms 2^n/n!. Simplify: 2/(n+1). Take the limit as n goes to infinity; the ratio test limit is L = 0. The exact value is 0."
          - problem: "Use the ratio test on the series with terms $a_n = n^3/3^n$. Find the exact value L as a fraction."
            answer: "1/3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Write the ratio a_{n+1}/a_n for the series with terms n^3/3^n. Simplify: the polynomial factor gives ((n+1)/n)^3 and the exponential factor gives 1/3, so the quotient is (1/3)(1+1/n)^3. Take the limit as n goes to infinity to get L = 1/3. The exact value L is 1/3."
        constraints: "products of polynomial, exponential, and factorial factors; state L exactly"
    diagnostic_exemplar:
      problem: 'Use the ratio test on $\sum_{n=1}^{\infty} \frac{n^2 3^n}{n!}$.'
      answer: 'converges ($L = \lim \frac{3(n+1)}{n^2} = 0 < 1$)'
      answer_contract: {kind: none}
      solution_sketch: 'The ratio is $\frac{(n+1)^2 3^{n+1} n!}{n^2 3^n (n+1)!} = \frac{3(n+1)}{n^2} \to 0$.'
    anki_seeds:
      - front: 'Ratio test: with $L = \lim |a_{n+1}/a_n|$, the series converges when..., diverges when..., and when $L = 1$...'
        back: 'converges (absolutely) if $L < 1$; diverges if $L > 1$; inconclusive if $L = 1$'
        type: basic
      - front: "The ratio test shines on terms containing..."
        back: "factorials and n-th powers (exponentials)"
        type: basic

  - id: ratio-root-tests
    name: Ratio and Root Tests
    core: true
    difficulty: 0.65
    drill: false
    answer_kind: numeric
    expected_time_secs: 180
    prerequisites:
      - id: ratio-test
        weight: 0.8
        key: true
      - id: comparison-tests
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: Root test for nth-power terms
        key_prerequisites: [ratio-test]
        exemplars:
          - problem: "Use the root test on the series $\\sum_{n=1}^{\\infty} \\left(\\frac{n}{2n+1}\\right)^n$. State whether the series converges or diverges and give the limit $L = \\lim_{n\\to\\infty} (a_n)^{1/n}$."
            answer: "verdict = converges; L = 1/2"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["converges"], ["diverges"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "L"}]}
            solution_sketch: "Step 1: Write the full term $a_n = \\left(\\frac{n}{2n+1}\\right)^n$. Step 2: Apply the root test: the nth root removes the outer power, so $L = \\lim |a_n|^{1/n} = \\lim \\frac{n}{2n+1} = \\frac{1}{2}$ by dividing numerator and denominator by $n$. Step 3: Since $L = 1/2 < 1$, the root test gives convergence; the option diverges is wrong because it needs $L > 1$. The answer is verdict = converges; L = 1/2."
          - problem: "Use the root test on the series $\\sum_{n=1}^{\\infty} \\left(\\frac{3n+1}{2n+5}\\right)^n$. State whether the series converges or diverges and give the limit $L = \\lim_{n\\to\\infty} (a_n)^{1/n}$."
            answer: "verdict = diverges; L = 3/2"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["converges"], ["diverges"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "L"}]}
            solution_sketch: "Step 1: Write the full term $a_n = \\left(\\frac{3n+1}{2n+5}\\right)^n$. Step 2: Apply the root test: $L = \\lim |a_n|^{1/n} = \\lim \\frac{3n+1}{2n+5} = \\frac{3}{2}$ by dividing by $n$. Step 3: Since $L = 3/2 > 1$, the root test gives divergence; the option converges is wrong because it needs $L < 1$. The answer is verdict = diverges; L = 3/2."
          - problem: "Use the root test on the series $\\sum_{n=1}^{\\infty} \\left(1+\\frac{1}{n}\\right)^{-n^2}$. State whether the series converges or diverges and give the limit $L = \\lim_{n\\to\\infty} (a_n)^{1/n}$."
            answer: "verdict = converges; L = 1/e"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["converges"], ["diverges"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "L"}]}
            solution_sketch: "Step 1: Write the full term $a_n = \\left(1+\\frac{1}{n}\\right)^{-n^2}$. Step 2: Apply the root test: $L = \\lim |a_n|^{1/n} = \\lim \\left(1+\\frac{1}{n}\\right)^{-n} = e^{-1} = \\frac{1}{e}$, using the standard limit $(1+1/n)^n \\to e$. Step 3: Since $1/e < 1$, the root test gives convergence; the option diverges is wrong because $L < 1$. The answer is verdict = converges; L = 1/e."
          - problem: "Use the root test on the series $\\sum_{n=1}^{\\infty} \\left(\\frac{5n+2}{4n+3}\\right)^n$. Find the limit $L = \\lim_{n\\to\\infty} (a_n)^{1/n}$."
            answer: "5/4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: Write the full term $a_n = \\left(\\frac{5n+2}{4n+3}\\right)^n$. Step 2: Apply the root test: the nth root removes the outer power, so $L = \\lim \\frac{5n+2}{4n+3} = \\frac{5}{4}$ by dividing numerator and denominator by $n$. The answer is 5/4."
          - problem: "Use the root test on the series $\\sum_{n=1}^{\\infty} \\left(\\frac{n+1}{n}\\right)^{n^2}$. State whether the series converges or diverges and give the limit $L = \\lim_{n\\to\\infty} (a_n)^{1/n}$."
            answer: "verdict = diverges; L = e"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["converges"], ["diverges"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "L"}]}
            solution_sketch: "Step 1: Write the full term $a_n = \\left(\\frac{n+1}{n}\\right)^{n^2}$. Step 2: Apply the root test: $L = \\lim |a_n|^{1/n} = \\lim \\left(\\frac{n+1}{n}\\right)^{n} = \\lim \\left(1+\\frac{1}{n}\\right)^{n} = e$, the standard limit that defines $e$. Step 3: Since $L = e > 1$, the root test gives divergence; the option converges is wrong because it needs $L < 1$. The answer is verdict = diverges; L = e."
          - problem: "Use the root test on the series $\\sum_{n=1}^{\\infty} \\left(1+\\frac{2}{n}\\right)^{-n^2}$. Find the limit $L = \\lim_{n\\to\\infty} (a_n)^{1/n}$."
            answer: "1/e^2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: Write the full term $a_n = \\left(1+\\frac{2}{n}\\right)^{-n^2}$. Step 2: Apply the root test: $L = \\lim |a_n|^{1/n} = \\lim \\left(1+\\frac{2}{n}\\right)^{-n} = e^{-2} = \\frac{1}{e^2}$, using the standard limit $(1+c/n)^n \\to e^c$ with $c = -2$. The answer is 1/e^2."
        constraints: "a_n is an explicit nth power; L may involve e"
      - id: kp2
        name: The inconclusive case L = 1
        key_prerequisites: [ratio-test, comparison-tests]
        exemplars:
          - problem: "Consider the series sum from n=1 to infinity of 1/n^2. Apply the ratio test, then use a second test to decide the behavior of the series. Give the verdict and the value of p."
            answer: "verdict = converges; p = 2"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["converges"], ["diverges"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "p"}]}
            solution_sketch: "Ratio test: a_n = 1/n^2. Then a_{n+1}/a_n = n^2/(n+1)^2, which tends to 1. So L = 1, and the ratio test is inconclusive. The p-series test with p = 2 > 1 shows the series converges. The option diverges is wrong because the p-series converges. The answer is verdict = converges; p = 2."
          - problem: "Consider the series sum from n=1 to infinity of n^n/n!. Apply the ratio test to find the limit L. Give the verdict and the value of L."
            answer: "verdict = diverges; L = e"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["converges"], ["diverges"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "L"}]}
            solution_sketch: "Ratio test: a_n = n^n/n!. The ratio a_{n+1}/a_n = ((n+1)^(n+1)/(n+1)!)/(n^n/n!) = ((n+1)/n)^n, which tends to e. So L = e > 1, and the ratio test shows the series diverges. The option converges is wrong because L > 1. The answer is verdict = diverges; L = e."
          - problem: "Consider the series sum from n=1 to infinity of 1/n^3. Apply the ratio test, then use a second test to decide the behavior of the series. Give the verdict and the value of p."
            answer: "verdict = converges; p = 3"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["converges"], ["diverges"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "p"}]}
            solution_sketch: "Ratio test: a_n = 1/n^3. Then a_{n+1}/a_n = n^3/(n+1)^3, which tends to 1. So L = 1, and the ratio test is inconclusive. The p-series test with p = 3 > 1 shows the series converges. The option diverges is wrong because the p-series converges. The answer is verdict = converges; p = 3."
          - problem: "Consider the series sum from n=1 to infinity of 1/sqrt(n). Apply the ratio test, then use a second test to decide the behavior of the series. Give the verdict and the value of p."
            answer: "verdict = diverges; p = 1/2"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["converges"], ["diverges"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "p"}]}
            solution_sketch: "Ratio test: a_n = 1/sqrt(n). Then a_{n+1}/a_n = sqrt(n)/sqrt(n+1), which tends to 1. So L = 1, and the ratio test is inconclusive. The p-series test with p = 1/2 <= 1 shows the series diverges. The option converges is wrong because p <= 1. The answer is verdict = diverges; p = 1/2."
          - problem: "Consider the series sum from n=1 to infinity of 1/(n^2+1). Apply the ratio test. Then use the limit comparison test with the series sum 1/n^2. Give the limit C of the ratio of the terms."
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Ratio test: a_n = 1/(n^2+1). The ratio a_{n+1}/a_n = (n^2+1)/((n+1)^2+1), which tends to 1. So L = 1, and the ratio test is inconclusive. Limit comparison with b_n = 1/n^2: the limit of a_n/b_n = n^2/(n^2+1) tends to 1. The answer is 1."
          - problem: "Consider the series sum from n=1 to infinity of 1/(n+1). Apply the ratio test. Then use the limit comparison test with the harmonic series sum 1/n. Give the limit C of the ratio of the terms."
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Ratio test: a_n = 1/(n+1). The ratio a_{n+1}/a_n = (n+1)/(n+2), which tends to 1. So L = 1, and the ratio test is inconclusive. Limit comparison with b_n = 1/n: the limit of a_n/b_n = n/(n+1) tends to 1. The answer is 1."
        constraints: "include at least one L = 1 case per set; resolution must invoke another test"
      - id: kp3
        name: Choosing between ratio and root
        key_prerequisites: [ratio-test, comparison-tests]
        exemplars:
