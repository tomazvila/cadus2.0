  - id: alternating-series-test
    name: The Alternating Series Test
    core: true
    difficulty: 0.63
    drill: false
    answer_kind: numeric
    expected_time_secs: 120
    prerequisites:
      - id: nth-term-divergence-test
        weight: 0.6
        key: true
      - id: sequences-convergence
        weight: 0.5
      - id: derivatives-natural-log
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: Applying the alternating series test
        key_prerequisites: [nth-term-divergence-test, sequences-convergence]
        exemplars:
          - problem: "For the alternating series $\\sum_{n=1}^{\\infty} \\frac{(-1)^{n+1}}{n}$, let $b_n = \\frac{1}{n}$. State the behavior of the series, and give the limit of $b_n$."
            answer: "verdict = converges; L = 0"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["converges"], ["diverges"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "L"}]}
            solution_sketch: "The series is $\\sum_{n=1}^{\\infty} (-1)^{n+1}/n$ with $b_n = 1/n$. Step 1: $b_n > 0$ for all $n$, so the first hypothesis holds. Step 2: $b_{n+1} = 1/(n+1) < 1/n = b_n$, so the sequence decreases. Step 3: the limit of $b_n$ is $0$. The alternating series test applies, so the series converges. The wrong option diverges comes from ignoring that the terms decrease to zero. The answer is verdict = converges; L = 0."
          - problem: "For the alternating series $\\sum_{n=1}^{\\infty} \\frac{(-1)^n}{\\sqrt{n}}$, let $b_n = \\frac{1}{\\sqrt{n}}$. State the behavior of the series, and give the limit of $b_n$."
            answer: "behavior = converges; limit = 0"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["converges"], ["diverges"]]}, "name": "behavior"}, {"contract": {"kind": "exact"}, "name": "limit"}]}
            solution_sketch: "The series is $\\sum_{n=1}^{\\infty} (-1)^n/\\sqrt{n}$ with $b_n = 1/\\sqrt{n}$. Step 1: $b_n > 0$. Step 2: $b_n$ decreases because $\\sqrt{n}$ increases. Step 3: $1/\\sqrt{n} \\to 0$. The alternating series test gives convergence. The wrong option diverges would ignore the decreasing limit. The answer is behavior = converges; limit = 0."
          - problem: "For the alternating series $\\sum_{n=1}^{\\infty} \\frac{(-1)^{n+1}}{2n+1}$, let $b_n = \\frac{1}{2n+1}$. State the behavior of the series, and give the limit of $b_n$."
            answer: "result = converges; lim = 0"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["converges"], ["diverges"]]}, "name": "result"}, {"contract": {"kind": "exact"}, "name": "lim"}]}
            solution_sketch: "The series is $\\sum_{n=1}^{\\infty} (-1)^{n+1}/(2n+1)$ with $b_n = 1/(2n+1)$. Step 1: $b_n > 0$. Step 2: $2n+1$ increases, so $b_n$ decreases. Step 3: $b_n \\to 0$. By the alternating series test the series converges. The wrong option diverges comes from missing the limit zero. The answer is result = converges; lim = 0."
          - problem: "For the alternating series $\\sum_{n=1}^{\\infty} (-1)^{n+1} \\left(1 + \\frac{1}{n}\\right)$, let $b_n = 1 + \\frac{1}{n}$. State the behavior of the series, and give the limit of $b_n$."
            answer: "verdict = diverges; L = 1"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["converges"], ["diverges"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "L"}]}
            solution_sketch: "The series is $\\sum_{n=1}^{\\infty} (-1)^{n+1}(1 + 1/n)$ with $b_n = 1 + 1/n$. Step 1: $b_n > 0$. Step 2: $b_n$ decreases to $1$. Step 3: the limit of $b_n$ is $1$, not $0$, so the alternating series test fails. The nth-term divergence test then gives divergence. The wrong option converges would ignore the nonzero limit. The answer is verdict = diverges; L = 1."
          - problem: "For the alternating series $\\sum_{n=1}^{\\infty} (-1)^n \\frac{n+1}{2n+1}$, let $b_n = \\frac{n+1}{2n+1}$. Find the limit of $b_n$."
            answer: "1/2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The series is $\\sum_{n=1}^{\\infty} (-1)^n (n+1)/(2n+1)$ with $b_n = (n+1)/(2n+1)$. Step 1: $b_n > 0$ for all $n$. Step 2: $b_n$ decreases to $1/2$ because the ratio of leading coefficients is $1/2$. Step 3: the limit of $b_n$ is $1/2$. The answer is 1/2."
          - problem: "For the alternating series $\\sum_{n=1}^{\\infty} (-1)^{n+1} \\left(2 + \\frac{1}{n}\\right)$, let $b_n = 2 + \\frac{1}{n}$. Find the limit of $b_n$."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The series is $\\sum_{n=1}^{\\infty} (-1)^{n+1}(2 + 1/n)$ with $b_n = 2 + 1/n$. Step 1: $b_n > 0$. Step 2: $b_n$ decreases to $2$ as $1/n \\to 0$. Step 3: the limit of $b_n$ is $2$. The answer is 2."
        constraints: "b_n is a simple decreasing rational or radical expression; cite both hypotheses"
      - id: kp2
        name: Checking the hypotheses
        key_prerequisites: [nth-term-divergence-test, sequences-convergence]
        exemplars:
          - problem: "Consider the alternating series $\\sum_{n=1}^{\\infty} (-1)^n \\frac{4n+1}{4n+5}$ and write $b_n = \\frac{4n+1}{4n+5}$. Check both AST hypotheses: whether $b_n$ decreases and whether $b_n$ tends to $0$. Find $L = \\lim_{n \\to \\infty} b_n$."
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Write $b_n = (4n+1)/(4n+5)$ and check the two hypotheses of the alternating series test. Decreasing check by the derivative rule: $d/dx\\,(4x+1)/(4x+5) = 16/(4x+5)^2 > 0$, so $b_n$ increases and the decreasing hypothesis fails. Limit check by dividing numerator and denominator by $n$: $b_n = 1 - 4/(4n+5) \\to 1 \\ne 0$, so the nth-term divergence test shows divergence and the AST cannot be used. The answer is 1."
          - problem: "Consider the alternating series $\\sum_{n=1}^{\\infty} (-1)^n \\frac{3}{2n+1}$ with $b_n = \\frac{3}{2n+1}$. Check both AST hypotheses: whether $b_n$ decreases and whether $b_n$ tends to $0$. Find $L = \\lim_{n \\to \\infty} b_n$."
            answer: "0"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Write $b_n = 3/(2n+1)$. Decreasing check by the derivative rule: $d/dx\\, 3/(2x+1) = -6/(2x+1)^2 < 0$, so $b_n$ decreases for every $n$. Limit check: $3/(2n+1)$ tends to $0$ as $n$ grows. Both hypotheses of the alternating series test hold, so the series converges by the AST. The answer is 0."
          - problem: "The alternating series $\\sum_{n=1}^{\\infty} (-1)^n \\frac{3n+2}{4n+3}$ has term sizes $b_n = \\frac{3n+2}{4n+3}$. Check both AST hypotheses: whether $b_n$ decreases and whether $b_n$ tends to $0$. Find $L = \\lim_{n \\to \\infty} b_n$."
            answer: "3/4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Write $b_n = (3n+2)/(4n+3)$. Decreasing check by the quotient rule: $d/dx\\,(3x+2)/(4x+3) = 1/(4x+3)^2 > 0$, so $b_n$ increases and the decreasing hypothesis fails. Limit check by dividing numerator and denominator by $n$: the terms tend to $3/4$, which is not $0$, so the nth-term divergence test applies. The answer is 3/4."
          - problem: "The alternating series $\\sum_{n=1}^{\\infty} (-1)^n \\frac{n}{n^2+9}$ has $b_n = \\frac{n}{n^2+9}$, and $b_n$ tends to $0$. Check the decreasing hypothesis with the derivative of $\\frac{x}{x^2+9}$. Find the smallest integer $N$ such that $b_n$ decreases for all $n \\ge N$."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "For $b_n = n/(n^2+9)$ the limit hypothesis holds, so only the decreasing hypothesis is in question. Derivative check: $d/dx\\, x/(x^2+9) = (9 - x^2)/(x^2+9)^2$, which is positive for $x < 3$ and negative for $x > 3$. Value check: $b_2 = 2/13 \\approx 0.154$ and $b_3 = 3/18 \\approx 0.167$, so the sequence still rises between $n = 2$ and $n = 3$, while $b_3 > b_4 = 4/25$ and it falls from $n = 3$ on. The answer is 3."
          - problem: "The alternating series $\\sum_{n=2}^{\\infty} (-1)^n \\frac{\\ln n}{n^2}$ has $b_n = \\frac{\\ln n}{n^2}$. Check the decreasing hypothesis with the derivative of $\\frac{\\ln x}{x^2}$. Find the smallest integer $N$ such that $b_n$ decreases for all $n \\ge N$."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "For $b_n = \\ln(n)/n^2$ use the derivative rule for $\\ln$: $d/dx\\, \\ln(x)/x^2 = (1 - 2\\ln x)/x^3$, which is negative once $\\ln x > 1/2$, that is for $x > \\sqrt{e} \\approx 1.65$. Value check: $b_1 = 0 < b_2 = \\ln 2/4$, so the sequence does not decrease from $n = 1$, while $b_2 > b_3 = \\ln 3/9$ and the sequence falls from $n = 2$ on. The limit hypothesis also holds since $\\ln(n)/n^2 \\to 0$. The answer is 2."
          - problem: "Consider the alternating series $\\sum_{n=1}^{\\infty} (-1)^n \\frac{2^n}{2^n+7}$ and write $b_n = \\frac{2^n}{2^n+7}$. Check both AST hypotheses: whether $b_n$ decreases and whether $b_n$ tends to $0$. Find $L = \\lim_{n \\to \\infty} b_n$."
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Write $b_n = 2^n/(2^n+7)$. Limit check by dividing numerator and denominator by $2^n$: $b_n = 1/(1 + 7/2^n) \\to 1$, which is not $0$, so the nth-term divergence test shows divergence. Decreasing check by the derivative rule: $d/dx\\, 2^x/(2^x+7) = 7 \\ln(2)\\, 2^x/(2^x+7)^2 > 0$, so $b_n$ increases and the decreasing hypothesis also fails. The answer is 1."
        constraints: "check both AST hypotheses explicitly; include a term-test failure case"
    diagnostic_exemplar:
      problem: 'Does $\sum_{n=1}^{\infty} (-1)^n \frac{n}{2n + 1}$ converge? Name the test that decides it.'
      answer: 'no: $|a_n| \to \frac12 \ne 0$, so the alternating series test does not apply and the series diverges by the term test'
      answer_contract: {kind: none}
      solution_sketch: 'The AST needs terms decreasing to $0$; here they approach $\frac12$, so the hypothesis fails and divergence follows from the $n$-th term test.'
    anki_seeds:
      - front: "Alternating series test hypotheses on b_n?"
        back: '$b_n > 0$, $b_n$ decreasing, and $b_n \to 0$'
        type: basic
      - front: "Before reaching for the AST on an alternating series, first check..."
        back: "whether the terms even tend to 0 (if not, it diverges by the term test)"
        type: basic

  - id: alternating-series
    name: Alternating Series and Conditional Convergence
    core: true
    difficulty: 0.7
    drill: false
    answer_kind: numeric
    expected_time_secs: 180
    prerequisites:
      - id: alternating-series-test
        weight: 0.8
        key: true
      - id: comparison-tests
        weight: 0.5
        key: true
      - id: integral-p-series-tests
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: Absolute convergence
        key_prerequisites: [comparison-tests, integral-p-series-tests]
        exemplars:
          - problem: "Consider the alternating series $\\sum_{n=1}^\\infty (-1)^{n+1}/n^4$. Taking absolute values gives the p-series $\\sum 1/n^p$. State whether this p-series converges, and give its exponent $p$."
            answer: "verdict = converges; p = 4"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["converges"], ["diverges"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "p"}]}
            solution_sketch: "Step 1: take absolute values of the terms of sum (-1)^(n+1)/n^4, which gives the absolute series sum 1/n^4. Step 2: by the p-series test, sum 1/n^4 is a p-series with exponent p = 4, and since p = 4 > 1 it converges. The option diverges is the error of treating the exponent 4 as if it were at most 1. So verdict = converges and p = 4."
          - problem: "Consider the series $\\sum_{n=1}^\\infty \\sin(n)/n^3$, whose terms follow no alternating sign pattern. Its absolute series satisfies $|\\sin(n)|/n^3 \\le 1/n^p$ for the comparison p-series $\\sum 1/n^p$. State whether the absolute series converges by this comparison, and give the exponent $p$."
            answer: "verdict = converges; p = 3"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["converges"], ["diverges"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "p"}]}
            solution_sketch: "Step 1: take absolute values, giving the series sum of |sin(n)|/n^3. Step 2: since |sin(n)| <= 1, direct comparison gives |sin(n)|/n^3 <= 1/n^3 for every n. Step 3: sum 1/n^3 is a p-series with p = 3 > 1, so it converges, and the absolute series converges by direct comparison. The option diverges is the error of thinking the irregular sign of sin(n) blocks the comparison. So verdict = converges and p = 3."
          - problem: "Consider the alternating series $\\sum_{n=1}^\\infty (-1)^n/n^6$. Take absolute values of the terms to form the absolute series, which is a p-series. Find the exponent $p$ of the resulting p-series."
            answer: "6"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: take absolute values of (-1)^n/n^6, which removes the sign and gives the absolute series sum 1/n^6. Step 2: this absolute series is a p-series of the form sum 1/n^p, so reading off the power of n gives the exponent by the p-series form. The exponent p of the resulting p-series is 6."
          - problem: "Consider the alternating series $\\sum_{n=1}^\\infty (-1)^{n+1}/(n^2+3n)$. Its absolute series satisfies $1/(n^2+3n) < 1/n^p$ for every $n \\ge 1$. Find the smallest integer $p$ such that the comparison series $\\sum 1/n^p$ converges."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: take absolute values to get the series sum 1/(n^2+3n). Step 2: since n^2+3n > n^2, direct comparison gives 1/(n^2+3n) < 1/n^2 for all n >= 1. Step 3: sum 1/n^2 is a convergent p-series with p = 2 > 1, so p = 2 works; p = 1 fails because sum 1/n diverges by the p-series test. The smallest integer p is 2."
          - problem: "Consider the alternating series $\\sum_{n=1}^\\infty (-1)^{n+1}/(n+2)$. For $n \\ge 2$ its absolute terms satisfy $1/(n+2) > 1/(2n)$, and $\\sum 1/(2n)$ is a constant multiple of the p-series $\\sum 1/n^p$. State whether the absolute series converges by this comparison, and give the exponent $p$."
            answer: "verdict = diverges; p = 1"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["converges"], ["diverges"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "p"}]}
            solution_sketch: "Step 1: take absolute values to get the series sum 1/(n+2). Step 2: for n >= 2, direct comparison gives 1/(n+2) > 1/(2n), and sum 1/(2n) is one half times the p-series sum 1/n with p = 1, which diverges, so the absolute series diverges. The option converges is the error of comparing with the convergent p-series sum 1/n^2 instead of the harmonic p-series. So verdict = diverges and p = 1."
          - problem: "The absolute series of the alternating series $\\sum_{n=1}^\\infty (-1)^n/\\sqrt{n^3}$ is the p-series $\\sum 1/n^p$. Give the exponent $p$ as a fraction."
            answer: "3/2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: take absolute values of (-1)^n/sqrt(n^3), which gives the absolute series sum 1/sqrt(n^3). Step 2: rewrite sqrt(n^3) as n^(3/2), so the absolute series is sum 1/n^(3/2), a p-series by the p-series form. The exponent p is 3/2."
        constraints: "absolute series handled by a p-series or a direct comparison; use one non-alternating sign pattern"
      - id: kp2
        name: The three-way classification
        key_prerequisites: [alternating-series-test, comparison-tests]
        exemplars:
          - problem: "For the series $\\sum_{n=1}^{\\infty} \\frac{(-1)^{n+1}}{n}$, classify it using 1 for absolutely convergent, 2 for conditionally convergent, and 3 for divergent. Give the code and the exponent p of the p-series formed by its terms."
            answer: "code = 2; p = 1"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "code"}, {"contract": {"kind": "exact"}, "name": "p"}]}
            solution_sketch: "Step 1: Write the full series as sum (-1)^{n+1}/n. Step 2: Apply the alternating series test: 1/n decreases to 0, so the series converges. Step 3: Apply the p-series test to the absolute series sum 1/n, a p-series with p = 1, which diverges because p <= 1. Step 4: Convergent but not absolutely convergent means conditionally convergent, so the code is 2. The answer is code = 2; p = 1."
          - problem: "For the series $\\sum_{n=1}^{\\infty} \\frac{(-1)^n}{\\sqrt{n}}$, classify it using 1 for absolutely convergent, 2 for conditionally convergent, and 3 for divergent. Give the code and the exponent p of the p-series formed by its terms."
            answer: "code = 2; p = 1/2"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "code"}, {"contract": {"kind": "exact"}, "name": "p"}]}
            solution_sketch: "Step 1: Write the full series as sum (-1)^n n^{-1/2}. Step 2: The alternating series test applies because n^{-1/2} decreases to 0, so the series converges. Step 3: Apply the p-series test to the absolute series sum n^{-1/2}: it has p = 1/2 <= 1, so it diverges. Step 4: Convergent but not absolutely gives conditionally convergent, code 2. The answer is code = 2; p = 1/2."
          - problem: "For the series $\\sum_{n=1}^{\\infty} (-1)^n \\left(\\frac{2}{3}\\right)^n$, classify it using 1 for absolutely convergent, 2 for conditionally convergent, and 3 for divergent. Give the code and the positive ratio r of the geometric series formed from the absolute values of the terms."
            answer: "code = 1; r = 2/3"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "code"}, {"contract": {"kind": "exact"}, "name": "r"}]}
            solution_sketch: "Step 1: Write the full series as sum (-1)^n (2/3)^n. Step 2: Take absolute values of the terms: they form the geometric series sum (2/3)^n with positive ratio r = 2/3. Step 3: The geometric series test gives convergence because |r| < 1. Step 4: The absolute series converges, so the series is absolutely convergent and the code is 1. The answer is code = 1; r = 2/3."
          - problem: "For the series $\\sum_{n=1}^{\\infty} \\frac{(-1)^{n+1}}{n^3}$, classify it using 1 for absolutely convergent, 2 for conditionally convergent, and 3 for divergent. Give the code and the exponent p of the p-series formed by its terms."
            answer: "code = 1; p = 3"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "code"}, {"contract": {"kind": "exact"}, "name": "p"}]}
            solution_sketch: "Step 1: Write the full series as sum (-1)^{n+1} n^{-3}. Step 2: Apply the p-series test to the absolute series sum 1/n^3: p = 3 > 1, so the absolute series converges. Step 3: An alternating series whose absolute series converges is absolutely convergent, so the code is 1. The answer is code = 1; p = 3."
          - problem: "For the series $\\sum_{n=1}^{\\infty} (-1)^n 3^n$, classify it using 1 for absolutely convergent, 2 for conditionally convergent, and 3 for divergent. Give the code and the positive ratio r of the geometric series formed from the absolute values of the terms."
