            solution_sketch: "The full series is sum (-1)^n (n+1)/n. Step 1: use the alternating series test. The magnitude is b_n = (n+1)/n = 1 + 1/n. Step 2: compute the limit L = lim (1 + 1/n) = 1. Step 3: since the limit is not 0, the terms do not go to 0, so the series diverges. The verdict is diverges and L = 1, so verdict = diverges; L = 1. Choosing converges would ignore that the terms do not go to 0."
