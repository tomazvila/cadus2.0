            solution_sketch: "The series is $\\sum_{n=1}^{\\infty} (n!)^2/(2n)!$. The ratio test is the natural rule because factorials appear. Compute $a_{n+1}/a_n = (n+1)^2/((2n+2)(2n+1))$. The limit is $L = 1/4$. Since $1/4 < 1$, the ratio test gives convergence. The option diverges is wrong because $L = 1/4 < 1$ rules out divergence. So verdict = converges; L = 1/4."
          - problem: "For the series $\\sum_{n=1}^{\\infty} \\left(\\frac{2n+1}{3n+4}\\right)^n$, decide whether the ratio test or the root test is natural, and find the limit $L$ that the natural test gives. Give $L$."
            answer: "2/3"
