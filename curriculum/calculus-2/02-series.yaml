            solution_sketch: "The series is $\\sum_{n=1}^{\\infty} ((2n+1)/(3n+4))^n$. The root test is the natural rule because $a_n$ is an $n$th power. Compute $L = \\lim ((2n+1)/(3n+4)) = 2/3$. The limit is 2/3."
          - problem: "For the series $\\sum_{n=1}^{\\infty} \\frac{5^n}{n!}$, decide whether the ratio test or the root test is natural, and find the limit $L$ that the natural test gives. Give $L$."
            answer: "0"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The series is $\\sum_{n=1}^{\\infty} 5^n/n!$. The ratio test is the natural rule because the factorial appears. Compute $L = \\lim 5/(n+1) = 0$. The limit is 0."
        constraints: "root test when a_n is an nth power; ratio test when factorials appear; verdicts state L"
