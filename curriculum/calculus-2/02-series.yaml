            solution_sketch: "Step 1: The series is sum 1/(n^3+2). Its terms are positive. Step 2 (termwise bound): 1/(n^3+2) <= 1/n^3 for all n >= 1 because n^3 <= n^3+2. Step 3 (p-series test): the p-series with p=3 converges. Step 4 (direct comparison): the original series converges. So verdict = converges; p = 3."
          - problem: "The series sum_{n=1}^\\infty sqrt(n)/(n^3+1) has positive terms. Use the direct comparison test with a convergent p-series. State the verdict and give the exponent p of the bounding p-series."
