            solution_sketch: "The series is $\\sum_{n=1}^{\\infty} n! 4^n/n^n$. The ratio test is the natural rule because the factorial appears. Compute $a_{n+1}/a_n = 4(n/(n+1))^n$. The limit is $L = 4/e$. Since $4/e > 1$, the ratio test gives divergence. The option converges is wrong because $L = 4/e > 1$ rules out convergence. So verdict = diverges; L = 4/e."
          - problem: "Consider the series $\\sum_{n=1}^{\\infty} \\left(\\frac{3n}{2n+1}\\right)^n$. Apply the natural test, and state the verdict together with the limit $L$. State the verdict and $L$."
            answer: "verdict = diverges; L = 3/2"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["converges"], ["diverges"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "L"}]}
            solution_sketch: "The series is $\\sum_{n=1}^{\\infty} (3n/(2n+1))^n$. The root test is the natural rule because $a_n$ is an $n$th power. Compute $L = \\lim |a_n|^{1/n} = \\lim 3n/(2n+1) = 3/2$. Since $3/2 > 1$, the root test gives divergence. The option converges is wrong because $L = 3/2 > 1$ rules out convergence. So verdict = diverges; L = 3/2."
          - problem: "Consider the series $\\sum_{n=1}^{\\infty} \\frac{(n!)^2}{(2n)!}$. Apply the natural test, and state the verdict together with the limit $L$. State the verdict and $L$."
