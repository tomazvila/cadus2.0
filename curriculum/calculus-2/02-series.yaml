        key_prerequisites: [comparison-tests, integral-p-series-tests]
        step_check:
          step: 'so the original series converges absolutely, and therefore it converges'
          question: 'Why does convergence of the absolute series show that the original series converges?'
          options:
            - 'The absolute series is a $p$-series, and every series next to a convergent $p$-series converges'
            - 'Taking absolute values never changes the sum, so the two series have the same sum'
            - 'Absolute convergence always implies convergence, because the signs cannot make the sum diverge'
          answer: 'Absolute convergence always implies convergence, because the signs cannot make the sum diverge'
          why: 'If $\sum|a_n|$ converges, then $\sum a_n$ converges too, because the negative terms cannot push the partial sums off to infinity.'
        exemplars:
          - problem: 'Does $\sum_{n=1}^{\infty}\frac{(-1)^{n+1}}{n^4}$ converge absolutely?'
            answer: 'yes'
            answer_contract: {"kind": "label", "options": [["yes", "it converges", "converges", "convergent", "yes, it converges", "yes it converges"], ["no", "it diverges", "diverges", "divergent", "no, it diverges", "no it diverges"]]}
            solution_sketch: 'Taking absolute values gives $\sum\frac{1}{n^4}$, a $p$-series with $p=4>1$. It converges, so the original series converges absolutely.'
          - problem: 'Replace each term of $\sum_{n=1}^{\infty}\frac{(-1)^n}{\sqrt{n^3}}$ by its absolute value. The result is a $p$-series. What is $p$?'
            answer: '3/2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Since $\sqrt{n^3}=n^{3/2}$, the absolute series is $\sum\frac{1}{n^{3/2}}$. So $p=\frac32$, and as $\frac32>1$ the absolute series converges.'
          - problem: 'To show that $\sum_{n=1}^{\infty}\frac{(-1)^{n+1}}{n^2+3n}$ converges absolutely, compare $\frac{1}{n^2+3n}$ with $\frac{1}{n^p}$. Find the integer $p$ for which $\frac{1}{n^2+3n}\le\frac{1}{n^p}$ for every $n\ge1$ and $\sum\frac{1}{n^p}$ converges.'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The comparison $\frac{1}{n^2+3n}\le\frac{1}{n^p}$ needs $n^p\le n^2+3n$. For $p=3$ this fails at $n=3$, since $27>18$. For $p=1$ it holds, but $\sum\frac1n$ diverges. For $p=2$ it holds and $\sum\frac{1}{n^2}$ converges, so $p=2$.'
          - problem: 'Does $\sum_{n=1}^{\infty}\frac{(-1)^{n+1}}{n+2}$ converge absolutely?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "it converges", "converges", "convergent", "yes, it converges", "yes it converges"], ["no", "it diverges", "diverges", "divergent", "no, it diverges", "no it diverges"]]}
            solution_sketch: 'The absolute series is $\sum\frac{1}{n+2}$. For $n\ge2$, $\frac{1}{n+2}\ge\frac{1}{2n}$, and $\sum\frac{1}{2n}$ is a constant multiple of the harmonic series, which diverges. So the absolute series diverges, and the series does not converge absolutely.'
          - problem: 'The series $\sum_{n=1}^{\infty}(-1)^n\left(\frac34\right)^n$ converges absolutely. Find the sum of its absolute series $\sum_{n=1}^{\infty}\left(\frac34\right)^n$.'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The absolute series is geometric with first term $\frac34$ and ratio $\frac34$. Its sum is $\frac{3/4}{1-3/4}=3$.'
          - problem: 'A bug walks along a line, alternately east and west. Walk $k$ is $\left(\frac37\right)^k$ m long. How far does the bug walk in total if it keeps going forever?'
            answer: '3/4'
            answer_contract: {"kind": "unit", "quantity": "length", "unit": "m", "allow_omitted": true}
            solution_sketch: 'The total distance is $\sum_{k\ge1}\left(\frac37\right)^k$, a geometric series with first term $\frac37$ and ratio $\frac37$. Its sum is $\frac{3/7}{1-3/7}=\frac34$ m.'
          - problem: 'A bug walks along a line. Walk $k$ is $\left(\frac37\right)^k$ m long, east when $k$ is odd and west when $k$ is even. How far east of its starting point does the bug end up if it keeps going forever?'
            answer: '3/10'
            answer_contract: {"kind": "unit", "quantity": "length", "unit": "m", "allow_omitted": true}
            solution_sketch: 'The signed walks form $\sum_{k\ge1}(-1)^{k+1}\left(\frac37\right)^k$, a geometric series with first term $\frac37$ and ratio $-\frac37$. Its sum is $\frac{3/7}{1+3/7}=\frac{3}{10}$ m. This is less than the $\frac34$ m it walks in total.'
          - problem: 'The terms of $\sum_{n=1}^{\infty}\frac{\cos n}{n^{5/2}}$ change sign irregularly. Since $|\cos n|\le1$, the absolute series is bounded term by term by a $p$-series $\sum\frac{1}{n^p}$. Find $p$.'
            answer: '5/2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'We have $\frac{|\cos n|}{n^{5/2}}\le\frac{1}{n^{5/2}}$ for every $n$. So the comparison series is $\sum\frac{1}{n^{5/2}}$, with $p=\frac52>1$. It converges, so the series converges absolutely.'
        constraints: 'absolute series handled by a p-series, a geometric series or a direct comparison; contexts with total distance versus net displacement; at most two label items'
      - id: kp2
        name: The three-way classification
        key_prerequisites: [alternating-series-test, comparison-tests]
        step_check:
          step: 'so the original series is not absolutely convergent'
          question: 'Why is the Alternating Series Test still needed after this step?'
          options:
            - 'A divergent absolute series still allows the original series to converge'
            - 'A divergent absolute series means the original series must diverge as well'
            - 'The test is needed to find the exponent $p$ of the absolute series'
          answer: 'A divergent absolute series still allows the original series to converge'
          why: 'The original series can converge even when $\sum|a_n|$ diverges. The test decides whether it does.'
        exemplars:
          - problem: 'Classify $\sum_{n=1}^{\infty}\frac{(-1)^{n+1}}{n}$ as absolutely convergent, conditionally convergent, or divergent.'
            answer: 'conditionally convergent'
            answer_contract: {"kind": "label", "options": [["absolutely convergent", "absolutely", "converges absolutely", "absolute convergence", "absolute"], ["conditionally convergent", "conditionally", "converges conditionally", "conditional convergence", "conditional"], ["divergent", "diverges", "it diverges", "the series diverges", "not convergent"]]}
            solution_sketch: 'The absolute series is $\sum\frac1n$, the harmonic series, which diverges. The sizes $\frac1n$ decrease to $0$, so the alternating series test shows the series converges. It converges but not absolutely, so it is conditionally convergent.'
          - problem: 'A bug walks along a line, alternately east and west, and walk $k$ is $\frac{1}{k^p}$ m long for some $p>0$. The bug''s position settles for every $p>0$, but its total walking distance is infinite for $0<p\le p_0$ and finite for $p>p_0$. Find $p_0$.'
            answer: '1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The total distance is the $p$-series $\sum\frac{1}{k^p}$, which diverges for $p\le1$ and converges for $p>1$. So $p_0=1$. The position settles for every $p>0$ by the alternating series test.'
          - problem: 'Classify $\sum_{n=1}^{\infty}(-1)^n\frac{3n+1}{n+2}$ as absolutely convergent, conditionally convergent, or divergent.'
            answer: 'divergent'
            answer_contract: {"kind": "label", "options": [["absolutely convergent", "absolutely", "converges absolutely", "absolute convergence", "absolute"], ["conditionally convergent", "conditionally", "converges conditionally", "conditional convergence", "conditional"], ["divergent", "diverges", "it diverges", "the series diverges", "not convergent"]]}
            solution_sketch: 'The sizes $\frac{3n+1}{n+2}$ tend to $3$, not to $0$. So the terms do not tend to $0$, and the series diverges by the term test. No absolute or conditional convergence is possible.'
          - problem: 'The series $\sum_{n=1}^{\infty}(-1)^n\left(\frac23\right)^n$ converges absolutely. Find its sum.'
            answer: '-2/5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'This is a geometric series with first term $-\frac23$ and ratio $-\frac23$. Its sum is $\frac{-2/3}{1+2/3}=-\frac25$.'
          - problem: 'A pendulum bob swings alternately right and left. Swing $k$ covers $\frac{12}{2^k}$ cm. Find the total distance the bob travels over all swings.'
            answer: '12'
            answer_contract: {"kind": "unit", "quantity": "length", "unit": "cm", "allow_omitted": true}
            solution_sketch: 'The distances $\frac{12}{2^k}$ form a geometric series with first term $6$ and ratio $\frac12$. Their sum is $\frac{6}{1-1/2}=12$ cm. The total distance uses the absolute values, not the signed values.'
          - problem: 'Lena says that $\sum_{n=1}^{\infty}\frac{(-1)^n}{\sqrt n}$ converges absolutely because it converges. What is the exponent $p$ of the $p$-series $\sum\frac{1}{n^p}$ formed by the absolute values?'
            answer: '1/2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The absolute series is $\sum\frac{1}{\sqrt n}=\sum\frac{1}{n^{1/2}}$, so $p=\frac12$. Since $\frac12\le1$, the absolute series diverges. Lena is wrong: the series converges only conditionally.'
          - problem: 'A pendulum bob swings right, then left, and so on. Swing $k$ covers $\frac{12}{2^k}$ cm, and the first swing is to the right. How far right of its starting point does the bob end up after all swings?'
            answer: '4'
            answer_contract: {"kind": "unit", "quantity": "length", "unit": "cm", "allow_omitted": true}
            solution_sketch: 'Swings to the right count as positive and swings to the left as negative, so the position is $\sum_{k\ge1}(-1)^{k+1}\frac{12}{2^k}$. This is geometric with first term $6$ and ratio $-\frac12$, so its sum is $\frac{6}{1+1/2}=4$ cm.'
        constraints: 'three-way classification; absolute series is a p-series or a geometric series; contexts with total distance and net displacement; at most two label items'
      - id: kp3
        name: Harder classifications
        key_prerequisites: [alternating-series-test, comparison-tests]
        step_check:
          step: 'the series converges by the AST but its absolute series diverges'
          question: 'Why does this make the series conditionally convergent rather than absolutely convergent?'
          options:
            - 'Conditional convergence means the series converges only for some values of $n$'
            - 'The series converges, while the series of absolute values diverges'
            - 'A series with a divergent absolute series must be written down as divergent'
          answer: 'The series converges, while the series of absolute values diverges'
          why: 'By definition, a series is conditionally convergent when it converges but $\sum|a_n|$ diverges.'
        exemplars:
          - problem: 'Classify $\sum_{n=1}^{\infty}(-1)^n\frac{3n+1}{2n^2+5}$ as absolutely convergent, conditionally convergent, or divergent.'
            answer: 'conditionally convergent'
            answer_contract: {"kind": "label", "options": [["absolutely convergent", "absolutely", "converges absolutely", "absolute convergence", "absolute"], ["conditionally convergent", "conditionally", "converges conditionally", "conditional convergence", "conditional"], ["divergent", "diverges", "it diverges", "the series diverges", "not convergent"]]}
            solution_sketch: 'The sizes $b_n=\frac{3n+1}{2n^2+5}$ tend to $0$ and decrease: the numerator of the derivative is $-6x^2-4x+15$, which is negative for $x\ge2$, and $b_1>b_2>b_3$. So the series converges. A limit comparison with $\sum\frac1n$ gives $L=\frac32$, so the absolute series diverges. The series is conditionally convergent.'
          - problem: 'For $\sum_{n=1}^{\infty}(-1)^n\frac{n+1}{n^3+2}$, compare the absolute series with $\sum\frac{1}{n^2}$ by the limit comparison test. Find $L=\lim_{n\to\infty}\frac{|a_n|}{1/n^2}$.'
            answer: '1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'We have $\frac{|a_n|}{1/n^2}=\frac{n^2(n+1)}{n^3+2}=\frac{n^3+n^2}{n^3+2}$. Divide the numerator and the denominator by $n^3$: the limit is $1$.'
          - problem: 'Classify $\sum_{n=1}^{\infty}(-1)^n\frac{n^2}{3^n}$ as absolutely convergent, conditionally convergent, or divergent.'
            answer: 'absolutely convergent'
            answer_contract: {"kind": "label", "options": [["absolutely convergent", "absolutely", "converges absolutely", "absolute convergence", "absolute"], ["conditionally convergent", "conditionally", "converges conditionally", "conditional convergence", "conditional"], ["divergent", "diverges", "it diverges", "the series diverges", "not convergent"]]}
            solution_sketch: 'Apply the ratio test to the absolute series: $\frac{(n+1)^2/3^{n+1}}{n^2/3^n}=\frac{(n+1)^2}{3n^2}\to\frac13<1$. So the absolute series converges, and the series is absolutely convergent.'
          - problem: 'Apply the ratio test to the absolute series of $\sum_{n=1}^{\infty}(-1)^n\frac{n+2}{2^n}$. Find $L=\lim_{n\to\infty}\frac{|a_{n+1}|}{|a_n|}$.'
            answer: '1/2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'We have $\frac{|a_{n+1}|}{|a_n|}=\frac{(n+3)/2^{n+1}}{(n+2)/2^n}=\frac{n+3}{2(n+2)}$. This tends to $\frac12$, which is less than $1$, so the series converges absolutely.'
          - problem: 'To classify $\sum_{n=1}^{\infty}(-1)^n\frac{5n+2}{2n+1}$, first apply the term test. Find $\lim_{n\to\infty}|a_n|$.'
            answer: '5/2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Divide the numerator and the denominator by $n$ to get $\frac{5+2/n}{2+1/n}$, which tends to $\frac52$. Since $|a_n|\to\frac52\ne0$, the series diverges by the term test.'
          - problem: 'A bug walks alternately east and west, and walk $k$ is $\frac{5k+3}{k^3+1}$ m long. For large $k$, the walk is close to $\frac{c}{k^2}$ m. Find $c$.'
            answer: '5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'We want $c=\lim_{k\to\infty}k^2\cdot\frac{5k+3}{k^3+1}=\lim\frac{5k^3+3k^2}{k^3+1}$. Divide the numerator and the denominator by $k^3$: the limit is $5$. So the walks behave like $\frac{5}{k^2}$, and the total distance is finite.'
          - problem: 'A trust adds money in odd years and subtracts money in even years. The adjustment in year $k$ is $\frac{4k}{k^2+k+1}$ thousand dollars. For large $k$ the adjustment is close to $\frac{c}{k}$ thousand dollars. Find $c$.'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'We want $c=\lim_{k\to\infty}k\cdot\frac{4k}{k^2+k+1}=\lim\frac{4k^2}{k^2+k+1}$. Divide the numerator and the denominator by $k^2$: the limit is $4$. So the adjustments behave like $\frac4k$, and the total of their sizes diverges.'
          - problem: 'Sam compares the absolute series of $\sum_{n=1}^{\infty}(-1)^n\frac{n}{3n^2+1}$ with $\sum\frac{1}{n^2}$ and finds that the ratio grows without bound. Sam then compares with $\sum\frac1n$ instead. What limit $L$ does Sam get?'
            answer: '1/3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'We have $\frac{n/(3n^2+1)}{1/n}=\frac{n^2}{3n^2+1}$, which tends to $\frac13$. This is finite and positive, and $\sum\frac1n$ diverges, so the absolute series diverges. Sam''s first choice $\sum\frac{1}{n^2}$ was too small to compare with.'
        constraints: 'absolute series needs a limit comparison, a ratio test or a term test; include one term-test divergence; contexts with a comparison constant; at most two label items'
    diagnostic_exemplar:
      problem: 'Classify $\sum_{n=1}^{\infty} \frac{(-1)^n n}{n^2 + 4}$ as absolutely convergent, conditionally convergent, or divergent.'
      answer: 'conditionally convergent (the AST applies since $\frac{n}{n^2+4}$ decreases to $0$, but the absolute series behaves like $\sum \frac{1}{n}$, which diverges)'
      answer_contract: {kind: none}
      solution_sketch: 'Limit comparison of $\frac{n}{n^2+4}$ with $\frac1n$ gives $L = 1$, so the absolute series diverges while the alternating one converges.'
    anki_seeds:
      - front: "Conditionally convergent means..."
        back: "the series converges but the series of absolute values diverges"
        type: basic
      - front: "Absolute convergence implies..."
        back: "convergence (the converse is false: e.g. the alternating harmonic series)"
        type: basic

  - id: alternating-series-estimation
    name: Alternating Series Error Bounds
    core: false                # error-bound destination; the tests stay core
    difficulty: 0.68
    drill: false
    answer_kind: numeric
    expected_time_secs: 150
    prerequisites:
      - id: alternating-series-test
        weight: 0.7
        key: true
      - id: alternating-series
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: The first-omitted-term bound
        key_prerequisites: [alternating-series-test]
        try_first:
          problem: 'The partial sums of $1-\frac12+\frac13-\frac14+\cdots$ include $S_3=\frac56$ and $S_4=\frac7{12}$. Does the sum of the whole series lie between $S_3$ and $S_4$?'
          answer_contract: {"kind": "label", "options": [["yes", "it does", "it lies between them", "yes, it does", "yes it does"], ["no", "it does not", "it lies outside them", "no, it does not", "no it does not"]]}
          answer: 'yes'
          reveal: 'Each new term moves the partial sum back across the sum, so the sum is always between two neighboring partial sums. That is why the first omitted term bounds the error.'
        step_check:
          step: 'the first omitted term is the $n=6$ term'
          question: 'Why is the $n=6$ term the first omitted term?'
          options:
            - 'The bound always uses the term with the same index as the number of terms kept'
            - 'The first $5$ terms use $n=1$ to $n=5$, so the next term has $n=6$'
            - 'The first omitted term is always the one with the largest factorial'
          answer: 'The first $5$ terms use $n=1$ to $n=5$, so the next term has $n=6$'
          why: 'Terms $n=1$ through $n=5$ are kept. The first term that is left out is the next one, $n=6$.'
        exemplars:
          - problem: 'The sum of $\sum_{n=1}^{\infty}\frac{(-1)^{n+1}}{n^2}$ is approximated by the partial sum of its first $5$ terms. What bound on the error does the alternating series estimation theorem give?'
            answer: '1/36'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The terms $b_n=\frac{1}{n^2}$ are positive, decrease, and tend to $0$, so the estimation theorem applies. The error is at most the first omitted term. After five terms the first omitted term is $b_6=\frac{1}{36}$.'
          - problem: 'The sum of $\sum_{n=1}^{\infty}\frac{(-1)^{n+1}}{n!}$ is approximated by the partial sum of its first $4$ terms. What bound on the error does the alternating series estimation theorem give?'
            answer: '1/120'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The terms $b_n=\frac{1}{n!}$ are positive, decrease, and tend to $0$. The error is at most the first omitted term, which is $b_5=\frac{1}{5!}=\frac{1}{120}$.'
          - problem: 'The sum of $\sum_{n=2}^{\infty}\frac{(-1)^n}{n}$ is approximated by the partial sum of its first $3$ terms, which are the terms with $n=2,3,4$. What bound on the error does the alternating series estimation theorem give?'
            answer: '1/5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The terms $\frac1n$ decrease to $0$. The terms kept have $n=2$, $3$ and $4$, so the first omitted term has $n=5$. The error is at most $\frac15$.'
          - problem: 'Maya approximates $\pi$ by $4\left(1-\frac13+\frac15-\cdots\right)$, using the first $10$ terms of the bracket. The bracket is an alternating series with $b_n=\frac{1}{2n-1}$. What bound does the alternating series estimation theorem give on the error in Maya''s value of $\pi$?'
            answer: '4/21'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The first omitted term of the bracket is $b_{11}=\frac{1}{2\cdot11-1}=\frac{1}{21}$. So the bracket is off by at most $\frac1{21}$. Maya multiplies the bracket by $4$, so her value of $\pi$ is off by at most $\frac{4}{21}$.'
          - problem: 'A bug walks $1$ m east, then $\frac12$ m west, then $\frac13$ m east, and so on, so that walk $k$ is $\frac1k$ m long. If it walked forever it would approach a fixed point. After $9$ walks, what is the largest possible distance from the bug to that point?'
            answer: '1/10'
            answer_contract: {"kind": "unit", "quantity": "length", "unit": "m", "allow_omitted": true}
            solution_sketch: 'The walk lengths $\frac1k$ decrease to $0$, so the estimation theorem applies. The error after $9$ walks is at most the first omitted walk, $\frac{1}{10}$ m. So the bug is at most $\frac1{10}$ m from the fixed point.'
          - problem: 'Sam approximates $\sum_{n=1}^{\infty}\frac{(-1)^{n+1}}{n^4}$ by its first $2$ terms and says the error is at most $\frac{1}{16}$, the size of the last term used. What bound does the alternating series estimation theorem give?'
            answer: '1/81'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The error is bounded by the first omitted term, not by the last term used. After two terms the first omitted term is $b_3=\frac{1}{3^4}=\frac{1}{81}$. Sam''s bound $\frac1{16}$ is true but far too large.'
          - problem: 'The sum of $\sum_{n=1}^{\infty}\frac{(-1)^{n+1}}{2^n}$ is approximated by the partial sum of its first $7$ terms. What bound on the error does the alternating series estimation theorem give?'
            answer: '1/256'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The terms $b_n=\frac{1}{2^n}$ decrease to $0$. The first omitted term is $b_8=\frac{1}{2^8}=\frac{1}{256}$.'
          - problem: 'The sum of $\sum_{n=1}^{\infty}\frac{(-1)^{n+1}}{n(n+1)}$ is approximated by the partial sum of its first $5$ terms. What bound on the error does the alternating series estimation theorem give?'
            answer: '1/42'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The terms $b_n=\frac{1}{n(n+1)}$ decrease to $0$. The first omitted term is $b_6=\frac{1}{6\cdot7}=\frac{1}{42}$.'
        constraints: 'error bounds use the first omitted term; b_n is 1/n, 1/n^2, 1/n!, 1/2^n or a similar decreasing expression; contexts with approximations of pi and with walks'
      - id: kp2
        name: Terms needed for a target accuracy
        key_prerequisites: [alternating-series-test, alternating-series]
        step_check:
          step: 'Round up to a whole number of terms'
          question: 'Why must the value from the inequality be rounded up and not down?'
          options:
            - 'The number of terms of an alternating series must always be rounded to an even number'
            - 'Rounding up gives the exact value of the error, and rounding down does not'
            - 'A smaller number leaves a first omitted term above $\frac{1}{1000}$, so no guarantee'
          answer: 'A smaller number leaves a first omitted term above $\frac{1}{1000}$, so no guarantee'
          why: 'A smaller number of terms leaves a first omitted term above the tolerance, so the guarantee fails. The next whole number works.'
        exemplars:
          - problem: 'How many terms of $\sum_{n=1}^{\infty}\frac{(-1)^{n+1}}{n^2}$ must be added to guarantee an error of at most $\frac{1}{10000}$?'
            answer: '99'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The error after $n$ terms is at most $b_{n+1}=\frac{1}{(n+1)^2}$. We need $\frac{1}{(n+1)^2}\le\frac{1}{10000}$, so $(n+1)^2\ge10000$ and $n+1\ge100$. The smallest such $n$ is $99$.'
          - problem: 'How many terms of $\sum_{n=1}^{\infty}\frac{(-1)^{n+1}}{n^3}$ must be added to guarantee an error of at most $\frac{1}{1000}$?'
            answer: '9'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The error after $n$ terms is at most $\frac{1}{(n+1)^3}$. We need $(n+1)^3\ge1000$, so $n+1\ge10$. The smallest such $n$ is $9$.'
          - problem: 'How many terms of $\sum_{n=1}^{\infty}\frac{(-1)^{n+1}}{2n-1}$ must be added to guarantee an error of at most $\frac{1}{100}$?'
            answer: '50'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The first omitted term after $n$ terms is $b_{n+1}=\frac{1}{2(n+1)-1}=\frac{1}{2n+1}$. We need $2n+1\ge100$, so $n\ge49.5$. The smallest whole number is $n=50$.'
          - problem: 'A program computes $\pi$ as $4\left(1-\frac13+\frac15-\frac17+\cdots\right)$, adding the terms of the bracket one at a time. How many terms must it add to guarantee an error of at most $\frac{1}{1000}$ in $\pi$?'
            answer: '2000'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The bracket has $b_n=\frac{1}{2n-1}$. After $n$ terms its error is at most $b_{n+1}=\frac{1}{2n+1}$, so the error in $\pi$ is at most $\frac{4}{2n+1}$. We need $\frac{4}{2n+1}\le\frac{1}{1000}$, so $2n+1\ge4000$ and $n\ge1999.5$. So $2000$ terms are enough, and $1999$ are not.'
          - problem: 'A bug walks alternately east and west, and walk $k$ is $\frac1k$ m long. If it walked forever it would approach a fixed point. How many walks guarantee that the bug is within $2$ cm of that point?'
            answer: '49'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'After $n$ walks the distance to the fixed point is at most the first omitted walk, $\frac{1}{n+1}$ m. Two centimeters is $0.02$ m, so we need $\frac{1}{n+1}\le\frac{1}{50}$, which gives $n+1\ge50$. The smallest such $n$ is $49$.'
          - problem: 'How many terms of $\sum_{n=1}^{\infty}\frac{(-1)^{n+1}}{n!}$ must be added to guarantee an error of at most $\frac{1}{10000}$?'
            answer: '7'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The error after $n$ terms is at most $\frac{1}{(n+1)!}$. We need $(n+1)!\ge10000$. Since $7!=5040$ is too small and $8!=40320$ is large enough, $n+1=8$ and $n=7$.'
          - problem: 'How many terms of $\sum_{n=1}^{\infty}\frac{(-1)^{n+1}}{2^n}$ must be added to guarantee an error of at most $\frac{1}{10000}$?'
            answer: '13'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The error after $n$ terms is at most $\frac{1}{2^{n+1}}$. We need $2^{n+1}\ge10000$. Since $2^{13}=8192$ is too small and $2^{14}=16384$ is large enough, $n+1=14$ and $n=13$.'
          - problem: 'A calculator approximates $\frac1e$ by adding terms of $\frac1e=1-1+\frac12-\frac16+\cdots=\sum_{n=0}^{\infty}\frac{(-1)^n}{n!}$, starting with the term $n=0$. How many terms must it add to guarantee an error of at most $\frac{1}{1000000}$?'
            answer: '10'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'After $n$ terms, the terms $n=0$ to $n-1$ are kept, so the first omitted term is $\frac{1}{n!}$. We need $n!\ge1000000$. Since $9!=362880$ is too small and $10!=3628800$ is large enough, the answer is $10$ terms.'
        constraints: 'find the number of terms by solving b_(n+1) <= tolerance; thresholds are powers of 10 or small decimals; contexts with pi, 1/e and walks'
      - id: kp3
        name: Estimating alternating sums
        key_prerequisites: [alternating-series-test]
        step_check:
          step: 'The next term is the $n=4$ term'
          question: 'Why does the size of this next term bound the error?'
          options:
            - 'The sum lies between two neighboring partial sums, which differ by the next term'
            - 'The next term is always the largest term of the whole alternating series'
            - 'The error equals the next term exactly, for every alternating series with positive terms'
          answer: 'The sum lies between two neighboring partial sums, which differ by the next term'
          why: 'The sum lies between two neighboring partial sums, and these differ by the next term. So the error is at most that term.'
        exemplars:
          - problem: 'Approximate $\sum_{n=1}^{\infty}\frac{(-1)^{n+1}}{n^3}$ by the sum of its first $3$ terms, and bound the error.'
            answer: 'estimate = 197/216; bound = 1/64'
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "estimate"}, {"contract": {"kind": "exact"}, "name": "bound"}]}
            solution_sketch: 'Add the first three terms: $1-\frac18+\frac1{27}=\frac{216-27+8}{216}=\frac{197}{216}$. The error is at most the first omitted term, $\frac{1}{4^3}=\frac{1}{64}$.'
          - problem: 'Approximate $\sum_{n=1}^{\infty}\frac{(-1)^{n+1}}{n!}$ by the sum of its first $3$ terms.'
            answer: '2/3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The first three terms are $1-\frac12+\frac16=\frac{6-3+1}{6}=\frac46=\frac23$. So the estimate is $\frac23$.'
          - problem: 'The partial sum of the first $3$ terms of $\sum_{n=1}^{\infty}\frac{(-1)^{n+1}}{n^2}$ is $S_3=\frac{31}{36}$. Is the exact sum larger or smaller than $S_3$?'
            answer: 'smaller'
            answer_contract: {"kind": "label", "options": [["smaller", "less", "less than", "below", "lower", "it is smaller", "smaller than"], ["larger", "greater", "greater than", "more", "above", "bigger", "it is larger", "larger than"]]}
            solution_sketch: 'The third term is added with a plus sign, and the next term $-\frac1{16}$ is negative. The partial sums go up and down, and the sum always lies between two neighboring partial sums. So the sum lies between $S_4$ and $S_3=\frac{31}{36}$, below $S_3$.'
          - problem: 'It is known that $\frac1e=\sum_{n=0}^{\infty}\frac{(-1)^n}{n!}=1-1+\frac12-\frac16+\cdots$. Approximate $\frac1e$ by the sum of the first $5$ terms, and bound the error.'
            answer: 'estimate = 3/8; bound = 1/120'
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "estimate"}, {"contract": {"kind": "exact"}, "name": "bound"}]}
            solution_sketch: 'The first five terms are $1-1+\frac12-\frac16+\frac1{24}=\frac{12-4+1}{24}=\frac{9}{24}=\frac38$. The first omitted term is the one with $n=5$, which is $\frac{1}{5!}=\frac{1}{120}$. So the estimate is $\frac38$, with an error of at most $\frac1{120}$.'
          - problem: 'Approximate $\sum_{n=1}^{\infty}\frac{(-1)^{n+1}}{n(n+1)}$ by the sum of its first $4$ terms.'
            answer: '11/30'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The first four terms are $\frac12-\frac16+\frac1{12}-\frac1{20}=\frac{30-10+5-3}{60}=\frac{22}{60}=\frac{11}{30}$.'
          - problem: 'A robot arm nudges a probe along a rail. Nudge $k$ is $\frac{1}{k^2}$ mm, forward when $k$ is odd and back when $k$ is even. How far forward of its starting position is the probe after $3$ nudges, in millimeters to two decimal places?'
            answer: '0.86'
            answer_contract: {"kind": "approx", "decimals": 2}
            solution_sketch: 'The position is $1-\frac14+\frac19=\frac{36-9+4}{36}=\frac{31}{36}$. This is $0.8611\ldots$, so the probe is about $0.86$ mm forward of its starting position.'
          - problem: 'Approximate $\sum_{n=1}^{\infty}\frac{(-1)^{n+1}}{2n-1}$ by the sum of its first $3$ terms.'
            answer: '13/15'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The first three terms are $1-\frac13+\frac15=\frac{15-5+3}{15}=\frac{13}{15}$.'
          - problem: 'The partial sum of the first $2$ terms of $\sum_{n=1}^{\infty}\frac{(-1)^{n+1}}{n^3}$ is $S_2=\frac78$. Is the exact sum larger or smaller than $S_2$?'
            answer: 'larger'
            answer_contract: {"kind": "label", "options": [["smaller", "less", "less than", "below", "lower", "it is smaller", "smaller than"], ["larger", "greater", "greater than", "more", "above", "bigger", "it is larger", "larger than"]]}
            solution_sketch: 'The second term is subtracted, and the next term $+\frac{1}{27}$ is positive. The sum always lies between two neighboring partial sums, so it lies between $S_2=\frac78$ and $S_3$. Therefore the sum is above $S_2$.'
          - problem: 'A trader''s daily result alternates between gain and loss. On day $k$ the result is $\frac{120}{k}$ dollars, a gain when $k$ is odd and a loss when $k$ is even. What is the total result after $5$ days?'
            answer: '94'
            answer_contract: {"kind": "unit", "quantity": "dollar", "unit": "dollar", "allow_omitted": true}
            solution_sketch: 'Gains count as positive and losses as negative, so the total is $120\left(1-\frac12+\frac13-\frac14+\frac15\right)=120\cdot\frac{47}{60}=94$. The trader is $94$ dollars ahead after $5$ days.'
        constraints: 'add the first terms exactly; pair an estimate with its bound where the question needs both; two direction items (larger or smaller) with different answers; contexts with 1/e and a probe'
    diagnostic_exemplar:
      problem: 'Approximate $\sum_{n=1}^{\infty} \frac{(-1)^{n+1}}{n^2}$ by its first $4$ terms and bound the error.'
      answer: '$\frac{115}{144}$, with error at most $b_5 = \frac{1}{25}$'
      answer_contract: {kind: none}
      solution_sketch: '$1 - \frac14 + \frac19 - \frac1{16} = \frac{115}{144}$; for an alternating series the error is at most the first omitted term.'
    anki_seeds:
      - front: "Alternating series error bound: the error after n terms is at most..."
        back: '$b_{n+1}$, the first omitted term'
        type: basic
      - front: "Alternating series estimation bound vs Lagrange remainder: which applies when?"
        back: "AST bound: any series meeting the AST hypotheses (alternating, terms decreasing to 0) — error <= first omitted term. Lagrange remainder: Taylor polynomials of a differentiable function, needing a bound on the (n+1)st derivative."
        type: basic

  - id: strategy-for-testing-series
    name: Strategy for Testing Series
    core: false                # mixed-practice strategy capstone
    difficulty: 0.73
    drill: false
    answer_kind: numeric
    expected_time_secs: 240
    prerequisites:
      - id: ratio-root-tests
        weight: 0.6
        key: true
      - id: alternating-series
        weight: 0.6
        key: true
      - id: comparison-tests
        weight: 0.4
      - id: integral-p-series-tests
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: Reading the form to pick a test
        key_prerequisites: [ratio-root-tests, comparison-tests]
        step_check:
          step: 'Rational terms point to limit comparison with a $p$-series'
          question: 'Why do rational terms point to limit comparison with a $p$-series?'
          options:
            - 'Rational terms contain factorials, and factorials always need a comparison test'
            - 'A rational term behaves like a power of $n$, which is the form of a $p$-series'
            - 'A $p$-series always converges, so every series with rational terms converges too'
          answer: 'A rational term behaves like a power of $n$, which is the form of a $p$-series'
          why: 'The leading powers decide how a rational term behaves for large $n$, so it looks like $\frac{c}{n^p}$. A $p$-series has exactly that form.'
        exemplars:
          - problem: 'Which test is the most direct way to decide whether $\sum_{n=1}^{\infty}\frac{2n^2+1}{n^4+3}$ converges: the ratio test, the limit comparison test, or the alternating series test?'
            answer: 'limit comparison test'
            answer_contract: {"kind": "label", "options": [["limit comparison test", "limit comparison", "the limit comparison test", "comparison test", "LCT"], ["ratio test", "the ratio test", "ratio"], ["alternating series test", "alternating series", "the alternating series test", "AST"]]}
            solution_sketch: 'The terms are a ratio of polynomials, with no factorial, no $n$th power and no alternating sign. For large $n$ they behave like $\frac{2n^2}{n^4}=\frac{2}{n^2}$. A limit comparison with the $p$-series $\sum\frac{1}{n^2}$ settles the question.'
          - problem: 'A limit comparison with a $p$-series settles whether $\sum_{n=1}^{\infty}\frac{n+3}{n^{5/2}+1}$ converges. Find the exponent $p$ of that $p$-series.'
            answer: '3/2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'For large $n$ the term behaves like $\frac{n}{n^{5/2}}=\frac{1}{n^{3/2}}$. So the comparison series is $\sum\frac{1}{n^{3/2}}$, with $p=\frac32$. It converges, so the given series converges.'
          - problem: 'The terms of $\sum_{n=1}^{\infty}\frac{6^n}{n!}$ hold a factorial and an $n$th power. Find $L=\lim_{n\to\infty}\frac{a_{n+1}}{a_n}$.'
            answer: '0'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'We have $\frac{a_{n+1}}{a_n}=\frac{6^{n+1}/(n+1)!}{6^n/n!}=\frac{6}{n+1}$. This tends to $0$, which is less than $1$, so the series converges by the ratio test.'
          - problem: 'A tank is filled in stages. Stage $n$ adds $\frac{3n+1}{n^3+4}$ cubic meters of water. For large $n$ the stage volume is close to $\frac{c}{n^2}$ cubic meters. Find $c$.'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'We want $c=\lim_{n\to\infty}n^2\cdot\frac{3n+1}{n^3+4}=\lim\frac{3n^3+n^2}{n^3+4}$. Divide the numerator and the denominator by $n^3$: the limit is $3$. Since $\sum\frac{1}{n^2}$ converges, the total volume added is finite.'
          - problem: 'Does $\sum_{n=1}^{\infty}(-1)^n\frac{n+1}{n}$ converge?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "it converges", "converges", "convergent", "yes, it converges", "yes it converges"], ["no", "it diverges", "diverges", "divergent", "no, it diverges", "no it diverges"]]}
            solution_sketch: 'The sizes $\frac{n+1}{n}=1+\frac1n$ tend to $1$, not to $0$. The terms do not tend to $0$, so the series diverges by the term test. The alternating series test does not apply.'
          - problem: 'A reservoir receives $\frac{n^2}{2^n}$ thousand liters of water in year $n$. To decide whether the total inflow over all years is finite, find $L=\lim_{n\to\infty}\frac{a_{n+1}}{a_n}$, where $a_n$ is the inflow in year $n$.'
            answer: '1/2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'We have $\frac{a_{n+1}}{a_n}=\frac{(n+1)^2/2^{n+1}}{n^2/2^n}=\frac{(n+1)^2}{2n^2}$. This tends to $\frac12$, which is less than $1$, so the total inflow is finite.'
          - problem: 'For $\sum_{n=1}^{\infty}\frac{5n+2}{2n^3+7}$, compare with the $p$-series $\sum\frac1{n^2}$. Find $L=\lim_{n\to\infty}\frac{a_n}{1/n^2}$.'
            answer: '5/2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'We have $\frac{a_n}{1/n^2}=\frac{n^2(5n+2)}{2n^3+7}=\frac{5n^3+2n^2}{2n^3+7}$. Divide the numerator and the denominator by $n^3$: the limit is $\frac52$. This is finite and positive, so the series converges like $\sum\frac{1}{n^2}$.'
        constraints: 'one rational, one factorial or exponential, one alternating per set; the question names or asks for the test; contexts with stage-by-stage totals'
      - id: kp2
        name: Full verdicts on mixed forms
        key_prerequisites: [ratio-root-tests, integral-p-series-tests]
        step_check:
          step: 'the ratio test is the natural tool'
          question: 'Why is the ratio test the natural tool for $\frac{n^2+1}{2^n}$?'
          options:
            - 'The ratio of terms cancels the powers of $2$ and leaves a simple limit'
            - 'The integral test cannot be used for any series whose terms contain an exponent'
            - 'The ratio test always works whenever the series in question converges at all'
          answer: 'The ratio of terms cancels the powers of $2$ and leaves a simple limit'
          why: 'In the ratio, the factor $2^n$ cancels down to a single $2$. What remains is a rational expression whose limit is easy to find.'
        exemplars:
          - problem: 'Does $\sum_{n=1}^{\infty}\frac{n^3}{5^n}$ converge?'
            answer: 'yes'
            answer_contract: {"kind": "label", "options": [["yes", "it converges", "converges", "convergent", "yes, it converges", "yes it converges"], ["no", "it diverges", "diverges", "divergent", "no, it diverges", "no it diverges"]]}
            solution_sketch: 'The terms hold an exponential, so use the ratio test. We have $\frac{a_{n+1}}{a_n}=\frac{(n+1)^3}{5n^3}\to\frac15$. Since $\frac15<1$, the series converges.'
          - problem: 'Apply the root test to $\sum_{n=1}^{\infty}\left(\frac{2n+1}{3n+4}\right)^n$ and find $L=\lim_{n\to\infty}\sqrt[n]{a_n}$.'
            answer: '2/3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The $n$th root of $\left(\frac{2n+1}{3n+4}\right)^n$ is $\frac{2n+1}{3n+4}$. This tends to $\frac23$, which is less than $1$, so the series converges.'
          - problem: 'The integral test is used on $\sum_{n=1}^{\infty}\frac{1}{n^2+1}$. Find $\int_1^{\infty}\frac{dx}{x^2+1}$.'
            answer: 'pi/4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'An antiderivative of $\frac{1}{x^2+1}$ is $\arctan x$. So the integral is $\lim_{b\to\infty}\arctan b-\arctan1=\frac\pi2-\frac\pi4=\frac\pi4$. The integral is finite, so the series converges.'
          - problem: 'Does $\sum_{n=1}^{\infty}\frac{2n+1}{3n+4}$ converge?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "it converges", "converges", "convergent", "yes, it converges", "yes it converges"], ["no", "it diverges", "diverges", "divergent", "no, it diverges", "no it diverges"]]}
            solution_sketch: 'The terms $\frac{2n+1}{3n+4}$ tend to $\frac23$, not to $0$. So the series diverges by the term test.'
          - problem: 'A mining company extracts $\frac{n}{4^n}$ thousand tonnes of ore in year $n$. To decide whether the total over all years is finite, find $L=\lim_{n\to\infty}\frac{a_{n+1}}{a_n}$, where $a_n$ is the amount in year $n$.'
            answer: '1/4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'We have $\frac{a_{n+1}}{a_n}=\frac{(n+1)/4^{n+1}}{n/4^n}=\frac{n+1}{4n}$. This tends to $\frac14$, which is less than $1$, so the total is finite.'
          - problem: 'The integral test is used on $\sum_{n=2}^{\infty}\frac{1}{n(\ln n)^2}$. Find $\int_2^{\infty}\frac{dx}{x(\ln x)^2}$.'
            answer: '1/ln(2)'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'With $u=\ln x$ we have $du=\frac{dx}{x}$, so the integral becomes $\int\frac{du}{u^2}=-\frac1u$. It equals $\lim_{b\to\infty}\left(-\frac{1}{\ln b}\right)+\frac{1}{\ln2}=\frac{1}{\ln2}$. The integral is finite, so the series converges.'
          - problem: 'Use the limit comparison test on $\sum_{n=1}^{\infty}\frac{1}{n^2+4n+5}$ with the $p$-series $\sum\frac{1}{n^2}$. Find $L=\lim_{n\to\infty}\frac{a_n}{1/n^2}$.'
            answer: '1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'We have $\frac{a_n}{1/n^2}=\frac{n^2}{n^2+4n+5}$. Divide the numerator and the denominator by $n^2$: the limit is $1$. This is finite and positive, so the series converges like $\sum\frac{1}{n^2}$.'
          - problem: 'A fund pays $\frac{5n+1}{n^3+2n}$ thousand dollars in year $n$. To decide whether the total payout is finite, compare with $\sum\frac{1}{n^2}$ and find $L=\lim_{n\to\infty}\frac{a_n}{1/n^2}$, where $a_n$ is the payment in year $n$.'
            answer: '5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'We have $\frac{a_n}{1/n^2}=\frac{n^2(5n+1)}{n^3+2n}=\frac{5n^3+n^2}{n^3+2n}$. Divide the numerator and the denominator by $n^3$: the limit is $5$. This is finite and positive, so the total payout is finite.'
        constraints: 'each set mixes ratio, root, integral, comparison and term tests; verdicts and the number from the deciding test; contexts with yearly or stage totals'
      - id: kp3
        name: Classification capstone
        key_prerequisites: [alternating-series, comparison-tests]
        step_check:
          step: 'Since $0 < L < \infty$'
          question: 'Why does $0 < L < \infty$ let us conclude that the absolute series diverges?'
          options:
            - 'A positive finite limit shows that the absolute series has the same sum as the harmonic series'
            - 'A finite limit alone proves that the absolute series diverges, so $\sum\frac1n$ is not needed'
            - 'Terms of similar size make both series converge or both diverge, and $\sum\frac1n$ diverges'
          answer: 'Terms of similar size make both series converge or both diverge, and $\sum\frac1n$ diverges'
          why: 'When $0 < L < \infty$, the two series have terms of comparable size, so they behave alike. Since $\sum\frac1n$ diverges, so does the absolute series.'
        exemplars:
          - problem: 'Classify $\sum_{n=1}^{\infty}(-1)^n\frac{n+1}{2n^2+3n+1}$ as absolutely convergent, conditionally convergent, or divergent.'
            answer: 'conditionally convergent'
            answer_contract: {"kind": "label", "options": [["absolutely convergent", "absolutely", "converges absolutely", "absolute convergence", "absolute"], ["conditionally convergent", "conditionally", "converges conditionally", "conditional convergence", "conditional"], ["divergent", "diverges", "it diverges", "the series diverges", "not convergent"]]}
            solution_sketch: 'Factor the denominator: $2n^2+3n+1=(2n+1)(n+1)$, so $|a_n|=\frac{1}{2n+1}$. A limit comparison with $\sum\frac1n$ gives $L=\frac12$, so the absolute series diverges. The sizes $\frac{1}{2n+1}$ decrease to $0$, so the alternating series test shows convergence. The series is conditionally convergent.'
          - problem: 'For $\sum_{n=1}^{\infty}(-1)^n\frac{2n+3}{n^3+1}$, compare the absolute series with $\sum\frac{1}{n^2}$ by the limit comparison test. Find $L=\lim_{n\to\infty}\frac{|a_n|}{1/n^2}$.'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'We have $\frac{|a_n|}{1/n^2}=\frac{n^2(2n+3)}{n^3+1}=\frac{2n^3+3n^2}{n^3+1}$. Divide the numerator and the denominator by $n^3$: the limit is $2$. Since $\sum\frac{1}{n^2}$ converges, the absolute series converges.'
          - problem: 'Classify $\sum_{n=1}^{\infty}(-1)^n\frac{n+1}{n^3+2}$ as absolutely convergent, conditionally convergent, or divergent.'
            answer: 'absolutely convergent'
            answer_contract: {"kind": "label", "options": [["absolutely convergent", "absolutely", "converges absolutely", "absolute convergence", "absolute"], ["conditionally convergent", "conditionally", "converges conditionally", "conditional convergence", "conditional"], ["divergent", "diverges", "it diverges", "the series diverges", "not convergent"]]}
            solution_sketch: 'The absolute series $\sum\frac{n+1}{n^3+2}$ is compared with $\sum\frac1{n^2}$: the limit comparison constant is $L=1$. Since $\sum\frac{1}{n^2}$ converges, the absolute series converges, and the series is absolutely convergent.'
          - problem: 'To classify $\sum_{n=1}^{\infty}(-1)^n\frac{3n+1}{n+2}$, first apply the term test. Find $\lim_{n\to\infty}|a_n|$.'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Divide the numerator and the denominator by $n$ to get $\frac{3+1/n}{1+2/n}$, which tends to $3$. Since $|a_n|\to3\ne0$, the series diverges by the term test.'
          - problem: 'A bug walks alternately east and west, and walk $k$ is $\frac{2k+1}{k^2+3k}$ m long. For large $k$ the walk is close to $\frac{c}{k}$ m. Find $c$.'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'We want $c=\lim_{k\to\infty}k\cdot\frac{2k+1}{k^2+3k}=\lim\frac{2k^2+k}{k^2+3k}$. Divide the numerator and the denominator by $k^2$: the limit is $2$. So the walks behave like $\frac2k$, and the total distance walked is infinite, while the position settles.'
          - problem: 'Sam says that $\sum_{n=1}^{\infty}\frac{(-1)^n}{n^2+1}$ is conditionally convergent because its terms alternate and decrease to $0$. Find the exponent $p$ of the $p$-series with which its absolute series should be compared.'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The absolute series $\sum\frac{1}{n^2+1}$ is smaller than the convergent $p$-series $\sum\frac{1}{n^2}$, so $p=2$. The absolute series converges, so the series is absolutely convergent. Sam is wrong.'
          - problem: 'A signal alternates in sign, and pulse $n$ has size $\frac{n^2}{3^n}$ volts. To decide whether the sum of the pulse sizes is finite, find $L=\lim_{n\to\infty}\frac{|a_{n+1}|}{|a_n|}$.'
            answer: '1/3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'We have $\frac{|a_{n+1}|}{|a_n|}=\frac{(n+1)^2/3^{n+1}}{n^2/3^n}=\frac{(n+1)^2}{3n^2}$. This tends to $\frac13$, which is less than $1$, so the sum of the pulse sizes is finite.'
        constraints: 'three-way classification with the deciding test named in the sketch; one term-test divergence; contexts with comparison constants'
    diagnostic_exemplar:
      problem: 'Classify $\sum_{n=2}^{\infty} \frac{(-1)^n}{\sqrt{n} + 1}$ as absolutely convergent, conditionally convergent, or divergent, naming the tests you use.'
      answer: 'conditionally convergent (AST: $\frac{1}{\sqrt n + 1}$ decreases to $0$; limit comparison of the absolute series with $\sum n^{-1/2}$ gives $L = 1$, and that $p$-series diverges)'
      answer_contract: {kind: none}
      solution_sketch: 'Read the form: alternating with terms decreasing to zero, so it converges; the absolute series is a $p$-series comparison with $p = \frac12 \le 1$.'
    anki_seeds:
      - front: "Series strategy: factorials or c^n suggest ..., nth powers suggest ..., rational terms suggest ..."
        back: "ratio test; root test; (limit) comparison with a p-series"
        type: basic
      - front: "The first question to ask of ANY series?"
        back: "do the terms tend to 0? (if not, it diverges by the term test)"
        type: basic
