            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["converges"], ["diverges"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "L"}]}
            solution_sketch: "The series is $\\sum_{n=1}^{\\infty} 3^n/n^n$. The root test is the natural rule because $a_n$ is an $n$th power. Compute $L = \\lim |a_n|^{1/n} = \\lim 3/n = 0$. Since $L = 0 < 1$, the root test gives convergence. The option diverges is wrong because $L = 0 < 1$ rules out divergence. So verdict = converges; L = 0."
          - problem: "Consider the series $\\sum_{n=1}^{\\infty} \\frac{n! 4^n}{n^n}$. Apply the natural test, and state the verdict together with the limit $L$. State the verdict and $L$."
