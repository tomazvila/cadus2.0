        exemplars:
          - problem: "The series sum_{n=1}^\\infty 1/(n^2+5) has positive terms. Use the direct comparison test with the convergent p-series sum_{n=1}^\\infty 1/n^p. State whether the series converges or diverges, and give the exponent p of the p-series that bounds each term."
            answer: "verdict = converges; p = 2"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["converges"], ["diverges"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "p"}]}
            solution_sketch: "Step 1: The series is sum 1/(n^2+5). Its terms are positive. Step 2 (termwise bound): 1/(n^2+5) <= 1/n^2 for all n >= 1 because n^2 <= n^2+5. Step 3 (p-series test): the p-series with p=2 converges. Step 4 (direct comparison): the original series converges. So verdict = converges; p = 2."
          - problem: "The series sum_{n=1}^\\infty 1/(n^3+2) has positive terms. Compare it with the convergent p-series sum_{n=1}^\\infty 1/n^p termwise. State the verdict and give the exponent p."
