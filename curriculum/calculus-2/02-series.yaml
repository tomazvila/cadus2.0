            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["converges"], ["diverges"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "L"}]}
            solution_sketch: "Step 1: Identify the terms $a_n = \\left(\\frac{n+1}{2n+3}\\right)^n$. Step 2: Apply the root test by taking the nth root, which gives $\\frac{n+1}{2n+3}$. Step 3: Take the limit as n grows: $\\frac{n+1}{2n+3} \\to \\frac{1}{2}$. Since $L = 1/2 < 1$, the series converges. A wrong verdict of diverges would come from forgetting that a root-test limit below 1 means convergence. Final verdict: verdict = converges; L = 1/2."
          - problem: "The series $\\sum_{n=1}^{\\infty} \\frac{1}{n^2+1}$ has positive decreasing terms. State whether the series is convergent or divergent, and give the value of the integral used in the integral test."
            answer: "verdict = converges; I = pi/4"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["converges"], ["diverges"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "I"}]}
            solution_sketch: "Step 1: The series is $\\sum_{n=1}^{\\infty} \\frac{1}{n^2+1}$. Step 2: Apply the integral test with $f(x) = \\frac{1}{x^2+1}$. Step 3: Evaluate the improper integral $\\int_1^{\\infty} \\frac{dx}{x^2+1} = \\left[\\operatorname{atan}(x)\\right]_1^{\\infty} = \\frac{\\pi}{2} - \\frac{\\pi}{4} = \\frac{\\pi}{4}$. The integral is finite, so the series converges. A wrong verdict of diverges would come from treating the integral as infinite. Final verdict: verdict = converges; I = pi/4."
          - problem: "The series $\\sum_{n=1}^{\\infty} \\frac{2n+1}{3n+4}$ has positive terms. State whether the series is convergent or divergent, and give the limit of its terms."
