      - id: kp2
        name: Bounding below by a divergent series
        key_prerequisites: [integral-p-series-tests]
        exemplars:
          - problem: "Consider the series sum from n=1 to infinity of (n+1)/n^2. Use direct comparison with the harmonic series 1/n. State the conclusion of the direct comparison test, and give the smallest integer N such that (n+1)/n^2 >= 1/n for every n >= N."
