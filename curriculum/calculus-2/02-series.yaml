            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["converges"], ["diverges"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "L"}]}
            solution_sketch: "Step 1: The series is $\\sum_{n=1}^{\\infty} \\frac{2n+1}{3n+4}$. Step 2: Apply the term test by computing $\\lim_{n\\to\\infty} a_n$. Step 3: Divide numerator and denominator by n: $\\frac{2+1/n}{3+4/n} \\to \\frac{2}{3}$. Since the limit is not zero, the series diverges. A wrong verdict of converges would come from ignoring that the terms do not approach zero. Final verdict: verdict = diverges; L = 2/3."
          - problem: "The alternating series $\\sum_{n=1}^{\\infty} \\frac{(-1)^{n+1}}{n+3}$ has decreasing absolute terms. State whether the series is convergent or divergent, and give the limit of the absolute term $b_n$."
