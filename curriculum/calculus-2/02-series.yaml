      - front: 'The $p$-series $\sum 1/n^p$ converges exactly when...'
        back: '$p > 1$'
        type: basic
      - front: "Integral test hypotheses on f?"
        back: "positive, continuous, and decreasing on some tail, with a_n = f(n)"
        type: basic

  - id: direct-comparison-test
