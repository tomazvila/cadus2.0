            solution_sketch: "Step 1: The series is $\\sum_{n=1}^{\\infty} \\frac{n^2}{3^n}$, so $a_n = \\frac{n^2}{3^n}$. Step 2: Apply the ratio test by forming $\\frac{a_{n+1}}{a_n} = \\frac{(n+1)^2}{3^{n+1}} \\cdot \\frac{3^n}{n^2}$. Step 3: Simplify to $\\frac{1}{3}\\left(\\frac{n+1}{n}\\right)^2$. Step 4: Take the limit as n grows: $\\frac{1}{3} \\cdot 1 = \\frac{1}{3}$. The ratio-test limit is 1/3."
