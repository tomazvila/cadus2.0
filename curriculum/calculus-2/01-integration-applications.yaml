        weight: 0.3
    knowledge_points:
      - id: kp1
        name: Average value and the MVT for integrals
        key_prerequisites: [average-value-function, definite-integrals-ftc]
        exemplars:
          - problem: 'Find the average value of $f(x) = \sin x$ on $[0, \pi]$.'
            answer: '$2/\pi$'
            solution_sketch: '$\frac{1}{\pi}\int_0^{\pi} \sin x\,dx = \frac{2}{\pi}$.'
          - problem: 'For $f(x) = x^2$ on $[0, 3]$, find the $c$ guaranteed by the Mean Value Theorem for integrals ($f(c) = f_{avg}$).'
            answer: '$c = \sqrt{3}$'
            solution_sketch: '$f_{avg} = \frac{1}{3}\int_0^3 x^2\,dx = 3$, so $c^2 = 3$ with $c \in [0, 3]$.'
          - problem: 'Find the average value of $f(x) = \frac{1}{x}$ on $[1, e]$.'
            answer: '$\frac{1}{e - 1}$'
            solution_sketch: '$\frac{1}{e - 1}\int_1^e \frac{dx}{x} = \frac{1}{e - 1}$.'
        constraints: "f is sin/cos, 1/x, or a polynomial; interval endpoints small integers, e, or multiples of pi"
      - id: kp2
        name: Work lifting cables and chains
        key_prerequisites: [work-springs, definite-integrals-ftc]
        exemplars:
          - problem: 'A $10$ m cable of linear density $2$ kg/m hangs from a winch. Find the work to wind in the whole cable ($g = 9.8$ m/s$^2$).'
            answer: '$980$ J'
            solution_sketch: 'A slice at distance $x$ below the top weighs $2(9.8)\,dx$ and rises $x$: $W = \int_0^{10} 19.6x\,dx = 19.6 \cdot 50 = 980$ J.'
          - problem: 'A $20$ m chain of linear density $3$ kg/m hangs from a crane. Find the work to lift the entire chain to the top ($g = 9.8$ m/s$^2$).'
            answer: '$5880$ J'
            solution_sketch: '$W = \int_0^{20} 3(9.8)x\,dx = 29.4 \cdot 200 = 5880$ J.'
        constraints: "uniform cables/chains only; distances measured from the lift destination; g = 9.8"
      - id: kp3
        name: Work pumping liquids
        key_prerequisites: [work-springs, definite-integrals-ftc]
        exemplars:
          - problem: 'A cylindrical tank of radius $1$ m and height $2$ m is full of water (weight density $9800$ N/m$^3$). Find the work to pump all the water over the top rim.'
            answer: '$19600\pi$ J'
            solution_sketch: 'A slice at depth $x$ below the rim has volume $\pi(1)^2\,dx$ and rises $x$: $W = 9800\pi\int_0^2 x\,dx = 19600\pi$ J.'
          - problem: 'The same tank (radius $1$ m, height $2$ m) is only half full: water occupies depths $1$ to $2$ below the rim. Find the work to pump it all over the rim.'
            answer: '$14700\pi$ J'
            solution_sketch: '$W = 9800\pi\int_1^2 x\,dx = 9800\pi \cdot \frac{3}{2} = 14700\pi$ J.'
        constraints: "cylindrical tanks only; slices indexed by depth below the rim; weight density 9800 N/m^3"
    diagnostic_exemplar:
      problem: 'A cylindrical tank of radius $2$ m and height $3$ m is full of water (weight density $9800$ N/m$^3$). Find the work to pump all the water over the top rim.'
      answer: '$176400\pi$ J'
      solution_sketch: 'A slab at depth $y$ below the rim has weight $9800 \cdot 4\pi\,dy$ and is lifted $y$: $W = 39200\pi\int_0^3 y\,dy = 176400\pi$.'
    anki_seeds:
      - front: "Average value of f on [a, b]?"
        back: '$f_{avg} = \frac{1}{b-a} \int_a^b f(x) \, dx$'
        type: basic
      - front: "Setting up a pumping problem: each slice's work contribution is..."
        back: "(weight density) x (slice volume) x (distance the slice must rise)"
        type: basic

