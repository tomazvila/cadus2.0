            answer: '$4\sqrt{10}$'
            solution_sketch: '$L = \int_0^4 \sqrt{1 + 9}\,dx = 4\sqrt{10}$; the segment from $(0,1)$ to $(4,13)$ has length $\sqrt{16 + 144} = 4\sqrt{10}$.'
          - problem: "Consider y = x^2 on the interval [0, 1]. Give the integrand of its arc length integral as a function of x."
            answer: "sqrt(1+4x^2)"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "The arc length integral rule gives L = integral from 0 to 1 of sqrt(1 + (y')^2) dx. Differentiate y = x^2 with the power rule to get y' = 2x. Then 1 + (y')^2 = 1 + 4x^2, so the integrand is sqrt(1+4x^2)."
          - problem: "Find the length of the line segment y = 5x - 2 for 0 <= x <= 3."
            answer: "3sqrt(26)"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The arc length integral rule gives L = integral from 0 to 3 of sqrt(1 + (y')^2) dx. Differentiate y = 5x - 2 to get y' = 5, so the integrand is sqrt(1 + 25) = sqrt(26). The integral of the constant sqrt(26) over a length of 3 is 3sqrt(26)."
          - problem: "Find the length of the line segment y = -2x + 7 for 1 <= x <= 5."
            answer: "4sqrt(5)"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The arc length integral rule gives L = integral from 1 to 5 of sqrt(1 + (y')^2) dx. Differentiate y = -2x + 7 to get y' = -2, so the integrand is sqrt(1 + 4) = sqrt(5). The integral of the constant sqrt(5) over a length of 4 is 4sqrt(5)."
          - problem: "Find the arc length of the horizontal line y = 4 from x = 2 to x = 9."
            answer: "7"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The arc length integral rule gives L = integral from 2 to 9 of sqrt(1 + (y')^2) dx. Differentiate y = 4 to get y' = 0, so the integrand is sqrt(1) = 1. The integral of 1 from x = 2 to x = 9 is 7, so the length is 7."
          - problem: "Consider y = e^x on the interval [0, 1]. Give the integrand of its arc length integral as a function of x."
            answer: "sqrt(1+e^(2x))"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "The arc length integral rule gives L = integral from 0 to 1 of sqrt(1 + (y')^2) dx. Differentiate y = e^x to get y' = e^x. Then 1 + (y')^2 = 1 + e^(2x), so the integrand is sqrt(1+e^(2x))."
        constraints: "curves where 1 + (y')^2 is constant, or setup-only problems"
      - id: kp2
        name: Power curves via substitution
        key_prerequisites: [integration-substitution, definite-integrals-ftc]
        exemplars:
          - problem: 'Find the length of $y = x^{3/2}$ for $0 \le x \le 5$.'
            answer: '$335/27$'
            solution_sketch: '$y'' = \frac{3}{2}x^{1/2}$; $L = \int_0^5 \sqrt{1 + \frac{9x}{4}}\,dx = \frac{8}{27}\left[(1 + \tfrac{9x}{4})^{3/2}\right]_0^5 = \frac{8}{27}(\frac{343}{8} - 1) = \frac{335}{27}$.'
          - problem: 'Find the length of $y = 2x^{3/2}$ for $0 \le x \le 1$.'
            answer: '$\frac{2(10\sqrt{10} - 1)}{27}$'
            solution_sketch: '$y'' = 3x^{1/2}$; $L = \int_0^1 \sqrt{1 + 9x}\,dx = \frac{2}{27}\left[(1 + 9x)^{3/2}\right]_0^1 = \frac{2}{27}(10\sqrt{10} - 1)$.'
          - problem: "Find the length of $y = \\frac{2}{3}x^{3/2}$ for $0 \\le x \\le 3$."
            answer: "14/3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The derivative is $y' = x^{1/2}$, so $1 + (y')^2 = 1 + x$. Use substitution $u = 1 + x$, $du = dx$, so $L = \\int_0^3 \\sqrt{1+x}\\,dx = \\frac{2}{3}(1+x)^{3/2}\\big|_0^3$. Evaluate: $\\frac{2}{3}(8 - 1) = \\frac{14}{3}$."
          - problem: "Find the length of $y = \\frac{1}{3}x^{3/2}$ for $0 \\le x \\le 12$."
            answer: "56/3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The derivative is $y' = \\frac{1}{2}x^{1/2}$, so $1 + (y')^2 = 1 + \\frac{x}{4}$. Use substitution $u = 1 + \\frac{x}{4}$, $dx = 4\\,du$, so $L = 4\\int_1^4 u^{1/2}\\,du = \\frac{8}{3}u^{3/2}\\big|_1^4$. Evaluate: $\\frac{8}{3}(8 - 1) = \\frac{56}{3}$."
          - problem: "Find the length of $y = \\frac{2}{3}(x+3)^{3/2}$ for $0 \\le x \\le 5$."
            answer: "38/3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The derivative is $y' = (x+3)^{1/2}$, so $1 + (y')^2 = x+4$. Use substitution $u = x+4$, so $L = \\int_4^9 \\sqrt{u}\\,du = \\frac{2}{3}u^{3/2}\\big|_4^9$. Evaluate: $\\frac{2}{3}(27 - 8) = \\frac{38}{3}$."
          - problem: "Find the length of $y = \\frac{2}{3}(x+8)^{3/2}$ for $0 \\le x \\le 7$."
            answer: "74/3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The derivative is $y' = (x+8)^{1/2}$, so $1 + (y')^2 = x+9$. Use substitution $u = x+9$, so $L = \\int_9^{16} \\sqrt{u}\\,du = \\frac{2}{3}u^{3/2}\\big|_9^{16}$. Evaluate: $\\frac{2}{3}(64 - 27) = \\frac{74}{3}$."
        constraints: "curves where 1 + (y')^2 is linear in x; the substitution is one step"
      - id: kp3
        name: Perfect-square integrands
        key_prerequisites: [simplifying-radicals, definite-integrals-ftc]
        exemplars:
          - problem: 'Find the length of $y = \frac{x^3}{3} + \frac{1}{4x}$ for $1 \le x \le 2$.'
            answer: '$59/24$'
            solution_sketch: '$y'' = x^2 - \frac{1}{4x^2}$, so $1 + (y'')^2 = (x^2 + \frac{1}{4x^2})^2$. $L = \int_1^2 (x^2 + \frac{1}{4x^2})\,dx = [\frac{x^3}{3} - \frac{1}{4x}]_1^2 = \frac{7}{3} + \frac{1}{8} = \frac{59}{24}$.'
          - problem: 'Find the length of $y = \frac{e^x + e^{-x}}{2}$ for $0 \le x \le 1$.'
            answer: '$\frac{e - e^{-1}}{2}$'
            solution_sketch: '$1 + (y'')^2 = \left(\frac{e^x + e^{-x}}{2}\right)^2$, so $L = \int_0^1 \frac{e^x + e^{-x}}{2}\,dx = \frac{e - e^{-1}}{2}$.'
          - problem: "Find the length of the curve y = x^3/12 + 1/x for 1 <= x <= 2."
            answer: "13/12"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The curve is y = x^3/12 + 1/x on [1, 2]. Differentiate with the power rule: y' = x^2/4 - 1/x^2. Then 1 + (y')^2 = (x^2/4 + 1/x^2)^2, so the arc length integrand is x^2/4 + 1/x^2. Integrate with the Fundamental Theorem: L = [x^3/12 - 1/x] from 1 to 2 = 13/12. The arc length is 13/12."
          - problem: "Find the length of the curve y = (e^x + e^(-x))/2 for 0 <= x <= ln(2)."
            answer: "3/4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The curve is y = (e^x + e^(-x))/2 on [0, ln(2)]. Differentiate with the chain rule: y' = (e^x - e^(-x))/2. Then 1 + (y')^2 = ((e^x + e^(-x))/2)^2, so the integrand is (e^x + e^(-x))/2. Integrate with the Fundamental Theorem: L = [(e^x - e^(-x))/2] from 0 to ln(2) = 3/4. The length is 3/4."
          - problem: "Find the length of the curve y = x^4/4 + 1/(8x^2) for 1 <= x <= 2."
            answer: "123/32"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The curve is y = x^4/4 + 1/(8x^2) on [1, 2]. Differentiate with the power rule: y' = x^3 - 1/(4x^3). Then 1 + (y')^2 = (x^3 + 1/(4x^3))^2, so the integrand is x^3 + 1/(4x^3). Integrate with the Fundamental Theorem: L = [x^4/4 - 1/(8x^2)] from 1 to 2 = 123/32. The arc length is 123/32."
          - problem: "Find the length of the curve y = 2x^3/3 + 1/(8x) for 1 <= x <= 3."
            answer: "209/12"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The curve is y = 2x^3/3 + 1/(8x) on [1, 3]. Differentiate with the power rule: y' = 2x^2 - 1/(8x^2). Then 1 + (y')^2 = (2x^2 + 1/(8x^2))^2, so the integrand is 2x^2 + 1/(8x^2). Integrate with the Fundamental Theorem: L = [(2/3)x^3 - 1/(8x)] from 1 to 3 = 209/12. The arc length is 209/12."
        constraints: "engineered curves of the form ax^n + b x^{-n} or (e^x + e^{-x})/2 where 1 + (y')^2 is a perfect square"
    diagnostic_exemplar:
      problem: 'Find the length of $y = \frac{x^3}{6} + \frac{1}{2x}$ for $1 \le x \le 2$.'
      answer: '$17/12$'
      solution_sketch: '$1 + \left(\frac{dy}{dx}\right)^2 = \left(\frac{x^2}{2} + \frac{1}{2x^2}\right)^2$ is a perfect square, so the length is $\left[\frac{x^3}{6} - \frac{1}{2x}\right]_1^2 = \frac{17}{12}$.'
    anki_seeds:
      - front: "Arc length formula for y = f(x) on [a, b]?"
        back: '$L = \int_a^b \sqrt{1 + f''(x)^2} \, dx$'
        type: basic
      - front: "Textbook arc length curves like x^3/3 + 1/(4x) are engineered so that..."
        back: '$1 + (y'')^2$ is a perfect square, letting the square root vanish'
        type: basic

  - id: surface-area-revolution
    name: Surface Area of Revolution
    core: false                # application of the definite integral
    difficulty: 0.72
    drill: false
    answer_kind: expression
    expected_time_secs: 240
    prerequisites:
      - id: arc-length
        weight: 0.7
        key: true
      - id: integration-substitution
        weight: 0.5
        key: true
      - id: circle-area-circumference
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: The surface area integral and cone checks
        key_prerequisites: [arc-length, circle-area-circumference]
        exemplars:
          - problem: 'The segment $y = x$, $0 \le x \le 1$, is rotated about the $x$-axis. Find the surface area.'
            answer: '$\pi \sqrt 2$'
            solution_sketch: '$S = 2\pi\int_0^1 x\sqrt{1 + 1}\,dx = 2\pi\sqrt{2} \cdot \frac{1}{2} = \pi\sqrt{2}$ — the lateral area $\pi r \ell$ of a cone with $r = 1$, $\ell = \sqrt{2}$.'
          - problem: 'The segment $y = 2x$, $0 \le x \le 1$, is rotated about the $x$-axis. Find the surface area and check it against the cone formula $\pi r \ell$.'
            answer: '$2\pi \sqrt 5$'
            solution_sketch: '$S = 2\pi\int_0^1 2x\sqrt{1 + 4}\,dx = 2\pi\sqrt{5}$; the cone has $r = 2$, $\ell = \sqrt{5}$, so $\pi r\ell = 2\pi\sqrt{5}$.'
          - problem: "The segment $y = 3x$, $0 \\le x \\le 2$, is rotated about the $x$-axis. Find the surface area."
            answer: "12pi sqrt(10)"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Object: the segment y = 3x from x = 0 to x = 2 rotated about the x-axis. Step 1 uses the arc-length element sqrt(1 + 9) = sqrt(10) together with the radius y = 3x, so the surface integral is 2pi times the integral of 3x sqrt(10) dx from 0 to 2, which equals 6pi sqrt(10) times 2. Step 2 checks the cone with r = 6 and l = sqrt(4 + 36) = 2sqrt(10), and pi r l = 12pi sqrt(10) confirms the integral. The surface area is 12pi sqrt(10)."
          - problem: "The segment $y = x$, $0 \\le y \\le 3$, is rotated about the $y$-axis. Find the surface area."
            answer: "9pi sqrt(2)"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Object: the segment y = x from y = 0 to y = 3 rotated about the y-axis. Step 1 uses x = y and the arc-length element sqrt(1 + (dx/dy)^2) dy = sqrt(2) dy, so the surface integral is 2pi times the integral of y sqrt(2) dy from 0 to 3, which is 2pi sqrt(2) times 9/2. Step 2 checks the cone with radius 3 and slant height 3sqrt(2), and pi r l = 9pi sqrt(2). The surface area is 9pi sqrt(2)."
          - problem: "The segment $y = 2x$, $0 \\le x \\le a$, is rotated about the $x$-axis and the resulting surface has area $4\\pi\\sqrt{5}$. Find the endpoint $a$."
            answer: "sqrt(2)"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Object: the segment y = 2x from x = 0 to x = a rotated about the x-axis. Step 1 uses the arc-length element sqrt(1 + 4) = sqrt(5) with the radius 2x, so the area is 2pi sqrt(5) times the integral of 2x dx from 0 to a, which equals 2pi a^2 sqrt(5). Step 2 sets 2pi a^2 sqrt(5) equal to 4pi sqrt(5), so a^2 = 2. The endpoint is sqrt(2)."
          - problem: "A lampshade is formed by rotating the segment $y = x/2$, $0 \\le x \\le 6$, about the $x$-axis. Find the surface area."
            answer: "9pi sqrt(5)"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Object: the segment y = x/2 from x = 0 to x = 6 rotated about the x-axis. Step 1 uses y' = 1/2, so the arc-length element is sqrt(1 + 1/4) = sqrt(5)/2 and the radius is x/2, and the surface integral is 2pi times sqrt(5)/4 times x^2/2 evaluated from 0 to 6, which equals 9pi sqrt(5). Step 2 checks the cone with r = 3 and l = 3sqrt(5), where pi r l = 9pi sqrt(5) agrees. The surface area is 9pi sqrt(5)."
        constraints: "line segments through the origin; verify against pi r l"
      - id: kp2
        name: Surfaces requiring substitution
        key_prerequisites: [arc-length, integration-substitution]
        exemplars:
          - problem: 'The curve $y = x^3$, $0 \le x \le 1$, is rotated about the $x$-axis. Find the surface area.'
            answer: 'pi*(10*sqrt(10) - 1)/27'
            solution_sketch: '$S = 2\pi\int_0^1 x^3\sqrt{1 + 9x^4}\,dx$; $u = 1 + 9x^4$ gives $\frac{2\pi}{36} \cdot \frac{2}{3}\left[u^{3/2}\right]_1^{10} = \frac{\pi}{27}(10^{3/2} - 1)$.'
          - problem: 'The curve $y = \sqrt{x}$, $0 \le x \le 1$, is rotated about the $x$-axis. Find the surface area.'
            answer: '$\pi(5\sqrt 5 - 1)/6$'
            solution_sketch: '$S = 2\pi\int_0^1 \sqrt{x}\sqrt{1 + \frac{1}{4x}}\,dx = 2\pi\int_0^1 \sqrt{x + \tfrac{1}{4}}\,dx = \frac{4\pi}{3}\left[(x + \tfrac{1}{4})^{3/2}\right]_0^1 = \frac{\pi}{6}(5\sqrt{5} - 1)$.'
          - problem: "The curve $y = \\frac{1}{3}x^3$, $0 \\le x \\le 1$, is rotated about the $x$-axis. Find the surface area."
            answer: "pi*(2*sqrt(2)-1)/9"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Write the surface-area formula: S = 2pi integral from 0 to 1 of (1/3)x^3 sqrt(1 + x^4) dx. Substitute u = 1 + x^4, so du = 4x^3 dx and x^3 dx = du/4. Then S = (2pi/3)(1/4)(2/3)[u^(3/2)] from 1 to 2 = (pi/9)(2sqrt(2) - 1). The surface area is pi*(2*sqrt(2)-1)/9."
          - problem: "The curve $y = x^2$, $0 \\le x \\le 2$, is rotated about the $y$-axis. Find the surface area."
            answer: "pi*(17*sqrt(17)-1)/6"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Write the y-axis surface-area formula: S = 2pi integral from 0 to 2 of x sqrt(1 + 4x^2) dx. Substitute u = 1 + 4x^2, so du = 8x dx and x dx = du/8. Then S = 2pi(1/8)(2/3)[u^(3/2)] from 1 to 17 = (pi/6)(17sqrt(17) - 1). The surface area is pi*(17*sqrt(17)-1)/6."
          - problem: "The curve $y = \\sqrt{x + 1}$, $0 \\le x \\le 3$, is rotated about the $x$-axis. Find the surface area."
            answer: "pi*(17*sqrt(17)-5*sqrt(5))/6"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Write the surface-area formula: S = 2pi integral from 0 to 3 of sqrt(x + 1) sqrt(1 + 1/(4(x + 1))) dx. The radical simplifies to sqrt(4x + 5)/2, so S = pi integral from 0 to 3 of sqrt(4x + 5) dx. Substitute u = 4x + 5, so du = 4 dx, giving S = (pi/4)(2/3)[u^(3/2)] from 5 to 17 = (pi/6)(17sqrt(17) - 5sqrt(5)). The surface area is pi*(17*sqrt(17)-5*sqrt(5))/6."
          - problem: "The curve $y = 2x^3$, $0 \\le x \\le 1$, is rotated about the $x$-axis. Find the surface area."
            answer: "pi*(37*sqrt(37)-1)/54"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Write the surface-area formula: S = 2pi integral from 0 to 1 of 2x^3 sqrt(1 + 36x^4) dx. Substitute u = 1 + 36x^4, so du = 144x^3 dx and x^3 dx = du/144. Then S = 4pi(1/144)(2/3)[u^(3/2)] from 1 to 37 = (pi/54)(37sqrt(37) - 1). The surface area is pi*(37*sqrt(37)-1)/54."
        constraints: "the radical must fall to a one-step u-substitution; answers exact with radicals"
      - id: kp3
        name: Sphere zones
        key_prerequisites: [arc-length, circle-area-circumference]
        exemplars:
          - problem: 'Rotate $y = \sqrt{4 - x^2}$, $-2 \le x \le 2$, about the $x$-axis and verify the sphere surface area formula for radius $2$.'
            answer: '$16\pi$'
            solution_sketch: '$\sqrt{1 + (y'')^2} = \frac{2}{\sqrt{4 - x^2}}$, so $S = 2\pi\int_{-2}^{2} \sqrt{4 - x^2}\cdot\frac{2}{\sqrt{4-x^2}}\,dx = 4\pi\int_{-2}^{2} dx = 16\pi = 4\pi(2)^2$.'
          - problem: 'Find the area of the zone of the sphere $y = \sqrt{4 - x^2}$ rotated about the $x$-axis for $0 \le x \le 1$.'
            answer: '$4\pi$'
            solution_sketch: 'The integrand collapses to the constant $4\pi$: $S = 4\pi(1 - 0) = 4\pi$ — zone area depends only on the slab width.'
          - problem: "The semicircle y = sqrt(9 - x^2), -3 <= x <= 3, is rotated about the x-axis. Find the area of the resulting sphere."
            answer: "36pi"
            answer_contract: {"kind": "exact"}
            solution_sketch: "For y = sqrt(9 - x^2) on [-3, 3], y' = -x/sqrt(9 - x^2). Then 1 + (y')^2 = 9/(9 - x^2), so sqrt(1 + (y')^2) = 3/sqrt(9 - x^2). The surface-area integrand becomes y sqrt(1 + (y')^2) = sqrt(9 - x^2) * 3/sqrt(9 - x^2) = 3, a constant. Use the surface-area formula: S = 2pi ∫_{-3}^{3} 3 dx = 2pi * 3 * 6 = 36pi. The area is 36pi."
          - problem: "The curve y = sqrt(9 - x^2), -3 <= x <= 3, is rotated about the x-axis. Find the area of the zone from x = 0 to x = 2."
            answer: "12pi"
            answer_contract: {"kind": "exact"}
            solution_sketch: "For y = sqrt(9 - x^2), y' = -x/sqrt(9 - x^2), so sqrt(1 + (y')^2) = 3/sqrt(9 - x^2). The integrand y sqrt(1 + (y')^2) collapses to the constant 3. Use the surface-area formula: S = 2pi ∫_{0}^{2} 3 dx = 2pi * 3 * (2 - 0) = 12pi. The area is 12pi."
          - problem: "A sphere of radius 3 is formed by rotating y = sqrt(9 - x^2), -3 <= x <= 3, about the x-axis. Find the surface area of the zone between x = -1 and x = 2."
            answer: "18pi"
            answer_contract: {"kind": "exact"}
            solution_sketch: "For y = sqrt(9 - x^2) on [-3, 3], y' = -x/sqrt(9 - x^2), so sqrt(1 + (y')^2) = 3/sqrt(9 - x^2). The integrand becomes y sqrt(1 + (y')^2) = 3, which is constant. The zone width is 2 - (-1) = 3. Use the surface-area formula: S = 2pi * 3 * 3 = 18pi. The surface area is 18pi."
          - problem: "A zone of the sphere y = sqrt(9 - x^2), -3 <= x <= 3, about the x-axis has surface area 6pi and spans x = a to x = a + h with h > 0. Find the width h."
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "For the sphere radius 3, the surface-area integrand y sqrt(1 + (y')^2) collapses to the constant 3. Thus a zone of width h has surface area S = 2pi * 3 * h = 6pi h. Set 6pi h = 6pi, so h = 1. The width is 1."
        constraints: "radius 2 or 3; highlight that the integrand becomes constant (Archimedes' hat-box)"
    diagnostic_exemplar:
      problem: 'The curve $y = \sqrt{x}$, $0 \le x \le 3$, is rotated about the $x$-axis. Find the surface area.'
      answer: '$\pi(13\sqrt{13} - 1)/6$'
      solution_sketch: '$S = 2\pi\int_0^3 \sqrt x\sqrt{1 + \frac{1}{4x}}\,dx = 2\pi\int_0^3 \sqrt{x + \tfrac14}\,dx = \frac{4\pi}{3}\left[\left(\tfrac{13}{4}\right)^{3/2} - \left(\tfrac14\right)^{3/2}\right]$.'
    anki_seeds:
      - front: "Surface area formula for y = f(x) >= 0 rotated about the x-axis?"
        back: '$S = 2\pi \int_a^b f(x)\sqrt{1 + f''(x)^2} \, dx$'
        type: basic
      - front: "Sphere zone fact (Archimedes): the area of a zone depends only on..."
        back: "the sphere's radius and the width of the slab — $S = 2\\pi R h$"
        type: basic

  - id: work-springs
    name: Work and Springs
    core: false                # physical application branch
    difficulty: 0.58
    drill: false
    answer_kind: numeric
    expected_time_secs: 150
    prerequisites:
      - id: definite-integrals-ftc
        weight: 0.7
        key: true
      - id: antiderivatives
        weight: 0.4
      - id: evaluating-formulas
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: Work done by a variable force
        key_prerequisites: [definite-integrals-ftc]
        exemplars:
          - problem: "A force F(x) = 4x^3 N acts along the x-axis. Find the work done moving an object from x = 1 m to x = 3 m. Give the exact work in joules."
            answer: "80"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Rule: for a variable force, work is the integral of F(x) from x = a to x = b. Here W = integral of 4x^3 from x = 1 to x = 3. An antiderivative of 4x^3 is x^4, by the power rule. By the Fundamental Theorem of Calculus, W = 3^4 - 1^4 = 81 - 1 = 80. The work is 80 J."
          - problem: "A constant force of 7 N acts along the x-axis. Find the work done moving an object from x = 0 m to x = 6 m. Give the exact work in joules."
            answer: "42"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Rule: for a constant force the work integral is W = integral of 7 from x = 0 to x = 6. This matches W = F d. Evaluate: W = 7(6) - 7(0) = 42. The work is 42 J."
          - problem: "A force F(x) = 6x^2 + 2x N acts along the x-axis. Find the work done moving an object from x = 0 m to x = 4 m. Give the exact work in joules."
            answer: "144"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Rule: W = integral of 6x^2 + 2x from x = 0 to x = 4. Use the power rule: an antiderivative is 2x^3 + x^2. By the Fundamental Theorem of Calculus, W = (2(4^3) + 4^2) - 0 = 128 + 16 = 144. The work is 144 J."
          - problem: "A force F(x) = 5x^4 N acts along the x-axis. Find the work done moving an object from x = 0 m to x = 2 m. Give the exact work in joules."
            answer: "32"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Rule: W = integral of 5x^4 from x = 0 to x = 2. Use the power rule: an antiderivative is x^5. By the Fundamental Theorem of Calculus, W = 2^5 - 0 = 32. The work is 32 J."
          - problem: "A force F(x) = 8x N acts along the x-axis. The work done moving an object from x = 0 m to x = b m is 36 J. Find the positive distance b in meters."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Rule: W = integral of 8x from x = 0 to x = b. Use the power rule: an antiderivative is 4x^2. By the Fundamental Theorem of Calculus, W = 4b^2. Set 4b^2 = 36, so b^2 = 9. The positive distance is b = 3 m."
          - problem: "A force F(x) = x^2 + 1 N acts along the x-axis. Find the work done moving an object from x = 0 m to x = 3 m. Give the exact work in joules."
            answer: "12"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Rule: W = integral of x^2 + 1 from x = 0 to x = 3. Use the power rule: an antiderivative is x^3/3 + x. By the Fundamental Theorem of Calculus, W = (27/3 + 3) - 0 = 9 + 3 = 12. The work is 12 J."
        constraints: "force given explicitly as a polynomial in x; SI units; one constant-force sanity check"
      - id: kp2
        name: Hooke's law and spring work
        key_prerequisites: [definite-integrals-ftc, evaluating-formulas]
        exemplars:
          - problem: "A spring stretches 0.4 m when a force of 16 N is applied. Find the work in joules needed to stretch the spring from its natural length to a displacement of 0.5 m beyond its natural length."
            answer: "5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full object is a force of 16 N at displacement x = 0.4 m, with target displacement x = 0.5 m. Hooke's law gives the spring constant k = F/x = 16/0.4 = 40 N/m, so the force is F(x) = 40x. The work integral is the integral from 0 to 0.5 of 40x dx. The Fundamental Theorem of Calculus gives W = 20x^2 from 0 to 0.5 = 20(0.25) = 5. The work is 5."
          - problem: "A spring has constant k = 160 N/m. Find the work in joules required to stretch it 0.5 m from its natural length."
            answer: "20"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full object is k = 160 N/m and displacement 0.5 m. Hooke's law gives force F(x) = 160x. The work is W = integral from 0 to 0.5 of 160x dx. The Fundamental Theorem of Calculus gives W = 80x^2 from 0 to 0.5 = 80(0.25) = 20. The work is 20."
          - problem: "A spring with constant k = 250 N/m is already stretched 0.2 m beyond its natural length. Find the work in joules done in stretching it further to 0.4 m beyond its natural length."
            answer: "15"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full object is k = 250 N/m with bounds x = 0.2 m and x = 0.4 m. Hooke's law gives F(x) = 250x. The work is W = integral from 0.2 to 0.4 of 250x dx. The Fundamental Theorem of Calculus gives W = 125x^2 from 0.2 to 0.4 = 125(0.16 - 0.04) = 15. The work is 15."
          - problem: "A spring stretches 0.2 m when a force of 40 N is applied. Find the work in joules needed to stretch it from a displacement of 0.1 m to a displacement of 0.3 m beyond its natural length."
            answer: "8"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full object is a force of 40 N at displacement x = 0.2 m, with bounds x = 0.1 m and x = 0.3 m. Hooke's law gives k = F/x = 40/0.2 = 200 N/m, so F(x) = 200x. The work integral is the integral from 0.1 to 0.3 of 200x dx. The Fundamental Theorem of Calculus gives W = 100x^2 from 0.1 to 0.3 = 100(0.09 - 0.01) = 8. The work is 8."
          - problem: "A spring has constant k = 80 N/m. Find the work in joules needed to stretch it from its natural length to 0.5 m beyond its natural length."
            answer: "10"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full object is k = 80 N/m and upper limit x = 0.5 m. Hooke's law gives F(x) = 80x. The work is W = integral from 0 to 0.5 of 80x dx. The Fundamental Theorem of Calculus gives W = 40x^2 from 0 to 0.5 = 40(0.25) = 10. The work is 10."
          - problem: "A spring has constant k = 150 N/m. Find the work in joules done in stretching it from 0.1 m to 0.5 m beyond its natural length."
            answer: "18"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full object is k = 150 N/m with bounds x = 0.1 m and x = 0.5 m. Hooke's law gives F(x) = 150x. The work is W = integral from 0.1 to 0.5 of 150x dx. The Fundamental Theorem of Calculus gives W = 75x^2 from 0.1 to 0.5 = 75(0.25 - 0.01) = 18. The work is 18."
        constraints: "SI units; k determined from one force-displacement pair; displacements chosen so answers are clean"
    diagnostic_exemplar:
      problem: 'A force of $15$ N stretches a spring $0.3$ m beyond its natural length. How much work is done stretching it from $0.2$ m to $0.5$ m beyond natural length?'
      answer: '$5.25$ J'
      answer_contract: {kind: none}
      solution_sketch: 'Hooke gives $k = 15/0.3 = 50$ N/m; then $W = \int_{0.2}^{0.5} 50x\,dx = 25(0.25 - 0.04)$.'
    anki_seeds:
      - front: "Work done by a variable force F(x) moving from a to b?"
        back: '$W = \int_a^b F(x) \, dx$'
        type: basic
      - front: "Hooke's law?"
        back: '$F = kx$ — the restoring force is proportional to the displacement from natural length'
        type: basic

  - id: average-value-work
    name: Average Value and Work
    core: false                # physical application; feeds only fluid force
    difficulty: 0.65
    drill: false
    answer_kind: numeric
    expected_time_secs: 240
    prerequisites:
      - id: work-springs
        weight: 0.7
        key: true
      - id: average-value-function
        weight: 0.5
        key: true
      - id: definite-integrals-ftc
        weight: 0.5
      - id: volume-prisms-cylinders
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: Average value and the MVT for integrals
        key_prerequisites: [average-value-function, definite-integrals-ftc]
        exemplars:
          - problem: 'Find the average value of $f(x) = \sin x$ on $[0, \pi]$.'
            answer: '$2/\pi$'
            solution_sketch: '$\frac{1}{\pi}\int_0^{\pi} \sin x\,dx = \frac{2}{\pi}$.'
          - problem: 'For $f(x) = x^2$ on $[0, 3]$, find the $c$ guaranteed by the Mean Value Theorem for integrals ($f(c) = f_{avg}$).'
            answer: '$c = \sqrt{3}$'
            solution_sketch: '$f_{avg} = \frac{1}{3}\int_0^3 x^2\,dx = 3$, so $c^2 = 3$ with $c \in [0, 3]$.'
          - problem: 'Find the average value of $f(x) = \frac{1}{x}$ on $[1, e]$.'
            answer: '$\frac{1}{e - 1}$'
            solution_sketch: '$\frac{1}{e - 1}\int_1^e \frac{dx}{x} = \frac{1}{e - 1}$.'
          - problem: "Find the average value of f(x) = cos x on [0, pi]."
            answer: "0"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The average value formula is 1/(b-a) times the definite integral of f. Here the integral of cos x on [0, pi] is sin(pi) - sin(0) = 0 by the Fundamental Theorem of Calculus. Divide by the interval length pi to get 0. The average value is 0."
          - problem: "For f(x) = 1/x on [1, e], find the c guaranteed by the Mean Value Theorem for integrals."
            answer: "e-1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The average value formula gives 1/(e-1) times the integral of 1/x on [1, e]. By the Fundamental Theorem of Calculus, the integral is ln(e) - ln(1) = 1. So the average value is 1/(e-1). The Mean Value Theorem for integrals sets 1/c equal to that average. Solving gives c = e-1. The guaranteed c is e-1."
          - problem: "For f(x) = x^2 on [1, 4], find the c guaranteed by the Mean Value Theorem for integrals."
            answer: "sqrt(7)"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The average value is 1/(4-1) times the integral of x^2 on [1,4]. By the Fundamental Theorem of Calculus, the integral is 64/3 - 1/3 = 21. Divide by 3 to get 7. The Mean Value Theorem for integrals requires c^2 = 7 with c in [1,4]. Thus c = sqrt(7). The guaranteed c is sqrt(7)."
        constraints: "f is sin/cos, 1/x, or a polynomial; interval endpoints small integers, e, or multiples of pi"
      - id: kp2
        name: Work lifting cables and chains
        key_prerequisites: [work-springs, definite-integrals-ftc]
        exemplars:
          - problem: 'A $10$ m cable of linear density $2$ kg/m hangs from a winch. Find the work to wind in the whole cable ($g = 9.8$ m/s$^2$).'
            answer: '$980$ J'
            answer_contract: {kind: none}
            solution_sketch: 'A slice at distance $x$ below the top weighs $2(9.8)\,dx$ and rises $x$: $W = \int_0^{10} 19.6x\,dx = 19.6 \cdot 50 = 980$ J.'
          - problem: 'A $20$ m chain of linear density $3$ kg/m hangs from a crane. Find the work to lift the entire chain to the top ($g = 9.8$ m/s$^2$).'
            answer: '$5880$ J'
            answer_contract: {kind: none}
            solution_sketch: '$W = \int_0^{20} 3(9.8)x\,dx = 29.4 \cdot 200 = 5880$ J.'
        constraints: "uniform cables/chains only; distances measured from the lift destination; g = 9.8"
      - id: kp3
        name: Work pumping liquids
        key_prerequisites: [work-springs, definite-integrals-ftc]
        exemplars:
          - problem: 'A cylindrical tank of radius $1$ m and height $2$ m is full of water (weight density $9800$ N/m$^3$). Find the work to pump all the water over the top rim.'
            answer: '$19600\pi$ J'
            answer_contract: {kind: none}
            solution_sketch: 'A slice at depth $x$ below the rim has volume $\pi(1)^2\,dx$ and rises $x$: $W = 9800\pi\int_0^2 x\,dx = 19600\pi$ J.'
          - problem: 'The same tank (radius $1$ m, height $2$ m) is only half full: water occupies depths $1$ to $2$ below the rim. Find the work to pump it all over the rim.'
            answer: '$14700\pi$ J'
            answer_contract: {kind: none}
            solution_sketch: '$W = 9800\pi\int_1^2 x\,dx = 9800\pi \cdot \frac{3}{2} = 14700\pi$ J.'
        constraints: "cylindrical tanks only; slices indexed by depth below the rim; weight density 9800 N/m^3"
    diagnostic_exemplar:
      problem: 'A cylindrical tank of radius $2$ m and height $3$ m is full of water (weight density $9800$ N/m$^3$). Find the work to pump all the water over the top rim.'
      answer: '$176400\pi$ J'
      answer_contract: {kind: none}
      solution_sketch: 'A slab at depth $y$ below the rim has weight $9800 \cdot 4\pi\,dy$ and is lifted $y$: $W = 39200\pi\int_0^3 y\,dy = 176400\pi$.'
    anki_seeds:
      - front: "Average value of f on [a, b]?"
        back: '$f_{avg} = \frac{1}{b-a} \int_a^b f(x) \, dx$'
        type: basic
      - front: "Setting up a pumping problem: each slice's work contribution is..."
        back: "(weight density) x (slice volume) x (distance the slice must rise)"
        type: basic

  - id: fluid-force
    name: Hydrostatic Force
    core: false                # physical application of the definite integral
    difficulty: 0.66
    drill: false
    answer_kind: numeric
    expected_time_secs: 240
    prerequisites:
      - id: average-value-work
        weight: 0.6
        key: true
      - id: definite-integrals-ftc
        weight: 0.5
        key: true
      - id: area-triangles-quadrilaterals
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: Pressure and force on horizontal surfaces
        key_prerequisites: [definite-integrals-ftc]
        exemplars:
          - problem: 'Water has weight density $9800$ N/m$^3$. Find the fluid force on the bottom of a pool $2$ m deep with bottom area $12$ m$^2$.'
            answer: '$235200$ N'
            answer_contract: {kind: none}
            solution_sketch: 'Pressure at depth $2$ is $9800 \cdot 2 = 19600$ Pa; force $= 19600 \cdot 12 = 235200$ N.'
          - problem: 'State the fluid pressure at depth $d$ in a fluid of weight density $\rho g$.'
            answer: '$P = \rho g \, d$ (pressure grows linearly with depth)'
            answer_contract: {kind: none}
            solution_sketch: 'The weight of the fluid column of height $d$ over a unit area is $\rho g d$.'
        constraints: "horizontal surfaces: force = pressure x area, no integral needed; weight density 9800 N/m^3"
      - id: kp2
        name: Force on vertical rectangular plates
        key_prerequisites: [average-value-work, definite-integrals-ftc]
        exemplars:
          - problem: 'A rectangular plate $2$ m wide is submerged vertically with its top edge $1$ m and bottom edge $3$ m below the surface. Find the fluid force on one side ($9800$ N/m$^3$).'
            answer: '$78400$ N'
            answer_contract: {kind: none}
            solution_sketch: 'A strip at depth $y$ has area $2\,dy$ and pressure $9800y$: $F = 9800\int_1^3 2y\,dy = 9800 \cdot 8 = 78400$ N.'
          - problem: 'A dam gate is a rectangle $3$ m wide whose top edge lies at the water surface and whose bottom edge is $2$ m deep. Find the force on the gate.'
            answer: '$58800$ N'
            answer_contract: {kind: none}
            solution_sketch: '$F = 9800\int_0^2 3y\,dy = 9800 \cdot 6 = 58800$ N.'
        constraints: "strips indexed by depth y; width constant; depths are small integers"
      - id: kp3
        name: Plates with varying width
        key_prerequisites: [average-value-work, area-triangles-quadrilaterals]
        exemplars:
          - problem: 'A triangular plate has its base of $6$ m at the water surface and its apex $3$ m directly below the base''s midpoint. Find the fluid force on one side ($9800$ N/m$^3$).'
            answer: '$88200$ N'
            answer_contract: {kind: none}
            solution_sketch: 'Width at depth $y$ is $6 - 2y$ (linear from $6$ to $0$): $F = 9800\int_0^3 y(6 - 2y)\,dy = 9800(27 - 18) = 88200$ N.'
          - problem: 'A circular plate of radius $1$ m is submerged vertically with its center $3$ m deep. Use the centroid shortcut $F = \rho g \bar{h} A$ to find the force.'
            answer: '$29400\pi$ N'
            answer_contract: {kind: none}
            solution_sketch: 'By symmetry the average depth over the plate is the center''s depth: $F = 9800 \cdot 3 \cdot \pi(1)^2 = 29400\pi$ N.'
        constraints: "width w(y) linear in depth, or the centroid shortcut for symmetric plates; state w(y) explicitly"
    diagnostic_exemplar:
      problem: 'A triangular plate has its base of $4$ m at the water surface and its apex $3$ m directly below the midpoint of the base. Find the fluid force on one side ($9800$ N/m$^3$).'
      answer: '$58800$ N'
      answer_contract: {kind: none}
      solution_sketch: 'The width at depth $y$ is $4(1 - y/3)$, so $F = 9800\int_0^3 y\cdot 4\left(1 - \frac{y}{3}\right)dy = 39200 \cdot \frac{3}{2}$.'
    anki_seeds:
      - front: "Hydrostatic force on a vertical plate (strip at depth y, width w(y))?"
        back: '$F = \rho g \int y \, w(y) \, dy$ over the plate''s depth range'
        type: basic
      - front: "Centroid shortcut for hydrostatic force?"
        back: '$F = \rho g \bar{h} A$ — weight density times centroid depth times plate area'
        type: basic

  - id: center-of-mass
    name: Moments and Center of Mass
    core: false                # physical application of the definite integral
    difficulty: 0.7
    drill: false
    answer_kind: numeric
    expected_time_secs: 270
    prerequisites:
      - id: area-between-curves
        weight: 0.7
        key: true
      - id: definite-integrals-ftc
        weight: 0.5
        key: true
      - id: weighted-averages
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: Discrete point masses
        key_prerequisites: [weighted-averages]
        exemplars:
          - problem: 'Masses of $2$, $3$, and $5$ kg sit at $x = 1$, $4$, and $6$. Find the center of mass.'
            answer: '$\bar{x} = 22/5$'
            answer_contract: {kind: none}
            solution_sketch: '$\bar{x} = \frac{2(1) + 3(4) + 5(6)}{2 + 3 + 5} = \frac{44}{10} = \frac{22}{5}$.'
          - problem: 'Masses of $1$ and $3$ kg sit at $x = 0$ and $x = 4$. Where is the balance point?'
            answer: '$\bar{x} = 3$'
            answer_contract: {kind: none}
            solution_sketch: '$\bar{x} = \frac{0 + 12}{4} = 3$ — closer to the heavier mass.'
        constraints: "2-4 point masses with integer positions and masses; answer a fraction or integer"
      - id: kp2
        name: Centroid of a region under a curve
        key_prerequisites: [definite-integrals-ftc, area-between-curves]
        exemplars:
          - problem: 'Find the centroid of the region under $y = x^2$ for $0 \le x \le 1$.'
            answer: '$\left(\frac{3}{4}, \frac{3}{10}\right)$'
            solution_sketch: '$A = \frac{1}{3}$; $\bar{x} = 3\int_0^1 x\cdot x^2\,dx = \frac{3}{4}$; $\bar{y} = 3\int_0^1 \frac{(x^2)^2}{2}\,dx = \frac{3}{10}$.'
          - problem: 'Find $\bar{y}$ for the semicircular region under $y = \sqrt{1 - x^2}$.'
            answer: '$\bar{y} = \frac{4}{3\pi}$'
            answer_contract: {kind: none}
            solution_sketch: '$A = \frac{\pi}{2}$; $\bar{y} = \frac{2}{\pi}\int_{-1}^{1} \frac{1 - x^2}{2}\,dx = \frac{2}{\pi}\cdot\frac{2}{3} = \frac{4}{3\pi}$ ($\bar{x} = 0$ by symmetry).'
        constraints: "regions under a single polynomial or circular curve; use symmetry to kill one coordinate where possible"
      - id: kp3
        name: Centroid between two curves
        key_prerequisites: [area-between-curves, definite-integrals-ftc]
        exemplars:
          - problem: 'Find the centroid of the region between $y = x$ and $y = x^2$.'
            answer: '$\left(\frac{1}{2}, \frac{2}{5}\right)$'
            solution_sketch: '$A = \frac{1}{6}$; $\bar{x} = 6\int_0^1 x(x - x^2)\,dx = \frac{1}{2}$; $\bar{y} = 6\int_0^1 \frac{x^2 - x^4}{2}\,dx = \frac{2}{5}$.'
          - problem: 'Verify by integration that the centroid of the triangle with vertices $(0,0)$, $(1,0)$, $(0,1)$ has $\bar{x} = 1/3$.'
            answer: '$\bar{x} = 1/3$'
            answer_contract: {kind: none}
            solution_sketch: 'Region under $y = 1 - x$: $A = \frac{1}{2}$; $\bar{x} = 2\int_0^1 x(1 - x)\,dx = 2(\frac{1}{2} - \frac{1}{3}) = \frac{1}{3}$ — matching the vertex-average rule.'
        constraints: "curves intersect at x = 0 and x = 1; moments integrate as polynomials"
    diagnostic_exemplar:
      problem: 'Find the centroid of the region between $y = \sqrt{x}$ and $y = x^2$.'
      answer: '$\left(\frac{9}{20}, \frac{9}{20}\right)$'
      solution_sketch: 'The area is $\frac13$; $\bar x = 3\int_0^1 x(\sqrt x - x^2)dx = \frac{9}{20}$, and the region is symmetric in $y = x$, so $\bar y = \bar x$.'
    anki_seeds:
      - front: "Centroid formulas for the region under y = f(x) on [a, b] (area A)?"
        back: '$\bar{x} = \frac{1}{A}\int_a^b x f(x)\,dx$, $\quad \bar{y} = \frac{1}{A}\int_a^b \frac{f(x)^2}{2}\,dx$'
        type: basic
      - front: "Center of mass of point masses m_i at x_i?"
        back: '$\bar{x} = \frac{\sum m_i x_i}{\sum m_i}$ (total moment over total mass)'
        type: basic
