unit: integration-applications
course: calculus-2
module: "Applications of Integration"
topics:
  - id: area-between-curves-x
    name: Area Between Curves on a Given Interval
    core: true
    difficulty: 0.52
    drill: false
    answer_kind: expression
    expected_time_secs: 120
    prerequisites:
      - id: definite-integrals-ftc
        weight: 0.8
        key: true
      - id: area-under-a-curve
        weight: 0.6
        key: true
      - id: antiderivatives
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: Top minus bottom, polynomial curves
        key_prerequisites: [definite-integrals-ftc, area-under-a-curve]
        exemplars:
          - problem: 'Find the area between $y = x$ and $y = x^2$ for $0 \le x \le 1$.'
            answer: '$1/6$'
            solution_sketch: 'On $[0,1]$, $x \ge x^2$: $\int_0^1 (x - x^2)\,dx = \frac{1}{2} - \frac{1}{3} = \frac{1}{6}$.'
          - problem: 'Find the area between $y = x^2 + 1$ and $y = x$ for $0 \le x \le 2$.'
            answer: '$8/3$'
            solution_sketch: '$x^2 + 1 > x$ everywhere: $\int_0^2 (x^2 - x + 1)\,dx = \frac{8}{3} - 2 + 2 = \frac{8}{3}$.'
        constraints: "interval given explicitly; top curve does not change on the interval; polynomial integrands with small integer coefficients"
      - id: kp2
        name: Exponential and trig curves
        key_prerequisites: [definite-integrals-ftc, antiderivatives]
        exemplars:
          - problem: 'Find the area between $y = e^x$ and $y = 1$ for $0 \le x \le 1$.'
            answer: '$e - 2$'
            solution_sketch: '$\int_0^1 (e^x - 1)\,dx = (e - 1) - 1 = e - 2$.'
          - problem: 'Find the area between $y = e^x$ and $y = e^{-x}$ for $0 \le x \le 1$.'
            answer: '$e + 1/e - 2$'
            solution_sketch: '$e^x \ge e^{-x}$ for $x \ge 0$: $[e^x + e^{-x}]_0^1 = (e + e^{-1}) - 2$.'
          - problem: 'Find the area between $y = \sin x$ and the $x$-axis for $0 \le x \le \pi$.'
            answer: "2"
            solution_sketch: '$\int_0^{\pi} \sin x\,dx = [-\cos x]_0^{\pi} = 2$.'
        constraints: "integrands limited to e^{ax}, sin x, cos x; the ordering of the curves must not change on the interval"
    diagnostic_exemplar:
      problem: 'Find the area between $y = e^x$ and $y = x$ for $0 \le x \le 1$.'
      answer: '$e - 3/2$'
      solution_sketch: '$\int_0^1 (e^x - x)\,dx = [e^x - x^2/2]_0^1 = (e - \tfrac12) - 1$.'
    anki_seeds:
      - front: "Area between curves f (top) and g (bottom) on [a, b]?"
        back: '$\int_a^b (f(x) - g(x)) \, dx$'
        type: basic
      - front: "Before integrating f - g for an area, first check..."
        back: "which curve is on top throughout the interval (the integrand must stay nonnegative)"
        type: basic

  - id: area-between-curves
    name: Area Between Curves
    core: true
    difficulty: 0.55
    drill: false
    answer_kind: expression
    expected_time_secs: 150
    prerequisites:
      - id: area-between-curves-x
        weight: 0.8
        key: true
      - id: definite-integrals-ftc
        weight: 0.5
      - id: quadratic-graphs-vertex
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: Find the intersection points first
        key_prerequisites: [area-between-curves-x, quadratic-graphs-vertex]
        exemplars:
          - problem: 'Find the area of the region enclosed by $y = x^2$ and $y = x + 2$.'
            answer: '$9/2$'
            solution_sketch: '$x^2 = x + 2$ at $x = -1, 2$. $\int_{-1}^{2} (x + 2 - x^2)\,dx = [\frac{x^2}{2} + 2x - \frac{x^3}{3}]_{-1}^{2} = \frac{10}{3} + \frac{7}{6} = \frac{9}{2}$.'
          - problem: 'Find the area of the region enclosed by $y = \sqrt{x}$ and $y = x$.'
            answer: '$1/6$'
            solution_sketch: 'Curves meet at $x = 0, 1$; $\int_0^1 (\sqrt{x} - x)\,dx = \frac{2}{3} - \frac{1}{2} = \frac{1}{6}$.'
          - problem: 'Find the area of the region enclosed by $y = x^2$ and $y = 2x$.'
            answer: '$4/3$'
            solution_sketch: 'Intersections at $x = 0, 2$; $\int_0^2 (2x - x^2)\,dx = 4 - \frac{8}{3} = \frac{4}{3}$.'
        constraints: "intersections solvable by factoring a quadratic with integer roots (or x = 0, 1 for root curves)"
      - id: kp2
        name: Crossing curves (split at the crossing)
        key_prerequisites: [area-between-curves-x]
        exemplars:
          - problem: 'Find the total area between $y = x^3$ and $y = x$ for $-1 \le x \le 1$.'
            answer: '$1/2$'
            solution_sketch: 'The curves cross at $x = 0$; by symmetry the area is $2\int_0^1 (x - x^3)\,dx = 2(\frac{1}{2} - \frac{1}{4}) = \frac{1}{2}$.'
          - problem: 'Find the total area between $y = \cos x$ and $y = \sin x$ for $0 \le x \le \pi/2$.'
            answer: '$2\sqrt 2 - 2$'
            solution_sketch: 'They cross at $x = \pi/4$. $\int_0^{\pi/4}(\cos x - \sin x)\,dx = \sqrt{2} - 1$; the second piece equals the first by symmetry, so the total is $2\sqrt{2} - 2$.'
        constraints: "at most one sign change inside the interval; split the integral there and add absolute areas"
      - id: kp3
        name: Integrating with respect to y
        key_prerequisites: [area-between-curves-x]
        exemplars:
          - problem: 'Find the area of the region enclosed by $x = y^2$ and $x = y + 2$.'
            answer: '$9/2$'
            solution_sketch: 'Integrate in $y$: $y^2 = y + 2$ at $y = -1, 2$; $\int_{-1}^{2} (y + 2 - y^2)\,dy = \frac{9}{2}$.'
          - problem: 'Find the area of the region enclosed by $x = y^2$ and $x = 2 - y^2$.'
            answer: '$8/3$'
            solution_sketch: '$y^2 = 2 - y^2$ at $y = \pm 1$; $\int_{-1}^{1} (2 - 2y^2)\,dy = 4 - \frac{4}{3} = \frac{8}{3}$.'
        constraints: "y-integration regions bounded by parabolas opening sideways and lines; intersections have integer y-coordinates"
    diagnostic_exemplar:
      problem: 'Find the area of the region enclosed by $x = y^2$ and $x = y + 6$.'
      answer: '$125/6$'
      solution_sketch: 'The curves meet at $y = -2$ and $y = 3$; integrating in $y$, $\int_{-2}^{3}(y + 6 - y^2)\,dy = \frac{125}{6}$.'
    anki_seeds:
      - front: "If two curves cross inside the interval, the total area requires..."
        back: "splitting the integral at each crossing and integrating |f - g| piecewise"
        type: basic
      - front: "When is integrating with respect to y the better choice for an area?"
        back: "When the region's boundaries are functions of y (e.g. sideways parabolas) — right curve minus left curve, dy"
        type: basic

  - id: consumer-producer-surplus
    name: Consumer and Producer Surplus
    core: false                # economics application of the definite integral
    difficulty: 0.58
    drill: false
    answer_kind: multi-step
    expected_time_secs: 180
    prerequisites:
      - id: area-between-curves-x
        weight: 0.7
        key: true
      - id: definite-integrals-ftc
        weight: 0.5
        key: true
      - id: systems-substitution
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: Consumer surplus at a given price
        key_prerequisites: [area-between-curves-x, definite-integrals-ftc]
        exemplars:
          - problem: 'The demand curve is $p = 50 - q$. At market price $p = 20$, find the consumer surplus.'
            answer: "450"
            solution_sketch: '$q^* = 30$ at $p = 20$. $CS = \int_0^{30} (50 - q - 20)\,dq = 900 - 450 = 450$.'
          - problem: 'The demand curve is $p = 30 - q$. At market price $p = 10$, find the consumer surplus.'
            answer: "200"
            solution_sketch: '$q^* = 20$; $CS = \int_0^{20} (20 - q)\,dq = 400 - 200 = 200$.'
        constraints: "linear or quadratic demand with integer intercepts; market quantity solves to an integer"
      - id: kp2
        name: Producer surplus at a given price
        key_prerequisites: [area-between-curves-x, definite-integrals-ftc]
        exemplars:
          - problem: 'The supply curve is $p = 2q$. At market price $p = 20$, find the producer surplus.'
            answer: "100"
            solution_sketch: '$q^* = 10$; $PS = \int_0^{10} (20 - 2q)\,dq = 200 - 100 = 100$.'
          - problem: 'Explain what producer surplus measures geometrically.'
            answer: 'the area between the market-price line and the supply curve from $q = 0$ to the market quantity'
            solution_sketch: 'Producers willing to sell below the market price gain the gap; summing the gaps over all units is the area $\int_0^{q^*}(p^* - s(q))\,dq$.'
        constraints: "linear supply through small integer coefficients; one conceptual identification exemplar allowed"
      - id: kp3
        name: Equilibrium, then both surpluses
        key_prerequisites: [systems-substitution, definite-integrals-ftc]
        exemplars:
          - problem: 'Demand is $p = 48 - q^2$ and supply is $p = 2q^2$. Find the equilibrium point and the consumer surplus.'
            answer: '$q^* = 4$, $p^* = 32$; $CS = 128/3$'
            solution_sketch: '$48 - q^2 = 2q^2$ gives $q^* = 4$, $p^* = 32$. $CS = \int_0^4 (48 - q^2 - 32)\,dq = 64 - \frac{64}{3} = \frac{128}{3}$.'
          - problem: 'With demand $p = 48 - q^2$ and supply $p = 2q^2$ (equilibrium $q^* = 4$, $p^* = 32$), find the producer surplus.'
            answer: '$256/3$'
            solution_sketch: '$PS = \int_0^4 (32 - 2q^2)\,dq = 128 - \frac{128}{3} = \frac{256}{3}$.'
        constraints: "equilibrium solvable by setting demand = supply and factoring; quantities and prices come out as integers"
    diagnostic_exemplar:
      problem: 'Demand is $p = 27 - q^2$ and supply is $p = 2q^2$. Find the equilibrium point and the consumer surplus.'
      answer: '$q^* = 3$, $p^* = 18$; $CS = 18$'
      solution_sketch: '$27 - q^2 = 2q^2$ gives $q^* = 3$ and $p^* = 18$; then $CS = \int_0^3 (27 - q^2)\,dq - 3 \cdot 18 = 72 - 54$.'
    anki_seeds:
      - front: "Consumer surplus formula (demand d(q), market price p*, quantity q*)?"
        back: '$CS = \int_0^{q^*} (d(q) - p^*) \, dq$ — the area between the demand curve and the price line'
        type: basic
      - front: "Producer surplus formula (supply s(q), market price p*, quantity q*)?"
        back: '$PS = \int_0^{q^*} (p^* - s(q)) \, dq$ — the area between the price line and the supply curve'
        type: basic

  - id: volumes-known-cross-sections
    name: Volumes by Known Cross Sections
    core: false                # head of the solids-of-revolution applications branch
    difficulty: 0.58
    drill: false
    answer_kind: expression
    expected_time_secs: 210
    prerequisites:
      - id: definite-integrals-ftc
        weight: 0.7
        key: true
      - id: area-between-curves-x
        weight: 0.5
        key: true
      - id: area-triangles-quadrilaterals
        weight: 0.3
      - id: circle-area-circumference
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: Square cross sections
        key_prerequisites: [definite-integrals-ftc, area-between-curves-x]
        exemplars:
          - problem: 'The base of a solid is the region under $y = \sqrt{x}$ for $0 \le x \le 4$. Cross sections perpendicular to the $x$-axis are squares with side running from the $x$-axis to the curve. Find the volume.'
            answer: "8"
            solution_sketch: 'Side $= \sqrt{x}$, so $A(x) = x$ and $V = \int_0^4 x\,dx = 8$.'
          - problem: 'The base of a solid is the region between $y = 1 - x^2$ and the $x$-axis. Cross sections perpendicular to the $x$-axis are squares. Find the volume.'
            answer: '$16/15$'
            solution_sketch: '$V = \int_{-1}^{1} (1 - x^2)^2\,dx = 2\left(1 - \frac{2}{3} + \frac{1}{5}\right) = \frac{16}{15}$.'
        constraints: "side length equals the height of the base region; (side)^2 integrates as a polynomial"
      - id: kp2
        name: Semicircular and triangular cross sections
        key_prerequisites: [circle-area-circumference, area-triangles-quadrilaterals]
        exemplars:
          - problem: 'The base of a solid is the region under $y = \sqrt{x}$ for $0 \le x \le 4$. Cross sections perpendicular to the $x$-axis are semicircles with diameter running from the $x$-axis to the curve. Find the volume.'
            answer: '$\pi$'
            solution_sketch: 'Radius $= \frac{\sqrt{x}}{2}$, area $= \frac{\pi x}{8}$: $V = \frac{\pi}{8}\int_0^4 x\,dx = \pi$.'
          - problem: 'The base of a solid is the region between $y = 1 - x^2$ and the $x$-axis. Cross sections perpendicular to the $x$-axis are equilateral triangles. Find the volume.'
            answer: '$4\sqrt 3/15$'
            solution_sketch: 'Area of an equilateral triangle with side $s$ is $\frac{\sqrt{3}}{4}s^2$: $V = \frac{\sqrt{3}}{4}\int_{-1}^{1}(1 - x^2)^2\,dx = \frac{\sqrt{3}}{4}\cdot\frac{16}{15} = \frac{4\sqrt{3}}{15}$.'
        constraints: "cross-section area = (known shape constant) x (base width)^2; semicircle uses the width as diameter"
      - id: kp3
        name: Cross sections perpendicular to the y-axis
        key_prerequisites: [definite-integrals-ftc, area-between-curves-x]
        exemplars:
          - problem: 'The base of a solid is the region between the $y$-axis and $x = 4 - y^2$ for $-2 \le y \le 2$. Cross sections perpendicular to the $y$-axis are squares. Find the volume.'
            answer: '$512/15$'
            solution_sketch: '$V = \int_{-2}^{2} (4 - y^2)^2\,dy = 2\left(32 - \frac{64}{3} + \frac{32}{5}\right) = \frac{512}{15}$.'
          # The stem said "set up (do not evaluate)" while storing the evaluated value, so a
          # learner who followed the instruction was graded wrong. kp3's own constraints say
          # "evaluate to an exact rational", and an unevaluated integral is unparseable under
          # this topic's `expression` kind — so the instruction was the anomaly, not the answer.
          - problem: 'Find the volume of a solid whose base is the region between $x = y^2$ and $x = 1$, with square cross sections perpendicular to the $y$-axis.'
            answer: '16/15'
            solution_sketch: 'Slice at height $y$: side $= 1 - y^2$, so $A(y) = (1 - y^2)^2$; integrate over $-1 \le y \le 1$.'
        constraints: "slices taken in y; width read as right curve minus left curve; evaluate to an exact rational"
    diagnostic_exemplar:
      problem: 'The base of a solid is the region between the $y$-axis and $x = 1 - y^2$ for $-1 \le y \le 1$. Cross sections perpendicular to the $y$-axis are squares. Find the volume.'
      answer: '$16/15$'
      solution_sketch: 'The side at height $y$ is $1 - y^2$, so $V = \int_{-1}^{1}(1 - y^2)^2\,dy = \frac{16}{15}$.'
    anki_seeds:
      - front: "Volume of a solid with cross-sectional area A(x) from a to b?"
        back: '$V = \int_a^b A(x) \, dx$'
        type: basic
      - front: "Semicircular cross section on a diameter of length w: its area?"
        back: '$\frac{\pi w^2}{8}$ (radius $w/2$, half of $\pi r^2$)'
        type: basic

  - id: volumes-disks
    name: Volumes by Disks
    core: false                # solids-of-revolution applications branch
    difficulty: 0.6
    drill: false
    answer_kind: expression
    expected_time_secs: 210
    prerequisites:
      - id: volumes-known-cross-sections
        weight: 0.7
        key: true
      - id: definite-integrals-ftc
        weight: 0.5
        key: true
      - id: circle-area-circumference
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: Disks about the x-axis
        key_prerequisites: [volumes-known-cross-sections, circle-area-circumference]
        exemplars:
          - problem: 'The region under $y = \sqrt{x}$ for $0 \le x \le 4$ is rotated about the $x$-axis. Find the volume.'
            answer: '$8\pi$'
            solution_sketch: '$V = \pi\int_0^4 (\sqrt{x})^2\,dx = \pi\int_0^4 x\,dx = 8\pi$.'
          - problem: 'The region under $y = x^2$ for $0 \le x \le 1$ is rotated about the $x$-axis. Find the volume.'
            answer: '$\pi/5$'
            solution_sketch: '$V = \pi\int_0^1 x^4\,dx = \frac{\pi}{5}$.'
          - problem: 'The region under $y = e^x$ for $0 \le x \le 1$ is rotated about the $x$-axis. Find the volume.'
            answer: '$\pi(e^2 - 1)/2$'
            solution_sketch: '$V = \pi\int_0^1 e^{2x}\,dx = \frac{\pi}{2}(e^2 - 1)$.'
        constraints: "region under a single curve down to the axis of rotation; radius^2 integrates as a polynomial or e^{2x}"
      - id: kp2
        name: Disks about the y-axis
        key_prerequisites: [volumes-known-cross-sections, definite-integrals-ftc]
        exemplars:
          - problem: 'The region bounded by $y = x^2$, $y = 1$, and $x = 0$ (with $x \ge 0$) is rotated about the $y$-axis. Find the volume.'
            answer: '$\pi/2$'
            solution_sketch: 'Slice horizontally: radius $x = \sqrt{y}$, so $V = \pi\int_0^1 y\,dy = \frac{\pi}{2}$.'
          - problem: 'The region bounded by $y = x^3$, $y = 8$, and $x = 0$ (with $x \ge 0$) is rotated about the $y$-axis. Find the volume.'
            answer: '$96\pi/5$'
            solution_sketch: 'Radius $x = y^{1/3}$: $V = \pi\int_0^8 y^{2/3}\,dy = \pi\cdot\frac{3}{5}\cdot 32 = \frac{96\pi}{5}$.'
        constraints: "invert the curve to x as a function of y; y-bounds are small integers"
      - id: kp3
        name: Checking against known solids
        key_prerequisites: [volumes-known-cross-sections, circle-area-circumference]
        exemplars:
          - problem: 'Rotate $y = \sqrt{9 - x^2}$ about the $x$-axis and verify the sphere volume formula for radius $3$.'
            answer: '$36\pi$'
            solution_sketch: '$V = \pi\int_{-3}^{3} (9 - x^2)\,dx = \pi(54 - 18) = 36\pi = \frac{4}{3}\pi(3)^3$.'
          - problem: 'Rotate $y = \frac{r}{h}x$ for $0 \le x \le h$ about the $x$-axis and derive the cone volume formula.'
            answer: '$\pi r^2 h/3$'
            solution_sketch: '$V = \pi\int_0^h \frac{r^2}{h^2}x^2\,dx = \pi\frac{r^2}{h^2}\cdot\frac{h^3}{3} = \frac{\pi r^2 h}{3}$.'
        constraints: "sphere and cone derivations only; answers must match the geometry formulas"
    diagnostic_exemplar:
      problem: 'The region bounded by $y = x^2$, $y = 4$, and $x = 0$ (with $x \ge 0$) is rotated about the $y$-axis. Find the volume.'
      answer: '$8\pi$'
      solution_sketch: 'Invert to $x^2 = y$ and stack disks in $y$: $V = \pi\int_0^4 y\,dy = 8\pi$.'
    anki_seeds:
      - front: "Disk method volume formula about the x-axis?"
        back: '$V = \pi \int_a^b f(x)^2 \, dx$ (each slice is a disk of radius f(x))'
        type: basic
      - front: "Disk method about the y-axis: what must you do to the curve first?"
        back: "Solve for x as a function of y; then V = pi times the integral of x(y)^2 dy"
        type: basic

  - id: volumes-disks-washers
    name: Volumes by Disks and Washers
    core: false                # solids-of-revolution applications branch
    difficulty: 0.62
    drill: false
    answer_kind: expression
    expected_time_secs: 240
    prerequisites:
      - id: volumes-disks
        weight: 0.8
        key: true
      - id: area-between-curves
        weight: 0.6
        key: true
      - id: definite-integrals-ftc
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: Washers about the x-axis
        key_prerequisites: [volumes-disks, area-between-curves]
        exemplars:
          - problem: 'The region between $y = x$ and $y = x^2$ is rotated about the $x$-axis. Find the volume.'
            answer: '$2\pi/15$'
            solution_sketch: '$V = \pi\int_0^1 (x^2 - x^4)\,dx = \pi(\frac{1}{3} - \frac{1}{5}) = \frac{2\pi}{15}$.'
          - problem: 'The region between $y = \sqrt{x}$ and $y = x$ is rotated about the $x$-axis. Find the volume.'
            answer: '$\pi/6$'
            solution_sketch: 'Outer radius $\sqrt{x}$, inner $x$: $V = \pi\int_0^1 (x - x^2)\,dx = \frac{\pi}{6}$.'
        constraints: "curves intersect at x = 0 and x = 1 (or other integer bounds); subtract squared radii, never square the difference"
      - id: kp2
        name: Washers about the y-axis
        key_prerequisites: [volumes-disks, area-between-curves]
        exemplars:
          - problem: 'The region between $y = x^2$ and $y = \sqrt{x}$ is rotated about the $y$-axis. Find the volume.'
            answer: '$3\pi/10$'
            solution_sketch: 'At height $y$: outer $x = \sqrt{y}$, inner $x = y^2$. $V = \pi\int_0^1 (y - y^4)\,dy = \pi(\frac{1}{2} - \frac{1}{5}) = \frac{3\pi}{10}$.'
          - problem: 'The region between $y = \sqrt{x}$ and $y = \frac{x}{2}$ is rotated about the $y$-axis. Find the volume.'
            answer: '$64\pi/15$'
            solution_sketch: 'For $0 \le y \le 2$: outer $x = 2y$, inner $x = y^2$. $V = \pi\int_0^2 (4y^2 - y^4)\,dy = \pi(\frac{32}{3} - \frac{32}{5}) = \frac{64\pi}{15}$.'
        constraints: "invert both curves to x as functions of y; intersections at integer y-values"
      - id: kp3
        name: Rotation about other horizontal lines
        key_prerequisites: [volumes-disks, area-between-curves]
        exemplars:
          - problem: 'The region between $y = \sqrt{x}$ and $y = 1$ for $0 \le x \le 1$ is rotated about the line $y = 1$. Find the volume.'
            answer: '$\pi/6$'
            solution_sketch: 'Radius $= 1 - \sqrt{x}$: $V = \pi\int_0^1 (1 - \sqrt{x})^2\,dx = \pi\int_0^1 (1 - 2\sqrt{x} + x)\,dx = \pi(1 - \frac{4}{3} + \frac{1}{2}) = \frac{\pi}{6}$.'
          - problem: 'The region between $y = x^2$ and $y = 1$ is rotated about the line $y = 1$. Find the volume.'
            answer: '$16\pi/15$'
            solution_sketch: 'Radius $= 1 - x^2$: $V = \pi\int_{-1}^{1} (1 - x^2)^2\,dx = \frac{16\pi}{15}$.'
        constraints: "axis is a line y = c tangent to the region boundary; radii stay nonnegative"
    diagnostic_exemplar:
      problem: 'The region between $y = \sqrt{x}$ and $y = x$ is rotated about the line $y = -1$. Find the volume.'
      answer: '$\pi/2$'
      solution_sketch: 'Radii measured from $y = -1$: $R = \sqrt x + 1$, $r = x + 1$, so $V = \pi\int_0^1 (2\sqrt x - x - x^2)\,dx = \frac{\pi}{2}$.'
    anki_seeds:
      - front: "Washer method volume formula about the x-axis?"
        back: '$V = \pi \int_a^b \left(R(x)^2 - r(x)^2\right) dx$ (outer radius squared minus inner radius squared)'
        type: basic
      - front: "Classic washer error: pi times the integral of (R - r)^2 is wrong because..."
        back: '$(R - r)^2 \neq R^2 - r^2$; square each radius separately, then subtract'
        type: basic

  - id: volumes-shells-y-axis
