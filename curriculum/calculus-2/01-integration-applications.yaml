    prerequisites:
      - id: volumes-shells-y-axis
        weight: 0.8
        key: true
      - id: area-between-curves
        weight: 0.5
      - id: volumes-disks-washers
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: Shells with height between two curves
        key_prerequisites: [volumes-shells-y-axis, area-between-curves]
        exemplars:
          - problem: 'The region between $y = x$ and $y = x^2$ is rotated about the $y$-axis. Find the volume.'
            answer: '$\pi/6$'
            solution_sketch: '$V = 2\pi\int_0^1 x(x - x^2)\,dx = 2\pi(\frac{1}{3} - \frac{1}{4}) = \frac{\pi}{6}$.'
          - problem: 'The region between $y = \sqrt{x}$ and $y = x$ is rotated about the $y$-axis. Find the volume.'
            answer: '$2\pi/15$'
            solution_sketch: '$V = 2\pi\int_0^1 x(\sqrt{x} - x)\,dx = 2\pi\left(\frac{2}{5} - \frac{1}{3}\right) = \frac{2\pi}{15}$.'
        constraints: "curves intersect at x = 0 and x = 1; height = top minus bottom"
      - id: kp2
        name: Shells about other vertical lines
        key_prerequisites: [volumes-shells-y-axis]
        exemplars:
          - problem: 'The region under $y = x^2$ for $0 \le x \le 1$ is rotated about the line $x = 2$. Find the volume.'
            answer: '$5\pi/6$'
            solution_sketch: 'Shell radius $2 - x$: $V = 2\pi\int_0^1 (2 - x)x^2\,dx = 2\pi(\frac{2}{3} - \frac{1}{4}) = \frac{5\pi}{6}$.'
          - problem: 'The region between $y = x$ and $y = x^2$ is rotated about the line $x = -1$. Find the volume.'
            answer: '$\pi/2$'
            solution_sketch: 'Shell radius $x + 1$: $V = 2\pi\int_0^1 (x + 1)(x - x^2)\,dx = 2\pi\int_0^1 (x - x^3)\,dx = 2\pi\cdot\frac{1}{4} = \frac{\pi}{2}$.'
        constraints: "axis x = c with c outside the region; radius written as (c - x) or (x - c) to stay positive"
      - id: kp3
        name: Choosing shells versus washers
        key_prerequisites: [volumes-shells-y-axis, volumes-disks-washers]
        exemplars:
          - problem: 'The region under $y = \sin(x^2)$, $0 \le x \le \sqrt{\pi}$, is rotated about the $y$-axis. Give the exact volume.'
            answer: '2*pi'
            solution_sketch: 'Shells avoid inverting $\sin(x^2)$: $V = 2\pi\int_0^{\sqrt{\pi}} x\sin(x^2)\,dx$; with $u = x^2$ this is $\pi\int_0^{\pi} \sin u\,du = 2\pi$.'
          - problem: 'The region between $y = x$ and $y = x^2$ is rotated about the $x$-axis. Which method uses the curves as given, without inverting them? Answer with one word: shells or washers.'
            answer: 'washers'
            solution_sketch: 'The axis is horizontal and both curves give $y$ in terms of $x$; washers in $x$ avoid solving for $x(y)$, shells would require it.'
        constraints: "one computational and one purely strategic exemplar; the named method must genuinely be simpler"
    diagnostic_exemplar:
      problem: 'The region between $y = 2x$ and $y = x^2$ is rotated about the line $x = -1$. Find the volume.'
      answer: '$16\pi/3$'
      solution_sketch: 'Shell radius $x + 1$, height $2x - x^2$, over $0 \le x \le 2$: $V = 2\pi\int_0^2 (x+1)(2x - x^2)\,dx = \frac{16\pi}{3}$.'
    anki_seeds:
      - front: "Choose shells over washers when..."
        back: "the slice parallel to the axis of rotation is simpler — typically rotating about a vertical axis with y = f(x) hard to invert"
        type: basic
      - front: "Shell radius when rotating about the line x = c (region to the left of c)?"
        back: '$c - x$'
        type: basic

  - id: arc-length
    name: Arc Length
    core: true
    difficulty: 0.7
    drill: false
    answer_kind: multi-step
    expected_time_secs: 240
    prerequisites:
      - id: definite-integrals-ftc
        weight: 0.7
        key: true
      - id: integration-substitution
        weight: 0.5
        key: true
      - id: chain-rule
        weight: 0.4
      - id: simplifying-radicals
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: The arc length integral
        key_prerequisites: [definite-integrals-ftc, chain-rule]
        exemplars:
          - problem: 'Set up (do not evaluate) the arc length integral for $y = x^2$ on $[0, 1]$.'
            answer: '$\int_0^1 \sqrt{1 + 4x^2} \, dx$'
            solution_sketch: '$L = \int_a^b \sqrt{1 + (y'')^2}\,dx$ with $y'' = 2x$.'
          - problem: 'Find the length of $y = 3x + 1$ for $0 \le x \le 4$, and check against the distance formula.'
            answer: '$4\sqrt{10}$'
            solution_sketch: '$L = \int_0^4 \sqrt{1 + 9}\,dx = 4\sqrt{10}$; the segment from $(0,1)$ to $(4,13)$ has length $\sqrt{16 + 144} = 4\sqrt{10}$.'
        constraints: "curves where 1 + (y')^2 is constant, or setup-only problems"
      - id: kp2
        name: Power curves via substitution
        key_prerequisites: [integration-substitution, definite-integrals-ftc]
        exemplars:
          - problem: 'Find the length of $y = x^{3/2}$ for $0 \le x \le 5$.'
            answer: '$335/27$'
            solution_sketch: '$y'' = \frac{3}{2}x^{1/2}$; $L = \int_0^5 \sqrt{1 + \frac{9x}{4}}\,dx = \frac{8}{27}\left[(1 + \tfrac{9x}{4})^{3/2}\right]_0^5 = \frac{8}{27}(\frac{343}{8} - 1) = \frac{335}{27}$.'
          - problem: 'Find the length of $y = 2x^{3/2}$ for $0 \le x \le 1$.'
            answer: '$\frac{2(10\sqrt{10} - 1)}{27}$'
            solution_sketch: '$y'' = 3x^{1/2}$; $L = \int_0^1 \sqrt{1 + 9x}\,dx = \frac{2}{27}\left[(1 + 9x)^{3/2}\right]_0^1 = \frac{2}{27}(10\sqrt{10} - 1)$.'
        constraints: "curves where 1 + (y')^2 is linear in x; the substitution is one step"
      - id: kp3
        name: Perfect-square integrands
        key_prerequisites: [simplifying-radicals, definite-integrals-ftc]
        exemplars:
          - problem: 'Find the length of $y = \frac{x^3}{3} + \frac{1}{4x}$ for $1 \le x \le 2$.'
            answer: '$59/24$'
            solution_sketch: '$y'' = x^2 - \frac{1}{4x^2}$, so $1 + (y'')^2 = (x^2 + \frac{1}{4x^2})^2$. $L = \int_1^2 (x^2 + \frac{1}{4x^2})\,dx = [\frac{x^3}{3} - \frac{1}{4x}]_1^2 = \frac{7}{3} + \frac{1}{8} = \frac{59}{24}$.'
          - problem: 'Find the length of $y = \frac{e^x + e^{-x}}{2}$ for $0 \le x \le 1$.'
            answer: '$\frac{e - e^{-1}}{2}$'
            solution_sketch: '$1 + (y'')^2 = \left(\frac{e^x + e^{-x}}{2}\right)^2$, so $L = \int_0^1 \frac{e^x + e^{-x}}{2}\,dx = \frac{e - e^{-1}}{2}$.'
        constraints: "engineered curves of the form ax^n + b x^{-n} or (e^x + e^{-x})/2 where 1 + (y')^2 is a perfect square"
    diagnostic_exemplar:
      problem: 'Find the length of $y = \frac{x^3}{6} + \frac{1}{2x}$ for $1 \le x \le 2$.'
      answer: '$17/12$'
      solution_sketch: '$1 + \left(\frac{dy}{dx}\right)^2 = \left(\frac{x^2}{2} + \frac{1}{2x^2}\right)^2$ is a perfect square, so the length is $\left[\frac{x^3}{6} - \frac{1}{2x}\right]_1^2 = \frac{17}{12}$.'
    anki_seeds:
      - front: "Arc length formula for y = f(x) on [a, b]?"
        back: '$L = \int_a^b \sqrt{1 + f''(x)^2} \, dx$'
        type: basic
      - front: "Textbook arc length curves like x^3/3 + 1/(4x) are engineered so that..."
        back: '$1 + (y'')^2$ is a perfect square, letting the square root vanish'
        type: basic

  - id: surface-area-revolution
    name: Surface Area of Revolution
    core: false                # application of the definite integral
    difficulty: 0.72
    drill: false
    answer_kind: expression
    expected_time_secs: 240
    prerequisites:
      - id: arc-length
        weight: 0.7
        key: true
      - id: integration-substitution
        weight: 0.5
        key: true
      - id: circle-area-circumference
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: The surface area integral and cone checks
        key_prerequisites: [arc-length, circle-area-circumference]
        exemplars:
          - problem: 'The segment $y = x$, $0 \le x \le 1$, is rotated about the $x$-axis. Find the surface area.'
            answer: '$\pi \sqrt 2$'
            solution_sketch: '$S = 2\pi\int_0^1 x\sqrt{1 + 1}\,dx = 2\pi\sqrt{2} \cdot \frac{1}{2} = \pi\sqrt{2}$ — the lateral area $\pi r \ell$ of a cone with $r = 1$, $\ell = \sqrt{2}$.'
          - problem: 'The segment $y = 2x$, $0 \le x \le 1$, is rotated about the $x$-axis. Find the surface area and check it against the cone formula $\pi r \ell$.'
            answer: '$2\pi \sqrt 5$'
            solution_sketch: '$S = 2\pi\int_0^1 2x\sqrt{1 + 4}\,dx = 2\pi\sqrt{5}$; the cone has $r = 2$, $\ell = \sqrt{5}$, so $\pi r\ell = 2\pi\sqrt{5}$.'
        constraints: "line segments through the origin; verify against pi r l"
      - id: kp2
        name: Surfaces requiring substitution
        key_prerequisites: [arc-length, integration-substitution]
        exemplars:
          - problem: 'The curve $y = x^3$, $0 \le x \le 1$, is rotated about the $x$-axis. Find the surface area.'
            answer: 'pi*(10*sqrt(10) - 1)/27'
            solution_sketch: '$S = 2\pi\int_0^1 x^3\sqrt{1 + 9x^4}\,dx$; $u = 1 + 9x^4$ gives $\frac{2\pi}{36} \cdot \frac{2}{3}\left[u^{3/2}\right]_1^{10} = \frac{\pi}{27}(10^{3/2} - 1)$.'
          - problem: 'The curve $y = \sqrt{x}$, $0 \le x \le 1$, is rotated about the $x$-axis. Find the surface area.'
            answer: '$\pi(5\sqrt 5 - 1)/6$'
            solution_sketch: '$S = 2\pi\int_0^1 \sqrt{x}\sqrt{1 + \frac{1}{4x}}\,dx = 2\pi\int_0^1 \sqrt{x + \tfrac{1}{4}}\,dx = \frac{4\pi}{3}\left[(x + \tfrac{1}{4})^{3/2}\right]_0^1 = \frac{\pi}{6}(5\sqrt{5} - 1)$.'
        constraints: "the radical must fall to a one-step u-substitution; answers exact with radicals"
      - id: kp3
        name: Sphere zones
        key_prerequisites: [arc-length, circle-area-circumference]
        exemplars:
          - problem: 'Rotate $y = \sqrt{4 - x^2}$, $-2 \le x \le 2$, about the $x$-axis and verify the sphere surface area formula for radius $2$.'
            answer: '$16\pi$'
            solution_sketch: '$\sqrt{1 + (y'')^2} = \frac{2}{\sqrt{4 - x^2}}$, so $S = 2\pi\int_{-2}^{2} \sqrt{4 - x^2}\cdot\frac{2}{\sqrt{4-x^2}}\,dx = 4\pi\int_{-2}^{2} dx = 16\pi = 4\pi(2)^2$.'
          - problem: 'Find the area of the zone of the sphere $y = \sqrt{4 - x^2}$ rotated about the $x$-axis for $0 \le x \le 1$.'
            answer: '$4\pi$'
            solution_sketch: 'The integrand collapses to the constant $4\pi$: $S = 4\pi(1 - 0) = 4\pi$ — zone area depends only on the slab width.'
        constraints: "radius 2 or 3; highlight that the integrand becomes constant (Archimedes' hat-box)"
    diagnostic_exemplar:
      problem: 'The curve $y = \sqrt{x}$, $0 \le x \le 3$, is rotated about the $x$-axis. Find the surface area.'
      answer: '$\pi(13\sqrt{13} - 1)/6$'
      solution_sketch: '$S = 2\pi\int_0^3 \sqrt x\sqrt{1 + \frac{1}{4x}}\,dx = 2\pi\int_0^3 \sqrt{x + \tfrac14}\,dx = \frac{4\pi}{3}\left[\left(\tfrac{13}{4}\right)^{3/2} - \left(\tfrac14\right)^{3/2}\right]$.'
    anki_seeds:
      - front: "Surface area formula for y = f(x) >= 0 rotated about the x-axis?"
        back: '$S = 2\pi \int_a^b f(x)\sqrt{1 + f''(x)^2} \, dx$'
        type: basic
      - front: "Sphere zone fact (Archimedes): the area of a zone depends only on..."
        back: "the sphere's radius and the width of the slab — $S = 2\\pi R h$"
        type: basic

  - id: work-springs
    name: Work and Springs
    core: false                # physical application branch
    difficulty: 0.58
    drill: false
    answer_kind: multi-step
    expected_time_secs: 150
    prerequisites:
      - id: definite-integrals-ftc
        weight: 0.7
        key: true
      - id: antiderivatives
        weight: 0.4
      - id: evaluating-formulas
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: Work done by a variable force
        key_prerequisites: [definite-integrals-ftc]
        exemplars:
          - problem: 'A force $F(x) = 3x^2$ N acts along the $x$-axis. Find the work done moving an object from $x = 0$ to $x = 2$ m.'
            answer: '$8$ J'
            solution_sketch: '$W = \int_0^2 3x^2\,dx = 8$ J.'
          - problem: 'A constant force of $12$ N moves an object $5$ m. Check that the work integral gives the familiar $W = Fd$.'
            answer: '$60$ J'
            solution_sketch: '$W = \int_0^5 12\,dx = 60$ J $= 12 \cdot 5$.'
        constraints: "force given explicitly as a polynomial in x; SI units; one constant-force sanity check"
      - id: kp2
        name: Hooke's law and spring work
        key_prerequisites: [definite-integrals-ftc, evaluating-formulas]
        exemplars:
          - problem: 'A force of $10$ N stretches a spring $0.2$ m beyond its natural length. How much work is done stretching it from natural length to $0.4$ m beyond?'
            answer: '$4$ J'
            solution_sketch: '$k = \frac{10}{0.2} = 50$ N/m; $W = \int_0^{0.4} 50x\,dx = 25(0.4)^2 = 4$ J.'
          - problem: 'A spring has constant $k = 200$ N/m. Find the work to stretch it $0.3$ m from natural length.'
            answer: '$9$ J'
            solution_sketch: '$W = \int_0^{0.3} 200x\,dx = 100(0.3)^2 = 9$ J.'
          - problem: 'A spring with $k = 100$ N/m is already stretched $0.2$ m beyond natural length. Find the work to stretch it to $0.4$ m beyond.'
            answer: '$6$ J'
            solution_sketch: '$W = \int_{0.2}^{0.4} 100x\,dx = 50(0.16 - 0.04) = 6$ J — the bounds are displacements from natural length.'
        constraints: "SI units; k determined from one force-displacement pair; displacements chosen so answers are clean"
    diagnostic_exemplar:
      problem: 'A force of $15$ N stretches a spring $0.3$ m beyond its natural length. How much work is done stretching it from $0.2$ m to $0.5$ m beyond natural length?'
      answer: '$5.25$ J'
      solution_sketch: 'Hooke gives $k = 15/0.3 = 50$ N/m; then $W = \int_{0.2}^{0.5} 50x\,dx = 25(0.25 - 0.04)$.'
    anki_seeds:
      - front: "Work done by a variable force F(x) moving from a to b?"
        back: '$W = \int_a^b F(x) \, dx$'
        type: basic
      - front: "Hooke's law?"
        back: '$F = kx$ — the restoring force is proportional to the displacement from natural length'
        type: basic

  - id: average-value-work
    name: Average Value and Work
    core: false                # physical application; feeds only fluid force
    difficulty: 0.65
