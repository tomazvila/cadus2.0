      - id: kp1
        name: The shell formula
        key_prerequisites: [volumes-disks-washers, circle-area-circumference]
        exemplars:
          - problem: 'The region under $y = x^2$ for $0 \le x \le 1$ is rotated about the $y$-axis. Find the volume by shells.'
            answer: '$\pi/2$'
            solution_sketch: '$V = 2\pi\int_0^1 x \cdot x^2\,dx = 2\pi \cdot \frac{1}{4} = \frac{\pi}{2}$.'
          - problem: 'The region under $y = 2$ for $0 \le x \le 1$ is rotated about the $y$-axis. Compute the shell integral and check it against the cylinder volume.'
            answer: '$2\pi$'
            solution_sketch: '$V = 2\pi\int_0^1 2x\,dx = 2\pi$; a cylinder of radius $1$ and height $2$ has volume $\pi(1)^2(2) = 2\pi$.'
        constraints: "shell radius x, height = curve; one verification against an elementary solid"
      - id: kp2
        name: Shells with power-function heights
        key_prerequisites: [volumes-disks-washers, definite-integrals-ftc]
        exemplars:
          - problem: 'The region under $y = \sqrt{x}$ for $0 \le x \le 1$ is rotated about the $y$-axis. Find the volume by shells.'
            answer: '$4\pi/5$'
            solution_sketch: '$V = 2\pi\int_0^1 x\sqrt{x}\,dx = 2\pi\int_0^1 x^{3/2}\,dx = 2\pi \cdot \frac{2}{5} = \frac{4\pi}{5}$.'
          - problem: 'The region under $y = 2x - x^2$ for $0 \le x \le 2$ is rotated about the $y$-axis. Find the volume.'
            answer: '$8\pi/3$'
            solution_sketch: '$V = 2\pi\int_0^2 x(2x - x^2)\,dx = 2\pi[\frac{2x^3}{3} - \frac{x^4}{4}]_0^2 = 2\pi(\frac{16}{3} - 4) = \frac{8\pi}{3}$.'
          - problem: 'The region under $y = \frac{1}{x}$ for $1 \le x \le 2$ is rotated about the $y$-axis. Find the volume by shells.'
            answer: '$2\pi$'
            solution_sketch: '$V = 2\pi\int_1^2 x \cdot \frac{1}{x}\,dx = 2\pi\int_1^2 dx = 2\pi$.'
        constraints: "integrand x f(x) stays a polynomial or a single power; bounds are small integers"
    diagnostic_exemplar:
      problem: 'The region under $y = \sqrt{x}$ for $0 \le x \le 4$ is rotated about the $y$-axis. Find the volume by shells.'
      answer: '$128\pi/5$'
      solution_sketch: '$V = 2\pi\int_0^4 x\sqrt x\,dx = 2\pi \cdot \frac{2}{5}\cdot 32$.'
    anki_seeds:
      - front: "Shell method volume formula about the y-axis?"
        back: '$V = 2\pi \int_a^b x \, f(x) \, dx$ (radius times height)'
        type: basic
      - front: "Where does the shell factor 2 pi x come from?"
        back: 'Unrolling a thin cylindrical shell of radius $x$ gives a slab of length $2\pi x$ (the circumference), height $f(x)$, thickness $dx$.'
        type: basic

  - id: volumes-cylindrical-shells
    name: Volumes by Cylindrical Shells
    core: false                # solids-of-revolution applications branch
    difficulty: 0.68
