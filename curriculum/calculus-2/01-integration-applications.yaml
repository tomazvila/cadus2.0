unit: integration-applications
course: calculus-2
module: "Applications of Integration"
topics:
  - id: area-between-curves-x
    name: Area Between Curves on a Given Interval
    core: true
    difficulty: 0.52
    drill: false
    answer_kind: expression
    expected_time_secs: 120
    prerequisites:
      - id: definite-integrals-ftc
        weight: 0.8
        key: true
      - id: area-under-a-curve
        weight: 0.6
        key: true
      - id: antiderivatives
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: Top minus bottom, polynomial curves
        key_prerequisites: [definite-integrals-ftc, area-under-a-curve]
        try_first:
          problem: 'The line $y = 4$ lies above the line $y = 1$ from $x = 0$ to $x = 5$. What is the area between the two lines?'
          answer_contract: {"kind":"exact"}
          answer: '15'
          reveal: 'The gap between the lines is $4 - 1 = 3$ at every $x$, so the area is $5 \cdot 3 = 15$. When the gap changes with $x$, we integrate top minus bottom instead.'
        exemplars:
          - problem: 'Find the area between $y = x$ and $y = x^2$ for $0 \le x \le 1$.'
            answer: '1/6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'On $[0,1]$ the line lies above the parabola, because $x - x^2 = x(1 - x) \ge 0$. The area is $\int_0^1 (x - x^2)\,dx = \frac{1}{2} - \frac{1}{3} = \frac{1}{6}$.'
          - problem: 'Find the area between $y = x^2 + 1$ and $y = x$ for $0 \le x \le 2$.'
            answer: '8/3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The parabola $y = x^2 + 1$ is above the line on the whole interval, because $x^2 - x + 1 > 0$. The area is $\int_0^2 (x^2 - x + 1)\,dx = \frac{8}{3} - 2 + 2 = \frac{8}{3}$.'
          - problem: 'Find the area between $y = 2x$ and $y = x^2$ for $0 \le x \le 2$.'
            answer: '4/3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'On $[0,2]$ we have $2x - x^2 = x(2 - x) \ge 0$, so the line is the top curve. The area is $\int_0^2 (2x - x^2)\,dx = \left[x^2 - \frac{x^3}{3}\right]_0^2 = 4 - \frac{8}{3} = \frac{4}{3}$.'
          - problem: 'A garden bed lies between a straight fence $y = 4x$ and a curved hedge $y = x^2$ for $0 \le x \le 3$, where $x$ and $y$ are in metres. Find the area of the bed.'
            answer: '9'
            answer_contract: {"kind":"unit","quantity":"area","unit":"m^2","allow_omitted":true}
            solution_sketch: 'On $[0,3]$ the fence is above the hedge, because $4x - x^2 = x(4 - x) \ge 0$. The area is $\int_0^3 (4x - x^2)\,dx = \left[2x^2 - \frac{x^3}{3}\right]_0^3 = 18 - 9 = 9$ square metres.'
          - problem: 'A decorative panel is bounded above by $y = x^2 + 2$ and below by $y = x$ for $0 \le x \le 3$, with $x$ and $y$ in metres. One litre of paint covers $3$ m$^2$. How many litres of paint cover the panel once?'
            answer: '7/2'
            answer_contract: {"kind":"unit","quantity":"volume","unit":"L","allow_omitted":true}
            solution_sketch: 'The panel has area $\int_0^3 (x^2 - x + 2)\,dx = 9 - \frac{9}{2} + 6 = \frac{21}{2}$ square metres. Each litre covers $3$ square metres, so we divide: $\frac{21}{2} \div 3 = \frac{7}{2}$ litres.'
          - problem: 'What is the area of the region between $y = x^2 + 4$ and $y = 4x$ for $0 \le x \le 1$?'
            answer: '7/3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Since $x^2 + 4 - 4x = (x - 2)^2 \ge 0$, the parabola is on top, and the area is $\int_0^1 (x^2 - 4x + 4)\,dx = \frac{1}{3} - 2 + 4 = \frac{7}{3}$.'
          - problem: 'Find the area between $y = x^2 + 2$ and $y = 3x$ for $0 \le x \le 1$.'
            answer: '5/6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'On $[0,1]$ we have $x^2 + 2 - 3x = (x - 1)(x - 2) \ge 0$, so the parabola is the top curve. The area is $\int_0^1 (x^2 - 3x + 2)\,dx = \frac{1}{3} - \frac{3}{2} + 2 = \frac{5}{6}$.'
        constraints: 'interval given explicitly; top curve does not change on the interval; polynomial integrands with small integer coefficients; also garden, panel and paint problems (area in square metres, litres needed) and one error-analysis item'
      - id: kp2
        name: Exponential and trig curves
        key_prerequisites: [definite-integrals-ftc, antiderivatives]
        exemplars:
          - problem: 'Find the area between $y = e^x$ and $y = 1$ for $0 \le x \le 1$.'
            answer: 'e - 2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'On $[0,1]$ we have $e^x \ge 1$, so $y = e^x$ is the upper curve. The area is $\int_0^1 (e^x - 1)\,dx = [e^x - x]_0^1 = (e - 1) - 1 = e - 2$.'
          - problem: 'Find the area between $y = e^x$ and $y = e^{-x}$ for $0 \le x \le 1$.'
            answer: 'e + 1/e - 2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'For $x \ge 0$ we have $e^x \ge e^{-x}$, so $y = e^x$ is on top. The area is $\int_0^1 (e^x - e^{-x})\,dx = [e^x + e^{-x}]_0^1 = (e + e^{-1}) - 2$.'
          - problem: 'Find the area between $y = \sin x$ and the $x$-axis for $0 \le x \le \pi$.'
            answer: '2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'On $[0,\pi]$ the sine curve lies above the axis. The area is $\int_0^{\pi} \sin x\,dx = [-\cos x]_0^{\pi} = 1 + 1 = 2$.'
          - problem: 'Find the area between $y = e^{2x}$ and $y = 1$ for $0 \le x \le 2$.'
            answer: '(e^4 - 5)/2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'For $x \ge 0$ we have $e^{2x} \ge 1$, so the exponential is on top. The area is $\int_0^2 (e^{2x} - 1)\,dx = \left[\frac{e^{2x}}{2} - x\right]_0^2 = \left(\frac{e^4}{2} - 2\right) - \frac{1}{2} = \frac{e^4 - 5}{2}$.'
          - problem: 'Two runners start together. Runner A has speed $5 + 3\cos t$ and runner B has constant speed $5$, both in m/s, for $0 \le t \le \pi/2$ seconds. How much farther has A run than B at $t = \pi/2$?'
            answer: '3'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'The distance gap is the area between the two speed curves. Since $\cos t \ge 0$ on this interval, it is $\int_0^{\pi/2} (5 + 3\cos t - 5)\,dt = [3\sin t]_0^{\pi/2} = 3$ metres.'
          - problem: 'A thin metal plate has the shape of the region between $y = \cos x$ and the $x$-axis for $0 \le x \le \pi/2$, with $x$ and $y$ in metres. Each square metre of the plate has mass $4$ kg. Find the mass of the plate.'
            answer: '4'
            answer_contract: {"kind":"unit","quantity":"mass","unit":"kg","allow_omitted":true}
            solution_sketch: 'The area of the plate is $\int_0^{\pi/2} \cos x\,dx = [\sin x]_0^{\pi/2} = 1$ square metre. Each square metre has mass $4$ kg, so we multiply: the mass is $1 \cdot 4 = 4$ kg.'
          - problem: 'Find the area between $y = \sin x$ and $y = \cos x$ for $0 \le x \le \pi/4$.'
            answer: 'sqrt(2) - 1'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'On $[0,\pi/4]$ we have $\cos x \ge \sin x$. The area is $\int_0^{\pi/4} (\cos x - \sin x)\,dx = [\sin x + \cos x]_0^{\pi/4} = \sqrt{2} - 1$.'
          - problem: 'Pipe A delivers water at the rate $e^t$ litres per minute and pipe B delivers a constant $1$ litre per minute. How many more litres does pipe A deliver than pipe B during the first $2$ minutes?'
            answer: 'e^2 - 3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The extra water is the area between the two rate curves. It is $\int_0^2 (e^t - 1)\,dt = [e^t - t]_0^2 = (e^2 - 2) - 1 = e^2 - 3$ litres.'
        constraints: 'integrands limited to e^{ax}, sin x, cos x; the ordering of the curves must not change on the interval; also speed, rate and plate-mass problems set in context'
    diagnostic_exemplar:
      problem: 'Find the area between $y = e^x$ and $y = x$ for $0 \le x \le 1$.'
      answer: '$e - 3/2$'
      solution_sketch: '$\int_0^1 (e^x - x)\,dx = [e^x - x^2/2]_0^1 = (e - \tfrac12) - 1$.'
    anki_seeds:
      - front: "Area between curves f (top) and g (bottom) on [a, b]?"
        back: '$\int_a^b (f(x) - g(x)) \, dx$'
        type: basic
      - front: "Before integrating f - g for an area, first check..."
        back: "which curve is on top throughout the interval (the integrand must stay nonnegative)"
        type: basic

  - id: area-between-curves
    name: Area Between Curves
    core: true
    difficulty: 0.55
    drill: false
    answer_kind: expression
    expected_time_secs: 150
    prerequisites:
      - id: area-between-curves-x
        weight: 0.8
        key: true
      - id: definite-integrals-ftc
        weight: 0.5
      - id: quadratic-graphs-vertex
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: Find the intersection points first
        key_prerequisites: [area-between-curves-x, quadratic-graphs-vertex]
        exemplars:
          - problem: 'Find the area of the region enclosed by $y = x^2$ and $y = x + 2$.'
            answer: '9/2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Set $x^2 = x + 2$, so $(x - 2)(x + 1) = 0$ and the curves meet at $x = -1$ and $x = 2$. Between them the line is on top, so the area is $\int_{-1}^{2} (x + 2 - x^2)\,dx = \frac{10}{3} + \frac{7}{6} = \frac{9}{2}$.'
          - problem: 'Find the area of the region enclosed by $y = \sqrt{x}$ and $y = x$.'
            answer: '1/6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Setting $\sqrt{x} = x$ gives $x = 0$ and $x = 1$, and $\sqrt{x} \ge x$ between them. The area is $\int_0^1 (\sqrt{x} - x)\,dx = \frac{2}{3} - \frac{1}{2} = \frac{1}{6}$.'
          - problem: 'Find the area of the region enclosed by $y = x^2$ and $y = 4x$.'
            answer: '32/3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Setting $x^2 = 4x$ gives $x(x - 4) = 0$, so the curves meet at $x = 0$ and $x = 4$, and the line is on top between them. The area is $\int_0^4 (4x - x^2)\,dx = 32 - \frac{64}{3} = \frac{32}{3}$.'
          - problem: 'A pond is bounded by a curved bank $y = x^2$ and a straight bank $y = 6 - x$, where $x$ and $y$ are in metres. Find the area of the pond.'
            answer: '125/6'
            answer_contract: {"kind":"unit","quantity":"area","unit":"m^2","allow_omitted":true}
            solution_sketch: 'The banks meet where $x^2 = 6 - x$, that is $(x + 3)(x - 2) = 0$, so at $x = -3$ and $x = 2$. The straight bank is on top between them, so the area is $\int_{-3}^{2} (6 - x - x^2)\,dx = \frac{22}{3} + \frac{27}{2} = \frac{125}{6}$ square metres.'
          - problem: 'A lawn is the region enclosed by $y = x^2$ and $y = 2x + 8$, with $x$ and $y$ in metres. One bag of grass seed covers $12$ m$^2$. How many bags does the lawn need?'
            answer: '3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The curves meet where $x^2 = 2x + 8$, that is $(x - 4)(x + 2) = 0$, so at $x = -2$ and $x = 4$. The lawn has area $\int_{-2}^{4} (2x + 8 - x^2)\,dx = 36$ square metres. Each bag covers $12$ square metres, so we divide: $36 \div 12 = 3$ bags.'
          - problem: 'What is the area of the region enclosed by $y = x^2$ and $y = x + 12$?'
            answer: '343/6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Since $x^2 - x - 12 = (x - 4)(x + 3)$, the curves meet at $x = -3$ and $x = 4$, and the area is $\int_{-3}^{4} (x + 12 - x^2)\,dx = \frac{343}{6}$.'
          - problem: 'Find the area of the region enclosed by $y = x^2$ and $y = 2 - x^2$.'
            answer: '8/3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Setting $x^2 = 2 - x^2$ gives $x^2 = 1$, so the curves meet at $x = -1$ and $x = 1$. The area is $\int_{-1}^{1} (2 - 2x^2)\,dx = 4 - \frac{4}{3} = \frac{8}{3}$.'
          - problem: 'The line $y = kx$, with $k > 0$, and the parabola $y = x^2$ enclose a region of area $\frac{4}{3}$. Find $k$.'
            answer: '2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The line and the parabola meet at $x = 0$ and $x = k$, and the line is on top. The area is $\int_0^k (kx - x^2)\,dx = \frac{k^3}{6}$, so $\frac{k^3}{6} = \frac{4}{3}$ gives $k^3 = 8$ and $k = 2$.'
        constraints: 'intersections solvable by factoring a quadratic with integer roots (or x = 0, 1 for root curves); also pond and lawn problems (area, bags needed), one error-analysis item and one find-the-parameter item'
      - id: kp2
        name: Crossing curves (split at the crossing)
        key_prerequisites: [area-between-curves-x]
        exemplars:
          - problem: 'Find the total area between $y = x^3$ and $y = x$ for $-1 \le x \le 1$.'
            answer: '1/2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The curves cross at $x = 0$, and the picture is symmetric about the origin. The total area is $2\int_0^1 (x - x^3)\,dx = 2\left(\frac{1}{2} - \frac{1}{4}\right) = \frac{1}{2}$.'
          - problem: 'Find the total area between $y = \cos x$ and $y = \sin x$ for $0 \le x \le \pi/2$.'
            answer: '2sqrt(2) - 2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The curves cross at $x = \pi/4$. The piece on $[0,\pi/4]$ is $\int_0^{\pi/4} (\cos x - \sin x)\,dx = \sqrt{2} - 1$, and the second piece equals the first by symmetry. The total is $2\sqrt{2} - 2$.'
          - problem: 'Find the total area between $y = x^2$ and $y = 2x$ for $0 \le x \le 3$.'
            answer: '8/3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Setting $x^2 = 2x$ gives $x = 0$ and $x = 2$, so we split at $x = 2$. On $[0,2]$ the line is on top and the piece is $\frac{4}{3}$; on $[2,3]$ the parabola is on top and the piece is also $\frac{4}{3}$. The total is $\frac{8}{3}$.'
          - problem: 'Find the total area between $y = x^3$ and $y = x^2$ for $0 \le x \le 2$.'
            answer: '3/2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Setting $x^3 = x^2$ gives $x = 0$ and $x = 1$, so we split at $x = 1$. On $[0,1]$ the piece is $\int_0^1 (x^2 - x^3)\,dx = \frac{1}{12}$; on $[1,2]$ it is $\int_1^2 (x^3 - x^2)\,dx = \frac{17}{12}$. The total is $\frac{18}{12} = \frac{3}{2}$.'
          - problem: 'The plan of a glass inlay is the region between $y = x^2$ and $y = 3x$ for $0 \le x \le 4$, where $x$ and $y$ are in centimetres. Find the area of the inlay.'
            answer: '19/3'
            answer_contract: {"kind":"unit","quantity":"area","unit":"cm^2","allow_omitted":true}
            solution_sketch: 'Setting $x^2 = 3x$ gives $x = 0$ and $x = 3$, so the curves cross inside the interval and we split at $x = 3$. The pieces are $\int_0^3 (3x - x^2)\,dx = \frac{9}{2}$ and $\int_3^4 (x^2 - 3x)\,dx = \frac{11}{6}$. The area is $\frac{9}{2} + \frac{11}{6} = \frac{19}{3}$ square centimetres.'
          - problem: 'A steel plate has the shape of the region between $y = x^3$ and $y = x^2$ for $0 \le x \le 2$, with $x$ and $y$ in metres. One litre of coating covers $2$ m$^2$. How many litres does one coat of the plate need?'
            answer: '3/4'
            answer_contract: {"kind":"unit","quantity":"volume","unit":"L","allow_omitted":true}
            solution_sketch: 'The curves cross at $x = 1$, so the area is $\frac{1}{12} + \frac{17}{12} = \frac{3}{2}$ square metres. One litre covers $2$ square metres, so we divide: $\frac{3}{2} \div 2 = \frac{3}{4}$ litre.'
          - problem: 'What is the area between $y = x^3$ and $y = 9x$ for $-3 \le x \le 3$?'
            answer: '81/2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The curves cross at $x = 0$, and the line is on top for $x > 0$ but below for $x < 0$, so the two pieces cancel in one integral. The total area is $2\int_0^3 (9x - x^3)\,dx = 2\left(\frac{81}{2} - \frac{81}{4}\right) = \frac{81}{2}$.'
          - problem: 'Find the total area between $y = \sin x$ and $y = \cos x$ for $0 \le x \le \pi$.'
            answer: '2sqrt(2)'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The only crossing on $[0,\pi]$ is $x = \pi/4$, so we split there. The first piece is $\sqrt{2} - 1$ and the second piece is $\int_{\pi/4}^{\pi} (\sin x - \cos x)\,dx = 1 + \sqrt{2}$. The total is $2\sqrt{2}$.'
        constraints: 'at most one sign change inside the interval; split the integral there and add absolute areas; also inlay and plate problems set in context and one error-analysis item'
      - id: kp3
        name: Integrating with respect to y
        key_prerequisites: [area-between-curves-x]
        exemplars:
          - problem: 'Find the area of the region enclosed by $x = y^2$ and $x = y + 2$.'
            answer: '9/2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Setting $y^2 = y + 2$ gives $y = -1$ and $y = 2$. For $-1 < y < 2$ the line $x = y + 2$ is on the right, so the area is $\int_{-1}^{2} (y + 2 - y^2)\,dy = \frac{9}{2}$.'
          - problem: 'Find the area of the region enclosed by $x = y^2$ and $x = 2 - y^2$.'
            answer: '8/3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Setting $y^2 = 2 - y^2$ gives $y = \pm 1$. The curve $x = 2 - y^2$ is on the right, so the area is $\int_{-1}^{1} (2 - 2y^2)\,dy = 4 - \frac{4}{3} = \frac{8}{3}$.'
          - problem: 'Find the area of the region enclosed by $x = y^2 + 4$ and $x = 2y + 7$.'
            answer: '32/3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Setting $y^2 + 4 = 2y + 7$ gives $(y - 3)(y + 1) = 0$, so $y = -1$ and $y = 3$. The line is on the right, so the area is $\int_{-1}^{3} (-y^2 + 2y + 3)\,dy = \frac{32}{3}$.'
          - problem: 'Find the area of the region enclosed by $x = y^2 - 2$ and $x = y + 4$.'
            answer: '125/6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Setting $y^2 - 2 = y + 4$ gives $(y - 3)(y + 2) = 0$, so $y = -2$ and $y = 3$. The line is on the right, so the area is $\int_{-2}^{3} (-y^2 + y + 6)\,dy = \frac{125}{6}$.'
          - problem: 'A pond has its west shore along $x = y^2$ and its east shore along $x = 8 - y^2$, with $x$ and $y$ in metres. Find the area of the pond.'
            answer: '64/3'
            answer_contract: {"kind":"unit","quantity":"area","unit":"m^2","allow_omitted":true}
            solution_sketch: 'The shores meet where $y^2 = 8 - y^2$, so $y = \pm 2$. The east shore is on the right, so the area is $\int_{-2}^{2} (8 - 2y^2)\,dy = 32 - \frac{32}{3} = \frac{64}{3}$ square metres.'
          - problem: 'Find the area of the region enclosed by the parabola $y^2 = 2x$ and the line $y = x - 4$.'
            answer: '18'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Write both curves as $x$ in terms of $y$: $x = \frac{y^2}{2}$ and $x = y + 4$. They meet where $y^2 - 2y - 8 = 0$, so $y = -2$ and $y = 4$, and the line is on the right. The area is $\int_{-2}^{4} \left(y + 4 - \frac{y^2}{2}\right)dy = 18$.'
          - problem: 'A metal panel is the region between $x = y^2$ and $x = 3y$, with $x$ and $y$ in metres. One litre of paint covers $3$ m$^2$. How many litres of paint cover the panel once?'
            answer: '3/2'
            answer_contract: {"kind":"unit","quantity":"volume","unit":"L","allow_omitted":true}
            solution_sketch: 'The curves meet where $y^2 = 3y$, so $y = 0$ and $y = 3$, and the line is on the right. The area is $\int_0^3 (3y - y^2)\,dy = \frac{9}{2}$ square metres, and $\frac{9}{2} \div 3 = \frac{3}{2}$ litres.'
          - problem: 'Find the area of the region enclosed by $x = 9 - y^2$ and the $y$-axis.'
            answer: '36'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The curve meets the $y$-axis where $9 - y^2 = 0$, so $y = \pm 3$, and it is on the right of the axis. The area is $\int_{-3}^{3} (9 - y^2)\,dy = 54 - 18 = 36$.'
        constraints: 'y-integration regions bounded by parabolas opening sideways and lines; intersections have integer y-coordinates; also pond and panel problems set in context'
    diagnostic_exemplar:
      problem: 'Find the area of the region enclosed by $x = y^2$ and $x = y + 6$.'
      answer: '$125/6$'
      solution_sketch: 'The curves meet at $y = -2$ and $y = 3$; integrating in $y$, $\int_{-2}^{3}(y + 6 - y^2)\,dy = \frac{125}{6}$.'
    anki_seeds:
      - front: "If two curves cross inside the interval, the total area requires..."
        back: "splitting the integral at each crossing and integrating |f - g| piecewise"
        type: basic
      - front: "When is integrating with respect to y the better choice for an area?"
        back: "When the region's boundaries are functions of y (e.g. sideways parabolas) — right curve minus left curve, dy"
        type: basic

  - id: consumer-producer-surplus
    name: Consumer and Producer Surplus
    core: false                # economics application of the definite integral
    difficulty: 0.58
    drill: false
    answer_kind: numeric
    expected_time_secs: 180
    prerequisites:
      - id: area-between-curves-x
        weight: 0.7
        key: true
      - id: definite-integrals-ftc
        weight: 0.5
        key: true
      - id: systems-substitution
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: Consumer surplus at a given price
        key_prerequisites: [area-between-curves-x, definite-integrals-ftc]
        exemplars:
          - problem: 'The demand curve for a product is $p = 50 - q$, where $p$ is the price in dollars and $q$ is the number of units sold. At a market price of $20$ dollars, find the consumer surplus.'
            answer: '450'
            answer_contract: {"kind":"unit","quantity":"dollar","unit":"dollar","allow_omitted":true}
            solution_sketch: 'The market quantity solves $50 - q = 20$, so $q^* = 30$. The consumer surplus is $\int_0^{30} (50 - q - 20)\,dq = \int_0^{30} (30 - q)\,dq = 900 - 450 = 450$ dollars.'
          - problem: 'A demand curve is $p = 80 - 2q$, with $p$ in dollars. At a market price of $20$ dollars, find the consumer surplus.'
            answer: '900'
            answer_contract: {"kind":"unit","quantity":"dollar","unit":"dollar","allow_omitted":true}
            solution_sketch: 'The market quantity solves $80 - 2q = 20$, so $q^* = 30$. The consumer surplus is $\int_0^{30} (60 - 2q)\,dq = [60q - q^2]_0^{30} = 1800 - 900 = 900$ dollars.'
          - problem: 'A demand curve is $p = 36 - q^2$, with $p$ in dollars. At a market price of $11$ dollars, find the consumer surplus.'
            answer: '250/3'
            answer_contract: {"kind":"unit","quantity":"dollar","unit":"dollar","allow_omitted":true}
            solution_sketch: 'The market quantity solves $36 - q^2 = 11$, so $q^2 = 25$ and $q^* = 5$. The consumer surplus is $\int_0^5 (25 - q^2)\,dq = 125 - \frac{125}{3} = \frac{250}{3}$ dollars.'
          - problem: 'The demand curve is $p = 64 - q^2$, with $p$ in dollars. At what market price is the consumer surplus equal to $144$ dollars?'
            answer: '28'
            answer_contract: {"kind":"unit","quantity":"dollar","unit":"dollar","allow_omitted":true}
            solution_sketch: 'At a market price $p$ the quantity is $q$ with $p = 64 - q^2$, and the gap between demand and price is $q^2 - u^2$ at quantity $u$. So the surplus is $\int_0^q (q^2 - u^2)\,du = \frac{2q^3}{3}$. Setting $\frac{2q^3}{3} = 144$ gives $q = 6$, so $p = 64 - 36 = 28$ dollars.'
          - problem: 'The demand curve is $p = 50 - q$, with $p$ in dollars. At a market price of $20$ dollars, $30$ units are sold, each to a different buyer. What is the average consumer surplus per buyer?'
            answer: '15'
            answer_contract: {"kind":"unit","quantity":"dollar","unit":"dollar","allow_omitted":true}
            solution_sketch: 'The total consumer surplus is $\int_0^{30} (30 - q)\,dq = 450$ dollars. It is shared by $30$ buyers, so we divide: $450 \div 30 = 15$ dollars per buyer.'
          - problem: 'For the demand curve $p = 40 - q$ at a market price of $16$ dollars, what is the consumer surplus?'
            answer: '288'
            answer_contract: {"kind":"unit","quantity":"dollar","unit":"dollar","allow_omitted":true}
            solution_sketch: 'The surplus is only the part above the price line, not the whole area under the demand curve. The market quantity is $q^* = 24$, and the surplus is $\int_0^{24} (24 - q)\,dq = 576 - 288 = 288$ dollars.'
          - problem: 'The demand for tickets at a theatre is $p = 100 - 4q$, where $p$ is the price in dollars and $q$ is the number of tickets sold. Tickets sell at $36$ dollars. Find the consumer surplus.'
            answer: '512'
            answer_contract: {"kind":"unit","quantity":"dollar","unit":"dollar","allow_omitted":true}
            solution_sketch: 'The market quantity solves $100 - 4q = 36$, so $q^* = 16$. The consumer surplus is $\int_0^{16} (64 - 4q)\,dq = [64q - 2q^2]_0^{16} = 1024 - 512 = 512$ dollars.'
        constraints: 'linear or quadratic demand with integer intercepts; market quantity solves to an integer; also the market price from a given surplus, an average surplus per buyer and one error-analysis item'
      - id: kp2
        name: Producer surplus at a given price
        key_prerequisites: [area-between-curves-x, definite-integrals-ftc]
        exemplars:
          - problem: 'The supply curve for a product is $p = 2q$, where $p$ is the price in dollars and $q$ is the number of units. At a market price of $20$ dollars, find the producer surplus.'
            answer: '100'
            answer_contract: {"kind":"unit","quantity":"dollar","unit":"dollar","allow_omitted":true}
            solution_sketch: 'The market quantity solves $2q = 20$, so $q^* = 10$. The producer surplus is $\int_0^{10} (20 - 2q)\,dq = 200 - 100 = 100$ dollars.'
          - problem: 'A supply curve is $p = 4q$, with $p$ in dollars. At a market price of $24$ dollars, find the producer surplus.'
            answer: '72'
            answer_contract: {"kind":"unit","quantity":"dollar","unit":"dollar","allow_omitted":true}
            solution_sketch: 'The market quantity solves $4q = 24$, so $q^* = 6$. The producer surplus is $\int_0^6 (24 - 4q)\,dq = [24q - 2q^2]_0^6 = 144 - 72 = 72$ dollars.'
          - problem: 'A supply curve is $p = 3q + 6$, with $p$ in dollars. At a market price of $30$ dollars, find the producer surplus.'
            answer: '96'
            answer_contract: {"kind":"unit","quantity":"dollar","unit":"dollar","allow_omitted":true}
            solution_sketch: 'The market quantity solves $3q + 6 = 30$, so $q^* = 8$. The producer surplus is $\int_0^8 (24 - 3q)\,dq = 192 - 96 = 96$ dollars.'
          - problem: 'The supply curve for a product is $p = q + 5$, with $p$ in dollars. At a market price of $25$ dollars, find the producer surplus.'
            answer: '200'
            answer_contract: {"kind":"unit","quantity":"dollar","unit":"dollar","allow_omitted":true}
            solution_sketch: 'The market quantity solves $q + 5 = 25$, so $q^* = 20$. The producer surplus is $\int_0^{20} (20 - q)\,dq = 400 - 200 = 200$ dollars.'
          - problem: 'The supply curve is $p = 2q + 4$, with $p$ in dollars. The producer surplus at the market price is $36$ dollars. What is the market price?'
            answer: '16'
            answer_contract: {"kind":"unit","quantity":"dollar","unit":"dollar","allow_omitted":true}
            solution_sketch: 'At market price $p$ the quantity is $q^* = \frac{p - 4}{2}$, and the producer surplus is $\int_0^{q^*} (p - 2q - 4)\,dq = \frac{(p - 4)^2}{4}$. Setting $\frac{(p - 4)^2}{4} = 36$ gives $(p - 4)^2 = 144$, so $p - 4 = 12$ and $p = 16$ dollars.'
          - problem: 'For the supply curve $p = 5q + 10$ at a market price of $60$ dollars, what is the producer surplus?'
            answer: '250'
            answer_contract: {"kind":"unit","quantity":"dollar","unit":"dollar","allow_omitted":true}
            solution_sketch: 'The surplus is the area between the price line and the curve, not the area under the supply curve. The market quantity is $q^* = 10$, and the surplus is $\int_0^{10} (50 - 5q)\,dq = 500 - 250 = 250$ dollars.'
          - problem: 'On a price-quantity graph the market price is a horizontal line and the supply curve rises from the origin. Which region represents the producer surplus: the region between the price line and the supply curve, the region under the supply curve only, the region above the price line, or the region between the demand and supply curves?'
            answer: 'between price and supply'
            answer_contract: {"kind":"label","options":[["between the price line and the supply curve","between price and supply","area between price and supply","the region between the price line and the supply curve"],["under the supply curve","below supply","area below supply only","under the supply curve only"],["above the price line","above price","area above price only","above the price line only"],["between the demand and supply curves","between demand and supply","area between demand and supply","between the demand curve and the supply curve"]]}
            solution_sketch: 'Producer surplus is the gain of firms that would sell at the supply price but sell at the higher market price. It is the area between the horizontal price line and the supply curve from $q = 0$ to the market quantity. The region under the supply curve ignores the price, and demand is not used here.'
        constraints: 'linear supply through small integer coefficients; also the market price from a given surplus, one error-analysis item and one conceptual identification of the region'
      - id: kp3
        name: Equilibrium, then both surpluses
        key_prerequisites: [systems-substitution, definite-integrals-ftc]
        exemplars:
          - problem: 'Demand is $p = 48 - q^2$ and supply is $p = 2q^2$, with $p$ in dollars. Find the equilibrium point $(q, p)$.'
            answer: '(4, 32)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'At equilibrium demand equals supply: $48 - q^2 = 2q^2$, so $3q^2 = 48$ and $q^2 = 16$. The quantity is positive, so $q^* = 4$, and then $p^* = 2 \cdot 4^2 = 32$.'
          - problem: 'Demand is $p = 48 - q^2$ and supply is $p = 2q^2$. Find the consumer surplus at the equilibrium.'
            answer: '128/3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The equilibrium is $q^* = 4$, $p^* = 32$. The consumer surplus is $\int_0^4 (48 - q^2 - 32)\,dq = \int_0^4 (16 - q^2)\,dq = 64 - \frac{64}{3} = \frac{128}{3}$.'
          - problem: 'Demand is $p = 48 - q^2$ and supply is $p = 2q^2$. Find the producer surplus at the equilibrium.'
            answer: '256/3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The equilibrium is $q^* = 4$, $p^* = 32$. The producer surplus is $\int_0^4 (32 - 2q^2)\,dq = 128 - \frac{128}{3} = \frac{256}{3}$.'
          - problem: 'Demand is $p = 75 - q^2$ and supply is $p = 2q^2$. Find the producer surplus at the equilibrium.'
            answer: '500/3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Setting $75 - q^2 = 2q^2$ gives $q^2 = 25$, so $q^* = 5$ and $p^* = 50$. The producer surplus is $\int_0^5 (50 - 2q^2)\,dq = 250 - \frac{250}{3} = \frac{500}{3}$.'
          - problem: 'A market has demand $p = 27 - q^2$ and supply $p = 2q^2$, with $p$ in dollars. Find the total surplus, consumer surplus plus producer surplus, at the market equilibrium.'
            answer: '54'
            answer_contract: {"kind":"unit","quantity":"dollar","unit":"dollar","allow_omitted":true}
            solution_sketch: 'Setting $27 - q^2 = 2q^2$ gives $q^2 = 9$, so $q^* = 3$ and $p^* = 18$. The consumer surplus is $\int_0^3 (9 - q^2)\,dq = 18$ and the producer surplus is $\int_0^3 (18 - 2q^2)\,dq = 36$ dollars. The total is $18 + 36 = 54$ dollars.'
          - problem: 'A market has demand $p = 60 - 2q$ and supply $p = q + 6$. At the equilibrium, how many times as large is the consumer surplus as the producer surplus?'
            answer: '2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Setting $60 - 2q = q + 6$ gives $q^* = 18$ and $p^* = 24$. The consumer surplus is $\int_0^{18} (36 - 2q)\,dq = 324$ and the producer surplus is $\int_0^{18} (18 - q)\,dq = 162$. We divide: $324 \div 162 = 2$.'
          - problem: 'Demand is $p = 80 - q^2$ and supply is $p = 4q^2$. What is the producer surplus at equilibrium?'
            answer: '512/3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The integral of demand minus supply gives the total surplus, not the producer surplus. At equilibrium $q^* = 4$ and $p^* = 64$, and the producer surplus is $\int_0^4 (64 - 4q^2)\,dq = 256 - \frac{256}{3} = \frac{512}{3}$.'
        constraints: 'equilibrium solvable by setting demand = supply and factoring; quantities and prices come out as integers; also total surplus, a ratio of the two surpluses and one error-analysis item'
    diagnostic_exemplar:
      problem: 'Demand is $p = 27 - q^2$ and supply is $p = 2q^2$. Find the equilibrium point and the consumer surplus.'
      answer: '$q^* = 3$, $p^* = 18$; $CS = 18$'
      answer_contract: {kind: none}
      solution_sketch: '$27 - q^2 = 2q^2$ gives $q^* = 3$ and $p^* = 18$; then $CS = \int_0^3 (27 - q^2)\,dq - 3 \cdot 18 = 72 - 54$.'
    anki_seeds:
      - front: "Consumer surplus formula (demand d(q), market price p*, quantity q*)?"
        back: '$CS = \int_0^{q^*} (d(q) - p^*) \, dq$ — the area between the demand curve and the price line'
        type: basic
      - front: "Producer surplus formula (supply s(q), market price p*, quantity q*)?"
        back: '$PS = \int_0^{q^*} (p^* - s(q)) \, dq$ — the area between the price line and the supply curve'
        type: basic

  - id: volumes-known-cross-sections
    name: Volumes by Known Cross Sections
    core: false                # head of the solids-of-revolution applications branch
    difficulty: 0.58
    drill: false
    answer_kind: expression
    expected_time_secs: 210
    prerequisites:
      - id: definite-integrals-ftc
        weight: 0.7
        key: true
      - id: area-between-curves-x
        weight: 0.5
        key: true
      - id: area-triangles-quadrilaterals
        weight: 0.3
      - id: circle-area-circumference
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: Square cross sections
        key_prerequisites: [definite-integrals-ftc, area-between-curves-x]
        try_first:
          problem: 'A solid is $4$ m long, and every cross section perpendicular to its length is a square of side $3$ m. What is its volume in cubic metres?'
          answer_contract: {"kind":"exact"}
          answer: '36'
          reveal: 'Each square has area $3^2 = 9$ square metres, and the solid is $4$ m long, so the volume is $9 \cdot 4 = 36$. When the side changes along the solid, the area is a function $A(x)$ and we integrate it.'
        exemplars:
          - problem: 'The base of a solid is the region under $y = \sqrt{x}$ for $0 \le x \le 4$. Cross sections perpendicular to the $x$-axis are squares with side running from the $x$-axis to the curve. Find the volume.'
            answer: '8'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The side of the square at $x$ is $\sqrt{x}$, so its area is $A(x) = x$. The volume is $\int_0^4 x\,dx = \left[\frac{x^2}{2}\right]_0^4 = 8$.'
          - problem: 'The base of a solid is the region between $y = 1 - x^2$ and the $x$-axis. Cross sections perpendicular to the $x$-axis are squares. Find the volume.'
            answer: '16/15'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The curve meets the axis at $x = \pm 1$, and the side of the square at $x$ is $1 - x^2$. The volume is $\int_{-1}^{1} (1 - x^2)^2\,dx = 2\left(1 - \frac{2}{3} + \frac{1}{5}\right) = \frac{16}{15}$.'
          - problem: 'The base of a solid is the region under $y = x^2$ for $0 \le x \le 3$. Cross sections perpendicular to the $x$-axis are squares with side running from the $x$-axis to the curve. Find the volume.'
            answer: '243/5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The side of the square at $x$ is $x^2$, so its area is $A(x) = x^4$. The volume is $\int_0^3 x^4\,dx = \left[\frac{x^5}{5}\right]_0^3 = \frac{243}{5}$.'
          - problem: 'A block of wood has as its base the region between $y = 2x$ and $y = x^2$ for $0 \le x \le 2$, with $x$ and $y$ in metres. Every cross section perpendicular to the $x$-axis is a square. The wood has mass $750$ kg per cubic metre. Find the mass of the block.'
            answer: '800'
            answer_contract: {"kind":"unit","quantity":"mass","unit":"kg","allow_omitted":true}
            solution_sketch: 'The side of the square at $x$ is $2x - x^2$, so the volume is $\int_0^2 (2x - x^2)^2\,dx = \int_0^2 (4x^2 - 4x^3 + x^4)\,dx = \frac{16}{15}$ cubic metres. We multiply by the mass per cubic metre: $\frac{16}{15} \cdot 750 = 800$ kg.'
          - problem: 'A concrete footing has as its base the region under $y = 2\sqrt{x}$ for $0 \le x \le 4$, with $x$ and $y$ in metres. Cross sections perpendicular to the $x$-axis are squares with side running from the $x$-axis to the curve. A pump delivers $2$ m$^3$ of concrete per trip. How many trips fill the footing?'
            answer: '16'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The side of the square at $x$ is $2\sqrt{x}$, so its area is $4x$. The footing has volume $\int_0^4 4x\,dx = 32$ cubic metres. Each trip delivers $2$ cubic metres, so we divide: $32 \div 2 = 16$ trips.'
          - problem: 'A solid has as base the region under $y = x^2$ for $0 \le x \le 2$. Its cross sections perpendicular to the $x$-axis are squares. What is its volume?'
            answer: '32/5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The integrand must be the area of the square, $A(x) = (x^2)^2 = x^4$, not the side length. The volume is $\int_0^2 x^4\,dx = \frac{32}{5}$.'
          - problem: 'The base of a solid is the region between $y = x$ and $y = x^2$ for $0 \le x \le 1$. Cross sections perpendicular to the $x$-axis are squares. Find the volume.'
            answer: '1/30'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The line is above the parabola on $[0,1]$, so the side of the square is $x - x^2$. The volume is $\int_0^1 (x^2 - 2x^3 + x^4)\,dx = \frac{1}{3} - \frac{1}{2} + \frac{1}{5} = \frac{1}{30}$.'
          - problem: 'The base of a solid is the region between $y = 3x$ and $y = x^2$ for $0 \le x \le 3$. Cross sections perpendicular to the $x$-axis are squares. Find the volume.'
            answer: '81/10'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The side of the square is $3x - x^2$, so $A(x) = 9x^2 - 6x^3 + x^4$. The volume is $\int_0^3 (9x^2 - 6x^3 + x^4)\,dx = 81 - \frac{243}{2} + \frac{243}{5} = \frac{81}{10}$.'
          - problem: 'The base of a solid is the region under $y = x^3$ for $0 \le x \le 2$. Cross sections perpendicular to the $x$-axis are squares with side running from the $x$-axis to the curve. Find the volume.'
            answer: '128/7'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The side of the square at $x$ is $x^3$, so its area is $A(x) = x^6$. The volume is $\int_0^2 x^6\,dx = \left[\frac{x^7}{7}\right]_0^2 = \frac{128}{7}$.'
        constraints: 'side length equals the height of the base region; (side)^2 integrates as a polynomial; also mass and trip-count problems set in context and one error-analysis item'
      - id: kp2
        name: Semicircular and triangular cross sections
        key_prerequisites: [circle-area-circumference, area-triangles-quadrilaterals]
        exemplars:
          - problem: 'The base of a solid is the region under $y = \sqrt{x}$ for $0 \le x \le 4$. Cross sections perpendicular to the $x$-axis are semicircles with diameter running from the $x$-axis to the curve. Find the volume.'
            answer: 'pi'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The diameter at $x$ is $\sqrt{x}$, so the radius is $\frac{\sqrt{x}}{2}$ and the semicircle has area $\frac{\pi x}{8}$. The volume is $\frac{\pi}{8}\int_0^4 x\,dx = \frac{\pi}{8} \cdot 8 = \pi$.'
          - problem: 'The base of a solid is the region between $y = 1 - x^2$ and the $x$-axis. Cross sections perpendicular to the $x$-axis are equilateral triangles. Find the volume.'
            answer: '4sqrt(3)/15'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'An equilateral triangle with side $s$ has area $\frac{\sqrt{3}}{4}s^2$, and here $s = 1 - x^2$ on $[-1,1]$. The volume is $\frac{\sqrt{3}}{4}\int_{-1}^{1} (1 - x^2)^2\,dx = \frac{\sqrt{3}}{4} \cdot \frac{16}{15} = \frac{4\sqrt{3}}{15}$.'
          - problem: 'The base of a solid is the region between $y = 1 - x^2$ and the $x$-axis. Cross sections perpendicular to the $x$-axis are semicircles with diameter in the base. Find the volume.'
            answer: '2pi/15'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The diameter at $x$ is $1 - x^2$, so the semicircle has area $\frac{\pi}{8}(1 - x^2)^2$. The volume is $\frac{\pi}{8}\int_{-1}^{1} (1 - x^2)^2\,dx = \frac{\pi}{8} \cdot \frac{16}{15} = \frac{2\pi}{15}$.'
          - problem: 'The base of a solid is the region under $y = \sqrt{x}$ for $0 \le x \le 4$. Cross sections perpendicular to the $x$-axis are equilateral triangles with a side running from the $x$-axis to the curve. Find the volume.'
            answer: '2sqrt(3)'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The side at $x$ is $\sqrt{x}$, so the triangle has area $\frac{\sqrt{3}}{4}x$. The volume is $\frac{\sqrt{3}}{4}\int_0^4 x\,dx = \frac{\sqrt{3}}{4} \cdot 8 = 2\sqrt{3}$.'
          - problem: 'The base of a solid is the region under $y = x^2$ for $0 \le x \le 2$. Cross sections perpendicular to the $x$-axis are isosceles right triangles with a leg in the base. Find the volume.'
            answer: '16/5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'A leg of length $x^2$ gives a triangle of area $\frac{1}{2}(x^2)^2 = \frac{x^4}{2}$. The volume is $\frac{1}{2}\int_0^2 x^4\,dx = \frac{1}{2} \cdot \frac{32}{5} = \frac{16}{5}$.'
          - problem: 'A planter has as its floor plan the region between $y = 4 - x^2$ and the $x$-axis, with $x$ and $y$ in metres. Each cross section perpendicular to the $x$-axis is a semicircle with its diameter on the floor plan. Find the volume of soil that fills the planter.'
            answer: '64pi/15'
            answer_contract: {"kind":"unit","quantity":"cubic_volume","unit":"m^3","allow_omitted":true}
            solution_sketch: 'The diameter at $x$ is $4 - x^2$ for $-2 \le x \le 2$, so the semicircle has area $\frac{\pi}{8}(4 - x^2)^2$. The volume is $\frac{\pi}{8}\int_{-2}^{2} (4 - x^2)^2\,dx = \frac{\pi}{8} \cdot \frac{512}{15} = \frac{64\pi}{15}$ cubic metres.'
          - problem: 'A gravel mound has as its base the region under $y = x$ for $0 \le x \le 6$, with $x$ and $y$ in metres. Cross sections perpendicular to the $x$-axis are isosceles right triangles with a leg in the base. A wheelbarrow carries half a cubic metre of gravel. How many wheelbarrow loads make the mound?'
            answer: '72'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The leg at $x$ is $x$, so the triangle has area $\frac{x^2}{2}$. The mound has volume $\frac{1}{2}\int_0^6 x^2\,dx = \frac{1}{2} \cdot 72 = 36$ cubic metres. Each load is half a cubic metre, so we divide: $36 \div \frac{1}{2} = 72$ loads.'
          - problem: 'The base of a solid is the region under $y = \sqrt{x}$ for $0 \le x \le b$, where $b > 0$. Cross sections perpendicular to the $x$-axis are equilateral triangles with a side running from the $x$-axis to the curve. The volume is $\frac{9\sqrt{3}}{2}$. Find $b$.'
            answer: '6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The triangle at $x$ has area $\frac{\sqrt{3}}{4}x$, so the volume is $\frac{\sqrt{3}}{4}\int_0^b x\,dx = \frac{\sqrt{3}}{8}b^2$. Setting $\frac{\sqrt{3}}{8}b^2 = \frac{9\sqrt{3}}{2}$ gives $b^2 = 36$, so $b = 6$.'
        constraints: 'cross-section area = (known shape constant) x (base width)^2; semicircle uses the width as diameter; also isosceles right triangles with a leg in the base, planter and gravel problems set in context, and one find-the-limit item'
      - id: kp3
        name: Cross sections perpendicular to the y-axis
        key_prerequisites: [definite-integrals-ftc, area-between-curves-x]
        exemplars:
          - problem: 'The base of a solid is the region between the $y$-axis and $x = 4 - y^2$ for $-2 \le y \le 2$. Cross sections perpendicular to the $y$-axis are squares. Find the volume.'
            answer: '512/15'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'At height $y$ the width of the base is $4 - y^2$, so the square has area $(4 - y^2)^2$. The volume is $\int_{-2}^{2} (4 - y^2)^2\,dy = 2\left(32 - \frac{64}{3} + \frac{32}{5}\right) = \frac{512}{15}$.'
          - problem: 'Find the volume of a solid whose base is the region between $x = y^2$ and $x = 1$, with square cross sections perpendicular to the $y$-axis.'
            answer: '16/15'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The curves meet at $y = \pm 1$, and at height $y$ the width is $1 - y^2$, so $A(y) = (1 - y^2)^2$. The volume is $\int_{-1}^{1} (1 - y^2)^2\,dy = \frac{16}{15}$.'
          - problem: 'The base of a solid is the region between the $y$-axis and the line $x = 4 - y$ for $0 \le y \le 4$. Cross sections perpendicular to the $y$-axis are isosceles right triangles whose hypotenuse lies in the base. Find the volume.'
            answer: '16/3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The width at height $y$ is $w = 4 - y$, and a right isosceles triangle with hypotenuse $w$ has area $\frac{w^2}{4}$. The volume is $\frac{1}{4}\int_0^4 (4 - y)^2\,dy = \frac{1}{4} \cdot \frac{64}{3} = \frac{16}{3}$.'
          - problem: 'The base of a solid is the region between $x = y^2$ and $x = 4$ for $-2 \le y \le 2$. Cross sections perpendicular to the $y$-axis are rectangles whose height is three times their base width. Find the volume.'
            answer: '512/5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The width at height $y$ is $w = 4 - y^2$, and the rectangle has height $3w$, so its area is $3w^2 = 3(4 - y^2)^2$. The volume is $3\int_{-2}^{2} (4 - y^2)^2\,dy = 3 \cdot \frac{512}{15} = \frac{512}{5}$.'
          - problem: 'The base of a solid is the region between the $y$-axis and the line $x = 2 - y$ for $0 \le y \le 2$. Cross sections perpendicular to the $y$-axis are squares. Find the volume.'
            answer: '8/3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The width at height $y$ is $2 - y$, so the square has area $(2 - y)^2$. The volume is $\int_0^2 (2 - y)^2\,dy = \left[-\frac{(2 - y)^3}{3}\right]_0^2 = \frac{8}{3}$.'
          - problem: 'A museum model stands on a base bounded by $x = y^2$ and $x = 2 - y^2$, with $x$ and $y$ in metres. Every cross section perpendicular to the $y$-axis is a square. Find the volume of the model.'
            answer: '64/15'
            answer_contract: {"kind":"unit","quantity":"cubic_volume","unit":"m^3","allow_omitted":true}
            solution_sketch: 'The curves meet at $y = \pm 1$, and the width at height $y$ is $(2 - y^2) - y^2 = 2 - 2y^2$. The volume is $\int_{-1}^{1} (2 - 2y^2)^2\,dy = 4 \cdot \frac{16}{15} = \frac{64}{15}$ cubic metres.'
          - problem: 'A solid has as base the region between the $y$-axis and $x = 3 - y$ for $0 \le y \le 3$. Its cross sections perpendicular to the $y$-axis are isosceles right triangles with the hypotenuse in the base. What is its volume?'
            answer: '9/4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Here the width $3 - y$ is the hypotenuse, so the area is $\frac{(3 - y)^2}{4}$. The volume is $\frac{1}{4}\int_0^3 (3 - y)^2\,dy = \frac{1}{4} \cdot 9 = \frac{9}{4}$.'
          - problem: 'A solid has as its base the region between the $y$-axis and $x = 4 - y$ for $0 \le y \le 4$, with $x$ and $y$ in metres. Every cross section perpendicular to the $y$-axis is a square. The solid has mass $32$ kg. What is the density of its material in kilograms per cubic metre?'
            answer: '3/2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The volume is $\int_0^4 (4 - y)^2\,dy = \frac{64}{3}$ cubic metres. Density is mass divided by volume, so $32 \div \frac{64}{3} = \frac{3}{2}$ kilograms per cubic metre.'
        constraints: 'slices taken in y; width read as right curve minus left curve; evaluate to an exact rational; also museum-model and density problems set in context and one error-analysis item'
    diagnostic_exemplar:
      problem: 'The base of a solid is the region between the $y$-axis and $x = 1 - y^2$ for $-1 \le y \le 1$. Cross sections perpendicular to the $y$-axis are squares. Find the volume.'
      answer: '$16/15$'
      solution_sketch: 'The side at height $y$ is $1 - y^2$, so $V = \int_{-1}^{1}(1 - y^2)^2\,dy = \frac{16}{15}$.'
    anki_seeds:
      - front: "Volume of a solid with cross-sectional area A(x) from a to b?"
        back: '$V = \int_a^b A(x) \, dx$'
        type: basic
      - front: "Semicircular cross section on a diameter of length w: its area?"
        back: '$\frac{\pi w^2}{8}$ (radius $w/2$, half of $\pi r^2$)'
        type: basic

  - id: volumes-disks
    name: Volumes by Disks
    core: false                # solids-of-revolution applications branch
    difficulty: 0.6
    drill: false
    answer_kind: expression
    expected_time_secs: 210
    prerequisites:
      - id: volumes-known-cross-sections
        weight: 0.7
        key: true
      - id: definite-integrals-ftc
        weight: 0.5
        key: true
      - id: circle-area-circumference
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: 'Disks about the x-axis'
        key_prerequisites: [volumes-known-cross-sections, circle-area-circumference]
        try_first:
          problem: 'A can has radius $2$ cm and height $5$ cm. Find its volume in cubic centimeters.'
          answer_contract: {"kind":"exact"}
          answer: '20*pi'
          reveal: 'A thin slice of a solid of revolution is almost a can: its radius is $f(x)$ and its height is the tiny width $dx$, so its volume is $\pi f(x)^2\,dx$. Adding up all the slices gives $V=\pi\int_a^b f(x)^2\,dx$.'
        exemplars:
          - problem: 'The region under $y = \sqrt{x}$ for $0 \le x \le 4$ is rotated about the $x$-axis. Find the volume.'
            answer: '8*pi'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Each slice is a disk of radius $\sqrt{x}$, so $V = \pi\int_0^4 (\sqrt{x})^2\,dx = \pi\int_0^4 x\,dx$. The integral equals $\frac{4^2}{2} = 8$, so the volume is $8\pi$.'
          - problem: 'The region under $y = x^2$ for $0 \le x \le 1$ is rotated about the $x$-axis. Find the volume.'
            answer: 'pi/5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Each disk has radius $x^2$, so $V = \pi\int_0^1 x^4\,dx$. The integral equals $\frac{1}{5}$, so the volume is $\frac{\pi}{5}$.'
          - problem: 'The region under $y = e^x$ for $0 \le x \le 1$ is rotated about the $x$-axis. Find the volume.'
            answer: 'pi*(e^2 - 1)/2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Each disk has radius $e^x$, so $V = \pi\int_0^1 e^{2x}\,dx$. An antiderivative is $\frac{e^{2x}}{2}$, and evaluating from $0$ to $1$ gives $\frac{e^2 - 1}{2}$. The volume is $\frac{\pi(e^2-1)}{2}$.'
          - problem: 'The region under $y = 2x$ for $0 \le x \le 1$ is rotated about the $x$-axis. Find the volume.'
            answer: '4*pi/3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Each disk has radius $2x$, so $V = \pi\int_0^1 4x^2\,dx$. An antiderivative of $4x^2$ is $\frac{4x^3}{3}$, which equals $\frac{4}{3}$ at $x=1$ and $0$ at $x=0$. The volume is $\frac{4\pi}{3}$.'
          - problem: 'The region under $y = x^2 + 1$ for $0 \le x \le 1$ is rotated about the $x$-axis. Find the volume.'
            answer: '28*pi/15'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Each disk has radius $x^2+1$, so $V = \pi\int_0^1 (x^2+1)^2\,dx = \pi\int_0^1 (x^4 + 2x^2 + 1)\,dx$. The integral equals $\frac{1}{5} + \frac{2}{3} + 1 = \frac{28}{15}$. The volume is $\frac{28\pi}{15}$.'
          - problem: 'The inside of a bowl has the shape of the solid formed by rotating the region under $y = \sqrt{x}$ for $0 \le x \le 6$ about the $x$-axis, with lengths in centimeters. How much water does the bowl hold when it is full?'
            answer: '18*pi'
            answer_contract: {"kind":"unit","quantity":"cubic_volume","unit":"cm^3","allow_omitted":true}
            solution_sketch: 'The water fills the solid of revolution, so its volume is $V = \pi\int_0^6 (\sqrt{x})^2\,dx = \pi\int_0^6 x\,dx$. The integral equals $\frac{6^2}{2} = 18$, so the bowl holds $18\pi$ cm$^3$.'
          - problem: 'The region under $y = x^2$ for $0 \le x \le b$ is rotated about the $x$-axis, and the volume of the solid is $\frac{32\pi}{5}$. Find $b$.'
            answer: '2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The disk method gives $V = \pi\int_0^b x^4\,dx = \frac{\pi b^5}{5}$. Setting $\frac{\pi b^5}{5} = \frac{32\pi}{5}$ gives $b^5 = 32$, so $b = 2$.'
          - problem: 'A solid is formed by rotating the region under $y = \sqrt{x}$ for $0 \le x \le 4$ about the $x$-axis. A second solid uses the same curve for $0 \le x \le 2$. How many times as large as the second volume is the first volume?'
            answer: '4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Each volume is $\pi\int x\,dx$. The first is $\pi\cdot\frac{4^2}{2} = 8\pi$ and the second is $\pi\cdot\frac{2^2}{2} = 2\pi$. The ratio is $\frac{8\pi}{2\pi} = 4$, so the first volume is $4$ times as large.'
          - problem: 'The region under $y = x^3$ for $0 \le x \le 1$ is rotated about the $x$-axis. What is the volume?'
            answer: 'pi/7'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The radius of each disk is $x^3$, so $V = \pi\int_0^1 (x^3)^2\,dx = \pi\int_0^1 x^6\,dx$. The integral equals $\frac{1}{7}$, so the volume is $\frac{\pi}{7}$.'
        constraints: 'region under a single curve down to the x-axis, axis of rotation the x-axis; radius^2 integrates as a polynomial or e^{2x}; includes measured volumes in cm^3, finding an upper bound b from a given volume, ratio of volumes, one named-person error item'
      - id: kp2
        name: 'Disks about the y-axis'
        key_prerequisites: [volumes-known-cross-sections, definite-integrals-ftc]
        exemplars:
          - problem: 'The region bounded by $y = x^2$, $y = 1$, and $x = 0$ (with $x \ge 0$) is rotated about the $y$-axis. Find the volume.'
            answer: 'pi/2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Slice horizontally. At height $y$ the disk has radius $x = \sqrt{y}$, so $V = \pi\int_0^1 y\,dy = \frac{\pi}{2}$.'
          - problem: 'The region bounded by $y = x^3$, $y = 8$, and $x = 0$ (with $x \ge 0$) is rotated about the $y$-axis. Find the volume.'
            answer: '96*pi/5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'At height $y$ the radius is $x = y^{1/3}$, so $V = \pi\int_0^8 y^{2/3}\,dy$. This equals $\pi\cdot\frac{3}{5}\cdot 8^{5/3} = \frac{3\cdot 32\,\pi}{5} = \frac{96\pi}{5}$.'
          - problem: 'The inside of a bowl has the shape of the solid formed by rotating the region bounded by $y = x^2$, $y = 9$, and $x = 0$ (with $x \ge 0$) about the $y$-axis, with lengths in centimeters. How much water does the bowl hold when it is full?'
            answer: '81*pi/2'
            answer_contract: {"kind":"unit","quantity":"cubic_volume","unit":"cm^3","allow_omitted":true}
            solution_sketch: 'The water fills the solid, and at height $y$ the disk has radius $\sqrt{y}$. So $V = \pi\int_0^9 y\,dy = \pi\cdot\frac{81}{2}$, and the bowl holds $\frac{81\pi}{2}$ cm$^3$.'
          - problem: 'The region bounded by $y = x^2 + 1$, $y = 6$, and $x = 0$ (with $x \ge 0$) is rotated about the $y$-axis. Find the volume.'
            answer: '25*pi/2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Solve $y = x^2+1$ for $x^2 = y - 1$. The disks run from $y = 1$ to $y = 6$, so $V = \pi\int_1^6 (y-1)\,dy = \pi\left[\frac{(y-1)^2}{2}\right]_1^6 = \frac{25\pi}{2}$.'
          - problem: 'The region bounded by $y = \sqrt{x}$, $y = 2$, and $x = 0$ is rotated about the $y$-axis. Find the volume.'
            answer: '32*pi/5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Solve $y = \sqrt{x}$ for $x = y^2$, so the disk radius is $y^2$. Then $V = \pi\int_0^2 y^4\,dy = \pi\cdot\frac{2^5}{5} = \frac{32\pi}{5}$.'
          - problem: 'The region bounded by $y = 2x + 2$, $y = 6$, and $x = 0$ is rotated about the $y$-axis. Find the volume.'
            answer: '16*pi/3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Solve $y = 2x+2$ for $x = \frac{y-2}{2}$. The disks run from $y = 2$ to $y = 6$, so $V = \pi\int_2^6 \frac{(y-2)^2}{4}\,dy = \pi\cdot\frac{4^3}{12} = \frac{16\pi}{3}$.'
          - problem: 'The region in the first quadrant bounded by $y = 4 - x$, $x = 0$, and $y = 0$ is rotated about the $y$-axis. Find the volume.'
            answer: '64*pi/3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Solve $y = 4 - x$ for $x = 4 - y$. The disks run from $y = 0$ to $y = 4$, so $V = \pi\int_0^4 (4-y)^2\,dy = \pi\cdot\frac{4^3}{3} = \frac{64\pi}{3}$.'
          - problem: 'A bowl is formed by rotating the curve $y = x^2$ (with $x \ge 0$) about the $y$-axis, with lengths in centimeters. When the bowl holds water to a depth of $h$ cm, the volume of water is $8\pi$ cm$^3$. Find $h$.'
            answer: '4'
            answer_contract: {"kind":"unit","quantity":"length","unit":"cm","allow_omitted":true}
            solution_sketch: 'The water is a stack of disks of radius $\sqrt{y}$ from $y = 0$ to $y = h$, so its volume is $\pi\int_0^h y\,dy = \frac{\pi h^2}{2}$. Setting $\frac{\pi h^2}{2} = 8\pi$ gives $h^2 = 16$, so $h = 4$ cm.'
          - problem: 'A bowl is formed by rotating the curve $y = x^2$ (with $x \ge 0$) about the $y$-axis. How many times as much water does it hold at a depth of $9$ cm as at a depth of $3$ cm?'
            answer: '9'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'At depth $d$ the volume is $\pi\int_0^d y\,dy = \frac{\pi d^2}{2}$. At depth $9$ this is $\frac{81\pi}{2}$ and at depth $3$ it is $\frac{9\pi}{2}$. The ratio is $\frac{81}{9} = 9$.'
          - problem: 'The region bounded by $y = x^2$, $y = 2$, and $x = 0$ (with $x \ge 0$) is rotated about the $y$-axis. What is the volume?'
            answer: '2*pi'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The radius of a disk is $x = \sqrt{y}$, so its square is $y$. The volume is $V = \pi\int_0^2 y\,dy = \pi\cdot\frac{2^2}{2} = 2\pi$.'
        constraints: 'invert the curve to x as a function of y; y-bounds are small integers; includes bowls in cm^3, a depth found from a given volume, a ratio of volumes, one named-person error item'
      - id: kp3
        name: 'Checking against known solids'
        key_prerequisites: [volumes-known-cross-sections, circle-area-circumference]
        exemplars:
          - problem: 'The semicircle $y = \sqrt{9 - x^2}$ is rotated about the $x$-axis to form a sphere. Use disks to find its volume.'
            answer: '36*pi'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The disk at $x$ has radius $\sqrt{9-x^2}$, so $V = \pi\int_{-3}^{3}(9 - x^2)\,dx = \pi\left[9x - \frac{x^3}{3}\right]_{-3}^{3} = \pi(18 + 18)$. The volume is $36\pi$, which agrees with $\frac{4}{3}\pi(3)^3$.'
          - problem: 'The line $y = \frac{4}{9}x$ for $0 \le x \le 9$ is rotated about the $x$-axis to form a cone. Use disks to find its volume.'
            answer: '48*pi'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The disk at $x$ has radius $\frac{4}{9}x$, so $V = \pi\int_0^9 \frac{16}{81}x^2\,dx = \pi\cdot\frac{16}{81}\cdot\frac{729}{3} = 48\pi$. The cone formula $\frac{\pi r^2 h}{3} = \frac{\pi\cdot 16\cdot 9}{3}$ gives the same value.'
          - problem: 'A party hat has the shape of the cone formed by rotating $y = \frac{5}{12}x$ for $0 \le x \le 12$ about the $x$-axis, with lengths in centimeters. What volume of sweets does the hat hold?'
            answer: '100*pi'
            answer_contract: {"kind":"unit","quantity":"cubic_volume","unit":"cm^3","allow_omitted":true}
            solution_sketch: 'The disk at $x$ has radius $\frac{5}{12}x$, so $V = \pi\int_0^{12}\frac{25}{144}x^2\,dx = \pi\cdot\frac{25}{144}\cdot\frac{1728}{3} = 100\pi$. The hat holds $100\pi$ cm$^3$.'
          - problem: 'The quarter circle $y = \sqrt{16 - x^2}$ for $0 \le x \le 4$ is rotated about the $x$-axis to form a hemisphere. Use disks to find its volume.'
            answer: '128*pi/3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The disk at $x$ has radius $\sqrt{16-x^2}$, so $V = \pi\int_0^4 (16 - x^2)\,dx = \pi\left(64 - \frac{64}{3}\right) = \frac{128\pi}{3}$. This is half of $\frac{4}{3}\pi(4)^3 = \frac{256\pi}{3}$.'
          - problem: 'The line $y = \frac{r}{h}x$ for $0 \le x \le h$ is rotated about the $x$-axis. Find the volume of the resulting cone in terms of $r$ and $h$.'
            answer: 'pi*r^2*h/3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The disk at $x$ has radius $\frac{r}{h}x$, so $V = \pi\int_0^h \frac{r^2}{h^2}x^2\,dx = \pi\frac{r^2}{h^2}\cdot\frac{h^3}{3}$. The volume is $\frac{\pi r^2 h}{3}$.'
          - problem: 'A solid metal sphere has volume $36\pi$ cm$^3$. Find its radius.'
            answer: '3'
            answer_contract: {"kind":"unit","quantity":"length","unit":"cm","allow_omitted":true}
            solution_sketch: 'The sphere formula is $V = \frac{4}{3}\pi r^3$. Setting $\frac{4}{3}\pi r^3 = 36\pi$ gives $r^3 = 27$, so $r = 3$ cm.'
          - problem: 'A cone-shaped pile of sand has base radius $3$ m and volume $12\pi$ m$^3$. How tall is the pile?'
            answer: '4'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'The cone formula is $V = \frac{\pi r^2 h}{3}$. With $r = 3$ this is $3\pi h$, and $3\pi h = 12\pi$ gives $h = 4$ m.'
          - problem: 'A bowl is a hemisphere of radius $6$ cm. A cone-shaped cup has base radius $3$ cm and height $4$ cm. How many full cups of water does it take to fill the bowl?'
            answer: '12'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The bowl holds $\frac{1}{2}\cdot\frac{4}{3}\pi(6)^3 = 144\pi$ cm$^3$. One cup holds $\frac{\pi(3)^2(4)}{3} = 12\pi$ cm$^3$. Divide: $\frac{144\pi}{12\pi} = 12$ cups.'
          - problem: 'A sphere has radius $6$ cm. A second sphere has radius $3$ cm. How many times as large is the volume of the larger sphere?'
            answer: '8'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The volume of a sphere is $\frac{4}{3}\pi r^3$, so it grows with the cube of the radius. Doubling the radius multiplies the volume by $2^3 = 8$, so the larger sphere has $8$ times the volume.'
        constraints: 'sphere, hemisphere and cone solids; answers must match the geometry formulas; includes measured volumes, finding a radius or height from a volume, a count of cups, one named-person error item'
    diagnostic_exemplar:
      problem: 'The region bounded by $y = x^2$, $y = 4$, and $x = 0$ (with $x \ge 0$) is rotated about the $y$-axis. Find the volume.'
      answer: '$8\pi$'
      solution_sketch: 'Invert to $x^2 = y$ and stack disks in $y$: $V = \pi\int_0^4 y\,dy = 8\pi$.'
    anki_seeds:
      - front: "Disk method volume formula about the x-axis?"
        back: '$V = \pi \int_a^b f(x)^2 \, dx$ (each slice is a disk of radius f(x))'
        type: basic
      - front: "Disk method about the y-axis: what must you do to the curve first?"
        back: "Solve for x as a function of y; then V = pi times the integral of x(y)^2 dy"
        type: basic

  - id: volumes-disks-washers
    name: Volumes by Disks and Washers
    core: false                # solids-of-revolution applications branch
    difficulty: 0.62
    drill: false
    answer_kind: expression
    expected_time_secs: 240
    prerequisites:
      - id: volumes-disks
        weight: 0.8
        key: true
      - id: area-between-curves
        weight: 0.6
        key: true
      - id: definite-integrals-ftc
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: 'Washers about the x-axis'
        key_prerequisites: [volumes-disks, area-between-curves]
        try_first:
          problem: 'A flat ring has outer radius $5$ cm and inner radius $3$ cm. Find its area in square centimeters.'
          answer_contract: {"kind":"exact"}
          answer: '16*pi'
          reveal: 'The ring is a disk of radius $5$ with a disk of radius $3$ cut out, so its area is $\pi(5^2-3^2)=16\pi$. A washer slice of a solid has the same form: $\pi(R^2-r^2)$ times its thickness.'
        exemplars:
          - problem: 'The region between $y = x$ and $y = x^2$ is rotated about the $x$-axis. Find the volume.'
            answer: '2*pi/15'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The curves meet at $x = 0$ and $x = 1$, and $y = x$ is above $y = x^2$ between them. So $V = \pi\int_0^1 (x^2 - x^4)\,dx = \pi\left(\frac{1}{3} - \frac{1}{5}\right) = \frac{2\pi}{15}$.'
          - problem: 'The region between $y = \sqrt{x}$ and $y = x$ is rotated about the $x$-axis. Find the volume.'
            answer: 'pi/6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The curves meet at $x = 0$ and $x = 1$. The outer radius is $\sqrt{x}$ and the inner radius is $x$, so $V = \pi\int_0^1 (x - x^2)\,dx = \pi\left(\frac{1}{2} - \frac{1}{3}\right) = \frac{\pi}{6}$.'
          - problem: 'A metal tube is turned from a solid by rotating the region between $y = 3$ and $y = 4$ for $0 \le x \le 10$ about the $x$-axis, with lengths in centimeters. What volume of metal does the tube contain?'
            answer: '70*pi'
            answer_contract: {"kind":"unit","quantity":"cubic_volume","unit":"cm^3","allow_omitted":true}
            solution_sketch: 'The outer radius is $4$ and the inner radius is $3$, so $V = \pi\int_0^{10}(4^2 - 3^2)\,dx = \pi\cdot 7\cdot 10$. The tube contains $70\pi$ cm$^3$ of metal.'
          - problem: 'The region between $y = \sqrt{x}$ and $y = x^2$ is rotated about the $x$-axis. Find the volume.'
            answer: '3*pi/10'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The curves meet at $x = 0$ and $x = 1$. The outer radius is $\sqrt{x}$ and the inner radius is $x^2$, so $V = \pi\int_0^1 (x - x^4)\,dx = \pi\left(\frac{1}{2} - \frac{1}{5}\right) = \frac{3\pi}{10}$.'
          - problem: 'The region between $y = 2x$ and $y = x^2$ is rotated about the $x$-axis. Find the volume.'
            answer: '64*pi/15'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The curves meet at $x = 0$ and $x = 2$, with $y = 2x$ outside. So $V = \pi\int_0^2 (4x^2 - x^4)\,dx = \pi\left(\frac{32}{3} - \frac{32}{5}\right) = \frac{64\pi}{15}$.'
          - problem: 'The region between $y = 4$ and $y = x^2$ is rotated about the $x$-axis. Find the volume.'
            answer: '256*pi/5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The curves meet at $x = -2$ and $x = 2$, with $y = 4$ outside. So $V = \pi\int_{-2}^{2} (16 - x^4)\,dx = \pi\left(64 - \frac{64}{5}\right) = \frac{256\pi}{5}$.'
          - problem: 'The region between $y = x$ and $y = x^4$ is rotated about the $x$-axis. Find the volume.'
            answer: '2*pi/9'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The curves meet at $x = 0$ and $x = 1$, and $y = x$ is above $y = x^4$ between them. So $V = \pi\int_0^1 (x^2 - x^8)\,dx = \pi\left(\frac{1}{3} - \frac{1}{9}\right) = \frac{2\pi}{9}$.'
          - problem: 'A tube is made by rotating the region between $y = 1$ and $y = 3$ for $0 \le x \le L$ about the $x$-axis, with lengths in centimeters. The tube contains $40\pi$ cm$^3$ of metal. How long is the tube?'
            answer: '5'
            answer_contract: {"kind":"unit","quantity":"length","unit":"cm","allow_omitted":true}
            solution_sketch: 'The outer radius is $3$ and the inner radius is $1$, so $V = \pi\int_0^L (9 - 1)\,dx = 8\pi L$. Setting $8\pi L = 40\pi$ gives $L = 5$ cm.'
          - problem: 'The region between $y = x$ and $y = x^3$ is rotated about the $x$-axis. What is the volume?'
            answer: '4*pi/21'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'A washer has area $\pi(R^2 - r^2)$. So $V = \pi\int_0^1 (x^2 - x^6)\,dx = \pi\left(\frac{1}{3} - \frac{1}{7}\right) = \frac{4\pi}{21}$.'
        constraints: 'curves intersect at x = 0 and x = 1 (or other integer bounds); subtract squared radii, never square the difference; includes a tube in cm^3, a length found from a given volume, one named-person error item'
      - id: kp2
        name: 'Washers about the y-axis'
        key_prerequisites: [volumes-disks, area-between-curves]
        exemplars:
          - problem: 'The region between $y = x^2$ and $y = \sqrt{x}$ is rotated about the $y$-axis. Find the volume.'
            answer: '3*pi/10'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'At height $y$ the outer radius is $x = \sqrt{y}$ and the inner radius is $x = y^2$, for $0 \le y \le 1$. So $V = \pi\int_0^1 (y - y^4)\,dy = \pi\left(\frac{1}{2} - \frac{1}{5}\right) = \frac{3\pi}{10}$.'
          - problem: 'A trophy base is turned from the region between $y = \sqrt{x}$ and $y = \frac{x}{2}$ rotated about the $y$-axis, with lengths in centimeters. What volume of marble does the base contain?'
            answer: '64*pi/15'
            answer_contract: {"kind":"unit","quantity":"cubic_volume","unit":"cm^3","allow_omitted":true}
            solution_sketch: 'For $0 \le y \le 2$ the outer radius is $x = 2y$ (from $y = \frac{x}{2}$) and the inner radius is $x = y^2$ (from $y = \sqrt{x}$). So $V = \pi\int_0^2 (4y^2 - y^4)\,dy = \pi\left(\frac{32}{3} - \frac{32}{5}\right) = \frac{64\pi}{15}$ cm$^3$.'
          - problem: 'A glass paperweight is made by rotating the region between $y = x^2$ and $y = 3x$ about the $y$-axis, with lengths in centimeters. What volume of glass does it contain?'
            answer: '27*pi/2'
            answer_contract: {"kind":"unit","quantity":"cubic_volume","unit":"cm^3","allow_omitted":true}
            solution_sketch: 'The curves meet at $y = 0$ and $y = 9$. At height $y$ the outer radius is $\sqrt{y}$ and the inner radius is $\frac{y}{3}$, so $V = \pi\int_0^9 \left(y - \frac{y^2}{9}\right)dy = \pi\left(\frac{81}{2} - 27\right) = \frac{27\pi}{2}$ cm$^3$.'
          - problem: 'The region between $y = x^2$ and $y = 2x$ is rotated about the $y$-axis. Find the volume.'
            answer: '8*pi/3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The curves meet at $y = 0$ and $y = 4$. The outer radius is $\sqrt{y}$ and the inner radius is $\frac{y}{2}$, so $V = \pi\int_0^4 \left(y - \frac{y^2}{4}\right)dy = \pi\left(8 - \frac{16}{3}\right) = \frac{8\pi}{3}$.'
          - problem: 'The region between $y = x^3$ and $y = x$ for $0 \le x \le 1$ is rotated about the $y$-axis. Find the volume.'
            answer: '4*pi/15'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'At height $y$ the outer radius is $x = y^{1/3}$ and the inner radius is $x = y$, for $0 \le y \le 1$. So $V = \pi\int_0^1 (y^{2/3} - y^2)\,dy = \pi\left(\frac{3}{5} - \frac{1}{3}\right) = \frac{4\pi}{15}$.'
          - problem: 'The region between $y = x^2$ and $y = x^{1/3}$ for $0 \le x \le 1$ is rotated about the $y$-axis. Find the volume.'
            answer: '5*pi/14'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Solving for $x$ gives $x = \sqrt{y}$ and $x = y^3$, and $\sqrt{y}$ is larger on $(0, 1)$. So $V = \pi\int_0^1 (y - y^6)\,dy = \pi\left(\frac{1}{2} - \frac{1}{7}\right) = \frac{5\pi}{14}$.'
          - problem: 'The region between $y = x^2$ and $y = kx$, where $k > 0$, is rotated about the $y$-axis. The volume of the solid is $\frac{8\pi}{3}$. Find $k$.'
            answer: '2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The curves meet at $y = 0$ and $y = k^2$. The washer integral is $\pi\int_0^{k^2}\left(y - \frac{y^2}{k^2}\right)dy = \pi\left(\frac{k^4}{2} - \frac{k^4}{3}\right) = \frac{\pi k^4}{6}$. Setting $\frac{\pi k^4}{6} = \frac{8\pi}{3}$ gives $k^4 = 16$, so $k = 2$.'
          - problem: 'The region between $y = x^2$ and $y = x$ is rotated about the $y$-axis. What is the volume?'
            answer: 'pi/6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'About the $y$-axis the radii are values of $x$ at height $y$: outer $\sqrt{y}$ and inner $y$. So $V = \pi\int_0^1 (y - y^2)\,dy = \pi\left(\frac{1}{2} - \frac{1}{3}\right) = \frac{\pi}{6}$.'
        constraints: 'invert both curves to x as functions of y; intersections at integer y-values; includes solids in cm^3, a parameter k found from a given volume, one named-person error item'
      - id: kp3
        name: 'Rotation about other horizontal lines'
        key_prerequisites: [volumes-disks, area-between-curves]
        exemplars:
          - problem: 'The region between $y = \sqrt{x}$ and $y = 1$ for $0 \le x \le 1$ is rotated about the line $y = 1$. Find the volume.'
            answer: 'pi/6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The radius of each disk is $1 - \sqrt{x}$, so $V = \pi\int_0^1 (1 - 2\sqrt{x} + x)\,dx = \pi\left(1 - \frac{4}{3} + \frac{1}{2}\right) = \frac{\pi}{6}$.'
          - problem: 'The region between $y = x^2$ and $y = 1$ is rotated about the line $y = 1$. Find the volume.'
            answer: '16*pi/15'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The curves meet at $x = -1$ and $x = 1$, and the radius of each disk is $1 - x^2$. So $V = \pi\int_{-1}^{1} (1 - x^2)^2\,dx = \pi\left(2 - \frac{4}{3} + \frac{2}{5}\right) = \frac{16\pi}{15}$.'
          - problem: 'A decorative bowl is modeled by rotating the region between $y = x^2$ and $y = 4$ about the line $y = 4$, with lengths in centimeters. What volume of material does the bowl contain?'
            answer: '512*pi/15'
            answer_contract: {"kind":"unit","quantity":"cubic_volume","unit":"cm^3","allow_omitted":true}
            solution_sketch: 'The curves meet at $x = -2$ and $x = 2$, and the radius of each disk is $4 - x^2$. So $V = \pi\int_{-2}^{2}(16 - 8x^2 + x^4)\,dx = \pi\left(64 - \frac{128}{3} + \frac{64}{5}\right) = \frac{512\pi}{15}$ cm$^3$.'
          - problem: 'The region between $y = x^3$ and $y = 1$ for $0 \le x \le 1$ is rotated about the line $y = 1$. Find the volume.'
            answer: '9*pi/14'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The radius of each disk is $1 - x^3$, so $V = \pi\int_0^1 (1 - 2x^3 + x^6)\,dx = \pi\left(1 - \frac{1}{2} + \frac{1}{7}\right) = \frac{9\pi}{14}$.'
          - problem: 'The region between $y = \sqrt{x}$ and $y = x^2$ is rotated about the line $y = -2$. Find the volume.'
            answer: '49*pi/30'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The axis lies below the region, so the radii are measured up from $y = -2$: outer $\sqrt{x} + 2$ and inner $x^2 + 2$. So $V = \pi\int_0^1 \left(x + 4\sqrt{x} - x^4 - 4x^2\right)dx = \pi\left(\frac{1}{2} + \frac{8}{3} - \frac{1}{5} - \frac{4}{3}\right) = \frac{49\pi}{30}$.'
          - problem: 'Let $R$ be the region bounded by $y = x^2 - 4$ and the $x$-axis. $R$ is rotated about the line $y = -4$. Find the volume.'
            answer: '256*pi/5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The curves meet at $x = -2$ and $x = 2$. Measured from $y = -4$, the outer radius is $4$ and the inner radius is $(x^2 - 4) + 4 = x^2$. So $V = \pi\int_{-2}^{2} (16 - x^4)\,dx = \frac{256\pi}{5}$.'
          - problem: 'The region between $y = x^2$ and $y = 2$ is rotated about the line $y = 2$. Find the volume.'
            answer: '64*sqrt(2)*pi/15'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The curves meet at $x = -\sqrt{2}$ and $x = \sqrt{2}$, and the radius of each disk is $2 - x^2$. So $V = \pi\int_{-\sqrt{2}}^{\sqrt{2}} (4 - 4x^2 + x^4)\,dx = \pi\cdot 2\sqrt{2}\left(4 - \frac{8}{3} + \frac{4}{5}\right)$. The volume is $\frac{64\sqrt{2}\pi}{15}$.'
          - problem: 'A bead is formed by rotating the region between $y = \sqrt{x}$ and $y = 3$ for $0 \le x \le 9$ about the line $y = 3$, with lengths in centimeters. What is the volume of the bead?'
            answer: '27*pi/2'
            answer_contract: {"kind":"unit","quantity":"cubic_volume","unit":"cm^3","allow_omitted":true}
            solution_sketch: 'The radius of each disk is $3 - \sqrt{x}$, so $V = \pi\int_0^9 (9 - 6\sqrt{x} + x)\,dx = \pi\left(81 - 108 + \frac{81}{2}\right) = \frac{27\pi}{2}$ cm$^3$.'
          - problem: 'The region between $y = \sqrt{x}$ and $y = a$, for $0 \le x \le a^2$ with $a > 0$, is rotated about the line $y = a$. The volume of the solid is $\frac{8\pi}{3}$. Find $a$.'
            answer: '2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The radius of each disk is $a - \sqrt{x}$, so $V = \pi\int_0^{a^2}\left(a^2 - 2a\sqrt{x} + x\right)dx = \pi a^4\left(1 - \frac{4}{3} + \frac{1}{2}\right) = \frac{\pi a^4}{6}$. Setting $\frac{\pi a^4}{6} = \frac{8\pi}{3}$ gives $a^4 = 16$, so $a = 2$.'
          - problem: 'The region between $y = x$ and $y = x^2$ is rotated about the line $y = -1$. What is the volume?'
            answer: '7*pi/15'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The radii must be measured from the axis $y = -1$, so they are $x + 1$ and $x^2 + 1$. Then $V = \pi\int_0^1 \left((x+1)^2 - (x^2+1)^2\right)dx = \pi\int_0^1 (2x - x^2 - x^4)\,dx = \pi\left(1 - \frac{1}{3} - \frac{1}{5}\right) = \frac{7\pi}{15}$.'
        constraints: 'axis is a horizontal line y = c outside or on the boundary of the region; radii are distances from the axis and stay nonnegative; includes solids in cm^3, a parameter a found from a given volume, one named-person error item'
    diagnostic_exemplar:
      problem: 'The region between $y = \sqrt{x}$ and $y = x$ is rotated about the line $y = -1$. Find the volume.'
      answer: '$\pi/2$'
      solution_sketch: 'Radii measured from $y = -1$: $R = \sqrt x + 1$, $r = x + 1$, so $V = \pi\int_0^1 (2\sqrt x - x - x^2)\,dx = \frac{\pi}{2}$.'
    anki_seeds:
      - front: "Washer method volume formula about the x-axis?"
        back: '$V = \pi \int_a^b \left(R(x)^2 - r(x)^2\right) dx$ (outer radius squared minus inner radius squared)'
        type: basic
      - front: "Classic washer error: pi times the integral of (R - r)^2 is wrong because..."
        back: '$(R - r)^2 \neq R^2 - r^2$; square each radius separately, then subtract'
        type: basic

  - id: volumes-shells-y-axis
    name: Cylindrical Shells About the y-Axis
    core: false                # solids-of-revolution applications branch
    difficulty: 0.64
    drill: false
    answer_kind: expression
    expected_time_secs: 210
    prerequisites:
      - id: volumes-disks-washers
        weight: 0.7
        key: true
      - id: definite-integrals-ftc
        weight: 0.5
      - id: circle-area-circumference
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: 'The shell formula'
        key_prerequisites: [volumes-disks-washers, circle-area-circumference]
        try_first:
          problem: 'A thin paper tube has radius $3$ cm and height $10$ cm, and its wall is $0.1$ cm thick. Unrolled, it is a flat sheet $10$ cm wide and $0.1$ cm thick, as long as the circle around the tube. Find the volume of the sheet in cubic centimeters.'
          answer_contract: {"kind":"exact"}
          answer: '6*pi'
          reveal: 'The sheet is $2\pi(3)=6\pi$ cm long, so its volume is $6\pi\cdot 10\cdot 0.1 = 6\pi$ cm$^3$. A thin shell of radius $x$, height $h$ and thickness $dx$ unrolls the same way into a slab of volume $2\pi x\cdot h\cdot dx$.'
        exemplars:
          - problem: 'The region under $y = x^2$ for $0 \le x \le 1$ is rotated about the $y$-axis. Use cylindrical shells to find the volume.'
            answer: 'pi/2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'A shell at $x$ has radius $x$ and height $x^2$, so $V = 2\pi\int_0^1 x\cdot x^2\,dx = 2\pi\cdot\frac{1}{4} = \frac{\pi}{2}$.'
          - problem: 'The region under the line $y = 2$ for $0 \le x \le 1$ is rotated about the $y$-axis. Use cylindrical shells to find the volume of the solid.'
            answer: '2*pi'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'A shell at $x$ has radius $x$ and height $2$, so $V = 2\pi\int_0^1 2x\,dx = 2\pi$. This agrees with the cylinder of radius $1$ and height $2$, which has volume $\pi(1)^2(2) = 2\pi$.'
          - problem: 'The region under $y = x$ for $0 \le x \le 3$ is rotated about the $y$-axis. Use cylindrical shells to find the volume.'
            answer: '18*pi'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'A shell at $x$ has radius $x$ and height $x$, so $V = 2\pi\int_0^3 x^2\,dx$. The integral equals $\frac{3^3}{3} = 9$, so $V = 2\pi\cdot 9 = 18\pi$.'
          - problem: 'A paperweight is made by rotating the region under $y = 4 - x^2$ for $0 \le x \le 2$ about the $y$-axis, with lengths in centimeters. How much glass does the paperweight contain?'
            answer: '8*pi'
            answer_contract: {"kind":"unit","quantity":"cubic_volume","unit":"cm^3","allow_omitted":true}
            solution_sketch: 'A shell at $x$ has radius $x$ and height $4 - x^2$, so $V = 2\pi\int_0^2 (4x - x^3)\,dx = 2\pi\left(8 - 4\right) = 8\pi$. The paperweight contains $8\pi$ cm$^3$ of glass.'
          - problem: 'The region under $y = \frac{1}{x}$ for $1 \le x \le 3$ is rotated about the $y$-axis. Use cylindrical shells to find the volume.'
            answer: '4*pi'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'A shell at $x$ has radius $x$ and height $\frac{1}{x}$, so the product is $1$. Then $V = 2\pi\int_1^3 1\,dx = 2\pi\cdot 2 = 4\pi$.'
          - problem: 'The triangle with vertices $(0, 0)$, $(2, 0)$ and $(0, 2)$ is rotated about the $y$-axis. Use cylindrical shells to find the volume.'
            answer: '8*pi/3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The top edge is $y = 2 - x$, so a shell at $x$ has radius $x$ and height $2 - x$. Then $V = 2\pi\int_0^2 (2x - x^2)\,dx = 2\pi\left(4 - \frac{8}{3}\right) = \frac{8\pi}{3}$.'
          - problem: 'The region under $y = 1 - x$ for $0 \le x \le 1$ is rotated about the $y$-axis. Use cylindrical shells to find the volume.'
            answer: 'pi/3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'A shell at $x$ has radius $x$ and height $1 - x$, so $V = 2\pi\int_0^1 (x - x^2)\,dx = 2\pi\left(\frac{1}{2} - \frac{1}{3}\right) = \frac{\pi}{3}$.'
          - problem: 'The region under $y = x^2$ for $0 \le x \le b$ is rotated about the $y$-axis, and the volume of the solid is $8\pi$. Find $b$.'
            answer: '2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The shell formula gives $V = 2\pi\int_0^b x^3\,dx = \frac{\pi b^4}{2}$. Setting $\frac{\pi b^4}{2} = 8\pi$ gives $b^4 = 16$, so $b = 2$.'
          - problem: 'The region under $y = x^2$ is rotated about the $y$-axis once for $0 \le x \le 1$ and once for $0 \le x \le 2$. How many times as large as the first volume is the second volume?'
            answer: '16'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The volume for $0 \le x \le b$ is $2\pi\int_0^b x^3\,dx = \frac{\pi b^4}{2}$. For $b = 1$ it is $\frac{\pi}{2}$ and for $b = 2$ it is $8\pi$, so the ratio is $\frac{8\pi}{\pi/2} = 16$.'
          - problem: 'The region under $y = x^3$ for $0 \le x \le 1$ is rotated about the $y$-axis. What is the volume?'
            answer: '2*pi/5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'A shell at $x$ has radius $x$ and height $x^3$, so $V = 2\pi\int_0^1 x\cdot x^3\,dx = 2\pi\int_0^1 x^4\,dx$. The integral equals $\frac{1}{5}$, so the volume is $\frac{2\pi}{5}$.'
        constraints: 'shell radius x, height = curve; includes a paperweight in cm^3, a bound b found from a given volume, a ratio of volumes, one named-person error item'
      - id: kp2
        name: 'Shells with power-function heights'
        key_prerequisites: [volumes-disks-washers, definite-integrals-ftc]
        exemplars:
          - problem: 'The region under $y = \sqrt{x}$ for $0 \le x \le 1$ is rotated about the $y$-axis. Use cylindrical shells to find the volume.'
            answer: '4*pi/5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'A shell at $x$ has radius $x$ and height $\sqrt{x}$, so $V = 2\pi\int_0^1 x^{3/2}\,dx = 2\pi\cdot\frac{2}{5} = \frac{4\pi}{5}$.'
          - problem: 'The region under $y = 2x - x^2$ for $0 \le x \le 2$ is rotated about the $y$-axis. Find the volume.'
            answer: '8*pi/3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'A shell at $x$ has radius $x$ and height $2x - x^2$, so $V = 2\pi\int_0^2 (2x^2 - x^3)\,dx = 2\pi\left(\frac{16}{3} - 4\right) = \frac{8\pi}{3}$.'
          - problem: 'A candle mould is formed by rotating the region under $y = \sqrt{x}$ for $0 \le x \le 9$ about the $y$-axis, with lengths in centimeters. How much wax does the mould hold?'
            answer: '972*pi/5'
            answer_contract: {"kind":"unit","quantity":"cubic_volume","unit":"cm^3","allow_omitted":true}
            solution_sketch: 'A shell at $x$ has radius $x$ and height $\sqrt{x}$, so $V = 2\pi\int_0^9 x^{3/2}\,dx = 2\pi\cdot\frac{2}{5}\cdot 9^{5/2} = \frac{4\pi}{5}\cdot 243$. The mould holds $\frac{972\pi}{5}$ cm$^3$.'
          - problem: 'The region under $y = x^3$ for $0 \le x \le 2$ is rotated about the $y$-axis. Find the volume.'
            answer: '64*pi/5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'A shell at $x$ has radius $x$ and height $x^3$, so $V = 2\pi\int_0^2 x^4\,dx = 2\pi\cdot\frac{2^5}{5} = \frac{64\pi}{5}$.'
          - problem: 'A wooden knob is turned by rotating the region under $y = x^2$ for $0 \le x \le 3$ about the $y$-axis, with lengths in centimeters. What is the volume of the knob?'
            answer: '81*pi/2'
            answer_contract: {"kind":"unit","quantity":"cubic_volume","unit":"cm^3","allow_omitted":true}
            solution_sketch: 'A shell at $x$ has radius $x$ and height $x^2$, so $V = 2\pi\int_0^3 x^3\,dx = 2\pi\cdot\frac{3^4}{4} = 2\pi\cdot\frac{81}{4}$. The knob has volume $\frac{81\pi}{2}$ cm$^3$.'
          - problem: 'The region under $y = \sqrt{x}$ for $1 \le x \le 4$ is rotated about the $y$-axis. Find the volume.'
            answer: '124*pi/5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'A shell at $x$ has radius $x$ and height $\sqrt{x}$, so $V = 2\pi\int_1^4 x^{3/2}\,dx = 2\pi\cdot\frac{2}{5}\left(4^{5/2} - 1\right) = \frac{4\pi}{5}\cdot 31 = \frac{124\pi}{5}$.'
          - problem: 'The region under $y = \frac{1}{x}$ for $1 \le x \le 2$ is rotated about the $y$-axis. Find the volume.'
            answer: '2*pi'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'A shell at $x$ has radius $x$ and height $\frac{1}{x}$, so the product is $1$. Then $V = 2\pi\int_1^2 1\,dx = 2\pi$.'
          - problem: 'The region under $y = \sqrt{x}$ for $0 \le x \le b$ is rotated about the $y$-axis, and the volume of the solid is $\frac{128\pi}{5}$. Find $b$.'
            answer: '4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The shell formula gives $V = 2\pi\int_0^b x^{3/2}\,dx = \frac{4\pi}{5}b^{5/2}$. Setting $\frac{4\pi}{5}b^{5/2} = \frac{128\pi}{5}$ gives $b^{5/2} = 32$, so $b = 32^{2/5} = 4$.'
          - problem: 'The region under $y = \sqrt[3]{x}$ for $0 \le x \le 1$ is rotated about the $y$-axis. What is the volume?'
            answer: '6*pi/7'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The radius of a shell is $x$. The integrand is $x\cdot x^{1/3} = x^{4/3}$, so $V = 2\pi\int_0^1 x^{4/3}\,dx = 2\pi\cdot\frac{3}{7} = \frac{6\pi}{7}$.'
        constraints: 'integrand x f(x) is a polynomial or a single power of x (fractional powers allowed); bounds are small integers; includes measured solids in cm^3, a bound b found from a given volume, one named-person error item'
    diagnostic_exemplar:
      problem: 'The region under $y = \sqrt{x}$ for $0 \le x \le 4$ is rotated about the $y$-axis. Find the volume by shells.'
      answer: '$128\pi/5$'
      solution_sketch: '$V = 2\pi\int_0^4 x\sqrt x\,dx = 2\pi \cdot \frac{2}{5}\cdot 32$.'
    anki_seeds:
      - front: "Shell method volume formula about the y-axis?"
        back: '$V = 2\pi \int_a^b x \, f(x) \, dx$ (radius times height)'
        type: basic
      - front: "Where does the shell factor 2 pi x come from?"
        back: 'Unrolling a thin cylindrical shell of radius $x$ gives a slab of length $2\pi x$ (the circumference), height $f(x)$, thickness $dx$.'
        type: basic

