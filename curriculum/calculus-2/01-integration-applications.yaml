          - problem: 'The region between $y = x^2$ and $y = x^3$ is rotated about the $y$-axis. Find the volume.'
            answer: 'pi/10'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The curves meet at $x = 0$ and $x = 1$, with $y = x^2$ on top. So $V = 2\pi\int_0^1 x(x^2 - x^3)\,dx = 2\pi\left(\frac{1}{4} - \frac{1}{5}\right) = \frac{\pi}{10}$.'
          - problem: 'A glass ornament is formed by rotating the region between $y = 4x$ and $y = x^2$ about the $y$-axis, with lengths in centimeters. What volume of glass does the ornament contain?'
            answer: '128*pi/3'
            answer_contract: {"kind":"unit","quantity":"cubic_volume","unit":"cm^3","allow_omitted":true}
            solution_sketch: 'The curves meet at $x = 0$ and $x = 4$, with $y = 4x$ on top. So $V = 2\pi\int_0^4 x(4x - x^2)\,dx = 2\pi\left(\frac{256}{3} - 64\right) = \frac{128\pi}{3}$ cm$^3$.'
          - problem: 'The region between $y = \sqrt{x}$ and $y = x^2$ is rotated about the $y$-axis. Find the volume.'
            answer: '3*pi/10'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The curves meet at $x = 0$ and $x = 1$, with $y = \sqrt{x}$ on top. So $V = 2\pi\int_0^1 x(\sqrt{x} - x^2)\,dx = 2\pi\left(\frac{2}{5} - \frac{1}{4}\right) = \frac{3\pi}{10}$.'
          - problem: 'The region between $y = kx$ and $y = x^2$, where $k > 0$, is rotated about the $y$-axis. The volume of the solid is $\frac{27\pi}{2}$. Find $k$.'
            answer: '3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The curves meet at $x = 0$ and $x = k$, with $y = kx$ on top. So $V = 2\pi\int_0^k (kx^2 - x^3)\,dx = 2\pi\left(\frac{k^4}{3} - \frac{k^4}{4}\right) = \frac{\pi k^4}{6}$. Setting $\frac{\pi k^4}{6} = \frac{27\pi}{2}$ gives $k^4 = 81$, so $k = 3$.'
          - problem: 'The region between $y = x^3$ and $y = x^4$ is rotated about the $y$-axis. What is the volume?'
            answer: 'pi/15'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The top curve minus the bottom curve is positive. On $(0, 1)$ the curve $y = x^3$ is on top, so $V = 2\pi\int_0^1 x(x^3 - x^4)\,dx = 2\pi\left(\frac{1}{5} - \frac{1}{6}\right) = \frac{\pi}{15}$.'
        constraints: 'curves intersect at x = 0 and x = 1 (or at another small integer); height = top minus bottom; includes solids in cm^3, a parameter k found from a given volume, one named-person error item'
      - id: kp2
        name: 'Shells about other vertical lines'
        key_prerequisites: [volumes-shells-y-axis]
        exemplars:
          - problem: 'The region under $y = x^2$ for $0 \le x \le 1$ is rotated about the line $x = 2$. Find the volume.'
            answer: '5*pi/6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The region lies left of the axis, so a shell has radius $2 - x$ and height $x^2$. Then $V = 2\pi\int_0^1 (2 - x)x^2\,dx = 2\pi\left(\frac{2}{3} - \frac{1}{4}\right) = \frac{5\pi}{6}$.'
          - problem: 'The region between $y = x$ and $y = x^2$ is rotated about the line $x = -1$. Find the volume.'
            answer: 'pi/2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The axis lies left of the region, so a shell has radius $x + 1$ and height $x - x^2$. Then $V = 2\pi\int_0^1 (x + 1)(x - x^2)\,dx = 2\pi\int_0^1 (x - x^3)\,dx = 2\pi\cdot\frac{1}{4} = \frac{\pi}{2}$.'
          - problem: 'A ring-shaped stamp is made by rotating the region under $y = x^2$ for $0 \le x \le 1$ about the line $x = 3$, with lengths in centimeters. What is the volume of the stamp?'
            answer: '3*pi/2'
            answer_contract: {"kind":"unit","quantity":"cubic_volume","unit":"cm^3","allow_omitted":true}
            solution_sketch: 'The region lies left of the axis, so a shell has radius $3 - x$ and height $x^2$. Then $V = 2\pi\int_0^1 (3 - x)x^2\,dx = 2\pi\left(1 - \frac{1}{4}\right) = \frac{3\pi}{2}$ cm$^3$.'
          - problem: 'The region under $y = \sqrt{x}$ for $0 \le x \le 4$ is rotated about the line $x = 5$. Find the volume.'
            answer: '416*pi/15'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The region lies left of the axis, so a shell has radius $5 - x$ and height $\sqrt{x}$. Then $V = 2\pi\int_0^4 (5x^{1/2} - x^{3/2})\,dx = 2\pi\left(\frac{80}{3} - \frac{64}{5}\right) = \frac{416\pi}{15}$.'
          - problem: 'The region between $y = x^2$ and $y = x^3$ is rotated about the line $x = -2$. Find the volume.'
            answer: '13*pi/30'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The axis lies left of the region, so a shell has radius $x + 2$ and height $x^2 - x^3$. Then $V = 2\pi\int_0^1 (2x^2 - x^3 - x^4)\,dx = 2\pi\left(\frac{2}{3} - \frac{1}{4} - \frac{1}{5}\right) = \frac{13\pi}{30}$.'
          - problem: 'A doughnut is formed by rotating the disk $(x - 3)^2 + y^2 \le 1$ about the $y$-axis. Find its volume.'
            answer: '6*pi^2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'A shell at $x$ has radius $x$ and height $2\sqrt{1 - (x-3)^2}$, so $V = 4\pi\int_2^4 x\sqrt{1 - (x-3)^2}\,dx$. With $u = x - 3$ this is $4\pi\int_{-1}^{1}(u + 3)\sqrt{1 - u^2}\,du$. The term with $u$ is odd and gives $0$, and $\int_{-1}^{1}\sqrt{1-u^2}\,du = \frac{\pi}{2}$, so $V = 4\pi\cdot 3\cdot\frac{\pi}{2} = 6\pi^2$.'
          - problem: 'The region under $y = x$ for $0 \le x \le 1$ is rotated about the line $x = c$, where $c > 1$, and the volume of the solid is $\frac{4\pi}{3}$. Find $c$.'
            answer: '2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'A shell has radius $c - x$ and height $x$, so $V = 2\pi\int_0^1 (c - x)x\,dx = 2\pi\left(\frac{c}{2} - \frac{1}{3}\right) = \pi c - \frac{2\pi}{3}$. Setting this equal to $\frac{4\pi}{3}$ gives $\pi c = 2\pi$, so $c = 2$.'
          - problem: 'The region under $y = \sqrt{x}$ for $0 \le x \le 1$ is rotated about the line $x = 2$. What is the volume?'
            answer: '28*pi/15'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The radius is measured from the axis of rotation $x = 2$. A shell has radius $2 - x$ and height $\sqrt{x}$, so $V = 2\pi\int_0^1 (2x^{1/2} - x^{3/2})\,dx = 2\pi\left(\frac{4}{3} - \frac{2}{5}\right) = \frac{28\pi}{15}$.'
        constraints: 'axis x = c with c outside the region; radius is the distance to the axis, written as (c - x) or (x - c); includes solids in cm^3, a doughnut, a line x = c found from a given volume, one named-person error item'
      - id: kp3
        name: 'Choosing shells versus washers'
        key_prerequisites: [volumes-shells-y-axis, volumes-disks-washers]
        exemplars:
          - problem: 'The region under $y = \frac{1}{1 + x^2}$ for $0 \le x \le 1$ is rotated about the $y$-axis. Find the volume.'
            answer: 'pi*ln(2)'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'A shell at $x$ has radius $x$ and height $\frac{1}{1+x^2}$, so $V = 2\pi\int_0^1 \frac{x}{1+x^2}\,dx$. An antiderivative is $\frac{1}{2}\ln(1+x^2)$, so $V = \pi\ln 2$.'
          - problem: 'The region under $y = \frac{1}{1 + x^2}$ for $0 \le x \le 1$ is rotated about the $y$-axis. Which method is easier for finding the volume, shells or washers?'
            answer: 'shells'
            answer_contract: {"kind":"label","options":[["shells","shell","cylindrical shells","the shell method","shell method"],["washers","washer","disks","disks and washers","the washer method","washer method"]]}
            solution_sketch: 'Shells slice the region in $x$ and keep the curve as $y = \frac{1}{1+x^2}$. Washers would need $x = \sqrt{\frac{1}{y} - 1}$, which is harder, so shells are easier.'
          - problem: 'A lathe turns a knob by rotating the region under $y = \sin(x^2)$ for $0 \le x \le \sqrt{\pi}$ about the $y$-axis, with lengths in centimeters. How much wood does the knob contain?'
            answer: '2*pi'
            answer_contract: {"kind":"unit","quantity":"cubic_volume","unit":"cm^3","allow_omitted":true}
            solution_sketch: 'Shells avoid inverting $\sin(x^2)$: $V = 2\pi\int_0^{\sqrt{\pi}} x\sin(x^2)\,dx$. With $u = x^2$ this becomes $\pi\int_0^{\pi}\sin u\,du = 2\pi$, so the knob contains $2\pi$ cm$^3$ of wood.'
          - problem: 'The region between $y = x$ and $y = x^2$ is rotated about the $x$-axis. Find the volume of the solid.'
            answer: '2*pi/15'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The curves meet where $x = x^2$, so the limits are $x = 0$ and $x = 1$. Washers about the $x$-axis have outer radius $x$ and inner radius $x^2$, so $V = \pi\int_0^1 (x^2 - x^4)\,dx = \pi\left(\frac{1}{3} - \frac{1}{5}\right) = \frac{2\pi}{15}$.'
          - problem: 'The region under $y = \sqrt{x}$ for $0 \le x \le 4$ is rotated about the $y$-axis. Find the volume of the solid.'
            answer: '128*pi/5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Shells have radius $x$ and height $\sqrt{x}$, so $V = 2\pi\int_0^4 x^{3/2}\,dx = 2\pi\cdot\frac{2}{5}\cdot 4^{5/2} = 2\pi\cdot\frac{64}{5} = \frac{128\pi}{5}$.'
          - problem: 'The region bounded by $y = x^3$, $y = 0$ and $x = 2$ is rotated about the $y$-axis. Find the volume of the solid.'
            answer: '64*pi/5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The curve $y = x^3$ meets $y = 0$ at $x = 0$, so $x$ runs from $0$ to $2$. Shells keep the curve as $y = x^3$, while washers would need $x = y^{1/3}$. So $V = 2\pi\int_0^2 x^4\,dx = 2\pi\cdot\frac{32}{5} = \frac{64\pi}{5}$.'
          - problem: 'A parabolic dish is modeled by rotating the region between $y = x^2$ and $y = 4$ about the $x$-axis, with lengths in centimeters. What volume of material does the dish contain?'
            answer: '256*pi/5'
            answer_contract: {"kind":"unit","quantity":"cubic_volume","unit":"cm^3","allow_omitted":true}
            solution_sketch: 'The curve $y = x^2$ meets $y = 4$ at $x = -2$ and $x = 2$. Washers about the $x$-axis have outer radius $4$ and inner radius $x^2$, so $V = \pi\int_{-2}^{2}(16 - x^4)\,dx = \pi\left(64 - \frac{64}{5}\right) = \frac{256\pi}{5}$ cm$^3$.'
          - problem: 'The region under $y = e^x$ for $0 \le x \le 1$ is rotated about the $x$-axis. Which method is easier for finding the volume, shells or washers?'
            answer: 'washers'
            answer_contract: {"kind":"label","options":[["shells","shell","cylindrical shells","the shell method","shell method"],["washers","washer","disks","disks and washers","the washer method","washer method"]]}
            solution_sketch: 'Washers (disks here) slice the region in $x$ and give $\pi\int_0^1 e^{2x}\,dx$ directly. Shells about the $x$-axis would need $x = \ln y$, which is harder, so washers are easier.'
        constraints: 'one strategic item per label; labels pair with computing items; the named method must genuinely be simpler (the other would need an inverse)'
    diagnostic_exemplar:
      problem: 'The region between $y = 2x$ and $y = x^2$ is rotated about the line $x = -1$. Find the volume.'
      answer: '$16\pi/3$'
      solution_sketch: 'Shell radius $x + 1$, height $2x - x^2$, over $0 \le x \le 2$: $V = 2\pi\int_0^2 (x+1)(2x - x^2)\,dx = \frac{16\pi}{3}$.'
    anki_seeds:
      - front: "Choose shells over washers when..."
        back: "the slice parallel to the axis of rotation is simpler — typically rotating about a vertical axis with y = f(x) hard to invert"
        type: basic
      - front: "Shell radius when rotating about the line x = c (region to the left of c)?"
        back: '$c - x$'
        type: basic

  - id: arc-length
    name: Arc Length
    core: true
    difficulty: 0.7
    drill: false
    answer_kind: numeric
    expected_time_secs: 240
    prerequisites:
      - id: definite-integrals-ftc
        weight: 0.7
        key: true
      - id: integration-substitution
        weight: 0.5
        key: true
      - id: chain-rule
        weight: 0.4
      - id: simplifying-radicals
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: The arc length integral
        key_prerequisites: [definite-integrals-ftc, chain-rule]
        try_first:
          problem: 'A straight segment runs from $(0, 0)$ to $(3, 4)$. How long is it?'
          answer_contract: {"kind": "exact"}
          answer: '5'
          reveal: 'The distance formula gives $\sqrt{9 + 16} = 5$. The arc length integral agrees: the slope is $\frac{4}{3}$, the integrand is $\sqrt{1 + \frac{16}{9}} = \frac{5}{3}$, and $\frac{5}{3} \cdot 3 = 5$.'
        exemplars:
          - problem: 'Find the length of $y = 5x - 2$ for $1 \le x \le 4$.'
            answer: '3sqrt(26)'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The slope is $y'' = 5$, so $1 + (y'')^2 = 26$ and the integrand is the constant $\sqrt{26}$. The length is $\sqrt{26}$ times the width $4 - 1 = 3$, so $L = 3\sqrt{26}$.'
          - problem: 'The length of $y = x^2$ for $0 \le x \le 1$ is $\int_0^1 g(x)\,dx$. Find $g(x)$.'
            answer: 'sqrt(1+4x^2)'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'The arc length integrand is $\sqrt{1 + (y'')^2}$. Here $y'' = 2x$, so $1 + (y'')^2 = 1 + 4x^2$ and $g(x) = \sqrt{1 + 4x^2}$.'
          - problem: 'A straight ramp is modelled by $y = \frac{3}{4}x$ for $0 \le x \le 8$, with $x$ and $y$ in metres. How long is the ramp surface?'
            answer: '10'
            answer_contract: {"kind": "unit", "quantity": "length", "unit": "m", "allow_omitted": true}
            solution_sketch: 'The slope is $\frac{3}{4}$, so $\sqrt{1 + \frac{9}{16}} = \frac{5}{4}$. The length is $\frac{5}{4}$ times the horizontal width $8$, which gives $10$ m.'
          - problem: 'Find the arc length of the horizontal line $y = 4$ from $x = 2$ to $x = 9$.'
            answer: '7'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The slope is $y'' = 0$, so the integrand is $\sqrt{1 + 0} = 1$. The length is $\int_2^9 1\,dx = 7$.'
          - problem: 'A straight path in a park follows $y = 2x + 1$ from $x = 0$ to $x = b$, with $x$ and $y$ in kilometres. The path is $9\sqrt{5}$ km long. Find $b$.'
            answer: '9'
            answer_contract: {"kind": "unit", "quantity": "length", "unit": "km", "allow_omitted": true}
            solution_sketch: 'The slope is $2$, so the integrand is $\sqrt{1 + 4} = \sqrt{5}$ and the length is $b\sqrt{5}$. Set $b\sqrt{5} = 9\sqrt{5}$ and divide by $\sqrt{5}$ to get $b = 9$ km.'
          - problem: 'What is the length of $y = 3x + 1$ for $0 \le x \le 4$?'
            answer: '4sqrt(10)'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The formula needs the square of the slope $3$. The integrand is $\sqrt{1 + 3^2} = \sqrt{10}$, so $L = 4\sqrt{10}$.'
          - problem: 'A hiking trail climbs along the line $y = -2x + 7$ from $x = 1$ to $x = 5$, with $x$ and $y$ in kilometres. How long is the trail?'
            answer: '4sqrt(5)'
            answer_contract: {"kind": "unit", "quantity": "length", "unit": "km", "allow_omitted": true}
            solution_sketch: 'The slope is $-2$, and its square is $4$, so the integrand is $\sqrt{1 + 4} = \sqrt{5}$. The width is $5 - 1 = 4$, so the trail is $4\sqrt{5}$ km long.'
          - problem: 'Find the length of the line segment $y = -\frac{1}{2}x + 3$ for $2 \le x \le 6$.'
            answer: '2sqrt(5)'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The slope is $-\frac{1}{2}$, so $1 + (y'')^2 = 1 + \frac{1}{4} = \frac{5}{4}$ and the integrand is $\frac{\sqrt{5}}{2}$. The width is $6 - 2 = 4$, so $L = 4 \cdot \frac{\sqrt{5}}{2} = 2\sqrt{5}$.'
          - problem: 'The length of $y = e^x$ for $0 \le x \le 1$ is $\int_0^1 g(x)\,dx$. Find $g(x)$.'
            answer: 'sqrt(1+e^(2x))'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'The arc length integrand is $\sqrt{1 + (y'')^2}$. Here $y'' = e^x$, so $1 + (y'')^2 = 1 + e^{2x}$ and $g(x) = \sqrt{1 + e^{2x}}$.'
        constraints: 'curves where 1 + (y'')^2 is constant (lines), setup-only integrands, and contexts that ask for a length or an endpoint'
      - id: kp2
        name: Power curves via substitution
        key_prerequisites: [integration-substitution, definite-integrals-ftc]
        exemplars:
          - problem: 'Find the length of $y = \frac{2}{3}x^{3/2}$ for $0 \le x \le 3$.'
            answer: '14/3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Here $y'' = x^{1/2}$, so $1 + (y'')^2 = 1 + x$. With $u = 1 + x$ the length is $\int_1^4 u^{1/2}\,du = \frac{2}{3}(8 - 1) = \frac{14}{3}$.'
          - problem: 'Find the length of $y = x^{3/2}$ for $0 \le x \le 5$.'
            answer: '335/27'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The derivative is $y'' = \frac{3}{2}x^{1/2}$, so $1 + (y'')^2 = 1 + \frac{9x}{4}$. Then $L = \frac{8}{27}\left[(1 + \frac{9x}{4})^{3/2}\right]_0^5 = \frac{8}{27}\left(\frac{343}{8} - 1\right) = \frac{335}{27}$.'
          - problem: 'Find the length of $y = 2x^{3/2}$ for $0 \le x \le 1$.'
            answer: '2(10sqrt(10)-1)/27'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The derivative is $y'' = 3x^{1/2}$, so $1 + (y'')^2 = 1 + 9x$. Then $L = \int_0^1 \sqrt{1 + 9x}\,dx = \frac{2}{27}\left[(1 + 9x)^{3/2}\right]_0^1 = \frac{2(10\sqrt{10} - 1)}{27}$.'
          - problem: 'A cable hangs along the curve $y = \frac{2}{3}(x + 3)^{3/2}$ for $0 \le x \le 5$, with $x$ and $y$ in metres. How long is the cable?'
            answer: '38/3'
            answer_contract: {"kind": "unit", "quantity": "length", "unit": "m", "allow_omitted": true}
            solution_sketch: 'The derivative is $y'' = (x + 3)^{1/2}$, so $1 + (y'')^2 = x + 4$. With $u = x + 4$ the length is $\int_4^9 \sqrt{u}\,du = \frac{2}{3}(27 - 8) = \frac{38}{3}$ m.'
          - problem: 'A road on a map follows $y = \frac{2}{3}x^{3/2}$ from the origin to the point with $x = b$, with $x$ and $y$ in kilometres. The road is $\frac{14}{3}$ km long. Find $b$.'
            answer: '3'
            answer_contract: {"kind": "unit", "quantity": "length", "unit": "km", "allow_omitted": true}
            solution_sketch: 'The length from $0$ to $b$ is $\frac{2}{3}\left[(1 + b)^{3/2} - 1\right]$. Set this equal to $\frac{14}{3}$ to get $(1 + b)^{3/2} = 8$, so $1 + b = 4$ and $b = 3$.'
          - problem: 'Find the length of $y = \frac{1}{3}x^{3/2}$ for $0 \le x \le 12$.'
            answer: '56/3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The derivative is $y'' = \frac{1}{2}x^{1/2}$, so $1 + (y'')^2 = 1 + \frac{x}{4}$. With $u = 1 + \frac{x}{4}$ we get $L = 4\int_1^4 u^{1/2}\,du = \frac{8}{3}(8 - 1) = \frac{56}{3}$.'
          - problem: 'What is the length of $y = \frac{2}{3}x^{3/2}$ for $0 \le x \le 3$?'
            answer: '14/3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The integrand is the square root of $1 + (y'')^2 = 1 + x$. The correct integral is $\int_0^3 \sqrt{1 + x}\,dx = \frac{2}{3}(8 - 1) = \frac{14}{3}$.'
          - problem: 'Find the length of $y = \frac{2}{3}(x + 8)^{3/2}$ for $0 \le x \le 7$.'
            answer: '74/3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The derivative is $y'' = (x + 8)^{1/2}$, so $1 + (y'')^2 = x + 9$. With $u = x + 9$ the length is $\int_9^{16} \sqrt{u}\,du = \frac{2}{3}(64 - 27) = \frac{74}{3}$.'
        constraints: 'curves where 1 + (y'')^2 is linear in x; the substitution is one step'
      - id: kp3
        name: Perfect-square integrands
        key_prerequisites: [simplifying-radicals, definite-integrals-ftc]
        exemplars:
          - problem: 'Find the length of $y = \frac{x^3}{3} + \frac{1}{4x}$ for $1 \le x \le 2$.'
            answer: '59/24'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The derivative is $y'' = x^2 - \frac{1}{4x^2}$, so $1 + (y'')^2 = \left(x^2 + \frac{1}{4x^2}\right)^2$. Then $L = \left[\frac{x^3}{3} - \frac{1}{4x}\right]_1^2 = \frac{59}{24}$.'
          - problem: 'Find the length of $y = \frac{e^x + e^{-x}}{2}$ for $0 \le x \le \ln 2$.'
            answer: '3/4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The derivative is $y'' = \frac{e^x - e^{-x}}{2}$, and $1 + (y'')^2 = \left(\frac{e^x + e^{-x}}{2}\right)^2$. Then $L = \left[\frac{e^x - e^{-x}}{2}\right]_0^{\ln 2} = \frac{2 - \frac{1}{2}}{2} = \frac{3}{4}$.'
          - problem: 'Find the length of $y = \frac{x^3}{12} + \frac{1}{x}$ for $1 \le x \le 2$.'
            answer: '13/12'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The derivative is $y'' = \frac{x^2}{4} - \frac{1}{x^2}$, so $1 + (y'')^2 = \left(\frac{x^2}{4} + \frac{1}{x^2}\right)^2$. Then $L = \left[\frac{x^3}{12} - \frac{1}{x}\right]_1^2 = \frac{13}{12}$.'
          - problem: 'A chain hangs in the shape $y = \frac{e^x + e^{-x}}{2}$ for $-1 \le x \le 1$, with $x$ and $y$ in metres. Find the length of the chain.'
            answer: 'e - e^(-1)'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Here $1 + (y'')^2 = \left(\frac{e^x + e^{-x}}{2}\right)^2$, so the length is $\int_{-1}^{1} \frac{e^x + e^{-x}}{2}\,dx = \left[\frac{e^x - e^{-x}}{2}\right]_{-1}^{1}$. This equals $e - e^{-1}$ metres.'
          - problem: 'Find the length of $y = \frac{x^4}{4} + \frac{1}{8x^2}$ for $1 \le x \le 2$.'
            answer: '123/32'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The derivative is $y'' = x^3 - \frac{1}{4x^3}$, so $1 + (y'')^2 = \left(x^3 + \frac{1}{4x^3}\right)^2$. Then $L = \left[\frac{x^4}{4} - \frac{1}{8x^2}\right]_1^2 = \frac{123}{32}$.'
          - problem: 'A roof edge follows $y = \frac{2x^3}{3} + \frac{1}{8x}$ for $1 \le x \le 3$, with $x$ and $y$ in metres. How long is the edge?'
            answer: '209/12'
            answer_contract: {"kind": "unit", "quantity": "length", "unit": "m", "allow_omitted": true}
            solution_sketch: 'The derivative is $y'' = 2x^2 - \frac{1}{8x^2}$, so $1 + (y'')^2 = \left(2x^2 + \frac{1}{8x^2}\right)^2$. Then $L = \left[\frac{2x^3}{3} - \frac{1}{8x}\right]_1^3 = \frac{209}{12}$ m.'
          - problem: 'Find the length of $y = \frac{x^2}{4} - \frac{\ln x}{2}$ for $1 \le x \le e$.'
            answer: '(e^2+1)/4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The derivative is $y'' = \frac{x}{2} - \frac{1}{2x}$, so $1 + (y'')^2 = \left(\frac{x}{2} + \frac{1}{2x}\right)^2$. Then $L = \left[\frac{x^2}{4} + \frac{\ln x}{2}\right]_1^e = \frac{e^2 - 1}{4} + \frac{1}{2} = \frac{e^2 + 1}{4}$.'
        constraints: 'engineered curves of the form ax^n + b x^{-n}, (e^x + e^{-x})/2 or x^2/4 - ln(x)/2 where 1 + (y'')^2 is a perfect square'
    diagnostic_exemplar:
      problem: 'Find the length of $y = \frac{x^3}{6} + \frac{1}{2x}$ for $1 \le x \le 2$.'
      answer: '$17/12$'
      solution_sketch: '$1 + \left(\frac{dy}{dx}\right)^2 = \left(\frac{x^2}{2} + \frac{1}{2x^2}\right)^2$ is a perfect square, so the length is $\left[\frac{x^3}{6} - \frac{1}{2x}\right]_1^2 = \frac{17}{12}$.'
    anki_seeds:
      - front: "Arc length formula for y = f(x) on [a, b]?"
        back: '$L = \int_a^b \sqrt{1 + f''(x)^2} \, dx$'
        type: basic
      - front: "Textbook arc length curves like x^3/3 + 1/(4x) are engineered so that..."
        back: '$1 + (y'')^2$ is a perfect square, letting the square root vanish'
        type: basic

  - id: surface-area-revolution
    name: Surface Area of Revolution
    core: false                # application of the definite integral
    difficulty: 0.72
    drill: false
    answer_kind: expression
    expected_time_secs: 240
    prerequisites:
      - id: arc-length
        weight: 0.7
        key: true
      - id: integration-substitution
        weight: 0.5
        key: true
      - id: circle-area-circumference
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: The surface area integral and cone checks
        key_prerequisites: [arc-length, circle-area-circumference]
        exemplars:
          - problem: 'The segment $y = 2x$, $0 \le x \le 1$, is rotated about the $x$-axis. Find the surface area.'
            answer: '2pi sqrt(5)'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The slope is $2$, so $\sqrt{1 + 4} = \sqrt{5}$. Then $S = 2\pi\int_0^1 2x\sqrt{5}\,dx = 2\pi\sqrt{5}$, which equals the cone area $\pi r \ell$ with $r = 2$ and $\ell = \sqrt{5}$.'
          - problem: 'The segment $y = x$, $0 \le x \le 1$, is rotated about the $x$-axis. Find the surface area.'
            answer: 'pi sqrt(2)'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The slope is $1$, so $\sqrt{1 + 1} = \sqrt{2}$. Then $S = 2\pi\sqrt{2}\int_0^1 x\,dx = 2\pi\sqrt{2} \cdot \frac{1}{2} = \pi\sqrt{2}$.'
          - problem: 'The segment $y = 3x$, $0 \le x \le 2$, is rotated about the $x$-axis. Find the surface area.'
            answer: '12pi sqrt(10)'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The slope is $3$, so $\sqrt{1 + 9} = \sqrt{10}$. Then $S = 2\pi\sqrt{10}\int_0^2 3x\,dx = 2\pi\sqrt{10} \cdot 6 = 12\pi\sqrt{10}$. The cone with $r = 6$ and $\ell = 2\sqrt{10}$ gives $\pi r \ell = 12\pi\sqrt{10}$ too.'
          - problem: 'A lampshade is formed by rotating the segment $y = \frac{x}{2}$, $0 \le x \le 6$, about the $x$-axis, with lengths in centimetres. Find the area of the lampshade.'
            answer: '9pi sqrt(5)'
            answer_contract: {"kind": "unit", "quantity": "area", "unit": "cm^2", "allow_omitted": true}
            solution_sketch: 'The slope is $\frac{1}{2}$, so $\sqrt{1 + \frac{1}{4}} = \frac{\sqrt{5}}{2}$. Then $S = 2\pi \cdot \frac{\sqrt{5}}{2}\int_0^6 \frac{x}{2}\,dx = \pi\sqrt{5} \cdot 9 = 9\pi\sqrt{5}$ square centimetres.'
          - problem: 'The segment $y = x$, $0 \le y \le 3$, is rotated about the $y$-axis. Find the surface area.'
            answer: '9pi sqrt(2)'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The radius of each ring is $x = y$, and the arc length element is $\sqrt{2}\,dy$. Then $S = 2\pi\sqrt{2}\int_0^3 y\,dy = 2\pi\sqrt{2} \cdot \frac{9}{2} = 9\pi\sqrt{2}$.'
          - problem: 'The segment $y = 2x$, $0 \le x \le a$, is rotated about the $x$-axis. The surface has area $4\pi\sqrt{5}$. Find $a$.'
            answer: 'sqrt(2)'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The area is $2\pi\sqrt{5}\int_0^a 2x\,dx = 2\pi a^2\sqrt{5}$. Set $2\pi a^2\sqrt{5} = 4\pi\sqrt{5}$ and divide by $2\pi\sqrt{5}$ to get $a^2 = 2$, so $a = \sqrt{2}$.'
          - problem: 'A party hat is made by rotating the segment $y = \frac{5}{12}x$, $0 \le x \le 12$, about the $x$-axis, with lengths in centimetres. Find the area of paper in the hat.'
            answer: '65pi'
            answer_contract: {"kind": "unit", "quantity": "area", "unit": "cm^2", "allow_omitted": true}
            solution_sketch: 'The slope is $\frac{5}{12}$, so $\sqrt{1 + \frac{25}{144}} = \frac{13}{12}$. Then $S = 2\pi \cdot \frac{13}{12}\int_0^{12} \frac{5x}{12}\,dx = 2\pi \cdot \frac{13}{12} \cdot \frac{5 \cdot 144}{24} = 65\pi$. The cone check $\pi \cdot 5 \cdot 13 = 65\pi$ agrees.'
          - problem: 'The curve $y = 2x$, $0 \le x \le 3$, is rotated about the $x$-axis. What is the surface area?'
            answer: '18pi sqrt(5)'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The integrand needs the factor $\sqrt{1 + (y'')^2} = \sqrt{5}$. The integral is $2\pi\sqrt{5}\int_0^3 2x\,dx = 2\pi\sqrt{5} \cdot 9 = 18\pi\sqrt{5}$.'
        constraints: 'line segments through the origin about either axis; verify against pi r l'
      - id: kp2
        name: Surfaces requiring substitution
        key_prerequisites: [arc-length, integration-substitution]
        exemplars:
          - problem: 'The curve $y = x^3$, $0 \le x \le 1$, is rotated about the $x$-axis. Find the surface area.'
            answer: 'pi(10sqrt(10)-1)/27'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Here $S = 2\pi\int_0^1 x^3\sqrt{1 + 9x^4}\,dx$. With $u = 1 + 9x^4$ and $du = 36x^3\,dx$, this is $\frac{2\pi}{36} \cdot \frac{2}{3}\left[u^{3/2}\right]_1^{10} = \frac{\pi(10\sqrt{10} - 1)}{27}$.'
          - problem: 'The curve $y = \sqrt{x}$, $0 \le x \le 1$, is rotated about the $x$-axis. Find the surface area.'
            answer: 'pi(5sqrt(5)-1)/6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Here $y'' = \frac{1}{2\sqrt{x}}$, so $\sqrt{x}\sqrt{1 + \frac{1}{4x}} = \sqrt{x + \frac{1}{4}}$. Then $S = 2\pi\int_0^1 \sqrt{x + \frac{1}{4}}\,dx = \frac{4\pi}{3}\left[\left(x + \frac{1}{4}\right)^{3/2}\right]_0^1 = \frac{\pi(5\sqrt{5} - 1)}{6}$.'
          - problem: 'A spinning top is modelled by rotating $y = \frac{1}{3}x^3$, $0 \le x \le 1$, about the $x$-axis, with lengths in centimetres. Find the area of its surface.'
            answer: 'pi(2sqrt(2)-1)/9'
            answer_contract: {"kind": "unit", "quantity": "area", "unit": "cm^2", "allow_omitted": true}
            solution_sketch: 'Here $S = 2\pi\int_0^1 \frac{x^3}{3}\sqrt{1 + x^4}\,dx$. With $u = 1 + x^4$ and $x^3\,dx = \frac{du}{4}$, this is $\frac{2\pi}{3} \cdot \frac{1}{4} \cdot \frac{2}{3}\left[u^{3/2}\right]_1^2 = \frac{\pi(2\sqrt{2} - 1)}{9}$.'
          - problem: 'The curve $y = x^2$, $0 \le x \le 2$, is rotated about the $y$-axis. Find the surface area.'
            answer: 'pi(17sqrt(17)-1)/6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The radius of each ring is $x$, so $S = 2\pi\int_0^2 x\sqrt{1 + 4x^2}\,dx$. With $u = 1 + 4x^2$ and $x\,dx = \frac{du}{8}$, this is $\frac{2\pi}{8} \cdot \frac{2}{3}\left[u^{3/2}\right]_1^{17} = \frac{\pi(17\sqrt{17} - 1)}{6}$.'
          - problem: 'A reflector dish is made by rotating $y = \sqrt{x}$, $0 \le x \le 2$, about the $x$-axis, with lengths in metres. Find the area of the dish.'
            answer: '13pi/3'
            answer_contract: {"kind": "unit", "quantity": "area", "unit": "m^2", "allow_omitted": true}
            solution_sketch: 'As before $\sqrt{x}\sqrt{1 + \frac{1}{4x}} = \sqrt{x + \frac{1}{4}}$, so $S = 2\pi\int_0^2 \sqrt{x + \frac{1}{4}}\,dx = \frac{4\pi}{3}\left[\left(\frac{9}{4}\right)^{3/2} - \left(\frac{1}{4}\right)^{3/2}\right]$. This equals $\frac{4\pi}{3} \cdot \frac{26}{8} = \frac{13\pi}{3}$.'
          - problem: 'The curve $y = \sqrt{x + 1}$, $0 \le x \le 3$, is rotated about the $x$-axis. Find the surface area.'
            answer: 'pi(17sqrt(17)-5sqrt(5))/6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The radical simplifies to $\sqrt{x + 1}\sqrt{1 + \frac{1}{4(x + 1)}} = \frac{\sqrt{4x + 5}}{2}$, so $S = \pi\int_0^3 \sqrt{4x + 5}\,dx$. With $u = 4x + 5$ this is $\frac{\pi}{4} \cdot \frac{2}{3}\left[u^{3/2}\right]_5^{17} = \frac{\pi(17\sqrt{17} - 5\sqrt{5})}{6}$.'
          - problem: 'A nozzle is modelled by rotating $y = 2\sqrt{x}$, $0 \le x \le 3$, about the $x$-axis, with lengths in centimetres. Find the area of its surface.'
            answer: '56pi/3'
            answer_contract: {"kind": "unit", "quantity": "area", "unit": "cm^2", "allow_omitted": true}
            solution_sketch: 'Here $y'' = \frac{1}{\sqrt{x}}$, so $y\sqrt{1 + (y'')^2} = 2\sqrt{x}\sqrt{\frac{x + 1}{x}} = 2\sqrt{x + 1}$. Then $S = 4\pi\int_0^3 \sqrt{x + 1}\,dx = 4\pi \cdot \frac{2}{3}(8 - 1) = \frac{56\pi}{3}$.'
        constraints: 'the radical must fall to a one-step u-substitution; answers exact with radicals'
      - id: kp3
        name: Sphere zones
        key_prerequisites: [arc-length, circle-area-circumference]
        exemplars:
          - problem: 'The semicircle $y = \sqrt{4 - x^2}$, $-2 \le x \le 2$, is rotated about the $x$-axis to form a sphere. Find its surface area.'
            answer: '16pi'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Here $y\sqrt{1 + (y'')^2} = \sqrt{4 - x^2} \cdot \frac{2}{\sqrt{4 - x^2}} = 2$, a constant. Then $S = 2\pi\int_{-2}^{2} 2\,dx = 2\pi \cdot 2 \cdot 4 = 16\pi$, which equals $4\pi r^2$ for $r = 2$.'
          - problem: 'The curve $y = \sqrt{4 - x^2}$ is rotated about the $x$-axis. Find the area of the part of the sphere between $x = 0$ and $x = 1$.'
            answer: '4pi'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The integrand $y\sqrt{1 + (y'')^2}$ is the constant $2$. So $S = 2\pi\int_0^1 2\,dx = 4\pi$, since the area depends only on the width $1$ of the slab.'
          - problem: 'The semicircle $y = \sqrt{9 - x^2}$, $-3 \le x \le 3$, is rotated about the $x$-axis. Find the surface area of the resulting sphere.'
            answer: '36pi'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Here $y\sqrt{1 + (y'')^2} = \sqrt{9 - x^2} \cdot \frac{3}{\sqrt{9 - x^2}} = 3$. Then $S = 2\pi\int_{-3}^{3} 3\,dx = 2\pi \cdot 3 \cdot 6 = 36\pi$.'
          - problem: 'A sphere of radius $3$ is formed by rotating $y = \sqrt{9 - x^2}$ about the $x$-axis. Find the surface area of the zone between $x = -1$ and $x = 2$.'
            answer: '18pi'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The integrand $y\sqrt{1 + (y'')^2}$ is the constant $3$. The zone has width $2 - (-1) = 3$, so $S = 2\pi \cdot 3 \cdot 3 = 18\pi$.'
          - problem: 'A beach ball has radius $20$ cm. A band around it is cut off by two parallel planes $6$ cm apart. Find the area of the band.'
            answer: '240pi'
            answer_contract: {"kind": "unit", "quantity": "area", "unit": "cm^2", "allow_omitted": true}
            solution_sketch: 'For a sphere of radius $R$ the integrand is the constant $R$, so a band of width $h$ has area $2\pi R h$. With $R = 20$ and $h = 6$ the area is $2\pi \cdot 20 \cdot 6 = 240\pi$.'
          - problem: 'A band of the sphere $y = \sqrt{16 - x^2}$, rotated about the $x$-axis, lies between two parallel planes $x = a$ and $x = a + h$. The band has area $24\pi$. Find the distance $h$ between the planes.'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The integrand is the constant $4$, so the band has area $2\pi \cdot 4 \cdot h = 8\pi h$. Set $8\pi h = 24\pi$ and divide by $8\pi$ to get $h = 3$.'
          - problem: 'The sphere $y = \sqrt{9 - x^2}$, rotated about the $x$-axis, has surface area $36\pi$. What is the area of the band from $x = 0$ to $x = 2$?'
            answer: '12pi'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The area of the whole sphere does not apply. The band has width $2$ and the integrand is the constant $3$, so $S = 2\pi \cdot 3 \cdot 2 = 12\pi$.'
        constraints: 'spheres of radius 2, 3, 4 or a physical radius; highlight that the integrand becomes constant (Archimedes'' hat-box)'
    diagnostic_exemplar:
      problem: 'The curve $y = \sqrt{x}$, $0 \le x \le 3$, is rotated about the $x$-axis. Find the surface area.'
      answer: '$\pi(13\sqrt{13} - 1)/6$'
      solution_sketch: '$S = 2\pi\int_0^3 \sqrt x\sqrt{1 + \frac{1}{4x}}\,dx = 2\pi\int_0^3 \sqrt{x + \tfrac14}\,dx = \frac{4\pi}{3}\left[\left(\tfrac{13}{4}\right)^{3/2} - \left(\tfrac14\right)^{3/2}\right]$.'
    anki_seeds:
      - front: "Surface area formula for y = f(x) >= 0 rotated about the x-axis?"
        back: '$S = 2\pi \int_a^b f(x)\sqrt{1 + f''(x)^2} \, dx$'
        type: basic
      - front: "Sphere zone fact (Archimedes): the area of a zone depends only on..."
        back: "the sphere's radius and the width of the slab — $S = 2\\pi R h$"
        type: basic

  - id: work-springs
    name: Work and Springs
    core: false                # physical application branch
    difficulty: 0.58
    drill: false
    answer_kind: numeric
    expected_time_secs: 150
    prerequisites:
      - id: definite-integrals-ftc
        weight: 0.7
        key: true
      - id: antiderivatives
        weight: 0.4
      - id: evaluating-formulas
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: Work done by a variable force
        key_prerequisites: [definite-integrals-ftc]
        exemplars:
          - problem: 'A force $F(x) = 4x^3$ newtons acts along the $x$-axis. Find the work done in moving an object from $x = 1$ m to $x = 3$ m.'
            answer: '80'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The work is $W = \int_1^3 4x^3\,dx$. An antiderivative is $x^4$, so $W = 3^4 - 1^4 = 81 - 1 = 80$ joules.'
          - problem: 'A constant force of $7$ N pushes a cart along the $x$-axis from $x = 0$ m to $x = 6$ m. Find the work done.'
            answer: '42'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'For a constant force the work integral is $W = \int_0^6 7\,dx = 7 \cdot 6 = 42$. This matches $W = Fd$, so the work is $42$ joules.'
          - problem: 'A force $F(x) = 6x^2 + 2x$ newtons acts along the $x$-axis. Find the work done in moving an object from $x = 0$ m to $x = 4$ m.'
            answer: '144'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The work is $W = \int_0^4 (6x^2 + 2x)\,dx$. An antiderivative is $2x^3 + x^2$, so $W = 2(64) + 16 = 144$ joules.'
          - problem: 'The force of a magnet on a steel ball is $F(x) = \frac{12}{x^2}$ newtons when the ball is $x$ metres from the magnet. Find the work done in moving the ball from $x = 1$ m to $x = 4$ m.'
            answer: '9'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The work is $W = \int_1^4 12x^{-2}\,dx = \left[-12x^{-1}\right]_1^4$. This is $-3 + 12 = 9$ joules.'
          - problem: 'A force $F(x) = 8x$ newtons acts along the $x$-axis. The work done in moving an object from $x = 0$ m to $x = b$ m is $36$ J. Find the positive distance $b$.'
            answer: '3'
            answer_contract: {"kind": "unit", "quantity": "length", "unit": "m", "allow_omitted": true}
            solution_sketch: 'The work is $\int_0^b 8x\,dx = 4b^2$. Set $4b^2 = 36$, so $b^2 = 9$ and $b = 3$ m.'
          - problem: 'A force $F(x) = x^2 + 1$ newtons pushes a cart along a track. Find the work done in moving the cart from $x = 0$ m to $x = 3$ m.'
            answer: '12'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The work is $W = \int_0^3 (x^2 + 1)\,dx$. An antiderivative is $\frac{x^3}{3} + x$, so $W = 9 + 3 = 12$ joules.'
          - problem: 'A sled starts $2$ m from a wall and is pushed away from it by the force $F(x) = 3x^2$ newtons, where $x$ is the distance from the wall in metres. The work done is $117$ J. How far from the wall is the sled when the push stops?'
            answer: '5'
            answer_contract: {"kind": "unit", "quantity": "length", "unit": "m", "allow_omitted": true}
            solution_sketch: 'The work from $x = 2$ to $x = b$ is $\int_2^b 3x^2\,dx = b^3 - 8$. Set $b^3 - 8 = 117$, so $b^3 = 125$ and $b = 5$ m.'
          - problem: 'What is the work done by $F(x) = 6x$ newtons from $x = 1$ m to $x = 4$ m?'
            answer: '45'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The force grows with $x$, so it is not the largest force the whole way. The work is $\int_1^4 6x\,dx = 3(16 - 1) = 45$ joules.'
        constraints: 'force given explicitly as a function of x; SI units; constant-force and reverse (find the endpoint) items'
      - id: kp2
        name: Hooke's law and spring work
        key_prerequisites: [definite-integrals-ftc, evaluating-formulas]
        try_first:
          problem: 'A force of $20$ N stretches a spring $0.1$ m beyond its natural length. What force stretches the same spring $0.3$ m beyond its natural length?'
          answer_contract: {"kind": "exact"}
          answer: '60'
          reveal: 'The force grows in proportion to the stretch: $0.3$ m is three times $0.1$ m, so the force is $3 \cdot 20 = 60$ N. This steady growth is why the work needs an integral.'
        exemplars:
          - problem: 'A force of $16$ N stretches a spring $0.4$ m beyond its natural length. Find the work needed to stretch the spring from its natural length to $0.5$ m beyond it.'
            answer: '5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Hooke''s law gives $k = \frac{16}{0.4} = 40$ N/m, so $F(x) = 40x$. Then $W = \int_0^{0.5} 40x\,dx = 20(0.25) = 5$ joules.'
          - problem: 'A spring has constant $k = 160$ N/m. Find the work needed to stretch it $0.5$ m from its natural length.'
            answer: '20'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Hooke''s law gives $F(x) = 160x$. Then $W = \int_0^{0.5} 160x\,dx = 80(0.25) = 20$ joules.'
          - problem: 'A spring with constant $k = 250$ N/m is already stretched $0.2$ m beyond its natural length. Find the work done in stretching it further, to $0.4$ m beyond its natural length.'
            answer: '15'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Hooke''s law gives $F(x) = 250x$. Then $W = \int_{0.2}^{0.4} 250x\,dx = 125(0.16 - 0.04) = 15$ joules.'
          - problem: 'A force of $40$ N stretches a spring $0.2$ m beyond its natural length. Find the work needed to stretch it from $0.1$ m to $0.3$ m beyond its natural length.'
            answer: '8'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Hooke''s law gives $k = \frac{40}{0.2} = 200$ N/m, so $F(x) = 200x$. Then $W = \int_{0.1}^{0.3} 200x\,dx = 100(0.09 - 0.01) = 8$ joules.'
          - problem: 'A spring has constant $k = 80$ N/m. It is stretched from its natural length until $10$ J of work has been done. How far is it stretched?'
            answer: '0.5'
            answer_contract: {"kind": "unit", "quantity": "length", "unit": "m", "allow_omitted": true}
            solution_sketch: 'The work to stretch it a distance $d$ is $\int_0^d 80x\,dx = 40d^2$. Set $40d^2 = 10$, so $d^2 = \frac{1}{4}$ and $d = 0.5$ m.'
          - problem: 'A spring has natural length $20$ cm. A force of $30$ N holds it stretched to a length of $25$ cm. Find the work in joules needed to stretch it from a length of $25$ cm to a length of $30$ cm.'
            answer: '2.25'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The stretch is measured from natural length: $0.05$ m gives $k = \frac{30}{0.05} = 600$ N/m. The work is $\int_{0.05}^{0.10} 600x\,dx = 300(0.01 - 0.0025) = 2.25$ joules.'
          - problem: 'Stretching a spring $0.2$ m from its natural length takes $6$ J of work. Find the spring constant $k$ in newtons per metre.'
            answer: '300'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The work is $\int_0^{0.2} kx\,dx = \frac{k}{2}(0.04) = 0.02k$. Set $0.02k = 6$, so $k = 300$ N/m.'
          - problem: 'A force of $20$ N stretches a spring $0.5$ m. What is the work, in joules, to stretch it $0.5$ m from natural length?'
            answer: '5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The force is not $20$ N the whole way, because it grows from $0$ to $20$ N. With $k = 40$ N/m the work is $\int_0^{0.5} 40x\,dx = 20(0.25) = 5$ joules.'
        constraints: 'SI units; k determined from one force-displacement pair, or the unknown is the stretch or k'
    diagnostic_exemplar:
      problem: 'A force of $15$ N stretches a spring $0.3$ m beyond its natural length. How much work is done stretching it from $0.2$ m to $0.5$ m beyond natural length?'
      answer: '$5.25$ J'
      answer_contract: {kind: none}
      solution_sketch: 'Hooke gives $k = 15/0.3 = 50$ N/m; then $W = \int_{0.2}^{0.5} 50x\,dx = 25(0.25 - 0.04)$.'
    anki_seeds:
      - front: "Work done by a variable force F(x) moving from a to b?"
        back: '$W = \int_a^b F(x) \, dx$'
        type: basic
      - front: "Hooke's law?"
        back: '$F = kx$ — the restoring force is proportional to the displacement from natural length'
        type: basic

  - id: average-value-work
    name: Average Value and Work
    core: false                # physical application; feeds only fluid force
    difficulty: 0.65
    drill: false
    answer_kind: numeric
    expected_time_secs: 240
    prerequisites:
      - id: work-springs
        weight: 0.7
        key: true
      - id: average-value-function
        weight: 0.5
        key: true
      - id: definite-integrals-ftc
        weight: 0.5
      - id: volume-prisms-cylinders
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: Average value and the MVT for integrals
        key_prerequisites: [average-value-function, definite-integrals-ftc]
        exemplars:
          - problem: 'Find the average value of $f(x) = \sin x$ on $[0, \pi]$.'
            answer: '2/pi'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The average value is the integral divided by the length of the interval. Here $\int_0^{\pi}\sin x\,dx = 2$ and the length is $\pi$, so the average value is $2/\pi$.'
          - problem: 'For $f(x) = x^2$ on $[0, 3]$, find the value $c$ in $[0, 3]$ that the Mean Value Theorem for integrals guarantees.'
            answer: 'sqrt(3)'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The average value is $\frac{1}{3}\int_0^3 x^2\,dx = \frac{9}{3} = 3$. The theorem gives a point where $f(c) = 3$, so $c^2 = 3$ and $c = \sqrt{3}$, which lies in $[0, 3]$.'
          - problem: 'The speed of a cyclist $t$ seconds after the start is $v(t) = 6t - t^2$ m/s for $0 \le t \le 6$. What is the average speed of the cyclist over these $6$ seconds?'
            answer: '6'
            answer_contract: {"kind": "unit", "quantity": "speed", "unit": "m/s", "allow_omitted": true}
            solution_sketch: 'The average speed is the integral of the speed divided by the time taken. The integral is $\int_0^6 (6t - t^2)\,dt = 108 - 72 = 36$ metres, and $36 \div 6 = 6$ m/s.'
          - problem: 'Find the average value of $f(x) = \dfrac{1}{x}$ on $[1, e]$.'
            answer: '1/(e-1)'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The integral is $\int_1^e \frac{dx}{x} = \ln e - \ln 1 = 1$. The interval has length $e - 1$, so the average value is $\frac{1}{e-1}$.'
          - problem: 'Find the average value of $f(x) = \cos x$ on $[0, \pi]$.'
            answer: '0'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The integral is $\int_0^{\pi}\cos x\,dx = \sin\pi - \sin 0 = 0$. Dividing $0$ by the length $\pi$ still gives $0$, because the positive and negative parts of the cosine cancel.'
          - problem: 'The depth of water in a harbor $t$ hours after midnight is $d(t) = 5 + 2\sin\dfrac{\pi t}{6}$ meters for $0 \le t \le 6$. Find the average depth over these six hours.'
            answer: '5+4/pi'
            answer_contract: {"kind": "unit", "quantity": "length", "unit": "m", "allow_omitted": true}
            solution_sketch: 'The integral of $5$ over $[0, 6]$ is $30$. The integral of $2\sin\frac{\pi t}{6}$ is $\frac{24}{\pi}$, so the total is $30 + \frac{24}{\pi}$. Dividing by $6$ gives $5 + \frac{4}{\pi}$ meters.'
          - problem: 'For $f(x) = \dfrac{1}{x}$ on $[1, e]$, find the value $c$ guaranteed by the Mean Value Theorem for integrals.'
            answer: 'e-1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The average value is $\frac{1}{e-1}$. Setting $f(c) = \frac{1}{c} = \frac{1}{e-1}$ gives $c = e - 1$, which is about $1.72$ and lies in $[1, e]$.'
          - problem: 'For $f(x) = x^2$ on $[1, 4]$, find the value $c$ guaranteed by the Mean Value Theorem for integrals.'
            answer: 'sqrt(7)'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The integral is $\frac{64}{3} - \frac{1}{3} = 21$, so the average value is $21 \div 3 = 7$. Then $c^2 = 7$ gives $c = \sqrt{7}$, which lies in $[1, 4]$.'
          - problem: 'The average value of $f(x) = 3x^2$ on the interval $[0, b]$, where $b > 0$, is $16$. Find $b$.'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The average value is $\frac{1}{b}\int_0^b 3x^2\,dx = \frac{b^3}{b} = b^2$. Setting $b^2 = 16$ with $b > 0$ gives $b = 4$.'
          - problem: 'What is the average value of $f(x) = x^2$ on $[1, 4]$?'
            answer: '7'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The integral $\int_1^4 x^2\,dx = 21$ must be divided by the length of the interval. The interval $[1, 4]$ has length $3$, so the average value is $21 \div 3 = 7$.'
          - problem: 'Water flows into a tank at the rate $r(t) = 12t - 3t^2$ liters per minute for $0 \le t \le 4$ minutes. Find the average rate of flow over these $4$ minutes.'
            answer: '8'
            answer_contract: {"kind": "unit", "quantity": "flow", "unit": "L/min", "allow_omitted": true}
            solution_sketch: 'The total volume is $\int_0^4 (12t - 3t^2)\,dt = 96 - 64 = 32$ liters. Dividing by the $4$ minutes gives an average rate of $8$ liters per minute.'
        constraints: "f is sin/cos, 1/x, or a polynomial; interval endpoints small integers, e, or multiples of pi; averages of speeds, depths, or flow rates over a stated interval"
      - id: kp2
        name: Work lifting cables and chains
        key_prerequisites: [work-springs, definite-integrals-ftc]
        exemplars:
          - problem: 'A $12$ m cable of uniform linear density $2.5$ kg/m hangs from a winch. How much work does it take to wind in the whole cable? Use $g = 9.8$ m/s$^2$.'
            answer: '1764'
            answer_contract: {"kind": "unit", "quantity": "energy", "unit": "joule", "allow_omitted": true}
            solution_sketch: 'A slice of cable at distance $x$ below the winch has weight $2.5(9.8)\,dx = 24.5\,dx$ N and is lifted a distance $x$. So $W = \int_0^{12} 24.5x\,dx = 24.5 \cdot \frac{144}{2} = 1764$ J.'
          - problem: 'A $15$ m chain of uniform linear density $4$ kg/m hangs from a crane. How much work does it take to lift the whole chain up to the crane? Use $g = 9.8$ m/s$^2$.'
            answer: '4410'
            answer_contract: {"kind": "unit", "quantity": "energy", "unit": "joule", "allow_omitted": true}
            solution_sketch: 'A slice at distance $x$ below the crane weighs $4(9.8)\,dx = 39.2\,dx$ N and rises $x$. So $W = \int_0^{15} 39.2x\,dx = 39.2 \cdot \frac{225}{2} = 4410$ J.'
          - problem: 'A $10$ m uniform chain hangs from a crane. The work to lift the whole chain up to the crane is $2450$ J. What is the linear density of the chain, in kg/m? Use $g = 9.8$ m/s$^2$.'
            answer: '5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'For density $\rho$ the work is $\int_0^{10} \rho(9.8)x\,dx = \rho(9.8)(50) = 490\rho$. Setting $490\rho = 2450$ and dividing by $490$ gives $\rho = 5$ kg/m.'
          - problem: 'A $6$ m chain of uniform linear density $5$ kg/m lies stretched out on the ground. A crane lifts one end straight up until the chain hangs vertically with its lower end just off the ground. How much work is done? Use $g = 9.8$ m/s$^2$.'
            answer: '882'
            answer_contract: {"kind": "unit", "quantity": "energy", "unit": "joule", "allow_omitted": true}
            solution_sketch: 'A slice that ends at height $x$ above the ground starts on the ground, so it is raised $x$, and it weighs $5(9.8)\,dx = 49\,dx$ N. So $W = \int_0^6 49x\,dx = 49 \cdot 18 = 882$ J.'
          - problem: 'A $12$ m cable of uniform linear density $5$ kg/m hangs from a winch. How much work does the winch do while it winds in the first $4$ m of cable? Use $g = 9.8$ m/s$^2$.'
            answer: '1960'
            answer_contract: {"kind": "unit", "quantity": "energy", "unit": "joule", "allow_omitted": true}
            solution_sketch: 'The $4$ m that is wound in needs $\int_0^4 49x\,dx = 392$ J. The remaining $8$ m of cable weighs $5(9.8)(8) = 392$ N and is raised $4$ m, which needs $1568$ J. The total is $392 + 1568 = 1960$ J.'
          - problem: 'A uniform chain of linear density $5$ kg/m lies stretched out on the ground. A crane lifts one end straight up until the chain hangs vertically with its lower end just off the ground. The crane does $1568$ J of work. How long is the chain? Use $g = 9.8$ m/s$^2$.'
            answer: '8'
            answer_contract: {"kind": "unit", "quantity": "length", "unit": "m", "allow_omitted": true}
            solution_sketch: 'For a chain of length $L$, a slice that ends at height $x$ above the ground is raised $x$ and weighs $49\,dx$ N, so the work is $\int_0^L 49x\,dx = 24.5L^2$. Setting $24.5L^2 = 1568$ gives $L^2 = 64$, so $L = 8$ m.'
          - problem: 'A $20$ m rope of uniform linear density $0.5$ kg/m hangs over the side of a building. How much work does it take to haul the whole rope up to the top? Use $g = 9.8$ m/s$^2$.'
            answer: '980'
            answer_contract: {"kind": "unit", "quantity": "energy", "unit": "joule", "allow_omitted": true}
            solution_sketch: 'A slice at distance $x$ below the top weighs $0.5(9.8)\,dx = 4.9\,dx$ N and rises $x$. So $W = \int_0^{20} 4.9x\,dx = 4.9 \cdot 200 = 980$ J.'
          - problem: 'A $5$ kg bucket hangs from the end of a $12$ m cable of uniform linear density $2$ kg/m. A winch winds in the cable and lifts the bucket to the winch. How much work does it do? Use $g = 9.8$ m/s$^2$.'
            answer: '1999.2'
            answer_contract: {"kind": "unit", "quantity": "energy", "unit": "joule", "allow_omitted": true}
            solution_sketch: 'The cable needs $\int_0^{12} 2(9.8)x\,dx = 19.6 \cdot 72 = 1411.2$ J. The bucket weighs $5(9.8) = 49$ N and rises $12$ m, which needs $588$ J. The total is $1411.2 + 588 = 1999.2$ J.'
        constraints: "uniform cables/chains, with or without a bucket on the end; distances measured from the lift destination; g = 9.8"
      - id: kp3
        name: Work pumping liquids
        key_prerequisites: [work-springs, definite-integrals-ftc]
        exemplars:
          - problem: 'A cylindrical tank of radius $1$ m and height $4$ m is full of water, which weighs $9800$ N/m$^3$. How much work does it take to pump all the water over the top rim?'
            answer: '78400pi'
            answer_contract: {"kind": "unit", "quantity": "energy", "unit": "joule", "allow_omitted": true}
            solution_sketch: 'A slice at depth $x$ below the rim has volume $\pi(1)^2\,dx$ and weighs $9800\pi\,dx$ N. It rises $x$, so $W = \int_0^4 9800\pi x\,dx = 9800\pi \cdot 8 = 78400\pi$ J.'
          - problem: 'A cylindrical tank of radius $2$ m and height $2$ m is half full of water, which weighs $9800$ N/m$^3$. The water fills the depths from $1$ m to $2$ m below the rim. How much work does it take to pump all of it over the top rim?'
            answer: '58800pi'
            answer_contract: {"kind": "unit", "quantity": "energy", "unit": "joule", "allow_omitted": true}
            solution_sketch: 'A slice at depth $x$ weighs $9800 \cdot 4\pi\,dx = 39200\pi\,dx$ N and rises $x$. So $W = \int_1^2 39200\pi x\,dx = 39200\pi\left(2 - \frac12\right) = 58800\pi$ J.'
          - problem: 'A full cylindrical tank has radius $3$ m and height $2$ m. It holds water of weight density $9800$ N/m$^3$. Find the work needed to pump all the water over the top rim.'
            answer: '176400pi'
            answer_contract: {"kind": "unit", "quantity": "energy", "unit": "joule", "allow_omitted": true}
            solution_sketch: 'A slice at depth $x$ has volume $9\pi\,dx$ and weighs $88200\pi\,dx$ N. So $W = \int_0^2 88200\pi x\,dx = 88200\pi \cdot 2 = 176400\pi$ J.'
          - problem: 'A full cylindrical tank of radius $2$ m and height $3$ m holds oil that weighs $8000$ N/m$^3$. How much work does it take to pump all the oil over the top rim?'
            answer: '144000pi'
            answer_contract: {"kind": "unit", "quantity": "energy", "unit": "joule", "allow_omitted": true}
            solution_sketch: 'A slice of oil at depth $x$ weighs $8000 \cdot 4\pi\,dx = 32000\pi\,dx$ N and rises $x$. So $W = \int_0^3 32000\pi x\,dx = 32000\pi \cdot 4.5 = 144000\pi$ J.'
          - problem: 'Pumping all the water over the top rim of a full cylindrical tank that is $2$ m tall takes $176400\pi$ J of work. Water weighs $9800$ N/m$^3$. What is the radius of the tank?'
            answer: '3'
            answer_contract: {"kind": "unit", "quantity": "length", "unit": "m", "allow_omitted": true}
            solution_sketch: 'For radius $r$ the work is $\int_0^2 9800\pi r^2 x\,dx = 19600\pi r^2$. Setting $19600\pi r^2 = 176400\pi$ and dividing by $19600\pi$ gives $r^2 = 9$, so $r = 3$ m.'
          - problem: 'A full cylindrical tank of radius $2$ m and height $3$ m holds water of weight density $9800$ N/m$^3$. The water is pumped up to a spout that is $1$ m above the top rim. How much work does this take?'
            answer: '294000pi'
            answer_contract: {"kind": "unit", "quantity": "energy", "unit": "joule", "allow_omitted": true}
            solution_sketch: 'A slice at depth $x$ must now rise $x + 1$ meters and weighs $39200\pi\,dx$ N. So $W = \int_0^3 39200\pi(x + 1)\,dx = 39200\pi\left(\frac92 + 3\right) = 294000\pi$ J.'
          - problem: 'A cylindrical tank of radius $1$ m and height $3$ m has water in its lower part, from $1$ m below the rim down to the bottom. The water weighs $9800$ N/m$^3$. How much work does it take to pump this water over the top rim?'
            answer: '39200pi'
            answer_contract: {"kind": "unit", "quantity": "energy", "unit": "joule", "allow_omitted": true}
            solution_sketch: 'A slice at depth $x$ weighs $9800\pi\,dx$ N and rises $x$. The water occupies depths $1$ to $3$, so $W = \int_1^3 9800\pi x\,dx = 9800\pi(4.5 - 0.5) = 39200\pi$ J.'
          - problem: 'A cylindrical tank of radius $2$ m and height $5$ m holds water, which weighs $9800$ N/m$^3$, from $2$ m below the rim down to the bottom. How much work does it take to pump all this water over the top rim?'
            answer: '411600pi'
            answer_contract: {"kind": "unit", "quantity": "energy", "unit": "joule", "allow_omitted": true}
            solution_sketch: 'A slice at depth $x$ weighs $39200\pi\,dx$ N and rises $x$. The water fills depths $2$ to $5$, so $W = \int_2^5 39200\pi x\,dx = 39200\pi(12.5 - 2) = 411600\pi$ J.'
        constraints: "cylindrical tanks only; slices indexed by depth below the rim; weight density stated (9800 N/m^3 for water); the outlet may lie above the rim"
    diagnostic_exemplar:
      problem: 'A cylindrical tank of radius $2$ m and height $3$ m is full of water (weight density $9800$ N/m$^3$). Find the work to pump all the water over the top rim.'
      answer: '$176400\pi$ J'
      answer_contract: {kind: none}
      solution_sketch: 'A slab at depth $y$ below the rim has weight $9800 \cdot 4\pi\,dy$ and is lifted $y$: $W = 39200\pi\int_0^3 y\,dy = 176400\pi$.'
    anki_seeds:
      - front: "Average value of f on [a, b]?"
        back: '$f_{avg} = \frac{1}{b-a} \int_a^b f(x) \, dx$'
        type: basic
      - front: "Setting up a pumping problem: each slice's work contribution is..."
        back: "(weight density) x (slice volume) x (distance the slice must rise)"
        type: basic

  - id: fluid-force
    name: Hydrostatic Force
    core: false                # physical application of the definite integral
    difficulty: 0.66
    drill: false
    answer_kind: numeric
    expected_time_secs: 240
    prerequisites:
      - id: average-value-work
        weight: 0.6
        key: true
      - id: definite-integrals-ftc
        weight: 0.5
        key: true
      - id: area-triangles-quadrilaterals
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: Pressure and force on horizontal surfaces
        key_prerequisites: [definite-integrals-ftc]
        exemplars:
          - problem: 'Water has weight density $9800$ N/m$^3$. The horizontal bottom of a tank has area $15$ m$^2$ and lies $4$ m below the surface. Find the fluid force on the bottom, in newtons.'
            answer: '588000'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The pressure at depth $4$ m is $9800 \cdot 4 = 39200$ Pa, and it is the same everywhere on a horizontal surface. The force is pressure times area, $39200 \cdot 15 = 588000$ N.'
          - problem: 'Water has weight density $9800$ N/m$^3$. Find the pressure of the water on a horizontal surface at a depth of $6$ m, in pascals.'
            answer: '58800'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Pressure equals weight density times depth. So the pressure is $9800 \cdot 6 = 58800$ Pa.'
          - problem: 'Water has weight density $9800$ N/m$^3$. A horizontal plate of area $8$ m$^2$ feels a fluid force of $470400$ N. How deep is the plate?'
            answer: '6'
            answer_contract: {"kind": "unit", "quantity": "length", "unit": "m", "allow_omitted": true}
            solution_sketch: 'The pressure is the force divided by the area, $470400 \div 8 = 58800$ Pa. Pressure is $9800$ times the depth, so the depth is $58800 \div 9800 = 6$ m.'
          - problem: 'Water has weight density $9800$ N/m$^3$. A horizontal surface at a depth of $3$ m feels a fluid force of $441000$ N. What is the area of the surface?'
            answer: '15'
            answer_contract: {"kind": "unit", "quantity": "area", "unit": "m^2", "allow_omitted": true}
            solution_sketch: 'The pressure at depth $3$ m is $9800 \cdot 3 = 29400$ Pa. The area is the force divided by the pressure, $441000 \div 29400 = 15$ square meters.'
          - problem: 'A horizontal rectangular gate is $2$ m by $5$ m and lies $7$ m below the surface of water, which has weight density $9800$ N/m$^3$. Find the fluid force on the gate, in newtons.'
            answer: '686000'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The area of the gate is $2 \cdot 5 = 10$ square meters. The pressure at depth $7$ m is $9800 \cdot 7 = 68600$ Pa, so the force is $68600 \cdot 10 = 686000$ N.'
          - problem: 'A horizontal triangular plate has base $6$ m and height $4$ m. It lies $3$ m below the surface of water, which has weight density $9800$ N/m$^3$. Find the fluid force on the plate, in newtons.'
            answer: '352800'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The area of the triangle is $\frac12 \cdot 6 \cdot 4 = 12$ square meters. The pressure at depth $3$ m is $9800 \cdot 3 = 29400$ Pa, so the force is $29400 \cdot 12 = 352800$ N.'
          - problem: 'A diver swims at a depth of $25$ m in sea water, which has weight density $10100$ N/m$^3$. Find the pressure of the water on the diver, in pascals.'
            answer: '252500'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Pressure equals weight density times depth. So the pressure is $10100 \cdot 25 = 252500$ Pa.'
          - problem: 'An aquarium is $2$ m long and $0.5$ m wide. It is filled with water, which weighs $9800$ N/m$^3$, to a depth of $0.8$ m. Find the force of the water on the bottom of the aquarium, in newtons.'
            answer: '7840'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The bottom has area $2 \cdot 0.5 = 1$ square meter. The pressure at depth $0.8$ m is $9800 \cdot 0.8 = 7840$ Pa, so the force is $7840 \cdot 1 = 7840$ N.'
          - problem: 'A circular hatch of radius $0.5$ m lies flat on the floor of a pool, $20$ m below the surface of the water, which weighs $9800$ N/m$^3$. Find the fluid force on the hatch, in newtons.'
            answer: '49000pi'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The area of the hatch is $\pi(0.5)^2 = 0.25\pi$ square meters. The pressure at depth $20$ m is $9800 \cdot 20 = 196000$ Pa, so the force is $196000 \cdot 0.25\pi = 49000\pi$ N.'
          - problem: 'A horizontal plate of area $12$ m$^2$ lies $5$ m below the surface of water, which has weight density $9800$ N/m$^3$. What is the fluid force on the plate, in newtons?'
            answer: '588000'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Force is pressure times area, not pressure divided by area. The pressure is $9800 \cdot 5 = 49000$ Pa, so the force is $49000 \cdot 12 = 588000$ N.'
        constraints: "horizontal surfaces: force = pressure x area, no integral needed; weight density stated (9800 N/m^3 for water)"
      - id: kp2
        name: Force on vertical rectangular plates
        key_prerequisites: [average-value-work, definite-integrals-ftc]
        try_first:
          problem: 'A square plate $2$ m on a side lies flat $1$ m below the surface of water, where the force on it is $39200$ N. The plate is now turned to hang vertically with its top edge $1$ m below the surface. Is the force on one side still $39200$ N?'
          answer_contract: {"kind": "label", "options": [["no", "no, it is not", "it is not the same", "not the same", "different", "no, it is larger", "larger", "it is larger"], ["yes", "yes, it is", "it is the same", "the same", "same"]]}
          answer: 'no'
          reveal: 'Lying flat, every point of the plate is at a depth of $1$ m. Hanging, the lower points are deeper and feel more pressure, so the force is larger and the depth must be integrated.'
        exemplars:
          - problem: 'A rectangular plate $2$ m wide is submerged vertically with its top edge $1$ m and its bottom edge $3$ m below the water surface. The water has weight density $9800$ N/m$^3$. Find the fluid force on one side, in newtons.'
            answer: '78400'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A strip at depth $y$ has area $2\,dy$ and feels pressure $9800y$, so $F = 9800\int_1^3 2y\,dy$. This equals $9800(9 - 1) = 78400$ N.'
          - problem: 'A dam gate is a rectangle $3$ m wide. Its top edge lies at the water surface and its bottom edge is $2$ m below it. The water has weight density $9800$ N/m$^3$. Find the force of the water on the gate, in newtons.'
            answer: '58800'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A strip at depth $y$ has area $3\,dy$, so $F = 9800\int_0^2 3y\,dy$. This equals $9800 \cdot 6 = 58800$ N.'
          - problem: 'A rectangular plate $4$ m wide is submerged vertically with its top edge $1$ m and its bottom edge $4$ m below the water surface. The weight density of water is $9800$ N/m$^3$. Find the fluid force on one side, in newtons.'
            answer: '294000'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A strip at depth $y$ has area $4\,dy$, so $F = 9800\int_1^4 4y\,dy = 9800(32 - 2)$. The force is $294000$ N.'
          - problem: 'A rectangular plate $5$ m wide is submerged vertically with its top edge $2$ m and its bottom edge $5$ m below the water surface. The weight density of water is $9800$ N/m$^3$. Find the fluid force on one side, in newtons.'
            answer: '514500'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A strip at depth $y$ has area $5\,dy$, so $F = 9800\int_2^5 5y\,dy = 9800(62.5 - 10)$. The force is $514500$ N.'
          - problem: 'A rectangular plate $2$ m wide is submerged vertically with its top edge $1$ m below the water surface. The fluid force on one side is $147000$ N, and water weighs $9800$ N/m$^3$. How far below the surface is the bottom edge of the plate?'
            answer: '4'
            answer_contract: {"kind": "unit", "quantity": "length", "unit": "m", "allow_omitted": true}
            solution_sketch: 'If the bottom edge is at depth $d$, then $F = 9800\int_1^d 2y\,dy = 9800(d^2 - 1)$. Setting this equal to $147000$ gives $d^2 - 1 = 15$, so $d^2 = 16$ and $d = 4$ m.'
          - problem: 'A rectangular plate is submerged vertically from a depth of $2$ m to a depth of $4$ m. The fluid force on one side is $117600$ N, and water weighs $9800$ N/m$^3$. How wide is the plate?'
            answer: '2'
            answer_contract: {"kind": "unit", "quantity": "length", "unit": "m", "allow_omitted": true}
            solution_sketch: 'For width $w$ the force is $9800\int_2^4 wy\,dy = 9800w(8 - 2) = 58800w$. Setting $58800w = 117600$ and dividing by $58800$ gives $w = 2$ m.'
          - problem: 'A viewing window in an aquarium is a rectangle $1.5$ m wide. Its top edge is $2$ m and its bottom edge is $4$ m below the water surface. Water weighs $9800$ N/m$^3$. Find the force of the water on the window, in newtons.'
            answer: '88200'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A strip at depth $y$ has area $1.5\,dy$, so $F = 9800\int_2^4 1.5y\,dy$. This equals $9800 \cdot 1.5 \cdot 6 = 88200$ N.'
          - problem: 'One wall of a tank is a rectangle $5$ m long. The tank is full of water, which weighs $9800$ N/m$^3$, to a depth of $2$ m. Find the force of the water on that wall, in newtons.'
            answer: '98000'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The wall runs from the surface, depth $0$, down to depth $2$ m. A strip at depth $y$ has area $5\,dy$, so $F = 9800\int_0^2 5y\,dy = 9800 \cdot 10 = 98000$ N.'
          - problem: 'A rectangular plate $3$ m wide has its top edge $2$ m and its bottom edge $4$ m below the surface of water, which has weight density $9800$ N/m$^3$. What is the force on the plate, in newtons?'
            answer: '176400'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The pressure grows with depth, so the pressure at the top edge is too small for the whole plate. The force is $9800\int_2^4 3y\,dy = 9800 \cdot 18 = 176400$ N.'
        constraints: "strips indexed by depth y; width constant; depths are small integers"
      - id: kp3
        name: Plates with varying width
        key_prerequisites: [average-value-work, area-triangles-quadrilaterals]
        exemplars:
          - problem: 'A triangular plate has its base of $6$ m at the water surface and its apex $6$ m directly below the midpoint of the base. The width of the plate at depth $y$ is $w(y) = 6 - y$ meters. The water weighs $9800$ N/m$^3$. Find the fluid force on one side, in newtons.'
            answer: '352800'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The force is $9800\int_0^6 y(6 - y)\,dy$. An antiderivative is $3y^2 - \frac{y^3}{3}$, which equals $108 - 72 = 36$ at $y = 6$. So $F = 9800 \cdot 36 = 352800$ N.'
          - problem: 'A circular plate of radius $2$ m is submerged vertically with its center $5$ m below the water surface. Its width at depth $y$ is $w(y) = 2\sqrt{4 - (y - 5)^2}$ meters. The water weighs $9800$ N/m$^3$. Find the fluid force on one side, in newtons.'
            answer: '196000pi'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The plate is symmetric about its horizontal diameter, so the centroid depth is the center depth, $5$ m. The area is $\pi \cdot 2^2 = 4\pi$, so $F = 9800 \cdot 5 \cdot 4\pi = 196000\pi$ N.'
          - problem: 'A vertical plate is a trapezoid. Its top edge is at the water surface and is $4$ m wide, and its bottom edge is at depth $3$ m and is $8$ m wide. The width at depth $y$ is $w(y) = 4 + \frac{4}{3}y$ meters. The water weighs $9800$ N/m$^3$. Find the fluid force on one side, in newtons.'
            answer: '294000'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The force is $9800\int_0^3 y\left(4 + \frac43 y\right)dy$. An antiderivative is $2y^2 + \frac49 y^3$, which equals $18 + 12 = 30$ at $y = 3$. So $F = 9800 \cdot 30 = 294000$ N.'
          - problem: 'A triangular plate has its apex at the water surface and its base of $6$ m at a depth of $4$ m, parallel to the surface. The width at depth $y$ is $w(y) = \frac32 y$ meters. The water weighs $9800$ N/m$^3$. Find the fluid force on one side, in newtons.'
            answer: '313600'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The force is $9800 \cdot \frac32\int_0^4 y^2\,dy = 9800 \cdot \frac32 \cdot \frac{64}{3}$. Since $\frac32 \cdot \frac{64}{3} = 32$, the force is $9800 \cdot 32 = 313600$ N.'
          - problem: 'A vertical plate extends from the water surface down to a depth of $3$ m. Its width at depth $y$ is $w(y) = 2 + 2y$ meters. The water weighs $9800$ N/m$^3$. Find the fluid force on one side, in newtons.'
            answer: '264600'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The force is $9800\int_0^3 y(2 + 2y)\,dy$. An antiderivative is $y^2 + \frac23 y^3$, which equals $9 + 18 = 27$ at $y = 3$. So $F = 9800 \cdot 27 = 264600$ N.'
          - problem: 'A semicircular plate of radius $3$ m is submerged vertically with its straight edge, the diameter, at the water surface. Its width at depth $y$ is $w(y) = 2\sqrt{9 - y^2}$ meters. The water weighs $9800$ N/m$^3$. Find the fluid force on one side, in newtons.'
            answer: '176400'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The force is $9800\int_0^3 2y\sqrt{9 - y^2}\,dy$. The substitution $u = 9 - y^2$ gives the value $\left[-\frac23(9 - y^2)^{3/2}\right]_0^3 = 18$. So $F = 9800 \cdot 18 = 176400$ N.'
          - problem: 'The face of a dam is a trapezoid $8$ m deep. Its top edge is at the water surface and is $20$ m wide, and its bottom edge is $8$ m wide. The width at depth $y$ is $w(y) = 20 - 1.5y$ meters. The water weighs $9800$ N/m$^3$. Find the force of the water on the dam, in newtons.'
            answer: '3763200'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The force is $9800\int_0^8 y(20 - 1.5y)\,dy$. An antiderivative is $10y^2 - 0.5y^3$, which equals $640 - 256 = 384$ at $y = 8$. So $F = 9800 \cdot 384 = 3763200$ N.'
          - problem: 'A triangular plate has its base of width $b$ at the water surface and its apex $3$ m directly below the midpoint of the base. The fluid force on one side is $88200$ N, and water weighs $9800$ N/m$^3$. What is the width $b$ of the base?'
            answer: '6'
            answer_contract: {"kind": "unit", "quantity": "length", "unit": "m", "allow_omitted": true}
            solution_sketch: 'The width at depth $y$ is $b\left(1 - \frac{y}{3}\right)$, so $F = 9800b\int_0^3 \left(y - \frac{y^2}{3}\right)dy = 9800b \cdot 1.5 = 14700b$. Setting $14700b = 88200$ gives $b = 6$ m.'
          - problem: 'A triangular plate has its base of $9$ m at the water surface and its apex $3$ m directly below the midpoint of the base. The water weighs $9800$ N/m$^3$. What is the force on one side, in newtons?'
            answer: '132300'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The pressure is smaller at the top of the plate than at the apex, and the plate is wide at the top. The width is $w(y) = 9 - 3y$, so $F = 9800\int_0^3 y(9 - 3y)\,dy = 9800 \cdot 13.5 = 132300$ N.'
          - problem: 'A vertical dam gate is a trapezoid $6$ m deep. Its top edge is at the water surface and is $10$ m wide, and its bottom edge is $4$ m wide. The sides slope steadily. The water weighs $9800$ N/m$^3$. Find the force of the water on the gate, in newtons.'
            answer: '1058400'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The width falls steadily from $10$ m to $4$ m over $6$ m of depth, so $w(y) = 10 - y$ meters. Then $F = 9800\int_0^6 y(10 - y)\,dy = 9800\left(5y^2 - \frac{y^3}{3}\right)\Big|_0^6 = 9800(180 - 72) = 1058400$ N.'
        constraints: "width w(y) linear in depth, or the centroid shortcut for symmetric plates; state w(y) explicitly"
    diagnostic_exemplar:
      problem: 'A triangular plate has its base of $4$ m at the water surface and its apex $3$ m directly below the midpoint of the base. Find the fluid force on one side ($9800$ N/m$^3$).'
      answer: '$58800$ N'
      answer_contract: {kind: none}
      solution_sketch: 'The width at depth $y$ is $4(1 - y/3)$, so $F = 9800\int_0^3 y\cdot 4\left(1 - \frac{y}{3}\right)dy = 39200 \cdot \frac{3}{2}$.'
    anki_seeds:
      - front: "Hydrostatic force on a vertical plate (strip at depth y, width w(y))?"
        back: '$F = \rho g \int y \, w(y) \, dy$ over the plate''s depth range'
        type: basic
      - front: "Centroid shortcut for hydrostatic force?"
        back: '$F = \rho g \bar{h} A$ — weight density times centroid depth times plate area'
        type: basic

  - id: center-of-mass
    name: Moments and Center of Mass
    core: false                # physical application of the definite integral
    difficulty: 0.7
    drill: false
    answer_kind: numeric
    expected_time_secs: 270
    prerequisites:
      - id: area-between-curves
        weight: 0.7
        key: true
      - id: definite-integrals-ftc
        weight: 0.5
        key: true
      - id: weighted-averages
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: Discrete point masses
        key_prerequisites: [weighted-averages]
        try_first:
          problem: 'A $20$ kg child sits at $x = 0$ and a $10$ kg child sits at $x = 6$ on a seesaw, with $x$ in meters. At what value of $x$ must the pivot be for the seesaw to balance?'
          answer_contract: {"kind": "exact"}
          answer: '2'
          reveal: 'The balance point is not the midpoint $x = 3$. The heavier child counts for more and pulls it to $x = 2$, which is the mass-weighted average of the positions.'
        exemplars:
          - problem: 'Masses of $3$ kg, $2$ kg, and $5$ kg sit at $x = -2$, $x = 1$, and $x = 4$ on a line. Find the center of mass.'
            answer: '8/5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The total mass is $3 + 2 + 5 = 10$ kg. The total moment is $3(-2) + 2(1) + 5(4) = 16$, so the center of mass is at $x = 16/10 = 8/5$.'
          - problem: 'Masses of $2$ kg and $6$ kg sit at $x = -1$ and $x = 3$. Find the center of mass.'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The total mass is $2 + 6 = 8$ kg. The total moment is $2(-1) + 6(3) = 16$, so the center of mass is at $x = 16/8 = 2$.'
          - problem: 'Masses of $2$ kg and $m$ kg sit at $x = 1$ and $x = 4$. The center of mass is at $x = 3$. Find the mass $m$.'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The center of mass satisfies $\frac{2(1) + 4m}{2 + m} = 3$. Multiplying out gives $2 + 4m = 6 + 3m$, so $m = 4$ kg.'
          - problem: 'Masses of $1$ kg, $3$ kg, and $2$ kg sit at $x = 0$, $x = 2$, and $x = c$. The center of mass is at $x = 3$. Find $c$.'
            answer: '6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The total mass is $6$ kg, so $\frac{1(0) + 3(2) + 2c}{6} = 3$. Then $6 + 2c = 18$, so $2c = 12$ and $c = 6$.'
          - problem: 'Masses of $1$ kg, $2$ kg, $3$ kg, and $4$ kg sit at $x = -3$, $x = -1$, $x = 2$, and $x = 5$. Find the center of mass.'
            answer: '21/10'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The total mass is $1 + 2 + 3 + 4 = 10$ kg. The total moment is $-3 - 2 + 6 + 20 = 21$, so the center of mass is at $x = 21/10$.'
          - problem: 'Masses of $5$ kg, $1$ kg, and $2$ kg sit at $x = -4$, $x = 3$, and $x = 7$. Find the center of mass.'
            answer: '-3/8'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The total mass is $5 + 1 + 2 = 8$ kg. The total moment is $-20 + 3 + 14 = -3$, so the center of mass is at $x = -3/8$.'
          - problem: 'A $30$ kg child sits at one end of a $3$ m seesaw, and a $45$ kg child sits at the other end. How far from the $30$ kg child must the pivot be for the seesaw to balance? Ignore the mass of the seesaw.'
            answer: '1.8'
            answer_contract: {"kind": "unit", "quantity": "length", "unit": "m", "allow_omitted": true}
            solution_sketch: 'Put the $30$ kg child at $x = 0$ and the $45$ kg child at $x = 3$. The balance point is the center of mass, $\frac{30(0) + 45(3)}{75} = \frac{135}{75} = 1.8$ m from the $30$ kg child.'
          - problem: 'A $10$ m beam carries loads of $200$ kg, $300$ kg, and $500$ kg at distances of $2$ m, $5$ m, and $9$ m from its left end. At what distance from the left end must a single support be placed so that the loads balance? Ignore the mass of the beam.'
            answer: '6.4'
            answer_contract: {"kind": "unit", "quantity": "length", "unit": "m", "allow_omitted": true}
            solution_sketch: 'The total load is $200 + 300 + 500 = 1000$ kg. The total moment is $200(2) + 300(5) + 500(9) = 6400$, so the support goes at $6400/1000 = 6.4$ m from the left end.'
          - problem: 'What is the center of mass of a $4$ kg mass at $x = 2$ and a $1$ kg mass at $x = 7$?'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The midpoint ignores the masses, but the heavier mass pulls the balance point toward itself. The center of mass is $\frac{4(2) + 1(7)}{4 + 1} = \frac{15}{5} = 3$.'
        constraints: "2-4 point masses with integer positions and masses; answer a fraction or integer"
      - id: kp2
        name: Centroid of a region under a curve
        key_prerequisites: [definite-integrals-ftc, area-between-curves]
        exemplars:
          - problem: 'Find the centroid of the region under $y = x^2$ for $0 \le x \le 1$.'
            answer: '(3/4, 3/10)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'The area is $\int_0^1 x^2\,dx = \frac13$. Then $\bar x = 3\int_0^1 x^3\,dx = \frac34$ and $\bar y = 3\int_0^1 \frac{x^4}{2}\,dx = \frac{3}{10}$.'
          - problem: 'Find the centroid of the semicircular region under $y = \sqrt{1 - x^2}$ for $-1 \le x \le 1$.'
            answer: '(0, 4/(3pi))'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'The region is symmetric about the $y$-axis, so $\bar x = 0$. The area is $\frac{\pi}{2}$ and $\int_{-1}^1 \frac{1 - x^2}{2}\,dx = \frac23$, so $\bar y = \frac{2/3}{\pi/2} = \frac{4}{3\pi}$.'
          - problem: 'Find the centroid of the region under $y = 4 - x^2$ for $-2 \le x \le 2$.'
            answer: '(0, 8/5)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'Symmetry about the $y$-axis gives $\bar x = 0$. The area is $\frac{32}{3}$ and $\int_{-2}^2 \frac{(4 - x^2)^2}{2}\,dx = \frac{256}{15}$, so $\bar y = \frac{256/15}{32/3} = \frac85$.'
          - problem: 'Find the centroid of the region under $y = x^3$ for $0 \le x \le 1$.'
            answer: '(4/5, 2/7)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'The area is $\frac14$. Then $\bar x = 4\int_0^1 x^4\,dx = \frac45$ and $\bar y = 4\int_0^1 \frac{x^6}{2}\,dx = \frac27$.'
          - problem: 'Find the centroid of the quarter-disk region under $y = \sqrt{1 - x^2}$ for $0 \le x \le 1$.'
            answer: '(4/(3pi), 4/(3pi))'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'The area is $\frac{\pi}{4}$ and $\int_0^1 x\sqrt{1 - x^2}\,dx = \frac13$, so $\bar x = \frac{1/3}{\pi/4} = \frac{4}{3\pi}$. The region is symmetric in the line $y = x$, so $\bar y = \frac{4}{3\pi}$ as well.'
          - problem: 'Find the centroid of the region under $y = x^2 + 1$ for $-1 \le x \le 1$.'
            answer: '(0, 7/10)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'Symmetry about the $y$-axis gives $\bar x = 0$. The area is $\frac83$ and $\int_{-1}^1 \frac{(x^2 + 1)^2}{2}\,dx = \frac{28}{15}$, so $\bar y = \frac{28/15}{8/3} = \frac{7}{10}$.'
          - problem: 'A thin metal plate has the shape of the region under $y = \sqrt{x}$ for $0 \le x \le 4$. Find its balance point.'
            answer: '(12/5, 3/4)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'The area is $\int_0^4 \sqrt{x}\,dx = \frac{16}{3}$. Then $\bar x = \frac{3}{16}\int_0^4 x^{3/2}\,dx = \frac{3}{16} \cdot \frac{64}{5} = \frac{12}{5}$ and $\bar y = \frac{3}{16}\int_0^4 \frac{x}{2}\,dx = \frac{3}{16} \cdot 4 = \frac34$.'
          - problem: 'A sign is cut in the shape of the region under one arch of $y = \sin x$, for $0 \le x \le \pi$. Find the centroid of the sign.'
            answer: '(pi/2, pi/8)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'The area is $\int_0^{\pi}\sin x\,dx = 2$. The arch is symmetric about $x = \frac{\pi}{2}$, so $\bar x = \frac{\pi}{2}$. Then $\bar y = \frac12 \cdot \frac12\int_0^{\pi}\sin^2 x\,dx = \frac12 \cdot \frac{\pi}{4} = \frac{\pi}{8}$.'
          - problem: 'What is the height $\bar y$ of the centroid of the region under $y = x^2$ for $0 \le x \le 2$?'
            answer: '6/5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The area is $A = \frac83$. The height of the centroid uses the squared function and a factor $\frac12$: $\bar y = \frac{1}{A}\int_0^2 \frac{x^4}{2}\,dx = \frac38 \cdot \frac{16}{5} = \frac65$.'
        constraints: "regions under a single polynomial, circular, square-root, or sine curve; use symmetry to kill one coordinate where possible"
      - id: kp3
        name: Centroid between two curves
        key_prerequisites: [area-between-curves, definite-integrals-ftc]
        exemplars:
          - problem: 'Find the centroid of the region between $y = x$ and $y = x^2$.'
            answer: '(1/2, 2/5)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'The curves meet at $x = 0$ and $x = 1$, and the area is $\frac16$. Then $\bar x = 6\int_0^1 (x^2 - x^3)\,dx = \frac12$ and $\bar y = 6\int_0^1 \frac{x^2 - x^4}{2}\,dx = \frac25$.'
          - problem: 'A uniform lamina covers the region bounded by $y = x^2$ and $y = x^3$. Find its centroid.'
            answer: '(3/5, 12/35)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'The area is $\int_0^1 (x^2 - x^3)\,dx = \frac{1}{12}$. Then $M_y = \int_0^1 x(x^2 - x^3)\,dx = \frac{1}{20}$ gives $\bar x = \frac35$, and $M_x = \frac12\int_0^1 (x^4 - x^6)\,dx = \frac{1}{35}$ gives $\bar y = \frac{12}{35}$.'
          - problem: 'The region between $y = x$ and $y = x^4$ has the moment $\int_0^1 x(x - x^4)\,dx = \frac16$. What is the value of $\bar x$?'
            answer: '5/9'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The moment must be divided by the area. The area is $\int_0^1 (x - x^4)\,dx = \frac{3}{10}$, so $\bar x = \frac{1/6}{3/10} = \frac59$.'
          - problem: 'Find the centroid of the region bounded by the graphs of $y = x^2$ and $y = x^4$.'
            answer: '(5/8, 1/3)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'The area is $\int_0^1 (x^2 - x^4)\,dx = \frac{2}{15}$. Then $M_y = \int_0^1 x(x^2 - x^4)\,dx = \frac{1}{12}$ gives $\bar x = \frac{1/12}{2/15} = \frac58$, and $M_x = \frac12\int_0^1 (x^4 - x^8)\,dx = \frac{2}{45}$ gives $\bar y = \frac{2/45}{2/15} = \frac13$.'
          - problem: 'A lamina fills the region between $y = x^3$ and $y = x^4$. Find its center of mass.'
            answer: '(2/3, 20/63)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'The area is $\int_0^1 (x^3 - x^4)\,dx = \frac{1}{20}$. Then $M_y = \frac{1}{30}$ gives $\bar x = \frac23$, and $M_x = \frac12\int_0^1 (x^6 - x^8)\,dx = \frac{1}{63}$ gives $\bar y = \frac{20}{63}$.'
          - problem: 'A flat gasket has the shape of the region between $y = \sqrt{x}$ and $y = x$. Find its centroid.'
            answer: '(2/5, 1/2)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'The curves meet at $x = 0$ and $x = 1$, with $\sqrt{x}$ on top, and the area is $\frac16$. Then $\bar x = 6\int_0^1 (x^{3/2} - x^2)\,dx = \frac25$ and $\bar y = 6 \cdot \frac12\int_0^1 (x - x^2)\,dx = \frac12$.'
          - problem: 'A lamina is bounded by the parabola $y = x^2$ and the line $y = 2x$. Find its centroid.'
            answer: '(1, 8/5)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'The curves meet at $x = 0$ and $x = 2$, with the line on top, and the area is $\frac43$. Then $\bar x = \frac34\int_0^2 x(2x - x^2)\,dx = 1$ and $\bar y = \frac34 \cdot \frac12\int_0^2 (4x^2 - x^4)\,dx = \frac85$.'
        constraints: "curves intersect at x = 0 and at a small positive integer; moments integrate as polynomials or powers of sqrt(x)"
    diagnostic_exemplar:
      problem: 'Find the centroid of the region between $y = \sqrt{x}$ and $y = x^2$.'
      answer: '$\left(\frac{9}{20}, \frac{9}{20}\right)$'
      solution_sketch: 'The area is $\frac13$; $\bar x = 3\int_0^1 x(\sqrt x - x^2)dx = \frac{9}{20}$, and the region is symmetric in $y = x$, so $\bar y = \bar x$.'
    anki_seeds:
      - front: "Centroid formulas for the region under y = f(x) on [a, b] (area A)?"
        back: '$\bar{x} = \frac{1}{A}\int_a^b x f(x)\,dx$, $\quad \bar{y} = \frac{1}{A}\int_a^b \frac{f(x)^2}{2}\,dx$'
        type: basic
      - front: "Center of mass of point masses m_i at x_i?"
        back: '$\bar{x} = \frac{\sum m_i x_i}{\sum m_i}$ (total moment over total mass)'
        type: basic
