unit: integration-applications
course: calculus-2
module: "Applications of Integration"
topics:
  - id: area-between-curves-x
    name: Area Between Curves on a Given Interval
    core: true
    difficulty: 0.52
    drill: false
    answer_kind: expression
    expected_time_secs: 120
    prerequisites:
      - id: definite-integrals-ftc
        weight: 0.8
        key: true
      - id: area-under-a-curve
        weight: 0.6
        key: true
      - id: antiderivatives
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: Top minus bottom, polynomial curves
        key_prerequisites: [definite-integrals-ftc, area-under-a-curve]
        exemplars:
          - problem: 'Find the area between $y = x$ and $y = x^2$ for $0 \le x \le 1$.'
            answer: '$1/6$'
            solution_sketch: 'On $[0,1]$, $x \ge x^2$: $\int_0^1 (x - x^2)\,dx = \frac{1}{2} - \frac{1}{3} = \frac{1}{6}$.'
          - problem: 'Find the area between $y = x^2 + 1$ and $y = x$ for $0 \le x \le 2$.'
            answer: '$8/3$'
            solution_sketch: '$x^2 + 1 > x$ everywhere: $\int_0^2 (x^2 - x + 1)\,dx = \frac{8}{3} - 2 + 2 = \frac{8}{3}$.'
          - problem: "Find the area between y = 2x and y = x^2 for 0 <= x <= 2."
            answer: "4/3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "First compare the curves: on [0,2], 2x - x^2 = x(2-x) >= 0, so y = 2x is the top curve. Set up the area integral int_0^2 (2x - x^2) dx. Use the power rule for antiderivatives: [x^2 - x^3/3] from 0 to 2. By the Fundamental Theorem of Calculus, evaluate at 2 and 0: (4 - 8/3) - 0 = 4/3. The area is 4/3."
          - problem: "Find the area between y = x^2 + 2 and y = 3x for 0 <= x <= 1."
            answer: "5/6"
            answer_contract: {"kind": "exact"}
            solution_sketch: "First check the top curve: x^2 + 2 - 3x = (x - 1)(x - 2), and this is positive on [0,1], so y = x^2 + 2 is on top. Form the integral int_0^1 (x^2 + 2 - 3x) dx. Find an antiderivative with the power rule: x^3/3 + 2x - 3x^2/2. Apply the Fundamental Theorem of Calculus: at x = 1 the value is 1/3 + 2 - 3/2 = 5/6, and at x = 0 it is 0. The area is 5/6."
          - problem: "Find the area between y = x^2 + 1 and y = 2x^2 for 0 <= x <= 1."
            answer: "2/3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Compare the curves: (x^2 + 1) - 2x^2 = 1 - x^2, which is nonnegative on [0,1], so y = x^2 + 1 is the top curve. Write the area as int_0^1 (1 - x^2) dx. An antiderivative by the power rule is x - x^3/3. The Fundamental Theorem of Calculus gives (1 - 1/3) - 0 = 2/3. The area is 2/3."
          - problem: "Find the area between y = x^2 + 4 and y = 4x for 0 <= x <= 1."
            answer: "7/3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Check the top curve: (x^2 + 4) - 4x = (x - 2)^2, which is positive on [0,1], so y = x^2 + 4 is on top. Set up the area integral int_0^1 (x^2 - 4x + 4) dx. Use the power rule to get x^3/3 - 2x^2 + 4x. Evaluate with the Fundamental Theorem of Calculus: at x = 1, 1/3 - 2 + 4 = 7/3; at x = 0, 0. The area is 7/3."
        constraints: "interval given explicitly; top curve does not change on the interval; polynomial integrands with small integer coefficients"
      - id: kp2
        name: Exponential and trig curves
        key_prerequisites: [definite-integrals-ftc, antiderivatives]
        exemplars:
          - problem: 'Find the area between $y = e^x$ and $y = 1$ for $0 \le x \le 1$.'
            answer: '$e - 2$'
            solution_sketch: '$\int_0^1 (e^x - 1)\,dx = (e - 1) - 1 = e - 2$.'
          - problem: 'Find the area between $y = e^x$ and $y = e^{-x}$ for $0 \le x \le 1$.'
            answer: '$e + 1/e - 2$'
            solution_sketch: '$e^x \ge e^{-x}$ for $x \ge 0$: $[e^x + e^{-x}]_0^1 = (e + e^{-1}) - 2$.'
          - problem: 'Find the area between $y = \sin x$ and the $x$-axis for $0 \le x \le \pi$.'
            answer: "2"
            solution_sketch: '$\int_0^{\pi} \sin x\,dx = [-\cos x]_0^{\pi} = 2$.'
          - problem: "Find the area between y = cos x and the x-axis for 0 <= x <= pi/2."
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Write the area as the integral from 0 to pi/2 of cos x minus 0. An antiderivative of cos x is sin x, by the basic trig antiderivative rule. Evaluate by FTC: sin(pi/2) - sin(0) = 1 - 0 = 1."
          - problem: "Find the area between y = e^(2x) and y = 1 for 0 <= x <= 1."
            answer: "(e^2 - 3)/2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The area is the integral from 0 to 1 of (e^(2x) - 1) dx. An antiderivative of e^(2x) is e^(2x)/2, and of 1 is x. Evaluate by FTC at 1 and 0: (e^2/2 - 1) - (1/2 - 0) = (e^2 - 3)/2."
          - problem: "Find the area between y = sin x and y = cos x for 0 <= x <= pi/4."
            answer: "sqrt(2) - 1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The area is the integral from 0 to pi/4 of (cos x - sin x) dx, because cos x is greater than or equal to sin x on this interval. Antiderivatives: sin x for cos x and -cos x for sin x, so an antiderivative is sin x + cos x. FTC gives (sqrt(2)/2 + sqrt(2)/2) - (0 + 1) = sqrt(2) - 1."
        constraints: "integrands limited to e^{ax}, sin x, cos x; the ordering of the curves must not change on the interval"
    diagnostic_exemplar:
      problem: 'Find the area between $y = e^x$ and $y = x$ for $0 \le x \le 1$.'
      answer: '$e - 3/2$'
      solution_sketch: '$\int_0^1 (e^x - x)\,dx = [e^x - x^2/2]_0^1 = (e - \tfrac12) - 1$.'
    anki_seeds:
      - front: "Area between curves f (top) and g (bottom) on [a, b]?"
        back: '$\int_a^b (f(x) - g(x)) \, dx$'
        type: basic
      - front: "Before integrating f - g for an area, first check..."
        back: "which curve is on top throughout the interval (the integrand must stay nonnegative)"
        type: basic

  - id: area-between-curves
    name: Area Between Curves
    core: true
    difficulty: 0.55
    drill: false
    answer_kind: expression
    expected_time_secs: 150
    prerequisites:
      - id: area-between-curves-x
        weight: 0.8
        key: true
      - id: definite-integrals-ftc
        weight: 0.5
      - id: quadratic-graphs-vertex
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: Find the intersection points first
        key_prerequisites: [area-between-curves-x, quadratic-graphs-vertex]
        exemplars:
          - problem: 'Find the area of the region enclosed by $y = x^2$ and $y = x + 2$.'
            answer: '$9/2$'
            solution_sketch: '$x^2 = x + 2$ at $x = -1, 2$. $\int_{-1}^{2} (x + 2 - x^2)\,dx = [\frac{x^2}{2} + 2x - \frac{x^3}{3}]_{-1}^{2} = \frac{10}{3} + \frac{7}{6} = \frac{9}{2}$.'
          - problem: 'Find the area of the region enclosed by $y = \sqrt{x}$ and $y = x$.'
            answer: '$1/6$'
            solution_sketch: 'Curves meet at $x = 0, 1$; $\int_0^1 (\sqrt{x} - x)\,dx = \frac{2}{3} - \frac{1}{2} = \frac{1}{6}$.'
          - problem: 'Find the area of the region enclosed by $y = x^2$ and $y = 2x$.'
            answer: '$4/3$'
            solution_sketch: 'Intersections at $x = 0, 2$; $\int_0^2 (2x - x^2)\,dx = 4 - \frac{8}{3} = \frac{4}{3}$.'
          - problem: "Find the area of the region enclosed by $y = x^2$ and $y = 4x$."
            answer: "32/3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Set x^2 = 4x and factor x(x - 4) = 0, so the curves meet at x = 0 and x = 4. On 0 < x < 4 the line y = 4x is above the parabola y = x^2. By the Fundamental Theorem of Calculus, the area is integral_0^4 (4x - x^2) dx = [2x^2 - x^3/3]_0^4. Evaluate: 32 - 64/3 = 32/3. The area is 32/3."
          - problem: "Find the area of the region enclosed by $y = x^2$ and $y = 6 - x$."
            answer: "125/6"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Set x^2 = 6 - x and factor x^2 + x - 6 = (x + 3)(x - 2) = 0, so the intersections are x = -3 and x = 2. On -3 < x < 2 the line y = 6 - x is above the parabola y = x^2. By the Fundamental Theorem of Calculus, the area is integral_{-3}^{2} (6 - x - x^2) dx = [6x - x^2/2 - x^3/3]_{-3}^{2}. Evaluate: 22/3 - (-27/2) = 125/6. The area is 125/6."
          - problem: "Find the area of the region enclosed by $y = x^2$ and $y = 2x + 8$."
            answer: "36"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Set x^2 = 2x + 8 and factor x^2 - 2x - 8 = (x - 4)(x + 2) = 0, so the intersections are x = -2 and x = 4. On -2 < x < 4 the line y = 2x + 8 is above the parabola y = x^2. By the Fundamental Theorem of Calculus, the area is integral_{-2}^{4} (2x + 8 - x^2) dx = [x^2 + 8x - x^3/3]_{-2}^{4}. Evaluate: 80/3 - (-28/3) = 108/3 = 36. The area is 36."
        constraints: "intersections solvable by factoring a quadratic with integer roots (or x = 0, 1 for root curves)"
      - id: kp2
        name: Crossing curves (split at the crossing)
        key_prerequisites: [area-between-curves-x]
        exemplars:
          - problem: 'Find the total area between $y = x^3$ and $y = x$ for $-1 \le x \le 1$.'
            answer: '$1/2$'
            solution_sketch: 'The curves cross at $x = 0$; by symmetry the area is $2\int_0^1 (x - x^3)\,dx = 2(\frac{1}{2} - \frac{1}{4}) = \frac{1}{2}$.'
          - problem: 'Find the total area between $y = \cos x$ and $y = \sin x$ for $0 \le x \le \pi/2$.'
            answer: '$2\sqrt 2 - 2$'
            solution_sketch: 'They cross at $x = \pi/4$. $\int_0^{\pi/4}(\cos x - \sin x)\,dx = \sqrt{2} - 1$; the second piece equals the first by symmetry, so the total is $2\sqrt{2} - 2$.'
        constraints: "at most one sign change inside the interval; split the integral there and add absolute areas"
      - id: kp3
        name: Integrating with respect to y
        key_prerequisites: [area-between-curves-x]
        exemplars:
          - problem: 'Find the area of the region enclosed by $x = y^2$ and $x = y + 2$.'
            answer: '$9/2$'
            solution_sketch: 'Integrate in $y$: $y^2 = y + 2$ at $y = -1, 2$; $\int_{-1}^{2} (y + 2 - y^2)\,dy = \frac{9}{2}$.'
          - problem: 'Find the area of the region enclosed by $x = y^2$ and $x = 2 - y^2$.'
            answer: '$8/3$'
            solution_sketch: '$y^2 = 2 - y^2$ at $y = \pm 1$; $\int_{-1}^{1} (2 - 2y^2)\,dy = 4 - \frac{4}{3} = \frac{8}{3}$.'
          - problem: "A region is enclosed by $x = y^2$ and $x = y + 12$. Find the area of the region as a fraction."
            answer: "343/6"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: find the intersection y-values by setting the x-expressions equal: y^2 = y + 12, so y^2 - y - 12 = 0 and (y - 4)(y + 3) = 0, giving y = -3 and y = 4. Step 2: use the y-integration area rule with the right boundary x = y + 12, so the integral from -3 to 4 of (y + 12 - y^2) dy. An antiderivative is y^2/2 + 12y - y^3/3. Step 3: evaluate it at y = 4 and y = -3 by the Fundamental Theorem of Calculus; the difference is 343/6. The area is 343/6."
          - problem: "A region is enclosed by $x = y^2$ and $x = 8 - y^2$. Find the area of the region as a fraction."
            answer: "64/3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: set the x-expressions equal to find the y-limits: y^2 = 8 - y^2 gives 2y^2 = 8, so y = -2 and y = 2. Step 2: use the y-integration area rule with the right boundary x = 8 - y^2, so the integral from -2 to 2 of (8 - 2y^2) dy. An antiderivative is 8y - 2y^3/3. Step 3: evaluate it at y = 2 and y = -2 by the Fundamental Theorem of Calculus; the difference is 64/3. The area is 64/3."
          - problem: "A region is enclosed by $x = y^2 + 4$ and $x = 2y + 7$. Find the area of the region as a fraction."
            answer: "32/3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: set the x-expressions equal: y^2 + 4 = 2y + 7 becomes y^2 - 2y - 3 = 0, which factors as (y - 3)(y + 1) = 0, so y = -1 and y = 3. Step 2: use the y-integration area rule with the right boundary x = 2y + 7, so the integral from -1 to 3 of (2y + 7 - (y^2 + 4)) dy = the integral from -1 to 3 of (-y^2 + 2y + 3) dy. An antiderivative is -y^3/3 + y^2 + 3y. Step 3: evaluate it at y = 3 and y = -1 by the Fundamental Theorem of Calculus; the value is 32/3. The area is 32/3."
          - problem: "A region is enclosed by $x = y^2 - 2$ and $x = y + 4$. Find the area of the region as a fraction."
            answer: "125/6"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: set the x-expressions equal: y^2 - 2 = y + 4 becomes y^2 - y - 6 = 0, which factors as (y - 3)(y + 2) = 0, so y = -2 and y = 3. Step 2: use the y-integration area rule with the right boundary x = y + 4, so the integral from -2 to 3 of (y + 4 - (y^2 - 2)) dy = the integral from -2 to 3 of (-y^2 + y + 6) dy. An antiderivative is -y^3/3 + y^2/2 + 6y. Step 3: evaluate it at y = 3 and y = -2 by the Fundamental Theorem of Calculus; the difference is 125/6. The area is 125/6."
        constraints: "y-integration regions bounded by parabolas opening sideways and lines; intersections have integer y-coordinates"
    diagnostic_exemplar:
      problem: 'Find the area of the region enclosed by $x = y^2$ and $x = y + 6$.'
      answer: '$125/6$'
      solution_sketch: 'The curves meet at $y = -2$ and $y = 3$; integrating in $y$, $\int_{-2}^{3}(y + 6 - y^2)\,dy = \frac{125}{6}$.'
    anki_seeds:
      - front: "If two curves cross inside the interval, the total area requires..."
        back: "splitting the integral at each crossing and integrating |f - g| piecewise"
        type: basic
      - front: "When is integrating with respect to y the better choice for an area?"
        back: "When the region's boundaries are functions of y (e.g. sideways parabolas) — right curve minus left curve, dy"
        type: basic

  - id: consumer-producer-surplus
    name: Consumer and Producer Surplus
    core: false                # economics application of the definite integral
    difficulty: 0.58
    drill: false
    answer_kind: numeric
    expected_time_secs: 180
    prerequisites:
      - id: area-between-curves-x
        weight: 0.7
        key: true
      - id: definite-integrals-ftc
        weight: 0.5
        key: true
      - id: systems-substitution
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: Consumer surplus at a given price
        key_prerequisites: [area-between-curves-x, definite-integrals-ftc]
        exemplars:
          - problem: 'The demand curve is $p = 50 - q$. At market price $p = 20$, find the consumer surplus.'
            answer: "450"
            solution_sketch: '$q^* = 30$ at $p = 20$. $CS = \int_0^{30} (50 - q - 20)\,dq = 900 - 450 = 450$.'
          - problem: 'The demand curve is $p = 30 - q$. At market price $p = 10$, find the consumer surplus.'
            answer: "200"
            solution_sketch: '$q^* = 20$; $CS = \int_0^{20} (20 - q)\,dq = 400 - 200 = 200$.'
          - problem: "A demand curve is p = 80 - 2q. At market price p = 20, find the consumer surplus."
            answer: "900"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The consumer surplus is the area between demand and price from 0 to q*, where q* solves 80 - 2q = 20, so q* = 30. The integral is from 0 to 30 of (80 - 2q - 20) dq = from 0 to 30 of (60 - 2q) dq. By the Fundamental Theorem of Calculus, evaluate 60q - q^2 at 30 to get 1800 - 900 = 900. The consumer surplus is 900."
          - problem: "The demand curve is p = 40 - q. At market price p = 16, find the consumer surplus."
            answer: "288"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The consumer surplus is the area between demand and price from 0 to q*, where q* solves 40 - q = 16, so q* = 24. The integral is from 0 to 24 of (40 - q - 16) dq = from 0 to 24 of (24 - q) dq. By the Fundamental Theorem of Calculus, evaluate 24q - q^2/2 at 24 to get 576 - 288 = 288. The consumer surplus is 288."
          - problem: "A demand curve is p = 36 - q^2. At market price p = 11, find the consumer surplus as a fraction."
            answer: "250/3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The consumer surplus is the area between demand and price from 0 to q*, where q* solves 36 - q^2 = 11, so q^2 = 25 and q* = 5. The integral is from 0 to 5 of (36 - q^2 - 11) dq = from 0 to 5 of (25 - q^2) dq. By the Fundamental Theorem of Calculus, evaluate 25q - q^3/3 at 5 to get 125 - 125/3 = 250/3. The consumer surplus is 250/3."
          - problem: "The demand curve is p = 64 - q^2. Find the market price p at which the consumer surplus is 144."
            answer: "28"
            answer_contract: {"kind": "exact"}
            solution_sketch: "At a market price p, the quantity is q = sqrt(64 - p) and the consumer surplus is the area integral from 0 to q of (64 - x^2 - p) dx. Since p = 64 - q^2, the integrand becomes q^2 - x^2. By the Fundamental Theorem of Calculus, the integral is q^3 - q^3/3 = 2q^3/3. Set 2q^3/3 = 144, so q^3 = 216 and q = 6. Then p = 64 - 36 = 28. The market price is 28."
        constraints: "linear or quadratic demand with integer intercepts; market quantity solves to an integer"
      - id: kp2
        name: Producer surplus at a given price
        key_prerequisites: [area-between-curves-x, definite-integrals-ftc]
        exemplars:
          - problem: 'The supply curve is $p = 2q$. At market price $p = 20$, find the producer surplus.'
            answer: "100"
            solution_sketch: '$q^* = 10$; $PS = \int_0^{10} (20 - 2q)\,dq = 200 - 100 = 100$.'
          - problem: "The supply curve is p = 4q. At market price p = 24, find the producer surplus."
            answer: "72"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: Solve the supply equation 24 = 4q, so q = 6. Step 2: Apply the area-between-curves formula for producer surplus: integral from 0 to 6 of (24 - 4q) dq. Step 3: Use the Fundamental Theorem of Calculus to get [24q - 2q^2] from 0 to 6 = 144 - 72 = 72. The producer surplus is 72."
          - problem: "The supply curve is p = 3q + 6. At market price p = 30, find the producer surplus."
            answer: "96"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: Solve the supply equation 30 = 3q + 6, so q = 8. Step 2: Apply the area-between-curves formula: integral from 0 to 8 of (30 - (3q + 6)) dq = integral from 0 to 8 of (24 - 3q) dq. Step 3: Use the Fundamental Theorem of Calculus to get [24q - 3q^2/2] from 0 to 8 = 192 - 96 = 96. The producer surplus is 96."
          - problem: "The supply curve is p = q + 5. At market price p = 25, find the producer surplus."
            answer: "200"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: Solve 25 = q + 5, so q = 20. Step 2: Apply the area-between-curves formula: integral from 0 to 20 of (25 - (q + 5)) dq = integral from 0 to 20 of (20 - q) dq. Step 3: Use the Fundamental Theorem of Calculus to get [20q - q^2/2] from 0 to 20 = 400 - 200 = 200. The producer surplus is 200."
          - problem: "The supply curve is p = 2q + 4. The producer surplus at the market price p is 36. Find p."
            answer: "16"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: Let q be the market quantity at price p; solve p = 2q + 4 to get q = (p - 4)/2. Step 2: Apply the area-between-curves formula: producer surplus = integral from 0 to (p - 4)/2 of (p - (2q + 4)) dq. Step 3: Use the Fundamental Theorem of Calculus: the integral equals (p - 4)^2/4. Step 4: Set (p - 4)^2/4 = 36, so (p - 4)^2 = 144. A positive market price gives p = 16."
          - problem: "A supply curve rises from the origin and the market price is horizontal. Which region gives the producer surplus? Select the correct description."
            answer: "area between price and supply"
            answer_contract: {"kind": "label", "options": [["area between price and supply"], ["area below supply only"], ["area above price only"], ["area between demand and supply"]]}
            solution_sketch: "Producer surplus is the area between the horizontal market price line and the supply curve from q = 0 to the market quantity. The option area below supply only is wrong because it ignores the market price line. The option area above price only is wrong because surplus lies below the market price. The option area between demand and supply is wrong because demand is not used for producer surplus. The correct description is area between price and supply."
        constraints: "linear supply through small integer coefficients; one conceptual identification exemplar allowed"
      - id: kp3
        name: Equilibrium, then both surpluses
        key_prerequisites: [systems-substitution, definite-integrals-ftc]
        exemplars:
          - problem: 'With demand $p = 48 - q^2$ and supply $p = 2q^2$ (equilibrium $q^* = 4$, $p^* = 32$), find the producer surplus.'
            answer: '$256/3$'
            solution_sketch: '$PS = \int_0^4 (32 - 2q^2)\,dq = 128 - \frac{128}{3} = \frac{256}{3}$.'
          - problem: "Demand is p = 48 - q^2 and supply is p = 2q^2. Find the equilibrium point as (q, p) and the consumer surplus."
            answer: "eq = (4, 32); CS = 128/3"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"arity": 2, "kind": "coordinates"}, "name": "eq"}, {"contract": {"kind": "exact"}, "name": "CS"}]}
            solution_sketch: "Step 1: set demand equal to supply. 48 - q^2 = 2q^2 gives 3q^2 = 48, so q^2 = 16 and q* = 4. Step 2: substitute q* = 4 into supply to get p* = 2(4)^2 = 32. Step 3: consumer surplus is the integral of demand minus equilibrium price from 0 to q*. The integral from 0 to 4 of (48 - q^2 - 32) dq is the integral from 0 to 4 of (16 - q^2) dq, which equals 16q - q^3/3 from 0 to 4 = 64 - 64/3 = 128/3. The answer is eq = (4, 32); CS = 128/3."
          - problem: "Demand is p = 32 - q^2 and supply is p = q^2. Find the equilibrium point as (q, p)."
            answer: "(4, 16)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "Set demand equal to supply: 32 - q^2 = q^2. Add q^2 to both sides to get 32 = 2q^2, so q^2 = 16 and q* = 4. Substitute q* = 4 into supply: p* = 4^2 = 16. The answer is (4, 16)."
          - problem: "Demand is p = 32 - q^2 and supply is p = q^2, with equilibrium q* = 4 and p* = 16. Find the producer surplus."
            answer: "128/3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The producer surplus is the integral of equilibrium price minus supply from 0 to q*. Here that integral is the integral from 0 to 4 of (16 - q^2) dq. By the Fundamental Theorem of Calculus, 16q - q^3/3 from 0 to 4 equals 64 - 64/3 = 128/3. The answer is 128/3."
          - problem: "Demand is p = 75 - q^2 and supply is p = 2q^2, with equilibrium q* = 5 and p* = 50. Find the consumer surplus."
            answer: "250/3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Consumer surplus is the integral of demand minus equilibrium price from 0 to q*. Here that integral is the integral from 0 to 5 of (75 - q^2 - 50) dq, which simplifies to the integral from 0 to 5 of (25 - q^2) dq. By the Fundamental Theorem of Calculus, 25q - q^3/3 from 0 to 5 equals 125 - 125/3 = 250/3. The answer is 250/3."
          - problem: "Demand is p = 75 - q^2 and supply is p = 2q^2, with equilibrium q* = 5 and p* = 50. Find the producer surplus."
            answer: "500/3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Producer surplus is the integral of equilibrium price minus supply from 0 to q*. Here that integral is the integral from 0 to 5 of (50 - 2q^2) dq. By the Fundamental Theorem of Calculus, 50q - 2q^3/3 from 0 to 5 equals 250 - 250/3 = 500/3. The answer is 500/3."
        constraints: "equilibrium solvable by setting demand = supply and factoring; quantities and prices come out as integers"
    diagnostic_exemplar:
      problem: 'Demand is $p = 27 - q^2$ and supply is $p = 2q^2$. Find the equilibrium point and the consumer surplus.'
      answer: '$q^* = 3$, $p^* = 18$; $CS = 18$'
      answer_contract: {kind: none}
      solution_sketch: '$27 - q^2 = 2q^2$ gives $q^* = 3$ and $p^* = 18$; then $CS = \int_0^3 (27 - q^2)\,dq - 3 \cdot 18 = 72 - 54$.'
    anki_seeds:
      - front: "Consumer surplus formula (demand d(q), market price p*, quantity q*)?"
        back: '$CS = \int_0^{q^*} (d(q) - p^*) \, dq$ — the area between the demand curve and the price line'
        type: basic
      - front: "Producer surplus formula (supply s(q), market price p*, quantity q*)?"
        back: '$PS = \int_0^{q^*} (p^* - s(q)) \, dq$ — the area between the price line and the supply curve'
        type: basic

  - id: volumes-known-cross-sections
    name: Volumes by Known Cross Sections
    core: false                # head of the solids-of-revolution applications branch
    difficulty: 0.58
    drill: false
    answer_kind: expression
    expected_time_secs: 210
    prerequisites:
      - id: definite-integrals-ftc
        weight: 0.7
        key: true
      - id: area-between-curves-x
        weight: 0.5
        key: true
      - id: area-triangles-quadrilaterals
        weight: 0.3
      - id: circle-area-circumference
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: Square cross sections
        key_prerequisites: [definite-integrals-ftc, area-between-curves-x]
        exemplars:
          - problem: 'The base of a solid is the region under $y = \sqrt{x}$ for $0 \le x \le 4$. Cross sections perpendicular to the $x$-axis are squares with side running from the $x$-axis to the curve. Find the volume.'
            answer: "8"
            solution_sketch: 'Side $= \sqrt{x}$, so $A(x) = x$ and $V = \int_0^4 x\,dx = 8$.'
          - problem: 'The base of a solid is the region between $y = 1 - x^2$ and the $x$-axis. Cross sections perpendicular to the $x$-axis are squares. Find the volume.'
            answer: '$16/15$'
            solution_sketch: '$V = \int_{-1}^{1} (1 - x^2)^2\,dx = 2\left(1 - \frac{2}{3} + \frac{1}{5}\right) = \frac{16}{15}$.'
          - problem: "The base of a solid is the region under y = x^2 for 0 <= x <= 3. Cross sections perpendicular to the x-axis are squares with side running from the x-axis to the curve. Find the volume."
            answer: "243/5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The side length of each square is the height of the base region, so s(x) = x^2. Square-area rule: A(x) = (x^2)^2 = x^4. Fundamental Theorem of Calculus: V = ∫_0^3 x^4 dx = [x^5/5]_0^3 = 243/5. The volume is 243/5."
          - problem: "The base of a solid is the region between y = x and y = x^2 for 0 <= x <= 1. Cross sections perpendicular to the x-axis are squares. Find the volume."
            answer: "1/30"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The height of the base region is s(x) = x - x^2 because y = x is above y = x^2 on [0,1]. Square-area rule: A(x) = (x - x^2)^2 = x^2 - 2x^3 + x^4. Fundamental Theorem of Calculus: V = ∫_0^1 (x^2 - 2x^3 + x^4) dx = 1/3 - 1/2 + 1/5 = 1/30. The volume is 1/30."
          - problem: "The base of a solid is the region between y = 3x and y = x^2 for 0 <= x <= 3. Cross sections perpendicular to the x-axis are squares. Find the volume."
            answer: "81/10"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The height of the base region is s(x) = 3x - x^2 because y = 3x is above y = x^2 on [0,3]. Square-area rule: A(x) = (3x - x^2)^2 = 9x^2 - 6x^3 + x^4. Fundamental Theorem of Calculus: V = ∫_0^3 (9x^2 - 6x^3 + x^4) dx = 81 - 243/2 + 243/5 = 81/10. The volume is 81/10."
          - problem: "The base of a solid is the region under y = x^3 for 0 <= x <= 2. Cross sections perpendicular to the x-axis are squares with side running from the x-axis to the curve. Find the volume."
            answer: "128/7"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The side length of each square is the height of the base region, so s(x) = x^3. Square-area rule: A(x) = (x^3)^2 = x^6. Fundamental Theorem of Calculus: V = ∫_0^2 x^6 dx = [x^7/7]_0^2 = 128/7. The volume is 128/7."
        constraints: "side length equals the height of the base region; (side)^2 integrates as a polynomial"
      - id: kp2
        name: Semicircular and triangular cross sections
        key_prerequisites: [circle-area-circumference, area-triangles-quadrilaterals]
        exemplars:
          - problem: 'The base of a solid is the region under $y = \sqrt{x}$ for $0 \le x \le 4$. Cross sections perpendicular to the $x$-axis are semicircles with diameter running from the $x$-axis to the curve. Find the volume.'
            answer: '$\pi$'
            solution_sketch: 'Radius $= \frac{\sqrt{x}}{2}$, area $= \frac{\pi x}{8}$: $V = \frac{\pi}{8}\int_0^4 x\,dx = \pi$.'
          - problem: 'The base of a solid is the region between $y = 1 - x^2$ and the $x$-axis. Cross sections perpendicular to the $x$-axis are equilateral triangles. Find the volume.'
            answer: '$4\sqrt 3/15$'
            solution_sketch: 'Area of an equilateral triangle with side $s$ is $\frac{\sqrt{3}}{4}s^2$: $V = \frac{\sqrt{3}}{4}\int_{-1}^{1}(1 - x^2)^2\,dx = \frac{\sqrt{3}}{4}\cdot\frac{16}{15} = \frac{4\sqrt{3}}{15}$.'
        constraints: "cross-section area = (known shape constant) x (base width)^2; semicircle uses the width as diameter"
      - id: kp3
        name: Cross sections perpendicular to the y-axis
        key_prerequisites: [definite-integrals-ftc, area-between-curves-x]
        exemplars:
          - problem: 'The base of a solid is the region between the $y$-axis and $x = 4 - y^2$ for $-2 \le y \le 2$. Cross sections perpendicular to the $y$-axis are squares. Find the volume.'
            answer: '$512/15$'
            solution_sketch: '$V = \int_{-2}^{2} (4 - y^2)^2\,dy = 2\left(32 - \frac{64}{3} + \frac{32}{5}\right) = \frac{512}{15}$.'
          # The stem said "set up (do not evaluate)" while storing the evaluated value, so a
          # learner who followed the instruction was graded wrong. kp3's own constraints say
          # "evaluate to an exact rational", and an unevaluated integral is unparseable under
          # this topic's `expression` kind — so the instruction was the anomaly, not the answer.
          - problem: 'Find the volume of a solid whose base is the region between $x = y^2$ and $x = 1$, with square cross sections perpendicular to the $y$-axis.'
            answer: '16/15'
            solution_sketch: 'Slice at height $y$: side $= 1 - y^2$, so $A(y) = (1 - y^2)^2$; integrate over $-1 \le y \le 1$.'
          - problem: "The base of a solid is the region between the y-axis and the line x = 3 - y for 0 <= y <= 3. Cross sections perpendicular to the y-axis are isosceles right triangles whose hypotenuse lies in the base. Find the volume as a fraction."
            answer: "9/4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: At height y, the right curve is x = 3 - y and the left curve is the y-axis, so the width is w = 3 - y. Step 2: An isosceles right triangle with hypotenuse w has area w^2/4. Step 3: Integrate (3 - y)^2/4 from y = 0 to y = 3 using the Fundamental Theorem of Calculus. The integral is 9/4, so the volume is 9/4."
          - problem: "The base of a solid is the region between x = y^2 and x = 4 for -2 <= y <= 2. Cross sections perpendicular to the y-axis are rectangles whose height is three times their base width. Find the volume as a fraction."
            answer: "512/5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: The curves x = y^2 and x = 4 meet at y = -2 and y = 2, and the width is w = 4 - y^2. Step 2: The rectangle height is 3w, so its area is 3w^2 = 3(4 - y^2)^2. Step 3: Integrate 3(4 - y^2)^2 from y = -2 to y = 2 using the Fundamental Theorem of Calculus. The integral is 512/5, so the volume is 512/5."
          - problem: "The base of a solid is the region between the y-axis and x = 2 - y for 0 <= y <= 2. Cross sections perpendicular to the y-axis are squares. Find the volume as a fraction."
            answer: "8/3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: At height y, the right curve is x = 2 - y and the left curve is the y-axis, so the width is w = 2 - y. Step 2: A square cross section has area w^2 = (2 - y)^2. Step 3: Integrate (2 - y)^2 from y = 0 to y = 2 using the Fundamental Theorem of Calculus. The integral is 8/3, so the volume is 8/3."
          - problem: "The base of a solid is the region between x = y^2 and x = 2 - y^2 for -1 <= y <= 1. Cross sections perpendicular to the y-axis are squares. Find the volume as a fraction."
            answer: "64/15"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: The curves x = y^2 and x = 2 - y^2 meet at y = -1 and y = 1, and the width is w = (2 - y^2) - y^2 = 2 - 2y^2. Step 2: A square cross section has area w^2 = (2 - 2y^2)^2. Step 3: Integrate (2 - 2y^2)^2 from y = -1 to y = 1 using the Fundamental Theorem of Calculus. The integral is 64/15, so the volume is 64/15."
        constraints: "slices taken in y; width read as right curve minus left curve; evaluate to an exact rational"
    diagnostic_exemplar:
      problem: 'The base of a solid is the region between the $y$-axis and $x = 1 - y^2$ for $-1 \le y \le 1$. Cross sections perpendicular to the $y$-axis are squares. Find the volume.'
      answer: '$16/15$'
      solution_sketch: 'The side at height $y$ is $1 - y^2$, so $V = \int_{-1}^{1}(1 - y^2)^2\,dy = \frac{16}{15}$.'
    anki_seeds:
      - front: "Volume of a solid with cross-sectional area A(x) from a to b?"
        back: '$V = \int_a^b A(x) \, dx$'
        type: basic
      - front: "Semicircular cross section on a diameter of length w: its area?"
        back: '$\frac{\pi w^2}{8}$ (radius $w/2$, half of $\pi r^2$)'
        type: basic

  - id: volumes-disks
    name: Volumes by Disks
    core: false                # solids-of-revolution applications branch
    difficulty: 0.6
    drill: false
    answer_kind: expression
    expected_time_secs: 210
    prerequisites:
      - id: volumes-known-cross-sections
        weight: 0.7
        key: true
      - id: definite-integrals-ftc
        weight: 0.5
        key: true
      - id: circle-area-circumference
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: Disks about the x-axis
        key_prerequisites: [volumes-known-cross-sections, circle-area-circumference]
        exemplars:
          - problem: 'The region under $y = \sqrt{x}$ for $0 \le x \le 4$ is rotated about the $x$-axis. Find the volume.'
            answer: '$8\pi$'
            solution_sketch: '$V = \pi\int_0^4 (\sqrt{x})^2\,dx = \pi\int_0^4 x\,dx = 8\pi$.'
          - problem: 'The region under $y = x^2$ for $0 \le x \le 1$ is rotated about the $x$-axis. Find the volume.'
            answer: '$\pi/5$'
            solution_sketch: '$V = \pi\int_0^1 x^4\,dx = \frac{\pi}{5}$.'
          - problem: 'The region under $y = e^x$ for $0 \le x \le 1$ is rotated about the $x$-axis. Find the volume.'
            answer: '$\pi(e^2 - 1)/2$'
            solution_sketch: '$V = \pi\int_0^1 e^{2x}\,dx = \frac{\pi}{2}(e^2 - 1)$.'
          - problem: "The region under y = 2x for 0 <= x <= 1 is rotated about the x-axis. Find the volume."
            answer: "4pi/3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The disk method gives V = pi times the integral from 0 to 1 of f(x)^2 dx. Here f(x) = 2x, so the squared radius is 4x^2. The antiderivative of 4x^2 is 4x^3/3. Evaluate from 0 to 1: 4/3 - 0 = 4/3. Multiply by pi: the volume is 4pi/3."
          - problem: "The region under y = x^2 + 1 for 0 <= x <= 1 is rotated about the x-axis. Find the volume."
            answer: "28pi/15"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The disk method gives V = pi times the integral from 0 to 1 of (x^2 + 1)^2 dx. Expand the square: x^4 + 2x^2 + 1. Integrate term by term: x^5/5 + 2x^3/3 + x. Evaluate from 0 to 1: 1/5 + 2/3 + 1 = 28/15. Multiply by pi: the volume is 28pi/15."
          - problem: "The region under y = e^x for 0 <= x <= 2 is rotated about the x-axis. Find the volume."
            answer: "pi(e^4-1)/2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The disk method gives V = pi times the integral from 0 to 2 of (e^x)^2 dx = e^(2x) dx. The antiderivative of e^(2x) is e^(2x)/2. Evaluate from 0 to 2: (e^4/2) - (1/2) = (e^4 - 1)/2. Multiply by pi: the volume is pi(e^4-1)/2."
        constraints: "region under a single curve down to the axis of rotation; radius^2 integrates as a polynomial or e^{2x}"
      - id: kp2
        name: Disks about the y-axis
        key_prerequisites: [volumes-known-cross-sections, definite-integrals-ftc]
        exemplars:
          - problem: 'The region bounded by $y = x^2$, $y = 1$, and $x = 0$ (with $x \ge 0$) is rotated about the $y$-axis. Find the volume.'
            answer: '$\pi/2$'
            solution_sketch: 'Slice horizontally: radius $x = \sqrt{y}$, so $V = \pi\int_0^1 y\,dy = \frac{\pi}{2}$.'
          - problem: 'The region bounded by $y = x^3$, $y = 8$, and $x = 0$ (with $x \ge 0$) is rotated about the $y$-axis. Find the volume.'
            answer: '$96\pi/5$'
            solution_sketch: 'Radius $x = y^{1/3}$: $V = \pi\int_0^8 y^{2/3}\,dy = \pi\cdot\frac{3}{5}\cdot 32 = \frac{96\pi}{5}$.'
          - problem: "The region bounded by $y = x^2 + 1$, $y = 6$, and $x = 0$ (with $x \\ge 0$) is rotated about the $y$-axis. Find the volume."
            answer: "25pi/2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Disk method: $V = \\pi \\int_1^6 x^2\\,dy$. Invert the curve: $x = \\sqrt{y - 1}$, so $V = \\pi \\int_1^6 (y - 1)\\,dy$. By the FTC, $\\pi \\left[\\frac{(y-1)^2}{2}\\right]_1^6 = \\frac{25\\pi}{2}$. The volume is 25pi/2."
          - problem: "The region bounded by $y = \\sqrt{x}$, $y = 2$, and $x = 0$ is rotated about the $y$-axis. Find the volume."
            answer: "32pi/5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Disk method: $V = \\pi \\int_0^2 x^2\\,dy$. Invert the curve: $x = y^2$, so $V = \\pi \\int_0^2 y^4\\,dy$. By the FTC, $\\pi \\left[\\frac{y^5}{5}\\right]_0^2 = \\frac{32\\pi}{5}$. The volume is 32pi/5."
          - problem: "The region bounded by $y = 2x + 2$, $y = 6$, and $x = 0$ is rotated about the $y$-axis. Find the volume."
            answer: "16pi/3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Disk method: $V = \\pi \\int_2^6 x^2\\,dy$. Invert the curve: $x = \\frac{y - 2}{2}$, so $V = \\pi \\int_2^6 \\frac{(y - 2)^2}{4}\\,dy$. By the FTC, $\\pi \\left[\\frac{(y-2)^3}{12}\\right]_2^6 = \\frac{64\\pi}{12} = \\frac{16\\pi}{3}$. The volume is 16pi/3."
          - problem: "The region in the first quadrant bounded by $y = 4 - x$, $x = 0$, and $y = 0$ is rotated about the $y$-axis. Find the volume."
            answer: "64pi/3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Disk method: $V = \\pi \\int_0^4 x^2\\,dy$. Invert the curve: $x = 4 - y$, so $V = \\pi \\int_0^4 (4 - y)^2\\,dy$. By the FTC, $\\pi \\left[-\\frac{(4-y)^3}{3}\\right]_0^4 = \\frac{64\\pi}{3}$. The volume is 64pi/3."
        constraints: "invert the curve to x as a function of y; y-bounds are small integers"
      - id: kp3
        name: Checking against known solids
        key_prerequisites: [volumes-known-cross-sections, circle-area-circumference]
        exemplars:
          - problem: 'Rotate $y = \sqrt{9 - x^2}$ about the $x$-axis and verify the sphere volume formula for radius $3$.'
            answer: '$36\pi$'
            solution_sketch: '$V = \pi\int_{-3}^{3} (9 - x^2)\,dx = \pi(54 - 18) = 36\pi = \frac{4}{3}\pi(3)^3$.'
          - problem: 'Rotate $y = \frac{r}{h}x$ for $0 \le x \le h$ about the $x$-axis and derive the cone volume formula.'
            answer: '$\pi r^2 h/3$'
            solution_sketch: '$V = \pi\int_0^h \frac{r^2}{h^2}x^2\,dx = \pi\frac{r^2}{h^2}\cdot\frac{h^3}{3} = \frac{\pi r^2 h}{3}$.'
          - problem: "The curve y = sqrt(25 - x^2) is rotated about the x-axis. Use the disk method and compare the result with the sphere volume formula. Find the volume of the solid."
            answer: "500pi/3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "For radius 5 the sphere formula gives V = (4/3)pi(5^3) = 500pi/3. The disk method gives V = pi integral from -5 to 5 of (25 - x^2) dx = pi(250 - 250/3) = 500pi/3. The volume is 500pi/3."
          - problem: "The line y = (4/9)x for 0 <= x <= 9 is rotated about the x-axis. Use the disk method and compare the result with the cone volume formula. Find the volume of the cone."
            answer: "48pi"
            answer_contract: {"kind": "exact"}
            solution_sketch: "For radius 4 and height 9 the cone formula gives V = pi(4^2)(9)/3 = 48pi. The disk method gives V = pi integral from 0 to 9 of (16/81)x^2 dx = pi(16/81)(729/3) = 48pi. The volume is 48pi."
          - problem: "A sphere has volume 36pi. Use the sphere volume formula from the disk method check. Find its radius."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The sphere formula is V = (4/3)pi r^3. Set (4/3)pi r^3 = 36pi, which gives r^3 = 27. Therefore r = 3."
          - problem: "A cone has volume 12pi and radius 3. Use the cone volume formula from the disk method check. Find its height."
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The cone formula is V = pi r^2 h/3. Substitute the known values: 12pi = pi(3^2)h/3 = 3pi h. Thus h = 4."
        constraints: "sphere and cone derivations only; answers must match the geometry formulas"
    diagnostic_exemplar:
      problem: 'The region bounded by $y = x^2$, $y = 4$, and $x = 0$ (with $x \ge 0$) is rotated about the $y$-axis. Find the volume.'
      answer: '$8\pi$'
      solution_sketch: 'Invert to $x^2 = y$ and stack disks in $y$: $V = \pi\int_0^4 y\,dy = 8\pi$.'
    anki_seeds:
      - front: "Disk method volume formula about the x-axis?"
        back: '$V = \pi \int_a^b f(x)^2 \, dx$ (each slice is a disk of radius f(x))'
        type: basic
      - front: "Disk method about the y-axis: what must you do to the curve first?"
        back: "Solve for x as a function of y; then V = pi times the integral of x(y)^2 dy"
        type: basic

  - id: volumes-disks-washers
    name: Volumes by Disks and Washers
    core: false                # solids-of-revolution applications branch
    difficulty: 0.62
    drill: false
    answer_kind: expression
    expected_time_secs: 240
    prerequisites:
      - id: volumes-disks
        weight: 0.8
        key: true
      - id: area-between-curves
        weight: 0.6
        key: true
      - id: definite-integrals-ftc
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: Washers about the x-axis
        key_prerequisites: [volumes-disks, area-between-curves]
        exemplars:
          - problem: 'The region between $y = x$ and $y = x^2$ is rotated about the $x$-axis. Find the volume.'
            answer: '$2\pi/15$'
            solution_sketch: '$V = \pi\int_0^1 (x^2 - x^4)\,dx = \pi(\frac{1}{3} - \frac{1}{5}) = \frac{2\pi}{15}$.'
          - problem: 'The region between $y = \sqrt{x}$ and $y = x$ is rotated about the $x$-axis. Find the volume.'
            answer: '$\pi/6$'
            solution_sketch: 'Outer radius $\sqrt{x}$, inner $x$: $V = \pi\int_0^1 (x - x^2)\,dx = \frac{\pi}{6}$.'
          - problem: "The region between $y = x$ and $y = x^4$ is rotated about the $x$-axis. Find the volume."
            answer: "2pi/9"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The volume is V = pi times the integral from 0 to 1 of (x^2 - x^8) dx. Step 1: the washer rule uses outer radius x and inner radius x^4, since x is larger on (0, 1). Step 2: integrate term by term to get pi times (1/3 - 1/9) = pi times 2/9. The volume is 2pi/9."
          - problem: "The region between $y = \\sqrt{x}$ and $y = x^2$ is rotated about the $x$-axis. Find the volume."
            answer: "3pi/10"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The volume is V = pi times the integral from 0 to 1 of (x - x^4) dx. Step 1: the washer rule gives outer radius sqrt(x) and inner radius x^2. Step 2: evaluate the integral as pi times (1/2 - 1/5). The volume is 3pi/10."
          - problem: "The region between $y = 2x$ and $y = x^2$ is rotated about the $x$-axis. Find the volume."
            answer: "64pi/15"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The volume is V = pi times the integral from 0 to 2 of (4x^2 - x^4) dx. Step 1: the washer rule uses outer radius 2x and inner radius x^2, with the curves meeting at x = 0 and x = 2. Step 2: integrate to get pi times (32/3 - 32/5). The volume is 64pi/15."
          - problem: "The region between $y = 4$ and $y = x^2$ is rotated about the $x$-axis. Find the volume."
            answer: "256pi/5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The volume is V = pi times the integral from -2 to 2 of (16 - x^4) dx. Step 1: the washer rule uses outer radius 4 and inner radius x^2, and the curves meet at x = -2 and x = 2. Step 2: integrate to get pi times (64 - 64/5). The volume is 256pi/5."
        constraints: "curves intersect at x = 0 and x = 1 (or other integer bounds); subtract squared radii, never square the difference"
      - id: kp2
        name: Washers about the y-axis
        key_prerequisites: [volumes-disks, area-between-curves]
        exemplars:
          - problem: 'The region between $y = x^2$ and $y = \sqrt{x}$ is rotated about the $y$-axis. Find the volume.'
            answer: '$3\pi/10$'
            solution_sketch: 'At height $y$: outer $x = \sqrt{y}$, inner $x = y^2$. $V = \pi\int_0^1 (y - y^4)\,dy = \pi(\frac{1}{2} - \frac{1}{5}) = \frac{3\pi}{10}$.'
          - problem: 'The region between $y = \sqrt{x}$ and $y = \frac{x}{2}$ is rotated about the $y$-axis. Find the volume.'
            answer: '$64\pi/15$'
            solution_sketch: 'For $0 \le y \le 2$: outer $x = 2y$, inner $x = y^2$. $V = \pi\int_0^2 (4y^2 - y^4)\,dy = \pi(\frac{32}{3} - \frac{32}{5}) = \frac{64\pi}{15}$.'
          - problem: "The region between y = x^2 and y = 2x is rotated about the y-axis. Find the exact volume."
            answer: "8pi/3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: Solve y = 2x for x = y/2 and y = x^2 for x = sqrt(y). Step 2: The intersections are y = 0 and y = 4, so the washer integral is pi times the integral from 0 to 4 of (y - y^2/4) dy. Step 3: Integrate: pi [y^2/2 - y^3/12] from 0 to 4 = pi(8 - 16/3) = 8pi/3. The volume is 8pi/3."
          - problem: "The region between y = x^3 and y = x for 0 <= x <= 1 is rotated about the y-axis. Find the exact volume."
            answer: "4pi/15"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: Solve y = x for x = y and y = x^3 for x = y^(1/3). Step 2: The intersections are y = 0 and y = 1; at height y the outer radius is y^(1/3) and the inner radius is y. Step 3: The washer integral is pi times the integral from 0 to 1 of (y^(2/3) - y^2) dy = pi(3/5 - 1/3) = 4pi/15. The volume is 4pi/15."
          - problem: "The region between y = x^2 and y = 3x is rotated about the y-axis. Find the exact volume."
            answer: "27pi/2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: Solve y = 3x for x = y/3 and y = x^2 for x = sqrt(y). Step 2: The intersections are y = 0 and y = 9; the washer integral is pi times the integral from 0 to 9 of (y - y^2/9) dy. Step 3: Integrate: pi [y^2/2 - y^3/27] from 0 to 9 = pi(81/2 - 27) = 27pi/2. The volume is 27pi/2."
          - problem: "The region between y = x^2 and y = x^(1/3) for 0 <= x <= 1 is rotated about the y-axis. Find the exact volume."
            answer: "5pi/14"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: Solve y = x^2 for x = sqrt(y) and y = x^(1/3) for x = y^3. Step 2: The intersections are y = 0 and y = 1; at height y the outer radius is sqrt(y) and the inner radius is y^3. Step 3: The washer integral is pi times the integral from 0 to 1 of (y - y^6) dy = pi(1/2 - 1/7) = 5pi/14. The volume is 5pi/14."
        constraints: "invert both curves to x as functions of y; intersections at integer y-values"
      - id: kp3
        name: Rotation about other horizontal lines
        key_prerequisites: [volumes-disks, area-between-curves]
        exemplars:
          - problem: 'The region between $y = \sqrt{x}$ and $y = 1$ for $0 \le x \le 1$ is rotated about the line $y = 1$. Find the volume.'
            answer: '$\pi/6$'
            solution_sketch: 'Radius $= 1 - \sqrt{x}$: $V = \pi\int_0^1 (1 - \sqrt{x})^2\,dx = \pi\int_0^1 (1 - 2\sqrt{x} + x)\,dx = \pi(1 - \frac{4}{3} + \frac{1}{2}) = \frac{\pi}{6}$.'
          - problem: 'The region between $y = x^2$ and $y = 1$ is rotated about the line $y = 1$. Find the volume.'
            answer: '$16\pi/15$'
            solution_sketch: 'Radius $= 1 - x^2$: $V = \pi\int_{-1}^{1} (1 - x^2)^2\,dx = \frac{16\pi}{15}$.'
          - problem: "The region between y = x^3 and y = 1 for 0 <= x <= 1 is rotated about the line y = 1. Find the volume."
            answer: "9pi/14"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The axis y = 1 is the upper boundary, so the radius is 1 - x^3. By the disk method, V = pi times the integral from 0 to 1 of (1 - x^3)^2 dx. Expand the square: 1 - 2x^3 + x^6. Integrate term by term: 1 - 1/2 + 1/7 = 9/14. The volume is 9pi/14."
          - problem: "The region between y = x and y = x^2 for 0 <= x <= 1 is rotated about the line y = 0. Find the volume."
            answer: "2pi/15"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The axis y = 0 is the lower boundary; the outer radius is x and the inner radius is x^2. By the washer method, V = pi times the integral from 0 to 1 of (x^2 - x^4) dx. An antiderivative is x^3/3 - x^5/5. Evaluate at 1 and 0: 1/3 - 1/5 = 2/15. The volume is 2pi/15."
          - problem: "Let R be the region bounded by y = x^2 - 4 and the x-axis. R is rotated about the line y = -4. Compute the volume."
            answer: "256pi/5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The axis y = -4 is tangent to the parabola at its vertex, so every radius is nonnegative. Washer method: the outer radius is 0 - (-4) = 4 and the inner radius is (x^2 - 4) - (-4) = x^2, with x running from -2 to 2 where the curves meet. Then V = pi times the integral from -2 to 2 of (16 - x^4) dx; an antiderivative is 16x - x^5/5, which evaluates to 64 - 64/5 = 256/5. The volume is 256pi/5."
          - problem: "The region between y = x^2 and y = 2 is rotated about the line y = 2. Find the volume."
            answer: "64pi sqrt(2)/15"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The axis y = 2 is the upper boundary, so the radius is 2 - x^2. The curves y = x^2 and y = 2 meet at x = -sqrt(2) and x = sqrt(2). By the disk method, V = pi times the integral from -sqrt(2) to sqrt(2) of (2 - x^2)^2 dx. Expand and integrate: the value is 64sqrt(2)/15. The volume is 64pi sqrt(2)/15."
        constraints: "axis is a line y = c tangent to the region boundary; radii stay nonnegative"
    diagnostic_exemplar:
      problem: 'The region between $y = \sqrt{x}$ and $y = x$ is rotated about the line $y = -1$. Find the volume.'
      answer: '$\pi/2$'
      solution_sketch: 'Radii measured from $y = -1$: $R = \sqrt x + 1$, $r = x + 1$, so $V = \pi\int_0^1 (2\sqrt x - x - x^2)\,dx = \frac{\pi}{2}$.'
    anki_seeds:
      - front: "Washer method volume formula about the x-axis?"
        back: '$V = \pi \int_a^b \left(R(x)^2 - r(x)^2\right) dx$ (outer radius squared minus inner radius squared)'
        type: basic
      - front: "Classic washer error: pi times the integral of (R - r)^2 is wrong because..."
        back: '$(R - r)^2 \neq R^2 - r^2$; square each radius separately, then subtract'
        type: basic

  - id: volumes-shells-y-axis
    name: Cylindrical Shells About the y-Axis
    core: false                # solids-of-revolution applications branch
    difficulty: 0.64
    drill: false
    answer_kind: expression
    expected_time_secs: 210
    prerequisites:
      - id: volumes-disks-washers
        weight: 0.7
        key: true
      - id: definite-integrals-ftc
        weight: 0.5
      - id: circle-area-circumference
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: The shell formula
        key_prerequisites: [volumes-disks-washers, circle-area-circumference]
        exemplars:
          - problem: 'The region under $y = x^2$ for $0 \le x \le 1$ is rotated about the $y$-axis. Find the volume by shells.'
            answer: '$\pi/2$'
            solution_sketch: '$V = 2\pi\int_0^1 x \cdot x^2\,dx = 2\pi \cdot \frac{1}{4} = \frac{\pi}{2}$.'
          - problem: 'The region under $y = 2$ for $0 \le x \le 1$ is rotated about the $y$-axis. Compute the shell integral and check it against the cylinder volume.'
            answer: '$2\pi$'
            solution_sketch: '$V = 2\pi\int_0^1 2x\,dx = 2\pi$; a cylinder of radius $1$ and height $2$ has volume $\pi(1)^2(2) = 2\pi$.'
          - problem: "Let R be the region under y = x from x = 0 to x = 3. Rotate R about the y-axis. Use cylindrical shells to compute the volume. Give the exact answer in terms of pi."
            answer: "18pi"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Set up the shell formula: V = 2pi times the integral from 0 to 3 of x times x dx. The radius is x and the height is x, so the product is x^2. Integrate x^2 from 0 to 3 to get 9 by the power rule and FTC. Multiply by 2pi: V = 18pi. The volume is 18pi."
          - problem: "Let R be the region under y = 1/x from x = 1 to x = 3. Rotate R about the y-axis. Use cylindrical shells to compute the volume. Give the exact answer in terms of pi."
            answer: "4pi"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Set up shells: V = 2pi times the integral from 1 to 3 of x times (1/x) dx. The radius is x and the height is 1/x, so the product simplifies to 1. The integral of 1 from 1 to 3 is 2 by the FTC. Multiply by 2pi: V = 4pi. The volume is 4pi."
          - problem: "Let R be the triangular region with vertices (0, 0), (2, 0), and (0, 2). Rotate R about the y-axis. Use cylindrical shells to compute the volume. Give the exact answer in terms of pi."
            answer: "8pi/3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Set up the shell integral: V = 2pi times the integral from 0 to 2 of x times (2 - x) dx. Expand the integrand to 2x - x^2. Integrate term by term from 0 to 2 to get 4 - 8/3 = 4/3 by the power rule and FTC. Multiply by 2pi: V = 8pi/3. The volume is 8pi/3."
          - problem: "Let R be the region under y = 1 - x from x = 0 to x = 1. Rotate R about the y-axis. Use cylindrical shells to compute the volume. Give the exact answer in terms of pi."
            answer: "pi/3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Set up shells: V = 2pi times the integral from 0 to 1 of x times (1 - x) dx. Expand the integrand to x - x^2. Integrate from 0 to 1 to get 1/2 - 1/3 = 1/6 by the power rule and FTC. Multiply by 2pi: V = pi/3. The volume is pi/3."
        constraints: "shell radius x, height = curve; one verification against an elementary solid"
      - id: kp2
        name: Shells with power-function heights
        key_prerequisites: [volumes-disks-washers, definite-integrals-ftc]
        exemplars:
          - problem: 'The region under $y = \sqrt{x}$ for $0 \le x \le 1$ is rotated about the $y$-axis. Find the volume by shells.'
            answer: '$4\pi/5$'
            solution_sketch: '$V = 2\pi\int_0^1 x\sqrt{x}\,dx = 2\pi\int_0^1 x^{3/2}\,dx = 2\pi \cdot \frac{2}{5} = \frac{4\pi}{5}$.'
          - problem: 'The region under $y = 2x - x^2$ for $0 \le x \le 2$ is rotated about the $y$-axis. Find the volume.'
            answer: '$8\pi/3$'
            solution_sketch: '$V = 2\pi\int_0^2 x(2x - x^2)\,dx = 2\pi[\frac{2x^3}{3} - \frac{x^4}{4}]_0^2 = 2\pi(\frac{16}{3} - 4) = \frac{8\pi}{3}$.'
          - problem: 'The region under $y = \frac{1}{x}$ for $1 \le x \le 2$ is rotated about the $y$-axis. Find the volume by shells.'
            answer: '$2\pi$'
            solution_sketch: '$V = 2\pi\int_1^2 x \cdot \frac{1}{x}\,dx = 2\pi\int_1^2 dx = 2\pi$.'
          - problem: "The region under $y = x^3$ for $0 \\le x \\le 2$ is rotated about the $y$-axis. Find the volume by shells."
            answer: "64pi/5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The shell volume is V = 2pi times the integral from 0 to 2 of x times x^3 dx. The integrand x^4 integrates by the power rule to x^5/5. Evaluating at 2 and 0 gives 32/5. Multiplying by 2pi gives 64pi/5."
          - problem: "The region under $y = x^2$ for $0 \\le x \\le 3$ is rotated about the $y$-axis. Find the volume by shells."
            answer: "81pi/2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The shell volume is V = 2pi times the integral from 0 to 3 of x times x^2 dx. The integrand x^3 integrates by the power rule to x^4/4. Evaluating from 0 to 3 gives 81/4. Multiplying by 2pi gives 81pi/2."
          - problem: "The region between $y = x$ and $y = x^2$ for $0 \\le x \\le 1$ is rotated about the $y$-axis. Find the volume by shells."
            answer: "pi/6"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The shell volume is V = 2pi times the integral from 0 to 1 of x times (x - x^2) dx. The integrand x^2 - x^3 integrates by the power rule to x^3/3 - x^4/4. Evaluating from 0 to 1 gives 1/3 - 1/4, which is 1/12. Multiplying by 2pi gives pi/6."
        constraints: "integrand x f(x) stays a polynomial or a single power; bounds are small integers"
    diagnostic_exemplar:
      problem: 'The region under $y = \sqrt{x}$ for $0 \le x \le 4$ is rotated about the $y$-axis. Find the volume by shells.'
      answer: '$128\pi/5$'
      solution_sketch: '$V = 2\pi\int_0^4 x\sqrt x\,dx = 2\pi \cdot \frac{2}{5}\cdot 32$.'
    anki_seeds:
      - front: "Shell method volume formula about the y-axis?"
        back: '$V = 2\pi \int_a^b x \, f(x) \, dx$ (radius times height)'
        type: basic
      - front: "Where does the shell factor 2 pi x come from?"
        back: 'Unrolling a thin cylindrical shell of radius $x$ gives a slab of length $2\pi x$ (the circumference), height $f(x)$, thickness $dx$.'
        type: basic

  - id: volumes-cylindrical-shells
    name: Volumes by Cylindrical Shells
    core: false                # solids-of-revolution applications branch
    difficulty: 0.68
    drill: false
    answer_kind: expression
    expected_time_secs: 240
    prerequisites:
      - id: volumes-shells-y-axis
        weight: 0.8
        key: true
      - id: area-between-curves
        weight: 0.5
      - id: volumes-disks-washers
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: Shells with height between two curves
        key_prerequisites: [volumes-shells-y-axis, area-between-curves]
        exemplars:
          - problem: 'The region between $y = x$ and $y = x^2$ is rotated about the $y$-axis. Find the volume.'
            answer: '$\pi/6$'
            solution_sketch: '$V = 2\pi\int_0^1 x(x - x^2)\,dx = 2\pi(\frac{1}{3} - \frac{1}{4}) = \frac{\pi}{6}$.'
          - problem: 'The region between $y = \sqrt{x}$ and $y = x$ is rotated about the $y$-axis. Find the volume.'
            answer: '$2\pi/15$'
            solution_sketch: '$V = 2\pi\int_0^1 x(\sqrt{x} - x)\,dx = 2\pi\left(\frac{2}{5} - \frac{1}{3}\right) = \frac{2\pi}{15}$.'
          - problem: "The region bounded by y = x and y = x^3 is rotated about the y-axis. Find the volume."
            answer: "4pi/15"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Use the shell method formula V = 2pi times the integral from 0 to 1 of x times (top minus bottom) dx. The top curve is y = x and the bottom curve is y = x^3, so V = 2pi times the integral from 0 to 1 of x(x - x^3) dx. Integrate: 2pi(1/3 - 1/5) = 2pi(2/15) = 4pi/15. The volume is 4pi/15."
          - problem: "A solid is generated by rotating the region between y = x^2 and y = x^3 about the y-axis. Compute its volume."
            answer: "pi/10"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Use the shell method formula V = 2pi times the integral from 0 to 1 of x times (top minus bottom) dx. Here the top curve is y = x^2 and the bottom curve is y = x^3, so V = 2pi times the integral from 0 to 1 of x(x^2 - x^3) dx. Integrate: 2pi(1/4 - 1/5) = 2pi(1/20) = pi/10. The volume is pi/10."
          - problem: "Rotate the region enclosed by y = sqrt(x) and y = x^2 about the y-axis. Give the exact volume of the solid."
            answer: "3pi/10"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Use the shell method formula V = 2pi times the integral from 0 to 1 of x times (top minus bottom) dx. The top curve is y = sqrt(x) and the bottom curve is y = x^2, so V = 2pi times the integral from 0 to 1 of x(sqrt(x) - x^2) dx. Integrate: 2pi(2/5 - 1/4) = 2pi(3/20) = 3pi/10. The volume is 3pi/10."
          - problem: "The region between y = x^3 and y = x^4 is revolved about the y-axis. Determine the volume of the resulting solid."
            answer: "pi/15"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Use the shell method formula V = 2pi times the integral from 0 to 1 of x times (top minus bottom) dx. The top curve is y = x^3 and the bottom curve is y = x^4, so V = 2pi times the integral from 0 to 1 of x(x^3 - x^4) dx. Integrate: 2pi(1/5 - 1/6) = 2pi(1/30) = pi/15. The volume is pi/15."
        constraints: "curves intersect at x = 0 and x = 1; height = top minus bottom"
      - id: kp2
        name: Shells about other vertical lines
        key_prerequisites: [volumes-shells-y-axis]
        exemplars:
          - problem: 'The region under $y = x^2$ for $0 \le x \le 1$ is rotated about the line $x = 2$. Find the volume.'
            answer: '$5\pi/6$'
            solution_sketch: 'Shell radius $2 - x$: $V = 2\pi\int_0^1 (2 - x)x^2\,dx = 2\pi(\frac{2}{3} - \frac{1}{4}) = \frac{5\pi}{6}$.'
          - problem: 'The region between $y = x$ and $y = x^2$ is rotated about the line $x = -1$. Find the volume.'
            answer: '$\pi/2$'
            solution_sketch: 'Shell radius $x + 1$: $V = 2\pi\int_0^1 (x + 1)(x - x^2)\,dx = 2\pi\int_0^1 (x - x^3)\,dx = 2\pi\cdot\frac{1}{4} = \frac{\pi}{2}$.'
          - problem: "The region under $y = x^2$ for $0 \\le x \\le 1$ is rotated about the line $x = 3$. Find the volume."
            answer: "3pi/2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Use cylindrical shells about the vertical line x = 3. The shell radius is 3 - x and the shell height is x^2, so V = 2pi times the integral from 0 to 1 of (3 - x)x^2 dx. Evaluate the integral: 2pi(1 - 1/4) = 3pi/2. The volume is 3pi/2."
          - problem: "The region under $y = \\sqrt{x}$ for $0 \\le x \\le 4$ is rotated about the line $x = 5$. Find the volume."
            answer: "416pi/15"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Use cylindrical shells about the vertical line x = 5, which lies to the right of the region, so the radius is 5 - x and the height is sqrt(x). Then V = 2pi times the integral from 0 to 4 of (5 - x)sqrt(x) dx. By the power rule for integration, the integral is 5 times (2/3) times 8 minus (2/5) times 32, which is 80/3 - 64/5 = 208/15. Multiplying by 2pi gives the volume 416pi/15."
          - problem: "The region between $y = x^2$ and $y = x^3$ is rotated about the line $x = -2$. Find the volume."
            answer: "13pi/30"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Use cylindrical shells about the vertical line x = -2, which lies to the left of the region, so the radius is x + 2 and the shell height is x^2 - x^3. Then V = 2pi times the integral from 0 to 1 of (x + 2)(x^2 - x^3) dx. Expand the integrand and integrate: 2pi(2/3 - 1/4 - 1/5) = 2pi times 13/30 = 13pi/30. The volume is 13pi/30."
          - problem: "The region under $y = x$ for $0 \\le x \\le 1$ is rotated about the line $x = c$ with $c > 1$, and the volume is $4\\pi/3$. Find the value of $c$."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Use cylindrical shells about the vertical line x = c. The shell radius is c - x and the shell height is x, so V = 2pi times the integral from 0 to 1 of (c - x)x dx = 2pi(c/2 - 1/3). Set this equal to 4pi/3 and solve: pi c - 2pi/3 = 4pi/3, so c = 2. The value is 2."
        constraints: "axis x = c with c outside the region; radius written as (c - x) or (x - c) to stay positive"
      - id: kp3
        name: Choosing shells versus washers
        key_prerequisites: [volumes-shells-y-axis, volumes-disks-washers]
        exemplars:
          - problem: 'The region under $y = \sin(x^2)$, $0 \le x \le \sqrt{\pi}$, is rotated about the $y$-axis. Give the exact volume.'
            answer: '2*pi'
            solution_sketch: 'Shells avoid inverting $\sin(x^2)$: $V = 2\pi\int_0^{\sqrt{\pi}} x\sin(x^2)\,dx$; with $u = x^2$ this is $\pi\int_0^{\pi} \sin u\,du = 2\pi$.'
          - problem: "The region between y = x and y = x^2 is rotated about the x-axis. Find the exact volume of the solid."
            answer: "2*pi/15"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The curves meet where x = x^2, so the limits are x = 0 and x = 1. Use washers about the x-axis with outer radius x and inner radius x^2. The volume is pi times the integral from 0 to 1 of (x^2 - x^4) dx. Evaluate pi(1/3 - 1/5) = 2pi/15. The volume is 2*pi/15."
          - problem: "The region under y = sqrt(x) for 0 <= x <= 4 is rotated about the y-axis. Find the exact volume of the solid."
            answer: "128*pi/5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full object is the region under y = sqrt(x) on 0 <= x <= 4, rotated about the y-axis. Use shells with radius x and height sqrt(x). The volume is 2pi times the integral from 0 to 4 of x^(3/2) dx. Evaluate 2pi times (2/5)x^(5/2) from 0 to 4, which gives 2pi times 64/5. The volume is 128*pi/5."
          - problem: "The region bounded by y = x^3, y = 0, and x = 2 is rotated about the y-axis. Find the exact volume of the solid."
            answer: "64*pi/5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full object is the region bounded by y = x^3, y = 0, and x = 2, rotated about the y-axis. The boundary y = 0 meets y = x^3 at x = 0, so the region runs from x = 0 to x = 2. Shells about the y-axis keep the curve in the form y = x^3, while washers would need the inverse x = y^(1/3). The rule for shells gives V = 2pi times the integral from 0 to 2 of x times x^3 dx. Integrate x^4 to get x^5/5 and evaluate 2pi times 32/5, so the volume is 64*pi/5."
          - problem: "The region between y = x^2 and y = 4 is rotated about the x-axis. Find the exact volume of the solid."
            answer: "256*pi/5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The curve y = x^2 meets y = 4 at x = -2 and x = 2. Use washers about the x-axis with outer radius 4 and inner radius x^2. The volume is pi times the integral from -2 to 2 of (16 - x^4) dx. Evaluate pi(256/5). The volume is 256*pi/5."
          - problem: "The region under y = 1/(1+x^2), 0 <= x <= 1, is rotated about the y-axis. Select the method that avoids solving the curve for x."
            answer: "shells"
            answer_contract: {"kind": "label", "options": [["shells"], ["washers"], ["disks"], ["slices"]]}
            solution_sketch: "The full object is the region under y = 1/(1+x^2) on 0 <= x <= 1 rotated about the y-axis. Shells use vertical slices with radius x and height 1/(1+x^2), so the curve stays in the form y = f(x). The option washers would need x = sqrt(1/y - 1), which is a harder inverse. The option disks also uses horizontal slices and that same inverse. The option slices does not select a specific volume method and still needs a horizontal representation. The correct choice is shells."
        constraints: "one computational and one purely strategic exemplar; the named method must genuinely be simpler"
    diagnostic_exemplar:
      problem: 'The region between $y = 2x$ and $y = x^2$ is rotated about the line $x = -1$. Find the volume.'
      answer: '$16\pi/3$'
      solution_sketch: 'Shell radius $x + 1$, height $2x - x^2$, over $0 \le x \le 2$: $V = 2\pi\int_0^2 (x+1)(2x - x^2)\,dx = \frac{16\pi}{3}$.'
    anki_seeds:
      - front: "Choose shells over washers when..."
        back: "the slice parallel to the axis of rotation is simpler — typically rotating about a vertical axis with y = f(x) hard to invert"
        type: basic
      - front: "Shell radius when rotating about the line x = c (region to the left of c)?"
        back: '$c - x$'
        type: basic

