    knowledge_points:
      - id: kp1
        name: General exponential bases
        key_prerequisites: [derivatives-natural-exp]
        exemplars:
          - problem: 'Differentiate $f(x) = 2^x$.'
            answer: "2^x ln 2"
            solution_sketch: '$2^x = e^{x \ln 2}$, so the derivative is $e^{x \ln 2} \cdot \ln 2$.'
          - problem: 'Differentiate $f(x) = 10^x$.'
            answer: "10^x ln 10"
          - problem: 'Differentiate $f(x) = 3^{2x}$.'
            answer: "(2 ln 3) 3^(2x)"
            solution_sketch: 'Chain rule on $e^{2x \ln 3}$: the factor is $2\ln 3$.'
        constraints: "bases 2, 3, 5, or 10; rewrite as e^(x ln a) or use the memorized a^x ln a"
      - id: kp2
        name: General logarithmic bases
        key_prerequisites: [derivatives-natural-log, change-of-base-formula]
        exemplars:
          - problem: 'Differentiate $f(x) = \log_2 x$.'
            answer: "1/(x ln 2)"
            solution_sketch: '$\log_2 x = \frac{\ln x}{\ln 2}$, so the derivative is $\frac{1}{x \ln 2}$.'
          - problem: 'Differentiate $f(x) = \log_{10} x$.'
            answer: "1/(x ln 10)"
          - problem: 'Differentiate $f(x) = \log_3(x^2 + 1)$.'
            answer: "2x/((x^2 + 1) ln 3)"
        constraints: "convert to natural logs via change of base; inner functions linear or x^2 + c"
      - id: kp3
        name: Products and quotients of exponential and log factors
        key_prerequisites: [derivatives-natural-exp, derivatives-natural-log, product-quotient-rules]
        exemplars:
          - problem: 'Differentiate $f(x) = x^2 \ln x$.'
            answer: "2x ln x + x"
            solution_sketch: 'Product rule: $2x \ln x + x^2 \cdot \frac{1}{x}$.'
          - problem: 'Differentiate $f(x) = \frac{e^x}{x}$.'
            answer: "e^x(x - 1)/x^2"
            solution_sketch: 'Quotient rule: $\frac{e^x x - e^x}{x^2}$.'
          - problem: 'Differentiate $f(x) = x \cdot 2^x$.'
            answer: "2^x(1 + x ln 2)"
            solution_sketch: 'Product rule: $2^x + x \cdot 2^x \ln 2$.'
        constraints: "one product and one quotient mixing power, exponential, and log factors"
    diagnostic_exemplar:
      problem: 'Differentiate $f(x) = x \cdot 3^x$.'
      answer: "3^x (1 + x ln 3)"
      solution_sketch: 'Product rule with $\frac{d}{dx}3^x = 3^x\ln 3$: $3^x + x\,3^x\ln 3$, then factor out $3^x$.'
    anki_seeds:
      - front: "d/dx a^x = ?"
        back: "a^x · ln a"
        type: basic
      - front: "d/dx log_a x = ?"
        back: "1/(x ln a)"
        type: basic

  - id: derivatives-piecewise-functions
    name: Derivatives of Piecewise Functions
    core: false                # worked special case; differentiability stays core
    difficulty: 0.62
    drill: false
    answer_kind: multi-step
    expected_time_secs: 150
    prerequisites:
      - id: differentiability
        weight: 0.7
        key: true
      - id: derivatives-of-polynomials
        weight: 0.5
        key: true
      - id: limits-piecewise-functions
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: Differentiate away from the seam
        key_prerequisites: [derivatives-of-polynomials]
        exemplars:
          - problem: 'Let $f(x) = x^2$ for $x < 1$ and $f(x) = 2x - 1$ for $x \geq 1$. Find $f''(3)$.'
            answer: "2"
            solution_sketch: 'At $x = 3$ only the $2x - 1$ branch applies; its derivative is $2$.'
          - problem: 'With the same $f$, find $f''(0)$.'
            answer: "0"
            solution_sketch: 'At $x = 0$ the $x^2$ branch applies: $f''(x) = 2x$, so $f''(0) = 0$.'
        constraints: "points strictly inside one branch; differentiate that branch only"
      - id: kp2
        name: Check differentiability at the seam
        key_prerequisites: [differentiability, derivatives-of-polynomials]
        exemplars:
          - problem: 'Let $f(x) = x^2$ for $x < 1$ and $f(x) = 2x - 1$ for $x \geq 1$. Is $f$ differentiable at $x = 1$, and if so what is $f''(1)$?'
            answer: "yes; f'(1) = 2"
            solution_sketch: 'Values match ($1 = 1$) and one-sided slopes match ($2 \cdot 1 = 2$), so $f''(1) = 2$.'
          - problem: 'Let $g(x) = x^2$ for $x < 2$ and $g(x) = 4x - 3$ for $x \geq 2$. Is $g$ differentiable at $x = 2$?'
            answer: "no — g is not even continuous there (4 ≠ 5)"
        constraints: "check continuity first, then one-sided derivatives; polynomial branches"
      - id: kp3
        name: Choose constants to make a piecewise function differentiable
        key_prerequisites: [differentiability, derivatives-of-polynomials]
        exemplars:
          - problem: 'Find $a$ and $b$ so that $f(x) = x^2$ for $x \leq 2$ and $f(x) = ax + b$ for $x > 2$ is differentiable at $x = 2$.'
            answer: "a = 4, b = -4"
            solution_sketch: 'Slopes: $2 \cdot 2 = a$. Continuity: $4 = 2a + b = 8 + b$, so $b = -4$.'
          - problem: 'Find $a$ and $b$ so that $f(x) = ax^3$ for $x \leq 1$ and $f(x) = 3x + b$ for $x > 1$ is differentiable at $x = 1$.'
            answer: "a = 1, b = -2"
            solution_sketch: 'Slopes: $3a = 3$ gives $a = 1$. Continuity: $1 = 3 + b$ gives $b = -2$.'
        constraints: "two unknowns; the slope equation and the continuity equation each yield an integer"
    diagnostic_exemplar:
      problem: 'Find $a$ and $b$ so that $f(x) = x^2$ for $x \leq 3$ and $f(x) = ax + b$ for $x > 3$ is differentiable at $x = 3$.'
      answer: "a = 6, b = -9"
      solution_sketch: 'Two conditions, slopes first: $2(3) = a$ gives $a = 6$, and then matching values, $3^2 = 6(3) + b$, gives $b = -9$.'
    anki_seeds:
      - front: "To make a piecewise function differentiable at its seam you need TWO equations:"
        back: "branch values equal (continuity) and branch derivatives equal (matching slopes)"
        type: basic
      - front: "Matching one-sided slopes at a seam is not enough on its own because..."
        back: "the function must also be continuous there — a jump with parallel slopes is still not differentiable"
        type: basic

  - id: implicit-differentiation-basic
    name: Implicit Differentiation Basics
    core: true
    difficulty: 0.6
    drill: false
    answer_kind: expression
    expected_time_secs: 150
    prerequisites:
      - id: chain-rule
        weight: 0.8
        key: true
      - id: literal-equations
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: Differentiate y-terms with the chain rule
        key_prerequisites: [chain-rule]
        exemplars:
          - problem: 'If $y$ is a function of $x$, what is $\frac{d}{dx}\left[y^4\right]$?'
            answer: "4y^3 · dy/dx"
          - problem: 'If $y$ is a function of $x$, what is $\frac{d}{dx}\left[y^2 + x^3\right]$?'
            answer: "2y · dy/dx + 3x^2"
        constraints: "single y-power terms; every y-term picks up a dy/dx factor"
      - id: kp2
        name: Solve for dy/dx (powers of x and y only)
        key_prerequisites: [chain-rule, literal-equations]
        exemplars:
          - problem: 'Find $\frac{dy}{dx}$ for the circle $x^2 + y^2 = 25$.'
            answer: "-x/y"
            solution_sketch: '$2x + 2y \frac{dy}{dx} = 0$, so $\frac{dy}{dx} = -\frac{x}{y}$.'
          - problem: 'Find $\frac{dy}{dx}$ for $x^3 + y^3 = 6$.'
            answer: "-x^2/y^2"
          - problem: 'Find $\frac{dy}{dx}$ for $2x^2 + 3y^2 = 12$.'
            answer: "-2x/(3y)"
            solution_sketch: '$4x + 6y \frac{dy}{dx} = 0$.'
        constraints: "powers of x and y only, no mixed terms; isolate dy/dx"
      - id: kp3
        name: Evaluate the slope at a point
        key_prerequisites: [chain-rule]
        exemplars:
          - problem: 'Find the slope of the tangent to $x^2 + y^2 = 25$ at $(3, 4)$.'
            answer: "-3/4"
            solution_sketch: '$\frac{dy}{dx} = -\frac{x}{y} = -\frac{3}{4}$ at $(3, 4)$.'
          - problem: 'Find the slope of the tangent to $y^2 = 4x$ at $(1, 2)$.'
            answer: "1"
            solution_sketch: '$2y \frac{dy}{dx} = 4$ gives $\frac{dy}{dx} = \frac{2}{y} = 1$ at $y = 2$.'
        constraints: "the given point must satisfy the equation; slopes are integers or simple fractions"
    diagnostic_exemplar:
      problem: 'Find $\frac{dy}{dx}$ for $x^2 + y^2 = 9$.'
      answer: "-x/y"
      solution_sketch: 'Differentiate both sides in $x$, treating $y$ as a function of $x$: $2x + 2y\frac{dy}{dx} = 0$.'
    anki_seeds:
      - front: "When differentiating y^n implicitly with respect to x, you get..."
        back: "n·y^(n-1) · dy/dx (chain rule — y is a function of x)"
        type: basic
      - front: "Implicit differentiation procedure in three steps:"
        back: "differentiate both sides in x (chain rule on y terms); collect dy/dx terms; solve for dy/dx"
        type: basic

  - id: implicit-differentiation
    name: Implicit Differentiation
    core: true
    difficulty: 0.68
    drill: false
    answer_kind: expression
    expected_time_secs: 210
    prerequisites:
      - id: implicit-differentiation-basic
        weight: 0.8
        key: true
      - id: product-quotient-rules
        weight: 0.6
        key: true
      - id: tangent-line-equation
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: Implicit differentiation with product terms
        key_prerequisites: [product-quotient-rules, implicit-differentiation-basic]
        exemplars:
          - problem: 'Find $\frac{dy}{dx}$ for $xy = 4$.'
            answer: "-y/x"
            solution_sketch: 'Product rule: $y + x\frac{dy}{dx} = 0$.'
          - problem: 'Find $\frac{dy}{dx}$ for $x^2 + xy = 6$.'
            answer: "-(2x + y)/x"
            solution_sketch: '$2x + y + x\frac{dy}{dx} = 0$, so $\frac{dy}{dx} = -\frac{2x + y}{x}$.'
          - problem: 'Find $\frac{dy}{dx}$ for $x^2 y + y^2 = 5$.'
            answer: "-2xy/(x^2 + 2y)"
            solution_sketch: '$2xy + x^2 y'' + 2y y'' = 0$; collect: $y''(x^2 + 2y) = -2xy$.'
        constraints: "one xy or x²y term; collect the dy/dx terms on one side before solving"
      - id: kp2
        name: Tangent lines to implicit curves
        key_prerequisites: [implicit-differentiation-basic, tangent-line-equation]
        exemplars:
          - problem: 'Find the slope of the tangent to $x^2 - y^2 = 9$ at $(5, 4)$.'
            answer: "5/4"
            solution_sketch: '$2x - 2y\frac{dy}{dx} = 0$ gives $\frac{dy}{dx} = \frac{x}{y} = \frac{5}{4}$.'
          - problem: 'Find the slope of the tangent to $x^2 + xy = 10$ at $(2, 3)$.'
            answer: "-7/2"
            solution_sketch: '$\frac{dy}{dx} = -\frac{2x + y}{x} = -\frac{4 + 3}{2} = -\frac{7}{2}$.'
          - problem: 'Find the tangent line to $x^2 + y^2 = 25$ at $(3, 4)$. Give the expression for $y$.'
            answer: "-3x/4 + 25/4"
            solution_sketch: 'Slope $-\frac{x}{y} = -\frac{3}{4}$; point-slope through $(3, 4)$ gives $y = -\frac{3x}{4} + \frac{25}{4}$.'
        constraints: "the given point must satisfy the equation; slopes are simple fractions"
      - id: kp3
        name: Second derivatives implicitly
        key_prerequisites: [implicit-differentiation-basic, product-quotient-rules]
        exemplars:
          - problem: 'For $x^2 + y^2 = 25$, find $\frac{d^2y}{dx^2}$ in terms of $x$ and $y$ (simplify using the original equation).'
            answer: "-25/y^3"
            solution_sketch: '$y'' = -\frac{x}{y}$; quotient rule gives $y'''' = -\frac{y - x y''}{y^2} = -\frac{y^2 + x^2}{y^3} = -\frac{25}{y^3}$.'
          - problem: 'For $y^2 = 4x$, find $\frac{d^2y}{dx^2}$ in terms of $y$.'
            answer: "-4/y^3"
            solution_sketch: '$y'' = \frac{2}{y}$; then $y'''' = -\frac{2}{y^2} y'' = -\frac{2}{y^2} \cdot \frac{2}{y} = -\frac{4}{y^3}$.'
        constraints: "differentiate dy/dx again, substitute the first derivative, and simplify with the original equation"
    diagnostic_exemplar:
      problem: 'For $x^2 + y^2 = 16$, find $\frac{d^2y}{dx^2}$ in terms of $y$ (simplify using the original equation).'
      answer: '-16/y^3'
      solution_sketch: 'Implicitly $y'' = -x/y$; differentiating again, $y'''' = -\frac{y - x y''}{y^2} = -\frac{y + x^2/y}{y^2} = -\frac{x^2 + y^2}{y^3} = -\frac{16}{y^3}$.'
    anki_seeds:
      - front: "After computing y'' implicitly, always simplify using..."
        back: "the original equation (substitute it to collapse x² + y² -type expressions)"
        type: basic
      - front: "d/dx [xy] = ?"
        back: "y + x·dy/dx (product rule — both factors vary)"
        type: basic

  - id: derivatives-inverse-functions
    name: Derivatives of Inverse Functions
    core: true
    difficulty: 0.65
    drill: false
    answer_kind: numeric
    expected_time_secs: 150
    prerequisites:
      - id: inverse-functions
        weight: 0.6
        key: true
      - id: chain-rule
        weight: 0.6
        key: true
      - id: derivative-definition
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: The inverse-derivative formula
        key_prerequisites: [inverse-functions, chain-rule]
        exemplars:
          - problem: 'Let $f(x) = x^3 + 2$, so $f(1) = 3$. Find $(f^{-1})''(3)$.'
            answer: "1/3"
            solution_sketch: '$(f^{-1})''(3) = \frac{1}{f''(f^{-1}(3))} = \frac{1}{f''(1)} = \frac{1}{3}$.'
          - problem: 'Let $f(x) = x^5 + x + 1$, so $f(1) = 3$. Find $(f^{-1})''(3)$.'
            answer: "1/6"
            solution_sketch: '$f''(x) = 5x^4 + 1$, so $f''(1) = 6$.'
        constraints: "f(a) given or trivially computed; f'(a) is a small integer"
      - id: kp2
        name: Inverse derivatives from tables
        key_prerequisites: [inverse-functions, chain-rule]
        exemplars:
          - problem: 'Given $f(2) = 5$ and $f''(2) = 8$, find $(f^{-1})''(5)$.'
            answer: "1/8"
          - problem: 'Given $g(-1) = 4$ and $g''(-1) = 3$, find $(g^{-1})''(4)$.'
            answer: "1/3"
        constraints: "table gives f and f' at one point; the student inverts through the OUTPUT value"
      - id: kp3
        name: Where the formula comes from
        key_prerequisites: [chain-rule, inverse-functions]
        exemplars:
          - problem: 'Differentiate both sides of $f(f^{-1}(x)) = x$ with the chain rule to see why $(f^{-1})''$ is the reciprocal of $f''$ at the pre-image. Then apply it: for $f(x) = x^2 + 1$ with $x > 0$, find $(f^{-1})''(5)$.'
            answer: "1/4"
            solution_sketch: 'Chain rule: $f''(f^{-1}(x)) \cdot (f^{-1})''(x) = 1$, so $(f^{-1})''(x) = \frac{1}{f''(f^{-1}(x))}$. Here $f^{-1}(5) = 2$ and $f''(2) = 4$, giving $\frac{1}{4}$.'
          - problem: 'Let $f(x) = x^3$. Find $(f^{-1})''(8)$.'
            answer: "1/12"
            solution_sketch: '$f^{-1}(8) = 2$ and $f''(2) = 12$.'
          - problem: 'Let $f(x) = x^3 + x$, so $f(2) = 10$. Find $(f^{-1})''(10)$.'
            answer: "1/13"
        constraints: "evaluate at the correct pre-image; reciprocal answers are unit fractions"
    diagnostic_exemplar:
      problem: 'Let $f(x) = x^3$. Find $(f^{-1})''(27)$.'
      answer: "1/27"
      solution_sketch: '$f^{-1}(27) = 3$ and $f''(3) = 27$, so $(f^{-1})''(27) = \frac{1}{27}$.'
    anki_seeds:
      - front: "Inverse function derivative: (f⁻¹)'(b) = ?"
        back: "1 / f'(f⁻¹(b)) — the reciprocal of f' at the PRE-image of b"
        type: basic
      - front: "Graphically, the tangent slopes of f and f⁻¹ at mirrored points are..."
        back: "reciprocals of each other (reflection across y = x)"
        type: basic

  - id: derivatives-inverse-trig
    name: Derivatives of Inverse Trigonometric Functions
    core: true
    difficulty: 0.68
    drill: false
    answer_kind: expression
    expected_time_secs: 150
    prerequisites:
      - id: inverse-trig-functions
        weight: 0.6
        key: true
