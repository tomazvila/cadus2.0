unit: differentiation-rules
course: calculus-1
module: "Differentiation Rules"
topics:
  - id: general-power-rule
    name: The General Power Rule
    core: true
    difficulty: 0.6
    drill: false
    answer_kind: expression
    expected_time_secs: 120
    prerequisites:
      - id: derivative-power-rule
        weight: 0.8
        key: true
      - id: function-composition
        weight: 0.6
        key: true
      - id: product-quotient-rules
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: Power of a function
        key_prerequisites: [derivative-power-rule, function-composition]
        step_check:
          step: 'Multiply the two pieces'
          question: 'Why is the derivative of the inside function multiplied into the result?'
          options:
            - 'The power rule only works after the inside has been differentiated'
            - 'Every power of a bracket needs one extra factor of its exponent'
            - 'The inside function changes too, so it scales the outer rate'
            - 'The derivative of the inside replaces the exponent brought down'
          answer: 'The inside function changes too, so it scales the outer rate'
          why: 'The outer power changes the output at one rate, but the inside is itself moving with $x$, so the two rates multiply.'
        try_first:
          problem: 'Expand $(2x+1)^2$ and use the result to find the slope of $y = (2x+1)^2$ at $x = 1$.'
          answer_contract: {"kind":"exact"}
          answer: '12'
          reveal: 'The expansion is $4x^2+4x+1$, so the slope is $8x+4 = 12$ at $x=1$. The outer power alone gives $2(2x+1)=6$, and the inside $2x+1$ changes twice as fast as $x$, so the full slope is $6\cdot 2$.'
        exemplars:
          - problem: 'Differentiate $f(x) = (x^2 + 1)^5$.'
            answer: "10x(x^2+1)^4"
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'The outer function is the fifth power and the inner function is $x^2+1$. The outer derivative is $5(x^2+1)^4$ and the inner derivative is $2x$, so $f''(x) = 10x(x^2+1)^4$.'
          - problem: 'Differentiate $f(x) = (3x - 2)^4$.'
            answer: "12(3x-2)^3"
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'The outer function is the fourth power and the inner function is $3x-2$. Bring down the $4$, lower the power to $3$ and multiply by the inner derivative $3$, so $f''(x) = 12(3x-2)^3$.'
          - problem: 'Differentiate $f(x) = \sqrt{x^2 + 9}$.'
            answer: "x/sqrt(x^2+9)"
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'Write the root as the power $\tfrac12$ of $x^2+9$. The derivative is $\tfrac12(x^2+9)^{-1/2}\cdot 2x$, so $f''(x) = \frac{x}{\sqrt{x^2+9}}$.'
          - problem: 'A square plate has side length $s = 3t + 1$ centimetres at time $t$ seconds, and its area is $A = s^2$. At what rate, in square centimetres per second, is the area growing at $t = 2$?'
            answer: "42"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The area is $A = (3t+1)^2$, so $dA/dt = 2(3t+1)\cdot 3 = 6(3t+1)$. At $t = 2$ this is $6\cdot 7 = 42$ square centimetres per second.'
          - problem: 'Differentiate $f(x) = (5x + 1)^3$.'
            answer: "15(5x+1)^2"
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'The outer function is the cube and the inner function is $5x+1$. The outer derivative $3(5x+1)^2$ times the inner derivative $5$ gives $f''(x) = 15(5x+1)^2$.'
          - problem: 'A particle moves along a line so that its position after $t$ seconds is $s(t) = (t^2 + 1)^3$ metres. What is its velocity at $t = 1$?'
            answer: "24"
            answer_contract: {"kind":"unit","quantity":"speed","unit":"m/s","allow_omitted":true}
            solution_sketch: 'The velocity is $s''(t) = 3(t^2+1)^2\cdot 2t = 6t(t^2+1)^2$. At $t = 1$ this is $6\cdot 1\cdot 2^2 = 24$ metres per second.'
          - problem: 'Find the derivative of $f(x) = \sqrt{4x + 1}$.'
            answer: "2/sqrt(4x+1)"
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'Write the root as the power $\tfrac12$ of $4x+1$. The derivative is $\tfrac12(4x+1)^{-1/2}\cdot 4$, which simplifies to $f''(x) = \frac{2}{\sqrt{4x+1}}$.'
          - problem: 'Find the equation of the tangent line to $y = (2x - 1)^3$ at $x = 1$.'
            answer: "y = 6x - 5"
            answer_contract: {"kind":"polynomial_relation"}
            solution_sketch: 'The slope is $y'' = 3(2x-1)^2\cdot 2$, which is $6$ at $x = 1$, and the point is $(1, 1)$. So $y - 1 = 6(x-1)$, which gives $y = 6x - 5$.'
          - problem: 'At which values of $x$ does the graph of $y = (x^2 - 4)^3$ have a horizontal tangent?'
            answer: "-2, 0, 2"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The slope is $y'' = 3(x^2-4)^2\cdot 2x = 6x(x^2-4)^2$. It is zero when $x = 0$ or $x^2 = 4$, so $x = -2, 0, 2$.'
        constraints: "inner function linear or quadratic; outer power an integer or 1/2; rates, velocities and tangent lines in context"
      - id: kp2
        name: Reciprocals and negative powers
        key_prerequisites: [derivative-power-rule]
        step_check:
          step: 'subtract $1$ from the exponent'
          question: 'Why does the exponent $-2$ become $-3$ and not $-1$?'
          options:
            - 'A negative exponent moves toward zero when differentiated'
            - 'The sign flips because the bracket sits in the denominator'
            - 'Adding $1$ to the exponent is the rule for negative powers'
            - 'Lowering $-2$ by $1$ gives $-3$, one step down'
          answer: 'Lowering $-2$ by $1$ gives $-3$, one step down'
          why: 'The rule lowers every exponent by one, and $-2-1=-3$, so the power gets more negative and the denominator power goes up.'
        exemplars:
          - problem: 'Differentiate $f(x) = \frac{1}{x^2 + 1}$.'
            answer: "-2x/(x^2+1)^2"
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'Write $f(x) = (x^2+1)^{-1}$. The general power rule gives $-(x^2+1)^{-2}\cdot 2x$, so $f''(x) = -\frac{2x}{(x^2+1)^2}$.'
          - problem: 'Differentiate $f(x) = (2x + 1)^{-3}$.'
            answer: "-6(2x+1)^(-4)"
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'The outer derivative is $-3(2x+1)^{-4}$ and the inner derivative is $2$. Multiplying gives $f''(x) = -6(2x+1)^{-4}$.'
          - problem: 'Find $f''(x)$ for $f(x) = \frac{1}{(3x - 2)^2}$.'
            answer: "-6/(3x-2)^3"
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'Write $f(x) = (3x-2)^{-2}$, so the outer derivative is $-2(3x-2)^{-3}$. The inner derivative is $3$, so $f''(x) = -\frac{6}{(3x-2)^3}$.'
          - problem: 'The intensity of a lamp at a distance $d$ metres is $I(d) = \dfrac{100}{(d+1)^2}$ units. How fast is the intensity changing at $d = 1$?'
            answer: "-25"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Write $I(d) = 100(d+1)^{-2}$, so $I''(d) = -200(d+1)^{-3}$. At $d = 1$ this is $-200/8 = -25$ units per metre, so the intensity falls.'
          - problem: 'Differentiate $f(x) = \frac{1}{x^2 + 2x + 5}$.'
            answer: "-(2x+2)/(x^2+2x+5)^2"
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'Write $f(x) = (x^2+2x+5)^{-1}$. The outer derivative is $-(x^2+2x+5)^{-2}$ and the inner derivative is $2x+2$, so $f''(x) = -\frac{2x+2}{(x^2+2x+5)^2}$.'
          - problem: 'Differentiate $g(x) = \frac{1}{(4 - 5x)^2}$.'
            answer: "10/(4-5x)^3"
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'Write $g(x) = (4-5x)^{-2}$, so the outer derivative is $-2(4-5x)^{-3}$. The inner derivative is $-5$, and $(-2)(-5) = 10$, so $g''(x) = \frac{10}{(4-5x)^3}$.'
          - problem: 'The concentration of a drug in the blood is $C(t) = \dfrac{5}{t^2 + 1}$ milligrams per litre, $t$ hours after the dose. What is the rate of change of $C$ at $t = 1$?'
            answer: "-5/2"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Write $C(t) = 5(t^2+1)^{-1}$, so $C''(t) = -5(t^2+1)^{-2}\cdot 2t = -\frac{10t}{(t^2+1)^2}$. At $t = 1$ this is $-10/4 = -5/2$ milligrams per litre per hour.'
          - problem: 'Differentiate $h(x) = \frac{1}{(2x^2 + 3)^4}$.'
            answer: "-16x/(2x^2+3)^5"
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'Write $h(x) = (2x^2+3)^{-4}$, so the outer derivative is $-4(2x^2+3)^{-5}$. The inner derivative is $4x$, so $h''(x) = -\frac{16x}{(2x^2+3)^5}$.'
          - problem: 'Sam differentiates $f(x) = \frac{1}{3x + 1}$ and writes $-\frac{1}{(3x+1)^2}$. What is the correct derivative?'
            answer: "-3/(3x+1)^2"
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'Sam forgot the inner derivative. Writing $f(x) = (3x+1)^{-1}$, the derivative is $-(3x+1)^{-2}\cdot 3$, so $f''(x) = -\frac{3}{(3x+1)^2}$.'
        constraints: "rewrite as a negative power; inner function linear or quadratic; rates in context"
      - id: kp3
        name: Name the inner and outer functions
        key_prerequisites: [function-composition, derivative-power-rule]
        step_check:
          step: 'Differentiate the outer function at $u$'
          question: 'Why is the outer power differentiated with respect to $u$ and not $x$?'
          options:
            - 'The letter $u$ stands for the exponent in the power rule'
            - 'The power is in $u$; the $x$ rate enters later via $u''$'
            - 'A power of a bracket cannot be differentiated with respect to $x$'
            - 'The outer function has no $x$ in it, only the number $5$'
          answer: 'The power is in $u$; the $x$ rate enters later via $u''$'
          why: 'The outer function is $u^5$, so its rule is $5u^4$; the way $u$ depends on $x$ enters afterwards through $u''$.'
        exemplars:
          - problem: 'Write $f(x) = (x^3 + 2x)^4$ as a power of $u = x^3 + 2x$ and find $f''(x)$.'
            answer: "4(x^3+2x)^3(3x^2+2)"
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'With $u = x^3+2x$ we have $f = u^4$, so the outer derivative is $4u^3$. The inner derivative is $u'' = 3x^2+2$, so $f''(x) = 4(x^3+2x)^3(3x^2+2)$.'
          - problem: 'Differentiate $f(x) = \sqrt{5x - 1}$.'
            answer: "5/(2sqrt(5x-1))"
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'Let $u = 5x-1$, so $f = u^{1/2}$ with outer derivative $\tfrac12 u^{-1/2}$. The inner derivative is $5$, so $f''(x) = \frac{5}{2\sqrt{5x-1}}$.'
          - problem: 'Let $f(x) = (x^4 - 3x)^5$ and take $u = x^4 - 3x$ as the inner function. Find $f''(x)$.'
            answer: "5(x^4-3x)^4(4x^3-3)"
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'Here $f = u^5$, so the outer derivative is $5u^4$. The inner derivative is $u'' = 4x^3-3$, so $f''(x) = 5(x^4-3x)^4(4x^3-3)$.'
          - problem: 'The edge of a cube is $s = 2t + 1$ centimetres at time $t$ seconds. At what rate, in cubic centimetres per second, is the volume $V = s^3$ growing at $t = 1$?'
            answer: "54"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The volume is $V = (2t+1)^3$, so $dV/dt = 3(2t+1)^2\cdot 2 = 6(2t+1)^2$. At $t = 1$ this is $6\cdot 9 = 54$ cubic centimetres per second.'
          - problem: 'Differentiate $f(x) = (2x^2 + 1)^6$.'
            answer: "24x(2x^2+1)^5"
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'Let $u = 2x^2+1$, so $f = u^6$ with outer derivative $6u^5$. The inner derivative is $4x$, so $f''(x) = 24x(2x^2+1)^5$.'
          - problem: 'A point moves along a line so that its distance from the start after $t$ seconds is $D(t) = \sqrt{t^2 + 16}$ metres. How fast is it moving at $t = 3$?'
            answer: "3/5"
            answer_contract: {"kind":"unit","quantity":"speed","unit":"m/s","allow_omitted":true}
            solution_sketch: 'With $u = t^2+16$ we get $D''(t) = \tfrac12 u^{-1/2}\cdot 2t = \frac{t}{\sqrt{t^2+16}}$. At $t = 3$ this is $3/\sqrt{25} = 3/5$ metres per second.'
          - problem: 'Differentiate $f(x) = \sqrt{4x^3 + 9}$.'
            answer: "6x^2/sqrt(4x^3+9)"
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'Let $u = 4x^3+9$, so $f = u^{1/2}$ with outer derivative $\tfrac12 u^{-1/2}$. The inner derivative is $12x^2$, so $f''(x) = \frac{6x^2}{\sqrt{4x^3+9}}$.'
          - problem: 'Write $f(x) = \frac{1}{(x^2 + 2)^4}$ as a power of $u = x^2 + 2$ and find $f''(x)$.'
            answer: "-8x/(x^2+2)^5"
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'Here $f = u^{-4}$, so the outer derivative is $-4u^{-5}$. The inner derivative is $2x$, so $f''(x) = -\frac{8x}{(x^2+2)^5}$.'
          - problem: 'Mia differentiates $f(x) = (x^2 + 3x)^5$ and writes $5(x^2+3x)^4$. What is the correct derivative?'
            answer: "5(x^2+3x)^4(2x+3)"
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'Mia forgot the inner derivative. With $u = x^2+3x$ the derivative is $5u^4\cdot u''$ and $u'' = 2x+3$, so $f''(x) = 5(x^2+3x)^4(2x+3)$.'
        constraints: "the inner function u is named before differentiating; rates and distances in context"
    diagnostic_exemplar:
      problem: 'Differentiate $f(x) = \frac{1}{(x^2 + 4)^3}$ by writing it as a power first.'
      answer: '-6x/(x^2 + 4)^4'
      solution_sketch: '$f(x) = (x^2 + 4)^{-3}$, so $f''(x) = -3(x^2+4)^{-4}\cdot 2x = -\frac{6x}{(x^2+4)^4}$.'
    anki_seeds:
      - front: "General power rule: d/dx [u(x)]^n = ?"
        back: "n·[u(x)]^(n-1) · u'(x)"
        type: basic
      - front: "The most common general-power-rule error is forgetting to..."
        back: "multiply by the inner derivative u'(x)"
        type: basic

  - id: chain-rule
    name: The Chain Rule
    core: true
    difficulty: 0.65
    drill: false
    answer_kind: expression
    expected_time_secs: 150
    prerequisites:
      - id: general-power-rule
        weight: 0.8
        key: true
      - id: function-composition
        weight: 0.5
        key: true
      - id: product-quotient-rules
        weight: 0.5
    knowledge_points:
      - id: kp1
        name: The chain rule in general form
        key_prerequisites: [general-power-rule, function-composition]
        step_check:
          step: 'Since $g(2)=4$, we need $f''(4)$'
          question: 'Why does the calculation use $f''(4)$ and not $f''(2)$?'
          options:
            - 'The outer function $f$ is read at the inner value $g(2)=4$'
            - 'The number $4$ is the larger of the two inputs given'
            - 'The value $g''(2)=3$ is the input that $f''$ is read at'
            - 'The point $x=2$ is the input of $f$, so $f''(2)$ is the one needed'
          answer: 'The outer function $f$ is read at the inner value $g(2)=4$'
          why: 'The function $f$ receives the value $g(2) = 4$ as its input, so its rate of change must be read at $4$, not at $2$.'
        try_first:
          problem: 'A car uses $0.08$ litres of petrol per kilometre and travels at $50$ kilometres per hour. How many litres of petrol does it use per hour?'
          answer_contract: {"kind":"exact"}
          answer: '4'
          reveal: 'Litres per hour is litres per kilometre times kilometres per hour, so $0.08\cdot 50 = 4$. The chain rule multiplies rates in the same way: $\frac{dy}{dx} = \frac{dy}{du}\cdot\frac{du}{dx}$.'
        exemplars:
          - problem: 'Let $h(x) = f(g(x))$ with $g(1) = 2$, $g''(1) = 3$ and $f''(2) = 5$. Find $h''(1)$.'
            answer: "15"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'By the chain rule $h''(1) = f''(g(1))\cdot g''(1) = f''(2)\cdot g''(1)$. This is $5\cdot 3 = 15$.'
          - problem: 'Let $h(x) = f(g(x))$ with $g(0) = 3$, $g''(0) = -4$ and $f''(3) = 2$. Find $h''(0)$.'
            answer: "-8"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The chain rule gives $h''(0) = f''(g(0))\cdot g''(0) = f''(3)\cdot g''(0)$. This is $2\cdot(-4) = -8$.'
          - problem: 'Let $h(x) = f(g(x))$ with $g(2) = 7$, $g''(2) = 4$ and $h''(2) = 12$. Find $f''(7)$.'
            answer: "3"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'By the chain rule $h''(2) = f''(g(2))\cdot g''(2) = f''(7)\cdot 4$. So $12 = 4f''(7)$, which gives $f''(7) = 3$.'
          - problem: 'A tank is filling. Its volume rises by $2.5$ litres per minute, and each centimetre of depth holds $5$ litres. How fast, in centimetres per minute, does the depth rise?'
            answer: "1/2"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The chain rule gives $\frac{dV}{dt} = \frac{dV}{dh}\cdot\frac{dh}{dt}$, so $2.5 = 5\cdot\frac{dh}{dt}$. Dividing, $\frac{dh}{dt} = 1/2$ centimetre per minute.'
          - problem: 'Let $y = u^5$ where $u = x^2 + 1$. Find $\frac{dy}{dx}$.'
            answer: "10x(x^2+1)^4"
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'Here $\frac{dy}{du} = 5u^4$ and $\frac{du}{dx} = 2x$. Multiplying and putting $u = x^2+1$ back gives $\frac{dy}{dx} = 10x(x^2+1)^4$.'
          - problem: 'Let $y = \sqrt{u}$ where $u = x^2 + 9$. Find $\frac{dy}{dx}$.'
            answer: "x/sqrt(x^2+9)"
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'Here $\frac{dy}{du} = \frac{1}{2\sqrt{u}}$ and $\frac{du}{dx} = 2x$. Multiplying gives $\frac{dy}{dx} = \frac{2x}{2\sqrt{x^2+9}} = \frac{x}{\sqrt{x^2+9}}$.'
          - problem: 'A weather balloon rises at $3$ metres per second. The air temperature falls by $0.006$ degrees Celsius for every metre of height. How fast, in degrees Celsius per second, does the temperature at the balloon change?'
            answer: "-0.018"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'By the chain rule $\frac{dT}{dt} = \frac{dT}{dh}\cdot\frac{dh}{dt} = (-0.006)(3)$. This is $-0.018$ degrees per second, a fall.'
          - problem: 'Let $y = \frac{1}{u}$ where $u = 3x + 1$. Find $\frac{dy}{dx}$.'
            answer: "-3/(3x+1)^2"
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'Here $y = u^{-1}$, so $\frac{dy}{du} = -u^{-2}$, and $\frac{du}{dx} = 3$. Multiplying gives $\frac{dy}{dx} = -\frac{3}{(3x+1)^2}$.'
          - problem: 'Let $h(x) = f(g(x))$ where $g(1) = 2$ and $g''(1) = 5$. A table gives $f''(1) = 4$ and $f''(2) = -3$. Find $h''(1)$.'
            answer: "-15"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The chain rule gives $h''(1) = f''(g(1))\cdot g''(1) = f''(2)\cdot 5$. The value $f''(1) = 4$ is not used, so $h''(1) = (-3)(5) = -15$.'
        constraints: "table values are single digits; Leibniz-form problems use a named u; rates in context"
      - id: kp2
        name: Nested compositions (chain rule twice)
        key_prerequisites: [general-power-rule]
        step_check:
          step: 'Differentiate the outer cube, leaving the inside intact'
          question: 'Why is the inside $2 + (3x+1)^2$ left unchanged in this step?'
          options:
            - 'The inside is a constant while the outer cube is differentiated'
            - 'The inside can only be differentiated after the answer is simplified'
            - 'The inside is dropped because only the outer cube has a derivative'
            - 'The outer rule is applied at the inside; its rate comes later'
          answer: 'The outer rule is applied at the inside; its rate comes later'
          why: 'The outer rule says $3u^2$ at the value $u = 2 + (3x+1)^2$; the rate at which that inside changes is multiplied in by the next steps.'
        exemplars:
          - problem: 'Differentiate $f(x) = \sqrt{1 + \sqrt{x}}$.'
            answer: "1/(4sqrt(x)sqrt(1+sqrt(x)))"
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'The outer root gives $\frac{1}{2\sqrt{1+\sqrt x}}$ and the inner root $\sqrt x$ has derivative $\frac{1}{2\sqrt x}$. Multiplying, $f''(x) = \frac{1}{4\sqrt{x}\sqrt{1+\sqrt{x}}}$.'
          - problem: 'Differentiate $f(x) = \left(1 + (2x + 1)^3\right)^4$.'
            answer: "24(2x+1)^2(1+(2x+1)^3)^3"
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'The outer power gives $4(1+(2x+1)^3)^3$. The inner part has derivative $3(2x+1)^2\cdot 2 = 6(2x+1)^2$, so $f''(x) = 24(2x+1)^2(1+(2x+1)^3)^3$.'
          - problem: 'Differentiate $f(x) = \sqrt{1 + (2x + 1)^2}$.'
            answer: "2(2x+1)/sqrt(1+(2x+1)^2)"
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'The outer root gives $\frac{1}{2\sqrt{1+(2x+1)^2}}$. The inner part has derivative $2(2x+1)\cdot 2$, so $f''(x) = \frac{2(2x+1)}{\sqrt{1+(2x+1)^2}}$.'
          - problem: 'Differentiate $f(x) = \left(1 + \sqrt{3x + 1}\right)^3$.'
            answer: "9(1+sqrt(3x+1))^2/(2sqrt(3x+1))"
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'The outer cube gives $3(1+\sqrt{3x+1})^2$. The inner root has derivative $\frac{3}{2\sqrt{3x+1}}$, so $f''(x) = \frac{9(1+\sqrt{3x+1})^2}{2\sqrt{3x+1}}$.'
          - problem: 'A factory makes $q$ hundred units at a cost of $C(q) = \left(2 + \sqrt{q}\right)^3$ thousand dollars. What is the marginal cost $C''(4)$, in thousand dollars per hundred units?'
            answer: "12"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The derivative is $C''(q) = 3(2+\sqrt q)^2\cdot\frac{1}{2\sqrt q}$. At $q = 4$ this is $3\cdot 16\cdot\frac14 = 12$ thousand dollars per hundred units.'
          - problem: 'Differentiate $f(x) = \left(x + \sqrt{x^2 + 1}\right)^3$.'
            answer: "3(x+sqrt(x^2+1))^2(1+x/sqrt(x^2+1))"
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'The outer cube gives $3(x+\sqrt{x^2+1})^2$. The inner sum has derivative $1+\frac{x}{\sqrt{x^2+1}}$, so $f''(x) = 3(x+\sqrt{x^2+1})^2\left(1+\frac{x}{\sqrt{x^2+1}}\right)$.'
          - problem: 'A runner is $s(t) = \sqrt{1 + (2t+1)^2}$ metres from the start after $t$ seconds. How fast is the runner moving at $t = 1$?'
            answer: "6/sqrt(10)"
            answer_contract: {"kind":"unit","quantity":"speed","unit":"m/s","allow_omitted":true}
            solution_sketch: 'The derivative is $s''(t) = \frac{2(2t+1)}{\sqrt{1+(2t+1)^2}}$. At $t = 1$ this is $\frac{6}{\sqrt{10}}$ metres per second, about $1.9$.'
          - problem: 'Differentiate $f(x) = \dfrac{1}{\sqrt{1 + x^2}}$.'
            answer: "-x/(1+x^2)^(3/2)"
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'Write $f(x) = (1+x^2)^{-1/2}$. The outer power gives $-\tfrac12(1+x^2)^{-3/2}$ and the inner derivative is $2x$, so $f''(x) = -\frac{x}{(1+x^2)^{3/2}}$.'
        constraints: "exactly two chained layers; algebraic functions; rates in context"
      - id: kp3
        name: Chain rule combined with product and quotient rules
        key_prerequisites: [general-power-rule, product-quotient-rules]
        step_check:
          step: 'the second factor needs the chain rule'
          question: 'Why does the second factor $(3x+2)^2$ need the chain rule?'
          options:
            - 'It has a larger exponent than the first factor'
            - 'The product rule cannot be used without the chain rule'
            - 'It is a power of $3x+2$, which is not just a power of $x$'
            - 'Only the second factor of any product needs the chain rule'
          answer: 'It is a power of $3x+2$, which is not just a power of $x$'
          why: 'The expression $(3x+2)^2$ squares a function of $x$, so its derivative needs the inner derivative $3$ as well as the power rule.'
        exemplars:
          - problem: 'Differentiate $f(x) = x^2(2x + 1)^3$.'
            answer: "2x(2x+1)^3+6x^2(2x+1)^2"
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'The product rule gives $2x(2x+1)^3 + x^2\cdot 3(2x+1)^2\cdot 2$. This is $f''(x) = 2x(2x+1)^3 + 6x^2(2x+1)^2$.'
          - problem: 'Differentiate $f(x) = \left(\frac{x + 1}{x - 1}\right)^2$.'
            answer: "-4(x+1)/(x-1)^3"
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'The power rule gives $2\cdot\frac{x+1}{x-1}$ times the derivative of the fraction, which is $\frac{-2}{(x-1)^2}$. So $f''(x) = -\frac{4(x+1)}{(x-1)^3}$.'
          - problem: 'Differentiate $f(x) = x(x^2 + 1)^3$.'
            answer: "(x^2+1)^3+6x^2(x^2+1)^2"
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'The product rule gives $1\cdot(x^2+1)^3 + x\cdot 3(x^2+1)^2\cdot 2x$. So $f''(x) = (x^2+1)^3 + 6x^2(x^2+1)^2$.'
          - problem: 'Differentiate $f(x) = \left(\frac{x + 2}{x - 1}\right)^3$.'
            answer: "-9(x+2)^2/(x-1)^4"
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'The power rule gives $3\left(\frac{x+2}{x-1}\right)^2$ times the quotient derivative $\frac{-3}{(x-1)^2}$. So $f''(x) = -\frac{9(x+2)^2}{(x-1)^4}$.'
          - problem: 'Differentiate $f(x) = (x^2 + 1)^2 (x - 1)^3$.'
            answer: "4x(x^2+1)(x-1)^3+3(x^2+1)^2(x-1)^2"
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'The product rule gives $[2(x^2+1)(2x)](x-1)^3 + (x^2+1)^2[3(x-1)^2]$. So $f''(x) = 4x(x^2+1)(x-1)^3 + 3(x^2+1)^2(x-1)^2$.'
          - problem: 'Differentiate $f(x) = \dfrac{x^2 + 1}{(x - 2)^2}$.'
            answer: "-2(2x+1)/(x-2)^3"
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'The quotient rule gives $\frac{2x(x-2)^2 - (x^2+1)\cdot 2(x-2)}{(x-2)^4}$. Cancel one factor $x-2$ to get $\frac{-4x-2}{(x-2)^3} = -\frac{2(2x+1)}{(x-2)^3}$.'
          - problem: 'A company earns a profit of $P(x) = x\sqrt{16 - x}$ thousand dollars from $x$ hundred sales. What is the marginal profit $P''(7)$, in thousand dollars per hundred sales?'
            answer: "11/6"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The product rule gives $P''(x) = \sqrt{16-x} - \frac{x}{2\sqrt{16-x}}$. At $x = 7$ this is $3 - \frac76 = \frac{11}{6}$.'
          - problem: 'The concentration of a drug in the blood is $C(t) = \dfrac{t}{(t+1)^2}$ milligrams per litre, $t$ hours after the dose. At what time is the concentration greatest?'
            answer: "1"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The quotient rule gives $C''(t) = \frac{(t+1)^2 - 2t(t+1)}{(t+1)^4} = \frac{1-t}{(t+1)^3}$. This is zero only at $t = 1$, and it changes from positive to negative there, so the greatest concentration occurs at $t = 1$ hour.'
          - problem: 'Dan differentiates $f(x) = x^2(x + 3)^4$ and writes $2x\cdot 4(x+3)^3$. What is the correct derivative?'
            answer: "2x(x+3)^4+4x^2(x+3)^3"
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'Dan multiplied the two derivatives, but a product needs the product rule. So $f''(x) = 2x(x+3)^4 + x^2\cdot 4(x+3)^3 = 2x(x+3)^4 + 4x^2(x+3)^3$.'
        constraints: "one product-with-chain and one quotient-inside-power problem; low-degree polynomials; profit and concentration in context"
    diagnostic_exemplar:
      problem: 'Differentiate $f(x) = x^3(3x - 2)^2$.'
      answer: "3x^2(3x - 2)^2 + 6x^3(3x - 2)"
      solution_sketch: 'Product rule with a chain-rule factor: $3x^2(3x-2)^2 + x^3 \cdot 2(3x-2) \cdot 3$; factored form $3x^2(3x-2)(5x-2)$ also accepted.'
    anki_seeds:
      - front: "Chain rule: d/dx f(g(x)) = ?"
        back: "f'(g(x)) · g'(x) — outer derivative at the inner function, times the inner derivative"
        type: basic
      - front: "Chain rule in Leibniz notation: dy/dx = ?"
        back: "(dy/du) · (du/dx)"
        type: basic

  - id: derivatives-sin-cos
    name: Derivatives of Sine and Cosine
    core: true
    difficulty: 0.55
    drill: false
    answer_kind: expression
    expected_time_secs: 90
    prerequisites:
      - id: derivative-power-rule
        weight: 0.6
        key: true
      - id: unit-circle
        weight: 0.5
        key: true
      - id: product-rule
        weight: 0.4
      - id: special-trig-limits
        weight: 0
      - id: trig-graphs-basic
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: Derivatives of sin x and cos x
        key_prerequisites: [derivative-power-rule]
        step_check:
          step: 'the term $-3\cos x$ gives $-3\cdot(-\sin x) = 3\sin x$'
          question: 'Why is the derivative of $-3\cos x$ equal to $+3\sin x$?'
          options:
            - 'The derivative of cosine is $+\sin x$, so the sign stays the same'
            - 'The minus in $-3$ times the minus in $-\sin x$ gives a plus'
            - 'A negative coefficient always turns cosine into sine with a plus'
            - 'The constant $3$ is dropped and the sign of the term is reversed'
          answer: 'The minus in $-3$ times the minus in $-\sin x$ gives a plus'
          why: 'The derivative of $\cos x$ is $-\sin x$, and the coefficient $-3$ multiplies it, so the two minus signs give $+3\sin x$.'
        try_first:
          problem: 'The graph of $y = \cos x$ reaches its highest point at $x = 0$. What is the slope of the graph there?'
          answer_contract: {"kind":"exact"}
          answer: '0'
          reveal: 'At a highest point the tangent line is horizontal, so the slope is $0$. The rule $(\cos x)'' = -\sin x$ agrees, because $-\sin 0 = 0$.'
        exemplars:
          - problem: 'Differentiate $f(x) = \sin x$.'
            answer: "cos(x)"
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'The derivative of sine is cosine. So $f''(x) = \cos x$, and the graph of sine rises with slope $1$ at $x = 0$.'
          - problem: 'Differentiate $f(x) = 3\sin x - 2\cos x$.'
            answer: "3cos(x)+2sin(x)"
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'Keep the coefficients and use $(\sin x)'' = \cos x$ and $(\cos x)'' = -\sin x$. So $f''(x) = 3\cos x - 2(-\sin x) = 3\cos x + 2\sin x$.'
          - problem: 'Differentiate $f(x) = 4\cos x + x^2$.'
            answer: "-4sin(x)+2x"
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'The derivative of $4\cos x$ is $-4\sin x$ and the power rule gives $2x$ for $x^2$. So $f''(x) = -4\sin x + 2x$.'
          - problem: 'Find $f''(x)$ for $f(x) = -2\sin x + 5\cos x$.'
            answer: "-2cos(x)-5sin(x)"
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'The sine term gives $-2\cos x$ and the cosine term gives $5(-\sin x) = -5\sin x$. So $f''(x) = -2\cos x - 5\sin x$.'
          - problem: 'Find $f''(x)$ for $f(x) = x^3 - 6\sin x + 2\cos x$.'
            answer: "3x^2-6cos(x)-2sin(x)"
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'The power rule gives $3x^2$, the sine term gives $-6\cos x$ and the cosine term gives $-2\sin x$. So $f''(x) = 3x^2 - 6\cos x - 2\sin x$.'
          - problem: 'Find $f''(x)$ for $f(x) = 8\sin x + x^3 - 4x$.'
            answer: "8cos(x)+3x^2-4"
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'The sine term gives $8\cos x$, the power rule gives $3x^2$ for $x^3$, and $-4x$ gives $-4$. So $f''(x) = 8\cos x + 3x^2 - 4$.'
          - problem: 'A mass on a spring has displacement $s(t) = 4\sin t$ centimetres at time $t$ seconds. Find its velocity $v(t)$.'
            answer: "4cos(t)"
            answer_contract: {"kind":"function","vars":["t"]}
            solution_sketch: 'Velocity is the derivative of displacement. So $v(t) = s''(t) = 4\cos t$ centimetres per second.'
          - problem: 'The height of a rider on a Ferris wheel is $h(t) = 10 - 8\cos t$ metres at time $t$ minutes. How fast is the height changing at time $t$?'
            answer: "8sin(t)"
            answer_contract: {"kind":"function","vars":["t"]}
            solution_sketch: 'The constant $10$ has derivative $0$ and $-8\cos t$ gives $-8(-\sin t) = 8\sin t$. So $h''(t) = 8\sin t$ metres per minute.'
        constraints: "linear combinations of sin, cos, and power terms with integer coefficients; velocities and rates in context"
      - id: kp2
        name: Evaluate trig derivatives at unit-circle angles
        key_prerequisites: [unit-circle]
        step_check:
          step: 'the derivative of cosine is negative sine'
          question: 'Why is the derivative found before the angle $\pi/3$ is substituted?'
          options:
            - 'Substituting first turns $\cos x$ into a number with slope $0$'
            - 'The unit circle gives values of derivatives, not values of cosine'
            - 'The angle must be converted to degrees before it is differentiated'
            - 'Derivatives are defined only after the angle is reduced to $0$'
          answer: 'Substituting first turns $\cos x$ into a number with slope $0$'
          why: 'Slope is a rate of change in $x$. If $\pi/3$ were put into $\cos x$ first, only a constant would be left to differentiate.'
        exemplars:
          - problem: 'For $f(x) = \sin x$, find $f''(\pi/3)$.'
            answer: "1/2"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The derivative is $f''(x) = \cos x$. At $x = \pi/3$ the unit circle gives $\cos(\pi/3) = \frac12$.'
          - problem: 'For $f(x) = \cos x$, find $f''(\pi/6)$.'
            answer: "-1/2"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The derivative is $f''(x) = -\sin x$. At $x = \pi/6$ the unit circle gives $\sin(\pi/6) = \frac12$, so $f''(\pi/6) = -\frac12$.'
          - problem: 'Find the slope of $y = 2\sin x$ at $x = 0$.'
            answer: "2"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The derivative is $y'' = 2\cos x$. At $x = 0$ the slope is $2\cos 0 = 2$.'
          - problem: 'Let $f(x) = \cos x$. Find $f''(\pi/3)$.'
            answer: "-sqrt(3)/2"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The derivative is $f''(x) = -\sin x$. At $x = \pi/3$ the unit circle gives $\sin(\pi/3) = \frac{\sqrt3}{2}$, so $f''(\pi/3) = -\frac{\sqrt3}{2}$.'
          - problem: 'Let $f(x) = \sin x$. Find $f''(\pi/4)$.'
            answer: "sqrt(2)/2"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The derivative is $f''(x) = \cos x$. At $x = \pi/4$ the unit circle gives $\cos(\pi/4) = \frac{\sqrt2}{2}$.'
          - problem: 'A curve is given by $y = 3\cos x$. Find the slope of the curve at $x = \pi/2$.'
            answer: "-3"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The derivative is $y'' = -3\sin x$. At $x = \pi/2$ we have $\sin(\pi/2) = 1$, so the slope is $-3$.'
          - problem: 'A weight on a spring has displacement $s(t) = 6\sin t$ centimetres after $t$ seconds. What is its velocity, in centimetres per second, at $t = \pi/6$?'
            answer: "3sqrt(3)"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The velocity is $s''(t) = 6\cos t$. At $t = \pi/6$ we have $\cos(\pi/6) = \frac{\sqrt3}{2}$, so the velocity is $3\sqrt3$.'
          - problem: 'The water level in a harbour is $h(t) = 5 + 2\cos t$ metres at time $t$ hours. At what rate, in metres per hour, is the level changing at $t = 2\pi/3$?'
            answer: "-sqrt(3)"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The rate is $h''(t) = -2\sin t$. At $t = 2\pi/3$ we have $\sin(2\pi/3) = \frac{\sqrt3}{2}$, so $h'' = -\sqrt3$ and the level is falling.'
          - problem: 'Is the graph of $y = \sin x$ rising or falling at $x = 2\pi/3$?'
            answer: "falling"
            answer_contract: {"kind":"label","options":[["rising","increasing","going up"],["falling","decreasing","going down"]]}
            solution_sketch: 'The slope is $\cos x$, and $\cos(2\pi/3) = -\frac12$ is negative. So the graph is falling at $x = 2\pi/3$.'
        constraints: "evaluation angles from the unit circle (0, π/6, π/4, π/3, π/2, 2π/3, π); exact values only; velocities and rising or falling in context"
      - id: kp3
        name: Products of power and trig factors
        key_prerequisites: [product-rule, derivative-power-rule]
        step_check:
          step: 'Apply the product rule'
          question: 'Why does the derivative of $x^3\cos x$ have two terms and not just $3x^2\cdot(-\sin x)$?'
          options:
            - 'The derivative of a product is the product of the derivatives'
            - 'Each factor is differentiated twice before they are multiplied'
            - 'Each factor changes while the other is held; the effects add'
            - 'The minus sign in $-\sin x$ always creates a second term'
          answer: 'Each factor changes while the other is held; the effects add'
          why: 'Both factors depend on $x$, so each is differentiated in turn while the other stays; the two results add.'
        exemplars:
          - problem: 'Differentiate $f(x) = x\sin x$.'
            answer: "sin(x)+x cos(x)"
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'The product rule gives $(1)\sin x + x\cos x$. So $f''(x) = \sin x + x\cos x$.'
          - problem: 'Differentiate $f(x) = x^2\cos x$.'
            answer: "2x cos(x)-x^2 sin(x)"
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'The product rule gives $2x\cos x + x^2(-\sin x)$. So $f''(x) = 2x\cos x - x^2\sin x$.'
          - problem: 'Find $f''(x)$ for $f(x) = x^3\sin x$.'
            answer: "3x^2 sin(x)+x^3 cos(x)"
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'The product rule gives $(x^3)''\sin x + x^3(\sin x)''$. The power rule gives $3x^2$, so $f''(x) = 3x^2\sin x + x^3\cos x$.'
          - problem: 'Find $f''(x)$ for $f(x) = (x^2 - 3x)\cos x$.'
            answer: "(2x-3)cos(x)-(x^2-3x)sin(x)"
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'The product rule gives $(2x-3)\cos x + (x^2-3x)(-\sin x)$. So $f''(x) = (2x-3)\cos x - (x^2-3x)\sin x$.'
          - problem: 'Find $g''(x)$ for $g(x) = x^3\cos x$.'
            answer: "3x^2 cos(x)-x^3 sin(x)"
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'The product rule gives $(x^3)''\cos x + x^3(\cos x)''$. The power rule gives $3x^2$, so $g''(x) = 3x^2\cos x - x^3\sin x$.'
          - problem: 'A drone has height $h(t) = t\sin t$ metres after $t$ seconds. What is its vertical velocity at $t = \pi/2$?'
            answer: "1"
            answer_contract: {"kind":"unit","quantity":"speed","unit":"m/s","allow_omitted":true}
            solution_sketch: 'The product rule gives $h''(t) = \sin t + t\cos t$. At $t = \pi/2$ we have $\sin = 1$ and $\cos = 0$, so $h'' = 1$ metre per second.'
          - problem: 'A hill has height $y = x\cos x$ hundred metres at a horizontal distance of $x$ hundred metres. What is the slope of the hill at $x = \pi$?'
            answer: "-1"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The product rule gives $y'' = \cos x - x\sin x$. At $x = \pi$ we have $\cos\pi = -1$ and $\sin\pi = 0$, so the slope is $-1$.'
          - problem: 'Ben differentiates $f(x) = x^4\cos x$ and writes $4x^3(-\sin x)$. What is the correct derivative?'
            answer: "4x^3 cos(x)-x^4 sin(x)"
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'Ben multiplied the two derivatives, but a product needs the product rule. So $f''(x) = 4x^3\cos x + x^4(-\sin x) = 4x^3\cos x - x^4\sin x$.'
        constraints: "one power or polynomial factor times sin or cos; no chain rule yet; velocity and gradient in context"
    diagnostic_exemplar:
      problem: 'For $f(x) = x^2 \sin x$, find $f\''(\pi)$.'
      answer: '-pi^2'
      solution_sketch: '$f''(x) = 2x\sin x + x^2\cos x$; at $x = \pi$, $\sin \pi = 0$ and $\cos \pi = -1$, so $f''(\pi) = -\pi^2$.'
    anki_seeds:
      - front: "d/dx sin x and d/dx cos x = ?"
        back: "cos x and -sin x (the minus sign lands on the cosine's derivative)"
        type: basic
      - front: "The limit behind d/dx sin x = cos x is..."
        back: "lim_{h→0} (sin h)/h = 1 (radians required)"
        type: basic

  - id: derivatives-trig
    name: Derivatives of Trigonometric Functions
    core: true
    difficulty: 0.62
    drill: false
    answer_kind: expression
    expected_time_secs: 120
    prerequisites:
      - id: derivatives-sin-cos
        weight: 0.8
        key: true
      - id: chain-rule
        weight: 0.7
        key: true
      - id: reciprocal-trig-functions
        weight: 0.4
      - id: trig-identities-basic
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: All six trig derivatives
        key_prerequisites: [derivatives-sin-cos]
        step_check:
          step: 'Simplify the numerator'
          question: 'Why does the numerator $-\sin^2 x - \cos^2 x$ simplify to $-1$?'
          options:
            - 'Each squared term equals $\tfrac12$, and the signs add up to $-1$'
            - 'The squares of sine and cosine are equal, so they merge into one'
            - 'Taking out $-1$ leaves $\sin^2 x + \cos^2 x$, which equals $1$'
            - 'The two squared terms cancel, and only the sign is left'
          answer: 'Taking out $-1$ leaves $\sin^2 x + \cos^2 x$, which equals $1$'
          why: 'Factoring out $-1$ leaves $\sin^2 x + \cos^2 x$, which is $1$ for every $x$, so the numerator is $-1$ and the result is $-\csc^2 x$.'
        exemplars:
          - problem: 'Differentiate $f(x) = \tan x$.'
            answer: "sec(x)^2"
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'Write $\tan x = \frac{\sin x}{\cos x}$ and use the quotient rule: $\frac{\cos^2 x + \sin^2 x}{\cos^2 x}$. This is $\frac{1}{\cos^2 x}$, so $f''(x) = \sec^2 x$.'
          - problem: 'Differentiate $f(x) = \sec x$.'
            answer: "sec(x)tan(x)"
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'Write $\sec x = (\cos x)^{-1}$, so $f''(x) = -(\cos x)^{-2}(-\sin x) = \frac{\sin x}{\cos^2 x}$. This is $f''(x) = \sec x\tan x$.'
          - problem: 'Differentiate $f(x) = \csc x$.'
            answer: "-csc(x)cot(x)"
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'Write $\csc x = (\sin x)^{-1}$, so $f''(x) = -(\sin x)^{-2}\cos x = -\frac{\cos x}{\sin^2 x}$. This is $f''(x) = -\csc x\cot x$.'
          - problem: 'Differentiate $f(x) = \cot x$.'
            answer: "-csc(x)^2"
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'Write $\cot x = \frac{\cos x}{\sin x}$ and use the quotient rule: $\frac{-\sin^2 x - \cos^2 x}{\sin^2 x}$. This is $-\frac{1}{\sin^2 x}$, so $f''(x) = -\csc^2 x$.'
          - problem: 'Differentiate $f(x) = 3\tan x - 2\sec x$.'
            answer: "3sec(x)^2-2sec(x)tan(x)"
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'Use $(\tan x)'' = \sec^2 x$ and $(\sec x)'' = \sec x\tan x$ term by term. So $f''(x) = 3\sec^2 x - 2\sec x\tan x$.'
          - problem: 'Differentiate $f(x) = \cot x + 4\csc x$.'
            answer: "-csc(x)^2-4csc(x)cot(x)"
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'Use $(\cot x)'' = -\csc^2 x$ and $(\csc x)'' = -\csc x\cot x$ term by term. So $f''(x) = -\csc^2 x - 4\csc x\cot x$.'
          - problem: 'A camera stands $1$ kilometre from a straight road and follows a car. When the camera is turned through an angle $\theta$ from the nearest point of the road, the car is $y = \tan\theta$ kilometres along the road. At what rate, in kilometres per radian, does $y$ change at $\theta = \pi/3$?'
            answer: "4"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The rate is $\frac{dy}{d\theta} = \sec^2\theta$. At $\theta = \pi/3$ we have $\cos\theta = \frac12$, so $\sec^2\theta = 4$ kilometres per radian.'
          - problem: 'A pole $1$ metre tall casts a shadow of length $L = \cot\theta$ metres when the sun is at angle $\theta$ above the horizon. At what rate, in metres per radian, does $L$ change at $\theta = \pi/6$?'
            answer: "-4"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The rate is $\frac{dL}{d\theta} = -\csc^2\theta$. At $\theta = \pi/6$ we have $\sin\theta = \frac12$, so $-\csc^2\theta = -4$ metres per radian.'
          - problem: 'Is the graph of $y = \cot x$ increasing or decreasing wherever it is defined?'
            answer: "decreasing"
            answer_contract: {"kind":"label","options":[["decreasing","it is decreasing","falling"],["increasing","it is increasing","rising"]]}
            solution_sketch: 'The derivative is $-\csc^2 x$, which is negative wherever it is defined. So the graph of $y = \cot x$ is decreasing on each piece.'
        constraints: "tan, cot, sec, csc, alone or in sums with integer coefficients; derivations via the quotient rule accepted, memorized forms required; rates in context"
      - id: kp2
        name: Trig derivatives with the chain rule
        key_prerequisites: [chain-rule, derivatives-sin-cos]
        step_check:
          step: 'the derivative of $4x$ is $4$'
          question: 'Why does the factor $4$ appear in the final answer?'
          options:
            - 'The coefficient of $x$ becomes an exponent, and the power rule brings it down'
            - 'The input $4x$ moves $4$ times as fast as $x$, scaling the outer rate'
            - 'The derivative of cosine carries the same constant for every input'
            - 'Every trig derivative gains a factor equal to its highest power'
          answer: 'The input $4x$ moves $4$ times as fast as $x$, scaling the outer rate'
          why: 'The inside $4x$ changes $4$ units for each unit of $x$, so the rate of the outer cosine is multiplied by $4$.'
        try_first:
          problem: 'For small $x$, $\sin(2x)$ is close to $2x$, because $\sin u$ is close to $u$ when $u$ is small. Using this, what is the slope of $y = \sin(2x)$ at $x = 0$?'
          answer_contract: {"kind":"exact"}
          answer: '2'
          reveal: 'Near $x = 0$ the curve is close to the line $y = 2x$, whose slope is $2$. The chain rule agrees: $2\cos 0 = 2$, because the inside $2x$ changes twice as fast as $x$.'
        exemplars:
          - problem: 'Differentiate $f(x) = \sin(3x)$.'
            answer: "3cos(3x)"
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'The outer derivative is $\cos(3x)$ and the inner derivative is $3$. So $f''(x) = 3\cos(3x)$.'
          - problem: 'Differentiate $f(x) = \cos(x^2)$.'
            answer: "-2x sin(x^2)"
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'The outer derivative is $-\sin(x^2)$ and the inner derivative is $2x$. So $f''(x) = -2x\sin(x^2)$.'
          - problem: 'Differentiate $f(x) = \sin^2 x$.'
            answer: "2sin(x)cos(x)"
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'Write $f = (\sin x)^2$. The power rule gives $2\sin x$ and the inner derivative is $\cos x$, so $f''(x) = 2\sin x\cos x$.'
          - problem: 'Find the derivative of $f(x) = \tan(5x)$.'
            answer: "5sec(5x)^2"
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'The outer derivative is $\sec^2(5x)$ and the inner derivative is $5$. So $f''(x) = 5\sec^2(5x)$.'
          - problem: 'Find the derivative of $f(x) = \sec(x^2)$.'
            answer: "2x sec(x^2)tan(x^2)"
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'The outer derivative is $\sec(x^2)\tan(x^2)$ and the inner derivative is $2x$. So $f''(x) = 2x\sec(x^2)\tan(x^2)$.'
          - problem: 'Find the derivative of $f(x) = \cos^2(3x)$.'
            answer: "-6cos(3x)sin(3x)"
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'The power rule gives $2\cos(3x)$, then the cosine gives $-\sin(3x)$ and the inside gives $3$. So $f''(x) = -6\cos(3x)\sin(3x)$.'
          - problem: 'A weight on a spring has displacement $s(t) = 5\cos(2t)$ centimetres after $t$ seconds. What is its velocity, in centimetres per second, at $t = \pi/4$?'
            answer: "-10"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The velocity is $s''(t) = -10\sin(2t)$. At $t = \pi/4$ we have $\sin(\pi/2) = 1$, so the velocity is $-10$.'
          - problem: 'The height of the tide in a harbour is $h(t) = 3\sin\left(\frac{\pi t}{6}\right)$ metres at time $t$ hours. At what rate, in metres per hour, is the height changing at $t = 0$?'
            answer: "pi/2"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The rate is $h''(t) = 3\cdot\frac{\pi}{6}\cos\left(\frac{\pi t}{6}\right) = \frac{\pi}{2}\cos\left(\frac{\pi t}{6}\right)$. At $t = 0$ the cosine is $1$, so the rate is $\frac{\pi}{2}$ metres per hour.'
          - problem: 'The graph of $y = 3\sin(kx)$ has slope $12$ at the origin. Find $k$.'
            answer: "4"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The slope is $y'' = 3k\cos(kx)$, and at $x = 0$ this is $3k$. Setting $3k = 12$ gives $k = 4$.'
        constraints: "inner function bx or x^2, or an outer square of a trig function; integer multipliers; waves and tides in context"
      - id: kp3
        name: Products, quotients, and evaluation
        key_prerequisites: [derivatives-sin-cos, chain-rule]
        step_check:
          step: 'the numerator becomes $\cos x - 1$'
          question: 'Why does the numerator become $\cos x - 1$?'
          options:
            - 'The terms $\cos x$ and $\sin^2 x$ cancel in pairs'
            - 'The quotient rule leaves the first term of the numerator alone'
            - 'The squares are removed by taking square roots of the numerator'
            - 'The identity replaces $-\cos^2 x - \sin^2 x$ with $-1$'
          answer: 'The identity replaces $-\cos^2 x - \sin^2 x$ with $-1$'
          why: 'The numerator is $\cos x - (\cos^2 x + \sin^2 x)$, and the identity makes the bracket $1$, leaving $\cos x - 1$.'
        exemplars:
          - problem: 'Differentiate $f(x) = x\tan x$.'
            answer: "tan(x)+x sec(x)^2"
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'The product rule gives $(1)\tan x + x\sec^2 x$. So $f''(x) = \tan x + x\sec^2 x$.'
          - problem: 'For $f(x) = \sin(2x)$, find $f''(\pi/6)$.'
            answer: "1"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The chain rule gives $f''(x) = 2\cos(2x)$. At $x = \pi/6$ this is $2\cos(\pi/3) = 2\cdot\frac12 = 1$.'
          - problem: 'Differentiate $f(x) = \dfrac{\sin x}{1 + \cos x}$ and simplify.'
            answer: "1/(1+cos(x))"
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'The quotient rule gives $\frac{\cos x(1+\cos x) + \sin^2 x}{(1+\cos x)^2}$. The numerator is $\cos x + 1$, so $f''(x) = \frac{1}{1+\cos x}$.'
          - problem: 'Differentiate $f(x) = \sec x\tan x$.'
            answer: "sec(x)tan(x)^2+sec(x)^3"
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'The product rule gives $\sec x\tan x\cdot\tan x + \sec x\cdot\sec^2 x$. So $f''(x) = \sec x\tan^2 x + \sec^3 x$.'
          - problem: 'For $f(x) = x\sin x$, find $f''(\pi/3)$.'
            answer: "sqrt(3)/2+pi/6"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The product rule gives $f''(x) = \sin x + x\cos x$. At $x = \pi/3$ we have $\sin = \frac{\sqrt3}{2}$ and $\cos = \frac12$, so $f''(\pi/3) = \frac{\sqrt3}{2} + \frac{\pi}{6}$.'
          - problem: 'Find the derivative of $f(x) = \dfrac{\cos x}{1 + \sin x}$ and simplify.'
            answer: "-1/(1+sin(x))"
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'The quotient rule gives $\frac{-\sin x(1+\sin x) - \cos^2 x}{(1+\sin x)^2}$. The identity makes the numerator $-\sin x - 1$, so $f''(x) = -\frac{1}{1+\sin x}$.'
          - problem: 'A cart has position $s(t) = t\cos(2t)$ metres after $t$ seconds. What is its velocity at $t = \pi/4$?'
            answer: "-pi/2"
            answer_contract: {"kind":"unit","quantity":"speed","unit":"m/s","allow_omitted":true}
            solution_sketch: 'The product rule with the chain rule gives $s''(t) = \cos(2t) - 2t\sin(2t)$. At $t = \pi/4$ this is $0 - \frac{\pi}{2}$, so the velocity is $-\frac{\pi}{2}$ metres per second.'
          - problem: 'A lamp lights a table with brightness $B(\theta) = \dfrac{\sin\theta}{2 - \cos\theta}$ at an angle $\theta$ between $0$ and $\pi/2$. At what angle is the brightness greatest?'
            answer: "pi/3"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The quotient rule gives $B''(\theta) = \frac{\cos\theta(2-\cos\theta) - \sin^2\theta}{(2-\cos\theta)^2} = \frac{2\cos\theta - 1}{(2-\cos\theta)^2}$. This is zero when $\cos\theta = \frac12$, so $\theta = \pi/3$, and it changes from positive to negative there.'
          - problem: 'Kim differentiates $f(x) = x\sin(2x)$ and writes $\sin(2x) + x\cos(2x)$. What is the correct derivative?'
            answer: "sin(2x)+2x cos(2x)"
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'Kim left out the inner derivative of $\sin(2x)$. The product rule gives $\sin(2x) + x\cdot 2\cos(2x)$, so $f''(x) = \sin(2x) + 2x\cos(2x)$.'
        constraints: "evaluation angles from the unit circle; simplification via sin² + cos² = 1; velocity and brightness in context"
    diagnostic_exemplar:
      problem: 'Differentiate $f(x) = x\sec(2x)$.'
      answer: 'sec(2x) + 2x sec(2x) tan(2x)'
      solution_sketch: 'Product rule with a chain-rule factor: $\sec(2x) + x \cdot 2\sec(2x)\tan(2x)$.'
    anki_seeds:
      - front: "d/dx tan x = ?"
        back: "sec^2 x"
        type: basic
      - front: "d/dx sec x = ? and d/dx csc x = ?"
        back: "sec x tan x and -csc x cot x (co-functions carry the minus sign)"
        type: basic

  - id: second-derivatives
    name: Second Derivatives
    core: true
    difficulty: 0.52
    drill: false
    answer_kind: expression
    expected_time_secs: 90
    prerequisites:
      - id: derivative-power-rule
        weight: 0.7
        key: true
      - id: derivatives-of-polynomials
        weight: 0.5
        key: true
    knowledge_points:
      - id: kp1
        name: 'Compute second derivatives of polynomials'
        key_prerequisites: [derivative-power-rule, derivatives-of-polynomials]
        step_check:
          step: '$-9 \to 0$'
          question: 'Why does the term $-9$ become $0$ in the first derivative?'
          options:
            - 'The power rule only works on terms that contain $x$, so $-9$ is deleted'
            - 'A constant never changes, so the slope of its graph is $0$'
            - 'The constant is smaller than the other terms, so it is dropped'
            - 'The constant is saved for the second derivative, where it is used up'
          answer: 'A constant never changes, so the slope of its graph is $0$'
          why: 'The graph of a constant is a flat line, and a flat line has slope $0$ everywhere.'
        exemplars:
          - problem: 'Find $f''''(x)$ for $f(x) = x^4 + 3x^2 - 5x$.'
            answer: '12x^2 + 6'
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'The power rule gives $f''(x) = 4x^3 + 6x - 5$. Differentiate again: $4x^3 \to 12x^2$, $6x \to 6$ and $-5 \to 0$, so $f''''(x) = 12x^2 + 6$.'
          - problem: 'Find $f''''(x)$ for $f(x) = 2x^3 - x^2 + 5$.'
            answer: '12x - 2'
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'The first derivative is $f''(x) = 6x^2 - 2x$, because the constant $5$ drops out. The second derivative is $f''''(x) = 12x - 2$.'
          - problem: 'Find the second derivative of $f(x) = 3x^5 - 2x^3 + x$.'
            answer: '60x^3 - 12x'
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'The power rule gives $f''(x) = 15x^4 - 6x^2 + 1$. Differentiate each term again to get $f''''(x) = 60x^3 - 12x$.'
          - problem: 'The cost of producing $x$ bicycles is $C(x) = x^3 - 12x^2 + 60x + 500$ dollars. The marginal cost is $C''(x)$. Find $C''''(x)$, the rate at which the marginal cost changes.'
            answer: '6x - 24'
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'The marginal cost is $C''(x) = 3x^2 - 24x + 60$. Its rate of change is the second derivative $C''''(x) = 6x - 24$.'
          - problem: 'A colony has $P(t) = t^4 - 4t^3 + 10t$ thousand bacteria after $t$ hours. Find $P''''(t)$, the rate at which the growth rate $P''(t)$ is changing.'
            answer: '12t^2 - 24t'
            answer_contract: {"kind":"function","vars":["t"]}
            solution_sketch: 'The growth rate is $P''(t) = 4t^3 - 12t^2 + 10$. Differentiate it once more to get $P''''(t) = 12t^2 - 24t$.'
          - problem: 'Let $f(x) = -x^4 + 6x^2 - 3x + 1$. Compute $f''''(x)$.'
            answer: '-12x^2 + 12'
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'The first derivative is $f''(x) = -4x^3 + 12x - 3$. Differentiating again gives $f''''(x) = -12x^2 + 12$.'
          - problem: 'Sam differentiates $f(x) = 5x^4 - 3x^3 + 2x - 7$ twice and gets $60x^2 - 9x$. What is the correct second derivative?'
            answer: '60x^2 - 18x'
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'The first derivative is $f''(x) = 20x^3 - 9x^2 + 2$. In the second step $-9x^2 \to -18x$, so $f''''(x) = 60x^2 - 18x$. Sam forgot to multiply $-9$ by the exponent $2$.'
          - problem: 'Consider $f(x) = x^5 + 4x^3 - x^2 + 2x$. Determine $f''''(x)$.'
            answer: '20x^3 + 24x - 2'
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'The first derivative is $f''(x) = 5x^4 + 12x^2 - 2x + 2$. The second derivative is $f''''(x) = 20x^3 + 24x - 2$.'
          - problem: 'Find $f''''(x)$ for $f(x) = x^3(x - 2)$.'
            answer: '12x^2 - 12x'
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'Multiply out first: $f(x) = x^4 - 2x^3$. Then $f''(x) = 4x^3 - 6x^2$ and $f''''(x) = 12x^2 - 12x$.'
        constraints: 'polynomials of degree at most 5 with integer coefficients, including factored forms, cost and population word problems, and one named-person correction'
      - id: kp2
        name: 'Notation and evaluation'
        key_prerequisites: [derivative-power-rule]
        step_check:
          step: 'substitute $x = 1$ into the second-derivative formula'
          question: 'Why is $x = 1$ put into $f''''(x)$ only after the second derivative is found?'
          options:
            - 'The derivative rules need the letter $x$ to work with, so a number is never allowed in'
            - 'The value $f''''(1)$ is the height of the graph, so it must be read off last'
            - 'Putting $x = 1$ into $f$ first would give a constant, and its derivative is $0$'
            - 'Each derivative needs its own $x$-value, so the last one is chosen at the end'
          answer: 'Putting $x = 1$ into $f$ first would give a constant, and its derivative is $0$'
          why: 'A derivative describes how a function changes, so find the formula for $f''''$ first and then read its value at the point.'
        exemplars:
          - problem: 'For $f(x) = x^3 - 4x$, find $f''''(2)$.'
            answer: '12'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The first derivative is $f''(x) = 3x^2 - 4$ and the second is $f''''(x) = 6x$. At $x = 2$ this gives $f''''(2) = 12$.'
          - problem: 'For $y = 5x^2 - x$, find $\frac{d^2y}{dx^2}$.'
            answer: '10'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The first derivative is $\frac{dy}{dx} = 10x - 1$. Differentiating again gives $\frac{d^2y}{dx^2} = 10$, a constant.'
          - problem: 'The volume of water in a tank is $V(t) = t^3 - 6t^2 + 20$ litres after $t$ minutes. Find $V''''(3)$, in litres per minute per minute.'
            answer: '6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The first derivative is $V''(t) = 3t^2 - 12t$ and the second is $V''''(t) = 6t - 12$. At $t = 3$ this gives $18 - 12 = 6$.'
          - problem: 'The number of users of an app is $N(t) = t^4 - 3t^2 + t$ thousand after $t$ months. Find $N''''(2)$.'
            answer: '42'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The second derivative is $N''''(t) = 12t^2 - 6$, since $N''(t) = 4t^3 - 6t + 1$. At $t = 2$ this gives $48 - 6 = 42$.'
          - problem: 'For $f(x) = 3x^3 - 2x^2 + 5x$, find $f''''(1)$.'
            answer: '14'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The first derivative is $f''(x) = 9x^2 - 4x + 5$ and the second is $f''''(x) = 18x - 4$. At $x = 1$ this gives $18 - 4 = 14$.'
          - problem: 'For $y = 2x^4 - 3x^2 + x$, find $\frac{d^2y}{dx^2}$ at $x = 2$.'
            answer: '90'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Differentiate once: $y'' = 8x^3 - 6x + 1$. Differentiate again: $y'''' = 24x^2 - 6$. At $x = 2$ this gives $96 - 6 = 90$.'
          - problem: 'For $g(x) = x^4 - 2x^3 + 4x$, find $g''''(3)$.'
            answer: '72'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The first derivative is $g''(x) = 4x^3 - 6x^2 + 4$ and the second is $g''''(x) = 12x^2 - 12x$. At $x = 3$ this gives $108 - 36 = 72$.'
          - problem: 'For $y = 5x^3 - x^2 + 6x$, find $\frac{d^2y}{dx^2}$ at $x = -1$.'
            answer: '-32'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The first derivative is $y'' = 15x^2 - 2x + 6$ and the second is $y'''' = 30x - 2$. At $x = -1$ this gives $-30 - 2 = -32$.'
          - problem: 'For $f(x) = x^3 - 6x^2 + 2x$, for which value of $x$ is $f''''(x) = 0$?'
            answer: '2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The second derivative is $f''''(x) = 6x - 12$. Solve $6x - 12 = 0$ to get $x = 2$.'
        constraints: 'both prime and Leibniz notation; integer evaluations; word problems with a second derivative at a point; solving f''''(x) = 0'
      - id: kp3
        name: 'Velocity and acceleration'
        key_prerequisites: [derivative-power-rule, derivatives-of-polynomials]
        step_check:
          step: 'Differentiate once to get velocity'
          question: 'Why does one differentiation of position give the velocity?'
          options:
            - 'Velocity is the rate of change of position, and that is a derivative'
            - 'Velocity is the position at the moment $t$, and the derivative finds that moment'
            - 'Velocity is the total distance travelled so far, which a derivative adds up'
            - 'Velocity and acceleration are one quantity, so a single step is enough'
          answer: 'Velocity is the rate of change of position, and that is a derivative'
          why: 'A derivative is a rate of change: the derivative of position is velocity, and the derivative of velocity is acceleration.'
        exemplars:
          - problem: 'A particle moves along a line with position $s(t) = t^3 - 3t$ metres after $t$ seconds. Find its acceleration, in metres per second squared, at $t = 2$.'
            answer: '12'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The velocity is $v(t) = s''(t) = 3t^2 - 3$. The acceleration is $a(t) = v''(t) = 6t$, so $a(2) = 12$.'
          - problem: 'A cart''s position is $s(t) = 2t^2 + 3t - 1$ metres after $t$ seconds. Find its velocity, in metres per second, at $t = 4$.'
            answer: '19'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Velocity is the first derivative of position, so $v(t) = 4t + 3$. At $t = 4$ this gives $v(4) = 19$. The second derivative is not needed here.'
          - problem: 'A particle''s position is $s(t) = t^3 - 6t^2 + 5t$ metres after $t$ seconds. Find its acceleration as a function of $t$.'
            answer: '6t - 12'
            answer_contract: {"kind":"function","vars":["t"]}
            solution_sketch: 'The velocity is $v(t) = s''(t) = 3t^2 - 12t + 5$. The acceleration is $a(t) = v''(t) = 6t - 12$.'
          - problem: 'A particle''s position is $s(t) = t^3 - 6t^2 + 9t$ metres after $t$ seconds. At what time is its acceleration zero?'
            answer: '2'
            answer_contract: {"kind":"unit","quantity":"time","unit":"s","allow_omitted":true}
            solution_sketch: 'The acceleration is $a(t) = s''''(t) = 6t - 12$. Solve $6t - 12 = 0$ to get $t = 2$ seconds.'
          - problem: 'The particle with position $s(t) = t^3 - 6t^2 + 9t$ metres comes to rest at $t = 1$ second. Find its acceleration then, in metres per second squared.'
            answer: '-6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The velocity is $v(t) = 3t^2 - 12t + 9$, which is $0$ at $t = 1$. The acceleration is $a(t) = 6t - 12$, so $a(1) = -6$. The negative sign means the velocity is decreasing.'
          - problem: 'The velocity of a car is $v(t) = 3t^2 + 4t$ metres per second after $t$ seconds. Find its acceleration, in metres per second squared, at $t = 5$.'
            answer: '34'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The velocity is already given, so differentiate only once: $a(t) = v''(t) = 6t + 4$. At $t = 5$ this gives $a(5) = 34$.'
          - problem: 'An object moves with position $s(t) = t^4 - 2t^3 + t$ metres after $t$ seconds. Find its acceleration as a function of $t$.'
            answer: '12t^2 - 12t'
            answer_contract: {"kind":"function","vars":["t"]}
            solution_sketch: 'The velocity is $v(t) = 4t^3 - 6t^2 + 1$. The acceleration is $a(t) = v''(t) = 12t^2 - 12t$.'
          - problem: 'A ball dropped from a tower has height $h(t) = 80 - 5t^2$ metres after $t$ seconds. Find its acceleration, in metres per second squared.'
            answer: '-10'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The velocity is $h''(t) = -10t$. The acceleration is $h''''(t) = -10$, a constant. The negative sign shows the acceleration points downward.'
          - problem: 'A runner''s position is $s(t) = t^2 - 4t$ metres after $t$ seconds. Find the runner''s acceleration, in metres per second squared, at $t = 3$.'
            answer: '2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The velocity is $v(t) = 2t - 4$. The acceleration is $a(t) = 2$ for every $t$, so $a(3) = 2$.'
        constraints: 'polynomial position or velocity functions; acceleration, velocity and the time of zero acceleration; units named in the question'
    diagnostic_exemplar:
      problem: 'A particle''s position is $s(t) = t^3 + 2t^2$ metres at time $t$ seconds. Find its acceleration, in metres per second squared, at $t = 2$.'
      answer: '16'
      solution_sketch: 'Velocity $s\''(t) = 3t^2 + 4t$; acceleration $s\''\''(t) = 6t + 4$, so $s\''\''(2) = 16$ m/s².'
    anki_seeds:
      - front: "In physics terms, if s(t) is position then s'(t) and s''(t) are..."
        back: "velocity and acceleration"
        type: basic
      - front: "Two notations for the second derivative of y = f(x):"
        back: "f''(x) and d²y/dx²"
        type: basic

  - id: higher-order-derivatives
    name: Higher-Order Derivatives
    core: true
    difficulty: 0.58
    drill: false
    answer_kind: expression
    expected_time_secs: 90
    prerequisites:
      - id: second-derivatives
        weight: 0.8
        key: true
      - id: derivatives-trig
        weight: 0.4
      - id: derivative-power-rule
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: 'Third and higher derivatives of polynomials'
        key_prerequisites: [second-derivatives, derivative-power-rule]
        step_check:
          step: 'Differentiate $f''(x)$ term by term'
          question: 'Why is the second derivative found by differentiating $f''(x)$ and not $f(x)$ again?'
          options:
            - 'The function $f(x)$ can be differentiated only once, and then it is used up'
            - 'Taking $f(x)$ again would give the third derivative, not the second'
            - 'Using $f''(x)$ keeps the constant term, which $f(x)$ has already lost'
            - 'The second derivative is the derivative of the first derivative'
          answer: 'The second derivative is the derivative of the first derivative'
          why: 'Each order of derivative is the derivative of the one before it, so $f''''$ comes from $f''$ and $f''''''$ comes from $f''''$.'
        exemplars:
          - problem: 'Find $f''''''(x)$, the third derivative, for $f(x) = x^5$.'
            answer: '60x^2'
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'Differentiate three times with the power rule: $5x^4 \to 20x^3 \to 60x^2$. The third derivative is $60x^2$.'
          - problem: 'Find the fourth derivative of $f(x) = x^4$.'
            answer: '24'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Each derivative lowers the exponent by one: $4x^3 \to 12x^2 \to 24x \to 24$. The fourth derivative is the constant $24$.'
          - problem: 'Find $f''''''(x)$ for $f(x) = x^6$.'
            answer: '120x^3'
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'By the power rule $f''(x) = 6x^5$ and $f''''(x) = 30x^4$. Then $f''''''(x) = 120x^3$.'
          - problem: 'A particle''s position is $s(t) = t^4 - 2t^3 + 5t$ metres after $t$ seconds. The rate at which its acceleration changes is the third derivative $s''''''(t)$. Find $s''''''(3)$.'
            answer: '60'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Differentiate three times: $s''(t) = 4t^3 - 6t^2 + 5$, $s''''(t) = 12t^2 - 12t$ and $s''''''(t) = 24t - 12$. At $t = 3$ this gives $72 - 12 = 60$.'
          - problem: 'Find $f''''''(x)$ for $f(x) = 2x^5 - 3x^3$.'
            answer: '120x^2 - 18'
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'Term by term, $f''(x) = 10x^4 - 9x^2$ and $f''''(x) = 40x^3 - 18x$. Then $f''''''(x) = 120x^2 - 18$.'
          - problem: 'A drone''s height is $h(t) = t^5 - 10t^3 + 4t$ metres after $t$ seconds. Find $h''''''(2)$, the rate at which its acceleration is changing at $t = 2$ seconds.'
            answer: '180'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The third derivative is $h''''''(t) = 60t^2 - 60$, because $h''(t) = 5t^4 - 30t^2 + 4$ and $h''''(t) = 20t^3 - 60t$. At $t = 2$ this gives $240 - 60 = 180$.'
          - problem: 'Find the fourth derivative of $f(x) = 3x^5$.'
            answer: '360x'
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'The derivatives are $15x^4$, $60x^3$, $180x^2$ and finally $360x$. The fourth derivative is $360x$.'
          - problem: 'Sam wants the third derivative of $f(x) = 4x^6$ and stops after two differentiations, writing $120x^4$. What is the correct third derivative?'
            answer: '480x^3'
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'The first derivative is $24x^5$ and the second is $120x^4$, which is where Sam stopped. One more differentiation gives $f''''''(x) = 480x^3$.'
          - problem: 'Find the fifth derivative of $f(x) = x^5 + 7x^3 + 2x$.'
            answer: '120'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Only $x^5$ survives five differentiations, because the lower powers reach $0$ sooner. The fifth derivative of $x^5$ is $5 \cdot 4 \cdot 3 \cdot 2 \cdot 1 = 120$.'
        constraints: 'up to the fifth derivative; integer coefficients; position and height problems that use the third derivative; one named-person correction'
      - id: kp2
        name: 'Patterns in repeated differentiation'
        key_prerequisites: [second-derivatives, derivative-power-rule]
        step_check:
          step: 'multiply by the new exponent $-3$ and lower it again'
          question: 'Why is the second derivative of $x^{-2}$ found with the multiplier $-3$ and not $-2$?'
          options:
            - 'The sign flips each time, so the multiplier $-2$ becomes $-3$ in the second step'
            - 'After the first derivative the term is $-2x^{-3}$, so its exponent is now $-3$'
            - 'Each multiplier can be used only once, so $-2$ is replaced by the next one'
            - 'The sign of the multiplier stays but its size grows by $1$ each time, for every exponent'
          answer: 'After the first derivative the term is $-2x^{-3}$, so its exponent is now $-3$'
          why: 'The power rule always multiplies by the exponent the term has at that moment, and after one derivative that exponent is $-3$.'
        exemplars:
          - problem: 'Find the fifth derivative of $f(x) = x^4$.'
            answer: '0'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Each derivative lowers the degree by one: $4x^3$, $12x^2$, $24x$, $24$. The fourth derivative is a constant, so the fifth derivative is $0$.'
          - problem: 'Find $f''''(x)$ for $f(x) = \frac{1}{x}$.'
            answer: '2/x^3'
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'Write $f(x) = x^{-1}$. Then $f''(x) = -x^{-2}$ and $f''''(x) = 2x^{-3} = \frac{2}{x^3}$.'
          - problem: 'Find the sixth derivative of $f(x) = x^6$.'
            answer: '720'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The power rule gives $6x^5$, $30x^4$, $120x^3$, $360x^2$, $720x$ and finally $720$. The sixth derivative is $6! = 720$.'
          - problem: 'The illumination at distance $d$ metres from a lamp is $I(d) = \frac{4}{d^2}$ lux. Find $I''''(d)$, the rate at which the rate of change of the illumination changes.'
            answer: '24/d^4'
            answer_contract: {"kind":"function","vars":["d"]}
            solution_sketch: 'Write $I(d) = 4d^{-2}$. Then $I''(d) = -8d^{-3}$ and $I''''(d) = 24d^{-4} = \frac{24}{d^4}$.'
          - problem: 'Find the fourth derivative of $f(x) = x^5 + x^3$.'
            answer: '120x'
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'Differentiate term by term: $f''(x) = 5x^4 + 3x^2$, $f''''(x) = 20x^3 + 6x$, $f''''''(x) = 60x^2 + 6$ and $f''''''''(x) = 120x$. The constant $6$ disappears in the last step.'
          - problem: 'The cost per part is $C(n) = \frac{3}{n}$ dollars when $n$ parts are made in one batch. Find the third derivative $C''''''(n)$.'
            answer: '-18/n^4'
            answer_contract: {"kind":"function","vars":["n"]}
            solution_sketch: 'Write $C(n) = 3n^{-1}$. Then $C''(n) = -3n^{-2}$, $C''''(n) = 6n^{-3}$ and $C''''''(n) = -18n^{-4} = -\frac{18}{n^4}$.'
          - problem: 'Find the third derivative of $f(x) = \frac{1}{x}$.'
            answer: '-6/x^4'
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'Write $f(x) = x^{-1}$. Then $f''(x) = -x^{-2}$, $f''''(x) = 2x^{-3}$ and $f''''''(x) = -6x^{-4} = -\frac{6}{x^4}$.'
          - problem: 'Find the fourth derivative of $f(x) = \frac{1}{x^2}$.'
            answer: '120/x^6'
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'Write $f(x) = x^{-2}$. The derivatives are $-2x^{-3}$, $6x^{-4}$, $-24x^{-5}$ and $120x^{-6}$, so the fourth derivative is $\frac{120}{x^6}$.'
          - problem: 'The function $f(x) = 2x^4 - x^2 + 7$ is differentiated again and again. What is the smallest $n$ for which the $n$th derivative is $0$ for every $x$?'
            answer: '5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The highest power is $x^4$, so the fourth derivative is the constant $48$. The fifth derivative is $0$, so $n = 5$.'
        constraints: 'degree-drop and negative-power patterns; word problems with 1/x type functions; exploit structure instead of grinding'
      - id: kp3
        name: 'Repeated differentiation of trig functions'
        key_prerequisites: [derivatives-trig, second-derivatives]
        step_check:
          step: 'Check by the cycle: four steps returns to the starting function'
          question: 'Why do four differentiations bring $\cos x$ back to $\cos x$?'
          options:
            - 'An even number of derivatives always returns the original function'
            - 'The signs cancel after every second derivative, so four steps return $\cos x$'
            - 'The derivatives of $\cos x$ repeat in a cycle of length four'
            - 'Differentiating four times is the same as not differentiating, for any function'
          answer: 'The derivatives of $\cos x$ repeat in a cycle of length four'
          why: 'The list $\cos x$, $-\sin x$, $-\cos x$, $\sin x$ repeats every four derivatives, so the fourth derivative equals the starting function.'
        exemplars:
          - problem: 'Find the second derivative of $f(x) = \cos x$.'
            answer: '-cos(x)'
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'The first derivative is $f''(x) = -\sin x$. Differentiating again gives $f''''(x) = -\cos x$.'
          - problem: 'Find $f''''''(x)$, the third derivative, for $f(x) = \cos x$.'
            answer: 'sin(x)'
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'The cycle is $\cos x \to -\sin x \to -\cos x \to \sin x$. The third derivative is $\sin x$.'
          - problem: 'Find the fourth derivative of $f(x) = \cos x - \sin x$.'
            answer: 'cos(x) - sin(x)'
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'The derivatives are $-\sin x - \cos x$, then $-\cos x + \sin x$, then $\sin x + \cos x$. The fourth is $\cos x - \sin x$, the starting function.'
          - problem: 'A mass on a spring has position $s(t) = 3\sin t$ centimetres after $t$ seconds. The rate at which its acceleration changes is $s''''''(t)$. Find $s''''''(t)$.'
            answer: '-3cos(t)'
            answer_contract: {"kind":"function","vars":["t"]}
            solution_sketch: 'The derivatives are $s''(t) = 3\cos t$, then $s''''(t) = -3\sin t$, then $s''''''(t) = -3\cos t$. Each step moves one place along the sine and cosine cycle.'
          - problem: 'Find the tenth derivative of $f(x) = \sin x$.'
            answer: '-sin(x)'
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'The derivatives of $\sin x$ repeat every four steps, and $10 = 2 \cdot 4 + 2$. So the tenth derivative equals the second derivative, which is $-\sin x$.'
          - problem: 'The voltage in a circuit is $V(t) = 2\cos t - \sin t$ volts after $t$ seconds. Find $V''''(t)$.'
            answer: '-2cos(t) + sin(t)'
            answer_contract: {"kind":"function","vars":["t"]}
            solution_sketch: 'The first derivative is $V''(t) = -2\sin t - \cos t$. The second derivative is $V''''(t) = -2\cos t + \sin t$.'
          - problem: 'Find $f''''''(x)$ for $f(x) = \sin x + \cos x$.'
            answer: 'sin(x) - cos(x)'
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'The first derivative is $\cos x - \sin x$ and the second is $-\sin x - \cos x$. The third is $-\cos x + \sin x$.'
          - problem: 'Find the 100th derivative of $f(x) = \cos x$.'
            answer: 'cos(x)'
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'The cycle of $\cos x$ has length four, and $100 = 25 \cdot 4$. After a whole number of cycles the function is back to $\cos x$.'
          - problem: 'Find the fifth derivative of $f(x) = \sin x$ at $x = 0$.'
            answer: '1'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'One full cycle of four derivatives returns to $\sin x$, so the fifth derivative equals the first, which is $\cos x$. At $x = 0$ it is $\cos 0 = 1$.'
          - problem: 'Find the fourth derivative of $f(x) = \sin x$.'
            answer: 'sin(x)'
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'The cycle is $\sin x \to \cos x \to -\sin x \to -\cos x \to \sin x$, which has period 4. The fourth derivative is $\sin x$.'
        constraints: 'sin and cos only; exploit the 4-cycle; high orders by reducing modulo 4; spring and voltage word problems'
    diagnostic_exemplar:
      problem: 'Find $f''''''(x)$ (the third derivative) for $f(x) = x^4 + \sin x$.'
      answer: "24x - cos x"
      solution_sketch: 'Differentiate three times in turn: $4x^3 + \cos x$, then $12x^2 - \sin x$, then $24x - \cos x$.'
    anki_seeds:
      - front: "The derivatives of sin x cycle with period..."
        back: "4: sin → cos → -sin → -cos → sin"
        type: basic
      - front: "The nth derivative of x^n is ___; the (n+1)st is ___."
        back: "n!; 0"
        type: basic

  - id: derivatives-natural-exp
    name: Derivatives of e^x
    core: true
    difficulty: 0.58
    drill: false
    answer_kind: expression
    expected_time_secs: 90
    prerequisites:
      - id: chain-rule
        weight: 0.7
        key: true
      # Phase C (critical gap C-2, Wave-2 edge): e and e^x as a function are now
      # taught in foundations' natural-exponential-function — the learner no
      # longer meets e for the first time while being asked to differentiate it.
      - id: natural-exponential-function
        weight: 0.6
        key: true
      - id: exponential-functions
        weight: 0.5
        key: true
      - id: graphs-of-exponential-functions
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: 'e^x is its own derivative'
        key_prerequisites: [natural-exponential-function, exponential-functions]
        try_first:
          problem: 'The graph of $y = e^x$ passes through the point $(1, e)$. What is its slope at that point?'
          answer_contract: {"kind":"exact"}
          answer: 'e'
          reveal: 'The slope at $x = 1$ is $e$, the same as the height of the graph there. The slope of $y = e^x$ equals its height at every point, so $\frac{d}{dx}e^x = e^x$.'
        step_check:
          step: 'the derivative of $e^x$ is $e^x$ itself'
          question: 'Why does the term $7e^x$ stay $7e^x$ and not become $7xe^{x-1}$?'
          options:
            - 'Constants such as $7$ are never changed by differentiation'
            - 'The base $e$ is a constant, so its derivative is $0$'
            - 'The exponent holds $x$, so the power rule does not apply'
            - 'The power rule gives $xe^{x-1}$, and that simplifies to $e^x$'
          answer: 'The exponent holds $x$, so the power rule does not apply'
          why: 'The power rule is for a variable base with a fixed exponent. In $e^x$ the variable is in the exponent, and $e^x$ is its own derivative.'
        exemplars:
          - problem: 'Differentiate $f(x) = 5e^x + x^3$.'
            answer: '5e^x + 3x^2'
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'Differentiate term by term. The derivative of $5e^x$ is $5e^x$ and the derivative of $x^3$ is $3x^2$, so $f''(x) = 5e^x + 3x^2$.'
          - problem: 'Find the slope of the graph of $y = 4e^x - 3x^2$ at $x = 0$.'
            answer: '4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The derivative is $y'' = 4e^x - 6x$. At $x = 0$ this gives $4e^0 - 0 = 4$, because $e^0 = 1$.'
          - problem: 'Find the derivative of $f(x) = 4e^x - 2x^5$.'
            answer: '4e^x - 10x^4'
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'The derivative of $4e^x$ is $4e^x$, and the power rule gives $-10x^4$ for $-2x^5$. So $f''(x) = 4e^x - 10x^4$.'
          - problem: 'A population is $P(t) = 3e^t + t^2$ thousand after $t$ years. Find the growth rate $P''(t)$.'
            answer: '3e^t + 2t'
            answer_contract: {"kind":"function","vars":["t"]}
            solution_sketch: 'The growth rate is the derivative. The derivative of $3e^t$ is $3e^t$ and the derivative of $t^2$ is $2t$, so $P''(t) = 3e^t + 2t$.'
          - problem: 'Find the derivative of $f(x) = 7e^x + x^4 - 5x$.'
            answer: '7e^x + 4x^3 - 5'
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'The term $7e^x$ stays $7e^x$, $x^4$ gives $4x^3$ and $-5x$ gives $-5$. So $f''(x) = 7e^x + 4x^3 - 5$.'
          - problem: 'The value of an investment is $V(t) = 100e^t + 20t$ dollars after $t$ years. At what rate, in dollars per year, is the value changing at $t = 0$?'
            answer: '120'
            answer_contract: {"kind":"unit","quantity":"dollar","unit":"dollar","allow_omitted":true}
            solution_sketch: 'The rate of change is $V''(t) = 100e^t + 20$. At $t = 0$ this gives $100 + 20 = 120$, because $e^0 = 1$.'
          - problem: 'Sam differentiates $f(x) = e^x + x^2$ and writes $xe^{x-1} + 2x$. What is the correct derivative?'
            answer: 'e^x + 2x'
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'Sam used the power rule on $e^x$, but the variable is in the exponent. The derivative of $e^x$ is $e^x$, and the derivative of $x^2$ is $2x$, so $f''(x) = e^x + 2x$.'
          - problem: 'Find the derivative of $f(x) = e^x - 4x^3 + 2x^2$.'
            answer: 'e^x - 12x^2 + 4x'
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'The term $e^x$ gives $e^x$, the term $-4x^3$ gives $-12x^2$ and the term $2x^2$ gives $4x$. So $f''(x) = e^x - 12x^2 + 4x$.'
          - problem: 'At what value of $x$ does the graph of $y = e^x - 2x$ have a horizontal tangent line?'
            answer: 'ln(2)'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The slope is $y'' = e^x - 2$. A horizontal tangent needs $e^x - 2 = 0$, so $e^x = 2$ and $x = \ln 2$.'
        constraints: 'linear combinations of e^x and power terms; integer coefficients; growth and investment word problems; one named-person correction'
      - id: kp2
        name: 'e to a function, via the chain rule'
        key_prerequisites: [chain-rule]
        step_check:
          step: 'Apply the chain rule'
          question: 'Why is $e^{-3x^2}$ multiplied by $-6x$ in the derivative?'
          options:
            - 'The chain rule multiplies by the derivative of the exponent, $-6x$'
            - 'The product rule multiplies the exponential by the exponent itself'
            - 'Every derivative of an exponential must gain a factor of the exponent'
            - 'Each factor of the exponent is differentiated and the results are added'
          answer: 'The chain rule multiplies by the derivative of the exponent, $-6x$'
          why: 'The exponent $-3x^2$ is itself a function of $x$. The chain rule copies $e^{u}$ and multiplies by $u''$.'
        exemplars:
          - problem: 'Differentiate $f(x) = e^{3x}$.'
            answer: '3e^(3x)'
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'The inner function is $u = 3x$, and $u'' = 3$. By the chain rule $f''(x) = e^{3x} \cdot 3 = 3e^{3x}$.'
          - problem: 'Differentiate $f(x) = e^{x^2}$.'
            answer: '2x e^(x^2)'
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'The inner function is $u = x^2$, and $u'' = 2x$. By the chain rule $f''(x) = e^{x^2} \cdot 2x = 2xe^{x^2}$.'
          - problem: 'A sample of a radioactive element has mass $m(t) = 50e^{-2t}$ grams after $t$ days. At what rate, in grams per day, is the mass changing at $t = 0$?'
            answer: '-100'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The rate is $m''(t) = 50 \cdot (-2)e^{-2t} = -100e^{-2t}$. At $t = 0$ this gives $-100$. The negative sign shows the mass is falling.'
          - problem: 'Differentiate $f(x) = e^{-x^2}$.'
            answer: '-2x e^(-x^2)'
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'The inner function is $u = -x^2$, and $u'' = -2x$. By the chain rule $f''(x) = e^{-x^2} \cdot (-2x) = -2xe^{-x^2}$.'
          - problem: 'A bacterial population is $P(t) = 200e^{3t}$ after $t$ hours. How many times as large as the population $P(t)$ is its growth rate $P''(t)$?'
            answer: '3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The chain rule gives $P''(t) = 200 \cdot 3e^{3t} = 600e^{3t}$. Divide by $P(t) = 200e^{3t}$ to get $\frac{P''(t)}{P(t)} = 3$. The growth rate is $3$ times the population.'
          - problem: 'Compute the derivative of $g(x) = e^{-4x}$.'
            answer: '-4e^(-4x)'
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'The inner function is $u = -4x$, and $u'' = -4$. By the chain rule $g''(x) = -4e^{-4x}$.'
          - problem: 'Find the derivative of $y = e^{5x}$.'
            answer: '5e^(5x)'
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'The inner function is $u = 5x$, and $u'' = 5$. By the chain rule $\frac{dy}{dx} = 5e^{5x}$.'
          - problem: 'Sam differentiates $f(x) = e^{-2x}$ and writes $-e^{-2x}$. What is the correct derivative?'
            answer: '-2e^(-2x)'
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'Sam forgot the factor from the exponent. The inner function is $u = -2x$ with $u'' = -2$, so $f''(x) = -2e^{-2x}$.'
          - problem: 'Differentiate $f(x) = e^{x^2 + 3x}$.'
            answer: '(2x + 3)e^(x^2 + 3x)'
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'The inner function is $u = x^2 + 3x$, and $u'' = 2x + 3$. By the chain rule $f''(x) = (2x + 3)e^{x^2 + 3x}$.'
          - problem: 'Differentiate $f(x) = e^{x/2}$.'
            answer: '(1/2)e^(x/2)'
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'The inner function is $u = \frac{x}{2}$, and $u'' = \frac{1}{2}$. By the chain rule $f''(x) = \frac{1}{2}e^{x/2}$.'
        constraints: 'inner function bx, x^2, -x^2, x^2 + bx or x/2; integer parameters; decay and growth word problems'
      - id: kp3
        name: 'Products with e^x'
        key_prerequisites: [chain-rule, exponential-functions]
        step_check:
          step: 'The exponential factor gives $v''=2e^{2x}$'
          question: 'Why does the factor $v = e^{2x}$ have derivative $2e^{2x}$ and not $e^{2x}$?'
          options:
            - 'The product rule adds a $2$ because there are two factors in $f$'
            - 'The chain rule multiplies by the derivative of $2x$, namely $2$'
            - 'The exponent $2x$ is moved in front, as in the power rule'
            - 'The $2$ is the exponent left over from $x^3$ after it was lowered'
          answer: 'The chain rule multiplies by the derivative of $2x$, namely $2$'
          why: 'The exponent $2x$ is a function of $x$, so differentiating $e^{2x}$ needs the chain rule and brings out the factor $2$.'
        exemplars:
          - problem: 'Differentiate $f(x) = x^4e^{2x}$.'
            answer: '4x^3 e^(2x) + 2x^4 e^(2x)'
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'By the product rule $f''(x) = 4x^3e^{2x} + x^4 \cdot 2e^{2x}$. The chain rule gives the factor $2$ from the exponent $2x$.'
          - problem: 'Differentiate $f(x) = xe^x$.'
            answer: '(x + 1)e^x'
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'By the product rule $f''(x) = 1 \cdot e^x + x \cdot e^x = (x + 1)e^x$. No chain-rule factor appears because the exponent is just $x$.'
          - problem: 'Differentiate $g(x) = x^2e^{-3x}$.'
            answer: '2x e^(-3x) - 3x^2 e^(-3x)'
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'By the product rule $g''(x) = 2xe^{-3x} + x^2 \cdot (-3e^{-3x})$. The chain rule gives the factor $-3$ from the exponent.'
          - problem: 'The mass of a culture is $M(t) = t^3e^{4t}$ grams after $t$ hours. Find the rate of change $M''(t)$.'
            answer: '3t^2 e^(4t) + 4t^3 e^(4t)'
            answer_contract: {"kind":"function","vars":["t"]}
            solution_sketch: 'The mass is a product of $t^3$ and $e^{4t}$. The product rule gives $M''(t) = 3t^2e^{4t} + t^3 \cdot 4e^{4t}$, where the factor $4$ comes from the chain rule.'
          - problem: 'The concentration of a drug in the blood is $C(t) = te^{-t}$ milligrams per litre after $t$ hours. At what time $t$ is the rate of change $C''(t)$ equal to zero?'
            answer: '1'
            answer_contract: {"kind":"unit","quantity":"time","unit":"h","allow_omitted":true}
            solution_sketch: 'The product rule gives $C''(t) = e^{-t} - te^{-t} = (1 - t)e^{-t}$. The factor $e^{-t}$ is never $0$, so $C''(t) = 0$ when $1 - t = 0$, that is at $t = 1$.'
          - problem: 'Find the slope of the graph of $y = x^2e^x$ at $x = 1$.'
            answer: '3e'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The product rule gives $y'' = 2xe^x + x^2e^x = (2x + x^2)e^x$. At $x = 1$ this gives $(2 + 1)e = 3e$.'
          - problem: 'Find the derivative of $h(x) = x^5e^x$.'
            answer: '5x^4 e^x + x^5 e^x'
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'By the product rule $h''(x) = 5x^4e^x + x^5e^x$. The derivative of $e^x$ is $e^x$, so no extra factor appears.'
          - problem: 'Sam differentiates $f(x) = x^2e^x$ by multiplying the derivatives of the two factors and gets $2xe^x$. What is the correct derivative?'
            answer: '2x e^x + x^2 e^x'
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'The derivative of a product is not the product of the derivatives. The product rule gives $f''(x) = 2xe^x + x^2e^x$.'
          - problem: 'Differentiate $f(x) = x^2e^{3x}$.'
            answer: '2x e^(3x) + 3x^2 e^(3x)'
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'By the product rule $f''(x) = 2xe^{3x} + x^2 \cdot 3e^{3x}$. The chain rule gives the factor $3$ from the exponent.'
        constraints: 'one power factor times e^(bx); factored or expanded answers accepted; word problems with a rate, a zero of the rate and a slope'
    diagnostic_exemplar:
      problem: 'Differentiate $f(x) = x e^{2x}$.'
      answer: "e^(2x) + 2x e^(2x)"
      solution_sketch: 'Product rule with a chain-rule factor: $1 \cdot e^{2x} + x \cdot 2e^{2x}$.'
    anki_seeds:
      - front: "d/dx e^x = ?"
        back: "e^x — the exponential is its own derivative"
        type: basic
      - front: "d/dx e^(u(x)) = ?"
        back: "e^(u(x)) · u'(x)"
        type: basic

  - id: derivatives-natural-log
    name: Derivatives of ln x
    core: true
    difficulty: 0.6
    drill: false
    answer_kind: expression
    expected_time_secs: 90
    prerequisites:
      - id: derivatives-natural-exp
        weight: 0.6
        key: true
      - id: logarithm-properties
        weight: 0.5
        key: true
      - id: chain-rule
        weight: 0.5
    knowledge_points:
      - id: kp1
        name: 'The derivative of ln x'
        key_prerequisites: [derivatives-natural-exp, logarithm-properties]
        try_first:
          problem: 'The curve $y = e^x$ has slope $e$ at the point $(1, e)$. Reflect it in the line $y = x$ to get $y = \ln x$ with the point $(e, 1)$. A slope is turned into its reciprocal by this reflection. What is the slope of $y = \ln x$ at $(e, 1)$?'
          answer_contract: {"kind":"exact"}
          answer: '1/e'
          reveal: 'The slope is $\frac{1}{e}$, and $e$ is the $x$-value of the point. The slope of $y = \ln x$ is the reciprocal of $x$ at every point, so $\frac{d}{dx}\ln x = \frac{1}{x}$.'
        step_check:
          step: 'so the coefficient $6$ stays in front'
          question: 'Why does the coefficient $6$ stay in front when $6\ln x$ is differentiated?'
          options:
            - 'A coefficient is turned into an exponent, so $6\ln x$ becomes $\ln x^6$'
            - 'A constant factor stays outside while the rest is differentiated'
            - 'Constants are always placed in front of the answer and not used in it'
            - 'The coefficient $6$ differentiates to $0$ and is then multiplied back in'
          answer: 'A constant factor stays outside while the rest is differentiated'
          why: 'The constant multiple rule says $\frac{d}{dx}\left[c\,f(x)\right] = c\,f''(x)$, so the $6$ is kept and only $\ln x$ is differentiated.'
        exemplars:
          - problem: 'Differentiate $f(x) = 5\ln x - x^2$ for $x > 0$.'
            answer: '5/x - 2x'
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'The derivative of $\ln x$ is $\frac{1}{x}$, so $5\ln x$ gives $\frac{5}{x}$. The power rule gives $-2x$ for $-x^2$, so $f''(x) = \frac{5}{x} - 2x$.'
          - problem: 'Differentiate $f(x) = \ln x$ for $x > 0$.'
            answer: '1/x'
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'The derivative of the natural logarithm is $\frac{d}{dx}\ln x = \frac{1}{x}$ for $x > 0$. So $f''(x) = \frac{1}{x}$.'
          - problem: 'Find the derivative of $g(x) = 4\ln x + x^3$ for $x > 0$.'
            answer: '4/x + 3x^2'
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'The term $4\ln x$ gives $\frac{4}{x}$ and the term $x^3$ gives $3x^2$. So $g''(x) = \frac{4}{x} + 3x^2$.'
          - problem: 'Differentiate $f(x) = 5e^x - 2\ln x$ for $x > 0$.'
            answer: '5e^x - 2/x'
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'The term $5e^x$ gives $5e^x$ and the term $-2\ln x$ gives $-\frac{2}{x}$. So $f''(x) = 5e^x - \frac{2}{x}$.'
          - problem: 'A student''s score after $t$ hours of study is $S(t) = 20\ln t + 3t$ points, for $t > 0$. Find the rate of change $S''(t)$.'
            answer: '20/t + 3'
            answer_contract: {"kind":"function","vars":["t"]}
            solution_sketch: 'The derivative of $20\ln t$ is $\frac{20}{t}$ and the derivative of $3t$ is $3$. So $S''(t) = \frac{20}{t} + 3$.'
          - problem: 'The price of a share is $P(t) = 8\ln t + t$ dollars on day $t$, for $t > 0$. At what rate, in dollars per day, is the price changing on day $t = 2$?'
            answer: '5'
            answer_contract: {"kind":"unit","quantity":"dollar","unit":"dollar","allow_omitted":true}
            solution_sketch: 'The rate is $P''(t) = \frac{8}{t} + 1$. At $t = 2$ this gives $4 + 1 = 5$ dollars per day.'
          - problem: 'Find the derivative of $h(x) = 7e^x - 6\ln x$ for $x > 0$.'
            answer: '7e^x - 6/x'
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'The term $7e^x$ gives $7e^x$ and the term $-6\ln x$ gives $-\frac{6}{x}$. So $h''(x) = 7e^x - \frac{6}{x}$.'
          - problem: 'Find the derivative of $p(x) = x^5 + 2\ln x - 3e^x$ for $x > 0$.'
            answer: '5x^4 + 2/x - 3e^x'
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'The power rule gives $5x^4$, the log term gives $\frac{2}{x}$ and the exponential term gives $-3e^x$. Add them to get $p''(x) = 5x^4 + \frac{2}{x} - 3e^x$.'
          - problem: 'At what value of $x$ is the slope of the curve $y = 6\ln x$ equal to $2$?'
            answer: '3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The slope is $y'' = \frac{6}{x}$. Solve $\frac{6}{x} = 2$ to get $x = 3$.'
          - problem: 'Sam differentiates $f(x) = 6\ln x - x$ and writes $\frac{1}{6x} - 1$. What is the correct derivative?'
            answer: '6/x - 1'
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'A constant multiple stays in front of the derivative, so $6\ln x$ gives $\frac{6}{x}$. Sam divided by $6$ instead. The correct derivative is $f''(x) = \frac{6}{x} - 1$.'
        constraints: 'linear combinations of ln x, e^x, and power terms with integer coefficients; score, price and slope word problems; one named-person correction'
      - id: kp2
        name: 'ln of a function, via the chain rule'
        key_prerequisites: [chain-rule]
        step_check:
          step: 'Apply the pattern $\dfrac{u''}{u}$'
          question: 'Why does the derivative of $\ln(x^2 + 4)$ have $u'' = 2x$ on top?'
          options:
            - 'The top is the derivative of the whole function, found before the bottom'
            - 'The inside is differentiated twice, once for each part of $x^2 + 4$'
            - 'The numerator is $x^2 + 4$ differentiated and the denominator is its square'
            - 'The chain rule multiplies $\frac{1}{u}$ by the derivative of the inside'
          answer: 'The chain rule multiplies $\frac{1}{u}$ by the derivative of the inside'
          why: 'The derivative of $\ln u$ is $\frac{1}{u}$, and the chain rule multiplies it by $u''$, which gives $\frac{u''}{u}$.'
        exemplars:
          - problem: 'Differentiate $f(x) = \ln(x^2 + 1)$.'
            answer: '2x/(x^2 + 1)'
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'The inside is $u = x^2 + 1$, and $u'' = 2x$. The derivative is $\frac{u''}{u} = \frac{2x}{x^2 + 1}$.'
          - problem: 'Differentiate $f(x) = \ln(5x - 2)$.'
            answer: '5/(5x - 2)'
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'The inside is $u = 5x - 2$, and $u'' = 5$. The derivative is $\frac{u''}{u} = \frac{5}{5x - 2}$.'
          - problem: 'The perceived brightness of a lamp is $B(x) = \ln(2x + 1)$ when the light intensity is $x$ units. At what rate does $B$ change with $x$ when $x = 4$?'
            answer: '2/9'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The rate is $B''(x) = \frac{2}{2x + 1}$. At $x = 4$ the inside is $9$, so $B''(4) = \frac{2}{9}$.'
          - problem: 'Differentiate $f(x) = \ln(3x)$ for $x > 0$.'
            answer: '1/x'
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'The inside is $u = 3x$, and $u'' = 3$. The derivative is $\frac{3}{3x} = \frac{1}{x}$. The same result follows from $\ln 3x = \ln 3 + \ln x$.'
          - problem: 'A company''s profit is $P(t) = \ln(t^2 + 1)$ million dollars after $t$ years. Find the rate of change of the profit, in millions of dollars per year, at $t = 3$.'
            answer: '3/5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The rate is $P''(t) = \frac{2t}{t^2 + 1}$. At $t = 3$ this gives $\frac{6}{10} = \frac{3}{5}$.'
          - problem: 'With $y = \ln u$ and $u = 6x - 5$, find $\frac{dy}{dx}$.'
            answer: '6/(6x - 5)'
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'The chain rule says $\frac{dy}{dx} = \frac{1}{u} \cdot \frac{du}{dx}$, and $\frac{du}{dx} = 6$. So $\frac{dy}{dx} = \frac{6}{6x - 5}$.'
          - problem: 'Find the derivative of $f(x) = \ln(7x + 4)$.'
            answer: '7/(7x + 4)'
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'The inside is $u = 7x + 4$, and $u'' = 7$. The derivative is $\frac{u''}{u} = \frac{7}{7x + 4}$.'
          - problem: 'Find the derivative of $f(x) = \ln(x^2 + 9)$.'
            answer: '2x/(x^2 + 9)'
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'The inside is $u = x^2 + 9$, and $u'' = 2x$. The derivative is $\frac{u''}{u} = \frac{2x}{x^2 + 9}$.'
          - problem: 'For which value of $x$ is the slope of $y = \ln(2x + 1)$ equal to $\frac{1}{2}$?'
            answer: '3/2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The slope is $y'' = \frac{2}{2x + 1}$. Solve $\frac{2}{2x + 1} = \frac{1}{2}$ to get $2x + 1 = 4$, so $x = \frac{3}{2}$.'
          - problem: 'Sam differentiates $f(x) = \ln(x^2 + 5)$ and writes $\frac{1}{x^2 + 5}$. What is the correct derivative?'
            answer: '2x/(x^2 + 5)'
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'Sam forgot the derivative of the inside. The inside is $u = x^2 + 5$ with $u'' = 2x$, so $f''(x) = \frac{2x}{x^2 + 5}$.'
        constraints: 'inner function linear or x^2 + c; the general pattern u''/u; brightness and profit word problems; a slope condition'
      - id: kp3
        name: 'Simplify with log properties before differentiating'
        key_prerequisites: [logarithm-properties, chain-rule]
        step_check:
          step: 'The inside is a product of a power and a root'
          question: 'Why is the log expanded into a sum before it is differentiated?'
          options:
            - 'A log of a product is a sum of logs, and sums are easy to differentiate'
            - 'A log cannot be differentiated until its inside has been reduced to one term'
            - 'The product rule works only on terms that are added, not on a log'
            - 'Expanding changes the function, but its derivative stays the same'
          answer: 'A log of a product is a sum of logs, and sums are easy to differentiate'
          why: 'The log rules turn the product into a sum of simple logs. Each simple log has a derivative of the form $\frac{u''}{u}$.'
        exemplars:
          - problem: 'Differentiate $f(x) = \ln(x^3)$ for $x > 0$.'
            answer: '3/x'
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'By the power rule for logarithms $\ln(x^3) = 3\ln x$. The derivative is $\frac{3}{x}$.'
          - problem: 'Use the properties of logarithms to differentiate $f(x) = \ln\left(x^2(x + 1)\right)$ for $x > 0$.'
            answer: '2/x + 1/(x + 1)'
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'The product rule for logarithms gives $\ln\left(x^2(x + 1)\right) = 2\ln x + \ln(x + 1)$. Differentiate term by term to get $\frac{2}{x} + \frac{1}{x + 1}$.'
          - problem: 'Differentiate $f(x) = \ln\sqrt{x}$ for $x > 0$.'
            answer: '1/(2x)'
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'Write $\ln\sqrt{x} = \frac{1}{2}\ln x$. The derivative is $\frac{1}{2} \cdot \frac{1}{x} = \frac{1}{2x}$.'
          - problem: 'The signal strength at distance $d$ metres is $L(d) = \ln\left(d^3(d + 4)\right)$ for $d > 0$. Find the rate of change of $L$ at $d = 2$.'
            answer: '5/3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Expand: $L(d) = 3\ln d + \ln(d + 4)$. Then $L''(d) = \frac{3}{d} + \frac{1}{d + 4}$. At $d = 2$ this gives $\frac{3}{2} + \frac{1}{6} = \frac{5}{3}$.'
          - problem: 'Find the derivative of $f(x) = \ln\left(x^2\sqrt{x + 1}\right)$ for $x > 0$.'
            answer: '2/x + 1/(2x + 2)'
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'Expand with the log rules: $\ln\left(x^2\sqrt{x + 1}\right) = 2\ln x + \frac{1}{2}\ln(x + 1)$. The derivative is $\frac{2}{x} + \frac{1}{2(x + 1)} = \frac{2}{x} + \frac{1}{2x + 2}$.'
          - problem: 'A model gives the yield as $Y(x) = \ln\left(\frac{x^2}{x + 1}\right)$ for $x > 0$. Find $Y''(1)$.'
            answer: '3/2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The quotient rule for logarithms gives $Y(x) = 2\ln x - \ln(x + 1)$. Then $Y''(x) = \frac{2}{x} - \frac{1}{x + 1}$, so $Y''(1) = 2 - \frac{1}{2} = \frac{3}{2}$.'
          - problem: 'Find the derivative of $f(x) = \ln\left(x^4(x + 2)\right)$ for $x > 0$.'
            answer: '4/x + 1/(x + 2)'
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'Expand: $\ln\left(x^4(x + 2)\right) = 4\ln x + \ln(x + 2)$. The derivative is $\frac{4}{x} + \frac{1}{x + 2}$.'
          - problem: 'Find the derivative of $f(x) = \ln\left(\frac{\sqrt{x}}{x + 5}\right)$ for $x > 0$.'
            answer: '1/(2x) - 1/(x + 5)'
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'Expand with the log rules: $\ln\left(\frac{\sqrt{x}}{x + 5}\right) = \frac{1}{2}\ln x - \ln(x + 5)$. The derivative is $\frac{1}{2x} - \frac{1}{x + 5}$.'
          - problem: 'Sam differentiates $f(x) = \ln\left(x^2(x + 3)\right)$ for $x > 0$ and writes $\frac{2}{x} \cdot \frac{1}{x + 3}$. What is the correct derivative?'
            answer: '2/x + 1/(x + 3)'
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'A log of a product is a sum of logs, so the two derivatives are added and not multiplied. Expand to $2\ln x + \ln(x + 3)$ and get $f''(x) = \frac{2}{x} + \frac{1}{x + 3}$.'
        constraints: 'products, powers, quotients and roots inside the log; expand with log rules before differentiating; signal and yield word problems'
    diagnostic_exemplar:
      problem: 'Differentiate $f(x) = \ln\left(\frac{x^2}{x + 3}\right)$ for $x > 0$ (simplify with log properties first).'
      answer: "2/x - 1/(x + 3)"
      solution_sketch: 'Split the log first: $\ln\left(\frac{x^2}{x+3}\right) = 2\ln x - \ln(x+3)$, whose derivative is $\frac{2}{x} - \frac{1}{x+3}$.'
    anki_seeds:
      - front: "d/dx ln x = ?"
        back: "1/x (for x > 0)"
        type: basic
      - front: "d/dx ln(u(x)) = ?"
        back: "u'(x)/u(x)"
        type: basic

  - id: derivatives-exp-log
    name: Derivatives of Exponential and Logarithmic Functions
    core: true
    difficulty: 0.63
    drill: false
    answer_kind: expression
    expected_time_secs: 120
    prerequisites:
      - id: derivatives-natural-exp
        weight: 0.7
        key: true
      - id: derivatives-natural-log
        weight: 0.7
        key: true
      - id: change-of-base-formula
        weight: 0.4
      - id: product-quotient-rules
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: 'General exponential bases'
        key_prerequisites: [derivatives-natural-exp]
        constraints: 'bases 2, 3, 5 or 10; the function answers are written with base e, for example ln(2)e^(x ln(2)), because the answer grammar refuses a letter-base power; other items ask for a value or a rate'
        step_check:
          step: 'since $4\ln 5$ is a constant'
          question: 'Why is the derivative of the inner function $4x\ln 5$ just $4\ln 5$?'
          options:
            - 'The factor $\ln 5$ is a number, so $4x\ln 5$ is a constant times $x$'
            - 'The logarithm $\ln 5$ differentiates to $\frac{1}{5}$ and then drops out'
            - 'The exponent of $e$ is always differentiated by removing the variable'
            - 'The $x$ is removed because $e^{u}$ has the same derivative as $u$'
          answer: 'The factor $\ln 5$ is a number, so $4x\ln 5$ is a constant times $x$'
          why: 'Here $\ln 5\approx 1.61$ is a fixed number, so $4x\ln 5$ is a linear function of $x$ with slope $4\ln 5$.'
        exemplars:
          - problem: 'Write $2^x$ as a power of $e$ and use it to differentiate $f(x) = 2^x$.'
            answer: 'ln(2)e^(x ln(2))'
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'Since $2 = e^{\ln 2}$, we have $2^x = e^{x\ln 2}$. The chain rule gives the derivative $e^{x\ln 2}\cdot\ln 2$, which equals $2^x\ln 2$.'
          - problem: 'Find $f''(0)$ for $f(x) = 5^x$.'
            answer: 'ln(5)'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The derivative of $5^x$ is $5^x\ln 5$. At $x = 0$ the factor $5^0$ equals $1$, so $f''(0) = \ln 5$.'
          - problem: 'A culture starts with $500$ bacteria and doubles every hour, so there are $P(t) = 500 \cdot 2^t$ bacteria after $t$ hours. How fast is the population growing at $t = 3$ hours, in bacteria per hour, to the nearest whole number?'
            answer: '2773'
            answer_contract: {"kind":"approx","decimals":0}
            solution_sketch: 'The rate is $P''(t) = 500\cdot 2^t\ln 2$. At $t = 3$ this is $4000\ln 2$, which is about $2773$ bacteria per hour.'
          - problem: 'Differentiate $f(x) = 3^{2x}$ by writing it as a power of $e$.'
            answer: '2ln(3)e^(2x ln(3))'
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'Write $3^{2x} = e^{2x\ln 3}$. The exponent has slope $2\ln 3$, so the chain rule gives $2\ln 3\cdot e^{2x\ln 3}$.'
          - problem: 'A car is worth $V(t) = 20000\cdot 0.8^t$ dollars after $t$ years. At what rate is its value changing at $t = 2$, in dollars per year, to the nearest dollar?'
            answer: '-2856'
            answer_contract: {"kind":"approx","decimals":0}
            solution_sketch: 'The rate is $V''(t) = 20000\cdot 0.8^t\ln 0.8$. At $t = 2$ this is $12800\ln 0.8$, which is about $-2856$ dollars per year, so the value is falling.'
          - problem: 'Sam differentiates $f(x) = 3^x$ with the power rule and writes $x\cdot 3^{x-1}$. What is the correct value of $f''(1)$?'
            answer: '3 ln(3)'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The power rule needs a variable base and a fixed exponent, but here the base is fixed. The correct derivative is $3^x\ln 3$, so $f''(1) = 3\ln 3$.'
          - problem: 'A population is $P(t) = 500\cdot 2^t$. What fraction of its current size does it gain per hour, that is, what is $\frac{P^{\prime}(t)}{P(t)}$?'
            answer: 'ln(2)'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'We have $P''(t) = 500\cdot 2^t\ln 2$. Dividing by $P(t) = 500\cdot 2^t$ cancels everything except $\ln 2$, about $0.69$ per hour.'
          - problem: 'Differentiate $f(x) = 10^{x/2}$ by writing it as a power of $e$.'
            answer: '(ln(10)/2)e^(x ln(10)/2)'
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'Write $10^{x/2} = e^{(x/2)\ln 10}$. The exponent has slope $\frac{\ln 10}{2}$, so the derivative is $\frac{\ln 10}{2}e^{(x/2)\ln 10}$.'
          - problem: 'Find the slope of the tangent line to $y = 2^x$ at $x = 3$.'
            answer: '8 ln(2)'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The derivative of $2^x$ is $2^x\ln 2$. At $x = 3$ this is $2^3\ln 2 = 8\ln 2$.'
      - id: kp2
        name: 'General logarithmic bases'
        key_prerequisites: [derivatives-natural-log, change-of-base-formula]
        constraints: 'convert to natural logs by change of base; inner functions linear or x^2 + c; contexts give a log-base-10 or log-base-2 model'
        step_check:
          step: 'Since $\ln 5$ is a constant'
          question: 'Why can the factor $\frac{1}{\ln 5}$ stay in front while $\ln(x^2+4)$ is differentiated?'
          options:
            - 'The number $\ln 5$ differentiates to zero, so only the other factor is left'
            - 'Every logarithm in the denominator is moved outside by the quotient rule'
            - 'The number $\ln 5$ does not depend on $x$, so it is a constant factor'
            - 'The constant is removed first because $\ln(x^2+4)$ has no variable of its own'
          answer: 'The number $\ln 5$ does not depend on $x$, so it is a constant factor'
          why: 'A constant factor can be taken out of a derivative, so $\frac{1}{\ln 5}$ simply multiplies the derivative of $\ln(x^2+4)$.'
        exemplars:
          - problem: 'Differentiate $f(x) = \log_2 x$.'
            answer: '1/(x ln 2)'
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'By change of base, $\log_2 x = \frac{\ln x}{\ln 2}$. Since $\ln 2$ is a constant, the derivative is $\frac{1}{x\ln 2}$.'
          - problem: 'Differentiate $f(x) = \log_3(x^2 + 1)$.'
            answer: '2x/((x^2 + 1) ln 3)'
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'Write $f(x) = \frac{\ln(x^2+1)}{\ln 3}$. The chain rule gives $\frac{2x}{x^2+1}$ for the numerator, so $f^{\prime}(x) = \frac{2x}{(x^2+1)\ln 3}$.'
          - problem: 'The pH of a solution is $\mathrm{pH} = -\log_{10} c$, where $c$ is the concentration of hydrogen ions in moles per litre. Find $\frac{d\,\mathrm{pH}}{dc}$.'
            answer: '-1/(c ln 10)'
            answer_contract: {"kind":"function","vars":["c"]}
            solution_sketch: 'Change of base gives $\mathrm{pH} = -\frac{\ln c}{\ln 10}$. Differentiating, $\frac{d\,\mathrm{pH}}{dc} = -\frac{1}{c\ln 10}$, which is negative, so pH falls as the concentration rises.'
          - problem: 'Differentiate $f(x) = \log_{10}(3x + 5)$.'
            answer: '3/((3x + 5) ln 10)'
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'Write $f(x) = \frac{\ln(3x+5)}{\ln 10}$. The inner function $3x + 5$ has derivative $3$, so $f^{\prime}(x) = \frac{3}{(3x+5)\ln 10}$.'
          - problem: 'Searching a sorted list of $n$ items by repeated halving takes about $S(n) = \log_2 n$ steps. How fast does $S$ grow with $n$ when $n = 1024$, in steps per item?'
            answer: '1/(1024 ln 2)'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'We have $S(n) = \frac{\ln n}{\ln 2}$, so $S^{\prime}(n) = \frac{1}{n\ln 2}$. At $n = 1024$ the rate is $\frac{1}{1024\ln 2}$, about $0.0014$ steps per item.'
          - problem: 'Sam differentiates $f(x) = \log_7 x$ and writes $\frac{1}{x}$. What is the correct derivative?'
            answer: '1/(x ln 7)'
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'The derivative $\frac{1}{x}$ belongs to $\ln x$. Since $\log_7 x = \frac{\ln x}{\ln 7}$, the correct derivative is $\frac{1}{x\ln 7}$.'
          - problem: 'Find the slope of the tangent line to $y = \log_3 x$ at $x = 9$.'
            answer: '1/(9 ln 3)'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The derivative of $\log_3 x$ is $\frac{1}{x\ln 3}$. At $x = 9$ the slope is $\frac{1}{9\ln 3}$.'
          - problem: 'Find $f''(4)$ for $f(x) = \log_2(x^2)$.'
            answer: '1/(2 ln 2)'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Write $f(x) = \frac{\ln(x^2)}{\ln 2}$, so $f^{\prime}(x) = \frac{2x}{x^2\ln 2} = \frac{2}{x\ln 2}$. At $x = 4$ this is $\frac{1}{2\ln 2}$.'
          - problem: 'Differentiate $f(x) = \log_a x$, where $a > 1$ is a constant.'
            answer: '1/(x ln(a))'
            answer_contract: {"kind":"function","vars":["x","a"]}
            solution_sketch: 'By change of base, $\log_a x = \frac{\ln x}{\ln a}$, where $\ln a$ is a constant. The derivative is $\frac{1}{x\ln a}$.'
      - id: kp3
        name: 'Products and quotients of exponential and log factors'
        key_prerequisites: [derivatives-natural-exp, derivatives-natural-log, product-quotient-rules]
        constraints: 'one product or quotient mixing power, exponential and log factors; contexts ask for a rate or for the time when the rate is zero'
        step_check:
          step: 'choose $u = x^3$ and $v = e^x$'
          question: 'Why is the product rule used for $x^3 e^x$ instead of multiplying $3x^2$ by $e^x$?'
          options:
            - 'Only $x^3$ is differentiated, and $e^x$ is kept as it is'
            - 'The factor $e^x$ is its own derivative, so it needs no rule'
            - 'The product rule is needed only when the power of $x$ is above $2$'
            - 'The derivative of a product is not a product of derivatives'
          answer: 'The derivative of a product is not a product of derivatives'
          why: 'Both factors change with $x$, so each one contributes a term: $u^{\prime}v + uv^{\prime}$, and $3x^2\cdot e^x$ alone misses the $x^3e^x$ term.'
        exemplars:
          - problem: 'Differentiate $f(x) = x^2\ln x$.'
            answer: '2x ln x + x'
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'By the product rule, $f^{\prime}(x) = 2x\ln x + x^2\cdot\frac{1}{x}$. The last term simplifies to $x$, giving $2x\ln x + x$.'
          - problem: 'Differentiate $f(x) = \frac{e^x}{x}$.'
            answer: 'e^x(x - 1)/x^2'
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'By the quotient rule, $f^{\prime}(x) = \frac{e^x\cdot x - e^x\cdot 1}{x^2}$. Factoring $e^x$ from the numerator gives $\frac{e^x(x-1)}{x^2}$.'
          - problem: 'A new product earns revenue of $R(t) = t\,e^{-t/5}$ thousand dollars per month, $t$ months after launch. At what time $t$ does the revenue stop rising and start to fall?'
            answer: '5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The revenue stops rising where $R^{\prime}(t) = 0$. Here $R^{\prime}(t) = e^{-t/5}\left(1 - \frac{t}{5}\right)$, and $e^{-t/5}$ is never zero, so $t = 5$ months.'
          - problem: 'Differentiate $f(x) = e^x\ln x$.'
            answer: 'e^x(ln x + 1/x)'
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'By the product rule, $f^{\prime}(x) = e^x\ln x + e^x\cdot\frac{1}{x}$. Factoring out $e^x$ gives $e^x\left(\ln x + \frac{1}{x}\right)$.'
          - problem: 'The concentration of a drug in the blood is $C(t) = \frac{t^2}{e^t}$ mg per litre, $t$ hours after the dose. Find the rate of change of the concentration at $t = 3$, in mg per litre per hour.'
            answer: '-3/e^3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'By the quotient rule, $C^{\prime}(t) = \frac{2t e^t - t^2 e^t}{e^{2t}} = \frac{2t - t^2}{e^t}$. At $t = 3$ this is $\frac{6 - 9}{e^3} = -\frac{3}{e^3}$, so the concentration is falling.'
          - problem: 'Sam differentiates $f(x) = x\ln x$ by multiplying the derivatives of the two factors and writes $1\cdot\frac{1}{x}$. What is the correct derivative?'
            answer: 'ln x + 1'
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'The product rule adds two terms: $1\cdot\ln x + x\cdot\frac{1}{x}$. This simplifies to $\ln x + 1$.'
          - problem: 'Differentiate $f(x) = \frac{\ln x}{x^3}$.'
            answer: '(1 - 3 ln x)/x^4'
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'By the quotient rule, $f^{\prime}(x) = \frac{\frac{1}{x}\cdot x^3 - \ln x\cdot 3x^2}{x^6}$. Dividing the numerator and denominator by $x^2$ gives $\frac{1 - 3\ln x}{x^4}$.'
          - problem: 'Write $2^x$ as $e^{x\ln 2}$ and differentiate $f(x) = x\cdot 2^x$.'
            answer: 'e^(x ln(2))(1 + x ln(2))'
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'By the product rule, $f^{\prime}(x) = e^{x\ln 2} + x\ln 2\cdot e^{x\ln 2}$. Factoring out $e^{x\ln 2}$ gives $e^{x\ln 2}(1 + x\ln 2)$.'
          - problem: 'Differentiate $f(x) = \frac{\ln x}{e^x}$.'
            answer: '(1 - x ln x)/(x e^x)'
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'By the quotient rule, $f^{\prime}(x) = \frac{\frac{1}{x}e^x - \ln x\cdot e^x}{e^{2x}} = \frac{1/x - \ln x}{e^x}$. Multiplying the top and bottom by $x$ gives $\frac{1 - x\ln x}{x e^x}$.'
    diagnostic_exemplar:
      problem: 'Differentiate $f(x) = x \cdot 3^x$.'
      answer: "3^x (1 + x ln 3)"
      answer_contract: {kind: none}
      solution_sketch: 'Product rule with $\frac{d}{dx}3^x = 3^x\ln 3$: $3^x + x\,3^x\ln 3$, then factor out $3^x$.'
    anki_seeds:
      - front: "d/dx a^x = ?"
        back: "a^x · ln a"
        type: basic
      - front: "d/dx log_a x = ?"
        back: "1/(x ln a)"
        type: basic

  - id: derivatives-piecewise-functions
    name: Derivatives of Piecewise Functions
    core: false                # worked special case; differentiability stays core
    difficulty: 0.62
    drill: false
    answer_kind: numeric
    expected_time_secs: 150
    prerequisites:
      - id: differentiability
        weight: 0.7
        key: true
      - id: derivatives-of-polynomials
        weight: 0.5
        key: true
      - id: limits-piecewise-functions
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: 'Differentiate away from the seam'
        key_prerequisites: [derivatives-of-polynomials]
        constraints: 'points strictly inside one branch; differentiate that branch only; contexts give a rule that changes at a threshold (fares, tanks, tariffs)'
        step_check:
          step: '$5 \geq 2$, so the second branch $f(x) = 3x - 4$ governs here'
          question: 'Why is only the formula $3x - 4$ differentiated to find $f^{\prime}(5)$?'
          options:
            - 'Every formula is differentiated, and the one with the larger slope is kept'
            - 'The point $x = 5$ lies where $3x - 4$ defines the function, and nowhere else'
            - 'The formula $x^2 + 1$ has no derivative at any point beyond $x = 2$'
            - 'The derivative of a piecewise function is the derivative of its last formula'
          answer: 'The point $x = 5$ lies where $3x - 4$ defines the function, and nowhere else'
          why: 'Near $x = 5$ the values of $f$ come from $3x - 4$ alone, so the slope of the graph there is the slope of that formula.'
        exemplars:
          - problem: 'Let $f(x) = x^2$ for $x < 1$ and $f(x) = 2x - 1$ for $x \geq 1$. Find $f''(3)$.'
            answer: '2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Since $3 \geq 1$, only the branch $2x - 1$ applies at $x = 3$. Its derivative is $2$, so $f^{\prime}(3) = 2$.'
          - problem: 'Let $f(x) = x^2 + 4x$ for $x < 0$ and $f(x) = 3x - 1$ for $x \geq 0$. Find $f''(-3)$.'
            answer: '-2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Since $-3 < 0$, the branch $x^2 + 4x$ applies. Its derivative is $2x + 4$, which equals $-2$ at $x = -3$.'
          - problem: 'Let $f(x) = x^3 - x$ for $x \leq 2$ and $f(x) = 4x + 1$ for $x > 2$. Find $f''(0)$.'
            answer: '-1'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Since $0 \leq 2$, the branch $x^3 - x$ applies. Its derivative is $3x^2 - 1$, which equals $-1$ at $x = 0$.'
          - problem: 'A taxi charges $C(d) = 3 + 2d$ dollars for a trip of $d \leq 5$ kilometres and $C(d) = 13 + 1.5(d - 5)$ dollars for $d > 5$ kilometres. How fast does the fare grow per kilometre on an $8$ kilometre trip?'
            answer: '3/2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Since $8 > 5$, the second formula applies. Its derivative is $1.5$, so the fare grows by $1.5 = \frac{3}{2}$ dollars for each extra kilometre.'
          - problem: 'A tank fills so that its volume is $V(t) = t^2$ litres for $0 \leq t < 6$ minutes and $V(t) = 12t - 36$ litres for $t \geq 6$ minutes. At what rate is the volume changing at $t = 4$ minutes, in litres per minute?'
            answer: '8'
            answer_contract: {"kind":"unit","quantity":"flow","unit":"L/min","allow_omitted":true}
            solution_sketch: 'Since $4 < 6$, the formula $t^2$ applies. Its derivative is $2t$, which equals $8$ at $t = 4$.'
          - problem: 'Let $f(x) = 2x + 5$ for $x < 1$ and $f(x) = x^2 - 3x$ for $x \geq 1$. Find $f''(5)$.'
            answer: '7'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Since $5 \geq 1$, the branch $x^2 - 3x$ applies. Its derivative is $2x - 3$, which equals $7$ at $x = 5$.'
          - problem: 'Let $f(x) = x^3 + 2x$ for $x > -2$ and $f(x) = 6x - 4$ for $x \leq -2$. Find $f''(-1)$.'
            answer: '5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Since $-1 > -2$, the branch $x^3 + 2x$ applies. Its derivative is $3x^2 + 2$, which equals $5$ at $x = -1$.'
          - problem: 'Sam must find $f''(0)$ for $f(x) = x^2 - 3$ when $x < 1$ and $f(x) = 2x - 4$ when $x \geq 1$. He differentiates the second formula and gets $2$. What is the correct value?'
            answer: '0'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Since $0 < 1$, the first formula applies, not the second. Its derivative is $2x$, which equals $0$ at $x = 0$.'
      - id: kp2
        name: 'Check differentiability at the seam'
        key_prerequisites: [differentiability, derivatives-of-polynomials]
        constraints: 'check continuity first, then one-sided derivatives; polynomial branches; items ask for a derivative value, a one-sided derivative, a jump size or a yes/no verdict'
        try_first:
          problem: 'Let $f(x) = -x$ for $x < 0$ and $f(x) = x$ for $x \geq 0$, the graph of $|x|$. Is $f$ differentiable at $x = 0$?'
          answer_contract: {"kind":"label","options":[["yes","it is","it is differentiable","differentiable"],["no","it is not","it is not differentiable","not differentiable"]]}
          answer: 'no'
          reveal: 'The slope is $-1$ just left of $0$ and $+1$ just right of $0$, so there is no single tangent slope at $0$ even though the two pieces meet. A piecewise function needs matching slopes at the seam, and also matching values.'
        step_check:
          step: 'Continuity is a prerequisite for differentiability'
          question: 'Why is continuity checked at the seam before the one-sided slopes are compared?'
          options:
            - 'Equal slopes on both sides already prove that the two values are equal'
            - 'The slopes can be found only after the two branch values are made equal'
            - 'Continuity is the same as differentiability, so one test covers both'
            - 'A graph with a jump has no tangent there, whatever its slopes are'
          answer: 'A graph with a jump has no tangent there, whatever its slopes are'
          why: 'If the two branches meet at different heights, the graph breaks at the seam, so no single tangent line exists even when both slopes agree.'
        exemplars:
          - problem: 'Let $f(x) = x^2$ for $x < 3$ and $f(x) = 6x - 9$ for $x \geq 3$. Find $f''(3)$.'
            answer: '6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Both formulas give $9$ at $x = 3$, so $f$ is continuous there. The left slope $2x = 6$ equals the right slope $6$, so $f$ is differentiable and $f^{\prime}(3) = 6$.'
          - problem: 'Let $w(x) = x^2$ for $x < 2$ and $w(x) = 3x - 2$ for $x \geq 2$. At $x = 2$, is the graph of $w$ smooth, does it have a corner, or does it jump?'
            answer: 'corner'
            answer_contract: {"kind":"label","options":[["smooth","differentiable","a smooth point"],["corner","kink","a corner"],["jump","gap","a jump","discontinuity"]]}
            solution_sketch: 'Both formulas give $4$ at $x = 2$, so the graph does not jump. The left slope $2x = 4$ differs from the right slope $3$, so the graph has a corner at $x = 2$.'
          - problem: 'Let $f(x) = x^2 + 2x$ for $x < 1$ and $f(x) = 4x - 1$ for $x \geq 1$. Find $f''(1)$.'
            answer: '4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Both formulas give $3$ at $x = 1$, so $f$ is continuous there. The left slope $2x + 2 = 4$ equals the right slope $4$, so $f^{\prime}(1) = 4$.'
          - problem: 'Let $h(x) = x^3$ for $x < 2$ and $h(x) = 6x - 4$ for $x \geq 2$. Find the left-hand derivative of $h$ at $x = 2$.'
            answer: '12'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The left-hand derivative is the slope of the left formula $x^3$ at $x = 2$. Since $\frac{d}{dx}x^3 = 3x^2$, the value is $3 \cdot 4 = 12$.'
          - problem: 'Let $g(x) = x^2$ for $x < 1$ and $g(x) = 3x - 1$ for $x \geq 1$. By how much does the graph of $g$ jump at $x = 1$?'
            answer: '1'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The left formula gives $1^2 = 1$ at $x = 1$ and the right formula gives $3 - 1 = 2$. The graph jumps up by $2 - 1 = 1$, so $g$ is not differentiable at $x = 1$.'
          - problem: 'A car''s position in metres is $s(t) = t^2$ for $0 \leq t < 4$ seconds, while it speeds up, and $s(t) = 8t - 16$ for $t \geq 4$ seconds, at constant speed. What is its velocity at $t = 4$ seconds, in metres per second?'
            answer: '8'
            answer_contract: {"kind":"unit","quantity":"speed","unit":"m/s","allow_omitted":true}
            solution_sketch: 'Both formulas give $16$ metres at $t = 4$. The slope of $t^2$ is $2t = 8$ and the slope of $8t - 16$ is $8$, so the velocity at $t = 4$ is $8$ metres per second.'
          - problem: 'Let $p(x) = x^2 + 3x - 2$ for $x < 1$ and $p(x) = 5x - 3$ for $x \geq 1$. Find $p''(1)$.'
            answer: '5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Both formulas give $2$ at $x = 1$, so $p$ is continuous there. The left slope $2x + 3 = 5$ equals the right slope $5$, so $p^{\prime}(1) = 5$.'
          - problem: 'Let $q(x) = x^2 + 1$ for $x < 3$ and $q(x) = 5x - 4$ for $x \geq 3$. Find the right-hand derivative of $q$ at $x = 3$.'
            answer: '5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The right-hand derivative is the slope of the right formula $5x - 4$, which is $5$. The left formula gives $10$ and the right gives $11$ at $x = 3$, so $q$ is not differentiable there.'
          - problem: 'A courier charges $C(w) = 4w$ dollars for a parcel of $w < 5$ kilograms and $C(w) = 3w + 5$ dollars for $w \geq 5$ kilograms. By how many dollars does the price rise for each extra kilogram just above $5$ kilograms?'
            answer: '3'
            answer_contract: {"kind":"unit","quantity":"dollar","unit":"dollar","allow_omitted":true}
            solution_sketch: 'Both formulas give $20$ dollars at $5$ kilograms, so the price has no jump. Just above $5$ kilograms the price follows $3w + 5$, whose slope is $3$ dollars per kilogram.'
          - problem: 'Sam sees that both formulas have slope $4$ at $x = 2$ in $f(x) = x^2$ for $x < 2$ and $f(x) = 4x - 3$ for $x \geq 2$, so he says $f$ is differentiable at $x = 2$. Is Sam right?'
            answer: 'no'
            answer_contract: {"kind":"label","options":[["yes","he is right","sam is right","right"],["no","he is not right","sam is not right","he is wrong","sam is wrong","wrong","not right"]]}
            solution_sketch: 'The slopes agree, but the values do not: $x^2$ gives $4$ and $4x - 3$ gives $5$ at $x = 2$. The graph jumps, so $f$ is not differentiable at $x = 2$ and Sam is not right.'
      - id: kp3
        name: 'Choose constants to make a piecewise function differentiable'
        key_prerequisites: [differentiability, derivatives-of-polynomials]
        constraints: 'two unknowns or one; the slope equation and the continuity equation each yield an integer; contexts: a ramp joined to a curve and a cost rule joined to a cost curve'
        step_check:
          step: 'For differentiability the right slope must equal it'
          question: 'Why must the slope $a$ of the right piece equal the left slope $6$ at $x = 3$?'
          options:
            - 'One tangent line needs the slopes from both sides to match'
            - 'The right piece must start at the same height as the left piece does'
            - 'A line $ax + b$ always has the same slope as the parabola it follows'
            - 'The slope $6$ is the value of the left formula at $x = 3$, not its slope'
          answer: 'One tangent line needs the slopes from both sides to match'
          why: 'Matching slopes remove the corner at $x = 3$; the matching heights are a separate condition that fixes $b$.'
        exemplars:
          - problem: 'Find $a$ and $b$ so that $f(x) = x^2$ for $x \leq 4$ and $f(x) = ax + b$ for $x > 4$ is differentiable at $x = 4$.'
            answer: 'a = 8; b = -16'
            answer_contract: {"kind":"multipart","parts":[{"contract":{"kind":"exact"},"name":"a"},{"contract":{"kind":"exact"},"name":"b"}]}
            solution_sketch: 'The left slope at $x = 4$ is $2x = 8$, so $a = 8$. The values must also match: $16 = 4a + b = 32 + b$, so $b = -16$.'
          - problem: 'A cycling track follows the parabola $y = x^2$ for $0 \leq x \leq 3$, with $x$ and $y$ in metres, and then continues as a straight ramp $y = ax + b$ for $x > 3$. The two parts join with no corner. What is the equation of the ramp?'
            answer: 'y = 6x - 9'
            answer_contract: {"kind":"polynomial_relation"}
            solution_sketch: 'At $x = 3$ the parabola has height $9$ and slope $2x = 6$. The ramp must have slope $6$ and pass through $(3, 9)$, so $9 = 18 + b$ and $b = -9$, giving $y = 6x - 9$.'
          - problem: 'Find $a$ and $b$ so that $f(x) = ax^3$ for $x \leq 2$ and $f(x) = 24x + b$ for $x > 2$ is differentiable at $x = 2$.'
            answer: 'a = 2; b = -32'
            answer_contract: {"kind":"multipart","parts":[{"contract":{"kind":"exact"},"name":"a"},{"contract":{"kind":"exact"},"name":"b"}]}
            solution_sketch: 'The left slope is $3ax^2 = 12a$ and the right slope is $24$, so $a = 2$. The values match when $8a = 48 + b$, that is $16 = 48 + b$, so $b = -32$.'
          - problem: 'Find $a$ and $b$ so that $f(x) = ax + b$ for $x \leq 1$ and $f(x) = x^3$ for $x > 1$ is differentiable at $x = 1$.'
            answer: 'a = 3; b = -2'
            answer_contract: {"kind":"multipart","parts":[{"contract":{"kind":"exact"},"name":"a"},{"contract":{"kind":"exact"},"name":"b"}]}
            solution_sketch: 'The right slope at $x = 1$ is $3x^2 = 3$, so $a = 3$. The values match when $a + b = 1$, so $3 + b = 1$ and $b = -2$.'
          - problem: 'A shop charges $C(q) = q^2$ dollars for $q \leq 10$ items. Beyond $10$ items it charges $C(q) = aq + b$ dollars. The graph of $C$ has no jump and no corner at $q = 10$. Find $a$ and $b$.'
            answer: 'a = 20; b = -100'
            answer_contract: {"kind":"multipart","parts":[{"contract":{"kind":"exact"},"name":"a"},{"contract":{"kind":"exact"},"name":"b"}]}
            solution_sketch: 'At $q = 10$ the first rule has slope $2q = 20$, so $a = 20$. The prices match when $100 = 10a + b = 200 + b$, so $b = -100$.'
          - problem: 'Find $a$ and $b$ so that $f(x) = x^2 + a$ for $x \leq 2$ and $f(x) = bx + 3$ for $x > 2$ is differentiable at $x = 2$.'
            answer: 'a = 7; b = 4'
            answer_contract: {"kind":"multipart","parts":[{"contract":{"kind":"exact"},"name":"a"},{"contract":{"kind":"exact"},"name":"b"}]}
            solution_sketch: 'The left slope is $2x = 4$, so $b = 4$. The values match when $4 + a = 2b + 3 = 11$, so $a = 7$.'
          - problem: 'Find $a$ and $b$ so that $f(x) = ax^2 + 4x$ for $x \leq 2$ and $f(x) = x^3 + b$ for $x > 2$ is differentiable at $x = 2$.'
            answer: 'a = 2; b = 8'
            answer_contract: {"kind":"multipart","parts":[{"contract":{"kind":"exact"},"name":"a"},{"contract":{"kind":"exact"},"name":"b"}]}
            solution_sketch: 'The slopes match when $4a + 4 = 12$, so $a = 2$. The values match when $4a + 8 = 8 + b$, that is $16 = 8 + b$, so $b = 8$.'
          - problem: 'Find $k$ so that $f(x) = x^2 + k$ for $x \leq 1$ and $f(x) = 2x + 3$ for $x > 1$ is differentiable at $x = 1$.'
            answer: '4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Both slopes at $x = 1$ equal $2$, so only the values need to match. Then $1 + k = 5$, so $k = 4$.'
          - problem: 'Sam makes $f(x) = x^2$ for $x \leq 3$ and $f(x) = ax + b$ for $x > 3$ continuous by choosing $a = 2$ and $b = 3$, because then $9 = 3a + b$. What value of $a$ is needed for $f$ to be differentiable at $x = 3$?'
            answer: '6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Matching the values is not enough, because the slopes must also agree. The left slope at $x = 3$ is $2x = 6$, so $a = 6$.'
    diagnostic_exemplar:
      problem: 'Find $a$ and $b$ so that $f(x) = x^2$ for $x \leq 3$ and $f(x) = ax + b$ for $x > 3$ is differentiable at $x = 3$.'
      answer: "a = 6, b = -9"
      answer_contract: {kind: none}
      solution_sketch: 'Two conditions, slopes first: $2(3) = a$ gives $a = 6$, and then matching values, $3^2 = 6(3) + b$, gives $b = -9$.'
    anki_seeds:
      - front: "To make a piecewise function differentiable at its seam you need TWO equations:"
        back: "branch values equal (continuity) and branch derivatives equal (matching slopes)"
        type: basic
      - front: "Matching one-sided slopes at a seam is not enough on its own because..."
        back: "the function must also be continuous there — a jump with parallel slopes is still not differentiable"
        type: basic

  - id: implicit-differentiation-basic
    name: Implicit Differentiation Basics
    core: true
    difficulty: 0.6
    drill: false
    answer_kind: expression
    expected_time_secs: 150
    prerequisites:
      - id: chain-rule
        weight: 0.8
        key: true
      - id: literal-equations
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: 'Differentiate y-terms with the chain rule'
        key_prerequisites: [chain-rule]
        constraints: 'single y-power terms; every y-term picks up a dy/dx factor; some items give y and dy/dx as numbers at a point or tie the idea to rates of change in time'
        try_first:
          problem: 'If $y = x^2$, then $y^3 = x^6$. What is the value of $\frac{d}{dx}\left[y^3\right]$ at $x = 1$?'
          answer_contract: {"kind":"exact"}
          answer: '6'
          reveal: 'Differentiating $x^6$ gives $6x^5 = 6$ at $x = 1$. The chain rule agrees: $3y^2\cdot\frac{dy}{dx} = 3\cdot 1\cdot 2 = 6$, so every $y$-term carries the extra factor $\frac{dy}{dx}$.'
        step_check:
          step: 'because $y$ depends on $x$ we multiply by $\frac{dy}{dx}$'
          question: 'Why does the derivative of $y^5$ carry a factor $\frac{dy}{dx}$ while the derivative of $x^2$ does not?'
          options:
            - 'Every term on the left side of an equation gets a factor $\frac{dy}{dx}$'
            - 'The letter $y$ is a constant, so its derivative is written as $\frac{dy}{dx}$'
            - 'The power rule gives $5y^4$, but $y$ itself also changes with $x$'
            - 'A power above $4$ always needs an extra factor after differentiation'
          answer: 'The power rule gives $5y^4$, but $y$ itself also changes with $x$'
          why: 'The chain rule multiplies the outer derivative $5y^4$ by the derivative of the inner function $y$, which is $\frac{dy}{dx}$; the variable $x$ is its own input, so it needs no extra factor.'
        exemplars:
          - problem: 'Suppose $y$ is a function of $x$, and write $u = \frac{dy}{dx}$. Differentiate $y^4 + x^3$ with respect to $x$.'
            answer: '4y^3 u + 3x^2'
            answer_contract: {"kind":"function","vars":["x","y","u"]}
            solution_sketch: 'The chain rule gives $4y^3 u$ for the term $y^4$, because $y$ depends on $x$. The power rule gives $3x^2$ for $x^3$, so the derivative is $4y^3 u + 3x^2$.'
          - problem: 'Suppose $y$ is a function of $x$, and write $u = \frac{dy}{dx}$. Differentiate $x^4 + y^7 + 2x$ with respect to $x$.'
            answer: '7y^6 u + 4x^3 + 2'
            answer_contract: {"kind":"function","vars":["x","y","u"]}
            solution_sketch: 'The power rule gives $4x^3$ and $2$ for the $x$-terms. The chain rule gives $7y^6 u$ for $y^7$, so the derivative is $7y^6 u + 4x^3 + 2$.'
          - problem: 'Suppose $y$ is a function of $x$ with $y = 2$ and $\frac{dy}{dx} = 3$ when $x = 1$. Find the value of $\frac{d}{dx}\left[y^2\right]$ at $x = 1$.'
            answer: '12'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The chain rule gives $\frac{d}{dx}[y^2] = 2y\cdot\frac{dy}{dx}$. At $x = 1$ this is $2\cdot 2\cdot 3 = 12$.'
          - problem: 'The side $s$ of a square, in centimetres, changes with time $t$ in seconds. At one moment $s = 5$ and $\frac{ds}{dt} = 0.2$. At that moment, how fast is the area $s^2$ growing, in square centimetres per second?'
            answer: '2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'By the chain rule, $\frac{d}{dt}[s^2] = 2s\cdot\frac{ds}{dt}$. At that moment this is $2\cdot 5\cdot 0.2 = 2$ square centimetres per second.'
          - problem: 'Suppose $y$ is a function of $x$, and write $u = \frac{dy}{dx}$. Differentiate $5y^2 - 3x$ with respect to $x$.'
            answer: '10y u - 3'
            answer_contract: {"kind":"function","vars":["y","u"]}
            solution_sketch: 'The chain rule gives $10y u$ for $5y^2$, because $y$ depends on $x$. The term $-3x$ has derivative $-3$, so the result is $10y u - 3$.'
          - problem: 'The edge $x$ of a cube, in centimetres, grows with time $t$ in seconds. At one moment $x = 4$ and $\frac{dx}{dt} = 0.5$. At that moment, how fast is the volume $x^3$ growing, in cubic centimetres per second?'
            answer: '24'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'By the chain rule, $\frac{d}{dt}[x^3] = 3x^2\cdot\frac{dx}{dt}$. At that moment this is $3\cdot 16\cdot 0.5 = 24$ cubic centimetres per second.'
          - problem: 'Suppose $y$ is a function of $x$, and write $u = \frac{dy}{dx}$. Differentiate $x^3 + 9y^4$ with respect to $x$.'
            answer: '36y^3 u + 3x^2'
            answer_contract: {"kind":"function","vars":["x","y","u"]}
            solution_sketch: 'The chain rule gives $36y^3 u$ for $9y^4$, because $y$ depends on $x$. The power rule gives $3x^2$ for $x^3$, so the derivative is $36y^3 u + 3x^2$.'
          - problem: 'Suppose $y$ is a function of $x$, and write $u = \frac{dy}{dx}$. Differentiate $y^8 - x^2$ with respect to $x$.'
            answer: '8y^7 u - 2x'
            answer_contract: {"kind":"function","vars":["x","y","u"]}
            solution_sketch: 'The chain rule gives $8y^7 u$ for $y^8$, because $y$ depends on $x$. The power rule gives $-2x$ for $-x^2$, so the derivative is $8y^7 u - 2x$.'
          - problem: 'Suppose $y$ is a function of $x$, and write $u = \frac{dy}{dx}$. Sam differentiates $y^3$ with respect to $x$ and writes $3y^2$. What is the correct derivative?'
            answer: '3y^2 u'
            answer_contract: {"kind":"function","vars":["y","u"]}
            solution_sketch: 'Sam used the power rule only. Since $y$ depends on $x$, the chain rule adds the factor $u = \frac{dy}{dx}$, so the correct derivative is $3y^2 u$.'
      - id: kp2
        name: 'Solve for dy/dx (powers of x and y only)'
        key_prerequisites: [chain-rule, literal-equations]
        constraints: 'powers of x and y only, no mixed terms; solve for dy/dx; contexts give a curve (track, trade-off curve) and ask for its slope formula'
        step_check:
          step: 'Divide both sides by $8y$'
          question: 'Why is the equation $8y\,\frac{dy}{dx} = -6x$ divided by $8y$ and not just by $8$?'
          options:
            - 'The answer must have only $x$ in it, so every $y$ is divided out'
            - 'Both $8$ and $y$ multiply $\frac{dy}{dx}$, so divide by both'
            - 'Dividing by $8$ alone would leave a $y$ that cancels with $x$'
            - 'The factor $y$ is a constant, so it belongs with the number $8$'
          answer: 'Both $8$ and $y$ multiply $\frac{dy}{dx}$, so divide by both'
          why: 'Both $8$ and $y$ multiply $\frac{dy}{dx}$, so dividing by the whole product $8y$ leaves $\frac{dy}{dx}$ alone.'
        exemplars:
          - problem: 'Find $\frac{dy}{dx}$ for the circle $x^2 + y^2 = 25$.'
            answer: '-x/y'
            answer_contract: {"kind":"function","vars":["x","y"]}
            solution_sketch: 'Differentiating both sides gives $2x + 2y\frac{dy}{dx} = 0$. Solving for the derivative gives $\frac{dy}{dx} = -\frac{x}{y}$.'
          - problem: 'Find $\frac{dy}{dx}$ for $x^3 + y^3 = 6$.'
            answer: '-x^2/y^2'
            answer_contract: {"kind":"function","vars":["x","y"]}
            solution_sketch: 'Differentiating both sides gives $3x^2 + 3y^2\frac{dy}{dx} = 0$. Solving gives $\frac{dy}{dx} = -\frac{x^2}{y^2}$.'
          - problem: 'Find $\frac{dy}{dx}$ for $2x^2 + 3y^2 = 12$.'
            answer: '-2x/(3y)'
            answer_contract: {"kind":"function","vars":["x","y"]}
            solution_sketch: 'Differentiating both sides gives $4x + 6y\frac{dy}{dx} = 0$. Dividing by $6y$ gives $\frac{dy}{dx} = -\frac{4x}{6y} = -\frac{2x}{3y}$.'
          - problem: 'A running track follows the ellipse $4x^2 + 9y^2 = 36$, with $x$ and $y$ in kilometres. Find the formula for the slope $\frac{dy}{dx}$ of the track at a point $(x, y)$.'
            answer: '-4x/(9y)'
            answer_contract: {"kind":"function","vars":["x","y"]}
            solution_sketch: 'Differentiating gives $8x + 18y\frac{dy}{dx} = 0$. Solving for the derivative gives $\frac{dy}{dx} = -\frac{8x}{18y} = -\frac{4x}{9y}$.'
          - problem: 'Find $\frac{dy}{dx}$ for $3x^2 - y^3 = 7$.'
            answer: '2x/y^2'
            answer_contract: {"kind":"function","vars":["x","y"]}
            solution_sketch: 'Differentiating both sides gives $6x - 3y^2\frac{dy}{dx} = 0$. Solving gives $\frac{dy}{dx} = \frac{6x}{3y^2} = \frac{2x}{y^2}$.'
          - problem: 'Find $\frac{dy}{dx}$ for $5x^3 + 2y^2 = 14$.'
            answer: '-15x^2/(4y)'
            answer_contract: {"kind":"function","vars":["x","y"]}
            solution_sketch: 'Differentiating both sides gives $15x^2 + 4y\frac{dy}{dx} = 0$. Solving gives $\frac{dy}{dx} = -\frac{15x^2}{4y}$.'
          - problem: 'A bakery can make $x$ hundred loaves and $y$ hundred cakes in a day when $x^2 + 2y^2 = 100$. Find $\frac{dy}{dx}$, the change in cakes for each extra loaf.'
            answer: '-x/(2y)'
            answer_contract: {"kind":"function","vars":["x","y"]}
            solution_sketch: 'Differentiating gives $2x + 4y\frac{dy}{dx} = 0$. Solving gives $\frac{dy}{dx} = -\frac{2x}{4y} = -\frac{x}{2y}$, which is negative, so extra loaves cost cakes.'
          - problem: 'Sam differentiates $x^2 + 3y^2 = 10$ and writes $2x + 6y = 0$, leaving out the factor $\frac{dy}{dx}$. What is the correct $\frac{dy}{dx}$?'
            answer: '-x/(3y)'
            answer_contract: {"kind":"function","vars":["x","y"]}
            solution_sketch: 'The term $3y^2$ has derivative $6y\frac{dy}{dx}$, so the correct equation is $2x + 6y\frac{dy}{dx} = 0$. Solving gives $\frac{dy}{dx} = -\frac{x}{3y}$.'
          - problem: 'Find $\frac{dy}{dx}$ for $x^2 + 4y^2 = 8$.'
            answer: '-x/(4y)'
            answer_contract: {"kind":"function","vars":["x","y"]}
            solution_sketch: 'Differentiating both sides gives $2x + 8y\frac{dy}{dx} = 0$. Solving gives $\frac{dy}{dx} = -\frac{2x}{8y} = -\frac{x}{4y}$.'
      - id: kp3
        name: 'Evaluate the slope at a point'
        key_prerequisites: [chain-rule]
        constraints: 'the given point must satisfy the equation; slopes are integers or simple fractions; contexts: a lens rim and a contour line on a map'
        step_check:
          step: 'Substitute $x = 2$ and $y = 1$'
          question: 'Why are both coordinates of the point substituted into the formula for $\frac{dy}{dx}$?'
          options:
            - 'The point is substituted so that the equation of the curve is solved for $y$'
            - 'The coordinates are added to give the slope of the tangent line'
            - 'The value of $x$ alone fixes the slope, and $y$ is only a check'
            - 'The formula contains both $x$ and $y$, so the slope depends on the point'
          answer: 'The formula contains both $x$ and $y$, so the slope depends on the point'
          why: 'The slope formula $\frac{-2x - y}{x}$ uses both letters, so it needs both coordinates to give one number.'
        exemplars:
          - problem: 'Find the slope of the tangent to $x^2 + y^2 = 25$ at $(3, 4)$.'
            answer: '-3/4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Differentiating gives $\frac{dy}{dx} = -\frac{x}{y}$. At $(3, 4)$ the slope is $-\frac{3}{4}$.'
          - problem: 'Find the slope of the tangent to $y^2 = 4x$ at $(1, 2)$.'
            answer: '1'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Differentiating gives $2y\frac{dy}{dx} = 4$, so $\frac{dy}{dx} = \frac{2}{y}$. At $y = 2$ the slope is $1$.'
          - problem: 'A contour line on a map follows $x^2 + 4y^2 = 40$, with $x$ and $y$ in kilometres. Find the slope of the contour at the point $(6, 1)$.'
            answer: '-3/2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Differentiating gives $2x + 8y\frac{dy}{dx} = 0$, so $\frac{dy}{dx} = -\frac{x}{4y}$. At $(6, 1)$ the slope is $-\frac{6}{4} = -\frac{3}{2}$.'
          - problem: 'The rim of a circular lens is the curve $x^2 + y^2 = 100$, with $x$ and $y$ in centimetres. What is the slope of the rim at the point $(8, 6)$?'
            answer: '-4/3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Differentiating gives $\frac{dy}{dx} = -\frac{x}{y}$. At $(8, 6)$ the slope is $-\frac{8}{6} = -\frac{4}{3}$.'
          - problem: 'Find the slope of the tangent to $x^3 + y^3 = 9$ at $(1, 2)$.'
            answer: '-1/4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Differentiating gives $3x^2 + 3y^2\frac{dy}{dx} = 0$, so $\frac{dy}{dx} = -\frac{x^2}{y^2}$. At $(1, 2)$ the slope is $-\frac{1}{4}$.'
          - problem: 'Find the slope of the tangent to $y^2 = 6x$ at $(6, 6)$.'
            answer: '1/2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Differentiating gives $2y\frac{dy}{dx} = 6$, so $\frac{dy}{dx} = \frac{3}{y}$. At $y = 6$ the slope is $\frac{3}{6} = \frac{1}{2}$.'
          - problem: 'Find the slope of the tangent to $x^3 + y^2 = 10$ at $(1, 3)$.'
            answer: '-1/2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Differentiating gives $3x^2 + 2y\frac{dy}{dx} = 0$, so $\frac{dy}{dx} = -\frac{3x^2}{2y}$. At $(1, 3)$ the slope is $-\frac{3}{6} = -\frac{1}{2}$.'
          - problem: 'Sam finds the slope of the tangent to $x^2 + y^2 = 169$ at $(5, 12)$ and writes $\frac{5}{12}$. What is the correct slope?'
            answer: '-5/12'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Differentiating gives $2x + 2y\frac{dy}{dx} = 0$, so $\frac{dy}{dx} = -\frac{x}{y}$. Sam lost the minus sign: at $(5, 12)$ the slope is $-\frac{5}{12}$.'
          - problem: 'Find the slope of the tangent to $x^2 + y^2 = 25$ at $(3, -4)$.'
            answer: '3/4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Differentiating gives $\frac{dy}{dx} = -\frac{x}{y}$. At $(3, -4)$ the slope is $-\frac{3}{-4} = \frac{3}{4}$.'
    diagnostic_exemplar:
      problem: 'Find $\frac{dy}{dx}$ for $x^2 + y^2 = 9$.'
      answer: "-x/y"
      solution_sketch: 'Differentiate both sides in $x$, treating $y$ as a function of $x$: $2x + 2y\frac{dy}{dx} = 0$.'
    anki_seeds:
      - front: "When differentiating y^n implicitly with respect to x, you get..."
        back: "n·y^(n-1) · dy/dx (chain rule — y is a function of x)"
        type: basic
      - front: "Implicit differentiation procedure in three steps:"
        back: "differentiate both sides in x (chain rule on y terms); collect dy/dx terms; solve for dy/dx"
        type: basic

  - id: implicit-differentiation
    name: Implicit Differentiation
    core: true
    difficulty: 0.68
    drill: false
    answer_kind: expression
    expected_time_secs: 210
    prerequisites:
      - id: implicit-differentiation-basic
        weight: 0.8
        key: true
      - id: product-quotient-rules
        weight: 0.6
        key: true
      - id: tangent-line-equation
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: 'Implicit differentiation with product terms'
        key_prerequisites: [product-quotient-rules, implicit-differentiation-basic]
        constraints: 'one xy, x^2 y or x y^2 term; collect the dy/dx terms on one side before solving; contexts: a gas law, an output curve'
        step_check:
          step: '$\frac{d}{dx}(xy) = y + x\frac{dy}{dx}$'
          question: 'Why does the derivative of $xy$ contain the term $x\frac{dy}{dx}$?'
          options:
            - 'The factor $y$ also depends on $x$, so the product rule differentiates it'
            - 'The chain rule is applied to $x$, which brings in the factor $\frac{dy}{dx}$'
            - 'Every product of two letters is written with a derivative on the second'
            - 'The term $x\frac{dy}{dx}$ replaces the constant on the right side'
          answer: 'The factor $y$ also depends on $x$, so the product rule differentiates it'
          why: 'The product rule gives (derivative of $x$)$\cdot y$ plus $x\cdot$(derivative of $y$), and the derivative of $y$ is $\frac{dy}{dx}$.'
        exemplars:
          - problem: 'Find $\frac{dy}{dx}$ for $xy = 4$.'
            answer: '-y/x'
            answer_contract: {"kind":"function","vars":["x","y"]}
            solution_sketch: 'The product rule gives $y + x\frac{dy}{dx} = 0$. Solving for the derivative gives $\frac{dy}{dx} = -\frac{y}{x}$.'
          - problem: 'Find $\frac{dy}{dx}$ for $x^2 + xy = 6$.'
            answer: '-(2x + y)/x'
            answer_contract: {"kind":"function","vars":["x","y"]}
            solution_sketch: 'Differentiating gives $2x + y + x\frac{dy}{dx} = 0$. Solving gives $\frac{dy}{dx} = -\frac{2x + y}{x}$.'
          - problem: 'For a fixed amount of gas at constant temperature, the pressure $p$ and volume $v$ satisfy $pv = 200$. Find $\frac{dp}{dv}$.'
            answer: '-p/v'
            answer_contract: {"kind":"function","vars":["p","v"]}
            solution_sketch: 'The product rule gives $p + v\frac{dp}{dv} = 0$, because $p$ depends on $v$. Solving gives $\frac{dp}{dv} = -\frac{p}{v}$, so pressure falls as volume grows.'
          - problem: 'Find $\frac{dy}{dx}$ for $x^2y + y^2 = 5$.'
            answer: '-2xy/(x^2 + 2y)'
            answer_contract: {"kind":"function","vars":["x","y"]}
            solution_sketch: 'Differentiating gives $2xy + x^2\frac{dy}{dx} + 2y\frac{dy}{dx} = 0$. Collecting, $\frac{dy}{dx}(x^2 + 2y) = -2xy$, so $\frac{dy}{dx} = -\frac{2xy}{x^2 + 2y}$.'
          - problem: 'A factory''s output satisfies $xy^2 = 500$, where $x$ is the number of machine hours and $y$ is the number of workers. Find $\frac{dy}{dx}$, the change in workers needed for one more machine hour.'
            answer: '-y/(2x)'
            answer_contract: {"kind":"function","vars":["x","y"]}
            solution_sketch: 'The product rule gives $y^2 + 2xy\frac{dy}{dx} = 0$. Solving gives $\frac{dy}{dx} = -\frac{y^2}{2xy} = -\frac{y}{2x}$.'
          - problem: 'Find $\frac{dy}{dx}$ for $x^2y + y^3 = 10$.'
            answer: '-2xy/(x^2 + 3y^2)'
            answer_contract: {"kind":"function","vars":["x","y"]}
            solution_sketch: 'Differentiating gives $2xy + x^2\frac{dy}{dx} + 3y^2\frac{dy}{dx} = 0$. Collecting and solving gives $\frac{dy}{dx} = -\frac{2xy}{x^2 + 3y^2}$.'
          - problem: 'Sam differentiates $xy + 3y^2 = 8$ and writes $y + 6y\frac{dy}{dx} = 0$, treating $x$ as a constant. What is the correct $\frac{dy}{dx}$?'
            answer: '-y/(x + 6y)'
            answer_contract: {"kind":"function","vars":["x","y"]}
            solution_sketch: 'The product $xy$ has derivative $y + x\frac{dy}{dx}$, so the equation is $y + x\frac{dy}{dx} + 6y\frac{dy}{dx} = 0$. Solving gives $\frac{dy}{dx} = -\frac{y}{x + 6y}$.'
          - problem: 'Find $\frac{dy}{dx}$ for $xy + y^2 = 9$.'
            answer: '-y/(x + 2y)'
            answer_contract: {"kind":"function","vars":["x","y"]}
            solution_sketch: 'Differentiating gives $y + x\frac{dy}{dx} + 2y\frac{dy}{dx} = 0$. Collecting, $\frac{dy}{dx}(x + 2y) = -y$, so $\frac{dy}{dx} = -\frac{y}{x + 2y}$.'
          - problem: 'Find $\frac{dy}{dx}$ for $x^2y + 4y^2 = 15$.'
            answer: '-2xy/(x^2 + 8y)'
            answer_contract: {"kind":"function","vars":["x","y"]}
            solution_sketch: 'Differentiating gives $2xy + x^2\frac{dy}{dx} + 8y\frac{dy}{dx} = 0$. Collecting and solving gives $\frac{dy}{dx} = -\frac{2xy}{x^2 + 8y}$.'
      - id: kp2
        name: 'Tangent lines to implicit curves'
        key_prerequisites: [implicit-differentiation-basic, tangent-line-equation]
        constraints: 'the given point must satisfy the equation; slopes are simple fractions; items ask for a slope, an equation of the tangent line or an intercept of the tangent line'
        step_check:
          step: 'Write the tangent line with point-slope form through $(6, 8)$'
          question: 'Why does the tangent line need both the slope $-\frac{3}{4}$ and the point $(6, 8)$?'
          options:
            - 'The point gives the direction, and the slope picks one point on the circle'
            - 'The slope alone fixes the line, and the point only checks the answer'
            - 'The slope gives the direction, and the point picks one of those lines'
            - 'Two numbers are needed because every line has exactly two slopes'
          answer: 'The slope gives the direction, and the point picks one of those lines'
          why: 'Many parallel lines have slope $-\frac{3}{4}$; only one of them passes through $(6, 8)$, and that one touches the circle.'
        exemplars:
          - problem: 'Find the slope of the tangent to $x^2 + 2y^2 = 22$ at $(2, 3)$.'
            answer: '-1/3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Differentiating gives $2x + 4y\frac{dy}{dx} = 0$, so $\frac{dy}{dx} = -\frac{x}{2y}$. At $(2, 3)$ the slope is $-\frac{2}{6} = -\frac{1}{3}$.'
          - problem: 'Find the equation of the tangent line to $x^2 + y^2 = 25$ at $(3, 4)$.'
            answer: 'y = -3x/4 + 25/4'
            answer_contract: {"kind":"polynomial_relation"}
            solution_sketch: 'The slope is $-\frac{x}{y} = -\frac{3}{4}$ at $(3, 4)$. Point-slope form gives $y - 4 = -\frac{3}{4}(x - 3)$, so $y = -\frac{3}{4}x + \frac{25}{4}$.'
          - problem: 'Find the slope of the tangent to $x^2 + xy = 10$ at $(2, 3)$.'
            answer: '-7/2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Differentiating gives $2x + y + x\frac{dy}{dx} = 0$, so $\frac{dy}{dx} = -\frac{2x + y}{x}$. At $(2, 3)$ the slope is $-\frac{7}{2}$.'
          - problem: 'A runner goes around a circular track $x^2 + y^2 = 400$, with $x$ and $y$ in metres, and at the point $(12, 16)$ leaves the track and runs in a straight line along the tangent. What is the equation of her path?'
            answer: 'y = -3x/4 + 25'
            answer_contract: {"kind":"polynomial_relation"}
            solution_sketch: 'The slope of the track at $(12, 16)$ is $-\frac{x}{y} = -\frac{12}{16} = -\frac{3}{4}$. Point-slope form gives $y - 16 = -\frac{3}{4}(x - 12)$, so $y = -\frac{3}{4}x + 25$.'
          - problem: 'Find the slope of the tangent to $x^2 + xy + y^2 = 19$ at $(2, 3)$.'
            answer: '-7/8'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Differentiating gives $2x + y + (x + 2y)\frac{dy}{dx} = 0$. At $(2, 3)$ this is $7 + 8\frac{dy}{dx} = 0$, so the slope is $-\frac{7}{8}$.'
          - problem: 'Find the $y$-intercept of the tangent line to $x^2 + y^2 = 25$ at $(4, 3)$.'
            answer: '25/3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The slope at $(4, 3)$ is $-\frac{4}{3}$, so the tangent is $y - 3 = -\frac{4}{3}(x - 4)$. Setting $x = 0$ gives $y = 3 + \frac{16}{3} = \frac{25}{3}$.'
          - problem: 'A drone flies around a circular lake $x^2 + y^2 = 100$, with $x$ and $y$ in kilometres. At $(6, 8)$ it loses power and glides along the tangent line. At what $x$-coordinate does its path cross the $x$-axis?'
            answer: '50/3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The slope at $(6, 8)$ is $-\frac{6}{8} = -\frac{3}{4}$, so the path is $y - 8 = -\frac{3}{4}(x - 6)$. Setting $y = 0$ gives $x = 6 + \frac{32}{3} = \frac{50}{3}$.'
          - problem: 'Give the equation of the tangent line to $x^2 + xy = 6$ at $(2, 1)$.'
            answer: 'y = -5x/2 + 6'
            answer_contract: {"kind":"polynomial_relation"}
            solution_sketch: 'The slope is $-\frac{2x + y}{x} = -\frac{5}{2}$ at $(2, 1)$. Point-slope form gives $y - 1 = -\frac{5}{2}(x - 2)$, so $y = -\frac{5}{2}x + 6$.'
          - problem: 'Sam writes the slope of the tangent to $x^2 - y^2 = 9$ at $(5, 4)$ as $-\frac{5}{4}$, because the slope of a circle is $-\frac{x}{y}$. What is the correct slope?'
            answer: '5/4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Differentiating gives $2x - 2y\frac{dy}{dx} = 0$, so $\frac{dy}{dx} = \frac{x}{y}$ for this curve. At $(5, 4)$ the slope is $\frac{5}{4}$.'
      - id: kp3
        name: 'Second derivatives implicitly'
        key_prerequisites: [implicit-differentiation-basic, product-quotient-rules]
        constraints: 'differentiate dy/dx again, substitute the first derivative, and use the original equation; contexts ask for the second derivative at a point of a mirror or reflector'
        step_check:
          step: 'Since $x^2 + y^2 = 16$, the numerator is $16$'
          question: 'Why may the numerator $y^2 + x^2$ be replaced by $16$?'
          options:
            - 'The squares of $x$ and $y$ always add up to the denominator'
            - 'Every point of the curve satisfies $x^2 + y^2 = 16$'
            - 'The number $16$ is the value of $y^{\prime\prime}$ at every point'
            - 'Differentiating twice turns the sum of squares into a constant'
          answer: 'Every point of the curve satisfies $x^2 + y^2 = 16$'
          why: 'The second derivative is evaluated only at points of the curve, and at each of them $x^2 + y^2$ equals $16$.'
        exemplars:
          - problem: 'For $x^2 + y^2 = 25$, use the original equation to write $\frac{d^2y}{dx^2}$ in terms of $y$.'
            answer: '-25/y^3'
            answer_contract: {"kind":"function","vars":["y"]}
            solution_sketch: 'The first derivative is $y^{\prime} = -\frac{x}{y}$. The quotient rule gives $y^{\prime\prime} = -\frac{y^2 + x^2}{y^3}$, and $x^2 + y^2 = 25$ turns this into $-\frac{25}{y^3}$.'
          - problem: 'For $y^2 = 4x$, find $\frac{d^2y}{dx^2}$ in terms of $y$.'
            answer: '-4/y^3'
            answer_contract: {"kind":"function","vars":["y"]}
            solution_sketch: 'The first derivative is $y^{\prime} = \frac{2}{y}$. Differentiating again gives $y^{\prime\prime} = -\frac{2}{y^2}y^{\prime} = -\frac{2}{y^2}\cdot\frac{2}{y} = -\frac{4}{y^3}$.'
          - problem: 'The cross-section of a circular mirror is $x^2 + y^2 = 64$, with $x$ and $y$ in centimetres. Find $\frac{d^2y}{dx^2}$ at the top point $(0, 8)$.'
            answer: '-1/8'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'In general $\frac{d^2y}{dx^2} = -\frac{64}{y^3}$ on this circle. At $(0, 8)$ this is $-\frac{64}{512} = -\frac{1}{8}$.'
          - problem: 'For $y^2 = 6x$, find $\frac{d^2y}{dx^2}$ in terms of $y$.'
            answer: '-9/y^3'
            answer_contract: {"kind":"function","vars":["y"]}
            solution_sketch: 'The first derivative is $y^{\prime} = \frac{3}{y}$. Differentiating again gives $y^{\prime\prime} = -\frac{3}{y^2}y^{\prime} = -\frac{9}{y^3}$.'
          - problem: 'A reflector has the cross-section $y^2 = 8x$, with $x$ and $y$ in centimetres. Find $\frac{d^2y}{dx^2}$ at the point $(2, 4)$.'
            answer: '-1/4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The first derivative is $y^{\prime} = \frac{4}{y}$, so $y^{\prime\prime} = -\frac{4}{y^2}y^{\prime} = -\frac{16}{y^3}$. At $y = 4$ this is $-\frac{16}{64} = -\frac{1}{4}$.'
          - problem: 'For $xy = 6$, find $\frac{d^2y}{dx^2}$ in terms of $x$.'
            answer: '12/x^3'
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'Differentiating gives $y + xy^{\prime} = 0$, so $y^{\prime} = -\frac{y}{x}$. Differentiating again gives $y^{\prime\prime} = \frac{2y}{x^2}$, and $y = \frac{6}{x}$ gives $\frac{12}{x^3}$.'
          - problem: 'Sam finds $y'' = -\frac{x}{y}$ for $x^2 + y^2 = 9$ and differentiates only the numerator, getting $y'''' = -\frac{1}{y}$. Use the quotient rule to find the correct $\frac{d^2y}{dx^2}$ in terms of $y$.'
            answer: '-9/y^3'
            answer_contract: {"kind":"function","vars":["y"]}
            solution_sketch: 'The quotient rule also differentiates $y$ in the denominator, which gives $y^{\prime\prime} = -\frac{y - xy^{\prime}}{y^2} = -\frac{y^2 + x^2}{y^3}$. Since $x^2 + y^2 = 9$, the result is $-\frac{9}{y^3}$.'
          - problem: 'For $x^2 + y^2 = 49$, find $\frac{d^2y}{dx^2}$ in terms of $y$.'
            answer: '-49/y^3'
            answer_contract: {"kind":"function","vars":["y"]}
            solution_sketch: 'The first derivative is $y^{\prime} = -\frac{x}{y}$. The quotient rule gives $y^{\prime\prime} = -\frac{y^2 + x^2}{y^3}$, and $x^2 + y^2 = 49$ gives $-\frac{49}{y^3}$.'
          - problem: 'For $x^3 + y^3 = 9$, find $\frac{d^2y}{dx^2}$ in terms of $x$ and $y$.'
            answer: '-18x/y^5'
            answer_contract: {"kind":"function","vars":["x","y"]}
            solution_sketch: 'The first derivative is $y^{\prime} = -\frac{x^2}{y^2}$. Differentiating again and using $x^3 + y^3 = 9$ gives $y^{\prime\prime} = -\frac{2x(x^3 + y^3)}{y^5} = -\frac{18x}{y^5}$.'
    diagnostic_exemplar:
      problem: 'For $x^2 + y^2 = 16$, find $\frac{d^2y}{dx^2}$ in terms of $y$ (simplify using the original equation).'
      answer: '-16/y^3'
      solution_sketch: 'Implicitly $y'' = -x/y$; differentiating again, $y'''' = -\frac{y - x y''}{y^2} = -\frac{y + x^2/y}{y^2} = -\frac{x^2 + y^2}{y^3} = -\frac{16}{y^3}$.'
    anki_seeds:
      - front: "After computing y'' implicitly, always simplify using..."
        back: "the original equation (substitute it to collapse x² + y² -type expressions)"
        type: basic
      - front: "d/dx [xy] = ?"
        back: "y + x·dy/dx (product rule — both factors vary)"
        type: basic

  - id: derivatives-inverse-functions
    name: Derivatives of Inverse Functions
    core: true
    difficulty: 0.65
    drill: false
    answer_kind: numeric
    expected_time_secs: 150
    prerequisites:
      - id: inverse-functions
        weight: 0.6
        key: true
      - id: chain-rule
        weight: 0.6
        key: true
      - id: derivative-definition
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: The inverse-derivative formula
        key_prerequisites: [inverse-functions, chain-rule]
        step_check:
          step: 'This means $f^{-1}(7) = 1$.'
          question: 'Why is $f''$ evaluated at $1$ and not at $7$?'
          options:
            - 'Because $1$ is the input of $f$ that produces the output $7$'
            - 'Because the slope of $f^{-1}$ at $7$ equals the slope of $f$ at $7$'
            - 'Because $f''(7)$ would be the slope of $f^{-1}$, and we want the slope of $f$'
            - 'Because $f''$ is always evaluated at the input $1$ in an inverse problem'
          answer: 'Because $1$ is the input of $f$ that produces the output $7$'
          why: 'The point $(1, 7)$ on $f$ becomes $(7, 1)$ on $f^{-1}$, so the matching slope of $f$ is $f''(1) = 7$, which gives $\frac{1}{7}$.'
        try_first:
          problem: 'Let $f(x) = 5x + 2$. Its inverse is $f^{-1}(x) = \frac{x - 2}{5}$. What is the derivative of $f^{-1}$?'
          answer_contract: {"kind":"exact"}
          answer: '1/5'
          reveal: 'The inverse undoes multiplication by $5$, so its slope is $\frac{1}{5}$, the reciprocal of the slope of $f$. For curved graphs the same reciprocal rule holds at matching points.'
        exemplars:
          - problem: 'Let $f(x) = x^3 + x + 1$, so $f(1) = 3$. Find $(f^{-1})''(3)$.'
            answer: '1/4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The formula gives $(f^{-1})''(3) = \frac{1}{f''(1)}$ because $f(1) = 3$. Since $f''(x) = 3x^2 + 1$, we get $f''(1) = 4$, so the answer is $\frac{1}{4}$.'
          - problem: 'The volume of water in a tank is $V = h^3 + 4h$ litres when the depth is $h$ cm, and $V = 16$ when $h = 2$. At that moment, how many centimetres does the depth rise per extra litre of water?'
            answer: '1/16'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The depth as a function of volume is the inverse function, so $\frac{dh}{dV} = \frac{1}{dV/dh}$. Here $\frac{dV}{dh} = 3h^2 + 4 = 16$ at $h = 2$, so the depth rises $\frac{1}{16}$ cm per litre.'
          - problem: 'Let $f(x) = x^5 + 4x + 1$, so $f(1) = 6$. Find $(f^{-1})''(6)$.'
            answer: '1/9'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Because $f(1) = 6$, the inverse derivative is $\frac{1}{f''(1)}$. We have $f''(x) = 5x^4 + 4$, so $f''(1) = 9$ and the answer is $\frac{1}{9}$.'
          - problem: 'A seedling has height $h(t) = t^3 + 3t$ centimetres after $t$ days, and $h(2) = 14$. At that moment, how many days does the seedling need per additional centimetre of height?'
            answer: '1/15'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The time as a function of height is the inverse of $h$, so $\frac{dt}{dh} = \frac{1}{h''(2)}$. Since $h''(t) = 3t^2 + 3 = 15$ at $t = 2$, the answer is $\frac{1}{15}$ day per centimetre.'
          - problem: 'The function $f(x) = x^7 + 1$ satisfies $f(1) = 2$. Find the derivative of the inverse function of $f$ at $2$.'
            answer: '1/7'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Since $f(1) = 2$, the derivative of the inverse at $2$ is $\frac{1}{f''(1)}$. We have $f''(x) = 7x^6$, so $f''(1) = 7$ and the answer is $\frac{1}{7}$.'
          - problem: 'Let $f(x) = x^3 + 5x + 2$, so $f(1) = 8$. Find $(f^{-1})''(8)$.'
            answer: '1/8'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The pre-image of $8$ is $1$ because $f(1) = 8$. Then $f''(x) = 3x^2 + 5$ gives $f''(1) = 8$, so $(f^{-1})''(8) = \frac{1}{8}$.'
          - problem: 'Let $f(x) = x^5 + x + 1$, so $f(1) = 3$. Find $(f^{-1})''(3)$.'
            answer: '1/6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The formula gives $\frac{1}{f''(1)}$ because $f(1) = 3$. Since $f''(x) = 5x^4 + 1$, we get $f''(1) = 6$ and the answer is $\frac{1}{6}$.'
          - problem: 'Let $f(x) = e^x + 3x + 1$, so $f(0) = 2$. Find $(f^{-1})''(2)$.'
            answer: '1/4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Since $f(0) = 2$, we need $f''(0)$. We have $f''(x) = e^x + 3$, so $f''(0) = 4$ and $(f^{-1})''(2) = \frac{1}{4}$.'
        constraints: 'f(a) given or trivially computed; f''(a) is a small integer; includes contexts that need a rate per unit of the other quantity'
      - id: kp2
        name: Inverse derivatives from tables
        key_prerequisites: [inverse-functions, chain-rule]
        step_check:
          step: 'The table tells us $f(4) = 9$, so $a = 4$.'
          question: 'Why is $f''(4)$ used rather than $f''(9)$?'
          options:
            - 'The slope of $f$ at $9$ is always the negative of the slope at $4$, so either works'
            - 'The slope is needed where $f$ has the output $9$, which is at $4$'
            - 'The number $9$ is not an allowed input for the derivative of $f$'
            - 'The slope is read at the smaller of the two numbers $4$ and $9$'
          answer: 'The slope is needed where $f$ has the output $9$, which is at $4$'
          why: 'Since $f(4) = 9$, the point $(4, 9)$ on $f$ matches $(9, 4)$ on $f^{-1}$, and the slopes there are reciprocals: $\frac{1}{6}$.'
        exemplars:
          - problem: 'Given $f(2) = 5$ and $f''(2) = 8$, find $(f^{-1})''(5)$.'
            answer: '1/8'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The output $5$ comes from the input $2$, so $(f^{-1})''(5) = \frac{1}{f''(2)}$. Since $f''(2) = 8$, the answer is $\frac{1}{8}$.'
          - problem: 'A table gives $f(1) = 4$, $f(2) = 7$, $f(3) = 9$ and $f''(1) = 5$, $f''(2) = 2$, $f''(3) = 6$. Find $(f^{-1})''(9)$.'
            answer: '1/6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The output $9$ comes from the input $3$, because $f(3) = 9$. So $(f^{-1})''(9) = \frac{1}{f''(3)} = \frac{1}{6}$, and the other table entries are not needed.'
          - problem: 'The tangent line to the graph of $f$ at the point $(2, 5)$ has slope $3$. What is the slope of the tangent line to the graph of $f^{-1}$ at the point $(5, 2)$?'
            answer: '1/3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Reflecting in the line $y = x$ swaps the roles of rise and run, so the slope of the reflected tangent is the reciprocal. The new slope is $\frac{1}{3}$.'
          - problem: 'A car has travelled $s(10) = 150$ m after $10$ s and is moving at $s''(10) = 12$ m/s. At that moment, how many seconds does the car need per extra metre of distance?'
            answer: '1/12'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The time as a function of distance is the inverse function $s^{-1}$. So $(s^{-1})''(150) = \frac{1}{s''(10)} = \frac{1}{12}$ seconds per metre.'
          - problem: 'A cup of tea has temperature $T(5) = 60$ degrees Celsius after $5$ minutes and $T''(5) = -4$ degrees per minute. Find $(T^{-1})''(60)$, the rate of change of time with respect to temperature, in minutes per degree.'
            answer: '-1/4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The temperature $60$ occurs at time $5$, so $(T^{-1})''(60) = \frac{1}{T''(5)}$. Since $T''(5) = -4$, the answer is $-\frac{1}{4}$ minute per degree, and the sign shows the tea is cooling.'
          - problem: 'Sam knows $f(3) = 7$, $f''(3) = 4$ and $f''(7) = 10$. He writes $(f^{-1})''(7) = \frac{1}{f''(7)} = \frac{1}{10}$. What is the correct value of $(f^{-1})''(7)$?'
            answer: '1/4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Sam used $f''$ at the output $7$. The formula needs $f''$ at the input that produces $7$, and $f(3) = 7$, so the value is $\frac{1}{f''(3)} = \frac{1}{4}$.'
          - problem: 'Given $h(5) = 1$ and $h''(5) = \frac{2}{3}$, find $(h^{-1})''(1)$.'
            answer: '3/2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The output $1$ comes from the input $5$, so the answer is $\frac{1}{h''(5)}$. Dividing by $\frac{2}{3}$ gives $\frac{3}{2}$.'
          - problem: 'Given $g(5) = -2$ and $g''(5) = 6$, find $(g^{-1})''(-2)$.'
            answer: '1/6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The output $-2$ comes from the input $5$, so $(g^{-1})''(-2) = \frac{1}{g''(5)}$. Since $g''(5) = 6$, the answer is $\frac{1}{6}$.'
        constraints: 'table, tangent-slope or measured values give f and f'' at one point; the student inverts through the OUTPUT value'
      - id: kp3
        name: Where the formula comes from
        key_prerequisites: [chain-rule, inverse-functions]
        step_check:
          step: 'Evaluate at the pre-image, not at $3$: $f''(1) = 3(1)^2 + 2 = 5$'
          question: 'Why is $f''$ evaluated at the pre-image $1$ rather than at $3$?'
          options:
            - 'The pre-image is always a smaller number than the output'
            - 'The derivative of $f$ is undefined at the output value $3$'
            - 'The chain rule step gives $f''(f^{-1}(x))$, and $f^{-1}(3) = 1$'
            - 'Evaluating at $3$ gives the slope of $f^{-1}$ directly with no reciprocal'
          answer: 'The chain rule step gives $f''(f^{-1}(x))$, and $f^{-1}(3) = 1$'
          why: 'Differentiating $f(f^{-1}(x)) = x$ gives $f''(f^{-1}(x)) \cdot (f^{-1})''(x) = 1$, so at $x = 3$ the factor is $f''(1) = 5$.'
        exemplars:
          - problem: 'Let $f(x) = x^3 + 2x$. Find $(f^{-1})''(3)$.'
            answer: '1/5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'First solve $f(a) = 3$. Since $1^3 + 2 = 3$, the pre-image is $a = 1$. Then $f''(x) = 3x^2 + 2$ gives $f''(1) = 5$, so $(f^{-1})''(3) = \frac{1}{5}$.'
          - problem: 'Differentiating $f(f^{-1}(x)) = x$ with the chain rule gives a formula for $(f^{-1})''$. Use it to find $(f^{-1})''(5)$ when $f(x) = x^2 + 1$ for $x > 0$.'
            answer: '1/4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The chain rule gives $f''(f^{-1}(x)) \cdot (f^{-1})''(x) = 1$. Solving $x^2 + 1 = 5$ with $x > 0$ gives $f^{-1}(5) = 2$, and $f''(2) = 4$, so the answer is $\frac{1}{4}$.'
          - problem: 'Let $f(x) = x^3$. Find $(f^{-1})''(8)$.'
            answer: '1/12'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The pre-image of $8$ is $2$, because $2^3 = 8$. Then $f''(2) = 3 \cdot 2^2 = 12$, so $(f^{-1})''(8) = \frac{1}{12}$.'
          - problem: 'The area of a circle of radius $r$ cm is $A = \pi r^2$. By how many centimetres does the radius grow per extra square centimetre of area when the area is $25\pi$ cm$^2$?'
            answer: '1/(10pi)'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The radius as a function of area is the inverse function, so $\frac{dr}{dA} = \frac{1}{dA/dr}$. Since $A = 25\pi$ gives $r = 5$ and $\frac{dA}{dr} = 2\pi r = 10\pi$, the answer is $\frac{1}{10\pi}$ cm per cm$^2$.'
          - problem: 'Let $f(x) = x^2 + 7$ for $x > 0$. Find $(f^{-1})''(16)$.'
            answer: '1/6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Solving $x^2 + 7 = 16$ with $x > 0$ gives the pre-image $3$. Then $f''(3) = 2 \cdot 3 = 6$, so $(f^{-1})''(16) = \frac{1}{6}$.'
          - problem: 'Let $f(x) = x^5$. Find $(f^{-1})''(32)$.'
            answer: '1/80'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The pre-image of $32$ is $2$, because $2^5 = 32$. Then $f''(2) = 5 \cdot 2^4 = 80$, so $(f^{-1})''(32) = \frac{1}{80}$.'
          - problem: 'The volume of a cube with edge $s$ cm is $V = s^3$. By how many centimetres does the edge grow per extra cubic centimetre of volume when the volume is $64$ cm$^3$?'
            answer: '1/48'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The edge is $s = 4$ when $V = 64$. Since $\frac{dV}{ds} = 3s^2 = 48$, the edge grows by the reciprocal, $\frac{1}{48}$ cm per cm$^3$.'
          - problem: 'Mia wants $(f^{-1})''(10)$ for $f(x) = x^3 + x$. She computes $\frac{1}{f''(10)}$. What is the correct value of $(f^{-1})''(10)$?'
            answer: '1/13'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Mia evaluated $f''$ at $10$, but $10$ is an output of $f$. Since $f(2) = 10$, the pre-image is $2$, and $f''(2) = 3 \cdot 4 + 1 = 13$, so the answer is $\frac{1}{13}$.'
        constraints: 'the pre-image is found by solving f(a) = b; reciprocal answers are unit fractions; includes geometric contexts'
    diagnostic_exemplar:
      problem: 'Let $f(x) = x^3$. Find $(f^{-1})''(27)$.'
      answer: "1/27"
      solution_sketch: '$f^{-1}(27) = 3$ and $f''(3) = 27$, so $(f^{-1})''(27) = \frac{1}{27}$.'
    anki_seeds:
      - front: "Inverse function derivative: (f⁻¹)'(b) = ?"
        back: "1 / f'(f⁻¹(b)) — the reciprocal of f' at the PRE-image of b"
        type: basic
      - front: "Graphically, the tangent slopes of f and f⁻¹ at mirrored points are..."
        back: "reciprocals of each other (reflection across y = x)"
        type: basic

  - id: derivatives-inverse-trig
    name: Derivatives of Inverse Trigonometric Functions
    core: true
    difficulty: 0.68
    drill: false
    answer_kind: expression
    expected_time_secs: 150
    prerequisites:
      - id: inverse-trig-functions
        weight: 0.6
        key: true
      - id: chain-rule
        weight: 0.6
        key: true
      - id: implicit-differentiation-basic
        weight: 0.4
      - id: derivatives-inverse-functions
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: The three main formulas
        key_prerequisites: [inverse-trig-functions, implicit-differentiation-basic]
        step_check:
          step: 'we have $\sin y \ge 0$'
          question: 'Why is $\sin y$ equal to the positive root $\sqrt{1 - x^2}$ here?'
          options:
            - 'A square root sign stands for either sign, so any choice works here'
            - 'The number $x$ in $\cos y = x$ is positive, so $y$ is an acute angle'
            - 'Arccos values lie in $[0, \pi]$, where sine is never negative'
            - 'The derivative of an inverse function is always positive'
          answer: 'Arccos values lie in $[0, \pi]$, where sine is never negative'
          why: 'On $0 \le y \le \pi$ sine is not negative, so $\sin y = +\sqrt{1 - x^2}$ and $y'' = -\frac{1}{\sqrt{1 - x^2}}$; a negative root would flip the sign.'
        try_first:
          problem: 'The point $(\frac{\pi}{6}, \frac{1}{2})$ lies on $y = \sin x$, where the slope is $\cos\frac{\pi}{6} = \frac{\sqrt{3}}{2}$. What is the slope of $y = \arcsin x$ at the mirrored point $(\frac{1}{2}, \frac{\pi}{6})$?'
          answer_contract: {"kind":"exact"}
          answer: '2sqrt(3)/3'
          reveal: 'Reflecting in the line $y = x$ turns the slope into its reciprocal, $\frac{2}{\sqrt{3}}$. The formula $\frac{1}{\sqrt{1 - x^2}}$ gives the same value at $x = \frac{1}{2}$.'
        exemplars:
          - problem: 'Differentiate $f(x) = \arcsin x$.'
            answer: '1/sqrt(1 - x^2)'
            answer_contract: {"kind":"function","vars":["x"],"domain":{"x":["1/8","7/8"]}}
            solution_sketch: 'This is one of the three standard formulas. The derivative of $\arcsin x$ is $\frac{1}{\sqrt{1 - x^2}}$ for $-1 < x < 1$.'
          - problem: 'Differentiate $f(x) = \arctan x$.'
            answer: '1/(1 + x^2)'
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'This is one of the three standard formulas. The derivative of $\arctan x$ is $\frac{1}{1 + x^2}$ for every $x$.'
          - problem: 'Differentiate $f(x) = \arccos x$.'
            answer: '-1/sqrt(1 - x^2)'
            answer_contract: {"kind":"function","vars":["x"],"domain":{"x":["1/8","7/8"]}}
            solution_sketch: 'The derivative of $\arccos x$ is the negative of the derivative of $\arcsin x$. So it is $-\frac{1}{\sqrt{1 - x^2}}$ for $-1 < x < 1$.'
          - problem: 'A sloping path rises $y = \arctan x$ metres at a horizontal distance of $x$ metres from its start. How steep is the path, in metres per metre, at $x = \sqrt{3}$?'
            answer: '1/4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The steepness is the derivative $y'' = \frac{1}{1 + x^2}$. At $x = \sqrt{3}$ we have $x^2 = 3$, so $y'' = \frac{1}{4}$.'
          - problem: 'Differentiate $f(x) = 5\arctan x$.'
            answer: '5/(1 + x^2)'
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'The constant factor $5$ stays in front. So $f''(x) = 5 \cdot \frac{1}{1 + x^2} = \frac{5}{1 + x^2}$.'
          - problem: 'Let $f(x) = \arcsin x$. Find $f''(\frac{3}{5})$.'
            answer: '5/4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'We have $f''(x) = \frac{1}{\sqrt{1 - x^2}}$. At $x = \frac{3}{5}$ the root is $\sqrt{1 - \frac{9}{25}} = \frac{4}{5}$, so $f''(\frac{3}{5}) = \frac{5}{4}$.'
          - problem: 'Sam differentiates $f(x) = 4\arccos x$ and writes $f''(x) = \frac{4}{\sqrt{1 - x^2}}$. What is the correct derivative?'
            answer: '-4/sqrt(1 - x^2)'
            answer_contract: {"kind":"function","vars":["x"],"domain":{"x":["1/8","7/8"]}}
            solution_sketch: 'Sam forgot the minus sign of the arccos formula. The derivative of $\arccos x$ is $-\frac{1}{\sqrt{1 - x^2}}$, so $f''(x) = -\frac{4}{\sqrt{1 - x^2}}$.'
          - problem: 'An angle $\theta$, measured in radians, satisfies $\tan\theta = x$ with $-\frac{\pi}{2} < \theta < \frac{\pi}{2}$. By how many radians does $\theta$ increase per unit increase of $x$ at $x = 2$?'
            answer: '1/5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Here $\theta = \arctan x$, so the rate of change is $\frac{d\theta}{dx} = \frac{1}{1 + x^2}$. At $x = 2$ this is $\frac{1}{5}$ radian per unit.'
        constraints: 'the three standard formulas; arccos is the negative of arcsin''s derivative; includes slope and rate contexts'
      - id: kp2
        name: Inverse trig with the chain rule
        key_prerequisites: [chain-rule, inverse-trig-functions]
        step_check:
          step: 'Square the inner function inside the root'
          question: 'Why does $4x$ appear squared inside the root?'
          options:
            - 'The chain rule squares the inner derivative of $4x$'
            - 'The outer formula has $1 - u^2$, and here $u$ is $4x$'
            - 'Only the variable $x$ in $4x$ is squared, giving $4x^2$'
            - 'Every inverse trig derivative squares the whole function'
          answer: 'The outer formula has $1 - u^2$, and here $u$ is $4x$'
          why: 'The formula $\frac{1}{\sqrt{1 - u^2}}$ squares $u = 4x$ as a whole, so $u^2 = 16x^2$; the inner derivative $4$ only appears as a factor on top.'
        exemplars:
          - problem: 'Differentiate $f(x) = \arctan(3x)$.'
            answer: '3/(1 + 9x^2)'
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'The outer derivative is $\frac{1}{1 + u^2}$ with $u = 3x$, and the inner derivative is $3$. So $f''(x) = \frac{3}{1 + 9x^2}$.'
          - problem: 'Differentiate $f(x) = \arcsin(x^2)$.'
            answer: '2x/sqrt(1 - x^4)'
            answer_contract: {"kind":"function","vars":["x"],"domain":{"x":["1/8","7/8"]}}
            solution_sketch: 'The outer derivative is $\frac{1}{\sqrt{1 - u^2}}$ with $u = x^2$, and the inner derivative is $2x$. Since $u^2 = x^4$, we get $f''(x) = \frac{2x}{\sqrt{1 - x^4}}$.'
          - problem: 'A camera stands $50$ m from a launch pad. When the rocket is $h$ metres high, the camera tilts up by the angle $\theta = \arctan\frac{h}{50}$ radians. Find $\frac{d\theta}{dh}$.'
            answer: '50/(2500 + h^2)'
            answer_contract: {"kind":"function","vars":["h"]}
            solution_sketch: 'The outer derivative is $\frac{1}{1 + u^2}$ with $u = \frac{h}{50}$, and the inner derivative is $\frac{1}{50}$. So $\frac{d\theta}{dh} = \frac{1/50}{1 + h^2/2500} = \frac{50}{2500 + h^2}$.'
          - problem: 'Differentiate $f(x) = \arctan(\sqrt{x})$.'
            answer: '1/(2 sqrt(x) (1 + x))'
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'The outer derivative is $\frac{1}{1 + u^2}$ with $u = \sqrt{x}$, and the inner derivative is $\frac{1}{2\sqrt{x}}$. Since $u^2 = x$, we get $f''(x) = \frac{1}{2\sqrt{x}(1 + x)}$.'
          - problem: 'The rocket from the camera problem is $50$ m high and rises at $10$ m/s. How fast, in radians per second, is the camera angle $\theta = \arctan\frac{h}{50}$ changing at that moment?'
            answer: '1/10'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'By the chain rule $\frac{d\theta}{dt} = \frac{d\theta}{dh} \cdot \frac{dh}{dt}$. At $h = 50$ we get $\frac{50}{2500 + 2500} = \frac{1}{100}$, and multiplying by $10$ gives $\frac{1}{10}$.'
          - problem: 'Differentiate $f(x) = \arccos(2x)$.'
            answer: '-2/sqrt(1 - 4x^2)'
            answer_contract: {"kind":"function","vars":["x"],"domain":{"x":["1/10","2/5"]}}
            solution_sketch: 'The outer derivative is $-\frac{1}{\sqrt{1 - u^2}}$ with $u = 2x$, and the inner derivative is $2$. So $f''(x) = -\frac{2}{\sqrt{1 - 4x^2}}$.'
          - problem: 'Differentiate $f(x) = \arcsin(3x)$.'
            answer: '3/sqrt(1 - 9x^2)'
            answer_contract: {"kind":"function","vars":["x"],"domain":{"x":["1/10","3/10"]}}
            solution_sketch: 'The outer derivative is $\frac{1}{\sqrt{1 - u^2}}$ with $u = 3x$, and the inner derivative is $3$. Since $u^2 = 9x^2$, we get $f''(x) = \frac{3}{\sqrt{1 - 9x^2}}$.'
          - problem: 'Sam differentiates $f(x) = \arcsin(5x)$ and writes $f''(x) = \frac{1}{\sqrt{1 - 25x^2}}$. What is the correct derivative?'
            answer: '5/sqrt(1 - 25x^2)'
            answer_contract: {"kind":"function","vars":["x"],"domain":{"x":["1/10","3/20"]}}
            solution_sketch: 'Sam left out the chain rule factor, the derivative $5$ of the inner function $5x$. So the correct derivative is $f''(x) = \frac{5}{\sqrt{1 - 25x^2}}$.'
        constraints: 'inner function bx, x^2, or sqrt(x); the inner square lands inside the formula; includes camera-angle contexts'
      - id: kp3
        name: Products and evaluation
        key_prerequisites: [chain-rule, inverse-trig-functions]
        step_check:
          step: 'apply the product rule'
          question: 'Why does $x\arcsin x$ need the product rule instead of differentiating each factor and multiplying?'
          options:
            - 'Each term differentiates one factor and keeps the other'
            - 'The derivative of a product is the product of the derivatives'
            - 'The factor $x$ has derivative $0$, so only $\arcsin x$ matters'
            - 'Inverse trig functions always need the product rule'
          answer: 'Each term differentiates one factor and keeps the other'
          why: 'In $(uv)'' = u''v + uv''$ each term differentiates one factor only; multiplying the two derivatives would give $\frac{1}{\sqrt{1 - x^2}}$ and lose $\arcsin x$.'
        exemplars:
          - problem: 'Differentiate $f(x) = x\arctan x$.'
            answer: 'arctan(x) + x/(1 + x^2)'
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'The product rule gives $f''(x) = 1 \cdot \arctan x + x \cdot \frac{1}{1 + x^2}$. So $f''(x) = \arctan x + \frac{x}{1 + x^2}$.'
          - problem: 'Differentiate $f(x) = x^2 \arctan x$.'
            answer: '2x arctan(x) + x^2/(1 + x^2)'
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'The product rule gives $f''(x) = 2x\arctan x + x^2 \cdot \frac{1}{1 + x^2}$. Both terms stay as they are.'
          - problem: 'The height of a slide is modelled by $y = x\arctan x$ metres at a horizontal distance of $x$ metres. How steep is the slide, in metres per metre, at $x = 1$?'
            answer: 'pi/4 + 1/2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The steepness is $y'' = \arctan x + \frac{x}{1 + x^2}$. At $x = 1$ this is $\arctan 1 + \frac{1}{2} = \frac{\pi}{4} + \frac{1}{2}$.'
          - problem: 'Let $f(x) = x\arcsin x$. Find $f''(\frac{\sqrt{2}}{2})$.'
            answer: 'pi/4 + 1'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The product rule gives $f''(x) = \arcsin x + \frac{x}{\sqrt{1 - x^2}}$. At $x = \frac{\sqrt{2}}{2}$ we have $\arcsin x = \frac{\pi}{4}$ and $\frac{x}{\sqrt{1 - x^2}} = 1$, so $f'' = \frac{\pi}{4} + 1$.'
          - problem: 'A particle moves along a line so that its position after $t$ seconds is $s(t) = t\arctan t$ metres. What is its velocity, in metres per second, at $t = \sqrt{3}$?'
            answer: 'pi/3 + sqrt(3)/4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The velocity is $s''(t) = \arctan t + \frac{t}{1 + t^2}$. At $t = \sqrt{3}$ we have $\arctan t = \frac{\pi}{3}$ and $\frac{t}{1 + t^2} = \frac{\sqrt{3}}{4}$, so the velocity is $\frac{\pi}{3} + \frac{\sqrt{3}}{4}$.'
          - problem: 'Differentiate $f(x) = \frac{\arctan x}{x}$.'
            answer: '(x/(1 + x^2) - arctan(x))/x^2'
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'The quotient rule gives $f''(x) = \frac{\frac{x}{1 + x^2} - \arctan x}{x^2}$. The numerator is the derivative of the top times $x$, minus the top.'
          - problem: 'Let $f(x) = x\arccos x$. Find $f''(\frac{1}{2})$.'
            answer: 'pi/3 - sqrt(3)/3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The product rule gives $f''(x) = \arccos x - \frac{x}{\sqrt{1 - x^2}}$. At $x = \frac{1}{2}$ we have $\arccos x = \frac{\pi}{3}$ and $\frac{x}{\sqrt{1 - x^2}} = \frac{1}{\sqrt{3}}$, so $f'' = \frac{\pi}{3} - \frac{\sqrt{3}}{3}$.'
          - problem: 'Differentiate $f(x) = e^{\arctan x}$.'
            answer: 'e^(arctan(x))/(1 + x^2)'
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'The outer function $e^u$ keeps its form and the inner derivative is $\frac{1}{1 + x^2}$. So $f''(x) = \frac{e^{\arctan x}}{1 + x^2}$.'
        constraints: 'products, quotients and compositions; evaluation points where 1 - x^2 or 1 + x^2 is a clean value; exact answers'
    diagnostic_exemplar:
      problem: 'Differentiate $f(x) = x \arctan(2x)$.'
      answer: "arctan(2x) + 2x/(1 + 4x^2)"
      answer_contract: {kind: none}
      solution_sketch: 'Product rule with $\frac{d}{dx}\arctan(2x) = \frac{2}{1 + (2x)^2}$: $\arctan(2x) + \frac{2x}{1 + 4x^2}$.'
    anki_seeds:
      - front: "d/dx arcsin x and d/dx arctan x = ?"
        back: "1/√(1 - x²) and 1/(1 + x²)"
        type: basic
      - front: "d/dx arccos x = ?"
        back: "-1/√(1 - x²) — the negative of arcsin's derivative"
        type: basic

  - id: logarithmic-differentiation
    name: Logarithmic Differentiation
    core: false                # special-case technique; nothing downstream
    difficulty: 0.68
    drill: false
    answer_kind: expression
    expected_time_secs: 210
    prerequisites:
      - id: derivatives-natural-log
        weight: 0.7
        key: true
      - id: implicit-differentiation-basic
        weight: 0.6
        key: true
      - id: derivatives-exp-log
        weight: 0.5
      - id: derivatives-sin-cos
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: Variable base to a variable power
        key_prerequisites: [derivatives-natural-log, implicit-differentiation-basic]
        step_check:
          step: 'Multiply both sides by $y$ to solve for $y''$'
          question: 'Why do we multiply both sides by $y$ at this step?'
          options:
            - 'Multiplying by $y$ removes the logarithm from the right side of the equation'
            - 'The left side is $\frac{y''}{y}$, so multiplying by $y$ leaves $y''$'
            - 'The original equation requires $y$ to equal $1$ at the end of the work'
            - 'Both sides must be multiplied by whatever quantity was taken as a log'
          answer: 'The left side is $\frac{y''}{y}$, so multiplying by $y$ leaves $y''$'
          why: 'Differentiating $\ln y$ gives $\frac{y''}{y}$, not $y''$, so multiplying by $y = x^{3x}$ gives $y'' = x^{3x}(3\ln x + 3)$.'
        try_first:
          problem: 'Let $y = e^{x\ln x}$, which is the same function as $x^x$ for $x > 0$. Find $y''(1)$.'
          answer_contract: {"kind":"exact"}
          answer: '1'
          reveal: 'The chain rule gives $y'' = e^{x\ln x}(\ln x + 1)$, and at $x = 1$ this is $1$. Logarithmic differentiation reaches the same result by taking $\ln y = x\ln x$ first.'
        exemplars:
          - problem: 'Let $y = x^{x}$ for $x > 0$. Find $y''(e)$.'
            answer: '2e^e'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Taking logarithms gives $\ln y = x\ln x$, so $\frac{y''}{y} = \ln x + 1$ and $y'' = x^x(\ln x + 1)$. At $x = e$ this is $e^e \cdot 2$.'
          - problem: 'Let $y = x^{4x}$ for $x > 0$. Taking natural logarithms and differentiating implicitly, what is $\frac{y''}{y}$?'
            answer: '4 ln(x) + 4'
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'Taking logarithms gives $\ln y = 4x\ln x$. The product rule then gives $\frac{y''}{y} = 4\ln x + 4x \cdot \frac{1}{x} = 4\ln x + 4$.'
          - problem: 'Find an equation of the tangent line to $y = x^{3x}$ at $x = 1$.'
            answer: 'y = 3x - 2'
            answer_contract: {"kind":"polynomial_relation"}
            solution_sketch: 'At $x = 1$ the value is $y = 1$. Logarithmic differentiation gives $y'' = x^{3x}(3\ln x + 3)$, so the slope is $3$, and the line is $y - 1 = 3(x - 1)$, that is $y = 3x - 2$.'
          - problem: 'A colony has $P(t) = t^{t}$ thousand cells after $t$ hours, for $t > 0$. How fast is the colony growing at $t = 2$, in thousands of cells per hour?'
            answer: '4 + 4 ln(2)'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Taking logarithms gives $\ln P = t\ln t$, so $P'' = t^t(\ln t + 1)$. At $t = 2$ this is $4(\ln 2 + 1) = 4 + 4\ln 2$ thousand cells per hour.'
          - problem: 'Let $y = (2x)^{x}$ for $x > 0$. Find $y''(1)$.'
            answer: '2 + 2 ln(2)'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Taking logarithms gives $\ln y = x\ln(2x)$. So $\frac{y''}{y} = \ln(2x) + 1$ and $y''(1) = 2(\ln 2 + 1) = 2 + 2\ln 2$.'
          - problem: 'Let $y = x^{\sqrt{x}}$ for $x > 0$. Find $y''(4)$.'
            answer: '8 ln(2) + 8'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Taking logarithms gives $\ln y = \sqrt{x}\ln x$, so $\frac{y''}{y} = \frac{\ln x}{2\sqrt{x}} + \frac{1}{\sqrt{x}}$. At $x = 4$ this is $\frac{\ln 4}{4} + \frac{1}{2}$, and multiplying by $y = 16$ gives $8\ln 2 + 8$.'
          - problem: 'A particle moves so that its position after $t$ seconds is $s(t) = t^{2t}$ metres for $t > 0$. What is its velocity, in metres per second, at $t = \frac{1}{2}$?'
            answer: '1 - ln(2)'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Taking logarithms gives $\ln s = 2t\ln t$, so $s'' = t^{2t}(2\ln t + 2)$. At $t = \frac{1}{2}$ we have $t^{2t} = \frac{1}{2}$ and the bracket is $2 - 2\ln 2$, so the velocity is $1 - \ln 2$.'
          - problem: 'Let $y = (x + 2)^{x}$ for $x > -2$. Find $y''(1)$.'
            answer: '3 ln(3) + 1'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Taking logarithms gives $\ln y = x\ln(x + 2)$, so $\frac{y''}{y} = \ln(x + 2) + \frac{x}{x + 2}$. At $x = 1$ this is $\ln 3 + \frac{1}{3}$, and multiplying by $y = 3$ gives $3\ln 3 + 1$.'
        constraints: 'x^(u(x)) or (a(x))^x forms; take ln of both sides, differentiate implicitly, multiply back by y; the dy/dx expression is a grader gap (variable exponent), so answers are y''/y, tangent lines or values'
      - id: kp2
        name: Big products and quotients
        key_prerequisites: [derivatives-natural-log, implicit-differentiation-basic]
        step_check:
          step: 'Take logs and expand'
          question: 'Why is $\ln y$ expanded into a sum before differentiating?'
          options:
            - 'The product rule does not apply to a product of three or more factors'
            - 'Taking logs makes the derivative of each factor equal to $1$ everywhere'
            - 'Each factor gets its own log term, which is simple to differentiate'
            - 'The exponents $3$ and $\frac{1}{2}$ must be moved into the bases first'
          answer: 'Each factor gets its own log term, which is simple to differentiate'
          why: 'The log laws turn the product and the powers into $3\ln(x+2) + \frac{1}{2}\ln(x-1)$, whose derivative is a short sum of fractions.'
        exemplars:
          - problem: 'Use logarithmic differentiation to find $\frac{dy}{dx}$ for $y = (x + 1)^2 (x + 2)^3$.'
            answer: '(x + 1)(x + 2)^2 (5x + 7)'
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'Taking logarithms gives $\ln y = 2\ln(x + 1) + 3\ln(x + 2)$, so $\frac{y''}{y} = \frac{2}{x + 1} + \frac{3}{x + 2}$. Multiplying by $y$ and simplifying gives $(x + 1)(x + 2)^2(5x + 7)$.'
          - problem: 'Use logarithmic differentiation to find $\frac{dy}{dx}$ for $y = x^2\sqrt{x + 1}$.'
            answer: 'x(5x + 4)/(2 sqrt(x + 1))'
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'Taking logarithms gives $\ln y = 2\ln x + \frac{1}{2}\ln(x + 1)$, so $\frac{y''}{y} = \frac{2}{x} + \frac{1}{2(x + 1)}$. Multiplying by $y$ and simplifying gives $\frac{x(5x + 4)}{2\sqrt{x + 1}}$.'
          - problem: 'A box has width $x$ cm, length $(x + 2)^2$ cm and height $\sqrt{x + 1}$ cm, so its volume is $V = x(x + 2)^2\sqrt{x + 1}$ cubic centimetres. How fast does the volume change per centimetre of width when $x = 3$, in cubic centimetres per centimetre?'
            answer: '515/4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Taking logarithms gives $\frac{V''}{V} = \frac{1}{x} + \frac{2}{x + 2} + \frac{1}{2(x + 1)}$. At $x = 3$ this is $\frac{1}{3} + \frac{2}{5} + \frac{1}{8} = \frac{103}{120}$, and $V = 3 \cdot 25 \cdot 2 = 150$, so $V'' = \frac{515}{4}$.'
          - problem: 'Use logarithmic differentiation to find $\frac{dy}{dx}$ for $y = x^4(x + 4)^3$.'
            answer: 'x^3 (x + 4)^2 (7x + 16)'
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'Taking logarithms gives $\frac{y''}{y} = \frac{4}{x} + \frac{3}{x + 4}$. Multiplying by $y$ and simplifying gives $x^3(x + 4)^2(7x + 16)$.'
          - problem: 'Use logarithmic differentiation to find $\frac{dy}{dx}$ for $y = \sqrt{x}\,(x + 3)^2$.'
            answer: '(x + 3)(5x + 3)/(2 sqrt(x))'
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'Taking logarithms gives $\frac{y''}{y} = \frac{1}{2x} + \frac{2}{x + 3}$. Multiplying by $y$ and simplifying gives $\frac{(x + 3)(5x + 3)}{2\sqrt{x}}$.'
          - problem: 'A drug has concentration $C(t) = \frac{t^2}{(t + 1)^3}$ mg/L, $t$ hours after an injection. At what time is the concentration greatest?'
            answer: '2'
            answer_contract: {"kind":"unit","quantity":"time","unit":"h","allow_omitted":true}
            solution_sketch: 'Taking logarithms gives $\frac{C''}{C} = \frac{2}{t} - \frac{3}{t + 1} = \frac{2 - t}{t(t + 1)}$. This is positive for $t < 2$ and negative for $t > 2$, so the concentration is greatest at $t = 2$ hours.'
          - problem: 'Use logarithmic differentiation to find $\frac{dy}{dx}$ for $y = \frac{x^2}{\sqrt{x + 2}}$.'
            answer: 'x(3x + 8)/(2 (x + 2)^(3/2))'
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'Taking logarithms gives $\frac{y''}{y} = \frac{2}{x} - \frac{1}{2(x + 2)}$. Multiplying by $y$ and simplifying gives $\frac{x(3x + 8)}{2(x + 2)\sqrt{x + 2}}$.'
          - problem: 'Use logarithmic differentiation to find $\frac{dy}{dx}$ for $y = \frac{(x + 1)^3 (x - 2)^4}{(x + 3)^2}$.'
            answer: '(x+1)^2(x-2)^3(5x^2+21x-2)/(x+3)^3'
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'Taking logarithms gives $\frac{y''}{y} = \frac{3}{x + 1} + \frac{4}{x - 2} - \frac{2}{x + 3}$. Multiplying by $y$ and combining over a common denominator gives $\frac{(x + 1)^2(x - 2)^3(5x^2 + 21x - 2)}{(x + 3)^3}$.'
          - problem: 'Use logarithmic differentiation to find $\frac{dy}{dx}$ for $y = x^2 (x + 3)(x + 6)^3$.'
            answer: '3x (x + 4)(x + 6)^2 (2x + 3)'
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'Taking logarithms gives $\frac{y''}{y} = \frac{2}{x} + \frac{1}{x + 3} + \frac{3}{x + 6}$. Multiplying by $y$ and simplifying gives $3x(x + 4)(x + 6)^2(2x + 3)$.'
        constraints: '2-3 factors with integer powers or square roots; includes box-volume and concentration contexts; any equal form of the derivative is accepted'
      - id: kp3
        name: Choose the right tool
        key_prerequisites: [derivatives-natural-log, derivatives-exp-log]
        step_check:
          step: 'the power rule and the rule for $a^x$ both fail here'
          question: 'Why do the power rule and the rule for $a^x$ both fail for $x^{2x}$?'
          options:
            - 'The power rule needs a constant exponent, the other a constant base'
            - 'Both rules only work when the exponent is a whole number greater than $1$'
            - 'Both rules fail whenever the exponent is larger than the base'
            - 'Both rules are only valid for negative values of the variable'
          answer: 'The power rule needs a constant exponent, the other a constant base'
          why: 'In $x^{2x}$ both the base and the exponent change with $x$, so neither rule applies and the function is rewritten as $e^{2x\ln x}$.'
        exemplars:
          - problem: 'A lab models three quantities for $t > 0$ by $P(t) = t^3$, $Q(t) = 3^t$ and $R(t) = t^t$. Neither the power rule nor the rule for $a^x$ gives the derivative of one of them. Which one?'
            answer: 'R'
            answer_contract: {"kind":"label","options":[["R","R(t)","t^t","the third","the third one","third"],["P","P(t)","t^3","the first","the first one","first"],["Q","Q(t)","3^t","the second","the second one","second"]]}
            solution_sketch: 'The power rule needs a constant exponent and the rule for $a^x$ needs a constant base. Only $R(t) = t^t$ has a variable base and a variable exponent, so $R$ needs logarithmic differentiation.'
          - problem: 'Sam differentiates $y = x^x$ with the power rule and writes $y'' = x \cdot x^{x - 1} = x^x$. Is Sam right?'
            answer: 'no'
            answer_contract: {"kind":"label","options":[["yes","yes, Sam is right","Sam is right","right","correct"],["no","no, Sam is wrong","Sam is wrong","wrong","incorrect","not right"]]}
            solution_sketch: 'The power rule needs a constant exponent, but the exponent here is $x$. The correct derivative is $y'' = x^x(\ln x + 1)$, so Sam is wrong.'
          - problem: 'Let $y = x^{\sin x}$ for $x > 0$. Taking natural logarithms and differentiating implicitly, what is $\frac{y''}{y}$?'
            answer: 'cos(x) ln(x) + sin(x)/x'
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'Taking logarithms gives $\ln y = \sin x\ln x$. The product rule then gives $\frac{y''}{y} = \cos x\ln x + \frac{\sin x}{x}$.'
          - problem: 'Differentiate $y = x^8$.'
            answer: '8x^7'
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'The exponent is constant, so the power rule applies. The derivative is $8x^7$.'
          - problem: 'Let $y = 5^x$. Find $y''(2)$.'
            answer: '25 ln(5)'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The base is constant, so $y'' = 5^x\ln 5$. At $x = 2$ this is $25\ln 5$.'
          - problem: 'Let $y = x^{\sin x}$ for $x > 0$. Find $y''(\frac{\pi}{2})$.'
            answer: '1'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Logarithmic differentiation gives $y'' = x^{\sin x}\left(\cos x\ln x + \frac{\sin x}{x}\right)$. At $x = \frac{\pi}{2}$ we have $\cos x = 0$ and $\sin x = 1$, so $y'' = \frac{\pi}{2} \cdot \frac{2}{\pi} = 1$.'
          - problem: 'An account holds $1000(1.05)^t$ dollars after $t$ years. How fast is the balance growing at $t = 0$, in dollars per year, to two decimal places?'
            answer: '48.79'
            answer_contract: {"kind":"approx","decimals":2}
            solution_sketch: 'The base is constant, so the derivative is $1000(1.05)^t\ln 1.05$. At $t = 0$ this is $1000\ln 1.05$, which is about $48.79$ dollars per year.'
        constraints: 'contrast constant-base, constant-exponent, and variable-variable cases; includes a growth-model context'
    diagnostic_exemplar:
      problem: 'Differentiate $y = x^{\ln x}$ for $x > 0$.'
      answer: "x^(ln x) (2 ln x)/x"
      answer_contract: {kind: none}
      solution_sketch: '$\ln y = (\ln x)^2$, so $y''/y = 2\ln x \cdot \frac{1}{x}$ and $y'' = x^{\ln x}\cdot\frac{2\ln x}{x}$.'
    anki_seeds:
      - front: "Logarithmic differentiation procedure:"
        back: "take ln of both sides; differentiate implicitly (y'/y = ...); multiply by y"
        type: basic
      - front: "d/dx x^x = ?"
        back: "x^x (ln x + 1)"
        type: basic

  - id: combining-differentiation-rules
    name: Combining Differentiation Rules
    core: true
    difficulty: 0.7
    drill: false
    answer_kind: expression
    expected_time_secs: 210
    prerequisites:
      - id: chain-rule
        weight: 0.6
        key: true
      - id: derivatives-trig
        weight: 0.6
        key: true
      - id: derivatives-exp-log
        weight: 0.6
        key: true
    knowledge_points:
      - id: kp1
        name: Chain rule through transcendental layers
        key_prerequisites: [chain-rule, derivatives-trig, derivatives-exp-log]
        step_check:
          step: 'keeping the inner function in place'
          question: 'Why does $\cos x$ stay inside the exponent when $e^u$ is differentiated here?'
          options:
            - 'The derivative of $e^u$ is $ue^u$, and $u$ is later replaced'
            - 'The inner function is only differentiated before the outer one'
            - 'The exponent of $e$ is a constant, so it cannot change'
            - 'The derivative of $e^u$ is $e^u$, so $u$ is left unchanged'
          answer: 'The derivative of $e^u$ is $e^u$, so $u$ is left unchanged'
          why: 'The outer rule gives $e^u$ with $u = \cos x$ still inside, and only then the factor $-\sin x$ from the inner layer is multiplied on.'
        exemplars:
          - problem: 'Differentiate $f(x) = e^{\sin x}$.'
            answer: 'e^(sin(x)) cos(x)'
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'The outer function is $e^u$ with $u = \sin x$, and its derivative is $e^u$. Multiplying by the inner derivative $\cos x$ gives $f''(x) = e^{\sin x}\cos x$.'
          - problem: 'Differentiate $f(x) = \sin(e^x)$.'
            answer: 'e^x cos(e^x)'
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'The outer function is $\sin u$ with $u = e^x$, and its derivative is $\cos u$. Multiplying by the inner derivative $e^x$ gives $f''(x) = e^x\cos(e^x)$.'
          - problem: 'The temperature of a metal plate is $T(x) = 100e^{\cos x}$ degrees Celsius at a distance of $x$ centimetres from its edge. How fast does the temperature change, in degrees per centimetre, at $x = \frac{\pi}{2}$?'
            answer: '-100'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The derivative is $T''(x) = -100\sin x \cdot e^{\cos x}$ by the chain rule. At $x = \frac{\pi}{2}$ we have $\sin x = 1$ and $e^{\cos x} = e^0 = 1$, so $T'' = -100$ degrees per centimetre.'
          - problem: 'Differentiate $f(x) = \ln(1 + e^x)$.'
            answer: 'e^x/(1 + e^x)'
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'The outer function is $\ln u$ with derivative $\frac{1}{u}$, and the inner derivative is $e^x$. So $f''(x) = \frac{e^x}{1 + e^x}$.'
          - problem: 'Differentiate $f(x) = \cos(\ln x)$.'
            answer: '-sin(ln(x))/x'
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'The outer function is $\cos u$ with derivative $-\sin u$, and the inner derivative is $\frac{1}{x}$. So $f''(x) = -\frac{\sin(\ln x)}{x}$.'
          - problem: 'A signal has strength $S(t) = e^{\sin t}$ at time $t$ seconds. What is the rate of change of the strength at $t = \pi$, in units per second?'
            answer: '-1'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'By the chain rule $S''(t) = e^{\sin t}\cos t$. At $t = \pi$ we have $\sin t = 0$ and $\cos t = -1$, so $S''(\pi) = e^0 \cdot (-1) = -1$.'
          - problem: 'Differentiate $f(x) = \ln(\sin x)$.'
            answer: 'cot(x)'
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'The outer function is $\ln u$ with derivative $\frac{1}{u}$, and the inner derivative is $\cos x$. So $f''(x) = \frac{\cos x}{\sin x} = \cot x$.'
          - problem: 'Sam writes $\frac{d}{dx}\cos(e^{2x}) = -\sin(e^{2x})$. What is the correct derivative?'
            answer: '-2e^(2x) sin(e^(2x))'
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'Sam left out the inner derivative. The inner function $e^{2x}$ has derivative $2e^{2x}$, so the correct derivative is $-2e^{2x}\sin(e^{2x})$.'
        constraints: 'one transcendental function inside another; single chain application; includes plate-temperature and signal contexts'
      - id: kp2
        name: Products and quotients of transcendental factors
        key_prerequisites: [derivatives-trig, derivatives-exp-log]
        step_check:
          step: 'Apply the product rule'
          question: 'Why does the product rule for $x^2\ln x$ have two terms?'
          options:
            - 'The two factors are differentiated together and then the derivatives multiply'
            - 'One term is for the power and one is for the logarithm of the base value'
            - 'Each factor is differentiated while the other stays, and the terms add'
            - 'Any product with the factor $x$ always has exactly two terms in its derivative'
          answer: 'Each factor is differentiated while the other stays, and the terms add'
          why: 'The rule $u''v + uv''$ gives $2x\ln x + x^2 \cdot \frac{1}{x}$; multiplying the two derivatives instead would give just $2$.'
        exemplars:
          - problem: 'Differentiate $f(x) = e^x \sin x$.'
            answer: 'e^x (sin(x) + cos(x))'
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'The product rule gives $f''(x) = e^x\sin x + e^x\cos x$. Factoring out $e^x$ gives $e^x(\sin x + \cos x)$.'
          - problem: 'Differentiate $f(x) = \frac{\ln x}{x}$.'
            answer: '(1 - ln(x))/x^2'
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'The quotient rule gives $f''(x) = \frac{\frac{1}{x} \cdot x - \ln x \cdot 1}{x^2}$. The numerator simplifies to $1 - \ln x$, so $f''(x) = \frac{1 - \ln x}{x^2}$.'
          - problem: 'A drug has concentration $C(t) = te^{-t/2}$ mg/L, $t$ hours after an injection. At what time is the concentration greatest?'
            answer: '2'
            answer_contract: {"kind":"unit","quantity":"time","unit":"h","allow_omitted":true}
            solution_sketch: 'The product rule gives $C''(t) = e^{-t/2}\left(1 - \frac{t}{2}\right)$. This is positive for $t < 2$ and negative for $t > 2$, so the concentration is greatest at $t = 2$ hours.'
          - problem: 'Differentiate $f(x) = x^2 e^{-x}$.'
            answer: 'e^(-x)(2x - x^2)'
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'The product rule gives $f''(x) = 2xe^{-x} + x^2 \cdot (-e^{-x})$. Factoring out $e^{-x}$ gives $e^{-x}(2x - x^2)$.'
          - problem: 'A damped spring has displacement $y(t) = e^{-t}\sin t$ metres at time $t$ seconds. What is its velocity, in metres per second, at $t = 0$?'
            answer: '1'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The product rule gives $y''(t) = -e^{-t}\sin t + e^{-t}\cos t$. At $t = 0$ this is $0 + 1 \cdot 1 = 1$ metre per second.'
          - problem: 'Sam differentiates $f(x) = xe^x$ by multiplying the derivatives of the two factors and gets $e^x$. What is the correct derivative?'
            answer: '(x + 1)e^x'
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'Sam used the wrong rule, because the derivative of a product is not the product of the derivatives. The product rule gives $e^x + xe^x = (x + 1)e^x$.'
          - problem: 'Differentiate $f(x) = \frac{\sin x}{e^{3x}}$.'
            answer: 'e^(-3x)(cos(x) - 3 sin(x))'
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'The quotient rule gives $f''(x) = \frac{e^{3x}\cos x - 3e^{3x}\sin x}{e^{6x}}$. Cancelling $e^{3x}$ gives $e^{-3x}(\cos x - 3\sin x)$.'
          - problem: 'Differentiate $f(x) = e^{4x}\tan x$.'
            answer: 'e^(4x)(4 tan(x) + sec(x)^2)'
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'The product rule gives $f''(x) = 4e^{4x}\tan x + e^{4x}\sec^2 x$. Factoring out $e^{4x}$ gives $e^{4x}(4\tan x + \sec^2 x)$.'
          - problem: 'Differentiate $f(x) = x^3\sin x$.'
            answer: 'x^2 (3 sin(x) + x cos(x))'
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'The product rule gives $f''(x) = 3x^2\sin x + x^3\cos x$. Factoring out $x^2$ gives $x^2(3\sin x + x\cos x)$.'
        constraints: 'two factors mixing power, trig, exp, and log; includes concentration, spring and error-analysis items; any equal form is accepted'
      - id: kp3
        name: Multi-layer problems requiring a strategy
        key_prerequisites: [chain-rule, derivatives-trig, derivatives-exp-log]
        step_check:
          step: 'the outermost structure is a product of two factors'
          question: 'Why is the product rule the outer rule for $e^{2x}\sin(x^2)$?'
          options:
            - 'The chain rule always has to be applied last in a multi-layer problem'
            - 'The last operation that joins the two pieces is a multiplication'
            - 'A function with two layers always needs two rules, so the product rule comes first'
            - 'Exponential functions are always differentiated by the product rule'
          answer: 'The last operation that joins the two pieces is a multiplication'
          why: 'The two factors $e^{2x}$ and $\sin(x^2)$ are multiplied last, so the product rule goes first and the chain rule is used inside each factor.'
        exemplars:
          - problem: 'Differentiate $f(x) = x^2 e^{3x}$.'
            answer: '2x e^(3x) + 3x^2 e^(3x)'
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'The product rule gives $f''(x) = 2xe^{3x} + x^2 \cdot 3e^{3x}$, where the chain rule gives the factor $3$. So $f''(x) = 2xe^{3x} + 3x^2e^{3x}$.'
          - problem: 'Differentiate $f(x) = \sqrt{1 + \sin^2 x}$.'
            answer: 'sin(x) cos(x)/sqrt(1 + sin(x)^2)'
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'The outer function is the square root, with derivative $\frac{1}{2\sqrt{u}}$. The inner derivative is $2\sin x\cos x$, so $f''(x) = \frac{\sin x\cos x}{\sqrt{1 + \sin^2 x}}$.'
          - problem: 'Differentiate $f(x) = \tan(e^{2x})$.'
            answer: '2e^(2x) sec(e^(2x))^2'
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'The outer function is $\tan u$ with derivative $\sec^2 u$. The inner derivative is $2e^{2x}$, so $f''(x) = 2e^{2x}\sec^2(e^{2x})$.'
          - problem: 'Is the outermost structure of $f(x) = e^x\sin(x^2)$ a sum, a product, a quotient or a composition?'
            answer: 'a product'
            answer_contract: {"kind":"label","options":[["a product","product","product rule","a product of two factors"],["a quotient","quotient","quotient rule"],["a composition","composition","composite","chain rule","a composite function"],["a sum","sum","sum rule"]]}
            solution_sketch: 'The last operation that combines the two pieces $e^x$ and $\sin(x^2)$ is a multiplication. So the outermost structure is a product, and the product rule is applied first.'
          - problem: 'Differentiate $f(x) = e^{x^2}\cos(3x)$.'
            answer: 'e^(x^2)(2x cos(3x) - 3 sin(3x))'
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'The product rule gives $f''(x) = 2xe^{x^2}\cos 3x - 3e^{x^2}\sin 3x$, using the chain rule on each factor. Factoring out $e^{x^2}$ gives the result.'
          - problem: 'A pendulum has angle $\theta(t) = e^{-t/5}\cos(2t)$ radians at time $t$ seconds. What is its angular velocity, in radians per second, at $t = 0$?'
            answer: '-1/5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The product rule gives $\theta''(t) = -\frac{1}{5}e^{-t/5}\cos 2t - 2e^{-t/5}\sin 2t$. At $t = 0$ this is $-\frac{1}{5}$ radian per second.'
          - problem: 'Differentiate $f(x) = \frac{\sin 2x}{x}$.'
            answer: '(2x cos(2x) - sin(2x))/x^2'
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'The quotient rule gives $f''(x) = \frac{2\cos 2x \cdot x - \sin 2x}{x^2}$, where the chain rule gives the factor $2$. So $f''(x) = \frac{2x\cos 2x - \sin 2x}{x^2}$.'
          - problem: 'The light intensity at depth $d$ metres in a lake is $I(d) = d^2e^{-d/2}$. At what depth $d > 0$ is the intensity greatest?'
            answer: '4'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'The product rule gives $I''(d) = de^{-d/2}\left(2 - \frac{d}{2}\right)$. For $d > 0$ this is positive below $d = 4$ and negative above, so the intensity is greatest at $4$ metres.'
          - problem: 'Differentiate $f(x) = x^3\ln(2x + 1)$.'
            answer: '3x^2 ln(2x + 1) + 2x^3/(2x + 1)'
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'The product rule gives $f''(x) = 3x^2\ln(2x + 1) + x^3 \cdot \frac{2}{2x + 1}$, where the chain rule gives the factor $2$. So $f''(x) = 3x^2\ln(2x + 1) + \frac{2x^3}{2x + 1}$.'
        constraints: 'at least two rules per problem (chain + product/quotient/power); plan before differentiating; includes pendulum and light-intensity contexts'
    diagnostic_exemplar:
      problem: 'Differentiate $f(x) = e^{2x}\sin x$.'
      answer: "e^(2x)(2 sin x + cos x)"
      solution_sketch: 'Product rule with a chain-rule factor: $2e^{2x}\sin x + e^{2x}\cos x$; factor out $e^{2x}$.'
    anki_seeds:
      - front: "Attacking a multi-rule derivative, first identify..."
        back: "the OUTERMOST structure (sum, product, quotient, or composition) and apply its rule first"
        type: basic
      - front: "d/dx e^(u(x)) and d/dx ln(u(x)) in one line:"
        back: "u'·e^u and u'/u"
        type: basic
