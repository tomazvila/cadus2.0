        name: Tangent lines to implicit curves
        key_prerequisites: [implicit-differentiation-basic, tangent-line-equation]
        exemplars:
          - problem: 'Find the slope of the tangent to $x^2 - y^2 = 9$ at $(5, 4)$.'
            answer: "5/4"
            solution_sketch: '$2x - 2y\frac{dy}{dx} = 0$ gives $\frac{dy}{dx} = \frac{x}{y} = \frac{5}{4}$.'
          - problem: 'Find the slope of the tangent to $x^2 + xy = 10$ at $(2, 3)$.'
            answer: "-7/2"
            solution_sketch: '$\frac{dy}{dx} = -\frac{2x + y}{x} = -\frac{4 + 3}{2} = -\frac{7}{2}$.'
          - problem: 'Find the tangent line to $x^2 + y^2 = 25$ at $(3, 4)$. Give the expression for $y$.'
            answer: "-3x/4 + 25/4"
            solution_sketch: 'Slope $-\frac{x}{y} = -\frac{3}{4}$; point-slope through $(3, 4)$ gives $y = -\frac{3x}{4} + \frac{25}{4}$.'
        constraints: "the given point must satisfy the equation; slopes are simple fractions"
      - id: kp3
        name: Second derivatives implicitly
        key_prerequisites: [implicit-differentiation-basic, product-quotient-rules]
        exemplars:
          - problem: 'For $x^2 + y^2 = 25$, find $\frac{d^2y}{dx^2}$ in terms of $x$ and $y$ (simplify using the original equation).'
            answer: "-25/y^3"
            solution_sketch: '$y'' = -\frac{x}{y}$; quotient rule gives $y'''' = -\frac{y - x y''}{y^2} = -\frac{y^2 + x^2}{y^3} = -\frac{25}{y^3}$.'
          - problem: 'For $y^2 = 4x$, find $\frac{d^2y}{dx^2}$ in terms of $y$.'
            answer: "-4/y^3"
            solution_sketch: '$y'' = \frac{2}{y}$; then $y'''' = -\frac{2}{y^2} y'' = -\frac{2}{y^2} \cdot \frac{2}{y} = -\frac{4}{y^3}$.'
        constraints: "differentiate dy/dx again, substitute the first derivative, and simplify with the original equation"
    diagnostic_exemplar:
      problem: 'For $x^2 + y^2 = 16$, find $\frac{d^2y}{dx^2}$ in terms of $y$ (simplify using the original equation).'
      answer: '-16/y^3'
      solution_sketch: 'Implicitly $y'' = -x/y$; differentiating again, $y'''' = -\frac{y - x y''}{y^2} = -\frac{y + x^2/y}{y^2} = -\frac{x^2 + y^2}{y^3} = -\frac{16}{y^3}$.'
    anki_seeds:
      - front: "After computing y'' implicitly, always simplify using..."
        back: "the original equation (substitute it to collapse x² + y² -type expressions)"
        type: basic
      - front: "d/dx [xy] = ?"
        back: "y + x·dy/dx (product rule — both factors vary)"
        type: basic

  - id: derivatives-inverse-functions
    name: Derivatives of Inverse Functions
    core: true
    difficulty: 0.65
    drill: false
    answer_kind: numeric
    expected_time_secs: 150
    prerequisites:
      - id: inverse-functions
        weight: 0.6
        key: true
      - id: chain-rule
        weight: 0.6
        key: true
      - id: derivative-definition
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: The inverse-derivative formula
        key_prerequisites: [inverse-functions, chain-rule]
        exemplars:
          - problem: 'Let $f(x) = x^3 + 2$, so $f(1) = 3$. Find $(f^{-1})''(3)$.'
            answer: "1/3"
            solution_sketch: '$(f^{-1})''(3) = \frac{1}{f''(f^{-1}(3))} = \frac{1}{f''(1)} = \frac{1}{3}$.'
          - problem: 'Let $f(x) = x^5 + x + 1$, so $f(1) = 3$. Find $(f^{-1})''(3)$.'
            answer: "1/6"
            solution_sketch: '$f''(x) = 5x^4 + 1$, so $f''(1) = 6$.'
        constraints: "f(a) given or trivially computed; f'(a) is a small integer"
      - id: kp2
        name: Inverse derivatives from tables
        key_prerequisites: [inverse-functions, chain-rule]
        exemplars:
          - problem: 'Given $f(2) = 5$ and $f''(2) = 8$, find $(f^{-1})''(5)$.'
            answer: "1/8"
          - problem: 'Given $g(-1) = 4$ and $g''(-1) = 3$, find $(g^{-1})''(4)$.'
            answer: "1/3"
        constraints: "table gives f and f' at one point; the student inverts through the OUTPUT value"
      - id: kp3
        name: Where the formula comes from
        key_prerequisites: [chain-rule, inverse-functions]
        exemplars:
          - problem: 'Differentiate both sides of $f(f^{-1}(x)) = x$ with the chain rule to see why $(f^{-1})''$ is the reciprocal of $f''$ at the pre-image. Then apply it: for $f(x) = x^2 + 1$ with $x > 0$, find $(f^{-1})''(5)$.'
            answer: "1/4"
            solution_sketch: 'Chain rule: $f''(f^{-1}(x)) \cdot (f^{-1})''(x) = 1$, so $(f^{-1})''(x) = \frac{1}{f''(f^{-1}(x))}$. Here $f^{-1}(5) = 2$ and $f''(2) = 4$, giving $\frac{1}{4}$.'
          - problem: 'Let $f(x) = x^3$. Find $(f^{-1})''(8)$.'
            answer: "1/12"
            solution_sketch: '$f^{-1}(8) = 2$ and $f''(2) = 12$.'
          - problem: 'Let $f(x) = x^3 + x$, so $f(2) = 10$. Find $(f^{-1})''(10)$.'
            answer: "1/13"
        constraints: "evaluate at the correct pre-image; reciprocal answers are unit fractions"
    diagnostic_exemplar:
      problem: 'Let $f(x) = x^3$. Find $(f^{-1})''(27)$.'
      answer: "1/27"
      solution_sketch: '$f^{-1}(27) = 3$ and $f''(3) = 27$, so $(f^{-1})''(27) = \frac{1}{27}$.'
    anki_seeds:
      - front: "Inverse function derivative: (f⁻¹)'(b) = ?"
        back: "1 / f'(f⁻¹(b)) — the reciprocal of f' at the PRE-image of b"
        type: basic
      - front: "Graphically, the tangent slopes of f and f⁻¹ at mirrored points are..."
        back: "reciprocals of each other (reflection across y = x)"
        type: basic

  - id: derivatives-inverse-trig
    name: Derivatives of Inverse Trigonometric Functions
    core: true
    difficulty: 0.68
    drill: false
    answer_kind: expression
    expected_time_secs: 150
    prerequisites:
      - id: inverse-trig-functions
        weight: 0.6
        key: true
      - id: chain-rule
        weight: 0.6
        key: true
      - id: implicit-differentiation-basic
        weight: 0.4
      - id: derivatives-inverse-functions
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: The three main formulas
        key_prerequisites: [inverse-trig-functions, implicit-differentiation-basic]
        exemplars:
          - problem: 'Differentiate $f(x) = \arcsin x$.'
            answer: "1/√(1 - x^2)"
            solution_sketch: 'From $\sin y = x$: $\cos y \cdot y'' = 1$, and $\cos y = \sqrt{1 - x^2}$ on the principal range.'
          - problem: 'Differentiate $f(x) = \arctan x$.'
            answer: "1/(1 + x^2)"
          - problem: 'Differentiate $f(x) = \arccos x$.'
            answer: "-1/√(1 - x^2)"
        constraints: "the three standard formulas; arccos is the negative of arcsin's derivative"
      - id: kp2
        name: Inverse trig with the chain rule
        key_prerequisites: [chain-rule, inverse-trig-functions]
        exemplars:
          - problem: 'Differentiate $f(x) = \arctan(3x)$.'
            answer: "3/(1 + 9x^2)"
          - problem: 'Differentiate $f(x) = \arcsin(x^2)$.'
            answer: "2x/√(1 - x^4)"
            solution_sketch: '$\frac{1}{\sqrt{1 - (x^2)^2}} \cdot 2x$.'
          - problem: 'Differentiate $f(x) = \arctan(\sqrt{x})$.'
            answer: "1/(2√x (1 + x))"
            solution_sketch: '$\frac{1}{1 + x} \cdot \frac{1}{2\sqrt{x}}$.'
        constraints: "inner function bx, x^2, or √x; the inner square lands inside the formula"
      - id: kp3
        name: Products and evaluation
        key_prerequisites: [chain-rule, inverse-trig-functions]
        exemplars:
          - problem: 'Differentiate $f(x) = x \arctan x$.'
            answer: "arctan x + x/(1 + x^2)"
            answer_contract: {kind: none}
            solution_sketch: "arctan x + x/(1 + x^2)"
          - problem: 'For $f(x) = \arcsin x$, find $f''(1/2)$.'
            answer: "2√3/3"
            solution_sketch: '$\frac{1}{\sqrt{1 - 1/4}} = \frac{1}{\sqrt{3}/2} = \frac{2}{\sqrt{3}} = \frac{2\sqrt{3}}{3}$.'
          - problem: 'Find the slope of $y = \arctan x$ at $x = 1$.'
            answer: "1/2"
        constraints: "evaluation points where 1 - x² or 1 + x² is a clean value; rationalized exact answers"
    diagnostic_exemplar:
      problem: 'Differentiate $f(x) = x \arctan(2x)$.'
      answer: "arctan(2x) + 2x/(1 + 4x^2)"
      answer_contract: {kind: none}
      solution_sketch: 'Product rule with $\frac{d}{dx}\arctan(2x) = \frac{2}{1 + (2x)^2}$: $\arctan(2x) + \frac{2x}{1 + 4x^2}$.'
    anki_seeds:
      - front: "d/dx arcsin x and d/dx arctan x = ?"
        back: "1/√(1 - x²) and 1/(1 + x²)"
        type: basic
      - front: "d/dx arccos x = ?"
        back: "-1/√(1 - x²) — the negative of arcsin's derivative"
        type: basic

  - id: logarithmic-differentiation
    name: Logarithmic Differentiation
    core: false                # special-case technique; nothing downstream
    difficulty: 0.68
    drill: false
    answer_kind: expression
    expected_time_secs: 210
    prerequisites:
      - id: derivatives-natural-log
        weight: 0.7
        key: true
      - id: implicit-differentiation-basic
        weight: 0.6
        key: true
      - id: derivatives-exp-log
        weight: 0.5
      - id: derivatives-sin-cos
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: Variable base to a variable power
        key_prerequisites: [derivatives-natural-log, implicit-differentiation-basic]
        exemplars:
          - problem: 'Differentiate $y = x^x$ for $x > 0$.'
            answer: "x^x (ln x + 1)"
            answer_contract: {kind: none}
            solution_sketch: '$\ln y = x \ln x$; differentiate: $\frac{y''}{y} = \ln x + 1$; multiply by $y$.'
          - problem: 'Differentiate $y = x^{2x}$ for $x > 0$.'
            answer: "2x^(2x) (ln x + 1)"
            answer_contract: {kind: none}
            solution_sketch: '$\ln y = 2x \ln x$ gives $\frac{y''}{y} = 2\ln x + 2$.'
          - problem: 'Differentiate $y = x^{\sin x}$ for $x > 0$.'
            answer: "x^(sin x) (cos(x) ln(x) + sin(x)/x)"
            answer_contract: {kind: none}
            solution_sketch: '$\ln y = \sin x \ln x$; differentiate: $\frac{y''}{y} = \cos x \ln x + \frac{\sin x}{x}$; multiply by $y$.'
        constraints: "x^(u(x)) forms; take ln of both sides, differentiate implicitly, multiply back by y"
      - id: kp2
        name: Big products and quotients
        key_prerequisites: [derivatives-natural-log, implicit-differentiation-basic]
        exemplars:
          - problem: 'Use logarithmic differentiation on $y = (x + 1)^2 (x + 2)^3$ and fully factor the result.'
            answer: "(x + 1)(x + 2)^2 (5x + 7)"
            solution_sketch: '$\frac{y''}{y} = \frac{2}{x+1} + \frac{3}{x+2}$; multiply by $y$ and combine: $(x+1)(x+2)^2\left[2(x+2) + 3(x+1)\right]$.'
          - problem: 'Use logarithmic differentiation on $y = x^2\sqrt{x + 1}$ (answer may be left in $y \cdot (\ldots)$ form).'
            answer: "x^2 √(x + 1) · (2/x + 1/(2(x + 1)))"
            solution_sketch: '$\ln y = 2\ln x + \frac{1}{2}\ln(x+1)$; differentiate and multiply by $y$.'
        constraints: "2-3 factors with integer powers or square roots; sum-of-fractions form times y accepted"
      - id: kp3
        name: Choose the right tool
        key_prerequisites: [derivatives-natural-log, derivatives-exp-log]
        exemplars:
          - problem: 'Which of $2^x$, $x^2$, and $x^x$ REQUIRES logarithmic differentiation (rather than a standard rule)?'
            answer: "x^x"
            answer_contract: {kind: none}
            solution_sketch: 'Only $x^x$ has a varying base AND a varying exponent; $2^x$ uses $a^x \ln a$ and $x^2$ the power rule.'
          - problem: 'Differentiate $y = x^x$ by first rewriting it as $e^{x \ln x}$.'
            answer: "x^x (ln x + 1)"
            answer_contract: {kind: none}
            solution_sketch: '$\frac{d}{dx} e^{x \ln x} = e^{x \ln x}(\ln x + 1)$ — the same result as taking logs.'
        constraints: "contrast constant-base, constant-exponent, and variable-variable cases"
    diagnostic_exemplar:
      problem: 'Differentiate $y = x^{\ln x}$ for $x > 0$.'
      answer: "x^(ln x) (2 ln x)/x"
      answer_contract: {kind: none}
      solution_sketch: '$\ln y = (\ln x)^2$, so $y''/y = 2\ln x \cdot \frac{1}{x}$ and $y'' = x^{\ln x}\cdot\frac{2\ln x}{x}$.'
    anki_seeds:
      - front: "Logarithmic differentiation procedure:"
        back: "take ln of both sides; differentiate implicitly (y'/y = ...); multiply by y"
        type: basic
      - front: "d/dx x^x = ?"
        back: "x^x (ln x + 1)"
        type: basic

  - id: combining-differentiation-rules
    name: Combining Differentiation Rules
    core: true
    difficulty: 0.7
    drill: false
    answer_kind: expression
    expected_time_secs: 210
    prerequisites:
      - id: chain-rule
        weight: 0.6
        key: true
      - id: derivatives-trig
        weight: 0.6
        key: true
      - id: derivatives-exp-log
        weight: 0.6
        key: true
    knowledge_points:
      - id: kp1
        name: Chain rule through transcendental layers
        key_prerequisites: [chain-rule, derivatives-trig, derivatives-exp-log]
        exemplars:
          - problem: 'Differentiate $f(x) = e^{\sin x}$.'
            answer: "e^(sin x) cos x"
          - problem: 'Differentiate $f(x) = \sin(e^x)$.'
            answer: "e^x cos(e^x)"
          - problem: 'Differentiate $f(x) = \ln(1 + e^x)$.'
            answer: "e^x/(1 + e^x)"
        constraints: "one transcendental function inside another; single chain application"
      - id: kp2
        name: Products and quotients of transcendental factors
        key_prerequisites: [derivatives-trig, derivatives-exp-log]
        exemplars:
          - problem: 'Differentiate $f(x) = e^x \sin x$.'
            answer: "e^x(sin x + cos x)"
          - problem: 'Differentiate $f(x) = \frac{\ln x}{x}$.'
            answer: "(1 - ln x)/x^2"
            solution_sketch: 'Quotient rule: $\frac{\frac{1}{x} \cdot x - \ln x}{x^2}$.'
          - problem: 'Differentiate $f(x) = x^2 e^{-x}$.'
            answer: "e^(-x)(2x - x^2)"
            solution_sketch: 'Product rule with a chain factor: $2x e^{-x} - x^2 e^{-x}$.'
        constraints: "two factors mixing power, trig, exp, and log; factored answers preferred"
      - id: kp3
        name: Multi-layer problems requiring a strategy
        key_prerequisites: [chain-rule, derivatives-trig, derivatives-exp-log]
        exemplars:
          - problem: 'Differentiate $f(x) = \sqrt{1 + \sin^2 x}$.'
            answer: "sin(x) cos(x)/sqrt(1 + sin(x)^2)"
            solution_sketch: '$\frac{1}{2}(1 + \sin^2 x)^{-1/2} \cdot 2\sin x \cos x$.'
          - problem: 'Differentiate $f(x) = \tan(e^{2x})$.'
            answer: "2e^(2x) sec^2(e^(2x))"
          - problem: 'Differentiate $f(x) = e^{x^2}\cos(3x)$.'
            answer: "e^(x^2)(2x cos(3x) - 3 sin(3x))"
            solution_sketch: 'Product rule; each factor needs its own chain rule.'
        constraints: "at least two rules per problem (chain + product/quotient/power); plan before differentiating"
    diagnostic_exemplar:
      problem: 'Differentiate $f(x) = e^{2x}\sin x$.'
      answer: "e^(2x)(2 sin x + cos x)"
      solution_sketch: 'Product rule with a chain-rule factor: $2e^{2x}\sin x + e^{2x}\cos x$; factor out $e^{2x}$.'
    anki_seeds:
      - front: "Attacking a multi-rule derivative, first identify..."
        back: "the OUTERMOST structure (sum, product, quotient, or composition) and apply its rule first"
        type: basic
      - front: "d/dx e^(u(x)) and d/dx ln(u(x)) in one line:"
        back: "u'·e^u and u'/u"
        type: basic
