unit: hyperbolic-functions
course: calculus-1
module: "Hyperbolic Functions"
topics:
  # Phase C (gap I-3): sinh/cosh had 0 hits tree-wide. Built directly on
  # foundations' natural-exponential-function, since cosh x = (e^x + e^{-x})/2
  # IS the definition. Both topics are supplemental: nothing downstream in the
  # tree consumes hyperbolics — a terminal enrichment branch (PDF p. 391:
  # destinations the curriculum arrives at, not machinery later material uses).

  - id: hyperbolic-functions
    name: Hyperbolic Functions
    core: false                # terminal enrichment branch; no downstream consumer outside this unit
    difficulty: 0.6
    drill: false
    answer_kind: expression
    expected_time_secs: 150
    prerequisites:
      - id: natural-exponential-function
        weight: 0.8
        key: true
      - id: even-odd-functions
        weight: 0.3
      - id: graphs-of-exponential-functions
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: Definitions and evaluation
        key_prerequisites: [natural-exponential-function]
        exemplars:
          - problem: 'Using $\cosh x = \frac{e^x + e^{-x}}{2}$, evaluate $\cosh 0$.'
            answer: "1"
            solution_sketch: '$\frac{e^0 + e^0}{2} = \frac{1 + 1}{2} = 1$; similarly $\sinh 0 = 0$.'
          - problem: 'Write $\sinh 1 = \frac{e^1 - e^{-1}}{2}$ exactly in terms of $e$.'
            answer: "(e - 1/e)/2"
            solution_sketch: 'Substitute $x = 1$ into $\sinh x = \frac{e^x - e^{-x}}{2}$.'
          - problem: 'Evaluate $\sinh(\ln 2)$ exactly.'
            answer: "3/4"
            solution_sketch: '$e^{\ln 2} = 2$ and $e^{-\ln 2} = \frac{1}{2}$, so $\sinh(\ln 2) = \frac{2 - \frac{1}{2}}{2} = \frac{3}{4}$.'
          - problem: "Using tanh x = (e^x - e^{-x})/(e^x + e^{-x}), evaluate tanh(ln 5) exactly. Give the answer as a fraction."
            answer: "12/13"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Start with the definition tanh x = (e^x - e^{-x})/(e^x + e^{-x}). Since e^(ln 5) = 5 and e^(-ln 5) = 1/5, substitute to get (5 - 1/5)/(5 + 1/5). Simplify the numerator and denominator: (24/5)/(26/5) = 24/26 = 12/13. The exact value is 12/13."
          - problem: "Using cosh x = (e^x + e^{-x})/2, evaluate cosh(-ln 4) exactly. Give the answer as a fraction."
            answer: "17/8"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Start with the definition cosh x = (e^x + e^{-x})/2. For x = -ln 4, e^x = 1/4 and e^{-x} = 4. Substitute: (1/4 + 4)/2 = (17/4)/2 = 17/8. The exact value is 17/8."
          - problem: "Using sech x = 2/(e^x + e^{-x}), evaluate sech(ln 6) exactly. Give the answer as a fraction."
            answer: "12/37"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Start with the definition sech x = 2/(e^x + e^{-x}). Since e^(ln 6) = 6 and e^(-ln 6) = 1/6, the denominator is 6 + 1/6 = 37/6. Therefore sech(ln 6) = 2/(37/6) = 12/37. The exact value is 12/37."
        constraints: "arguments 0, ±1, or ± ln k with k a small integer, so e^x collapses to exact values; state the e^x definitions in the stem until the anki cards have had time to stick"
      - id: kp2
        name: The identity cosh^2 - sinh^2 = 1 and parity
        key_prerequisites: [natural-exponential-function, even-odd-functions]
        exemplars:
          - problem: 'Expand $\cosh^2 x - \sinh^2 x$ using the $e^x$ definitions and simplify.'
            answer: "1"
            solution_sketch: '$\frac{(e^x + e^{-x})^2 - (e^x - e^{-x})^2}{4} = \frac{4 e^x e^{-x}}{4} = 1$ — the hyperbolic analogue of $\sin^2 + \cos^2 = 1$, but with a minus sign.'
          - problem: 'Given $\cosh x = \frac{5}{4}$ with $x > 0$, find $\sinh x$.'
            answer: "3/4"
            solution_sketch: '$\sinh^2 x = \cosh^2 x - 1 = \frac{25}{16} - 1 = \frac{9}{16}$; $x > 0$ gives the positive root $\frac{3}{4}$.'
          - problem: 'Simplify $\cosh(-x)$: is it $\cosh(x)$ or $-\cosh(x)$?'
            answer: "cosh(x)"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'Swapping $x \to -x$ swaps $e^x$ and $e^{-x}$, which leaves their sum unchanged: $\cosh$ is even (and $\sinh$, built on the difference, is odd).'
          - problem: "Given $\\sinh x = \\frac{5}{12}$ with $x > 0$, find $\\cosh x$ as a fraction."
            answer: "13/12"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Object: the identity $\\cosh^2 x - \\sinh^2 x = 1$. Step 1 (substitute the given value): $\\cosh^2 x = 1 + \\sinh^2 x = 1 + \\frac{25}{144} = \\frac{169}{144}$. Step 2 (take the positive root): $\\cosh x$ is never negative for a real $x$, so $\\cosh x = \\frac{13}{12}$. The answer is 13/12."
          - problem: "Let $f(x) = \\sinh(x)\\cosh(x)$. State the parity of $f$, and give $f(-\\ln 2)$ as a fraction."
            answer: "verdict = odd; value = -15/16"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["even"], ["odd"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "value"}]}
            solution_sketch: "Object: $f(x) = \\sinh(x)\\cosh(x)$. Step 1 (parity): $\\sinh$ is odd and $\\cosh$ is even, so $f(-x) = (-\\sinh x)\\cosh x = -f(x)$ and $f$ is odd; the wrong option even is the error of treating the even factor $\\cosh$ as making the product even. Step 2 (value): $\\cosh(\\ln 2) = \\frac{5}{4}$ and $\\sinh(\\ln 2) = \\frac{3}{4}$, so $f(-\\ln 2) = -\\frac{3}{4} \\cdot \\frac{5}{4} = -\\frac{15}{16}$. The answer is verdict = odd; value = -15/16."
          - problem: "Given $\\cosh x - \\sinh x = \\frac{2}{3}$, find $\\cosh x + \\sinh x$ as a fraction."
            answer: "3/2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Object: the identity $(\\cosh x - \\sinh x)(\\cosh x + \\sinh x) = \\cosh^2 x - \\sinh^2 x = 1$. Step 1 (apply the identity): the product of the two factors equals 1. Step 2 (solve for the needed factor): $\\cosh x + \\sinh x = \\frac{1}{2/3} = \\frac{3}{2}$. The answer is 3/2."
        constraints: "identity values from the pairs (cosh, sinh) = (5/4, 3/4) or (13/12, 5/12); state x > 0 so the sign of sinh is determined; parity questions offer the two candidate answers"
      - id: kp3
        name: Graphs and the catenary
        key_prerequisites: [natural-exponential-function, graphs-of-exponential-functions]
        exemplars:
          - problem: 'The graph of $y = \cosh x$ is the catenary — the shape of a hanging chain. What is its minimum value, attained at $x = 0$?'
            answer: "1"
            solution_sketch: 'Both $e^x$ and $e^{-x}$ are positive and their product is $1$; the sum $\frac{e^x + e^{-x}}{2}$ is smallest when they are equal, at $x = 0$, giving $\cosh 0 = 1$.'
          - problem: 'A chain hangs in the catenary shape $y = \cosh x$. Compute its height at $x = \ln 3$.'
            answer: "5/3"
            solution_sketch: '$\cosh(\ln 3) = \frac{3 + \frac{1}{3}}{2} = \frac{10/3}{2} = \frac{5}{3}$.'
          - problem: 'For large $x$ the term $e^{-x}$ is negligible, so $\cosh x \approx \frac{e^x}{2}$. Using $e^3 \approx 20.09$, estimate $\cosh 3$ to one decimal place.'
            answer: "10.0"
            solution_sketch: '$\cosh 3 \approx \frac{20.09}{2} = 10.045 \approx 10.0$ (the exact value is $10.07$ — the discarded $e^{-3}/2$ is under $0.03$).'
          - problem: "The curve y = sinh(x) is odd, so its height at a negative input is the negative of its height at the matching positive input. Compute the height at x = -ln(5) and give it as a fraction."
            answer: "-12/5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full object is y = sinh(x), with definition sinh(u) = (e^u - e^(-u))/2. Step 1: use the definition at u = -ln(5), so e^u = 1/5 and e^(-u) = 5. Step 2: subtract and halve, giving ((1/5) - 5)/2 = (-24/5)/2 = -12/5. The height is -12/5."
          - problem: "The catenary y = cosh(x) is even, so its height at x = -ln(4) equals its height at x = ln(4). Find the height at x = -ln(4) as a fraction."
            answer: "17/8"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full object is y = cosh(x), and cosh is even, so cosh(-ln(4)) = cosh(ln(4)). Step 1: use the definition cosh(u) = (e^u + e^(-u))/2. Step 2: at u = ln(4), e^u = 4 and e^(-u) = 1/4, so cosh(ln(4)) = (4 + 1/4)/2 = (17/4)/2 = 17/8. The height is 17/8."
          - problem: "For large positive x the term e^(-x) is negligible, so sinh(x) is about e^x/2. Give an estimate of sinh(4) to one decimal place, using e^4 about 54.60."
            answer: "27.3"
            answer_contract: {"decimals": 1, "kind": "approx"}
            solution_sketch: "The full object is y = sinh(x). Step 1: for large x, e^(-x) is negligible, so use the estimate sinh(x) about e^x/2. Step 2: with e^4 about 54.60, compute sinh(4) about 54.60/2 = 27.30. Step 3: round to one decimal place, which gives 27.3. The estimate is 27.3."
        constraints: "heights at ± ln k for exact fractions; large-x estimates supply the needed e-power and state the rounding; only y = cosh x and y = sinh x, no shifts or stretches"
    diagnostic_exemplar:
      problem: 'Evaluate $\sinh(\ln 3)$ exactly from the definition $\sinh x = \frac{e^x - e^{-x}}{2}$, and confirm with $\cosh^2 x - \sinh^2 x = 1$ that $\cosh(\ln 3) = \frac{5}{3}$.'
      answer: '4/3'
      solution_sketch: '$\sinh(\ln 3) = \frac{3 - 1/3}{2} = \frac{4}{3}$; then $\cosh^2 = 1 + \frac{16}{9} = \frac{25}{9}$ and $\cosh > 0$, so $\cosh(\ln 3) = \frac{5}{3}$.'
    anki_seeds:
      - front: "sinh x = ? (in terms of e^x)"
        back: "(e^x − e^(−x))/2"
        type: basic
      - front: "cosh x = ? (in terms of e^x)"
        back: "(e^x + e^(−x))/2"
        type: basic
      - front: "Fundamental hyperbolic identity?"
        back: "cosh²x − sinh²x = 1"
        type: basic

  - id: derivatives-hyperbolic-functions
    name: Derivatives of Hyperbolic Functions
    core: false                # terminal enrichment: closes the hyperbolic branch, nothing builds on it
    difficulty: 0.65
    drill: false
    answer_kind: expression
    expected_time_secs: 150
    prerequisites:
      - id: hyperbolic-functions
        weight: 0.8
        key: true
      - id: derivatives-natural-exp
        weight: 0.7
        key: true
      - id: chain-rule
        weight: 0.5
      - id: product-quotient-rules
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: sinh' = cosh and cosh' = sinh
        key_prerequisites: [hyperbolic-functions, derivatives-natural-exp]
        exemplars:
          - problem: 'Differentiate $\sinh x = \frac{e^x - e^{-x}}{2}$ term by term.'
            answer: "cosh(x)"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: '$\frac{e^x - (-e^{-x})}{2} = \frac{e^x + e^{-x}}{2} = \cosh x$.'
          - problem: 'Differentiate $f(x) = \cosh x$.'
            answer: "sinh(x)"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: '$\frac{e^x + (-e^{-x})}{2} = \sinh x$ — note there is NO minus sign, unlike $\frac{d}{dx}\cos x = -\sin x$.'
          - problem: 'Differentiate $f(x) = 3\cosh x + x^2$.'
            answer: "3sinh(x) + 2x"
            answer_contract: {"kind": "function", "vars": ["x"]}
          - problem: "Find the derivative of $f(x) = 5\\sinh x - 2\\cosh x + 7x^3$."
            answer: "5cosh(x)-2sinh(x)+21x^2"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "The full object is f(x) = 5 sinh x - 2 cosh x + 7x^3. Use the sum rule to split the terms, then use sinh' = cosh and cosh' = sinh with constant multiples. The power rule gives the derivative of 7x^3 as 21x^2. So f'(x) = 5cosh(x)-2sinh(x)+21x^2."
          - problem: "Find the derivative of $g(t) = 8\\cosh t + 3\\sinh t - 4t^2 + 9t$."
            answer: "8sinh(t)+3cosh(t)-8t+9"
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: "The full object is g(t) = 8 cosh t + 3 sinh t - 4t^2 + 9t. Apply the sum rule and constant multiple rule term by term. The rule cosh' = sinh gives 8 sinh t, and sinh' = cosh gives 3 cosh t. The power rule gives -8t + 9. Thus g'(t) = 8sinh(t)+3cosh(t)-8t+9."
          - problem: "Find the derivative of $f(x) = 4\\sinh x + 6\\cosh x - x$ by using the definitions $\\sinh x = (e^x - e^{-x})/2$ and $\\cosh x = (e^x + e^{-x})/2$."
            answer: "4cosh(x)+6sinh(x)-1"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "The full object is f(x) = 4 sinh x + 6 cosh x - x. Replace sinh and cosh by their e^x definitions: f(x) = 5e^x + e^(-x) - x. Differentiate term by term using the derivative of e^x and the derivative of e^(-x): f'(x) = 5e^x - e^(-x) - 1. Regroup as 4 cosh x + 6 sinh x - 1, so f'(x) = 4cosh(x)+6sinh(x)-1."
        constraints: "linear combinations of sinh x, cosh x, and power terms; integer coefficients; occasionally ask for the derivation from the e^x definitions"
      - id: kp2
        name: Chain rule with hyperbolic functions
        key_prerequisites: [chain-rule, hyperbolic-functions]
        exemplars:
          - problem: 'Differentiate $f(x) = \sinh(3x)$.'
            answer: "3cosh(3x)"
            answer_contract: {"kind": "function", "vars": ["x"]}
          - problem: 'Differentiate $f(x) = \cosh(x^2)$.'
            answer: "2x sinh(x^2)"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'Chain rule: $\sinh(x^2) \cdot 2x$.'
          - problem: "Find the derivative of f(x) = cosh(6x)."
            answer: "6sinh(6x)"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "The function is f(x) = cosh(6x), an outer cosh with inner u = 6x. The chain rule gives f'(x) = sinh(u) times u', and u' = 6. Multiply the two rates to get 6sinh(6x). The derivative is 6sinh(6x)."
          - problem: 'Using the quotient rule on $\tanh x = \frac{\sinh x}{\cosh x}$ and the identity $\cosh^2 x - \sinh^2 x = 1$, differentiate $\tanh x$.'
            answer: "1/cosh(x)^2"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: '$\frac{\cosh^2 x - \sinh^2 x}{\cosh^2 x} = \frac{1}{\cosh^2 x}$.'
          - problem: "Find the derivative of f(x) = sinh(x^2)."
            answer: "2x cosh(x^2)"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "The function is f(x) = sinh(x^2), an outer sinh with inner u = x^2. The chain rule gives f'(x) = cosh(u) times u', and u' = 2x. Multiply the two rates to get 2x cosh(x^2). The derivative is 2x cosh(x^2)."
          - problem: "Find the derivative of f(x) = tanh(4x)."
            answer: "4/cosh(4x)^2"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "Start with tanh(4x) = sinh(4x)/cosh(4x). The chain rule gives (sinh(4x))' = 4cosh(4x) and (cosh(4x))' = 4sinh(4x). The quotient rule gives f'(x) = (4cosh(4x)cosh(4x) - sinh(4x)4sinh(4x))/cosh(4x)^2. Use the identity cosh^2(4x) - sinh^2(4x) = 1 to reduce the numerator to 4. The derivative is 4/cosh(4x)^2."
        constraints: "inner function bx or x^2; the tanh derivative always routed through the quotient rule plus the identity"
      - id: kp3
        name: Products and the slope of the catenary
        key_prerequisites: [product-quotient-rules, hyperbolic-functions]
        exemplars:
          - problem: 'Differentiate $f(x) = x\sinh x$.'
            answer: "sinh(x) + x cosh(x)"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'Product rule: $1 \cdot \sinh x + x \cdot \cosh x$.'
          - problem: 'A chain hangs as the catenary $y = \cosh x$. Find its slope at $x = \ln 2$.'
            answer: "3/4"
            solution_sketch: 'The slope is $y'' = \sinh x$; $\sinh(\ln 2) = \frac{2 - \frac{1}{2}}{2} = \frac{3}{4}$.'
        constraints: "one power factor times sinh or cosh; slope evaluations at ± ln k so the answer is an exact fraction"
    diagnostic_exemplar:
      problem: 'Differentiate $f(x) = x\cosh(2x)$.'
      answer: 'cosh(2x) + 2x sinh(2x)'
      solution_sketch: 'Product rule with a chain-rule factor: $\cosh(2x) + x \cdot 2\sinh(2x)$.'
    anki_seeds:
      - front: "d/dx sinh x = ?"
        back: "cosh x"
        type: basic
      - front: "d/dx cosh x = ? (watch the sign)"
        back: "sinh x — no minus sign, unlike d/dx cos x = −sin x"
        type: basic
      - front: "d/dx tanh x = ?"
        back: "1/cosh²x"
        type: basic
