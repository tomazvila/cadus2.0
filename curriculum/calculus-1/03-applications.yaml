        key_prerequisites: [continuity, critical-points-extrema]
        exemplars:
          - problem: 'What does the Extreme Value Theorem guarantee for a continuous function $f$ on a closed interval $[a, b]$?'
            answer: "f attains an absolute maximum and an absolute minimum on [a, b]"
            answer_contract: {kind: none}
            solution_sketch: "f attains an absolute maximum and an absolute minimum on [a, b]"
