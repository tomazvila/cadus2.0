unit: applications-differentiation
course: calculus-1
module: "Applications of Differentiation"
topics:
  - id: motion-along-a-line
    name: Motion Along a Line
    core: false                # cone {net-change-total-distance, parametric-motion} now supplemental
    difficulty: 0.6
    drill: false
    answer_kind: numeric
    expected_time_secs: 180
    prerequisites:
      - id: derivative-power-rule
        weight: 0.7
        key: true
      - id: higher-order-derivatives
        weight: 0.6
        key: true
      - id: average-instantaneous-rate
        weight: 0.4
      - id: quadratic-equations-factoring
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: Velocity and acceleration from position
        key_prerequisites: [derivative-power-rule, higher-order-derivatives]
        exemplars:
          - problem: 'A particle moves along a line so that its position at time $t$ seconds is $s(t) = t^3 - 6t^2 + 9t$ metres. What is its velocity at $t = 2$?'
            answer: '-3'
            answer_contract: {"kind":"unit","quantity":"speed","unit":"m/s","allow_omitted":true}
            solution_sketch: 'The velocity is the derivative of the position: $v(t) = 3t^2 - 12t + 9$. At $t = 2$ this gives $v(2) = 12 - 24 + 9 = -3$ m/s, so the particle moves in the negative direction.'
          - problem: 'A particle moves along a line with position $s(t) = 3t^4 - 2t^2 + 7t$ (metres, seconds). Find its velocity $v(t)$.'
            answer: '12t^3 - 4t + 7'
            answer_contract: {"kind":"function","vars":["t"]}
            solution_sketch: 'The velocity is the derivative of the position. Differentiate each term with the power rule to get $v(t) = 12t^3 - 4t + 7$.'
          - problem: 'A particle moves along a line with position $s(t) = 2t^3 - 5t^2 + 4t - 1$ (metres, seconds). What is its acceleration at $t = 2$, in metres per second squared?'
            answer: '14'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The acceleration is the second derivative of the position. Here $v(t) = 6t^2 - 10t + 4$ and $a(t) = 12t - 10$, so $a(2) = 24 - 10 = 14$.'
          - problem: 'A particle moves along a line with position $s(t) = t^4 - 6t^2 + 2t$ (metres, seconds). Find its acceleration $a(t)$.'
            answer: '12t^2 - 12'
            answer_contract: {"kind":"function","vars":["t"]}
            solution_sketch: 'The velocity is $v(t) = 4t^3 - 12t + 2$. The acceleration is the derivative of the velocity, so $a(t) = 12t^2 - 12$.'
          - problem: 'A ball is thrown straight up from a platform. Its height above the ground after $t$ seconds is $s(t) = 25 + 20t - 5t^2$ metres. What is the velocity of the ball at $t = 3$?'
            answer: '-10'
            answer_contract: {"kind":"unit","quantity":"speed","unit":"m/s","allow_omitted":true}
            solution_sketch: 'The velocity is $v(t) = 20 - 10t$. At $t = 3$ it is $v(3) = 20 - 30 = -10$ m/s, which means the ball is moving downward.'
          - problem: 'A cyclist has velocity $v(t) = t^2 - 6t + 8$ metres per second at time $t$ seconds. What is the cyclist''s acceleration at $t = 5$, in metres per second squared?'
            answer: '4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The acceleration is the derivative of the velocity: $a(t) = 2t - 6$. At $t = 5$ this gives $a(5) = 10 - 6 = 4$.'
          - problem: 'Sam finds the velocity of a particle with position $s(t) = t^2 - 4t + 3$ at $t = 2$ by computing $s(2) = -1$. What is the correct velocity at $t = 2$?'
            answer: '0'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Sam found the position, not the velocity. The velocity is $v(t) = 2t - 4$, so $v(2) = 4 - 4 = 0$ and the particle is momentarily at rest.'
        constraints: "polynomial position functions with integer coefficients"
      - id: kp2
        name: At rest and direction of motion
        key_prerequisites: [derivative-power-rule, quadratic-equations-factoring]
        exemplars:
          - problem: 'A particle moves along a line with position $s(t) = t^3 - 12t^2 + 45t$ metres at time $t$ seconds, for $t \ge 0$. At what times is the particle at rest?'
            answer: '3, 5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The particle is at rest when $v(t) = 0$. Here $v(t) = 3t^2 - 24t + 45 = 3(t - 3)(t - 5)$, so the particle is at rest at $t = 3$ and $t = 5$.'
          - problem: 'A particle has position $s(t) = 2t^3 - 24t^2 + 72t$ metres for $t \ge 0$. When is the particle moving to the left?'
            answer: '2 < t < 6'
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'Moving left means $v(t) < 0$. Since $v(t) = 6t^2 - 48t + 72 = 6(t - 2)(t - 6)$, the velocity is negative only between the roots, so the particle moves left for $2 < t < 6$.'
          - problem: 'A particle moves along a line with velocity $v(t) = -t^2 + 5t - 4$ for $t > 0$. When is the particle moving to the right?'
            answer: '1 < t < 4'
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'Moving right means $v(t) > 0$. Since $v(t) = -(t - 1)(t - 4)$, the velocity is positive only between the roots $t = 1$ and $t = 4$, so the particle moves right for $1 < t < 4$.'
          - problem: 'A particle has position $s(t) = t^3 - 9t^2 + 15t$ metres at time $t$ seconds. In which direction is it moving at $t = 3$?'
            answer: 'left'
            answer_contract: {"kind":"label","options":[["left","to the left","moving left","moving to the left","it is moving left","it is moving to the left","leftward","negative direction"],["right","to the right","moving right","moving to the right","it is moving right","it is moving to the right","rightward","positive direction"]]}
            solution_sketch: 'The velocity is $v(t) = 3t^2 - 18t + 15$, so $v(3) = 27 - 54 + 15 = -12$. The velocity is negative, so the particle is moving to the left at $t = 3$.'
          - problem: 'A ball is thrown straight up. Its height after $t$ seconds is $s(t) = 1 + 30t - 5t^2$ metres. At what time does the ball reach its highest point?'
            answer: '3'
            answer_contract: {"kind":"unit","quantity":"time","unit":"s","allow_omitted":true}
            solution_sketch: 'At the highest point the ball is momentarily at rest, so $v(t) = 0$. Since $v(t) = 30 - 10t$, this happens at $t = 3$ seconds.'
          - problem: 'A lift in a tall building has height $s(t) = t^3 - 12t^2 + 36t$ metres above the ground floor at time $t$ seconds, for $0 \le t \le 8$. At what times is the lift momentarily stopped?'
            answer: '2, 6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The lift is stopped when $v(t) = 0$. Since $v(t) = 3t^2 - 24t + 36 = 3(t - 2)(t - 6)$, the lift is stopped at $t = 2$ and $t = 6$.'
          - problem: 'Ria says the particle with position $s(t) = t^3 - 6t^2 + 9t$ is at rest when $s(t) = 0$, so at $t = 0$ and $t = 3$. At what times is the particle really at rest?'
            answer: '1, 3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Ria solved $s(t) = 0$, which finds where the particle is at the origin. The particle is at rest when $v(t) = 3t^2 - 12t + 9 = 3(t - 1)(t - 3) = 0$, which gives $t = 1$ and $t = 3$.'
          - problem: 'A particle has position $s(t) = 3t^3 - 36t^2 + 63t$ metres for $t \ge 0$. At what times is the particle at rest?'
            answer: '1, 7'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The velocity is $v(t) = 9t^2 - 72t + 63 = 9(t - 1)(t - 7)$. The particle is at rest when $v(t) = 0$, so at $t = 1$ and $t = 7$.'
        constraints: 'v(t) factors over the integers; at-rest times are positive integers; direction asked as an inequality in t or as left/right at one time'
      - id: kp3
        name: Speeding up or slowing down
        key_prerequisites: [higher-order-derivatives, derivative-power-rule]
        try_first:
          problem: 'A car travels forward with velocity $10$ m/s and has a constant acceleration of $-2$ m/s$^2$. What is its velocity after $1$ second, in metres per second?'
          answer_contract: {"kind":"exact"}
          answer: '8'
          reveal: 'The velocity fell from $10$ to $8$ because the acceleration points against the motion. When velocity and acceleration have opposite signs, the object slows down.'
        exemplars:
          - problem: 'A particle moves along a line with position $s(t) = t^3 - 9t^2 + 15t$ metres at time $t$ seconds. At $t = 4$, is the particle speeding up or slowing down?'
            answer: 'slowing down'
            answer_contract: {"kind":"label","options":[["speeding up","speed up","speeds up","it is speeding up","it speeds up","accelerating","speeding"],["slowing down","slow down","slows down","it is slowing down","it slows down","decelerating","slowing"]]}
            solution_sketch: 'The velocity is $v(t) = 3t^2 - 18t + 15$, so $v(4) = 48 - 72 + 15 = -9$. The acceleration is $a(t) = 6t - 18$, so $a(4) = 6$. The signs are opposite, so the particle is slowing down.'
          - problem: 'A toy car moves along a straight track with position $s(t) = t^3 - 6t^2 - 15t$ centimetres at time $t$ seconds. At $t = 1$, is the car speeding up or slowing down?'
            answer: 'speeding up'
            answer_contract: {"kind":"label","options":[["speeding up","speed up","speeds up","it is speeding up","it speeds up","accelerating","speeding"],["slowing down","slow down","slows down","it is slowing down","it slows down","decelerating","slowing"]]}
            solution_sketch: 'The velocity is $v(t) = 3t^2 - 12t - 15$, so $v(1) = -24$. The acceleration is $a(t) = 6t - 12$, so $a(1) = -6$. Both are negative, so the car is speeding up.'
          - problem: 'A particle moves along a line with velocity $v(t) = t^2 - 6t + 8$ metres per second for $t > 0$. When is the particle speeding up?'
            answer: '2 < t < 3 or t > 4'
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'The velocity is $(t - 2)(t - 4)$ and the acceleration is $a(t) = 2t - 6$. The signs agree for $2 < t < 3$ (both negative) and for $t > 4$ (both positive), so the particle is speeding up there.'
          - problem: 'A particle has position $s(t) = t^3 - 9t^2 + 24t$ metres for $t \ge 0$. What is its acceleration at the later time when it is at rest, in metres per second squared?'
            answer: '6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The particle is at rest when $v(t) = 3(t - 2)(t - 4) = 0$, so the later time is $t = 4$. The acceleration is $a(t) = 6t - 18$, so $a(4) = 24 - 18 = 6$.'
          - problem: 'A ball is thrown straight up. Its height after $t$ seconds is $s(t) = 2 + 20t - 5t^2$ metres. What is the speed of the ball at $t = 3$?'
            answer: '10'
            answer_contract: {"kind":"unit","quantity":"speed","unit":"m/s","allow_omitted":true}
            solution_sketch: 'The velocity is $v(t) = 20 - 10t$, so $v(3) = -10$ m/s. The speed is the absolute value of the velocity, so the speed is $10$ m/s.'
          - problem: 'A runner on a straight track has velocity $v(t) = t^2 - 8t + 12$ metres per second at time $t$ seconds, for $t > 0$. When is the runner slowing down?'
            answer: '0 < t < 2 or 4 < t < 6'
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'The velocity is $(t - 2)(t - 6)$ and the acceleration is $a(t) = 2t - 8$. The signs are opposite for $0 < t < 2$ and for $4 < t < 6$, so the runner is slowing down on those two intervals.'
          - problem: 'A particle moves along a line with position $s(t) = t^3 + 3t^2 - 45t$ metres at time $t$ seconds. Find its acceleration at the time $t > 0$ when it is at rest, in metres per second squared.'
            answer: '24'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The velocity is $v(t) = 3t^2 + 6t - 45 = 3(t + 5)(t - 3)$, so the particle is at rest at $t = 3$. The acceleration is $a(t) = 6t + 6$, so $a(3) = 24$.'
          - problem: 'A ball is thrown straight up from a cliff $105$ m above the sea. Its height above the sea after $t$ seconds is $s(t) = 105 + 20t - 5t^2$ metres, and it hits the sea at $t = 7$. During which times is the ball speeding up?'
            answer: '2 < t < 7'
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'The velocity is $v(t) = 20 - 10t$ and the acceleration is $a(t) = -10$. The ball speeds up when $v$ and $a$ have the same sign, so when $v(t) < 0$, which means $t > 2$. The ball hits the sea at $t = 7$, so it speeds up for $2 < t < 7$.'
        constraints: "test times where neither v nor a is zero"
    diagnostic_exemplar:
      problem: 'A particle has position $s(t) = t^3 - 9t^2 + 24t$ (meters, seconds). Is it speeding up or slowing down at $t = 1$?'
      answer: "slowing down — v(1) = 9 > 0 but a(1) = -12 < 0 (opposite signs)"
      answer_contract: {kind: none}
      solution_sketch: '$v(t) = 3t^2 - 18t + 24$, $v(1) = 9$; $a(t) = 6t - 18$, $a(1) = -12$.'
    anki_seeds:
      - front: "Position s(t): velocity = ? and acceleration = ?"
        back: "v(t) = s'(t); a(t) = v'(t) = s''(t)"
        type: basic
      - front: "A particle speeds up when v and a have ___ signs and slows down when they have ___ signs."
        back: "the same; opposite"
        type: basic
      - front: "Speed is related to velocity by..."
        back: "speed = |v(t)| — always nonnegative"
        type: basic

  - id: related-rates-setup
    name: Related Rates - Circles, Spheres, and Tanks
    core: false                # feeds only related-rates; same applications branch
    difficulty: 0.6
    drill: false
    answer_kind: numeric
    expected_time_secs: 210
    prerequisites:
      - id: implicit-differentiation
        weight: 0.8
        key: true
      - id: chain-rule
        weight: 0.5
        key: true
      - id: circle-area-circumference
        weight: 0.4
        key: true
      - id: volume-prisms-cylinders
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: Growing circles
        key_prerequisites: [implicit-differentiation, circle-area-circumference]
        exemplars:
          - problem: 'The radius of a circle grows at $2$ cm/s. At what rate, in square centimetres per second, is the area $A = \pi r^2$ growing when $r = 5$ cm?'
            answer: '20pi'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Differentiate $A = \pi r^2$ with respect to $t$ to get $\frac{dA}{dt} = 2\pi r\,\frac{dr}{dt}$. Then substitute $r = 5$ and $\frac{dr}{dt} = 2$ to get $2\pi(5)(2) = 20\pi$.'
          - problem: 'The radius of a circle grows at $3$ cm/s. At what rate, in centimetres per second, is the circumference $C = 2\pi r$ growing?'
            answer: '6pi'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Differentiate $C = 2\pi r$ with respect to $t$ to get $\frac{dC}{dt} = 2\pi\,\frac{dr}{dt}$. With $\frac{dr}{dt} = 3$ this is $6\pi$, whatever the radius is.'
          - problem: 'An oil slick spreads as a circle whose radius grows at $3$ m/min. At what rate, in square metres per minute, is the area of the slick growing when the radius is $40$ m?'
            answer: '240pi'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The area is $A = \pi r^2$, so $\frac{dA}{dt} = 2\pi r\,\frac{dr}{dt}$. At $r = 40$ and $\frac{dr}{dt} = 3$ this is $2\pi(40)(3) = 240\pi$.'
          - problem: 'The area of a circular ripple grows at $40\pi$ cm$^2$/s. How fast, in centimetres per second, is the radius growing when $r = 5$ cm?'
            answer: '4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'From $A = \pi r^2$ we get $\frac{dA}{dt} = 2\pi r\,\frac{dr}{dt}$. Then $40\pi = 2\pi(5)\frac{dr}{dt}$, so $\frac{dr}{dt} = \frac{40\pi}{10\pi} = 4$.'
          - problem: 'The circumference of a circle grows at $16\pi$ cm/s. At what rate, in square centimetres per second, is the area growing when the radius is $4$ cm?'
            answer: '64pi'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'From $C = 2\pi r$ we get $\frac{dC}{dt} = 2\pi\,\frac{dr}{dt} = 16\pi$, so $\frac{dr}{dt} = 8$. Then $\frac{dA}{dt} = 2\pi r\,\frac{dr}{dt} = 2\pi(4)(8) = 64\pi$.'
          - problem: 'The diameter of a circle grows at $6$ cm/s. At what rate, in square centimetres per second, is the area growing when the radius is $4$ cm?'
            answer: '24pi'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The radius is half the diameter, so $\frac{dr}{dt} = \frac{6}{2} = 3$. Then $\frac{dA}{dt} = 2\pi r\,\frac{dr}{dt} = 2\pi(4)(3) = 24\pi$.'
          - problem: 'Dan wants to know how fast the area of a circle grows when $r = 6$ cm and $r$ grows at $3$ cm/s. He first puts $r = 6$ into $A = \pi r^2$, gets $A = 36\pi$, and differentiates that constant. What is the correct rate of growth of the area, in square centimetres per second?'
            answer: '36pi'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Dan differentiated a constant, so he got $0$. The correct way is to differentiate first: $\frac{dA}{dt} = 2\pi r\,\frac{dr}{dt}$. Then $2\pi(6)(3) = 36\pi$.'
        constraints: "give the geometric formula in the problem; integer rates and radii; answers as exact multiples of π with units"
      - id: kp2
        name: Growing spheres
        key_prerequisites: [implicit-differentiation, chain-rule]
        exemplars:
          - problem: 'A spherical balloon is inflated so that its radius grows at $2$ cm/s. At what rate, in cubic centimetres per second, is the volume $V = \frac{4}{3}\pi r^3$ growing when $r = 3$ cm?'
            answer: '72pi'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Differentiate $V = \frac{4}{3}\pi r^3$ to get $\frac{dV}{dt} = 4\pi r^2\,\frac{dr}{dt}$. At $r = 3$ and $\frac{dr}{dt} = 2$ this is $4\pi(9)(2) = 72\pi$.'
          - problem: 'The radius of a sphere grows at $2$ cm/s. At what rate, in square centimetres per second, is the surface area $S = 4\pi r^2$ growing when $r = 5$ cm?'
            answer: '80pi'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Differentiate $S = 4\pi r^2$ to get $\frac{dS}{dt} = 8\pi r\,\frac{dr}{dt}$. At $r = 5$ and $\frac{dr}{dt} = 2$ this is $8\pi(5)(2) = 80\pi$.'
          - problem: 'A snowball melts so that its radius shrinks at $1$ cm/min. At what rate, in cubic centimetres per minute, is its volume changing when the radius is $6$ cm?'
            answer: '-144pi'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The radius shrinks, so $\frac{dr}{dt} = -1$. Then $\frac{dV}{dt} = 4\pi r^2\,\frac{dr}{dt} = 4\pi(36)(-1) = -144\pi$, which means the volume decreases.'
          - problem: 'The volume of a sphere grows at $100\pi$ cm$^3$/s. How fast, in centimetres per second, is the radius growing when $r = 5$ cm?'
            answer: '1'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'From $V = \frac{4}{3}\pi r^3$ we get $\frac{dV}{dt} = 4\pi r^2\,\frac{dr}{dt}$. Then $100\pi = 4\pi(25)\frac{dr}{dt} = 100\pi\,\frac{dr}{dt}$, so $\frac{dr}{dt} = 1$.'
          - problem: 'The surface area of a sphere grows at $64\pi$ cm$^2$/s. At what rate, in cubic centimetres per second, is the volume growing when $r = 4$ cm?'
            answer: '128pi'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'From $S = 4\pi r^2$ we get $\frac{dS}{dt} = 8\pi r\,\frac{dr}{dt}$, so $64\pi = 32\pi\,\frac{dr}{dt}$ and $\frac{dr}{dt} = 2$. Then $\frac{dV}{dt} = 4\pi(16)(2) = 128\pi$.'
          - problem: 'Air is pumped into a spherical balloon at $20$ cm$^3$/s. How fast, in centimetres per second, is the radius growing when $r = 5$ cm?'
            answer: '1/(5*pi)'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'From $V = \frac{4}{3}\pi r^3$ we get $\frac{dV}{dt} = 4\pi r^2\,\frac{dr}{dt}$. Then $20 = 4\pi(25)\frac{dr}{dt} = 100\pi\,\frac{dr}{dt}$, so $\frac{dr}{dt} = \frac{1}{5\pi}$.'
          - problem: 'Maya differentiates $V = \frac{4}{3}\pi r^3$ as $\frac{dV}{dt} = 4\pi r^2$ and leaves out the rate of the radius. The radius of a sphere grows at $3$ cm/s. What is the correct rate of change of the volume, in cubic centimetres per second, when $r = 2$ cm?'
            answer: '48pi'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Maya forgot the chain-rule factor $\frac{dr}{dt}$. The correct derivative is $\frac{dV}{dt} = 4\pi r^2\,\frac{dr}{dt}$, which at $r = 2$ and $\frac{dr}{dt} = 3$ is $4\pi(4)(3) = 48\pi$.'
        constraints: "state the volume/surface formula; differentiate before substituting values"
      - id: kp3
        name: Filling tanks with constant cross-section
        key_prerequisites: [implicit-differentiation, volume-prisms-cylinders]
        try_first:
          problem: 'A tank has a rectangular floor of $2$ m by $3$ m. How many cubic metres of water must be added to raise the water level by $1$ m?'
          answer_contract: {"kind":"exact"}
          answer: '6'
          reveal: 'Each extra metre of depth adds floor area times $1$ m, which is $6$ m$^3$. So a flow of $6$ m$^3$ per minute raises the level $1$ m per minute, that is $\frac{dV}{dt} = (\text{base area})\cdot\frac{dh}{dt}$.'
        exemplars:
          - problem: 'Water is poured into a rectangular pool with a base $4$ m by $5$ m at a rate of $10$ m$^3$/h. How fast is the depth of the water rising, in metres per hour?'
            answer: '1/2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The base area is $4 \cdot 5 = 20$ m$^2$, so $V = 20h$ and $\frac{dV}{dt} = 20\,\frac{dh}{dt}$. Then $10 = 20\,\frac{dh}{dt}$, so $\frac{dh}{dt} = \frac{1}{2}$.'
          - problem: 'Water pours into a cylindrical tank of radius $3$ m at $18\pi$ m$^3$/min. How fast is the water level rising, in metres per minute?'
            answer: '2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The volume is $V = \pi(3)^2 h = 9\pi h$, so $\frac{dV}{dt} = 9\pi\,\frac{dh}{dt}$. Then $18\pi = 9\pi\,\frac{dh}{dt}$, so $\frac{dh}{dt} = 2$.'
          - problem: 'A rectangular aquarium is $6$ m long and $2$ m wide. Water flows in at $3$ m$^3$/min. How fast does the water surface climb, in metres per minute?'
            answer: '1/4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The base area is $6 \cdot 2 = 12$ m$^2$, so $\frac{dV}{dt} = 12\,\frac{dh}{dt}$. Then $3 = 12\,\frac{dh}{dt}$, so $\frac{dh}{dt} = \frac{1}{4}$.'
          - problem: 'The water level in a cylindrical tank of radius $2$ m must rise at $3$ m/min. At what rate, in cubic metres per minute, must water be pumped in?'
            answer: '12pi'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The volume is $V = \pi(2)^2 h = 4\pi h$, so $\frac{dV}{dt} = 4\pi\,\frac{dh}{dt}$. With $\frac{dh}{dt} = 3$ the inflow must be $12\pi$.'
          - problem: 'A cylindrical rain barrel of radius $2$ m collects stormwater at $20\pi$ m$^3$/h. How fast does the water level rise, in metres per hour?'
            answer: '5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The volume is $V = \pi(2)^2 h = 4\pi h$, so $\frac{dV}{dt} = 4\pi\,\frac{dh}{dt}$. Then $20\pi = 4\pi\,\frac{dh}{dt}$, so $\frac{dh}{dt} = 5$.'
          - problem: 'A swimming pool is $10$ m long and $4$ m wide. It is filled at $200$ litres per minute. How fast does the water level rise, in centimetres per minute? (One cubic metre is $1000$ litres.)'
            answer: '0.5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The inflow is $200$ litres $= 0.2$ m$^3$ per minute and the base area is $40$ m$^2$. So $\frac{dh}{dt} = \frac{0.2}{40} = 0.005$ m/min, which is $0.5$ cm/min.'
          - problem: 'A cylindrical tank of radius $2$ m drains at $8\pi$ m$^3$/h. At what rate, in metres per hour, is the water level changing?'
            answer: '-2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The volume is $V = 4\pi h$, so $\frac{dV}{dt} = 4\pi\,\frac{dh}{dt}$. The tank drains, so $\frac{dV}{dt} = -8\pi$ and $\frac{dh}{dt} = -2$, a falling level.'
          - problem: 'A concrete form has a flat rectangular base of $3$ m by $7$ m. A pump adds water at $14$ m$^3$/min. How fast does the water depth increase, in metres per minute?'
            answer: '2/3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The base area is $3 \cdot 7 = 21$ m$^2$, so $\frac{dV}{dt} = 21\,\frac{dh}{dt}$. Then $14 = 21\,\frac{dh}{dt}$, so $\frac{dh}{dt} = \frac{2}{3}$.'
        constraints: "constant cross-section (cylinder or prism) so dV/dt = (base area)·dh/dt; exact answers"
    diagnostic_exemplar:
      problem: 'Water pours into a cylindrical tank of radius $2$ m at $12$ m³/min. Using $V = \pi r^2 h$, how fast is the water level rising?'
      answer: "3/π m/min"
      answer_contract: {kind: none}
      solution_sketch: '$V = 4\pi h$, so $\frac{dV}{dt} = 4\pi \frac{dh}{dt} = 12$ gives $\frac{dh}{dt} = \frac{3}{\pi}$.'
    anki_seeds:
      - front: "Related-rates procedure in four steps:"
        back: "write an equation relating the quantities; differentiate both sides in t; substitute known values and rates; solve for the unknown rate"
        type: basic
      - front: "In related rates, when do you substitute the specific values (like r = 5)?"
        back: "Only AFTER differentiating — substituting first kills the variable's rate"
        type: basic

  - id: related-rates
    name: Related Rates
    core: false                # applied word-problem genre
    difficulty: 0.7
    drill: false
    answer_kind: numeric
    expected_time_secs: 270
    prerequisites:
      - id: related-rates-setup
        weight: 0.8
        key: true
      - id: pythagorean-theorem
        weight: 0.5
        key: true
      - id: similar-triangles
        weight: 0.4
        key: true
      - id: implicit-differentiation
        weight: 0.5
      - id: product-quotient-rules
        weight: 0.3
      - id: volume-pyramids-cones-spheres
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: Sliding ladders and separating travelers (Pythagorean setups)
        key_prerequisites: [related-rates-setup, pythagorean-theorem]
        exemplars:
          - problem: 'A $13$ m ladder leans against a vertical wall. Its base slides away from the wall at $3$ m/s. At what rate is the height of the top of the ladder changing when the base is $5$ m from the wall?'
            answer: '-5/4'
            answer_contract: {"kind":"unit","quantity":"speed","unit":"m/s","allow_omitted":true}
            solution_sketch: 'Let $x$ be the distance of the base from the wall and $y$ the height of the top, so $x^2 + y^2 = 169$. At $x = 5$ we get $y = 12$, and differentiating gives $2x\,x'' + 2y\,y'' = 0$, so $y'' = -\frac{5 \cdot 3}{12} = -\frac{5}{4}$ m/s.'
          - problem: 'One car drives north at $60$ km/h and another drives east at $80$ km/h, both starting from the same point. How fast is the distance between them growing when the first car is $30$ km and the second car is $40$ km from the start?'
            answer: '100'
            answer_contract: {"kind":"unit","quantity":"speed","unit":"km/h","allow_omitted":true}
            solution_sketch: 'The distance $s$ satisfies $s^2 = x^2 + y^2$, so $s\,s'' = x\,x'' + y\,y''$. At that moment $s = 50$, so $s'' = \frac{40 \cdot 80 + 30 \cdot 60}{50} = \frac{5000}{50} = 100$ km/h.'
          - problem: 'A $10$ m ladder leans against a vertical wall. Its top slides down the wall at $2$ m/s. How fast is the base moving away from the wall when the base is $6$ m from the wall?'
            answer: '8/3'
            answer_contract: {"kind":"unit","quantity":"speed","unit":"m/s","allow_omitted":true}
            solution_sketch: 'With $x^2 + y^2 = 100$ and $x = 6$ we get $y = 8$. Differentiating gives $2x\,x'' + 2y\,y'' = 0$ with $y'' = -2$, so $12\,x'' = 32$ and $x'' = \frac{8}{3}$ m/s.'
          - problem: 'Two hikers leave a trailhead at the same time. One walks north at $5$ km/h and the other walks east at $12$ km/h. How fast is the distance between them increasing when the first hiker is $10$ km and the second hiker is $24$ km from the trailhead?'
            answer: '13'
            answer_contract: {"kind":"unit","quantity":"speed","unit":"km/h","allow_omitted":true}
            solution_sketch: 'The distance is $s = \sqrt{x^2 + y^2} = \sqrt{100 + 576} = 26$ km at that moment. From $s\,s'' = x\,x'' + y\,y''$ we get $s'' = \frac{24 \cdot 12 + 10 \cdot 5}{26} = \frac{338}{26} = 13$ km/h.'
          - problem: 'A walker leaves a corner and walks north at $5$ km/h. Later a cyclist leaves the same corner and rides east at a constant speed of $v$ km/h. The distance between them grows at $13$ km/h at the moment when the walker is $3$ km from the corner and the cyclist is $4$ km from the corner. What is $v$?'
            answer: '25/2'
            answer_contract: {"kind":"unit","quantity":"speed","unit":"km/h","allow_omitted":true}
            solution_sketch: 'At that moment the distance is $5$ km, and $s\,s'' = x\,x'' + y\,y''$ gives $5(13) = 4v + 3(5)$. So $4v = 50$ and $v = \frac{25}{2}$ km/h.'
          - problem: 'Pia says that a ladder whose base slides away from the wall at $2$ m/s has a top that slides down at $2$ m/s as well. The ladder is $17$ m long. At what rate is the height of the top changing when the base is $8$ m from the wall?'
            answer: '-16/15'
            answer_contract: {"kind":"unit","quantity":"speed","unit":"m/s","allow_omitted":true}
            solution_sketch: 'The base and the top do not move at the same speed. With $x^2 + y^2 = 289$ and $x = 8$ we get $y = 15$, so $y'' = -\frac{x\,x''}{y} = -\frac{8 \cdot 2}{15} = -\frac{16}{15}$ m/s.'
          - problem: 'A drone flies horizontally at a height of $60$ m at $8$ m/s. It passes directly above an observer on the ground. At what rate is the distance from the observer to the drone increasing when the drone is $80$ m from the point above the observer, measured along the ground?'
            answer: '32/5'
            answer_contract: {"kind":"unit","quantity":"speed","unit":"m/s","allow_omitted":true}
            solution_sketch: 'The distance satisfies $s^2 = x^2 + 60^2$, and $s = 100$ when $x = 80$. Then $s\,s'' = x\,x''$ gives $s'' = \frac{80 \cdot 8}{100} = \frac{32}{5}$ m/s.'
        constraints: "Pythagorean triples so all distances are integers; rates are integers or simple fractions"
      - id: kp2
        name: Conical tanks (similar-triangle substitution)
        key_prerequisites: [related-rates-setup, similar-triangles, volume-pyramids-cones-spheres]
        exemplars:
          - problem: 'Water flows into an inverted conical tank at $6$ m$^3$/min. The tank is $10$ m deep and has a top radius of $5$ m. How fast is the depth of the water rising, in metres per minute, when the water is $2$ m deep?'
            answer: '6/pi'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'By similar triangles $r = \frac{5}{10}h = \frac{h}{2}$, so $V = \frac{\pi}{3}r^2h = \frac{\pi}{12}h^3$. Then $\frac{dV}{dt} = \frac{\pi}{4}h^2\,\frac{dh}{dt}$, and at $h = 2$ we get $6 = \pi\,\frac{dh}{dt}$, so $\frac{dh}{dt} = \frac{6}{\pi}$.'
          - problem: 'A pump delivers water at $12$ m$^3$/min to an inverted cone that is $6$ m high with a top radius of $3$ m. How fast is the water level rising, in metres per minute, when the water is $4$ m deep?'
            answer: '3/pi'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'By similar triangles $r = \frac{h}{2}$, so $V = \frac{\pi}{12}h^3$ and $\frac{dV}{dt} = \frac{\pi}{4}h^2\,\frac{dh}{dt}$. At $h = 4$ this gives $12 = 4\pi\,\frac{dh}{dt}$, so $\frac{dh}{dt} = \frac{3}{\pi}$.'
          - problem: 'An inverted cone is $8$ m tall and has a top radius of $4$ m. Water enters at $4$ m$^3$/min. At what rate, in metres per minute, is the radius of the water surface growing when the water is $2$ m deep?'
            answer: '2/pi'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Here $r = \frac{h}{2}$, so $V = \frac{\pi}{12}h^3$ and $\frac{dV}{dt} = \frac{\pi}{4}h^2\,\frac{dh}{dt}$. At $h = 2$ we get $4 = \pi\,\frac{dh}{dt}$, so $\frac{dh}{dt} = \frac{4}{\pi}$ and $\frac{dr}{dt} = \frac{1}{2}\cdot\frac{4}{\pi} = \frac{2}{\pi}$.'
          - problem: 'A conical tank has height $12$ m and top radius $6$ m. The water depth is increasing at $\frac{1}{3\pi}$ m/min. At what rate, in cubic metres per minute, is water entering the tank when the depth is $3$ m?'
            answer: '3/4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Here $r = \frac{h}{2}$, so $V = \frac{\pi}{12}h^3$ and $\frac{dV}{dt} = \frac{\pi}{4}h^2\,\frac{dh}{dt}$. At $h = 3$ with $\frac{dh}{dt} = \frac{1}{3\pi}$ this is $\frac{\pi}{4}(9)\frac{1}{3\pi} = \frac{3}{4}$.'
          - problem: 'A cone-shaped vessel has depth $9$ m and top radius $3$ m. Liquid is poured in at $5$ m$^3$/min. How fast is the liquid level rising, in metres per minute, when the liquid is $3$ m deep?'
            answer: '5/pi'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Here $r = \frac{h}{3}$, so $V = \frac{\pi}{27}h^3$ and $\frac{dV}{dt} = \frac{\pi}{9}h^2\,\frac{dh}{dt}$. At $h = 3$ we get $5 = \pi\,\frac{dh}{dt}$, so $\frac{dh}{dt} = \frac{5}{\pi}$.'
          - problem: 'An inverted cone is $10$ m high and its top radius is $5$ m. Water enters at $3$ m$^3$/min. How fast is the depth increasing, in metres per minute, when the water is $5$ m deep? Round to two decimal places.'
            answer: '0.15'
            answer_contract: {"kind":"approx","decimals":2}
            solution_sketch: 'Here $r = \frac{h}{2}$, so $\frac{dV}{dt} = \frac{\pi}{4}h^2\,\frac{dh}{dt}$. At $h = 5$ we get $3 = \frac{25\pi}{4}\,\frac{dh}{dt}$, so $\frac{dh}{dt} = \frac{12}{25\pi} \approx 0.15$.'
          - problem: 'Sand falls from a conveyor belt onto a conical pile whose height is always equal to the radius of its base. The sand arrives at $10$ m$^3$/min. How fast is the height of the pile increasing, in metres per minute, when the pile is $5$ m high?'
            answer: '2/(5*pi)'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Since $r = h$, the volume is $V = \frac{\pi}{3}h^3$ and $\frac{dV}{dt} = \pi h^2\,\frac{dh}{dt}$. At $h = 5$ we get $10 = 25\pi\,\frac{dh}{dt}$, so $\frac{dh}{dt} = \frac{2}{5\pi}$.'
          - problem: 'Omar differentiates $V = \frac{\pi}{3}r^2h$ for an inverted cone with $r = \frac{h}{2}$ as $\frac{dV}{dt} = \frac{\pi}{3}r^2\,\frac{dh}{dt}$, treating $r$ as constant. Water enters the cone at $9$ m$^3$/min. What is the correct rate, in metres per minute, at which the depth is rising when $h = 6$ m?'
            answer: '1/pi'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The radius changes with the depth, so Omar must first write $V = \frac{\pi}{12}h^3$. Then $\frac{dV}{dt} = \frac{\pi}{4}h^2\,\frac{dh}{dt}$, and at $h = 6$ we get $9 = 9\pi\,\frac{dh}{dt}$, so $\frac{dh}{dt} = \frac{1}{\pi}$.'
        constraints: "cone dimensions give a simple ratio r = kh; eliminate r via similar triangles before differentiating"
      - id: kp3
        name: Shadows and multi-quantity setups
        key_prerequisites: [related-rates-setup, similar-triangles, product-quotient-rules]
        exemplars:
          - problem: 'A woman $2$ m tall walks away from a lamppost $5$ m high at $2$ m/s. How fast is the tip of her shadow moving along the ground?'
            answer: '10/3'
            answer_contract: {"kind":"unit","quantity":"speed","unit":"m/s","allow_omitted":true}
            solution_sketch: 'Let $x$ be her distance from the post and $s$ the shadow length. Similar triangles give $\frac{s}{2} = \frac{x + s}{5}$, so $s = \frac{2x}{3}$ and the tip is at $x + s = \frac{5x}{3}$. Its speed is $\frac{5}{3}\cdot 2 = \frac{10}{3}$ m/s.'
          - problem: 'A rectangular panel changes shape. Its length increases at $4$ cm/s and its width decreases at $3$ cm/s. At the moment when the panel is $12$ cm long and $5$ cm wide, how fast is its area changing, in square centimetres per second?'
            answer: '-16'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The area is $A = lw$, so $\frac{dA}{dt} = \frac{dl}{dt}\,w + l\,\frac{dw}{dt}$. This gives $4(5) + 12(-3) = 20 - 36 = -16$, so the area is shrinking.'
          - problem: 'A man $3$ m tall walks straight away from a lamppost $8$ m high at $2$ m/s. How fast is the length of his shadow growing, in metres per second?'
            answer: '6/5'
            answer_contract: {"kind":"unit","quantity":"speed","unit":"m/s","allow_omitted":true}
            solution_sketch: 'Similar triangles give $\frac{s}{3} = \frac{x + s}{8}$, so $5s = 3x$ and $s = \frac{3x}{5}$. Then $\frac{ds}{dt} = \frac{3}{5}\cdot 2 = \frac{6}{5}$ m/s.'
          - problem: 'A boy $4$ m tall walks away from a lamppost $10$ m high at $3$ m/s. How fast is the tip of his shadow moving, in metres per second?'
            answer: '5'
            answer_contract: {"kind":"unit","quantity":"speed","unit":"m/s","allow_omitted":true}
            solution_sketch: 'Similar triangles give $\frac{s}{4} = \frac{x + s}{10}$, so $6s = 4x$ and $s = \frac{2x}{3}$. The tip is at $x + s = \frac{5x}{3}$, so its speed is $\frac{5}{3}\cdot 3 = 5$ m/s.'
          - problem: 'A rectangular box has a constant height of $5$ cm. Its length grows at $2$ cm/s and its width shrinks at $1$ cm/s. At the instant when the length is $3$ cm and the width is $4$ cm, how fast is the volume changing, in cubic centimetres per second?'
            answer: '25'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The volume is $V = 5lw$, so $\frac{dV}{dt} = 5\left(\frac{dl}{dt}\,w + l\,\frac{dw}{dt}\right)$. This gives $5\left(2 \cdot 4 + 3 \cdot (-1)\right) = 5 \cdot 5 = 25$.'
          - problem: 'The length of a rectangular field grows at $5$ m/day and its width grows at $4$ m/day. When the field is $6$ m long and $7$ m wide, how fast is its area growing, in square metres per day?'
            answer: '59'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The area is $A = lw$, so $\frac{dA}{dt} = \frac{dl}{dt}\,w + l\,\frac{dw}{dt}$. This gives $5(7) + 6(4) = 35 + 24 = 59$.'
          - problem: 'A girl $1.5$ m tall walks away from a lamppost at $2$ m/s, and the tip of her shadow moves at $3$ m/s. How high is the lamppost, in metres?'
            answer: '4.5'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'Similar triangles with lamp height $L$ give a tip at $x + s = \frac{Lx}{L - 1.5}$. So the tip speed is $\frac{L}{L - 1.5}\cdot 2 = 3$, which gives $2L = 3L - 4.5$ and $L = 4.5$ m.'
        constraints: "two changing quantities; similar-triangle or product-rule relationships; integer data"
    diagnostic_exemplar:
      problem: 'Water pours at $3$ m³/min into an inverted cone of height $8$ m and top radius $4$ m (so $r = h/2$ at depth $h$). How fast is the depth rising when $h = 4$ m?'
      answer: "3/(4π) m/min"
      answer_contract: {kind: none}
      solution_sketch: '$V = \frac{1}{3}\pi (h/2)^2 h = \frac{\pi h^3}{12}$; $\frac{dV}{dt} = \frac{\pi h^2}{4}\frac{dh}{dt}$; at $h = 4$: $3 = 4\pi \frac{dh}{dt}$.'
    anki_seeds:
      - front: "In a conical-tank problem, how do you get V in terms of h alone?"
        back: "use similar triangles (r = kh from the tank's dimensions) to eliminate r before differentiating"
        type: basic
      - front: "Ladder problem: relate x (base) and y (top) by..."
        back: "x² + y² = L² (L the ladder length, a constant)"
        type: basic

  - id: linearization
    name: Linearization and Differentials
    core: true
    difficulty: 0.6
    drill: false
    answer_kind: expression
    expected_time_secs: 150
    prerequisites:
      - id: derivative-power-rule
        weight: 0.7
        key: true
      - id: point-slope-standard-form
        weight: 0.5
        key: true
      - id: derivative-definition
        weight: 0.4
      - id: chain-rule
        weight: 0.3
      - id: derivatives-trig
        weight: 0.3
      - id: derivatives-exp-log
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: Build the linearization L(x) at a point
        key_prerequisites: [derivative-power-rule, point-slope-standard-form]
        try_first:
          problem: 'A curve passes through the point $(2, 5)$ and its tangent line there has slope $3$. What is the height of the tangent line above $x = 4$?'
          answer_contract: {"kind":"exact"}
          answer: '11'
          reveal: 'The tangent line starts at height $5$ and rises $3$ for each unit, so it rises $6$ over two units. This is the linearization $L(x) = f(a) + f''(a)(x - a)$ with $a = 2$.'
        exemplars:
          - problem: 'Find the linearization of $f(x) = \sqrt{x}$ at $a = 4$.'
            answer: '2 + (x - 4)/4'
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'We have $f(4) = 2$ and $f''(x) = \frac{1}{2\sqrt{x}}$, so $f''(4) = \frac{1}{4}$. Therefore $L(x) = 2 + \frac{1}{4}(x - 4)$.'
          - problem: 'Find the linearization of $f(x) = x^2$ at $a = 5$.'
            answer: '25 + 10(x - 5)'
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'We have $f(5) = 25$ and $f''(x) = 2x$, so $f''(5) = 10$. Therefore $L(x) = 25 + 10(x - 5)$.'
          - problem: 'Find the linearization of $f(x) = x^3$ at $a = 2$.'
            answer: '8 + 12(x - 2)'
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'We have $f(2) = 8$ and $f''(x) = 3x^2$, so $f''(2) = 12$. Therefore $L(x) = 8 + 12(x - 2)$.'
          - problem: 'Find the linearization of $f(x) = \frac{1}{x}$ at $a = 2$.'
            answer: '1/2 - (x - 2)/4'
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'We have $f(2) = \frac{1}{2}$ and $f''(x) = -\frac{1}{x^2}$, so $f''(2) = -\frac{1}{4}$. Therefore $L(x) = \frac{1}{2} - \frac{1}{4}(x - 2)$.'
          - problem: 'Find the linearization of $f(x) = \ln x$ at $a = 1$.'
            answer: 'x - 1'
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'We have $f(1) = \ln 1 = 0$ and $f''(x) = \frac{1}{x}$, so $f''(1) = 1$. Therefore $L(x) = 0 + 1(x - 1) = x - 1$.'
          - problem: 'A ball dropped from a height of $h$ metres takes $t(h) = \sqrt{h/5}$ seconds to reach the ground. Find the linearization of $t$ at $h = 20$.'
            answer: '2 + (h - 20)/20'
            answer_contract: {"kind":"function","vars":["h"]}
            solution_sketch: 'We have $t(20) = \sqrt{4} = 2$ and $t''(h) = \frac{1}{10\sqrt{h/5}}$, so $t''(20) = \frac{1}{20}$. Therefore $L(h) = 2 + \frac{1}{20}(h - 20)$.'
          - problem: 'The volume of a sphere of radius $r$ cm is $V(r) = \frac{4}{3}\pi r^3$. Find the linearization of $V$ at $r = 3$.'
            answer: '36pi + 36pi(r - 3)'
            answer_contract: {"kind":"function","vars":["r"]}
            solution_sketch: 'We have $V(3) = 36\pi$ and $V''(r) = 4\pi r^2$, so $V''(3) = 36\pi$. Therefore $L(r) = 36\pi + 36\pi(r - 3)$.'
          - problem: 'Zoe finds the linearization of $f(x) = x^2$ at $a = 3$ by writing $L(x) = 9 + 2x(x - 3)$, keeping $x$ in the slope. What is the correct linearization?'
            answer: '9 + 6(x - 3)'
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'Zoe used $f''(x)$ where the formula needs the number $f''(a)$. Here $f''(3) = 6$, so $L(x) = 9 + 6(x - 3)$, which is a line.'
        constraints: "base point where f and f' are exact and simple (perfect squares/cubes); the answer is the expression for L(x)"
      - id: kp2
        name: Approximate values with the linearization
        key_prerequisites: [derivative-power-rule]
        exemplars:
          - problem: 'Use the linearization of $f(x) = \sqrt{x}$ at $a = 4$ to approximate $\sqrt{4.1}$. Round to three decimal places.'
            answer: '2.025'
            answer_contract: {"kind":"approx","decimals":3}
            solution_sketch: 'The linearization is $L(x) = 2 + \frac{1}{4}(x - 4)$. Then $L(4.1) = 2 + \frac{1}{4}(0.1) = 2.025$.'
          - problem: 'Use the linearization of $f(x) = x^5$ at $a = 1$ to approximate $(1.02)^5$. Round to two decimal places.'
            answer: '1.1'
            answer_contract: {"kind":"approx","decimals":2}
            solution_sketch: 'The linearization is $L(x) = 1 + 5(x - 1)$. Then $L(1.02) = 1 + 5(0.02) = 1.10$.'
          - problem: 'Use the linearization of $f(x) = \sqrt[3]{x}$ at $a = 8$ to approximate $\sqrt[3]{8.12}$. Round to two decimal places.'
            answer: '2.01'
            answer_contract: {"kind":"approx","decimals":2}
            solution_sketch: 'We have $f(8) = 2$ and $f''(8) = \frac{1}{12}$, so $L(x) = 2 + \frac{1}{12}(x - 8)$. Then $L(8.12) = 2 + \frac{0.12}{12} = 2.01$.'
          - problem: 'Use the linearization of $f(x) = x^4$ at $a = 2$ to approximate $(2.01)^4$. Round to two decimal places.'
            answer: '16.32'
            answer_contract: {"kind":"approx","decimals":2}
            solution_sketch: 'We have $f(2) = 16$ and $f''(2) = 32$, so $L(x) = 16 + 32(x - 2)$. Then $L(2.01) = 16 + 32(0.01) = 16.32$.'
          - problem: 'Use the linearization of $f(x) = \ln x$ at $a = 1$ to approximate $\ln(1.02)$. Round to two decimal places.'
            answer: '0.02'
            answer_contract: {"kind":"approx","decimals":2}
            solution_sketch: 'The linearization is $L(x) = x - 1$. Then $L(1.02) = 0.02$.'
          - problem: 'A cubical box has edges of $5$ cm. After heating, each edge is $5.02$ cm long. Use the linearization of $V(s) = s^3$ at $s = 5$ to approximate the new volume, in cubic centimetres. Round to one decimal place.'
            answer: '126.5'
            answer_contract: {"kind":"approx","decimals":1}
            solution_sketch: 'We have $V(5) = 125$ and $V''(5) = 75$, so $L(s) = 125 + 75(s - 5)$. Then $L(5.02) = 125 + 75(0.02) = 126.5$.'
          - problem: 'A circular metal plate has radius $10$ cm. After heating, its radius is $10.05$ cm. Use the linearization of $A(r) = \pi r^2$ at $r = 10$ to approximate the new area, in square centimetres. Round to one decimal place.'
            answer: '317.3'
            answer_contract: {"kind":"approx","decimals":1}
            solution_sketch: 'We have $A(10) = 100\pi$ and $A''(10) = 20\pi$, so $L(r) = 100\pi + 20\pi(r - 10)$. Then $L(10.05) = 101\pi \approx 317.3$.'
          - problem: 'Use the linearization of $f(x) = \frac{1}{x}$ at $a = 10$ to approximate $\frac{1}{10.2}$. Round to three decimal places.'
            answer: '0.098'
            answer_contract: {"kind":"approx","decimals":3}
            solution_sketch: 'We have $f(10) = 0.1$ and $f''(10) = -0.01$, so $L(x) = 0.1 - 0.01(x - 10)$. Then $L(10.2) = 0.1 - 0.002 = 0.098$.'
        constraints: "input a small offset from the base point; the decimal answer terminates"
      - id: kp3
        name: Standard small-input approximations
        key_prerequisites: [derivatives-trig, derivatives-exp-log]
        exemplars:
          - problem: 'Use the linearization of $f(x) = e^x$ at $a = 0$ to approximate $e^{0.03}$. Round to two decimal places.'
            answer: '1.03'
            answer_contract: {"kind":"approx","decimals":2}
            solution_sketch: 'We have $f(0) = 1$ and $f''(0) = 1$, so $L(x) = 1 + x$. Then $L(0.03) = 1.03$.'
          - problem: 'Use the linearization of $f(x) = \sin x$ at $a = 0$ to approximate $\sin(0.2)$. Round to two decimal places.'
            answer: '0.2'
            answer_contract: {"kind":"approx","decimals":2}
            solution_sketch: 'We have $f(0) = 0$ and $f''(0) = \cos 0 = 1$, so $L(x) = x$. Then $L(0.2) = 0.2$.'
          - problem: 'Use the linearization of $f(x) = \ln x$ at $a = 1$ to approximate $\ln(1.05)$. Round to two decimal places.'
            answer: '0.05'
            answer_contract: {"kind":"approx","decimals":2}
            solution_sketch: 'We have $f(1) = 0$ and $f''(1) = 1$, so $L(x) = x - 1$. Then $L(1.05) = 0.05$.'
          - problem: 'Use the linearization of $f(x) = \sqrt{1 + x}$ at $a = 0$ to approximate $\sqrt{1.04}$. Round to two decimal places.'
            answer: '1.02'
            answer_contract: {"kind":"approx","decimals":2}
            solution_sketch: 'We have $f(0) = 1$ and $f''(0) = \frac{1}{2}$, so $L(x) = 1 + \frac{1}{2}x$. Then $L(0.04) = 1 + 0.02 = 1.02$.'
          - problem: 'Use the linearization of $f(x) = \frac{1}{1 + x}$ at $a = 0$ to approximate $\frac{1}{1.03}$. Round to two decimal places.'
            answer: '0.97'
            answer_contract: {"kind":"approx","decimals":2}
            solution_sketch: 'We have $f(0) = 1$ and $f''(0) = -1$, so $L(x) = 1 - x$. Then $L(0.03) = 0.97$.'
          - problem: 'A population grows in one year by the factor $e^{0.05}$. Use the linearization of $e^x$ at $0$ to approximate this growth factor. Round to two decimal places.'
            answer: '1.05'
            answer_contract: {"kind":"approx","decimals":2}
            solution_sketch: 'The linearization of $e^x$ at $0$ is $L(x) = 1 + x$. So the growth factor is about $L(0.05) = 1.05$.'
          - problem: 'An account of $200$ dollars grows continuously, so after one year it holds $200e^{0.03}$ dollars. Use the linearization of $e^x$ at $0$ to approximate the balance, in dollars. Round to two decimal places.'
            answer: '206'
            answer_contract: {"kind":"approx","decimals":2}
            solution_sketch: 'The linearization of $e^x$ at $0$ is $1 + x$, so $e^{0.03} \approx 1.03$. The balance is about $200 \cdot 1.03 = 206$ dollars.'
          - problem: 'For a small angle $\theta$ in radians, a pendulum model replaces $\sin\theta$ by a linear function. Use the linearization of $\sin\theta$ at $0$ to approximate $\sin(0.12)$. Round to two decimal places.'
            answer: '0.12'
            answer_contract: {"kind":"approx","decimals":2}
            solution_sketch: 'The linearization of $\sin\theta$ at $0$ is $L(\theta) = \theta$, because $\sin 0 = 0$ and $\cos 0 = 1$. So $\sin(0.12) \approx 0.12$.'
        constraints: "base points 0 or 1 where the function and derivative are exact; the answer is the numeric approximation"
    diagnostic_exemplar:
      problem: 'Find the linearization of $f(x) = \sqrt[3]{x}$ at $a = 8$ and use it to approximate $\sqrt[3]{8.24}$.'
      answer: '2.02'
      solution_sketch: '$f(8) = 2$ and $f''(x) = \frac{1}{3}x^{-2/3}$ gives $f''(8) = \frac{1}{12}$, so $L(x) = 2 + \frac{x-8}{12}$ and $L(8.24) = 2 + \frac{0.24}{12} = 2.02$.'
    anki_seeds:
      - front: "The linearization of f at a: L(x) = ?"
        back: "f(a) + f'(a)(x - a) — the tangent line used as an approximation"
        type: basic
      - front: "Near 0: sin x ≈ ?, e^x ≈ ?, ln(1 + x) ≈ ?"
        back: "x; 1 + x; x"
        type: basic

  - id: differentials-error-propagation
    name: Differentials and Error Propagation
    core: false                # terminal application of the differential
    difficulty: 0.6
    drill: false
    answer_kind: expression
    expected_time_secs: 150
    prerequisites:
      - id: linearization
        weight: 0.8
        key: true
      - id: derivative-power-rule
        weight: 0.5
        key: true
      - id: circle-area-circumference
        weight: 0.3
      - id: percentages
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: Compute differentials
        key_prerequisites: [linearization, derivative-power-rule]
        constraints: 'polynomial or power functions; dx one decimal place; contexts with position, cost or a given dy'
        exemplars:
          - problem: 'For $y = x^3$, find $dy$ when $x = 2$ and $dx = 0.1$.'
            answer: '1.2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The differential is $dy = f''(x)\,dx = 3x^2\,dx$. At $x = 2$ and $dx = 0.1$ this gives $dy = 3 \cdot 4 \cdot 0.1 = 1.2$.'
          - problem: 'For $y = x^3$ with $dx = 0.1$, what is $dy$ in terms of $x$?'
            answer: '3x^2/10'
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'The derivative of $x^3$ is $3x^2$, so $dy = 3x^2\,dx$. With $dx = 0.1$ this is $dy = 0.3x^2 = \frac{3x^2}{10}$.'
          - problem: 'For $y = x^4$, find $dy$ when $x = 1.5$ and $dx = 0.2$.'
            answer: '2.7'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The differential is $dy = 4x^3\,dx$. At $x = 1.5$ we have $4x^3 = 4 \cdot 3.375 = 13.5$, so $dy = 13.5 \cdot 0.2 = 2.7$.'
          - problem: 'For $y = \sqrt{x}$, find $dy$ when $x = 9$ and $dx = -0.2$.'
            answer: '-1/30'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Since $\sqrt{x} = x^{1/2}$, the derivative is $\frac{1}{2\sqrt{x}}$, which equals $\frac{1}{6}$ at $x = 9$. Then $dy = \frac{1}{6} \cdot (-0.2) = -\frac{1}{30}$.'
          - problem: 'A particle moves along a line so that its position in metres is $s = t^3$, with $t$ in seconds. Use the differential to estimate how far it moves between $t = 3$ s and $t = 3.05$ s.'
            answer: '1.35'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'The differential is $ds = 3t^2\,dt$. At $t = 3$ and $dt = 0.05$ it gives $ds = 3 \cdot 9 \cdot 0.05 = 1.35$ metres.'
          - problem: 'For $y = \frac{1}{x}$, find $dy$ when $x = 2$ and $dx = 0.3$.'
            answer: '-3/40'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The derivative of $x^{-1}$ is $-\frac{1}{x^2}$, which equals $-\frac{1}{4}$ at $x = 2$. Then $dy = -\frac{1}{4} \cdot 0.3 = -\frac{3}{40}$.'
          - problem: 'The cost of making $q$ chairs is $C(q) = 0.5q^2 + 30q + 500$ dollars. Use the differential to estimate how much the cost rises when production goes from $40$ chairs to $42$ chairs.'
            answer: '140'
            answer_contract: {"kind":"unit","quantity":"dollar","unit":"dollar","allow_omitted":true}
            solution_sketch: 'The differential is $dC = C''(q)\,dq = (q + 30)\,dq$. At $q = 40$ and $dq = 2$ it gives $dC = 70 \cdot 2 = 140$ dollars.'
          - problem: 'Sam computes the differential of $y = x^4$ at $x = 2$ with $dx = 0.1$ as $4 \cdot 2^3 = 32$. What is the correct value of $dy$?'
            answer: '3.2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Sam found the derivative but did not multiply by $dx$. The differential is $dy = 4x^3\,dx = 4 \cdot 8 \cdot 0.1 = 3.2$.'
          - problem: 'For $y = x^2$ at $x = 5$, what change $dx$ makes the differential $dy$ equal to $0.5$?'
            answer: '0.05'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Since $dy = 2x\,dx$ and $2x = 10$ at $x = 5$, we need $10\,dx = 0.5$. Dividing both sides by $10$ gives $dx = 0.05$.'
      - id: kp2
        name: Estimate propagated error
        key_prerequisites: [linearization, circle-area-circumference]
        constraints: 'state the geometric formula; measurement error at most a few percent; include one item that asks for the allowed error in the measurement'
        try_first:
          problem: 'A square has side $10$ cm. Its side is measured as $10.1$ cm instead. By how many square centimetres is the area computed from the measured side larger than the true area?'
          answer_contract: {"kind":"exact"}
          answer: '2.01'
          reveal: 'The area is larger by $10.1^2 - 10^2 = 2.01$ square centimetres, close to $2x\,dx = 2 \cdot 10 \cdot 0.1 = 2$. A differential gives this estimate without squaring the measured side.'
        exemplars:
          - problem: 'The radius of a circle is measured as $10$ cm, with a possible error of $0.1$ cm. Use differentials to estimate the possible error in the area $A = \pi r^2$.'
            answer: '2pi'
            answer_contract: {"kind":"unit","quantity":"area","unit":"cm^2","allow_omitted":true}
            solution_sketch: 'The differential is $dA = 2\pi r\,dr$. With $r = 10$ and $dr = 0.1$ it gives $dA = 2\pi \cdot 10 \cdot 0.1 = 2\pi$ square centimetres.'
          - problem: 'The side of a cube is measured as $3$ m, with a possible error of $0.02$ m. Estimate the possible error in the volume $V = x^3$.'
            answer: '0.54'
            answer_contract: {"kind":"unit","quantity":"cubic_volume","unit":"m^3","allow_omitted":true}
            solution_sketch: 'The differential is $dV = 3x^2\,dx$. With $x = 3$ and $dx = 0.02$ it gives $dV = 27 \cdot 0.02 = 0.54$ cubic metres.'
          - problem: 'The radius of a sphere is measured as $6$ cm, with a possible error of $0.12$ cm. Estimate the possible error in the volume $V = \frac{4}{3}\pi r^3$.'
            answer: '432pi/25'
            answer_contract: {"kind":"unit","quantity":"cubic_volume","unit":"cm^3","allow_omitted":true}
            solution_sketch: 'The differential is $dV = 4\pi r^2\,dr$. With $r = 6$ and $dr = 0.12$ it gives $dV = 4\pi \cdot 36 \cdot 0.12 = 17.28\pi = \frac{432\pi}{25}$ cubic centimetres.'
          - problem: 'The radius of a circular running track is measured as $25$ m, with a possible error of $0.3$ m. Estimate the possible error in the length of the track, which is the circumference $C = 2\pi r$.'
            answer: '0.6pi'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'The differential is $dC = 2\pi\,dr$. With $dr = 0.3$ it gives $dC = 2\pi \cdot 0.3 = 0.6\pi$ metres, about $1.88$ metres.'
          - problem: 'A circular plate has radius $10$ cm. Its area must be within $0.5\pi$ square centimetres of the target area. Use differentials to estimate the largest error in the radius that is allowed.'
            answer: '0.025'
            answer_contract: {"kind":"unit","quantity":"length","unit":"cm","allow_omitted":true}
            solution_sketch: 'The area error is $dA = 2\pi r\,dr = 20\pi\,dr$. We need $20\pi\,dr = 0.5\pi$, and dividing both sides by $20\pi$ gives $dr = 0.025$ centimetres.'
          - problem: 'A square tile has side $12$ cm, measured with a possible error of $0.1$ cm. Estimate the possible error in the area.'
            answer: '2.4'
            answer_contract: {"kind":"unit","quantity":"area","unit":"cm^2","allow_omitted":true}
            solution_sketch: 'For $A = x^2$ the differential is $dA = 2x\,dx$. With $x = 12$ and $dx = 0.1$ it gives $dA = 24 \cdot 0.1 = 2.4$ square centimetres.'
          - problem: 'A spherical balloon has radius $10$ cm, measured with a possible error of $0.2$ cm. Estimate the possible error in its surface area $S = 4\pi r^2$.'
            answer: '16pi'
            answer_contract: {"kind":"unit","quantity":"area","unit":"cm^2","allow_omitted":true}
            solution_sketch: 'The differential is $dS = 8\pi r\,dr$. With $r = 10$ and $dr = 0.2$ it gives $dS = 8\pi \cdot 10 \cdot 0.2 = 16\pi$ square centimetres.'
          - problem: 'A cylinder is $20$ cm tall. Its radius is measured as $5$ cm with a possible error of $0.1$ cm. Estimate the possible error in the volume $V = \pi r^2 h$.'
            answer: '20pi'
            answer_contract: {"kind":"unit","quantity":"cubic_volume","unit":"cm^3","allow_omitted":true}
            solution_sketch: 'With $h = 20$ fixed, the differential is $dV = 2\pi r h\,dr$. With $r = 5$ and $dr = 0.1$ it gives $dV = 2\pi \cdot 5 \cdot 20 \cdot 0.1 = 20\pi$ cubic centimetres.'
          - problem: 'Sam estimates the possible error in the area of a circle of radius $8$ m, measured with error $0.05$ m, as $\pi \cdot 8^2 \cdot 0.05 = 3.2\pi$. What is the correct estimate?'
            answer: '0.8pi'
            answer_contract: {"kind":"unit","quantity":"area","unit":"m^2","allow_omitted":true}
            solution_sketch: 'Sam multiplied the area itself by $dr$, but the error is the differential $dA = 2\pi r\,dr$. With $r = 8$ and $dr = 0.05$ it gives $dA = 2\pi \cdot 8 \cdot 0.05 = 0.8\pi$ square metres.'
      - id: kp3
        name: Relative and percentage error
        key_prerequisites: [linearization, percentages]
        constraints: 'power functions so relative error scales by the exponent; percentage answers; include a context that asks for the allowed error in the input'
        exemplars:
          - problem: 'The radius of a sphere is measured with a $1\%$ error. Estimate the resulting percentage error in the volume $V = \frac{4}{3}\pi r^3$.'
            answer: '3%'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'For $V = \frac{4}{3}\pi r^3$ we have $dV = 4\pi r^2\,dr$, so $\frac{dV}{V} = 3\,\frac{dr}{r}$. A $1\%$ error in $r$ therefore gives a $3 \cdot 1\% = 3\%$ error in $V$.'
          - problem: 'The side of a square is measured with a $0.5\%$ error. Estimate the percentage error in its area.'
            answer: '1%'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'For $A = x^2$ we have $\frac{dA}{A} = 2\,\frac{dx}{x}$. A $0.5\%$ error in the side gives $2 \cdot 0.5\% = 1\%$ in the area.'
          - problem: 'The side of a cube is measured with a $3\%$ error. Estimate the percentage error in its volume $V = s^3$.'
            answer: '9%'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Since $V = s^3$, we have $\frac{dV}{V} = 3\,\frac{ds}{s}$. With $\frac{ds}{s} = 3\%$ this gives $3 \cdot 3\% = 9\%$.'
          - problem: 'A quantity is $y = x^4$, and $x$ is measured with a $1.25\%$ error. Estimate the percentage error in $y$.'
            answer: '5%'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'For $y = x^4$ we have $\frac{dy}{y} = 4\,\frac{dx}{x}$. With $\frac{dx}{x} = 1.25\%$ this gives $4 \cdot 1.25\% = 5\%$.'
          - problem: 'A square tile has side $25$ cm, measured with an error of $0.5$ cm. Estimate the percentage error in its area.'
            answer: '4%'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The relative error in the side is $\frac{0.5}{25} = 0.02 = 2\%$. Since $\frac{dA}{A} = 2\,\frac{dx}{x}$, the area has a $2 \cdot 2\% = 4\%$ error.'
          - problem: 'The surface area of a sphere is $S = 4\pi r^2$. The radius is measured with a $4\%$ error. Estimate the percentage error in $S$.'
            answer: '8%'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'For $S = 4\pi r^2$ we have $\frac{dS}{S} = 2\,\frac{dr}{r}$. A $4\%$ error in $r$ gives $2 \cdot 4\% = 8\%$ in $S$.'
          - problem: 'The kinetic energy of a body is $K = \frac{1}{2}mv^2$. Its speed $v$ is measured with a $3.5\%$ error. Estimate the percentage error in $K$.'
            answer: '7%'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Since $K$ is proportional to $v^2$, we have $\frac{dK}{K} = 2\,\frac{dv}{v}$. With $\frac{dv}{v} = 3.5\%$ this gives $2 \cdot 3.5\% = 7\%$.'
          - problem: 'The volume of a cube of side $s$ must be correct to within $6\%$. Estimate the largest percentage error that is allowed in the measured side.'
            answer: '2%'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Since $V = s^3$, we have $\frac{dV}{V} = 3\,\frac{ds}{s}$. We need $3\,\frac{ds}{s} = 6\%$, and dividing by $3$ gives $\frac{ds}{s} = 2\%$.'
          - problem: 'The period of a pendulum is $T = 2\pi\sqrt{L/g}$, where $L$ is its length and $g$ is constant. The length is measured with a $4\%$ error. Estimate the percentage error in $T$.'
            answer: '2%'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Here $T$ is proportional to $L^{1/2}$, so $\frac{dT}{T} = \frac{1}{2}\,\frac{dL}{L}$. A $4\%$ error in $L$ gives $\frac{1}{2} \cdot 4\% = 2\%$ in $T$.'
          - problem: 'Sam says that a $2\%$ error in the radius of a circle gives a $2\%$ error in its area $A = \pi r^2$. Estimate the correct percentage error in the area.'
            answer: '4%'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'For $A = \pi r^2$ we have $\frac{dA}{A} = 2\,\frac{dr}{r}$, so the percentage error doubles. A $2\%$ error in $r$ gives $2 \cdot 2\% = 4\%$ in $A$, not $2\%$.'
          - problem: 'The radius of a sphere is measured as $8$ cm, with a possible error of $0.1$ cm. Estimate the relative error in the volume $V = \frac{4}{3}\pi r^3$.'
            answer: '3/80'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'For $V = \frac{4}{3}\pi r^3$ we have $\frac{dV}{V} = 3\,\frac{dr}{r}$. With $\frac{dr}{r} = \frac{0.1}{8} = \frac{1}{80}$ this gives $\frac{dV}{V} = \frac{3}{80} = 0.0375$.'
    diagnostic_exemplar:
      problem: 'A sphere''s radius is measured with a $2\%$ error. Using $V = \frac{4}{3}\pi r^3$, estimate the resulting percentage error in the volume.'
      answer: "6%"
      answer_contract: {"kind":"exact"}
      solution_sketch: '$\frac{dV}{V} = 3\frac{dr}{r} = 3 \cdot 2\% = 6\%$.'
    anki_seeds:
      - front: "The differential of y = f(x) is dy = ?"
        back: "f'(x) dx"
        type: basic
      - front: "For y = x^n, the relative error dy/y equals ___ times dx/x."
        back: "n — a power magnifies percentage error by its exponent"
        type: basic

  - id: newtons-method
    name: 'Newton''s Method'
    core: false                # named algorithm the curriculum arrives at and never reuses
    difficulty: 0.65
    drill: false
    answer_kind: numeric
    expected_time_secs: 180
    prerequisites:
      - id: linearization
        weight: 0.7
        key: true
      - id: derivative-power-rule
        weight: 0.5
        key: true
      - id: evaluating-functions
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: One Newton iteration
        key_prerequisites: [linearization, derivative-power-rule]
        constraints: 'f(x₀) and f''(x₀) are small integers or one-decimal values; x₁ is a simple fraction or a rounded decimal; contexts that name the root to estimate'
        try_first:
          problem: 'The tangent line to $y = x^2 - 11$ at the point $(4, 5)$ has slope $8$. Moving along this line, how far to the left of $x = 4$ is the point where the line is at height $0$?'
          answer_contract: {"kind":"exact"}
          answer: '5/8'
          reveal: 'The line falls $5$ units to reach height $0$ at slope $8$, so it needs a horizontal distance of $\frac{5}{8}$. The $x$-intercept is $4 - \frac{5}{8}$, which is exactly one step of Newton''s method.'
        exemplars:
          - problem: 'Apply one step of Newton''s method to $f(x) = x^2 - 7$ with starting value $x_0 = 3$. What is $x_1$?'
            answer: '8/3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Here $f''(x) = 2x$, so $f(3) = 2$ and $f''(3) = 6$. Then $x_1 = 3 - \frac{2}{6} = 3 - \frac{1}{3} = \frac{8}{3}$.'
          - problem: 'Let $f(x) = x^3 - 3x - 1$. Starting from $x_0 = 2$, carry out one Newton step. What is $x_1$?'
            answer: '17/9'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The derivative is $f''(x) = 3x^2 - 3$, so $f(2) = 1$ and $f''(2) = 9$. Then $x_1 = 2 - \frac{1}{9} = \frac{17}{9}$.'
          - problem: 'Maya wants to estimate $\sqrt{10}$. She applies Newton''s method to $f(x) = x^2 - 10$, whose positive root is $\sqrt{10}$, with starting value $x_0 = 3$. What is her next estimate $x_1$?'
            answer: '19/6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Here $f''(x) = 2x$, so $f(3) = -1$ and $f''(3) = 6$. Then $x_1 = 3 - \frac{-1}{6} = 3 + \frac{1}{6} = \frac{19}{6}$.'
          - problem: 'The equation $x^2 - 2 = 0$ is solved with Newton''s method, starting at $x_0 = 1$. Find $x_1$.'
            answer: '3/2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'With $f(x) = x^2 - 2$ we have $f''(x) = 2x$, so $f(1) = -1$ and $f''(1) = 2$. Then $x_1 = 1 - \frac{-1}{2} = \frac{3}{2}$.'
          - problem: 'To estimate $\sqrt[3]{30}$, solve $x^3 - 30 = 0$ with Newton''s method, starting at $x_0 = 3$. What is $x_1$?'
            answer: '28/9'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The derivative is $f''(x) = 3x^2$, so $f(3) = -3$ and $f''(3) = 27$. Then $x_1 = 3 - \frac{-3}{27} = 3 + \frac{1}{9} = \frac{28}{9}$.'
          - problem: 'Let $f(x) = x^3 + x - 3$. Use Newton''s method once from $x_0 = 1$. What is $x_1$?'
            answer: '5/4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The derivative is $f''(x) = 3x^2 + 1$, so $f(1) = -1$ and $f''(1) = 4$. Then $x_1 = 1 - \frac{-1}{4} = \frac{5}{4}$.'
          - problem: 'Sam applies one Newton step to $f(x) = x^2 - 5$ with $x_0 = 2$ and writes $x_1 = 2 - \frac{f''(2)}{f(2)} = 2 - \frac{4}{-1} = 6$. What is the correct $x_1$?'
            answer: '9/4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Newton''s method divides the function value by the derivative, not the other way round. Here $f(2) = -1$ and $f''(2) = 4$, so $x_1 = 2 - \frac{-1}{4} = \frac{9}{4}$.'
          - problem: 'Let $f(x) = x^3 - 4x + 1$. Make one Newton step from $x_0 = 2$. What is $x_1$?'
            answer: '15/8'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The derivative is $f''(x) = 3x^2 - 4$, so $f(2) = 1$ and $f''(2) = 8$. Then $x_1 = 2 - \frac{1}{8} = \frac{15}{8}$.'
          - problem: 'A chemist models a concentration with $f(x) = x^3 + 2x - 5$ and needs the root of $f$ near $x_0 = 1.5$. Apply one step of Newton''s method. What is $x_1$, to three decimal places?'
            answer: '1.343'
            answer_contract: {"kind":"approx","decimals":3}
            solution_sketch: 'The derivative is $f''(x) = 3x^2 + 2$, so $f(1.5) = 1.375$ and $f''(1.5) = 8.75$. Then $x_1 = 1.5 - \frac{1.375}{8.75} \approx 1.343$.'
          - problem: 'For the equation $x^2 + x - 1 = 0$, take $x_0 = 1$ and apply one step of Newton''s method. What is $x_1$?'
            answer: '2/3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The derivative is $f''(x) = 2x + 1$, so $f(1) = 1$ and $f''(1) = 3$. Then $x_1 = 1 - \frac{1}{3} = \frac{2}{3}$.'
      - id: kp2
        name: Iterate twice
        key_prerequisites: [linearization, evaluating-functions]
        constraints: 'keep arithmetic exact with fractions, or round only at the end when the question states the places; two iterations at most'
        exemplars:
          - problem: 'Apply Newton''s method twice to $f(x) = x^2 - 7$, starting at $x_0 = 3$. What is $x_2$?'
            answer: '127/48'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Since $f''(x) = 2x$, the first step gives $x_1 = 3 - \frac{2}{6} = \frac{8}{3}$. Then $f(\frac{8}{3}) = \frac{1}{9}$ and $f''(\frac{8}{3}) = \frac{16}{3}$, so $x_2 = \frac{8}{3} - \frac{1}{48} = \frac{127}{48}$.'
          - problem: 'Use Newton''s method twice on $f(x) = x^2 - 11$, starting at $x_0 = 3$. What is $x_2$?'
            answer: '199/60'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Since $f''(x) = 2x$, the first step gives $x_1 = 3 - \frac{-2}{6} = \frac{10}{3}$. Then $f(\frac{10}{3}) = \frac{1}{9}$ and $f''(\frac{10}{3}) = \frac{20}{3}$, so $x_2 = \frac{10}{3} - \frac{1}{60} = \frac{199}{60}$.'
          - problem: 'Apply Newton''s method twice to $f(x) = x^3 - 2$, starting at $x_0 = 1$. What is $x_2$?'
            answer: '91/72'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Since $f''(x) = 3x^2$, the first step gives $x_1 = 1 - \frac{-1}{3} = \frac{4}{3}$. Then $f(\frac{4}{3}) = \frac{10}{27}$ and $f''(\frac{4}{3}) = \frac{16}{3}$, so $x_2 = \frac{4}{3} - \frac{5}{72} = \frac{91}{72}$.'
          - problem: 'To estimate $\sqrt{17}$, Maya applies Newton''s method twice to $f(x) = x^2 - 17$, starting at $x_0 = 4$. What is $x_2$, to four decimal places?'
            answer: '4.1231'
            answer_contract: {"kind":"approx","decimals":4}
            solution_sketch: 'Since $f''(x) = 2x$, the first step gives $x_1 = 4 - \frac{-1}{8} = \frac{33}{8}$. The second step gives $x_2 = \frac{33}{8} - \frac{1/64}{33/4} = \frac{2177}{528} \approx 4.1231$.'
          - problem: 'Run two Newton iterations for $f(x) = x^2 + x - 3$ with $x_0 = 1$. What is $x_2$?'
            answer: '43/33'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Since $f''(x) = 2x + 1$, the first step gives $x_1 = 1 - \frac{-1}{3} = \frac{4}{3}$. Then $f(\frac{4}{3}) = \frac{1}{9}$ and $f''(\frac{4}{3}) = \frac{11}{3}$, so $x_2 = \frac{4}{3} - \frac{1}{33} = \frac{43}{33}$.'
          - problem: 'Apply Newton''s method twice to $f(x) = x^2 - 13$, starting at $x_0 = 3$. What is $x_2$?'
            answer: '119/33'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Since $f''(x) = 2x$, the first step gives $x_1 = 3 - \frac{-4}{6} = \frac{11}{3}$. Then $f(\frac{11}{3}) = \frac{4}{9}$ and $f''(\frac{11}{3}) = \frac{22}{3}$, so $x_2 = \frac{11}{3} - \frac{2}{33} = \frac{119}{33}$.'
          - problem: 'A square garden must have area $50$ square metres, so its side $s$ solves $s^2 - 50 = 0$. Starting from $s_0 = 7$ metres, apply Newton''s method twice. What is $s_2$, to three decimal places?'
            answer: '7.071'
            answer_contract: {"kind":"approx","decimals":3}
            solution_sketch: 'Since $f''(s) = 2s$, the first step gives $s_1 = 7 - \frac{-1}{14} = \frac{99}{14} \approx 7.0714$. The second step gives $s_2 = s_1 - \frac{s_1^2 - 50}{2s_1} \approx 7.071$.'
          - problem: 'Sam applies two Newton steps to $f(x) = x^2 - 5$ from $x_0 = 3$. He finds $x_1 = \frac{7}{3}$, then computes $x_2$ from $x_0$ again and gets $\frac{7}{3}$ a second time. What is the correct $x_2$?'
            answer: '47/21'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The second step must start from $x_1 = \frac{7}{3}$, not from $x_0$. Then $f(\frac{7}{3}) = \frac{4}{9}$ and $f''(\frac{7}{3}) = \frac{14}{3}$, so $x_2 = \frac{7}{3} - \frac{2}{21} = \frac{47}{21}$.'
          - problem: 'Apply Newton''s method twice to $f(x) = x^3 + 2x - 5$, starting at $x_0 = 1.5$. What is $x_2$, to three decimal places?'
            answer: '1.328'
            answer_contract: {"kind":"approx","decimals":3}
            solution_sketch: 'Since $f''(x) = 3x^2 + 2$, the first step gives $x_1 = 1.5 - \frac{1.375}{8.75} \approx 1.3429$. The second step gives $x_2 = x_1 - \frac{f(x_1)}{f''(x_1)} \approx 1.328$.'
      - id: kp3
        name: Geometric meaning and failure modes
        key_prerequisites: [linearization]
        constraints: 'conceptual and short computational questions; tangent-line picture; failure cases where f''(xₙ) = 0; one cycling example'
        exemplars:
          - problem: 'The tangent line to $y = x^2 - 2$ at the point $(3, 7)$ crosses the $x$-axis at what value of $x$?'
            answer: '11/6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The slope is $f''(3) = 6$, so the tangent line is $y = 7 + 6(x - 3)$. Setting $y = 0$ gives $x = 3 - \frac{7}{6} = \frac{11}{6}$, which is the Newton step from $x_0 = 3$.'
          - problem: 'Can Newton''s method take a first step on $f(x) = x^2 - 5$ from the starting value $x_0 = 0$?'
            answer: 'no'
            answer_contract: {"kind":"label","options":[["no","it cannot","no, it cannot","it fails","no step","it stalls"],["yes","it works","a step can be taken"]]}
            solution_sketch: 'Here $f''(x) = 2x$, so $f''(0) = 0$. The Newton step divides by $f''(0)$, and division by zero is undefined, so no step is possible.'
          - problem: 'For $f(x) = x^2 + 4x + 7$, Newton''s method cannot start at one value $x_0$, because the tangent line there is horizontal. Find $x_0$.'
            answer: '-2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The derivative is $f''(x) = 2x + 4$. A horizontal tangent means $f''(x_0) = 0$, so $2x_0 + 4 = 0$ and $x_0 = -2$.'
          - problem: 'A laser beam travels along the tangent line to the curve $y = x^3 - 8$ at the point $(3, 19)$, moving down toward the $x$-axis. At what value of $x$ does the beam meet the axis?'
            answer: '62/27'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The slope is $f''(3) = 27$, so the beam follows $y = 19 + 27(x - 3)$. Setting $y = 0$ gives $x = 3 - \frac{19}{27} = \frac{62}{27}$.'
          - problem: 'Apply Newton''s method twice to $f(x) = x^3 - 2x + 2$, starting at $x_0 = 0$. What is $x_2$?'
            answer: '0'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The derivative is $f''(x) = 3x^2 - 2$. From $x_0 = 0$ we get $x_1 = 0 - \frac{2}{-2} = 1$. From $x_1 = 1$ we get $x_2 = 1 - \frac{1}{1} = 0$, so the method cycles back to the start.'
          - problem: 'Which kind of line through the point $(x_n, f(x_n))$ does Newton''s method use to find the next estimate?'
            answer: 'tangent'
            answer_contract: {"kind":"label","options":[["tangent","tangent line","the tangent line","a tangent line"],["secant","secant line"],["normal","normal line"],["chord"]]}
            solution_sketch: 'Newton''s method replaces the curve near $x_n$ by its tangent line at $(x_n, f(x_n))$. The next estimate is the $x$-intercept of that tangent line.'
          - problem: 'For $f(x) = x^3 - 3x + 1$, Newton''s method cannot start at a point of the interval $0 < x < 2$ where the tangent line is horizontal. Find that value of $x$.'
            answer: '1'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The derivative is $f''(x) = 3x^2 - 3$. Setting $3x^2 - 3 = 0$ gives $x = \pm 1$, and only $x = 1$ lies in $0 < x < 2$.'
          - problem: 'Sam says the tangent line to $y = x^2 - 3$ at $x_0 = 2$ meets the $x$-axis at $2 - \frac{f''(2)}{f(2)} = 2 - \frac{4}{1} = -2$. Where does the tangent line actually meet the axis?'
            answer: '7/4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The $x$-intercept is $x_0 - \frac{f(x_0)}{f''(x_0)}$, with the function value on top. Here $f(2) = 1$ and $f''(2) = 4$, so the tangent meets the axis at $2 - \frac{1}{4} = \frac{7}{4}$.'
          - problem: 'Jo wants to solve $x^3 = 5$ with Newton''s method. Starting at $x_0 = 0$ for $f(x) = x^3 - 5$ fails, so Jo starts at $x_0 = 1$ instead. What is $x_1$?'
            answer: '7/3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Since $f''(x) = 3x^2$, the start $x_0 = 0$ gives $f''(0) = 0$, so it fails. From $x_0 = 1$ we get $f(1) = -4$ and $f''(1) = 3$, so $x_1 = 1 - \frac{-4}{3} = \frac{7}{3}$.'
    diagnostic_exemplar:
      problem: 'Apply two steps of Newton''s method to $f(x) = x^2 - 3$ starting at $x_0 = 2$. What are $x_1$ and $x_2$?'
      answer: 'x₁ = 7/4; x₂ = 97/56'
      answer_contract: {kind: none}
      solution_sketch: '$x_1 = 2 - \frac{1}{4} = \frac{7}{4}$; then $f(7/4) = \frac{1}{16}$ and $f''(7/4) = \frac{7}{2}$, so $x_2 = \frac{7}{4} - \frac{1/16}{7/2} = \frac{7}{4} - \frac{1}{56} = \frac{97}{56}$.'
    anki_seeds:
      - front: "Newton's method iteration: x_{n+1} = ?"
        back: "xₙ - f(xₙ)/f'(xₙ)"
        type: basic
      - front: "Newton's method breaks down at xₙ when..."
        back: "f'(xₙ) = 0 (horizontal tangent — no x-intercept)"
        type: basic

  - id: critical-points-extrema
    name: Critical Points and Extrema
    core: true
    difficulty: 0.6
    drill: false
    answer_kind: numeric
    expected_time_secs: 180
    prerequisites:
      - id: derivative-power-rule
        weight: 0.8
        key: true
      - id: quadratic-equations-factoring
        weight: 0.5
        key: true
      - id: continuity
        weight: 0.3
      - id: domain-range
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: Find critical points where f' = 0
        key_prerequisites: [derivative-power-rule, quadratic-equations-factoring]
        constraints: 'cubics or quadratics whose derivative factors over the integers; contexts with height, time or profit'
        exemplars:
          - problem: 'Find the critical point of $f(x) = x^2 - 4x + 1$.'
            answer: '2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The derivative is $f''(x) = 2x - 4$. Setting $2x - 4 = 0$ gives $x = 2$, so the only critical point is $x = 2$.'
          - problem: 'Find the critical points of $f(x) = x^3 - 12x$.'
            answer: '-2, 2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The derivative is $f''(x) = 3x^2 - 12 = 3(x - 2)(x + 2)$. The zero-product rule gives $x = 2$ and $x = -2$.'
          - problem: 'Find the critical points of $f(x) = x^3 + 3x^2 - 45x$.'
            answer: '-5, 3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The derivative is $f''(x) = 3x^2 + 6x - 45 = 3(x^2 + 2x - 15) = 3(x + 5)(x - 3)$. The critical points are $x = -5$ and $x = 3$.'
          - problem: 'The quadratic $f(x) = x^2 + bx + 7$ has its critical point at $x = 3$. Find $b$.'
            answer: '-6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The derivative is $f''(x) = 2x + b$. At the critical point $x = 3$ we need $2(3) + b = 0$, so $b = -6$.'
          - problem: 'Find the critical point of $f(x) = x^3 - 3x^2 + 3x - 1$.'
            answer: '1'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The derivative is $f''(x) = 3x^2 - 6x + 3 = 3(x - 1)^2$. The factor $(x - 1)$ repeats, so there is a single critical point, $x = 1$.'
          - problem: 'The height of a roller-coaster car in metres is $h(t) = t^3 - 15t^2 + 48t$, with $t$ in seconds. At what times is the car momentarily level, with $h''(t) = 0$?'
            answer: '2, 8'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The derivative is $h''(t) = 3t^2 - 30t + 48 = 3(t - 2)(t - 8)$. So $h''(t) = 0$ at $t = 2$ and $t = 8$ seconds.'
          - problem: 'A ball is thrown upward from the ground. Its height in metres after $t$ seconds is $h(t) = -5t^2 + 30t$. At what time is $h''(t) = 0$, so that the ball stops rising?'
            answer: '3'
            answer_contract: {"kind":"unit","quantity":"time","unit":"s","allow_omitted":true}
            solution_sketch: 'The derivative is $h''(t) = -10t + 30$. Setting $-10t + 30 = 0$ gives $t = 3$ seconds.'
          - problem: 'A factory''s profit, in thousands of dollars, from making $x$ hundred items is $P(x) = -x^3 + 9x^2 - 24x + 20$. At which production levels $x$ is $P''(x) = 0$?'
            answer: '2, 4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The derivative is $P''(x) = -3x^2 + 18x - 24 = -3(x^2 - 6x + 8) = -3(x - 2)(x - 4)$. So $P''(x) = 0$ at $x = 2$ and $x = 4$.'
          - problem: 'Sam looks for the critical points of $f(x) = x^3 - 3x$ by solving $f(x) = 0$, and gets $x = 0$ and $x = \pm\sqrt{3}$. What are the critical points of $f$?'
            answer: '-1, 1'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Critical points come from $f''(x) = 0$, not from $f(x) = 0$. Here $f''(x) = 3x^2 - 3 = 3(x - 1)(x + 1)$, so the critical points are $x = -1$ and $x = 1$.'
      - id: kp2
        name: Critical points where f' is undefined; domain care
        key_prerequisites: [derivative-power-rule, domain-range]
        constraints: 'include f''-undefined cases (cusp, corner), one domain trap, and one yes/no item; answers are small integers'
        exemplars:
          - problem: 'Find the critical point of $f(x) = x^{2/3}$.'
            answer: '0'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The power rule gives $f''(x) = \frac{2}{3}x^{-1/3}$, which is never $0$ but is undefined at $x = 0$. Since $0$ is in the domain of $f$, the critical point is $x = 0$.'
          - problem: 'Find the critical points of $f(x) = x + \frac{4}{x}$.'
            answer: '-2, 2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The derivative is $f''(x) = 1 - \frac{4}{x^2}$, which is zero when $x^2 = 4$, so $x = \pm 2$. The derivative is undefined at $x = 0$, but $0$ is not in the domain of $f$, so it does not count.'
          - problem: 'Find the critical point of $f(x) = (x - 1)^{2/3}$.'
            answer: '1'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The power rule gives $f''(x) = \frac{2}{3}(x - 1)^{-1/3}$, which is never $0$. It is undefined at $x = 1$, and $1$ is in the domain of $f$, so the critical point is $x = 1$.'
          - problem: 'Find the critical point of $f(x) = |x - 3|$.'
            answer: '3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'For $x > 3$ the slope is $1$, and for $x < 3$ the slope is $-1$, so $f''(x)$ is never $0$. At $x = 3$ the graph has a corner, so $f''(3)$ does not exist, and $3$ is in the domain. The critical point is $x = 3$.'
          - problem: 'Find the critical point of $f(x) = x^2 + \frac{16}{x}$.'
            answer: '2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The derivative is $f''(x) = 2x - \frac{16}{x^2}$. Setting it to zero gives $2x^3 = 16$, so $x^3 = 8$ and $x = 2$. The point $x = 0$ is not in the domain, so it is not critical.'
          - problem: 'Find the critical points of $f(x) = x^{5/3} - 5x^{2/3}$.'
            answer: '0, 2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The derivative is $f''(x) = \frac{5}{3}x^{2/3} - \frac{10}{3}x^{-1/3} = \frac{5}{3}x^{-1/3}(x - 2)$. It is zero at $x = 2$ and undefined at $x = 0$, and both values are in the domain of $f$.'
          - problem: 'An open box with a square base of side $x$ metres holds $13.5$ cubic metres. Its surface area is $S(x) = x^2 + \frac{54}{x}$ square metres, for $x > 0$. At what value of $x$ does $S$ have a critical point?'
            answer: '3'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'The derivative is $S''(x) = 2x - \frac{54}{x^2}$. Setting it to zero gives $2x^3 = 54$, so $x^3 = 27$ and $x = 3$ metres.'
          - problem: 'The average cost per item of making $x$ thousand items is $C(x) = 0.5x + \frac{8}{x}$ dollars, for $x > 0$. At what value of $x$ does $C$ have a critical point?'
            answer: '4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The derivative is $C''(x) = 0.5 - \frac{8}{x^2}$. Setting it to zero gives $x^2 = 16$, so $x = \pm 4$. Only $x = 4$ is in the domain $x > 0$, so the critical point is $x = 4$.'
          - problem: 'Sam says that $f(x) = x + \frac{9}{x}$ has critical points at $x = -3$, $x = 3$ and $x = 0$, because $f''$ is undefined at $0$. What are the critical points of $f$?'
            answer: '-3, 3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The derivative is $f''(x) = 1 - \frac{9}{x^2}$, which is zero at $x = \pm 3$. The point $x = 0$ is not in the domain of $f$, so it is not a critical point, and the critical points are $x = -3$ and $x = 3$.'
          - problem: 'Is $x = 0$ a critical point of $f(x) = \frac{1}{x}$?'
            answer: 'no'
            answer_contract: {"kind":"label","options":[["no","it is not","not a critical point"],["yes","it is","a critical point"]]}
            solution_sketch: 'The function $f(x) = \frac{1}{x}$ is not defined at $x = 0$, so $0$ is not in its domain. A critical point must lie in the domain, so $x = 0$ is not a critical point.'
      - id: kp3
        name: Classify local extrema with a sign chart
        key_prerequisites: [derivative-power-rule]
        constraints: 'derivative sign changes cleanly at each critical point; function values are integers; two classification items allow maximum, minimum or neither'
        exemplars:
          - problem: 'Find the local maximum value of $f(x) = x^3 - 12x$.'
            answer: '16'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The derivative is $f''(x) = 3(x - 2)(x + 2)$. It is positive for $x < -2$ and negative for $-2 < x < 2$, so $x = -2$ is the local maximum, and $f(-2) = -8 + 24 = 16$.'
          - problem: 'Let $f(x) = x^2 - 6x + 5$. Does $f$ have a local maximum, a local minimum or neither at $x = 3$?'
            answer: 'minimum'
            answer_contract: {"kind":"label","options":[["maximum","local maximum","max","a local maximum"],["minimum","local minimum","min","a local minimum"],["neither","no extremum","neither a max nor a min","neither a maximum nor a minimum"]]}
            solution_sketch: 'The derivative is $f''(x) = 2x - 6$. It is negative for $x < 3$ and positive for $x > 3$, so $f$ falls and then rises, and $x = 3$ is a local minimum.'
          - problem: 'Find the local maximum value of $f(x) = x^3 - 27x$.'
            answer: '54'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The derivative is $f''(x) = 3(x - 3)(x + 3)$, and its signs are $+, -, +$. So $x = -3$ is the local maximum, and $f(-3) = -27 + 81 = 54$.'
          - problem: 'Find the local minimum value of $f(x) = x^3 - 3x^2 - 9x$.'
            answer: '-27'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The derivative is $f''(x) = 3(x - 3)(x + 1)$, and its signs are $+, -, +$. So $x = 3$ is the local minimum, and $f(3) = 27 - 27 - 27 = -27$.'
          - problem: 'Find the $x$-coordinate of the local maximum of $f(x) = x^4 - 8x^2$.'
            answer: '0'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The derivative is $f''(x) = 4x(x - 2)(x + 2)$, and its signs are $-, +, -, +$. The change from $+$ to $-$ happens at $x = 0$, so the local maximum is at $x = 0$.'
          - problem: 'Find the local minimum value of $f(x) = x^3 + 6x^2 + 9x$.'
            answer: '-4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The derivative is $f''(x) = 3(x + 1)(x + 3)$, and its signs are $+, -, +$. So $x = -1$ is the local minimum, and $f(-1) = -1 + 6 - 9 = -4$.'
          - problem: 'Does $f(x) = x^3$ have a local maximum, a local minimum or neither at $x = 0$?'
            answer: 'neither'
            answer_contract: {"kind":"label","options":[["maximum","local maximum","max","a local maximum"],["minimum","local minimum","min","a local minimum"],["neither","no extremum","neither a max nor a min","neither a maximum nor a minimum"]]}
            solution_sketch: 'The derivative is $f''(x) = 3x^2$, which is zero at $x = 0$ but positive on both sides. The sign does not change, so $f$ keeps rising and $x = 0$ is neither a maximum nor a minimum.'
          - problem: 'A ball is thrown upward, and its height in metres after $t$ seconds is $h(t) = -5t^2 + 20t + 1$. Find the greatest height the ball reaches.'
            answer: '21'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'The derivative is $h''(t) = -10t + 20$, which is positive for $t < 2$ and negative for $t > 2$. So the height peaks at $t = 2$, and $h(2) = -20 + 40 + 1 = 21$ metres.'
          - problem: 'The temperature in degrees Celsius of a reaction after $t$ hours is $T(t) = t^3 - 9t^2 + 24t$. What is the temperature at the local minimum of $T$?'
            answer: '16'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The derivative is $T''(t) = 3(t - 2)(t - 4)$, and its signs are $+, -, +$. So the local minimum is at $t = 4$, and $T(4) = 64 - 144 + 96 = 16$.'
          - problem: 'Sam says $x = 1$ is the local maximum of $f(x) = x^3 - 3x$, because $f''(1) = 0$. Find the local maximum value of $f$.'
            answer: '2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The derivative is $f''(x) = 3(x - 1)(x + 1)$, and its signs are $+, -, +$. The change from $+$ to $-$ is at $x = -1$, so that is the local maximum, and $f(-1) = -1 + 3 = 2$. The point $x = 1$ is a local minimum.'
    diagnostic_exemplar:
      problem: 'For $f(x) = x + \frac{9}{x}$, find the critical points and classify each as a local maximum or minimum.'
      answer: "x = -3 is a local max (f(-3) = -6) and x = 3 is a local min (f(3) = 6); x = 0 is not a critical point (not in the domain)"
      answer_contract: {kind: none}
      solution_sketch: '$f''(x) = 1 - \frac{9}{x^2} = 0$ at $x = \pm 3$; $f''''(x) = \frac{18}{x^3}$ is negative at $-3$, positive at $3$.'
    anki_seeds:
      - front: "A critical point of f is a point in the domain where..."
        back: "f'(x) = 0 or f'(x) does not exist"
        type: basic
      - front: "Is x = 0 a critical point of f(x) = 1/x?"
        back: "No — 0 is not in the domain of f, so it cannot be a critical point"
        type: basic

  - id: rolles-theorem
    name: 'Rolle''s Theorem'
    core: false                # feeds only the MVT; terminal theorem branch
    difficulty: 0.55
    drill: false
    answer_kind: numeric
    expected_time_secs: 150
    prerequisites:
      - id: critical-points-extrema
        weight: 0.6
        key: true
      - id: continuity
        weight: 0.5
        key: true
      - id: quadratic-equations-factoring
        weight: 0.4
      - id: derivatives-sin-cos
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: Verify the hypotheses and find c
        key_prerequisites: [continuity, critical-points-extrema]
        constraints: 'equal endpoint values; unique interior zero of f''; polynomials and sin or cos on an interval with equal endpoint values; contexts with height or position'
        try_first:
          problem: 'A ball is thrown straight up and caught at the same height $4$ seconds later. At what time, in seconds after the throw, is it momentarily not moving up or down?'
          answer_contract: {"kind":"exact"}
          answer: '2'
          reveal: 'The ball rises, stops at the top, and then falls, so its velocity is $0$ at the top, which is halfway through the flight at $2$ seconds. Rolle''s theorem says that equal heights at the two ends always force such a moment.'
        exemplars:
          - problem: 'Verify that $f(x) = x^2 - 6x + 10$ satisfies the hypotheses of Rolle''s theorem on $[2, 4]$, and find the number $c$ in $(2, 4)$ with $f''(c) = 0$.'
            answer: '3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The function is a polynomial, so it is continuous and differentiable, and $f(2) = f(4) = 2$. The derivative is $f''(x) = 2x - 6$, and $f''(c) = 0$ gives $c = 3$, which lies in $(2, 4)$.'
          - problem: 'Find the number $c$ in $(0, \pi)$ that Rolle''s theorem guarantees for $f(x) = \sin x$ on $[0, \pi]$.'
            answer: 'pi/2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The function is continuous and differentiable, and $\sin 0 = \sin \pi = 0$. The derivative is $\cos x$, which is zero at $x = \frac{\pi}{2}$, and this lies in $(0, \pi)$.'
          - problem: 'Verify that $f(x) = x^2 + 2x - 8$ satisfies the hypotheses of Rolle''s theorem on $[-4, 2]$, and find the number $c$ in $(-4, 2)$ with $f''(c) = 0$.'
            answer: '-1'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The function is a polynomial, so it is continuous and differentiable, and $f(-4) = f(2) = 0$. The derivative is $f''(x) = 2x + 2$, and $f''(c) = 0$ gives $c = -1$, which lies in $(-4, 2)$.'
          - problem: 'Find the number $c$ in $(0, 2\pi)$ that Rolle''s theorem guarantees for $f(x) = \cos x$ on $[0, 2\pi]$.'
            answer: 'pi'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The function is continuous and differentiable, and $\cos 0 = \cos 2\pi = 1$. The derivative is $-\sin x$, which is zero at $x = \pi$, and this lies in $(0, 2\pi)$.'
          - problem: 'Find the number $c$ in $(\pi, 2\pi)$ that Rolle''s theorem guarantees for $f(x) = \sin x$ on $[\pi, 2\pi]$.'
            answer: '3pi/2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The function is continuous and differentiable, and $\sin \pi = \sin 2\pi = 0$. The derivative is $\cos x$, which is zero at $x = \frac{3\pi}{2}$, and this lies in $(\pi, 2\pi)$.'
          - problem: 'Verify that $f(x) = 2x^2 - 10x + 8$ satisfies the hypotheses of Rolle''s theorem on $[1, 4]$, and find the number $c$ in $(1, 4)$ with $f''(c) = 0$.'
            answer: '5/2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The function is a polynomial, so it is continuous and differentiable, and $f(1) = f(4) = 0$. The derivative is $f''(x) = 4x - 10$, and $f''(c) = 0$ gives $c = \frac{5}{2}$, which lies in $(1, 4)$.'
          - problem: 'A ball is thrown upward from a platform. Its height in metres after $t$ seconds is $h(t) = -5t^2 + 30t + 2$, and it is at the same height at $t = 1$ and at $t = 5$. At what time between them is its velocity zero?'
            answer: '3'
            answer_contract: {"kind":"unit","quantity":"time","unit":"s","allow_omitted":true}
            solution_sketch: 'The heights are $h(1) = h(5) = 27$, so Rolle''s theorem applies. The velocity is $h''(t) = -10t + 30$, which is zero at $t = 3$ seconds.'
          - problem: 'A cable hangs between two towers of equal height, at $x = 0$ and $x = 60$ metres. Its height above the ground is $y = 0.01x^2 - 0.6x + 12$ metres. At what value of $x$ between the towers is the cable horizontal?'
            answer: '30'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'The heights at the towers are $y(0) = y(60) = 12$, so Rolle''s theorem applies. The slope is $y'' = 0.02x - 0.6$, which is zero at $x = 30$ metres.'
          - problem: 'Sam wants the number $c$ in $(1, 3)$ guaranteed by Rolle''s theorem for $f(x) = x^2 - 4x$ on $[1, 3]$. He solves $f(c) = 0$ and gets $c = 0$ or $c = 4$. What is the correct $c$?'
            answer: '2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Rolle''s theorem gives a point where the derivative, not the function, is zero. Here $f(1) = f(3) = -3$ and $f''(x) = 2x - 4$, so $f''(c) = 0$ gives $c = 2$.'
      - id: kp2
        name: Find c for cubics
        key_prerequisites: [critical-points-extrema, quadratic-equations-factoring]
        constraints: 'endpoint values equal (usually both 0); c is an exact radical inside the interval; one item has two values of c'
        exemplars:
          - problem: 'Show that Rolle''s theorem applies to $f(x) = x^3 - 16x$ on $[0, 4]$, and find the number $c$ in $(0, 4)$ with $f''(c) = 0$.'
            answer: '4sqrt(3)/3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The function is a polynomial, and $f(0) = f(4) = 0$. The derivative is $f''(x) = 3x^2 - 16$, so $x = \pm\frac{4}{\sqrt{3}}$. Only $x = \frac{4\sqrt{3}}{3}$ lies in $(0, 4)$.'
          - problem: 'Show that Rolle''s theorem applies to $f(x) = x^3 - 25x$ on $[0, 5]$, and find the number $c$ in $(0, 5)$ with $f''(c) = 0$.'
            answer: '5sqrt(3)/3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The function is a polynomial, and $f(0) = f(5) = 0$. The derivative is $f''(x) = 3x^2 - 25$, so $x = \pm\frac{5}{\sqrt{3}}$. Only $x = \frac{5\sqrt{3}}{3}$ lies in $(0, 5)$.'
          - problem: 'The cubic $f(x) = x^3 - 3x^2 + 2x$ has $f(0) = f(2)$. Find all numbers $c$ in $(0, 2)$ with $f''(c) = 0$.'
            answer: '1 - sqrt(3)/3, 1 + sqrt(3)/3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The derivative is $f''(x) = 3x^2 - 6x + 2$. The quadratic formula gives $x = 1 \pm \frac{\sqrt{3}}{3}$, and both values lie in $(0, 2)$.'
          - problem: 'For the cubic $f(x) = x^3 - 18x$, the endpoints of $[0, 3\sqrt{2}]$ have the same function value. Find the number $c$ in $(0, 3\sqrt{2})$ at which $f''(c) = 0$.'
            answer: 'sqrt(6)'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The derivative is $f''(x) = 3x^2 - 18$, so $x^2 = 6$ and $x = \pm\sqrt{6}$. Only $x = \sqrt{6}$ lies in $(0, 3\sqrt{2})$, since $\sqrt{6} \approx 2.45$ and $3\sqrt{2} \approx 4.24$.'
          - problem: 'A particle moves along a line with position $s(t) = t^3 - 24t$ for $0 \le t \le 2\sqrt{6}$, and its positions at the two ends are equal. At what time in the open interval $(0, 2\sqrt{6})$ is its velocity zero?'
            answer: '2sqrt(2)'
            answer_contract: {"kind":"unit","quantity":"time","unit":"s","allow_omitted":true}
            solution_sketch: 'The velocity is $s''(t) = 3t^2 - 24$, so $t^2 = 8$ and $t = \pm 2\sqrt{2}$. Only the positive time $t = 2\sqrt{2}$ seconds lies in $(0, 2\sqrt{6})$.'
          - problem: 'The cubic $f(x) = x^3 - 6x^2 + 8x$ has $f(0) = f(2)$. Find the number $c$ in $(0, 2)$ with $f''(c) = 0$.'
            answer: '2 - 2sqrt(3)/3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The derivative is $f''(x) = 3x^2 - 12x + 8$. The quadratic formula gives $x = 2 \pm \frac{2\sqrt{3}}{3}$, and only $x = 2 - \frac{2\sqrt{3}}{3}$ lies in $(0, 2)$.'
          - problem: 'The temperature of a reaction in degrees Celsius is $T(t) = t^3 - 27t$ for $0 \le t \le 3\sqrt{3}$ hours, and it is $0$ at both ends of the interval. At what time is the temperature neither rising nor falling?'
            answer: '3'
            answer_contract: {"kind":"unit","quantity":"time","unit":"h","allow_omitted":true}
            solution_sketch: 'The rate of change is $T''(t) = 3t^2 - 27$, so $t^2 = 9$ and $t = \pm 3$. Only $t = 3$ hours lies in $(0, 3\sqrt{3})$, because $3\sqrt{3} \approx 5.2$.'
          - problem: 'Sam differentiates $f(x) = x^3 - 12x$ as $f''(x) = x^2 - 12$ and says $c = 2\sqrt{3}$ on $[0, 2\sqrt{3}]$. What is the correct $c$ in the open interval $(0, 2\sqrt{3})$?'
            answer: '2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The power rule gives $f''(x) = 3x^2 - 12$, not $x^2 - 12$. Then $3x^2 = 12$ gives $x = \pm 2$, and only $x = 2$ lies in $(0, 2\sqrt{3})$. Sam''s value $2\sqrt{3}$ is an endpoint, not an interior point.'
          - problem: 'Find all numbers $c$ in $(-2, 2)$ with $f''(c) = 0$ for $f(x) = x^3 - 4x$, which has the same value at both ends of $[-2, 2]$.'
            answer: '-2sqrt(3)/3, 2sqrt(3)/3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The derivative is $f''(x) = 3x^2 - 4$, so $x = \pm\frac{2}{\sqrt{3}} = \pm\frac{2\sqrt{3}}{3}$. Both values lie in $(-2, 2)$, so there are two numbers $c$.'
      - id: kp3
        name: When the hypotheses fail and what Rolle guarantees
        key_prerequisites: [continuity]
        constraints: 'one hypothesis-failure example, one conceptual guarantee question; the other items need the interval and the open-interval check'
        exemplars:
          - problem: 'Let $f(x) = |x - 1|$ on the interval $[0, 2]$. The endpoint values are equal, but Rolle''s theorem does not apply. Which hypothesis fails?'
            answer: 'differentiability'
            answer_contract: {"kind":"label","options":[["continuity","it is not continuous"],["differentiability","it is not differentiable","not differentiable"],["endpoint equality","the endpoint values are not equal","unequal endpoints"],["no failure","none","nothing fails"]]}
            solution_sketch: 'At $x = 1$ the graph of $|x - 1|$ has a corner, so $f$ is not differentiable there. The function is continuous on $[0, 2]$, and $f(0) = f(2) = 1$, so only differentiability fails.'
          - problem: 'A function $f$ is continuous on $[1, 6]$, differentiable on $(1, 6)$, and $f(1) = f(6)$. Which statement does Rolle''s theorem guarantee?'
            answer: 'a point c with f''(c) = 0'
            answer_contract: {"kind":"label","options":[["a point c with f'(c) = 0","f'(c) = 0","f'(c)=0","a horizontal tangent"],["a point c with f(c) = 0","f(c) = 0","a zero of f"],["f is constant on [1, 6]","f is constant"],["f'(1) = f'(6)","equal derivatives at the ends"]]}
            solution_sketch: 'Rolle''s theorem gives at least one $c$ in $(1, 6)$ with $f''(c) = 0$, so the graph has a horizontal tangent. It does not give a zero of $f$, a constant function, or equal slopes at the ends.'
          - problem: 'Let $f(x) = x^2 - 4x$ on $[0, 4]$. Find the number $c$ in $(0, 4)$ with $f''(c) = 0$.'
            answer: '2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The function is a polynomial with $f(0) = f(4) = 0$, so Rolle''s theorem applies. The derivative is $f''(x) = 2x - 4$, and $f''(c) = 0$ gives $c = 2$.'
          - problem: 'Let $f(x) = \cos x$ on $[-\frac{\pi}{2}, \frac{\pi}{2}]$. Find the number $c$ in $(-\frac{\pi}{2}, \frac{\pi}{2})$ with $f''(c) = 0$.'
            answer: '0'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The function is continuous and differentiable, and $\cos(-\frac{\pi}{2}) = \cos(\frac{\pi}{2}) = 0$. The derivative is $-\sin x$, which is zero at $x = 0$, and $0$ lies in the interval.'
          - problem: 'Let $f(x) = x^4 - 5x^2$ on $[-2, 2]$. Find the largest number $c$ in $(-2, 2)$ with $f''(c) = 0$.'
            answer: 'sqrt(10)/2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Here $f(-2) = f(2) = -4$, and $f''(x) = 4x^3 - 10x = 2x(2x^2 - 5)$. The zeros are $x = 0$ and $x = \pm\frac{\sqrt{10}}{2} \approx \pm 1.58$, so the largest is $\frac{\sqrt{10}}{2}$.'
          - problem: 'The function $f(x) = x^3 - ax$ is to satisfy $f(0) = f(2)$, so that Rolle''s theorem applies on $[0, 2]$. Find the value of $a$.'
            answer: '4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'We have $f(0) = 0$ and $f(2) = 8 - 2a$. Setting $8 - 2a = 0$ gives $a = 4$.'
          - problem: 'A cyclist''s position in kilometres is $s(t) = t^3 - 6t^2 + 9t$ for $0 \le t \le 3$ hours, and she is at the same place at $t = 0$ and $t = 3$. At what time in the open interval $(0, 3)$ is her velocity zero?'
            answer: '1'
            answer_contract: {"kind":"unit","quantity":"time","unit":"h","allow_omitted":true}
            solution_sketch: 'The velocity is $s''(t) = 3t^2 - 12t + 9 = 3(t - 1)(t - 3)$. It is zero at $t = 1$ and $t = 3$, but $t = 3$ is an endpoint, so only $t = 1$ hour lies in the open interval $(0, 3)$.'
          - problem: 'A wire is bent into the curve $y = x^3 - 3x$ between $x = -\sqrt{3}$ and $x = \sqrt{3}$, where the curve has the same height at both ends. At which values of $x$ between the ends is the tangent horizontal?'
            answer: '-1, 1'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The heights are $f(-\sqrt{3}) = f(\sqrt{3}) = 0$. The slope is $f''(x) = 3x^2 - 3 = 0$, so $x = -1$ or $x = 1$, and both lie in $(-\sqrt{3}, \sqrt{3})$.'
    diagnostic_exemplar:
      problem: 'Verify that $f(x) = x^3 - 9x$ satisfies the hypotheses of Rolle''s theorem on $[0, 3]$ and find the $c$ in $(0, 3)$ with $f''(c) = 0$.'
      answer: 'f is a polynomial (continuous and differentiable) with f(0) = f(3) = 0; c = √3'
      answer_contract: {kind: none}
      solution_sketch: '$f(0) = 0$ and $f(3) = 27 - 27 = 0$; $f''(x) = 3x^2 - 9 = 0$ gives $x = \sqrt{3} \approx 1.73$, which lies in $(0, 3)$.'
    anki_seeds:
      - front: "Rolle's theorem: if f is continuous on [a,b], differentiable on (a,b), and f(a) = f(b), then..."
        back: "some c in (a,b) has f'(c) = 0"
        type: basic
      - front: "Rolle's theorem needs THREE hypotheses:"
        back: "continuity on [a,b]; differentiability on (a,b); equal endpoint values f(a) = f(b)"
        type: basic

  - id: mean-value-theorem
    name: The Mean Value Theorem
    core: false                # terminal existence theorem, like the IVT
    difficulty: 0.6
    drill: false
    answer_kind: numeric
    expected_time_secs: 180
    prerequisites:
      - id: rolles-theorem
        weight: 0.7
        key: true
      - id: average-instantaneous-rate
        weight: 0.5
        key: true
      - id: continuity
        weight: 0.4
      - id: derivative-definition
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: 'Find the c guaranteed by the MVT'
        key_prerequisites: [average-instantaneous-rate, derivative-definition]
        constraints: 'polynomials, roots and 1/x; f''(c) = (f(b)-f(a))/(b-a) solvable exactly, with every c inside the open interval reported'
        try_first:
          problem: 'A car travels $90$ km in $1.5$ hours on a straight road. What is its average speed, in kilometres per hour?'
          answer_contract: {"kind":"exact"}
          answer: '60'
          reveal: 'The average speed is $90 / 1.5 = 60$ km/h. The Mean Value Theorem says that a smooth motion has an instant at which the speedometer reads exactly this average, and the lesson shows how to find that instant.'
        exemplars:
          - problem: 'Find the $c$ in $(1, 3)$ guaranteed by the Mean Value Theorem for $f(x) = x^2$ on $[1, 3]$.'
            answer: '2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The average slope is $\frac{9 - 1}{3 - 1} = 4$. The derivative is $f''(x) = 2x$, so $2c = 4$ and $c = 2$, which lies in $(1, 3)$.'
          - problem: 'Find the $c$ in $(0, 3)$ guaranteed by the Mean Value Theorem for $f(x) = x^3$ on $[0, 3]$.'
            answer: 'sqrt(3)'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The average slope is $\frac{27 - 0}{3 - 0} = 9$. The derivative is $f''(x) = 3x^2$, so $3c^2 = 9$ and $c^2 = 3$. The root $c = \sqrt{3}$ lies in $(0, 3)$ and $-\sqrt{3}$ does not.'
          - problem: 'Find the $c$ in $(1, 4)$ guaranteed by the Mean Value Theorem for $f(x) = x^2 + 2x$ on $[1, 4]$.'
            answer: '5/2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The average slope is $\frac{24 - 3}{4 - 1} = 7$. The derivative is $f''(x) = 2x + 2$, so $2c + 2 = 7$ and $c = \frac{5}{2}$, which lies in $(1, 4)$.'
          - problem: 'Find the $c$ in $(0, 2)$ guaranteed by the Mean Value Theorem for $f(x) = x^3 - 3x$ on $[0, 2]$.'
            answer: '2sqrt(3)/3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The average slope is $\frac{2 - 0}{2 - 0} = 1$. The derivative is $f''(x) = 3x^2 - 3$, so $3c^2 - 3 = 1$ and $c^2 = \frac{4}{3}$. The positive root $c = \frac{2\sqrt{3}}{3}$ lies in $(0, 2)$.'
          - problem: 'Find the $c$ in $(1, 9)$ guaranteed by the Mean Value Theorem for $f(x) = \sqrt{x}$ on $[1, 9]$.'
            answer: '4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The average slope is $\frac{3 - 1}{9 - 1} = \frac{1}{4}$. The derivative is $f''(x) = \frac{1}{2\sqrt{x}}$, so $\frac{1}{2\sqrt{c}} = \frac{1}{4}$. Then $\sqrt{c} = 2$ and $c = 4$, which lies in $(1, 9)$.'
          - problem: 'A car moves along a straight road so that its distance from the start is $s(t) = t^2 + 6t$ metres after $t$ seconds. At what time between $t = 1$ and $t = 5$ is the speed of the car equal to its average speed over those four seconds?'
            answer: '3'
            answer_contract: {"kind":"unit","quantity":"time","unit":"s","allow_omitted":true}
            solution_sketch: 'The average speed is $\frac{s(5) - s(1)}{5 - 1} = \frac{55 - 7}{4} = 12$ metres per second. The speed is $s''(t) = 2t + 6$, and $2t + 6 = 12$ gives $t = 3$ seconds, which lies between $1$ and $5$.'
          - problem: 'Find the $c$ in $(1, 4)$ guaranteed by the Mean Value Theorem for $f(x) = \frac{1}{x}$ on $[1, 4]$.'
            answer: '2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The average slope is $\frac{\frac{1}{4} - 1}{4 - 1} = -\frac{1}{4}$. The derivative is $f''(x) = -\frac{1}{x^2}$, so $c^2 = 4$. The root $c = 2$ lies in $(1, 4)$ and $c = -2$ does not.'
          - problem: 'A runner''s distance is $d(t) = 6\sqrt{t}$ metres after $t$ seconds. At what time between $t = 4$ and $t = 16$ does the runner''s speed equal the average speed over that period?'
            answer: '9'
            answer_contract: {"kind":"unit","quantity":"time","unit":"s","allow_omitted":true}
            solution_sketch: 'The average speed is $\frac{d(16) - d(4)}{16 - 4} = \frac{24 - 12}{12} = 1$ metre per second. The speed is $d''(t) = \frac{3}{\sqrt{t}}$, and $\frac{3}{\sqrt{t}} = 1$ gives $\sqrt{t} = 3$, so $t = 9$ seconds.'
          - problem: 'Find all values $c$ in $(-2, 2)$ guaranteed by the Mean Value Theorem for $f(x) = x^3 - 3x$ on $[-2, 2]$.'
            answer: '-2sqrt(3)/3, 2sqrt(3)/3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The average slope is $\frac{2 - (-2)}{2 - (-2)} = 1$. Then $3c^2 - 3 = 1$ gives $c^2 = \frac{4}{3}$. Both roots $c = \pm\frac{2\sqrt{3}}{3}$ lie in $(-2, 2)$, so there are two such values.'
          - problem: 'Sam applies the Mean Value Theorem to $f(x) = x^2$ on $[0, 6]$. He sets $f''(c) = f(6) - f(0) = 36$ and gets $c = 18$. What is the correct value of $c$?'
            answer: '3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Sam forgot to divide by the length of the interval. The average slope is $\frac{36 - 0}{6 - 0} = 6$, so $2c = 6$ and $c = 3$.'
      - id: kp2
        name: 'Check whether the MVT applies'
        key_prerequisites: [continuity, rolles-theorem]
        constraints: 'corner or discontinuity inside the interval; name the failed hypothesis'
        exemplars:
          - problem: 'The Mean Value Theorem does not apply to $f(x) = |x + 4|$ on $[-9, 1]$. At which value of $x$ does a hypothesis fail?'
            answer: '-4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The function $|x + 4|$ is continuous everywhere. At $x = -4$ the left slope is $-1$ and the right slope is $1$, so the graph has a corner and $f$ is not differentiable there. The point $-4$ lies inside $(-9, 1)$.'
          - problem: 'The Mean Value Theorem does not apply to $f(x) = \frac{1}{x + 7}$ on $[-10, 3]$. At which value of $x$ does a hypothesis fail?'
            answer: '-7'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The denominator is zero at $x = -7$, so $f$ has no value there and is not continuous there. The point $-7$ lies inside $(-10, 3)$, and no other point of the interval fails.'
          - problem: 'Let $f(x) = x$ for $x < 1$ and $f(x) = 3x - 2$ for $x \ge 1$, on the interval $[0, 3]$. Which hypothesis of the Mean Value Theorem fails for $f$ on this interval?'
            answer: 'not differentiable'
            answer_contract: {"kind":"label","options":[["not differentiable","differentiability fails","differentiability","not differentiable at an interior point","not differentiable at x = 1","differentiability fails at x = 1","it is not differentiable"],["not continuous","continuity fails","continuity","not continuous at an interior point","not continuous at x = 1"],["no hypothesis fails","both hold","the theorem applies","none"],["not continuous at an endpoint","continuity at an endpoint"]]}
            solution_sketch: 'At $x = 1$ the two pieces meet, because $1 = 3(1) - 2$, so $f$ is continuous on $[0, 3]$. The slope is $1$ on the left of $1$ and $3$ on the right, so there is a corner and $f$ is not differentiable at the interior point $x = 1$.'
          - problem: 'The Mean Value Theorem does not apply to $f(x) = x^{2/3}$ on $[-1, 8]$. At which value of $x$ does a hypothesis fail?'
            answer: '0'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The function $x^{2/3}$ is continuous on $[-1, 8]$. Its derivative $\frac{2}{3}x^{-1/3}$ is not defined at $x = 0$, so $f$ is not differentiable at $0$, and $0$ lies inside $(-1, 8)$.'
          - problem: 'The function $f(x) = \frac{x^2 - 25}{x - 5}$ is defined for every $x$ in $[0, 8]$ except one point. The Mean Value Theorem does not apply on $[0, 8]$. At which value of $x$ does a hypothesis fail?'
            answer: '5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The denominator $x - 5$ is zero at $x = 5$, so $f$ has no value there and is not continuous on $[0, 8]$. The point $5$ lies inside $(0, 8)$. The quotient equals $x + 5$ at every other point.'
          - problem: 'Let $f(x) = x^2$ for $x < 2$ and $f(x) = 5x - 4$ for $x \ge 2$, on the interval $[0, 5]$. At which value of $x$ inside the interval does a hypothesis of the Mean Value Theorem fail?'
            answer: '2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The left piece approaches $2^2 = 4$ as $x$ approaches $2$, but the right piece has the value $5(2) - 4 = 6$ at $x = 2$. The pieces do not meet, so $f$ is not continuous at $x = 2$.'
          - problem: 'Does the Mean Value Theorem apply to $f(x) = |x|$ on $[1, 4]$?'
            answer: 'yes'
            answer_contract: {"kind":"label","options":[["yes","it does","it applies","the theorem applies","yes, it applies","yes it applies","yes, it does"],["no","it does not","it does not apply","the theorem does not apply","no, it does not apply","no it does not apply","no, it does not"]]}
            solution_sketch: 'On $[1, 4]$ every $x$ is positive, so $|x| = x$ there. The function $x$ is continuous on $[1, 4]$ and differentiable on $(1, 4)$, so both hypotheses hold. The corner of $|x|$ at $x = 0$ is outside the interval.'
          - problem: 'A shipping company charges $C(w) = 5w$ dollars for a parcel of $w$ kilograms when $0 \le w \le 10$, and $C(w) = 5w + 20$ dollars when $10 < w \le 20$. The Mean Value Theorem does not apply to $C$ on $[0, 20]$. At which weight, in kilograms, does a hypothesis fail?'
            answer: '10'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'At $w = 10$ the cost is $5(10) = 50$ dollars, but just above $10$ the cost approaches $5(10) + 20 = 70$ dollars. The jump means $C$ is not continuous at $w = 10$, which lies inside $(0, 20)$.'
          - problem: 'The height of a robot arm above a table is $h(t) = |t - 4|$ centimetres after $t$ seconds, for $0 \le t \le 7$. At what time does a hypothesis of the Mean Value Theorem fail on $[0, 7]$?'
            answer: '4'
            answer_contract: {"kind":"unit","quantity":"time","unit":"s","allow_omitted":true}
            solution_sketch: 'The function $|t - 4|$ is continuous. At $t = 4$ the left slope is $-1$ and the right slope is $1$, so the arm has a corner there and $h$ is not differentiable at $t = 4$. This time lies inside $(0, 7)$.'
          - problem: 'Sam says the Mean Value Theorem applies to $f(x) = \frac{1}{x^2}$ on $[-1, 2]$ because $f$ is a smooth function. At which value of $x$ does a hypothesis fail?'
            answer: '0'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The denominator $x^2$ is zero at $x = 0$, so $f$ has no value there and is not continuous there. The point $0$ lies inside $(-1, 2)$, so the theorem does not apply. Smooth graphs can still have a gap.'
      - id: kp3
        name: 'Consequences of the MVT'
        key_prerequisites: [continuity, rolles-theorem]
        constraints: 'bounded-derivative estimates with integer data; conceptual consequence questions'
        exemplars:
          - problem: 'Suppose $f(1) = 3$ and $f''(x) \leq 2$ for all $x$. What is the largest possible value of $f(5)$?'
            answer: '11'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'By the Mean Value Theorem $f(5) - f(1) = f''(c) \cdot 4$ for some $c$. Since $f''(c) \leq 2$, the change is at most $8$. So $f(5) \leq 3 + 8 = 11$.'
          - problem: 'Suppose $f$ is differentiable for all $x$ and $f''(x) = 0$ for every $x$. If $f(1) = 7$, what is $f(11)$?'
            answer: '7'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'By the Mean Value Theorem $f(11) - f(1) = f''(c) \cdot 10$ for some $c$. Since $f''(c) = 0$, the change is $0$. So $f(11) = f(1) = 7$.'
          - problem: 'A cyclist starts at the $12$ km mark of a road and rides for $2.5$ hours. Her speed never exceeds $24$ km/h. What is the farthest mark she can reach?'
            answer: '72'
            answer_contract: {"kind":"unit","quantity":"length","unit":"km","allow_omitted":true}
            solution_sketch: 'By the Mean Value Theorem the distance covered is $v(c) \cdot 2.5$ for some instant $c$, and $v(c) \leq 24$. So she covers at most $24 \cdot 2.5 = 60$ km. The farthest mark is $12 + 60 = 72$ km.'
          - problem: 'Suppose $f(-1) = 4$ and $f''(x) \leq 5$ for every $x$. What is the largest possible value of $f(3)$?'
            answer: '24'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'By the Mean Value Theorem $f(3) - f(-1) = f''(c) \cdot 4$ for some $c$. Since $f''(c) \leq 5$, the change is at most $20$. So $f(3) \leq 4 + 20 = 24$.'
          - problem: 'Two cameras on a highway are $30$ km apart. A car passes the first at $9{:}00$ and the second at $9{:}15$. By the Mean Value Theorem, at some moment between the cameras its speed was exactly what, in kilometres per hour?'
            answer: '120'
            answer_contract: {"kind":"unit","quantity":"speed","unit":"km/h","allow_omitted":true}
            solution_sketch: 'The trip takes a quarter of an hour. The average speed is $\frac{30}{0.25} = 120$ km/h. By the Mean Value Theorem the car had the instantaneous speed $120$ km/h at some moment.'
          - problem: 'Suppose $g(0) = 10$ and $g''(x) \geq 3$ for every $x$. What is the smallest possible value of $g(4)$?'
            answer: '22'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'By the Mean Value Theorem $g(4) - g(0) = g''(c) \cdot 4$ for some $c$. Since $g''(c) \geq 3$, the change is at least $12$. So $g(4) \geq 10 + 12 = 22$.'
          - problem: 'Suppose $f$ is differentiable and $1 \leq f''(x) \leq 4$ for every $x$. What is the largest possible value of $f(7) - f(2)$?'
            answer: '20'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'By the Mean Value Theorem $f(7) - f(2) = f''(c) \cdot 5$ for some $c$. Since $f''(c) \leq 4$, the difference is at most $4 \cdot 5 = 20$.'
          - problem: 'A train covers the $150$ km between two stations in $2$ hours. By the Mean Value Theorem, at some moment its speed was exactly what, in kilometres per hour?'
            answer: '75'
            answer_contract: {"kind":"unit","quantity":"speed","unit":"km/h","allow_omitted":true}
            solution_sketch: 'The average speed is $\frac{150}{2} = 75$ km/h. The Mean Value Theorem says the instantaneous speed equals the average speed at some moment, so the speed was $75$ km/h.'
          - problem: 'Suppose $f$ and $g$ are differentiable on an interval and $f''(x) = g''(x)$ for every $x$ in that interval. What does the Mean Value Theorem tell you about $f$ and $g$ on the interval?'
            answer: 'difference is constant'
            answer_contract: {"kind":"label","options":[["difference is constant","f - g is constant","the difference is constant","they differ by a constant","f and g differ by a constant","f - g = C","f = g + C"],["functions are equal","f = g","they are equal"],["difference is zero","f - g = 0","the difference is zero"],["sum is constant","f + g is constant","the sum is constant"]]}
            solution_sketch: 'Apply the Mean Value Theorem to $h = f - g$. Then $h''(c) = f''(c) - g''(c) = 0$ for every $c$, so $h(b) = h(a)$ for all points $a$ and $b$. So $f - g$ is constant, but the constant need not be $0$.'
          - problem: 'Sam knows that $f(0) = 2$ and $f''(x) \leq 4$ for all $x$. He says $f(3) \leq 6$ because $2 + 4 = 6$. What is the correct upper bound for $f(3)$?'
            answer: '14'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Sam forgot to multiply the bound on the slope by the length of the interval. By the Mean Value Theorem $f(3) - f(0) = f''(c) \cdot 3 \leq 12$. So $f(3) \leq 2 + 12 = 14$.'
    diagnostic_exemplar:
      problem: 'Suppose $f$ is differentiable with $f(2) = 5$ and $f''(x) \leq 3$ for all $x$. Using the Mean Value Theorem, what is the largest possible value of $f(6)$?'
      answer: "17"
      solution_sketch: '$\frac{f(6) - f(2)}{6 - 2} = f''(c) \leq 3$, so $f(6) \leq 5 + 3 \cdot 4 = 17$.'
    anki_seeds:
      - front: "Mean Value Theorem: if f is continuous on [a,b] and differentiable on (a,b), then some c in (a,b) satisfies..."
        back: "f'(c) = (f(b) - f(a)) / (b - a)"
        type: basic
      - front: "Rolle's theorem is the MVT special case where..."
        back: "f(a) = f(b), so some c in (a,b) has f'(c) = 0"
        type: basic

  - id: closed-interval-method
    name: Absolute Extrema and the Closed-Interval Method
    core: true
    difficulty: 0.6
    drill: false
    answer_kind: numeric
    expected_time_secs: 180
    prerequisites:
      - id: critical-points-extrema
        weight: 0.8
        key: true
      - id: continuity
        weight: 0.5
        key: true
      - id: evaluating-functions
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: 'Absolute vs local extrema and the Extreme Value Theorem'
        key_prerequisites: [continuity, critical-points-extrema]
        constraints: 'one guarantee question, one counterexample on an open interval or with a discontinuity'
        exemplars:
          - problem: 'A function $f$ is continuous on the closed interval $[-2, 5]$. What does the Extreme Value Theorem guarantee?'
            answer: 'both a maximum and a minimum'
            answer_contract: {"kind":"label","options":[["both a maximum and a minimum","f attains an absolute maximum and an absolute minimum","an absolute maximum and an absolute minimum","both absolute extrema","a maximum and a minimum","an absolute max and an absolute min","max and min","both"],["a maximum but no minimum","an absolute maximum but no absolute minimum","only a maximum"],["f must be differentiable","differentiable inside the interval","f is differentiable on the interior"],["a critical point inside","f must have a critical point inside the interval","a critical point in the interval"]]}
            solution_sketch: 'The theorem has two hypotheses: $f$ is continuous and the interval is closed and bounded. Both hold here, so $f$ attains an absolute maximum and an absolute minimum on $[-2, 5]$. The theorem does not need differentiability, and the extremes may sit at endpoints rather than at critical points.'
          - problem: 'Does $f(x) = \frac{1}{x - 3}$ attain an absolute maximum on the closed interval $[1, 5]$?'
            answer: 'no'
            answer_contract: {"kind":"label","options":[["yes","it does","it attains one","it has one"],["no","it does not","it does not attain one","it has none"]]}
            solution_sketch: 'The interval is closed, but $f$ is not continuous at $x = 3$, where the denominator is zero. Near $x = 3$ from the right the values grow without bound, so no value is the largest. So $f$ has no absolute maximum on $[1, 5]$.'
          - problem: 'Find the value of the local maximum of $f(x) = x^3 - 12x + 3$.'
            answer: '19'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The derivative is $f''(x) = 3x^2 - 12 = 3(x - 2)(x + 2)$, so the critical points are $x = -2$ and $x = 2$. The sign of $f''$ changes from positive to negative at $x = -2$, so $f$ has a local maximum there. Its value is $f(-2) = -8 + 24 + 3 = 19$.'
          - problem: 'Find the absolute minimum value of $f(x) = x^2 + 8x + 10$.'
            answer: '-6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Complete the square: $f(x) = (x + 4)^2 - 6$. A square is never negative, so the least value of $f$ is $-6$, reached at $x = -4$.'
          - problem: 'At which point does the graph of $f(x) = x^2 - 10x + 21$ reach its lowest point?'
            answer: '(5, -4)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'Complete the square: $f(x) = (x - 5)^2 - 4$. The least value is $-4$, reached at $x = 5$, so the lowest point of the graph is $(5, -4)$.'
          - problem: 'Find the value of the local minimum of $f(x) = x^3 - 3x^2 + 1$.'
            answer: '-3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The derivative is $f''(x) = 3x^2 - 6x = 3x(x - 2)$, so the critical points are $x = 0$ and $x = 2$. The sign of $f''$ changes from negative to positive at $x = 2$, so $f$ has a local minimum there. Its value is $f(2) = 8 - 12 + 1 = -3$.'
          - problem: 'A ball is thrown upward from a height of $1$ m. Its height is $h(t) = -5t^2 + 20t + 1$ metres after $t$ seconds, until it lands. What is the greatest height the ball reaches?'
            answer: '21'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'The derivative is $h''(t) = -10t + 20$, which is zero at $t = 2$. The graph of $h$ is a parabola that opens downward, so the largest value is $h(2) = -20 + 40 + 1 = 21$ metres.'
          - problem: 'A shop''s daily profit from selling $x$ items is $P(x) = -2x^2 + 40x - 100$ dollars. What is the largest profit the shop can make in one day?'
            answer: '100'
            answer_contract: {"kind":"unit","quantity":"dollar","unit":"dollar","allow_omitted":true}
            solution_sketch: 'The derivative is $P''(x) = -4x + 40$, which is zero at $x = 10$. The graph of $P$ is a parabola that opens downward, so the largest profit is $P(10) = -200 + 400 - 100 = 100$ dollars.'
          - problem: 'Sam says the absolute minimum value of $f(x) = x^2 - 4x + 9$ is $9$, because $f(0) = 9$. What is the correct absolute minimum value?'
            answer: '5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Complete the square: $f(x) = (x - 2)^2 + 5$. The least value is $5$, reached at $x = 2$. The value $f(0) = 9$ is only one value of $f$, not the least one.'
      - id: kp2
        name: 'The closed-interval method'
        key_prerequisites: [critical-points-extrema, evaluating-functions]
        constraints: 'compare f at interior critical points and both endpoints; all values integers'
        try_first:
          problem: 'What is the greatest value of $f(x) = x^2 - 4x$ on the interval $[0, 5]$?'
          answer_contract: {"kind":"exact"}
          answer: '5'
          reveal: 'The graph dips to $-4$ at $x = 2$, but the greatest value is $f(5) = 5$ at the right endpoint. On a closed interval the extreme values can sit at the endpoints, so the method compares the endpoints with the critical points.'
        exemplars:
          - problem: 'Find the absolute maximum value of $f(x) = x^3 - 3x$ on $[0, 2]$.'
            answer: '2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The derivative $f''(x) = 3x^2 - 3$ is zero at $x = 1$ inside the interval. Compare $f(0) = 0$, $f(1) = -2$ and $f(2) = 2$. The greatest of these is $2$.'
          - problem: 'Find the absolute minimum value of $f(x) = x^2 + 6x - 1$ on $[-5, 0]$.'
            answer: '-10'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The derivative $f''(x) = 2x + 6$ is zero at $x = -3$. Compare $f(-5) = -6$, $f(-3) = -10$ and $f(0) = -1$. The least of these is $-10$.'
          - problem: 'Find the absolute maximum value of $f(x) = x^2 - 2x$ on $[0, 3]$.'
            answer: '3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The derivative $f''(x) = 2x - 2$ is zero at $x = 1$. Compare $f(0) = 0$, $f(1) = -1$ and $f(3) = 3$. The greatest of these is $3$, at the endpoint $x = 3$.'
          - problem: 'The temperature in a greenhouse is $T(t) = t^2 - 8t + 20$ degrees Celsius, $t$ hours after midnight, for $0 \le t \le 6$. What is the highest temperature in this period?'
            answer: '20'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The derivative $T''(t) = 2t - 8$ is zero at $t = 4$. Compare $T(0) = 20$, $T(4) = 4$ and $T(6) = 8$. The highest temperature is $20$ degrees, at midnight.'
          - problem: 'At which value of $x$ does $f(x) = x^2 - 4x + 1$ attain its absolute maximum on $[0, 5]$?'
            answer: '5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The derivative $f''(x) = 2x - 4$ is zero at $x = 2$. Compare $f(0) = 1$, $f(2) = -3$ and $f(5) = 6$. The greatest value $6$ occurs at $x = 5$.'
          - problem: 'At which value of $x$ does $f(x) = 2x^3 - 9x^2 + 12x$ attain its absolute minimum on $[1, 3]$?'
            answer: '2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The derivative $f''(x) = 6x^2 - 18x + 12 = 6(x - 1)(x - 2)$ is zero at $x = 1$ and $x = 2$. Compare $f(1) = 5$, $f(2) = 4$ and $f(3) = 9$. The least value $4$ occurs at $x = 2$.'
          - problem: 'The speed of a test car is $v(t) = t^3 - 6t^2 + 9t + 2$ metres per second at time $t$ seconds, for $0 \le t \le 4$. What is the greatest speed the car reaches, in metres per second?'
            answer: '6'
            answer_contract: {"kind":"unit","quantity":"speed","unit":"m/s","allow_omitted":true}
            solution_sketch: 'The derivative $v''(t) = 3t^2 - 12t + 9 = 3(t - 1)(t - 3)$ is zero at $t = 1$ and $t = 3$. Compare $v(0) = 2$, $v(1) = 6$, $v(3) = 2$ and $v(4) = 6$. The greatest speed is $6$ metres per second.'
          - problem: 'Find the absolute minimum value of $f(x) = x^2 - 10x + 21$ on $[0, 7]$.'
            answer: '-4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The derivative $f''(x) = 2x - 10$ is zero at $x = 5$. Compare $f(0) = 21$, $f(5) = -4$ and $f(7) = 0$. The least of these is $-4$.'
          - problem: 'Sam finds that $f(x) = x^2 - 6x + 4$ has $f''(3) = 0$, and says its absolute maximum on $[-1, 5]$ is $f(3) = -5$. What is the correct absolute maximum value on $[-1, 5]$?'
            answer: '11'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Sam found only the critical point, which here gives the minimum. Compare the endpoints too: $f(-1) = 11$, $f(3) = -5$ and $f(5) = -1$. The greatest value is $11$.'
      - id: kp3
        name: 'Closed-interval method with several critical points'
        key_prerequisites: [critical-points-extrema, evaluating-functions]
        constraints: 'two or three interior critical points; ties allowed; integer values'
        exemplars:
          - problem: 'Find the absolute maximum value of $f(x) = x^4 - 2x^2$ on $[-2, 1]$.'
            answer: '8'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The derivative $f''(x) = 4x^3 - 4x = 4x(x - 1)(x + 1)$ is zero at $x = -1$, $0$ and $1$. Compare $f(-2) = 8$, $f(-1) = -1$, $f(0) = 0$ and $f(1) = -1$. The greatest of these is $8$.'
          - problem: 'At which values of $x$ does $f(x) = x^3 - 6x^2 + 9x$ attain its absolute maximum on $[0, 4]$?'
            answer: '1, 4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The derivative $f''(x) = 3x^2 - 12x + 9 = 3(x - 1)(x - 3)$ is zero at $x = 1$ and $x = 3$. Compare $f(0) = 0$, $f(1) = 4$, $f(3) = 0$ and $f(4) = 4$. The greatest value $4$ occurs at both $x = 1$ and $x = 4$.'
          - problem: 'Find the absolute minimum value of $f(x) = 3x^4 - 4x^3 - 12x^2$ on $[-2, 3]$.'
            answer: '-32'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The derivative $f''(x) = 12x(x - 2)(x + 1)$ is zero at $x = -1$, $0$ and $2$. Compare $f(-2) = 32$, $f(-1) = -5$, $f(0) = 0$, $f(2) = -32$ and $f(3) = 27$. The least of these is $-32$.'
          - problem: 'A roller coaster track has height $h(x) = x^3 - 9x^2 + 24x$ metres at horizontal distance $x$ hundred metres from the start, for $0 \le x \le 6$. What is the greatest height of the track?'
            answer: '36'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'The derivative $h''(x) = 3x^2 - 18x + 24 = 3(x - 2)(x - 4)$ is zero at $x = 2$ and $x = 4$. Compare $h(0) = 0$, $h(2) = 20$, $h(4) = 16$ and $h(6) = 36$. The greatest height is $36$ metres, at the end of the track.'
          - problem: 'The price of a share over the next $3$ months is modelled by $P(t) = t^4 - 8t^2 + 20$ dollars, for $0 \le t \le 3$. What is the lowest price in this period?'
            answer: '4'
            answer_contract: {"kind":"unit","quantity":"dollar","unit":"dollar","allow_omitted":true}
            solution_sketch: 'The derivative $P''(t) = 4t^3 - 16t = 4t(t - 2)(t + 2)$ is zero at $t = 0$ and $t = 2$ inside the interval. Compare $P(0) = 20$, $P(2) = 4$ and $P(3) = 29$. The lowest price is $4$ dollars.'
          - problem: 'Find the absolute maximum value of $f(x) = x^3 - 3x^2 - 9x + 2$ on $[-2, 6]$.'
            answer: '56'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The derivative $f''(x) = 3x^2 - 6x - 9 = 3(x - 3)(x + 1)$ is zero at $x = -1$ and $x = 3$. Compare $f(-2) = 0$, $f(-1) = 7$, $f(3) = -25$ and $f(6) = 56$. The greatest of these is $56$.'
          - problem: 'At which values of $x$ does $f(x) = x^4 - 2x^2$ attain its absolute minimum on $[-2, 1]$?'
            answer: '-1, 1'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The critical points are $x = -1$, $0$ and $1$. Compare $f(-2) = 8$, $f(-1) = -1$, $f(0) = 0$ and $f(1) = -1$. The least value $-1$ occurs at both $x = -1$ and $x = 1$.'
          - problem: 'Find the absolute maximum value of $f(x) = 3x^4 - 4x^3 - 12x^2$ on $[-2, 3]$.'
            answer: '32'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The critical points are $x = -1$, $0$ and $2$. Compare $f(-2) = 32$, $f(-1) = -5$, $f(0) = 0$, $f(2) = -32$ and $f(3) = 27$. The greatest of these is $32$, at the endpoint $x = -2$.'
          - problem: 'Sam compares only the endpoint values $f(-3) = 9$ and $f(3) = -9$ and says the absolute maximum of $f(x) = x^3 - 12x$ on $[-3, 3]$ is $9$. What is the correct absolute maximum value?'
            answer: '16'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Sam skipped the critical points. The derivative $f''(x) = 3x^2 - 12$ is zero at $x = -2$ and $x = 2$, and $f(-2) = 16$ is larger than $9$. Compare $f(-3) = 9$, $f(-2) = 16$, $f(2) = -16$ and $f(3) = -9$. The greatest value is $16$.'
          - problem: 'At which value of $x$ does $f(x) = x^3 - 12x$ attain its absolute maximum on $[-3, 3]$?'
            answer: '-2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The derivative $f''(x) = 3x^2 - 12$ is zero at $x = -2$ and $x = 2$. Compare $f(-3) = 9$, $f(-2) = 16$, $f(2) = -16$ and $f(3) = -9$. The greatest value $16$ occurs at $x = -2$.'
          - problem: 'Find the absolute minimum value of $f(x) = x^4 - 2x^2$ on $[-2, 1]$.'
            answer: '-1'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The derivative $f''(x) = 4x(x - 1)(x + 1)$ is zero at $x = -1$, $0$ and $1$. Compare $f(-2) = 8$, $f(-1) = -1$, $f(0) = 0$ and $f(1) = -1$. The least value is $-1$, reached at $x = -1$ and at $x = 1$.'
    diagnostic_exemplar:
      problem: 'Find the absolute maximum and minimum of $f(x) = x^4 - 8x^2$ on $[-1, 3]$.'
      answer: 'absolute max 9 at x = 3; absolute min -16 at x = 2'
      answer_contract: {kind: none}
      solution_sketch: '$f''(x) = 4x(x^2 - 4)$ gives interior critical points $x = 0$ and $x = 2$ (note $x = -2$ is outside the interval); compare $f(-1) = -7$, $f(0) = 0$, $f(2) = -16$, $f(3) = 9$.'
    anki_seeds:
      - front: "To find absolute extrema of a continuous f on [a, b], compare f at..."
        back: "all interior critical points and the two endpoints"
        type: basic
      - front: "Extreme Value Theorem: a continuous function on a CLOSED interval..."
        back: "attains both an absolute max and an absolute min there"
        type: basic

