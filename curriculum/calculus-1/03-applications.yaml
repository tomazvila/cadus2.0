            answer: "increasing on (-∞, -1) and (1, ∞); decreasing on (-1, 1)"
            answer_contract: {kind: none}
            solution_sketch: '$f''(x) = 3(x-1)(x+1)$: positive outside $[-1, 1]$, negative inside.'
          - problem: 'Find where $f(x) = x^2 - 6x$ is decreasing.'
            answer: "(-∞, 3)"
            answer_contract: {kind: none}
            solution_sketch: "(-∞, 3)"
        constraints: "derivative factors over the integers; report open intervals"
      - id: kp2
        name: The first derivative test
        key_prerequisites: [critical-points-extrema]
        exemplars:
          - problem: 'Use the first derivative test to classify the critical points of $f(x) = x^3 - 6x^2 + 9x$ and give the function values there.'
            answer: "local max f(1) = 4; local min f(3) = 0"
            answer_contract: {kind: none}
            solution_sketch: '$f'' = 3(x-1)(x-3)$ is $+, -, +$, so max at $1$ and min at $3$; $f(1) = 4$, $f(3) = 0$.'
          - problem: '$f''(x) = x^2(x - 2)$. Does $f$ have a local extremum at $x = 0$?'
            answer: "no — f' does not change sign at 0 (negative on both sides)"
            answer_contract: {kind: none}
            solution_sketch: "no — f' does not change sign at 0 (negative on both sides)"
        constraints: "include one no-sign-change trap; function values are integers"
      - id: kp3
        name: Monotonicity with products and exponentials
        key_prerequisites: [product-quotient-rules, derivatives-exp-log]
        exemplars:
          - problem: 'Find the intervals of increase and decrease of $f(x) = x e^{-x}$.'
            answer: "increasing on (-∞, 1); decreasing on (1, ∞)"
            answer_contract: {kind: none}
            solution_sketch: '$f''(x) = e^{-x}(1 - x)$; $e^{-x} > 0$ always, so the sign is the sign of $1 - x$.'
          - problem: 'Where does $f(x) = x e^{-x}$ attain its local maximum, and what is the value?'
            answer: "x = 1; f(1) = 1/e"
            answer_contract: {kind: none}
            solution_sketch: "x = 1; f(1) = 1/e"
        constraints: "the exponential factor is always positive — sign comes from the polynomial factor"
    diagnostic_exemplar:
      problem: 'Find the intervals of increase and decrease of $f(x) = x^2 e^{-x}$.'
      answer: "increasing on (0, 2); decreasing on (-∞, 0) and (2, ∞)"
      answer_contract: {kind: none}
      solution_sketch: '$f''(x) = e^{-x}(2x - x^2) = e^{-x} x(2 - x)$, positive exactly for $0 < x < 2$.'
