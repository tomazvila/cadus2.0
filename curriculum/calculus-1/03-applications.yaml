            answer: "x = 2 cm; volume 128 cm³"
            answer_contract: {kind: none}
            solution_sketch: '$V = x(12 - 2x)^2$; $V'' = (12-2x)(12-6x) = 0$ at $x = 2$ or $x = 6$ (degenerate); $V(2) = 2 \cdot 64 = 128$.'
          - problem: 'An open-top box has a square base and volume $32$ m³. Find the dimensions minimizing the material $S = x^2 + 4xh$.'
            answer: "base 4 m × 4 m, height 2 m"
            answer_contract: {kind: none}
            solution_sketch: '$h = \frac{32}{x^2}$, so $S = x^2 + \frac{128}{x}$; $S'' = 2x - \frac{128}{x^2} = 0$ at $x^3 = 64$.'
        constraints: "state the volume/surface formulas in the problem; optimum at small integers"
      - id: kp2
        name: Cost and material problems
        key_prerequisites: [basic-optimization, volume-prisms-cylinders]
        exemplars:
          - problem: 'A rectangular field of area $800$ m² borders a straight river, so only three sides need fencing. Find the dimensions minimizing the total fence, and the minimum length.'
            answer: "20 m (each side perpendicular to the river) × 40 m (parallel side); 80 m of fence"
            answer_contract: {kind: none}
            solution_sketch: '$F = 2x + \frac{800}{x}$; $F'' = 2 - \frac{800}{x^2} = 0$ at $x = 20$, parallel side $\frac{800}{20} = 40$.'
          - problem: 'A closed cylindrical can must hold $250\pi$ cm³. Using $S = 2\pi r^2 + 2\pi r h$, find the radius and height minimizing the surface area.'
            answer: "r = 5 cm, h = 10 cm"
            answer_contract: {kind: none}
            solution_sketch: '$h = \frac{250}{r^2}$, so $S = 2\pi r^2 + \frac{500\pi}{r}$; $S'' = 4\pi r - \frac{500\pi}{r^2} = 0$ at $r^3 = 125$.'
        constraints: "area/volume constraint plus linear-or-quadratic objective; integer optimum"
      - id: kp3
        name: Distance problems
        key_prerequisites: [basic-optimization, distance-midpoint-formulas]
        exemplars:
          - problem: 'Find the point on the curve $y = \sqrt{x}$ closest to $(3, 0)$.'
            answer: "(5/2, √(5/2)) = (5/2, √10/2)"
            answer_contract: {kind: none}
            solution_sketch: 'Minimize $d^2 = (x - 3)^2 + x$; derivative $2(x - 3) + 1 = 0$ gives $x = \frac{5}{2}$.'
          - problem: 'For the previous problem, what is the minimum distance itself?'
            answer: "√11/2"
            solution_sketch: '$d^2 = \left(-\frac{1}{2}\right)^2 + \frac{5}{2} = \frac{11}{4}$.'
        constraints: "minimize d² instead of d; squared distance is a polynomial in one variable"
    diagnostic_exemplar:
      problem: 'Find the point on the curve $y = \sqrt{x}$ closest to $(4, 0)$.'
      answer: '(7/2, √14/2)'
      solution_sketch: 'Minimize the squared distance $d^2 = (x-4)^2 + x = x^2 - 7x + 16$: $2x - 7 = 0$ gives $x = \frac{7}{2}$, and $y = \sqrt{7/2} = \frac{\sqrt{14}}{2}$.'
    anki_seeds:
      - front: "In distance-minimization problems, minimize ___ instead of the distance itself."
        back: "the squared distance d² — same minimizer, no square roots to differentiate"
        type: basic
      - front: "Constrained optimization: the constraint's job is to..."
        back: "eliminate one variable so the objective becomes a one-variable function"
        type: basic

  - id: marginal-analysis
    name: Marginal Cost and Revenue
    core: false                # named economics application of the derivative
    difficulty: 0.55
    drill: false
    answer_kind: numeric
    expected_time_secs: 150
    prerequisites:
      - id: derivative-power-rule
        weight: 0.7
        key: true
      - id: average-instantaneous-rate
        weight: 0.5
        key: true
      - id: evaluating-polynomials
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: Marginal cost and revenue as derivatives
        key_prerequisites: [derivative-power-rule]
        exemplars:
          - problem: 'The cost of producing $x$ items is $C(x) = \frac{x^2}{10} + 40x + 1000$ euros. Find the marginal cost at $x = 50$.'
            answer: "€50 per item"
            answer_contract: {kind: none}
            solution_sketch: '$C''(x) = \frac{x}{5} + 40$; $C''(50) = 10 + 40 = 50$.'
          - problem: 'Revenue is $R(x) = 500x - \frac{x^2}{2}$. Find the marginal revenue at $x = 200$.'
            answer: "€300 per item"
            answer_contract: {kind: none}
            solution_sketch: '$R''(x) = 500 - x$; $R''(200) = 300$.'
        constraints: "quadratic cost/revenue with integer marginal values; state units"
      - id: kp2
        name: Marginal value vs actual change
        key_prerequisites: [derivative-power-rule, average-instantaneous-rate]
        exemplars:
          - problem: 'For $C(x) = \frac{x^2}{10} + 40x + 1000$, compare the marginal cost $C''(50)$ with the actual cost of the 51st item, $C(51) - C(50)$.'
            answer: "C'(50) = 50; C(51) - C(50) = 50.1 — the marginal cost approximates the next item's cost"
            answer_contract: {kind: none}
            solution_sketch: '$C(51) - C(50) = \frac{2601 - 2500}{10} + 40 = 10.1 + 40 = 50.1$.'
          - problem: 'Why is $C''(x)$ a good estimate of the cost of item $x + 1$?'
            answer: "it is the linearization estimate: C(x+1) - C(x) ≈ C'(x)·1"
            answer_contract: {kind: none}
            solution_sketch: "it is the linearization estimate: C(x+1) - C(x) ≈ C'(x)·1"
        constraints: "actual and marginal values differ by a small terminating decimal"
      - id: kp3
        name: Maximize profit with marginals
        key_prerequisites: [derivative-power-rule, evaluating-polynomials]
        exemplars:
          - problem: 'Revenue is $R(x) = 200x$ and cost is $C(x) = x^2 + 40x + 1000$, both in euros. How many items maximize the profit $P = R - C$, and what is the maximum profit?'
            answer: "x = 80 items; profit €5400"
            answer_contract: {kind: none}
            solution_sketch: '$P(x) = -x^2 + 160x - 1000$; $P''(x) = -2x + 160 = 0$ at $x = 80$; $P(80) = 5400$.'
          - problem: 'At the profit-maximizing quantity, how are marginal revenue and marginal cost related?'
            answer: "they are equal: R'(x) = C'(x)"
            answer_contract: {kind: none}
            solution_sketch: "they are equal: R'(x) = C'(x)"
        constraints: "quadratic profit with integer vertex; P'' < 0 so the critical point is the max"
    diagnostic_exemplar:
      problem: 'Revenue is $R(x) = 120x$ and cost is $C(x) = x^2 + 20x + 800$, both in euros. How many items maximize the profit $P = R - C$, and what is the maximum profit?'
      answer: "x = 50 items; maximum profit €1700"
      answer_contract: {kind: none}
      solution_sketch: '$P(x) = -x^2 + 100x - 800$; $P''(x) = -2x + 100 = 0$ at $x = 50$; $P(50) = 1700$.'
    anki_seeds:
      - front: "Marginal cost is defined as..."
        back: "C'(x) — the derivative of cost, approximating the cost of the next item"
        type: basic
      - front: "Profit is maximized (interior optimum) when marginal revenue ___ marginal cost."
        back: "equals — P' = R' - C' = 0"
        type: basic

