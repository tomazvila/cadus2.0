        key_prerequisites: [increasing-decreasing-intervals, concavity-inflection-points]
        exemplars:
          - problem: 'For $f(x) = x^3 - 3x$, find all intervals of increase/decrease, local extrema, intervals of concavity, and inflection points.'
            answer: "increasing on (-∞, -1) and (1, ∞), decreasing on (-1, 1); local max f(-1) = 2, local min f(1) = -2; concave down on (-∞, 0), concave up on (0, ∞); inflection at (0, 0)"
            solution_sketch: '$f'' = 3(x-1)(x+1)$ and $f'''' = 6x$; assemble the sign charts.'
          - problem: 'For $f(x) = x^3 - 6x^2$, find the local extrema and the inflection point.'
            answer: "local max f(0) = 0; local min f(4) = -32; inflection at (2, -16)"
            solution_sketch: '$f'' = 3x(x - 4)$, $f'''' = 6x - 12$.'
        constraints: "cubics with integer critical points and inflection points; report every feature"
      - id: kp2
        name: Full feature analysis of a quartic
        key_prerequisites: [increasing-decreasing-intervals, concavity-inflection-points, second-derivative-test]
        exemplars:
          - problem: 'For $f(x) = x^4 - 6x^2$, find the local extrema and inflection points.'
            answer: "local min f(±√3) = -9 at x = ±√3; local max f(0) = 0; inflection points at x = ±1 (value -5)"
            solution_sketch: '$f'' = 4x(x^2 - 3)$, $f'''' = 12x^2 - 12$; the sign of $f''$ is $-, +, -, +$.'
          - problem: 'For $f(x) = x^4 - 2x^2$, how many local extrema and how many inflection points does it have?'
            answer: "3 local extrema (min at ±1, max at 0); 2 inflection points (x = ±1/√3)"
        constraints: "even quartics with symmetric features; radical critical points allowed"
      - id: kp3
        name: Reconstruct features from f'
        key_prerequisites: [increasing-decreasing-intervals, second-derivative-test]
        exemplars:
          - problem: 'Suppose $f''(x) = (x-1)^2(x-3)$. Find where $f$ has local extrema.'
            answer: "local min at x = 3 only (f' does not change sign at x = 1)"
            solution_sketch: '$(x-1)^2 \geq 0$, so the sign of $f''$ is the sign of $x - 3$: no change at $1$, $-$ to $+$ at $3$.'
          - problem: 'Suppose $f''(x) = x(x - 2)$. On what interval is $f$ decreasing, and where are its inflection points?'
            answer: "decreasing on (0, 2); inflection of f at x = 1 (where f'' = 2x - 2 changes sign)"
        constraints: "give f' in factored form; ask for features of f, not of f'"
    diagnostic_exemplar:
      problem: 'For $f(x) = x^3 - 12x$, give the local extrema and the inflection point.'
      answer: "local max f(-2) = 16; local min f(2) = -16; inflection at (0, 0)"
      solution_sketch: '$f'' = 3(x-2)(x+2)$, $f'''' = 6x$.'
    anki_seeds:
      - front: "Complete curve-analysis checklist (from f' and f''):"
        back: "critical points; increase/decrease intervals; local extrema; concavity intervals; inflection points"
        type: basic
      - front: "A repeated (even-power) factor in f' at x = c means..."
        back: "f' does not change sign at c — no local extremum there"
        type: basic

  - id: basic-optimization
    name: Basic Optimization
    core: true
    difficulty: 0.65
    drill: false
    answer_kind: multi-step
    expected_time_secs: 240
    prerequisites:
      - id: closed-interval-method
        weight: 0.6
        key: true
      - id: critical-points-extrema
        weight: 0.7
        key: true
      - id: area-triangles-quadrilaterals
        weight: 0.4
        key: true
    knowledge_points:
      - id: kp1
        name: Optimize over two numbers with a constraint
        key_prerequisites: [critical-points-extrema]
        exemplars:
          - problem: 'Two positive numbers sum to $20$. Find the pair with the largest product.'
            answer: "10 and 10 (product 100)"
            solution_sketch: 'Maximize $P(x) = x(20 - x)$: $P''(x) = 20 - 2x = 0$ at $x = 10$.'
          - problem: 'Two positive numbers have product $100$. Find the pair with the smallest sum.'
            answer: "10 and 10 (sum 20)"
            solution_sketch: 'Minimize $S(x) = x + \frac{100}{x}$: $S''(x) = 1 - \frac{100}{x^2} = 0$ at $x = 10$.'
        constraints: "constraint eliminates one variable; optimum at integer values"
      - id: kp2
        name: Fencing and area problems
        key_prerequisites: [critical-points-extrema, area-triangles-quadrilaterals]
        exemplars:
          - problem: 'A farmer has $400$ m of fence for a rectangular field. What dimensions maximize the area, and what is that area?'
            answer: "100 m × 100 m; area 10000 m²"
            solution_sketch: '$A(x) = x(200 - x)$; $A''(x) = 200 - 2x = 0$ at $x = 100$.'
          - problem: 'A rectangular pen uses a barn as one side, with $120$ m of fence for the other three sides. What dimensions maximize the area?'
            answer: "30 m (each side perpendicular to the barn) × 60 m (parallel side); area 1800 m²"
            solution_sketch: '$A(x) = x(120 - 2x)$; $A''(x) = 120 - 4x = 0$ at $x = 30$, so the parallel side is $60$.'
        constraints: "perimeter-style constraint linear in the dimensions; integer optimum"
      - id: kp3
        name: Confirm the optimum
        key_prerequisites: [closed-interval-method, critical-points-extrema]
        exemplars:
          - problem: 'In the sum-20 problem, $P(x) = x(20 - x)$ on $[0, 20]$ has critical point $x = 10$. Confirm $x = 10$ gives the absolute maximum.'
            answer: "P(0) = P(20) = 0 while P(10) = 100 (or: P''(x) = -2 < 0 everywhere)"
            solution_sketch: 'Closed-interval check or the second derivative — both confirm the interior critical point is the max.'
          - problem: 'For $S(x) = x + \frac{100}{x}$ on $(0, \infty)$, confirm that $x = 10$ gives the absolute minimum.'
            answer: "S''(x) = 200/x³ > 0 for all x > 0, so S is concave up and x = 10 is the global min"
        constraints: "justify via endpoint comparison or second-derivative sign; no unjustified answers"
    diagnostic_exemplar:
      problem: 'A rectangular pen uses a wall as one side, with $60$ m of fence for the other three sides. What dimensions maximize the area, and what is that area?'
      answer: "15 m (each side perpendicular to the wall) × 30 m (parallel side); area 450 m²"
      solution_sketch: '$2x + y = 60$; $A = x(60 - 2x)$; $A'' = 60 - 4x = 0$ at $x = 15$, $y = 30$.'
    anki_seeds:
      - front: "Optimization procedure in four steps:"
        back: "name the variables and constraint; write the objective in one variable; find critical points; check them (and endpoints) for the true optimum"
        type: basic
      - front: "A rectangle of fixed perimeter has maximum area when it is..."
        back: "a square"
        type: basic

  - id: optimization
    name: Optimization
    core: false                # applied word-problem genre; basic-optimization stays core
    difficulty: 0.7
    drill: false
    answer_kind: multi-step
    expected_time_secs: 300
    prerequisites:
      - id: basic-optimization
        weight: 0.8
        key: true
      - id: volume-prisms-cylinders
        weight: 0.4
        key: true
      - id: second-derivative-test
        weight: 0.4
      - id: distance-midpoint-formulas
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: Volume and surface-area problems
        key_prerequisites: [basic-optimization, volume-prisms-cylinders]
        exemplars:
          - problem: 'An open-top box is made from a $12 \times 12$ cm sheet by cutting equal squares of side $x$ from the corners and folding. Find the $x$ that maximizes the volume, and the volume.'
            answer: "x = 2 cm; volume 128 cm³"
            solution_sketch: '$V = x(12 - 2x)^2$; $V'' = (12-2x)(12-6x) = 0$ at $x = 2$ or $x = 6$ (degenerate); $V(2) = 2 \cdot 64 = 128$.'
          - problem: 'An open-top box has a square base and volume $32$ m³. Find the dimensions minimizing the material $S = x^2 + 4xh$.'
            answer: "base 4 m × 4 m, height 2 m"
            solution_sketch: '$h = \frac{32}{x^2}$, so $S = x^2 + \frac{128}{x}$; $S'' = 2x - \frac{128}{x^2} = 0$ at $x^3 = 64$.'
        constraints: "state the volume/surface formulas in the problem; optimum at small integers"
      - id: kp2
        name: Cost and material problems
        key_prerequisites: [basic-optimization, volume-prisms-cylinders]
        exemplars:
          - problem: 'A rectangular field of area $800$ m² borders a straight river, so only three sides need fencing. Find the dimensions minimizing the total fence, and the minimum length.'
            answer: "20 m (each side perpendicular to the river) × 40 m (parallel side); 80 m of fence"
            solution_sketch: '$F = 2x + \frac{800}{x}$; $F'' = 2 - \frac{800}{x^2} = 0$ at $x = 20$, parallel side $\frac{800}{20} = 40$.'
          - problem: 'A closed cylindrical can must hold $250\pi$ cm³. Using $S = 2\pi r^2 + 2\pi r h$, find the radius and height minimizing the surface area.'
            answer: "r = 5 cm, h = 10 cm"
            solution_sketch: '$h = \frac{250}{r^2}$, so $S = 2\pi r^2 + \frac{500\pi}{r}$; $S'' = 4\pi r - \frac{500\pi}{r^2} = 0$ at $r^3 = 125$.'
        constraints: "area/volume constraint plus linear-or-quadratic objective; integer optimum"
      - id: kp3
        name: Distance problems
        key_prerequisites: [basic-optimization, distance-midpoint-formulas]
        exemplars:
          - problem: 'Find the point on the curve $y = \sqrt{x}$ closest to $(3, 0)$.'
            answer: "(5/2, √(5/2)) = (5/2, √10/2)"
            solution_sketch: 'Minimize $d^2 = (x - 3)^2 + x$; derivative $2(x - 3) + 1 = 0$ gives $x = \frac{5}{2}$.'
          - problem: 'For the previous problem, what is the minimum distance itself?'
            answer: "√11/2"
            solution_sketch: '$d^2 = \left(-\frac{1}{2}\right)^2 + \frac{5}{2} = \frac{11}{4}$.'
        constraints: "minimize d² instead of d; squared distance is a polynomial in one variable"
    diagnostic_exemplar:
      problem: 'Find the point on the curve $y = \sqrt{x}$ closest to $(4, 0)$.'
      answer: '(7/2, √14/2)'
      solution_sketch: 'Minimize the squared distance $d^2 = (x-4)^2 + x = x^2 - 7x + 16$: $2x - 7 = 0$ gives $x = \frac{7}{2}$, and $y = \sqrt{7/2} = \frac{\sqrt{14}}{2}$.'
    anki_seeds:
      - front: "In distance-minimization problems, minimize ___ instead of the distance itself."
        back: "the squared distance d² — same minimizer, no square roots to differentiate"
        type: basic
      - front: "Constrained optimization: the constraint's job is to..."
        back: "eliminate one variable so the objective becomes a one-variable function"
        type: basic

  - id: marginal-analysis
    name: Marginal Cost and Revenue
    core: false                # named economics application of the derivative
    difficulty: 0.55
    drill: false
    answer_kind: multi-step
    expected_time_secs: 150
    prerequisites:
      - id: derivative-power-rule
        weight: 0.7
        key: true
      - id: average-instantaneous-rate
        weight: 0.5
        key: true
      - id: evaluating-polynomials
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: Marginal cost and revenue as derivatives
        key_prerequisites: [derivative-power-rule]
        exemplars:
          - problem: 'The cost of producing $x$ items is $C(x) = \frac{x^2}{10} + 40x + 1000$ euros. Find the marginal cost at $x = 50$.'
            answer: "€50 per item"
            solution_sketch: '$C''(x) = \frac{x}{5} + 40$; $C''(50) = 10 + 40 = 50$.'
          - problem: 'Revenue is $R(x) = 500x - \frac{x^2}{2}$. Find the marginal revenue at $x = 200$.'
            answer: "€300 per item"
            solution_sketch: '$R''(x) = 500 - x$; $R''(200) = 300$.'
        constraints: "quadratic cost/revenue with integer marginal values; state units"
      - id: kp2
        name: Marginal value vs actual change
        key_prerequisites: [derivative-power-rule, average-instantaneous-rate]
        exemplars:
          - problem: 'For $C(x) = \frac{x^2}{10} + 40x + 1000$, compare the marginal cost $C''(50)$ with the actual cost of the 51st item, $C(51) - C(50)$.'
            answer: "C'(50) = 50; C(51) - C(50) = 50.1 — the marginal cost approximates the next item's cost"
            solution_sketch: '$C(51) - C(50) = \frac{2601 - 2500}{10} + 40 = 10.1 + 40 = 50.1$.'
          - problem: 'Why is $C''(x)$ a good estimate of the cost of item $x + 1$?'
            answer: "it is the linearization estimate: C(x+1) - C(x) ≈ C'(x)·1"
        constraints: "actual and marginal values differ by a small terminating decimal"
      - id: kp3
        name: Maximize profit with marginals
        key_prerequisites: [derivative-power-rule, evaluating-polynomials]
        exemplars:
          - problem: 'Revenue is $R(x) = 200x$ and cost is $C(x) = x^2 + 40x + 1000$, both in euros. How many items maximize the profit $P = R - C$, and what is the maximum profit?'
            answer: "x = 80 items; profit €5400"
            solution_sketch: '$P(x) = -x^2 + 160x - 1000$; $P''(x) = -2x + 160 = 0$ at $x = 80$; $P(80) = 5400$.'
          - problem: 'At the profit-maximizing quantity, how are marginal revenue and marginal cost related?'
            answer: "they are equal: R'(x) = C'(x)"
        constraints: "quadratic profit with integer vertex; P'' < 0 so the critical point is the max"
    diagnostic_exemplar:
      problem: 'Revenue is $R(x) = 120x$ and cost is $C(x) = x^2 + 20x + 800$, both in euros. How many items maximize the profit $P = R - C$, and what is the maximum profit?'
      answer: "x = 50 items; maximum profit €1700"
      solution_sketch: '$P(x) = -x^2 + 100x - 800$; $P''(x) = -2x + 100 = 0$ at $x = 50$; $P(50) = 1700$.'
    anki_seeds:
      - front: "Marginal cost is defined as..."
        back: "C'(x) — the derivative of cost, approximating the cost of the next item"
        type: basic
      - front: "Profit is maximized (interior optimum) when marginal revenue ___ marginal cost."
        back: "equals — P' = R' - C' = 0"
        type: basic

  - id: lhopitals-rule
    name: 'L''Hôpital''s Rule'
    core: true
    difficulty: 0.65
    drill: false
    answer_kind: numeric
    expected_time_secs: 150
    prerequisites:
      - id: derivatives-exp-log
        weight: 0.6
        key: true
      - id: derivatives-trig
        weight: 0.5
        key: true
      - id: one-sided-infinite-limits
        weight: 0.5
        key: true
      - id: limits-algebraic
        weight: 0.4
      - id: graphs-of-logarithmic-functions
        weight: 0.0            # conceptual only: ln x → -∞ as x → 0+ and ln x → ∞ underlie the ∞/∞ and 0·∞ forms; untaught elsewhere in this closure (re-audit R-04)
    knowledge_points:
      - id: kp1
        name: 0/0 forms
        key_prerequisites: [derivatives-trig, derivatives-exp-log]
        exemplars:
          - problem: 'Evaluate $\lim_{x \to 0} \frac{\sin x}{x}$ using L''Hôpital''s rule.'
            answer: "1"
            solution_sketch: '$\frac{0}{0}$ form; differentiate: $\frac{\cos x}{1} \to \cos 0 = 1$.'
          - problem: 'Evaluate $\lim_{x \to 0} \frac{e^x - 1}{x}$.'
            answer: "1"
          - problem: 'Evaluate $\lim_{x \to 0} \frac{e^x - 1 - x}{x^2}$.'
            answer: "1/2"
            solution_sketch: '$\frac{0}{0}$ form; apply twice: $\frac{e^x - 1}{2x} \to \frac{e^x}{2} \to \frac{1}{2}$.'
        constraints: "verify the 0/0 form before differentiating; at most two applications"
      - id: kp2
        name: ∞/∞ forms
        key_prerequisites: [one-sided-infinite-limits, derivatives-exp-log]
        exemplars:
          - problem: 'Evaluate $\lim_{x \to \infty} \frac{\ln x}{x}$.'
            answer: "0"
            solution_sketch: '$\frac{\infty}{\infty}$ form; $\frac{1/x}{1} \to 0$.'
          - problem: 'Evaluate $\lim_{x \to \infty} \frac{x^2}{e^x}$.'
            answer: "0"
            solution_sketch: 'Apply twice: $\frac{2x}{e^x} \to \frac{2}{e^x} \to 0$.'
        constraints: "growth-hierarchy results (log ≪ polynomial ≪ exponential); limits are 0 or ∞"
      - id: kp3
        name: Check the form first; rewrite 0·∞
        key_prerequisites: [one-sided-infinite-limits, limits-algebraic]
        exemplars:
          - problem: 'Evaluate $\lim_{x \to 0} \frac{x + 1}{x + 2}$ (first check whether L''Hôpital''s rule even applies).'
            answer: "1/2"
            solution_sketch: 'Substitution gives $\frac{1}{2}$ — not an indeterminate form, so L''Hôpital does NOT apply; applying it anyway would wrongly give $1$.'
          - problem: 'Evaluate $\lim_{x \to 0^+} x \ln x$.'
            answer: "0"
            solution_sketch: 'Rewrite the $0 \cdot (-\infty)$ form as $\frac{\ln x}{1/x}$; L''Hôpital gives $\frac{1/x}{-1/x^2} = -x \to 0$.'
        constraints: "one trap problem (non-indeterminate form) and one 0·∞ rewrite"
    diagnostic_exemplar:
      problem: 'Evaluate $\lim_{x \to 0^+} x^2 \ln x$.'
      answer: "0"
      solution_sketch: 'Rewrite $0 \cdot \infty$ as $\frac{\ln x}{x^{-2}}$; L''Hôpital gives $\frac{1/x}{-2x^{-3}} = -\frac{x^2}{2} \to 0$.'
    anki_seeds:
      - front: "L'Hôpital's rule applies only to which indeterminate forms (directly)?"
        back: "0/0 and ∞/∞ — always verify the form before differentiating"
        type: basic
      - front: "Growth hierarchy as x → ∞: ln x vs x^n vs e^x?"
        back: "ln x ≪ x^n ≪ e^x (each is eventually negligible next to the one after)"
        type: basic

  - id: indeterminate-forms-powers
    name: Indeterminate Differences and Powers
    core: false                # special-case extension of l'Hopital's rule
    difficulty: 0.7
    drill: false
    answer_kind: numeric
    expected_time_secs: 240
    prerequisites:
      - id: lhopitals-rule
        weight: 0.8
        key: true
      - id: derivatives-exp-log
        weight: 0.5
        key: true
      - id: logarithm-properties
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: ∞ - ∞ and 0·∞ rewrites
        key_prerequisites: [lhopitals-rule]
        exemplars:
          - problem: 'Evaluate $\lim_{x \to \infty} \left(\sqrt{x^2 + x} - x\right)$.'
            answer: "1/2"
            solution_sketch: 'Multiply by the conjugate: $\frac{x}{\sqrt{x^2 + x} + x} = \frac{1}{\sqrt{1 + 1/x} + 1} \to \frac{1}{2}$.'
          - problem: 'Evaluate $\lim_{x \to \infty} x\left(e^{1/x} - 1\right)$.'
            answer: "1"
            solution_sketch: 'Rewrite as $\frac{e^{1/x} - 1}{1/x}$; with $t = 1/x \to 0^+$ this is $\frac{e^t - 1}{t} \to 1$.'
        constraints: "rewrite to a quotient (conjugate or reciprocal) before any L'Hôpital step"
      - id: kp2
        name: 1^∞ forms via logarithms
        key_prerequisites: [lhopitals-rule, logarithm-properties, derivatives-exp-log]
        exemplars:
          - problem: 'Evaluate $\lim_{x \to \infty} \left(1 + \frac{2}{x}\right)^x$.'
            answer: "e^2"
            solution_sketch: '$\ln y = x \ln\left(1 + \frac{2}{x}\right) = \frac{\ln(1 + 2/x)}{1/x}$; L''Hôpital gives $\to 2$, so $y \to e^2$.'
          - problem: 'Evaluate $\lim_{x \to 0} (1 + x)^{1/x}$.'
            answer: "e"
            solution_sketch: '$\ln y = \frac{\ln(1 + x)}{x} \to 1$.'
        constraints: "take ln, evaluate the resulting 0/0 or ∞/∞ limit, then exponentiate"
      - id: kp3
        name: 0^0 and ∞^0 forms
        key_prerequisites: [lhopitals-rule, logarithm-properties]
        exemplars:
          - problem: 'Evaluate $\lim_{x \to 0^+} x^x$.'
            answer: "1"
            solution_sketch: '$\ln y = x \ln x \to 0$ (the standard $0 \cdot \infty$ limit), so $y \to e^0 = 1$.'
          - problem: 'Evaluate $\lim_{x \to \infty} x^{1/x}$.'
            answer: "1"
            solution_sketch: '$\ln y = \frac{\ln x}{x} \to 0$, so $y \to 1$.'
        constraints: "answers are e^L for a clean L (often 0, giving 1); always exponentiate at the end"
    diagnostic_exemplar:
      problem: 'Evaluate $\lim_{x \to \infty} \left(1 + \frac{3}{x}\right)^x$.'
      answer: "e^3"
      solution_sketch: '$\ln y = \frac{\ln(1 + 3/x)}{1/x} \to 3$ (L''Hôpital), so $y \to e^3$.'
    anki_seeds:
      - front: "To evaluate a 1^∞, 0^0, or ∞^0 limit, the standard move is..."
        back: "take ln to get a 0·∞ form, rewrite as a quotient for L'Hôpital, then exponentiate the result"
        type: basic
      - front: "The three indeterminate POWER forms are..."
        back: "1^∞, 0^0, ∞^0 (things like 0^∞ are NOT indeterminate — that one is 0)"
        type: basic
