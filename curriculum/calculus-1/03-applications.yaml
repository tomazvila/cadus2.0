        key_prerequisites: [critical-points-extrema, derivative-power-rule]
        constraints: 'derivative factors over the integers; report open intervals'
        exemplars:
          - problem: 'Find the values of $x$ for which $f(x) = x^3 - 3x$ is increasing.'
            answer: 'x < -1 or x > 1'
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'The derivative is $f''(x) = 3x^2 - 3 = 3(x - 1)(x + 1)$. It is positive when $x < -1$ or $x > 1$, so $f$ is increasing there.'
          - problem: 'For which values of $x$ is $f(x) = x^2 - 6x$ decreasing?'
            answer: 'x < 3'
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'The derivative is $f''(x) = 2x - 6 = 2(x - 3)$. It is negative exactly when $x < 3$, so $f$ is decreasing for $x < 3$.'
          - problem: 'Find the values of $x$ for which $f(x) = x^3 - 12x$ is decreasing.'
            answer: '-2 < x < 2'
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'The derivative is $f''(x) = 3x^2 - 12 = 3(x - 2)(x + 2)$. A product with these roots is negative between them, so $f$ is decreasing for $-2 < x < 2$.'
          - problem: 'A rocket''s height is $h(t) = 30t - 5t^2 + 10$ metres, $t$ seconds after launch. At what time does the rocket stop rising?'
            answer: '3'
            answer_contract: {"kind":"unit","quantity":"time","unit":"s","allow_omitted":true}
            solution_sketch: 'The derivative is $h''(t) = 30 - 10t$. It is positive for $t < 3$ and negative for $t > 3$, so the rocket rises until $t = 3$ seconds.'
          - problem: 'For which values of $x$ is $f(x) = x^4 - 8x^2$ increasing?'
            answer: '-2 < x < 0 or x > 2'
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'The derivative is $f''(x) = 4x^3 - 16x = 4x(x - 2)(x + 2)$. The sign chart shows it is positive for $-2 < x < 0$ and for $x > 2$.'
          - problem: 'Sam says $f(x) = x^3 - 3x^2$ is increasing for $0 < x < 2$, because $0$ and $2$ are the roots of $f''(x) = 3x(x - 2)$. For which values of $x$ is $f$ increasing?'
            answer: 'x < 0 or x > 2'
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'The derivative $f''(x) = 3x(x - 2)$ is a product of two factors with roots $0$ and $2$. It is negative between the roots and positive outside them. So $f$ is increasing for $x < 0$ or $x > 2$.'
          - problem: 'A company''s profit from selling $x$ hundred items is $P(x) = -x^2 + 80x - 600$ dollars. Beyond how many hundred items does selling more reduce the profit?'
            answer: '40'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The derivative is $P''(x) = -2x + 80$. It is positive for $x < 40$ and negative for $x > 40$. So selling more than $40$ hundred items reduces the profit.'
          - problem: 'Find the values of $x$ for which $f(x) = x^3 - 3x^2 - 9x + 5$ is decreasing.'
            answer: '-1 < x < 3'
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'The derivative is $f''(x) = 3x^2 - 6x - 9 = 3(x - 3)(x + 1)$. It is negative between the roots, so $f$ is decreasing for $-1 < x < 3$.'
          - problem: 'Is $f(x) = x^3 + x$ increasing for every real number $x$?'
            answer: 'yes'
            answer_contract: {"kind":"label","options":[["yes","it is","it is increasing","increasing"],["no","it is not","it is not increasing","not increasing"]]}
            solution_sketch: 'The derivative is $f''(x) = 3x^2 + 1$. A square is never negative, so $3x^2 + 1 \geq 1$ is positive for every $x$. So $f$ is increasing everywhere.'
          - problem: 'For which values of $x$ is $f(x) = x^2 + 4x$ increasing?'
            answer: 'x > -2'
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'The derivative is $f''(x) = 2x + 4 = 2(x + 2)$. It is positive exactly when $x > -2$, so $f$ is increasing for $x > -2$.'
      - id: kp2
        name: 'The first derivative test'
        key_prerequisites: [critical-points-extrema]
        constraints: 'include one no-sign-change trap; function values are integers'
        exemplars:
          - problem: 'The function $f(x) = x^3 - 3x^2 - 9x + 5$ has derivative $f''(x) = 3(x + 1)(x - 3)$. Find the value of its local maximum.'
            answer: '10'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The derivative is positive for $x < -1$, negative for $-1 < x < 3$ and positive for $x > 3$. So $f$ has a local maximum at $x = -1$. Its value is $f(-1) = -1 - 3 + 9 + 5 = 10$.'
          - problem: 'A function has derivative $f''(x) = (x + 1)^2(x - 3)$. At the critical number $x = -1$, does $f$ have a local maximum, a local minimum, or neither?'
            answer: 'neither'
            answer_contract: {"kind":"label","options":[["neither","no extremum","neither a maximum nor a minimum","neither a max nor a min","no local extremum","neither a local maximum nor a local minimum","it is neither"],["a local maximum","local maximum","maximum"],["a local minimum","local minimum","minimum"],["cannot be determined","unknown","it cannot be decided"]]}
            solution_sketch: 'Near $x = -1$ the factor $(x + 1)^2$ is positive on both sides and $(x - 3)$ is negative. So $f''$ is negative on both sides of $-1$ and does not change sign. By the first derivative test there is neither a maximum nor a minimum.'
          - problem: 'Find the value of the local maximum of $f(x) = x^3 - 12x + 1$.'
            answer: '17'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The derivative is $f''(x) = 3(x - 2)(x + 2)$, which is positive before $x = -2$ and negative after it. So $f$ has a local maximum at $x = -2$. Its value is $f(-2) = -8 + 24 + 1 = 17$.'
          - problem: 'The function $f(x) = 2x^3 + 3x^2 - 36x + 5$ has derivative $f''(x) = 6(x + 3)(x - 2)$. Find the value of its local maximum.'
            answer: '86'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The derivative is positive before $x = -3$, negative between $-3$ and $2$, and positive after $2$. So $f$ has a local maximum at $x = -3$. Its value is $f(-3) = -54 + 27 + 108 + 5 = 86$.'
          - problem: 'The function $f(x) = x^3 - 6x^2 - 15x + 8$ has derivative $f''(x) = 3(x - 5)(x + 1)$. Find the value of its local minimum.'
            answer: '-92'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The derivative is positive, then negative, then positive, so $f$ has a local minimum at $x = 5$. Its value is $f(5) = 125 - 150 - 75 + 8 = -92$.'
          - problem: 'Find the value of the local minimum of $f(x) = 2x^3 - 3x^2 - 12x + 5$.'
            answer: '-15'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The derivative is $f''(x) = 6x^2 - 6x - 12 = 6(x - 2)(x + 1)$. It changes from negative to positive at $x = 2$, so $f$ has a local minimum there. Its value is $f(2) = 16 - 12 - 24 + 5 = -15$.'
          - problem: 'After a storm the water level in a reservoir is $L(t) = t^3 - 12t^2 + 36t + 100$ centimetres, $t$ days later. The level first rises to a peak and then falls. What is the level at the peak?'
            answer: '132'
            answer_contract: {"kind":"unit","quantity":"length","unit":"cm","allow_omitted":true}
            solution_sketch: 'The derivative is $L''(t) = 3t^2 - 24t + 36 = 3(t - 2)(t - 6)$. It changes from positive to negative at $t = 2$, so the first peak is at $t = 2$. The level there is $L(2) = 8 - 48 + 72 + 100 = 132$ centimetres.'
          - problem: 'A factory''s profit from $x$ hundred units a day is $P(x) = 2x^3 - 15x^2 + 36x$ dollars, for $x \geq 0$. The profit rises, dips, and then rises again. What is the profit at the lowest point of the dip?'
            answer: '27'
            answer_contract: {"kind":"unit","quantity":"dollar","unit":"dollar","allow_omitted":true}
            solution_sketch: 'The derivative is $P''(x) = 6x^2 - 30x + 36 = 6(x - 2)(x - 3)$. It changes from negative to positive at $x = 3$, so the dip bottoms out there. The profit is $P(3) = 54 - 135 + 108 = 27$ dollars.'
          - problem: 'Sam solves $f''(x) = 0$ for $f(x) = x^3 - 27x + 5$, gets $x = \pm 3$, and says the local maximum value is $3$. What is the correct value of the local maximum?'
            answer: '59'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Sam reported a critical point instead of a value of $f$. The derivative $f''(x) = 3(x - 3)(x + 3)$ changes from positive to negative at $x = -3$. So the local maximum value is $f(-3) = -27 + 81 + 5 = 59$.'
      - id: kp3
        name: 'Monotonicity with products and exponentials'
        key_prerequisites: [product-quotient-rules, derivatives-exp-log]
        constraints: 'the exponential factor is always positive — sign comes from the polynomial factor'
        exemplars:
          - problem: 'For which values of $x$ is $f(x) = x e^{-2x}$ increasing?'
            answer: 'x < 1/2'
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'The product rule gives $f''(x) = e^{-2x} + x(-2e^{-2x}) = e^{-2x}(1 - 2x)$. The factor $e^{-2x}$ is positive, so $f''$ has the sign of $1 - 2x$. That is positive for $x < \frac{1}{2}$.'
          - problem: 'At which value of $x$ does $f(x) = x e^{3x}$ have a local minimum?'
            answer: '-1/3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The product rule gives $f''(x) = e^{3x} + 3xe^{3x} = e^{3x}(1 + 3x)$. The factor $e^{3x}$ is positive, so $f''$ has the sign of $1 + 3x$. It changes from negative to positive at $x = -\frac{1}{3}$, so that is the local minimum.'
          - problem: 'Find the values of $x$ for which $f(x) = (x^2 - 3)e^{-x}$ is increasing.'
            answer: '-1 < x < 3'
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'The product rule gives $f''(x) = 2xe^{-x} - (x^2 - 3)e^{-x} = e^{-x}(-x^2 + 2x + 3) = -e^{-x}(x - 3)(x + 1)$. Since $e^{-x} > 0$, $f'' > 0$ when $(x - 3)(x + 1) < 0$. That is $-1 < x < 3$.'
          - problem: 'For which values of $x$ is $f(x) = (x^2 - 7x + 13)e^{x}$ decreasing?'
            answer: '2 < x < 3'
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'The product rule gives $f''(x) = (2x - 7)e^{x} + (x^2 - 7x + 13)e^{x} = e^{x}(x - 2)(x - 3)$. Since $e^{x} > 0$, $f'' < 0$ when $(x - 2)(x - 3) < 0$. That is $2 < x < 3$.'
          - problem: 'At which value of $x$ does $f(x) = (2x - 3)e^{x}$ have a local minimum?'
            answer: '1/2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The product rule gives $f''(x) = 2e^{x} + (2x - 3)e^{x} = e^{x}(2x - 1)$. Since $e^{x} > 0$, $f''$ has the sign of $2x - 1$. It changes from negative to positive at $x = \frac{1}{2}$, so that is the local minimum.'
          - problem: 'Find the values of $x$ for which $f(x) = (1 - 4x)e^{-x}$ is increasing.'
            answer: 'x > 5/4'
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'The product rule gives $f''(x) = -4e^{-x} - (1 - 4x)e^{-x} = e^{-x}(4x - 5)$. Since $e^{-x} > 0$, $f''$ has the sign of $4x - 5$. That is positive for $x > \frac{5}{4}$.'
          - problem: 'The concentration of a drug in the blood is $C(t) = te^{-t/2}$ milligrams per litre, $t$ hours after an injection. At what time is the concentration greatest?'
            answer: '2'
            answer_contract: {"kind":"unit","quantity":"time","unit":"h","allow_omitted":true}
            solution_sketch: 'The product rule gives $C''(t) = e^{-t/2} - \frac{t}{2}e^{-t/2} = e^{-t/2}\left(1 - \frac{t}{2}\right)$. Since $e^{-t/2} > 0$, $C''$ has the sign of $1 - \frac{t}{2}$. It changes from positive to negative at $t = 2$, so the concentration is greatest after $2$ hours.'
          - problem: 'The number of people reading a post, in hundreds, is $R(t) = 10te^{-t/4}$ at $t$ hours after it appears. After how many hours is the number of readers greatest?'
            answer: '4'
            answer_contract: {"kind":"unit","quantity":"time","unit":"h","allow_omitted":true}
            solution_sketch: 'The product rule gives $R''(t) = 10e^{-t/4} - \frac{10t}{4}e^{-t/4} = 10e^{-t/4}\left(1 - \frac{t}{4}\right)$. Since $e^{-t/4} > 0$, $R''$ changes from positive to negative at $t = 4$. So the number of readers is greatest after $4$ hours.'
          - problem: 'Sam differentiates $f(x) = xe^{-x}$ as $f''(x) = e^{-x}$ and says $f$ is increasing for every $x$. For which values of $x$ is $f$ increasing?'
            answer: 'x < 1'
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'Sam forgot the product rule. The correct derivative is $f''(x) = e^{-x} - xe^{-x} = e^{-x}(1 - x)$. Since $e^{-x} > 0$, $f''$ is positive exactly when $x < 1$.'
    diagnostic_exemplar:
      problem: 'Find the intervals of increase and decrease of $f(x) = x^2 e^{-x}$.'
      answer: "increasing on (0, 2); decreasing on (-∞, 0) and (2, ∞)"
      answer_contract: {kind: none}
      solution_sketch: '$f''(x) = e^{-x}(2x - x^2) = e^{-x} x(2 - x)$, positive exactly for $0 < x < 2$.'
    anki_seeds:
      - front: "f' > 0 on an interval means f is ___ there; f' < 0 means f is ___."
        back: "increasing; decreasing"
        type: basic
      - front: "First derivative test: f' changes + to - at c means ___; - to + means ___; no sign change means ___."
        back: "local max; local min; no extremum"
        type: basic

  - id: concavity-inflection-points
    name: Concavity and Inflection Points
    core: true
    difficulty: 0.6
    drill: false
    answer_kind: numeric
    expected_time_secs: 180
    prerequisites:
      - id: higher-order-derivatives
        weight: 0.7
        key: true
      - id: increasing-decreasing-intervals
        weight: 0.4
      - id: critical-points-extrema
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: 'Intervals of concavity'
        key_prerequisites: [higher-order-derivatives]
        constraints: 'second derivative factors cleanly; report open intervals'
        exemplars:
          - problem: 'For which values of $x$ is $f(x) = x^3 - 3x$ concave up?'
            answer: 'x > 0'
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'The derivatives are $f''(x) = 3x^2 - 3$ and $f''''(x) = 6x$. The graph is concave up where $f''''(x) > 0$, which is $x > 0$.'
          - problem: 'For which values of $x$ is $f(x) = x^3 + 3x^2$ concave up?'
            answer: 'x > -1'
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'The second derivative is $f''''(x) = 6x + 6$. The graph is concave up where $6x + 6 > 0$, which is $x > -1$.'
          - problem: 'Find the values of $x$ for which $f(x) = x^3 - 3x^2 - 9x + 5$ is concave up.'
            answer: 'x > 1'
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'The second derivative is $f''''(x) = 6x - 6$. The graph is concave up where $6x - 6 > 0$, which is $x > 1$.'
          - problem: 'For which values of $x$ is $f(x) = x^4 - 6x^2$ concave up?'
            answer: 'x < -1 or x > 1'
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'The second derivative is $f''''(x) = 12x^2 - 12 = 12(x - 1)(x + 1)$. It is positive for $x < -1$ and for $x > 1$, so the graph is concave up there.'
          - problem: 'For which values of $x$ is $f(x) = x^4 - 8x^3$ concave down?'
            answer: '0 < x < 4'
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'The second derivative is $f''''(x) = 12x^2 - 48x = 12x(x - 4)$. It is negative between the roots, so the graph is concave down for $0 < x < 4$.'
          - problem: 'Find the values of $x$ for which $f(x) = 2x^3 - 9x^2 + 12x$ is concave up.'
            answer: 'x > 3/2'
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'The second derivative is $f''''(x) = 12x - 18$. The graph is concave up where $12x - 18 > 0$, which is $x > \frac{3}{2}$.'
          - problem: 'A tank holds $V(t) = -t^3 + 12t^2$ litres after $t$ minutes, for $t \geq 0$. The filling rate $V''(t)$ increases while the graph of $V$ is concave up. For how many minutes after the start does the filling rate increase?'
            answer: '4'
            answer_contract: {"kind":"unit","quantity":"time","unit":"min","allow_omitted":true}
            solution_sketch: 'The second derivative is $V''''(t) = -6t + 24$. It is positive for $t < 4$, so the graph is concave up and the filling rate increases during the first $4$ minutes.'
          - problem: 'The cost of making $x$ items is $C(x) = x^3 - 9x^2 + 30x$ dollars. The marginal cost $C''(x)$ rises where the graph of $C$ is concave up. For which numbers of items $x \geq 0$ does the marginal cost rise?'
            answer: 'x > 3'
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'The second derivative is $C''''(x) = 6x - 18$. It is positive for $x > 3$, so the graph of $C$ is concave up and the marginal cost rises when more than $3$ items are made.'
          - problem: 'Is the graph of $f(x) = x^4 + x^2$ concave up for every real number $x$?'
            answer: 'yes'
            answer_contract: {"kind":"label","options":[["yes","it is","it is concave up","concave up"],["no","it is not","it is not concave up","not concave up"]]}
            solution_sketch: 'The second derivative is $f''''(x) = 12x^2 + 2$. A square is never negative, so $f''''(x) \geq 2$ is positive for every $x$. So the graph is concave up everywhere.'
          - problem: 'Sam finds where $f(x) = x^3 - 12x$ is concave up by solving $f''(x) > 0$, and gets $x < -2$ or $x > 2$. For which values of $x$ is $f$ concave up?'
            answer: 'x > 0'
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'Sam used the first derivative, which describes rising and falling. Concavity depends on the second derivative $f''''(x) = 6x$. It is positive for $x > 0$, so $f$ is concave up for $x > 0$.'
      - id: kp2
        name: 'Find inflection points (verify the sign change)'
        key_prerequisites: [higher-order-derivatives]
        constraints: 'include one f'''' = 0 without sign change trap'
        exemplars:
          - problem: 'Find the $x$-coordinates of all inflection points of $f(x) = x^4 - 24x^2$.'
            answer: '-2, 2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The second derivative is $f''''(x) = 12x^2 - 48 = 12(x - 2)(x + 2)$. Both roots are simple, so $f''''$ changes sign at $x = -2$ and at $x = 2$. Both are inflection points.'
          - problem: 'Find the $x$-coordinates of all inflection points of $f(x) = x^5 - 5x^4$.'
            answer: '3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The second derivative is $f''''(x) = 20x^3 - 60x^2 = 20x^2(x - 3)$, which is zero at $x = 0$ and $x = 3$. The factor $x^2$ is positive on both sides of $0$, so $f''''$ does not change sign there. It changes sign at $x = 3$, so the only inflection point is at $x = 3$.'
          - problem: 'Find the inflection point of the graph of $f(x) = x^3 - 6x^2 + 5$.'
            answer: '(2, -11)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'The second derivative is $f''''(x) = 6x - 12$, which changes from negative to positive at $x = 2$. The height there is $f(2) = 8 - 24 + 5 = -11$, so the inflection point is $(2, -11)$.'
          - problem: 'A function $f$ has second derivative $f''''(x) = 6x + 12$ for every real $x$. Find the $x$-coordinate of the inflection point of the graph of $f$.'
            answer: '-2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The equation $6x + 12 = 0$ gives $x = -2$. The second derivative is negative before $-2$ and positive after it, so concavity changes at $x = -2$.'
          - problem: 'At which value of $x$ in the interval $(0, 2\pi)$ does the graph of $f(x) = \sin x$ change concavity?'
            answer: 'pi'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The second derivative is $f''''(x) = -\sin x$. On $(0, 2\pi)$ it is zero only at $x = \pi$. It is negative just before $\pi$ and positive just after it, so concavity changes at $\pi$.'
          - problem: 'Find the $x$-coordinate of the inflection point of the graph of $f(x) = 2x^3 - 12x^2 + 5x$.'
            answer: '2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The second derivative is $f''''(x) = 12x - 24$. It is negative before $x = 2$ and positive after it, so concavity changes at $x = 2$.'
          - problem: 'A tank holds $V(t) = -t^3 + 12t^2$ litres after $t$ minutes, for $t \geq 0$. At what time is the filling rate $V''(t)$ greatest?'
            answer: '4'
            answer_contract: {"kind":"unit","quantity":"time","unit":"min","allow_omitted":true}
            solution_sketch: 'The filling rate is $V''(t) = -3t^2 + 24t$, and its slope is $V''''(t) = -6t + 24$. The slope changes from positive to negative at $t = 4$, so the rate is greatest at the inflection point $t = 4$ minutes.'
          - problem: 'Spending $x$ thousand dollars on advertising brings a return of $R(x) = -x^3 + 15x^2 + 20x$ thousand dollars. The return per extra dollar spent is greatest where the graph of $R$ has its inflection point. At what spending $x \geq 0$ is that?'
            answer: '5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The second derivative is $R''''(x) = -6x + 30$. It changes from positive to negative at $x = 5$, so the inflection point is at $x = 5$ thousand dollars.'
          - problem: 'Does the graph of $f(x) = x^4$ have an inflection point at $x = 0$?'
            answer: 'no'
            answer_contract: {"kind":"label","options":[["yes","it does","it has one","there is one"],["no","it does not","it has none","there is none"]]}
            solution_sketch: 'The second derivative is $f''''(x) = 12x^2$, which is zero at $x = 0$. It is positive on both sides of $0$, so the concavity does not change. There is no inflection point at $x = 0$.'
          - problem: 'Find the $x$-coordinate of the inflection point of the graph of $f(x) = \sqrt[3]{x}$.'
            answer: '0'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The second derivative is $f''''(x) = -\frac{2}{9}x^{-5/3}$, which is not defined at $x = 0$. It is positive for $x < 0$ and negative for $x > 0$, so concavity changes at $x = 0$. The graph passes through $(0, 0)$ there.'
          - problem: 'Sam solves $f''(x) = 0$ for $f(x) = x^3 - 9x^2 + 2$, gets $x = 0$ and $x = 6$, and calls them inflection points. What is the $x$-coordinate of the inflection point?'
            answer: '3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Sam used the first derivative, which finds critical points. Inflection points come from the second derivative $f''''(x) = 6x - 18$. It changes sign at $x = 3$, so the inflection point is at $x = 3$.'
      - id: kp3
        name: 'Concavity and the graph'
        key_prerequisites: [higher-order-derivatives, increasing-decreasing-intervals]
        constraints: 'combine first- and second-derivative sign information verbally or as ordered pairs'
        exemplars:
          - problem: 'Find the inflection point of the graph of $f(x) = x^3 - 3x$.'
            answer: '(0, 0)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'The second derivative is $f''''(x) = 6x$, which changes from negative to positive at $x = 0$. The height there is $f(0) = 0$, so the inflection point is $(0, 0)$.'
          - problem: 'On an interval, a function has $f''(x) > 0$ and $f''''(x) < 0$. Which describes the graph of $f$ on that interval?'
            answer: 'increasing, concave down'
            answer_contract: {"kind":"label","options":[["increasing, concave down","increasing and concave down","rising and bending down","concave down and increasing","concave down, increasing","it is increasing and concave down"],["increasing, concave up","increasing and concave up","rising and bending up","concave up and increasing","concave up, increasing"],["decreasing, concave down","decreasing and concave down","falling and bending down","concave down and decreasing","concave down, decreasing"],["decreasing, concave up","decreasing and concave up","falling and bending up","concave up and decreasing","concave up, decreasing"]]}
            solution_sketch: 'The sign $f''(x) > 0$ means the graph rises from left to right. The sign $f''''(x) < 0$ means the slope is getting smaller, so the graph is concave down. So the graph is increasing and concave down.'
          - problem: 'Find the inflection point of the graph of $f(x) = x^3 - 3x^2 + 4$.'
            answer: '(1, 2)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'The second derivative is $f''''(x) = 6x - 6$, which changes sign at $x = 1$. The height there is $f(1) = 1 - 3 + 4 = 2$, so the inflection point is $(1, 2)$.'
          - problem: 'For which values of $x$ is $f(x) = x^3 - 12x$ both increasing and concave up?'
            answer: 'x > 2'
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'The derivative $f''(x) = 3(x - 2)(x + 2)$ is positive for $x < -2$ or $x > 2$. The second derivative $f''''(x) = 6x$ is positive for $x > 0$. Both hold only for $x > 2$.'
          - problem: 'Find the $x$-coordinate of the inflection point of the graph of $f(x) = x^3 - 6x^2 + 9x$.'
            answer: '2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The second derivative is $f''''(x) = 6x - 12$. It changes from negative to positive at $x = 2$, so the inflection point is at $x = 2$.'
          - problem: 'For which values of $x$ is $f(x) = x^3 - 6x^2 + 9x$ both decreasing and concave up?'
            answer: '2 < x < 3'
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'The derivative $f''(x) = 3(x - 1)(x - 3)$ is negative for $1 < x < 3$. The second derivative $f''''(x) = 6x - 12$ is positive for $x > 2$. Both hold for $2 < x < 3$.'
          - problem: 'A company''s total sales after $t$ months are $S(t) = -t^3 + 12t^2$ thousand dollars. For $t > 0$, during which months are the total sales rising, but at a slower and slower rate?'
            answer: '4 < t < 8'
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'The derivative $S''(t) = 3t(8 - t)$ is positive for $0 < t < 8$, so the sales are rising. The second derivative $S''''(t) = -6t + 24$ is negative for $t > 4$, so the rise is slowing. Both hold for $4 < t < 8$.'
          - problem: 'The cost graph of a factory is concave up. As the number of items made grows, does the marginal cost increase or decrease?'
            answer: 'increases'
            answer_contract: {"kind":"label","options":[["increases","it increases","increase","goes up","rises","increasing","it goes up","it rises"],["decreases","it decreases","decrease","goes down","falls","decreasing","it goes down","it falls"]]}
            solution_sketch: 'The marginal cost is the slope $C''(x)$ of the cost graph. A graph that is concave up has a slope that is increasing. So the marginal cost increases as more items are made.'
          - problem: 'Sam says the inflection points of $f(x) = x^3 - 3x^2 - 9x$ are at $x = -1$ and $x = 3$, where $f''(x) = 3(x - 3)(x + 1)$ is zero. What is the inflection point of the graph?'
            answer: '(1, -11)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'Sam used the zeros of $f''$, which are the critical points. The second derivative is $f''''(x) = 6x - 6$, which changes sign at $x = 1$. The height there is $f(1) = 1 - 3 - 9 = -11$, so the inflection point is $(1, -11)$.'
          - problem: 'For which values of $x$ is $f(x) = x^3 - 6x^2 + 9x$ both increasing and concave down?'
            answer: 'x < 1'
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'The derivative $f''(x) = 3(x - 1)(x - 3)$ is positive for $x < 1$ or $x > 3$. The second derivative $f''''(x) = 6x - 12$ is negative for $x < 2$. Both hold only for $x < 1$.'
    diagnostic_exemplar:
      problem: 'Find the intervals of concavity of $f(x) = x^3 - 6x^2$ and give its inflection point as an ordered pair.'
      answer: 'concave down on (-∞, 2), concave up on (2, ∞); inflection point (2, -16)'
      answer_contract: {kind: none}
      solution_sketch: '$f''''(x) = 6x - 12$ is negative for $x < 2$ and positive for $x > 2$; $f(2) = 8 - 24 = -16$.'
    anki_seeds:
      - front: "f'' > 0 on an interval means the graph of f is ___ there."
        back: "concave up (bending upward, f' increasing)"
        type: basic
      - front: "An inflection point is where..."
        back: "the concavity changes sign (f'' changes sign), not merely where f'' = 0"
        type: basic

  - id: second-derivative-test
    name: The Second Derivative Test
    core: true
    difficulty: 0.65
    drill: false
    answer_kind: numeric
    expected_time_secs: 150
    prerequisites:
      - id: concavity-inflection-points
        weight: 0.7
        key: true
      - id: critical-points-extrema
        weight: 0.6
        key: true
      - id: increasing-decreasing-intervals
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: Apply the second derivative test
        key_prerequisites: [critical-points-extrema, concavity-inflection-points]
        exemplars:
          - problem: 'Use the second derivative test to find the local maximum value of $f(x) = x^3 - 3x^2 - 9x$.'
            answer: '5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Solve $f''(x) = 3x^2 - 6x - 9 = 0$ to get the critical points $x = -1$ and $x = 3$. Since $f''''(x) = 6x - 6$, we have $f''''(-1) = -12 < 0$, so $x = -1$ is the local maximum, and $f(-1) = -1 - 3 + 9 = 5$.'
          - problem: 'The function $f(x) = 2x^3 + 3x^2 - 36x + 5$ has critical points $x = -3$ and $x = 2$. Does $f$ have a local maximum or a local minimum at $x = 2$?'
            answer: 'local minimum'
            answer_contract: {"kind":"label","options":[["local minimum","minimum","min","a local minimum","local min","a local min","a minimum"],["local maximum","maximum","max","a local maximum","local max","a local max","a maximum"]]}
            solution_sketch: 'The second derivative is $f''''(x) = 12x + 6$. At $x = 2$ we get $f''''(2) = 30 > 0$, so the graph is concave up there and $f$ has a local minimum at $x = 2$.'
          - problem: 'The function $f(x) = x^4 - 8x^2 + 9$ has critical points $x = -2$, $x = 0$ and $x = 2$. At which values of $x$ does $f$ have a local minimum?'
            answer: '-2, 2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The second derivative is $f''''(x) = 12x^2 - 16$. We get $f''''(-2) = 32 > 0$ and $f''''(2) = 32 > 0$, so $f$ has a local minimum at $x = -2$ and at $x = 2$. At $x = 0$, $f''''(0) = -16 < 0$, which is a local maximum.'
          - problem: 'Use the second derivative test to find the local minimum value of $f(x) = 2x + \frac{18}{x}$.'
            answer: '12'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Here $f''(x) = 2 - \frac{18}{x^2}$, which is zero at $x = -3$ and $x = 3$. The second derivative is $f''''(x) = \frac{36}{x^3}$, so $f''''(3) = \frac{4}{3} > 0$ and $x = 3$ gives the local minimum. Its value is $f(3) = 6 + 6 = 12$.'
          - problem: 'A company''s profit, in thousands of dollars, is $P(x) = -x^3 + 9x^2 - 15x - 10$ when it makes $x$ hundred units, for $0 \le x \le 8$. Use the second derivative test to find the profit, in thousands of dollars, at the production level where the profit has a local maximum.'
            answer: '15'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Here $P''(x) = -3x^2 + 18x - 15 = -3(x - 1)(x - 5)$, so the critical points are $x = 1$ and $x = 5$. Since $P''''(x) = -6x + 18$, we have $P''''(1) = 12 > 0$, a local minimum, and $P''''(5) = -12 < 0$, a local maximum. The profit at $x = 5$ is $P(5) = -125 + 225 - 75 - 10 = 15$ thousand dollars.'
          - problem: 'The number of fish in a lake, in hundreds, is $N(t) = t^3 - 9t^2 + 24t + 20$ at $t$ years after stocking, for $0 \le t \le 6$. Use the second derivative test to find the number of fish, in hundreds, at the local minimum.'
            answer: '36'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Here $N''(t) = 3t^2 - 18t + 24 = 3(t - 2)(t - 4)$, so the critical points are $t = 2$ and $t = 4$. Since $N''''(t) = 6t - 18$, we have $N''''(2) = -6 < 0$, a local maximum, and $N''''(4) = 6 > 0$, a local minimum. The value at the local minimum is $N(4) = 64 - 144 + 96 + 20 = 36$ hundred fish.'
          - problem: 'Sam says that $f(x) = x^3 - 12x$ has a local maximum at $x = 2$ because $f''''(2) = 12 > 0$. What is the correct local maximum value of $f$?'
            answer: '16'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The critical points of $f$ are $x = -2$ and $x = 2$, and $f''''(x) = 6x$. A positive $f''''(2) = 12$ means the graph is concave up, so $x = 2$ is a local minimum, not a maximum. The local maximum is at $x = -2$, where $f''''(-2) = -12 < 0$, and $f(-2) = -8 + 24 = 16$.'
          - problem: 'Find the local minimum value of $f(x) = 4x^2 - 8x + 7$.'
            answer: '3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The derivative is $f''(x) = 8x - 8$, so the only critical point is $x = 1$. Since $f''''(x) = 8 > 0$, the point $x = 1$ is a local minimum, and $f(1) = 4 - 8 + 7 = 3$.'
      - id: kp2
        name: When the test is inconclusive
        key_prerequisites: [concavity-inflection-points, increasing-decreasing-intervals]
        try_first:
          problem: 'Does $f(x) = x^4$ have a local minimum at $x = 0$, where $f''''(0) = 0$?'
          answer_contract: {"kind":"label","options":[["yes","it does","it is","yes it does","yes, it does","yes it is","yes, it is","it has"],["no","it does not","it is not","no it does not","no, it does not","no it is not","no, it is not","it doesn't"]]}
          answer: 'yes'
          reveal: 'Even though $f''''(0) = 0$, we have $x^4 \ge 0$, and $x^4 = 0$ only at $x = 0$, so the lowest value is at $0$. A zero second derivative gives no verdict, and the sign of $f''$ decides.'
        exemplars:
          - problem: 'The function $f(x) = -x^4$ has a critical point at $x = 0$, and $f''''(0) = 0$. Is $x = 0$ a local maximum, a local minimum, or neither?'
            answer: 'local maximum'
            answer_contract: {"kind":"label","options":[["local maximum","maximum","max","a local maximum","local max","a local max","a maximum"],["local minimum","minimum","min","a local minimum","local min","a local min","a minimum"],["neither","no extremum","neither a maximum nor a minimum","not an extremum"]]}
            solution_sketch: 'Since $f''''(0) = 0$, the second derivative test gives no answer, so we use the sign of $f''(x) = -4x^3$. For $x < 0$ the derivative is positive and for $x > 0$ it is negative, so $f$ rises and then falls, and $x = 0$ is a local maximum.'
          - problem: 'The function $f(x) = x^4 - 4x^3$ has critical points $x = 0$ and $x = 3$. At which values of $x$ does $f$ have a local extremum?'
            answer: '3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Since $f''''(x) = 12x^2 - 24x$, we get $f''''(3) = 36 > 0$, so $x = 3$ is a local minimum. At $x = 0$ we have $f''''(0) = 0$, so we use $f''(x) = 4x^2(x - 3)$, which is negative on both sides of $0$. There is no sign change, so $x = 0$ is not an extremum and the only answer is $3$.'
          - problem: 'The function $f(x) = x^5 - 5x^4$ has critical points $x = 0$ and $x = 4$. Find the local maximum value of $f$.'
            answer: '0'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'We have $f''''(x) = 20x^3 - 60x^2$, so $f''''(4) = 320 > 0$ and $x = 4$ is a local minimum. At $x = 0$ we get $f''''(0) = 0$, so we use $f''(x) = 5x^3(x - 4)$: it is positive just left of $0$ and negative just right of $0$. So $x = 0$ is the local maximum, and $f(0) = 0$.'
          - problem: 'A cable between two poles hangs at height $h(x) = 2 + (x - 3)^4$ metres above a road, where $x$ is the horizontal position in metres. We have $h''''(3) = 0$. Find the lowest point of the cable.'
            answer: '(3, 2)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'Since $h''(x) = 4(x - 3)^3$, the only critical point is $x = 3$, and the second derivative test fails there because $h''''(3) = 0$. The derivative is negative for $x < 3$ and positive for $x > 3$, so $x = 3$ is a local minimum. The height there is $h(3) = 2$, so the lowest point is $(3, 2)$.'
          - problem: 'The water level in a tank, in centimetres, is $W(t) = 20 + (t - 5)^3$ at time $t$ minutes, for $0 \le t \le 10$. At $t = 5$ we have $W''(5) = 0$ and $W''''(5) = 0$. Is the water level at a local minimum at $t = 5$?'
            answer: 'no'
            answer_contract: {"kind":"label","options":[["yes","it does","it is","yes it does","yes, it does","yes it is","yes, it is","it has"],["no","it does not","it is not","no it does not","no, it does not","no it is not","no, it is not","it doesn't"]]}
            solution_sketch: 'The second derivative test gives no answer, so we look at $W''(t) = 3(t - 5)^2$. This is positive on both sides of $t = 5$, so $W$ keeps rising and the sign of $W''$ does not change. There is no local minimum at $t = 5$, so the answer is no.'
          - problem: 'Sam says that $f(x) = 5 - (x + 1)^4$ has no extremum at $x = -1$ because $f''''(-1) = 0$. What is the largest value of $f$?'
            answer: '5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'A zero second derivative only means the second derivative test fails, so Sam cannot draw a conclusion from it. Since $f''(x) = -4(x + 1)^3$ is positive for $x < -1$ and negative for $x > -1$, $x = -1$ is a local maximum. There $f(-1) = 5$, and $(x + 1)^4 \ge 0$ shows that no value of $f$ is larger.'
          - problem: 'The function $f(x) = x^6$ has a critical point at $x = 0$, and $f''''(0) = 0$. On which values of $x$ is $f$ decreasing?'
            answer: 'x < 0'
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'The derivative is $f''(x) = 6x^5$. It is negative when $x < 0$ and positive when $x > 0$, so $f$ is decreasing for $x < 0$. The sign of $f''$ changes from negative to positive at $0$, so $x = 0$ is a local minimum even though $f''''(0) = 0$.'
          - problem: 'For which smallest positive integer $n$ does $f(x) = x^n$ have a local minimum at $x = 0$ even though $f''''(0) = 0$?'
            answer: '4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'For $n = 1$ the derivative is never zero, and for $n = 2$ we get $f''''(0) = 2 \ne 0$. For $n = 3$ we get $f''''(0) = 0$, but $f''(x) = 3x^2$ is positive on both sides of $0$, so there is no extremum. For $n = 4$ we get $f''''(0) = 0$ and $f''(x) = 4x^3$ changes from negative to positive, so $n = 4$ works.'
      - id: kp3
        name: Choose the right test
        key_prerequisites: [critical-points-extrema, concavity-inflection-points]
        exemplars:
          - problem: 'Find the x-coordinate of every local extremum of $f(x) = x^4 - 8x^3$.'
            answer: '6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Here $f''(x) = 4x^3 - 24x^2 = 4x^2(x - 6)$, so the critical points are $x = 0$ and $x = 6$. Since $f''''(x) = 12x^2 - 48x$, we get $f''''(6) = 144 > 0$, a local minimum. At $x = 0$ we get $f''''(0) = 0$, and $f''$ is negative on both sides of $0$, so $x = 0$ is not an extremum and the answer is $6$.'
          - problem: 'The function $g(x) = x^3 - 3x^2 - 9x + 5$ has a critical point at $x = -1$. Use the second derivative test to decide whether $g$ has a local maximum or a local minimum there.'
            answer: 'local maximum'
            answer_contract: {"kind":"label","options":[["local maximum","maximum","max","a local maximum","local max","a local max","a maximum"],["local minimum","minimum","min","a local minimum","local min","a local min","a minimum"]]}
            solution_sketch: 'The second derivative is $g''''(x) = 6x - 6$. At $x = -1$ we get $g''''(-1) = -12 < 0$, so the graph is concave down there and $g$ has a local maximum at $x = -1$.'
          - problem: 'Find the local minimum value of $h(x) = 3x^4 - 4x^3$.'
            answer: '-1'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'We have $h''(x) = 12x^3 - 12x^2 = 12x^2(x - 1)$, so the critical points are $x = 0$ and $x = 1$. Since $h''''(x) = 36x^2 - 24x$, we get $h''''(1) = 12 > 0$, a local minimum. At $x = 0$ the second derivative is $0$ and $h''$ is negative on both sides, so there is no extremum. The minimum value is $h(1) = 3 - 4 = -1$.'
          - problem: 'The function $s(x) = x^4 - 8x^3 + 24x^2 - 32x + 16$ has a critical point at $x = 2$, and $s''''(2) = 0$. Is $x = 2$ a local maximum, a local minimum, or neither?'
            answer: 'local minimum'
            answer_contract: {"kind":"label","options":[["local maximum","maximum","max","a local maximum","local max","a local max","a maximum"],["local minimum","minimum","min","a local minimum","local min","a local min","a minimum"],["neither","no extremum","neither a maximum nor a minimum","not an extremum"]]}
            solution_sketch: 'The second derivative test gives no answer here because $s''''(2) = 0$. Since $s''(x) = 4(x - 2)^3$ is negative for $x < 2$ and positive for $x > 2$, the point $x = 2$ is a local minimum. In fact $s(x) = (x - 2)^4$.'
          - problem: 'A company''s profit, in thousands of dollars, is $P(x) = 4x^3 - x^4$ when it sells $x$ hundred items, for $0 \le x \le 4$. What is the largest profit the company can make, in thousands of dollars?'
            answer: '27'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Here $P''(x) = 12x^2 - 4x^3 = 4x^2(3 - x)$, so the critical points are $x = 0$ and $x = 3$. Since $P''''(3) = -36 < 0$, the point $x = 3$ is a local maximum, and $P''$ does not change sign at $x = 0$. The profit at $x = 3$ is $P(3) = 108 - 81 = 27$, which is larger than the end values $P(0) = P(4) = 0$.'
          - problem: 'A particle moves along a line so that its position, in metres, is $s(t) = 3t^5 - 5t^3$ at time $t > 0$ seconds. Find the position of the particle when it is at a local minimum.'
            answer: '-2'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'Here $s''(t) = 15t^4 - 15t^2 = 15t^2(t - 1)(t + 1)$, so the only critical point with $t > 0$ is $t = 1$. Since $s''''(t) = 60t^3 - 30t$, we get $s''''(1) = 30 > 0$, a local minimum. The position is $s(1) = 3 - 5 = -2$ metres.'
          - problem: 'Find the local maximum value of $f(x) = 3x^5 - 5x^3$.'
            answer: '2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Here $f''(x) = 15x^4 - 15x^2 = 15x^2(x - 1)(x + 1)$, so the critical points are $x = -1$, $x = 0$ and $x = 1$. Since $f''''(x) = 60x^3 - 30x$, we get $f''''(-1) = -30 < 0$, a local maximum, and $f''''(1) = 30 > 0$. At $x = 0$ the second derivative is $0$ and $f''$ is negative on both sides. The local maximum value is $f(-1) = -3 + 5 = 2$.'
    diagnostic_exemplar:
      problem: 'The function $f(x) = x^4 + 4x^3$ has critical points $x = 0$ and $x = -3$. Classify each (use whichever test works at each point).'
      answer: "x = -3 is a local min (f''(-3) = 36 > 0); x = 0 is not an extremum (f''(0) = 0 and f' = 4x²(x + 3) does not change sign at 0)"
      answer_contract: {kind: none}
      solution_sketch: '$f''''(x) = 12x^2 + 24x$ is $36 > 0$ at $x = -3$, a local min. At $x = 0$ it is $0$, so the test is inconclusive and the first derivative decides: the $4x^2$ factor of $f''(x) = 4x^2(x+3)$ keeps the sign positive on both sides of $0$.'
    anki_seeds:
      - front: "Second derivative test: at a critical point c with f'(c) = 0, f''(c) > 0 means ___ and f''(c) < 0 means ___."
        back: "local minimum; local maximum (f''(c) = 0 is inconclusive)"
        type: basic
      - front: "When the second derivative test is inconclusive (f''(c) = 0), classify the point by..."
        back: "the first derivative test (sign chart of f' around c)"
        type: basic

  - id: curve-analysis-derivatives
    name: First and Second Derivative Analysis
    core: false                # curve-sketching synthesis capstone
    difficulty: 0.65
    drill: false
    answer_kind: numeric
    expected_time_secs: 240
    prerequisites:
      - id: increasing-decreasing-intervals
        weight: 0.7
        key: true
      - id: concavity-inflection-points
        weight: 0.7
        key: true
      - id: second-derivative-test
        weight: 0.5
      - id: critical-points-extrema
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: Full feature analysis of a cubic
        key_prerequisites: [increasing-decreasing-intervals, concavity-inflection-points]
        exemplars:
          - problem: 'Find the local maximum point of the graph of $f(x) = x^3 - 12x$.'
            answer: '(-2, 16)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'The derivative is $f''(x) = 3x^2 - 12 = 3(x - 2)(x + 2)$, which is positive for $x < -2$ and negative between $-2$ and $2$. So $f$ rises and then falls at $x = -2$, a local maximum, and $f(-2) = -8 + 24 = 16$. The point is $(-2, 16)$.'
          - problem: 'Find the inflection point of the graph of $f(x) = x^3 - 3x^2 - 9x + 5$.'
            answer: '(1, -6)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'The second derivative is $f''''(x) = 6x - 6$, which is negative for $x < 1$ and positive for $x > 1$. The concavity changes at $x = 1$, and $f(1) = 1 - 3 - 9 + 5 = -6$. So the inflection point is $(1, -6)$.'
          - problem: 'Find the critical points of $f(x) = x^3 + 6x^2 + 9x$.'
            answer: '-3, -1'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The derivative is $f''(x) = 3x^2 + 12x + 9 = 3(x + 1)(x + 3)$. It is zero at $x = -1$ and at $x = -3$, so these are the critical points.'
          - problem: 'On which values of $x$ is $f(x) = x^3 - 6x^2 + 9x$ decreasing?'
            answer: '1 < x < 3'
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'The derivative is $f''(x) = 3x^2 - 12x + 9 = 3(x - 1)(x - 3)$. It is negative between the zeros $1$ and $3$, and positive outside them, so $f$ is decreasing for $1 < x < 3$.'
          - problem: 'A town''s population, in thousands, is $P(t) = t^3 - 12t^2 + 36t + 10$ at $t$ years after 2020, for $0 \le t \le 8$. For which values of $t$ is the population decreasing?'
            answer: '2 < t < 6'
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'The derivative is $P''(t) = 3t^2 - 24t + 36 = 3(t - 2)(t - 6)$. It is negative between $t = 2$ and $t = 6$, so the population is decreasing for $2 < t < 6$.'
          - problem: 'The total sales of a new phone, in hundreds, are $S(t) = -t^3 + 12t^2$ after $t$ months, for $0 \le t \le 8$. At what time are the sales growing fastest?'
            answer: '4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The rate of growth is $S''(t) = -3t^2 + 24t$. It is largest where its derivative $S''''(t) = -6t + 24$ is zero, which is at $t = 4$. The second derivative changes sign from positive to negative there, so $t = 4$ months is an inflection point of $S$ and the time of fastest growth.'
          - problem: 'Find the local maximum value of $f(x) = x^3 - 3x + 2$.'
            answer: '4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The derivative is $f''(x) = 3x^2 - 3 = 3(x - 1)(x + 1)$, which is positive for $x < -1$ and negative between $-1$ and $1$. So the local maximum is at $x = -1$, where $f(-1) = -1 + 3 + 2 = 4$.'
          - problem: 'Sam says that $f(x) = x^3 - 3x^2 + 2$ has a local minimum at $x = 0$ because $f''(0) = 0$. What is the correct local minimum value of $f$?'
            answer: '-2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The derivative is $f''(x) = 3x^2 - 6x = 3x(x - 2)$, which is positive for $x < 0$ and negative between $0$ and $2$. So $f$ has a local maximum at $x = 0$, not a minimum. The local minimum is at $x = 2$, where $f(2) = 8 - 12 + 2 = -2$.'
          - problem: 'Find the local minimum point of the graph of $f(x) = x^3 + 3x^2 - 9x$.'
            answer: '(1, -5)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'The derivative is $f''(x) = 3x^2 + 6x - 9 = 3(x + 3)(x - 1)$, which is negative between $-3$ and $1$ and positive for $x > 1$. So the local minimum is at $x = 1$, where $f(1) = 1 + 3 - 9 = -5$. The point is $(1, -5)$.'
          - problem: 'Find the inflection point of the graph of $f(x) = x^3 + 6x^2 + 9x$.'
            answer: '(-2, -2)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'The second derivative is $f''''(x) = 6x + 12 = 6(x + 2)$, which is negative for $x < -2$ and positive for $x > -2$. The concavity changes at $x = -2$, and $f(-2) = -8 + 24 - 18 = -2$. So the inflection point is $(-2, -2)$.'
          - problem: 'On which values of $x$ is $f(x) = 2x^3 - 3x^2 - 12x$ increasing?'
            answer: 'x < -1 or x > 2'
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'The derivative is $f''(x) = 6x^2 - 6x - 12 = 6(x - 2)(x + 1)$. It is positive outside the zeros $-1$ and $2$, and negative between them, so $f$ is increasing for $x < -1$ or $x > 2$.'
      - id: kp2
        name: Full feature analysis of a quartic
        key_prerequisites: [increasing-decreasing-intervals, concavity-inflection-points, second-derivative-test]
        exemplars:
          - problem: 'Find the local minimum value of $f(x) = x^4 - 8x^2$.'
            answer: '-16'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The derivative is $f''(x) = 4x^3 - 16x = 4x(x - 2)(x + 2)$, so the critical points are $x = -2$, $x = 0$ and $x = 2$. Since $f''''(x) = 12x^2 - 16$ is $32 > 0$ at $x = \pm 2$, these are local minima, and $f(\pm 2) = 16 - 32 = -16$.'
          - problem: 'Find the x-coordinates of the inflection points of the graph of $f(x) = x^4 - 3x^2 + 2$.'
            answer: '-sqrt(2)/2, sqrt(2)/2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The second derivative is $f''''(x) = 12x^2 - 6$, which is zero when $x^2 = \frac{1}{2}$, so $x = \pm \frac{\sqrt{2}}{2}$. The sign of $f''''$ is positive for $|x| > \frac{\sqrt{2}}{2}$ and negative inside, so the concavity changes at both points.'
          - problem: 'Find the local maximum point of the graph of $f(x) = x^4 - 4x^2 + 1$.'
            answer: '(0, 1)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'The derivative is $f''(x) = 4x^3 - 8x = 4x(x^2 - 2)$, so the critical points are $x = 0$ and $x = \pm\sqrt{2}$. Since $f''''(0) = -8 < 0$, the point $x = 0$ is a local maximum, and $f(0) = 1$. The point is $(0, 1)$.'
          - problem: 'On which values of $x$ is the graph of $f(x) = x^4 - 6x^2$ concave up?'
            answer: 'x < -1 or x > 1'
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'The second derivative is $f''''(x) = 12x^2 - 12 = 12(x - 1)(x + 1)$. It is positive when $x < -1$ or $x > 1$, so the graph is concave up for $x < -1$ or $x > 1$.'
          - problem: 'A particle moves along a line, and its potential energy at position $x$ metres is $U(x) = x^4 - 4x^2$ joules. What is the smallest value of the energy?'
            answer: '-4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The derivative is $U''(x) = 4x^3 - 8x = 4x(x^2 - 2)$, so the critical points are $x = 0$ and $x = \pm\sqrt{2}$. At $x = 0$ we have $U''''(0) = -8 < 0$, a local maximum. At $x = \pm\sqrt{2}$ we have $U''''(\pm\sqrt{2}) = 16 > 0$, so these are local minima, with $U(\pm\sqrt{2}) = 4 - 8 = -4$. For large $|x|$ the energy grows, so the smallest energy is $-4$ joules.'
          - problem: 'A thin metal strip lies along the curve $y = 4x^2 - x^4$, with $x$ and $y$ in centimetres. Find the positive x-coordinate at which the strip changes its concavity.'
            answer: 'sqrt(6)/3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The second derivative is $y'''' = 8 - 12x^2$, which is zero when $x^2 = \frac{2}{3}$, so $x = \pm\frac{\sqrt{6}}{3}$. The sign of $y''''$ is positive for $|x| < \frac{\sqrt{6}}{3}$ and negative outside, so the concavity changes at the positive value $\frac{\sqrt{6}}{3}$ centimetres.'
          - problem: 'Sam says that the graph of $f(x) = x^4$ has an inflection point at $x = 0$ because $f''''(0) = 0$. Is Sam right?'
            answer: 'no'
            answer_contract: {"kind":"label","options":[["yes","he is right","yes he is","yes, he is","Sam is right","yes, Sam is right","he is","right"],["no","he is not right","no he is not","no, he is not","Sam is not right","no, Sam is not right","he is not","not right"]]}
            solution_sketch: 'The second derivative is $f''''(x) = 12x^2$. It is zero at $x = 0$ but positive on both sides, so the concavity does not change. There is no inflection point at $x = 0$, so Sam is not right.'
          - problem: 'Find the local minimum value of $f(x) = x^4 - 5x^2 + 4$.'
            answer: '-9/4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The derivative is $f''(x) = 4x^3 - 10x = 2x(2x^2 - 5)$, so the local minima are at $x^2 = \frac{5}{2}$, because $f''''(x) = 12x^2 - 10 = 20 > 0$ there. The value is $f = \frac{25}{4} - \frac{25}{2} + 4 = -\frac{9}{4}$.'
          - problem: 'Find the x-coordinates of the inflection points of the graph of $f(x) = x^4 - 2x^2$.'
            answer: '-sqrt(3)/3, sqrt(3)/3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The second derivative is $f''''(x) = 12x^2 - 4$, which is zero when $x^2 = \frac{1}{3}$, so $x = \pm\frac{\sqrt{3}}{3}$. The sign of $f''''$ changes from positive to negative to positive across these points, so both are inflection points.'
          - problem: 'On which values of $x$ is the graph of $f(x) = x^4 - 2x^3$ concave down?'
            answer: '0 < x < 1'
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'The second derivative is $f''''(x) = 12x^2 - 12x = 12x(x - 1)$. It is negative between its zeros $0$ and $1$, so the graph is concave down for $0 < x < 1$.'
      - id: kp3
        name: Reconstruct features from f'
        key_prerequisites: [increasing-decreasing-intervals, second-derivative-test]
        exemplars:
          - problem: 'The derivative of $f$ is $f''(x) = (x + 1)(x - 2)^2$. At which values of $x$ does $f$ have a local extremum?'
            answer: '-1'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The zeros of $f''$ are $x = -1$ and $x = 2$. Since $(x - 2)^2$ is never negative, the sign of $f''$ is the sign of $x + 1$: negative for $x < -1$ and positive after. So $f''$ changes sign only at $x = -1$, a local minimum, and there is no extremum at $x = 2$.'
          - problem: 'The derivative of $f$ is $f''(x) = x(x - 3)$. On which values of $x$ is $f$ decreasing?'
            answer: '0 < x < 3'
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'The zeros of $f''$ are $x = 0$ and $x = 3$. The product $x(x - 3)$ is negative between $0$ and $3$, so $f$ is decreasing for $0 < x < 3$.'
          - problem: 'The derivative of $f$ is $f''(x) = (x + 3)(x - 1)$. At which value of $x$ does $f$ have a local maximum?'
            answer: '-3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The zeros of $f''$ are $x = -3$ and $x = 1$. The product is positive for $x < -3$, negative between $-3$ and $1$, and positive for $x > 1$. The sign changes from positive to negative at $x = -3$, so the local maximum is at $x = -3$.'
          - problem: 'The derivative of $f$ is $f''(x) = (x - 1)(x - 4)$. On which values of $x$ is $f$ increasing?'
            answer: 'x < 1 or x > 4'
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'The zeros of $f''$ are $x = 1$ and $x = 4$. The product is positive for $x < 1$ and for $x > 4$, and negative between them, so $f$ is increasing for $x < 1$ or $x > 4$.'
          - problem: 'The derivative of $f$ is $f''(x) = (x + 1)(x - 6)$. Find the x-coordinate of the inflection point of the graph of $f$.'
            answer: '5/2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Expanding gives $f''(x) = x^2 - 5x - 6$, so $f''''(x) = 2x - 5$. This is zero at $x = \frac{5}{2}$, and it changes sign from negative to positive there. So the inflection point is at $x = \frac{5}{2}$.'
          - problem: 'The derivative of $f$ is $f''(x) = (x + 2)(x - 4)$. On which values of $x$ is the graph of $f$ concave up?'
            answer: 'x > 1'
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'The graph is concave up where $f''$ is increasing, that is where $f''''$ is positive. Expanding gives $f''(x) = x^2 - 2x - 8$, so $f''''(x) = 2x - 2$, which is positive for $x > 1$.'
          - problem: 'A particle moves along a line, and its velocity is $v(t) = (t - 1)(t - 5)$ metres per second at time $t > 0$ seconds. At what time does the particle reach a local maximum position?'
            answer: '1'
            answer_contract: {"kind":"unit","quantity":"time","unit":"s","allow_omitted":true}
            solution_sketch: 'The position $s$ satisfies $s''(t) = v(t)$, and $v$ is zero at $t = 1$ and $t = 5$. The velocity is positive for $t < 1$ and negative between $1$ and $5$, so the position rises and then falls at $t = 1$. The local maximum position is at $t = 1$ second.'
          - problem: 'The rate of change of a firm''s profit is $P''(t) = (t - 2)(t - 6)^2$ thousand dollars per month at time $t > 0$ months. At what time does the profit stop falling and start rising?'
            answer: '2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The zeros of $P''$ are $t = 2$ and $t = 6$. Since $(t - 6)^2$ is never negative, the sign of $P''$ is the sign of $t - 2$: negative before $t = 2$ and positive after. So the profit changes from falling to rising at $t = 2$ months, and nothing changes at $t = 6$.'
          - problem: 'Sam is told that $f''(x) = x^2(x - 4)$, and says that $f$ has a local minimum at $x = 0$ because $f''(0) = 0$. At which value of $x$ does $f$ have a local minimum?'
            answer: '4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The zeros of $f''$ are $x = 0$ and $x = 4$. Since $x^2 \ge 0$, the sign of $f''$ is the sign of $x - 4$, which is negative on both sides of $0$. So $f''$ does not change sign at $0$, and the sign changes from negative to positive only at $x = 4$, the local minimum.'
    diagnostic_exemplar:
