unit: applications-differentiation
course: calculus-1
module: "Applications of Differentiation"
topics:
  - id: motion-along-a-line
    name: Motion Along a Line
    core: false                # cone {net-change-total-distance, parametric-motion} now supplemental
    difficulty: 0.6
    drill: false
    answer_kind: numeric
    expected_time_secs: 180
    prerequisites:
      - id: derivative-power-rule
        weight: 0.7
        key: true
      - id: higher-order-derivatives
        weight: 0.6
        key: true
      - id: average-instantaneous-rate
        weight: 0.4
      - id: quadratic-equations-factoring
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: Velocity and acceleration from position
        key_prerequisites: [derivative-power-rule, higher-order-derivatives]
        exemplars:
          - problem: 'For $s(t) = t^2 - 4t + 3$, find $v(2)$.'
            answer: "0"
            solution_sketch: '$v(t) = 2t - 4$; $v(2) = 0$.'
          - problem: "A particle moves along a line with position s(t) = 3t^3 - 2t^2 + 5t - 1 (meters, seconds). Find the velocity v(t) and the acceleration a(t) as functions of t."
            answer: "v = 9t^2-4t+5; a = 18t-4"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "function", "vars": ["t"]}, "name": "v"}, {"contract": {"kind": "function", "vars": ["t"]}, "name": "a"}]}
            solution_sketch: "The position is s(t) = 3t^3 - 2t^2 + 5t - 1. Differentiate term by term with the power rule to get the velocity: v(t) = 9t^2 - 4t + 5. Differentiate again with the power rule to get the acceleration: a(t) = 18t - 4. The answer is v = 9t^2-4t+5; a = 18t-4."
          - problem: "A particle moves along a line with position s(t) = t^3 - 2t^2 + t (meters, seconds). Find its velocity at t = 3."
            answer: "16"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The position is s(t) = t^3 - 2t^2 + t. Differentiate by the power rule: v(t) = 3t^2 - 4t + 1. Substitute t = 3: v(3) = 16."
          - problem: "A particle moves along a line with position s(t) = 2t^3 - 5t^2 + 4t - 1 (meters, seconds). Find its acceleration at t = 2."
            answer: "14"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The position is s(t) = 2t^3 - 5t^2 + 4t - 1. Differentiate twice by the power rule: v(t) = 6t^2 - 10t + 4 and a(t) = 12t - 10. Substitute t = 2: a(2) = 14."
          - problem: "A particle moves along a line with position s(t) = 3t^4 - 2t^2 + 7t (meters, seconds). Find the velocity v(t) as a function of t."
            answer: "12t^3-4t+7"
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: "The position is s(t) = 3t^4 - 2t^2 + 7t. Differentiate by the power rule and sum rule: v(t) = 12t^3 - 4t + 7. The velocity is 12t^3 - 4t + 7."
          - problem: "A particle moves along a line with position s(t) = t^4 - 6t^2 + 2t (meters, seconds). Find the acceleration a(t) as a function of t."
            answer: "12t^2-12"
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: "The position is s(t) = t^4 - 6t^2 + 2t. Differentiate twice by the power rule: v(t) = 4t^3 - 12t + 2 and a(t) = 12t^2 - 12. The acceleration is 12t^2 - 12."
        constraints: "polynomial position functions with integer coefficients"
      - id: kp2
        name: At rest and direction of motion
        key_prerequisites: [derivative-power-rule, quadratic-equations-factoring]
        exemplars:
          - problem: 'For $s(t) = t^3 - 6t^2 + 9t$, on what interval (for $t > 0$) is the particle moving left?'
            answer: "(1, 3)"
            solution_sketch: '$v = 3(t-1)(t-3) < 0$ exactly between the roots.'
          - problem: "For s(t) = t^3 - 6t^2 + 9t, find the sum of the positive times when the particle is at rest."
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Velocity is the derivative: v(t) = 3t^2 - 12t + 9. Factor by the quadratic factoring rule: v(t) = 3(t - 1)(t - 3), so the positive at-rest times are 1 and 3. The sum is 1 + 3 = 4."
          - problem: "A particle moves along a line with velocity v(t) = 3t^2 - 18t + 15 for t >= 0. Find the larger positive time when the particle is at rest."
            answer: "5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Velocity is given as v(t) = 3t^2 - 18t + 15. Factor by the quadratic factoring rule: v(t) = 3(t - 1)(t - 5). The positive at-rest times are 1 and 5, so the larger time is 5."
          - problem: "A particle has position s(t) = 2t^3 - 24t^2 + 72t for t >= 0. On what interval is the particle moving left? Give the answer as an inequality in t."
            answer: "2 < t < 6"
            answer_contract: {"kind": "inequality_union"}
            solution_sketch: "Velocity is the derivative: v(t) = 6t^2 - 48t + 72. Factor by the quadratic factoring rule: v(t) = 6(t - 2)(t - 6). The velocity is negative between the roots, so the particle moves left on 2 < t < 6."
          - problem: "A particle moves along a line with velocity v(t) = -t^2 + 5t - 4 for t > 0. State the interval of positive time when the particle is moving right. Give the answer as an inequality in t."
            answer: "1 < t < 4"
            answer_contract: {"kind": "inequality_union"}
            solution_sketch: "Velocity is given as v(t) = -t^2 + 5t - 4. Factor by the quadratic factoring rule: v(t) = -(t - 1)(t - 4). The velocity is positive between the roots, so for t > 0 the particle moves right on 1 < t < 4."
          - problem: "A particle has position s(t) = 3t^3 - 36t^2 + 63t for t >= 0. Find the later positive time when the particle is at rest."
            answer: "7"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Velocity is the derivative: v(t) = 9t^2 - 72t + 63. Factor by the quadratic factoring rule: v(t) = 9(t - 1)(t - 7). The positive at-rest times are 1 and 7, so the later time is 7."
        constraints: "v(t) factors over the integers; at-rest times are positive integers"
      - id: kp3
        name: Speeding up or slowing down
        key_prerequisites: [higher-order-derivatives, derivative-power-rule]
        exemplars:
          - problem: "A particle moves along a line with position s(t) = t^3 - 3t^2 - 24t + 5 meters at time t seconds. Its velocity is v(t) = s'(t) and its acceleration is a(t) = s''(t). At t = 5, state whether the particle is speeding up or slowing down, and give the value of v(t) a(t)."
            answer: "verdict = increasing; va = 504"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["increasing"], ["decreasing"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "va"}]}
            solution_sketch: "The position is s(t) = t^3 - 3t^2 - 24t + 5. By the power rule, v(t) = 3t^2 - 6t - 24, and a second differentiation gives a(t) = 6t - 6. At t = 5, v(5) = 21 and a(5) = 24, so v(5) a(5) = 504. Both factors are positive, so the speed is increasing and the particle is speeding up; the wrong option decreasing would require velocity and acceleration to have opposite signs. So verdict = increasing; va = 504."
          - problem: "A particle moves along a line with position s(t) = t^3 - 9t^2 + 15t meters at time t seconds. Its velocity is v(t) = s'(t) and its acceleration is a(t) = s''(t). At t = 4, state whether the particle is speeding up or slowing down, and give the value of v(t) a(t)."
            answer: "verdict = decreasing; va = -54"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["increasing"], ["decreasing"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "va"}]}
            solution_sketch: "The position is s(t) = t^3 - 9t^2 + 15t. By the power rule, v(t) = 3t^2 - 18t + 15, and differentiating again gives a(t) = 6t - 18. At t = 4, v(4) = -9 and a(4) = 6, so v(4) a(4) = -54. The signs are opposite, so the speed is decreasing and the particle is slowing down; the wrong option increasing would require same signs. So verdict = decreasing; va = -54."
          - problem: "A particle travels on a straight line with position s(t) = t^3 + 3t^2 - 24t meters at time t seconds. Its velocity is v(t) = s'(t) and its acceleration is a(t) = s''(t). At t = 1, state whether the particle is speeding up or slowing down, and give the value of v(t) a(t)."
            answer: "verdict = decreasing; va = -180"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["increasing"], ["decreasing"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "va"}]}
            solution_sketch: "The position is s(t) = t^3 + 3t^2 - 24t. By the power rule, v(t) = 3t^2 + 6t - 24, and a second differentiation gives a(t) = 6t + 6. At t = 1, v(1) = -15 and a(1) = 12, so v(1) a(1) = -180. Opposite signs mean the particle is slowing down, that is, the speed is decreasing; the wrong option increasing would mean the signs agree. So verdict = decreasing; va = -180."
          - problem: "A toy car moves along a straight track with position s(t) = t^3 - 6t^2 - 15t centimeters at time t seconds. Its velocity is v(t) = s'(t) and its acceleration is a(t) = s''(t). At t = 1, state whether the car is speeding up or slowing down, and give the value of v(t) a(t)."
            answer: "verdict = increasing; va = 144"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["increasing"], ["decreasing"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "va"}]}
            solution_sketch: "The position is s(t) = t^3 - 6t^2 - 15t. By the power rule, v(t) = 3t^2 - 12t - 15, and differentiating again gives a(t) = 6t - 12. At t = 1, v(1) = -24 and a(1) = -6, so v(1) a(1) = 144. Both factors are negative, so the speed is increasing and the car is speeding up; the wrong option decreasing would mean the signs disagree. So verdict = increasing; va = 144."
          - problem: "A particle moves along a line with velocity v(t) = t^2 - 6t + 8 meters per second at time t seconds, and its acceleration is a(t) = v'(t). At t = 5, find the value of v(t) a(t)."
            answer: "12"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The velocity is v(t) = t^2 - 6t + 8. By the power rule, a(t) = v'(t) = 2t - 6. At t = 5, v(5) = 3 and a(5) = 4, so the product is 3 times 4. So v(t) a(t) = 12."
          - problem: "Along a coordinate line, a particle has position s(t) = t^3 + 3t^2 - 45t meters at time t seconds. Its velocity is v(t) = s'(t) and its acceleration is a(t) = s''(t). At t = 2, find the value of v(t) a(t)."
            answer: "-378"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The position is s(t) = t^3 + 3t^2 - 45t. By the power rule, v(t) = 3t^2 + 6t - 45, and a second differentiation gives a(t) = 6t + 6. At t = 2, v(2) = -21 and a(2) = 18, and the product of these two values is the requested quantity. So v(t) a(t) = -378."
        constraints: "test times where neither v nor a is zero"
    diagnostic_exemplar:
      problem: 'A particle has position $s(t) = t^3 - 9t^2 + 24t$ (meters, seconds). Is it speeding up or slowing down at $t = 1$?'
      answer: "slowing down — v(1) = 9 > 0 but a(1) = -12 < 0 (opposite signs)"
      answer_contract: {kind: none}
      solution_sketch: '$v(t) = 3t^2 - 18t + 24$, $v(1) = 9$; $a(t) = 6t - 18$, $a(1) = -12$.'
    anki_seeds:
      - front: "Position s(t): velocity = ? and acceleration = ?"
        back: "v(t) = s'(t); a(t) = v'(t) = s''(t)"
        type: basic
      - front: "A particle speeds up when v and a have ___ signs and slows down when they have ___ signs."
        back: "the same; opposite"
        type: basic
      - front: "Speed is related to velocity by..."
        back: "speed = |v(t)| — always nonnegative"
        type: basic

  - id: related-rates-setup
    name: Related Rates - Circles, Spheres, and Tanks
    core: false                # feeds only related-rates; same applications branch
    difficulty: 0.6
    drill: false
    answer_kind: numeric
    expected_time_secs: 210
    prerequisites:
      - id: implicit-differentiation
        weight: 0.8
        key: true
      - id: chain-rule
        weight: 0.5
        key: true
      - id: circle-area-circumference
        weight: 0.4
        key: true
      - id: volume-prisms-cylinders
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: Growing circles
        key_prerequisites: [implicit-differentiation, circle-area-circumference]
        exemplars:
          - problem: 'The radius of a circle grows at $2$ cm/s. How fast is the area $A = \pi r^2$ growing when $r = 5$ cm?'
            answer: "20π cm²/s"
            solution_sketch: '$\frac{dA}{dt} = 2\pi r \frac{dr}{dt} = 2\pi \cdot 5 \cdot 2 = 20\pi$.'
          - problem: 'The radius of a circle grows at $3$ cm/s. How fast is the circumference $C = 2\pi r$ growing?'
            answer: "6π cm/s"
            solution_sketch: '$\frac{dC}{dt} = 2\pi \frac{dr}{dt} = 6\pi$ — independent of $r$.'
          - problem: "A circle's radius grows at 4 cm/s. Using A = πr^2, find how fast the area is growing when r = 6 cm, as an exact multiple of π in cm²/s."
            answer: "48pi"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Start with A = πr^2. Differentiate with respect to t by the chain rule: dA/dt = 2πr dr/dt. Substitute r = 6 and dr/dt = 4: dA/dt = 2π(6)(4) = 48π. The area rate is 48pi."
          - problem: "A circle's radius grows at 5 cm/s. Using C = 2πr, find the rate at which its circumference is growing, as an exact multiple of π in cm/s."
            answer: "10pi"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Start with C = 2πr. Differentiate with respect to t by the chain rule: dC/dt = 2π dr/dt. Substitute dr/dt = 5: dC/dt = 2π(5) = 10π. The circumference rate is 10pi."
          - problem: "A circle's circumference grows at 16π cm/s while its radius is 4 cm. Using A = πr^2 and C = 2πr, find how fast the area is growing, as an exact multiple of π in cm²/s."
            answer: "64pi"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Start with C = 2πr and A = πr^2. Differentiate C by the chain rule: dC/dt = 2π dr/dt, so 16π = 2π dr/dt and dr/dt = 8. Differentiate A by the chain rule: dA/dt = 2πr dr/dt. Substitute r = 4 and dr/dt = 8: dA/dt = 2π(4)(8) = 64π. The area rate is 64pi."
          - problem: "A circle's diameter grows at 6 cm/s. Using A = πr^2 and r = d/2, find how fast the area is growing when the radius is 4 cm, as an exact multiple of π in cm²/s."
            answer: "24pi"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Start with A = πr^2 and the relation r = d/2, so dr/dt = (1/2) dd/dt = 3 by the chain rule. Differentiate A: dA/dt = 2πr dr/dt. Substitute r = 4 and dr/dt = 3: dA/dt = 2π(4)(3) = 24π. The area rate is 24pi."
        constraints: "give the geometric formula in the problem; integer rates and radii; answers as exact multiples of π with units"
      - id: kp2
        name: Growing spheres
        key_prerequisites: [implicit-differentiation, chain-rule]
        exemplars:
          - problem: 'A spherical balloon''s radius grows at $1$ cm/s. Using $V = \frac{4}{3}\pi r^3$, how fast is the volume growing when $r = 3$ cm?'
            answer: "36π cm³/s"
            solution_sketch: '$\frac{dV}{dt} = 4\pi r^2 \frac{dr}{dt} = 4\pi \cdot 9 \cdot 1 = 36\pi$.'
          - problem: 'A sphere''s radius grows at $2$ cm/s. Using the surface area $S = 4\pi r^2$, how fast is $S$ growing when $r = 5$ cm?'
            answer: "80π cm²/s"
            solution_sketch: '$\frac{dS}{dt} = 8\pi r \frac{dr}{dt} = 8\pi \cdot 5 \cdot 2 = 80\pi$.'
          - problem: "A spherical balloon's radius grows at 3 cm/s. The volume is V = (4/3)pi r^3. Find how fast the volume is growing when r = 2 cm; give the answer as a multiple of pi."
            answer: "48pi"
            answer_contract: {"kind": "exact"}
            solution_sketch: "State the volume formula: V = (4/3)pi r^3. Differentiate with respect to time by the chain rule: dV/dt = 4pi r^2 dr/dt. Substitute r = 2 and dr/dt = 3: dV/dt = 4pi*4*3 = 48pi. The volume grows at 48pi cm^3/s, so the answer is 48pi."
          - problem: "A sphere's radius grows at 3 cm/s. The surface area is S = 4pi r^2. Find how fast the surface area is growing when r = 4 cm; give the answer as a multiple of pi."
            answer: "96pi"
            answer_contract: {"kind": "exact"}
            solution_sketch: "State the surface area formula: S = 4pi r^2. Differentiate by the power rule and chain rule: dS/dt = 8pi r dr/dt. Substitute r = 4 and dr/dt = 3: dS/dt = 8pi*4*3 = 96pi. The surface area grows at 96pi cm^2/s, so the answer is 96pi."
          - problem: "A sphere's volume grows at 100pi cm^3/s. The volume is V = (4/3)pi r^3. Find how fast the radius is growing when r = 5 cm; give the answer as a number."
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "State the volume formula: V = (4/3)pi r^3. Differentiate by the chain rule: dV/dt = 4pi r^2 dr/dt. Substitute r = 5 and dV/dt = 100pi: 100pi = 4pi*25*dr/dt = 100pi dr/dt. Thus dr/dt = 1, so the answer is 1."
          - problem: "A sphere's surface area grows at 64pi cm^2/s. The surface area is S = 4pi r^2 and the volume is V = (4/3)pi r^3. Find how fast the volume is growing when r = 4 cm; give the answer as a multiple of pi."
            answer: "128pi"
            answer_contract: {"kind": "exact"}
            solution_sketch: "State the surface area formula: S = 4pi r^2. Differentiate by the chain rule: dS/dt = 8pi r dr/dt. Substitute r = 4 and dS/dt = 64pi: 64pi = 8pi*4*dr/dt = 32pi dr/dt, so dr/dt = 2. Then state the volume formula V = (4/3)pi r^3 and differentiate: dV/dt = 4pi r^2 dr/dt. Substitute r = 4 and dr/dt = 2: dV/dt = 4pi*16*2 = 128pi. The volume grows at 128pi cm^3/s, so the answer is 128pi."
        constraints: "state the volume/surface formula; differentiate before substituting values"
      - id: kp3
        name: Filling tanks with constant cross-section
        key_prerequisites: [implicit-differentiation, volume-prisms-cylinders]
        exemplars:
          - problem: 'A rectangular pool with base $4$ m by $5$ m fills at $10$ m³/h. How fast does the depth rise?'
            answer: "1/2 m/h"
            solution_sketch: '$V = 20h$, so $\frac{dh}{dt} = \frac{10}{20} = \frac{1}{2}$.'
          - problem: "Water pours into a cylindrical tank of radius $3$ m at $18\\pi$ m^3/min. Using $V = \\pi r^2 h$, find how fast the water level is rising in m/min."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: Write the volume, V = pi r^2 h = 9pi h. Step 2: Differentiate with respect to time; the constant cross-section rule gives dV/dt = 9pi dh/dt. Step 3: Substitute dV/dt = 18pi and solve, so dh/dt = 2. The water level rises at 2 m/min."
          - problem: "A rectangular aquarium is $6$ m long and $2$ m wide. Water flows in at $3$ m^3 per minute. Find the speed at which the water surface climbs, as a fraction in m/min."
            answer: "1/4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: The base area is A = 6*2 = 12 m^2, so V = 12h. Step 2: Differentiate using the constant cross-section rule: dV/dt = 12 dh/dt. Step 3: Substitute dV/dt = 3, giving 3 = 12 dh/dt, so dh/dt = 1/4. The water surface climbs at 1/4 m/min."
          - problem: "A cylindrical rain barrel of radius $2$ m collects stormwater at $20\\pi$ m^3/h. Use $V = \\pi r^2 h$ to determine the rate at which the water level rises in m/h."
            answer: "5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: The volume is V = pi r^2 h = 4pi h. Step 2: Differentiate with respect to t; the constant cross-section relation is dV/dt = 4pi dh/dt. Step 3: Put dV/dt = 20pi, so 20pi = 4pi dh/dt and dh/dt = 5. The water level rises at 5 m/h."
          - problem: "A concrete form has a flat rectangular base measuring $3$ m by $7$ m. A pump adds water at $14$ m^3/min. Determine how fast the water depth increases in m/min, as a fraction."
            answer: "2/3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: The base area is A = 3*7 = 21 m^2, so V = 21h. Step 2: Differentiate using the constant cross-section rule: dV/dt = 21 dh/dt. Step 3: Set dV/dt = 14, so 14 = 21 dh/dt and dh/dt = 2/3. The water depth increases at 2/3 m/min."
          - problem: "A cylindrical tank of radius $2$ m must have its water level rise at $3$ m/min. Using $V = \\pi r^2 h$, find the volume inflow rate in m^3/min, as a multiple of pi."
            answer: "12pi"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: For radius 2 the volume is V = pi r^2 h = 4pi h. Step 2: Differentiate with respect to time; the constant cross-section rule gives dV/dt = 4pi dh/dt. Step 3: Substitute dh/dt = 3, so dV/dt = 4pi*3 = 12pi. The volume inflow rate is 12pi m^3/min."
        constraints: "constant cross-section (cylinder or prism) so dV/dt = (base area)·dh/dt; exact answers"
    diagnostic_exemplar:
      problem: 'Water pours into a cylindrical tank of radius $2$ m at $12$ m³/min. Using $V = \pi r^2 h$, how fast is the water level rising?'
      answer: "3/π m/min"
      answer_contract: {kind: none}
      solution_sketch: '$V = 4\pi h$, so $\frac{dV}{dt} = 4\pi \frac{dh}{dt} = 12$ gives $\frac{dh}{dt} = \frac{3}{\pi}$.'
    anki_seeds:
      - front: "Related-rates procedure in four steps:"
        back: "write an equation relating the quantities; differentiate both sides in t; substitute known values and rates; solve for the unknown rate"
        type: basic
      - front: "In related rates, when do you substitute the specific values (like r = 5)?"
        back: "Only AFTER differentiating — substituting first kills the variable's rate"
        type: basic

  - id: related-rates
    name: Related Rates
    core: false                # applied word-problem genre
    difficulty: 0.7
    drill: false
    answer_kind: numeric
    expected_time_secs: 270
    prerequisites:
      - id: related-rates-setup
        weight: 0.8
        key: true
      - id: pythagorean-theorem
        weight: 0.5
        key: true
      - id: similar-triangles
        weight: 0.4
        key: true
      - id: implicit-differentiation
        weight: 0.5
      - id: product-quotient-rules
        weight: 0.3
      - id: volume-pyramids-cones-spheres
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: Sliding ladders and separating travelers (Pythagorean setups)
        key_prerequisites: [related-rates-setup, pythagorean-theorem]
        exemplars:
          - problem: 'One car drives north at $60$ km/h, another east at $80$ km/h, both from the same point. How fast is the distance between them growing when the northbound car is $30$ km and the eastbound car $40$ km from the start?'
            answer: "100 km/h"
            solution_sketch: '$s^2 = x^2 + y^2$ with $s = 50$; $s\frac{ds}{dt} = x\frac{dx}{dt} + y\frac{dy}{dt} = 40 \cdot 80 + 30 \cdot 60 = 5000$, so $\frac{ds}{dt} = 100$.'
          - problem: "A 13 m ladder leans against a vertical wall. Its base slides away from the wall at 3 m/s. Let x be the distance from the wall to the base and y the height of the top of the ladder, both in metres. Find dy/dt in m/s when x = 5 as a fraction."
            answer: "-5/4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Set up x^2 + y^2 = 13^2. Differentiate implicitly: 2x dx/dt + 2y dy/dt = 0. At x = 5, y = 12. Substitute 2(5)(3) + 2(12) dy/dt = 0, so 30 + 24 dy/dt = 0. Solve: dy/dt = -30/24 = -5/4. The rate is -5/4 m/s."
          - problem: "Two cyclists start from the same point at the same time. One rides north at 6 m/s and the other east at 8 m/s. Let x be the distance east and y the distance north, both in metres. Find the rate at which the distance between them is increasing, in m/s, when x = 12 and y = 9."
            answer: "10"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Set s^2 = x^2 + y^2 with x = 12 and y = 9, so s = 15. Differentiate: 2s ds/dt = 2x dx/dt + 2y dy/dt. Substitute: 2(15) ds/dt = 2(12)(8) + 2(9)(6) = 192 + 108 = 300. Then ds/dt = 300/30 = 10. The rate is 10 m/s."
          - problem: "A 10 m ladder leans against a vertical wall. Its top slides down the wall at 2 m/s. Let x be the distance from the wall to the base and y the height of the top of the ladder, both in metres. Find dx/dt in m/s when x = 6 as a fraction."
            answer: "8/3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Set x^2 + y^2 = 10^2. Differentiate: 2x dx/dt + 2y dy/dt = 0. At x = 6, y = 8. The top slides down, so dy/dt = -2. Substitute: 2(6) dx/dt + 2(8)(-2) = 0, so 12 dx/dt - 32 = 0. Solve: dx/dt = 32/12 = 8/3. The rate is 8/3 m/s."
          - problem: "Two hikers leave a trailhead at the same time. One walks north at 4 km/h and the other walks east at 7 km/h. Let x be the distance east and y the distance north, both in km. Find the rate at which their straight-line distance is increasing, in km/h, when x = 20 and y = 15."
            answer: "8"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Set s^2 = x^2 + y^2 with x = 20 and y = 15, so s = 25. Differentiate: 2s ds/dt = 2x dx/dt + 2y dy/dt. Substitute: 2(25) ds/dt = 2(20)(7) + 2(15)(4) = 280 + 120 = 400. Then ds/dt = 400/50 = 8. The rate is 8 km/h."
          - problem: "Two people leave the same corner at the same time. One walks north at 5 km/h; the other walks east at an unknown constant speed v km/h. Their distance apart grows at 13 km/h when the northbound one is 3 km out and the eastbound one is 4 km out. Find v in km/h as a fraction."
            answer: "25/2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Set s^2 = x^2 + y^2 with x = 4 and y = 3, so s = 5. Differentiate: 2s ds/dt = 2x dx/dt + 2y dy/dt. Substitute ds/dt = 13, dx/dt = v, dy/dt = 5: 2(5)(13) = 2(4)v + 2(3)(5). This gives 130 = 8v + 30, so 8v = 100. Solve: v = 100/8 = 25/2. The speed is 25/2 km/h."
        constraints: "Pythagorean triples so all distances are integers; rates are integers or simple fractions"
      - id: kp2
        name: Conical tanks (similar-triangle substitution)
        key_prerequisites: [related-rates-setup, similar-triangles, volume-pyramids-cones-spheres]
        exemplars:
          - problem: "Water flows into an inverted conical tank at 6 m^3/min. The tank is 10 m deep and has top radius 5 m. Find how fast the water depth is rising when the depth is 2 m."
            answer: "6/pi"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The cone gives r = h/2 by similar triangles, so V = (pi/3)(h/2)^2 h = pi h^3/12. Differentiate with respect to time: dV/dt = (pi h^2/4) dh/dt. Substitute dV/dt = 6 and h = 2: 6 = pi dh/dt. The rate is 6/pi."
          - problem: "A pump delivers water at 12 m^3/min to a cone that is 6 m high with top radius 3 m. Compute the rate at which the water level climbs when the water is 2 m deep."
            answer: "12/pi"
            answer_contract: {"kind": "exact"}
            solution_sketch: "By similar triangles r = h/2, hence V = pi h^3/12. Differentiate: dV/dt = (pi h^2/4) dh/dt. At h = 2 this gives 12 = pi dh/dt, so dh/dt = 12/pi. The water level climbs at 12/pi."
          - problem: "An inverted cone is 8 m tall and has top radius 4 m. Water enters at 4 m^3/min. Find the rate at which the radius of the water surface is growing when the depth is 2 m."
            answer: "2/pi"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Similar triangles give r = h/2, and the volume is V = pi h^3/12. Differentiate: dV/dt = (pi h^2/4) dh/dt; with dV/dt = 4 and h = 2, dh/dt = 4/pi. Since r = h/2, dr/dt = (1/2) dh/dt. The radius grows at 2/pi."
          - problem: "A conical tank has height 12 m and top radius 6 m. Water depth increases at 1/(3pi) m/min. Find the volume rate of water entering the tank when the depth is 3 m as a fraction."
            answer: "3/4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "With r = h/2, the volume is V = pi h^3/12. Differentiate to get dV/dt = (pi h^2/4) dh/dt. Substitute h = 3 and dh/dt = 1/(3pi): dV/dt = (pi*9/4)*(1/(3pi)) = 3/4. The volume rate is 3/4."
          - problem: "A cone-shaped vessel has depth 9 m and top radius 3 m. Liquid is poured in at 5 m^3/min. Determine the speed at which the liquid level rises when the liquid is 3 m deep."
            answer: "5/pi"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Similar triangles give r = h/3, so V = (pi/3)(h/3)^2 h = pi h^3/27. Differentiate: dV/dt = (pi h^2/9) dh/dt. At h = 3, 5 = pi dh/dt, so dh/dt = 5/pi. The liquid level rises at 5/pi."
          - problem: "An inverted cone is 10 m high and its top radius is 5 m. Water enters at 3 m^3/min. Find the rate at which the depth increases when the depth is 5 m, and give the answer to 2 decimals."
            answer: "0.15"
            answer_contract: {"decimals": 2, "kind": "approx"}
            solution_sketch: "The cone has r = h/2 by similar triangles, so V = pi h^3/12. Differentiate: dV/dt = (pi h^2/4) dh/dt. Substitute dV/dt = 3 and h = 5: dh/dt = 12/(25pi), which is about 0.1528. Rounded to 2 decimals, the depth rate is 0.15."
        constraints: "cone dimensions give a simple ratio r = kh; eliminate r via similar triangles before differentiating"
      - id: kp3
        name: Shadows and multi-quantity setups
        key_prerequisites: [related-rates-setup, similar-triangles, product-quotient-rules]
        exemplars:
          - problem: 'A $2$ m person walks away from a $5$ m lamppost at $2$ m/s. How fast is the tip of the shadow moving?'
            answer: "10/3 m/s"
            solution_sketch: 'Similar triangles: $\frac{s}{2} = \frac{x + s}{5}$ gives $s = \frac{2}{3}x$; tip $= x + s = \frac{5}{3}x$, so tip speed $= \frac{5}{3} \cdot 2 = \frac{10}{3}$.'
          - problem: "A rectangular panel changes shape. Its length increases at 4 cm per second and its width decreases at 3 cm per second. At the moment the panel is 12 cm long and 5 cm wide, find the rate of change of its area in square centimeters per second."
            answer: "-16"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Write the area as A = l w. Differentiate with the product rule: dA/dt = (dl/dt) w + l (dw/dt). Substitute the values: (4)(5) + (12)(-3) = 20 - 36 = -16. The area is changing at -16 square centimeters per second."
          - problem: "A 3 m tall person walks straight away from an 8 m tall lamppost at 2 m per second. Find how fast the person's shadow length is growing in meters per second."
            answer: "6/5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Similar triangles give s/3 = (x + s)/8, where x is the distance from the lamppost and s is the shadow length. Cross multiply: 8s = 3x + 3s, so 5s = 3x and s = (3/5)x. Differentiate: ds/dt = (3/5)(dx/dt). Since dx/dt = 2, ds/dt = 6/5. The shadow length is growing at 6/5 meters per second."
          - problem: "A 4 m tall person walks away from a 10 m tall lamppost at 3 m per second. Find the speed of the tip of the person's shadow in meters per second."
            answer: "5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Similar triangles give s/4 = (x + s)/10, with x the person's distance from the post and s the shadow length. Cross multiply: 10s = 4x + 4s, so 6s = 4x and s = (2/3)x. The tip position is x + s = (5/3)x, so its speed is (5/3)(3) = 5. The shadow tip moves at 5 meters per second."
          - problem: "A rectangular box has constant height 5 cm. Its length grows at 2 cm per second and its width shrinks at 1 cm per second. At the instant the length is 3 cm and the width is 4 cm, find how fast the volume is changing in cubic centimeters per second."
            answer: "25"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Write the volume as V = l w h with h = 5. Differentiate: dV/dt = (dl/dt) w h + l (dw/dt) h. Substitute: (2)(4)(5) + (3)(-1)(5) = 40 - 15 = 25. The volume is changing at 25 cubic centimeters per second."
          - problem: "A rectangle's length grows at 5 cm per second and its width grows at 4 cm per second. When the length is 6 cm and the width is 7 cm, find the rate at which the area is growing in square centimeters per second."
            answer: "59"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Write the area as A = l w. The product rule gives dA/dt = (dl/dt) w + l (dw/dt). Substitute: (5)(7) + (6)(4) = 35 + 24 = 59. The area is growing at 59 square centimeters per second."
        constraints: "two changing quantities; similar-triangle or product-rule relationships; integer data"
    diagnostic_exemplar:
      problem: 'Water pours at $3$ m³/min into an inverted cone of height $8$ m and top radius $4$ m (so $r = h/2$ at depth $h$). How fast is the depth rising when $h = 4$ m?'
      answer: "3/(4π) m/min"
      answer_contract: {kind: none}
      solution_sketch: '$V = \frac{1}{3}\pi (h/2)^2 h = \frac{\pi h^3}{12}$; $\frac{dV}{dt} = \frac{\pi h^2}{4}\frac{dh}{dt}$; at $h = 4$: $3 = 4\pi \frac{dh}{dt}$.'
    anki_seeds:
      - front: "In a conical-tank problem, how do you get V in terms of h alone?"
        back: "use similar triangles (r = kh from the tank's dimensions) to eliminate r before differentiating"
        type: basic
      - front: "Ladder problem: relate x (base) and y (top) by..."
        back: "x² + y² = L² (L the ladder length, a constant)"
        type: basic

  - id: linearization
    name: Linearization and Differentials
    core: true
    difficulty: 0.6
    drill: false
    answer_kind: expression
    expected_time_secs: 150
    prerequisites:
      - id: derivative-power-rule
        weight: 0.7
        key: true
      - id: point-slope-standard-form
        weight: 0.5
        key: true
      - id: derivative-definition
        weight: 0.4
      - id: chain-rule
        weight: 0.3
      - id: derivatives-trig
        weight: 0.3
      - id: derivatives-exp-log
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: Build the linearization L(x) at a point
        key_prerequisites: [derivative-power-rule, point-slope-standard-form]
        exemplars:
          - problem: 'Find the linearization of $f(x) = \sqrt{x}$ at $a = 4$. Give the expression for $L(x)$.'
            answer: "2 + (x - 4)/4"
            solution_sketch: '$f(4) = 2$, $f''(x) = \frac{1}{2\sqrt{x}}$ so $f''(4) = \frac{1}{4}$; $L(x) = 2 + \frac{1}{4}(x - 4)$.'
          - problem: 'Find the linearization of $f(x) = x^2$ at $a = 3$. Give the expression for $L(x)$.'
            answer: "9 + 6(x - 3)"
            solution_sketch: '$f(3) = 9$ and $f''(3) = 6$, so $L(x) = 9 + 6(x - 3)$, i.e. $6x - 9$.'
          - problem: "Find the linearization of $f(x) = \\\\sqrt{x}$ at $a = 9$. Give the expression for $L(x)$."
            answer: "3 + (x-9)/6"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "For $f(x) = \\\\sqrt{x}$, the base point is $a = 9$. The value is $f(9) = 3$ by the square root. The derivative is $f'(x) = 1/(2\\\\sqrt{x})$ by the power rule, so $f'(9) = 1/6$. The linearization formula gives $L(x) = f(9) + f'(9)(x - 9) = 3 + (1/6)(x - 9)$. The answer is 3 + (x-9)/6."
          - problem: "Find the linearization of $f(x) = x^3$ at $a = 2$. Give the expression for $L(x)$."
            answer: "8 + 12(x - 2)"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "For $f(x) = x^3$, the base point is $a = 2$. The value is $f(2) = 8$ by the cube. The derivative is $f'(x) = 3x^2$ by the power rule, so $f'(2) = 12$. The linearization formula gives $L(x) = f(2) + f'(2)(x - 2) = 8 + 12(x - 2)$. The answer is 8 + 12(x - 2)."
          - problem: "Find the linearization of $f(x) = 1/x$ at $a = 16$. Give the expression for $L(x)$."
            answer: "1/16 - (x - 16)/256"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "For $f(x) = 1/x$, the base point is $a = 16$. The value is $f(16) = 1/16$ by substitution. The derivative is $f'(x) = -1/x^2$ by the power rule, so $f'(16) = -1/256$. The linearization formula gives $L(x) = f(16) + f'(16)(x - 16) = 1/16 - (1/256)(x - 16) = 1/16 - (x - 16)/256$. The answer is 1/16 - (x - 16)/256."
          - problem: "Find the linearization of $f(x) = \\\\ln(x)$ at $a = 1$. Give the expression for $L(x)$."
            answer: "x - 1"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "For $f(x) = \\\\ln(x)$, the base point is $a = 1$. The value is $f(1) = 0$ by the natural log at one. The derivative is $f'(x) = 1/x$ by the derivative of ln, so $f'(1) = 1$. The linearization formula gives $L(x) = f(1) + f'(1)(x - 1) = 0 + 1(x - 1) = x - 1$. The answer is x - 1."
        constraints: "base point where f and f' are exact and simple (perfect squares/cubes); the answer is the expression for L(x)"
      - id: kp2
        name: Approximate values with the linearization
        key_prerequisites: [derivative-power-rule]
        exemplars:
          - problem: 'Use the linearization of $\sqrt{x}$ at $4$ to approximate $\sqrt{4.1}$.'
            answer: "2.025"
            solution_sketch: '$L(4.1) = 2 + \frac{0.1}{4} = 2.025$.'
          - problem: 'Use the linearization of $x^5$ at $1$ to approximate $(1.02)^5$.'
            answer: "1.1"
            solution_sketch: '$L(x) = 1 + 5(x - 1)$, so $L(1.02) = 1 + 5(0.02) = 1.1$.'
          - problem: 'Use the linearization of $\sqrt[3]{x}$ at $8$ to approximate $\sqrt[3]{8.12}$.'
            answer: "2.01"
            solution_sketch: '$f''(x) = \frac{1}{3}x^{-2/3}$, $f''(8) = \frac{1}{12}$; $2 + \frac{0.12}{12} = 2.01$.'
          - problem: "Use the linearization of $x^4$ at $2$ to approximate $(2.01)^4$. Give the answer to 2 decimals."
            answer: "16.32"
            answer_contract: {"decimals": 2, "kind": "approx"}
            solution_sketch: "The full object is $L(x)=f(2)+f'(2)(x-2)$ for $f(x)=x^4$. By the power rule, $f'(x)=4x^3$, so $f(2)=16$ and $f'(2)=32$. Thus $L(x)=16+32(x-2)$. Evaluate at $x=2.01$: $L(2.01)=16+32(0.01)=16.32$. The answer is 16.32."
          - problem: "Use the linearization of $\\sqrt{x}$ at $9$ to approximate $\\sqrt{9.03}$. Give the answer to 3 decimals."
            answer: "3.005"
            answer_contract: {"decimals": 3, "kind": "approx"}
            solution_sketch: "The full object is $L(x)=f(9)+f'(9)(x-9)$ for $f(x)=\\sqrt{x}$. By the power rule, $f'(x)=\\frac{1}{2\\sqrt{x}}$, so $f(9)=3$ and $f'(9)=\\frac{1}{6}$. Thus $L(x)=3+\\frac{x-9}{6}$. Evaluate at $x=9.03$: $L(9.03)=3+\\frac{0.03}{6}=3.005$. The answer is 3.005."
          - problem: "Use the linearization of $\\ln(x)$ at $1$ to approximate $\\ln(1.02)$. Give the answer to 2 decimals."
            answer: "0.02"
            answer_contract: {"decimals": 2, "kind": "approx"}
            solution_sketch: "The full object is $L(x)=f(1)+f'(1)(x-1)$ for $f(x)=\\ln(x)$. By the derivative rule for $\\ln$, $f'(x)=\\frac{1}{x}$, so $f(1)=0$ and $f'(1)=1$. Thus $L(x)=0+1(x-1)=x-1$. Evaluate at $x=1.02$: $L(1.02)=1.02-1=0.02$. The answer is 0.02."
        constraints: "input a small offset from the base point; the decimal answer terminates"
      - id: kp3
        name: Standard small-input approximations
        key_prerequisites: [derivatives-trig, derivatives-exp-log]
        exemplars:
          - problem: 'Find the linearization of $\sin x$ at $a = 0$ and use it to approximate $\sin(0.1)$. (Give the approximation.)'
            answer: "0.1"
            solution_sketch: '$\sin 0 = 0$, $\cos 0 = 1$, so $L(x) = x$ and $L(0.1) = 0.1$.'
          - problem: 'Find the linearization of $\ln x$ at $a = 1$ and use it to approximate $\ln(1.05)$. (Give the approximation.)'
            answer: "0.05"
            solution_sketch: '$\ln 1 = 0$ and $\frac{1}{x}$ at $1$ is $1$, so $L(x) = x - 1$ and $L(1.05) = 0.05$.'
          - problem: 'Find the linearization of $e^x$ at $a = 0$ and use it to approximate $e^{0.03}$. (Give the approximation.)'
            answer: "1.03"
            solution_sketch: '$e^0 = 1$ and the derivative at $0$ is $1$, so $L(x) = 1 + x$ and $L(0.03) = 1.03$.'
          - problem: "Find the linearization of f(x) = sin(x) at a = 0 and use it to approximate sin(0.2). Give the approximation as a decimal to 1 decimal place."
            answer: "0.2"
            answer_contract: {"decimals": 1, "kind": "approx"}
            solution_sketch: "Step 1 (linearization formula): f(x) = sin(x) has f(0) = 0 and f'(x) = cos(x), so f'(0) = 1 and L(x) = 0 + 1(x - 0) = x. Step 2 (substitute the input): L(0.2) = 0.2. The approximation is 0.2."
          - problem: "Find the linearization of f(x) = ln(x) at a = 1 and use it to approximate ln(1.02). Give the approximation as a decimal to 2 decimal places."
            answer: "0.02"
            answer_contract: {"decimals": 2, "kind": "approx"}
            solution_sketch: "Step 1 (linearization formula): f(x) = ln(x) has f(1) = 0 and f'(x) = 1/x, so f'(1) = 1 and L(x) = 0 + 1(x - 1) = x - 1. Step 2 (substitute the input): L(1.02) = 0.02. The approximation is 0.02."
          - problem: "Find the linearization of f(x) = sqrt(1+x) at a = 0 and use it to approximate sqrt(1.04). Give the approximation as a decimal to 2 decimal places."
            answer: "1.02"
            answer_contract: {"decimals": 2, "kind": "approx"}
            solution_sketch: "Step 1 (linearization formula): f(x) = sqrt(1+x) has f(0) = 1 and f'(x) = 1/(2*sqrt(1+x)), so f'(0) = 1/2 and L(x) = 1 + (1/2)x. Step 2 (substitute the input): L(0.04) = 1 + 0.02 = 1.02. The approximation is 1.02."
        constraints: "base points 0 or 1 where the function and derivative are exact; the answer is the numeric approximation"
    diagnostic_exemplar:
      problem: 'Find the linearization of $f(x) = \sqrt[3]{x}$ at $a = 8$ and use it to approximate $\sqrt[3]{8.24}$. (Give the approximation.)'
      answer: '2.02'
      solution_sketch: '$f(8) = 2$ and $f''(x) = \frac{1}{3}x^{-2/3}$ gives $f''(8) = \frac{1}{12}$, so $L(x) = 2 + \frac{x-8}{12}$ and $L(8.24) = 2 + \frac{0.24}{12} = 2.02$.'
    anki_seeds:
      - front: "The linearization of f at a: L(x) = ?"
        back: "f(a) + f'(a)(x - a) — the tangent line used as an approximation"
        type: basic
      - front: "Near 0: sin x ≈ ?, e^x ≈ ?, ln(1 + x) ≈ ?"
        back: "x; 1 + x; x"
        type: basic

  - id: differentials-error-propagation
    name: Differentials and Error Propagation
    core: false                # terminal application of the differential
    difficulty: 0.6
    drill: false
    answer_kind: expression
    expected_time_secs: 150
    prerequisites:
      - id: linearization
        weight: 0.8
        key: true
      - id: derivative-power-rule
        weight: 0.5
        key: true
      - id: circle-area-circumference
        weight: 0.3
      - id: percentages
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: Compute differentials
        key_prerequisites: [linearization, derivative-power-rule]
        exemplars:
          - problem: 'For $y = x^3$, compute $dy$ when $x = 2$ and $dx = 0.1$.'
            answer: "1.2"
            solution_sketch: '$dy = 3 \cdot 4 \cdot 0.1 = 1.2$.'
          - problem: "For y = x^3 with dx = 0.1, find dy as a function of x."
            answer: "3x^2/10"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "The differential rule gives dy = f'(x) dx. The power rule gives f'(x) = 3x^2. With dx = 0.1, dy = 3x^2 * 0.1 = 3x^2/10. So dy = 3x^2/10."
          - problem: "For y = x^4, compute dy when x = 1.5 and dx = 0.2. Give dy to 1 decimal."
            answer: "2.7"
            answer_contract: {"decimals": 1, "kind": "approx"}
            solution_sketch: "The differential rule gives dy = f'(x) dx. The power rule gives f'(x) = 4x^3. At x = 1.5, f'(1.5) = 4 * 3.375 = 13.5. Then dy = 13.5 * 0.2 = 2.7. So dy = 2.7."
          - problem: "For y = sqrt(x), compute dy when x = 9 and dx = -0.2. Give the answer as a fraction."
            answer: "-1/30"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The differential rule gives dy = f'(x) dx. Rewrite y = sqrt(x) as x^(1/2); the power rule gives f'(x) = (1/2) x^(-1/2). At x = 9, f'(9) = 1/(2*3) = 1/6. Then dy = 1/6 * (-0.2) = -1/30. So dy = -1/30."
          - problem: "For y = x^2, compute dy when x = 3.2 and dx = 0.5. Give dy to 1 decimal."
            answer: "3.2"
            answer_contract: {"decimals": 1, "kind": "approx"}
            solution_sketch: "The differential rule gives dy = f'(x) dx. The power rule gives f'(x) = 2x. At x = 3.2, f'(3.2) = 6.4. Then dy = 6.4 * 0.5 = 3.2. So dy = 3.2."
          - problem: "For y = 1/x, compute dy when x = 2 and dx = 0.3. Give the answer as a fraction."
            answer: "-3/40"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The differential rule gives dy = f'(x) dx. Rewrite y = 1/x as x^(-1); the power rule gives f'(x) = -x^(-2) = -1/x^2. At x = 2, f'(2) = -1/4. Then dy = -1/4 * 0.3 = -3/40. So dy = -3/40."
        constraints: "polynomial or power functions; dx one decimal place"
      - id: kp2
        name: Estimate propagated error
        key_prerequisites: [linearization, circle-area-circumference]
        exemplars:
          - problem: 'A circle''s radius is measured as $10$ cm with possible error $dr = 0.1$ cm. Use differentials to estimate the possible error in the area $A = \pi r^2$.'
            answer: "2π cm^2"
            solution_sketch: '$dA = 2\pi r\,dr = 2\pi \cdot 10 \cdot 0.1 = 2\pi$.'
          - problem: 'A cube''s side is measured as $3$ m with possible error $0.02$ m. Estimate the possible error in the volume $V = x^3$.'
            answer: "0.54 m^3"
            solution_sketch: '$dV = 3x^2\,dx = 27 \cdot 0.02 = 0.54$.'
          - problem: "A circle's radius is measured as 12 cm with possible error 0.06 cm. Use the differential of A = pi r^2 to estimate the possible error in the area. Give the answer as a multiple of pi."
            answer: "36pi/25"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The differential is dA = 2 pi r dr. This follows from the power rule on A = pi r^2. Substitute r = 12 and dr = 0.06: dA = 2 pi (12)(0.06) = 1.44 pi = 36pi/25. The estimated possible error in the area is 36pi/25."
          - problem: "A cube's side is measured as 5 m with possible error 0.1 m. Use the differential of V = x^3 to estimate the possible error in the volume. Give the possible error in cubic meters."
            answer: "15/2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The differential is dV = 3x^2 dx. This follows from the power rule on V = x^3. Substitute x = 5 and dx = 0.1: dV = 3(25)(0.1) = 7.5 = 15/2. The estimated possible error in the volume is 15/2."
          - problem: "A sphere's radius is measured as 6 cm with possible error 0.12 cm. Use the differential of V = (4/3) pi r^3 to estimate the possible error in the volume. Give the answer as a multiple of pi."
            answer: "432pi/25"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The differential is dV = 4 pi r^2 dr. This follows from the power rule on V = (4/3) pi r^3. Substitute r = 6 and dr = 0.12: dV = 4 pi (36)(0.12) = 17.28 pi = 432pi/25. The estimated possible error in the volume is 432pi/25."
          - problem: "A circle's radius is measured as 25 cm with possible error 0.5 cm. Use the differential of C = 2 pi r to estimate the possible error in the circumference. Give the answer as a multiple of pi."
            answer: "pi"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The differential is dC = 2 pi dr, since C = 2 pi r. This follows from the power rule on C = 2 pi r. Substitute dr = 0.5: dC = 2 pi (0.5) = pi. The estimated possible error in the circumference is pi."
        constraints: "state the geometric formula; measurement error at most a few percent"
      - id: kp3
        name: Relative and percentage error
        key_prerequisites: [linearization, percentages]
        exemplars:
          - problem: 'A sphere''s radius is measured with a $1\%$ error. Using $V = \frac{4}{3}\pi r^3$, estimate the resulting percentage error in the volume. Give just the number.'
            answer: "3"
            solution_sketch: '$\frac{dV}{V} = \frac{4\pi r^2\,dr}{\frac{4}{3}\pi r^3} = 3\frac{dr}{r}$, so $3 \cdot 1\% = 3\%$.'
          - problem: 'A square''s side is measured with a $0.5\%$ error. Estimate the percentage error in its area. Give just the number.'
            answer: "1"
            solution_sketch: '$\frac{dA}{A} = 2\frac{dx}{x}$.'
          - problem: "A cube's side length is measured with a 3% error. Use V = s^3 to estimate the resulting percentage error in the cube's volume. Give the answer as a bare percent number."
            answer: "9"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (relative error rule for powers): V = s^3 gives dV/V = 3 ds/s. Step 2 (substitute): ds/s = 0.03, so dV/V = 3(0.03) = 0.09. Step 3 (convert to percent): 0.09 is 9."
          - problem: "For a quantity y = x^4, the input x is measured with a 1.25% error. Estimate the percentage error in y. Give the answer as a bare percent number."
            answer: "5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (relative error rule for powers): y = x^4 gives dy/y = 4 dx/x. Step 2 (substitute): dx/x = 0.0125, so dy/y = 4(0.0125) = 0.05. Step 3 (convert to percent): 0.05 is 5."
          - problem: "The kinetic energy K = (1/2) m v^2 depends on speed v. If v is measured with a 3.5% error, estimate the percentage error in K. Give the answer as a bare percent number."
            answer: "7"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (relative error rule for powers): K = (1/2) m v^2 gives dK/K = 2 dv/v. Step 2 (substitute): dv/v = 0.035, so dK/K = 2(0.035) = 0.07. Step 3 (convert to percent): 0.07 is 7."
          - problem: "The surface area of a sphere is S = 4 pi r^2. If the radius r is measured with a 4% error, estimate the percentage error in S. Give the answer as a bare percent number."
            answer: "8"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (relative error rule for powers): S = 4 pi r^2 gives dS/S = 2 dr/r. Step 2 (substitute): dr/r = 0.04, so dS/S = 2(0.04) = 0.08. Step 3 (convert to percent): 0.08 is 8."
        constraints: "power functions so relative error scales by the exponent; answers are the bare percent number"
    diagnostic_exemplar:
      problem: 'A sphere''s radius is measured with a $2\%$ error. Using $V = \frac{4}{3}\pi r^3$, estimate the resulting percentage error in the volume. Give just the number.'
      answer: "6"
      solution_sketch: '$\frac{dV}{V} = 3\frac{dr}{r} = 3 \cdot 2\% = 6\%$.'
    anki_seeds:
      - front: "The differential of y = f(x) is dy = ?"
        back: "f'(x) dx"
        type: basic
      - front: "For y = x^n, the relative error dy/y equals ___ times dx/x."
        back: "n — a power magnifies percentage error by its exponent"
        type: basic

  - id: newtons-method
    name: 'Newton''s Method'
    core: false                # named algorithm the curriculum arrives at and never reuses
    difficulty: 0.65
    drill: false
    answer_kind: numeric
    expected_time_secs: 180
    prerequisites:
      - id: linearization
        weight: 0.7
        key: true
      - id: derivative-power-rule
        weight: 0.5
        key: true
      - id: evaluating-functions
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: One Newton iteration
        key_prerequisites: [linearization, derivative-power-rule]
        exemplars:
          - problem: "Use Newton's method once on $f(x) = x^2 - 7$ with starting value $x_0 = 3$. Find the next estimate $x_1$, written as a fraction."
            answer: "8/3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 uses Newton's method formula: $x_1 = x_0 - f(x_0)/f'(x_0)$. Step 2 uses the power rule to get $f'(x) = 2x$, so $f'(3) = 6$, and $f(3) = 9 - 7 = 2$. Step 3 substitutes these values: $x_1 = 3 - 2/6 = 3 - 1/3 = 8/3$. The next estimate is 8/3."
          - problem: "The function $f(x) = x^3 - 3x - 1$ is given. Starting from $x_0 = 2$, carry out a single Newton step. Give $x_1$ as a fraction."
            answer: "17/9"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 writes Newton's method formula $x_1 = x_0 - f(x_0)/f'(x_0)$. Step 2 applies the power rule to $f(x) = x^3 - 3x - 1$, giving $f'(x) = 3x^2 - 3$, so $f'(2) = 9$, and $f(2) = 1$. Step 3 substitutes: $x_1 = 2 - 1/9 = 17/9$. The new estimate is 17/9."
          - problem: "A calculator starts with $x_0 = 1$ for the equation $x^2 - 2 = 0$. Apply one Newton iteration. Give $x_1$ as a decimal to 1 decimal place."
            answer: "1.5"
            answer_contract: {"decimals": 1, "kind": "approx"}
            solution_sketch: "Step 1 recalls Newton's method formula $x_1 = x_0 - f(x_0)/f'(x_0)$. Step 2 uses the power rule: $f(x) = x^2 - 2$ gives $f'(x) = 2x$, so $f(1) = -1$ and $f'(1) = 2$. Step 3 substitutes: $x_1 = 1 - (-1)/2 = 1.5$. The estimate to 1 decimal place is 1.5."
          - problem: "For the equation $x^2 + x - 1 = 0$, take $x_0 = 1$ and perform one iteration of Newton's method. State $x_1$ as a fraction."
            answer: "2/3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 states Newton's method formula $x_1 = x_0 - f(x_0)/f'(x_0)$. Step 2 uses the power rule on $f(x) = x^2 + x - 1$: $f'(x) = 2x + 1$, so $f(1) = 1$ and $f'(1) = 3$. Step 3 substitutes: $x_1 = 1 - 1/3 = 2/3$. The estimate is 2/3."
          - problem: "Let $f(x) = x^3 + x - 3$. Use the Newton update with initial guess $x_0 = 1$. Determine $x_1$ as a fraction."
            answer: "5/4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 writes Newton's method formula $x_1 = x_0 - f(x_0)/f'(x_0)$. Step 2 uses the power rule on $f(x) = x^3 + x - 3$: $f'(x) = 3x^2 + 1$, so $f(1) = -1$ and $f'(1) = 4$. Step 3 substitutes: $x_1 = 1 - (-1)/4 = 5/4$. The next value is 5/4."
          - problem: "Consider $f(x) = x^3 - 4x + 1$. Make one Newton step from $x_0 = 2$. Give the new value $x_1$ as a fraction."
            answer: "15/8"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 states Newton's method formula $x_1 = x_0 - f(x_0)/f'(x_0)$. Step 2 uses the power rule on $f(x) = x^3 - 4x + 1$: $f'(x) = 3x^2 - 4$, so $f(2) = 1$ and $f'(2) = 8$. Step 3 substitutes: $x_1 = 2 - 1/8 = 15/8$. The new value is 15/8."
        constraints: "f(x₀) and f'(x₀) are small integers; x₁ is a simple fraction or decimal"
      - id: kp2
        name: Iterate twice
        key_prerequisites: [linearization, evaluating-functions]
        exemplars:
          - problem: "Carry out two iterations of Newton's method for f(x) = x^2 - 7 from the starting value x0 = 2. Find x1 and x2 as fractions."
            answer: "x1 = 11/4; x2 = 233/88"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "x1"}, {"contract": {"kind": "exact"}, "name": "x2"}]}
            solution_sketch: "Newton's method uses x_{n+1} = x_n - f(x_n)/f'(x_n). For f(x) = x^2 - 7, f'(x) = 2x. At x0 = 2, f(2) = -3 and f'(2) = 4, so x1 = 2 - (-3)/4 = 11/4. At x1 = 11/4, f(11/4) = 9/16 and f'(11/4) = 11/2, so x2 = 11/4 - (9/16)/(11/2) = 11/4 - 9/88 = 233/88. The answer is x1 = 11/4; x2 = 233/88."
          - problem: "Use Newton's method twice on f(x) = x^2 - 11 starting at x0 = 3. Find x1 and x2 as fractions."
            answer: "x1 = 10/3; x2 = 199/60"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "x1"}, {"contract": {"kind": "exact"}, "name": "x2"}]}
            solution_sketch: "Newton's method uses x_{n+1} = x_n - f(x_n)/f'(x_n). For f(x) = x^2 - 11, f'(x) = 2x. At x0 = 3, f(3) = -2 and f'(3) = 6, so x1 = 3 - (-2)/6 = 10/3. At x1 = 10/3, f(10/3) = 1/9 and f'(10/3) = 20/3, so x2 = 10/3 - (1/9)/(20/3) = 10/3 - 1/60 = 199/60. The answer is x1 = 10/3; x2 = 199/60."
          - problem: "Apply Newton's method twice to f(x) = x^3 - 2 starting at x0 = 1. Find x1 and x2 as fractions."
            answer: "x1 = 4/3; x2 = 91/72"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "x1"}, {"contract": {"kind": "exact"}, "name": "x2"}]}
            solution_sketch: "Newton's method uses x_{n+1} = x_n - f(x_n)/f'(x_n). For f(x) = x^3 - 2, f'(x) = 3x^2. At x0 = 1, f(1) = -1 and f'(1) = 3, so x1 = 1 - (-1)/3 = 4/3. At x1 = 4/3, f(4/3) = 10/27 and f'(4/3) = 16/3, so x2 = 4/3 - (10/27)/(16/3) = 4/3 - 5/72 = 91/72. The answer is x1 = 4/3; x2 = 91/72."
          - problem: "Run two Newton iterations for f(x) = x^2 + x - 3 with x0 = 1. Find x1 and x2 as fractions."
            answer: "x1 = 4/3; x2 = 43/33"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "x1"}, {"contract": {"kind": "exact"}, "name": "x2"}]}
            solution_sketch: "Newton's method uses x_{n+1} = x_n - f(x_n)/f'(x_n). For f(x) = x^2 + x - 3, f'(x) = 2x + 1. At x0 = 1, f(1) = -1 and f'(1) = 3, so x1 = 1 - (-1)/3 = 4/3. At x1 = 4/3, f(4/3) = 1/9 and f'(4/3) = 11/3, so x2 = 4/3 - (1/9)/(11/3) = 4/3 - 1/33 = 43/33. The answer is x1 = 4/3; x2 = 43/33."
          - problem: "Apply Newton's method twice to f(x) = x^2 - 13 starting at x0 = 3. Find x2 as a fraction."
            answer: "119/33"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Newton's method uses x_{n+1} = x_n - f(x_n)/f'(x_n). For f(x) = x^2 - 13, f'(x) = 2x. At x0 = 3, f(3) = -4 and f'(3) = 6, so x1 = 3 - (-4)/6 = 11/3. At x1 = 11/3, f(11/3) = 4/9 and f'(11/3) = 22/3, so x2 = 11/3 - (4/9)/(22/3) = 11/3 - 2/33 = 119/33. The answer is 119/33."
          - problem: "Use Newton's method to estimate the square root of 17 by solving f(x) = x^2 - 17. Start with x0 = 4. Find x1 and x2 as fractions."
            answer: "x1 = 33/8; x2 = 2177/528"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "x1"}, {"contract": {"kind": "exact"}, "name": "x2"}]}
            solution_sketch: "Newton's method uses x_{n+1} = x_n - f(x_n)/f'(x_n). For f(x) = x^2 - 17, f'(x) = 2x. At x0 = 4, f(4) = -1 and f'(4) = 8, so x1 = 4 - (-1)/8 = 33/8. At x1 = 33/8, f(33/8) = 1/64 and f'(33/8) = 33/4, so x2 = 33/8 - (1/64)/(33/4) = 33/8 - 1/528 = 2177/528. The answer is x1 = 33/8; x2 = 2177/528."
        constraints: "keep arithmetic exact (fractions); two iterations at most"
      - id: kp3
        name: Geometric meaning and failure modes
        key_prerequisites: [linearization]
        exemplars:
          - problem: "For f(x) = x^2 - 2, one Newton step from x0 = 3 uses the tangent line at (3, 7). Find the next iterate x1 as a fraction."
            answer: "11/6"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Full object: f(x) = x^2 - 2 with x0 = 3. Step 1 uses the tangent-line rule: f(3) = 7 and f'(x) = 2x, so f'(3) = 6. Step 2 uses the Newton update x1 = x0 - f(x0)/f'(x0) = 3 - 7/6. This gives x1 = 11/6."
          - problem: "For f(x) = x^2 - 5, Newton's method from x0 = 0 cannot take a step because it would divide by f'(0). Evaluate f'(0)."
            answer: "0"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Full object: f(x) = x^2 - 5 with x0 = 0. Step 1 uses the power rule: f'(x) = 2x. Step 2 evaluates at 0: f'(0) = 2*0 = 0. The division in the Newton update is therefore by 0, and the value is 0."
          - problem: "For f(x) = x^3 - 8 with start x0 = 0, decide whether the first Newton step can be taken, and give f'(0)."
            answer: "verdict = stalls; fprime = 0"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["proceeds"], ["stalls"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "fprime"}]}
            solution_sketch: "Full object: f(x) = x^3 - 8 with start x0 = 0. Step 1 uses the power rule: f'(x) = 3x^2, so f'(0) = 3*0^2 = 0. Step 2 applies the failure test: the Newton update x1 = x0 - f(x0)/f'(x0) needs division by f'(0), which is division by 0, so the first step cannot be taken. The option proceeds is wrong because a step with zero derivative is undefined. The verdict is stalls and f'(0) = 0, so the answer is verdict = stalls; fprime = 0."
          - problem: "A single Newton step at a point on a curve uses one straight line to obtain the next iterate. Which line is it?"
            answer: "tangent"
            answer_contract: {"kind": "label", "options": [["tangent"], ["secant"], ["normal"], ["chord"]]}
            solution_sketch: "Full object: one Newton step at a point on a curve. Step 1 uses the geometric meaning: the method replaces the curve by the tangent line at the current point. Step 2 takes the next iterate as the x-intercept of that line. The option secant is wrong because it uses two points; normal is wrong because it is perpendicular; chord is wrong because it joins two curve points. The correct line is tangent."
          - problem: "Newton's method needs a nonzero derivative at the current iterate. For f(x) = x^2 + 4x + 7, find the start x where f'(x) = 0 and the method cannot take a step. Find that x."
            answer: "-2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Full object: f(x) = x^2 + 4x + 7. Step 1 uses the power rule: f'(x) = 2x + 4. Step 2 sets the derivative to zero for a horizontal tangent: 2x + 4 = 0. Solving gives x = -2. The start where the method fails is -2."
          - problem: "For f(x) = x^3 - 3x + 1, a Newton step is impossible at a start where the derivative is zero. On the interval 0 < x < 2, find the x-value of such a start."
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Full object: f(x) = x^3 - 3x + 1 on 0 < x < 2. Step 1 uses the power rule: f'(x) = 3x^2 - 3. Step 2 sets the derivative to zero: 3x^2 - 3 = 0, so x^2 = 1. In the interval 0 < x < 2 the value is x = 1."
        constraints: "conceptual questions; failure cases where f'(xₙ) = 0"
    diagnostic_exemplar:
      problem: 'Apply two steps of Newton''s method to $f(x) = x^2 - 3$ starting at $x_0 = 2$. Give $x_1$ and $x_2$ exactly.'
      answer: 'x₁ = 7/4; x₂ = 97/56'
      answer_contract: {kind: none}
      solution_sketch: '$x_1 = 2 - \frac{1}{4} = \frac{7}{4}$; then $f(7/4) = \frac{1}{16}$ and $f''(7/4) = \frac{7}{2}$, so $x_2 = \frac{7}{4} - \frac{1/16}{7/2} = \frac{7}{4} - \frac{1}{56} = \frac{97}{56}$.'
    anki_seeds:
      - front: "Newton's method iteration: x_{n+1} = ?"
        back: "xₙ - f(xₙ)/f'(xₙ)"
        type: basic
      - front: "Newton's method breaks down at xₙ when..."
        back: "f'(xₙ) = 0 (horizontal tangent — no x-intercept)"
        type: basic

  - id: critical-points-extrema
    name: Critical Points and Extrema
    core: true
    difficulty: 0.6
    drill: false
    answer_kind: numeric
    expected_time_secs: 180
    prerequisites:
      - id: derivative-power-rule
        weight: 0.8
        key: true
      - id: quadratic-equations-factoring
        weight: 0.5
        key: true
      - id: continuity
        weight: 0.3
      - id: domain-range
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: Find critical points where f' = 0
        key_prerequisites: [derivative-power-rule, quadratic-equations-factoring]
        exemplars:
          - problem: 'Find the critical point of $f(x) = x^2 - 4x + 1$.'
            answer: "x = 2"
          - problem: "Consider $f(x) = x^3 - 12x$. Find its critical points, and give the smaller point as x1 and the larger point as x2."
            answer: "x1 = -2; x2 = 2"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "x1"}, {"contract": {"kind": "exact"}, "name": "x2"}]}
            solution_sketch: "Differentiate with the power rule: for f(x) = x^3 - 12x the derivative is f'(x) = 3x^2 - 12. Set f'(x) = 0 and factor over the integers: 3(x - 2)(x + 2) = 0. By the zero-product rule the critical points are x = 2 and x = -2. Ordered from smaller to larger, the critical points are x1 = -2; x2 = 2."
          - problem: "Consider $f(x) = x^3 + 3x^2 - 45x$. Find its critical points, and give the smaller point as x1 and the larger point as x2."
            answer: "x1 = -5; x2 = 3"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "x1"}, {"contract": {"kind": "exact"}, "name": "x2"}]}
            solution_sketch: "Differentiate with the power rule: for f(x) = x^3 + 3x^2 - 45x the derivative is f'(x) = 3x^2 + 6x - 45. Set f'(x) = 0, divide by 3, and factor the quadratic: x^2 + 2x - 15 = (x + 5)(x - 3). By the zero-product rule the critical points are x = -5 and x = 3. Ordered from smaller to larger, the critical points are x1 = -5; x2 = 3."
          - problem: "The quadratic $f(x) = x^2 + bx + 7$ has its critical point at $x = 3$. Find the value of $b$."
            answer: "-6"
            answer_contract: {"kind": "exact"}
            solution_sketch: "A critical point of a differentiable function is a point where f'(x) = 0. Differentiate f(x) = x^2 + bx + 7 with the power rule: f'(x) = 2x + b. At the critical point x = 3 this gives 2(3) + b = 0, so b = -6. The value of b is -6."
          - problem: "Consider $f(x) = x^3 - 3x^2 + 3x - 1$. Find the critical point of $f$ where $f'(x) = 0$."
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Differentiate f(x) = x^3 - 3x^2 + 3x - 1 with the power rule: f'(x) = 3x^2 - 6x + 3. Factor the derivative over the integers: 3(x^2 - 2x + 1) = 3(x - 1)^2. Setting f'(x) = 0, the double root of the factored derivative gives the single critical point x = 1. The critical point is 1."
          - problem: "The height of a roller coaster car in meters is $h(t) = t^3 - 15t^2 + 48t$, with $t$ in seconds. Find the critical times where $h'(t) = 0$, and give the smaller time as t1 and the larger time as t2."
            answer: "t1 = 2; t2 = 8"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "t1"}, {"contract": {"kind": "exact"}, "name": "t2"}]}
            solution_sketch: "Differentiate h(t) = t^3 - 15t^2 + 48t with the power rule: h'(t) = 3t^2 - 30t + 48. Set h'(t) = 0, divide by 3, and factor the quadratic: t^2 - 10t + 16 = (t - 2)(t - 8). By the zero-product rule the critical times are t = 2 and t = 8. Ordered from smaller to larger, the critical times are t1 = 2; t2 = 8."
        constraints: "cubics or quadratics whose derivative factors over the integers"
      - id: kp2
        name: Critical points where f' is undefined; domain care
        key_prerequisites: [derivative-power-rule, domain-range]
        exemplars:
          - problem: "Find the x-coordinate of the critical point of f(x) = x^(2/3) as a number."
            answer: "0"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: Differentiate f(x) = x^(2/3) with the power rule; f'(x) = (2/3)x^(-1/3). Step 2: Solve f'(x) = 0; the equation has no solution. Step 3: Find where f' is undefined; x = 0 makes the exponent -1/3 undefined, and x = 0 is in the domain of f. The critical x-coordinate is 0."
          - problem: "Find the critical points of f(x) = x + 4/x. Give the smaller critical x-value as x1 and the larger as x2."
            answer: "x1 = -2; x2 = 2"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "x1"}, {"contract": {"kind": "exact"}, "name": "x2"}]}
            solution_sketch: "The full result: the critical x-values are x1 = -2; x2 = 2. Step 1: Differentiate f(x) = x + 4/x with the power rule; f'(x) = 1 - 4/x^2. Step 2: Solve f'(x) = 0; x^2 = 4 gives x = -2 and x = 2. Step 3: Apply the domain rule; x = 0 is not in the domain of f, so it is not a critical point. The answer is x1 = -2; x2 = 2."
          - problem: "Find the x-coordinate of the critical point of f(x) = (x - 1)^(2/3) as a number."
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: Differentiate f(x) = (x - 1)^(2/3) with the power rule; f'(x) = (2/3)(x - 1)^(-1/3). Step 2: Solve f'(x) = 0; there is no solution. Step 3: Find where f' is undefined; x - 1 = 0 gives x = 1, which is in the domain of f. The critical x-coordinate is 1."
          - problem: "Find the critical points of f(x) = 2x + 18/x. Give the smaller critical x-value as x1 and the larger as x2."
            answer: "x1 = -3; x2 = 3"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "x1"}, {"contract": {"kind": "exact"}, "name": "x2"}]}
            solution_sketch: "The full result: the critical x-values are x1 = -3; x2 = 3. Step 1: Differentiate f(x) = 2x + 18/x with the power rule; f'(x) = 2 - 18/x^2. Step 2: Solve f'(x) = 0; x^2 = 9 gives x = -3 and x = 3. Step 3: Apply the domain rule; x = 0 is not in the domain of f, so it is not a critical point. The answer is x1 = -3; x2 = 3."
          - problem: "How many critical points does f(x) = 3x + 12/x have?"
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: Differentiate f(x) = 3x + 12/x with the power rule; f'(x) = 3 - 12/x^2. Step 2: Solve f'(x) = 0; x^2 = 4 gives x = -2 and x = 2. Step 3: Apply the domain rule; x = 0 is not in the domain, so it is not a critical point. Thus there are 2 critical points."
          - problem: "Find the x-coordinate of the critical point of f(x) = (x + 2)^(2/3) as a number."
            answer: "-2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: Differentiate f(x) = (x + 2)^(2/3) with the power rule; f'(x) = (2/3)(x + 2)^(-1/3). Step 2: Solve f'(x) = 0; there is no solution. Step 3: Find where f' is undefined; x + 2 = 0 gives x = -2, which is in the domain of f. The critical x-coordinate is -2."
        constraints: "include one f'-undefined case and one domain trap; answers are small integers"
      - id: kp3
        name: Classify local extrema with a sign chart
        key_prerequisites: [derivative-power-rule]
        exemplars:
          - problem: "Let $f(x) = x^3 - 12x$. Its derivative has critical points $x = -2$ and $x = 2$. At the critical point $x = -2$, determine whether $f$ has a local maximum or a local minimum, and give the value $f(-2)$."
            answer: "verdict = maximum; value = 16"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["maximum"], ["minimum"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "value"}]}
            solution_sketch: "Step 1: by the power rule $f'(x) = 3x^2 - 12 = 3(x - 2)(x + 2)$, so $x = -2$ is a critical point. Step 2: the sign chart of $f'$ is positive for $x < -2$ and negative for $-2 < x < 2$, so $f'$ changes from positive to negative at $x = -2$ and the point is a local maximum. Step 3: $f(-2) = (-2)^3 - 12(-2) = -8 + 24 = 16$. The wrong option minimum comes from misreading the sign change, which is positive to negative here, not negative to positive. The answer is verdict = maximum; value = 16."
          - problem: "Let $f(x) = x^2 - 6x + 5$. Its derivative has the single critical point $x = 3$. At $x = 3$, determine whether $f$ has a local maximum or a local minimum, and give the value $f(3)$."
            answer: "verdict = minimum; value = -4"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["maximum"], ["minimum"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "value"}]}
            solution_sketch: "Step 1: by the power rule $f'(x) = 2x - 6$, which is zero at $x = 3$. Step 2: $f'$ is negative for $x < 3$ and positive for $x > 3$, so the sign chart changes from negative to positive and $x = 3$ is a local minimum. Step 3: $f(3) = 9 - 18 + 5 = -4$. The wrong option maximum would come from reading the sign change backward, from positive to negative, which does not hold here. The answer is verdict = minimum; value = -4."
          - problem: "Find the local maximum value of $f(x) = x^3 - 27x$."
            answer: "54"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: $f'(x) = 3x^2 - 27 = 3(x - 3)(x + 3)$ by the power rule, so critical points are $-3$ and $3$. Step 2: a sign chart gives $+, -, +$, so $x = -3$ is the local maximum. Step 3: $f(-3) = -27 + 81 = 54$. The local maximum value is 54."
          - problem: "Find the local minimum value of $f(x) = x^3 - 3x^2 - 9x$."
            answer: "-27"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: $f'(x) = 3x^2 - 6x - 9 = 3(x - 3)(x + 1)$ by the power rule, so critical points are $-1$ and $3$. Step 2: a sign chart gives $+, -, +$, so $x = 3$ is the local minimum. Step 3: $f(3) = 27 - 27 - 27 = -27$. The local minimum value is -27."
          - problem: "Find the $x$-coordinate of the local maximum of $f(x) = x^4 - 8x^2$."
            answer: "0"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: $f'(x) = 4x^3 - 16x = 4x(x - 2)(x + 2)$ by the power rule, so critical points are $-2$, $0$, and $2$. Step 2: a sign chart gives $-, +, -, +$, so $x = 0$ is the local maximum. The $x$-coordinate of the local maximum is 0."
          - problem: "Find the local minimum value of $f(x) = x^3 + 6x^2 + 9x$."
            answer: "-4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: $f'(x) = 3x^2 + 12x + 9 = 3(x + 1)(x + 3)$ by the power rule, so critical points are $-3$ and $-1$. Step 2: a sign chart gives $+, -, +$, so $x = -1$ is the local minimum. Step 3: $f(-1) = -1 + 6 - 9 = -4$. The local minimum value is -4."
        constraints: "derivative sign changes cleanly at each critical point; function values are integers"
    diagnostic_exemplar:
      problem: 'For $f(x) = x + \frac{9}{x}$, find the critical points and classify each as a local maximum or minimum.'
      answer: "x = -3 is a local max (f(-3) = -6) and x = 3 is a local min (f(3) = 6); x = 0 is not a critical point (not in the domain)"
      answer_contract: {kind: none}
      solution_sketch: '$f''(x) = 1 - \frac{9}{x^2} = 0$ at $x = \pm 3$; $f''''(x) = \frac{18}{x^3}$ is negative at $-3$, positive at $3$.'
    anki_seeds:
      - front: "A critical point of f is a point in the domain where..."
        back: "f'(x) = 0 or f'(x) does not exist"
        type: basic
      - front: "Is x = 0 a critical point of f(x) = 1/x?"
        back: "No — 0 is not in the domain of f, so it cannot be a critical point"
        type: basic

  - id: rolles-theorem
    name: 'Rolle''s Theorem'
    core: false                # feeds only the MVT; terminal theorem branch
    difficulty: 0.55
    drill: false
    answer_kind: numeric
    expected_time_secs: 150
    prerequisites:
      - id: critical-points-extrema
        weight: 0.6
        key: true
      - id: continuity
        weight: 0.5
        key: true
      - id: quadratic-equations-factoring
        weight: 0.4
      - id: derivatives-sin-cos
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: Verify the hypotheses and find c
        key_prerequisites: [continuity, critical-points-extrema]
        exemplars:
          - problem: "Consider f(x) = x^2 - 6x + 10 on [2, 4]. Give the common endpoint value of f at x = 2 and x = 4, and find the c in (2, 4) with f'(c) = 0. Give the answer as fend = value; c = value."
            answer: "fend = 2; c = 3"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "fend"}, {"contract": {"kind": "exact"}, "name": "c"}]}
            solution_sketch: "Step 1: the function is f(x) = x^2 - 6x + 10 on [2, 4]; it is a polynomial, so it is continuous on [2, 4] and differentiable on (2, 4). Step 2 (endpoint check): f(2) = 4 - 12 + 10 = 2 and f(4) = 16 - 24 + 10 = 2, so the endpoint values are equal and the hypotheses of Rolle's theorem hold. Step 3 (differentiate): f'(x) = 2x - 6 by the power rule. Step 4 (solve): 2x - 6 = 0 gives x = 3, and 3 lies in (2, 4), so this is the unique interior zero of f'. The answer is fend = 2; c = 3."
          - problem: 'Find the $c$ in $(0, \pi)$ where $f''(c) = 0$ for $f(x) = \sin x$ (note $\sin 0 = \sin \pi = 0$).'
            answer: "c = π/2"
          - problem: "Consider f(x) = x^2 + 2x - 8 on [-4, 2]. Verify that the hypotheses of Rolle's theorem hold, and find c in (-4, 2) with f'(c) = 0."
            answer: "-1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The function is f(x) = x^2 + 2x - 8 on [-4, 2]. It is a polynomial, so it is continuous and differentiable. Check endpoints: f(-4) = 0 and f(2) = 0, so the hypotheses hold. Differentiate: f'(x) = 2x + 2. Set 2x + 2 = 0, so x = -1, which lies in (-4, 2). The required value is -1."
          - problem: "Consider f(x) = cos x on [0, 2pi]. Verify the hypotheses of Rolle's theorem, and find c in (0, 2pi) with f'(c) = 0."
            answer: "pi"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The function is f(x) = cos x on [0, 2pi]. It is continuous and differentiable. Check endpoints: cos 0 = 1 and cos 2pi = 1, so Rolle's theorem applies. Differentiate: f'(x) = -sin x. Set -sin x = 0, so x = pi, which lies in (0, 2pi). The required value is pi."
          - problem: "Consider f(x) = sin x on [pi, 2pi]. Verify the hypotheses of Rolle's theorem, and find c in (pi, 2pi) with f'(c) = 0."
            answer: "3pi/2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The function is f(x) = sin x on [pi, 2pi]. It is continuous and differentiable. Check endpoints: sin pi = 0 and sin 2pi = 0, so the hypotheses hold. Differentiate: f'(x) = cos x. Set cos x = 0, so x = 3pi/2, which lies in (pi, 2pi). The required value is 3pi/2."
          - problem: "Consider f(x) = 2x^2 - 10x + 8 on [1, 4]. Verify the hypotheses of Rolle's theorem, and find c in (1, 4) with f'(c) = 0."
            answer: "5/2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The function is f(x) = 2x^2 - 10x + 8 on [1, 4]. It is a polynomial, so it is continuous and differentiable. Check endpoints: f(1) = 0 and f(4) = 0, so Rolle's theorem applies. Differentiate: f'(x) = 4x - 10. Set 4x - 10 = 0, so x = 5/2, which lies in (1, 4). The required value is 5/2."
        constraints: "equal endpoint values; unique interior zero of f'"
      - id: kp2
        name: Find c for cubics
        key_prerequisites: [critical-points-extrema, quadratic-equations-factoring]
        exemplars:
          - problem: "The function f(x) = x^3 - 16x has equal endpoint values on [0, 4]. Find the value of c in (0, 4) with f'(c) = 0."
            answer: "4sqrt(3)/3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: check the endpoints. f(0) = 0 and f(4) = 64 - 64 = 0, so Rolle's theorem applies on [0, 4]. Step 2: differentiate using the power rule. f'(x) = 3x^2 - 16. Step 3: solve 3x^2 - 16 = 0 by isolating x^2, giving x = 4/sqrt(3) or x = -4/sqrt(3). Only the positive root lies in (0, 4), so the value is 4sqrt(3)/3."
          - problem: "The function f(x) = x^3 - 25x has equal endpoint values on [0, 5]. Find the value of c in (0, 5) with f'(c) = 0."
            answer: "5sqrt(3)/3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: check the endpoints. f(0) = 0 and f(5) = 125 - 125 = 0, so Rolle's theorem applies on [0, 5]. Step 2: differentiate using the power rule. f'(x) = 3x^2 - 25. Step 3: solve 3x^2 - 25 = 0 by isolating x^2, giving x = 5/sqrt(3) or x = -5/sqrt(3). Only the positive root lies in (0, 5), so the value is 5sqrt(3)/3."
          - problem: "The cubic f(x) = x^3 - 3x^2 + 2x has f(0) = f(2). Find the smaller value of c in (0, 2) with f'(c) = 0."
            answer: "1 - sqrt(3)/3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: check the endpoints. f(0) = 0 and f(2) = 8 - 12 + 4 = 0, so Rolle's theorem applies on [0, 2]. Step 2: differentiate term by term with the power rule. f'(x) = 3x^2 - 6x + 2. Step 3: solve 3x^2 - 6x + 2 = 0 with the quadratic formula, giving x = 1 - sqrt(3)/3 and x = 1 + sqrt(3)/3. The smaller value in (0, 2) is 1 - sqrt(3)/3."
          - problem: "For the cubic f(x) = x^3 - 18x, the endpoints of the interval [0, 3sqrt(2)] have the same function value. Determine the number c in the open interval (0, 3sqrt(2)) at which f'(c) = 0."
            answer: "sqrt(6)"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: check the endpoints. f(0) = 0 and f(3sqrt(2)) = 54sqrt(2) - 54sqrt(2) = 0, so Rolle's theorem applies. Step 2: differentiate using the power rule. f'(x) = 3x^2 - 18. Step 3: solve 3x^2 - 18 = 0; this gives x^2 = 6, so x = sqrt(6) or x = -sqrt(6). The only root in the open interval is sqrt(6). The number is sqrt(6)."
          - problem: "A particle moves along a line with position s(t) = t^3 - 24t for 0 <= t <= 2sqrt(6). Its positions at the endpoints are equal. Find the time c in the open interval (0, 2sqrt(6)) when its velocity is zero."
            answer: "2sqrt(2)"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: check the endpoint positions. s(0) = 0 and s(2sqrt(6)) = 48sqrt(6) - 48sqrt(6) = 0, so Rolle's theorem applies. Step 2: differentiate position to get velocity; the power rule gives s'(t) = 3t^2 - 24. Step 3: solve 3t^2 - 24 = 0 by isolating t^2, which gives t = 2sqrt(2) or t = -2sqrt(2). Only the positive time lies in the open interval, so the time is 2sqrt(2)."
          - problem: "The cubic f(x) = x^3 - 6x^2 + 8x has f(0) = f(2). Find the value of c in (0, 2) with f'(c) = 0."
            answer: "2 - 2sqrt(3)/3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: check the endpoints. f(0) = 0 and f(2) = 8 - 24 + 16 = 0, so Rolle's theorem applies on [0, 2]. Step 2: differentiate with the power rule. f'(x) = 3x^2 - 12x + 8. Step 3: solve 3x^2 - 12x + 8 = 0 with the quadratic formula, giving x = 2 - 2sqrt(3)/3 and x = 2 + 2sqrt(3)/3. Only x = 2 - 2sqrt(3)/3 lies in (0, 2), so the value is 2 - 2sqrt(3)/3."
        constraints: "endpoint values equal (usually both 0); c is an exact radical inside the interval"
      - id: kp3
        name: When the hypotheses fail and what Rolle guarantees
        key_prerequisites: [continuity]
        exemplars:
          - problem: "Let $f(x) = abs(x - 1)$ on the interval $[0, 2]$. The endpoint values are equal. Rolle's theorem does not apply. Which hypothesis fails?"
            answer: "differentiability"
            answer_contract: {"kind": "label", "options": [["continuity"], ["differentiability"], ["endpoint equality"], ["no failure"]]}
            solution_sketch: "Check the hypotheses for f(x)=abs(x-1) on [0,2]. The option continuity is wrong because the absolute value function is continuous on [0,2]. The option endpoint equality is wrong because f(0)=1 and f(2)=1, so the endpoints do match. The option no failure is wrong because one hypothesis does fail. At x=1 the graph has a corner, so f is not differentiable there, and the differentiability hypothesis fails. The answer is differentiability."
          - problem: "A function $f$ is continuous on $[1, 6]$, differentiable on $(1, 6)$, and $f(1) = f(6)$. Which statement does Rolle's theorem guarantee?"
            answer: "a point c with f'(c)=0"
            answer_contract: {"kind": "label", "options": [["a point c with f'(c)=0"], ["a point c with f(c)=0"], ["f is constant on [1, 6]"], ["f'(1) = f'(6)"]]}
            solution_sketch: "List the hypotheses: f is continuous on [1,6], differentiable on (1,6), and f(1)=f(6). Rolle's theorem then gives at least one c in (1,6) with f'(c)=0. The option a point c with f(c)=0 is wrong because Rolle gives a zero of the derivative, not of the function. The option f is constant on [1, 6] is wrong because f need not be constant. The option f'(1) = f'(6) is wrong because endpoint derivatives need not be equal. The answer is a point c with f'(c)=0."
          - problem: "Let $f(x) = x^2 - 4x$ on $[0, 4]$. Find the value $c$ in $(0, 4)$ with $f'(c) = 0$."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Check that f(x)=x^2-4x is a polynomial, so it is continuous on [0,4] and differentiable on (0,4). Compute f(0)=0 and f(4)=0, so the endpoint hypothesis holds. Differentiate: f'(x)=2x-4. Set f'(x)=0: 2x-4=0, so x=2. The answer is 2."
          - problem: "Let $f(x) = sin(x)$ on $[0, pi]$. Find the value $c$ in $(0, pi)$ with $f'(c) = 0$."
            answer: "pi/2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Check f(0)=0 and f(pi)=0, and sin(x) is continuous on [0,pi] and differentiable on (0,pi). Differentiate: f'(x)=cos(x). Set cos(x)=0: on (0,pi) the only solution is x=pi/2. The answer is pi/2."
          - problem: "Let $f(x) = x^4 - 5x^2$ on $[-2, 2]$. Find the largest value $c$ in $(-2, 2)$ with $f'(c) = 0$."
            answer: "sqrt(10)/2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Check f(-2)=16-20=-4 and f(2)=16-20=-4, so the endpoints match. The function is a polynomial, so it is continuous and differentiable. Differentiate: f'(x)=4x^3-10x. Set f'(x)=0: 2x(2x^2-5)=0, so x=0 or x=sqrt(5/2) or x=-sqrt(5/2). On (-2,2), the largest value is sqrt(5/2)=sqrt(10)/2. The answer is sqrt(10)/2."
          - problem: "Let $f(x) = x^3 - a x$ on $[0, 2]$. Find the value of $a$ that makes $f(0) = f(2)$."
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "For Rolle's theorem on [0,2], the polynomial f is continuous and differentiable, so the remaining hypothesis is f(0)=f(2). Compute f(0)=0 and f(2)=8-2a. Set 8-2a=0, so a=4. The answer is 4."
        constraints: "one hypothesis-failure example, one conceptual guarantee question"
    diagnostic_exemplar:
      problem: 'Verify that $f(x) = x^3 - 9x$ satisfies the hypotheses of Rolle''s theorem on $[0, 3]$ and find the $c$ in $(0, 3)$ with $f''(c) = 0$.'
      answer: 'f is a polynomial (continuous and differentiable) with f(0) = f(3) = 0; c = √3'
      answer_contract: {kind: none}
      solution_sketch: '$f(0) = 0$ and $f(3) = 27 - 27 = 0$; $f''(x) = 3x^2 - 9 = 0$ gives $x = \sqrt{3} \approx 1.73$, which lies in $(0, 3)$.'
    anki_seeds:
      - front: "Rolle's theorem: if f is continuous on [a,b], differentiable on (a,b), and f(a) = f(b), then..."
        back: "some c in (a,b) has f'(c) = 0"
        type: basic
      - front: "Rolle's theorem needs THREE hypotheses:"
        back: "continuity on [a,b]; differentiability on (a,b); equal endpoint values f(a) = f(b)"
        type: basic

  - id: mean-value-theorem
    name: The Mean Value Theorem
    core: false                # terminal existence theorem, like the IVT
    difficulty: 0.6
    drill: false
    answer_kind: numeric
    expected_time_secs: 180
    prerequisites:
      - id: rolles-theorem
        weight: 0.7
        key: true
      - id: average-instantaneous-rate
        weight: 0.5
        key: true
      - id: continuity
        weight: 0.4
      - id: derivative-definition
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: Find the c guaranteed by the MVT
        key_prerequisites: [average-instantaneous-rate, derivative-definition]
        exemplars:
          - problem: 'Find the $c$ in $(1, 3)$ guaranteed by the Mean Value Theorem for $f(x) = x^2$ on $[1, 3]$.'
            answer: "c = 2"
            solution_sketch: 'Average slope $\frac{9 - 1}{2} = 4$; solve $f''(c) = 2c = 4$.'
          - problem: 'Find the $c$ in $(0, 3)$ guaranteed by the MVT for $f(x) = x^3$ on $[0, 3]$.'
            answer: "c = √3"
            solution_sketch: 'Average slope $\frac{27}{3} = 9$; $3c^2 = 9$ gives $c = \sqrt{3}$ (the positive root lies in the interval).'
          - problem: "Find the c in (2, 5) guaranteed by the Mean Value Theorem for f(x) = x^2 on [2, 5]."
            answer: "7/2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Write f(x) = x^2 on [2, 5] with a = 2 and b = 5. The Mean Value Theorem gives f'(c) = (f(b) - f(a))/(b - a). The power rule gives f'(c) = 2c, and (25 - 4)/(5 - 2) = 7. Solve 2c = 7 to get c = 7/2, which lies in (2, 5). The answer is 7/2."
          - problem: "Consider f(x) = x^3 on [0, 6]. Find the c in (0, 6) guaranteed by the Mean Value Theorem."
            answer: "2sqrt(3)"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Write f(x) = x^3 on [0, 6]. The Mean Value Theorem sets f'(c) equal to (216 - 0)/(6 - 0) = 36. The power rule gives f'(c) = 3c^2. Solve 3c^2 = 36, so c^2 = 12 and c = 2sqrt(3), which is in (0, 6). The answer is 2sqrt(3)."
          - problem: "Find the c in (1, 4) guaranteed by the Mean Value Theorem for f(x) = x^2 + 2x on [1, 4]."
            answer: "5/2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Write f(x) = x^2 + 2x on [1, 4]. The Mean Value Theorem gives f'(c) = (24 - 3)/(4 - 1) = 7. The power rule gives f'(c) = 2c + 2. Solve 2c + 2 = 7, so 2c = 5 and c = 5/2, which lies in (1, 4). The answer is 5/2."
          - problem: "Find the c in (0, 2) guaranteed by the Mean Value Theorem for f(x) = x^3 - 3x on [0, 2]."
            answer: "2sqrt(3)/3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Write f(x) = x^3 - 3x on [0, 2]. The Mean Value Theorem gives f'(c) = (2 - 0)/(2 - 0) = 1. The power rule gives f'(c) = 3c^2 - 3. Solve 3c^2 - 3 = 1, so 3c^2 = 4 and c = 2/sqrt(3) = 2sqrt(3)/3, which lies in (0, 2). The answer is 2sqrt(3)/3."
        constraints: "polynomials; f'(c) = (f(b)-f(a))/(b-a) solvable exactly with c inside the open interval"
      - id: kp2
        name: Check whether the MVT applies
        key_prerequisites: [continuity, rolles-theorem]
        exemplars:
          - problem: "The function $f(x) = |x + 4|$ is examined on the closed interval $[-9, 1]$. A hypothesis of the Mean Value Theorem is violated at exactly one interior point; give the x-coordinate of that point."
            answer: "-4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The object is f(x) = |x + 4| on the closed interval [-9, 1]. Step 1: an absolute value is continuous at every real number, so the continuity hypothesis holds on [-9, 1]. Step 2: at x = -4 the graph has a corner, since the left slope is -1 and the right slope is 1, so the derivative does not exist there. Step 3: the point -4 lies inside (-9, 1), so the differentiability hypothesis fails at that single interior point. The answer is -4."
          - problem: "The function $f(x) = \\frac{1}{x + 7}$ is examined on the closed interval $[-10, 3]$. Determine the x-coordinate of the interior point where a hypothesis of the Mean Value Theorem is violated."
            answer: "-7"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The object is f(x) = 1/(x + 7) on the closed interval [-10, 3]. Step 1: the denominator is zero at x = -7, so the function has no value there. Step 2: a missing value breaks the continuity hypothesis at the interior point -7. Step 3: every other point of (-10, 3) is regular, so the unique violation is at -7. The answer is -7."
          - problem: "A function is given by $f(x) = x$ for $x < 1$ and $f(x) = 3x - 2$ for $x \\ge 1$, on the interval $[0, 3]$. Select which hypothesis of the Mean Value Theorem is violated on this interval."
            answer: "differentiability at an interior point"
            answer_contract: {"kind": "label", "options": [["differentiability at an interior point"], ["continuity at an interior point"], ["continuity on the closed interval"], ["differentiability at an endpoint"]]}
            solution_sketch: "The object is the piecewise function f(x) = x for x < 1 and f(x) = 3x - 2 for x >= 1 on [0, 3]. Step 1: at x = 1 the pieces agree, because the left value 1 equals the right value 1, so the function has no gap on [0, 3]. Step 2: the one-sided slopes at x = 1 are 1 and 3, so they disagree and the derivative does not exist at the interior point 1. The option continuity at an interior point is wrong because there is no break at 1, only a corner. The option continuity on the closed interval is wrong because the pieces meet at x = 1, so no gap and no jump occur. The option differentiability at an endpoint is wrong because the theorem asks only about the open interval, so endpoint slopes are never tested. The answer is differentiability at an interior point."
          - problem: "The function $f(x) = x^{2/3}$ is examined on the closed interval $[-1, 8]$. A hypothesis of the Mean Value Theorem is violated at exactly one interior point; give the x-coordinate of that point."
            answer: "0"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The object is f(x) = x^(2/3) on the closed interval [-1, 8]. Step 1: the two-thirds power is defined for negative inputs, so the function is continuous on the whole interval. Step 2: the derivative is (2/3)x^(-1/3), which is undefined at x = 0. Step 3: the point 0 lies inside (-1, 8), so 0 is the single interior point where the differentiability hypothesis fails. The answer is 0."
          - problem: "The function $f(x) = (x^2 - 25)/(x - 5)$ is examined on the closed interval $[0, 8]$. Determine the x-coordinate of the interior point where a hypothesis of the Mean Value Theorem is violated."
            answer: "5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The object is f(x) = (x^2 - 25)/(x - 5) on the closed interval [0, 8]. Step 1: the numerator factors as (x - 5)(x + 5), so the quotient equals x + 5 at every point except x = 5. Step 2: at x = 5 the denominator is zero, so the function has no value and the continuity hypothesis fails. Step 3: the point 5 lies inside (0, 8), and no other interior point fails, so that point is unique. The answer is 5."
          - problem: "A function is defined by $f(x) = x^2$ for $x < 2$ and $f(x) = 5x - 4$ for $x \\ge 2$, with domain $[0, 5]$. Find the x-value inside the interval at which a hypothesis of the Mean Value Theorem is violated."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The object is the piecewise function f(x) = x^2 for x < 2 and f(x) = 5x - 4 for x >= 2 on [0, 5]. Step 1: the left limit at x = 2 is 4, while the right value is 6, so the two pieces do not meet. Step 2: the function is therefore not continuous at the interior point 2, and the continuity hypothesis fails there. Step 3: every other point of (0, 5) is fine, so the only failure point is 2. The answer is 2."
        constraints: "corner or discontinuity inside the interval; name the failed hypothesis"
      - id: kp3
        name: Consequences of the MVT
        key_prerequisites: [continuity, rolles-theorem]
        exemplars:
          - problem: 'Suppose $f(1) = 3$ and $f''(x) \leq 2$ for all $x$. What is the largest possible value of $f(5)$?'
            answer: "11"
            solution_sketch: 'By the MVT, $f(5) - f(1) = f''(c) \cdot 4 \leq 8$, so $f(5) \leq 11$.'
          - problem: "Suppose f is differentiable and f'(x) = 0 for every x. If f(1) = 7, what is f(11)?"
            answer: "7"
            answer_contract: {"kind": "exact"}
            solution_sketch: "MVT on [1,11]: f(11) - f(1) = f'(c) * (11 - 1) for some c. Since f'(c) = 0, f(11) - f(1) = 0, so f(11) = f(1) = 7. A constant function with value 7 fits the data. The answer is 7."
          - problem: "Suppose f(-1) = 4 and f'(x) <= 5 for every x. What is the largest possible value of f(3)?"
            answer: "24"
            answer_contract: {"kind": "exact"}
            solution_sketch: "MVT on [-1,3]: f(3) - f(-1) = f'(c) * (3 - (-1)) for some c. This gives f(3) - 4 = 4 f'(c) <= 4 * 5 = 20. Hence f(3) <= 4 + 20 = 24, and a line with slope 5 attains it. The answer is 24."
          - problem: "Suppose g(0) = 10 and g'(x) >= 3 for every x. What is the smallest possible value of g(4)?"
            answer: "22"
            answer_contract: {"kind": "exact"}
            solution_sketch: "MVT on [0,4]: g(4) - g(0) = g'(c) * 4 for some c. Since g'(c) >= 3, g(4) - 10 >= 12. Hence g(4) >= 22, and a line with slope 3 attains this bound. The answer is 22."
          - problem: "Suppose f is differentiable and 1 <= f'(x) <= 4 for every x. What is the largest possible value of f(7) - f(2)?"
            answer: "20"
            answer_contract: {"kind": "exact"}
            solution_sketch: "MVT on [2,7]: f(7) - f(2) = f'(c) * (7 - 2) for some c. Since f'(c) <= 4, the difference is at most 4 * 5 = 20. A line with slope 4 attains this value. The answer is 20."
          - problem: "Suppose f and g are differentiable on an interval and f'(x) = g'(x) for every x in that interval. Which conclusion does the Mean Value Theorem justify?"
            answer: "difference is constant"
            answer_contract: {"kind": "label", "options": [["difference is constant"], ["functions are equal"], ["difference is zero"], ["sum is constant"]]}
            solution_sketch: "Apply MVT to h = f - g on the interval: h(b) - h(a) = h'(c) * (b - a) for some c. Since h'(c) = f'(c) - g'(c) = 0, h(b) = h(a) for every pair of points, so h is constant. The wrong options come from these errors: functions are equal and difference is zero require the constant to be 0; sum is constant confuses the difference with the sum. The answer is difference is constant."
        constraints: "bounded-derivative estimates with integer data; conceptual consequence questions"
    diagnostic_exemplar:
      problem: 'Suppose $f$ is differentiable with $f(2) = 5$ and $f''(x) \leq 3$ for all $x$. Using the Mean Value Theorem, what is the largest possible value of $f(6)$?'
      answer: "17"
      solution_sketch: '$\frac{f(6) - f(2)}{6 - 2} = f''(c) \leq 3$, so $f(6) \leq 5 + 3 \cdot 4 = 17$.'
    anki_seeds:
      - front: "Mean Value Theorem: if f is continuous on [a,b] and differentiable on (a,b), then some c in (a,b) satisfies..."
        back: "f'(c) = (f(b) - f(a)) / (b - a)"
        type: basic
      - front: "Rolle's theorem is the MVT special case where..."
        back: "f(a) = f(b), so some c in (a,b) has f'(c) = 0"
        type: basic

  - id: closed-interval-method
    name: Absolute Extrema and the Closed-Interval Method
    core: true
    difficulty: 0.6
    drill: false
    answer_kind: numeric
    expected_time_secs: 180
    prerequisites:
      - id: critical-points-extrema
        weight: 0.8
        key: true
      - id: continuity
        weight: 0.5
        key: true
      - id: evaluating-functions
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: Absolute vs local extrema and the Extreme Value Theorem
        key_prerequisites: [continuity, critical-points-extrema]
        exemplars:
          - problem: "A function f is continuous on the closed interval [-2, 5]. Which statement does the Extreme Value Theorem guarantee?"
            answer: "f attains an absolute maximum and an absolute minimum"
            answer_contract: {"kind": "label", "options": [["f attains an absolute maximum and an absolute minimum"], ["f attains an absolute maximum but no absolute minimum"], ["f must be differentiable on the interval's interior"], ["f must have a critical point inside the interval"]]}
            solution_sketch: "The Extreme Value Theorem has two hypotheses: the function is continuous and the domain is a closed bounded interval, and f meets both. The conclusion is that f attains an absolute maximum value and an absolute minimum value somewhere on that interval. The option f must be differentiable on the interval's interior is the error of adding a differentiability hypothesis that the theorem never needs. The option f must have a critical point inside the interval is the error of assuming the extrema must sit at interior critical points. The option f attains an absolute maximum but no absolute minimum is the error of keeping only half of the guarantee. The answer is f attains an absolute maximum and an absolute minimum."
          - problem: "Let f(x) = 1/(x - 3) on the closed interval [1, 5]. State whether f attains an absolute maximum on [1, 5], and give the value of x where f is not continuous."
            answer: "verdict = no; x = 3"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["yes"], ["no"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "x"}]}
            solution_sketch: "The full object is f(x) = 1/(x - 3) on the closed interval [1, 5]. The domain is closed and bounded, but f is not continuous at x = 3, where the denominator is zero and the values grow without bound. Because f is unbounded near x = 3, it never attains an absolute maximum on [1, 5]. The option yes is the error of applying the Extreme Value Theorem without first checking that f is continuous. The answer is verdict = no; x = 3."
          - problem: "The function f(x) = x^3 - 12x + 3 is defined for all real numbers. Find the value of its local maximum."
            answer: "19"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full object is f(x) = x^3 - 12x + 3. Differentiate with the power rule: f'(x) = 3x^2 - 12 = 3(x - 2)(x + 2), so the critical points are x = -2 and x = 2. The first-derivative test shows f' changes from positive to negative at x = -2, so f has a local maximum there. Evaluate with the function rule: f(-2) = -8 + 24 + 3 = 19. The local maximum value is 19."
          - problem: "The function f(x) = x^2 + 8x + 10 is defined for all real numbers. Find its absolute minimum value."
            answer: "-6"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full object is f(x) = x^2 + 8x + 10. Complete the square: f(x) = (x + 4)^2 - 6. A square is never negative, so the least value of f is -6, reached at x = -4, and no value of x gives a smaller output. The answer is -6."
          - problem: "The function f(x) = x^2 - 10x + 21 is defined for all real numbers. Find the point where f attains its absolute minimum, and give the answer as (x, y)."
            answer: "(5, -4)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "The full object is f(x) = x^2 - 10x + 21. Complete the square: f(x) = (x - 5)^2 - 4, so the vertex is at x = 5 and the least value of f is -4. The absolute minimum point is (5, -4)."
          - problem: "The function f(x) = x^3 - 3x^2 + 1 is defined for all real numbers. Find the value of its local minimum."
            answer: "-3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full object is f(x) = x^3 - 3x^2 + 1. Differentiate with the power rule: f'(x) = 3x^2 - 6x = 3x(x - 2), so the critical points are x = 0 and x = 2. The first-derivative test shows f' changes from negative to positive at x = 2, so f has a local minimum there. Evaluate with the function rule: f(2) = 8 - 12 + 1 = -3. The local minimum value is -3."
        constraints: "one guarantee question, one counterexample on an open interval or with a discontinuity"
      - id: kp2
        name: The closed-interval method
        key_prerequisites: [critical-points-extrema, evaluating-functions]
        exemplars:
          - problem: "Find the absolute maximum value and the absolute minimum value of f(x) = x^3 - 3x on [0, 2]. Give it as max = value; min = value."
            answer: "max = 2; min = -2"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "max"}, {"contract": {"kind": "exact"}, "name": "min"}]}
            solution_sketch: "The function is f(x) = x^3 - 3x on [0, 2]. Step 1, closed-interval method: solve f'(x) = 3x^2 - 3 = 0 to get the critical point x = 1. Step 2: evaluate f at the critical point and endpoints: f(0) = 0, f(1) = -2, f(2) = 2. Step 3: compare the values. Thus max = 2; min = -2."
          - problem: "Find the absolute maximum value and the absolute minimum value of f(x) = x^2 - 2x on [0, 3]. Give it as max = value; min = value."
            answer: "max = 3; min = -1"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "max"}, {"contract": {"kind": "exact"}, "name": "min"}]}
            solution_sketch: "The function is f(x) = x^2 - 2x on [0, 3]. Step 1, closed-interval method: solve f'(x) = 2x - 2 = 0 to get the critical point x = 1. Step 2: evaluate f at the critical point and endpoints: f(0) = 0, f(1) = -1, f(3) = 3. Step 3: compare the values. Thus max = 3; min = -1."
          - problem: "Find the absolute maximum value and the absolute minimum value of f(x) = x^2 + 6x - 1 on [-5, 0]. Give it as max = value; min = value."
            answer: "max = -1; min = -10"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "max"}, {"contract": {"kind": "exact"}, "name": "min"}]}
            solution_sketch: "The function is f(x) = x^2 + 6x - 1 on [-5, 0]. Step 1, closed-interval method: solve f'(x) = 2x + 6 = 0 to get the critical point x = -3. Step 2: evaluate f at the critical point and endpoints: f(-5) = -6, f(-3) = -10, f(0) = -1. Step 3: compare the values. Thus max = -1; min = -10."
          - problem: "A weather station models the temperature in a town by T(t) = t^2 - 8t + 20 for 0 <= t <= 6. Find the absolute maximum value and the absolute minimum value of T on [0, 6]. Give it as max = value; min = value."
            answer: "max = 20; min = 4"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "max"}, {"contract": {"kind": "exact"}, "name": "min"}]}
            solution_sketch: "The temperature function is T(t) = t^2 - 8t + 20 on [0, 6]. Step 1, closed-interval method: solve T'(t) = 2t - 8 = 0 to get the critical point t = 4. Step 2: evaluate T at the critical point and endpoints: T(0) = 20, T(4) = 4, T(6) = 8. Step 3: compare the values. Thus max = 20; min = 4."
          - problem: "Find the x-value where the absolute maximum of f(x) = x^2 - 4x + 1 on [0, 5] occurs and the x-value where the absolute minimum occurs. Give them as xmax = value; xmin = value."
            answer: "xmax = 5; xmin = 2"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "xmax"}, {"contract": {"kind": "exact"}, "name": "xmin"}]}
            solution_sketch: "The function is f(x) = x^2 - 4x + 1 on [0, 5]. Step 1, closed-interval method: solve f'(x) = 2x - 4 = 0 to get the critical point x = 2. Step 2: evaluate f at x = 0, 2, 5: f(0) = 1, f(2) = -3, f(5) = 6. Step 3: compare the values; the largest is 6 at x = 5 and the smallest is -3 at x = 2. Thus xmax = 5; xmin = 2."
          - problem: "Find the absolute minimum value of f(x) = x^2 - 10x + 21 on [0, 7] and the x-value where it occurs. Give it as min = value; x = value."
            answer: "min = -4; x = 5"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "min"}, {"contract": {"kind": "exact"}, "name": "x"}]}
            solution_sketch: "The function is f(x) = x^2 - 10x + 21 on [0, 7]. Step 1, closed-interval method: solve f'(x) = 2x - 10 = 0 to get the critical point x = 5. Step 2: evaluate f at x = 0, 5, 7: f(0) = 21, f(5) = -4, f(7) = 0. Step 3: compare the values; the smallest is -4 at x = 5. Thus min = -4; x = 5."
        constraints: "compare f at interior critical points and both endpoints; all values integers"
      - id: kp3
        name: Closed-interval method with several critical points
        key_prerequisites: [critical-points-extrema, evaluating-functions]
        exemplars:
          - problem: 'Find the absolute maximum and minimum of $f(x) = x^4 - 2x^2$ on $[-2, 1]$.'
            answer: "absolute max 8 at x = -2; absolute min -1 at x = -1 and x = 1"
            answer_contract: {kind: none}
            solution_sketch: '$f''(x) = 4x^3 - 4x = 4x(x-1)(x+1)$; compare $f(-2) = 8$, $f(-1) = -1$, $f(0) = 0$, $f(1) = -1$.'
          - problem: 'Find the absolute maximum of $f(x) = x^3 - 12x$ on $[-3, 3]$.'
            answer: "16 at x = -2"
            answer_contract: {kind: none}
            solution_sketch: 'Critical points $\pm 2$; compare $f(-3) = 9$, $f(-2) = 16$, $f(2) = -16$, $f(3) = -9$.'
        constraints: "two or three interior critical points; ties allowed; integer values"
    diagnostic_exemplar:
      problem: 'Find the absolute maximum and minimum of $f(x) = x^4 - 8x^2$ on $[-1, 3]$.'
      answer: 'absolute max 9 at x = 3; absolute min -16 at x = 2'
      answer_contract: {kind: none}
      solution_sketch: '$f''(x) = 4x(x^2 - 4)$ gives interior critical points $x = 0$ and $x = 2$ (note $x = -2$ is outside the interval); compare $f(-1) = -7$, $f(0) = 0$, $f(2) = -16$, $f(3) = 9$.'
    anki_seeds:
      - front: "To find absolute extrema of a continuous f on [a, b], compare f at..."
        back: "all interior critical points and the two endpoints"
        type: basic
      - front: "Extreme Value Theorem: a continuous function on a CLOSED interval..."
        back: "attains both an absolute max and an absolute min there"
        type: basic

  - id: increasing-decreasing-intervals
    name: Increasing/Decreasing Intervals and the First Derivative Test
    core: true
    difficulty: 0.6
    drill: false
    answer_kind: numeric
    expected_time_secs: 180
    prerequisites:
      - id: critical-points-extrema
        weight: 0.8
        key: true
      - id: polynomial-inequalities
        weight: 0.5
      - id: derivative-power-rule
        weight: 0.4
      - id: product-quotient-rules
        weight: 0.4
      - id: derivatives-exp-log
        weight: 0.3
      - id: interval-notation
        weight: 0.3            # notation support: monotonicity answers throughout are open intervals in interval notation (re-audit R-01)
    knowledge_points:
      - id: kp1
        name: Intervals of increase and decrease
        key_prerequisites: [critical-points-extrema, derivative-power-rule]
        exemplars:
          - problem: "Find where f(x) = x^3 - 3x is increasing, and give the answer as an inequality in x."
            answer: "x < -1 or x > 1"
            answer_contract: {"kind": "inequality_union"}
            solution_sketch: "The full object is f(x) = x^3 - 3x. The power rule gives f'(x) = 3x^2 - 3 = 3(x - 1)(x + 1). By the sign rule for increasing, f is increasing where f'(x) > 0. The factor signs are positive on x < -1 and on x > 1, so the answer is x < -1 or x > 1."
          - problem: "Find where f(x) = x^2 - 6x is decreasing, and give the answer as an inequality in x."
            answer: "x < 3"
            answer_contract: {"kind": "inequality_union"}
            solution_sketch: "The full object is f(x) = x^2 - 6x. The power rule gives f'(x) = 2x - 6 = 2(x - 3). The sign rule says f is decreasing where f'(x) < 0. Since 2(x - 3) is negative exactly when x < 3, the answer is x < 3."
          - problem: "Find where f(x) = x^2 + 4x is increasing, and give the answer as an inequality in x."
            answer: "x > -2"
            answer_contract: {"kind": "inequality_union"}
            solution_sketch: "The full object is f(x) = x^2 + 4x. The power rule gives f'(x) = 2x + 4 = 2(x + 2). By the sign rule for increasing, f'(x) > 0. This holds for x > -2, so the answer is x > -2."
          - problem: "Find where f(x) = x^3 - 12x is decreasing, and give the answer as an inequality in x."
            answer: "-2 < x < 2"
            answer_contract: {"kind": "inequality_union"}
            solution_sketch: "The full object is f(x) = x^3 - 12x. The power rule gives f'(x) = 3x^2 - 12 = 3(x - 2)(x + 2). The sign rule says f is decreasing where f'(x) < 0. The product is negative between the roots, so the answer is -2 < x < 2."
          - problem: "Find where f(x) = x^3 - 3x^2 is increasing, and give the answer as an inequality in x."
            answer: "x < 0 or x > 2"
            answer_contract: {"kind": "inequality_union"}
            solution_sketch: "The full object is f(x) = x^3 - 3x^2. The power rule gives f'(x) = 3x^2 - 6x = 3x(x - 2). By the sign rule for increasing, f'(x) > 0. The factor sign chart is positive for x < 0 and for x > 2, so the answer is x < 0 or x > 2."
          - problem: "Find where f(x) = x^4 - 8x^2 is increasing, and give the answer as an inequality in x."
            answer: "-2 < x < 0 or x > 2"
            answer_contract: {"kind": "inequality_union"}
            solution_sketch: "The full object is f(x) = x^4 - 8x^2. The power rule gives f'(x) = 4x^3 - 16x = 4x(x - 2)(x + 2). The sign rule says f is increasing where f'(x) > 0. The sign chart gives positive on -2 < x < 0 and on x > 2, so the answer is -2 < x < 0 or x > 2."
        constraints: "derivative factors over the integers; report open intervals"
      - id: kp2
        name: The first derivative test
        key_prerequisites: [critical-points-extrema]
        exemplars:
          - problem: "For f(x) = x^3 - 3x^2 - 9x + 5, the derivative is f'(x) = 3(x + 1)(x - 3). Use the first derivative test and find fmax, the local maximum value, and fmin, the local minimum value."
            answer: "fmax = 10; fmin = -22"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "fmax"}, {"contract": {"kind": "exact"}, "name": "fmin"}]}
            solution_sketch: "For f(x) = x^3 - 3x^2 - 9x + 5 the derivative f'(x) = 3(x + 1)(x - 3) has sign pattern positive, negative, positive, so by the first derivative test the local maximum is at x = -1 and the local minimum is at x = 3. Evaluate f(-1) = -1 - 3 + 9 + 5 = 10 and f(3) = 27 - 27 - 27 + 5 = -22. The full result is fmax = 10; fmin = -22."
          - problem: "A differentiable function has f'(x) = (x + 1)^2(x - 3). At the critical number x = -1, select the correct classification of the point."
            answer: "neither"
            answer_contract: {"kind": "label", "options": [["maximum"], ["minimum"], ["neither"], ["unknown"]]}
            solution_sketch: "Around x = -1 the factor (x + 1)^2 is positive on both sides and (x - 3) is negative, so f' is negative on both sides and the first derivative test gives no extremum; x = 3 is a separate critical number and is not the point asked. The option maximum is wrong because f' never changes from positive to negative at x = -1; the option minimum is wrong because f' never changes from negative to positive; the option unknown is wrong because the sign behavior on both sides is fully known. The classification is neither."
          - problem: "For f(x) = x^3 - 12x + 1, the derivative is f'(x) = 3(x - 2)(x + 2). Use the first derivative test at x = -2 and give verdict, the type of extremum, and fval, the value of f there."
            answer: "verdict = maximum; fval = 17"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["maximum"], ["minimum"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "fval"}]}
            solution_sketch: "For f(x) = x^3 - 12x + 1, left of x = -2 both factors of f'(x) = 3(x - 2)(x + 2) are negative so f' is positive, and right of x = -2 the sign changes from positive to negative, so the first derivative test gives a maximum. The option minimum is wrong because the sign change goes from positive to negative, not from negative to positive. Evaluate f(-2) = -8 + 24 + 1 = 17. The result is verdict = maximum; fval = 17."
          - problem: "For f(x) = 2x^3 + 3x^2 - 36x + 5, the derivative is f'(x) = 6(x + 3)(x - 2). Find the local maximum value of f."
            answer: "86"
            answer_contract: {"kind": "exact"}
            solution_sketch: "For f(x) = 2x^3 + 3x^2 - 36x + 5 the derivative f'(x) = 6(x + 3)(x - 2) is positive, negative, positive in that order, so by the first derivative test the local maximum occurs at x = -3. Evaluate f(-3) = 2(-27) + 3(9) + 108 + 5 = 86. The local maximum value is 86."
          - problem: "For f(x) = x^3 - 6x^2 - 15x + 8, the derivative is f'(x) = 3(x - 5)(x + 1). Find the local minimum value of f."
            answer: "-92"
            answer_contract: {"kind": "exact"}
            solution_sketch: "For f(x) = x^3 - 6x^2 - 15x + 8 the derivative f'(x) = 3(x - 5)(x + 1) is positive, negative, positive, so by the first derivative test the local minimum occurs at x = 5. Evaluate f(5) = 125 - 150 - 75 + 8 = -92. The local minimum value is -92."
          - problem: "Use the first derivative test on f(x) = 2x^3 - 3x^2 - 12x + 5, whose derivative is f'(x) = 6(x - 2)(x + 1). Give fhi, the local maximum value, and flo, the local minimum value."
            answer: "fhi = 12; flo = -15"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "fhi"}, {"contract": {"kind": "exact"}, "name": "flo"}]}
            solution_sketch: "For f(x) = 2x^3 - 3x^2 - 12x + 5 the derivative f'(x) = 6(x - 2)(x + 1) has sign pattern positive, negative, positive, so the first derivative test gives a local maximum at x = -1 and a local minimum at x = 2. Evaluate f(-1) = -2 - 3 + 12 + 5 = 12 and f(2) = 16 - 12 - 24 + 5 = -15. The full result is fhi = 12; flo = -15."
        constraints: "include one no-sign-change trap; function values are integers"
      - id: kp3
        name: Monotonicity with products and exponentials
        key_prerequisites: [product-quotient-rules, derivatives-exp-log]
        exemplars:
          - problem: "Find the interval where $f(x) = x e^{-2x}$ is increasing, and give the answer as an inequality in x."
            answer: "x < 1/2"
            answer_contract: {"kind": "inequality_union"}
            solution_sketch: "Step 1, product rule: f'(x) = e^{-2x} + x(-2e^{-2x}) = e^{-2x}(1 - 2x). Step 2, sign analysis: e^{-2x} > 0 for all x, so f' has the sign of 1 - 2x. Step 3, solve 1 - 2x > 0, which gives x < 1/2. The interval of increase is x < 1/2."
          - problem: "Find the x-coordinate of the local minimum of $f(x) = x e^{3x}$ as a fraction."
            answer: "-1/3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1, product rule: f'(x) = e^{3x} + 3x e^{3x} = e^{3x}(1 + 3x). Step 2, sign analysis: e^{3x} > 0, so the sign of f' is the sign of 1 + 3x. Step 3, f' changes from negative to positive at x = -1/3, so that point is a local minimum. The local minimum has x-coordinate -1/3."
          - problem: "Find the interval where $f(x) = (x^2 - 3)e^{-x}$ is increasing, and give the answer as an inequality in x."
            answer: "-1 < x < 3"
            answer_contract: {"kind": "inequality_union"}
            solution_sketch: "Step 1, product rule: f'(x) = 2x e^{-x} - (x^2 - 3)e^{-x} = e^{-x}(-x^2 + 2x + 3). Step 2, factor the polynomial: -x^2 + 2x + 3 = -(x - 3)(x + 1). Step 3, e^{-x} > 0, so f' > 0 when (x - 3)(x + 1) < 0, which is -1 < x < 3. The interval of increase is -1 < x < 3."
          - problem: "Find the interval where $f(x) = (x^2 - 7x + 13)e^{x}$ is decreasing, and give the answer as an inequality in x."
            answer: "2 < x < 3"
            answer_contract: {"kind": "inequality_union"}
            solution_sketch: "Step 1, product rule: f'(x) = (2x - 7)e^{x} + (x^2 - 7x + 13)e^{x} = e^{x}(x^2 - 5x + 6). Step 2, factor: x^2 - 5x + 6 = (x - 2)(x - 3). Step 3, e^{x} > 0, so f' < 0 when (x - 2)(x - 3) < 0, which is 2 < x < 3. The interval of decrease is 2 < x < 3."
          - problem: "Find the x-coordinate of the local minimum of $f(x) = (2x - 3)e^{x}$ as a fraction."
            answer: "1/2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1, product rule: f'(x) = 2e^{x} + (2x - 3)e^{x} = e^{x}(2x - 1). Step 2, e^{x} > 0, so f' has the sign of 2x - 1. Step 3, f' changes from negative to positive at x = 1/2, so that point is a local minimum. The local minimum has x-coordinate 1/2."
          - problem: "Find the interval where $f(x) = (1 - 4x)e^{-x}$ is increasing, and give the answer as an inequality in x."
            answer: "x > 5/4"
            answer_contract: {"kind": "inequality_union"}
            solution_sketch: "Step 1, product rule: f'(x) = -4e^{-x} - (1 - 4x)e^{-x} = e^{-x}(4x - 5). Step 2, e^{-x} > 0 for all x, so f' has the sign of 4x - 5. Step 3, solve 4x - 5 > 0, which gives x > 5/4. The interval of increase is x > 5/4."
        constraints: "the exponential factor is always positive — sign comes from the polynomial factor"
    diagnostic_exemplar:
      problem: 'Find the intervals of increase and decrease of $f(x) = x^2 e^{-x}$.'
      answer: "increasing on (0, 2); decreasing on (-∞, 0) and (2, ∞)"
      answer_contract: {kind: none}
      solution_sketch: '$f''(x) = e^{-x}(2x - x^2) = e^{-x} x(2 - x)$, positive exactly for $0 < x < 2$.'
    anki_seeds:
      - front: "f' > 0 on an interval means f is ___ there; f' < 0 means f is ___."
        back: "increasing; decreasing"
        type: basic
      - front: "First derivative test: f' changes + to - at c means ___; - to + means ___; no sign change means ___."
        back: "local max; local min; no extremum"
        type: basic

  - id: concavity-inflection-points
    name: Concavity and Inflection Points
    core: true
    difficulty: 0.6
    drill: false
    answer_kind: numeric
    expected_time_secs: 180
    prerequisites:
      - id: higher-order-derivatives
        weight: 0.7
        key: true
      - id: increasing-decreasing-intervals
        weight: 0.4
      - id: critical-points-extrema
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: Intervals of concavity
        key_prerequisites: [higher-order-derivatives]
        exemplars:
          - problem: "Let f(x) = x^3 - 3x. Find the open interval where f is concave up, and give the answer as an inequality in x."
            answer: "x > 0"
            answer_contract: {"kind": "inequality_union"}
            solution_sketch: "For f(x) = x^3 - 3x, use higher-order derivatives to get f''(x) = 6x. The concavity test says f''(x) > 0 means concave up, so solve 6x > 0. The answer is x > 0."
          - problem: "Let f(x) = x^3 + 3x^2. Find the open interval where f is concave up, and give the answer as an inequality in x."
            answer: "x > -1"
            answer_contract: {"kind": "inequality_union"}
            solution_sketch: "For f(x) = x^3 + 3x^2, use higher-order derivatives to get f''(x) = 6x + 6. The concavity test says f''(x) > 0 means concave up, so solve 6x + 6 > 0. The answer is x > -1."
          - problem: "Let f(x) = x^3 - 3x^2 - 9x + 5. Find the open interval where f is concave up, and give the answer as an inequality in x."
            answer: "x > 1"
            answer_contract: {"kind": "inequality_union"}
            solution_sketch: "For f(x) = x^3 - 3x^2 - 9x + 5, use higher-order derivatives to get f''(x) = 6x - 6. The concavity test says f''(x) > 0 means concave up, so solve 6x - 6 > 0. The answer is x > 1."
          - problem: "Let f(x) = x^4 - 6x^2. Find the open intervals where f is concave up, and give the answer as an inequality in x."
            answer: "x < -1 or x > 1"
            answer_contract: {"kind": "inequality_union"}
            solution_sketch: "For f(x) = x^4 - 6x^2, use higher-order derivatives to get f''(x) = 12x^2 - 12. Factor f''(x) = 12(x - 1)(x + 1). The concavity test says f''(x) > 0 means concave up, and this happens for x < -1 or x > 1. The answer is x < -1 or x > 1."
          - problem: "Let f(x) = x^4 - 8x^3. Find the open interval where f is concave down, and give the answer as an inequality in x."
            answer: "0 < x < 4"
            answer_contract: {"kind": "inequality_union"}
            solution_sketch: "For f(x) = x^4 - 8x^3, use higher-order derivatives to get f''(x) = 12x^2 - 48x. Factor f''(x) = 12x(x - 4). The concavity test says f''(x) < 0 means concave down, and this happens for 0 < x < 4. The answer is 0 < x < 4."
          - problem: "Let f(x) = 2x^3 - 9x^2 + 12x. Find the open interval where f is concave up, and give the answer as an inequality in x."
            answer: "x > 3/2"
            answer_contract: {"kind": "inequality_union"}
            solution_sketch: "For f(x) = 2x^3 - 9x^2 + 12x, use higher-order derivatives to get f''(x) = 12x - 18. The concavity test says f''(x) > 0 means concave up, so solve 12x - 18 > 0. The answer is x > 3/2."
        constraints: "second derivative factors cleanly; report open intervals"
      - id: kp2
        name: Find inflection points (verify the sign change)
        key_prerequisites: [higher-order-derivatives]
        exemplars:
          - problem: "Let f(x) = x^4 - 24x^2. Find the x-coordinates of all inflection points of f, and give the answer as a set such as {1, 2}."
            answer: "{-2, 2}"
            answer_contract: {"kind": "set"}
            solution_sketch: "The full object is f(x) = x^4 - 24x^2. Step 1, use higher-order derivatives: f'(x) = 4x^3 - 48x, so f''(x) = 12x^2 - 48 = 12(x - 2)(x + 2). Step 2, solve f''(x) = 0: the candidate x-values are -2 and 2. Step 3, verify the sign change: each root is simple, so f'' changes sign at both and both are inflection points. The answer is {-2, 2}."
          - problem: "Let f(x) = x^5 - 5x^4. Find the x-coordinates of all inflection points of f, and give your answer as a set of x-values."
            answer: "{3}"
            answer_contract: {"kind": "set"}
            solution_sketch: "The full object is f(x) = x^5 - 5x^4. Step 1, use higher-order derivatives: f'(x) = 5x^4 - 20x^3, so f''(x) = 20x^3 - 60x^2 = 20x^2(x - 3). Step 2, solve f''(x) = 0: the candidates are x = 0 and x = 3. Step 3, verify the sign change: the factor x^2 is positive on both sides of 0, so f'' keeps the same sign at 0 and that candidate fails; the factor (x - 3) is negative just left of 3 and positive just right of 3, so f'' changes sign there. The only inflection point is at x = 3, so the answer is {3}."
          - problem: "Let f(x) = x^3 - 6x^2 + 5. Find the inflection point of the graph of f as an ordered pair, and give the answer as (x, y)."
            answer: "(2, -11)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "The full object is f(x) = x^3 - 6x^2 + 5. Step 1, use higher-order derivatives: f'(x) = 3x^2 - 12x, so f''(x) = 6x - 12. Step 2, solve f''(x) = 0: 6x - 12 = 0 gives x = 2. Step 3, verify the sign change: this linear second derivative is negative for x < 2 and positive for x > 2, so concavity changes at x = 2. Step 4, find the height: f(2) = 8 - 24 + 5 = -11. The answer is (2, -11)."
          - problem: "A function f has second derivative f''(x) = 6x + 12 for every real x. Find the x-coordinate of the inflection point of the graph of f."
            answer: "-2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full object is f''(x) = 6x + 12 for every x. Step 1, solve f''(x) = 0: 6x + 12 = 0 gives x = -2. Step 2, verify the sign change: this linear second derivative is negative before -2 and positive after -2, so concavity changes there and x = -2 is the inflection point. The answer is -2."
          - problem: "Let f(x) = sin(x). Find the x-value in the open interval (0, 2pi) at which the graph of f changes concavity."
            answer: "pi"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full object is f(x) = sin(x). Step 1, use higher-order derivatives: f'(x) = cos(x) and f''(x) = -sin(x). Step 2, solve f''(x) = 0 on (0, 2pi): the only solution inside the interval is x = pi. Step 3, verify the sign change: f'' = -sin(x) is negative just before pi and positive just after pi, so concavity changes at pi. The answer is pi."
          - problem: "Let f(x) = 2x^3 - 18x^2 + 5x - 1. Find the x-coordinate of the inflection point of the graph of f."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full object is f(x) = 2x^3 - 18x^2 + 5x - 1. Step 1, use higher-order derivatives: f'(x) = 6x^2 - 36x + 5, so f''(x) = 12x - 36. Step 2, solve f''(x) = 0: 12x - 36 = 0 gives x = 3. Step 3, verify the sign change: f'' is negative before 3 and positive after 3, so concavity changes at x = 3. The answer is 3."
        constraints: "include one f'' = 0 without sign change trap"
      - id: kp3
        name: Concavity and the graph
        key_prerequisites: [higher-order-derivatives, increasing-decreasing-intervals]
        exemplars:
          - problem: 'For $f(x) = x^3 - 3x$, give the inflection point as an ordered pair.'
            answer: "(0, 0)"
            solution_sketch: '$f''''$ changes sign at $x = 0$ and $f(0) = 0$.'
          - problem: "On an interval, a function has f'(x) > 0 and f''(x) < 0. Select the description of its graph on that interval."
            answer: "increasing concave down"
            answer_contract: {"kind": "label", "options": [["increasing concave down"], ["increasing concave up"], ["decreasing concave down"], ["decreasing concave up"]]}
            solution_sketch: "The first derivative sign gives increasing because f'(x) > 0 means the graph rises left to right. The second derivative sign gives concave down because f''(x) < 0 means the slope decreases. The option increasing concave up is wrong because positive f'' gives concave up; decreasing concave down is wrong because positive f' gives increasing; decreasing concave up is wrong on both signs. The description is increasing concave down."
          - problem: "Let f(x) = x^3 - 6x^2 + 5. Give the inflection point as (x, y)."
            answer: "(2, -11)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "Let f(x) = x^3 - 6x^2 + 5. Compute f''(x) = 6x - 12 by the power rule. Set f''(x) = 0: 6x - 12 = 0 gives x = 2. Compute f(2) = 8 - 24 + 5 = -11. The inflection point is (2, -11)."
          - problem: "Let f(x) = x^3 - 12x. Give the interval where f is increasing and concave up as an inequality in x."
            answer: "x > 2"
            answer_contract: {"kind": "inequality_union"}
            solution_sketch: "Let f(x) = x^3 - 12x. First derivative f'(x) = 3x^2 - 12 = 3(x-2)(x+2). Increasing where f'(x) > 0: x < -2 or x > 2. Second derivative f''(x) = 6x. Concave up where f''(x) > 0: x > 0. The overlap is x > 2."
          - problem: "Let f(x) = x^3 - 3x^2 + 4. Give the inflection point as (x, y)."
            answer: "(1, 2)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "Let f(x) = x^3 - 3x^2 + 4. Compute f''(x) = 6x - 6. Set f''(x) = 0: 6x - 6 = 0 gives x = 1. Compute f(1) = 1 - 3 + 4 = 2. The inflection point is (1, 2)."
          - problem: "Let f(x) = x^3 - 6x^2 + 9x. Find the x-coordinate of the inflection point."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Let f(x) = x^3 - 6x^2 + 9x. Compute f''(x) = 6x - 12. Set f''(x) = 0: 6x - 12 = 0. Solve to get x = 2. The x-coordinate is 2."
        constraints: "combine first- and second-derivative sign information verbally or as ordered pairs"
    diagnostic_exemplar:
      problem: 'Find the intervals of concavity of $f(x) = x^3 - 6x^2$ and give its inflection point as an ordered pair.'
      answer: 'concave down on (-∞, 2), concave up on (2, ∞); inflection point (2, -16)'
      answer_contract: {kind: none}
      solution_sketch: '$f''''(x) = 6x - 12$ is negative for $x < 2$ and positive for $x > 2$; $f(2) = 8 - 24 = -16$.'
    anki_seeds:
      - front: "f'' > 0 on an interval means the graph of f is ___ there."
        back: "concave up (bending upward, f' increasing)"
        type: basic
      - front: "An inflection point is where..."
        back: "the concavity changes sign (f'' changes sign), not merely where f'' = 0"
        type: basic

  - id: second-derivative-test
    name: The Second Derivative Test
    core: true
    difficulty: 0.65
    drill: false
    answer_kind: numeric
    expected_time_secs: 150
    prerequisites:
      - id: concavity-inflection-points
        weight: 0.7
        key: true
      - id: critical-points-extrema
        weight: 0.6
        key: true
      - id: increasing-decreasing-intervals
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: Apply the second derivative test
        key_prerequisites: [critical-points-extrema, concavity-inflection-points]
        exemplars:
          - problem: "The function f(x) = 2x^3 + 3x^2 - 36x + 5 has critical points x = -3 and x = 2. Use the second derivative test. Find the value of f'' at the local maximum."
            answer: "-30"
            answer_contract: {"kind": "exact"}
            solution_sketch: "First compute the second derivative of f(x) = 2x^3 + 3x^2 - 36x + 5 by the power rule: f''(x) = 12x + 6. At x = -3, f''(-3) = -30 < 0, so the second derivative test makes x = -3 the local maximum; at x = 2, f''(2) = 30 > 0, a local minimum. The value of f'' at the local maximum is -30."
          - problem: "The function f(x) = 4x^2 - 8x + 7 has one critical point at x = 1. Use the second derivative test. Find the value of f at the local minimum."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "First compute the second derivative of f(x) = 4x^2 - 8x + 7 by the power rule: f''(x) = 8. Since f''(1) = 8 > 0, the second derivative test makes x = 1 a local minimum. The value of f at that local minimum is f(1) = 4 - 8 + 7 = 3."
          - problem: "The function f(x) = x^3 - 6x^2 - 36x + 10 has critical points x = -2 and x = 6. Use the second derivative test. Find the value of f'' at the local minimum."
            answer: "24"
            answer_contract: {"kind": "exact"}
            solution_sketch: "First compute the second derivative of f(x) = x^3 - 6x^2 - 36x + 10 by the power rule: f''(x) = 6x - 12. At x = -2, f''(-2) = -24 < 0, a local maximum; at x = 6, f''(6) = 24 > 0, so the second derivative test makes x = 6 the local minimum. The value of f'' at the local minimum is 24."
          - problem: "The function f(x) = x^4 - 8x^2 + 9 has critical points x = -2, x = 0, and x = 2. Use the second derivative test. Find the value of f'' at the local maximum."
            answer: "-16"
            answer_contract: {"kind": "exact"}
            solution_sketch: "First compute the second derivative of f(x) = x^4 - 8x^2 + 9 by the power rule: f''(x) = 12x^2 - 16. At x = 0, f''(0) = -16 < 0, so the second derivative test makes x = 0 the local maximum; at x = 2 and x = -2, f'' = 32 > 0, local minima. The value of f'' at the local maximum is -16."
          - problem: "The function f(x) = 2x + 18/x has critical points x = -3 and x = 3. Use the second derivative test. Find the value of f'' at the local minimum."
            answer: "4/3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "First compute the second derivative of f(x) = 2x + 18x^(-1) by the power rule: f''(x) = 36x^(-3), that is 36/x^3. At x = 3, f''(3) = 4/3 > 0, so the second derivative test makes x = 3 the local minimum; at x = -3, f''(-3) = -4/3 < 0, a local maximum. The value of f'' at the local minimum is 4/3."
          - problem: "The function f(x) = 3x^4 - 4x^3 - 12x^2 + 5 has critical points x = -1, x = 0, and x = 2. Use the second derivative test. Find the value of f'' at the local maximum."
            answer: "-24"
            answer_contract: {"kind": "exact"}
            solution_sketch: "First compute the second derivative of f(x) = 3x^4 - 4x^3 - 12x^2 + 5 by the power rule: f''(x) = 36x^2 - 24x - 24. At x = 0, f''(0) = -24 < 0, so the second derivative test makes x = 0 the local maximum; at x = -1, f''(-1) = 36 > 0, and at x = 2, f''(2) = 72 > 0, local minima. The value of f'' at the local maximum is -24."
        constraints: "f'' nonzero at each tested critical point (test is conclusive)"
      - id: kp2
        name: When the test is inconclusive
        key_prerequisites: [concavity-inflection-points, increasing-decreasing-intervals]
        exemplars:
          - problem: "The function $f(x) = (x - 1)^4 + 5$ has a critical point at $x = 1$ with $f''(1) = 0$, so the second derivative test is inconclusive. Fall back to the first derivative test: check the sign of $f'(x) = 4(x - 1)^3$ on both sides of $x = 1$. What is the verdict, and what is the value of $f(1)$?"
            answer: "verdict = min; value = 5"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["min"], ["max"], ["neither"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "value"}]}
            solution_sketch: "Full object: $f(x) = (x - 1)^4 + 5$ with critical point $x = 1$. Step 1 (second derivative test): $f''(x) = 12(x - 1)^2$, so $f''(1) = 0$ and the test gives no verdict. Step 2 (first derivative test): $f'(x) = 4(x - 1)^3$ is negative for $x < 1$ and positive for $x > 1$, so the point is a local minimum. Step 3 (evaluation): $f(1) = 5$. So verdict = min; value = 5."
          - problem: "Let $f(x) = (x + 2)^3$. The only critical point is $x = -2$, where $f''(-2) = 0$, so the second derivative test is inconclusive. Fall back to the first derivative test: check the sign of $f'(x) = 3(x + 2)^2$ on both sides of $x = -2$. What is the verdict, and what is the value of $f(-2)$?"
            answer: "verdict = neither; value = 0"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["min"], ["max"], ["neither"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "value"}]}
            solution_sketch: "Full object: $f(x) = (x + 2)^3$ with critical point $x = -2$. Step 1 (second derivative test): $f''(x) = 6(x + 2)$, so $f''(-2) = 0$ and the test is inconclusive. Step 2 (first derivative test): $f'(x) = 3(x + 2)^2$ is nonnegative on both sides of $x = -2$, so $f'$ does not change sign and the point is neither. Step 3 (evaluation): $f(-2) = 0$. So verdict = neither; value = 0."
          - problem: "Consider $f(x) = 5 - (x + 1)^4$. The point $x = -1$ is critical and satisfies $f''(-1) = 0$, so the second derivative test is inconclusive. Study the sign of $f'$ on both sides of $x = -1$. Which class does the critical point fall into?"
            answer: "local maximum"
            answer_contract: {"kind": "label", "options": [["local maximum"], ["local minimum"], ["neither a maximum nor a minimum"], ["undetermined"]]}
            solution_sketch: "Full object: $f(x) = 5 - (x + 1)^4$ with critical point $x = -1$. Step 1 (second derivative test): $f''(x) = -12(x + 1)^2$, so $f''(-1) = 0$ and the test is inconclusive. Step 2 (first derivative test): $f'(x) = -4(x + 1)^3$ is positive for $x < -1$ and negative for $x > -1$, so $f$ rises and then falls. The option local minimum reads the signs backwards; the option neither a maximum nor a minimum copies the cubic case; the option undetermined wrongly assumes that $f'' = 0$ always blocks a classification. The key is local maximum."
          - problem: "Let $f(x) = x^6$. The critical point $x = 0$ has $f''(0) = 0$, so the second derivative test fails. Use the sign of $f'(x) = 6x^5$ instead, and give, as an inequality in x, the set on which $f$ is decreasing."
            answer: "x < 0"
            answer_contract: {"kind": "inequality_union"}
            solution_sketch: "Full object: $f(x) = x^6$ with critical point $x = 0$. Step 1 (second derivative test): $f''(x) = 30x^4$, so $f''(0) = 0$ and the test fails. Step 2 (first derivative test): $f'(x) = 6x^5$ is negative for $x < 0$ and positive for $x > 0$, so $f$ falls on the left of $0$ and rises on the right. Step 3 (interval form): the decreasing set is all $x$ with $x$ below $0$. The key is x < 0."
          - problem: "A cable between two poles hangs with height $h(x) = 2 + (x - 3)^4$ meters over the road, measured at position $x$. At $x = 3$ we have $h''(3) = 0$, so the second derivative test is inconclusive. Use the sign of $h'(x) = 4(x - 3)^3$ to classify the critical point. Give the extremum point of $h$ as (x, y)."
            answer: "(3, 2)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "Full object: $h(x) = 2 + (x - 3)^4$ with critical point $x = 3$. Step 1 (second derivative test): $h''(x) = 12(x - 3)^2$, so $h''(3) = 0$ and the test is inconclusive. Step 2 (first derivative test): $h'(x) = 4(x - 3)^3$ is negative for $x < 3$ and positive for $x > 3$, so the point is a minimum. Step 3 (evaluation): $h(3) = 2$. The extremum point as (x, y) is (3, 2)."
          - problem: "For $f(x) = x^n$ with a positive integer $n$, the point $x = 0$ is critical and $f''(0) = 0$, so the second derivative test is inconclusive, yet the first derivative test shows a local minimum at $x = 0$. Find the smallest positive integer $n$ with this behavior."
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Full object: $f(x) = x^n$ at the critical point $x = 0$. Step 1 (second derivative test): $f''(x) = n(n - 1)x^(n - 2)$ vanishes at $0$ for every $n \\ge 3$, so the test is inconclusive for $n \\ge 3$ and conclusive for $n = 2$. Step 2 (candidate check): for $n = 3$, $f'(x) = 3x^2$ does not change sign, so the point is neither, which fails the condition. Step 3 (first derivative test): for $n = 4$, $f'(x) = 4x^3$ changes from negative to positive, a local minimum. The smallest such $n$ is 4."
        constraints: "f''(c) = 0 cases; fall back to the first derivative test"
      - id: kp3
        name: Choose the right test
        key_prerequisites: [critical-points-extrema, concavity-inflection-points]
        exemplars:
          - problem: "Consider the function f(x) = x^4 - 8x^3. Find the x-coordinate of its local minimum."
            answer: "6"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Let f(x) = x^4 - 8x^3. Then f'(x) = 4x^3 - 24x^2 = 4x^2(x - 6), so the critical points are x = 0 and x = 6. The second derivative is f''(x) = 12x^2 - 48x, and f''(6) = 432 - 288 = 144 > 0, so the second derivative test gives a local minimum at x = 6 with a positive justifying sign. At x = 0 the value f''(0) = 0 makes that test fail, and the sign chart of f' shows f' < 0 on both sides of 0, so x = 0 is not an extremum. The x-coordinate of the local minimum is 6."
          - problem: "Consider the function g(x) = x^3 - 3x^2 - 9x + 5. It has a critical point at x = -1; apply the second derivative test there. Give the classification of that point and the value of g''(-1)."
            answer: "verdict = maximum; d2 = -12"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["maximum"], ["minimum"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "d2"}]}
            solution_sketch: "Let g(x) = x^3 - 3x^2 - 9x + 5. Then g'(x) = 3x^2 - 6x - 9 = 3(x - 3)(x + 1), so x = -1 and x = 3 are the critical points. The second derivative is g''(x) = 6x - 6, so g''(-1) = -12. The justifying sign is negative, and the second derivative test with g'' < 0 gives a local maximum. Choosing minimum is the error of reading that negative sign as positive. The final key is verdict = maximum; d2 = -12."
          - problem: "Consider the function h(x) = 3x^4 - 4x^3. Find the value of h at its local minimum."
            answer: "-1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Let h(x) = 3x^4 - 4x^3. Then h'(x) = 12x^3 - 12x^2 = 12x^2(x - 1), so the critical points are x = 0 and x = 1. The second derivative is h''(x) = 36x^2 - 24x, and h''(1) = 12 > 0, so the second derivative test gives a local minimum at x = 1 with a positive justifying sign. At x = 0 the value h''(0) = 0 makes that test fail, and the sign chart of h' shows h' < 0 on both sides of 0, so x = 0 is not an extremum. The local minimum value is h(1) = 3 - 4 = -1."
          - problem: "Consider the function s(x) = x^4 - 8x^3 + 24x^2 - 32x + 16, which has a stationary point at x = 2. Use whichever test works at that point. Give the classification and the value of s''(2)."
            answer: "verdict = minimum; d2 = 0"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["minimum"], ["maximum"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "d2"}]}
            solution_sketch: "Let s(x) = x^4 - 8x^3 + 24x^2 - 32x + 16, which equals (x - 2)^4. Then s'(x) = 4(x - 2)^3, so x = 2 is the only stationary point. The second derivative is s''(x) = 12(x - 2)^2, so s''(2) = 0 and the second derivative test fails. The sign chart of s' shows s' < 0 for x < 2 and s' > 0 for x > 2, so the first derivative test gives a local minimum with a negative to positive sign change. Choosing maximum is the error of reading that sign change backwards. The final key is verdict = minimum; d2 = 0."
          - problem: "Consider the function F(x) = -x^4 + 4x^3. Determine its local maximum value."
            answer: "27"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Let F(x) = -x^4 + 4x^3. Then F'(x) = -4x^3 + 12x^2 = -4x^2(x - 3), so the critical points are x = 0 and x = 3. The second derivative is F''(x) = -12x^2 + 24x, and F''(3) = -36 < 0, so the second derivative test gives a local maximum at x = 3 with a negative justifying sign. At x = 0 the value F''(0) = 0 makes that test fail, and the sign chart of F' shows F' > 0 on both sides of 0, so x = 0 is not an extremum. The local maximum value is F(3) = -81 + 108 = 27."
          - problem: "Consider the function q(x) = x^5 - 5x^4. How many local extrema does q have?"
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Let q(x) = x^5 - 5x^4. Then q'(x) = 5x^4 - 20x^3 = 5x^3(x - 4), so the stationary points are x = 0 and x = 4. The second derivative is q''(x) = 20x^3 - 60x^2; q''(4) = 320 > 0, so the second derivative test gives a local minimum at x = 4. At x = 0 the value q''(0) = 0 makes that test fail, and the sign chart of q' shows q' > 0 for x < 0 and q' < 0 for 0 < x < 4, so x = 0 is a local maximum by the first derivative test. Therefore q has 2 local extrema."
        constraints: "one mixed problem needing both tests; conclusions stated with the justifying sign"
    diagnostic_exemplar:
      problem: 'The function $f(x) = x^4 + 4x^3$ has critical points $x = 0$ and $x = -3$. Classify each (use whichever test works at each point).'
      answer: "x = -3 is a local min (f''(-3) = 36 > 0); x = 0 is not an extremum (f''(0) = 0 and f' = 4x²(x + 3) does not change sign at 0)"
      answer_contract: {kind: none}
      solution_sketch: '$f''''(x) = 12x^2 + 24x$ is $36 > 0$ at $x = -3$, a local min. At $x = 0$ it is $0$, so the test is inconclusive and the first derivative decides: the $4x^2$ factor of $f''(x) = 4x^2(x+3)$ keeps the sign positive on both sides of $0$.'
    anki_seeds:
      - front: "Second derivative test: at a critical point c with f'(c) = 0, f''(c) > 0 means ___ and f''(c) < 0 means ___."
        back: "local minimum; local maximum (f''(c) = 0 is inconclusive)"
        type: basic
      - front: "When the second derivative test is inconclusive (f''(c) = 0), classify the point by..."
        back: "the first derivative test (sign chart of f' around c)"
        type: basic

  - id: curve-analysis-derivatives
    name: First and Second Derivative Analysis
    core: false                # curve-sketching synthesis capstone
    difficulty: 0.65
    drill: false
    answer_kind: numeric
    expected_time_secs: 240
    prerequisites:
      - id: increasing-decreasing-intervals
        weight: 0.7
        key: true
      - id: concavity-inflection-points
        weight: 0.7
        key: true
      - id: second-derivative-test
        weight: 0.5
      - id: critical-points-extrema
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: Full feature analysis of a cubic
        key_prerequisites: [increasing-decreasing-intervals, concavity-inflection-points]
        exemplars:
          - problem: "For f(x) = x^3 - 3x^2 + 2, find the local maximum value and the local minimum value. Give the answer as name = value pairs separated by semicolons, using the names max and min."
            answer: "max = 2; min = -2"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "max"}, {"contract": {"kind": "exact"}, "name": "min"}]}
            solution_sketch: "Function: f(x) = x^3 - 3x^2 + 2. Step 1: First derivative f'(x) = 3x^2 - 6x = 3x(x - 2), so critical points are x = 0 and x = 2. Step 2: Second derivative f''(x) = 6x - 6 gives f''(0) = -6 < 0, so local maximum value f(0) = 2, and f''(2) = 6 > 0, so local minimum value f(2) = -2. The answer is max = 2; min = -2."
          - problem: "For f(x) = x^3 - 3x^2 - 9x + 5, find the inflection point. Give the answer as (x, y)."
            answer: "(1, -6)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "Function: f(x) = x^3 - 3x^2 - 9x + 5. Step 1: Second derivative f''(x) = 6x - 6 = 6(x - 1). Step 2: Set f''(x) = 0, giving x = 1. Step 3: f(1) = 1 - 3 - 9 + 5 = -6, so the inflection point is (1, -6). The answer is (1, -6)."
          - problem: "For f(x) = x^3 + 6x^2 + 9x, find the x-coordinates of all critical points and all inflection points. Give the answer as a comma-separated list in increasing order."
            answer: "-3, -2, -1"
            answer_contract: {"kind": "list", "member": {"kind": "exact"}, "ordered": true}
            solution_sketch: "Function: f(x) = x^3 + 6x^2 + 9x. Step 1: First derivative f'(x) = 3x^2 + 12x + 9 = 3(x + 1)(x + 3), so critical x-coordinates are -1 and -3. Step 2: Second derivative f''(x) = 6x + 12 = 6(x + 2), so the inflection x-coordinate is -2. Step 3: In increasing order, the list is -3, -2, -1. The answer is -3, -2, -1."
          - problem: "For f(x) = x^3 - 3x + 2, find the local maximum value and then the local minimum value. Give the answer as a comma-separated list."
            answer: "4, 0"
            answer_contract: {"kind": "list", "member": {"kind": "exact"}, "ordered": true}
            solution_sketch: "Function: f(x) = x^3 - 3x + 2. Step 1: First derivative f'(x) = 3x^2 - 3 = 3(x - 1)(x + 1), so critical points are x = -1 and x = 1. Step 2: Second derivative f''(x) = 6x gives f''(-1) = -6 < 0, so local maximum value f(-1) = 4, and f''(1) = 6 > 0, so local minimum value f(1) = 0. Step 3: The ordered list is 4, 0. The answer is 4, 0."
          - problem: "For f(x) = x^3 - 6x^2 + 9x, find the interval of increase and the interval of decrease. Give the answer as name = value pairs separated by semicolons, using the names inc and dec, with an inequality in x for each."
            answer: "inc = x < 1 or x > 3; dec = 1 < x < 3"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "inequality_union"}, "name": "inc"}, {"contract": {"kind": "inequality_union"}, "name": "dec"}]}
            solution_sketch: "Function: f(x) = x^3 - 6x^2 + 9x. Step 1: First derivative f'(x) = 3x^2 - 12x + 9 = 3(x - 1)(x - 3), so critical points are x = 1 and x = 3. Step 2: The sign of f' is positive on x < 1 or x > 3, so the interval of increase is x < 1 or x > 3. Step 3: The sign of f' is negative on 1 < x < 3, so the interval of decrease is 1 < x < 3. Step 4: The answer is inc = x < 1 or x > 3; dec = 1 < x < 3."
          - problem: "For f(x) = x^3 + 3x^2 - 9x, find the inflection point. Give the answer as (x, y)."
            answer: "(-1, 11)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "Function: f(x) = x^3 + 3x^2 - 9x. Step 1: Second derivative f''(x) = 6x + 6 = 6(x + 1). Step 2: Set f''(x) = 0, giving x = -1. Step 3: f(-1) = -1 + 3 + 9 = 11, so the inflection point is (-1, 11). The answer is (-1, 11)."
        constraints: "cubics with integer critical points and inflection points; report every feature"
      - id: kp2
        name: Full feature analysis of a quartic
        key_prerequisites: [increasing-decreasing-intervals, concavity-inflection-points, second-derivative-test]
        exemplars:
          - problem: "For f(x) = x^4 - 6x^2, find the local minimum value and the positive x-coordinate of the inflection point."
            answer: "min = -9; x = 1"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "min"}, {"contract": {"kind": "exact"}, "name": "x"}]}
            solution_sketch: "For f(x) = x^4 - 6x^2, compute f'(x) = 4x^3 - 12x = 4x(x^2 - 3) by the power rule. Critical points are x = 0 and x = ±sqrt(3); the second derivative test gives local minimum value f(sqrt(3)) = 9 - 18 = -9. Compute f''(x) = 12x^2 - 12, so inflection points solve 12x^2 - 12 = 0, giving x = ±1; the positive one is x = 1. The answer is min = -9; x = 1."
          - problem: "For f(x) = x^4 - 2x^2, find the local maximum value and the positive x-coordinate of the inflection point."
            answer: "max = 0; x = sqrt(3)/3"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "max"}, {"contract": {"kind": "exact"}, "name": "x"}]}
            solution_sketch: "For f(x) = x^4 - 2x^2, compute f'(x) = 4x^3 - 4x = 4x(x^2 - 1) by the power rule. Critical points are x = 0 and x = ±1; the second derivative test gives local maximum value f(0) = 0 because f''(0) = -4 < 0. Compute f''(x) = 12x^2 - 4, so inflection points solve 12x^2 - 4 = 0, giving x = ±sqrt(1/3) = ±sqrt(3)/3; the positive one is sqrt(3)/3. The answer is max = 0; x = sqrt(3)/3."
          - problem: "For f(x) = x^4 - 4x^2 + 1, find the local minimum point, the local maximum point, and the positive x-coordinate of the inflection point. Give the points as (x, y) pairs."
            answer: "minpt = (sqrt(2), -3); maxpt = (0, 1); infx = sqrt(6)/3"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"arity": 2, "kind": "coordinates"}, "name": "minpt"}, {"contract": {"arity": 2, "kind": "coordinates"}, "name": "maxpt"}, {"contract": {"kind": "exact"}, "name": "infx"}]}
            solution_sketch: "For f(x) = x^4 - 4x^2 + 1, compute f'(x) = 4x^3 - 8x = 4x(x^2 - 2) by the power rule. Critical points are x = 0 and x = ±sqrt(2); the second derivative test gives a local minimum at x = sqrt(2) and a local maximum at x = 0. Evaluate f(sqrt(2)) = 4 - 8 + 1 = -3 and f(0) = 1, so the points are (sqrt(2), -3) and (0, 1). Compute f''(x) = 12x^2 - 8, so inflection points solve 12x^2 - 8 = 0, giving x = ±sqrt(2/3) = ±sqrt(6)/3; the positive one is sqrt(6)/3. The answer is minpt = (sqrt(2), -3); maxpt = (0, 1); infx = sqrt(6)/3."
          - problem: "For f(x) = x^4 - 5x^2 + 4, find the local minimum value and both x-coordinates of the inflection points."
            answer: "min = -9/4; x1 = -sqrt(5/6); x2 = sqrt(5/6)"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "min"}, {"contract": {"kind": "exact"}, "name": "x1"}, {"contract": {"kind": "exact"}, "name": "x2"}]}
            solution_sketch: "For f(x) = x^4 - 5x^2 + 4, compute f'(x) = 4x^3 - 10x = 2x(2x^2 - 5) by the power rule. Critical points are x = 0 and x = ±sqrt(5/2); the second derivative test gives local minimum value f(sqrt(5/2)) = 25/4 - 25/2 + 4 = -9/4. Compute f''(x) = 12x^2 - 10, so inflection points solve 12x^2 - 10 = 0, giving x = ±sqrt(5/6). The answer is min = -9/4; x1 = -sqrt(5/6); x2 = sqrt(5/6)."
          - problem: "For f(x) = x^4 - 8x^2, find the local maximum point and the positive x-coordinate of the inflection point. Give the point as (x, y)."
            answer: "maxpt = (0, 0); infx = 2sqrt(3)/3"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"arity": 2, "kind": "coordinates"}, "name": "maxpt"}, {"contract": {"kind": "exact"}, "name": "infx"}]}
            solution_sketch: "For f(x) = x^4 - 8x^2, compute f'(x) = 4x^3 - 16x = 4x(x^2 - 4) by the power rule. Critical points are x = 0 and x = ±2; the second derivative test gives a local maximum at x = 0 because f''(0) = -16 < 0. Evaluate f(0) = 0, so the local maximum point is (0, 0). Compute f''(x) = 12x^2 - 16, so inflection points solve 12x^2 - 16 = 0, giving x = ±sqrt(4/3) = ±2sqrt(3)/3; the positive one is 2sqrt(3)/3. The answer is maxpt = (0, 0); infx = 2sqrt(3)/3."
          - problem: "For f(x) = x^4 - 3x^2 + 2, find the local minimum value and the positive x-coordinate of the inflection point. Give the x-coordinate to 3 decimals."
            answer: "min = -1/4; x = 0.707"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "min"}, {"contract": {"decimals": 3, "kind": "approx"}, "name": "x"}]}
            solution_sketch: "For f(x) = x^4 - 3x^2 + 2, compute f'(x) = 4x^3 - 6x = 2x(2x^2 - 3) by the power rule. Critical points are x = 0 and x = ±sqrt(3/2); the second derivative test gives local minimum value f(sqrt(3/2)) = 9/4 - 9/2 + 2 = -1/4. Compute f''(x) = 12x^2 - 6, so inflection points solve 12x^2 - 6 = 0, giving x = ±sqrt(1/2) = ±sqrt(2)/2; the positive one is about 0.7071, which rounds to 0.707. The answer is min = -1/4; x = 0.707."
        constraints: "even quartics with symmetric features; radical critical points allowed"
      - id: kp3
        name: Reconstruct features from f'
        key_prerequisites: [increasing-decreasing-intervals, second-derivative-test]
        exemplars:
          - problem: "The derivative of a differentiable function f is f'(x) = (x-2)^2(x-5). Find the x-coordinate of the local minimum of f."
            answer: "5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The derivative in factored form is f'(x) = (x-2)^2(x-5). Step 1: the squared factor is never negative, so the sign of f' follows the sign of x-5. Step 2: f' changes from negative to positive at x = 5, and the first derivative test gives a local minimum there. The x-coordinate of the local minimum is 5."
          - problem: "The derivative of a differentiable function f is f'(x) = x(x-3). Find the interval on which f is decreasing, and give the answer as an inequality in x."
            answer: "0 < x < 3"
            answer_contract: {"kind": "inequality_union"}
            solution_sketch: "The derivative in factored form is f'(x) = x(x-3). Step 1: the sign line for f' is positive for x < 0, negative for 0 < x < 3, and positive for x > 3. Step 2: f is decreasing where f' is negative, so the decreasing interval is 0 < x < 3. The interval is 0 < x < 3."
          - problem: "The derivative of a differentiable function f is f'(x) = (x+3)(x-1). Find the x-coordinate of the local maximum of f."
            answer: "-3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The derivative in factored form is f'(x) = (x+3)(x-1). Step 1: the sign line for f' is positive for x < -3, negative for -3 < x < 1, and positive for x > 1. Step 2: f' changes from positive to negative at x = -3, so the first derivative test gives a local maximum there. The x-coordinate of the local maximum is -3."
          - problem: "The derivative of a differentiable function f is f'(x) = (x-1)(x-4). Find the intervals on which f is increasing, and give the answer as an inequality in x."
            answer: "x < 1 or x > 4"
            answer_contract: {"kind": "inequality_union"}
            solution_sketch: "The derivative in factored form is f'(x) = (x-1)(x-4). Step 1: the sign line for f' is positive for x < 1, negative for 1 < x < 4, and positive for x > 4. Step 2: f is increasing where f' is positive, so the increasing intervals combine as x < 1 or x > 4. The interval is x < 1 or x > 4."
          - problem: "The derivative of a differentiable function f is f'(x) = (x+1)(x-6). Find the x-coordinate of the inflection point of f as a fraction."
            answer: "5/2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The derivative in factored form is f'(x) = (x+1)(x-6). Step 1: differentiate f' to get f'' = 2x - 5. Step 2: f'' changes sign at x = 5/2, so the concavity rule gives an inflection point of f there. The x-coordinate of the inflection point is 5/2."
          - problem: "The derivative of a differentiable function f is f'(x) = (x+2)(x-4). At x = -2, state whether f has a local maximum or a local minimum, and give the x-coordinate of the inflection point of f."
            answer: "verdict = maximum; x = 1"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["maximum"], ["minimum"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "x"}]}
            solution_sketch: "The derivative in factored form is f'(x) = (x+2)(x-4). Step 1: f' is positive for x < -2 and negative for -2 < x < 4, so the first derivative test gives a local maximum at x = -2; the wrong option minimum comes from reversing that sign change. Step 2: f'' = 2x - 2 changes sign at x = 1, so the concavity rule gives an inflection point of f there. Final answer: verdict = maximum; x = 1."
        constraints: "give f' in factored form; ask for features of f, not of f'"
    diagnostic_exemplar:
      problem: 'For $f(x) = x^3 - 12x$, give the local extrema and the inflection point.'
      answer: "local max f(-2) = 16; local min f(2) = -16; inflection at (0, 0)"
      answer_contract: {kind: none}
      solution_sketch: '$f'' = 3(x-2)(x+2)$, $f'''' = 6x$.'
    anki_seeds:
      - front: "Complete curve-analysis checklist (from f' and f''):"
        back: "critical points; increase/decrease intervals; local extrema; concavity intervals; inflection points"
        type: basic
      - front: "A repeated (even-power) factor in f' at x = c means..."
        back: "f' does not change sign at c — no local extremum there"
        type: basic

  - id: basic-optimization
    name: Basic Optimization
    core: true
    difficulty: 0.65
    drill: false
    answer_kind: numeric
    expected_time_secs: 240
    prerequisites:
      - id: closed-interval-method
        weight: 0.6
        key: true
      - id: critical-points-extrema
        weight: 0.7
        key: true
      - id: area-triangles-quadrilaterals
        weight: 0.4
        key: true
    knowledge_points:
      - id: kp1
        name: Optimize over two numbers with a constraint
        key_prerequisites: [critical-points-extrema]
        exemplars:
          - problem: "Two positive numbers sum to 30. Find the pair with the largest product as (x, y)."
            answer: "(15, 15)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "Let x and y be the numbers, so y = 30 - x. The product is P(x) = x(30 - x) = 30x - x^2. Differentiate: P'(x) = 30 - 2x. Set P'(x) = 0: 30 - 2x = 0 gives x = 15, so y = 30 - 15 = 15. The pair is (15, 15)."
          - problem: "Two positive numbers have product 196. Find the pair with the smallest sum as (x, y)."
            answer: "(14, 14)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "Let x and y be positive numbers with xy = 196, so y = 196/x. The sum is S(x) = x + 196/x. Differentiate: S'(x) = 1 - 196/x^2. Set S'(x) = 0: 1 - 196/x^2 = 0, so x^2 = 196 and x = 14. Then y = 196/14 = 14. The pair is (14, 14)."
          - problem: "Two positive numbers sum to 24. Find the pair that maximizes the quantity x^2 y as (x, y)."
            answer: "(16, 8)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "Let x and y be positive with x + y = 24, so y = 24 - x. The quantity is Q(x) = x^2(24 - x) = 24x^2 - x^3. Differentiate: Q'(x) = 48x - 3x^2 = 3x(16 - x). Set Q'(x) = 0: x = 0 or x = 16; positivity gives x = 16, so y = 8. The pair is (16, 8)."
          - problem: "Two positive numbers have product 64. Find the pair that minimizes x + 4y as (x, y)."
            answer: "(16, 4)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "Let x and y be positive with xy = 64, so y = 64/x. The expression is E(x) = x + 4(64/x) = x + 256/x. Differentiate: E'(x) = 1 - 256/x^2. Set E'(x) = 0: x^2 = 256, so x = 16 and y = 64/16 = 4. The pair is (16, 4)."
          - problem: "Two positive numbers sum to 36. Find the largest possible value of their product."
            answer: "324"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Let x and y be positive with x + y = 36, so y = 36 - x. The product is P(x) = x(36 - x) = 36x - x^2. Differentiate: P'(x) = 36 - 2x. Set P'(x) = 0: 36 - 2x = 0 gives x = 18, so y = 18. The largest product is 324."
          - problem: "Two positive numbers sum to 12. Find the pair that minimizes the sum of their squares as (x, y)."
            answer: "(6, 6)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "Let x and y be positive with x + y = 12, so y = 12 - x. The sum of squares is F(x) = x^2 + (12 - x)^2 = 2x^2 - 24x + 144. Differentiate: F'(x) = 4x - 24. Set F'(x) = 0: x = 6, so y = 12 - 6 = 6. The pair is (6, 6)."
        constraints: "constraint eliminates one variable; optimum at integer values"
      - id: kp2
        name: Fencing and area problems
        key_prerequisites: [critical-points-extrema, area-triangles-quadrilaterals]
        exemplars:
          - problem: "A gardener has 200 m of fence to enclose a rectangular vegetable plot. Find the dimensions that maximize the area, as (width, length)."
            answer: "(50, 50)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "Let width be x and length be y. The perimeter constraint is 2x + 2y = 200, so y = 100 - x. The area is A(x) = x(100 - x) = 100x - x^2. Differentiate: A'(x) = 100 - 2x. Set A'(x) = 0: x = 50, so y = 50. The dimensions are (50, 50)."
          - problem: "A rectangular pen uses a barn as one side and 80 m of fence for the other three sides. Find the length of the side parallel to the barn that maximizes the area."
            answer: "40"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Let x be each side perpendicular to the barn and y the side parallel to it. The fence constraint is 2x + y = 80, so y = 80 - 2x. The area is A(x) = x(80 - 2x) = 80x - 2x^2. Differentiate: A'(x) = 80 - 4x. Set A'(x) = 0: x = 20, so y = 40. The parallel side length is 40."
          - problem: "A rectangular pen uses a wall as one side and 100 m of fence for the other three sides. Find the dimensions that maximize the area, as (side perpendicular to the wall, side parallel to the wall)."
            answer: "(25, 50)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "Let x be each side perpendicular to the wall and y the side parallel to the wall. The fence constraint is 2x + y = 100, so y = 100 - 2x. The area is A(x) = x(100 - 2x) = 100x - 2x^2. Differentiate: A'(x) = 100 - 4x. Set A'(x) = 0: x = 25, so y = 50. The dimensions are (25, 50)."
          - problem: "A rectangular field is divided into two equal parts by a fence parallel to one side. The total fence used for the perimeter and the divider is 600 m. Find the dimensions that maximize the total area, as (side perpendicular to the divider, side parallel to the divider)."
            answer: "(150, 100)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "Let x be the side perpendicular to the divider and y the side parallel to the divider. The total fence is 2x + 3y = 600, so x = 300 - 1.5y. The area is A(y) = y(300 - 1.5y) = 300y - 1.5y^2. Differentiate: A'(y) = 300 - 3y. Set A'(y) = 0: y = 100, so x = 150. The dimensions are (150, 100)."
          - problem: "A rectangular garden is divided into two equal plots by a fence parallel to one side. The total fence used for the perimeter and the divider is 240 m. Find the dimensions that maximize the total area, as (side perpendicular to the divider, side parallel to the divider)."
            answer: "(60, 40)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "Let x be the side perpendicular to the divider and y the side parallel to the divider. The total fence is 2x + 3y = 240, so x = 120 - 1.5y. The area is A(y) = y(120 - 1.5y) = 120y - 1.5y^2. Differentiate: A'(y) = 120 - 3y. Set A'(y) = 0: y = 40, so x = 60. The dimensions are (60, 40)."
          - problem: "A rectangular pen uses a barn as one side and 160 m of fence for the other three sides. Find the maximum area of the pen."
            answer: "3200"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Let x be each side perpendicular to the barn and y the side parallel to it. The fence constraint is 2x + y = 160, so y = 160 - 2x. The area is A(x) = x(160 - 2x) = 160x - 2x^2. Differentiate: A'(x) = 160 - 4x. Set A'(x) = 0: x = 40, so y = 80. The maximum area is 3200."
        constraints: "perimeter-style constraint linear in the dimensions; integer optimum"
      - id: kp3
        name: Confirm the optimum
        key_prerequisites: [closed-interval-method, critical-points-extrema]
        exemplars:
          - problem: "Let P(x) = x(24 - x) on [0, 24]. Its only critical point is x = 12. Find the absolute maximum value of P by comparing the critical value with the endpoint values."
            answer: "144"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Full object: P(x) = x(24 - x) on [0, 24] with critical point x = 12. Endpoint comparison: P(0) = 0 and P(24) = 0, while P(12) = 144, so the largest value is at x = 12. Second-derivative sign: P''(x) = -2, which is negative everywhere, so the critical point is a maximum. The maximum value is 144."
          - problem: "Let S(x) = x + 64/x on the interval x > 0. Its only critical point is x = 8. Find the absolute minimum value of S by using the second-derivative sign."
            answer: "16"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Full object: S(x) = x + 64/x on x > 0 with critical point x = 8. Second-derivative sign: S'(x) = 1 - 64/x^2, so S'(8) = 0, and S''(x) = 128/x^3 is positive for all x > 0. A positive second derivative means the critical point is a minimum, and S(8) = 8 + 8 = 16. The minimum value is 16."
          - problem: "Let f(x) = x^3 - 3x on [0, 2]. The only critical point in the interval is x = 1. Find the absolute minimum value of f by comparing the critical value with the endpoint values."
            answer: "-2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Full object: f(x) = x^3 - 3x on [0, 2] with critical point x = 1. Endpoint comparison: f(0) = 0, f(1) = -2, and f(2) = 2, so the smallest value is at x = 1. The second-derivative sign f''(x) = 6x gives f''(1) = 6 > 0, which also confirms a minimum. The minimum value is -2."
          - problem: "Let g(x) = x^4 - 8x^2 + 10 on [-3, 3]. Its critical points are x = -2, x = 0 and x = 2. Find the absolute minimum value of g by comparing the critical values with the endpoint values."
            answer: "-6"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Full object: g(x) = x^4 - 8x^2 + 10 on [-3, 3] with critical points x = -2, x = 0, and x = 2. Endpoint comparison: g(-3) = 19, g(-2) = -6, g(0) = 10, g(2) = -6, and g(3) = 19, so the smallest value is -6. The second-derivative sign at x = 2 is g''(2) = 40 > 0, which also confirms a minimum. The minimum value is -6."
          - problem: "Let h(x) = 2x + 18/x on the interval x > 0. Its only critical point is x = 3. State whether x = 3 gives the absolute largest or smallest value, and give that extreme value."
            answer: "verdict = minimum; value = 12"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["maximum"], ["minimum"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "value"}]}
            solution_sketch: "Full object: h(x) = 2x + 18/x on x > 0 with critical point x = 3. Second-derivative sign: h'(x) = 2 - 18/x^2, so h'(3) = 0, and h''(x) = 36/x^3 is positive for all x > 0. A positive second derivative means the critical point is a minimum, and h(3) = 6 + 6 = 12. The option maximum is wrong because a positive second derivative rules out a maximum. The answer is verdict = minimum; value = 12."
          - problem: "Let F(x) = x^3 - 12x on [-3, 3]. Its critical points are x = -2 and x = 2. State whether x = -2 gives the absolute largest or smallest value, and give that extreme value."
            answer: "verdict = maximum; value = 16"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["maximum"], ["minimum"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "value"}]}
            solution_sketch: "Full object: F(x) = x^3 - 12x on [-3, 3] with critical points x = -2 and x = 2. Endpoint comparison: F(-3) = 9, F(-2) = 16, F(2) = -16, and F(3) = -9, so the largest value is 16 at x = -2. The option minimum is wrong because F(-2) = 16 is larger than the endpoint and other critical values, so it is a maximum. The answer is verdict = maximum; value = 16."
        constraints: "justify via endpoint comparison or second-derivative sign; no unjustified answers"
    diagnostic_exemplar:
      problem: 'A rectangular pen uses a wall as one side, with $60$ m of fence for the other three sides. What dimensions maximize the area, and what is that area?'
      answer: "15 m (each side perpendicular to the wall) × 30 m (parallel side); area 450 m²"
      answer_contract: {kind: none}
      solution_sketch: '$2x + y = 60$; $A = x(60 - 2x)$; $A'' = 60 - 4x = 0$ at $x = 15$, $y = 30$.'
    anki_seeds:
      - front: "Optimization procedure in four steps:"
        back: "name the variables and constraint; write the objective in one variable; find critical points; check them (and endpoints) for the true optimum"
        type: basic
      - front: "A rectangle of fixed perimeter has maximum area when it is..."
        back: "a square"
        type: basic

  - id: optimization
    name: Optimization
    core: false                # applied word-problem genre; basic-optimization stays core
    difficulty: 0.7
    drill: false
    answer_kind: numeric
    expected_time_secs: 300
    prerequisites:
      - id: basic-optimization
        weight: 0.8
        key: true
      - id: volume-prisms-cylinders
        weight: 0.4
        key: true
      - id: second-derivative-test
        weight: 0.4
      - id: distance-midpoint-formulas
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: Volume and surface-area problems
        key_prerequisites: [basic-optimization, volume-prisms-cylinders]
        exemplars:
          - problem: "An open-top box is made from a 12 by 12 cm sheet by cutting equal squares of side x cm from the corners and folding up the sides. The volume is V = x(12 - 2x)^2. Find the side length x that maximizes the volume."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Start with the volume V = x(12 - 2x)^2. Differentiate by the product rule: V' = (12 - 2x)^2 + x*2(12 - 2x)(-2) = (12 - 2x)(12 - 6x). Set V' = 0: x = 2 or x = 6. The value x = 6 gives zero volume, so the maximum is at x = 2. The maximizing side length is 2."
          - problem: "An open-top box has a square base of side x m and volume 32 m^3. The height is h = 32/x^2, so the material surface area is S = x^2 + 4xh = x^2 + 128/x. Find the base side x that minimizes the surface area."
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Start with S = x^2 + 128/x. Differentiate by the power rule: S' = 2x - 128/x^2. Set S' = 0: 2x = 128/x^2, so x^3 = 64. The positive solution is x = 4. The minimizing base side is 4."
          - problem: "A closed cylindrical can has volume 54pi cm^3. Its radius is r and its height is h, with volume V = pi r^2 h and surface area S = 2pi r^2 + 2pi r h. Find the radius r that minimizes the surface area."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Start with V = pi r^2 h = 54pi, so h = 54/r^2. Substitute into S = 2pi r^2 + 2pi r h to get S = 2pi r^2 + 108pi/r. Differentiate: S' = 4pi r - 108pi/r^2. Set S' = 0: 4r^3 = 108, so r^3 = 27. The minimizing radius is 3."
          - problem: "An open-top box has a square base of side x m and surface area 48 m^2. The height is h = (48 - x^2)/(4x), so the volume is V = x^2 h = (48x - x^3)/4. Find the maximum volume."
            answer: "32"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Start with V = (48x - x^3)/4. Differentiate by the power rule: V' = (48 - 3x^2)/4. Set V' = 0: 3x^2 = 48, so x^2 = 16 and x = 4. Then V = (48*4 - 4^3)/4 = (192 - 64)/4 = 32. The maximum volume is 32."
          - problem: "A closed cylindrical can has surface area 54pi cm^2. Its radius is r and height is h, with surface area S = 2pi r^2 + 2pi r h and volume V = pi r^2 h. Find the height h that maximizes the volume."
            answer: "6"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Start with S = 2pi r^2 + 2pi r h = 54pi, so h = 27/r - r. Substitute into V = pi r^2 h to get V = pi(27r - r^3). Differentiate the bracket: 27 - 3r^2. Set it to 0: r^2 = 9, so r = 3. Then h = 27/3 - 3 = 6. The maximizing height is 6."
          - problem: "An open-top box has a square base of side x m and volume 256 m^3. The height is h = 256/x^2, so the surface area is S = x^2 + 4xh = x^2 + 1024/x. Find the base side x that minimizes the surface area."
            answer: "8"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Start with S = x^2 + 1024/x. Differentiate: S' = 2x - 1024/x^2. Set S' = 0: 2x^3 = 1024, so x^3 = 512. The positive solution is x = 8. The minimizing base side is 8."
        constraints: "state the volume/surface formulas in the problem; optimum at small integers"
      - id: kp2
        name: Cost and material problems
        key_prerequisites: [basic-optimization, volume-prisms-cylinders]
        exemplars:
          - problem: "A rectangular field of area 1800 square meters borders a straight river, so the three sides away from the river need fencing. Find the minimum total length of fence in meters."
            answer: "120"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Let x be each side perpendicular to the river and y the side parallel to it. The area constraint x*y = 1800 gives y = 1800/x, so the fence length is F = 2x + 1800/x. Differentiate with the power rule: F' = 2 - 1800/x^2. Put F' = 0: x^2 = 900, so x = 30 and y = 60. The minimum total length of fence is 2(30) + 60 = 120."
          - problem: "A closed cylindrical can must hold 54 pi cubic centimeters. Its surface area is S = 2 pi r^2 + 2 pi r h. Find the radius r in centimeters that minimizes the surface area."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Let r be the radius and h the height. The volume constraint pi r^2 h = 54 pi gives h = 54/r^2. Substitute into S = 2 pi r^2 + 2 pi r h to get S = 2 pi r^2 + 108 pi / r. Differentiate with the power rule: S' = 4 pi r - 108 pi / r^2. Put S' = 0: r^3 = 27, so r = 3. The radius that minimizes the surface area is 3."
          - problem: "A container with a square base and no top must hold 256 cubic centimeters. Find the side length of the square base in centimeters that minimizes the material for the base and the four sides."
            answer: "8"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Let x be the base side and h the height. The volume constraint x^2 h = 256 gives h = 256/x^2. The material is the base plus four sides: A = x^2 + 4xh = x^2 + 1024/x. Differentiate with the power rule: A' = 2x - 1024/x^2. Put A' = 0: x^3 = 512, so x = 8. The side length of the base that minimizes the material is 8."
          - problem: "A rectangular garden of area 216 square meters is enclosed by fence. The side facing the street costs 12 dollars per meter and each of the other three sides costs 6 dollars per meter. Find the minimum total cost of the fence in dollars."
            answer: "432"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Let x be the length of the street side and y the length of each adjacent side. The area constraint xy = 216 gives y = 216/x. The cost is C = 12x + 6x + 6(2y) = 18x + 12y = 18x + 2592/x. Differentiate with the power rule: C' = 18 - 2592/x^2. Put C' = 0: x^2 = 144, so x = 12 and y = 18. The minimum total cost is 18(12) + 12(18) = 432."
          - problem: "A closed rectangular box with a square base must hold 288 cubic centimeters. The material for the base and the top costs 4 dollars per square centimeter and the material for each of the four sides costs 3 dollars per square centimeter. Find the minimum total cost of the material in dollars."
            answer: "864"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Let x be the base side and h the height. The volume constraint x^2 h = 288 gives h = 288/x^2. The cost is 4(2x^2) for the base and top plus 3(4xh) for the sides: C = 8x^2 + 12xh = 8x^2 + 3456/x. Differentiate with the power rule: C' = 16x - 3456/x^2. Put C' = 0: x^3 = 216, so x = 6 and h = 8. The minimum total cost is 8(36) + 12(6)(8) = 864."
          - problem: "A closed rectangular box with a square base has a volume of 125 cubic centimeters. Find the minimum surface area of the box in square centimeters."
            answer: "150"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Let x be the base side and h the height. The volume constraint x^2 h = 125 gives h = 125/x^2. The surface area of the closed box is S = 2x^2 + 4xh = 2x^2 + 500/x. Differentiate with the power rule: S' = 4x - 500/x^2. Put S' = 0: x^3 = 125, so x = 5 and h = 5. The minimum surface area is 2(25) + 4(5)(5) = 150."
        constraints: "area/volume constraint plus linear-or-quadratic objective; integer optimum"
      - id: kp3
        name: Distance problems
        key_prerequisites: [basic-optimization, distance-midpoint-formulas]
        exemplars:
          - problem: "Find the point on the curve y = sqrt(x) closest to (3, 0), and give it as (x, y)."
            answer: "(5/2, sqrt(10)/2)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "Let the point be (x, sqrt(x)). Use the distance formula: the squared distance to (3, 0) is d^2 = (x - 3)^2 + x = x^2 - 5x + 9. Differentiate d^2 with the power rule: the derivative is 2x - 5. Set the derivative to zero and solve: x = 5/2. Compute the y-coordinate: sqrt(5/2) = sqrt(10)/2. The closest point is (5/2, sqrt(10)/2)."
          - problem: 'For the previous problem, what is the minimum distance itself?'
            answer: "√11/2"
            solution_sketch: '$d^2 = \left(-\frac{1}{2}\right)^2 + \frac{5}{2} = \frac{11}{4}$.'
          - problem: "Find the point on the line y = 2x + 1 closest to (0, 0), and give it as (x, y)."
            answer: "(-2/5, 1/5)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "A point on the line is (x, 2x + 1). Use the distance formula: d^2 = x^2 + (2x + 1)^2 = 5x^2 + 4x + 1. Differentiate d^2 with the power rule: 10x + 4. Set the derivative to zero: x = -2/5. Substitute into the line: y = 2(-2/5) + 1 = 1/5. The closest point is (-2/5, 1/5)."
          - problem: "Find the minimum distance from (0, 2) to the curve y = x^2."
            answer: "sqrt(7)/2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "A point on the curve is (x, x^2). Use the distance formula: d^2 = x^2 + (x^2 - 2)^2 = x^4 - 3x^2 + 4. Differentiate d^2 with the power rule: 4x^3 - 6x = 2x(2x^2 - 3). Set the derivative to zero: x = 0 or x^2 = 3/2. Compare values: at x = 0, d^2 = 4; at x^2 = 3/2, d^2 = 7/4. The minimum distance is sqrt(7)/2."
          - problem: "Find the minimum distance from (1, 1) to the line y = 3x + 2."
            answer: "2sqrt(10)/5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "A point on the line is (x, 3x + 2). Use the distance formula: d^2 = (x - 1)^2 + (3x + 1)^2 = 10x^2 + 4x + 2. Differentiate d^2 with the power rule: 20x + 4. Set the derivative to zero: x = -1/5. Compute d^2 at this x: 10(1/25) + 4(-1/5) + 2 = 8/5. Since d = sqrt(8/5), the minimum distance is 2sqrt(10)/5."
          - problem: "Find the point on the line y = -x + 4 closest to (0, 0), and give it as (x, y)."
            answer: "(2, 2)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "A point on the line is (x, -x + 4). Use the distance formula: d^2 = x^2 + (-x + 4)^2 = 2x^2 - 8x + 16. Differentiate d^2 with the power rule: 4x - 8. Set the derivative to zero: x = 2. Substitute into the line: y = -2 + 4 = 2. The closest point is (2, 2)."
        constraints: "minimize d² instead of d; squared distance is a polynomial in one variable"
    diagnostic_exemplar:
      problem: 'Find the point on the curve $y = \sqrt{x}$ closest to $(4, 0)$.'
      answer: '(7/2, √14/2)'
      solution_sketch: 'Minimize the squared distance $d^2 = (x-4)^2 + x = x^2 - 7x + 16$: $2x - 7 = 0$ gives $x = \frac{7}{2}$, and $y = \sqrt{7/2} = \frac{\sqrt{14}}{2}$.'
    anki_seeds:
      - front: "In distance-minimization problems, minimize ___ instead of the distance itself."
        back: "the squared distance d² — same minimizer, no square roots to differentiate"
        type: basic
      - front: "Constrained optimization: the constraint's job is to..."
        back: "eliminate one variable so the objective becomes a one-variable function"
        type: basic

  - id: marginal-analysis
    name: Marginal Cost and Revenue
    core: false                # named economics application of the derivative
    difficulty: 0.55
    drill: false
    answer_kind: numeric
    expected_time_secs: 150
    prerequisites:
      - id: derivative-power-rule
        weight: 0.7
        key: true
      - id: average-instantaneous-rate
        weight: 0.5
        key: true
      - id: evaluating-polynomials
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: Marginal cost and revenue as derivatives
        key_prerequisites: [derivative-power-rule]
        exemplars:
          - problem: "The cost of producing x items is C(x) = x^2/10 + 40x + 1000 euros. Find the marginal cost at x = 50, in euros per item."
            answer: "50"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Cost function: C(x) = x^2/10 + 40x + 1000. Apply the power rule to get C'(x) = x/5 + 40. Evaluate at x = 50: C'(50) = 50/5 + 40 = 10 + 40 = 50. The marginal cost is 50."
          - problem: "Revenue from selling x items is R(x) = 500x - x^2/2 euros. Find the marginal revenue at x = 200, in euros per item."
            answer: "300"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Revenue function: R(x) = 500x - x^2/2. Differentiate with the power rule: R'(x) = 500 - x. Evaluate at x = 200: R'(200) = 500 - 200 = 300. The marginal revenue is 300."
          - problem: "The cost of producing x items is C(x) = 3x^2 + 20x + 500 euros. Find the marginal cost at x = 10, in euros per item."
            answer: "80"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Cost function: C(x) = 3x^2 + 20x + 500. Differentiate by the power rule: C'(x) = 6x + 20. Evaluate at x = 10: C'(10) = 60 + 20 = 80. The marginal cost is 80."
          - problem: "Revenue from selling x items is R(x) = 200x - x^2/5 euros. Find the marginal revenue at x = 50, in euros per item."
            answer: "180"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Revenue function: R(x) = 200x - x^2/5. Differentiate by the power rule: R'(x) = 200 - 2x/5. Evaluate at x = 50: R'(50) = 200 - 100/5 = 200 - 20 = 180. The marginal revenue is 180."
          - problem: "Revenue from selling x items is R(x) = 80x - x^2/4 euros. Find the production level x at which the marginal revenue is 50 euros per item."
            answer: "60"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Revenue function: R(x) = 80x - x^2/4. Differentiate by the power rule: R'(x) = 80 - x/2. Set the marginal revenue equal to 50: 80 - x/2 = 50. Solve: x/2 = 30, so x = 60. The production level is 60."
          - problem: "Revenue from selling x items is R(x) = 600x - 2x^2 euros. Find the marginal revenue at x = 100, in euros per item."
            answer: "200"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Revenue function: R(x) = 600x - 2x^2. Differentiate by the power rule: R'(x) = 600 - 4x. Evaluate at x = 100: R'(100) = 600 - 400 = 200. The marginal revenue is 200."
        constraints: "quadratic cost/revenue with integer marginal values; state units"
      - id: kp2
        name: Marginal value vs actual change
        key_prerequisites: [derivative-power-rule, average-instantaneous-rate]
        exemplars:
          - problem: "Let C(x) = x^2/20 + 15x + 400. Find the difference, as a fraction, between the actual cost of the 41st item, C(41) - C(40), and the marginal cost C'(40)."
            answer: "1/20"
            answer_contract: {"kind": "exact"}
            solution_sketch: "C(x) = x^2/20 + 15x + 400. Step 1: Power rule gives C'(x) = x/10 + 15, so C'(40) = 19. Step 2: Evaluate C(41) - C(40) = (41^2 - 40^2)/20 + 15 = 81/20 + 15 = 381/20. Step 3: Subtract the marginal value: 381/20 - 19 = 381/20 - 380/20 = 1/20. The difference is 1/20."
          - problem: "Let R(x) = 150x - x^2/5 be a revenue function. Compute the actual revenue from the 31st unit, R(31) - R(30), minus the marginal revenue R'(30), as a fraction."
            answer: "-1/5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "R(x) = 150x - x^2/5. Step 1: The power rule gives R'(x) = 150 - 2x/5, so R'(30) = 150 - 12 = 138. Step 2: Evaluate the actual change R(31) - R(30) = 150 - (31^2 - 30^2)/5 = 150 - 61/5 = 689/5. Step 3: Subtract the marginal value from the actual change: 689/5 - 138 = 689/5 - 690/5 = -1/5. The requested quantity is -1/5."
          - problem: "Let C(x) = x^2/2 + 5x + 100. State whether the actual cost of the 11th item, C(11) - C(10), is larger or smaller than the marginal cost C'(10), and give the amount of the difference as a fraction."
            answer: "verdict = larger; amount = 1/2"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["larger"], ["smaller"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "amount"}]}
            solution_sketch: "C(x) = x^2/2 + 5x + 100. Step 1: Power rule gives C'(x) = x + 5, so C'(10) = 15. Step 2: Evaluate C(11) - C(10) = (121 - 100)/2 + 5 = 21/2 + 5 = 31/2. Step 3: Compare: 31/2 > 15, so actual is larger, and the difference is 31/2 - 15 = 1/2. So verdict = larger; amount = 1/2."
          - problem: "Let C(x) = x^2/25 + 10x + 250. Find the actual cost of the 26th item, C(26) - C(25), and the marginal cost C'(25), as exact fractions or integers."
            answer: "actual = 301/25; marginal = 12"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "actual"}, {"contract": {"kind": "exact"}, "name": "marginal"}]}
            solution_sketch: "C(x) = x^2/25 + 10x + 250. Step 1: Power rule gives C'(x) = 2x/25 + 10, so C'(25) = 12. Step 2: Evaluate C(26) - C(25) = (676 - 625)/25 + 10 = 51/25 + 10 = 301/25. So actual = 301/25; marginal = 12."
          - problem: "Let C(x) = 0.01x^3 + 0.5x^2 + 20x + 100. Find the difference, as a fraction, between the actual cost of the 11th item, C(11) - C(10), and the marginal cost C'(10)."
            answer: "81/100"
            answer_contract: {"kind": "exact"}
            solution_sketch: "C(x) = 0.01x^3 + 0.5x^2 + 20x + 100. Step 1: Power rule gives C'(x) = 0.03x^2 + x + 20, so C'(10) = 33. Step 2: Evaluate C(11) - C(10) = 0.01(1331 - 1000) + 0.5(121 - 100) + 20 = 3.31 + 10.5 + 20 = 3381/100. Step 3: Difference = 3381/100 - 33 = 3381/100 - 3300/100 = 81/100. The difference is 81/100."
          - problem: "Let P(x) = -0.03x^2 + 50x - 200 be a profit function. Compute the actual profit change P(101) - P(100) minus the marginal profit P'(100), as a fraction."
            answer: "-3/100"
            answer_contract: {"kind": "exact"}
            solution_sketch: "P(x) = -0.03x^2 + 50x - 200. Step 1: The power rule gives P'(x) = -0.06x + 50, so P'(100) = -6 + 50 = 44. Step 2: Evaluate the actual change P(101) - P(100) = -0.03(101^2 - 100^2) + 50 = -6.03 + 50 = 43.97 = 4397/100. Step 3: Subtract the marginal value from the actual change: 4397/100 - 44 = 4397/100 - 4400/100 = -3/100. The requested quantity is -3/100."
        constraints: "actual and marginal values differ by a small terminating decimal"
      - id: kp3
        name: Maximize profit with marginals
        key_prerequisites: [derivative-power-rule, evaluating-polynomials]
        exemplars:
          - problem: "A firm sells a product at a constant price, so revenue is R(x) = 240x dollars. The cost is C(x) = x^2 + 60x + 1500 dollars. Profit is P = R - C. Give the profit-maximizing quantity x and the maximum profit P as x = value; P = value."
            answer: "x = 90; P = 6600"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "x"}, {"contract": {"kind": "exact"}, "name": "P"}]}
            solution_sketch: "First write the profit: P(x) = 240x - (x^2 + 60x + 1500) = -x^2 + 180x - 1500. Differentiate with the power rule: P'(x) = -2x + 180. Set P'(x) = 0: -2x + 180 = 0, so x = 90. Since P''(x) = -2 < 0, this critical point is the maximum. Evaluate: P(90) = -8100 + 16200 - 1500 = 6600. The answer is x = 90; P = 6600."
          - problem: "A firm has revenue R(x) = 500x and cost C(x) = x^2 + 80x + 2000, in dollars. Profit is P = R - C. At what quantity x is marginal revenue equal to marginal cost, and what is the maximum profit P? Give the answer as x = value; P = value."
            answer: "x = 210; P = 42100"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "x"}, {"contract": {"kind": "exact"}, "name": "P"}]}
            solution_sketch: "First write the profit: P(x) = 500x - (x^2 + 80x + 2000) = -x^2 + 420x - 2000. Marginal revenue is R'(x) = 500 and marginal cost is C'(x) = 2x + 80. Set them equal: 500 = 2x + 80, so 420 = 2x and x = 210. Since P''(x) = -2 < 0, this is the maximum. Evaluate: P(210) = -44100 + 88200 - 2000 = 42100. The answer is x = 210; P = 42100."
          - problem: "The profit from selling x lamps is P(x) = -2x^2 + 200x - 1800 dollars. Find the quantity x that maximizes profit and the maximum profit P, and give the answer as x = value; P = value."
            answer: "x = 50; P = 3200"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "x"}, {"contract": {"kind": "exact"}, "name": "P"}]}
            solution_sketch: "The profit function is P(x) = -2x^2 + 200x - 1800. Differentiate with the power rule: P'(x) = -4x + 200. Set P'(x) = 0: -4x + 200 = 0, so x = 50. Since P''(x) = -4 < 0, this critical point is the maximum. Evaluate: P(50) = -2(2500) + 200(50) - 1800 = 3200. The answer is x = 50; P = 3200."
          - problem: "A company has revenue R(x) = 180x and cost C(x) = x^2 + 40x + 900, in dollars. Profit is P = R - C. Find the maximum profit P."
            answer: "4000"
            answer_contract: {"kind": "exact"}
            solution_sketch: "First write the profit: P(x) = 180x - (x^2 + 40x + 900) = -x^2 + 140x - 900. Differentiate with the power rule: P'(x) = -2x + 140. Set P'(x) = 0: x = 70. Since P''(x) = -2 < 0, this is the maximum. Evaluate: P(70) = -4900 + 9800 - 900 = 4000. The answer is 4000."
          - problem: "A firm has revenue R(x) = 300x and cost C(x) = 2x^2 + 60x + 1200, in dollars. Profit is P = R - C. Find the quantity x that maximizes profit."
            answer: "60"
            answer_contract: {"kind": "exact"}
            solution_sketch: "First write the profit: P(x) = 300x - (2x^2 + 60x + 1200) = -2x^2 + 240x - 1200. Differentiate with the power rule: P'(x) = -4x + 240. Set P'(x) = 0: -4x + 240 = 0, so x = 60. Since P''(x) = -4 < 0, this is the maximum. The answer is 60."
          - problem: "A bakery's profit from x cakes is P(x) = -x^2 + 120x - 2000 dollars. Give the number of cakes x that maximizes profit and the maximum profit P as x = value; P = value."
            answer: "x = 60; P = 1600"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "x"}, {"contract": {"kind": "exact"}, "name": "P"}]}
            solution_sketch: "The profit function is P(x) = -x^2 + 120x - 2000. Differentiate with the power rule: P'(x) = -2x + 120. Set P'(x) = 0: -2x + 120 = 0, so x = 60. Since P''(x) = -2 < 0, this critical point is the maximum. Evaluate: P(60) = -3600 + 7200 - 2000 = 1600. The answer is x = 60; P = 1600."
        constraints: "quadratic profit with integer vertex; P'' < 0 so the critical point is the max"
    diagnostic_exemplar:
      problem: 'Revenue is $R(x) = 120x$ and cost is $C(x) = x^2 + 20x + 800$, both in euros. How many items maximize the profit $P = R - C$, and what is the maximum profit?'
      answer: "x = 50 items; maximum profit €1700"
      answer_contract: {kind: none}
      solution_sketch: '$P(x) = -x^2 + 100x - 800$; $P''(x) = -2x + 100 = 0$ at $x = 50$; $P(50) = 1700$.'
    anki_seeds:
      - front: "Marginal cost is defined as..."
        back: "C'(x) — the derivative of cost, approximating the cost of the next item"
        type: basic
      - front: "Profit is maximized (interior optimum) when marginal revenue ___ marginal cost."
        back: "equals — P' = R' - C' = 0"
        type: basic

  - id: lhopitals-rule
    name: 'L''Hôpital''s Rule'
    core: true
    difficulty: 0.65
    drill: false
    answer_kind: numeric
    expected_time_secs: 150
    prerequisites:
      - id: derivatives-exp-log
        weight: 0.6
        key: true
      - id: derivatives-trig
        weight: 0.5
        key: true
      - id: one-sided-infinite-limits
        weight: 0.5
        key: true
      - id: limits-algebraic
        weight: 0.4
      - id: graphs-of-logarithmic-functions
        weight: 0.0            # conceptual only: ln x → -∞ as x → 0+ and ln x → ∞ underlie the ∞/∞ and 0·∞ forms; untaught elsewhere in this closure (re-audit R-04)
    knowledge_points:
      - id: kp1
        name: 0/0 forms
        key_prerequisites: [derivatives-trig, derivatives-exp-log]
        exemplars:
          - problem: 'Evaluate $\lim_{x \to 0} \frac{\sin x}{x}$ using L''Hôpital''s rule.'
            answer: "1"
            solution_sketch: '$\frac{0}{0}$ form; differentiate: $\frac{\cos x}{1} \to \cos 0 = 1$.'
          - problem: 'Evaluate $\lim_{x \to 0} \frac{e^x - 1}{x}$.'
            answer: "1"
          - problem: 'Evaluate $\lim_{x \to 0} \frac{e^x - 1 - x}{x^2}$.'
            answer: "1/2"
            solution_sketch: '$\frac{0}{0}$ form; apply twice: $\frac{e^x - 1}{2x} \to \frac{e^x}{2} \to \frac{1}{2}$.'
          - problem: "Consider the limit $\\lim_{x \\to 0} \\frac{\\sin(5x)}{x}$. First check that the quotient has the 0/0 form, then evaluate."
            answer: "5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The limit is $\\lim_{x \\to 0} \\frac{\\sin(5x)}{x}$. At $x = 0$, both $\\sin(5x)$ and $x$ equal 0, so the quotient has the 0/0 form. L'Hopital's rule gives the limit of the quotient of derivatives, $(5\\cos(5x))/1$. At $x = 0$ this is $5\\cos(0)$, which equals 5. The limit is 5."
          - problem: "Consider the limit $\\lim_{x \\to 0} \\frac{1 - \\cos(3x)}{x^2}$. First check that the quotient has the 0/0 form, then evaluate."
            answer: "9/2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The limit is $\\lim_{x \\to 0} \\frac{1 - \\cos(3x)}{x^2}$. At $x = 0$, $1 - \\cos(3x) = 0$ and $x^2 = 0$, so the quotient has the 0/0 form. Apply L'Hopital's rule once to get $\\frac{3\\sin(3x)}{2x}$, which is still 0/0 at $x = 0$. Apply L'Hopital's rule a second time to get $\\frac{9\\cos(3x)}{2}$. At $x = 0$ this is 9/2. The limit is 9/2."
          - problem: "Consider the limit $\\lim_{x \\to 0} \\frac{e^{2x} - 1 - 2x}{x^2}$. First check that the quotient has the 0/0 form, then evaluate."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The limit is $\\lim_{x \\to 0} \\frac{e^{2x} - 1 - 2x}{x^2}$. At $x = 0$, $e^{2x} - 1 - 2x = 0$ and $x^2 = 0$, so the quotient has the 0/0 form. Apply L'Hopital's rule once to get $\\frac{2e^{2x} - 2}{2x} = \\frac{e^{2x} - 1}{x}$, which is still 0/0 at $x = 0$. Apply L'Hopital's rule a second time to get $\\frac{2e^{2x}}{1}$. At $x = 0$ this is 2. The limit is 2."
        constraints: "verify the 0/0 form before differentiating; at most two applications"
      - id: kp2
        name: ∞/∞ forms
        key_prerequisites: [one-sided-infinite-limits, derivatives-exp-log]
        exemplars:
          - problem: 'Evaluate $\lim_{x \to \infty} \frac{\ln x}{x}$.'
            answer: "0"
            solution_sketch: '$\frac{\infty}{\infty}$ form; $\frac{1/x}{1} \to 0$.'
          - problem: 'Evaluate $\lim_{x \to \infty} \frac{x^2}{e^x}$.'
            answer: "0"
            solution_sketch: 'Apply twice: $\frac{2x}{e^x} \to \frac{2}{e^x} \to 0$.'
          - problem: "Evaluate the limit as x grows without bound of ln(x)/x. State the limit type and the number of applications of L'Hôpital's rule needed."
            answer: "verdict = 0; steps = 1"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["DNE", "does not exist"], ["infinity", "inf", "oo"], ["-infinity", "-inf", "-oo"], ["0"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "steps"}]}
            solution_sketch: "Original limit: lim x→∞ ln(x)/x. The form is ∞/∞, so L'Hôpital's rule applies. Differentiate numerator and denominator: (1/x)/1 = 1/x. As x→∞, 1/x→0, so the limit is 0 and one application suffices. Wrong options: DNE assumes the limit fails when the ratio tends to 0; infinity assumes the logarithm dominates the linear term; -infinity comes from a sign error. The answer is verdict = 0; steps = 1."
          - problem: "Evaluate the limit as x grows without bound of x^2/e^x. State the limit type and the number of applications of L'Hôpital's rule needed."
            answer: "verdict = 0; steps = 2"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["DNE", "does not exist"], ["infinity", "inf", "oo"], ["-infinity", "-inf", "-oo"], ["0"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "steps"}]}
            solution_sketch: "Original limit: lim x→∞ x^2/e^x. The form is ∞/∞, so apply L'Hôpital's rule. First application gives 2x/e^x, still ∞/∞. Second application gives 2/e^x, which tends to 0. So the limit is 0 and two applications are needed. Wrong options: DNE treats the limit as undefined; infinity assumes the polynomial beats the exponential; -infinity is a sign error. The answer is verdict = 0; steps = 2."
          - problem: "Evaluate the limit as x grows without bound of e^x/x^3. State the limit type and the number of applications of L'Hôpital's rule needed."
            answer: "verdict = infinity; steps = 3"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["DNE", "does not exist"], ["infinity", "inf", "oo"], ["-infinity", "-inf", "-oo"], ["0"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "steps"}]}
            solution_sketch: "Original limit: lim x→∞ e^x/x^3. The form is ∞/∞, so apply L'Hôpital's rule. First application gives e^x/(3x^2). Second gives e^x/(6x). Third gives e^x/6, which tends to infinity. So the limit is infinity and three applications are needed. Wrong options: DNE assumes the limit fails; 0 reverses the growth hierarchy; -infinity is a sign error. The answer is verdict = infinity; steps = 3."
          - problem: "Evaluate the limit as x grows without bound of x/ln(x). State the limit type and the number of applications of L'Hôpital's rule needed."
            answer: "verdict = infinity; steps = 1"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["DNE", "does not exist"], ["infinity", "inf", "oo"], ["-infinity", "-inf", "-oo"], ["0"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "steps"}]}
            solution_sketch: "Original limit: lim x→∞ x/ln(x). The form is ∞/∞, so apply L'Hôpital's rule. One application gives 1/(1/x) = x, which tends to infinity. So the limit is infinity and one application suffices. Wrong options: DNE assumes the limit fails; 0 assumes the logarithm dominates; -infinity is a sign error. The answer is verdict = infinity; steps = 1."
        constraints: "growth-hierarchy results (log ≪ polynomial ≪ exponential); limits are 0 or ∞"
      - id: kp3
        name: Check the form first; rewrite 0·∞
        key_prerequisites: [one-sided-infinite-limits, limits-algebraic]
        exemplars:
          - problem: 'Evaluate $\lim_{x \to 0} \frac{x + 1}{x + 2}$ (first check whether L''Hôpital''s rule even applies).'
            answer: "1/2"
            solution_sketch: 'Substitution gives $\frac{1}{2}$ — not an indeterminate form, so L''Hôpital does NOT apply; applying it anyway would wrongly give $1$.'
          - problem: 'Evaluate $\lim_{x \to 0^+} x \ln x$.'
            answer: "0"
            solution_sketch: 'Rewrite the $0 \cdot (-\infty)$ form as $\frac{\ln x}{1/x}$; L''Hôpital gives $\frac{1/x}{-1/x^2} = -x \to 0$.'
          - problem: "Consider the limit of sqrt(x) ln(x) as x approaches 0 from the right. Evaluate."
            answer: "0"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full limit is lim_{x->0+} sqrt(x) ln(x). Rewrite the 0·∞ form as ln(x)/x^(-1/2). L'Hôpital's rule gives (1/x)/(-1/2 x^(-3/2)), which simplifies to -2 sqrt(x). As x approaches 0 from the right, -2 sqrt(x) approaches 0. The value of the limit is 0."
          - problem: "Consider the limit of x cot(3x) as x approaches 0. Evaluate."
            answer: "1/3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full limit is lim_{x->0} x cot(3x). Rewrite cot(3x) as cos(3x)/sin(3x), giving x cos(3x)/sin(3x), a 0/0 form. L'Hôpital's rule gives (cos(3x) - 3x sin(3x))/(3 cos(3x)), which at x = 0 is 1/3. The value of the limit is 1/3."
          - problem: "Consider the limit of sin(2x) cot(x) as x approaches 0. Evaluate."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full limit is lim_{x->0} sin(2x) cot(x). Rewrite cot(x) as cos(x)/sin(x), so the expression is sin(2x) cos(x)/sin(x), a 0/0 form. L'Hôpital's rule gives the quotient of derivatives: the numerator derivative is 2 cos(2x) cos(x) - sin(2x) sin(x) and the denominator derivative is cos(x). At x = 0 the quotient is 2. The value of the limit is 2."
          - problem: "Consider the limit of x e^(-x) as x approaches infinity. Evaluate."
            answer: "0"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full limit is lim_{x->∞} x e^(-x). Rewrite the ∞·0 form as x/e^x, which is ∞/∞. L'Hôpital's rule gives 1/e^x. As x approaches infinity, 1/e^x approaches 0. The value of the limit is 0."
        constraints: "one trap problem (non-indeterminate form) and one 0·∞ rewrite"
    diagnostic_exemplar:
      problem: 'Evaluate $\lim_{x \to 0^+} x^2 \ln x$.'
      answer: "0"
      solution_sketch: 'Rewrite $0 \cdot \infty$ as $\frac{\ln x}{x^{-2}}$; L''Hôpital gives $\frac{1/x}{-2x^{-3}} = -\frac{x^2}{2} \to 0$.'
    anki_seeds:
      - front: "L'Hôpital's rule applies only to which indeterminate forms (directly)?"
        back: "0/0 and ∞/∞ — always verify the form before differentiating"
        type: basic
      - front: "Growth hierarchy as x → ∞: ln x vs x^n vs e^x?"
        back: "ln x ≪ x^n ≪ e^x (each is eventually negligible next to the one after)"
        type: basic

  - id: indeterminate-forms-powers
    name: Indeterminate Differences and Powers
    core: false                # special-case extension of l'Hopital's rule
    difficulty: 0.7
    drill: false
    answer_kind: numeric
    expected_time_secs: 240
    prerequisites:
      - id: lhopitals-rule
        weight: 0.8
        key: true
      - id: derivatives-exp-log
        weight: 0.5
        key: true
      - id: logarithm-properties
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: ∞ - ∞ and 0·∞ rewrites
        key_prerequisites: [lhopitals-rule]
        exemplars:
          - problem: 'Evaluate $\lim_{x \to \infty} \left(\sqrt{x^2 + x} - x\right)$.'
            answer: "1/2"
            solution_sketch: 'Multiply by the conjugate: $\frac{x}{\sqrt{x^2 + x} + x} = \frac{1}{\sqrt{1 + 1/x} + 1} \to \frac{1}{2}$.'
          - problem: 'Evaluate $\lim_{x \to \infty} x\left(e^{1/x} - 1\right)$.'
            answer: "1"
            solution_sketch: 'Rewrite as $\frac{e^{1/x} - 1}{1/x}$; with $t = 1/x \to 0^+$ this is $\frac{e^t - 1}{t} \to 1$.'
          - problem: "Evaluate the limit as x goes to infinity of (sqrt(x^2 + 4x) - x)."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Full limit: lim as x->infinity of (sqrt(x^2 + 4x) - x). Step 1: multiply by the conjugate sqrt(x^2 + 4x) + x over itself, a legal rewrite of the difference. Step 2: the numerator becomes 4x and the denominator is sqrt(x^2 + 4x) + x. Step 3: divide top and bottom by x and let 1/x go to 0; the quotient tends to 4/(1 + 1). The limit is 2."
          - problem: "Evaluate the limit as x goes to infinity of x times (e^(3/x) - 1)."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Full limit: lim as x->infinity of x(e^(3/x) - 1). Step 1: rewrite the product as the quotient (e^(3/x) - 1)/(1/x), turning a product form into a quotient. Step 2: let t = 3/x, so the quotient is 3(e^t - 1)/t and t tends to 0. Step 3: the standard exponential limit gives 3. The limit is 3."
          - problem: "Evaluate the limit as x goes to infinity of (x - sqrt(x^2 - 3x))."
            answer: "3/2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Full limit: lim as x->infinity of (x - sqrt(x^2 - 3x)). Step 1: multiply by the conjugate x + sqrt(x^2 - 3x) over itself. Step 2: the numerator becomes 3x and the denominator is x + sqrt(x^2 - 3x). Step 3: divide top and bottom by x; the quotient tends to 3/(1 + 1). The limit is 3/2."
          - problem: "Evaluate the limit as x goes to 0 from the right of x times ln(x)."
            answer: "0"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Full limit: lim as x->0+ of x ln(x). Step 1: rewrite the product as the quotient ln(x)/(1/x). Step 2: apply L'Hopital's rule to this quotient form; the derivative of ln(x) is 1/x and the derivative of 1/x is -1/x^2. Step 3: the quotient becomes (1/x)/(-1/x^2) = -x, which tends to 0. The limit is 0."
        constraints: "rewrite to a quotient (conjugate or reciprocal) before any L'Hôpital step"
      - id: kp2
        name: 1^∞ forms via logarithms
        key_prerequisites: [lhopitals-rule, logarithm-properties, derivatives-exp-log]
        exemplars:
          - problem: 'Evaluate $\lim_{x \to \infty} \left(1 + \frac{2}{x}\right)^x$.'
            answer: "e^2"
            solution_sketch: '$\ln y = x \ln\left(1 + \frac{2}{x}\right) = \frac{\ln(1 + 2/x)}{1/x}$; L''Hôpital gives $\to 2$, so $y \to e^2$.'
          - problem: 'Evaluate $\lim_{x \to 0} (1 + x)^{1/x}$.'
            answer: "e"
            solution_sketch: '$\ln y = \frac{\ln(1 + x)}{x} \to 1$.'
          - problem: "Evaluate $\\lim_{x \\to \\infty} \\left(1 + \\frac{5}{x}\\right)^{4x}$."
            answer: "e^20"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: Let $y = (1 + 5/x)^{4x}$ and take ln, using the power property to get $\\ln y = 4x \\ln(1 + 5/x)$. Step 2: Write this as $4\\ln(1 + 5/x)/(1/x)$, a 0/0 form, and apply L'Hopital's rule; it gives 20. Step 3: Exponentiate both sides to undo the logarithm. The limit is e^20."
          - problem: "Evaluate $\\lim_{x \\to 0} (1 + 7x)^{1/x}$."
            answer: "e^7"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: Let $y = (1 + 7x)^{1/x}$ and take ln, so $\\ln y = \\ln(1 + 7x)/x$. Step 2: This is a 0/0 form, and L'Hopital's rule gives $7/(1 + 7x)$, which tends to 7. Step 3: Exponentiate both sides to remove the logarithm. The limit is e^7."
          - problem: "Evaluate $\\lim_{x \\to 0} (1 - 4x)^{1/x}$."
            answer: "e^(-4)"
            answer_contract: {"kind": "exact"}
