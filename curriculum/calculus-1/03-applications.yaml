        key_prerequisites: [critical-points-extrema, evaluating-functions]
        exemplars:
          - problem: 'Find the absolute maximum and minimum of $f(x) = x^3 - 3x$ on $[0, 2]$.'
            answer: "absolute max 2 at x = 2; absolute min -2 at x = 1"
            answer_contract: {kind: none}
            solution_sketch: 'Candidates: critical point $x = 1$ (value $-2$) and endpoints $f(0) = 0$, $f(2) = 2$.'
          - problem: 'Find the absolute maximum and minimum of $f(x) = x^2 - 2x$ on $[0, 3]$.'
            answer: "absolute max 3 at x = 3; absolute min -1 at x = 1"
            answer_contract: {kind: none}
            solution_sketch: "absolute max 3 at x = 3; absolute min -1 at x = 1"
