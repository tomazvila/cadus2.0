  - id: basic-optimization
    name: Basic Optimization
    core: true
    difficulty: 0.65
    drill: false
    answer_kind: numeric
    expected_time_secs: 240
    prerequisites:
      - id: closed-interval-method
        weight: 0.6
        key: true
      - id: critical-points-extrema
        weight: 0.7
        key: true
      - id: area-triangles-quadrilaterals
        weight: 0.4
        key: true
    knowledge_points:
      - id: kp1
        name: Optimize over two numbers with a constraint
        key_prerequisites: [critical-points-extrema]
        exemplars:
          - problem: 'Two positive numbers have sum $24$. What is the largest possible value of their product?'
            answer: '144'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Call the numbers $x$ and $24 - x$, so the product is $P(x) = x(24 - x) = 24x - x^2$. Then $P''(x) = 24 - 2x = 0$ gives $x = 12$, and $P''''(x) = -2 < 0$ shows a maximum. The numbers are $12$ and $12$, and the largest product is $144$.'
          - problem: 'Two positive numbers have product $196$. What is the smallest possible value of their sum?'
            answer: '28'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Call the numbers $x$ and $\frac{196}{x}$, so the sum is $S(x) = x + \frac{196}{x}$. Then $S''(x) = 1 - \frac{196}{x^2} = 0$ gives $x = 14$, and $S''''(x) = \frac{392}{x^3} > 0$ shows a minimum. The numbers are $14$ and $14$, and the smallest sum is $28$.'
          - problem: 'Two positive numbers $x$ and $y$ have sum $30$. For which value of $x$ is $x^2 y$ as large as possible?'
            answer: '20'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Since $y = 30 - x$, we maximize $f(x) = x^2(30 - x) = 30x^2 - x^3$ for $0 < x < 30$. Then $f''(x) = 60x - 3x^2 = 3x(20 - x)$ is zero at $x = 20$, and $f''''(20) = -60 < 0$ shows a maximum. So $x = 20$, and $y = 10$.'
          - problem: 'Two positive numbers $x$ and $y$ have product $64$. For which value of $x$ is $x + 4y$ as small as possible?'
            answer: '16'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Since $y = \frac{64}{x}$, we minimize $f(x) = x + \frac{256}{x}$ for $x > 0$. Then $f''(x) = 1 - \frac{256}{x^2} = 0$ gives $x = 16$, and $f''''(16) > 0$ shows a minimum. So $x = 16$, and $y = 4$.'
          - problem: 'A theatre sells $300 - 10p$ tickets for each show when the ticket price is $p$ dollars. What ticket price gives the greatest revenue?'
            answer: '15'
            answer_contract: {"kind":"unit","quantity":"dollar","unit":"dollar","allow_omitted":true}
            solution_sketch: 'The revenue is $R(p) = p(300 - 10p) = 300p - 10p^2$. Then $R''(p) = 300 - 20p = 0$ gives $p = 15$, and $R''''(p) = -20 < 0$ shows a maximum. At a price of $15$ dollars the theatre sells $150$ tickets and earns $2250$ dollars.'
          - problem: 'A store sells $200$ lamps per week at $30$ dollars each. For each $1$ dollar increase in the price, it sells $5$ fewer lamps per week. What price gives the greatest weekly revenue?'
            answer: '35'
            answer_contract: {"kind":"unit","quantity":"dollar","unit":"dollar","allow_omitted":true}
            solution_sketch: 'Let the price be $30 + x$ dollars, so the store sells $200 - 5x$ lamps and the revenue is $R(x) = (30 + x)(200 - 5x)$. Then $R''(x) = 50 - 10x = 0$ gives $x = 5$, and $R''''(x) = -10 < 0$ shows a maximum. The price is $30 + 5 = 35$ dollars.'
          - problem: 'Two positive numbers have sum $12$. What is the smallest possible value of the sum of their squares?'
            answer: '72'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Call the numbers $x$ and $12 - x$, so we minimize $f(x) = x^2 + (12 - x)^2 = 2x^2 - 24x + 144$. Then $f''(x) = 4x - 24 = 0$ gives $x = 6$, and $f''''(x) = 4 > 0$ shows a minimum. The smallest value is $36 + 36 = 72$.'
          - problem: 'Sam picks $10$ and $20$ as two positive numbers with sum $30$ and says that their product $200$ is the largest possible. What is the largest possible product?'
            answer: '225'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Sam only tried one pair. With the numbers $x$ and $30 - x$ the product is $P(x) = 30x - x^2$, and $P''(x) = 30 - 2x = 0$ gives $x = 15$. Then $P(15) = 15 \cdot 15 = 225$, which is larger than $200$.'
      - id: kp2
        name: Fencing and area problems
        key_prerequisites: [critical-points-extrema, area-triangles-quadrilaterals]
        exemplars:
          - problem: 'A farmer has $200$ m of fence to enclose a rectangular field. What is the largest area that the fence can enclose?'
            answer: '2500'
            answer_contract: {"kind":"unit","quantity":"area","unit":"m^2","allow_omitted":true}
            solution_sketch: 'Let the sides be $x$ and $y$ metres, so $2x + 2y = 200$ and $y = 100 - x$. The area is $A(x) = x(100 - x)$, and $A''(x) = 100 - 2x = 0$ gives $x = 50$. Since $A''''(x) = -2 < 0$ this is a maximum, with $y = 50$, and the largest area is $50 \cdot 50 = 2500$ square metres.'
          - problem: 'A rectangular pen uses a barn as one side and $80$ m of fence for the other three sides. What length of the side parallel to the barn gives the greatest area?'
            answer: '40'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'Let each side that meets the barn be $x$ metres. The side parallel to the barn is $80 - 2x$, so the area is $A(x) = x(80 - 2x)$. Then $A''(x) = 80 - 4x = 0$ gives $x = 20$, and the parallel side is $80 - 40 = 40$ metres.'
          - problem: 'A rectangular pen uses a wall as one side and $100$ m of fence for the other three sides. What is the largest area the pen can have?'
            answer: '1250'
            answer_contract: {"kind":"unit","quantity":"area","unit":"m^2","allow_omitted":true}
            solution_sketch: 'Let each side that meets the wall be $x$ metres, so the side parallel to the wall is $100 - 2x$. The area is $A(x) = x(100 - 2x)$, and $A''(x) = 100 - 4x = 0$ gives $x = 25$. Then the parallel side is $50$, and the largest area is $25 \cdot 50 = 1250$ square metres.'
          - problem: 'A rectangular field is divided into two equal parts by a fence parallel to one of its sides. The fence along the boundary and the divider has a total length of $600$ m. What is the largest total area of the field?'
            answer: '15000'
            answer_contract: {"kind":"unit","quantity":"area","unit":"m^2","allow_omitted":true}
            solution_sketch: 'Let the divider and the two sides parallel to it have length $a$, and the other two sides $b$, so $3a + 2b = 600$ and $b = 300 - \frac{3a}{2}$. The area is $A(a) = a\left(300 - \frac{3a}{2}\right)$, and $A''(a) = 300 - 3a = 0$ gives $a = 100$. Then $b = 150$, and the largest area is $100 \cdot 150 = 15000$ square metres.'
          - problem: 'A rectangular garden is divided into two equal plots by a fence parallel to one of its sides. The fence along the boundary and the divider has a total length of $240$ m. Find the length of each side of the garden that is perpendicular to the divider, so that the total area is as large as possible.'
            answer: '60'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'Let the divider and the two sides parallel to it have length $a$, and the other two sides $b$, so $3a + 2b = 240$ and $b = 120 - \frac{3a}{2}$. The area is $A(a) = a\left(120 - \frac{3a}{2}\right)$, and $A''(a) = 120 - 3a = 0$ gives $a = 40$. Then $b = 120 - 60 = 60$ metres.'
          - problem: 'A farmer wants to enclose a rectangular pen of area $800$ square metres against a barn wall. No fence is needed along the wall. What is the least length of fence that the farmer needs?'
            answer: '80'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'Let each side that meets the wall be $x$ metres, so the side parallel to the wall is $\frac{800}{x}$. The fence length is $L(x) = 2x + \frac{800}{x}$, and $L''(x) = 2 - \frac{800}{x^2} = 0$ gives $x = 20$. Since $L''''(20) > 0$ this is a minimum, and $L(20) = 40 + 40 = 80$ metres.'
          - problem: 'A school plans a rectangular playground of area $900$ square metres, with a fence all the way around it. What is the least length of fence the school needs?'
            answer: '120'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'Let the sides be $x$ and $\frac{900}{x}$ metres, so the fence length is $L(x) = 2x + \frac{1800}{x}$. Then $L''(x) = 2 - \frac{1800}{x^2} = 0$ gives $x = 30$, and $L''''(30) > 0$ shows a minimum. The playground is a $30$ m by $30$ m square, and the least fence is $120$ metres.'
          - problem: 'Sam has $80$ m of fence for a rectangular pen against a wall, but he counts all four sides, and says that the largest area is $400$ square metres. What is the largest area of the pen?'
            answer: '800'
            answer_contract: {"kind":"unit","quantity":"area","unit":"m^2","allow_omitted":true}
            solution_sketch: 'The wall replaces one side, so the fence covers only three sides. With each side that meets the wall of length $x$, the area is $A(x) = x(80 - 2x)$, and $A''(x) = 80 - 4x = 0$ gives $x = 20$. The area is $20 \cdot 40 = 800$ square metres.'
      - id: kp3
        name: Confirm the optimum
        key_prerequisites: [closed-interval-method, critical-points-extrema]
        try_first:
          problem: 'The function $g(x) = x^2 - 4x$ has the critical point $x = 2$. Is the largest value of $g$ on the interval $[0, 4]$ reached at $x = 2$?'
          answer_contract: {"kind":"label","options":[["yes","it does","it is","yes it does","yes, it does","yes it is","yes, it is","it has"],["no","it does not","it is not","no it does not","no, it does not","no it is not","no, it is not","it doesn't"]]}
          answer: 'no'
          reveal: 'We have $g(2) = -4$, which is the smallest value, while $g(0) = g(4) = 0$ is larger. A critical point can be a minimum, so we compare it with the endpoint values.'
        exemplars:
          - problem: 'Find the absolute maximum value of $P(x) = x(24 - x)$ on the interval $[0, 24]$.'
            answer: '144'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Since $P''(x) = 24 - 2x$, the only critical point is $x = 12$. We compare $P(0) = 0$, $P(12) = 144$ and $P(24) = 0$. The largest of these is $144$, so the absolute maximum value is $144$.'
          - problem: 'Find the absolute minimum value of $S(x) = x + \frac{64}{x}$ for $x > 0$.'
            answer: '16'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Since $S''(x) = 1 - \frac{64}{x^2}$, the only critical point with $x > 0$ is $x = 8$. The second derivative $S''''(x) = \frac{128}{x^3}$ is positive for all $x > 0$, so the graph is concave up and $x = 8$ gives the absolute minimum. Its value is $S(8) = 8 + 8 = 16$.'
          - problem: 'Find the absolute minimum value of $f(x) = x^3 - 3x$ on the interval $[0, 2]$.'
            answer: '-2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Since $f''(x) = 3x^2 - 3$, the only critical point in $[0, 2]$ is $x = 1$. We compare $f(0) = 0$, $f(1) = -2$ and $f(2) = 2$. The smallest of these is $-2$, so the absolute minimum value is $-2$.'
          - problem: 'Find the absolute maximum value of $g(x) = x^4 - 8x^2 + 10$ on the interval $[-3, 3]$.'
            answer: '19'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Since $g''(x) = 4x^3 - 16x = 4x(x - 2)(x + 2)$, the critical points are $x = -2$, $x = 0$ and $x = 2$. We compare $g(\pm 3) = 19$, $g(0) = 10$ and $g(\pm 2) = -6$. The largest value is $19$, and it occurs at the endpoints.'
          - problem: 'Which does $h(x) = 2x + \frac{18}{x}$ have on the interval $x > 0$, an absolute maximum or an absolute minimum?'
            answer: 'absolute minimum'
            answer_contract: {"kind":"label","options":[["absolute minimum","minimum","min","an absolute minimum","absolute min","a minimum"],["absolute maximum","maximum","max","an absolute maximum","absolute max","a maximum"]]}
            solution_sketch: 'Since $h''(x) = 2 - \frac{18}{x^2}$, the only critical point with $x > 0$ is $x = 3$. The second derivative $h''''(x) = \frac{36}{x^3}$ is positive for $x > 0$, so the graph is concave up and $x = 3$ gives an absolute minimum, $h(3) = 12$. The values of $h$ grow without bound for large $x$, so there is no absolute maximum.'
          - problem: 'Find the absolute minimum value of $F(x) = x^3 - 12x$ on the interval $[-3, 3]$.'
            answer: '-16'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Since $F''(x) = 3x^2 - 12$, the critical points are $x = -2$ and $x = 2$. We compare $F(-3) = 9$, $F(-2) = 16$, $F(2) = -16$ and $F(3) = -9$. The smallest of these is $-16$, so the absolute minimum value is $-16$.'
          - problem: 'A ball is thrown upward from the ground, and its height after $t$ seconds is $h(t) = -5t^2 + 20t + 1$ metres, for $0 \le t \le 3$. What is the greatest height of the ball?'
            answer: '21'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'Since $h''(t) = -10t + 20$, the only critical point is $t = 2$. We compare $h(0) = 1$, $h(2) = 21$ and $h(3) = 16$. The largest is $21$, so the greatest height is $21$ metres.'
          - problem: 'The cost of running a machine at speed $x$ is $C(x) = 3x + \frac{1200}{x}$ dollars per hour, for $x > 0$. What is the lowest possible cost per hour?'
            answer: '120'
            answer_contract: {"kind":"unit","quantity":"dollar","unit":"dollar","allow_omitted":true}
            solution_sketch: 'Since $C''(x) = 3 - \frac{1200}{x^2}$, the only critical point with $x > 0$ is $x = 20$. The second derivative $C''''(x) = \frac{2400}{x^3}$ is positive for $x > 0$, so $x = 20$ gives the absolute minimum. The lowest cost is $C(20) = 60 + 60 = 120$ dollars per hour.'
          - problem: 'Sam finds that the only critical point of $f(x) = x^3 - 3x$ on $[0, 3]$ is $x = 1$, and says that the absolute maximum is $f(1) = -2$. What is the absolute maximum value of $f$ on $[0, 3]$?'
            answer: '18'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'A critical point is only a candidate, so we also compare the endpoint values. We have $f(0) = 0$, $f(1) = -2$ and $f(3) = 27 - 9 = 18$. The largest is $18$, at the endpoint $x = 3$, while $f(1) = -2$ is the absolute minimum.'
    diagnostic_exemplar:
      problem: 'A rectangular pen uses a wall as one side, with $60$ m of fence for the other three sides. What dimensions maximize the area, and what is that area?'
      answer: "15 m (each side perpendicular to the wall) × 30 m (parallel side); area 450 m²"
      answer_contract: {kind: none}
      solution_sketch: '$2x + y = 60$; $A = x(60 - 2x)$; $A'' = 60 - 4x = 0$ at $x = 15$, $y = 30$.'
    anki_seeds:
      - front: "Optimization procedure in four steps:"
        back: "name the variables and constraint; write the objective in one variable; find critical points; check them (and endpoints) for the true optimum"
        type: basic
      - front: "A rectangle of fixed perimeter has maximum area when it is..."
        back: "a square"
        type: basic

  - id: optimization
    name: Optimization
    core: false                # applied word-problem genre; basic-optimization stays core
    difficulty: 0.7
    drill: false
    answer_kind: numeric
    expected_time_secs: 300
    prerequisites:
      - id: basic-optimization
        weight: 0.8
        key: true
      - id: volume-prisms-cylinders
        weight: 0.4
        key: true
      - id: second-derivative-test
        weight: 0.4
      - id: distance-midpoint-formulas
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: Volume and surface-area problems
        key_prerequisites: [basic-optimization, volume-prisms-cylinders]
        exemplars:
          - problem: 'An open-top box is made from a $24$ cm by $24$ cm sheet by cutting equal squares from the corners and folding up the sides. What side length of the squares gives the greatest volume?'
            answer: '4'
            answer_contract: {"kind":"unit","quantity":"length","unit":"cm","allow_omitted":true}
            solution_sketch: 'If the squares have side $x$ cm, the box has base side $24 - 2x$ and height $x$, so $V(x) = x(24 - 2x)^2$ for $0 < x < 12$. Differentiating gives $V''(x) = (24 - 2x)^2 - 4x(24 - 2x) = (24 - 2x)(24 - 6x)$. The zeros are $x = 12$, which gives a box of volume $0$, and $x = 4$. Since $0 < x < 12$, the only choice is $x = 4$ cm, and then $V(4) = 4 \cdot 16^2 = 1024$ cubic centimetres.'
          - problem: 'An open-top box has a square base of side $x$ metres and a volume of $108$ cubic metres. Its height is $h = \frac{108}{x^2}$, so its surface area is $S = x^2 + 4xh = x^2 + \frac{432}{x}$. What is the least surface area the box can have?'
            answer: '108'
            answer_contract: {"kind":"unit","quantity":"area","unit":"m^2","allow_omitted":true}
            solution_sketch: 'The derivative is $S''(x) = 2x - \frac{432}{x^2}$, which is zero when $x^3 = 216$, so $x = 6$. The second derivative $S''''(x) = 2 + \frac{864}{x^3}$ is positive, so this is a minimum. Then $S(6) = 36 + 72 = 108$ square metres.'
          - problem: 'A closed cylindrical can has volume $54\pi$ cm$^3$. What radius gives the least surface area?'
            answer: '3'
            answer_contract: {"kind":"unit","quantity":"length","unit":"cm","allow_omitted":true}
            solution_sketch: 'For radius $r$ and height $h$, the volume $\pi r^2 h = 54\pi$ gives $h = \frac{54}{r^2}$, and the surface area is $S = 2\pi r^2 + 2\pi r h$, so $S(r) = 2\pi r^2 + \frac{108\pi}{r}$. Then $S''(r) = 4\pi r - \frac{108\pi}{r^2} = 0$ gives $r^3 = 27$, so $r = 3$. Since $S''''(r) > 0$ this is a minimum, and the height is $h = 6$ cm.'
          - problem: 'An open-top box has a square base of side $x$ metres and a surface area of $48$ square metres. Its height is $h = \frac{48 - x^2}{4x}$, so its volume is $V = x^2 h = \frac{48x - x^3}{4}$. What is the greatest volume the box can have?'
            answer: '32'
            answer_contract: {"kind":"unit","quantity":"cubic_volume","unit":"m^3","allow_omitted":true}
            solution_sketch: 'The derivative is $V''(x) = \frac{48 - 3x^2}{4}$, which is zero when $x^2 = 16$, so $x = 4$. The second derivative $V''''(x) = -\frac{3x}{2}$ is negative, so this is a maximum. Then $V(4) = \frac{192 - 64}{4} = 32$ cubic metres.'
          - problem: 'A closed cylindrical can has surface area $54\pi$ cm$^2$. Its radius is $r$ and its height is $h$, with surface area $S = 2\pi r^2 + 2\pi r h$ and volume $V = \pi r^2 h$. What height gives the greatest volume?'
            answer: '6'
            answer_contract: {"kind":"unit","quantity":"length","unit":"cm","allow_omitted":true}
            solution_sketch: 'The surface area gives $h = \frac{27 - r^2}{r}$, so $V(r) = \pi r(27 - r^2) = \pi(27r - r^3)$. Then $V''(r) = \pi(27 - 3r^2) = 0$ gives $r = 3$, and $V''''(3) < 0$ shows a maximum. The height is $h = \frac{27 - 9}{3} = 6$ cm.'
          - problem: 'An open-top box has a square base of side $x$ metres and a volume of $256$ cubic metres. Its height is $h = \frac{256}{x^2}$, so its surface area is $S = x^2 + 4xh = x^2 + \frac{1024}{x}$. What base side $x$ gives the least surface area?'
            answer: '8'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'The derivative is $S''(x) = 2x - \frac{1024}{x^2}$, which is zero when $x^3 = 512$, so $x = 8$. The second derivative $S''''(x) = 2 + \frac{2048}{x^3}$ is positive, so this is a minimum. The base side is $8$ metres.'
          - problem: 'An open-top box has a square base of side $x$ metres and a volume of $500$ cubic metres. Its height is $h = \frac{500}{x^2}$, so its surface area is $S = x^2 + 4xh = x^2 + \frac{2000}{x}$. What is the height of the box with the least surface area?'
            answer: '5'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'The derivative is $S''(x) = 2x - \frac{2000}{x^2}$, which is zero when $x^3 = 1000$, so $x = 10$. The second derivative is positive, so this is a minimum. The height is $h = \frac{500}{10^2} = 5$ metres.'
          - problem: 'Sam cuts squares of side $3$ cm from the corners of a $12$ cm by $12$ cm sheet and folds up the sides to make an open-top box. He says that this box has the greatest possible volume. The volume is $V = x(12 - 2x)^2$ for squares of side $x$ cm. What is the greatest volume of such a box?'
            answer: '128'
            answer_contract: {"kind":"unit","quantity":"cubic_volume","unit":"cm^3","allow_omitted":true}
            solution_sketch: 'Differentiating gives $V''(x) = (12 - 2x)(12 - 6x)$, which is zero at $x = 6$ and at $x = 2$. The value $x = 6$ gives volume $0$, so the greatest volume is at $x = 2$, where $V(2) = 2 \cdot 8^2 = 128$ cubic centimetres. Sam''s box has volume $3 \cdot 6^2 = 108$, which is smaller.'
      - id: kp2
        name: Cost and material problems
        key_prerequisites: [basic-optimization, volume-prisms-cylinders]
        exemplars:
          - problem: 'A rectangular field of area $1800$ square metres borders a straight river, so only the three sides away from the river need a fence. What is the least length of fence that is needed?'
            answer: '120'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'Let each side that meets the river be $x$ metres, so the side along the river is $\frac{1800}{x}$. The fence length is $L(x) = 2x + \frac{1800}{x}$, and $L''(x) = 2 - \frac{1800}{x^2} = 0$ gives $x = 30$. Then $L(30) = 60 + 60 = 120$ metres, and $L''''(30) > 0$ shows a minimum.'
          - problem: 'A closed cylindrical can must hold $128\pi$ cubic centimetres. Its radius is $r$ and its height is $h$, with volume $V = \pi r^2 h$ and surface area $S = 2\pi r^2 + 2\pi r h$. What radius uses the least metal?'
            answer: '4'
            answer_contract: {"kind":"unit","quantity":"length","unit":"cm","allow_omitted":true}
            solution_sketch: 'The volume gives $h = \frac{128}{r^2}$, so $S(r) = 2\pi r^2 + \frac{256\pi}{r}$. Then $S''(r) = 4\pi r - \frac{256\pi}{r^2} = 0$ gives $r^3 = 64$, so $r = 4$. Since $S''''(r) > 0$ this is a minimum, and the radius is $4$ cm.'
          - problem: 'A container with a square base and no top must hold $4000$ cubic centimetres. What base side length uses the least material for the base and the four sides?'
            answer: '20'
            answer_contract: {"kind":"unit","quantity":"length","unit":"cm","allow_omitted":true}
            solution_sketch: 'Let the base side be $x$ cm and the height $h$ cm, so $x^2 h = 4000$ and $h = \frac{4000}{x^2}$. The material area is $S = x^2 + 4xh = x^2 + \frac{16000}{x}$, and $S''(x) = 2x - \frac{16000}{x^2} = 0$ gives $x^3 = 8000$, so $x = 20$. Since $S''''(x) > 0$, the base side is $20$ cm.'
          - problem: 'A rectangular garden of area $216$ square metres is enclosed by a fence. The side facing the street costs $12$ dollars per metre, and each of the other three sides costs $6$ dollars per metre. What is the least total cost of the fence?'
            answer: '432'
            answer_contract: {"kind":"unit","quantity":"dollar","unit":"dollar","allow_omitted":true}
            solution_sketch: 'Let the side facing the street be $x$ metres, so the sides that meet it are $\frac{216}{x}$ metres each. The cost is $12x + 6x + 2 \cdot 6 \cdot \frac{216}{x} = 18x + \frac{2592}{x}$ dollars. Then $C''(x) = 18 - \frac{2592}{x^2} = 0$ gives $x = 12$, and $C(12) = 216 + 216 = 432$ dollars.'
          - problem: 'A closed rectangular box with a square base must hold $288$ cubic centimetres. The material for the base and the top costs $4$ dollars per square centimetre, and the material for each of the four sides costs $3$ dollars per square centimetre. What is the least total cost of the material?'
            answer: '864'
            answer_contract: {"kind":"unit","quantity":"dollar","unit":"dollar","allow_omitted":true}
            solution_sketch: 'Let the base side be $x$ cm, so the height is $\frac{288}{x^2}$ cm. The cost is $4 \cdot 2x^2 + 3 \cdot 4x \cdot \frac{288}{x^2} = 8x^2 + \frac{3456}{x}$ dollars. Then $C''(x) = 16x - \frac{3456}{x^2} = 0$ gives $x = 6$, and $C(6) = 288 + 576 = 864$ dollars.'
          - problem: 'A closed rectangular box with a square base has a volume of $125$ cubic centimetres. What is the least surface area the box can have?'
            answer: '150'
            answer_contract: {"kind":"unit","quantity":"area","unit":"cm^2","allow_omitted":true}
            solution_sketch: 'Let the base side be $x$ cm, so the height is $\frac{125}{x^2}$ cm. The surface area is $S(x) = 2x^2 + 4x \cdot \frac{125}{x^2} = 2x^2 + \frac{500}{x}$, and $S''(x) = 4x - \frac{500}{x^2} = 0$ gives $x = 5$. Then $S(5) = 50 + 100 = 150$ square centimetres, and the box is a cube.'
          - problem: 'A rectangular field of area $1250$ square metres borders a straight river, and only the three sides away from the river are fenced. What length of the side along the river uses the least fence?'
            answer: '50'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'Let each side that meets the river be $x$ metres, so the side along the river is $\frac{1250}{x}$. The fence length is $L(x) = 2x + \frac{1250}{x}$, and $L''(x) = 2 - \frac{1250}{x^2} = 0$ gives $x = 25$. The side along the river is $\frac{1250}{25} = 50$ metres.'
          - problem: 'Sam says that the cheapest garden of area $150$ square metres is a square. The side facing the street costs $12$ dollars per metre, and each of the other three sides costs $6$ dollars per metre. What is the least total cost of the fence?'
            answer: '360'
            answer_contract: {"kind":"unit","quantity":"dollar","unit":"dollar","allow_omitted":true}
            solution_sketch: 'Let the side facing the street be $x$ metres, so the sides that meet it are $\frac{150}{x}$ metres each. The cost is $12x + 6x + 12 \cdot \frac{150}{x} = 18x + \frac{1800}{x}$ dollars. Then $C''(x) = 18 - \frac{1800}{x^2} = 0$ gives $x = 10$, and $C(10) = 180 + 180 = 360$ dollars. The square would cost about $367$ dollars, so it is not the cheapest.'
      - id: kp3
        name: Distance problems
        key_prerequisites: [basic-optimization, distance-midpoint-formulas]
        exemplars:
          - problem: 'Find the point on the line $y = 2x + 1$ that is closest to the origin.'
            answer: '(-2/5, 1/5)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'A point of the line is $(x, 2x + 1)$, and its squared distance to the origin is $d^2 = x^2 + (2x + 1)^2 = 5x^2 + 4x + 1$. Then $\frac{d}{dx}d^2 = 10x + 4 = 0$ gives $x = -\frac{2}{5}$, and $y = 2x + 1 = \frac{1}{5}$. The second derivative is $10 > 0$, so the point is $\left(-\frac{2}{5}, \frac{1}{5}\right)$.'
          - problem: 'Find the point on the curve $y = \sqrt{x}$ that is closest to the point $(3, 0)$.'
            answer: '(5/2, sqrt(10)/2)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'A point of the curve is $(x, \sqrt{x})$, and its squared distance to $(3, 0)$ is $d^2 = (x - 3)^2 + x = x^2 - 5x + 9$. Then $\frac{d}{dx}d^2 = 2x - 5 = 0$ gives $x = \frac{5}{2}$, and $y = \sqrt{\frac{5}{2}} = \frac{\sqrt{10}}{2}$. The second derivative is $2 > 0$, so this is the closest point.'
          - problem: 'Find the shortest distance from the point $(3, 0)$ to the curve $y = \sqrt{x}$.'
            answer: 'sqrt(11)/2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The squared distance from $(3, 0)$ to the point $(x, \sqrt{x})$ is $d^2 = x^2 - 5x + 9$, which is smallest at $x = \frac{5}{2}$. Then $d^2 = \frac{25}{4} - \frac{25}{2} + 9 = \frac{11}{4}$, so the shortest distance is $d = \frac{\sqrt{11}}{2}$.'
          - problem: 'Find the shortest distance from the point $(0, 2)$ to the parabola $y = x^2$.'
            answer: 'sqrt(7)/2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The squared distance from $(0, 2)$ to the point $(x, x^2)$ is $d^2 = x^2 + (x^2 - 2)^2 = x^4 - 3x^2 + 4$. Then $\frac{d}{dx}d^2 = 4x^3 - 6x = 0$ gives $x^2 = \frac{3}{2}$, and $d^2 = \frac{9}{4} - \frac{9}{2} + 4 = \frac{7}{4}$. The shortest distance is $\frac{\sqrt{7}}{2}$.'
          - problem: 'Find the shortest distance from the point $(1, 1)$ to the line $y = 3x + 2$.'
            answer: '2sqrt(10)/5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'A point of the line is $(x, 3x + 2)$, and its squared distance to $(1, 1)$ is $d^2 = (x - 1)^2 + (3x + 1)^2 = 10x^2 + 4x + 2$. Then $20x + 4 = 0$ gives $x = -\frac{1}{5}$, and $d^2 = \frac{2}{5} - \frac{4}{5} + 2 = \frac{8}{5}$. The shortest distance is $\sqrt{\frac{8}{5}} = \frac{2\sqrt{10}}{5}$.'
          - problem: 'Find the point on the line $y = -x + 4$ that is closest to the origin.'
            answer: '(2, 2)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'A point of the line is $(x, 4 - x)$, and its squared distance to the origin is $d^2 = x^2 + (4 - x)^2 = 2x^2 - 8x + 16$. Then $4x - 8 = 0$ gives $x = 2$, and $y = 4 - 2 = 2$. The second derivative is $4 > 0$, so the closest point is $(2, 2)$.'
          - problem: 'A highway follows the line $y = 2x - 3$ on a map where the units are kilometres. A village is at the point $(4, 1)$. What is the length of the shortest road from the village to the highway?'
            answer: '4sqrt(5)/5'
            answer_contract: {"kind":"unit","quantity":"length","unit":"km","allow_omitted":true}
            solution_sketch: 'A point of the highway is $(x, 2x - 3)$, and its squared distance to the village is $d^2 = (x - 4)^2 + (2x - 4)^2 = 5x^2 - 24x + 32$. Then $10x - 24 = 0$ gives $x = \frac{12}{5}$, and $d^2 = \frac{16}{5}$. The shortest road has length $\sqrt{\frac{16}{5}} = \frac{4\sqrt{5}}{5}$ kilometres.'
          - problem: 'A boat sails along the curve $y = \sqrt{x}$ on a map where the units are kilometres. A lighthouse stands at the point $(5, 0)$. How close does the boat come to the lighthouse?'
            answer: 'sqrt(19)/2'
            answer_contract: {"kind":"unit","quantity":"length","unit":"km","allow_omitted":true}
            solution_sketch: 'A point of the curve is $(x, \sqrt{x})$, and its squared distance to the lighthouse is $d^2 = (x - 5)^2 + x = x^2 - 9x + 25$. Then $2x - 9 = 0$ gives $x = \frac{9}{2}$, and $d^2 = \frac{81}{4} - \frac{81}{2} + 25 = \frac{19}{4}$. The boat comes within $\frac{\sqrt{19}}{2}$ kilometres.'
          - problem: 'Sam says that the point of the line $y = -2x + 5$ closest to the origin is its $x$-intercept $\left(\frac{5}{2}, 0\right)$. What is the closest point?'
            answer: '(2, 1)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'The point $\left(\frac{5}{2}, 0\right)$ is at distance $\frac{5}{2}$, but we can do better. A point of the line is $(x, 5 - 2x)$, with $d^2 = x^2 + (5 - 2x)^2 = 5x^2 - 20x + 25$. Then $10x - 20 = 0$ gives $x = 2$, and $y = 1$, with $d^2 = 5 < \frac{25}{4}$.'
    diagnostic_exemplar:
      problem: 'Find the point on the curve $y = \sqrt{x}$ closest to $(4, 0)$.'
      answer: '(7/2, √14/2)'
      solution_sketch: 'Minimize the squared distance $d^2 = (x-4)^2 + x = x^2 - 7x + 16$: $2x - 7 = 0$ gives $x = \frac{7}{2}$, and $y = \sqrt{7/2} = \frac{\sqrt{14}}{2}$.'
    anki_seeds:
      - front: "In distance-minimization problems, minimize ___ instead of the distance itself."
        back: "the squared distance d² — same minimizer, no square roots to differentiate"
        type: basic
      - front: "Constrained optimization: the constraint's job is to..."
        back: "eliminate one variable so the objective becomes a one-variable function"
        type: basic

  - id: marginal-analysis
    name: Marginal Cost and Revenue
    core: false                # named economics application of the derivative
    difficulty: 0.55
    drill: false
    answer_kind: numeric
    expected_time_secs: 150
    prerequisites:
      - id: derivative-power-rule
        weight: 0.7
        key: true
      - id: average-instantaneous-rate
        weight: 0.5
        key: true
      - id: evaluating-polynomials
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: 'Marginal cost and revenue as derivatives'
        key_prerequisites: [derivative-power-rule]
        exemplars:
          - problem: 'The cost of producing $x$ items is $C(x) = \frac{x^2}{10} + 40x + 1000$ dollars. Find the marginal cost at $x = 50$, in dollars per item.'
            answer: '50'
            answer_contract: {"kind":"unit","quantity":"dollar","unit":"dollar","allow_omitted":true}
            solution_sketch: 'The marginal cost is the derivative $C''(x) = \frac{x}{5} + 40$. At $x = 50$ this is $10 + 40 = 50$, so the marginal cost is $50$ dollars per item.'
          - problem: 'The revenue from selling $x$ items is $R(x) = 500x - \frac{x^2}{2}$ dollars. Find the marginal revenue at $x = 200$, in dollars per item.'
            answer: '300'
            answer_contract: {"kind":"unit","quantity":"dollar","unit":"dollar","allow_omitted":true}
            solution_sketch: 'The marginal revenue is the derivative $R''(x) = 500 - x$. At $x = 200$ this is $500 - 200 = 300$, so the marginal revenue is $300$ dollars per item.'
          - problem: 'The cost of making $x$ helmets is $C(x) = 3x^2 + 20x + 500$ dollars. Find the marginal cost function $C''(x)$.'
            answer: '6x + 20'
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'Differentiate term by term: the derivative of $3x^2$ is $6x$, of $20x$ is $20$, and of the constant $500$ is $0$. So $C''(x) = 6x + 20$.'
          - problem: 'A shop sells $x$ scarves a week at the price $p = 60 - 0.2x$ dollars each, so the revenue is $R(x) = xp$. Find the marginal revenue at $x = 100$, in dollars per scarf.'
            answer: '20'
            answer_contract: {"kind":"unit","quantity":"dollar","unit":"dollar","allow_omitted":true}
            solution_sketch: 'The revenue is $R(x) = x(60 - 0.2x) = 60x - 0.2x^2$, so $R''(x) = 60 - 0.4x$. At $x = 100$ this is $60 - 40 = 20$ dollars per scarf.'
          - problem: 'The cost of producing $x$ chairs is $C(x) = \frac{x^2}{10} + 40x + 1000$ dollars. What is the average cost per chair when $50$ chairs are produced?'
            answer: '65'
            answer_contract: {"kind":"unit","quantity":"dollar","unit":"dollar","allow_omitted":true}
            solution_sketch: 'The average cost is the total cost divided by the number of chairs. The total cost is $C(50) = 250 + 2000 + 1000 = 3250$ dollars, and $3250 \div 50 = 65$ dollars per chair.'
          - problem: 'The revenue from selling $x$ items is $R(x) = 80x - \frac{x^2}{4}$ dollars. At what production level $x$ is the marginal revenue $50$ dollars per item?'
            answer: '60'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The marginal revenue is $R''(x) = 80 - \frac{x}{2}$. Set $80 - \frac{x}{2} = 50$, so $\frac{x}{2} = 30$ and $x = 60$ items.'
          - problem: 'The revenue from selling $x$ items is $R(x) = 600x - 2x^2$ dollars. At $x = 200$, does selling one more item raise or lower the revenue?'
            answer: 'lower'
            answer_contract: {"kind":"label","options":[["lower","it lowers","lowers","lower the revenue","it lowers the revenue","decrease","decreases","it decreases"],["raise","it raises","raises","raise the revenue","it raises the revenue","increase","increases","it increases"]]}
            solution_sketch: 'The marginal revenue is $R''(x) = 600 - 4x$, which at $x = 200$ is $600 - 800 = -200$. A negative marginal revenue means that one more item lowers the revenue.'
          - problem: 'Sam says the marginal cost at $x = 20$ for $C(x) = \frac{x^2}{4} + 20x + 400$ dollars is $C(20)/20 = 45$ dollars per item. What is the marginal cost at $x = 20$?'
            answer: '30'
            answer_contract: {"kind":"unit","quantity":"dollar","unit":"dollar","allow_omitted":true}
            solution_sketch: 'Sam found the average cost, $C(20)/20 = 900/20 = 45$, not the marginal cost. The marginal cost is the derivative $C''(x) = \frac{x}{2} + 20$, and $C''(20) = 10 + 20 = 30$ dollars per item.'
        constraints: 'quadratic cost and revenue; marginal value at a point, marginal function, average cost, direction of change; units in the question'
      - id: kp2
        name: 'Marginal value vs actual change'
        key_prerequisites: [derivative-power-rule, average-instantaneous-rate]
        try_first:
          problem: 'Let $C(x) = x^2 + 10x$. What is $C(11) - C(10)$?'
          answer_contract: {"kind":"exact"}
          answer: '31'
          reveal: 'The slope of $C$ at $x = 10$ is $C''(10) = 30$, while the true step from $10$ to $11$ items is $31$. The two numbers are close but not equal, and this lesson explains why.'
        exemplars:
          - problem: 'The cost of producing $x$ items is $C(x) = \frac{x^2}{20} + 15x + 400$ dollars. Find the actual cost of the 41st item, $C(41) - C(40)$.'
            answer: '19.05'
            answer_contract: {"kind":"unit","quantity":"dollar","unit":"dollar","allow_omitted":true}
            solution_sketch: 'Subtract the two costs: $C(41) - C(40) = \frac{1681 - 1600}{20} + 15 = 4.05 + 15 = 19.05$. The 41st item costs $19.05$ dollars, a little more than the marginal cost $C''(40) = 19$.'
          - problem: 'The cost of making $x$ items is $C(x) = \frac{x^2}{2} + 5x + 100$ dollars. Is the actual cost of the 11th item, $C(11) - C(10)$, larger or smaller than the marginal cost $C''(10)$, and by how much?'
            answer: 'verdict = larger; amount = 1/2'
            answer_contract: {"kind":"multipart","parts":[{"contract":{"kind":"label","options":[["larger","it is larger","bigger","more"],["smaller","it is smaller","less"]]},"name":"verdict"},{"contract":{"kind":"exact"},"name":"amount"}]}
            solution_sketch: 'The marginal cost is $C''(x) = x + 5$, so $C''(10) = 15$. The actual cost is $C(11) - C(10) = \frac{121 - 100}{2} + 5 = \frac{31}{2}$, which is larger by $\frac{31}{2} - 15 = \frac{1}{2}$ dollar.'
          - problem: 'The revenue from selling $x$ units is $R(x) = 150x - \frac{x^2}{5}$ dollars. Use the marginal revenue $R''(30)$ to estimate the extra revenue from selling the 31st unit.'
            answer: '138'
            answer_contract: {"kind":"unit","quantity":"dollar","unit":"dollar","allow_omitted":true}
            solution_sketch: 'The marginal revenue is $R''(x) = 150 - \frac{2x}{5}$. At $x = 30$ this is $150 - 12 = 138$, so the estimate for the 31st unit is $138$ dollars.'
          - problem: 'The cost of producing $x$ items is $C(x) = \frac{x^2}{20} + 30x + 500$ dollars. A manager has $170$ dollars to spend on extra production beyond $x = 40$ items. Use the marginal cost at $x = 40$ to estimate how many more items this money pays for.'
            answer: '5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The marginal cost is $C''(x) = \frac{x}{10} + 30$, so $C''(40) = 34$ dollars per item. The money pays for $170 \div 34 = 5$ more items.'
          - problem: 'The cost of making $x$ items is $C(x) = 0.01x^3 + 0.5x^2 + 20x + 100$ dollars. Find the actual cost of the 11th item, $C(11) - C(10)$.'
            answer: '33.81'
            answer_contract: {"kind":"unit","quantity":"dollar","unit":"dollar","allow_omitted":true}
            solution_sketch: 'Compute the two costs: $C(11) = 13.31 + 60.5 + 220 + 100 = 393.81$ and $C(10) = 10 + 50 + 200 + 100 = 360$. The difference is $393.81 - 360 = 33.81$ dollars.'
          - problem: 'The profit from selling $x$ items is $P(x) = -0.03x^2 + 50x - 200$ dollars. Use the marginal profit $P''(100)$ to estimate the extra profit from the 101st item.'
            answer: '44'
            answer_contract: {"kind":"unit","quantity":"dollar","unit":"dollar","allow_omitted":true}
            solution_sketch: 'The marginal profit is $P''(x) = -0.06x + 50$. At $x = 100$ this is $-6 + 50 = 44$, so the 101st item adds about $44$ dollars of profit.'
          - problem: 'Sam says the actual cost of the 26th item, $C(26) - C(25)$, equals the marginal cost $C''(25)$ exactly, where $C(x) = \frac{x^2}{25} + 10x + 250$ dollars. What is the actual cost of the 26th item?'
            answer: '12.04'
            answer_contract: {"kind":"unit","quantity":"dollar","unit":"dollar","allow_omitted":true}
            solution_sketch: 'Sam used the slope at $x = 25$, which is $C''(25) = 12$. The actual cost is $C(26) - C(25) = \frac{676 - 625}{25} + 10 = 2.04 + 10 = 12.04$ dollars, so the two values are not equal.'
          - problem: 'For $R(x) = 150x - \frac{x^2}{5}$ dollars, is the estimate $R''(30)$ of the revenue from the 31st unit too high or too low?'
            answer: 'too high'
            answer_contract: {"kind":"label","options":[["too high","high","it is too high","too large","overestimate","an overestimate"],["too low","low","it is too low","too small","underestimate","an underestimate"]]}
            solution_sketch: 'The estimate is $R''(30) = 138$. The actual revenue is $R(31) - R(30) = 150 - \frac{961 - 900}{5} = 137.8$, so the estimate of $138$ is too high.'
        constraints: 'quadratic and cubic cost, revenue and profit; actual change C(a+1) - C(a) next to the marginal value; estimate and direction of the error; units in the question'
      - id: kp3
        name: 'Maximize profit with marginals'
        key_prerequisites: [derivative-power-rule, evaluating-polynomials]
        exemplars:
          - problem: 'A firm sells each item at a fixed price, so its revenue is $R(x) = 240x$ dollars, and its cost is $C(x) = x^2 + 60x + 1500$ dollars. How many items maximize the profit $P = R - C$?'
            answer: '90'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The profit is $P(x) = 240x - (x^2 + 60x + 1500) = -x^2 + 180x - 1500$. Set $P''(x) = -2x + 180 = 0$ to get $x = 90$; since $P''''(x) = -2 < 0$, this is a maximum.'
          - problem: 'A company has revenue $R(x) = 180x$ and cost $C(x) = x^2 + 40x + 900$, both in dollars. What is the maximum profit $P = R - C$?'
            answer: '4000'
            answer_contract: {"kind":"unit","quantity":"dollar","unit":"dollar","allow_omitted":true}
            solution_sketch: 'The profit is $P(x) = -x^2 + 140x - 900$, and $P''(x) = -2x + 140 = 0$ gives $x = 70$. The maximum profit is $P(70) = -4900 + 9800 - 900 = 4000$ dollars.'
          - problem: 'A firm has revenue $R(x) = 500x$ and cost $C(x) = x^2 + 80x + 2000$, both in dollars. At what quantity $x$ is the marginal revenue equal to the marginal cost?'
            answer: '210'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The marginal revenue is $R''(x) = 500$ and the marginal cost is $C''(x) = 2x + 80$. Set $500 = 2x + 80$, so $2x = 420$ and $x = 210$.'
          - problem: 'The profit from selling $x$ lamps is $P(x) = -2x^2 + 200x - 1800$ dollars. What is the maximum profit?'
            answer: '3200'
            answer_contract: {"kind":"unit","quantity":"dollar","unit":"dollar","allow_omitted":true}
            solution_sketch: 'Set $P''(x) = -4x + 200 = 0$, so $x = 50$ lamps. Since $P''''(x) = -4 < 0$ this is a maximum, and $P(50) = -5000 + 10000 - 1800 = 3200$ dollars.'
          - problem: 'A theatre sells $x$ tickets at the price $p = 100 - 0.5x$ dollars each, and its cost is $C(x) = 20x + 500$ dollars. How many tickets should it sell to maximize its profit?'
            answer: '80'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The revenue is $R(x) = xp = 100x - 0.5x^2$, so the profit is $P(x) = 80x - 0.5x^2 - 500$. Set $P''(x) = 80 - x = 0$ to get $x = 80$ tickets.'
          - problem: 'A firm has revenue $R(x) = 300x$ and cost $C(x) = 2x^2 + 60x + 1200$, both in dollars, and it now makes $70$ items. To raise its profit, should it make more items or fewer?'
            answer: 'fewer'
            answer_contract: {"kind":"label","options":[["fewer","make fewer","fewer items","make fewer items","it should make fewer items","decrease","less"],["more","make more","more items","make more items","it should make more items","increase"]]}
            solution_sketch: 'At $x = 70$ the marginal revenue is $R''(70) = 300$ and the marginal cost is $C''(70) = 4(70) + 60 = 340$. The next item costs more than it earns, so the firm should make fewer items.'
          - problem: 'A firm has revenue $R(x) = 150x$ and cost $C(x) = x^2 + 30x + 1200$, both in dollars. What is the profit per item at the quantity that maximizes the profit?'
            answer: '40'
            answer_contract: {"kind":"unit","quantity":"dollar","unit":"dollar","allow_omitted":true}
            solution_sketch: 'The profit is $P(x) = -x^2 + 120x - 1200$, and $P''(x) = -2x + 120 = 0$ gives $x = 60$. The maximum profit is $P(60) = 2400$ dollars, so the profit per item is $2400 \div 60 = 40$ dollars.'
          - problem: 'Sam wants the quantity that maximizes profit for $R(x) = 420x$ and $C(x) = 3x^2 + 60x + 900$ dollars. He sets $C''(x) = 0$ and gets $x = -10$. What is the correct quantity?'
            answer: '60'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Sam looked for the smallest cost, but the best quantity is where the marginal revenue equals the marginal cost. Set $420 = 6x + 60$, so $6x = 360$ and $x = 60$.'
          - problem: 'A bakery''s profit from $x$ cakes is $P(x) = -x^2 + 120x - 2000$ dollars. How many cakes maximize the profit, and what is the maximum profit?'
            answer: 'x = 60; P = 1600'
            answer_contract: {"kind":"multipart","parts":[{"contract":{"kind":"exact"},"name":"x"},{"contract":{"kind":"exact"},"name":"P"}]}
            solution_sketch: 'Set $P''(x) = -2x + 120 = 0$, so $x = 60$ cakes. Since $P''''(x) = -2 < 0$ this is a maximum, and $P(60) = -3600 + 7200 - 2000 = 1600$ dollars.'
        constraints: 'quadratic profit with an integer vertex; marginal revenue equal to marginal cost; direction decision; profit per item; units in the question'
    diagnostic_exemplar:
      problem: 'Revenue is $R(x) = 120x$ and cost is $C(x) = x^2 + 20x + 800$, both in euros. How many items maximize the profit $P = R - C$, and what is the maximum profit?'
      answer: "x = 50 items; maximum profit €1700"
      answer_contract: {kind: none}
      solution_sketch: '$P(x) = -x^2 + 100x - 800$; $P''(x) = -2x + 100 = 0$ at $x = 50$; $P(50) = 1700$.'
    anki_seeds:
      - front: "Marginal cost is defined as..."
        back: "C'(x) — the derivative of cost, approximating the cost of the next item"
        type: basic
      - front: "Profit is maximized (interior optimum) when marginal revenue ___ marginal cost."
        back: "equals — P' = R' - C' = 0"
        type: basic

  - id: lhopitals-rule
    name: 'L''Hôpital''s Rule'
    core: true
    difficulty: 0.65
    drill: false
    answer_kind: numeric
    expected_time_secs: 150
    prerequisites:
      - id: derivatives-exp-log
        weight: 0.6
        key: true
      - id: derivatives-trig
        weight: 0.5
        key: true
      - id: one-sided-infinite-limits
        weight: 0.5
        key: true
      - id: limits-algebraic
        weight: 0.4
      - id: graphs-of-logarithmic-functions
        weight: 0.0            # conceptual only: ln x → -∞ as x → 0+ and ln x → ∞ underlie the ∞/∞ and 0·∞ forms; untaught elsewhere in this closure (re-audit R-04)
    knowledge_points:
      - id: kp1
        name: '0/0 forms'
        key_prerequisites: [derivatives-trig, derivatives-exp-log]
        try_first:
          problem: 'Let $f(x) = e^{4x} - 1$ and $g(x) = x$. What is $\frac{f''(0)}{g''(0)}$?'
          answer_contract: {"kind":"exact"}
          answer: '4'
          reveal: 'Near $x = 0$ each function is close to its tangent line, so $\frac{f(x)}{g(x)}$ is close to $\frac{f''(0)}{g''(0)}$. This ratio of slopes is the value that L''Hôpital''s rule gives for the limit of $\frac{f}{g}$.'
        exemplars:
          - problem: 'Use L''Hôpital''s rule to evaluate $\lim_{x \to 0} \frac{\sin(5x)}{x}$.'
            answer: '5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'At $x = 0$ both $\sin(5x)$ and $x$ are $0$, so the quotient has the form $\frac{0}{0}$. Differentiating the top and the bottom gives $\frac{5\cos(5x)}{1}$, which is $5$ at $x = 0$.'
          - problem: 'Evaluate $\lim_{x \to 0} \frac{e^x - 1 - x}{x^2}$.'
            answer: '1/2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The form is $\frac{0}{0}$. One application gives $\frac{e^x - 1}{2x}$, which is again $\frac{0}{0}$, and a second gives $\frac{e^x}{2}$. At $x = 0$ this is $\frac{1}{2}$.'
          - problem: 'Evaluate $\lim_{x \to 2} \frac{x^2 - 4}{x^2 - x - 2}$.'
            answer: '4/3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'At $x = 2$ the top is $0$ and the bottom is $4 - 2 - 2 = 0$, so the form is $\frac{0}{0}$. Differentiating gives $\frac{2x}{2x - 1}$, which is $\frac{4}{3}$ at $x = 2$.'
          - problem: 'For a bank account with continuous compounding at rate $r$, the interest earned in $3$ years on $1$ dollar is $e^{3r} - 1$. What does the interest per unit of rate, $\frac{e^{3r} - 1}{r}$, approach as $r$ approaches $0$?'
            answer: '3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'As $r \to 0$ the top $e^{3r} - 1$ and the bottom $r$ both tend to $0$, so the form is $\frac{0}{0}$. Differentiating gives $\frac{3e^{3r}}{1}$, which tends to $3$.'
          - problem: 'A chord of a unit circle that spans the angle $\theta$ (in radians) has length $2\sin\left(\frac{\theta}{2}\right)$, and the arc has length $\theta$. What does the ratio of the chord to the arc approach as $\theta$ approaches $0$?'
            answer: '1'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Both lengths tend to $0$, so the ratio $\frac{2\sin(\theta/2)}{\theta}$ has the form $\frac{0}{0}$. Differentiating gives $\frac{\cos(\theta/2)}{1}$, which tends to $1$.'
          - problem: 'Evaluate $\lim_{x \to 0} \frac{1 - \cos(3x)}{x^2}$.'
            answer: '9/2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The form is $\frac{0}{0}$. One application gives $\frac{3\sin(3x)}{2x}$, which is still $\frac{0}{0}$, and a second gives $\frac{9\cos(3x)}{2}$. At $x = 0$ this is $\frac{9}{2}$.'
          - problem: 'Evaluate $\lim_{x \to 1} \frac{\ln x}{x - 1}$.'
            answer: '1'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'At $x = 1$ the top is $\ln 1 = 0$ and the bottom is $0$, so the form is $\frac{0}{0}$. Differentiating gives $\frac{1/x}{1}$, which is $1$ at $x = 1$.'
          - problem: 'Sam evaluates $\lim_{x \to 0} \frac{\sin(6x)}{3x}$ with L''Hôpital''s rule and gets $\frac{\cos(6x)}{3}$, so the limit is $\frac{1}{3}$. What is the correct limit?'
            answer: '2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Sam forgot the chain rule: the derivative of $\sin(6x)$ is $6\cos(6x)$, not $\cos(6x)$. So the new quotient is $\frac{6\cos(6x)}{3}$, which is $2$ at $x = 0$.'
          - problem: 'Evaluate $\lim_{x \to 0} \frac{e^{2x} - 1 - 2x}{x^2}$.'
            answer: '2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The form is $\frac{0}{0}$. One application gives $\frac{2e^{2x} - 2}{2x}$, which is still $\frac{0}{0}$, and a second gives $\frac{4e^{2x}}{2}$. At $x = 0$ this is $2$.'
        constraints: 'verify the 0/0 form before differentiating; at most two applications'
      - id: kp2
        name: '∞/∞ forms'
        key_prerequisites: [one-sided-infinite-limits, derivatives-exp-log]
        exemplars:
          - problem: 'Evaluate $\lim_{x \to \infty} \frac{\ln x}{x}$.'
            answer: '0'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Both $\ln x$ and $x$ tend to $\infty$, so the form is $\frac{\infty}{\infty}$. Differentiating gives $\frac{1/x}{1} = \frac{1}{x}$, which tends to $0$.'
          - problem: 'A company''s revenue is $R(x) = 3x^2 + x$ dollars and its cost is $C(x) = 2x^2 - 5$ dollars when it makes $x$ items. What value does the ratio $\frac{R(x)}{C(x)}$ approach as $x$ grows without bound?'
            answer: '3/2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Both $R$ and $C$ tend to $\infty$, so the form is $\frac{\infty}{\infty}$. One application gives $\frac{6x + 1}{4x}$, which is still $\frac{\infty}{\infty}$, and a second gives $\frac{6}{4} = \frac{3}{2}$.'
          - problem: 'Evaluate $\lim_{x \to \infty} \frac{\ln x}{\ln(x^2 + 1)}$.'
            answer: '1/2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Both logarithms tend to $\infty$, so the form is $\frac{\infty}{\infty}$. Differentiating gives $\frac{1/x}{2x/(x^2 + 1)} = \frac{x^2 + 1}{2x^2}$, which tends to $\frac{1}{2}$.'
          - problem: 'Algorithm A takes $n^2$ steps and algorithm B takes $2^n$ steps on an input of size $n$. What value does the ratio $\frac{n^2}{2^n}$ approach as $n$ grows without bound?'
            answer: '0'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Both counts tend to $\infty$, so the form is $\frac{\infty}{\infty}$. One application gives $\frac{2n}{2^n \ln 2}$, which is still $\frac{\infty}{\infty}$, and a second gives $\frac{2}{2^n (\ln 2)^2}$, which tends to $0$.'
          - problem: 'Evaluate $\lim_{x \to \infty} \frac{e^x}{x^3}$.'
            answer: 'infinity'
            answer_contract: {"kind":"label","options":[["infinity","∞","+∞","+infinity","positive infinity","oo","inf"],["negative infinity","-∞","−∞","-infinity","minus infinity","-oo"],["does not exist","DNE","no limit"]]}
            solution_sketch: 'The form is $\frac{\infty}{\infty}$. Three applications give $\frac{e^x}{3x^2}$, then $\frac{e^x}{6x}$, then $\frac{e^x}{6}$, which grows without bound. So the limit is infinity.'
          - problem: 'Evaluate $\lim_{x \to \infty} \frac{x}{x + \ln x}$.'
            answer: '1'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Both the top and the bottom tend to $\infty$, so the form is $\frac{\infty}{\infty}$. Differentiating gives $\frac{1}{1 + 1/x}$, which tends to $1$.'
          - problem: 'Sam says that $\lim_{x \to \infty} \frac{x}{e^x}$ is infinity, because $x$ grows without bound. What is the correct limit?'
            answer: '0'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The top and the bottom both tend to $\infty$, so the form is $\frac{\infty}{\infty}$ and the growth of $x$ alone decides nothing. Differentiating gives $\frac{1}{e^x}$, which tends to $0$.'
          - problem: 'Evaluate $\lim_{x \to \infty} \frac{-x}{\ln x}$.'
            answer: 'negative infinity'
            answer_contract: {"kind":"label","options":[["infinity","∞","+∞","+infinity","positive infinity","oo","inf"],["negative infinity","-∞","−∞","-infinity","minus infinity","-oo"],["does not exist","DNE","no limit"]]}
            solution_sketch: 'The form is $\frac{-\infty}{\infty}$, so the rule applies. Differentiating gives $\frac{-1}{1/x} = -x$, which tends to negative infinity.'
        constraints: 'growth hierarchy results (log, then polynomial, then exponential); limits are finite or infinite; at most two label items'
      - id: kp3
        name: 'Check the form first; rewrite 0·∞'
        key_prerequisites: [one-sided-infinite-limits, limits-algebraic]
        exemplars:
          - problem: 'Evaluate $\lim_{x \to 0^+} x \ln x$.'
            answer: '0'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The product has the form $0 \cdot (-\infty)$, so rewrite it as the quotient $\frac{\ln x}{1/x}$, which has the form $\frac{-\infty}{\infty}$. Differentiating gives $\frac{1/x}{-1/x^2} = -x$, which tends to $0$.'
          - problem: 'Evaluate $\lim_{x \to 0} x \cot(3x)$.'
            answer: '1/3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Write $x \cot(3x) = \frac{x\cos(3x)}{\sin(3x)}$, which has the form $\frac{0}{0}$. Differentiating gives $\frac{\cos(3x) - 3x\sin(3x)}{3\cos(3x)}$, which is $\frac{1}{3}$ at $x = 0$.'
          - problem: 'A regular polygon with $n$ sides is inscribed in a circle of radius $1$. Its perimeter is $2n\sin\left(\frac{\pi}{n}\right)$. What value does the perimeter approach as $n$ grows without bound?'
            answer: '2*pi'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The product has the form $\infty \cdot 0$. Let $h = \frac{1}{n}$ and write it as $\frac{2\sin(\pi h)}{h}$, which has the form $\frac{0}{0}$ as $h \to 0$. Differentiating gives $2\pi\cos(\pi h)$, which tends to $2\pi$.'
          - problem: 'Evaluate $\lim_{x \to \infty} x e^{-x}$.'
            answer: '0'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The product has the form $\infty \cdot 0$, so write it as $\frac{x}{e^x}$, which has the form $\frac{\infty}{\infty}$. Differentiating gives $\frac{1}{e^x}$, which tends to $0$.'
          - problem: 'Evaluate $\lim_{x \to 0} \frac{x + 1}{x + 2}$.'
            answer: '1/2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Substituting $x = 0$ gives $\frac{1}{2}$, which is not an indeterminate form. So the rule does not apply and the limit is $\frac{1}{2}$.'
          - problem: 'Evaluate $\lim_{x \to \infty} x \sin\left(\frac{1}{x}\right)$.'
            answer: '1'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The product has the form $\infty \cdot 0$, so write it as $\frac{\sin(1/x)}{1/x}$, which has the form $\frac{0}{0}$. With $h = \frac{1}{x}$, differentiating $\frac{\sin h}{h}$ gives $\cos h$, which tends to $1$.'
          - problem: 'Does L''Hôpital''s rule apply to $\lim_{x \to 0^+} x \ln x$?'
            answer: 'no'
            answer_contract: {"kind":"label","options":[["no","it does not","does not apply","not directly","no, it does not apply","it does not apply directly"],["yes","it does","it applies","yes, it applies"]]}
            solution_sketch: 'The expression is a product with the form $0 \cdot (-\infty)$. The rule needs a quotient of the form $\frac{0}{0}$ or $\frac{\infty}{\infty}$, so the product must first be rewritten as a quotient.'
          - problem: 'Sam uses L''Hôpital''s rule on $\lim_{x \to 2} \frac{x^2 + 1}{x + 1}$ and gets $\frac{2x}{1} = 4$. What is the correct limit?'
            answer: '5/3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'At $x = 2$ the quotient is $\frac{5}{3}$, which is not an indeterminate form, so the rule does not apply. The limit is found by substitution and equals $\frac{5}{3}$.'
          - problem: 'Evaluate $\lim_{x \to 0^+} \sqrt{x}\,\ln x$.'
            answer: '0'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The product has the form $0 \cdot (-\infty)$, so write it as $\frac{\ln x}{x^{-1/2}}$. Differentiating gives $\frac{1/x}{-\frac{1}{2}x^{-3/2}} = -2\sqrt{x}$, which tends to $0$.'
        constraints: 'one trap item (not an indeterminate form), one verdict on the form, and 0·∞ rewrites'
    diagnostic_exemplar:
      problem: 'Evaluate $\lim_{x \to 0^+} x^2 \ln x$.'
      answer: "0"
      solution_sketch: 'Rewrite $0 \cdot \infty$ as $\frac{\ln x}{x^{-2}}$; L''Hôpital gives $\frac{1/x}{-2x^{-3}} = -\frac{x^2}{2} \to 0$.'
    anki_seeds:
      - front: "L'Hôpital's rule applies only to which indeterminate forms (directly)?"
        back: "0/0 and ∞/∞ — always verify the form before differentiating"
        type: basic
      - front: "Growth hierarchy as x → ∞: ln x vs x^n vs e^x?"
        back: "ln x ≪ x^n ≪ e^x (each is eventually negligible next to the one after)"
        type: basic

  - id: indeterminate-forms-powers
    name: Indeterminate Differences and Powers
    core: false                # special-case extension of l'Hopital's rule
    difficulty: 0.7
    drill: false
    answer_kind: numeric
    expected_time_secs: 240
    prerequisites:
      - id: lhopitals-rule
        weight: 0.8
        key: true
      - id: derivatives-exp-log
        weight: 0.5
        key: true
      - id: logarithm-properties
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: '∞ - ∞ and 0·∞ rewrites'
        key_prerequisites: [lhopitals-rule]
        exemplars:
          - problem: 'Evaluate $\lim_{x \to \infty} \left(\sqrt{x^2 + x} - x\right)$.'
            answer: '1/2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The form is $\infty - \infty$, so multiply by the conjugate to get $\frac{x}{\sqrt{x^2 + x} + x}$. Divide the top and the bottom by $x$ to get $\frac{1}{\sqrt{1 + 1/x} + 1}$, which tends to $\frac{1}{2}$.'
          - problem: 'Evaluate $\lim_{x \to \infty} x\left(e^{1/x} - 1\right)$.'
            answer: '1'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The form is $\infty \cdot 0$, so write it as $\frac{e^{1/x} - 1}{1/x}$. With $h = \frac{1}{x}$ this is $\frac{e^h - 1}{h}$, which has the form $\frac{0}{0}$, and differentiating gives $e^h$, which tends to $1$.'
          - problem: 'Evaluate $\lim_{x \to \infty} \left(\sqrt{x^2 + 4x} - x\right)$.'
            answer: '2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Multiply by the conjugate to get $\frac{4x}{\sqrt{x^2 + 4x} + x}$. Divide the top and the bottom by $x$ to get $\frac{4}{\sqrt{1 + 4/x} + 1}$, which tends to $\frac{4}{2} = 2$.'
          - problem: 'Evaluate $\lim_{x \to \infty} \left(x - \sqrt{x^2 - 3x}\right)$.'
            answer: '3/2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Multiply by the conjugate $x + \sqrt{x^2 - 3x}$ to get $\frac{3x}{x + \sqrt{x^2 - 3x}}$. Divide the top and the bottom by $x$ to get $\frac{3}{1 + \sqrt{1 - 3/x}}$, which tends to $\frac{3}{2}$.'
          - problem: 'A service costs $\sqrt{n^2 + 9n}$ dollars when it has $n$ users, and a flat plan costs $n$ dollars. What value does the gap $\sqrt{n^2 + 9n} - n$ approach as $n$ grows without bound?'
            answer: '9/2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The gap has the form $\infty - \infty$, so multiply by the conjugate to get $\frac{9n}{\sqrt{n^2 + 9n} + n}$. Divide the top and the bottom by $n$ to get $\frac{9}{\sqrt{1 + 9/n} + 1}$, which tends to $\frac{9}{2}$.'
          - problem: 'Evaluate $\lim_{x \to 0} \left(\frac{1}{x} - \frac{1}{\sin x}\right)$.'
            answer: '0'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The form is $\infty - \infty$, so combine into $\frac{\sin x - x}{x \sin x}$, which has the form $\frac{0}{0}$. One application gives $\frac{\cos x - 1}{\sin x + x\cos x}$, still $\frac{0}{0}$, and a second gives $\frac{-\sin x}{2\cos x - x\sin x}$, which tends to $0$.'
          - problem: 'A bank splits the yearly interest into $n$ equal parts. At the yearly rate $0.06$ the total of the parts is $n\left(e^{0.06/n} - 1\right)$ times the balance. What value does this approach as $n$ grows without bound?'
            answer: '3/50'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The form is $\infty \cdot 0$, so write it as $\frac{e^{0.06/n} - 1}{1/n}$. With $h = \frac{1}{n}$ this is $\frac{e^{0.06h} - 1}{h}$, and differentiating gives $0.06e^{0.06h}$, which tends to $0.06 = \frac{3}{50}$.'
          - problem: 'Evaluate $\lim_{x \to 1} \left(\frac{1}{\ln x} - \frac{1}{x - 1}\right)$.'
            answer: '1/2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The form is $\infty - \infty$, so combine into $\frac{x - 1 - \ln x}{(x - 1)\ln x}$, which has the form $\frac{0}{0}$. One application gives $\frac{x - 1}{x\ln x + x - 1}$ after simplifying, which is still $\frac{0}{0}$. A second gives $\frac{1}{\ln x + 2}$, which is $\frac{1}{2}$ at $x = 1$.'
          - problem: 'Sam says that $\lim_{x \to \infty} \left(\sqrt{x^2 + 6x} - x\right)$ is $0$, because both terms are about equal to $x$. What is the correct limit?'
            answer: '3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Sam cannot cancel two terms that both grow without bound. Multiplying by the conjugate gives $\frac{6x}{\sqrt{x^2 + 6x} + x} = \frac{6}{\sqrt{1 + 6/x} + 1}$, which tends to $\frac{6}{2} = 3$.'
        constraints: 'rewrite to a quotient (conjugate, common denominator or reciprocal) before any L''Hôpital step'
      - id: kp2
        name: '1^∞ forms via logarithms'
        key_prerequisites: [lhopitals-rule, logarithm-properties, derivatives-exp-log]
        try_first:
          problem: 'A positive quantity $y$ satisfies $\ln y = 3$. What is $y$?'
          answer_contract: {"kind":"exact"}
          answer: 'e^3'
          reveal: 'Since $y = e^{\ln y}$, a value of $\ln y$ gives $y = e^{3}$ here. In this lesson the limit of $\ln y$ is found first, and the limit of $y$ is then $e$ to that number.'
        exemplars:
          - problem: 'Evaluate $\lim_{x \to \infty} \left(1 + \frac{2}{x}\right)^x$.'
            answer: 'e^2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The form is $1^\infty$. Let $y = \left(1 + \frac{2}{x}\right)^x$, so $\ln y = \frac{\ln(1 + 2/x)}{1/x}$, which has the form $\frac{0}{0}$ and tends to $2$ by L''Hôpital''s rule. So $y \to e^2$.'
          - problem: 'Evaluate $\lim_{x \to 0} (1 + x)^{1/x}$.'
            answer: 'e'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The form is $1^\infty$. Let $y = (1 + x)^{1/x}$, so $\ln y = \frac{\ln(1 + x)}{x}$, which has the form $\frac{0}{0}$. L''Hôpital''s rule gives $\frac{1}{1 + x}$, which tends to $1$, so $y \to e^1 = e$.'
          - problem: 'Evaluate $\lim_{x \to \infty} \left(1 + \frac{5}{x}\right)^{4x}$.'
            answer: 'e^20'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The form is $1^\infty$. Let $y = \left(1 + \frac{5}{x}\right)^{4x}$, so $\ln y = \frac{4\ln(1 + 5/x)}{1/x}$, which has the form $\frac{0}{0}$ and tends to $20$ by L''Hôpital''s rule. So $y \to e^{20}$.'
          - problem: 'Evaluate $\lim_{x \to 0} (1 + 7x)^{1/x}$.'
            answer: 'e^7'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The form is $1^\infty$. Let $y = (1 + 7x)^{1/x}$, so $\ln y = \frac{\ln(1 + 7x)}{x}$, which has the form $\frac{0}{0}$. L''Hôpital''s rule gives $\frac{7}{1 + 7x}$, which tends to $7$, so $y \to e^7$.'
          - problem: 'Evaluate $\lim_{x \to 0} (1 - 4x)^{1/x}$.'
            answer: 'e^(-4)'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The form is $1^\infty$. Let $y = (1 - 4x)^{1/x}$, so $\ln y = \frac{\ln(1 - 4x)}{x}$, which has the form $\frac{0}{0}$. L''Hôpital''s rule gives $\frac{-4}{1 - 4x}$, which tends to $-4$, so $y \to e^{-4}$.'
          - problem: 'Evaluate $\lim_{x \to \infty} \left(1 + \frac{8}{x}\right)^{3x}$.'
            answer: 'e^24'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The form is $1^\infty$. Let $y = \left(1 + \frac{8}{x}\right)^{3x}$, so $\ln y = \frac{3\ln(1 + 8/x)}{1/x}$, which has the form $\frac{0}{0}$ and tends to $24$ by L''Hôpital''s rule. So $y \to e^{24}$.'
          - problem: 'A bank pays the yearly rate $5\%$ in $n$ equal parts, so $1$ dollar grows to $\left(1 + \frac{0.05}{n}\right)^n$ dollars in one year. To what value does the balance of $1$ dollar tend as $n$ grows without bound?'
            answer: 'e^(1/20)'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The form is $1^\infty$. Let $y = \left(1 + \frac{0.05}{n}\right)^n$, so $\ln y = \frac{\ln(1 + 0.05/n)}{1/n}$, which has the form $\frac{0}{0}$ and tends to $0.05 = \frac{1}{20}$. So $y \to e^{1/20}$ dollars.'
          - problem: 'A sample loses the fraction $\frac{3}{n}$ of what remains in each of $n$ equal steps, so the fraction left is $\left(1 - \frac{3}{n}\right)^n$. What value does the fraction left approach as $n$ grows without bound?'
            answer: 'e^(-3)'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The form is $1^\infty$. Let $y = \left(1 - \frac{3}{n}\right)^n$, so $\ln y = \frac{\ln(1 - 3/n)}{1/n}$, which has the form $\frac{0}{0}$ and tends to $-3$. So $y \to e^{-3}$.'
          - problem: 'Sam says that $\lim_{x \to \infty} \left(1 + \frac{6}{x}\right)^x$ is $1$, because the base tends to $1$ and $1$ to any power is $1$. What is the correct limit?'
            answer: 'e^6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The base tends to $1$ while the exponent grows without bound, so this is the indeterminate form $1^\infty$ and the value is not forced to be $1$. Here $\ln y = \frac{\ln(1 + 6/x)}{1/x} \to 6$, so $y \to e^6$.'
          - problem: 'Evaluate $\lim_{x \to 0} (\cos x)^{1/x^2}$.'
            answer: 'e^(-1/2)'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The form is $1^\infty$. Let $y = (\cos x)^{1/x^2}$, so $\ln y = \frac{\ln(\cos x)}{x^2}$, which has the form $\frac{0}{0}$. One application gives $\frac{-\tan x}{2x}$, still $\frac{0}{0}$, and a second gives $\frac{-\sec^2 x}{2}$, which tends to $-\frac{1}{2}$. So $y \to e^{-1/2}$.'
        constraints: 'take ln, evaluate the resulting 0/0 or ∞/∞ limit, then exponentiate'
      - id: kp3
        name: '0^0 and ∞^0 forms'
        key_prerequisites: [lhopitals-rule, logarithm-properties]
        exemplars:
          - problem: 'Evaluate $\lim_{x \to 0^+} x^x$.'
            answer: '1'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The form is $0^0$. Let $y = x^x$, so $\ln y = x\ln x = \frac{\ln x}{1/x}$, which has the form $\frac{-\infty}{\infty}$. L''Hôpital''s rule gives $-x$, which tends to $0$, so $y \to e^0 = 1$.'
          - problem: 'A quantity grows by the same factor $g$ each year, from $1$ to $n$ in $n$ years, so $g = n^{1/n}$. What value does $g$ approach as $n$ grows without bound?'
            answer: '1'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The form is $\infty^0$. Let $y = n^{1/n}$, so $\ln y = \frac{\ln n}{n}$, which has the form $\frac{\infty}{\infty}$. L''Hôpital''s rule gives $\frac{1}{n}$, which tends to $0$, so $y \to e^0 = 1$.'
          - problem: 'Evaluate $\lim_{x \to 0^+} x^{1/\ln x}$.'
            answer: 'e'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The form is $0^0$. Let $y = x^{1/\ln x}$, so $\ln y = \frac{1}{\ln x} \cdot \ln x = 1$ for every $x \ne 1$. So $\ln y \to 1$ and $y \to e^1 = e$.'
          - problem: 'Evaluate $\lim_{x \to 0^+} x^{2/\ln x}$.'
            answer: 'e^2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The form is $0^0$. Let $y = x^{2/\ln x}$, so $\ln y = \frac{2}{\ln x} \cdot \ln x = 2$ for every $x \ne 1$. So $\ln y \to 2$ and $y \to e^2$.'
          - problem: 'Evaluate $\lim_{x \to \infty} x^{-1/\ln x}$.'
            answer: '1/e'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The form is $\infty^0$. Let $y = x^{-1/\ln x}$, so $\ln y = -\frac{1}{\ln x} \cdot \ln x = -1$ for $x > 1$. So $\ln y \to -1$ and $y \to e^{-1} = \frac{1}{e}$.'
          - problem: 'A quantity grows by the same factor $g$ each year, from $1$ to $x^3$ in $1 + \ln x$ years, so $g = x^{3/(1 + \ln x)}$. What value does $g$ approach as $x$ grows without bound?'
            answer: 'e^3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The form is $\infty^0$. Let $y = x^{3/(1 + \ln x)}$, so $\ln y = \frac{3\ln x}{1 + \ln x}$, which has the form $\frac{\infty}{\infty}$. L''Hôpital''s rule gives $\frac{3/x}{1/x} = 3$, so $y \to e^3$.'
          - problem: 'Evaluate $\lim_{x \to 0^+} (\sin x)^x$.'
            answer: '1'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The form is $0^0$. Let $y = (\sin x)^x$, so $\ln y = x\ln(\sin x) = \frac{\ln(\sin x)}{1/x}$, which has the form $\frac{-\infty}{\infty}$. L''Hôpital''s rule gives $\frac{\cos x/\sin x}{-1/x^2} = -\frac{x^2\cos x}{\sin x}$, which tends to $0$, so $y \to e^0 = 1$.'
          - problem: 'Evaluate $\lim_{x \to \infty} (\ln x)^{1/x}$.'
            answer: '1'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The form is $\infty^0$. Let $y = (\ln x)^{1/x}$, so $\ln y = \frac{\ln(\ln x)}{x}$, which has the form $\frac{\infty}{\infty}$. L''Hôpital''s rule gives $\frac{1}{x\ln x}$, which tends to $0$, so $y \to e^0 = 1$.'
          - problem: 'Sam says that $\lim_{x \to 0^+} x^x$ is $0$, because $0$ to any power is $0$. What is the correct limit?'
            answer: '1'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The base tends to $0$ and the exponent tends to $0$, so this is the indeterminate form $0^0$, and the rule that $0$ to a power is $0$ needs a positive exponent. Here $\ln y = x\ln x \to 0$, so $y \to e^0 = 1$.'
        constraints: 'answers are e^L for a clean L (often 0, giving 1); always exponentiate at the end'
    diagnostic_exemplar:
      problem: 'Evaluate $\lim_{x \to \infty} \left(1 + \frac{3}{x}\right)^x$.'
      answer: "e^3"
      solution_sketch: '$\ln y = \frac{\ln(1 + 3/x)}{1/x} \to 3$ (L''Hôpital), so $y \to e^3$.'
