unit: the-derivative
course: calculus-1
module: "The Derivative"
topics:
  - id: average-instantaneous-rate
    name: Average and Instantaneous Rates of Change
    core: true
    difficulty: 0.5
    drill: false
    answer_kind: numeric
    expected_time_secs: 120
    prerequisites:
      - id: average-rate-of-change
        weight: 0.7
        key: true
      - id: slope
        weight: 0.5
        key: true
      - id: limits-graphical-numerical
        weight: 0.5
        key: true
      - id: function-notation
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: Average rate of change over an interval
        key_prerequisites: [average-rate-of-change, function-notation]
        exemplars:
          - problem: 'Find the average rate of change of $f(x) = x^2 + 1$ on $[2, 6]$.'
            answer: '8'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The average rate of change is the change in $f$ divided by the change in $x$. Here $f(6) = 37$ and $f(2) = 5$, so $\frac{37 - 5}{6 - 2} = \frac{32}{4} = 8$.'
          - problem: 'Find the average rate of change of $f(x) = x^3$ from $x = 1$ to $x = 3$.'
            answer: '13'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Divide the change in $f$ by the change in $x$. Since $f(3) = 27$ and $f(1) = 1$, the rate is $\frac{27 - 1}{3 - 1} = \frac{26}{2} = 13$.'
          - problem: 'A ball''s height is $s(t) = t^2 + 1$ metres after $t$ seconds. What is its average velocity between $t = 1$ and $t = 4$?'
            answer: '5'
            answer_contract: {"kind":"unit","quantity":"speed","unit":"m/s","allow_omitted":true}
            solution_sketch: 'Average velocity is the change in height divided by the time that passes. Since $s(4) = 17$ and $s(1) = 2$, the average velocity is $\frac{17 - 2}{4 - 1} = 5$ m/s.'
          - problem: 'Find the average rate of change of $f(x) = x^2 + 3x$ on $[0, 4]$.'
            answer: '7'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Evaluate at the endpoints: $f(4) = 16 + 12 = 28$ and $f(0) = 0$. The average rate of change is $\frac{28 - 0}{4 - 0} = 7$.'
          - problem: 'A company''s profit is $P(x) = -x^2 + 10x$ thousand dollars when $x$ hundred units are sold. Find the average rate of change of $P$ as $x$ goes from $2$ to $5$.'
            answer: '3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The profit is $P(2) = 16$ at the start and $P(5) = 25$ at the end. The average rate of change is $\frac{25 - 16}{5 - 2} = 3$ thousand dollars for each hundred units.'
          - problem: 'Find the average rate of change of $g(x) = \frac{1}{x}$ on $[1, 4]$.'
            answer: '-1/4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Here $g(4) = \frac{1}{4}$ and $g(1) = 1$. The average rate of change is $\frac{\frac{1}{4} - 1}{4 - 1} = \frac{-3/4}{3} = -\frac{1}{4}$.'
          - problem: 'A town had $12\,000$ people in 2010 and $15\,000$ people in 2020. On average, how many people did the town gain each year from 2010 to 2020?'
            answer: '300'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The population grew by $15000 - 12000 = 3000$ people over $10$ years. Dividing the total change by the number of years gives $\frac{3000}{10} = 300$ people per year.'
          - problem: 'Sam finds the average rate of change of $f(x) = x^3 - x$ on $[1, 3]$ by working out $\frac{f(3)}{3}$, and gets $8$. What is the correct value?'
            answer: '12'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Sam used only one endpoint and one input. The correct value is $\frac{f(3) - f(1)}{3 - 1} = \frac{24 - 0}{2} = 12$.'
          - problem: 'The average rate of change of $f(x) = x^2$ on $[1, b]$ is $5$, where $b > 1$. Find $b$.'
            answer: '4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The average rate of change is $\frac{b^2 - 1}{b - 1} = b + 1$. Setting $b + 1 = 5$ gives $b = 4$.'
        constraints: 'polynomial or reciprocal functions and everyday data (profit, population); endpoints are small integers; answers are integers or simple fractions'
      - id: kp2
        name: Secant slopes and units in context
        key_prerequisites: [slope, average-rate-of-change]
        exemplars:
          - problem: 'For $f(x) = x^2$, find the slope of the secant line through $(1, f(1))$ and $(3, f(3))$.'
            answer: '4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The secant slope is the average rate of change of $f$ between the two points. It equals $\frac{9 - 1}{3 - 1} = 4$.'
          - problem: 'A tank holds $V(t) = t^2$ litres of water after $t$ minutes. How fast, on average, does the volume increase from $t = 2$ to $t = 5$?'
            answer: '7'
            answer_contract: {"kind":"unit","quantity":"flow","unit":"L/min","allow_omitted":true}
            solution_sketch: 'The volume rises from $V(2) = 4$ to $V(5) = 25$ litres. Dividing by the $3$ minutes gives $\frac{21}{3} = 7$ litres per minute.'
          - problem: 'A particle''s position is $s(t) = 2t^2$ metres after $t$ seconds. Find its average velocity on $[0, 3]$.'
            answer: '6'
            answer_contract: {"kind":"unit","quantity":"speed","unit":"m/s","allow_omitted":true}
            solution_sketch: 'The particle moves from $s(0) = 0$ to $s(3) = 18$ metres. Its average velocity is $\frac{18 - 0}{3 - 0} = 6$ m/s.'
          - problem: 'A ball is dropped from a tower. Its height is $h(t) = 100 - 5t^2$ metres after $t$ seconds. What is its average velocity between $t = 1$ and $t = 3$?'
            answer: '-20'
            answer_contract: {"kind":"unit","quantity":"speed","unit":"m/s","allow_omitted":true}
            solution_sketch: 'The height falls from $h(1) = 95$ to $h(3) = 55$ metres. The average velocity is $\frac{55 - 95}{3 - 1} = -20$ m/s, and the minus sign shows that the ball moves down.'
          - problem: 'A car''s odometer reads $120$ km at 1 pm and $300$ km at 3 pm. What is its average speed?'
            answer: '90'
            answer_contract: {"kind":"unit","quantity":"speed","unit":"km/h","allow_omitted":true}
            solution_sketch: 'The car covers $300 - 120 = 180$ km in $2$ hours. Dividing distance by time gives $\frac{180}{2} = 90$ km/h.'
          - problem: 'A runner''s average speed during a $3$-second sprint is $4$ metres per second. How far does she run?'
            answer: '12'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'Average speed is distance divided by time, so distance is speed times time. The runner covers $4 \cdot 3 = 12$ metres.'
          - problem: 'The volume of a cube with side length $x$ cm is $V(x) = x^3$ cubic centimetres. Find the average rate of change of $V$ as $x$ changes from $2$ cm to $3$ cm, in cubic centimetres per centimetre.'
            answer: '19'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The volume grows from $V(2) = 8$ to $V(3) = 27$. The average rate of change is $\frac{27 - 8}{3 - 2} = 19$.'
          - problem: 'The average rate of change of $f$ on $[1, 4]$ is $-3$, and $f(1) = 10$. Find $f(4)$.'
            answer: '1'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The rate gives $\frac{f(4) - 10}{4 - 1} = -3$. Multiplying by $3$ gives $f(4) - 10 = -9$, so $f(4) = 1$.'
          - problem: 'A particle''s position is $s(t) = t^2$ metres at time $t$ seconds. Its average velocity on $[1, b]$ is $5$ m/s. Find the time $b$ in seconds.'
            answer: '4'
            answer_contract: {"kind":"unit","quantity":"time","unit":"s","allow_omitted":true}
            solution_sketch: 'The average velocity is $\frac{b^2 - 1}{b - 1} = b + 1$. Setting $b + 1 = 5$ gives $b = 4$ seconds.'
        constraints: 'applied contexts (height, volume, position, distance); the rate is found by dividing and, in one item, the total is found by multiplying; units follow from the context'
      - id: kp3
        name: Instantaneous rate as a limit of average rates
        key_prerequisites: [limits-graphical-numerical, slope]
        try_first:
          problem: 'A particle''s position is $s(t) = t^2$ metres after $t$ seconds. Find its average velocity on $[2, 2.01]$.'
          answer_contract: {"kind":"exact"}
          answer: '4.01'
          reveal: 'The average velocity $4.01$ is already close to $4$. Shorter and shorter intervals push the average toward $4$, and that limiting value is the instantaneous velocity at $t = 2$.'
        exemplars:
          - problem: 'A particle''s position is $s(t) = t^2$ metres after $t$ seconds. Its average velocities on $[3, 3.1]$, $[3, 3.01]$ and $[3, 3.001]$ are $6.1$, $6.01$ and $6.001$ m/s. What is its instantaneous velocity at $t = 3$?'
            answer: '6'
            answer_contract: {"kind":"unit","quantity":"speed","unit":"m/s","allow_omitted":true}
            solution_sketch: 'The average velocities get closer and closer to $6$ as the interval shrinks. So the instantaneous velocity at $t = 3$ is $6$ m/s.'
          - problem: 'For $f(x) = x^2$, the average rate of change on $[2, 2 + h]$ simplifies to $4 + h$. What value do these average rates approach as $h$ approaches $0$?'
            answer: '4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'As $h$ gets closer to $0$, the term $h$ vanishes and $4 + h$ gets closer to $4$. The instantaneous rate of change at $x = 2$ is therefore $4$.'
          - problem: 'For $s(t) = t^3$, the average rates of change on $[2, 2.1]$, $[2, 2.01]$ and $[2, 2.001]$ are $12.61$, $12.0601$ and $12.006001$. What is the instantaneous rate of change at $t = 2$?'
            answer: '12'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The average rates shrink toward $12$ as the interval length goes to zero. The instantaneous rate of change at $t = 2$ is $12$.'
          - problem: 'For $f(x) = x^3$, the average rate of change on $[1, 1 + h]$ is $3 + 3h + h^2$. What is the instantaneous rate of change of $f$ at $x = 1$?'
            answer: '3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'As $h$ approaches $0$, the terms $3h$ and $h^2$ both approach $0$. What is left is $3$, the instantaneous rate of change at $x = 1$.'
          - problem: 'A cart''s position is $s(t) = t^2 + 2t$ metres after $t$ seconds. Its average velocities on $[4, 4.1]$ and $[4, 4.01]$ are $10.1$ and $10.01$ m/s. Find its instantaneous velocity at $t = 4$.'
            answer: '10'
            answer_contract: {"kind":"unit","quantity":"speed","unit":"m/s","allow_omitted":true}
            solution_sketch: 'The averages $10.1$ and $10.01$ lie on shrinking intervals that all start at $t = 4$. They approach $10$, so the instantaneous velocity is $10$ m/s.'
          - problem: 'For $f(x) = x^2$, the average rate of change on $[a, a + h]$ simplifies to $2a + h$. The instantaneous rate of change of $f$ at $x = a$ is $14$. Find $a$.'
            answer: '7'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The instantaneous rate is the limit of $2a + h$ as $h$ approaches $0$, which is $2a$. Setting $2a = 14$ gives $a = 7$.'
          - problem: 'A ball''s height is $h(t) = 20t - 5t^2$ metres after $t$ seconds. Its average velocities on $[1, 1.1]$, $[1, 1.01]$ and $[1, 1.001]$ are $9.5$, $9.95$ and $9.995$ m/s. How fast is the ball moving at $t = 1$?'
            answer: '10'
            answer_contract: {"kind":"unit","quantity":"speed","unit":"m/s","allow_omitted":true}
            solution_sketch: 'The averages $9.5$, $9.95$ and $9.995$ rise toward $10$ as the interval shrinks. The ball moves at $10$ m/s when $t = 1$.'
          - problem: 'A tank holds $V(t) = 100 - t^2$ litres of water after $t$ minutes. Its average rates of change on $[4, 4.1]$ and $[4, 4.01]$ are $-8.1$ and $-8.01$ litres per minute. At what rate is the volume changing at $t = 4$?'
            answer: '-8'
            answer_contract: {"kind":"unit","quantity":"flow","unit":"L/min","allow_omitted":true}
            solution_sketch: 'The averages $-8.1$ and $-8.01$ approach $-8$ as the interval shrinks. The volume changes at $-8$ litres per minute, so the tank is draining at $t = 4$.'
        constraints: 'shrinking-interval tables or a pre-simplified average rate of change; integer limits; velocities and tank rates with units'
    diagnostic_exemplar:
      problem: 'For $f(x) = x^2$, evaluate $\lim_{h \to 0} \frac{f(3 + h) - f(3)}{h}$ by first simplifying the quotient.'
      answer: "6"
      solution_sketch: 'Expand and cancel the $h$ before taking the limit: $\frac{(3+h)^2 - 9}{h} = \frac{6h + h^2}{h} = 6 + h \to 6$.'
    anki_seeds:
      - front: "The average rate of change of f on [a, b] equals..."
        back: "(f(b) - f(a)) / (b - a) — the slope of the secant line"
        type: basic
      - front: "Geometrically, average rate of change is the slope of the ___ line; instantaneous rate is the slope of the ___ line."
        back: "secant; tangent"
        type: basic

  - id: difference-quotients
    name: Difference Quotients
    core: true
    difficulty: 0.52
    drill: false
    answer_kind: expression
    expected_time_secs: 120
    prerequisites:
      - id: function-notation
        weight: 0.6
        key: true
      - id: polynomial-multiplication
        weight: 0.5
        key: true
      - id: average-instantaneous-rate
        weight: 0.5
      - id: rational-expressions
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: Evaluate f(a + h)
        key_prerequisites: [function-notation, polynomial-multiplication]
        exemplars:
          - problem: 'For $f(x) = x^2 + 1$, expand and simplify $f(2 + h)$.'
            answer: 'h^2 + 4h + 5'
            answer_contract: {"kind":"required_form","form":"expanded_polynomial"}
            solution_sketch: 'Replace $x$ by $2 + h$ to get $(2 + h)^2 + 1 = 4 + 4h + h^2 + 1$. Collecting like terms gives $h^2 + 4h + 5$.'
          - problem: 'For $f(x) = 3x - 2$, expand and simplify $f(x + h)$.'
            answer: '3x + 3h - 2'
            answer_contract: {"kind":"required_form","form":"expanded_polynomial"}
            solution_sketch: 'Replace $x$ by $x + h$ to get $3(x + h) - 2$. Distributing the $3$ gives $3x + 3h - 2$.'
          - problem: 'For $f(x) = x^2 - 3x$, expand and simplify $f(4 + h)$.'
            answer: 'h^2 + 5h + 4'
            answer_contract: {"kind":"required_form","form":"expanded_polynomial"}
            solution_sketch: 'Substitute to get $(4 + h)^2 - 3(4 + h) = 16 + 8h + h^2 - 12 - 3h$. Combining like terms gives $h^2 + 5h + 4$.'
          - problem: 'A car''s position is $s(t) = t^2 + 2t$ metres after $t$ seconds. Expand and simplify its position $3 + h$ seconds after the start.'
            answer: 'h^2 + 8h + 15'
            answer_contract: {"kind":"required_form","form":"expanded_polynomial"}
            solution_sketch: 'Substitute $3 + h$ for $t$ to get $(3 + h)^2 + 2(3 + h) = 9 + 6h + h^2 + 6 + 2h$. Combining like terms gives $h^2 + 8h + 15$.'
          - problem: 'For $f(x) = 2x^2 + x$, expand and simplify $f(x + h)$.'
            answer: '2x^2 + 4xh + 2h^2 + x + h'
            answer_contract: {"kind":"required_form","form":"expanded_polynomial"}
            solution_sketch: 'Substitute to get $2(x + h)^2 + (x + h)$. Expanding $(x + h)^2 = x^2 + 2xh + h^2$ and doubling gives $2x^2 + 4xh + 2h^2 + x + h$.'
          - problem: 'A square garden has side $x$ metres. Its side is made $h$ metres longer. Expand and simplify the area of the new garden.'
            answer: 'x^2 + 2xh + h^2'
            answer_contract: {"kind":"required_form","form":"expanded_polynomial"}
            solution_sketch: 'The new side is $x + h$, so the new area is $(x + h)^2$. Expanding the square gives $x^2 + 2xh + h^2$.'
          - problem: 'For $f(x) = -x^2 + 4x$, expand and simplify $f(3 + h)$.'
            answer: '-h^2 - 2h + 3'
            answer_contract: {"kind":"required_form","form":"expanded_polynomial"}
            solution_sketch: 'Substitute to get $-(3 + h)^2 + 4(3 + h) = -9 - 6h - h^2 + 12 + 4h$. Combining like terms gives $-h^2 - 2h + 3$.'
          - problem: 'For $f(x) = x^2$, expand and simplify $f(-1 + h)$.'
            answer: 'h^2 - 2h + 1'
            answer_contract: {"kind":"required_form","form":"expanded_polynomial"}
            solution_sketch: 'Substitute to get $(-1 + h)^2 = 1 - 2h + h^2$. In descending powers this is $h^2 - 2h + 1$.'
          - problem: 'Sam says that for $f(x) = x^2$ we have $f(3 + h) = 9 + h^2$. What is the correct expanded form of $f(3 + h)$?'
            answer: 'h^2 + 6h + 9'
            answer_contract: {"kind":"required_form","form":"expanded_polynomial"}
            solution_sketch: 'Sam squared each term separately, but $(3 + h)^2$ has a middle term. The correct expression is $9 + 6h + h^2 = h^2 + 6h + 9$.'
        constraints: 'linear or quadratic f, or a position or area model; substitute a + h or x + h and expand fully'
      - id: kp2
        name: Simplify polynomial difference quotients
        key_prerequisites: [polynomial-multiplication, function-notation]
        exemplars:
          - problem: 'For $f(x) = x^2$, simplify $\frac{f(x + h) - f(x)}{h}$.'
            answer: '2x + h'
            answer_contract: {"kind":"required_form","form":"expanded_polynomial"}
            solution_sketch: 'The numerator is $(x + h)^2 - x^2 = 2xh + h^2$. Dividing by $h$ gives $2x + h$.'
          - problem: 'For $f(x) = 3x + 1$, simplify $\frac{f(x + h) - f(x)}{h}$.'
            answer: '3'
            answer_contract: {"kind":"function","vars":["x","h"]}
            solution_sketch: 'The numerator is $3(x + h) + 1 - (3x + 1) = 3h$. Dividing by $h$ leaves $3$, which does not depend on $x$ or $h$.'
          - problem: 'For $f(x) = x^2 - 4x$, simplify $\frac{f(x + h) - f(x)}{h}$.'
            answer: '2x + h - 4'
            answer_contract: {"kind":"required_form","form":"expanded_polynomial"}
            solution_sketch: 'The numerator is $(x + h)^2 - 4(x + h) - x^2 + 4x = 2xh + h^2 - 4h$. Dividing every term by $h$ gives $2x + h - 4$.'
          - problem: 'A ball''s height is $H(t) = 20t - 5t^2$ metres after $t$ seconds. Simplify its average velocity on $[t, t + h]$.'
            answer: '20 - 10t - 5h'
            answer_contract: {"kind":"required_form","form":"expanded_polynomial"}
            solution_sketch: 'The numerator is $20h - 5(2th + h^2) = 20h - 10th - 5h^2$. Dividing by $h$ gives $20 - 10t - 5h$.'
          - problem: 'For $f(x) = x^2 + 5x$, simplify $\frac{f(x + h) - f(x)}{h}$.'
            answer: '2x + h + 5'
            answer_contract: {"kind":"required_form","form":"expanded_polynomial"}
            solution_sketch: 'The numerator is $(x + h)^2 + 5(x + h) - x^2 - 5x = 2xh + h^2 + 5h$. Dividing by $h$ gives $2x + h + 5$.'
          - problem: 'The volume of a cube with side $x$ cm is $V(x) = x^3$ cubic centimetres. Simplify the average rate of change of $V$ as the side grows from $x$ to $x + h$.'
            answer: '3x^2 + 3xh + h^2'
            answer_contract: {"kind":"required_form","form":"expanded_polynomial"}
            solution_sketch: 'The numerator is $(x + h)^3 - x^3 = 3x^2h + 3xh^2 + h^3$. Dividing by $h$ gives $3x^2 + 3xh + h^2$.'
          - problem: 'For $f(x) = x^2 - 6x + 2$, simplify $\frac{f(x + h) - f(x)}{h}$.'
            answer: '2x + h - 6'
            answer_contract: {"kind":"required_form","form":"expanded_polynomial"}
            solution_sketch: 'The numerator is $(x + h)^2 - 6(x + h) + 2 - x^2 + 6x - 2 = 2xh + h^2 - 6h$. Dividing by $h$ gives $2x + h - 6$.'
          - problem: 'For $f(x) = 3x^2 + x$, simplify $\frac{f(x + h) - f(x)}{h}$.'
            answer: '6x + 3h + 1'
            answer_contract: {"kind":"required_form","form":"expanded_polynomial"}
            solution_sketch: 'The numerator is $3(x + h)^2 + (x + h) - 3x^2 - x = 6xh + 3h^2 + h$. Dividing by $h$ gives $6x + 3h + 1$.'
          - problem: 'Sam says that for $f(x) = x^2 + x$ the quotient $\frac{f(x + h) - f(x)}{h}$ simplifies to $h + 1$, because $(x + h)^2 = x^2 + h^2$. What is the correct simplification?'
            answer: '2x + h + 1'
            answer_contract: {"kind":"required_form","form":"expanded_polynomial"}
            solution_sketch: 'Sam left out the middle term of $(x + h)^2$. The numerator is $2xh + h^2 + h$, and dividing by $h$ gives $2x + h + 1$.'
        constraints: 'linear, quadratic or cubic f, or a physical model; the h in the denominator must cancel completely'
      - id: kp3
        name: Difference quotients of rational functions
        key_prerequisites: [rational-expressions, function-notation]
        exemplars:
          - problem: 'For $f(x) = \frac{1}{x}$, simplify $\frac{f(x + h) - f(x)}{h}$.'
            answer: '-1/(x(x + h))'
            answer_contract: {"kind":"function","vars":["x","h"]}
            solution_sketch: 'Combine the numerator: $\frac{1}{x + h} - \frac{1}{x} = \frac{x - (x + h)}{x(x + h)} = \frac{-h}{x(x + h)}$. Dividing by $h$ cancels the $h$ and leaves $-\frac{1}{x(x + h)}$.'
          - problem: 'For $f(x) = \frac{2}{x}$, simplify $\frac{f(x + h) - f(x)}{h}$.'
            answer: '-2/(x(x + h))'
            answer_contract: {"kind":"function","vars":["x","h"]}
            solution_sketch: 'The numerator is $\frac{2}{x + h} - \frac{2}{x} = \frac{-2h}{x(x + h)}$. Dividing by $h$ leaves $-\frac{2}{x(x + h)}$.'
          - problem: 'For $f(t) = \frac{4}{t}$, simplify $\frac{f(t + h) - f(t)}{h}$.'
            answer: '-4/(t(t + h))'
            answer_contract: {"kind":"function","vars":["t","h"]}
            solution_sketch: 'Over the common denominator $t(t + h)$ the numerator is $4t - 4(t + h) = -4h$. Dividing by $h$ cancels the $h$ and gives $-\frac{4}{t(t + h)}$.'
          - problem: 'For $f(x) = \frac{1}{x + 1}$, simplify $\frac{f(x + h) - f(x)}{h}$.'
            answer: '-1/((x + 1)(x + h + 1))'
            answer_contract: {"kind":"function","vars":["x","h"]}
            solution_sketch: 'The numerator is $\frac{1}{x + h + 1} - \frac{1}{x + 1} = \frac{(x + 1) - (x + h + 1)}{(x + h + 1)(x + 1)} = \frac{-h}{(x + h + 1)(x + 1)}$. Dividing by $h$ gives $-\frac{1}{(x + 1)(x + h + 1)}$.'
          - problem: 'For $f(x) = \frac{7}{x}$, simplify $\frac{f(2 + h) - f(2)}{h}$.'
            answer: '-7/(2(2 + h))'
            answer_contract: {"kind":"function","vars":["h"]}
            solution_sketch: 'The numerator is $\frac{7}{2 + h} - \frac{7}{2} = \frac{14 - 7(2 + h)}{2(2 + h)} = \frac{-7h}{2(2 + h)}$. Dividing by $h$ gives $-\frac{7}{2(2 + h)}$.'
          - problem: 'The intensity of a lamp at distance $d$ metres is $I(d) = \frac{9}{d}$ units. Simplify the average rate of change of $I$ as the distance goes from $d$ to $d + h$.'
            answer: '-9/(d(d + h))'
            answer_contract: {"kind":"function","vars":["d","h"]}
            solution_sketch: 'The numerator is $\frac{9}{d + h} - \frac{9}{d} = \frac{-9h}{d(d + h)}$. Dividing by $h$ gives $-\frac{9}{d(d + h)}$, which is negative because the light fades with distance.'
          - problem: 'A rectangle has area $12$ square centimetres and width $w$ cm, so its length is $L(w) = \frac{12}{w}$ cm. Simplify the average rate of change of $L$ as the width goes from $w$ to $w + h$.'
            answer: '-12/(w(w + h))'
            answer_contract: {"kind":"function","vars":["w","h"]}
            solution_sketch: 'The numerator is $\frac{12}{w + h} - \frac{12}{w} = \frac{-12h}{w(w + h)}$. Dividing by $h$ gives $-\frac{12}{w(w + h)}$, so the length shrinks as the width grows.'
          - problem: 'Sam subtracts the denominators and writes $\frac{3}{x + h} - \frac{3}{x} = \frac{3}{h}$. What is the correct simplification of $\frac{f(x + h) - f(x)}{h}$ for $f(x) = \frac{3}{x}$?'
            answer: '-3/(x(x + h))'
            answer_contract: {"kind":"function","vars":["x","h"]}
            solution_sketch: 'Fractions are subtracted over a common denominator, not by subtracting the denominators. The numerator is $\frac{3x - 3(x + h)}{x(x + h)} = \frac{-3h}{x(x + h)}$, and dividing by $h$ gives $-\frac{3}{x(x + h)}$.'
        constraints: 'f = c/x or c/(x + k) with a small integer c; combine over a common denominator before canceling h'
    diagnostic_exemplar:
      problem: 'For $f(x) = \frac{3}{x}$, simplify $\frac{f(x + h) - f(x)}{h}$.'
      answer: "-3/(x(x + h))"
      solution_sketch: 'Combine the numerator over a common denominator: $\frac{3}{x+h} - \frac{3}{x} = \frac{-3h}{x(x+h)}$; dividing by $h$ cancels it, leaving $-\frac{3}{x(x+h)}$.'
    anki_seeds:
      - front: "The difference quotient of f is..."
        back: "(f(x + h) - f(x)) / h — the average rate of change over [x, x + h]"
        type: basic
      - front: "A correctly simplified difference quotient never has ___ in the denominator."
        back: "a bare h (the h must cancel so h → 0 can later be taken)"
        type: basic

  - id: derivative-at-a-point
    name: The Derivative at a Point
    core: true
    difficulty: 0.55
    drill: false
    answer_kind: numeric
    expected_time_secs: 150
    prerequisites:
      - id: difference-quotients
        weight: 0.7
        key: true
      - id: average-instantaneous-rate
        weight: 0.6
        key: true
      - id: factoring-limits
        weight: 0.5
    knowledge_points:
      - id: kp1
        name: Compute f'(a) from the h → 0 definition
        key_prerequisites: [difference-quotients, average-instantaneous-rate]
        exemplars:
          - problem: 'Use the definition $f''(a) = \lim_{h \to 0} \frac{f(a + h) - f(a)}{h}$ to find $f''(3)$ for $f(x) = x^2$.'
            answer: '6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The quotient is $\frac{(3 + h)^2 - 9}{h} = \frac{6h + h^2}{h} = 6 + h$. As $h$ approaches $0$, this approaches $6$, so $f''(3) = 6$.'
          - problem: 'Use the definition to find $f''(2)$ for $f(x) = 3x^2$.'
            answer: '12'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The quotient is $\frac{3(2 + h)^2 - 12}{h} = \frac{12h + 3h^2}{h} = 12 + 3h$. As $h$ approaches $0$, this approaches $12$.'
          - problem: 'Use the definition to find $f''(2)$ for $f(x) = x^2 - 5x$.'
            answer: '-1'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Since $f(2) = -6$, the quotient is $\frac{(2 + h)^2 - 5(2 + h) + 6}{h} = \frac{-h + h^2}{h} = -1 + h$. As $h$ approaches $0$, this approaches $-1$.'
          - problem: 'A toy car''s position is $s(t) = 6t - 3t^2$ metres after $t$ seconds. Use the limit definition to find its instantaneous velocity at $t = 2$.'
            answer: '-6'
            answer_contract: {"kind":"unit","quantity":"speed","unit":"m/s","allow_omitted":true}
            solution_sketch: 'Since $s(2) = 0$, the quotient is $\frac{6(2 + h) - 3(2 + h)^2}{h} = \frac{-6h - 3h^2}{h} = -6 - 3h$. As $h$ approaches $0$, the velocity is $-6$ m/s, so the car moves backwards.'
          - problem: 'Use the definition to find $f''(1)$ for $f(x) = x^2 + 2x$.'
            answer: '4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Since $f(1) = 3$, the quotient is $\frac{(1 + h)^2 + 2(1 + h) - 3}{h} = \frac{4h + h^2}{h} = 4 + h$. As $h$ approaches $0$, this approaches $4$.'
          - problem: 'A stone''s height is $H(t) = 20t - 5t^2$ metres after $t$ seconds. Use the limit definition to find its velocity at $t = 3$.'
            answer: '-10'
            answer_contract: {"kind":"unit","quantity":"speed","unit":"m/s","allow_omitted":true}
            solution_sketch: 'Since $H(3) = 15$, the quotient is $\frac{20(3 + h) - 5(3 + h)^2 - 15}{h} = \frac{-10h - 5h^2}{h} = -10 - 5h$. As $h$ approaches $0$, the velocity is $-10$ m/s, so the stone is falling.'
          - problem: 'Use the definition to find $f''(2)$ for $f(x) = 2x^2 - 3x$.'
            answer: '5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Since $f(2) = 2$, the quotient is $\frac{2(2 + h)^2 - 3(2 + h) - 2}{h} = \frac{5h + 2h^2}{h} = 5 + 2h$. As $h$ approaches $0$, this approaches $5$.'
          - problem: 'Use the definition to find $f''(-2)$ for $f(x) = x^2 + x$.'
            answer: '-3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Since $f(-2) = 2$, the quotient is $\frac{(-2 + h)^2 + (-2 + h) - 2}{h} = \frac{-3h + h^2}{h} = -3 + h$. As $h$ approaches $0$, this approaches $-3$.'
          - problem: 'Sam estimates $f''(3)$ for $f(x) = x^2$ by working out $\frac{f(3.1) - f(3)}{0.1} = 6.1$, and writes $f''(3) = 6.1$. What is the exact value of $f''(3)$?'
            answer: '6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The value $6.1$ is the average rate of change on $[3, 3.1]$, which is $6 + h$ with $h = 0.1$. The derivative is the limit as $h$ approaches $0$, which is $6$.'
        constraints: 'quadratic f with small integer coefficients, or a position model; the difference quotient must cancel cleanly'
      - id: kp2
        name: The alternative form lim_{x → a}
        key_prerequisites: [factoring-limits, difference-quotients]
        exemplars:
          - problem: 'Use $f''(a) = \lim_{x \to a} \frac{f(x) - f(a)}{x - a}$ to find $f''(4)$ for $f(x) = x^2$.'
            answer: '8'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The quotient is $\frac{x^2 - 16}{x - 4} = x + 4$ for $x \neq 4$. As $x$ approaches $4$, this approaches $8$.'
          - problem: 'Use the alternative form to find $f''(1)$ for $f(x) = x^3$.'
            answer: '3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The quotient is $\frac{x^3 - 1}{x - 1} = x^2 + x + 1$ for $x \neq 1$. As $x$ approaches $1$, this approaches $3$.'
          - problem: 'Use $f''(a) = \lim_{x \to a} \frac{f(x) - f(a)}{x - a}$ to find $f''(3)$ for $f(x) = x^2 + 4x$.'
            answer: '10'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Since $f(3) = 21$, the quotient is $\frac{x^2 + 4x - 21}{x - 3} = \frac{(x - 3)(x + 7)}{x - 3} = x + 7$. As $x$ approaches $3$, this approaches $10$.'
          - problem: 'Use the alternative form to find $f''(2)$ for $f(x) = x^3$.'
            answer: '12'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Since $f(2) = 8$, the quotient is $\frac{x^3 - 8}{x - 2} = x^2 + 2x + 4$ for $x \neq 2$. As $x$ approaches $2$, this approaches $12$.'
          - problem: 'A particle''s position is $s(t) = t^2 + 2t$ metres after $t$ seconds. Use $s''(3) = \lim_{t \to 3} \frac{s(t) - s(3)}{t - 3}$ to find its instantaneous velocity at $t = 3$.'
            answer: '8'
            answer_contract: {"kind":"unit","quantity":"speed","unit":"m/s","allow_omitted":true}
            solution_sketch: 'Since $s(3) = 15$, the quotient is $\frac{t^2 + 2t - 15}{t - 3} = \frac{(t - 3)(t + 5)}{t - 3} = t + 5$. As $t$ approaches $3$, the velocity approaches $8$ m/s.'
          - problem: 'For $f(x) = x^2$, use the alternative form to find $f''(-3)$.'
            answer: '-6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Here $a = -3$ and $f(-3) = 9$, so the quotient is $\frac{x^2 - 9}{x + 3} = x - 3$ for $x \neq -3$. As $x$ approaches $-3$, this approaches $-6$.'
          - problem: 'For $f(x) = \frac{1}{x}$, use the alternative form to find $f''(2)$.'
            answer: '-1/4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Since $f(2) = \frac{1}{2}$, the quotient is $\frac{\frac{1}{x} - \frac{1}{2}}{x - 2} = \frac{2 - x}{2x(x - 2)} = -\frac{1}{2x}$. As $x$ approaches $2$, this approaches $-\frac{1}{4}$.'
          - problem: 'For $f(x) = \sqrt{x}$, use the alternative form to find $f''(4)$.'
            answer: '1/4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Since $f(4) = 2$, the quotient is $\frac{\sqrt{x} - 2}{x - 4} = \frac{\sqrt{x} - 2}{(\sqrt{x} - 2)(\sqrt{x} + 2)} = \frac{1}{\sqrt{x} + 2}$. As $x$ approaches $4$, this approaches $\frac{1}{4}$.'
          - problem: 'A cube has side length $x$ cm and volume $V(x) = x^3$ cubic centimetres. Use the alternative form to find how fast $V$ changes with respect to $x$ when $x = 5$, in cubic centimetres per centimetre.'
            answer: '75'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Since $V(5) = 125$, the quotient is $\frac{x^3 - 125}{x - 5} = x^2 + 5x + 25$ for $x \neq 5$. As $x$ approaches $5$, this approaches $75$.'
        constraints: 'factorable numerators (difference of squares or cubes), simple reciprocals, square roots; answers are integers or simple fractions'
      - id: kp3
        name: Interpret f'(a)
        key_prerequisites: [average-instantaneous-rate]
        exemplars:
          - problem: 'The limit $\lim_{h \to 0} \frac{f(4 + h) - f(4)}{h}$ equals $12$. What is the slope of the tangent line to $y = f(x)$ at $x = 4$?'
            answer: '12'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The limit is $f''(4)$, and $f''(4)$ is the slope of the tangent line at $x = 4$. The slope is $12$.'
          - problem: 'A particle''s position is $s(t)$ metres after $t$ seconds, and $s''(3) = 6$. What is its instantaneous velocity at $t = 3$?'
            answer: '6'
            answer_contract: {"kind":"unit","quantity":"speed","unit":"m/s","allow_omitted":true}
            solution_sketch: 'The derivative of position is the instantaneous velocity. So the particle moves at $6$ m/s when $t = 3$.'
          - problem: 'The graph of $y = f(x)$ has a tangent line at $x = 3$ whose slope is $7$. What is $f''(3)$?'
            answer: '7'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The value $f''(3)$ is the slope of the tangent line at $x = 3$. The given tangent has slope $7$, so $f''(3) = 7$.'
          - problem: 'The volume of water in a tank is $V(t)$ litres after $t$ minutes, and $V''(8) = -3$. At what rate is the volume changing at $t = 8$?'
            answer: '-3'
            answer_contract: {"kind":"unit","quantity":"flow","unit":"L/min","allow_omitted":true}
            solution_sketch: 'The derivative $V''(8)$ is the instantaneous rate of change of the volume with respect to time. It equals $-3$ litres per minute.'
          - problem: 'The volume of water in a tank is $V(t)$ litres after $t$ minutes, and $V''(8) = -3$. Is the tank filling or emptying at $t = 8$?'
            answer: 'emptying'
            answer_contract: {"kind":"label","options":[["emptying","draining","it is emptying","decreasing","losing water"],["filling","it is filling","increasing","gaining water"]]}
            solution_sketch: 'The derivative $V''(8) = -3$ is negative, so the volume is decreasing at $t = 8$. The tank is emptying at $3$ litres per minute.'
          - problem: 'The line $y = 4x - 1$ is tangent to the graph of $y = g(x)$ at $x = 2$. Find $g''(2)$.'
            answer: '4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The value $g''(2)$ is the slope of the tangent line at $x = 2$. The line $y = 4x - 1$ has slope $4$, so $g''(2) = 4$.'
          - problem: 'The distance a train has travelled is $s(t)$ kilometres after $t$ hours. The limit $\lim_{h \to 0} \frac{s(5 + h) - s(5)}{h}$ equals $-4$. What is the train''s instantaneous velocity at $t = 5$?'
            answer: '-4'
            answer_contract: {"kind":"unit","quantity":"speed","unit":"km/h","allow_omitted":true}
            solution_sketch: 'The limit is $s''(5)$, the instantaneous velocity at $t = 5$. It equals $-4$ km/h, so the train moves in the negative direction at $4$ km/h.'
          - problem: 'The temperature of a room is $T(t)$ degrees Celsius after $t$ hours, and $T''(2) = 1.5$. Is the temperature rising or falling at $t = 2$?'
            answer: 'rising'
            answer_contract: {"kind":"label","options":[["rising","it is rising","increasing","getting warmer"],["falling","it is falling","decreasing","getting colder"]]}
            solution_sketch: 'The derivative $T''(2) = 1.5$ is positive, so the temperature is increasing at $t = 2$. It rises at $1.5$ degrees per hour.'
          - problem: 'The line $y = 4x - 1$ is tangent to the graph of $y = g(x)$ at $x = 2$. Find $g(2)$.'
            answer: '7'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The tangent line touches the graph at $x = 2$, so $g(2)$ equals the height of the line there. It is $4 \cdot 2 - 1 = 7$.'
        constraints: 'tie the derivative value to a tangent slope or an instantaneous rate with units; direction of change from the sign'
    diagnostic_exemplar:
      problem: 'A particle''s position is $s(t) = t^2 - 5t$ metres at time $t$ seconds. Use the limit definition of the derivative to find its instantaneous velocity at $t = 4$, in m/s.'
      answer: '3'
      solution_sketch: '$\frac{s(4+h) - s(4)}{h} = \frac{(h^2 + 3h - 4) - (-4)}{h} = h + 3 \to 3$, so the velocity at $t = 4$ is $3$ m/s.'
    anki_seeds:
      - front: "The derivative at a point: f'(a) = ? (two equivalent limit forms)"
        back: "lim_{h→0} (f(a+h) - f(a))/h = lim_{x→a} (f(x) - f(a))/(x - a)"
        type: basic
      - front: "f'(a) is simultaneously the slope of ___ and the instantaneous ___."
        back: "the tangent line at x = a; rate of change of f at a"
        type: basic

  - id: derivative-definition
    name: The Limit Definition of the Derivative
    core: true
    difficulty: 0.6
    drill: false
    answer_kind: expression
    expected_time_secs: 210
    prerequisites:
      - id: derivative-at-a-point
        weight: 0.8
        key: true
      - id: limits-algebraic
        weight: 0.7
        key: true
      - id: limit-laws
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: Derive f'(x) for polynomials
        key_prerequisites: [derivative-at-a-point, limits-algebraic]
        exemplars:
          - problem: 'Use the limit definition to find $f''(x)$ for $f(x) = x^2$.'
            answer: '2x'
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'The quotient is $\frac{(x + h)^2 - x^2}{h} = \frac{2xh + h^2}{h} = 2x + h$. As $h$ approaches $0$, this approaches $2x$.'
          - problem: 'Use the limit definition to find $f''(x)$ for $f(x) = x^3$.'
            answer: '3x^2'
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'The quotient is $\frac{(x + h)^3 - x^3}{h} = 3x^2 + 3xh + h^2$. As $h$ approaches $0$, this approaches $3x^2$.'
          - problem: 'Use the limit definition to find $f''(x)$ for $f(x) = 2x^2 - 3x$.'
            answer: '4x - 3'
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'The numerator is $2(x + h)^2 - 3(x + h) - 2x^2 + 3x = 4xh + 2h^2 - 3h$, so the quotient is $4x + 2h - 3$. As $h$ approaches $0$, this approaches $4x - 3$.'
          - problem: 'A ball''s height is $H(t) = 20t - 5t^2$ metres after $t$ seconds. Use the limit definition to find its velocity function $H''(t)$.'
            answer: '20 - 10t'
            answer_contract: {"kind":"function","vars":["t"]}
            solution_sketch: 'The numerator is $20h - 5(2th + h^2)$, so the quotient is $20 - 10t - 5h$. As $h$ approaches $0$, this approaches $20 - 10t$ metres per second.'
          - problem: 'Use the limit definition to find $f''(x)$ for $f(x) = x^2 + 5x$.'
            answer: '2x + 5'
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'The numerator is $(x + h)^2 + 5(x + h) - x^2 - 5x = 2xh + h^2 + 5h$, so the quotient is $2x + h + 5$. As $h$ approaches $0$, this approaches $2x + 5$.'
          - problem: 'The cost of making $q$ items is $C(q) = 0.5q^2 + 4q$ dollars. Use the limit definition to find $C''(q)$.'
            answer: 'q + 4'
            answer_contract: {"kind":"function","vars":["q"]}
            solution_sketch: 'The numerator is $0.5(2qh + h^2) + 4h$, so the quotient is $q + 0.5h + 4$. As $h$ approaches $0$, this approaches $q + 4$ dollars per item.'
          - problem: 'Use the limit definition to find $f''(x)$ for $f(x) = 3x^2 + 2x - 1$.'
            answer: '6x + 2'
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'The numerator is $6xh + 3h^2 + 2h$, because the constant $-1$ cancels. The quotient is $6x + 3h + 2$, which approaches $6x + 2$ as $h$ approaches $0$.'
          - problem: 'Use the limit definition to find $f''(x)$ for $f(x) = x^3 - x$.'
            answer: '3x^2 - 1'
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'The numerator is $3x^2h + 3xh^2 + h^3 - h$, so the quotient is $3x^2 + 3xh + h^2 - 1$. As $h$ approaches $0$, this approaches $3x^2 - 1$.'
          - problem: 'Sam uses the definition for $f(x) = 4x^2 + 3$ and gets the quotient $8x + 4h$. He then writes $f''(x) = 8x + 4h$. What is the correct $f''(x)$?'
            answer: '8x'
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'Sam forgot the last step. As $h$ approaches $0$, the term $4h$ vanishes, so the derivative is $8x$, which no longer contains $h$.'
        constraints: 'degree at most 3 with small integer coefficients, or a physical model; require the full limit computation, not a rule'
      - id: kp2
        name: Derive f'(x) for rational and radical functions
        key_prerequisites: [limits-algebraic]
        exemplars:
          - problem: 'Use the limit definition to find $f''(x)$ for $f(x) = \frac{1}{x}$.'
            answer: '-1/x^2'
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'The numerator is $\frac{1}{x + h} - \frac{1}{x} = \frac{-h}{x(x + h)}$, so the quotient is $\frac{-1}{x(x + h)}$. As $h$ approaches $0$, this approaches $-\frac{1}{x^2}$.'
          - problem: 'Use the limit definition to find $f''(x)$ for $f(x) = \sqrt{x}$.'
            answer: '1/(2sqrt(x))'
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'Multiply the top and bottom by $\sqrt{x + h} + \sqrt{x}$ to get $\frac{h}{h(\sqrt{x + h} + \sqrt{x})} = \frac{1}{\sqrt{x + h} + \sqrt{x}}$. As $h$ approaches $0$, this approaches $\frac{1}{2\sqrt{x}}$.'
          - problem: 'Use the limit definition to find $f''(x)$ for $f(x) = \frac{1}{x + 1}$.'
            answer: '-1/(x + 1)^2'
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'The numerator is $\frac{1}{x + h + 1} - \frac{1}{x + 1} = \frac{-h}{(x + h + 1)(x + 1)}$, so the quotient is $\frac{-1}{(x + h + 1)(x + 1)}$. As $h$ approaches $0$, this approaches $-\frac{1}{(x + 1)^2}$.'
          - problem: 'Use the limit definition to find $f''(x)$ for $f(x) = \frac{1}{x + 3}$.'
            answer: '-1/(x + 3)^2'
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'The numerator is $\frac{-h}{(x + h + 3)(x + 3)}$, so the quotient is $\frac{-1}{(x + h + 3)(x + 3)}$. As $h$ approaches $0$, the denominator approaches $(x + 3)^2$, giving $-\frac{1}{(x + 3)^2}$.'
          - problem: 'The pressure of a gas is $P(v) = \frac{12}{v}$ kilopascals when its volume is $v$ litres. Use the limit definition to find $P''(v)$.'
            answer: '-12/v^2'
            answer_contract: {"kind":"function","vars":["v"]}
            solution_sketch: 'The numerator is $\frac{12}{v + h} - \frac{12}{v} = \frac{-12h}{v(v + h)}$, so the quotient is $\frac{-12}{v(v + h)}$. As $h$ approaches $0$, this approaches $-\frac{12}{v^2}$, which is negative because the pressure falls as the volume grows.'
          - problem: 'Use the limit definition to find $f''(x)$ for $f(x) = \frac{1}{x - 4}$.'
            answer: '-1/(x - 4)^2'
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'The numerator is $\frac{-h}{(x + h - 4)(x - 4)}$, so the quotient is $\frac{-1}{(x + h - 4)(x - 4)}$. As $h$ approaches $0$, this approaches $-\frac{1}{(x - 4)^2}$.'
          - problem: 'The side of a square of area $A$ square metres is $s(A) = \sqrt{A}$ metres. Use the limit definition to find $s''(A)$.'
            answer: '1/(2sqrt(A))'
            answer_contract: {"kind":"function","vars":["A"]}
            solution_sketch: 'Multiply the top and bottom by $\sqrt{A + h} + \sqrt{A}$ to get $\frac{1}{\sqrt{A + h} + \sqrt{A}}$. As $h$ approaches $0$, this approaches $\frac{1}{2\sqrt{A}}$ metres per square metre.'
          - problem: 'Use the limit definition to find $f''(x)$ for $f(x) = \sqrt{x + 1}$.'
            answer: '1/(2sqrt(x + 1))'
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'Multiply the top and bottom by $\sqrt{x + h + 1} + \sqrt{x + 1}$ to get $\frac{1}{\sqrt{x + h + 1} + \sqrt{x + 1}}$. As $h$ approaches $0$, this approaches $\frac{1}{2\sqrt{x + 1}}$.'
          - problem: 'Sam works out the limit definition for $f(x) = \frac{2}{x}$ and gets $\frac{2}{x^2}$. What is the correct $f''(x)$?'
            answer: '-2/x^2'
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'Sam lost the minus sign. The numerator is $\frac{2}{x + h} - \frac{2}{x} = \frac{-2h}{x(x + h)}$, so the limit is $-\frac{2}{x^2}$.'
        constraints: 'f is c/x, 1/(x + c), sqrt(x) or sqrt(x + c); combine fractions or rationalize before letting h approach 0'
      - id: kp3
        name: Use the derived derivative function
        key_prerequisites: [derivative-at-a-point]
        exemplars:
          - problem: 'For $f(x) = x^2$, we have $f''(x) = 2x$. Find the slope of the tangent line at $x = -3$.'
            answer: '-6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The slope is $f''(-3) = 2 \cdot (-3) = -6$. The tangent line goes downward at $x = -3$.'
          - problem: 'For $f(x) = x^2 - 6x$, we have $f''(x) = 2x - 6$. At which $x$ is the tangent line horizontal?'
            answer: '3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'A horizontal tangent has slope $0$, so set $f''(x) = 0$. Then $2x - 6 = 0$ gives $x = 3$.'
          - problem: 'For $f(x) = x^3$, we have $f''(x) = 3x^2$. Find the slope of the tangent line at $x = -2$.'
            answer: '12'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The slope is $f''(-2) = 3(-2)^2 = 3 \cdot 4 = 12$. The tangent line rises steeply there.'
          - problem: 'A ball''s height is $H(t) = 20t - 5t^2$ metres after $t$ seconds, and $H''(t) = 20 - 10t$. What is its velocity at $t = 3$?'
            answer: '-10'
            answer_contract: {"kind":"unit","quantity":"speed","unit":"m/s","allow_omitted":true}
            solution_sketch: 'The velocity is $H''(3) = 20 - 10 \cdot 3 = -10$ m/s. The minus sign shows that the ball is moving down.'
          - problem: 'For $f(x) = x^2 + 3x$, we have $f''(x) = 2x + 3$. At which $x$ is the slope of the tangent line equal to $7$?'
            answer: '2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Set $f''(x) = 7$ to get $2x + 3 = 7$. Subtracting $3$ and dividing by $2$ gives $x = 2$.'
          - problem: 'A ball''s height is $H(t) = 20t - 5t^2$ metres after $t$ seconds, and $H''(t) = 20 - 10t$. After how many seconds does the ball reach its highest point?'
            answer: '2'
            answer_contract: {"kind":"unit","quantity":"time","unit":"s","allow_omitted":true}
            solution_sketch: 'At the highest point the ball stops rising, so its velocity is $0$. Setting $20 - 10t = 0$ gives $t = 2$ seconds.'
          - problem: 'For $f(x) = x^3$, we have $f''(x) = 3x^2$. At which values of $x$ is the slope of the tangent line equal to $12$?'
            answer: '-2, 2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Set $3x^2 = 12$ to get $x^2 = 4$. So $x = 2$ or $x = -2$, and the graph has two tangent lines of slope $12$.'
          - problem: 'For $f(x) = \frac{1}{x}$, we have $f''(x) = -\frac{1}{x^2}$. Find the slope of the tangent line at $x = 2$.'
            answer: '-1/4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The slope is $f''(2) = -\frac{1}{2^2} = -\frac{1}{4}$. The graph falls gently at $x = 2$.'
          - problem: 'The cost of making $q$ items is $C(q) = 0.5q^2 + 4q$ dollars, and $C''(q) = q + 4$ dollars per item. At which production level $q$ does the cost grow by $10$ dollars for each extra item, that is $C''(q) = 10$?'
            answer: '6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Set $q + 4 = 10$. Subtracting $4$ gives $q = 6$ items.'
          - problem: 'For $f(x) = x^2$, we have $f''(x) = 2x$. At which point of the graph is the tangent line''s slope equal to $10$?'
            answer: '(5, 25)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'Set $2x = 10$ to get $x = 5$. The point on the graph is $(5, f(5)) = (5, 25)$.'
        constraints: 'evaluate or solve with a derivative already derived in this lesson; slopes at points, horizontal tangents, motion and cost models'
    diagnostic_exemplar:
      problem: 'Use the limit definition to find $f''(x)$ for $f(x) = \frac{1}{x + 2}$.'
      answer: "-1/(x + 2)^2"
      solution_sketch: '$\frac{1}{h}\left(\frac{1}{x+h+2} - \frac{1}{x+2}\right) = \frac{-h}{h(x+h+2)(x+2)} \to -\frac{1}{(x+2)^2}$.'
    anki_seeds:
      - front: "The limit definition of the derivative: f'(x) = ?"
        back: "lim_{h→0} (f(x + h) - f(x)) / h"
        type: basic
      - front: "Differentiable at a implies continuous at a. Is the converse true?"
        back: "No — e.g. f(x) = |x| is continuous at 0 but not differentiable there (corner)"
        type: basic

  - id: estimating-derivatives
    name: Estimating Derivatives from Tables and Graphs
    core: false                # terminal numerical-estimation genre
    difficulty: 0.52
    drill: false
    answer_kind: numeric
    expected_time_secs: 90
    prerequisites:
      - id: derivative-at-a-point
        weight: 0.7
        key: true
      - id: slope-from-a-graph
        weight: 0.5
        key: true
      - id: average-instantaneous-rate
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: Symmetric difference estimates from a table
        key_prerequisites: [derivative-at-a-point, average-instantaneous-rate]
        try_first:
          problem: 'A skateboarder''s position is $x(t)$ metres after $t$ seconds, with $x(2.9) = 12.4$ and $x(3.1) = 13.6$. About how fast, in metres per second, is she moving at $t = 3$?'
          answer_contract: {"kind":"exact"}
          answer: '6'
          reveal: 'Dividing the change in position by the change in time over a short interval on both sides of $t = 3$ gives the speed at that moment. A derivative is estimated in the same way from a table.'
        constraints: 'symmetric points a - h and a + h (h = 0.1 in most items, h = 1 in one); the quotient is a number a learner computes by hand'
        exemplars:
          - problem: 'A table gives $f(1.9) = 3.61$, $f(2) = 4$ and $f(2.1) = 4.41$. Estimate $f''(2)$ using the values at $1.9$ and $2.1$.'
            answer: '4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The point $2$ lies halfway between $1.9$ and $2.1$, so the symmetric difference quotient applies. It gives $\frac{4.41 - 3.61}{2.1 - 1.9} = \frac{0.8}{0.2} = 4$, so $f''(2) \approx 4$.'
          - problem: 'A table gives $f(2.9) = 8.41$ and $f(3.1) = 9.61$. Estimate $f''(3)$.'
            answer: '6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The point $3$ lies halfway between $2.9$ and $3.1$, so the symmetric difference quotient applies. It gives $\frac{9.61 - 8.41}{3.1 - 2.9} = \frac{1.2}{0.2} = 6$, so $f''(3) \approx 6$.'
          - problem: 'A car''s position is $s(t)$ kilometres after $t$ hours. A log shows $s(2.9) = 161.7$ and $s(3.1) = 172.5$. Estimate the car''s speed at $t = 3$.'
            answer: '54'
            answer_contract: {"kind":"unit","quantity":"speed","unit":"km/h","allow_omitted":true}
            solution_sketch: 'The speed at $t = 3$ is the derivative $s''(3)$, and $3$ lies halfway between $2.9$ and $3.1$. The estimate is $\frac{172.5 - 161.7}{3.1 - 2.9} = \frac{10.8}{0.2} = 54$ kilometres per hour.'
          - problem: 'The population of a town is $P(t)$ thousand people, $t$ years after 2000. A census table gives $P(4.9) = 20.4$ and $P(5.1) = 21.0$. At about what rate, in thousands of people per year, is the population changing at $t = 5$?'
            answer: '3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The rate at $t = 5$ is $P''(5)$, estimated from the two values on either side of $5$. It is $\frac{21.0 - 20.4}{5.1 - 4.9} = \frac{0.6}{0.2} = 3$ thousand people per year.'
          - problem: 'A table gives $f(3.9) = 20$, and $f(4.1)$ is missing. The symmetric difference estimate of $f''(4)$ is $5$. Find $f(4.1)$.'
            answer: '21'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The estimate satisfies $\frac{f(4.1) - 20}{4.1 - 3.9} = 5$. Multiply both sides by $0.2$ to get $f(4.1) - 20 = 1$. Then $f(4.1) = 21$.'
          - problem: 'A thermometer reading is $T(t)$ degrees Fahrenheit, $t$ hours after midnight. A table gives $T(6.9) = 70.0$ and $T(7.1) = 70.4$. At about what rate, in degrees per hour, is the temperature changing at $t = 7$?'
            answer: '2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The rate at $t = 7$ is $T''(7)$, estimated from the readings on either side of $7$. It is $\frac{70.4 - 70.0}{7.1 - 6.9} = \frac{0.4}{0.2} = 2$ degrees per hour.'
          - problem: 'A tank holds $V(t)$ litres of water $t$ minutes after a valve opens. A table gives $V(9.9) = 412.6$ and $V(10.1) = 410.2$. At about what rate, in litres per minute, is the volume changing at $t = 10$?'
            answer: '-12'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The rate at $t = 10$ is $V''(10)$, estimated from the values on either side of $10$. It is $\frac{410.2 - 412.6}{10.1 - 9.9} = \frac{-2.4}{0.2} = -12$ litres per minute, so the tank is losing water.'
          - problem: 'A table gives $g(1) = 2$, $g(2) = 5$ and $g(3) = 12$. Estimate $g''(2)$ using the values at $1$ and $3$.'
            answer: '5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The point $2$ lies halfway between $1$ and $3$, and the gap between them is $2$. The estimate is $\frac{g(3) - g(1)}{3 - 1} = \frac{12 - 2}{2} = 5$.'
          - problem: 'Sam estimates $f''(1)$ from the table $f(0.9) = 0.81$, $f(1) = 1$, $f(1.1) = 1.21$ by computing $\frac{1.21 - 1}{0.1} = 2.1$. What estimate do the values on both sides, at $0.9$ and $1.1$, give?'
            answer: '2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Sam uses only one side of $1$. The estimate from both sides is $\frac{1.21 - 0.81}{1.1 - 0.9} = \frac{0.4}{0.2} = 2$.'
      - id: kp2
        name: Estimate the derivative from a graph
        key_prerequisites: [slope-from-a-graph, derivative-at-a-point]
        constraints: 'tangent line through two lattice points, or a horizontal tangent; integer slopes; measured contexts name the unit of the rate'
        exemplars:
          - problem: 'The tangent line to $y = f(x)$ at $x = 2$ appears to pass through $(1, 2)$ and $(3, 8)$. Estimate $f''(2)$.'
            answer: '3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The derivative $f''(2)$ is the slope of the tangent line at $x = 2$. The slope through $(1, 2)$ and $(3, 8)$ is $\frac{8 - 2}{3 - 1} = \frac{6}{2} = 3$.'
          - problem: 'The graph of $f$ has a horizontal tangent line at $x = 5$. What is $f''(5)$?'
            answer: '0'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The derivative $f''(5)$ is the slope of the tangent line at $x = 5$. A horizontal line has slope $0$, so $f''(5) = 0$.'
          - problem: 'The line tangent to the graph of $y = f(x)$ at $x = 3$ passes through $(2, 6)$ and $(4, 2)$. What is $f''(3)$?'
            answer: '-2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The derivative $f''(3)$ is the slope of the tangent line. The slope through $(2, 6)$ and $(4, 2)$ is $\frac{2 - 6}{4 - 2} = \frac{-4}{2} = -2$.'
          - problem: 'A hiker''s height above sea level is $h(t)$ metres after $t$ minutes. The tangent to the graph of $h$ at $t = 4$ passes through $(2, 30)$ and $(6, 50)$. How fast is the hiker climbing at $t = 4$, in metres per minute?'
            answer: '5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The rate at $t = 4$ is $h''(4)$, the slope of the tangent. The slope through $(2, 30)$ and $(6, 50)$ is $\frac{50 - 30}{6 - 2} = \frac{20}{4} = 5$ metres per minute.'
          - problem: 'The tangent to $y = f(x)$ at $x = -1$ goes through $(-2, 7)$ and $(0, -1)$. Determine $f''(-1)$.'
            answer: '-4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The derivative $f''(-1)$ is the slope of the tangent line. The slope through $(-2, 7)$ and $(0, -1)$ is $\frac{-1 - 7}{0 - (-2)} = \frac{-8}{2} = -4$.'
          - problem: 'The graph of $V(t)$, the litres of water in a tank after $t$ minutes, has a tangent line at $t = 5$ through $(3, 90)$ and $(7, 50)$. At what rate is the volume changing at $t = 5$, in litres per minute?'
            answer: '-10'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The rate at $t = 5$ is $V''(5)$, the slope of the tangent. The slope through $(3, 90)$ and $(7, 50)$ is $\frac{50 - 90}{7 - 3} = \frac{-40}{4} = -10$ litres per minute.'
          - problem: 'Leo reads the tangent line to $y = f(x)$ at $x = 1$ through $(0, 1)$ and $(2, 5)$ and writes $f''(1) = \frac{2 - 0}{5 - 1} = \frac{1}{2}$. What is the correct value of $f''(1)$?'
            answer: '2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Leo divided the run by the rise. Slope is the rise divided by the run, so $f''(1) = \frac{5 - 1}{2 - 0} = \frac{4}{2} = 2$.'
      - id: kp3
        name: Sign and units of the derivative
        key_prerequisites: [derivative-at-a-point, average-instantaneous-rate]
        constraints: 'connect increasing and decreasing to the sign of the derivative; the unit of f'' is (output unit) per (input unit); rates read as speeds, changes per unit, or the input needed for a given change'
        exemplars:
          - problem: '$s(t)$ is a car''s position in kilometres after $t$ hours, and $s''(2) = 60$. How fast is the car moving at $t = 2$?'
            answer: '60'
            answer_contract: {"kind":"unit","quantity":"speed","unit":"km/h","allow_omitted":true}
            solution_sketch: 'The derivative of position is speed, and the units of $s''$ are kilometres per hour. So at $t = 2$ the car moves at $60$ kilometres per hour.'
          - problem: '$f$ is increasing near $x = 2$. Is $f''(2)$ positive or negative?'
            answer: 'positive'
            answer_contract: {"kind":"label","options":[["positive","it is positive","positive number"],["negative","it is negative","negative number"]]}
            solution_sketch: 'An increasing function has tangent lines that slope upward. Their slope is positive, so $f''(2)$ is positive.'
          - problem: 'Water drains from a tank. At $t = 3$ the volume $V(t)$ in litres is falling by $8$ litres every minute. What is $V''(3)$, in litres per minute?'
            answer: '-8'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The derivative is the rate of change of volume with respect to time, in litres per minute. The volume is falling, so the rate is negative, and $V''(3) = -8$.'
          - problem: 'The temperature $T(t)$ in degrees is measured $t$ hours after noon, and $T''(4) = 1.5$. About how many degrees does the temperature change in the hour after $t = 4$?'
            answer: '1.5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The units of $T''$ are degrees per hour, so $T''(4) = 1.5$ means the temperature changes at $1.5$ degrees per hour near $t = 4$. Over one hour the change is about $1.5$ degrees.'
          - problem: 'A table gives $f(0.9) = 3.2$ and $f(1.1) = 2.8$. Is $f''(1)$ positive or negative?'
            answer: 'negative'
            answer_contract: {"kind":"label","options":[["positive","it is positive","positive number"],["negative","it is negative","negative number"]]}
            solution_sketch: 'The slope between the values at $0.9$ and $1.1$ is $\frac{2.8 - 3.2}{1.1 - 0.9} = -2$. The function is falling near $x = 1$, so $f''(1)$ is negative.'
          - problem: 'A bakery''s profit is $P(x)$ dollars when it sells $x$ loaves, and $P''(200) = 0.75$. About how much does the profit change when the 201st loaf is sold?'
            answer: '0.75'
            answer_contract: {"kind":"unit","quantity":"dollar","unit":"dollar","allow_omitted":true}
            solution_sketch: 'The units of $P''$ are dollars per loaf, so $P''(200) = 0.75$ means each extra loaf adds about $0.75$ dollars. One more loaf changes the profit by about $0.75$ dollars.'
          - problem: 'A runner''s distance is $s(t)$ metres after $t$ seconds, and $s''(10) = 4$. At this speed, about how many seconds does the runner need for the next $20$ metres?'
            answer: '5'
            answer_contract: {"kind":"unit","quantity":"time","unit":"s","allow_omitted":true}
            solution_sketch: 'The speed is $s''(10) = 4$ metres per second. The time for $20$ metres is the distance divided by the speed, $\frac{20}{4} = 5$ seconds.'
    diagnostic_exemplar:
      problem: 'A car''s position is $s(t)$ kilometres after $t$ hours, with $s(1.9) = 95.2$ and $s(2.1) = 105.6$. Estimate the car''s speed at $t = 2$, in km/h.'
      answer: '52'
      solution_sketch: 'Symmetric difference quotient: $\frac{105.6 - 95.2}{2.1 - 1.9} = \frac{10.4}{0.2} = 52$, in km/h because $s$ is in km and $t$ in hours.'
    anki_seeds:
      - front: "Best table-based estimate of f'(a): use points on ___ of a."
        back: "both sides — the symmetric difference (f(a+h) - f(a-h)) / (2h)"
        type: basic
      - front: "The units of f'(x) are always..."
        back: "(units of f) per (unit of x)"
        type: basic

  - id: tangent-line-equation
    name: Equations of Tangent Lines
    core: true
    difficulty: 0.58
    drill: false
    answer_kind: expression
    expected_time_secs: 150
    prerequisites:
      - id: derivative-definition
        weight: 0.7
        key: true
      - id: point-slope-form
        weight: 0.5
        key: true
      - id: derivative-at-a-point
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: Tangent line from a given derivative
        key_prerequisites: [point-slope-form, derivative-at-a-point]
        constraints: 'quadratics (and one cubic-free context) with integer coefficients; the derivative is given in the problem; the answer is an equation of the line'
        exemplars:
          - problem: 'The derivative of $f(x) = x^2$ is $f''(x) = 2x$. Find an equation of the tangent line to the graph of $f$ at $x = 1$.'
            answer: 'y = 2x - 1'
            answer_contract: {"kind":"polynomial_relation"}
            solution_sketch: 'The slope at $x = 1$ is $f''(1) = 2$, and the point on the curve is $(1, 1)$. Point-slope form gives $y - 1 = 2(x - 1)$, which is $y = 2x - 1$.'
          - problem: 'The derivative of $f(x) = x^2 - 3x$ is $f''(x) = 2x - 3$. Find an equation of the tangent line to the graph of $f$ at $x = 2$.'
            answer: 'y = x - 4'
            answer_contract: {"kind":"polynomial_relation"}
            solution_sketch: 'The slope is $f''(2) = 1$, and the point is $(2, f(2)) = (2, -2)$. Point-slope form gives $y + 2 = x - 2$, which is $y = x - 4$.'
          - problem: 'The derivative of $f(x) = x^2 - 5x + 1$ is $f''(x) = 2x - 5$. Find an equation of the tangent line to the graph of $f$ at $x = 4$.'
            answer: 'y = 3x - 15'
            answer_contract: {"kind":"polynomial_relation"}
            solution_sketch: 'The slope is $f''(4) = 3$, and the point is $(4, f(4)) = (4, -3)$. Point-slope form gives $y + 3 = 3(x - 4)$, which is $y = 3x - 15$.'
          - problem: 'A skateboard track follows the curve $y = x^2 - 4x$, whose derivative is $2x - 4$. A straight rail touches the track at the point where $x = 3$. Find an equation of the line along which the rail lies.'
            answer: 'y = 2x - 9'
            answer_contract: {"kind":"polynomial_relation"}
            solution_sketch: 'The rail lies along the tangent line at $x = 3$. The slope is $2 \cdot 3 - 4 = 2$ and the point is $(3, -3)$, so $y + 3 = 2(x - 3)$, which is $y = 2x - 9$.'
          - problem: 'A ski ramp follows the curve $y = x^2 - 6x + 10$, with derivative $2x - 6$. At $x = 4$ the skier leaves the ramp and moves along the tangent line. Find an equation of that line.'
            answer: 'y = 2x - 6'
            answer_contract: {"kind":"polynomial_relation"}
            solution_sketch: 'The skier travels along the tangent line at $x = 4$. The slope is $2 \cdot 4 - 6 = 2$ and the point is $(4, 2)$, so $y - 2 = 2(x - 4)$, which is $y = 2x - 6$.'
          - problem: 'A curve has derivative $f''(x) = 4x - 1$ and passes through the point $(2, 5)$. Find an equation of the tangent line to the curve at $x = 2$.'
            answer: 'y = 7x - 9'
            answer_contract: {"kind":"polynomial_relation"}
            solution_sketch: 'The slope is $f''(2) = 4 \cdot 2 - 1 = 7$, and the point is $(2, 5)$. Point-slope form gives $y - 5 = 7(x - 2)$, which is $y = 7x - 9$.'
          - problem: 'Sam writes $y = 5(x - 2)$ as the tangent line to $f(x) = 2x^2 - 3x + 1$ at $x = 2$, where $f''(x) = 4x - 3$. What is the correct equation of the tangent line?'
            answer: 'y = 5x - 7'
            answer_contract: {"kind":"polynomial_relation"}
            solution_sketch: 'The slope is $f''(2) = 5$, as Sam found. The line must pass through $(2, f(2)) = (2, 3)$, so $y - 3 = 5(x - 2)$, which is $y = 5x - 7$.'
          - problem: 'The derivative of $f(x) = x^2$ is $2x$. At what value of $x$ does the tangent line to the graph of $f$ at $x = 3$ cross the $x$-axis?'
            answer: '3/2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The tangent at $x = 3$ has slope $6$ and passes through $(3, 9)$, so its equation is $y = 6x - 9$. It crosses the $x$-axis where $6x - 9 = 0$, so $x = \frac{9}{6} = \frac{3}{2}$.'
      - id: kp2
        name: Compute the derivative, then the tangent line
        key_prerequisites: [derivative-definition, point-slope-form]
        constraints: 'derivatives of x^2 and x^3 type functions; clean integer slopes and intercepts; the answer is an equation of the line'
        exemplars:
          - problem: 'Find an equation of the tangent line to $f(x) = x^2$ at $x = 3$.'
            answer: 'y = 6x - 9'
            answer_contract: {"kind":"polynomial_relation"}
            solution_sketch: 'The derivative is $f''(x) = 2x$, so the slope at $x = 3$ is $6$. The point is $(3, 9)$, so $y - 9 = 6(x - 3)$, which is $y = 6x - 9$.'
          - problem: 'Find an equation of the tangent line to $f(x) = \frac{1}{x}$ at $x = 1$, using $f''(x) = -\frac{1}{x^2}$.'
            answer: 'y = -x + 2'
            answer_contract: {"kind":"polynomial_relation"}
            solution_sketch: 'The slope at $x = 1$ is $f''(1) = -1$, and the point is $(1, 1)$. Point-slope form gives $y - 1 = -(x - 1)$, which is $y = -x + 2$.'
          - problem: 'Find an equation of the tangent line to $f(x) = x^2$ at $x = -2$.'
            answer: 'y = -4x - 4'
            answer_contract: {"kind":"polynomial_relation"}
            solution_sketch: 'The derivative is $f''(x) = 2x$, so the slope at $x = -2$ is $-4$. The point is $(-2, 4)$, so $y - 4 = -4(x + 2)$, which is $y = -4x - 4$.'
          - problem: 'Find an equation of the tangent line to $f(x) = x^3$ at $x = 1$.'
            answer: 'y = 3x - 2'
            answer_contract: {"kind":"polynomial_relation"}
            solution_sketch: 'The derivative is $f''(x) = 3x^2$, so the slope at $x = 1$ is $3$. The point is $(1, 1)$, so $y - 1 = 3(x - 1)$, which is $y = 3x - 2$.'
          - problem: 'Find an equation of the tangent line to $f(x) = x^3 - 2x$ at $x = 2$.'
            answer: 'y = 10x - 16'
            answer_contract: {"kind":"polynomial_relation"}
            solution_sketch: 'The derivative is $f''(x) = 3x^2 - 2$, so the slope at $x = 2$ is $10$. The point is $(2, 4)$, so $y - 4 = 10(x - 2)$, which is $y = 10x - 16$.'
          - problem: 'For $f(x) = x^2$, find an equation of the tangent line at the point where the slope is $8$.'
            answer: 'y = 8x - 16'
            answer_contract: {"kind":"polynomial_relation"}
            solution_sketch: 'The derivative is $f''(x) = 2x$, and $2x = 8$ gives $x = 4$. The point is $(4, 16)$, so $y - 16 = 8(x - 4)$, which is $y = 8x - 16$.'
          - problem: 'A ball follows the path $y = 6x - x^2$, where $x$ is the horizontal distance in metres and $y$ is the height in metres. If gravity stopped acting at $x = 1$, the ball would continue along the tangent line to its path there. Find an equation of that line.'
            answer: 'y = 4x + 1'
            answer_contract: {"kind":"polynomial_relation"}
            solution_sketch: 'The derivative is $y'' = 6 - 2x$, so the slope at $x = 1$ is $4$. The point is $(1, 5)$, so $y - 5 = 4(x - 1)$, which is $y = 4x + 1$.'
          - problem: 'A road follows the curve $y = x^3 - 3x$, with $x$ and $y$ in hundreds of metres. A straight tunnel is to touch the road at $x = 2$ and follow its direction there. Find an equation of the line of the tunnel.'
            answer: 'y = 9x - 16'
            answer_contract: {"kind":"polynomial_relation"}
            solution_sketch: 'The derivative is $y'' = 3x^2 - 3$, so the slope at $x = 2$ is $9$. The point on the road is $(2, 2)$, so $y - 2 = 9(x - 2)$, which is $y = 9x - 16$.'
      - id: kp3
        name: Normal lines and horizontal tangents
        key_prerequisites: [point-slope-form, derivative-definition]
        try_first:
          problem: 'A tangent line to a curve has slope $4$. What is the slope of a line perpendicular to that tangent?'
          answer_contract: {"kind":"exact"}
          answer: '-1/4'
          reveal: 'Perpendicular lines have slopes whose product is $-1$, so the slope is the negative reciprocal $-\frac{1}{4}$. The normal line to a curve is the line perpendicular to the tangent at the point.'
        constraints: 'normal slope is the negative reciprocal of the tangent slope; horizontal tangents where the derivative vanishes; the answer is an equation, a point, or the x-values'
        exemplars:
          - problem: 'Find an equation of the normal line to $y = x^2$ at the point $(1, 1)$.'
            answer: 'y = -x/2 + 3/2'
            answer_contract: {"kind":"polynomial_relation"}
            solution_sketch: 'The tangent slope is $2x = 2$ at $x = 1$, so the normal slope is $-\frac{1}{2}$. Point-slope form gives $y - 1 = -\frac{1}{2}(x - 1)$, which is $y = -\frac{x}{2} + \frac{3}{2}$.'
          - problem: 'At which point does the graph of $y = x^2 - 4x$ have a horizontal tangent line?'
            answer: '(2, -4)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'A horizontal tangent needs $y'' = 2x - 4 = 0$, so $x = 2$. Then $y = 2^2 - 4 \cdot 2 = -4$, and the point is $(2, -4)$.'
          - problem: 'Find an equation of the normal line to $y = x^2 + 2x$ at $x = 1$.'
            answer: 'y = -x/4 + 13/4'
            answer_contract: {"kind":"polynomial_relation"}
            solution_sketch: 'The point is $(1, 3)$, and the tangent slope is $2x + 2 = 4$ at $x = 1$. The normal slope is $-\frac{1}{4}$, so $y - 3 = -\frac{1}{4}(x - 1)$, which is $y = -\frac{x}{4} + \frac{13}{4}$.'
          - problem: 'Find an equation of the normal line to $y = x^3$ at the point $(1, 1)$.'
            answer: 'y = -x/3 + 4/3'
            answer_contract: {"kind":"polynomial_relation"}
            solution_sketch: 'The tangent slope is $3x^2 = 3$ at $x = 1$, so the normal slope is $-\frac{1}{3}$. Point-slope form gives $y - 1 = -\frac{1}{3}(x - 1)$, which is $y = -\frac{x}{3} + \frac{4}{3}$.'
          - problem: 'Find the $x$-coordinates of all points where the graph of $y = x + \frac{4}{x}$ has a horizontal tangent line.'
            answer: '-2, 2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The derivative is $y'' = 1 - \frac{4}{x^2}$. It is zero when $x^2 = 4$, so the horizontal tangents are at $x = -2$ and $x = 2$.'
          - problem: 'Find an equation of the normal line to $y = \sqrt{x}$ at $x = 4$.'
            answer: 'y = -4x + 18'
            answer_contract: {"kind":"polynomial_relation"}
            solution_sketch: 'The point is $(4, 2)$, and the tangent slope is $\frac{1}{2\sqrt{x}} = \frac{1}{4}$ at $x = 4$. The normal slope is $-4$, so $y - 2 = -4(x - 4)$, which is $y = -4x + 18$.'
          - problem: 'The cross-section of an arch is the curve $y = 6x - x^2$, with $x$ and $y$ in metres. At what point of the arch is the tangent line horizontal?'
            answer: '(3, 9)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'A horizontal tangent needs $y'' = 6 - 2x = 0$, so $x = 3$. Then $y = 6 \cdot 3 - 3^2 = 9$, so the point is $(3, 9)$.'
          - problem: 'A ball hits the curved wall $y = \frac{x^2}{4}$ at the point where $x = 2$ and rebounds along the normal line to the wall. Find an equation of that line.'
            answer: 'y = -x + 3'
            answer_contract: {"kind":"polynomial_relation"}
            solution_sketch: 'The wall point is $(2, 1)$, and the tangent slope is $\frac{x}{2} = 1$ at $x = 2$. The normal slope is $-1$, so $y - 1 = -(x - 2)$, which is $y = -x + 3$.'
          - problem: 'Ana says the normal line to $y = x^2$ at $x = 3$ has slope $-6$. What is the correct slope of the normal line?'
            answer: '-1/6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The tangent slope at $x = 3$ is $2 \cdot 3 = 6$. Ana used the negative of $6$, but the normal slope is the negative reciprocal, $-\frac{1}{6}$.'
    diagnostic_exemplar:
      problem: 'Find an equation of the normal line to $y = x^2$ at $x = 2$.'
      answer: 'y = -x/4 + 9/2'
      answer_contract: {"kind":"polynomial_relation"}
      solution_sketch: 'The tangent slope is $f''(2) = 4$, so the normal slope is $-\frac{1}{4}$; through $(2, 4)$: $y = 4 - \frac{1}{4}(x - 2) = -\frac{x}{4} + \frac{9}{2}$.'
    anki_seeds:
      - front: "Tangent line to y = f(x) at x = a:"
        back: "y = f(a) + f'(a)(x - a)"
        type: basic
      - front: "The normal line at a point has slope..."
        back: "-1/f'(a) — the negative reciprocal of the tangent slope"
        type: basic

  - id: differentiability
    name: Differentiability and the Derivative as a Function
    core: true
    difficulty: 0.62
    drill: false
    answer_kind: numeric
    expected_time_secs: 150
    prerequisites:
      - id: derivative-definition
        weight: 0.7
        key: true
      - id: continuity
        weight: 0.6
        key: true
      - id: one-sided-limits
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: Differentiable implies continuous (converse fails)
        key_prerequisites: [derivative-definition, continuity]
        constraints: 'corner examples built from |x - a|; cite the implication and its failed converse; one-sided derivatives are limits of the difference quotient from one side'
        exemplars:
          - problem: 'Does $f(x) = |x - 1|$ have a derivative at $x = 1$?'
            answer: 'no'
            answer_contract: {"kind":"label","options":[["no","it does not","not differentiable","does not exist","DNE","no derivative","no, it does not","the derivative does not exist"],["yes","it does","it is","differentiable","yes, it does","it has a derivative"]]}
            solution_sketch: 'At $x = 1$ the difference quotient is $\frac{|h|}{h}$. It equals $-1$ for $h < 0$ and $1$ for $h > 0$, so the one-sided limits differ and there is no derivative. The function is continuous at $1$, so continuity alone does not give a derivative.'
          - problem: 'Suppose $f$ is differentiable at $x = 4$ and $f(4) = 7$. Find $\lim_{x \to 4} f(x)$.'
            answer: '7'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'A function that is differentiable at $4$ is continuous at $4$. Continuity means $\lim_{x \to 4} f(x) = f(4)$, so the limit is $7$.'
          - problem: 'For $f(x) = |x - 5|$, find the left-hand derivative at $x = 5$.'
            answer: '-1'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The left-hand derivative is the limit of $\frac{|5 + h - 5| - 0}{h} = \frac{|h|}{h}$ as $h \to 0^-$. For $h < 0$ we have $|h| = -h$, so the quotient is $-1$ and the limit is $-1$.'
          - problem: 'For $f(x) = |x - 5|$, find the right-hand derivative at $x = 5$.'
            answer: '1'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The right-hand derivative is the limit of $\frac{|h|}{h}$ as $h \to 0^+$. For $h > 0$ we have $|h| = h$, so the quotient is $1$ and the limit is $1$.'
          - problem: 'A toy car runs along a track so that its distance from a wall is $d(t) = 3|t - 2|$ metres after $t$ seconds. What is the left-hand derivative of $d$ at $t = 2$, in metres per second?'
            answer: '-3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'For $t$ just below $2$ we have $|t - 2| = 2 - t$, so $d(t) = 3(2 - t)$ and its slope is $-3$. The left-hand derivative is $-3$ metres per second: the car is moving toward the wall.'
          - problem: 'Suppose $f$ is differentiable at $x = 3$. Must $f$ be continuous at $x = 3$?'
            answer: 'yes'
            answer_contract: {"kind":"label","options":[["yes","it must","must be continuous","continuous","yes, it must","it must be continuous","yes, f must be continuous"],["no","it need not","not necessarily","not continuous","no, not necessarily"]]}
            solution_sketch: 'Differentiability at a point implies continuity at that point. So $f$ must be continuous at $x = 3$; only the converse fails.'
          - problem: 'The position $s(t)$ of a particle, in metres, is differentiable at $t = 3$ seconds, and $s(3) = 12$. What value does $s(t)$ approach as $t$ approaches $3$?'
            answer: '12'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'A function that is differentiable at $3$ is continuous at $3$. So $s(t)$ approaches $s(3) = 12$ metres as $t$ approaches $3$.'
          - problem: 'For $f(x) = 2|x + 4|$, find the right-hand derivative at $x = -4$.'
            answer: '2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The right-hand derivative is the limit of $\frac{2|h| - 0}{h}$ as $h \to 0^+$. For $h > 0$ we have $|h| = h$, so the quotient is $2$ and the limit is $2$.'
      - id: kp2
        name: Spot non-differentiable points
        key_prerequisites: [derivative-definition, one-sided-limits]
        constraints: 'classify by feature (corner, cusp, vertical tangent, discontinuity); find the input where a function has no derivative; no computation beyond sign checks of one-sided slopes'
        exemplars:
          - problem: 'The function $f(x) = |x - 4|$ is not differentiable at $x = 4$. Does the graph have a corner, a cusp, a vertical tangent or a discontinuity there?'
            answer: 'corner point'
            answer_contract: {"kind":"label","options":[["corner point","corner","a corner"],["cusp point","cusp","a cusp"],["vertical tangent","a vertical tangent"],["discontinuity","a discontinuity","jump","a jump"]]}
            solution_sketch: 'For $x < 4$ the graph is a line of slope $-1$, and for $x > 4$ it is a line of slope $1$. The one-sided slopes are finite and different, and the graph is continuous, so the feature is a corner.'
          - problem: 'The function $f(x) = x^{2/3}$ is not differentiable at $x = 0$. Does the graph have a corner, a cusp, a vertical tangent or a discontinuity there?'
            answer: 'cusp point'
            answer_contract: {"kind":"label","options":[["corner point","corner","a corner"],["cusp point","cusp","a cusp"],["vertical tangent","a vertical tangent"],["discontinuity","a discontinuity","jump","a jump"]]}
            solution_sketch: 'The difference quotient at $0$ is $h^{-1/3}$. It tends to $-\infty$ from the left and to $+\infty$ from the right, so the one-sided slopes are infinite with opposite signs. The graph is continuous at $0$ and comes to a cusp.'
          - problem: 'The function $f(x) = \frac{1}{x - 2}$ has no derivative at exactly one value of $x$. Find it.'
            answer: '2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The function is not defined at $x = 2$, because the denominator is zero. A function has no derivative at a point where it is not defined, so the value is $2$.'
          - problem: 'The function $f(x) = |x + 2|$ has no derivative at exactly one value of $x$. Find it.'
            answer: '-2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The expression inside the absolute value changes sign where $x + 2 = 0$, so at $x = -2$. The one-sided slopes there are $-1$ and $1$, which differ, so the value is $-2$.'
          - problem: 'The function $f(x) = (x - 1)^{2/3}$ has no derivative at exactly one value of $x$. Find it.'
            answer: '1'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The base $x - 1$ is zero at $x = 1$. There the one-sided slopes are infinite with opposite signs, so the graph has a cusp and the value is $1$.'
          - problem: 'The graph of $f(x) = (x - 3)^{1/3}$ has a vertical tangent at exactly one value of $x$. Find it.'
            answer: '3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The base $x - 3$ is zero at $x = 3$. The difference quotient tends to $+\infty$ on both sides, so the tangent is vertical there, at $x = 3$.'
          - problem: 'A robot moves along a rail so that its position after $t$ seconds is $p(t) = |t - 6|$ metres. At what time does its velocity fail to exist?'
            answer: '6'
            answer_contract: {"kind":"unit","quantity":"time","unit":"s","allow_omitted":true}
            solution_sketch: 'The position has a corner where $t - 6 = 0$. The velocity is $-1$ metre per second just before $t = 6$ and $1$ metre per second just after, so it fails to exist at $t = 6$ seconds.'
          - problem: 'An income tax $T(x)$, in thousands of dollars, on an income of $x$ thousand dollars is $T(x) = 0.1x$ for $x \le 40$ and $T(x) = 4 + 0.3(x - 40)$ for $x > 40$. At what income is $T$ not differentiable?'
            answer: '40'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The two branches both give $4$ at $x = 40$, so $T$ is continuous there. The slopes are $0.1$ on the left and $0.3$ on the right, which differ, so $T$ is not differentiable at $x = 40$.'
          - problem: 'A function is defined by $f(x) = x + 1$ for $x < 3$ and $f(x) = x^2 - 2$ for $x \ge 3$. At what value of $x$ is $f$ not differentiable?'
            answer: '3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Both pieces are polynomials, so the only possible trouble is at $x = 3$. The left piece approaches $3 + 1 = 4$ and the right piece gives $3^2 - 2 = 7$, so $f$ jumps at $3$ and has no derivative there.'
      - id: kp3
        name: Piecewise differentiability checks
        key_prerequisites: [derivative-definition, continuity, one-sided-limits]
        constraints: 'two-branch polynomials; check value match first, then one-sided slopes; unknown constants in one branch; contexts with a smooth join'
        exemplars:
          - problem: 'Let $f(x) = x^2$ for $x \le 1$ and $f(x) = 2x - 1$ for $x > 1$. Find $f''(1)$.'
            answer: '2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The branches give $1^2 = 1$ and $2(1) - 1 = 1$, so the values match. The left slope is $2x = 2$ at $x = 1$ and the right slope is $2$, so $f$ is differentiable at $1$ and $f''(1) = 2$.'
          - problem: 'Let $f(x) = x^2$ for $x \le 1$ and $f(x) = ax - 1$ for $x > 1$. Find the value of $a$ for which $f$ is differentiable at $x = 1$.'
            answer: '2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The values match when $1^2 = a(1) - 1$, which gives $a = 2$. The left slope is $2x = 2$ at $x = 1$ and the right slope is $a$, so $a = 2$ also makes the slopes match.'
          - problem: 'Let $f(x) = x^2 + 2x$ for $x \le 1$ and $f(x) = 4x + c$ for $x > 1$. Find the value of $c$ for which $f$ is differentiable at $x = 1$.'
            answer: '-1'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The values match when $1^2 + 2(1) = 4(1) + c$, so $3 = 4 + c$ and $c = -1$. The left slope is $2x + 2 = 4$ at $x = 1$ and the right slope is $4$, so the slopes match too.'
          - problem: 'Let $f(x) = x^2$ for $x \le 2$ and $f(x) = x^3 - 4$ for $x > 2$. Is $f$ differentiable at $x = 2$?'
            answer: 'no'
            answer_contract: {"kind":"label","options":[["no","it is not","not differentiable","does not exist","DNE","no, it is not","no derivative","the derivative does not exist"],["yes","it is","differentiable","yes, it is","it has a derivative"]]}
            solution_sketch: 'Both branches give $4$ at $x = 2$, so $f$ is continuous there. The left slope is $2x = 4$ and the right slope is $3x^2 = 12$, which differ, so $f$ is not differentiable at $2$.'
          - problem: 'Let $f(x) = x^2 + bx$ for $x \le 1$ and $f(x) = 3x - 1$ for $x > 1$. Find the value of $b$ for which $f$ is differentiable at $x = 1$.'
            answer: '1'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The values match when $1 + b = 3(1) - 1 = 2$, so $b = 1$. The left slope is $2x + b = 3$ at $x = 1$ and the right slope is $3$, so the slopes match too.'
          - problem: 'A drone climbs so that its height after $t$ seconds is $h(t) = t^2$ metres for $0 \le t \le 3$. After that it climbs along a straight line, $h(t) = at + b$ for $t > 3$, with no jump in height and no change in climbing rate at $t = 3$. Find $a$, in metres per second.'
            answer: '6'
            answer_contract: {"kind":"unit","quantity":"speed","unit":"m/s","allow_omitted":true}
            solution_sketch: 'The climbing rate just before $t = 3$ is $2t = 6$ metres per second. The straight line must have the same slope, so $a = 6$. The values then match when $9 = 3a + b$, which gives $b = -9$.'
          - problem: 'A company''s cost, in thousands of dollars, for producing $x$ thousand units is $C(x) = x^2 + 3x$ for $x \le 2$ and $C(x) = 7x + c$ for $x > 2$. For what value of $c$ is the cost curve smooth at $x = 2$, with no jump and no corner?'
            answer: '-4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The left branch gives $2^2 + 3(2) = 10$ at $x = 2$, and the right branch gives $14 + c$, so $c = -4$. The left slope is $2x + 3 = 7$ and the right slope is $7$, so there is no corner.'
          - problem: 'Let $f(x) = x^2 + x$ for $x \le 0$ and $f(x) = x$ for $x > 0$. Is $f$ differentiable at $x = 0$?'
            answer: 'yes'
            answer_contract: {"kind":"label","options":[["yes","it is","differentiable","yes, it is","it has a derivative"],["no","it is not","not differentiable","does not exist","DNE","no, it is not","no derivative","the derivative does not exist"]]}
            solution_sketch: 'Both branches give $0$ at $x = 0$, so $f$ is continuous there. The left slope is $2x + 1 = 1$ at $x = 0$ and the right slope is $1$, so the slopes match and $f$ is differentiable at $0$.'
    diagnostic_exemplar:
      problem: 'Let $f(x) = x^2$ for $x \leq 2$ and $f(x) = 4x - 4$ for $x > 2$. Is $f$ differentiable at $x = 2$?'
      answer: "yes — f is continuous at 2 (both branches give 4) and both one-sided slopes equal 4, so f'(2) = 4"
      answer_contract: {kind: none}
      solution_sketch: 'Differentiability needs continuity plus matching one-sided slopes: the branches agree at $2$ ($2^2 = 4 = 4(2) - 4$), and $2x|_{x=2} = 4$ matches the slope $4$ of the linear branch.'
    anki_seeds:
      - front: "Differentiable ⇒ continuous. Continuous ⇒ differentiable?"
        back: "No — corners, cusps, and vertical tangents are continuous but not differentiable"
        type: basic
      - front: "A piecewise function is differentiable at its seam iff..."
        back: "the branch values match there (continuity) AND the one-sided derivatives match"
        type: basic

  - id: derivatives-of-polynomials
    name: Derivatives of Polynomials
    core: true
    difficulty: 0.5
    drill: true
    answer_kind: expression
    expected_time_secs: 60
    prerequisites:
      - id: derivative-definition
        weight: 0.7
        key: true
      - id: evaluating-polynomials
        weight: 0.4
      - id: combining-like-terms
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: Power rule for whole-number exponents
        key_prerequisites: [derivative-definition]
        constraints: 'single power terms with exponents 2-8, in different variable names, with area, volume and position contexts'
        exemplars:
          - problem: 'Differentiate $f(x) = x^5$.'
            answer: '5x^4'
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'By the power rule, the derivative of $x^5$ is $5x^{5-1}$. So $f''(x) = 5x^4$.'
          - problem: 'Differentiate $f(x) = x^7$.'
            answer: '7x^6'
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'By the power rule, the derivative of $x^7$ is $7x^{7-1}$. So $f''(x) = 7x^6$.'
          - problem: 'The position of a particle at time $t$ is $s(t) = t^4$. Find its velocity function $v(t)$.'
            answer: '4t^3'
            answer_contract: {"kind":"function","vars":["t"]}
            solution_sketch: 'Velocity is the derivative of position. By the power rule, the derivative of $t^4$ is $4t^{4-1}$, so $v(t) = 4t^3$.'
          - problem: 'A square tile has side length $x$ and area $A(x) = x^2$. Find $\frac{dA}{dx}$.'
            answer: '2x'
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'By the power rule, $\frac{dA}{dx} = 2x^{2-1}$. So $\frac{dA}{dx} = 2x$.'
          - problem: 'Find the derivative of $f(u) = u^8$.'
            answer: '8u^7'
            answer_contract: {"kind":"function","vars":["u"]}
            solution_sketch: 'By the power rule, $f''(u) = 8u^{8-1}$. So the derivative is $8u^7$.'
          - problem: 'Given $y = t^2$, find $\frac{dy}{dt}$.'
            answer: '2t'
            answer_contract: {"kind":"function","vars":["t"]}
            solution_sketch: 'By the power rule, $\frac{dy}{dt} = 2t^{2-1}$. So $\frac{dy}{dt} = 2t$.'
          - problem: 'A cube has side length $x$ and volume $V(x) = x^3$. Find $\frac{dV}{dx}$.'
            answer: '3x^2'
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'By the power rule, $\frac{dV}{dx} = 3x^{3-1}$. So $\frac{dV}{dx} = 3x^2$.'
          - problem: 'Dev differentiates $f(x) = x^6$ and gets $f''(x) = x^5$. What is the correct derivative?'
            answer: '6x^5'
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'Dev lowered the exponent but forgot the factor. The power rule multiplies by the old exponent $6$, so $f''(x) = 6x^5$.'
      - id: kp2
        name: Sums, constant multiples, and constants
        key_prerequisites: [derivative-definition, combining-like-terms]
        constraints: 'integer coefficients and exponents 1-6; constants differentiate to 0; some contexts, and one product to expand first'
        exemplars:
          - problem: 'Differentiate $f(x) = 3x^4 - 2x^2 + 7$.'
            answer: '12x^3 - 4x'
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'Differentiate each term. The derivative of $3x^4$ is $12x^3$, the derivative of $-2x^2$ is $-4x$, and the constant $7$ gives $0$. So $f''(x) = 12x^3 - 4x$.'
          - problem: 'Differentiate $f(x) = 2x^3 - 5x + 4$.'
            answer: '6x^2 - 5'
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'Differentiate each term. The derivative of $2x^3$ is $6x^2$, the derivative of $-5x$ is $-5$, and the constant $4$ gives $0$. So $f''(x) = 6x^2 - 5$.'
          - problem: 'Let $f(x) = 5x^3 + 2x^2 - 9x + 4$. Find $f''(x)$.'
            answer: '15x^2 + 4x - 9'
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'The sum rule lets us differentiate each term on its own, and the constant-multiple rule keeps each coefficient. The terms give $15x^2$, $4x$ and $-9$, and the constant $4$ gives $0$, so $f''(x) = 15x^2 + 4x - 9$.'
          - problem: 'Differentiate $f(x) = 9$.'
            answer: '0'
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'The function is a constant, so its graph is a horizontal line with slope $0$. The derivative of a constant is $0$.'
          - problem: 'Let $g(x) = -4x^5 + 6x^3 - x$. Find $g''(x)$.'
            answer: '-20x^4 + 18x^2 - 1'
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'Differentiate each term. The derivative of $-4x^5$ is $-20x^4$, the derivative of $6x^3$ is $18x^2$, and the derivative of $-x$ is $-1$. So $g''(x) = -20x^4 + 18x^2 - 1$.'
          - problem: 'Let $h(x) = 7x^6 - 3x^4 + 8x^2 - 11$. Find $h''(x)$.'
            answer: '42x^5 - 12x^3 + 16x'
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'Differentiate each term. The terms give $42x^5$, $-12x^3$ and $16x$, and the constant $-11$ gives $0$. So $h''(x) = 42x^5 - 12x^3 + 16x$.'
          - problem: 'A stone thrown upward has height $h(t) = -5t^2 + 20t + 3$ metres after $t$ seconds. Find its velocity $v(t)$.'
            answer: '-10t + 20'
            answer_contract: {"kind":"function","vars":["t"]}
            solution_sketch: 'Velocity is the derivative of height. The term $-5t^2$ gives $-10t$, the term $20t$ gives $20$, and the constant $3$ gives $0$. So $v(t) = -10t + 20$.'
          - problem: 'A shop''s profit is $P(x) = -2x^2 + 120x - 300$ dollars when it sells $x$ items. Find $P''(x)$, the rate at which the profit changes per extra item.'
            answer: '-4x + 120'
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'Differentiate each term. The term $-2x^2$ gives $-4x$, the term $120x$ gives $120$, and the constant $-300$ gives $0$. So $P''(x) = -4x + 120$.'
          - problem: 'Lena differentiates $f(x) = 4x^3 + 5$ and gets $12x^2 + 5$. What is the correct derivative?'
            answer: '12x^2'
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'The term $4x^3$ correctly gives $12x^2$. The constant $5$ does not stay: its derivative is $0$, so $f''(x) = 12x^2$.'
          - problem: 'Differentiate $f(x) = (x + 2)(x - 3)$.'
            answer: '2x - 1'
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'Multiply out first: $(x + 2)(x - 3) = x^2 - x - 6$. Then differentiate each term, which gives $2x - 1 - 0$, so $f''(x) = 2x - 1$.'
      - id: kp3
        name: Evaluate polynomial derivatives at a point
        key_prerequisites: [derivative-definition, evaluating-polynomials]
        constraints: 'evaluation points are small integers; answers are integers; slopes, velocities and rates; one item finds the point for a given slope'
        exemplars:
          - problem: 'For $f(x) = x^3 - 4x$, find $f''(2)$.'
            answer: '8'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The derivative is $f''(x) = 3x^2 - 4$. Substituting $x = 2$ gives $3 \cdot 4 - 4 = 8$.'
          - problem: 'For $p(x) = 5x^2 - 3x$, find $p''(-1)$.'
            answer: '-13'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The derivative is $p''(x) = 10x - 3$. Substituting $x = -1$ gives $-10 - 3 = -13$.'
          - problem: 'Let $g(x) = 2x^3 - 5x + 1$. Find $g''(3)$.'
            answer: '49'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The derivative is $g''(x) = 6x^2 - 5$. Substituting $x = 3$ gives $6 \cdot 9 - 5 = 54 - 5 = 49$.'
          - problem: 'Let $h(x) = x^4 - 2x^2 + 7x$. Find $h''(-2)$.'
            answer: '-17'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The derivative is $h''(x) = 4x^3 - 4x + 7$. Substituting $x = -2$ gives $4(-8) - 4(-2) + 7 = -32 + 8 + 7 = -17$.'
          - problem: 'Let $q(x) = 3x^3 + 4x^2 - x + 6$. Find $q''(2)$.'
            answer: '51'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The derivative is $q''(x) = 9x^2 + 8x - 1$. Substituting $x = 2$ gives $36 + 16 - 1 = 51$.'
          - problem: 'Let $r(x) = x^4 - 5x^2 + 3$. Find the slope of the tangent line to the graph of $r$ at $x = -1$.'
            answer: '6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The slope of the tangent line is $r''(-1)$, and $r''(x) = 4x^3 - 10x$. Substituting $x = -1$ gives $-4 + 10 = 6$.'
          - problem: 'A particle moves along a line so that its position is $s(t) = t^3 - 6t^2 + 9t$ metres after $t$ seconds. Find its velocity at $t = 2$, in metres per second.'
            answer: '-3'
            answer_contract: {"kind":"unit","quantity":"speed","unit":"m/s","allow_omitted":true}
            solution_sketch: 'Velocity is the derivative, $s''(t) = 3t^2 - 12t + 9$. Substituting $t = 2$ gives $12 - 24 + 9 = -3$, so the particle moves backward at $3$ metres per second.'
          - problem: 'The tangent line to $y = x^3 - 3x$ has slope $9$ at a point with positive $x$-coordinate. Find that $x$-coordinate.'
            answer: '2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The slope is $y'' = 3x^2 - 3$, and we need $3x^2 - 3 = 9$. Then $x^2 = 4$, and the positive solution is $x = 2$.'
          - problem: 'The cost of making $x$ phones is $C(x) = 0.02x^2 + 5x + 100$ dollars. At what rate, in dollars per phone, is the cost changing when $x = 50$?'
            answer: '7'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The rate is $C''(50)$, and $C''(x) = 0.04x + 5$. Substituting $x = 50$ gives $0.04 \cdot 50 + 5 = 2 + 5 = 7$ dollars per phone.'
    diagnostic_exemplar:
      problem: 'For $f(x) = x^4 - 3x^2 + 2x$, find $f\''(2)$.'
      answer: '22'
      solution_sketch: '$f''(x) = 4x^3 - 6x + 2$, so $f''(2) = 32 - 12 + 2 = 22$.'
    anki_seeds:
      - front: "Power rule (whole-number case): d/dx x^n = ?"
        back: "n·x^(n-1)"
        type: basic
      - front: "d/dx of a constant = ? and d/dx [c·f(x)] = ?"
        back: "0; c·f'(x)"
        type: basic

  - id: derivative-power-rule
    name: The Power Rule
    core: true
    difficulty: 0.55
    drill: true
    answer_kind: expression
    expected_time_secs: 60
    prerequisites:
      - id: derivatives-of-polynomials
        weight: 0.8
        key: true
      - id: negative-zero-exponents
        weight: 0.5
        key: true
      - id: rational-exponents
        weight: 0.5
        key: true
    knowledge_points:
      - id: kp1
        name: Negative exponents
        key_prerequisites: [negative-zero-exponents, derivatives-of-polynomials]
        exemplars:
          - problem: 'Differentiate $f(x) = \frac{4}{x^3}$.'
            answer: '-12/x^4'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'Rewrite the function as $f(x) = 4x^{-3}$. The power rule multiplies $4$ by the exponent $-3$ and lowers the exponent by one, so $f''(x) = -12x^{-4}$, which is $-\frac{12}{x^4}$.'
          - problem: 'Differentiate $f(x) = x^{-3}$.'
            answer: '-3x^(-4)'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'The power rule brings down the exponent $-3$ and lowers the exponent by one. This gives $f''(x) = -3x^{-4}$, which is the same as $-\frac{3}{x^4}$.'
          - problem: 'Differentiate $f(x) = \frac{5}{x}$.'
            answer: '-5/x^2'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'Write $f(x) = 5x^{-1}$. The power rule gives $-5x^{-2}$, which is $-\frac{5}{x^2}$.'
          - problem: 'Find $f''(x)$ when $f(x) = \frac{3}{x} + \frac{1}{x^2}$.'
            answer: '-3/x^2 - 2/x^3'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'Rewrite each term as a power: $f(x) = 3x^{-1} + x^{-2}$. The power rule gives $-3x^{-2}$ for the first term and $-2x^{-3}$ for the second. So $f''(x) = -\frac{3}{x^2} - \frac{2}{x^3}$.'
          - problem: 'The intensity of light from a lamp at a distance of $r$ metres is $I(r) = \frac{90}{r^2}$ lux. Find $I''(r)$, the rate at which the intensity changes with distance.'
            answer: '-180/r^3'
            answer_contract: {"kind": "function", "vars": ["r"]}
            solution_sketch: 'Rewrite the intensity as $I(r) = 90r^{-2}$. The power rule gives $I''(r) = -180r^{-3}$, which is $-\frac{180}{r^3}$. The negative sign shows that the intensity falls as the distance grows.'
          - problem: 'At constant temperature, the pressure of a gas in a cylinder is $P = \frac{240}{V}$ kilopascals when its volume is $V$ litres. At what rate, in kilopascals per litre, does the pressure change with the volume when $V = 4$?'
            answer: '-15'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Write $P = 240V^{-1}$, so $\frac{dP}{dV} = -240V^{-2} = -\frac{240}{V^2}$. At $V = 4$ this is $-\frac{240}{16} = -15$. The pressure falls by $15$ kilopascals for each extra litre.'
          - problem: 'Sam differentiates $f(x) = \frac{1}{x^2}$ and gets $\frac{2}{x^3}$. What is the correct derivative?'
            answer: '-2/x^3'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'Write $f(x) = x^{-2}$. The power rule gives $-2x^{-3}$, so the sign is negative. Sam dropped the minus sign, and the correct derivative is $-\frac{2}{x^3}$.'
          - problem: 'Find the slope of the curve $y = \frac{8}{x^2}$ at the point $(2, 2)$.'
            answer: '-2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Write $y = 8x^{-2}$, so $y'' = -16x^{-3}$. At $x = 2$ the slope is $-\frac{16}{8} = -2$.'
          - problem: 'Differentiate $g(t) = \frac{7}{t^4} - 2t^{-1}$.'
            answer: '-28/t^5 + 2/t^2'
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: 'Write $g(t) = 7t^{-4} - 2t^{-1}$. The power rule gives $-28t^{-5}$ for the first term and $+2t^{-2}$ for the second. So $g''(t) = -\frac{28}{t^5} + \frac{2}{t^2}$.'
        constraints: "rewrite reciprocals as negative powers first; exponents -1 to -3"
      - id: kp2
        name: Fractional exponents and radicals
        key_prerequisites: [rational-exponents, derivatives-of-polynomials]
        exemplars:
          - problem: 'Differentiate $f(x) = \sqrt{x}$.'
            answer: '1/(2sqrt(x))'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'Write $f(x) = x^{1/2}$. The power rule gives $f''(x) = \frac{1}{2}x^{-1/2}$, which is $\frac{1}{2\sqrt{x}}$.'
          - problem: 'Differentiate $f(x) = x^{2/3}$.'
            answer: '(2/3)x^(-1/3)'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'The power rule multiplies by $\frac{2}{3}$ and lowers the exponent by one. Since $\frac{2}{3} - 1 = -\frac{1}{3}$, we get $f''(x) = \frac{2}{3}x^{-1/3}$.'
          - problem: 'Differentiate $f(x) = \sqrt[3]{x}$.'
            answer: '(1/3)x^(-2/3)'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'Write $f(x) = x^{1/3}$. The power rule gives $\frac{1}{3}x^{1/3 - 1} = \frac{1}{3}x^{-2/3}$.'
          - problem: 'Find $f''(x)$ when $f(x) = x^{5/2}$.'
            answer: '(5/2)x^(3/2)'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'The power rule multiplies by $\frac{5}{2}$ and lowers the exponent by one. Since $\frac{5}{2} - 1 = \frac{3}{2}$, we get $f''(x) = \frac{5}{2}x^{3/2}$.'
          - problem: 'Differentiate $f(x) = \sqrt{x^7}$.'
            answer: '(7/2)x^(5/2)'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'Write $f(x) = x^{7/2}$. The power rule gives $\frac{7}{2}x^{7/2 - 1} = \frac{7}{2}x^{5/2}$.'
          - problem: 'The period of a pendulum of length $L$ metres is about $T(L) = 2\sqrt{L}$ seconds. At what rate, in seconds per metre, does the period change with the length when $L = 4$?'
            answer: '1/2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Write $T(L) = 2L^{1/2}$, so $T''(L) = L^{-1/2} = \frac{1}{\sqrt{L}}$. At $L = 4$ this is $\frac{1}{2}$. The period grows by half a second for each extra metre.'
          - problem: 'A model for the distance to the horizon from a height of $h$ metres is $d(h) = 4\sqrt{h}$ kilometres. At what rate, in kilometres per metre, does $d$ change with $h$ when $h = 25$?'
            answer: '2/5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Write $d(h) = 4h^{1/2}$, so $d''(h) = 2h^{-1/2} = \frac{2}{\sqrt{h}}$. At $h = 25$ this is $\frac{2}{5}$. A climb of one metre extends the view by $\frac{2}{5}$ of a kilometre.'
          - problem: 'Find the slope of the curve $y = \sqrt[3]{x}$ at the point $(8, 2)$.'
            answer: '1/12'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Write $y = x^{1/3}$, so $y'' = \frac{1}{3}x^{-2/3}$. At $x = 8$ we have $8^{2/3} = 4$, so the slope is $\frac{1}{3 \cdot 4} = \frac{1}{12}$.'
          - problem: 'Mia differentiates $f(x) = x^{3/4}$ and writes $\frac{3}{4}x^{7/4}$. What is the correct derivative?'
            answer: '(3/4)x^(-1/4)'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'The exponent must go down by one, not up. Since $\frac{3}{4} - 1 = -\frac{1}{4}$, the correct derivative is $\frac{3}{4}x^{-1/4}$.'
        constraints: "rewrite radicals as fractional powers first; exponents like 1/2, 1/3, 2/3"
      - id: kp3
        name: Rewrite before differentiating
        key_prerequisites: [negative-zero-exponents, rational-exponents]
        try_first:
          problem: 'Let $f(x) = \sqrt{x}\,(x + 1)$. Find $f''(1)$.'
          answer_contract: {"kind": "exact"}
          answer: '2'
          reveal: 'Multiplying out gives $x^{3/2} + x^{1/2}$, and its derivative at $1$ is $\frac{3}{2} + \frac{1}{2} = 2$. Rewriting a product or a fraction as powers is the idea of this lesson.'
        exemplars:
          - problem: 'Differentiate $f(x) = \frac{x^2 + 1}{x}$.'
            answer: '1 - 1/x^2'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'Split the fraction: $f(x) = x + x^{-1}$. The power rule gives $f''(x) = 1 - x^{-2}$, which is $1 - \frac{1}{x^2}$.'
          - problem: 'Differentiate $f(x) = \frac{3}{\sqrt{x}}$.'
            answer: '-(3/2)x^(-3/2)'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'Write $f(x) = 3x^{-1/2}$. The power rule gives $3 \cdot \left(-\frac{1}{2}\right)x^{-3/2} = -\frac{3}{2}x^{-3/2}$.'
          - problem: 'Differentiate $f(x) = x^2\sqrt{x}$.'
            answer: '(5/2)x^(3/2)'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'Combine the powers: $f(x) = x^{2}x^{1/2} = x^{5/2}$. The power rule gives $f''(x) = \frac{5}{2}x^{3/2}$.'
          - problem: 'Find $f''(x)$ when $f(x) = \frac{x^3 + 4x}{x^2}$.'
            answer: '1 - 4/x^2'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'Split the fraction: $f(x) = x + 4x^{-1}$. The power rule gives $1$ for the first term and $-4x^{-2}$ for the second. So $f''(x) = 1 - \frac{4}{x^2}$.'
          - problem: 'Differentiate $f(x) = \sqrt{x}\,(x^3 + 2)$.'
            answer: '(7/2)x^(5/2) + x^(-1/2)'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'Distribute the root as a power: $f(x) = x^{7/2} + 2x^{1/2}$. The power rule gives $\frac{7}{2}x^{5/2}$ for the first term and $x^{-1/2}$ for the second.'
          - problem: 'Differentiate $f(x) = \frac{5x^4 - 2x}{x^3}$.'
            answer: '5 + 4/x^3'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'Split the fraction: $f(x) = 5x - 2x^{-2}$. The power rule gives $5$ for the first term and $4x^{-3}$ for the second. So $f''(x) = 5 + \frac{4}{x^3}$.'
          - problem: 'The total cost of making $x$ items is $C(x) = 500 + 20x + x^2$ dollars, so the average cost per item is $\frac{C(x)}{x}$ dollars. At what rate, in dollars per item, is the average cost changing when $x = 10$?'
            answer: '-4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The average cost is $\frac{500 + 20x + x^2}{x} = 500x^{-1} + 20 + x$. Its derivative is $-500x^{-2} + 1$. At $x = 10$ this is $-5 + 1 = -4$, so the average cost is falling by $4$ dollars per extra item.'
          - problem: 'A rectangle has width $x$ metres and length $\sqrt{x}$ metres. At what rate, in square metres per metre, does the area change with $x$ when $x = 16$?'
            answer: '6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The area is $A = x \cdot x^{1/2} = x^{3/2}$. The power rule gives $A'' = \frac{3}{2}x^{1/2}$. At $x = 16$ this is $\frac{3}{2} \cdot 4 = 6$.'
          - problem: 'Lee writes $\frac{x^2 + 6}{x} = x^2 + 6$ and differentiates to get $2x$. What is the correct derivative of $f(x) = \frac{x^2 + 6}{x}$?'
            answer: '1 - 6/x^2'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'Dividing by $x$ divides both terms, so $f(x) = x + 6x^{-1}$. The power rule gives $f''(x) = 1 - 6x^{-2} = 1 - \frac{6}{x^2}$. Lee divided only the first term and forgot the second.'
        constraints: "quotients and products that collapse into single powers or sums of powers; no quotient rule"
    diagnostic_exemplar:
      problem: 'Differentiate $f(x) = \frac{x^2 - 3}{\sqrt{x}}$ by rewriting it first.'
      answer: '(3/2)x^(1/2) + (3/2)x^(-3/2)'
      solution_sketch: 'Rewrite as $f(x) = x^{3/2} - 3x^{-1/2}$; then $f''(x) = \frac{3}{2}x^{1/2} + \frac{3}{2}x^{-3/2}$.'
    anki_seeds:
      - front: "Power rule: d/dx x^n = ?"
        back: "n·x^(n-1), for any real exponent n"
        type: basic
      - front: "d/dx √x = ?"
        back: "1/(2√x)"
        type: basic
      - front: "d/dx (1/x) = ?"
        back: "-1/x^2"
        type: basic

  - id: product-rule
    name: The Product Rule
    core: true
    difficulty: 0.58
    drill: false
    answer_kind: expression
    expected_time_secs: 120
    prerequisites:
      - id: derivative-power-rule
        weight: 0.8
        key: true
      - id: polynomial-multiplication
        weight: 0.4
      - id: derivatives-of-polynomials
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: Apply the product rule
        key_prerequisites: [derivative-power-rule]
        try_first:
          problem: 'Let $f(x) = x \cdot x$. Find $f''(3)$.'
          answer_contract: {"kind": "exact"}
          answer: '6'
          reveal: 'Since $f(x) = x^2$, we get $f''(3) = 6$. The product of the two derivatives is only $1$, so the derivative of a product is not the product of the derivatives.'
        exemplars:
          - problem: 'Use the product rule to differentiate $f(x) = x^2(x^3 + 1)$.'
            answer: '5x^4 + 2x'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'Take $u = x^2$ and $v = x^3 + 1$, so $u'' = 2x$ and $v'' = 3x^2$. Then $f''(x) = 2x(x^3 + 1) + x^2 \cdot 3x^2 = 2x^4 + 2x + 3x^4 = 5x^4 + 2x$.'
          - problem: 'Differentiate $f(x) = (x^2 + 1)(x^3 - 2x)$.'
            answer: '5x^4 - 3x^2 - 2'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'Take $u = x^2 + 1$ and $v = x^3 - 2x$. The product rule gives $2x(x^3 - 2x) + (x^2 + 1)(3x^2 - 2)$. Expand and collect like terms to get $5x^4 - 3x^2 - 2$.'
          - problem: 'Differentiate $f(x) = (x^3 - 2x + 4)(x + 3)$.'
            answer: '4x^3 + 9x^2 - 4x - 2'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'Take $u = x^3 - 2x + 4$ and $v = x + 3$, so $u'' = 3x^2 - 2$ and $v'' = 1$. Then $f''(x) = (3x^2 - 2)(x + 3) + (x^3 - 2x + 4) = 4x^3 + 9x^2 - 4x - 2$.'
          - problem: 'Differentiate $f(x) = (x^2 + 3x)(x^2 - x + 2)$.'
            answer: '4x^3 + 6x^2 - 2x + 6'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'Take $u = x^2 + 3x$ and $v = x^2 - x + 2$, so $u'' = 2x + 3$ and $v'' = 2x - 1$. Then $f''(x) = (2x + 3)(x^2 - x + 2) + (x^2 + 3x)(2x - 1)$, which expands to $4x^3 + 6x^2 - 2x + 6$.'
          - problem: 'Differentiate $f(x) = \sqrt{x}\,(x^2 - 3)$.'
            answer: '(5/2)x^(3/2) - (3/2)x^(-1/2)'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'Take $u = x^{1/2}$ and $v = x^2 - 3$, so $u'' = \frac{1}{2}x^{-1/2}$ and $v'' = 2x$. Then $f''(x) = \frac{1}{2}x^{-1/2}(x^2 - 3) + x^{1/2} \cdot 2x = \frac{5}{2}x^{3/2} - \frac{3}{2}x^{-1/2}$.'
          - problem: 'A shop sells $q$ items at a price of $p = 50 - 2q$ dollars each, so the revenue is $R = q\,p$. At what rate, in dollars per item, does the revenue change with $q$ when $q = 10$?'
            answer: '10'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'By the product rule, $R'' = 1 \cdot (50 - 2q) + q \cdot (-2) = 50 - 4q$. At $q = 10$ this is $50 - 40 = 10$. Each extra item sold adds about $10$ dollars of revenue.'
          - problem: 'At time $t$ seconds a rectangle is $(2t + 1)$ metres wide and $(t^2 + 3)$ metres long. At what rate, in square metres per second, is its area changing when $t = 2$?'
            answer: '34'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The area is the width times the length, so the product rule gives $A'' = 2(t^2 + 3) + (2t + 1)(2t)$. At $t = 2$ this is $2 \cdot 7 + 5 \cdot 4 = 14 + 20 = 34$.'
          - problem: 'Ana differentiates $f(x) = x^2(x + 1)$ by multiplying the derivatives, $2x \cdot 1$, and gets $2x$. What is the correct derivative?'
            answer: '3x^2 + 2x'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'The product rule gives $2x(x + 1) + x^2 \cdot 1 = 2x^2 + 2x + x^2 = 3x^2 + 2x$. Expanding first gives $x^3 + x^2$, with the same derivative. Ana left out the term $x^2 \cdot 1$.'
        constraints: "two polynomial factors of degree ≤ 3; answers expandable for checking"
      - id: kp2
        name: Verify against expansion
        key_prerequisites: [derivative-power-rule, polynomial-multiplication]
        exemplars:
          - problem: 'Differentiate $f(x) = (x + 1)(x - 3)$ in two ways, with the product rule and by expanding first.'
            answer: '2x - 2'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'The product rule gives $1 \cdot (x - 3) + (x + 1) \cdot 1 = 2x - 2$. Expanding gives $x^2 - 2x - 3$, whose derivative is also $2x - 2$.'
          - problem: 'Differentiate $f(x) = (x + 2)(x + 5)$ in two ways, with the product rule and by expanding first.'
            answer: '2x + 7'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'The product rule gives $1 \cdot (x + 5) + (x + 2) \cdot 1 = 2x + 7$. Expanding gives $x^2 + 7x + 10$, whose derivative is also $2x + 7$.'
          - problem: 'Differentiate $f(x) = (2x + 1)(x - 5)$ in two ways, with the product rule and by expanding first.'
            answer: '4x - 9'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'The product rule gives $2(x - 5) + (2x + 1) \cdot 1 = 4x - 9$. Expanding gives $2x^2 - 9x - 5$, whose derivative is also $4x - 9$.'
          - problem: 'Differentiate $f(x) = (x^2 + 1)(x + 2)$ in two ways, with the product rule and by expanding first.'
            answer: '3x^2 + 4x + 1'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'The product rule gives $2x(x + 2) + (x^2 + 1) \cdot 1 = 3x^2 + 4x + 1$. Expanding gives $x^3 + 2x^2 + x + 2$, whose derivative is also $3x^2 + 4x + 1$.'
          - problem: 'Differentiate $x^3 \cdot x^2$ with the product rule. Check that the result is the derivative of $x^5$.'
            answer: '5x^4'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'The product rule gives $3x^2 \cdot x^2 + x^3 \cdot 2x = 3x^4 + 2x^4 = 5x^4$. This is also the derivative of $x^5$.'
          - problem: 'A rectangular plot is $(x + 4)$ metres long and $(x - 1)$ metres wide. At what rate, in square metres per metre, does its area change with $x$ when $x = 6$? Check your answer by expanding the area first.'
            answer: '15'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The product rule gives $A'' = (x - 1) + (x + 4) = 2x + 3$. Expanding gives $A = x^2 + 3x - 4$, with the same derivative $2x + 3$. At $x = 6$ the rate is $12 + 3 = 15$.'
          - problem: 'A theatre sells $(20 - x)$ tickets at a price of $(x + 5)$ dollars each, so the revenue is $R(x) = (20 - x)(x + 5)$. Find $R''(x)$.'
            answer: '15 - 2x'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'The product rule gives $R''(x) = -1 \cdot (x + 5) + (20 - x) \cdot 1 = 15 - 2x$. Expanding gives $R = -x^2 + 15x + 100$, with the same derivative $15 - 2x$.'
          - problem: 'Differentiate $f(x) = (x^2 + 3)(x - 1)$ in two ways, with the product rule and by expanding first.'
            answer: '3x^2 - 2x + 3'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'The product rule gives $2x(x - 1) + (x^2 + 3) \cdot 1 = 3x^2 - 2x + 3$. Expanding gives $x^3 - x^2 + 3x - 3$, whose derivative is also $3x^2 - 2x + 3$.'
        constraints: "products that expand easily; the point is that both routes agree"
      - id: kp3
        name: Product rule with table values
        key_prerequisites: [derivative-power-rule]
        exemplars:
          - problem: 'Let $f(2) = 3$, $f''(2) = -1$, $g(2) = 5$, and $g''(2) = 4$. Find $(fg)''(2)$.'
            answer: '7'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The product rule gives $(fg)''(2) = f''(2)g(2) + f(2)g''(2) = (-1)(5) + (3)(4) = -5 + 12 = 7$.'
          - problem: 'Given $f(1) = 2$, $f''(1) = 3$, $g(1) = -4$, and $g''(1) = 1$, find $(fg)''(1)$.'
            answer: '-10'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The product rule gives $(fg)''(1) = f''(1)g(1) + f(1)g''(1) = (3)(-4) + (2)(1) = -12 + 2 = -10$.'
          - problem: 'A table gives $f(3) = 2$, $f''(3) = 5$, $g(3) = 4$, and $g''(3) = 6$. Find $(fg)''(3)$.'
            answer: '32'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The product rule gives $(fg)''(3) = f''(3)g(3) + f(3)g''(3)$. Substitute the table values: $(5)(4) + (2)(6) = 20 + 12 = 32$.'
          - problem: 'At $x = 4$, the functions $f$ and $g$ have $f(4) = -2$, $f''(4) = 3$, $g(4) = 5$, and $g''(4) = -1$. Compute $(fg)''(4)$.'
            answer: '17'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The product rule gives $(fg)''(4) = f''(4)g(4) + f(4)g''(4)$. Substitute: $(3)(5) + (-2)(-1) = 15 + 2 = 17$.'
          - problem: 'The table gives $f(5) = 3$, $f''(5) = 4$, $g(5) = 2$, and $(fg)''(5) = 5$. Find $g''(5)$.'
            answer: '-1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The product rule gives $5 = f''(5)g(5) + f(5)g''(5) = (4)(2) + 3g''(5) = 8 + 3g''(5)$. Solve: $3g''(5) = -3$, so $g''(5) = -1$.'
          - problem: 'A company''s revenue is $R = pq$, where the price $p$ and the quantity $q$ depend on time $t$. At $t = 5$, $p = 6$, $q = 3$, $p'' = 2$, and $q'' = -1$. Find $R''(5)$.'
            answer: '0'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The product rule gives $R''(5) = p''q + pq'' = (2)(3) + (6)(-1) = 6 - 6 = 0$. The revenue is not changing at that moment.'
          - problem: 'A rectangle is $8$ metres long and $5$ metres wide. The length grows at $2$ metres per second and the width shrinks at $1$ metre per second. At what rate, in square metres per second, is the area changing?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The area is $A = \ell w$, so $A'' = \ell'' w + \ell w'' = (2)(5) + (8)(-1) = 10 - 8 = 2$. The area is growing at $2$ square metres per second.'
          - problem: 'Tom says that $(fg)''(2) = f''(2)\,g''(2)$. For $f(2) = 4$, $f''(2) = 3$, $g(2) = 2$, and $g''(2) = 5$ he gets $15$. What is the correct value of $(fg)''(2)$?'
            answer: '26'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The product rule gives $(fg)''(2) = f''(2)g(2) + f(2)g''(2) = (3)(2) + (4)(5) = 6 + 20 = 26$. Tom''s product $f''g''$ leaves out both values of $f$ and $g$.'
        constraints: "single-digit table values; one application of f'g + fg'"
    diagnostic_exemplar:
      problem: 'Differentiate $f(x) = x^3(x^2 + 1)$.'
      answer: "5x^4 + 3x^2"
      solution_sketch: 'Product rule: $3x^2(x^2 + 1) + x^3(2x) = 3x^4 + 3x^2 + 2x^4$.'
    anki_seeds:
      - front: "Product rule: (fg)' = ?"
        back: "f'g + fg'"
        type: basic
      - front: "(fg)' equals f'g' — true or false?"
        back: "False — the product rule is f'g + fg'"
        type: basic

  - id: quotient-rule
    name: The Quotient Rule
    core: true
    difficulty: 0.6
    drill: false
    answer_kind: expression
    expected_time_secs: 150
    prerequisites:
      - id: product-rule
        weight: 0.6
        key: true
      - id: derivative-power-rule
        weight: 0.6
        key: true
      - id: rational-expressions
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: Apply the quotient rule
        key_prerequisites: [derivative-power-rule, product-rule]
        try_first:
          problem: 'Is the derivative of $\frac{x}{x + 1}$ equal to $\frac{1}{1}$, the derivative of the top over the derivative of the bottom?'
          answer_contract: {"kind": "label", "options": [["yes", "it is equal", "equal"], ["no", "it is not equal", "not equal"]]}
          answer: 'no'
          reveal: 'The derivative of $\frac{x}{x + 1}$ is $\frac{1}{(x + 1)^2}$, which is not $1$. A quotient needs the quotient rule.'
        exemplars:
          - problem: 'Differentiate $f(x) = \frac{x}{x + 1}$.'
            answer: '1/(x + 1)^2'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'Take $u = x$ and $v = x + 1$. The quotient rule gives $\frac{(x + 1) \cdot 1 - x \cdot 1}{(x + 1)^2}$. The numerator simplifies to $1$, so $f''(x) = \frac{1}{(x + 1)^2}$.'
          - problem: 'Differentiate $f(x) = \frac{2x + 1}{x - 3}$.'
            answer: '-7/(x - 3)^2'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'The quotient rule gives $\frac{2(x - 3) - (2x + 1)}{(x - 3)^2}$. The numerator is $2x - 6 - 2x - 1 = -7$, so $f''(x) = -\frac{7}{(x - 3)^2}$.'
          - problem: 'Differentiate $f(x) = \frac{x^2}{x^2 + 1}$.'
            answer: '2x/(x^2 + 1)^2'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'The quotient rule gives $\frac{2x(x^2 + 1) - x^2 \cdot 2x}{(x^2 + 1)^2}$. The numerator is $2x^3 + 2x - 2x^3 = 2x$, so $f''(x) = \frac{2x}{(x^2 + 1)^2}$.'
          - problem: 'Find $f''(x)$ when $f(x) = \frac{3x + 2}{x + 5}$.'
            answer: '13/(x + 5)^2'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'The quotient rule gives $\frac{3(x + 5) - (3x + 2) \cdot 1}{(x + 5)^2}$. The numerator is $3x + 15 - 3x - 2 = 13$, so $f''(x) = \frac{13}{(x + 5)^2}$.'
          - problem: 'Find $f''(x)$ when $f(x) = \frac{x^2 + 1}{x^2 + 4}$.'
            answer: '6x/(x^2 + 4)^2'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'The quotient rule gives $\frac{2x(x^2 + 4) - (x^2 + 1)(2x)}{(x^2 + 4)^2}$. Factor $2x$ from the numerator: $2x[(x^2 + 4) - (x^2 + 1)] = 6x$. So $f''(x) = \frac{6x}{(x^2 + 4)^2}$.'
          - problem: 'Find $f''(x)$ when $f(x) = \frac{3x}{x^2 + 2}$.'
            answer: '(6 - 3x^2)/(x^2 + 2)^2'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'The quotient rule gives numerator $3(x^2 + 2) - 3x \cdot 2x$ over $(x^2 + 2)^2$. The numerator is $3x^2 + 6 - 6x^2 = 6 - 3x^2$. So $f''(x) = \frac{6 - 3x^2}{(x^2 + 2)^2}$.'
          - problem: 'The concentration of a drug in the blood is $C(t) = \frac{5t}{t^2 + 4}$ milligrams per litre, $t$ hours after an injection. At what rate, in milligrams per litre per hour, is the concentration changing when $t = 1$?'
            answer: '3/5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The quotient rule gives $C''(t) = \frac{5(t^2 + 4) - 5t \cdot 2t}{(t^2 + 4)^2} = \frac{20 - 5t^2}{(t^2 + 4)^2}$. At $t = 1$ this is $\frac{15}{25} = \frac{3}{5}$, so the concentration is still rising.'
          - problem: 'After $t$ hours of study a student''s score is $S(t) = \frac{80t}{t + 4}$ points. At what rate, in points per hour, is the score changing when $t = 4$?'
            answer: '5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The quotient rule gives $S''(t) = \frac{80(t + 4) - 80t}{(t + 4)^2} = \frac{320}{(t + 4)^2}$. At $t = 4$ this is $\frac{320}{64} = 5$ points per hour.'
          - problem: 'Jo says that the derivative of $f(x) = \frac{x^2}{x + 1}$ is $\frac{2x}{1} = 2x$, from the derivatives of the top and the bottom. What is the correct derivative?'
            answer: '(x^2 + 2x)/(x + 1)^2'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'The quotient rule gives $\frac{2x(x + 1) - x^2 \cdot 1}{(x + 1)^2}$. The numerator is $2x^2 + 2x - x^2 = x^2 + 2x$. So $f''(x) = \frac{x^2 + 2x}{(x + 1)^2}$.'
        constraints: "low-degree numerator and denominator; numerator of the result simplifies to one or two terms"
      - id: kp2
        name: Rewrite instead when the quotient rule is overkill
        key_prerequisites: [derivative-power-rule]
        exemplars:
          - problem: 'Differentiate $f(x) = \frac{6}{x^3}$.'
            answer: '-18/x^4'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'Write $f(x) = 6x^{-3}$. The power rule gives $f''(x) = -18x^{-4}$, which is $-\frac{18}{x^4}$. The quotient rule is not needed.'
          - problem: 'Differentiate $f(x) = \frac{x^2 + 3x}{x}$.'
            answer: '1'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'Divide each term by $x$: $f(x) = x + 3$ for $x \neq 0$. The derivative of $x + 3$ is $1$.'
          - problem: 'Differentiate $f(x) = \frac{9}{\sqrt{x}}$.'
            answer: '-9/(2x sqrt(x))'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'Write $f(x) = 9x^{-1/2}$. The power rule gives $f''(x) = -\frac{9}{2}x^{-3/2}$, which is $-\frac{9}{2x\sqrt{x}}$.'
          - problem: 'The average cost of printing $n$ posters is $A(n) = \frac{120}{n}$ dollars per poster. At what rate, in dollars per poster, does the average cost change with $n$ when $n = 4$?'
            answer: '-15/2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Write $A(n) = 120n^{-1}$, so $A''(n) = -120n^{-2} = -\frac{120}{n^2}$. At $n = 4$ this is $-\frac{120}{16} = -\frac{15}{2}$, which is $-7.5$. The average cost falls as more posters are printed.'
          - problem: 'Differentiate $f(x) = \frac{x^3 - 5x^2}{x}$.'
            answer: '2x - 5'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'Divide each term by $x$: $f(x) = x^2 - 5x$ for $x \neq 0$. The power rule gives $f''(x) = 2x - 5$.'
          - problem: 'The depth of water in a tank is $h(t) = \frac{t^3 + 9t}{t}$ centimetres, $t$ minutes after the tap is opened ($t > 0$). At what rate, in centimetres per minute, is the depth changing when $t = 3$?'
            answer: '6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Divide each term by $t$: $h(t) = t^2 + 9$. The derivative is $h''(t) = 2t$. At $t = 3$ the rate is $6$ centimetres per minute.'
          - problem: 'Differentiate $f(x) = \frac{4x^3 + 2x}{x}$.'
            answer: '8x'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'Divide each term by $x$: $f(x) = 4x^2 + 2$ for $x \neq 0$. The power rule gives $f''(x) = 8x$.'
          - problem: 'Kim differentiates the top and the bottom of $f(x) = \frac{x^4}{x^2}$ separately and writes $\frac{4x^3}{2x} = 2x^2$. What is the correct derivative of $f$?'
            answer: '2x'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'Simplify first: $f(x) = x^2$ for $x \neq 0$. The derivative is $2x$. Kim''s method is not a rule: the derivative of a quotient is not the quotient of the derivatives.'
        constraints: "constant numerators or cancellable quotients; the student picks the shortcut"
      - id: kp3
        name: Quotient rule with table values
        key_prerequisites: [product-rule, derivative-power-rule]
        exemplars:
          - problem: 'Given $f(3) = 2$, $f''(3) = 4$, $g(3) = -1$, and $g''(3) = 5$, find $\left(\frac{f}{g}\right)''(3)$.'
            answer: '-14'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The quotient rule gives $\frac{f''g - fg''}{g^2} = \frac{4(-1) - 2 \cdot 5}{(-1)^2} = \frac{-14}{1} = -14$.'
          - problem: 'Given $f(0) = 6$, $f''(0) = 2$, $g(0) = 3$, and $g''(0) = 1$, find $\left(\frac{f}{g}\right)''(0)$.'
            answer: '0'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The quotient rule gives $\frac{2 \cdot 3 - 6 \cdot 1}{3^2} = \frac{0}{9} = 0$. The numerator is zero, so the quotient has a horizontal tangent there.'
          - problem: 'At $x = 4$, the functions $f$ and $g$ have $f(4) = 7$, $f''(4) = 2$, $g(4) = 5$, and $g''(4) = 3$. Find $\left(\frac{f}{g}\right)''(4)$.'
            answer: '-11/25'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The quotient rule gives $\frac{f''g - fg''}{g^2} = \frac{2 \cdot 5 - 7 \cdot 3}{5^2}$. The numerator is $10 - 21 = -11$ and the denominator is $25$. So the value is $-\frac{11}{25}$.'
          - problem: 'At $x = 2$, $f(2) = 3$, $g(2) = 3$, and $g''(2) = 1$. Also $\left(\frac{f}{g}\right)''(2) = 2$. Find $f''(2)$.'
            answer: '7'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The quotient rule gives $2 = \frac{f''(2) \cdot 3 - 3 \cdot 1}{3^2}$. Multiply both sides by $9$: $18 = 3f''(2) - 3$. Then $3f''(2) = 21$, so $f''(2) = 7$.'
          - problem: 'The efficiency of a device is $E(t) = \frac{f(t)}{g(t)}$. At $t = 2$, $f(2) = 6$, $f''(2) = 5$, $g(2) = 3$, and $g''(2) = 2$. Find $E''(2)$.'
            answer: '1/3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The quotient rule gives $E''(2) = \frac{f''g - fg''}{g^2} = \frac{5 \cdot 3 - 6 \cdot 2}{3^2}$. The numerator is $15 - 12 = 3$, so $E''(2) = \frac{3}{9} = \frac{1}{3}$.'
          - problem: 'At $x = 1$, let $h(x) = \frac{g(x)}{f(x)}$ with $f(1) = 4$, $f''(1) = 3$, $g(1) = 7$, and $g''(1) = 2$. Find $h''(1)$.'
            answer: '-13/16'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'For $h = \frac{g}{f}$ the quotient rule gives $h'' = \frac{g''f - gf''}{f^2} = \frac{2 \cdot 4 - 7 \cdot 3}{4^2}$. The numerator is $8 - 21 = -13$ and the denominator is $16$, so $h''(1) = -\frac{13}{16}$.'
          - problem: 'A shop''s monthly revenue is $R = 120$ thousand dollars and rising by $9$ thousand per month. It has $N = 40$ customers, rising by $2$ per month. At what rate, in thousand dollars per customer per month, is the revenue per customer $\frac{R}{N}$ changing?'
            answer: '3/40'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The quotient rule gives $\left(\frac{R}{N}\right)'' = \frac{R''N - RN''}{N^2} = \frac{9 \cdot 40 - 120 \cdot 2}{40^2}$. The numerator is $360 - 240 = 120$ and the denominator is $1600$. So the rate is $\frac{120}{1600} = \frac{3}{40}$.'
          - problem: 'Raj says that $\left(\frac{f}{g}\right)''(1) = \frac{f''(1)}{g''(1)}$. For $f(1) = 6$, $f''(1) = 4$, $g(1) = 2$, and $g''(1) = 3$ he gets $\frac{4}{3}$. What is the correct value?'
            answer: '-5/2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The quotient rule gives $\frac{f''g - fg''}{g^2} = \frac{4 \cdot 2 - 6 \cdot 3}{2^2}$. The numerator is $8 - 18 = -10$ and the denominator is $4$, so the value is $-\frac{5}{2}$.'
        constraints: "single-digit table values; g at the point is nonzero"
    diagnostic_exemplar:
      problem: 'Differentiate $f(x) = \frac{x}{x + 3}$.'
      answer: "3/(x + 3)^2"
      solution_sketch: 'Quotient rule: $\frac{1 \cdot (x+3) - x \cdot 1}{(x+3)^2} = \frac{3}{(x+3)^2}$.'
    anki_seeds:
      - front: "Quotient rule: (f/g)' = ?"
        back: "(f'g - fg') / g^2 — the minus term is the numerator's, in that order"
        type: basic
      - front: "Before reaching for the quotient rule on c/x^n, instead..."
        back: "rewrite as c·x^(-n) and use the power rule"
        type: basic

  - id: product-quotient-rules
    name: Product and Quotient Rules
    core: true
    difficulty: 0.62
    drill: false
    answer_kind: expression
    expected_time_secs: 150
    prerequisites:
      - id: product-rule
        weight: 0.7
        key: true
      - id: quotient-rule
        weight: 0.7
        key: true
      - id: tangent-line-equation
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: Evaluate a derivative at a point
        key_prerequisites: [product-rule, quotient-rule]
        exemplars:
          - problem: 'For $g(x) = x^3(x - 4)$, find $g''(2)$.'
            answer: '-16'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The product rule gives $g''(x) = 3x^2(x - 4) + x^3 = 4x^3 - 12x^2$. At $x = 2$ this is $32 - 48 = -16$.'
          - problem: 'For $f(x) = \frac{x^2 - 1}{x + 2}$, find $f''(1)$.'
            answer: '2/3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The quotient rule gives $f''(x) = \frac{2x(x + 2) - (x^2 - 1)}{(x + 2)^2} = \frac{x^2 + 4x + 1}{(x + 2)^2}$. At $x = 1$ this is $\frac{6}{9} = \frac{2}{3}$.'
          - problem: 'For $g(x) = x^2(x + 3)$, find $g''(-1)$.'
            answer: '-3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Expand first: $g(x) = x^3 + 3x^2$. The power rule gives $g''(x) = 3x^2 + 6x$. At $x = -1$ this is $3 - 6 = -3$.'
          - problem: 'For $f(x) = \frac{x + 3}{x - 1}$, find $f''(2)$.'
            answer: '-4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The quotient rule gives $f''(x) = \frac{(x - 1) - (x + 3)}{(x - 1)^2} = \frac{-4}{(x - 1)^2}$. At $x = 2$ the denominator is $1$, so $f''(2) = -4$.'
          - problem: 'For $f(x) = \frac{x + 1}{x^2 + 1}$, find $f''(1)$.'
            answer: '-1/2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The quotient rule gives $f''(x) = \frac{(x^2 + 1) - (x + 1)(2x)}{(x^2 + 1)^2}$. At $x = 1$ the numerator is $2 - 4 = -2$ and the denominator is $4$. So $f''(1) = -\frac{2}{4} = -\frac{1}{2}$.'
          - problem: 'For $r(x) = (x^2 - 2x)(x + 3)$, find $r''(-1)$.'
            answer: '-5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Expand first: $r(x) = x^3 + x^2 - 6x$. The power rule gives $r''(x) = 3x^2 + 2x - 6$. At $x = -1$ this is $3 - 2 - 6 = -5$.'
          - problem: 'A drone''s height is $h(t) = \frac{20t}{t^2 + 1}$ metres, $t$ seconds after take-off. What is its vertical velocity, in metres per second, when $t = 2$?'
            answer: '-12/5'
            answer_contract: {"kind": "unit", "quantity": "speed", "unit": "m/s", "allow_omitted": true}
            solution_sketch: 'The quotient rule gives $h''(t) = \frac{20(t^2 + 1) - 20t \cdot 2t}{(t^2 + 1)^2} = \frac{20 - 20t^2}{(t^2 + 1)^2}$. At $t = 2$ this is $\frac{-60}{25} = -\frac{12}{5}$. The drone is descending at $2.4$ metres per second.'
          - problem: 'A rocket''s mass is $m(t) = 100 - 2t$ kilograms and its speed is $v(t) = t^2 + 5$ metres per second. Its momentum is $p = mv$. At what rate, in newtons, is the momentum changing when $t = 5$?'
            answer: '840'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The product rule gives $p'' = m''v + mv'' = (-2)(t^2 + 5) + (100 - 2t)(2t)$. At $t = 5$ we have $m = 90$, $v = 30$, $m'' = -2$, and $v'' = 10$. Hence $p'' = (-2)(30) + (90)(10) = -60 + 900 = 840$.'
        constraints: "evaluation point keeps arithmetic small; answers are integers or simple fractions"
      - id: kp2
        name: Combine product and quotient structures
        key_prerequisites: [product-rule, quotient-rule]
        exemplars:
          - problem: 'Differentiate $f(x) = \frac{x(x + 2)}{x + 1}$.'
            answer: '(x^2 + 2x + 2)/(x + 1)^2'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'The numerator $x^2 + 2x$ has derivative $2x + 2$. The quotient rule gives $\frac{(2x + 2)(x + 1) - (x^2 + 2x)}{(x + 1)^2} = \frac{x^2 + 2x + 2}{(x + 1)^2}$.'
          - problem: 'Differentiate $g(x) = (x^3 - 1)(2x + 5)$.'
            answer: '8x^3 + 15x^2 - 2'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'The product rule gives $3x^2(2x + 5) + 2(x^3 - 1) = 6x^3 + 15x^2 + 2x^3 - 2$. Collecting terms gives $8x^3 + 15x^2 - 2$.'
          - problem: 'Differentiate $h(x) = \frac{x(2x + 1)}{x - 3}$.'
            answer: '(2x^2 - 12x - 3)/(x - 3)^2'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'Expand the numerator to $2x^2 + x$, which has derivative $4x + 1$. The quotient rule gives $\frac{(4x + 1)(x - 3) - (2x^2 + x)}{(x - 3)^2}$. The numerator simplifies to $2x^2 - 12x - 3$.'
          - problem: 'Differentiate $k(x) = (2x^2 - 3)(x^2 + 5x)$.'
            answer: '8x^3 + 30x^2 - 6x - 15'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'The product rule gives $(4x)(x^2 + 5x) + (2x^2 - 3)(2x + 5)$. Expand: $4x^3 + 20x^2 + 4x^3 + 10x^2 - 6x - 15$. Collecting terms gives $8x^3 + 30x^2 - 6x - 15$.'
          - problem: 'Differentiate $f(x) = \frac{x^2}{(x + 1)(x - 1)}$.'
            answer: '-2x/(x^2 - 1)^2'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'Expand the denominator: $(x + 1)(x - 1) = x^2 - 1$. The quotient rule gives $\frac{2x(x^2 - 1) - x^2 \cdot 2x}{(x^2 - 1)^2}$. The numerator is $2x^3 - 2x - 2x^3 = -2x$.'
          - problem: 'Differentiate $f(x) = x \cdot \frac{x + 1}{x - 2}$.'
            answer: '(x^2 - 4x - 2)/(x - 2)^2'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'Write $f(x) = \frac{x^2 + x}{x - 2}$. The quotient rule gives $\frac{(2x + 1)(x - 2) - (x^2 + x)}{(x - 2)^2}$. The numerator is $2x^2 - 3x - 2 - x^2 - x = x^2 - 4x - 2$.'
          - problem: 'A school sells tickets for $p$ dollars each, and the number of people who attend is $A(p) = \frac{600}{p + 2}$. The income is $I(p) = p\,A(p)$. Find $I''(p)$.'
            answer: '1200/(p + 2)^2'
            answer_contract: {"kind": "function", "vars": ["p"]}
            solution_sketch: 'The income is $I(p) = \frac{600p}{p + 2}$. The quotient rule gives $\frac{600(p + 2) - 600p}{(p + 2)^2}$. The numerator is $1200$, so $I''(p) = \frac{1200}{(p + 2)^2}$.'
          - problem: 'A rectangle has length $x + 3$ metres and width $x$ metres. The ratio of its area to its perimeter is $R(x) = \frac{x(x + 3)}{4x + 6}$. Find $R''(x)$.'
            answer: '(4x^2 + 12x + 18)/(4x + 6)^2'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'The numerator $x^2 + 3x$ has derivative $2x + 3$, and the denominator has derivative $4$. The quotient rule gives $\frac{(2x + 3)(4x + 6) - 4(x^2 + 3x)}{(4x + 6)^2}$. The numerator simplifies to $4x^2 + 12x + 18$.'
          - problem: 'Lena differentiates $g(x) = (x^2 + 1)(3x - 4)$ by multiplying the derivatives, $2x \cdot 3 = 6x$. What is the correct derivative?'
            answer: '9x^2 - 8x + 3'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'The product rule gives $2x(3x - 4) + 3(x^2 + 1) = 6x^2 - 8x + 3x^2 + 3$. Collecting terms gives $9x^2 - 8x + 3$. Lena left out the terms that carry the other factor.'
        constraints: "one product-inside-quotient and one simplify-after-product problem; integer coefficients"
      - id: kp3
        name: Tangent lines to product and quotient curves
        key_prerequisites: [product-rule, quotient-rule, tangent-line-equation]
        exemplars:
          - problem: 'Find an equation of the tangent line to $y = \frac{x}{x + 1}$ at $x = 1$.'
            answer: 'y = x/4 + 1/4'
            answer_contract: {"kind": "polynomial_relation"}
            solution_sketch: 'The quotient rule gives $y'' = \frac{1}{(x + 1)^2}$, so the slope at $x = 1$ is $\frac{1}{4}$. The point is $\left(1, \frac{1}{2}\right)$, so $y - \frac{1}{2} = \frac{1}{4}(x - 1)$, which is $y = \frac{x}{4} + \frac{1}{4}$.'
          - problem: 'Find an equation of the tangent line to $y = x^2(x - 3)$ at $x = 1$.'
            answer: 'y = -3x + 1'
            answer_contract: {"kind": "polynomial_relation"}
            solution_sketch: 'Expand: $y = x^3 - 3x^2$, so $y'' = 3x^2 - 6x$. The slope at $x = 1$ is $-3$ and the point is $(1, -2)$. Then $y + 2 = -3(x - 1)$, which is $y = -3x + 1$.'
          - problem: 'Find an equation of the tangent line to $y = (x + 2)(x - 1)$ at $x = 1$.'
            answer: 'y = 3x - 3'
            answer_contract: {"kind": "polynomial_relation"}
            solution_sketch: 'The product rule gives $y'' = (x - 1) + (x + 2) = 2x + 1$. At $x = 1$ the point is $(1, 0)$ and the slope is $3$. The line is $y = 3(x - 1) = 3x - 3$.'
          - problem: 'Find an equation of the tangent line to $y = \frac{3x + 1}{x + 2}$ at $x = 0$.'
            answer: 'y = 5x/4 + 1/2'
            answer_contract: {"kind": "polynomial_relation"}
            solution_sketch: 'The quotient rule gives $y'' = \frac{3(x + 2) - (3x + 1)}{(x + 2)^2} = \frac{5}{(x + 2)^2}$. At $x = 0$ the point is $\left(0, \frac{1}{2}\right)$ and the slope is $\frac{5}{4}$. The line is $y = \frac{5}{4}x + \frac{1}{2}$.'
          - problem: 'Find an equation of the tangent line to $y = \frac{x^2 + x}{x + 2}$ at $x = 0$.'
            answer: 'y = x/2'
            answer_contract: {"kind": "polynomial_relation"}
            solution_sketch: 'The quotient rule gives $y'' = \frac{(2x + 1)(x + 2) - (x^2 + x)}{(x + 2)^2}$. At $x = 0$ the point is $(0, 0)$ and the slope is $\frac{2}{4} = \frac{1}{2}$. The line is $y = \frac{x}{2}$.'
          - problem: 'Find an equation of the tangent line to $y = \frac{x^2 + 2}{x + 1}$ at $x = 2$.'
            answer: 'y = 2x/3 + 2/3'
            answer_contract: {"kind": "polynomial_relation"}
            solution_sketch: 'The quotient rule gives $y'' = \frac{2x(x + 1) - (x^2 + 2)}{(x + 1)^2}$. At $x = 2$ the point is $(2, 2)$ and the slope is $\frac{12 - 6}{9} = \frac{2}{3}$. The line is $y - 2 = \frac{2}{3}(x - 2)$, which is $y = \frac{2x}{3} + \frac{2}{3}$.'
          - problem: 'A hill has height $y = \frac{12x}{x^2 + 3}$ metres at a horizontal distance of $x$ metres. A hiker at $x = 1$ walks along the tangent line to the hill. Find an equation of that line.'
            answer: 'y = 3x/2 + 3/2'
            answer_contract: {"kind": "polynomial_relation"}
            solution_sketch: 'The quotient rule gives $y'' = \frac{12(x^2 + 3) - 12x \cdot 2x}{(x^2 + 3)^2} = \frac{36 - 12x^2}{(x^2 + 3)^2}$. At $x = 1$ the slope is $\frac{24}{16} = \frac{3}{2}$ and the point is $(1, 3)$. The line is $y - 3 = \frac{3}{2}(x - 1)$, which is $y = \frac{3x}{2} + \frac{3}{2}$.'
          - problem: 'A rail follows the curve $y = (x - 1)(x^2 + 2)$, with $x$ in metres. A sensor at $x = 2$ is aligned with the tangent line to the rail. Find an equation of that line.'
            answer: 'y = 10x - 14'
            answer_contract: {"kind": "polynomial_relation"}
            solution_sketch: 'The product rule gives $y'' = (x^2 + 2) + (x - 1)(2x)$. At $x = 2$ the slope is $6 + 4 = 10$ and the point is $(2, 6)$. The line is $y - 6 = 10(x - 2)$, which is $y = 10x - 14$.'
        constraints: "tangent point coordinates and slopes are integers or simple fractions; the answer is the slope-intercept expression for y"
    diagnostic_exemplar:
      problem: 'Find an equation of the tangent line to $y = \frac{x(x + 2)}{x + 1}$ at $x = 1$.'
      answer: 'y = 5x/4 + 1/4'
      solution_sketch: 'With numerator $x^2 + 2x$: $y'' = \frac{(2x+2)(x+1) - (x^2+2x)}{(x+1)^2} = \frac{x^2 + 2x + 2}{(x+1)^2}$, so the slope at $x = 1$ is $\frac{5}{4}$ and $y(1) = \frac{3}{2}$; the tangent is $y = \frac{5}{4}(x-1) + \frac{3}{2}$.'
