unit: the-derivative
course: calculus-1
module: "The Derivative"
topics:
  - id: average-instantaneous-rate
    name: Average and Instantaneous Rates of Change
    core: true
    difficulty: 0.5
    drill: false
    answer_kind: numeric
    expected_time_secs: 120
    prerequisites:
      - id: average-rate-of-change
        weight: 0.7
        key: true
      - id: slope
        weight: 0.5
        key: true
      - id: limits-graphical-numerical
        weight: 0.5
        key: true
      - id: function-notation
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: Average rate of change over an interval
        key_prerequisites: [average-rate-of-change, function-notation]
        exemplars:
          - problem: 'Find the average rate of change of $f(x) = x^2 + 1$ on $[2, 6]$.'
            answer: "8"
            solution_sketch: '$\frac{f(6) - f(2)}{6 - 2} = \frac{37 - 5}{4} = 8$.'
          - problem: 'A ball''s height is $s(t) = t^2 + 1$ meters at time $t$ seconds. Find its average velocity on $[1, 4]$.'
            answer: "5 m/s"
            solution_sketch: '$\frac{s(4) - s(1)}{4 - 1} = \frac{17 - 2}{3} = 5$.'
          - problem: 'Find the average rate of change of $f(x) = x^3$ on $[1, 3]$.'
            answer: "13"
            solution_sketch: '$\frac{f(3) - f(1)}{3 - 1} = \frac{27 - 1}{2} = 13$.'
          - problem: "Find the average rate of change of $f(x) = x^2 + 3x$ on $[0, 4]$."
            answer: "7"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: Write the function and the interval: f(x) = x^2 + 3x on [0, 4]. Step 2: Apply the average rate of change rule: (f(4) - f(0))/(4 - 0) = (28 - 0)/4. Step 3: Simplify the quotient: 28/4 = 7. The average rate of change is 7."
          - problem: "Find the average rate of change of $f(x) = x^3 - x$ on $[1, 3]$."
            answer: "12"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: Write the function and the interval: f(x) = x^3 - x on [1, 3]. Step 2: Apply the average rate of change rule: (f(3) - f(1))/(3 - 1) = (24 - 0)/2. Step 3: Simplify the quotient: 24/2 = 12. The average rate of change is 12."
          - problem: "The average rate of change of $f(x) = x^2$ on $[1, b]$ is $5$. Find $b$."
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: Write the function and the interval: f(x) = x^2 on [1, b]. Step 2: Apply the average rate of change rule: (f(b) - f(1))/(b - 1) = (b^2 - 1)/(b - 1). Step 3: Simplify the quotient to b + 1, then solve b + 1 = 5. Thus b = 4, so the endpoint is 4."
        constraints: "polynomial functions with integer coefficients; interval endpoints and answers are small integers"
      - id: kp2
        name: Secant slopes and units in context
        key_prerequisites: [slope, average-rate-of-change]
        exemplars:
          - problem: 'For $f(x) = x^2$, find the slope of the secant line through $(1, f(1))$ and $(3, f(3))$.'
            answer: "4"
            solution_sketch: 'The secant slope IS the average rate of change: $\frac{9 - 1}{2} = 4$.'
          - problem: "A tank holds $V(t) = t^2$ litres after $t$ minutes. Find the average rate of change of $V$ on $[2, 5]$ in litres per minute."
            answer: "7"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: Use the average rate of change formula, which is the secant slope $(V(5)-V(2))/(5-2)$. Step 2: $V(5)=25$ and $V(2)=4$, so the difference is $21$ over $3$ minutes. The average rate of change is 7."
          - problem: 'A particle at position $s(t) = 2t^2$ meters: find its average velocity on $[0, 3]$.'
            answer: "6 m/s"
          - problem: "A ball is dropped from a tower. Its height is $h(t) = 100 - 5t^2$ meters after $t$ seconds. Find the average rate of change of $h$ on $[1, 3]$ in meters per second."
            answer: "-20"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: Apply the average rate of change formula $(h(3)-h(1))/(3-1)$. Step 2: $h(3)=100-45=55$ and $h(1)=100-5=95$, so the difference is $-40$ over $2$ seconds. The average rate of change is -20."
          - problem: "A particle has position $s(t) = t^2$ meters at time $t$ seconds. Its average velocity on the time interval $[1, b]$ is $5$ meters per second. Find the time $b$ in seconds."
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: Average velocity is the secant slope $(s(b)-s(1))/(b-1)$. Step 2: $s(b)=b^2$ and $s(1)=1$, so $(b^2-1)/(b-1)=b+1$ for $b$ not 1. Set $b+1=5$ and solve: $b=4$. The time is 4."
          - problem: "The volume of a cube with side length $x$ cm is $V(x) = x^3$ cubic cm. Find the average rate of change of $V$ as $x$ changes from $2$ cm to $3$ cm, in cubic cm per cm."
            answer: "19"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: The average rate of change is $(V(3)-V(2))/(3-2)$. Step 2: $V(3)=27$ and $V(2)=8$, so the difference is $19$ over $1$ cm. The average rate of change is 19."
        constraints: "applied contexts (height, volume, position); the answer states the number with correct units"
      - id: kp3
        name: Instantaneous rate as a limit of average rates
        key_prerequisites: [limits-graphical-numerical, slope]
        exemplars:
          - problem: 'For $s(t) = t^2$, the average velocities on $[3, 3.1]$, $[3, 3.01]$, $[3, 3.001]$ are $6.1$, $6.01$, $6.001$. What is the instantaneous velocity at $t = 3$?'
            answer: "6"
            solution_sketch: 'The average rates approach $6$ as the interval shrinks, so the instantaneous rate is $6$.'
          - problem: 'For $f(x) = x^2$, evaluate $\lim_{h \to 0} \frac{f(2 + h) - f(2)}{h}$ using the simplified quotient $4 + h$.'
            answer: "4"
          - problem: "For $s(t) = t^3$, the average rates of change on $[2, 2.1]$, $[2, 2.01]$, $[2, 2.001]$ are $12.61$, $12.0601$, $12.006001$. What is the instantaneous rate of change at $t = 2$?"
            answer: "12"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (shrinking-interval table): read the average rates $12.61$, $12.0601$, and $12.006001$. Step 2 (limit of average rates): as the interval length goes to zero, these values approach $12$, so the limit is $12$. The instantaneous rate of change at $t = 2$ is 12."
          - problem: "For $f(x) = x^3$, use the pre-simplified difference quotient $3 + 3h + h^2$ to evaluate $\\lim_{h \\to 0} \\frac{f(1 + h) - f(1)}{h}$."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (substitute simplified quotient): replace the difference quotient by $3 + 3h + h^2$, so the limit is $\\lim_{h \\to 0} (3 + 3h + h^2)$. Step 2 (take the limit): as $h$ goes to zero, the terms $3h$ and $h^2$ vanish. The limit is 3."
          - problem: "A cart moves so that its position is $s(t) = t^2 + 2t$ meters after $t$ seconds. The average velocities on $[4, 4.1]$ and $[4, 4.01]$ are $10.1$ and $10.01$. Find the instantaneous velocity at $t = 4$ seconds."
            answer: "10"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (average rates): the average velocities $10.1$ and $10.01$ are average rates of change on shrinking intervals. Step 2 (limit of average rates): these values approach $10$ as the interval shrinks toward $t = 4$. The instantaneous velocity at $t = 4$ is 10."
          - problem: "For $f(x) = x^2$, the average rate of change on $[a, a + h]$ simplifies to $2a + h$. If the instantaneous rate of change at $x = a$ is $14$, find $a$."
            answer: "7"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (limit of average rate): the instantaneous rate is the limit as $h$ goes to zero, so $\\lim_{h \\to 0} (2a + h) = 2a$. Step 2 (solve the equation): set $2a = 14$ and solve. The value of $a$ is 7."
        constraints: "shrinking-interval tables or a pre-simplified difference quotient; integer limits"
    diagnostic_exemplar:
      problem: 'For $f(x) = x^2$, evaluate $\lim_{h \to 0} \frac{f(3 + h) - f(3)}{h}$ by first simplifying the quotient.'
      answer: "6"
      solution_sketch: 'Expand and cancel the $h$ before taking the limit: $\frac{(3+h)^2 - 9}{h} = \frac{6h + h^2}{h} = 6 + h \to 6$.'
    anki_seeds:
      - front: "The average rate of change of f on [a, b] equals..."
        back: "(f(b) - f(a)) / (b - a) — the slope of the secant line"
        type: basic
      - front: "Geometrically, average rate of change is the slope of the ___ line; instantaneous rate is the slope of the ___ line."
        back: "secant; tangent"
        type: basic

  - id: difference-quotients
    name: Difference Quotients
    core: true
    difficulty: 0.52
    drill: false
    answer_kind: expression
    expected_time_secs: 120
    prerequisites:
      - id: function-notation
        weight: 0.6
        key: true
      - id: polynomial-multiplication
        weight: 0.5
        key: true
      - id: average-instantaneous-rate
        weight: 0.5
      - id: rational-expressions
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: Evaluate f(a + h)
        key_prerequisites: [function-notation, polynomial-multiplication]
        exemplars:
          - problem: 'For $f(x) = x^2 + 1$, expand and simplify $f(2 + h)$.'
            answer: "h^2 + 4h + 5"
            solution_sketch: '$(2 + h)^2 + 1 = 4 + 4h + h^2 + 1$.'
          - problem: 'For $f(x) = 3x - 2$, simplify $f(x + h)$.'
            answer: "3x + 3h - 2"
          - problem: "For $f(x) = x^2 - 3x$, find $f(4 + h)$ in expanded form."
            answer: "h^2 + 5h + 4"
            answer_contract: {"kind": "function", "vars": ["h"]}
            solution_sketch: "Substitute first: f(4 + h) = (4 + h)^2 - 3(4 + h). Expand the square by polynomial multiplication: (4 + h)^2 = h^2 + 8h + 16. Distribute -3: -12 - 3h. Combine like terms: h^2 + (8h - 3h) + (16 - 12). The answer is h^2 + 5h + 4."
          - problem: "For $f(x) = 2x^2 + x$, find $f(x + h)$ in expanded form."
            answer: "2x^2 + 4xh + 2h^2 + x + h"
            answer_contract: {"kind": "function", "vars": ["x", "h"]}
            solution_sketch: "Substitute first: f(x + h) = 2(x + h)^2 + (x + h). Expand the square by polynomial multiplication: (x + h)^2 = x^2 + 2xh + h^2. Distribute 2: 2x^2 + 4xh + 2h^2. Add the remaining x + h. The answer is 2x^2 + 4xh + 2h^2 + x + h."
          - problem: "For $f(x) = x^2$, find $f(-1 + h)$ in expanded form."
            answer: "h^2 - 2h + 1"
            answer_contract: {"kind": "function", "vars": ["h"]}
            solution_sketch: "Substitute first: f(-1 + h) = (-1 + h)^2. Expand the square by polynomial multiplication: (-1 + h)^2 = (-1)^2 + 2(-1)h + h^2. This gives 1 - 2h + h^2. The answer is h^2 - 2h + 1."
          - problem: "For $f(x) = -x^2 + 4x$, find $f(3 + h)$ in expanded form."
            answer: "-h^2 - 2h + 3"
            answer_contract: {"kind": "function", "vars": ["h"]}
            solution_sketch: "Substitute first: f(3 + h) = -(3 + h)^2 + 4(3 + h). Expand the square by polynomial multiplication: (3 + h)^2 = 9 + 6h + h^2. The negative gives -9 - 6h - h^2, and 4(3 + h) gives 12 + 4h. Combine like terms: -h^2 - 2h + 3. The answer is -h^2 - 2h + 3."
        constraints: "linear or quadratic f; substitute a + h or x + h and expand fully"
      - id: kp2
        name: Simplify polynomial difference quotients
        key_prerequisites: [polynomial-multiplication, function-notation]
        exemplars:
          - problem: 'For $f(x) = x^2$, simplify $\frac{f(x + h) - f(x)}{h}$.'
            answer: "2x + h"
            solution_sketch: '$\frac{(x+h)^2 - x^2}{h} = \frac{2xh + h^2}{h} = 2x + h$.'
          - problem: 'For $f(x) = 3x + 1$, simplify $\frac{f(x + h) - f(x)}{h}$.'
            answer: "3"
          - problem: 'For $f(x) = x^2 - 4x$, simplify $\frac{f(x + h) - f(x)}{h}$.'
            answer: "2x + h - 4"
            solution_sketch: '$\frac{(x+h)^2 - 4(x+h) - x^2 + 4x}{h} = \frac{2xh + h^2 - 4h}{h} = 2x + h - 4$.'
          - problem: "For $f(x) = x^2 + 5x$, consider the difference quotient $\\frac{f(x+h)-f(x)}{h}$. Find its simplified form."
            answer: "2x + h + 5"
            answer_contract: {"kind": "function", "vars": ["x", "h"]}
            solution_sketch: "Start with the full quotient $\\frac{(x+h)^2 + 5(x+h) - x^2 - 5x}{h}$. Expand $(x+h)^2$ by polynomial multiplication and distribute: $x^2 + 2xh + h^2 + 5x + 5h - x^2 - 5x$. Combine like terms to get $2xh + h^2 + 5h$. Divide each term by $h$, and the h cancels completely. The simplified difference quotient is 2x + h + 5."
          - problem: "For $f(x) = x^2 - 6x + 2$, consider the difference quotient $\\frac{f(x+h)-f(x)}{h}$. Find its simplified form."
            answer: "2x + h - 6"
            answer_contract: {"kind": "function", "vars": ["x", "h"]}
            solution_sketch: "Start with the full quotient $\\frac{(x+h)^2 - 6(x+h) + 2 - x^2 + 6x - 2}{h}$. Expand $(x+h)^2$ by polynomial multiplication and distribute: $x^2 + 2xh + h^2 - 6x - 6h + 2 - x^2 + 6x - 2$. Combine like terms to get $2xh + h^2 - 6h$. Divide each term by $h$, and the h cancels completely. The simplified difference quotient is 2x + h - 6."
          - problem: "For $f(x) = 3x^2 + x$, consider the difference quotient $\\frac{f(x+h)-f(x)}{h}$. Find its simplified form."
            answer: "6x + 3h + 1"
            answer_contract: {"kind": "function", "vars": ["x", "h"]}
            solution_sketch: "Start with the full quotient $\\frac{3(x+h)^2 + (x+h) - 3x^2 - x}{h}$. Expand $(x+h)^2$ by polynomial multiplication and distribute: $3x^2 + 6xh + 3h^2 + x + h - 3x^2 - x$. Combine like terms to get $6xh + 3h^2 + h$. Divide each term by $h$, and the h cancels completely. The simplified difference quotient is 6x + 3h + 1."
        constraints: "linear or quadratic f; the h in the denominator must cancel completely"
      - id: kp3
        name: Difference quotients of rational functions
        key_prerequisites: [rational-expressions, function-notation]
        exemplars:
          - problem: 'For $f(x) = \frac{1}{x}$, simplify $\frac{f(x + h) - f(x)}{h}$.'
            answer: "-1/(x(x + h))"
            solution_sketch: '$\frac{\frac{1}{x+h} - \frac{1}{x}}{h} = \frac{x - (x+h)}{h \, x(x+h)} = \frac{-1}{x(x+h)}$.'
          - problem: 'For $f(x) = \frac{2}{x}$, simplify $\frac{f(x + h) - f(x)}{h}$.'
            answer: "-2/(x(x + h))"
          - problem: "For $f(t) = \\frac{4}{t}$, simplify $\\frac{f(t + h) - f(t)}{h}$. Give the answer as a function of $t$ and $h$."
            answer: "-4/(t(t+h))"
            answer_contract: {"kind": "function", "vars": ["t", "h"]}
            solution_sketch: "Start with the difference quotient (f(t+h)-f(t))/h = (4/(t+h) - 4/t)/h. Step 1: combine over the common denominator t(t+h): (4t - 4(t+h))/(h t(t+h)) = (-4h)/(h t(t+h)). Step 2: cancel h: -4/(t(t+h)). The answer is -4/(t(t+h))."
          - problem: "For $f(s) = \\frac{5}{s}$, simplify $\\frac{f(s + h) - f(s)}{h}$. Give the answer as a function of $s$ and $h$."
            answer: "-5/(s(s+h))"
            answer_contract: {"kind": "function", "vars": ["s", "h"]}
            solution_sketch: "Start with the difference quotient (f(s+h)-f(s))/h = (5/(s+h) - 5/s)/h. Step 1: combine over the common denominator s(s+h): (5s - 5(s+h))/(h s(s+h)) = (-5h)/(h s(s+h)). Step 2: cancel h: -5/(s(s+h)). The answer is -5/(s(s+h))."
          - problem: "For $f(u) = \\frac{6}{u}$, simplify $\\frac{f(u + h) - f(u)}{h}$. Give the answer as a function of $u$ and $h$."
            answer: "-6/(u(u+h))"
            answer_contract: {"kind": "function", "vars": ["u", "h"]}
            solution_sketch: "Start with the difference quotient (f(u+h)-f(u))/h = (6/(u+h) - 6/u)/h. Step 1: combine over the common denominator u(u+h): (6u - 6(u+h))/(h u(u+h)) = (-6h)/(h u(u+h)). Step 2: cancel h: -6/(u(u+h)). The answer is -6/(u(u+h))."
          - problem: "For $f(x) = \\frac{7}{x}$, simplify $\\frac{f(2 + h) - f(2)}{h}$. Give the answer as a function of $h$."
            answer: "-7/(2(2+h))"
            answer_contract: {"kind": "function", "vars": ["h"]}
            solution_sketch: "Start with the difference quotient (f(2+h)-f(2))/h = (7/(2+h) - 7/2)/h. Step 1: combine over the common denominator 2(2+h): (14 - 7(2+h))/(h * 2(2+h)) = (-7h)/(h * 2(2+h)). Step 2: cancel h: -7/(2(2+h)). The answer is -7/(2(2+h))."
        constraints: "f = c/x with small integer c; combine over a common denominator before canceling h"
    diagnostic_exemplar:
      problem: 'For $f(x) = \frac{3}{x}$, simplify $\frac{f(x + h) - f(x)}{h}$.'
      answer: "-3/(x(x + h))"
      solution_sketch: 'Combine the numerator over a common denominator: $\frac{3}{x+h} - \frac{3}{x} = \frac{-3h}{x(x+h)}$; dividing by $h$ cancels it, leaving $-\frac{3}{x(x+h)}$.'
    anki_seeds:
      - front: "The difference quotient of f is..."
        back: "(f(x + h) - f(x)) / h — the average rate of change over [x, x + h]"
        type: basic
      - front: "A correctly simplified difference quotient never has ___ in the denominator."
        back: "a bare h (the h must cancel so h → 0 can later be taken)"
        type: basic

  - id: derivative-at-a-point
    name: The Derivative at a Point
    core: true
    difficulty: 0.55
    drill: false
    answer_kind: numeric
    expected_time_secs: 150
    prerequisites:
      - id: difference-quotients
        weight: 0.7
        key: true
      - id: average-instantaneous-rate
        weight: 0.6
        key: true
      - id: factoring-limits
        weight: 0.5
    knowledge_points:
      - id: kp1
        name: Compute f'(a) from the h → 0 definition
        key_prerequisites: [difference-quotients, average-instantaneous-rate]
        exemplars:
          - problem: 'Use the definition $f''(a) = \lim_{h \to 0} \frac{f(a+h) - f(a)}{h}$ to find $f''(3)$ for $f(x) = x^2$.'
            answer: "6"
            solution_sketch: '$\frac{(3+h)^2 - 9}{h} = \frac{6h + h^2}{h} = 6 + h \to 6$.'
          - problem: 'Use the definition to find $f''(1)$ for $f(x) = 3x^2$.'
            answer: "6"
            solution_sketch: '$\frac{3(1+h)^2 - 3}{h} = \frac{6h + 3h^2}{h} = 6 + 3h \to 6$.'
          - problem: 'Use the definition to find $f''(2)$ for $f(x) = x^2 - 5x$.'
            answer: "-1"
            solution_sketch: '$\frac{(2+h)^2 - 5(2+h) - (-6)}{h} = \frac{-h + h^2}{h} = -1 + h \to -1$.'
          - problem: "Use the definition f'(a) = lim_{h -> 0} (f(a+h) - f(a))/h to find f'(1) for f(x) = x^2 + 2x."
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Start with the difference quotient for f(x) = x^2 + 2x at a = 1: ((1+h)^2 + 2(1+h) - 3)/h. Expand the numerator by algebra: (1 + 2h + h^2 + 2 + 2h - 3)/h = (4h + h^2)/h. Cancel the factor h and take the limit as h goes to 0 using the definition of the derivative: f'(1) = 4."
          - problem: "Use the definition f'(a) = lim_{h -> 0} (f(a+h) - f(a))/h to find f'(2) for f(x) = 2x^2 - 3x."
            answer: "5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Write the difference quotient for f(x) = 2x^2 - 3x at a = 2: (2(2+h)^2 - 3(2+h) - 2)/h. Expand and simplify the numerator: (8 + 8h + 2h^2 - 6 - 3h - 2)/h = (5h + 2h^2)/h. Cancel h and let h go to 0 using the derivative definition: f'(2) = 5."
          - problem: "A toy car moves along a line. Its position in metres after t seconds is s(t) = 6t - 3t^2. Use the definition s'(a) = lim_{h -> 0} (s(a+h) - s(a))/h to find the instantaneous velocity at t = 2."
            answer: "-6"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Write the difference quotient for s(t) = 6t - 3t^2 at a = 2: (6(2+h) - 3(2+h)^2 - 0)/h. Expand the numerator: 12 + 6h - 12 - 12h - 3h^2 = -6h - 3h^2, so the quotient is (-6h - 3h^2)/h. Cancel h and take the limit as h goes to 0 using the definition of the derivative: s'(2) = -6."
        constraints: "quadratic f with small integer coefficients; the difference quotient must cancel cleanly"
      - id: kp2
        name: The alternative form lim_{x → a}
        key_prerequisites: [factoring-limits, difference-quotients]
        exemplars:
          - problem: 'Use $f''(a) = \lim_{x \to a} \frac{f(x) - f(a)}{x - a}$ to find $f''(4)$ for $f(x) = x^2$.'
            answer: "8"
            solution_sketch: '$\frac{x^2 - 16}{x - 4} = x + 4 \to 8$.'
          - problem: 'Use the alternative form to find $f''(1)$ for $f(x) = x^3$.'
            answer: "3"
            solution_sketch: '$\frac{x^3 - 1}{x - 1} = x^2 + x + 1 \to 3$.'
          - problem: "Use f'(a) = lim_{x -> a} (f(x) - f(a))/(x - a). Find f'(3) for f(x) = x^2 + 4x."
            answer: "10"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Start from the alternative form f'(3) = lim_{x -> 3} (f(x) - f(3))/(x - 3). For f(x) = x^2 + 4x, f(3) = 21, so the quotient is (x^2 + 4x - 21)/(x - 3). Factor the numerator as (x - 3)(x + 7) by factoring limits, cancel x - 3, and evaluate x + 7 at x = 3. The limit is 10, so f'(3) = 10."
          - problem: "Use f'(a) = lim_{x -> a} (f(x) - f(a))/(x - a). Find f'(2) for f(x) = x^3."
            answer: "12"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Start from f'(2) = lim_{x -> 2} (f(x) - f(2))/(x - 2). For f(x) = x^3, f(2) = 8, so the quotient is (x^3 - 8)/(x - 2). Factor the difference of cubes as (x - 2)(x^2 + 2x + 4), cancel x - 2, and evaluate at x = 2. The limit is 12, so f'(2) = 12."
          - problem: "A particle's position is s(t) = t^2 + 2t metres at time t seconds. Use s'(3) = lim_{t -> 3} (s(t) - s(3))/(t - 3). Find its instantaneous velocity at t = 3, in m/s."
            answer: "8"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Use the alternative form for the position: s'(3) = lim_{t -> 3} (s(t) - s(3))/(t - 3). With s(t) = t^2 + 2t, s(3) = 15, so the quotient is (t^2 + 2t - 15)/(t - 3). Factor the numerator as (t - 3)(t + 5) by factoring limits, cancel t - 3, and evaluate t + 5 at t = 3. The limit is 8, so the instantaneous velocity is 8 m/s."
          - problem: "For f(x) = x^2, use the alternative form f'(a) = lim_{x -> a} (f(x) - f(a))/(x - a). Find f'(-3)."
            answer: "-6"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Use f'(-3) = lim_{x -> -3} (f(x) - f(-3))/(x + 3) because a = -3. For f(x) = x^2, f(-3) = 9, so the quotient is (x^2 - 9)/(x + 3). Factor the difference of squares as (x - 3)(x + 3), cancel x + 3, and evaluate x - 3 at x = -3. The limit is -6, so f'(-3) = -6."
        constraints: "factorable numerators (difference of squares/cubes); integer answers"
      - id: kp3
        name: Interpret f'(a)
        key_prerequisites: [average-instantaneous-rate]
        exemplars:
          - problem: 'The limit $\lim_{h \to 0} \frac{f(4 + h) - f(4)}{h} = 12$. What is the slope of the tangent line to $y = f(x)$ at $x = 4$?'
            answer: "12"
          - problem: 'A particle''s position is $s(t) = t^2$ meters after $t$ seconds, and $s''(3) = 6$. What is the particle''s instantaneous velocity at $t = 3$? Give the value with units.'
            answer: "6 m/s"
          - problem: "The graph of $y = f(x)$ has a tangent line at $x = 3$ whose slope is $7$. What is $f'(3)$?"
            answer: "7"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: Definition of the derivative at a point: f'(3) is the slope of the tangent line to y = f(x) at x = 3. Step 2: The given tangent line has slope 7. Therefore f'(3) = 7."
          - problem: "A particle moves along a line, and $s(t)$ is its position in meters at time $t$ in seconds. The limit $\\lim_{h \\to 0} \\frac{s(5 + h) - s(5)}{h} = -4$. What is the particle's instantaneous velocity at $t = 5$?"
            answer: "-4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: Definition of the derivative at a point: s'(5) is the limit of the difference quotient as h approaches 0. Step 2: The limit equals -4, so s'(5) = -4. Step 3: Instantaneous velocity is the derivative of position, so the velocity at t = 5 is -4."
          - problem: "The volume $V(t)$ of water in a tank, in liters, depends on the time $t$ in minutes. At $t = 8$, $V'(8) = -3$. Give the instantaneous rate of change of the volume at $t = 8$."
            answer: "-3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: The derivative V'(8) is the instantaneous rate of change of volume with respect to time. Step 2: The problem gives V'(8) = -3. Therefore the instantaneous rate of change of volume at t = 8 is -3."
          - problem: "The line $y = 4x - 1$ is tangent to the graph of $y = g(x)$ at $x = 2$. Find $g'(2)$."
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: Definition of the derivative at a point: g'(2) is the slope of the tangent line to y = g(x) at x = 2. Step 2: The tangent line y = 4x - 1 has slope 4. Therefore g'(2) = 4."
        constraints: "tie the derivative value to tangent slope or instantaneous rate with units"
    diagnostic_exemplar:
      problem: 'A particle''s position is $s(t) = t^2 - 5t$ metres at time $t$ seconds. Use the limit definition of the derivative to find its instantaneous velocity at $t = 4$, in m/s.'
      answer: '3'
      solution_sketch: '$\frac{s(4+h) - s(4)}{h} = \frac{(h^2 + 3h - 4) - (-4)}{h} = h + 3 \to 3$, so the velocity at $t = 4$ is $3$ m/s.'
    anki_seeds:
      - front: "The derivative at a point: f'(a) = ? (two equivalent limit forms)"
        back: "lim_{h→0} (f(a+h) - f(a))/h = lim_{x→a} (f(x) - f(a))/(x - a)"
        type: basic
      - front: "f'(a) is simultaneously the slope of ___ and the instantaneous ___."
        back: "the tangent line at x = a; rate of change of f at a"
        type: basic

  - id: derivative-definition
    name: The Limit Definition of the Derivative
    core: true
    difficulty: 0.6
    drill: false
    answer_kind: expression
    expected_time_secs: 210
    prerequisites:
      - id: derivative-at-a-point
        weight: 0.8
        key: true
      - id: limits-algebraic
        weight: 0.7
        key: true
      - id: limit-laws
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: Derive f'(x) for polynomials
        key_prerequisites: [derivative-at-a-point, limits-algebraic]
        exemplars:
          - problem: 'Use the definition to find $f''(x)$ for $f(x) = x^2$.'
            answer: "2x"
            solution_sketch: '$\frac{(x+h)^2 - x^2}{h} = \frac{2xh + h^2}{h} = 2x + h \to 2x$.'
          - problem: 'Use the definition to find $f''(x)$ for $f(x) = x^3$.'
            answer: "3x^2"
            solution_sketch: '$\frac{(x+h)^3 - x^3}{h} = 3x^2 + 3xh + h^2 \to 3x^2$.'
          - problem: 'Use the definition to find $f''(x)$ for $f(x) = 2x^2 - 3x$.'
            answer: "4x - 3"
            solution_sketch: '$\frac{2(x+h)^2 - 3(x+h) - 2x^2 + 3x}{h} = \frac{4xh + 2h^2 - 3h}{h} = 4x + 2h - 3 \to 4x - 3$.'
          - problem: "Use the limit definition to compute f'(x) for f(x) = x^2 + 5x. Find f'(x)."
            answer: "2x+5"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "Step 1: Write the difference quotient for f(x) = x^2 + 5x: ((x+h)^2 + 5(x+h) - (x^2 + 5x))/h. Step 2: Expand the numerator: x^2 + 2xh + h^2 + 5x + 5h - x^2 - 5x = 2xh + h^2 + 5h. Step 3: Divide by h: 2x + h + 5. Step 4: Take the limit as h goes to 0 using limit laws: the derivative is 2x+5."
          - problem: "Use the limit definition to compute f'(x) for f(x) = 3x^2 + 2x - 1. Find f'(x)."
            answer: "6x+2"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "Step 1: Write the difference quotient for f(x) = 3x^2 + 2x - 1: (3(x+h)^2 + 2(x+h) - 1 - (3x^2 + 2x - 1))/h. Step 2: Expand the numerator: 3x^2 + 6xh + 3h^2 + 2x + 2h - 1 - 3x^2 - 2x + 1 = 6xh + 3h^2 + 2h. Step 3: Divide by h: 6x + 3h + 2. Step 4: Take the limit as h goes to 0 using limit laws: the derivative is 6x+2."
          - problem: "Use the limit definition to compute f'(x) for f(x) = x^3 - x. Find f'(x)."
            answer: "3x^2-1"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "Step 1: Write the difference quotient for f(x) = x^3 - x: ((x+h)^3 - (x+h) - (x^3 - x))/h. Step 2: Expand the numerator: x^3 + 3x^2h + 3xh^2 + h^3 - x - h - x^3 + x = 3x^2h + 3xh^2 + h^3 - h. Step 3: Divide by h: 3x^2 + 3xh + h^2 - 1. Step 4: Take the limit as h goes to 0 using limit laws: the derivative is 3x^2-1."
        constraints: "degree ≤ 3 with small integer coefficients; require the full limit computation, not a rule"
      - id: kp2
        name: Derive f'(x) for rational and radical functions
        key_prerequisites: [limits-algebraic]
        exemplars:
          - problem: 'Use the definition to find $f''(x)$ for $f(x) = \frac{1}{x}$.'
            answer: "-1/x^2"
            solution_sketch: '$\frac{\frac{1}{x+h} - \frac{1}{x}}{h} = \frac{-h}{h \, x(x+h)} = \frac{-1}{x(x+h)} \to -\frac{1}{x^2}$.'
          - problem: 'Use the definition to find $f''(x)$ for $f(x) = \sqrt{x}$.'
            answer: "1/(2√x)"
            solution_sketch: 'Rationalize: $\frac{\sqrt{x+h} - \sqrt{x}}{h} = \frac{1}{\sqrt{x+h} + \sqrt{x}} \to \frac{1}{2\sqrt{x}}$.'
          - problem: 'Use the definition to find $f''(x)$ for $f(x) = \frac{1}{x + 1}$.'
            answer: "-1/(x + 1)^2"
            solution_sketch: 'Combine: $\frac{\frac{1}{x+h+1} - \frac{1}{x+1}}{h} = \frac{-1}{(x+h+1)(x+1)} \to -\frac{1}{(x+1)^2}$.'
          - problem: "Let f(x) = 1/(x + 3). Use the limit definition to find f'(x)."
            answer: "-1/(x+3)^2"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "Step 1, write the difference quotient for f(x) = 1/(x + 3): (1/(x + h + 3) - 1/(x + 3))/h. Step 2, combine the fractions: the numerator is -h/((x + h + 3)(x + 3)), so the quotient is -1/((x + h + 3)(x + 3)). Step 3, apply the limit law and let h tend to 0: the denominator tends to (x + 3)^2, giving the derivative -1/(x + 3)^2. The derivative is -1/(x+3)^2."
          - problem: "Let f(x) = 1/(x - 4). Use the definition of the derivative to find f'(x)."
            answer: "-1/(x-4)^2"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "Step 1, write the difference quotient for f(x) = 1/(x - 4): (1/(x + h - 4) - 1/(x - 4))/h. Step 2, combine the fractions: the numerator is -h/((x + h - 4)(x - 4)), so the quotient is -1/((x + h - 4)(x - 4)). Step 3, take the limit as h tends to 0: the denominator approaches (x - 4)^2, so the derivative is -1/(x - 4)^2. The derivative is -1/(x-4)^2."
          - problem: "Let f(t) = sqrt(t). Use the limit definition to find f'(t)."
            answer: "1/(2sqrt(t))"
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: "Step 1, write the difference quotient for f(t) = sqrt(t): (sqrt(t + h) - sqrt(t))/h. Step 2, rationalize: multiply numerator and denominator by sqrt(t + h) + sqrt(t) to get h/(h(sqrt(t + h) + sqrt(t))), which simplifies to 1/(sqrt(t + h) + sqrt(t)). Step 3, let h tend to 0 and apply the limit law: the denominator tends to 2sqrt(t), giving 1/(2sqrt(t)). The derivative is 1/(2sqrt(t))."
        constraints: "f is 1/x, 1/(x + c), or √x; combine fractions or rationalize before letting h → 0"
      - id: kp3
        name: Use the derived derivative function
        key_prerequisites: [derivative-at-a-point]
        exemplars:
          - problem: 'For $f(x) = x^2$ (so $f''(x) = 2x$), find the slope of the tangent line at $x = -3$.'
            answer: "-6"
          - problem: 'For $f(x) = x^2 - 6x$ (so $f''(x) = 2x - 6$), at which $x$ is the tangent line horizontal?'
            answer: "3"
            solution_sketch: 'Set $f''(x) = 0$: $2x - 6 = 0$.'
          - problem: "For f(x) = x^2 (so f'(x) = 2x), find the slope of the tangent line at x = 4."
            answer: "8"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (derivative function): the given derivative is f'(x) = 2x. Step 2 (evaluate at a point): substitute x = 4 to get f'(4) = 2(4) = 8. The slope of the tangent line is 8."
          - problem: "For f(x) = x^2 - 10x (so f'(x) = 2x - 10), find the x-value at which the tangent line is horizontal."
            answer: "5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (derivative function): the given derivative is f'(x) = 2x - 10. Step 2 (horizontal tangent condition): set f'(x) = 0 to get 2x - 10 = 0. Step 3 (solve the linear equation): add 10 and divide by 2, so x = 5. The value of x is 5."
          - problem: "For f(x) = x^3 (so f'(x) = 3x^2), find the slope of the tangent line at x = -2."
            answer: "12"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (derivative function): the given derivative is f'(x) = 3x^2. Step 2 (evaluate at a point): substitute x = -2 to get 3(-2)^2 = 3(4) = 12. The tangent slope is 12."
          - problem: "For f(x) = x^2 + 3x (so f'(x) = 2x + 3), find the x-value at which the derivative equals 7."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (derivative function): the given derivative is f'(x) = 2x + 3. Step 2 (set the derivative equal to the given value): solve 2x + 3 = 7. Step 3 (solve the linear equation): subtract 3 and divide by 2 to get x = 2. The value of x is 2."
        constraints: "evaluate or solve with a derivative already derived in this lesson; integer answers"
    diagnostic_exemplar:
      problem: 'Use the limit definition to find $f''(x)$ for $f(x) = \frac{1}{x + 2}$.'
      answer: "-1/(x + 2)^2"
      solution_sketch: '$\frac{1}{h}\left(\frac{1}{x+h+2} - \frac{1}{x+2}\right) = \frac{-h}{h(x+h+2)(x+2)} \to -\frac{1}{(x+2)^2}$.'
    anki_seeds:
      - front: "The limit definition of the derivative: f'(x) = ?"
        back: "lim_{h→0} (f(x + h) - f(x)) / h"
        type: basic
      - front: "Differentiable at a implies continuous at a. Is the converse true?"
        back: "No — e.g. f(x) = |x| is continuous at 0 but not differentiable there (corner)"
        type: basic

  - id: estimating-derivatives
    name: Estimating Derivatives from Tables and Graphs
    core: false                # terminal numerical-estimation genre
    difficulty: 0.52
    drill: false
    answer_kind: numeric
    expected_time_secs: 90
    prerequisites:
      - id: derivative-at-a-point
        weight: 0.7
        key: true
      - id: slope-from-a-graph
        weight: 0.5
        key: true
      - id: average-instantaneous-rate
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: Symmetric difference estimates from a table
        key_prerequisites: [derivative-at-a-point, average-instantaneous-rate]
        exemplars:
          - problem: 'A table gives $f(1.9) = 3.61$, $f(2) = 4$, $f(2.1) = 4.41$. Estimate $f''(2)$ using the values at $1.9$ and $2.1$.'
            answer: "4"
            solution_sketch: '$\frac{4.41 - 3.61}{2.1 - 1.9} = \frac{0.8}{0.2} = 4$.'
          - problem: 'A table gives $f(2.9) = 8.41$ and $f(3.1) = 9.61$. Estimate $f''(3)$.'
            answer: "6"
          - problem: "A table gives f(1.9) = 2.25 and f(2.1) = 3.25. Compute an estimate of f'(2)."
            answer: "5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full estimate is (3.25 - 2.25)/(2.1 - 1.9). Step 1: use the symmetric difference quotient rule, dividing the change in f by the change in x. Step 2: compute the change in f as 1.00 and the change in x as 0.20. The quotient is 5, so f'(2) is approximately 5."
          - problem: "A population table gives P(4.9) = 20.4 and P(5.1) = 21.0, in thousands. Compute the rate P'(5) in thousands per year."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full estimate is (21.0 - 20.4)/(5.1 - 4.9). Step 1: use the symmetric difference quotient rule for a rate. Step 2: the change in P is 0.6 thousand and the time change is 0.2 years. The quotient is 3, so P'(5) is approximately 3 thousand per year."
          - problem: "A table gives f(3.9) = 20 and f(4.1) is unknown. The symmetric difference estimate of f'(4) is 5. Find f(4.1)."
            answer: "21"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full relation is (f(4.1) - 20)/(4.1 - 3.9) = 5. Step 1: use the symmetric difference quotient rule. Step 2: multiply both sides by 0.2 to get f(4.1) - 20 = 1. Step 3: add 20 to both sides. Thus f(4.1) = 21."
          - problem: "A table gives T(6.9) = 70.0 and T(7.1) = 70.4, in degrees. Compute the rate T'(7) in degrees per hour."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full estimate is (70.4 - 70.0)/(7.1 - 6.9). Step 1: use the symmetric difference quotient rule for the rate of change. Step 2: the temperature change is 0.4 degrees over 0.2 hours. The quotient is 2, so T'(7) is approximately 2 degrees per hour."
        constraints: "symmetric points a ± 0.1; the difference quotient comes out to a small integer"
      - id: kp2
        name: Estimate the derivative from a graph
        key_prerequisites: [slope-from-a-graph, derivative-at-a-point]
        exemplars:
          - problem: 'The tangent line to $y = f(x)$ at $x = 2$ appears to pass through $(1, 2)$ and $(3, 8)$. Estimate $f''(2)$.'
            answer: "3"
            solution_sketch: 'The tangent''s slope is $\frac{8 - 2}{3 - 1} = 3$.'
          - problem: 'At a point where the graph of $f$ has a horizontal tangent, what is $f''$ there?'
            answer: "0"
          - problem: "A line tangent to the graph of $y = f(x)$ at $x = 1$ passes through $(0, 1)$ and $(2, 5)$. Find $f'(1)$."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The tangent line at $x = 1$ passes through $(0, 1)$ and $(2, 5)$. Rule: the derivative $f'(1)$ is the slope of the tangent line at that point. Rule: slope is the change in $y$ divided by the change in $x$, so the slope is $(5 - 1)/(2 - 0) = 4/2 = 2$. Therefore $f'(1) = 2$."
          - problem: "At $x = 5$, the graph of $y = f(x)$ has a horizontal tangent line. Find $f'(5)$."
            answer: "0"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The tangent line at $x = 5$ is horizontal. Rule: the derivative $f'(5)$ equals the slope of the tangent line at $x = 5$. Rule: a horizontal line has slope $0$. Therefore $f'(5) = 0$."
          - problem: "The tangent to $y = f(x)$ at $x = -1$ goes through $(-2, 7)$ and $(0, -1)$. Determine $f'(-1)$."
            answer: "-4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The tangent line at $x = -1$ goes through $(-2, 7)$ and $(0, -1)$. Rule: the derivative $f'(-1)$ is the slope of the tangent line at $x = -1$. Rule: slope is $(y_2 - y_1)/(x_2 - x_1)$, so the slope is $(-1 - 7)/(0 - (-2)) = -8/2 = -4$. Thus $f'(-1) = -4$."
          - problem: "The line tangent to $y = f(x)$ at $x = 3$ passes through $(2, 6)$ and $(4, 2)$. What is $f'(3)$?"
            answer: "-2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The tangent line at $x = 3$ passes through $(2, 6)$ and $(4, 2)$. Rule: the derivative $f'(3)$ is the slope of the tangent line at $x = 3$. Rule: the slope is $(2 - 6)/(4 - 2) = -4/2 = -2$. Therefore $f'(3) = -2$."
        constraints: "tangent line through two lattice points, or a horizontal tangent; integer slopes"
      - id: kp3
        name: Sign and units of the derivative
        key_prerequisites: [derivative-at-a-point, average-instantaneous-rate]
        exemplars:
          - problem: '$s(t)$ gives a car''s position in kilometres after $t$ hours, and $s''(2) = 60$. What is the car''s speed at $t = 2$? Give the value with units.'
            answer: "60 km/h"
          - problem: "$f$ is decreasing near $x = 5$. What is the sign of $f'(5)$? Select the correct sign."
            answer: "negative"
            answer_contract: {"kind": "label", "options": [["positive"], ["negative"], ["constant"], ["undefined"]]}
            solution_sketch: "The full object is the sign of f'(5). The derivative sign of a decreasing function is negative. Since f is decreasing, f'(5) < 0, so the sign is negative. A learner who picks positive confuses increasing with decreasing; a learner who picks constant thinks a decreasing function must be flat; a learner who picks undefined assumes a corner where none is stated. The answer is negative."
          - problem: "Water drains from a tank, so the volume $V(t)$ in litres after $t$ minutes is decreasing. The tank drains at $8$ litres per minute. Find $V'(3)$ in litres per minute; give the number with its sign."
            answer: "-8"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full object is the rate V'(3) with its units. The units of a derivative are output units over input units, so V' is measured in litres per minute. Draining means the volume decreases as t increases, so the rate of change is negative and V'(3) = -8 litres per minute. The answer is -8."
          - problem: "$f$ is increasing near $x = 2$. Give the sign of $f'(2)$ as 1 for positive, -1 for negative, and 0 for zero."
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full object is the sign code of f'(2). The sign of the derivative tells whether the function is increasing or decreasing. Since f is increasing, f'(2) > 0, so the sign code is 1. The answer is 1."
          - problem: "$f$ is decreasing near $x = 4$. Give the sign of $f'(4)$ as 1 for positive, -1 for negative, and 0 for zero."
            answer: "-1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full object is the sign code of f'(4). The sign of the derivative tells whether the function is increasing or decreasing. Since f is decreasing, f'(4) < 0, so the sign code is -1. The answer is -1."
          - problem: "A table shows $f(1) = 3$ and $f(3) = 1$. Give the sign of $f'(1)$ as 1 for positive, -1 for negative, and 0 for zero."
            answer: "-1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full object is the sign code of f'(1). The average rate of change over [1,3] is (1 - 3)/(3 - 1) = -1, so f is decreasing near x = 1. Since f is decreasing, f'(1) < 0, so the sign code is -1. The answer is -1."
        constraints: "connect increasing/decreasing to derivative sign; units of f' are (output units)/(input units)"
    diagnostic_exemplar:
      problem: 'A car''s position is $s(t)$ kilometres after $t$ hours, with $s(1.9) = 95.2$ and $s(2.1) = 105.6$. Estimate the car''s speed at $t = 2$, in km/h.'
      answer: '52'
      solution_sketch: 'Symmetric difference quotient: $\frac{105.6 - 95.2}{2.1 - 1.9} = \frac{10.4}{0.2} = 52$, in km/h because $s$ is in km and $t$ in hours.'
    anki_seeds:
      - front: "Best table-based estimate of f'(a): use points on ___ of a."
        back: "both sides — the symmetric difference (f(a+h) - f(a-h)) / (2h)"
        type: basic
      - front: "The units of f'(x) are always..."
        back: "(units of f) per (unit of x)"
        type: basic

  - id: tangent-line-equation
    name: Equations of Tangent Lines
    core: true
    difficulty: 0.58
    drill: false
    answer_kind: expression
    expected_time_secs: 150
    prerequisites:
      - id: derivative-definition
        weight: 0.7
        key: true
      - id: point-slope-form
        weight: 0.5
        key: true
      - id: derivative-at-a-point
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: Tangent line from a given derivative
        key_prerequisites: [point-slope-form, derivative-at-a-point]
        exemplars:
          - problem: 'Find the tangent line to $y = x^2$ at $x = 1$ (its derivative is $2x$). Give the expression for $y$.'
            answer: "2x - 1"
            solution_sketch: 'Slope $2 \cdot 1 = 2$ through $(1, 1)$: $y - 1 = 2(x - 1)$, i.e. $y = 2x - 1$.'
          - problem: 'Find the tangent line to $f(x) = x^2 - 3x$ at $x = 2$, given $f''(x) = 2x - 3$. Give the expression for $y$.'
            answer: "x - 4"
            solution_sketch: 'Slope $f''(2) = 1$ through $(2, -2)$: $y + 2 = x - 2$, i.e. $y = x - 4$.'
          - problem: "Find the tangent line to $y = x^2$ at $x = 3$ (its derivative is $2x$). Give the expression for $y$."
            answer: "6x - 9"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "The curve is y = x^2 with derivative 2x. At x = 3, the point is (3, 9). The slope is 2 * 3 = 6. Point-slope gives y - 9 = 6(x - 3), which simplifies to y = 6x - 9, so the expression for y is 6x - 9."
          - problem: "Find the tangent line to $f(x) = x^2 - 5x + 1$ at $x = 4$, given $f'(x) = 2x - 5$. Give the expression for $y$."
            answer: "3x - 15"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "The function is f(x) = x^2 - 5x + 1 with derivative f'(x) = 2x - 5. At x = 4, f(4) = 16 - 20 + 1 = -3. The slope is f'(4) = 8 - 5 = 3. Point-slope gives y + 3 = 3(x - 4), which simplifies to y = 3x - 15, so the expression for y is 3x - 15."
          - problem: "A curve has derivative $f'(x) = 4x - 1$ and passes through the point $(2, 5)$. Find the tangent line at $x = 2$. Give the expression for $y$."
            answer: "7x - 9"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "The derivative is f'(x) = 4x - 1 and the point is (2, 5). The slope is f'(2) = 4 * 2 - 1 = 7. Point-slope gives y - 5 = 7(x - 2), which simplifies to y = 7x - 9, so the expression for y is 7x - 9."
          - problem: "Find the tangent line to $f(x) = 2x^2 - 3x + 1$ at $x = 2$, given $f'(x) = 4x - 3$. Give the expression for $y$."
            answer: "5x - 7"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "The function is f(x) = 2x^2 - 3x + 1 with derivative f'(x) = 4x - 3. At x = 2, f(2) = 8 - 6 + 1 = 3. The slope is f'(2) = 8 - 3 = 5. Point-slope gives y - 3 = 5(x - 2), which simplifies to y = 5x - 7, so the expression for y is 5x - 7."
        constraints: "quadratics with integer coefficients; tangent point and slope are integers; the answer is the slope-intercept expression for y"
      - id: kp2
        name: Compute the derivative, then the tangent line
        key_prerequisites: [derivative-definition, point-slope-form]
        exemplars:
          - problem: 'Find the tangent line to $f(x) = x^2$ at $x = 3$. Give the expression for $y$.'
            answer: "6x - 9"
            solution_sketch: '$f''(x) = 2x$ gives slope $6$ through $(3, 9)$: $y - 9 = 6(x - 3)$, i.e. $y = 6x - 9$.'
          - problem: 'Find the tangent line to $f(x) = \frac{1}{x}$ at $x = 1$ (use $f''(x) = -1/x^2$). Give the expression for $y$.'
            answer: "-x + 2"
            solution_sketch: 'Slope $-1$ through $(1, 1)$: $y - 1 = -(x - 1)$, i.e. $y = -x + 2$.'
          - problem: "Find the tangent line to f(x) = x^2 at x = -2. Give the expression for y."
            answer: "-4x - 4"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "Full object: f(x) = x^2 at x = -2. Step 1, power rule: f'(x) = 2x, so the slope is f'(-2) = -4. Step 2, point-slope form: the point is (-2, 4), so y - 4 = -4(x + 2). Step 3, simplify: y = -4x - 4. The expression for y is -4x - 4."
          - problem: "Find the tangent line to f(x) = x^3 at x = 1. Give the expression for y."
            answer: "3x - 2"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "Full object: f(x) = x^3 at x = 1. Step 1, power rule: f'(x) = 3x^2, so the slope is f'(1) = 3. Step 2, point-slope form: the point is (1, 1), so y - 1 = 3(x - 1). Step 3, simplify: y = 3x - 2. The expression for y is 3x - 2."
          - problem: "Find the tangent line to f(x) = x^3 - 2x at x = 2. Give the expression for y."
            answer: "10x - 16"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "Full object: f(x) = x^3 - 2x at x = 2. Step 1, power rule: f'(x) = 3x^2 - 2, so the slope is f'(2) = 10. Step 2, point-slope form: the point is (2, 4), so y - 4 = 10(x - 2). Step 3, simplify: y = 10x - 16. The expression for y is 10x - 16."
          - problem: "For f(x) = x^2, find the tangent line at the point where the slope is 8. Give the expression for y."
            answer: "8x - 16"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "Full object: f(x) = x^2 with tangent slope 8. Step 1, power rule: f'(x) = 2x. Step 2, solve 2x = 8, so x = 4. Step 3, point-slope form: f(4) = 16, so y - 16 = 8(x - 4). Step 4, simplify: y = 8x - 16. The expression for y is 8x - 16."
        constraints: "derivatives derivable by the limit definition covered earlier; clean integer slopes and intercepts; the answer is the slope-intercept expression for y"
      - id: kp3
        name: Normal lines and horizontal tangents
        key_prerequisites: [point-slope-form, derivative-definition]
        exemplars:
          - problem: 'Find the normal line to $y = x^2$ at $(1, 1)$. Give the expression for $y$.'
            answer: "-x/2 + 3/2"
            solution_sketch: 'Tangent slope $2$, so the normal slope is $-\frac{1}{2}$: $y - 1 = -\frac{1}{2}(x - 1)$.'
          - problem: 'At which point does $y = x^2 - 4x$ have a horizontal tangent line?'
            answer: "(2, -4)"
            solution_sketch: '$y'' = 2x - 4 = 0$ at $x = 2$; the point is $(2, -4)$.'
          - problem: "Find the normal line to y = x^2 + 2x at x = 1. Give the expression for y."
            answer: "-x/4 + 13/4"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "The point is (1, 3) because y = 1 + 2 = 3. The derivative of x^2 + 2x is 2x + 2 by the general power rule, so the tangent slope at x = 1 is 4. The normal slope is the negative reciprocal, -1/4. Point-slope form gives y - 3 = -1/4 (x - 1), which simplifies to y = -x/4 + 13/4. The answer is -x/4 + 13/4."
          - problem: "Find the normal line to y = x^3 at the point (1, 1). Give the expression for y."
            answer: "-x/3 + 4/3"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "The point is (1, 1). The derivative of x^3 is 3x^2 by the general power rule, so the tangent slope at x = 1 is 3. The normal slope is the negative reciprocal, -1/3. Point-slope form gives y - 1 = -1/3 (x - 1), which simplifies to y = -x/3 + 4/3. The answer is -x/3 + 4/3."
          - problem: "Find the x-coordinates of all points where y = x + 4/x has a horizontal tangent line. Give the answer as a set of x-values."
            answer: "{-2, 2}"
            answer_contract: {"kind": "set"}
            solution_sketch: "The function is y = x + 4/x. Its derivative is 1 - 4/x^2 by the general power rule. A horizontal tangent means the derivative is zero, so 1 - 4/x^2 = 0. Solving gives x^2 = 4, so x = -2 or x = 2. The answer is {-2, 2}."
          - problem: "Find the normal line to y = sqrt(x) at x = 4. Give the expression for y."
            answer: "-4x + 18"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "The point is (4, 2) because sqrt(4) = 2. The derivative of sqrt(x) is 1/(2 sqrt(x)), so the tangent slope at x = 4 is 1/4. The normal slope is the negative reciprocal, -4. Point-slope form gives y - 2 = -4(x - 4), which simplifies to y = -4x + 18. The answer is -4x + 18."
        constraints: "normal slope is the negative reciprocal; horizontal tangents where the derivative vanishes"
    diagnostic_exemplar:
      problem: 'Find the normal line to $y = x^2$ at $x = 2$. Give the expression for $y$.'
      answer: '-x/4 + 9/2'
      solution_sketch: 'The tangent slope is $f''(2) = 4$, so the normal slope is $-\frac{1}{4}$; through $(2, 4)$: $y = 4 - \frac{1}{4}(x - 2) = -\frac{x}{4} + \frac{9}{2}$.'
    anki_seeds:
      - front: "Tangent line to y = f(x) at x = a:"
        back: "y = f(a) + f'(a)(x - a)"
        type: basic
      - front: "The normal line at a point has slope..."
        back: "-1/f'(a) — the negative reciprocal of the tangent slope"
        type: basic

  - id: differentiability
    name: Differentiability and the Derivative as a Function
    core: true
    difficulty: 0.62
    drill: false
    answer_kind: numeric
    expected_time_secs: 150
    prerequisites:
      - id: derivative-definition
        weight: 0.7
        key: true
      - id: continuity
        weight: 0.6
        key: true
      - id: one-sided-limits
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: Differentiable implies continuous (converse fails)
        key_prerequisites: [derivative-definition, continuity]
        exemplars:
          - problem: "For f(x) = |x - 1|, find f'(1)."
            answer: "DNE"
            answer_contract: {"kind": "label", "options": [["DNE", "does not exist"], ["infinity", "inf", "oo"], ["-infinity", "-inf", "-oo"], ["0"]]}
            solution_sketch: "For f(x) = |x - 1| at x = 1, write the difference quotient (|1+h-1| - 0)/h = |h|/h. Step 1: use the limit definition of the derivative. Step 2: evaluate the left-hand limit: for h < 0, |h|/h = -1. Step 3: evaluate the right-hand limit: for h > 0, |h|/h = 1. The two one-sided limits differ, so the derivative does not exist; this is the failed converse, since f is continuous at 1. The option infinity is wrong because the quotient does not grow without bound; -infinity is wrong for the same reason; 0 is wrong because the one-sided quotients are -1 and 1, not 0. The derivative is DNE."
          - problem: "Differentiable implies continuous. Suppose f is differentiable at x = 4 and f(4) = 7. Find lim_{x -> 4} f(x)."
            answer: "7"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: cite the implication: differentiability at 4 implies continuity at 4. Step 2: use the definition of continuity: if f is continuous at 4, then lim_{x -> 4} f(x) = f(4). Step 3: substitute the given value f(4) = 7. The limit is 7."
          - problem: "For f(x) = |x - 5|, compute the left-hand derivative at x = 5."
            answer: "-1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: write the difference quotient for h < 0: (|5+h-5| - |5-5|)/h = |h|/h. Step 2: simplify for h < 0: |h| = -h, so the quotient is -1. Step 3: take the left-hand limit: the left-hand derivative is -1. The left-hand derivative is -1."
          - problem: "For f(x) = |x - 5|, compute the right-hand derivative at x = 5."
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: write the difference quotient for h > 0: (|5+h-5| - |5-5|)/h = |h|/h. Step 2: simplify for h > 0: |h| = h, so the quotient is 1. Step 3: take the right-hand limit: the right-hand derivative is 1. The right-hand derivative is 1."
          - problem: "For f(x) = 3|x + 2|, compute the left-hand derivative at x = -2."
            answer: "-3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: write the difference quotient for h < 0: (3|-2+h+2| - 3|-2+2|)/h = 3|h|/h. Step 2: simplify for h < 0: |h| = -h, so the quotient is -3. Step 3: take the left-hand limit: the left-hand derivative is -3. The left-hand derivative is -3."
          - problem: "For f(x) = 3|x + 2|, compute the right-hand derivative at x = -2."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: write the difference quotient for h > 0: (3|-2+h+2| - 3|-2+2|)/h = 3|h|/h. Step 2: simplify for h > 0: |h| = h, so the quotient is 3. Step 3: take the right-hand limit: the right-hand derivative is 3. The right-hand derivative is 3."
        constraints: "corner examples built from |x - a|; cite the implication and its failed converse"
      - id: kp2
        name: Spot non-differentiable points
        key_prerequisites: [derivative-definition, one-sided-limits]
        exemplars:
          - problem: "The function f(x) = x^(2/3) fails to be differentiable at exactly one input. Which feature occurs there?"
            answer: "cusp point"
            answer_contract: {"kind": "label", "options": [["cusp point"], ["corner point"], ["vertical tangent"], ["discontinuity"]]}
            solution_sketch: "The full function is f(x) = x^(2/3). Step 1 uses the cusp test: the base x is zero at 0 and the exponent 2/3 lies between 0 and 1, so the graph comes to a sharp point there. Step 2 checks the sign of the one-sided slopes from the difference quotient: the left slope tends to -infinity and the right slope tends to +infinity, so the infinite slopes have opposite signs. A corner point has two different finite slopes, a vertical tangent has one-sided slopes with the same infinite sign, and a discontinuity fails continuity, but f is continuous at 0. The feature is cusp point."
          - problem: "The function f(x) = abs(x - 4) fails to be differentiable at exactly one input. Which feature occurs there?"
            answer: "corner point"
            answer_contract: {"kind": "label", "options": [["corner point"], ["cusp point"], ["vertical tangent"], ["discontinuity"]]}
            solution_sketch: "The full function is f(x) = abs(x - 4). Step 1 uses the definition of absolute value: the inside x - 4 changes sign at x = 4. Step 2 applies the corner test: the left slope is -1 and the right slope is +1, so the two one-sided slopes are finite but differ. A cusp point has infinite one-sided slopes of opposite signs, a vertical tangent has infinite one-sided slopes of the same sign, and a discontinuity fails continuity, but this function is continuous at 4. The feature is corner point."
          - problem: "The function f(x) = 1/(x - 2) fails to be differentiable at one input. At what x does this happen? Give the x-coordinate."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full function is f(x) = 1/(x - 2). Step 1 uses continuity: the denominator is zero at x = 2, so the function is not defined there. Step 2 applies the differentiability-implies-continuity rule: a point of discontinuity cannot be differentiable. The x-coordinate is 2."
          - problem: "The function f(x) = abs(x + 2) is not differentiable at one input. At what x does this happen? Give the x-coordinate."
            answer: "-2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full function is f(x) = abs(x + 2). Step 1 uses the definition of absolute value: the inside x + 2 is zero at x = -2. Step 2 applies the corner test: the left slope is -1 and the right slope is 1, so the one-sided slopes differ. The x-coordinate is -2."
          - problem: "The function f(x) = (x - 1)^(2/3) is not differentiable at one input. At what x does this happen? Give the x-coordinate."
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full function is f(x) = (x - 1)^(2/3). Step 1 uses the cusp test: the base x - 1 is zero at x = 1. Step 2 checks the one-sided slopes; they tend to opposite infinities, so the graph has a cusp. The x-coordinate is 1."
          - problem: "The function f(x) = (x - 3)^(1/3) has a vertical tangent at one input. At what x does this happen? Give the x-coordinate."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full function is f(x) = (x - 3)^(1/3). Step 1 uses the vertical-tangent test: the base x - 3 is zero at x = 3. Step 2 checks the difference quotient; it tends to infinity on both sides, so the graph has a vertical tangent. The x-coordinate is 3."
        constraints: "classify by feature (corner / cusp / vertical tangent / discontinuity); no computation beyond sign checks"
      - id: kp3
        name: Piecewise differentiability checks
        key_prerequisites: [derivative-definition, continuity, one-sided-limits]
        exemplars:
          - problem: "Let $f(x) = x^2$ for $x \\le 1$ and $f(x) = 2x - 1$ for $x > 1$. Check the branch values and the one-sided slopes at $x = 1$. Find $f'(1)$."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (value match): the left branch gives $1^2 = 1$ and the right branch gives $2(1) - 1 = 1$, so the values match and f is continuous at $x = 1$. Step 2 (one-sided slopes): the left slope is $2x$ at $x = 1$, which is $2$, and the right slope is $2$. The slopes match, so f is differentiable at $x = 1$ and the answer is $f'(1) = 2$."
          - problem: "Let $g(x) = x^2$ for $x \\le 1$ and $g(x) = 3x - 2$ for $x > 1$. Check the branch values and the one-sided slopes at $x = 1$. Find the difference of the one-sided slopes (right minus left)."
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (value match): the left branch gives $1^2 = 1$ and the right branch gives $3(1) - 2 = 1$, so the values match. Step 2 (one-sided slopes): the left slope is $2x$ at $x = 1$, which is $2$, and the right slope is $3$. The difference right minus left is $3 - 2 = 1$."
          - problem: "Let $f(x) = x^2$ for $x \\le 1$ and $f(x) = ax - 1$ for $x > 1$. Find the value of $a$ that makes $f$ differentiable at $x = 1$."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (value match): the left branch gives $1^2 = 1$ and the right branch gives $a(1) - 1 = a - 1$; matching gives $a - 1 = 1$, so $a = 2$. Step 2 (one-sided slopes): the left slope is $2x$ at $x = 1$, which is $2$, and the right slope is $a$; matching also gives $a = 2$. The answer is $a = 2$."
          - problem: "Let $f(x) = x^2 + 2x$ for $x \\le 1$ and $f(x) = 4x + c$ for $x > 1$. Find the value of $c$ that makes $f$ differentiable at $x = 1$."
            answer: "-1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (value match): the left branch gives $1^2 + 2(1) = 3$ and the right branch gives $4(1) + c = 4 + c$; matching gives $4 + c = 3$, so $c = -1$. Step 2 (one-sided slopes): the left slope is $2x + 2$ at $x = 1$, which is $4$, and the right slope is $4$, so the slopes match. The answer is $c = -1$."
          - problem: "Let $f(x) = x^2$ for $x \\le 2$ and $f(x) = x^3 - 4$ for $x > 2$. Check the branch values and the one-sided slopes at $x = 2$. State $f'(2)$."
            answer: "DNE"
            answer_contract: {"kind": "label", "options": [["DNE", "does not exist"], ["4"], ["12"], ["0"]]}
            solution_sketch: "Step 1 (value match): the left branch gives $2^2 = 4$ and the right branch gives $2^3 - 4 = 4$, so the values match and f is continuous at $x = 2$. Step 2 (one-sided slopes): the left slope is $2x$ at $x = 2$, which is $4$, and the right slope is $3x^2$ at $x = 2$, which is $12$. The slopes differ, so f is not differentiable at $x = 2$. The option 4 uses only the left slope, the option 12 uses only the right slope, and the option 0 assumes the slopes already match. The answer is DNE."
          - problem: "Let $f(x) = x^2 + bx$ for $x \\le 1$ and $f(x) = 3x - 1$ for $x > 1$. Find the value of $b$ that makes $f$ differentiable at $x = 1$."
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (value match): the left branch gives $1^2 + b(1) = 1 + b$ and the right branch gives $3(1) - 1 = 2$; matching gives $1 + b = 2$, so $b = 1$. Step 2 (one-sided slopes): the left slope is $2x + b$ at $x = 1$, which is $2 + b$, and the right slope is $3$; with $b = 1$ the left slope is $3$, so the slopes match too. The answer is $b = 1$."
        constraints: "two-branch polynomials; check value match first, then one-sided slopes"
    diagnostic_exemplar:
      problem: 'Let $f(x) = x^2$ for $x \leq 2$ and $f(x) = 4x - 4$ for $x > 2$. Is $f$ differentiable at $x = 2$?'
      answer: "yes — f is continuous at 2 (both branches give 4) and both one-sided slopes equal 4, so f'(2) = 4"
      answer_contract: {kind: none}
      solution_sketch: 'Differentiability needs continuity plus matching one-sided slopes: the branches agree at $2$ ($2^2 = 4 = 4(2) - 4$), and $2x|_{x=2} = 4$ matches the slope $4$ of the linear branch.'
    anki_seeds:
      - front: "Differentiable ⇒ continuous. Continuous ⇒ differentiable?"
        back: "No — corners, cusps, and vertical tangents are continuous but not differentiable"
        type: basic
      - front: "A piecewise function is differentiable at its seam iff..."
        back: "the branch values match there (continuity) AND the one-sided derivatives match"
        type: basic

  - id: derivatives-of-polynomials
    name: Derivatives of Polynomials
    core: true
    difficulty: 0.5
    drill: true
    answer_kind: expression
    expected_time_secs: 60
    prerequisites:
      - id: derivative-definition
        weight: 0.7
        key: true
      - id: evaluating-polynomials
        weight: 0.4
      - id: combining-like-terms
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: Power rule for whole-number exponents
        key_prerequisites: [derivative-definition]
        exemplars:
          - problem: 'Differentiate $f(x) = x^5$.'
            answer: "5x^4"
          - problem: 'Differentiate $f(x) = x^7$.'
            answer: "7x^6"
          - problem: "The position of a particle at time t is s(t) = t^4. Find its velocity function v(t)."
            answer: "4t^3"
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: "The position is s(t) = t^4. By the power rule, the derivative of t^4 is 4 t^(4-1). Therefore the velocity function is 4t^3."
          - problem: "A square tile has side length x. Its area is A(x) = x^2. Find dA/dx."
            answer: "2x"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "The area is A(x) = x^2. By the power rule, dA/dx = 2 x^(2-1). Therefore dA/dx = 2x."
          - problem: "Find the derivative of f(u) = u^8."
            answer: "8u^7"
            answer_contract: {"kind": "function", "vars": ["u"]}
            solution_sketch: "The function is f(u) = u^8. By the power rule, f'(u) = 8 u^(8-1) = 8u^7. The derivative is 8u^7."
          - problem: "Given y = t^2, find dy/dt."
            answer: "2t"
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: "The function is y = t^2. By the power rule, dy/dt = 2 t^(2-1) = 2t. Therefore dy/dt = 2t."
        constraints: "single power terms with exponents 2-8"
      - id: kp2
        name: Sums, constant multiples, and constants
        key_prerequisites: [derivative-definition, combining-like-terms]
        exemplars:
          - problem: 'Differentiate $f(x) = 3x^4 - 2x^2 + 7$.'
            answer: "12x^3 - 4x"
          - problem: 'Differentiate $f(x) = 2x^3 - 5x + 4$.'
            answer: "6x^2 - 5"
          - problem: "Let f(x) = 5x^3 + 2x^2 - 9x + 4. Find f'(x)."
            answer: "15x^2 + 4x - 9"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "The function is f(x) = 5x^3 + 2x^2 - 9x + 4. The sum rule splits the derivative into separate terms, and the constant-multiple rule keeps each coefficient. The power rule gives 15x^2 + 4x - 9, while the constant rule gives 0 for the constant 4. The answer is 15x^2 + 4x - 9."
          - problem: 'Differentiate $f(x) = 9$.'
            answer: "0"
          - problem: "Let g(x) = -4x^5 + 6x^3 - x. Find g'(x)."
            answer: "-20x^4 + 18x^2 - 1"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "The function is g(x) = -4x^5 + 6x^3 - x. The sum rule and constant-multiple rule let each term differentiate on its own. The power rule gives -20x^4 + 18x^2 - 1, because the derivative of x is 1. The answer is -20x^4 + 18x^2 - 1."
          - problem: "Let h(x) = 7x^6 - 3x^4 + 8x^2 - 11. Find h'(x)."
            answer: "42x^5 - 12x^3 + 16x"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "The function is h(x) = 7x^6 - 3x^4 + 8x^2 - 11. The sum rule, constant-multiple rule, and constant rule apply term by term. The power rule gives 42x^5 - 12x^3 + 16x, and the constant -11 gives 0. The answer is 42x^5 - 12x^3 + 16x."
        constraints: "integer coefficients and exponents 1-6; constants differentiate to 0"
      - id: kp3
        name: Evaluate polynomial derivatives at a point
        key_prerequisites: [derivative-definition, evaluating-polynomials]
        exemplars:
          - problem: 'For $f(x) = x^3 - 4x$, find $f''(2)$.'
            answer: "8"
            solution_sketch: '$f''(x) = 3x^2 - 4$, so $f''(2) = 12 - 4 = 8$.'
          - problem: 'For $p(x) = 5x^2 - 3x$, find $p''(-1)$.'
            answer: "-13"
            solution_sketch: '$p''(x) = 10x - 3$, so $p''(-1) = -13$.'
          - problem: "Let g(x) = 2x^3 - 5x + 1. Find g'(3)."
            answer: "49"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full object is g(x) = 2x^3 - 5x + 1. Differentiate term by term using the power rule and the constant rule: g'(x) = 6x^2 - 5. Substitute x = 3: 6(9) - 5 = 54 - 5 = 49. So g'(3) = 49."
          - problem: "Let h(x) = x^4 - 2x^2 + 7x. Find h'(-2)."
            answer: "-17"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full object is h(x) = x^4 - 2x^2 + 7x. Differentiate term by term using the power rule: h'(x) = 4x^3 - 4x + 7. Substitute x = -2: 4(-8) - 4(-2) + 7 = -32 + 8 + 7 = -17. So h'(-2) = -17."
          - problem: "Let q(x) = 3x^3 + 4x^2 - x + 6. Find q'(2)."
            answer: "51"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full object is q(x) = 3x^3 + 4x^2 - x + 6. Apply the power rule term by term: q'(x) = 9x^2 + 8x - 1. Substitute x = 2: 9(4) + 8(2) - 1 = 36 + 16 - 1 = 51. So q'(2) = 51."
          - problem: "Let r(x) = x^4 - 5x^2 + 3. Find the slope of the tangent line to the graph of r at x = -1."
            answer: "6"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full object is r(x) = x^4 - 5x^2 + 3. The slope of the tangent line is r'(x), so differentiate with the power rule: r'(x) = 4x^3 - 10x. Substitute x = -1: 4(-1) - 10(-1) = -4 + 10 = 6. The slope is 6."
        constraints: "evaluation points are small integers; answers are integers"
    diagnostic_exemplar:
      problem: 'For $f(x) = x^4 - 3x^2 + 2x$, find $f\''(2)$.'
      answer: '22'
      solution_sketch: '$f''(x) = 4x^3 - 6x + 2$, so $f''(2) = 32 - 12 + 2 = 22$.'
    anki_seeds:
      - front: "Power rule (whole-number case): d/dx x^n = ?"
        back: "n·x^(n-1)"
        type: basic
      - front: "d/dx of a constant = ? and d/dx [c·f(x)] = ?"
        back: "0; c·f'(x)"
        type: basic

  - id: derivative-power-rule
    name: The Power Rule
    core: true
    difficulty: 0.55
    drill: true
    answer_kind: expression
    expected_time_secs: 60
    prerequisites:
      - id: derivatives-of-polynomials
        weight: 0.8
        key: true
      - id: negative-zero-exponents
        weight: 0.5
        key: true
      - id: rational-exponents
        weight: 0.5
        key: true
    knowledge_points:
      - id: kp1
        name: Negative exponents
        key_prerequisites: [negative-zero-exponents, derivatives-of-polynomials]
        exemplars:
          - problem: 'Differentiate $f(x) = \frac{1}{x^2}$.'
            answer: "-2/x^3"
            solution_sketch: '$x^{-2} \mapsto -2x^{-3}$.'
          - problem: 'Differentiate $f(x) = x^{-3}$.'
            answer: "-3x^(-4)"
          - problem: 'Differentiate $f(x) = \frac{5}{x}$.'
            answer: "-5/x^2"
        constraints: "rewrite reciprocals as negative powers first; exponents -1 to -3"
      - id: kp2
        name: Fractional exponents and radicals
        key_prerequisites: [rational-exponents, derivatives-of-polynomials]
        exemplars:
          - problem: 'Differentiate $f(x) = \sqrt{x}$.'
            answer: "1/(2√x)"
            solution_sketch: '$x^{1/2} \mapsto \frac{1}{2}x^{-1/2}$.'
          - problem: 'Differentiate $f(x) = x^{2/3}$.'
            answer: "(2/3)x^(-1/3)"
          - problem: 'Differentiate $f(x) = \sqrt[3]{x}$.'
            answer: "(1/3)x^(-2/3)"
        constraints: "rewrite radicals as fractional powers first; exponents like 1/2, 1/3, 2/3"
      - id: kp3
        name: Rewrite before differentiating
        key_prerequisites: [negative-zero-exponents, rational-exponents]
        exemplars:
          - problem: 'Differentiate $f(x) = \frac{x^2 + 1}{x}$ by rewriting it first.'
            answer: "1 - 1/x^2"
            solution_sketch: '$f(x) = x + x^{-1}$, so $f''(x) = 1 - x^{-2}$.'
          - problem: 'Differentiate $f(x) = \frac{3}{\sqrt{x}}$ by rewriting it first.'
            answer: "-(3/2)x^(-3/2)"
            solution_sketch: '$f(x) = 3x^{-1/2}$, so $f''(x) = -\frac{3}{2}x^{-3/2}$.'
          - problem: 'Differentiate $f(x) = x^2\sqrt{x}$ by rewriting it first.'
            answer: "(5/2)x^(3/2)"
            solution_sketch: '$f(x) = x^{5/2}$, so $f''(x) = \frac{5}{2}x^{3/2}$.'
        constraints: "quotients and products that collapse into single powers or sums of powers; no quotient rule"
    diagnostic_exemplar:
      problem: 'Differentiate $f(x) = \frac{x^2 - 3}{\sqrt{x}}$ by rewriting it first.'
      answer: '(3/2)x^(1/2) + (3/2)x^(-3/2)'
      solution_sketch: 'Rewrite as $f(x) = x^{3/2} - 3x^{-1/2}$; then $f''(x) = \frac{3}{2}x^{1/2} + \frac{3}{2}x^{-3/2}$.'
    anki_seeds:
      - front: "Power rule: d/dx x^n = ?"
        back: "n·x^(n-1), for any real exponent n"
        type: basic
      - front: "d/dx √x = ?"
        back: "1/(2√x)"
        type: basic
      - front: "d/dx (1/x) = ?"
        back: "-1/x^2"
        type: basic

  - id: product-rule
    name: The Product Rule
    core: true
    difficulty: 0.58
    drill: false
    answer_kind: expression
    expected_time_secs: 120
    prerequisites:
      - id: derivative-power-rule
        weight: 0.8
        key: true
      - id: polynomial-multiplication
        weight: 0.4
      - id: derivatives-of-polynomials
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: Apply the product rule
        key_prerequisites: [derivative-power-rule]
        exemplars:
          - problem: 'Use the product rule to differentiate $f(x) = x^2(x^3 + 1)$.'
            answer: "5x^4 + 2x"
            solution_sketch: '$2x(x^3 + 1) + x^2 \cdot 3x^2 = 2x^4 + 2x + 3x^4 = 5x^4 + 2x$.'
          - problem: 'Differentiate $f(x) = (x^2 + 1)(x^3 - 2x)$.'
            answer: "5x^4 - 3x^2 - 2"
            solution_sketch: '$2x(x^3 - 2x) + (x^2 + 1)(3x^2 - 2)$; collect terms.'
        constraints: "two polynomial factors of degree ≤ 3; answers expandable for checking"
      - id: kp2
        name: Verify against expansion
        key_prerequisites: [derivative-power-rule, polynomial-multiplication]
        exemplars:
          - problem: 'Differentiate $f(x) = (x + 1)(x - 3)$ two ways: by the product rule and by expanding first. Confirm they agree.'
            answer: "2x - 2 (both ways)"
            answer_contract: {kind: none}
            solution_sketch: 'Product rule: $(x - 3) + (x + 1) = 2x - 2$; expansion $x^2 - 2x - 3$ differentiates to the same.'
          - problem: 'Differentiate $x^3 \cdot x^2$ by the product rule and confirm it matches $\frac{d}{dx} x^5$.'
            answer: "5x^4"
            solution_sketch: '$3x^2 \cdot x^2 + x^3 \cdot 2x = 5x^4 = \frac{d}{dx}x^5$.'
        constraints: "products that expand easily; the point is that both routes agree"
      - id: kp3
        name: Product rule with table values
        key_prerequisites: [derivative-power-rule]
        exemplars:
          - problem: 'Given $f(2) = 3$, $f''(2) = -1$, $g(2) = 5$, $g''(2) = 4$, find $(fg)''(2)$.'
            answer: "7"
            solution_sketch: '$f''g + fg'' = (-1)(5) + (3)(4) = 7$.'
          - problem: 'Given $f(1) = 2$, $f''(1) = 3$, $g(1) = -4$, $g''(1) = 1$, find $(fg)''(1)$.'
            answer: "-10"
        constraints: "single-digit table values; one application of f'g + fg'"
    diagnostic_exemplar:
      problem: 'Differentiate $f(x) = x^3(x^2 + 1)$.'
      answer: "5x^4 + 3x^2"
      solution_sketch: 'Product rule: $3x^2(x^2 + 1) + x^3(2x) = 3x^4 + 3x^2 + 2x^4$.'
    anki_seeds:
      - front: "Product rule: (fg)' = ?"
        back: "f'g + fg'"
        type: basic
      - front: "(fg)' equals f'g' — true or false?"
        back: "False — the product rule is f'g + fg'"
        type: basic

  - id: quotient-rule
    name: The Quotient Rule
    core: true
    difficulty: 0.6
    drill: false
    answer_kind: expression
    expected_time_secs: 150
    prerequisites:
      - id: product-rule
        weight: 0.6
        key: true
      - id: derivative-power-rule
        weight: 0.6
        key: true
      - id: rational-expressions
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: Apply the quotient rule
        key_prerequisites: [derivative-power-rule, product-rule]
        exemplars:
          - problem: 'Differentiate $f(x) = \frac{x}{x + 1}$.'
            answer: "1/(x + 1)^2"
            solution_sketch: '$\frac{(x+1) \cdot 1 - x \cdot 1}{(x+1)^2} = \frac{1}{(x+1)^2}$.'
          - problem: 'Differentiate $f(x) = \frac{2x + 1}{x - 3}$.'
            answer: "-7/(x - 3)^2"
            solution_sketch: '$\frac{2(x-3) - (2x+1)}{(x-3)^2} = \frac{-7}{(x-3)^2}$.'
          - problem: 'Differentiate $f(x) = \frac{x^2}{x^2 + 1}$.'
            answer: "2x/(x^2 + 1)^2"
            solution_sketch: '$\frac{2x(x^2+1) - x^2 \cdot 2x}{(x^2+1)^2} = \frac{2x}{(x^2+1)^2}$.'
        constraints: "low-degree numerator and denominator; numerator of the result simplifies to one or two terms"
      - id: kp2
        name: Rewrite instead when the quotient rule is overkill
        key_prerequisites: [derivative-power-rule]
        exemplars:
          - problem: 'Differentiate $f(x) = \frac{5}{x^2}$ the efficient way.'
            answer: "-10/x^3"
            solution_sketch: 'Rewrite as $5x^{-2}$ — no quotient rule needed.'
          - problem: 'Differentiate $f(x) = \frac{x^2 + 3x}{x}$ the efficient way.'
            answer: "1"
            solution_sketch: 'Simplify first: $f(x) = x + 3$ (for $x \neq 0$), so $f''(x) = 1$.'
        constraints: "constant numerators or cancellable quotients; the student picks the shortcut"
      - id: kp3
        name: Quotient rule with table values
        key_prerequisites: [product-rule, derivative-power-rule]
        exemplars:
          - problem: 'Given $f(3) = 2$, $f''(3) = 4$, $g(3) = -1$, $g''(3) = 5$, find $\left(\frac{f}{g}\right)''(3)$.'
            answer: "-14"
            solution_sketch: '$\frac{f''g - fg''}{g^2} = \frac{4(-1) - 2 \cdot 5}{(-1)^2} = -14$.'
          - problem: 'Given $f(0) = 6$, $f''(0) = 2$, $g(0) = 3$, $g''(0) = 1$, find $\left(\frac{f}{g}\right)''(0)$.'
            answer: "0"
            solution_sketch: '$\frac{2 \cdot 3 - 6 \cdot 1}{9} = 0$.'
        constraints: "single-digit table values; g at the point is nonzero"
    diagnostic_exemplar:
      problem: 'Differentiate $f(x) = \frac{x}{x + 3}$.'
      answer: "3/(x + 3)^2"
      solution_sketch: 'Quotient rule: $\frac{1 \cdot (x+3) - x \cdot 1}{(x+3)^2} = \frac{3}{(x+3)^2}$.'
    anki_seeds:
      - front: "Quotient rule: (f/g)' = ?"
        back: "(f'g - fg') / g^2 — the minus term is the numerator's, in that order"
        type: basic
      - front: "Before reaching for the quotient rule on c/x^n, instead..."
        back: "rewrite as c·x^(-n) and use the power rule"
        type: basic

  - id: product-quotient-rules
    name: Product and Quotient Rules
    core: true
    difficulty: 0.62
    drill: false
    answer_kind: expression
    expected_time_secs: 150
    prerequisites:
      - id: product-rule
        weight: 0.7
        key: true
      - id: quotient-rule
        weight: 0.7
        key: true
      - id: tangent-line-equation
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: Evaluate a derivative at a point
        key_prerequisites: [product-rule, quotient-rule]
        exemplars:
          - problem: 'For $g(x) = x^3(x - 4)$, find $g''(2)$.'
            answer: "-16"
            solution_sketch: '$g''(x) = 3x^2(x-4) + x^3 = 4x^3 - 12x^2$; $g''(2) = 32 - 48 = -16$.'
          - problem: 'For $f(x) = \frac{x^2 - 1}{x + 2}$, find $f''(1)$.'
            answer: "2/3"
            solution_sketch: '$f''(x) = \frac{2x(x+2) - (x^2-1)}{(x+2)^2} = \frac{x^2 + 4x + 1}{(x+2)^2}$; $f''(1) = \frac{6}{9} = \frac{2}{3}$.'
        constraints: "evaluation point keeps arithmetic small; answers are integers or simple fractions"
      - id: kp2
        name: Combine product and quotient structures
        key_prerequisites: [product-rule, quotient-rule]
        exemplars:
          - problem: 'Differentiate $f(x) = \frac{x(x + 2)}{x + 1}$.'
            answer: "(x^2 + 2x + 2)/(x + 1)^2"
            solution_sketch: 'Numerator $x^2 + 2x$ has derivative $2x + 2$; quotient rule gives $\frac{(2x+2)(x+1) - (x^2+2x)}{(x+1)^2} = \frac{x^2 + 2x + 2}{(x+1)^2}$.'
          - problem: 'Differentiate $g(x) = (x^3 - 1)(2x + 5)$ and simplify.'
            answer: "8x^3 + 15x^2 - 2"
            solution_sketch: '$3x^2(2x+5) + 2(x^3-1) = 6x^3 + 15x^2 + 2x^3 - 2$.'
        constraints: "one product-inside-quotient and one simplify-after-product problem; integer coefficients"
      - id: kp3
        name: Tangent lines to product and quotient curves
        key_prerequisites: [product-rule, quotient-rule, tangent-line-equation]
        exemplars:
          - problem: 'Find the tangent line to $y = \frac{x}{x + 1}$ at $x = 1$. Give the expression for $y$.'
            answer: "x/4 + 1/4"
            solution_sketch: '$y'' = \frac{1}{(x+1)^2}$ gives slope $\frac{1}{4}$ at $(1, \frac{1}{2})$: $y - \frac{1}{2} = \frac{1}{4}(x - 1)$.'
          - problem: 'Find the tangent line to $y = x^2(x - 3)$ at $x = 1$. Give the expression for $y$.'
            answer: "-3x + 1"
            solution_sketch: '$y = x^3 - 3x^2$, $y'' = 3x^2 - 6x$; slope $-3$ at $(1, -2)$: $y + 2 = -3(x - 1)$.'
        constraints: "tangent point coordinates and slopes are integers or simple fractions; the answer is the slope-intercept expression for y"
    diagnostic_exemplar:
      problem: 'Find the tangent line to $y = \frac{x(x + 2)}{x + 1}$ at $x = 1$. Give the expression for $y$.'
      answer: '5x/4 + 1/4'
      solution_sketch: 'With numerator $x^2 + 2x$: $y'' = \frac{(2x+2)(x+1) - (x^2+2x)}{(x+1)^2} = \frac{x^2 + 2x + 2}{(x+1)^2}$, so the slope at $x = 1$ is $\frac{5}{4}$ and $y(1) = \frac{3}{2}$; the tangent is $y = \frac{5}{4}(x-1) + \frac{3}{2}$.'
    anki_seeds:
      - front: "Product rule: (fg)' = ?"
        back: "f'g + fg'"
        type: basic
      - front: "Quotient rule: (f/g)' = ?"
        back: "(f'g - fg') / g^2 — the minus term is the numerator's, in that order"
        type: basic
