unit: intro-integration
course: calculus-1
module: "Introduction to Integration"
topics:
  - id: reverse-power-rule
    name: The Reverse Power Rule
    core: true
    difficulty: 0.5
    drill: false
    answer_kind: expression
    expected_time_secs: 90
    prerequisites:
      - id: derivative-power-rule
        weight: 0.8
        key: true
      - id: rational-exponents
        weight: 0.4
        key: true
      - id: negative-zero-exponents
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: Antidifferentiate single powers
        key_prerequisites: [derivative-power-rule]
        exemplars:
          - problem: 'Find $\int x^3 \, dx$.'
            answer: "x^4/4 + C"
          - problem: 'Find $\int x^5 \, dx$.'
            answer: "x^6/6 + C"
            solution_sketch: 'Raise the exponent by one and divide by the new exponent; check by differentiating.'
          - problem: "Find the most general antiderivative of x^4."
            answer: "x^5/5 + C"
            answer_contract: {"kind": "function", "up_to_constant": true, "vars": ["x"]}
            solution_sketch: "The object is the indefinite integral of x^4. The reverse power rule raises the exponent from 4 to 5 and divides by 5, giving x^5/5, then add the constant of integration. The answer is x^5/5 + C."
          - problem: "Compute the indefinite integral of x^6."
            answer: "x^7/7 + C"
            answer_contract: {"kind": "function", "up_to_constant": true, "vars": ["x"]}
            solution_sketch: "The object is the indefinite integral of x^6. The reverse power rule raises the exponent from 6 to 7 and divides by 7, giving x^7/7, then add the constant of integration. The answer is x^7/7 + C."
          - problem: "The derivative of a function f is x^2. Find the general form of f(x)."
            answer: "x^3/3 + C"
            answer_contract: {"kind": "function", "up_to_constant": true, "vars": ["x"]}
            solution_sketch: "The object is the antiderivative of x^2. The reverse power rule raises the exponent from 2 to 3 and divides by 3, giving x^3/3, then add the constant of integration. The answer is x^3/3 + C."
          - problem: "Determine the most general antiderivative of x^7."
            answer: "x^8/8 + C"
            answer_contract: {"kind": "function", "up_to_constant": true, "vars": ["x"]}
            solution_sketch: "The object is the indefinite integral of x^7. The reverse power rule raises the exponent from 7 to 8 and divides by 8, giving x^8/8, then add the constant of integration. The answer is x^8/8 + C."
        constraints: "positive integer exponents; always include + C"
      - id: kp2
        name: Antidifferentiate polynomials term by term
        key_prerequisites: [derivative-power-rule]
        exemplars:
          - problem: 'Find $\int (6x^2 - 4x + 1) \, dx$.'
            answer: "2x^3 - 2x^2 + x + C"
            solution_sketch: 'Antidifferentiate term by term; check by differentiating.'
          - problem: 'Find $\int (3x^2 + 2x) \, dx$.'
            answer: "x^3 + x^2 + C"
          - problem: "Consider the polynomial $f(x) = 4x^3 - 6x^2 + 2$. Find the antiderivative of $f(x)$ with respect to $x$."
            answer: "x^4 - 2x^3 + 2x + C"
            answer_contract: {"kind": "function", "up_to_constant": true, "vars": ["x"]}
            solution_sketch: "The object is the integral of (4x^3 - 6x^2 + 2) dx. By the reverse power rule, 4x^3 integrates to x^4, -6x^2 integrates to -2x^3, and 2 integrates to 2x. Add the constant of integration: x^4 - 2x^3 + 2x + C."
          - problem: "Find the antiderivative of $g(x) = 10x^4 + 9x^2 - 4$."
            answer: "2x^5 + 3x^3 - 4x + C"
            answer_contract: {"kind": "function", "up_to_constant": true, "vars": ["x"]}
            solution_sketch: "Start with the integral of (10x^4 + 9x^2 - 4) dx. The reverse power rule gives 10x^4 to 2x^5, 9x^2 to 3x^3, and -4 to -4x. Include the constant: 2x^5 + 3x^3 - 4x + C."
          - problem: "Consider the polynomial $p(x) = 8x^3 - 12x$. Find its most general antiderivative."
            answer: "2x^4 - 6x^2 + C"
            answer_contract: {"kind": "function", "up_to_constant": true, "vars": ["x"]}
            solution_sketch: "The integral to evaluate is the integral of (8x^3 - 12x) dx. Reverse power rule: 8x^3 gives 2x^4 and -12x gives -6x^2. Add C, so the antiderivative is 2x^4 - 6x^2 + C."
          - problem: "Find the antiderivative of $q(x) = 12x^3 + 8x$."
            answer: "3x^4 + 4x^2 + C"
            answer_contract: {"kind": "function", "up_to_constant": true, "vars": ["x"]}
            solution_sketch: "The full object is the integral of (12x^3 + 8x) dx. Apply the reverse power rule term by term: 12x^3 integrates to 3x^4 and 8x integrates to 4x^2. Therefore the antiderivative is 3x^4 + 4x^2 + C."
        constraints: "integer coefficients; results have integer coefficients"
      - id: kp3
        name: Rewrite radicals and negative powers first
        key_prerequisites: [derivative-power-rule, rational-exponents]
        exemplars:
          - problem: 'Find $\int \sqrt{x} \, dx$.'
            answer: "(2/3)x^(3/2) + C"
            solution_sketch: '$\sqrt{x} = x^{1/2}$; raise to $x^{3/2}$ and divide by $\frac{3}{2}$.'
          - problem: 'Find $\int \frac{1}{x^2} \, dx$.'
            answer: "-1/x + C"
            solution_sketch: '$x^{-2}$ antidifferentiates to $\frac{x^{-1}}{-1} = -\frac{1}{x}$.'
          - problem: "Rewrite the integrand as a power of x and find $\\int 1/\\sqrt{x}\\,dx$."
            answer: "2sqrt(x) + C"
            answer_contract: {"kind": "function", "up_to_constant": true, "vars": ["x"]}
            solution_sketch: "Rewrite the integrand: 1/sqrt(x) = x^(-1/2). Apply the reverse power rule: raise the exponent by one to 1/2 and divide by 1/2, so x^(1/2)/(1/2) = 2x^(1/2). The antiderivative is 2sqrt(x) + C."
          - problem: 'Find $\int x(x + 2) \, dx$.'
            answer: "x^3/3 + x^2 + C"
            solution_sketch: 'Expand first: $\int (x^2 + 2x)\,dx$.'
          - problem: "Rewrite the integrand as a power of x and find $\\int 1/x^3\\,dx$."
            answer: "-1/(2x^2) + C"
            answer_contract: {"kind": "function", "up_to_constant": true, "vars": ["x"]}
            solution_sketch: "Rewrite the integrand: 1/x^3 = x^(-3). Apply the reverse power rule: x^(-2)/(-2) = -1/(2x^2). The antiderivative is -1/(2x^2) + C."
          - problem: "Rewrite each term as a power of x and find $\\int (3\\sqrt{x} - 4/x^2)\\,dx$."
            answer: "2x^(3/2) + 4/x + C"
            answer_contract: {"kind": "function", "up_to_constant": true, "vars": ["x"]}
            solution_sketch: "Rewrite each term: 3sqrt(x) = 3x^(1/2) and 4/x^2 = 4x^(-2). Apply the reverse power rule term by term: 3x^(3/2)/(3/2) = 2x^(3/2) and -4x^(-1)/(-1) = 4/x. The antiderivative is 2x^(3/2) + 4/x + C."
        constraints: "rewrite as powers before integrating; exponents ≠ -1"
    diagnostic_exemplar:
      problem: 'Find $\int \left(\sqrt{x} + \frac{3}{x^2}\right) dx$.'
      answer: "(2/3)x^(3/2) - 3/x + C"
      solution_sketch: 'Rewrite as $x^{1/2} + 3x^{-2}$, then raise each exponent by one and divide: $\frac{2}{3}x^{3/2} + \frac{3x^{-1}}{-1} + C$.'
    anki_seeds:
      - front: "Reverse power rule: ∫ x^n dx = ? (n ≠ -1)"
        back: "x^(n+1)/(n+1) + C"
        type: basic
      - front: "Before applying the reverse power rule to √x or 1/x², first..."
        back: "rewrite as a power: x^(1/2), x^(-2)"
        type: basic

  - id: antiderivatives
    name: Antiderivatives
    core: true
    difficulty: 0.55
    drill: false
    answer_kind: expression
    expected_time_secs: 120
    prerequisites:
      - id: reverse-power-rule
        weight: 0.8
        key: true
      - id: derivatives-trig
        weight: 0.5
        key: true
      - id: derivatives-exp-log
        weight: 0.5
        key: true
    knowledge_points:
      - id: kp1
        name: Antiderivatives of trig, exponential, and 1/x
        key_prerequisites: [derivatives-trig, derivatives-exp-log]
        exemplars:
          - problem: 'Find $\int \cos x \, dx$.'
            answer: "sin x + C"
          - problem: 'Find $\int \left(e^x + \frac{1}{x}\right) dx$ for $x > 0$.'
            answer: "e^x + ln x + C"
          - problem: 'Find $\int \sec^2 x \, dx$.'
            answer: "tan x + C"
        constraints: "the basic table: sin, cos, sec^2, e^x, 1/x"
      - id: kp2
        name: Rewrite, then antidifferentiate
        key_prerequisites: [reverse-power-rule, derivatives-trig]
        exemplars:
          - problem: 'Find $\int \frac{x^3 + 2x}{x} \, dx$.'
            answer: "x^3/3 + 2x + C"
            solution_sketch: 'Divide first: $\int (x^2 + 2)\,dx$.'
          - problem: 'Find $\int \sqrt{x}\,(x + 1) \, dx$.'
            answer: "(2/5)x^(5/2) + (2/3)x^(3/2) + C"
            solution_sketch: 'Expand: $\int (x^{3/2} + x^{1/2})\,dx$.'
          - problem: 'Find $\int (2\sin x - 3e^x) \, dx$.'
            answer: "-2cos x - 3e^x + C"
        constraints: "algebraic rewriting (divide, expand) before integrating; mixed table entries"
      - id: kp3
        name: Determine C from an initial condition
        key_prerequisites: [reverse-power-rule, derivatives-trig]
        exemplars:
          - problem: 'Find $f(x)$ given $f''(x) = 2x$ and $f(1) = 5$.'
            answer: "x^2 + 4"
            solution_sketch: '$f(x) = x^2 + C$; $1 + C = 5$ gives $C = 4$.'
          - problem: 'Find $f(x)$ given $f''(x) = 3x^2 - 2$ and $f(0) = 1$.'
            answer: "x^3 - 2x + 1"
          - problem: 'Find $f(x)$ given $f''(x) = \cos x$ and $f(0) = 2$.'
            answer: "sin x + 2"
        constraints: "one initial condition; C is a small integer"
    diagnostic_exemplar:
      problem: 'Find $f(x)$ given $f''(x) = 4x + \cos x$ and $f(0) = 3$.'
      answer: "2x^2 + sin x + 3"
      solution_sketch: 'Antidifferentiate to $f(x) = 2x^2 + \sin x + C$; the initial condition $f(0) = C = 3$ pins the constant.'
    anki_seeds:
      - front: "∫ 1/x dx = ?"
        back: "ln|x| + C"
        type: basic
      - front: "∫ sin x dx = ? and ∫ cos x dx = ?"
        back: "-cos x + C; sin x + C (mind the sign on the first)"
        type: basic
      - front: "Two antiderivatives of the same function differ by..."
        back: "a constant — hence the + C"
        type: basic

  - id: left-right-riemann-sums
    name: Left and Right Riemann Sums
    core: true
    difficulty: 0.5
    drill: false
    answer_kind: numeric
    expected_time_secs: 150
    prerequisites:
      - id: function-notation
        weight: 0.5
        key: true
      - id: area-triangles-quadrilaterals
        weight: 0.4
        key: true
      - id: summation-notation
        weight: 0.4
      - id: decimal-operations
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: Right Riemann sums
        key_prerequisites: [function-notation, area-triangles-quadrilaterals]
        exemplars:
          - problem: 'Approximate $\int_0^2 x^2 \, dx$ with a right Riemann sum using $n = 4$ equal subintervals.'
            answer: "3.75"
            solution_sketch: '$\Delta x = 0.5$; sum $= 0.5(0.25 + 1 + 2.25 + 4) = 3.75$.'
          - problem: 'Approximate $\int_0^4 x \, dx$ with a right Riemann sum using $n = 4$.'
            answer: "10"
            solution_sketch: '$\Delta x = 1$; $1 + 2 + 3 + 4 = 10$.'
          - problem: "Compute the right Riemann sum for $\\int_0^2 (x^2 + 1)\\,dx$ using $n = 4$ equal subintervals, and give the answer to 2 decimals."
            answer: "5.75"
            answer_contract: {"decimals": 2, "kind": "approx"}
            solution_sketch: "The right Riemann sum is $\\Delta x(f(0.5)+f(1)+f(1.5)+f(2))$ with $\\Delta x=0.5$. Step 1: choose the right endpoints 0.5, 1, 1.5, 2 by the right endpoint rule. Step 2: the values are 1.25, 2, 3.25, 5, so the sum is $0.5(11.5)$. The answer is 5.75."
          - problem: "Compute the right Riemann sum for $\\int_1^3 (2x+1)\\,dx$ using $n = 4$ equal subintervals, and give the answer to 2 decimals."
            answer: "11.00"
            answer_contract: {"decimals": 2, "kind": "approx"}
            solution_sketch: "The right Riemann sum is $\\Delta x(f(1.5)+f(2)+f(2.5)+f(3))$ with $\\Delta x=0.5$. Step 1: choose the right endpoints 1.5, 2, 2.5, 3 by the right endpoint rule. Step 2: the values are 4, 5, 6, 7, so the sum is $0.5(22)$. The answer is 11.00."
          - problem: "Compute the right Riemann sum for $\\int_0^3 x^2\\,dx$ using $n = 3$ equal subintervals, and give the answer to 2 decimals."
            answer: "14.00"
            answer_contract: {"decimals": 2, "kind": "approx"}
            solution_sketch: "The right Riemann sum is $\\Delta x(f(1)+f(2)+f(3))$ with $\\Delta x=1$. Step 1: choose the right endpoints 1, 2, 3 by the right endpoint rule. Step 2: the values are 1, 4, 9, so the sum is $1(14)$. The answer is 14.00."
          - problem: "Compute the right Riemann sum for $\\int_0^2 (x^2 - x)\\,dx$ using $n = 4$ equal subintervals, and give the answer to 2 decimals."
            answer: "1.25"
            answer_contract: {"decimals": 2, "kind": "approx"}
            solution_sketch: "The right Riemann sum is $\\Delta x(f(0.5)+f(1)+f(1.5)+f(2))$ with $\\Delta x=0.5$. Step 1: choose the right endpoints 0.5, 1, 1.5, 2 by the right endpoint rule. Step 2: the values are -0.25, 0, 0.75, 2, so the sum is $0.5(2.5)$. The answer is 1.25."
        constraints: "n ≤ 5 equal subintervals; sample values give terminating decimals"
      - id: kp2
        name: Left Riemann sums
        key_prerequisites: [function-notation, area-triangles-quadrilaterals]
        exemplars:
          - problem: 'Approximate $\int_0^2 x^2 \, dx$ with a left Riemann sum using $n = 4$.'
            answer: "1.75"
            solution_sketch: '$0.5(0 + 0.25 + 1 + 2.25) = 1.75$.'
          - problem: 'Approximate $\int_0^4 x \, dx$ with a left Riemann sum using $n = 4$.'
            answer: "6"
            solution_sketch: '$0 + 1 + 2 + 3 = 6$.'
          - problem: "Approximate $\\int_0^3 x^2 \\, dx$ with a left Riemann sum using $n = 3$. Give the sum."
            answer: "5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The left Riemann sum rule is L = sum of f(left endpoint) times Delta x. Step 1: Delta x = (3 - 0)/3 = 1. Step 2: the left endpoints are 0, 1, and 2, so the heights are f(0)=0, f(1)=1, and f(2)=4. Step 3: L = 1*0 + 1*1 + 1*4 = 5. The left Riemann sum is 5."
          - problem: "Approximate $\\int_0^4 x^2 \\, dx$ with a left Riemann sum using $n = 4$. Give the sum."
            answer: "14"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The left Riemann sum rule is L = sum of f(left endpoint) times Delta x. Step 1: Delta x = (4 - 0)/4 = 1. Step 2: the left endpoints are 0, 1, 2, and 3, so the heights are f(0)=0, f(1)=1, f(2)=4, and f(3)=9. Step 3: L = 1*0 + 1*1 + 1*4 + 1*9 = 14. The left Riemann sum is 14."
          - problem: "Approximate $\\int_0^2 (x + 1) \\, dx$ with a left Riemann sum using $n = 2$. Give the sum."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The left Riemann sum rule is L = sum of f(left endpoint) times Delta x. Step 1: Delta x = (2 - 0)/2 = 1. Step 2: the left endpoints are 0 and 1, so the heights are f(0)=1 and f(1)=2. Step 3: L = 1*1 + 1*2 = 3. The left Riemann sum is 3."
          - problem: "A car's velocity $v(t)$ in m/s is measured at $t = 0, 1, 2, 3$ seconds: $v(0)=4$, $v(1)=6$, $v(2)=5$, $v(3)=7$. Use a left Riemann sum with $n = 3$ subintervals on $[0,3]$ to estimate the distance. Give the estimate."
            answer: "15"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The left Riemann sum rule is L = sum of v(left time) times Delta t. Step 1: Delta t = (3 - 0)/3 = 1. Step 2: the left times are 0, 1, and 2, so the velocities are v(0)=4, v(1)=6, and v(2)=5. Step 3: L = 1*4 + 1*6 + 1*5 = 15. The distance estimate is 15."
        constraints: "same setups as right sums so the two can be compared"
      - id: kp3
        name: Overestimate or underestimate?
        key_prerequisites: [function-notation]
        exemplars:
          - problem: "For f(x) = 3x on [0, 2], compute the right Riemann sum with n = 2. State the direction of the error and give the error amount."
            answer: "verdict = overestimate; error = 3"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["overestimate"], ["underestimate"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "error"}]}
            solution_sketch: "Right-sum step: dx = (2 - 0)/2 = 1, and the right endpoints are x = 1 and x = 2, so the right sum is 1(3 + 6) = 9. Exact-integral step: the integral of 3x from 0 to 2 is 3x^2/2 evaluated from 0 to 2, which is 6. Monotonicity step: 3x is increasing, so the right sum is an overestimate. Error step: 9 - 6 = 3. Answer: verdict = overestimate; error = 3."
          - problem: "For f(x) = 4 - x on [0, 4], compute the right Riemann sum with n = 4. State the direction of the error and give the error amount."
            answer: "verdict = underestimate; error = 2"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["overestimate"], ["underestimate"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "error"}]}
            solution_sketch: "Right-sum step: dx = (4 - 0)/4 = 1, and the right endpoints are x = 1, 2, 3, 4, so the right sum is 3 + 2 + 1 + 0 = 6. Exact-integral step: the integral of 4 - x from 0 to 4 is 4x - x^2/2 evaluated from 0 to 4, which is 8. Monotonicity step: 4 - x is decreasing, so the right sum is an underestimate. Error step: 8 - 6 = 2. Answer: verdict = underestimate; error = 2."
          - problem: "For f(x) = x^2 on [0, 3], compute the left Riemann sum with n = 3. State the direction of the error and give the error amount."
            answer: "verdict = underestimate; error = 4"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["overestimate"], ["underestimate"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "error"}]}
            solution_sketch: "Left-sum step: dx = (3 - 0)/3 = 1, and the left endpoints are x = 0, 1, 2, so the left sum is 0 + 1 + 4 = 5. Exact-integral step: the integral of x^2 from 0 to 3 is x^3/3 evaluated from 0 to 3, which is 9. Monotonicity step: x^2 is increasing, so the left sum is an underestimate. Error step: 9 - 5 = 4. Answer: verdict = underestimate; error = 4."
          - problem: "For f(x) = 9 - 2x on [0, 4], compute the left Riemann sum with n = 2. State the direction of the error and give the error amount."
            answer: "verdict = overestimate; error = 8"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["overestimate"], ["underestimate"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "error"}]}
            solution_sketch: "Left-sum step: dx = (4 - 0)/2 = 2, and the left endpoints are x = 0 and x = 2, so the left sum is 2(9 + 5) = 28. Exact-integral step: the integral of 9 - 2x from 0 to 4 is 9x - x^2 evaluated from 0 to 4, which is 36 - 16 = 20. Monotonicity step: 9 - 2x is decreasing, so the left endpoints give the tallest rectangles and the left sum is an overestimate. Error step: 28 - 20 = 8. Answer: verdict = overestimate; error = 8."
          - problem: "For f(x) = 2x on [0, 3], compute the right Riemann sum with n = 3. Find the signed error right sum minus the integral, where a positive value means an overestimate and a negative value means an underestimate."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Right-sum step: dx = (3 - 0)/3 = 1, and the right endpoints are x = 1, 2, 3, so the right sum is 2 + 4 + 6 = 12. Exact-integral step: the integral of 2x from 0 to 3 is x^2 evaluated from 0 to 3, which is 9. Signed-error step: right sum minus integral is 12 - 9 = 3. Answer: 3."
          - problem: "For f(x) = 9 - x^2 on [0, 3], compute the right Riemann sum with n = 3. Find the signed error right sum minus the integral, where a positive value means an overestimate and a negative value means an underestimate."
            answer: "-5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Right-sum step: dx = (3 - 0)/3 = 1, and the right endpoints are x = 1, 2, 3, so the right sum is 8 + 5 + 0 = 13. Exact-integral step: the integral of 9 - x^2 from 0 to 3 is 9x - x^3/3 evaluated from 0 to 3, which is 18. Signed-error step: right sum minus integral is 13 - 18 = -5. Answer: -5."
        constraints: "monotonic integrands only; ask for the direction of the error"
    diagnostic_exemplar:
      problem: 'Approximate $\int_0^2 2x \, dx$ with a right Riemann sum using $n = 2$.'
      answer: "6"
      solution_sketch: '$\Delta x = 1$; $f(1) + f(2) = 2 + 4 = 6$.'
    anki_seeds:
      - front: "In a Riemann sum with n equal subintervals on [a, b], Δx = ?"
        back: "(b - a)/n"
        type: basic
      - front: "For an INCREASING function, the left Riemann sum ___ and the right sum ___ the integral."
        back: "underestimates; overestimates (reversed for decreasing functions)"
        type: basic

  - id: definite-integrals-as-area
    name: Definite Integrals as Geometric Area
    core: true
    difficulty: 0.55
    drill: false
    answer_kind: numeric
    expected_time_secs: 150
    prerequisites:
      - id: left-right-riemann-sums
        weight: 0.6
        key: true
      - id: area-triangles-quadrilaterals
        weight: 0.5
        key: true
      - id: circle-area-circumference
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: Triangles, rectangles, and trapezoids
        key_prerequisites: [area-triangles-quadrilaterals, left-right-riemann-sums]
        exemplars:
          - problem: 'Evaluate $\int_0^4 x \, dx$ by interpreting it as an area.'
            answer: "8"
            solution_sketch: 'Triangle with base $4$ and height $4$: $\frac{1}{2} \cdot 4 \cdot 4 = 8$.'
          - problem: 'Evaluate $\int_0^3 (2x + 1) \, dx$ using a trapezoid.'
            answer: "12"
            solution_sketch: 'Parallel sides $1$ and $7$, width $3$: $\frac{1 + 7}{2} \cdot 3 = 12$.'
          - problem: "Find the value of $\\int_0^6 x \\, dx$ by interpreting it as the area under a line."
            answer: "18"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: The integrand x is a line from (0,0) to (6,6). Step 2: The region is a right triangle with base 6 and height 6. Step 3: Use the triangle area formula, area = one half times base times height = one half times 6 times 6 = 18, so the integral is 18."
          - problem: "Find the value of $\\int_0^3 (2x + 4) \\, dx$ by interpreting it as the area of a trapezoid."
            answer: "21"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: The line y = 2x + 4 has value 4 at x = 0 and 10 at x = 3. Step 2: The parallel sides are 4 and 10, and the horizontal width is 3. Step 3: Use the trapezoid area formula, area = (4 + 10)/2 times 3 = 21, so the integral is 21."
          - problem: "Find the value of $\\int_1^6 3 \\, dx$ by interpreting it as the area of a rectangle."
            answer: "15"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: The integrand is the constant 3, so the region is a rectangle. Step 2: The rectangle has height 3 and width 6 - 1 = 5. Step 3: Use the rectangle area formula, area = 3 times 5 = 15, so the integral is 15."
          - problem: "Find the value of $\\int_3^7 (2x - 6) \\, dx$ by interpreting it as the area of a triangle."
            answer: "16"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: The line y = 2x - 6 is 0 at x = 3 and 8 at x = 7. Step 2: The region is a right triangle with base 7 - 3 = 4 and height 8. Step 3: Use the triangle area formula, area = one half times 4 times 8 = 16, so the integral is 16."
        constraints: "linear integrands; the region is a triangle, rectangle, or trapezoid; exact answers"
      - id: kp2
        name: Circular regions
        key_prerequisites: [circle-area-circumference, area-triangles-quadrilaterals]
        exemplars:
          - problem: 'Evaluate $\int_{-2}^{2} \sqrt{4 - x^2} \, dx$ by recognizing the region.'
            answer: "2π"
            solution_sketch: 'Upper semicircle of radius $2$: $\frac{1}{2}\pi \cdot 2^2 = 2\pi$.'
          - problem: 'Evaluate $\int_0^3 \sqrt{9 - x^2} \, dx$ by recognizing the region.'
            answer: "9π/4"
            solution_sketch: 'Quarter circle of radius $3$: $\frac{1}{4}\pi \cdot 3^2$.'
          - problem: "Evaluate the definite integral of sqrt(16 - x^2) from -4 to 4 by recognizing the region under the curve, and give the answer as an exact multiple of pi."
            answer: "8pi"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The integral is the definite integral of sqrt(16 - x^2) from -4 to 4. The curve is the upper semicircle of radius 4. The semicircle area rule gives (1/2)pi r^2 = (1/2)pi(16) = 8pi. The value is 8pi."
          - problem: "Evaluate the definite integral of sqrt(25 - x^2) from 0 to 5 by recognizing the region under the curve, and give the answer as an exact multiple of pi."
            answer: "25pi/4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The integral is the definite integral of sqrt(25 - x^2) from 0 to 5. The curve is the quarter circle of radius 5 in the first quadrant. The quarter-circle area rule gives (1/4)pi r^2 = (1/4)pi(25) = 25pi/4. The value is 25pi/4."
          - problem: "The graph of y = sqrt(9 - x^2) from x = -3 to x = 3 together with the x-axis bounds a region. Find the area of that region as an exact multiple of pi."
            answer: "9pi/2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The region is bounded by y = sqrt(9 - x^2) from x = -3 to x = 3 and the x-axis. This is the upper semicircle of radius 3. The semicircle area rule gives (1/2)pi r^2 = (1/2)pi(9) = 9pi/2. The area is 9pi/2."
          - problem: "Evaluate the definite integral of sqrt(4 - x^2) from 0 to 2 by recognizing the region under the curve, and give the answer as an exact multiple of pi."
            answer: "pi"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The integral is the definite integral of sqrt(4 - x^2) from 0 to 2. The curve is the quarter circle of radius 2 in the first quadrant. The quarter-circle area rule gives (1/4)pi r^2 = (1/4)pi(4) = pi. The value is pi."
        constraints: "semicircles or quarter circles of integer radius; answers as exact multiples of π"
      - id: kp3
        name: Signed area
        key_prerequisites: [area-triangles-quadrilaterals, left-right-riemann-sums]
        exemplars:
          - problem: 'Evaluate $\int_0^3 (-2) \, dx$.'
            answer: "-6"
            solution_sketch: 'A rectangle of height $-2$ contributes signed area $-2 \cdot 3 = -6$.'
          - problem: 'Evaluate $\int_0^2 (x - 2) \, dx$ by interpreting it as a signed area.'
            answer: "-2"
            solution_sketch: 'A triangle of area $2$ lying entirely below the axis.'
          - problem: 'Evaluate $\int_0^4 (x - 2) \, dx$ by interpreting it as signed area.'
            answer: "0"
            solution_sketch: 'The triangle below the axis on $[0, 2]$ and the one above on $[2, 4]$ each have area $2$; they cancel.'
          - problem: "Evaluate $\\int_{-2}^{2} (x+1) \\, dx$ by interpreting it as signed area."
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The integral is $\\int_{-2}^{2} (x+1) \\, dx$. The line $y = x+1$ crosses the axis at $x = -1$. On $[-2, -1]$ it forms a triangle with base $1$ and height $1$; by the triangle area formula its signed area is $-1/2$. On $[-1, 2]$ it forms a triangle with base $3$ and height $3$; its signed area is $9/2$. Add the signed areas: $-1/2 + 9/2 = 4$. The signed area is 4."
          - problem: "Evaluate $\\int_{-3}^{1} abs(x) \\, dx$ by interpreting it as signed area."
            answer: "5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The integral is $\\int_{-3}^{1} abs(x) \\, dx$. The graph of $y = abs(x)$ is a V with vertex at the origin and has no negative values. On $[-3, 0]$ it forms a triangle with base $3$ and height $3$; by the triangle area formula its signed area is $9/2$. On $[0, 1]$ it forms a triangle with base $1$ and height $1$; its signed area is $1/2$. Add the signed areas: $9/2 + 1/2 = 5$. The signed area is 5."
          - problem: "Evaluate $\\int_{-1}^{3} (3 - x) \\, dx$ by interpreting it as signed area."
            answer: "8"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The integral is $\\int_{-1}^{3} (3 - x) \\, dx$. The line $y = 3 - x$ has no negative values on $[-1, 3]$. At $x = -1$ the height is $4$, and at $x = 3$ the height is $0$. By the triangle area formula, the region is a right triangle with base $4$ and height $4$, so its area is $\\frac{1}{2} \\cdot 4 \\cdot 4 = 8$. The signed area is 8."
        constraints: "regions split cleanly at axis crossings; integer signed areas"
    diagnostic_exemplar:
      problem: 'Evaluate $\int_{-2}^{2} \left(\sqrt{4 - x^2} - 2\right) dx$ by interpreting it as area.'
      answer: '2π - 8'
      solution_sketch: '$\int_{-2}^{2}\sqrt{4-x^2}\,dx$ is the upper half of the circle of radius $2$, area $2\pi$; $\int_{-2}^{2}(-2)\,dx$ is a rectangle below the axis, $-8$.'
    anki_seeds:
      - front: "The definite integral of f from a to b measures..."
        back: "signed area between the graph and the x-axis (area below the axis counts negative)"
        type: basic
      - front: "∫ √(r² - x²) dx from -r to r = ? (by geometry)"
        back: "πr²/2 — the upper semicircle of radius r"
        type: basic

  - id: riemann-sums-definite-integral
    name: Riemann Sums and the Definite Integral
    core: true
    difficulty: 0.6
    drill: false
    answer_kind: numeric
    expected_time_secs: 180
    prerequisites:
      - id: left-right-riemann-sums
        weight: 0.7
        key: true
      - id: definite-integrals-as-area
        weight: 0.7
        key: true
      - id: limits-graphical-numerical
        weight: 0.4
      - id: even-odd-functions
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: The definite integral as a limit of Riemann sums
        key_prerequisites: [left-right-riemann-sums, definite-integrals-as-area, limits-graphical-numerical]
        exemplars:
          - problem: 'For $\int_0^4 x \, dx$, the right Riemann sums are $10$ ($n = 4$) and $9$ ($n = 8$). What value do the sums approach as $n \to \infty$?'
            answer: "8"
            solution_sketch: 'As $n \to \infty$ the rectangle error vanishes; the limit is the definite integral, here the triangle area $\frac{1}{2} \cdot 4 \cdot 4$.'
          - problem: "For $\\int_0^4 \\frac{x}{2}\\,dx$, the right Riemann sums are $5$ for $n = 4$ and $4.5$ for $n = 8$. What value do the sums approach as $n \\to \\infty$?"
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Limit rule: as n grows, the right Riemann sums approach the definite integral. Area rule: the region under y = x/2 from x = 0 to x = 4 is a triangle with base 4 and height 2. Its area is (1/2)(4)(2) = 4."
          - problem: "For $\\int_0^6 (2 - \\frac{x}{3})\\,dx$, the right Riemann sums are $4$ for $n = 3$ and $5$ for $n = 6$. What value do the sums approach as $n \\to \\infty$?"
            answer: "6"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Limit rule: the right Riemann sums approach the definite integral. Area rule: the graph of y = 2 - x/3 from x = 0 to x = 6 is a triangle with base 6 and height 2. Its area is (1/2)(6)(2) = 6."
          - problem: "For $\\int_{-2}^{2} \\sqrt{4 - x^2}\\,dx$, the right Riemann sums approach a limiting value as the number of subintervals grows. Give that limiting value."
            answer: "2pi"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Limit rule: the limit of the right Riemann sums is the definite integral. Area rule: the graph of y = sqrt(4 - x^2) is the upper semicircle of radius 2. Its area is (1/2) pi (2)^2 = 2pi."
          - problem: "For $\\int_0^k x\\,dx$, the right Riemann sums approach $18$ as $n \\to \\infty$. Find the positive value of $k$."
            answer: "6"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Limit rule: the right Riemann sums approach the area under y = x from 0 to k, a triangle. Area rule: that triangle has base k and height k, so its area is k^2/2. Algebra step: solve k^2/2 = 18 to get k^2 = 36, so the positive value is 6."
          - problem: "A car's velocity is $v(t) = 3t$ m/s for $0 \\le t \\le 4$. The distance traveled is the limit of Riemann sums of $v(t)$ over $[0, 4]$ as the number of subintervals grows. Find the distance traveled in meters."
            answer: "24"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Limit rule: the distance is the limit of the Riemann sums of velocity, which is the area under the velocity graph. Area rule: v(t) = 3t from t = 0 to t = 4 is a triangle with base 4 and height 12. Its area is (1/2)(4)(12) = 24."
        constraints: "conceptual limit questions anchored to a computable geometric area"
      - id: kp2
        name: Additivity, reversal, and linearity
        key_prerequisites: [definite-integrals-as-area]
        exemplars:
          - problem: 'Given $\int_0^5 f(x)\,dx = 7$ and $\int_5^8 f(x)\,dx = 3$, find $\int_0^8 f(x)\,dx$.'
            answer: "10"
          - problem: 'Given $\int_1^4 f(x)\,dx = 6$, find $\int_4^1 f(x)\,dx$.'
            answer: "-6"
          - problem: 'Given $\int_1^4 f(x)\,dx = 6$ and $\int_1^4 g(x)\,dx = 2$, find $\int_1^4 (3f(x) - g(x))\,dx$.'
            answer: "16"
            solution_sketch: '$3 \cdot 6 - 2 = 16$ by linearity.'
          - problem: "Given $\\int_0^6 f(x)\\,dx = 11$ and $\\int_0^2 f(x)\\,dx = 4$, find $\\int_2^6 f(x)\\,dx$."
            answer: "7"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Additivity splits the integral over [0,6] at 2: $\\int_0^6 f = \\int_0^2 f + \\int_2^6 f$. Substitute the known values: $11 = 4 + \\int_2^6 f$. Solve the one-step equation to get 7. The value is 7."
          - problem: "Given $\\int_3^7 f(x)\\,dx = 5$, find $\\int_7^3 (2f(x) + 1)\\,dx$."
            answer: "-14"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Reversal changes the sign: $\\int_7^3 f = -5$. Linearity splits the requested integral: $2\\int_7^3 f + \\int_7^3 1\\,dx$. The second piece is $3 - 7 = -4$, so the total is $2(-5) - 4 = -14$. The value is -14."
          - problem: "Given $\\int_1^5 f(x)\\,dx = 8$ and $\\int_1^5 g(x)\\,dx = -2$, find $\\int_5^1 (f(x) - 4g(x))\\,dx$."
            answer: "-16"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Reversal puts a minus in front of the interval from 1 to 5. Linearity expands the inner integral as $\\int_1^5 f - 4\\int_1^5 g$. Substitute: $8 - 4(-2) = 16$, so the reversed integral is $-16$. The value is -16."
        constraints: "additivity, reversal of limits, constant multiples and sums; integer data"
      - id: kp3
        name: Comparison, bounds, and symmetry
        key_prerequisites: [definite-integrals-as-area, left-right-riemann-sums]
        exemplars:
          - problem: 'Evaluate $\int_{-3}^{3} x^3 \, dx$ using symmetry.'
            answer: "0"
            solution_sketch: '$x^3$ is odd: the signed areas on $[-3, 0]$ and $[0, 3]$ cancel.'
          - problem: "Suppose 2 <= f(x) <= 6 for every x in [1, 4]. Give the lower and upper bounds on the integral from 1 to 4 of f(x) dx in the form lower = L; upper = U."
            answer: "lower = 6; upper = 18"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "lower"}, {"contract": {"kind": "exact"}, "name": "upper"}]}
            solution_sketch: "The object is the integral from 1 to 4 of f(x) dx. The min-max bound rule gives m(b - a) <= integral <= M(b - a), with m = 2, M = 6 and b - a = 4 - 1 = 3. Multiply the endpoints: 2*3 = 6 gives the lower bound and 6*3 = 18 gives the upper bound, so 6 <= integral <= 18. The bounds are lower = 6; upper = 18."
          - problem: "A function f is odd, and the integral from 0 to 6 of f(x) dx equals 10. Find the integral from -6 to 0 of f(x) dx."
            answer: "-10"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The object is the integral from -6 to 0 of f(x) dx. The odd-function symmetry rule pairs the interval [-6, 0] with [0, 6] and gives the integral from -6 to 0 as the negative of the integral from 0 to 6. Since the integral from 0 to 6 equals 10, the integral from -6 to 0 is -10."
          - problem: "For every x in [1, 6], the function f satisfies 2 <= f(x) <= 8. Find the greatest possible value of the integral from 1 to 6 of f(x) dx."
            answer: "40"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The object is the integral from 1 to 6 of f(x) dx. The max-min bound rule gives integral <= M(b - a), so the greatest possible value uses the maximum M = 8 and the interval length b - a = 6 - 1 = 5. Multiply: 8*5 = 40. The greatest possible value is 40."
          - problem: "A function f is even, and the integral from -2 to 2 of f(x) dx equals 18. Find the integral from 0 to 2 of f(x) dx."
            answer: "9"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The object is the integral from 0 to 2 of f(x) dx. The even-function symmetry rule gives the integral from -2 to 2 as twice the integral from 0 to 2. Therefore the integral from 0 to 2 is half of 18, which is 9."
          - problem: "On the interval [2, 9] the function f satisfies 3 <= f(x) <= 7. What is the smallest possible value of the integral from 2 to 9 of f(x) dx?"
            answer: "21"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The object is the integral from 2 to 9 of f(x) dx. The max-min bound rule gives integral >= m(b - a), so the smallest possible value uses the minimum m = 3 and the interval length b - a = 9 - 2 = 7. Multiply: 3*7 = 21. The smallest possible value is 21."
        constraints: "max-min bounds with integer data; odd-function symmetry on symmetric intervals"
    diagnostic_exemplar:
      problem: 'Evaluate $\int_{-2}^{2} (x^3 + 3)\,dx$ using symmetry and linearity.'
      answer: '12'
      solution_sketch: '$x^3$ is odd and the interval is symmetric, so $\int_{-2}^{2}x^3\,dx = 0$; $\int_{-2}^{2}3\,dx = 12$.'
    anki_seeds:
      - front: "Swapping the limits of integration does what to the integral's value?"
        back: "flips its sign: ∫_b^a f = -∫_a^b f"
        type: basic
      - front: "If m ≤ f(x) ≤ M on [a, b], then ∫_a^b f(x) dx is between..."
        back: "m(b - a) and M(b - a)"
        type: basic
      - front: "For an odd function f, ∫_{-a}^{a} f(x) dx = ?"
        back: "0 — the signed areas cancel by symmetry"
        type: basic

  - id: midpoint-trapezoid-sums
    name: Midpoint and Trapezoid Sums
    core: false                # numerical rules; feed only the estimation topic
    difficulty: 0.6
    drill: false
    answer_kind: numeric
    expected_time_secs: 180
    prerequisites:
      - id: left-right-riemann-sums
        weight: 0.8
        key: true
      - id: riemann-sums-definite-integral
        weight: 0.4
      - id: concavity-inflection-points
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: Midpoint sums
        key_prerequisites: [left-right-riemann-sums]
        exemplars:
          - problem: 'Approximate $\int_0^2 x^2 \, dx$ with a midpoint sum using $n = 2$.'
            answer: "2.5"
            solution_sketch: '$\Delta x = 1$; midpoints $0.5, 1.5$: $0.25 + 2.25 = 2.5$.'
          - problem: 'Approximate $\int_0^2 x^2 \, dx$ with a midpoint sum using $n = 4$.'
            answer: "2.625"
            solution_sketch: '$\Delta x = 0.5$; midpoints $0.25, 0.75, 1.25, 1.75$: $0.5(0.0625 + 0.5625 + 1.5625 + 3.0625) = 2.625$.'
        constraints: "n ≤ 4; midpoint values give terminating decimals"
      - id: kp2
        name: Trapezoid sums
        key_prerequisites: [left-right-riemann-sums]
        exemplars:
          - problem: 'Approximate $\int_0^2 x^2 \, dx$ with the trapezoid rule using $n = 4$.'
            answer: "2.75"
            solution_sketch: '$\frac{\Delta x}{2}(f_0 + 2f_1 + 2f_2 + 2f_3 + f_4) = 0.25(0 + 0.5 + 2 + 4.5 + 4) = 2.75$.'
          - problem: 'The left and right sums for $\int_0^2 x^2\,dx$ with $n = 4$ are $1.75$ and $3.75$. Use them to get the trapezoid estimate.'
            answer: "2.75"
            solution_sketch: 'Trapezoid $= \frac{L + R}{2} = \frac{1.75 + 3.75}{2}$.'
          - problem: "Approximate $\\int_0^2 x^3\\,dx$ with the trapezoid rule using $n = 4$. Give the answer to 2 decimals."
            answer: "4.25"
            answer_contract: {"decimals": 2, "kind": "approx"}
            solution_sketch: "The grid has $\\Delta x = 0.5$ and nodes $x = 0, 0.5, 1, 1.5, 2$. The trapezoid rule gives $(0.5/2)[f(0)+2f(0.5)+2f(1)+2f(1.5)+f(2)] = 0.25[0+0.25+2+6.75+8] = 4.25$. The trapezoid estimate is 4.25."
          - problem: "The left and right sums for $\\int_1^3 (2x+1)\\,dx$ with $n = 4$ are $9$ and $11$. Use the trapezoid rule as their average. Give the trapezoid estimate to 2 decimals."
            answer: "10.00"
            answer_contract: {"decimals": 2, "kind": "approx"}
            solution_sketch: "The trapezoid estimate is the average of the left and right sums. Average $(9+11)/2 = 10.00$. The trapezoid estimate is 10.00."
          - problem: "A table gives $f(0)=2$, $f(1)=5$, $f(2)=4$, $f(3)=7$, $f(4)=3$. Approximate $\\int_0^4 f(x)\\,dx$ with the trapezoid rule using $n = 4$. Give the answer to 2 decimals."
            answer: "18.50"
            answer_contract: {"decimals": 2, "kind": "approx"}
            solution_sketch: "The trapezoid sum uses $\\Delta x = 1$ and the five table values 2, 5, 4, 7, 3. The formula gives $(1/2)[2+2(5)+2(4)+2(7)+3] = 0.5(37) = 18.50$. The trapezoid sum is 18.50."
          - problem: "For $f$ on $[0,2]$ with $n=4$, the trapezoid estimate is $7.25$, and the endpoint values are $f(0)=1$ and $f(2)=5$. Find the sum $f(0.5)+f(1)+f(1.5)$, giving the answer to 2 decimals."
            answer: "11.50"
            answer_contract: {"decimals": 2, "kind": "approx"}
            solution_sketch: "The trapezoid sum with $\\Delta x = 0.5$ is $T = (0.5/2)[f(0)+2(f(0.5)+f(1)+f(1.5))+f(2)]$. Substitute $T = 7.25$, $f(0)=1$ and $f(2)=5$: $7.25 = 0.25[6+2S]$. Solve: $S = 11.50$. The sum $f(0.5)+f(1)+f(1.5)$ is 11.50."
        constraints: "trapezoid = average of left and right sums; terminating decimals"
      - id: kp3
        name: Error direction from concavity
        key_prerequisites: [left-right-riemann-sums, concavity-inflection-points]
        exemplars:
          - problem: '$\int_0^2 x^2\,dx = \frac{8}{3} \approx 2.667$, and the $n = 4$ trapezoid estimate is $2.75$. Since $x^2$ is concave up, does the trapezoid rule over- or underestimate here?'
            answer: "overestimate"
            answer_contract: {kind: none}
            solution_sketch: 'Chords lie above a concave-up curve, so the trapezoid rule overestimates (and the midpoint rule, using tangent-trapezoids below the curve, underestimates: $2.625$).'
          - problem: 'If $f$ is concave down on $[a, b]$, does the trapezoid rule over- or underestimate $\int_a^b f\,dx$?'
            answer: "underestimate — chords lie below a concave-down curve"
            answer_contract: {kind: none}
            solution_sketch: "underestimate — chords lie below a concave-down curve"
        constraints: "integrand with fixed concavity on the interval; ask only for the direction"
    diagnostic_exemplar:
      problem: 'Approximate $\int_0^4 x^2\,dx$ with the trapezoid rule using $n = 2$, then report the difference (your estimate minus the exact value $\frac{64}{3}$).'
      answer: '8/3'
      solution_sketch: '$T = \frac{\Delta x}{2}\left[f(0) + 2f(2) + f(4)\right] = 1\,(0 + 8 + 16) = 24$; since $x^2$ is concave up the trapezoid rule overestimates, and $24 - \frac{64}{3} = \frac{8}{3} > 0$.'
    anki_seeds:
      - front: "The trapezoid estimate equals the average of..."
        back: "the left and right Riemann sums"
        type: basic
      - front: "Concave up on [a,b]: trapezoid rule ___ and midpoint rule ___ the integral."
        back: "overestimates; underestimates (both reversed when concave down)"
        type: basic

  - id: estimating-integrals-from-tables
    name: Estimating Integrals from Tables
    core: false                # terminal numerical-estimation genre
    difficulty: 0.6
    drill: false
    answer_kind: numeric
    expected_time_secs: 180
    prerequisites:
      - id: midpoint-trapezoid-sums
        weight: 0.6
        key: true
      - id: left-right-riemann-sums
        weight: 0.6
        key: true
      - id: riemann-sums-definite-integral
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: Left and right sums from a table
        key_prerequisites: [left-right-riemann-sums]
        exemplars:
          - problem: 'A table gives $v(0) = 5$, $v(2) = 7$, $v(4) = 10$, $v(6) = 12$. Estimate $\int_0^6 v(t)\,dt$ with a left Riemann sum.'
            answer: "44"
            solution_sketch: '$2(5 + 7 + 10) = 44$.'
          - problem: 'Using the same table, estimate $\int_0^6 v(t)\,dt$ with a right Riemann sum.'
            answer: "58"
            solution_sketch: '$2(7 + 10 + 12) = 58$.'
        constraints: "evenly spaced table; 3-4 subintervals; integer values"
      - id: kp2
        name: Trapezoid sums from a table (uneven spacing allowed)
        key_prerequisites: [midpoint-trapezoid-sums]
        exemplars:
          - problem: 'A table gives $f(0) = 4$, $f(1) = 6$, $f(3) = 10$. Estimate $\int_0^3 f(x)\,dx$ with trapezoids.'
            answer: "21"
            solution_sketch: '$\frac{4 + 6}{2} \cdot 1 + \frac{6 + 10}{2} \cdot 2 = 5 + 16 = 21$.'
          - problem: 'Using the table $v(0) = 5$, $v(2) = 7$, $v(4) = 10$, $v(6) = 12$, estimate $\int_0^6 v(t)\,dt$ with the trapezoid rule.'
            answer: "51"
            solution_sketch: 'Average of the left sum $44$ and right sum $58$.'
          - problem: "A table gives f(1) = 2, f(3) = 8, and f(6) = 12. Use trapezoids on each subinterval separately to estimate the integral of f from x = 1 to x = 6. Give the estimate as an integer."
            answer: "40"
            answer_contract: {"kind": "exact"}
            solution_sketch: "First use the trapezoid rule on the subinterval [1,3]: its width is 2, so the contribution is (2 + 8)/2 * 2 = 10. Next use the trapezoid rule on [3,6]: its width is 3, so the contribution is (8 + 12)/2 * 3 = 30. Add the separate contributions: 10 + 30 = 40. The estimate is 40."
          - problem: "A table gives v(0) = 4, v(3) = 10, v(4) = 14, and v(7) = 20. Estimate the integral of v from t = 0 to t = 7 with trapezoids, taking each subinterval separately. Give the estimate as an integer."
            answer: "84"
            answer_contract: {"kind": "exact"}
            solution_sketch: "First use the trapezoid rule on [0,3]: width 3, contribution (4 + 10)/2 * 3 = 21. Next use the trapezoid rule on [3,4]: width 1, contribution (10 + 14)/2 * 1 = 12. Next use the trapezoid rule on [4,7]: width 3, contribution (14 + 20)/2 * 3 = 51. Add the separate contributions: 21 + 12 + 51 = 84. The estimate is 84."
          - problem: "A table gives f(0) = 2, f(5) = 8, and a missing value at x = 2. The trapezoid estimate of the integral of f from x = 0 to x = 5 is 29. Find the missing table value f(2)."
            answer: "6"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Let k = f(2). First use the trapezoid rule on [0,2]: width 2, contribution (2 + k)/2 * 2 = 2 + k. Next use the trapezoid rule on [2,5]: width 3, contribution (k + 8)/2 * 3 = 1.5k + 12. The total estimate is (2 + k) + (1.5k + 12) = 2.5k + 14, and it equals 29, so 2.5k = 15. Therefore k = 6, so the missing value is 6."
          - problem: "A table gives R(0) = 20, R(2) = 16, R(5) = 10, and R(6) = 6. Estimate the integral of R from t = 0 to t = 6 with trapezoids, handling each subinterval separately. Give the estimate as an integer."
            answer: "83"
            answer_contract: {"kind": "exact"}
            solution_sketch: "First use the trapezoid rule on [0,2]: width 2, contribution (20 + 16)/2 * 2 = 36. Next use the trapezoid rule on [2,5]: width 3, contribution (16 + 10)/2 * 3 = 39. Next use the trapezoid rule on [5,6]: width 1, contribution (10 + 6)/2 * 1 = 8. Add the separate contributions: 36 + 39 + 8 = 83. The estimate is 83."
        constraints: "handle each subinterval separately when spacing is uneven; integer answers"
      - id: kp3
        name: Interpret the estimate with units
        key_prerequisites: [left-right-riemann-sums, riemann-sums-definite-integral]
        exemplars:
          - problem: "A velocity v(t) is measured in m/s and t in s. A trapezoid sum estimates the integral from 0 to 6 of v(t) dt as 51. Which unit does the value 51 carry?"
            answer: "meters"
            answer_contract: {"kind": "label", "options": [["meters"], ["m/s"], ["seconds"], ["m/s^2"]]}
            solution_sketch: "Step 1: The integral of a rate is the total change, so its unit is rate unit times input unit. Step 2: The rate is measured in m/s and the input is measured in s, so the product is meters. The option m/s wrongly treats 51 as a rate. The option seconds wrongly treats 51 as the input time. The option m/s^2 wrongly treats 51 as an acceleration. The correct unit is meters."
          - problem: "A pump moves water at a rate r(t) in liters per minute, and t is in hours. A trapezoid estimate of the integral from 0 to 2 of r(t) dt is 5 in liter-hours per minute. Find the total volume in liters."
            answer: "300"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: The integral unit is (liters per minute) times hours, which is liter-hours per minute. Step 2: Convert hours to minutes by multiplying by 60, so 5 times 60 equals 300. The total volume is 300."
          - problem: "A rate r(t) is measured in gallons per hour, and t is measured in days. A trapezoid estimate of the integral from 0 to 3 of r(t) dt is 72 in gallon-days per hour. Find the total volume in gallons."
            answer: "1728"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: The integral unit is (gallons per hour) times days, which is gallon-days per hour. Step 2: One day has 24 hours, so multiply 72 by 24 to get 1728. The total volume is 1728."
          - problem: "A pipe carries water at a rate r(t) in cubic meters per second, and t is measured in minutes. A trapezoid estimate of the integral from 0 to 4 of r(t) dt is 0.5 in cubic meter-minutes per second. Find the total volume in cubic meters."
            answer: "30"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: The integral unit is (cubic meters per second) times minutes, which is cubic meter-minutes per second. Step 2: One minute has 60 seconds, so multiply 0.5 by 60 to get 30. The total volume is 30."
          - problem: "A medication is delivered at a rate r(t) in milligrams per minute, and t is measured in hours. A trapezoid estimate of the integral from 0 to 1 of r(t) dt is 15 in milligram-hours per minute. Find the total mass in milligrams."
            answer: "900"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: The integral unit is (milligrams per minute) times hours, which is milligram-hours per minute. Step 2: One hour has 60 minutes, so multiply 15 by 60 to get 900. The total mass is 900."
          - problem: "A remote car moves at a rate r(t) in feet per second, and t is measured in minutes. A trapezoid estimate of the integral from 0 to 2 of r(t) dt is 8 in foot-minutes per second. Find the total distance in feet."
            answer: "480"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: The integral unit is (feet per second) times minutes, which is foot-minutes per second. Step 2: One minute has 60 seconds, so multiply 8 by 60 to get 480. The total distance is 480."
        constraints: "the integral of a rate carries the units (rate units) × (input units)"
    diagnostic_exemplar:
      problem: 'A table gives $v(0) = 3$, $v(1) = 5$, $v(4) = 11$, with $v$ in m/s and $t$ in seconds. Estimate $\int_0^4 v(t)\,dt$ with the trapezoid rule.'
      answer: '28'
      solution_sketch: 'The spacing is uneven, so treat each subinterval separately: $\frac{3+5}{2}(1) + \frac{5+11}{2}(3) = 4 + 24 = 28$ (metres travelled).'
    anki_seeds:
      - front: "The integral of a rate function r(t) over [a, b] measures..."
        back: "the total accumulated amount from t = a to t = b, in (rate units) × (time units)"
        type: basic
      - front: "Trapezoid estimate on one subinterval [x₀, x₁]:"
        back: "(f(x₀) + f(x₁))/2 · (x₁ - x₀)"
        type: basic

  - id: definite-integrals-ftc
    name: The Fundamental Theorem of Calculus
    core: true
    difficulty: 0.65
    drill: false
    answer_kind: numeric
    expected_time_secs: 180
    prerequisites:
      - id: antiderivatives
        weight: 0.8
        key: true
      - id: riemann-sums-definite-integral
        weight: 0.6
        key: true
    knowledge_points:
      - id: kp1
        name: Evaluate definite integrals (FTC part 2)
        key_prerequisites: [antiderivatives, riemann-sums-definite-integral]
        exemplars:
          - problem: 'Evaluate $\int_1^3 2x \, dx$.'
            answer: "8"
            solution_sketch: '$[x^2]_1^3 = 9 - 1 = 8$.'
          - problem: 'Evaluate $\int_0^2 (3x^2 + 1) \, dx$.'
            answer: "10"
            solution_sketch: '$[x^3 + x]_0^2 = 8 + 2 = 10$.'
          - problem: 'Evaluate $\int_0^{\pi} \sin x \, dx$.'
            answer: "2"
            solution_sketch: '$[-\cos x]_0^{\pi} = -(-1) - (-1) = 2$.'
          - problem: "Evaluate $\\int_0^1 (4x + 1)\\,dx$."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Start with the full integral $I = \\int_0^1 (4x + 1)\\,dx$. Step 1: find an antiderivative using the power rule, giving $2x^2 + x$. Step 2: apply FTC part 2 and substitute the limits: $[2x^2 + x]_0^1 = (2 + 1) - 0 = 3$. The value of the definite integral is 3."
          - problem: "Evaluate $\\int_1^2 6x^2\\,dx$."
            answer: "14"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Start with the full integral $I = \\int_1^2 6x^2\\,dx$. Step 1: the power rule gives the antiderivative $2x^3$. Step 2: apply FTC part 2: $[2x^3]_1^2 = 16 - 2 = 14$. The value of the definite integral is 14."
          - problem: "Evaluate $\\int_0^{\\pi/2} \\cos x\\,dx$."
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Start with the full integral $I = \\int_0^{\\pi/2} \\cos x\\,dx$. Step 1: the basic table gives the antiderivative $\\sin x$. Step 2: apply FTC part 2: $[\\sin x]_0^{\\pi/2} = 1 - 0 = 1$. The value of the definite integral is 1."
        constraints: "antiderivative from the basic table; integer or simple exact answers"
      - id: kp2
        name: Differentiate an accumulation function (FTC part 1)
        key_prerequisites: [antiderivatives]
        exemplars:
          - problem: 'Find $g''(x)$ for $g(x) = \int_0^x \sqrt{1 + t^2} \, dt$.'
            answer: "√(1 + x^2)"
            solution_sketch: 'FTC part 1: the derivative of the accumulation function is the integrand at $x$.'
          - problem: 'Find $\frac{d}{dx} \int_1^x (t^3 + 1) \, dt$.'
            answer: "x^3 + 1"
          - problem: 'Find $\frac{d}{dx} \int_2^x \cos(t^2) \, dt$.'
            answer: "cos(x^2)"
          - problem: "Find $g'(x)$ for $g(x) = \\int_3^x (t^2 + 4t) \\, dt$."
            answer: "x^2 + 4x"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "The accumulation function is $g(x) = \\int_3^x (t^2 + 4t) \\, dt$ with variable upper limit $x$. By FTC part 1, the derivative equals the integrand evaluated at the upper limit. The integrand is $t^2 + 4t$, so replacing $t$ by $x$ gives $g'(x) = x^2 + 4x$."
          - problem: "Find $\\frac{d}{dx} \\int_0^x e^{t^2} \\, dt$."
            answer: "e^(x^2)"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "The accumulation function is $A(x) = \\int_0^x e^{t^2} \\, dt$. By FTC part 1, its derivative is the integrand at the upper limit $x$. The integrand is $e^{t^2}$, so $A'(x) = e^{x^2}$."
          - problem: "Find $g'(x)$ for $g(x) = \\int_5^x \\frac{1}{1 + t^2} \\, dt$."
            answer: "1/(1+x^2)"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "The accumulation function is $g(x) = \\int_5^x \\frac{1}{1 + t^2} \\, dt$ with variable upper limit $x$. By FTC part 1, the derivative is the integrand evaluated at $x$. The integrand is $\\frac{1}{1 + t^2}$, so replacing $t$ by $x$ gives $g'(x) = 1/(1+x^2)$."
        constraints: "variable upper limit x (no composite limits); answer is the integrand evaluated at x"
      - id: kp3
        name: Net change from a rate
        key_prerequisites: [antiderivatives, riemann-sums-definite-integral]
        exemplars:
          - problem: 'A particle moves with velocity $v(t) = 6t^2$ m/s. Find its displacement over $[0, 2]$.'
            answer: "16 m"
            solution_sketch: '$\int_0^2 6t^2\,dt = [2t^3]_0^2 = 16$.'
          - problem: 'Water flows into a tank at $r(t) = 2t$ liters per minute. How much water enters during the first $5$ minutes?'
            answer: "25 L"
            solution_sketch: '$\int_0^5 2t\,dt = [t^2]_0^5 = 25$.'
        constraints: "polynomial rates; state units in the answer"
    diagnostic_exemplar:
      problem: 'Water flows into a tank at the rate $r(t) = 3t^2 + 2$ litres per minute. How many litres enter during the first $3$ minutes?'
      answer: '33'
      solution_sketch: 'Net change $= \int_0^3 (3t^2 + 2)\,dt = \left[t^3 + 2t\right]_0^3 = 27 + 6 = 33$ litres.'
    anki_seeds:
      - front: "FTC part 2: ∫_a^b f(x) dx = ? (F any antiderivative of f)"
        back: "F(b) - F(a)"
        type: basic
      - front: "FTC part 1: d/dx ∫_a^x f(t) dt = ?"
        back: "f(x)"
        type: basic
      - front: "The integral of velocity over [a, b] gives..."
        back: "displacement (net change in position) — a special case of the net change theorem"
        type: basic

  - id: accumulation-functions
    name: Accumulation Functions
    core: true
    difficulty: 0.7
    drill: false
    answer_kind: expression
    expected_time_secs: 210
    prerequisites:
      - id: definite-integrals-ftc
        weight: 0.8
        key: true
      - id: chain-rule
        weight: 0.6
        key: true
      - id: increasing-decreasing-intervals
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: FTC part 1 with composite limits
        key_prerequisites: [definite-integrals-ftc, chain-rule]
        exemplars:
          - problem: 'Find $\frac{d}{dx} \int_0^{x^2} \cos t \, dt$.'
            answer: "2x cos(x^2)"
            solution_sketch: 'FTC 1 plus the chain rule: integrand at $x^2$ times $\frac{d}{dx}(x^2)$.'
          - problem: 'Find $\frac{d}{dx} \int_1^{x^3} \sqrt{1 + t} \, dt$.'
            answer: "3x^2 √(1 + x^3)"
        constraints: "upper limit is a power of x; answer = integrand(limit) × limit'"
      - id: kp2
        name: Variable lower limit
        key_prerequisites: [definite-integrals-ftc]
        exemplars:
          - problem: 'Find $\frac{d}{dx} \int_x^5 t^2 \, dt$.'
            answer: "-x^2"
            solution_sketch: 'Reverse the limits: $-\int_5^x t^2\,dt$ differentiates to $-x^2$.'
          - problem: 'Find $\frac{d}{dx} \int_{x}^{2} \sin(t^2) \, dt$.'
            answer: "-sin(x^2)"
        constraints: "single variable lower limit; the sign flip is the point"
      - id: kp3
        name: Analyze an accumulation function
        key_prerequisites: [definite-integrals-ftc, increasing-decreasing-intervals]
        exemplars:
          - problem: 'Let $g(x) = \int_0^x (t^2 - 4)\,dt$. At which $x$ does $g$ have a local minimum?'
            answer: "2"
            solution_sketch: '$g''(x) = x^2 - 4$ changes $-$ to $+$ at $x = 2$ (and $+$ to $-$ at $-2$, a local max).'
          - problem: 'For the same $g$, compute $g(3)$.'
            answer: "-3"
            solution_sketch: '$\left[\frac{t^3}{3} - 4t\right]_0^3 = 9 - 12 = -3$.'
          - problem: "Let $g(x)=\\int_0^x (t^2 - 16)\\,dt$. At which $x$ does $g$ have a local maximum? Find the x-value."
            answer: "-4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The accumulation function is $g(x)=\\int_0^x (t^2-16)\\,dt$. By the Fundamental Theorem of Calculus, $g'(x)=x^2-16$, so the critical points are $x=-4$ and $x=4$. The sign of $g'$ changes from positive to negative at $x=-4$, so $g$ has a local maximum there. The x-value of the local maximum is -4."
          - problem: "Let $g(x)=\\int_2^x (t^2 - 5t + 6)\\,dt$. Find the interval on which $g$ is increasing. Give your answer as an inequality in x."
            answer: "x < 2 or x > 3"
            answer_contract: {"kind": "inequality_union"}
            solution_sketch: "The accumulation function is $g(x)=\\int_2^x (t^2-5t+6)\\,dt$. By the Fundamental Theorem of Calculus, $g'(x)=x^2-5x+6=(x-2)(x-3)$. The derivative is positive when $x<2$ or $x>3$, so $g$ is increasing there. The interval of increase is x < 2 or x > 3."
          - problem: "Let $g(x)=\\int_0^x (t^3 - 4t)\\,dt$. At which $x$ does $g$ have a local maximum? Find the x-value."
            answer: "0"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The accumulation function is $g(x)=\\int_0^x (t^3-4t)\\,dt$. By the Fundamental Theorem of Calculus, $g'(x)=x^3-4x=x(x-2)(x+2)$, so the critical points are $-2$, $0$, and $2$. The sign of $g'$ changes from positive to negative at $x=0$, so $g$ has a local maximum there. The local maximum occurs at x = 0."
          - problem: "Let $g(x)=\\int_0^x \\sin t\\,dt$. At which $x$ in the interval $(0, 2\\pi)$ does $g$ have a local maximum? Give the x-value."
            answer: "pi"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The accumulation function is $g(x)=\\int_0^x \\sin t\\,dt$. By the Fundamental Theorem of Calculus, $g'(x)=\\sin x$. On $(0,2\\pi)$, the critical point is $x=\\pi$, and $g'$ changes from positive to negative there. The local maximum occurs at x = pi."
        constraints: "g' is the integrand; extrema of g come from sign changes of the integrand"
    diagnostic_exemplar:
      problem: 'Find $\frac{d}{dx} \int_{x^2}^{5} \cos t \, dt$.'
      answer: '-2x cos(x^2)'
      solution_sketch: 'Flip the limits first: $-\frac{d}{dx}\int_{5}^{x^2}\cos t\,dt = -\cos(x^2)\cdot 2x$.'
    anki_seeds:
      - front: "d/dx ∫_a^{u(x)} f(t) dt = ?"
        back: "f(u(x)) · u'(x) — FTC part 1 composed with the chain rule"
        type: basic
      - front: "For g(x) = ∫_a^x f(t) dt, the critical points of g occur where..."
        back: "f(x) = 0 (since g' = f); g has a local min where f changes - to +"
        type: basic

  - id: average-value-function
    name: Average Value of a Function
    core: true
    difficulty: 0.65
    drill: false
    answer_kind: numeric
    expected_time_secs: 150
    prerequisites:
      - id: definite-integrals-ftc
        weight: 0.8
        key: true
      - id: continuity
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: Compute the average value
        key_prerequisites: [definite-integrals-ftc]
        exemplars:
          - problem: 'Find the average value of $f(x) = x^2$ on $[0, 3]$.'
            answer: "3"
            solution_sketch: '$\frac{1}{3}\int_0^3 x^2\,dx = \frac{1}{3} \cdot 9 = 3$.'
          - problem: 'Find the average value of $f(x) = \cos x$ on $[0, \pi/6]$.'
            answer: "3/π"
            solution_sketch: '$\frac{6}{\pi}\int_0^{\pi/6} \cos x\,dx = \frac{6}{\pi}\cdot\frac{1}{2} = \frac{3}{\pi}$.'
          - problem: "Find the average value of f(x) = x^3 on [0, 2]."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Average value formula: (1/(b-a)) times the integral from a to b of f(x) dx. For f(x) = x^3 on [0, 2], the integral is x^4/4 from 0 to 2 = 4 and b-a = 2. So the average is 4/2 = 2. The average value is 2."
          - problem: "Find the average value of f(x) = sin x on [0, pi/2]."
            answer: "2/pi"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Average value formula: (1/(b-a)) times the integral from a to b of f(x) dx. For f(x) = sin x on [0, pi/2], the integral is -cos x from 0 to pi/2 = 1 and b-a = pi/2. So the average is (2/pi) times 1 = 2/pi. The average value is 2/pi."
          - problem: "Find the average value of f(x) = x^2 on [1, 3] as a fraction."
            answer: "13/3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Average value formula: (1/(b-a)) times the integral from a to b of f(x) dx. For f(x) = x^2 on [1, 3], the integral is x^3/3 from 1 to 3 = 27/3 - 1/3 = 26/3 and b-a = 2. So the average is (26/3)/2 = 13/3. The average value is 13/3."
          - problem: "Find the average value of f(x) = x^2 on [-1, 1] as a fraction."
            answer: "1/3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Average value formula: (1/(b-a)) times the integral from a to b of f(x) dx. For f(x) = x^2 on [-1, 1], the integral is x^3/3 from -1 to 1 = 1/3 - (-1/3) = 2/3 and b-a = 2. So the average is (2/3)/2 = 1/3. The average value is 1/3."
        constraints: "table-integrable functions; exact answers (fractions, multiples of 1/π)"
      - id: kp2
        name: The Mean Value Theorem for integrals
        key_prerequisites: [definite-integrals-ftc, continuity]
        exemplars:
          - problem: 'The average value of $f(x) = x^2$ on $[0, 3]$ is $3$. Find the $c$ in $[0, 3]$ with $f(c)$ equal to this average.'
            answer: "sqrt(3)"
            solution_sketch: '$c^2 = 3$; the positive root $c = \sqrt{3}$ lies in the interval.'
          - problem: 'For $f(x) = 4x$ on $[1, 3]$, find the $c$ guaranteed by the Mean Value Theorem for integrals (the $c$ with $f(c)$ equal to the average value).'
            answer: "2"
            solution_sketch: 'Average value $= \frac{1}{2}\int_1^3 4x\,dx = \frac{16}{2} = 8$; solve $4c = 8$ to get $c = 2$, which lies in $[1, 3]$.'
        constraints: "f continuous; c solvable exactly and inside the interval"
      - id: kp3
        name: Applied average values
        key_prerequisites: [definite-integrals-ftc]
        exemplars:
          - problem: 'The temperature is $T(t) = 12 + 2t$ degrees Celsius, $t$ in hours. Find the average temperature over $[0, 6]$.'
            answer: "18 degrees Celsius"
            answer_contract: {kind: none}
            solution_sketch: '$\frac{1}{6}\int_0^6 (12 + 2t)\,dt = \frac{1}{6}(72 + 36) = 18$.'
          - problem: 'A car''s velocity is $v(t) = 3t^2$ m/s. Find its average velocity over $[0, 2]$.'
            answer: "4 m/s"
            solution_sketch: '$\frac{1}{2}\int_0^2 3t^2\,dt = \frac{8}{2} = 4$.'
        constraints: "linear or quadratic rates; integer average with units"
    diagnostic_exemplar:
      problem: 'For $f(x) = 3x^2$ on $[0, 2]$, find the $c$ guaranteed by the Mean Value Theorem for integrals (the $c$ in $[0, 2]$ with $f(c)$ equal to the average value of $f$).'
      answer: "2√3/3"
      solution_sketch: 'Average value $\frac{1}{2}\int_0^2 3x^2\,dx = 4$; solve $3c^2 = 4$: $c = \frac{2}{\sqrt 3} = \frac{2\sqrt 3}{3}$.'
    anki_seeds:
      - front: "Average value of f on [a, b] = ?"
        back: "(1/(b - a)) ∫_a^b f(x) dx"
        type: basic
      - front: "MVT for integrals: a continuous f on [a,b] attains its average value..."
        back: "at some c in [a, b]: f(c) = (1/(b-a)) ∫_a^b f"
        type: basic

  - id: area-under-a-curve
    name: Area Between a Curve and the x-Axis
    core: true
    difficulty: 0.65
    drill: false
    answer_kind: numeric
    expected_time_secs: 210
    prerequisites:
      - id: definite-integrals-ftc
        weight: 0.8
        key: true
      - id: definite-integrals-as-area
        weight: 0.5
        key: true
      - id: quadratic-equations-factoring
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: Area when f ≥ 0
        key_prerequisites: [definite-integrals-ftc, definite-integrals-as-area]
        exemplars:
          - problem: 'Find the area under $y = x^2$ from $x = 0$ to $x = 3$.'
            answer: "9"
            solution_sketch: '$f \geq 0$ here, so area $= \int_0^3 x^2\,dx = 9$.'
          - problem: 'Find the area enclosed by $y = 4 - x^2$ and the x-axis.'
            answer: "32/3"
            solution_sketch: 'Roots $\pm 2$: $\int_{-2}^2 (4 - x^2)\,dx = 16 - \frac{16}{3} = \frac{32}{3}$.'
          - problem: "Find the area under y = x^2 + 2 from x = 0 to x = 3."
            answer: "15"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Set up the area as the definite integral from 0 to 3 of x^2 + 2. By the Fundamental Theorem of Calculus, an antiderivative is x^3/3 + 2x. Evaluate at the endpoints: (27/3 + 6) - 0 = 9 + 6 = 15, so the area is 15."
          - problem: "Find the area enclosed by y = 16 - x^2 and the x-axis."
            answer: "256/3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Set up the area as the definite integral from -4 to 4 of 16 - x^2. The roots of 16 - x^2 are x = -4 and x = 4, and the curve is nonnegative between them. By the Fundamental Theorem of Calculus, an antiderivative is 16x - x^3/3. Evaluate at the endpoints: (64 - 64/3) - (-64 + 64/3) = 128 - 128/3 = 256/3, so the area is 256/3."
          - problem: "Find the area under y = 3x^2 from x = 1 to x = 3."
            answer: "26"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Set up the area as the definite integral from 1 to 3 of 3x^2. By the Fundamental Theorem of Calculus, an antiderivative is x^3. Evaluate at the endpoints: 3^3 - 1^3 = 27 - 1 = 26, so the area is 26."
          - problem: "Find the area under y = sqrt(x) from x = 0 to x = 9."
            answer: "18"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Set up the area as the definite integral from 0 to 9 of sqrt(x). By the Fundamental Theorem of Calculus, an antiderivative is (2/3)x^(3/2). Evaluate at the endpoints: (2/3)(9^(3/2)) - (2/3)(0^(3/2)) = (2/3)(27) = 18, so the area is 18."
        constraints: "nonnegative integrand on the interval; find the roots when the region is enclosed"
      - id: kp2
        name: Total area when f changes sign
        key_prerequisites: [definite-integrals-ftc, quadratic-equations-factoring]
        exemplars:
          - problem: 'Find the total area between $y = x^2 - 1$ and the x-axis over $[0, 2]$.'
            answer: "2"
            solution_sketch: 'Split at the root $x = 1$: $\left|\int_0^1\right| + \int_1^2 = \frac{2}{3} + \frac{4}{3} = 2$.'
          - problem: "Find the net signed area and the total area between $y = x^2 - 4$ and the x-axis over $[0, 3]$. Give the answer as net = value; total = value."
            answer: "net = -3; total = 23/3"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "net"}, {"contract": {"kind": "exact"}, "name": "total"}]}
            solution_sketch: "Split at the root x = 2 because x^2 - 4 = (x - 2)(x + 2). Net signed area is the integral from 0 to 3: [x^3/3 - 4x] from 0 to 3 equals 9 - 12 = -3. Total area adds the absolute pieces: integral 0 to 2 of 4 - x^2 gives 16/3, and integral 2 to 3 of x^2 - 4 gives 7/3, so the total is 23/3. The answer is net = -3; total = 23/3."
          - problem: "Find the total area between $y = 4 - x^2$ and the x-axis over $[1, 4]$."
            answer: "37/3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The curve crosses the x-axis at x = 2, so split the interval there. The total area is the integral from 1 to 2 of 4 - x^2 plus the integral from 2 to 4 of x^2 - 4. The first integral evaluates to 5/3 and the second evaluates to 32/3. Their sum is 5/3 + 32/3 = 37/3. The answer is 37/3."
          - problem: "Find the total area between $y = x^2 - x - 2$ and the x-axis over $[0, 3]$."
            answer: "31/6"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Factor the quadratic as (x - 2)(x + 1), so the only sign change on the interval is at x = 2. Total area is the integral from 0 to 2 of -(x^2 - x - 2) plus the integral from 2 to 3 of x^2 - x - 2. The first integral gives 10/3 and the second gives 11/6. Their sum is 20/6 + 11/6 = 31/6. The answer is 31/6."
          - problem: "A particle moves along a line with velocity $v(t) = t - 3$ meters per second for $0 \\le t \\le 5$. Find the total distance traveled in meters."
            answer: "13/2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The velocity changes sign at t = 3, so total distance is the integral of the absolute speed. Compute the integral from 0 to 3 of 3 - t, which gives 9/2. Compute the integral from 3 to 5 of t - 3, which gives 2. Add the two positive pieces: 9/2 + 2 = 13/2. The answer is 13/2."
          - problem: "Find the total area between $y = x^2 - 9$ and the x-axis over $[0, 4]$."
            answer: "64/3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Factor x^2 - 9 as (x - 3)(x + 3), so the sign change on the interval is at x = 3. Total area is the integral from 0 to 3 of 9 - x^2 plus the integral from 3 to 4 of x^2 - 9. The first integral gives 18 and the second gives 10/3. Their sum is 54/3 + 10/3 = 64/3. The answer is 64/3."
        constraints: "one interior sign change at an integer or simple root; report both net and total when asked"
      - id: kp3
        name: Symmetry and the odd-function trap
        key_prerequisites: [definite-integrals-ftc, definite-integrals-as-area]
        exemplars:
          - problem: "For $y = x^5$ on $[-1, 1]$, compute the signed integral $\\int_{-1}^{1} x^5\\,dx$ and the total area between the curve and the x-axis. Give both values, integral first."
            answer: "integral = 0; area = 1/3"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "integral"}, {"contract": {"kind": "exact"}, "name": "area"}]}
            solution_sketch: "$y = x^5$ on $[-1, 1]$ is odd, so the graph is symmetric about the origin and the two halves of signed area cancel; by the FTC the integrated total is $\\int_{-1}^{1} x^5\\,dx = 0$. The geometric area never cancels: $\\int_0^1 x^5\\,dx = 1/6$, and the left half has the same area, so the total is $1/3$. The answer is integral = 0; area = 1/3."
          - problem: "For $y = \\sin(x)$ on $[-\\pi/2, \\pi/2]$, find the signed integral $\\int_{-\\pi/2}^{\\pi/2} \\sin(x)\\,dx$ and the total area between the curve and the x-axis. Give both values, integral first."
            answer: "integral = 0; area = 2"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "integral"}, {"contract": {"kind": "exact"}, "name": "area"}]}
            solution_sketch: "$y = \\sin(x)$ on $[-\\pi/2, \\pi/2]$ is odd, so by the FTC the signed integral is $[-\\cos(x)]$ evaluated from $-\\pi/2$ to $\\pi/2$, which is $0$. The geometric area doubles the right half: $\\int_0^{\\pi/2} \\sin(x)\\,dx = 1$, so the total area is $2$. The answer is integral = 0; area = 2."
          - problem: "An odd function $f$ satisfies $\\int_0^3 f(x)\\,dx = 7$. Find the total area between the graph of $f$ and the x-axis over $[-3, 3]$."
            answer: "14"
            answer_contract: {"kind": "exact"}
            solution_sketch: "An odd function has origin symmetry, so the geometric area on $[-3, 0]$ equals the area on $[0, 3]$, namely $7$. Its signed integral over $[-3, 0]$ is $-7$, so the signed integral over $[-3, 3]$ is $0$, while the area adds the two positive halves. The total area is $7 + 7 = 14$. The answer is 14."
          - problem: "For $y = x^2 - 1$ on $[-2, 2]$, determine the signed integral $\\int_{-2}^{2} (x^2 - 1)\\,dx$ and the total area between the curve and the x-axis. Give both values, integral first."
            answer: "integral = 4/3; area = 4"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "integral"}, {"contract": {"kind": "exact"}, "name": "area"}]}
            solution_sketch: "$y = x^2 - 1$ on $[-2, 2]$ is even, so by the FTC the signed integral is $2\\int_0^2 (x^2 - 1)\\,dx = 2(8/3 - 2) = 4/3$. The curve crosses the x-axis at $x = -1$ and $x = 1$ and lies below it between them, so the area adds three pieces: $4/3$ on $[-1, 1]$ and $4/3$ on each outer piece. The answer is integral = 4/3; area = 4."
          - problem: "For $y = x^3$ on $[-1, 2]$, compute the signed integral $\\int_{-1}^{2} x^3\\,dx$ and the total area between the curve and the x-axis. Give both values, integral first."
            answer: "integral = 15/4; area = 17/4"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "integral"}, {"contract": {"kind": "exact"}, "name": "area"}]}
            solution_sketch: "By the FTC, $\\int_{-1}^{2} x^3\\,dx = [x^4/4]$ from $-1$ to $2$, which is $4 - 1/4 = 15/4$. The interval is not symmetric, so oddness gives no cancellation here. For the area, the curve is below the axis on $[-1, 0]$ with area $1/4$ and above it on $[0, 2]$ with area $4$, so the total is $17/4$. The answer is integral = 15/4; area = 17/4."
          - problem: "For $y = \\sin(x)$ on $[0, 2\\pi]$, determine the signed integral $\\int_0^{2\\pi} \\sin(x)\\,dx$ and the total area between the curve and the x-axis. Give both values, integral first."
            answer: "integral = 0; area = 4"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "integral"}, {"contract": {"kind": "exact"}, "name": "area"}]}
            solution_sketch: "By the FTC, $\\int_0^{2\\pi} \\sin(x)\\,dx = [-\\cos(x)]$ from $0$ to $2\\pi$, which is $-1 - (-1) = 0$. The curve lies above the axis on $[0, \\pi]$ and below it on $[\\pi, 2\\pi]$, and each hump has geometric area $2$, so the areas cancel in the signed integral but add to $4$ in the total area. The answer is integral = 0; area = 4."
        constraints: "odd functions on symmetric intervals; contrast signed integral with geometric area"
    diagnostic_exemplar:
      problem: 'Find the total area between $y = x$ and the x-axis over $[-1, 2]$.'
      answer: "5/2"
      solution_sketch: 'Two triangles: $\frac{1}{2} + 2 = \frac{5}{2}$ (the integral itself is $\frac{3}{2}$).'
    anki_seeds:
      - front: "To find TOTAL area between f and the x-axis, you must..."
        back: "split the interval at the roots of f and add the absolute values of the pieces"
        type: basic
      - front: "Net signed area vs total area: when do they agree?"
        back: "when f does not change sign on the interval"
        type: basic

  - id: net-change-total-distance
    name: Net Change and Total Distance
    core: false                # interpretation/application of the definite integral
    difficulty: 0.65
    drill: false
    answer_kind: numeric
    expected_time_secs: 240
    prerequisites:
      - id: definite-integrals-ftc
        weight: 0.8
        key: true
      - id: motion-along-a-line
        weight: 0.6
        key: true
      - id: area-under-a-curve
        weight: 0.4
      - id: antiderivatives
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: Displacement vs total distance
        key_prerequisites: [definite-integrals-ftc, motion-along-a-line, area-under-a-curve]
        exemplars:
          - problem: 'A particle has velocity $v(t) = t^2 - 4$ m/s on $[0, 3]$. Find its displacement.'
            answer: "-3 m"
            solution_sketch: '$\int_0^3 (t^2 - 4)\,dt = 9 - 12 = -3$.'
          - problem: 'For the same particle, find the total distance traveled on $[0, 3]$.'
            answer: "23/3 m"
            solution_sketch: '$v$ changes sign at $t = 2$: $\left|-\frac{16}{3}\right| + \frac{7}{3} = \frac{23}{3}$.'
          - problem: "A particle moves along a line with velocity v(t) = t - 1 meters per second for 0 <= t <= 3. Find its displacement and total distance traveled on [0, 3], and give the answer as (displacement, distance)."
            answer: "(3/2, 5/2)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "Full object: displacement = integral from 0 to 3 of (t - 1) dt and total distance = integral from 0 to 3 of abs(t - 1) dt. By the Fundamental Theorem of Calculus, the displacement is [t^2/2 - t] from 0 to 3 = 3/2. Since v changes sign at t = 1, split the distance integral into 0 to 1 and 1 to 3: 1/2 + 2 = 5/2. The answer is (3/2, 5/2)."
          - problem: "A particle moves along a line with velocity v(t) = t^2 - 1 meters per second for 0 <= t <= 2. Find its displacement and total distance traveled on [0, 2], and give the answer as (displacement, distance)."
            answer: "(2/3, 2)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "Full object: displacement = integral from 0 to 2 of (t^2 - 1) dt and total distance = integral from 0 to 2 of abs(t^2 - 1) dt. The Fundamental Theorem gives displacement [t^3/3 - t] from 0 to 2 = 2/3. Since v changes sign at t = 1, the distance is the sum of the areas from 0 to 1 and 1 to 2: 2/3 + 4/3 = 2. The answer is (2/3, 2)."
          - problem: "A particle moves along a line with velocity v(t) = 3t - 6 meters per second for 0 <= t <= 3. Find its displacement and total distance traveled on [0, 3], and give the answer as (displacement, distance)."
            answer: "(-9/2, 15/2)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "Full object: displacement = integral from 0 to 3 of (3t - 6) dt and total distance = integral from 0 to 3 of abs(3t - 6) dt. By the Fundamental Theorem, displacement = [3t^2/2 - 6t] from 0 to 3 = -9/2. The velocity changes sign at t = 2, so distance = area from 0 to 2 plus area from 2 to 3: 6 + 3/2 = 15/2. The answer is (-9/2, 15/2)."
          - problem: "A particle moves along a line with velocity v(t) = t - 3 meters per second for 0 <= t <= 5. Find its displacement and total distance traveled on [0, 5], and give the answer as (displacement, distance)."
            answer: "(-5/2, 13/2)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "Full object: displacement = integral from 0 to 5 of (t - 3) dt and total distance = integral from 0 to 5 of abs(t - 3) dt. The Fundamental Theorem gives displacement [t^2/2 - 3t] from 0 to 5 = -5/2. Since v changes sign at t = 3, distance = area from 0 to 3 plus area from 3 to 5: 9/2 + 2 = 13/2. The answer is (-5/2, 13/2)."
        constraints: "v changes sign once at an integer time; displacement and distance both asked"
      - id: kp2
        name: Recover position from velocity
        key_prerequisites: [antiderivatives, motion-along-a-line]
        exemplars:
          - problem: 'A particle has velocity $v(t) = 2t + 1$ and initial position $s(0) = 3$. Find $s(2)$.'
            answer: "9"
            solution_sketch: '$s(t) = t^2 + t + 3$; $s(2) = 4 + 2 + 3 = 9$.'
          - problem: "A particle moves along a line with velocity $v(t) = 4t - 5$ and has position $s(2) = 1$. Find $s(t)$ as a function of $t$."
            answer: "2t^2 - 5t + 3"
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: "Step 1 (antiderivative rule): position is the antiderivative of velocity, so $s(t) = \\int (4t - 5)\\,dt = 2t^2 - 5t + C$. Step 2 (initial condition pins down C): $s(2) = 8 - 10 + C = C - 2 = 1$ gives $C = 3$. Therefore the position function is $s(t) = 2t^2 - 5t + 3$, matching the answer 2t^2 - 5t + 3."
          - problem: "A particle has velocity $v(t) = 4t + 3$ and initial position $s(0) = 2$. Find $s(3)$."
            answer: "29"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (antiderivative rule): $s(t) = \\int (4t + 3)\\,dt = 2t^2 + 3t + C$. Step 2 (initial condition): $s(0) = C = 2$, so $s(t) = 2t^2 + 3t + 2$. Step 3 (evaluate at the given time): $s(3) = 18 + 9 + 2$, so the answer is 29."
          - problem: "A ball is thrown straight up from a roof. Its height is $h(t)$ feet with velocity $v(t) = -32t + 64$ feet per second, and $h(0) = 10$. Find $h(3)$."
            answer: "58"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (antiderivative rule): $h(t) = \\int (-32t + 64)\\,dt = -16t^2 + 64t + C$. Step 2 (initial condition): $h(0) = C = 10$, so $h(t) = -16t^2 + 64t + 10$. Step 3 (evaluate at $t = 3$): $-144 + 192 + 10$, so the height is 58 feet and the answer is 58."
          - problem: "A particle has velocity $v(t) = 6t - 4$ and its position at time $t = 2$ is $s(2) = 10$. Find the initial position $s(0)$."
            answer: "6"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (antiderivative rule): $s(t) = \\int (6t - 4)\\,dt = 3t^2 - 4t + C$. Step 2 (initial condition pins down C): $s(2) = 12 - 8 + C = 4 + C = 10$ gives $C = 6$. Step 3 (evaluate at $t = 0$): $s(0) = C$, so the initial position is 6."
          - problem: "A particle has velocity $v(t) = t^2 - 6t + 8$ and initial position $s(0) = 4$. Find $s(5)$."
            answer: "32/3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (antiderivative rule): $s(t) = \\int (t^2 - 6t + 8)\\,dt = \\frac{t^3}{3} - 3t^2 + 8t + C$. Step 2 (initial condition): $s(0) = C = 4$, so $s(t) = \\frac{t^3}{3} - 3t^2 + 8t + 4$. Step 3 (evaluate at $t = 5$): $\\frac{125}{3} - 75 + 40 + 4 = \\frac{32}{3}$, so the answer is 32/3."
        constraints: "polynomial velocity; initial condition pins down C"
      - id: kp3
        name: Recover velocity from acceleration
        key_prerequisites: [antiderivatives, motion-along-a-line]
        exemplars:
          - problem: 'A particle has acceleration $a(t) = 6t$ and initial velocity $v(0) = -2$. Find $v(2)$.'
            answer: "10"
            solution_sketch: '$v(t) = 3t^2 - 2$; $v(2) = 12 - 2 = 10$.'
          - problem: 'An object falls with $a(t) = -10$ m/s² and $v(0) = 20$ m/s. When is its velocity zero?'
            answer: "t = 2 s"
            solution_sketch: '$v(t) = 20 - 10t = 0$ at $t = 2$.'
          - problem: "A particle has acceleration $a(t) = 8t + 1$ m/s^2 and initial velocity $v(0) = 5$ m/s. Find its velocity at $t = 3$."
            answer: "44"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Recover velocity by integrating acceleration: $v(t) = \\int (8t + 1) dt = 4t^2 + t + C$. Use the initial condition $v(0) = 5$ to get $C = 5$, so $v(t) = 4t^2 + t + 5$. Evaluate at $t = 3$: $v(3) = 36 + 3 + 5 = 44$. The answer is 44."
          - problem: "An object moves with constant acceleration $a(t) = -6$ m/s^2 and initial velocity $v(0) = 24$ m/s. Find the time when its velocity is zero."
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Recover velocity by integrating acceleration: $v(t) = \\int -6 dt = -6t + C$. Use $v(0) = 24$ to get $C = 24$, so $v(t) = -6t + 24$. Set velocity zero: $-6t + 24 = 0$, so $t = 4$. The answer is 4."
          - problem: "A particle has acceleration $a(t) = 4t - 2$ m/s^2 and initial velocity $v(0) = -1$ m/s. Find its velocity at $t = 2$."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Recover velocity by integrating acceleration: $v(t) = \\int (4t - 2) dt = 2t^2 - 2t + C$. Use $v(0) = -1$ to get $C = -1$, so $v(t) = 2t^2 - 2t - 1$. Evaluate at $t = 2$: $v(2) = 8 - 4 - 1 = 3$. The answer is 3."
          - problem: "A cart has acceleration $a(t) = 2t + 7$ m/s^2 and initial velocity $v(0) = 3$ m/s. Find its velocity at $t = 4$."
            answer: "47"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Recover velocity by integrating acceleration: $v(t) = \\int (2t + 7) dt = t^2 + 7t + C$. Use $v(0) = 3$ to get $C = 3$, so $v(t) = t^2 + 7t + 3$. Evaluate at $t = 4$: $v(4) = 16 + 28 + 3 = 47$. The answer is 47."
        constraints: "constant or linear acceleration; integer answers with units"
    diagnostic_exemplar:
      problem: 'A particle has velocity $v(t) = 2t - 4$ on $[0, 3]$. Find the total distance traveled.'
      answer: "5"
      solution_sketch: '$v$ changes sign at $t = 2$: $|{-4}| + 1 = 5$.'
    anki_seeds:
      - front: "Displacement over [a,b] = ∫ v dt. Total distance = ?"
        back: "∫ |v(t)| dt — split at the times where v changes sign"
        type: basic
      - front: "From acceleration to position requires..."
        back: "two antidifferentiations, each fixed by an initial condition (v₀, then s₀)"
        type: basic

  - id: u-substitution-basics
    name: Basic u-Substitution
    core: true
    difficulty: 0.65
    drill: false
    answer_kind: expression
    expected_time_secs: 180
    prerequisites:
      - id: antiderivatives
        weight: 0.8
        key: true
      - id: chain-rule
        weight: 0.7
        key: true
    knowledge_points:
      - id: kp1
        name: Recognize u and du directly
        key_prerequisites: [antiderivatives, chain-rule]
        exemplars:
          - problem: 'Find $\int 2x(x^2 + 1)^4 \, dx$.'
            answer: "(x^2 + 1)^5/5 + C"
            solution_sketch: '$u = x^2 + 1$, $du = 2x\,dx$: $\int u^4\,du = \frac{u^5}{5} + C$.'
          - problem: 'Find $\int (2x + 1)^3 \, dx$.'
            answer: "(2x + 1)^4/8 + C"
            solution_sketch: '$u = 2x + 1$: $\frac{1}{2} \cdot \frac{u^4}{4} + C$; check: $\frac{4(2x+1)^3 \cdot 2}{8} = (2x+1)^3$.'
        constraints: "du present up to a constant factor; verify every answer by differentiating"
      - id: kp2
        name: Adjust constant factors
        key_prerequisites: [antiderivatives, chain-rule]
        exemplars:
          - problem: 'Find $\int x e^{x^2} \, dx$.'
            answer: "e^(x^2)/2 + C"
            solution_sketch: '$u = x^2$, $du = 2x\,dx$, so $x\,dx = \frac{du}{2}$: $\frac{1}{2}e^{x^2} + C$.'
          - problem: 'Find $\int x^2 \sqrt{x^3 + 1} \, dx$.'
            answer: "(2/9)(x^3 + 1)^(3/2) + C"
            solution_sketch: '$u = x^3 + 1$, $du = 3x^2\,dx$: $\frac{1}{3} \cdot \frac{2}{3}u^{3/2} + C$.'
          - problem: 'Find $\int \frac{x}{x^2 + 4} \, dx$.'
            answer: "(1/2)ln(x^2 + 4) + C"
            solution_sketch: '$u = x^2 + 4$: $\frac{1}{2}\int \frac{du}{u} = \frac{1}{2}\ln|u| + C$ ($u > 0$ here).'
        constraints: "missing constant multiplier only — never a missing variable factor"
      - id: kp3
        name: Linear inside functions
        key_prerequisites: [antiderivatives, chain-rule]
        exemplars:
          - problem: 'Find $\int \cos(3x) \, dx$.'
            answer: "sin(3x)/3 + C"
            solution_sketch: '$u = 3x$, $du = 3\,dx$: $\frac{1}{3}\int \cos u\,du$.'
          - problem: 'Find $\int e^{5x} \, dx$.'
            answer: "e^(5x)/5 + C"
          - problem: 'Find $\int \frac{1}{3x + 2} \, dx$ for $x > -\frac{2}{3}$.'
            answer: "(1/3)ln(3x + 2) + C"
            solution_sketch: '$u = 3x + 2 > 0$ on this domain: $\frac{1}{3}\ln u + C$.'
        constraints: "u = ax + b; divide by the inner slope a"
    diagnostic_exemplar:
      problem: 'Find $\int x \sin(x^2) \, dx$.'
      answer: "-cos(x^2)/2 + C"
      solution_sketch: '$u = x^2$, $du = 2x\,dx$, so $x\,dx = \frac{du}{2}$: $\frac{1}{2}\int \sin u\,du = -\frac{\cos u}{2} + C$.'
    anki_seeds:
      - front: "Substitution reverses which differentiation rule?"
        back: "the chain rule"
        type: basic
      - front: "∫ f(ax + b) dx (F an antiderivative of f) = ?"
        back: "F(ax + b)/a + C — divide by the inner slope"
        type: basic

  - id: integration-substitution
    name: Integration by Substitution
    core: true
    difficulty: 0.7
    drill: false
    answer_kind: expression
    expected_time_secs: 240
    prerequisites:
      - id: u-substitution-basics
        weight: 0.8
        key: true
      - id: definite-integrals-ftc
        weight: 0.6
        key: true
      - id: chain-rule
        weight: 0.5
      - id: derivatives-exp-log
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: Harder composite integrands
        key_prerequisites: [u-substitution-basics, derivatives-exp-log]
        exemplars:
          - problem: 'Find $\int \tan x \, dx$ for $0 < x < \frac{\pi}{2}$.'
            answer: "-ln(cos x) + C"
            solution_sketch: 'Write $\tan x = \frac{\sin x}{\cos x}$; $u = \cos x > 0$ here, $du = -\sin x\,dx$: $-\ln u + C$.'
          - problem: 'Find $\int \frac{(\ln x)^2}{x} \, dx$.'
            answer: "(ln x)^3/3 + C"
            solution_sketch: '$u = \ln x$, $du = \frac{dx}{x}$: $\int u^2\,du$.'
          - problem: 'Find $\int \frac{e^x}{1 + e^x} \, dx$.'
            answer: "ln(1 + e^x) + C"
            solution_sketch: '$u = 1 + e^x$, $du = e^x\,dx$: $\ln|u| + C$ ($u > 0$).'
        constraints: "u is a trig, log, or exponential expression; the du appears as a factor"
      - id: kp2
        name: Definite integrals with substitution
        key_prerequisites: [definite-integrals-ftc, u-substitution-basics]
        exemplars:
          - problem: 'Evaluate $\int_0^1 2x(x^2 + 1)^3 \, dx$.'
            answer: "15/4"
            solution_sketch: '$u = x^2 + 1$ runs from $1$ to $2$: $\left[\frac{u^4}{4}\right]_1^2 = \frac{16 - 1}{4} = \frac{15}{4}$.'
          - problem: 'Evaluate $\int_0^{\pi/2} \sin x \cos x \, dx$.'
            answer: "1/2"
            solution_sketch: '$u = \sin x$ runs from $0$ to $1$: $\left[\frac{u^2}{2}\right]_0^1 = \frac{1}{2}$.'
          - problem: 'Evaluate $\int_1^e \frac{\ln x}{x} \, dx$.'
            answer: "1/2"
            solution_sketch: '$u = \ln x$ runs from $0$ to $1$: $\left[\frac{u^2}{2}\right]_0^1$.'
        constraints: "change the limits along with the variable; exact fraction answers"
      - id: kp3
        name: Back-substitution when du is incomplete
        key_prerequisites: [u-substitution-basics, definite-integrals-ftc]
        exemplars:
          - problem: 'Find $\int x\sqrt{x + 1} \, dx$.'
            answer: "(2/5)(x + 1)^(5/2) - (2/3)(x + 1)^(3/2) + C"
            solution_sketch: '$u = x + 1$, $x = u - 1$: $\int (u - 1)u^{1/2}\,du = \frac{2}{5}u^{5/2} - \frac{2}{3}u^{3/2} + C$.'
          - problem: 'Evaluate $\int_0^3 x\sqrt{x + 1} \, dx$.'
            answer: "116/15"
            solution_sketch: '$u$ runs $1$ to $4$: $\left[\frac{2}{5}u^{5/2} - \frac{2}{3}u^{3/2}\right]_1^4 = \left(\frac{64}{5} - \frac{16}{3}\right) - \left(\frac{2}{5} - \frac{2}{3}\right) = \frac{116}{15}$.'
        constraints: "u linear so x = u - b is exact; express leftover x in terms of u"
    diagnostic_exemplar:
      problem: 'Evaluate $\int_0^5 \frac{x}{\sqrt{x + 4}} \, dx$.'
      answer: "14/3"
      solution_sketch: '$u = x + 4$ runs from $4$ to $9$; $\int_4^9 (u^{1/2} - 4u^{-1/2})\,du = \left[\tfrac{2}{3}u^{3/2} - 8u^{1/2}\right]_4^9 = -6 + \tfrac{32}{3} = \tfrac{14}{3}$.'
    anki_seeds:
      - front: "When you substitute u = g(x) in a DEFINITE integral, the limits become..."
        back: "u-values: g(a) and g(b) — never keep the old x-limits with the new variable"
        type: basic
      - front: "∫ tan x dx = ?"
        back: "-ln|cos x| + C (= ln|sec x| + C)"
        type: basic
      - front: "In ∫ x√(x+1) dx with u = x + 1, the leftover x becomes..."
        back: "u - 1 — solve the substitution for x and back-substitute"
        type: basic
