unit: intro-integration
course: calculus-1
module: "Introduction to Integration"
topics:
  - id: reverse-power-rule
    name: The Reverse Power Rule
    core: true
    difficulty: 0.5
    drill: false
    answer_kind: expression
    expected_time_secs: 90
    prerequisites:
      - id: derivative-power-rule
        weight: 0.8
        key: true
      - id: rational-exponents
        weight: 0.4
        key: true
      - id: negative-zero-exponents
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: Antidifferentiate single powers
        key_prerequisites: [derivative-power-rule]
        step_check:
          step: 'Divide $x^8$ by $8$ to get $\dfrac{x^8}{8}$'
          question: 'Why is $x^8$ divided by $8$?'
          options:
            - 'Dividing by $8$ lowers the exponent of $x$ back down from $8$ to the value $7$'
            - 'Differentiating $x^8$ brings down a factor $8$, so dividing by $8$ undoes it'
            - 'The $8$ is the constant $C$ and must be divided out of the final answer'
            - 'Every antiderivative is the original function divided by its exponent'
          answer: 'Differentiating $x^8$ brings down a factor $8$, so dividing by $8$ undoes it'
          why: 'The derivative of $\frac{x^8}{8}$ is $\frac{8x^7}{8}=x^7$, so the division by $8$ cancels the factor that differentiation brings down.'
        try_first:
          problem: 'The derivative of $x^4$ is $4x^3$. By what number must you multiply $x^4$ so that its derivative is exactly $x^3$?'
          answer_contract: {"kind":"exact"}
          answer: '1/4'
          reveal: 'Multiplying by $\frac{1}{4}$ cancels the factor $4$ that differentiation brings down, so an antiderivative of $x^3$ is $\frac{x^4}{4}$. In general, raise the exponent by one and divide by the new exponent.'
        exemplars:
          - problem: 'Find $\int x^4\,dx$.'
            answer: 'x^5/5 + C'
            answer_contract: {"kind":"function","vars":["x"],"up_to_constant":true}
            solution_sketch: 'The exponent $4$ goes up by one to $5$. Dividing by the new exponent gives $\frac{x^5}{5}$, and the constant $C$ is added. Differentiating $\frac{x^5}{5}$ returns $x^4$, which confirms the result.'
          - problem: 'Find the most general antiderivative of $x^6$.'
            answer: 'x^7/7 + C'
            answer_contract: {"kind":"function","vars":["x"],"up_to_constant":true}
            solution_sketch: 'Raise the exponent from $6$ to $7$ and divide by $7$. The family of all antiderivatives is $\frac{x^7}{7} + C$.'
          - problem: 'The derivative of a function $f$ is $f''(x)=x^2$. What is $f(x)$?'
            answer: 'x^3/3 + C'
            answer_contract: {"kind":"function","vars":["x"],"up_to_constant":true}
            solution_sketch: 'The exponent $2$ rises to $3$, and dividing by $3$ gives $\frac{x^3}{3}$. Any constant can be added, so $f(x)=\frac{x^3}{3}+C$.'
          - problem: 'Sam says that $\int x^3\,dx = 3x^2 + C$. What is the correct antiderivative of $x^3$?'
            answer: 'x^4/4 + C'
            answer_contract: {"kind":"function","vars":["x"],"up_to_constant":true}
            solution_sketch: 'Sam differentiated instead of reversing the rule. To antidifferentiate, raise the exponent from $3$ to $4$ and divide by $4$, which gives $\frac{x^4}{4} + C$.'
          - problem: 'The slope of a curve at each point $(x,y)$ is $x^5$. What is the formula for $y$ in terms of $x$?'
            answer: 'x^6/6 + C'
            answer_contract: {"kind":"function","vars":["x"],"up_to_constant":true}
            solution_sketch: 'The slope is the derivative, so $y$ is an antiderivative of $x^5$. Raise the exponent from $5$ to $6$ and divide by $6$ to get $\frac{x^6}{6} + C$.'
          - problem: 'The velocity of a particle is $v(t)=t^3$ metres per second. Find a formula for its position $s(t)$.'
            answer: 't^4/4 + C'
            answer_contract: {"kind":"function","vars":["t"],"up_to_constant":true}
            solution_sketch: 'Position is an antiderivative of velocity. Raise the exponent from $3$ to $4$ and divide by $4$, so $s(t)=\frac{t^4}{4}+C$.'
          - problem: 'Find $\int x\,dx$.'
            answer: 'x^2/2 + C'
            answer_contract: {"kind":"function","vars":["x"],"up_to_constant":true}
            solution_sketch: 'The factor $x$ is $x^1$. Raising the exponent from $1$ to $2$ and dividing by $2$ gives $\frac{x^2}{2} + C$.'
          - problem: 'Find $\int x^{9}\,dx$.'
            answer: 'x^10/10 + C'
            answer_contract: {"kind":"function","vars":["x"],"up_to_constant":true}
            solution_sketch: 'The exponent $9$ rises to $10$. Dividing by $10$ gives $\frac{x^{10}}{10} + C$.'
        constraints: 'positive integer exponents; always include + C'
      - id: kp2
        name: Antidifferentiate polynomials term by term
        key_prerequisites: [derivative-power-rule]
        step_check:
          step: 'Combine the terms and attach one constant of integration'
          question: 'Why is only one constant $C$ written for the whole polynomial?'
          options:
            - 'Each term has its own constant, but they are always equal to zero'
            - 'Only the last term of the polynomial may carry a constant of integration'
            - 'The constants of the separate terms combine into one arbitrary constant'
            - 'The constant $C$ replaces the term $4$ in the original polynomial'
          answer: 'The constants of the separate terms combine into one arbitrary constant'
          why: 'Each term has an arbitrary constant, and a sum of arbitrary constants is itself an arbitrary constant, so one $C$ stands for all of them.'
        exemplars:
          - problem: 'Find $\int (6x^2-4x+1)\,dx$.'
            answer: '2x^3 - 2x^2 + x + C'
            answer_contract: {"kind":"function","vars":["x"],"up_to_constant":true}
            solution_sketch: 'Integrate each term: $6x^2$ gives $2x^3$, $-4x$ gives $-2x^2$, and $1$ gives $x$. Add one constant at the end: $2x^3-2x^2+x+C$.'
          - problem: 'Find the antiderivative of $g(x)=10x^4+9x^2-4$.'
            answer: '2x^5 + 3x^3 - 4x + C'
            answer_contract: {"kind":"function","vars":["x"],"up_to_constant":true}
            solution_sketch: 'The term $10x^4$ gives $\frac{10x^5}{5}=2x^5$, the term $9x^2$ gives $\frac{9x^3}{3}=3x^3$, and $-4$ gives $-4x$. So the antiderivative is $2x^5+3x^3-4x+C$.'
          - problem: 'The velocity of a cyclist is $v(t)=12t^2+6t$ metres per second. Find a formula for her position $s(t)$.'
            answer: '4t^3 + 3t^2 + C'
            answer_contract: {"kind":"function","vars":["t"],"up_to_constant":true}
            solution_sketch: 'The term $12t^2$ gives $\frac{12t^3}{3}=4t^3$ and the term $6t$ gives $\frac{6t^2}{2}=3t^2$. Position is an antiderivative of velocity, so $s(t)=4t^3+3t^2+C$.'
          - problem: 'Find $\int (3x^2+2x)\,dx$.'
            answer: 'x^3 + x^2 + C'
            answer_contract: {"kind":"function","vars":["x"],"up_to_constant":true}
            solution_sketch: 'The term $3x^2$ gives $x^3$ and the term $2x$ gives $x^2$. Add the constant: $x^3+x^2+C$.'
          - problem: 'Water flows into a tank at the rate $r(t)=8t^3-6t$ litres per minute. Find a formula for the volume $V(t)$ of water in the tank.'
            answer: '2t^4 - 3t^2 + C'
            answer_contract: {"kind":"function","vars":["t"],"up_to_constant":true}
            solution_sketch: 'The volume is an antiderivative of the flow rate. The term $8t^3$ gives $2t^4$ and the term $-6t$ gives $-3t^2$, so $V(t)=2t^4-3t^2+C$.'
          - problem: 'Omar writes $\int (8x^3+5)\,dx = 2x^4+5$. What is the correct antiderivative?'
            answer: '2x^4 + 5x + C'
            answer_contract: {"kind":"function","vars":["x"],"up_to_constant":true}
            solution_sketch: 'Omar left the constant $5$ unchanged, but a constant $5$ integrates to $5x$. The term $8x^3$ gives $2x^4$, so the antiderivative is $2x^4+5x+C$.'
          - problem: 'Find $\int \left(\frac{x^3}{2}-3x\right)dx$.'
            answer: 'x^4/8 - 3x^2/2 + C'
            answer_contract: {"kind":"function","vars":["x"],"up_to_constant":true}
            solution_sketch: 'The term $\frac{x^3}{2}$ gives $\frac{x^4}{8}$ because $\frac{1}{2}\cdot\frac{1}{4}=\frac{1}{8}$. The term $-3x$ gives $-\frac{3x^2}{2}$, so the result is $\frac{x^4}{8}-\frac{3x^2}{2}+C$.'
        constraints: 'integer or simple fraction coefficients; one constant C at the end'
      - id: kp3
        name: Rewrite radicals and negative powers first
        key_prerequisites: [derivative-power-rule, rational-exponents]
        step_check:
          step: 'Rewrite the reciprocal as a negative power: $\dfrac{1}{x^{1/2}} = x^{-1/2}$'
          question: 'Why is $\dfrac{1}{x^{1/2}}$ equal to $x^{-1/2}$?'
          options:
            - 'A power moves from the denominator to the numerator with its exponent sign flipped'
            - 'Moving a power from the denominator to the numerator halves the exponent'
            - 'The minus sign comes from the square root, which is always taken as a negative number'
            - 'A negative exponent means that the whole expression is a negative number'
          answer: 'A power moves from the denominator to the numerator with its exponent sign flipped'
          why: 'A power in the denominator is the reciprocal of that power, and $\frac{1}{x^a}=x^{-a}$; for $x=4$ both forms equal $\frac{1}{2}$, which is positive.'
        exemplars:
          - problem: 'Find $\int \sqrt{x}\,dx$.'
            answer: '(2/3)x^(3/2) + C'
            answer_contract: {"kind":"function","vars":["x"],"up_to_constant":true}
            solution_sketch: 'Write $\sqrt{x}=x^{1/2}$. Raise the exponent to $\frac{3}{2}$ and divide by $\frac{3}{2}$, which is the same as multiplying by $\frac{2}{3}$, so the result is $\frac{2}{3}x^{3/2}+C$.'
          - problem: 'Find $\int \frac{1}{x^2}\,dx$.'
            answer: '-1/x + C'
            answer_contract: {"kind":"function","vars":["x"],"up_to_constant":true}
            solution_sketch: 'Write $\frac{1}{x^2}=x^{-2}$. Raising the exponent to $-1$ and dividing by $-1$ gives $-x^{-1}=-\frac{1}{x}$, so the answer is $-\frac{1}{x}+C$.'
          - problem: 'Find $\int \frac{4}{\sqrt{x}}\,dx$.'
            answer: '8sqrt(x) + C'
            answer_contract: {"kind":"function","vars":["x"],"up_to_constant":true}
            solution_sketch: 'Write $\frac{4}{\sqrt{x}}=4x^{-1/2}$. Raising the exponent to $\frac{1}{2}$ and dividing by $\frac{1}{2}$ gives $4\cdot 2x^{1/2}=8\sqrt{x}$, so the answer is $8\sqrt{x}+C$.'
          - problem: 'A bacteria culture grows at the rate $r(t)=\sqrt{t}$ thousand cells per hour. Find a formula for the population $P(t)$, in thousands of cells.'
            answer: '(2/3)t^(3/2) + C'
            answer_contract: {"kind":"function","vars":["t"],"up_to_constant":true}
            solution_sketch: 'The population is an antiderivative of the growth rate. Write $\sqrt{t}=t^{1/2}$, raise the exponent to $\frac{3}{2}$ and divide by $\frac{3}{2}$, so $P(t)=\frac{2}{3}t^{3/2}+C$.'
          - problem: 'The velocity of a probe is $v(t)=\frac{6}{t^3}$ metres per second for $t>0$. Find a formula for its position $s(t)$.'
            answer: '-3/t^2 + C'
            answer_contract: {"kind":"function","vars":["t"],"up_to_constant":true}
            solution_sketch: 'Write $\frac{6}{t^3}=6t^{-3}$. Raising the exponent from $-3$ to $-2$ and dividing by $-2$ gives $-3t^{-2}$, so $s(t)=-\frac{3}{t^2}+C$.'
          - problem: 'Find $\int x(x+2)\,dx$.'
            answer: 'x^3/3 + x^2 + C'
            answer_contract: {"kind":"function","vars":["x"],"up_to_constant":true}
            solution_sketch: 'Expand the product first: $x(x+2)=x^2+2x$. Then $x^2$ gives $\frac{x^3}{3}$ and $2x$ gives $x^2$, so the answer is $\frac{x^3}{3}+x^2+C$.'
          - problem: 'Find $\int \left(3\sqrt{x}-\frac{4}{x^2}\right)dx$.'
            answer: '2x^(3/2) + 4/x + C'
            answer_contract: {"kind":"function","vars":["x"],"up_to_constant":true}
            solution_sketch: 'Write the terms as $3x^{1/2}$ and $-4x^{-2}$. The first gives $\frac{3x^{3/2}}{3/2}=2x^{3/2}$ and the second gives $\frac{-4x^{-1}}{-1}=\frac{4}{x}$, so the answer is $2x^{3/2}+\frac{4}{x}+C$.'
          - problem: 'Ravi writes $\int \frac{1}{x^3}\,dx = \frac{x^{-2}}{2}+C$. What is the correct antiderivative?'
            answer: '-1/(2x^2) + C'
            answer_contract: {"kind":"function","vars":["x"],"up_to_constant":true}
            solution_sketch: 'Write $\frac{1}{x^3}=x^{-3}$. The new exponent is $-2$, and the division must be by $-2$, not by $2$. So the answer is $\frac{x^{-2}}{-2}+C=-\frac{1}{2x^2}+C$.'
          - problem: 'Find $\int \sqrt[3]{x}\,dx$.'
            answer: '(3/4)x^(4/3) + C'
            answer_contract: {"kind":"function","vars":["x"],"up_to_constant":true}
            solution_sketch: 'Write $\sqrt[3]{x}=x^{1/3}$. Raise the exponent to $\frac{4}{3}$ and divide by $\frac{4}{3}$, which is the same as multiplying by $\frac{3}{4}$, so the result is $\frac{3}{4}x^{4/3}+C$.'
        constraints: 'rewrite as powers before integrating; exponents ≠ -1'
    diagnostic_exemplar:
      problem: 'Find $\int \left(\sqrt{x} + \frac{3}{x^2}\right) dx$.'
      answer: "(2/3)x^(3/2) - 3/x + C"
      solution_sketch: 'Rewrite as $x^{1/2} + 3x^{-2}$, then raise each exponent by one and divide: $\frac{2}{3}x^{3/2} + \frac{3x^{-1}}{-1} + C$.'
    anki_seeds:
      - front: "Reverse power rule: ∫ x^n dx = ? (n ≠ -1)"
        back: "x^(n+1)/(n+1) + C"
        type: basic
      - front: "Before applying the reverse power rule to √x or 1/x², first..."
        back: "rewrite as a power: x^(1/2), x^(-2)"
        type: basic

  - id: antiderivatives
    name: Antiderivatives
    core: true
    difficulty: 0.55
    drill: false
    answer_kind: expression
    expected_time_secs: 120
    prerequisites:
      - id: reverse-power-rule
        weight: 0.8
        key: true
      - id: derivatives-trig
        weight: 0.5
        key: true
      - id: derivatives-exp-log
        weight: 0.5
        key: true
    knowledge_points:
      - id: kp1
        name: Antiderivatives of trig, exponential, and 1/x
        key_prerequisites: [derivatives-trig, derivatives-exp-log]
        step_check:
          step: 'since $\frac{d}{dx}(-\cos x) = \sin x$'
          question: 'Why is the antiderivative of $\sin x$ equal to $-\cos x$ and not $\cos x$?'
          options:
            - 'The minus sign comes from the constant $C$, which is always taken as negative'
            - 'Sine and cosine simply swap places, and the cosine always takes the minus sign'
            - 'The antiderivative of a sine is negative because $\sin x$ is negative for $x<0$'
            - 'The derivative of $-\cos x$ is $\sin x$, but that of $\cos x$ is $-\sin x$'
          answer: 'The derivative of $-\cos x$ is $\sin x$, but that of $\cos x$ is $-\sin x$'
          why: 'Only $-\cos x$ has derivative $\sin x$; the derivative of $\cos x$ is $-\sin x$, which is the wrong sign.'
        exemplars:
          - problem: 'Find $\int \cos x\,dx$.'
            answer: 'sin(x) + C'
            answer_contract: {"kind":"function","vars":["x"],"up_to_constant":true}
            solution_sketch: 'The derivative of $\sin x$ is $\cos x$. So $\sin x$ is an antiderivative of $\cos x$, and the family of all antiderivatives is $\sin x + C$.'
          - problem: 'Find $\int \left(e^x+\frac{1}{x}\right)dx$ for $x>0$.'
            answer: 'e^x + ln(x) + C'
            answer_contract: {"kind":"function","vars":["x"],"up_to_constant":true}
            solution_sketch: 'The derivative of $e^x$ is $e^x$, and for $x>0$ the derivative of $\ln x$ is $\frac{1}{x}$. Integrate each term and add one constant to get $e^x+\ln x+C$.'
          - problem: 'Find $\int \sec^2 x\,dx$.'
            answer: 'tan(x) + C'
            answer_contract: {"kind":"function","vars":["x"],"up_to_constant":true}
            solution_sketch: 'The derivative of $\tan x$ is $\sec^2 x$. So the antiderivatives of $\sec^2 x$ are $\tan x + C$.'
          - problem: 'The current in a circuit is $i(t)=3\cos t$ amperes. Find a formula for the charge $q(t)$, whose derivative is $i(t)$.'
            answer: '3sin(t) + C'
            answer_contract: {"kind":"function","vars":["t"],"up_to_constant":true}
            solution_sketch: 'The charge is an antiderivative of the current. Since an antiderivative of $\cos t$ is $\sin t$, the charge is $q(t)=3\sin t+C$.'
          - problem: 'The profit of a shop changes at the rate $p''(x)=\frac{5}{x}$ thousand dollars per unit sold, for $x>0$. Find a formula for the profit $p(x)$.'
            answer: '5ln(x) + C'
            answer_contract: {"kind":"function","vars":["x"],"up_to_constant":true}
            solution_sketch: 'Profit is an antiderivative of its rate of change. Since the derivative of $\ln x$ is $\frac{1}{x}$ for $x>0$, the profit is $p(x)=5\ln x+C$.'
          - problem: 'Find $\int (2e^x-3\sin x)\,dx$.'
            answer: '2e^x + 3cos(x) + C'
            answer_contract: {"kind":"function","vars":["x"],"up_to_constant":true}
            solution_sketch: 'Integrate term by term. The term $2e^x$ gives $2e^x$ and the term $-3\sin x$ gives $3\cos x$ because the derivative of $\cos x$ is $-\sin x$. The answer is $2e^x+3\cos x+C$.'
          - problem: 'Tia writes $\int \sin x\,dx=\cos x+C$. What is the correct antiderivative?'
            answer: '-cos(x) + C'
            answer_contract: {"kind":"function","vars":["x"],"up_to_constant":true}
            solution_sketch: 'The derivative of $\cos x$ is $-\sin x$, not $\sin x$. The function with derivative $\sin x$ is $-\cos x$, so the correct antiderivative is $-\cos x+C$.'
          - problem: 'Find $\int \frac{5}{x}\,dx$ for $x\neq 0$.'
            answer: '5ln(abs(x)) + C'
            answer_contract: {"kind":"function","vars":["x"],"up_to_constant":true}
            solution_sketch: 'For $x\neq 0$ the derivative of $\ln|x|$ is $\frac{1}{x}$, for positive and for negative $x$. Pull out the factor $5$ to get $5\ln|x|+C$.'
        constraints: 'the basic table: sin, cos, sec^2, e^x, 1/x'
      - id: kp2
        name: Rewrite, then antidifferentiate
        key_prerequisites: [reverse-power-rule, derivatives-trig]
        step_check:
          step: 'Split the fraction term by term'
          question: 'Why can the fraction be split into one fraction for each term of the numerator?'
          options:
            - 'The integral of a quotient is the quotient of the integrals of top and bottom'
            - 'The single denominator divides every term of the numerator separately'
            - 'The denominator can be dropped once the integral sign is written'
            - 'The $x^2$ below cancels the plus sign between the two terms'
          answer: 'The single denominator divides every term of the numerator separately'
          why: 'Dividing a sum by $x^2$ divides each term by $x^2$, so $\frac{a+b}{c}=\frac{a}{c}+\frac{b}{c}$; each piece then simplifies to a power.'
        exemplars:
          - problem: 'Find $\int \frac{x^3+2x}{x}\,dx$.'
            answer: 'x^3/3 + 2x + C'
            answer_contract: {"kind":"function","vars":["x"],"up_to_constant":true}
            solution_sketch: 'Divide each term by $x$ first: $\frac{x^3+2x}{x}=x^2+2$. Then $x^2$ gives $\frac{x^3}{3}$ and $2$ gives $2x$, so the answer is $\frac{x^3}{3}+2x+C$.'
          - problem: 'Find $\int \sqrt{x}\,(x+1)\,dx$.'
            answer: '(2/5)x^(5/2) + (2/3)x^(3/2) + C'
            answer_contract: {"kind":"function","vars":["x"],"up_to_constant":true}
            solution_sketch: 'Expand first: $\sqrt{x}(x+1)=x^{3/2}+x^{1/2}$. Raising each exponent by one and dividing gives $\frac{2}{5}x^{5/2}+\frac{2}{3}x^{3/2}+C$.'
          - problem: 'Find $\int (2\sin x-3e^x)\,dx$.'
            answer: '-2cos(x) - 3e^x + C'
            answer_contract: {"kind":"function","vars":["x"],"up_to_constant":true}
            solution_sketch: 'Integrate term by term. The term $2\sin x$ gives $-2\cos x$ and the term $-3e^x$ gives $-3e^x$, so the answer is $-2\cos x-3e^x+C$.'
          - problem: 'The velocity of a particle is $v(t)=\frac{t^4+3t^2}{t}$ metres per second for $t>0$. Find a formula for its position $s(t)$.'
            answer: 't^4/4 + 3t^2/2 + C'
            answer_contract: {"kind":"function","vars":["t"],"up_to_constant":true}
            solution_sketch: 'Divide each term by $t$ first: $\frac{t^4+3t^2}{t}=t^3+3t$. Then $t^3$ gives $\frac{t^4}{4}$ and $3t$ gives $\frac{3t^2}{2}$, so $s(t)=\frac{t^4}{4}+\frac{3t^2}{2}+C$.'
          - problem: 'Find the antiderivative of $x^2(x-2)$ with respect to $x$.'
            answer: 'x^4/4 - 2x^3/3 + C'
            answer_contract: {"kind":"function","vars":["x"],"up_to_constant":true}
            solution_sketch: 'Expand the product first: $x^2(x-2)=x^3-2x^2$. Then $x^3$ gives $\frac{x^4}{4}$ and $-2x^2$ gives $-\frac{2x^3}{3}$, so the answer is $\frac{x^4}{4}-\frac{2x^3}{3}+C$.'
          - problem: 'The marginal cost of making the $x$-th item is $\frac{6x^2+4}{x^2}$ dollars for $x>0$. Find a formula for the total cost $T(x)$.'
            answer: '6x - 4/x + C'
            answer_contract: {"kind":"function","vars":["x"],"up_to_constant":true}
            solution_sketch: 'Divide each term by $x^2$ first: $\frac{6x^2+4}{x^2}=6+4x^{-2}$. Then $6$ gives $6x$ and $4x^{-2}$ gives $-4x^{-1}$, so $T(x)=6x-\frac{4}{x}+C$.'
          - problem: 'Find $\int \frac{x^3+x\cos x}{x}\,dx$.'
            answer: 'x^3/3 + sin(x) + C'
            answer_contract: {"kind":"function","vars":["x"],"up_to_constant":true}
            solution_sketch: 'Divide each term by $x$ first: $\frac{x^3+x\cos x}{x}=x^2+\cos x$. Then $x^2$ gives $\frac{x^3}{3}$ and $\cos x$ gives $\sin x$, so the answer is $\frac{x^3}{3}+\sin x+C$.'
          - problem: 'Jonas writes $\int \frac{x^2+4}{x}\,dx=\frac{x^3/3+4x}{x}+C$ for $x>0$. What is the correct antiderivative?'
            answer: 'x^2/2 + 4ln(x) + C'
            answer_contract: {"kind":"function","vars":["x"],"up_to_constant":true}
            solution_sketch: 'A fraction cannot be integrated by integrating its top and bottom separately. Divide each term by $x$ first to get $x+\frac{4}{x}$, so the answer is $\frac{x^2}{2}+4\ln x+C$.'
        constraints: 'algebraic rewriting (divide, expand) before integrating; mixed table entries'
      - id: kp3
        name: Determine C from an initial condition
        key_prerequisites: [reverse-power-rule, derivatives-trig]
        step_check:
          step: 'substitute $x = 1$ into $f(x)$ and set it equal to $3$'
          question: 'Why does the condition $f(1)=3$ determine the constant $C$?'
          options:
            - 'The constant $C$ is always equal to the value of $f$ at the point $x=1$'
            - 'Differentiating $f(1)$ removes $C$ and then leaves the number $3$ behind'
            - 'Only one curve $x^4+x+C$ passes through the point $(1,3)$'
            - 'The derivative $4x^3+1$ must also be equal to $3$ at $x=1$'
          answer: 'Only one curve $x^4+x+C$ passes through the point $(1,3)$'
          why: 'Each value of $C$ gives a different curve $x^4+x+C$; requiring the curve to pass through $(1,3)$ leaves only $C=1$.'
        try_first:
          problem: 'A function $f$ has $f''(x)=2x$, so $f(x)=x^2+C$ for some constant $C$. If $f(3)=10$, what is $C$?'
          answer_contract: {"kind":"exact"}
          answer: '1'
          reveal: 'Putting $x=3$ gives $9+C=10$, so $C=1$. One known point on the graph picks a single curve out of the whole family $x^2+C$.'
        exemplars:
          - problem: 'Find $f(x)$ given $f''(x)=2x$ and $f(1)=5$.'
            answer: 'x^2 + 4'
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'An antiderivative of $2x$ is $x^2$, so $f(x)=x^2+C$. The condition gives $1+C=5$, so $C=4$ and $f(x)=x^2+4$.'
          - problem: 'Find $f$ if $f''(x)=3x^2-2$ and $f(0)=1$.'
            answer: 'x^3 - 2x + 1'
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'Antidifferentiating gives $f(x)=x^3-2x+C$. Since $f(0)=0-0+C=1$, the constant is $C=1$, so the function is $x^3-2x+1$.'
          - problem: 'Find $f(x)$ given $f''(x)=\cos x$ and $f(0)=2$.'
            answer: 'sin(x) + 2'
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'An antiderivative of $\cos x$ is $\sin x$, so $f(x)=\sin x+C$. Since $f(0)=0+C=2$, the function is $\sin x+2$.'
          - problem: 'A ball is thrown upward from a height of $3$ metres. After $t$ seconds its velocity is $h''(t)=10-4t$ metres per second. Find a formula for its height $h(t)$.'
            answer: '10t - 2t^2 + 3'
            answer_contract: {"kind":"function","vars":["t"]}
            solution_sketch: 'Antidifferentiating gives $h(t)=10t-2t^2+C$. At $t=0$ the height is $3$, so $C=3$ and $h(t)=10t-2t^2+3$.'
          - problem: 'A factory''s marginal cost is $6x+2$ dollars per item when $x$ items have been made. Making no items costs $50$ dollars. Find the total cost function $T(x)$.'
            answer: '3x^2 + 2x + 50'
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'The cost is an antiderivative of the marginal cost, so $T(x)=3x^2+2x+C$. Since $T(0)=C=50$, the cost function is $T(x)=3x^2+2x+50$.'
          - problem: 'Find $f(x)$ if $f''(x)=e^x+2x$ and $f(0)=5$.'
            answer: 'e^x + x^2 + 4'
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'Antidifferentiating gives $f(x)=e^x+x^2+C$. Then $f(0)=e^0+0+C=1+C=5$, so $C=4$ and the function is $f(x)=e^x+x^2+4$.'
          - problem: 'Find $f(x)$ given $f''(x)=\sin x$ and $f(\pi)=4$.'
            answer: '-cos(x) + 3'
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'An antiderivative of $\sin x$ is $-\cos x$, so $f(x)=-\cos x+C$. Then $f(\pi)=1+C=4$, so $C=3$ and $f(x)=-\cos x+3$.'
          - problem: 'Ana solves $f''(x)=4x$ with $f(2)=9$ and writes $f(x)=2x^2+9$. What is the correct $f(x)$?'
            answer: '2x^2 + 1'
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'Ana added the value $9$ as the constant, but $f(x)=2x^2+C$ must satisfy $f(2)=8+C=9$. So $C=1$ and the correct function is $2x^2+1$.'
        constraints: 'one initial condition; C is a small integer'
    diagnostic_exemplar:
      problem: 'Find $f(x)$ given $f''(x) = 4x + \cos x$ and $f(0) = 3$.'
      answer: "2x^2 + sin x + 3"
      solution_sketch: 'Antidifferentiate to $f(x) = 2x^2 + \sin x + C$; the initial condition $f(0) = C = 3$ pins the constant.'
    anki_seeds:
      - front: "∫ 1/x dx = ?"
        back: "ln|x| + C"
        type: basic
      - front: "∫ sin x dx = ? and ∫ cos x dx = ?"
        back: "-cos x + C; sin x + C (mind the sign on the first)"
        type: basic
      - front: "Two antiderivatives of the same function differ by..."
        back: "a constant — hence the + C"
        type: basic

  - id: left-right-riemann-sums
    name: Left and Right Riemann Sums
    core: true
    difficulty: 0.5
    drill: false
    answer_kind: numeric
    expected_time_secs: 150
    prerequisites:
      - id: function-notation
        weight: 0.5
        key: true
      - id: area-triangles-quadrilaterals
        weight: 0.4
        key: true
      - id: summation-notation
        weight: 0.4
      - id: decimal-operations
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: Right Riemann sums
        key_prerequisites: [function-notation, area-triangles-quadrilaterals]
        step_check:
          step: 'so the right endpoints are $x_1 = 1$, $x_2 = 2$, $x_3 = 3$'
          question: 'Why does the first right endpoint equal $1$ and not $0$?'
          options:
            - 'The point $x=0$ cannot be used because $f(0)$ is always zero'
            - 'A right sum starts one full step after $a$ because it skips the first interval'
            - 'The endpoint $0$ is used only when the interval is split into four parts'
            - 'The first subinterval is $[0,1]$, and the right end of it is $1$'
          answer: 'The first subinterval is $[0,1]$, and the right end of it is $1$'
          why: 'A right sum samples each subinterval at its right end; $[0,1]$ has right end $1$, and the last subinterval $[2,3]$ has right end $3$.'
        try_first:
          problem: 'The interval $[0,6]$ is cut into $3$ equal pieces. On each piece stands a rectangle whose height is the height of the line $y=x$ at the right end of the piece. What is the total area of the three rectangles?'
          answer_contract: {"kind":"exact"}
          answer: '24'
          reveal: 'Each rectangle is $2$ wide, and the heights are $2$, $4$ and $6$, so the total area is $2(2+4+6)=24$. This is a right Riemann sum for $\int_0^6 x\,dx$, whose exact value is $18$.'
        exemplars:
          - problem: 'Approximate $\int_0^2 x^2\,dx$ with a right Riemann sum using $n=4$ equal subintervals.'
            answer: '3.75'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The width is $\Delta x=\frac{2-0}{4}=0.5$ and the right endpoints are $0.5,\,1,\,1.5,\,2$. The heights are $0.25,\,1,\,2.25,\,4$, so the sum is $0.5(7.5)=3.75$.'
          - problem: 'Use a right Riemann sum with $n=4$ rectangles to estimate $\int_0^4 x\,dx$.'
            answer: '10'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The width is $\Delta x=1$ and the right endpoints are $1,\,2,\,3,\,4$. The sum is $1(1+2+3+4)=10$.'
          - problem: 'A car''s speed is read every $2$ seconds. At $t=0,\,2,\,4,\,6$ seconds the speed is $3,\,5,\,8,\,10$ metres per second. Use a right Riemann sum with three rectangles to estimate the distance travelled in the $6$ seconds.'
            answer: '46'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'Each rectangle is $2$ seconds wide and uses the speed at the end of its interval, which is $5$, $8$ and $10$. The estimate is $2(5+8+10)=2(23)=46$ metres.'
          - problem: 'Find the right Riemann sum for $\int_1^3 (2x+1)\,dx$ with $n=4$ equal subintervals.'
            answer: '11'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The width is $\Delta x=\frac{3-1}{4}=0.5$ and the right endpoints are $1.5,\,2,\,2.5,\,3$. The heights are $4,\,5,\,6,\,7$, so the sum is $0.5(22)=11$.'
          - problem: 'Water flows into a tank at a rate that is recorded every $5$ minutes. At $t=0,\,5,\,10,\,15$ minutes the rate is $12,\,9,\,7,\,4$ litres per minute. Use a right Riemann sum to estimate the volume that flows in during the $15$ minutes.'
            answer: '100'
            answer_contract: {"kind":"unit","quantity":"volume","unit":"L","allow_omitted":true}
            solution_sketch: 'Each rectangle is $5$ minutes wide and uses the rate at the end of its interval, which is $9$, $7$ and $4$. The estimate is $5(9+7+4)=5(20)=100$ litres.'
          - problem: 'Find the right Riemann sum for $\int_0^2 (x^2-x)\,dx$ with $n=4$ equal subintervals.'
            answer: '1.25'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The width is $0.5$ and the right endpoints are $0.5,\,1,\,1.5,\,2$. The heights are $-0.25,\,0,\,0.75,\,2$, so the sum is $0.5(2.5)=1.25$.'
          - problem: 'Estimate $\int_0^1 x^3\,dx$ with a right Riemann sum using $n=5$ equal subintervals.'
            answer: '0.36'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The width is $\Delta x=\frac{1-0}{5}=0.2$ and the right endpoints are $0.2,\,0.4,\,0.6,\,0.8,\,1$. The heights add up to $1.8$, so the sum is $0.2(1.8)=0.36$.'
          - problem: 'A hiker''s speed is read at the end of each half hour of a $2$-hour walk: $4,\,5,\,3,\,4$ kilometres per hour. Use a right Riemann sum to estimate the distance walked.'
            answer: '8'
            answer_contract: {"kind":"unit","quantity":"length","unit":"km","allow_omitted":true}
            solution_sketch: 'Each rectangle is $0.5$ hours wide and uses the speed read at the end of its half hour. The estimate is $0.5(4+5+3+4)=0.5(16)=8$ kilometres.'
        constraints: 'n ≤ 5 equal subintervals; sample values give terminating decimals'
      - id: kp2
        name: Left Riemann sums
        key_prerequisites: [function-notation, area-triangles-quadrilaterals]
        step_check:
          step: 'the right endpoint $3$ is not used'
          question: 'Why is the right endpoint $3$ not used in a left sum?'
          options:
            - 'Each rectangle uses its left end, and $3$ is only a right end'
            - 'The interval $[0,3]$ does not actually contain the point $x=3$ in it'
            - 'The value $f(3)$ is the largest one, so it is always left out'
            - 'A left sum uses $n-1$ points so that no width is counted twice'
          answer: 'Each rectangle uses its left end, and $3$ is only a right end'
          why: 'The three subintervals are $[0,1]$, $[1,2]$, $[2,3]$ with left ends $0$, $1$, $2$; the point $3$ is a left end of no subinterval.'
        exemplars:
          - problem: 'Approximate $\int_0^2 x^2\,dx$ with a left Riemann sum using $n=4$ equal subintervals.'
            answer: '1.75'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The width is $\Delta x=0.5$ and the left endpoints are $0,\,0.5,\,1,\,1.5$. The heights are $0,\,0.25,\,1,\,2.25$, so the sum is $0.5(3.5)=1.75$.'
          - problem: 'Use a left Riemann sum with $n=4$ rectangles to estimate $\int_0^4 x\,dx$.'
            answer: '6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The width is $\Delta x=1$ and the left endpoints are $0,\,1,\,2,\,3$. The sum is $1(0+1+2+3)=6$.'
          - problem: 'A cyclist''s speed is read every $3$ seconds. At $t=0,\,3,\,6,\,9$ seconds the speed is $4,\,6,\,5,\,7$ metres per second. Use a left Riemann sum with three rectangles to estimate the distance travelled in the $9$ seconds.'
            answer: '45'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'Each rectangle is $3$ seconds wide and uses the speed at the start of its interval, which is $4$, $6$ and $5$. The estimate is $3(4+6+5)=3(15)=45$ metres.'
          - problem: 'Find the left Riemann sum for $\int_1^4 (x+1)\,dx$ with $n=3$ equal subintervals.'
            answer: '9'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The width is $\Delta x=\frac{4-1}{3}=1$ and the left endpoints are $1,\,2,\,3$. The heights are $2,\,3,\,4$, so the sum is $1(9)=9$.'
          - problem: 'A pump''s flow rate is recorded every $10$ minutes. At $t=0,\,10,\,20,\,30$ minutes the rate is $8,\,6,\,5,\,3$ litres per minute. Use a left Riemann sum to estimate the volume pumped in the $30$ minutes.'
            answer: '190'
            answer_contract: {"kind":"unit","quantity":"volume","unit":"L","allow_omitted":true}
            solution_sketch: 'Each rectangle is $10$ minutes wide and uses the rate at the start of its interval, which is $8$, $6$ and $5$. The estimate is $10(8+6+5)=10(19)=190$ litres.'
          - problem: 'Find the left Riemann sum for $\int_0^6 (6-x)\,dx$ with $n=3$ equal subintervals.'
            answer: '24'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The width is $\Delta x=\frac{6-0}{3}=2$ and the left endpoints are $0,\,2,\,4$. The heights are $6,\,4,\,2$, so the sum is $2(12)=24$.'
          - problem: 'A runner''s speed is read every half hour. At $t=0,\,0.5,\,1,\,1.5$ hours it is $12,\,15,\,18,\,14$ kilometres per hour. Use a left Riemann sum to estimate the distance run in the first $2$ hours.'
            answer: '29.5'
            answer_contract: {"kind":"unit","quantity":"length","unit":"km","allow_omitted":true}
            solution_sketch: 'Each rectangle is $0.5$ hours wide and uses the speed at the start of its half hour. The estimate is $0.5(12+15+18+14)=0.5(59)=29.5$ kilometres.'
          - problem: 'Noor estimates $\int_0^4 x^2\,dx$ with a left Riemann sum using $n=4$. She adds $f(1)+f(2)+f(3)+f(4)$ and multiplies by $1$. What is the correct left sum?'
            answer: '14'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Noor used the right endpoints. The left endpoints are $0,\,1,\,2,\,3$, so the sum is $1(0+1+4+9)=14$.'
        constraints: 'same setups as right sums so the two can be compared'
      - id: kp3
        name: Overestimate or underestimate?
        key_prerequisites: [function-notation]
        step_check:
          step: 'so $f$ is increasing on $[0, 4]$'
          question: 'Why does it matter that $f$ is increasing?'
          options:
            - 'An increasing function always has a right sum that equals the integral exactly'
            - 'Left ends give the lowest heights and right ends give the highest heights'
            - 'An increasing function has positive values only, so no sum can be negative'
            - 'The left sum and the right sum swap names when $f$ is increasing'
          answer: 'Left ends give the lowest heights and right ends give the highest heights'
          why: 'For an increasing function the left end gives the lowest rectangle and the right end the highest, so $L_n$ is below and $R_n$ above the integral.'
        exemplars:
          - problem: 'Does the right Riemann sum for $f(x)=x^2$ on $[0,3]$ with $n=3$ overestimate or underestimate $\int_0^3 x^2\,dx$?'
            answer: 'overestimate'
            answer_contract: {"kind":"label","options":[["overestimate","over","overestimates","an overestimate","it is an overestimate","it overestimates","too large","too big"],["underestimate","under","underestimates","an underestimate","it is an underestimate","it underestimates","too small","too low"]]}
            solution_sketch: 'Because $x^2$ is increasing, the right end of each subinterval gives the tallest height. The right sum is $1(1+4+9)=14$ while the integral is $9$, so the sum is an overestimate.'
          - problem: 'Let $f(x)=4-x$ on $[0,4]$. Does the right Riemann sum with $n=4$ overestimate or underestimate $\int_0^4 f(x)\,dx$, and by how much?'
            answer: 'verdict = underestimate; error = 2'
            answer_contract: {"kind":"multipart","parts":[{"contract":{"kind":"label","options":[["overestimate","over","overestimates","an overestimate","it is an overestimate","it overestimates","too large","too big"],["underestimate","under","underestimates","an underestimate","it is an underestimate","it underestimates","too small","too low"]]},"name":"verdict"},{"contract":{"kind":"exact"},"name":"error"}]}
            solution_sketch: 'The right endpoints are $1,\,2,\,3,\,4$, so the right sum is $1(3+2+1+0)=6$. The integral is $4\cdot 4-\frac{4^2}{2}=8$. Because $4-x$ is decreasing, the right sum is an underestimate, and $8-6=2$.'
          - problem: 'Water leaves a tank at the rate $r(t)=12-2t$ litres per minute for $0\le t\le 6$. The volume drained is estimated with a left Riemann sum using $n=3$ rectangles. Does the estimate overestimate or underestimate the true volume, and by how many litres?'
            answer: 'verdict = overestimate; error = 12'
            answer_contract: {"kind":"multipart","parts":[{"contract":{"kind":"label","options":[["overestimate","over","overestimates","an overestimate","it is an overestimate","it overestimates","too large","too big"],["underestimate","under","underestimates","an underestimate","it is an underestimate","it underestimates","too small","too low"]]},"name":"verdict"},{"contract":{"kind":"exact"},"name":"error"}]}
            solution_sketch: 'The rate decreases, so the left end of each interval gives the highest height. The left sum is $2(12+8+4)=48$ litres, while the true volume is $\int_0^6 (12-2t)\,dt=36$ litres. The estimate is an overestimate, and $48-36=12$.'
          - problem: 'A car''s speed in metres per second is $v(t)=2t$ for $0\le t\le 4$. A left Riemann sum with four equal rectangles is used to estimate the distance travelled. By how many metres does the estimate differ from the exact distance?'
            answer: '4'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'The left sum is $1(0+2+4+6)=12$. The exact distance is $\int_0^4 2t\,dt=16$. The estimate is off by $16-12=4$ metres.'
          - problem: 'The function $f$ is increasing on $[1,5]$, with $f(1)=3$ and $f(5)=11$. By how much does the right sum $R_4$ exceed the left sum $L_4$?'
            answer: '8'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Here $\Delta x=\frac{5-1}{4}=1$. The two sums share every height except one: $R_4$ has $f(5)$ where $L_4$ has $f(1)$. So $R_4-L_4=1(11-3)=8$.'
          - problem: 'A tank drains at the rate $r(t)=9-t$ litres per minute for $0\le t\le 6$. A left Riemann sum with $n=3$ is used to estimate the volume drained. By how many litres does the estimate differ from the exact volume?'
            answer: '6'
            answer_contract: {"kind":"unit","quantity":"volume","unit":"L","allow_omitted":true}
            solution_sketch: 'The width is $2$ and the left endpoints are $0,\,2,\,4$, so the left sum is $2(9+7+5)=42$. The exact volume is $\int_0^6 (9-t)\,dt=36$. The estimate is off by $42-36=6$ litres.'
          - problem: 'A cyclist slows down. Her speed at $t=0,\,2,\,4$ seconds is $10,\,7,\,3$ metres per second, and between readings it only decreases. Use two rectangles to find the smallest upper bound these readings give for the distance she travelled in the $4$ seconds.'
            answer: '34'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'The speed decreases, so the left heights are the largest and the left sum is the upper bound. It is $2(10+7)=34$ metres, while the right sum is $2(7+3)=20$ metres.'
          - problem: 'For $f(x)=9-x^2$ on $[0,3]$, by how much does the right sum with $n=3$ differ from $\int_0^3 (9-x^2)\,dx$?'
            answer: '5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The right endpoints are $1,\,2,\,3$, so the right sum is $1(8+5+0)=13$. The integral is $9\cdot 3-\frac{3^3}{3}=18$. The difference is $18-13=5$.'
        constraints: 'monotonic integrands only; the direction of the error is not given in the question'
    diagnostic_exemplar:
      problem: 'Approximate $\int_0^2 2x \, dx$ with a right Riemann sum using $n = 2$.'
      answer: "6"
      solution_sketch: '$\Delta x = 1$; $f(1) + f(2) = 2 + 4 = 6$.'
    anki_seeds:
      - front: "In a Riemann sum with n equal subintervals on [a, b], Δx = ?"
        back: "(b - a)/n"
        type: basic
      - front: "For an INCREASING function, the left Riemann sum ___ and the right sum ___ the integral."
        back: "underestimates; overestimates (reversed for decreasing functions)"
        type: basic

  - id: definite-integrals-as-area
    name: Definite Integrals as Geometric Area
    core: true
    difficulty: 0.55
    drill: false
    answer_kind: numeric
    expected_time_secs: 150
    prerequisites:
      - id: left-right-riemann-sums
        weight: 0.6
        key: true
      - id: area-triangles-quadrilaterals
        weight: 0.5
        key: true
      - id: circle-area-circumference
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: Triangles, rectangles, and trapezoids
        key_prerequisites: [area-triangles-quadrilaterals, left-right-riemann-sums]
        step_check:
          step: 'it stays positive, so the region under it is a trapezoid'
          question: 'Why is the region under $f(x)=3x+1$ on $[0,4]$ a trapezoid?'
          options:
            - 'Because the line is sloped, the region must have exactly three corners'
            - 'Because the region touches the origin, it must be a right triangle'
            - 'Two vertical sides of different heights are joined by the sloped line'
            - 'Because the integral of a line is always a quadrilateral with equal sides'
          answer: 'Two vertical sides of different heights are joined by the sloped line'
          why: 'The sides at $x=0$ and $x=4$ are vertical and parallel with heights $1$ and $13$, the $x$-axis is the base, and the line is the slanted top, which is a trapezoid.'
        try_first:
          problem: 'The graph of $y=3$ from $x=1$ to $x=5$ and the $x$-axis bound a rectangle. What is the area of the rectangle?'
          answer_contract: {"kind":"exact"}
          answer: '12'
          reveal: 'The width is $5-1=4$ and the height is $3$, so the area is $12$. This area is the value of $\int_1^5 3\,dx$: an integral of a non-negative function is the area under its graph.'
        exemplars:
          - problem: 'Evaluate $\int_0^4 x\,dx$ by interpreting it as an area.'
            answer: '8'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The region under $y=x$ from $0$ to $4$ is a triangle with base $4$ and height $4$. Its area is $\frac{1}{2}\cdot 4\cdot 4=8$.'
          - problem: 'Evaluate $\int_0^3 (2x+1)\,dx$ by finding the area of a trapezoid.'
            answer: '12'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The parallel sides are $f(0)=1$ and $f(3)=7$, and the width is $3$. The area is $\frac{1+7}{2}\cdot 3=12$.'
          - problem: 'Water flows into a tank at the rate $r(t)=2t+4$ litres per minute during the first $3$ minutes. The volume that enters is the area under the graph of $r$. How many litres enter the tank?'
            answer: '21'
            answer_contract: {"kind":"unit","quantity":"volume","unit":"L","allow_omitted":true}
            solution_sketch: 'The region under the line is a trapezoid with parallel sides $r(0)=4$ and $r(3)=10$ and width $3$. Its area is $\frac{4+10}{2}\cdot 3=21$ litres.'
          - problem: 'Evaluate $\int_1^6 3\,dx$ by interpreting it as the area of a rectangle.'
            answer: '15'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The integrand is the constant $3$, so the region is a rectangle of height $3$ and width $6-1=5$. Its area is $3\cdot 5=15$.'
          - problem: 'Evaluate $\int_3^7 (2x-6)\,dx$ by interpreting it as the area of a triangle.'
            answer: '16'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The line $y=2x-6$ is $0$ at $x=3$ and $8$ at $x=7$. The region is a triangle with base $7-3=4$ and height $8$, so its area is $\frac{1}{2}\cdot 4\cdot 8=16$.'
          - problem: 'A cyclist accelerates so that her speed is $v(t)=2t$ metres per second during the first $6$ seconds. The distance covered is the area under the graph of $v$. How far does she travel?'
            answer: '36'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'The region under $v(t)=2t$ is a triangle with base $6$ and height $v(6)=12$. Its area is $\frac{1}{2}\cdot 6\cdot 12=36$ metres.'
          - problem: 'Evaluate $\int_0^6 x\,dx$ by interpreting it as the area under a line.'
            answer: '18'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The line $y=x$ from $x=0$ to $x=6$ bounds a right triangle with base $6$ and height $6$. Its area is $\frac{1}{2}\cdot 6\cdot 6=18$.'
          - problem: 'The area under the line $y=2x$ between $x=0$ and $x=b$, where $b>0$, equals $25$. That is, $\int_0^b 2x\,dx=25$. Find $b$.'
            answer: '5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The region is a triangle with base $b$ and height $2b$, so its area is $\frac{1}{2}\cdot b\cdot 2b=b^2$. Setting $b^2=25$ with $b>0$ gives $b=5$.'
        constraints: 'linear integrands; the region is a triangle, rectangle, or trapezoid; exact answers'
      - id: kp2
        name: Circular regions
        key_prerequisites: [circle-area-circumference, area-triangles-quadrilaterals]
        step_check:
          step: 'the interval from $-4$ to $4$ spans the full width of the circle, so the region is the entire upper semicircle'
          question: 'Why is the region a semicircle and not a full circle?'
          options:
            - 'Because $y=\sqrt{16-x^2}$ is never negative, only the top half is traced'
            - 'Because the limits $-4$ and $4$ are only half as wide as the whole circle'
            - 'Because the integral of a circle always counts only half of its area'
            - 'Because the radius $4$ is halved when it is put under the square root'
          answer: 'Because $y=\sqrt{16-x^2}$ is never negative, only the top half is traced'
          why: 'The square root is never negative, so the curve is only the upper half of $x^2+y^2=16$; the lower half would need $y=-\sqrt{16-x^2}$.'
        exemplars:
          - problem: 'Evaluate $\int_{-2}^{2} \sqrt{4-x^2}\,dx$ by recognizing the region.'
            answer: '2pi'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The graph of $y=\sqrt{4-x^2}$ is the upper half of the circle of radius $2$. The area of a semicircle is $\frac{1}{2}\pi r^2=\frac{1}{2}\pi(4)=2\pi$.'
          - problem: 'Evaluate $\int_0^3 \sqrt{9-x^2}\,dx$ by recognizing the region.'
            answer: '9pi/4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The graph of $y=\sqrt{9-x^2}$ from $0$ to $3$ is a quarter of a circle of radius $3$. Its area is $\frac{1}{4}\pi r^2=\frac{9\pi}{4}$.'
          - problem: 'The graph of $y=\sqrt{16-x^2}$ and the $x$-axis bound a region. Find the area of this region.'
            answer: '8pi'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The curve is the upper half of the circle of radius $4$, and it meets the $x$-axis at $x=-4$ and $x=4$. The region is a semicircle with area $\frac{1}{2}\pi(16)=8\pi$.'
          - problem: 'A window has the shape of the region between the $x$-axis and the curve $y=\sqrt{25-x^2}$, where $x$ and $y$ are in metres. Find the area of the window in square metres.'
            answer: '25pi/2'
            answer_contract: {"kind":"unit","quantity":"area","unit":"m^2","allow_omitted":true}
            solution_sketch: 'The curve is the upper half of the circle of radius $5$, so the window is a semicircle. Its area is $\frac{1}{2}\pi(25)=\frac{25\pi}{2}$ square metres.'
          - problem: 'Evaluate $\int_0^5 \sqrt{25-x^2}\,dx$ by recognizing the region.'
            answer: '25pi/4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The graph of $y=\sqrt{25-x^2}$ from $0$ to $5$ is the quarter of the circle of radius $5$ in the first quadrant. Its area is $\frac{1}{4}\pi(25)=\frac{25\pi}{4}$.'
          - problem: 'A garden bed is a quarter of a circle of radius $6$ metres, modelled by $y=\sqrt{36-x^2}$ for $0\le x\le 6$, with $x$ and $y$ in metres. Find the area of the bed in square metres.'
            answer: '9pi'
            answer_contract: {"kind":"unit","quantity":"area","unit":"m^2","allow_omitted":true}
            solution_sketch: 'The curve $y=\sqrt{36-x^2}$ from $0$ to $6$ is a quarter of the circle of radius $6$. Its area is $\frac{1}{4}\pi(36)=9\pi$ square metres.'
          - problem: 'The integral of $\sqrt{r^2-x^2}$ from $-r$ to $r$, where $r>0$, equals $18\pi$. Find $r$.'
            answer: '6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The integral is the area of a semicircle of radius $r$, which is $\frac{1}{2}\pi r^2$. Setting $\frac{1}{2}\pi r^2=18\pi$ gives $r^2=36$, so $r=6$.'
          - problem: 'Evaluate $\int_{-1}^{1} \sqrt{1-x^2}\,dx$ by recognizing the region.'
            answer: 'pi/2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The graph of $y=\sqrt{1-x^2}$ is the upper half of the circle of radius $1$. Its area is $\frac{1}{2}\pi(1)=\frac{\pi}{2}$.'
        constraints: 'semicircles or quarter circles of integer radius; answers as exact multiples of π'
      - id: kp3
        name: Signed area
        key_prerequisites: [area-triangles-quadrilaterals, left-right-riemann-sums]
        step_check:
          step: 'Since it sits below the axis, it contributes $-2$'
          question: 'Why does the triangle on $[0,2]$ contribute $-2$ and not $+2$?'
          options:
            - 'Area is negative whenever the base of a triangle lies to the left of the crossing'
            - 'A triangle with a rising slope always contributes a negative amount'
            - 'The triangle on $[0,2]$ is the smaller one, so it is subtracted from the larger one'
            - 'The graph lies below the $x$-axis there, so its area counts as negative'
          answer: 'The graph lies below the $x$-axis there, so its area counts as negative'
          why: 'The integral adds heights $f(x)$, which are negative where the graph is below the axis, so a region below the axis contributes the negative of its geometric area.'
        exemplars:
          - problem: 'Evaluate $\int_0^2 (x-2)\,dx$ by interpreting it as a signed area.'
            answer: '-2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The line $y=x-2$ lies below the axis on $[0,2]$ and forms a triangle with base $2$ and height $2$. Its area is $2$, and it counts as negative, so the integral is $-2$.'
          - problem: 'Evaluate $\int_0^4 (x-2)\,dx$ by interpreting it as a signed area.'
            answer: '0'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The triangle below the axis on $[0,2]$ has area $2$ and the triangle above the axis on $[2,4]$ has area $2$. They cancel, so the integral is $0$.'
          - problem: 'A particle moves along a line with velocity $v(t)=2t-8$ metres per second for $0\le t\le 6$. Find its displacement, which is the signed area under the graph of $v$.'
            answer: '-12'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'The velocity is $0$ at $t=4$. On $[0,4]$ it is below the axis and forms a triangle with base $4$ and height $8$, so the signed area is $-16$. On $[4,6]$ the triangle has base $2$ and height $4$, so the area is $4$. The displacement is $-16+4=-12$ metres.'
          - problem: 'Evaluate $\int_{-2}^{2} (x+1)\,dx$ by interpreting it as a signed area.'
            answer: '4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The line $y=x+1$ crosses the axis at $x=-1$. On $[-2,-1]$ it forms a triangle of area $\frac{1}{2}$ below the axis, and on $[-1,2]$ a triangle of area $\frac{9}{2}$ above it. The total is $-\frac{1}{2}+\frac{9}{2}=4$.'
          - problem: 'Evaluate $\int_{-3}^{1} |x|\,dx$ by interpreting it as an area.'
            answer: '5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The graph of $y=|x|$ never goes below the axis. On $[-3,0]$ it forms a triangle with base $3$ and height $3$, with area $\frac{9}{2}$. On $[0,1]$ the triangle has area $\frac{1}{2}$. The total is $\frac{9}{2}+\frac{1}{2}=5$.'
          - problem: 'A particle moves along a line with velocity $v(t)=2t-8$ metres per second for $0\le t\le 6$. Find the total distance it travels.'
            answer: '20'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'The velocity is $0$ at $t=4$, so the particle changes direction there. The two triangles have areas $16$ and $4$. Total distance counts both as positive, so it is $16+4=20$ metres.'
          - problem: 'Evaluate $\int_{-1}^{3} (3-x)\,dx$ by interpreting it as a signed area.'
            answer: '8'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The line $y=3-x$ is at height $4$ when $x=-1$ and at height $0$ when $x=3$, and it never goes below the axis. The region is a triangle with base $4$ and height $4$, so its area is $\frac{1}{2}\cdot 4\cdot 4=8$.'
          - problem: 'Evaluate $\int_{-3}^{3} \left(-\sqrt{9-x^2}\right)dx$ by interpreting it as a signed area.'
            answer: '-9pi/2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The graph of $y=-\sqrt{9-x^2}$ is the lower half of the circle of radius $3$, which lies below the axis. Its area is $\frac{1}{2}\pi(9)=\frac{9\pi}{2}$, and it counts as negative, so the integral is $-\frac{9\pi}{2}$.'
          - problem: 'Evaluate $\int_0^3 (-2)\,dx$.'
            answer: '-6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The region is a rectangle of width $3$ and height $2$ below the axis. Its signed area is $-2\cdot 3=-6$.'
        constraints: 'regions split cleanly at axis crossings; exact answers'
    diagnostic_exemplar:
      problem: 'Evaluate $\int_{-2}^{2} \left(\sqrt{4 - x^2} - 2\right) dx$ by interpreting it as area.'
      answer: '2π - 8'
      solution_sketch: '$\int_{-2}^{2}\sqrt{4-x^2}\,dx$ is the upper half of the circle of radius $2$, area $2\pi$; $\int_{-2}^{2}(-2)\,dx$ is a rectangle below the axis, $-8$.'
    anki_seeds:
      - front: "The definite integral of f from a to b measures..."
        back: "signed area between the graph and the x-axis (area below the axis counts negative)"
        type: basic
      - front: "∫ √(r² - x²) dx from -r to r = ? (by geometry)"
        back: "πr²/2 — the upper semicircle of radius r"
        type: basic

  - id: riemann-sums-definite-integral
    name: Riemann Sums and the Definite Integral
    core: true
    difficulty: 0.6
    drill: false
    answer_kind: numeric
    expected_time_secs: 180
    prerequisites:
      - id: left-right-riemann-sums
        weight: 0.7
        key: true
      - id: definite-integrals-as-area
        weight: 0.7
        key: true
      - id: limits-graphical-numerical
        weight: 0.4
      - id: even-odd-functions
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: 'The definite integral as a limit of Riemann sums'
        key_prerequisites: [left-right-riemann-sums, definite-integrals-as-area, limits-graphical-numerical]
        constraints: 'conceptual limit questions anchored to a computable geometric area; data in the text, some in motion contexts'
        step_check:
          step: 'the graph of $f(x)=x$ together with the $x$-axis bounds a right triangle with base $6$ and height $f(6)=6$'
          question: 'Why can the limit of the right sums be found from a triangle?'
          options:
            - 'Each right sum equals the triangle area exactly, so the sums never change'
            - 'The sums approach the area under the graph, and that region is a triangle'
            - 'The triangle gives only an upper bound, because right sums always overshoot'
          answer: 'The sums approach the area under the graph, and that region is a triangle'
          why: 'As $n$ grows the rectangles fit the region better, so the sums approach the area of the region under $y = x$. For this graph that region is a triangle with area $18$.'
        try_first:
          problem: 'For $\int_0^3 2\,dx$, every right Riemann sum adds the areas of rectangles of height $2$ whose widths total $3$. What value do the sums approach as $n \to \infty$?'
          answer_contract: {"kind":"exact"}
          answer: '6'
          reveal: 'Here every sum already equals the rectangle area, $6$. For a slanted or curved graph the sums only approach the area, and that limit is what the definite integral means.'
        exemplars:
          - problem: 'For $\int_0^4 x\,dx$, the right Riemann sums are $10$ for $n = 4$ and $9$ for $n = 8$. What value do the sums approach as $n \to \infty$?'
            answer: '8'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The right sums $10$ and $9$ fall toward the area under $y = x$ from $0$ to $4$. That region is a triangle with base $4$ and height $4$, so the limit is $\frac{1}{2} \cdot 4 \cdot 4 = 8$.'
          - problem: 'For $\int_0^4 \frac{x}{2}\,dx$, the right Riemann sums are $5$ for $n = 4$ and $4.5$ for $n = 8$. What value do the sums approach as $n \to \infty$?'
            answer: '4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The region under $y = x/2$ from $x = 0$ to $x = 4$ is a triangle with base $4$ and height $2$. The sums approach its area, $\frac{1}{2} \cdot 4 \cdot 2 = 4$.'
          - problem: 'For $\int_0^6 \left(2 - \frac{x}{3}\right)dx$, the right Riemann sums are $4$ for $n = 3$ and $5$ for $n = 6$. What value do the sums approach as $n \to \infty$?'
            answer: '6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The graph of $y = 2 - x/3$ from $x = 0$ to $x = 6$ bounds a triangle with base $6$ and height $2$. The sums approach its area, $\frac{1}{2} \cdot 6 \cdot 2 = 6$.'
          - problem: 'What value do the right Riemann sums for $\int_{-2}^{2} \sqrt{4 - x^2}\,dx$ approach as $n \to \infty$?'
            answer: '2pi'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The graph of $y = \sqrt{4 - x^2}$ is the upper half of the circle of radius $2$. The sums approach the area of this half disc, $\frac{1}{2}\pi \cdot 2^2 = 2\pi$.'
          - problem: 'For $\int_0^4 (x - 3)\,dx$, the right Riemann sums are $-2$ for $n = 4$ and $-3$ for $n = 8$. What value do the sums approach as $n \to \infty$?'
            answer: '-4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The graph of $y = x - 3$ lies below the $x$-axis on $[0, 3]$ and above it on $[3, 4]$. The signed area is $-\frac{1}{2}(3)(3) + \frac{1}{2}(1)(1) = -4.5 + 0.5 = -4$.'
          - problem: 'The right Riemann sums for $\int_0^k x\,dx$ approach $18$ as $n \to \infty$, where $k > 0$. Find $k$.'
            answer: '6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The sums approach the area under $y = x$ from $0$ to $k$, a triangle with base $k$ and height $k$. Its area is $k^2/2$, so $k^2/2 = 18$ gives $k^2 = 36$ and $k = 6$.'
          - problem: 'A car moves with velocity $v(t) = 3t$ metres per second for $0 \le t \le 4$. The Riemann sums of $v$ over $[0, 4]$ approach the distance travelled as $n \to \infty$. How far does the car travel?'
            answer: '24'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'The distance is the limit of the Riemann sums of velocity, which is the area under the velocity graph. The graph of $v(t) = 3t$ from $t = 0$ to $t = 4$ is a triangle with base $4$ and height $12$, so the distance is $\frac{1}{2} \cdot 4 \cdot 12 = 24$ metres.'
          - problem: 'A train''s speed is $v(t) = 2t$ metres per second for $0 \le t \le T$. The Riemann sums of $v$ over $[0, T]$ approach $225$ metres as $n \to \infty$. How many seconds does the journey last?'
            answer: '15'
            answer_contract: {"kind":"unit","quantity":"time","unit":"s","allow_omitted":true}
            solution_sketch: 'The limit of the sums is the distance, which is the area under $v(t) = 2t$ from $0$ to $T$. That triangle has base $T$ and height $2T$, so its area is $T^2$. Solving $T^2 = 225$ gives $T = 15$ seconds.'
      - id: kp2
        name: 'Additivity, reversal, and linearity'
        key_prerequisites: [definite-integrals-as-area]
        constraints: 'additivity, reversal of limits, constant multiples and sums; integer data; also money and volume contexts'
        step_check:
          step: 'Reversal: our target has limits $9$ to $0$, the reverse of $0$ to $9$, so it flips the sign'
          question: 'Why does reversing the limits change the sign of the integral?'
          options:
            - 'Swapping the limits replaces the function $f$ by the function $-f$ on the interval'
            - 'An integral is defined only with the larger limit on top, so swapping adds a minus sign'
            - 'Running from $9$ down to $0$ makes each width $\Delta x$ negative, so every term flips'
          answer: 'Running from $9$ down to $0$ makes each width $\Delta x$ negative, so every term flips'
          why: 'Each width is $\Delta x = (0 - 9)/n$ when we run from $9$ to $0$, so every term of the Riemann sum changes sign. The sign of the whole integral changes with it.'
        exemplars:
          - problem: 'Given $\int_0^5 f(x)\,dx = 7$ and $\int_5^8 f(x)\,dx = 3$, find $\int_0^8 f(x)\,dx$.'
            answer: '10'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Additivity joins the two pieces that meet at $5$, so $\int_0^8 f = \int_0^5 f + \int_5^8 f$. The value is $7 + 3 = 10$.'
          - problem: 'Given $\int_1^4 f(x)\,dx = 6$, find $\int_4^1 f(x)\,dx$.'
            answer: '-6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Swapping the limits of integration flips the sign of the integral. So $\int_4^1 f = -\int_1^4 f = -6$.'
          - problem: 'Given $\int_1^4 f(x)\,dx = 6$ and $\int_1^4 g(x)\,dx = 2$, find $\int_1^4 \big(3f(x) - g(x)\big)\,dx$.'
            answer: '16'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Linearity lets us pull out constants and split the difference: $3\int_1^4 f - \int_1^4 g$. The value is $3 \cdot 6 - 2 = 16$.'
          - problem: 'Given $\int_0^6 f(x)\,dx = 11$ and $\int_0^2 f(x)\,dx = 4$, find $\int_2^6 f(x)\,dx$.'
            answer: '7'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Additivity splits the integral over $[0, 6]$ at $2$: $\int_0^6 f = \int_0^2 f + \int_2^6 f$. So $11 = 4 + \int_2^6 f$, and $\int_2^6 f = 7$.'
          - problem: 'Given $\int_2^5 4f(x)\,dx = 20$, find $\int_5^2 f(x)\,dx$.'
            answer: '-5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Linearity pulls out the factor $4$, so $\int_2^5 f = 20/4 = 5$. Reversing the limits flips the sign, so $\int_5^2 f = -5$.'
          - problem: 'Given $\int_3^7 f(x)\,dx = 5$, find $\int_7^3 \big(2f(x) + 1\big)\,dx$.'
            answer: '-14'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Reversal gives $\int_7^3 f = -5$. Linearity splits the integral into $2\int_7^3 f + \int_7^3 1\,dx$, and the second piece is $3 - 7 = -4$. The total is $2(-5) - 4 = -14$.'
          - problem: 'Given $\int_1^5 f(x)\,dx = 8$ and $\int_1^5 g(x)\,dx = -2$, find $\int_5^1 \big(f(x) - 4g(x)\big)\,dx$.'
            answer: '-16'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'First find the integral from $1$ to $5$: by linearity it is $8 - 4(-2) = 16$. Reversing the limits flips the sign, so $\int_5^1 (f - 4g) = -16$.'
          - problem: 'A tank gains water at rate $r(t)$ litres per minute. In the first $6$ minutes the net change $\int_0^6 r(t)\,dt$ is $45$ litres, and in the first $2$ minutes $\int_0^2 r(t)\,dt$ is $15$ litres. Find the net change in litres from $t = 2$ to $t = 6$.'
            answer: '30'
            answer_contract: {"kind":"unit","quantity":"volume","unit":"L","allow_omitted":true}
            solution_sketch: 'The first $6$ minutes split at $t = 2$, so $\int_0^6 r = \int_0^2 r + \int_2^6 r$. Then $45 = 15 + \int_2^6 r$, so the tank gains $30$ litres between $t = 2$ and $t = 6$.'
          - problem: 'A shop earns income at rate $p(t)$ dollars per hour and pays costs at rate $c(t)$ dollars per hour. Over the first $8$ hours, $\int_0^8 p(t)\,dt = 640$ and $\int_0^8 c(t)\,dt = 410$. Find the net profit over these $8$ hours.'
            answer: '230'
            answer_contract: {"kind":"unit","quantity":"dollar","unit":"dollar","allow_omitted":true}
            solution_sketch: 'Net profit is income minus costs, which is the integral of $p(t) - c(t)$ over $[0, 8]$. By linearity this is $640 - 410 = 230$ dollars.'
          - problem: 'Sam knows that $\int_2^6 f(x)\,dx = 9$ and writes $\int_6^2 \big(f(x) + 1\big)\,dx = -9 + 1 = -8$. What is the correct value?'
            answer: '-13'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Reversal flips the sign of the whole integral, including the constant part. So $\int_6^2 (f + 1) = -\left(9 + \int_2^6 1\,dx\right) = -(9 + 4) = -13$.'
      - id: kp3
        name: 'Comparison, bounds, and symmetry'
        key_prerequisites: [definite-integrals-as-area, left-right-riemann-sums]
        constraints: 'max-min bounds with integer data, one bound per question; odd and even symmetry on symmetric intervals; motion and flow contexts'
        step_check:
          step: 'the integral lies between the two rectangle areas'
          question: 'Why does the integral lie between the areas of the two rectangles?'
          options:
            - 'Since $f$ stays between $3$ and $7$, the area under $f$ stays between the two rectangle areas'
            - 'The two rectangle areas are the left and right sums of $f$, and the integral lies between them'
            - 'The integral is the average of the two rectangle areas, so it lies halfway between them'
          answer: 'Since $f$ stays between $3$ and $7$, the area under $f$ stays between the two rectangle areas'
          why: 'Over the base $[2, 6]$ the graph of $f$ is never lower than the height $3$ and never higher than $7$. So the area under it is at least $3 \cdot 4$ and at most $7 \cdot 4$.'
        exemplars:
          - problem: 'Evaluate $\int_{-3}^{3} x^3\,dx$ using symmetry.'
            answer: '0'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The function $x^3$ is odd, so its graph on $[-3, 0]$ is the mirror image through the origin of its graph on $[0, 3]$. The signed areas cancel, so the integral is 0.'
          - problem: 'Suppose $2 \le f(x) \le 6$ for every $x$ in $[1, 4]$. What is the smallest value that $\int_1^4 f(x)\,dx$ can have?'
            answer: '6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The graph of $f$ lies on or above the line $y = 2$ over a base of width $4 - 1 = 3$. So the integral is at least $2 \cdot 3 = 6$.'
          - problem: 'A function $f$ is odd, and $\int_0^6 f(x)\,dx = 10$. Find $\int_{-6}^{0} f(x)\,dx$.'
            answer: '-10'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'For an odd function, the area on $[-6, 0]$ mirrors the area on $[0, 6]$ with the opposite sign. So $\int_{-6}^{0} f = -\int_0^6 f = -10$.'
          - problem: 'On the interval $[1, 6]$, a function $f$ satisfies $2 \le f(x) \le 8$. What is the greatest value that $\int_1^6 f(x)\,dx$ can have?'
            answer: '40'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The graph of $f$ lies on or below the line $y = 8$ over a base of width $6 - 1 = 5$. So the integral is at most $8 \cdot 5 = 40$.'
          - problem: 'A function $f$ is even, and $\int_{-2}^{2} f(x)\,dx = 18$. Find $\int_0^2 f(x)\,dx$.'
            answer: '9'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'For an even function the two halves $[-2, 0]$ and $[0, 2]$ have equal areas. So the whole integral is twice the right half, and $\int_0^2 f = 18/2 = 9$.'
          - problem: 'Every value of $f$ on $[2, 9]$ lies between $3$ and $7$. Find the smallest possible value of $\int_2^9 f(x)\,dx$.'
            answer: '21'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The graph of $f$ lies on or above the line $y = 3$ over a base of width $9 - 2 = 7$. So the smallest possible value is $3 \cdot 7 = 21$.'
          - problem: 'A cyclist''s speed $v(t)$ stays between $4$ and $7$ metres per second for $0 \le t \le 12$. What is the least distance she could have covered?'
            answer: '48'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'The distance is $\int_0^{12} v(t)\,dt$. Since $v(t) \ge 4$ over $12$ seconds, the distance is at least $4 \cdot 12 = 48$ metres.'
          - problem: 'The inflow rate $r(t)$ of a tank stays between $3$ and $5$ litres per minute during the first $20$ minutes. What is the greatest amount of water that could have entered the tank?'
            answer: '100'
            answer_contract: {"kind":"unit","quantity":"volume","unit":"L","allow_omitted":true}
            solution_sketch: 'The water that enters is $\int_0^{20} r(t)\,dt$. Since $r(t) \le 5$ over $20$ minutes, at most $5 \cdot 20 = 100$ litres enter.'
          - problem: 'Evaluate $\int_{-4}^{4} (x^3 - 5x + 2)\,dx$ using symmetry.'
            answer: '16'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The terms $x^3$ and $-5x$ are odd, so their integrals over $[-4, 4]$ are 0. Only $\int_{-4}^{4} 2\,dx = 2 \cdot 8 = 16$ remains.'
          - problem: 'Sam says that if $f$ is even and $\int_0^5 f(x)\,dx = 6$, then $\int_{-5}^{0} f(x)\,dx = -6$. What is the correct value of $\int_{-5}^{0} f(x)\,dx$?'
            answer: '6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'For an even function the graph on $[-5, 0]$ is the mirror image of the graph on $[0, 5]$ across the $y$-axis. The two areas are equal, so $\int_{-5}^{0} f = 6$. The minus sign belongs to odd functions.'
    diagnostic_exemplar:
      problem: 'Evaluate $\int_{-2}^{2} (x^3 + 3)\,dx$ using symmetry and linearity.'
      answer: '12'
      solution_sketch: '$x^3$ is odd and the interval is symmetric, so $\int_{-2}^{2}x^3\,dx = 0$; $\int_{-2}^{2}3\,dx = 12$.'
    anki_seeds:
      - front: "Swapping the limits of integration does what to the integral's value?"
        back: "flips its sign: ∫_b^a f = -∫_a^b f"
        type: basic
      - front: "If m ≤ f(x) ≤ M on [a, b], then ∫_a^b f(x) dx is between..."
        back: "m(b - a) and M(b - a)"
        type: basic
      - front: "For an odd function f, ∫_{-a}^{a} f(x) dx = ?"
        back: "0 — the signed areas cancel by symmetry"
        type: basic

  - id: midpoint-trapezoid-sums
    name: Midpoint and Trapezoid Sums
    core: false                # numerical rules; feed only the estimation topic
    difficulty: 0.6
    drill: false
    answer_kind: numeric
    expected_time_secs: 180
    prerequisites:
      - id: left-right-riemann-sums
        weight: 0.8
        key: true
      - id: riemann-sums-definite-integral
        weight: 0.4
      - id: concavity-inflection-points
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: 'Midpoint sums'
        key_prerequisites: [left-right-riemann-sums]
        constraints: 'n at most 4 and midpoint values terminate; also contexts (distance, area) and listing the midpoints'
        step_check:
          step: 'Take the midpoint of each subinterval'
          question: 'Why do we evaluate $f$ at the midpoint of each subinterval instead of at an endpoint?'
          options:
            - 'The midpoint height equals the exact average height of $f$ on the subinterval, for every function'
            - 'A midpoint rectangle is narrower than an endpoint rectangle, so the sum always has less error'
            - 'The rectangle sits above the curve on one side and below it on the other, so errors partly cancel'
          answer: 'The rectangle sits above the curve on one side and below it on the other, so errors partly cancel'
          why: 'At the midpoint the rectangle crosses the curve, so part of its area is too high and part is too low. These errors partly cancel, so a midpoint sum is usually more accurate than a left or right sum.'
        exemplars:
          - problem: 'Approximate $\int_0^2 x^2\,dx$ with a midpoint sum using $n = 2$.'
            answer: '2.5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Each subinterval has width $\Delta x = 1$, and the midpoints are $0.5$ and $1.5$. The sum is $1 \cdot (0.25 + 2.25) = 2.5$.'
          - problem: 'Approximate $\int_0^2 x^2\,dx$ with a midpoint sum using $n = 4$.'
            answer: '2.625'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Here $\Delta x = 0.5$ and the midpoints are $0.25, 0.75, 1.25, 1.75$. The sum is $0.5(0.0625 + 0.5625 + 1.5625 + 3.0625) = 0.5 \cdot 5.25 = 2.625$.'
          - problem: 'Approximate $\int_0^2 (x^2 + 1)\,dx$ with a midpoint sum using $n = 2$.'
            answer: '9/2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The width is $\Delta x = 1$ and the midpoints are $0.5$ and $1.5$, where $f(0.5) = 1.25$ and $f(1.5) = 3.25$. The sum is $1 \cdot (1.25 + 3.25) = 4.5 = 9/2$.'
          - problem: 'Approximate $\int_0^1 (x^3 + x)\,dx$ with a midpoint sum using $n = 2$.'
            answer: '23/32'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The width is $\Delta x = 0.5$ and the midpoints are $0.25$ and $0.75$. The heights are $0.265625$ and $1.171875$, so the sum is $0.5 \cdot 1.4375 = 0.71875 = 23/32$.'
          - problem: 'Approximate $\int_0^2 (x^2 + 1)\,dx$ with a midpoint sum using $n = 4$.'
            answer: '37/8'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The width is $\Delta x = 0.5$ and the midpoints are $0.25, 0.75, 1.25, 1.75$. The heights $1.0625, 1.5625, 2.5625, 4.0625$ add to $9.25$, so the sum is $0.5 \cdot 9.25 = 4.625 = 37/8$.'
          - problem: 'Approximate $\int_0^3 (2x + 1)\,dx$ with a midpoint sum using $n = 3$.'
            answer: '12'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The width is $\Delta x = 1$ and the midpoints are $0.5, 1.5, 2.5$, where the heights are $2, 4, 6$. The sum is $1 \cdot (2 + 4 + 6) = 12$.'
          - problem: 'A runner''s speed is $v(t) = 4t - t^2$ metres per second for $0 \le t \le 4$. Use a midpoint sum with $n = 4$ to estimate the distance she runs.'
            answer: '11'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'The width is $\Delta t = 1$ and the midpoints are $0.5, 1.5, 2.5, 3.5$. The speeds there are $1.75, 3.75, 3.75, 1.75$, which add to $11$, so the distance is about $11$ metres.'
          - problem: 'A pond is $6$ metres long. At distance $x$ metres from one end its width is $w(x) = x(6 - x)$ metres. Use a midpoint sum with $n = 3$ to estimate the area of the pond.'
            answer: '38'
            answer_contract: {"kind":"unit","quantity":"area","unit":"m^2","allow_omitted":true}
            solution_sketch: 'Each strip is $\Delta x = 2$ metres long, and the midpoints are $1, 3, 5$. The widths there are $5, 9, 5$, so the area is about $2 \cdot 19 = 38$ square metres.'
          - problem: 'A midpoint sum with $n = 3$ is used for $\int_2^8 f(x)\,dx$. At which values of $x$ is $f$ evaluated?'
            answer: '3, 5, 7'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Each subinterval has width $(8 - 2)/3 = 2$, so the subintervals are $[2, 4]$, $[4, 6]$ and $[6, 8]$. Their midpoints are $3$, $5$ and $7$.'
          - problem: 'Sam finds the midpoint sum of $\int_0^6 x\,dx$ with $n = 3$ by adding $f(1) + f(3) + f(5) = 9$. What is the correct midpoint sum?'
            answer: '18'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The midpoint heights are right, but each one must be multiplied by the width $\Delta x = (6 - 0)/3 = 2$. The midpoint sum is $2 \cdot 9 = 18$.'
      - id: kp2
        name: 'Trapezoid sums'
        key_prerequisites: [left-right-riemann-sums]
        constraints: 'trapezoid = average of left and right sums; terminating decimals; tables and measured contexts'
        step_check:
          step: 'Check by averaging the two Riemann sums'
          question: 'Why does the average of the left and right sums equal the trapezoid sum?'
          options:
            - 'On each subinterval the trapezoid area is the average of the left and right rectangles'
            - 'The left sum is always too low and the right sum always too high, so their average is exact'
            - 'Averaging two sums with the same $n$ always gives the integral, for any function'
          answer: 'On each subinterval the trapezoid area is the average of the left and right rectangles'
          why: 'A trapezoid with parallel sides $f(x_{i-1})$ and $f(x_i)$ has area $\Delta x \cdot \frac{f(x_{i-1}) + f(x_i)}{2}$, which is the average of the left rectangle and the right rectangle. Adding over all subintervals gives $\frac{L + R}{2}$.'
        exemplars:
          - problem: 'Approximate $\int_0^2 x^2\,dx$ with the trapezoid rule using $n = 4$.'
            answer: '2.75'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Here $\Delta x = 0.5$ and the heights are $0, 0.25, 1, 2.25, 4$. The sum is $\frac{0.5}{2}(0 + 0.5 + 2 + 4.5 + 4) = 0.25 \cdot 11 = 2.75$.'
          - problem: 'The left and right Riemann sums for $\int_1^3 (2x + 1)\,dx$ with $n = 4$ are $9$ and $11$. What is the trapezoid estimate with $n = 4$?'
            answer: '10'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The trapezoid estimate is the average of the left and right sums. So it is $\frac{9 + 11}{2} = 10$.'
          - problem: 'Approximate $\int_0^2 x^3\,dx$ with the trapezoid rule using $n = 4$.'
            answer: '4.25'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Here $\Delta x = 0.5$ and the heights are $0, 0.125, 1, 3.375, 8$. The sum is $0.25(0 + 0.25 + 2 + 6.75 + 8) = 0.25 \cdot 17 = 4.25$.'
          - problem: 'A table gives $f(0) = 2$, $f(1) = 5$, $f(2) = 4$, $f(3) = 7$, $f(4) = 3$. Approximate $\int_0^4 f(x)\,dx$ with the trapezoid rule using $n = 4$.'
            answer: '18.5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The width is $\Delta x = 1$, so the sum is $\frac{1}{2}\big(2 + 2 \cdot 5 + 2 \cdot 4 + 2 \cdot 7 + 3\big)$. That equals $\frac{1}{2} \cdot 37 = 18.5$.'
          - problem: 'For a function $f$ on $[0, 2]$, the trapezoid estimate with $n = 4$ is $7.25$. Also $f(0) = 1$ and $f(2) = 5$. Find $f(0.5) + f(1) + f(1.5)$.'
            answer: '11.5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'With $\Delta x = 0.5$ the estimate is $0.25\big[f(0) + 2S + f(2)\big]$, where $S$ is the sum we want. So $7.25 = 0.25(6 + 2S)$, which gives $6 + 2S = 29$ and $S = 11.5$.'
          - problem: 'The depth of a river, in metres, is measured at distances $0, 2, 4, 6, 8$ metres from the bank. The depths are $0, 1.5, 2.5, 2, 0$. Use the trapezoid rule to estimate the area of the river cross-section.'
            answer: '12'
            answer_contract: {"kind":"unit","quantity":"area","unit":"m^2","allow_omitted":true}
            solution_sketch: 'The width of each trapezoid is $2$ metres, so the estimate is $\frac{2}{2}\big(0 + 2 \cdot 1.5 + 2 \cdot 2.5 + 2 \cdot 2 + 0\big)$. That equals $3 + 5 + 4 = 12$ square metres.'
          - problem: 'A car''s speed in metres per second is recorded every $10$ seconds for $40$ seconds, giving $0, 6, 11, 15, 16$. Use the trapezoid rule to estimate the distance the car travels.'
            answer: '400'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'The width is $10$ seconds, so the estimate is $\frac{10}{2}\big(0 + 2 \cdot 6 + 2 \cdot 11 + 2 \cdot 15 + 16\big)$. That equals $5 \cdot 80 = 400$ metres.'
          - problem: 'A cyclist''s speed in kilometres per hour is recorded every half hour during a two-hour ride, giving $0, 18, 24, 20, 12$. Use the trapezoid rule to estimate her average speed over the ride.'
            answer: '17'
            answer_contract: {"kind":"unit","quantity":"speed","unit":"km/h","allow_omitted":true}
            solution_sketch: 'The distance is about $\frac{0.5}{2}(0 + 36 + 48 + 40 + 12) = 0.25 \cdot 136 = 34$ kilometres. The average speed is the distance divided by the time, $34/2 = 17$ kilometres per hour.'
          - problem: 'Sam uses the trapezoid rule with $n = 4$ for $\int_0^4 f(x)\,dx$ from the table $f(0) = 1$, $f(1) = 3$, $f(2) = 4$, $f(3) = 4$, $f(4) = 2$, and computes $\frac{1}{2}(1 + 3 + 4 + 4 + 2) = 7$. What is the correct trapezoid estimate?'
            answer: '12.5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The interior heights $3, 4, 4$ must be doubled, and only the end heights $1$ and $2$ count once. So the estimate is $\frac{1}{2}(1 + 6 + 8 + 8 + 2) = \frac{25}{2} = 12.5$.'
      - id: kp3
        name: 'Error direction from concavity'
        key_prerequisites: [left-right-riemann-sums, concavity-inflection-points]
        constraints: 'integrand with fixed concavity on the interval; ask for the direction or for estimate minus exact value; measured contexts'
        step_check:
          step: 'a chord joining two points of a concave-down curve lies below the curve, so the trapezoid rule should underestimate'
          question: 'Why does the trapezoid rule underestimate on a concave-down curve?'
          options:
            - 'The trapezoids use only the endpoint heights, so they always miss the true area from below'
            - 'Each chord lies below the curve, so each trapezoid covers less area than the region under it'
            - 'A concave-down graph has a negative second derivative, so the area under it counts as negative'
          answer: 'Each chord lies below the curve, so each trapezoid covers less area than the region under it'
          why: 'On a concave-down curve every chord joining two points lies below the curve. So each trapezoid is a little smaller than the region under the curve, and the sum is too small.'
        exemplars:
          - problem: 'The trapezoid rule with $n = 2$ gives $5$ for $\int_0^2 (x^2 + 1)\,dx$. Is this estimate too high or too low?'
            answer: 'too high'
            answer_contract: {"kind":"label","options":[["too high","high","overestimate","an overestimate","overestimates","it overestimates","overestimated","too large"],["too low","low","underestimate","an underestimate","underestimates","it underestimates","underestimated","too small"]]}
            solution_sketch: 'Since $f(x) = x^2 + 1$ has $f^{\prime\prime}(x) = 2 > 0$, its graph is concave up and the chords lie above it. So the estimate is too high; indeed the exact value is $\frac{8}{3} + 2 = \frac{14}{3}$, which is less than $5$.'
          - problem: 'The trapezoid rule with $n = 2$ is used for $\int_0^2 x^2\,dx$, whose exact value is $\frac{8}{3}$. Find the trapezoid estimate minus the exact value.'
            answer: '1/3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'With $\Delta x = 1$ the estimate is $\frac{1}{2}(0 + 2 \cdot 1 + 4) = 3$. The difference is $3 - \frac{8}{3} = \frac{1}{3}$, which is positive because $x^2$ is concave up.'
          - problem: 'The trapezoid rule with $n = 2$ is used for $\int_0^2 (4x - x^2)\,dx$, whose exact value is $\frac{16}{3}$. Find the trapezoid estimate minus the exact value.'
            answer: '-1/3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'With $\Delta x = 1$ the heights are $0, 3, 4$, so the estimate is $\frac{1}{2}(0 + 6 + 4) = 5$. The difference is $5 - \frac{16}{3} = -\frac{1}{3}$, which is negative because the graph is concave down.'
          - problem: 'A midpoint sum with $n = 2$ is used for $\int_0^2 (4x - x^2)\,dx$, whose exact value is $\frac{16}{3}$. Find the midpoint estimate minus the exact value.'
            answer: '1/6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The midpoints are $0.5$ and $1.5$, with heights $1.75$ and $3.75$, so the midpoint sum is $5.5$. The difference is $5.5 - \frac{16}{3} = \frac{1}{6}$, which is positive: the midpoint rule overestimates on a concave-down graph.'
          - problem: 'Let $T$ be the trapezoid estimate and $M$ the midpoint estimate, both with $n = 6$, for $\int_0^2 x^4\,dx$, and let $I$ be the exact value. Which comparison of $T$ and $M$ with $I$ is correct?'
            answer: 'T > I, M < I'
            answer_contract: {"kind":"label","options":[["T > I, M < I","T>I, M<I","T > I and M < I","T>I and M<I","T>I,M<I"],["T < I, M > I","T<I, M>I","T < I and M > I","T<I and M>I","T<I,M>I"],["T > I, M > I","T>I, M>I","T > I and M > I","T>I and M>I","T>I,M>I"],["T < I, M < I","T<I, M<I","T < I and M < I","T<I and M<I","T<I,M<I"]]}
            solution_sketch: 'The graph of $x^4$ is concave up since $f^{\prime\prime}(x) = 12x^2 \ge 0$. Chords lie above a concave-up curve, so $T > I$, while the midpoint rule underestimates, so $M < I$.'
          - problem: 'An arch has height $h(x) = 9 - x^2$ metres at horizontal distance $x$ metres from its centre, for $-3 \le x \le 3$. The exact area under the arch is $36$ square metres. A designer estimates the area with the trapezoid rule using $n = 6$. Find the estimate minus the exact area.'
            answer: '-1'
            answer_contract: {"kind":"unit","quantity":"area","unit":"m^2","allow_omitted":true}
            solution_sketch: 'The heights at $x = -3, \dots, 3$ are $0, 5, 8, 9, 8, 5, 0$, so the estimate is $\frac{1}{2}(2 \cdot 35) = 35$. The difference is $35 - 36 = -1$ square metre: the estimate is low because the arch is concave down.'
          - problem: 'A plant grows at the rate $r(t) = 12 - t^2$ centimetres per week for $0 \le t \le 3$, so its growth is exactly $27$ centimetres. The trapezoid rule with $n = 3$ is used to estimate the growth. Find the estimate minus the exact growth.'
            answer: '-0.5'
            answer_contract: {"kind":"unit","quantity":"length","unit":"cm","allow_omitted":true}
            solution_sketch: 'The rates at $t = 0, 1, 2, 3$ are $12, 11, 8, 3$, so the estimate is $\frac{1}{2}(12 + 22 + 16 + 3) = 26.5$. The difference is $26.5 - 27 = -0.5$ centimetres.'
          - problem: 'A second designer estimates the area under the arch $h(x) = 9 - x^2$ metres, for $-3 \le x \le 3$, with a midpoint sum using $n = 3$. The exact area is $36$ square metres. Find the estimate minus the exact area.'
            answer: '2'
            answer_contract: {"kind":"unit","quantity":"area","unit":"m^2","allow_omitted":true}
            solution_sketch: 'The width is $2$ and the midpoints are $-2, 0, 2$, where the heights are $5, 9, 5$. The midpoint sum is $2 \cdot 19 = 38$, so the difference is $38 - 36 = 2$ square metres.'
    diagnostic_exemplar:
      problem: 'Approximate $\int_0^4 x^2\,dx$ with the trapezoid rule using $n = 2$, then report the difference (your estimate minus the exact value $\frac{64}{3}$).'
      answer: '8/3'
      solution_sketch: '$T = \frac{\Delta x}{2}\left[f(0) + 2f(2) + f(4)\right] = 1\,(0 + 8 + 16) = 24$; since $x^2$ is concave up the trapezoid rule overestimates, and $24 - \frac{64}{3} = \frac{8}{3} > 0$.'
    anki_seeds:
      - front: "The trapezoid estimate equals the average of..."
        back: "the left and right Riemann sums"
        type: basic
      - front: "Concave up on [a,b]: trapezoid rule ___ and midpoint rule ___ the integral."
        back: "overestimates; underestimates (both reversed when concave down)"
        type: basic

  - id: estimating-integrals-from-tables
    name: Estimating Integrals from Tables
    core: false                # terminal numerical-estimation genre
    difficulty: 0.6
    drill: false
    answer_kind: numeric
    expected_time_secs: 180
    prerequisites:
      - id: midpoint-trapezoid-sums
        weight: 0.6
        key: true
      - id: left-right-riemann-sums
        weight: 0.6
        key: true
      - id: riemann-sums-definite-integral
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: 'Left and right sums from a table'
        key_prerequisites: [left-right-riemann-sums]
        constraints: 'evenly spaced table; 3-4 subintervals; integer values; motion and flow contexts; the width may be found from the time stamps'
        step_check:
          step: 'The $t$-values $0, 2, 4, 6$ are evenly spaced, so $\Delta t = 2$'
          question: 'Why do we multiply the sum of the heights by $2$?'
          options:
            - 'Each rectangle is $\Delta t = 2$ wide, so a height $h$ adds an area of $2h$'
            - 'The value $2$ is the number of subintervals, so it scales the sum of the heights'
            - 'A left sum counts every height twice, once for each end of its subinterval'
          answer: 'Each rectangle is $\Delta t = 2$ wide, so a height $h$ adds an area of $2h$'
          why: 'A rectangle with height $h$ and width $2$ has area $2h$. So the sum of all the rectangle areas is $2$ times the sum of the heights.'
        exemplars:
          - problem: 'A table gives $v(0) = 5$, $v(2) = 7$, $v(4) = 10$, $v(6) = 12$. Estimate $\int_0^6 v(t)\,dt$ with a left Riemann sum.'
            answer: '44'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The values are evenly spaced, so $\Delta t = 2$. A left sum uses $v(0), v(2), v(4)$, so it is $2(5 + 7 + 10) = 44$.'
          - problem: 'A table gives $v(0) = 5$, $v(2) = 7$, $v(4) = 10$, $v(6) = 12$. Estimate $\int_0^6 v(t)\,dt$ with a right Riemann sum.'
            answer: '58'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The values are evenly spaced, so $\Delta t = 2$. A right sum uses $v(2), v(4), v(6)$, so it is $2(7 + 10 + 12) = 58$.'
          - problem: 'A car''s speed in metres per second is recorded each second: $v(0) = 4$, $v(1) = 6$, $v(2) = 9$, $v(3) = 11$. Use a left Riemann sum to estimate the distance the car travels in the first $3$ seconds.'
            answer: '19'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'The readings are $1$ second apart, so $\Delta t = 1$. A left sum uses the first three speeds, so the distance is about $1 \cdot (4 + 6 + 9) = 19$ metres.'
          - problem: 'A table gives $v(0) = 3$, $v(2) = 5$, $v(4) = 8$, $v(6) = 10$, $v(8) = 12$. Find the right Riemann sum estimate of $\int_0^8 v(t)\,dt$.'
            answer: '70'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The spacing is $\Delta t = 2$, and a right sum uses the last four values. So it is $2(5 + 8 + 10 + 12) = 70$.'
          - problem: 'A table gives $v(1) = 7$, $v(2) = 5$, $v(3) = 4$, $v(4) = 2$, $v(5) = 1$. Estimate $\int_1^5 v(t)\,dt$ with a left Riemann sum.'
            answer: '18'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The spacing is $\Delta t = 1$, and a left sum uses the first four values. So it is $1 \cdot (7 + 5 + 4 + 2) = 18$.'
          - problem: 'A table gives $v(0) = 2$, $v(1) = 6$, $v(2) = 6$, $v(3) = 9$, $v(4) = 10$. Estimate $\int_0^4 v(t)\,dt$ with a right Riemann sum.'
            answer: '31'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The spacing is $\Delta t = 1$, and a right sum uses the last four values. So it is $1 \cdot (6 + 6 + 9 + 10) = 31$.'
          - problem: 'The rate at which water drains from a tank, in litres per minute, is measured every $5$ minutes: $12$ at $t = 0$, $9$ at $t = 5$, $7$ at $t = 10$ and $4$ at $t = 15$. Use a right Riemann sum to estimate the water drained in the first $15$ minutes.'
            answer: '100'
            answer_contract: {"kind":"unit","quantity":"volume","unit":"L","allow_omitted":true}
            solution_sketch: 'The readings are $5$ minutes apart, so $\Delta t = 5$. A right sum uses the last three rates, so the volume is about $5(9 + 7 + 4) = 100$ litres.'
          - problem: 'The flow rate $r(t)$ of a pump, in litres per minute, is read every $3$ minutes: $r(0) = 3$, $r(3) = 5$, $r(6) = 6$, $r(9) = 10$, $r(12) = 12$. Use a right Riemann sum to estimate the volume pumped in $12$ minutes.'
            answer: '99'
            answer_contract: {"kind":"unit","quantity":"volume","unit":"L","allow_omitted":true}
            solution_sketch: 'The time between readings is $3$ minutes, so $\Delta t = 3$. A right sum uses the last four rates, so the volume is about $3(5 + 6 + 10 + 12) = 99$ litres.'
          - problem: 'Sam estimates $\int_0^9 v(t)\,dt$ with a right Riemann sum from the table $v(0) = 2$, $v(3) = 4$, $v(6) = 7$, $v(9) = 8$ and writes $4 + 7 + 8 = 19$. What is the correct estimate?'
            answer: '57'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Sam found the right sum of the heights but forgot the width of each rectangle, $\Delta t = 3$. The correct estimate is $3(4 + 7 + 8) = 57$.'
      - id: kp2
        name: 'Trapezoid sums from a table (uneven spacing allowed)'
        key_prerequisites: [midpoint-trapezoid-sums]
        constraints: 'handle each subinterval separately when spacing is uneven; tables only; measured and average-value contexts'
        step_check:
          step: 'Use its own width, $3$'
          question: 'Why does the second trapezoid use the width $3$ and not $2$?'
          options:
            - 'Every trapezoid in one estimate must use the widest gap between any two table points'
            - 'Its own subinterval $[2, 5]$ is $3$ wide, and each trapezoid uses its own width'
            - 'The width is the number of table points, so three points give the width $3$'
          answer: 'Its own subinterval $[2, 5]$ is $3$ wide, and each trapezoid uses its own width'
          why: 'The second trapezoid sits on the subinterval from $x = 2$ to $x = 5$, which is $3$ wide. With uneven spacing every trapezoid uses the width of its own subinterval.'
        exemplars:
          - problem: 'A table gives $f(0) = 4$, $f(1) = 6$, $f(3) = 10$. Estimate $\int_0^3 f(x)\,dx$ with trapezoids.'
            answer: '21'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The trapezoid on $[0, 1]$ has area $\frac{4 + 6}{2} \cdot 1 = 5$, and the trapezoid on $[1, 3]$ has area $\frac{6 + 10}{2} \cdot 2 = 16$. The estimate is $5 + 16 = 21$.'
          - problem: 'A table gives $v(0) = 5$, $v(2) = 7$, $v(4) = 10$, $v(6) = 12$. Estimate $\int_0^6 v(t)\,dt$ with the trapezoid rule.'
            answer: '51'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The three trapezoids each have width $2$, with areas $\frac{5 + 7}{2} \cdot 2 = 12$, $\frac{7 + 10}{2} \cdot 2 = 17$ and $\frac{10 + 12}{2} \cdot 2 = 22$. The estimate is $12 + 17 + 22 = 51$.'
          - problem: 'A table gives $f(1) = 2$, $f(3) = 8$ and $f(6) = 12$. Use a trapezoid on each subinterval to estimate $\int_1^6 f(x)\,dx$.'
            answer: '40'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'On $[1, 3]$ the width is $2$, so the area is $\frac{2 + 8}{2} \cdot 2 = 10$. On $[3, 6]$ the width is $3$, so the area is $\frac{8 + 12}{2} \cdot 3 = 30$. The estimate is $10 + 30 = 40$.'
          - problem: 'A table gives $v(0) = 4$, $v(3) = 10$, $v(4) = 14$ and $v(7) = 20$. Estimate $\int_0^7 v(t)\,dt$ with trapezoids, taking each subinterval separately.'
            answer: '84'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The subintervals have widths $3$, $1$ and $3$, with trapezoid areas $\frac{4 + 10}{2} \cdot 3 = 21$, $\frac{10 + 14}{2} \cdot 1 = 12$ and $\frac{14 + 20}{2} \cdot 3 = 51$. The estimate is $21 + 12 + 51 = 84$.'
          - problem: 'A table gives $f(0) = 2$ and $f(5) = 8$, and the value $f(2)$ is missing. The trapezoid estimate of $\int_0^5 f(x)\,dx$ is $29$. Find $f(2)$.'
            answer: '6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Let $k = f(2)$. The trapezoid on $[0, 2]$ has area $\frac{2 + k}{2} \cdot 2 = 2 + k$, and the one on $[2, 5]$ has area $\frac{k + 8}{2} \cdot 3 = 1.5k + 12$. So $2.5k + 14 = 29$, which gives $k = 6$.'
          - problem: 'A table gives $R(0) = 20$, $R(2) = 16$, $R(5) = 10$ and $R(6) = 6$. Estimate $\int_0^6 R(t)\,dt$ with trapezoids, taking each subinterval separately.'
            answer: '83'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The subinterval widths are $2$, $3$ and $1$, with areas $\frac{20 + 16}{2} \cdot 2 = 36$, $\frac{16 + 10}{2} \cdot 3 = 39$ and $\frac{10 + 6}{2} \cdot 1 = 8$. The estimate is $36 + 39 + 8 = 83$.'
          - problem: 'A hiker''s speed in kilometres per hour is recorded at $t = 0, 1, 3, 4$ hours, giving $4, 6, 5, 3$. Use a trapezoid on each subinterval to estimate the distance she walks.'
            answer: '20'
            answer_contract: {"kind":"unit","quantity":"length","unit":"km","allow_omitted":true}
            solution_sketch: 'The subinterval widths are $1$, $2$ and $1$ hours, with areas $\frac{4 + 6}{2} \cdot 1 = 5$, $\frac{6 + 5}{2} \cdot 2 = 11$ and $\frac{5 + 3}{2} \cdot 1 = 4$. The distance is about $5 + 11 + 4 = 20$ kilometres.'
          - problem: 'The temperature in a greenhouse, in degrees Celsius, is recorded at hours $0, 2, 5, 6$, giving $18, 22, 26, 20$. Use trapezoids to estimate the average temperature over the six hours.'
            answer: '22.5'
            answer_contract: {"kind":"unit","quantity":"temperature","unit":"°C","allow_omitted":true}
            solution_sketch: 'The trapezoid areas are $\frac{18 + 22}{2} \cdot 2 = 40$, $\frac{22 + 26}{2} \cdot 3 = 72$ and $\frac{26 + 20}{2} \cdot 1 = 23$, which add to $135$. The average is $135 / 6 = 22.5$ degrees.'
          - problem: 'Sam estimates $\int_0^5 f(x)\,dx$ from $f(0) = 3$, $f(2) = 7$ and $f(5) = 11$ by using only the end values: $5 \cdot \frac{3 + 11}{2} = 35$. What is the trapezoid estimate that uses all three table values?'
            answer: '37'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The middle value $f(2) = 7$ must be used, with a trapezoid on each subinterval. The areas are $\frac{3 + 7}{2} \cdot 2 = 10$ and $\frac{7 + 11}{2} \cdot 3 = 27$, so the estimate is $37$.'
      - id: kp3
        name: 'Interpret the estimate with units'
        key_prerequisites: [left-right-riemann-sums, riemann-sums-definite-integral]
        constraints: 'the integral of a rate carries the units (rate units) × (input units); the time unit of the rate may differ from the time unit of the input'
        step_check:
          step: 'Combine the units: (rate units) × (input units) = (gallons per hour) × (hours) = gallons'
          question: 'Why is the unit of the integral the rate unit times the input unit?'
          options:
            - 'The integral is always measured in the same unit as the rate that it adds up'
            - 'The input unit is dropped because the interval length is only a plain number'
            - 'Each term is a rate times a width, such as gallons per hour times hours'
          answer: 'Each term is a rate times a width, such as gallons per hour times hours'
          why: 'Each term of the sum is a rate times a width, such as gallons per hour times hours. The hours cancel, so the total is an amount in gallons.'
        try_first:
          problem: 'A tap runs at a steady $2$ litres per minute for $5$ minutes. How many litres of water come out?'
          answer_contract: {"kind":"exact"}
          answer: '10'
          reveal: 'Rate times time gives an amount, here $2 \cdot 5 = 10$ litres. The integral of a rate does the same over a whole interval, so its units are the rate units times the time units.'
        exemplars:
          - problem: 'A velocity $v(t)$ is measured in metres per second and $t$ in seconds. A trapezoid sum estimates $\int_0^6 v(t)\,dt$ as $51$. What unit does the value $51$ carry?'
            answer: 'metres'
            answer_contract: {"kind":"label","options":[["metres","meters","m"],["m/s","metres per second","meters per second"],["seconds","s"],["m/s^2","m/s²","metres per second squared","meters per second squared"]]}
            solution_sketch: 'The integral of a rate is a total change, so its unit is the rate unit times the input unit. Metres per second times seconds gives metres. The unit metres per second would make $51$ a rate, and seconds would make it a time.'
          - problem: 'A pump''s flow rate, in litres per minute, is recorded at $t = 0$, $1$ and $2$ hours, giving $10$, $14$, $12$. Use trapezoids to estimate the total volume pumped in the two hours.'
            answer: '1500'
            answer_contract: {"kind":"unit","quantity":"volume","unit":"L","allow_omitted":true}
            solution_sketch: 'The trapezoid sum is $\frac{10 + 14}{2} \cdot 1 + \frac{14 + 12}{2} \cdot 1 = 12 + 13 = 25$, in litres per minute times hours. One hour is $60$ minutes, so the volume is $25 \cdot 60 = 1500$ litres.'
          - problem: 'A water company records its usage rate, in gallons per hour, at $t = 0, 1, 2, 3$ days, giving $20$, $26$, $22$, $24$. Use trapezoids to estimate the total number of gallons used in the three days.'
            answer: '1680'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The trapezoid sum is $\frac{20 + 26}{2} + \frac{26 + 22}{2} + \frac{22 + 24}{2} = 23 + 24 + 23 = 70$, in gallons per hour times days. One day is $24$ hours, so the total is $70 \cdot 24 = 1680$ gallons.'
          - problem: 'Water flows through a pipe at a rate $r(t)$ cubic metres per second. The rate is $0.2$ at $t = 0$, $0.3$ at $t = 2$ and $0.1$ at $t = 4$, where $t$ is in minutes. Use trapezoids to estimate the volume that flows in the four minutes.'
            answer: '54'
            answer_contract: {"kind":"unit","quantity":"cubic_volume","unit":"m^3","allow_omitted":true}
            solution_sketch: 'The trapezoid sum is $\frac{0.2 + 0.3}{2} \cdot 2 + \frac{0.3 + 0.1}{2} \cdot 2 = 0.5 + 0.4 = 0.9$, in cubic metres per second times minutes. One minute is $60$ seconds, so the volume is $0.9 \cdot 60 = 54$ cubic metres.'
          - problem: 'A drug is delivered at a rate of $12$ milligrams per minute at $t = 0$, $20$ at $t = 0.5$ and $16$ at $t = 1$, where $t$ is in hours. Use trapezoids to estimate the total mass of drug delivered in the hour.'
            answer: '1020'
            answer_contract: {"kind":"unit","quantity":"mass","unit":"mg","allow_omitted":true}
            solution_sketch: 'The trapezoid sum is $\frac{12 + 20}{2} \cdot 0.5 + \frac{20 + 16}{2} \cdot 0.5 = 8 + 9 = 17$, in milligrams per minute times hours. One hour is $60$ minutes, so the mass is $17 \cdot 60 = 1020$ milligrams.'
          - problem: 'A pump''s flow rate $r(t)$ is measured in litres per minute and $t$ in minutes. A table-based estimate of $\int_0^{20} r(t)\,dt$ is $340$. What unit does the value $340$ carry?'
            answer: 'litres'
            answer_contract: {"kind":"label","options":[["litres","liters","L"],["L/min","litres per minute","liters per minute"],["minutes","min"],["L/min^2","L/min²","litres per minute squared","liters per minute squared"]]}
            solution_sketch: 'The integral of a rate is a total amount, so its unit is the rate unit times the input unit. Litres per minute times minutes gives litres. The unit litres per minute would make $340$ a rate, and minutes would make it a time.'
          - problem: 'A trapezoid estimate says that $900$ milligrams of a drug enter a patient during the first hour. What is the average delivery rate in milligrams per minute?'
            answer: '15'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The hour is $60$ minutes long, and the total amount is $900$ milligrams. The average rate is the total divided by the time, $900 / 60 = 15$ milligrams per minute.'
          - problem: 'A trapezoid estimate says that a pump moves $1500$ litres in $2$ hours. What is the average flow rate in litres per minute?'
            answer: '12.5'
            answer_contract: {"kind":"unit","quantity":"flow","unit":"L/min","allow_omitted":true}
            solution_sketch: 'The $2$ hours are $120$ minutes. The average flow rate is the total divided by the time, $1500 / 120 = 12.5$ litres per minute.'
          - problem: 'A remote-control car''s speed, in feet per second, is recorded at $t = 0$, $1$ and $2$ minutes, giving $2$, $6$ and $4$. Use trapezoids to estimate how far the car travels in the two minutes.'
            answer: '540'
            answer_contract: {"kind":"unit","quantity":"length","unit":"ft","allow_omitted":true}
            solution_sketch: 'The trapezoid sum is $\frac{2 + 6}{2} \cdot 1 + \frac{6 + 4}{2} \cdot 1 = 4 + 5 = 9$, in feet per second times minutes. One minute is $60$ seconds, so the distance is $9 \cdot 60 = 540$ feet.'
          - problem: 'Sam finds a trapezoid sum of $20$ for a flow rate in litres per minute with $t$ in hours, and answers that $20$ litres flow. What is the correct volume in litres?'
            answer: '1200'
            answer_contract: {"kind":"unit","quantity":"volume","unit":"L","allow_omitted":true}
            solution_sketch: 'The sum $20$ has units of litres per minute times hours, so the hours must become minutes. One hour is $60$ minutes, so the volume is $20 \cdot 60 = 1200$ litres.'
    diagnostic_exemplar:
      problem: 'A table gives $v(0) = 3$, $v(1) = 5$, $v(4) = 11$, with $v$ in m/s and $t$ in seconds. Estimate $\int_0^4 v(t)\,dt$ with the trapezoid rule.'
      answer: '28'
      solution_sketch: 'The spacing is uneven, so treat each subinterval separately: $\frac{3+5}{2}(1) + \frac{5+11}{2}(3) = 4 + 24 = 28$ (metres travelled).'
    anki_seeds:
      - front: "The integral of a rate function r(t) over [a, b] measures..."
        back: "the total accumulated amount from t = a to t = b, in (rate units) × (time units)"
        type: basic
      - front: "Trapezoid estimate on one subinterval [x₀, x₁]:"
        back: "(f(x₀) + f(x₁))/2 · (x₁ - x₀)"
        type: basic

  - id: definite-integrals-ftc
    name: The Fundamental Theorem of Calculus
    core: true
    difficulty: 0.65
    drill: false
    answer_kind: numeric
    expected_time_secs: 180
    prerequisites:
      - id: antiderivatives
        weight: 0.8
        key: true
      - id: riemann-sums-definite-integral
        weight: 0.6
        key: true
    knowledge_points:
      - id: kp1
        name: 'Evaluate definite integrals (FTC part 2)'
        key_prerequisites: [antiderivatives, riemann-sums-definite-integral]
        constraints: 'antiderivative from the basic table; integer or simple exact answers; area contexts'
        step_check:
          step: 'Subtract: $28 - 4 = 24$'
          question: 'Why do we subtract the value at the lower limit from the value at the upper limit?'
          options:
            - 'Subtraction makes the answer positive, because every definite integral has to be positive'
            - 'The lower limit is a correction term, and subtraction removes it from the upper value'
            - 'The antiderivative $F$ increases by $F(4) - F(1)$ over $[1, 4]$, and that is the integral'
          answer: 'The antiderivative $F$ increases by $F(4) - F(1)$ over $[1, 4]$, and that is the integral'
          why: 'The antiderivative $F$ increases by $F(4) - F(1)$ as $x$ runs from $1$ to $4$, and the integral is that total change. Here the change is $28 - 4 = 24$.'
        exemplars:
          - problem: 'Evaluate $\int_1^3 2x\,dx$.'
            answer: '8'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'An antiderivative of $2x$ is $x^2$. Then $\left[x^2\right]_1^3 = 9 - 1 = 8$.'
          - problem: 'Evaluate $\int_0^2 (3x^2 + 1)\,dx$.'
            answer: '10'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'An antiderivative of $3x^2 + 1$ is $x^3 + x$. Then $\left[x^3 + x\right]_0^2 = (8 + 2) - 0 = 10$.'
          - problem: 'Evaluate $\int_0^{\pi} \sin x\,dx$.'
            answer: '2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'An antiderivative of $\sin x$ is $-\cos x$. Then $\left[-\cos x\right]_0^{\pi} = -(-1) - (-1) = 2$.'
          - problem: 'Evaluate $\int_0^1 (4x + 1)\,dx$.'
            answer: '3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The power rule gives the antiderivative $2x^2 + x$. Then $\left[2x^2 + x\right]_0^1 = (2 + 1) - 0 = 3$.'
          - problem: 'Evaluate $\int_1^2 6x^2\,dx$.'
            answer: '14'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The power rule gives the antiderivative $2x^3$. Then $\left[2x^3\right]_1^2 = 16 - 2 = 14$.'
          - problem: 'Evaluate $\int_0^{\pi/2} \cos x\,dx$.'
            answer: '1'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'An antiderivative of $\cos x$ is $\sin x$. Then $\left[\sin x\right]_0^{\pi/2} = 1 - 0 = 1$.'
          - problem: 'Evaluate $\int_1^4 \sqrt{x}\,dx$.'
            answer: '14/3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Write $\sqrt{x} = x^{1/2}$, which has the antiderivative $\frac{2}{3}x^{3/2}$. Then $\left[\frac{2}{3}x^{3/2}\right]_1^4 = \frac{2}{3} \cdot 8 - \frac{2}{3} = \frac{14}{3}$.'
          - problem: 'Evaluate $\int_1^2 \frac{1}{x^2}\,dx$.'
            answer: '1/2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Write $\frac{1}{x^2} = x^{-2}$, which has the antiderivative $-\frac{1}{x}$. Then $\left[-\frac{1}{x}\right]_1^2 = -\frac{1}{2} + 1 = \frac{1}{2}$.'
          - problem: 'Evaluate $\int_0^1 e^x\,dx$.'
            answer: 'e - 1'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The antiderivative of $e^x$ is $e^x$. Then $\left[e^x\right]_0^1 = e^1 - e^0 = e - 1$.'
          - problem: 'A flower bed lies under the curve $y = x^2 + 1$ between $x = 0$ and $x = 3$, with $x$ and $y$ in metres. Find its area.'
            answer: '12'
            answer_contract: {"kind":"unit","quantity":"area","unit":"m^2","allow_omitted":true}
            solution_sketch: 'The area is $\int_0^3 (x^2 + 1)\,dx$. An antiderivative is $\frac{x^3}{3} + x$, so the area is $(9 + 3) - 0 = 12$ square metres.'
          - problem: 'An arch has height $y = 9 - x^2$ metres at distance $x$ metres from its centre, for $-3 \le x \le 3$. Find the area under the arch.'
            answer: '36'
            answer_contract: {"kind":"unit","quantity":"area","unit":"m^2","allow_omitted":true}
            solution_sketch: 'The area is $\int_{-3}^{3} (9 - x^2)\,dx$. An antiderivative is $9x - \frac{x^3}{3}$, so the area is $(27 - 9) - (-27 + 9) = 36$ square metres.'
          - problem: 'Sam evaluates $\int_0^2 (x^2 + 1)\,dx$ as $(2^2 + 1) - (0^2 + 1) = 4$. What is the correct value?'
            answer: '14/3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Sam substituted the limits into the integrand instead of an antiderivative. An antiderivative is $\frac{x^3}{3} + x$, so the value is $\left(\frac{8}{3} + 2\right) - 0 = \frac{14}{3}$.'
      - id: kp2
        name: 'Differentiate an accumulation function (FTC part 1)'
        key_prerequisites: [antiderivatives]
        constraints: 'variable upper limit x or variable lower limit x with a constant upper limit (sign change); answer is the integrand evaluated at x; values of g at a point; rate contexts'
        step_check:
          step: 'the derivative of the accumulation function equals the integrand evaluated at the upper limit'
          question: 'Why does the derivative return the integrand evaluated at the upper limit?'
          options:
            - 'Differentiating undoes the lower limit $2$, so only the integrand is left over'
            - 'A small step in $x$ adds a thin strip of height $f(x)$ to the area'
            - 'The derivative of an integral is always an antiderivative of the integrand $f$'
          answer: 'A small step in $x$ adds a thin strip of height $f(x)$ to the area'
          why: 'Increasing $x$ by a small amount adds a thin strip of area whose height is $f(x)$ and whose width is the increase. So the area grows at the rate $f(x)$.'
        try_first:
          problem: 'Let $g(x) = \int_0^x 5\,dt$. Find $g''(7)$.'
          answer_contract: {"kind":"exact"}
          answer: '5'
          reveal: 'Here $g(x) = 5x$, so $g''(x) = 5$, the height of the integrand. In general the derivative of the accumulated area is the height of the graph at the upper limit.'
        exemplars:
          - problem: 'Find $g''(x)$ for $g(x) = \int_0^x \sqrt{1 + t^2}\,dt$.'
            answer: 'sqrt(1 + x^2)'
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'The upper limit is $x$ and the lower limit is constant, so FTC part 1 applies. The derivative is the integrand with $t$ replaced by $x$, which is $\sqrt{1 + x^2}$.'
          - problem: 'Find $\frac{d}{dx} \int_1^x (t^3 + 1)\,dt$.'
            answer: 'x^3 + 1'
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'By FTC part 1 the derivative is the integrand evaluated at the upper limit. Replacing $t$ by $x$ gives $x^3 + 1$.'
          - problem: 'Find $\frac{d}{dx} \int_2^x \cos(t^2)\,dt$.'
            answer: 'cos(x^2)'
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'By FTC part 1 the derivative is the integrand evaluated at the upper limit. Replacing $t$ by $x$ gives $\cos(x^2)$, and the antiderivative is never needed.'
          - problem: 'Find $g''(x)$ for $g(x) = \int_3^x (t^2 + 4t)\,dt$.'
            answer: 'x^2 + 4x'
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'The accumulation function has the variable upper limit $x$. By FTC part 1, $g''(x)$ is the integrand with $t$ replaced by $x$, so $g''(x) = x^2 + 4x$.'
          - problem: 'Find $\frac{d}{dx} \int_0^x e^{t^2}\,dt$.'
            answer: 'e^(x^2)'
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'By FTC part 1 the derivative is the integrand evaluated at the upper limit. Replacing $t$ by $x$ gives $e^{x^2}$.'
          - problem: 'Find $g''(x)$ for $g(x) = \int_5^x \frac{1}{1 + t^2}\,dt$.'
            answer: '1/(1 + x^2)'
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'The upper limit is the variable $x$, so FTC part 1 applies. The derivative is the integrand with $t$ replaced by $x$, which is $\frac{1}{1 + x^2}$.'
          - problem: 'Let $g(x) = \int_1^x \sqrt{t^3 + 8}\,dt$. Find $g''(2)$.'
            answer: '4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'By FTC part 1, $g''(x) = \sqrt{x^3 + 8}$. At $x = 2$ this is $\sqrt{8 + 8} = \sqrt{16} = 4$.'
          - problem: 'Find $\frac{d}{dx} \int_x^4 (t^2 + 1)\,dt$.'
            answer: '-(x^2 + 1)'
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'Swapping the limits changes the sign: $\int_x^4 (t^2 + 1)\,dt = -\int_4^x (t^2 + 1)\,dt$. By FTC part 1 the derivative is $-(x^2 + 1)$.'
          - problem: 'After $x$ minutes a tank holds $V(x) = \int_0^x (t^2 + 3t)\,dt$ litres, where $t^2 + 3t$ is the inflow rate in litres per minute. At what rate is the volume increasing when $x = 4$?'
            answer: '28'
            answer_contract: {"kind":"unit","quantity":"flow","unit":"L/min","allow_omitted":true}
            solution_sketch: 'The rate of change of the volume is $V''(x)$, which by FTC part 1 equals the inflow rate $x^2 + 3x$. At $x = 4$ it is $16 + 12 = 28$ litres per minute.'
          - problem: 'After $x$ seconds a cart has travelled $s(x) = \int_0^x \sqrt{t^2 + 16}\,dt$ metres. How fast is the cart moving when $x = 3$?'
            answer: '5'
            answer_contract: {"kind":"unit","quantity":"speed","unit":"m/s","allow_omitted":true}
            solution_sketch: 'The speed is $s''(x)$, which by FTC part 1 equals $\sqrt{x^2 + 16}$. At $x = 3$ it is $\sqrt{9 + 16} = \sqrt{25} = 5$ metres per second.'
          - problem: 'Sam says that for $g(x) = \int_0^x (t^2 + 1)\,dt$ the derivative is $g''(x) = \frac{x^3}{3} + x$. What is the correct $g''(x)$?'
            answer: 'x^2 + 1'
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'Sam found an antiderivative, but FTC part 1 asks for the derivative of the integral. That derivative is the integrand with $t$ replaced by $x$, so $g''(x) = x^2 + 1$.'
      - id: kp3
        name: 'Net change from a rate'
        key_prerequisites: [antiderivatives, riemann-sums-definite-integral]
        constraints: 'polynomial rates; measured quantities with units; average values and money contexts'
        step_check:
          step: 'displacement is the integral of velocity'
          question: 'Why is displacement found by integrating velocity?'
          options:
            - 'Velocity is the rate of change of position, so its integral is the total change in position'
            - 'The integral of velocity is the distance travelled, which always ignores the direction of motion'
            - 'The area under any graph is the displacement, whatever physical quantity the graph shows'
          answer: 'Velocity is the rate of change of position, so its integral is the total change in position'
          why: 'Velocity is the rate at which position changes, so adding up the changes over $[1, 3]$ gives the total change in position. Because velocity can be negative, this signed total is the displacement.'
        exemplars:
          - problem: 'A particle moves with velocity $v(t) = 6t^2$ metres per second. Find its displacement over $[0, 2]$.'
            answer: '16'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'The displacement is $\int_0^2 6t^2\,dt$. An antiderivative is $2t^3$, so the displacement is $16 - 0 = 16$ metres.'
          - problem: 'Water flows into a tank at the rate $r(t) = 2t$ litres per minute. How much water enters during the first $5$ minutes?'
            answer: '25'
            answer_contract: {"kind":"unit","quantity":"volume","unit":"L","allow_omitted":true}
            solution_sketch: 'The amount is $\int_0^5 2t\,dt$. An antiderivative is $t^2$, so the amount is $25 - 0 = 25$ litres.'
          - problem: 'A car moves along a straight road with velocity $v(t) = 3t^2 + 4t$ metres per second. Find its displacement over $[1, 3]$.'
            answer: '42'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'The displacement is $\int_1^3 (3t^2 + 4t)\,dt$, with antiderivative $t^3 + 2t^2$. The value is $(27 + 18) - (1 + 2) = 45 - 3 = 42$ metres.'
          - problem: 'Water flows into a tank at the rate $r(t) = 4t + 1$ litres per minute. How many litres enter during the first $2$ minutes?'
            answer: '10'
            answer_contract: {"kind":"unit","quantity":"volume","unit":"L","allow_omitted":true}
            solution_sketch: 'The amount is $\int_0^2 (4t + 1)\,dt$, with antiderivative $2t^2 + t$. The value is $(8 + 2) - 0 = 10$ litres.'
          - problem: 'A particle moves with velocity $v(t) = 3t^2$ metres per second. Its displacement over $[0, T]$ is $64$ metres. Find $T$.'
            answer: '4'
            answer_contract: {"kind":"unit","quantity":"time","unit":"s","allow_omitted":true}
            solution_sketch: 'The displacement is $\int_0^T 3t^2\,dt = T^3$. Solving $T^3 = 64$ gives $T = 4$ seconds.'
          - problem: 'A particle moves with velocity $v(t) = 2t - 6$ metres per second. Find its displacement over $[1, 4]$.'
            answer: '-3'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'The displacement is $\int_1^4 (2t - 6)\,dt$, with antiderivative $t^2 - 6t$. The value is $(16 - 24) - (1 - 6) = -8 + 5 = -3$ metres.'
          - problem: 'A drone''s velocity is $v(t) = 6t + 2$ metres per second for $0 \le t \le 4$. Find its average velocity over this interval.'
            answer: '14'
            answer_contract: {"kind":"unit","quantity":"speed","unit":"m/s","allow_omitted":true}
            solution_sketch: 'The displacement is $\int_0^4 (6t + 2)\,dt = \left[3t^2 + 2t\right]_0^4 = 48 + 8 = 56$ metres. The average velocity is the displacement divided by the time, $56/4 = 14$ metres per second.'
          - problem: 'A town''s population grows at the rate $12t + 30$ people per year, where $t$ is the number of years since 2020. By how many people does the population grow between $t = 0$ and $t = 5$?'
            answer: '300'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The growth is $\int_0^5 (12t + 30)\,dt$, with antiderivative $6t^2 + 30t$. The value is $(150 + 150) - 0 = 300$ people.'
          - problem: 'The marginal cost of producing $x$ units is $C''(x) = 0.6x + 2$ dollars per unit. By how much does the total cost rise when production goes from $10$ to $20$ units?'
            answer: '110'
            answer_contract: {"kind":"unit","quantity":"dollar","unit":"dollar","allow_omitted":true}
            solution_sketch: 'The rise in cost is $\int_{10}^{20} (0.6x + 2)\,dx$, with antiderivative $0.3x^2 + 2x$. The value is $(120 + 40) - (30 + 20) = 110$ dollars.'
          - problem: 'Sam says that water entering a tank at the rate $r(t) = 3t^2$ litres per minute brings in $r(4) = 48$ litres during the first $4$ minutes. How many litres actually enter?'
            answer: '64'
            answer_contract: {"kind":"unit","quantity":"volume","unit":"L","allow_omitted":true}
            solution_sketch: 'The amount is the integral of the rate, not the rate at the end. So it is $\int_0^4 3t^2\,dt = \left[t^3\right]_0^4 = 64$ litres.'
    diagnostic_exemplar:
      problem: 'Water flows into a tank at the rate $r(t) = 3t^2 + 2$ litres per minute. How many litres enter during the first $3$ minutes?'
      answer: '33'
      solution_sketch: 'Net change $= \int_0^3 (3t^2 + 2)\,dt = \left[t^3 + 2t\right]_0^3 = 27 + 6 = 33$ litres.'
    anki_seeds:
      - front: "FTC part 2: ∫_a^b f(x) dx = ? (F any antiderivative of f)"
        back: "F(b) - F(a)"
        type: basic
      - front: "FTC part 1: d/dx ∫_a^x f(t) dt = ?"
        back: "f(x)"
        type: basic
      - front: "The integral of velocity over [a, b] gives..."
        back: "displacement (net change in position) — a special case of the net change theorem"
        type: basic

  - id: accumulation-functions
    name: Accumulation Functions
    core: true
    difficulty: 0.7
    drill: false
    answer_kind: expression
    expected_time_secs: 210
    prerequisites:
      - id: definite-integrals-ftc
        weight: 0.8
        key: true
      - id: chain-rule
        weight: 0.6
        key: true
      - id: increasing-decreasing-intervals
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: FTC part 1 with composite limits
        key_prerequisites: [definite-integrals-ftc, chain-rule]
        try_first:
          problem: 'Let $F(x)=\int_0^{x^2} 2t\,dt$. Evaluate the integral to write $F$ as a function of $x$, then find $F''(1)$.'
          answer_contract: {"kind":"exact"}
          answer: '4'
          reveal: 'Here $F(x)=x^4$, so $F''(1)=4$. The integrand $2t$ at the limit $x^2$ gives only $2x^2$; the extra factor $2x$ from the moving limit is what makes $4x^3$.'
        step_check:
          step: 'Multiply the two results (chain rule)'
          question: 'Why is $\sin(x^4)$ multiplied by $4x^3$?'
          options:
            - 'The derivative of $\sin t$ is $\cos t$, and $4x^3$ stands for that cosine'
            - 'The lower limit $0$ is constant, so $4x^3$ is added as a correction'
            - 'The upper limit changes with $x$, so the chain rule adds its derivative'
            - 'Every definite integral is multiplied by the power in its upper limit'
          answer: 'The upper limit changes with $x$, so the chain rule adds its derivative'
          why: 'The integral depends on $x$ through its upper limit $x^4$, so the derivative is $\sin(x^4)$ times $\frac{d}{dx}(x^4)=4x^3$.'
        exemplars:
          - problem: 'Find $\frac{d}{dx} \int_0^{x^2} \cos t \, dt$.'
            answer: '2x cos(x^2)'
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'The lower limit $0$ is constant and the upper limit is $x^2$. The Fundamental Theorem puts $x^2$ into $\cos t$, and the chain rule multiplies by the derivative of $x^2$, which is $2x$. The derivative is $2x\cos(x^2)$.'
          - problem: 'Find $\frac{d}{dx} \int_1^{x^3} \sqrt{1 + t} \, dt$.'
            answer: '3x^2 sqrt(1 + x^3)'
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'The upper limit is $x^3$, so put $x^3$ into the integrand to get $\sqrt{1+x^3}$. Then multiply by the derivative of the limit, $3x^2$. The derivative is $3x^2\sqrt{1+x^3}$.'
          - problem: 'A wire carries a current of $e^{-t}$ amperes at time $t$ seconds. The charge that passes through it during the first $x^2$ seconds is $Q(x)=\int_0^{x^2} e^{-t}\,dt$ coulombs. Find $Q''(x)$.'
            answer: '2x e^(-x^2)'
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'The upper limit $x^2$ depends on $x$, so the derivative is the integrand at $x^2$ times the derivative of $x^2$. The integrand $e^{-t}$ becomes $e^{-x^2}$, and the derivative of $x^2$ is $2x$. So $Q''(x)=2x\,e^{-x^2}$.'
          - problem: 'Find $\frac{d}{dx} \int_2^{x^4} e^t \, dt$.'
            answer: '4x^3 e^(x^4)'
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'The lower limit $2$ is constant, so only the upper limit $x^4$ matters. The integrand at $x^4$ is $e^{x^4}$, and the derivative of $x^4$ is $4x^3$. The derivative is $4x^3e^{x^4}$.'
          - problem: 'Let $F(x)=\int_1^{x^2} \frac{1}{1+t}\,dt$. Find $F''(2)$.'
            answer: '4/5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The Fundamental Theorem with the chain rule gives $F''(x)=\frac{1}{1+x^2}\cdot 2x=\frac{2x}{1+x^2}$. At $x=2$ this is $\frac{4}{5}$.'
          - problem: 'Sam differentiates $\int_0^{x^3} \sqrt{1+t^2}\,dt$ and writes $\sqrt{1+x^6}$. What is the correct derivative?'
            answer: '3x^2 sqrt(1+x^6)'
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'Sam put the limit into the integrand but forgot the chain rule. The upper limit $x^3$ has derivative $3x^2$, and this factor must multiply the result. The correct derivative is $3x^2\sqrt{1+x^6}$.'
          - problem: 'Find $\frac{d}{dx} \int_0^{x^5} \sin t \, dt$.'
            answer: '5x^4 sin(x^5)'
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'The integrand at the upper limit $x^5$ is $\sin(x^5)$. The derivative of the limit is $5x^4$. The derivative is $5x^4\sin(x^5)$.'
          - problem: 'Find $\frac{d}{dx} \int_2^{x^6} \frac{1}{1 + t} \, dt$.'
            answer: '6x^5/(1+x^6)'
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'Put the upper limit $x^6$ into $\frac{1}{1+t}$ to get $\frac{1}{1+x^6}$. Then multiply by the derivative of the limit, $6x^5$. The derivative is $\frac{6x^5}{1+x^6}$.'
          - problem: 'Find $\frac{d}{dx} \int_0^{2x} \sqrt{1 + t^2} \, dt$.'
            answer: '2 sqrt(1+4x^2)'
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'The integrand at the upper limit $2x$ is $\sqrt{1+(2x)^2}=\sqrt{1+4x^2}$. The derivative of the limit $2x$ is $2$. The derivative is $2\sqrt{1+4x^2}$.'
          - problem: 'A plant processes waste at the rate $r(t)=\frac{1}{1+t^2}$ tonnes per day. The total processed in the first $x^2$ days is $T(x)=\int_0^{x^2} r(t)\,dt$ tonnes. Find $T''(x)$, the rate of change of $T$ with respect to $x$.'
            answer: '2x/(1+x^4)'
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'The upper limit $x^2$ depends on $x$, so the derivative is $r(x^2)$ times the derivative of $x^2$. Here $r(x^2)=\frac{1}{1+x^4}$ and the derivative of $x^2$ is $2x$. So $T''(x)=\frac{2x}{1+x^4}$.'
          - problem: 'Find $\frac{d}{dx} \int_0^{3x+1} \sqrt{t} \, dt$.'
            answer: '3 sqrt(3x+1)'
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'The lower limit $0$ is constant and the upper limit is $3x+1$. The integrand at the upper limit is $\sqrt{3x+1}$, and the derivative of $3x+1$ is $3$. The derivative is $3\sqrt{3x+1}$.'
        constraints: "upper limit is a function of x (a power, a multiple or a sum); answer = integrand(limit) times limit'; sometimes asked at a point"
      - id: kp2
        name: Variable lower limit
        key_prerequisites: [definite-integrals-ftc]
        step_check:
          step: 'Swap the limits and introduce the minus sign'
          question: 'Why does a minus sign appear when the limits are swapped?'
          options:
            - 'The derivative of a lower limit is always negative'
            - 'Reversing the limits of an integral reverses its sign'
            - 'The integrand $\cos(t^2)$ is negative between $x$ and $3$'
            - 'A minus sign is added whenever $x$ appears in a limit'
          answer: 'Reversing the limits of an integral reverses its sign'
          why: 'Swapping the limits changes the sign of an integral, so $\int_x^3 f\,dt=-\int_3^x f\,dt$, and the derivative of the right side is $-\cos(x^2)$.'
        exemplars:
          - problem: 'Find $\frac{d}{dx} \int_x^5 t^2 \, dt$.'
            answer: '-x^2'
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'Reverse the limits to put $x$ on top: $\int_x^5 t^2\,dt=-\int_5^x t^2\,dt$. The derivative of the right side is $-x^2$.'
          - problem: 'Find $\frac{d}{dx} \int_x^2 \sin(t^2) \, dt$.'
            answer: '-sin(x^2)'
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'Swapping the limits gives $-\int_2^x \sin(t^2)\,dt$, with $x$ as the upper limit. The Fundamental Theorem then gives $-\sin(x^2)$.'
          - problem: 'Find $\frac{d}{dx} \int_x^7 \cos t \, dt$.'
            answer: '-cos(x)'
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'Swap the limits to get $-\int_7^x \cos t\,dt$. Now $x$ is the upper limit, so the derivative is $-\cos x$.'
          - problem: 'An oil pipeline will deliver oil at the rate $r(t)=t^2+2t$ barrels per hour during the first $10$ hours. The amount still to be delivered after hour $x$ is $L(x)=\int_x^{10} r(t)\,dt$ barrels. Find $L''(x)$.'
            answer: '-(x^2+2x)'
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'Reverse the limits: $L(x)=-\int_{10}^x r(t)\,dt$. So $L''(x)=-r(x)=-(x^2+2x)$. The sign is negative because the amount still to come falls as time passes.'
          - problem: 'Let $F(x)=\int_x^{16} \sqrt{t}\,dt$. Find $F''(4)$.'
            answer: '-2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Reversing the limits gives $F(x)=-\int_{16}^x \sqrt{t}\,dt$, so $F''(x)=-\sqrt{x}$. At $x=4$ this is $-2$.'
          - problem: 'Find $\frac{d}{dx} \int_x^6 \frac{1}{t^2+4} \, dt$.'
            answer: '-1/(x^2+4)'
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'Reverse the limits to get $-\int_6^x \frac{1}{t^2+4}\,dt$. The derivative is minus the integrand at $x$, which is $-\frac{1}{x^2+4}$.'
          - problem: 'Sam differentiates $\int_x^4 \sqrt{1+t^2}\,dt$ and writes $\sqrt{1+x^2}$. What is the correct derivative?'
            answer: '-sqrt(1+x^2)'
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'Sam did not notice that the variable $x$ is the lower limit. Reversing the limits introduces a minus sign, so the derivative is $-\sqrt{1+x^2}$.'
          - problem: 'Find $\frac{d}{dx} \int_{x^2}^4 e^t \, dt$.'
            answer: '-2x e^(x^2)'
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'Reverse the limits to get $-\int_4^{x^2} e^t\,dt$. The integrand at $x^2$ is $e^{x^2}$ and the derivative of $x^2$ is $2x$. The derivative is $-2xe^{x^2}$.'
          - problem: 'A battery will supply power at the rate $p(t)=\frac{12}{1+t}$ watts for the first $5$ hours. The energy still to come after hour $x$ is $E(x)=\int_x^5 p(t)\,dt$ watt-hours. Find $E''(2)$, in watts.'
            answer: '-4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Reversing the limits gives $E''(x)=-p(x)=-\frac{12}{1+x}$. At $x=2$ this is $-\frac{12}{3}=-4$ watts. The sign is negative because the energy still to come decreases.'
        constraints: "x appears in the lower limit (alone or as a power); the sign flip is the point"
      - id: kp3
        name: Analyze an accumulation function
        key_prerequisites: [definite-integrals-ftc, increasing-decreasing-intervals]
        step_check:
          step: 'At $x=-3$ the sign goes $+$ to $-$, so $g$ has a local maximum there'
          question: 'Why does a change of $g''$ from $+$ to $-$ at $x=-3$ give a local maximum of $g$?'
          options:
            - 'The integrand $t^2-9$ takes its largest value at $x=-3$'
            - 'The value $g(-3)$ is $0$, and $0$ is the largest value of $g$'
            - 'A negative derivative on the right makes $g$ negative there'
            - '$g$ rises up to $x=-3$ and then falls, so it peaks there'
          answer: '$g$ rises up to $x=-3$ and then falls, so it peaks there'
          why: 'Since $g''>0$ before $x=-3$ and $g''<0$ after it, $g$ increases and then decreases, so $x=-3$ is a local maximum.'
        exemplars:
          - problem: 'Let $g(x)=\int_0^x (t^2 - 4)\,dt$. At which $x>0$ does $g$ have a local minimum?'
            answer: '2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'By the Fundamental Theorem, $g''(x)=x^2-4$, which is zero at $x=\pm 2$. For $x>0$ the derivative changes from negative to positive at $x=2$, so $g$ has a local minimum at $x=2$.'
          - problem: 'Let $g(x)=\int_0^x (t^2 - 4)\,dt$. Find $g(3)$.'
            answer: '-3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'An antiderivative of $t^2-4$ is $\frac{t^3}{3}-4t$. So $g(3)=9-12=-3$.'
          - problem: 'Let $g(x)=\int_0^x (t^2 - 16)\,dt$. At which $x$ does $g$ have a local maximum?'
            answer: '-4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'By the Fundamental Theorem, $g''(x)=x^2-16=(x-4)(x+4)$. The derivative changes from positive to negative at $x=-4$, so $g$ has a local maximum there. At $x=4$ it changes from negative to positive, which is a local minimum.'
          - problem: 'Let $g(x)=\int_2^x (t^2 - 5t + 6)\,dt$. On which values of $x$ is $g$ increasing?'
            answer: 'x < 2 or x > 3'
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'The derivative is $g''(x)=x^2-5x+6=(x-2)(x-3)$. It is positive when $x<2$ or $x>3$, so $g$ is increasing there.'
          - problem: 'Let $g(x)=\int_0^x (t^3 - 4t)\,dt$. At which $x$ does $g$ have a local maximum?'
            answer: '0'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The derivative is $g''(x)=x^3-4x=x(x-2)(x+2)$, with zeros at $-2$, $0$ and $2$. The sign of $g''$ goes from positive to negative only at $x=0$, so the local maximum is at $x=0$.'
          - problem: 'Let $g(x)=\int_0^x \sin t\,dt$. At which $x$ in the interval $(0, 2\pi)$ does $g$ have a local maximum?'
            answer: 'pi'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'By the Fundamental Theorem, $g''(x)=\sin x$. On $(0,2\pi)$ the sine is positive before $\pi$ and negative after it, so $g$ has a local maximum at $x=\pi$.'
          - problem: 'Water enters a reservoir at the net rate $r(t)=(t-2)(t-5)$ thousand litres per hour, for $0<t<8$. The net volume gained by hour $x$ is $W(x)=\int_0^x r(t)\,dt$. At what time does $W$ have a local minimum?'
            answer: '5'
            answer_contract: {"kind":"unit","quantity":"time","unit":"h","allow_omitted":true}
            solution_sketch: 'Since $W''(x)=r(x)=(x-2)(x-5)$, the volume is falling when $2<x<5$ and rising after $x=5$. So $W$ has a local minimum at $x=5$ hours.'
          - problem: 'A company''s profit rate is $p(t)=12-3t$ thousand dollars per month for $0\le t\le 8$. The total profit after $x$ months is $P(x)=\int_0^x p(t)\,dt$. After how many months is the total profit greatest?'
            answer: '4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Since $P''(x)=p(x)=12-3x$, the derivative is positive before $x=4$ and negative after it. So the total profit is greatest after $4$ months.'
          - problem: 'A company''s profit rate is $p(t)=12-3t$ thousand dollars per month for $0\le t\le 8$. What is the greatest total profit, in thousands of dollars?'
            answer: '24'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The total profit is greatest at $t=4$. It equals $\int_0^4 (12-3t)\,dt=48-24=24$ thousand dollars.'
        constraints: "g' is the integrand; extrema and increase of g come from the sign of the integrand; contexts ask for the time and the value of a maximum"
    diagnostic_exemplar:
      problem: 'Find $\frac{d}{dx} \int_{x^2}^{5} \cos t \, dt$.'
      answer: '-2x cos(x^2)'
      solution_sketch: 'Flip the limits first: $-\frac{d}{dx}\int_{5}^{x^2}\cos t\,dt = -\cos(x^2)\cdot 2x$.'
    anki_seeds:
      - front: "d/dx ∫_a^{u(x)} f(t) dt = ?"
        back: "f(u(x)) · u'(x) — FTC part 1 composed with the chain rule"
        type: basic
      - front: "For g(x) = ∫_a^x f(t) dt, the critical points of g occur where..."
        back: "f(x) = 0 (since g' = f); g has a local min where f changes - to +"
        type: basic

  - id: average-value-function
    name: Average Value of a Function
    core: true
    difficulty: 0.65
    drill: false
    answer_kind: numeric
    expected_time_secs: 150
    prerequisites:
      - id: definite-integrals-ftc
        weight: 0.8
        key: true
      - id: continuity
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: Compute the average value
        key_prerequisites: [definite-integrals-ftc]
        try_first:
          problem: 'A car''s speed rises steadily from $10$ m/s to $30$ m/s during $4$ seconds, so $v(t)=10+5t$. What single constant speed, in metres per second, would cover the same distance in the same $4$ seconds?'
          answer_contract: {"kind":"exact"}
          answer: '20'
          reveal: 'The car covers $\int_0^4 (10+5t)\,dt=80$ m, and $\frac{80}{4}=20$ m/s. This constant speed is the average value of $v$ on $[0,4]$: the integral divided by the length of the interval.'
        step_check:
          step: 'Multiply by the front factor'
          question: 'Why is the integral multiplied by $\frac{3}{\pi}$?'
          options:
            - 'The factor $\frac{3}{\pi}$ converts the answer from radians to degrees'
            - 'The factor is the value of $\sin x$ at the right endpoint $\frac{\pi}{3}$'
            - 'Every definite integral of $\sin x$ must be scaled by $\frac{3}{\pi}$'
            - 'The average is the total divided by the length $\frac{\pi}{3}$'
          answer: 'The average is the total divided by the length $\frac{\pi}{3}$'
          why: 'The integral is a total over an interval of length $\frac{\pi}{3}$, and the average is that total divided by the length, which is the same as multiplying by $\frac{3}{\pi}$.'
        exemplars:
          - problem: 'Find the average value of $f(x)=x^2$ on $[0,3]$.'
            answer: '3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The average value is $\frac{1}{3-0}\int_0^3 x^2\,dx$. The integral is $\frac{3^3}{3}=9$, so the average is $\frac{9}{3}=3$.'
          - problem: 'Find the average value of $f(x)=\cos x$ on $[0,\pi/6]$.'
            answer: '3/pi'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The interval has length $\frac{\pi}{6}$, so the average is $\frac{6}{\pi}\int_0^{\pi/6}\cos x\,dx$. The integral is $\sin\frac{\pi}{6}=\frac12$, so the average is $\frac{6}{\pi}\cdot\frac12=\frac{3}{\pi}$.'
          - problem: 'Find the average value of $f(x)=x^3$ on $[0,2]$.'
            answer: '2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The average is $\frac12\int_0^2 x^3\,dx$. The integral is $\frac{2^4}{4}=4$, so the average is $\frac{4}{2}=2$.'
          - problem: 'A river is $6$ m wide. At a distance $x$ metres from one bank its depth is $d(x)=\frac{x(6-x)}{3}$ metres. Find the average depth of the river across its width.'
            answer: '2'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'The average depth is $\frac{1}{6}\int_0^6 \frac{x(6-x)}{3}\,dx$. The integral is $\frac13\left[3x^2-\frac{x^3}{3}\right]_0^6=\frac13(108-72)=12$, so the average depth is $\frac{12}{6}=2$ m.'
          - problem: 'Find the average value of $f(x)=\sin x$ on $[0,\pi/2]$.'
            answer: '2/pi'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The interval has length $\frac{\pi}{2}$, so the average is $\frac{2}{\pi}\int_0^{\pi/2}\sin x\,dx$. The integral is $-\cos\frac{\pi}{2}+\cos 0=1$, so the average is $\frac{2}{\pi}$.'
          - problem: 'Find the average value of $f(x)=x^2$ on $[1,3]$.'
            answer: '13/3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The interval has length $2$, so the average is $\frac12\int_1^3 x^2\,dx$. The integral is $\frac{27-1}{3}=\frac{26}{3}$, so the average is $\frac{13}{3}$.'
          - problem: 'Sam finds the average value of $f(x)=x^2$ on $[0,6]$. He computes $\int_0^6 x^2\,dx=72$ and stops there. What is the correct average value?'
            answer: '12'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Sam found the integral but did not divide by the length of the interval. The interval $[0,6]$ has length $6$, so the average value is $\frac{72}{6}=12$.'
          - problem: 'Find the average value of $f(x)=x^2$ on $[-1,1]$.'
            answer: '1/3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The interval has length $2$, so the average is $\frac12\int_{-1}^1 x^2\,dx$. The integral is $\frac{1}{3}-\left(-\frac13\right)=\frac23$, so the average is $\frac13$.'
          - problem: 'A metal rod is $2$ m long. At distance $x$ metres from one end its density is $\rho(x)=3x^2+1$ kilograms per metre. Find the average density of the rod, in kilograms per metre.'
            answer: '5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The average density is $\frac12\int_0^2 (3x^2+1)\,dx$. The integral is $\left[x^3+x\right]_0^2=10$, so the average is $\frac{10}{2}=5$.'
        constraints: "integrable functions on a given interval; exact answers (fractions, multiples of 1/pi); some in contexts (depth, density) and one error analysis"
      - id: kp2
        name: The Mean Value Theorem for integrals
        key_prerequisites: [definite-integrals-ftc, continuity]
        step_check:
          step: 'Check the interval $[1,4]$'
          question: 'Why is $c=-\sqrt{7}$ rejected?'
          options:
            - 'The theorem needs $c$ in $[1,4]$, and $-\sqrt{7}$ is outside'
            - 'A negative number $c$ always gives a negative average value'
            - 'Only the first root that is found is ever used for $c$'
            - 'The average value $7$ is positive, so the number $c$ must be positive'
          answer: 'The theorem needs $c$ in $[1,4]$, and $-\sqrt{7}$ is outside'
          why: 'The Mean Value Theorem for integrals promises a $c$ in $[1,4]$ only, so of the two roots of $c^2=7$ just $\sqrt{7}\approx 2.65$ is valid.'
        exemplars:
          - problem: 'For $f(x)=x^2$ on $[0,3]$, find the number $c$ in $[0,3]$ guaranteed by the Mean Value Theorem for integrals, the number at which $f$ takes its average value.'
            answer: 'sqrt(3)'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The average value of $x^2$ on $[0,3]$ is $\frac13\cdot 9=3$. Solve $c^2=3$ to get $c=\pm\sqrt3$. Only $\sqrt3$ lies in $[0,3]$, so $c=\sqrt{3}$.'
          - problem: 'For $f(x)=4x$ on $[1,3]$, find the number $c$ in $[1,3]$ at which $f(c)$ equals the average value of $f$.'
            answer: '2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The average value is $\frac12\int_1^3 4x\,dx=\frac{16}{2}=8$. Solve $4c=8$ to get $c=2$, which lies in $[1,3]$.'
          - problem: 'For $f(x)=4x+2$ on $[0,3]$, find the number $c$ guaranteed by the Mean Value Theorem for integrals.'
            answer: '3/2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The average value is $\frac13\int_0^3 (4x+2)\,dx=\frac{24}{3}=8$. Solve $4c+2=8$ to get $c=\frac32$, which lies in $[0,3]$.'
          - problem: 'A cyclist''s speed is $v(t)=t^2$ metres per second for $0\le t\le 9$. At what time is the cyclist''s speed equal to the average speed over these $9$ seconds?'
            answer: '3sqrt(3)'
            answer_contract: {"kind":"unit","quantity":"time","unit":"s","allow_omitted":true}
            solution_sketch: 'The average speed is $\frac19\int_0^9 t^2\,dt=\frac{243}{9}=27$ m/s. Solve $t^2=27$ to get $t=3\sqrt3$, which lies in $[0,9]$.'
          - problem: 'For $f(x)=x^2$ on $[0,6]$, find the number $c$ in $[0,6]$ at which $f(c)$ equals the average value of $f$.'
            answer: '2sqrt(3)'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The average value is $\frac16\int_0^6 x^2\,dx=\frac{72}{6}=12$. Solve $c^2=12$ to get $c=2\sqrt3$, which lies in $[0,6]$.'
          - problem: 'Water flows into a tank at the rate $r(t)=3t^2$ litres per minute for $0\le t\le 4$. At what time is the flow rate equal to its average over these $4$ minutes?'
            answer: '4sqrt(3)/3'
            answer_contract: {"kind":"unit","quantity":"time","unit":"min","allow_omitted":true}
            solution_sketch: 'The average rate is $\frac14\int_0^4 3t^2\,dt=\frac{64}{4}=16$ litres per minute. Solve $3t^2=16$ to get $t=\frac{4}{\sqrt3}=\frac{4\sqrt3}{3}$, which lies in $[0,4]$.'
          - problem: 'For $f(x)=x^3$ on $[-2,2]$, find the number $c$ in $[-2,2]$ at which $f(c)$ equals the average value of $f$.'
            answer: '0'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The function $x^3$ is odd, so $\int_{-2}^2 x^3\,dx=0$ and the average value is $0$. Solve $c^3=0$ to get $c=0$.'
          - problem: 'For $f(x)=\sqrt{x}$ on $[0,4]$, find the number $c$ in $[0,4]$ at which $f(c)$ equals the average value of $f$.'
            answer: '16/9'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The average value is $\frac14\int_0^4\sqrt{x}\,dx=\frac14\cdot\frac{16}{3}=\frac43$. Solve $\sqrt{c}=\frac43$ to get $c=\frac{16}{9}$, which lies in $[0,4]$.'
          - problem: 'Does the Mean Value Theorem for integrals apply to $f(x)=\frac{1}{x}$ on $[-1,2]$?'
            answer: 'no'
            answer_contract: {"kind":"label","options":[["no","no, it does not apply","it does not apply","does not apply","not continuous","the theorem does not apply","discontinuous"],["yes","yes, it applies","it applies","applies","the theorem applies"]]}
            solution_sketch: 'The theorem needs $f$ to be continuous on the whole interval. The function $\frac1x$ is not defined at $x=0$, which lies in $[-1,2]$, so the theorem does not apply.'
          - problem: 'For $f(x)=x^2$ on $[-1,1]$, find all numbers $c$ in $[-1,1]$ at which $f(c)$ equals the average value of $f$.'
            answer: '-sqrt(3)/3, sqrt(3)/3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The average value is $\frac12\int_{-1}^1 x^2\,dx=\frac13$. Solve $c^2=\frac13$ to get $c=\pm\frac{\sqrt3}{3}$. Both values lie in $[-1,1]$.'
        constraints: "f continuous on the interval; c solvable exactly and inside the interval; one item asks whether the theorem applies"
      - id: kp3
        name: Applied average values
        key_prerequisites: [definite-integrals-ftc]
        step_check:
          step: 'Divide by the interval length'
          question: 'Why is $150$ divided by $5$ at the end?'
          options:
            - 'Dividing by $5$ removes the constant $20$ from the temperature rule'
            - 'The number $5$ is the highest temperature reached on the interval'
            - 'The total covers $5$ hours, so dividing by $5$ gives the average'
            - 'Dividing by $5$ gives the temperature at the end of the interval'
          answer: 'The total covers $5$ hours, so dividing by $5$ gives the average'
          why: 'The integral $150$ adds up the temperature over $5$ hours, so dividing by $5$ gives the average temperature, $30$ degrees Celsius.'
        exemplars:
          - problem: 'A car''s velocity is $v(t)=3t^2$ metres per second. Find its average velocity over $[0,2]$.'
            answer: '4'
            answer_contract: {"kind":"unit","quantity":"speed","unit":"m/s","allow_omitted":true}
            solution_sketch: 'The average velocity is $\frac{1}{2}\int_0^2 3t^2\,dt$. The integral is $\left[t^3\right]_0^2=8$, so the average velocity is $\frac82=4$ m/s.'
          - problem: 'A reservoir fills at the rate $R(t)=5+3t$ litres per hour, $t$ in hours. Find the average rate over $[0,4]$.'
            answer: '11'
            answer_contract: {"kind":"unit","quantity":"flow","unit":"L/h","allow_omitted":true}
            solution_sketch: 'The average rate is $\frac14\int_0^4 (5+3t)\,dt$. The integral is $\left[5t+\frac{3t^2}{2}\right]_0^4=20+24=44$, so the average rate is $\frac{44}{4}=11$ litres per hour.'
          - problem: 'A pump moves water at the rate $r(t)=2t+1$ litres per minute, $t$ in minutes. Find the average rate over $[0,5]$.'
            answer: '6'
            answer_contract: {"kind":"unit","quantity":"flow","unit":"L/min","allow_omitted":true}
            solution_sketch: 'The average rate is $\frac15\int_0^5 (2t+1)\,dt$. The integral is $\left[t^2+t\right]_0^5=30$, so the average rate is $\frac{30}{5}=6$ litres per minute.'
          - problem: 'A particle''s velocity is $v(t)=6t^2$ metres per second, $t$ in seconds. Find its average velocity over $[0,3]$.'
            answer: '18'
            answer_contract: {"kind":"unit","quantity":"speed","unit":"m/s","allow_omitted":true}
            solution_sketch: 'The average velocity is $\frac13\int_0^3 6t^2\,dt$. The integral is $\left[2t^3\right]_0^3=54$, so the average velocity is $\frac{54}{3}=18$ m/s.'
          - problem: 'The power output of a generator is $P(t)=4t+10$ kilowatts, $t$ in hours. Find the average power over $[0,5]$, in kilowatts.'
            answer: '20'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The average power is $\frac15\int_0^5 (4t+10)\,dt$. The integral is $\left[2t^2+10t\right]_0^5=100$, so the average power is $\frac{100}{5}=20$ kilowatts.'
          - problem: 'Water flows into a tank at the rate $f(t)=3t^2+1$ litres per minute, $t$ in minutes. Find the average flow rate over $[0,2]$.'
            answer: '5'
            answer_contract: {"kind":"unit","quantity":"flow","unit":"L/min","allow_omitted":true}
            solution_sketch: 'The average flow rate is $\frac12\int_0^2 (3t^2+1)\,dt$. The integral is $\left[t^3+t\right]_0^2=10$, so the average is $\frac{10}{2}=5$ litres per minute.'
          - problem: 'The total output of a machine over an $8$-hour shift is $\int_0^8 P(t)\,dt=360$ units, where $P(t)$ is the output rate in units per hour. What is the average output rate over the shift?'
            answer: '45'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The average value of $P$ is the integral divided by the length of the interval. So the average rate is $\frac{360}{8}=45$ units per hour.'
          - problem: 'The power drawn by a heater averages $1.5$ kilowatts over a $4$-hour period. How much energy does it use in that period, in kilowatt-hours?'
            answer: '6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The average power is the total energy divided by the length of the period. So the energy is the average power times the length, $1.5\cdot 4=6$ kilowatt-hours.'
          - problem: 'A particle''s velocity is $v(t)=t-3$ metres per second, $t$ in seconds. Find its average velocity over $[0,5]$.'
            answer: '-1/2'
            answer_contract: {"kind":"unit","quantity":"speed","unit":"m/s","allow_omitted":true}
            solution_sketch: 'The average velocity is $\frac15\int_0^5 (t-3)\,dt$. The integral is $\frac{25}{2}-15=-\frac52$, so the average velocity is $-\frac12$ m/s. The negative sign means the particle ends up behind its start.'
        constraints: "linear or quadratic rates with units; a total divided by a length, and an average times a length"
    diagnostic_exemplar:
      problem: 'For $f(x) = 3x^2$ on $[0, 2]$, find the $c$ guaranteed by the Mean Value Theorem for integrals (the $c$ in $[0, 2]$ with $f(c)$ equal to the average value of $f$).'
      answer: "2√3/3"
      solution_sketch: 'Average value $\frac{1}{2}\int_0^2 3x^2\,dx = 4$; solve $3c^2 = 4$: $c = \frac{2}{\sqrt 3} = \frac{2\sqrt 3}{3}$.'
    anki_seeds:
      - front: "Average value of f on [a, b] = ?"
        back: "(1/(b - a)) ∫_a^b f(x) dx"
        type: basic
      - front: "MVT for integrals: a continuous f on [a,b] attains its average value..."
        back: "at some c in [a, b]: f(c) = (1/(b-a)) ∫_a^b f"
        type: basic

  - id: area-under-a-curve
    name: Area Between a Curve and the x-Axis
    core: true
    difficulty: 0.65
    drill: false
    answer_kind: numeric
    expected_time_secs: 210
    prerequisites:
      - id: definite-integrals-ftc
        weight: 0.8
        key: true
      - id: definite-integrals-as-area
        weight: 0.5
        key: true
      - id: quadratic-equations-factoring
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: Area when f ≥ 0
        key_prerequisites: [definite-integrals-ftc, definite-integrals-as-area]
        step_check:
          step: 'Check the sign: on $[-3,3]$ the parabola sits above the axis'
          question: 'Why can the integral be used directly as the area here?'
          options:
            - 'Every integral of a parabola is positive on every interval'
            - 'The curve is above the axis, so the integral has no negative part'
            - 'The limits are symmetric about $0$, so the halves add up to the area'
            - 'The limits are roots, so the integral between them is positive'
          answer: 'The curve is above the axis, so the integral has no negative part'
          why: 'On $[-3,3]$ we have $9-x^2\geq 0$, so every piece of the integral is positive and the integral equals the area.'
        exemplars:
          - problem: 'Find the area under $y=x^2$ from $x=0$ to $x=3$.'
            answer: '9'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The curve lies above the $x$-axis, so the area is the integral. It is $\int_0^3 x^2\,dx=\frac{3^3}{3}=9$.'
          - problem: 'Find the area enclosed by $y=4-x^2$ and the $x$-axis.'
            answer: '32/3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The curve meets the axis where $4-x^2=0$, at $x=\pm2$, and it lies above the axis between them. The area is $\int_{-2}^2 (4-x^2)\,dx=16-\frac{16}{3}=\frac{32}{3}$.'
          - problem: 'A footbridge arch is modelled by $y=12-3x^2$, where $x$ and $y$ are in metres and the ground is the $x$-axis. Find the area of the opening under the arch.'
            answer: '32'
            answer_contract: {"kind":"unit","quantity":"area","unit":"m^2","allow_omitted":true}
            solution_sketch: 'The arch meets the ground where $12-3x^2=0$, at $x=\pm2$. The area is $\int_{-2}^2 (12-3x^2)\,dx=2(24-8)=32$ square metres.'
          - problem: 'Find the area under $y=x^2+2$ from $x=0$ to $x=3$.'
            answer: '15'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The curve lies above the axis, so the area is $\int_0^3 (x^2+2)\,dx$. This is $\left[\frac{x^3}{3}+2x\right]_0^3=9+6=15$.'
          - problem: 'A rectangle of height $4$ has the same area as the region under $y=3x^2$ from $x=1$ to $x=3$. Find the width of the rectangle.'
            answer: '13/2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The area under the curve is $\int_1^3 3x^2\,dx=27-1=26$. The rectangle has area $4w$, so $4w=26$ and $w=\frac{26}{4}=\frac{13}{2}$.'
          - problem: 'Find the area enclosed by $y=16-x^2$ and the $x$-axis.'
            answer: '256/3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The curve meets the axis at $x=\pm4$ and lies above it between them. The area is $\int_{-4}^4 (16-x^2)\,dx=128-\frac{128}{3}=\frac{256}{3}$.'
          - problem: 'Sam says the area enclosed by $y=1-x^2$ and the $x$-axis is $\frac23$, because he integrated from $0$ to $1$. What is the correct area?'
            answer: '4/3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The curve meets the axis at $x=-1$ and $x=1$, so the enclosed region extends on both sides of $x=0$. Sam found only the right half, $\frac23$, so the area is $\int_{-1}^1 (1-x^2)\,dx=\frac43$.'
          - problem: 'Find the area under $y=\sqrt{x}$ from $x=0$ to $x=9$.'
            answer: '18'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The area is $\int_0^9 \sqrt{x}\,dx=\left[\frac23 x^{3/2}\right]_0^9$. Since $9^{3/2}=27$, the area is $\frac23\cdot27=18$.'
          - problem: 'The opening under the arch $y=12-3x^2$ metres is to be covered with a banner that costs $5$ dollars per square metre. How much does the banner cost?'
            answer: '160'
            answer_contract: {"kind":"unit","quantity":"dollar","unit":"dollar","allow_omitted":true}
            solution_sketch: 'The area of the opening is $\int_{-2}^2 (12-3x^2)\,dx=32$ square metres. The cost is the area times the price per square metre, $32\cdot5=160$ dollars.'
        constraints: "nonnegative integrand on the interval; find the roots when the region is enclosed; contexts (arch, rectangle of equal area, cost) and one error analysis"
      - id: kp2
        name: Total area when f changes sign
        key_prerequisites: [definite-integrals-ftc, quadratic-equations-factoring]
        try_first:
          problem: 'The line $y=x-1$ and the $x$-axis form two triangles over $[0,2]$, each with base $1$ and height $1$. What is the value of $\int_0^2 (x-1)\,dx$?'
          answer_contract: {"kind":"exact"}
          answer: '0'
          reveal: 'Each triangle has area $\frac12$, but one lies below the axis and counts as $-\frac12$, so the integral is $0$ while the total area is $1$. To find a total area, split at the root and add the absolute values of the pieces.'
        step_check:
          step: 'take the absolute value of each piece and add them'
          question: 'Why is the absolute value of the left piece taken?'
          options:
            - 'A piece to the left of the root is always counted as a positive number'
            - 'Taking absolute values makes every antiderivative nonnegative'
            - 'The curve is below the axis there, so its integral is negative'
            - 'The absolute value stops the two pieces from being added twice'
          answer: 'The curve is below the axis there, so its integral is negative'
          why: 'On $[0,2]$ the curve $y=x^2-4$ lies below the axis, so its integral $-\frac{16}{3}$ is negative, but an area is never negative.'
        exemplars:
          - problem: 'Find the total area between $y=x^2-1$ and the $x$-axis over $[0,2]$.'
            answer: '2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The curve crosses the axis at $x=1$. On $[0,1]$ the integral is $-\frac23$, so that area is $\frac23$. On $[1,2]$ the integral is $\frac43$, so the total area is $\frac23+\frac43=2$.'
          - problem: 'Find the net signed area between $y=x^2-4$ and the $x$-axis over $[0,3]$.'
            answer: '-3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The net signed area is the single integral over the whole interval, with no splitting. It is $\int_0^3 (x^2-4)\,dx=9-12=-3$.'
          - problem: 'Find the total area between $y=x^2-4$ and the $x$-axis over $[0,3]$.'
            answer: '23/3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The curve crosses the axis at $x=2$. The integral on $[0,2]$ is $-\frac{16}{3}$, so that area is $\frac{16}{3}$. The integral on $[2,3]$ is $\frac73$, so the total area is $\frac{16}{3}+\frac73=\frac{23}{3}$.'
          - problem: 'Find the total area between $y=4-x^2$ and the $x$-axis over $[1,4]$.'
            answer: '37/3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The curve crosses the axis at $x=2$. On $[1,2]$ the integral is $\frac53$, and on $[2,4]$ it is $-\frac{32}{3}$. The total area is $\frac53+\frac{32}{3}=\frac{37}{3}$.'
          - problem: 'A ball is thrown straight up from the ground with velocity $v(t)=20-10t$ metres per second. How far does it travel during its first $3$ seconds?'
            answer: '25'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'The velocity is positive until $t=2$ and negative after it. The distance up is $\int_0^2 (20-10t)\,dt=20$ m, and the distance down is $\left|\int_2^3 (20-10t)\,dt\right|=5$ m. The total distance is $20+5=25$ m.'
          - problem: 'Find the total area between $y=x^2-x-2$ and the $x$-axis over $[0,3]$.'
            answer: '31/6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Factor $x^2-x-2=(x-2)(x+1)$, so the curve crosses the axis at $x=2$ on this interval. The integral on $[0,2]$ is $-\frac{10}{3}$ and on $[2,3]$ it is $\frac{11}{6}$. The total area is $\frac{10}{3}+\frac{11}{6}=\frac{31}{6}$.'
          - problem: 'A particle moves along a line with velocity $v(t)=t-3$ metres per second for $0\le t\le5$. Find the total distance it travels.'
            answer: '13/2'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'The velocity changes sign at $t=3$. The distance on $[0,3]$ is $\frac92$ m and the distance on $[3,5]$ is $2$ m. The total distance is $\frac92+2=\frac{13}{2}$ m.'
          - problem: 'Sam computes $\int_0^3 (x^2-1)\,dx=6$ and says the total area between $y=x^2-1$ and the $x$-axis over $[0,3]$ is $6$. What is the correct total area?'
            answer: '22/3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The curve crosses the axis at $x=1$, so Sam let the part below the axis cancel part of the area. On $[0,1]$ the area is $\frac23$, and on $[1,3]$ it is $\frac{20}{3}$. The total area is $\frac{22}{3}$.'
          - problem: 'Find the total area between $y=\sin x$ and the $x$-axis over $[0,3\pi/2]$.'
            answer: '3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The sine is positive on $[0,\pi]$ and negative on $[\pi,3\pi/2]$. The first area is $\int_0^\pi \sin x\,dx=2$ and the second is $\left|\int_\pi^{3\pi/2}\sin x\,dx\right|=1$. The total area is $3$.'
          - problem: 'Find the total area between $y=x^2-9$ and the $x$-axis over $[0,4]$.'
            answer: '64/3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Factor $x^2-9=(x-3)(x+3)$, so the sign changes at $x=3$. The integral on $[0,3]$ is $-18$ and on $[3,4]$ it is $\frac{10}{3}$. The total area is $18+\frac{10}{3}=\frac{64}{3}$.'
        constraints: "one interior sign change at an integer or simple root; net signed area and total area asked as separate questions; contexts with velocity"
      - id: kp3
        name: Symmetry and the odd-function trap
        key_prerequisites: [definite-integrals-ftc, definite-integrals-as-area]
        step_check:
          step: 'On $[-1, 0]$ the curve lies below the axis and contributes $-\frac{1}{6}$'
          question: 'Why does the signed integral over $[-1,1]$ come out as $0$?'
          options:
            - 'The halves have equal size and opposite sign, so they cancel'
            - 'The curve is zero everywhere on the interval, so the integral is zero'
            - 'The curve touches the axis at both ends, so no area lies between them'
            - 'An antiderivative of $x^5$ equals $0$ at both endpoints $-1$ and $1$'
          answer: 'The halves have equal size and opposite sign, so they cancel'
          why: 'The part on $[-1,0]$ contributes $-\frac16$ and the part on $[0,1]$ contributes $+\frac16$, so the signed integral is $0$ while the area is $\frac13$.'
        exemplars:
          - problem: 'Find the total area between $y=x^5$ and the $x$-axis on $[-1,1]$.'
            answer: '1/3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The function $x^5$ is odd, so the two halves are mirror images and have equal area. Each half has area $\int_0^1 x^5\,dx=\frac16$, so the total area is $2\cdot\frac16=\frac13$.'
          - problem: 'Evaluate $\int_{-\pi/2}^{\pi/2}\sin x\,dx$.'
            answer: '0'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The sine is an odd function and the interval is symmetric about $0$. The two halves cancel, and an antiderivative check agrees: $-\cos\frac{\pi}{2}+\cos\left(-\frac{\pi}{2}\right)=0$.'
          - problem: 'Find the total area between $y=\sin x$ and the $x$-axis over $[-\pi/2,\pi/2]$.'
            answer: '2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The sine is odd, so the area on $[-\pi/2,0]$ equals the area on $[0,\pi/2]$. The right half has area $\int_0^{\pi/2}\sin x\,dx=1$, so the total area is $2$.'
          - problem: 'An odd function $f$ is positive on $(0,3]$, and $\int_0^3 f(x)\,dx=7$. Find the total area between the graph of $f$ and the $x$-axis over $[-3,3]$.'
            answer: '14'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Because $f$ is odd, the graph on $[-3,0]$ is the mirror image of the graph on $[0,3]$, turned upside down. Both parts have area $7$, so the total area is $7+7=14$.'
          - problem: 'Evaluate $\int_{-2}^{2}(x^2-1)\,dx$.'
            answer: '4/3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'An antiderivative of $x^2-1$ is $\frac{x^3}{3}-x$. So the integral is $\left(\frac83-2\right)-\left(-\frac83+2\right)=\frac43$.'
          - problem: 'Find the total area between $y=x^2-1$ and the $x$-axis over $[-2,2]$.'
            answer: '4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The function is even, so double the area on $[0,2]$. On $[0,1]$ the area is $\frac23$ and on $[1,2]$ it is $\frac43$, so the half is $2$ and the total area is $4$.'
          - problem: 'A mass on a spring moves with velocity $v(t)=\sin t$ metres per second for $0\le t\le2\pi$. How far does it travel altogether?'
            answer: '4'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'The velocity is positive on $[0,\pi]$ and negative on $[\pi,2\pi]$, and each part covers $\int_0^\pi\sin t\,dt=2$ m. The mass ends where it started, but the total distance is $2+2=4$ m.'
          - problem: 'Sam argues that the area between $y=x^3$ and the $x$-axis over $[-2,2]$ is $0$, because $\int_{-2}^2 x^3\,dx=0$. What is the correct area?'
            answer: '8'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The integral is $0$ because the halves cancel, but area counts both halves as positive. Each half is $\int_0^2 x^3\,dx=4$, so the area is $4+4=8$.'
          - problem: 'Find the total area between $y=x^3$ and the $x$-axis over $[-1,2]$.'
            answer: '17/4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The curve crosses the axis at $x=0$. On $[-1,0]$ the integral is $-\frac14$, so that area is $\frac14$. On $[0,2]$ the area is $4$, so the total is $\frac14+4=\frac{17}{4}$.'
          - problem: 'A beam bends so that, at distance $x$ metres from its midpoint, it lies $x^3$ metres above its rest line, for $-1\le x\le1$ (below the rest line where $x^3$ is negative). A template is cut to fill the region between the bent beam and its rest line. Find the area of the template.'
            answer: '1/2'
            answer_contract: {"kind":"unit","quantity":"area","unit":"m^2","allow_omitted":true}
            solution_sketch: 'The template has two parts, one above the rest line and one below it. By symmetry each part has area $\int_0^1 x^3\,dx=\frac14$, so the area is $\frac14+\frac14=\frac12$ square metres.'
          - problem: 'Find the total area between $y=\sin x$ and the $x$-axis over $[0,2\pi]$.'
            answer: '4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The sine is positive on $[0,\pi]$ and negative on $[\pi,2\pi]$. Each arch has area $2$, so the total area is $4$, even though $\int_0^{2\pi}\sin x\,dx=0$.'
        constraints: "odd and even functions on symmetric intervals; the signed integral and the total area are asked as separate questions; one error analysis"
    diagnostic_exemplar:
      problem: 'Find the total area between $y = x$ and the x-axis over $[-1, 2]$.'
      answer: "5/2"
      solution_sketch: 'Two triangles: $\frac{1}{2} + 2 = \frac{5}{2}$ (the integral itself is $\frac{3}{2}$).'
    anki_seeds:
      - front: "To find TOTAL area between f and the x-axis, you must..."
        back: "split the interval at the roots of f and add the absolute values of the pieces"
        type: basic
      - front: "Net signed area vs total area: when do they agree?"
        back: "when f does not change sign on the interval"
        type: basic

  - id: net-change-total-distance
    name: Net Change and Total Distance
    core: false                # interpretation/application of the definite integral
    difficulty: 0.65
    drill: false
    answer_kind: numeric
    expected_time_secs: 240
    prerequisites:
      - id: definite-integrals-ftc
        weight: 0.8
        key: true
      - id: motion-along-a-line
        weight: 0.6
        key: true
      - id: area-under-a-curve
        weight: 0.4
      - id: antiderivatives
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: Displacement vs total distance
        key_prerequisites: [definite-integrals-ftc, motion-along-a-line, area-under-a-curve]
        try_first:
          problem: 'A ball is thrown straight up with velocity $v(t)=10-5t$ metres per second. What is its displacement during $0\le t\le4$?'
          answer_contract: {"kind":"exact"}
          answer: '0'
          reveal: 'The ball rises $10$ m for $2$ seconds and then falls $10$ m, so its displacement is $\int_0^4 (10-5t)\,dt=0$ although it travels $20$ m. Displacement adds signed amounts, while distance adds absolute amounts.'
        step_check:
          step: 'split the interval at $t = 3$ and integrate each piece'
          question: 'Why is the interval split at $t=3$ before the distance is found?'
          options:
            - 'The particle reverses direction at $t=3$, so $v$ changes sign'
            - 'The integral cannot be evaluated across $t=3$ in one step'
            - 'The velocity has its largest value at $t=3$'
            - 'The time $t=3$ is a whole number, which makes splitting necessary'
          answer: 'The particle reverses direction at $t=3$, so $v$ changes sign'
          why: 'The velocity is negative before $t=3$ and positive after it, so the integral would subtract the backward motion; splitting lets us add both parts as distances.'
        exemplars:
          - problem: 'A particle has velocity $v(t)=t^2-4$ metres per second on $[0,3]$. Find its displacement.'
            answer: '-3'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'Displacement is the integral of the velocity. So $\int_0^3 (t^2-4)\,dt=9-12=-3$ m, which means the particle ends up $3$ m behind its start.'
          - problem: 'A particle has velocity $v(t)=t^2-4$ metres per second on $[0,3]$. Find the total distance it travels.'
            answer: '23/3'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'The velocity is zero at $t=2$ and changes sign there. On $[0,2]$ the particle moves back $\frac{16}{3}$ m, and on $[2,3]$ it moves forward $\frac73$ m. The total distance is $\frac{16}{3}+\frac73=\frac{23}{3}$ m.'
          - problem: 'A particle has velocity $v(t)=t-1$ metres per second on $[0,3]$. Find its displacement.'
            answer: '3/2'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'The displacement is $\int_0^3 (t-1)\,dt=\frac92-3=\frac32$ m. The particle ends up $\frac32$ m ahead of its start.'
          - problem: 'A particle has velocity $v(t)=t^2-1$ metres per second on $[0,2]$. Find the total distance it travels.'
            answer: '2'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'The velocity changes sign at $t=1$. On $[0,1]$ the particle moves $\frac23$ m backward, and on $[1,2]$ it moves $\frac43$ m forward. The total distance is $\frac23+\frac43=2$ m.'
          - problem: 'A cyclist rides along a straight road with velocity $v(t)=3t-6$ kilometres per hour for $0\le t\le4$, where positive means east. How far is she from her starting point at $t=4$?'
            answer: '0'
            answer_contract: {"kind":"unit","quantity":"length","unit":"km","allow_omitted":true}
            solution_sketch: 'Her displacement is $\int_0^4 (3t-6)\,dt=24-24=0$ km. She is back at her starting point, even though she rode away from it and returned.'
          - problem: 'A cyclist rides along a straight road with velocity $v(t)=3t-6$ kilometres per hour for $0\le t\le4$. How far does she ride in total?'
            answer: '12'
            answer_contract: {"kind":"unit","quantity":"length","unit":"km","allow_omitted":true}
            solution_sketch: 'The velocity changes sign at $t=2$. She rides $\left|\int_0^2 (3t-6)\,dt\right|=6$ km west and $\int_2^4 (3t-6)\,dt=6$ km east. In total she rides $6+6=12$ km.'
          - problem: 'A particle has velocity $v(t)=3t-6$ metres per second on $[0,3]$. Find the total distance it travels.'
            answer: '15/2'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'The velocity changes sign at $t=2$. On $[0,2]$ the particle moves back $6$ m, and on $[2,3]$ it moves forward $\frac32$ m. The total distance is $6+\frac32=\frac{15}{2}$ m.'
          - problem: 'A cyclist rides along a straight road with velocity $v(t)=3t-6$ kilometres per hour for $0\le t\le4$. What is her average speed over these $4$ hours?'
            answer: '3'
            answer_contract: {"kind":"unit","quantity":"speed","unit":"km/h","allow_omitted":true}
            solution_sketch: 'Average speed is the total distance divided by the time taken. She rides $12$ km in $4$ hours, so her average speed is $\frac{12}{4}=3$ km/h.'
          - problem: 'A particle has velocity $v(t)=t-3$ metres per second on $[0,5]$. Find its displacement.'
            answer: '-5/2'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'The displacement is $\int_0^5 (t-3)\,dt=\frac{25}{2}-15=-\frac52$ m. The negative sign means the particle ends up behind its start.'
          - problem: 'Sam integrates the velocity $v(t)=4-2t$ metres per second over $[0,5]$, gets $-5$, and says the particle travels $5$ m in total. What is the correct total distance?'
            answer: '13'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'The integral $-5$ is the displacement, not the distance. The velocity changes sign at $t=2$: the particle moves forward $4$ m, then back $9$ m, so the total distance is $4+9=13$ m.'
        constraints: "v changes sign at most once, at a simple time; displacement, total distance and average speed are asked as separate questions"
      - id: kp2
        name: Recover position from velocity
        key_prerequisites: [antiderivatives, motion-along-a-line]
        step_check:
          step: 'Substitute $t = 0$ and $s(0) = 5$'
          question: 'Why is $s(0)=5$ substituted into the antiderivative?'
          options:
            - 'It checks that the velocity at time $0$ is equal to the number $5$'
            - 'It makes the position at every time equal to the start position $5$'
            - 'It removes the term $2t^2$ from the position function for good'
            - 'The constant $C$ is fixed by the known start position'
          answer: 'The constant $C$ is fixed by the known start position'
          why: 'The antiderivative $2t^2-3t+C$ describes every position function with this velocity, and the start position $s(0)=5$ selects the one with $C=5$.'
        exemplars:
          - problem: 'A particle moves along a line with velocity $v(t)=2t+1$ metres per second and starts at position $s(0)=3$ metres. Find $s(2)$.'
            answer: '9'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'Position is an antiderivative of velocity, so $s(t)=t^2+t+C$. The condition $s(0)=3$ gives $C=3$, so $s(2)=4+2+3=9$ m.'
          - problem: 'A particle moves along a line with velocity $v(t)=4t-5$ and has position $s(2)=1$. Find the position function $s(t)$.'
            answer: '2t^2 - 5t + 3'
            answer_contract: {"kind":"function","vars":["t"]}
            solution_sketch: 'An antiderivative of $4t-5$ is $2t^2-5t$, so $s(t)=2t^2-5t+C$. The condition $s(2)=1$ gives $8-10+C=1$, so $C=3$ and $s(t)=2t^2-5t+3$.'
          - problem: 'A ball is thrown straight up from a roof $10$ feet above the ground, with velocity $v(t)=-32t+64$ feet per second. Find the height of the ball above the ground at $t=3$ seconds.'
            answer: '58'
            answer_contract: {"kind":"unit","quantity":"length","unit":"ft","allow_omitted":true}
            solution_sketch: 'The height is $h(t)=-16t^2+64t+C$, and $h(0)=10$ gives $C=10$. So $h(3)=-144+192+10=58$ feet.'
          - problem: 'A particle has velocity $v(t)=4t+3$ and initial position $s(0)=2$. Find $s(3)$.'
            answer: '29'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'An antiderivative of the velocity is $2t^2+3t$, so $s(t)=2t^2+3t+C$. The condition $s(0)=2$ gives $C=2$, so $s(3)=18+9+2=29$.'
          - problem: 'A particle has velocity $v(t)=6t-4$ and its position at time $t=2$ is $s(2)=10$. Find the initial position $s(0)$.'
            answer: '6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The position is $s(t)=3t^2-4t+C$. The condition $s(2)=10$ gives $12-8+C=10$, so $C=6$. The initial position is $s(0)=C=6$.'
          - problem: 'A particle moves along a line with velocity $v(t)=2t-4$ metres per second and starts at the origin. At what time after $t=0$ does it return to the origin?'
            answer: '4'
            answer_contract: {"kind":"unit","quantity":"time","unit":"s","allow_omitted":true}
            solution_sketch: 'The position is $s(t)=t^2-4t+C$, and $s(0)=0$ gives $C=0$. Then $s(t)=t(t-4)=0$ at $t=0$ and $t=4$, so the particle returns after $4$ seconds.'
          - problem: 'A particle has velocity $v(t)=t^2-6t+8$ and initial position $s(0)=4$. Find $s(5)$.'
            answer: '32/3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The position is $s(t)=\frac{t^3}{3}-3t^2+8t+C$, and $s(0)=4$ gives $C=4$. So $s(5)=\frac{125}{3}-75+40+4=\frac{32}{3}$.'
          - problem: 'A ball is thrown straight up from a roof $10$ feet above the ground, with velocity $v(t)=-32t+64$ feet per second. Write the height $h(t)$ of the ball above the ground.'
            answer: '-16t^2 + 64t + 10'
            answer_contract: {"kind":"function","vars":["t"]}
            solution_sketch: 'The height is an antiderivative of the velocity, so $h(t)=-16t^2+64t+C$. The ball starts on the roof, so $h(0)=10$ and $C=10$. Hence $h(t)=-16t^2+64t+10$.'
          - problem: 'A particle has velocity $v(t)=3t^2+2$ and position $s(1)=5$. Sam writes $s(t)=t^3+2t$ and says $s(2)=12$. What is the correct value of $s(2)$?'
            answer: '14'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Sam dropped the constant of integration. The position is $s(t)=t^3+2t+C$, and $s(1)=5$ gives $3+C=5$, so $C=2$. Then $s(2)=8+4+2=14$.'
        constraints: "polynomial velocity; an initial or other known position pins down C; answers are a value, a time or the position function"
      - id: kp3
        name: Recover velocity from acceleration
        key_prerequisites: [antiderivatives, motion-along-a-line]
        step_check:
          step: 'substitute $t = 0$ and $v(0) = 5$ into $v(t) = 2t^2 + 3t + C$'
          question: 'Why is $t=0$ substituted into $v(t)=2t^2+3t+C$?'
          options:
            - 'The antiderivative is valid only at the single time $t=0$'
            - 'The velocity $5$ is given at $t=0$, so this fixes $C$'
            - 'It turns the acceleration into a position function'
            - 'The velocity must always be zero at the time $t=0$'
          answer: 'The velocity $5$ is given at $t=0$, so this fixes $C$'
          why: 'The initial condition $v(0)=5$ gives $0+0+C=5$, so $C=5$ and $v(t)=2t^2+3t+5$.'
        exemplars:
          - problem: 'A particle has acceleration $a(t)=6t$ $\text{m/s}^2$ and initial velocity $v(0)=-2$ m/s. Find its velocity at $t=2$.'
            answer: '10'
            answer_contract: {"kind":"unit","quantity":"speed","unit":"m/s","allow_omitted":true}
            solution_sketch: 'Velocity is an antiderivative of acceleration, so $v(t)=3t^2+C$. The condition $v(0)=-2$ gives $C=-2$, so $v(2)=12-2=10$ m/s.'
          - problem: 'An object has acceleration $a(t)=-10$ $\text{m/s}^2$ and initial velocity $v(0)=20$ m/s. At what time is its velocity zero?'
            answer: '2'
            answer_contract: {"kind":"unit","quantity":"time","unit":"s","allow_omitted":true}
            solution_sketch: 'The velocity is $v(t)=-10t+C$, and $v(0)=20$ gives $C=20$. Solving $20-10t=0$ gives $t=2$ seconds.'
          - problem: 'A particle has acceleration $a(t)=8t+1$ $\text{m/s}^2$ and initial velocity $v(0)=5$ m/s. Find its velocity at $t=3$.'
            answer: '44'
            answer_contract: {"kind":"unit","quantity":"speed","unit":"m/s","allow_omitted":true}
            solution_sketch: 'The velocity is $v(t)=4t^2+t+C$, and $v(0)=5$ gives $C=5$. So $v(3)=36+3+5=44$ m/s.'
          - problem: 'A car travelling at $25$ m/s brakes with constant deceleration $5$ $\text{m/s}^2$. How long does it take to stop?'
            answer: '5'
            answer_contract: {"kind":"unit","quantity":"time","unit":"s","allow_omitted":true}
            solution_sketch: 'The acceleration is $a(t)=-5$, so $v(t)=-5t+C$, and $v(0)=25$ gives $C=25$. The car stops when $25-5t=0$, which is at $t=5$ seconds.'
          - problem: 'A particle has acceleration $a(t)=4t-2$ $\text{m/s}^2$ and initial velocity $v(0)=-1$ m/s. Find its velocity at $t=2$.'
            answer: '3'
            answer_contract: {"kind":"unit","quantity":"speed","unit":"m/s","allow_omitted":true}
            solution_sketch: 'The velocity is $v(t)=2t^2-2t+C$, and $v(0)=-1$ gives $C=-1$. So $v(2)=8-4-1=3$ m/s.'
          - problem: 'A cart has acceleration $a(t)=2t+7$ $\text{m/s}^2$ and initial velocity $v(0)=3$ m/s. Find its velocity at $t=4$.'
            answer: '47'
            answer_contract: {"kind":"unit","quantity":"speed","unit":"m/s","allow_omitted":true}
            solution_sketch: 'The velocity is $v(t)=t^2+7t+C$, and $v(0)=3$ gives $C=3$. So $v(4)=16+28+3=47$ m/s.'
          - problem: 'A rocket sled starts from rest and has acceleration $a(t)=6t$ $\text{m/s}^2$. Find its velocity after $4$ seconds.'
            answer: '48'
            answer_contract: {"kind":"unit","quantity":"speed","unit":"m/s","allow_omitted":true}
            solution_sketch: 'Starting from rest means $v(0)=0$. The velocity is $v(t)=3t^2+C$ with $C=0$, so $v(4)=3\cdot16=48$ m/s.'
          - problem: 'A car travelling at $25$ m/s brakes with constant deceleration $5$ $\text{m/s}^2$. How far does it travel before it stops?'
            answer: '125/2'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'The velocity is $v(t)=25-5t$, so the car stops at $t=5$ seconds. Its position is $s(t)=25t-\frac52t^2$, so the stopping distance is $s(5)=125-\frac{125}{2}=\frac{125}{2}$ m.'
          - problem: 'A particle has acceleration $a(t)=2t$ $\text{m/s}^2$ and initial velocity $v(0)=3$ m/s. Sam writes $v(t)=t^2$ and says $v(3)=9$ m/s. What is the correct velocity at $t=3$?'
            answer: '12'
            answer_contract: {"kind":"unit","quantity":"speed","unit":"m/s","allow_omitted":true}
            solution_sketch: 'Sam left out the initial velocity, which is the constant of integration. The velocity is $v(t)=t^2+C$ and $v(0)=3$ gives $C=3$, so $v(3)=9+3=12$ m/s.'
        constraints: "constant or linear acceleration; an initial velocity pins down C; answers are a velocity, a time or a distance"
    diagnostic_exemplar:
      problem: 'A particle has velocity $v(t) = 2t - 4$ on $[0, 3]$. Find the total distance traveled.'
      answer: "5"
      solution_sketch: '$v$ changes sign at $t = 2$: $|{-4}| + 1 = 5$.'
    anki_seeds:
      - front: "Displacement over [a,b] = ∫ v dt. Total distance = ?"
        back: "∫ |v(t)| dt — split at the times where v changes sign"
        type: basic
      - front: "From acceleration to position requires..."
        back: "two antidifferentiations, each fixed by an initial condition (v₀, then s₀)"
        type: basic

  - id: u-substitution-basics
    name: Basic u-Substitution
    core: true
    difficulty: 0.65
    drill: false
    answer_kind: expression
    expected_time_secs: 180
    prerequisites:
      - id: antiderivatives
        weight: 0.8
        key: true
      - id: chain-rule
        weight: 0.7
        key: true
    knowledge_points:
      - id: kp1
        name: 'Recognize u and du directly'
        key_prerequisites: [antiderivatives, chain-rule]
        step_check:
          step: 'so no constant adjustment is needed'
          question: 'Why is no constant adjustment needed in this step?'
          options:
            - 'Constants always drop out of an integral before the substitution starts'
            - 'The factor $3x^2$ is exactly $du$, so nothing is left to rescale'
            - 'The power $6$ is large, so the constant factor cancels itself'
          answer: 'The factor $3x^2$ is exactly $du$, so nothing is left to rescale'
          why: 'The integrand holds $3x^2\,dx$, and that is exactly $du$. So the whole integral becomes $\int u^6\,du$ with no extra constant.'
        exemplars:
          - problem: 'Find $\int 2x(x^2 + 1)^4\,dx$.'
            answer: '(x^2 + 1)^5/5 + C'
            answer_contract: {"kind": "function", "vars": ["x"], "up_to_constant": true}
            solution_sketch: 'Let $u = x^2 + 1$, so $du = 2x\,dx$. This is exactly the factor outside the power. The integral becomes $\int u^4\,du = \frac{u^5}{5} + C$, and putting back $u = x^2 + 1$ gives $\frac{(x^2+1)^5}{5} + C$.'
          - problem: 'Find $\int 4x^3(x^4 + 2)^3\,dx$.'
            answer: '(x^4 + 2)^4/4 + C'
            answer_contract: {"kind": "function", "vars": ["x"], "up_to_constant": true}
            solution_sketch: 'Take $u = x^4 + 2$, so $du = 4x^3\,dx$. That is exactly the factor outside the power. The integral becomes $\int u^3\,du = \frac{u^4}{4} + C$, so the answer is $\frac{(x^4+2)^4}{4} + C$. Differentiating this returns $4x^3(x^4+2)^3$.'
          - problem: 'Find $\int 6x^2 e^{2x^3}\,dx$.'
            answer: 'e^(2x^3) + C'
            answer_contract: {"kind": "function", "vars": ["x"], "up_to_constant": true}
            solution_sketch: 'Let $u = 2x^3$, so $du = 6x^2\,dx$. This is exactly the remaining factor of the integrand. The integral becomes $\int e^u\,du = e^u + C$, so the answer is $e^{2x^3} + C$.'
          - problem: 'Find $\int 3x^2 \sec^2(x^3)\,dx$.'
            answer: 'tan(x^3) + C'
            answer_contract: {"kind": "function", "vars": ["x"], "up_to_constant": true}
            solution_sketch: 'Let $u = x^3$, so $du = 3x^2\,dx$. This is exactly the factor that multiplies the secant. The integral becomes $\int \sec^2 u\,du = \tan u + C$, so the answer is $\tan(x^3) + C$.'
          - problem: 'Find $\int \cos^2 x\,\sin x\,dx$.'
            answer: '-cos(x)^3/3 + C'
            answer_contract: {"kind": "function", "vars": ["x"], "up_to_constant": true}
            solution_sketch: 'Let $u = \cos x$, so $du = -\sin x\,dx$ and $\sin x\,dx = -du$. The integral becomes $-\int u^2\,du = -\frac{u^3}{3} + C$. Putting back $u = \cos x$ gives $-\frac{\cos^3 x}{3} + C$.'
          - problem: 'Find $\int \cos x\,\sin^4 x\,dx$.'
            answer: 'sin(x)^5/5 + C'
            answer_contract: {"kind": "function", "vars": ["x"], "up_to_constant": true}
            solution_sketch: 'Let $u = \sin x$, so $du = \cos x\,dx$, which is exactly the remaining factor. The integral becomes $\int u^4\,du = \frac{u^5}{5} + C$, so the answer is $\frac{\sin^5 x}{5} + C$.'
          - problem: 'A particle moves along a line with velocity $v(t) = 2t(t^2 + 1)^3$ metres per second, and $s(0) = 0$. Find its position $s(t)$ in metres.'
            answer: '((t^2 + 1)^4 - 1)/4'
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: 'The position is an antiderivative of the velocity. Let $u = t^2 + 1$, so $du = 2t\,dt$, and $\int u^3\,du = \frac{u^4}{4}$. So $s(t) = \frac{(t^2+1)^4}{4} + K$. Since $s(0) = 0$, we need $\frac{1}{4} + K = 0$, so $K = -\frac{1}{4}$ and $s(t) = \frac{(t^2+1)^4 - 1}{4}$.'
          - problem: 'The marginal cost of making $x$ hundred items is $C''(x) = 3x^2 e^{x^3}$ thousand dollars per hundred items, and the fixed cost is $C(0) = 5$ thousand dollars. Find the cost function $C(x)$.'
            answer: 'e^(x^3) + 4'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'The cost function is an antiderivative of the marginal cost. Let $u = x^3$, so $du = 3x^2\,dx$ and $\int e^u\,du = e^u$. So $C(x) = e^{x^3} + K$. Since $C(0) = 1 + K = 5$, we get $K = 4$ and $C(x) = e^{x^3} + 4$.'
          - problem: 'Sam finds $\int 3x^2(x^3 + 1)^2\,dx$ and writes $(x^3 + 1)^3 + C$. What is the correct antiderivative?'
            answer: '(x^3 + 1)^3/3 + C'
            answer_contract: {"kind": "function", "vars": ["x"], "up_to_constant": true}
            solution_sketch: 'With $u = x^3 + 1$ we have $du = 3x^2\,dx$, so the integral is $\int u^2\,du = \frac{u^3}{3} + C$. Sam forgot to divide by $3$ in the power rule. The check is that $\frac{d}{dx}\frac{(x^3+1)^3}{3} = (x^3+1)^2 \cdot 3x^2$.'
        constraints: 'du present up to a constant factor; verify every answer by differentiating'
      - id: kp2
        name: 'Adjust constant factors'
        key_prerequisites: [antiderivatives, chain-rule]
        step_check:
          step: 'dividing by $10$ gives $x \, dx = \frac{du}{10}$'
          question: 'Why do we divide $du = 10x\,dx$ by $10$?'
          options:
            - 'To turn the exponent $5x^2$ back into the plain variable $x$ again'
            - 'Because every substitution must give $du$ equal to exactly $1\,dx$'
            - 'To isolate $x\,dx$, the factor that the integrand actually holds'
          answer: 'To isolate $x\,dx$, the factor that the integrand actually holds'
          why: 'The integrand holds $x\,dx$, so we solve for that factor. It is $\frac{du}{10}$, and the constant $\frac{1}{10}$ moves outside the integral.'
        exemplars:
          - problem: 'Find $\int x e^{x^2}\,dx$.'
            answer: 'e^(x^2)/2 + C'
            answer_contract: {"kind": "function", "vars": ["x"], "up_to_constant": true}
            solution_sketch: 'Let $u = x^2$, so $du = 2x\,dx$ and $x\,dx = \frac{du}{2}$. The integral becomes $\frac{1}{2}\int e^u\,du = \frac{1}{2}e^u + C$, so the answer is $\frac{e^{x^2}}{2} + C$.'
          - problem: 'Find $\int x^2\sqrt{x^3 + 1}\,dx$.'
            answer: '(2/9)(x^3 + 1)^(3/2) + C'
            answer_contract: {"kind": "function", "vars": ["x"], "up_to_constant": true}
            solution_sketch: 'Let $u = x^3 + 1$, so $du = 3x^2\,dx$ and $x^2\,dx = \frac{du}{3}$. The integral becomes $\frac{1}{3}\int u^{1/2}\,du = \frac{1}{3}\cdot\frac{2}{3}u^{3/2} + C$. So the answer is $\frac{2}{9}(x^3+1)^{3/2} + C$.'
          - problem: 'Find $\int \frac{x}{x^2 + 4}\,dx$.'
            answer: '(1/2)ln(x^2 + 4) + C'
            answer_contract: {"kind": "function", "vars": ["x"], "up_to_constant": true}
            solution_sketch: 'Let $u = x^2 + 4$, so $du = 2x\,dx$ and $x\,dx = \frac{du}{2}$. The integral becomes $\frac{1}{2}\int \frac{du}{u} = \frac{1}{2}\ln u + C$. Here $u > 0$, so the answer is $\frac{1}{2}\ln(x^2+4) + C$.'
          - problem: 'Find $\int x\cos(2x^2)\,dx$.'
            answer: 'sin(2x^2)/4 + C'
            answer_contract: {"kind": "function", "vars": ["x"], "up_to_constant": true}
            solution_sketch: 'Let $u = 2x^2$, so $du = 4x\,dx$ and $x\,dx = \frac{du}{4}$. The integral becomes $\frac{1}{4}\int \cos u\,du = \frac{1}{4}\sin u + C$, so the answer is $\frac{\sin(2x^2)}{4} + C$.'
          - problem: 'Find $\int x^3(x^4 + 7)^5\,dx$.'
            answer: '(x^4 + 7)^6/24 + C'
            answer_contract: {"kind": "function", "vars": ["x"], "up_to_constant": true}
            solution_sketch: 'Let $u = x^4 + 7$, so $du = 4x^3\,dx$ and $x^3\,dx = \frac{du}{4}$. The integral becomes $\frac{1}{4}\int u^5\,du = \frac{1}{4}\cdot\frac{u^6}{6} + C$. So the answer is $\frac{(x^4+7)^6}{24} + C$.'
          - problem: 'Find $\int \frac{x}{4x^2 + 9}\,dx$.'
            answer: '(1/8)ln(4x^2 + 9) + C'
            answer_contract: {"kind": "function", "vars": ["x"], "up_to_constant": true}
            solution_sketch: 'Let $u = 4x^2 + 9$, so $du = 8x\,dx$ and $x\,dx = \frac{du}{8}$. The integral becomes $\frac{1}{8}\int \frac{du}{u} = \frac{1}{8}\ln u + C$. Here $u > 0$, so the answer is $\frac{1}{8}\ln(4x^2+9) + C$.'
          - problem: 'A particle moves along a line with velocity $v(t) = t\cos(t^2)$ metres per second, and $s(0) = 0$. Find its position $s(t)$ in metres.'
            answer: 'sin(t^2)/2'
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: 'The position is an antiderivative of the velocity. Let $u = t^2$, so $du = 2t\,dt$ and $t\,dt = \frac{du}{2}$. Then $\int t\cos(t^2)\,dt = \frac{1}{2}\sin(t^2) + K$. Since $s(0) = 0$ and $\sin 0 = 0$, we get $K = 0$, so $s(t) = \frac{\sin(t^2)}{2}$.'
          - problem: 'The marginal revenue from selling $x$ units is $R''(x) = \frac{x}{x^2 + 9}$ thousand dollars per unit, and $R(0) = 0$. Find the revenue function $R(x)$.'
            answer: '(1/2)ln(x^2 + 9) - ln(3)'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'Let $u = x^2 + 9$, so $du = 2x\,dx$ and $x\,dx = \frac{du}{2}$. Then $R(x) = \frac{1}{2}\ln(x^2+9) + K$. Since $R(0) = \frac{1}{2}\ln 9 + K = \ln 3 + K = 0$, we get $K = -\ln 3$. So $R(x) = \frac{1}{2}\ln(x^2+9) - \ln 3$.'
          - problem: 'Sam finds $\int x^2\cos(x^3)\,dx$ and writes $\sin(x^3) + C$. What is the correct antiderivative?'
            answer: 'sin(x^3)/3 + C'
            answer_contract: {"kind": "function", "vars": ["x"], "up_to_constant": true}
            solution_sketch: 'With $u = x^3$ we have $du = 3x^2\,dx$, so $x^2\,dx = \frac{du}{3}$. The integral is $\frac{1}{3}\int \cos u\,du = \frac{1}{3}\sin u + C$. Sam left out the factor $\frac{1}{3}$, and differentiating $\sin(x^3)$ gives $3x^2\cos(x^3)$, which is three times the integrand.'
        constraints: 'missing constant multiplier only — never a missing variable factor'
      - id: kp3
        name: 'Linear inside functions'
        key_prerequisites: [antiderivatives, chain-rule]
        step_check:
          step: 'so $dx = \frac{1}{4}\,du$'
          question: 'Why does $dx$ become $\frac{1}{4}\,du$ and not $4\,du$?'
          options:
            - 'Because $du = 4\,dx$, so $dx$ is one quarter of $du$'
            - 'Because the antiderivative of sine always carries a factor of $\frac{1}{4}$'
            - 'Because the slope $4$ multiplies the result, so $u$ must be scaled up'
          answer: 'Because $du = 4\,dx$, so $dx$ is one quarter of $du$'
          why: 'From $u = 4x$ we get $du = 4\,dx$. Dividing both sides by $4$ gives $dx = \frac{1}{4}\,du$, so the integral picks up the factor $\frac{1}{4}$.'
        exemplars:
          - problem: 'Find $\int \cos(3x)\,dx$.'
            answer: 'sin(3x)/3 + C'
            answer_contract: {"kind": "function", "vars": ["x"], "up_to_constant": true}
            solution_sketch: 'Let $u = 3x$, so $du = 3\,dx$ and $dx = \frac{1}{3}\,du$. The integral becomes $\frac{1}{3}\int \cos u\,du = \frac{1}{3}\sin u + C$, so the answer is $\frac{\sin(3x)}{3} + C$.'
          - problem: 'Find $\int e^{5x}\,dx$.'
            answer: 'e^(5x)/5 + C'
            answer_contract: {"kind": "function", "vars": ["x"], "up_to_constant": true}
            solution_sketch: 'Let $u = 5x$, so $du = 5\,dx$ and $dx = \frac{1}{5}\,du$. The integral becomes $\frac{1}{5}\int e^u\,du = \frac{1}{5}e^u + C$, so the answer is $\frac{e^{5x}}{5} + C$.'
          - problem: 'Find $\int \frac{1}{3x + 2}\,dx$ for $x > -\frac{2}{3}$.'
            answer: '(1/3)ln(3x + 2) + C'
            answer_contract: {"kind": "function", "vars": ["x"], "up_to_constant": true}
            solution_sketch: 'Let $u = 3x + 2$, so $du = 3\,dx$ and $dx = \frac{1}{3}\,du$. The integral becomes $\frac{1}{3}\int \frac{du}{u} = \frac{1}{3}\ln u + C$. On this domain $u > 0$, so the answer is $\frac{1}{3}\ln(3x+2) + C$.'
          - problem: 'Find $\int \sin(7x + 2)\,dx$.'
            answer: '-cos(7x + 2)/7 + C'
            answer_contract: {"kind": "function", "vars": ["x"], "up_to_constant": true}
            solution_sketch: 'Let $u = 7x + 2$, so $du = 7\,dx$ and $dx = \frac{1}{7}\,du$. The integral becomes $\frac{1}{7}\int \sin u\,du = -\frac{1}{7}\cos u + C$, so the answer is $-\frac{\cos(7x+2)}{7} + C$.'
          - problem: 'Find $\int \sec^2(2x - 5)\,dx$.'
            answer: 'tan(2x - 5)/2 + C'
            answer_contract: {"kind": "function", "vars": ["x"], "up_to_constant": true}
            solution_sketch: 'Let $u = 2x - 5$, so $du = 2\,dx$ and $dx = \frac{1}{2}\,du$. The integral becomes $\frac{1}{2}\int \sec^2 u\,du = \frac{1}{2}\tan u + C$, so the answer is $\frac{\tan(2x-5)}{2} + C$.'
          - problem: 'Find $\int (3x + 1)^4\,dx$.'
            answer: '(3x + 1)^5/15 + C'
            answer_contract: {"kind": "function", "vars": ["x"], "up_to_constant": true}
            solution_sketch: 'Let $u = 3x + 1$, so $du = 3\,dx$ and $dx = \frac{1}{3}\,du$. The integral becomes $\frac{1}{3}\int u^4\,du = \frac{1}{3}\cdot\frac{u^5}{5} + C$. So the answer is $\frac{(3x+1)^5}{15} + C$.'
          - problem: 'A point on a vibrating spring moves along a line with velocity $v(t) = 12\cos(3t)$ centimetres per second, and $s(0) = 0$. Find its position $s(t)$ in centimetres.'
            answer: '4 sin(3t)'
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: 'The position is an antiderivative of the velocity. Let $u = 3t$, so $dt = \frac{1}{3}\,du$. Then $\int 12\cos(3t)\,dt = 12\cdot\frac{1}{3}\sin(3t) + K = 4\sin(3t) + K$. Since $s(0) = 0$ and $\sin 0 = 0$, we get $K = 0$, so $s(t) = 4\sin(3t)$.'
          - problem: 'A culture of bacteria has $200$ thousand cells at time $t = 0$ hours and grows at the rate $P''(t) = 30e^{t/5}$ thousand cells per hour. Find the number of cells $P(t)$, in thousands, at time $t$.'
            answer: '150e^(t/5) + 50'
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: 'Let $u = \frac{t}{5}$, so $dt = 5\,du$. Then $\int 30e^{t/5}\,dt = 30\cdot 5\,e^{t/5} + K = 150e^{t/5} + K$. Since $P(0) = 150 + K = 200$, we get $K = 50$. So $P(t) = 150e^{t/5} + 50$.'
          - problem: 'Sam finds $\int e^{4x}\,dx$ and writes $4e^{4x} + C$. What is the correct antiderivative?'
            answer: 'e^(4x)/4 + C'
            answer_contract: {"kind": "function", "vars": ["x"], "up_to_constant": true}
            solution_sketch: 'With $u = 4x$ we have $du = 4\,dx$, so $dx = \frac{1}{4}\,du$. The integral is $\frac{1}{4}\int e^u\,du = \frac{1}{4}e^{4x} + C$. Sam multiplied by $4$, but the rule is to divide by the inner slope $4$. Differentiating $4e^{4x}$ gives $16e^{4x}$, so it is wrong.'
        constraints: 'u = ax + b; divide by the inner slope a'
    diagnostic_exemplar:
      problem: 'Find $\int x \sin(x^2) \, dx$.'
      answer: "-cos(x^2)/2 + C"
      solution_sketch: '$u = x^2$, $du = 2x\,dx$, so $x\,dx = \frac{du}{2}$: $\frac{1}{2}\int \sin u\,du = -\frac{\cos u}{2} + C$.'
    anki_seeds:
      - front: "Substitution reverses which differentiation rule?"
        back: "the chain rule"
        type: basic
      - front: "∫ f(ax + b) dx (F an antiderivative of f) = ?"
        back: "F(ax + b)/a + C — divide by the inner slope"
        type: basic

  - id: integration-substitution
    name: Integration by Substitution
    core: true
    difficulty: 0.7
    drill: false
    answer_kind: expression
    expected_time_secs: 240
    prerequisites:
      - id: u-substitution-basics
        weight: 0.8
        key: true
      - id: definite-integrals-ftc
        weight: 0.6
        key: true
      - id: chain-rule
        weight: 0.5
      - id: derivatives-exp-log
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: 'Harder composite integrands'
        key_prerequisites: [u-substitution-basics, derivatives-exp-log]
        step_check:
          step: 'so the substitution is a perfect fit'
          question: 'Why is $u = 1 + \sin x$ a good choice here?'
          options:
            - 'It is the most complicated part of the integrand, and that part always works'
            - 'It turns the integrand into a polynomial in $u$ with no fractions left'
            - 'Its derivative $\cos x$ already appears in the integrand as a factor'
          answer: 'Its derivative $\cos x$ already appears in the integrand as a factor'
          why: 'A substitution works when $du$ appears in the integrand. Here $du = \cos x\,dx$ is the numerator, so the integral becomes $\int \frac{du}{u}$.'
        exemplars:
          - problem: 'Find $\int \frac{(\ln x)^2}{x}\,dx$ for $x > 0$.'
            answer: '(ln(x))^3/3 + C'
            answer_contract: {"kind": "function", "vars": ["x"], "up_to_constant": true}
            solution_sketch: 'Let $u = \ln x$, so $du = \frac{dx}{x}$. This is exactly the factor $\frac{1}{x}\,dx$ in the integrand. The integral becomes $\int u^2\,du = \frac{u^3}{3} + C$, so the answer is $\frac{(\ln x)^3}{3} + C$.'
          - problem: 'Find $\int \frac{e^x}{1 + e^x}\,dx$.'
            answer: 'ln(1 + e^x) + C'
            answer_contract: {"kind": "function", "vars": ["x"], "up_to_constant": true}
            solution_sketch: 'Let $u = 1 + e^x$, so $du = e^x\,dx$. The integral becomes $\int \frac{du}{u} = \ln|u| + C$. Since $1 + e^x > 0$, the answer is $\ln(1 + e^x) + C$.'
          - problem: 'Find $\int \cos x\,e^{\sin x}\,dx$.'
            answer: 'e^(sin(x)) + C'
            answer_contract: {"kind": "function", "vars": ["x"], "up_to_constant": true}
            solution_sketch: 'Let $u = \sin x$, so $du = \cos x\,dx$. This is exactly the remaining factor. The integral becomes $\int e^u\,du = e^u + C$, so the answer is $e^{\sin x} + C$.'
          - problem: 'Find $\int \sin x\,e^{\cos x}\,dx$.'
            answer: '-e^(cos(x)) + C'
            answer_contract: {"kind": "function", "vars": ["x"], "up_to_constant": true}
            solution_sketch: 'Let $u = \cos x$, so $du = -\sin x\,dx$ and $\sin x\,dx = -du$. The integral becomes $-\int e^u\,du = -e^u + C$. So the answer is $-e^{\cos x} + C$.'
          - problem: 'Find $\int e^x\sin(e^x)\,dx$.'
            answer: '-cos(e^x) + C'
            answer_contract: {"kind": "function", "vars": ["x"], "up_to_constant": true}
            solution_sketch: 'Let $u = e^x$, so $du = e^x\,dx$. This is exactly the factor in front of the sine. The integral becomes $\int \sin u\,du = -\cos u + C$, so the answer is $-\cos(e^x) + C$.'
          - problem: 'Find $\int \frac{\sin 2x}{1 + \sin^2 x}\,dx$.'
            answer: 'ln(1 + sin(x)^2) + C'
            answer_contract: {"kind": "function", "vars": ["x"], "up_to_constant": true}
            solution_sketch: 'Let $u = 1 + \sin^2 x$, so $du = 2\sin x\cos x\,dx = \sin 2x\,dx$. This is exactly the numerator. The integral becomes $\int \frac{du}{u} = \ln|u| + C$. Since $1 + \sin^2 x > 0$, the answer is $\ln(1 + \sin^2 x) + C$.'
          - problem: 'Evaluate $\int_0^{\pi/4} \tan x\,dx$.'
            answer: 'ln(2)/2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Write $\tan x = \frac{\sin x}{\cos x}$ and let $u = \cos x$, so $du = -\sin x\,dx$. The limits $x = 0$ and $x = \frac{\pi}{4}$ become $u = 1$ and $u = \frac{\sqrt{2}}{2}$. So the integral is $-\int_1^{\sqrt2/2} \frac{du}{u} = -\ln\frac{\sqrt{2}}{2} = \ln\sqrt{2} = \frac{\ln 2}{2}$.'
          - problem: 'The number of bacteria in a culture changes at the rate $N''(t) = \frac{12\ln t}{t}$ thousand per hour for $t \ge 1$, and $N(1) = 5$ thousand. Find $N(t)$ in thousands.'
            answer: '6(ln(t))^2 + 5'
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: 'Let $u = \ln t$, so $du = \frac{dt}{t}$. Then $\int \frac{12\ln t}{t}\,dt = 12\int u\,du = 6u^2 + K = 6(\ln t)^2 + K$. Since $N(1) = 6\cdot 0 + K = 5$, we get $K = 5$. So $N(t) = 6(\ln t)^2 + 5$.'
          - problem: 'The water level in a harbour changes at the rate $h''(t) = \frac{\sin t}{2 + \cos t}$ metres per hour, and $h(0) = 1$ metre. Find the level $h(t)$ in metres.'
            answer: '1 + ln(3) - ln(2 + cos(t))'
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: 'Let $u = 2 + \cos t$, so $du = -\sin t\,dt$. Then $\int \frac{\sin t}{2 + \cos t}\,dt = -\ln(2 + \cos t) + K$. Since $h(0) = -\ln 3 + K = 1$, we get $K = 1 + \ln 3$. So $h(t) = 1 + \ln 3 - \ln(2 + \cos t)$.'
          - problem: 'Sam finds $\int \frac{\sin x}{3 + \cos x}\,dx$ and writes $\ln(3 + \cos x) + C$. What is the correct antiderivative?'
            answer: '-ln(3 + cos(x)) + C'
            answer_contract: {"kind": "function", "vars": ["x"], "up_to_constant": true}
            solution_sketch: 'With $u = 3 + \cos x$ we have $du = -\sin x\,dx$, so $\sin x\,dx = -du$. The integral is $-\int \frac{du}{u} = -\ln u + C$. Sam lost the minus sign: differentiating $\ln(3+\cos x)$ gives $\frac{-\sin x}{3+\cos x}$, the opposite of the integrand.'
        constraints: 'u is a trig, log, or exponential expression; the du appears as a factor'
      - id: kp2
        name: 'Definite integrals with substitution'
        key_prerequisites: [definite-integrals-ftc, u-substitution-basics]
        step_check:
          step: 'when $x = 0$, $u = 0^3 + 1 = 1$'
          question: 'Why do the limits $0$ and $1$ become $1$ and $2$?'
          options:
            - 'The new limits are the old limits plus the constant $1$ added to $u$'
            - 'They are the values of $u$ found by putting each $x$-limit into $u$'
            - 'The limits always shift by the power that the integrand has, here $2$'
          answer: 'They are the values of $u$ found by putting each $x$-limit into $u$'
          why: 'The integral is now in $u$, so its limits must be values of $u$. Putting $x = 0$ and $x = 1$ into $u = x^3 + 1$ gives $1$ and $2$.'
        try_first:
          problem: 'Evaluate $\int_0^1 2x(x^2 + 3)^2\,dx$.'
          answer_contract: {"kind": "exact"}
          answer: '37/3'
          reveal: 'Writing the integral in $u = x^2 + 3$ also changes the limits: $x = 0$ and $x = 1$ become $u = 3$ and $u = 4$. The value is $\frac{4^3 - 3^3}{3} = \frac{37}{3}$.'
        exemplars:
          - problem: 'Evaluate $\int_0^1 2x(x^2 + 1)^3\,dx$.'
            answer: '15/4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Let $u = x^2 + 1$, so $du = 2x\,dx$. The limits $x = 0$ and $x = 1$ become $u = 1$ and $u = 2$. So the integral is $\int_1^2 u^3\,du = \left[\frac{u^4}{4}\right]_1^2 = \frac{16 - 1}{4} = \frac{15}{4}$.'
          - problem: 'Evaluate $\int_0^{\pi/2} \sin x\cos x\,dx$.'
            answer: '1/2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Let $u = \sin x$, so $du = \cos x\,dx$. The limits $x = 0$ and $x = \frac{\pi}{2}$ become $u = 0$ and $u = 1$. So the integral is $\int_0^1 u\,du = \left[\frac{u^2}{2}\right]_0^1 = \frac{1}{2}$.'
          - problem: 'Evaluate $\int_1^{e^2} \frac{\ln x}{x}\,dx$.'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Let $u = \ln x$, so $du = \frac{dx}{x}$. The limits $x = 1$ and $x = e^2$ become $u = 0$ and $u = 2$. So the integral is $\int_0^2 u\,du = \left[\frac{u^2}{2}\right]_0^2 = 2$.'
          - problem: 'Evaluate $\int_0^2 3x^2(x^3 + 1)^2\,dx$.'
            answer: '728/3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Let $u = x^3 + 1$, so $du = 3x^2\,dx$. The limits $x = 0$ and $x = 2$ become $u = 1$ and $u = 9$. So the integral is $\int_1^9 u^2\,du = \left[\frac{u^3}{3}\right]_1^9 = \frac{729 - 1}{3} = \frac{728}{3}$.'
          - problem: 'Evaluate $\int_0^{\pi/2} \sin^3 x\cos x\,dx$.'
            answer: '1/4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Let $u = \sin x$, so $du = \cos x\,dx$. The limits become $u = 0$ and $u = 1$. So the integral is $\int_0^1 u^3\,du = \left[\frac{u^4}{4}\right]_0^1 = \frac{1}{4}$.'
          - problem: 'Evaluate $\int_0^1 \frac{2x + 1}{(x^2 + x + 3)^2}\,dx$.'
            answer: '2/15'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Let $u = x^2 + x + 3$, so $du = (2x + 1)\,dx$. The limits $x = 0$ and $x = 1$ become $u = 3$ and $u = 5$. So the integral is $\int_3^5 u^{-2}\,du = \left[-\frac{1}{u}\right]_3^5 = -\frac{1}{5} + \frac{1}{3} = \frac{2}{15}$.'
          - problem: 'Evaluate $\int_0^1 x e^{x^2}\,dx$.'
            answer: '(e - 1)/2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Let $u = x^2$, so $du = 2x\,dx$ and $x\,dx = \frac{du}{2}$. The limits become $u = 0$ and $u = 1$. So the integral is $\frac{1}{2}\int_0^1 e^u\,du = \frac{1}{2}(e - 1)$.'
          - problem: 'Evaluate $\int_{-1}^{1} 2x(x^2 + 3)^2\,dx$.'
            answer: '0'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Let $u = x^2 + 3$, so $du = 2x\,dx$. The limits $x = -1$ and $x = 1$ both give $u = 4$. An integral from $4$ to $4$ is $0$. This agrees with the symmetry of the integrand, which is an odd function.'
          - problem: 'Water flows into a tank at the rate $r(t) = t\sqrt{t^2 + 9}$ litres per minute. How many litres enter the tank from $t = 0$ to $t = 4$ minutes?'
            answer: '98/3'
            answer_contract: {"kind": "unit", "quantity": "volume", "unit": "L", "allow_omitted": true}
            solution_sketch: 'The volume is $\int_0^4 t\sqrt{t^2+9}\,dt$. Let $u = t^2 + 9$, so $t\,dt = \frac{du}{2}$, and the limits become $u = 9$ and $u = 25$. So the volume is $\frac{1}{2}\int_9^{25} u^{1/2}\,du = \frac{1}{3}\left(125 - 27\right) = \frac{98}{3}$ litres.'
          - problem: 'A cyclist has velocity $v(t) = t^2\sqrt{t^3 + 1}$ metres per second. How far does she travel from $t = 0$ to $t = 2$ seconds?'
            answer: '52/9'
            answer_contract: {"kind": "unit", "quantity": "length", "unit": "m", "allow_omitted": true}
            solution_sketch: 'The distance is $\int_0^2 t^2\sqrt{t^3+1}\,dt$. Let $u = t^3 + 1$, so $t^2\,dt = \frac{du}{3}$, and the limits become $u = 1$ and $u = 9$. So the distance is $\frac{1}{3}\int_1^9 u^{1/2}\,du = \frac{1}{3}\cdot\frac{2}{3}(27 - 1) = \frac{52}{9}$ metres.'
          - problem: 'Sam evaluates $\int_0^1 4x^3(x^4 + 2)^2\,dx$ with $u = x^4 + 2$ and gets $\left[\frac{u^3}{3}\right]_0^1 = \frac{1}{3}$. What is the correct value?'
            answer: '19/3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'With $u = x^4 + 2$, the limits $x = 0$ and $x = 1$ become $u = 2$ and $u = 3$. Sam kept the old limits $0$ and $1$ for $u$. The correct value is $\left[\frac{u^3}{3}\right]_2^3 = \frac{27 - 8}{3} = \frac{19}{3}$.'
        constraints: 'change the limits along with the variable; exact fraction answers'
      - id: kp3
        name: 'Back-substitution when du is incomplete'
        key_prerequisites: [u-substitution-basics, definite-integrals-ftc]
        step_check:
          step: 'solve the substitution for it: $x = u - 3$'
          question: 'Why must the leftover $x$ be replaced by $u - 3$?'
          options:
            - 'Every part must be in $u$, and $u = x + 3$ gives $x = u - 3$'
            - 'Because $du = dx$ means that $x$ and $u$ must be equal to each other'
            - 'Because $x$ is a constant multiple of $du$ and can leave the integral'
          answer: 'Every part must be in $u$, and $u = x + 3$ gives $x = u - 3$'
          why: 'After the substitution no $x$ may remain in the integral. Solving $u = x + 3$ for $x$ gives $x = u - 3$, and then every term is a power of $u$.'
        exemplars:
          - problem: 'Find $\int x\sqrt{x + 1}\,dx$.'
            answer: '(2/5)(x+1)^(5/2)-(2/3)(x+1)^(3/2)+C'
            answer_contract: {"kind": "function", "vars": ["x"], "up_to_constant": true}
            solution_sketch: 'Let $u = x + 1$, so $x = u - 1$ and $du = dx$. The integral becomes $\int (u - 1)u^{1/2}\,du = \int (u^{3/2} - u^{1/2})\,du = \frac{2}{5}u^{5/2} - \frac{2}{3}u^{3/2} + C$. Putting back $u = x + 1$ gives the answer.'
          - problem: 'Evaluate $\int_0^3 x\sqrt{x + 1}\,dx$.'
            answer: '116/15'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Let $u = x + 1$, so $x = u - 1$, and the limits become $u = 1$ and $u = 4$. The integral is $\int_1^4 (u^{3/2} - u^{1/2})\,du = \left[\frac{2}{5}u^{5/2} - \frac{2}{3}u^{3/2}\right]_1^4 = \left(\frac{64}{5} - \frac{16}{3}\right) - \left(\frac{2}{5} - \frac{2}{3}\right) = \frac{116}{15}$.'
          - problem: 'Find $\int x\sqrt{x + 2}\,dx$.'
            answer: '(2/5)(x+2)^(5/2)-(4/3)(x+2)^(3/2)+C'
            answer_contract: {"kind": "function", "vars": ["x"], "up_to_constant": true}
            solution_sketch: 'Let $u = x + 2$, so $x = u - 2$ and $du = dx$. The integral becomes $\int (u - 2)u^{1/2}\,du = \int (u^{3/2} - 2u^{1/2})\,du = \frac{2}{5}u^{5/2} - \frac{4}{3}u^{3/2} + C$. Putting back $u = x + 2$ gives the answer.'
          - problem: 'Evaluate $\int_2^7 x\sqrt{x + 2}\,dx$.'
            answer: '886/15'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Let $u = x + 2$, so $x = u - 2$, and the limits become $u = 4$ and $u = 9$. The integral is $\int_4^9 (u^{3/2} - 2u^{1/2})\,du = \left[\frac{2}{5}u^{5/2} - \frac{4}{3}u^{3/2}\right]_4^9 = \left(\frac{486}{5} - 36\right) - \left(\frac{64}{5} - \frac{32}{3}\right) = \frac{886}{15}$.'
          - problem: 'Find $\int \frac{x}{(x + 1)^3}\,dx$.'
            answer: '-1/(x+1)+1/(2(x+1)^2)+C'
            answer_contract: {"kind": "function", "vars": ["x"], "up_to_constant": true}
            solution_sketch: 'Let $u = x + 1$, so $x = u - 1$ and $du = dx$. The integral becomes $\int (u - 1)u^{-3}\,du = \int (u^{-2} - u^{-3})\,du = -u^{-1} + \frac{1}{2}u^{-2} + C$. Putting back $u = x + 1$ gives the answer.'
          - problem: 'Water flows into a tank at the rate $r(t) = t\sqrt{t + 9}$ litres per minute. How many litres enter the tank from $t = 0$ to $t = 7$ minutes?'
            answer: '452/5'
            answer_contract: {"kind": "unit", "quantity": "volume", "unit": "L", "allow_omitted": true}
            solution_sketch: 'The volume is $\int_0^7 t\sqrt{t+9}\,dt$. Let $u = t + 9$, so $t = u - 9$ and the limits become $u = 9$ and $u = 16$. The integral is $\int_9^{16}(u^{3/2} - 9u^{1/2})\,du = \left[\frac{2}{5}u^{5/2} - 6u^{3/2}\right]_9^{16} = \left(\frac{2048}{5} - 384\right) - \left(\frac{486}{5} - 162\right) = \frac{452}{5}$ litres.'
          - problem: 'Find $\int x(x - 1)^4\,dx$.'
            answer: '(x - 1)^6/6 + (x - 1)^5/5 + C'
            answer_contract: {"kind": "function", "vars": ["x"], "up_to_constant": true}
            solution_sketch: 'Let $u = x - 1$, so $x = u + 1$ and $du = dx$. The integral becomes $\int (u + 1)u^4\,du = \int (u^5 + u^4)\,du = \frac{u^6}{6} + \frac{u^5}{5} + C$. Putting back $u = x - 1$ gives the answer.'
          - problem: 'A cyclist has speed $v(t) = t\sqrt{t + 1}$ kilometres per hour. How far does she ride from $t = 0$ to $t = 8$ hours?'
            answer: '1192/15'
            answer_contract: {"kind": "unit", "quantity": "length", "unit": "km", "allow_omitted": true}
            solution_sketch: 'The distance is $\int_0^8 t\sqrt{t+1}\,dt$. Let $u = t + 1$, so $t = u - 1$ and the limits become $u = 1$ and $u = 9$. The integral is $\left[\frac{2}{5}u^{5/2} - \frac{2}{3}u^{3/2}\right]_1^9 = \left(\frac{486}{5} - 18\right) - \left(\frac{2}{5} - \frac{2}{3}\right) = \frac{1192}{15}$ kilometres.'
          - problem: 'Sam finds $\int x\sqrt{x + 5}\,dx$ and writes $\frac{2}{3}x(x + 5)^{3/2} + C$. What is the correct antiderivative?'
            answer: '(2/5)(x+5)^(5/2)-(10/3)(x+5)^(3/2)+C'
            answer_contract: {"kind": "function", "vars": ["x"], "up_to_constant": true}
            solution_sketch: 'Let $u = x + 5$, so $x = u - 5$ and $du = dx$. The integral becomes $\int (u - 5)u^{1/2}\,du = \frac{2}{5}u^{5/2} - \frac{10}{3}u^{3/2} + C$. Sam pulled the factor $x$ out as if it were a constant, but $x$ changes with the variable.'
        constraints: 'u linear so x = u - b is exact; express leftover x in terms of u'
