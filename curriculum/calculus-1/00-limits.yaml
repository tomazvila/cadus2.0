        weight: 0.5
        key: true
      - id: domain-range
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: Check the three conditions
        key_prerequisites: [limits-piecewise-functions, limit-laws]
        exemplars:
          - problem: 'Let $f(x) = \frac{x^2 - 1}{x - 1}$ for $x \neq 1$ and $f(1) = 2$. Is $f$ continuous at $x = 1$? (yes/no, with the limit)'
            answer: "yes; the limit is 2 and equals f(1)"
            solution_sketch: '$\lim_{x \to 1} f(x) = \lim_{x \to 1} (x + 1) = 2 = f(1)$: all three conditions hold.'
          - problem: 'Let $g(x) = x^2$ for $x \leq 2$ and $g(x) = 3x - 2$ for $x > 2$. Is $g$ continuous at $x = 2$? (yes/no)'
            answer: "yes"
            solution_sketch: 'Left limit $4$, right limit $3 \cdot 2 - 2 = 4$, and $g(2) = 4$: continuous.'
          - problem: 'Let $f(x) = \frac{x^2 - 4}{x - 2}$ for $x \neq 2$ and $f(2) = 3$. Is $f$ continuous at $x = 2$?'
            answer: "no — the limit is 4 but f(2) = 3"
        constraints: "verify f(a) defined, limit exists, limit = f(a); values are small integers; include one failing case"
      - id: kp2
        name: Identify which condition fails
        key_prerequisites: [limits-piecewise-functions, limit-laws]
        exemplars:
          - problem: 'For $f(x) = \frac{1}{x - 3}$ at $x = 3$, which continuity condition fails first?'
            answer: "f(3) is undefined (and the limit does not exist either)"
          - problem: 'For $f(x) = \frac{|x|}{x}$ at $x = 0$, which continuity condition fails?'
            answer: "the limit does not exist (left -1, right 1)"
          - problem: 'The graph of $g$ is a curve approaching height $2$ from both sides of $x = 1$, with a filled dot at $(1, 5)$. Which condition fails?'
            answer: "the limit (2) does not equal g(1) = 5"
        constraints: "one failing condition per problem; the student names it"
      - id: kp3
        name: Where standard functions are continuous
        key_prerequisites: [limit-laws, domain-range]
        exemplars:
          - problem: 'At which points is $f(x) = \frac{x + 1}{x^2 - 9}$ continuous?'
            answer: "all real x except x = 3 and x = -3"
          - problem: 'On what interval is $f(x) = \sqrt{x - 2}$ continuous?'
            answer: "[2, ∞)"
          - problem: 'At which points is the polynomial $p(x) = x^3 - 4x + 1$ continuous?'
            answer: "everywhere (all polynomials are continuous on ℝ)"
        constraints: "polynomials, rational functions, and square roots; answer with the set where continuity holds"
    diagnostic_exemplar:
      problem: 'Let $f(x) = \frac{x^2 - 9}{x - 3}$ for $x \neq 3$ and $f(3) = 5$. Is $f$ continuous at $x = 3$? If not, name the condition that fails.'
      answer: 'no — f(3) = 5 is defined and the limit exists, but the third condition fails: the limit is 6, not f(3) = 5'
      solution_sketch: 'Cancel: $\frac{(x-3)(x+3)}{x-3} \to 6$ as $x \to 3$, while $f(3) = 5$.'
    anki_seeds:
      - front: "f is continuous at a exactly when three conditions hold:"
        back: "f(a) is defined; lim_{x→a} f(x) exists; and the limit equals f(a)"
        type: basic
      - front: "A rational function is continuous at every point where..."
        back: "its denominator is nonzero"
        type: basic

  - id: continuity
    name: Continuity
    core: true
    difficulty: 0.62
    drill: false
    answer_kind: expression
    expected_time_secs: 150
    prerequisites:
      - id: continuity-at-a-point
        weight: 0.8
        key: true
      - id: one-sided-infinite-limits
        weight: 0.5
        key: true
      - id: limit-laws
        weight: 0.4
      - id: interval-notation
        weight: 0.2            # notation support: kp3 demands interval answers in interval notation (re-audit R-01)
    knowledge_points:
      - id: kp1
        name: Classify discontinuities
        key_prerequisites: [continuity-at-a-point, one-sided-infinite-limits]
        exemplars:
          - problem: 'Classify the discontinuity of $f(x) = \frac{x^2 - 9}{x - 3}$ at $x = 3$ (removable / jump / infinite).'
            answer: "removable"
            solution_sketch: 'The limit exists ($= 6$) but $f(3)$ is undefined; redefining $f(3) = 6$ removes the hole.'
          - problem: 'Classify the discontinuity of $f(x) = \frac{|x|}{x}$ at $x = 0$.'
            answer: "jump"
          - problem: 'Classify the discontinuity of $f(x) = \frac{1}{(x - 2)^2}$ at $x = 2$.'
            answer: "infinite"
        constraints: "one discontinuity per problem; answer names the type"
      - id: kp2
        name: Choose a constant to make a function continuous
        key_prerequisites: [continuity-at-a-point]
        exemplars:
          - problem: 'Find $c$ so that $f(x) = x + c$ for $x < 2$ and $f(x) = 3x - 1$ for $x \geq 2$ is continuous at $x = 2$.'
            answer: "3"
            solution_sketch: 'Match the one-sided limits: $2 + c = 3 \cdot 2 - 1 = 5$, so $c = 3$.'
          - problem: 'Find $k$ so that $f(x) = kx^2$ for $x \leq 1$ and $f(x) = x + 1$ for $x > 1$ is continuous at $x = 1$.'
            answer: "2"
          - problem: 'Find $c$ so that $f(x) = \frac{x^2 - 25}{x - 5}$ for $x \neq 5$ and $f(5) = c$ is continuous at $x = 5$.'
            answer: "10"
            solution_sketch: 'The limit at $5$ is $\lim (x + 5) = 10$; set $f(5)$ equal to it.'
        constraints: "one unknown constant; matching one-sided limits (or filling a removable hole) yields an integer"
      - id: kp3
        name: Continuity on intervals and of combinations
        key_prerequisites: [continuity-at-a-point, one-sided-infinite-limits]
        exemplars:
          - problem: 'The function $f(x) = \frac{\sqrt{x - 2}}{x - 5}$ is continuous at every point of its domain, which is $x \geq 2$ with a single value removed. Which value is removed?'
            answer: "5"
            solution_sketch: 'The root needs $x \geq 2$ and the denominator vanishes at $x = 5$, so $f$ is continuous exactly on $[2, 5)$ and $(5, \infty)$.'
          - problem: 'On which interval is $f(x) = \sqrt{9 - x^2}$ continuous?'
            answer: "[-3, 3]"
          - problem: 'If $f$ and $g$ are continuous everywhere, must $f \circ g$ be continuous everywhere?'
            answer: "yes — compositions of continuous functions are continuous"
        constraints: "domains determined by roots and denominators; interval answers in interval notation"
    diagnostic_exemplar:
      problem: 'Find $c$ so that $f(x) = x + c$ for $x < 1$ and $f(x) = 4x$ for $x \geq 1$ is continuous at $x = 1$.'
      answer: "3"
      solution_sketch: 'Continuity at $x = 1$ forces the two branches to agree there: $1 + c = 4(1)$, so $c = 3$.'
    anki_seeds:
      - front: "A removable discontinuity is one where..."
        back: "the limit exists but differs from f(a) (or f(a) is undefined) — redefining one point fixes it"
        type: basic
      - front: "A jump discontinuity is one where..."
        back: "both one-sided limits exist but are unequal"
        type: basic
      - front: "Sums, products, quotients (nonzero denominator), and compositions of continuous functions are..."
        back: "continuous"
        type: basic

  - id: intermediate-value-theorem
    name: The Intermediate Value Theorem
    core: false                # stated existence theorem; nothing builds on it (MAW p.391)
    difficulty: 0.62
    drill: false
    answer_kind: multi-step
    expected_time_secs: 150
    prerequisites:
      - id: continuity
        weight: 0.8
        key: true
      - id: evaluating-functions
        weight: 0.4
      - id: evaluating-polynomials
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: Verify the hypotheses and conclude a root exists
        key_prerequisites: [continuity, evaluating-functions]
        exemplars:
          - problem: 'Show that $f(x) = x^3 + x - 3$ has a root in $(1, 2)$.'
            answer: "f is continuous, f(1) = -1 < 0 and f(2) = 7 > 0, so the IVT gives a root in (1, 2)"
            solution_sketch: 'Polynomials are continuous; the sign change plus the IVT forces $f(c) = 0$ for some $c$ in $(1, 2)$.'
          - problem: 'Does $f(x) = x^2 - 2$ have a root in $(0, 2)$? Justify with the IVT.'
            answer: "yes — f(0) = -2 < 0 < f(2) = 2 and f is continuous"
        constraints: "cubic or quadratic with integer endpoint values of opposite sign; cite continuity + sign change"
      - id: kp2
        name: Locate a root interval from values
        key_prerequisites: [continuity, evaluating-functions]
        exemplars:
          - problem: 'A continuous function has $f(1) = -2$, $f(2) = 1$, $f(3) = 4$. Which interval must contain a root?'
            answer: "(1, 2)"
          - problem: 'A continuous $f$ has $f(0) = 3$ and $f(4) = -5$. What does the IVT guarantee?'
            answer: "some c in (0, 4) with f(c) = 0"
        constraints: "table of integer values with exactly one sign change; identify the bracketing interval"
      - id: kp3
        name: Intermediate values other than zero, and why continuity is essential
        key_prerequisites: [continuity]
        exemplars:
          - problem: '$f$ is continuous on $[1, 3]$ with $f(1) = 4$ and $f(3) = 10$. Must $f$ take the value $7$ somewhere in $(1, 3)$?'
            answer: "yes — 7 lies between 4 and 10, so the IVT applies"
          - problem: '$g(x) = \frac{1}{x}$ satisfies $g(-1) = -1 < 0 < g(1) = 1$ yet has no root in $(-1, 1)$. Why does this not contradict the IVT?'
            answer: "g is not continuous on [-1, 1] (it is undefined at 0), so the IVT does not apply"
        constraints: "one intermediate-value application with N ≠ 0 and one broken-hypothesis example"
    diagnostic_exemplar:
      problem: 'Use the Intermediate Value Theorem to show that $f(x) = x^3 + x$ takes the value $5$ somewhere in $(1, 2)$.'
      answer: 'f is a polynomial, hence continuous on [1, 2], and f(1) = 2 < 5 < 10 = f(2), so the IVT gives some c in (1, 2) with f(c) = 5'
      solution_sketch: 'Apply the IVT with the intermediate value $N = 5$ lying between $f(1) = 2$ and $f(2) = 10$.'
    anki_seeds:
      - front: "IVT: if f is continuous on [a, b] and N is between f(a) and f(b), then..."
        back: "f(c) = N for some c in (a, b)"
        type: basic
      - front: "The IVT's two hypotheses are..."
        back: "f continuous on the closed interval [a, b], and the target value N strictly between f(a) and f(b)"
        type: basic
