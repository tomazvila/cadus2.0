    knowledge_points:
      - id: kp1
        name: Rationalize to resolve 0/0
        key_prerequisites: [simplifying-radicals, factoring-limits]
        exemplars:
          - problem: 'Evaluate $\lim_{x \to 0} \frac{\sqrt{x + 4} - 2}{x}$.'
            answer: "1/4"
            solution_sketch: 'Multiply by $\frac{\sqrt{x+4}+2}{\sqrt{x+4}+2}$: the fraction becomes $\frac{1}{\sqrt{x+4}+2} \to \frac{1}{4}$.'
          - problem: 'Evaluate $\lim_{x \to 9} \frac{\sqrt{x} - 3}{x - 9}$.'
            answer: "1/6"
            solution_sketch: '$x - 9 = (\sqrt{x}-3)(\sqrt{x}+3)$, so the fraction is $\frac{1}{\sqrt{x}+3} \to \frac{1}{6}$.'
          - problem: 'Evaluate $\lim_{x \to 0} \frac{\sqrt{x + 9} - 3}{x}$.'
            answer: "1/6"
          - problem: "Evaluate $\\lim_{x \\to 4} \\frac{\\sqrt{x+12}-4}{x-4}$. Give the answer as a fraction."
            answer: "1/8"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Start with the limit $\\lim_{x \\to 4} \\frac{\\sqrt{x+12}-4}{x-4}$. Step 1: conjugate multiplication by $\\sqrt{x+12}+4$. Step 2: difference of squares turns the numerator into $x-4$, so the fraction cancels to $\\frac{1}{\\sqrt{x+12}+4}$. Step 3: limit by substitution gives $1/(4+4) = 1/8$. The limit is 1/8."
          - problem: "Evaluate $\\lim_{x \\to 25} \\frac{\\sqrt{x}-5}{x-25}$. Give the answer as a fraction."
            answer: "1/10"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Start with the limit $\\lim_{x \\to 25} \\frac{\\sqrt{x}-5}{x-25}$. Step 1: conjugate multiplication by $\\sqrt{x}+5$. Step 2: difference of squares factors $x-25$, so the fraction cancels to $\\frac{1}{\\sqrt{x}+5}$. Step 3: limit by substitution gives $1/(5+5) = 1/10$. The limit is 1/10."
          - problem: "Evaluate $\\lim_{x \\to 30} \\frac{\\sqrt{x+6}-6}{x-30}$. Give the answer as a fraction."
            answer: "1/12"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Start with the limit $\\lim_{x \\to 30} \\frac{\\sqrt{x+6}-6}{x-30}$. Step 1: conjugate multiplication by $\\sqrt{x+6}+6$. Step 2: difference of squares turns the numerator into $x-30$, so the fraction cancels to $\\frac{1}{\\sqrt{x+6}+6}$. Step 3: limit by substitution gives $1/(6+6) = 1/12$. The limit is 1/12."
        constraints: "one square root; conjugate multiplication produces a clean cancellation; answers are unit fractions"
      - id: kp2
        name: Simplify complex fractions and difference quotients
        key_prerequisites: [complex-fractions, factoring-limits]
        exemplars:
          - problem: 'Evaluate $\lim_{h \to 0} \frac{(3 + h)^2 - 9}{h}$.'
            answer: "6"
            solution_sketch: 'Expand: $\frac{6h + h^2}{h} = 6 + h \to 6$.'
          - problem: 'Evaluate $\lim_{x \to 0} \frac{\frac{1}{x + 2} - \frac{1}{2}}{x}$.'
            answer: "-1/4"
            solution_sketch: 'Combine: $\frac{2 - (x+2)}{2(x+2)} = \frac{-x}{2(x+2)}$; divide by $x$ to get $\frac{-1}{2(x+2)} \to -\frac{1}{4}$.'
          - problem: 'Evaluate $\lim_{h \to 0} \frac{\frac{1}{1 + h} - 1}{h}$.'
            answer: "-1"
            solution_sketch: '$\frac{1 - (1+h)}{1+h} = \frac{-h}{1+h}$; divide by $h$ to get $\frac{-1}{1+h} \to -1$.'
        constraints: "difference-quotient shape; small integer parameters; exact fraction answers"
      - id: kp3
        name: Choose the right technique
        key_prerequisites: [factoring-limits, simplifying-radicals]
        exemplars:
          - problem: 'Evaluate $\lim_{x \to 16} \frac{\sqrt{x} - 4}{x - 16}$.'
            answer: "1/8"
            solution_sketch: 'Factor $x - 16 = (\sqrt{x}-4)(\sqrt{x}+4)$: the fraction is $\frac{1}{\sqrt{x}+4} \to \frac{1}{8}$.'
          - problem: 'Evaluate $\lim_{h \to 0} \frac{(2 + h)^3 - 8}{h}$.'
            answer: "12"
            solution_sketch: 'Expand: $(2+h)^3 = 8 + 12h + 6h^2 + h^3$, so the quotient is $12 + 6h + h^2 \to 12$.'
          - problem: 'Evaluate $\lim_{x \to 0} \frac{\frac{1}{x + 3} - \frac{1}{3}}{x}$.'
            answer: "-1/9"
            solution_sketch: 'Combine over $3(x+3)$: the quotient is $\frac{-1}{3(x+3)} \to -\frac{1}{9}$.'
        constraints: "mixed 0/0 forms requiring factoring, expanding, rationalizing, or combining fractions; state exact answers"
    diagnostic_exemplar:
      problem: 'Evaluate $\lim_{x \to 0} \frac{\frac{1}{x + 4} - \frac{1}{4}}{x}$.'
      answer: '-1/16'
      solution_sketch: 'Combine the numerator: $\frac{1}{x+4} - \frac{1}{4} = \frac{-x}{4(x+4)}$. Dividing by $x$ leaves $\frac{-1}{4(x+4)} \to -\frac{1}{16}$.'
    anki_seeds:
      - front: "To evaluate a 0/0 limit containing √(x) - a, multiply by..."
        back: "the conjugate (√(x) + a)/(√(x) + a)"
        type: basic
      - front: "For a 0/0 limit built from small fractions (a complex fraction), first..."
        back: "combine the inner fractions over a common denominator, then cancel the outer variable"
        type: basic

  - id: limits-at-infinity-rational
    name: Limits at Infinity of Rational Functions
    core: true
    difficulty: 0.55
    drill: false
    answer_kind: expression
    expected_time_secs: 120
    prerequisites:
      - id: limit-laws
        weight: 0.7
        key: true
      - id: vertical-horizontal-asymptotes
        weight: 0.5
        key: true
      - id: rational-expressions
        weight: 0.4
      - id: polynomial-end-behavior-graphing
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: Equal or smaller numerator degree
        key_prerequisites: [limit-laws]
        exemplars:
          - problem: 'Evaluate $\lim_{x \to \infty} \frac{3x^2 - 5}{2x^2 + 1}$.'
            answer: "3/2"
            solution_sketch: 'Divide top and bottom by $x^2$: $\frac{3 - 5/x^2}{2 + 1/x^2} \to \frac{3}{2}$.'
          - problem: 'Evaluate $\lim_{x \to \infty} \frac{5x + 1}{x^2 + 3}$.'
            answer: "0"
          - problem: 'Evaluate $\lim_{x \to \infty} \frac{7x^3 + x}{2x^3 - 5}$.'
            answer: "7/2"
          - problem: "Evaluate $\\lim_{x \\to \\infty} \\frac{4x^3 - 2x}{6x^3 + x + 5}$."
            answer: "2/3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Start with $\\lim_{x \\to \\infty} \\frac{4x^3 - 2x}{6x^3 + x + 5}$. The highest power in both numerator and denominator is $x^3$. Divide top and bottom by $x^3$, by the limit laws, to get $\\frac{4 - 2/x^2}{6 + 1/x^2 + 5/x^3}$. As $x \\to \\infty$, each term with $x$ in the denominator goes to $0$. The limit is the leading-coefficient ratio $4/6 = 2/3$."
          - problem: "Evaluate $\\lim_{x \\to -\\infty} \\frac{2x + 7}{3x^2 - x + 1}$."
            answer: "0"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Start with $\\lim_{x \\to -\\infty} \\frac{2x + 7}{3x^2 - x + 1}$. The numerator degree is $1$ and the denominator degree is $2$. Divide top and bottom by $x^2$, by the limit laws, to get $\\frac{2/x + 7/x^2}{3 - 1/x + 1/x^2}$. As $x \\to -\\infty$, each term with $x$ in the denominator goes to $0$. Since the numerator degree is smaller, the limit is $0$."
          - problem: "Evaluate $\\lim_{x \\to -\\infty} \\frac{5x^2 + 2}{4x^2 - 9}$."
            answer: "5/4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Start with $\\lim_{x \\to -\\infty} \\frac{5x^2 + 2}{4x^2 - 9}$. The highest power in both numerator and denominator is $x^2$. Divide top and bottom by $x^2$, by the limit laws, to get $\\frac{5 + 2/x^2}{4 - 9/x^2}$. As $x \\to -\\infty$, each term with $x$ in the denominator goes to $0$. The limit is the leading-coefficient ratio $5/4$."
        constraints: "rational functions; equal degrees give the leading-coefficient ratio, smaller numerator degree gives 0"
      - id: kp2
        name: Larger numerator degree gives an infinite limit
        key_prerequisites: [limit-laws, vertical-horizontal-asymptotes]
        exemplars:
          - problem: 'Evaluate $\lim_{x \to \infty} \frac{x^3 + 1}{x + 2}$.'
            answer: "∞"
            answer_contract: {kind: none}
            solution_sketch: 'The quotient behaves like $x^2$, which grows without bound.'
          - problem: 'Evaluate $\lim_{x \to \infty} \frac{2x^2 + 3}{1 - x}$.'
            answer: "-∞"
            answer_contract: {kind: none}
            solution_sketch: 'The quotient behaves like $\frac{2x^2}{-x} = -2x \to -\infty$.'
          - problem: 'Evaluate $\lim_{x \to -\infty} \frac{x^2 + 1}{x + 5}$.'
            answer: "-∞"
            answer_contract: {kind: none}
            solution_sketch: 'The quotient behaves like $x$, which tends to $-\infty$.'
        constraints: "numerator degree exceeds denominator degree by 1 or 2; determine the sign from the leading terms"
      - id: kp3
        name: Horizontal asymptotes of rational functions
        key_prerequisites: [vertical-horizontal-asymptotes, limit-laws]
        exemplars:
          - problem: 'The graph of $f(x) = \frac{2x + 1}{x - 4}$ has horizontal asymptote $y = c$. Find $c$.'
            answer: "2"
            solution_sketch: 'Equal degrees: the asymptote is the ratio of leading coefficients, $\frac{2}{1}$.'
          - problem: 'The graph of $f(x) = \frac{3 - x}{2x + 5}$ has horizontal asymptote $y = c$. Find $c$.'
            answer: "-1/2"
            solution_sketch: 'Equal degrees: the asymptote is the ratio of leading coefficients, $\frac{-1}{2}$.'
          - problem: 'The graph of $f(x) = \frac{4x}{x^2 + 1}$ has horizontal asymptote $y = c$. Find $c$.'
            answer: "0"
            solution_sketch: 'The denominator degree is larger, so the quotient tends to $0$ and the asymptote is $y = 0$.'
          - problem: "Let f(x) = (5x^2 - 3x + 1)/(3x^2 + 2x). Evaluate the limit of f(x) as x goes to infinity. Give the answer as a fraction."
            answer: "5/3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The function is f(x) = (5x^2 - 3x + 1)/(3x^2 + 2x). Step 1, degree comparison: the numerator and denominator both have degree 2. Step 2, leading-coefficient rule: for equal degrees the limit is the ratio of leading coefficients, 5/3. The limit is 5/3."
          - problem: "Let f(x) = (7x + 2)/(2x^3 - x). Evaluate the limit of f(x) as x goes to infinity."
            answer: "0"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The function is f(x) = (7x + 2)/(2x^3 - x). Step 1, degree comparison: the numerator has degree 1 and the denominator has degree 3. Step 2, larger-denominator rule: when the denominator degree is higher, the limit is 0. The limit is 0."
          - problem: "The graph of f(x) = (6x^2 + 1)/(k x^2 - 5) has horizontal asymptote y = 3/4. Find k."
            answer: "8"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The function is f(x) = (6x^2 + 1)/(k x^2 - 5). Step 1, degree comparison: both numerator and denominator have degree 2, so the horizontal asymptote is the ratio of leading coefficients, 6/k. Step 2, solve the ratio equation: 6/k = 3/4 gives 24 = 3k. The value is 8."
        constraints: "compare degrees (equal, or denominator higher); the answer is the leading-coefficient ratio, or 0"
    diagnostic_exemplar:
      problem: 'Evaluate $\lim_{x \to -\infty} \frac{2x^2 + 3}{x + 5}$.'
      answer: '-∞'
      answer_contract: {kind: none}
      solution_sketch: 'The numerator degree exceeds the denominator degree by one, so the quotient behaves like $2x$; as $x \to -\infty$ this tends to $-\infty$.'
    anki_seeds:
      - front: "For a rational function with equal numerator and denominator degree, lim_{x→±∞} equals..."
        back: "the ratio of the leading coefficients"
        type: basic
      - front: "If the denominator degree exceeds the numerator degree, lim_{x→±∞} of the rational function is..."
        back: "0 (horizontal asymptote y = 0)"
        type: basic

  - id: one-sided-infinite-limits
