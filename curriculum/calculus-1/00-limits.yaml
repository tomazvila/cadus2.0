        key_prerequisites: [limit-laws, one-sided-limits]
        exemplars:
          - problem: 'Find the vertical asymptote of $f(x) = \frac{x + 1}{x - 3}$.'
            answer: "x = 3"
          - problem: 'Does $f(x) = \frac{x^2 - 4}{x - 2}$ have a vertical asymptote at $x = 2$?'
            answer: "no — the factor cancels, leaving a hole at (2, 4)"
            answer_contract: {kind: none}
            solution_sketch: '$f(x) = x + 2$ for $x \neq 2$: the limit at $2$ is finite, so the gap is a removable hole, not an asymptote.'
          - problem: 'Find all vertical asymptotes and holes of $f(x) = \frac{x + 5}{x^2 - 25}$.'
            answer: "vertical asymptote x = 5; hole at x = -5"
            answer_contract: {kind: none}
            solution_sketch: '$f(x) = \frac{1}{x - 5}$ for $x \neq -5$: the surviving zero of the denominator gives the asymptote, the canceled one a hole.'
        constraints: "factor and cancel first; distinguish surviving denominator zeros (asymptotes) from canceled ones (holes)"
      - id: kp3
        name: Complete asymptote and end-behavior analysis
        key_prerequisites: [limits-at-infinity-rational, one-sided-limits]
        exemplars:
          - problem: 'Find all vertical and horizontal asymptotes of $f(x) = \frac{2x^2}{x^2 - 9}$.'
            answer: "vertical: x = 3 and x = -3; horizontal: y = 2"
            answer_contract: {kind: none}
            solution_sketch: 'The denominator vanishes (without cancellation) at $x = \pm 3$; equal degrees give the horizontal asymptote $y = 2$.'
          - problem: 'Find all vertical and horizontal asymptotes of $f(x) = \frac{x - 1}{x^2 + 1}$.'
            answer: "no vertical asymptote; horizontal: y = 0"
            answer_contract: {kind: none}
            solution_sketch: "no vertical asymptote; horizontal: y = 0"
          - problem: 'Evaluate $\lim_{x \to 1} \frac{1}{(x - 1)^2}$.'
            answer: "∞"
            answer_contract: {kind: none}
            solution_sketch: 'Both one-sided limits are $+\infty$ (the square keeps the denominator positive), so the two-sided infinite limit is $\infty$.'
        constraints: "rational functions; report every vertical and horizontal asymptote, or a two-sided infinite limit"
    diagnostic_exemplar:
      problem: 'Find all vertical asymptotes, all holes, and the horizontal asymptote of $f(x) = \frac{x - 3}{x^2 - 9}$.'
      answer: 'vertical asymptote x = -3; hole at x = 3; horizontal asymptote y = 0'
      answer_contract: {kind: none}
      solution_sketch: '$f(x) = \frac{x-3}{(x-3)(x+3)} = \frac{1}{x+3}$ for $x \neq 3$: the canceled factor leaves a hole at $x = 3$, the surviving zero gives the vertical asymptote $x = -3$, and the denominator degree exceeds the numerator degree, so $y = 0$.'
    anki_seeds:
      - front: "f has a vertical asymptote at x = a when..."
        back: "f(x) → ∞ or -∞ as x → a from the left or the right"
        type: basic
      - front: "A zero of the denominator that cancels with the numerator produces a ___; one that survives produces a ___."
        back: "hole (removable); vertical asymptote"
        type: basic

