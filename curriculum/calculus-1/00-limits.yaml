            answer: 'removable'
            answer_contract: {"kind": "label", "options": [["removable", "a removable discontinuity", "removable discontinuity"], ["jump", "a jump discontinuity", "jump discontinuity"], ["infinite", "an infinite discontinuity", "infinite discontinuity"]]}
            solution_sketch: 'For $x \neq 3$ the fraction equals $x + 3$, so the limit as $x \to 3$ is $6$. The limit exists and is finite but $f(3)$ is undefined, so the discontinuity is removable.'
          - problem: 'Find the coordinates of the hole in the graph of $f(x) = \frac{x^2 - 4}{x - 2}$.'
            answer: '(2, 4)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'For $x \neq 2$ the fraction equals $x + 2$, so the graph follows the line $y = x + 2$. At $x = 2$ this line has height $4$, so the hole is at $(2, 4)$.'
          - problem: 'A parking garage charges $P(t) = 4$ dollars for $0 < t \leq 1$ hours and $P(t) = 7$ dollars for $1 < t \leq 2$ hours. By how many dollars does the charge jump at $t = 1$?'
            answer: '3'
            answer_contract: {"kind": "unit", "quantity": "dollar", "unit": "dollar", "allow_omitted": true}
            solution_sketch: 'Just before $t = 1$ the charge is $4$ dollars and just after it is $7$ dollars. Both one-sided limits exist but differ by $7 - 4 = 3$ dollars, so this is a jump of $3$ dollars.'
          - problem: 'Classify the discontinuity of $f(x) = \frac{3}{(x - 2)^2}$ at $x = 2$ as removable, jump or infinite.'
            answer: 'infinite'
            answer_contract: {"kind": "label", "options": [["removable", "a removable discontinuity", "removable discontinuity"], ["jump", "a jump discontinuity", "jump discontinuity"], ["infinite", "an infinite discontinuity", "infinite discontinuity"]]}
            solution_sketch: 'As $x \to 2$ the denominator $(x - 2)^2$ approaches $0$ from above, so $f(x)$ grows without bound. The limit is infinite, so the discontinuity is infinite.'
          - problem: 'Let $f(x) = x + 1$ for $x < 2$ and $f(x) = 3x - 1$ for $x \geq 2$. By how much does the right-hand limit of $f$ at $x = 2$ exceed the left-hand limit?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The left-hand limit is $2 + 1 = 3$ and the right-hand limit is $3(2) - 1 = 5$. The right-hand limit exceeds the left-hand limit by $5 - 3 = 2$.'
          - problem: 'The average speed of a cyclist over a stretch is $v(t) = \frac{t^2 - 16}{t - 4}$ kilometres per hour for $t \neq 4$, which leaves a hole in its graph at $t = 4$. What speed should be assigned to $v(4)$ to remove the discontinuity?'
            answer: '8'
            answer_contract: {"kind": "unit", "quantity": "speed", "unit": "km/h", "allow_omitted": true}
            solution_sketch: 'For $t \neq 4$ the fraction equals $t + 4$, so the limit as $t \to 4$ is $8$. Assigning $v(4) = 8$ kilometres per hour fills the hole.'
          - problem: 'The graph of $f(x) = \frac{x^2 - 25}{x - 5}$ has a hole at $x = 5$. What is the $y$-coordinate of the hole?'
            answer: '10'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'For $x \neq 5$ the fraction equals $x + 5$. At $x = 5$ this has height $10$, so the hole is at height $10$.'
          - problem: 'Let $f(x) = \frac{|x|}{x}$. Find the right-hand limit of $f(x)$ as $x \to 0$.'
            answer: '1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'For $x > 0$ we have $|x| = x$, so $f(x) = 1$. The right-hand limit is $1$, while the left-hand limit is $-1$, so this is a jump discontinuity.'
        constraints: "one discontinuity per problem; classify it, find the hole or the size of the jump; at least two contexts"
      - id: kp2
        name: Choose a constant to make a function continuous
        key_prerequisites: [continuity-at-a-point]
        try_first:
          problem: 'Let $f(x) = x + 1$ for $x < 2$ and $f(x) = k$ for $x \geq 2$. What value of $k$ makes the two pieces meet at $x = 2$?'
          answer_contract: {"kind": "exact"}
          answer: '3'
          reveal: 'The left piece approaches $2 + 1 = 3$ as $x \to 2$, so the right piece must start at $3$ for the graph to have no gap. Matching the one-sided limits is how we choose the constant.'
        exemplars:
          - problem: 'Find $c$ so that $f(x) = x + c$ for $x < 2$ and $f(x) = 3x - 1$ for $x \geq 2$ is continuous at $x = 2$.'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The left piece approaches $2 + c$ as $x \to 2$ and the right piece gives $3(2) - 1 = 5$. Setting $2 + c = 5$ gives $c = 3$.'
          - problem: 'Find $k$ so that $f(x) = kx^2$ for $x \leq 1$ and $f(x) = x + 1$ for $x > 1$ is continuous at $x = 1$.'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'At $x = 1$ the left piece gives $k(1)^2 = k$ and the right piece gives $1 + 1 = 2$. Continuity needs $k = 2$.'
          - problem: 'Find $c$ so that $f(x) = \frac{x^2 - 25}{x - 5}$ for $x \neq 5$ and $f(5) = c$ is continuous at $x = 5$.'
            answer: '10'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'For $x \neq 5$ the fraction equals $x + 5$, so the limit as $x \to 5$ is $10$. Continuity needs $f(5) = c = 10$.'
          - problem: 'A water company charges $C(v) = 2v$ dollars for $v \leq 12$ cubic metres and $C(v) = 1.5v + k$ dollars for $v > 12$. Find $k$ so that the bill has no jump at $v = 12$.'
            answer: '6'
            answer_contract: {"kind": "unit", "quantity": "dollar", "unit": "dollar", "allow_omitted": true}
            solution_sketch: 'At $v = 12$ the first formula gives $2(12) = 24$ dollars and the second gives $1.5(12) + k = 18 + k$. Setting $18 + k = 24$ gives $k = 6$ dollars.'
          - problem: 'The time in hours to drive $240$ kilometres at speed $v$ kilometres per hour is $T(v) = \frac{240}{v}$ for $v \leq 80$. For $v > 80$ a model uses $T(v) = k - \frac{v}{20}$. Find $k$ so that $T$ is continuous at $v = 80$.'
            answer: '7'
            answer_contract: {"kind": "unit", "quantity": "time", "unit": "h", "allow_omitted": true}
            solution_sketch: 'At $v = 80$ the first formula gives $240/80 = 3$ and the second gives $k - 80/20 = k - 4$. Setting $k - 4 = 3$ gives $k = 7$.'
          - problem: 'Find $c$ so that $f(x) = x^2 + c$ for $x < 3$ and $f(x) = 2x + 1$ for $x \geq 3$ is continuous at $x = 3$.'
            answer: '-2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The left piece approaches $9 + c$ and the right piece gives $2(3) + 1 = 7$. Setting $9 + c = 7$ gives $c = -2$.'
          - problem: 'Find $c$ so that $f(x) = \frac{x^2 - x - 6}{x - 3}$ for $x \neq 3$ and $f(3) = c$ is continuous at $x = 3$.'
            answer: '5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'For $x \neq 3$ we have $x^2 - x - 6 = (x - 3)(x + 2)$, so $f(x) = x + 2$. The limit as $x \to 3$ is $5$, so $c = 5$.'
          - problem: 'Find $c$ so that $f(x) = cx + 1$ for $x < 2$ and $f(x) = x^2 - 1$ for $x \geq 2$ is continuous at $x = 2$.'
            answer: '1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The left piece approaches $2c + 1$ and the right piece gives $2^2 - 1 = 3$. Setting $2c + 1 = 3$ gives $c = 1$.'
        constraints: "one unknown constant; matching one-sided limits (or filling a removable hole) yields an integer; at least two contexts, one with a division"
      - id: kp3
        name: Continuity on intervals and of combinations
        key_prerequisites: [continuity-at-a-point, one-sided-infinite-limits]
        exemplars:
          - problem: 'The domain of $f(x) = \frac{\sqrt{x - 2}}{x - 5}$ is $x \geq 2$ with one value removed. Which value is removed?'
            answer: '5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The square root needs $x - 2 \geq 0$, which gives $x \geq 2$. The denominator $x - 5$ is zero at $x = 5$, so that value is removed.'
          - problem: 'On which interval is $f(x) = \sqrt{9 - x^2}$ continuous?'
            answer: '-3 <= x <= 3'
            answer_contract: {"kind": "inequality_union"}
            solution_sketch: 'The square root needs $9 - x^2 \geq 0$, which means $x^2 \leq 9$. So $f$ is continuous for $-3 \leq x \leq 3$.'
          - problem: 'A manager models the profit per item of a production run of $n$ items as $C(n) = \frac{\sqrt{n - 10}}{n - 30}$ dollars, where a negative value is a loss. For which run sizes $n$ is $C$ continuous?'
            answer: '10 <= n < 30 or n > 30'
            answer_contract: {"kind": "inequality_union"}
            solution_sketch: 'The square root needs $n - 10 \geq 0$, so $n \geq 10$. The denominator is zero at $n = 30$, so we remove that value and $C$ is continuous for $10 \leq n < 30$ and for $n > 30$.'
          - problem: 'Where is $f(x) = \frac{1}{\sqrt{4 - x^2}}$ continuous?'
            answer: '-2 < x < 2'
            answer_contract: {"kind": "inequality_union"}
            solution_sketch: 'The square root needs $4 - x^2 \geq 0$, and it also sits in a denominator, so we need $4 - x^2 > 0$. That gives $-2 < x < 2$.'
          - problem: 'Let $f(x) = \sqrt{x}$ and $g(x) = x^2 - 9$. Where is the composite function $f(g(x))$ continuous?'
            answer: 'x <= -3 or x >= 3'
            answer_contract: {"kind": "inequality_union"}
            solution_sketch: 'The composite $\sqrt{x^2 - 9}$ needs $x^2 - 9 \geq 0$, so $x^2 \geq 9$. That gives $x \leq -3$ or $x \geq 3$, and $f(g(x))$ is continuous on that set.'
          - problem: 'The waiting time at a checkout is $W(r) = \frac{5}{\sqrt{100 - r}}$ minutes when $r \geq 0$ customers arrive per hour. For which values of $r$ is this formula defined and continuous?'
            answer: '0 <= r < 100'
            answer_contract: {"kind": "inequality_union"}
            solution_sketch: 'The square root sits in a denominator, so we need $100 - r > 0$. Together with $r \geq 0$ this gives $0 \leq r < 100$, and $W$ is continuous for all such $r$.'
          - problem: 'Where is $f(x) = \frac{\sqrt{x - 2}}{x^2 - 9}$ continuous?'
            answer: '2 <= x < 3 or x > 3'
            answer_contract: {"kind": "inequality_union"}
            solution_sketch: 'The square root needs $x \geq 2$, and the denominator $x^2 - 9$ is zero at $x = \pm 3$. Of these only $x = 3$ lies in the domain, so $f$ is continuous for $2 \leq x < 3$ and for $x > 3$.'
        constraints: "domains determined by roots and denominators; answers as inequalities or intervals; at least two contexts"
    diagnostic_exemplar:
      problem: 'Find $c$ so that $f(x) = x + c$ for $x < 1$ and $f(x) = 4x$ for $x \geq 1$ is continuous at $x = 1$.'
      answer: "3"
      solution_sketch: 'Continuity at $x = 1$ forces the two branches to agree there: $1 + c = 4(1)$, so $c = 3$.'
    anki_seeds:
      - front: "A removable discontinuity is one where..."
        back: "the limit exists but differs from f(a) (or f(a) is undefined) — redefining one point fixes it"
        type: basic
      - front: "A jump discontinuity is one where..."
        back: "both one-sided limits exist but are unequal"
        type: basic
      - front: "Sums, products, quotients (nonzero denominator), and compositions of continuous functions are..."
        back: "continuous"
        type: basic

  - id: intermediate-value-theorem
    name: The Intermediate Value Theorem
    core: false                # stated existence theorem; nothing builds on it (MAW p.391)
    difficulty: 0.62
    drill: false
    answer_kind: numeric
    expected_time_secs: 150
    prerequisites:
      - id: continuity
        weight: 0.8
        key: true
      - id: evaluating-functions
        weight: 0.4
      - id: evaluating-polynomials
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: Verify the hypotheses and conclude a root exists
        key_prerequisites: [continuity, evaluating-functions]
        exemplars:
          - problem: 'Does the Intermediate Value Theorem guarantee that $f(x) = x^3 + x - 3$ has a root in the interval $(1, 2)$?'
            answer: 'yes'
            answer_contract: {"kind": "label", "options": [["yes", "it does", "yes, it does", "it guarantees a root", "the theorem guarantees a root", "yes, it guarantees a root", "guaranteed", "there is a root"], ["no", "it does not", "no, it does not", "it does not guarantee a root", "the theorem does not guarantee a root", "not guaranteed", "no, it does not guarantee a root", "there is no guarantee"]]}
            solution_sketch: 'The polynomial $f$ is continuous on $[1, 2]$. We have $f(1) = -1 < 0$ and $f(2) = 7 > 0$, so $f$ changes sign, and the theorem guarantees a root in $(1, 2)$.'
          - problem: 'To show that $f(x) = x^3 - 2x - 5$ has a root in $(2, 3)$ we need the sign of $f$ at both ends. Find $f(3)$.'
            answer: '16'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Substituting gives $f(3) = 27 - 6 - 5 = 16$. Since $f(2) = -1$ is negative and $f(3) = 16$ is positive, the theorem gives a root in $(2, 3)$.'
          - problem: 'A start-up''s monthly profit in thousands of dollars is modelled by the continuous function $P(m) = m^2 - 8m + 6$, and $P(0) = 6$. To see whether the profit was exactly zero at some time between month $0$ and month $2$, find $P(2)$.'
            answer: '-6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'We have $P(2) = 4 - 16 + 6 = -6$. The profit is positive at month $0$ and negative at month $2$, so the Intermediate Value Theorem gives a time in between when it was exactly zero.'
          - problem: 'Can the Intermediate Value Theorem, applied to the endpoint values, show that $p(x) = x^2 - 1$ has a root in the interval $(-2, 2)$?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "it does", "yes, it does", "it guarantees a root", "the theorem guarantees a root", "yes, it guarantees a root", "guaranteed", "there is a root"], ["no", "it does not", "no, it does not", "it does not guarantee a root", "the theorem does not guarantee a root", "not guaranteed", "no, it does not guarantee a root", "there is no guarantee"]]}
            solution_sketch: 'We have $p(-2) = 3$ and $p(2) = 3$, which have the same sign, so the theorem gives no conclusion. The roots $x = -1$ and $x = 1$ do exist, but this test does not detect them.'
          - problem: 'A ball is thrown upward from a balcony. The model $h(t) = -5t^2 + 10t + 15$ gives its height in metres above the ground after $t$ seconds, and a negative value means that the ball would be below the ground. Find $h(4)$.'
            answer: '-25'
            answer_contract: {"kind": "unit", "quantity": "length", "unit": "m", "allow_omitted": true}
            solution_sketch: 'We have $h(4) = -80 + 40 + 15 = -25$ metres. Since $h(2) = 15$ is positive and $h(4)$ is negative, the theorem gives a time between $2$ and $4$ seconds when the ball reaches the ground.'
          - problem: 'The polynomial $p(x) = x^3 - 4x + 1$ is continuous. Find $p(1)$ to decide whether $p$ has a root in $(0, 1)$.'
            answer: '-2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'We have $p(1) = 1 - 4 + 1 = -2$, which is negative, and $p(0) = 1$ is positive. So the theorem gives a root of $p$ in $(0, 1)$.'
          - problem: 'The function $f(x) = x^2 - 12$ has a root in $(n, n + 1)$ for exactly one whole number $n > 0$. Find $n$.'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'We have $f(3) = 9 - 12 = -3$ and $f(4) = 16 - 12 = 4$. The sign changes between $3$ and $4$, so the root lies in $(3, 4)$ and $n = 3$.'
        constraints: "cubic or quadratic with integer endpoint values; decide whether the endpoint values show a sign change; two contexts"
      - id: kp2
        name: Locate a root interval from values
        key_prerequisites: [continuity, evaluating-functions]
        exemplars:
          - problem: 'A continuous function has $f(1) = -2$, $f(2) = 1$ and $f(3) = 4$. On which interval must $f$ have a root?'
            answer: '1 < x < 2'
            answer_contract: {"kind": "inequality_union"}
            solution_sketch: 'The values $-2$ and $1$ have opposite signs, so the sign changes between $x = 1$ and $x = 2$. The theorem gives a root in $(1, 2)$.'
          - problem: 'A continuous function has $f(0) = 3$ and $f(4) = -5$. On which interval does the Intermediate Value Theorem guarantee a root?'
            answer: '0 < x < 4'
            answer_contract: {"kind": "inequality_union"}
            solution_sketch: 'The values $f(0) = 3$ and $f(4) = -5$ have opposite signs, so the theorem guarantees a root in $(0, 4)$.'
          - problem: 'A continuous function has $f(0) = -1$, $f(1) = -3$, $f(2) = -4$, $f(3) = 2$ and $f(4) = 5$. On which interval must $f$ have a root?'
            answer: '2 < x < 3'
            answer_contract: {"kind": "inequality_union"}
            solution_sketch: 'The first three values are negative and the last two are positive. The sign changes between $f(2) = -4$ and $f(3) = 2$, so there is a root in $(2, 3)$.'
          - problem: 'The temperature $T(t)$ in degrees Celsius at an outdoor sensor is a continuous function of the hour $t$. At $t = 18, 19, 20, 21$ the readings are $6, 3, -1, -2$. During which hour did the temperature pass through $0$ degrees?'
            answer: '19 < t < 20'
            answer_contract: {"kind": "inequality_union"}
            solution_sketch: 'The readings $6$ and $3$ are positive, and $-1$ and $-2$ are negative. The sign changes between $t = 19$ and $t = 20$, so the temperature was exactly $0$ at some time in that hour.'
          - problem: 'The values of a continuous function are $f(-2) = 5$, $f(-1) = 2$, $f(0) = -1$ and $f(1) = -4$. On which interval must $f$ have a root?'
            answer: '-1 < x < 0'
            answer_contract: {"kind": "inequality_union"}
            solution_sketch: 'The values $5$ and $2$ are positive and $-1$ and $-4$ are negative. The sign changes between $x = -1$ and $x = 0$, so there is a root in $(-1, 0)$.'
          - problem: 'At the end of weeks $1, 2, 3, 4, 5$ the balance of an account in dollars is $120, 70, 25, -20, -60$, and the balance changes continuously. In which time interval, with $t$ in weeks, must the balance have been exactly zero?'
            answer: '3 < t < 4'
            answer_contract: {"kind": "inequality_union"}
            solution_sketch: 'The balance is positive at weeks $1$, $2$ and $3$ and negative at weeks $4$ and $5$. It crosses zero between $t = 3$ and $t = 4$, so the balance was exactly zero at some time in $(3, 4)$.'
          - problem: 'A continuous function has $f(1) = 3$, $f(2) = 5$, $f(3) = 8$ and $f(4) = 2$. Does the Intermediate Value Theorem guarantee a root of $f$ in $(1, 4)$?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "it does", "yes, it does", "it guarantees a root", "the theorem guarantees a root", "yes, it guarantees a root", "guaranteed", "there is a root"], ["no", "it does not", "no, it does not", "it does not guarantee a root", "the theorem does not guarantee a root", "not guaranteed", "no, it does not guarantee a root", "there is no guarantee"]]}
            solution_sketch: 'All four values are positive, so no pair of values has opposite signs. The theorem gives no root, although $f$ might still have one.'
          - problem: 'A continuous function has $f(0) = 2$, $f(1) = -3$ and $f(2) = -4$. On which interval must $f$ have a root?'
            answer: '0 < x < 1'
            answer_contract: {"kind": "inequality_union"}
            solution_sketch: 'The value $f(0) = 2$ is positive and $f(1) = -3$ is negative, so the sign changes between $x = 0$ and $x = 1$. The root lies in $(0, 1)$.'
        constraints: "table of integer values with exactly one sign change; identify the bracketing interval; two contexts; one item where the signs do not change"
      - id: kp3
        name: Intermediate values other than zero, and why continuity is essential
        key_prerequisites: [continuity]
        try_first:
          problem: 'A continuous function $f$ has $f(0) = 1$ and $f(2) = 9$. Must $f$ take the value $5$ somewhere in $(0, 2)$?'
          answer_contract: {"kind": "label", "options": [["yes", "it must", "yes it must", "yes, it must", "it does"], ["no", "it need not", "not necessarily", "no it need not", "no, it need not"]]}
          answer: 'yes'
          reveal: 'The value $5$ lies between $f(0) = 1$ and $f(2) = 9$, and a continuous function cannot skip values. The theorem covers every value between the endpoint values, not only $0$.'
        exemplars:
          - problem: 'The function $f$ is continuous on $[1, 3]$ with $f(1) = 3$ and $f(3) = 9$. Must $f$ take the value $7$ somewhere in $(1, 3)$?'
            answer: 'yes'
            answer_contract: {"kind": "label", "options": [["yes", "it must", "yes it must", "yes, it must", "it does", "must"], ["no", "it need not", "not necessarily", "no it need not", "no, it need not", "it does not", "does not have to"]]}
            solution_sketch: 'The value $7$ lies between $f(1) = 3$ and $f(3) = 9$. Since $f$ is continuous on $[1, 3]$, the theorem gives a number $c$ in $(1, 3)$ with $f(c) = 7$.'
          - problem: 'A hiker''s elevation is a continuous function of time. It is $1200$ metres at 8:00 and $1800$ metres at 12:00. Give an elevation in metres that the hiker must have passed between 8:00 and 12:00.'
            answer: '1500'
            answer_contract: {"kind": "property", "check": "between", "args": {"low": "1200", "high": "1800"}}
            solution_sketch: 'The elevation changes continuously from $1200$ to $1800$ metres, so by the Intermediate Value Theorem it takes every value between them. For example $1500$ metres lies between $1200$ and $1800$.'
          - problem: 'A continuous function $f$ has $f(0) = -4$ and $f(6) = 20$. Give a value that $f$ must take somewhere in $(0, 6)$.'
            answer: '10'
            answer_contract: {"kind": "property", "check": "between", "args": {"low": "-4", "high": "20"}}
            solution_sketch: 'The theorem says $f$ takes every value between $f(0) = -4$ and $f(6) = 20$. The value $10$ lies between them, so $f$ must take the value $10$.'
          - problem: 'The function $g(x) = \frac{1}{x}$ has $g(-1) = -1$ and $g(1) = 1$, but $g$ has no zero in $(-1, 1)$. Which hypothesis of the Intermediate Value Theorem fails on $[-1, 1]$?'
            answer: 'continuity'
            answer_contract: {"kind": "label", "options": [["continuity", "continuous", "g is not continuous", "it is not continuous", "continuity fails", "g is discontinuous"], ["differentiability", "differentiable", "g is not differentiable", "it is not differentiable"], ["monotonicity", "monotonic", "g is not monotonic", "it is not monotonic"], ["boundedness", "bounded", "g is not bounded", "it is not bounded"]]}
            solution_sketch: 'The theorem needs $g$ to be continuous on the whole closed interval $[-1, 1]$. The function $1/x$ is undefined at $x = 0$, which lies inside the interval, so the continuity hypothesis fails.'
          - problem: 'For $g(x) = \frac{1}{x}$ on $[-1, 1]$, at which value of $x$ is continuity lost?'
            answer: '0'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The function $1/x$ is defined and continuous at every $x \neq 0$. At $x = 0$ it is undefined, so continuity is lost at $x = 0$.'
          - problem: 'A furnace''s temperature after $t$ minutes is $T(t) = t^2 + 100$ degrees Celsius for $0 \leq t \leq 10$, so it rises from $100$ to $200$. At what time does it reach exactly $164$ degrees?'
            answer: '8'
            answer_contract: {"kind": "unit", "quantity": "time", "unit": "min", "allow_omitted": true}
            solution_sketch: 'Since $164$ lies between $T(0) = 100$ and $T(10) = 200$ and $T$ is continuous, the temperature reaches $164$. Solving $t^2 + 100 = 164$ gives $t^2 = 64$, so $t = 8$ minutes.'
          - problem: 'Let $f(x) = x^2 + 1$ on $[1, 2]$. Find the number $c$ in $(1, 2)$ for which $f(c) = 4$.'
            answer: 'sqrt(3)'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'We have $f(1) = 2$ and $f(2) = 5$, and $4$ lies between them, so such a $c$ exists. Solving $c^2 + 1 = 4$ gives $c^2 = 3$, so $c = \sqrt{3}$, which lies in $(1, 2)$.'
          - problem: 'The function $f(x) = x^3 + 2x$ is continuous on $[1, 2]$. What is the smallest whole number $N$ for which the Intermediate Value Theorem guarantees $f(c) = N$ for some $c$ in $(1, 2)$?'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'We have $f(1) = 3$ and $f(2) = 12$. The theorem covers every value strictly between $3$ and $12$, and the smallest whole number there is $4$.'
          - problem: 'The function $f$ is continuous on $[2, 5]$ with $f(2) = 1$ and $f(5) = 5$. Which whole numbers must $f$ take as a value somewhere in $(2, 5)$?'
            answer: '2, 3, 4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Every value strictly between $f(2) = 1$ and $f(5) = 5$ is taken inside $(2, 5)$. The whole numbers strictly between $1$ and $5$ are $2$, $3$ and $4$.'
        constraints: "one intermediate-value application with N not equal to 0 and one broken-hypothesis example; two contexts"
    diagnostic_exemplar:
      problem: 'Use the Intermediate Value Theorem to show that $f(x) = x^3 + x$ takes the value $5$ somewhere in $(1, 2)$.'
      answer: 'f is a polynomial, hence continuous on [1, 2], and f(1) = 2 < 5 < 10 = f(2), so the IVT gives some c in (1, 2) with f(c) = 5'
      answer_contract: {kind: none}
      solution_sketch: 'Apply the IVT with the intermediate value $N = 5$ lying between $f(1) = 2$ and $f(2) = 10$.'
    anki_seeds:
      - front: "IVT: if f is continuous on [a, b] and N is between f(a) and f(b), then..."
        back: "f(c) = N for some c in (a, b)"
        type: basic
      - front: "The IVT's two hypotheses are..."
        back: "f continuous on the closed interval [a, b], and the target value N strictly between f(a) and f(b)"
        type: basic
