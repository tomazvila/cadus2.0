  - id: limits-algebraic
    name: Algebraic Limit Techniques
    core: true
    difficulty: 0.58
    drill: false
    answer_kind: numeric
    expected_time_secs: 150
    prerequisites:
      - id: factoring-limits
        weight: 0.8
        key: true
      - id: simplifying-radicals
        weight: 0.5
        key: true
      - id: complex-fractions
        weight: 0.5
      - id: rational-expressions
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: Rationalize to resolve 0/0
        key_prerequisites: [simplifying-radicals, factoring-limits]
        exemplars:
          - problem: 'Evaluate $\lim_{x \to 0} \frac{\sqrt{x + 4} - 2}{x}$.'
            answer: '1/4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Substitution gives $0/0$, so multiply top and bottom by the conjugate $\sqrt{x + 4} + 2$. The numerator becomes $(x + 4) - 4 = x$, which cancels the $x$ below. The fraction is $\frac{1}{\sqrt{x + 4} + 2}$, and the limit is $\frac{1}{4}$.'
          - problem: 'Evaluate $\lim_{x \to 9} \frac{\sqrt{x} - 3}{x - 9}$.'
            answer: '1/6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Substitution gives $0/0$. Factor the denominator as $x - 9 = (\sqrt{x} - 3)(\sqrt{x} + 3)$ and cancel $\sqrt{x} - 3$ for $x \neq 9$. The fraction becomes $\frac{1}{\sqrt{x} + 3}$, and the limit is $\frac{1}{6}$.'
          - problem: 'Evaluate $\lim_{x \to 0} \frac{\sqrt{x + 1} - 1}{x}$.'
            answer: '1/2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Multiply top and bottom by $\sqrt{x + 1} + 1$. The numerator becomes $(x + 1) - 1 = x$, which cancels the $x$ below. The limit of $\frac{1}{\sqrt{x + 1} + 1}$ is $\frac{1}{2}$.'
          - problem: 'Evaluate $\lim_{x \to 4} \frac{\sqrt{x + 12} - 4}{x - 4}$.'
            answer: '1/8'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Multiply top and bottom by $\sqrt{x + 12} + 4$. The numerator becomes $(x + 12) - 16 = x - 4$, which cancels. The limit of $\frac{1}{\sqrt{x + 12} + 4}$ is $\frac{1}{8}$.'
          - problem: 'Evaluate $\lim_{x \to 25} \frac{\sqrt{x} - 5}{x - 25}$.'
            answer: '1/10'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Multiply top and bottom by $\sqrt{x} + 5$. The numerator becomes $x - 25$, which cancels the denominator. The limit of $\frac{1}{\sqrt{x} + 5}$ is $\frac{1}{10}$.'
          - problem: 'Evaluate $\lim_{x \to 30} \frac{\sqrt{x + 6} - 6}{x - 30}$.'
            answer: '1/12'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Multiply top and bottom by $\sqrt{x + 6} + 6$. The numerator becomes $(x + 6) - 36 = x - 30$, which cancels. The limit of $\frac{1}{\sqrt{x + 6} + 6}$ is $\frac{1}{12}$.'
          - problem: 'A square garden of area $A$ square metres has side $\sqrt{A}$ metres. The change in side per square metre of added area, starting from $81$ square metres, is $\frac{\sqrt{A} - 9}{A - 81}$. What value does this approach as $A$ approaches $81$?'
            answer: '1/18'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Multiply top and bottom by $\sqrt{A} + 9$, so the numerator becomes $A - 81$ and cancels. The expression becomes $\frac{1}{\sqrt{A} + 9}$, and the limit is $\frac{1}{18}$ metre per square metre.'
          - problem: 'A wire hangs with a load of $x$ kilograms and has length $\sqrt{x + 49}$ metres. Its extension per kilogram is $\frac{\sqrt{x + 49} - 7}{x}$ metres per kilogram. What value does this approach as $x$ approaches $0$?'
            answer: '1/14'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Substitution gives $0/0$, so multiply top and bottom by $\sqrt{x + 49} + 7$. The numerator becomes $x$, which cancels. The limit of $\frac{1}{\sqrt{x + 49} + 7}$ is $\frac{1}{14}$.'
          - problem: 'What is the value of $\lim_{x \to 0} \frac{\sqrt{x + 36} - 6}{x}$?'
            answer: '1/12'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The numerator and the denominator both tend to $0$, so the limit needs more work. Multiply top and bottom by $\sqrt{x + 36} + 6$ to get $\frac{1}{\sqrt{x + 36} + 6}$. The limit is $\frac{1}{12}$.'
        constraints: 'one square root; conjugate multiplication produces a clean cancellation; answers are unit fractions; measured contexts'
      - id: kp2
        name: Simplify complex fractions and difference quotients
        key_prerequisites: [complex-fractions, factoring-limits]
        exemplars:
          - problem: 'Evaluate $\lim_{x \to 0} \frac{\frac{1}{x + 2} - \frac{1}{2}}{x}$.'
            answer: '-1/4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Combine the numerator over the common denominator $2(x + 2)$ to get $\frac{-x}{2(x + 2)}$. Dividing by $x$ leaves $\frac{-1}{2(x + 2)}$ for $x \neq 0$. The limit is $\frac{-1}{4}$.'
          - problem: 'Evaluate $\lim_{h \to 0} \frac{(3 + h)^2 - 9}{h}$.'
            answer: '6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Expand the square: the numerator is $9 + 6h + h^2 - 9 = 6h + h^2$. Dividing by $h$ gives $6 + h$ for $h \neq 0$. The limit is $6$.'
          - problem: 'Evaluate $\lim_{h \to 0} \frac{\frac{1}{1 + h} - 1}{h}$.'
            answer: '-1'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Combine the numerator: $\frac{1 - (1 + h)}{1 + h} = \frac{-h}{1 + h}$. Dividing by $h$ leaves $\frac{-1}{1 + h}$ for $h \neq 0$. The limit is $-1$.'
          - problem: 'Evaluate $\lim_{h \to 0} \frac{(5 + h)^2 - 25}{h}$.'
            answer: '10'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Expand the square: the numerator is $25 + 10h + h^2 - 25 = 10h + h^2$. Dividing by $h$ gives $10 + h$ for $h \neq 0$. The limit is $10$.'
          - problem: 'Evaluate $\lim_{x \to 0} \frac{\frac{1}{x + 6} - \frac{1}{6}}{x}$.'
            answer: '-1/36'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Combine the numerator over $6(x + 6)$ to get $\frac{-x}{6(x + 6)}$. Dividing by $x$ leaves $\frac{-1}{6(x + 6)}$ for $x \neq 0$. The limit is $\frac{-1}{36}$.'
          - problem: 'Evaluate $\lim_{h \to 0} \frac{\sqrt{9 + h} - 3}{h}$.'
            answer: '1/6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Multiply top and bottom by $\sqrt{9 + h} + 3$. The numerator becomes $(9 + h) - 9 = h$, which cancels the $h$ below. The limit of $\frac{1}{\sqrt{9 + h} + 3}$ is $\frac{1}{6}$.'
          - problem: 'A stone falls $s(t) = 5t^2$ metres in $t$ seconds. Its average speed from $t = 3$ to $t = 3 + h$ is $\frac{s(3 + h) - s(3)}{h}$. What value does this approach as $h$ approaches $0$?'
            answer: '30'
            answer_contract: {"kind":"unit","quantity":"speed","unit":"m/s","allow_omitted":true}
            solution_sketch: 'The numerator is $5(3 + h)^2 - 45 = 30h + 5h^2$. Dividing by $h$ gives $30 + 5h$ for $h \neq 0$. The limit is $30$ metres per second.'
          - problem: 'A shop sells $q(p) = \frac{100}{p}$ items at a price of $p$ dollars. The average change in $q$ per dollar, from a price of $5$ dollars to $5 + h$ dollars, is $\frac{q(5 + h) - q(5)}{h}$. What value does this approach as $h$ approaches $0$, in items per dollar?'
            answer: '-4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The numerator is $\frac{100}{5 + h} - 20 = \frac{-20h}{5 + h}$. Dividing by $h$ leaves $\frac{-20}{5 + h}$ for $h \neq 0$. The limit is $\frac{-20}{5} = -4$ items per dollar.'
          - problem: 'What is the value of $\lim_{h \to 0} \frac{(4 + h)^2 - 16}{h}$?'
            answer: '8'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The square is $(4 + h)^2 = 16 + 8h + h^2$, which includes the middle term $8h$. The numerator is $8h + h^2$, so the fraction equals $8 + h$ for $h \neq 0$. The limit is $8$.'
        constraints: 'difference-quotient shape; small integer parameters; exact fraction or integer answers; rate contexts'
      - id: kp3
        name: Choose the right technique
        key_prerequisites: [factoring-limits, simplifying-radicals]
        exemplars:
          - problem: 'Evaluate $\lim_{x \to 4} \frac{x - 4}{\sqrt{x} - 2}$.'
            answer: '4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Substitution gives $0/0$, and the root signals rationalizing. Multiply top and bottom by $\sqrt{x} + 2$, so the denominator becomes $x - 4$ and cancels. The expression becomes $\sqrt{x} + 2$, and the limit is $4$.'
          - problem: 'Evaluate $\lim_{x \to 3} \frac{x^2 - x - 6}{x^2 - 9}$.'
            answer: '5/6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Substitution gives $0/0$, and both parts are polynomials, so factor. The numerator is $(x - 3)(x + 2)$ and the denominator is $(x - 3)(x + 3)$. After cancelling, $\frac{x + 2}{x + 3}$ gives $\frac{5}{6}$.'
          - problem: 'Evaluate $\lim_{h \to 0} \frac{(1 + h)^3 - 1}{h}$.'
            answer: '3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Substitution gives $0/0$, and a power of a sum signals expanding. The numerator is $1 + 3h + 3h^2 + h^3 - 1 = 3h + 3h^2 + h^3$. Dividing by $h$ gives $3 + 3h + h^2$, and the limit is $3$.'
          - problem: 'Evaluate $\lim_{x \to 0} \frac{\frac{1}{x + 3} - \frac{1}{3}}{x}$.'
            answer: '-1/9'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Substitution gives $0/0$, and fractions inside a fraction signal combining. The numerator is $\frac{-x}{3(x + 3)}$, so the quotient is $\frac{-1}{3(x + 3)}$ for $x \neq 0$. The limit is $\frac{-1}{9}$.'
          - problem: 'Evaluate $\lim_{x \to 0} \frac{\sqrt{x + 25} - 5}{x}$.'
            answer: '1/10'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Substitution gives $0/0$, and a root minus a number signals rationalizing. Multiply top and bottom by $\sqrt{x + 25} + 5$ to get $\frac{1}{\sqrt{x + 25} + 5}$. The limit is $\frac{1}{10}$.'
          - problem: 'Evaluate $\lim_{x \to 1} \frac{x^3 - 1}{x^2 - 1}$.'
            answer: '3/2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Substitution gives $0/0$, so factor: $x^3 - 1 = (x - 1)(x^2 + x + 1)$ and $x^2 - 1 = (x - 1)(x + 1)$. After cancelling $x - 1$, the quotient $\frac{x^2 + x + 1}{x + 1}$ gives $\frac{3}{2}$.'
          - problem: 'A cube has side $2 + h$ metres, so its volume is $(2 + h)^3$ cubic metres. The average change in volume per metre of added side, from side $2$ metres, is $\frac{(2 + h)^3 - 8}{h}$. What value does this approach as $h$ approaches $0$, in cubic metres per metre?'
            answer: '12'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Expand $(2 + h)^3 = 8 + 12h + 6h^2 + h^3$, so the numerator is $12h + 6h^2 + h^3$. Dividing by $h$ gives $12 + 6h + h^2$, and the limit is $12$.'
          - problem: 'A trip of $120$ kilometres at a speed of $v$ kilometres per hour takes $\frac{120}{v}$ hours. The average change in time per unit of speed, from $60$ kilometres per hour, is $\frac{\frac{120}{v} - 2}{v - 60}$. What value does this approach as $v$ approaches $60$, in hours per kilometre per hour?'
            answer: '-1/30'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Combine the numerator: $\frac{120}{v} - 2 = \frac{120 - 2v}{v} = \frac{-2(v - 60)}{v}$. Dividing by $v - 60$ leaves $\frac{-2}{v}$ for $v \neq 60$. The limit is $\frac{-2}{60} = -\frac{1}{30}$.'
          - problem: 'What is the value of $\lim_{x \to 0} \frac{\sqrt{x + 9} - 3}{x}$?'
            answer: '1/6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The multiplier must be the conjugate $\sqrt{x + 9} + 3$. Then the numerator becomes $(x + 9) - 9 = x$, which cancels the $x$ below. The limit of $\frac{1}{\sqrt{x + 9} + 3}$ is $\frac{1}{6}$.'
        constraints: 'mixed 0/0 forms requiring factoring, expanding, rationalizing, or combining fractions; exact answers; rate contexts'
    diagnostic_exemplar:
      problem: 'Evaluate $\lim_{x \to 0} \frac{\frac{1}{x + 4} - \frac{1}{4}}{x}$.'
      answer: '-1/16'
      solution_sketch: 'Combine the numerator: $\frac{1}{x+4} - \frac{1}{4} = \frac{-x}{4(x+4)}$. Dividing by $x$ leaves $\frac{-1}{4(x+4)} \to -\frac{1}{16}$.'
    anki_seeds:
      - front: "To evaluate a 0/0 limit containing √(x) - a, multiply by..."
        back: "the conjugate (√(x) + a)/(√(x) + a)"
        type: basic
      - front: "For a 0/0 limit built from small fractions (a complex fraction), first..."
        back: "combine the inner fractions over a common denominator, then cancel the outer variable"
        type: basic

  - id: limits-at-infinity-rational
    name: Limits at Infinity of Rational Functions
    core: true
    difficulty: 0.55
    drill: false
    answer_kind: expression
    expected_time_secs: 120
    prerequisites:
      - id: limit-laws
        weight: 0.7
        key: true
      - id: vertical-horizontal-asymptotes
        weight: 0.5
        key: true
      - id: rational-expressions
        weight: 0.4
      - id: polynomial-end-behavior-graphing
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: Equal or smaller numerator degree
        key_prerequisites: [limit-laws]
        exemplars:
          - problem: 'Evaluate $\lim_{x \to \infty} \frac{3x^2 - 5}{2x^2 + 1}$.'
            answer: '3/2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The degrees are equal, so divide top and bottom by $x^2$ to get $\frac{3 - 5/x^2}{2 + 1/x^2}$. The terms $5/x^2$ and $1/x^2$ tend to $0$. The limit is $\frac{3}{2}$.'
          - problem: 'Evaluate $\lim_{x \to \infty} \frac{5x + 1}{x^2 + 3}$.'
            answer: '0'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The numerator has degree $1$ and the denominator has degree $2$. Dividing top and bottom by $x^2$ gives $\frac{5/x + 1/x^2}{1 + 3/x^2}$, and the numerator tends to $0$. The limit is $0$.'
          - problem: 'Evaluate $\lim_{x \to \infty} \frac{7x^3 + x}{2x^3 - 5}$.'
            answer: '7/2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The degrees are equal, so divide top and bottom by $x^3$ to get $\frac{7 + 1/x^2}{2 - 5/x^3}$. The extra terms tend to $0$. The limit is $\frac{7}{2}$.'
          - problem: 'Evaluate $\lim_{x \to \infty} \frac{8x^3 - 2x}{6x^3 + x + 5}$.'
            answer: '4/3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The degrees are equal, so divide top and bottom by $x^3$ to get $\frac{8 - 2/x^2}{6 + 1/x^2 + 5/x^3}$. The extra terms tend to $0$. The limit is $\frac{8}{6} = \frac{4}{3}$.'
          - problem: 'Evaluate $\lim_{x \to -\infty} \frac{-4x^2 + 1}{2x^2 + x}$.'
            answer: '-2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The degrees are equal, so divide top and bottom by $x^2$ to get $\frac{-4 + 1/x^2}{2 + 1/x}$. The extra terms tend to $0$ as $x \to -\infty$. The limit is $\frac{-4}{2} = -2$.'
          - problem: 'Evaluate $\lim_{x \to -\infty} \frac{5x^2 + 2}{4x^2 - 9}$.'
            answer: '5/4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The degrees are equal, so divide top and bottom by $x^2$ to get $\frac{5 + 2/x^2}{4 - 9/x^2}$. The extra terms tend to $0$. The limit is $\frac{5}{4}$.'
          - problem: 'Producing $n$ items costs $C(n) = 500 + 4n$ dollars, so the average cost per item is $\frac{C(n)}{n}$ dollars. What value does the average cost approach as $n$ grows without bound?'
            answer: '4'
            answer_contract: {"kind":"unit","quantity":"dollar","unit":"dollar","allow_omitted":true}
            solution_sketch: 'The average cost is $\frac{4n + 500}{n}$, and both degrees are $1$. Dividing by $n$ gives $4 + \frac{500}{n}$, and $\frac{500}{n}$ tends to $0$. The average cost approaches $4$ dollars.'
          - problem: 'A tank holds $200$ litres of water with $20$ kilograms of salt. Brine with $0.5$ kilogram of salt per litre flows in at $4$ litres per minute, so after $t$ minutes the salt is $20 + 2t$ kilograms in $200 + 4t$ litres. What value does the concentration $\frac{20 + 2t}{200 + 4t}$ approach as $t \to \infty$, in kilograms per litre?'
            answer: '1/2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Both degrees are $1$, so divide top and bottom by $t$ to get $\frac{20/t + 2}{200/t + 4}$. The limit is the ratio of the leading coefficients, $\frac{2}{4} = \frac{1}{2}$ kilogram per litre.'
          - problem: 'A drug concentration in the blood is $c(t) = \frac{5t}{t^2 + 2}$ milligrams per litre after $t$ hours. What value does $c(t)$ approach as $t \to \infty$, in milligrams per litre?'
            answer: '0'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The numerator has degree $1$ and the denominator has degree $2$, so the denominator grows faster. Dividing by $t^2$ gives $\frac{5/t}{1 + 2/t^2}$, which tends to $0$. The concentration approaches $0$.'
          - problem: 'What is the value of $\lim_{x \to \infty} \frac{6x + 1}{3x^2}$?'
            answer: '0'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The degrees are not equal: the numerator has degree $1$ and the denominator has degree $2$. Dividing by $x^2$ gives $\frac{6/x + 1/x^2}{3}$, which tends to $0$. The equal-degree rule does not apply here.'
        constraints: 'rational functions; equal degrees give the leading-coefficient ratio, smaller numerator degree gives 0; average-cost and mixing contexts'
      - id: kp2
        name: Larger numerator degree gives an infinite limit
        key_prerequisites: [limit-laws, vertical-horizontal-asymptotes]
        exemplars:
          - problem: 'Find $\lim_{x \to \infty} \frac{x^3 + 1}{x + 2}$.'
            answer: 'infinity'
            answer_contract: {"kind":"label","options":[["does not exist","DNE","no limit"], ["infinity","∞","+∞","positive infinity","+infinity","oo","inf"], ["negative infinity","-infinity","-∞","−∞","minus infinity","-oo","-inf"]]}
            solution_sketch: 'The numerator has degree $3$ and the denominator has degree $1$, so the quotient behaves like $\frac{x^3}{x} = x^2$. As $x \to \infty$ the value $x^2$ grows without bound with a positive sign. The limit is infinity.'
          - problem: 'Find $\lim_{x \to -\infty} \frac{x^2 + 1}{x + 5}$.'
            answer: 'negative infinity'
            answer_contract: {"kind":"label","options":[["does not exist","DNE","no limit"], ["infinity","∞","+∞","positive infinity","+infinity","oo","inf"], ["negative infinity","-infinity","-∞","−∞","minus infinity","-oo","-inf"]]}
            solution_sketch: 'The quotient behaves like $\frac{x^2}{x} = x$. As $x \to -\infty$ the value $x$ is negative and grows without bound in size. The limit is negative infinity.'
          - problem: 'For large $|x|$ the quotient $\frac{-x^3 + 4}{x + 2}$ behaves like a single term $cx^k$. Find that term.'
            answer: '-x^2'
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'The leading terms are $-x^3$ and $x$, and their quotient is $\frac{-x^3}{x} = -x^2$. The constants $4$ and $2$ matter little for large $|x|$. So $cx^k = -x^2$.'
          - problem: 'For large $|x|$ the quotient $\frac{3x^4 - 2x}{x^2 + 1}$ behaves like a single term $cx^k$. Find that term.'
            answer: '3x^2'
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'The leading terms are $3x^4$ and $x^2$, and their quotient is $\frac{3x^4}{x^2} = 3x^2$. The lower terms $-2x$ and $1$ matter little for large $|x|$. So $cx^k = 3x^2$.'
          - problem: 'A population, in hundreds, is modelled by $P(t) = \frac{6t^3 + t}{2t + 5}$ after $t$ years. For large $t$ the model behaves like a single term $ct^k$. Find that term.'
            answer: '3t^2'
            answer_contract: {"kind":"function","vars":["t"]}
            solution_sketch: 'The leading terms are $6t^3$ and $2t$, and their quotient is $\frac{6t^3}{2t} = 3t^2$. So for large $t$ the population grows like $3t^2$ hundred.'
          - problem: 'The revenue of a shop, in thousands of dollars, is $R(n) = \frac{4n^3 - n}{n^2 + 9}$ after $n$ weeks. For large $n$ the revenue behaves like a single term $cn^k$. Find that term.'
            answer: '4n'
            answer_contract: {"kind":"function","vars":["n"]}
            solution_sketch: 'The leading terms are $4n^3$ and $n^2$, and their quotient is $\frac{4n^3}{n^2} = 4n$. So for large $n$ the revenue grows like $4n$ thousand dollars, about $4$ thousand more each week.'
          - problem: 'The quotient $\frac{5x^4 + x}{2x^2 - 3}$ behaves like $cx^2$ for large $x$. Find $c$.'
            answer: '5/2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The leading terms are $5x^4$ and $2x^2$, and their quotient is $\frac{5x^4}{2x^2} = \frac{5}{2}x^2$. So $c = \frac{5}{2}$.'
        constraints: 'numerator degree exceeds denominator degree by 1 or 2; name the infinite limit or the leading-term behavior c x^k; growth contexts'
      - id: kp3
        name: Horizontal asymptotes of rational functions
        key_prerequisites: [vertical-horizontal-asymptotes, limit-laws]
        exemplars:
          - problem: 'Find the horizontal asymptote of the graph of $f(x) = \frac{2x + 1}{x - 4}$.'
            answer: 'y = 2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The degrees are equal, so the horizontal asymptote is the ratio of the leading coefficients, $\frac{2}{1} = 2$. The asymptote is $y = 2$.'
          - problem: 'Find the horizontal asymptote of the graph of $f(x) = \frac{3 - x}{2x + 5}$.'
            answer: 'y = -1/2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The degrees are equal. The leading coefficients are $-1$ and $2$, so the ratio is $-\frac{1}{2}$. The asymptote is $y = -\frac{1}{2}$.'
          - problem: 'Find the horizontal asymptote of the graph of $f(x) = \frac{4x}{x^2 + 1}$.'
            answer: 'y = 0'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The denominator has degree $2$ and the numerator has degree $1$, so the quotient tends to $0$. The asymptote is $y = 0$, and the number $0$ is the limit as $x \to \pm\infty$.'
          - problem: 'Find the horizontal asymptote of the graph of $f(x) = \frac{5x^2 - 3x + 1}{3x^2 + 2x}$.'
            answer: 'y = 5/3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Both degrees are $2$, so the asymptote is the ratio of the leading coefficients, $\frac{5}{3}$. The asymptote is $y = \frac{5}{3}$.'
          - problem: 'The average price per unit of a product is $A(n) = \frac{12n + 900}{n + 25}$ dollars when $n$ units are sold. To what value does the average price settle as $n$ grows without bound?'
            answer: '12'
            answer_contract: {"kind":"unit","quantity":"dollar","unit":"dollar","allow_omitted":true}
            solution_sketch: 'Both degrees are $1$, so the limit is the ratio of the leading coefficients, $\frac{12}{1} = 12$. The average price settles at $12$ dollars.'
          - problem: 'A runner has speed $v(t) = \frac{6t^2 + 5}{t^2 + 2}$ metres per second after $t$ seconds. What value does the speed approach as $t \to \infty$?'
            answer: '6'
            answer_contract: {"kind":"unit","quantity":"speed","unit":"m/s","allow_omitted":true}
            solution_sketch: 'Both degrees are $2$, so the limit is the ratio of the leading coefficients, $\frac{6}{1} = 6$. The speed approaches $6$ metres per second.'
          - problem: 'The graph of $f(x) = \frac{6x^2 + 1}{kx^2 - 5}$ has the horizontal asymptote $y = \frac{3}{4}$. Find $k$.'
            answer: '8'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Both degrees are $2$, so the horizontal asymptote is the ratio of the leading coefficients, $\frac{6}{k}$. Setting $\frac{6}{k} = \frac{3}{4}$ gives $3k = 24$, so $k = 8$.'
          - problem: 'Does the graph of $f(x) = \frac{x^2 + 1}{x + 3}$ have a horizontal asymptote?'
            answer: 'no'
            answer_contract: {"kind":"label","options":[["yes","it does","it has one","there is one"], ["no","it does not","it has none","there is none","none","no horizontal asymptote","it has no horizontal asymptote"]]}
            solution_sketch: 'The numerator has degree $2$ and the denominator has degree $1$, so the quotient grows without bound. There is no horizontal asymptote, because the values do not settle at one number.'
        constraints: 'compare degrees (equal, or denominator higher); name the asymptote y = c or find a parameter; one verdict item; levelling-off contexts'
    diagnostic_exemplar:
      problem: 'Evaluate $\lim_{x \to -\infty} \frac{2x^2 + 3}{x + 5}$.'
      answer: '-∞'
      answer_contract: {kind: none}
      solution_sketch: 'The numerator degree exceeds the denominator degree by one, so the quotient behaves like $2x$; as $x \to -\infty$ this tends to $-\infty$.'
    anki_seeds:
      - front: "For a rational function with equal numerator and denominator degree, lim_{x→±∞} equals..."
        back: "the ratio of the leading coefficients"
        type: basic
      - front: "If the denominator degree exceeds the numerator degree, lim_{x→±∞} of the rational function is..."
        back: "0 (horizontal asymptote y = 0)"
        type: basic

  - id: one-sided-infinite-limits
    name: One-Sided Limits, Infinite Limits, and Asymptotes
    core: true
    difficulty: 0.6
    drill: false
    answer_kind: numeric
    expected_time_secs: 150
    prerequisites:
      - id: one-sided-limits
        weight: 0.7
        key: true
      - id: limits-at-infinity-rational
        weight: 0.6
        key: true
      - id: limit-laws
        weight: 0.4
      - id: rational-expression-restrictions
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: Infinite limits and one-sided sign analysis
        key_prerequisites: [one-sided-limits, limit-laws]
        try_first:
          problem: 'Find the value of $\frac{1}{x}$ at $x = 0.001$.'
          answer_contract: {"kind":"exact"}
          answer: '1000'
          reveal: 'The values of $\frac{1}{x}$ keep growing as $x$ shrinks toward $0$ from the right. A limit that describes this growth without bound is written $+\infty$.'
        exemplars:
          - problem: 'Find $\lim_{x \to 0^+} \frac{1}{x}$.'
            answer: 'infinity'
            answer_contract: {"kind":"label","options":[["infinity","∞","+∞","positive infinity","+infinity","plus infinity","inf","oo"],["negative infinity","-∞","−∞","-infinity","minus infinity","-inf","-oo","−infinity"],["does not exist","DNE","no limit"]]}
            solution_sketch: 'For $x$ just to the right of $0$, $x$ is a small positive number, so $\frac{1}{x}$ is a large positive number. As $x$ shrinks toward $0$ the quotient grows without bound, so the limit is $+\infty$.'
          - problem: 'Find $\lim_{x \to 3^+} \frac{x + 1}{3 - x}$.'
            answer: 'negative infinity'
            answer_contract: {"kind":"label","options":[["infinity","∞","+∞","positive infinity","+infinity","plus infinity","inf","oo"],["negative infinity","-∞","−∞","-infinity","minus infinity","-inf","-oo","−infinity"],["does not exist","DNE","no limit"]]}
            solution_sketch: 'As $x \to 3$ the numerator tends to $4$, which is positive. For $x$ just to the right of $3$, $3 - x$ is a small negative number, so the quotient is large and negative and the limit is $-\infty$.'
          - problem: 'Find $\lim_{x \to 2^-} \frac{x^2 - 4}{x - 2}$.'
            answer: '4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Here the numerator also tends to $0$, so the quotient is not a nonzero number over zero. Factor $x^2 - 4 = (x-2)(x+2)$ and cancel $x - 2$ to get $x + 2$, which tends to $4$ as $x \to 2$.'
          - problem: 'A tank holds $600$ litres. A pump removes water at $r$ litres per minute while a leak adds $2$ litres per minute, so the tank empties in $T(r) = \frac{600}{r - 2}$ minutes for $r > 2$. How many minutes does the tank take to empty when $r = 2.05$?'
            answer: '12000'
            answer_contract: {"kind":"unit","quantity":"time","unit":"min","allow_omitted":true}
            solution_sketch: 'Substitute $r = 2.05$ into $T(r)$. The denominator is $2.05 - 2 = 0.05$, so $T = \frac{600}{0.05} = 12000$ minutes. A pump rate just above the leak rate gives a very long emptying time.'
          - problem: 'The intensity of a lamp at distance $d$ metres is $I(d) = \frac{9}{d^2}$ watts per square metre. How many times as large is the intensity at $d = 0.1$ as at $d = 1$?'
            answer: '100'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'At $d = 1$ the intensity is $9$. At $d = 0.1$ it is $\frac{9}{0.01} = 900$. Divide the two values: $\frac{900}{9} = 100$, so the intensity at $0.1$ is $100$ times as large.'
          - problem: 'To see how $\frac{4}{5 - x}$ behaves as $x \to 5^-$, find its value at $x = 4.99$.'
            answer: '400'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'At $x = 4.99$ the denominator is $5 - 4.99 = 0.01$. The value is $\frac{4}{0.01} = 400$. Points closer to $5$ give larger positive values, which agrees with a limit of $+\infty$.'
          - problem: 'Find $\lim_{x \to 1^+} \frac{1}{1 + \frac{1}{x - 1}}$.'
            answer: '0'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'As $x \to 1^+$, $x - 1$ is a small positive number, so $\frac{1}{x-1}$ grows without bound. The denominator $1 + \frac{1}{x-1}$ then grows without bound too, so its reciprocal tends to $0$.'
          - problem: 'Find the value of $\frac{x + 5}{x + 2}$ at $x = -1.99$.'
            answer: '301'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'At $x = -1.99$ the numerator is $-1.99 + 5 = 3.01$ and the denominator is $-1.99 + 2 = 0.01$. The value is $\frac{3.01}{0.01} = 301$. Points closer to $-2$ from the right give larger positive values.'
          - problem: 'Find the value of $\frac{1}{x - 2}$ at $x = 1.99$.'
            answer: '-100'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'At $x = 1.99$ the denominator is $1.99 - 2 = -0.01$, a small negative number. The value is $\frac{1}{-0.01} = -100$. Points closer to $2$ from the left give larger negative values.'
        constraints: 'a nonzero numerator over a vanishing denominator, with the sign decided from the chosen side; one item cancels a common zero and gives a finite value'
      - id: kp2
        name: Vertical asymptotes versus holes
        key_prerequisites: [limit-laws, one-sided-limits]
        exemplars:
          - problem: 'Find the vertical asymptote of $f(x) = \frac{x + 1}{x - 3}$.'
            answer: '3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The denominator $x - 3$ is zero at $x = 3$. The numerator is $4$ there, which is not zero, so nothing cancels and the line $x = 3$ is the vertical asymptote.'
          - problem: 'Find the $y$-coordinate of the hole in the graph of $f(x) = \frac{x^2 - 4}{x - 2}$.'
            answer: '4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Factor $x^2 - 4 = (x-2)(x+2)$ and cancel $x - 2$. The graph is that of $x + 2$ with a hole at $x = 2$, so the $y$-coordinate of the hole is $2 + 2 = 4$.'
          - problem: 'Find the $x$-coordinate of the hole in the graph of $f(x) = \frac{x + 5}{x^2 - 25}$.'
            answer: '-5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Factor $x^2 - 25 = (x-5)(x+5)$ and cancel $x + 5$ with the numerator. The canceled factor is zero at $x = -5$, so the hole is at $x = -5$. The factor $x - 5$ stays and gives an asymptote at $x = 5$.'
          - problem: 'Does the graph of $f(x) = \frac{(x + 2)(x - 5)}{(x + 2)(x - 4)}$ have a hole or a vertical asymptote at $x = -2$?'
            answer: 'hole'
            answer_contract: {"kind":"label","options":[["hole","a hole","it has a hole"],["asymptote","vertical asymptote","a vertical asymptote"]]}
            solution_sketch: 'The factor $x + 2$ appears in the numerator and in the denominator, so it cancels. A canceled factor leaves a hole, so the graph has a hole at $x = -2$. The factor $x - 4$ does not cancel and gives the vertical asymptote.'
          - problem: 'A boat travels $48$ km up a river against a current of $6$ km/h. At boat speed $b$ km/h in still water, with $b > 6$, the trip takes $T(b) = \frac{48}{b - 6}$ hours. For which value of $b$ does the graph of $T$ have a vertical asymptote?'
            answer: '6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The denominator $b - 6$ is zero at $b = 6$, and the numerator $48$ is not zero. So $b = 6$ is a vertical asymptote: the trip takes more and more time as the boat speed falls toward the speed of the current.'
          - problem: 'Find the point where the graph of $f(x) = \frac{x^2 - 4}{x^2 - x - 6}$ has a hole.'
            answer: '(-2, 4/5)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'Factor the numerator as $(x-2)(x+2)$ and the denominator as $(x-3)(x+2)$. The factor $x + 2$ cancels, so the hole is at $x = -2$. The reduced function $\frac{x-2}{x-3}$ has the value $\frac{-4}{-5} = \frac{4}{5}$ there.'
          - problem: 'A club charges a setup fee of $\$150$ plus $\$5$ per member, so the average cost per member for $n$ members is $A(n) = \frac{150 + 5n}{n}$ dollars. At which value of $n$ does the graph of $A$ have a vertical asymptote?'
            answer: '0'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The denominator $n$ is zero at $n = 0$, and the numerator $150 + 5n$ equals $150$ there, so it is not zero. The line $n = 0$ is a vertical asymptote: with very few members the setup fee is shared by very few people, so each pays a lot.'
          - problem: 'At which value of $x$ does the graph of $f(x) = \frac{x + 2}{x^2 - 4}$ have a vertical asymptote?'
            answer: '2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Factor $x^2 - 4 = (x-2)(x+2)$. The factor $x + 2$ cancels with the numerator, so $x = -2$ is a hole. Only $x = 2$ is a vertical asymptote.'
          - problem: 'Find $\lim_{x \to 2^+} \frac{x^2 - 1}{x^2 - 3x + 2}$.'
            answer: 'infinity'
            answer_contract: {"kind":"label","options":[["infinity","∞","+∞","positive infinity","+infinity","plus infinity","inf","oo"],["negative infinity","-∞","−∞","-infinity","minus infinity","-inf","-oo","−infinity"],["does not exist","DNE","no limit"]]}
            solution_sketch: 'Factor to get $\frac{(x-1)(x+1)}{(x-1)(x-2)} = \frac{x+1}{x-2}$ for $x \neq 1$. As $x \to 2^+$ the numerator tends to $3$ and $x - 2$ is a small positive number, so the quotient grows without bound and the limit is $+\infty$.'
          - problem: 'Find the value of $a$ for which the graph of $f(x) = \frac{x^2 - a}{x - 3}$ has a hole at $x = 3$.'
            answer: '9'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'A hole at $x = 3$ needs the factor $x - 3$ to cancel, so the numerator must be zero at $x = 3$. That gives $3^2 - a = 0$, so $a = 9$.'
        constraints: "factor and cancel first; distinguish surviving denominator zeros (asymptotes) from canceled ones (holes)"
      - id: kp3
        name: Complete asymptote and end-behavior analysis
        key_prerequisites: [limits-at-infinity-rational, one-sided-limits]
        exemplars:
          - problem: 'Find the vertical asymptotes of $f(x) = \frac{2x^2}{x^2 - 9}$.'
            answer: '-3, 3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The denominator $x^2 - 9 = (x-3)(x+3)$ is zero at $x = 3$ and at $x = -3$. The numerator $2x^2$ is $18$ at both values, so it is not zero and nothing cancels. Both values give vertical asymptotes.'
          - problem: 'Find the horizontal asymptote of $f(x) = \frac{x - 1}{x^2 + 1}$.'
            answer: '0'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The numerator has degree $1$ and the denominator has degree $2$. When the denominator has the larger degree, $f(x) \to 0$ as $x \to \pm\infty$, so the horizontal asymptote is $y = 0$.'
          - problem: 'Find the horizontal asymptote of $f(x) = \frac{3x^2 - 1}{2x^2 + 5}$.'
            answer: '3/2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The numerator and the denominator both have degree $2$, so the horizontal asymptote is the ratio of the leading coefficients. That ratio is $\frac{3}{2}$, so the asymptote is $y = \frac{3}{2}$.'
          - problem: 'Find $\lim_{x \to 1} \frac{1}{(x - 1)^2}$.'
            answer: 'infinity'
            answer_contract: {"kind":"label","options":[["infinity","∞","+∞","positive infinity","+infinity","plus infinity","inf","oo"],["negative infinity","-∞","−∞","-infinity","minus infinity","-inf","-oo","−infinity"],["does not exist","DNE","no limit"]]}
            solution_sketch: 'The square $(x-1)^2$ is positive on both sides of $1$ and tends to $0$. So $\frac{1}{(x-1)^2}$ is large and positive from the left and from the right, and the two-sided limit is $+\infty$.'
          - problem: 'Find the vertical asymptotes of $f(x) = \frac{x^2 - 1}{x^2 + 3x + 2}$.'
            answer: '-2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Factor to get $\frac{(x-1)(x+1)}{(x+1)(x+2)}$. The factor $x + 1$ cancels and leaves a hole at $x = -1$. Only $x + 2$ stays in the denominator, so the vertical asymptote is $x = -2$.'
          - problem: 'The number of fish in a pond $t$ months after stocking is $P(t) = \frac{800t + 200}{2t + 5}$. Which number does the population approach in the long run?'
            answer: '400'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The numerator and the denominator both have degree $1$. The limit as $t \to \infty$ is the ratio of the leading coefficients, $\frac{800}{2} = 400$, so the population approaches $400$ fish.'
          - problem: 'A workshop spends $\$500$ on tools and $\$12$ on materials for each item. The average cost per item for $n$ items is $A(n) = \frac{500 + 12n}{n}$ dollars. What does the average cost approach as $n$ grows without bound?'
            answer: '12'
            answer_contract: {"kind":"unit","quantity":"dollar","unit":"dollar","allow_omitted":true}
            solution_sketch: 'Divide the numerator and the denominator by $n$ to get $\frac{500/n + 12}{1}$. As $n$ grows, $\frac{500}{n} \to 0$, so the average cost approaches $12$ dollars, the material cost of one item.'
          - problem: 'Does $\lim_{x \to 2} \frac{x + 3}{2x - 4}$ exist?'
            answer: 'no'
            answer_contract: {"kind":"label","options":[["yes","it does","it exists","yes it does","yes, it exists","the limit exists"],["no","it does not","it does not exist","DNE","does not exist","no, it does not exist","the limit does not exist"]]}
            solution_sketch: 'The numerator tends to $5$ while $2x - 4$ tends to $0$. Just right of $2$ the quotient tends to $+\infty$, and just left of $2$ it tends to $-\infty$. The one-sided limits differ, so the limit does not exist.'
          - problem: 'The graph of $f(x) = \frac{ax^2 + 1}{5x^2 - 3}$ has the horizontal asymptote $y = 2$. Find $a$.'
            answer: '10'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Both polynomials have degree $2$, so the horizontal asymptote is the ratio of the leading coefficients, $\frac{a}{5}$. Setting $\frac{a}{5} = 2$ gives $a = 10$.'
        constraints: "rational functions; report every vertical and horizontal asymptote, or a two-sided infinite limit"
    diagnostic_exemplar:
      problem: 'Find all vertical asymptotes, all holes, and the horizontal asymptote of $f(x) = \frac{x - 3}{x^2 - 9}$.'
      answer: 'vertical asymptote x = -3; hole at x = 3; horizontal asymptote y = 0'
      answer_contract: {kind: none}
      solution_sketch: '$f(x) = \frac{x-3}{(x-3)(x+3)} = \frac{1}{x+3}$ for $x \neq 3$: the canceled factor leaves a hole at $x = 3$, the surviving zero gives the vertical asymptote $x = -3$, and the denominator degree exceeds the numerator degree, so $y = 0$.'
    anki_seeds:
      - front: "f has a vertical asymptote at x = a when..."
        back: "f(x) → ∞ or -∞ as x → a from the left or the right"
        type: basic
      - front: "A zero of the denominator that cancels with the numerator produces a ___; one that survives produces a ___."
        back: "hole (removable); vertical asymptote"
        type: basic

  - id: limits-at-infinity-radicals
    name: Limits at Infinity with Radicals
    core: false                # worked special case of limits at infinity
