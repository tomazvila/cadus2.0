unit: limits-continuity
course: calculus-1
module: "Limits & Continuity"
topics:
  - id: limits-from-tables
    name: Estimating Limits from Tables
    core: true
    difficulty: 0.42
    drill: false
    answer_kind: numeric
    expected_time_secs: 75
    prerequisites:
      - id: evaluating-functions
        weight: 0.7
        key: true
      - id: function-notation
        weight: 0.5
        key: true
      - id: comparing-ordering-decimals
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: Estimate a limit from a two-sided table
        key_prerequisites: [evaluating-functions]
        exemplars:
          - problem: 'For $f(x) = \frac{x^2 - 4}{x - 2}$, a table gives $f(1.9) = 3.9$, $f(1.99) = 3.99$, $f(2.01) = 4.01$, $f(2.1) = 4.1$. Estimate $\lim_{x \to 2} f(x)$.'
            answer: "4"
            solution_sketch: 'The values close in on $4$ from both sides, so the limit is $4$.'
          - problem: 'A table gives $g(2.9) = 5.8$, $g(2.99) = 5.98$, $g(3.01) = 6.02$, $g(3.1) = 6.2$. Estimate $\lim_{x \to 3} g(x)$.'
            answer: "6"
          - problem: "For $f(x) = \\frac{x^2 - 25}{x - 5}$, a two-sided table gives $f(4.9) = 9.9$, $f(4.99) = 9.99$, $f(5.01) = 10.01$, $f(5.1) = 10.1$. Find $\\lim_{x \\to 5} f(x)$."
            answer: "10"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (read the table): the full table is f(4.9)=9.9, f(4.99)=9.99, f(5.01)=10.01, f(5.1)=10.1. Step 2 (two-sided limit rule): as x gets close to 5 from both sides, the outputs close in on the same integer. Step 3 (R1 exact value): the limit is 10."
          - problem: "A table for $g(x)$ gives $g(1.9) = 2.9$, $g(1.99) = 2.99$, $g(2.01) = 3.01$, $g(2.1) = 3.1$. Find $\\lim_{x \\to 2} g(x)$."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (read the table): the full table is g(1.9)=2.9, g(1.99)=2.99, g(2.01)=3.01, g(2.1)=3.1. Step 2 (two-sided limit rule): from both sides the outputs approach the same integer as x approaches 2. Step 3 (R1 exact value): the limit is 3."
          - problem: "For $h(x) = \\frac{x^2 - 1}{x + 1}$, a table gives $h(-1.1) = -2.1$, $h(-1.01) = -2.01$, $h(-0.99) = -1.99$, $h(-0.9) = -1.9$. Find $\\lim_{x \\to -1} h(x)$."
            answer: "-2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (read the table): the full table is h(-1.1)=-2.1, h(-1.01)=-2.01, h(-0.99)=-1.99, h(-0.9)=-1.9. Step 2 (two-sided limit rule): both sides close in on the same integer as x approaches -1. Step 3 (R1 exact value): the limit is -2."
          - problem: "A table for $f(x) = \\frac{x^3 - 8}{x - 2}$ gives $f(1.9) = 11.41$, $f(1.99) = 11.9401$, $f(2.01) = 12.0601$, $f(2.1) = 12.61$. Find $\\lim_{x \\to 2} f(x)$."
            answer: "12"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (read the table): the full table is f(1.9)=11.41, f(1.99)=11.9401, f(2.01)=12.0601, f(2.1)=12.61. Step 2 (two-sided limit rule): as x approaches 2 from each side, the outputs close in on the same integer. Step 3 (R1 exact value): the limit is 12."
        constraints: "table values approach an integer limit symmetrically from both sides"
      - id: kp2
        name: Build the table yourself
        key_prerequisites: [evaluating-functions, function-notation]
        exemplars:
          - problem: "For f(x) = 4x - 3, compute f(0.9), f(0.99), f(1.01), f(1.1) and use them to estimate the limit as x approaches 1. Give the estimated limit."
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: evaluate the function at each probe point by substitution: f(0.9)=0.6, f(0.99)=0.96, f(1.01)=1.04, f(1.1)=1.4. Step 2: compare the outputs as x gets closer to 1 from both sides; they approach 1. The estimated limit is 1."
          - problem: "For f(x) = x^2 + 1, compute f(1.9), f(1.99), f(2.01), f(2.1) and use them to estimate the limit as x approaches 2. Give the estimated limit."
            answer: "5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: evaluate the function at each probe point by substitution: f(1.9)=4.61, f(1.99)=4.9601, f(2.01)=5.0401, f(2.1)=5.41. Step 2: compare the outputs as x approaches 2 from both sides; they close in on 5. The estimated limit is 5."
          - problem: 'To probe $\lim_{x \to 5} f(x)$ numerically, which list of inputs is appropriate: (a) $4.9, 4.99, 5.01, 5.1$ or (b) $4, 4.5, 6, 7$? Answer (a) or (b).'
            answer: "(a)"
            solution_sketch: 'The inputs must close in on $5$ from both sides; list (b) never gets near $5$.'
          - problem: "For h(x) = 2x^2 - 3x + 1, compute h(-1.1), h(-1.01), h(-0.99), h(-0.9) and use them to estimate the limit as x approaches -1. Give the estimated limit."
            answer: "6"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: evaluate the function at each probe point by substitution: h(-1.1)=6.72, h(-1.01)=6.0702, h(-0.99)=5.9302, h(-0.9)=5.32. Step 2: compare the outputs as x approaches -1 from both sides; they close in on 6. The estimated limit is 6."
          - problem: "For f(x) = 2x^2 + 1, compute f(0.4), f(0.49), f(0.51), f(0.6) and use them to estimate the limit as x approaches 0.5. Give the estimated limit to one decimal."
            answer: "1.5"
            answer_contract: {"decimals": 1, "kind": "approx"}
            solution_sketch: "Step 1: evaluate the function at each probe point by substitution: f(0.4)=1.32, f(0.49)=1.4802, f(0.51)=1.5202, f(0.6)=1.72. Step 2: compare the outputs as x approaches 0.5 from both sides; they close in on 1.5. The estimated limit is 1.5."
          - problem: "For f(x) = x^2 - 4x + 5, compute f(2.9), f(2.99), f(3.01), f(3.1) and use them to estimate the limit as x approaches 3. Give the estimated limit."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: evaluate the function at each probe point by substitution: f(2.9)=1.81, f(2.99)=1.9801, f(3.01)=2.0201, f(3.1)=2.21. Step 2: compare the outputs as x approaches 3 from both sides; they close in on 2. The estimated limit is 2."
        constraints: "linear or quadratic functions; probe points within 0.1 of the target"
      - id: kp3
        name: Read one-sided trends from a table
        key_prerequisites: [evaluating-functions]
        exemplars:
          - problem: 'A table gives $h(0.9) = 2.71$, $h(0.99) = 2.9701$, $h(0.999) = 2.997$. What value does $h(x)$ approach as $x \to 1^-$?'
            answer: "3"
          - problem: "A table gives f(3.9) = 2, f(3.99) = 2, f(4.01) = 7, f(4.1) = 7. What value does f(x) approach as x approaches 4 from the right?"
            answer: "7"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (right-side table read): the full table gives f(3.9) = 2, f(3.99) = 2 on the left of 4 and f(4.01) = 7, f(4.1) = 7 on the right of 4. Step 2 (trend of the right side): the right-side inputs 4.01 and 4.1 both give the output 7, so the values stay at 7. The right-hand limit is 7."
          - problem: "A table gives g(4.9) = 2.8, g(4.99) = 3.16, g(4.999) = 3.2. Find the left-hand limit of g(x) as x approaches 4."
            answer: "3.2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (left-side table read): the table gives g(4.9) = 2.8, g(4.99) = 3.16, g(4.999) = 3.2. Step 2 (trend): as the inputs approach 4 from below, the outputs rise and settle at the value 3.2. The left-hand limit is 3.2."
          - problem: "A table gives p(-1.1) = 5, p(-1.01) = 5, p(-0.99) = 9, p(-0.9) = 9. State whether the two sides of the table agree on one limiting value at x = -1, and give the value suggested from the left."
            answer: "verdict = different; left = 5"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["same"], ["different"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "left"}]}
            solution_sketch: "Step 1 (left-side read): the inputs -1.1 and -1.01 lie left of -1 and both give the output 5, so the left side suggests 5. Step 2 (right-side read): the inputs -0.99 and -0.9 lie right of -1 and both give the output 9, so the right side suggests 9. Step 3 (compare the sides): 5 differs from 9, so the sides point to different values, and the left value is 5. The result is verdict = different; left = 5."
          - problem: "A table gives h(0.1) = -1.1, h(0.01) = -1.46, h(0.001) = -1.5. Find the right-hand limit of h(x) as x approaches 0."
            answer: "-1.5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (right-side table read): the table gives h(0.1) = -1.1, h(0.01) = -1.46, h(0.001) = -1.5. Step 2 (trend): as the inputs approach 0 from above, the outputs fall toward the stable value -1.5. The right-hand limit is -1.5."
          - problem: "A probe logs its reading R at times 10.9, 10.99 and 10.999 seconds: R(10.9) = 52, R(10.99) = 49.3, R(10.999) = 48.5. Find the right-hand limit of R(t) as t approaches 10."
            answer: "48.5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (table read from the right): the times 10.9, 10.99 and 10.999 are all greater than 10, and the readings are R(10.9) = 52, R(10.99) = 49.3, R(10.999) = 48.5. Step 2 (trend): as the time approaches 10 from greater times, the readings fall and settle at 48.5. The right-hand limit is 48.5."
        constraints: "one-sided reads only; no limit-existence theory beyond comparing the two sides"
    diagnostic_exemplar:
      problem: 'For $g(x) = 2x + 1$, compute $g(2.9)$, $g(2.99)$, $g(3.01)$, $g(3.1)$ and use them to estimate $\lim_{x \to 3} g(x)$.'
      answer: '7'
      solution_sketch: 'The four values are $6.8$, $6.98$, $7.02$, $7.2$ — they close in on $7$ from the left and from the right, so the limit is $7$.'
    anki_seeds:
      - front: "To estimate lim_{x→a} f(x) numerically, evaluate f at inputs that..."
        back: "approach a from BOTH sides (e.g. a ± 0.1, a ± 0.01), never at a itself"
        type: basic
      - front: "A table of values can only ___ a limit, never ___ it."
        back: "suggest (estimate); prove"
        type: basic

  - id: limits-graphical-numerical
    name: Limits Graphically and Numerically
    core: true
    difficulty: 0.45
    drill: false
    answer_kind: numeric
    expected_time_secs: 90
    prerequisites:
      - id: limits-from-tables
        weight: 0.8
        key: true
      - id: function-notation
        weight: 0.5
        key: true
      - id: domain-range
        weight: 0.4
      - id: coordinate-plane
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: Read limits from a graph
        key_prerequisites: [limits-from-tables, function-notation]
        exemplars:
          - problem: 'The graph of $f$ is the line $y = x + 1$ with an open dot at $(2, 3)$ and a filled dot at $(2, 5)$ (so $f(2) = 5$). Find $\lim_{x \to 2} f(x)$.'
            answer: "3"
            solution_sketch: 'The branches approach height $3$ from both sides (the open dot); the filled dot''s value $f(2) = 5$ does not affect the limit.'
          - problem: 'The graph of $g$ is the parabola $y = x^2$ with a hole at $(1, 1)$ and no other marked point (so $g(1)$ is undefined). Find $\lim_{x \to 1} g(x)$.'
            answer: "1"
            solution_sketch: 'The parabola closes in on height $1$ from both sides; a limit does not require the function to be defined there.'
          - problem: "The graph of f is the line y = 3x - 1 with a hole at (2, 5). Find lim_{x -> 2} f(x)."
            answer: "5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: Direct evaluation of the base curve y = 3x - 1 at x = 2 gives 3*2 - 1 = 5. Step 2: A hole at (2, 5) removes the point but the curve approaches that height from both sides. The limit is 5."
          - problem: "The graph of g is the parabola y = x^2 + 2 with a filled dot at (3, 11). Find lim_{x -> 3} g(x)."
            answer: "11"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: Direct substitution into y = x^2 + 2 at x = 3 gives 3^2 + 2 = 11. Step 2: The filled dot at (3, 11) lies on the curve, so the height from both sides is 11. The limit is 11."
          - problem: "The graph of h is y = x^3 - 4 for x < 1 and y = -3 for x > 1, with a filled dot at (1, -3). Find lim_{x -> 1} h(x)."
            answer: "-3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: For x < 1, the cubic y = x^3 - 4 approaches 1^3 - 4 = -3 as x goes to 1. Step 2: For x > 1, the horizontal line y = -3 is already at -3, and the filled dot is at (1, -3). Both sides agree, so the limit is -3."
          - problem: "The graph of p is y = sqrt(x) with a hole at (4, 2). Find lim_{x -> 4} p(x)."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: Direct evaluation of the base curve y = sqrt(x) at x = 4 gives sqrt(4) = 2. Step 2: The hole at (4, 2) removes the point, but the curve approaches height 2 from the right. The limit is 2."
        constraints: "graphs described by a base curve plus open/filled dots; heights are small integers"
      - id: kp2
        name: The limit ignores the value at the point
        key_prerequisites: [function-notation, domain-range]
        exemplars:
          - problem: 'Let $f(x) = x + 2$ for $x \neq 1$ and $f(1) = 5$. Find $\lim_{x \to 1} f(x)$.'
            answer: "3"
            solution_sketch: 'Near (but not at) $x = 1$, $f(x) = x + 2 \to 3$; the value $f(1) = 5$ is irrelevant to the limit.'
          - problem: 'Let $g(x) = x^2$ for $x \neq 2$ and $g(2) = 0$. Find $\lim_{x \to 2} g(x)$.'
            answer: "4"
          - problem: "Let $f(x) = 2x + 1$ for $x \\ne 3$, and let $f(3) = 0$. Find $\\lim_{x \\to 3} f(x)$."
            answer: "7"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 uses the limit-ignores-point-value rule: for x near 3 but not at 3, f(x)=2x+1. Step 2 substitutes x=3 into that nearby formula: 2(3)+1 = 7. The assigned value f(3)=0 does not change the limit, so the limit is 7."
          - problem: "Let $g(x) = x^2 - 2$ for $x \\ne 4$, and let $g(4) = 10$. Find $\\lim_{x \\to 4} g(x)$."
            answer: "14"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 applies the limit-ignores-point-value rule: for x near 4 but not at 4, g(x)=x^2-2. Step 2 substitutes x=4 into the nearby formula: 4^2-2 = 16-2 = 14. The point value g(4)=10 is ignored, so the limit is 14."
          - problem: "Let $f(x) = (x^2 - 9)/(x - 3)$ for $x \\ne 3$, and let $f(3) = 100$. Find $\\lim_{x \\to 3} f(x)$."
            answer: "6"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 applies the limit-ignores-point-value rule: for x near 3 but not at 3, f(x) = (x^2-9)/(x-3). Step 2 factors the numerator as (x-3)(x+3) and cancels the common factor x-3, leaving x+3. Step 3 substitutes x=3 into x+3 to get 6; the assigned value f(3)=100 is ignored, so the limit is 6."
          - problem: "The graph of $f$ is $y = \\sqrt{x+4}$ for all $x \\ne 0$, and the graph has a filled point at $(0, 9)$. Find $\\lim_{x \\to 0} f(x)$."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 applies the limit-ignores-point-value rule: the graph near x=0 follows y=sqrt(x+4). Step 2 substitutes x=0 into that formula: sqrt(4)=2. The filled point at (0,9) is ignored by the limit, so the limit is 2."
        constraints: "piecewise redefinition at a single point; limit differs from the function value"
      - id: kp3
        name: Recognize when a limit does not exist
        key_prerequisites: [function-notation, limits-from-tables]
        exemplars:
          - problem: 'Let $f(x) = \frac{|x|}{x}$. A table gives $f(-0.1) = -1$, $f(-0.01) = -1$, $f(0.01) = 1$, $f(0.1) = 1$. What is $\lim_{x \to 0} f(x)$?'
            answer: "DNE"
            answer_contract: {kind: none}
            solution_sketch: 'From the left the values approach $-1$; from the right, $1$. Since the sides disagree, the two-sided limit does not exist.'
          - problem: 'A table for $h$ near $x = 4$ gives $h(3.9) = 2$, $h(3.99) = 2$, $h(4.01) = 7$, $h(4.1) = 7$. What is $\lim_{x \to 4} h(x)$?'
            answer: "DNE"
            answer_contract: {kind: none}
            solution_sketch: "DNE"
        constraints: "left and right values approach two different finite numbers; answer is DNE"
    diagnostic_exemplar:
      problem: 'The graph of $h$ is the line $y = 2x$ for $x < 3$ and the horizontal line $y = 1$ for $x > 3$, with a filled dot at $(3, 1)$. Find $\lim_{x \to 3} h(x)$, or answer DNE if it does not exist.'
      answer: 'DNE'
      answer_contract: {kind: none}
      solution_sketch: 'The left branch rises to $6$ while the right branch sits at $1$; the value $h(3) = 1$ is irrelevant, and because the one-sided limits differ the two-sided limit does not exist.'
    anki_seeds:
      - front: "The limit of f(x) as x → a depends on values of f near a, but never on..."
        back: "the value f(a) itself (f need not even be defined at a)"
        type: basic
      - front: "A two-sided limit exists only when..."
        back: "the left-hand and right-hand limits both exist and are equal"
        type: basic

  - id: limit-laws
    name: Limit Laws
    core: true
    difficulty: 0.5
    drill: false
    answer_kind: numeric
    expected_time_secs: 90
    prerequisites:
      - id: limits-graphical-numerical
        weight: 0.8
        key: true
      - id: evaluating-expressions
        weight: 0.5
        key: true
      - id: order-of-operations
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: Sum, difference, and constant-multiple laws
        key_prerequisites: [limits-graphical-numerical]
        exemplars:
          - problem: 'Given $\lim_{x \to a} f(x) = 3$ and $\lim_{x \to a} g(x) = -2$, find $\lim_{x \to a} [f(x) + g(x)]$.'
            answer: "1"
          - problem: 'Given $\lim_{x \to a} f(x) = 3$ and $\lim_{x \to a} g(x) = -2$, find $\lim_{x \to a} [2f(x) - g(x)]$.'
            answer: "8"
            solution_sketch: '$2 \cdot 3 - (-2) = 8$ by the constant-multiple and difference laws.'
          - problem: "Given $\\lim_{x \\to a} f(x) = 3$ and $\\lim_{x \\to a} [4f(x) + 3g(x)] = 18$, find $\\lim_{x \\to a} g(x)$."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full object is $\\lim_{x \\to a} g(x)$. By the constant-multiple law and the sum law, $\\lim_{x \\to a} [4f(x) + 3g(x)] = 4\\lim_{x \\to a} f(x) + 3\\lim_{x \\to a} g(x)$. Substituting the given limits gives $4 \\cdot 3 + 3\\lim_{x \\to a} g(x) = 18$, so $3\\lim_{x \\to a} g(x) = 6$. The answer is 2."
          - problem: "Given $\\lim_{x \\to a} g(x) = 4$ and $\\lim_{x \\to a} [7f(x) - 3g(x)] = 30$, find $\\lim_{x \\to a} f(x)$."
            answer: "6"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full object is $\\lim_{x \\to a} f(x)$. By the constant-multiple law and the difference law, $\\lim_{x \\to a} [7f(x) - 3g(x)] = 7\\lim_{x \\to a} f(x) - 3\\lim_{x \\to a} g(x)$. Substituting the given limit of $g$ gives $7\\lim_{x \\to a} f(x) - 12 = 30$, so $7\\lim_{x \\to a} f(x) = 42$. The answer is 6."
          - problem: "Given $\\lim_{x \\to a} [f(x) + g(x)] = 11$ and $\\lim_{x \\to a} [f(x) - g(x)] = 3$, find $\\lim_{x \\to a} [2f(x) + g(x)]$."
            answer: "18"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full object is $\\lim_{x \\to a} [2f(x) + g(x)]$. Adding the two given limits and using the sum law gives $2\\lim_{x \\to a} f(x) = 14$, so $\\lim_{x \\to a} f(x) = 7$. Then the difference law gives $\\lim_{x \\to a} g(x) = 11 - 7 = 4$. By the sum and constant-multiple laws, $\\lim_{x \\to a} [2f(x) + g(x)] = 2 \\cdot 7 + 4$. The answer is 18."
          - problem: "Given $\\lim_{x \\to a} f(x) = 5$, $\\lim_{x \\to a} g(x) = 4$, and $\\lim_{x \\to a} [c f(x) - g(x)] = 11$, find the constant $c$."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full object is the equation $\\lim_{x \\to a} [c f(x) - g(x)] = 11$. By the constant-multiple law and the difference law, this limit equals $c\\lim_{x \\to a} f(x) - \\lim_{x \\to a} g(x)$. Substituting the given limits gives $5c - 4 = 11$, so $5c = 15$. The answer is 3."
        constraints: "given limits are small integers; combine with sum/difference/constant-multiple laws only"
      - id: kp2
        name: Product and quotient laws
        key_prerequisites: [limits-graphical-numerical, evaluating-expressions]
        exemplars:
          - problem: 'Given $\lim_{x \to a} f(x) = 3$ and $\lim_{x \to a} g(x) = -2$, find $\lim_{x \to a} [f(x) \cdot g(x)]$.'
            answer: "-6"
          - problem: 'Given $\lim_{x \to a} f(x) = 3$ and $\lim_{x \to a} g(x) = -2$, find $\lim_{x \to a} \frac{f(x)}{g(x)}$.'
            answer: "-3/2"
            solution_sketch: 'The quotient law applies since the denominator limit $-2 \neq 0$: $\frac{3}{-2} = -\frac{3}{2}$.'
          - problem: 'Given $\lim_{x \to a} f(x) = 4$, find $\lim_{x \to a} [f(x)]^2$.'
            answer: "16"
          - problem: "Given $\\lim_{x \\to 3} f(x) = 2$ and $\\lim_{x \\to 3} g(x) = -1$, find $\\lim_{x \\to 3} \\frac{x^2 f(x)}{g(x)}$."
            answer: "-18"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Write the full object: $\\lim_{x \\to 3} \\frac{x^2 f(x)}{g(x)}$. By the product law, $\\lim_{x \\to 3} x^2 f(x) = (\\lim_{x \\to 3} x^2)(\\lim_{x \\to 3} f(x)) = 9 \\cdot 2 = 18$. The denominator limit is $-1 \\neq 0$, so the quotient law gives $18/(-1) = -18$. The value of the limit is -18."
          - problem: "Given $\\lim_{x \\to 5} f(x) = 2$ and $\\lim_{x \\to 5} g(x) = 3$, find $\\lim_{x \\to 5} \\frac{[x f(x)]^2}{g(x)}$."
            answer: "100/3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Write the full object: $\\lim_{x \\to 5} \\frac{[x f(x)]^2}{g(x)}$. By the product law, $\\lim_{x \\to 5} x f(x) = 5 \\cdot 2 = 10$; squaring is the product law applied to equal factors, so $\\lim_{x \\to 5} [x f(x)]^2 = 10^2 = 100$. The denominator limit $3$ is nonzero, so the quotient law gives $100/3$. The value of the limit is 100/3."
          - problem: "Given $\\lim_{x \\to -2} [x f(x) g(x)] = 20$ and $\\lim_{x \\to -2} f(x) = -1$, find $\\lim_{x \\to -2} [f(x) g(x)]$."
            answer: "-10"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Write the full object: $\\lim_{x \\to -2} [f(x) g(x)]$. By the product law, $\\lim_{x \\to -2} [x f(x) g(x)] = (\\lim_{x \\to -2} x)(\\lim_{x \\to -2} f(x))(\\lim_{x \\to -2} g(x)) = (-2)(-1) \\cdot \\lim_{x \\to -2} g(x) = 2 \\lim_{x \\to -2} g(x)$. Solve $20 = 2 \\lim_{x \\to -2} g(x)$, so $\\lim_{x \\to -2} g(x) = 10$. Then by the product law $\\lim_{x \\to -2} [f(x) g(x)] = (-1) \\cdot 10 = -10$. The value of the limit is -10."
        constraints: "denominator limit nonzero for quotients; include a power via the product law"
      - id: kp3
        name: Direct substitution for polynomials and rational functions
        key_prerequisites: [evaluating-expressions]
        exemplars:
          - problem: 'Evaluate $\lim_{x \to 2} (x^2 + 3x - 1)$.'
            answer: "9"
            solution_sketch: 'Polynomials are continuous, so substitute: $4 + 6 - 1 = 9$.'
          - problem: 'Evaluate $\lim_{x \to -1} (x^3 - 2x)$.'
            answer: "1"
          - problem: 'Evaluate $\lim_{x \to 3} \frac{x + 1}{x - 1}$.'
            answer: "2"
            solution_sketch: 'The denominator is nonzero at $x = 3$, so substitute: $\frac{4}{2} = 2$.'
          - problem: "Evaluate $\\lim_{x \\to 2} \\frac{x^2 - 1}{x + 3}$."
            answer: "3/5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The function is $\\frac{x^2 - 1}{x + 3}$. The denominator $x + 3$ at $x = 2$ is $5$, not zero, so the quotient law and direct substitution apply. The numerator is $2^2 - 1 = 3$ and the denominator is $5$, so the quotient is $\\frac{3}{5}$. The limit is 3/5."
          - problem: "Evaluate $\\lim_{x \\to -2} (2x^2 + x - 3)$."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The function is $2x^2 + x - 3$. A polynomial is continuous everywhere, so direct substitution applies. Substitute $x = -2$: $2(-2)^2 + (-2) - 3 = 8 - 2 - 3 = 3$. The limit is 3."
          - problem: "Evaluate $\\lim_{x \\to 1} \\frac{x + 3}{2x + 1}$."
            answer: "4/3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The function is $\\frac{x + 3}{2x + 1}$. At $x = 1$, the denominator $2x + 1$ is $3$, not zero, so the quotient law permits direct substitution. The numerator is $1 + 3 = 4$ and the denominator is $3$. Thus the limit is 4/3."
        constraints: "polynomial or rational function with nonzero denominator at the point; integer or simple fraction answers"
    diagnostic_exemplar:
      problem: 'Given $\lim_{x \to 3} f(x) = 2$, evaluate $\lim_{x \to 3} \frac{x^2 f(x) - 2}{x + 1}$.'
      answer: '4'
      solution_sketch: 'Direct substitution gives $x^2 \to 9$ and $x + 1 \to 4$; the product law gives $9 \cdot 2 = 18$, the difference law $16$, and the quotient law $16/4 = 4$.'
    anki_seeds:
      - front: "The quotient limit law lim f/g = (lim f)/(lim g) requires..."
        back: "lim g ≠ 0"
        type: basic
      - front: "For a polynomial p, lim_{x→a} p(x) = ?"
        back: "p(a) — evaluate by direct substitution (polynomials are continuous everywhere)"
        type: basic

  - id: one-sided-limits
    name: One-Sided Limits
    core: true
    difficulty: 0.5
    drill: false
    answer_kind: expression
    expected_time_secs: 90
    prerequisites:
      - id: limits-graphical-numerical
        weight: 0.8
        key: true
      - id: absolute-value
        weight: 0.5
        key: true
      - id: piecewise-absolute-value-graphs
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: One-sided limits where the function lives on one side
        key_prerequisites: [limits-graphical-numerical]
        exemplars:
          - problem: 'Evaluate $\lim_{x \to 0^+} \sqrt{x}$.'
            answer: "0"
          - problem: 'Evaluate $\lim_{x \to 2^+} \left(\sqrt{x - 2} + 3\right)$.'
            answer: "3"
            solution_sketch: 'For $x$ just above $2$, $\sqrt{x - 2}$ is tiny and positive, so the expression approaches $0 + 3 = 3$.'
          - problem: 'Only one of $\lim_{x \to 2^-} \sqrt{x - 2}$ and $\lim_{x \to 2^+} \sqrt{x - 2}$ makes sense. Evaluate the one that does.'
            answer: "0"
            solution_sketch: 'For $x < 2$ the radicand is negative, so $\sqrt{x-2}$ has no values on the left and that one-sided limit is meaningless; from the right the radicand is small and positive, so the limit is $0$.'
          - problem: "Evaluate $\\lim_{x \\to 5^+} \\left(\\sqrt{x - 5} + 4\\right)$."
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The expression is $\\sqrt{x - 5} + 4$ for $x > 5$, so the square root is defined. As $x$ approaches $5$ from the right, $x - 5$ approaches $0$ through positive values, so $\\sqrt{x - 5}$ approaches $0$. Adding the constant gives $0 + 4 = 4$. The one-sided limit is 4."
          - problem: "Evaluate $\\lim_{x \\to 3^+} \\left(2\\sqrt{x - 3} - 1\\right)$."
            answer: "-1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The function is $2\\sqrt{x - 3} - 1$, defined for $x > 3$. As $x$ approaches $3$ from the right, $x - 3$ approaches $0$ through positive values, so $\\sqrt{x - 3}$ approaches $0$. Twice that is $0$, and subtracting $1$ gives $0 - 1 = -1$. The one-sided limit is -1."
          - problem: "Evaluate $\\lim_{x \\to 9^+} \\left(\\sqrt{x - 9} + x\\right)$."
            answer: "9"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The expression is $\\sqrt{x - 9} + x$ for $x > 9$. As $x$ approaches $9$ from the right, $x - 9$ tends to $0$ through positive numbers, so $\\sqrt{x - 9}$ tends to $0$. The $x$ term tends to $9$, so the sum tends to $0 + 9 = 9$. The one-sided limit is 9."
        constraints: "square-root expressions defined on one side of the point; limits are small integers"
      - id: kp2
        name: Absolute-value sign quotients
        key_prerequisites: [absolute-value, limits-graphical-numerical]
        exemplars:
          - problem: 'Evaluate $\lim_{x \to 5^-} \frac{|x - 5|}{x - 5}$.'
            answer: "-1"
            solution_sketch: 'For $x < 5$, $|x - 5| = -(x - 5)$, so the quotient is identically $-1$ on the left.'
          - problem: 'Evaluate $\lim_{x \to 0^+} \frac{2|x|}{x}$.'
            answer: "2"
          - problem: 'Evaluate $\lim_{x \to -2^+} \frac{|x + 2|}{x + 2}$.'
            answer: "1"
          - problem: "Evaluate $\\lim_{x \\to 3^-} \\frac{4|x - 3|}{x - 3}$."
            answer: "-4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Sign rule: for $x < 3$, the expression $x - 3$ is negative, so $|x - 3| = -(x - 3)$. Substitute: $\\frac{4|x - 3|}{x - 3} = \\frac{4(-(x - 3))}{x - 3} = -4$. Limit rule: the quotient is the constant $-4$ for $x < 3$, so the left limit is -4."
          - problem: "Evaluate $\\lim_{x \\to 1^+} \\frac{3|x - 1|}{x - 1}$."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Sign rule: for $x > 1$, the expression $x - 1$ is positive, so $|x - 1| = x - 1$. Substitute: $\\frac{3|x - 1|}{x - 1} = \\frac{3(x - 1)}{x - 1} = 3$. Limit rule: the quotient is the constant $3$ for $x > 1$, so the right limit is 3."
          - problem: "Evaluate $\\lim_{x \\to 6^-} \\frac{5|x - 6|}{x - 6}$."
            answer: "-5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Sign rule: for $x < 6$, the expression $x - 6$ is negative, so $|x - 6| = -(x - 6)$. Substitute: $\\frac{5|x - 6|}{x - 6} = \\frac{5(-(x - 6))}{x - 6} = -5$. Limit rule: the quotient is the constant $-5$ for $x < 6$, so the left limit is -5."
        constraints: "quotients of the form c|x - a|/(x - a); resolve the absolute value by the sign of the side"
      - id: kp3
        name: Two-sided limit exists iff the one-sided limits agree
        key_prerequisites: [limits-graphical-numerical]
        exemplars:
          - problem: 'Given $\lim_{x \to 3^-} f(x) = 4$ and $\lim_{x \to 3^+} f(x) = 4$, find $\lim_{x \to 3} f(x)$.'
            answer: "4"
          - problem: 'Given $\lim_{x \to 1^-} g(x) = 2$ and $\lim_{x \to 1^+} g(x) = 6$, find $\lim_{x \to 1} g(x)$.'
            answer: "DNE"
            answer_contract: {kind: none}
            solution_sketch: 'The one-sided limits differ ($2 \neq 6$), so the two-sided limit does not exist.'
          - problem: 'Evaluate $\lim_{x \to 0} \frac{|x|}{x}$.'
            answer: "DNE"
            answer_contract: {kind: none}
            solution_sketch: 'The left limit is $-1$ and the right limit is $1$; they disagree, so the two-sided limit does not exist.'
        constraints: "compare given or computed one-sided limits; answer a number, or DNE when the sides disagree"
    diagnostic_exemplar:
      problem: 'Evaluate $\lim_{x \to 7} \frac{|x - 7|}{x - 7}$, or answer DNE if it does not exist.'
      answer: 'DNE'
      answer_contract: {kind: none}
      solution_sketch: 'For $x < 7$ the quotient is $-1$ and for $x > 7$ it is $+1$; the one-sided limits disagree, so the two-sided limit does not exist.'
    anki_seeds:
      - front: "lim_{x→a⁻} means x approaches a from values that are ___ a; lim_{x→a⁺} from values ___ a."
        back: "less than; greater than"
        type: basic
      - front: "For x < a, |x - a| equals..."
        back: "-(x - a), so |x - a|/(x - a) = -1 on the left of a"
        type: basic

  - id: limits-piecewise-functions
    name: Limits of Piecewise Functions
    core: true
    difficulty: 0.52
    drill: false
    answer_kind: expression
    expected_time_secs: 120
    prerequisites:
      - id: one-sided-limits
        weight: 0.8
        key: true
      - id: evaluating-functions
        weight: 0.5
        key: true
      - id: piecewise-absolute-value-graphs
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: One-sided limits at a branch point
        key_prerequisites: [one-sided-limits, evaluating-functions]
        exemplars:
          - problem: "Let f(x) = x + 1 for x < 2 and f(x) = x^2 for x >= 2. Find the left-hand limit and the right-hand limit of f as x approaches 2."
            answer: "left = 3; right = 4"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "left"}, {"contract": {"kind": "exact"}, "name": "right"}]}
            solution_sketch: "For f(x) = x + 1 for x < 2 and f(x) = x^2 for x >= 2, the left side uses the branch x + 1, so direct substitution by evaluating the polynomial gives 2 + 1 = 3. The right side uses the branch x^2, so direct substitution gives 2^2 = 4. The two one-sided limits disagree, so the two-sided limit does not exist. The values are left = 3; right = 4."
          - problem: 'Let $g(x) = 2x$ for $x < 3$ and $g(x) = 9 - x$ for $x \geq 3$. Find $\lim_{x \to 3} g(x)$.'
            answer: "6"
            solution_sketch: 'Left limit $2 \cdot 3 = 6$, right limit $9 - 3 = 6$; they agree, so the limit is $6$.'
          - problem: "Let g(t) = t^2 for t < 1 and g(t) = 2t - 1 for t >= 1. Find the right-hand limit as t approaches 1 from the right."
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "For g(t) = t^2 for t < 1 and g(t) = 2t - 1 for t >= 1, the right branch is the t >= 1 branch, which is 2t - 1. Direct substitution at t = 1 gives 2(1) - 1 = 1 by evaluating the polynomial. The left branch gives 1^2 = 1, so the one-sided limits agree. The right-hand limit is 1."
          - problem: "Let h(x) = 3x - 2 for x < 4 and h(x) = x^2 - 8 for x >= 4. Find the left-hand limit as x approaches 4 from the left."
            answer: "10"
            answer_contract: {"kind": "exact"}
            solution_sketch: "For h(x) = 3x - 2 for x < 4 and h(x) = x^2 - 8 for x >= 4, the left branch is the x < 4 branch, which is 3x - 2. Direct substitution at x = 4 gives 3(4) - 2 = 10 by evaluating the polynomial. The right branch gives 4^2 - 8 = 8, so the one-sided limits disagree. The left-hand limit is 10."
          - problem: "Let k(x) = x + 4 for x < 1 and k(x) = 5 for x >= 1. Find the right-hand limit as x approaches 1 from the right."
            answer: "5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "For k(x) = x + 4 for x < 1 and k(x) = 5 for x >= 1, the right branch is the x >= 1 branch, which is the constant 5. Direct evaluation at x = 1 gives 5. The left branch gives 1 + 4 = 5, so the one-sided limits agree. The right-hand limit is 5."
          - problem: "Let p(x) = x^2 + 2 for x < 3 and p(x) = 3x + 2 for x >= 3. Find the left-hand limit as x approaches 3 from the left."
            answer: "11"
            answer_contract: {"kind": "exact"}
            solution_sketch: "For p(x) = x^2 + 2 for x < 3 and p(x) = 3x + 2 for x >= 3, the left branch is the x < 3 branch, which is x^2 + 2. Direct substitution at x = 3 gives 3^2 + 2 = 11 by evaluating the polynomial. The right branch gives 3(3) + 2 = 11, so the one-sided limits agree. The left-hand limit is 11."
        constraints: "two-branch piecewise with polynomial branches; one matching and one mismatching case per problem set"
      - id: kp2
        name: Limits away from the branch point
        key_prerequisites: [evaluating-functions]
        exemplars:
          - problem: 'Let $f(x) = x + 1$ for $x < 2$ and $f(x) = x^2$ for $x \geq 2$. Find $\lim_{x \to 1} f(x)$.'
            answer: "2"
            solution_sketch: 'Near $x = 1$ only the $x < 2$ branch matters: $x + 1 \to 2$.'
          - problem: 'Let $g(x) = 2x$ for $x < 3$ and $g(x) = 9 - x$ for $x \geq 3$. Find $\lim_{x \to 5} g(x)$.'
            answer: "4"
          - problem: "Let $f(x) = x^2 + 2$ for $x < 3$ and $f(x) = 4x - 1$ for $x \\geq 3$. Find $\\lim_{x \\to 1} f(x)$."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The piecewise rule is $f(x) = x^2 + 2$ for $x < 3$ and $f(x) = 4x - 1$ for $x \\geq 3$. The target $x = 1$ lies strictly inside the left branch, so only $f(x) = x^2 + 2$ governs the limit. Substitute $x = 1$: $1^2 + 2 = 3$. The limit is 3."
          - problem: "Let $f(x) = 5 - 2x$ for $x < 4$ and $f(x) = \\sqrt{x + 5}$ for $x \\geq 4$. Find $\\lim_{x \\to 20} f(x)$."
            answer: "5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full rule is $f(x) = 5 - 2x$ for $x < 4$ and $f(x) = \\sqrt{x + 5}$ for $x \\geq 4$. The target $x = 20$ lies in the right branch, so substitute into $\\sqrt{x + 5}$. This gives $\\sqrt{20 + 5} = \\sqrt{25} = 5$. The limit is 5."
          - problem: "Let $f(x) = \\frac{x + 1}{x - 2}$ for $x < 1$ and $f(x) = x^2 - 3$ for $x \\geq 1$. Find the limit $\\lim_{x \\to 0} f(x)$ as a fraction."
            answer: "-1/2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The function is $f(x) = \\frac{x + 1}{x - 2}$ for $x < 1$ and $f(x) = x^2 - 3$ for $x \\geq 1$. The target $x = 0$ is strictly inside the left branch, so use $\\frac{x + 1}{x - 2}$. Substitute $x = 0$: $\\frac{0 + 1}{0 - 2} = -\\frac{1}{2}$. The limit is -1/2."
          - problem: "A parking fee is $f(t) = 2t + 1$ for $t < 6$ and $f(t) = 20 - t$ for $t \\geq 6$, where $t$ is hours. Find $\\lim_{t \\to 8} f(t)$."
            answer: "12"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The fee rule is $f(t) = 2t + 1$ for $t < 6$ and $f(t) = 20 - t$ for $t \\geq 6$. The target $t = 8$ is strictly inside the right branch, so only $20 - t$ applies. Substitute $t = 8$: $20 - 8 = 12$. The limit is 12."
        constraints: "the target point sits strictly inside one branch; substitute into that branch only"
      - id: kp3
        name: Branch points with a separately defined value
        key_prerequisites: [one-sided-limits, evaluating-functions]
        exemplars:
          - problem: 'Let $f(x) = x + 4$ for $x < -1$, $f(-1) = 2$, and $f(x) = -x + 2$ for $x > -1$. Find $\lim_{x \to -1} f(x)$.'
            answer: "3"
            solution_sketch: 'Left limit $-1 + 4 = 3$ and right limit $1 + 2 = 3$ agree; the lone value $f(-1) = 2$ does not affect the limit.'
          - problem: 'Let $h(x) = x^2$ for $x \neq 3$ and $h(3) = 0$. Find $\lim_{x \to 3} h(x)$.'
            answer: "9"
          - problem: "Let $f(x) = x + 3$ for $x < 1$, $f(1) = 5$, and $f(x) = 4x$ for $x > 1$. Find $\\lim_{x \\to 1} f(x)$."
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Start with the full function: f(x)=x+3 for x<1, f(1)=5, and f(x)=4x for x>1. The left-hand limit uses the first branch: as x approaches 1 from below, x+3 approaches 1+3=4. The right-hand limit uses the third branch: as x approaches 1 from above, 4x approaches 4. Both one-sided limits agree, so the two-sided limit is 4. The separate value f(1)=5 does not change the limit. The limit is 4."
          - problem: "Let $g(x) = x^2 + 1$ for $x < 2$, $g(2) = 0$, and $g(x) = x + 3$ for $x > 2$. Find $\\lim_{x \\to 2} g(x)$."
            answer: "5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Start with the full function: g(x)=x^2+1 for x<2, g(2)=0, and g(x)=x+3 for x>2. The left-hand limit comes from the quadratic branch: x^2+1 at x=2 gives 4+1=5. The right-hand limit comes from the linear branch: x+3 at x=2 gives 5. Since both one-sided limits agree, the two-sided limit is 5. The value g(2)=0 is different but does not affect the limit. The limit is 5."
          - problem: "Let $f(x) = x + k$ for $x < 1$, $f(1) = 9$, and $f(x) = 3x$ for $x > 1$. If $\\lim_{x \\to 1} f(x)$ exists, find the constant $k$."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Start with the full function: f(x)=x+k for x<1, f(1)=9, and f(x)=3x for x>1. The right-hand limit is 3(1)=3. For the two-sided limit to exist, the left-hand limit must equal the right-hand limit, so 1+k=3. Solving gives k=2. The separate value f(1)=9 differs from the limit 3. Thus k = 2."
          - problem: "A parking garage charges $C(t) = 2t$ dollars for $t < 3$ hours, charges a flat $C(3) = 20$ dollars at exactly 3 hours, and charges $C(t) = t + 3$ dollars for $t > 3$ hours. Find $\\lim_{t \\to 3} C(t)$."
            answer: "6"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Start with the full cost function: C(t)=2t for t<3, C(3)=20, and C(t)=t+3 for t>3. The left-hand limit uses the first rule: 2t approaches 2(3)=6. The right-hand limit uses the third rule: t+3 approaches 3+3=6. Both one-sided limits agree, so the two-sided limit is 6. The separately charged value C(3)=20 does not affect the limit. The limit is 6."
        constraints: "the value at the branch point differs from the limit; both one-sided limits agree"
    diagnostic_exemplar:
      problem: 'Let $f(x) = 3x - 1$ for $x < 2$, $f(2) = 10$, and $f(x) = x + 3$ for $x > 2$. Find $\lim_{x \to 2} f(x)$.'
      answer: '5'
      solution_sketch: 'Left limit $3(2) - 1 = 5$; right limit $2 + 3 = 5$. They agree, so the limit is $5$ — the separately defined value $f(2) = 10$ plays no role.'
    anki_seeds:
      - front: "To find a limit of a piecewise function at a branch point, you must..."
        back: "compute both one-sided limits, each from its own branch, and check that they agree"
        type: basic
      - front: "Away from the branch points, the limit of a piecewise function is computed by..."
        back: "substituting into the single branch that contains the target point"
        type: basic

  - id: factoring-limits
    name: Limits by Factoring
    core: true
    difficulty: 0.52
    drill: false
    answer_kind: numeric
    expected_time_secs: 120
    prerequisites:
      - id: limit-laws
        weight: 0.8
        key: true
      - id: factoring-trinomials
        weight: 0.6
        key: true
      - id: difference-of-squares
        weight: 0.5
      - id: factoring-gcf
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: Recognize the 0/0 indeterminate form
        key_prerequisites: [limit-laws]
        exemplars:
          - problem: 'Substitute $x = 3$ into $\frac{x^2 - 9}{x - 3}$. What form results? (Answer with the resulting quotient of the two values, e.g. $7/0$.)'
            answer: "0/0"
            answer_contract: {kind: none}
            solution_sketch: 'Numerator and denominator both vanish at $3$, giving the indeterminate form $\frac{0}{0}$ — the limit must be found another way (here, by factoring).'
          - problem: 'What form does direct substitution give for $\lim_{x \to 2} \frac{x^2 - 1}{x - 2}$? (Answer with the resulting quotient of the two values.)'
            answer: "3/0"
            answer_contract: {kind: none}
            solution_sketch: 'A nonzero numerator over a zero denominator is not indeterminate: the limit is infinite or does not exist, and factoring will not help.'
          - problem: 'Substitute $x = 1$ into $\frac{x^2 + 1}{x + 1}$ and evaluate the limit if possible.'
            answer: "1"
            solution_sketch: 'Substitution gives $\frac{2}{2} = 1$ — no indeterminate form, so the limit is simply $1$.'
        constraints: "one case each of 0/0, nonzero/0, and clean substitution; the student names the form as a quotient"
      - id: kp2
        name: Cancel a difference of squares
        key_prerequisites: [difference-of-squares, limit-laws]
        exemplars:
          - problem: 'Evaluate $\lim_{x \to 2} \frac{x^2 - 4}{x - 2}$.'
            answer: "4"
            solution_sketch: 'Factor: $\frac{(x-2)(x+2)}{x-2} = x + 2$ for $x \neq 2$; the limit is $2 + 2 = 4$.'
          - problem: 'Evaluate $\lim_{x \to -3} \frac{x^2 - 9}{x + 3}$.'
            answer: "-6"
            solution_sketch: '$\frac{(x-3)(x+3)}{x+3} = x - 3 \to -6$.'
          - problem: 'Evaluate $\lim_{x \to 4} \frac{x - 4}{x^2 - 16}$.'
            answer: "1/8"
            solution_sketch: 'Factor the denominator: $\frac{x-4}{(x-4)(x+4)} = \frac{1}{x+4} \to \frac{1}{8}$.'
          - problem: "Evaluate $\\lim_{x \\to 5} \\frac{x^2 - 25}{x - 5}$."
            answer: "10"
            answer_contract: {"kind": "exact"}
            solution_sketch: "For the limit (x^2 - 25)/(x - 5) as x goes to 5, the quotient has the 0/0 form, so factor the numerator by the difference of squares rule: (x^2 - 25)/(x - 5) = (x - 5)(x + 5)/(x - 5). Cancel the common factor x - 5 for x not equal to 5, leaving x + 5. By the limit laws, the limit is 5 + 5 = 10."
          - problem: "Evaluate $\\lim_{x \\to -2} \\frac{x + 2}{x^2 - 4}$."
            answer: "-1/4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "For the limit (x + 2)/(x^2 - 4) as x goes to -2, the quotient has the 0/0 form, so factor the denominator by the difference of squares rule: (x + 2)/(x^2 - 4) = (x + 2)/((x - 2)(x + 2)). Cancel the common factor x + 2 for x not equal to -2, leaving 1/(x - 2). By direct substitution in the limit laws, the limit is 1/(-2 - 2) = -1/4."
          - problem: "Evaluate $\\lim_{x \\to 3/2} \\frac{4x^2 - 9}{2x - 3}$."
            answer: "6"
            answer_contract: {"kind": "exact"}
            solution_sketch: "For the limit (4x^2 - 9)/(2x - 3) as x goes to 3/2, the quotient is 0/0, so factor the numerator as a difference of squares: 4x^2 - 9 = (2x - 3)(2x + 3). Then (4x^2 - 9)/(2x - 3) = (2x - 3)(2x + 3)/(2x - 3). Cancel the common factor 2x - 3 for x not equal to 3/2, leaving 2x + 3. By limit laws, the limit is 2(3/2) + 3 = 6."
        constraints: "0/0 form; difference of squares in numerator or denominator; integer or unit-fraction answers"
      - id: kp3
        name: Cancel a factored trinomial
        key_prerequisites: [factoring-trinomials, limit-laws]
        exemplars:
          - problem: 'Evaluate $\lim_{x \to 3} \frac{x^2 - x - 6}{x - 3}$.'
            answer: "5"
            solution_sketch: '$x^2 - x - 6 = (x-3)(x+2)$; cancel and substitute to get $5$.'
          - problem: 'Evaluate $\lim_{x \to -1} \frac{x^2 + 3x + 2}{x + 1}$.'
            answer: "1"
          - problem: 'Evaluate $\lim_{x \to 2} \frac{x^2 - 5x + 6}{x^2 - 4}$.'
            answer: "-1/4"
            solution_sketch: '$\frac{(x-2)(x-3)}{(x-2)(x+2)} = \frac{x-3}{x+2} \to \frac{-1}{4}$.'
          - problem: "Evaluate $\\lim_{x \\to 5} \\frac{x^2 - 3x - 10}{x - 5}$."
            answer: "7"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full limit is $\\lim_{x \\to 5} \\frac{x^2 - 3x - 10}{x - 5}$. Step 1: factor the numerator as $(x - 5)(x + 2)$ by factoring trinomials. Step 2: cancel the common factor $x - 5$ and evaluate $x + 2$ at $x = 5$ by limit laws. The limit is 7."
          - problem: "Evaluate $\\lim_{x \\to -2} \\frac{x^2 - x - 6}{x + 2}$."
            answer: "-5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full limit is $\\lim_{x \\to -2} \\frac{x^2 - x - 6}{x + 2}$. Step 1: factor the numerator as $(x + 2)(x - 3)$ by factoring trinomials. Step 2: cancel the common factor $x + 2$ and evaluate $x - 3$ at $x = -2$ by limit laws. The limit is -5."
          - problem: "Evaluate $\\lim_{x \\to 1} \\frac{x^2 + 2x - 3}{x^2 - 3x + 2}$."
            answer: "-4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full limit is $\\lim_{x \\to 1} \\frac{x^2 + 2x - 3}{x^2 - 3x + 2}$. Step 1: factor the numerator as $(x - 1)(x + 3)$ and the denominator as $(x - 1)(x - 2)$ by factoring trinomials. Step 2: cancel the common factor $x - 1$ and evaluate $\\frac{x + 3}{x - 2}$ at $x = 1$ by limit laws. The limit is -4."
        constraints: "0/0 form; trinomials factor over the integers with (x - a) as the common factor"
    diagnostic_exemplar:
      problem: 'Evaluate $\lim_{x \to 4} \frac{x^2 - x - 12}{x - 4}$.'
      answer: "7"
      solution_sketch: 'Factor the numerator: $\frac{(x-4)(x+3)}{x-4} = x + 3$ for $x \neq 4$, and that tends to $7$.'
    anki_seeds:
      - front: "When direct substitution gives 0/0, the limit..."
        back: "may still exist — the form is indeterminate; simplify algebraically and try again"
        type: basic
      - front: "Substitution giving (nonzero)/0 means..."
        back: "the limit is infinite or DNE — no algebraic cancellation can fix it"
        type: basic

  - id: limits-algebraic
