            solution_sketch: "The inner function is $x^2 + 7$. By limit laws, its limit as $x \\to 3$ is $16$. The square root function is continuous at $16$, so pass the limit through: $\\sqrt{16}$. The limit is 4."
          - problem: "Given $\\lim_{x \\to a} g(x) = 2$ and $f$ continuous with $f(2) = 5$, find $\\lim_{x \\to a} f(g(x))$."
            answer: "5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The inner limit is $\\lim_{x \\to a} g(x) = 2$. Since $f$ is continuous at $2$, the limit of the composition is $f$ evaluated at the inner limit, $f(2)$. Given $f(2) = 5$, the limit is 5."
          - problem: "Evaluate $\\lim_{x \\to 0} \\sin(x + \\pi/2)$."
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The inner limit is $\\lim_{x \\to 0} (x + \\pi/2) = \\pi/2$. The sine function is continuous at $\\pi/2$, so pass the limit through: $\\sin(\\pi/2)$. Since $\\sin(\\pi/2) = 1$, the limit is 1."
          - problem: "Evaluate $\\lim_{x \\to 0} e^{x + \\ln(6)}$."
            answer: "6"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The inner limit is $\\lim_{x \\to 0} (x + \\ln(6)) = \\ln(6)$. The exponential function is continuous at $\\ln(6)$, so pass the limit through: $e^{\\ln(6)}$. Since $e^{\\ln(6)} = 6$, the limit is 6."
        constraints: "outer function continuous at the inner limit; small integer values"
      - id: kp2
        name: Composite limits from tables and graphs
        key_prerequisites: [function-composition, limit-laws]
        exemplars:
          - problem: 'Suppose $\lim_{x \to 2} g(x) = 3$ (but $g(2) = 5$), and $f$ is continuous with $f(3) = 8$ and $f(5) = 1$. Find $\lim_{x \to 2} f(g(x))$.'
            answer: "8"
            solution_sketch: 'Only the inner LIMIT matters: $g(x) \to 3$, and $f$ is continuous at $3$, so the composite tends to $f(3) = 8$.'
          - problem: 'A table shows $g(x) \to -1$ as $x \to 0$, and $f$ is continuous with $f(-1) = 6$. Find $\lim_{x \to 0} f(g(x))$.'
            answer: "6"
          - problem: "A table for g near x = 1 gives values that approach -2, while g(1) = 4. The function f is continuous with f(-2) = 7. Find lim_{x -> 1} f(g(x))."
            answer: "7"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The limit is lim_{x -> 1} f(g(x)). Step 1: Read the inner limit from the table; the values of g approach -2 as x approaches 1, while g(1)=4 is a decoy. Step 2: Use the composite limit rule; since f is continuous at -2, the composite limit is f(-2). Since f(-2)=7, the limit is 7."
          - problem: "The graph of g shows that as x approaches 3, g(x) approaches 0, but the graph has a point at (3, 2). The function f is continuous with f(0) = 5. Find lim_{x -> 3} f(g(x))."
            answer: "5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The limit is lim_{x -> 3} f(g(x)). Step 1: From the graph, the inner limit is 0 as x approaches 3, and the plotted point g(3)=2 is a decoy. Step 2: Apply the composite limit rule; because f is continuous at 0, the composite limit is f(0). Since f(0)=5, the limit is 5."
          - problem: "Two tables are given. For g, as x approaches -2, the values approach 4, while g(-2) = 1. For f, the table shows f continuous at 4 with f(4) = -1. Find lim_{x -> -2} f(g(x))."
            answer: "-1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The limit is lim_{x -> -2} f(g(x)). Step 1: The g-table shows the inner limit is 4 as x approaches -2, while g(-2)=1 is a decoy. Step 2: Because f is continuous at 4, the composite limit rule gives f(4). From the f-table f(4)=-1, so the limit is -1."
          - problem: "The graph of g approaches height 3 as x approaches 0 from either side, but the graph has a hole at (0, 9). The function f is continuous with f(3) = 11. Find lim_{x -> 0} f(g(x))."
            answer: "11"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The limit is lim_{x -> 0} f(g(x)). Step 1: The graph of g approaches height 3 as x approaches 0, and the hole value 9 at x=0 is a decoy. Step 2: Use the composite limit rule; since f is continuous at 3, the composite limit is f(3). Since f(3)=11, the limit is 11."
        constraints: "the value g(a) is a decoy differing from the inner limit; f continuous at the inner limit"
      - id: kp3
        name: One-sided care when the outer function jumps
        key_prerequisites: [one-sided-limits, function-composition]
        exemplars:
          - problem: 'Suppose $\lim_{u \to 2^-} f(u) = 1$ and $\lim_{u \to 2^+} f(u) = 6$. If $g(x) = 2 + (x - 3)^2$, find $\lim_{x \to 3} f(g(x))$.'
            answer: "6"
            solution_sketch: '$g(x) \to 2$ from ABOVE (the square is positive), so the composite follows the right-hand limit of $f$: $6$.'
          - problem: 'With the same $f$, let $h(x) = 2 - x^2$. Find $\lim_{x \to 0} f(h(x))$.'
            answer: "1"
            solution_sketch: '$h(x) \to 2$ from below, so the composite follows the left-hand limit of $f$: $1$.'
        constraints: "inner function approaches its limit from one definite side; outer function has a jump there"
    diagnostic_exemplar:
      problem: 'Suppose $\lim_{u \to 4^-} f(u) = 2$ and $\lim_{u \to 4^+} f(u) = 7$, and let $g(x) = 4 + (x - 1)^2$. Find $\lim_{x \to 1} f(g(x))$.'
      answer: '7'
      solution_sketch: 'For $x$ near $1$ but $x \neq 1$ we have $g(x) > 4$, so $g(x)$ approaches $4$ from above and only the right-hand limit of $f$ at $4$ matters: the answer is $7$.'
    anki_seeds:
      - front: "If lim_{x→a} g(x) = L and f is continuous at L, then lim_{x→a} f(g(x)) = ?"
        back: "f(L) — the limit passes inside a continuous outer function"
        type: basic
      - front: "In a composite limit, the inner function's VALUE g(a) matters..."
        back: "not at all — only the inner limit L (and possibly the side from which g approaches L)"
        type: basic

  - id: continuity-at-a-point
    name: Continuity at a Point
    core: true
    difficulty: 0.55
    drill: false
    answer_kind: numeric
    expected_time_secs: 120
    prerequisites:
      - id: limits-piecewise-functions
        weight: 0.7
        key: true
      - id: limit-laws
        weight: 0.5
        key: true
      - id: domain-range
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: Check the three conditions
        key_prerequisites: [limits-piecewise-functions, limit-laws]
        exemplars:
          - problem: "Let $f(x) = \\frac{x^2 - 4}{x - 2}$ for $x \\neq 2$ and $f(2) = 4$. State whether $f$ satisfies the three conditions at $x = 2$, and give the limit as $x$ approaches 2."
            answer: "verdict = continuous; L = 4"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["continuous"], ["discontinuous"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "L"}]}
            solution_sketch: "Full object: $f(x) = \\frac{x^2-4}{x-2}$ for $x \\neq 2$, $f(2) = 4$. Step 1 (limit): factor $x^2 - 4 = (x-2)(x+2)$ and cancel, so $\\lim_{x \\to 2} f(x) = \\lim_{x \\to 2} (x+2) = 4$. Step 2 (value): $f(2) = 4$ is defined. Step 3 (compare): the limit equals $f(2)$, so all three conditions hold. The wrong option 'discontinuous' comes from the error of treating the hole in the formula as a break in the function. Answer: verdict = continuous; L = 4."
          - problem: "Let $g(x) = x^2 + 1$ for $x \\leq 1$ and $g(x) = 3x - 1$ for $x > 1$. State whether $g$ satisfies the three conditions at $x = 1$, and give the limit as $x$ approaches 1."
            answer: "verdict = continuous; L = 2"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["continuous"], ["discontinuous"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "L"}]}
            solution_sketch: "Full object: $g(x) = x^2+1$ on $x \\leq 1$ and $g(x) = 3x-1$ on $x > 1$. Step 1 (one-sided limits): from the left, $x^2+1 \\to 2$; from the right, $3x-1 \\to 2$, so the limit exists and is 2. Step 2 (value): $g(1) = 1^2+1 = 2$ is defined. Step 3 (compare): limit = $g(1)$, so all three conditions hold. The wrong option 'discontinuous' comes from the error of assuming a change of formula at the point forces a break. Answer: verdict = continuous; L = 2."
          - problem: "Let $f(x) = \\frac{x^2 - 25}{x - 5}$ for $x \\neq 5$ and $f(5) = 3$. State whether $f$ satisfies the three conditions at $x = 5$, and give the limit as $x$ approaches 5."
            answer: "verdict = discontinuous; L = 10"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["continuous"], ["discontinuous"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "L"}]}
            solution_sketch: "Full object: $f(x) = \\frac{x^2-25}{x-5}$ for $x \\neq 5$, $f(5) = 3$. Step 1 (limit): factor $x^2-25 = (x-5)(x+5)$ and cancel, so $\\lim_{x \\to 5} f(x) = \\lim_{x \\to 5} (x+5) = 10$. Step 2 (value): $f(5) = 3$ is defined. Step 3 (compare): the limit 10 is not equal to $f(5) = 3$, so the third condition fails. The wrong option 'continuous' comes from the error of checking only that $f(5)$ is defined and not comparing it with the limit. Answer: verdict = discontinuous; L = 10."
          - problem: "Let $f(x) = x + 1$ for $x < 2$ and $f(x) = x^2 - 1$ for $x > 2$; $f(2)$ is not defined. State whether $f$ satisfies the three conditions at $x = 2$, and give the limit as $x$ approaches 2."
            answer: "verdict = discontinuous; L = 3"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["continuous"], ["discontinuous"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "L"}]}
            solution_sketch: "Full object: $f(x) = x+1$ on $x < 2$, $f(x) = x^2-1$ on $x > 2$, with no value at $x = 2$. Step 1 (one-sided limits): from the left, $x+1 \\to 3$; from the right, $x^2-1 \\to 3$, so the limit exists and is 3. Step 2 (value): $f(2)$ is not defined, so the first condition fails. Step 3 (verdict): with $f(2)$ undefined, $f$ cannot satisfy all three conditions. The wrong option 'continuous' comes from the error of treating an existing limit as sufficient without a defined function value. Answer: verdict = discontinuous; L = 3."
          - problem: "Let $f(x) = c x - 3$ for $x < 1$ and $f(x) = x^2$ for $x \\geq 1$. Find the value of $c$ that makes $f$ satisfy the three conditions at $x = 1$."
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Full object: $f(x) = cx-3$ on $x < 1$ and $f(x) = x^2$ on $x \\geq 1$. Step 1 (value and right limit): $f(1) = 1^2 = 1$, and from the right $x^2 \\to 1$, so the required limit is 1. Step 2 (left limit): from the left, $cx - 3 \\to c - 3$. Step 3 (continuity condition): the left limit must equal $f(1)$, so $c - 3 = 1$, giving $c = 4$. Answer: 4."
          - problem: "Let $f(x) = x^2 + c$ for $x \\leq 3$ and $f(x) = 2x - 5$ for $x > 3$. Find the value of $c$ that makes $f$ satisfy the three conditions at $x = 3$."
            answer: "-8"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Full object: $f(x) = x^2+c$ on $x \\leq 3$ and $f(x) = 2x-5$ on $x > 3$. Step 1 (right limit): from the right, $2x-5 \\to 1$, so the required limit is 1. Step 2 (value and left limit): $f(3) = 9 + c$, and from the left $x^2 + c \\to 9 + c$. Step 3 (continuity condition): the limit must equal $f(3)$, so $9 + c = 1$, giving $c = -8$. Answer: -8."
        constraints: "verify f(a) defined, limit exists, limit = f(a); values are small integers; include one failing case"
      - id: kp2
        name: Identify which condition fails
        key_prerequisites: [limits-piecewise-functions, limit-laws]
        exemplars:
          - problem: "For f(x) = (x^2 - 7x + 10)/(x - 2) at x = 2, identify the first continuity condition that fails. Use 1 for f(a) undefined, 2 for the limit does not exist, and 3 for the limit not equal to f(a). Give the condition number and the two-sided limit. Give the answer as condition = ..., limit = ..."
            answer: "condition = 1; limit = -3"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "condition"}, {"contract": {"kind": "exact"}, "name": "limit"}]}
            solution_sketch: "Full object: f(x) = (x^2 - 7x + 10)/(x - 2) at x = 2. Condition 1 (f(a) defined) by the definition of continuity: the denominator is 0 at x = 2, so f(2) is undefined and condition 1 is the first to fail. Condition 2 (limit exists) by the limit laws: for x not equal to 2 the expression simplifies to x - 5, so the two-sided limit is -3. The first failing condition is 1 and the limit is -3, so condition = 1; limit = -3."
          - problem: "For f(x) = abs(x - 3)/(x - 3) for x not equal to 3, and f(3) = 1, identify the first continuity condition that fails. Use 1 for f(a) undefined, 2 for the limit does not exist, and 3 for the limit not equal to f(a). Give the condition number and the jump (right-hand limit minus left-hand limit). Give the answer as condition = ..., jump = ..."
            answer: "condition = 2; jump = 2"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "condition"}, {"contract": {"kind": "exact"}, "name": "jump"}]}
            solution_sketch: "Full object: f(x) = abs(x - 3)/(x - 3) for x not equal to 3, with f(3) = 1. Condition 1 (f(a) defined) by the definition of continuity: f(3) = 1 is defined. Condition 2 (limit exists) by one-sided limits: for x < 3 the quotient is -1 and for x > 3 it is 1, so the two-sided limit does not exist; the jump is 1 - (-1) = 2. The first failing condition is 2 and the jump is 2, so condition = 2; jump = 2."
          - problem: "For f(x) = (x^2 - 3x - 4)/(x - 4) for x not equal to 4, and f(4) = 9, identify the first continuity condition that fails. Use 1 for f(a) undefined, 2 for the limit does not exist, and 3 for the limit not equal to f(a). Give the condition number and the gap f(4) minus the limit. Give the answer as condition = ..., gap = ..."
            answer: "condition = 3; gap = 4"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "condition"}, {"contract": {"kind": "exact"}, "name": "gap"}]}
            solution_sketch: "Full object: f(x) = (x^2 - 3x - 4)/(x - 4) for x not equal to 4, with f(4) = 9. Condition 1 (f(a) defined) by the definition of continuity: f(4) = 9 is defined. Condition 2 (limit exists) by the limit laws: the factor (x - 4) cancels, leaving x + 1, so the limit is 5. Condition 3 (limit equals f(a)): 5 is not 9, so the first failing condition is 3 and the gap f(4) minus the limit is 4, so condition = 3; gap = 4."
          - problem: "For f(x) = (x^3 - 27)/(x - 3) at x = 3, identify the first continuity condition that fails. Use 1 for f(a) undefined, 2 for the limit does not exist, and 3 for the limit not equal to f(a). Give the condition number and the two-sided limit. Give the answer as condition = ..., limit = ..."
            answer: "condition = 1; limit = 27"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "condition"}, {"contract": {"kind": "exact"}, "name": "limit"}]}
            solution_sketch: "Full object: f(x) = (x^3 - 27)/(x - 3) at x = 3. Condition 1 (f(a) defined) by the definition of continuity: the denominator is 0 at x = 3, so f(3) is undefined. Condition 2 (limit exists) by the limit laws: the difference of cubes factorization gives x^2 + 3x + 9, so the limit is 27. The first failing condition is 1 and the limit is 27, so condition = 1; limit = 27."
          - problem: "For f(x) = 2x + 1 for x < 2, f(x) = 2x + 5 for x > 2, and f(2) = 3, identify the first continuity condition that fails. Use 1 for f(a) undefined, 2 for the limit does not exist, and 3 for the limit not equal to f(a). Give the condition number and the jump (right-hand limit minus left-hand limit). Give the answer as condition = ..., jump = ..."
            answer: "condition = 2; jump = 4"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "condition"}, {"contract": {"kind": "exact"}, "name": "jump"}]}
            solution_sketch: "Full object: f(x) = 2x + 1 for x < 2, f(x) = 2x + 5 for x > 2, and f(2) = 3. Condition 1 (f(a) defined) by the definition of continuity: f(2) = 3 is defined. Condition 2 (limit exists) by one-sided limits of piecewise functions: the left limit is 5 and the right limit is 9, so the two-sided limit does not exist; the jump is 9 - 5 = 4. The first failing condition is 2 and the jump is 4, so condition = 2; jump = 4."
          - problem: "For f(x) = (x^2 + 5x + 6)/(x + 2) for x not equal to -2, and f(-2) = 7, identify the first continuity condition that fails. Use 1 for f(a) undefined, 2 for the limit does not exist, and 3 for the limit not equal to f(a). Give the condition number and the gap f(-2) minus the limit. Give the answer as condition = ..., gap = ..."
            answer: "condition = 3; gap = 6"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "condition"}, {"contract": {"kind": "exact"}, "name": "gap"}]}
            solution_sketch: "Full object: f(x) = (x^2 + 5x + 6)/(x + 2) for x not equal to -2, with f(-2) = 7. Condition 1 (f(a) defined) by the definition of continuity: f(-2) = 7 is defined. Condition 2 (limit exists) by the limit laws: the factor (x + 2) cancels, leaving x + 3, so the limit at -2 is 1. Condition 3 (limit equals f(a)): 1 is not 7, so the first failing condition is 3 and the gap f(-2) minus the limit is 6, so condition = 3; gap = 6."
        constraints: "one failing condition per problem; the student names it"
      - id: kp3
        name: Where standard functions are continuous
        key_prerequisites: [limit-laws, domain-range]
        exemplars:
          - problem: "At which points is f(x) = (x + 1)/(x^2 - 9) continuous? Give the answer as an inequality in x."
            answer: "x < -3 or -3 < x < 3 or x > 3"
            answer_contract: {"kind": "inequality_union"}
            solution_sketch: "Factor the denominator: x^2 - 9 = (x - 3)(x + 3). A rational function is continuous at every point of its domain by the continuity of rational functions, so exclude x = 3 and x = -3. The full set is x < -3 or -3 < x < 3 or x > 3."
          - problem: "On what interval is f(x) = sqrt(x - 2) continuous? Give the answer as an inequality in x."
            answer: "x >= 2"
            answer_contract: {"kind": "inequality_union"}
            solution_sketch: "The square root function sqrt(t) is continuous for t >= 0. Set the inside nonnegative: x - 2 >= 0, so x >= 2. The full set is x >= 2."
          - problem: "At which points is the polynomial p(x) = x^3 - 4x + 1 continuous? Select the set."
            answer: "all real x"
            answer_contract: {"kind": "label", "options": [["all real x"], ["x nonzero"], ["x at least 1"], ["x positive"]]}
            solution_sketch: "p is a polynomial, so the polynomial continuity rule gives continuity at every real number. The option x nonzero fails because a polynomial is defined at 0. The option x at least 1 fails because continuity is not limited to x at least 1. The option x positive fails because negative numbers are also in the domain. The answer is all real x."
          - problem: "Where is g(x) = (2x)/(x^2 - 4x) continuous? Give the answer as an inequality in x."
            answer: "x < 0 or 0 < x < 4 or x > 4"
            answer_contract: {"kind": "inequality_union"}
            solution_sketch: "Factor the denominator: x^2 - 4x = x(x - 4). A rational function is continuous on its domain by the rational continuity rule, so exclude x = 0 and x = 4. The full set is x < 0 or 0 < x < 4 or x > 4."
          - problem: "Find the set on which h(x) = sqrt(5 - x) is continuous. Give the answer as an inequality in x."
            answer: "x <= 5"
            answer_contract: {"kind": "inequality_union"}
            solution_sketch: "The square root function is continuous on its domain. Set the inside nonnegative: 5 - x >= 0, so x <= 5. The full set is x <= 5."
          - problem: "At which points is f(x) = (x - 1)/(x^2 + 1) continuous? Select the set."
            answer: "every real x"
            answer_contract: {"kind": "label", "options": [["every real x"], ["x not 1"], ["x at least 1"], ["x positive"]]}
            solution_sketch: "The denominator x^2 + 1 is never zero, so the rational function is continuous at every real number by the rational continuity rule. The option x not 1 fails because x = 1 only makes the numerator zero, not the denominator. The option x at least 1 fails because continuity is not limited to x at least 1. The option x positive fails because negative numbers are also in the domain. The answer is every real x."
        constraints: "polynomials, rational functions, and square roots; answer with the set where continuity holds"
    diagnostic_exemplar:
      problem: 'Let $f(x) = \frac{x^2 - 9}{x - 3}$ for $x \neq 3$ and $f(3) = 5$. Is $f$ continuous at $x = 3$? If not, name the condition that fails.'
