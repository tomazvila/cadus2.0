          - problem: 'Evaluate $\lim_{x \to \infty} \frac{\sqrt{9x^2 + x}}{2x}$.'
            answer: "3/2"
          - problem: "Evaluate $\\lim_{x \\to \\infty} \\frac{\\sqrt{4x^2 + 7x}}{3x}$."
            answer: "2/3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "For $x>0$, factor $x$ out of the square root: $\\sqrt{4x^2+7x}=x\\sqrt{4+7/x}$. Divide by $3x$ to get $\\frac{\\sqrt{4+7/x}}{3}$. Since $7/x\\to 0$, the limit is $\\sqrt{4}/3 = 2/3$."
          - problem: "Evaluate $\\lim_{x \\to \\infty} \\frac{\\sqrt{9x^2 + 2x + 1}}{x + 3}$."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "For $x>0$, $\\sqrt{9x^2+2x+1}=x\\sqrt{9+2/x+1/x^2}$ by factoring $x$ out of the square root. Divide numerator and denominator by $x$: $\\frac{\\sqrt{9+2/x+1/x^2}}{1+3/x}$. The inner terms tend to $0$, so the limit is $\\sqrt{9}=3$."
          - problem: "Evaluate $\\lim_{x \\to \\infty} \\frac{\\sqrt{16x^2 + 5x + 2}}{4x}$."
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "For $x>0$, factor $x$ out of the square root: $\\sqrt{16x^2+5x+2}=x\\sqrt{16+5/x+2/x^2}$. Divide by $4x$ to get $\\frac{\\sqrt{16+5/x+2/x^2}}{4}$. The fraction inside the root tends to $0$, so the limit is $\\sqrt{16}/4 = 1$."
          - problem: "Evaluate $\\lim_{x \\to \\infty} \\frac{\\sqrt{16x^2 + 8x + 1}}{x}$."
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "For $x>0$, $\\sqrt{16x^2+8x+1}=x\\sqrt{16+8/x+1/x^2}$. Dividing by $x$ gives $\\sqrt{16+8/x+1/x^2}$. The terms with $1/x$ vanish, so the limit is $\\sqrt{16}=4$."
        constraints: "leading coefficient under the root is a perfect square; x → +∞ only"
      - id: kp2
        name: The sign trap as x → -∞
        key_prerequisites: [limits-at-infinity-rational, simplifying-radicals-variables]
        exemplars:
          - problem: 'Evaluate $\lim_{x \to -\infty} \frac{\sqrt{4x^2 + 1}}{x}$.'
            answer: "-2"
            solution_sketch: '$\sqrt{x^2} = |x| = -x$ for $x < 0$, so $\sqrt{4x^2+1} = -x\sqrt{4 + 1/x^2}$ and the quotient tends to $-2$.'
          - problem: 'Evaluate $\lim_{x \to -\infty} \frac{\sqrt{x^2 + 3}}{x + 1}$.'
            answer: "-1"
          - problem: "Evaluate $\\lim_{x \\to -\\infty} \\frac{\\sqrt{9x^2 + 4}}{x}$."
            answer: "-3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Start with $L = \\lim_{x \\to -\\infty} \\frac{\\sqrt{9x^2 + 4}}{x}$. Step 1: since $x < 0$, the absolute value rule gives $\\sqrt{x^2} = |x| = -x$, so $\\sqrt{9x^2 + 4} = -x\\sqrt{9 + 4/x^2}$. Step 2: divide by $x$, so $L = -\\sqrt{9 + 4/x^2}$ by the limit of a quotient. Step 3: as $x \\to -\\infty$, $4/x^2 \\to 0$, so $L = -3$. Thus the limit is -3."
          - problem: "Evaluate $\\lim_{x \\to -\\infty} \\frac{\\sqrt{4x^2 + 9}}{3x}$; give your result as a fraction."
            answer: "-2/3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Start with $L = \\lim_{x \\to -\\infty} \\frac{\\sqrt{4x^2 + 9}}{3x}$. Step 1: since $x < 0$, $\\sqrt{x^2} = -x$, so $\\sqrt{4x^2 + 9} = -x\\sqrt{4 + 9/x^2}$. Step 2: divide by $3x$, so $L = -\\frac{1}{3}\\sqrt{4 + 9/x^2}$ by the limit of a quotient. Step 3: as $x \\to -\\infty$, $9/x^2 \\to 0$, so $L = -\\frac{1}{3} \\cdot 2 = -2/3$. Thus the limit is -2/3."
          - problem: "Evaluate $\\lim_{x \\to -\\infty} \\frac{\\sqrt{x^2 + 5x}}{2x}$; give your result as a fraction."
            answer: "-1/2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Start with $L = \\lim_{x \\to -\\infty} \\frac{\\sqrt{x^2 + 5x}}{2x}$. Step 1: factor inside the radical as $x^2(1 + 5/x)$; since $x < 0$, $\\sqrt{x^2} = -x$, so $\\sqrt{x^2 + 5x} = -x\\sqrt{1 + 5/x}$. Step 2: divide by $2x$, so $L = -\\frac{1}{2}\\sqrt{1 + 5/x}$ by the limit of a quotient. Step 3: as $x \\to -\\infty$, $5/x \\to 0$, so $L = -\\frac{1}{2} \\cdot 1 = -1/2$. Thus the limit is -1/2."
          - problem: "The limit $\\lim_{x \\to -\\infty} \\frac{\\sqrt{a x^2 + 1}}{x}$ equals $-5$ for a positive constant $a$. Find $a$."
            answer: "25"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Start with $L = \\lim_{x \\to -\\infty} \\frac{\\sqrt{a x^2 + 1}}{x}$. Step 1: for $x < 0$, the absolute value rule gives $\\sqrt{a x^2 + 1} = -x\\sqrt{a + 1/x^2}$. Step 2: divide by $x$, so $L = -\\sqrt{a + 1/x^2}$ by the limit of a quotient. Step 3: as $x \\to -\\infty$, $1/x^2 \\to 0$, so $L = -\\sqrt{a}$. Set $-\\sqrt{a} = -5$, so $\\sqrt{a} = 5$ and $a = 25$. Thus $a$ is 25."
        constraints: "x → -∞; the student must replace √(x²) by -x, producing the negative of the naive answer"
      - id: kp3
        name: Conjugates at infinity
        key_prerequisites: [limits-at-infinity-rational]
        exemplars:
          - problem: 'Evaluate $\lim_{x \to \infty} \left(\sqrt{x^2 + 6x} - x\right)$.'
            answer: "3"
            solution_sketch: 'Multiply by the conjugate: $\frac{6x}{\sqrt{x^2+6x} + x} = \frac{6}{\sqrt{1 + 6/x} + 1} \to \frac{6}{2} = 3$.'
          - problem: 'Evaluate $\lim_{x \to \infty} \left(\sqrt{x^2 + 4} - x\right)$.'
            answer: "0"
            solution_sketch: 'The conjugate gives $\frac{4}{\sqrt{x^2+4} + x} \to 0$.'
          - problem: 'Evaluate $\lim_{x \to \infty} \left(\sqrt{x^2 + 2x} - x\right)$.'
            answer: "1"
          - problem: "Evaluate $\\lim_{x \\to \\infty} \\left(x - \\sqrt{x^2 - 10x}\\right)$."
            answer: "5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Write the full object: L = lim_{x -> infinity} (x - sqrt(x^2 - 10x)). Step 1 (conjugate multiplication): multiply by (x + sqrt(x^2 - 10x))/(x + sqrt(x^2 - 10x)) to get 10x/(x + sqrt(x^2 - 10x)). Step 2 (divide by x): 10/(1 + sqrt(1 - 10/x)). Step 3 (limit of roots): as x -> infinity, sqrt(1 - 10/x) -> 1, so L = 10/(1 + 1) = 5. The answer is 5."
          - problem: "Evaluate $\\lim_{x \\to \\infty} \\left(\\sqrt{x^2 + 14x} - \\sqrt{x^2 + 6x}\\right)$."
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Write the full object: L = lim_{x -> infinity} (sqrt(x^2 + 14x) - sqrt(x^2 + 6x)). Step 1 (conjugate multiplication): multiply by (sqrt(x^2 + 14x) + sqrt(x^2 + 6x))/(sqrt(x^2 + 14x) + sqrt(x^2 + 6x)). Step 2 (expand and simplify): the numerator becomes (x^2 + 14x) - (x^2 + 6x) = 8x. Step 3 (divide by x): L = 8/(sqrt(1 + 14/x) + sqrt(1 + 6/x)). Step 4 (limit of roots): both square roots tend to 1, so L = 8/(1 + 1) = 4. The answer is 4."
          - problem: "Evaluate $\\lim_{x \\to \\infty} \\left(\\sqrt{x^2 + 25} - x\\right)$."
            answer: "0"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Write the full object: L = lim_{x -> infinity} (sqrt(x^2 + 25) - x). Step 1 (conjugate multiplication): multiply by (sqrt(x^2 + 25) + x)/(sqrt(x^2 + 25) + x). Step 2 (simplify numerator): the numerator is (x^2 + 25) - x^2 = 25. Step 3 (divide by x): L = 25/(x(sqrt(1 + 25/x^2) + 1)). Step 4 (limit): the denominator grows without bound, so L = 0. The answer is 0."
        constraints: "∞ - ∞ form; conjugate multiplication yields (linear or constant)/(two growing roots); answers are b/2 for x² + bx, 0 for x² + c"
    diagnostic_exemplar:
      problem: 'Evaluate $\lim_{x \to \infty} \left(\sqrt{x^2 + 8x} - x\right)$.'
      answer: "4"
      solution_sketch: 'Multiply by the conjugate: $\sqrt{x^2+8x} - x = \frac{8x}{\sqrt{x^2+8x} + x}$; dividing top and bottom by $x$ gives $\frac{8}{\sqrt{1 + 8/x} + 1} \to \frac{8}{2} = 4$.'
    anki_seeds:
      - front: "√(x²) equals..."
        back: "|x| — which is -x when x < 0 (the key trap in limits as x → -∞)"
        type: basic
      - front: "lim_{x→∞} (√(x² + bx) - x) = ?"
        back: "b/2 (multiply by the conjugate)"
        type: basic

  - id: squeeze-theorem
    name: The Squeeze Theorem
    core: true
    difficulty: 0.58
    drill: false
    answer_kind: numeric
    expected_time_secs: 120
    prerequisites:
      - id: limit-laws
        weight: 0.7
        key: true
      - id: trig-graphs-basic
        weight: 0.4
      - id: compound-inequalities
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: Apply the squeeze theorem to given bounds
        key_prerequisites: [limit-laws, compound-inequalities]
        exemplars:
          - problem: 'Suppose $4 - x^2 \leq g(x) \leq 4 + x^2$ for all $x \neq 0$. Find $\lim_{x \to 0} g(x)$.'
            answer: "4"
            solution_sketch: 'Both bounds tend to $4$ as $x \to 0$, so the squeeze theorem forces $g(x) \to 4$.'
          - problem: 'Suppose $2x \leq f(x) \leq x^2 + 1$ for all $x$ near $1$. Find $\lim_{x \to 1} f(x)$.'
            answer: "2"
            solution_sketch: 'At $x \to 1$ the lower bound tends to $2$ and the upper bound to $2$; squeezed between them, $f(x) \to 2$.'
          - problem: "Suppose $7 - x^2 \\leq g(x) \\leq 7 + x^2$ for all $x$ near $0$. Find $\\lim_{x \\to 0} g(x)$."
            answer: "7"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Both bounds are $7 - x^2$ and $7 + x^2$. By limit laws, $7 - x^2 \\to 7$ and $7 + x^2 \\to 7$ as $x \\to 0$. Since $g(x)$ lies between them, the squeeze theorem gives $\\lim_{x \\to 0} g(x) = 7$."
          - problem: "Suppose $5 - (x-2)^2 \\leq f(x) \\leq 5 + (x-2)^2$ for all $x$ near $2$. Find $\\lim_{x \\to 2} f(x)$."
            answer: "5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Both bounds are $5 - (x-2)^2$ and $5 + (x-2)^2$. By limit laws, $(x-2)^2 \\to 0$ as $x \\to 2$, so both bounds tend to $5$. The squeeze theorem then gives $\\lim_{x \\to 2} f(x) = 5$."
          - problem: "Suppose $-1 \\leq f(x) \\leq x^2 + 2x$ for all $x$ near $-1$. Find $\\lim_{x \\to -1} f(x)$."
            answer: "-1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Both bounds are $-1$ and $x^2 + 2x$. The constant bound tends to $-1$. By limit laws, $x^2 + 2x \\to (-1)^2 + 2(-1) = -1$. Because $f(x)$ is squeezed between two functions with limit $-1$, the squeeze theorem gives $\\lim_{x \\to -1} f(x) = -1$."
          - problem: "Suppose $0 \\leq f(x) \\leq (x-1)^2$ for all $x$ near $1$. Find $\\lim_{x \\to 1} f(x)$."
            answer: "0"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Both bounds are $0$ and $(x-1)^2$. The constant bound tends to $0$. By limit laws, $(x-1)^2 \\to 0$ as $x \\to 1$. Since $f(x)$ lies between them, the squeeze theorem gives $\\lim_{x \\to 1} f(x) = 0$."
        constraints: "both bounds have the same limit at the target point; bounds are polynomials"
      - id: kp2
        name: Bounded factor times a vanishing factor
        key_prerequisites: [limit-laws, trig-graphs-basic]
        exemplars:
          - problem: 'Evaluate $\lim_{x \to 0} x^2 \sin\left(\frac{1}{x}\right)$.'
            answer: "0"
            solution_sketch: '$-x^2 \leq x^2 \sin(1/x) \leq x^2$ since $|\sin| \leq 1$; both bounds tend to $0$.'
          - problem: 'Evaluate $\lim_{x \to 0} x \cos\left(\frac{1}{x}\right)$.'
            answer: "0"
          - problem: 'Evaluate $\lim_{x \to \infty} \frac{\sin x}{x}$.'
            answer: "0"
            solution_sketch: '$-\frac{1}{x} \leq \frac{\sin x}{x} \leq \frac{1}{x}$ for $x > 0$, and both bounds tend to $0$.'
        constraints: "a factor bounded between -1 and 1 times a factor tending to 0; answer is always 0"
      - id: kp3
        name: Know when squeezing is needed (and when nothing works)
        key_prerequisites: [limit-laws, trig-graphs-basic]
        exemplars:
          - problem: 'Evaluate $\lim_{x \to 0} x^4 \cos\left(\frac{2}{x}\right)$.'
            answer: "0"
          - problem: "Evaluate the limit lim_{x->0} cos(1/x), or state that it does not exist."
            answer: "DNE"
            answer_contract: {"kind": "label", "options": [["DNE"], ["0"], ["1"], ["-1"]]}
            solution_sketch: "The object is lim cos(1/x) as x goes to 0. Near 0 the cosine takes values arbitrarily close to 1 and to -1, so no single limit exists. The option 0 would require a vanishing factor, but there is none. The options 1 and -1 are oscillation values, not the limit. Therefore the limit is DNE."
          - problem: "Evaluate the limit lim_{x->0} x^5 sin(1/x)."
            answer: "0"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The object is lim x^5 sin(1/x) as x goes to 0. Boundedness gives -1 <= sin(1/x) <= 1. Multiply by x^5: -x^5 <= x^5 sin(1/x) <= x^5. Squeeze theorem: both bounds tend to 0. So the limit is 0."
          - problem: "Evaluate the limit lim_{x->0} (1 + x^2 cos(1/x))."
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The object is lim (1 + x^2 cos(1/x)) as x goes to 0. Boundedness gives -1 <= cos(1/x) <= 1. Multiply by x^2: -x^2 <= x^2 cos(1/x) <= x^2. Add 1: 1 - x^2 <= 1 + x^2 cos(1/x) <= 1 + x^2. Squeeze theorem: both bounds tend to 1. So the limit is 1."
          - problem: "Evaluate the limit lim_{x->0} (2 + x^3 sin(1/x))."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The object is lim (2 + x^3 sin(1/x)) as x goes to 0. Boundedness gives -1 <= sin(1/x) <= 1. Multiply by x^3: -x^3 <= x^3 sin(1/x) <= x^3. Add 2: 2 - x^3 <= 2 + x^3 sin(1/x) <= 2 + x^3. Squeeze theorem: both bounds tend to 2. So the limit is 2."
          - problem: "Evaluate the limit lim_{x->0} (x^4 cos(1/x) - 1)."
            answer: "-1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The object is lim (x^4 cos(1/x) - 1) as x goes to 0. Boundedness gives -1 <= cos(1/x) <= 1. Multiply by x^4: -x^4 <= x^4 cos(1/x) <= x^4. Subtract 1: -1 - x^4 <= x^4 cos(1/x) - 1 <= -1 + x^4. Squeeze theorem: both bounds tend to -1. So the limit is -1."
        constraints: "contrast a bare oscillation (DNE) with a squeezed product (0)"
    diagnostic_exemplar:
      problem: 'Evaluate $\lim_{x \to 0} x^2 \sin\left(\frac{3}{x}\right)$.'
      answer: "0"
      solution_sketch: '$|\sin(3/x)| \leq 1$, so $-x^2 \leq x^2\sin(3/x) \leq x^2$; both bounds tend to $0$, and the squeeze theorem forces the limit to $0$.'
    anki_seeds:
      - front: "Squeeze theorem: if g ≤ f ≤ h near a and lim g = lim h = L, then..."
        back: "lim_{x→a} f(x) = L"
        type: basic
      - front: "lim_{x→0} x²·sin(1/x) = 0 because..."
        back: "sin is bounded by ±1, so the product is squeezed between -x² and x²"
        type: basic

  - id: special-trig-limits
    name: Special Trigonometric Limits
    core: true
    difficulty: 0.62
    drill: false
    answer_kind: numeric
    expected_time_secs: 150
    prerequisites:
      - id: squeeze-theorem
        weight: 0.6
        key: true
      - id: limit-laws
        weight: 0.5
        key: true
      - id: radians-degrees
        weight: 0.4
      - id: pythagorean-identity
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: The two fundamental limits
        key_prerequisites: [squeeze-theorem, limit-laws]
        exemplars:
          - problem: 'Evaluate $\lim_{x \to 0} \frac{\sin x}{x}$ (with $x$ in radians).'
            answer: "1"
          - problem: 'Evaluate $\lim_{x \to 0} \frac{1 - \cos x}{x}$.'
            answer: "0"
            solution_sketch: 'Multiply by $\frac{1 + \cos x}{1 + \cos x}$: $\frac{\sin^2 x}{x(1 + \cos x)} = \frac{\sin x}{x} \cdot \frac{\sin x}{1 + \cos x} \to 1 \cdot \frac{0}{2} = 0$.'
          - problem: 'Evaluate $\lim_{x \to 0} \frac{x}{\sin x}$.'
            answer: "1"
          - problem: "Evaluate $\\lim_{x \\to 0} \\frac{\\sin x}{2x}$ with $x$ in radians. Give the answer as a fraction."
            answer: "1/2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Write the object as $L = \\lim_{x \\to 0} \\frac{\\sin x}{2x}$. Use the limit law for a constant multiple to write $L = \\frac{1}{2} \\lim_{x \\to 0} \\frac{\\sin x}{x}$. The fundamental limit gives $\\lim_{x \\to 0} \\frac{\\sin x}{x} = 1$. Therefore the limit is 1/2."
          - problem: "Evaluate $\\lim_{x \\to 0} \\frac{2x}{\\sin x}$ with $x$ in radians."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Write the object as $L = \\lim_{x \\to 0} \\frac{2x}{\\sin x}$. Use the limit law for a constant multiple to write $L = 2 \\lim_{x \\to 0} \\frac{x}{\\sin x}$. The reciprocal of the fundamental limit gives $\\lim_{x \\to 0} \\frac{x}{\\sin x} = 1$. Therefore the limit is 2."
          - problem: "Evaluate $\\lim_{x \\to 0} \\frac{\\sin x}{5x}$ with $x$ in radians. Give the answer as a fraction."
            answer: "1/5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Write the object as $L = \\lim_{x \\to 0} \\frac{\\sin x}{5x}$. Use the limit law for a constant multiple to write $L = \\frac{1}{5} \\lim_{x \\to 0} \\frac{\\sin x}{x}$. The fundamental limit gives $\\lim_{x \\to 0} \\frac{\\sin x}{x} = 1$. Therefore the limit is 1/5."
        constraints: "radians only; the two memorized limits and their reciprocals"
      - id: kp2
        name: Rescale the argument
        key_prerequisites: [limit-laws, squeeze-theorem]
        exemplars:
          - problem: 'Evaluate $\lim_{x \to 0} \frac{\sin(3x)}{x}$.'
            answer: "3"
            solution_sketch: 'Write $\frac{\sin(3x)}{x} = 3 \cdot \frac{\sin(3x)}{3x} \to 3 \cdot 1$.'
          - problem: 'Evaluate $\lim_{x \to 0} \frac{\sin(4x)}{7x}$.'
            answer: "4/7"
          - problem: 'Evaluate $\lim_{x \to 0} \frac{\sin(5x)}{\sin(2x)}$.'
            answer: "5/2"
            solution_sketch: '$\frac{\sin(5x)}{5x} \cdot \frac{2x}{\sin(2x)} \cdot \frac{5}{2} \to 1 \cdot 1 \cdot \frac{5}{2}$.'
          - problem: "Evaluate $\\lim_{x \\to 0} \\frac{\\sin(7x)}{3x}$."
            answer: "7/3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Start with the full limit $\\lim_{x \\to 0} \\frac{\\sin(7x)}{3x}$. Rescale by writing $\\frac{7}{3}\\cdot\\frac{\\sin(7x)}{7x}$; this uses the constant-factor limit law. As $x \\to 0$, the argument $7x \\to 0$, so $\\frac{\\sin(7x)}{7x} \\to 1$ by the special sine limit. The product is 7/3, so the limit is 7/3."
          - problem: "Evaluate $\\lim_{x \\to 0} \\frac{\\sin(5x)}{\\sin(9x)}$."
            answer: "5/9"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Start with the full limit $\\lim_{x \\to 0} \\frac{\\sin(5x)}{\\sin(9x)}$. Rescale the numerator and denominator by writing $\\frac{5}{9}\\cdot\\frac{\\sin(5x)}{5x}\\cdot\\frac{9x}{\\sin(9x)}$; this uses multiplication by a form of 1. As $x \\to 0$, both $5x$ and $9x$ go to 0, so each special sine quotient tends to 1. The product is 5/9, so the limit is 5/9."
          - problem: "Evaluate $\\lim_{x \\to 0} \\frac{\\tan(8x)}{4x}$."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Start with the full limit $\\lim_{x \\to 0} \\frac{\\tan(8x)}{4x}$. Rescale by writing $\\frac{8}{4}\\cdot\\frac{\\tan(8x)}{8x}$; this uses the constant-factor limit law. As $x \\to 0$, $8x \\to 0$, so $\\frac{\\tan(8x)}{8x} \\to 1$ by the special tangent limit. The product is 2, so the limit is 2."
        constraints: "arguments ax with small integer a; answers are ratios of the coefficients"
      - id: kp3
        name: Combine with algebra and identities
        key_prerequisites: [limit-laws, pythagorean-identity]
        exemplars:
          - problem: 'Evaluate $\lim_{x \to 0} \frac{\tan x}{x}$.'
            answer: "1"
            solution_sketch: '$\frac{\tan x}{x} = \frac{\sin x}{x} \cdot \frac{1}{\cos x} \to 1 \cdot 1$.'
          - problem: 'Evaluate $\lim_{x \to 0} \frac{\sin x}{x^2 + x}$.'
            answer: "1"
            solution_sketch: 'Factor: $\frac{\sin x}{x(x + 1)} = \frac{\sin x}{x} \cdot \frac{1}{x + 1} \to 1 \cdot 1$.'
          - problem: 'Evaluate $\lim_{x \to 0} \frac{1 - \cos x}{x^2}$.'
            answer: "1/2"
            solution_sketch: 'Conjugate trick: $\frac{\sin^2 x}{x^2(1 + \cos x)} = \left(\frac{\sin x}{x}\right)^2 \frac{1}{1 + \cos x} \to \frac{1}{2}$.'
          - problem: "Evaluate lim_{x->0} (tan(5x))/(2x). Give the answer as a fraction."
            answer: "5/2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (rewrite): The full limit is lim_{x->0} (tan(5x))/(2x). Write tan(5x) as sin(5x)/cos(5x), so the expression is (sin(5x)/(5x)) * (5/2) * (1/cos(5x)). Step 2 (fundamental limit): sin(5x)/(5x) tends to 1 as x tends to 0. Step 3 (limit laws): cos(5x) tends to 1, so the product tends to 1 * (5/2) * 1. The value is 5/2."
          - problem: "Evaluate lim_{x->0} (sin(3x))/(x(2x+1))."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (factor): The full limit is lim_{x->0} (sin(3x))/(x(2x+1)). Factor x from the denominator to write (sin(3x))/(3x) times 3/(2x+1). Step 2 (fundamental limit): sin(3x)/(3x) tends to 1. Step 3 (limit laws): 3/(2x+1) tends to 3, so the product tends to 3. The value is 3."
          - problem: "Evaluate lim_{x->0} (1 - cos(2x))/(x sin(3x)). Give the answer as a fraction."
            answer: "2/3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (conjugate): The full limit is lim_{x->0} (1 - cos(2x))/(x sin(3x)). Multiply the numerator and denominator by 1 + cos(2x), giving sin^2(2x) / (x sin(3x) (1 + cos(2x))). Step 2 (fundamental limits): Rewrite this as [4x^2 (sin(2x)/(2x))^2] / [3x^2 (sin(3x)/(3x)) (1 + cos(2x))]. The factors sin(2x)/(2x) and sin(3x)/(3x) tend to 1. Step 3 (limit laws): The ratio tends to (4/3) * 1/(1 + 1). The value is 2/3."
        constraints: "reduce to the fundamental limits via factoring, tan = sin/cos, or the conjugate of 1 - cos"
    diagnostic_exemplar:
      problem: 'Evaluate $\lim_{x \to 0} \frac{\tan(3x)}{x}$.'
      answer: "3"
      solution_sketch: 'Split off the special limit: $\frac{\tan(3x)}{x} = 3 \cdot \frac{\sin(3x)}{3x} \cdot \frac{1}{\cos(3x)} \to 3 \cdot 1 \cdot 1$.'
    anki_seeds:
      - front: "lim_{x→0} (sin x)/x = ? and lim_{x→0} (1 - cos x)/x = ? (radians)"
        back: "1 and 0"
        type: basic
      - front: "lim_{x→0} sin(ax)/(bx) = ?"
        back: "a/b"
        type: basic
      - front: "lim_{x→0} (1 - cos x)/x² = ?"
        back: "1/2"
        type: basic

