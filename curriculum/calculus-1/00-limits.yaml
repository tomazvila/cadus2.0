        weight: 0.8
        key: true
      - id: simplifying-radicals-variables
        weight: 0.5
        key: true
      - id: absolute-value
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: Factor x out of a square root (x → ∞)
        key_prerequisites: [limits-at-infinity-rational, simplifying-radicals-variables]
        exemplars:
          - problem: 'Find $\lim_{x \to \infty} \frac{\sqrt{4x^2 + 1}}{x}$.'
            answer: '2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'For large positive $x$, $\sqrt{4x^2 + 1} = x\sqrt{4 + \frac{1}{x^2}}$. Dividing by $x$ leaves $\sqrt{4 + \frac{1}{x^2}}$, which tends to $\sqrt{4} = 2$.'
          - problem: 'Find $\lim_{x \to \infty} \frac{\sqrt{9x^2 + x}}{2x}$.'
            answer: '3/2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Factor $x^2$ out of the root: $\sqrt{9x^2 + x} = x\sqrt{9 + \frac{1}{x}}$ for $x > 0$. The quotient becomes $\frac{\sqrt{9 + 1/x}}{2}$, which tends to $\frac{\sqrt{9}}{2} = \frac{3}{2}$.'
          - problem: 'Find $\lim_{x \to \infty} \frac{\sqrt{9x^2 + 2x + 1}}{x + 3}$.'
            answer: '3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Divide the numerator and the denominator by $x$. The numerator becomes $\sqrt{9 + \frac{2}{x} + \frac{1}{x^2}}$, which tends to $3$, and the denominator becomes $1 + \frac{3}{x}$, which tends to $1$. The limit is $\frac{3}{1} = 3$.'
          - problem: 'A drone starts $6$ km east of a tower and flies north at $5$ km/h. After $t$ hours its distance from the tower is $\sqrt{25t^2 + 36}$ km. What does the average speed $\frac{\sqrt{25t^2 + 36}}{t}$ approach as $t$ grows without bound?'
            answer: '5'
            answer_contract: {"kind":"unit","quantity":"speed","unit":"km/h","allow_omitted":true}
            solution_sketch: 'For $t > 0$, $\sqrt{25t^2 + 36} = t\sqrt{25 + \frac{36}{t^2}}$. The average speed is $\sqrt{25 + \frac{36}{t^2}}$, which tends to $\sqrt{25} = 5$ km/h, the speed of the drone.'
          - problem: 'Find $\lim_{x \to \infty} \frac{\sqrt{16x^2 + 5x + 2}}{4x}$.'
            answer: '1'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'For $x > 0$, $\sqrt{16x^2 + 5x + 2} = x\sqrt{16 + \frac{5}{x} + \frac{2}{x^2}}$. The quotient is $\frac{\sqrt{16 + 5/x + 2/x^2}}{4}$, which tends to $\frac{\sqrt{16}}{4} = 1$.'
          - problem: 'Find $\lim_{x \to \infty} \frac{5x + 2}{\sqrt{9x^2 + 1}}$.'
            answer: '5/3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Divide the numerator and the denominator by $x$. The numerator becomes $5 + \frac{2}{x}$, which tends to $5$. For $x > 0$ the denominator becomes $\sqrt{9 + \frac{1}{x^2}}$, which tends to $3$. The limit is $\frac{5}{3}$.'
          - problem: 'The total cost of making $x$ items is $\sqrt{49x^2 + x}$ dollars. What does the cost per item approach as $x$ grows without bound?'
            answer: '7'
            answer_contract: {"kind":"unit","quantity":"dollar","unit":"dollar","allow_omitted":true}
            solution_sketch: 'The cost per item is $\frac{\sqrt{49x^2 + x}}{x}$. For $x > 0$ this equals $\sqrt{49 + \frac{1}{x}}$, which tends to $\sqrt{49} = 7$ dollars per item.'
        constraints: "leading coefficient under the root is a perfect square; x → +∞ only"
      - id: kp2
        name: The sign trap as x → -∞
        key_prerequisites: [limits-at-infinity-rational, simplifying-radicals-variables]
        exemplars:
          - problem: 'Find $\lim_{x \to -\infty} \frac{\sqrt{4x^2 + 1}}{x}$.'
            answer: '-2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'For $x < 0$, $\sqrt{4x^2 + 1} = |x|\sqrt{4 + \frac{1}{x^2}} = -x\sqrt{4 + \frac{1}{x^2}}$. Dividing by $x$ gives $-\sqrt{4 + \frac{1}{x^2}}$, which tends to $-2$.'
          - problem: 'Find $\lim_{x \to -\infty} \frac{\sqrt{x^2 + 3}}{x + 1}$.'
            answer: '-1'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'For $x < 0$ the root equals $-x\sqrt{1 + \frac{3}{x^2}}$. Dividing the numerator and the denominator by $x$ gives $\frac{-\sqrt{1 + 3/x^2}}{1 + 1/x}$, which tends to $\frac{-1}{1} = -1$.'
          - problem: 'Find $\lim_{x \to -\infty} \frac{\sqrt{4x^2 + 9}}{3x}$.'
            answer: '-2/3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'For $x < 0$, $\sqrt{4x^2 + 9} = -x\sqrt{4 + \frac{9}{x^2}}$. The quotient is $-\frac{\sqrt{4 + 9/x^2}}{3}$, which tends to $-\frac{2}{3}$.'
          - problem: 'The point $P = \left(x, \sqrt{16x^2 + 7}\right)$ lies on the upper branch of a hyperbola. As $P$ moves far to the left, so that $x \to -\infty$, the slope of the line through the origin and $P$ approaches a number. Find it.'
            answer: '-4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The slope is $\frac{\sqrt{16x^2 + 7}}{x}$. For $x < 0$ the root equals $-x\sqrt{16 + \frac{7}{x^2}}$, so the slope is $-\sqrt{16 + \frac{7}{x^2}}$, which tends to $-4$. The slope is negative because $P$ lies above the axis and to the left.'
          - problem: 'What is the value of $\lim_{x \to -\infty} \frac{\sqrt{9x^2 + 4}}{x}$?'
            answer: '-3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'For $x < 0$, $\sqrt{9x^2} = 3|x| = -3x$, not $3x$. So the quotient tends to $\frac{-3x}{x} = -3$. Because $x$ is negative, the sign flips.'
          - problem: 'The limit $\lim_{x \to -\infty} \frac{\sqrt{a x^2 + 1}}{x}$ equals $-5$ for a positive constant $a$. Find $a$.'
            answer: '25'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'For $x < 0$ the limit equals $-\sqrt{a}$. Setting $-\sqrt{a} = -5$ gives $\sqrt{a} = 5$, so $a = 25$.'
          - problem: 'Find $\lim_{x \to -\infty} \frac{\sqrt{x^2 + 5x}}{2x}$.'
            answer: '-1/2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'For $x < 0$, $\sqrt{x^2 + 5x} = -x\sqrt{1 + \frac{5}{x}}$. The quotient is $-\frac{\sqrt{1 + 5/x}}{2}$, which tends to $-\frac{1}{2}$.'
          - problem: 'The point $Q = \left(x, -\sqrt{9x^2 + 5}\right)$ lies on the lower branch of a hyperbola. As $Q$ moves far to the left, so that $x \to -\infty$, the slope of the line through the origin and $Q$ approaches a number. Find it.'
            answer: '3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The slope is $\frac{-\sqrt{9x^2 + 5}}{x}$. For $x < 0$ the root equals $-x\sqrt{9 + \frac{5}{x^2}}$, so the slope is $\sqrt{9 + \frac{5}{x^2}}$, which tends to $3$. The slope is positive because $Q$ lies below and to the left of the origin.'
        constraints: "x → -∞; the student must replace √(x²) by -x, producing the negative of the naive answer"
      - id: kp3
        name: Conjugates at infinity
        key_prerequisites: [limits-at-infinity-rational]
        exemplars:
          - problem: 'Find $\lim_{x \to \infty} \left(\sqrt{x^2 + 6x} - x\right)$.'
            answer: '3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Multiply by $\frac{\sqrt{x^2+6x}+x}{\sqrt{x^2+6x}+x}$ to get $\frac{6x}{\sqrt{x^2+6x}+x}$. Divide the numerator and the denominator by $x$: $\frac{6}{\sqrt{1 + 6/x}+1}$, which tends to $\frac{6}{2} = 3$.'
          - problem: 'Find $\lim_{x \to \infty} \left(\sqrt{x^2 + 4} - x\right)$.'
            answer: '0'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Multiply by the conjugate to get $\frac{4}{\sqrt{x^2+4}+x}$. The denominator grows without bound as $x \to \infty$, so the quotient tends to $0$.'
          - problem: 'Find $\lim_{x \to \infty} \left(\sqrt{x^2 + 2x} - x\right)$.'
            answer: '1'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Multiplying by the conjugate gives $\frac{2x}{\sqrt{x^2+2x}+x}$. Dividing by $x$ gives $\frac{2}{\sqrt{1 + 2/x}+1}$, which tends to $\frac{2}{2} = 1$.'
          - problem: 'Find $\lim_{x \to \infty} \left(x - \sqrt{x^2 - 10x}\right)$.'
            answer: '5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Multiply by $\frac{x + \sqrt{x^2-10x}}{x + \sqrt{x^2-10x}}$. The numerator becomes $x^2 - (x^2 - 10x) = 10x$. Dividing by $x$ gives $\frac{10}{1 + \sqrt{1 - 10/x}}$, which tends to $\frac{10}{2} = 5$.'
          - problem: 'A field is $x$ metres long and $10$ metres wide. One walker goes along the length and then across the width. A second walker goes straight along the diagonal. By how many metres is the diagonal route shorter when $x$ grows without bound?'
            answer: '10'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'The difference of the two routes is $x + 10 - \sqrt{x^2 + 100}$. Since $\sqrt{x^2+100} - x = \frac{100}{\sqrt{x^2+100}+x} \to 0$, the difference tends to $10 - 0 = 10$ metres. A very long field makes the diagonal almost as long as the length alone.'
          - problem: 'Find $\lim_{x \to \infty} \left(\sqrt{4x^2 + x} - 2x\right)$.'
            answer: '1/4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Multiply by the conjugate to get $\frac{x}{\sqrt{4x^2+x}+2x}$. Dividing by $x$ gives $\frac{1}{\sqrt{4 + 1/x}+2}$, which tends to $\frac{1}{2+2} = \frac{1}{4}$.'
          - problem: 'Find $\lim_{x \to \infty} \left(\sqrt{x^2 + 14x} - \sqrt{x^2 + 6x}\right)$.'
            answer: '4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Multiply by the conjugate sum. The numerator becomes $(x^2+14x) - (x^2+6x) = 8x$. Dividing by $x$ gives $\frac{8}{\sqrt{1+14/x}+\sqrt{1+6/x}}$, which tends to $\frac{8}{2} = 4$.'
          - problem: 'A cable runs from the top of a $9$ m pole to a point on the ground $x$ metres from the foot of the pole, so its length is $\sqrt{x^2 + 81}$ metres. By how many metres does the cable exceed $x$ metres when $x$ grows without bound?'
            answer: '0'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'The extra length is $\sqrt{x^2 + 81} - x = \frac{81}{\sqrt{x^2+81}+x}$. The denominator grows without bound, so the extra length tends to $0$ metres. For a far point the cable is nearly horizontal.'
          - problem: 'The limit $\lim_{x \to \infty} \left(\sqrt{x^2 + ax} - x\right)$ equals $6$. Find $a$.'
            answer: '12'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The conjugate method gives $\lim_{x \to \infty} \left(\sqrt{x^2 + ax} - x\right) = \frac{a}{2}$. Setting $\frac{a}{2} = 6$ gives $a = 12$.'
        constraints: "∞ - ∞ form; conjugate multiplication yields (linear or constant)/(two growing roots); answers are b/2 for x² + bx, 0 for x² + c"
    diagnostic_exemplar:
      problem: 'Evaluate $\lim_{x \to \infty} \left(\sqrt{x^2 + 8x} - x\right)$.'
      answer: "4"
      solution_sketch: 'Multiply by the conjugate: $\sqrt{x^2+8x} - x = \frac{8x}{\sqrt{x^2+8x} + x}$; dividing top and bottom by $x$ gives $\frac{8}{\sqrt{1 + 8/x} + 1} \to \frac{8}{2} = 4$.'
    anki_seeds:
      - front: "√(x²) equals..."
        back: "|x| — which is -x when x < 0 (the key trap in limits as x → -∞)"
        type: basic
      - front: "lim_{x→∞} (√(x² + bx) - x) = ?"
        back: "b/2 (multiply by the conjugate)"
        type: basic

  - id: squeeze-theorem
    name: The Squeeze Theorem
    core: true
    difficulty: 0.58
    drill: false
    answer_kind: numeric
    expected_time_secs: 120
    prerequisites:
      - id: limit-laws
        weight: 0.7
        key: true
      - id: trig-graphs-basic
        weight: 0.4
      - id: compound-inequalities
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: Apply the squeeze theorem to given bounds
        key_prerequisites: [limit-laws, compound-inequalities]
        exemplars:
          - problem: 'Suppose $4 - x^2 \leq g(x) \leq 4 + x^2$ for all $x \neq 0$. Find $\lim_{x \to 0} g(x)$.'
            answer: '4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Both bounds tend to $4$ as $x \to 0$: $4 - x^2 \to 4$ and $4 + x^2 \to 4$. Since $g(x)$ lies between them, the squeeze theorem gives $\lim_{x \to 0} g(x) = 4$.'
          - problem: 'Suppose $2x \leq f(x) \leq x^2 + 1$ for all $x$ near $1$. Find $\lim_{x \to 1} f(x)$.'
            answer: '2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'As $x \to 1$ the lower bound $2x$ tends to $2$ and the upper bound $x^2 + 1$ tends to $2$. The function $f$ is squeezed between them, so $f(x) \to 2$.'
          - problem: 'Suppose $\cos x \leq f(x) \leq 1 + x^2$ for all $x$ near $0$. Find $\lim_{x \to 0} f(x)$.'
            answer: '1'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'As $x \to 0$ the lower bound $\cos x$ tends to $1$ and the upper bound $1 + x^2$ tends to $1$. The squeeze theorem gives $\lim_{x \to 0} f(x) = 1$.'
          - problem: 'Suppose $5 - (x-2)^2 \leq f(x) \leq 5 + (x-2)^2$ for all $x$ near $2$. Find $\lim_{x \to 2} f(x)$.'
            answer: '5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'As $x \to 2$, $(x-2)^2 \to 0$, so both bounds tend to $5$. The squeeze theorem then gives $\lim_{x \to 2} f(x) = 5$.'
          - problem: 'The length $L$ of a metal rod, in centimetres, at temperature $T$ degrees satisfies $50 - 0.01(T - 20)^2 \leq L(T) \leq 50 + 0.01(T - 20)^2$ for $T$ near $20$. What length does the rod approach as $T \to 20$?'
            answer: '50'
            answer_contract: {"kind":"unit","quantity":"length","unit":"cm","allow_omitted":true}
            solution_sketch: 'As $T \to 20$ the term $0.01(T-20)^2$ tends to $0$, so both bounds tend to $50$. The squeeze theorem gives $L(T) \to 50$, so the rod approaches a length of $50$ centimetres.'
          - problem: 'Suppose $-1 \leq f(x) \leq x^2 + 2x$ for all $x$ near $-1$. Find $\lim_{x \to -1} f(x)$.'
            answer: '-1'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The lower bound is the constant $-1$. At $x = -1$ the upper bound is $(-1)^2 + 2(-1) = -1$, so it tends to $-1$ as well. The squeeze theorem gives $\lim_{x \to -1} f(x) = -1$.'
          - problem: 'Suppose $0 \leq f(x) \leq (x-1)^2$ for all $x$ near $1$. Find $\lim_{x \to 1} f(x)$.'
            answer: '0'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The lower bound is the constant $0$. The upper bound $(x-1)^2$ tends to $0$ as $x \to 1$. Since $f(x)$ lies between them, the squeeze theorem gives $\lim_{x \to 1} f(x) = 0$.'
          - problem: 'The time $T(c)$ in seconds that a pump needs to fill a tank at setting $c$ satisfies $90 - (c - 5)^2 \leq T(c) \leq 90 + (c - 5)^2$ for $c$ near $5$. What time does $T(c)$ approach as $c \to 5$?'
            answer: '90'
            answer_contract: {"kind":"unit","quantity":"time","unit":"s","allow_omitted":true}
            solution_sketch: 'As $c \to 5$ the term $(c-5)^2$ tends to $0$, so both bounds tend to $90$. The squeeze theorem gives $T(c) \to 90$, so the fill time approaches $90$ seconds.'
          - problem: 'Suppose $|f(x) - 3| \leq 2|x - 1|$ for all $x$. Find $\lim_{x \to 1} f(x)$.'
            answer: '3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The inequality means $3 - 2|x-1| \leq f(x) \leq 3 + 2|x-1|$. Both bounds tend to $3$ as $x \to 1$, so the squeeze theorem gives $\lim_{x \to 1} f(x) = 3$.'
          - problem: 'Suppose $x^2 \leq f(x) \leq x$ for all $x$ in the interval $(0, 1)$. Does the squeeze theorem determine $\lim_{x \to 1/2} f(x)$?'
            answer: 'no'
            answer_contract: {"kind":"label","options":[["yes","it does","it determines the limit"],["no","it does not","it gives no value"]]}
            solution_sketch: 'At $x = \frac{1}{2}$ the lower bound $x^2$ tends to $\frac{1}{4}$ and the upper bound $x$ tends to $\frac{1}{2}$. The two bounds have different limits, so the squeeze theorem gives no value for $\lim_{x \to 1/2} f(x)$.'
        constraints: 'both bounds have the same limit at the target point (or the bounds differ and no limit follows); bounds are polynomials, trigonometric or absolute-value expressions'
      - id: kp2
        name: Bounded factor times a vanishing factor
        key_prerequisites: [limit-laws, trig-graphs-basic]
        exemplars:
          - problem: 'Find $\lim_{x \to 0} x^2 \sin\left(\frac{1}{x}\right)$.'
            answer: '0'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Since $-1 \leq \sin\left(\frac{1}{x}\right) \leq 1$, multiplying by $x^2 \geq 0$ gives $-x^2 \leq x^2\sin\left(\frac{1}{x}\right) \leq x^2$. Both bounds tend to $0$, so the squeeze theorem gives $0$.'
          - problem: 'To find $\lim_{x \to \infty} \frac{\cos 3x}{x}$, start from $-1 \leq \cos 3x \leq 1$ and divide by $x > 0$ to get $-\frac{1}{x} \leq \frac{\cos 3x}{x} \leq h(x)$. What is $h(x)$?'
            answer: '1/x'
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'Dividing every part of $-1 \leq \cos 3x \leq 1$ by the positive number $x$ keeps the order of the inequalities. The upper bound is therefore $h(x) = \frac{1}{x}$, and both bounds tend to $0$.'
          - problem: 'Find $\lim_{x \to \infty} \frac{x + \sin x}{x}$.'
            answer: '1'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Write the quotient as $1 + \frac{\sin x}{x}$. Since $-\frac{1}{x} \leq \frac{\sin x}{x} \leq \frac{1}{x}$ for $x > 0$ and both bounds tend to $0$, $\frac{\sin x}{x} \to 0$. The limit is $1 + 0 = 1$.'
          - problem: 'A runner''s distance after $t$ seconds is $s(t) = 5t + \sin t$ metres. What does the average speed $\frac{s(t)}{t}$ approach as $t$ grows without bound?'
            answer: '5'
            answer_contract: {"kind":"unit","quantity":"speed","unit":"m/s","allow_omitted":true}
            solution_sketch: 'The average speed is $5 + \frac{\sin t}{t}$. Since $\left|\frac{\sin t}{t}\right| \leq \frac{1}{t} \to 0$, the squeeze theorem gives $\frac{\sin t}{t} \to 0$. The average speed approaches $5$ metres per second.'
          - problem: 'Find $\lim_{x \to 0} x \cos\left(\frac{1}{x}\right)$.'
            answer: '0'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Since $-1 \leq \cos\left(\frac{1}{x}\right) \leq 1$, we get $-|x| \leq x\cos\left(\frac{1}{x}\right) \leq |x|$. Both bounds tend to $0$ as $x \to 0$, so the limit is $0$.'
          - problem: 'Find $\lim_{x \to \infty} \frac{\sin x}{x}$.'
            answer: '0'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'For $x > 0$ the bound $-1 \leq \sin x \leq 1$ gives $-\frac{1}{x} \leq \frac{\sin x}{x} \leq \frac{1}{x}$. Both bounds tend to $0$ as $x \to \infty$, so the squeeze theorem gives $0$.'
          - problem: 'A damped pendulum has displacement $d(t) = \frac{8\cos 2t}{t}$ centimetres at time $t$ seconds. What displacement does it approach as $t$ grows without bound?'
            answer: '0'
            answer_contract: {"kind":"unit","quantity":"length","unit":"cm","allow_omitted":true}
            solution_sketch: 'Since $-1 \leq \cos 2t \leq 1$, for $t > 0$ we get $-\frac{8}{t} \leq d(t) \leq \frac{8}{t}$. Both bounds tend to $0$, so the displacement approaches $0$ centimetres.'
          - problem: 'Suppose $|f(x)| \leq 5$ for all $x$ near $1$. Find $\lim_{x \to 1} f(x)(x - 1)^2$.'
            answer: '0'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The bound $|f(x)| \leq 5$ gives $-5(x-1)^2 \leq f(x)(x-1)^2 \leq 5(x-1)^2$. Both bounds tend to $0$ as $x \to 1$, so the limit is $0$.'
          - problem: 'To find $\lim_{x \to 0} x^2 \cos\left(\frac{1}{x}\right)$, start from $-1 \leq \cos\left(\frac{1}{x}\right) \leq 1$ and multiply by $x^2$ to get $g(x) \leq x^2\cos\left(\frac{1}{x}\right) \leq x^2$. What is $g(x)$?'
            answer: '-x^2'
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'Multiplying every part of $-1 \leq \cos\left(\frac{1}{x}\right) \leq 1$ by the nonnegative number $x^2$ keeps the order. The lower bound is therefore $g(x) = -x^2$, and both bounds tend to $0$ as $x \to 0$.'
          - problem: 'Suppose $|f(x)| \leq 5$ for all $x$ near $1$. To find $\lim_{x \to 1} f(x)(x - 1)^2$, multiply $-5 \leq f(x) \leq 5$ by $(x - 1)^2$ to get $g(x) \leq f(x)(x - 1)^2 \leq 5(x - 1)^2$. What is $g(x)$?'
            answer: '-5(x-1)^2'
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'Multiplying every part of $-5 \leq f(x) \leq 5$ by the nonnegative number $(x-1)^2$ keeps the order. The lower bound is $g(x) = -5(x-1)^2$, and both bounds tend to $0$ as $x \to 1$.'
        constraints: "a factor bounded between -1 and 1 times a factor tending to 0; answer is always 0"
      - id: kp3
        name: Know when squeezing is needed (and when nothing works)
        key_prerequisites: [limit-laws, trig-graphs-basic]
        exemplars:
          - problem: 'Find $\lim_{x \to 0} x^4 \cos\left(\frac{2}{x}\right)$.'
            answer: '0'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Since $-1 \leq \cos\left(\frac{2}{x}\right) \leq 1$, we get $-x^4 \leq x^4\cos\left(\frac{2}{x}\right) \leq x^4$. Both bounds tend to $0$, so the squeeze theorem gives $0$.'
          - problem: 'Does $\lim_{x \to 0} \cos\left(\frac{1}{x}\right)$ exist?'
            answer: 'no'
            answer_contract: {"kind":"label","options":[["yes","it does","it exists","yes it does","yes, it exists","the limit exists"],["no","it does not","it does not exist","DNE","does not exist","no, it does not exist","the limit does not exist"]]}
            solution_sketch: 'As $x \to 0$, $\frac{1}{x}$ grows without bound, so $\cos\left(\frac{1}{x}\right)$ keeps returning to $1$ and to $-1$ in every interval around $0$. No single number is approached, so the limit does not exist.'
          - problem: 'Find $\lim_{x \to 0} \left(1 + x^2 \cos\left(\frac{1}{x}\right)\right)$.'
            answer: '1'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The term $x^2\cos\left(\frac{1}{x}\right)$ lies between $-x^2$ and $x^2$, so it tends to $0$ by the squeeze theorem. The limit is $1 + 0 = 1$.'
          - problem: 'Find $\lim_{x \to 0} \left(2 + x^3 \sin\left(\frac{1}{x}\right)\right)$.'
            answer: '2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The term $x^3\sin\left(\frac{1}{x}\right)$ lies between $-|x|^3$ and $|x|^3$, so it tends to $0$ by the squeeze theorem. The limit is $2 + 0 = 2$.'
          - problem: 'The thickness of a coating at distance $x$ centimetres from an edge is $T(x) = 3 + x^3 \sin\left(\frac{1}{x}\right)$ centimetres. What thickness does the coating approach as $x \to 0$?'
            answer: '3'
            answer_contract: {"kind":"unit","quantity":"length","unit":"cm","allow_omitted":true}
            solution_sketch: 'The term $x^3\sin\left(\frac{1}{x}\right)$ lies between $-|x|^3$ and $|x|^3$, so it tends to $0$ by the squeeze theorem. The thickness approaches $3 + 0 = 3$ centimetres.'
          - problem: 'Find $\lim_{x \to 0} \left(x^4 \cos\left(\frac{1}{x}\right) - 1\right)$.'
            answer: '-1'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The term $x^4\cos\left(\frac{1}{x}\right)$ lies between $-x^4$ and $x^4$, so it tends to $0$ by the squeeze theorem. The limit is $0 - 1 = -1$.'
          - problem: 'What is the value of $\lim_{x \to 0} x^2 \cos\left(\frac{1}{x}\right)$?'
            answer: '0'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The function $\cos\left(\frac{1}{x}\right)$ alone has no limit, but the factor $x^2$ changes the situation. The product lies between $-x^2$ and $x^2$, and both bounds tend to $0$, so the limit is $0$.'
          - problem: 'Find $\lim_{x \to 0} \frac{x^2 \sin\left(\frac{1}{x}\right)}{\sin x}$.'
            answer: '0'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Write the quotient as $x \cdot \frac{x}{\sin x} \cdot \sin\left(\frac{1}{x}\right)$. The factor $\frac{x}{\sin x}$ tends to $1$, and $x\sin\left(\frac{1}{x}\right) \to 0$ by the squeeze theorem. The limit is $0$.'
          - problem: 'The height of a ripple at distance $r$ centimetres from its centre is $h(r) = 1 - r^2 \sin\left(\frac{3}{r}\right)$ centimetres. What height does the ripple approach as $r \to 0$?'
            answer: '1'
            answer_contract: {"kind":"unit","quantity":"length","unit":"cm","allow_omitted":true}
            solution_sketch: 'The term $r^2\sin\left(\frac{3}{r}\right)$ lies between $-r^2$ and $r^2$, so it tends to $0$ by the squeeze theorem. The height approaches $1 - 0 = 1$ centimetre.'
          - problem: 'Does $\lim_{x \to 0} x \sin\left(\frac{1}{x}\right)$ exist?'
            answer: 'yes'
            answer_contract: {"kind":"label","options":[["yes","it does","it exists","yes it does","yes, it exists","the limit exists"],["no","it does not","it does not exist","DNE","does not exist","no, it does not exist","the limit does not exist"]]}
            solution_sketch: 'Since $-1 \leq \sin\left(\frac{1}{x}\right) \leq 1$, we get $-|x| \leq x\sin\left(\frac{1}{x}\right) \leq |x|$. Both bounds tend to $0$, so the squeeze theorem shows that the limit exists and equals $0$.'
        constraints: "contrast a bare oscillation (DNE) with a squeezed product (0)"
    diagnostic_exemplar:
      problem: 'Evaluate $\lim_{x \to 0} x^2 \sin\left(\frac{3}{x}\right)$.'
      answer: "0"
      solution_sketch: '$|\sin(3/x)| \leq 1$, so $-x^2 \leq x^2\sin(3/x) \leq x^2$; both bounds tend to $0$, and the squeeze theorem forces the limit to $0$.'
    anki_seeds:
      - front: "Squeeze theorem: if g ≤ f ≤ h near a and lim g = lim h = L, then..."
        back: "lim_{x→a} f(x) = L"
        type: basic
      - front: "lim_{x→0} x²·sin(1/x) = 0 because..."
        back: "sin is bounded by ±1, so the product is squeezed between -x² and x²"
        type: basic

  - id: special-trig-limits
    name: Special Trigonometric Limits
    core: true
    difficulty: 0.62
    drill: false
    answer_kind: numeric
    expected_time_secs: 150
    prerequisites:
      - id: squeeze-theorem
        weight: 0.6
        key: true
      - id: limit-laws
        weight: 0.5
        key: true
      - id: radians-degrees
        weight: 0.4
      - id: pythagorean-identity
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: The two fundamental limits
        key_prerequisites: [squeeze-theorem, limit-laws]
        exemplars:
          - problem: 'Find $\lim_{x \to 0} \frac{\sin x}{x}$, where $x$ is measured in radians.'
            answer: '1'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'For small $x$ in radians, $\sin x$ is almost equal to $x$, so the ratio $\frac{\sin x}{x}$ is close to $1$. This is the first fundamental trigonometric limit, and it equals $1$.'
          - problem: 'Find $\lim_{x \to 0} \frac{1 - \cos x}{x}$.'
            answer: '0'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Multiply by $\frac{1 + \cos x}{1 + \cos x}$ to get $\frac{\sin^2 x}{x(1 + \cos x)} = \frac{\sin x}{x} \cdot \frac{\sin x}{1 + \cos x}$. The first factor tends to $1$ and the second tends to $\frac{0}{2} = 0$, so the limit is $0$.'
          - problem: 'Find $\lim_{x \to 0} \frac{2x}{\sin x}$.'
            answer: '2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Write $\frac{2x}{\sin x} = 2 \cdot \frac{x}{\sin x}$. The reciprocal $\frac{x}{\sin x}$ tends to $\frac{1}{1} = 1$, so the limit is $2 \cdot 1 = 2$.'
          - problem: 'Find $\lim_{x \to 0} \frac{\sin x}{5x}$.'
            answer: '1/5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Write $\frac{\sin x}{5x} = \frac{1}{5} \cdot \frac{\sin x}{x}$. The second factor tends to $1$, so the limit is $\frac{1}{5} \cdot 1 = \frac{1}{5}$.'
          - problem: 'On a circle of radius $1$, an arc subtends an angle of $\theta$ radians, so the arc has length $\theta$. The chord joining the ends of the arc has length $2\sin\left(\frac{\theta}{2}\right)$. What does the ratio of the chord length to the arc length approach as $\theta \to 0$?'
            answer: '1'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The ratio is $\frac{2\sin(\theta/2)}{\theta} = \frac{\sin(\theta/2)}{\theta/2}$. As $\theta \to 0$ the angle $\frac{\theta}{2}$ also tends to $0$, so the ratio tends to $1$. A very short arc is almost straight.'
          - problem: 'A point starts at the bottom of a wheel of radius $1$ metre and turns through $\theta$ radians, so it travels $\theta$ metres along the rim. Its height above the bottom is then $1 - \cos\theta$ metres. What does the ratio of the height to the distance travelled along the rim approach as $\theta \to 0$?'
            answer: '0'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The ratio is $\frac{1 - \cos\theta}{\theta}$. The second fundamental limit says it tends to $0$ as $\theta \to 0$. Near the bottom the point rises far less than it travels along the rim.'
          - problem: 'Find $\lim_{x \to 0} \frac{x \cos x}{\sin x}$.'
            answer: '1'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Write $\frac{x\cos x}{\sin x} = \cos x \cdot \frac{x}{\sin x}$. As $x \to 0$, $\cos x \to 1$ and $\frac{x}{\sin x} \to 1$, so the limit is $1 \cdot 1 = 1$.'
        constraints: "radians only; the two memorized limits and their reciprocals"
      - id: kp2
        name: Rescale the argument
        key_prerequisites: [limit-laws, squeeze-theorem]
        exemplars:
          - problem: 'Find $\lim_{x \to 0} \frac{\sin 3x}{x}$.'
            answer: '3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Write $\frac{\sin 3x}{x} = 3 \cdot \frac{\sin 3x}{3x}$. As $x \to 0$, $3x \to 0$, so $\frac{\sin 3x}{3x} \to 1$ and the limit is $3 \cdot 1 = 3$.'
          - problem: 'Find $\lim_{x \to 0} \frac{\sin 4x}{7x}$.'
            answer: '4/7'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Write $\frac{\sin 4x}{7x} = \frac{4}{7} \cdot \frac{\sin 4x}{4x}$. The second factor tends to $1$, so the limit is $\frac{4}{7}$.'
          - problem: 'Find $\lim_{x \to 0} \frac{\sin 5x}{\sin 2x}$.'
            answer: '5/2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Write $\frac{\sin 5x}{\sin 2x} = \frac{\sin 5x}{5x} \cdot \frac{2x}{\sin 2x} \cdot \frac{5}{2}$. The first two factors tend to $1$, so the limit is $\frac{5}{2}$.'
          - problem: 'Find $\lim_{x \to 0} \frac{\tan 8x}{4x}$.'
            answer: '2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Write $\frac{\tan 8x}{4x} = \frac{8}{4} \cdot \frac{\sin 8x}{8x} \cdot \frac{1}{\cos 8x}$. As $x \to 0$ the last two factors tend to $1$, so the limit is $\frac{8}{4} = 2$.'
          - problem: 'A point moves along a line so that its position after $t$ seconds is $s(t) = \sin 9t$ metres. The average velocity over the first $t$ seconds is $\frac{s(t)}{t}$. What does this average velocity approach as $t \to 0^+$, in metres per second?'
            answer: '9'
            answer_contract: {"kind":"unit","quantity":"speed","unit":"m/s","allow_omitted":true}
            solution_sketch: 'The average velocity is $\frac{\sin 9t}{t} = 9 \cdot \frac{\sin 9t}{9t}$. As $t \to 0$ the factor $\frac{\sin 9t}{9t}$ tends to $1$, so the average velocity approaches $9$ metres per second.'
          - problem: 'Two gauges record the readings $a(t) = \sin 7t$ and $b(t) = \sin 3t$. What value does the ratio $\frac{a(t)}{b(t)}$ approach as $t \to 0$?'
            answer: '7/3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Write $\frac{\sin 7t}{\sin 3t} = \frac{\sin 7t}{7t} \cdot \frac{3t}{\sin 3t} \cdot \frac{7}{3}$. The first two factors tend to $1$, so the ratio approaches $\frac{7}{3}$.'
          - problem: 'What is the value of $\lim_{x \to 0} \frac{\sin 6x}{x}$?'
            answer: '6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The fundamental limit needs the angle in the denominator: $\frac{\sin 6x}{x} = 6 \cdot \frac{\sin 6x}{6x}$. The second factor tends to $1$, so the limit is $6$, not $1$.'
          - problem: 'Find $\lim_{x \to 0} \frac{x}{\sin 4x}$.'
            answer: '1/4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Write $\frac{x}{\sin 4x} = \frac{1}{4} \cdot \frac{4x}{\sin 4x}$. The second factor tends to $1$, so the limit is $\frac{1}{4}$.'
          - problem: 'Find $\lim_{x \to 0} \frac{\sin 5x}{\sin 9x}$.'
            answer: '5/9'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Write $\frac{\sin 5x}{\sin 9x} = \frac{\sin 5x}{5x} \cdot \frac{9x}{\sin 9x} \cdot \frac{5}{9}$. The first two factors tend to $1$, so the limit is $\frac{5}{9}$.'
        constraints: "arguments ax with small integer a; answers are ratios of the coefficients"
      - id: kp3
        name: Combine with algebra and identities
        key_prerequisites: [limit-laws, pythagorean-identity]
        exemplars:
          - problem: 'Find $\lim_{x \to 0} \frac{\tan x}{x}$.'
            answer: '1'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Write $\frac{\tan x}{x} = \frac{\sin x}{x} \cdot \frac{1}{\cos x}$. As $x \to 0$, $\frac{\sin x}{x} \to 1$ and $\cos x \to 1$, so the limit is $1 \cdot 1 = 1$.'
          - problem: 'Find $\lim_{x \to 0} \frac{1 - \cos x}{x^2}$.'
            answer: '1/2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Multiply by $\frac{1 + \cos x}{1 + \cos x}$ to get $\left(\frac{\sin x}{x}\right)^2 \cdot \frac{1}{1 + \cos x}$. The first factor tends to $1$ and the second tends to $\frac{1}{2}$, so the limit is $\frac{1}{2}$.'
          - problem: 'Find $\lim_{x \to 0} \frac{\sin 3x}{x(2x + 1)}$.'
            answer: '3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Split the quotient: $\frac{\sin 3x}{x(2x+1)} = 3 \cdot \frac{\sin 3x}{3x} \cdot \frac{1}{2x+1}$. The three factors tend to $3$, $1$ and $1$, so the limit is $3$.'
          - problem: 'Find $\lim_{x \to 0} \frac{\tan 5x}{2x}$.'
            answer: '5/2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Write $\frac{\tan 5x}{2x} = \frac{5}{2} \cdot \frac{\sin 5x}{5x} \cdot \frac{1}{\cos 5x}$. As $x \to 0$ the last two factors tend to $1$, so the limit is $\frac{5}{2}$.'
          - problem: 'Find $\lim_{x \to 0} \frac{1 - \cos 2x}{x \sin 3x}$.'
            answer: '2/3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Multiply by $\frac{1 + \cos 2x}{1 + \cos 2x}$ to get $\frac{\sin^2 2x}{x\sin 3x\,(1 + \cos 2x)}$. Write $\sin^2 2x$ as $4x^2\left(\frac{\sin 2x}{2x}\right)^2$ and $\sin 3x$ as $3x \cdot \frac{\sin 3x}{3x}$. The sine ratios tend to $1$ and $1 + \cos 2x \to 2$, so the limit is $\frac{4}{3 \cdot 2} = \frac{2}{3}$.'
          - problem: 'A pendulum bob on a rod of length $12$ metres is swung through an angle of $\theta$ radians from the vertical, so it rises $12(1 - \cos\theta)$ metres. What does the ratio of the rise to $\theta^2$ approach as $\theta \to 0$?'
            answer: '6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The ratio is $\frac{12(1 - \cos\theta)}{\theta^2} = 12 \cdot \frac{1 - \cos\theta}{\theta^2}$. The limit of $\frac{1 - \cos\theta}{\theta^2}$ is $\frac{1}{2}$, so the ratio tends to $12 \cdot \frac{1}{2} = 6$.'
          - problem: 'The graph of $y = \tan 4x$ passes through the origin. What does the slope of the line through the origin and the point $(t, \tan 4t)$ approach as $t \to 0$?'
            answer: '4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The slope is $\frac{\tan 4t}{t} = 4 \cdot \frac{\sin 4t}{4t} \cdot \frac{1}{\cos 4t}$. As $t \to 0$ the last two factors tend to $1$, so the slope approaches $4$.'
          - problem: 'What is the value of $\lim_{x \to 0} \frac{1 - \cos x}{x^2}$?'
            answer: '1/2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The numerator and the denominator both tend to $0$, so the numerator alone does not decide the limit. Multiplying by $\frac{1 + \cos x}{1 + \cos x}$ gives $\left(\frac{\sin x}{x}\right)^2 \cdot \frac{1}{1 + \cos x}$, which tends to $\frac{1}{2}$.'
          - problem: 'Find $\lim_{x \to 0} \frac{x \sin x}{1 - \cos x}$.'
            answer: '2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Multiply by $\frac{1 + \cos x}{1 + \cos x}$ to get $\frac{x\sin x\,(1 + \cos x)}{\sin^2 x} = \frac{x}{\sin x}\,(1 + \cos x)$. As $x \to 0$ this tends to $1 \cdot 2 = 2$.'
        constraints: "reduce to the fundamental limits via factoring, tan = sin/cos, or the conjugate of 1 - cos"
    diagnostic_exemplar:
      problem: 'Evaluate $\lim_{x \to 0} \frac{\tan(3x)}{x}$.'
      answer: "3"
      solution_sketch: 'Split off the special limit: $\frac{\tan(3x)}{x} = 3 \cdot \frac{\sin(3x)}{3x} \cdot \frac{1}{\cos(3x)} \to 3 \cdot 1 \cdot 1$.'
    anki_seeds:
      - front: "lim_{x→0} (sin x)/x = ? and lim_{x→0} (1 - cos x)/x = ? (radians)"
        back: "1 and 0"
        type: basic
      - front: "lim_{x→0} sin(ax)/(bx) = ?"
        back: "a/b"
        type: basic
      - front: "lim_{x→0} (1 - cos x)/x² = ?"
        back: "1/2"
        type: basic

  - id: limits-of-composite-functions
    name: Limits of Composite Functions
    core: true
    difficulty: 0.55
    drill: false
    answer_kind: numeric
    expected_time_secs: 120
    prerequisites:
      - id: function-composition
        weight: 0.6
        key: true
      - id: limit-laws
        weight: 0.6
        key: true
      - id: one-sided-limits
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: Pass the limit through a continuous outer function
        key_prerequisites: [function-composition, limit-laws]
        exemplars:
          - problem: 'Evaluate $\lim_{x \to 2} \sqrt{x^2 + 5}$.'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'As $x \to 2$ the inside $x^2 + 5$ approaches $9$. The square root is continuous at $9$, so the limit is $\sqrt{9} = 3$.'
          - problem: 'Evaluate $\lim_{x \to 0} e^{x + \ln 6}$.'
            answer: '6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The exponent $x + \ln 6$ approaches $\ln 6$ as $x \to 0$. The function $e^u$ is continuous everywhere, so the limit is $e^{\ln 6} = 6$.'
          - problem: 'A valve opens to an area of $A(t) = t^2 + 4t + 4$ square centimetres at time $t$ seconds, and the flow through it is $\sqrt{A}$ litres per second. What value, in litres per second, does the flow approach as $t \to 3$?'
            answer: '5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'As $t \to 3$ the area approaches $9 + 12 + 4 = 25$. The square root is continuous at $25$, so the flow approaches $\sqrt{25} = 5$ litres per second.'
          - problem: 'Suppose $\lim_{x \to a} g(x) = 4$ and $f$ is continuous at $4$ with $f(4) = 7$. Find $\lim_{x \to a} f(g(x))$.'
            answer: '7'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The inner limit is $4$. Since $f$ is continuous at $4$, the limit passes inside, so $\lim_{x \to a} f(g(x)) = f(4) = 7$.'
          - problem: 'A workshop makes $q(t) = 2t^2 + 8$ items in week $t$ and spreads a fixed cost of $3600$ dollars over them, so the cost per item is $3600/q$ dollars. What does the cost per item approach as $t \to 4$?'
            answer: '90'
            answer_contract: {"kind": "unit", "quantity": "dollar", "unit": "dollar", "allow_omitted": true}
            solution_sketch: 'As $t \to 4$ the number of items approaches $2(16) + 8 = 40$. Division by $q$ is continuous at $40$, so the cost per item approaches $3600/40 = 90$ dollars.'
          - problem: 'Evaluate $\lim_{x \to 0} \sin\left(x + \frac{\pi}{2}\right)$.'
            answer: '1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The inside $x + \pi/2$ approaches $\pi/2$ as $x \to 0$. Sine is continuous, so the limit is $\sin(\pi/2) = 1$.'
          - problem: 'Evaluate $\lim_{x \to 1} \ln\left(\frac{x^2 - 1}{x - 1}\right)$.'
            answer: 'ln(2)'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'For $x \neq 1$ the fraction equals $x + 1$, which approaches $2$ as $x \to 1$. The logarithm is continuous at $2$, so the limit is $\ln 2$.'
          - problem: 'Evaluate $\lim_{x \to -1} \sqrt[3]{x^3 - 7}$.'
            answer: '-2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'As $x \to -1$ the inside approaches $(-1)^3 - 7 = -8$. The cube root is continuous at $-8$, so the limit is $\sqrt[3]{-8} = -2$.'
        constraints: "outer function continuous at the inner limit; small integer inner limits; two contexts with a measured quantity, one needing a division"
      - id: kp2
        name: Composite limits from tables and graphs
        key_prerequisites: [function-composition, limit-laws]
        exemplars:
          - problem: 'Suppose $\lim_{x \to 2} g(x) = 3$ but $g(2) = 5$. The function $f$ is continuous with $f(3) = 8$ and $f(5) = 1$. Find $\lim_{x \to 2} f(g(x))$.'
            answer: '8'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Only the limit of $g$ matters, and it is $3$. Since $f$ is continuous at $3$, the limit is $f(3) = 8$. The value $g(2) = 5$ and the value $f(5) = 1$ are not used.'
          - problem: 'A table for $g$ near $x = 1$ reads: $x = 0.9, 0.99, 1.01, 1.1$ and $g(x) = -1.8, -1.98, -2.02, -2.2$, while $g(1) = 4$. The function $f$ is continuous with $f(-2) = 7$. Find $\lim_{x \to 1} f(g(x))$.'
            answer: '7'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The values of $g$ approach $-2$ from both sides, so the inner limit is $-2$, whatever $g(1) = 4$ says. Since $f$ is continuous at $-2$, the limit is $f(-2) = 7$.'
          - problem: 'The graph of $g$ is a curve that approaches height $4$ as $x \to -2$ from either side, but the point plotted at $x = -2$ is $(-2, 1)$. The function $f$ is continuous with $f(4) = -1$ and $f(1) = 6$. Find $\lim_{x \to -2} f(g(x))$.'
            answer: '-1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The curve approaches height $4$, so the inner limit is $4$; the plotted point at height $1$ does not count. Since $f$ is continuous at $4$, the limit is $f(4) = -1$.'
          - problem: 'A depth sensor reports the water depth $h(t)$ in metres. As $t \to 10$ seconds the readings approach $3$ m, but the sensor shows $9$ m at exactly $t = 10$. The pump rate is a continuous function of the depth, with $f(3) = 11$ litres per minute and $f(9) = 2$ litres per minute. What rate does $f(h(t))$ approach as $t \to 10$?'
            answer: '11'
            answer_contract: {"kind": "unit", "quantity": "flow", "unit": "L/min", "allow_omitted": true}
            solution_sketch: 'The depth approaches $3$ m, so the reading of $9$ m at $t = 10$ does not matter. By continuity the pump rate approaches $f(3) = 11$ litres per minute.'
          - problem: 'The rate $r(x)$ of a pump in litres per minute depends on a valve setting $x$. A table gives $x = 4.9, 4.99, 5.01, 5.1$ and $r = 1.9, 1.99, 2.01, 2.1$, and no reading is taken at $x = 5$. Filling a bucket of $12$ litres takes $T(r) = 12/r$ minutes. What time does $T(r(x))$ approach as $x \to 5$?'
            answer: '6'
            answer_contract: {"kind": "unit", "quantity": "time", "unit": "min", "allow_omitted": true}
            solution_sketch: 'The table shows $r(x)$ approaching $2$ litres per minute as $x \to 5$. The function $T(r) = 12/r$ is continuous at $2$, so the time approaches $12/2 = 6$ minutes.'
          - problem: 'Let $g(x) = \frac{x^2 - 9}{x - 3}$ for $x \neq 3$ and $g(3) = 0$, and let $f(u) = u^2 + 1$. Find $\lim_{x \to 3} f(g(x))$.'
            answer: '37'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'For $x \neq 3$ we have $g(x) = x + 3$, so $g(x) \to 6$ as $x \to 3$; the value $g(3) = 0$ is irrelevant. Since $f$ is continuous, the limit is $f(6) = 36 + 1 = 37$.'
        constraints: "the value g(a) is a decoy differing from the inner limit; f continuous at the inner limit; data given in words or as small tables"
      - id: kp3
        name: One-sided care when the outer function jumps
        key_prerequisites: [one-sided-limits, function-composition]
        try_first:
          problem: 'Let $f(u) = 2$ for $u < 5$ and $f(u) = 8$ for $u \geq 5$, and let $g(x) = 5 - (x - 2)^2$. What number does $f(g(x))$ approach as $x \to 2$?'
          answer_contract: {"kind": "exact"}
          answer: '2'
          reveal: 'Near $x = 2$ the input $g(x)$ is just below $5$ and never equal to it, so $f$ is evaluated on its left branch. The side from which $g(x)$ approaches $5$ decides the answer, not the value $f(5) = 8$.'
        exemplars:
          - problem: 'Suppose $\lim_{u \to 2^-} f(u) = 1$ and $\lim_{u \to 2^+} f(u) = 6$, and $g(x) = 2 + (x - 3)^2$. Find $\lim_{x \to 3} f(g(x))$.'
            answer: '6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Since $(x - 3)^2 > 0$ for $x \neq 3$, the input $g(x)$ approaches $2$ from above. So we use the right-hand limit of $f$ at $2$, which is $6$.'
          - problem: 'A function $f$ satisfies $\lim_{u \to 2^-} f(u) = 1$ and $\lim_{u \to 2^+} f(u) = 6$. Find $\lim_{x \to 0} f(2 - x^2)$.'
            answer: '1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The inner function $2 - x^2$ approaches $2$ from below, because $x^2 > 0$ for $x \neq 0$. So we use the left-hand limit of $f$ at $2$, which is $1$.'
          - problem: 'Let $f(u) = u + 5$ for $u < 0$ and $f(u) = u^2$ for $u \geq 0$, and let $g(x) = -x^2$. Find $\lim_{x \to 0} f(g(x))$.'
            answer: '5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'For $x \neq 0$ the input $g(x) = -x^2$ is negative and approaches $0$ from below. So $f(g(x)) = -x^2 + 5 \to 5$. The value $f(g(0)) = f(0) = 0$ is not the limit.'
          - problem: 'A heater delivers $P(T)$ kilowatts at room temperature $T$ degrees Celsius, where $P(T) = 3$ for $T < 20$ and $P(T) = 1$ for $T \geq 20$. In a cold spell the temperature at hour $t$ is $20 - (t - 4)^2$ degrees. What power does the heater approach as $t \to 4$?'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The temperature $20 - (t - 4)^2$ approaches $20$ from below, since the square is positive for $t \neq 4$. So the power follows the branch $T < 20$ and approaches $3$ kilowatts, although $P(20) = 1$.'
          - problem: 'A toll system charges $f(s)$ dollars when the average speed is $s$ km/h, where $f(s) = 2$ for $s < 60$ and $f(s) = 5$ for $s \geq 60$. On a congested road the average speed at time $t$ hours is $s(t) = 60 - \sqrt{t}$. What does the charge approach as $t \to 0^+$?'
            answer: '2'
            answer_contract: {"kind": "unit", "quantity": "dollar", "unit": "dollar", "allow_omitted": true}
            solution_sketch: 'For $t > 0$ we have $\sqrt{t} > 0$, so $s(t)$ approaches $60$ from below. The charge uses the branch $s < 60$, so it approaches $2$ dollars, not the $5$ dollars charged at exactly $60$ km/h.'
          - problem: 'Suppose $\lim_{u \to 3^-} f(u) = 2$ and $\lim_{u \to 3^+} f(u) = 9$, and $g(x) = 3 + \sqrt{x}$. Find $\lim_{x \to 0^+} f(g(x))$.'
            answer: '9'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'For $x > 0$ we have $\sqrt{x} > 0$, so $g(x)$ approaches $3$ from above. We use the right-hand limit of $f$ at $3$, which is $9$.'
          - problem: 'The function $f$ has $\lim_{u \to 1^-} f(u) = -2$ and $\lim_{u \to 1^+} f(u) = 4$. Find $\lim_{x \to 3} f\left(1 - (x - 3)^2\right)$.'
            answer: '-2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The inner function $1 - (x - 3)^2$ is below $1$ for $x \neq 3$, so it approaches $1$ from below. We use the left-hand limit of $f$ at $1$, which is $-2$.'
          - problem: 'Suppose $\lim_{u \to 3^-} f(u) = 1$ and $\lim_{u \to 3^+} f(u) = 5$, and $g(x) = x + 1$. Does $\lim_{x \to 2} f(g(x))$ exist?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "it exists", "the limit exists", "yes, it exists", "yes it exists"], ["no", "it does not exist", "the limit does not exist", "does not exist", "dne", "no limit", "no, it does not exist"]]}
            solution_sketch: 'As $x \to 2$ from the left, $g(x)$ approaches $3$ from below, so $f(g(x)) \to 1$. From the right, $g(x)$ approaches $3$ from above, so $f(g(x)) \to 5$. The two one-sided limits differ, so the limit does not exist.'
        constraints: "inner function approaches its limit from one definite side (or from both sides in one item); outer function has a jump there; two contexts"
    diagnostic_exemplar:
      problem: 'Suppose $\lim_{u \to 4^-} f(u) = 2$ and $\lim_{u \to 4^+} f(u) = 7$, and let $g(x) = 4 + (x - 1)^2$. Find $\lim_{x \to 1} f(g(x))$.'
      answer: '7'
      solution_sketch: 'For $x$ near $1$ but $x \neq 1$ we have $g(x) > 4$, so $g(x)$ approaches $4$ from above and only the right-hand limit of $f$ at $4$ matters: the answer is $7$.'
    anki_seeds:
      - front: "If lim_{x→a} g(x) = L and f is continuous at L, then lim_{x→a} f(g(x)) = ?"
        back: "f(L) — the limit passes inside a continuous outer function"
        type: basic
      - front: "In a composite limit, the inner function's VALUE g(a) matters..."
        back: "not at all — only the inner limit L (and possibly the side from which g approaches L)"
        type: basic

  - id: continuity-at-a-point
    name: Continuity at a Point
    core: true
    difficulty: 0.55
    drill: false
    answer_kind: numeric
    expected_time_secs: 120
    prerequisites:
      - id: limits-piecewise-functions
        weight: 0.7
        key: true
      - id: limit-laws
        weight: 0.5
        key: true
      - id: domain-range
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: Check the three conditions
        key_prerequisites: [limits-piecewise-functions, limit-laws]
        try_first:
          problem: 'A function equals $x^2$ for every $x \neq 2$, and $f(2) = 7$. What number does $f(x)$ get close to as $x$ gets close to $2$?'
          answer_contract: {"kind": "exact"}
          answer: '4'
          reveal: 'The values near $2$ approach $4$, but the value at $2$ is $7$, so one point sits away from the rest of the graph. Continuity asks that the limit and the value agree.'
        exemplars:
          - problem: 'Let $f(x) = \frac{x^2 - 25}{x - 5}$ for $x \neq 5$ and $f(5) = 3$. Is $f$ continuous at $x = 5$?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "it is continuous", "f is continuous", "continuous", "yes it is", "yes, it is continuous"], ["no", "it is not continuous", "f is not continuous", "not continuous", "discontinuous", "no it is not", "no, it is not continuous"]]}
            solution_sketch: 'For $x \neq 5$ the fraction equals $x + 5$, so the limit as $x \to 5$ is $10$. The value $f(5) = 3$ is defined but differs from the limit, so the third condition fails and $f$ is not continuous.'
          - problem: 'Let $g(x) = x^2 + 1$ for $x \leq 1$ and $g(x) = 3x - 1$ for $x > 1$. Find $\lim_{x \to 1} g(x)$.'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The left-hand limit is $1^2 + 1 = 2$ and the right-hand limit is $3(1) - 1 = 2$. The one-sided limits agree, so the limit is $2$, which also equals $g(1) = 2$.'
          - problem: 'Let $f(x) = cx - 3$ for $x < 1$ and $f(x) = x^2$ for $x \geq 1$. Find the value of $c$ for which $f$ is continuous at $x = 1$.'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The left-hand limit at $x = 1$ is $c - 3$ and the value from the right is $1^2 = 1$. Continuity needs $c - 3 = 1$, so $c = 4$.'
          - problem: 'A gym charges $C(m) = 20m$ dollars for $m \leq 6$ months and $C(m) = 18m + k$ dollars for $m > 6$. For what value of $k$ is the price continuous at $m = 6$?'
            answer: '12'
            answer_contract: {"kind": "unit", "quantity": "dollar", "unit": "dollar", "allow_omitted": true}
            solution_sketch: 'At $m = 6$ the first formula gives $20(6) = 120$ dollars and the second gives $18(6) + k = 108 + k$. Setting $108 + k = 120$ gives $k = 12$ dollars.'
          - problem: 'The average speed of a train over a stretch of track is $v(t) = \frac{t^2 - 49}{t - 7}$ kilometres per hour for $t \neq 7$. What value must be assigned to $v(7)$ so that $v$ is continuous at $t = 7$?'
            answer: '14'
            answer_contract: {"kind": "unit", "quantity": "speed", "unit": "km/h", "allow_omitted": true}
            solution_sketch: 'For $t \neq 7$ the fraction equals $t + 7$, so the limit as $t \to 7$ is $14$. Continuity needs $v(7)$ to equal that limit, so $v(7) = 14$ kilometres per hour.'
          - problem: 'Let $f(x) = x^2 + c$ for $x \leq 3$ and $f(x) = 2x - 5$ for $x > 3$. Find $c$ so that $f$ is continuous at $x = 3$.'
            answer: '-8'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'At $x = 3$ the first piece gives $9 + c$ and the second gives $2(3) - 5 = 1$. Setting $9 + c = 1$ gives $c = -8$.'
          - problem: 'The filling rate of a tank is $r(t) = 3t + 2$ litres per minute for $t \leq 4$ and $r(t) = kt - 6$ for $t > 4$. Find $k$ so that the rate has no jump at $t = 4$.'
            answer: '5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'At $t = 4$ the first formula gives $3(4) + 2 = 14$ and the second gives $4k - 6$. Setting $4k - 6 = 14$ gives $4k = 20$, so $k = 5$.'
          - problem: 'Let $f(x) = \frac{x^2 - 4}{x - 2}$ for $x \neq 2$ and $f(2) = 4$. Is $f$ continuous at $x = 2$?'
            answer: 'yes'
            answer_contract: {"kind": "label", "options": [["yes", "it is continuous", "f is continuous", "continuous", "yes it is", "yes, it is continuous"], ["no", "it is not continuous", "f is not continuous", "not continuous", "discontinuous", "no it is not", "no, it is not continuous"]]}
            solution_sketch: 'For $x \neq 2$ the fraction equals $x + 2$, so the limit as $x \to 2$ is $4$. The value $f(2) = 4$ is defined and equals the limit, so all three conditions hold and $f$ is continuous.'
          - problem: 'Let $f(x) = x + 1$ for $x < 2$ and $f(x) = x^2 - 1$ for $x > 2$, and $f(2)$ is not defined. What value of $f(2)$ would make $f$ continuous at $x = 2$?'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The left-hand limit is $2 + 1 = 3$ and the right-hand limit is $2^2 - 1 = 3$, so the limit is $3$. Setting $f(2) = 3$ makes the value equal the limit.'
          - problem: 'Let $f(x) = \frac{x^2 + x - 6}{x - 2}$ for $x \neq 2$ and $f(2) = 1$. By how much does $f(2)$ differ from $\lim_{x \to 2} f(x)$?'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'For $x \neq 2$ we have $x^2 + x - 6 = (x - 2)(x + 3)$, so $f(x) = x + 3$ and the limit as $x \to 2$ is $5$. The value $f(2) = 1$ differs from it by $5 - 1 = 4$, so $f$ is not continuous at $2$.'
        constraints: "verify f(a) defined, limit exists, limit = f(a); values are small integers; include failing cases; at least two contexts, one with a division"
      - id: kp2
        name: Identify which condition fails
        key_prerequisites: [limits-piecewise-functions, limit-laws]
        exemplars:
          - problem: 'Let $f(x) = \frac{x^2 - 7x + 10}{x - 2}$. Which is the reason $f$ is not continuous at $x = 2$: $f(2)$ is undefined, the limit does not exist, or the limit exists but differs from $f(2)$?'
            answer: 'the value is undefined'
            answer_contract: {"kind": "label", "options": [["the value is undefined", "undefined", "f(2) is undefined", "f(2) is not defined", "not defined", "it is undefined", "the value f(2) is undefined"], ["the limit does not exist", "limit does not exist", "no limit", "does not exist", "dne", "the limit is undefined"], ["the limit differs from the value", "limit differs from f(2)", "the limit differs from f(2)", "limit is not equal to f(2)", "the limit is not equal to f(2)", "the limit exists but differs from f(2)", "differs", "not equal"]]}
            solution_sketch: 'The rule gives $f(2) = \frac{0}{0}$, so $f(2)$ is undefined and the first condition fails. For $x \neq 2$ the fraction equals $x - 5$, so a limit exists, but a missing value is already enough to break continuity.'
          - problem: 'Let $f(x) = 2x + 1$ for $x < 2$, $f(x) = 2x + 7$ for $x > 2$, and $f(2) = 3$. By how much do the right-hand and left-hand limits of $f$ at $x = 2$ differ?'
            answer: '6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The left-hand limit is $2(2) + 1 = 5$ and the right-hand limit is $2(2) + 7 = 11$. They differ by $11 - 5 = 6$, so the limit does not exist.'
          - problem: 'A courier charges $5$ dollars for a parcel of weight $w \leq 2$ kilograms and $8$ dollars for $w > 2$. By how many dollars does the charge jump as the weight passes $2$ kilograms?'
            answer: '3'
            answer_contract: {"kind": "unit", "quantity": "dollar", "unit": "dollar", "allow_omitted": true}
            solution_sketch: 'Just below $2$ kilograms the charge is $5$ dollars, and just above it is $8$ dollars. The one-sided limits differ by $8 - 5 = 3$ dollars, so the charge jumps by $3$ dollars.'
          - problem: 'Let $f(x) = \frac{|x - 3|}{x - 3}$ for $x \neq 3$ and $f(3) = 1$. Which is the reason $f$ is not continuous at $x = 3$: $f(3)$ is undefined, the limit does not exist, or the limit exists but differs from $f(3)$?'
            answer: 'the limit does not exist'
            answer_contract: {"kind": "label", "options": [["the value is undefined", "undefined", "f(3) is undefined", "f(3) is not defined", "not defined", "it is undefined", "the value f(3) is undefined"], ["the limit does not exist", "limit does not exist", "no limit", "does not exist", "dne", "the limit is undefined"], ["the limit differs from the value", "limit differs from f(3)", "the limit differs from f(3)", "limit is not equal to f(3)", "the limit is not equal to f(3)", "the limit exists but differs from f(3)", "differs", "not equal"]]}
            solution_sketch: 'For $x > 3$ the quotient is $1$, and for $x < 3$ it is $-1$. The one-sided limits at $3$ differ, so the limit does not exist, although $f(3) = 1$ is defined.'
          - problem: 'Let $f(x) = \frac{x^2 - 3x - 4}{x - 4}$ for $x \neq 4$ and $f(4) = 9$. By how much does $f(4)$ differ from $\lim_{x \to 4} f(x)$?'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'For $x \neq 4$ the fraction equals $x + 1$, so the limit as $x \to 4$ is $5$. The value $f(4) = 9$ differs from it by $9 - 5 = 4$.'
          - problem: 'A runner''s position is $s(t) = t^2$ metres at time $t$ seconds. Her average speed between time $5$ and a later time $t$ is $v(t) = \frac{t^2 - 25}{t - 5}$ metres per second. What value, in metres per second, does $v(t)$ approach as $t \to 5$?'
            answer: '10'
            answer_contract: {"kind": "unit", "quantity": "speed", "unit": "m/s", "allow_omitted": true}
            solution_sketch: 'For $t \neq 5$ the fraction equals $t + 5$. As $t \to 5$ this approaches $10$, so the average speed approaches $10$ metres per second, although $v(5)$ itself is undefined.'
          - problem: 'A machine''s output rate is $r(t) = \frac{t^2 - 9}{t - 3}$ units per hour for $t \neq 3$, and the log records $4$ units per hour at exactly $t = 3$. By how many units per hour does the record differ from the rate the machine approaches?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'For $t \neq 3$ the rate equals $t + 3$, which approaches $6$ as $t \to 3$. The record $4$ differs from $6$ by $2$ units per hour.'
          - problem: 'The function $f(x) = \frac{x^3 - 27}{x - 3}$ is not defined at $x = 3$. What value assigned to $f(3)$ would make $f$ continuous at $x = 3$?'
            answer: '27'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'For $x \neq 3$ we have $x^3 - 27 = (x - 3)(x^2 + 3x + 9)$, so $f(x) = x^2 + 3x + 9$. As $x \to 3$ this approaches $9 + 9 + 9 = 27$, so $f(3) = 27$ makes $f$ continuous.'
        constraints: "one failing condition per problem; the student names it, or measures the break (size of the jump, gap between limit and value)"
      - id: kp3
        name: Where standard functions are continuous
        key_prerequisites: [limit-laws, domain-range]
        exemplars:
          - problem: 'At which values of $x$ is $f(x) = \frac{x + 1}{x^2 - 9}$ continuous?'
            answer: 'x < -3 or -3 < x < 3 or x > 3'
            answer_contract: {"kind": "inequality_union"}
            solution_sketch: 'A rational function is continuous wherever its denominator is nonzero. Here $x^2 - 9 = 0$ at $x = -3$ and $x = 3$, so $f$ is continuous for $x < -3$, for $-3 < x < 3$ and for $x > 3$.'
          - problem: 'Where is $f(x) = \sqrt{x - 2}$ continuous?'
            answer: 'x >= 2'
            answer_contract: {"kind": "inequality_union"}
            solution_sketch: 'The square root is defined and continuous when its inside is at least zero, so $x - 2 \geq 0$. That gives $x \geq 2$, and $f$ is continuous on all of it.'
          - problem: 'Is $p(x) = x^3 - 4x + 1$ continuous at every real number?'
            answer: 'yes'
            answer_contract: {"kind": "label", "options": [["yes", "it is", "it does", "yes it does", "yes, it does", "yes, it is", "it is continuous", "continuous"], ["no", "it is not", "it does not", "no it does not", "no, it does not", "no, it is not", "it is not continuous", "not continuous"]]}
            solution_sketch: 'A polynomial is continuous at every real number, because $x$ and constants are continuous and sums and products of continuous functions are continuous. So $p$ has no break anywhere.'
          - problem: 'A pool of $600$ cubic metres is filled by a pump delivering $r$ cubic metres per hour while a leak loses $4$ cubic metres per hour, so the filling time is $T(r) = \frac{600}{r - 4}$ hours. For which pump rate $r > 0$ is $T$ not continuous?'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The function $T$ is a rational function, so it breaks only where the denominator is zero. Solving $r - 4 = 0$ gives $r = 4$ cubic metres per hour.'
          - problem: 'Where is $g(x) = \frac{2x}{x^2 - 4x}$ continuous?'
            answer: 'x < 0 or 0 < x < 4 or x > 4'
            answer_contract: {"kind": "inequality_union"}
            solution_sketch: 'The denominator $x^2 - 4x = x(x - 4)$ is zero at $x = 0$ and $x = 4$. So $g$ is continuous for $x < 0$, for $0 < x < 4$ and for $x > 4$.'
          - problem: 'The height of a tunnel''s roof is $h(x) = \sqrt{25 - x^2}$ metres at horizontal position $x$ metres from the centre. For which positions $x$ is $h$ continuous?'
            answer: '-5 <= x <= 5'
            answer_contract: {"kind": "inequality_union"}
            solution_sketch: 'The square root needs $25 - x^2 \geq 0$, which means $x^2 \leq 25$. So $h$ is continuous for $-5 \leq x \leq 5$.'
          - problem: 'Where is $h(x) = \sqrt{5 - x}$ continuous?'
            answer: 'x <= 5'
            answer_contract: {"kind": "inequality_union"}
            solution_sketch: 'The square root needs $5 - x \geq 0$, which gives $x \leq 5$. The function is continuous at every such $x$.'
          - problem: 'Is $f(x) = \frac{x - 1}{x^2 - 1}$ continuous at every real number?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "it is", "it does", "yes it does", "yes, it does", "yes, it is", "it is continuous", "continuous"], ["no", "it is not", "it does not", "no it does not", "no, it does not", "no, it is not", "it is not continuous", "not continuous"]]}
            solution_sketch: 'The denominator $x^2 - 1$ is zero at $x = 1$ and $x = -1$, where $f$ is not defined. So $f$ is not continuous at every real number.'
          - problem: 'Find all values of $x$ at which $f(x) = \frac{x + 2}{x^2 - 25}$ is not continuous.'
            answer: '-5, 5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The function is rational, so it breaks only where the denominator is zero. Solving $x^2 - 25 = 0$ gives $x = -5$ and $x = 5$.'
        constraints: "polynomials, rational functions, and square roots; answer with the set where continuity holds or the points where it fails; at least two contexts"
    diagnostic_exemplar:
      problem: 'Let $f(x) = \frac{x^2 - 9}{x - 3}$ for $x \neq 3$ and $f(3) = 5$. Is $f$ continuous at $x = 3$? If not, name the condition that fails.'
      answer: 'no — f(3) = 5 is defined and the limit exists, but the third condition fails: the limit is 6, not f(3) = 5'
      answer_contract: {kind: none}
      solution_sketch: 'Cancel: $\frac{(x-3)(x+3)}{x-3} \to 6$ as $x \to 3$, while $f(3) = 5$.'
    anki_seeds:
      - front: "f is continuous at a exactly when three conditions hold:"
        back: "f(a) is defined; lim_{x→a} f(x) exists; and the limit equals f(a)"
        type: basic
      - front: "A rational function is continuous at every point where..."
        back: "its denominator is nonzero"
        type: basic

  - id: continuity
    name: Continuity
    core: true
    difficulty: 0.62
    drill: false
    answer_kind: expression
    expected_time_secs: 150
    prerequisites:
      - id: continuity-at-a-point
