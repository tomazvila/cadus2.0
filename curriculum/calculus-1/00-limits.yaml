unit: limits-continuity
course: calculus-1
module: "Limits & Continuity"
topics:
  - id: limits-from-tables
    name: Estimating Limits from Tables
    core: true
    difficulty: 0.42
    drill: false
    answer_kind: numeric
    expected_time_secs: 75
    prerequisites:
      - id: evaluating-functions
        weight: 0.7
        key: true
      - id: function-notation
        weight: 0.5
        key: true
      - id: comparing-ordering-decimals
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: 'Estimate a limit from a two-sided table'
        key_prerequisites: [evaluating-functions]
        constraints: 'table values approach an integer limit symmetrically from both sides'
        exemplars:
          - problem: 'For $f(x) = \frac{x^2 - 4}{x - 2}$, a table gives $f(1.9) = 3.9$, $f(1.99) = 3.99$, $f(2.01) = 4.01$, $f(2.1) = 4.1$. Estimate $\lim_{x \to 2} f(x)$.'
            answer: '4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'From the left, the outputs $3.9$ and $3.99$ rise toward $4$. From the right, the outputs $4.01$ and $4.1$ fall toward $4$. Both sides close in on $4$, so the limit is about $4$.'
          - problem: 'For $f(x) = \frac{x - 1}{x^2 - 1}$, a table gives $f(0.9) = 0.5263$, $f(0.99) = 0.5025$, $f(1.01) = 0.4975$, $f(1.1) = 0.4762$. Estimate $\lim_{x \to 1} f(x)$.'
            answer: '1/2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'From the left, the outputs $0.5263$ and $0.5025$ fall toward $0.5$. From the right, the outputs $0.4975$ and $0.4762$ rise toward $0.5$. Both sides close in on $0.5$, so the limit is $1/2$.'
          - problem: 'A factory''s cost per item is $C(q)$ dollars when $q$ hundred items are made, and the formula is undefined at $q = 8$. A table gives $C(7.9) = 15.9$, $C(7.99) = 15.99$, $C(8.01) = 16.01$, $C(8.1) = 16.1$. What cost per item does the table suggest as $q$ approaches $8$?'
            answer: '16'
            answer_contract: {"kind":"unit","quantity":"dollar","unit":"dollar","allow_omitted":true}
            solution_sketch: 'The cost values $15.9$ and $15.99$ rise toward $16$ from the left. The values $16.01$ and $16.1$ fall toward $16$ from the right. Both sides agree, so the cost per item approaches $16$ dollars.'
          - problem: 'For $h(x) = \frac{x^2 - 1}{x + 1}$, a table gives $h(-1.1) = -2.1$, $h(-1.01) = -2.01$, $h(-0.99) = -1.99$, $h(-0.9) = -1.9$. Estimate $\lim_{x \to -1} h(x)$.'
            answer: '-2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'From the left, the outputs $-2.1$ and $-2.01$ rise toward $-2$. From the right, the outputs $-1.99$ and $-1.9$ fall toward $-2$. Both sides close in on $-2$, so the limit is $-2$.'
          - problem: 'A metal rod cools, and its temperature $T$ (in degrees Celsius) is logged $t$ minutes after cooling starts: $T(9.9) = 20.2$, $T(9.99) = 20.02$, $T(10.01) = 19.98$, $T(10.1) = 19.8$. Estimate $\lim_{t \to 10} T(t)$.'
            answer: '20'
            answer_contract: {"kind":"unit","quantity":"temperature","unit":"°C","allow_omitted":true}
            solution_sketch: 'Before minute $10$, the temperatures $20.2$ and $20.02$ fall toward $20$. After minute $10$, the temperatures $19.98$ and $19.8$ rise toward $20$. Both sides close in on $20$, so the limit is $20$ degrees.'
          - problem: 'A table for $g$ lists $g(0.9) = 2.61$, $g(0.99) = 2.9601$, $g(1) = 10$, $g(1.01) = 3.0401$, $g(1.1) = 3.41$. Estimate $\lim_{x \to 1} g(x)$.'
            answer: '3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The limit depends on the rows near $x = 1$ and not on the row at $x = 1$. The rows on both sides, $2.61$, $2.9601$, $3.0401$ and $3.41$, close in on $3$. The listed value $g(1) = 10$ does not matter, so the limit is $3$.'
          - problem: 'A table for $f(x) = \frac{x^3 - 8}{x - 2}$ gives $f(1.9) = 11.41$, $f(1.99) = 11.9401$, $f(2.01) = 12.0601$, $f(2.1) = 12.61$. Estimate $\lim_{x \to 2} f(x)$.'
            answer: '12'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'From the left, the outputs $11.41$ and $11.9401$ rise toward $12$. From the right, the outputs $12.0601$ and $12.61$ fall toward $12$. Both sides close in on $12$, so the limit is $12$.'
      - id: kp2
        name: 'Build the table yourself'
        key_prerequisites: [evaluating-functions, function-notation]
        constraints: 'linear or quadratic functions; probe points within 0.1 of the target'
        exemplars:
          - problem: 'Let $f(x) = 3x - 2$. Compute $f(1.9)$, $f(1.99)$, $f(2.01)$ and $f(2.1)$, and use them to estimate $\lim_{x \to 2} f(x)$.'
            answer: '4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Substitution gives $f(1.9) = 3.7$, $f(1.99) = 3.97$, $f(2.01) = 4.03$ and $f(2.1) = 4.3$. The outputs from both sides close in on $4$. The estimated limit is $4$.'
          - problem: 'Let $f(x) = \frac{x^2 - 9}{x - 3}$. Compute $f(2.9)$, $f(2.99)$, $f(3.01)$ and $f(3.1)$, and use them to estimate $\lim_{x \to 3} f(x)$.'
            answer: '6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Each output is a quotient: $f(2.9) = -0.59 / -0.1 = 5.9$, $f(2.99) = 5.99$, $f(3.01) = 6.01$ and $f(3.1) = 6.1$. The outputs from both sides close in on $6$. The estimated limit is $6$.'
          - problem: 'A ball''s height is $h(t) = -5t^2 + 20t$ metres at time $t$ seconds. Compute $h(1.9)$, $h(1.99)$, $h(2.01)$ and $h(2.1)$, and use them to estimate the height that $h(t)$ approaches as $t \to 2$.'
            answer: '20'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'Substitution gives $h(1.9) = 19.95$, $h(1.99) = 19.9995$, $h(2.01) = 19.9995$ and $h(2.1) = 19.95$. The outputs from both sides close in on $20$. The height approaches $20$ metres.'
          - problem: 'To estimate $\lim_{x \to 5} f(x)$ from a table, which list of inputs should be used: $4.9, 4.99, 5.01, 5.1$ or $4, 4.5, 6, 7$?'
            answer: 'the first list'
            answer_contract: {"kind":"label","options":[["the first list","first list","first","4.9, 4.99, 5.01, 5.1","the first one","list 1","(a)"],["the second list","second list","second","4, 4.5, 6, 7","the second one","list 2","(b)"]]}
            solution_sketch: 'The inputs must close in on $5$ from both sides. The numbers $4.9, 4.99, 5.01, 5.1$ do this. The numbers $4, 4.5, 6, 7$ stay far from $5$, so the first list is the right one.'
          - problem: 'Let $f(x) = 2x^2 + 1$. Compute $f(0.4)$, $f(0.49)$, $f(0.51)$ and $f(0.6)$, and use them to estimate $\lim_{x \to 0.5} f(x)$ to one decimal place.'
            answer: '1.5'
            answer_contract: {"kind":"approx","decimals":1}
            solution_sketch: 'Substitution gives $f(0.4) = 1.32$, $f(0.49) = 1.4802$, $f(0.51) = 1.5202$ and $f(0.6) = 1.72$. The outputs from both sides close in on $1.5$. The estimated limit is $1.5$.'
          - problem: 'A shop''s daily profit is $P(x) = 3x^2 - 2x$ dollars when the price is $x$ dollars. Compute $P(3.9)$, $P(3.99)$, $P(4.01)$ and $P(4.1)$, and estimate the profit that $P(x)$ approaches as $x \to 4$.'
            answer: '40'
            answer_contract: {"kind":"unit","quantity":"dollar","unit":"dollar","allow_omitted":true}
            solution_sketch: 'Substitution gives $P(3.9) = 37.83$, $P(3.99) = 39.7803$, $P(4.01) = 40.2203$ and $P(4.1) = 42.23$. The outputs from both sides close in on $40$. The profit approaches $40$ dollars.'
          - problem: 'Let $f(x) = x^2 - 4x + 5$. Compute $f(2.9)$, $f(2.99)$, $f(3.01)$ and $f(3.1)$, and use them to estimate $\lim_{x \to 3} f(x)$.'
            answer: '2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Substitution gives $f(2.9) = 1.81$, $f(2.99) = 1.9801$, $f(3.01) = 2.0201$ and $f(3.1) = 2.21$. The outputs from both sides close in on $2$. The estimated limit is $2$.'
      - id: kp3
        name: 'Read one-sided trends from a table'
        key_prerequisites: [evaluating-functions]
        constraints: 'one-sided reads only; no limit-existence theory beyond comparing the two sides'
        exemplars:
          - problem: 'A table gives $h(0.9) = 2.61$, $h(0.99) = 2.9601$, $h(0.999) = 2.996$. What value does $h(x)$ approach as $x \to 1^-$?'
            answer: '3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The inputs $0.9$, $0.99$ and $0.999$ are all below $1$ and close in on $1$. The outputs $2.61$, $2.9601$ and $2.996$ climb toward $3$. The left-hand limit is $3$.'
          - problem: 'A table gives $f(3.9) = 2$, $f(3.99) = 2$, $f(4.01) = 7$, $f(4.1) = 7$. What value does $f(x)$ approach as $x$ approaches $4$ from the right?'
            answer: '7'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The right side uses only the inputs $4.01$ and $4.1$, which are above $4$. Both give the output $7$, so the outputs stay at $7$. The right-hand limit is $7$.'
          - problem: 'A table gives $g(3.9) = 3.1$, $g(3.99) = 3.19$, $g(3.999) = 3.199$. Find the left-hand limit of $g(x)$ as $x$ approaches $4$.'
            answer: '3.2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The inputs $3.9$, $3.99$ and $3.999$ are below $4$ and close in on $4$. The outputs $3.1$, $3.19$ and $3.199$ rise and settle at $3.2$. The left-hand limit is $3.2$.'
          - problem: 'A table gives $p(-1.1) = 5$, $p(-1.01) = 5$, $p(-0.99) = 9$, $p(-0.9) = 9$. Does the table suggest that $\lim_{x \to -1} p(x)$ exists?'
            answer: 'no'
            answer_contract: {"kind":"label","options":[["yes","it does","it exists","the limit exists","does exist","exists","yes it does"],["no","it does not","it does not exist","the limit does not exist","does not exist","doesn't exist","it doesn't exist","DNE"]]}
            solution_sketch: 'The inputs left of $-1$ give the output $5$. The inputs right of $-1$ give the output $9$. The two sides approach different values, so the table suggests that the limit does not exist.'
          - problem: 'A table gives $h(0.1) = -1.1$, $h(0.01) = -1.46$, $h(0.001) = -1.496$. Find the right-hand limit of $h(x)$ as $x$ approaches $0$.'
            answer: '-1.5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The inputs $0.1$, $0.01$ and $0.001$ are above $0$ and close in on $0$. The outputs $-1.1$, $-1.46$ and $-1.496$ fall and settle at $-1.5$. The right-hand limit is $-1.5$.'
          - problem: 'A probe logs its reading $R$ at times just after $t = 10$ seconds: $R(10.1) = 49$, $R(10.01) = 48.55$, $R(10.001) = 48.505$. Find the right-hand limit of $R(t)$ as $t$ approaches $10$.'
            answer: '48.5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The times $10.1$, $10.01$ and $10.001$ are all greater than $10$ and close in on $10$. The readings $49$, $48.55$ and $48.505$ fall and settle at $48.5$. The right-hand limit is $48.5$.'
          - problem: 'A valve in a tank is changed at $t = 6$ minutes. The water level $L$ in centimetres is logged as $L(5.9) = 39.6$, $L(5.99) = 39.96$, $L(5.999) = 39.996$ before the change and $L(6.001) = 42.002$, $L(6.01) = 42.02$, $L(6.1) = 42.2$ after it. What level does the table suggest just before the change?'
            answer: '40'
            answer_contract: {"kind":"unit","quantity":"length","unit":"cm","allow_omitted":true}
            solution_sketch: 'Only the times before $6$ matter, and they are $5.9$, $5.99$ and $5.999$. The levels $39.6$, $39.96$ and $39.996$ rise toward $40$. The level just before the change is $40$ centimetres.'
    diagnostic_exemplar:
      problem: 'For $g(x) = 2x + 1$, compute $g(2.9)$, $g(2.99)$, $g(3.01)$, $g(3.1)$ and use them to estimate $\lim_{x \to 3} g(x)$.'
      answer: '7'
      solution_sketch: 'The four values are $6.8$, $6.98$, $7.02$, $7.2$ — they close in on $7$ from the left and from the right, so the limit is $7$.'
    anki_seeds:
      - front: "To estimate lim_{x→a} f(x) numerically, evaluate f at inputs that..."
        back: "approach a from BOTH sides (e.g. a ± 0.1, a ± 0.01), never at a itself"
        type: basic
      - front: "A table of values can only ___ a limit, never ___ it."
        back: "suggest (estimate); prove"
        type: basic

  - id: limits-graphical-numerical
    name: Limits Graphically and Numerically
    core: true
    difficulty: 0.45
    drill: false
    answer_kind: numeric
    expected_time_secs: 90
    prerequisites:
      - id: limits-from-tables
        weight: 0.8
        key: true
      - id: function-notation
        weight: 0.5
        key: true
      - id: domain-range
        weight: 0.4
      - id: coordinate-plane
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: 'Read limits from a graph'
        key_prerequisites: [limits-from-tables, function-notation]
        constraints: 'graphs described by a base curve plus open/filled dots; heights are small integers'
        exemplars:
          - problem: 'The graph of $f$ is the line $y = x + 1$ with an open dot at $(2, 3)$ and a filled dot at $(2, 5)$, so $f(2) = 5$. Find $\lim_{x \to 2} f(x)$.'
            answer: '3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Both branches of the line head to the height $3$ as $x$ nears $2$, and the open dot marks that height. The filled dot gives $f(2) = 5$, which does not affect the limit. The limit is $3$.'
          - problem: 'The graph of $g$ is the parabola $y = x^2$ with a hole at $(1, 1)$ and no other marked point, so $g(1)$ is undefined. Find $\lim_{x \to 1} g(x)$.'
            answer: '1'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The parabola closes in on the height $1$ from both sides of $x = 1$. A limit does not need the function to be defined at the point. The limit is $1$.'
          - problem: 'The graph of a cyclist''s speed $v(t)$, in metres per second, is the line $v = 2t + 4$ except at $t = 3$, where there is an open dot at $(3, 10)$ and a filled dot at $(3, 0)$ for a brief stop. What speed does the graph approach as $t \to 3$?'
            answer: '10'
            answer_contract: {"kind":"unit","quantity":"speed","unit":"m/s","allow_omitted":true}
            solution_sketch: 'Along the line $v = 2t + 4$ the height at $t = 3$ would be $2 \cdot 3 + 4 = 10$, and the open dot marks it. The stop at $(3, 0)$ is a single point and does not change the limit. The speed approaches $10$ metres per second.'
          - problem: 'The graph of $f$ is the line $y = 3x - 1$ with a hole at $(2, 5)$. Find $\lim_{x \to 2} f(x)$.'
            answer: '5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The line $y = 3x - 1$ reaches the height $3 \cdot 2 - 1 = 5$ at $x = 2$. The hole removes the point but not the height that both sides approach. The limit is $5$.'
          - problem: 'The graph of $h$ is $y = x^3 - 4$ for $x < 1$ and $y = -3$ for $x > 1$, with a filled dot at $(1, -3)$. Find $\lim_{x \to 1} h(x)$.'
            answer: '-3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'On the left, the cubic $x^3 - 4$ approaches $1^3 - 4 = -3$. On the right, the horizontal line already sits at $-3$. Both sides agree, so the limit is $-3$.'
          - problem: 'The graph of the depth $d(t)$ of water in a basin, in metres, is the parabola $d = t^2 + 1$ except at $t = 2$, where there is an open dot at $(2, 5)$ and a filled dot at $(2, 9)$. What depth does the graph approach as $t \to 2$?'
            answer: '5'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'Along the parabola $d = t^2 + 1$ the height at $t = 2$ would be $2^2 + 1 = 5$, and the open dot marks it. The filled dot at $(2, 9)$ is a single point and does not change the limit. The depth approaches $5$ metres.'
          - problem: 'The graph of $p$ is $y = \sqrt{x}$ with a hole at $(4, 2)$. Find $\lim_{x \to 4} p(x)$.'
            answer: '2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The curve $y = \sqrt{x}$ reaches the height $\sqrt{4} = 2$ at $x = 4$. The hole removes the point but not the height that both sides approach. The limit is $2$.'
          - problem: 'The graph of $g$ is the parabola $y = x^2 + 2$ with a filled dot at $(3, 11)$. Find $\lim_{x \to 3} g(x)$.'
            answer: '11'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The parabola reaches the height $3^2 + 2 = 11$ at $x = 3$, and the filled dot sits on the curve. Both sides head to that height, so the limit is $11$.'
      - id: kp2
        name: 'The limit ignores the value at the point'
        key_prerequisites: [function-notation, domain-range]
        constraints: 'piecewise redefinition at a single point; limit differs from the function value'
        try_first:
          problem: 'Let $f(x) = 4x - 1$ for $x \ne 2$ and $f(2) = 0$. As $x$ gets closer and closer to $2$, what number do the values $f(x)$ get closer to?'
          answer_contract: {"kind":"exact"}
          answer: '7'
          reveal: 'The single value $f(2) = 0$ is far from the trend, but the nearby values $f(1.99) = 6.96$ and $f(2.01) = 7.04$ close in on $7$. A limit follows the nearby values and ignores $f(2)$.'
        exemplars:
          - problem: 'Let $f(x) = x + 2$ for $x \ne 1$ and $f(1) = 5$. Find $\lim_{x \to 1} f(x)$.'
            answer: '3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Near $x = 1$ but not at $x = 1$, the function is $f(x) = x + 2$, which approaches $1 + 2 = 3$. The value $f(1) = 5$ does not affect the limit. The limit is $3$.'
          - problem: 'Let $g(x) = x^2$ for $x \ne 2$ and $g(2) = 0$. Find $\lim_{x \to 2} g(x)$.'
            answer: '4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Near $x = 2$ but not at $x = 2$, the function is $g(x) = x^2$, which approaches $2^2 = 4$. The value $g(2) = 0$ does not affect the limit. The limit is $4$.'
          - problem: 'A sensor''s reading is $r(t) = 2t + 1$ at every time $t \ne 3$, but a glitch records $r(3) = 0$. What value does the reading approach as $t \to 3$?'
            answer: '7'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Near $t = 3$ but not at $t = 3$, the reading is $2t + 1$, which approaches $2 \cdot 3 + 1 = 7$. The glitch $r(3) = 0$ is a single point and does not change the limit. The reading approaches $7$.'
          - problem: 'Let $f(x) = \frac{x^2 - 9}{x - 3}$ for $x \ne 3$ and $f(3) = 100$. Find $\lim_{x \to 3} f(x)$.'
            answer: '6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'For $x \ne 3$, the numerator factors as $(x - 3)(x + 3)$ and the factor $x - 3$ cancels, leaving $x + 3$. Then $x + 3$ approaches $6$ as $x$ nears $3$. The value $f(3) = 100$ is ignored, so the limit is $6$.'
          - problem: 'Let $f(x) = x^2 - 1$ for $x \ne 2$ and $f(2) = 10$. Is $\lim_{x \to 2} f(x)$ equal to $f(2)$?'
            answer: 'no'
            answer_contract: {"kind":"label","options":[["yes","it is","they are equal","equal","the same","they are the same"],["no","it is not","not equal","they are not equal","isn't equal","not the same","they are not the same"]]}
            solution_sketch: 'Near $x = 2$ but not at $x = 2$, the function is $x^2 - 1$, which approaches $3$. The value $f(2)$ is $10$, so the limit $3$ and the value $10$ are not equal.'
          - problem: 'The graph of $f$ is $y = \sqrt{x + 4}$ at every $x \ne 0$, and there is a filled point at $(0, 9)$. Find $\lim_{x \to 0} f(x)$.'
            answer: '2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Near $x = 0$ but not at $x = 0$, the graph follows $y = \sqrt{x + 4}$, which approaches $\sqrt{4} = 2$. The filled point at $(0, 9)$ is ignored by the limit. The limit is $2$.'
          - problem: 'The temperature of a sample is $T(t) = t^2 - 2$ degrees Celsius at every time $t \ne 4$ minutes, and the logger stores $T(4) = 10$. What temperature does $T(t)$ approach as $t \to 4$?'
            answer: '14'
            answer_contract: {"kind":"unit","quantity":"temperature","unit":"°C","allow_omitted":true}
            solution_sketch: 'Near $t = 4$ but not at $t = 4$, the temperature is $t^2 - 2$, which approaches $4^2 - 2 = 14$. The stored value $T(4) = 10$ is a single point and does not change the limit. The temperature approaches $14$.'
          - problem: 'A logger computes the average speed $v(t) = \frac{t^2 - 16}{t - 4}$ for $t \ne 4$ and stores $v(4) = 0$. What value does $v(t)$ approach as $t \to 4$?'
            answer: '8'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'For $t \ne 4$, the numerator factors as $(t - 4)(t + 4)$ and the factor $t - 4$ cancels, leaving $t + 4$. Then $t + 4$ approaches $8$ as $t$ nears $4$. The stored value $v(4) = 0$ is ignored, so the limit is $8$.'
      - id: kp3
        name: 'Recognize when a limit does not exist'
        key_prerequisites: [function-notation, limits-from-tables]
        constraints: 'left and right values approach two different finite numbers; answer is DNE'
        exemplars:
          - problem: 'Let $f(x) = \frac{|x|}{x}$. A table gives $f(-0.1) = -1$, $f(-0.01) = -1$, $f(0.01) = 1$, $f(0.1) = 1$. What is $\lim_{x \to 0} f(x)$?'
            answer: 'DNE'
            answer_contract: {"kind":"label","options":[["DNE","does not exist","no limit","the limit does not exist","it does not exist","limit does not exist","D.N.E."],["infinity","∞","+∞","positive infinity"]]}
            solution_sketch: 'From the left the outputs are $-1$, and from the right they are $1$. The two sides approach different numbers, so the two-sided limit does not exist.'
          - problem: 'The graph of $g$ is the parabola $y = x^2$ for $x < 2$ and the line $y = x + 3$ for $x \ge 2$. Does $\lim_{x \to 2} g(x)$ exist?'
            answer: 'no'
            answer_contract: {"kind":"label","options":[["yes","it does","it exists","the limit exists","does exist","exists","yes it does"],["no","it does not","it does not exist","the limit does not exist","does not exist","doesn't exist","it doesn't exist","DNE"]]}
            solution_sketch: 'From the left the parabola approaches $2^2 = 4$. From the right the line approaches $2 + 3 = 5$. The two heights differ, so the limit does not exist.'
          - problem: 'The graph of $g$ is the parabola $y = x^2$ for $x < 2$ and the line $y = x + 3$ for $x \ge 2$. What height does the graph approach as $x$ approaches $2$ from the left?'
            answer: '4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'For $x < 2$ the graph is the parabola $y = x^2$. As $x$ nears $2$ from the left, the height approaches $2^2 = 4$.'
          - problem: 'A courier charges $C(w)$ dollars for a parcel of $w$ kilograms: $C(w) = 5$ for $0 < w \le 1$ and $C(w) = 9$ for $1 < w \le 2$. What does the charge approach as $w$ approaches $1$ from above?'
            answer: '9'
            answer_contract: {"kind":"unit","quantity":"dollar","unit":"dollar","allow_omitted":true}
            solution_sketch: 'Weights just above $1$ kilogram fall in the second band, where the charge is $9$ dollars. The charge from above approaches $9$ dollars, although the charge at exactly $1$ kilogram is $5$ dollars.'
          - problem: 'A table for $f$ near $x = 2$ lists $f(1.9) = 6.9$, $f(1.99) = 6.99$, $f(2) = 0$, $f(2.01) = 7.01$, $f(2.1) = 7.1$. What is $\lim_{x \to 2} f(x)$?'
            answer: '7'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The rows on both sides, $6.9$, $6.99$, $7.01$ and $7.1$, close in on $7$. The row $f(2) = 0$ does not matter, since the limit looks at inputs near $2$ and not at $2$. The limit is $7$.'
          - problem: 'A heater setting is $S(t) = 18$ degrees Celsius for $t < 10$ minutes and $S(t) = 22$ degrees Celsius for $t > 10$ minutes. What does $S(t)$ approach as $t$ approaches $10$ from below?'
            answer: '18'
            answer_contract: {"kind":"unit","quantity":"temperature","unit":"°C","allow_omitted":true}
            solution_sketch: 'Times just below $10$ minutes belong to the first part, where the setting is $18$ degrees. The limit from below is $18$, even though the setting from above is $22$.'
          - problem: 'A toll bridge charges $T(h) = 4$ dollars when a trip starts at an hour $h < 6$ of the day and $T(h) = 7$ dollars when it starts at an hour $h \ge 6$. By how much does the charge approached from above $h = 6$ differ from the charge approached from below?'
            answer: '3'
            answer_contract: {"kind":"unit","quantity":"dollar","unit":"dollar","allow_omitted":true}
            solution_sketch: 'Approaching $h = 6$ from below, the charge is $4$ dollars. Approaching from above, the charge is $7$ dollars. The two one-sided values differ by $7 - 4 = 3$ dollars, so $T$ has no limit at $h = 6$.'
    diagnostic_exemplar:
      problem: 'The graph of $h$ is the line $y = 2x$ for $x < 3$ and the horizontal line $y = 1$ for $x > 3$, with a filled dot at $(3, 1)$. Find $\lim_{x \to 3} h(x)$.'
      answer: 'DNE'
      answer_contract: {"kind":"label","options":[["DNE","does not exist","no limit","the limit does not exist","it does not exist","limit does not exist","D.N.E."],["infinity","∞","+∞","positive infinity"]]}
      solution_sketch: 'The left branch rises to $6$ while the right branch sits at $1$; the value $h(3) = 1$ is irrelevant, and because the one-sided limits differ the two-sided limit does not exist.'
    anki_seeds:
      - front: "The limit of f(x) as x → a depends on values of f near a, but never on..."
        back: "the value f(a) itself (f need not even be defined at a)"
        type: basic
      - front: "A two-sided limit exists only when..."
        back: "the left-hand and right-hand limits both exist and are equal"
        type: basic

  - id: limit-laws
    name: Limit Laws
    core: true
    difficulty: 0.5
    drill: false
    answer_kind: numeric
    expected_time_secs: 90
    prerequisites:
      - id: limits-graphical-numerical
        weight: 0.8
        key: true
      - id: evaluating-expressions
        weight: 0.5
        key: true
      - id: order-of-operations
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: 'Sum, difference, and constant-multiple laws'
        key_prerequisites: [limits-graphical-numerical]
        constraints: 'given limits are small integers; combine with sum/difference/constant-multiple laws only'
        exemplars:
          - problem: 'Given $\lim_{x \to a} f(x) = 3$ and $\lim_{x \to a} g(x) = -2$, find $\lim_{x \to a} [f(x) + g(x)]$.'
            answer: '1'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'By the sum law, the limit of the sum is the sum of the limits. So the limit is $3 + (-2) = 1$.'
          - problem: 'Given $\lim_{x \to a} f(x) = 3$ and $\lim_{x \to a} g(x) = -2$, find $\lim_{x \to a} [2f(x) - g(x)]$.'
            answer: '8'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'By the constant-multiple law and the difference law, the limit is $2 \cdot 3 - (-2)$. That equals $6 + 2 = 8$.'
          - problem: 'As $t \to 5$ seconds, the height $h_1(t)$ of one drone approaches $12$ m and the height $h_2(t)$ of a second drone approaches $7$ m. What does the difference $h_1(t) - h_2(t)$ approach?'
            answer: '5'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'By the difference law, the limit of the difference is the difference of the limits. So the limit is $12 - 7 = 5$, and the height difference approaches $5$ metres.'
          - problem: 'Suppose $\lim_{x \to a} f(x) = 4$ and $\lim_{x \to a} g(x) = -3$. What is $\lim_{x \to a} [f(x) - g(x)]$?'
            answer: '7'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The difference law gives $\lim f(x) - \lim g(x) = 4 - (-3)$. The correct value is $4 + 3 = 7$.'
          - problem: 'Given $\lim_{x \to a} f(x) = 3$ and $\lim_{x \to a} [4f(x) + 3g(x)] = 18$, find $\lim_{x \to a} g(x)$.'
            answer: '2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'By the constant-multiple law and the sum law, $4 \cdot 3 + 3L = 18$ where $L$ is the limit of $g$. Then $3L = 6$, so $L = 2$.'
          - problem: 'As the price $p$ approaches $8$ dollars, a shop''s revenue $R(p)$ approaches $240$ dollars and its cost $C(p)$ approaches $90$ dollars. The shop also pays a tax of one tenth of its revenue, so its profit is $R(p) - C(p) - \frac{1}{10}R(p)$. What profit does it approach?'
            answer: '126'
            answer_contract: {"kind":"unit","quantity":"dollar","unit":"dollar","allow_omitted":true}
            solution_sketch: 'By the constant-multiple, sum and difference laws, the limit of the profit is $240 - 90 - \frac{1}{10} \cdot 240$. That equals $240 - 90 - 24 = 126$ dollars.'
          - problem: 'Given $\lim_{x \to a} [f(x) + g(x)] = 11$ and $\lim_{x \to a} [f(x) - g(x)] = 3$, find $\lim_{x \to a} [2f(x) + g(x)]$.'
            answer: '18'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Adding the two given limits gives $2 \lim f(x) = 14$, so $\lim f(x) = 7$. The sum law then gives $\lim g(x) = 11 - 7 = 4$. So $\lim [2f(x) + g(x)] = 2 \cdot 7 + 4 = 18$.'
          - problem: 'Given $\lim_{x \to a} f(x) = 5$, $\lim_{x \to a} g(x) = 4$, and $\lim_{x \to a} [c f(x) - g(x)] = 11$, find the constant $c$.'
            answer: '3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'By the constant-multiple law and the difference law, the limit equals $5c - 4$. Setting $5c - 4 = 11$ gives $5c = 15$, so $c = 3$.'
          - problem: 'Given $\lim_{x \to a} g(x) = 4$ and $\lim_{x \to a} [7f(x) - 3g(x)] = 30$, find $\lim_{x \to a} f(x)$.'
            answer: '6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'By the constant-multiple law and the difference law, $7L - 3 \cdot 4 = 30$ where $L$ is the limit of $f$. Then $7L = 42$, so $L = 6$.'
      - id: kp2
        name: 'Product and quotient laws'
        key_prerequisites: [limits-graphical-numerical, evaluating-expressions]
        constraints: 'denominator limit nonzero for quotients; include a power via the product law'
        exemplars:
          - problem: 'Given $\lim_{x \to a} f(x) = 3$ and $\lim_{x \to a} g(x) = -2$, find $\lim_{x \to a} [f(x) \cdot g(x)]$.'
            answer: '-6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'By the product law, the limit of the product is the product of the limits. So the limit is $3 \cdot (-2) = -6$.'
          - problem: 'Given $\lim_{x \to a} f(x) = 3$ and $\lim_{x \to a} g(x) = -2$, find $\lim_{x \to a} \frac{f(x)}{g(x)}$.'
            answer: '-3/2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The quotient law applies because the denominator limit $-2$ is not zero. The limit is $\frac{3}{-2} = -\frac{3}{2}$.'
          - problem: 'Given $\lim_{x \to a} f(x) = 4$, find $\lim_{x \to a} [f(x)]^2$.'
            answer: '16'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The square $[f(x)]^2$ is $f(x) \cdot f(x)$, so the product law gives $4 \cdot 4 = 16$. The limit is $16$.'
          - problem: 'As $t \to 4$, the length $L(t)$ of a rectangle approaches $6$ m and its width $W(t)$ approaches $2.5$ m. What area does the rectangle approach?'
            answer: '15'
            answer_contract: {"kind":"unit","quantity":"area","unit":"m^2","allow_omitted":true}
            solution_sketch: 'The area is $L(t) \cdot W(t)$, so the product law applies. The limit is $6 \cdot 2.5 = 15$, and the area approaches $15$ square metres.'
          - problem: 'During a trial, the distance $d(t)$ travelled by a car approaches $120$ km and the time $T(t)$ approaches $1.5$ hours as $t \to 9$. What average speed $\frac{d(t)}{T(t)}$ does the car approach?'
            answer: '80'
            answer_contract: {"kind":"unit","quantity":"speed","unit":"km/h","allow_omitted":true}
            solution_sketch: 'The quotient law applies because the time limit $1.5$ is not zero. The limit is $\frac{120}{1.5} = 80$, so the average speed approaches $80$ km/h.'
          - problem: 'Given $\lim_{x \to 3} f(x) = 2$ and $\lim_{x \to 3} g(x) = -1$, find $\lim_{x \to 3} \frac{x^2 f(x)}{g(x)}$.'
            answer: '-18'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'By the product law, the limit of $x^2 f(x)$ is $9 \cdot 2 = 18$. The denominator limit $-1$ is not zero, so the quotient law gives $\frac{18}{-1} = -18$.'
          - problem: 'Suppose $\lim_{x \to a} f(x) = 5$ and $\lim_{x \to a} g(x) = 0$. Can the quotient law be used to find $\lim_{x \to a} \frac{f(x)}{g(x)}$?'
            answer: 'no'
            answer_contract: {"kind":"label","options":[["yes","it can","the law applies","it applies","can be used","yes it can"],["no","it cannot","the law does not apply","it does not apply","can't","it can't","cannot be used","no it cannot"]]}
            solution_sketch: 'The quotient law needs the limit of the denominator to be nonzero. Here the limit of $g$ is $0$, so the law does not apply and another method is needed.'
          - problem: 'Given $\lim_{x \to 5} f(x) = 2$ and $\lim_{x \to 5} g(x) = 3$, find $\lim_{x \to 5} \frac{[x f(x)]^2}{g(x)}$.'
            answer: '100/3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'By the product law, the limit of $x f(x)$ is $5 \cdot 2 = 10$, and the limit of its square is $10^2 = 100$. The denominator limit $3$ is not zero, so the quotient law gives $\frac{100}{3}$.'
          - problem: 'Given $\lim_{x \to -2} [x f(x) g(x)] = 20$ and $\lim_{x \to -2} f(x) = -1$, find $\lim_{x \to -2} [f(x) g(x)]$.'
            answer: '-10'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'By the product law, $(-2)(-1) \cdot L = 20$ where $L$ is the limit of $g$, so $2L = 20$ and $L = 10$. Then the limit of $f(x) g(x)$ is $(-1) \cdot 10 = -10$.'
      - id: kp3
        name: 'Direct substitution for polynomials and rational functions'
        key_prerequisites: [evaluating-expressions]
        constraints: 'polynomial or rational function with nonzero denominator at the point; integer or simple fraction answers'
        exemplars:
          - problem: 'Evaluate $\lim_{x \to 2} (x^2 + 3x - 1)$.'
            answer: '9'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'A polynomial is continuous everywhere, so direct substitution gives the limit. At $x = 2$ the value is $4 + 6 - 1 = 9$.'
          - problem: 'Evaluate $\lim_{x \to -1} (x^3 - 2x)$.'
            answer: '1'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'A polynomial is continuous everywhere, so direct substitution gives the limit. At $x = -1$ the value is $-1 + 2 = 1$.'
          - problem: 'Evaluate $\lim_{x \to 3} \frac{x + 1}{x - 1}$.'
            answer: '2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The denominator $x - 1$ equals $2$ at $x = 3$, which is not zero, so direct substitution applies. The limit is $\frac{4}{2} = 2$.'
          - problem: 'What is $\lim_{x \to 3} (2x^2 - x)$?'
            answer: '15'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Only $x$ is squared in $2x^2$, not $2 \cdot 3$. Substitution gives $2 \cdot 3^2 - 3 = 18 - 3 = 15$.'
          - problem: 'Evaluate $\lim_{x \to 2} \frac{x^2 - 1}{x + 3}$.'
            answer: '3/5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The denominator $x + 3$ equals $5$ at $x = 2$, which is not zero, so direct substitution applies. The numerator is $2^2 - 1 = 3$, so the limit is $\frac{3}{5}$.'
          - problem: 'The average cost per item of making $x$ items is $A(x) = \frac{x^2 + 50}{x + 5}$ dollars. What does $A(x)$ approach as $x \to 5$?'
            answer: '7.5'
            answer_contract: {"kind":"unit","quantity":"dollar","unit":"dollar","allow_omitted":true}
            solution_sketch: 'The denominator $x + 5$ equals $10$ at $x = 5$, which is not zero, so direct substitution applies. The limit is $\frac{25 + 50}{10} = 7.5$ dollars.'
          - problem: 'A ball''s height is $h(t) = -5t^2 + 12t + 2$ metres at time $t$ seconds. What height does the ball approach as $t \to 2$?'
            answer: '6'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'The height is a polynomial in $t$, so direct substitution gives the limit. At $t = 2$ the value is $-20 + 24 + 2 = 6$ metres.'
          - problem: 'Evaluate $\lim_{x \to -2} (2x^2 + x - 3)$.'
            answer: '3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'A polynomial is continuous everywhere, so direct substitution gives the limit. At $x = -2$ the value is $8 - 2 - 3 = 3$.'
          - problem: 'Evaluate $\lim_{x \to 1} \frac{x + 3}{2x + 1}$.'
            answer: '4/3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The denominator $2x + 1$ equals $3$ at $x = 1$, which is not zero, so direct substitution applies. The limit is $\frac{4}{3}$.'
    diagnostic_exemplar:
      problem: 'Given $\lim_{x \to 3} f(x) = 2$, evaluate $\lim_{x \to 3} \frac{x^2 f(x) - 2}{x + 1}$.'
      answer: '4'
      solution_sketch: 'Direct substitution gives $x^2 \to 9$ and $x + 1 \to 4$; the product law gives $9 \cdot 2 = 18$, the difference law $16$, and the quotient law $16/4 = 4$.'
    anki_seeds:
      - front: "The quotient limit law lim f/g = (lim f)/(lim g) requires..."
        back: "lim g ≠ 0"
        type: basic
      - front: "For a polynomial p, lim_{x→a} p(x) = ?"
        back: "p(a) — evaluate by direct substitution (polynomials are continuous everywhere)"
        type: basic

  - id: one-sided-limits
    name: One-Sided Limits
    core: true
    difficulty: 0.5
    drill: false
    answer_kind: expression
    expected_time_secs: 90
    prerequisites:
      - id: limits-graphical-numerical
        weight: 0.8
        key: true
      - id: absolute-value
        weight: 0.5
        key: true
      - id: piecewise-absolute-value-graphs
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: 'One-sided limits where the function lives on one side'
        key_prerequisites: [limits-graphical-numerical]
        constraints: 'square-root expressions defined on one side of the point; limits are small integers'
        exemplars:
          - problem: 'Evaluate $\lim_{x \to 0^+} \sqrt{x}$.'
            answer: '0'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'For $x$ just above $0$, the value $\sqrt{x}$ is small and positive. As $x$ nears $0$, the square root nears $0$. The limit is $0$.'
          - problem: 'Evaluate $\lim_{x \to 2^+} \left(\sqrt{x - 2} + 3\right)$.'
            answer: '3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'For $x$ just above $2$, the radicand $x - 2$ is small and positive, so $\sqrt{x - 2}$ approaches $0$. The expression approaches $0 + 3 = 3$.'
          - problem: 'The function $f(x) = \sqrt{3 - x} + 5$ is defined only for $x \le 3$. Find $\lim_{x \to 3^-} f(x)$.'
            answer: '5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'For $x$ just below $3$, the radicand $3 - x$ is small and positive, so $\sqrt{3 - x}$ approaches $0$. The expression approaches $0 + 5 = 5$.'
          - problem: 'A booster''s speed, in metres per second, is $v(t) = 12 + 3\sqrt{t - 4}$ for times $t \ge 4$ seconds after ignition. What speed does $v(t)$ approach as $t \to 4^+$?'
            answer: '12'
            answer_contract: {"kind":"unit","quantity":"speed","unit":"m/s","allow_omitted":true}
            solution_sketch: 'For $t$ just above $4$, the radicand $t - 4$ is small and positive, so $\sqrt{t - 4}$ approaches $0$. The speed approaches $12 + 3 \cdot 0 = 12$ metres per second.'
          - problem: 'The width of a river delta, in kilometres, is $w(d) = 7 + 2\sqrt{d - 1}$ at a distance $d \ge 1$ km from the source. What width does $w(d)$ approach as $d \to 1^+$?'
            answer: '7'
            answer_contract: {"kind":"unit","quantity":"length","unit":"km","allow_omitted":true}
            solution_sketch: 'For $d$ just above $1$, the radicand $d - 1$ is small and positive, so $\sqrt{d - 1}$ approaches $0$. The width approaches $7 + 2 \cdot 0 = 7$ kilometres.'
          - problem: 'Evaluate $\lim_{x \to 9^+} \left(\sqrt{x - 9} + x\right)$.'
            answer: '9'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'For $x$ just above $9$, the term $\sqrt{x - 9}$ approaches $0$ and the term $x$ approaches $9$. The sum approaches $0 + 9 = 9$.'
          - problem: 'Does $\lim_{x \to 2^-} \sqrt{x - 2}$ exist?'
            answer: 'no'
            answer_contract: {"kind":"label","options":[["yes","it does","it exists","the limit exists","does exist","exists","yes it does"],["no","it does not","it does not exist","the limit does not exist","does not exist","doesn't exist","it doesn't exist","DNE"]]}
            solution_sketch: 'For $x < 2$ the radicand $x - 2$ is negative, so $\sqrt{x - 2}$ has no real values to the left of $2$. Without values on that side, the left-hand limit does not exist.'
          - problem: 'Let $f(x) = \sqrt{x - 4} + 6$. The function has real values on only one side of $x = 4$. What value does $f(x)$ approach as $x$ approaches $4$ from that side?'
            answer: '6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The radicand $x - 4$ is negative for $x < 4$, so only the right side has real values. For $x$ just above $4$, $\sqrt{x - 4}$ approaches $0$, so $f(x)$ approaches $0 + 6 = 6$.'
          - problem: 'Evaluate $\lim_{x \to 3^+} \left(2\sqrt{x - 3} - 1\right)$.'
            answer: '-1'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'For $x$ just above $3$, the radicand $x - 3$ is small and positive, so $\sqrt{x - 3}$ approaches $0$. The expression approaches $2 \cdot 0 - 1 = -1$.'
      - id: kp2
        name: 'Absolute-value sign quotients'
        key_prerequisites: [absolute-value, limits-graphical-numerical]
        constraints: 'quotients of the form c|x - a|/(x - a); resolve the absolute value by the sign of the side'
        try_first:
          problem: 'What is the value of $\frac{|x - 5|}{x - 5}$ at $x = 4.9$?'
          answer_contract: {"kind":"exact"}
          answer: '-1'
          reveal: 'At $x = 4.9$ the bars turn $-0.1$ into $0.1$, so the quotient is $0.1 / (-0.1) = -1$. Every $x < 5$ gives $-1$, and that is what a limit from the left records.'
        exemplars:
          - problem: 'Evaluate $\lim_{x \to 5^-} \frac{|x - 5|}{x - 5}$.'
            answer: '-1'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'For $x < 5$, the quantity $x - 5$ is negative, so $|x - 5| = -(x - 5)$. The quotient is $-1$ for every $x < 5$, so the limit is $-1$.'
          - problem: 'Evaluate $\lim_{x \to 0^+} \frac{2|x|}{x}$.'
            answer: '2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'For $x > 0$, the absolute value is $|x| = x$. The quotient is $\frac{2x}{x} = 2$ for every $x > 0$, so the limit is $2$.'
          - problem: 'Evaluate $\lim_{x \to -2^+} \frac{x + 2}{|x + 2|}$.'
            answer: '1'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'For $x > -2$, the quantity $x + 2$ is positive, so $|x + 2| = x + 2$. The quotient is $1$ for every $x > -2$, so the limit is $1$.'
          - problem: 'Evaluate $\lim_{x \to 3^-} \frac{4|x - 3|}{x - 3}$.'
            answer: '-4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'For $x < 3$, the quantity $x - 3$ is negative, so $|x - 3| = -(x - 3)$. The quotient is $-4$ for every $x < 3$, so the limit is $-4$.'
          - problem: 'A quality gauge shows $g(x) = \frac{3|x - 40|}{x - 40}$ for a part of length $x$ millimetres. What value does the gauge show as $x$ approaches $40$ from above?'
            answer: '3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'For $x > 40$, the quantity $x - 40$ is positive, so $|x - 40| = x - 40$. The reading is $3$ for every $x > 40$, so the limit from above is $3$.'
          - problem: 'A signal has the value $s(t) = \frac{6|t - 2|}{t - 2}$ volts at time $t$ seconds. What value does the signal approach as $t \to 2^-$?'
            answer: '-6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'For $t < 2$, the quantity $t - 2$ is negative, so $|t - 2| = -(t - 2)$. The signal is $-6$ for every $t < 2$, so the limit is $-6$ volts.'
          - problem: 'Evaluate $\lim_{x \to 1^-} \frac{|2x - 2|}{x - 1}$.'
            answer: '-2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'For $x < 1$, the quantity $2x - 2$ is negative, so $|2x - 2| = -(2x - 2) = -2(x - 1)$. The quotient is $-2$ for every $x < 1$, so the limit is $-2$.'
          - problem: 'Evaluate $\lim_{x \to 6^-} \left(5 + \frac{|x - 6|}{x - 6}\right)$.'
            answer: '4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'For $x < 6$, the quotient $\frac{|x - 6|}{x - 6}$ equals $-1$. So the expression equals $5 + (-1) = 4$ for every $x < 6$, and the limit is $4$.'
      - id: kp3
        name: 'Two-sided limit exists iff the one-sided limits agree'
        key_prerequisites: [limits-graphical-numerical]
        constraints: 'compare given or computed one-sided limits; answer a number, or DNE when the sides disagree'
        exemplars:
          - problem: 'Given $\lim_{x \to 3^-} f(x) = 4$ and $\lim_{x \to 3^+} f(x) = 4$, find $\lim_{x \to 3} f(x)$.'
            answer: '4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The left-hand limit and the right-hand limit are both $4$. Since they agree, the two-sided limit exists and equals $4$.'
          - problem: 'Suppose that $\lim_{x \to 1^-} g(x) = 2$ and $\lim_{x \to 1^+} g(x) = 6$. Find $\lim_{x \to 1} g(x)$.'
            answer: 'DNE'
            answer_contract: {"kind":"label","options":[["DNE","does not exist","no limit","the limit does not exist","it does not exist","limit does not exist","D.N.E."],["infinity","∞","+∞","positive infinity"]]}
            solution_sketch: 'The left-hand limit is $2$ and the right-hand limit is $6$. The two one-sided limits disagree, so the two-sided limit does not exist.'
          - problem: 'Let $f(x) = \frac{3|x - 5|}{x - 5}$. Find $\lim_{x \to 5^-} f(x)$.'
            answer: '-3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'For $x < 5$, the quantity $x - 5$ is negative, so $|x - 5| = -(x - 5)$. Then $f(x) = -3$ for every $x < 5$, and the left-hand limit is $-3$.'
          - problem: 'Let $f(x) = \frac{3|x - 5|}{x - 5}$. Does $\lim_{x \to 5} f(x)$ exist?'
            answer: 'no'
            answer_contract: {"kind":"label","options":[["yes","it does","it exists","the limit exists","does exist","exists","yes it does"],["no","it does not","it does not exist","the limit does not exist","does not exist","doesn't exist","it doesn't exist","DNE"]]}
            solution_sketch: 'For $x < 5$, the function equals $-3$. For $x > 5$, the function equals $3$. The one-sided limits $-3$ and $3$ disagree, so the two-sided limit does not exist.'
          - problem: 'Let $f(x) = 3x + 1$ for $x < 2$ and $f(x) = x + 5$ for $x \ge 2$. Find $\lim_{x \to 2} f(x)$.'
            answer: '7'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The left-hand limit is $3 \cdot 2 + 1 = 7$. The right-hand limit is $2 + 5 = 7$. The one-sided limits agree, so the two-sided limit is $7$.'
          - problem: 'A table lists $f(x)$ near $x = 2$: from the left $f(1.9) = 4.7$, $f(1.99) = 4.97$, $f(1.999) = 4.997$, and from the right $f(2.1) = 4.8$, $f(2.01) = 4.98$, $f(2.001) = 4.998$. Find $\lim_{x \to 2} f(x)$.'
            answer: '5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'From the left the outputs $4.7$, $4.97$ and $4.997$ climb toward $5$. From the right the outputs $4.8$, $4.98$ and $4.998$ also climb toward $5$. The sides agree, so the limit is $5$.'
          - problem: 'Let $f(x) = 2x + k$ for $x < 1$ and $f(x) = 4x - 3$ for $x \ge 1$. For which value of $k$ does $\lim_{x \to 1} f(x)$ exist?'
            answer: '-1'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The right-hand limit is $4 \cdot 1 - 3 = 1$. The left-hand limit is $2 \cdot 1 + k = 2 + k$. The limit exists only when the two agree, so $2 + k = 1$ and $k = -1$.'
          - problem: 'A parking garage charges $f(t) = 2t + 3$ dollars for a stay of $t < 2$ hours and $f(t) = 5t - 3$ dollars for a stay of $t \ge 2$ hours. What charge does $f(t)$ approach as $t \to 2$?'
            answer: '7'
            answer_contract: {"kind":"unit","quantity":"dollar","unit":"dollar","allow_omitted":true}
            solution_sketch: 'For $t < 2$ the charge approaches $2 \cdot 2 + 3 = 7$ dollars. For $t \ge 2$ it approaches $5 \cdot 2 - 3 = 7$ dollars. The sides agree, so the charge approaches $7$ dollars.'
          - problem: 'A pump delivers $q(t) = 3t + k$ litres per minute for $t < 5$ minutes and $q(t) = 2t + 8$ litres per minute for $t \ge 5$ minutes. For which value of $k$ does the flow rate approach a single value as $t \to 5$?'
            answer: '3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The right-hand limit is $2 \cdot 5 + 8 = 18$. The left-hand limit is $3 \cdot 5 + k = 15 + k$. The two must agree, so $15 + k = 18$ and $k = 3$.'
    diagnostic_exemplar:
      problem: 'Evaluate $\lim_{x \to 7} \frac{|x - 7|}{x - 7}$.'
      answer: 'DNE'
      answer_contract: {"kind":"label","options":[["DNE","does not exist","no limit","the limit does not exist","it does not exist","limit does not exist","D.N.E."],["infinity","∞","+∞","positive infinity"]]}
      solution_sketch: 'For $x < 7$ the quotient is $-1$ and for $x > 7$ it is $+1$; the one-sided limits disagree, so the two-sided limit does not exist.'
    anki_seeds:
      - front: "lim_{x→a⁻} means x approaches a from values that are ___ a; lim_{x→a⁺} from values ___ a."
        back: "less than; greater than"
        type: basic
      - front: "For x < a, |x - a| equals..."
        back: "-(x - a), so |x - a|/(x - a) = -1 on the left of a"
        type: basic

  - id: limits-piecewise-functions
    name: Limits of Piecewise Functions
    core: true
    difficulty: 0.52
    drill: false
    answer_kind: expression
    expected_time_secs: 120
    prerequisites:
      - id: one-sided-limits
        weight: 0.8
        key: true
      - id: evaluating-functions
        weight: 0.5
        key: true
      - id: piecewise-absolute-value-graphs
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: One-sided limits at a branch point
        key_prerequisites: [one-sided-limits, evaluating-functions]
        exemplars:
          - problem: 'Let $f(x) = 2x + 3$ for $x < 1$ and $f(x) = x^2 + 6$ for $x \geq 1$. Find $\lim_{x \to 1^-} f(x)$.'
            answer: '5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Approaching $1$ from the left means $x < 1$, so the rule is $2x + 3$. Substituting $x = 1$ gives $2(1) + 3 = 5$. The right-hand rule $x^2 + 6$ is not used for a left-hand limit.'
          - problem: 'Let $g(t) = t^2$ for $t < 1$ and $g(t) = 2t - 1$ for $t \geq 1$. Find $\lim_{t \to 1^+} g(t)$.'
            answer: '1'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Approaching $1$ from the right means $t > 1$, so the rule is $2t - 1$. Substituting $t = 1$ gives $2(1) - 1 = 1$. The left rule $t^2$ also gives $1$, so here the two sides agree.'
          - problem: 'Let $h(x) = 3x - 2$ for $x < 4$ and $h(x) = x^2 - 8$ for $x \geq 4$. Does $\lim_{x \to 4} h(x)$ exist?'
            answer: 'no'
            answer_contract: {"kind":"label","options":[["yes","it exists","the limit exists","exists"], ["no","it does not exist","does not exist","dne","no limit","the limit does not exist","limit does not exist","doesn't exist"]]}
            solution_sketch: 'From the left the rule $3x - 2$ gives $3(4) - 2 = 10$. From the right the rule $x^2 - 8$ gives $4^2 - 8 = 8$. The one-sided limits $10$ and $8$ differ, so the limit does not exist.'
          - problem: 'Let $p(x) = x^2 + 2$ for $x < 3$ and $p(x) = 3x + 2$ for $x \geq 3$. Find $\lim_{x \to 3} p(x)$.'
            answer: '11'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The left-hand limit is $3^2 + 2 = 11$. The right-hand limit is $3(3) + 2 = 11$. The two sides agree, so the limit is $11$.'
          - problem: 'A courier charges $C(w) = 4 + 2w$ dollars for a parcel of $w$ kilograms when $w < 5$, and $C(w) = 3w + 1$ dollars when $w \geq 5$. By how much does the charge jump as the weight passes $5$ kilograms?'
            answer: '2'
            answer_contract: {"kind":"unit","quantity":"dollar","unit":"dollar","allow_omitted":true}
            solution_sketch: 'Just below $5$ kilograms the charge approaches $4 + 2(5) = 14$ dollars. At and above $5$ kilograms it approaches $3(5) + 1 = 16$ dollars. The jump is $16 - 14 = 2$ dollars.'
          - problem: 'A tank is drained and then refilled. Its water depth in centimetres is $d(t) = 40 - 3t$ for $0 \leq t < 5$ and $d(t) = 10 + 2t$ for $t \geq 5$, where $t$ is in minutes. What depth does $d(t)$ approach as $t$ approaches $5$ from the right?'
            answer: '20'
            answer_contract: {"kind":"unit","quantity":"length","unit":"cm","allow_omitted":true}
            solution_sketch: 'From the right the rule is $10 + 2t$, because $t \geq 5$ there. Substituting $t = 5$ gives $10 + 2(5) = 20$ centimetres. The left rule would give $25$ centimetres, so the depth jumps at $t = 5$.'
          - problem: 'Let $f(x) = x + 1$ for $x < 2$ and $f(x) = x^2$ for $x \geq 2$. What is the value of $\lim_{x \to 2^-} f(x)$?'
            answer: '3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'A left-hand limit uses the left rule, $x + 1$, and not the value $f(2)$. Substituting $x = 2$ gives $2 + 1 = 3$. The right-hand rule $x^2$ gives $4$, which is not the left-hand limit.'
          - problem: 'Let $f(x) = 5 - x^2$ for $x < -1$ and $f(x) = 3x + 7$ for $x \geq -1$. Find $\lim_{x \to -1^+} f(x)$.'
            answer: '4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Approaching $-1$ from the right means $x > -1$, so the rule is $3x + 7$. Substituting $x = -1$ gives $3(-1) + 7 = 4$. The left rule $5 - x^2$ also gives $4$.'
        constraints: 'two-branch piecewise with polynomial branches; one-sided limits, a verdict on existence, and measured contexts with a jump'
      - id: kp2
        name: Limits away from the branch point
        key_prerequisites: [evaluating-functions]
        exemplars:
          - problem: 'Let $f(x) = x + 1$ for $x < 2$ and $f(x) = x^2$ for $x \geq 2$. Find $\lim_{x \to 1} f(x)$.'
            answer: '2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The point $x = 1$ lies strictly inside the branch $x < 2$, so only $x + 1$ matters near it. Substituting $x = 1$ gives $1 + 1 = 2$. The rule $x^2$ is never used near $1$.'
          - problem: 'Let $g(x) = 2x$ for $x < 3$ and $g(x) = 9 - x$ for $x \geq 3$. Find $\lim_{x \to 5} g(x)$.'
            answer: '4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The point $x = 5$ lies inside the branch $x \geq 3$, so the rule is $9 - x$. Substituting $x = 5$ gives $9 - 5 = 4$. The rule $2x$ is not used near $5$.'
          - problem: 'Let $f(x) = x^2 + 2$ for $x < 3$ and $f(x) = 4x - 1$ for $x \geq 3$. Find $\lim_{x \to 1} f(x)$.'
            answer: '3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Because $1 < 3$, the point $x = 1$ lies inside the first branch, $x^2 + 2$. Substituting $x = 1$ gives $1^2 + 2 = 3$. The second branch plays no part.'
          - problem: 'Let $f(x) = 5 - 2x$ for $x < 4$ and $f(x) = \sqrt{x + 5}$ for $x \geq 4$. Find $\lim_{x \to 20} f(x)$.'
            answer: '5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Because $20 \geq 4$, the point $x = 20$ lies inside the second branch, $\sqrt{x + 5}$. Substituting gives $\sqrt{20 + 5} = \sqrt{25} = 5$. The first branch is not used.'
          - problem: 'Let $f(x) = \frac{x + 1}{x - 2}$ for $x < 1$ and $f(x) = x^2 - 3$ for $x \geq 1$. Find $\lim_{x \to 0} f(x)$.'
            answer: '-1/2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Because $0 < 1$, the point $x = 0$ lies inside the first branch, $\frac{x + 1}{x - 2}$. Substituting $x = 0$ gives $\frac{1}{-2} = -\frac{1}{2}$. The factor $x - 2$ is not zero near $0$, so the substitution is safe.'
          - problem: 'A parking garage charges $f(t) = 2t + 1$ dollars for a stay of $t < 6$ hours and $f(t) = 20 - t$ dollars for a stay of $t \geq 6$ hours. What value does $f(t)$ approach as $t$ approaches $8$ hours?'
            answer: '12'
            answer_contract: {"kind":"unit","quantity":"dollar","unit":"dollar","allow_omitted":true}
            solution_sketch: 'Because $8 \geq 6$, the hour $t = 8$ lies inside the second rule, $20 - t$. Substituting $t = 8$ gives $20 - 8 = 12$ dollars. The first rule applies only below $6$ hours.'
          - problem: 'A room thermostat sets the temperature in degrees Celsius as $T(t) = 18 + 2t$ for $0 \leq t < 3$ and $T(t) = 30 - t$ for $t \geq 3$, where $t$ is in hours. What value does $T(t)$ approach as $t$ approaches $1.5$?'
            answer: '21'
            answer_contract: {"kind":"unit","quantity":"temperature","unit":"°C","allow_omitted":true}
            solution_sketch: 'The time $t = 1.5$ lies inside the branch $t < 3$, so the rule is $18 + 2t$. Substituting gives $18 + 2(1.5) = 21$. The second rule starts only at $t = 3$.'
          - problem: 'A delivery costs $c(w) = 3w + 2$ dollars for a load of $w < 10$ tonnes and $c(w) = 50 - 2w$ dollars for $w \geq 10$ tonnes. What value does $c(w)$ approach as $w$ approaches $12$ tonnes?'
            answer: '26'
            answer_contract: {"kind":"unit","quantity":"dollar","unit":"dollar","allow_omitted":true}
            solution_sketch: 'Because $12 \geq 10$, the weight $w = 12$ lies inside the second rule, $50 - 2w$. Substituting gives $50 - 2(12) = 26$ dollars. The rule $3w + 2$ is not used.'
        constraints: 'the target point sits strictly inside one branch; substitute into that branch only; numeric and measured contexts'
      - id: kp3
        name: Branch points with a separately defined value
        key_prerequisites: [one-sided-limits, evaluating-functions]
        try_first:
          problem: 'Let $f(x) = x + 1$ for $x \neq 2$ and $f(2) = 10$. What number does $f(x)$ approach as $x$ approaches $2$?'
          answer_contract: {"kind":"exact"}
          answer: '3'
          reveal: 'Near $2$ the values are $x + 1$, which come close to $3$, even though $f(2)$ itself is $10$. A limit records where the nearby values head, not the value at the point.'
        exemplars:
          - problem: 'Let $f(x) = x + 4$ for $x < -1$, $f(-1) = 2$, and $f(x) = -x + 2$ for $x > -1$. Find $\lim_{x \to -1} f(x)$.'
            answer: '3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The left-hand limit is $-1 + 4 = 3$. The right-hand limit is $-(-1) + 2 = 3$. The two sides agree, so the limit is $3$, and the lone value $f(-1) = 2$ does not affect it.'
          - problem: 'Let $h(x) = x^2$ for $x \neq 3$ and $h(3) = 0$. Find $\lim_{x \to 3} h(x)$.'
            answer: '9'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Near $3$ but not at $3$ the rule is $x^2$, which approaches $3^2 = 9$. The separate value $h(3) = 0$ does not change this. The limit is $9$.'
          - problem: 'Let $f(x) = x + 3$ for $x < 1$, $f(1) = 5$, and $f(x) = 4x$ for $x > 1$. Find $\lim_{x \to 1} f(x)$.'
            answer: '4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The left-hand limit is $1 + 3 = 4$. The right-hand limit is $4(1) = 4$. The two sides agree, so the limit is $4$, whatever the value $f(1) = 5$ is.'
          - problem: 'Let $g(x) = x^2 + 1$ for $x < 2$, $g(2) = 0$, and $g(x) = x + 3$ for $x > 2$. Find $\lim_{x \to 2} g(x)$.'
            answer: '5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The left-hand limit is $2^2 + 1 = 5$. The right-hand limit is $2 + 3 = 5$. Both sides agree, so the limit is $5$, and $g(2) = 0$ is not used.'
          - problem: 'A parking garage charges $C(t) = 2t$ dollars for $t < 3$ hours and $C(t) = t + 3$ dollars for $t > 3$ hours. At exactly $3$ hours it charges a flat $C(3) = 20$ dollars. What value does the charge approach as $t$ approaches $3$ hours?'
            answer: '6'
            answer_contract: {"kind":"unit","quantity":"dollar","unit":"dollar","allow_omitted":true}
            solution_sketch: 'From below, the charge $2t$ approaches $2(3) = 6$ dollars. From above, the charge $t + 3$ approaches $3 + 3 = 6$ dollars. The two sides agree at $6$, and the flat $20$ dollars at exactly $3$ hours does not matter.'
          - problem: 'A probe reports a temperature of $r(t) = 3t + 1$ degrees Celsius for $t < 2$ minutes and $r(t) = 13 - 3t$ degrees Celsius for $t > 2$ minutes. At exactly $t = 2$ it records a faulty reading of $0$ degrees Celsius. What value does the reading approach as $t$ approaches $2$ minutes?'
            answer: '7'
            answer_contract: {"kind":"unit","quantity":"temperature","unit":"°C","allow_omitted":true}
            solution_sketch: 'Before $t = 2$ the reading $3t + 1$ approaches $3(2) + 1 = 7$. After $t = 2$ the reading $13 - 3t$ approaches $13 - 3(2) = 7$. The faulty reading $0$ is ignored, so the limit is $7$.'
          - problem: 'Let $f(x) = x + k$ for $x < 1$, $f(1) = 9$, and $f(x) = 3x$ for $x > 1$. If $\lim_{x \to 1} f(x)$ exists, find the constant $k$.'
            answer: '2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The right-hand limit is $3(1) = 3$. The left-hand limit is $1 + k$, and the two must be equal, so $1 + k = 3$. Hence $k = 2$, and the value $f(1) = 9$ plays no part.'
          - problem: 'Let $f(x) = x^2$ for $x < 1$, $f(1) = 1$, and $f(x) = x + 2$ for $x > 1$. Does $\lim_{x \to 1} f(x)$ exist?'
            answer: 'no'
            answer_contract: {"kind":"label","options":[["yes","it exists","the limit exists","exists"], ["no","it does not exist","does not exist","dne","no limit","the limit does not exist","limit does not exist","doesn't exist"]]}
            solution_sketch: 'The left-hand limit is $1^2 = 1$. The right-hand limit is $1 + 2 = 3$. The one-sided limits differ, so the limit does not exist, even though $f(1) = 1$ matches the left side.'
          - problem: 'Let $f(x) = 2x - 1$ for $x \neq 4$ and $f(4) = 10$. What is the value of $\lim_{x \to 4} f(x)$?'
            answer: '7'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Near $4$ but not at $4$ the rule is $2x - 1$, which approaches $2(4) - 1 = 7$. The lone value $f(4) = 10$ does not change the limit.'
        constraints: 'the value at the branch point differs from the limit; one verdict item where the sides disagree and one find-the-constant item'
    diagnostic_exemplar:
      problem: 'Let $f(x) = 3x - 1$ for $x < 2$, $f(2) = 10$, and $f(x) = x + 3$ for $x > 2$. Find $\lim_{x \to 2} f(x)$.'
      answer: '5'
      solution_sketch: 'Left limit $3(2) - 1 = 5$; right limit $2 + 3 = 5$. They agree, so the limit is $5$ — the separately defined value $f(2) = 10$ plays no role.'
    anki_seeds:
      - front: "To find a limit of a piecewise function at a branch point, you must..."
        back: "compute both one-sided limits, each from its own branch, and check that they agree"
        type: basic
      - front: "Away from the branch points, the limit of a piecewise function is computed by..."
        back: "substituting into the single branch that contains the target point"
        type: basic

  - id: factoring-limits
    name: Limits by Factoring
    core: true
    difficulty: 0.52
    drill: false
    answer_kind: numeric
    expected_time_secs: 120
    prerequisites:
      - id: limit-laws
        weight: 0.8
        key: true
      - id: factoring-trinomials
        weight: 0.6
        key: true
      - id: difference-of-squares
        weight: 0.5
      - id: factoring-gcf
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: Recognize the 0/0 indeterminate form
        key_prerequisites: [limit-laws]
        exemplars:
          - problem: 'Substitute $x = 3$ into $\frac{x^2 - 9}{x - 3}$. Is the result zero over zero, a nonzero number over zero, or a finite number?'
            answer: 'zero over zero'
            answer_contract: {"kind":"label","options":[["zero over zero","0/0","0 over 0","indeterminate"], ["nonzero over zero","nonzero/0","a nonzero number over zero","nonzero over 0","number over zero","k/0"], ["a finite number","a number","a real number","not indeterminate"]]}
            solution_sketch: 'The numerator is $3^2 - 9 = 0$ and the denominator is $3 - 3 = 0$. Both vanish, so the quotient has the form $0/0$. This form is indeterminate, so substitution alone cannot give the limit.'
          - problem: 'Evaluate $\lim_{x \to 2} \frac{x + 3}{x + 1}$.'
            answer: '5/3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The denominator $2 + 1 = 3$ is not zero, so the limit laws allow direct substitution. The numerator is $2 + 3 = 5$. The limit is $5/3$.'
          - problem: 'Substitute $x = 2$ into $\frac{x^2 - 1}{x - 2}$. Is the result zero over zero, a nonzero number over zero, or a finite number?'
            answer: 'nonzero over zero'
            answer_contract: {"kind":"label","options":[["zero over zero","0/0","0 over 0","indeterminate"], ["nonzero over zero","nonzero/0","a nonzero number over zero","nonzero over 0","3/0","3 over 0","number over zero"], ["a finite number","a number","a real number","not indeterminate"]]}
            solution_sketch: 'The numerator is $2^2 - 1 = 3$ and the denominator is $2 - 2 = 0$. A nonzero number over zero is not indeterminate. No cancellation is possible, because $x - 2$ is not a factor of the numerator.'
          - problem: 'Evaluate $\lim_{x \to -1} \frac{x^2 + 2x + 3}{x + 2}$.'
            answer: '2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The denominator $-1 + 2 = 1$ is not zero, so substitution works. The numerator is $(-1)^2 + 2(-1) + 3 = 2$. The limit is $2/1 = 2$.'
          - problem: 'Evaluate $\lim_{x \to 0} \frac{x + 1}{x + 2}$.'
            answer: '1/2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The denominator $0 + 2 = 2$ is not zero, so substitution works. The numerator is $0 + 1 = 1$. The limit is $1/2$.'
          - problem: 'Evaluate $\lim_{x \to 3} \frac{x^2 - 9}{x + 3}$.'
            answer: '0'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The denominator $3 + 3 = 6$ is not zero, so substitution works. The numerator is $3^2 - 9 = 0$. The limit is $0/6 = 0$, because a zero numerator over a nonzero denominator is simply zero.'
          - problem: 'Evaluate $\lim_{x \to 1} \frac{x^2 + 1}{x + 1}$.'
            answer: '1'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The denominator $1 + 1 = 2$ is not zero, so substitution works. The numerator is $1^2 + 1 = 2$. The limit is $2/2 = 1$.'
          - problem: 'Making $n$ items costs $2n^2 + 50$ dollars in total, so the average cost per item is $\frac{2n^2 + 50}{n + 5}$ dollars. What value does the average cost approach as $n$ approaches $5$?'
            answer: '10'
            answer_contract: {"kind":"unit","quantity":"dollar","unit":"dollar","allow_omitted":true}
            solution_sketch: 'The denominator $5 + 5 = 10$ is not zero, so substitution works. The numerator is $2(5)^2 + 50 = 100$. The average cost approaches $100/10 = 10$ dollars.'
          - problem: 'A cyclist has speed $v(t) = \frac{4t + 6}{t + 1}$ metres per second after $t$ seconds. What value does the speed approach as $t$ approaches $2$?'
            answer: '14/3'
            answer_contract: {"kind":"unit","quantity":"speed","unit":"m/s","allow_omitted":true}
            solution_sketch: 'The denominator $2 + 1 = 3$ is not zero, so substitution works. The numerator is $4(2) + 6 = 14$. The speed approaches $14/3$ metres per second.'
          - problem: 'A rectangle has area $x^2 + 3x$ square metres and length $x + 1$ metres, so its width is the area divided by the length. What value does the width approach as $x$ approaches $2$?'
            answer: '10/3'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'The width is $\frac{x^2 + 3x}{x + 1}$. The denominator $2 + 1 = 3$ is not zero, so substitution works. The numerator is $2^2 + 3(2) = 10$, so the width approaches $10/3$ metres.'
        constraints: 'classify by substitution (0/0, nonzero over 0, finite value) or evaluate a limit that substitution settles; plain items and cost, speed and width contexts'
      - id: kp2
        name: Cancel a difference of squares
        key_prerequisites: [difference-of-squares, limit-laws]
        try_first:
          problem: 'What is the value of $\frac{x^2 - 1}{x - 1}$ at $x = 1.001$?'
          answer_contract: {"kind":"exact"}
          answer: '2.001'
          reveal: 'The numerator factors as $(x-1)(x+1)$, so for $x \neq 1$ the fraction equals $x + 1$, which is $2.001$ here. As $x$ nears $1$ the values come near $2$, and that is the limit.'
        exemplars:
          - problem: 'Evaluate $\lim_{x \to 2} \frac{x^2 - 4}{x - 2}$.'
            answer: '4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Substitution gives $0/0$, so factor the numerator: $x^2 - 4 = (x - 2)(x + 2)$. For $x \neq 2$ the fraction equals $x + 2$. The limit is $2 + 2 = 4$.'
          - problem: 'Evaluate $\lim_{x \to -3} \frac{x^2 - 9}{x + 3}$.'
            answer: '-6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Substitution gives $0/0$, so factor the numerator: $x^2 - 9 = (x - 3)(x + 3)$. For $x \neq -3$ the fraction equals $x - 3$. The limit is $-3 - 3 = -6$.'
          - problem: 'Evaluate $\lim_{x \to 4} \frac{x - 4}{x^2 - 16}$.'
            answer: '1/8'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Substitution gives $0/0$, so factor the denominator: $x^2 - 16 = (x - 4)(x + 4)$. For $x \neq 4$ the fraction equals $\frac{1}{x + 4}$. The limit is $\frac{1}{8}$.'
          - problem: 'Evaluate $\lim_{x \to -2} \frac{x + 2}{x^2 - 4}$.'
            answer: '-1/4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Substitution gives $0/0$, so factor the denominator: $x^2 - 4 = (x - 2)(x + 2)$. For $x \neq -2$ the fraction equals $\frac{1}{x - 2}$. The limit is $\frac{1}{-4} = -\frac{1}{4}$.'
          - problem: 'Evaluate $\lim_{x \to 3/2} \frac{4x^2 - 9}{2x - 3}$.'
            answer: '6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Substitution gives $0/0$, so factor the numerator: $4x^2 - 9 = (2x - 3)(2x + 3)$. For $x \neq 3/2$ the fraction equals $2x + 3$. The limit is $2(3/2) + 3 = 6$.'
          - problem: 'The area of a square of side $s$ metres exceeds $49$ square metres by $s^2 - 49$. The ratio of this excess to the change in side, $s - 7$, is $\frac{s^2 - 49}{s - 7}$. What value does this ratio approach as $s$ approaches $7$ metres?'
            answer: '14'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'Factor $s^2 - 49 = (s - 7)(s + 7)$ and cancel $s - 7$ for $s \neq 7$. The ratio equals $s + 7$. As $s$ approaches $7$ it approaches $14$.'
          - problem: 'A stone falls $5t^2$ metres in $t$ seconds. Its average speed from time $2$ to time $t$ is $\frac{5t^2 - 20}{t - 2}$ metres per second. What value does this average speed approach as $t$ approaches $2$?'
            answer: '20'
            answer_contract: {"kind":"unit","quantity":"speed","unit":"m/s","allow_omitted":true}
            solution_sketch: 'Factor $5t^2 - 20 = 5(t - 2)(t + 2)$ and cancel $t - 2$ for $t \neq 2$. The average speed is $5(t + 2)$. As $t$ approaches $2$ it approaches $5(4) = 20$.'
          - problem: 'What is the value of $\lim_{x \to 4} \frac{x^2 - 16}{x - 4}$?'
            answer: '8'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The numerator factors as $(x - 4)(x + 4)$, so for $x \neq 4$ the fraction equals $x + 4$, not $x - 4$. The limit is $4 + 4 = 8$.'
        constraints: '0/0 form; difference of squares in numerator or denominator; integer or unit-fraction answers; measured contexts'
      - id: kp3
        name: Cancel a factored trinomial
        key_prerequisites: [factoring-trinomials, limit-laws]
        exemplars:
          - problem: 'Evaluate $\lim_{x \to 3} \frac{x^2 - x - 6}{x - 3}$.'
            answer: '5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Substitution gives $0/0$, so factor the numerator: $x^2 - x - 6 = (x - 3)(x + 2)$. For $x \neq 3$ the fraction equals $x + 2$. The limit is $3 + 2 = 5$.'
          - problem: 'Evaluate $\lim_{x \to -1} \frac{x^2 + 3x + 2}{x + 1}$.'
            answer: '1'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Substitution gives $0/0$, so factor the numerator: $x^2 + 3x + 2 = (x + 1)(x + 2)$. For $x \neq -1$ the fraction equals $x + 2$. The limit is $-1 + 2 = 1$.'
          - problem: 'Evaluate $\lim_{x \to 2} \frac{x^2 - 5x + 6}{x^2 - 4}$.'
            answer: '-1/4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Factor both parts: the numerator is $(x - 2)(x - 3)$ and the denominator is $(x - 2)(x + 2)$. For $x \neq 2$ the fraction equals $\frac{x - 3}{x + 2}$. The limit is $\frac{-1}{4}$.'
          - problem: 'Evaluate $\lim_{x \to 5} \frac{x^2 - 3x - 10}{x - 5}$.'
            answer: '7'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Substitution gives $0/0$, so factor the numerator: $x^2 - 3x - 10 = (x - 5)(x + 2)$. For $x \neq 5$ the fraction equals $x + 2$. The limit is $5 + 2 = 7$.'
          - problem: 'Evaluate $\lim_{x \to -2} \frac{x^2 - x - 6}{x + 2}$.'
            answer: '-5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Substitution gives $0/0$, so factor the numerator: $x^2 - x - 6 = (x + 2)(x - 3)$. For $x \neq -2$ the fraction equals $x - 3$. The limit is $-2 - 3 = -5$.'
          - problem: 'Evaluate $\lim_{x \to 1} \frac{x^2 + 2x - 3}{x^2 - 3x + 2}$.'
            answer: '-4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Factor both parts: the numerator is $(x - 1)(x + 3)$ and the denominator is $(x - 1)(x - 2)$. For $x \neq 1$ the fraction equals $\frac{x + 3}{x - 2}$. The limit is $\frac{4}{-1} = -4$.'
          - problem: 'A rectangular garden has area $x^2 - 3x - 10$ square metres and length $x - 5$ metres. Its width is the area divided by the length. What value does the width approach as $x$ approaches $5$?'
            answer: '7'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'The width is $\frac{x^2 - 3x - 10}{x - 5}$. Factor the numerator as $(x - 5)(x + 2)$ and cancel $x - 5$ for $x \neq 5$. The width approaches $5 + 2 = 7$ metres.'
          - problem: 'A rectangular tile has area $x^2 + 2x - 8$ square centimetres and length $x - 2$ centimetres, so its width is the area divided by the length. What value does the width approach as $x$ approaches $2$?'
            answer: '6'
            answer_contract: {"kind":"unit","quantity":"length","unit":"cm","allow_omitted":true}
            solution_sketch: 'The width is $\frac{x^2 + 2x - 8}{x - 2}$. Factor the numerator as $(x - 2)(x + 4)$ and cancel $x - 2$ for $x \neq 2$. The width approaches $2 + 4 = 6$ centimetres.'
          - problem: 'What is $\lim_{x \to 3} \frac{x^2 + 2x - 15}{x - 3}$?'
            answer: '8'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The correct factoring is $x^2 + 2x - 15 = (x - 3)(x + 5)$, since $-3 \cdot 5 = -15$ and $5 - 3 = 2$. For $x \neq 3$ the fraction equals $x + 5$. The limit is $3 + 5 = 8$.'
        constraints: '0/0 form; trinomials factor over the integers with (x - a) as the common factor; area-and-width contexts'
    diagnostic_exemplar:
      problem: 'Evaluate $\lim_{x \to 4} \frac{x^2 - x - 12}{x - 4}$.'
      answer: "7"
      solution_sketch: 'Factor the numerator: $\frac{(x-4)(x+3)}{x-4} = x + 3$ for $x \neq 4$, and that tends to $7$.'
