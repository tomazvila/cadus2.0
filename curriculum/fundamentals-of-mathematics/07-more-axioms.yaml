      - id: kp1
        name: 'Axiom 7.1: the Axiom of Choice and choice functions'
        key_prerequisites: []
        exemplars:
          - problem: 'Let $A_1=\{2,5,7\}$, $A_2=\{5,9\}$ and $A_3=\{1,5\}$. Look at functions $f$ on $I=\{1,2,3\}$. Give 1 if $f(i)\in A_i$ for all $i$ and 0 if not. (a) $f(1)=2$, $f(2)=9$, $f(3)=1$. (b) $f(1)=5$, $f(2)=7$, $f(3)=5$. (c) $f(1)=7$, $f(2)=5$, $f(3)=5$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 0; c = 1'
            solution_sketch: 'A function is a choice function when each value lies in its own set. In (a) the values 2, 9, 1 lie in $A_1,A_2,A_3$, so a = 1. In (b) the value 7 is not in $A_2$, so b = 0. In (c) the values 7, 5, 5 lie in their sets, so c = 1.'
          - problem: 'Let $A_1=\{1,2,3\}$, $A_2=\{4,5\}$ and $A_3=\{6,7,8,9\}$. Count the choice functions. (a) Give the number of choice functions for $A_1,A_2,A_3$. (b) Give the number of choice functions for $A_1,A_2$ only. (c) Let $B_1=\{1,2\}$, $B_2=\{2,3\}$, $B_3=\{3,1\}$. Give the number of choice functions for $B_1,B_2,B_3$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 24; b = 6; c = 8'
            solution_sketch: 'Each index gives an independent pick, so the counts multiply. In (a) we get $3\cdot2\cdot4=24$. In (b) we get $3\cdot2=6$. In (c) every set has 2 elements, so $2\cdot2\cdot2=8$.'
          - problem: 'Let $A_1=\{1,2\}$, $A_2=\varnothing$ and $A_3=\{3\}$. (a) Give the number of choice functions on $I=\{1,2,3\}$ for this family. (b) Replace $A_2$ by $\{0\}$. Give the new number of choice functions. (c) Give the number of elements of $A_1\cup A_2\cup A_3$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 0; b = 2; c = 3'
            solution_sketch: 'An empty set leaves no value for $f(2)$, so a = 0. After the change there are 2 picks for $f(1)$, 1 for $f(2)$ and 1 for $f(3)$, so b = 2. The union is $\{1,2,3\}$, so c = 3.'
          - problem: 'Let $A_1=\{4,7\}$, $A_2=\{3,9\}$ and $A_3=\{6,2\}$. Let $f(i)$ be the smallest element of $A_i$. Give (a) $f(1)$, (b) $f(2)$, (c) $f(3)$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 4; b = 3; c = 2'
            solution_sketch: 'The rule picks the smallest element of each set. The smallest element of $A_1$ is 4, so a = 4. The smallest element of $A_2$ is 3, so b = 3. The smallest element of $A_3$ is 2, so c = 2.'
          - problem: 'For each positive integer $n$ let $A_n$ be the set of positive multiples of $n$. Give 1 if the rule is a choice function for the family $\{A_n\}$ and 0 if not. (a) $f(n)=n^2$. (b) $f(n)=n+1$. (c) $f(n)=3n$. (d) $f(n)=n+2$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 0; c = 1; d = 0'
            solution_sketch: 'The rule works when $f(n)$ is a multiple of $n$ for every $n$. The value $n^2$ is a multiple of $n$, so a = 1. For $n=2$ the value 3 is no multiple of 2, so b = 0. The value $3n$ is a multiple of $n$, so c = 1. For $n=3$ the value 5 is no multiple of 3, so d = 0.'
          - problem: 'For $n=1,2,3,4$ let $A_n=\{n,-n\}$. Look at choice functions on $I=\{1,2,3,4\}$. (a) Give the number of choice functions. (b) Give the number of choice functions with $f(n)>0$ for all $n$. (c) Give the number of choice functions with $f(1)+f(2)+f(3)+f(4)=0$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 16; b = 1; c = 2'
            solution_sketch: 'Each index has 2 picks, so a = $2^4$ = 16. Only the pick $f(n)=n$ keeps every value positive, so b = 1. The sum is $10-2s$, where $s$ is the sum of the indices with a negative pick. We need $s=5$, which gives the index sets $\{1,4\}$ and $\{2,3\}$, so c = 2.'
          # source: FoM exercise 7.1-7-2
          - problem: 'Assume Zorn''s Lemma. Prove that each family $\{A_i\}_{i\in I}$ of nonempty sets has a function $f$ on $I$ with $f(i)\in A_i$ for all $i$.'
            answer_contract: {"kind":"written"}
            answer: 'Order the partial choice functions by inclusion. The union of a chain is an upper bound, so a maximal one exists, and it is defined on all of I.'
            solution_sketch: 'Let $P$ be the set of functions $g$ with domain in $I$ and $g(i)\in A_i$ on that domain, ordered by inclusion. The empty function is in $P$. The union of a chain in $P$ is again in $P$, so it is an upper bound. Zorn''s Lemma gives a maximal $g$. If some $i$ lies outside its domain, extend $g$ by one value of $A_i$. That contradicts maximality.'
        constraints: 'Choice functions of finite families; the Axiom of Choice from Zorn''s Lemma.'
      - id: kp2
        name: 'Definition 7.2 and Theorem 7.3: products and complete distributivity of union and intersection'
        key_prerequisites: [fom-2-5-axiom-powers-relations-functions]
        exemplars:
          - problem: 'Let $|A_1|=2$, $|A_2|=3$ and $|A_3|=4$. (a) Give the number of elements of the product $\prod_{i=1}^{3}A_i$. (b) Give that number when $|A_3|=1$. (c) Let $I=\{1,2\}$, $A_1=\{a,b\}$ and $A_2=\varnothing$. Give the number of elements of $\prod_{i\in I}A_i$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 24; b = 6; c = 0'
            solution_sketch: 'The product holds all choice functions, so its size is the product of the sizes. In (a) we get $2\cdot3\cdot4=24$. In (b) we get $2\cdot3\cdot1=6$. In (c) the empty set gives no choice function, so c = 0.'
          - problem: 'Let $A_1=\{1,2\}$ and $A_2=\{2,3\}$. A function $f$ on $\{1,2\}$ is a member of $A_1\times A_2$ in the sense of Definition 7.2 exactly when $f(i)\in A_i$. Give 1 for a member and 0 for a non-member. (a) $f(1)=2$, $f(2)=3$. (b) $f(1)=3$, $f(2)=3$. (c) $f(1)=1$, $f(2)=1$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 0; c = 0'
            solution_sketch: 'In (a) the value 2 is in $A_1$ and the value 3 is in $A_2$, so a = 1. In (b) the value 3 is not in $A_1$, so b = 0. In (c) the value 1 is not in $A_2$, so c = 0.'
          - problem: 'Let $I=\{1,2\}$, $J_1=J_2=\{1,2\}$, $C_{11}=\{1,2\}$, $C_{12}=\{3\}$, $C_{21}=\{2,3\}$ and $C_{22}=\{4\}$. (a) Give the number of elements of $\bigcap_{i}\bigcup_{j}C_{ij}$. (b) Give the number of elements of $\bigcup_{f}\bigcap_{i}C_{i\,f(i)}$, where $f$ runs over all functions on $I$ with $f(i)\in J_i$. (c) Give the sum of the elements of the first set.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 2; b = 2; c = 5'
            solution_sketch: 'For (a) the union at $i=1$ is $\{1,2,3\}$ and at $i=2$ it is $\{2,3,4\}$. Their intersection is $\{2,3\}$, so a = 2. For (b) the four functions give the sets $\{2\},\varnothing,\{3\},\varnothing$, and their union is $\{2,3\}$, so b = 2. The sum $2+3$ gives c = 5.'
          - problem: 'Let $I=\{1,2\}$, $J_1=J_2=\{1,2\}$, $C_{11}=\{1,2,3\}$, $C_{12}=\{2,3,4\}$, $C_{21}=\{3,5\}$ and $C_{22}=\{3,6\}$. (a) Give the number of functions $f$ on $I$ with $f(i)\in J_i$. (b) Give the number of elements of $\bigcup_{i}\bigcap_{j}C_{ij}$. (c) Give the number of elements of $\bigcap_{f}\bigcup_{i}C_{i\,f(i)}$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 4; b = 2; c = 2'
            solution_sketch: 'Each of the 2 indices has 2 picks, so a = 4. For (b) the sets are $C_{11}\cap C_{12}=\{2,3\}$ and $C_{21}\cap C_{22}=\{3\}$, with union $\{2,3\}$, so b = 2. For (c) the four unions are $\{1,2,3,5\}$, $\{1,2,3,6\}$, $\{2,3,4,5\}$, $\{2,3,4,6\}$. Their intersection is $\{2,3\}$, so c = 2.'
          - problem: 'Use the sets $C_{11}=\{1,2\}$, $C_{12}=\{3\}$, $C_{21}=\{2,3\}$ and $C_{22}=\{4\}$. Give 1 if $x$ lies in $\bigcap_{i=1}^{2}\bigcup_{j=1}^{2}C_{ij}$ and 0 if not. (a) $x=1$. (b) $x=2$. (c) $x=4$. (d) $x=3$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}}]}
            answer: 'a = 0; b = 1; c = 0; d = 1'
            solution_sketch: 'The set is $\{1,2,3\}\cap\{2,3,4\}=\{2,3\}$. The number 1 is not in the second union, so a = 0. The numbers 2 and 3 lie in both unions, so b = 1 and d = 1. The number 4 is not in the first union, so c = 0.'
          - problem: 'Count the choice functions in a product $\prod_{i\in I}J_i$. (a) Let $|I|=3$ with $|J_1|=2$, $|J_2|=3$, $|J_3|=2$. (b) Let $|I|=4$ and $|J_i|=3$ for all $i$. (c) Let $|I|=5$ and $|J_i|=2$ for all $i$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 12; b = 81; c = 32'
            solution_sketch: 'The count is the product of the sizes of the sets $J_i$. In (a) we get $2\cdot3\cdot2=12$. In (b) we get $3^4=81$. In (c) we get $2^5=32$.'
          # argument: Theorem 7.3
          - problem: 'Prove the first part of the distributive law: for index sets $J_i$ and sets $C_{ij}$, the set $\bigcap_{i\in I}\bigcup_{j\in J_i}C_{ij}$ equals $\bigcup_{f\in\prod J_i}\bigcap_{i\in I}C_{i\,f(i)}$.'
            answer_contract: {"kind":"written"}
            answer: 'For one inclusion, build a choice function from the sets of fitting indices. The other inclusion reads off one index for each i.'
            solution_sketch: 'Let $x$ be in the left set. For each $i$ the set $A_i=\{j\in J_i: x\in C_{ij}\}$ is nonempty. The Axiom of Choice gives a function $g$ with $g(i)\in A_i$, so $g$ is in the product. Then $x\in\bigcap_i C_{i\,g(i)}$, so $x$ is in the right set. For the reverse inclusion, take $f$ in the product with $x\in C_{i\,f(i)}$ for all $i$. Then $x\in\bigcup_j C_{ij}$ for each $i$.'
          # argument: Theorem 7.3
          - problem: 'Prove the second part of the distributive law: the set $\bigcup_{i\in I}\bigcap_{j\in J_i}C_{ij}$ equals $\bigcap_{f\in\prod J_i}\bigcup_{i\in I}C_{i\,f(i)}$.'
            answer_contract: {"kind":"written"}
            answer: 'One inclusion holds for every f by picking the index i0. For the other, an x outside the left set gives a choice function that avoids x.'
            solution_sketch: 'Let $x$ be in the left set, with index $i_0$ such that $x$ lies in $C_{i_0 j}$ for all $j$. For each $f$ we have $x\in C_{i_0 f(i_0)}$, so $x$ is in the right set. Now let $x$ be outside the left set. Then each $i$ has some $j_i$ with $x\notin C_{ij_i}$. The Axiom of Choice from Axiom 7.1 gives the function $g(i)=j_i$ in the product. Then $x$ is in no set $C_{i\,g(i)}$, so $x$ is outside the right set.'
          # source: FoM exercise 7.1-7-3
          - problem: 'Let $F$ be a set of functions $f:X\to B$ with $X\subseteq A$, ordered by inclusion. Let $\mathcal C$ be a chain in $F$ and let $u=\bigcup\mathcal C$. Prove: (a) $u$ is a function. (b) If all members of $\mathcal C$ are injective, then $u$ is injective. (c) If $A=B$ and $\mathrm{dom}(g)=\mathrm{rng}(g)$ for all $g\in\mathcal C$, then $\mathrm{dom}(u)=\mathrm{rng}(u)$.'
            answer_contract: {"kind":"written"}
            answer: 'Two members of a chain are nested, so any two pairs of the union sit in one member. That member is a function, is injective, and has equal domain and range.'
            solution_sketch: 'Two pairs of $u$ come from members $g,h$ of the chain. One of them contains the other, so both pairs lie in one member. For (a), two pairs with the same first entry lie in one function, so their second entries agree. For (b), two pairs with the same second entry lie in one injective function, so their first entries agree. For (c), the domain of $u$ is the union of the domains and the range is the union of the ranges, and these unions match term by term.'
        constraints: 'Products as sets of choice functions; the two distributive laws.'
      - id: kp3
        name: 'Definition 7.4, Lemma 7.5 and Theorem 7.6: chains, maximal elements and Zorn''s Lemma'
        key_prerequisites: [partial-orders, minimal-maximal-elements]
        exemplars:
          - problem: 'Order the divisors $\{1,2,3,4,6,12\}$ by divisibility. Give 1 if the subset is a chain and 0 if not. (a) $\{1,2,4,12\}$. (b) $\{2,3,6\}$. (c) $\{3,6,12\}$. (d) $\{1,4,6\}$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 0; c = 1; d = 0'
            solution_sketch: 'A chain has every two elements comparable. In (a) we have $1\mid2\mid4\mid12$, so a = 1. In (b) the numbers 2 and 3 do not divide each other, so b = 0. In (c) we have $3\mid6\mid12$, so c = 1. In (d) the numbers 4 and 6 do not divide each other, so d = 0.'
          - problem: 'Order the set $\{2,3,4,6,9,12\}$ by divisibility. (a) Give the number of maximal elements. (b) Give the number of minimal elements. (c) Give the largest number of elements in a chain.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 2; b = 2; c = 3'
            solution_sketch: 'The maximal elements have no proper multiple in the set. These are 9 and 12, so a = 2. The minimal elements have no proper divisor in the set. These are 2 and 3, so b = 2. The chain $2\mid4\mid12$ has 3 elements, and no chain has 4, so c = 3.'
          - problem: 'Let $X=\{1,2,3\}$ and let $Z$ hold all subsets of $\{1,2\}$ and all subsets of $\{2,3\}$, ordered by inclusion. (a) Give 1 if every subset of every member of $Z$ is in $Z$ and 0 if not. (b) Give the number of maximal elements of $Z$. (c) Give the number of elements of $Z$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 2; c = 6'
            solution_sketch: 'The members are $\varnothing$, $\{1\}$, $\{2\}$, $\{3\}$, $\{1,2\}$, $\{2,3\}$, so c = 6. Each subset of a member lies in the list, so a = 1. The sets $\{1,2\}$ and $\{2,3\}$ have no larger member, so b = 2.'
          - problem: 'Give 1 if every chain of the ordered set has an upper bound in the set and 0 if not. (a) The natural numbers with the usual order. (b) The set $\{1,\dots,10\}$ with the usual order. (c) The subsets of $\{1,2,3\}$ ordered by inclusion. (d) The real interval $[0,1)$ with the usual order.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}}]}
            answer: 'a = 0; b = 1; c = 1; d = 0'
            solution_sketch: 'In (a) the chain of all natural numbers has no upper bound, so a = 0. In (b) the number 10 bounds every chain, so b = 1. In (c) the set $\{1,2,3\}$ bounds every chain, so c = 1. In (d) the chain $[0,1)$ has no upper bound inside the interval, so d = 0.'
          - problem: 'Let $X=\{1,2,3\}$ and let $Z$ hold all subsets of $X$. For a set $C$ in $Z$ let $E_C$ be the set of $x\notin C$ with $C\cup\{x\}\in Z$. Let $g(C)=C\cup\{\min E_C\}$ when $E_C\ne\varnothing$, and $g(C)=C$ otherwise. Give the number of elements of $g(C)$ for (a) $C=\varnothing$, (b) $C=\{2,3\}$, (c) $C=\{1,2,3\}$, (d) $C=\{2\}$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 3; c = 3; d = 2'
            solution_sketch: 'For $C=\varnothing$ we have $E_C=\{1,2,3\}$, so $g(C)=\{1\}$ and a = 1. For $C=\{2,3\}$ we have $E_C=\{1\}$, so $g(C)=\{1,2,3\}$ and b = 3. For $C=\{1,2,3\}$ the set $E_C$ is empty, so c = 3. For $C=\{2\}$ we have $E_C=\{1,3\}$, so $g(C)=\{1,2\}$ and d = 2.'
          - problem: 'Order $\{1,\dots,10\}$ by divisibility. (a) Give the number of maximal elements. (b) Give the number of minimal elements. (c) Give the number of elements other than 6 that divide 6 or are multiples of 6.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 5; b = 1; c = 3'
            solution_sketch: 'The maximal elements have no proper multiple up to 10. These are 6, 7, 8, 9, 10, so a = 5. Only 1 has no proper divisor in the set, so b = 1. The numbers 1, 2, 3 divide 6 and no other multiple of 6 is at most 10, so c = 3.'
          - problem: 'Look at linear independence. (a) Give the largest number of linearly independent vectors in $\mathbb{R}^3$. (b) Give the number of maximal linearly independent subsets of $\{(1,0),(0,1),(1,1)\}$ in $\mathbb{R}^2$. (c) Give the number of elements of the vector space $\mathbb{F}_3^2$ over the field with 3 elements.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 3; b = 3; c = 9'
            solution_sketch: 'A basis of $\mathbb{R}^3$ has 3 vectors, so a = 3. Every pair of the three given vectors is independent and no 3 vectors are independent in $\mathbb{R}^2$, so b = 3. Each of the 2 coordinates takes 3 values, so c = $3^2$ = 9.'
          # argument: Lemma 7.5
          - problem: 'Prove the first step of Lemma 7.5. Let $X$ be a set and let $Z\subseteq\mathcal P(X)$ hold the empty set. Let every subset of a member of $Z$ lie in $Z$. Let the union of every chain in $Z$ lie in $Z$. Show that there is a map $g$ on $Z$ such that $g(C)\supseteq C$ and $g(C)$ is $C$ plus at most one new point. Show also that $g(M)=M$ forces $M$ to be maximal in $Z$.'
            answer_contract: {"kind":"written"}
            answer: 'Use a choice function on the nonempty subsets of X. Add the chosen point of E_C to C when E_C is nonempty, else keep C.'
            solution_sketch: 'The Axiom of Choice gives a function $f$ on the nonempty subsets of $X$ with $f(A)\in A$. For $C\in Z$ let $E_C=\{x\in X\setminus C: C\cup\{x\}\in Z\}$. Set $g(C)=C\cup\{f(E_C)\}$ when $E_C\ne\varnothing$, and $g(C)=C$ otherwise. If $g(M)=M$, then $E_M$ is empty. Then no one-point extension of $M$ lies in $Z$, and property 1 of Lemma 7.5 shows that $M$ is maximal. The chain notion of Definition 7.4 is the tool for the next step.'
          # argument: Lemma 7.5
          - problem: 'Prove the second step of Lemma 7.5. Let $X$ be a set and let $Z\subseteq\mathcal P(X)$ hold the empty set. Let every subset of a member of $Z$ lie in $Z$. Let the union of every chain in $Z$ lie in $Z$. Let $g$ be a map on $Z$ such that $g(C)\supseteq C$ and $g(C)$ is $C$ plus at most one new point. Call $T\subseteq Z$ a tower when $\varnothing\in T$, $g(C)\in T$ for $C\in T$, and $\bigcup\mathcal C\in T$ for each chain $\mathcal C\subseteq T$. Show that the smallest tower $T_0$ is a chain and that $\bigcup T_0$ is a fixed point of $g$.'
            answer_contract: {"kind":"written"}
            answer: 'Show that the comparable sets of T0 form a tower, so T0 is a chain. Then the union M of T0 is in T0, and g(M) lies between M and M.'
            solution_sketch: 'Call $C\in T_0$ comparable when $A\subseteq C$ or $C\subseteq A$ for all $A\in T_0$. For a comparable $C$, the set $U=\{A\in T_0: A\subseteq C \text{ or } g(C)\subseteq A\}$ is a tower, so $U=T_0$ and $g(C)$ is comparable. The union of a chain of comparable sets is comparable. So the comparable sets form a tower, and $T_0$ is a chain by Definition 7.4. Then $M=\bigcup T_0$ is in $T_0$, and $g(M)\in T_0$ gives $g(M)\subseteq M$. Also $g(M)\supseteq M$, so $g(M)=M$.'
          # argument: Theorem 7.6
          - problem: 'Prove Zorn''s Lemma: let $X$ be a nonempty ordered set in which every chain has an upper bound. Then $X$ has a maximal element.'
            answer_contract: {"kind":"written"}
            answer: 'Apply Lemma 7.5 to the family of all chains of X under inclusion. An upper bound of a maximal chain is a maximal element of X.'
            solution_sketch: 'Let $Z$ be the set of all chains of $X$, ordered by inclusion. Every subset of a chain is a chain, and the union of a chain of chains is a chain (Exercise 7-1). Lemma 7.5 gives a maximal chain $M$. Let $m$ be an upper bound of $M$. Then $M\cup\{m\}$ is a chain, so $m\in M$ by maximality. If $x\ge m$, the same argument gives $x\in M$, so $x\le m$ and $x=m$.'
          # source: FoM exercise 7.1-7-1
          - problem: 'Let $X$ be an ordered set and let $\mathcal C$ be a set of chains in $X$ such that $\mathcal C$ is a chain under inclusion. Prove that $\bigcup\mathcal C$ is a chain in $X$.'
            answer_contract: {"kind":"written"}
            answer: 'Two points of the union lie in two chains. These chains are nested, so both points lie in the larger one, where they are comparable.'
            solution_sketch: 'Let $x,y\in\bigcup\mathcal C$, so $x\in C_1$ and $y\in C_2$ for chains $C_1,C_2\in\mathcal C$. Since $\mathcal C$ is a chain, one of $C_1,C_2$ contains the other. Rename them so that $C_1\subseteq C_2$, which gives $x,y\in C_2$. Since $C_2$ is a chain, $x$ and $y$ are comparable. So the union is totally ordered, as Definition 7.4 asks.'
          # source: FoM exercise 7.1-7-7
          - problem: 'Prove that every vector space has a basis. Apply Zorn''s Lemma to the linearly independent subsets.'
            answer_contract: {"kind":"written"}
            answer: 'Order the independent subsets by inclusion. The union of a chain is independent, so a maximal one exists, and it spans the space.'
            solution_sketch: 'Let $P$ be the set of linearly independent subsets of the space $V$, ordered by inclusion. The empty set is in $P$. The union of a chain in $P$ is independent, because a finite dependence uses finitely many vectors that lie in one member. Zorn''s Lemma gives a maximal independent set $B$. If a vector $v$ lies outside the span of $B$, then $B\cup\{v\}$ is independent. That contradicts maximality, so $B$ spans $V$.'
          # source: FoM exercise 7.1-7-8
          - problem: 'Let $\mathbb E$ be an extension field of a field $\mathbb F$. Prove that $\mathbb E$ has a basis over $\mathbb F$, using Zorn''s Lemma.'
            answer_contract: {"kind":"written"}
            answer: 'View E as a vector space over F. A maximal F-independent subset exists by Zorn''s Lemma, and it spans E.'
            solution_sketch: 'The field $\mathbb E$ is a vector space over $\mathbb F$ when we multiply by elements of $\mathbb F$. Order the $\mathbb F$-independent subsets by inclusion. A chain of such sets has an independent union, because a finite dependence lives in one member. Zorn''s Lemma gives a maximal independent set $B$. A vector outside the span of $B$ extends $B$ to a larger independent set. So $B$ spans $\mathbb E$.'
        constraints: 'Chains, maximal elements, the tower argument and Zorn''s Lemma.'
      - id: kp4
        name: 'Theorem 7.7 and Definition 7.8: doubling an infinite set and well-orders'
        key_prerequisites: [fom-4-6-countable-sets, fom-2-5-axiom-powers-relations-functions]
        exemplars:
          - problem: 'Give 1 if the usual order is a well-order of the set and 0 if not. (a) The natural numbers. (b) The integers. (c) The real interval $[0,1]$. (d) The set $\{1,2,3,4,5\}$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 0; c = 0; d = 1'
            solution_sketch: 'A well-order needs a smallest element in every nonempty subset. The natural numbers have one, so a = 1. The negative integers have none, so b = 0. The open interval $(0,1)$ inside $[0,1]$ has none, so c = 0. A finite chain always has one, so d = 1.'
          - problem: 'Give 1 if every nonempty subset has a smallest element in the order and 0 if not. (a) The set $\{1/n: n\ge1\}$ with the usual order $\le$. (b) The same set ordered by $\ge$. (c) The nonnegative rational numbers with the usual order. (d) The natural numbers ordered by $\ge$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}}]}
            answer: 'a = 0; b = 1; c = 0; d = 0'
            solution_sketch: 'In (a) the set itself has no smallest element, so a = 0. In (b) a smallest element for $\ge$ is the largest number, and $1/n$ with the least $n$ is one, so b = 1. In (c) the rationals above 1 have no smallest element, so c = 0. In (d) the natural numbers have no largest element, so d = 0.'
          - problem: 'Use the usual order of the natural numbers. Give the smallest element of the set. (a) $\{x: x^2>50\}$. (b) $\{x: x \text{ is a multiple of } 7 \text{ and } x>30\}$. (c) $\{n: n!>1000\}$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 8; b = 35; c = 7'
            solution_sketch: 'In (a) we have $7^2=49$ and $8^2=64$, so a = 8. In (b) the multiples of 7 are 28, 35, so b = 35. In (c) we have $6!=720$ and $7!=5040$, so c = 7.'
          - problem: 'Let $g(n,e)=2n+e$ for $n\ge0$ and $e\in\{0,1\}$. This map is a bijection from $\mathbb N_0\times\{0,1\}$ to $\mathbb N_0$. (a) Give $g(7,1)$. (b) Give the value $n$ with $g(n,e)=20$. (c) Give the value $e$ with $g(n,e)=33$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 15; b = 10; c = 1'
            solution_sketch: 'In (a) we get $2\cdot7+1=15$. In (b) the number 20 is even, so $e=0$ and $n=10$. In (c) the number 33 is odd, so $e=1$.'
          - problem: 'Give 1 if $A\times\{0,1\}$ is equivalent to $A$ and 0 if not. (a) $A=\mathbb N$. (b) $A=\{1,2,3\}$. (c) $A=\mathbb Z$. (d) $A=\mathbb R$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 0; c = 1; d = 1'
            solution_sketch: 'For a finite set the size of $A\times\{0,1\}$ is twice the size of $A$, so b = 0. Theorem 7.7 covers every infinite set. The sets $\mathbb N$, $\mathbb Z$ and $\mathbb R$ are infinite, so a = 1, c = 1 and d = 1.'
          - problem: 'Look at bijections $h:X\times\{0,1\}\to X$. (a) Give the number of elements of $X\times\{0,1\}$ for $X=\{1,\dots,6\}$. (b) Give 1 if such a bijection exists for $X=\{1,\dots,6\}$ and 0 if not. (c) Give 1 if such a bijection exists for $X=\mathbb N_0$ and 0 if not.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 12; b = 0; c = 1'
            solution_sketch: 'There are 6 choices for $x$ and 2 for the second entry, so a = 12. A set of 12 elements is not equivalent to a set of 6, so b = 0. The map $(n,e)\mapsto 2n+e$ works for $\mathbb N_0$, so c = 1.'
          - problem: 'Let $A$ be a set of size 10. (a) Give the number of elements of $A\times\{0,1\}$. (b) Give 1 if $A\times\{0,1\}$ is equivalent to $A$ and 0 if not. (c) Give the number of elements of $A\times\{0,1\}$ when $A$ has 4 elements.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 20; b = 0; c = 8'
            solution_sketch: 'The product has twice as many elements as $A$. For 10 elements we get 20, so a = 20. Since 20 differs from 10, no bijection exists and b = 0. For 4 elements we get 8, so c = 8.'
          # argument: Theorem 7.7
          - problem: 'Prove the first step of Theorem 7.7: for an infinite set $A$, let $F$ be the set of bijections $f:X\times\{0,1\}\to X$ with $X\subseteq A$, ordered by inclusion. Show that $F$ is nonempty and that each chain in $F$ has an upper bound.'
            answer_contract: {"kind":"written"}
            answer: 'A countably infinite subset of A gives a member of F. The union of a chain of bijections is a bijection of the same kind.'
            solution_sketch: 'By Theorem 4.65, every countably infinite subset $X\subseteq A$ carries a bijection $X\times\{0,1\}\to X$, so $F$ is nonempty. A function is a set of ordered pairs (Definition 2.49), so inclusion orders $F$. Let $\mathcal C$ be a chain in $F$ and let $u=\bigcup\mathcal C$. As in Exercise 7-3, $u$ is an injective function whose domain and range agree up to the form $X_u\times\{0,1\}\to X_u$. It is onto, so $u$ is in $F$ and bounds the chain.'
          # argument: Theorem 7.7
          - problem: 'Prove the second step of Theorem 7.7: a maximal element $h:X\times\{0,1\}\to X$ of $F$ has $A\setminus X$ finite, and then $A\times\{0,1\}$ is equivalent to $A$.'
            answer_contract: {"kind":"written"}
            answer: 'If A minus X holds a countably infinite set C, a bijection on C enlarges h. So A minus X is finite, and moving finitely many points fixes h.'
            solution_sketch: 'Zorn''s Lemma gives a maximal $h$. Suppose $A\setminus X$ holds a countably infinite set $C$. Theorem 4.65 gives a bijection $b$ on $C\times\{0,1\}$ onto $C$, and $h\cup b$ is a strictly larger member of $F$, which is impossible. So $A\setminus X$ is finite. If it is empty, $h$ is the bijection we need. Otherwise move a finite part of a countably infinite subset of $X$ to cover $A\setminus X$.'
          # source: FoM exercise 7.1-7-5
          - problem: 'Consider an order relation $\le$ on a set $S$. Assume that each nonempty subset of $S$ holds a smallest element. Prove that $\le$ is total.'
            answer_contract: {"kind":"written"}
            answer: 'Apply the smallest-element property to the two-point set of any x and y. The smallest of the two is below the other.'
            solution_sketch: 'Let $x,y\in S$. The set $\{x,y\}$ is nonempty, so it has a smallest element. If that element is $x$, then $x\le y$. If it is $y$, then $y\le x$. So any two elements are comparable, which is the definition of a total order in Definition 7.8.'
        constraints: 'Well-orders, smallest elements and the bijection of an infinite set with its double.'
      - id: kp5
        name: 'Example 7.9 and Theorem 7.10: the Well-Ordering Theorem'
        key_prerequisites: [fom-3-4-induction]
        exemplars:
          - problem: 'Let $S=\{1,2,3\}$. Take these well-orders on subsets of $S$. $R_1$ on $\{1\}$. $R_2$ on $\{1,2\}$ with $1<2$. $R_3$ on $\{1,2\}$ with $2<1$. $R_4$ on $\{1,2,3\}$ with $1<2<3$. Write $R\sqsubseteq R''$ when the domain of $R$ lies in the domain of $R''$, each new point is above every old point, and $R''$ restricted to the old domain is $R$. Give 1 if the relation holds and 0 if not. (a) $R_1\sqsubseteq R_2$. (b) $R_1\sqsubseteq R_3$. (c) $R_2\sqsubseteq R_4$. (d) $R_3\sqsubseteq R_4$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 0; c = 1; d = 0'
            solution_sketch: 'In (a) the new point 2 is above 1, so a = 1. In (b) the new point 2 is below 1 in $R_3$, so b = 0. In (c) the new point 3 is above 1 and 2, and $R_4$ restricts to $R_2$, so c = 1. In (d) $R_4$ restricts to $1<2$, which differs from $R_3$, so d = 0.'
          - problem: 'Let $R_e$ be the well-order $1<3<2$ on $\{1,2,3\}$. Write $R\sqsubseteq R_e$ when the domain of $R$ lies in $\{1,2,3\}$, each point outside it is above every point inside it, and $R_e$ restricted to the domain is $R$. Give 1 if the relation holds and 0 if not. (a) $R$ is $1<3$ on $\{1,3\}$. (b) $R$ is $1<2$ on $\{1,2\}$. (c) $R$ is the order on $\{1\}$. (d) $R$ is the order on $\{3\}$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 0; c = 1; d = 0'
            solution_sketch: 'In (a) the new point 2 is above 1 and 3, and the restriction is $1<3$, so a = 1. In (b) the new point 3 is below 2 in $R_e$, so b = 0. In (c) the points 2 and 3 are above 1, so c = 1. In (d) the point 1 is below 3, so d = 0.'
          - problem: 'A well-order of $\mathbb Z$ lists the integers as $0,1,-1,2,-2,3,-3,\dots$ from smallest to largest. Count positions from 1. (a) Give the position of 3. (b) Give the position of $-3$. (c) Give the integer at position 10.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 6; b = 7; c = 5'
            solution_sketch: 'The list starts $0,1,-1,2,-2,3,-3,4,-4,5$. The number 3 is the sixth entry, so a = 6. The number $-3$ is the seventh entry, so b = 7. The tenth entry is 5, so c = 5.'
          - problem: 'Use the order $0,1,-1,2,-2,3,-3,4,-4,\dots$ of $\mathbb Z$, from smallest to largest. Give the smallest element of the set. (a) The negative integers. (b) The nonzero even integers. (c) The integers less than $-5$ in the usual order.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = -1; b = 2; c = -6'
            solution_sketch: 'In (a) the first negative integer in the list is $-1$, so a = -1. In (b) the entries 2 and $-2$ come first, and 2 is earlier, so b = 2. In (c) the integers below $-5$ are $-6,-7,\dots$, and $-6$ is earliest, so c = -6.'
          - problem: 'A total order on a finite set is a well-order. Give the number of total orders on a set with (a) 3 elements, (b) 4 elements, (c) 1 element.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 6; b = 24; c = 1'
            solution_sketch: 'A total order on $n$ elements lists them in a row, so there are $n!$ of them. For 3 elements we get 6. For 4 elements we get 24. For 1 element we get 1.'
          - problem: 'Use the order $0,1,-1,2,-2,3,-3,4,\dots$ of $\mathbb Z$, from smallest to largest. Let $f(A)$ be the smallest element of $A$. Give (a) $f(\{-3,2,5\})$, (b) $f(\{-1,-2,-4\})$, (c) $f(\{7,-5,6\})$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 2; b = -1; c = -5'
            solution_sketch: 'Positions: 2 is fourth, $-3$ is seventh, 5 is tenth, so a = 2. For b, $-1$ is third, $-2$ is fifth, $-4$ is ninth, so b = -1. For c, $-5$ is eleventh, 6 is twelfth, 7 is fourteenth, so c = -5.'
          - problem: 'A filter on $S$ is a nonempty family of nonempty subsets of $S$ that is closed under intersection and under supersets. Let $A=\{1,2,3\}$ and let $F_T$ hold all subsets $X\subseteq A$ with $T\subseteq X$. An ultrafilter is a filter that lies in no larger filter. (a) Give the number of elements of $F_{\{1\}}$. (b) Give the number of elements of $F_{\{1,2\}}$. (c) Give 1 if $F_{\{1\}}$ is an ultrafilter and 0 if not.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 4; b = 2; c = 1'
            solution_sketch: 'The sets in $F_{\{1\}}$ contain 1: $\{1\},\{1,2\},\{1,3\},\{1,2,3\}$, so a = 4. The sets in $F_{\{1,2\}}$ are $\{1,2\}$ and $\{1,2,3\}$, so b = 2. A filter for a one-point set is an ultrafilter, so c = 1.'
          - problem: 'Let $S=\{1,2,3,4\}$ and let $F$ hold all subsets of $S$ that contain $\{1,2\}$. For each $A$ give 1 if $A\in F$ or $S\setminus A\in F$, and 0 if not. (a) $A=\{1,3\}$. (b) $A=\{1,2,4\}$. (c) $A=\{3,4\}$. (d) $A=\{1,4\}$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}}]}
            answer: 'a = 0; b = 1; c = 1; d = 0'
            solution_sketch: 'In (a) neither $\{1,3\}$ nor $\{2,4\}$ contains $\{1,2\}$, so a = 0. In (b) the set $\{1,2,4\}$ contains $\{1,2\}$, so b = 1. In (c) the complement $\{1,2\}$ is in $F$, so c = 1. In (d) neither $\{1,4\}$ nor $\{2,3\}$ is in $F$, so d = 0.'
          # argument: Theorem 7.10
          - problem: 'Prove the first step of the Well-Ordering Theorem. Let $X$ be the set of well-orders $R$ on subsets of $S$. Let $R\sqsubseteq R''$ mean: the domain of $R$ lies in the domain of $R''$, each point of the domain of $R''$ outside the domain of $R$ is above every point of the domain of $R$, and $R''$ restricted to the domain of $R$ equals $R$. Show that every chain in $X$ has an upper bound in $X$.'
            answer_contract: {"kind":"written"}
            answer: 'The union of a chain of nested well-orders is an order. A nonempty subset meets one member, and its smallest element there is smallest in the union.'
            solution_sketch: 'Let $\le=\bigcup\mathcal C$. Any two pairs of the union lie in one member, so the union is reflexive, antisymmetric and transitive. Each member is an initial segment of the union, since new points lie above old ones. Let $A$ be a nonempty subset of the domain. It meets the domain of some member in a set with a smallest element $a$, and all points outside that domain lie above it, so $a$ is smallest in $A$. Exercise 7-5 then makes the union a well-order that bounds the chain.'
          # argument: Theorem 7.10
          - problem: 'Prove the second step of the Well-Ordering Theorem. Let $X$ be the set of well-orders $R$ on subsets of $S$, with the order $\sqsubseteq$. Let $R\sqsubseteq R''$ mean: the domain of $R$ lies in the domain of $R''$, each point of the domain of $R''$ outside the domain of $R$ is above every point of the domain of $R$, and $R''$ restricted to the domain of $R$ equals $R$. By Zorn''s Lemma, $X$ has a maximal element $\le$ with domain $D$. Show that $D=S$.'
            answer_contract: {"kind":"written"}
            answer: 'If a point s were outside D, put s on top of D. This gives a larger member of X, which contradicts maximality.'
            solution_sketch: 'Zorn''s Lemma applies by the first step. Suppose $D\ne S$ and take $s\in S\setminus D$. Define $\le''$ on $D\cup\{s\}$ so that it equals $\le$ on $D$ and $s$ is above every point of $D$. This order is a well-order, because a nonempty subset either lies in $D$ or holds $s$ on top. Then $\le''$ is in $X$ and lies strictly above $\le$. That contradicts maximality, so $D=S$.'
          # source: FoM exercise 7.1-7-4
          - problem: 'Let $X$ hold the well-orders on subsets of $S$. Let $R\sqsubseteq R''$ mean: the domain of $R$ lies in the domain of $R''$, each point of the domain of $R''$ outside the domain of $R$ is above every point of the domain of $R$, and $R''$ restricted to the domain of $R$ equals $R$. Prove that $\sqsubseteq$ is an order relation on $X$.'
            answer_contract: {"kind":"written"}
            answer: 'Check the three laws on the domains and restrictions. Nested domains give antisymmetry, and two restrictions combine for transitivity.'
            solution_sketch: 'Reflexivity holds because there are no new points and the restriction of $R$ to its own domain is $R$. For antisymmetry, $R\sqsubseteq R''$ and $R''\sqsubseteq R$ give equal domains, so $R=R''$. For transitivity, let $R\sqsubseteq R''\sqsubseteq R''''$. Then the domains nest, and a point new for $R''''$ over $R$ lies above the old domain of $R$. Restricting twice returns $R$, as in the setting of Theorem 7.10.'
          # source: FoM exercise 7.1-7-6
          - problem: 'Assume the Well-Ordering Theorem. Prove that each family $\{A_i\}_{i\in I}$ of nonempty sets has a function $f$ on $I$ with $f(i)\in A_i$.'
            answer_contract: {"kind":"written"}
            answer: 'Well-order the union of all A_i. Let f(i) be the smallest element of A_i in this order.'
            solution_sketch: 'Let $U=\bigcup_{i\in I}A_i$. By Theorem 7.10 there is a well-order $\le$ on $U$. Each $A_i$ is a nonempty subset of $U$, so it has a smallest element. Define $f(i)$ as the smallest element of $A_i$. This definition needs no further pick, and $f(i)\in A_i$ for all $i$.'
          # source: FoM exercise 7.1-7-9
          - problem: 'Let $F$ be a nonempty family of nonempty subsets of $A$, closed under intersection and under supersets inside $A$. Call it a filter. An ultrafilter is a filter that lies in no larger filter. Prove: (a) the family of supersets of a nonempty $S\subseteq A$ is a filter, and for $S=\{a\}$ it is an ultrafilter. (b) The family of subsets of $\mathbb R$ with finite complement is a filter but no ultrafilter. (c) Every filter lies in an ultrafilter. (d) A filter on $S$ is an ultrafilter exactly when $A\in F$ or $S\setminus A\in F$ for all $A\subseteq S$.'
            answer_contract: {"kind":"written"}
            answer: 'Check the filter laws directly, and use Zorn''s Lemma on the filters above F for part (c). A set A with A and its complement outside F enlarges F in part (d).'
            solution_sketch: 'For (a), supersets of $S$ are closed under intersection and supersets, and a larger filter holds a set missing $a$, and then the empty set. For (b), finite complements are closed under intersection and supersets, and the family lies in the filter of supersets of a point or is split by a set whose complement and itself are infinite. For (c), order the filters above $F$ by inclusion. The union of a chain is a filter, so Zorn''s Lemma gives a maximal one. For (d), if $A$ and $S\setminus A$ are both outside $F$, add $A$ and its supersets and intersections to enlarge $F$.'
        constraints: 'The order of extension, well-orders of the integers and filters.'
    diagnostic_exemplar:
      problem: 'Let $A_1=\{1,2\}$ and $A_2=\{2,3\}$. (a) Give the number of functions $f$ with $f(1)\in A_1$ and $f(2)\in A_2$. (b) Give 1 if $f(1)=2$ and $f(2)=1$ is such a function and 0 if not.'
      answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}}]}
      answer: 'a = 4; b = 0'
      solution_sketch: 'Each index has 2 picks, so a = 4. The value $f(2)=1$ is not in $A_2$, so b = 0.'
