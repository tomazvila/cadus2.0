            answer: 'a = 3; b = 4; c = 4'
            solution_sketch: 'In (a) the elements $0,1,2$ of $5$ are strict subsets of $3$. The elements 3 and 4 are not, so a = 3. In (b) the elements $0,1,2,3$ are strict subsets of $4$, so b = 4. In (c) all elements $0,1,2,3$ are strict subsets of $4$, so c = 4.'
