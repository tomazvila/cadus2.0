        exemplars:
          - problem: 'Use the sets $0=\varnothing$ and $n''=n\cup\{n\}$. (a) Give the number of elements of $4$. (b) Give the number of elements of $7$. (c) Give 1 if $5\in3$ and 0 if not.'
