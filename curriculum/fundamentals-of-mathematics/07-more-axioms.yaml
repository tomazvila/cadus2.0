          - problem: 'Use the sets $0=\varnothing$ and $n''=n\cup\{n\}$. Let $\subset$ mean a strict subset. (a) Give the number of $k\in5$ with $k\subset3$. (b) Give the number of $k\in6$ with $k\subset4$. (c) Give the number of $k\in4$ with $k\subset4$.'
