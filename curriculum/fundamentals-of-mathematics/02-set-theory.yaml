    knowledge_points:
      - id: kp1
        name: 'Axiom 2.12 and Proposition 2.13: building a set by a property, and a set without elements'
        key_prerequisites: [fom-2-1-sets-objects, fom-1-8-russells-paradox]
        exemplars:
          - problem: 'Let $S=\{1,2,3\}$ and $A=\{x\in S : x>1\}$. Give 1 for true and 0 for false. (a) Is $2\in A$? (b) Is $1\in A$? (c) Is $4\in A$?'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 0; c = 0'
            solution_sketch: 'Only elements of $S$ with $x>1$ enter $A$, so $A=\{2,3\}$. The number 2 is in $A$, so (a) is 1. The number 1 fails $x>1$, so (b) is 0. The number 4 is not in $S$, so (c) is 0.'
          - problem: 'Let $S=\{1,2,\dots,10\}$. (a) Count the elements of $\{x\in S : x \text{ is even}\}$. (b) Count the elements of $\{x\in S : x>7\}$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}}]}
            answer: 'a = 5; b = 3'
            solution_sketch: 'The even elements of $S$ are 2, 4, 6, 8 and 10, so (a) is 5. The elements above 7 are 8, 9 and 10, so (b) is 3.'
          - problem: 'Let $S=\{1,2,\dots,12\}$ and $A=\{x\in S : 3 \text{ divides } x\}$. (a) Count the elements of $A$. (b) Add up the elements of $A$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}}]}
            answer: 'a = 4; b = 30'
            solution_sketch: 'The set $A$ is $\{3,6,9,12\}$. It has 4 elements, so (a) is 4. The sum is $3+6+9+12=30$, so (b) is 30.'
          - problem: 'Let $S=\{5,6,7,8\}$. Count the elements of the set $\{x\in S : p(x)\}$ for each open sentence. (a) $p(x)$ is $[x\in S]\vee[x\notin S]$. (b) $p(x)$ is $[x\in S]\wedge[x\notin S]$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}}]}
            answer: 'a = 4; b = 0'
            solution_sketch: 'In (a) the sentence holds for every object, so all 4 elements of $S$ stay. In (b) the sentence holds for no object, so the set is empty and has 0 elements.'
          - problem: 'Let $S=\{-3,-2,-1,0,1,2,3\}$ and $A=\{x\in S : x^2<4\}$. (a) Count the elements of $A$. (b) Give the largest element of $A$. (c) Add up the elements of $A$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 3; b = 1; c = 0'
            solution_sketch: 'The squares below 4 belong to $-1$, $0$ and $1$, so $A=\{-1,0,1\}$. It has 3 elements, so (a) is 3. The largest element is 1, so (b) is 1. The sum is $-1+0+1=0$, so (c) is 0.'
          - problem: 'Let $S=\{2,3,\dots,13\}$ and $A=\{x\in S : x \text{ is prime}\}$. (a) Count the elements of $A$. (b) Give the largest element of $A$. (c) Add up the elements of $A$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 6; b = 13; c = 41'
            solution_sketch: 'The primes in $S$ are 2, 3, 5, 7, 11 and 13. There are 6 of them, so (a) is 6. The largest is 13, so (b) is 13. The sum is $2+3+5+7+11+13=41$, so (c) is 41.'
          # argument: Proposition 2.13
          - problem: 'Prove: some set has no elements.'
            answer_contract: {"kind":"written"}
            answer: 'Start with any set S and specify the elements x of S with x in S and x not in S. No object meets both conditions, so the new set is empty.'
            solution_sketch: 'Axiom 2.1 gives a set S. The open sentence [x in S and x not in S] holds for no object. Axiom 2.12 turns S and this sentence into a set A. An element of A must meet the sentence, so A has no element.'
          # source: FoM exercise 2.2-2-5
          - problem: 'Prove: no set A has every set as an element.'
            answer_contract: {"kind":"written"}
            answer: 'Assume such an A exists and specify the set R of all x in A with x not in x. Then R is in R exactly when R is not in R, a contradiction.'
            solution_sketch: 'Assume a set A has every set as an element. Axiom 2.12 gives the set R of all x in A with x not an element of x. Then R is a set, so R is in A. If R is in R, the definition of R gives R not in R. If R is not in R, then R meets the rule, so R is in R. Both cases fail, as in Russell''s paradox.'
        constraints: 'build a subset by an open sentence and use it to reach a set without elements'
      - id: kp2
        name: 'Definition 2.14 to Proposition 2.16: the empty set, families of sets and the common part of a family'
        key_prerequisites: [fom-2-1-sets-objects]
        exemplars:
          - problem: '(a) Count the elements of $\emptyset$. (b) Count the elements of $\{\emptyset\}$. (c) Count the elements of $\{\emptyset,\{\emptyset\}\}$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 0; b = 1; c = 2'
            solution_sketch: 'The empty set has 0 elements. The set $\{\emptyset\}$ has one element, namely $\emptyset$, so (b) is 1. The set $\{\emptyset,\{\emptyset\}\}$ lists two different objects, so (c) is 2.'
          - problem: 'Give 1 for true and 0 for false. (a) Is $\emptyset\in\{\emptyset,\{1\}\}$? (b) Is $\emptyset\in\{1,2\}$? (c) Is $\emptyset\subseteq\{1,2\}$?'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 0; c = 1'
            solution_sketch: 'In (a) the empty set is listed as an element, so the value is 1. In (b) the elements are 1 and 2 only, so the value is 0. In (c) the empty set has no element outside $\{1,2\}$, so the value is 1.'
          - problem: 'Give 1 if the object is a family of sets and 0 if not. (a) $\{\{1\},\{2,3\}\}$. (b) $\{1,\{2\}\}$. (c) $\{\emptyset\}$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 0; c = 1'
            solution_sketch: 'A family of sets is a set whose elements are all sets. In (a) both elements are sets, so the value is 1. In (b) the element 1 is not a set, so the value is 0. In (c) the one element $\emptyset$ is a set, so the value is 1.'
          - problem: 'Let $\mathcal F=\{\{1,2\},\{2,3\},\{2,4\}\}$. (a) Count the members of $\mathcal F$. (b) Count the elements of $\bigcap\mathcal F$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}}]}
            answer: 'a = 3; b = 1'
            solution_sketch: 'The family lists three sets, so (a) is 3. The number 2 is in all three sets. No other number is in all three, so $\bigcap\mathcal F=\{2\}$ and (b) is 1.'
          - problem: 'Let $\mathcal C=\{\{1,2,3,4\},\{2,3,4,5\},\{3,4,5,6\}\}$. (a) Count the elements of $\bigcap\mathcal C$. (b) Add up the elements of $\bigcap\mathcal C$. (c) Count the elements of $\{1,2,3,4\}$ that are not in $\bigcap\mathcal C$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 2; b = 7; c = 2'
            solution_sketch: 'Only 3 and 4 lie in all three sets, so $\bigcap\mathcal C=\{3,4\}$ and (a) is 2. The sum is $3+4=7$, so (b) is 7. The elements 1 and 2 of the first set are left out, so (c) is 2.'
          - problem: 'Let $\mathcal C=\{\{2,4,6,8\},\{4,8,12\},\{4,8,16,20\}\}$ and $C_0=\{4,8,12\}$. Build $I=\{x\in C_0 : x\in C \text{ for every } C\in\mathcal C\}$. (a) Count the elements of $C_0$ that the sentence tests. (b) Count the elements of $I$. (c) Add up the elements of $I$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 3; b = 2; c = 12'
            solution_sketch: 'The set $C_0$ has 3 elements, so (a) is 3. The numbers 4 and 8 lie in all three sets. The number 12 is missing from the first set. So $I=\{4,8\}$, (b) is 2 and (c) is $4+8=12$.'
          # argument: Proposition 2.16
          - problem: 'Prove: if $\mathcal C$ is a nonempty family of sets, some set $I$ has this property. An object $x$ is in $I$ exactly when $x$ is in every member of $\mathcal C$.'
            answer_contract: {"kind":"written"}
            answer: 'Pick one member C0 of the family. Specify the elements of C0 that lie in every member of the family.'
            solution_sketch: 'The sentence [x is in every member of the family] is open. Pick a member C0 of the nonempty family. Axiom 2.12 gives the set I of all x in C0 that lie in every member. An object in every member lies in C0, so it is in I. The reverse direction holds by the definition of I.'
          # source: FoM exercise 2.2-2-6
          - problem: 'Prove: let $A$, $B$ and $U$ be sets with $A\subseteq U$ and $B\subseteq U$. Then $A\subseteq B$ exactly when $U\setminus B\subseteq U\setminus A$.'
            answer_contract: {"kind":"written"}
            answer: 'Use contraposition on elements of U. An element x in A is in B exactly when x not in B implies x not in A.'
            solution_sketch: 'Assume $A\subseteq B$ and take x in $U\setminus B$. Then x in A forces x in B, so x is not in A and x is in $U\setminus A$. Now assume $U\setminus B\subseteq U\setminus A$ and take x in A. If x is not in B, then x is in $U\setminus B$ and so not in A, which fails. So x is in B.'
        constraints: 'work with the empty set and families, and build the common part of a family'
      - id: kp3
        name: 'Definition 2.17 to Proposition 2.20: intersections, disjoint families and removing elements'
        key_prerequisites: [fom-2-1-sets-objects]
        exemplars:
          - problem: 'Let $A=\{1,2,3,4\}$ and $B=\{3,4,5,6\}$. (a) Count the elements of $A\cap B$. (b) Add up the elements of $A\cap B$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}}]}
            answer: 'a = 2; b = 7'
            solution_sketch: 'The sets share 3 and 4, so $A\cap B=\{3,4\}$. It has 2 elements, so (a) is 2. The sum is $3+4=7$, so (b) is 7.'
          - problem: 'Let $\mathcal C=\{\{1,2,3\},\{2,3,4\},\{3,4,5\}\}$. Give 1 for true and 0 for false. (a) Does $\bigcap\mathcal C$ have exactly one element? (b) Is $\bigcap\mathcal C\subseteq\{2,3,4\}$? (c) Is $\bigcap\mathcal C\subseteq\{1,2\}$?'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 1; c = 0'
            solution_sketch: 'Only 3 lies in all three sets, so $\bigcap\mathcal C=\{3\}$ and (a) is 1. The number 3 is in $\{2,3,4\}$, so (b) is 1. The number 3 is not in $\{1,2\}$, so (c) is 0.'
          - problem: 'A family is disjoint when its intersection has no elements. Give 1 for a disjoint family and 0 for a family that is not disjoint. (a) $\{\{1,2\},\{2,3\},\{3,1\}\}$. (b) $\{\{1,2\},\{2,3\},\{2,5\}\}$. (c) $\{\{1\},\{2\}\}$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 0; c = 1'
            solution_sketch: 'In (a) no number lies in all three sets, so the intersection is empty and the value is 1. In (b) the number 2 lies in all three sets, so the value is 0. In (c) the sets share nothing, so the value is 1.'
          - problem: 'Let $A=\{1,2,\dots,8\}$ and $B=\{2,4,6,8,10\}$. Form the set of elements of $A$ that are not in $B$. (a) Count its elements. (b) Add up its elements.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}}]}
            answer: 'a = 4; b = 16'
            solution_sketch: 'The elements of $A$ outside $B$ are 1, 3, 5 and 7. There are 4 of them, so (a) is 4. The sum is $1+3+5+7=16$, so (b) is 16.'
          - problem: 'Let $\mathcal C=\{\{1,2,3,4\},\{3,4,5\},\{4,5,6,7\}\}$ and let $x$ be an element of $\bigcap\mathcal C$. (a) Count the members of $\mathcal C$ that contain $x$. (b) Give 1 if $x\in\{4,5,6,7\}$ and 0 if not.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}}]}
            answer: 'a = 3; b = 1'
            solution_sketch: 'Only 4 lies in all three sets, so $x=4$. The element $x$ lies in every member, so (a) is 3. The number 4 is in $\{4,5,6,7\}$, so (b) is 1.'
          - problem: 'Let $U=\{1,2,\dots,60\}$. Take the family of three sets: the multiples of 2 in $U$, the multiples of 3 in $U$ and the multiples of 5 in $U$. (a) Count the elements of the intersection of the family. (b) Give the largest element of the intersection.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}}]}
            answer: 'a = 2; b = 60'
            solution_sketch: 'A number in all three sets is a multiple of 30. In $U$ these are 30 and 60, so (a) is 2. The largest one is 60, so (b) is 60.'
          # argument: Proposition 2.18
          - problem: 'Prove: let $\mathcal C$ be a family of sets and let $D$ be a member of $\mathcal C$. Then $\bigcap\mathcal C\subseteq D$.'
            answer_contract: {"kind":"written"}
            answer: 'Take x in the intersection. Then x lies in every member of the family, so x lies in D.'
            solution_sketch: 'To show a subset relation, take an arbitrary x in $\bigcap\mathcal C$. By Definition 2.17, x lies in every member of the family. The set D is a member, so x lies in D. The element x was arbitrary, so every element of the intersection is in D.'
          # argument: Proposition 2.20
          - problem: 'Prove: for sets $A$ and $B$, some set holds exactly the elements of $A$ that are not in $B$.'
            answer_contract: {"kind":"written"}
            answer: 'The sentence x is not in B is open on A. Specification gives the set of all x in A with x not in B.'
            solution_sketch: 'The sentence [x is not in B] is open for the elements of A. Axiom 2.12 applies to A and this sentence. It gives the set of all x in A with x not in B. Its elements are exactly the elements of A outside B.'
          # source: FoM exercise 2.2-2-7
          - problem: 'Prove: let $A$, $B$ and $U$ be sets with $A\subseteq U$ and $B\subseteq U$. Then $A\subseteq B$ exactly when $A\cap(U\setminus B)\subseteq\emptyset$.'
            answer_contract: {"kind":"written"}
            answer: 'If A is in B, no element of A avoids B, so the intersection is empty. An element of A outside B lies in the intersection.'
            solution_sketch: 'Assume $A\subseteq B$. An element of $A\cap(U\setminus B)$ is in A and not in B, which fails. So the intersection has no element. Now assume the intersection has no element and take x in A. If x is not in B, x lies in the intersection, which fails. So x is in B.'
          # source: FoM exercise 2.2-2-8
          - problem: 'Let $A$ and $B$ be sets. (a) Prove: $A\setminus B\subseteq A$. (b) Take $A=\{1,2\}$ and $B=\{2,3\}$ and name an element of $A\setminus B$ that is not in $B$. (c) State when $A\setminus B\subseteq B$ holds.'
            answer_contract: {"kind":"written"}
            answer: 'Each element of A minus B lies in A, and 1 works for (b). The inclusion holds exactly when A is a subset of B.'
            solution_sketch: 'Take x in $A\setminus B$. By definition x is in A, which gives (a). For (b) the set $A\setminus B$ is $\{1\}$, and 1 is not in B. An element of $A\setminus B$ is outside B, so the inclusion holds only if $A\setminus B$ is empty, that is $A\subseteq B$.'
        constraints: 'compute intersections, test disjoint families and build the set of elements outside a set'
      - id: kp4
        name: 'Definition 2.21 to Example 2.23: the relative complement and small models of the axioms'
        key_prerequisites: [fom-2-1-sets-objects]
        exemplars:
          - problem: 'Let $A=\{1,2,3,4,5\}$ and $B=\{4,5,6,7\}$. (a) Count the elements of $A\setminus B$. (b) Count the elements of $B\setminus A$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}}]}
            answer: 'a = 3; b = 2'
            solution_sketch: 'The set $A\setminus B$ is $\{1,2,3\}$, so (a) is 3. The set $B\setminus A$ is $\{6,7\}$, so (b) is 2.'
          - problem: 'A model has no objects. Its only set is $\emptyset$. (a) Count the sets of the model. (b) Count the elements of $\emptyset\setminus\emptyset$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 0'
            solution_sketch: 'The model holds one set, so (a) is 1. Nothing is in $\emptyset$, so nothing is in $\emptyset\setminus\emptyset$ and (b) is 0.'
          - problem: 'Let $A=\{1,2,3\}$ and $B=\{3,4\}$. Give 1 for true and 0 for false. (a) Is $A\setminus B\subseteq A$? (b) Is $A\setminus B\subseteq B$? (c) Is $B\setminus A\subseteq A$?'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 0; c = 0'
            solution_sketch: 'We have $A\setminus B=\{1,2\}$ and $B\setminus A=\{4\}$. The set $\{1,2\}$ is in $A$, so (a) is 1. The number 1 is not in $B$, so (b) is 0. The number 4 is not in $A$, so (c) is 0.'
          - problem: 'Let $A=\{1,2,\dots,10\}$ and let $B$ hold the multiples of 3 in $A$. (a) Count the elements of $A\setminus B$. (b) Add up the elements of $A\setminus B$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}}]}
            answer: 'a = 7; b = 37'
            solution_sketch: 'The set $B$ is $\{3,6,9\}$. So $A\setminus B$ has $10-3=7$ elements, and (a) is 7. The sum of $A$ is 55 and the sum of $B$ is 18, so (b) is $55-18=37$.'
          - problem: 'A model has the objects $a$, $b$ and $c$. Its sets are all subsets of $\{a,b,c\}$. Let $A=\{a,b,c\}$ and $B=\{b\}$. (a) Count the elements of $A\setminus B$. (b) Count the sets of the model. (c) Count the sets of the model that are subsets of $A\setminus B$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 2; b = 8; c = 4'
            solution_sketch: 'We have $A\setminus B=\{a,c\}$, so (a) is 2. A set of 3 objects has $2^3=8$ subsets, so (b) is 8. The subsets of $\{a,c\}$ are $\emptyset$, $\{a\}$, $\{c\}$ and $\{a,c\}$, so (c) is 4.'
          - problem: 'Let $U=\{1,2,\dots,9\}$, $A=\{1,2,3\}$ and $B=\{2,3,4,5\}$. (a) Count the elements of $U\setminus B$. (b) Count the elements of $U\setminus A$. (c) Is $U\setminus B\subseteq U\setminus A$? Give 1 for yes and 0 for no.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 5; b = 6; c = 0'
            solution_sketch: 'We have $U\setminus B=\{1,6,7,8,9\}$, so (a) is 5. We have $U\setminus A=\{4,5,6,7,8,9\}$, so (b) is 6. The number 1 is in the first set and not in the second, so (c) is 0.'
          # source: FoM exercise 2.2-2-4
          - problem: 'A model has the objects $a,b,c,d,e$. Its sets are all subsets of $\{a,b,c,d,e\}$. (a) Count all sets of the model. (b) Count the sets with exactly two elements. (c) Count the sets with at least four elements.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 32; b = 10; c = 6'
            solution_sketch: 'Each of 5 objects is in a subset or not, so there are $2^5=32$ sets and (a) is 32. Pairs of 5 objects number $\binom52=10$, so (b) is 10. Sets with 4 elements number 5 and the set with 5 elements is 1, so (c) is $5+1=6$.'
          # source: FoM exercise 2.2-2-9
          - problem: 'Let $A=\{1,2\}$, $B=\{2,3\}$, $C=\{3,1\}$. (a) Count the elements of $A$ that are not in $A\cap B$. (b) Count the elements of $A$ that are not in $B$. (c) Count the sets among $A\cap B$, $A\cap C$ and $B\cap C$ that have no elements.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 1; c = 0'
            solution_sketch: 'We have $A\cap B=\{2\}$. The element 1 of $A$ is outside it, so (a) is 1 and $A\subseteq A\cap B$ fails. The element 1 of $A$ is not in $B$, although $A\cap B$ is nonempty, so (b) is 1. The intersections are $\{2\}$, $\{1\}$ and $\{3\}$, while $A\cap B\cap C$ is empty. So none of the three is empty and (c) is 0.'
        constraints: 'compute relative complements and count the sets of a small model'
