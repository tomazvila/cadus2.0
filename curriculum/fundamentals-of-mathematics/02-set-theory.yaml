          - problem: 'Let $S=\{1,2,3\}$. For each set below, give 1 if it is an element of $P(S)$ and 0 if it is not. (a) $\{1,3\}$. (b) $\{1,4\}$. (c) $\emptyset$. (d) $\{1,2,3\}$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 0; c = 1; d = 1'
            solution_sketch: 'An element of $P(S)$ is a subset of $S$. The sets $\{1,3\}$, $\emptyset$ and $\{1,2,3\}$ are subsets of $S$, so they get 1. The set $\{1,4\}$ holds 4, which is not in $S$, so it gets 0.'
          - problem: 'Use the definition $(a,b):=\{\{a\},\{a,b\}\}$ of an ordered pair. (a) Give the number of elements of the set $(2,5)$. (b) Give the number of elements of the set $(3,3)$. (c) Give 1 if $(2,5)=(5,2)$ and 0 if not.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 2; b = 1; c = 0'
            solution_sketch: 'The set $(2,5)$ is $\{\{2\},\{2,5\}\}$, so (a) is 2. The set $(3,3)$ is $\{\{3\},\{3,3\}\}=\{\{3\}\}$, so (b) is 1. The sets $\{2\}$ and $\{5\}$ differ, so $(2,5)\ne(5,2)$ and (c) is 0.'
          - problem: 'Suppose $\{\{a\},\{a,b\}\}=\{\{3\},\{3,7\}\}$. Give the value of each expression. (a) $a$. (b) $b$. (c) $a+b$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 3; b = 7; c = 10'
            solution_sketch: 'Two ordered pairs are equal exactly when their first entries and their second entries are equal. So $a=3$ and $b=7$. Then $a+b=10$.'
          - problem: 'Suppose $\{\{a\},\{a,b\}\}=\{\{6\}\}$. (a) Give the value of $a$. (b) Give the value of $b$. (c) Give the number of elements of $\{\{a\},\{a,b\}\}$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 6; b = 6; c = 1'
            solution_sketch: 'The right side has one element, $\{6\}$. So $\{a\}=\{6\}$ and $a=6$. Also $\{a,b\}=\{6\}$ forces $b=6$, and the set has 1 element.'
          - problem: 'Let $S_0=\emptyset$ and $S_{k+1}=P(S_k)$. Give the number of elements of each set. (a) $S_1$. (b) $S_2$. (c) $S_3$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 2; c = 4'
            solution_sketch: 'The set $S_1=\{\emptyset\}$ has 1 element. The set $S_2$ has $2^1=2$ elements. The set $S_3$ has $2^2=4$ elements.'
          # source: FoM exercise 2.5-2-36
          - problem: 'Let $A=\{a,b,c,d\}$ and let $B=\{1,2,3,4\}$. (a) Give the number of elements of $P(A)$. (b) Give the number of elements of $P(B)$. (c) Give the number of subsets of $A$ that have exactly 3 elements.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a=16;b=16;c=4'
            solution_sketch: 'A set with 4 elements has $2^4=16$ subsets, so (a) and (b) are 16. A 3 element subset leaves out one of the 4 elements. So (c) is 4.'
          # source: FoM exercise 2.5-2-37
          - problem: 'Consider the set $\{1,2,3,4,5\}$. (a) Give the number of its subsets with exactly two elements. (b) Give the number of those subsets that contain the element 1. (c) Give the sum of the two numbers in the subset that holds the two largest elements.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a=10;b=4;c=9'
            solution_sketch: 'There are $\binom{5}{2}=10$ pairs, so (a) is 10. A pair with the element 1 needs one more element from 4 choices, so (b) is 4. The two largest elements are 4 and 5, and 4+5=9, so (c) is 9.'
          # source: FoM exercise 2.5-2-34
          - problem: 'Let $f:A\to B$ be a function. Prove all three facts. (a) If $A$ is not empty, then $f$ is injective exactly when some function $g:B\to A$ has $g\circ f=\mathrm{id}_A$. (b) $f$ is surjective exactly when some function $h:B\to A$ has $f\circ h=\mathrm{id}_B$. (c) $f$ is bijective exactly when some function $k:B\to A$ has $k\circ f=\mathrm{id}_A$ and $f\circ k=\mathrm{id}_B$.'
            answer_contract: {"kind":"written"}
            answer: 'Build the one-sided inverse by sending each element of B to a chosen preimage. Read the identity back, and join (a) and (b) for (c).'
            solution_sketch: 'For (a), let f be injective. Set g(f(x))=x on the range of f and send every other element of B to one fixed element of A. For the converse, g(f(x))=g(f(y)) gives x=y. For (b), pick one preimage h(y) for each y, so f(h(y))=y; the converse holds because f(h(y))=y shows y is a value. For (c), join (a) and (b), and show g=g(f(h))=h so one function k works.'
          # source: FoM exercise 2.5-2-35
          - problem: 'Let $f:A\to B$ be a function. (a) Prove that $f$ is bijective if $f$ has an inverse. (b) Prove that two inverses $g,h:B\to A$ of $f$ are equal.'
            answer_contract: {"kind":"written"}
            answer: 'An inverse gives f(g(y))=y, so f is onto, and g(f(x))=x, so f is one-to-one. For inverses g and h, g(y)=g(f(h(y)))=h(y).'
            solution_sketch: 'Use Definition 2.57 for the inverse g. For (a), the identity f(g(y))=y shows each y is a value of f. The identity g(f(x))=x shows f(x)=f(y) gives x=y. For (b), compute g(y)=g(f(h(y)))=h(y) for every y in B. So g=h.'
          # argument: Theorem 2.42
          - problem: 'Prove: Let $a,b,c,d$ be objects. Then $\{\{a\},\{a,b\}\}=\{\{c\},\{c,d\}\}$ holds exactly when $a=c$ and $b=d$.'
            answer_contract: {"kind":"written"}
            answer: 'Split into two cases: if {a}={c,d} all four objects are equal; otherwise {a}={c} and {a,b}={c,d} give a=c and b=d.'
            solution_sketch: 'Use Definition 2.43 for both sides. If a=c and b=d, the two sets are the same set. For the converse, treat the case {a}={c,d} first. Then a=c=d, and the other element gives {a,b}={c}, so b=c as well. In the other case {a}={c}, so a=c, and c is not d. Then {a,b}={c,d} forces b=d.'
        constraints: 'Count subsets, test membership in a power set, and read an ordered pair as a set of sets.'
      - id: kp2
        name: 'Definition 2.44, Definition 2.45, Definition 2.47 and Example 2.48: products, relations, domain and range'
        key_prerequisites: [cartesian-products]
        exemplars:
          - problem: 'Let $A$ have 3 elements and let $B$ have 4 elements. Give the number of elements of each set. (a) $A\times B$. (b) $B\times A$. (c) $A\times A$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 12; b = 12; c = 9'
            solution_sketch: 'A product has as many elements as the product of the two sizes. So $|A\times B|=3\cdot4=12$ and $|B\times A|=12$. Also $|A\times A|=3\cdot3=9$.'
          - problem: 'Let $A=\{1,2\}$ and $B=\{3,4\}$. For each pair, give 1 if it is an element of $A\times B$ and 0 if not. (a) $(1,3)$. (b) $(3,1)$. (c) $(2,4)$. (d) $(2,2)$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 0; c = 1; d = 0'
            solution_sketch: 'A pair is in $A\times B$ when its first entry is in $A$ and its second entry is in $B$. The pairs (1,3) and (2,4) pass, so they get 1. The pair (3,1) has 3 first, and (2,2) has 2 second, so both get 0.'
          - problem: 'On the set $\{1,2,3,4\}$ let $a\sim b$ mean $a<b$. (a) Give the number of pairs in the relation $\sim$. (b) Give the number of elements of $\mathrm{dom}(\sim)$. (c) Give the number of elements of $\mathrm{rng}(\sim)$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 6; b = 3; c = 3'
            solution_sketch: 'The pairs are (1,2), (1,3), (1,4), (2,3), (2,4) and (3,4), so (a) is 6. The first entries are 1, 2 and 3, so (b) is 3. The second entries are 2, 3 and 4, so (c) is 3.'
          - problem: 'Let $R=\{(1,2),(1,3),(2,3),(4,2)\}$ be a relation from $\{1,2,3,4\}$ to $\{1,2,3,4\}$. (a) Give the number of elements of $\mathrm{dom}(R)$. (b) Give the number of elements of $\mathrm{rng}(R)$. (c) Give the sum of the elements of $\mathrm{rng}(R)$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 3; b = 2; c = 5'
            solution_sketch: 'The first entries are 1, 2 and 4, so the domain has 3 elements. The second entries are 2 and 3, so the range has 2 elements. Their sum is 2+3=5.'
          - problem: 'Let $A$ have 2 elements and let $B$ have 3 elements. (a) Give the number of elements of $A\times B$. (b) Give the number of relations from $A$ to $B$. (c) Give the number of relations from $A$ to $B$ that have exactly one pair.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 6; b = 64; c = 6'
            solution_sketch: 'The product has $2\cdot3=6$ elements, so (a) is 6. A relation is a subset of the product, so there are $2^6=64$ relations. A relation with one pair is a one element subset, so (c) is 6.'
          - problem: 'Call a relation $\sim$ symmetric when $a\sim b$ always gives $b\sim a$. On $\{1,2,3\}$, give 1 if the relation is symmetric and 0 if not. (a) $\{(1,2),(2,1),(3,3)\}$. (b) $\{(1,2),(2,3)\}$. (c) $a\sim b$ means $a<b$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 0; c = 0'
            solution_sketch: 'In (a) every pair has its reverse, so the value is 1. In (b) the pair (1,2) has no reverse (2,1), so the value is 0. In (c) we have 1<2 but not 2<1, so the value is 0.'
          # source: FoM exercise 2.5-2-38
          - problem: 'Look at the power set of $\{1,2,3,4\}$ and sort its elements by size. Give the number of elements with the given size. (a) Size 0. (b) Size 1. (c) Size 2. (d) Size 3. (e) Size 4.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}},{"name":"e","contract":{"kind":"exact"}}]}
            answer: 'a=1;b=4;c=6;d=4;e=1'
            solution_sketch: 'The number of subsets of size $k$ is $\binom{4}{k}$. These values are 1, 4, 6, 4 and 1. Their sum is 16, the size of the power set.'
          # source: FoM exercise 2.5-2-39
          - problem: 'Let $A=\{1,2,3,4\}$ and $B=\{a,b,c,d,e\}$. Four relations are given. $R_1=\{(1,a),(2,b),(3,c),(4,d)\}$ from $A$ to $B$. $R_2=\{(1,a),(2,b),(3,c),(3,d)\}$ from $A\setminus\{4\}$ to $B$. $R_3=\{(1,a),(2,b),(3,c),(4,c)\}$ from $A$ to $B$. $R_4=\{(1,a),(2,b),(3,c),(4,a)\}$ from $A$ to $B\setminus\{d,e\}$. Give 1 for true and 0 for false in each part below. A relation that is no function is neither injective nor surjective. (a) $R_1$ is a function. (b) $R_1$ is injective. (c) $R_1$ is surjective. (d) $R_2$ is a function. (e) $R_2$ is injective. (f) $R_2$ is surjective. (g) $R_3$ is a function. (h) $R_3$ is injective. (i) $R_3$ is surjective. (j) $R_4$ is a function. (k) $R_4$ is injective. (l) $R_4$ is surjective.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}},{"name":"e","contract":{"kind":"exact"}},{"name":"f","contract":{"kind":"exact"}},{"name":"g","contract":{"kind":"exact"}},{"name":"h","contract":{"kind":"exact"}},{"name":"i","contract":{"kind":"exact"}},{"name":"j","contract":{"kind":"exact"}},{"name":"k","contract":{"kind":"exact"}},{"name":"l","contract":{"kind":"exact"}}]}
            answer: 'a=1;b=1;c=0;d=0;e=0;f=0;g=1;h=0;i=0;j=1;k=0;l=1'
            solution_sketch: 'In R_1 every element of A has one output and no output repeats, so (a) and (b) are 1. The element e of B has no input, so (c) is 0. In R_2 the element 3 has two outputs, so (d), (e) and (f) are 0. In R_3 the outputs of 3 and 4 are equal, so (g) is 1 and (h) and (i) are 0. In R_4 the outputs a, b and c all occur and a repeats, so (j) is 1, (k) is 0 and (l) is 1.'
          # source: FoM exercise 2.5-2-40
          - problem: 'For each pair of functions, give 1 if the two functions are inverses of each other and 0 if not. (a) $f,g:\mathbb{R}\to\mathbb{R}$ with $f(x)=2x+8$ and $g(x)=\frac{x}{2}-4$. (b) $f:\mathbb{R}\to\mathbb{R}$ with $f(x)=x^2+4$ and $g:[4,\infty)\to\mathbb{R}$ with $g(x)=\sqrt{x-4}$. (c) $f,g:\mathbb{R}\setminus\{2\}\to\mathbb{R}\setminus\{2\}$ with $f(x)=g(x)=\frac{2x+1}{x-2}$. (d) $f,g:\mathbb{R}\to\mathbb{R}$ with $f(x)=\sqrt[3]{4x+1}$ and $g(x)=\frac{x^3+1}{4}$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}}]}
            answer: 'a=1;b=0;c=1;d=0'
            solution_sketch: 'In (a), f(g(x))=x-8+8=x and g(f(x))=x, so the value is 1. In (b), f is not injective, and the domain of g is not the codomain of f, so the value is 0. In (c), f(f(x))=5x/5=x, so the value is 1. In (d), f(g(x)) is the cube root of x^3+2, which differs from x, so the value is 0.'
        constraints: 'Form pairs of a product, count relations, and find the domain and the range of a relation.'
      - id: kp3
        name: 'Definition 2.49, Example 2.51, Definition 2.52 and Proposition 2.53: functions, injective and surjective'
        key_prerequisites: [functions-formal-definition, functions-injective-surjective]
        exemplars:
          - problem: 'Each relation goes from $\{1,2,3\}$ to $\{4,5\}$. Give 1 if it is a function and 0 if not. (a) $\{(1,4),(2,4),(3,5)\}$. (b) $\{(1,4),(2,5)\}$. (c) $\{(1,4),(1,5),(2,4),(3,4)\}$. (d) $\{(1,5),(2,5),(3,5)\}$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 0; c = 0; d = 1'
            solution_sketch: 'A function needs exactly one output for each input. Relations (a) and (d) pass, so they get 1. In (b) the input 3 has no output, and in (c) the input 1 has two outputs, so both get 0.'
          - problem: 'Let $f:\{1,2,3\}\to\{4,5,6\}$ with $f(1)=5$, $f(2)=6$, $f(3)=4$, and let $g:\{1,2,3\}\to\{a,b,c\}$ with $g(1)=a$, $g(2)=a$, $g(3)=b$. For each statement, give 1 if it is true and 0 if not. (a) $f$ is injective. (b) $f$ is surjective. (c) $g$ is injective. (d) $g$ is surjective.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 1; c = 0; d = 0'
            solution_sketch: 'The function f uses the three outputs 5, 6 and 4 once each, so f is injective and surjective: the values are 1 and 1. The function g sends 1 and 2 to a, so g is not injective: the value is 0. The element c is never an output of g, so g is not surjective: the value is 0.'
          - problem: 'Give the number of functions of each kind. (a) All functions from $\{1,2,3\}$ to $\{a,b\}$. (b) Injective functions from $\{1,2\}$ to $\{a,b,c\}$. (c) Injective functions from $\{1,2,3\}$ to $\{a,b\}$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 8; b = 6; c = 0'
            solution_sketch: 'Each of 3 inputs has 2 choices, so (a) is $2^3=8$. The first input has 3 choices and the second has 2 choices left, so (b) is 6. Three inputs cannot have 3 different outputs in a set of 2 elements, so (c) is 0.'
          - problem: 'Let $f:\{1,2,3,4\}\to\{1,2,3,4\}$ with $f(1)=2$, $f(2)=3$, $f(3)=2$, $f(4)=3$. (a) Give the number of ordered pairs $(x,y)$ with $x\ne y$ and $f(x)=f(y)$. (b) Give 1 if $f$ is injective and 0 if not. (c) Give the number of such pairs for the function $g(x)=x$ on the same set.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 4; b = 0; c = 0'
            solution_sketch: 'The pairs are (1,3), (3,1), (2,4) and (4,2), so (a) is 4. Since such pairs exist, f is not injective and (b) is 0. The function g never repeats an output, so it has 0 such pairs.'
          - problem: 'Let $f:\{-2,-1,0,1,2\}\to\{0,1,4\}$ with $f(x)=x^2$. (a) Give the number of elements $x$ with $f(x)=4$. (b) Give the least element $a$ with $f(a)=f(1)$. (c) Give 1 if $f$ is injective and 0 if not. (d) Give 1 if $f$ is surjective and 0 if not.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}}]}
            answer: 'a = 2; b = -1; c = 0; d = 1'
            solution_sketch: 'Both -2 and 2 give 4, so (a) is 2. The inputs with the value f(1)=1 are -1 and 1, so (b) is -1. Because -1 and 1 share an output, f is not injective and (c) is 0. The outputs 4, 1, 0 all occur, so (d) is 1.'
          # source: FoM exercise 2.5-2-42
          - problem: 'Some functions below are one-to-one. When $f$ is one-to-one, give the value of the inverse of $f$ at the given number. When $f$ is not one-to-one, give 0. Every inverse value asked for here is not 0. (a) $f(x)=4x+7$, at the number 15. (b) $f(x)=x^2+3$, at the number 7. (c) $f:\mathbb{R}\setminus\{2\}\to\mathbb{R}$ with $f(x)=\frac{3x+1}{x-2}$, at the number 4. (d) $f(x)=2x^3-9$, at the number $-7$. (e) $f:\mathbb{R}\setminus\{1\}\to\mathbb{R}$ with $f(x)=\frac{5}{x-1}$, at the number 1. (f) $f(x)=|x-2|$, at the number 3. (g) $f(x)=\sqrt[3]{35-x}$, at the number 2.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}},{"name":"e","contract":{"kind":"exact"}},{"name":"f","contract":{"kind":"exact"}},{"name":"g","contract":{"kind":"exact"}}]}
            answer: 'a=2;b=0;c=9;d=1;e=6;f=0;g=27'
            solution_sketch: 'In (a), 4x+7=15 gives x=2. In (b) and (f) two inputs share an output, so the value is 0. In (c), solve (3x+1)/(x-2)=4 to get x=9. In (d), 2x^3-9=-7 gives x=1. In (e), 5/(x-1)=1 gives x=6. In (g), 35-x=8 gives x=27.'
          # source: FoM exercise 2.5-2-43
          - problem: 'Four functions go from $\mathbb{R}$ to $\mathbb{R}$. $F_1(x)=x^3$. $F_2(x)=x^2$. $F_3(x)=2^x$. $F_4(x)=x^3-x$. Give 1 for true and 0 for false. (a) $F_1$ is injective. (b) $F_1$ is surjective. (c) $F_2$ is injective. (d) $F_2$ is surjective. (e) $F_3$ is injective. (f) $F_3$ is surjective. (g) $F_4$ is injective. (h) $F_4$ is surjective.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}},{"name":"e","contract":{"kind":"exact"}},{"name":"f","contract":{"kind":"exact"}},{"name":"g","contract":{"kind":"exact"}},{"name":"h","contract":{"kind":"exact"}}]}
            answer: 'a=1;b=1;c=0;d=0;e=1;f=0;g=0;h=1'
            solution_sketch: 'The cube is injective and takes every real value, so (a) and (b) are 1. The square repeats outputs and never takes -1, so (c) and (d) are 0. The function 2^x is injective but takes only positive values, so (e) is 1 and (f) is 0. For x^3-x, the inputs 0 and 1 share the output 0, so (g) is 0; it takes every real value, so (h) is 1.'
          # source: FoM exercise 2.5-2-41
          - problem: 'Prove that $f:\mathbb{R}\to\mathbb{R}$ with $f(x)=x^2+1$ and $g:\mathbb{R}\to\mathbb{R}$ with $g(x)=\sqrt{|x-1|}$ are not inverses of each other. Then decide whether $f$ and $h:[1,\infty)\to\mathbb{R}$ with $h(x)=\sqrt{x-1}$ are inverses of each other, and justify the decision.'
            answer_contract: {"kind":"written"}
            answer: 'Test x=0 for g: f(g(0))=2. Test x=-1 for h: h(f(-1))=1, not -1, because f is not injective on R.'
            solution_sketch: 'Use Definition 2.57. First compute g(0)=1 and f(g(0))=2, which differs from 0, so f and g are not inverses. Next compute f(-1)=2 and h(2)=1, which differs from -1. So h(f(x)) is not x for all x. Thus f and h are not inverses either. Restricted to [0,infinity) for f, the pair is inverse.'
          # argument: Proposition 2.53
          - problem: 'Prove: Let $f:A\to B$ be a function. Then $f$ is injective exactly when $f(x)=f(y)$ implies $x=y$ for all $x,y\in A$.'
            answer_contract: {"kind":"written"}
            answer: 'The two implications are contrapositives of each other, so they are logically equivalent.'
            solution_sketch: 'Use Definition 2.52. Injective means that x differs from y implies f(x) differs from f(y). The contrapositive of this implication is: f(x)=f(y) implies x=y. An implication and its contrapositive have the same truth value for all x and y. So the two conditions are equivalent.'
        constraints: 'Decide if a relation is a function, test injective and surjective, and count functions.'
      - id: kp4
        name: 'Example 2.54, Definition 2.55, Example 2.56, Definition 2.57 and Example 2.58: composition, identity and inverse'
        key_prerequisites: [functions-formal-definition, functions-injective-surjective]
        exemplars:
          - problem: 'Let $f(x)=2x+1$ and $g(x)=x^2$ for all real $x$. Give the value of each expression. (a) $(f\circ g)(3)$. (b) $(g\circ f)(3)$. (c) $(f\circ f)(1)$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 19; b = 49; c = 7'
            solution_sketch: 'First g(3)=9 and f(9)=19, so (a) is 19. First f(3)=7 and g(7)=49, so (b) is 49. First f(1)=3 and f(3)=7, so (c) is 7.'
          - problem: 'Let $g:\{1,2,3\}\to\{a,b,c\}$ with $g(1)=b$, $g(2)=c$, $g(3)=a$, and let $f:\{a,b,c\}\to\{4,5\}$ with $f(a)=4$, $f(b)=5$, $f(c)=4$. (a) Give $(f\circ g)(1)$. (b) Give $(f\circ g)(2)$. (c) Give $(f\circ g)(3)$. (d) Give the number of elements of the range of $f\circ g$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}}]}
            answer: 'a = 5; b = 4; c = 4; d = 2'
            solution_sketch: 'Since g(1)=b and f(b)=5, (a) is 5. Since g(2)=c and f(c)=4, (b) is 4. Since g(3)=a and f(a)=4, (c) is 4. The values 5 and 4 occur, so the range has 2 elements.'
          - problem: 'Let $A=\{1,2,3\}$ and let $\mathrm{id}_A=\{(a,a):a\in A\}$. (a) Give the number of pairs in $\mathrm{id}_A$. (b) Let $f(x)=x+10$ on $A$. Give $(f\circ\mathrm{id}_A)(2)$. (c) Give 1 if $\mathrm{id}_A$ is bijective and 0 if not.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 3; b = 12; c = 1'
            solution_sketch: 'The set has one pair (a,a) for each of the 3 elements, so (a) is 3. Since id(2)=2 and f(2)=12, (b) is 12. The identity repeats no output and misses none, so (c) is 1.'
          - problem: 'Let $f(x)=3x-5$ for all real $x$ and let $g$ be the inverse of $f$. (a) Give $g(4)$. (b) Give $g(f(7))$. (c) Give $f(g(-2))$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 3; b = 7; c = -2'
            solution_sketch: 'Solve 3x-5=4 to get x=3, so (a) is 3. The identity g(f(x))=x gives (b) as 7. The identity f(g(y))=y gives (c) as -2.'
          - problem: 'Let $f:\{1,2,3\}\to\{a,b,c\}$ with $f(1)=c$, $f(2)=a$, $f(3)=b$, and let $g$ be the inverse of $f$. Give each value. (a) $g(a)$. (b) $g(b)$. (c) $g(c)$. (d) $(g\circ f)(3)$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}}]}
            answer: 'a = 2; b = 3; c = 1; d = 3'
            solution_sketch: 'The inverse reverses each pair. Since f(2)=a, g(a)=2. Since f(3)=b, g(b)=3. Since f(1)=c, g(c)=1. Also g(f(3))=3.'
          - problem: 'Let $f:\mathbb{R}\setminus\{3\}\to\mathbb{R}\setminus\{2\}$ with $f(x)=\frac{2x+1}{x-3}$ and let $g:\mathbb{R}\setminus\{2\}\to\mathbb{R}\setminus\{3\}$ with $g(y)=\frac{3y+1}{y-2}$. Give each value. (a) $f(4)$. (b) $g(9)$. (c) $g(3)$. (d) $f(10)$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}}]}
            answer: 'a = 9; b = 4; c = 10; d = 3'
            solution_sketch: 'Compute f(4)=9/1=9. Compute g(9)=28/7=4, which returns the input of (a). Compute g(3)=10/1=10. Compute f(10)=21/7=3, which returns the input of (c).'
          - problem: 'Let $f:\mathbb{R}\setminus\{1\}\to\mathbb{R}$ with $f(x)=\frac{x+3}{x-1}$. (a) Give $f(3)$. (b) Give $f(5)$. (c) Give the one real number that is not a value of $f$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 3; b = 2; c = 1'
            solution_sketch: 'Compute f(3)=6/2=3 and f(5)=8/4=2. Solve (x+3)/(x-1)=y to get x=(y+3)/(y-1). This needs y different from 1, so the number 1 is not a value of f, and (c) is 1.'
          # source: FoM exercise 2.5-2-44
          - problem: 'Give a counterexample for each of five statements. (a) Each injective function has all of $B$ as its set of values. (b) Each surjective function sends different inputs to different outputs. (c) If $f:A\to B$ and $g:B\to A$ are functions with $g\circ f=\mathrm{id}_A$, then $f$ is surjective. (d) If $f:A\to B$ and $g:B\to A$ are functions with $f\circ g=\mathrm{id}_B$, then $f$ is injective. (e) Each relation is a function.'
            answer_contract: {"kind":"written"}
            answer: 'Use small finite sets: {1} into {1,2} for (a) and (c), {1,2} onto {1} for (b) and (d), and a relation with one input and two outputs for (e).'
            solution_sketch: 'For (a) and (c), take f from {1} to {1,2} with f(1)=1. Then f is injective, and g with g(1)=g(2)=1 gives g(f(x))=x, but 2 is not a value of f. For (b) and (d), take f from {1,2} to {1} and g(1)=1. Then f(g(1))=1, but f(1)=f(2). For (e), take the relation {(1,1),(1,2)} from {1} to {1,2}, where the input 1 has two outputs.'
          # source: FoM exercise 2.5-2-45
          - problem: 'Let $A$ and $B$ be sets. Prove that there is a set whose elements are exactly $A$ and $B$.'
            answer_contract: {"kind":"written"}
            answer: 'A and B are subsets of A union B, so {A,B} sits inside P(A union B). Specification then selects the sets equal to A or B.'
            solution_sketch: 'The union of A and B is a set by the Axiom of Unions. By Axiom 2.40, P(A union B) is a set. Both A and B are subsets of A union B, so both are elements of that power set. Apply the Axiom of Specification to P(A union B) with the property X=A or X=B. The new set has exactly the elements A and B.'
          # source: FoM exercise 2.5-2-46
          - problem: 'Let $X$, $Y$, $Z$ be sets. Prove all four equalities. (a) $X\times(Y\cup Z)=(X\times Y)\cup(X\times Z)$. (b) $X\times(Y\cap Z)=(X\times Y)\cap(X\times Z)$. (c) $(X\cup Y)\times Z=(X\times Z)\cup(Y\times Z)$. (d) $(X\cap Y)\times Z=(X\times Z)\cap(Y\times Z)$.'
            answer_contract: {"kind":"written"}
            answer: 'Take an arbitrary pair (p,q) and unfold each side with the definition of the product. Use the rule for union or intersection on one entry.'
            solution_sketch: 'Use Definition 2.44 and the definitions of union and intersection. For (a), the pair (p,q) lies in X times (Y union Z) exactly when p is in X and q is in Y or in Z. That holds exactly when (p,q) is in X times Y or in X times Z. The proofs of (b), (c) and (d) follow the same steps. In (b) and (d) replace the word or by the word and.'
        constraints: 'Compose functions, use the identity function, and check values of an inverse function.'
      - id: kp5
        name: 'Definition 2.59, Theorem 2.60, Definition 2.61 and Definition 2.62: equivalent sets, Cantor''s diagonal set, indexed families and the superstructure'
        key_prerequisites: [uncountability-diagonalization, fom-2-4-axiom-unions]
        exemplars:
          - problem: 'Give 1 if the two sets are equivalent and 0 if not. (a) $\{1,2,3\}$ and $\{x,y,z\}$. (b) $\{1,2,3\}$ and $\{1,2,3,4\}$. (c) $P(\{1,2\})$ and $\{1,2,3,4\}$. (d) $P(\{1,2\})$ and $\{1,2,3\}$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 0; c = 1; d = 0'
            solution_sketch: 'Finite sets are equivalent exactly when they have the same number of elements. Both sets of (a) have 3 elements, so the value is 1. The set $P(\{1,2\})$ has 4 elements, so (c) is 1 and (d) is 0. The sets of (b) have 3 and 4 elements, so (b) is 0.'
          - problem: 'Let $X=\{1,2,3\}$. (a) Give the number of elements of $P(X)$. (b) Give the number of bijective functions from $X$ to $P(X)$. (c) Give the difference of the number of elements of $P(X)$ and of $X$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 8; b = 0; c = 5'
            solution_sketch: 'The set $P(X)$ has $2^3=8$ elements, so (a) is 8. A bijection needs equal sizes, but 3 differs from 8, so (b) is 0. The difference is 8-3=5.'
          - problem: 'Let $X=\{1,2,3\}$ and let $f:X\to P(X)$ with $f(1)=\{1,2\}$, $f(2)=\{3\}$, $f(3)=\{1,3\}$. Let $B=\{x\in X:x\notin f(x)\}$. (a) Give the number of elements of $B$. (b) Give the sum of the elements of $B$. (c) Give the number of elements $b$ of $X$ with $f(b)=B$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 2; c = 0'
            solution_sketch: 'Test each x. We have 1 in f(1) and 3 in f(3), so those two stay out of B. We have 2 not in f(2)={3}, so B={2}. Then (a) is 1 and (b) is 2. No f(b) equals {2}, so (c) is 0.'
          - problem: 'Let $X=\{1,2,3\}$ and let $f:X\to P(X)$ with $f(1)=\emptyset$, $f(2)=\{1,2\}$, $f(3)=\{2\}$. Let $B=\{x\in X:x\notin f(x)\}$. Give 1 if the element is in $B$ and 0 if not. (a) The element 1. (b) The element 2. (c) The element 3.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 0; c = 1'
            solution_sketch: 'The element 1 is not in f(1), which is empty, so (a) is 1. The element 2 is in f(2), so (b) is 0. The element 3 is not in f(3)={2}, so (c) is 1.'
          - problem: 'Let $S_1=\{1,2,3\}$, $S_2=\{2,3,4\}$ and $S_3=\{3,4,5\}$ be an indexed family with $I=\{1,2,3\}$. (a) Give the number of elements of $\bigcup_{i\in I}S_i$. (b) Give the number of elements of $\bigcap_{i\in I}S_i$. (c) Give the sum of the elements of $\bigcup_{i\in I}S_i$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 5; b = 1; c = 15'
            solution_sketch: 'The union is {1,2,3,4,5}, so (a) is 5. Only 3 lies in all three sets, so (b) is 1. The sum 1+2+3+4+5 is 15.'
          - problem: 'For $i\in\{2,3\}$ let $S_i$ be the set of all multiples of $i$ in $\{1,2,\dots,10\}$. (a) Give the number of elements of $\bigcup_{i}S_i$. (b) Give the number of elements of $\bigcap_{i}S_i$. (c) Give the sum of the elements of $\bigcap_{i}S_i$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 7; b = 1; c = 6'
            solution_sketch: 'The set S_2 holds 5 elements and S_3 holds 3 elements. They share only 6, so the union has 5+3-1=7 elements. The intersection is {6}, so (b) is 1 and (c) is 6.'
          - problem: 'Let $V_0=\emptyset$ and $V_n=V_{n-1}\cup P(V_{n-1})$. Give the number of elements of each set. (a) $V_1$. (b) $V_2$. (c) $V_3$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 2; c = 4'
            solution_sketch: 'The set V_1 is $\{\emptyset\}$ and has 1 element. The set V_2 adds $\{\{\emptyset\}\}$ and $\{\emptyset,\{\emptyset\}\}$ to V_1 and drops repeats, which gives $\{\emptyset,\{\emptyset\}\}$ with 2 elements. The power set of V_2 has 4 elements and holds V_2, so V_3 has 4 elements.'
          # argument: Theorem 2.60
          - problem: 'Prove: For every set $X$, there is no bijective function from $X$ to $P(X)$.'
            answer_contract: {"kind":"written"}
            answer: 'Assume a bijection f. The set of all x outside f(x) equals f(b) for some b, and b in f(b) fails both ways.'
            solution_sketch: 'Assume f from X to P(X) is a bijection. Define B as the set of all x in X with x not in f(x). Since f is surjective, B=f(b) for some b in X. If b is in B, then b is in f(b)=B, but the definition of B gives b not in f(b). If b is not in B, then b is not in f(b), so the definition puts b in B. Both cases fail, which is a contradiction.'
          # source: FoM exercise 2.5-2-47
          - problem: 'Let $\{C_i\}_{i\in I}$ be an indexed family of sets, let $\mathcal{C}$ be a family of sets, and let $X$ be a set. Both $I$ and $\mathcal{C}$ are not empty. Prove all four laws. (a) $X\setminus\bigcup_{i\in I}C_i=\bigcap_{i\in I}(X\setminus C_i)$. (b) $X\setminus\bigcup\mathcal{C}=\bigcap\{X\setminus C:C\in\mathcal{C}\}$. (c) $X\setminus\bigcap_{i\in I}C_i=\bigcup_{i\in I}(X\setminus C_i)$. (d) $X\setminus\bigcap\mathcal{C}=\bigcup\{X\setminus C:C\in\mathcal{C}\}$.'
            answer_contract: {"kind":"written"}
            answer: 'Fix x. Unfold each side with the definitions of union and intersection, and use the opposite of a quantified statement.'
            solution_sketch: 'Use Definition 2.61 for the unions and intersections. For (a), x is in the left side exactly when x is in X and no C_i holds x. That means every i has x in X and x not in C_i, which is membership in the right side. For (c), x is in the left side exactly when x is in X and some C_i misses x. That is membership in the union of the sets X minus C_i. Laws (b) and (d) follow in the same way with C in the family.'
          # source: FoM exercise 2.5-2-48
          - problem: 'Prove that no model of the axioms of set theory that include the Axiom of Powers is finite.'
            answer_contract: {"kind":"written"}
            answer: 'Repeat the power set step from the empty set. By Theorem 2.60 each new set has more elements than the one before, so the sets never stop.'
            solution_sketch: 'Start with S_0 as the empty set and let S_(n+1) be P(S_n); each exists by Axiom 2.40. By Theorem 2.60, S_n is not equivalent to P(S_n). Also S_n embeds in P(S_n) by sending x to the set with only x. So the sizes grow strictly with n. A finite model holds only finitely many sets, which is a contradiction.'
          # source: FoM exercise 2.5-2-49
          - problem: 'Prove that no model of the axioms of set theory that include the Axiom of Powers has a surrounding universe that is a set. Use the proof of Theorem 2.60.'
            answer_contract: {"kind":"written"}
            answer: 'If a set U holds all sets, every subset of U lies in U, so the map x to x sends U onto P(U). The diagonal set of Theorem 2.60 then gives a contradiction.'
            solution_sketch: 'Assume the universe U is a set. By Axiom 2.40, P(U) is a set of the model, so it lies in U. Every subset of U is a set of the model, so it is an element of U. The map from U to P(U) that sends x to x is then surjective. Theorem 2.60 shows no surjection from U onto P(U) exists, so U is no set.'
        constraints: 'Compare the sizes of sets, build the diagonal set, and compute unions and intersections of a family.'
    diagnostic_exemplar:
      problem: 'Let $S=\{a,b,c,d\}$. Give the number of elements of $P(S)$.'
      answer_contract: {"kind":"exact"}
      answer: '16'
      solution_sketch: 'The set $S$ has 4 elements. A subset keeps or drops each element. So $P(S)$ has $2^4=16$ elements.'
