          # argument: Theorem 2.64
          - problem: 'Prove the first step: the set $\mathbb{N}$, the intersection of all successor sets, contains $1$ and holds the successor of each of its elements. Here a successor set contains $1$, does not contain $\emptyset$, and holds the successor of each of its elements.'
            answer_contract: {"kind":"written"}
            answer: 'Every successor set holds 1 and is closed under successor. An element of the intersection lies in every successor set, so its successor does too.'
            solution_sketch: 'Let $I$ be the set from Axiom 2.63. Use the Axiom of Specification (see Proposition 2.18) to form the set of all successor sets inside the power set of $I$, and let $\mathbb{N}$ be its intersection. Every successor set contains $1$, so $1\in\mathbb{N}$. Let $n\in\mathbb{N}$. Then $n$ is in every successor set, so $n''$ is in every successor set. Hence $n''\in\mathbb{N}$.'
          # argument: Theorem 2.64
          - problem: 'Prove the second step: no natural number has the successor $1$. Here $1=\{\emptyset\}$ and $n''=n\cup\{n\}$.'
            answer_contract: {"kind":"written"}
            answer: 'The equation forces x to be the empty set. The empty set lies in no successor set, so it is not a natural number.'
            solution_sketch: 'Assume $1=x''$ for some $x\in\mathbb{N}$. Then $\{\emptyset\}=x\cup\{x\}$. This forces $x=\emptyset$. By the construction, $\emptyset$ lies in no successor set. So $\emptyset\notin\mathbb{N}$, which contradicts $x\in\mathbb{N}$. Compare Theorem 2.25 for equality of sets.'
          # argument: Theorem 2.64
          - problem: 'Prove the third step. Let $S\subseteq\mathbb{N}$ be a set with $1\in S$ and with $n''\in S$ for each $n\in S$. Then $S=\mathbb{N}$.'
            answer_contract: {"kind":"written"}
            answer: 'S is a successor set, so the natural numbers lie inside S. Also S lies inside the natural numbers, so the sets are equal.'
            solution_sketch: 'The set $S$ is a successor set, because $S\subseteq\mathbb{N}$ and $\emptyset\notin\mathbb{N}$. Since $\mathbb{N}$ is the intersection of all successor sets, $\mathbb{N}\subseteq S$ (see Proposition 2.18). By assumption $S\subseteq\mathbb{N}$. Mutual containment gives $S=\mathbb{N}$ by Theorem 2.25.'
          # argument: Theorem 2.64
          - problem: 'Prove the fourth step: for all $m,n\in\mathbb{N}$ with $m''=n''$ we have $m=n$.'
            answer_contract: {"kind":"written"}
            answer: 'Show by induction that each element of a natural number is a subset of it. Then m differing from n gives a contradiction.'
            solution_sketch: 'First apply induction (step three) to $S=\{n\in\mathbb{N}:\text{each element of }n\text{ is a subset of }n\}$. Then $1\in S$. If $n\in S$ and $m\in n''=n\cup\{n\}$, then $m=n\subseteq n''$ or $m\in n$, so $m\subseteq n\subseteq n''$. Now let $m''=n''$ and $m\ne n$. Then $n\in m$ and $m\in n$, so $n\subseteq m$ and $m\subseteq n$. Theorem 2.25 gives $m=n$, a contradiction.'
          # source: FoM exercise 2.6-2-50
          - problem: 'Part (a): let $m,n\in\mathbb{N}$ with $n\subseteq m$. Prove $m\notin n$. Part (b): prove $n\notin n$ for each $n\in\mathbb{N}$.'
            answer_contract: {"kind":"written"}
            answer: 'Induct on the form that no superset of n is an element of n, then take m equal to n for (b).'
            solution_sketch: 'Let $S=\{n\in\mathbb{N}:\text{no superset }m\text{ of }n\text{ is an element of }n\}$. For $n=1=\{\emptyset\}$, an element of $1$ is $\emptyset$, which is not in $\mathbb{N}$. Let $n\in S$ and let $m\supseteq n''$. If $m\in n''$, then $m\in n$ or $m=n$. The first case contradicts $n\in S$, since $m\supseteq n$. The second case gives $n\in n$ and $n\supseteq n$, which also contradicts $n\in S$; taking $m=n$ gives (b).'
          # source: FoM exercise 2.6-2-51
          - problem: 'Prove that the map $f:\mathbb{N}\to\mathbb{N}$ with $f(n)=n''$ is injective and is not surjective.'
            answer_contract: {"kind":"written"}
            answer: 'Property 5 of Theorem 2.64 gives injectivity. Property 3 gives that 1 has no preimage.'
            solution_sketch: 'If $f(m)=f(n)$, then $m''=n''$. By property 5 of Theorem 2.64, $m=n$, so $f$ is injective. By property 3, no $n$ has $n''=1$. So $1$ is not in the image of $f$, and $f$ is not surjective.'
          # source: FoM exercise 2.6-2-52
          - problem: 'Prove that $n\neq n''$ for every natural number $n$.'
            answer_contract: {"kind":"written"}
            answer: 'Induct on the set of n that differ from their successor. Property 3 gives the base case and property 5 gives the step.'
            solution_sketch: 'Let $S=\{n\in\mathbb{N}:n\ne n''\}$. By property 3 of Theorem 2.64, $1$ is not a successor, so $1\ne 1''$ and $1\in S$. Let $n\in S$. If $n''=(n'')''$, then property 5 gives $n=n''$, which contradicts $n\in S$. So $n''\in S$, and the Principle of Induction gives $S=\mathbb{N}$.'
          # source: FoM exercise 2.6-2-53
          - problem: 'Let $m\in\mathbb{N}$. Prove that $m=1$ or $m=n''$ for some $n\in\mathbb{N}$.'
            answer_contract: {"kind":"written"}
            answer: 'Induct on the set of m that equal 1 or are a successor. The number 1 is in it, and each successor is in it.'
            solution_sketch: 'Let $S$ be the set of all $m\in\mathbb{N}$ with $m=1$ or $m=n''$ for some $n\in\mathbb{N}$. Then $1\in S$. Let $m\in S$. The element $m''$ is the successor of $m$, and $m\in\mathbb{N}$, so $m''\in S$. By the Principle of Induction in Theorem 2.64, $S=\mathbb{N}$.'
