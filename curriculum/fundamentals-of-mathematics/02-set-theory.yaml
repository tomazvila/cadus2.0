          - problem: 'Let $A=\{1,2,3,4\}$, $B=\{3,4,5\}$ and $C=\{4\}$. (a) Give the number of elements of $(A\cap B)\setminus C$. (b) Give the number of elements of $(A\setminus C)\cap(B\setminus C)$. (c) Give the sum of the elements of $(A\setminus C)\cap(B\setminus C)$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 1; c = 3'
