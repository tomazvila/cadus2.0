      - id: kp3
        name: 'Example 2.38 and Definition 2.39: Boolean algebra for sets and the symmetric difference'
        key_prerequisites: [fom-2-3-axiom-extension]
        exemplars:
          - problem: 'The symmetric difference of $A$ and $B$ is $A\triangle B=(A\setminus B)\cup(B\setminus A)$. Let $A=\{1,2,3,4\}$ and $B=\{3,4,5,6\}$. (a) Give the number of elements of $A\triangle B$. (b) Give the sum of the elements of $A\triangle B$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}}]}
            answer: 'a = 4; b = 14'
            solution_sketch: 'The set $A\setminus B$ is {1,2} and $B\setminus A$ is {5,6}. Their union is {1,2,5,6}. It has 4 elements and the sum $1+2+5+6=14$.'
          - problem: 'Let $A=\{2,4,6,8\}$ and $B=\{4,8,12\}$. (a) Give the number of elements of $A\setminus B$. (b) Give the number of elements of $B\setminus A$. (c) Give the number of elements of $A\triangle B$. (d) Give the sum of the elements of $A\triangle B$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}}]}
            answer: 'a = 2; b = 1; c = 3; d = 20'
            solution_sketch: 'The set $A\setminus B$ is {2,6}, which is 2 elements. The set $B\setminus A$ is {12}, which is 1 element. Their union $A\triangle B$ is {2,6,12}, which is 3 elements with sum 20.'
          - problem: 'Let $A=\{1,2\}$ and $B=\{2,3,4\}$. (a) Give the sum of the elements of $A\triangle B$. (b) Give the sum of the elements of $B\triangle A$. (c) Give 1 if $A\triangle B=B\triangle A$ and 0 if not.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 8; b = 8; c = 1'
            solution_sketch: 'The set $A\triangle B$ is {1}$\cup${3,4}={1,3,4}, with sum 8. The set $B\triangle A$ joins the same two differences in the other order. It is {1,3,4} too, with sum 8. The sets are equal, so (c) is 1.'
          - problem: 'Let $A=\{1,2,3\}$. (a) Give the number of elements of $A\triangle A$. (b) Give the number of elements of $A\triangle\emptyset$. (c) Give 1 if $A\triangle\emptyset=A$ and 0 if not.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 0; b = 3; c = 1'
            solution_sketch: 'Here $A\setminus A$ is empty, so $A\triangle A$ is empty, with 0 elements. The set $A\setminus\emptyset$ is $A$ and $\emptyset\setminus A$ is empty. So $A\triangle\emptyset=A$, with 3 elements, and (c) is 1.'
          - problem: 'Let $A=\{1,2,3,5\}$ and $B=\{2,5,7\}$. (a) Give the sum of the elements of $(A\cup B)\setminus(A\cap B)$. (b) Give the sum of the elements of $A\triangle B$. (c) Give 1 if the two sets are equal and 0 if not.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 11; b = 11; c = 1'
            solution_sketch: 'The union is {1,2,3,5,7} and the intersection is {2,5}. Their difference is {1,3,7}, with sum 11. Also $A\setminus B=\{1,3\}$ and $B\setminus A=\{7\}$, so $A\triangle B=\{1,3,7\}$ with sum 11. The sets are equal, so (c) is 1.'
          - problem: 'Let $A=\{1,2\}$, $B=\{2,3\}$ and $C=\{3,4\}$. (a) Give the sum of the elements of $(A\triangle B)\triangle C$. (b) Give the sum of the elements of $A\triangle(B\triangle C)$. (c) Give 1 if the two sets are equal and 0 if not.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 5; b = 5; c = 1'
            solution_sketch: 'The set $A\triangle B$ is {1,3}. Then $(A\triangle B)\triangle C$ is {1,4}, with sum 5. The set $B\triangle C$ is {2,4}. Then $A\triangle(B\triangle C)$ is {1,4}, with sum 5. The sets are equal, so (c) is 1.'
          - problem: 'Let $A=\{1\}$, $B=\{2\}$ and $C=\{3\}$. (a) Give the number of elements of $(A\cup B)\cup(A\cup C)$. (b) Give the number of elements of $(A\cup B)\cup C$. (c) Give 1 if the two sets are equal and 0 if not.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 3; b = 3; c = 1'
            solution_sketch: 'The set $A\cup B$ is {1,2} and $A\cup C$ is {1,3}. Their union is {1,2,3}, which is 3 elements. The set $(A\cup B)\cup C$ is {1,2,3}, which is 3 elements. The sets are equal, so (c) is 1.'
          - problem: 'Let $A=\{1,2,3,4\}$, $B=\{3,4,5\}$ and $C=\{4,5,6\}$. (a) Give the sum of the elements of $A\cap(B\triangle C)$. (b) Give the sum of the elements of $(A\cap B)\triangle(A\cap C)$. (c) Give 1 if the two sets are equal and 0 if not.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 3; b = 3; c = 1'
            solution_sketch: 'The set $B\triangle C$ is {3,6}. So $A\cap(B\triangle C)$ is {3}, with sum 3. The set $A\cap B$ is {3,4} and $A\cap C$ is {4}. Their symmetric difference is {3}, with sum 3. The sets are equal, so (c) is 1.'
          - problem: 'Let $A$ have 10 elements and $B$ have 7 elements. Let $A\cap B$ have 4 elements. (a) Give the number of elements of $A\cup B$. (b) Give the number of elements of $A\setminus B$. (c) Give the number of elements of $A\triangle B$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 13; b = 6; c = 9'
            solution_sketch: 'The union has $10+7-4=13$ elements. The set $A\setminus B$ has $10-4=6$ elements. The set $B\setminus A$ has $7-4=3$ elements. The two differences do not overlap, so $A\triangle B$ has $6+3=9$ elements.'
          # source: FoM exercise 2.4-2-31
          - problem: 'Let $A$, $B$ and $C$ be sets. For each equation, list the membership patterns of an element $x$ (in or out of $A$, $B$ and $C$) that put $x$ in the left side. Do the same for the right side. Show that the two lists agree. (a) $(A\cap B)\cap(A\cap C)=(A\cap B)\cap C$. (b) $A\triangle B=(A\cup B)\setminus(A\cap B)$. (c) $A\triangle(B\triangle C)=(A\triangle B)\triangle C$. (d) $A\cap(B\triangle C)=(A\cap B)\triangle(A\cap C)$.'
            answer_contract: {"kind":"written"}
            answer: 'Compare the patterns of membership in A, B and C. Both sides of each part give the same list, so the sets are equal.'
            solution_sketch: 'Use Theorem 2.25: both sides hold the same elements when they hold the same membership patterns. For (a), both sides need x in A, B and C. For (b), both sides need x in exactly one of A and B. For (c) and (d), write the patterns of each side and compare them. The lists agree for each part.'
          # source: FoM exercise 2.4-2-32
          - problem: 'Let $A$, $B$ and $C$ be sets. Prove each equation by taking an element of one side and showing it is in the other side, and back. (a) $(A\cap B)\cap(A\cap C)=(A\cap B)\cap C$. (b) $A\triangle B=(A\cup B)\setminus(A\cap B)$. (c) $A\triangle B=B\triangle A$. (d) $A\triangle(B\triangle C)=(A\triangle B)\triangle C$. (e) $A\cap(B\triangle C)=(A\cap B)\triangle(A\cap C)$.'
            answer_contract: {"kind":"written"}
            answer: 'For each part take an arbitrary x of one side, trace it through the definitions to the other side, and then do the reverse. Case splits handle the differences.'
            solution_sketch: 'Use Theorem 2.25 for each part. For (a), x in both sides means x is in A, B and C. For (b), x is in exactly one of A and B, which is x in the union and not in the intersection. For (c), the definition of the symmetric difference is symmetric in A and B. For (d) and (e), sort x by membership in A, B and C and check each case.'
          # source: FoM exercise 2.4-2-33
          - problem: 'Let $A$, $B$ and $C$ be sets. Prove each equation with the laws of Boolean algebra for sets, not with elements. (a) $(A\cap B)\cap(A\cap C)=(A\cap B)\cap C$. (b) $A\triangle B=(A\cup B)\setminus(A\cap B)$. (c) $A\triangle B=B\triangle A$. (d) $A\triangle(B\triangle C)=(A\triangle B)\triangle C$. (e) $A\cap(B\triangle C)=(A\cap B)\triangle(A\cap C)$.'
            answer_contract: {"kind":"written"}
            answer: 'Rewrite step by step with the commutative, associative and distributive laws. Cite the law at each step.'
            solution_sketch: 'Rewrite each left side with the laws. Use Theorem 2.27 and Theorem 2.33 to swap the order. Use Theorem 2.28 and Theorem 2.34 to regroup. Use Theorem 2.35, Theorem 2.36 and Theorem 2.37 to distribute and to remove differences. For (a), regroup to get A intersect A, then use A intersect A equals A. Cite the law at each step.'
          # source: FoM exercise 2.4-2-28
          - problem: 'Let $A$, $B$ and $U$ be sets with $A\subseteq U$ and $B\subseteq U$. Show that $A=\emptyset$ exactly when $((U\setminus A)\cap B)\cup(A\cap(U\setminus B))=B$.'
            answer_contract: {"kind":"written"}
            answer: 'If A is empty, the left side is B. For the reverse, an element of A either lies in B or lies outside B, and each case contradicts the equation.'
            solution_sketch: 'Assume $A=\emptyset$. Then $U\setminus A=U$ and $A\cap(U\setminus B)=\emptyset$, so the left side is $U\cap B=B$. Now assume the equation and let x be in $A$. If x is in $B$, x is in the left side only through $(U\setminus A)\cap B$, which fails because x is in $A$. If x is not in $B$, x is in $A\cap(U\setminus B)$, so x is in the left side, which is $B$. Both cases fail, so $A$ is empty.'
