          - problem: 'Let $A=\{1,2,3\}$, $B=\{1\}$ and $C=\{2\}$. (a) Give the number of elements of $A\setminus(B\cup C)$. (b) Give the number of elements of $(A\setminus B)\cup(A\setminus C)$. (c) Give 1 if the two sets are equal and 0 if not.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 3; c = 0'
            solution_sketch: 'The union $B\cup C$ is {1,2}, so $A\setminus(B\cup C)=\{3\}$, which is 1 element. The sets $A\setminus B=\{2,3\}$ and $A\setminus C=\{1,3\}$ join to {1,2,3}, which is 3 elements. The sets differ, so (c) is 0. A union is not the right form here. See Theorem 2.36.'
          # source: FoM exercise 2.4-2-30
          - problem: 'In each part, let $L$ be the left set and $R$ the right set. Give the number of elements of $L$ minus the number of elements of $R$. (a) $A=\{1\}$, $B=\{2\}$, $L=A\cup B$ and $R=\emptyset$. (b) $A=\{1,2,3\}$, $B=\{1\}$, $C=\{2\}$, $L=A\setminus(B\cup C)$ and $R=(A\setminus B)\cup(A\setminus C)$. (c) $A=\{1,2\}$, $B=\{1\}$, $C=\{2\}$, $L=A\setminus(B\cap C)$ and $R=(A\setminus B)\cap(A\setminus C)$. (d) $A=\{1\}$, $B=\{2\}$, $C=\emptyset$, $L=(A\cup B)\setminus C$ and $R=(A\setminus C)\cap(B\setminus C)$. (e) Use the sets of part d with $L=(A\cap B)\setminus C$ and $R=(A\setminus C)\cup(B\setminus C)$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}},{"name":"e","contract":{"kind":"exact"}}]}
            answer: 'a=2;b=-2;c=2;d=2;e=-2'
            solution_sketch: 'In (a) the left side is {1,2} and the right side is empty, so the difference is 2. In (b) the left side is {3} and the right side is {1,2,3}, so the difference is 1-3=-2. In (c) the left side is {1,2} and the right side is empty, so the difference is 2. In (d) the left side is {1,2} and the right side is empty, so the difference is 2. In (e) the left side is empty and the right side is {1,2}, so the difference is -2.'
          # argument: Theorem 2.35
          - problem: 'Prove part 1: for sets $A$, $B$ and $C$, show that $A\cap(B\cup C)=(A\cap B)\cup(A\cap C)$.'
            answer_contract: {"kind":"written"}
            answer: 'Turn each membership into a logical statement about x. Then apply the distributive law of and over or.'
            solution_sketch: 'Write x in the left side as: x in A and (x in B or x in C). This uses Axiom 2.31 and the definition of intersection. Apply the distributive law of Theorem 1.24: this becomes (x in A and x in B) or (x in A and x in C). That is x in $(A\cap B)\cup(A\cap C)$. Each step is an equivalence, so the sets have the same elements.'
          # argument: Theorem 2.36
          - problem: 'Prove part 1: for sets $A$, $B$ and $C$, show that $A\setminus(B\cup C)=(A\setminus B)\cap(A\setminus C)$.'
            answer_contract: {"kind":"written"}
            answer: 'Turn each membership into a logical statement about x. Then the not of an or becomes an and of two nots.'
            solution_sketch: 'Write x in the left side as: x in A and not (x in B or x in C). Apply the negation rule for or from Theorem 1.24: this is x in A and x not in B and x not in C. Repeat the x in A, as in the proof of Theorem 2.35, and group the terms. This is x in $(A\setminus B)\cap(A\setminus C)$. Theorem 3.59 later allows the omitted parentheses.'
          # argument: Theorem 2.37
          - problem: 'Prove: for sets $A$, $B$ and $C$, the equations $(A\cup B)\setminus C=(A\setminus C)\cup(B\setminus C)$ and $(A\cap B)\setminus C=(A\setminus C)\cap(B\setminus C)$ hold.'
            answer_contract: {"kind":"written"}
            answer: 'Rewrite each membership as a statement about x. Apply the distributive laws of and over or.'
            solution_sketch: 'For the first equation, x in the left side means (x in A or x in B) and x not in C. By Theorem 2.35 and the distributive law, this is (x in A and not in C) or (x in B and not in C). For the second equation, x in A and x in B and x not in C. Repeat the not-in-C part. That gives the right side.'
          # source: FoM exercise 2.4-2-19
          - problem: 'Prove the second equation of the distributive laws: for sets $A$, $B$ and $C$, show that $A\cup(B\cap C)=(A\cup B)\cap(A\cup C)$.'
            answer_contract: {"kind":"written"}
            answer: 'Turn each membership into a logical statement about x. Then apply the distributive law of or over and.'
            solution_sketch: 'Write x in the left side as: x in A or (x in B and x in C). Apply the distributive law of Theorem 1.24: this is (x in A or x in B) and (x in A or x in C). That is x in $(A\cup B)\cap(A\cup C)$. The proof of Theorem 2.35 uses the same method, and each step is an equivalence.'
          # source: FoM exercise 2.4-2-20
          - problem: 'Prove the second equation of DeMorgan''s laws: for sets $A$, $B$ and $C$, show that $A\setminus(B\cap C)=(A\setminus B)\cup(A\setminus C)$.'
            answer_contract: {"kind":"written"}
            answer: 'Turn each membership into a logical statement about x. The not of an and becomes an or of two nots.'
            solution_sketch: 'Write x in the left side as: x in A and not (x in B and x in C). Apply the negation rule for and from Theorem 1.24: this is x in A and (x not in B or x not in C). Distribute, as in Theorem 2.36. This is x in $(A\setminus B)\cup(A\setminus C)$.'
          # source: FoM exercise 2.4-2-21
          - problem: 'Let $A$, $B$ and $C$ be sets. (a) Prove the first equation $(A\cup B)\setminus C=(A\setminus C)\cup(B\setminus C)$. (b) Prove the second equation $(A\cap B)\setminus C=(A\setminus C)\cap(B\setminus C)$.'
            answer_contract: {"kind":"written"}
            answer: 'Rewrite each membership as a statement about x. Use the distributive law for part a and a repeated condition for part b.'
            solution_sketch: 'Use the method of Theorem 2.35 for each equation. Theorem 2.37 is the statement to prove. For (a), x in A or B and not in C is the same as x in A and not in C, or x in B and not in C. For (b), x in A and in B and not in C is the same as x in A and not in C and x in B and not in C.'
          # source: FoM exercise 2.4-2-24
          - problem: 'Prove these four equations with two containments each. Let $A$, $B$ and $C$ be sets. (a) $A\cap(B\cup C)=(A\cap B)\cup(A\cap C)$. (b) $A\cup(B\cap C)=(A\cup B)\cap(A\cup C)$. (c) $A\setminus(B\cup C)=(A\setminus B)\cap(A\setminus C)$. (d) $A\setminus(B\cap C)=(A\setminus B)\cup(A\setminus C)$.'
            answer_contract: {"kind":"written"}
            answer: 'For each equation take an arbitrary element of one side, show it is in the other side, and then do the reverse. Case splits handle the unions.'
            solution_sketch: 'Use Theorem 2.25 for each equation. For (a), take x in $A\cap(B\cup C)$. Then x is in A, and in B or in C, so x is in $A\cap B$ or in $A\cap C$. Reverse the steps for the other containment. Treat (b), (c) and (d) the same way, with the facts of Theorem 2.35 and Theorem 2.36 as a guide.'
          # source: FoM exercise 2.4-2-29
          - problem: 'Let $A$, $B$, $C$ be sets with $B\subseteq A$ and $C\subseteq A$. Show that $B\cup C\subseteq A$.'
            answer_contract: {"kind":"written"}
            answer: 'Take x in the union. Then x is in B or in C, and both sets lie inside A, so x is in A.'
            solution_sketch: 'Let x be in $B\cup C$. By Axiom 2.31, x is in $B$ or x is in $C$. If x is in $B$, then x is in $A$ because $B\subseteq A$. If x is in $C$, then x is in $A$ because $C\subseteq A$. In both cases x is in $A$.'
