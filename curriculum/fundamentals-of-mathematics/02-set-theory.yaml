    knowledge_points:
      - id: kp1
        name: 'Axiom 2.1, Axiom 2.2, Definition 2.3 and Definition 2.4: membership and containment'
        key_prerequisites: [set-notation, subset-relation-basics]
        exemplars:
          - problem: 'Let $S=\{2,4,6,8\}$. Give each truth value as 1 for true and 0 for false. (a) $4\in S$. (b) $5\in S$. (c) $8\notin S$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 0; c = 0'
            solution_sketch: 'The set $S$ lists 4, so (a) has the value 1. The set $S$ does not list 5, so (b) has the value 0. The set $S$ lists 8, so $8\notin S$ is wrong and (c) has the value 0.'
          - problem: 'Let $A=\{5,7\}$. Give each truth value as 1 for true and 0 for false. (a) $A\subseteq A$. (b) $A\nsubseteq A$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 0'
            solution_sketch: 'Each element of $A$ is an element of $A$, so (a) has the value 1. The symbol $\nsubseteq$ is the opposite of $\subseteq$, so (b) has the value 0.'
          - problem: 'Let $A=\{1,2,3\}$ and $B=\{1,2,3,4,5\}$. Give each truth value as 1 for true and 0 for false. (a) $A\subseteq B$. (b) $B\subseteq A$. (c) $B\supseteq A$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 0; c = 1'
            solution_sketch: 'Every element of $A$ lies in $B$, so (a) has the value 1. The element 4 of $B$ is not in $A$, so (b) has the value 0. The symbol $B\supseteq A$ means the same as $A\subseteq B$, so (c) has the value 1.'
          - problem: 'Let $A=\{1,2\}$ and $B=\{1,2,3\}$. Give each truth value as 1 for true and 0 for false. (a) $A\nsubseteq B$. (b) $B\nsupseteq A$. (c) $B\nsubseteq A$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 0; b = 0; c = 1'
            solution_sketch: 'We have $A\subseteq B$, so the strike-through form $A\nsubseteq B$ is wrong and (a) is 0. Also $B\supseteq A$ holds, so $B\nsupseteq A$ is wrong and (b) is 0. The element 3 of $B$ is not in $A$, so $B\nsubseteq A$ is right and (c) is 1.'
          - problem: 'Let $A=\{1,2,3,4,5,6\}$ and $B=\{2,4,6,8,10\}$. (a) Count the elements of $A$ that lie in $B$. (b) Count the elements of $B$ that do not lie in $A$. (c) Give 1 if $A\subseteq B$ and 0 if not.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 3; b = 2; c = 0'
            solution_sketch: 'The elements 2, 4 and 6 of $A$ lie in $B$, so (a) is 3. The elements 8 and 10 of $B$ are not in $A$, so (b) is 2. The element 1 of $A$ is not in $B$, so $A\nsubseteq B$ and (c) is 0.'
          - problem: 'Let $S$ be the set of all integers from 1 to 20 that are divisible by 3. (a) Count the elements of $S$. (b) Give 1 if $12\in S$ and 0 if not. (c) Give 1 if $20\in S$ and 0 if not.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 6; b = 1; c = 0'
            solution_sketch: 'The elements of $S$ are 3, 6, 9, 12, 15 and 18, so (a) is 6. The number 12 is in this list, so (b) is 1. The number 20 is not divisible by 3, so (c) is 0.'
          - problem: 'Count the subsets of $\{a,b,c\}$. The set with no element and the set $\{a,b,c\}$ itself both count. (a) Count all subsets. (b) Count the subsets that hold the element $a$. (c) Count the subsets with exactly 2 elements.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 8; b = 4; c = 3'
            solution_sketch: 'Each of the elements a, b and c is in a subset or not, so there are $2\cdot2\cdot2=8$ subsets. Four of them hold a, because b and c give 4 free choices. The 2-element subsets are $\{a,b\}$, $\{a,c\}$ and $\{b,c\}$, so (c) is 3.'
          # source: FoM exercise 2.1-2-2
          - problem: 'In a model of Axioms 2.1 and 2.2 the objects are the points of the plane. The sets are the straight lines of the plane. A point belongs to a line when the point lies on the line. Give each truth value as 1 for true and 0 for false. (a) The model has a set. (b) For a point $P$ and a line $L$, exactly one of the statements "$P$ lies on $L$" and "$P$ does not lie on $L$" is true. (c) Two different lines exist that share a point. (d) Two lines that share exactly one point have common points that form a line.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 1; c = 1; d = 0'
            solution_sketch: 'The plane holds lines, so Axiom 2.1 holds and (a) is 1. A point lies on a line or not, and never both, so (b) is 1. The x-axis and the y-axis share the origin, so (c) is 1. One common point is a single point and not a line, so (d) is 0.'
          # source: FoM exercise 2.1-2-1
          - problem: 'Prove: every set $A$ is contained in itself, that is $A\subseteq A$.'
            answer_contract: {"kind":"written"}
            answer: 'Take any element x of A. Then x is in A already, so A is contained in A.'
            solution_sketch: 'Use Definition 2.4. A set $A$ is contained in a set $B$ when every element of $A$ is an element of $B$. Take $B=A$ and an element $x$ of $A$. The element $x$ is an element of $A$ at once. So every element of $A$ is an element of $A$, and $A\subseteq A$ holds.'
        constraints: 'Decide membership and containment for small sets; count elements; the items vary the sets and keep the values 1 and 0.'
      - id: kp2
        name: 'Definition 2.7 and Examples 2.8, 2.10 and 2.11: models of the axioms'
        key_prerequisites: [set-notation]
        exemplars:
          - problem: 'A model has the numbers 1 to 6 as its objects. It has one set $S=\{1,2,3,4\}$. (a) Count the objects that lie in $S$. (b) Count the objects that do not lie in $S$. (c) Give 1 if the model has a set and 0 if not.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 4; b = 2; c = 1'
            solution_sketch: 'The set $S$ holds 1, 2, 3 and 4, so (a) is 4. The objects 5 and 6 are outside $S$, so (b) is 2. The model has the set $S$, so (c) is 1.'
          - problem: 'A model has the numbers 1 to 4 as its objects. It has two sets, $S=\{1,2\}$ and $T=\{2,3\}$. (a) Count the objects that lie in both sets. (b) Count the objects that lie in at least one set. (c) Count the objects that lie in no set.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 3; c = 1'
            solution_sketch: 'Only 2 is in both $S$ and $T$, so (a) is 1. The objects 1, 2 and 3 lie in $S$ or $T$, so (b) is 3. The object 4 lies in neither set, so (c) is 1.'
          - problem: 'Look at three models. In model 1 the objects are the numbers 1 to 5 and there is no set. In model 2 the objects are the numbers 1 to 5 and there is one set $\{1,3,5\}$. In model 3 the objects are the integers and there is one set, the set of even integers. Give 1 if Axiom 2.1 (there is a set) is true in the model and 0 if not. (a) Model 1. (b) Model 2. (c) Model 3.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 0; b = 1; c = 1'
            solution_sketch: 'Axiom 2.1 needs one set. Model 1 has no set, so (a) is 0. Model 2 has the set $\{1,3,5\}$, so (b) is 1. Model 3 has the set of even integers, so (c) is 1.'
          - problem: 'A model has the letters a to e as its objects. Its sets are all the subsets of $\{a,b,c\}$ that have exactly 2 elements. (a) Count the sets of the model. (b) Count the sets that hold the object a. (c) Count the objects that lie in no set.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 3; b = 2; c = 2'
            solution_sketch: 'The sets are $\{a,b\}$, $\{a,c\}$ and $\{b,c\}$, so (a) is 3. Two of them hold a, so (b) is 2. The objects d and e lie in no set, so (c) is 2.'
          - problem: 'A model has the objects 1 to 6. Its sets are $S=\{1,2,3,4,5,6\}$, $V=\{1,3\}$ and $C=\{2\}$. (a) Count the elements of $S$ that are not in $V$. (b) Give 1 if $V\subseteq S$ and 0 if not. (c) Give 1 if $C\subseteq V$ and 0 if not.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 4; b = 1; c = 0'
            solution_sketch: 'Remove 1 and 3 from the six elements of $S$. Four elements stay, so (a) is 4. Both elements of $V$ lie in $S$, so (b) is 1. The element 2 of $C$ is not in $V$, so (c) is 0.'
          - problem: 'A model has the numbers 1 to 8 as its objects. Its sets are $S=\{1,\dots,8\}$, $E=\{2,4,6,8\}$, $O=\{1,3,5,7\}$ and $A=\{1,2,3\}$. (a) Count the sets that hold the object 3. (b) Count the sets $T$ of the model with $T\subseteq S$. (c) Count the sets $T$ of the model with $T\subseteq O$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 3; b = 4; c = 1'
            solution_sketch: 'The object 3 lies in $S$, $O$ and $A$, so (a) is 3. Every set of the model lies in $S$, so (b) is 4. Only $O$ lies in $O$, because 2 is in $A$ and 2 is not in $O$, so (c) is 1.'
          - problem: 'A model has the numbers 1 to 12 as its objects. Its sets are the multiples of 2, the multiples of 3 and the multiples of 4 among these numbers. (a) Count the sets that hold the object 12. (b) Count the objects that lie in at least one set. (c) Count the ordered pairs of different sets $(X,Y)$ with $X\subseteq Y$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 3; b = 8; c = 1'
            solution_sketch: 'The number 12 is divisible by 2, 3 and 4, so (a) is 3. The objects 2, 3, 4, 6, 8, 9, 10 and 12 lie in a set, so (b) is 8. Only the multiples of 4 lie in the multiples of 2, so (c) is 1.'
          # source: FoM exercise 2.1-2-3
          - problem: 'Count the regions of Venn diagrams. A region is a group of objects that lie in exactly the same sets, and it lies in at least one set. A diagram has all regions filled when each possible region holds an object. (a) Count the regions of a diagram with 3 sets and all regions filled. (b) Count the regions of a diagram with 4 sets and all regions filled. A model has the objects 1 to 10 and the sets $\{1,\dots,5\}$, the even numbers, the odd numbers and the primes among them. (c) Count the regions that hold an object. (d) Count the objects that lie in exactly two of the four sets.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}}]}
            answer: 'a = 7; b = 15; c = 7; d = 3'
            solution_sketch: 'Each object lies in or out of each set. For 3 sets that gives $2^3-1=7$ regions, and for 4 sets it gives $2^4-1=15$. In the model, the objects 3 and 5 share a region, and the objects 6, 8 and 10 share a region. That leaves 7 regions in all. The objects 1, 4 and 7 lie in exactly two sets, so (d) is 3.'
        constraints: 'Read a small model with objects and sets; count objects, sets and regions; decide if Axiom 2.1 holds.'
    diagnostic_exemplar:
      problem: 'Let $S=\{7,8,9\}$. Give each truth value as 1 for true and 0 for false. (a) $8\in S$. (b) $10\in S$.'
      answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}}]}
      answer: 'a = 1; b = 0'
      solution_sketch: 'The set $S$ lists 8, so (a) is 1. The set $S$ does not list 10, so (b) is 0.'
