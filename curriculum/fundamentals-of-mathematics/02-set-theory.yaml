          - problem: 'Let $A$ hold the integers from 1 to 10. Let $B$ hold the even integers of $A$ and let $C$ hold the integers of $A$ that 3 divides. (a) Give the number of elements of $A\setminus(B\cup C)$. (b) Give the number of elements of $(A\setminus B)\cap(A\setminus C)$. (c) Give the sum of the elements of $A\setminus(B\cup C)$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 3; b = 3; c = 13'
