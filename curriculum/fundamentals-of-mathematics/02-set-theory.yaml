      - id: kp1
        name: 'Axiom 2.24 and Theorem 2.25: equal sets and mutual containment'
        key_prerequisites: [subset-relation-basics]
        exemplars:
          - problem: 'Let $A=\{2,4,6\}$, $B=\{2,4,6\}$ and $C=\{2,4,6,8\}$. Give 1 if the two sets are equal and 0 if they are not. (a) $A$ and $B$. (b) $A$ and $C$. (c) $B$ and $C$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 0; c = 0'
            solution_sketch: 'Two sets are equal when they have the same elements. The sets $A$ and $B$ have the same elements 2, 4 and 6, so (a) is 1. The set $C$ has the extra element 8, so (b) and (c) are 0.'
          - problem: 'Let $A=\{1,2,3\}$ and $B=\{1,2,3,4\}$. Give 1 for a true relation and 0 for a false relation. (a) $A\subseteq B$. (b) $B\subseteq A$. (c) $A=B$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 0; c = 0'
            solution_sketch: 'Every element of $A$ is in $B$, so (a) is 1. The element 4 is in $B$ and not in $A$, so (b) is 0. Two sets are equal only if both containments hold. So (c) is 0.'
          - problem: 'Let $A=\{1,1,2,3,3\}$ and $B=\{3,2,1\}$. (a) Give the number of elements of $A$. (b) Give the number of elements of $B$. (c) Give 1 if $A=B$ and 0 if not.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 3; b = 3; c = 1'
            solution_sketch: 'A repeated entry gives one element. So $A$ has the elements 1, 2 and 3, which is 3 elements. The set $B$ has the same 3 elements. Both sets have the same elements, so (c) is 1.'
          - problem: 'Let $A$ hold the positive integers $k$ with $k^2<10$. Let $B$ hold the integers $k$ with $1\le k\le 4$ and $k\ne 4$. Give 1 for a true relation and 0 for a false relation. (a) $A\subseteq B$. (b) $B\subseteq A$. (c) $A=B$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 1; c = 1'
            solution_sketch: 'The set $A$ is {1,2,3}, because $4^2=16$ is too big. The set $B$ is {1,2,3} too. Each set sits in the other, so (a) and (b) are 1. Then $A=B$, and (c) is 1.'
          - problem: 'Let $A$ hold the integers from 1 to 20 that 6 divides. Let $B$ hold the integers from 1 to 20 that 3 divides. (a) Give 1 if $A\subseteq B$ and 0 if not. (b) Give 1 if $B\subseteq A$ and 0 if not. (c) Give the smallest element of $B$ that is not in $A$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 0; c = 3'
            solution_sketch: 'The set $A$ is {6,12,18} and the set $B$ is {3,6,9,12,15,18}. Each element of $A$ is in $B$, so (a) is 1. The element 3 is in $B$ and not in $A$, so (b) is 0. It is the smallest such element, so (c) is 3.'
          - problem: 'Let $A=\{1,2,3,4\}$ and $B=\{3,4,5\}$. (a) Give the number of elements of $A\setminus(A\setminus B)$. (b) Give the number of elements of $A\cap B$. (c) Give 1 if $A\setminus(A\setminus B)=A\cap B$ and 0 if not.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 2; b = 2; c = 1'
            solution_sketch: 'First $A\setminus B$ is {1,2}. Take it from $A$ and {3,4} stays, which is 2 elements. Also $A\cap B$ is {3,4}, which is 2 elements. The two sets are equal, so (c) is 1.'
          - problem: 'Let $A=\{1,2,3,4,5\}$ and $B=\{4,5,6\}$. (a) Give the number of elements of $A\setminus(A\cap B)$. (b) Give the number of elements of $A\setminus B$. (c) Give 1 if $A\setminus(A\cap B)=A\setminus B$ and 0 if not.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 3; b = 3; c = 1'
            solution_sketch: 'The set $A\cap B$ is {4,5}. Take it from $A$ and {1,2,3} stays, which is 3 elements. The set $A\setminus B$ is also {1,2,3}, which is 3 elements. The sets are equal, so (c) is 1.'
          - problem: 'Let $A=\{1,2,3\}$ and $B=\{3,4\}$. (a) Give the number of elements of $B\setminus A$. (b) Give the number of elements of $A\setminus(B\setminus A)$. (c) Give the sum of the elements of $A\setminus(B\setminus A)$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 3; c = 6'
            solution_sketch: 'The set $B\setminus A$ is {4}, which is 1 element. The number 4 is not in $A$, so taking it from $A$ changes nothing. So $A\setminus(B\setminus A)=A$ has 3 elements. Their sum is $1+2+3=6$.'
          # argument: Theorem 2.25
          - problem: 'Prove: two sets $A$ and $B$ are equal exactly when $A\subseteq B$ and $B\subseteq A$.'
            answer_contract: {"kind":"written"}
            answer: 'By the Axiom of Extension, A = B means each x is in A exactly when x is in B. Split this into two implications: the two containments.'
            solution_sketch: 'Start with the Axiom 2.24: the sets are equal when each object x lies in A exactly when it lies in B. Write the biconditional as two implications. The first one, x in A gives x in B, is $A\subseteq B$. The second one, x in B gives x in A, is $B\subseteq A$. Every step is an equivalence, so the argument runs in both directions.'
          # source: FoM exercise 2.3-2-10
          - problem: 'Let $A$ and $B$ be sets. Show that $A\setminus(A\setminus B)=A\cap B$ with two containments.'
            answer_contract: {"kind":"written"}
            answer: 'Show both containments with an arbitrary element. An element of A that is not outside B lies in B, so it lies in the overlap.'
            solution_sketch: 'Use Theorem 2.25 and prove two containments. Take x in $A\setminus(A\setminus B)$. Then x is in $A$ and x is not in $A\setminus B$, so x is in $B$. Hence x is in $A\cap B$. Now take x in $A\cap B$. It is in $A$ and in $B$, so it is not in $A\setminus B$, and it lies in $A\setminus(A\setminus B)$.'
          # source: FoM exercise 2.3-2-11
          - problem: 'Let $A$ and $B$ be sets. Prove: $A\setminus(A\setminus B)=A\cap B$. Follow one element $x$ of $A$ through the two differences.'
            answer_contract: {"kind":"written"}
            answer: 'Follow x in A. Then x is not in A minus B exactly when x is in B, so x is in A minus the difference exactly when x is in A and in B.'
            solution_sketch: 'Take x in A. The element x lies in $A\setminus B$ exactly when x is not in $B$. So x stays in $A\setminus(A\setminus B)$ exactly when x is in $B$. An element outside $A$ is in neither side. So both sides hold the same elements, as in Theorem 2.25 for the equality.'
          # source: FoM exercise 2.3-2-12
          - problem: 'Let $A$ and $B$ be sets. Show that $A\setminus(A\cap B)=A\setminus B$.'
            answer_contract: {"kind":"written"}
            answer: 'Take an element of each side and show it lies in the other side. Both conditions mean that x is in A and x is not in B.'
            solution_sketch: 'Use Theorem 2.25 and prove two containments. Let x be in $A\setminus(A\cap B)$. Then x is in $A$ and x is not in $A\cap B$, so x is not in $B$. Hence x is in $A\setminus B$. Now let x be in $A\setminus B$. Then x is in $A$ and not in $B$, so x is not in $A\cap B$.'
          # source: FoM exercise 2.3-2-13
          - problem: 'Let $A$ and $B$ be sets. Show that $A\setminus(B\setminus A)=A$.'
            answer_contract: {"kind":"written"}
            answer: 'The inclusion in A is clear. For the other inclusion, an element of A is not in B minus A, because that set holds only elements outside A.'
            solution_sketch: 'Use Theorem 2.25 and prove two containments. A difference $A\setminus X$ is always inside $A$, so $A\setminus(B\setminus A)\subseteq A$. Now let x be in $A$. Every element of $B\setminus A$ is outside $A$, so x is not in $B\setminus A$. Hence x is in $A\setminus(B\setminus A)$.'
        constraints: 'Test equality of small sets by their elements and by two containments; the items vary the sets.'
      - id: kp2
        name: 'Theorem 2.27, Theorem 2.28, Proposition 2.29 and Example 2.30: laws of intersection'
        key_prerequisites: [fom-2-2-axiom-specification]
        exemplars:
          - problem: 'Let $A=\{1,2,3,4\}$ and $B=\{3,4,5\}$. (a) Give the number of elements of $A\cap B$. (b) Give the number of elements of $B\cap A$. (c) Give 1 if $A\cap B=B\cap A$ and 0 if not.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 2; b = 2; c = 1'
            solution_sketch: 'The common elements of $A$ and $B$ are 3 and 4. So $A\cap B$ has 2 elements. The set $B\cap A$ has the same 2 elements. The sets are equal, so (c) is 1.'
          - problem: 'Let $A=\{1,2,3,4,5,6\}$, $B=\{2,4,6,8\}$ and $C=\{3,4,5,6\}$. (a) Give the sum of the elements of $A\cap(B\cap C)$. (b) Give the sum of the elements of $(A\cap B)\cap C$. (c) Give the number of elements of $A\cap(B\cap C)$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 10; b = 10; c = 2'
            solution_sketch: 'The set $B\cap C$ is {4,6}. Then $A\cap(B\cap C)$ is {4,6}, with sum 10. The set $A\cap B$ is {2,4,6}, and $(A\cap B)\cap C$ is {4,6}, with sum 10. The set $A\cap(B\cap C)$ has 2 elements.'
          - problem: 'Let $A=\{1,2\}$ and $B=\{1,2,3\}$. (a) Give 1 if $A\subseteq B$ and 0 if not. (b) Give the number of elements of $A\cap B$. (c) Give 1 if $A\cap B=A$ and 0 if not.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 2; c = 1'
            solution_sketch: 'Both elements of $A$ lie in $B$, so (a) is 1. The set $A\cap B$ is {1,2}, which has 2 elements. It equals $A$, so (c) is 1.'
          - problem: 'Let $A=\{1,2,4\}$ and $B=\{1,2,3\}$. (a) Give 1 if $A\subseteq B$ and 0 if not. (b) Give 1 if $A\cap B=A$ and 0 if not. (c) Give the number of elements of $A\cap B$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 0; b = 0; c = 2'
            solution_sketch: 'The element 4 is in $A$ and not in $B$, so (a) is 0. The set $A\cap B$ is {1,2}, which is not $A$, so (b) is 0. The set {1,2} has 2 elements.'
          - problem: 'Let $A$ hold the integers from 1 to 30 that 2 divides. Let $B$ hold the integers from 1 to 30 that 3 divides. (a) Give the number of elements of $A\cap B$. (b) Give the largest element of $A\cap B$. (c) Give 1 if $A\cap B\subseteq A$ and 0 if not.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 5; b = 30; c = 1'
            solution_sketch: 'An integer is in $A\cap B$ when 6 divides it. In the range 1 to 30 these are 6, 12, 18, 24 and 30, which is 5 integers. The largest is 30. Every element of an intersection is in each set, so (c) is 1.'
          - problem: 'Let $A=\{2,4\}$, $B=\{2,4,6,8\}$ and $C=\{1,2,3\}$. Give 1 for a true statement and 0 for a false statement. (a) $A\cap B=A$. (b) $A\cap C=A$. (c) $A\subseteq C$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 0; c = 0'
            solution_sketch: 'Both elements of $A$ lie in $B$, so $A\cap B=A$ and (a) is 1. The element 4 is not in $C$, so $A\cap C$ is {2}, which is not $A$. Then (b) is 0. Also $A\subseteq C$ fails, so (c) is 0.'
          - problem: 'Let $A=\{1,5,9\}$. (a) Give the number of elements of $A\cap A$. (b) Give the sum of the elements of $A\cap A$. (c) Give 1 if $A\cap A=A$ and 0 if not.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 3; b = 15; c = 1'
            solution_sketch: 'An element is in $A\cap A$ when it is in $A$. So $A\cap A$ is {1,5,9}, with 3 elements. The sum is $1+5+9=15$. The sets are equal, so (c) is 1.'
          - problem: 'A prime number $p$ is a twin prime when $p-2$ or $p+2$ is also prime. (a) Give the number of twin primes below 20. (b) Give the number of twin primes below 50. (c) Give 1 if 23 is a twin prime and 0 if not.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 7; b = 11; c = 0'
            solution_sketch: 'Below 20 the twin primes are 3, 5, 7, 11, 13, 17 and 19, which is 7 numbers. Below 50 we add 29, 31, 41 and 43, which gives 11 numbers. For 23 the numbers 21 and 25 are not prime, so (c) is 0.'
          # source: FoM exercise 2.3-2-15
          - problem: 'A twin prime is a prime $p$ for which $p-2$ or $p+2$ is prime also. The first twin prime is 3. List the twin primes in increasing order. (a) Give the 20th twin prime. (b) Give the sum of the first 20 twin primes. (c) Give the number of twin primes from 100 to 140.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 137; b = 1040; c = 6'
            solution_sketch: 'List the twin primes in order: 3, 5, 7, 11, 13, 17, 19, 29, 31, 41, 43, 59, 61, 71, 73, 101, 103, 107, 109 and 137. The 20th is 137. The sum of the 20 numbers is 1040. Between 100 and 140 we find 101, 103, 107, 109, 137 and 139, which is 6 numbers.'
          # source: FoM exercise 2.3-2-16
          - problem: 'Let $A$ and $B$ be sets. The first three parts use $A=\{1,2\}$ and $B=\{1,2,3\}$. The last part uses $A=\{1,2,3\}$ and $B=\{1,2\}$. Give 1 if the implication is true for these sets and 0 if it is false. (a) If $A\subseteq B$, then $A=B$. (b) If $A\subseteq B$, then $A=B$ or $B\subseteq A$. (c) If $A\subseteq B$, then $A\cap B=B$. (d) If $A\cap B=B$, then $A\subseteq B$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}}]}
            answer: 'a = 0; b = 0; c = 0; d = 0'
            solution_sketch: 'Use the given sets. In (a) $A\subseteq B$ holds, but $A\ne B$, so the implication has the value 0. In (b) neither $A=B$ nor $B\subseteq A$ holds, so the value is 0. In (c) the set $A\cap B$ is {1,2}, not $B$, so the value is 0. In (d) the hypothesis $A\cap B=B$ holds, but $A\subseteq B$ fails because 3 is in $A$ only, so the value is 0.'
          # argument: Theorem 2.27
          - problem: 'Prove: intersection of sets is commutative. For sets $A$ and $B$, show that $A\cap B=B\cap A$.'
            answer_contract: {"kind":"written"}
            answer: 'Show both containments. An element in both A and B is in both B and A, so it lies in B intersect A, and the reverse holds the same way.'
            solution_sketch: 'Use Theorem 2.25: prove two containments. Let x be in $A\cap B$. Then x is in $A$ and x is in $B$, so x is in $B$ and x is in $A$, which gives $x\in B\cap A$. Now let x be in $B\cap A$. The same two facts in the other order give $x\in A\cap B$. Both containments hold, so the sets are equal.'
          # argument: Theorem 2.28
          - problem: 'Prove: intersection of sets is associative. For sets $A$, $B$ and $C$, show that $A\cap(B\cap C)=(A\cap B)\cap C$.'
            answer_contract: {"kind":"written"}
            answer: 'Show both containments. An element of either side is in A, in B and in C, so it lies in the other side too.'
            solution_sketch: 'Use Theorem 2.25 and prove two containments. Let x be in $A\cap(B\cap C)$. Then x is in $A$, in $B$ and in $C$. So x is in $A\cap B$ and in $C$, which gives $x\in(A\cap B)\cap C$. For the reverse, let x be in $(A\cap B)\cap C$. Then x is in $A$, $B$ and $C$, so x is in $A\cap(B\cap C)$.'
          # argument: Proposition 2.29
          - problem: 'Prove: for sets $A$ and $B$, the relation $A\subseteq B$ holds exactly when $A\cap B=A$.'
            answer_contract: {"kind":"written"}
            answer: 'If A is inside B, the overlap of A and B is all of A. If the overlap equals A, then each element of A lies in B.'
            solution_sketch: 'Prove two directions. First assume $A\subseteq B$. Each x in $A$ is in $B$, so $A\subseteq A\cap B$. Also $A\cap B\subseteq A$ always holds, so $A\cap B=A$ by Theorem 2.25. Now assume $A\cap B=A$ and let x be in $A$. Then x is in $A\cap B$, so x is in $B$.'
          # source: FoM exercise 2.3-2-14
          - problem: 'Let $A$ be a set. Show that $A\cap A=A$.'
            answer_contract: {"kind":"written"}
            answer: 'Show both containments. An element of A is in A and in A, so it is in the intersection, and an element of the intersection is in A.'
            solution_sketch: 'Use Theorem 2.25 and prove two containments. Let x be in $A\cap A$. Then x is in $A$ by the definition of intersection. Now let x be in $A$. Then x is in $A$ and x is in $A$, so x is in $A\cap A$. This gives the equality.'
        constraints: 'Compute intersections of small sets and test the laws; the items vary the sets.'
