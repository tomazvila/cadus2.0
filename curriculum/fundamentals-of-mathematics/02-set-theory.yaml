    prerequisites:
      - id: fom-2-1-sets-objects
        weight: 0.6
        key: true
      - id: fom-1-8-russells-paradox
        weight: 0.4
        key: false
      - id: set-notation
        weight: 0.4
        key: false
      - id: indexed-families
        weight: 0.4
        key: false
      - id: union-intersection-difference
        weight: 0.4
        key: false
      - id: indexed-unions-intersections
        weight: 0.4
