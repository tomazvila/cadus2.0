        exemplars:
          - problem: 'Let $S$ be a set with $n$ elements. Give the number of elements of $P(S)$ in each case. (a) $n=0$. (b) $n=1$. (c) $n=5$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 2; c = 32'
