      - id: kp1
        name: 'Axiom 2.31, Proposition 2.32, Theorem 2.33 and Theorem 2.34: the union of a family and the union laws'
        key_prerequisites: [fom-2-3-axiom-extension]
        exemplars:
          - problem: 'Let $\mathcal{C}=\{\{1,2\},\{2,3\},\{5\}\}$ be a family of sets. (a) Give the number of elements of $\bigcup\mathcal{C}$. (b) Give the sum of the elements of $\bigcup\mathcal{C}$. (c) Give 1 if $\{2,3\}\subseteq\bigcup\mathcal{C}$ and 0 if not.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 4; b = 11; c = 1'
            solution_sketch: 'The union holds every element of every member of the family. So $\bigcup\mathcal{C}=\{1,2,3,5\}$. It has 4 elements and the sum $1+2+3+5=11$. The member {2,3} lies inside the union by Proposition 2.32, so (c) is 1.'
          - problem: 'Let $\mathcal{C}=\{\{1\},\{1,2\},\{1,2,3\}\}$. (a) Give the number of elements of $\bigcup\mathcal{C}$. (b) Give the largest element of $\bigcup\mathcal{C}$. (c) Give the number of members of $\mathcal{C}$ that are subsets of $\bigcup\mathcal{C}$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 3; b = 3; c = 3'
            solution_sketch: 'The union is {1,2,3}, so it has 3 elements and the largest is 3. By Proposition 2.32 each member of the family is a subset of the union. The family has 3 members, so (c) is 3.'
          - problem: 'Let $A=\{1,3,5\}$ and $B=\{2,3,4\}$. (a) Give the number of elements of $A\cup B$. (b) Give the number of elements of $B\cup A$. (c) Give the sum of the elements of $A\cup B$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 5; b = 5; c = 15'
            solution_sketch: 'The union $A\cup B$ is {1,2,3,4,5}, which has 5 elements. The union $B\cup A$ holds the same elements, so it has 5 elements too. The sum is $1+2+3+4+5=15$.'
          - problem: 'Let $A=\{1,2\}$, $B=\{2,3\}$ and $C=\{3,4,5\}$. (a) Give the number of elements of $A\cup(B\cup C)$. (b) Give the number of elements of $(A\cup B)\cup C$. (c) Give the sum of the elements of $(A\cup B)\cup C$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 5; b = 5; c = 15'
            solution_sketch: 'The set $B\cup C$ is {2,3,4,5}, so $A\cup(B\cup C)$ is {1,2,3,4,5}, which is 5 elements. The set $A\cup B$ is {1,2,3}, so $(A\cup B)\cup C$ is {1,2,3,4,5} too. The sum is 15.'
          - problem: 'Let $A=\{4,7,9\}$. (a) Give the number of elements of $A\cup A$. (b) Give the sum of the elements of $A\cup A$. (c) Give 1 if $A\cup A=A$ and 0 if not.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 3; b = 20; c = 1'
            solution_sketch: 'An element is in $A\cup A$ when it is in $A$ or in $A$, so when it is in $A$. The set is {4,7,9}, with 3 elements and the sum $4+7+9=20$. The sets are equal, so (c) is 1.'
          - problem: 'Parts a and b use $A=\{1,2\}$ and $B=\{1,2,3\}$. Parts c and d use $A=\{1,4\}$ and $B=\{1,2,3\}$. Give 1 for a true relation and 0 for a false relation. (a) $A\subseteq B$. (b) $A\cup B=B$. (c) $A\subseteq B$. (d) $A\cup B=B$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 1; c = 0; d = 0'
            solution_sketch: 'For the first pair, $A\subseteq B$ holds and $A\cup B$ is {1,2,3}, which is $B$. So (a) and (b) are 1. For the second pair, 4 is in $A$ and not in $B$, so (c) is 0. Then $A\cup B=\{1,2,3,4\}$ is not $B$, so (d) is 0.'
          - problem: 'Let $A=\{1,2\}$ and $B=\{2,5\}$. Look at the family $\{A,B\}$. (a) Give the number of elements of $\bigcup\{A,B\}$. (b) Give the sum of the elements of $\bigcup\{A,B\}$. (c) Give 1 if $\bigcup\{A,B\}=A\cup B$ and 0 if not.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 3; b = 8; c = 1'
            solution_sketch: 'The union of the family $\{A,B\}$ holds the elements of $A$ and of $B$. That is {1,2,5}, with 3 elements and the sum 8. This is the definition of $A\cup B$ in Axiom 2.31, so (c) is 1.'
          - problem: 'Let $\mathcal{C}$ be the family of the sets $\{k,k+1\}$ for $k=1,2,3,4,5$. (a) Give the number of members of $\mathcal{C}$. (b) Give the number of elements of $\bigcup\mathcal{C}$. (c) Give the sum of the elements of $\bigcup\mathcal{C}$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 5; b = 6; c = 21'
            solution_sketch: 'The family has 5 members: {1,2}, {2,3}, {3,4}, {4,5} and {5,6}. Their union is {1,2,3,4,5,6}, which is 6 elements. The sum is $1+2+3+4+5+6=21$.'
          # source: FoM exercise 2.4-2-23
          - problem: 'Let $A=\{1,2,3,6\}$, $B=\{3,4,5\}$ and $C=\{1,4\}$. (a) Give the sum of the elements of $A\cap B$. (b) Give the number of elements of $A\cup C$. (c) Give the sum of the elements of $A\cap(B\cup C)$. (d) Give the number of elements of $A\cup(B\cap C)$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}}]}
            answer: 'a = 3; b = 5; c = 4; d = 5'
            solution_sketch: 'The set $A\cap B$ is {3}, with sum 3. The set $A\cup C$ is {1,2,3,4,6}, which is 5 elements. The set $B\cup C$ is {1,3,4,5}, so $A\cap(B\cup C)$ is {1,3}, with sum 4. The set $B\cap C$ is {4}, so $A\cup(B\cap C)$ is {1,2,3,4,6}, which is 5 elements.'
          # argument: Proposition 2.32
          - problem: 'Prove: let $\mathcal{C}$ be a family of sets and let $C$ be a member of $\mathcal{C}$. Then $C\subseteq\bigcup\mathcal{C}$.'
            answer_contract: {"kind":"written"}
            answer: 'Take any element x of C. Since C is a member of the family, x belongs to a member of the family, so x is in the union.'
            solution_sketch: 'Let x be an arbitrary element of $C$. The set $C$ belongs to the family $\mathcal{C}$. By Axiom 2.31 the union holds every element of every member of the family. So x is in $\bigcup\mathcal{C}$. As x was arbitrary, $C\subseteq\bigcup\mathcal{C}$.'
          # argument: Theorem 2.33
          - problem: 'Prove: union of sets is commutative. For sets $A$ and $B$, show that $A\cup B=B\cup A$.'
            answer_contract: {"kind":"written"}
            answer: 'Show both containments. Being in A or in B is the same as being in B or in A, so each element of one side is in the other.'
            solution_sketch: 'Use Axiom 2.31 for the meaning of union and Theorem 2.25 for the two containments. Let x be in $A\cup B$. Then x is in $A$ or x is in $B$. The same two cases in the other order give $x\in B\cup A$. The reverse containment follows the same way.'
          # argument: Theorem 2.34
          - problem: 'Prove: union of sets is associative. For sets $A$, $B$ and $C$, show that $A\cup(B\cup C)=(A\cup B)\cup C$.'
            answer_contract: {"kind":"written"}
            answer: 'Show both containments. Membership in either side means membership in at least one of A, B and C.'
            solution_sketch: 'Use Axiom 2.31 and Theorem 2.25. Let x be in $A\cup(B\cup C)$. Then x is in $A$, or in $B$, or in $C$. If x is in $A$ or in $B$, it is in $A\cup B$, so it is in $(A\cup B)\cup C$. If x is in $C$, it is in $(A\cup B)\cup C$ too. The reverse containment follows the same way.'
          # source: FoM exercise 2.4-2-17
          - problem: 'Let $A$ and $B$ be sets. Use the definition of the union to show that $A\cup B$ and $B\cup A$ have the same elements.'
            answer_contract: {"kind":"written"}
            answer: 'An element is in A union B when it is in A or in B. The same words describe B union A, so the two sets have the same elements.'
            solution_sketch: 'Take x in $A\cup B$. Then x is in $A$ or in $B$ by Axiom 2.31. This is the condition for $x\in B\cup A$. Take x in $B\cup A$ and use the same condition. Then Theorem 2.33 follows from the Axiom of Extension.'
          # source: FoM exercise 2.4-2-18
          - problem: 'Let $A$, $B$ and $C$ be sets. Show that the two sets $A\cup(B\cup C)$ and $(A\cup B)\cup C$ have the same elements.'
            answer_contract: {"kind":"written"}
            answer: 'Both sets hold exactly the objects that are in at least one of A, B and C.'
            solution_sketch: 'Take x in $A\cup(B\cup C)$. By Axiom 2.31 the object x is in at least one of $A$, $B$ and $C$. This is also the condition for $x\in(A\cup B)\cup C$. Take x in the second set and use the same condition. Then Theorem 2.34 follows from the Axiom of Extension.'
          # source: FoM exercise 2.4-2-22
          - problem: 'Let $A$ be a set. Show that $A\cup A=A$.'
            answer_contract: {"kind":"written"}
            answer: 'Show both containments. An element of the union is in A or in A, so it is in A, and an element of A is in the union.'
            solution_sketch: 'Use Theorem 2.25 and prove two containments. Let x be in $A\cup A$. Then x is in $A$ or x is in $A$, so x is in $A$. Now let x be in $A$. Then x is in at least one of the two copies, so x is in $A\cup A$. By Axiom 2.31 these steps are equivalences.'
          # source: FoM exercise 2.4-2-25
          - problem: 'Let $A$ and $B$ be sets. Show that $A\subseteq B$ exactly when $A\cup B=B$.'
            answer_contract: {"kind":"written"}
            answer: 'If A is inside B, the union adds nothing to B. If the union equals B, then A lies inside the union, which is B.'
            solution_sketch: 'Use Proposition 2.29 as the model. First assume $A\subseteq B$ and let x be in $A\cup B$. If x is in $A$, then x is in $B$, so $A\cup B\subseteq B$. Also $B\subseteq A\cup B$ by Proposition 2.32. Now assume $A\cup B=B$. Each x in $A$ is in $A\cup B$, so it is in $B$.'
          # source: FoM exercise 2.4-2-26
          - problem: 'Let $A$ and $B$ be sets. Show that $A\cap B=A$ exactly when $A\cup B=B$.'
            answer_contract: {"kind":"written"}
            answer: 'Both conditions are equivalent to A being inside B. Link them with the two earlier equivalences.'
            solution_sketch: 'By Proposition 2.29, $A\cap B=A$ holds exactly when $A\subseteq B$. By the result of exercise 2-25, $A\subseteq B$ holds exactly when $A\cup B=B$. Chain the two equivalences. The chain holds in both directions.'
          # source: FoM exercise 2.4-2-27
          - problem: 'Let $A$, $B$ and $U$ be sets with $A\subseteq U$ and $B\subseteq U$. Show that $A\subseteq B$ exactly when $(U\setminus A)\cup B=U$.'
            answer_contract: {"kind":"written"}
            answer: 'If A is inside B, each x of U is outside A or in B. If the union is U, an x of A cannot lie outside B.'
            solution_sketch: 'Assume $A\subseteq B$ and let x be in $U$. If x is in $A$, then x is in $B$; if not, x is in $U\setminus A$. So x is in the union by Axiom 2.31, and the equality holds. Now assume the equality and let x be in $A$. If x is not in $B$, then x is outside the union, but the union is $U$. So x is in $B$.'
        constraints: 'Compute unions of families and of small sets; the items vary the sets.'
      - id: kp2
        name: 'Theorem 2.35, Theorem 2.36 and Theorem 2.37: distributive laws, DeMorgan''s laws and differences'
        key_prerequisites: [fom-1-3-conjunction-disjunction-negation]
        exemplars:
          - problem: 'Let $A=\{1,2,3,4\}$, $B=\{3,4,5\}$ and $C=\{4,5,6\}$. (a) Give the number of elements of $A\cap(B\cup C)$. (b) Give the number of elements of $(A\cap B)\cup(A\cap C)$. (c) Give the sum of the elements of $A\cap(B\cup C)$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 2; b = 2; c = 7'
            solution_sketch: 'The set $B\cup C$ is {3,4,5,6}. So $A\cap(B\cup C)$ is {3,4}, which is 2 elements with sum 7. Also $A\cap B=\{3,4\}$ and $A\cap C=\{4\}$. Their union is {3,4}, which is 2 elements.'
          - problem: 'Let $A=\{1,2\}$, $B=\{2,3,4\}$ and $C=\{4,5\}$. (a) Give the number of elements of $A\cup(B\cap C)$. (b) Give the number of elements of $(A\cup B)\cap(A\cup C)$. (c) Give the sum of the elements of $(A\cup B)\cap(A\cup C)$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 3; b = 3; c = 7'
            solution_sketch: 'The set $B\cap C$ is {4}, so $A\cup(B\cap C)$ is {1,2,4}, which is 3 elements. The sets $A\cup B=\{1,2,3,4\}$ and $A\cup C=\{1,2,4,5\}$ meet in {1,2,4}. That is 3 elements with sum 7.'
          - problem: 'Let $A=\{1,2,3,4,5,6,7,8\}$, $B=\{2,4,6\}$ and $C=\{3,6,9\}$. (a) Give the number of elements of $A\setminus(B\cup C)$. (b) Give the number of elements of $(A\setminus B)\cap(A\setminus C)$. (c) Give the sum of the elements of $(A\setminus B)\cap(A\setminus C)$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 4; b = 4; c = 21'
            solution_sketch: 'The set $B\cup C$ is {2,3,4,6,9}. Take it from $A$ and {1,5,7,8} stays, which is 4 elements. The sets $A\setminus B=\{1,3,5,7,8\}$ and $A\setminus C=\{1,2,4,5,7,8\}$ meet in {1,5,7,8}. Its sum is 21.'
          - problem: 'Let $A=\{1,2,3,4,5,6,7,8\}$, $B=\{2,4,6,8\}$ and $C=\{4,5,6\}$. (a) Give the number of elements of $A\setminus(B\cap C)$. (b) Give the number of elements of $(A\setminus B)\cup(A\setminus C)$. (c) Give the sum of the elements of $(A\setminus B)\cup(A\setminus C)$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 6; b = 6; c = 26'
            solution_sketch: 'The set $B\cap C$ is {4,6}. Take it from $A$ and {1,2,3,5,7,8} stays, which is 6 elements. The sets $A\setminus B=\{1,3,5,7\}$ and $A\setminus C=\{1,2,3,7,8\}$ join to {1,2,3,5,7,8}. Its sum is 26.'
          - problem: 'Let $A=\{1,2,3\}$, $B=\{3,4,5\}$ and $C=\{3,5\}$. (a) Give the number of elements of $(A\cup B)\setminus C$. (b) Give the number of elements of $(A\setminus C)\cup(B\setminus C)$. (c) Give the sum of the elements of $(A\setminus C)\cup(B\setminus C)$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 3; b = 3; c = 7'
