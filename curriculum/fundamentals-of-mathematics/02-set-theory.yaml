      - id: kp1
        name: 'Axiom 2.63: a set that holds the empty set and is closed under the successor step'
        key_prerequisites: []
        exemplars:
          - problem: 'Let $a=\emptyset$. (a) Give the number of elements of $a\cup\{a\}$. (b) Let $b=\{\emptyset\}$. Give the number of elements of $b\cup\{b\}$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 2'
            solution_sketch: 'For $a=\emptyset$ the set $a\cup\{a\}$ equals $\{\emptyset\}$, which has 1 element. For $b=\{\emptyset\}$ the set $b\cup\{b\}$ equals $\{\emptyset,\{\emptyset\}\}$. It has 2 elements, so a = 1 and b = 2.'
          - problem: 'Let $a=\{\emptyset,\{\emptyset\}\}$. (a) Give the number of elements of $a$. (b) Give the number of elements of $a\cup\{a\}$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}}]}
            answer: 'a = 2; b = 3'
            solution_sketch: 'The set $a$ has the two elements $\emptyset$ and $\{\emptyset\}$, so a = 2. The set $a$ is not an element of $a$. So $a\cup\{a\}$ has the 2 old elements and 1 new element, and b = 3.'
          - problem: 'Let $a=\{\emptyset,\{\emptyset\}\}$. Give 1 for true and 0 for false. (a) $\emptyset\in a\cup\{a\}$. (b) $\emptyset\in\emptyset$. (c) $a\in a\cup\{a\}$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 0; c = 1'
            solution_sketch: 'The set $a\cup\{a\}$ holds $\emptyset$, so (a) is 1. The empty set has no element, so (b) is 0. The set $a$ is the new element of $a\cup\{a\}$, so (c) is 1.'
          - problem: 'Start with $\emptyset$ and form $x\cup\{x\}$ again and again. Each step uses the set from the step before. (a) Give the number of elements after 3 steps. (b) Give the number after 5 steps. (c) Give the number after 10 steps.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 3; b = 5; c = 10'
            solution_sketch: 'Each step adds exactly 1 new element, because a set at this stage is not an element of itself. The start set has 0 elements. After 3, 5 and 10 steps the counts are 3, 5 and 10.'
          - problem: 'Let $a=\{\emptyset,\{\emptyset\}\}$. Give 1 for true and 0 for false. (a) $a\subseteq a\cup\{a\}$. (b) $a\in a$. (c) $\{\emptyset\}\in a\cup\{a\}$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 0; c = 1'
            solution_sketch: 'Every element of $a$ is an element of $a\cup\{a\}$, so (a) is 1. The elements of $a$ are $\emptyset$ and $\{\emptyset\}$, and $a$ is neither, so (b) is 0. The set $\{\emptyset\}$ is an element of $a$, so (c) is 1.'
          - problem: 'Let $a=\{\emptyset,\{\emptyset\},\{\{\emptyset\}\}\}$. (a) Give the number of elements of $a$. (b) Give the number of elements of $a\cup\{a\}$. (c) Give 1 if $\{\{\emptyset\}\}\in a\cup\{a\}$ and 0 if not.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 3; b = 4; c = 1'
            solution_sketch: 'The three listed sets are different, so $a$ has 3 elements. The set $a$ is not one of them, so $a\cup\{a\}$ has 4 elements. The set $\{\{\emptyset\}\}$ is in $a$, so c = 1.'
        constraints: 'build and count the sets from the empty set with the step x union x-singleton'
      - id: kp2
        name: 'Theorem 2.64: the natural numbers and the Peano properties'
        key_prerequisites: [fom-2-2-axiom-specification, fom-2-3-axiom-extension]
        exemplars:
          - problem: 'Let $1=\{\emptyset\}$ and $n''=n\cup\{n\}$. (a) Give the number of elements of $1$. (b) Give the number of elements of $1''$. (c) Give the number of elements of $(1'')''$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 2; c = 3'
            solution_sketch: 'The set $1$ holds only $\emptyset$, so a = 1. The set $1''$ equals $\{\emptyset,\{\emptyset\}\}$ and has 2 elements. The set $(1'')''$ adds the new element $1''$, so it has 3 elements.'
          - problem: 'Let $1=\{\emptyset\}$, $n''=n\cup\{n\}$ and $2=1''$. Use the Peano properties of the natural numbers. Give 1 for true and 0 for false. (a) Some natural number has the successor 1. (b) Some natural number has the successor 2. (c) Every natural number has a successor that is a natural number.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 0; b = 1; c = 1'
            solution_sketch: 'No natural number has 1 as its successor, so (a) is 0. The number 1 has the successor 2, so (b) is 1. Property 2 gives every natural number a successor in the set, so (c) is 1.'
          - problem: 'Read $n''$ as $n+1$ for the usual natural numbers. (a) Give $12''$. (b) Give the natural number whose successor is $9$. (c) Give $(20'')''$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 13; b = 8; c = 22'
            solution_sketch: 'Here $12''=12+1=13$. The number with successor $9$ is $9-1=8$. Then $(20'')''=(20+1)+1=22$. The three answers are 13, 8 and 22.'
          - problem: 'A set $S\subseteq\mathbb{N}$ holds $1$. Each successor of an element of $S$ is again in $S$. Give 1 for true and 0 for false. (a) $4\in S$. (b) $100\in S$. (c) Some natural number is not in $S$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 1; c = 0'
            solution_sketch: 'Principle of Induction: such a set $S$ equals $\mathbb{N}$. So every natural number is in $S$, which gives (a) = 1 and (b) = 1. No natural number lies outside $S$, so (c) = 0.'
          - problem: 'Let $S=\{n\in\mathbb{N}: n\ge 3\}$. Give 1 for true and 0 for false. (a) $1\in S$. (b) For each $n\in S$ the successor $n''$ is in $S$. (c) $S=\mathbb{N}$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 0; b = 1; c = 0'
            solution_sketch: 'Since $1<3$, the number $1$ is not in $S$, so (a) is 0. If $n\ge 3$ then $n''=n+1\ge 3$, so (b) is 1. The number $1$ is in $\mathbb{N}$ but not in $S$, so (c) is 0.'
          - problem: '(a) Give the number of natural numbers whose successor is $1$. (b) Give the number of natural numbers whose successor is $6$. (c) Give the number of natural numbers $n$ with $n''=n$.'
