            answer: 'a = 0; b = 1; c = 0; d = 0'
            solution_sketch: 'The number 9 is divisible by 3 but not by 6, so the implication has the value 0. The contrapositive reads: if x is not divisible by 6, then x is not divisible by 3. For x=9 its hypothesis has the value 1 and its conclusion has the value 0. So the contrapositive has the value 0, the same as the implication.'
          - problem: 'A natural number $x$ is even and prime when $x=2k$ for a natural number $k$ and $x$ is prime. (a) Give the only natural number $k$ for which $2k$ is prime. (b) Give the only even prime number. (c) Give the number of natural numbers $x$ with $x\le 100$ that are even and prime.'
