    answer_kind: multi-step
    expected_time_secs: 600
    prerequisites:
      - id: fom-1-6-proofs
        weight: 0.6
        key: true
      - id: fom-1-5-variables-quantifiers
        weight: 0.4
        key: false
      - id: rules-of-inference
        weight: 0.4
