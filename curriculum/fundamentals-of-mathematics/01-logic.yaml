      - id: kp1
        name: 'Example 1.84: Russell''s paradox and sets that hold themselves'
        key_prerequisites: [fom-1-5-variables-quantifiers, set-notation]
        exemplars:
          - problem: 'Let $A=\{1,2\}$ and $B=\{A,3\}$. Give 1 for a true statement and 0 for a false statement. (a) $1 \in A$. (b) $A \in A$. (c) $A \in B$. (d) $1 \in B$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 0; c = 1; d = 0'
            solution_sketch: 'The set $A$ holds 1, so (a) is 1. The set $A$ holds only 1 and 2, not itself, so (b) is 0. The set $B$ holds $A$ as an element, so (c) is 1. The set $B$ holds $A$ and 3, not 1, so (d) is 0.'
          - problem: 'Let $A=\{1,2\}$, $B=\{A\}$ and $C=\{A,B\}$. (a) Count the elements of $C$. (b) Give 1 if $C \in C$ and 0 if not. (c) Count the sets among $A$, $B$ and $C$ that are elements of themselves.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
