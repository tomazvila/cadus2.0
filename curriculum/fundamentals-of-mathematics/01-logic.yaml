          # source: FoM exercise 1.6-1-54
          - problem: 'Prove that the square root of a prime number $p$ is not rational.'
            answer_contract: {"kind":"written"}
            answer: 'Assume the root of p is a/b in lowest terms. Then p divides a and p divides b, a contradiction.'
            solution_sketch: 'Use the same contradiction method as for the root of 3 in Example 1.57. Assume the root of p is a/b in lowest terms. Then a^2=pb^2, so p divides a^2. Since p is prime, p divides a. Write a=pk. Then b^2=pk^2, so p divides b, a contradiction.'
          # source: FoM exercise 1.6-1-55
          - problem: 'Prove: a natural number $k$ that is not a perfect square has an irrational square root.'
            answer_contract: {"kind":"written"}
            answer: 'Assume the root of k is a/b in lowest terms. Then a squared equals k times b squared, so b squared divides a squared, so b is 1 and k is a square.'
            solution_sketch: 'Use the contradiction method of Example 1.57. Assume the root of k is a/b in lowest terms. Then a^2=kb^2. Each prime factor of b divides a^2, so it divides a. This contradicts lowest terms unless b=1. Then k=a^2 is a perfect square, which contradicts the assumption.'
          # source: FoM exercise 1.6-1-56
          - problem: 'Prove that the function $f(x,y)=x+y+1$ of two variables is not a product $g(x)h(y)$ of two functions of one variable. Hint: assume it is, and use the four points $(0,0)$, $(1,0)$, $(0,1)$ and $(1,1)$.'
            answer_contract: {"kind":"written"}
            answer: 'Assume f=g(x)h(y). Then f(0,0)f(1,1)=3 and f(1,0)f(0,1)=4, but both equal g(0)h(0)g(1)h(1).'
            solution_sketch: 'Use a proof by contradiction, as in Example 1.57. Assume f(x,y)=g(x)h(y). Then f(0,0)f(1,1) equals g(0)h(0)g(1)h(1). Also f(1,0)f(0,1) equals g(1)h(0)g(0)h(1), the same product. But the values are 1 times 3 and 2 times 2, which are 3 and 4.'
        constraints: 'Evaluate the four laws under fixed values and count rows; the items vary the statements.'
      - id: kp6
        name: 'Example 1.74 and Example 1.76: universal and existence statements and angle sums'
        key_prerequisites: []
        exemplars:
          - problem: 'The natural numbers are $1, 2, 3, \dots$. Give (a) the smallest even natural number, (b) the smallest even natural number above $10$, (c) the smallest even natural number that differs from every power of $2$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 2; b = 12; c = 6'
            solution_sketch: 'The smallest even natural number is 2. The next even number above 10 is 12. The even numbers 2 and 4 are powers of 2, and 6 is not, so (c) is 6.'
          - problem: 'The natural numbers are $1, 2, 3, \dots$. Give (a) the smallest odd natural number above $1$ that is not prime, (b) the smallest natural number whose square is above $50$, (c) the smallest natural number $n$ with $n(n+1)>100$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 9; b = 8; c = 10'
            solution_sketch: 'The odd numbers 3, 5 and 7 are prime and 9 is not, so (a) is 9. Since 7 squared is 49 and 8 squared is 64, (b) is 8. Since 9 times 10 is 90 and 10 times 11 is 110, (c) is 10.'
          - problem: 'Count the odd natural numbers between $1$ and $20$ that are not prime. Do not count $1$. (a) Give the count. (b) Give the largest such number.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}}]}
            answer: 'a = 2; b = 15'
            solution_sketch: 'The odd numbers from 3 to 19 are 3, 5, 7, 9, 11, 13, 15, 17 and 19. The ones that are not prime are 9 and 15. That gives 2 numbers, and the largest is 15.'
          - problem: 'The angles of a triangle add up to $180^\circ$. Give in degrees (a) the third angle of a triangle with angles $50^\circ$ and $60^\circ$, (b) the sum of the angles of a quadrilateral, (c) the fourth angle of a quadrilateral with angles $90^\circ$, $100^\circ$ and $80^\circ$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 70; b = 360; c = 90'
            solution_sketch: 'In (a), 180 minus 110 is 70. A diagonal splits a quadrilateral into 2 triangles, so the sum is 360. In (c), 360 minus 270 is 90.'
          - problem: 'A convex polygon with $n$ sides splits into $n-2$ triangles by diagonals from one vertex. Each triangle has angle sum $180^\circ$. Give in degrees the angle sum of (a) a pentagon, (b) a hexagon, (c) a polygon with $10$ sides.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 540; b = 720; c = 1440'
            solution_sketch: 'A pentagon splits into 3 triangles, which gives 540. A hexagon splits into 4 triangles, which gives 720. A polygon with 10 sides splits into 8 triangles, which gives 1440.'
          - problem: 'Five angles of a hexagon are $120^\circ$ each, and the sixth angle is $x$. Four angles of a pentagon are $100^\circ$ each, and the fifth angle is $y$. Give (a) $x$ in degrees, (b) $y$ in degrees.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}}]}
            answer: 'a = 120; b = 140'
            solution_sketch: 'The angle sum of a hexagon is 720. Five times 120 is 600, so x is 120. The angle sum of a pentagon is 540. Four times 100 is 400, so y is 140.'
          # source: FoM exercise 1.6-1-57
          - problem: 'Prove: the four angles of any convex quadrilateral add up to $360^\circ$.'
            answer_contract: {"kind":"written"}
            answer: 'A diagonal cuts the quadrilateral into two triangles. Each triangle has angle sum 180 degrees, and the angles of the two triangles fill the four angles.'
            solution_sketch: 'Draw one diagonal from a vertex to the opposite vertex. It splits the quadrilateral into two triangles. Use the triangle angle sum from Example 1.52. The angles of the two triangles together make up the four angles of the quadrilateral. So the sum is 180 plus 180, which is 360.'
          # source: FoM exercise 1.6-1-58
          - problem: 'Prove: the five angles of any convex pentagon add up to $540^\circ$.'
            answer_contract: {"kind":"written"}
            answer: 'Diagonals from one vertex cut the pentagon into three triangles. Their angle sums of 180 degrees each give 540 degrees.'
            solution_sketch: 'Draw the two diagonals from one vertex. They split the pentagon into three triangles. Use the triangle angle sum from Example 1.52. The angles of the triangles make up the five angles of the pentagon. So the sum is 3 times 180, which is 540.'
          # source: FoM exercise 1.6-1-59
          - problem: 'Prove: the six angles of any convex hexagon add up to $720^\circ$.'
            answer_contract: {"kind":"written"}
            answer: 'Diagonals from one vertex cut the hexagon into four triangles. Their angle sums of 180 degrees each give 720 degrees.'
            solution_sketch: 'Draw the three diagonals from one vertex. They split the hexagon into four triangles. Use the triangle angle sum from Example 1.52. The angles of the triangles make up the six angles of the hexagon. So the sum is 4 times 180, which is 720.'
        constraints: 'Find witnesses and extreme values of natural numbers and compute angle sums; the items vary the numbers.'
