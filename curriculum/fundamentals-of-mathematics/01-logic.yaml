            answer: 'a = 0; b = 1; c = 1; d = 1'
            solution_sketch: 'Here not q has the value 0 and not p has the value 1. The contrapositive not q implies not p has a false hypothesis, so its value is 1. The implication p implies q has a false hypothesis, so its value is 1. Both implications have the same value.'
          - problem: 'Look at the implication ''If $x$ is divisible by $3$, then $x$ is divisible by $6$''. Take $x=9$. Give each value as 1 for true and 0 for false. (a) The implication. (b) The hypothesis of its contrapositive. (c) The conclusion of its contrapositive. (d) The contrapositive.'
