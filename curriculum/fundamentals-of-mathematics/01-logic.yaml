      - id: kp1
        name: 'Theorem 1.25, Example 1.26 and Proposition 1.27: De Morgan laws, double negation and fewer symbols'
        key_prerequisites: [fom-1-3-conjunction-disjunction-negation, de-morgan-double-negation]
        exemplars:
          - problem: 'Let $p$ have the value 1 and $q$ have the value 0. Give each value as 1 for true and 0 for false. (a) $\neg(p \wedge q)$. (b) $\neg(p \vee q)$. (c) $\neg p \vee \neg q$. (d) $\neg p \wedge \neg q$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 0; c = 1; d = 0'
            solution_sketch: 'Here $p \wedge q$ has the value 0, so (a) is 1. Also $p \vee q$ has the value 1, so (b) is 0. Next $\neg p$ is 0 and $\neg q$ is 1, so (c) is 1 and (d) is 0. Parts (a) and (c) agree. Parts (b) and (d) agree.'
          - problem: 'Let $p$ have the value 0. Give each value as 1 for true and 0 for false. (a) $\neg p$. (b) $\neg(\neg p)$. (c) $\neg(\neg(\neg p))$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 0; c = 1'
            solution_sketch: 'A negation swaps 1 and 0. The first swap gives $\neg p = 1$. The second swap gives 0. The third swap gives 1. So the key is a = 1; b = 0; c = 1.'
          - problem: 'Let $p$ and $q$ range over all four pairs of truth values. Give the number of pairs for which each statement has the value 1. (a) $\neg(p \wedge q)$. (b) $\neg p \vee \neg q$. (c) $\neg(p \vee q)$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 3; b = 3; c = 1'
            solution_sketch: 'Only the pair (1, 1) makes $p \wedge q$ true, so $\neg(p \wedge q)$ is true in 3 pairs. The statement $\neg p \vee \neg q$ has the same 3 pairs. Only the pair (0, 0) makes $p \vee q$ false, so $\neg(p \vee q)$ is true in 1 pair.'
          - problem: 'Let $p$ and $q$ both have the value 1. Give each value as 1 for true and 0 for false. (a) $\neg(\neg p \vee q)$. (b) $\neg(\neg p \wedge \neg q)$. (c) $\neg(p \vee \neg q)$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 0; b = 1; c = 0'
            solution_sketch: 'In (a), $\neg p = 0$ and $q = 1$, so the inner statement is 1 and the result is 0. In (b), $\neg p = 0$ and $\neg q = 0$, so the inner statement is 0 and the result is 1. In (c), $p = 1$, so the inner statement is 1 and the result is 0.'
          - problem: 'Count the symbols $\wedge$, $\vee$ and $\neg$ in each expression. Each part asks for the total number of the three symbols together. (a) $(p \wedge \neg q) \vee (\neg p \wedge q)$. (b) $(p \vee q) \wedge \neg(q \wedge p)$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}}]}
            answer: 'a = 5; b = 4'
            solution_sketch: 'Expression (a) has two $\wedge$ symbols, one $\vee$ symbol and two $\neg$ symbols. That is 5 symbols. Expression (b) has one $\vee$ symbol, two $\wedge$ symbols and one $\neg$ symbol. That is 4 symbols.'
          - problem: 'Let $p$ have the value 1 and $q$ have the value 1. Give the value of each statement as 1 for true and 0 for false. (a) $\neg(p \wedge \neg q)$. (b) $\neg(\neg p \vee \neg q)$. (c) $\neg(\neg(p \wedge q))$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 1; c = 1'
            solution_sketch: 'In (a), $\neg q = 0$, so $p \wedge \neg q = 0$ and the result is 1. In (b), $\neg p \vee \neg q = 0$, so the result is 1. In (c), $p \wedge q = 1$ and two negations return 1.'
          # argument: Theorem 1.25
          - problem: 'Prove: for statements $p$ and $q$, the negation of $p \wedge q$ equals $\neg p \vee \neg q$.'
            answer_contract: {"kind":"written"}
            answer: 'Write a truth table for both sides. The two columns have the same value in all four rows.'
            solution_sketch: 'List the four pairs of values for $p$ and $q$. Compute $\neg(p \wedge q)$ in each row. Compute $\neg p \vee \neg q$ in each row. The columns are equal in every row. So the two statements are equal. This is part 1 of Theorem 1.25.'
          # argument: Theorem 1.25
          - problem: 'Prove: for statements $p$ and $q$, the negation of $p \vee q$ equals $\neg p \wedge \neg q$.'
            answer_contract: {"kind":"written"}
            answer: 'The statement p or q is false only if p and q are both false. So its negation is true only if both negations are true.'
            solution_sketch: 'The statement $p \vee q$ is false exactly when $p$ is false and $q$ is false. Then $\neg(p \vee q)$ is true exactly in that case. In that case $\neg p$ and $\neg q$ are both true. So $\neg p \wedge \neg q$ is true exactly in the same case. This is part 2 of Theorem 1.25.'
          # argument: Proposition 1.27
          - problem: 'Prove: for a statement $p$, the negation of $\neg p$ equals $p$.'
            answer_contract: {"kind":"written"}
            answer: 'A negation swaps true and false. Two swaps return the first value.'
            solution_sketch: 'Take the two values of $p$. If $p$ is true, then $\neg p$ is false and $\neg(\neg p)$ is true. If $p$ is false, then $\neg p$ is true and $\neg(\neg p)$ is false. In both cases $\neg(\neg p)$ has the value of $p$. This is the law of double negation in Proposition 1.27.'
          # source: FoM exercise 1.4-1-20
          - problem: 'Prove: the negation of $p \vee q$ equals $\neg p \wedge \neg q$. Give three proofs: one in words, one by algebra with the laws of Boolean algebra, and one with a truth table.'
            answer_contract: {"kind":"written"}
            answer: 'Use the fact that p or q is false only when both are false. Then match the four rows of a truth table.'
            solution_sketch: 'In words, $p \vee q$ is false only if both $p$ and $q$ are false. For the algebra, use Theorem 1.25 part 1 with $\neg p$ and $\neg q$ and the double negation law. For the truth table, list four rows. Compute both sides. The columns are equal.'
          # source: FoM exercise 1.4-1-27
          - problem: 'Prove each equality in words. (a) $(p \wedge q) \wedge (p \wedge r) = (p \wedge q) \wedge r$. (b) $(p \vee q) \vee (p \vee r) = (p \vee q) \vee r$.'
            answer_contract: {"kind":"written"}
            answer: 'In (a), the extra p adds no new condition. In (b), the extra p adds no new way to be true.'
            solution_sketch: 'In (a), the left side is true when $p$, $q$ and $r$ are all true. The right side is true in the same case. In (b), the left side is true when at least one of $p$, $q$, $r$ is true. The right side is true in the same case. Theorem 1.24 gives the same result with the rules of association.'
          # source: FoM exercise 1.4-1-28
          - problem: 'Prove each equality by algebra. Name the law of Boolean algebra for each step. (a) $(p \wedge q) \wedge (p \wedge r) = (p \wedge q) \wedge r$. (b) $(p \vee q) \vee (p \vee r) = (p \vee q) \vee r$.'
            answer_contract: {"kind":"written"}
            answer: 'Regroup with the laws of association and commutation. Then use that p and p equals p, and p or p equals p.'
            solution_sketch: 'Use Theorem 1.24 to regroup the left side of (a) as $q \wedge (p \wedge p) \wedge r$. Replace $p \wedge p$ by $p$ and regroup to get the right side. Do the same for (b) with $p \vee p = p$. Theorem 1.25 is not needed for these steps. Name each law next to each line.'
        constraints: 'Statements with and, or and not; values 1 and 0.'
      - id: kp2
        name: 'Definition 1.28 and Theorem 1.29: the contrapositive of an implication'
        key_prerequisites: [conditional-statements]
        exemplars:
          # source: FoM exercise 1.4-1-24
          - problem: 'For each part, give 1 if such a case exists and 0 if no such case exists. (a) An implication and its contrapositive both have the value true. (b) An implication and its contrapositive both have the value false. (c) An implication has the value true and its contrapositive has the value false. (d) An implication has the value false and its contrapositive has the value true.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 1; c = 0; d = 0'
            solution_sketch: 'An implication and its contrapositive always have the same value. So the values true and true occur, and the values false and false occur. The mixed cases in (c) and (d) never occur. The key is a = 1; b = 1; c = 0; d = 0.'
          - problem: 'Give each value as 1 for true and 0 for false. (a) $p \Rightarrow q$ for $p = 0$ and $q = 0$. (b) $\neg q \Rightarrow \neg p$ for $p = 0$ and $q = 0$. (c) $p \Rightarrow q$ for $p = 1$ and $q = 0$. (d) $\neg q \Rightarrow \neg p$ for $p = 1$ and $q = 0$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 1; c = 0; d = 0'
            solution_sketch: 'For $p = 0$ and $q = 0$, the implication $p \Rightarrow q$ has a false first part, so it is 1. Here $\neg q = 1$ and $\neg p = 1$, so the contrapositive is 1. For $p = 1$ and $q = 0$, the implication is 0. Here $\neg q = 1$ and $\neg p = 0$, so the contrapositive is 0.'
          - problem: 'Let $p$ and $q$ range over all four pairs of truth values. Give the number of pairs for which each statement has the value 1. (a) $p \Rightarrow q$. (b) $\neg q \Rightarrow \neg p$. (c) The number of pairs where the two statements above have different values.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 3; b = 3; c = 0'
            solution_sketch: 'The implication $p \Rightarrow q$ is false only for the pair (1, 0), so it is true in 3 pairs. The contrapositive is false only for the same pair, so it is true in 3 pairs. The two statements never differ, so (c) is 0.'
          - problem: 'Let $x$ be a whole number from 1 to 10. Give the number of values of $x$ for which each implication has the value false. (a) If $x$ is even, then $x > 5$. (b) If $x \le 5$, then $x$ is odd.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}}]}
            answer: 'a = 2; b = 2'
            solution_sketch: 'Implication (a) is false when $x$ is even and $x \le 5$. Those values are 2 and 4, so (a) is 2. Implication (b) is false when $x \le 5$ and $x$ is even. Those values are 2 and 4 again, so (b) is 2.'
          - problem: 'The converse of $p \Rightarrow q$ is $q \Rightarrow p$. The inverse of $p \Rightarrow q$ is $\neg p \Rightarrow \neg q$. Let $p$ and $q$ range over all four pairs of truth values. Give the number of pairs in which the two statements have different values. (a) $p \Rightarrow q$ and its converse. (b) The contrapositive of $p \Rightarrow q$ and the converse. (c) The converse and the inverse.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 2; b = 2; c = 0'
            solution_sketch: 'The statement $p \Rightarrow q$ and its converse differ in the pairs (1, 0) and (0, 1), so (a) is 2. The contrapositive has the same values as $p \Rightarrow q$, so (b) is 2. The inverse $\neg p \Rightarrow \neg q$ is the contrapositive of the converse, so it always equals the converse and (c) is 0.'
          - problem: 'Let $x$ be a whole number from 1 to 6. Give the smallest value of $x$ that breaks each implication. (a) If $x$ is prime, then $x$ is odd. (b) If $x$ is even, then $x$ is not prime.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}}]}
            answer: 'a = 2; b = 2'
            solution_sketch: 'Implication (a) breaks when $x$ is prime and even. The smallest such value is 2. Implication (b) is the contrapositive of (a). It breaks at the same value 2.'
          # argument: Theorem 1.29
          - problem: 'Prove: for statements $p$ and $q$, the implication $p \Rightarrow q$ and its contrapositive $\neg q \Rightarrow \neg p$ always have the same value.'
            answer_contract: {"kind":"written"}
            answer: 'Both statements are false only in the row where p is true and q is false. Every other row gives true for both.'
            solution_sketch: 'List the four pairs of values for $p$ and $q$. The implication $p \Rightarrow q$ is false only for $p = 1$ and $q = 0$. For the contrapositive, the first part $\neg q$ is true and the second part $\neg p$ is false only for the same pair. So the contrapositive is false only for that pair. All other rows give true for both.'
          # source: FoM exercise 1.4-1-21
          - problem: 'Use a truth table to prove: $p \Rightarrow q$ and $\neg q \Rightarrow \neg p$ are equivalent.'
            answer_contract: {"kind":"written"}
            answer: 'Compute both columns for the four rows. They match in every row.'
            solution_sketch: 'Write the four rows for $p$ and $q$. Compute $\neg p$ and $\neg q$ in each row. Compute $p \Rightarrow q$ in each row: it is 1, 0, 1, 1 for the rows (0,0), (1,0), (0,1), (1,1). Compute $\neg q \Rightarrow \neg p$ in the same rows: it is 1, 0, 1, 1 again. The columns are equal, which proves Theorem 1.29.'
          # source: FoM exercise 1.4-1-23
          - problem: 'Write the contrapositive of each implication. (a) If a function is differentiable, then the function is continuous. (b) If a natural number $n$ is divisible by 3 with $n > 3$, then $n$ is composite. (c) If our team wins its next game, then it qualifies for the postseason. (d) If $f(x) = x^2$, then $f''(x) = 2x$. (e) If a prime number $p$ is a twin prime, then $p > 2$.'
            answer_contract: {"kind":"written"}
            answer: 'Swap the two parts and take the negation of each. The negation of an and statement is an or statement.'
            solution_sketch: 'By Definition 1.28, the contrapositive of $p \Rightarrow q$ is $\neg q \Rightarrow \neg p$. (a) If the function is not continuous, then it is not differentiable. (b) If $n$ is not composite, then $n$ is not divisible by 3 or $n \le 3$. (c) If the team does not qualify for the postseason, then it does not win its next game. (d) If $f''(x) \ne 2x$, then $f(x) \ne x^2$. (e) If $p \le 2$, then $p$ is not a twin prime.'
        constraints: 'Implications, contrapositive, converse and inverse; values 1 and 0.'
      - id: kp3
        name: 'Example 1.30 and Theorem 1.31: the negation of an implication'
        key_prerequisites: [fom-1-3-conjunction-disjunction-negation]
        exemplars:
          - problem: 'Give each value as 1 for true and 0 for false. (a) $\neg(p \Rightarrow q)$ for $p = 0$ and $q = 1$. (b) $p \wedge \neg q$ for $p = 0$ and $q = 1$. (c) $\neg p \vee q$ for $p = 0$ and $q = 1$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 0; b = 0; c = 1'
            solution_sketch: 'For $p = 0$ and $q = 1$, the implication $p \Rightarrow q$ is 1. So its negation is 0. Also $\neg q = 0$, so $p \wedge \neg q = 0$. Finally $\neg p = 1$, so $\neg p \vee q = 1$.'
          - problem: 'Let $p$ and $q$ range over all four pairs of truth values. Give the number of pairs for which each statement has the value 1. (a) $\neg(p \Rightarrow q)$. (b) $p \Rightarrow q$. (c) $p \wedge \neg q$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 3; c = 1'
            solution_sketch: 'The implication $p \Rightarrow q$ is false only for (1, 0), so (b) is 3 and (a) is 1. The statement $p \wedge \neg q$ is true only for $p = 1$ and $q = 0$, so (c) is 1.'
          - problem: 'Let $n$ be a whole number. The implication is: if $n > 3$, then $n$ is even. Give each value as 1 for true and 0 for false. (a) The implication for $n = 5$. (b) The negation of the implication for $n = 5$. (c) The implication for $n = 2$. (d) The negation of the implication for $n = 2$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}}]}
            answer: 'a = 0; b = 1; c = 1; d = 0'
            solution_sketch: 'For $n = 5$, the first part is true and the second part is false, so the implication is 0 and its negation is 1. For $n = 2$, the first part is false, so the implication is 1 and its negation is 0.'
          - problem: 'Let $n$ be a positive whole number. Give the value of $n$ for which the negation of the implication "if $n$ is even, then $n > 10$" is true. (a) The smallest such $n$. (b) The largest such $n$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}}]}
            answer: 'a = 2; b = 10'
            solution_sketch: 'The negation is true when $n$ is even and $n \le 10$. The smallest positive even number is 2. The largest even number with $n \le 10$ is 10.'
          - problem: 'Let $a$ and $b$ each range over the numbers 1, 2 and 3. That gives nine pairs. Give the number of pairs for which each statement is true. (a) $a$ is even and $ab$ is odd. (b) $ab$ is odd. (c) $a$ is odd and $ab$ is even.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 0; b = 4; c = 2'
            solution_sketch: 'For (a), an even $a$ makes $ab$ even, so 0 pairs work. For (b), both $a$ and $b$ must be odd, so $a$ and $b$ come from 1 and 3 and there are 4 pairs. For (c), $a$ is 1 or 3 and $b$ is 2, so there are 2 pairs.'
          - problem: 'Give each value as 1 for true and 0 for false. (a) $\neg(p \Rightarrow \neg q)$ for $p = 1$ and $q = 1$. (b) $\neg(\neg p \Rightarrow q)$ for $p = 1$ and $q = 0$. (c) $\neg(q \Rightarrow p)$ for $p = 0$ and $q = 0$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 0; c = 0'
            solution_sketch: 'In (a), $\neg q = 0$, so $p \Rightarrow \neg q$ is 0 and the negation is 1. In (b), $\neg p = 0$, so the implication is 1 and the negation is 0. In (c), $q \Rightarrow p$ is $0 \Rightarrow 0$, which is 1, so the negation is 0.'
          # argument: Theorem 1.31
          - problem: 'Prove: for statements $p$ and $q$, the negation of $p \Rightarrow q$ equals $p \wedge \neg q$.'
            answer_contract: {"kind":"written"}
            answer: 'An implication is false only if its first part is true and its second part is false. That is the statement p and not q.'
            solution_sketch: 'By Theorem 1.20, a statement is true exactly in the rows where one of its conjunctions is true. The implication $p \Rightarrow q$ is false only in the row $p = 1$, $q = 0$. So $\neg(p \Rightarrow q)$ is true only in that row. The statement $p \wedge \neg q$ is true only in that row. The two statements are equal.'
          # source: FoM exercise 1.4-1-22
          - problem: 'Give two proofs that $\neg(p \Rightarrow q) = p \wedge \neg q$: one in words and one with a truth table.'
            answer_contract: {"kind":"written"}
            answer: 'In words: an implication fails only if p holds and q fails. In the truth table: the two columns match.'
            solution_sketch: 'In words, use Theorem 1.31: the implication fails exactly when $p$ is true and $q$ is false. For the table, list four rows. Compute $\neg(p \Rightarrow q)$ and $p \wedge \neg q$. Both columns read 0, 1, 0, 0 in the rows (0,0), (1,0), (0,1), (1,1). The columns are equal.'
          # source: FoM exercise 1.4-1-29
          - problem: 'Prove: the negation of $p \Leftrightarrow q$ equals $(\neg p \wedge q) \vee (p \wedge \neg q)$.'
            answer_contract: {"kind":"written"}
            answer: 'The statement p iff q fails exactly when p and q differ. Then one of them holds and the other fails.'
            solution_sketch: 'The statement $p \Leftrightarrow q$ is true when $p$ and $q$ have the same value. So its negation is true when they differ. They differ in two cases: $p$ true and $q$ false, or $p$ false and $q$ true. These cases are $p \wedge \neg q$ and $\neg p \wedge q$. Join them with $\vee$, as in Theorem 1.20, to get the stated form.'
        constraints: 'Negation of an implication as p and not q.'
      - id: kp4
        name: 'Example 1.32: a counterexample refutes an implication'
        key_prerequisites: [conditional-statements]
        exemplars:
          # source: FoM exercise 1.4-1-26
          - problem: 'Let $a < b$. Give each value as 1 for true and 0 for false. (a) For every function $f$ with $f(a) < 0$ and $f(b) > 0$: there is a $c$ between $a$ and $b$ with $f(c) = 0$. (b) For every continuous function $f$ with $f(a) < 0$ and $f(b) > 0$: there is a $c$ between $a$ and $b$ with $f(c) = 0$. (c) For every function $f$ with $f(a) = f(b)$: there is a $c$ between $a$ and $b$ with $f''(c) = 0$. (d) For every differentiable function $f$ with $f(a) = f(b)$: there is a $c$ between $a$ and $b$ with $f''(c) = 0$. (e) For every polynomial $p$: $\lim_{x \to \infty} p(x) = \infty$. (f) For every polynomial $p$ of degree at least 1: $\lim_{x \to \infty} |p(x)| = \infty$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}},{"name":"e","contract":{"kind":"exact"}},{"name":"f","contract":{"kind":"exact"}}]}
            answer: 'a = 0; b = 1; c = 0; d = 1; e = 0; f = 1'
            solution_sketch: 'In (a), a jump skips 0, so (a) is 0. In (b), the intermediate value theorem gives 1. In (c), a function with a corner has no such $c$, so (c) is 0. In (d), Rolle''s theorem gives 1. In (e), the polynomial $-x$ breaks the limit, so (e) is 0. In (f), a polynomial of degree at least 1 has a size that grows without bound, so (f) is 1.'
          - problem: 'Let $x$ be a whole number greater than 1. Give the smallest counterexample $x$ to each implication. (a) If $x$ is prime, then $x$ is odd. (b) If $x$ is odd, then $x$ is prime. (c) If $x$ is a multiple of 3, then $x$ is odd.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 2; b = 9; c = 6'
            solution_sketch: 'In (a), the number 2 is prime and even. In (b), the odd numbers 3, 5 and 7 are prime, but 9 is not. In (c), the number 3 is odd, but 6 is a multiple of 3 and is even.'
          - problem: 'Let $n$ be a whole number from 1 to 20. Give the number of counterexamples to each implication. (a) If $n$ is prime, then $n$ is odd. (b) If $n$ is odd, then $n$ is prime. (c) If $n$ is a multiple of 5, then $n$ is a multiple of 10.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 3; c = 2'
            solution_sketch: 'In (a), only 2 is prime and even, so the count is 1. In (b), the odd numbers that are not prime are 1, 9 and 15, so the count is 3. In (c), the multiples of 5 that are not multiples of 10 are 5 and 15.'
          - problem: 'Let $x$ be a real number. Give each value as 1 for true and 0 for false. The statement is true when it holds for every $x$. (a) If $x^2 = 4$, then $x = 2$. (b) If $x = 2$, then $x^2 = 4$. (c) If $x > 1$, then $x^2 > 1$. (d) If $x^2 > 1$, then $x > 1$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}}]}
            answer: 'a = 0; b = 1; c = 1; d = 0'
            solution_sketch: 'In (a), the value $x = -2$ is a counterexample, so the value is 0. In (b), squaring 2 gives 4, so it holds. In (c), a number above 1 has a square above 1. In (d), the value $x = -3$ has a square above 1 but is not above 1, so the value is 0.'
          - problem: 'Let $n$ be a whole number from 1 to 6. Give the number of counterexamples to each implication. (a) If $n$ is odd, then $n^2 - 1$ is divisible by 8. (b) If $n$ is even, then $n^2 - 1$ is divisible by 8. (c) If $n$ is odd, then $n^2 - 1$ is divisible by 16.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 0; b = 3; c = 2'
            solution_sketch: 'For odd $n$ in 1, 3, 5 the values of $n^2 - 1$ are 0, 8, 24, and all are divisible by 8. So (a) is 0. For even $n$ in 2, 4, 6 the values are 3, 15, 35, and none is divisible by 8. So (b) is 3. In (c), the values 8 and 24 are not divisible by 16, so (c) is 2.'
          - problem: 'Let $p$ and $q$ range over all four pairs of truth values. Give the number of pairs for which each implication has the value false. (a) $(p \wedge q) \Rightarrow p$. (b) $(p \vee q) \Rightarrow p$. (c) $p \Rightarrow \neg p$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 0; b = 1; c = 2'
            solution_sketch: 'In (a), a true $p \wedge q$ forces $p$ true, so no pair fails. In (b), the pair $p = 0$, $q = 1$ fails, so 1 pair. In (c), the implication fails when $p = 1$, for both values of $q$, so 2 pairs.'
          # source: FoM exercise 1.4-1-25
          - problem: 'Give a counterexample to each false statement. (a) Every even whole number is a multiple of 4. (b) Every continuous function is differentiable. (c) Every logical function of two variables is one of $\Rightarrow$, $\Leftrightarrow$, $\wedge$, $\vee$, $\oplus$, $\Leftarrow$.'
            answer_contract: {"kind":"written"}
            answer: 'Use 2 for (a), the absolute value function at 0 for (b), and the Sheffer stroke for (c).'
            solution_sketch: 'For (a), the number 2 is even and is not a multiple of 4. For (b), the function $|x|$ is continuous and has a corner at 0. For (c), the Sheffer stroke is false only for the pair (1, 1). The six listed functions have other value patterns. One counterexample is enough for each part.'
          # source: FoM exercise 1.4-1-30
          - problem: 'The Sheffer stroke is $p \mid q = \neg(p \wedge q)$. Prove each equality. (a) $(p \mid q) \mid (p \mid \neg q) = p$. (b) $p \mid (q \mid r) = \neg[(\neg r \mid p) \mid (\neg q \mid p)]$.'
            answer_contract: {"kind":"written"}
            answer: 'Rewrite each stroke as the negation of an and, then use De Morgan laws and double negation until both sides match.'
            solution_sketch: 'For (a), the two inner strokes are $\neg p \vee \neg q$ and $\neg p \vee q$. Their conjunction is $\neg p$, so the outer stroke gives $\neg(\neg p) = p$. For (b), the left side is $\neg p \vee (q \wedge r)$. The inner strokes on the right are $r \vee \neg p$ and $q \vee \neg p$. Their stroke is $\neg p$ and the outer negation gives the left side again.'
          # source: FoM exercise 1.4-1-31
          - problem: 'The inverse of $p \Rightarrow q$ is $\neg p \Rightarrow \neg q$. (a) Prove: the inverse and $p \Rightarrow q$ are not equivalent. (b) Prove: the inverse and the converse $q \Rightarrow p$ are equivalent.'
            answer_contract: {"kind":"written"}
            answer: 'For (a), the pair p false and q true splits the two. For (b), the inverse is the contrapositive of the converse.'
            solution_sketch: 'For (a), take $p = 0$ and $q = 1$. Then $p \Rightarrow q$ is 1 and $\neg p \Rightarrow \neg q$ is 0. For (b), the contrapositive of $q \Rightarrow p$ is $\neg p \Rightarrow \neg q$. By Theorem 1.29, they are equivalent. So the inverse equals the converse.'
          # source: FoM exercise 1.4-1-32
          - problem: 'The implication "If you do not try, then you do not win" is true. Must the implication "If you try, then you win" be true? Prove your answer.'
            answer_contract: {"kind":"written"}
            answer: 'No. The second implication is the inverse of the first, and the inverse is not equivalent to it.'
            solution_sketch: 'Let $p$ be "you do not try" and $q$ be "you do not win". The second implication is $\neg p \Rightarrow \neg q$, the inverse. Take $p = 0$ and $q = 1$: you try and you do not win. Then the first implication is true and the inverse is false. So the second implication does not follow, as in Example 1.32 one counterexample is enough.'
        constraints: 'Counterexamples; one counterexample refutes an implication.'
    diagnostic_exemplar:
      problem: 'The statement $p$ has the value 1. Give the value of $\neg(\neg p)$. Use 1 for true and 0 for false.'
      answer_contract: {"kind":"exact"}
      answer: '1'
      solution_sketch: 'A negation swaps 1 and 0. Two swaps return the first value 1. So the answer is 1.'
