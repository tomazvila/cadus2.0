    program_items: [7, 8, 9, 10, 11, 12, 13, 14]
    core: false
    difficulty: 0.35
    drill: false
    answer_kind: multi-step
    expected_time_secs: 480
    prerequisites:
      - id: fom-1-1-statements
        weight: 0.6
        key: true
      - id: propositions-and-truth-values
        weight: 0.4
        key: false
      - id: conditional-statements
        weight: 0.4
        key: false
      - id: biconditional-proofs
        weight: 0.4
        key: false
      - id: necessary-sufficient-conditions
        weight: 0.4
        key: false
    knowledge_points:
      - id: kp1
        name: 'Definitions 1.7 and 1.8 and Example 1.9: connectives and the implication'
        key_prerequisites: [fom-1-1-statements]
        exemplars:
          - problem: 'Let $p$ be the statement ''The number $6$ is even'' and let $q$ be the statement ''The number $6$ is prime''. (a) Give the truth value of $p \Rightarrow q$ as 1 or 0. (b) Give the truth value of $q \Rightarrow p$ as 1 or 0.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}}]}
            answer: 'a = 0; b = 1'
            solution_sketch: 'Here $p$ is true and $q$ is false. An implication is false only when the hypothesis is true and the conclusion is false. So $p \Rightarrow q$ has the value 0. In $q \Rightarrow p$ the hypothesis is false, so the value is 1.'
          - problem: 'Look at the implication ''If $n$ is a multiple of $9$, then $n$ is a multiple of $3$''. Take $n=18$. Give the truth value as 1 or 0 of (a) the hypothesis, (b) the conclusion, (c) the whole implication.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 1; c = 1'
            solution_sketch: 'The number $18=2\cdot 9$ is a multiple of $9$, so the hypothesis has the value 1. It is also a multiple of $3$, so the conclusion has the value 1. A true hypothesis with a true conclusion gives a true implication, so the whole implication has the value 1.'
          - problem: 'Look at the implication ''If $n$ is a multiple of $9$, then $n$ is a multiple of $3$''. Take $n=10$. Give the truth value as 1 or 0 of (a) the hypothesis, (b) the conclusion, (c) the whole implication.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 0; b = 0; c = 1'
            solution_sketch: 'The number $10$ is not a multiple of $9$, so the hypothesis has the value 0. It is not a multiple of $3$, so the conclusion has the value 0. A false hypothesis makes the implication true, so the whole implication has the value 1.'
          - problem: 'Let $p$ be the statement ''$0=1$'', let $q$ be ''$0=2$'' and let $r$ be ''$1=1$''. Give the truth value as 1 or 0 of (a) $p \Rightarrow q$, (b) $p \Rightarrow r$, (c) $r \Rightarrow p$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 1; c = 0'
            solution_sketch: 'The statement $p$ is false, so $p \Rightarrow q$ and $p \Rightarrow r$ both have the value 1. The statement $r$ is true and $p$ is false. So $r \Rightarrow p$ has the value 0.'
          - problem: 'An implication $p \Rightarrow q$ has four cases for the pair of truth values of $p$ and $q$. (a) In how many of the four cases is $p \Rightarrow q$ false? (b) In how many of the four cases is $p \Rightarrow q$ true?'
            answer_contract: {"kind":"multipart","parts":[{"name":"f","contract":{"kind":"exact"}},{"name":"t","contract":{"kind":"exact"}}]}
            answer: 'f = 1; t = 3'
            solution_sketch: 'The implication is false only for the case with $p$ true and $q$ false. That is 1 case. The other 3 cases give the value true.'
          - problem: 'The implication ''If $x>5$, then $x>3$'' has the hypothesis $x>5$. (a) Give the smallest integer $x$ for which the hypothesis is true. (b) Give the largest integer $x$ for which the conclusion is false.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}}]}
            answer: 'a = 6; b = 3'
            solution_sketch: 'The hypothesis $x>5$ holds for $x=6$ and no smaller integer. The conclusion $x>3$ is false when $x\le 3$. The largest such integer is 3.'
          - problem: 'Let $p$ and $r$ have the value 1 and let $q$ have the value 0. Give the value as 1 or 0 of (a) $p \Rightarrow q$, (b) $q \Rightarrow r$, (c) $(p \Rightarrow q) \Rightarrow r$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 0; b = 1; c = 1'
            solution_sketch: 'In (a) the hypothesis is 1 and the conclusion is 0, so the value is 0. In (b) the hypothesis is 0, so the value is 1. In (c) the compound statement $p \Rightarrow q$ has the value 0, so the whole implication has the value 1.'
        constraints: 'Evaluate implications from truth values; the items vary the statements and keep the values 1 and 0.'
      - id: kp2
        name: 'Definition 1.10 and Proposition 1.11: the equivalence and its two implications'
        key_prerequisites: [fom-1-1-statements]
        exemplars:
          - problem: 'Give the truth value of $p \Leftrightarrow q$ as 1 or 0. (a) $p$ has the value 1 and $q$ has the value 1. (b) $p$ has the value 1 and $q$ has the value 0. (c) $p$ has the value 0 and $q$ has the value 0.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 0; c = 1'
            solution_sketch: 'An equivalence is true when both sides have the same value. In (a) both values are 1, so the result is 1. In (b) the values differ, so the result is 0. In (c) both values are 0, so the result is 1.'
          - problem: 'A truth table of $p \Leftrightarrow q$ has four rows. (a) In how many rows does $p \Leftrightarrow q$ have the value 1? (b) In how many rows does $p \Rightarrow q$ have the value 1?'
            answer_contract: {"kind":"multipart","parts":[{"name":"e","contract":{"kind":"exact"}},{"name":"i","contract":{"kind":"exact"}}]}
            answer: 'e = 2; i = 3'
            solution_sketch: 'The equivalence is true for the two rows where $p$ and $q$ agree. That gives 2 rows. The implication is false only in one row, so it is true in 3 rows.'
          - problem: 'Let $p$ be ''The number $n$ is divisible by $4$'' and let $q$ be ''The number $n$ is even''. Take $n=6$. Give the truth value as 1 or 0 of (a) $p \Rightarrow q$, (b) $q \Rightarrow p$, (c) $p \Leftrightarrow q$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 0; c = 0'
            solution_sketch: 'For $n=6$, $p$ is false and $q$ is true. So $p \Rightarrow q$ has the value 1. The implication $q \Rightarrow p$ has a true hypothesis and a false conclusion, so it has the value 0. Both implications are not true, so $p \Leftrightarrow q$ has the value 0.'
          - problem: 'Let $p$ be ''The number $n$ is divisible by $6$'' and let $q$ be ''The number $n$ is divisible by $2$ and by $3$''. Take $n=14$. Give the truth value as 1 or 0 of (a) $p \Rightarrow q$, (b) $q \Rightarrow p$, (c) $p \Leftrightarrow q$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 1; c = 1'
            solution_sketch: 'The number $14$ is not divisible by $6$, so $p$ is false. It is not divisible by $3$, so $q$ is false. Both implications have a false hypothesis, so both have the value 1. Both implications are true, so $p \Leftrightarrow q$ has the value 1.'
          - problem: 'Suppose that $p \Rightarrow q$ has the value 0. Give the value as 1 or 0 of (a) $p$, (b) $q$, (c) $p \Leftrightarrow q$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 0; c = 0'
            solution_sketch: 'An implication has the value 0 only when the hypothesis is true and the conclusion is false. So $p$ has the value 1 and $q$ has the value 0. The two sides differ, so $p \Leftrightarrow q$ has the value 0.'
          - problem: 'Look at the sentence ''$x^2=4$ if and only if $x=2$''. (a) Give the integer $x$ for which this sentence has the value 0. (b) Give the value of the sentence for $x=2$ as 1 or 0.'
            answer_contract: {"kind":"multipart","parts":[{"name":"x","contract":{"kind":"exact"}},{"name":"v","contract":{"kind":"exact"}}]}
            answer: 'x = -2; v = 1'
            solution_sketch: 'The sentence is false when exactly one side is true. For $x=-2$ the left side is true, since $(-2)^2=4$, and the right side is false. For every other integer both sides are false or both are true. So the answer to (a) is $x=-2$. For $x=2$ both sides are true, so the value in (b) is 1.'
          # source: FoM exercise 1.2-1-4
          - problem: 'Give the truth value as 1 for true and 0 for false. (a) $2+3=5$ if and only if $4+4=8$. (b) $2+3=5$ if and only if $4+4=9$. (c) $2+3=6$ if and only if $4+4=8$. (d) $2+3=6$ if and only if $4+4=9$. (e) If $2+3=5$, then $4+4=8$. (f) If $2+3=5$, then $4+4=9$. (g) If $2+3=6$, then $4+4=8$. (h) If $2+3=6$, then $4+4=9$. (i) If $9$ is a prime number, then $9$ is even. (j) If $9$ is odd, then $9$ is a prime number.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}},{"name":"e","contract":{"kind":"exact"}},{"name":"f","contract":{"kind":"exact"}},{"name":"g","contract":{"kind":"exact"}},{"name":"h","contract":{"kind":"exact"}},{"name":"i","contract":{"kind":"exact"}},{"name":"j","contract":{"kind":"exact"}}]}
            answer: 'a=1;b=0;c=0;d=1;e=1;f=0;g=1;h=1;i=1;j=0'
            solution_sketch: 'An equivalence has the value 1 when both sides agree. So (a) and (d) have 1, and (b) and (c) have 0. An implication has the value 0 only for a true hypothesis and a false conclusion. That gives 0 for (f) and (j) and 1 for (e), (g), (h) and (i). In (i) the hypothesis is false, because $9=3\cdot 3$.'
          # argument: Proposition 1.11
          - problem: 'Prove: for statements $p$ and $q$, the equivalence $p \Leftrightarrow q$ is true exactly when both implications $p \Rightarrow q$ and $q \Rightarrow p$ are true.'
            answer_contract: {"kind":"written"}
            answer: 'Both implications are true exactly when p and q have the same value. That is the case in which the equivalence is true.'
            solution_sketch: 'Use Definition 1.8 for the implication and Definition 1.10 for the equivalence. First assume p and q have the same value. Then both implications are true, because an implication is false only for a true hypothesis and a false conclusion. Now assume both implications are true. If p is true, then p implies q forces q to be true. If p is false, then a true q makes q implies p false, so q is false.'
        constraints: 'Evaluate equivalences and compare them with the two implications; the items vary the statements.'
      - id: kp3
        name: 'Definition 1.12 and Examples 1.13 and 1.15: the converse of an implication'
        key_prerequisites: [fom-1-1-statements]
        exemplars:
          - problem: 'The converse of $p \Rightarrow q$ is $q \Rightarrow p$. Let $p$ have the value 1 and let $q$ have the value 0. Give the value as 1 or 0 of (a) $p \Rightarrow q$, (b) the converse of $p \Rightarrow q$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}}]}
            answer: 'a = 0; b = 1'
            solution_sketch: 'The implication $p \Rightarrow q$ has a true hypothesis and a false conclusion, so it has the value 0. The converse $q \Rightarrow p$ has a false hypothesis, so it has the value 1.'
          - problem: 'Look at the four cases for the pair of truth values of $p$ and $q$. (a) In how many cases do $p \Rightarrow q$ and its converse have different values? (b) In how many cases do both have the value 0?'
            answer_contract: {"kind":"multipart","parts":[{"name":"d","contract":{"kind":"exact"}},{"name":"z","contract":{"kind":"exact"}}]}
            answer: 'd = 2; z = 0'
            solution_sketch: 'The pair $(1,0)$ gives the values 0 and 1. The pair $(0,1)$ gives the values 1 and 0. These are the 2 cases with different values. In the pairs $(1,1)$ and $(0,0)$ both have the value 1, so no case gives 0 for both.'
          - problem: 'Look at the implication ''If $n$ is divisible by $10$, then $n$ is divisible by $5$''. Give (a) the value as 1 or 0 of the implication for $n=15$, (b) the value as 1 or 0 of its converse for $n=15$, (c) the smallest positive integer $n$ for which the converse has the value 0.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 0; c = 5'
            solution_sketch: 'For $n=15$ the hypothesis of the implication is false, so the implication has the value 1. The converse reads ''If $n$ is divisible by $5$, then $n$ is divisible by $10$''. For $n=15$ the hypothesis is true and the conclusion is false, so the value is 0. The smallest positive $n$ with the same property is 5.'
          - problem: 'A right triangle has legs $a$ and $b$ and hypotenuse $c$, and then $a^2+b^2=c^2$. (a) Find $c$ for $a=6$ and $b=8$. (b) Find $a^2+b^2-c^2$ for a triangle with sides $7$, $24$ and $25$. (c) Find $a^2+b^2-c^2$ for a triangle with sides $4$, $5$ and $6$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 10; b = 0; c = 5'
            solution_sketch: 'In (a), $c^2=36+64=100$, so $c=10$. In (b), $49+576=625=25^2$, so the difference is 0. In (c), $16+25-36=5$.'
          - problem: 'Look at the implication ''If $x^2=4$, then $x=2$''. (a) Give the integer $x$ for which the implication has the value 0. (b) Give the number of real numbers $x$ for which the implication has the value 0.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}}]}
            answer: 'a = -2; b = 1'
            solution_sketch: 'The implication is false when $x^2=4$ and $x\ne 2$. That holds for $x=-2$. No other real number works, so there is 1 such number.'
          - problem: 'Look at the implication ''If $x=-3$, then $x^2=9$''. Give the value as 1 or 0 of (a) the implication for $x=-3$, (b) its converse for $x=-3$, (c) its converse for $x=3$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 1; c = 0'
            solution_sketch: 'For $x=-3$ the hypothesis and the conclusion of the implication are both true, so (a) is 1. The converse reads ''If $x^2=9$, then $x=-3$''. For $x=-3$ both parts are true, so (b) is 1. For $x=3$ the hypothesis $x^2=9$ is true and the conclusion $x=-3$ is false, so (c) is 0.'
          # source: FoM exercise 1.2-1-5
          - problem: 'For each statement below, write its converse. Then decide whether the statement is true and whether its converse is true. (a) For an integer $n$: if $n$ is divisible by $4$, then $n$ is even. (b) For an integer $n$: if $n$ is divisible by $6$, then $n$ is divisible by $2$ and by $3$. (c) For a real number $x$: if $x>2$, then $x^2>4$. (d) For a real number $x$: if $x^2=9$, then $x=3$. (e) For a natural number $n$: if $n$ is prime, then $n$ is odd. (f) If a triangle is equilateral, then it is isosceles. (g) For a function $f$: if $f$ is differentiable, then $f$ is continuous. (h) If a quadrilateral has four equal angles, then it is a rectangle. (i) For a natural number $n$: if $n$ is divisible by $4$ and by $6$, then $n$ is divisible by $24$. (j) For real numbers $a$ and $b$: if $a=b$, then $a^2=b^2$.'
            answer_contract: {"kind":"written"}
            answer: 'Swap the hypothesis and the conclusion. Then test each direction with one example or a short argument.'
            solution_sketch: 'Write the converse of each part by swapping hypothesis and conclusion. In (a), 6 is even and not divisible by 4, so the converse is false. In (b), both directions hold. In (d), x=-3 breaks the statement, and x=3 gives the converse. In (e), the number 2 breaks the statement and 9 breaks the converse. In (i), n=12 breaks the statement and the converse holds.'
          # source: FoM exercise 1.2-1-6
          - problem: 'Rewrite each sentence as an implication of the form ''if $p$, then $q$''. (a) The angles of a triangle add up to $180^\circ$. (b) Every horizontal line has slope $0$. (c) A cat is a mammal. (d) A multiple of $6$ is a multiple of $3$.'
            answer_contract: {"kind":"written"}
            answer: 'Put the condition on the object in the hypothesis and the property in the conclusion. Example: if a number is a multiple of 6, then it is a multiple of 3.'
            solution_sketch: 'Name the hypothesis first. It is the condition on the object. Then name the conclusion. It is the property of the object. Use the form of Definition 1.8. For (b) the hypothesis is that a line is horizontal.'
        constraints: 'Compare an implication with its converse; the items vary the statements and keep the form ''if p, then q''.'
    diagnostic_exemplar:
