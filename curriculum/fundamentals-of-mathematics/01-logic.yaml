          # source: FoM exercise 1.6-1-50
          - problem: 'Each statement below is false. Name one counterexample for each. (a) Every odd number is prime. (b) Every odd number with no prime factor up to $19$ is prime. (c) Every continuous function has a derivative everywhere. (d) The square root of an integer is always a rational number. (e) Every mammal has feet. (f) Every bird flies. (g) Every integrable function is continuous.'
