    knowledge_points:
      - id: kp1
        name: 'Example 1.77, Example 1.79 and Example 1.81: valid and invalid arguments from implications and examples'
        key_prerequisites: [fom-1-6-proofs]
        exemplars:
          - problem: 'A flock has 5 sheep. One sheep is black. Give 1 if the fact is enough to settle the statement as true and 0 if it is not enough. (a) Some sheep in the flock are black. (b) Every sheep in the flock is black.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 0'
            solution_sketch: 'One black sheep is a witness, so statement (a) is settled and gets 1. The other 4 sheep have unknown colors. One example does not settle a statement about every sheep, so (b) gets 0.'
          - problem: 'Rain makes the road wet: the premise is $R \Rightarrow W$. Give 1 for a valid argument and 0 for an invalid argument. (a) Premises $R \Rightarrow W$ and $R$. Conclusion $W$. (b) Premises $R \Rightarrow W$ and $W$. Conclusion $R$. (c) Premises $R \Rightarrow W$ and $\lnot W$. Conclusion $\lnot R$. (d) Premises $R \Rightarrow W$ and $\lnot R$. Conclusion $\lnot W$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 0; c = 1; d = 0'
            solution_sketch: 'Form (a) is modus ponens, so it gets 1. Form (c) is modus tollens, so it gets 1. In (b) the road is wet with no rain in some case, so it gets 0. In (d) the same case works, so it also gets 0.'
          - problem: 'Take the premises $h$, $(h \land t) \Rightarrow p$ and $p \Rightarrow g$, and the conclusion $g$. Let $h=1$, $t=0$, $p=0$ and $g=0$, with 1 for true and 0 for false. Give the truth value of each statement as 1 or 0. (a) $h$. (b) $(h \land t) \Rightarrow p$. (c) $p \Rightarrow g$. (d) $g$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 1; c = 1; d = 0'
            solution_sketch: 'Statement (a) has the value 1. Here $h \land t$ is 0, so the implication in (b) has the value 1. In (c) the first part $p$ is 0, so the value is 1. The conclusion in (d) has the value 0. All premises are 1 and the conclusion is 0, so the argument is invalid.'
          - problem: 'Let $h=1$ and $t=1$, with 1 for true and 0 for false. Assume that $(h \land t) \Rightarrow p$ and $p \Rightarrow g$ both have the value 1. Give the value of each statement as 1 or 0. (a) $h \land t$. (b) $p$. (c) $g$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 1; c = 1'
            solution_sketch: 'Both $h$ and $t$ are 1, so $h \land t$ is 1 and (a) is 1. The first implication has a true first part and is true, so $p$ is 1. The second implication has a true first part and is true, so $g$ is 1.'
          - problem: 'Look at the argument with premises $p \Rightarrow q$ and $q$, and conclusion $p$. A case is a choice of values for $p$ and $q$. There are 4 cases. (a) Count the cases where both premises are true. (b) Count the cases where both premises are true and the conclusion is false. (c) Give 1 if the argument is valid and 0 if it is invalid.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 2; b = 1; c = 0'
            solution_sketch: 'Both premises hold when $q$ is 1, so the cases are $p=0, q=1$ and $p=1, q=1$. That makes 2 cases for (a). In the case $p=0, q=1$ the conclusion is false, so (b) is 1. One such case exists, so the argument is invalid and (c) is 0.'
          - problem: 'Take the premises $h$, $(h \land t) \Rightarrow p$ and $p \Rightarrow g$. A case is a choice of values for $h$, $t$, $p$ and $g$. There are 16 cases. (a) Count the cases where all three premises are true. (b) Count those cases where $g$ is false.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}}]}
            answer: 'a = 4; b = 1'
            solution_sketch: 'Premise $h$ forces $h=1$. Then $t \Rightarrow p$ and $p \Rightarrow g$ must hold for $(t,p,g)$. Only $(0,0,0)$, $(0,0,1)$, $(0,1,1)$ and $(1,1,1)$ work, so (a) is 4. Only $(0,0,0)$ has $g=0$, so (b) is 1.'
          # source: FoM exercise 1.7-1-60
          - problem: 'Decide whether each argument is valid. Give 1 for a valid argument and 0 for an invalid argument. An argument is valid when its conclusion is true in every case where all its premises are true. (a) If I read the notes (N) and solve the sample problems (S), I pass the quiz (Q). If I sleep early (E), I read the notes. I slept early and I solved the sample problems. Therefore I pass the quiz. (b) If the bridge is unsafe (U) or too narrow (W), the city closes it (C). The bridge is not unsafe and not too narrow. Therefore the city does not close it. (c) If a box is made of oak (O), it is heavy (H). A box is cheap (C) or it is not heavy. This box is not cheap. Therefore this box is not made of oak. (d) Every sport that builds strength is useful. Swimming builds strength. Rowing uses water. Therefore rowing is useful. (e) If Lee wins the vote (W), the park stays open (P). If we back Lee (B), Lee wins the vote. We back Lee. Therefore the park stays open. (f) If Lee wins the vote, the park stays open. If we do not back Lee, Lee does not win the vote. We back Lee. Therefore the park stays open.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}},{"name":"e","contract":{"kind":"exact"}},{"name":"f","contract":{"kind":"exact"}}]}
            answer: 'a=1;b=0;c=1;d=0;e=1;f=0'
            solution_sketch: 'In (a), $E$ gives $N$, then $N$ and $S$ give $Q$, so the value is 1. In (b) the premise has the form $(U \lor W) \Rightarrow C$ with a false first part, and $C$ stays open, so the value is 0. In (c), not cheap gives not heavy, and then not oak, so the value is 1. In (d) the facts about rowing do not link to strength, so the value is 0. In (e) the chain $B$, $W$, $P$ holds, so the value is 1. In (f), the park stays open only if Lee wins, and we do not know that, so the value is 0.'
          # source: FoM exercise 1.7-1-61
          - problem: 'Decide whether each argument form is valid. Give 1 for a valid form and 0 for an invalid form. The premises come first and the conclusion follows the symbol $\therefore$. (a) $q,\ (q \lor r) \Rightarrow s \ \therefore\ q$. (b) $p,\ (p \land q) \Rightarrow r \ \therefore\ r$. (c) $p \Rightarrow q,\ q \Rightarrow r,\ r \Rightarrow p \ \therefore\ p$. (d) $p,\ p \Rightarrow q,\ (q \lor r) \Rightarrow s \ \therefore\ s$. (e) $q,\ p \Rightarrow q,\ (q \lor r) \Rightarrow s \ \therefore\ s$. (f) $q,\ p \Rightarrow q,\ p \Rightarrow r \ \therefore\ r$. (g) $p \lor q,\ q \Rightarrow (r \land \lnot r) \ \therefore\ p$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}},{"name":"e","contract":{"kind":"exact"}},{"name":"f","contract":{"kind":"exact"}},{"name":"g","contract":{"kind":"exact"}}]}
            answer: 'a=1;b=0;c=0;d=1;e=1;f=0;g=1'
            solution_sketch: 'In (a) the conclusion is a premise, so the value is 1. In (b) take $p=1$, $q=0$, $r=0$: the premises hold and $r$ fails, so 0. In (c) take $p=q=r=0$: the premises hold and $p$ fails, so 0. In (d) the chain $p$, $q$, $q \lor r$, $s$ gives 1, and in (e) $q$ gives $q \lor r$ and then $s$, so 1. In (f) take $p=0$, $q=1$, $r=0$: the premises hold and $r$ fails, so 0. In (g) the premise $q \Rightarrow (r \land \lnot r)$ forces $q=0$, so $p$ holds and the value is 1.'
          # source: FoM exercise 1.7-1-63
          - problem: 'Prove: the statement $\big[((h \land t) \Rightarrow p) \land (p \Rightarrow g) \land h \land t\big] \Rightarrow g$ is a tautology.'
            answer_contract: {"kind":"written"}
            answer: 'Assume all four parts of the premise are true. Then h and t give p, and p gives g.'
            solution_sketch: 'Use the chain of Example 1.79. Assume the whole premise is true, so $h$, $t$, $(h \land t) \Rightarrow p$ and $p \Rightarrow g$ are all true. From $h$ and $t$ follows $h \land t$. Modus ponens with $(h \land t) \Rightarrow p$ gives $p$. Modus ponens with $p \Rightarrow g$ gives $g$. So the implication is never false, and the statement is a tautology.'
        constraints: 'propositional argument forms and proof by example; no quantifiers'
      - id: kp2
        name: 'Example 1.82: valid and invalid arguments with quantifiers'
        key_prerequisites: [fom-1-5-variables-quantifiers]
        exemplars:
          - problem: 'Give 1 if one example is enough to settle the statement as true and 0 if it is not enough, for the first two parts. (a) Some integer $n$ has $n^2 = 49$. (b) Every integer $n$ has $n^2 > 0$. (c) Give one prime number that is a counterexample to the statement that every prime number is odd.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 0; c = 2'
            solution_sketch: 'One example settles a statement with some. So $n=7$ settles (a) and the value is 1. One example does not settle a statement about every integer, so (b) is 0. The only even prime is 2, so (c) is 2.'
          - problem: 'Suppose that every $A$ is a $B$, and that some $C$ is an $A$. Give 1 if the statement follows from these two facts and 0 if it does not follow. (a) Some $C$ is a $B$. (b) Every $C$ is a $B$. (c) Every $B$ is an $A$. (d) Some $A$ is a $C$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 0; c = 0; d = 1'
            solution_sketch: 'A $C$ that is an $A$ is also a $B$, so (a) is 1. Some $C$ objects are outside $A$ in some case, so (b) is 0. Some $B$ objects are outside $A$ in some case, so (c) is 0. The same object is a $C$ and an $A$, so (d) is 1.'
          - problem: 'Let $A=\{1,2,3,4\}$, $B=\{2,4,6\}$ and $C=\{2,4,6,8\}$. Give 1 for a true statement and 0 for a false statement in the first two parts. (a) Every element of $B$ is an element of $C$. (b) Some element of $A$ is an element of $B$. (c) Count the elements of $A$ that are elements of $C$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 1; c = 2'
            solution_sketch: 'Each of 2, 4 and 6 lies in $C$, so (a) is 1. The number 2 lies in both $A$ and $B$, so (b) is 1. The elements of $A$ in $C$ are 2 and 4, so (c) is 2.'
          - problem: 'A universe holds 10 objects. Exactly 4 of them are dogs. Every dog is a quadruped. Exactly 6 objects are quadrupeds. Exactly 3 dogs are pets. (a) Give the least possible number of pets that are quadrupeds. (b) Give the number of quadrupeds that are not dogs. (c) Give 1 if some pet is a quadruped for sure, and 0 if not.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 3; b = 2; c = 1'
            solution_sketch: 'The 3 pet dogs are quadrupeds, so at least 3 pets are quadrupeds and (a) is 3. There are 6 quadrupeds and 4 of them are dogs, so (b) is 2. Since 3 is more than 0, some pet is a quadruped in every case, so (c) is 1.'
          - problem: 'Every multiple of 6 is a multiple of 3. Let $S=\{9, 12, 15, 18\}$. (a) Count the elements of $S$ that are multiples of 3. (b) Count the elements of $S$ that are multiples of 6. (c) Count the elements of $S$ that are multiples of 3 and not multiples of 6.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 4; b = 2; c = 2'
            solution_sketch: 'Each of 9, 12, 15 and 18 is a multiple of 3, so (a) is 4. Only 12 and 18 are multiples of 6, so (b) is 2. The elements 9 and 15 are multiples of 3 and not of 6, so (c) is 2.'
          # source: FoM exercise 1.7-1-62
          - problem: 'Each argument uses quantified statements. Give 1 for a valid argument and 0 for an invalid argument. An argument is valid when its conclusion is true in every case where all its premises are true. (a) Some chefs are tall. Some tall people are singers. Therefore some chefs are singers. (b) All red boxes are heavy. All heavy boxes are in room 5. Therefore all boxes in room 5 are red. (c) Items over 20 pounds are heavy. A sack weighs 40 pounds. Therefore the sack is heavy. (d) Some of my books are novels. Dune is one of my books. Therefore Dune is a novel. (e) All cats are mammals. Some pets are cats. Therefore some pets are mammals.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}},{"name":"e","contract":{"kind":"exact"}}]}
            answer: 'a=0;b=0;c=1;d=0;e=1'
            solution_sketch: 'In (a) the tall chefs and the tall singers are different people in some case, so the value is 0. In (b) the chain only gives red boxes in room 5, not the reverse, so the value is 0. In (c) the rule applies to the weight 40, so the value is 1. In (d) Dune is a book that is not a novel in some case, so the value is 0. In (e) a pet that is a cat is also a mammal, so the value is 1.'
        constraints: 'one-step arguments with all and some; small sets and counts'
