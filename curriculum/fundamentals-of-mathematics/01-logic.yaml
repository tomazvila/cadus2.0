            answer: 'a = 1; b = 2; c = 1'
            solution_sketch: 'If k is at least 2, then 2k has the factors 2 and k, so it is not prime. So k=1 and x=2. The number 2 is the only even prime, so (b) is 2 and (c) is 1.'
          # argument: Theorem 1.62
          - problem: 'Prove: for statements $p$ and $q$, the statement $(p\Leftrightarrow q)\Leftrightarrow((p\Rightarrow q)\wedge(q\Rightarrow p))$ is a tautology.'
            answer_contract: {"kind":"written"}
            answer: 'Both sides have the value 1 exactly when p and q have the same value. So the two sides agree in every row.'
            solution_sketch: 'Look at the four rows for p and q. If p and q agree, both implications are true and the equivalence is true. If p=1 and q=0, then p implies q is false, so both sides are false. If p=0 and q=1, then q implies p is false, so both sides are false. Both sides have the same value in every row.'
          # argument: Theorem 1.65
          - problem: 'Prove: for statements $p$ and $q$, the statement $(p\Rightarrow q)\Leftrightarrow(\neg q\Rightarrow\neg p)$ is a tautology.'
            answer_contract: {"kind":"written"}
            answer: 'Both implications are false in exactly one row, the row with p true and q false. In all other rows both are true.'
            solution_sketch: 'The implication p implies q is false only for p=1 and q=0. The implication not q implies not p is false only when not q is 1 and not p is 0. That means q=0 and p=1, the same row. So both sides agree in every row, and the equivalence is a tautology.'
          # source: FoM exercise 1.6-1-45
          - problem: 'Prove the statement $(p\Leftrightarrow q)\Leftrightarrow((p\Rightarrow q)\wedge(q\Rightarrow p))$ in three ways. (a) Reason in words. (b) Use algebra with $x\Rightarrow y$ equal to $\neg x\vee y$ and $p\Leftrightarrow q$ equal to $(p\wedge q)\vee(\neg p\wedge\neg q)$. (c) Build a truth table.'
            answer_contract: {"kind":"written"}
            answer: 'Both sides are true exactly when p and q agree. Algebra expands the and-statement of the two implications, and a four-row truth table agrees.'
            solution_sketch: 'State Theorem 1.62 first. In words, split into the rows where p and q agree and the rows where they differ. For algebra, expand (not p or q) and (not q or p) with the distributive law. The result is (p and q) or (not p and not q). A truth table with four rows shows the value 1 for the equivalence in each row.'
          # source: FoM exercise 1.6-1-46
          - problem: 'Prove the statement $(p\Rightarrow q)\Leftrightarrow(\neg q\Rightarrow\neg p)$ in three ways. (a) Reason in words. (b) Use algebra. (c) Build a truth table.'
            answer_contract: {"kind":"written"}
            answer: 'Both implications fail only in the row with p true and q false. Algebra turns not q implies not p into q or not p, and a truth table agrees.'
            solution_sketch: 'State Theorem 1.65 first. In words, locate the one row where each implication fails. For algebra, write not q implies not p as not (not q) or not p, which is q or not p. That equals not p or q, the form of p implies q. A truth table with four rows shows the value 1 in each row.'
          # source: FoM exercise 1.6-1-47
          - problem: 'Take a proof of the contrapositive $\neg q\Rightarrow\neg p$. State how the same argument proves $p\Rightarrow q$ by contradiction.'
            answer_contract: {"kind":"written"}
            answer: 'Assume p and not q. The argument for the contrapositive starts from not q and reaches not p, which contradicts p.'
            solution_sketch: 'Use Theorem 1.65 to treat both implications as the same. Assume p is true and q is false. The argument for the contrapositive starts from not q. It ends with not p, which contradicts the assumption that p is true. So the assumption fails, and p implies q holds.'
        constraints: 'Compare an implication with its contrapositive and an equivalence with its two implications; the items vary the statements.'
