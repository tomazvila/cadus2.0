topics:
  - id: fom-1-1-statements
    name: '1.1 Statements'
    program_items: [1, 2, 3, 4, 5, 6]
    core: true
    difficulty: 0.3
    drill: false
    answer_kind: multi-step
    expected_time_secs: 420
    prerequisites:
      - id: propositions-and-truth-values
        weight: 0.6
        key: true
      - id: predicates-and-domains
        weight: 0.4
        key: false
    knowledge_points:
      - id: kp1
        name: 'Definition 1.1 and Examples 1.2 and 1.3: a statement has a truth value'
        key_prerequisites: [propositions-and-truth-values]
        exemplars:
          - problem: 'Sort each sentence. Give 1 for a statement and 0 for a sentence that is not a statement. (a) The number $17$ is prime. (b) Is $17$ prime? (c) Add $17$ and $5$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 0; c = 0'
            solution_sketch: 'A statement is a sentence with a truth value. Sentence (a) is true, so it is a statement and gets 1. Sentence (b) is a question and sentence (c) is a command. Neither has a truth value, so both get 0.'
          - problem: 'Give each truth value as 1 for a true statement and 0 for a false statement. (a) $3+4=8$. (b) $3\cdot 4=12$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}}]}
            answer: 'a = 0; b = 1'
            solution_sketch: 'Compute both sides. In (a) the sum is $7$, not $8$, so the value is 0. In (b) the product is $12$, so the value is 1.'
          - problem: 'A sentence is a statement when it has a truth value. For each sentence, give 1 if it is a statement and 0 if it is not. (a) Open the window. (b) $12$ is divisible by $5$. (c) What is $12$ divided by $5$?'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 0; b = 1; c = 0'
            solution_sketch: 'Sentence (b) is false, but it has a truth value, so it gets 1. Sentence (a) is a command and sentence (c) is a question. Both get 0.'
          # source: FoM exercise 1.1-1-2
          - problem: 'Give each truth value as 1 for true and 0 for false. (a) $5<9$. (b) Every complex number has a positive square. (c) Every real number has a positive square. (d) For all natural numbers $k$, one of $k$, $k+2$ and $k+4$ is divisible by $3$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 0; c = 0; d = 1'
            solution_sketch: 'Statement (a) is true, so it gets 1. For (b), $i^2=-1$ is not positive, so the value is 0. For (c), $0^2=0$ is not positive, so the value is 0. For (d), the numbers $k$, $k+2$ and $k+4$ have the three different remainders $0$, $1$ and $2$ modulo $3$, so one of them is divisible by $3$ and the value is 1.'
          - problem: 'Take the sentence ''This sentence has exactly four words.'' (a) Count the words of the sentence. (b) Give the truth value of the sentence as 1 for true and 0 for false.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}}]}
            answer: 'a = 6; b = 0'
            solution_sketch: 'Count the words: This, sentence, has, exactly, four, words. The sentence has 6 words. The sentence names the number 4, so it is false and the value is 0.'
          # source: FoM exercise 1.1-1-1
          - problem: 'Read the twelve sentences below. (a) Count the sentences that are statements. (b) Count the true statements. (c) Count the false statements. A sentence with no truth value is not a statement. Sentences: (1) The year 2008 had 366 days. (2) The number 91 is a prime number. (3) Finish your homework. (4) This sentence has exactly six words. (5) Is 51 a prime number? (6) The sum of two odd numbers is odd. (7) The number $2^{10}$ equals 1024. (8) Every triangle has four sides. (9) This sentence is a false statement. (10) Wow! (11) The number 3 is the only prime number $p$ such that $p$, $p+2$ and $p+4$ are all prime. (12) Close the door.'
            answer_contract: {"kind":"multipart","parts":[{"name":"s","contract":{"kind":"exact"}},{"name":"t","contract":{"kind":"exact"}},{"name":"f","contract":{"kind":"exact"}}]}
            answer: 's = 7; t = 4; f = 3'
            solution_sketch: 'A statement has a truth value. Sentences 3, 5, 10 and 12 are a command, a question and an exclamation, so they are not statements. Sentence 9 cannot be true and cannot be false, so it is not a statement. That leaves 7 statements. The true ones are 1, 4, 7 and 11, which makes 4. The false ones are 2, 6 and 8, which makes 3.'
        constraints: 'Sort sentences into true statements, false statements and non-statements; the items vary the sentences and keep the values 1 and 0 fixed.'
      - id: kp2
        name: 'Example 1.4, Example 1.5 and Example 1.6: sentences without a truth value and statements with an unknown value'
        key_prerequisites: [predicates-and-domains]
        exemplars:
          - problem: 'The sentence ''$x+2=5$'' has no truth value until $x$ gets a value. (a) Give the truth value of the sentence for $x=3$ as 1 or 0. (b) Give the truth value of the sentence for $x=4$ as 1 or 0.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 0'
            solution_sketch: 'Put $x=3$ in the sentence. It becomes $3+2=5$, so the value is 1. Put $x=4$ in the sentence. It becomes $4+2=5$, which is wrong, so the value is 0.'
          - problem: 'A command such as ''Close the window.'' is not a statement. Give 1 for a statement and 0 for a sentence that is not a statement. (a) Close the window. (b) $2^5=32$. (c) Which number is larger, $2^5$ or $5^2$?'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 0; b = 1; c = 0'
            solution_sketch: 'Sentence (a) is a command, so it gets 0. Sentence (b) is true because $2^5=32$, so it gets 1. Sentence (c) is a question, so it gets 0.'
          - problem: 'The sequence of symbols $a^2+b^2=c^2$ is a statement only after $a$, $b$ and $c$ get values. Give the truth value as 1 or 0. (a) $a=3$, $b=4$, $c=5$. (b) $a=2$, $b=3$, $c=4$. (c) $a=5$, $b=12$, $c=13$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 0; c = 1'
            solution_sketch: 'In (a), $9+16=25$, so the value is 1. In (b), $4+9=13$ and $c^2=16$, so the value is 0. In (c), $25+144=169=13^2$, so the value is 1.'
          - problem: 'A twin prime pair is a pair of primes that differ by $2$. (a) Count the twin prime pairs with both primes below $20$. (b) Give the larger prime of the last such pair.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}}]}
            answer: 'a = 4; b = 19'
            solution_sketch: 'The pairs are $(3,5)$, $(5,7)$, $(11,13)$ and $(17,19)$. That gives 4 pairs. The last pair has the larger prime 19.'
          - problem: 'A statement has a truth value, even if nobody knows that value. For each sentence, give 1 if it is a statement and 0 if it is not. (a) Every even number greater than $2$ is the sum of two primes. (b) Add two primes. (c) $n$ is the sum of two primes. (d) $10$ is the sum of two primes.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 0; c = 0; d = 1'
            solution_sketch: 'Sentence (a) is a statement, even when nobody knows its truth value. Sentence (b) is a command, so it gets 0. Sentence (c) holds the free letter $n$, so it gets 0. Sentence (d) is true because $10=3+7$, so it gets 1.'
          # source: FoM exercise 1.1-1-3
          - problem: 'Give each truth value as 1 for a true statement and 0 for a false statement. (a) Every integrable function has an antiderivative. (b) Every differentiable function is continuous. (c) The alternating harmonic series $\sum (-1)^{n+1}/n$ diverges. (d) The harmonic series $\sum 1/n$ diverges. (e) Every continuous function is differentiable.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}},{"name":"e","contract":{"kind":"exact"}}]}
            answer: 'a=0;b=1;c=0;d=1;e=0'
            solution_sketch: 'A step function is integrable and has no antiderivative, so (a) is 0. Differentiable functions are continuous, so (b) is 1. The alternating harmonic series converges, so (c) is 0. The harmonic series diverges, so (d) is 1. The function $|x|$ is continuous and has no derivative at $0$, so (e) is 0.'
        constraints: 'Open sentences get a value from a substitution; commands and questions never get one; the items vary the sentences.'
    diagnostic_exemplar:
      problem: 'Give 1 if the sentence ''Add $7$ and $2$.'' is a statement and 0 if it is not.'
      answer_contract: {"kind":"exact"}
      answer: '0'
      solution_sketch: 'The sentence is a command. A command has no truth value, so the answer is 0.'
  - id: fom-1-2-implications
