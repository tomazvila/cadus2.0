      - id: kp1
        name: 'Definition 1.33, Definition 1.34, Example 1.35 and Example 1.36: open sentences and the two quantifiers'
        key_prerequisites: [predicates-and-domains, universal-existential-statements]
        exemplars:
          # source: FoM exercise 1.5-1-33
          - problem: 'Prove both facts for an open sentence $p(x)$ and a set $S$. (a) The statement $\exists x\in S: p(x)$ is true exactly when $\neg[\forall x\in S: \neg p(x)]$ is true. (b) The statement $\forall x\in S: p(x)$ is true exactly when $\neg[\exists x\in S: \neg p(x)]$ is true.'
            answer_contract: {"kind":"written"}
            answer: 'A statement and its negation have opposite truth values. Apply the definition of each quantifier to the inner statement.'
            solution_sketch: 'Use Definition 1.34 for both quantifiers. For (a), the statement $\forall x\in S: \neg p(x)$ is true exactly when $\neg p(x)$ holds for every $x$ in $S$. So its negation is true exactly when some $x$ in $S$ has $p(x)$ true. That is the meaning of $\exists x\in S: p(x)$. For (b), the same steps work with the two quantifiers swapped.'
          - problem: 'Let $p(x)$ be the open sentence $x+3>7$. Replace $x$ by a number and give the truth value of the new statement as 1 for true and 0 for false. (a) $x=4$. (b) $x=5$. (c) $x=1$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 0; b = 1; c = 0'
            solution_sketch: 'Replace $x$ in each case. For $x=4$ the statement is $7>7$, so the value is 0. For $x=5$ the statement is $8>7$, so the value is 1. For $x=1$ the statement is $4>7$, so the value is 0.'
          - problem: 'Let $S=\{1,2,3,4\}$ and let $p(x)$ be the open sentence $x^2<10$. (a) Give the truth value of $\forall x\in S: p(x)$ as 1 for true and 0 for false. (b) Give the truth value of $\exists x\in S: p(x)$ as 1 for true and 0 for false. (c) Count the elements $x$ of $S$ for which $p(x)$ is true.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 0; b = 1; c = 3'
            solution_sketch: 'The squares of 1, 2, 3 and 4 are 1, 4, 9 and 16. The values 1, 4 and 9 are below 10, so $p(x)$ holds for 3 elements and (c) is 3. Since $p(4)$ is false, the universal statement has the value 0. Since $p(1)$ is true, the existential statement has the value 1.'
          - problem: 'Let $S=\{-2,-1,0,1,2\}$ and let $p(x)$ be the open sentence ''$x+1$ is even''. (a) Give the truth value of $\forall x\in S: p(x)$ as 1 for true and 0 for false. (b) Give the truth value of $\exists x\in S: p(x)$ as 1 for true and 0 for false. (c) Give the least element of $S$ for which $p(x)$ is true.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 0; b = 1; c = -1'
            solution_sketch: 'The sentence $x+1$ is even holds for $x=-1$ and $x=1$. It fails for $-2$, $0$ and $2$, so the universal statement has the value 0. One element works, so the existential statement has the value 1. The least working element is -1.'
          - problem: 'The sentence $x\cdot y=12$ has two variables. (a) Count the variables. (b) Replace $x$ by $3$ and $y$ by $4$. Give the truth value of the new statement as 1 for true and 0 for false. (c) Replace $x$ by $5$ and $y$ by $2$. Give the truth value of the new statement as 1 for true and 0 for false.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 2; b = 1; c = 0'
            solution_sketch: 'The sentence has the two variables $x$ and $y$, so (a) is 2. For $x=3$ and $y=4$ the product is 12, so the value is 1. For $x=5$ and $y=2$ the product is 10, so the value is 0.'
          - problem: 'Give each truth value as 1 for true and 0 for false. (a) $\forall x\in\mathbb{R}: x^2\ge 0$. (b) $\forall x\in\mathbb{C}: x^2\in[0,\infty)$. (c) Give the value of $i^2$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 0; c = -1'
            solution_sketch: 'A square of a real number is not negative, so (a) has the value 1. For $x=i$ the square is -1, which is not in $[0,\infty)$, so (b) has the value 0. The value in (c) is -1.'
          - problem: 'Give each truth value as 1 for true and 0 for false. The notation $\forall x>0$ means that $x$ runs over all positive real numbers. (a) $\forall x>0: x^2>0$. (b) $\forall x>0: x-1>0$. (c) $\forall x>0: x+1>1$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 0; c = 1'
            solution_sketch: 'In (a) the square of a positive number is positive, so the value is 1. In (b) the number $x=\frac12$ gives $-\frac12$, so the value is 0. In (c) adding 1 to a positive number gives more than 1, so the value is 1.'
        constraints: 'Replace variables by values; decide a quantified statement over a small set; the items keep the values 1 and 0 fixed.'
      - id: kp2
        name: 'Example 1.37, Example 1.38, Example 1.39, Definition 1.40 and Example 1.41: existential statements, empty sets and nested quantifiers'
        key_prerequisites: [quantifiers, universal-existential-statements]
        exemplars:
          # source: FoM exercise 1.5-1-35
          - problem: 'Give each truth value as 1 for true and 0 for false. Form the negation of each statement first. Then give the truth value of the negation. (a) $\exists p\in\mathbb{N}: 3p=12$. (b) $\forall x\in\mathbb{R}: x^2\ge 4$. (c) $\exists p,q\in\mathbb{N}: pq=15$. (d) $\forall n\in\mathbb{N}: \exists p,q\in\{2,\dots,n-1\}: pq=n$. (e) $\forall x>0: \exists n\in\mathbb{N}: n>x$. (f) $\forall\varepsilon>0: \exists\delta>0: \forall x\in(-\delta,\delta): x^2<\varepsilon$. (g) $\exists a\in\mathbb{R}: \forall\varepsilon>0: \exists\delta>0: \forall x\in(-\delta,\delta): |x^2-a^2|<\varepsilon$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}},{"name":"e","contract":{"kind":"exact"}},{"name":"f","contract":{"kind":"exact"}},{"name":"g","contract":{"kind":"exact"}}]}
            answer: 'a=0;b=1;c=0;d=1;e=0;f=0;g=0'
            solution_sketch: 'The negation has the opposite truth value of the statement. Statements (a), (c), (e), (f) and (g) are true, so their negations have the value 0. For (a) use $p=4$, for (c) use $3\cdot 5$ and for (g) use $a=0$. Statement (b) fails for $x=0$ and statement (d) fails for the prime $n=5$, so their negations have the value 1.'
          - problem: 'Give each truth value as 1 for true and 0 for false. (a) $\exists x\in\mathbb{C}: x^2=-1$. (b) $\exists x\in\mathbb{R}: x^2=-1$. (c) Give the one $x\in\mathbb{N}$ with $x^2=49$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 0; c = 7'
            solution_sketch: 'In (a) the number $i$ is a witness, so the value is 1. In (b) every real square is not negative, so no witness exists and the value is 0. In (c) the only natural number with square 49 is 7.'
          - problem: 'Give each truth value as 1 for true and 0 for false. Let $E$ be the set of real numbers $x$ with $x^2<0$. (a) Count the elements of $E$. (b) $\forall x\in E: x>100$. (c) $\exists x\in E: x=0$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 0; b = 1; c = 0'
            solution_sketch: 'No real square is below 0, so $E$ has 0 elements. A universal statement over an empty set has no counterexample, so (b) has the value 1. An existential statement over an empty set has no witness, so (c) has the value 0.'
          - problem: 'Give each truth value as 1 for true and 0 for false. Let $M$ be the set of natural numbers $n$ with $n<0$. (a) $\forall n\in M: n^2=7$. (b) $\exists n\in M: n^2=7$. (c) $\forall n\in M: n^2\ne 7$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 0; c = 1'
            solution_sketch: 'The set $M$ is empty. A universal statement over an empty set is true, so (a) and (c) have the value 1. An existential statement over an empty set is false, so (b) has the value 0.'
          - problem: 'Give each truth value as 1 for true and 0 for false. (a) $\forall x\in\{1,4,9\}: \exists r\in\mathbb{N}: r^2=x$. (b) $\forall x\in\{1,2,4\}: \exists r\in\mathbb{N}: r^2=x$. (c) $\exists r\in\mathbb{N}: \forall x\in\{1,4\}: r^2=x$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 0; c = 0'
            solution_sketch: 'In (a) the roots 1, 2 and 3 exist, so the value is 1. In (b) the number 2 is not a square of a natural number, so the value is 0. In (c) one $r$ must give both $r^2=1$ and $r^2=4$, which is not possible, so the value is 0.'
          - problem: 'Fix $x$ in the inner statement $\exists r\in[0,\infty): r^2=x$. Give the value of $r$ in $[0,\infty)$ for each $x$. (a) $x=81$. (b) $x=144$. (c) $x=0$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 9; b = 12; c = 0'
            solution_sketch: 'Take the nonnegative square root of each $x$. We have $9^2=81$, so (a) is 9. We have $12^2=144$, so (b) is 12. We have $0^2=0$, so (c) is 0.'
          - problem: 'Give each truth value as 1 for true and 0 for false. Let $S=\{1,2,3\}$ and $T=\{1,2,3\}$. (a) $\forall x\in S: \exists r\in T: r=x$. (b) $\exists r\in T: \forall x\in S: r=x$. (c) $\exists r\in T: \forall x\in S: r\ge x$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 0; c = 1'
            solution_sketch: 'In (a) pick $r=x$ for each $x$, so the value is 1. In (b) one $r$ must equal 1, 2 and 3 together, so the value is 0. In (c) the choice $r=3$ is at least every $x$ in $S$, so the value is 1.'
          # source: FoM exercise 1.5-1-36
          - problem: 'Write the negation of each statement. Move the negation through every quantifier. (a) $\forall x\in\mathbb{N}: x^2\ge 1$. (b) $\forall\varepsilon>0: \exists\delta>0: \forall x\in(x_0-\delta,x_0+\delta): |f(x)-f(x_0)|<\varepsilon$, where $f$ is one fixed function. (c) $\forall\varepsilon>0: \exists\delta>0: \forall x\in(-\delta,\delta): \sqrt{|x|}<\varepsilon$. (d) $\exists f\in F: \forall\varepsilon>0: \exists\delta>0: \forall x\in(a-\delta,a+\delta): |f(x)-f(a)|<\varepsilon$, where $F$ is a fixed family of functions.'
            answer_contract: {"kind":"written"}
            answer: 'Swap each universal quantifier for an existential one and each existential for a universal one. Then reverse the last inequality.'
            solution_sketch: 'Use Theorem 1.44 one quantifier at a time, from the outside in. Statement (a) becomes $\exists x\in\mathbb{N}: x^2<1$. Statement (b) becomes $\exists\varepsilon>0: \forall\delta>0: \exists x\in(x_0-\delta,x_0+\delta): |f(x)-f(x_0)|\ge\varepsilon$. Statement (c) becomes $\exists\varepsilon>0: \forall\delta>0: \exists x\in(-\delta,\delta): \sqrt{|x|}\ge\varepsilon$. Statement (d) becomes $\forall f\in F: \exists\varepsilon>0: \forall\delta>0: \exists x\in(a-\delta,a+\delta): |f(x)-f(a)|\ge\varepsilon$.'
          # source: FoM exercise 1.5-1-38
          - problem: 'Write each statement with quantifiers. Then give its truth value and name the witness or counterexample that decides it. (a) Some prime number is even. (b) Every natural number has a square root in the natural numbers. (c) Each integer is the sum of two positive integers. (d) Each real number is the square of a positive real number.'
            answer_contract: {"kind":"written"}
            answer: 'Name the set, the open sentence and the quantifier of each statement. Then find a witness or a counterexample.'
            solution_sketch: 'Use Definition 1.34 for the form of each statement. Statement (a) is existential and the prime 2 is a witness, so it is true. Statement (b) is universal and $n=2$ is a counterexample, so it is false. Statement (c) is universal and $z=1$ is a counterexample, so it is false. Statement (d) has the form $\forall x\in\mathbb{R}: \exists y>0: y^2=x$. It is false, because $x=-1$ is not a square of a real number.'
        constraints: 'Decide existential, vacuous and nested statements; the order of two quantifiers changes the meaning.'
      - id: kp3
        name: 'Example 1.42, Theorem 1.44, Example 1.45 and Example 1.46: the negation of a quantified statement'
        key_prerequisites: [fom-1-4-special-focus-negation, quantifiers]
        exemplars:
          # source: FoM exercise 1.5-1-37
          - problem: 'Each statement below is false. Give the counterexample. (a) Every prime number is odd. Give the one prime that is a counterexample. (b) $\forall n\in\mathbb{Z}: \exists k\in\mathbb{Z}: nk=1$. Give the least positive integer $n$ that is a counterexample. (c) $\forall n\in\mathbb{Q}: \exists k\in\mathbb{Q}: nk=1$. Give the one rational number $n$ that is a counterexample.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 2; b = 2; c = 0'
            solution_sketch: 'In (a) the prime 2 is even, so it is the counterexample. In (b) the number 1 has $k=1$. The number 2 needs $k=\frac12$, which is not an integer, so (b) is 2. In (c) every nonzero $n$ has $k=\frac1n$, but $0\cdot k=0$, so (c) is 0.'
          - problem: 'Let $S=\{1,2,3\}$. Look at the statement $\forall x\in S: \exists y\in S: y=x+1$ and at its negation $\exists x\in S: \forall y\in S: y\ne x+1$. (a) Give the truth value of the statement as 1 for true and 0 for false. (b) Give the truth value of the negation as 1 for true and 0 for false. (c) Give the one $x\in S$ that makes the inner part of the negation true.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 0; b = 1; c = 3'
            solution_sketch: 'For $x=3$ the number 4 is not in $S$, so the statement has the value 0. The negation has the opposite value, so (b) is 1. The element $x=3$ is the witness, so (c) is 3.'
          - problem: 'Let $a_n=(-1)^n$ and $L=2$. Look at the statement $\exists\varepsilon>0: \forall N\in\mathbb{N}: \exists n\ge N: |a_n-L|\ge\varepsilon$. (a) Give the value of $|a_n-L|$ for $n=4$. (b) Give the truth value of the statement as 1 for true and 0 for false. (c) Give the largest $\varepsilon$ for which the statement holds.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 1; c = 3'
            solution_sketch: 'For $n=4$ we have $a_4=1$, so $|a_4-2|=1$. For odd $n$ we have $a_n=-1$, so $|a_n-2|=3$. Odd $n$ occur beyond every $N$, so the statement holds for $\varepsilon=3$ and the value is 1. A value above 3 fails, so (c) is 3.'
          - problem: 'Let $S=\{2,4,6,8\}$ and let $p(x)$ be the open sentence ''$x$ is divisible by 4''. (a) Count the elements $x$ of $S$ for which $\neg p(x)$ is true. (b) Give the truth value of $\exists x\in S: \neg p(x)$ as 1 for true and 0 for false. (c) Give the truth value of $\forall x\in S: p(x)$ as 1 for true and 0 for false.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 2; b = 1; c = 0'
            solution_sketch: 'The numbers 4 and 8 are divisible by 4. The numbers 2 and 6 are not, so (a) is 2. One such element exists, so (b) is 1. The statement $\forall x\in S: p(x)$ is the negation of (b), so (c) is 0.'
          - problem: 'Let $S=\{3,5,7\}$ and let $p(x)$ be the open sentence $x^2<30$. (a) Give the truth value of $\exists x\in S: p(x)$ as 1 for true and 0 for false. (b) Give the truth value of $\forall x\in S: \neg p(x)$ as 1 for true and 0 for false. (c) Count the elements of $S$ for which $\neg p(x)$ is true.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 0; c = 1'
            solution_sketch: 'We have $3^2=9$ and $5^2=25$, which are below 30. We have $7^2=49$, which is not. So $p(3)$ is true and (a) is 1. The statement in (b) is the negation of (a), so (b) is 0. Only $x=7$ makes $\neg p(x)$ true, so (c) is 1.'
          - problem: 'Look at the statement $\forall n\in\mathbb{N}: n^2\ge 3n$, where $n$ runs over the positive integers. (a) Give the truth value of the statement as 1 for true and 0 for false. (b) Give the least $n$ that makes the negation of the inner part true. (c) Count the values of $n$ that make the negation of the inner part true.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 0; b = 1; c = 2'
            solution_sketch: 'For $n=1$ we have $1<3$, and for $n=2$ we have $4<6$. For $n=3$ we have $9\ge 9$, and for larger $n$ the inequality holds. So the statement has the value 0, the least witness is 1 and there are 2 witnesses.'
          # argument: Theorem 1.44
          - problem: 'Prove: Let $p(x)$ be an open sentence and let $S$ be a set. The negation of $\forall x\in S: p(x)$ is the statement $\exists x\in S: \neg p(x)$.'
            answer_contract: {"kind":"written"}
            answer: 'The universal statement is false exactly when one x in S makes p(x) false. That x makes the negation of p(x) true.'
            solution_sketch: 'Use Definition 1.34 for the universal quantifier. The negation of $\forall x\in S: p(x)$ is true exactly when $\forall x\in S: p(x)$ is false. That happens exactly when some $x$ in $S$ has $p(x)$ false. For that $x$ the statement $\neg p(x)$ is true. So $\exists x\in S: \neg p(x)$ is true. All steps are equivalences, so the two statements always have the same truth value.'
          # source: FoM exercise 1.5-1-34
          - problem: 'Prove: Let $p(x)$ be an open sentence and let $S$ be a set. The negation of $\exists x\in S: p(x)$ is the statement $\forall x\in S: \neg p(x)$.'
            answer_contract: {"kind":"written"}
            answer: 'The existential statement is false exactly when no x in S makes p(x) true. So p(x) is false for every x in S.'
            solution_sketch: 'Use Theorem 1.44 as the model for the steps. The negation of $\exists x\in S: p(x)$ is true exactly when $\exists x\in S: p(x)$ is false. By Definition 1.34 that happens exactly when no $x$ in $S$ has $p(x)$ true. So $\neg p(x)$ is true for every $x$ in $S$. That is the meaning of $\forall x\in S: \neg p(x)$.'
        constraints: 'Move a negation through quantifiers one at a time; find the witness or counterexample that decides the result.'
