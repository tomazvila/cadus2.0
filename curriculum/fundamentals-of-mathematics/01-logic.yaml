          # argument: Theorem 1.71
          - problem: 'Prove: for statements $p$ and $q$, the statements $(p\wedge q)\Rightarrow q$ and $p\Rightarrow(p\vee q)$ are tautologies.'
            answer_contract: {"kind":"written"}
            answer: 'If p and q is true, then q is true. If p is true, then p or q is true.'
            solution_sketch: 'For the first statement, assume the hypothesis p and q has value 1. Then q has value 1, so the implication is true. If the hypothesis has value 0, the implication is true as well. For the second statement, assume p has value 1. Then p or q has value 1, so the implication is true. If p has value 0, the implication is true again.'
          # argument: Theorem 1.71
          - problem: 'Prove: for statements $p$, $q$ and $r$, the statements $((p\Rightarrow q)\wedge(q\Rightarrow r))\Rightarrow(p\Rightarrow r)$ and $(\neg p\wedge(p\vee q))\Rightarrow q$ are tautologies.'
            answer_contract: {"kind":"written"}
            answer: 'Assume the hypothesis. The chain gives p to q to r, and not p removes p from p or q and leaves q.'
            solution_sketch: 'For the first statement, assume both implications are true and p is true. Then q is true by the first implication, and r is true by the second. So p implies r is true. For the second statement, assume not p and (p or q) are true. Then p is false, so q must be the true part of p or q.'
