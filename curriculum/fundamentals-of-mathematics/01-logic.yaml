      - id: kp1
        name: 'Definition 1.48, Theorem 1.50, Example 1.52 and Proposition 1.53: tautologies, absurdities and modus ponens'
        key_prerequisites: [fom-1-3-conjunction-disjunction-negation]
        exemplars:
          - problem: 'A truth table has one row for each assignment of truth values to its letters. Give the number of rows when the letters are (a) $p$ and $q$, (b) $p$, $q$ and $r$, (c) $p$, $q$, $r$, $s$ and $t$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 4; b = 8; c = 32'
            solution_sketch: 'Each letter doubles the number of rows. Two letters give 4 rows. Three letters give 8 rows. Five letters give 32 rows.'
          - problem: 'Let $p$ have the value 1 and let $q$ have the value 0. Give each value as 1 for true and 0 for false. (a) $p\Rightarrow q$. (b) $p\wedge(p\Rightarrow q)$. (c) $[p\wedge(p\Rightarrow q)]\Rightarrow q$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 0; b = 0; c = 1'
            solution_sketch: 'Here p is 1 and q is 0, so p implies q has the value 0. Then the hypothesis p and (p implies q) has the value 0. A false hypothesis makes the whole implication true, so the last value is 1.'
          - problem: 'Give 1 if the statement has the value 1 for every assignment of $p$ and $q$. Give 0 if not. (a) $p\vee\neg p$. (b) $p\wedge\neg p$. (c) $p\Rightarrow q$. (d) $(p\wedge q)\Rightarrow p$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 0; c = 0; d = 1'
            solution_sketch: 'The statement p or not p is true in both rows, so (a) is 1. The statement p and not p is false in both rows, so (b) is 0. The implication p implies q is false for p=1 and q=0, so (c) is 0. In (d), a true hypothesis forces a true p, so (d) is 1.'
          - problem: 'Count the assignments of $(p,q)$, four in all, for which the statement has the value 1. (a) $p\Rightarrow q$. (b) $(p\wedge q)\vee\neg(p\wedge q)$. (c) $p\wedge\neg q$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 3; b = 4; c = 1'
            solution_sketch: 'The implication is false only for p=1 and q=0, so it holds in 3 assignments. The statement in (b) has the form r or not r, so it holds in all 4 assignments. The statement p and not q holds only for p=1 and q=0, so it holds in 1 assignment.'
          - problem: 'A statement is an absurdity when it has the value 0 for every assignment. A statement is a contingency when it has both values. Give 1 if the statement is a contingency and 0 if it is not. (a) $p\vee q$. (b) $p\vee\neg p$. (c) $p\wedge\neg p$. (d) $p\Rightarrow q$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 0; c = 0; d = 1'
            solution_sketch: 'The statement p or q is 0 for p=0 and q=0, and 1 for p=1, so (a) is 1. The statement in (b) is always 1, so it is not a contingency and (b) is 0. The statement in (c) is always 0, so (c) is 0. The implication takes both values, so (d) is 1.'
          - problem: 'Let $p$ have the value 0 and $q$ have the value 1. Give the value of each statement as 1 or 0. (a) $\neg p\wedge(p\Rightarrow q)$. (b) $[\neg p\wedge(p\Rightarrow q)]\Rightarrow q$. (c) $[p\wedge(p\Rightarrow q)]\Rightarrow q$. (d) $p\wedge\neg p$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 1; c = 1; d = 0'
            solution_sketch: 'Here not p is 1 and p implies q is 1, so (a) is 1. The conclusion q is 1, so the implication in (b) is 1. In (c) the hypothesis is 0, so the value is 1. The statement in (d) is always 0, so the value is 0.'
          # argument: Proposition 1.53
          - problem: 'Prove: for a statement $p$, the statement $p\vee\neg p$ is a tautology and the statement $p\wedge\neg p$ is an absurdity.'
            answer_contract: {"kind":"written"}
            answer: 'Exactly one of p and not p has the value 1. So the or-statement is always true and the and-statement is always false.'
            solution_sketch: 'Look at the two values of p. If p has value 1, then not p has value 0. Then p or not p has value 1, and p and not p has value 0. If p has value 0, then not p has value 1, and the same two values follow. So the first statement is a tautology and the second is an absurdity.'
          # argument: Theorem 1.50
          - problem: 'Prove: for statements $p$ and $q$, the statement $[p\wedge(p\Rightarrow q)]\Rightarrow q$ is a tautology.'
            answer_contract: {"kind":"written"}
            answer: 'A true q makes the implication true. A false p, or p true with q false, makes the hypothesis false.'
            solution_sketch: 'Split into three cases. If q has value 1, the conclusion is true, so the implication is true. If p has value 0, the hypothesis is false, so the implication is true. If p has value 1 and q has value 0, then p implies q is false. The hypothesis is false again, so the implication is true.'
          # source: FoM exercise 1.6-1-39
          - problem: 'Show in two ways that $[p\wedge(p\Rightarrow q)]\Rightarrow q$ is a tautology. (a) Build a truth table. (b) Replace $p\Rightarrow q$ by $\neg p\vee q$ and simplify.'
            answer_contract: {"kind":"written"}
            answer: 'A truth table has the value 1 in all four rows. Algebra gives not p or not q or q, and that is always true.'
            solution_sketch: 'Use Theorem 1.50 as the goal. A truth table with four rows gives the value 1 in each row. For the algebra, replace p implies q by not p or q. Then p and (not p or q) becomes p and q. The statement becomes not (p and q) or q, which is not p or not q or q, and that is true.'
          # source: FoM exercise 1.6-1-40
          - problem: 'Show that the statement $p\wedge\neg p$ is an absurdity. Use two cases for $p$.'
            answer_contract: {"kind":"written"}
            answer: 'One of p and not p is false in each row, so their and-statement is false in both rows.'
            solution_sketch: 'Finish the second half of Proposition 1.53 in the same way as the first half. Take p with value 1. Then not p has value 0, so the and-statement has value 0. Take p with value 0. Then the first part is already 0, so the and-statement has value 0.'
          # source: FoM exercise 1.6-1-41
          - problem: 'Prove the statement $[p\wedge((p\wedge\neg q)\Rightarrow F)]\Rightarrow q$ in two ways, where $F$ has the value 0. (a) Reason in words, in the style of the proof for $[p\wedge(p\Rightarrow q)]\Rightarrow q$. (b) Build a truth table.'
            answer_contract: {"kind":"written"}
            answer: 'In words, a true p with a false q makes the inner implication false, and any other row has q true or p false. A truth table has the value 1 in each row.'
            solution_sketch: 'Follow the cases of Theorem 1.50 and look at Theorem 1.55. If q has value 1, the whole implication is true. If p has value 0, the hypothesis is false. If p has value 1 and q has value 0, then p and not q has value 1, so the inner implication has value 0 and the hypothesis is false. A truth table with four rows confirms the value 1 in each row.'
          # source: FoM exercise 1.6-1-42
          - problem: '(a) Prove that $[(p\wedge q)\Rightarrow F]\Rightarrow(\neg p\vee\neg q)$ is a tautology, where $F$ has the value 0. (b) State what a proof of $\neg p\vee\neg q$ with this statement assumes and reaches.'
            answer_contract: {"kind":"written"}
            answer: 'If p and q gives F, then p and q is false, so not p or not q is true. A proof assumes p and q and reaches a false statement.'
            solution_sketch: 'The inner implication has the value 1 only when p and q has the value 0. Then at least one of p and q has the value 0. So not p or not q has the value 1. This is the proof by contradiction of not p or not q: assume p and q, and reach F.'
        constraints: 'Evaluate statements under fixed truth values and classify them; the items vary the statements and keep the values 1 and 0.'
      - id: kp2
        name: 'Theorem 1.55, Theorem 1.59 and Examples 1.57, 1.58 and 1.61: proof by contradiction and by cases'
        key_prerequisites: [fom-1-4-special-focus-negation]
        exemplars:
          - problem: 'Let $p$ have the value 1 and let $q$ have the value 0. Let $F$ be a statement with the value 0. Give each value as 1 for true and 0 for false. (a) $p\wedge\neg q$. (b) $(p\wedge\neg q)\Rightarrow F$. (c) $p\wedge((p\wedge\neg q)\Rightarrow F)$. (d) $[p\wedge((p\wedge\neg q)\Rightarrow F)]\Rightarrow q$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 0; c = 0; d = 1'
            solution_sketch: 'Here p and not q has the value 1. Then it implies F, which has the value 0, so (b) is 0. The hypothesis p and 0 has the value 0. A false hypothesis makes the whole implication true, so (d) is 1.'
          - problem: 'Let $p$ have the value 0 and let $q$ have the value 0. Let $F$ be a statement with the value 0. Give each value as 1 or 0. (a) $p\wedge\neg q$. (b) $(p\wedge\neg q)\Rightarrow F$. (c) $p\wedge((p\wedge\neg q)\Rightarrow F)$. (d) $[p\wedge((p\wedge\neg q)\Rightarrow F)]\Rightarrow q$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}}]}
            answer: 'a = 0; b = 1; c = 0; d = 1'
            solution_sketch: 'Here p and not q has the value 0. An implication with a false hypothesis has the value 1, so (b) is 1. Then p and 1 has the value 0, so (c) is 0. A false hypothesis makes the whole implication true, so (d) is 1.'
          - problem: 'Let $p=1$, $A=1$, $B=0$ and $q=0$. Give each value as 1 or 0. (a) $A\vee B$. (b) $(p\wedge A)\Rightarrow q$. (c) $p\wedge(A\vee B)\wedge((p\wedge A)\Rightarrow q)\wedge((p\wedge B)\Rightarrow q)$. (d) $[p\wedge(A\vee B)\wedge((p\wedge A)\Rightarrow q)\wedge((p\wedge B)\Rightarrow q)]\Rightarrow q$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 0; c = 0; d = 1'
            solution_sketch: 'Here A or B has the value 1. Next, p and A has the value 1 and q has the value 0, so (b) is 0. One part of the and-statement is 0, so (c) is 0. A false hypothesis makes the whole implication true, so (d) is 1.'
          - problem: 'The statement $[p\wedge(A\vee B)\wedge((p\wedge A)\Rightarrow q)\wedge((p\wedge B)\Rightarrow q)]\Rightarrow q$ has the four letters $p$, $A$, $B$ and $q$. (a) Give the number of rows of its truth table. (b) Give the number of rows with the value 0. (c) Give the number of rows in which $p\wedge(A\vee B)$ has the value 1.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 16; b = 0; c = 6'
            solution_sketch: 'Four letters give 16 rows. The statement is a tautology, so no row has the value 0. The part p and (A or B) needs p=1 and one of three pairs for A and B, and q is free. That gives 3 times 2, which is 6 rows.'
          - problem: 'Take the natural number $n$. Give the smallest odd prime factor of (a) $n=12$, (b) $n=80$, (c) $n=112$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 3; b = 5; c = 7'
            solution_sketch: 'Remove the factors 2 first. The number 12 is 4 times 3, so (a) is 3. The number 80 is 16 times 5, so (b) is 5. The number 112 is 16 times 7, so (c) is 7.'
          - problem: 'Suppose $\sqrt2=a/b$ for positive integers $a$ and $b$. Then $a^2=2b^2$. Take $b=5$. (a) Give $a^2$. (b) Give the remainder of $a^2$ on division by $2$. (c) This part uses a new $b$ and does not use $b=5$. Write $a=2k$ and take $k=3$. Give $b^2$ from the equation $4k^2=2b^2$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 50; b = 0; c = 18'
            solution_sketch: 'For b=5, a^2 is 2 times 25, which is 50. The number 50 is even, so the remainder is 0. For k=3, the equation 4k^2=2b^2 gives b^2=2k^2=18.'
          - problem: 'Let $r$ and $s$ be statements. Give each value as 1 or 0. (a) Assume $r\Rightarrow s$ has the value 1 and $s$ has the value 0. Give the value of $r$. (b) Assume $r\Rightarrow s$ has the value 1 and $r$ has the value 1. Give the value of $s$. (c) Assume $(r\wedge\neg s)\Rightarrow F$ has the value 1 for a statement $F$ with the value 0, and $r$ has the value 1. Give the value of $s$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 0; b = 1; c = 1'
            solution_sketch: 'In (a), a true implication with a false conclusion forces a false hypothesis, so r is 0. In (b), a true hypothesis forces a true conclusion, so s is 1. In (c), r and not s must have the value 0. Since r is 1, not s is 0, so s is 1.'
          # argument: Theorem 1.55
          - problem: 'Prove: for statements $p$ and $q$, the statement $[p\wedge((p\wedge\neg q)\Rightarrow F)]\Rightarrow q$ is a tautology, where $F$ has the value 0.'
            answer_contract: {"kind":"written"}
            answer: 'A row with p true and q false makes the inner implication false, so the hypothesis fails. Every other row has q true or p false.'
            solution_sketch: 'Use Theorem 1.31 to replace each implication x implies y by not x or y. The statement becomes not (p and (not (p and not q) or F)) or q. Drop F, and apply De Morgan to get not (p and (not p or q)) or q. Since p and not p is F, the bracket reduces to p and q. Then not p or not q or q is always true.'
          # argument: Theorem 1.59
          - problem: 'Prove: for statements $p$, $A$, $B$ and $q$, the statement $[p\wedge(A\vee B)\wedge((p\wedge A)\Rightarrow q)\wedge((p\wedge B)\Rightarrow q)]\Rightarrow q$ is a tautology.'
            answer_contract: {"kind":"written"}
            answer: 'If the hypothesis holds, p is true and A or B is true. The implication for that case then gives q.'
            solution_sketch: 'Use the case idea of Theorem 1.50 and Theorem 1.55. If q has value 1 or p has value 0, the implication is true. Now take p=1 and q=0. If A has value 1, the third part of the hypothesis is false. If B has value 1, the fourth part is false in the same way, and if A and B both have value 0, then A or B is false. In each case the hypothesis is false.'
          # source: FoM exercise 1.6-1-43
          - problem: 'Prove the statement $[p\wedge(A\vee B)\wedge((p\wedge A)\Rightarrow q)\wedge((p\wedge B)\Rightarrow q)]\Rightarrow q$ in three ways. (a) Reason in words. (b) Use algebra with $x\Rightarrow y$ equal to $\neg x\vee y$. (c) Build a truth table.'
            answer_contract: {"kind":"written"}
            answer: 'In words, the hypothesis gives p and one of A and B, and the matching implication gives q. Algebra and the truth table agree.'
            solution_sketch: 'Start from Theorem 1.59 and the methods of Theorem 1.50 and Theorem 1.55. In words, consider q true, then p false, then the cases for A and B. For algebra, replace each implication by an or-statement and expand with the distributive law. For the truth table, use 16 rows, one for each assignment of p, A, B and q.'
          # source: FoM exercise 1.6-1-44
          - problem: 'Write the tautology for a proof with three cases $A_1$, $A_2$ and $A_3$. Then write the tautology for $n$ cases.'
            answer_contract: {"kind":"written"}
            answer: 'The hypothesis holds p, one case true, and p with each A_i implies q. The statement for n cases has n such implications and n cases.'
            solution_sketch: 'Extend Theorem 1.59 from two cases to three. The hypothesis is p and (A_1 or A_2 or A_3) and three implications (p and A_i) implies q. The conclusion is q. For n cases, use A_1 or ... or A_n and n implications.'
