            answer: 'a = 3; b = -2'
            solution_sketch: 'The cube of 3 is 27, so (a) is 3. The fifth power of -2 is -32, so (b) is -2. Each odd root of a real number is unique in $\mathbb R$.'
          - problem: 'Count the square roots in $\mathbb R$. (a) Give the number of square roots of $9$. (b) Give the number of square roots of $0$. (c) Give the number of square roots of $-4$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 2; b = 1; c = 0'
            solution_sketch: 'The number 9 has the square roots 3 and -3, so (a) is 2. Only 0 squares to 0, so (b) is 1. No real number squares to -4, so (c) is 0.'
          - problem: 'Work in $\mathbb Z_5$, the field of remainders modulo 5. (a) Give the number of square roots of $4$. (b) Give the number of square roots of $2$. (c) Give the smallest $r\in\{0,1,2,3,4\}$ with $r^3=2$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 2; b = 0; c = 3'
            solution_sketch: 'The squares modulo 5 are 0, 1, 4, 4, 1. The number 4 appears twice, so (a) is 2. The number 2 does not appear, so (b) is 0. Also $3^3=27$ leaves remainder 2, and 0, 1, 2 fail, so (c) is 3.'
          - problem: 'Let $\mathbb C$ be the field of complex numbers. (a) Give the number of square roots of $-4$ in $\mathbb C$. (b) Give the number of cube roots of $8$ in $\mathbb R$. (c) Give the number of cube roots of $8$ in $\mathbb C$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 2; b = 1; c = 3'
            solution_sketch: 'The square roots of -4 are $2i$ and $-2i$, so (a) is 2. The only real cube root of 8 is 2, so (b) is 1. The complex cube roots of 8 are 2 and two more numbers, so (c) is 3.'
          - problem: 'Work in $\mathbb Z_7$, the field of remainders modulo 7. (a) Give the smaller square root of $2$ in $\{0,\dots,6\}$. (b) Give the number of square roots of $3$. (c) Give the number of square roots of $1$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 3; b = 0; c = 2'
            solution_sketch: 'Compute $3^2=9$, which leaves remainder 2, so (a) is 3. The squares modulo 7 are 0, 1, 4, 2, 2, 4, 1, and 3 is not among them, so (b) is 0. The number 1 is the square of 1 and of 6, so (c) is 2.'
          - problem: 'Work in $\mathbb Z_{11}$, the field of remainders modulo 11. The number $5$ has two square roots. (a) Give the smaller one in $\{0,\dots,10\}$. (b) Give the larger one. (c) Give the product of the two, as a remainder modulo 11.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 4; b = 7; c = 6'
            solution_sketch: 'Compute $4^2=16$, which leaves remainder 5, and $7^2=49$, which leaves remainder 5. So (a) is 4 and (b) is 7. The product $4\cdot 7=28$ leaves remainder 6, so (c) is 6.'
        constraints: 'Count and find nth roots in the reals and in small fields of remainders.'
      - id: kp2
        name: 'Theorem 5.63: the quadratic formula over a field'
        key_prerequisites: [fom-5-2-fields, quadratic-formula]
        exemplars:
          - problem: 'Give the discriminant $b^2-4ac$ of each equation. (a) $x^2-6x+5=0$. (b) $2x^2+x-1=0$. (c) $x^2+x+1=0$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 16; b = 9; c = -3'
            solution_sketch: 'For (a) compute $36-20=16$. For (b) compute $1+8=9$. For (c) compute $1-4=-3$.'
          - problem: 'Use the quadratic formula in $\mathbb R$ on $x^2+4x-12=0$. (a) Give the larger solution. (b) Give the smaller solution.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}}]}
            answer: 'a = 2; b = -6'
            solution_sketch: 'The discriminant is $16+48=64$, with square root 8. The solutions are $(-4+8)/2=2$ and $(-4-8)/2=-6$.'
          - problem: 'Count the real solutions. (a) Give the number of solutions of $x^2+x+1=0$. (b) Give the number of solutions of $\frac12x^2-4x+8=0$. (c) Give the number of solutions of $x^2-5x+6=0$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 0; b = 1; c = 2'
            solution_sketch: 'The discriminants are -3, 0 and 1. A negative discriminant gives 0 solutions, so (a) is 0. A zero discriminant gives 1 solution, so (b) is 1. A positive square gives 2 solutions, so (c) is 2.'
          - problem: 'Take the equation $2x^2+x-10=0$ in $\mathbb R$. (a) Give the discriminant. (b) Give the larger solution. (c) Give the product of the two solutions.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 81; b = 2; c = -5'
            solution_sketch: 'The discriminant is $1+80=81$, so (a) is 81. The solutions are $(-1+9)/4=2$ and $(-1-9)/4=-5/2$, so (b) is 2. The product is $2\cdot(-5/2)=-5$, so (c) is -5.'
          - problem: 'Work in $\mathbb Z_5$ and in $\mathbb Z_7$, the fields of remainders. Look at $x^2+x+1=0$. (a) Give the number of solutions in $\mathbb Z_5$. (b) Give the number of solutions in $\mathbb Z_7$. (c) Give the smaller solution in $\mathbb Z_7$ from $\{0,\dots,6\}$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 0; b = 2; c = 2'
            solution_sketch: 'In both fields the discriminant is -3. Modulo 5 it leaves remainder 2, which is not a square, so (a) is 0. Modulo 7 it leaves remainder 4, which is $2^2$, so (b) is 2. Test 2: $4+2+1=7$ leaves remainder 0, and 0 and 1 fail, so (c) is 2.'
          - problem: 'Let $x_1$ and $x_2$ be the solutions of $2x^2-10x+12=0$. (a) Give $x_1+x_2$. (b) Give $x_1x_2$. (c) Give $x_1^2+x_2^2$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 5; b = 6; c = 13'
            solution_sketch: 'The equation divides to $x^2-5x+6=0$, so the sum is 5 and the product is 6. Then $x_1^2+x_2^2=(x_1+x_2)^2-2x_1x_2=25-12=13$.'
          - problem: 'Write $2x^2+8x+3=0$ as $(x+h)^2=\dfrac{D}{k}$ by completing the square. (a) Give $h$. (b) Give $D=b^2-4ac$. (c) Give $k=(2a)^2$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 2; b = 40; c = 16'
            solution_sketch: 'Here $h=b/(2a)=8/4=2$, so (a) is 2. The discriminant is $64-24=40$, so (b) is 40. Also $(2a)^2=4^2=16$, so (c) is 16.'
          - problem: 'Find the constant. (a) Give $c$ so that $x^2-6x+c=0$ has exactly one solution. (b) Give the positive $b$ so that $x^2+bx+16=0$ has exactly one solution.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}}]}
            answer: 'a = 9; b = 8'
            solution_sketch: 'One solution needs discriminant 0. For (a) $36-4c=0$ gives 9. For (b) $b^2-64=0$ and $b>0$ give 8.'
          # argument: Theorem 5.63
          - problem: 'Prove: Let $\mathbb F$ be a field with $2\neq0$ and let $a,b,c\in\mathbb F$ with $a\neq0$. Then $ax^2+bx+c=0$ has as many solutions in $\mathbb F$ as $b^2-4ac$ has square roots in $\mathbb F$. If $b^2-4ac$ has a square root $s$, the solutions are $\frac{-b\pm s}{2a}$.'
            answer_contract: {"kind":"written"}
            answer: 'Complete the square: the equation is equivalent to (x+b/(2a))^2 = (b^2-4ac)/(2a)^2. Each square root of b^2-4ac gives one solution.'
            solution_sketch: 'Multiply out and complete the square to get $(x+\frac{b}{2a})^2=\frac{b^2-4ac}{(2a)^2}$. Each step is reversible, so the solutions of both equations are the same. By Definition 5.62 the right side has as many square roots as there are solutions. Each square root $s$ of $b^2-4ac$ gives $x=\frac{-b+s}{2a}$. Replace $s$ by $-s$ to get the second solution.'
          # source: FoM exercise 5.8-5-58
          - problem: 'Prove: Let $\mathbb F$ be a field with $2\neq0$, let $a,b,c\in\mathbb F$ with $a\neq0$, and let $s$ be a square root of $b^2-4ac$. Then $x=\frac{-b-s}{2a}$ solves $ax^2+bx+c=0$.'
            answer_contract: {"kind":"written"}
            answer: 'Substitute x. The terms with s cancel, and the rest of the sum is zero.'
            solution_sketch: 'Compute $ax^2=\frac{b^2+2bs+s^2}{4a}$. Compute $bx=\frac{-2b^2-2bs}{4a}$. Add both terms to get $\frac{s^2-b^2}{4a}$. Use $s^2=b^2-4ac$ to get $-c$. Then $ax^2+bx+c=0$, as Theorem 5.63 states.'
          # source: FoM exercise 5.8-5-59 part (a)
          - problem: 'Prove: Let $\mathbb F$ be a field with $2\neq0$, and let $p,q\in\mathbb F$. The equation $x^2+px+q=0$ has as many solutions in $\mathbb F$ as $\frac{p^2}{4}-q$ has square roots in $\mathbb F$. If $s$ is such a square root, the solutions are $-\frac p2\pm s$.'
            answer_contract: {"kind":"written"}
            answer: 'Write x^2+px+q as (x+p/2)^2 - (p^2/4 - q). Then x solves the equation exactly when (x+p/2)^2 is p^2/4 - q.'
            solution_sketch: 'Complete the square to get $(x+\frac p2)^2=\frac{p^2}{4}-q$. Each solution $x$ gives a square root $x+\frac p2$ of $\frac{p^2}{4}-q$, and each square root $s$ gives one $x=-\frac p2+s$. So the counts agree. This is Theorem 5.63 with $a=1$. For $x^2+4x-12=0$ the formula gives 2 and -6.'
          # source: FoM exercise 5.8-5-59 part (b)
          - problem: 'State how the solution formula $x=-\frac p2\pm s$ for $x^2+px+q=0$ solves each quadratic equation $ax^2+bx+c=0$ with $a\neq0$.'
            answer_contract: {"kind":"written"}
            answer: 'Divide the equation by a to get p=b/a and q=c/a. Then use the formula with the square roots of p^2/4-q.'
            solution_sketch: 'Divide $ax^2+bx+c=0$ by $a$. This gives $x^2+\frac bax+\frac ca=0$ with the same solutions. Put $p=\frac ba$ and $q=\frac ca$. Then the formula of Theorem 5.63 gives the solutions.'
          # source: FoM exercise 5.8-5-59 part (c)
          - problem: 'Solve over the real numbers. (a) Give the smaller solution of $x^2+4x-12=0$. (b) Give the larger solution of $x^2+4x-12=0$. (c) Give the smaller solution of $2x^2+x-10=0$, rounded to 1 decimal. (d) Give the larger solution of $2x^2+x-10=0$. (e) Give the only solution of $\frac12x^2-4x+8=0$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"approx","decimals":1}},{"name":"d","contract":{"kind":"exact"}},{"name":"e","contract":{"kind":"exact"}}]}
            answer: 'a=-6;b=2;c=-2.5;d=2;e=4'
            solution_sketch: 'The first equation has $p^2/4-q=16$, so $x=-2\pm4$, which gives $-6$ and $2$. The second equation is $x^2+\frac12x-5=0$ with $p^2/4-q=\frac{81}{16}$, so $x=-\frac14\pm\frac94$, which gives $-2.5$ and $2$. The third equation is $x^2-8x+16=0$ with $p^2/4-q=0$, so $x=4$.'
          # source: FoM exercise 5.8-5-68 part (a)
          - problem: 'Prove: let $x_1$ and $x_2$ be the two solutions of $ax^2+bx+c=0$ in a field, or let $x_1=x_2$ be the only solution. Then $ax_1x_2=c$.'
            answer_contract: {"kind":"written"}
            answer: 'The equation equals a(x-x1)(x-x2)=0. Compare the constant terms of both forms.'
            solution_sketch: 'Both solutions give the factoring $ax^2+bx+c=a(x-x_1)(x-x_2)$. Expand the right side to get $ax^2-a(x_1+x_2)x+ax_1x_2$. The constant terms of both sides must agree, so $ax_1x_2=c$ by Theorem 5.63.'
          # source: FoM exercise 5.8-5-68 part (b)
          - problem: 'Prove: with $x_1$ and $x_2$ as in the equation $ax^2+bx+c=0$ of a field, $ax_1+ax_2=-b$.'
            answer_contract: {"kind":"written"}
            answer: 'The equation equals a(x-x1)(x-x2)=0. Compare the coefficients of x in both forms.'
            solution_sketch: 'Both solutions give the factoring $ax^2+bx+c=a(x-x_1)(x-x_2)$. Expand the right side to get $ax^2-a(x_1+x_2)x+ax_1x_2$. The coefficients of $x$ must agree, so $ax_1+ax_2=-b$ by Theorem 5.63.'
          # source: FoM exercise 5.8-5-68 part (c)
          - problem: 'Solve $3x^2-4x-12=0$ over the real numbers. (a) Give the smaller solution, rounded to 2 decimals. (b) Give the larger solution, rounded to 2 decimals. (c) Give the value of $3x_1x_2$ for the two solutions $x_1$ and $x_2$. (d) Give the value of $3x_1+3x_2$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"approx","decimals":2}},{"name":"b","contract":{"kind":"approx","decimals":2}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}}]}
            answer: 'a=-1.27;b=2.77;c=-12;d=4'
            solution_sketch: 'The formula gives $x=\frac{2\pm2\sqrt{10}}{3}$, which is $-1.27$ and $2.77$. The product of the solutions is $-4$, so $3x_1x_2=-12$, which equals $c$. The sum is $\frac43$, so $3x_1+3x_2=4$, which equals $-b$.'
          # source: FoM exercise 5.8-5-68 part (d)
          - problem: 'Prove: if two numbers $x_1$ and $x_2$ of a field satisfy $ax_1x_2=c$ and $ax_1+ax_2=-b$ with $a\neq0$, then both solve $ax^2+bx+c=0$.'
            answer_contract: {"kind":"written"}
            answer: 'Expand a(x-x1)(x-x2) and replace the coefficients by the two given values. The product is zero at x1 and at x2.'
            solution_sketch: 'Expand $a(x-x_1)(x-x_2)$ to get $ax^2-a(x_1+x_2)x+ax_1x_2$. The two given properties turn this into $ax^2+bx+c$. The product $a(x-x_1)(x-x_2)$ is zero at $x=x_1$ and at $x=x_2$. So both numbers solve the equation by Theorem 5.63.'
          # source: FoM exercise 5.8-5-69
          - problem: 'Prove: Let $z_1,\dots,z_n$ be all roots, listed with multiplicity, of $x^n+a_{n-1}x^{n-1}+\dots+a_0=0$. For each $k$ from $0$ to $n-1$, the number $a_k$ equals $(-1)^{n-k}$ times the sum of all products $z_{j_1}\cdots z_{j_{n-k}}$ with $j_1<\dots<j_{n-k}$. Numbers that satisfy these $n$ equations are the roots.'
            answer_contract: {"kind":"written"}
            answer: 'Multiply out the product of (x-z_j) and read off the coefficient of x^k. For the converse, the same product expands to the given polynomial.'
            solution_sketch: 'The polynomial equals $\prod_{j=1}^n(x-z_j)$. Expand the product. The coefficient of $x^k$ is $(-1)^{n-k}$ times the sum of the products of $n-k$ different roots. This gives the first part. For the second part, expand the product with the numbers that satisfy the equations. It equals the given polynomial, so each number is a root.'
        constraints: 'Use the discriminant to count and find the solutions of a quadratic equation.'
      - id: kp3
        name: 'Theorem 5.64: the n distinct complex nth roots of a nonzero number'
        key_prerequisites: [fom-5-7-complex-numbers]
        exemplars:
          - problem: 'Give the number of complex $n$th roots. (a) The fourth roots of $16$. (b) The cube roots of $-8$. (c) The sixth roots of $5i$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 4; b = 3; c = 6'
            solution_sketch: 'Each nonzero complex number has exactly $n$ distinct $n$th roots. So the counts are 4, 3 and 6.'
          - problem: 'Count solutions. (a) Give the number of real solutions of $x^4=16$. (b) Give the number of real solutions of $x^4=-16$. (c) Give the number of complex solutions of $x^4=-16$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 2; b = 0; c = 4'
            solution_sketch: 'The real solutions of $x^4=16$ are 2 and -2, so (a) is 2. A fourth power is never negative in $\mathbb R$, so (b) is 0. Over $\mathbb C$ the number -16 has 4 fourth roots, so (c) is 4.'
          - problem: 'Look at $x^3+8=0$. It factors as $(x+2)(x^2-2x+4)$. (a) Give the real solution. (b) Give the real part of each nonreal solution. (c) Give the sum of all three solutions.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = -2; b = 1; c = 0'
            solution_sketch: 'The factor $x+2$ gives the real solution -2. The factor $x^2-2x+4$ has the solutions $1\pm i\sqrt3$, so the real part is 1. The sum is $-2+1+1=0$.'
          - problem: 'The fourth roots of $1$ in $\mathbb C$ are $1$, $-1$, $i$, $-i$. (a) Give the number of real ones. (b) Give the number of nonreal ones. (c) Give their product.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 2; b = 2; c = -1'
            solution_sketch: 'The real ones are 1 and -1, so (a) is 2. The nonreal ones are $i$ and $-i$, so (b) is 2. The product is $1\cdot(-1)\cdot i\cdot(-i)=-1$, so (c) is -1.'
          - problem: 'The equation $x^3-1=0$ has the solutions $1$, $\omega$, $\omega^2$ in $\mathbb C$, where $\omega=\frac{-1+i\sqrt3}{2}$. (a) Give the real solution. (b) Give the product of the three solutions. (c) Give the sum of the squares of the three solutions.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 1; c = 0'
            solution_sketch: 'The real solution is 1. The product is $1\cdot\omega\cdot\omega^2=\omega^3=1$. The squares are 1, $\omega^2$ and $\omega^4=\omega$, and $1+\omega+\omega^2=0$, so (c) is 0.'
          - problem: 'Look at $x^6=64$ in $\mathbb C$. (a) Give the number of real solutions. (b) Give the absolute value of each solution. (c) Give the sum of all solutions.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 2; b = 2; c = 0'
            solution_sketch: 'The real solutions are 2 and -2, so (a) is 2. Each solution has absolute value $64^{1/6}=2$, so (b) is 2. The $x^5$ coefficient is 0, so the sum of the six solutions is 0.'
          # argument: Theorem 5.64
          - problem: 'Prove: Let $n\ge2$ be a natural number. Every nonzero complex number has exactly $n$ distinct complex $n$th roots.'
            answer_contract: {"kind":"written"}
            answer: 'Use the polar form w = r(cos t + i sin t). The numbers with modulus r^(1/n) and angle (t+2 pi k)/n for k=0..n-1 are n distinct roots, and no more exist.'
            solution_sketch: 'Write $w=r(\cos t+i\sin t)$ with $r>0$. By de Moivre, each number $r^{1/n}(\cos\frac{t+2\pi k}{n}+i\sin\frac{t+2\pi k}{n})$ is an $n$th root of $w$ in the sense of Definition 5.62. The angles for $k=0,\dots,n-1$ differ by less than $2\pi$, so the $n$ numbers are distinct. A polynomial of degree $n$ has at most $n$ roots. So there are no other roots.'
          # source: FoM exercise 5.8-5-62
          - problem: 'Prove: Let $c>0$ and let $t$ be the positive real cube root of $c$. Then $-t$, $\frac t2(1+i\sqrt3)$ and $\frac t2(1-i\sqrt3)$ solve $x^3+c=0$. Do not use polar form.'
            answer_contract: {"kind":"written"}
            answer: 'Cube each number. The cube of -t is -c, and the cube of 1 plus or minus i sqrt 3 is -8, so the other two cubes are -c.'
            solution_sketch: 'Compute $(-t)^3=-t^3=-c$. Compute $(1+i\sqrt3)^3=1+3i\sqrt3-9-3i\sqrt3=-8$. Then $\left(\frac t2(1+i\sqrt3)\right)^3=\frac{t^3}{8}\cdot(-8)=-c$. The same steps work for $1-i\sqrt3$. So all three numbers solve $x^3+c=0$. For $c<0$, use $-t$ for $t$ the cube root of $-c$ and swap signs.'
        constraints: 'Count and find complex roots of a nonzero number.'
      - id: kp4
        name: 'Theorem 5.65: the cubic formula, step 1, the canonical form'
        key_prerequisites: [fom-5-2-fields]
        exemplars:
          - problem: 'Give the number $s=\dfrac{b}{3a}$ for the cubic $ax^3+bx^2+cx+d=0$. (a) $a=1$, $b=6$. (b) $a=3$, $b=9$. (c) $a=2$, $b=-12$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 2; b = 1; c = -2'
            solution_sketch: 'Compute $6/3=2$ for (a). Compute $9/9=1$ for (b). Compute $-12/6=-2$ for (c).'
          - problem: 'For a monic equation of degree $n$ with the term $a_{n-1}x^{n-1}$, the shift $y=x+a_{n-1}/n$ removes that term. Give the shift. (a) $x^5+10x^4+x=0$. (b) $x^4+8x^3+x^2=0$. (c) $x^3+9x^2+1=0$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 2; b = 2; c = 3'
            solution_sketch: 'Divide the coefficient of the second term by the degree. For (a) compute $10/5=2$. For (b) compute $8/4=2$. For (c) compute $9/3=3$.'
          - problem: 'Shift $x^3-6x^2+9x-4=0$ by $y=x+s$ so that the square term vanishes. The result is $y^3+py+q=0$. (a) Give $s$. (b) Give $p$. (c) Give $q$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = -2; b = -3; c = -2'
            solution_sketch: 'Here $s=-6/3=-2$. Put $x=y+2$ and expand to get $y^3-3y-2=0$. So $p=-3$ and $q=-2$.'
          - problem: 'Shift $x^3+3x^2+3x+2=0$ by $y=x+s$ so that the square term vanishes. The result is $y^3+py+q=0$. (a) Give $s$. (b) Give $p$. (c) Give $q$. (d) Give the real solution $x$ of the original equation.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 0; c = 1; d = -2'
            solution_sketch: 'Here $s=3/3=1$. Put $x=y-1$ and expand to get $y^3+1=0$, so $p=0$ and $q=1$. The real solution is $y=-1$, so $x=-2$.'
          - problem: 'Shift $2x^3+6x^2+8x+4=0$ by $y=x+s$ so that the square term vanishes. The result is $y^3+py+q=0$. (a) Give $p$. (b) Give $q$. (c) Give the real solution $x$ of the original equation.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 0; c = -1'
            solution_sketch: 'Here $s=6/6=1$. Put $x=y-1$ in $x^3+3x^2+4x+2$ and expand to get $y^3+y=0$, so $p=1$ and $q=0$. The real solution is $y=0$, so $x=-1$.'
          - problem: 'Shift $3x^3-9x^2+12x-3=0$ by $y=x+s$ so that the square term vanishes. The result is $y^3+py+q=0$. (a) Give $s$. (b) Give $p$. (c) Give $q$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = -1; b = 1; c = 1'
            solution_sketch: 'Here $s=-9/9=-1$. Divide by 3 and put $x=y+1$ in $x^3-3x^2+4x-1$ to get $y^3+y+1=0$. So $p=1$ and $q=1$.'
          # argument: Theorem 5.65
          - problem: 'Prove: Let $\mathbb F$ be a field with $3\neq0$ and let $a,b,c,d\in\mathbb F$ with $a\neq0$. Then $x$ solves $ax^3+bx^2+cx+d=0$ if and only if $y=x+\frac{b}{3a}$ solves $y^3+py+q=0$, where $p=-\frac{b^2}{3a^2}+\frac ca$ and $q=\frac{2b^3}{27a^3}-\frac{bc}{3a^2}+\frac da$.'
            answer_contract: {"kind":"written"}
            answer: 'Put x = y - b/(3a) and expand. The y^2 coefficient is zero, and division by a gives the form y^3+py+q, because each step is reversible.'
            solution_sketch: 'Put $x=y-\alpha$ with a free number $\alpha$ and expand. The coefficient of $y^2$ is $3a\alpha$ plus $b$ with the right signs. Pick $\alpha=\frac{b}{3a}$ so that this coefficient is 0. Divide by $a$ and collect the terms to get $p$ and $q$. The shift is reversible, so the solution sets match.'
          # source: FoM exercise 5.8-5-65
          - problem: 'Prove: Let $\mathbb F$ be a field with $5\neq0$. Then $x$ solves $x^5+ax^4+bx^3+cx^2+dx+e=0$ if and only if $y=x+\frac a5$ solves an equation $y^5+py^3+qy^2+ry+s=0$ with no $y^4$ term.'
            answer_contract: {"kind":"written"}
            answer: 'Put x = y - a/5 and expand. The y^4 coefficient is -5(a/5) + a, which is 0.'
            solution_sketch: 'Put $x=y-\frac a5$ in the equation. The term $x^5$ gives $y^5-ay^4+\dots$. The term $ax^4$ gives $ay^4+\dots$. The two $y^4$ terms cancel, as in Theorem 5.65 for the cubic. The other terms give $p$, $q$, $r$ and $s$, and the reversible shift keeps the solutions. The same step removes the term of order $n-1$ in an equation of degree $n$.'
        constraints: 'Shift a cubic equation so that the square term vanishes.'
      - id: kp5
        name: 'Theorem 5.66: the cubic formula, step 2, Cardano''s formula'
        key_prerequisites: [fom-5-7-complex-numbers]
        exemplars:
          - problem: 'Look at $x^3+px+q=0$ with $p=-6$ and $q=-9$. Let $\alpha$ be the real cube root of $-\frac q2+\sqrt{\frac{q^2}{4}+\frac{p^3}{27}}$, with the positive square root. (a) Give $q^2+\frac{4p^3}{27}$. (b) Give $\alpha$. (c) Give $x=\alpha-\frac{p}{3\alpha}$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 49; b = 2; c = 3'
            solution_sketch: 'Compute $81-32=49$, so (a) is 49. Then $-q/2+7/2=8$, and the real cube root of 8 is 2, so (b) is 2. Then $x=2+6/6=3$, and $27-18-9=0$ confirms it.'
          - problem: 'Look at $x^3+px+q=0$ with $p=6$ and $q=7$. Let $\alpha$ be the real cube root of $-\frac q2+\sqrt{\frac{q^2}{4}+\frac{p^3}{27}}$, with the positive square root. (a) Give $q^2+\frac{4p^3}{27}$. (b) Give $\alpha$. (c) Give $x=\alpha-\frac{p}{3\alpha}$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 81; b = 1; c = -1'
            solution_sketch: 'Compute $49+32=81$, so (a) is 81. Then $-7/2+9/2=1$, and the real cube root of 1 is 1, so (b) is 1. Then $x=1-6/3=-1$, and $-1-6+7=0$ confirms it.'
          - problem: 'Look at $x^3-18x-35=0$. The number $u$ solves $u^2+qu-\frac{p^3}{27}=0$ with $p=-18$ and $q=-35$. (a) Give the larger solution $u_1$. (b) Give the smaller solution $u_2$. (c) Give $27u_1u_2$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 27; b = 8; c = 5832'
            solution_sketch: 'The quadratic is $u^2-35u+216=0$. Its solutions are 27 and 8, because $27+8=35$ and $27\cdot8=216$. Then $27\cdot216=5832$, which equals $-p^3$.'
          - problem: 'Look at $x^3+px+q=0$ with $p=-9$ and $q=-28$. Let $u=-\frac q2+\sqrt{\frac{q^2}{4}+\frac{p^3}{27}}$, with the positive square root. (a) Give $u$. (b) Give the real cube root $\alpha$ of $u$. (c) Give $\beta=-\frac{p}{3\alpha}$. (d) Give $x=\alpha+\beta$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}}]}
            answer: 'a = 27; b = 3; c = 1; d = 4'
            solution_sketch: 'Compute $q^2/4=196$ and $p^3/27=-27$, so the root is $\sqrt{169}=13$. Then $u=14+13=27$, so $\alpha=3$. Then $\beta=9/9=1$ and $x=3+1=4$. Also $64-36-28=0$.'
          - problem: 'Look at $x^3-12x-16=0$. Write $x=\alpha+\beta$ with $3\alpha\beta=-p$ and $\alpha^3+\beta^3=-q$. (a) Give $\alpha\beta$. (b) Give $\alpha^3+\beta^3$. (c) Give the positive solution $x$. (d) Give the other solution, which is negative.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}}]}
            answer: 'a = 4; b = 16; c = 4; d = -2'
            solution_sketch: 'Here $\alpha\beta=12/3=4$ and $\alpha^3+\beta^3=16$. So $\alpha=\beta=2$ and $x=4$. Divide $x^3-12x-16$ by $x-4$ to get $x^2+4x+4=(x+2)^2$, so the other solution is -2.'
          # source: FoM exercise 5.8-5-66
          - problem: 'Solve over $\mathbb C$. (a) Give the real solution of $x^3+x^2+x+1=0$. (b) Give the sum of the four solutions of $x^4+x^3+x^2+x+1=0$. (c) The equation $3x^3+2x^2=1$ has exactly one real solution. Give it rounded to 2 decimals. (d) Give the smaller solution of $x^3-5x^2+3x+9=0$. (e) Give the larger solution of $x^3-5x^2+3x+9=0$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"approx","decimals":2}},{"name":"d","contract":{"kind":"exact"}},{"name":"e","contract":{"kind":"exact"}}]}
            answer: 'a=-1;b=-1;c=0.53;d=-1;e=3'
            solution_sketch: 'For (a) factor $(x+1)(x^2+1)$, so the real solution is -1. For (b) the sum is minus the $x^3$ coefficient, which is -1. For (c) the real solution is near 0.528, which rounds to 0.53. For (d) and (e) factor $(x+1)(x-3)^2$, so the solutions are -1 and 3.'
          # argument: Theorem 5.66
          - problem: 'Prove the first step: Let $p,q\in\mathbb C\setminus\{0\}$ and let $x$ solve $x^3+px+q=0$. Then $x=\alpha-\frac{p}{3\alpha}$ for a cube root $\alpha$ of $-\frac q2+\sqrt{\frac{q^2}{4}+\frac{p^3}{27}}$.'
            answer_contract: {"kind":"written"}
            answer: 'Write x = alpha + beta with 3 alpha beta = -p. Then alpha^3 solves u^2 + q u - p^3/27 = 0, so alpha^3 is one of the two given numbers.'
            solution_sketch: 'Write $x=\alpha+\beta$ with $3\alpha\beta=-p$, as in the shift idea of Theorem 5.65. Substitute into the equation to get $\alpha^3+\beta^3+q=0$. Put $\beta=-\frac{p}{3\alpha}$ and multiply by $\alpha^3$ to get $u^2+qu-\frac{p^3}{27}=0$ for $u=\alpha^3$. The quadratic formula of Theorem 5.63 gives $u=-\frac q2\pm\sqrt{\frac{q^2}{4}+\frac{p^3}{27}}$. The two values of $u$ give the same set of solutions.'
          # source: FoM exercise 5.8-5-60
          - problem: 'Prove: Let $x,p\in\mathbb C$. Then there are $\alpha,\beta\in\mathbb C$ with $\alpha+\beta=x$ and $3\alpha\beta=-p$.'
            answer_contract: {"kind":"written"}
            answer: 'Pick alpha and beta as the two roots of t^2 - x t - p/3 = 0. This quadratic has a root in C, and the sum and product of its roots give the two equations.'
            solution_sketch: 'Look at $t^2-xt-\frac p3=0$. It has a solution $\alpha$ in $\mathbb C$ by the quadratic formula. Put $\beta=x-\alpha$. Then $\alpha+\beta=x$. Also $\alpha\beta=\alpha(x-\alpha)=-\frac p3$ because $\alpha^2-x\alpha-\frac p3=0$. So $3\alpha\beta=-p$.'
          # source: FoM exercise 5.8-5-61
          - problem: 'Prove: Let $p,q\in\mathbb C\setminus\{0\}$, let $\alpha$ be a cube root of $u_1=-\frac q2+\sqrt{\frac{q^2}{4}+\frac{p^3}{27}}$, and let $x=\alpha-\frac{p}{3\alpha}$. Then $x^3+px+q=0$.'
            answer_contract: {"kind":"written"}
            answer: 'Set beta = -p/(3 alpha). Then alpha^3 + beta^3 = -q and 3 alpha beta = -p, so x^3 = -q - p x.'
            solution_sketch: 'Put $\beta=-\frac{p}{3\alpha}$, so $x=\alpha+\beta$ and $3\alpha\beta=-p$. Expand to get $x^3=\alpha^3+\beta^3+3\alpha\beta x=\alpha^3+\beta^3-px$. We have $\beta^3=-\frac{p^3}{27u_1}=u_2$ because $27u_1u_2=-p^3$. So $\alpha^3+\beta^3=u_1+u_2=-q$. This finishes the second half of Theorem 5.66.'
          # source: FoM exercise 5.8-5-67
          - problem: 'Prove: The function $f$ from $\mathbb R$ to $\mathbb R$ given by $f(x)=x^3-x$ is surjective and is not injective.'
            answer_contract: {"kind":"written"}
            answer: 'For surjective, f is continuous and takes values below and above every y, so the intermediate value theorem applies. For not injective, f(0)=f(1)=0.'
            solution_sketch: 'Take any $y\in\mathbb R$. The function $f$ is continuous and tends to $-\infty$ for $x\to-\infty$ and to $+\infty$ for $x\to\infty$. By the intermediate value theorem some $x$ has $f(x)=y$. So $f$ is surjective. Also $f(0)=0=f(1)$ with $0\neq1$, so $f$ is not injective. Theorem 5.66 gives the same result over $\mathbb C$.'
        constraints: 'Apply Cardano''s formula to a cubic without a square term.'
      - id: kp6
        name: 'Theorem 5.67 and Theorem 5.68: the quartic formula, shift and split'
        key_prerequisites: [fom-5-7-complex-numbers]
        exemplars:
          - problem: 'Give the shift $s=\frac a4$ in $y=x+s$ for the quartic $x^4+ax^3+bx^2+cx+d=0$. (a) $a=8$. (b) $a=-12$. (c) $a=4$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 2; b = -3; c = 1'
            solution_sketch: 'Divide the coefficient $a$ by 4 in each case. Compute $8/4=2$ for (a). Compute $-12/4=-3$ for (b), and $4/4=1$ for (c).'
          - problem: 'Look at $x^4-25x^2+60x-36=0$. Its solutions are $1$, $2$, $3$ and $-6$. (a) Give the sum of the solutions. (b) Give the product of the solutions. (c) Give the sum of the squares of the solutions.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 0; b = -36; c = 50'
            solution_sketch: 'The sum is $1+2+3-6=0$. The product is $1\cdot2\cdot3\cdot(-6)=-36$. The squares add to $1+4+9+36=50$.'
          - problem: 'Shift $x^4+4x^3+7x^2+4x+1=0$ by $y=x+1$ to get $y^4+py^2+qy+r=0$. (a) Give $p$. (b) Give $q$. (c) Give $r$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = -2; c = 1'
            solution_sketch: 'Here $a=4$, $b=7$, $c=4$ and $d=1$. Use $p=-\frac{3a^2}{8}+b=-6+7=1$. Use $q=\frac{a^3}{8}-\frac{ab}{2}+c=8-14+4=-2$. Use $r=-\frac{3a^4}{256}+\frac{a^2b}{16}-\frac{ac}{4}+d=-3+7-4+1=1$.'
          - problem: 'Take $y^4+py^2+qy+r=0$ with $p=0$, $q=4$, $r=-1$. The cubic $8\alpha^3+8p\alpha^2+(2p^2-8r)\alpha-q^2=0$ has the solution $\alpha_0=1$. Let $z_0=\frac{q}{4\alpha_0}$. (a) Give the value of the cubic at $\alpha=1$. (b) Give $z_0$. (c) Give the value of $\left(x^2+\frac p2+\alpha_0\right)^2-2\alpha_0(x-z_0)^2$ at $x=2$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 0; b = 1; c = 23'
            solution_sketch: 'The cubic at 1 is $8+0+8-16=0$. Then $z_0=4/4=1$. At $x=2$ the expression is $25-2=23$, and $2^4+4\cdot2-1=23$ agrees.'
          - problem: 'Shift $x^4-4x^3+5x^2-4x+4=0$ by $y=x+s$ to get $y^4+py^2+qy+r=0$. (a) Give $s$. (b) Give $p$. (c) Give $q$. (d) Give the $y$ that belongs to the solution $x=2$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}}]}
            answer: 'a = -1; b = -1; c = -2; d = 1'
            solution_sketch: 'The shift is $y=x+a/4=x-1$, so $x=y+1$. Expand to get $y^4-y^2-2y+2=0$. So $p=-1$ and $q=-2$. The solution $x=2$ gives $y=1$, and $1-1-2+2=0$ confirms it.'
          - problem: 'Look at $x^4+8x^3-x^2-8x=0$. The shift $y=x+s$ gives an equation $y^4+py^2+qy+r=0$. (a) Give $s$. (b) Give $p$. (c) Give the largest solution $x$. (d) Give the sum of the four solutions.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}}]}
            answer: 'a = 2; b = -25; c = 1; d = -8'
            solution_sketch: 'Here $s=8/4=2$. Then $p=-\frac{3\cdot64}{8}+(-1)=-24-1=-25$. The equation factors as $x(x+8)(x-1)(x+1)=0$, so the largest solution is 1. The solutions 0, -8, 1, -1 add to -8.'
          # argument: Theorem 5.67
          - problem: 'Prove the first step: Let $\mathbb F$ be a field with $4\neq0$ and let $a,b,c,d\in\mathbb F$. Put $x=y-\frac a4$ in $x^4+ax^3+bx^2+cx+d=0$. Then the term in $y^3$ vanishes, and $x$ solves the first equation if and only if $y$ solves the new one.'
            answer_contract: {"kind":"written"}
            answer: 'The y^3 coefficient of (y-a/4)^4 + a(y-a/4)^3 is -a + a = 0. The shift is reversible, so both equations have matching solutions.'
            solution_sketch: 'Expand $(y-\frac a4)^4$. Its $y^3$ term is $-ay^3$, and the $y^3$ term of $a(y-\frac a4)^3$ is $ay^3$. The terms add to 0, so the new equation has the form $y^4+py^2+qy+r=0$. The shift is reversible, so $x$ solves the old equation if and only if $y=x+\frac a4$ solves the new one. Theorem 5.68 starts from this form.'
          # source: FoM exercise 5.8-5-63
          - problem: 'Prove: Let $\mathbb F$ be a field with $4\neq0$ and let $a,b,c,d\in\mathbb F$. Put $x=y-\frac a4$ in $x^4+ax^3+bx^2+cx+d=0$. The new equation is $y^4+py^2+qy+r=0$ with $p=-\frac{3a^2}{8}+b$, $q=\frac{a^3}{8}-\frac{ab}{2}+c$ and $r=-\frac{3a^4}{256}+\frac{a^2b}{16}-\frac{ac}{4}+d$.'
            answer_contract: {"kind":"written"}
            answer: 'Expand each power of y - a/4 and add. Collect the coefficients of y^2, y and 1 to get p, q and r.'
            solution_sketch: 'Expand $(y-\frac a4)^4$, $a(y-\frac a4)^3$, $b(y-\frac a4)^2$ and $c(y-\frac a4)$. Add them with $d$. The $y^2$ terms are $\frac{6a^2}{16}-\frac{3a^2}{4}+b$, which gives $p$. The $y$ terms give $q$, and the constant terms give $r$. This proves the formulas of Theorem 5.67.'
          # argument: Theorem 5.68
          - problem: 'Prove the first step: Let $p,q,r\in\mathbb C$, let $\alpha_0\neq0$ solve $q^2-8\alpha(\alpha^2+p\alpha+\frac{p^2}{4}-r)=0$ in $\alpha$, and let $z_0=\frac{q}{4\alpha_0}$. If $(x^2+\frac p2+\alpha_0)^2-2\alpha_0(x-z_0)^2=0$, then $x^4+px^2+qx+r=0$.'
            answer_contract: {"kind":"written"}
            answer: 'Expand the square. The cubic for alpha_0 makes the leftover terms equal to 2 alpha_0 (x - z_0)^2, so the expression equals x^4 + p x^2 + q x + r.'
            solution_sketch: 'Expand $(x^2+\frac p2+\alpha_0)^2=x^4+(p+2\alpha_0)x^2+(\frac p2+\alpha_0)^2$. Subtract $2\alpha_0(x-z_0)^2=2\alpha_0x^2-4\alpha_0z_0x+2\alpha_0z_0^2$. Since $4\alpha_0z_0=q$, the $x$ term is $qx$. The cubic for $\alpha_0$ gives $2\alpha_0z_0^2=\frac{q^2}{8\alpha_0}=\alpha_0^2+p\alpha_0+\frac{p^2}{4}-r$. So the constant term is $r$. This is the step that Theorem 5.67 prepares.'
          # source: FoM exercise 5.8-5-64
          - problem: 'Prove: Let $p,q,r\in\mathbb C$. If $x$ solves $x^4+px^2+qx+r=0$, then $(x^2+\frac p2+\alpha_0)^2-2\alpha_0(x-z_0)^2=0$. Here $\alpha_0\neq0$ solves $q^2-8\alpha(\alpha^2+p\alpha+\frac{p^2}{4}-r)=0$ and $z_0=\frac{q}{4\alpha_0}$.'
            answer_contract: {"kind":"written"}
            answer: 'Write x^4 as (x^2+p/2+alpha)^2 minus lower terms and collect. The cubic for alpha_0 makes the rest a perfect square, 2 alpha_0 (x - z_0)^2.'
            solution_sketch: 'Write $x^4=(x^2+\frac p2+\alpha_0)^2-(p+2\alpha_0)x^2-(\frac p2+\alpha_0)^2$. Put this into the equation and collect the terms. The rest is $-2\alpha_0x^2+qx-\alpha_0^2-p\alpha_0-\frac{p^2}{4}+r$. Its discriminant in $x$ is $q^2-8\alpha_0(\alpha_0^2+p\alpha_0+\frac{p^2}{4}-r)=0$. So the rest equals $-2\alpha_0(x-z_0)^2$. This is the converse of the first step of Theorem 5.68.'
        constraints: 'Shift a quartic equation and split it into two quadratic equations.'
    diagnostic_exemplar:
      problem: 'Give the real number $r$ with $r^3=64$.'
      answer_contract: {"kind":"exact"}
      answer: '4'
      solution_sketch: 'The cube of 4 is 64, because 4 times 4 is 16 and 16 times 4 is 64. So the answer is 4.'
