        exemplars:
          - problem: 'In $\mathbb{R}^3$ let $x=(1,2,3)$ and $y=(4,-1,0)$. (a) Give the first component of $x+y$. (b) Give the third component of $2x-y$. (c) Give the sum of the three components of $3y$.'
