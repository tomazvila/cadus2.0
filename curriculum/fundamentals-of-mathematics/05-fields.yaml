    knowledge_points:
      - id: kp1
        name: 'Proposition 5.1 and Proposition 5.2: related pairs and well-defined operations'
        key_prerequisites: [fom-4-1-arithmetic-integers]
        exemplars:
          - problem: 'Two pairs $(a,b)$ and $(c,d)$ of integers with $b\neq0$ and $d\neq0$ are related, written $(a,b)\sim(c,d)$, when $ad=bc$. Give 1 if the pairs are related and 0 if not. (a) $(2,3)$ and $(4,6)$. (b) $(1,2)$ and $(2,5)$. (c) $(-3,4)$ and $(6,-8)$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 0; c = 1'
            solution_sketch: 'Compare $ad$ with $bc$ for each pair. In (a), $2\cdot6=12$ and $3\cdot4=12$, so the key is 1. In (b), $1\cdot5=5$ and $2\cdot2=4$, so the key is 0. In (c), $(-3)(-8)=24$ and $4\cdot6=24$, so the key is 1.'
          - problem: 'Let $(a,b)\sim(c,d)$ mean $ad=bc$. Find the integer $x$ in each case. (a) $(3,5)\sim(x,20)$. (b) $(-2,7)\sim(x,21)$. (c) $(x,6)\sim(10,15)$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 12; b = -6; c = 4'
            solution_sketch: 'Write the equation $ad=bc$ for each case. In (a), $3\cdot20=5x$, so $x=12$. In (b), $-2\cdot21=7x$, so $x=-6$. In (c), $15x=60$, so $x=4$.'
          - problem: 'Let $(a,b)\sim(c,d)$ mean $ad=bc$. Find the nonzero integer $d$ in each case. (a) $(4,d)\sim(6,9)$. (b) $(5,d)\sim(-10,-8)$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}}]}
            answer: 'a = 6; b = 4'
            solution_sketch: 'Write the equation $ad=bc$. In (a), $4\cdot9=6d$, so $d=6$. In (b), $5\cdot(-8)=-10d$, so $d=4$.'
          - problem: 'Use the rules $[(a,b)]+[(c,d)]=[(ad+bc,bd)]$ and $[(a,b)]\cdot[(c,d)]=[(ac,bd)]$ for the classes $[(1,2)]$ and $[(1,3)]$. Give (a) the first entry and (b) the second entry of the pair in the sum rule. Give (c) the first entry and (d) the second entry of the pair in the product rule.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}}]}
            answer: 'a = 5; b = 6; c = 1; d = 6'
            solution_sketch: 'Put $a=1$, $b=2$, $c=1$, $d=3$. The sum pair is $(1\cdot3+2\cdot1,\,2\cdot3)=(5,6)$. The product pair is $(1\cdot1,\,2\cdot3)=(1,6)$. So the key is 5, 6, 1, 6.'
          - problem: 'The pairs $(1,2)$ and $(2,4)$ lie in the same class. Add the class $[(1,3)]$ to each of them with the sum rule $[(a,b)]+[(c,d)]=[(ad+bc,bd)]$. Give (a) the first entry of the pair for $(1,2)$ and (b) the first entry of the pair for $(2,4)$. Give (c) 1 if the two result pairs are related by $ad=bc$ and 0 if not.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 5; b = 10; c = 1'
            solution_sketch: 'For $(1,2)$ the sum pair is $(1\cdot3+2\cdot1,\,6)=(5,6)$. For $(2,4)$ the sum pair is $(2\cdot3+4\cdot1,\,12)=(10,12)$. Then $5\cdot12=60$ and $6\cdot10=60$, so the pairs are related and the key is 5, 10, 1.'
          - problem: 'The pairs $(3,4)$ and $(-6,-8)$ lie in the same class. Multiply the class $[(2,5)]$ with each of them by the rule $[(a,b)]\cdot[(c,d)]=[(ac,bd)]$. Give (a) the first entry of the pair for $(3,4)$ and (b) the first entry of the pair for $(-6,-8)$. Give (c) 1 if the two result pairs are related by $ad=bc$ and 0 if not.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 6; b = -12; c = 1'
            solution_sketch: 'For $(3,4)$ the pair is $(3\cdot2,\,4\cdot5)=(6,20)$. For $(-6,-8)$ the pair is $(-6\cdot2,\,-8\cdot5)=(-12,-40)$. Then $6\cdot(-40)=-240$ and $20\cdot(-12)=-240$, so the key is 6, -12, 1.'
          - problem: 'Count the pairs $(a,b)$ with $a$ and $b$ in $\{1,2,3,4,5,6\}$ that are related to the given pair by $ad=bc$. The given pair itself counts. (a) The given pair is $(1,2)$. (b) The given pair is $(2,3)$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}}]}
            answer: 'a = 3; b = 2'
            solution_sketch: 'A pair $(a,b)$ is related to $(1,2)$ when $2a=b$. These pairs are $(1,2)$, $(2,4)$ and $(3,6)$, so (a) is 3. A pair $(a,b)$ is related to $(2,3)$ when $3a=2b$. These pairs are $(2,3)$ and $(4,6)$, so (b) is 2.'
          # argument: Proposition 5.1
          - problem: 'Prove: the relation $(a,b)\sim(c,d)$ given by $ad=bc$ is an equivalence relation on the set of pairs of integers with a nonzero second entry.'
            answer_contract: {"kind":"written"}
            answer: 'Show reflexive and symmetric by direct substitution. For transitive, multiply the two equations and cancel the nonzero middle denominator.'
            solution_sketch: 'Reflexive: $ab=ba$. Symmetric: if $ad=bc$ then $cb=da$. Transitive: let $ad=bc$ and $cf=de$. Multiply to get $adcf=bcde$, then cancel $cd$ when $c\neq0$, which gives $af=be$. If $c=0$, then $a=0$ and $e=0$ because $b,d\neq0$, and $af=be$ holds. This proof is the content of Proposition 5.1.'
          # argument: Proposition 5.2
          - problem: 'Prove: the sum $[(a,b)]+[(c,d)]=[(ad+bc,bd)]$ and the product $[(a,b)]\cdot[(c,d)]=[(ac,bd)]$ of classes are defined for every two classes. Prove also that the product does not depend on the chosen pairs.'
            answer_contract: {"kind":"written"}
            answer: 'A result pair exists because bd is nonzero. For well-defined, replace each pair by a related pair and show the result pairs are related.'
            solution_sketch: 'The second entry $bd$ is nonzero, so both rules give a pair of the right kind. Let $(a,b)\sim(a'',b'')$ and $(c,d)\sim(c'',d'')$, so $ab''=a''b$ and $cd''=c''d$. Then $ac\,b''d''=ab''\,cd''=a''b\,c''d=a''c''\,bd$, so $(ac,bd)\sim(a''c'',b''d'')$. This uses Proposition 5.1 for the classes and the arithmetic of integers from Proposition 4.2 and Proposition 4.3. The proof for the sum is the same type of work.'
          # source: FoM exercise 5.1-5-1
          - problem: 'Prove that a relation on pairs of integers is an equivalence relation. The relation holds between $(a,b)$ and $(c,d)$ when $ad=bc$, and the second entry of every pair is nonzero. Show all three properties.'
            answer_contract: {"kind":"written"}
            answer: 'Check reflexive and symmetric by substitution. For transitive, multiply the two given equations and cancel the middle denominator.'
            solution_sketch: 'Use Proposition 5.1 as the model. Reflexive: $ab=ba$. Symmetric: $ad=bc$ gives $cb=da$. Transitive: from $ad=bc$ and $cf=de$ get $adcf=bcde$ and cancel $cd$ for $c\neq0$. The case $c=0$ gives $a=e=0$ directly.'
          # source: FoM exercise 5.1-5-2
          - problem: 'Show that the sum of two classes of pairs does not depend on the chosen pairs. Use the rule $[(a,b)]+[(c,d)]=[(ad+bc,bd)]$.'
            answer_contract: {"kind":"written"}
            answer: 'Take related pairs for each class. Show that the two sum pairs are related by cross multiplication.'
            solution_sketch: 'Let $ab''=a''b$ and $cd''=c''d$. The two sum pairs are $(ad+bc,bd)$ and $(a''d''+b''c'',b''d'')$. Cross multiplication gives $(ad+bc)b''d''=ab''dd''+bb''cd''$. Replace $ab''$ by $a''b$ and $cd''$ by $c''d$ to get $(a''d''+b''c'')bd$. This is the step that Proposition 5.2 leaves open for addition.'
        constraints: 'cross-multiplication tests, sum and product pairs, results for related pairs'
      - id: kp2
        name: 'Definition 5.3: the rational numbers as classes of pairs'
        key_prerequisites: []
        exemplars:
          - problem: 'Use the rules $[(a,b)]+[(c,d)]=[(ad+bc,bd)]$ and $[(a,b)]\cdot[(c,d)]=[(ac,bd)]$ for $[(1,2)]$ and $[(2,3)]$. Give (a) the first and (b) the second entry of the sum pair. Give (c) the first and (d) the second entry of the product pair.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}}]}
            answer: 'a = 7; b = 6; c = 2; d = 6'
            solution_sketch: 'Put $a=1$, $b=2$, $c=2$, $d=3$. The sum pair is $(1\cdot3+2\cdot2,\,6)=(7,6)$. The product pair is $(1\cdot2,\,2\cdot3)=(2,6)$. So the key is 7, 6, 2, 6.'
          - problem: 'Add $[(3,4)]$ and $[(0,5)]$ with the rule $[(a,b)]+[(c,d)]=[(ad+bc,bd)]$. Give (a) the first and (b) the second entry of the sum pair. Give (c) 1 if the sum pair is related to $(3,4)$ by $ad=bc$ and 0 if not.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 15; b = 20; c = 1'
            solution_sketch: 'The sum pair is $(3\cdot5+4\cdot0,\,4\cdot5)=(15,20)$. Then $15\cdot4=60$ and $20\cdot3=60$. The pairs are related, so the key is 15, 20, 1.'
          - problem: 'Add $[(4,6)]$ and $[(1,3)]$ with the rule $[(a,b)]+[(c,d)]=[(ad+bc,bd)]$. Give (a) the first and (b) the second entry of the sum pair. Give (c) 1 if the sum pair is related to $(1,1)$ by $ad=bc$ and 0 if not.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 18; b = 18; c = 1'
            solution_sketch: 'The sum pair is $(4\cdot3+6\cdot1,\,6\cdot3)=(18,18)$. Then $18\cdot1=18\cdot1$, so the pair is related to $(1,1)$. The key is 18, 18, 1.'
          - problem: 'Add $[(-1,2)]$ and $[(1,2)]$ with the rule $[(a,b)]+[(c,d)]=[(ad+bc,bd)]$. Give (a) the first and (b) the second entry of the sum pair. Give (c) 1 if the sum pair is related to $(0,1)$ by $ad=bc$ and 0 if not.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 0; b = 4; c = 1'
            solution_sketch: 'The sum pair is $((-1)\cdot2+2\cdot1,\,2\cdot2)=(0,4)$. Then $0\cdot1=4\cdot0$, so the pair is related to $(0,1)$. The key is 0, 4, 1.'
          - problem: 'Multiply $[(-2,3)]$ and $[(3,-4)]$ with the rule $[(a,b)]\cdot[(c,d)]=[(ac,bd)]$. Give (a) the first and (b) the second entry of the product pair. Give (c) 1 if the product pair is related to $(1,2)$ by $ad=bc$ and 0 if not.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = -6; b = -12; c = 1'
            solution_sketch: 'The product pair is $((-2)\cdot3,\,3\cdot(-4))=(-6,-12)$. Then $(-6)\cdot2=-12$ and $(-12)\cdot1=-12$. The pairs are related, so the key is -6, -12, 1.'
          - problem: 'Count the different classes $[(a,b)]$ that arise when $a$ and $b$ run over the given sets. (a) $a\in\{1,2,3\}$ and $b\in\{1,2,3\}$. (b) $a\in\{1,2\}$ and $b\in\{1,2,3,4\}$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}}]}
            answer: 'a = 7; b = 6'
            solution_sketch: 'List the fractions $a/b$ and remove equal values. In (a), the values are $1,\,1/2,\,1/3,\,2,\,2/3,\,3,\,3/2$, which is 7 classes. In (b), the values are $1,\,1/2,\,1/3,\,1/4,\,2,\,2/3$, which is 6 classes.'
          - problem: 'Find the integer $x$ in each case. Use the sum rule $[(a,b)]+[(c,d)]=[(ad+bc,bd)]$ and the product rule $[(a,b)]\cdot[(c,d)]=[(ac,bd)]$. (a) $[(2,3)]+[(x,6)]=[(1,1)]$. (b) $[(x,5)]\cdot[(5,3)]=[(4,3)]$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}}]}
            answer: 'a = 2; b = 4'
            solution_sketch: 'In (a), the sum pair is $(12+3x,\,18)$. It is related to $(1,1)$ when $12+3x=18$, so $x=2$. In (b), the product pair is $(5x,\,15)$. It is related to $(4,3)$ when $15x=60$, so $x=4$.'
        constraints: 'sums and products of classes of pairs, counts of classes'
      - id: kp3
        name: 'Theorem 5.4: the laws of arithmetic for rational numbers'
        key_prerequisites: []
        exemplars:
          - problem: 'For the class $[(3,7)]$, the pair $(-3,7)$ gives its additive inverse. Add the two classes with $[(a,b)]+[(c,d)]=[(ad+bc,bd)]$. Give (a) the first and (b) the second entry of the inverse pair. Give (c) the first and (d) the second entry of the sum pair.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}}]}
            answer: 'a = -3; b = 7; c = 0; d = 49'
            solution_sketch: 'The inverse pair is $(-3,7)$. The sum pair is $(3\cdot7+7\cdot(-3),\,7\cdot7)=(0,49)$. The first entry is 0, so the sum is the zero class. The key is -3, 7, 0, 49.'
          - problem: 'For the class $[(-2,5)]$, swap the entries of the pair to get its multiplicative inverse. Give (a) the first and (b) the second entry of the swapped pair. Give (c) the first entry of the product pair, built with $[(a,b)]\cdot[(c,d)]=[(ac,bd)]$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 5; b = -2; c = -10'
            solution_sketch: 'The swapped pair is $(5,-2)$. The product pair is $((-2)\cdot5,\,5\cdot(-2))=(-10,-10)$. This pair is related to $(1,1)$. The key is 5, -2, -10.'
          - problem: 'Add $[(5,8)]$ and $[(0,3)]$ with the rule $[(a,b)]+[(c,d)]=[(ad+bc,bd)]$. Give (a) the first and (b) the second entry of the sum pair. Give (c) 1 if the sum pair is related to $(5,8)$ by $ad=bc$ and 0 if not.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 15; b = 24; c = 1'
            solution_sketch: 'The sum pair is $(5\cdot3+8\cdot0,\,8\cdot3)=(15,24)$. Then $15\cdot8=120$ and $24\cdot5=120$. So adding the zero class keeps the class, and the key is 15, 24, 1.'
          - problem: 'Decide for each class whether it has a multiplicative inverse among the rational numbers. Give 1 if it has one and 0 if not. (a) $[(0,5)]$. (b) $[(4,-6)]$. (c) $[(-7,-7)]$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 0; b = 1; c = 1'
            solution_sketch: 'A class has an inverse when its first entry is not zero in the pair. In (a), the first entry is 0, so the class is the zero class and the key is 0. In (b), the first entry 4 is nonzero, so the key is 1. In (c), $-7$ is nonzero, so the key is 1.'
          - problem: 'Compute $[(1,2)]\cdot([(1,3)]+[(1,6)])$ in two ways. First add, then multiply. Give (a) the first and (b) the second entry of the result pair. Second, multiply each term first, then add. Give (c) the first and (d) the second entry of that result pair.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}}]}
            answer: 'a = 9; b = 36; c = 18; d = 72'
            solution_sketch: 'First way: $[(1,3)]+[(1,6)]=[(9,18)]$ and then $[(1,2)]\cdot[(9,18)]=[(9,36)]$. Second way: the products are $[(1,6)]$ and $[(1,12)]$, and their sum is $[(18,72)]$. Both pairs are related because $9\cdot72=648=36\cdot18$. The key is 9, 36, 18, 72.'
          - problem: 'Compute $([(1,2)]+[(1,3)])+[(1,4)]$ and $[(1,2)]+([(1,3)]+[(1,4)])$ with the sum rule. Give for the first sum (a) the first and (b) the second entry of the result pair. Give for the second sum (c) the first and (d) the second entry of the result pair.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}}]}
            answer: 'a = 26; b = 24; c = 26; d = 24'
            solution_sketch: 'First sum: $[(1,2)]+[(1,3)]=[(5,6)]$, then $[(5,6)]+[(1,4)]=[(26,24)]$. Second sum: $[(1,3)]+[(1,4)]=[(7,12)]$, then $[(1,2)]+[(7,12)]=[(26,24)]$. The key is 26, 24, 26, 24.'
          - problem: 'Find the additive inverse of the sum. The sum is $[(1,2)]+[(1,3)]$. Build the inverse by changing the sign of the first entry of the sum pair. Give (a) the first and (b) the second entry of this pair. Add the inverses $[(-1,2)]$ and $[(-1,3)]$ instead. Give (c) the first and (d) the second entry of that sum pair.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}}]}
            answer: 'a = -5; b = 6; c = -5; d = 6'
            solution_sketch: 'The sum is $[(5,6)]$, so its inverse is $[(-5,6)]$. The sum of the inverses has the pair $((-1)\cdot3+2\cdot(-1),\,6)=(-5,6)$. The key is -5, 6, -5, 6.'
          # argument: Theorem 5.4
          - problem: 'Prove: addition and multiplication of rational numbers are associative and commutative. Prove also that 0 and 1 are neutral elements and that every class has an additive inverse. Show that every nonzero class has a multiplicative inverse and that multiplication distributes over addition.'
            answer_contract: {"kind":"written"}
            answer: 'Write each law with representative pairs. Both sides give pairs that are equal or related by cross multiplication, by the laws of the integers.'
            solution_sketch: 'Take representative pairs for each class and apply the sum and product rules of Definition 5.3. Each law reduces to an identity of integers, such as $(ad+bc)f+bd\,e=a\,df+b(cf+de)$ for associativity. The neutral element $[(0,1)]$ gives $(a\cdot1+b\cdot0,\,b)$. The inverse $[(-a,b)]$ gives the pair $(0,b^2)$. The inverse $[(b,a)]$ of a nonzero class gives the pair $(ab,ab)$, which is related to $(1,1)$. Distributivity needs the factor $b$ in front of the common denominator, which is the step of Proposition 5.2.'
          # source: FoM exercise 5.1-5-3
          - problem: 'Show each law of the field axioms for the rational numbers. (a) Addition is associative. (b) Addition is commutative. (c) The class $[(0,1)]$ is neutral for addition. (d) The class $[(-a,b)]$ is the additive inverse of $[(a,b)]$. (e) Multiplication is associative. (f) Multiplication is commutative. (g) The class $[(1,1)]$ is neutral for multiplication. (h) The class $[(b,a)]$ is the multiplicative inverse of a nonzero $[(a,b)]$. (i) Multiplication distributes over addition.'
            answer_contract: {"kind":"written"}
            answer: 'Compute both sides of each law with the pair rules. Reduce each law to an identity between integers.'
            solution_sketch: 'Use Theorem 5.4 as the goal and the rules of Definition 5.3. For (a), both sides give $(adf+bcf+bde,\,bdf)$. For (b) and (f), the integer laws swap the entries. For (c) and (g), the pairs $(a,b)$ come back. For (d) and (h), the pairs are $(0,b^2)$ and $(ab,ab)$. For (i), both sides reduce to the same pair after a common factor.'
        constraints: 'inverses, neutral classes, associativity and distributivity on concrete classes'
      - id: kp4
        name: 'Theorem 5.5: the integers inside the rational numbers'
        key_prerequisites: [fom-4-2-groups-rings]
        exemplars:
          - problem: 'Let $f(a)=[(a,1)]$ for every integer $a$. Add $f(3)$ and $f(4)$ with the rule $[(a,b)]+[(c,d)]=[(ad+bc,bd)]$. Give (a) the first and (b) the second entry of the sum pair. Give (c) the integer $x$ with $f(x)=f(3)+f(4)$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 7; b = 1; c = 7'
            solution_sketch: 'The sum pair is $(3\cdot1+1\cdot4,\,1)=(7,1)$. That pair is $f(7)$. The key is 7, 1, 7.'
          - problem: 'Let $f(a)=[(a,1)]$ for every integer $a$. Multiply $f(-2)$ and $f(5)$ with the rule $[(a,b)]\cdot[(c,d)]=[(ac,bd)]$. Give (a) the first and (b) the second entry of the product pair.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}}]}
            answer: 'a = -10; b = 1'
            solution_sketch: 'The product pair is $((-2)\cdot5,\,1\cdot1)=(-10,1)$. That pair is $f(-10)$. The key is -10, 1.'
          - problem: 'Let $f(a)=[(a,1)]$. Find the integer $x$ in each case. The relation $(a,b)\sim(c,d)$ means $ad=bc$. (a) $f(x)=[(21,3)]$. (b) $f(x)=[(-30,5)]$. (c) $f(x)=[(0,9)]$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 7; b = -6; c = 0'
            solution_sketch: 'Write $(x,1)\sim(c,d)$ as $xd=c$. In (a), $3x=21$, so $x=7$. In (b), $5x=-30$, so $x=-6$. In (c), $9x=0$, so $x=0$.'
          - problem: 'Let $f(a)=[(a,1)]$. A class $[(c,d)]$ lies in the set of all values of $f$ when some integer $x$ gives $xd=c$. Give 1 if the class lies in this set and 0 if not. (a) $[(6,4)]$. (b) $[(8,4)]$. (c) $[(-9,3)]$. (d) $[(1,2)]$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}}]}
            answer: 'a = 0; b = 1; c = 1; d = 0'
            solution_sketch: 'Test whether $d$ divides $c$. In (a), 4 does not divide 6, so the key is 0. In (b), $8=2\cdot4$, so the key is 1. In (c), $-9=(-3)\cdot3$, so the key is 1. In (d), 2 does not divide 1, so the key is 0.'
          - problem: 'Let $f(a)=[(a,1)]$. Give (a) the first entry of the sum pair of $f(2)+f(-5)$ built with $[(a,b)]+[(c,d)]=[(ad+bc,bd)]$. Give (b) the first entry and (c) the second entry of the product pair of $f(-3)\cdot f(4)$ built with $[(a,b)]\cdot[(c,d)]=[(ac,bd)]$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = -3; b = -12; c = 1'
            solution_sketch: 'The sum pair is $(2\cdot1+1\cdot(-5),\,1)=(-3,1)$, so it equals $f(2+(-5))$. The product pair is $((-3)\cdot4,\,1)=(-12,1)$, so it equals $f((-3)\cdot4)$. The key is -3, -12, 1.'
          - problem: 'Let $f(a)=[(a,1)]$. Give (a) the number of different classes among $f(-2),f(-1),f(0),f(1),f(2),f(2),f(-1)$. Give (b) the number of integers $a$ with $f(a)=[(0,1)]$. Give (c) the number of integers $a$ with $f(a)+f(a)=f(a)$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 5; b = 1; c = 1'
            solution_sketch: 'Two values $f(a)$ and $f(b)$ are equal only when $a=b$. The list has the values $-2,-1,0,1,2$ and repeats, so (a) is 5. Only $a=0$ gives the class $[(0,1)]$, so (b) is 1. The equation $2a=a$ holds only for $a=0$, so (c) is 1.'
          - problem: 'Let $f(a)=[(a,1)]$. Find the integer $x$ in each case. (a) $f(x)=[(0,1)]$. (b) $f(x)=[(1,1)]$. (c) $f(x)\cdot f(6)=f(24)$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 0; b = 1; c = 4'
            solution_sketch: 'In (a), $x\cdot1=0$, so $x=0$. In (b), $x\cdot1=1$, so $x=1$. In (c), the product is $f(6x)$, so $6x=24$ and $x=4$.'
          # argument: Theorem 5.5
          - problem: 'Prove: the function $f(a)=[(a,1)]$ is a ring isomorphism from the integers onto the set of classes $[(a,1)]$. It keeps sums and products.'
            answer_contract: {"kind":"written"}
            answer: 'Show that f is injective and onto by the definition of the set. Show f(x+y)=f(x)+f(y) and f(xy)=f(x)f(y) with the pair rules.'
            solution_sketch: 'Injective: $[(x,1)]=[(y,1)]$ means $x\cdot1=1\cdot y$, so $x=y$. Onto: every class in the set has the form $[(a,1)]=f(a)$. Sums: $f(x)+f(y)=[(x+y,1)]=f(x+y)$ by Definition 5.3. Products: $f(x)f(y)=[(xy,1)]=f(xy)$. A bijection that keeps both operations is an isomorphism of rings,.'
          # source: FoM exercise 5.1-5-4
          - problem: 'Let $f(a)=[(a,1)]$ for every integer $a$. Prove step by step. (a) $f$ is injective. (b) $f$ is surjective onto the set of classes $[(a,1)]$. (c) $f(x+y)=f(x)+f(y)$. (d) $f(xy)=f(x)f(y)$. (e) $f$ is an isomorphism.'
            answer_contract: {"kind":"written"}
            answer: 'Use cross multiplication for injective, and the pair rules of Definition 5.3 for sums and products. Combine the parts for the isomorphism.'
            solution_sketch: 'For (a), $[(x,1)]=[(y,1)]$ gives $x=y$. For (b), each class $[(a,1)]$ equals $f(a)$ by definition. For (c), the sum rule gives $[(x\cdot1+1\cdot y,\,1)]$. For (d), the product rule gives $[(xy,1)]$. Parts (a) to (d) show that $f$ is a bijection that keeps both operations. This is Theorem 5.5.'
        constraints: 'the map from a to the class of the pair a and 1, values and sums'
      - id: kp5
        name: 'Definition 5.6 and Theorem 5.7: the rational numbers are countable'
        key_prerequisites: [fom-4-6-countable-sets]
        exemplars:
          - problem: 'Take all pairs $(n,d)$ with $n\in\{-2,-1,0,1,2\}$ and $d\in\{1,2,3\}$. Give (a) the number of pairs. Give (b) the number of different classes $[(n,d)]$ among them.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}}]}
            answer: 'a = 15; b = 11'
            solution_sketch: 'There are $5\cdot3=15$ pairs. The values $n/d$ are $-2,-1,0,1,2$ for $d=1$, then $-1,-1/2,0,1/2,1$ for $d=2$, then $-2/3,-1/3,0,1/3,2/3$ for $d=3$. Removing repeats leaves 11 values. The key is 15, 11.'
          - problem: 'The natural numbers inside the rational numbers are the classes $[(a,1)]$ with a natural number $a$. A class $[(c,d)]$ with positive $d$ is such a class when $d$ divides $c$ and the quotient is positive. Give 1 if the class is in this set and 0 if not. (a) $[(6,2)]$. (b) $[(-4,1)]$. (c) $[(5,10)]$. (d) $[(21,7)]$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 0; c = 0; d = 1'
            solution_sketch: 'In (a), $6/2=3$, so the key is 1. In (b), the quotient $-4$ is negative, so the key is 0. In (c), 10 does not divide 5, so the key is 0. In (d), $21/7=3$, so the key is 1.'
          - problem: 'The integers inside the rational numbers are the classes $[(a,1)]$ with an integer $a$. Find the integer $a$ in each case. The relation $(a,b)\sim(c,d)$ means $ad=bc$. (a) $[(a,1)]=[(-18,6)]$. (b) $[(a,1)]=[(35,-7)]$. (c) $[(a,1)]=[(0,-4)]$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = -3; b = -5; c = 0'
            solution_sketch: 'Write each case as $a\cdot d=c$. In (a), $6a=-18$, so $a=-3$. In (b), $-7a=35$, so $a=-5$. In (c), $-4a=0$, so $a=0$.'
          - problem: 'Count the pairs $(n,d)$ with an integer $n$ and a positive integer $d$ such that $|n|+d$ has a given value. (a) The value is 4. (b) The value is 3. (c) The value is 2.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 7; b = 5; c = 3'
            solution_sketch: 'For each $d$, the number $|n|$ equals the value minus $d$. For value 4: $d=1,2,3$ give two choices of $n$ each, and $d=4$ gives $n=0$, so 7. For value 3: $d=1,2$ give two choices each, and $d=3$ gives one, so 5. For value 2: $d=1$ gives two choices and $d=2$ gives one, so 3.'
          - problem: 'Take the classes $[(n,d)]$ where $n\in\{1,2\}$ and $d\in\{1,2,3,4\}$. Give (a) the number of pairs. Give (b) the number of different classes among them. Give (c) the number of different classes among them that are not equal to $[(1,2)]$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 8; b = 6; c = 5'
            solution_sketch: 'There are $2\cdot4=8$ pairs. The values $n/d$ are $1,1/2,1/3,1/4,2,1,2/3,1/2$. Removing repeats leaves $1,1/2,1/3,1/4,2,2/3$, which is 6 classes. Removing the class $1/2$ leaves 5. The key is 8, 6, 5.'
          - problem: 'A list of the integers starts with $0,1,-1,2,-2,3,-3,\dots$ and continues in the same pattern. Positions start at 1. Give (a) the entry at position 10. Give (b) the position of $-4$. Give (c) the position of $7$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 5; b = 9; c = 14'
            solution_sketch: 'Position 1 holds 0. Position $2k$ holds $k$ and position $2k+1$ holds $-k$. So position 10 holds 5. The number $-4$ is at position $2\cdot4+1=9$. The number 7 is at position $2\cdot7=14$.'
          - problem: 'List all pairs $(m,n)$ of positive integers in this order. Pairs with a smaller sum $m+n$ come first. Pairs with the same sum come in order of increasing $m$. Positions start at 1. Give (a) the position of $(2,3)$. Give (b) the first entry $m$ and (c) the second entry $n$ of the pair at position 10.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 8; b = 4; c = 1'
            solution_sketch: 'Sums 2, 3 and 4 hold $1+2+3=6$ pairs. Sum 5 holds the pairs $(1,4),(2,3),(3,2),(4,1)$ at positions 7 to 10. So $(2,3)$ is at position 8. The pair at position 10 is $(4,1)$, so the key is 8, 4, 1.'
          # argument: Theorem 5.7
          - problem: 'Prove: the set of rational numbers is countable.'
            answer_contract: {"kind":"written"}
            answer: 'Write the rationals as a union over n of the classes with first entry n. Each part is countable, and a countable union of countable sets is countable.'
            solution_sketch: 'For each integer $n$, the set $\{[(n,d)]:d\neq0\}$ is the image of the countable set of nonzero integers. The rational numbers are the union of these sets over all integers $n$. The index set of integers is countable. Theorem 4.60 gives that a union of countably many countable sets is countable, and Theorem 4.65 gives the same for the image of a countable set. So the rational numbers are countable.'
        constraints: 'integers and natural numbers inside the rationals, counting pairs, listings'
    diagnostic_exemplar:
      problem: 'Add $[(2,3)]$ and $[(1,4)]$ with $[(a,b)]+[(c,d)]=[(ad+bc,bd)]$. Give (n) the first and (d) the second entry of the sum pair.'
      answer_contract: {"kind":"multipart","parts":[{"name":"n","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}}]}
      answer: 'n = 11; d = 12'
      solution_sketch: 'The sum pair is $(2\cdot4+3\cdot1,\,3\cdot4)=(11,12)$. So the first entry is 11 and the second entry is 12.'
