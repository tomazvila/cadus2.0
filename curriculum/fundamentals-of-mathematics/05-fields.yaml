    knowledge_points:
      - id: kp1
        name: 'Definition 5.8 and Theorem 5.9: the field axioms and no zero divisors'
        key_prerequisites: [fom-4-2-groups-rings]
        exemplars:
          - problem: 'Compute in $\mathbb{Z}_{7}$. Give each answer as a number from 0 to 6. (a) $3+5$. (b) $3\cdot 5$. (c) The additive inverse of 3. (d) The multiplicative inverse of 3.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 1; c = 4; d = 5'
            solution_sketch: 'Compute with remainders mod 7. We get $3+5=8=1$ and $3\cdot 5=15=1$. The additive inverse of 3 is 4, since $3+4=7=0$. The multiplicative inverse of 3 is 5, since $3\cdot 5=1$.'
          - problem: 'Give each truth value as 1 for true and 0 for false. Each structure has the usual addition and multiplication. (a) The rational numbers form a field. (b) The integers form a field. (c) The real numbers form a field. (d) The natural numbers form a field.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 0; c = 1; d = 0'
            solution_sketch: 'A field needs a multiplicative inverse for every nonzero element. The integers fail this, because 2 has no inverse in them, so (b) gets 0. The natural numbers have no additive inverses, so (d) gets 0. The rational and real numbers pass every axiom, so (a) and (c) get 1.'
          - problem: 'In $\mathbb{Z}_{11}$ the product $ab$ is 0 and $a=4$. In $\mathbb{Z}_{13}$ consider the equation $5x=1$. (a) Give the number $b$ from 0 to 10 in the first case. (b) Give the number $x$ from 0 to 12 in the second case.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}}]}
            answer: 'a = 0; b = 8'
            solution_sketch: 'A field has no zero divisors. Since $a=4$ is not 0, the factor $b$ must be 0, so a = 0. In $\mathbb{Z}_{13}$ we have $5\cdot 8=40=39+1=1$, so x = 8.'
          - problem: 'Look at the pairs $(a,b)$ with $a,b\in\{1,2,3,4,5\}$ and $ab$ divisible by 6. (a) Count these pairs. Now look at the elements $x$ of $\mathbb{Z}_{7}$ with $x^2=0$. (b) Count these elements.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}}]}
            answer: 'a = 4; b = 1'
            solution_sketch: 'The pairs are $(2,3)$, $(3,2)$, $(3,4)$ and $(4,3)$, which makes 4. In $\mathbb{Z}_{7}$ the product $x\cdot x=0$ forces $x=0$, since 7 is prime, so the count is 1.'
          - problem: 'Count the elements $x$ of the ring with $x^2=0$. (a) In $\mathbb{Z}_{7}$. (b) In $\mathbb{Z}_{8}$. (c) In $\mathbb{Z}_{9}$. (d) In $\mathbb{Z}_{12}$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 2; c = 3; d = 2'
            solution_sketch: 'In $\mathbb{Z}_{7}$ only $x=0$ works. In $\mathbb{Z}_{8}$ the elements 0 and 4 work. In $\mathbb{Z}_{9}$ the elements 0, 3 and 6 work. In $\mathbb{Z}_{12}$ the elements 0 and 6 work.'
          - problem: 'A field $F$ has elements $a$ and $b$ with $ab=0$. Give each truth value as 1 for true and 0 for false. (a) If $a\ne 0$, then $b=0$. (b) If $a\ne 0$ and $b\ne 0$, then $ab\ne 0$. (c) There are nonzero elements $a$ and $b$ of $F$ with $ab=0$. (d) The element 1 differs from the element 0.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 1; c = 0; d = 1'
            solution_sketch: 'A field has no zero divisors, so a nonzero factor forces the other factor to be 0. This gives (a) and (b) the value 1. Nonzero elements with product 0 do not exist, so (c) gets 0. Axiom 7 of Definition 5.8 gives $1\ne 0$, so (d) gets 1.'
          # argument: Theorem 5.9
          - problem: 'Prove: if $a$ and $b$ are elements of a field and their product is 0, then $a=0$ or $b=0$.'
            answer_contract: {"kind":"written"}
            answer: 'Assume a is not 0. Then a has an inverse, and multiplying the equation ab=0 by that inverse gives b=0.'
            solution_sketch: 'Let $ab=0$ and assume $a\ne 0$. By axiom 8 of Definition 5.8, $a$ has an inverse $a^{-1}$. Then $b=1\cdot b=a^{-1}ab=a^{-1}\cdot 0=0$. So $a=0$ or $b=0$.'
          # source: FoM exercise 5.2-5-5
          - problem: 'Prove: in a field, $(x+y)a=xa+ya$ for all elements $a,x,y$. Use only the axioms of Definition 5.8.'
            answer_contract: {"kind":"written"}
            answer: 'Commutativity of multiplication turns the product around, left distributivity splits it, and commutativity turns the two products back.'
            solution_sketch: 'Start with $(x+y)a$. Commutativity of multiplication gives $(x+y)a=a(x+y)$. Left distributivity gives $a(x+y)=ax+ay$. Commutativity gives $ax=xa$ and $ay=ya$. So $(x+y)a=xa+ya$.'
          # source: FoM exercise 5.2-5-6
          - problem: 'Prove: in a field, if $ac=bc$ and $c\ne 0$, then $a=b$.'
            answer_contract: {"kind":"written"}
            answer: 'Multiply both sides of ac=bc by the inverse of c. Since c times its inverse is 1, this gives a=b.'
            solution_sketch: 'The element $c$ is nonzero, so it has an inverse $c^{-1}$ by Definition 5.8. Multiply both sides of $ac=bc$ by $c^{-1}$. We get $a(cc^{-1})=b(cc^{-1})$, so $a\cdot 1=b\cdot 1$. So $a=b$. Theorem 5.9 gives a second route, with $(a-b)c=0$.'
        constraints: 'Compute with the field axioms in small rings, decide field status and count zero divisors; proofs use inverses.'
      - id: kp2
        name: 'Example 5.10 and Proposition 5.11: prime moduli and the element 0'
        key_prerequisites: [fom-4-2-groups-rings, fom-3-9-public-key-encryption, fom-5-1-arithmetic-rational-numbers]
        exemplars:
          - problem: 'Give each truth value as 1 for true and 0 for false. (a) $\mathbb{Z}_{2}$ is a field. (b) $\mathbb{Z}_{9}$ is a field. (c) $\mathbb{Z}_{11}$ is a field. (d) $\mathbb{Z}_{15}$ is a field.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 0; c = 1; d = 0'
            solution_sketch: 'The ring $\mathbb{Z}_{m}$ is a field exactly when $m$ is prime. The numbers 2 and 11 are prime, so (a) and (c) get 1. The number 9 is $3\cdot 3$ and 15 is $3\cdot 5$, so (b) and (d) get 0.'
          - problem: 'Look at the numbers $m$ from 2 to 20. (a) Count the $m$ for which $\mathbb{Z}_{m}$ is a field. Look at the numbers $m$ from 2 to 30. (b) Give the largest $m$ for which $\mathbb{Z}_{m}$ is a field.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}}]}
            answer: 'a = 8; b = 29'
            solution_sketch: 'The ring is a field exactly when $m$ is prime. The primes up to 20 are 2, 3, 5, 7, 11, 13, 17, 19, which makes 8. The largest prime up to 30 is 29.'
          - problem: 'In $\mathbb{Z}_{15}$ the product $5a$ is 0 for a nonzero element $a$ with $a<5$. (a) Give $a$. In $\mathbb{Z}_{21}$ the product $7b$ is 0 for a nonzero element $b$ with $b<4$. (b) Give $b$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}}]}
            answer: 'a = 3; b = 3'
            solution_sketch: 'We need $5a$ divisible by 15, so $a=3$ gives $15=0$. We need $7b$ divisible by 21, so $b=3$ gives $21=0$. Such factors exist because 15 and 21 are not prime.'
          - problem: 'In $\mathbb{Z}_{11}$ give the multiplicative inverse of each element, as a number from 1 to 10. (a) 2. (b) 3. (c) 5. (d) 10.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}}]}
            answer: 'a = 6; b = 4; c = 9; d = 10'
            solution_sketch: 'Look for the partner with product 1 mod 11. We get $2\cdot 6=12=1$ and $3\cdot 4=12=1$. We get $5\cdot 9=45=1$ and $10\cdot 10=100=1$.'
          - problem: 'Let $F$ be a field. Give each truth value as 1 for true and 0 for false. (a) The element 0 has a multiplicative inverse. (b) $0\cdot a=0$ for every $a\in F$. (c) The equation $0\cdot x=1$ has a solution in $F$. (d) Every nonzero element of $F$ has a multiplicative inverse.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}}]}
            answer: 'a = 0; b = 1; c = 0; d = 1'
            solution_sketch: 'By Proposition 5.11 the element 0 has no inverse, so (a) gets 0. In every ring $0\cdot a=0$, so (b) gets 1. Since $0\cdot x=0\ne 1$, the equation in (c) has no solution and gets 0. Axiom 8 gives (d) the value 1.'
          - problem: 'Count the solutions $x$ in $\mathbb{Z}_{7}$ of each equation. (a) $0\cdot x=1$. (b) $3x=1$. (c) $x^2=1$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 0; b = 1; c = 2'
            solution_sketch: 'The product $0\cdot x$ is always 0, so (a) has 0 solutions. Only $x=5$ solves $3x=1$, so (b) is 1. The solutions of $x^2=1$ are $x=1$ and $x=6$, so (c) is 2.'
          - problem: 'Count the elements with a multiplicative inverse. (a) In $\mathbb{Z}_{13}$. (b) In $\mathbb{Z}_{12}$. (c) In $\mathbb{Z}_{15}$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 12; b = 4; c = 8'
            solution_sketch: 'An element $x$ has an inverse mod $m$ exactly when $x$ and $m$ share no factor above 1. In $\mathbb{Z}_{13}$ this holds for 1 to 12, which makes 12. In $\mathbb{Z}_{12}$ the elements are 1, 5, 7, 11, which makes 4. In $\mathbb{Z}_{15}$ the elements are 1, 2, 4, 7, 8, 11, 13, 14, which makes 8.'
          # argument: Proposition 5.11
          - problem: 'Prove: in a field, the element 0 has no multiplicative inverse.'
            answer_contract: {"kind":"written"}
            answer: 'Assume a is an inverse of 0. Then 1 = a times 0 = 0, which contradicts that 1 differs from 0.'
            solution_sketch: 'Assume that $a$ is a multiplicative inverse of 0. Then $1=a\cdot 0$ by the definition of an inverse. By Proposition 4.17 we have $a\cdot 0=0$, so $1=0$. This contradicts axiom 7 of Definition 5.8. So 0 has no inverse.'
        constraints: 'Decide which rings of remainders are fields, find inverses and zero divisors; 0 has no inverse.'
      - id: kp3
        name: 'Definition 5.12 and Theorem 5.13: the characteristic and the copy of the rational numbers'
        key_prerequisites: [fom-5-1-arithmetic-rational-numbers]
        exemplars:
          - problem: 'Give the characteristic of each field. (a) $\mathbb{Z}_{5}$. (b) $\mathbb{Z}_{13}$. (c) The rational numbers. (d) The real numbers.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}}]}
            answer: 'a = 5; b = 13; c = 0; d = 0'
            solution_sketch: 'In $\mathbb{Z}_{5}$ the sum of five ones is 0 and no shorter sum is 0, so the value is 5. The same argument gives 13 for $\mathbb{Z}_{13}$. No sum of ones is 0 in the rational or real numbers, so those fields get 0.'
          - problem: 'Compute the sum of ones as a number. (a) Four ones in $\mathbb{Z}_{5}$. (b) Five ones in $\mathbb{Z}_{5}$. (c) Nine ones in $\mathbb{Z}_{7}$. (d) Fourteen ones in $\mathbb{Z}_{7}$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}}]}
            answer: 'a = 4; b = 0; c = 2; d = 0'
            solution_sketch: 'Reduce the count mod the prime. Four ones in $\mathbb{Z}_{5}$ give 4, and five ones give $5=0$. Nine ones in $\mathbb{Z}_{7}$ give $9=2$. Fourteen ones give $14=0$.'
          - problem: 'Let $F$ be a field of characteristic 0. Give each truth value as 1 for true and 0 for false. (a) $1+1\ne 0$ in $F$. (b) The sum of ten ones is not 0. (c) $F$ is finite. (d) Two sums of ones with different numbers of terms are different.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 1; c = 0; d = 1'
            solution_sketch: 'In characteristic 0 no sum of ones is 0, so (a) and (b) get 1. The sums of ones are all different and give infinitely many elements, so (c) gets 0. Equal sums with different numbers of terms give a difference that is a sum of ones equal to 0, so (d) gets 1.'
          - problem: 'Let $F$ be a field of characteristic 7. (a) Count the numbers $n$ from 1 to 50 for which the sum of $n$ ones is 0. (b) Give the smallest positive $n$ for which the sum of $n$ ones is 0. (c) Give the sum of fifty ones as a number from 0 to 6.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 7; b = 7; c = 1'
            solution_sketch: 'The sum of $n$ ones is 0 exactly when $n$ is a multiple of 7. The multiples up to 50 are 7, 14, ..., 49, which makes 7. The smallest is 7. Since $50=49+1$, the sum of fifty ones equals 1.'
          - problem: 'Work in a field $F$ with characteristic 5. Put $a=3\cdot 1$. Give each sum as a number from 0 to 4. (a) The sum of 5 copies of $a$. (b) The sum of 7 copies of $a$. (c) The sum of 100 copies of the element $4\cdot 1$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 0; b = 1; c = 0'
            solution_sketch: 'The sum of 5 copies of $a$ is $5\cdot 3=15=0$. Seven copies give $21=1$. One hundred copies of $4$ give $400=0$, because 100 is a multiple of 5.'
          - problem: 'For each number $n$ give 1 if a field of characteristic $n$ exists and 0 if not. (a) $n=6$. (b) $n=11$. (c) $n=9$. (d) $n=0$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}}]}
            answer: 'a = 0; b = 1; c = 0; d = 1'
            solution_sketch: 'A nonzero characteristic is a prime number. The numbers 6 and 9 are not prime, so (a) and (c) get 0. The field $\mathbb{Z}_{11}$ has characteristic 11 and the rational numbers have characteristic 0, so (b) and (d) get 1.'
          # source: FoM exercise 5.2-5-10
          - problem: 'Work in the rational numbers. (a) Give the solution of $3x+2=4$ as a fraction. (b) Count the solutions of $x^2-2=0$. (c) Count the solutions of $x^2+1=0$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 2/3; b = 0; c = 0'
            solution_sketch: 'From $3x+2=4$ we get $3x=2$, so $x=2/3$. The solutions of $x^2=2$ are not rational, so (b) is 0. The equation $x^2=-1$ has no real solution, so (c) is 0.'
          # argument: Theorem 5.13
          - problem: 'Prove the first step: in a field $F$ of characteristic 0, the map that sends $n$ to the sum of $n$ ones is injective and keeps sums and products of natural numbers.'
            answer_contract: {"kind":"written"}
            answer: 'Distributivity carries sums and products over. Equal images of m<n give a sum of n-m ones equal to 0, against characteristic 0.'
            solution_sketch: 'Write $\varphi(n)$ for the sum of $n$ ones. Adding two such sums gives $\varphi(m+n)=\varphi(m)+\varphi(n)$. Distributivity gives $\varphi(mn)=\varphi(m)\varphi(n)$. Let $\varphi(m)=\varphi(n)$ with $m<n$. Then the sum of $n-m$ ones is 0, which contradicts Definition 5.12 for characteristic 0.'
          # argument: Theorem 5.13
          - problem: 'Prove the second step: a field $F$ of characteristic 0 holds a copy of the integers and of the rational numbers.'
            answer_contract: {"kind":"written"}
            answer: 'Send -n to minus the image of n. Send n over d to the image of n times the inverse of the image of d, which is nonzero.'
            solution_sketch: 'Extend $\varphi$ by $\varphi(0)=0$ and $\varphi(-n)=-\varphi(n)$. This gives an injective map from the integers that keeps sums and products. For a fraction $n/d$ with $d\ne 0$, the image of $d$ is nonzero, so it has an inverse. Define $\varphi(n/d)=\varphi(n)\varphi(d)^{-1}$. Equal fractions give equal images, and sums and products carry over by Proposition 5.15.'
          # source: FoM exercise 5.2-5-7
          - problem: 'A field $F$ has characteristic 0. For each natural number $n$, put $\varphi_N(n)$ equal to the sum of $n$ ones in $F$. (a) Prove that $\varphi_N$ is injective and keeps sums and products. (b) Extend $\varphi_N$ to the integers, and prove that the extension $\varphi_Z$ is injective and keeps sums and products. (c) Extend $\varphi_Z$ to the rational numbers, and prove the same for the extension $\varphi_Q$.'
            answer_contract: {"kind":"written"}
            answer: 'Distributivity carries sums and products over. Equal images give a positive sum of ones equal to 0, against characteristic 0.'
            solution_sketch: 'For (a), as in Theorem 5.13, use distributivity to get $\varphi_N(mn)=\varphi_N(m)\varphi_N(n)$; equal images give a sum of ones equal to 0, against characteristic 0. For (b), set $\varphi_Z(-n)=-\varphi_N(n)$ and check the four sign cases. For (c), set $\varphi_Q(n/d)=\varphi_Z(n)\varphi_Z(d)^{-1}$. Check that it is well defined, injective, and keeps sums and products by Proposition 5.15.'
          # source: FoM exercise 5.2-5-12
          - problem: 'A field $F$ has characteristic $n$ with $n\ne 0$. Prove that $n$ is a prime number.'
            answer_contract: {"kind":"written"}
            answer: 'If n=ab with a and b below n, the sum of n ones is a product of two sums of ones. One factor is 0, against minimality of n.'
            solution_sketch: 'Assume $n=ab$ with $1<a,b<n$. Then the sum of $n$ ones equals $(a\cdot 1)(b\cdot 1)$ by distributivity. This product is 0. By Theorem 5.9 one factor is 0. That contradicts that $n$ is the smallest number with a sum of ones equal to 0. So $n$ is prime.'
        constraints: 'Compute characteristics and sums of ones; proofs build the map from the natural numbers to a field.'
      - id: kp4
        name: 'Definition 5.14 and Proposition 5.15: fractions in a field'
        key_prerequisites: [fom-5-1-arithmetic-rational-numbers]
        exemplars:
          - problem: 'Compute in the rational numbers with the rules for sums and products of fractions. Give each answer as a fraction in lowest terms. (a) $\frac{2}{3}+\frac{4}{5}$. (b) $\frac{2}{3}\cdot\frac{4}{5}$. (c) $\frac{3}{4}\cdot\frac{8}{9}$. (d) $\frac{4}{5}+\frac{7}{10}$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}}]}
            answer: 'a = 22/15; b = 8/15; c = 2/3; d = 3/2'
            solution_sketch: 'Use $\frac{m}{c}+\frac{n}{d}=\frac{md+nc}{cd}$. For (a) we get $(10+12)/15=22/15$. For (b) we get $8/15$. For (c) we get $24/36=2/3$, and for (d) we get $(40+35)/50=3/2$.'
          - problem: 'Compute each fraction in $\mathbb{Z}_{7}$ as a number from 0 to 6. A fraction $n/d$ means $n$ times the inverse of $d$. (a) $2/3$. (b) $1/2$. (c) $3/5$. (d) $6/4$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}}]}
            answer: 'a = 3; b = 4; c = 2; d = 5'
            solution_sketch: 'The inverses mod 7 are $3^{-1}=5$, $2^{-1}=4$, $5^{-1}=3$ and $4^{-1}=2$. Then $2/3=10=3$ and $1/2=4$. Also $3/5=9=2$ and $6/4=12=5$.'
          - problem: 'Compute in $\mathbb{Z}_{11}$ as numbers from 0 to 10. (a) $\frac{1}{3}$. (b) $\frac{1}{6}$. (c) $\frac{1}{3}+\frac{1}{6}$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 4; b = 2; c = 6'
            solution_sketch: 'We have $3\cdot 4=12=1$, so $1/3=4$. We have $6\cdot 2=12=1$, so $1/6=2$. The sum is $4+2=6$.'
          - problem: 'Compute in $\mathbb{Z}_{13}$ as numbers from 0 to 12. (a) $\frac{5}{8}$. (b) $\frac{5}{8}+\frac{3}{4}$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}}]}
            answer: 'a = 12; b = 3'
            solution_sketch: 'We have $8\cdot 5=40=1$, so $5/8=25=12$. By the rule for sums, $5/8+3/4=(5\cdot 4+3\cdot 8)/32=44/32$. Mod 13 this is $5/6$. Since $6\cdot 11=66=1$, we get $5\cdot 11=55=3$.'
          - problem: 'Work in the rational numbers. (a) Compute $\frac{2}{1+1}$. (b) Compute $\frac{2}{1}+\frac{2}{1}$. (c) Give 1 if the two values are equal and 0 if not.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 4; c = 0'
            solution_sketch: 'We have $2/(1+1)=2/2=1$. We have $2/1+2/1=4$. The values 1 and 4 differ, so (c) gets 0. Splitting a sum in the denominator does not work.'
          - problem: 'Work in the rational numbers with $m=3$, $n=5$ and $d=2$. (a) Compute $\frac{m+n}{d}$. (b) Compute $\frac{m}{d}+\frac{n}{d}$. (c) Give 1 if the two values are equal and 0 if not.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 4; b = 4; c = 1'
            solution_sketch: 'We have $(3+5)/2=4$. We have $3/2+5/2=8/2=4$. The values are equal, so (c) gets 1. Splitting a sum in the numerator works.'
          - problem: 'Give each truth value as 1 for true and 0 for false. (a) The fraction $1/0$ is defined in the rational numbers. (b) The fraction $0/5$ is defined in the rational numbers. (c) $0/5=0$ in the rational numbers. (d) The fraction $3/7$ is defined in $\mathbb{Z}_{7}$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}}]}
            answer: 'a = 0; b = 1; c = 1; d = 0'
            solution_sketch: 'A fraction needs a nonzero denominator. The denominator 0 gives (a) the value 0. The denominator 5 is nonzero and $0\cdot 5^{-1}=0$, so (b) and (c) get 1. In $\mathbb{Z}_{7}$ the denominator 7 equals 0, so (d) gets 0.'
          # argument: Proposition 5.15
          - problem: 'Prove: in a field, for $c,d\ne 0$ we have $\frac{m}{c}+\frac{n}{d}=\frac{md+nc}{cd}$.'
            answer_contract: {"kind":"written"}
            answer: 'Write both fractions with the common factor, the inverse of cd. Then add them and factor out that inverse.'
            solution_sketch: 'By Definition 5.14, $m/c=mc^{-1}$. Since $dd^{-1}=1$, we get $mc^{-1}=mc^{-1}dd^{-1}=md(cd)^{-1}$. In the same way, $n/d=nc(cd)^{-1}$. Add the two results and factor out $(cd)^{-1}$ by distributivity. This gives $(md+nc)/(cd)$.'
          # argument: Proposition 5.15
          - problem: 'Prove: in a field, for $c,d\ne 0$ we have $\frac{m}{c}\cdot\frac{n}{d}=\frac{mn}{cd}$.'
            answer_contract: {"kind":"written"}
            answer: 'Write both fractions with inverses and regroup by commutativity. The inverse of cd is the product of the inverses of c and d.'
            solution_sketch: 'By Definition 5.14, the product is $mc^{-1}\cdot nd^{-1}$. Commutativity and associativity regroup it as $mn\cdot c^{-1}d^{-1}$. We have $(cd)(c^{-1}d^{-1})=1$, so $c^{-1}d^{-1}=(cd)^{-1}$. So the product is $mn(cd)^{-1}=mn/(cd)$.'
          # source: FoM exercise 5.2-5-8
          - problem: 'Let $F$ be a field and let $c,d\in F$ be nonzero. (a) Prove the rule for the sum $\frac{m}{c}+\frac{n}{d}$ of two fractions. (b) Prove the rule for the product $\frac{m}{c}\cdot\frac{n}{d}$ of two fractions.'
            answer_contract: {"kind":"written"}
            answer: 'Write fractions as products with inverses. The sum uses the inverse of cd as common factor, and the product regroups by commutativity.'
            solution_sketch: 'By Definition 5.14, $m/c=mc^{-1}$ and $n/d=nd^{-1}$. For (a), rewrite $mc^{-1}=md(cd)^{-1}$ and $nd^{-1}=nc(cd)^{-1}$, then add. For (b), regroup $mc^{-1}nd^{-1}=mn\,c^{-1}d^{-1}$ and use $c^{-1}d^{-1}=(cd)^{-1}$. These steps prove Proposition 5.15.'
          # source: FoM exercise 5.2-5-11
          - problem: 'Let $F$ be a field, let $m,n\in F$ and let $c,d\in F$ be nonzero. (a) Prove that $\frac{m+n}{d}=\frac{m}{d}+\frac{n}{d}$. (b) Give an example of $F$, $n$, $c$ and $d$ with $c+d\ne 0$ for which $\frac{n}{c+d}$ differs from $\frac{n}{c}+\frac{n}{d}$.'
            answer_contract: {"kind":"written"}
            answer: 'Part (a) distributes the inverse of d over the sum of m and n. Part (b) takes the rational numbers with n, c and d all equal to 1, so the sides are 1/2 and 2.'
            solution_sketch: 'For (a), the left side is $(m+n)d^{-1}$, which equals $md^{-1}+nd^{-1}$ by distributivity. For (b), take $F=\mathbb{Q}$ and $n=c=d=1$. Then $c+d=2\ne 0$ and $\frac{n}{c+d}=\frac{1}{2}$. The right side is $1+1=2$, and $\frac12\ne 2$.'
        constraints: 'Compute sums and products of fractions in the rational numbers and in rings of remainders.'
      - id: kp5
        name: 'Proposition 5.16: rational numbers as quotients of an integer and a natural number'
        key_prerequisites: [fom-5-1-arithmetic-rational-numbers]
        exemplars:
          - problem: 'Write each rational number as $n/d$ with an integer $n$ and a natural number $d$, in lowest terms. (a) Give $n$ for $4/(-6)$. (b) Give $d$ for $4/(-6)$. (c) Give $n$ for $(-6)/(-9)$. (d) Give $d$ for $(-6)/(-9)$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}}]}
            answer: 'a = -2; b = 3; c = 2; d = 3'
            solution_sketch: 'Move the minus sign from the denominator to the numerator. We get $4/(-6)=(-4)/6=-2/3$ in lowest terms. We get $(-6)/(-9)=6/9=2/3$ in lowest terms.'
          - problem: 'A rational number is the class of a pair $(n,d)$ with $d\ne 0$. Take the pair $(7,-3)$. The pair $(-n,-d)$ has the same class and a positive second entry. Give (a) $-n$ and (b) $-d$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}}]}
            answer: 'a = -7; b = 3'
            solution_sketch: 'Change the sign of both entries of $(7,-3)$. We get $-7$ and $3$, so (a) is -7 and (b) is 3. The new pair $(-7,3)$ has a natural number in the second place.'
          - problem: 'Count the different rational numbers among the fractions $n/d$. (a) Take $n\in\{-2,-1,0,1,2\}$ and $d\in\{1,2\}$. (b) Take $n\in\{1,2,3,4\}$ and $d\in\{1,2\}$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}}]}
            answer: 'a = 7; b = 6'
            solution_sketch: 'In (a), $d=1$ gives -2, -1, 0, 1, 2 and $d=2$ adds only -1/2 and 1/2, so the count is $5+2=7$. In (b), $d=1$ gives 1, 2, 3, 4 and $d=2$ adds only 1/2 and 3/2, so the count is $4+2=6$.'
          - problem: 'Give each truth value as 1 for true and 0 for false. (a) Every rational number is the quotient of an integer and a natural number. (b) Every rational number is the quotient of two natural numbers. (c) The number 0 is the quotient of an integer and a natural number. (d) Every integer is the quotient of an integer and a natural number.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 0; c = 1; d = 1'
            solution_sketch: 'Proposition 5.16 gives (a) the value 1. Negative rationals such as $-1$ are not quotients of naturals, so (b) gets 0. We have $0=0/1$, and every integer $z$ equals $z/1$, so (c) and (d) get 1.'
          - problem: 'Give the smallest positive integer $d$ for which $d\cdot q$ is an integer. (a) $q=-7/12$. (b) $q=5/(-10)$. (c) $q=9/6$. (d) $q=0$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}}]}
            answer: 'a = 12; b = 2; c = 2; d = 1'
            solution_sketch: 'Reduce $q$ to lowest terms and take the denominator. We get $-7/12$, $-1/2$, $3/2$ and $0/1$. The denominators are 12, 2, 2 and 1.'
          - problem: 'Work in $\mathbb{Z}_{7}$. Give each sum as a number from 0 to 6. (a) The sum of 7 copies of 3. (b) The sum of 8 copies of 3. (c) The sum of 15 copies of 5.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 0; b = 3; c = 5'
            solution_sketch: 'The characteristic is 7, so 7 copies of any element sum to 0. Eight copies give $7\cdot 3+3=3$. Fifteen copies give $14\cdot 5+5=5$.'
          # argument: Proposition 5.16
          - problem: 'Prove: every rational number is the quotient of an integer and a natural number.'
            answer_contract: {"kind":"written"}
            answer: 'Write q as n over d with d nonzero. If d is negative, use minus n over minus d, which has a positive denominator.'
            solution_sketch: 'A rational number $q$ has the form $n/d$ with $n,d$ integers and $d\ne 0$. If $d>0$, then $d$ is a natural number and $q=n\cdot d^{-1}$. If $d<0$, then $-d$ is a natural number and $n/d=(-n)/(-d)$. In both cases $q$ is a quotient of an integer and a natural number. Theorem 5.13 puts the copies of the integers and naturals inside the rational numbers.'
          # source: FoM exercise 5.2-5-13
          - problem: 'A field $F$ has characteristic $p$ and $a$ is an element of $F$. Prove that the sum of $p$ copies of $a$ is 0.'
            answer_contract: {"kind":"written"}
            answer: 'By distributivity the sum of p copies of a equals a times the sum of p ones. That sum of ones is 0 by the definition of characteristic.'
            solution_sketch: 'The sum of $p$ copies of $a$ is $a+\dots+a$. By distributivity this equals $a\cdot(1+\dots+1)$ with $p$ ones. By Definition 5.12 the sum of $p$ ones is 0. So the sum equals $a\cdot 0=0$.'
          # source: FoM exercise 5.2-5-14
          - problem: 'Give polynomials $p,q,d_1,d_2$ with rational coefficients so that each of $d_1$ and $d_2$ is a greatest common divisor of $p$ and $q$, while $d_1$ is neither $d_2$ nor $-d_2$.'
            answer_contract: {"kind":"written"}
            answer: 'Take p = x^2 - 1, q = x - 1, d1 = x - 1 and d2 = 2x - 2. Each of d1 and d2 divides the other, and d2 is not plus or minus d1.'
            solution_sketch: 'Let $p=x^2-1$ and $q=x-1$. Then $x-1$ divides both. The polynomial $2x-2$ also divides both, because $x-1=\frac12(2x-2)$. Each of $d_1=x-1$ and $d_2=2x-2$ is a common divisor that every common divisor divides. So both are greatest common divisors, and $d_1\notin\{d_2,-d_2\}$.'
        constraints: 'Rewrite rational numbers with a natural denominator and count different values.'
      - id: kp6
        name: 'Definition 5.17 and Theorem 5.18: integer powers in a field'
        key_prerequisites: [fom-3-5-sums-products]
        exemplars:
          - problem: 'Compute in the rational numbers. Give each answer as a fraction. (a) $2^{-3}$. (b) $(3/2)^{-2}$. (c) $(-2)^{-3}$. (d) $5^0$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}}]}
            answer: 'a = 1/8; b = 4/9; c = -1/8; d = 1'
            solution_sketch: 'By Definition 5.17, $a^{-n}=(a^{-1})^n$. We get $2^{-3}=(1/2)^3=1/8$ and $(3/2)^{-2}=(2/3)^2=4/9$. We get $(-2)^{-3}=(-1/2)^3=-1/8$. By definition $5^0=1$.'
          - problem: 'Compute in $\mathbb{Z}_{7}$ as numbers from 0 to 6. (a) $3^{-1}$. (b) $3^{-2}$. (c) $2^{-3}$. (d) $5^{-2}$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}}]}
            answer: 'a = 5; b = 4; c = 1; d = 2'
            solution_sketch: 'We have $3^{-1}=5$, so $3^{-2}=5^2=25=4$. We have $2^{-1}=4$, so $2^{-3}=4^3=64=1$. We have $5^{-1}=3$, so $5^{-2}=3^2=9=2$.'
          - problem: 'Compute in $\mathbb{Z}_{11}$ as numbers from 1 to 10. (a) $2^{-5}$. (b) $3^{-2}$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}}]}
            answer: 'a = 10; b = 5'
            solution_sketch: 'We have $2^{-1}=6$, so $2^{-5}=6^5$. Since $6^2=3$ and $6^4=9$, we get $6^5=54=10$. We have $3^{-1}=4$, so $3^{-2}=16=5$.'
          - problem: 'Let $a$ be a nonzero element of a field. Give the exponent $k$ in each equation. (a) $a^{-4}\cdot a^{7}=a^k$. (b) $(a^3)^{-2}=a^k$. (c) $a^{-5}\cdot a^{-2}=a^k$. (d) $(a^{-2})^{-3}=a^k$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}}]}
            answer: 'a = 3; b = -6; c = -7; d = 6'
            solution_sketch: 'Exponents add for a product and multiply for a power, by Theorem 5.18. We get $-4+7=3$ and $3\cdot(-2)=-6$. We get $-5+(-2)=-7$ and $(-2)(-3)=6$.'
          - problem: 'Let $a$ and $b$ be nonzero elements of a field. Give each truth value as 1 for true and 0 for false. (a) $a^{5}\cdot a^{-2}=a^{3}$. (b) $(ab)^{-2}=a^{-2}b^{-2}$. (c) $(a^{-2})^{3}=a^{-5}$. (d) $a^{m+n}=a^m+a^n$ for all integers $m,n$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 1; c = 0; d = 0'
            solution_sketch: 'Part (a) holds since $5-2=3$, and (b) holds by part 2 of Theorem 5.18. Part (c) is false, because $(a^{-2})^3=a^{-6}$. Part (d) is false, because $a^{m+n}=a^ma^n$ is a product, not a sum. So (c) and (d) get 0.'
          - problem: 'Give the order of each element in the group of nonzero elements of $\mathbb{Z}_{7}$ under multiplication. (a) 2. (b) 3. (c) 6.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 3; b = 6; c = 2'
            solution_sketch: 'The powers of 2 are 2, 4, 1, so the order is 3. The powers of 3 are 3, 2, 6, 4, 5, 1, so the order is 6. The powers of 6 are 6, 1, so the order is 2.'
          # source: FoM exercise 5.2-5-15
          - problem: 'Let $F$ be a field. Give 1 if the structure is a group and 0 if not. The operation is multiplication. (a) The set $F$. (b) The set of nonzero elements of $F$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}}]}
            answer: 'a = 0; b = 1'
            solution_sketch: 'The element 0 has no multiplicative inverse by Proposition 5.11, so (a) gets 0. The nonzero elements are closed under products by Theorem 5.9, and they have inverses, so (b) gets 1.'
          # argument: Theorem 5.18
          - problem: 'Prove: in a field, for a nonzero element $a$ and integers $m,n$, we have $a^{m+n}=a^m a^n$.'
            answer_contract: {"kind":"written"}
            answer: 'Treat the sign cases of m and n. Positive exponents follow from Theorem 3.71, and negative ones reduce to them through the inverse of a.'
            solution_sketch: 'If $m=0$ or $n=0$, there is nothing to prove. If $m,n>0$, use part 1 of Theorem 3.71. If $m>0>n$ and $m>-n$, then $a^{m+n}a^{-n}=a^m$ by Theorem 3.71, so $a^{m+n}=a^m a^n$. If $m>0>n$ and $m<-n$, apply the same step to the inverse $a^{-1}$. If $m,n<0$, then $a^{m+n}=(a^{-1})^{(-m)+(-n)}=a^ma^n$ by Theorem 3.71.'
          # argument: Theorem 5.18
          - problem: 'Prove: in a field, for nonzero elements $a,b$ and an integer $n$, we have $(ab)^n=a^nb^n$.'
            answer_contract: {"kind":"written"}
            answer: 'For positive n use commutativity and induction. For negative n apply the positive case to the inverses of a and b.'
            solution_sketch: 'For $n>0$ regroup the product $ab\cdots ab$ with commutativity, as in Theorem 3.71. For $n=0$ both sides equal 1. For $n<0$ we have $(ab)^{-1}=a^{-1}b^{-1}$, so $(ab)^n=(a^{-1}b^{-1})^{-n}$. The positive case gives $(a^{-1})^{-n}(b^{-1})^{-n}=a^nb^n$.'
          # argument: Theorem 5.18
          - problem: 'Prove: in a field, for a nonzero element $a$ and integers $m,n$, we have $(a^m)^n=a^{mn}$.'
            answer_contract: {"kind":"written"}
            answer: 'For natural exponents use Theorem 3.71. For a negative exponent swap a with its inverse and reduce to the natural case.'
            solution_sketch: 'If $m,n>0$, use part 3 of Theorem 3.71. If $m=0$ or $n=0$, both sides equal 1. If an exponent is negative, replace $a$ by $a^{-1}$ and use $(a^{-1})^{-k}=a^k$. This reduces every sign case to the natural case. So $(a^m)^n=a^{mn}$.'
          # source: FoM exercise 5.2-5-9
          - problem: 'Let $F$ be a field, let $a,b\in F$ be nonzero, and let $m,n$ be integers. Prove each statement. (a) $a^m a^{-m}=1$. (b) $(a^{-1})^{-m}=a^m$. (c) $(ab)^n=a^nb^n$. (d) $(a^m)^n=a^{mn}$.'
            answer_contract: {"kind":"written"}
            answer: 'Use induction for natural exponents. For negative exponents move to the inverse of a and reduce to the natural case.'
            solution_sketch: 'For (a), use induction on $m$ and $a\cdot a^{-1}=1$ by Definition 5.17. For (b), the definition gives $(a^{-1})^{-m}=a^m$ when $m>0$, and the case $m<0$ follows. For (c) and (d), use Theorem 3.71 for natural exponents. Then reduce negative exponents to those through the inverses.'
          # source: FoM exercise 5.2-5-16
          - problem: 'Let $p$ be a prime number. A formal polynomial over $\mathbb{Z}_{p}$ is an expression $\sum_{j=0}^{n}a_jx^j$ with $a_j\in$ $\mathbb{Z}_{p}$, and two such expressions are equal exactly when all coefficients are equal. Sums and products use the coefficient formulas, with arithmetic mod $p$. Prove that the formal rational functions $N(x)/D(x)$ with $D\ne 0$ form an infinite field of characteristic $p$.'
            answer_contract: {"kind":"written"}
            answer: 'The field axioms hold as for fractions, and the inverse of N/D is D/N. The sum of p ones is 0, and the powers of x are all different.'
            solution_sketch: 'Define sums and products of the quotients $N/D$ as for fractions, as in Proposition 5.15. The field axioms follow from the ring axioms of the formal polynomials in Example 4.13. A nonzero $N/D$ has the inverse $D/N$. The sum of $p$ ones is $p\cdot 1=0$, and no shorter sum of ones is 0. The powers $x^k$ are pairwise different by Corollary 4.59, so the field is infinite.'
        constraints: 'Compute integer powers in the rational numbers and in rings of remainders; apply the power laws.'
    diagnostic_exemplar:
      problem: 'Compute in $\mathbb{Z}_{5}$ as numbers from 0 to 4. (a) $2+4$. (b) The multiplicative inverse of 2.'
      answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}}]}
      answer: 'a = 1; b = 3'
      solution_sketch: 'We have $2+4=6=1$ in $\mathbb{Z}_{5}$. We have $2\cdot 3=6=1$, so the inverse of 2 is 3.'
