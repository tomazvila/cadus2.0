          - problem: 'Let $D=\{q\in\mathbb{Q}: q<2\}$ and $E=\{q\in\mathbb{Q}: q<\frac52\}$. For real numbers, $D\le E$ means $D\subseteq E$. (a) Give 1 if $D\le E$ and 0 if not. (b) Give 1 if $E\le D$ and 0 if not. (c) Count the integers that are in $E$ and not in $D$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
