      - id: kp1
        name: 'Definition 5.55 and Theorem 5.56: the complex numbers form a field'
        key_prerequisites: []
        exemplars:
          - problem: 'Let $z=3+2i$ and $w=1+4i$. (a) Give the real part of $z+w$. (b) Give the imaginary part of $z+w$. (c) Give the real part of $z-w$. (d) Give the imaginary part of $z-w$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}}]}
            answer: 'a = 4; b = 6; c = 2; d = -2'
            solution_sketch: 'Add the parts: $z+w=4+6i$, so (a) is 4 and (b) is 6. Subtract the parts: $z-w=2-2i$, so (c) is 2 and (d) is -2.'
          - problem: 'The pair $(a,b)$ is $a+ib$. The product rule is $(a,b)(c,d)=(ac-bd,\,ad+bc)$. (a) Give the first entry of $(2,3)(4,5)$. (b) Give the second entry of $(2,3)(4,5)$. (c) Give the first entry of $(0,1)(0,1)$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = -7; b = 22; c = -1'
            solution_sketch: 'For $(2,3)(4,5)$ the first entry is $2\cdot4-3\cdot5=-7$. The second entry is $2\cdot5+3\cdot4=22$. For $(0,1)(0,1)$ the first entry is $0\cdot0-1\cdot1=-1$.'
          - problem: 'Compute with complex numbers. (a) Give the real part of $(2+3i)(1+i)$. (b) Give the imaginary part of $(2+3i)(1+i)$. (c) Give the real part of $(3+2i)(3-2i)$. (d) Give the imaginary part of $(3+2i)(3-2i)$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}}]}
            answer: 'a = -1; b = 5; c = 13; d = 0'
            solution_sketch: 'We get $(2+3i)(1+i)=2+2i+3i+3i^2=-1+5i$, so (a) is -1 and (b) is 5. We get $(3+2i)(3-2i)=9-4i^2=13$, so (c) is 13 and (d) is 0.'
          - problem: 'Solve for $z$. (a) Give the real part of $z$ when $z+(2-3i)=5+i$. (b) Give the imaginary part of $z$ for the same equation. (c) Give the real part of $z$ when $(1+i)z=2+2i$. (d) Give the imaginary part of $z$ for that equation.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}}]}
            answer: 'a = 3; b = 4; c = 2; d = 0'
            solution_sketch: 'In the first equation $z=(5+i)-(2-3i)=3+4i$, so (a) is 3 and (b) is 4. In the second equation divide by $1+i$ to get $z=2$, so (c) is 2 and (d) is 0.'
          - problem: 'Give the number $a^2+b^2$ for each complex number $a+ib$. (a) The number $a^2+b^2$ for $3+4i$. (b) The number $a^2+b^2$ for $5-12i$. (c) The number $a^2+b^2$ for $2+0i$. (d) The number $a^2+b^2$ for $0+0i$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}}]}
            answer: 'a = 25; b = 169; c = 4; d = 0'
            solution_sketch: 'For $3+4i$ we get $9+16=25$. For $5-12i$ we get $25+144=169$. For $2+0i$ we get $4+0=4$. For $0+0i$ we get $0$, and only this number has no inverse.'
          - problem: 'The inverse of $a+ib$ is $\frac{a}{a^2+b^2}-i\frac{b}{a^2+b^2}$. Give each part as a decimal. (a) The real part of the inverse of $3+4i$. (b) The imaginary part of the inverse of $3+4i$. (c) The imaginary part of the inverse of $2i$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"approx","decimals":2}},{"name":"b","contract":{"kind":"approx","decimals":2}},{"name":"c","contract":{"kind":"approx","decimals":2}}]}
            answer: 'a = 0.12; b = -0.16; c = -0.5'
            solution_sketch: 'For $3+4i$ the sum of squares is 25. So the real part is $3/25=0.12$ and the imaginary part is $-4/25=-0.16$. For $2i$ we have $a=0$ and $b=2$, so the imaginary part is $-2/4=-0.5$.'
          # argument: Theorem 5.56
          - problem: 'Prove: the set $\mathbb{C}$ of pairs of real numbers, with the sum $(a,b)+(c,d)=(a+c,b+d)$ and the product $(a,b)(c,d)=(ac-bd,ad+bc)$, is a field with zero $(0,0)$ and one $(1,0)$.'
            answer_contract: {"kind":"written"}
            answer: 'Check each field axiom coordinate by coordinate with the rules of the real numbers. The inverse of a+ib is a minus ib over a squared plus b squared.'
            solution_sketch: 'Use Definition 5.55. Addition works in each coordinate, so its axioms follow from the axioms of the real numbers. For the product, expand both sides and compare the real and imaginary parts. The additive inverse of $a+ib$ is $(-a)+(-b)i$. For $a+ib\ne0$ the number $a^2+b^2$ is positive. The product of $a+ib$ with $\frac{a}{a^2+b^2}-i\frac{b}{a^2+b^2}$ is $1$.'
          # source: FoM exercise 5.7-5-52
          - problem: 'Prove: $\mathbb{C}$ with the usual sum and product is not a totally ordered field. That is, no subset $P$ of $\mathbb{C}$ is a positive cone for a total order of the field.'
            answer_contract: {"kind":"written"}
            answer: 'A positive cone holds 1 and also the square of any nonzero element. Then it holds both 1 and minus 1, because i squared is minus 1.'
            solution_sketch: 'Suppose $P$ is a positive cone. For $x\ne0$, either $x$ or $-x$ lies in $P$, so $x^2\in P$. With $x=1$ we get $1\in P$. With $x=i$ we get $i^2=-1\in P$. Now $1$ and $-1$ both lie in $P$, but a positive cone holds no element together with its negative. This is a contradiction.'
          # source: FoM exercise 5.7-5-53
          - problem: 'Prove that $\mathbb{C}$ is a field. Check these nine axioms for complex numbers: (a) associativity of the sum, (b) commutativity of the sum, (c) zero, (d) the additive inverse, (e) associativity of the product, (f) commutativity of the product, (g) one, (h) the multiplicative inverse, (i) the distributive law.'
            answer_contract: {"kind":"written"}
            answer: 'Write each complex number as a pair and expand both sides of each axiom. The real and imaginary parts then agree by the rules of the real numbers.'
            solution_sketch: 'For (a) to (d) work in each coordinate with the sum $(a+c)+i(b+d)$. For (e) to (g) expand the product $(ac-bd)+i(ad+bc)$ on both sides and compare the real and imaginary parts. For (h) multiply $a+ib$ by the proposed inverse and get $\frac{a^2+b^2}{a^2+b^2}=1$. For (i) expand $\alpha(x+y)$ and use the distributive law of the real numbers on each part.'
        constraints: 'sum, product and inverse of complex numbers'
      - id: kp2
        name: 'Theorem 5.57: the square of i'
        key_prerequisites: []
        exemplars:
          - problem: 'Compute powers of $i$ with $i^2=-1$. (a) Give the real part of $i^2$. (b) Give the imaginary part of $i^2$. (c) Give the real part of $i^3$. (d) Give the imaginary part of $i^3$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}}]}
            answer: 'a = -1; b = 0; c = 0; d = -1'
            solution_sketch: 'We have $i^2=-1$, so the real part is -1 and the imaginary part is 0. Then $i^3=i^2\cdot i=-i$, so the real part is 0 and the imaginary part is -1.'
          - problem: 'Compute more powers of $i$. (a) Give the real part of $i^4$. (b) Give the imaginary part of $i^5$. (c) Give the real part of $i^6$. (d) Give the imaginary part of $i^7$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 1; c = -1; d = -1'
            solution_sketch: 'We get $i^4=(i^2)^2=1$, so (a) is 1. Then $i^5=i$, so (b) is 1. Then $i^6=-1$, so (c) is -1. Then $i^7=-i$, so (d) is -1.'
          - problem: 'The powers of $i$ repeat after four steps. (a) Give the real part of $i^{100}$. (b) Give the imaginary part of $i^{101}$. (c) Give the real part of $i^{102}$. (d) Give the imaginary part of $i^{103}$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 1; c = -1; d = -1'
            solution_sketch: 'The number 100 leaves the remainder 0 after division by 4, so $i^{100}=1$. The number 101 leaves 1, so $i^{101}=i$. The number 102 leaves 2, so $i^{102}=-1$. The number 103 leaves 3, so $i^{103}=-i$.'
          - problem: 'Find the smallest positive whole number $n$ with the given value. (a) $i^n=-1$. (b) $i^n=-i$. (c) $i^n=1$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 2; b = 3; c = 4'
            solution_sketch: 'We have $i^1=i$, $i^2=-1$, $i^3=-i$ and $i^4=1$. So the answers are 2, 3 and 4.'
          - problem: 'Compute. (a) Give the real part of $1+i+i^2+i^3$. (b) Give the imaginary part of $1+i+i^2+i^3$. (c) Give the real part of $(1+i)^2$. (d) Give the imaginary part of $(1+i)^2$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}}]}
            answer: 'a = 0; b = 0; c = 0; d = 2'
            solution_sketch: 'The sum is $1+i-1-i=0$, so (a) and (b) are 0. Next, $(1+i)^2=1+2i+i^2=2i$, so (c) is 0 and (d) is 2.'
          - problem: 'Square each number and give the parts of the result. (a) Give the real part of $(3i)^2$. (b) Give the imaginary part of $(3i)^2$. (c) Give the real part of $(1-i)^2$. (d) Give the imaginary part of $(1-i)^2$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}}]}
            answer: 'a = -9; b = 0; c = 0; d = -2'
            solution_sketch: 'We get $(3i)^2=9i^2=-9$, so (a) is -9 and (b) is 0. We get $(1-i)^2=1-2i+i^2=-2i$, so (c) is 0 and (d) is -2.'
          # argument: Theorem 5.57
          - problem: 'Prove: in $\mathbb{C}$, the square of $i=(0,1)$ equals $-1=(-1,0)$.'
            answer_contract: {"kind":"written"}
            answer: 'Multiply the pair (0,1) by itself with the product rule. The first entry is 0 times 0 minus 1 times 1, which is minus 1, and the second entry is 0.'
            solution_sketch: 'Use Definition 5.55 with $i=0+1i$. The product rule gives $i\cdot i=(0\cdot0-1\cdot1)+(0\cdot1+1\cdot0)i$. The first part is $-1$ and the second part is $0$. So $i^2=-1$.'
        constraints: 'powers of i'
      - id: kp3
        name: 'Definition 5.58 and Theorem 5.59: the absolute value of a complex number'
        key_prerequisites: []
        exemplars:
          - problem: 'The absolute value of $a+ib$ is $\sqrt{a^2+b^2}$. Give each value. (a) $|3+4i|$ (b) $|5-12i|$ (c) $|8+15i|$ (d) $|2i|$'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}}]}
            answer: 'a = 5; b = 13; c = 17; d = 2'
            solution_sketch: 'For (a), $\sqrt{9+16}=5$. For (b), $\sqrt{25+144}=13$. For (c), $\sqrt{64+225}=17$. For (d), $\sqrt{0+4}=2$.'
          - problem: 'Give each value. (a) $|6-8i|$ (b) $|7+24i|$ (c) $|-9-12i|$ (d) $|0|$'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}}]}
            answer: 'a = 10; b = 25; c = 15; d = 0'
            solution_sketch: 'For (a), $\sqrt{36+64}=10$. For (b), $\sqrt{49+576}=25$. For (c), $\sqrt{81+144}=15$. For (d), $\sqrt{0}=0$.'
          - problem: 'Count the complex numbers $a+ib$ with whole number parts $a$ and $b$ in each case. (a) $|z|=0$. (b) $|z|=1$. (c) $|z|=5$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 4; c = 12'
            solution_sketch: 'Only $0$ has absolute value 0, so (a) is 1. The numbers $1,-1,i,-i$ have absolute value 1, so (b) is 4. For $a^2+b^2=25$ the pairs are $(\pm5,0)$, $(0,\pm5)$, $(\pm3,\pm4)$ and $(\pm4,\pm3)$, which is 4 and 8 pairs, so (c) is 12.'
          - problem: 'Let $z_1=3+4i$ and $z_2=5+12i$. (a) Give $|z_1|$. (b) Give $|z_2|$. (c) Give $|z_1z_2|$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 5; b = 13; c = 65'
            solution_sketch: 'We get $|z_1|=5$ and $|z_2|=13$. The product is $z_1z_2=-33+56i$ and $33^2+56^2=4225=65^2$. So $|z_1z_2|=65=5\cdot13$.'
          - problem: 'Let $z_1=3$ and $z_2=4i$. (a) Give $|z_1+z_2|$. (b) Give $|z_1|+|z_2|$. (c) Give the value $|z_1|+|z_2|-|z_1+z_2|$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 5; b = 7; c = 2'
            solution_sketch: 'The sum is $3+4i$, with absolute value 5. The two absolute values are 3 and 4, with the sum 7. The difference is $7-5=2$.'
          - problem: 'Give 1 if $|z_1+z_2|=|z_1|+|z_2|$ and 0 if the left side is smaller. (a) $z_1=3+4i$, $z_2=6+8i$ (b) $z_1=3$, $z_2=4i$ (c) $z_1=1+i$, $z_2=2+2i$ (d) $z_1=1$, $z_2=-1$'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 0; c = 1; d = 0'
            solution_sketch: 'In (a) the sum is $9+12i$ with absolute value 15, and $5+10=15$, so the value is 1. In (b) we get 5 against 7, so the value is 0. In (c) the numbers point the same way, and the value is 1. In (d) the sum is $0$ and $1+1=2$, so the value is 0.'
          - problem: 'Let $z_1=5+12i$ and $z_2=5$. (a) Give $\big||z_1|-|z_2|\big|$. (b) Give $|z_1-z_2|$. (c) Give the difference of the two numbers $|z_1-z_2|-\big||z_1|-|z_2|\big|$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 8; b = 12; c = 4'
            solution_sketch: 'We have $|z_1|=13$ and $|z_2|=5$, so (a) is 8. The difference is $z_1-z_2=12i$, so (b) is 12. Then $12-8=4$, which is not negative.'
          # argument: Theorem 5.59
          - problem: 'Prove the first step: for every complex number $z$, the absolute value $|z|$ is at least $0$, it is $0$ only for $z=0$, and $|z_1z_2|=|z_1||z_2|$ for all $z_1,z_2$.'
            answer_contract: {"kind":"written"}
            answer: 'The absolute value is a root of a sum of squares, zero only if both parts are zero. For the product, compare the squares of both sides.'
            solution_sketch: 'Use Definition 5.58. The root of $a^2+b^2$ is at least $0$. It is $0$ only when $a^2+b^2=0$, so only when $a=b=0$. For the product, expand $|z_1z_2|^2=(ac-bd)^2+(ad+bc)^2$ and get $(a^2+b^2)(c^2+d^2)$. Take the root of both sides.'
          # argument: Theorem 5.59
          - problem: 'Prove the second step, the triangular inequality: $|z_1+z_2|\le|z_1|+|z_2|$ for all complex numbers $z_1$ and $z_2$.'
            answer_contract: {"kind":"written"}
            answer: 'Show that ac plus bd is at most the product of the two absolute values, by the fact that the square of ad minus bc is not negative. Then compare squares.'
            solution_sketch: 'Let $z_1=a+ib$ and $z_2=c+id$. Since $(ad-bc)^2\ge0$, we get $(ac+bd)^2\le(a^2+b^2)(c^2+d^2)$. Hence $ac+bd\le|z_1||z_2|$. Then $|z_1+z_2|^2=|z_1|^2+2(ac+bd)+|z_2|^2\le(|z_1|+|z_2|)^2$. Both sides are at least $0$, so take roots.'
          # source: FoM exercise 5.7-5-54
          - problem: 'Prove all three: (a) $|z|\ge0$ for every complex $z$. (b) $|z|=0$ only for $z=0$, and $|0|=0$. (c) $|z_1z_2|=|z_1||z_2|$ for all complex $z_1$ and $z_2$.'
            answer_contract: {"kind":"written"}
            answer: 'Use the definition of the absolute value as the root of a^2 plus b^2. Part c follows from the identity for the product of two sums of two squares.'
            solution_sketch: 'For parts (a) and (b) use Definition 5.58 and the fact that $a^2+b^2=0$ only for $a=b=0$. For part (c) write $z_1z_2=(ac-bd)+i(ad+bc)$. Expand $(ac-bd)^2+(ad+bc)^2$ to $(a^2+b^2)(c^2+d^2)$. Take roots. This completes the parts 0 to 2 of Theorem 5.59.'
          # source: FoM exercise 5.7-5-56
          - problem: 'Prove: $\big||z_1|-|z_2|\big|\le|z_1-z_2|$ for all complex numbers $z_1$ and $z_2$.'
            answer_contract: {"kind":"written"}
            answer: 'Write z1 as (z1 minus z2) plus z2 and use the triangular inequality. Swap the two numbers for the other direction.'
            solution_sketch: 'By Theorem 5.59, $|z_1|=|(z_1-z_2)+z_2|\le|z_1-z_2|+|z_2|$. So $|z_1|-|z_2|\le|z_1-z_2|$. Swap the roles to get $|z_2|-|z_1|\le|z_2-z_1|$. Since $|-1|=1$, we get $|z_2-z_1|=|z_1-z_2|$. Both differences are at most $|z_1-z_2|$.'
        constraints: 'absolute value, product rule and triangular inequality'
      - id: kp4
        name: 'Definition 5.60 and Proposition 5.61: the bar of a complex number and the inverse'
        key_prerequisites: []
        exemplars:
          - problem: 'For $z=a+ib$ let the bar of $z$ be $\overline{z}=a-ib$. (a) Give the real part of the bar of $3+4i$. (b) Give the imaginary part of the bar of $3+4i$. (c) Give the real part of the bar of $-2-5i$. (d) Give the imaginary part of the bar of $-2-5i$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}}]}
            answer: 'a = 3; b = -4; c = -2; d = 5'
            solution_sketch: 'The bar keeps the real part and flips the sign of the imaginary part. The bar of $3+4i$ is $3-4i$, so (a) is 3 and (b) is -4. The bar of $-2-5i$ is $-2+5i$, so (c) is -2 and (d) is 5.'
          - problem: 'For $z=a+ib$ let the bar of $z$ be $\overline{z}=a-ib$. Give 1 if $\overline{z}=z$ and 0 if not. (a) $z=4$ (b) $z=2i$ (c) $z=5+i$ (d) $z=0$'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 0; c = 0; d = 1'
            solution_sketch: 'The bar equals $z$ only for a number with imaginary part 0. So $z=4$ and $z=0$ get 1. The numbers $2i$ and $5+i$ have a nonzero imaginary part, so they get 0.'
          - problem: 'For $z=a+ib$ let the bar of $z$ be $\overline{z}=a-ib$. Give 1 if $\overline{z}=-z$ and 0 if not. (a) $z=3i$ (b) $z=3$ (c) $z=0$ (d) $z=1+i$'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 0; c = 1; d = 0'
            solution_sketch: 'We need $a-ib=-a-ib$, so $a=0$. The numbers $3i$ and $0$ have real part 0, so they get 1. The numbers $3$ and $1+i$ have a nonzero real part, so they get 0.'
          - problem: 'Let $z=7-3i$ with the bar $\overline{z}=7+3i$. (a) Give $z+\overline{z}$. (b) Give $z\overline{z}$. (c) Give the imaginary part of $z-\overline{z}$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 14; b = 58; c = -6'
            solution_sketch: 'The sum is $14$, which is twice the real part. The product is $49+9=58$. The difference is $-6i$, so the imaginary part is -6.'
          - problem: 'The bar of a complex number keeps the real part and flips the sign of the imaginary part. (a) Give the real part of the bar of the bar of $5-7i$. (b) Give the imaginary part of the bar of $(1+2i)+(3-5i)$. (c) Give the real part of the bar of $(1+2i)(3-5i)$. (d) Give the imaginary part of the bar of $(1+2i)(3-5i)$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}}]}
            answer: 'a = 5; b = 3; c = 13; d = -1'
            solution_sketch: 'Two bars give back $5-7i$, so (a) is 5. The sum is $4-3i$ with the bar $4+3i$, so (b) is 3. The product is $13+i$ with the bar $13-i$, so (c) is 13 and (d) is -1.'
          - problem: 'Use the rule that the inverse of $z\ne0$ is $\overline{z}/|z|^2$. Give each part as a decimal. (a) The real part of the inverse of $1+i$. (b) The imaginary part of the inverse of $1+i$. (c) The real part of the inverse of $2-i$. (d) The imaginary part of the inverse of $2-i$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"approx","decimals":2}},{"name":"b","contract":{"kind":"approx","decimals":2}},{"name":"c","contract":{"kind":"approx","decimals":2}},{"name":"d","contract":{"kind":"approx","decimals":2}}]}
            answer: 'a = 0.5; b = -0.5; c = 0.4; d = 0.2'
            solution_sketch: 'For $1+i$ the inverse is $(1-i)/2$, so (a) is 0.5 and (b) is -0.5. For $2-i$ the inverse is $(2+i)/5$, so (c) is 0.4 and (d) is 0.2.'
          - problem: 'Map each $z=x+iy$ to the matrix with the top row $x,\,y$ and the bottom row $-y,\,x$. (a) Give the top right entry for $2+5i$. (b) Give the bottom left entry for $2+5i$. (c) Give the determinant of the matrix for $3+4i$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 5; b = -5; c = 25'
            solution_sketch: 'For $2+5i$ we have $x=2$ and $y=5$. The top right entry is 5 and the bottom left entry is -5. For $3+4i$ the determinant is $3\cdot3-4\cdot(-4)=25$.'
          # argument: Proposition 5.61
          - problem: 'Prove the first step: for $z=a+ib$ with the bar $\overline{z}=a-ib$, show that $z+\overline{z}=2\,\Re(z)$ and $|z|^2=z\overline{z}$.'
            answer_contract: {"kind":"written"}
            answer: 'Add a plus ib and a minus ib to get 2a. Multiply them to get a squared minus i squared b squared, which is a squared plus b squared.'
            solution_sketch: 'Use Definition 5.60. The sum is $(a+ib)+(a-ib)=2a=2\Re(z)$. The product is $(a+ib)(a-ib)=a^2-i^2b^2=a^2+b^2$. By Definition 5.58 this equals $|z|^2$.'
          # argument: Proposition 5.61
          - problem: 'Prove the second step: for $z\ne0$, the inverse of $z$ equals $\overline{z}$ divided by $|z|^2$.'
            answer_contract: {"kind":"written"}
            answer: 'Use the identity that z times its bar is the square of the absolute value. Divide by that positive number.'
            solution_sketch: 'By the first step, $z\overline{z}=|z|^2$. For $z\ne0$ the number $|z|^2$ is positive, by Theorem 5.59. Hence $z\cdot(\overline{z}/|z|^2)=1$. So $\overline{z}/|z|^2$ is the inverse of $z$.'
          # source: FoM exercise 5.7-5-55
          - problem: 'Prove: for a complex number $z=a+ib$, compute $z\overline{z}$ and $z+\overline{z}$ in terms of $a$ and $b$. Use the results to prove that $1/z=\overline{z}/|z|^2$ for $z\ne0$.'
            answer_contract: {"kind":"written"}
            answer: 'The sum with the bar is 2a and the product with the bar is a squared plus b squared. Dividing the bar of z by the product gives the inverse.'
            solution_sketch: 'Compute $z+\overline{z}=2a$ and $z\overline{z}=a^2+b^2=|z|^2$ by Definition 5.60 and Definition 5.58. For $z\ne0$ divide the second equality by $|z|^2$. This gives $z\cdot\overline{z}/|z|^2=1$, as stated in Proposition 5.61.'
          # source: FoM exercise 5.7-5-57
          - problem: 'Prove: the map that sends $x+iy$ to the matrix with the top row $x,\,y$ and the bottom row $-y,\,x$ is a bijection from $\mathbb{C}$ onto the set of such matrices. It also keeps sums and products.'
            answer_contract: {"kind":"written"}
            answer: 'The matrix has the two entries x and y, so the map is a bijection. Matrix sums and products give the same entries as sums and products of complex numbers.'
            solution_sketch: 'Each matrix of this form has the entries $x$ and $y$, which come from exactly one complex number, so the map is a bijection. The sum of two such matrices has the entries $x+x''$ and $y+y''$. The product of the matrices for $x+iy$ and $x''+iy''$ has the top row $xx''-yy'',\ xy''+yx''$ and the bottom row $-(xy''+yx''),\ xx''-yy''$. This is the matrix of the product of the two complex numbers. So the map is a ring isomorphism.'
        constraints: 'the bar, the inverse and matrices of complex numbers'
    diagnostic_exemplar:
      problem: 'Give the real part of $(1+i)(1-i)$.'
      answer_contract: {"kind":"exact"}
      answer: '2'
      solution_sketch: 'We get $(1+i)(1-i)=1-i^2$, and $i^2=-1$. So the product is 2 and the real part is 2.'
