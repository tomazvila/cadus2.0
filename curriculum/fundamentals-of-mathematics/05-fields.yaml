      - id: kp1
        name: 'Proposition 5.24: no rational number has square 2'
        key_prerequisites: [proof-by-contradiction]
        exemplars:
          - problem: 'Give 1 if the square of the number is even and 0 if not. (a) $14$. (b) $15$. (c) $22$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 0; c = 1'
            solution_sketch: 'The square of an even number is even, so (a) and (c) are 1. The square of 15 is 225, which is odd, so (b) is 0.'
          - problem: 'Give the exponent of the prime 2 in the prime factorization of the number. (a) $12^2$. (b) $40^2$. (c) $7^2$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 4; b = 6; c = 0'
            solution_sketch: 'Since $12=2^2\cdot 3$, we get $12^2=2^4\cdot 9$ and (a) is 4. Since $40=2^3\cdot 5$, we get $40^2=2^6\cdot 25$ and (b) is 6. The number 49 is odd, so (c) is 0.'
          - problem: 'Write $18/12$ in lowest terms as $n/d$ with $n$ and $d$ positive. (a) Give $n$. (b) Give $d$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}}]}
            answer: 'a = 3; b = 2'
            solution_sketch: 'The common factor of 18 and 12 is 6. Divide both by 6 to get $3/2$. So $n=3$ and $d=2$.'
          - problem: 'Compute $n^2-2d^2$ for each pair $(n,d)$. (a) $(7,5)$. (b) $(17,12)$. (c) $(3,2)$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = -1; b = 1; c = 1'
            solution_sketch: 'For (a), $49-50=-1$. For (b), $289-288=1$. For (c), $9-8=1$. The value is never 0, and the fractions $n/d$ come close to a number with square 2.'
          - problem: 'Give the smallest positive integer $n$ with the property. (a) The prime 5 divides $n^2$. (b) The prime 7 divides $n^3$. (c) The number 6 divides $n^2$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 5; b = 7; c = 6'
            solution_sketch: 'A prime that divides a power of $n$ divides $n$, so (a) is 5 and (b) is 7. For (c), 2 and 3 must both divide $n$. So 6 divides $n$, and $6^2=36$ is divisible by 6. The answer is 6.'
          - problem: 'Look at the integers $n$ from 1 to 30. (a) Count the $n$ with 3 dividing $n^2$. (b) Count the $n$ with 9 dividing $n^2$. (c) Count the $n$ with 12 dividing $n^2$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 10; b = 10; c = 5'
            solution_sketch: 'The prime 3 divides $n^2$ if and only if 3 divides $n$, which gives 10 values. Then 9 divides $n^2$ for the same 10 values. For 12 we need 2 and 3 to divide $n$, so $n$ is 6, 12, 18, 24 or 30. That is 5 values.'
          # argument: Proposition 5.24
          - problem: 'Prove the first step: Let $n$ be a natural number. If $n^2$ is even, then $n$ is even.'
            answer_contract: {"kind":"written"}
            answer: 'If n is odd, then n = 2k+1 and n^2 = 4k^2+4k+1 is odd. So an even square forces n to be even.'
            solution_sketch: 'Assume $n$ is odd, so $n=2k+1$. Then $n^2=4k^2+4k+1$, which is odd. So an odd $n$ never has an even square.'
          # argument: Proposition 5.24
          - problem: 'Prove the second step: Use the fact that $n^2$ even implies $n$ even for a natural number $n$. There is no rational number $r$ with $r^2=2$.'
            answer_contract: {"kind":"written"}
            answer: 'Assume r = n/d in lowest terms. Then n^2 = 2d^2, so n is even by the fact, then d is even, which contradicts lowest terms.'
            solution_sketch: 'Suppose $r=n/d$ with $n$ an integer, $d$ a natural number, and no common factor. Assume $n\ge 0$. Then $n^2=2d^2$, so $n^2$ is even and $n=2m$ by the fact. This gives $2m^2=d^2$, so $d^2$ is even and $d$ is even by the fact. Now 2 divides $n$ and $d$, which contradicts lowest terms. This is a proof by contradiction.'
          # source: FoM exercise 5.4-5-26
          - problem: 'Prove: Let $p$ be a prime number, let $n$ be a natural number and let $k\ge 1$ be an integer. If $p$ divides $n^k$, then $p$ divides $n$.'
            answer_contract: {"kind":"written"}
            answer: 'Use induction on k with the rule: if a prime divides a product ab, it divides a or b.'
            solution_sketch: 'For $k=1$ there is nothing to show. Let $p$ divide $n^{k+1}=n^k\cdot n$. A prime that divides a product divides one factor. So $p$ divides $n^k$ or $p$ divides $n$. In the first case, the induction hypothesis gives that $p$ divides $n$. In both cases $p$ divides $n$.'
        constraints: 'Integer arithmetic with primes; the proof is by contradiction with a fraction in lowest terms.'
      - id: kp2
        name: 'Definition 5.25 and Definition 5.26: bounds, supremum and infimum'
        key_prerequisites: [minimal-maximal-elements]
        exemplars:
          - problem: 'Take the set $A=\{2,5,7\}$ of integers with the usual order. (a) Give $\sup(A)$. (b) Give $\inf(A)$. (c) Count the integers $u$ from 0 to 10 that are upper bounds of $A$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 7; b = 2; c = 4'
            solution_sketch: 'The largest element is 7, so $\sup(A)=7$. The smallest element is 2, so $\inf(A)=2$. The upper bounds from 0 to 10 are 7, 8, 9, 10, which is 4 numbers.'
          - problem: 'Take the interval $A$ of all rational numbers $x$ with $0<x<1$. (a) Give $\sup(A)$. (b) Give $\inf(A)$. (c) Give 1 if $\sup(A)$ is an element of $A$ and 0 if not.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 0; c = 0'
            solution_sketch: 'The smallest upper bound of $A$ is 1 and the greatest lower bound is 0. The number 1 is not below 1, so it is not in $A$. So (c) is 0.'
          - problem: 'Take the set $A$ of all numbers $1/m$ with $m$ a positive integer. (a) Give $\sup(A)$. (b) Give $\inf(A)$. (c) Give 1 if $\inf(A)$ is an element of $A$ and 0 if not.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 0; c = 0'
            solution_sketch: 'The largest element is $1/1=1$, so $\sup(A)=1$. Every element is positive and the elements come close to 0, so $\inf(A)=0$. No $1/m$ equals 0, so (c) is 0.'
          - problem: 'Let $A$ be the set of rational numbers $x$ with $2\le x\le 5$. Give 1 if the number is an upper bound of $A$ and 0 if not. (a) $5$. (b) $4$. (c) $9$. (d) $3$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 0; c = 1; d = 0'
            solution_sketch: 'An upper bound is at least every element of $A$, so it is at least 5. The numbers 5 and 9 are at least 5, so (a) and (c) are 1. The numbers 4 and 3 are below 5, so (b) and (d) are 0.'
          - problem: 'Let $A=\{3,6,9\}$ with the usual order. Give 1 if the number is a lower bound of $A$ and 0 if not. (a) $3$. (b) $4$. (c) $-2$. (d) $6$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 0; c = 1; d = 0'
            solution_sketch: 'A lower bound is at most every element of $A$, so it is at most 3. The numbers 3 and $-2$ are at most 3, so (a) and (c) are 1. The numbers 4 and 6 are above 3, so (b) and (d) are 0.'
          - problem: 'On the positive integers use the order $a\le b$ if $a$ divides $b$. Then $\sup$ is the least common multiple and $\inf$ is the greatest common divisor. (a) Give $\sup(\{4,6\})$. (b) Give $\inf(\{4,6\})$. (c) Give $\sup(\{2,3,5\})$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 12; b = 2; c = 30'
            solution_sketch: 'The least common multiple of 4 and 6 is 12 and their greatest common divisor is 2. The least common multiple of 2, 3 and 5 is 30.'
        constraints: 'Explicit sets; an upper bound is at least every element, the supremum is the least upper bound.'
      - id: kp3
        name: 'Proposition 5.27: a supremum is unique'
        key_prerequisites: [minimal-maximal-elements]
        exemplars:
          - problem: 'Let $A=\{1,4,9\}$ with the usual order. (a) Give the supremum of $A$. (b) Count the suprema of $A$. (c) Give the infimum of $A$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 9; b = 1; c = 1'
            solution_sketch: 'The least upper bound of $A$ is 9. A supremum is unique, so there is 1 supremum. The greatest lower bound is 1.'
          - problem: 'Let $A$ be the set of rational numbers $x$ with $x<3$. (a) Give $\sup(A)$. (b) Give 1 if $\sup(A)$ is in $A$ and 0 if not. (c) Count the suprema of $A$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 3; b = 0; c = 1'
            solution_sketch: 'The upper bounds of $A$ are the numbers at least 3, and the least one is 3. The number 3 is not below 3, so (b) is 0. A supremum is unique, so (c) is 1.'
          - problem: 'The set $A$ has the supremum $s=7/3$. Let $t$ be a supremum of $A$. (a) Give $t$. (b) Give $t-s$. (c) Give $s+t$ as a fraction.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 7/3; b = 0; c = 14/3'
            solution_sketch: 'Two suprema of one set are equal, so $t=7/3$. Then $t-s=0$ and $s+t=14/3$.'
          - problem: 'Let $A=\{2,4,6,8\}$ with the usual order. (a) Give $\sup(A)$. (b) Give $\inf(A)$. (c) Count the upper bounds of $A$ among the integers 1 to 10. (d) Count the lower bounds of $A$ among the integers 1 to 10.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}}]}
            answer: 'a = 8; b = 2; c = 3; d = 2'
            solution_sketch: 'The largest element is 8 and the smallest is 2. The upper bounds from 1 to 10 are 8, 9, 10, which is 3 numbers. The lower bounds are 1 and 2, which is 2 numbers.'
          - problem: 'Let $A$ be the set of rational numbers $x$ with $1<x<2$. (a) Give $\sup(A)$. (b) Give $\inf(A)$. (c) Give 1 if $\sup(A)$ is an element of $A$ and 0 if not.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 2; b = 1; c = 0'
            solution_sketch: 'The least upper bound of $A$ is 2 and the greatest lower bound is 1. The number 2 is not below 2, so it is not in $A$. So (c) is 0.'
          - problem: 'On the positive integers use the order $a\le b$ if $a$ divides $b$. Let $A=\{8,12\}$. (a) Give $\inf(A)$. (b) Give $\sup(A)$. (c) Count the upper bounds of $A$ among the integers 1 to 48.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 4; b = 24; c = 2'
            solution_sketch: 'The greatest common divisor of 8 and 12 is 4 and their least common multiple is 24. The upper bounds are the multiples of 24. Among 1 to 48 these are 24 and 48, which is 2 numbers.'
          # argument: Proposition 5.27
          - problem: 'Prove: Let $X$ be a set with an order relation $\le$ and let $A\subseteq X$ be bounded above. If $s$ and $t$ are both suprema of $A$, then $s=t$.'
            answer_contract: {"kind":"written"}
            answer: 'Each supremum is an upper bound and lies below every upper bound. So s<=t and t<=s, and antisymmetry gives s=t.'
            solution_sketch: 'The element $s$ is an upper bound of $A$ and $t$ is a supremum, so $t\le s$. The element $t$ is an upper bound of $A$ and $s$ is a supremum, so $s\le t$. Antisymmetry of the order gives $s=t$. This uses Definition 5.26.'
          # source: FoM exercise 5.4-5-24
          - problem: 'Prove: Let $X$ be a set with an order relation $\le$ and let $A\subseteq X$ be bounded below. If $s$ and $t$ are both infima of $A$, then $s=t$.'
            answer_contract: {"kind":"written"}
            answer: 'Each infimum is a lower bound and lies above every lower bound. So s<=t and t<=s, and antisymmetry gives s=t.'
            solution_sketch: 'The element $s$ is a lower bound of $A$ and $t$ is an infimum, so $s\le t$. The element $t$ is a lower bound of $A$ and $s$ is an infimum, so $t\le s$. Antisymmetry of the order gives $s=t$. This uses Definition 5.26.'
        constraints: 'A set with an order relation; the proof uses antisymmetry and Definition 5.26.'
      - id: kp4
        name: 'Example 5.28: the rational numbers with square at most 2 have no supremum in the rational numbers'
        key_prerequisites: [fom-5-3-ordered-fields, proof-by-contradiction]
        exemplars:
          - problem: 'Let $S$ be the set of rational numbers $x$ with $x^2\le 2$. Give 1 if the number is in $S$ and 0 if not. (a) $1$. (b) $3/2$. (c) $7/5$. (d) $-3/2$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 0; c = 1; d = 0'
            solution_sketch: 'We have $1^2=1\le 2$, so (a) is 1. We have $(3/2)^2=9/4>2$, so (b) is 0. We have $(7/5)^2=49/25=1.96\le 2$, so (c) is 1. We have $(-3/2)^2=9/4>2$, so (d) is 0.'
          - problem: 'Let $S$ be the set of rational numbers $x$ with $x^2\le 2$. Give 1 if the number is an upper bound of $S$ and 0 if not. (a) $2$. (b) $1$. (c) $3/2$. (d) $7/5$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 0; c = 1; d = 0'
            solution_sketch: 'Every element of $S$ is below 3/2, so 2 and 3/2 are upper bounds. The number $7/5$ is in $S$ and so is $1.41$ because $1.41^2=1.9881$. Since $1.41>7/5$, the number $7/5$ is not an upper bound. The number 1 is not an upper bound because $7/5>1$. So (b) and (d) are 0 and (a) and (c) are 1.'
          - problem: 'Let $x=7/5$. (a) Give $x^2$ as a fraction. (b) Give $2-x^2$ as a fraction. (c) Give 1 if $x$ is in the set of rational numbers with square at most 2, and 0 if not.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 49/25; b = 1/25; c = 1'
            solution_sketch: 'We get $x^2=49/25$ and $2-x^2=50/25-49/25=1/25$. The difference is positive, so $x^2\le 2$ and (c) is 1.'
          - problem: 'Start with $s=3/2$. Define $s''=(s+2/s)/2$. (a) Give $s''$. (b) Give $s''^2$ as a fraction. (c) Give 1 if $s''^2\ge 2$ and 0 if not.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 17/12; b = 289/144; c = 1'
            solution_sketch: 'We get $2/s=4/3$, so $s''=(3/2+4/3)/2=(17/6)/2=17/12$. Then $s''^2=289/144$. Since $289/144>2=288/144$, the value of (c) is 1.'
          - problem: 'Let $S$ be the set of rational numbers $x$ with $x^2\le 2$. (a) Count the integers in $S$. (b) Give the largest integer in $S$. (c) Count the integers from 1 to 5 that are upper bounds of $S$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 3; b = 1; c = 4'
            solution_sketch: 'The integers with square at most 2 are $-1$, 0 and 1, which is 3 integers. The largest is 1. The upper bounds from 1 to 5 are 2, 3, 4, 5, which is 4 numbers.'
          - problem: 'Find the largest integer $k$ with the property. (a) $(k/10)^2\le 2$. (b) $(k/100)^2\le 2$. (c) $(k/1000)^2\le 2$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 14; b = 141; c = 1414'
            solution_sketch: 'We have $1.4^2=1.96\le 2<2.25=1.5^2$, so (a) is 14. We have $1.41^2=1.9881\le 2<2.0164=1.42^2$, so (b) is 141. We have $1.414^2=1.999396\le 2<2.002225=1.415^2$, so (c) is 1414.'
          # source: FoM exercise 5.4-5-25
          - problem: 'Prove: Let $S$ be the set of rational numbers $x$ with $x^2\le 2$ and let $s>0$ be the supremum of $S$ in $\mathbb{Q}$. Then $s^2<2$ is impossible.'
            answer_contract: {"kind":"written"}
            answer: 'If s^2 < 2, pick a small positive delta with (s+delta)^2 < 2. Then s+delta is in S and exceeds s, so s is not an upper bound.'
            solution_sketch: 'Suppose $s^2<2$. Let $\varepsilon=2-s^2>0$ and $\delta=\min(1,\varepsilon/(2s+1))$. Then $(s+\delta)^2=s^2+2s\delta+\delta^2\le s^2+(2s+1)\delta\le s^2+\varepsilon=2$. So $s+\delta$ is in $S$ and $s+\delta>s$. This contradicts the fact that $s$ is an upper bound of $S$ in Example 5.28.'
        constraints: 'Rational numbers only; the set of rational numbers with square at most 2 has upper bounds but no least one.'
