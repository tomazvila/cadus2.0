      - id: kp4
        name: 'Theorem 5.39 and Proposition 5.40: completeness and the copy of the rational numbers'
        key_prerequisites: [minimal-maximal-elements]
        exemplars:
          - problem: 'Let $A$ be the set of the three real numbers $\{q<1\}$, $\{q<2\}$ and $\{q<\frac32\}$, with $q$ rational. (a) Give the rational number $r$ with $\bigcup A=\{q\in\mathbb{Q}: q<r\}$. (b) Give 1 if $\bigcup A$ is an element of $A$ and 0 if not. (c) Give 1 if $\{q<5\}$ is an upper bound of $A$ and 0 if not.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 2; b = 1; c = 1'
            solution_sketch: 'The union of the three sets is the largest of them, $\{q: q<2\}$, so $r=2$ in (a). That set is in $A$, so (b) is 1. All three sets are inside $\{q: q<5\}$, so (c) is 1.'
          - problem: 'Let $A$ be the set of all real numbers $\{q\in\mathbb{Q}: q<1-\frac1n\}$ with $n=1,2,3,\dots$. (a) Give the rational number $r$ with $\bigcup A=\{q\in\mathbb{Q}: q<r\}$. (b) Give 1 if $\bigcup A$ is an element of $A$ and 0 if not. (c) Give 1 if $\frac{99}{100}$ is in $\bigcup A$ and 0 if not.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 0; c = 1'
            solution_sketch: 'Each rational below 1 is below $1-\frac1n$ for a large $n$, and no rational from 1 up is in the union. So $r=1$ in (a). No set of $A$ equals $\{q: q<1\}$, so (b) is 0. For $n=101$ we have $1-\frac1{101}>0.99$, so (c) is 1.'
          - problem: 'Let $f(q)=\{x\in\mathbb{Q}: x<q\}$ for each rational $q$. (a) Give the rational number $r$ with $f(3)+f(4)=f(r)$. (b) Give the rational number $s$ with $f(2)\cdot f(5)=f(s)$. (c) Give the rational number $t$ with $f(-2)\cdot f(3)=f(t)$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 7; b = 10; c = -6'
            solution_sketch: 'The map $f$ keeps sums and products. So $r=3+4=7$ in (a), and $s=2\cdot5=10$ in (b). For (c), $f(-2)\cdot f(3)=f(-2\cdot 3)=f(-6)$, so $t=-6$.'
          - problem: 'Let $f(q)=\{x\in\mathbb{Q}: x<q\}$ for each rational $q$. For each pair $(p,q)$, give 1 if $f(p)\subseteq f(q)$ and 0 if not. (a) $(p,q)=(\frac12,\frac23)$. (b) $(p,q)=(-1,-2)$. (c) $(p,q)=(3,3)$. (d) $(p,q)=(-\frac53,-\frac32)$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 0; c = 1; d = 1'
            solution_sketch: 'The inclusion $f(p)\subseteq f(q)$ holds exactly when $p\le q$. In (a), $0.5\le 0.67$, so the value is 1. In (b), $-1>-2$, so the value is 0. In (c), the two numbers are equal, so the value is 1. In (d), $-1.67\le-1.5$, so the value is 1.'
          - problem: 'Let $f(q)=\{x\in\mathbb{Q}: x<q\}$ for each rational $q$. (a) Give the rational number $r$ with $f(r)=\{x\in\mathbb{Q}: x<-\frac52\}$. (b) Count the integers $q\ge 0$ with $f(q)\subsetneq f(\frac72)$. (c) Give 1 if $\{x\in\mathbb{Q}: x<0 \text{ or } x^2<2\}$ is equal to $f(q)$ for some rational $q$, and 0 if not.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = -5/2; b = 4; c = 0'
            solution_sketch: 'The set $f(r)$ has the upper limit $r$, so $r=-\frac52$ in (a). The integers $0,1,2,3$ are below $3.5$, so (b) is 4. The set in (c) has no rational upper limit, because no rational number has the square 2, so (c) is 0.'
          - problem: 'Let $S=\{q\in\mathbb{Q}: q>0, q^2<2\}$. (a) Give 1 if $S$ has a supremum in $\mathbb{Q}$ and 0 if not. (b) Give 1 if $S$, seen as a set of real numbers through the map $q\mapsto\{x<q\}$, has a supremum in $\mathbb{R}$ and 0 if not. (c) Give 1 if $S$ has an upper bound in $\mathbb{Q}$ and 0 if not.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 0; b = 1; c = 1'
            solution_sketch: 'A least upper bound of $S$ in $\mathbb{Q}$ has the square 2, and no rational number has that square, so (a) is 0. The real numbers satisfy the Completeness Axiom, and $S$ is nonempty and bounded above, so (b) is 1. The rational number 2 is an upper bound of $S$, so (c) is 1.'
          - problem: 'Let $f(q)=\{x\in\mathbb{Q}: x<q\}$ for each rational $q$. (a) Give the rational number $r$ with $f(6)+f(-6)=f(r)$. (b) Give the rational number $s$ with $f(1)\cdot f(7)=f(s)$. (c) Give the rational number $t$ with $f(\frac12)+f(\frac13)=f(t)$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 0; b = 7; c = 5/6'
            solution_sketch: 'The map $f$ keeps sums and products. So $r=6+(-6)=0$ in (a). Next, $s=1\cdot 7=7$ in (b). Last, $t=\frac12+\frac13=\frac56$ in (c).'
          # argument: Theorem 5.39
          - problem: 'Prove: every nonempty set of real numbers that has an upper bound has a least upper bound.'
            answer_contract: {"kind":"written"}
            answer: 'Take the union S of all cuts in the set. Show that S is a real number, an upper bound and below each other upper bound.'
            solution_sketch: 'Use Definition 5.30 and Theorem 5.38. Let A have the upper bound X. The union S of A is a subset of ℚ and S differs from the set of all rationals, because S is inside X. S is a down set, because t in S lies in some T of A. S has no largest element, because that element is then largest in T. So S is a real number, and S is the least upper bound by inclusion.'
          # argument: Proposition 5.40
          - problem: 'Prove: the map $f(q)=\{x\in\mathbb{Q}: x<q\}$ sends $\mathbb{Q}$ into $\mathbb{R}$ and keeps sums, products and order.'
            answer_contract: {"kind":"written"}
            answer: 'Check that each f(q) is a real number. Then compare the sum set and the product set with f of the sum and f of the product.'
            solution_sketch: 'Use Definition 5.30 and Definition 5.32. The set f(q) is a nonempty down set without a largest element, and it misses q. The sum f(p)+f(q) equals f(p+q), because rationals below p plus rationals below q are exactly the rationals below p+q. The product works the same way with the cases of Definition 5.35. If p is at most q, then f(p) is inside f(q).'
          # source: FoM exercise 5.5-5-31
          - problem: 'Prove five facts about $f(q)=\{x\in\mathbb{Q}: x<q\}$. (a) Each $f(q)$ is a real number. (b) The map $f$ is one to one. (c) $f(p+q)=f(p)+f(q)$. (d) $f(p\cdot q)=f(p)\cdot f(q)$. (e) If $p\le q$, then $f(p)\subseteq f(q)$.'
            answer_contract: {"kind":"written"}
            answer: 'Prove (a) and (b) from the definition of a cut. Compare sets of sums for (c) and sets of products for (d) and use inclusion for (e).'
            solution_sketch: 'Use Proposition 5.40 and Definition 5.30. For (a), f(q) has no largest element since for x below q the mean of x and q is also below q. For (b), if p is below q, then p lies in f(q) and not in f(p). For (c), compare the sets of sums. For (d), use the cases of Definition 5.35. Part (e) is inclusion.'
        constraints: 'Find the union of cuts and compute with the images of rationals; the items vary the sets and the numbers.'
      - id: kp5
        name: 'Proposition 5.41 to Theorem 5.44: infima, the Archimedean property, density and roots'
        key_prerequisites: [fom-5-3-ordered-fields]
        exemplars:
          - problem: 'Let $S=\{1+\frac1n: n=1,2,3,\dots\}$. (a) Give the infimum of $S$. (b) Give 1 if the infimum is an element of $S$ and 0 if not. (c) Give the supremum of $S$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 0; c = 2'
            solution_sketch: 'The numbers $1+\frac1n$ come as close to 1 as we like and never reach it, so the infimum is 1 in (a). Since 1 is not in $S$, (b) is 0. The largest element is $1+\frac11=2$, so (c) is 2.'
          - problem: 'Let $S$ be the set of all real numbers $x$ with $-3<x<-1$. (a) Give the greatest lower bound of $S$. (b) Give the least upper bound of $S$. (c) Give 1 if the greatest lower bound is an element of $S$ and 0 if not.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = -3; b = -1; c = 0'
            solution_sketch: 'The lower bounds of $S$ are the numbers at most $-3$, so the greatest one is $-3$ in (a). The upper bounds are the numbers at least $-1$, so the least one is $-1$ in (b). The number $-3$ is not above $-3$, so it is not in $S$ and (c) is 0.'
          - problem: 'For each real number $x$, give the least natural number $n$ with $n\ge x$. (a) $x=\frac{17}{3}$. (b) $x=\frac{201}{2}$. (c) $x=\frac{1000}{7}$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 6; b = 101; c = 143'
            solution_sketch: 'In (a), $\frac{17}3\approx 5.67$, so $n=6$. In (b), $\frac{201}2=100.5$, so $n=101$. In (c), $\frac{1000}7\approx 142.86$, so $n=143$.'
          - problem: 'For each pair, give the least natural number $n$ with $\frac{x}{n}<\varepsilon$. (a) $x=3$, $\varepsilon=\frac1{50}$. (b) $x=\frac72$, $\varepsilon=\frac1{50}$. (c) $x=5$, $\varepsilon=\frac14$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 151; b = 176; c = 21'
            solution_sketch: 'The inequality $\frac xn<\varepsilon$ means $n>\frac x\varepsilon$. In (a), $\frac x\varepsilon=150$, so $n=151$. In (b), $\frac x\varepsilon=175$, so $n=176$. In (c), $\frac x\varepsilon=20$, so $n=21$.'
          - problem: 'Let $a=\frac13$ and $b=\frac12$. (a) Give the least natural number $n$ with $\frac1n<b-a$. (b) For that $n$, give the largest integer $l$ with $\frac ln\le a$. (c) Give the rational number $\frac{l+1}{n}$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 7; b = 2; c = 3/7'
            solution_sketch: 'The difference is $b-a=\frac16$, and $\frac1n<\frac16$ means $n>6$, so $n=7$. Next, $\frac l7\le\frac13$ means $l\le\frac73$, so $l=2$. The number $\frac{l+1}n=\frac37\approx 0.43$ lies between $0.33$ and $0.5$.'
          - problem: 'For each equation, give the nonnegative real number $r$ that solves it. (a) $r^3=27$. (b) $r^4=\frac{81}{16}$. (c) $r^5=32$. (d) $r^2=0$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}}]}
            answer: 'a = 3; b = 3/2; c = 2; d = 0'
            solution_sketch: 'In (a), $3^3=27$, so $r=3$. In (b), $(\frac32)^4=\frac{81}{16}$, so $r=\frac32$. In (c), $2^5=32$, so $r=2$. In (d), $0^2=0$, so $r=0$.'
          - problem: 'Let $R=\{x\in\mathbb{R}: x\ge 0, x^2\le\frac{49}{4}\}$. (a) Give the supremum of $R$. (b) Give 1 if the supremum is an element of $R$ and 0 if not. (c) Give the number $\max\{1,\frac{49}{4}\}$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 7/2; b = 1; c = 49/4'
            solution_sketch: 'The nonnegative numbers $x$ with $x^2\le\frac{49}4$ are those with $x\le\frac72$, so the supremum is $\frac72$ in (a). That number satisfies $x^2\le\frac{49}4$, so (b) is 1. The larger of 1 and $\frac{49}4$ is $\frac{49}4$ in (c).'
          - problem: 'Use $n=3$, $r=2$ and $m=10$. Expand $(r+\frac1m)^n$ with the Binomial Theorem. (a) Give the term for $k=1$, that is, $\binom31 r^2\cdot\frac1m$, as a decimal. (b) Give the sum of the terms for $k=1,2,3$ as a decimal. (c) Give $(r+\frac1m)^3$ as a decimal.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 1.2; b = 1.261; c = 9.261'
            solution_sketch: 'The term for $k=1$ is $3\cdot 4\cdot 0.1=1.2$. The term for $k=2$ is $3\cdot 2\cdot 0.01=0.06$ and the term for $k=3$ is $0.001$. The sum is $1.2+0.06+0.001=1.261$. Add the term $2^3=8$ for $k=0$ to get $9.261$.'
          # source: FoM exercise 5.5-5-37
          - problem: 'Solve each inequality in $\mathbb{R}$. (a) For $|7x+2|<3$, give the left end of the solution interval. (b) Give the right end of that interval. (c) The solutions of $|6x+5|>2$ form two rays. Give the end of the left ray. (d) Give the end of the right ray. (e) The solutions of $3\le|2x+4|\le 11$ form two intervals. Give the smallest end point. (f) Give the second end point. (g) Give the third end point. (h) Give the largest end point.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}},{"name":"e","contract":{"kind":"exact"}},{"name":"f","contract":{"kind":"exact"}},{"name":"g","contract":{"kind":"exact"}},{"name":"h","contract":{"kind":"exact"}}]}
            answer: 'a=-5/7;b=1/7;c=-7/6;d=-1/2;e=-15/2;f=-7/2;g=-1/2;h=7/2'
            solution_sketch: 'For (a), $-3<7x+2<3$ gives $-\frac57<x<\frac17$. For (c) and (d), $6x+5>2$ gives $x>-\frac12$ and $6x+5<-2$ gives $x<-\frac76$. For the last part, $|x+2|$ lies between $\frac32$ and $\frac{11}2$. So $x$ lies in $[-\frac{15}2,-\frac72]$ or in $[-\frac12,\frac72]$.'
          # argument: Proposition 5.41
          - problem: 'Prove: every nonempty set of real numbers that has a lower bound has a greatest lower bound.'
            answer_contract: {"kind":"written"}
            answer: 'Collect the lower bounds into a set L. By completeness L has a supremum, and this supremum is the infimum of S.'
            solution_sketch: 'Use Theorem 5.39. Let L be the set of lower bounds of S. L is nonempty, and each element of S is an upper bound of L. By Theorem 5.39, L has a supremum. Each s in S is an upper bound of L, so s is at least the supremum. So the supremum is a lower bound of S, and it is at least every other lower bound.'
          # argument: Theorem 5.42
          - problem: 'Prove: for every real number $x$ there is a natural number $n$ with $n\ge x$.'
            answer_contract: {"kind":"written"}
            answer: 'Assume all naturals are below x. The set of such x has an infimum b, and a natural n near b gives a lower bound n+1 above b.'
            solution_sketch: 'Use Proposition 5.41. Assume n < x for all naturals n. Let B be the set of all y with n < y for all naturals n. B is nonempty and bounded below, so B has an infimum b by Proposition 5.41. Then b - 1/2 is not in B, so some natural n has n at least b - 1/2. The number n + 1 is a lower bound of B and exceeds b, which is a contradiction.'
          # argument: Theorem 5.43
          - problem: 'Prove: for real numbers $a<b$ there is a rational number $q$ with $a<q<b$.'
            answer_contract: {"kind":"written"}
            answer: 'Pick n with 1/n below b-a. Then (l+1)/n lies between a and b, where l/n is the last multiple of 1/n at most a.'
            solution_sketch: 'Use Theorem 5.42 and Theorem 5.22. By Theorem 5.42, there is a natural n with n above 1/(b-a). Theorem 5.22 gives 1/n below b-a. Let l be the largest integer with l/n at most a. Then (l+1)/n exceeds a. Also (l+1)/n is at most a + 1/n, and a + 1/n is below b.'
          # argument: Theorem 5.44
          - problem: 'Prove the first step: for a natural number $n$ and a real number $a\ge 0$ there is a real number $r\ge 0$ with $r^n=a$.'
            answer_contract: {"kind":"written"}
            answer: 'Let R be the set of x at least 0 with x^n at most a, and let r be its supremum. Rule out r^n below a and r^n above a by small changes of r.'
            solution_sketch: 'Use Theorem 5.42 and Theorem 5.39. The set R holds 0 and has the upper bound max(1,a), so r exists by Theorem 5.39. If r^n is below a, Theorem 5.42 gives m with (r+1/m)^n below a by the Binomial Theorem. Then r+1/m is in R, which contradicts that r is an upper bound. If r^n is above a, lower r by a small v and find that r-v is also an upper bound of R. Hence r^n = a.'
          # argument: Theorem 5.44
          - problem: 'Prove the second step: for a natural number $n$ and a real number $a\ge 0$, there is at most one real number $r\ge 0$ with $r^n=a$.'
            answer_contract: {"kind":"written"}
            answer: 'If b is below r, expand (b+d)^n for d = r-b to see that r^n exceeds b^n. The same argument works if b is above r.'
            solution_sketch: 'This step needs the Binomial Theorem and the order of the real numbers, and it needs no more of Theorem 5.42. Suppose b and r are nonnegative with b^n = r^n = a and b is not equal to r. Take b below r and put d = r - b. Then r^n = (b+d)^n = b^n plus positive terms, so r^n exceeds a. This is a contradiction.'
          # source: FoM exercise 5.5-5-32
          - problem: 'Prove: for real numbers $x>0$ and $\varepsilon>0$ there is a natural number $n$ with $\frac xn<\varepsilon$.'
            answer_contract: {"kind":"written"}
            answer: 'Apply the Archimedean property to x divided by epsilon, plus 1. This gives n above x divided by epsilon.'
            solution_sketch: 'Use Theorem 5.42. Theorem 5.42 gives a natural n with n at least x/epsilon + 1. Then n exceeds x/epsilon. Since n is positive, this gives x/n below epsilon.'
          # source: FoM exercise 5.5-5-33
          - problem: 'Let $R=\{x\ge 0: x^n\le a\}$ and $r=\sup R$. Prove that $r^n>a$ is impossible.'
            answer_contract: {"kind":"written"}
            answer: 'If r^n exceeds a, a small drop v keeps (r-v)^n above a. Then r-v is a smaller upper bound of R.'
            solution_sketch: 'Use Theorem 5.44 and Theorem 5.39. Suppose r^n exceeds a. By the Binomial Theorem, (r-v)^n is at least r^n minus a small multiple of v. So for small v > 0, (r-v)^n still exceeds a. Then each x in R is below r - v, because x^n is at most a. So r - v is an upper bound of R below r, which is a contradiction.'
          # source: FoM exercise 5.5-5-38
          - problem: 'Let $D$ be a positive real number and $E$ a negative real number. Give the down set of $D+E$ in terms of $D$ and $E$, and prove it. Then do the same for two negative real numbers $D$ and $E$.'
            answer_contract: {"kind":"written"}
            answer: 'The down set of D+E holds all sums d+e with d in D and e in E. For two negative numbers, 0 is not in it, so the sum is negative.'
            solution_sketch: 'Use Definition 5.32 and Proposition 5.37. The down set of $D+E$ is the set of all sums $d+e$ with $d$ in $D$ and $e$ in $E$. For two negative numbers, each sum $d+e$ is below 0, so 0 is not in $D+E$ and the sum is negative. For a positive $D$ and a negative $E$, the sum holds 0 exactly when the upper limit of $D$ exceeds the absolute value of the upper limit of $E$. So the sign of the sum follows from that comparison.'
          # source: FoM exercise 5.5-5-39
          - problem: 'Prove: the map $f(x)=\sqrt{4x}$ is a bijection from the nonnegative real numbers to the nonnegative real numbers.'
            answer_contract: {"kind":"written"}
            answer: 'Write f(x) = 2 times the square root of x. The map y to y squared over 4 is its inverse.'
            solution_sketch: 'Use Theorem 5.44. By Theorem 5.44, each nonnegative x has a unique nonnegative square root. Since 4x = (2 sqrt x)^2, f(x) = 2 sqrt x. The map g(y) = y^2/4 sends nonnegative numbers to nonnegative numbers. Then g(f(x)) = x and f(g(y)) = y, so f is a bijection.'
        constraints: 'Find infima and suprema, least natural numbers, rational numbers between two reals and roots; the items vary the numbers.'
      - id: kp6
        name: 'Definition 5.45 to Theorem 5.48: roots, rational powers and the uniqueness of the real numbers'
        key_prerequisites: [fom-5-2-fields]
        exemplars:
          - problem: 'Give the root as an integer. (a) $125^{1/3}$. (b) $16^{1/4}$. (c) $81^{1/2}$. (d) $64^{1/6}$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}}]}
            answer: 'a = 5; b = 2; c = 9; d = 2'
            solution_sketch: 'In (a), $5^3=125$, so the value is 5. In (b), $2^4=16$, so the value is 2. In (c), $9^2=81$, so the value is 9. In (d), $2^6=64$, so the value is 2.'
          - problem: 'Compute each power. Use $a^{n/d}=(a^{1/d})^n$. (a) $8^{2/3}$. (b) $27^{4/3}$. (c) $16^{3/4}$. (d) $32^{-2/5}$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}}]}
            answer: 'a = 4; b = 81; c = 8; d = 1/4'
            solution_sketch: 'In (a), $8^{1/3}=2$ and $2^2=4$. In (b), $27^{1/3}=3$ and $3^4=81$. In (c), $16^{1/4}=2$ and $2^3=8$. In (d), $32^{1/5}=2$ and $2^{-2}=\frac14$.'
          - problem: 'Use the rules for rational exponents. (a) Compute $(4\cdot 9)^{1/2}$. (b) Compute $(8^{2/3})^{3/2}$. (c) Compute $9^{1/2}\cdot 9^{3/2}$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 6; b = 8; c = 81'
            solution_sketch: 'In (a), $(4\cdot 9)^{1/2}=4^{1/2}\cdot 9^{1/2}=2\cdot3=6$. In (b), the exponents multiply to $\frac23\cdot\frac32=1$, so the value is $8^1=8$. In (c), the exponents add to $\frac12+\frac32=2$, so the value is $9^2=81$.'
          - problem: 'Compute each value. (a) $16^{3/4}\cdot 16^{-1/2}$. (b) $(27\cdot 8)^{1/3}$. (c) $(4^{3/2})^{2/3}$. (d) $(2^{1/2})^4$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}}]}
            answer: 'a = 2; b = 6; c = 4; d = 4'
            solution_sketch: 'In (a), the exponents add to $\frac34-\frac12=\frac14$ and $16^{1/4}=2$. In (b), $216^{1/3}=6$. In (c), the exponents multiply to 1, so the value is $4$. In (d), the exponents multiply to 2, so the value is $2^2=4$.'
          - problem: 'Count the real solutions of each equation. (a) $x^2=9$. (b) $x^3=-8$. (c) $x^4=-16$. (d) $x^5=0$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}}]}
            answer: 'a = 2; b = 1; c = 0; d = 1'
            solution_sketch: 'In (a), the solutions are 3 and $-3$, so the count is 2. In (b), the only solution is $-2$, so the count is 1. A fourth power is never negative, so (c) has 0 solutions. In (d), only $x=0$ works, so the count is 1.'
          - problem: 'Let $\varphi$ be an order preserving field isomorphism from $\mathbb{R}$ to $\mathbb{R}$. It keeps sums and products and it gives $\varphi(1)=1$. Then $\varphi(q)=q$ for each rational $q$. (a) Compute $\varphi(3)+\varphi(4)\cdot\varphi(2)$. (b) Compute $\varphi(-\frac52)$. (c) Compute $\varphi(\sqrt2)\cdot\varphi(\sqrt2)$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 11; b = -5/2; c = 2'
            solution_sketch: 'By (a), the value is $3+4\cdot 2=11$. By (b), the rational number $-\frac52$ stays fixed. For (c), $\varphi(\sqrt2)\cdot\varphi(\sqrt2)=\varphi(2)=2$.'
          # source: FoM exercise 5.5-5-36
          - problem: 'Solve each equation in $\mathbb{R}$. (a) Give the number of solutions of $x^2-2=0$. (b) Give the number of solutions of $x^2+1=0$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}}]}
            answer: 'a = 2; b = 0'
            solution_sketch: 'The equation in (a) has the two real solutions $\sqrt2$ and $-\sqrt2$, so (a) is 2. A real square is never negative, so $x^2=-1$ has no real solution and (b) is 0.'
          # argument: Theorem 5.47
          - problem: 'Prove the first part: for real numbers $a,b\ge 0$ and a rational number $p$, $(a\cdot b)^p=a^p\cdot b^p$.'
            answer_contract: {"kind":"written"}
            answer: 'Write p as n over d. Both sides are nonnegative d-th roots of the same number, so uniqueness of roots makes them equal.'
            solution_sketch: 'Use Definition 5.45 and Definition 5.46. Write p = n/d. Then (ab)^p is the d-th root of (ab)^n = a^n b^n. The product of the d-th root of a^n and the d-th root of b^n has d-th power a^n b^n. By uniqueness of roots in Theorem 5.44, the two numbers are equal.'
          # argument: Theorem 5.47
          - problem: 'Prove the second part: for real numbers $a\ge 0$ and rational numbers $p$ and $q$, $a^{p+q}=a^p\cdot a^q$.'
            answer_contract: {"kind":"written"}
            answer: 'Use a common denominator de for p and q. Then compare (de)-th powers of both sides with the rules for integer powers.'
            solution_sketch: 'Use Definition 5.46 and Theorem 5.44. Let p have numerator n and denominator d, and let q have numerator m and denominator e. The sum p + q is (ne+md)/(de). Both a^(p+q) and a^p a^q are nonnegative roots of order de of the same number a^(ne+md). By uniqueness of roots, they are equal.'
          # source: FoM exercise 5.5-5-34
          - problem: 'Prove: for a real number $a\ge 0$ and rational numbers $p$ and $q$, $(a^p)^q=a^{pq}$.'
            answer_contract: {"kind":"written"}
            answer: 'Write p and q as fractions. Show that both sides are nonnegative roots of the same number, then use uniqueness of roots.'
            solution_sketch: 'Use Theorem 5.47 and Definition 5.46. Take p with numerator n and denominator d, and q with numerator m and denominator e. The number (a^p)^q is the e-th root of (a^p)^m. Its (de)-th power equals a^(nm), so it equals a^(pq) by uniqueness of roots.'
          # argument: Theorem 5.48
          - problem: 'Prove the first step: let $\mathbb{F}$ be an ordered field in which each nonempty bounded set has a supremum. Then $\mathbb{F}$ holds a copy of $\mathbb{Q}$, and below each element of $\mathbb{F}$ lies an element of that copy.'
            answer_contract: {"kind":"written"}
            answer: 'Characteristic 0 gives a copy of Q. If some f is below the whole copy, the infimum of the copy is moved down by 1, a contradiction.'
            solution_sketch: 'Use Theorem 5.13 and Theorem 5.39. The characteristic of F is 0, so Theorem 5.13 gives a copy of Q in F. Suppose f is at most every element of the copy. The copy is bounded below, so it has an infimum a. Every q - 1 is in the copy, so a + 1 is a lower bound of the copy. This contradicts that a is the greatest lower bound.'
          # argument: Theorem 5.48
          - problem: 'Prove the second step: let $\mathbb{F}$ be a complete ordered field. Let $\mathbb{Q}_{\mathbb{F}}$ be the set of elements of $\mathbb{F}$ that are quotients of integer multiples of the identity $1$ of $\mathbb{F}$. Let $\psi$ be the order preserving field isomorphism from $\mathbb{Q}_{\mathbb{F}}$ onto $\mathbb{Q}$. For $f\in\mathbb{F}$ let $\varphi(f)=\{\psi(q): q\in\mathbb{Q}_{\mathbb{F}}, q<f\}$. Show that $\varphi$ is an order preserving field isomorphism from $\mathbb{F}$ onto $\mathbb{R}$.'
            answer_contract: {"kind":"written"}
            answer: 'Check that each image is a real number and that the map is one to one, onto, and keeps order, sums and products.'
            solution_sketch: 'Use Theorem 5.13 and Theorem 5.39. Let psi be the isomorphism from the copy of Q in F onto Q. Each image is a nonempty down set without largest element, so it is a real number. Density of Q in F gives order and injectivity. Completeness of F gives surjectivity by taking suprema. Sums and products follow from f = sup of the rationals below f.'
          # source: FoM exercise 5.5-5-35
          - problem: 'Let $\mathbb{F}$ be a complete ordered field. Let $\mathbb{Q}_{\mathbb{F}}$ be the set of elements of $\mathbb{F}$ that are quotients of integer multiples of the identity $1$ of $\mathbb{F}$. Let $\psi$ be the order preserving field isomorphism from $\mathbb{Q}_{\mathbb{F}}$ onto $\mathbb{Q}$. For $f\in\mathbb{F}$ let $\varphi(f)=\{\psi(q): q\in\mathbb{Q}_{\mathbb{F}}, q<f\}$. Prove these eight facts. (a) Between two elements of $\mathbb{F}$ lies an element of $\mathbb{Q}_{\mathbb{F}}$. (b) If $x<y$, then $\varphi(x)<\varphi(y)$. (c) $\varphi(\sup A)=\sup\varphi[A]$ for each set $A\subseteq\mathbb{F}$ bounded above. (d) $\varphi$ is injective. (e) $\varphi$ is surjective. (f) $\varphi(x+y)=\varphi(x)+\varphi(y)$. (g) $\varphi(-x)=-\varphi(x)$. (h) $\varphi(x\cdot y)=\varphi(x)\cdot\varphi(y)$.'
            answer_contract: {"kind":"written"}
            answer: 'Use density of the rational copy and completeness of F. Every z in F is the supremum of the rationals below z, which carries the proofs of sums and products.'
            solution_sketch: 'Use Theorem 5.48 and Theorem 5.39. Parts (a) and (b) follow from density, and part (c) follows from the supremum property. Parts (d) and (e) follow from (b) and completeness. Part (f) uses z = sup of the rationals below z. Part (g) follows from (f). Part (h) goes first for positive numbers and then extends with (g).'
          # source: FoM exercise 5.5-5-40
          - problem: 'Prove that the square root map is a bijection from the set of nonnegative real numbers onto itself. Also prove that the map $x\mapsto x^2$ is not a bijection from $\mathbb{R}$ onto $\mathbb{R}$, so no square root map is a bijection from $\mathbb{R}$ onto $\mathbb{R}$.'
            answer_contract: {"kind":"written"}
            answer: 'Theorem 5.44 gives one nonnegative root for each number. A negative number has no real square root.'
            solution_sketch: 'Use Theorem 5.44 and Definition 5.45. By Theorem 5.44, each a at least 0 has exactly one nonnegative root r with r^2 = a. So the root map is onto and one to one on the nonnegative numbers. A negative number has no real square root, because a real square is not negative. So $x\mapsto x^2$ is not onto $\mathbb{R}$, and no root map is a bijection from $\mathbb{R}$ onto $\mathbb{R}$.'
          # source: FoM exercise 5.5-5-41
          - problem: 'Prove that the cube root map is a bijection from $\mathbb{R}$ to $\mathbb{R}$.'
            answer_contract: {"kind":"written"}
            answer: 'Use Theorem 5.44 with n = 3 for a at least 0. For a below 0, take the opposite of the cube root of -a.'
            solution_sketch: 'Use Theorem 5.44. For a at least 0, Theorem 5.44 gives one nonnegative cube root. For a below 0, the number -r with r the cube root of -a satisfies (-r)^3 = a. A real cube is negative when the base is negative, so this is the only solution. So each real number has exactly one real cube root.'
        constraints: 'Compute roots and rational powers with the rules of Theorem 5.47; the items vary the bases and the exponents.'
    diagnostic_exemplar:
      problem: 'Let $D=\{q\in\mathbb{Q}: q<4\}$. Give the least integer that is not in $D$.'
      answer_contract: {"kind":"exact"}
      answer: '4'
      solution_sketch: 'The set D holds every rational below 4. The number 4 is not below 4. So 4 is the least integer outside D.'
