      - id: kp1
        name: 'Definition 5.49 and Theorem 5.50: intervals and the digit proof that (0,1) is not equivalent to the natural numbers'
        key_prerequisites: []
        exemplars:
          - problem: 'A set $I \subseteq \mathbb{R}$ is an interval when $c<x<d$ with $c,d \in I$ always gives $x \in I$. Give 1 if the set is an interval and 0 if it is not. (a) $[2,5)$ (b) $(0,1)\cup(2,3)$ (c) $\mathbb{R}\setminus\{0\}$ (d) $(-\infty,7]$'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 0; c = 0; d = 1'
            solution_sketch: 'Set (a) and set (d) have no gap, so each is an interval and gets 1. Set (b) misses $x=1.5$, which lies between $0.5$ and $2.5$. Set (c) misses $0$, which lies between $-1$ and $1$. So (b) and (c) get 0.'
          - problem: 'An interval is open when it holds none of its endpoints. Give 1 for an open interval and 0 for an interval that is not open. (a) $(2,9)$ (b) $[2,9]$ (c) $[2,9)$ (d) $(-\infty,4)$'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 0; c = 0; d = 1'
            solution_sketch: 'Interval (a) holds neither endpoint, so it gets 1. Interval (b) holds both endpoints and interval (c) holds the endpoint $2$, so both get 0. Interval (d) has the endpoint $4$ out of the set and no real left endpoint, so it gets 1.'
          - problem: 'Count how many endpoints of the interval belong to the interval. The symbols $\infty$ and $-\infty$ are not real numbers. (a) $[1,3]$ (b) $(1,3]$ (c) $[1,\infty)$ (d) $(-\infty,\infty)$'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}}]}
            answer: 'a = 2; b = 1; c = 1; d = 0'
            solution_sketch: 'In (a) both endpoints $1$ and $3$ belong to the set, so the count is 2. In (b) only $3$ belongs, so the count is 1. In (c) only $1$ belongs, because $\infty$ is not a real number, so the count is 1. In (d) no endpoint is a real number, so the count is 0.'
          - problem: 'Let $S$ be the set of digit sequences with at least one digit not $0$ and with infinitely many digits not $9$. Give 1 if the sequence is in $S$ and 0 if it is not. (a) $0,0,0,0,\dots$ (b) $0,0,1,0,0,0,\dots$ (c) $5,9,9,9,\dots$ (d) $1,9,1,9,1,9,\dots$'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}}]}
            answer: 'a = 0; b = 1; c = 0; d = 1'
            solution_sketch: 'Sequence (a) has no digit different from $0$, so it gets 0. Sequence (b) has the digit $1$ and infinitely many zeros, so it gets 1. Sequence (c) has only 9s from the second place on, so it gets 0. Sequence (d) has the digit $1$ infinitely often, so it gets 1.'
          - problem: 'For a digit sequence $x_1,x_2,\dots$ let $\varphi$ be the supremum of the sums $x_1\cdot 10^{-1}+\dots+x_k\cdot 10^{-k}$ over all $k$. Give $\varphi$ as a decimal number. (a) The sequence $7,0,0,0,\dots$ (b) The sequence $1,2,5,0,0,\dots$ (c) The sequence $0,0,4,0,0,\dots$'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"approx","decimals":3}},{"name":"b","contract":{"kind":"approx","decimals":3}},{"name":"c","contract":{"kind":"approx","decimals":3}}]}
            answer: 'a = 0.7; b = 0.125; c = 0.004'
            solution_sketch: 'All sums after the last nonzero digit stay the same, so the supremum is that sum. In (a) the value is $7/10$, which is 0.7. In (b) it is $1/10+2/100+5/1000$, which is 0.125. In (c) it is $4/1000$, which is 0.004.'
          - problem: 'Compute with the digit $9$. (a) Give $9\cdot10^{-2}+9\cdot10^{-3}$ as a decimal. (b) Give $10^{-1}$ minus the sum of the first part as a decimal. (c) Give $9\cdot10^{-2}+9\cdot10^{-3}+9\cdot10^{-4}$ as a decimal.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"approx","decimals":4}},{"name":"b","contract":{"kind":"approx","decimals":4}},{"name":"c","contract":{"kind":"approx","decimals":4}}]}
            answer: 'a = 0.099; b = 0.001; c = 0.0999'
            solution_sketch: 'The sum $0.09+0.009$ is 0.099. The gap to $0.1$ is 0.001. Adding $0.0009$ gives 0.0999. Each sum stays below $0.1$.'
          - problem: 'The list $\psi(1),\psi(2),\psi(3),\dots$ holds digit sequences. The first digits are $\psi(1)=3,1,4,1,5,\dots$ and $\psi(2)=2,7,1,8,2,\dots$ and $\psi(3)=1,6,1,8,0,\dots$ The diagonal digit $d_n$ is the $n$-th digit of $\psi(n)$. Build $y_n$ so that $y_n=1$ when $d_n \ne 1$ and $y_n=2$ when $d_n=1$. (a) Give $d_2$. (b) Give $d_3$. (c) Give $y_2$. (d) Give $y_3$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}}]}
            answer: 'a = 7; b = 1; c = 1; d = 2'
            solution_sketch: 'The second digit of $\psi(2)$ is 7, so $d_2=7$. The third digit of $\psi(3)$ is 1, so $d_3=1$. Since $7 \ne 1$, we get $y_2=1$. Since $d_3=1$, we get $y_3=2$. The new sequence differs from every $\psi(n)$ at place $n$.'
          # argument: Theorem 5.50
          - problem: 'Prove the first step: define $S$ as the set of digit sequences with at least one digit not $0$ and with infinitely many digits not $9$. Define $\varphi(x)$ as the supremum of the partial sums $\sum_{j=1}^{k} x_j 10^{-j}$. Prove that $\varphi$ is well defined and maps $S$ into $(0,1)$.'
            answer_contract: {"kind":"written"}
            answer: 'All partial sums are below 1, so the supremum exists. A nonzero digit gives a positive bound and a digit not 9 gives a bound below 1.'
            solution_sketch: 'Every partial sum is at most $\sum 9\cdot 10^{-j}<1$, so the set of partial sums is bounded and the supremum exists. Let $x_m \ne 0$. Then $\varphi(x) \ge 10^{-m}>0$. Let $x_m \ne 9$ for some large $m$. Then $\varphi(x) \le 1-10^{-m}<1$ by Exercise 5-42. So $\varphi(x) \in (0,1)$.'
          # argument: Theorem 5.50
          - problem: 'Prove the second step: the map $\varphi$ from the digit sequences of $S$ to $(0,1)$ is injective.'
            answer_contract: {"kind":"written"}
            answer: 'Take two different sequences and the first place where they differ. The sequence with the larger digit there gets the larger value.'
            solution_sketch: 'Let $x \ne y$ in $S$. Let $m$ be the first place with $x_m \ne y_m$, and let $x_m<y_m$. Because $x$ has a digit not 9 at some place $l>m$, the value of $x$ is at most the sum up to $m-1$ plus $x_m 10^{-m}$ plus $9\cdot 10^{-j}$ for the places after $m$ up to $l-1$, plus $(x_l+1)10^{-l}$. Use Exercise 5-42 to show that this bound is below the partial sum of $y$ up to $m$. So $\varphi(x)<\varphi(y)$.'
          # argument: Theorem 5.50
          - problem: 'Prove the last step: $(0,1)$ is not equivalent to $\mathbb{N}$. Use that $(0,1)$ holds a set equivalent to $S$.'
            answer_contract: {"kind":"written"}
            answer: 'A countable S has a list of all its sequences. Change the diagonal digits to digits from 1 to 8 to build a sequence of S that is not in the list.'
            solution_sketch: 'Suppose $(0,1)$ is countable. Then its subset $\varphi[S]$ is countable, so $S$ is countable and has a list $\psi(1),\psi(2),\dots$ of all its sequences. Let $y_n$ be a digit in $\{1,\dots,8\}$ different from the $n$-th digit of $\psi(n)$. The sequence $y$ is in $S$, because it has no 0 and no 9. It differs from every $\psi(n)$ at place $n$, which contradicts the list. This uses Theorem 5.50 and the map $\varphi$ of the first two steps.'
          # source: FoM exercise 5.6-5-42
          - problem: 'Prove: for all natural numbers $n$ and $m$, the sum $\sum_{j=n+1}^{m} 9\cdot 10^{-j}$ is less than $10^{-n}$.'
            answer_contract: {"kind":"written"}
            answer: 'Each term is 10 to the minus j+1 minus 10 to the minus j, so the sum telescopes to 10 to the minus n minus 10 to the minus m.'
            solution_sketch: 'Write $9\cdot 10^{-j}=10^{-(j-1)}-10^{-j}$. The sum then telescopes to $10^{-n}-10^{-m}$. Because $10^{-m}>0$, the sum is below $10^{-n}$. If $m \le n$, the sum is empty and equals $0$, which is below $10^{-n}$. This bound is the key estimate in Theorem 5.50.'
          # source: FoM exercise 5.6-5-43
          - problem: 'Prove: the map $\varphi$ from the digit sequences of $S$ to $(0,1)$, with $\varphi(x)$ the supremum of the sums $\sum_{j=1}^{k} x_j 10^{-j}$, is surjective. Here $S$ holds the sequences with a nonzero digit and infinitely many digits not $9$.'
            answer_contract: {"kind":"written"}
            answer: 'For a real number x in (0,1) take each digit as large as possible while the partial sum stays at most x. Then the partial sums have the supremum x.'
            solution_sketch: 'Use the map $\varphi$ of Theorem 5.50. Fix $x \in (0,1)$ and let $s_n$ be the partial sums. Let $x_n$ be the largest digit with $s_{n-1}+x_n 10^{-n} \le x$. Then $s_n \le x<s_n+10^{-n}$, so $\sup s_n=x$. If all digits after some place were 9, then $x \ge s_k$ for all $k$ gives $x \ge s_{n-1}+10^{-(n-1)}$, which contradicts $x<s_{n-1}+10^{-(n-1)}$. A nonzero digit exists, because $x>0$.'
          # source: FoM exercise 5.6-5-44
          - problem: 'Prove: let $[a_n,b_n]$ be nonempty closed intervals of $\mathbb{R}$ with $[a_{n+1},b_{n+1}] \subseteq [a_n,b_n]$ for every $n$. Then some real number lies in all of them.'
            answer_contract: {"kind":"written"}
            answer: 'Every b_k is an upper bound of the set of all a_n. The supremum A of the a_n lies between a_n and b_n for every n.'
            solution_sketch: 'For $n \le k$, we get $a_n \le a_k \le b_k$. For $n>k$, we get $a_n \le b_n \le b_k$. So each $b_k$ is an upper bound of $\{a_n\}$. Let $A=\sup a_n$, which exists. Then $a_n \le A \le b_n$ for all $n$, so $A$ lies in every interval.'
          # source: FoM exercise 5.6-5-45
          - problem: 'Prove both parts. (a) No real number lies in all of the intervals $(0,1/n)$ with $n \in$ $\mathbb{N}$. (b) No rational number lies in all of the intervals $[\sqrt2-1/n,\sqrt2+1/n]$ with $n \in$ $\mathbb{N}$.'
            answer_contract: {"kind":"written"}
            answer: 'In part a, each x above 0 misses an interval with large n. In part b, only the number square root of 2 is in all intervals, and it is irrational.'
            solution_sketch: '(a) If $x \le 0$, then $x \notin (0,1)$. If $x>0$, pick $n>1/x$. Then $x \notin (0,1/n)$. (b) If $x$ lies in all the intervals, then $|x-\sqrt2| \le 1/n$ for all $n$. This forces $x=\sqrt2$. The number $\sqrt2$ is irrational, so no rational number lies in all intervals.'
          # source: FoM exercise 5.6-5-51
          - problem: 'Prove: for every interval $I$ of $\mathbb{R}$, there are a subset $U$ and a subset $D$ of $\mathbb{R}$ such that $I=U\cap D$. Here $U$ is an up-set: if $u \in U$ and $u \le x$, then $x \in U$. The set $D$ is a down-set: if $d \in D$ and $x \le d$, then $x \in D$.'
            answer_contract: {"kind":"written"}
            answer: 'Take U as all numbers at or above some element of I, and D as all numbers at or below some element of I. Then U meets D exactly in I.'
            solution_sketch: 'Let $U=\{x : u \le x \text{ for some } u \in I\}$ and $D=\{x : x \le d \text{ for some } d \in I\}$. Both sets have the up-set or down-set property. Each $x \in I$ lies in both, with $u=d=x$. Now let $x \in U\cap D$, with $u \le x \le d$ and $u,d \in I$. If $x=u$ or $x=d$, then $x \in I$. Otherwise $u<x<d$, so $x \in I$ by Definition 5.49.'
        constraints: 'intervals, digit sequences and the diagonal construction'
      - id: kp2
        name: 'Definition 5.51 and Corollary 5.52: uncountable sets and the real numbers'
        key_prerequisites: [fom-4-6-countable-sets]
        exemplars:
          - problem: 'A set is uncountable when it is infinite and not countable. Give 1 if the set is uncountable and 0 if it is not. (a) $\mathbb{Z}$ (b) $(0,1)$ (c) $\mathbb{Q}$ (d) $\mathbb{R}$'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}}]}
            answer: 'a = 0; b = 1; c = 0; d = 1'
            solution_sketch: 'The sets $\mathbb{Z}$ and $\mathbb{Q}$ are countable, so (a) and (c) get 0. The interval $(0,1)$ is not countable by Theorem 5.50, so (b) gets 1. The set of real numbers holds that interval, so (d) gets 1.'
          - problem: 'Give 1 if the set is uncountable and 0 if it is not. (a) The set of all real numbers greater than $100$. (b) The set of integers between $-10^6$ and $10^6$. (c) The set $\mathbb{R}\times\{0\}$ of pairs $(x,0)$ with $x$ real.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 0; c = 1'
            solution_sketch: 'Set (a) is an interval, which is equivalent to $\mathbb{R}$, so it gets 1. Set (b) is finite, so it gets 0. Set (c) is equivalent to $\mathbb{R}$ by $x\mapsto(x,0)$, so it gets 1.'
          - problem: 'The map $x\mapsto 2x$ is a bijection from $(0,1)$ to $(0,2)$. Give each number as a decimal. (a) The image of $1/4$. (b) The number of $(0,1)$ that goes to $3/2$. (c) The image of $0.9$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"approx","decimals":2}},{"name":"b","contract":{"kind":"approx","decimals":2}},{"name":"c","contract":{"kind":"approx","decimals":2}}]}
            answer: 'a = 0.5; b = 0.75; c = 1.8'
            solution_sketch: 'Double $0.25$ to get 0.5. Halve $1.5$ to get 0.75. Double $0.9$ to get 1.8.'
          - problem: 'Let $x,y$ be real numbers in the closed interval $[a,b]$. The largest possible value of $|x-y|$ is $b-a$. Give that largest value. (a) $[2,7]$ (b) $[-3,4]$ (c) $[-6,-1]$'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 5; b = 7; c = 5'
            solution_sketch: 'The largest gap is the length of the interval. In (a) it is $7-2=5$. In (b) it is $4-(-3)=7$. In (c) it is $-1-(-6)=5$.'
          - problem: 'Count the real numbers $a$ that fit the conditions. (a) $a\ge0$ and $a<p$ for every real $p>0$. (b) $a>0$ and $a<p$ for every real $p>0$. (c) $a$ is an integer with $a\ge0$ and $a<p$ for every real $p>1/2$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 0; c = 1'
            solution_sketch: 'In (a) the number $0$ fits, and no positive number fits, because $p=a/2$ is smaller. So the count is 1. In (b) the same choice $p=a/2$ shows that no number fits, so the count is 0. In (c) only the integer $0$ fits, so the count is 1.'
          - problem: 'The nested intervals $[a_n,b_n]=[2-1/n,\,2+1/n]$ have the length $2/n$. This length shrinks to zero. (a) Give the one real number that lies in all of them. (b) Give the length of the fifth interval as a decimal. (c) Give the smallest $n$ with length less than $1/100$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"approx","decimals":2}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 2; b = 0.4; c = 201'
            solution_sketch: 'All intervals hold $2$ and no other number is in all of them, so (a) is 2. The fifth length is $2/5$, which is 0.4. The length $2/n$ is below $1/100$ when $n>200$, so the smallest $n$ is 201.'
          # argument: Corollary 5.52
          - problem: 'Prove: the set $\mathbb{R}$ is uncountable.'
            answer_contract: {"kind":"written"}
            answer: 'Suppose the reals are countable. Then the subset (0,1) is countable, which contradicts the uncountability of (0,1).'
            solution_sketch: 'Suppose $\mathbb{R}$ is countable. By Theorem 4.62, every subset of a countable set is countable, so $(0,1)$ is countable. This contradicts Theorem 5.50. Since $\mathbb{R}$ is infinite, it is uncountable.'
          # source: FoM exercise 5.6-5-46
          - problem: 'Prove: let $a\ge0$ be a real number with $a<p$ for every real $p>0$. Then $a=0$.'
            answer_contract: {"kind":"written"}
            answer: 'Suppose a is above 0. Then p equal to a over 2 is positive and below a, which contradicts the condition.'
            solution_sketch: 'Suppose $a \ne 0$. Then $a>0$. Take $p=a/2>0$. Then $p<a$, which contradicts $a<p$. So $a=0$.'
          # source: FoM exercise 5.6-5-47
          - problem: 'Prove: let $[a_{n+1},b_{n+1}]\subseteq[a_n,b_n]$ for every $n$, with $b_n-a_n<1/n$. Then the intersection of all $[a_n,b_n]$ holds exactly one real number.'
            answer_contract: {"kind":"written"}
            answer: 'The intersection is not empty by the nested interval result. Two points in it differ by less than 1 over n for every n, so they are equal.'
            solution_sketch: 'The intersection holds a point by Exercise 5-44. Let $x,y$ lie in it. For every $n$, both lie in $[a_n,b_n]$, so $|x-y|\le b_n-a_n<1/n$ by Exercise 5-48. Hence $|x-y|<p$ for every $p>0$. By Exercise 5-46, $|x-y|=0$, so $x=y$.'
          # source: FoM exercise 5.6-5-48
          - problem: 'Prove: for real numbers $a,b,x,y$ with $x,y\in[a,b]$, the gap $|x-y|$ is at most $b-a$.'
            answer_contract: {"kind":"written"}
            answer: 'Both x and y lie between a and b. Then x minus y is at most b minus a and at least a minus b.'
            solution_sketch: 'From $a\le x\le b$ and $a\le y\le b$ we get $x-y\le b-a$. Swap the roles of $x$ and $y$ to get $y-x\le b-a$. So $|x-y|\le b-a$.'
        constraints: 'uncountable sets, nested intervals and the uncountability of the reals'
      - id: kp3
        name: 'Definition 5.53 and Corollary 5.54: the irrational numbers are uncountable'
        key_prerequisites: [fom-4-6-countable-sets]
        exemplars:
          - problem: 'The set $\mathbb{R}\setminus\mathbb{Q}$ holds the irrational numbers. Give 1 if the number is irrational and 0 if it is not. (a) $\sqrt2$ (b) $\sqrt{16}$ (c) $5/8$ (d) $\sqrt3$'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 0; c = 0; d = 1'
            solution_sketch: 'The numbers $\sqrt2$ and $\sqrt3$ are irrational, so (a) and (d) get 1. The number $\sqrt{16}$ equals $4$ and $5/8$ is a fraction, so (b) and (c) get 0.'
          - problem: 'Give 1 if the set is uncountable and 0 if it is not. (a) $\mathbb{R}\setminus\mathbb{N}$ (b) $\mathbb{R}\setminus\mathbb{Q}$ (c) $(0,1)\setminus\mathbb{Q}$ (d) $\mathbb{Q}\setminus\mathbb{Z}$'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 1; c = 1; d = 0'
            solution_sketch: 'Remove a countable set from an uncountable set to get an uncountable set. So (a), (b) and (c) get 1. The set $\mathbb{Q}\setminus\mathbb{Z}$ is a subset of $\mathbb{Q}$, so it is countable and gets 0.'
          - problem: 'A subset $A$ of $\mathbb{N}$ gives the sequence with the term $1$ at place $n$ when $n\in A$, and the term $0$ when $n\notin A$. Write the first six terms of the sequence as a string of six digits. (a) $A=\{1,3,4\}$ (b) $A=\{1,2,5\}$ (c) $A=\{1,3,5\}$'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 101100; b = 110010; c = 101010'
            solution_sketch: 'Put 1 at each place of $A$ and 0 at the other places among the first six. For $\{1,3,4\}$ the string is 101100. For $\{1,2,5\}$ it is 110010. For $\{1,3,5\}$ it is 101010.'
          - problem: 'Count the sets and the sequences. (a) The number of subsets of $\{1,2,3\}$. (b) The number of subsets of $\{1,2,3,4,5\}$. (c) The number of sequences of length $4$ with every term $0$ or $1$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 8; b = 32; c = 16'
            solution_sketch: 'A set with $k$ elements has $2^k$ subsets. So (a) is $2^3=8$ and (b) is $2^5=32$. A length 4 sequence of 0 and 1 has $2^4=16$ choices.'
          - problem: 'Count the integers in the intersection of the two intervals. (a) $[1,6)$ and $(3,9]$ (b) $[0,3]$ and $[3,8]$ (c) $(0,2)$ and $[2,5)$ (d) $(-1,4)$ and $[0,10]$'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}}]}
            answer: 'a = 2; b = 1; c = 0; d = 4'
            solution_sketch: 'In (a) the intersection is $(3,6)$ with the integers $4$ and $5$, so the count is 2. In (b) it is $\{3\}$, so the count is 1. In (c) it is empty, so the count is 0. In (d) it is $[0,4)$ with the integers $0,1,2,3$, so the count is 4.'
          - problem: 'Let $I=[1,6]$ and $J=(3,9]$. The intersection of $I$ and $J$ is an interval. (a) Give its left endpoint. (b) Give its right endpoint. (c) Give 1 if the left endpoint belongs to it and 0 if not. (d) Give 1 if the right endpoint belongs to it and 0 if not.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}}]}
            answer: 'a = 3; b = 6; c = 0; d = 1'
            solution_sketch: 'The intersection is $(3,6]$. Its left endpoint is 3 and its right endpoint is 6. The point $3$ is not in $J$, so (c) is 0. The point $6$ is in both sets, so (d) is 1.'
          - problem: 'Let $I=(-\infty,4]$ and $J=[-2,\infty)$. The intersection of $I$ and $J$ is a closed interval. (a) Give its left endpoint. (b) Give its right endpoint. (c) Give its length.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = -2; b = 4; c = 6'
            solution_sketch: 'A point is in both sets when $x\le4$ and $x\ge-2$. The intersection is $[-2,4]$. The endpoints are -2 and 4. The length is $4-(-2)=6$.'
          # argument: Corollary 5.54
          - problem: 'Prove: the set of irrational numbers $\mathbb{R}\setminus\mathbb{Q}$ is uncountable.'
            answer_contract: {"kind":"written"}
            answer: 'Suppose the irrationals are countable. Then the reals are a union of two countable sets, so countable, which contradicts Corollary 5.52.'
            solution_sketch: 'Suppose $\mathbb{R}\setminus\mathbb{Q}$ is countable. Then $\mathbb{R}=\mathbb{Q}\cup(\mathbb{R}\setminus\mathbb{Q})$ is a union of two countable sets. By Theorem 4.65, $\mathbb{R}$ is countable. This contradicts Corollary 5.52.'
          # source: FoM exercise 5.6-5-49
          - problem: 'Prove: the family of all subsets of $\mathbb{N}$ has a bijection to the sequences whose terms are all $0$ or $1$.'
            answer_contract: {"kind":"written"}
            answer: 'Send a subset to its indicator sequence: 1 at the places in the subset, 0 elsewhere. This map has an inverse, so it is a bijection.'
            solution_sketch: 'For $A\subseteq$ $\mathbb{N}$ let $f(A)$ be the sequence with the term 1 at place $n$ if $n\in A$ and 0 otherwise. Two different sets differ at some $n$, so $f$ is injective. For a sequence $x$ with terms 0 or 1, the set $\{n : x_n=1\}$ goes to $x$, so $f$ is surjective.'
          # source: FoM exercise 5.6-5-50
          - problem: 'Prove: for intervals $I$ and $J$ of $\mathbb{R}$, the set $I\cap J$ is an interval.'
            answer_contract: {"kind":"written"}
            answer: 'Take two points of the intersection and a number between them. The number lies in both I and J by Definition 5.49, so it lies in the intersection.'
            solution_sketch: 'Let $c,d\in I\cap J$ and $c<x<d$. Then $c,d\in I$, so $x\in I$ by Definition 5.49. In the same way $x\in J$. So $x\in I\cap J$, and $I\cap J$ is an interval.'
        constraints: 'irrational numbers, subsets of the natural numbers and intersections of intervals'
