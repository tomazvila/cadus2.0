      - id: kp1
        name: 'Definition 5.29 to Definition 5.32: down sets, real numbers as cuts, and the sum of two cuts'
        key_prerequisites: [fom-5-4-problem-rational-numbers, minimal-maximal-elements]
        exemplars:
          - problem: 'A subset $D$ of $\mathbb{Q}$ is a down set when $y\in D$ and $x\le y$ always give $x\in D$. For each set, give 1 if it is a down set and 0 if it is not. (a) $\{q\in\mathbb{Q}: q<5\}$. (b) $\{q\in\mathbb{Q}: q>5\}$. (c) $\{q\in\mathbb{Q}: q\le 2 \text{ or } q=4\}$. (d) $\mathbb{Q}$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 0; c = 0; d = 1'
            solution_sketch: 'Set (a) holds every rational below 5, so every smaller number is also in it, and it gets 1. In (b) the number 6 is in the set and 4 is smaller, but 4 is not in the set, so (b) gets 0. In (c) the number 4 is in the set and 3 is smaller, but 3 is not in the set, so (c) gets 0. The set $\mathbb{Q}$ in (d) holds every smaller number, so it gets 1.'
          - problem: 'A real number is a nonempty down set in $\mathbb{Q}$ that has no largest element and is not equal to $\mathbb{Q}$. For each set, give 1 if it is a real number and 0 if it is not. (a) $\{q\in\mathbb{Q}: q<2\}$. (b) $\{q\in\mathbb{Q}: q\le 2\}$. (c) The empty set. (d) $\mathbb{Q}$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 0; c = 0; d = 0'
            solution_sketch: 'Set (a) is a nonempty down set, it has no largest element and it misses 2, so it gets 1. Set (b) has the largest element 2, so it gets 0. The empty set is not nonempty, so (c) gets 0. The set $\mathbb{Q}$ is equal to $\mathbb{Q}$, so (d) gets 0.'
          - problem: 'Let $D=\{q\in\mathbb{Q}: q<2\}$ and $E=\{q\in\mathbb{Q}: q<3\}$. The sum $D+E$ is the set of all sums $d+e$ with $d\in D$ and $e\in E$. (a) Give 1 if $\frac{49}{10}$ is in $D+E$ and 0 if not. (b) Give 1 if $5$ is in $D+E$ and 0 if not. (c) Give the least integer that is not in $D+E$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 0; c = 5'
            solution_sketch: 'The sum set is $\{q: q<5\}$. The number $4.9$ is below 5, so (a) is 1. The number 5 is not below 5, so (b) is 0. The integers below 5 are in the sum set, so the least integer outside it is 5.'
          - problem: 'Let $D=\{q\in\mathbb{Q}: q<1\}$ and $E=\{q\in\mathbb{Q}: q<-4\}$. (a) Give the rational number $r$ with $D+E=\{q\in\mathbb{Q}: q<r\}$. (b) Give 1 if $-3$ is in $D+E$ and 0 if not. (c) Give 1 if $-\frac72$ is in $D+E$ and 0 if not.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = -3; b = 0; c = 1'
            solution_sketch: 'Every sum $d+e$ is below $1+(-4)=-3$, and every rational below $-3$ is such a sum. So $r=-3$ in (a). The number $-3$ is not below $-3$, so (b) is 0. The number $-3.5$ is below $-3$, so (c) is 1.'
          - problem: 'Let $D=\{q\in\mathbb{Q}: q<\frac12\}$ and $E=\{q\in\mathbb{Q}: q<\frac13\}$. (a) Give the rational number $r$ with $D+E=\{q\in\mathbb{Q}: q<r\}$. (b) Give 1 if $\frac45$ is in $D+E$ and 0 if not. (c) Give 1 if $r$ is in $D+E$ and 0 if not.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 5/6; b = 1; c = 0'
            solution_sketch: 'Add the two upper limits: $\frac12+\frac13=\frac56$, so $r=\frac56$ in (a). The number $\frac45=0.8$ is below $\frac56\approx 0.83$, so (b) is 1. The limit $r$ itself is not below $r$, so (c) is 0.'
          - problem: 'Let $D=\{q\in\mathbb{Q}: q<0 \text{ or } q^2<2\}$. (a) Give 1 if $1$ is in $D$ and 0 if not. (b) Give 1 if $\frac32$ is in $D$ and 0 if not. (c) Give 1 if $\frac75$ is in $D$ and 0 if not. (d) Give 1 if $D$ has a largest element and 0 if not.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 0; c = 1; d = 0'
            solution_sketch: 'For (a), $1^2=1<2$, so the value is 1. For (b), $(\frac32)^2=\frac94>2$, so the value is 0. For (c), $(\frac75)^2=\frac{49}{25}=1.96<2$, so the value is 1. No rational number has the square 2, and for each rational $q>0$ with $q^2<2$ a larger rational with that property is available, so (d) is 0.'
          - problem: 'Let $D=\{q\in\mathbb{Q}: q<\frac72\}$ and $E=\{q\in\mathbb{Q}: q<\frac12\}$. (a) Count the integers $n\ge 0$ that are in $D+E$. (b) Give the largest integer in $D+E$. (c) Give 1 if $D+E$ has a largest element and 0 if not.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 4; b = 3; c = 0'
            solution_sketch: 'The sum set is $\{q: q<4\}$. The integers $0,1,2,3$ are in it, so (a) is 4. The largest of them is 3, so (b) is 3. The sum set has no largest element, because for each member a larger member exists, so (c) is 0.'
          # argument: Lemma 5.31
          - problem: 'Prove: for real numbers $D$ and $E$, the sum set $D+E=\{d+e: d\in D, e\in E\}$ is again a real number.'
            answer_contract: {"kind":"written"}
            answer: 'Show that the sum set is a down set. Then show it has no largest element, because a larger sum d''+e'' always exists.'
            solution_sketch: 'Use Definition 5.29 and Definition 5.30. Let x = d+e be in the sum set and let y be at most x. Then e+y-x lies in E, because E is a down set, and y = d+(e+y-x) is in the sum set. Next assume t = d+e is the largest element. Pick d'' above d in D and e'' above e in E. The sum d''+e'' exceeds t, which is a contradiction.'
        constraints: 'Decide whether a set of rationals is a down set or a cut and find the sum of two cuts; the items vary the cuts.'
      - id: kp2
        name: 'Proposition 5.33 to Theorem 5.36: zero, opposites, products of cuts and the field laws'
        key_prerequisites: [fom-5-2-fields]
        exemplars:
          - problem: 'Let $0=\{q\in\mathbb{Q}: q<0\}$ and $D=\{q\in\mathbb{Q}: q<3\}$. (a) Give the rational number $r$ with $D+0=\{q\in\mathbb{Q}: q<r\}$. (b) Give 1 if $\frac52$ is in $D+0$ and 0 if not. (c) Give 1 if $3$ is in $D+0$ and 0 if not.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 3; b = 1; c = 0'
            solution_sketch: 'The upper limits add as $3+0=3$, so $D+0=D$ and $r=3$ in (a). The number $2.5$ is below 3, so (b) is 1. The number 3 is not below 3, so (c) is 0.'
          - problem: 'Let $D=\{q\in\mathbb{Q}: q<3\}$. Let $E$ be the set of all rationals $q$ such that $-q$ is an upper bound of $D$ and $-q$ is not the supremum of $D$. (a) Give the rational number $r$ with $E=\{q\in\mathbb{Q}: q<r\}$. (b) Give 1 if $-3$ is in $E$ and 0 if not. (c) Give 1 if $-4$ is in $E$ and 0 if not. (d) Give the rational number $s$ with $D+E=\{q\in\mathbb{Q}: q<s\}$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}}]}
            answer: 'a = -3; b = 0; c = 1; d = 0'
            solution_sketch: 'A number $-q$ is an upper bound of $D$ other than the supremum exactly when $-q>3$, that is, when $q<-3$. So $r=-3$ in (a). The number $-3$ is not below $-3$, so (b) is 0. The number $-4$ is below $-3$, so (c) is 1. The upper limits add as $3+(-3)=0$, so $s=0$ in (d).'
          - problem: 'Let $D=\{q\in\mathbb{Q}: q<\frac52\}$. Let $E$ be the set of all rationals $q$ such that $-q$ is an upper bound of $D$ and $-q$ is not the supremum of $D$. (a) Give the rational number $r$ with $E=\{q\in\mathbb{Q}: q<r\}$. (b) Give 1 if $-3$ is in $E$ and 0 if not. (c) Give 1 if $-\frac52$ is in $E$ and 0 if not.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = -5/2; b = 1; c = 0'
            solution_sketch: 'The number $-q$ must be larger than $\frac52$, so $q<-\frac52$ and $r=-\frac52$ in (a). The number $-3$ is below $-2.5$, so (b) is 1. The number $-\frac52$ is not below itself, so (c) is 0.'
          - problem: 'Let $D=\{q\in\mathbb{Q}: q<2\}$ and $E=\{q\in\mathbb{Q}: q<3\}$. Both sets hold $0$. The product $D\cdot E$ is the set of all rationals $q$ with $q\le de$ for some $d\in D$ with $d>0$ and some $e\in E$ with $e>0$. (a) Give the rational number $r$ with $D\cdot E=\{q\in\mathbb{Q}: q<r\}$. (b) Give 1 if $\frac{11}{2}$ is in $D\cdot E$ and 0 if not. (c) Give 1 if $6$ is in $D\cdot E$ and 0 if not.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 6; b = 1; c = 0'
            solution_sketch: 'Each product $de$ with $d<2$ and $e<3$ is below 6, and products come as close to 6 as we like. So $r=6$ in (a). For (b), take $d=1.9$ and $e=2.9$: then $de=5.51\ge 5.5$, so the value is 1. The number 6 is not below 6, so (c) is 0.'
          - problem: 'Let $D=\{q\in\mathbb{Q}: q<2\}$ and $E=\{q\in\mathbb{Q}: q<-3\}$. The set $D$ holds $0$ and the set $E$ does not. The product is $D\cdot E=-(D\cdot(-E))$. (a) Give the rational number $r$ with $D\cdot E=\{q\in\mathbb{Q}: q<r\}$. (b) Give 1 if $-6$ is in $D\cdot E$ and 0 if not. (c) Give 1 if $-7$ is in $D\cdot E$ and 0 if not.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = -6; b = 0; c = 1'
            solution_sketch: 'The set $-E$ is $\{q: q<3\}$. The product $D\cdot(-E)$ is $\{q: q<6\}$, so its opposite is $\{q: q<-6\}$ and $r=-6$ in (a). The number $-6$ is not below $-6$, so (b) is 0. The number $-7$ is below $-6$, so (c) is 1.'
          - problem: 'Let $D=\{q\in\mathbb{Q}: q<-2\}$ and $E=\{q\in\mathbb{Q}: q<-5\}$. Neither set holds $0$, so $D\cdot E=(-D)\cdot(-E)$. (a) Give the rational number $r$ with $D\cdot E=\{q\in\mathbb{Q}: q<r\}$. (b) Give 1 if $9$ is in $D\cdot E$ and 0 if not. (c) Give 1 if $10$ is in $D\cdot E$ and 0 if not.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 10; b = 1; c = 0'
            solution_sketch: 'The sets $-D$ and $-E$ are $\{q: q<2\}$ and $\{q: q<5\}$. Their product is $\{q: q<10\}$, so $r=10$ in (a). The number 9 is below 10, so (b) is 1. The number 10 is not below 10, so (c) is 0.'
          - problem: 'Let $D=\{q\in\mathbb{Q}: q<4\}$. Let $D^{-1}$ be the set of all rationals that are lower bounds of $\{\frac1d: d\in D, d>0\}$ and are not equal to the infimum of that set. (a) Give the rational number $r$ with $D^{-1}=\{q\in\mathbb{Q}: q<r\}$. (b) Give 1 if $\frac14$ is in $D^{-1}$ and 0 if not. (c) Give 1 if $\frac15$ is in $D^{-1}$ and 0 if not. (d) Give the rational number $s$ with $D\cdot D^{-1}=\{q\in\mathbb{Q}: q<s\}$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}}]}
            answer: 'a = 1/4; b = 0; c = 1; d = 1'
            solution_sketch: 'The numbers $\frac1d$ with $0<d<4$ have the infimum $\frac14$. A lower bound other than the infimum is below $\frac14$, so $r=\frac14$ in (a). The number $\frac14$ is not below itself, so (b) is 0. The number $\frac15$ is below $\frac14$, so (c) is 1. The upper limits multiply as $4\cdot\frac14=1$, so $s=1$ in (d).'
          # argument: Proposition 5.33
          - problem: 'Prove: addition of real numbers is associative and commutative, the real number $\{q: q<0\}$ is neutral for addition, and every real number $D$ has an additive inverse.'
            answer_contract: {"kind":"written"}
            answer: 'Rewrite each sum set with its elements and use the rules of the rational numbers. For the inverse, take rationals whose opposite is a strict upper bound of D.'
            solution_sketch: 'Use Definition 5.32 and Lemma 5.31. For associativity, both sides equal the set of all sums d+e+f. For commutativity, swap the two summands in each sum. For the neutral element, an element d+q with q below 0 lies below d, so it lies in D. For the other direction, write d as (d+x)+(-x) with x above 0. The inverse is the set of rationals q such that -q is an upper bound of D and -q is not the supremum.'
          # argument: Lemma 5.34
          - problem: 'Prove: let $D$ and $E$ be real numbers that both contain $0$. Then the set of all rationals $q$ with $q\le de$ for some positive $d\in D$ and some positive $e\in E$ has no largest element.'
            answer_contract: {"kind":"written"}
            answer: 'Take a member q with q at most de. Larger d'' in D and e'' in E give a larger member d''e''.'
            solution_sketch: 'Use Definition 5.35 and Definition 5.30. A real number has no largest element, so d has a larger element d'' in D. In the same way e has a larger element e'' in E. Both are positive, so d''e'' exceeds de. The number d''e'' is a member of the set, and it exceeds q.'
          # argument: Theorem 5.36
          - problem: 'Prove the first step: multiplication of real numbers is associative and commutative.'
            answer_contract: {"kind":"written"}
            answer: 'Treat the case where all numbers contain 0 with sets of products. Reduce the other sign cases to that case with opposites.'
            solution_sketch: 'Use Definition 5.35 and Proposition 5.33. If D, E and F contain 0, both bracketings give the set of all q with q at most def, for positive d, e and f. For the other sign cases, rewrite a product with a negative factor as the opposite of a product with a positive factor. Then apply the first case. Commutativity follows from de = ed for rationals.'
          # argument: Theorem 5.36
          - problem: 'Prove the second step: the real number $\{q: q<1\}$ is neutral for multiplication, every nonzero real number has a multiplicative inverse, and multiplication distributes over addition.'
            answer_contract: {"kind":"written"}
            answer: 'For the neutral element, scale d by numbers e below 1 and compare with D. The inverse and the distributive law follow the same pattern with sets of products.'
            solution_sketch: 'Use Definition 5.35 and Proposition 5.33. For D containing 0, the products de with e below 1 stay below d, and each q below d is reached with e close to 1. For D missing 0, use the opposite of D. The inverse is built from the lower bounds of the reciprocals of the positive elements of D. For the distributive law, compare the sets of products as in the associative case.'
          # source: FoM exercise 5.5-5-27
          - problem: 'Prove two facts about the sum on $\mathbb{R}$. (a) Addition of real numbers is commutative. (b) For a real number $D$, let $E$ be the set of rationals $q$ such that $-q$ is an upper bound of $D$ and $-q$ is not the supremum of $D$. Then $D+E$ is the zero real number.'
            answer_contract: {"kind":"written"}
            answer: 'For (a), swap the summands in every sum of rationals. For (b), show that the sums d+e are exactly the rationals below 0.'
            solution_sketch: 'Use Proposition 5.33 and Definition 5.32. Part (a): d+e = e+d for rationals, so the two sum sets are equal. Part (b): each sum d+e is below 0, because -e is a strict upper bound of D. For the other direction, take a rational p below 0 and find d in D with d-p above the supremum gap. Then p = d+e with e = p-d in E.'
          # source: FoM exercise 5.5-5-28
          - problem: 'Prove that the product set of two real numbers $D$ and $E$ that contain $0$ has no largest element. The product set is the set of all rationals $q$ with $q\le de$ for positive $d\in D$ and positive $e\in E$.'
            answer_contract: {"kind":"written"}
            answer: 'A member q has q at most de. Larger elements d'' and e'' give d''e'' above de, so q is not largest.'
            solution_sketch: 'Use Lemma 5.34 and Definition 5.35. Suppose q is a largest member and q is at most de. The sets D and E have no largest elements, so pick d'' above d in D and e'' above e in E. Then d''e'' is a member and d''e'' exceeds de. This contradicts the choice of q.'
          # source: FoM exercise 5.5-5-29
          - problem: 'Finish the proof that $\mathbb{R}$ is a field. (a) Prove that multiplication is associative in the sign cases not yet done. (b) Prove that multiplication is commutative. (c) Let $D\ne 0$ contain $0$. Let $D^{-1}$ be the set of rationals that are lower bounds of $\{\frac1d: d\in D, d>0\}$ and differ from its infimum. Prove $D\cdot D^{-1}=1$. (d) Prove that multiplication distributes over addition.'
            answer_contract: {"kind":"written"}
            answer: 'Reduce each sign case to the case where all sets contain 0. Then compare the sets of products element by element.'
            solution_sketch: 'Use Theorem 5.36 and Definition 5.35. For (a) and (d), rewrite negative factors as opposites and reduce to positive cases. For (b), use de = ed. For (c), each product d times a reciprocal 1/d'' with d, d'' in D is below 1. Conversely each q below 1 is such a product for suitable d and d''. The reduction to positive cases needs the rule X times (-Y) = -(X times Y).'
        constraints: 'Find the neutral element, the opposite, the product and the inverse of a cut by its upper limit; the items vary the limits and the sign cases.'
      - id: kp3
        name: 'Proposition 5.37 and Theorem 5.38: the positive cone and the order by inclusion'
        key_prerequisites: [fom-5-3-ordered-fields]
        exemplars:
          - problem: 'Let $P$ be the set of all real numbers that contain $0$. Let $D=\{q\in\mathbb{Q}: q<2\}$. (a) Give 1 if $D\in P$ and 0 if not. (b) Give 1 if $-D\in P$ and 0 if not. (c) Give 1 if $D$ is the zero real number and 0 if not.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 0; c = 0'
            solution_sketch: 'The set $D$ holds 0, so (a) is 1. The opposite $-D$ is $\{q: q<-2\}$, which does not hold 0, so (b) is 0. The zero real number is $\{q: q<0\}$, which differs from $D$, so (c) is 0.'
          - problem: 'Let $P$ be the set of all real numbers that contain $0$. Let $D=\{q\in\mathbb{Q}: q<-1\}$ and $E=\{q\in\mathbb{Q}: q<4\}$. (a) Give 1 if $D\in P$ and 0 if not. (b) Give 1 if $E\in P$ and 0 if not. (c) Give 1 if $-D\in P$ and 0 if not. (d) Give 1 if $D+E\in P$ and 0 if not.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}}]}
            answer: 'a = 0; b = 1; c = 1; d = 1'
