          - problem: 'Work in $\mathbb{Z}_5^3$ with all components taken mod 5. Let $x=(3,4,2)$ and $y=(4,3,1)$. Give each answer as an integer from 0 to 4. (a) Give the first component of $x+y$. (b) Give the second component of $x+y$. (c) Give the third component of $3x$. (d) Give the first component of $4y$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}}]}
            answer: 'a = 2; b = 2; c = 1; d = 1'
            solution_sketch: 'Compute each component, then reduce mod 5. For (a) we have 3+4=7, which is 2. For (b) we have 4+3=7, which is 2. For (c) we have 3*2=6, which is 1. For (d) we have 4*4=16, which is 1.'
          - problem: 'Let $f(x)=x^2$ and $g(x)=2x+1$ be functions from $\mathbb{R}$ to $\mathbb{R}$. Add and scale them pointwise. (a) Give $(f+g)(3)$. (b) Give $(2f)(-2)$. (c) Give $(3g)(0)$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 16; b = 8; c = 3'
            solution_sketch: 'Pointwise operations act on the value at each input. We have $(f+g)(3)=9+7=16$. We have $(2f)(-2)=2*4=8$. We have $(3g)(0)=3*1=3$.'
          - problem: 'Use the vector space $\mathbb{R}^2$. Give 1 for a linearly independent set and 0 for a set that is not. A linearly independent set holds only nonzero vectors. (a) $\{(1,0),(2,0)\}$ (b) $\{(1,0),(0,1)\}$ (c) $\{(1,2)\}$ (d) $\{(0,0),(1,1)\}$'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}}]}
            answer: 'a = 0; b = 1; c = 1; d = 0'
            solution_sketch: 'In (a) we have $2(1,0)-(2,0)=0$ with a nonzero scalar, so the value is 0. Set (b) has only the zero combination, so the value is 1. A single nonzero vector is independent, so (c) is 1. Set (d) holds the zero vector, so (d) is 0.'
          - problem: 'In $\mathbb{R}^2$ let $x=(1,2)$ and $y=(3,6)$. (a) Give the scalar $\beta$ with $3x+\beta y=0$. (b) Give the scalar $\alpha$ with $\alpha(1,-2)+(-3,6)=0$. (c) Give the size of a largest linearly independent subset of $\{(1,2),(3,6),(0,1)\}$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = -1; b = 3; c = 2'
            solution_sketch: 'For (a) we have $3x=(3,6)=y$, so $\beta=-1$. For (b) the first component gives $\alpha-3=0$, so $\alpha=3$. For (c) the first two vectors depend on each other. The set $\{(1,2),(0,1)\}$ is independent, so the size is 2.'
          - problem: 'Count the vectors. (a) Give the number of vectors in $\mathbb{F}_2^2$. (b) Give the number of vectors in $\mathbb{F}_3^2$. (c) Give the number of nonzero vectors in $\mathbb{F}_2^3$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 4; b = 9; c = 7'
            solution_sketch: 'A vector in $\mathbb{F}_q^d$ has $d$ components with $q$ choices each. So we have $2^2=4$ and $3^2=9$. The space $\mathbb{F}_2^3$ has $2^3=8$ vectors, and 7 of them are nonzero.'
          - problem: 'Let $\mathbb{R}^2$ have the usual vector addition and the scalar multiplication $\alpha\cdot(x,y)=(\alpha x,0)$. Give 1 if the equation holds and 0 if it fails. (a) $1\cdot(2,3)=(2,3)$ (b) $2\cdot((1,1)+(2,5))=2\cdot(1,1)+2\cdot(2,5)$ (c) $(1+2)\cdot(1,1)=1\cdot(1,1)+2\cdot(1,1)$'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 0; b = 1; c = 1'
            solution_sketch: 'In (a) the left side is $(2,0)$, which differs from $(2,3)$, so the value is 0. In (b) both sides equal $(6,0)$. In (c) both sides equal $(3,0)$. So (b) and (c) have the value 1.'
          # source: FoM exercise 5.9-5-70
          - problem: 'Prove the following two statements. (a) Let $B$ and $F$ be linearly independent sets of a vector space $X$ with $F$ finite. If every vector of $X$ is a combination of vectors of $B\cup F$, then some subset $H$ of $F$ makes $B\cup H$ a base of $X$. (b) Let $B$ be a linearly independent set and let $b$ be in $B$. Then the span of $B$ differs from the span of $B$ without $b$.'
            answer_contract: {"kind":"written"}
            answer: 'Induct on the size of F and add f when f is outside span(B). For (b), b in the smaller span gives a nontrivial zero combination.'
            solution_sketch: 'For (a) induct on the size of $F$. Take $f$ in $F$. If $f$ is in span(B), drop it and use the induction step for the smaller set. If $f$ is outside span(B), then $B$ with $f$ is independent, so apply the induction step to it. For (b) assume $b$ lies in span of $B$ without $b$. Then $b$ is a combination of the other vectors, which gives a nontrivial zero combination and breaks Definition 5.72.'
        constraints: 'Compute with vectors and functions; decide independence of small sets.'
      - id: kp2
        name: 'Theorem 5.75: all bases have the same size (Definition 5.73, Example 5.74, Definition 5.76, Example 5.77)'
        key_prerequisites: [basis-dimension-general-field, subspaces-span]
        exemplars:
          - problem: 'In $\mathbb{R}^4$ let $e_i$ be the vector with 1 in place $i$ and 0 elsewhere. (a) Give the coefficient of $e_3$ in $(5,-2,7,1)$. (b) Give the number of vectors in the set $\{e_1,e_2,e_3,e_4\}$. (c) Give the coefficient of $e_2$ in $3(1,2,0,0)-(0,1,0,0)$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 7; b = 4; c = 5'
            solution_sketch: 'A vector $x$ equals the sum of $x_ie_i$, so the coefficient of $e_i$ is $x_i$. The third component of $(5,-2,7,1)$ is 7. The set has 4 vectors. The vector $3(1,2,0,0)-(0,1,0,0)$ is $(3,5,0,0)$, so the coefficient of $e_2$ is 5.'
          - problem: 'Give the dimension of each vector space. (a) $\mathbb{R}^5$ over $\mathbb{R}$ (b) the polynomials of degree at most 3 over $\mathbb{R}$ (c) $\mathbb{F}_2^3$ over $\mathbb{F}_2$ (d) $\mathbb{C}$ over $\mathbb{R}$'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}}]}
            answer: 'a = 5; b = 4; c = 3; d = 2'
            solution_sketch: 'The dimension is the size of any base. The standard base of $\mathbb{R}^5$ has 5 vectors. The set $\{1,x,x^2,x^3\}$ has 4 vectors and is a base for (b). The standard base of $\mathbb{F}_2^3$ has 3 vectors. The set $\{1,i\}$ is a base of $\mathbb{C}$ over $\mathbb{R}$.'
          - problem: 'Use the vector space $\mathbb{R}^2$. Give 1 if the set is a base and 0 if it is not. (a) $\{(1,0),(0,1)\}$ (b) $\{(1,1),(1,-1)\}$ (c) $\{(1,2),(2,4)\}$ (d) $\{(1,0),(0,1),(1,1)\}$'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 1; c = 0; d = 0'
            solution_sketch: 'A base is independent and reaches every vector. Sets (a) and (b) are independent and reach every vector, so they get 1. In (c) we have $2(1,2)=(2,4)$, so the set is dependent. In (d) we have $(1,1)=(1,0)+(0,1)$, so the set is dependent.'
          - problem: 'A vector space $X$ has a base with 6 vectors. (a) Give the largest size of a linearly independent subset of $X$. (b) Give the size of another base of $X$. (c) Give 1 if some linearly independent subset of $X$ has 7 vectors and 0 if no such subset exists.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 6; b = 6; c = 0'
            solution_sketch: 'By Theorem 5.75 a linearly independent subset has at most 6 vectors. The same theorem gives 6 vectors for every base. So a set with 7 vectors is dependent and (c) is 0.'
          - problem: 'In $\mathbb{R}^2$ the set $\{(1,1),(1,-1)\}$ is a base. Write each vector as $\alpha(1,1)+\beta(1,-1)$. (a) Give $\alpha$ for $(5,1)$. (b) Give $\beta$ for $(5,1)$. (c) Give $\alpha$ for $(4,6)$. (d) Give $\beta$ for $(4,6)$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}}]}
            answer: 'a = 3; b = 2; c = 5; d = -1'
            solution_sketch: 'We solve $\alpha+\beta$ and $\alpha-\beta$ for the components. For $(5,1)$ we have $\alpha+\beta=5$ and $\alpha-\beta=1$, so $\alpha=3$ and $\beta=2$. For $(4,6)$ we have $\alpha+\beta=4$ and $\alpha-\beta=6$, so $\alpha=5$ and $\beta=-1$.'
          - problem: 'Multiply functions from $\mathbb{R}$ to $\mathbb{R}$ pointwise. Let $f(x)=x+1$ and $g(x)=x-1$. (a) Give $(fg)(3)$. (b) Give $(fg)(0)$. (c) Give $(2(fg))(2)$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 8; b = -1; c = 6'
            solution_sketch: 'Pointwise multiplication gives $(fg)(x)=f(x)g(x)$. We have $(fg)(3)=4*2=8$. We have $(fg)(0)=1*(-1)=-1$. We have $(fg)(2)=3*1=3$, and the factor 2 gives 6.'
          - problem: 'Multiply in the quaternions with $i^2=j^2=-1$, $ij=k=-ji$ and $jk=i$. Expand brackets in the usual way. (a) Give the coefficient of $k$ in $ji$. (b) Give the real part of $(1+i)(1-i)$. (c) Give the coefficient of $i$ in $jk$. (d) Give the coefficient of $k$ in $(i+j)(i-j)$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}}]}
            answer: 'a = -1; b = 2; c = 1; d = -2'
            solution_sketch: 'We have $ji=-k$, so (a) is -1. We have $(1+i)(1-i)=1-i^2=2$, so (b) is 2. We have $jk=i$, so (c) is 1. We have $(i+j)(i-j)=i^2-ij+ji-j^2=-2k$, so (d) is -2.'
          # argument: Theorem 5.75
          - problem: 'Prove the first step: Suppose the space $X$ has a base $F$ with finitely many vectors. Then every linearly independent subset $L$ of $X$ has at most as many elements as $F$.'
            answer_contract: {"kind":"written"}
            answer: 'Assume L is larger than F with |L and F| maximal. Swap in a vector of F for one of L to get a larger overlap, a contradiction.'
            solution_sketch: 'Assume a linearly independent set $L$ has more elements than $F$. Pick such an $L$ with $|L \cap F|$ as large as possible. Take $b$ in $L$ outside $F$. By Exercise 5-70 some $H \subseteq F$ makes $(L \setminus \{b\}) \cup H$ a base. Then $H$ is not empty, and the overlap with $F$ grows, which contradicts the choice of $L$.'
          # argument: Theorem 5.75
          - problem: 'Prove the second step: Suppose the space $X$ has a base $F$ with finitely many vectors. Then every base of $X$ has exactly as many elements as $F$.'
            answer_contract: {"kind":"written"}
            answer: 'Step one bounds a base B by F. Then B is finite, F is independent, and step one gives F at most B, so they are equal in size.'
            solution_sketch: 'Let $B$ be a base of $X$. By the first step $B$ has at most as many elements as $F$, so $B$ is finite. Apply the first step again with $B$ as the finite base. The set $F$ is linearly independent, so $F$ has at most as many elements as $B$. Hence $|F|=|B|$.'
          # source: FoM exercise 5.9-5-71
          - problem: 'Prove: Let $B$ be a base of a vector space $X$. Each vector of $X$ has one combination of vectors of $B$, up to terms with coefficient 0.'
            answer_contract: {"kind":"written"}
            answer: 'Subtract two combinations of the same vector. Independence of B forces every coefficient of the difference to be 0.'
            solution_sketch: 'Write $x$ as two combinations of vectors of $B$. Join both lists of vectors and give the missing ones coefficient 0. Subtract the two sums to get a combination equal to 0. By Definition 5.73 the set $B$ is linearly independent, so each coefficient of the difference is 0. Hence the two combinations agree, up to terms with coefficient 0.'
          # source: FoM exercise 5.9-5-72
          - problem: 'Prove all parts: In the quaternions, the set of sums $a+bi+cj+dk$ with real $a,b,c,d$ has these properties. It is an algebra over $\mathbb{R}$ of dimension 4. It has a unit and each nonzero element has an inverse. It is not a field. Its norm is the root of $a^2+b^2+c^2+d^2$, and the norm of a product is the product of the norms.'
            answer_contract: {"kind":"written"}
            answer: 'Check the algebra rules on the base. Build inverses from the reflected element, and show that ij differs from ji and the norm is multiplicative.'
            solution_sketch: 'Check the rules of Definition 5.76 on the base $1,i,j,k$. The element 1 is the unit. For $x\neq 0$, the reflected element $a-bi-cj-dk$ divided by $a^2+b^2+c^2+d^2$ is the inverse. We have $ij=k$ and $ji=-k$, so the product is not commutative and the set is not a field. The norm of a product equals the product of the norms by direct expansion. For scalars in $\mathbb{C}$, the rule $\alpha(xy)=x(\alpha y)$ of Definition 5.76 fails, so the set is not an algebra over $\mathbb{C}$.'
        constraints: 'Find coordinates, count base sizes, multiply in algebras.'
