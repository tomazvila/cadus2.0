          - problem: 'Let $\mathbb{R}^+=P\cup\{0\}$, where $P$ is the set of real numbers that contain $0$. For each set, give 1 if it is in $\mathbb{R}^+$ and 0 if not. (a) $\{q\in\mathbb{Q}: q<0\}$. (b) $\{q\in\mathbb{Q}: q<-1\}$. (c) $\{q\in\mathbb{Q}: q<7\}$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 0; c = 1'
            solution_sketch: 'The set in (a) is the zero real number, so it is in $\mathbb{R}^+$ and gets 1. The set in (b) misses 0 and is not zero, so it gets 0. The set in (c) holds 0, so it is in $P$ and gets 1.'
          # argument: Proposition 5.37
          - problem: 'Prove: let $P$ be the set of real numbers that contain $0$. (1) For $D,E\in P$ both $D+E$ and $D\cdot E$ lie in $P$. (2) For every real number $D$ exactly one of $D\in P$, $D=0$, $-D\in P$ holds.'
            answer_contract: {"kind":"written"}
            answer: 'For part 1, use 0+0=0 and the product of two positive elements. For part 2, split on whether 0 lies in D.'
            solution_sketch: 'Use Definition 5.35 and Definition 5.32. For part 1, 0 = 0+0 is in D+E. Also there are positive d in D and e in E, so 0 is below de and de is in D times E. For part 2, if 0 is in D then D is in P. Otherwise D is zero, or some positive x has -x as an upper bound of D. In the last case x lies in -D, so 0 lies in -D.'
          # argument: Theorem 5.38
          - problem: 'Prove the first step: with $P$ as above, $\mathbb{R}$ is an ordered field in which the positive cone is $P\cup\{0\}$.'
            answer_contract: {"kind":"written"}
            answer: 'The field laws hold by Theorem 5.36. Proposition 5.37 gives the closure under sum and product and the three cases for each number.'
            solution_sketch: 'Use Theorem 5.36 and Proposition 5.37. The field axioms are in Theorem 5.36. Closure of the cone under sum and product is part 1 of Proposition 5.37. For each D, exactly one of D in the cone, D = 0 or -D in the cone follows from part 2. These facts define a total order and a positive cone.'
          # argument: Theorem 5.38
          - problem: 'Prove the second step: for real numbers $D$ and $E$, we have $D<E$ exactly when $D$ is a proper subset of $E$.'
            answer_contract: {"kind":"written"}
            answer: 'D < E means E-D lies in P, which means 0 lies in E-D. Unpack this to find an element of E above D.'
            solution_sketch: 'Use Proposition 5.37. The relation D < E means that E - D is in P, that is, 0 is in E - D. This holds exactly when E has an element e that reaches an upper bound x of D other than its supremum. Since E is a down set, this happens exactly when D is a proper subset of E.'
          # source: FoM exercise 5.5-5-30
          - problem: 'Prove that the set $\mathbb{R}^+=P\cup\{0\}$ is a positive cone, where $P$ is the set of real numbers that contain $0$. Conclude that $\mathbb{R}$ is a totally ordered field.'
            answer_contract: {"kind":"written"}
            answer: 'Show closure under sum and product and the trichotomy for each D. Then the field laws and the cone give a total order.'
            solution_sketch: 'Use Proposition 5.37 and Theorem 5.36. Closure under sum and product is part 1 of Proposition 5.37. Exactly one of D in P, D = 0 or -D in P is part 2. Together with the field laws of Theorem 5.36, these facts make R a totally ordered field.'
