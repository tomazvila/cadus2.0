      - id: kp1
        name: 'Theorem 5.19 and Definition 5.20: the positive cone of the rational numbers'
        key_prerequisites: [fom-5-1-arithmetic-rational-numbers]
        exemplars:
          - problem: 'Let $x=3/4$ and $y=5/6$. Both are positive rational numbers. (a) Give $x+y$ as one fraction in lowest terms. (b) Give $xy$ as one fraction in lowest terms.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}}]}
            answer: 'a = 19/12; b = 5/8'
            solution_sketch: 'Add with the common denominator 12: $9/12+10/12=19/12$. Multiply the parts: $15/24$, which is $5/8$ in lowest terms. Both results have a positive numerator and a positive denominator.'
          - problem: 'Let $P$ be the set of positive rational numbers. Give 1 if the number is in $P$ and 0 if it is not. (a) $5/3$. (b) $-2/7$. (c) $0$. (d) $-(-9/4)$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 0; c = 0; d = 1'
            solution_sketch: 'The number $5/3$ has a positive numerator and denominator, so (a) is 1. The number $-2/7$ is below zero, so (b) is 0. The number 0 is not positive, so (c) is 0. The number $-(-9/4)$ equals $9/4$, so (d) is 1.'
          - problem: 'Take the rational numbers with the cone $\mathbb{Q}^+$ of all nonnegative rational numbers. Give 1 if the number is in the cone and 0 if it is not. (a) $0$. (b) $-1/3$. (c) $7/2$. (d) $-(-1/100)$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 0; c = 1; d = 1'
            solution_sketch: 'The cone holds 0 and all positive numbers. So (a) is 1. The number $-1/3$ is below zero, so (b) is 0. The number $7/2$ is positive, so (c) is 1. The number $-(-1/100)$ equals $1/100$, so (d) is 1.'
          - problem: 'Let $x=-3/5$ and use the cone of nonnegative rational numbers. (a) Give 1 if $x$ is in the cone and 0 if not. (b) Give 1 if $-x$ is in the cone and 0 if not. (c) Give the one of the two numbers $x$ and $-x$ that is positive.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 0; b = 1; c = 3/5'
            solution_sketch: 'The number $x=-3/5$ is below zero, so (a) is 0. Its opposite is $3/5$, which is positive, so (b) is 1. The positive one of the two numbers is $3/5$.'
          - problem: 'Look at the six rational numbers $3/2$, $-1/2$, $0$, $-7$, $4$ and $-2/3$. (a) Count the positive numbers. (b) Count the numbers below zero. (c) Count the nonnegative numbers.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 2; b = 3; c = 3'
            solution_sketch: 'The positive numbers are $3/2$ and $4$, so (a) is 2. The numbers below zero are $-1/2$, $-7$ and $-2/3$, so (b) is 3. The nonnegative numbers are $3/2$, $0$ and $4$, so (c) is 3.'
          - problem: 'Let $x=-2/3$ and $y=-9/4$. The opposite numbers $-x$ and $-y$ are positive. (a) Give $(-x)(-y)$ as a fraction in lowest terms. (b) Give $xy$ as a fraction in lowest terms. (c) Give 1 if $xy$ is a positive rational number and 0 if not.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 3/2; b = 3/2; c = 1'
            solution_sketch: 'Compute $(2/3)(9/4)=18/12=3/2$. The product $xy$ has the same value $3/2$, because two minus signs cancel. The number $3/2$ is positive, so (c) is 1.'
          - problem: 'Let $S$ be the set of nonnegative integers, as a subset of $\mathbb{Q}$. Give 1 if the statement holds and 0 if not. (a) The sum of two elements of $S$ is in $S$. (b) The product of two elements of $S$ is in $S$. (c) For every rational $x\neq 0$, the number $x$ or the number $-x$ is in $S$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 1; c = 0'
            solution_sketch: 'Sums and products of nonnegative integers are nonnegative integers, so (a) and (b) are 1. Take $x=1/2$. Neither $1/2$ nor $-1/2$ is an integer, so (c) is 0. So $S$ is not a positive cone of $\mathbb{Q}$.'
          # source: FoM exercise 5.3-5-17
          - problem: 'Prove: Let $P$ be the set of all rational numbers $n/d$ with $n$ and $d$ positive integers. (a) The sum and the product of two elements of $P$ are in $P$. (b) For every rational number $x$, exactly one case holds: $x$ is in $P$, or $-x$ is in $P$, or $x=0$.'
            answer_contract: {"kind":"written"}
            answer: 'Add and multiply fractions with positive parts to get positive parts. Write x as n/d with d positive and split by the sign of n.'
            solution_sketch: 'This is Theorem 5.19. For (a), add $n/d+m/e=(ne+md)/(de)$ and multiply $(n/d)(m/e)=(nm)/(de)$. Both have a positive numerator and a positive denominator. For (b), write $x=n/d$ with $d$ positive and split by the sign of $n$. Positive $n$ gives $x$ in $P$, zero gives $x=0$ and $n$ below zero gives $-x$ in $P$. Each case fixes the sign of $n$, so exactly one case holds.'
          # argument: Theorem 5.19
          - problem: 'Prove the second part: Let $P$ be the set of all rational numbers $n/d$ with $n$ and $d$ positive integers. For every rational number $x$, exactly one case holds: $x$ is in $P$, or $-x$ is in $P$, or $x=0$.'
            answer_contract: {"kind":"written"}
            answer: 'Write x as n/d with d positive. Split by the sign of n: positive gives x in P, zero gives x=0, below zero gives -x in P.'
            solution_sketch: 'Write $x=n/d$ with $d$ positive. If $n$ is positive, $x$ is in $P$. If $n=0$, then $x=0$. If $n$ is below zero, then $-x=(-n)/d$ is in $P$. At most one case holds, because each case fixes the sign of $n$.'
          # source: FoM exercise 5.3-5-18
          - problem: 'Prove: Let $a$ and $c$ be integers and let $b$ and $d$ be positive integers. Then $a/b<c/d$ if and only if $abd^2<b^2cd$. Here $x<y$ means that $y-x$ is a positive rational number.'
            answer_contract: {"kind":"written"}
            answer: 'The difference c/d minus a/b is (bc-ad)/(bd) with bd positive. So it is positive if and only if bc-ad is positive; multiply by bd to get the form.'
            solution_sketch: 'By definition, $a/b<c/d$ holds if and only if $c/d-a/b=(bc-ad)/(bd)$ is positive. The denominator $bd$ is positive. So the difference is positive if and only if $bc-ad>0$. Multiply $ad<bc$ by the positive number $bd$. This gives $abd^2<b^2cd$. Divide by $bd$ to go back.'
        constraints: 'Rational arithmetic only; the cone axioms are the sum rule, the product rule, zero and the sign split.'
      - id: kp2
        name: 'Example 5.21 and Theorem 5.22: the rational numbers as an ordered field, and inverses'
        key_prerequisites: [fom-4-4-ordered-rings]
        exemplars:
          - problem: 'Let $x=2$ and $y=5$. Then $0<x\le y$. (a) Give $x^{-1}$. (b) Give $y^{-1}$. (c) Give 1 if $y^{-1}\le x^{-1}$ and 0 if not.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 1/2; b = 1/5; c = 1'
            solution_sketch: 'The inverse of 2 is $1/2$ and the inverse of 5 is $1/5$. Since $1/5\le 1/2$, the value of (c) is 1. The order of the inverses is the reverse of the order of the numbers.'
          - problem: 'In the ordered field $\mathbb{Q}$, give 1 if the inverse of the number is positive and 0 if not. (a) The inverse of $5/9$. (b) The inverse of $-5/9$. (c) The inverse of $7$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 0; c = 1'
            solution_sketch: 'The inverse of $5/9$ is $9/5$, which is positive, so (a) is 1. The inverse of $-5/9$ is $-9/5$, which is below zero, so (b) is 0. The inverse of 7 is $1/7$, which is positive, so (c) is 1.'
          - problem: 'Let $x=1/3$ and $y=1/2$. Then $0<x\le y$. (a) Give $x^{-1}$. (b) Give $y^{-1}$. (c) Give the larger of the two inverses.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 3; b = 2; c = 3'
            solution_sketch: 'The inverse of $1/3$ is 3 and the inverse of $1/2$ is 2. The larger of 3 and 2 is 3. The smaller number $x$ has the larger inverse.'
          - problem: 'Let $x=3/4$ and $y=9/4$. (a) Give $x^{-1}$. (b) Give $y^{-1}$. (c) Give $x^{-1}-y^{-1}$ as a fraction in lowest terms.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 4/3; b = 4/9; c = 8/9'
            solution_sketch: 'The inverse of $3/4$ is $4/3$ and the inverse of $9/4$ is $4/9$. The difference is $12/9-4/9=8/9$. The difference is positive, which fits $y^{-1}\le x^{-1}$.'
          - problem: 'Let $x=-4$ and $y=-2$. Then $x\le y<0$. (a) Give $y^{-1}$. (b) Give $x^{-1}$. (c) Give 1 if $y^{-1}\le x^{-1}<0$ holds and 0 if not.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = -1/2; b = -1/4; c = 1'
            solution_sketch: 'The inverse of $-2$ is $-1/2$ and the inverse of $-4$ is $-1/4$. We have $-1/2\le -1/4<0$, so the value of (c) is 1.'
          - problem: 'Count positive integers $k$. (a) Count the $k$ with $1/k\ge 1/7$. (b) Give the largest such $k$. (c) Count the $k\le 20$ with $1/k\le 1/7$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 7; b = 7; c = 14'
            solution_sketch: 'The inequality $1/k\ge 1/7$ holds if and only if $k\le 7$, which gives the 7 values 1 to 7. The largest value is 7. The inequality $1/k\le 1/7$ holds for $k=7,\dots,20$, which is 14 values.'
          # source: FoM exercise 5.3-5-20
          - problem: 'Solve each inequality in $\mathbb{Q}$. (a) Give the lower endpoint of the solution set of $|7x+2|<3$. (b) Give the upper endpoint of that set. The solution set of $|6x+5|>2$ has the form $x<u$ or $x>v$. (c) Give $u$. (d) Give $v$. The solution set of $3\le|2x+4|\le 11$ is two intervals with four endpoints. Give them in increasing order: (e), (f), (g) and (h).'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}},{"name":"e","contract":{"kind":"exact"}},{"name":"f","contract":{"kind":"exact"}},{"name":"g","contract":{"kind":"exact"}},{"name":"h","contract":{"kind":"exact"}}]}
            answer: 'a=-5/7;b=1/7;c=-7/6;d=-1/2;e=-15/2;f=-7/2;g=-1/2;h=7/2'
            solution_sketch: 'From $-3<7x+2<3$ we get $-5/7<x<1/7$, so (a) is $-5/7$ and (b) is $1/7$. From $6x+5>2$ or $6x+5<-2$ we get $x>-1/2$ or $x<-7/6$, so (c) is $-7/6$ and (d) is $-1/2$. The inequality $3\le|2x+4|\le 11$ gives $-15/2\le x\le -7/2$ or $-1/2\le x\le 7/2$. The endpoints are $-15/2$, $-7/2$, $-1/2$ and $7/2$.'
          # argument: Theorem 5.22
          - problem: 'Prove the first step: Take a totally ordered field $\mathbb{F}$ and an element $x>0$. Then $x^{-1}>0$.'
            answer_contract: {"kind":"written"}
            answer: 'Suppose x^-1 is not positive. Then it is below zero, because 0 has no inverse, and multiplying x>0 by it gives 1<=0, a contradiction.'
            solution_sketch: 'Suppose $x^{-1}\le 0$. The number 0 has no inverse, so $x^{-1}<0$. Part 3 of Theorem 4.36 and $x>0$ give $1=x\cdot x^{-1}\le 0\cdot x^{-1}=0$. This contradicts Proposition 4.31, which gives $1>0$. So $x^{-1}>0$.'
          # argument: Theorem 5.22
          - problem: 'Prove the second step: Take a totally ordered field $\mathbb{F}$ with elements $0<x\le y$. Use $x^{-1}>0$ and $y^{-1}>0$. Then $y^{-1}\le x^{-1}$.'
            answer_contract: {"kind":"written"}
            answer: 'Multiply x<=y by the positive number x^-1 times y^-1. The product gives y^-1 <= x^-1.'
            solution_sketch: 'Both inverses are positive by the first step. Multiply $x\le y$ by the positive number $x^{-1}y^{-1}$. By part 2 of Theorem 4.36, the order stays. This gives $y^{-1}=x^{-1}xy^{-1}\le x^{-1}yy^{-1}=x^{-1}$.'
          # source: FoM exercise 5.3-5-19
          - problem: 'Prove: Take a totally ordered field $\mathbb{F}$ with elements $x\le y<0$. Then $y^{-1}\le x^{-1}<0$.'
            answer_contract: {"kind":"written"}
            answer: 'Pass to -y and -x, which satisfy 0<-y<=-x. Theorem 5.22 gives (-x)^-1 <= (-y)^-1 and both are positive; multiply by -1.'
            solution_sketch: 'The numbers $-y$ and $-x$ satisfy $0<-y\le -x$. Theorem 5.22 gives $0<(-x)^{-1}\le(-y)^{-1}$. Now $(-x)^{-1}=-x^{-1}$ and $(-y)^{-1}=-y^{-1}$. Multiply by $-1$. This gives $y^{-1}\le x^{-1}<0$.'
          # source: FoM exercise 5.3-5-21 part (a)
          - problem: 'Prove: For every integer $n$, the number $n^7/7+n^3/3+11n/21$ is an integer.'
            answer_contract: {"kind":"written"}
            answer: 'Write the sum over 21 and use n^7 = n mod 7 and n^3 = n mod 3 to show 21 divides the numerator.'
            solution_sketch: 'The sum is $(3n^7+7n^3+11n)/21$. Modulo 7 the numerator is $3n+4n\equiv 0$, because $n^7\equiv n$. Modulo 3 it is $n^3+2n\equiv 0$, because $n^3\equiv n$. So 3 and 7 both divide the numerator, and 21 divides it.'
          # source: FoM exercise 5.3-5-21 part (b)
          - problem: 'State why the fact that $n^7/7+n^3/3+11n/21$ is an integer for each integer $n$ is a poor exercise for a chapter on divisibility of whole numbers.'
            answer_contract: {"kind":"written"}
            answer: 'The sum holds fractions, and fractions of whole numbers are not defined until the rational numbers exist. A divisibility chapter works only with whole numbers.'
            solution_sketch: 'The sum uses the quotients $n^7/7$ and $11n/21$. These are not whole numbers in general. The rational numbers come in Section 5.3, so the sum has no meaning in Section 3.6. A whole number version is that $21$ divides $3n^7+7n^3+11n$.'
          # source: FoM exercise 5.3-5-21 part (c)
          - problem: 'Find the smallest positive rational number $a$ such that $n^5/5+n^3/3+an$ is an integer for every integer $n$. Give $a$ as a fraction.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}}]}
            answer: 'a = 7/15'
            solution_sketch: 'The sum is $(3n^5+5n^3+15an)/15$. For $n=1$ we need $8/15+a$ to be an integer, so $a=7/15$ is the smallest positive value. Modulo 3 the numerator $3n^5+5n^3+7n$ is $2n^3+n\equiv 0$, and modulo 5 it is $3n+2n\equiv 0$.'
          # source: FoM exercise 5.3-5-21 part (d)
          - problem: 'Find the smallest positive rational number $b$ such that $n^5/5+n^4/2+bn$ is a natural number for every natural number $n$. Give $b$ as a fraction.'
            answer_contract: {"kind":"multipart","parts":[{"name":"b","contract":{"kind":"exact"}}]}
            answer: 'b = 3/10'
            solution_sketch: 'The sum is $(2n^5+5n^4+10bn)/10$. For $n=1$ we need $7/10+b$ to be a natural number, so $b=3/10$ is the smallest positive value. Then the numerator $2n^5+5n^4+3n$ is even and divisible by 5, so 10 divides it.'
          - problem: 'Find rational numbers with the property. (a) Find the rational number $a$ with $0<a<1$ such that $n^5/5+n^3/3+an$ is an integer for every integer $n$. (b) Find the rational number $b$ with $0<b<1$ such that $n^5/5+n^4/2+bn$ is an integer for every natural number $n$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}}]}
            answer: 'a = 7/15; b = 3/10'
            solution_sketch: 'Write the first sum over 15 as $(3n^5+5n^3+15an)/15$. Modulo 5 and modulo 3 the numerator vanishes for $15a=7$, so $a=7/15$. Write the second sum over 10 as $(2n^5+5n^4+10bn)/10$. Modulo 2 and modulo 5 the numerator vanishes for $10b=3$, so $b=3/10$.'
        constraints: 'Work in a totally ordered field; the cited facts are Theorem 4.36 and Proposition 4.31.'
      - id: kp3
        name: 'Proposition 5.23: squares in an ordered field and the characteristic'
        key_prerequisites: [fom-4-4-ordered-rings]
        exemplars:
          - problem: 'Let $x$ be a rational number. (a) Give $x^2$ for $x=-3/2$. (b) Give $x^2$ for $x=0$. (c) Give $x^2$ for $x=-5$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 9/4; b = 0; c = 25'
            solution_sketch: 'Square each number: $(-3/2)^2=9/4$, $0^2=0$ and $(-5)^2=25$. All three squares are nonnegative.'
          - problem: 'Look at the seven integers $-3,-2,-1,0,1,2,3$. (a) Count the integers $x$ with $x^2<5$. (b) Count the integers $x$ with $x^2=0$. (c) Give the smallest value of $x^2$ among them.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 5; b = 1; c = 0'
            solution_sketch: 'The squares are 9, 4, 1, 0, 1, 4, 9. The squares below 5 come from $-2,-1,0,1,2$, which is 5 integers. Only $x=0$ gives 0, so (b) is 1. The smallest square is 0.'
          - problem: 'Let $x$ run over all rational numbers. (a) Give the smallest value of $x^2+3$. (b) Give the value of $x$ where that smallest value occurs.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}}]}
            answer: 'a = 3; b = 0'
            solution_sketch: 'Every square is at least 0, so $x^2+3\ge 3$. The value 3 occurs for $x=0$, so (a) is 3 and (b) is 0.'
          - problem: 'Let $x$ be a rational number with $x<0$ and $x^2=1/4$. (a) Give $x$. (b) Give $x^2+1$ as a fraction.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}}]}
            answer: 'a = -1/2; b = 5/4'
            solution_sketch: 'The two numbers with square $1/4$ are $1/2$ and $-1/2$. The one below zero is $-1/2$. Then $x^2+1=1/4+1=5/4$.'
          - problem: 'The characteristic of a field is the smallest integer $k\ge 1$ with $k\cdot 1=0$, or 0 if no such $k$ exists. (a) Give $4^2$ in the field $\mathbb{Z}_5$ as a number from 0 to 4. (b) Give the characteristic of $\mathbb{Z}_7$. (c) Give the characteristic of $\mathbb{Q}$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 7; c = 0'
            solution_sketch: 'In $\mathbb{Z}_5$ we have $16=3\cdot 5+1$, so (a) is 1. In $\mathbb{Z}_7$ the sum of seven ones is 0 and no shorter sum is 0, so (b) is 7. In $\mathbb{Q}$ every sum of ones is positive, so (c) is 0.'
          - problem: 'Let $f(n)=n/(|n|+1)$ for integers $n$. (a) Give $f(3)$. (b) Give $f(-2)$. (c) Give $f(0)$. (d) Give $f(3)-f(-2)$ as a fraction.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}}]}
            answer: 'a = 3/4; b = -2/3; c = 0; d = 17/12'
            solution_sketch: 'We get $f(3)=3/4$, $f(-2)=-2/3$ and $f(0)=0$. The difference is $3/4+2/3=9/12+8/12=17/12$. The map keeps the order of the integers.'
          # argument: Proposition 5.23
          - problem: 'Prove: Take a totally ordered field $\mathbb{F}$ and an element $x$ of it. Then $x^2\ge 0$.'
            answer_contract: {"kind":"written"}
            answer: 'Split into cases. If x is nonnegative, x times x is nonnegative; if x is below zero, then -x is positive and x^2 equals (-x)(-x).'
            solution_sketch: 'By Definition 5.20, $x$ or $-x$ lies in the positive cone, or $x=0$. If $x$ is in the cone, then $x\cdot x$ is in the cone by the product rule. If $-x$ is in the cone, then $(-x)(-x)=x^2$ is in the cone. If $x=0$, then $x^2=0$.'
          # source: FoM exercise 5.3-5-22
          - problem: 'Prove: Let $(\mathbb{F},+,\cdot)$ be a totally ordered field. Then the characteristic of $\mathbb{F}$ is $0$.'
            answer_contract: {"kind":"written"}
            answer: 'If a sum of k ones is 0, that sum is a sum of positive numbers, hence positive. This contradicts the value 0.'
            solution_sketch: 'Suppose a sum of $k\ge 1$ ones equals 0. Proposition 4.31 gives $1>0$. A sum of positive numbers is positive by the sum rule of the cone. So the sum of $k$ ones is positive and cannot equal 0. The characteristic is 0.'
          # source: FoM exercise 5.3-5-23
          - problem: 'Prove: Let $C$ be a countable totally ordered set. Then there is a bijective function $f:C\to D$ with $D\subseteq\mathbb{Q}$ such that $x\le y$ implies $f(x)\le f(y)$ for all $x,y\in C$.'
            answer_contract: {"kind":"written"}
            answer: 'List C as c1, c2, and so on. Pick f(ck) in the same gap among earlier images as ck has among earlier elements; the rationals are dense and unbounded.'
            solution_sketch: 'List the elements of $C$ as $c_1,c_2,\dots$ and set $f(c_1)=0$. Suppose $f(c_1),\dots,f(c_{k-1})$ are fixed. Pick $f(c_k)$ between the images of its two neighbors among the earlier elements, or above or below all earlier images. The rationals are dense and have no largest or smallest element, so each step works. The map is injective and keeps the order.'
        constraints: 'Work in a totally ordered field; squares are nonnegative and the characteristic is 0.'
