          - problem: 'Let $D=\{q\in\mathbb{Q}: q<\frac13\}$ and $E=\{q\in\mathbb{Q}: q<\frac{3}{10}\}$. For real numbers, $D\le E$ means $D\subseteq E$. (a) Give 1 if $D\le E$ and 0 if not. (b) Give 1 if $E\le D$ and 0 if not. (c) Give 1 if $\frac{8}{25}$ is in $D$ and not in $E$, and 0 if not.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 0; b = 1; c = 1'
            solution_sketch: 'Compare the limits: $\frac13\approx 0.333$ is larger than $0.3$. So $D\not\subseteq E$ and (a) is 0, and $E\subseteq D$ and (b) is 1. The number $\frac{8}{25}=0.32$ is below $0.333$ and not below $0.3$, so (c) is 1.'
          - problem: 'Let $P$ be the set of all real numbers that contain $0$. Take $D_1=\{q<0\}$, $D_2=\{q<-\frac12\}$, $D_3=\{q<\frac12\}$ and $D_4=\{q<3\}$, with $q$ rational. (a) Count the sets $D_i$ that are in $P$. (b) Count the sets $D_i$ with $-D_i\in P$. (c) Count the sets $D_i$ that are equal to the zero real number $\{q<0\}$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 2; b = 1; c = 1'
