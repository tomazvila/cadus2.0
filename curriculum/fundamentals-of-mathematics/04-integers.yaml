      - id: kp1
        name: 'Definition 4.7, Example 4.9 and Proposition 4.10: groups and the uniqueness of the inverse'
        key_prerequisites: [fom-4-1-arithmetic-integers, fom-3-8-arithmetic-modulo-m]
        exemplars:
          - problem: 'The integers modulo $5$ form a group with addition. Give each answer as a number from $0$ to $4$. (a) Give the neutral element. (b) Give the inverse of $[2]$. (c) Give the inverse of $[4]$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 0; b = 3; c = 1'
            solution_sketch: 'The neutral element is $[0]$, so (a) is 0. For (b), $2+3=5\equiv 0$, so the inverse is 3. For (c), $4+1=5\equiv 0$, so the inverse is 1.'
          - problem: 'Look at the integers with addition, and at the positive integers $\{1,2,3,\dots\}$ with addition. (a) Give the neutral element of the integers. (b) Give the inverse of $12$ in the integers. (c) Count the elements of $\{1,2,3\}$ that have an inverse in the positive integers.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 0; b = -12; c = 0'
            solution_sketch: 'The number $0$ satisfies $x+0=x$, so (a) is 0. The inverse of $12$ is the number that gives sum $0$ with $12$. That number is $-12$. The sum of two positive integers is never $0$, so no element has an inverse and (c) is 0.'
          - problem: 'The integers modulo $12$ form a group with addition. (a) Give the inverse of $[5]$ as a number from $0$ to $11$. (b) Give the inverse of $[0]$ as a number from $0$ to $11$. (c) Count the inverses that $[5]$ has.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 7; b = 0; c = 1'
            solution_sketch: 'Since $5+7=12\equiv 0$, the inverse of $[5]$ is 7. Since $0+0=0$, the inverse of $[0]$ is 0. An element of a group has exactly one inverse, so (c) is 1.'
          - problem: 'The nonzero integers modulo $7$ form a group with multiplication. The neutral element is $[1]$. Give each inverse as a number from $1$ to $6$. (a) Give the inverse of $[3]$. (b) Give the inverse of $[2]$. (c) Give the inverse of $[6]$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 5; b = 4; c = 6'
            solution_sketch: 'For (a), $3\cdot 5=15=14+1$, so the inverse is 5. For (b), $2\cdot 4=8=7+1$, so the inverse is 4. For (c), $6\cdot 6=36=35+1$, so the inverse is 6.'
          - problem: 'For each pair, give 1 if it is a group and 0 if it is not. (a) The integers with addition. (b) The integers with multiplication. (c) The nonzero rational numbers with multiplication. (d) The positive integers with addition.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 0; c = 1; d = 0'
            solution_sketch: 'Pair (a) satisfies all three group laws, so it gets 1. In (b), the number $2$ has no integer inverse, so the value is 0. In (c), the inverse of $p/q$ is $q/p$, so the value is 1. In (d), there is no neutral element, so the value is 0.'
          - problem: 'Let $f$ swap $1$ and $2$ and keep $3$. Let $g$ swap $2$ and $3$ and keep $1$. Both are bijective functions on $\{1,2,3\}$, and $(f\circ g)(x)=f(g(x))$. (a) Count the bijective functions from $\{1,2,3\}$ to itself. (b) Give $(f\circ g)(1)$. (c) Give $(g\circ f)(1)$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 6; b = 2; c = 3'
            solution_sketch: 'There are $3\cdot 2\cdot 1=6$ bijective functions. For (b), $g(1)=1$ and $f(1)=2$, so the value is 2. For (c), $f(1)=2$ and $g(2)=3$, so the value is 3. The two results differ, so composition is not commutative.'
          # argument: Proposition 4.10
          - problem: 'Prove: Let $(S,\circ)$ be a semigroup with neutral element $e$. Let $a\in S$ have an inverse element. Then $a$ has exactly one inverse element.'
            answer_contract: {"kind":"written"}
            answer: 'Take two inverses of a. Write the first as itself times e, replace e by a times the second, regroup, and get the second.'
            solution_sketch: 'Let $\tilde a$ and $\bar a$ both be inverses of $a$. Start with $\tilde a=\tilde a\circ e$. Replace $e$ by $a\circ\bar a$. Use associativity from Definition 4.7 to regroup the product as $(\tilde a\circ a)\circ\bar a$. Replace $\tilde a\circ a$ by $e$. Then $e\circ\bar a=\bar a$, so $\tilde a=\bar a$.'
          # source: FoM exercise 4.2-4-6
          - problem: 'Prove each statement. (a) For every positive integer $m$, the integers modulo $m$ with addition form a commutative group. (b) For every set $A$, the bijective functions from $A$ to $A$ with composition form a group. If $A$ has at least $3$ elements, this group is not commutative. (c) For $n\ge 2$, the invertible real $n\times n$ matrices with matrix product form a group that is not commutative.'
            answer_contract: {"kind":"written"}
            answer: 'Check the three group laws in each case. For the non-commutative parts, give two elements a and b with a times b different from b times a.'
            solution_sketch: 'Use Definition 4.7 and the addition of Definition 3.106. In (a), addition of classes is associative and commutative, the neutral element is $[0]$, and the inverse of $[a]$ is $[m-a]$. In (b), composition is associative, the identity function is neutral, and the inverse function is the inverse element. Two swaps that share one point do not commute. In (c), the matrix product is associative, the identity matrix is neutral, and each matrix has an inverse matrix. Two matrices with $AB\ne BA$ exist for $n\ge 2$.'
        constraints: 'Find neutral elements and inverses in small groups and decide whether a pair is a group; the items vary the sets and the operations.'
      - id: kp2
        name: 'Definitions 4.11 and 4.14, Examples 4.13 and 4.15, Proposition 4.16: rings, subtraction and cancellation'
        key_prerequisites: [fom-4-1-arithmetic-integers, fom-3-8-arithmetic-modulo-m]
        exemplars:
          - problem: 'Work in the ring of integers modulo $7$. Give each answer as a number from $0$ to $6$. (a) Compute $[5]+[4]$. (b) Compute $[5]\cdot[4]$. (c) Compute $[3]-[5]$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 2; b = 6; c = 5'
            solution_sketch: 'For (a), $5+4=9=7+2$, so the result is 2. For (b), $5\cdot 4=20=14+6$, so the result is 6. For (c), $3-5=-2$ and $-2+7=5$, so the result is 5.'
          - problem: 'In a ring, the difference is $x-y := x+(-y)$. Work in the integers modulo $10$ and give each answer as a number from $0$ to $9$. (a) Give $-[3]$. (b) Compute $[2]-[6]$. (c) Compute $[0]-[9]$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 7; b = 6; c = 1'
            solution_sketch: 'For (a), $3+7=10\equiv 0$, so $-[3]=[7]$. For (b), $[2]-[6]=[2]+[4]=[6]$. For (c), $-[9]=[1]$, so $[0]-[9]=[1]$.'
          - problem: 'Two integers are congruent modulo $m$ when their difference is $km$ for some integer $k$. (a) Count the classes of this relation on the integers for $m=12$. (b) Give the number $r$ from $0$ to $4$ with $29\equiv r$ modulo $5$. (c) Give the integer $k$ with $17-3=7k$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 12; b = 4; c = 2'
            solution_sketch: 'The remainders $0,1,\dots,11$ give 12 classes, so (a) is 12. For (b), $29-4=25=5\cdot 5$, so (b) is 4. For (c), $17-3=14=7\cdot 2$, so (c) is 2.'
          - problem: 'For each structure, give 1 if it is a ring and 0 if it is not. (a) The integers with addition and multiplication. (b) The positive integers with addition and multiplication. (c) The integers modulo $6$ with addition and multiplication. (d) The subsets of $\{1,2\}$ with union as addition and intersection as multiplication.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 0; c = 1; d = 0'
            solution_sketch: 'Structure (a) is the standard ring, so it gets 1. Structure (b) has no neutral element for addition, so it gets 0. Structure (c) is a ring, so it gets 1. In (d), the set $\{1\}$ has no additive inverse, because no set $B$ gives $\{1\}\cup B=\emptyset$. So (d) gets 0.'
          - problem: 'Work in the ring of integers modulo $11$. Give each answer as a number from $0$ to $10$ (or a count). (a) Find $x$ with $x+[8]=[2]$. (b) Find $y$ with $y+[4]=[1]$. (c) Count the elements $z$ with $z+[6]=[6]$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 5; b = 8; c = 1'
            solution_sketch: 'For (a), add $-[8]=[3]$ to both sides: $2+3=5$. For (b), add $-[4]=[7]$: $1+7=8$. For (c), add $-[6]$ to both sides to get $z=[0]$, so there is 1 element.'
          - problem: 'Let $f(x)=x+2$ and $g(x)=3x-1$ be polynomials over the integers. (a) Give the coefficient of $x$ in $f+g$. (b) Give the coefficient of $x^2$ in $f\cdot g$. (c) Give the coefficient of $x$ in $f\cdot g$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 4; b = 3; c = 5'
            solution_sketch: 'The sum is $f+g=4x+1$, so (a) is 4. The product is $(x+2)(3x-1)=3x^2+5x-2$. The coefficient of $x^2$ is 3 and the coefficient of $x$ is 5.'
          # argument: Proposition 4.16
          - problem: 'Prove: Let $(R,+,\cdot)$ be a ring and let $a,b,c\in R$ satisfy $a+c=b+c$. Then $a=b$.'
            answer_contract: {"kind":"written"}
            answer: 'Add the additive inverse of c to both sides, then regroup with associativity until a equals b.'
            solution_sketch: 'Write $a=a+0=a+(c-c)=(a+c)-c$ with the ring laws of Definition 4.11 and the difference of Definition 4.14. Replace $a+c$ by $b+c$. Regroup to $b+(c-c)$. Then $b+0=b$. So $a=b$.'
          # source: FoM exercise 4.2-4-7
          - problem: 'Prove each statement. (a) For every positive integer $m$, the integers modulo $m$ with addition and multiplication form a commutative ring with unity. (b) Let $R$ be a commutative ring and let $P$ be the set of polynomial functions over $R$ with pointwise sum and product. First show the coefficient formula for the product by induction. Then show that $P$ is a commutative ring. Then show that $P$ has a unity when $R$ has one. (c) The functions from the integers to the integers with pointwise sum and product form a commutative ring with unity.'
            answer_contract: {"kind":"written"}
            answer: 'Check the ring laws of Definition 4.11 on representatives or values. For the product formula, use induction on the degree.'
            solution_sketch: 'Use Definition 4.11 and the multiplication of Definition 3.106. In (a) and (c), each ring law holds for the representatives or for each value, so it holds for the classes or the functions. The unity is the class $[1]$ or the constant function 1. In (b), the sum is pointwise, so its laws follow from those of $R$. For the product, add one term at a time in an induction on the degree. The constant polynomial 1 is the unity.'
          # source: FoM exercise 4.2-4-8
          - problem: 'Prove each statement. (a) On the integers, keep the usual sum and define the product $x\odot y := 0$ for all $x,y$. This structure is a commutative ring. (b) On pairs of integers, let $(a,b)+(c,d)=(a+c,b+d)$ and $(a,b)\odot(c,d)=(ac,0)$. This structure is a commutative ring.'
            answer_contract: {"kind":"written"}
            answer: 'Check each law of Definition 4.11. The product is 0 or has second entry 0, so its laws are easy.'
            solution_sketch: 'The sum laws of Definition 4.11 follow from the usual sum of integers. In (a), every product is $0$, so associativity and both distributive laws read $0=0$. Commutativity holds because $x\odot y=0=y\odot x$. In (b), compute $((a,b)\odot(c,d))\odot(e,f)=(ace,0)=(a,b)\odot((c,d)\odot(e,f))$. Both distributive laws and commutativity follow from the laws of integers in the first entry.'
          # source: FoM exercise 4.2-4-11
          - problem: 'Let $R$ be a commutative ring and let $a,b\in R$ be elements such that $a+a\ne 0$ for every nonzero $a$ and $ab\ne 0$. (a) Prove that $(a+b)^2\ne a^2+b^2$. (b) Prove that $a^2+b^2=(a+b)^2$ for all $a,b$ in the integers modulo $2$. (c) Find two functions $f,g$ from the integers to the integers with $(f+g)^2=f^2+g^2$, and find two functions for which the equation fails.'
            answer_contract: {"kind":"written"}
            answer: 'Expand the square with the distributive laws. The cross term is ab plus ba, which is nonzero in (a) and equals 0 in the integers modulo 2.'
            solution_sketch: 'Expand $(a+b)^2=a^2+ab+ba+b^2$ with Definition 4.11. In (a), the equation needs $ab+ba=0$, and $ab+ba=2ab$ is nonzero by the two assumptions, so the equation fails. In (b), $ab+ba=2ab=0$ in the integers modulo $2$. In (c), take $f=0$ and any $g$ to get equality. Take $f=g=1$ to get $4\ne 2$.'
          # source: FoM exercise 4.2-4-12
          - problem: 'Let $X$ be a set. Let $R$ be a family of subsets of $X$ that is closed under the symmetric difference $\triangle$ and under the intersection. Use $\triangle$ as addition, $\cap$ as multiplication and $\emptyset$ as zero. (a) Prove that $R$ is a commutative ring. (b) Prove that $R$ has a unity if $X\in R$. (c) Prove that $R$ is closed under union. (d) Prove that $R$ is closed under the set difference $A\setminus B$.'
            answer_contract: {"kind":"written"}
            answer: 'Check the ring laws on elements of sets. For the closure parts, write union and set difference with symmetric difference and intersection.'
            solution_sketch: 'Use Definition 4.11 and check each law with elements of the sets. The inverse of $A$ is $A$ itself, because $A\triangle A=\emptyset$. The set $X$ is the unity, because $A\cap X=A$. For (c), $A\cup B=(A\triangle B)\triangle(A\cap B)$. For (d), $A\setminus B=A\triangle(A\cap B)$. Both formulas stay inside $R$.'
          # source: FoM exercise 4.2-4-13
          - problem: 'Let $X$ be a nonempty set. Use the subsets of $X$ with intersection as addition, union as multiplication and $X$ as zero. (a) Prove that the additive inverse law of Definition 4.11 fails. (b) Prove that all other laws hold. (c) Give the neutral element for union. (d) Decide whether every subset has an inverse for union, and justify the answer.'
            answer_contract: {"kind":"written"}
            answer: 'Check Definition 4.11. The empty set has no additive inverse when X is not empty, and the neutral element of union is the empty set.'
            solution_sketch: 'Use Definition 4.11. Let $A=\emptyset$ and let $X\ne\emptyset$. Then $A\cap B=\emptyset\ne X$ for every $B$, so $A$ has no additive inverse. Associativity and commutativity of both operations follow from the laws of sets, as do both distributive laws. The neutral element of union is $\emptyset$. A set $A\ne\emptyset$ has no inverse for union, because $A\cup B\supseteq A\ne\emptyset$.'
          # source: FoM exercise 4.2-4-14
          - problem: 'Let $X$ be a nonempty set. Use the subsets of $X$ with union as addition, intersection as multiplication and $\emptyset$ as zero. (a) Prove that the additive inverse law of Definition 4.11 fails. (b) Prove that all other laws hold. (c) Give the neutral element for intersection. (d) Decide whether every subset has an inverse for intersection, and justify the answer.'
            answer_contract: {"kind":"written"}
            answer: 'Check Definition 4.11. A nonempty set has no additive inverse, and the neutral element of intersection is X.'
            solution_sketch: 'Use Definition 4.11. Let $A\ne\emptyset$. Then $A\cup B\supseteq A\ne\emptyset$ for every $B$, so $A$ has no additive inverse. The other laws follow from the laws of sets. The neutral element of intersection is $X$. A proper subset $A\ne X$ has no inverse, because $A\cap B\subseteq A\ne X$.'
          # source: FoM exercise 4.2-4-15
          - problem: 'Use what you know about $\mathbb R^3$. A function $f:\mathbb R^3\to\mathbb R^3$ is linear when $f(\alpha x+\beta y)=\alpha f(x)+\beta f(y)$ for all $x,y$ and all real $\alpha,\beta$. Prove that the linear functions, with pointwise sum and composition as product, form a ring with unity that is not commutative.'
            answer_contract: {"kind":"written"}
            answer: 'Show that sums and compositions of linear maps are linear and check the ring laws. Give two maps that do not commute.'
            solution_sketch: 'A sum and a composition of linear maps are linear, so both operations are defined. The sum laws follow from the sum in $\mathbb R^3$. Composition is associative, and it is distributive over the sum. The identity map is the unity. A rotation about the $x$-axis and a rotation about the $y$-axis by a quarter turn do not commute.'
        constraints: 'Compute in rings of residues and polynomials and decide which structures are rings; the items vary the rings and the elements.'
      - id: kp3
        name: 'Proposition 4.17 and Proposition 4.18: zero products and the sign rule'
        key_prerequisites: []
        exemplars:
          - problem: 'Compute in the integers. (a) Compute $(-6)\cdot(-7)$. (b) Compute $(-4)\cdot 9$. (c) Compute $0\cdot(-13)$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 42; b = -36; c = 0'
            solution_sketch: 'For (a), two negative factors give $6\cdot 7=42$. For (b), $4\cdot 9=36$ with one negative factor gives $-36$. For (c), a product with $0$ is 0.'
          - problem: 'Work in the ring of integers modulo $8$ and give each answer as a number from $0$ to $7$. (a) Compute $[5]\cdot[0]$. (b) Compute $(-[3])\cdot(-[5])$. (c) Compute $[3]\cdot[5]$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 0; b = 7; c = 7'
            solution_sketch: 'A product with $[0]$ is $[0]$, so (a) is 0. For (b), $-[3]=[5]$ and $-[5]=[3]$, so the product is $15=8+7$, which is 7. For (c), $3\cdot 5=15\equiv 7$. The results of (b) and (c) agree.'
          - problem: 'Let $f(x)=x+1$ and $g(x)=2x$ be functions from the integers to the integers, with pointwise sum and product. (a) Compute $(0\cdot f)(5)$, where $0$ is the zero function. (b) Compute $((-f)\cdot(-g))(3)$. (c) Compute $(f\cdot g)(3)$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 0; b = 24; c = 24'
            solution_sketch: 'The zero function gives value 0, so (a) is 0. For (b), $-f(3)=-4$ and $-g(3)=-6$, so the product is 24. For (c), $f(3)\cdot g(3)=4\cdot 6=24$.'
          - problem: 'Work in the ring of integers modulo $10$ with $x=[3]$ and $y=[4]$. Give each answer as a number from $0$ to $9$. (a) Compute $(-x)\cdot y$. (b) Compute $x\cdot y$. (c) Compute $-(x\cdot y)$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 8; b = 2; c = 8'
            solution_sketch: 'For (a), $-x=[7]$ and $7\cdot 4=28\equiv 8$, so the result is 8. For (b), $3\cdot 4=12\equiv 2$. For (c), $-[2]=[8]$. So $(-x)y=-(xy)$.'
          - problem: 'Count solutions. (a) Count the elements $x$ of the integers modulo $7$ with $(-x)\cdot(-x)=[4]$. (b) Count the elements $x$ of the integers modulo $8$ with $[0]\cdot x=[0]$. (c) Count the elements $y$ of the integers modulo $5$ with $[3]\cdot y=[0]$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 2; b = 8; c = 1'
            solution_sketch: 'For (a), $(-x)(-x)=x^2$, and $x^2=4$ holds for $x=2$ and $x=5$, so the count is 2. For (b), every product with $[0]$ is $[0]$, so all 8 elements work. For (c), only $y=[0]$ works, so the count is 1.'
          - problem: 'A ring with unity has a unity $1$ with $1\ne 0$. Count the elements $y$ with the given product. (a) In the integers modulo $5$, count the $y$ with $[0]\cdot y=[1]$. (b) In the integers modulo $5$, count the $y$ with $[2]\cdot y=[1]$. (c) In the integers modulo $6$, count the $y$ with $[2]\cdot y=[1]$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 0; b = 1; c = 0'
            solution_sketch: 'A product with $[0]$ is $[0]$, and $[0]\ne[1]$, so (a) is 0. For (b), $2\cdot 3=6\equiv 1$, so $y=[3]$ and the count is 1. For (c), the products $2y$ modulo $6$ are even, so none equals $1$ and the count is 0.'
          # argument: Proposition 4.17
          - problem: 'Prove: In every ring, each element $x$ satisfies $0\cdot x=0$ and $x\cdot 0=0$.'
            answer_contract: {"kind":"written"}
            answer: 'Use 0x + 0x = (0+0)x = 0x. Then add the additive inverse of 0x to both sides.'
            solution_sketch: 'Distributivity from Definition 4.11 gives $0x+0x=(0+0)x=0x$. Add $-(0x)$ to both sides. Regroup with associativity to get $0x+0=0x$ on the left side and $0$ on the right side. So $0x=0$. The proof of $x0=0$ is the same with the other distributive law.'
          # argument: Proposition 4.18
          - problem: 'Prove: In every ring, all elements $x,y$ satisfy $(-x)(-y)=xy$.'
            answer_contract: {"kind":"written"}
            answer: 'Show that -(xy) equals (-x)y. Then show that (-x)(-y) is an additive inverse of -(xy), so it equals xy by uniqueness of inverses.'
            solution_sketch: 'From $(-x)y+xy=((-x)+x)y=0y=0$ we get $-(xy)=(-x)y$. Then $(-x)(-y)+(-(xy))=(-x)(-y)+(-x)y=(-x)((-y)+y)=(-x)0=0$. So $(-x)(-y)$ is an additive inverse of $-(xy)$. By Proposition 4.10, an inverse is unique. The element $xy$ is also an additive inverse of $-(xy)$, so $(-x)(-y)=xy$.'
          # source: FoM exercise 4.2-4-9
          - problem: 'Prove: In every ring, each element $x$ satisfies $x\cdot 0=0$.'
            answer_contract: {"kind":"written"}
            answer: 'Use x0 + x0 = x(0+0) = x0. Then add the additive inverse of x0 to both sides.'
            solution_sketch: 'The right distributive law of Definition 4.11 gives $x0+x0=x(0+0)=x0$. Add $-(x0)$ to both sides. Regroup with associativity. The left side becomes $x0$ and the right side becomes $0$. So $x0=0$, as in Proposition 4.17.'
          # source: FoM exercise 4.2-4-10
          - problem: 'Let $R$ be a ring with unity $1$ and $1\ne 0$. Prove that $0$ has no multiplicative inverse.'
            answer_contract: {"kind":"written"}
            answer: 'Assume 0 has an inverse y. Then 1 = 0y = 0 by Proposition 4.17, a contradiction.'
            solution_sketch: 'Suppose $y\in R$ satisfies $0\cdot y=1$. Proposition 4.17 gives $0\cdot y=0$. Then $1=0$. This contradicts the assumption $1\ne 0$. So no such $y$ exists.'
        constraints: 'Apply the zero product and the sign rule in rings of numbers, residues and functions; the items vary the rings.'
