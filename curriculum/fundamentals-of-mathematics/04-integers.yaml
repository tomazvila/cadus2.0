            answer: 'a = 1; b = 2; c = 3; d = 8'
            solution_sketch: 'Put in the pairs. For $(1,1)$ the first term is 0 and $n=1$, so $f=1$. For $(2,1)$ we get $1+1=2$. For $(1,2)$ we get $1+2=3$. For $(3,2)$ we get $6+2=8$.'
          - problem: 'Let $f(m,n)=\frac{(m+n-1)(m+n-2)}{2}+n$. Find the pair $(m,n)$ of natural numbers with $f(m,n)=8$ and give (a) $m$ and (b) $n$. Find the pair with $f(m,n)=12$ and give (c) $m$ and (d) $n$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}}]}
            answer: 'a = 3; b = 2; c = 4; d = 2'
            solution_sketch: 'Diagonal $m+n=5$ holds the values 7 to 10, and $f(3,2)=8$. Diagonal $m+n=6$ holds the values 11 to 15, and $f(4,2)=12$. So the first pair is $(3,2)$ and the second pair is $(4,2)$.'
          - problem: 'Let $f(m,n)=\frac{(m+n-1)(m+n-2)}{2}+n$. Compute (a) $f(5,3)$. (b) $f(4,4)$. (c) $f(1,7)$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 24; b = 25; c = 28'
            solution_sketch: 'For $(5,3)$ we have $m+n=8$, so $f=21+3=24$. For $(4,4)$ we have $m+n=8$, so $f=21+4=25$. For $(1,7)$ we have $m+n=8$, so $f=21+7=28$.'
          - problem: 'Look at the pairs $(m,n)$ of natural numbers. (a) Count the pairs with $m+n=11$. (b) Count the pairs with $m+n\le 11$. (c) Count the pairs with $m+n\le 10$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 10; b = 55; c = 45'
            solution_sketch: 'The sum $m+n=s$ has $s-1$ pairs, so (a) is 10. For (b) add $1+2+\dots+10=55$. For (c) add $1+2+\dots+9=45$.'
          - problem: 'Let $f(m,n)=2^m 3^n$. Compute (a) $f(3,2)$. (b) $f(1,1)$. Then find the pair $(m,n)$ with $f(m,n)=108$ and give (c) $m$ and (d) $n$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}}]}
            answer: 'a = 72; b = 6; c = 2; d = 3'
            solution_sketch: 'Compute $f(3,2)=8\cdot 9=72$ and $f(1,1)=2\cdot 3=6$. Write $108=4\cdot 27=2^2 3^3$. So $m=2$ and $n=3$.'
          - problem: 'Let $f(m,n)=\frac{(m+n-1)(m+n-2)}{2}+n$. Give each truth value as 1 for true and 0 for false. (a) The set of pairs of natural numbers is countable. (b) Some pair has $f(m,n)=7$. (c) $f(2,2)=f(3,1)$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 1; c = 0'
            solution_sketch: 'Theorem 4.63 gives (a), so (a) gets 1. We have $f(4,1)=6+1=7$, so (b) gets 1. We have $f(2,2)=3+2=5$ and $f(3,1)=3+1=4$, so (c) gets 0.'
          # argument: Theorem 4.63
          - problem: 'Prove the first step: the function $f(m,n)=\frac{(m+n-1)(m+n-2)}{2}+n$ from pairs of natural numbers to $\mathbb{N}$ is injective.'
            answer_contract: {"kind":"written"}
            answer: 'The sum m+n is fixed by the size of f, since f lies in a window of one diagonal. Then n is fixed by the offset inside the window.'
            solution_sketch: 'The pair $(m,n)$ with sum $s=m+n$ gets a value from $T+1$ to $T+s-1$, where $T=(s-1)(s-2)/2$. These windows for different $s$ do not overlap. So equal values force equal sums. Inside a window, $f=T+n$ fixes $n$. Then $m=s-n$ is fixed too, so $f$ is injective. The proof also uses induction on $m$ with the identity $f(m-1,n+1)=f(m,n)+1$.'
          # argument: Theorem 4.63
          - problem: 'Prove the second step: the function $f(m,n)=\frac{(m+n-1)(m+n-2)}{2}+n$ from pairs of natural numbers to $\mathbb{N}$ is surjective.'
            answer_contract: {"kind":"written"}
            answer: 'Use induction on the value k, starting with f(1,1)=1. If f(m,n)=k, then f(m-1,n+1) or f(n+1,1) equals k+1.'
            solution_sketch: 'Base step: $f(1,1)=1$. Induction step: let $f(m,n)=k$. If $m>1$, then $f(m-1,n+1)=f(m,n)+1=k+1$. If $m=1$, then $f(n+1,1)=\frac{n(n+1)}{2}+1$, and $f(1,n)=\frac{(n)(n-1)}{2}+n=\frac{n(n+1)}{2}$. So $f(n+1,1)=k+1$. In both cases $k+1$ has a preimage, so $f$ is surjective.'
          # source: FoM exercise 4.6-4-52
          - problem: 'Prove: Theorem 4.65 implies Theorem 4.63. That is, use the fact that a countable union of countable sets is countable to show that the set of pairs of natural numbers is countable.'
            answer_contract: {"kind":"written"}
            answer: 'Write the pairs as a union of columns, one column for each n. Each column is countable, so the union is countable.'
            solution_sketch: 'For each natural number $n$ let $C_n$ be the set of pairs $(m,n)$ with $m$ in the naturals. The map $m\mapsto(m,n)$ is a bijection, so each $C_n$ is countable. The union of all $C_n$ is the set of all pairs. By Theorem 4.65 this union is countable. This gives Theorem 4.63.'
          # source: FoM exercise 4.6-4-55
          - problem: 'Prove: for countable sets $C_1,\dots,C_n$, the product $C_1\times\dots\times C_n$ is countable. Start with two factors.'
            answer_contract: {"kind":"written"}
            answer: 'First treat two factors. Then use induction on n, writing the product of n+1 sets as a product of two sets.'
            solution_sketch: 'For two sets, map a pair to a pair of naturals by two injections and use Theorem 4.63 and Theorem 4.62. Induction on $n$: the case $n=1$ is given. For the step, the product of $n+1$ sets is the product of the product of the first $n$ sets with $C_{n+1}$. The first factor is countable by the induction hypothesis. So the two-set case finishes the step.'
          # source: FoM exercise 4.6-4-56
          - problem: 'Let $S$ be a set. Prove: an injective function from $S$ to $\mathbb{N}$ exists iff $S$ is countable.'
            answer_contract: {"kind":"written"}
            answer: 'A bijection or a finite listing gives an injection. For the converse, an injection is a bijection onto a subset of the naturals, which is countable.'
            solution_sketch: 'If $S$ is countably infinite, a bijection to the naturals is injective. If $S$ is finite, number its elements by $1,\dots,k$. Conversely, let $f$ be injective. Then $f$ is a bijection from $S$ onto $f[S]$, a subset of the naturals. By Theorem 4.62 the set $f[S]$ is countable. So $S$ is countable.'
          # source: FoM exercise 4.6-4-57
          - problem: 'Let $S$ be a finite set and let $f$ be a function from $S$ to $S$. Prove: $f$ is injective iff $f$ is surjective.'
            answer_contract: {"kind":"written"}
            answer: 'An injection keeps the number of elements, so the image is all of S. A function with a collision shrinks the count, so it is not surjective.'
            solution_sketch: 'Let $S$ have $k$ elements. If $f$ is injective, then $f[S]$ has $k$ elements and lies in $S$, so $f[S]=S$ and $f$ is surjective. If $f$ is not injective, two elements share an image, so $f[S]$ has fewer than $k$ elements and $f$ is not surjective. So the two properties are equivalent.'
        constraints: 'Compute the diagonal counting function and its preimages; proofs use induction on the diagonal step.'
