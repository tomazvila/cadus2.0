      - id: kp1
        name: 'Definition 4.19: isomorphisms and homomorphisms'
        key_prerequisites: [homomorphisms-intro]
        exemplars:
          - problem: 'Let $f(x)=2x$ be a function on the integers. (a) Compute $f(3+4)$. (b) Compute $f(3)+f(4)$. (c) Compute $f(3\cdot 4)-f(3)\cdot f(4)$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 14; b = 14; c = -24'
            solution_sketch: 'For (a), $f(7)=14$. For (b), $6+8=14$. The results agree, so $f$ respects addition. For (c), $f(12)=24$ and $f(3)f(4)=6\cdot 8=48$, so the difference is $-24$.'
          - problem: 'Let $f(x)$ be the remainder of $x$ on division by $3$, a function from the integers to the integers modulo $3$. (a) Compute $f(7)$. (b) Compute $f(10)$. (c) Compute $f(7+10)$ as a number from $0$ to $2$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 1; c = 2'
            solution_sketch: 'Since $7=2\cdot 3+1$, (a) is 1. Since $10=3\cdot 3+1$, (b) is 1. Since $17=5\cdot 3+2$, (c) is 2. This equals $f(7)+f(10)=1+1=2$.'
          - problem: 'Let $f(x)=2^x$ map the real numbers with addition to the positive real numbers with multiplication. (a) Compute $f(3)$. (b) Compute $f(2)\cdot f(5)$. (c) Compute $f(2+5)$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 8; b = 128; c = 128'
            solution_sketch: 'For (a), $2^3=8$. For (b), $4\cdot 32=128$. For (c), $2^7=128$. The values of (b) and (c) agree, because $f(x+y)=f(x)f(y)$.'
          - problem: 'Let $f(x)=3x$ be an isomorphism from the rational numbers with addition to the rational numbers with addition. (a) Compute $f^{-1}(12)$. (b) Compute $f^{-1}(f(5))$. (c) Compute $f^{-1}(2)+f^{-1}(7)$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 4; b = 5; c = 3'
            solution_sketch: 'The inverse function is $f^{-1}(y)=y/3$. So (a) is $12/3=4$. For (b), the result is the start value 5. For (c), $2/3+7/3=9/3=3$, which equals $f^{-1}(2+7)=f^{-1}(9)=3$.'
          - problem: 'For each function on the integers, give 1 if it is an isomorphism from the integers with addition to the integers with addition, and 0 if it is not. (a) $f(x)=x+1$. (b) $f(x)=-x$. (c) $f(x)=2x$. (d) $f(x)=x^3$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}}]}
            answer: 'a = 0; b = 1; c = 0; d = 0'
            solution_sketch: 'In (a), $f(x+y)=x+y+1$ and $f(x)+f(y)=x+y+2$, so the value is 0. In (b), $f$ is bijective and $-(x+y)=(-x)+(-y)$, so the value is 1. In (c), $f$ is not onto, because $1$ is not a value, so the value is 0. In (d), $f(1+1)=8$ and $f(1)+f(1)=2$, so the value is 0.'
          - problem: 'Count the functions. (a) Count the bijective functions from $\{1,2,3\}$ to $\{a,b,c\}$. (b) Count the isomorphisms from the integers modulo $4$ with addition to itself. (c) Count the homomorphisms from the integers modulo $4$ with addition to itself.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 6; b = 2; c = 4'
            solution_sketch: 'For (a), $3\cdot 2\cdot 1=6$. A homomorphism $f$ is fixed by $k=f([1])$, since $f$ of a class $[a]$ is $[ka]$. Each $k\in\{0,1,2,3\}$ works, so (c) is 4. The map is bijective only for $k=1$ and $k=3$, so (b) is 2.'
          # source: FoM exercise 4.3-4-17
          - problem: 'Let $m$ be a positive integer. Compare the integers modulo $m$ as defined with remainders and as defined with the relation $x-y=km$. Prove that the map that sends each class to the class of the same integer between these two structures is an isomorphism for addition and multiplication.'
            answer_contract: {"kind":"written"}
            answer: 'Show that the map is well defined and bijective. Then show that it keeps sums and products of representatives.'
            solution_sketch: 'Use Definition 4.19 and Example 4.15. The two definitions give the same classes, so the map is well defined and bijective. A sum of classes is the class of the sum of representatives in both structures. A product of classes is the class of the product of representatives in both structures. So $f(x+y)=f(x)+f(y)$ and $f(xy)=f(x)f(y)$.'
          # source: FoM exercise 4.3-4-18
          - problem: 'Let $f:A\to B$ be an isomorphism between two structures with the same number of binary operations. Prove that $f^{-1}:B\to A$ is an isomorphism between the same structures in the reverse direction.'
            answer_contract: {"kind":"written"}
            answer: 'The inverse of a bijection is a bijection. For two elements of B, write them as images of elements of A, and apply f to a product.'
            solution_sketch: 'A bijection has a bijective inverse. Take $u,v\in B$ and write $u=f(x)$ and $v=f(y)$. By Definition 4.19, $u*v=f(x)*f(y)=f(x\circ y)$. Apply $f^{-1}$ to get $f^{-1}(u*v)=x\circ y=f^{-1}(u)\circ f^{-1}(v)$. The same holds for every operation.'
          # source: FoM exercise 4.3-4-22
          - problem: 'Let $\tilde{\mathbb N}$ be a copy of the positive integers that has no element in common with the set $\mathbb N_0$ of integers from $0$ on. Write $\tilde n$ for the copy of $n$. Define a sum $\tilde+$ on $\mathbb N_0\cup\tilde{\mathbb N}$: it is the usual sum for two elements of $\mathbb N_0$, and it is the copy of the usual sum for two elements of $\tilde{\mathbb N}$. For $n\in\mathbb N$ and $k\in\mathbb N$, $n\,\tilde+\,\tilde k$ is $n-k$ if $n\ge k$ and $\widetilde{k-n}$ if $k>n$. (a) Prove that this structure is isomorphic to the integers with addition. (b) Use (a) to prove the group laws for $\tilde+$ except closure. (c) Prove associativity of $\tilde+$ without (a), by cases. (d) Define a product so that the structure is isomorphic to the integers with addition and multiplication.'
            answer_contract: {"kind":"written"}
            answer: 'Map n to n and the copy of k to minus k. Check that this map is bijective and keeps sums, then transfer the laws.'
            solution_sketch: 'Define $f(n)=n$ and $f(\tilde k)=-k$. This map is bijective and it keeps sums, by the cases of the definition. By Definition 4.19, the laws of the integers carry over to $\tilde+$. For (c), split into the sign cases of three elements and compute each case. That is long, which shows why the isomorphism is useful. For (d), define the product by pulling back the integer product along $f$.'
          # source: FoM exercise 4.3-4-24
          - problem: 'Let $(S,\circ)$ be a commutative semigroup such that $c\circ a=c\circ b$ implies $a=b$. (a) Prove that $(a,b)\sim(c,d)$ when $a\circ d=c\circ b$ is an equivalence relation on pairs of elements of $S$. (b) Let $K(S)$ be the set of classes. Prove that $[(a,b)]\bullet[(c,d)]:=[(a\circ c,b\circ d)]$ is well defined. (c) Prove that $(K(S),\bullet)$ is a commutative group. (d) Prove that $(S,\circ)$ is isomorphic to a subset of $K(S)$. (e) Prove that the integers are $K$ of the positive integers. (f) Prove that $K(G)$ is isomorphic to $G$ for every commutative group $G$. (g) Show that $(\mathbb N_0,\cdot)$ does not meet the cancellation rule.'
            answer_contract: {"kind":"written"}
            answer: 'Check reflexive, symmetric and transitive with commutativity and cancellation. The neutral class is [(a,a)] and the inverse of [(a,b)] is [(b,a)].'
            solution_sketch: 'Parts (a) and (b) use commutativity, associativity and the cancellation rule. For (c), the neutral class is $[(a,a)]$ and the inverse of $[(a,b)]$ is $[(b,a)]$. For (d), map $s$ to $[(s\circ t,t)]$ for a fixed $t$, and check Definition 4.19. For (e), compare with the construction of the integers. For (g), cancellation fails in $(\mathbb N_0,\cdot)$, because $0\cdot 1=0\cdot 2$.'
        constraints: 'Test whether a function keeps a sum or a product and count such functions; the items vary the functions and the structures.'
      - id: kp2
        name: 'Theorem 4.20 and Theorem 4.21: the natural numbers inside the integers'
        key_prerequisites: [fom-3-3-more-abstract-viewpoint-binary, fom-3-2-ordering-natural-numbers]
        exemplars:
          - problem: 'The class $[(a,b)]$ stands for the integer $a-b$. Compute with this rule. (a) Give the integer for $[(6,1)]$. (b) Give the integer for $[(3,8)]$. (c) Give the integer for $[(4,4)]$.'
