          - problem: 'Let $P=p_1\cdots p_k$ be the product of the first $k$ primes. Compute (a) $2\cdot 3\cdot 5+1$. (b) $2\cdot 3\cdot 5\cdot 7+1$. (c) The least prime factor of $2\cdot 3\cdot 5\cdot 7\cdot 11\cdot 13+1$, which equals $30031$.'
