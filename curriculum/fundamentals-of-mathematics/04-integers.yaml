        exemplars:
          - problem: 'Let $f(n)=\frac{n-1}{2}$ for odd $n$ and $f(n)=-\frac{n}{2}$ for even $n$. Compute (a) $f(1)$. (b) $f(2)$. (c) $f(5)$. (d) $f(8)$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}}]}
            answer: 'a = 0; b = -1; c = 2; d = -4'
            solution_sketch: 'Use the odd rule for odd inputs and the even rule for even inputs. The values are $f(1)=0$ and $f(5)=2$. The values are $f(2)=-1$ and $f(8)=-4$.'
          - problem: 'Let $f(n)=\frac{n-1}{2}$ for odd $n$ and $f(n)=-\frac{n}{2}$ for even $n$. Find the natural number $n$ with (a) $f(n)=3$. (b) $f(n)=-3$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}}]}
            answer: 'a = 7; b = 6'
            solution_sketch: 'A positive value comes from an odd $n$. Solve $(n-1)/2=3$ to get $n=7$. A negative value comes from an even $n$. Solve $-n/2=-3$ to get $n=6$.'
          - problem: 'Let $f(n)=\frac{n-1}{2}$ for odd $n$ and $f(n)=-\frac{n}{2}$ for even $n$. Find the natural number $n$ with (a) $f(n)=10$. (b) $f(n)=-10$. (c) $f(n)=0$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 21; b = 20; c = 1'
            solution_sketch: 'For $f(n)=10$ solve $(n-1)/2=10$ and get $n=21$. For $f(n)=-10$ solve $-n/2=-10$ and get $n=20$. For $f(n)=0$ the odd rule gives $n=1$.'
          - problem: 'Let $f(n)=\frac{n-1}{2}$ for odd $n$ and $f(n)=-\frac{n}{2}$ for even $n$. Look at the natural numbers $n$ from $1$ to $20$. (a) Count the $n$ with $f(n)>0$. (b) Count the $n$ with $f(n)<0$. (c) Count the $n$ with $f(n)=0$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 9; b = 10; c = 1'
            solution_sketch: 'The value $f(n)$ is positive for the odd numbers $3,5,\dots,19$, which makes 9. The value is negative for the 10 even numbers up to $20$. The value is zero only for $n=1$.'
          - problem: 'Let $f(n)=\frac{n-1}{2}$ for odd $n$ and $f(n)=-\frac{n}{2}$ for even $n$. (a) Compute $f(1)+f(2)+f(3)+f(4)+f(5)+f(6)$. (b) Compute $f(7)+f(8)$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}}]}
            answer: 'a = -3; b = -1'
            solution_sketch: 'The first six values are $0,-1,1,-2,2,-3$, and their sum is $-3$. The next two values are $f(7)=3$ and $f(8)=-4$, and their sum is $-1$.'
          - problem: 'Let $f(n)=\frac{n-1}{2}$ for odd $n$ and $f(n)=-\frac{n}{2}$ for even $n$. Give each truth value as 1 for true and 0 for false. (a) $f(9)=4$. (b) $f(10)=5$. (c) $f(12)=-6$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 0; c = 1'
            solution_sketch: 'Compute each value. The number 9 is odd and $f(9)=4$, so (a) gets 1. The number 10 is even and $f(10)=-5$, not $5$, so (b) gets 0. The number 12 is even and $f(12)=-6$, so (c) gets 1.'
          # source: FoM exercise 4.6-4-49
          - problem: 'A hotel has one room for each natural number, and every room holds one guest. Some new guests arrive. Give each room number as a natural number. (a) One new guest arrives. Each old guest moves from room $k$ to room $k+1$. Give the new room of the old guest from room 7. (b) Five new guests arrive. Each old guest moves from room $k$ to room $k+5$. Give the new room of the old guest from room 7. (c) A bus with one new guest for each natural number $j$ arrives. Each old guest moves from room $k$ to room $2k$, and new guest $j$ gets room $2j-1$. Give the new room of the old guest from room 7. (d) Give the room of new guest 7 in the bus plan. (e) Countably many buses arrive and each bus holds countably many new guests. Give 1 if one room assignment gives every guest a room of the hotel with no shared room, and 0 if no such assignment exists.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}},{"name":"e","contract":{"kind":"exact"}}]}
            answer: 'a=8;b=12;c=14;d=13;e=1'
            solution_sketch: 'In (a) the room is $7+1=8$. In (b) the room is $7+5=12$. In (c) the old guest gets $2\cdot 7=14$ and new guest 7 gets $2\cdot 7-1=13$. In (e) a countable union of countable sets is countable, so the answer is 1.'
          # source: FoM exercise 4.6-4-50
          - problem: 'Prove: the function $f$ from $\mathbb{N}$ to $\mathbb{Z}$ with $f(n)=\frac{n-1}{2}$ for odd $n$ and $f(n)=-\frac{n}{2}$ for even $n$ is bijective.'
            answer_contract: {"kind":"written"}
            answer: 'Odd inputs give the integers from 0 up and even inputs give the negative integers. Each rule is injective and the two ranges split the integers.'
            solution_sketch: 'Take $f(a)=f(b)$. Both values lie in the same range, so $a$ and $b$ have the same parity. In each case the rule is injective, so $a=b$. Now take an integer $z$. If $z\ge 0$, then $n=2z+1$ gives $f(n)=z$. If $z<0$, then $n=-2z$ gives $f(n)=z$, so $f$ is surjective.'
          # argument: Theorem 4.60
          - problem: 'Prove: there is a bijective function from $\mathbb{N}$ to $\mathbb{Z}$.'
            answer_contract: {"kind":"written"}
            answer: 'Send odd n to (n-1)/2 and even n to -n/2. Odd numbers fill the integers from 0 up and even numbers fill the negative integers.'
            solution_sketch: 'Define $f(n)=(n-1)/2$ for odd $n$ and $f(n)=-n/2$ for even $n$. Odd inputs give distinct integers that are at least 0. Even inputs give distinct negative integers. Every integer $z\ge 0$ equals $f(2z+1)$. Every integer $z<0$ equals $f(-2z)$. So $f$ is bijective.'
        constraints: 'Compute values and preimages of one explicit bijection; proofs use injective and surjective.'
      - id: kp2
        name: 'Definition 4.61 and Theorem 4.62: countable sets and their subsets'
        key_prerequisites: [fom-3-4-induction]
        exemplars:
          - problem: 'Give each truth value as 1 for true and 0 for false. (a) The set $\{1,2,3\}$ is countably infinite. (b) The set of even natural numbers is countably infinite. (c) The set $\{1,2,3\}$ is countable. (d) The set $\mathbb{Z}$ is countable.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}}]}
            answer: 'a = 0; b = 1; c = 1; d = 1'
            solution_sketch: 'A finite set has no bijection with the naturals, so (a) gets 0. The map $n\mapsto 2n$ is a bijection onto the even numbers, so (b) gets 1. A finite set is countable, so (c) gets 1. The set $\mathbb{Z}$ has a bijection with the naturals, so (d) gets 1.'
          - problem: 'Let $f(n)=2n$ be a bijection from $\mathbb{N}$ to the set of even natural numbers. Compute (a) $f(7)$. (b) The natural number $n$ with $f(n)=40$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}}]}
            answer: 'a = 14; b = 20'
            solution_sketch: 'Compute $f(7)=2\cdot 7=14$. Solve $2n=40$ to get $n=20$. Each value comes from the rule of the bijection.'
          - problem: 'Let $C$ be the set of natural numbers that are at least 11, and let $f(n)=n+10$ be a bijection from $\mathbb{N}$ to $C$. Let $S$ be the set of multiples of 5 in $C$. Build $g$ with $n_1=\min f^{-1}[S]$ and $n_{k+1}=\min(f^{-1}[S]\setminus\{n_1,\dots,n_k\})$ and $g(k)=f(n_k)$. Compute (a) $n_1$. (b) $n_2$. (c) $g(1)$. (d) $g(4)$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}}]}
            answer: 'a = 5; b = 10; c = 15; d = 30'
            solution_sketch: 'The value $f(n)=n+10$ is a multiple of 5 exactly when $n$ is a multiple of 5. So $n_1=5$ and $n_2=10$, and in general $n_4=20$. Then $g(1)=f(5)=15$ and $g(4)=f(20)=30$.'
          - problem: 'Let $C$ be the set of positive multiples of 3, with the bijection $h(n)=3n$ from $\mathbb{N}$ to $C$. Let $F=\{1,2\}$. Define $f$ from $\mathbb{N}$ to $C\cup F$ by $f(1)=1$, $f(2)=2$ and $f(n)=h(n-2)$ for $n>2$. Compute (a) $f(6)$. (b) The natural number $n$ with $f(n)=21$. (c) The natural number $n$ with $f(n)=2$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 12; b = 9; c = 2'
            solution_sketch: 'For $n>2$ we have $f(n)=3(n-2)$. So $f(6)=12$. Solve $3(n-2)=21$ to get $n=9$. The value 2 is the image of $n=2$.'
          - problem: 'Let $C$ be the set of positive multiples of 10 and let $D$ be the set of numbers $10k+5$ with $k\ge 1$. Define $f$ from $\mathbb{N}$ to $C\cup D$ by $f(2k-1)=10k$ and $f(2k)=10k+5$. Compute (a) $f(7)$. (b) $f(10)$. (c) The natural number $n$ with $f(n)=35$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 40; b = 55; c = 6'
            solution_sketch: 'The input 7 equals $2k-1$ with $k=4$, so $f(7)=40$. The input 10 equals $2k$ with $k=5$, so $f(10)=55$. The value 35 equals $10k+5$ with $k=3$, so $n=2k=6$.'
          - problem: 'Let $C$ be a countable set and let $S\subseteq C$. Give 1 if the statement must hold and 0 if it can fail. (a) $S$ is countable. (b) $S$ is finite. (c) $S$ is countably infinite. (d) If $C$ is finite, then $S$ is countable.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 0; c = 0; d = 1'
            solution_sketch: 'Theorem 4.62 gives (a), so (a) gets 1. Take $C=$ $\mathbb{N}$ and $S=\{1\}$ to see that (c) fails. Take $S=C$ to see that (b) gets 0. A finite set is countable, so (d) gets 1.'
          # argument: Theorem 4.62
          - problem: 'Prove: if $C$ is countable and $S\subseteq C$, then $S$ is countable.'
            answer_contract: {"kind":"written"}
            answer: 'A finite S is countable. Else list S in the order of the positions of its elements under a bijection with the naturals, and show this list is a bijection.'
            solution_sketch: 'A finite $S$ is countable. Else take a bijection $f$ from the naturals to $C$ and pick $n_1$ as the least element of $f^{-1}[S]$ by Theorem 3.51. Pick each $n_{k+1}$ as the least element that remains, and set $g(k)=f(n_k)$. The map $g$ is injective, since the $n_k$ differ and $f$ is injective. If $g$ misses an element, the least missed position is some $n_{k+1}$, a contradiction. So $g$ is bijective.'
          # source: FoM exercise 4.6-4-51
          - problem: 'Prove: (a) the function $f(m,n)=2^m 3^n$ from $\mathbb{N}\times\mathbb{N}$ to $\mathbb{N}$ is injective. (b) Use part (a) and Theorem 4.62 to show that $\mathbb{N}\times\mathbb{N}$ is countable.'
            answer_contract: {"kind":"written"}
            answer: 'Unique prime factorization gives injectivity. Then the pairs match a subset of the naturals, and a subset of a countable set is countable.'
            solution_sketch: 'If $2^m3^n=2^a3^b$, then the exponents of 2 agree and the exponents of 3 agree, by unique prime factorization. So $m=a$ and $n=b$, and $f$ is injective. Then $f$ is a bijection from the pairs onto its image, which is a subset of the naturals. By Theorem 4.62 that image is countable. So the set of pairs is countable.'
          # source: FoM exercise 4.6-4-53
          - problem: 'Prove: if $C$ is countably infinite and $F$ is finite, then $C\cup F$ is countable. Build the bijection from $\mathbb{N}$ to $C\cup F$ directly.'
            answer_contract: {"kind":"written"}
            answer: 'List the new elements of F first, then continue with the bijection of C shifted by the number of new elements.'
            solution_sketch: 'Let $h$ be a bijection from the naturals to $C$. Remove from $F$ the elements that lie in $C$ and list the remaining $r$ elements as $x_1,\dots,x_r$. Set $f(i)=x_i$ for $i\le r$ and $f(n)=h(n-r)$ for $n>r$. The map $f$ is injective and hits every element of $C\cup F$. So $f$ is bijective.'
          # source: FoM exercise 4.6-4-54
          - problem: 'Prove: if $C$ and $D$ are countably infinite, then $C\cup D$ is countable. Build the bijection from $\mathbb{N}$ to $C\cup D$ directly.'
            answer_contract: {"kind":"written"}
            answer: 'Alternate between the list of C and the list of D, and skip each element that appeared before.'
            solution_sketch: 'Let $c_k$ and $d_k$ list $C$ and $D$ by bijections from the naturals. Write the sequence $c_1,d_1,c_2,d_2,\dots$. Delete every entry that equals an earlier entry. The result lists $C\cup D$ once each. If the result is finite, the union is finite. Else the result is a bijection from the naturals, so the union is countable.'
        constraints: 'Decide countability, build bijections for unions with finite sets, and follow the subset listing.'
      - id: kp3
        name: 'Theorem 4.63: the pairs of natural numbers are countable'
        key_prerequisites: [fom-3-4-induction]
        exemplars:
          - problem: 'Let $f(m,n)=\frac{(m+n-1)(m+n-2)}{2}+n$. Compute (a) $f(1,1)$. (b) $f(2,1)$. (c) $f(1,2)$. (d) $f(3,2)$.'
