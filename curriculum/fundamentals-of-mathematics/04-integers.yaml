            solution_sketch: 'Compute $30+1=31$ and $210+1=211$. The number 30031 has no factor among 2, 3, 5, 7, 11 and 13, because each leaves remainder 1. The next prime that divides it is 59, since $30031=59\cdot 509$.'
          # source: FoM exercise 4.6-4-58
          - problem: 'Let $F$ be a finite set and let $I$ be an infinite set. Prove: $I\setminus F$ is infinite.'
            answer_contract: {"kind":"written"}
            answer: 'Assume I minus F is finite. Then I is the union of two finite sets, so I is finite, a contradiction.'
            solution_sketch: 'Suppose $I\setminus F$ is finite. Then $I\subseteq F\cup(I\setminus F)$ and in fact $I=(I\cap F)\cup(I\setminus F)$. Both parts are finite, so a bijection with a set $\{1,\dots,k\}$ exists for $I$. This contradicts that $I$ is infinite. So $I\setminus F$ is infinite.'
          # source: FoM exercise 4.6-4-59
          - problem: 'Prove: the primes form a countably infinite set.'
            answer_contract: {"kind":"written"}
            answer: 'The primes are a subset of the naturals, so they are countable. They are infinite, since one plus a product of finitely many primes has a new prime factor.'
            solution_sketch: 'The set of primes is a subset of the naturals, so it is countable by Theorem 4.62. Suppose the set is finite, with primes $p_1,\dots,p_k$. Let $N=p_1\cdots p_k+1$. Some prime divides $N$, and it is none of the $p_i$, a contradiction. So the set is infinite and countable, hence countably infinite.'
          # argument: Theorem 4.65
          - problem: 'Prove: a countable union of countable sets is countable.'
            answer_contract: {"kind":"written"}
            answer: 'Make the sets disjoint by removing earlier sets. Then list each piece and map the pair (n,k) to the k-th element of piece n, a bijection onto a subset of pairs.'
            solution_sketch: 'Let $B_n=C_n\setminus(C_1\cup\dots\cup C_{n-1})$. The sets $B_n$ are pairwise disjoint and have the same union as the $C_n$. List each $B_n$ as $b_n^k$. Then $(n,k)\mapsto b_n^k$ is a bijection from a set of pairs onto the union. That set of pairs is a subset of the pairs of naturals, which is countable by Theorem 4.63. By Theorem 4.62 the union is countable.'
