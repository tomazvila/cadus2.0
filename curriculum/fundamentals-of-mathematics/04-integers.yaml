            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}}]}
            answer: 'a = 0; b = -6'
            solution_sketch: 'For (a), the sum is $[(6,6)]$, which stands for 0. For (b), the product is $[(6+5,15+2)]=[(11,17)]$, which stands for $-6$.'
          - problem: 'For each set of integers, give 1 if the sum and the product of any two elements stay in the set, and 0 if they do not. (a) The positive integers. (b) The negative integers. (c) The even integers. (d) The odd integers.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 0; c = 1; d = 0'
            solution_sketch: 'In (a), sums and products of positive integers are positive, so the value is 1. In (b), $(-1)\cdot(-1)=1$ is not negative, so the value is 0. In (c), sums and products of even integers are even, so the value is 1. In (d), $1+1=2$ is not odd, so the value is 0.'
          - problem: 'Look at the integers from $-10$ to $10$ inclusive. Let $\mathbb N$ be the positive integers. (a) Count the integers $x$ with $x\in\mathbb N$. (b) Count the integers $x$ with $-x\in\mathbb N$. (c) Count the integers $x$ with $x=0$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 10; b = 10; c = 1'
            solution_sketch: 'The positive integers in the range are $1,\dots,10$, so (a) is 10. The integers with $-x$ positive are $-1,\dots,-10$, so (b) is 10. Only $0$ equals $0$, so (c) is 1. Each of the 21 integers falls in exactly one of the three groups.'
          # source: FoM exercise 4.3-4-23
          - problem: 'For each equation, give the number of integer solutions. (a) $x+6=2$. (b) $3x+2=4$. (c) $x^2-1=0$. (d) $x^2-2=0$. (e) $x^2+1=0$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}},{"name":"e","contract":{"kind":"exact"}}]}
            answer: 'a=1;b=0;c=2;d=0;e=0'
            solution_sketch: 'In (a), $x=-4$, so the count is 1. In (b), $3x=2$ has no integer solution, so the count is 0. In (c), $x=1$ and $x=-1$ work, so the count is 2. In (d), $x^2=2$ has no integer solution, so the count is 0. In (e), $x^2=-1$ has no solution, so the count is 0.'
          # argument: Theorem 4.20
          - problem: 'Prove the first step: the natural numbers map to the integers by $f(n)=[(n+1,1)]$. The map is injective, and its image is the set of all classes $[(n+1,1)]$.'
            answer_contract: {"kind":"written"}
            answer: 'Equal images give equal sums by the class relation. Cancel to get n equal to m.'
            solution_sketch: 'Suppose $f(n)=f(m)$. Then $[(n+1,1)]=[(m+1,1)]$, so $(n+1)+1=(m+1)+1$ by the class relation. Cancel the summand $1$ twice, as in Proposition 3.19. Then $n=m$, so $f$ is injective. The image is the set of classes $[(n+1,1)]$ by construction, so $f$ is onto it.'
          # argument: Theorem 4.20
          - problem: 'Prove the second step: for all natural numbers $n,m$ we have $f(n+m)=f(n)+f(m)$ and $f(nm)=f(n)f(m)$, where $f(n)=[(n+1,1)]$.'
            answer_contract: {"kind":"written"}
            answer: 'Rewrite each class with another representative. Then compare the sums and the products.'
            solution_sketch: 'For the sum, $[(n+m+1,1)]=[(n+m+2,2)]=[((n+1)+(m+1),1+1)]=f(n)+f(m)$. For the product, $[(nm+1,1)]=[((n+1)(m+1)+1,(n+1)+(m+1))]=f(n)f(m)$. Together with the first step, $f$ is an isomorphism by Definition 4.19.'
          # argument: Theorem 4.21
          - problem: 'Prove the first part: if $x$ and $y$ are in the image of the natural numbers in the integers, then $x+y$ and $xy$ are in it too.'
            answer_contract: {"kind":"written"}
            answer: 'Write x and y as images of natural numbers n and m. The map keeps sums and products, so x+y is the image of n+m and xy is the image of nm.'
            solution_sketch: 'Pick natural numbers $n,m$ with $f(n)=x$ and $f(m)=y$. Theorem 4.20 gives $x+y=f(n)+f(m)=f(n+m)$. It also gives $xy=f(n)f(m)=f(nm)$. Both values are images of natural numbers.'
          # argument: Theorem 4.21
          - problem: 'Prove the second part: every integer $x$ satisfies exactly one of the three conditions $x\in\mathbb N$, $-x\in\mathbb N$ and $x=0$.'
            answer_contract: {"kind":"written"}
            answer: 'Write x as a class [(a,b)] and compare a with b. Then show that no two conditions hold together.'
            solution_sketch: 'Let $x=[(a,b)]$. If $a=b$, then $x=0$. If $a>b$, subtract in the natural numbers as in Definition 3.41 to get $x=[(a-b+1,1)]\in\mathbb N$. If $a<b$, the same argument gives $-x=[(b,a)]\in\mathbb N$. Also $0\notin\mathbb N$, and if $x$ and $-x$ are both in $\mathbb N$, then $a+b+2=2$, which Proposition 3.19 rules out.'
          # source: FoM exercise 4.3-4-16
          - problem: 'Let $a<b$ be natural numbers and let $x=[(a,b)]$. Prove that $-x=[(b,a)]$ is in the image of the natural numbers.'
            answer_contract: {"kind":"written"}
            answer: 'Show that -x is the class [(b,a)]. Then write it as [(c+1,1)] with c = b - a.'
            solution_sketch: 'The class $[(b,a)]$ is the inverse of $x$, because $[(a,b)]+[(b,a)]=[(a+b,a+b)]=0$. Since $b>a$, write $c=b-a$ with Definition 3.41. Then $[(b,a)]=[(c+a,a)]=[(c+1,1)]+[(a-1,a-1)]=[(c+1,1)]$. This is $f(c)$.'
          # source: FoM exercise 4.3-4-19
          - problem: 'Let $n$ be an integer other than $-1$, $0$ and $1$. Prove that $n=(-1)^{q_0}\prod_{j=1}^k p_j^{q_j}$ for distinct primes $p_1,\dots,p_k$, an exponent $q_0\in\{0,1\}$ and positive exponents $q_j$. Prove that the primes and the exponents are unique.'
            answer_contract: {"kind":"written"}
            answer: 'Set the sign first. Then factor the absolute value of n.'
            solution_sketch: 'Set $q_0=0$ for $n>0$ and $q_0=1$ for $n<0$. Then $|n|$ is a natural number with $|n|\ge 2$. Apply the unique factorization of natural numbers to $|n|$. The sign exponent is fixed by the sign of $n$. So the whole form is unique.'
          # source: FoM exercise 4.3-4-20
          - problem: 'Prove that the set of classes $[(n+1,1)]$ with $n$ a natural number satisfies the Peano axioms, with the class $[(2,1)]$ as the first element.'
            answer_contract: {"kind":"written"}
            answer: 'Transfer each Peano axiom along the isomorphism f.'
            solution_sketch: 'By Theorem 4.20 the map $f(n)=[(n+1,1)]$ is a bijection that respects addition. Define the successor of $f(n)$ as $f(n)+f(1)=f(n+1)$. Then each Peano axiom for the natural numbers carries over to the image. The first element $f(1)$ is not a successor, and the successor map is injective because $f$ is.'
          # source: FoM exercise 4.3-4-21
          - problem: 'Let $S$ be a set of integers. Prove each statement. (a) If $0\in S$ and each $k\in S$ gives $k+1\in S$ and $k-1\in S$, then $S$ is all integers. (b) If $0\in S$ and each $k\in S$ gives $k+1\in S$ and $-k\in S$, then $S$ is all integers. (c) If $S$ is not empty and $k\in S$ holds exactly when $k+1\in S$ holds, then $S$ is all integers.'
            answer_contract: {"kind":"written"}
            answer: 'Use induction for the positive side. Use the step to k-1 or to -k for the negative side.'
            solution_sketch: 'For (a), induction from $0$ shows $\mathbb N\subseteq S$, because Theorem 4.21 splits the integers into $\mathbb N$, $-\mathbb N$ and $0$. Induction downward from $0$ gives the negative integers. For (b), the step $k\mapsto -k$ turns the positive integers into the negative ones. For (c), pick $s\in S$. The equivalence gives $s+j\in S$ and $s-j\in S$ for all $j$.'
        constraints: 'Read integer classes as differences and sort integers into positive, negative and zero; the items vary the classes and the sets.'
    diagnostic_exemplar:
      problem: 'The class $[(a,b)]$ stands for $a-b$. Give the integer for $[(9,4)]$.'
      answer_contract: {"kind":"exact"}
      answer: '5'
      solution_sketch: 'The class $[(9,4)]$ stands for the difference $9-4$. The difference is 5, so the integer is 5.'
