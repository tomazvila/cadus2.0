    knowledge_points:
      - id: kp1
        name: 'Definition 4.39 to Definition 4.44 and Proposition 4.43: divisors and greatest common divisors in a ring'
        key_prerequisites: [fom-4-2-groups-rings]
        exemplars:
          - problem: 'Work in the integers. Give 1 if the first number divides the second and 0 if not. (a) $4$ and $12$. (b) $5$ and $12$. (c) $-3$ and $6$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 0; c = 1'
            solution_sketch: 'The number a divides b when b = qa for some integer q. Here 12 = 3 * 4, so (a) gives 1. No integer q has 12 = 5q, so (b) gives 0. Also 6 = (-2) * (-3), so (c) gives 1.'
          - problem: 'Work in the integers. Find the integer $q$ with $b=qa$. (a) $a=7$ and $b=91$. (b) $a=-6$ and $b=-42$. (c) $a=9$ and $b=0$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 13; b = 7; c = 0'
            solution_sketch: 'Divide b by a in each case. In (a) 91 = 13 * 7, so q = 13. In (b) -42 = 7 * (-6), so q = 7. In (c) 0 = 0 * 9, so q = 0.'
          - problem: 'Count the divisors in the ring of integers. (a) How many positive divisors does $36$ have? (b) How many divisors does $36$ have when negative integers count too?'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}}]}
            answer: 'a = 9; b = 18'
            solution_sketch: 'The positive divisors of 36 are 1, 2, 3, 4, 6, 9, 12, 18 and 36. That makes 9. Each positive divisor has a negative partner, so the total is 18.'
          - problem: 'Work in the ring $\mathbb{Z}_6$. Give 1 if the first element divides the second and 0 if not. (a) $2$ and $4$. (b) $4$ and $2$. (c) $3$ and $2$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 1; c = 0'
            solution_sketch: 'In Z_6 we need an element q with b = qa. For (a), 2 * 2 = 4, so the value is 1. For (b), 4 * 2 = 8 = 2 in Z_6, so the value is 1. For (c), 3q is 0 or 3 for every q, never 2, so the value is 0.'
          - problem: 'Work with polynomials that have integer coefficients. Find the polynomial $q$ with the given product. (a) $x^2-9=q\cdot(x-3)$. (b) $x^3-1=q\cdot(x-1)$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"function","vars":["x"]}},{"name":"b","contract":{"kind":"function","vars":["x"]}}]}
            answer: 'a = x+3; b = x^2+x+1'
            solution_sketch: 'Factor each left side. In (a), x^2 - 9 = (x - 3)(x + 3), so q = x + 3. In (b), x^3 - 1 = (x - 1)(x^2 + x + 1), so q = x^2 + x + 1.'
          - problem: 'Look at the integers $84$ and $36$. (a) Give the positive greatest common divisor. (b) Give the greatest common divisor that is negative. (c) Count all greatest common divisors in $\mathbb{Z}$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 12; b = -12; c = 2'
            solution_sketch: 'The common divisors of 84 and 36 are the divisors of 12. The largest is 12 and it is a greatest common divisor. Its negative partner -12 also has the property that every common divisor divides it. So there are 2 greatest common divisors.'
          - problem: 'With integer coefficients, the polynomials $x^2-4=(x-2)(x+2)$ and $x^2+5x+6=(x+2)(x+3)$ have a common divisor of largest degree. (a) Give the greatest common divisor with leading coefficient $1$. (b) Give the other greatest common divisor, with leading coefficient $-1$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"function","vars":["x"]}},{"name":"b","contract":{"kind":"function","vars":["x"]}}]}
            answer: 'a = x+2; b = -x-2'
            solution_sketch: 'Both polynomials hold the factor x + 2 and nothing more in common. So x + 2 is a greatest common divisor. Multiply by -1 to get the second one, -x - 2, which has leading coefficient -1.'
          # argument: Proposition 4.43
          - problem: 'Prove: if $c$ and $d$ are both positive greatest common divisors of the integers $m$ and $n$, then $c=d$.'
            answer_contract: {"kind":"written"}
            answer: 'Each positive greatest common divisor divides the other, and two positive integers that divide each other are equal.'
            solution_sketch: 'Use Definition 4.41. The number d is a common divisor and c is a greatest common divisor, so d divides c. In the same way c divides d. Write c = dk and d = cl with integers k and l. Then c = ckl, so kl = 1, and k = l = 1 because both numbers are positive.'
          # source: FoM exercise 4.5-4-35
          - problem: 'Prove: in a ring $R$ with unity, divisibility is (a) reflexive and (b) transitive.'
            answer_contract: {"kind":"written"}
            answer: 'For reflexivity write a as 1 times a. For transitivity multiply the two witnesses of the divisions.'
            solution_sketch: 'Use Definition 4.39. For (a), a = 1 * a, so a divides a. For (b), let b = qa and c = rb. Then c = r(qa) = (rq)a by associativity. So a divides c.'
          # source: FoM exercise 4.5-4-36
          - problem: 'Prove: two positive integers $c$ and $d$ that are both greatest common divisors of $m$ and $n$ must be equal. Start with the step that $c$ divides $d$.'
            answer_contract: {"kind":"written"}
            answer: 'Mutual divisibility of c and d forces c = d for positive numbers.'
            solution_sketch: 'This is Proposition 4.43. Each of c and d is a common divisor of m and n. By the greatest property, d divides c and c divides d. Then c = dk and d = cl give kl = 1. So k = l = 1 and c = d.'
          # source: FoM exercise 4.5-4-46
          - problem: 'Prove: for every integer $n$, (a) $n(n+1)(n+2)$ is a multiple of $6$, (b) $n(n^2+5)$ is a multiple of $6$, (c) $n^7-n$ is a multiple of $42$, (d) $n(n+1)(n+2)(n+3)$ is a multiple of $24$, (e) $n^5-n$ is a multiple of $30$.'
            answer_contract: {"kind":"written"}
            answer: 'Split each target into coprime prime powers. Check each prime power with consecutive integers, residues or Fermat''s little theorem.'
            solution_sketch: 'For (a) and (d), consecutive integers hold a multiple of 2, 3 and, among four, of 4, so they hold 6 and 24. For (b), n^3 + 5n = (n-1)n(n+1) + 6n, and (a) covers the first part. For (c), n^7 - n is a multiple of 7 by Fermat''s little theorem, and of 2 and 3 by residues. For (e), n^5 - n is a multiple of 5 by Fermat''s little theorem, and of 2 and 3 because n^5 - n = (n-1)n(n+1)(n^2+1). The primes are different, so the product of the prime factors divides each number.'
        constraints: 'Work in a ring, in the integers or in a polynomial ring; each part has one exact value.'
      - id: kp2
        name: 'Theorem 4.45: division with remainder in the integers'
        key_prerequisites: [fom-3-6-divisibility, fom-4-4-ordered-rings]
        exemplars:
          - problem: 'Divide $n$ by $d$ in the integers so that $n=qd+r$ and $0\le r<|d|$. Take $n=47$ and $d=5$. (a) Give $q$. (b) Give $r$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}}]}
            answer: 'a = 9; b = 2'
            solution_sketch: 'Since 9 * 5 = 45 and 47 - 45 = 2, we get q = 9 and r = 2. The remainder 2 is less than 5.'
          - problem: 'A negative number $n=-47$ meets a positive divisor $d=5$. Find $q$ and $r$ with $n=qd+r$ and $0\le r<|d|$. (a) Give $q$. (b) Give $r$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}}]}
            answer: 'a = -10; b = 3'
            solution_sketch: 'The remainder must not be negative. We have -47 = (-10) * 5 + 3, and 0 <= 3 < 5. So q = -10 and r = 3.'
          - problem: 'A positive number $n=47$ meets a negative divisor $d=-5$. Find $q$ and $r$ with $n=qd+r$ and $0\le r<|d|$. (a) Give $q$. (b) Give $r$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}}]}
            answer: 'a = -9; b = 2'
            solution_sketch: 'We have 47 = (-9) * (-5) + 2. The remainder 2 satisfies 0 <= 2 < 5. So q = -9 and r = 2.'
          - problem: 'Both numbers are negative: $n=-47$ and $d=-5$. Find $q$ and $r$ with $n=qd+r$ and $0\le r<|d|$. (a) Give $q$. (b) Give $r$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}}]}
            answer: 'a = 10; b = 3'
            solution_sketch: 'We have -47 = 10 * (-5) + 3. Check: 10 * (-5) = -50 and -50 + 3 = -47. The remainder 3 satisfies 0 <= 3 < 5, so q = 10 and r = 3.'
          - problem: 'Let $d=-7$ in the integers. (a) How many different values of $r$ satisfy $0\le r<|d|$? (b) Give the largest such value of $r$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}}]}
            answer: 'a = 7; b = 6'
            solution_sketch: 'Here |d| = 7. The allowed remainders are 0, 1, 2, 3, 4, 5 and 6. That makes 7 values, and the largest is 6.'
          - problem: 'Divide in the integers so that $n=qd+r$ and $0\le r<|d|$. (a) Give $r$ for $n=0$ and $d=-4$. (b) Give $r$ for $n=3$ and $d=8$. (c) Give $r$ for $n=-3$ and $d=8$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 0; b = 3; c = 5'
            solution_sketch: 'For (a), 0 = 0 * (-4) + 0, so r = 0. For (b), 3 = 0 * 8 + 3, so r = 3. For (c), -3 = (-1) * 8 + 5, so r = 5.'
          - problem: 'Follow the steps of the division method for $n=-23$ and $d=-6$. First divide $|n|=23$ by $|d|=6$ as $23=\tilde q\cdot 6+\tilde r$. (a) Give $\tilde q$. (b) Give $\tilde r$. Then give the final numbers with $n=qd+r$ and $0\le r<|d|$. (c) Give $q$. (d) Give $r$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}}]}
            answer: 'a = 3; b = 5; c = 4; d = 1'
            solution_sketch: 'We have 23 = 3 * 6 + 5, so the first two values are 3 and 5. The remainder 5 is positive, so use q = 3 + 1 = 4 and r = 6 - 5 = 1. Check: 4 * (-6) + 1 = -23.'
          # argument: Theorem 4.45
          - problem: 'Prove the first step: for an integer $n$ and an integer $d\ne 0$, there are integers $q$ and $r$ with $n=qd+r$ and $0\le r<|d|$.'
            answer_contract: {"kind":"written"}
            answer: 'Divide the absolute values with natural numbers, then fix the signs of n and d with four cases and a shifted remainder.'
            solution_sketch: 'Use Theorem 3.86 for |n| and |d|. This gives |n| = a|d| + b with 0 <= b < |d|. Then pick q and r by the four sign cases. When b = 0, take q = a or -a and r = 0. When b > 0 and n is negative, use a + 1 and the remainder |d| - b.'
          # argument: Theorem 4.45
          - problem: 'Prove the second step: if $qd+r=\hat q d+\hat r$ with $0\le r,\hat r<|d|$ and $d\ne 0$, then $q=\hat q$ and $r=\hat r$.'
            answer_contract: {"kind":"written"}
            answer: 'The difference of the remainders is a multiple of d that is smaller than the size of d, so it is 0.'
            solution_sketch: 'Assume r >= the other remainder. Then (q^ - q)d = r - r^ lies between 0 and |d| - 1. A multiple of d with such a size is 0, so r = r^. Then (q^ - q)d = 0 and d is not 0. By Theorem 4.36, the integers have no zero divisors, so q = q^.'
          # source: FoM exercise 4.5-4-37
          - problem: 'Prove: the choices of $q$ and $r$ in the proof of the division algorithm work for (a) $n\ge 0$ and $d<0$ and (b) $n<0$ and $d>0$.'
            answer_contract: {"kind":"written"}
            answer: 'Check n = qd + r with the chosen q and r, and check that r lies between 0 and the size of d minus 1.'
            solution_sketch: 'Use Theorem 4.45 and the equation |n| = a|d| + b. For (a), take q = -a and r = b. Then qd + r = a|d| + b = n. For (b), take q = -a and r = 0 when b = 0. When b > 0, take q = -(a + 1) and r = d - b, and check n = qd + r.'
        constraints: 'Use the remainder between 0 and |d| - 1; the quotient may be negative.'
      - id: kp3
        name: 'Definition 4.46 to Example 4.50 and Theorem 4.47: division of polynomials and Euclidean rings'
        key_prerequisites: [fom-4-2-groups-rings]
        exemplars:
          - problem: 'Take the polynomial $p(x)=5x^4-3x^2+7$ over the integers. (a) Give its degree. (b) Give its leading coefficient. (c) Give the degree of the constant polynomial $7$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 4; b = 5; c = 0'
            solution_sketch: 'The largest power of x with a nonzero coefficient is x^4, so the degree is 4. Its coefficient is 5. The constant 7 has degree 0.'
          - problem: 'Over the integers, divide the polynomial $x^3+2x^2-x+4$ by $x-1$ so that the remainder has degree below $1$. (a) Give the quotient. (b) Give the remainder.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"function","vars":["x"]}},{"name":"b","contract":{"kind":"function","vars":["x"]}}]}
            answer: 'a = x^2+3x+2; b = 6'
            solution_sketch: 'Use the root 1 and synthetic division on the coefficients 1, 2, -1, 4. The running values are 1, 3, 2 and 6. So the quotient is x^2 + 3x + 2 and the remainder is 6.'
          - problem: 'Over the integers, divide the polynomial $2x^3+x-5$ by $x^2+1$ so that the remainder has degree below $2$. (a) Give the quotient. (b) Give the remainder.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"function","vars":["x"]}},{"name":"b","contract":{"kind":"function","vars":["x"]}}]}
            answer: 'a = 2x; b = -x-5'
            solution_sketch: 'The first term of the quotient is 2x, because 2x * x^2 = 2x^3. Subtract 2x(x^2 + 1) = 2x^3 + 2x from the dividend. The result is -x - 5, which has degree 1 and stops the division. So q = 2x and r = -x - 5.'
          - problem: 'Over the integers, divide the polynomial $x^4-1$ by $x^2+1$. (a) Give the quotient. (b) Give the remainder.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"function","vars":["x"]}},{"name":"b","contract":{"kind":"function","vars":["x"]}}]}
            answer: 'a = x^2-1; b = 0'
            solution_sketch: 'We have (x^2 + 1)(x^2 - 1) = x^4 - 1. So the quotient is x^2 - 1 and the remainder is 0.'
          - problem: 'Give 1 if the leading coefficient of $3x+1$ has a multiplicative inverse in the given ring and 0 if not. (a) The ring $\mathbb{Z}$. (b) The ring $\mathbb{Z}_7$. (c) The ring $\mathbb{Z}_6$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 0; b = 1; c = 0'
            solution_sketch: 'The leading coefficient is 3. In Z no integer times 3 gives 1, so (a) gives 0. In Z_7, 3 * 5 = 15 = 1, so (b) gives 1. In Z_6 the number 3 shares the factor 3 with 6, so no inverse exists and (c) gives 0.'
          - problem: 'Work with polynomials that have coefficients in $\mathbb{Z}_5$ and divide $x^2+1$ by $x+2$. Write every coefficient as a number from $0$ to $4$. (a) Give the remainder. (b) Give the constant term of the quotient.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}}]}
            answer: 'a = 0; b = 3'
            solution_sketch: 'In Z_5 we have (x + 2)(x + 3) = x^2 + 5x + 6 = x^2 + 1. So the quotient is x + 3 with remainder 0. The constant term of the quotient is 3.'
          - problem: 'Take $p(x)=2x+1$ and $q(x)=3x+1$ with coefficients in the ring $\mathbb{Z}_6$. (a) Give the degree of the product $pq$. (b) Give $\deg(p)+\deg(q)$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 2'
            solution_sketch: 'The product is 6x^2 + 5x + 1. In Z_6 we have 6 = 0, so the product is 5x + 1 and the degree is 1. The sum of the two degrees is 1 + 1 = 2.'
          - problem: 'In a Euclidean ring the function $\delta$ measures size. (a) Give $\delta(-12)$ when $\delta(n)=|n|$ on $\mathbb{Z}$. (b) Give $\delta(x^3+x)$ when $\delta(p)=\deg(p)$ for polynomials over $\mathbb{Q}$. (c) A Euclidean ring is commutative and has no two nonzero elements with product 0. Give 1 if the ring $\mathbb{Z}_6$ is a Euclidean ring and 0 if not.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 12; b = 3; c = 0'
            solution_sketch: 'For (a), |-12| = 12. For (b), the degree of x^3 + x is 3. For (c), the product 2 * 3 = 0 in Z_6 has two nonzero factors, and a Euclidean ring has none, so the value is 0.'
          # source: FoM exercise 4.5-4-42
          - problem: 'Over the integers, divide the polynomial $p$ by the polynomial $d$. (a) Give the quotient for $p(x)=3x^3-13x^2-39x+59$ and $d(x)=x-6$. (b) Give the remainder for that division. (c) Give the quotient for $p(x)=2x^5+3x^4-5x^3+2x^2-23x+25$ and $d(x)=x^2+2x-3$. (d) Give the remainder for that division.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"function","vars":["x"]}},{"name":"b","contract":{"kind":"function","vars":["x"]}},{"name":"c","contract":{"kind":"function","vars":["x"]}},{"name":"d","contract":{"kind":"function","vars":["x"]}}]}
            answer: 'a=3x^2+5x-9;b=5;c=2x^3-x^2+3x-7;d=4'
            solution_sketch: 'For (a), synthetic division by the root 6 gives the values 3, 5, -9 and 5. So the quotient is 3x^2 + 5x - 9 and the remainder is 5. For (c), the quotient terms are 2x^3, -x^2, 3x and -7. The last subtraction leaves 4, which has degree 0. So the quotient is 2x^3 - x^2 + 3x - 7 and the remainder is 4.'
          # argument: Theorem 4.47
          - problem: 'Prove the existence step: in a commutative ring with unity and no zero divisors, divide a nonzero polynomial $p$ by a nonzero polynomial $d$ whose leading coefficient has an inverse, and get $p=qd+r$ with $\deg(r)<\deg(d)$.'
            answer_contract: {"kind":"written"}
            answer: 'Use strong induction on the degree of p. Subtract a multiple of d that cancels the leading term.'
            solution_sketch: 'Use Definition 4.46 for the degree and the leading coefficient. If deg(p) < deg(d), take q = 0 and r = p. Otherwise subtract p_n d_m^(-1) x^(n-m) d from p. This kills the leading term, so the new polynomial has a smaller degree. Apply the induction hypothesis to it and add the subtracted term to its quotient.'
          # argument: Theorem 4.47
          - problem: 'Prove the uniqueness step: if $qd+r=\hat q d+\hat r$ with $\deg(r),\deg(\hat r)<\deg(d)$, then $q=\hat q$ and $r=\hat r$.'
            answer_contract: {"kind":"written"}
            answer: 'If the remainders differ, the degree of their difference is both below and at least deg(d). This is a contradiction, so both pairs agree.'
            solution_sketch: 'Assume r differs from r^. Then q differs from q^ and (q^ - q)d = r - r^. The degree of the left side is at least deg(d), and the degree of the right side is below deg(d). This is impossible, so r = r^. Then (q^ - q)d = 0 and Exercise 4-39 gives q = q^.'
          # source: FoM exercise 4.5-4-38
          - problem: 'Prove: for polynomials $p$ and $q$ over a commutative ring, (a) $\deg(p+q)\le\max\{\deg p,\deg q\}$, (b) $\deg(pq)\le\deg p+\deg q$, (c) the degrees add when the product of the leading coefficients is not $0$. For (d), give two polynomials over a commutative ring with $\deg(pq)<\deg p+\deg q$.'
            answer_contract: {"kind":"written"}
            answer: 'Check that every coefficient above the stated bound is zero. For (d) use the ring Z_6 with 2x and 3x.'
            solution_sketch: 'Use Definition 4.46. In (a) and (b) every coefficient above the stated bound is 0. In (c) the coefficient of the top power of pq is the product of the leading coefficients, which is not 0. For (d), take p = 2x and q = 3x over Z_6. The product is 6x^2 = 0, so its degree is below 2.'
          # source: FoM exercise 4.5-4-39
          - problem: 'Prove: let $R$ be a commutative ring with no two nonzero elements whose product is $0$. Then the product of two nonzero polynomials over $R$ is nonzero.'
            answer_contract: {"kind":"written"}
            answer: 'The coefficient of the top power of pq is the product of the two leading coefficients, which is not 0.'
            solution_sketch: 'Let the leading coefficients be a and b. Both are nonzero. The top coefficient of pq is ab, and ab is not 0 because R has no zero divisors. So the degree of pq is deg(p) + deg(q) by Definition 4.46, and pq is not 0.'
          # source: FoM exercise 4.5-4-40
          - problem: 'Prove: in a Euclidean ring $R$ with $d\ne 0$, if $qd+r=\hat q d+\hat r$ with $\delta(r),\delta(\hat r)<\delta(d)$ or the remainder equal to $0$, then $q=\hat q$ and $r=\hat r$.'
            answer_contract: {"kind":"written"}
            answer: 'Subtract the two equations. A nonzero difference of remainders is a multiple of d with a smaller size, which cannot happen.'
            solution_sketch: 'This uses Definition 4.49. Subtract the equations to get (q - q^)d = r^ - r. If q differs from q^, the left side is a nonzero multiple of d. Its size is not smaller than the size of d, but the right side is smaller. So q = q^, then r = r^.'
        constraints: 'Polynomials have integer or modular coefficients; the divisor has an invertible leading coefficient.'
      - id: kp4
        name: 'Theorem 4.51 to Proposition 4.54: Euclid''s algorithm, inverses modulo m and the key pair'
        key_prerequisites: [fom-3-6-divisibility, fom-3-9-public-key-encryption]
        exemplars:
          - problem: 'Run Euclid''s algorithm on $252$ and $198$. Each division with remainder is one step, and the last step has remainder $0$. (a) Give the greatest common divisor. (b) Give the number of steps.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}}]}
            answer: 'a = 18; b = 4'
            solution_sketch: 'We have 252 = 1 * 198 + 54, then 198 = 3 * 54 + 36, then 54 = 1 * 36 + 18, then 36 = 2 * 18 + 0. The last nonzero remainder is 18. The algorithm uses 4 steps.'
          - problem: 'Euclid''s algorithm on $17$ and $5$ gives $17=3\cdot5+2$ and $5=2\cdot2+1$. Substitute backward to write $1=s\cdot17+t\cdot5$ with $0\le s<5$. (a) Give $s$. (b) Give $t$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}}]}
            answer: 'a = 3; b = -10'
            solution_sketch: 'From the second line, 1 = 5 - 2 * 2. From the first line, 2 = 17 - 3 * 5. So 1 = 5 - 2 * (17 - 3 * 5) = 7 * 5 - 2 * 17. Add 5 * 17 and subtract 17 * 5 to move s into the range: s = 3 and t = -10. Check: 3 * 17 - 10 * 5 = 1.'
          - problem: 'Give 1 if the class has a multiplicative inverse and 0 if not. (a) $[6]$ in $\mathbb{Z}_{15}$. (b) $[7]$ in $\mathbb{Z}_{15}$. (c) $[10]$ in $\mathbb{Z}_{21}$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 0; b = 1; c = 1'
            solution_sketch: 'The class of x in Z_m has an inverse when x and m share no factor. The numbers 6 and 15 share the factor 3, so (a) gives 0. The numbers 7 and 15 share none, so (b) gives 1. The numbers 10 and 21 share none, so (c) gives 1.'
          - problem: 'Give the inverse as a number from $0$ up to one below the modulus. (a) The inverse of $[3]$ in $\mathbb{Z}_{11}$. (b) The inverse of $[7]$ in $\mathbb{Z}_{26}$. (c) The inverse of $[5]$ in $\mathbb{Z}_{12}$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 4; b = 15; c = 5'
            solution_sketch: 'For (a), 3 * 4 = 12 = 1 in Z_11. For (b), 7 * 15 = 105 = 4 * 26 + 1. For (c), 5 * 5 = 25 = 2 * 12 + 1.'
          - problem: 'Count the classes that have a multiplicative inverse. (a) In $\mathbb{Z}_{12}$. (b) In $\mathbb{Z}_{10}$. (c) In $\mathbb{Z}_{7}$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 4; b = 4; c = 6'
            solution_sketch: 'The class of x has an inverse when x and the modulus share no factor. In Z_12 the numbers 1, 5, 7 and 11 work, which is 4. In Z_10 the numbers 1, 3, 7 and 9 work, which is 4. In Z_7 all of 1 to 6 work, which is 6.'
          - problem: 'Give the greatest common divisor with leading coefficient $1$ over $\mathbb{Q}$. (a) $x^2-1$ and $x^2+3x+2$. (b) $2x^2-2$ and $4x+4$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"function","vars":["x"]}},{"name":"b","contract":{"kind":"function","vars":["x"]}}]}
            answer: 'a = x+1; b = x+1'
            solution_sketch: 'Factor each polynomial. In (a), x^2 - 1 = (x - 1)(x + 1) and x^2 + 3x + 2 = (x + 1)(x + 2). In (b), 2x^2 - 2 = 2(x - 1)(x + 1) and 4x + 4 = 4(x + 1). The common part with leading coefficient 1 is x + 1 in both.'
          # source: FoM exercise 4.5-4-43
          - problem: 'Four pairs of integers $(m,n)$ come first. For each pair, give the positive greatest common divisor $g$. Then give the integer $s$ with $0\le s<n/g$ so that $g=sm+tn$ holds for some integer $t$. Pair one is $(352,29)$: (a) $g$ and (b) $s$. Pair two is $(3526,298)$: (c) $g$ and (d) $s$. Pair three is $(4978,333)$: (e) $g$ and (f) $s$. Pair four is $(219,352)$: (g) $g$ and (h) $s$. Last, give the greatest common divisor with leading coefficient $1$ of two polynomials over $\mathbb{Q}$. (i) $2x^3+11x^2+23x+9$ and $4x^3-4x^2+7x+5$. (j) $2x^5+x^4+3x^3+5x^2-9x+6$ and $4x^4+2x^3+7x^2+6x-15$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}},{"name":"e","contract":{"kind":"exact"}},{"name":"f","contract":{"kind":"exact"}},{"name":"g","contract":{"kind":"exact"}},{"name":"h","contract":{"kind":"exact"}},{"name":"i","contract":{"kind":"function","vars":["x"]}},{"name":"j","contract":{"kind":"function","vars":["x"]}}]}
            answer: 'a=1;b=22;c=2;d=143;e=1;f=235;g=1;h=307;i=x+1/2;j=x^2+3'
            solution_sketch: 'Run Euclid''s algorithm on each pair. Pair one gives g = 1 and s = 22, because 22 * 352 = 7744 = 267 * 29 + 1. Pair two gives g = 2 and s = 143, pair three gives g = 1 and s = 235, and pair four gives g = 1 and s = 307. For the polynomials, the last nonzero remainder, made monic, is x + 1/2 in (i) and x^2 + 3 in (j).'
          # source: FoM exercise 4.5-4-44
          - problem: 'Let $p$ and $q$ be primes and $n=pq$. Let $e$ be the smallest integer above $1$ that shares no factor with $(p-1)(q-1)$. The private key $d$ has $ed\equiv 1$ modulo $(p-1)(q-1)$ and $0<d<(p-1)(q-1)$. For $p=7$ and $q=17$, give (a) $e$ and (b) $d$. For $p=19$ and $q=97$, give (c) $e$ and (d) $d$. For $p=101$ and $q=103$, give (e) $e$ and (f) $d$. For $p=1013$ and $q=2437$, give (g) $e$ and (h) $d$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}},{"name":"e","contract":{"kind":"exact"}},{"name":"f","contract":{"kind":"exact"}},{"name":"g","contract":{"kind":"exact"}},{"name":"h","contract":{"kind":"exact"}}]}
            answer: 'a=5;b=77;c=5;d=1037;e=7;f=8743;g=5;h=986093'
            solution_sketch: 'The products are 96, 1728, 10200 and 2465232. The smallest valid e is 5 for the first, second and fourth, and 7 for the third. Euclid''s algorithm gives the inverses 77, 1037, 8743 and 986093. Check: 5 * 77 = 385 = 4 * 96 + 1.'
          # source: FoM exercise 4.5-4-45
          - problem: 'For a public key $(n,e)$ with $n=pq$ for two primes, give the private key $d$ with $0<d<(p-1)(q-1)$ and $ed\equiv 1$ modulo $(p-1)(q-1)$. (a) $(77,7)$. (b) $(91,5)$. (c) $(299,85)$. (d) $(10403,91)$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}}]}
            answer: 'a=43;b=29;c=205;d=3811'
            solution_sketch: 'Factor n first. The products (p-1)(q-1) are 60, 72, 264 and 10200. Euclid''s algorithm gives the inverses 43, 29, 205 and 3811. Check: 7 * 43 = 301 = 5 * 60 + 1.'
          # argument: Theorem 4.51
          - problem: 'Prove the first step: in a Euclidean ring, repeated division with remainder ends with a nonzero last remainder $a_k$ that is a greatest common divisor of $m$ and $n$.'
            answer_contract: {"kind":"written"}
            answer: 'The sizes drop, so the division ends. The last nonzero remainder divides m and n, and each shared divisor of m and n divides it.'
            solution_sketch: 'Put a_0 = m and a_1 = n, and divide step by step with a_(j-1) = q_j a_j + a_(j+1). The sizes drop, so some a_(k+1) is 0. Then a_k divides a_(k-1), then a_(k-2), and so on up to m and n. Next, a common divisor p of m and n divides a_2, a_3 and so on up to a_k. This is Definition 4.41 for a_k.'
          # argument: Theorem 4.51
          - problem: 'Prove the second step: the greatest common divisor $a_k$ from Euclid''s algorithm has the form $sm+tn$ with $s,t$ in the ring.'
            answer_contract: {"kind":"written"}
            answer: 'Substitute backward through the division steps. Each remainder is a combination of the two before it.'
            solution_sketch: 'Each remainder satisfies a_j = a_(j-2) - q_(j-1) a_(j-1). So a_k is a combination of a_(k-2) and a_(k-1). Replace a_(k-1) with a combination of a_(k-3) and a_(k-2), and continue. After the last substitution, a_k = s a_0 + t a_1. This uses the construction of Theorem 4.51.'
          # argument: Theorem 4.53
          - problem: 'Prove: for $m\in\mathbb{N}$, the residue class of $x$ modulo $m$ is nonzero and has a multiplicative inverse exactly when $x$ and $m$ share no factor above $1$.'
            answer_contract: {"kind":"written"}
            answer: 'With no shared factor, Euclid''s algorithm gives 1 = sx + tm, so s is the inverse. With an inverse y, xy - km = 1, so no factor is shared.'
            solution_sketch: 'For one direction, use Euclid''s algorithm from Theorem 4.51. It gives 1 = sx + tm, so s times x leaves remainder 1 modulo m. For the other direction, let y be an inverse of x modulo m. Then xy = 1 + km for an integer k, so xy - km = 1. A common factor of x and m above 1 divides 1, which is impossible. This also matches Proposition 3.107.'
          # argument: Proposition 4.54
          - problem: 'Prove: take polynomials over a field. Two nonzero polynomials $p$ and $q$ have greatest common divisors $c$ and $d$, both with leading coefficient $1$. Then $c=d$.'
            answer_contract: {"kind":"written"}
            answer: 'Use induction on deg(p) + deg(q). Replace the pair by q and the remainder of p divided by q, which has the same common divisors.'
            solution_sketch: 'Use induction on n = deg(p) + deg(q). If q divides p, then c and d both equal q divided by its leading coefficient. Otherwise, Theorem 4.47 gives p = aq + r with deg(r) < deg(q). The pairs (p, q) and (q, r) have the same shared divisors, so both c and d are also greatest common divisors of q and r. The induction hypothesis gives c = d.'
          # source: FoM exercise 4.5-4-47
          - problem: 'Define the greatest common divisor of integers $m_1,\dots,m_k$ and prove: it exists and it is unique.'
            answer_contract: {"kind":"written"}
            answer: 'Build the divisor one pair at a time with Euclid''s algorithm. Two positive candidates divide each other, so they are equal.'
            solution_sketch: 'Call g a greatest common divisor when g divides every m_i and every common divisor divides g. For existence, use Theorem 4.51 to get g_2 = gcd(m_1, m_2). Then take g_3 = gcd(g_2, m_3), and so on. Each step keeps the property. For uniqueness, two positive candidates divide each other as in Proposition 4.43, so they are equal.'
          # source: FoM exercise 4.5-4-48
          - problem: 'Let $\varphi(n)$ count the $x\in\{1,\dots,n\}$ with no common factor with $n$ above $1$. Prove: (a) $\varphi(mn)=\varphi(m)\varphi(n)$ when $m,n$ share no factor, (b) $\varphi(p^k)=(p-1)p^{k-1}$ for a prime $p$, (c) $\sum_{d\mid m}\varphi(d)=m$, (d) $\varphi(m)=m\prod_{p\mid m}(1-1/p)$ over primes $p$, (e) $a^{\varphi(m)}\equiv 1$ modulo $m$ when $a,m$ share no factor.'
            answer_contract: {"kind":"written"}
            answer: 'Use the Chinese remainder theorem with Theorem 4.53 for (a), count multiples of p for (b), then induct on prime factors for (c) and (d), and on k for (e).'
            solution_sketch: 'For (a), the map from Z_(mn) to Z_m x Z_n is a ring isomorphism, and Theorem 4.53 names the classes with inverses are the ones without shared factors. For (b), only the multiples of p fail, and there are p^(k-1) of them. For (c) and (d), induct on the number of distinct prime factors with part (a). For (e), take m = p^k first and induct on k, then combine the prime powers with part (a).'
        constraints: 'Use integers, residue classes and polynomials over the rationals; give one unique value for each part.'
      - id: kp5
        name: 'Definition 4.55 to Corollary 4.59: zeros, multiplicity and the bound on the number of zeros'
        key_prerequisites: [fom-4-2-groups-rings]
        exemplars:
          - problem: 'Take $p(x)=x^3-2x^2-5x+6$ over the integers. (a) Give $p(1)$. (b) Give $p(2)$. (c) Give $p(3)$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 0; b = -4; c = 0'
            solution_sketch: 'Put each value in. We get p(1) = 1 - 2 - 5 + 6 = 0. We get p(2) = 8 - 8 - 10 + 6 = -4. We get p(3) = 27 - 18 - 15 + 6 = 0.'
          - problem: 'Over the integers, $z=1$ is a zero of $p(x)=x^3-6x^2+11x-6$. Write $p(x)=(x-1)q(x)$. (a) Give $q(x)$. (b) Give the degree of $q$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"function","vars":["x"]}},{"name":"b","contract":{"kind":"exact"}}]}
            answer: 'a = x^2-5x+6; b = 2'
            solution_sketch: 'Synthetic division of 1, -6, 11, -6 by the root 1 gives 1, -5, 6 and remainder 0. So q(x) = x^2 - 5x + 6. Its degree is 2, which is one less than the degree of p.'
          - problem: 'Take $p(x)=(x-2)^3(x+1)$ over the integers. (a) Give the multiplicity of the zero $2$. (b) Give the multiplicity of the zero $-1$. (c) Give the number of zeros of $p$ counted with multiplicity.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 3; b = 1; c = 4'
            solution_sketch: 'The factor (x - 2) appears 3 times, so the multiplicity of 2 is 3. The factor (x + 1) appears once, so the multiplicity of -1 is 1. The total is 3 + 1 = 4.'
          - problem: 'Take $p(x)=(x-1)^2(x+2)(x-5)$ over the integers. (a) Count the different zeros. (b) Count the zeros with multiplicity. (c) Give the degree of $p$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 3; b = 4; c = 4'
            solution_sketch: 'The zeros are 1, -2 and 5, so there are 3 different zeros. The zero 1 counts twice, so the count with multiplicity is 4. The degree is 2 + 1 + 1 = 4.'
          - problem: 'Solve the equation $ax+b=0$. (a) Give the solution of $3x+12=0$ in $\mathbb{Z}$. (b) Give the solution of $3x+1=0$ in $\mathbb{Z}_7$ as a number from $0$ to $6$. (c) Count the solutions of $2x+1=0$ in $\mathbb{Z}$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = -4; b = 2; c = 0'
            solution_sketch: 'For (a), 3x = -12, so x = -4. For (b), 3x = -1 = 6 in Z_7, and 3 * 2 = 6, so x = 2. For (c), 2x = -1 has no integer solution, so the count is 0.'
          - problem: 'A polynomial $g(x)=ax^2+bx+c$ with integer coefficients has the same value as $f(x)=3x^2+2x+1$ for every integer $x$. Give (a) $a$, (b) $b$ and (c) $c$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 3; b = 2; c = 1'
            solution_sketch: 'The difference f - g has infinitely many zeros in Z. By Corollary 4.59 it is the zero polynomial. So the coefficients agree: a = 3, b = 2 and c = 1.'
          - problem: 'Work in $\mathbb{Z}_6$, a ring with two nonzero elements whose product is $0$. Take $p(x)=x^2-x$. (a) Count the $x$ in $\{0,1,2,3,4,5\}$ with $p(x)=0$. (b) Give the degree of $p$. (c) Count the same zeros in $\mathbb{Z}_7$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 4; b = 2; c = 2'
            solution_sketch: 'In Z_6 the zeros of x^2 - x are 0, 1, 3 and 4, because 3 * 3 = 9 = 3 and 4 * 4 = 16 = 4. That is 4 zeros for a polynomial of degree 2. In Z_7 only 0 and 1 work, which is 2.'
          # source: FoM exercise 4.5-4-41
          - problem: 'Work in $\mathbb{Z}_7$. Take $f(x)=x^7$ and $g(x)=x$. (a) Give $f(3)$ as a number from $0$ to $6$. (b) Count the $x$ in $\{0,\dots,6\}$ with $f(x)=g(x)$. (c) Give 1 if $f$ and $g$ have the same coefficients and 0 if not.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 3; b = 7; c = 0'
            solution_sketch: 'By Fermat''s little theorem x^7 = x in Z_7 for every x, so f(3) = 3. All 7 values of x give equal results, so the count is 7. The coefficients differ, because f has degree 7 and g has degree 1, so the value is 0. Here Corollary 4.59 fails, since Z_7 is finite.'
          # argument: Theorem 4.56
          - problem: 'Prove: let $R$ be a commutative ring with unity and no zero divisors, let $p$ have degree $n>0$, and let $z$ be a zero of $p$. Then $p(x)=(x-z)q(x)$ for a polynomial $q$ of degree $n-1$.'
            answer_contract: {"kind":"written"}
            answer: 'Divide p by x - z. The remainder is a constant that equals p(z) = 0.'
            solution_sketch: 'Use Theorem 4.47 to write p(x) = (x - z)q(x) + r(x) with deg(r) < 1. So r is a constant c. Put x = z to get c = p(z) = 0. Hence p(x) = (x - z)q(x). The degree of q is n - 1 by the degree rules of Definition 4.46.'
          # argument: Theorem 4.58
          - problem: 'Prove: let $R$ be a commutative ring with unity and no zero divisors. A polynomial of degree $n\ge 1$ over $R$ has at most $n$ zeros, counted with multiplicity.'
            answer_contract: {"kind":"written"}
            answer: 'Use induction on n. A first-degree polynomial has one zero, and a zero z splits off the factor x - z.'
            solution_sketch: 'For n = 1, two solutions x and x^ of ax + b = 0 give a(x - x^) = 0, so x = x^. For the step, pick a zero z, so p(x) = q(x)(x - z). The multiplicity of z in p is one more than in q. The multiplicity of any other zero is the same in p and q. So the count for p is at most one more than the count for q, and q has degree n.'
          # argument: Corollary 4.59
          - problem: 'Prove: let $R$ be an infinite commutative ring with unity and no zero divisors. A polynomial of positive degree is not the zero function, so two polynomials are equal exactly when all their coefficients are equal.'
            answer_contract: {"kind":"written"}
            answer: 'A nonzero polynomial has finitely many zeros. An infinite ring has more elements than that, so the function is not zero.'
            solution_sketch: 'Suppose p has degree n > 0 and p(x) = 0 for all x. Take n + 1 different elements of R. All of them are zeros, which contradicts Theorem 4.58. So p is not the zero function. Apply this to f - g: the polynomials f and g are equal as functions exactly when every coefficient of f - g is 0.'
        constraints: 'Use integer or modular coefficients; compare the rings with and without zero divisors.'
