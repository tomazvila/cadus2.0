            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}}]}
            answer: 'a = 2; b = 2; c = 3; d = 1'
            solution_sketch: 'The number 8 is not a multiple of 6 but is a multiple of 4, so the index is 2. The number 20 is a multiple of 4 and not of 6, so the index is 2. The number 27 is only a multiple of 9, so the index is 3. The number 36 is a multiple of 6, so the index is 1.'
