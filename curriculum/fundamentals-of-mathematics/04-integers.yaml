    knowledge_points:
      - id: kp1
        name: 'Proposition 4.1: the relation on pairs of natural numbers'
        key_prerequisites: [fom-3-2-ordering-natural-numbers, fom-3-7-equivalence-relations]
        exemplars:
          - problem: 'For natural numbers, write $(a,b)\sim(c,d)$ when $a+d=b+c$. Give 1 when the relation holds and 0 when it does not. (a) $(3,1)\sim(5,3)$. (b) $(2,4)\sim(5,6)$. (c) $(7,2)\sim(6,1)$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 0; c = 1'
            solution_sketch: 'Test the equation $a+d=b+c$ for each pair. In (a), $3+3=6$ and $1+5=6$, so the value is 1. In (b), $2+6=8$ and $4+5=9$, so the value is 0. In (c), $7+1=8$ and $2+6=8$, so the value is 1.'
          - problem: 'For natural numbers, write $(a,b)\sim(c,d)$ when $a+d=b+c$. Give 1 when the relation holds and 0 when it does not. (a) $(5,5)\sim(2,2)$. (b) $(1,3)\sim(3,1)$. (c) $(2,6)\sim(1,5)$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 0; c = 1'
            solution_sketch: 'In (a), $5+2=7$ and $5+2=7$, so the value is 1. In (b), $1+1=2$ and $3+3=6$, so the value is 0. In (c), $2+5=7$ and $6+1=7$, so the value is 1.'
          - problem: 'For natural numbers, write $(a,b)\sim(c,d)$ when $a+d=b+c$. Find the natural number that makes the relation hold. (a) $(3,5)\sim(x,7)$. (b) $(y,4)\sim(9,2)$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}}]}
            answer: 'a = 5; b = 11'
            solution_sketch: 'In (a), the equation is $3+7=5+x$, so $x=5$. In (b), the equation is $y+2=4+9$, so $y=11$.'
          - problem: 'For natural numbers, write $(a,b)\sim(c,d)$ when $a+d=b+c$. Take $(9,4)$. (a) Find $d$ with $(9,4)\sim(8,d)$. (b) Find $c$ with $(9,4)\sim(c,1)$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}}]}
            answer: 'a = 3; b = 6'
            solution_sketch: 'In (a), the equation is $9+d=4+8$, so $d=3$. In (b), the equation is $9+1=4+c$, so $c=6$.'
          - problem: 'For natural numbers, write $(a,b)\sim(c,d)$ when $a+d=b+c$. Look at the pairs $(c,d)$ with $c$ and $d$ in $\{1,2,3,4,5,6\}$ and $(c,d)\sim(4,2)$. (a) Count these pairs. (b) Give the smallest value of $c$. (c) Give the largest value of $d$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 4; b = 3; c = 4'
            solution_sketch: 'The relation means $c+2=d+4$, so $c=d+2$. The pairs are $(3,1)$, $(4,2)$, $(5,3)$ and $(6,4)$. That gives 4 pairs, the smallest $c$ is 3 and the largest $d$ is 4.'
          - problem: 'For natural numbers, write $(a,b)\sim(c,d)$ when $a+d=b+c$. Take $(a,b)=(5,2)$, $(c,d)=(7,4)$ and $(e,f)=(10,7)$. Here $(a,b)\sim(c,d)$ and $(c,d)\sim(e,f)$. (a) Give the sum of the left sides $a+d$ and $c+f$. (b) Give the number $c+d$ that you cancel after you add the two equations. (c) Give $a+f$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 23; b = 11; c = 12'
            solution_sketch: 'The left sides are $a+d=9$ and $c+f=14$, and their sum is 23. The right sides $b+c=9$ and $d+e=14$ have the same sum. Cancel $c+d=11$ from both sides. Then $a+f=5+7=12$ and $b+e=2+10=12$.'
          # argument: Proposition 4.1
          - problem: 'Prove: the relation $\sim$ on pairs of natural numbers, defined by $(a,b)\sim(c,d)$ when $a+d=b+c$, is reflexive, symmetric and transitive.'
            answer_contract: {"kind":"written"}
            answer: 'Test the three laws with the defining equation. For transitivity add the two equations and cancel the common sum with Proposition 3.19.'
            solution_sketch: 'Reflexivity holds because $a+b=b+a$. Symmetry holds because $a+d=b+c$ is the same equation as $c+b=d+a$. For transitivity, start with $a+d=b+c$ and $c+f=d+e$ and add them. This gives $a+d+c+f=b+c+d+e$. Cancel $c+d$ with Proposition 3.19 to get $a+f=b+e$.'
          # source: FoM exercise 4.1-4-5
          - problem: 'Prove: if $(a,b)\sim(c,d)$ for natural numbers, then $a<b$ holds exactly when $c<d$ holds, $a=b$ holds exactly when $c=d$ holds, and $a>b$ holds exactly when $c>d$ holds.'
            answer_contract: {"kind":"written"}
            answer: 'Start with a+d=b+c. If a<b, then b+c=a+d<b+d, so c<d, and the other cases are the same.'
            solution_sketch: 'Use Proposition 4.1 for the symmetry of the relation, so one direction of each statement is enough. Assume $a+d=b+c$. If $a<b$, then $b+c=a+d<b+d$, and cancelling $b$ gives $c<d$. If $a=b$, then $c=d$ follows from cancelling. If $a>b$, then $b+c=a+d>b+d$ gives $c>d$.'
        constraints: 'Test pairs with the equation a+d=b+c; the items vary the pairs and keep the natural numbers 1, 2, 3.'
      - id: kp2
        name: 'Proposition 4.2 and Proposition 4.3: sum and product of classes are well-defined'
        key_prerequisites: [fom-3-2-ordering-natural-numbers]
        exemplars:
          - problem: 'The symbol $[(a,b)]$ is the class of $(a,b)$ under $\sim$. Addition is $[(a,b)]+[(c,d)]=[(a+c,b+d)]$ and multiplication is $[(a,b)]\cdot[(c,d)]=[(ac+bd,ad+bc)]$. Compute $[(3,1)]+[(2,5)]=[(p,q)]$. (a) Give $p$. (b) Give $q$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}}]}
            answer: 'a = 5; b = 6'
            solution_sketch: 'Add the classes entry by entry. The first entry is $3+2=5$ and the second entry is $1+5=6$. So the sum is $[(5,6)]$.'
          - problem: 'The symbol $[(a,b)]$ is the class of $(a,b)$ under $\sim$. Addition is $[(a,b)]+[(c,d)]=[(a+c,b+d)]$ and multiplication is $[(a,b)]\cdot[(c,d)]=[(ac+bd,ad+bc)]$. Compute $[(3,1)]\cdot[(2,5)]=[(p,q)]$. (a) Give $p=ac+bd$. (b) Give $q=ad+bc$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}}]}
            answer: 'a = 11; b = 17'
            solution_sketch: 'Here $a=3$, $b=1$, $c=2$ and $d=5$. Put these numbers in the product formula. The first entry is $p=ac+bd=6+5=11$. The second entry is $q=ad+bc=15+2=17$.'
          - problem: 'The symbol $[(a,b)]$ is the class of $(a,b)$ under $\sim$. Addition is $[(a,b)]+[(c,d)]=[(a+c,b+d)]$ and multiplication is $[(a,b)]\cdot[(c,d)]=[(ac+bd,ad+bc)]$. Compute $[(2,1)]\cdot[(3,3)]=[(p,q)]$. (a) Give $p$. (b) Give $q$. (c) Give 1 when $(p,q)\sim(1,1)$ and 0 otherwise.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 9; b = 9; c = 1'
            solution_sketch: 'Use the product formula with $a=2$, $b=1$, $c=3$ and $d=3$. Then $p=2\cdot 3+1\cdot 3=9$ and $q=2\cdot 3+1\cdot 3=9$. The pair $(9,9)$ has $9+1=9+1$, so it is related to $(1,1)$ and the value is 1.'
          - problem: 'For natural numbers, write $(a,b)\sim(c,d)$ when $a+d=b+c$. The symbol $[(a,b)]$ is the class of $(a,b)$ under $\sim$. Addition is $[(a,b)]+[(c,d)]=[(a+c,b+d)]$ and multiplication is $[(a,b)]\cdot[(c,d)]=[(ac+bd,ad+bc)]$. The integer value of $[(a,b)]$ is $a-b$. (a) Give the integer value of $[(7,3)]+[(2,9)]$. (b) Give the integer value of $[(7,3)]\cdot[(2,9)]$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}}]}
            answer: 'a = -3; b = -28'
            solution_sketch: 'The sum is $[(9,12)]$ and $9-12=-3$. The product is $[(14+27,63+6)]=[(41,69)]$ and $41-69=-28$. These values agree with $4+(-7)=-3$ and $4\cdot(-7)=-28$.'
          - problem: 'For natural numbers, write $(a,b)\sim(c,d)$ when $a+d=b+c$. Take $(5,2)\sim(7,4)$ and $(1,3)\sim(4,6)$. Name the pairs $(a,b)=(5,2)$, $(a'',b'')=(7,4)$, $(c,d)=(1,3)$ and $(c'',d'')=(4,6)$. (a) Give $a+c+b''+d''$. (b) Give $a''+c''+b+d$. (c) Give 1 when $(a+c,b+d)\sim(a''+c'',b''+d'')$ and 0 otherwise.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 16; b = 16; c = 1'
            solution_sketch: 'We get $a+c+b''+d''=5+1+4+6=16$ and $a''+c''+b+d=7+4+2+3=16$. The two sums are equal, so the sum pairs $(6,5)$ and $(11,10)$ are related and the value is 1.'
          - problem: 'For natural numbers, write $(a,b)\sim(c,d)$ when $a+d=b+c$. The symbol $[(a,b)]$ is the class of $(a,b)$ under $\sim$. Addition is $[(a,b)]+[(c,d)]=[(a+c,b+d)]$ and multiplication is $[(a,b)]\cdot[(c,d)]=[(ac+bd,ad+bc)]$. Take $(3,1)\sim(4,2)$ and $(2,5)\sim(3,6)$. (a) Give 1 when the sum pairs $(3+2,1+5)$ and $(4+3,2+6)$ are related and 0 otherwise. (b) Give 1 when the product pairs for $(3,1),(2,5)$ and for $(4,2),(3,6)$ are related and 0 otherwise. (c) Give the sum of the first entry of the product pair of $(3,1),(2,5)$ and the second entry of the product pair of $(4,2),(3,6)$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 1; c = 41'
            solution_sketch: 'The sum pairs are $(5,6)$ and $(7,8)$, and $5+8=13=6+7$. The product pairs are $(11,17)$ and $(24,30)$. Here $11+30=41$ and $17+24=41$, so the value in (b) is 1 and the common sum is 41.'
          # argument: Proposition 4.2
          - problem: 'Prove: the sum of two classes does not depend on the chosen pairs. That is, if $(a,b)\sim(a'',b'')$ and $(c,d)\sim(c'',d'')$, then $(a+c,b+d)\sim(a''+c'',b''+d'')$.'
            answer_contract: {"kind":"written"}
            answer: 'Add the two defining equations. Rearrange the sum with commutativity and associativity of addition.'
            solution_sketch: 'Use Proposition 4.1 for the relation. Assume $a+b''=a''+b$ and $c+d''=c''+d$. Add the two equations to get $(a+c)+(b''+d'')=(a''+c'')+(b+d)$. This is the defining equation for the pairs $(a+c,b+d)$ and $(a''+c'',b''+d'')$. Hence the sum does not depend on the chosen pairs.'
          # source: FoM exercise 4.1-4-1
          - problem: 'Prove the first step: if $a+b''=a''+b$ and $c+d''=c''+d$ for natural numbers, then $(a+c)+(b''+d'')=(a''+c'')+(b+d)$.'
            answer_contract: {"kind":"written"}
            answer: 'Add the two given equations and reorder the terms with commutativity and associativity of addition.'
            solution_sketch: 'Use Proposition 4.2 as the goal of this step. Write down the two given equations. Add the left sides and add the right sides. Reorder both sums to the form of the goal.'
          # argument: Proposition 4.3
          - problem: 'Prove: the product of two classes does not depend on the chosen pairs. That is, if $(a,b)\sim(a'',b'')$ and $(c,d)\sim(c'',d'')$, then $(ac+bd,ad+bc)\sim(a''c''+b''d'',a''d''+b''c'')$.'
            answer_contract: {"kind":"written"}
            answer: 'Add the term b''c to the goal. Replace a+b'' by a''+b and c+d'' by c''+d, then cancel b''c with Proposition 3.19.'
            solution_sketch: 'Use Proposition 4.1 for the relation. The goal is $ac+bd+a''d''+b''c''=a''c''+b''d''+ad+bc$. No two terms share a factor, so add $b''c$ to the left side. Replace $a+b''$ by $a''+b$ and $c+d''$ by $c''+d$ in several steps, and factor each time. At the end both sides hold $b''c$. Cancel $b''c$ with Proposition 3.19.'
        constraints: 'Compute sums and products of classes by the two formulas; the items vary the pairs.'
      - id: kp3
        name: 'Definition 4.4: the integers as classes of pairs'
        key_prerequisites: []
        exemplars:
          - problem: 'The symbol $[(a,b)]$ is the class of $(a,b)$ under $\sim$. Addition is $[(a,b)]+[(c,d)]=[(a+c,b+d)]$ and multiplication is $[(a,b)]\cdot[(c,d)]=[(ac+bd,ad+bc)]$. The zero class is $[(1,1)]$. Give 1 when the class is the zero class and 0 when it is not. (a) $[(4,4)]$. (b) $[(5,3)]$. (c) $[(6,6)]$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 0; c = 1'
            solution_sketch: 'A class $[(a,b)]$ is the zero class when $a=b$. Classes (a) and (c) have equal entries, so both get 1. Class (b) has the entries 5 and 3, so it gets 0.'
          - problem: 'The integer value of $[(a,b)]$ is $a-b$. Give the integer value of each class. (a) $[(8,3)]$. (b) $[(2,9)]$. (c) $[(6,6)]$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 5; b = -7; c = 0'
            solution_sketch: 'Subtract the second entry from the first entry. This gives $8-3=5$, $2-9=-7$ and $6-6=0$.'
          - problem: 'The symbol $[(a,b)]$ is the class of $(a,b)$ under $\sim$. Addition is $[(a,b)]+[(c,d)]=[(a+c,b+d)]$ and multiplication is $[(a,b)]\cdot[(c,d)]=[(ac+bd,ad+bc)]$. The opposite of $[(a,b)]$ is $[(b,a)]$. Take $x=[(7,3)]$. (a) Give the first entry of the pair of $-x$ when you write it as $[(b,a)]$. (b) Give the first entry of $x+(-x)$. (c) Give 1 when $x+(-x)$ is the zero class $[(1,1)]$ and 0 otherwise.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 3; b = 10; c = 1'
            solution_sketch: 'The opposite is $[(3,7)]$, so the first entry is 3. The sum is $[(7+3,3+7)]=[(10,10)]$, so its first entry is 10. The entries are equal, so the sum is the zero class and the value is 1.'
          - problem: 'The integer value of $[(a,b)]$ is $a-b$. The symbol $[(a,b)]$ is the class of $(a,b)$ under $\sim$. Addition is $[(a,b)]+[(c,d)]=[(a+c,b+d)]$ and multiplication is $[(a,b)]\cdot[(c,d)]=[(ac+bd,ad+bc)]$. Compute $[(3,1)]\cdot[(1,4)]=[(p,q)]$. (a) Give $p$. (b) Give $q$. (c) Give the integer value of the product.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 7; b = 13; c = -6'
            solution_sketch: 'Here $p=3\cdot 1+1\cdot 4=7$ and $q=3\cdot 4+1\cdot 1=13$. The integer value is $7-13=-6$, which equals $2\cdot(-3)$.'
          - problem: 'The symbol $[(a,b)]$ is the class of $(a,b)$ under $\sim$. Addition is $[(a,b)]+[(c,d)]=[(a+c,b+d)]$ and multiplication is $[(a,b)]\cdot[(c,d)]=[(ac+bd,ad+bc)]$. Take $x=[(4,1)]$ and $y=[(2,5)]$ and write $x\cdot y=[(p,q)]$. (a) Give $p$. (b) Give $q$. (c) Give 1 when $x\cdot y$ is the zero class and 0 otherwise.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 13; b = 22; c = 0'
            solution_sketch: 'Here $p=4\cdot 2+1\cdot 5=13$ and $q=4\cdot 5+1\cdot 2=22$. The entries differ, so the product is not the zero class and the value is 0.'
          - problem: 'The integer value of $[(a,b)]$ is $a-b$. Look at the classes $[(a,b)]$ with $a$ and $b$ in $\{1,2,3,4\}$. (a) Count the different integer values of these classes. (b) Count the pairs in $\{1,2,3,4\}\times\{1,2,3,4\}$ whose class has the integer value 2.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}}]}
            answer: 'a = 7; b = 2'
            solution_sketch: 'The value $a-b$ runs from $-3$ to $3$, which gives 7 values. The value 2 comes from $(3,1)$ and $(4,2)$, which gives 2 pairs.'
          # source: FoM exercise 4.1-4-3
          - problem: 'Prove: if $x$ and $y$ are integers (classes of pairs of natural numbers) and both differ from zero, then $x\cdot y$ differs from zero.'
            answer_contract: {"kind":"written"}
            answer: 'The zero class has two equal entries. Show that the entries of the product pair differ when the entries of both factors differ.'
            solution_sketch: 'Use Definition 4.4 for the product and the zero class $[(1,1)]$. Write $x=[(a,b)]$ and $y=[(c,d)]$ with $a\neq b$ and $c\neq d$. Assume $a>b$ and write $a=b+k$ with $k\geq 1$. If $ac+bd=ad+bc$, then cancelling terms gives $kc=kd$, so $c=d$. This is a contradiction, so the entries of the product differ. The case $a<b$ is the same.'
        constraints: 'Read the zero class, the integer value a-b and the sum and product of classes; the items vary the pairs.'
      - id: kp4
        name: 'Theorem 4.5: addition of integers'
        key_prerequisites: [fom-3-1-arithmetic-natural-numbers]
        exemplars:
          - problem: 'The symbol $[(a,b)]$ is the class of $(a,b)$ under $\sim$. Addition is $[(a,b)]+[(c,d)]=[(a+c,b+d)]$ and multiplication is $[(a,b)]\cdot[(c,d)]=[(ac+bd,ad+bc)]$. The zero class is $[(1,1)]$. Compute $[(6,2)]+[(1,1)]=[(p,q)]$. (a) Give $p$. (b) Give $q$. (c) Give 1 when $[(p,q)]=[(6,2)]$ and 0 otherwise.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 7; b = 3; c = 1'
            solution_sketch: 'Add entry by entry to get $[(7,3)]$. Test $7+2=9$ and $3+6=9$. The sums are equal, so the classes are equal and the value is 1.'
          - problem: 'The symbol $[(a,b)]$ is the class of $(a,b)$ under $\sim$. Addition is $[(a,b)]+[(c,d)]=[(a+c,b+d)]$ and multiplication is $[(a,b)]\cdot[(c,d)]=[(ac+bd,ad+bc)]$. Take $x=[(8,5)]$ and the opposite $-x=[(5,8)]$. (a) Give the first entry of $x+(-x)$. (b) Give the second entry of $x+(-x)$. (c) Give 1 when $x+(-x)$ is the zero class and 0 otherwise.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 13; b = 13; c = 1'
            solution_sketch: 'Add entry by entry to get $[(13,13)]$. Both entries are 13. Equal entries give the zero class, so the value is 1.'
          - problem: 'The integer value of $[(a,b)]$ is $a-b$. The symbol $[(a,b)]$ is the class of $(a,b)$ under $\sim$. Addition is $[(a,b)]+[(c,d)]=[(a+c,b+d)]$ and multiplication is $[(a,b)]\cdot[(c,d)]=[(ac+bd,ad+bc)]$. Take $x=[(4,9)]$ and $y=[(7,2)]$. (a) Give the integer value of $x$. (b) Give the integer value of $y$. (c) Give the integer value of $x+y$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = -5; b = 5; c = 0'
            solution_sketch: 'The values are $4-9=-5$ and $7-2=5$. The sum is $[(11,11)]$, so its value is $11-11=0$.'
          - problem: 'The symbol $[(a,b)]$ is the class of $(a,b)$ under $\sim$. Addition is $[(a,b)]+[(c,d)]=[(a+c,b+d)]$ and multiplication is $[(a,b)]\cdot[(c,d)]=[(ac+bd,ad+bc)]$. Take $x=[(1,2)]$, $y=[(3,1)]$ and $z=[(2,4)]$. Write $(x+y)+z=[(p,q)]$ and $x+(y+z)=[(r,s)]$ with the entries from the formula. (a) Give $p$. (b) Give $q$. (c) Give $r$. (d) Give $s$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}}]}
            answer: 'a = 6; b = 7; c = 6; d = 7'
            solution_sketch: 'First $x+y=[(4,3)]$, and then $(x+y)+z=[(6,7)]$. Also $y+z=[(5,5)]$, and then $x+(y+z)=[(6,7)]$. All four entries are as the key shows.'
          - problem: 'The symbol $[(a,b)]$ is the class of $(a,b)$ under $\sim$. Addition is $[(a,b)]+[(c,d)]=[(a+c,b+d)]$ and multiplication is $[(a,b)]\cdot[(c,d)]=[(ac+bd,ad+bc)]$. Take $[(5,3)]+[(2,d)]=[(1,1)]$ and $[(c,2)]+[(4,5)]=[(1,1)]$. (a) Find $d$. (b) Find $c$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}}]}
            answer: 'a = 4; b = 3'
            solution_sketch: 'The first sum is $[(7,3+d)]$. It is the zero class when $7=3+d$, so $d=4$. The second sum is $[(c+4,7)]$. It is the zero class when $c+4=7$, so $c=3$.'
          - problem: 'The integer value of $[(a,b)]$ is $a-b$. Look at the classes $[(a,b)]$ with $a$ and $b$ in $\{1,2,3,4,5\}$. (a) Count the pairs whose class is the opposite of $[(4,2)]$. (b) Give the first entry of the pair that you get when you write the opposite of $[(4,2)]$ as $[(b,a)]$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}}]}
            answer: 'a = 3; b = 2'
            solution_sketch: 'The opposite of $[(4,2)]$ is $[(2,4)]$ with the integer value $-2$. The pairs with $a-b=-2$ are $(1,3)$, $(2,4)$ and $(3,5)$, which gives 3 pairs. The first entry of $[(2,4)]$ is 2.'
          # source: FoM exercise 4.1-4-4
          - problem: 'Use the ordered pair $(a,b)=\{\{a\},\{a,b\}\}$. Treat each natural number as an object of level 0. Let $V_0=\mathbb{N}$ and $V_n=V_{n-1}\cup\mathcal{P}(V_{n-1})$. A function is the set of its pairs (input, output). The ordered triple $(A,B,C)$ is the pair $((A,B),C)$. An integer is a class of pairs from $\mathbb{N}\times\mathbb{N}$. Find the smallest $n$ so that the object is an element of $V_n$. (a) The set $\mathbb{Z}$ of integers. (b) The addition function on $\mathbb{Z}$. (c) The multiplication function on $\mathbb{Z}$. (d) The triple $(\mathbb{Z},+,\cdot)$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}}]}
            answer: 'a = 4; b = 8; c = 8; d = 12'
            solution_sketch: 'A set that holds objects of level at most $m$, and one of level $m$, has level $m+1$. A pair of naturals has level 2, a class has level 3, and $\mathbb{Z}$ has level 4. A pair $((x,y),z)$ has level 7, so the addition set and the multiplication set have level 8. The pair $(\mathbb{Z},+)$ has level 10, and the triple has level 12.'
          # argument: Theorem 4.5
          - problem: 'Prove the first step: addition of integers is associative and commutative.'
            answer_contract: {"kind":"written"}
            answer: 'Add entry by entry. Then use associativity and commutativity of addition of natural numbers.'
            solution_sketch: 'Use Definition 4.4 for the sum of classes. For associativity, write $x=[(a,b)]$, $y=[(c,d)]$ and $z=[(e,f)]$. Both $(x+y)+z$ and $x+(y+z)$ equal $[(a+c+e,b+d+f)]$ by associativity of natural numbers. For commutativity, $[(a+c,b+d)]=[(c+a,d+b)]$ by commutativity of natural numbers.'
          # argument: Theorem 4.5
          - problem: 'Prove the second step: the class $[(1,1)]$ is a neutral element for addition of integers, and every class $[(a,b)]$ has the opposite $[(b,a)]$.'
            answer_contract: {"kind":"written"}
            answer: 'Compute the sums entry by entry. Show that the sum with the zero class changes nothing and that the opposite gives two equal entries.'
            solution_sketch: 'Use Definition 4.4 for the sum of classes. The sum $[(a,b)]+[(1,1)]$ equals $[(a+1,b+1)]$. This class equals $[(a,b)]$ because $(a+1)+b=(b+1)+a$. The sum $[(a,b)]+[(b,a)]$ equals $[(a+b,b+a)]$, which equals $[(1,1)]$ because the entries are equal.'
        constraints: 'Use the neutral class, the opposite class and the order of addition; the items vary the classes.'
      - id: kp5
        name: 'Theorem 4.6: multiplication of integers'
        key_prerequisites: [fom-3-1-arithmetic-natural-numbers]
        exemplars:
          - problem: 'The symbol $[(a,b)]$ is the class of $(a,b)$ under $\sim$. Addition is $[(a,b)]+[(c,d)]=[(a+c,b+d)]$ and multiplication is $[(a,b)]\cdot[(c,d)]=[(ac+bd,ad+bc)]$. The class $[(2,1)]$ is the candidate for the number 1. Compute $[(2,1)]\cdot[(4,3)]=[(p,q)]$. (a) Give $p$. (b) Give $q$. (c) Give 1 when $[(p,q)]=[(4,3)]$ and 0 otherwise.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 11; b = 10; c = 1'
            solution_sketch: 'Here $p=2\cdot 4+1\cdot 3=11$ and $q=2\cdot 3+1\cdot 4=10$. Test $11+3=14$ and $10+4=14$. The sums are equal, so the value is 1.'
          - problem: 'The symbol $[(a,b)]$ is the class of $(a,b)$ under $\sim$. Addition is $[(a,b)]+[(c,d)]=[(a+c,b+d)]$ and multiplication is $[(a,b)]\cdot[(c,d)]=[(ac+bd,ad+bc)]$. Compute $[(2,1)]\cdot[(2,1)]=[(p,q)]$. (a) Give $p$. (b) Give $q$. (c) Give 1 when $[(p,q)]=[(2,1)]$ and 0 otherwise.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 5; b = 4; c = 1'
            solution_sketch: 'Here $p=4+1=5$ and $q=2+2=4$. Test $5+1=6$ and $4+2=6$. The sums are equal, so the value is 1.'
          - problem: 'The symbol $[(a,b)]$ is the class of $(a,b)$ under $\sim$. Addition is $[(a,b)]+[(c,d)]=[(a+c,b+d)]$ and multiplication is $[(a,b)]\cdot[(c,d)]=[(ac+bd,ad+bc)]$. Take $x=[(3,1)]$ and $y=[(2,5)]$. (a) Give the first entry of $x\cdot y$. (b) Give the second entry of $x\cdot y$. (c) Give the first entry of $y\cdot x$. (d) Give the second entry of $y\cdot x$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}}]}
            answer: 'a = 11; b = 17; c = 11; d = 17'
            solution_sketch: 'For $x\cdot y$ the entries are $6+5=11$ and $15+2=17$. For $y\cdot x$ the entries are $2\cdot 3+5\cdot 1=11$ and $2\cdot 1+5\cdot 3=17$. The two products have the same entries.'
          - problem: 'The symbol $[(a,b)]$ is the class of $(a,b)$ under $\sim$. Addition is $[(a,b)]+[(c,d)]=[(a+c,b+d)]$ and multiplication is $[(a,b)]\cdot[(c,d)]=[(ac+bd,ad+bc)]$. Give 1 when the statement holds for all integers $x,y,z$ and 0 when it does not. (a) $(x+y)\cdot z=x\cdot z+y\cdot z$. (b) $x\cdot(y+z)=x\cdot y+z$. (c) $x\cdot(y\cdot z)=(x\cdot y)\cdot z$. (d) $[(2,1)]\cdot x=x$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 0; c = 1; d = 1'
            solution_sketch: 'Statements (a), (c) and (d) are the laws of Theorem 4.6, so each gets 1. Statement (b) fails for the values 2, 1 and 1. There $x\cdot(y+z)=4$ and $x\cdot y+z=3$, so (b) gets 0.'
          - problem: 'The integer value of $[(a,b)]$ is $a-b$. The symbol $[(a,b)]$ is the class of $(a,b)$ under $\sim$. Addition is $[(a,b)]+[(c,d)]=[(a+c,b+d)]$ and multiplication is $[(a,b)]\cdot[(c,d)]=[(ac+bd,ad+bc)]$. Take $x=[(4,1)]$, $y=[(1,3)]$ and $z=[(2,5)]$. Write $x\cdot y=[(p,q)]$. (a) Give $p$. (b) Give $q$. (c) Give the integer value of $(x\cdot y)\cdot z$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 7; b = 13; c = 18'
            solution_sketch: 'Here $p=4\cdot 1+1\cdot 3=7$ and $q=4\cdot 3+1\cdot 1=13$. Then $(x\cdot y)\cdot z=[(14+65,35+26)]=[(79,61)]$, and $79-61=18$. This equals $(-6)\cdot(-3)$.'
          - problem: 'The symbol $[(a,b)]$ is the class of $(a,b)$ under $\sim$. Addition is $[(a,b)]+[(c,d)]=[(a+c,b+d)]$ and multiplication is $[(a,b)]\cdot[(c,d)]=[(ac+bd,ad+bc)]$. Take $x=[(3,1)]$, $y=[(2,1)]$ and $z=[(1,3)]$. (a) Give the first entry of $x\cdot y$. (b) Give the first entry of $x\cdot z$. (c) Give the first entry of $x\cdot y+x\cdot z$. (d) Give 1 when $x\cdot(y+z)$ is the same class as $x\cdot y+x\cdot z$ and 0 otherwise.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}}]}
            answer: 'a = 7; b = 6; c = 13; d = 1'
            solution_sketch: 'We get $x\cdot y=[(7,5)]$ and $x\cdot z=[(6,10)]$, so the sum is $[(13,15)]$. Also $y+z=[(3,4)]$ and $x\cdot[(3,4)]=[(13,15)]$. The two classes are equal, so the value in (d) is 1.'
          # argument: Theorem 4.6
          - problem: 'Prove: multiplication of integers is commutative and has the neutral element $[(2,1)]$.'
            answer_contract: {"kind":"written"}
            answer: 'Write both products as pairs and compare entries. Use the laws of natural numbers.'
            solution_sketch: 'Use Definition 4.4 for the product of classes. For commutativity, $[(ac+bd,ad+bc)]$ and $[(ca+db,cb+da)]$ have equal entries by the laws of natural numbers. For the neutral element, $[(2,1)]\cdot[(c,d)]=[(2c+d,2d+c)]$. Now $(2c+d)+d=(2d+c)+c$, so this class equals $[(c,d)]$.'
          # argument: Theorem 4.6
          - problem: 'Prove: multiplication of integers is associative and distributes over addition.'
            answer_contract: {"kind":"written"}
            answer: 'Expand the products of the pairs and compare the entries. Use the laws of natural numbers.'
            solution_sketch: 'Use Definition 4.4 for the sum and the product of classes. Write the three classes as pairs. For associativity, expand $(x\cdot y)\cdot z$ and $x\cdot(y\cdot z)$ and see that the entries agree. For distributivity, expand $x\cdot(y+z)$ and $x\cdot y+x\cdot z$ and see that the entries agree.'
          # source: FoM exercise 4.1-4-2
          - problem: 'Prove four laws for integers. (a) Multiplication is associative. (b) Multiplication distributes over addition. (c) The class $[(2,1)]$ is a neutral element for multiplication. (d) Multiplication is commutative.'
            answer_contract: {"kind":"written"}
            answer: 'For each law, write both sides as classes of pairs. Compare the entries with the laws of natural numbers.'
            solution_sketch: 'Use Theorem 4.6 as the statement. For (a), expand both products and compare entries. For (b), expand both sides and compare entries. For (c), compute $[(2,1)]\cdot[(c,d)]=[(2c+d,2d+c)]$ and test the equation of $\sim$. For (d), swap the factors and see that the entries agree.'
        constraints: 'Multiply classes and test the laws of multiplication; the items vary the classes.'
