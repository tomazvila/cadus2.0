      - id: kp1
        name: 'Definition 4.23 and Example 4.24: the positive cone of an ordered ring'
        key_prerequisites: [fom-4-3-finding-natural-numbers-integers]
        exemplars:
          - problem: 'Take the ring $\mathbb{Z}$ with the positive cone $\mathbb{N}_0$. For each integer, give 1 if it lies in the cone and 0 if not. (a) $0$. (b) $5$. (c) $-3$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 1; c = 0'
            solution_sketch: 'The cone $\mathbb{N}_0$ holds all integers from $0$ upward. So $0$ and $5$ lie in it and get 1. The number $-3$ lies below $0$, so it gets 0.'
          - problem: 'Take the ring $\mathbb{Z}$ with the positive cone $\mathbb{N}_0$. A nonzero element is positive when it lies in the cone. An element $x$ is negative when $-x$ lies in the cone and $x\ne0$. Look at the integers from $-3$ to $3$. (a) Count the positive ones. (b) Count the negative ones. (c) Count the nonnegative ones.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 3; b = 3; c = 4'
            solution_sketch: 'The positive integers in the range are $1$, $2$ and $3$, so (a) is 3. The negative ones are $-1$, $-2$ and $-3$, so (b) is 3. The nonnegative ones are $0$, $1$, $2$ and $3$, so (c) is 4.'
          - problem: 'In the ring $\mathbb{Z}$ with the positive cone $\mathbb{N}_0$, let $x=-4$ and $y=7$. (a) Give $x+y$. (b) Give $xy$. (c) Give 1 if $-xy$ lies in the cone and 0 if not.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 3; b = -28; c = 1'
            solution_sketch: 'The sum is $-4+7=3$. The product is $-4\cdot7=-28$. Then $-xy=28$ lies in $\mathbb{N}_0$, so (c) is 1.'
          - problem: 'Let $S$ be the set of all integers $x$ with $x\ge-2$. Test $S$ as a possible positive cone of $\mathbb{Z}$. (a) Give the smallest sum $x+y$ with $x,y\in S$. (b) Give 1 if $S$ is closed under addition and 0 if not. (c) Give 1 if both $2$ and $-2$ lie in $S$ and 0 if not.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = -4; b = 0; c = 1'
            solution_sketch: 'The smallest element of $S$ is $-2$, so the smallest sum is $-4$. That sum is below $-2$, so $S$ is not closed under addition and (b) is 0. Both $2$ and $-2$ are at least $-2$, so (c) is 1. Condition 3 of Definition 4.23 fails.'
          - problem: 'Take the ring of all functions from $\mathbb{Z}$ to $\mathbb{Z}$. Its positive cone holds the functions $f$ with $f(x)\ge0$ for every integer $x$. For each function, give 1 if it lies in the cone and 0 if not. (a) $f(x)=x^2+1$. (b) $h(x)=x-2$. (c) $-h$, the function with value $2-x$ at $x$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 0; c = 0'
            solution_sketch: 'The function $x^2+1$ has only positive values, so (a) is 1. The function $h$ has the value $-2$ at $x=0$, so (b) is 0. The function $-h$ has the value $-1$ at $x=3$, so (c) is 0.'
          - problem: 'Take the ring $\mathbb{Z}\times\mathbb{Z}$ with componentwise sum. Its positive cone holds the pairs $(a,b)$ with $a>0$, or with $a=0$ and $b\ge0$. For each pair, give 1 if it lies in the cone and 0 if not. (a) $(0,5)$. (b) $(0,-1)$. (c) $(-1,10)$. (d) $(2,-7)$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 0; c = 0; d = 1'
            solution_sketch: 'The pair $(0,5)$ has first entry $0$ and second entry at least $0$, so (a) is 1. The pair $(0,-1)$ has a negative second entry, so (b) is 0. The pair $(-1,10)$ has a negative first entry, so (c) is 0. The pair $(2,-7)$ has a positive first entry, so (d) is 1.'
          # source: FoM exercise 4.4-4-25
          - problem: 'Prove: in the ring of all functions from $\mathbb{Z}$ to $\mathbb{Z}$, the set of functions with no negative value meets the three conditions of a positive cone.'
            answer_contract: {"kind":"written"}
            answer: 'Check the conditions value by value. Sums and products of nonnegative values stay nonnegative, zero is in, and f and -f both in the set force f = 0.'
            solution_sketch: 'Use Definition 4.23. A sum or product of two functions with no negative value has no negative value, so condition 1 holds. The zero function has no negative value, so condition 2 holds. Let $f$ and $-f$ both lie in the set. Then $f(x)\ge0$ and $-f(x)\ge0$ for each $x$, so $f(x)=0$. Hence only the zero function has both, and condition 3 holds.'
        constraints: 'test whether an element lies in a cone; the cones of the integers, of the function ring and of the pair ring'
      - id: kp2
        name: 'Definition 4.25 to Lemma 4.27: the order from the positive cone'
        key_prerequisites: []
        exemplars:
          - problem: 'In the ring $\mathbb{Z}$ with the positive cone $\mathbb{N}_0$, put $x\le y$ when $y-x$ lies in the cone. Let $x=3$ and $y=11$. (a) Give $y-x$. (b) Give 1 if $x\le y$ and 0 if not. (c) Give 1 if $y\le x$ and 0 if not.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 8; b = 1; c = 0'
            solution_sketch: 'The difference is $11-3=8$. It lies in $\mathbb{N}_0$, so $3\le11$ and (b) is 1. For the reverse order the difference is $3-11=-8$, which lies outside the cone, so (c) is 0.'
          - problem: 'Use the order of $\mathbb{Z}$ from the cone $\mathbb{N}_0$. Let $x=-5$ and $y=-2$. (a) Give $y-x$. (b) Give 1 if $x\le y$ and 0 if not. (c) Give the least integer $y$ with $y-(-4)$ in the cone.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 3; b = 1; c = -4'
            solution_sketch: 'The difference is $-2-(-5)=3$, so (a) is 3. It lies in the cone, so $x\le y$ and (b) is 1. The difference $y+4$ lies in the cone exactly when $y\ge-4$, so the least such $y$ is $-4$.'
          - problem: 'Take the ring $\mathbb{Z}$ with the cone $\mathbb{N}_0$ and the order from the cone. Let $a=7$. (a) Give $a-a$. (b) Give 1 if $0$ lies in the cone and 0 if not. (c) Give 1 if $a\le a$ and 0 if not.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 0; b = 1; c = 1'
            solution_sketch: 'The difference $7-7$ is $0$. The element $0$ lies in the cone by condition 2, so (b) is 1. Then $7\le7$ holds and (c) is 1. This is reflexivity.'
          - problem: 'Use the order of $\mathbb{Z}$ from the cone $\mathbb{N}_0$. Let $x=2$, $y=9$ and $z=20$. (a) Give $y-x$. (b) Give $z-y$. (c) Give $z-x$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 7; b = 11; c = 18'
            solution_sketch: 'The first difference is $9-2=7$ and the second is $20-9=11$. Their sum is $18$, and this equals $z-x=20-2$. Both differences lie in the cone, so the sum lies in it too. This is transitivity.'
          - problem: 'Take the ring of functions from $\mathbb{Z}$ to $\mathbb{Z}$ with the cone of functions that have no negative value. Put $f\le g$ when $g-f$ lies in the cone. Let $f(x)=x$, $g(x)=x+3$ and $h(x)=2x$. For each pair, give 1 if the order holds and 0 if not. (a) $f\le g$. (b) $f\le h$. (c) $h\le f$. (d) $g\le h$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 0; c = 0; d = 0'
            solution_sketch: 'The function $g-f$ has the constant value $3$, so (a) is 1. The function $h-f$ has the value $-1$ at $x=-1$, so (b) is 0. The function $f-h$ has the value $-1$ at $x=1$, so (c) is 0. The function $h-g$ has the value $-3$ at $x=0$, so (d) is 0.'
          - problem: 'Take the ring $\mathbb{Z}\times\mathbb{Z}$ with componentwise sum and the cone of pairs $(a,b)$ with $a>0$, or with $a=0$ and $b\ge0$. Put $u\le v$ when $v-u$ lies in the cone. For each statement, give 1 if it holds and 0 if not. (a) $(0,0)\le(0,3)$. (b) $(0,0)\le(-1,100)$. (c) $(-1,5)\le(0,-5)$. (d) $(1,-100)\ge(0,0)$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 0; c = 1; d = 1'
            solution_sketch: 'By Lemma 4.27, $u\ge0$ means $u$ lies in the cone. The pair $(0,3)$ lies in the cone, so (a) is 1. The pair $(-1,100)$ does not, so (b) is 0. The difference $(0,-5)-(-1,5)=(1,-10)$ has a positive first entry, so (c) is 1. The pair $(1,-100)$ lies in the cone, so (d) is 1.'
          - problem: 'Take the ring $\mathbb{Z}\times\mathbb{Z}$ with the cone of pairs $(a,b)$ where $a>0$, or where $a=0$ and $b\ge0$. Put $u\le v$ when $v-u$ lies in the cone. Look at the three elements $a=(0,0)$, $b=(0,1)$ and $c=(1,0)$. (a) Count the ordered pairs $(u,v)$ of different elements with $u\le v$. (b) Count the ordered pairs $(u,v)$, equal or different, with $u\le v$. (c) Give 1 if some pair of different elements has $u\le v$ and $v\le u$, and 0 if not.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 3; b = 6; c = 0'
            solution_sketch: 'The differences $b-a=(0,1)$, $c-a=(1,0)$ and $c-b=(1,-1)$ all lie in the cone. So $a\le b$, $a\le c$ and $b\le c$, which gives 3 pairs of different elements. Add the 3 pairs $u=v$ to get 6. No pair of different elements holds in both orders, so (c) is 0 by antisymmetry.'
          # argument: Theorem 4.26
          - problem: 'Prove: let $R$ be an ordered ring with positive cone $R^+$, and put $x\le y$ when $y-x\in R^+$. Then $\le$ is reflexive, antisymmetric and transitive.'
            answer_contract: {"kind":"written"}
            answer: 'Reflexivity holds because 0 is in the cone. Antisymmetry uses condition 3, and transitivity adds the differences y-x and z-y.'
            solution_sketch: 'Use Definition 4.25. For reflexivity, $x-x=0$ lies in $R^+$ by condition 2 of Definition 4.23. For antisymmetry, let $x\le y$ and $y\le x$ with $x\ne y$. Then $y-x$ and $x-y=-(y-x)$ both lie in $R^+$, which breaks condition 3 of Definition 4.23. For transitivity, add $y-x\in R^+$ and $z-y\in R^+$ to get $z-x\in R^+$ by condition 1.'
          # argument: Lemma 4.27
          - problem: 'Prove: in an ordered ring with positive cone $R^+$, an element $x$ lies in $R^+$ if and only if $x\ge0$.'
            answer_contract: {"kind":"written"}
            answer: 'Since x - 0 = x, the statement that x is in the cone is the same as 0 <= x by the definition of the order.'
            solution_sketch: 'The definition of the order gives $0\le x$ exactly when $x-0\in R^+$. The difference $x-0$ equals $x$. So $x\in R^+$ holds exactly when $0\le x$, which is the same as $x\ge0$.'
          # source: FoM exercise 4.4-4-27
          - problem: 'Prove: in the ring of functions from $\mathbb{Z}$ to $\mathbb{Z}$, there are two functions $f$ and $g$, both different from the zero function, with $fg$ equal to the zero function.'
            answer_contract: {"kind":"written"}
            answer: 'Let f be nonzero only at 0 and let g be zero at 0 and nonzero elsewhere. Then fg is zero at every argument.'
            solution_sketch: 'Define $f(0)=1$ and $f(x)=0$ for $x\ne0$. Define $g(0)=0$ and $g(x)=1$ for $x\ne0$. Both functions differ from the zero function. At $x=0$ the product is $1\cdot0=0$. At $x\ne0$ the product is $0\cdot1=0$. Hence $fg$ is the zero function.'
          # source: FoM exercise 4.4-4-28
          - problem: 'Prove two facts. (a) The set $\mathbb{N}_0$ is a positive cone of the ring $(\mathbb{Z},+,\odot)$ with $x\odot y=0$ for all $x,y$, and this ring is totally ordered. (b) The set of pairs $(a,b)$ with $a>0$, or $a=0$ and $b\ge0$, is a positive cone of the ring $(\mathbb{Z}\times\mathbb{Z},+,\odot)$ with $(a,b)\odot(c,d)=(ac,0)$, and this ring is totally ordered.'
            answer_contract: {"kind":"written"}
            answer: 'Check the three cone conditions directly. Then use the total order criterion of Theorem 4.28: each nonzero element or its opposite is in the cone.'
            solution_sketch: 'Use Definition 4.23 and Theorem 4.28. In (a), sums stay in $\mathbb{N}_0$, every product is $0\in\mathbb{N}_0$, and $x$ and $-x$ are not both in $\mathbb{N}_0$ for $x\ne0$. Each nonzero integer or its opposite is in $\mathbb{N}_0$, so the ring is totally ordered. In (b), sums of pairs in the cone stay in it. A product is $(ac,0)$, and $ac>0$ or $ac=0$ keeps it in the cone. For a nonzero pair, either it or its opposite has a positive first entry, or a zero first entry and a positive second entry.'
        constraints: 'compute differences y-x and decide the order x<=y; reflexive, antisymmetric and transitive steps'
      - id: kp3
        name: 'Theorem 4.28 to Proposition 4.31: totally ordered rings and the sign of the unity'
        key_prerequisites: [fom-4-3-finding-natural-numbers-integers]
        exemplars:
          - problem: 'Take the ring of functions from $\mathbb{Z}$ to $\mathbb{Z}$ with the cone of functions that have no negative value. Let $f(x)=x^2-4$. (a) Give 1 if $f$ lies in the cone and 0 if not. (b) Give 1 if $-f$ lies in the cone and 0 if not. (c) Give 1 if every nonzero element has itself or its opposite in the cone, and 0 if not.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 0; b = 0; c = 0'
            solution_sketch: 'The function $f$ has the value $-4$ at $x=0$, so (a) is 0. The function $-f$ has the value $-5$ at $x=3$, so (b) is 0. So $f$ is a nonzero element with neither $f$ nor $-f$ in the cone, and (c) is 0. The order is not total by Theorem 4.28.'
          - problem: 'Take the ring $\mathbb{Z}$ with the cone $\mathbb{N}_0$ and the order from the cone. Look at the pairs $(x,y)$ with $x,y\in\{1,2,3\}$. (a) Count the pairs with $x\le y$. (b) Count the pairs with neither $x\le y$ nor $y\le x$. (c) Count the pairs with $x<y$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 6; b = 0; c = 3'
            solution_sketch: 'The pairs with $x\le y$ are $(1,1)$, $(1,2)$, $(1,3)$, $(2,2)$, $(2,3)$ and $(3,3)$, so (a) is 6. Any two integers compare, so (b) is 0. The pairs with $x<y$ are $(1,2)$, $(1,3)$ and $(2,3)$, so (c) is 3.'
          - problem: 'In the ring $\mathbb{Z}$ with the cone $\mathbb{N}_0$, look at the nonzero integers from $-3$ to $3$. (a) Count the integers $x$ in the cone. (b) Count the integers $x$ with $-x$ in the cone. (c) Count the integers $x$ with both $x$ and $-x$ in the cone.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 3; b = 3; c = 0'
            solution_sketch: 'The nonzero integers in the range are $\pm1$, $\pm2$ and $\pm3$. The integers $1$, $2$, $3$ lie in the cone, so (a) is 3. The integers $-1$, $-2$, $-3$ have their opposite in the cone, so (b) is 3. No nonzero integer has both, so (c) is 0. Each one has exactly one, so the order is total.'
          - problem: 'Let $C$ be the set of even integers that are at least $0$. This set is a positive cone of $\mathbb{Z}$. Put $x\le y$ when $y-x\in C$. (a) Give 1 if $3\le5$ and 0 if not. (b) Give 1 if $3\le6$ and 0 if not. (c) Give 1 if the order is total and 0 if not. (d) Give the least positive integer $x$ with neither $x$ nor $-x$ in $C$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 0; c = 0; d = 1'
            solution_sketch: 'The difference $5-3=2$ is even and at least $0$, so (a) is 1. The difference $6-3=3$ is odd, so (b) is 0. Then $3$ and $-3$ are both outside $C$, so the order is not total and (c) is 0. The number $1$ is odd, so neither $1$ nor $-1$ lies in $C$, and (d) is 1.'
          - problem: 'The ring $\mathbb{Z}$ with the cone $\mathbb{N}_0$ has the unity $1$. (a) Give 1 if $1$ lies in the cone and 0 if not. (b) Give 1 if $-1$ lies in the cone and 0 if not. (c) Give the product $(-1)(-1)$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 0; c = 1'
            solution_sketch: 'The number $1$ is at least $0$, so (a) is 1. The number $-1$ is below $0$, so (b) is 0. The product $(-1)(-1)$ equals $1$. A cone with $-1$ holds $1=(-1)(-1)$ as well, and condition 3 then fails. So $-1<0$ and $1>0$.'
          - problem: 'Let $C$ be a set of integers that is closed under multiplication and holds $-1$. (a) Give the product $(-1)(-1)$. (b) Give 1 if both $1$ and $-1$ lie in $C$ and 0 if not. (c) Give the sum $1+(-1)$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 1; c = 0'
            solution_sketch: 'The product $(-1)(-1)$ is $1$, and $C$ is closed under multiplication, so $1\in C$. So both $1$ and $-1$ lie in $C$ and (b) is 1. Their sum is $0$. A positive cone holds at most one of $x$ and $-x$ for nonzero $x$, so $C$ is not a positive cone.'
          # argument: Theorem 4.28
          - problem: 'Prove the first direction of this statement. In an ordered ring with positive cone $R^+$, if the order $\le$ is total, then each nonzero $x$ has $x\in R^+$ or $-x\in R^+$.'
            answer_contract: {"kind":"written"}
            answer: 'Totality gives 0 <= x or x <= 0. By the definition of the order, these two cases read x in the cone or -x in the cone.'
            solution_sketch: 'Let $x\ne0$. By totality, $0\le x$ or $x\le0$. By Definition 4.25, $0\le x$ means $x-0=x\in R^+$. Also by Definition 4.25, $x\le0$ means $0-x=-x\in R^+$. So $x\in R^+$ or $-x\in R^+$.'
          # argument: Theorem 4.28
          - problem: 'Prove the second direction of this statement. In an ordered ring with positive cone $R^+$, if each nonzero $x$ has $x\in R^+$ or $-x\in R^+$, then the order $\le$ is total.'
            answer_contract: {"kind":"written"}
            answer: 'For different x and y, apply the assumption to y - x. Either y - x is in the cone, so x <= y, or x - y is in the cone, so y <= x.'
            solution_sketch: 'Let $x,y\in R$. If $x=y$, then $x\le y$ holds. Let $x\ne y$. Then $y-x\ne0$, so $y-x\in R^+$ or $x-y\in R^+$. By Definition 4.25, the first case gives $x\le y$ and the second case gives $y\le x$. So any two elements compare.'
          # argument: Corollary 4.30
          - problem: 'Prove: the integers with the positive cone $\mathbb{N}_0$ form a totally ordered ring.'
            answer_contract: {"kind":"written"}
            answer: 'Theorem 4.21 gives the cone properties of the natural numbers with zero. Theorem 4.28 gives totality, as each integer or its opposite lies there.'
            solution_sketch: 'Theorem 4.21 gives that $\mathbb{N}_0$ is closed under sum and product, holds $0$, and holds at most one of $x$ and $-x$ for $x\ne0$. So $\mathbb{Z}$ is an ordered ring. Each nonzero integer $x$ is positive or negative, so $x\in\mathbb{N}_0$ or $-x\in\mathbb{N}_0$. Theorem 4.28 now gives that the order is total.'
          # argument: Proposition 4.31
          - problem: 'Prove: in a totally ordered ring with unity $1\ne0$, $-1<0$ and $1>0$.'
            answer_contract: {"kind":"written"}
            answer: 'A cone with -1 in it holds 1 = (-1)(-1) as well, which breaks condition 3. So -1 < 0, and totality gives 1 > 0.'
            solution_sketch: 'Assume $-1\ge0$. Because $-1\ne0$, this means $-1\in R^+$. Then $1=(-1)(-1)\in R^+$ by condition 1 of Definition 4.23. Now $1$ and $-1$ both lie in $R^+$, which breaks condition 3 of Definition 4.23. So $-1<0$. Theorem 4.28 then gives $1\in R^+$, so $1>0$.'
        constraints: 'decide totality by testing x and -x against the cone; the unity is positive'
      - id: kp4
        name: 'Proposition 4.32: differences in the ring of residue classes'
        key_prerequisites: [fom-4-2-groups-rings]
        exemplars:
          - problem: 'In $\mathbb{Z}_7$, let $[a]=[3]$ and $[b]=[5]$. Give each answer as a number from $0$ to $6$. (a) Give $d$ with $[3]+[d]=[5]$. (b) Give $f$ with $[5]+[f]=[3]$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}}]}
            answer: 'a = 2; b = 5'
            solution_sketch: 'The class $[d]$ is $5-3=2$ modulo $7$, so (a) is 2. The class $[f]$ is $3-5=-2$, which is $5$ modulo $7$, so (b) is 5. Check: $3+2=5$ and $5+5=10\equiv3$.'
          - problem: 'In $\mathbb{Z}_{12}$, let $[a]=[9]$ and $[b]=[4]$. Give each answer as a number from $0$ to $11$. (a) Give $d$ with $[9]+[d]=[4]$. (b) Give $f$ with $[4]+[f]=[9]$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}}]}
            answer: 'a = 7; b = 5'
            solution_sketch: 'The class $[d]$ is $4-9=-5$, which is $7$ modulo $12$. So (a) is 7. The class $[f]$ is $9-4=5$, so (b) is 5. Check: $9+7=16\equiv4$ and $4+5=9$.'
          - problem: 'In $\mathbb{Z}_{10}$, let $[a]=[b]=[8]$. Give each answer as a number from $0$ to $9$. (a) Give $d$ with $[8]+[d]=[8]$. (b) Give $f$ with $[8]+[f]=[8]$. (c) Give $a''$ with $[8]+[a'']=[0]$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 0; b = 0; c = 2'
            solution_sketch: 'Adding $[0]$ does not change a class, so (a) and (b) are 0. The class $[a'']$ is $-8$, which is $2$ modulo $10$, so (c) is 2. Check: $8+2=10\equiv0$.'
          - problem: 'In $\mathbb{Z}_9$, let $[a]=[4]$ and $[b]=[7]$. Give each answer as a number from $0$ to $8$. (a) Give $a''$ with $[4]+[a'']=[0]$. (b) Give $b''$ with $[7]+[b'']=[0]$. (c) Give $d=a''+b$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 5; b = 2; c = 3'
            solution_sketch: 'The opposite of $4$ modulo $9$ is $5$, so (a) is 5. The opposite of $7$ is $2$, so (b) is 2. Then $d=5+7=12\equiv3$, so (c) is 3. Check: $4+3=7$.'
          - problem: 'In $\mathbb{Z}_{15}$, let $[a]=[11]$ and $[b]=[2]$. Give each answer as a number from $0$ to $14$. (a) Give $d$ with $[11]+[d]=[2]$. (b) Give $f$ with $[2]+[f]=[11]$. (c) Give the class of $d+f$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 6; b = 9; c = 0'
            solution_sketch: 'The class $[d]$ is $2-11=-9$, which is $6$ modulo $15$, so (a) is 6. The class $[f]$ is $11-2=9$, so (b) is 9. The sum $6+9=15$ is $0$ modulo $15$, so (c) is 0.'
          - problem: 'In $\mathbb{Z}_5$, let $[a]=[2]$. For each $b$, give $d$ from $0$ to $4$ with $[2]+[d]=[b]$. (a) $b=0$. (b) $b=1$. (c) $b=4$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 3; b = 4; c = 2'
            solution_sketch: 'The class $[d]$ is $b-2$ modulo $5$. For $b=0$ this is $-2\equiv3$. For $b=1$ this is $-1\equiv4$. For $b=4$ this is $2$.'
          # argument: Proposition 4.32
          - problem: 'Prove: for each natural number $m$ and all $[a]_m,[b]_m\in\mathbb{Z}_m$, there are $[d]_m$ and $[f]_m$ with $[a]_m+[d]_m=[b]_m$ and $[b]_m+[f]_m=[a]_m$.'
            answer_contract: {"kind":"written"}
            answer: 'Take opposites of x and y in the class group. Then d is the opposite of x plus y, and f is the opposite of y plus x.'
            solution_sketch: 'Each class has an additive opposite, so pick $[a'']_m$ with $[a]_m+[a'']_m=[0]_m$ and $[b'']_m$ with $[b]_m+[b'']_m=[0]_m$. Put $[d]_m=[a'']_m+[b]_m$. Then $[a]_m+[d]_m=([a]_m+[a'']_m)+[b]_m=[b]_m$. Put $[f]_m=[b'']_m+[a]_m$. The same steps give $[b]_m+[f]_m=[a]_m$.'
          # source: FoM exercise 4.4-4-31
          - problem: 'Prove: let $x$ and $y$ be integers with $x<y$. Then $y-x$ is at least $1$.'
            answer_contract: {"kind":"written"}
            answer: 'The difference y - x is in the cone and not zero. So it is a natural number, and every natural number is at least 1.'
            solution_sketch: 'From $x<y$ we get $y-x\in\mathbb{N}_0$ and $y-x\ne0$. Hence $y-x$ is a natural number. Every natural number is at least $1$. So $y-x\ge1$.'
        constraints: 'solve [a]+[d]=[b] in Z_m with a representative from 0 to m-1; additive opposites'
      - id: kp5
        name: 'Theorem 4.33 and Proposition 4.34: order with sums and products'
        key_prerequisites: []
        exemplars:
          - problem: 'In $\mathbb{Z}$, let $x=3$, $y=8$ and $z=-5$. Here $x\le y$. (a) Give $x+z$. (b) Give $y+z$. (c) Give $(y+z)-(x+z)$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = -2; b = 3; c = 5'
            solution_sketch: 'The first sum is $3-5=-2$ and the second is $8-5=3$. Their difference is $3-(-2)=5$, which equals $y-x$. So adding $z$ keeps the difference and keeps the order.'
          - problem: 'In $\mathbb{Z}$, let $x=2$, $y=7$ and $z=4$. Here $x\le y$ and $z$ lies in the cone. (a) Give $xz$. (b) Give $yz$. (c) Give $yz-xz$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 8; b = 28; c = 20'
            solution_sketch: 'The products are $2\cdot4=8$ and $7\cdot4=28$. The difference is $28-8=20$. It equals $(y-x)z=5\cdot4$, which lies in the cone.'
          - problem: 'In $\mathbb{Z}$, let $x=1\le y=4$ and $u=-3\le v=2$. (a) Give $x+u$. (b) Give $y+v$. (c) Give $(y+v)-(x+u)$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = -2; b = 6; c = 8'
            solution_sketch: 'The first sum is $1-3=-2$ and the second is $4+2=6$. The difference is $6-(-2)=8$. It equals $(y-x)+(v-u)=3+5$, a sum of two elements of the cone.'
          - problem: 'In $\mathbb{Z}$, let $x=1$, $y=5$ and $z=-2$. (a) Give $xz$. (b) Give $yz$. (c) Give 1 if $xz\le yz$ and 0 if not.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = -2; b = -10; c = 0'
            solution_sketch: 'The products are $1\cdot(-2)=-2$ and $5\cdot(-2)=-10$. The first is above the second, so $xz\le yz$ fails and (c) is 0. Part 2 of Theorem 4.33 needs $z$ in the cone.'
          - problem: 'In $\mathbb{Z}$, let $x=-4$ and $y=6$. Look at the integers $z$ from $-3$ to $3$. (a) Count the $z$ with $x+z\le y+z$. (b) Count the $z$ with $xz\le yz$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}}]}
            answer: 'a = 7; b = 4'
            solution_sketch: 'The sums satisfy $x+z\le y+z$ for every $z$, so (a) is 7. The products satisfy $-4z\le6z$ exactly when $10z\ge0$, that is $z\ge0$. The values $0$, $1$, $2$, $3$ give 4.'
          - problem: 'Take the ring of functions from $\mathbb{Z}$ to $\mathbb{Z}$. Let $f(x)=x$, $g(x)=x+x^2$ and $z(x)=x^2+1$. Here $f\le g$ and $z$ lies in the cone. (a) Give $(g-f)(3)$. (b) Give $(gz-fz)(2)$. (c) Give 1 if $(g-f)z$ has no negative value and 0 if not.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 9; b = 20; c = 1'
            solution_sketch: 'We have $g-f=x^2$, so $(g-f)(3)=9$. At $x=2$ the values are $g=6$, $f=2$ and $z=5$, so $gz-fz=30-10=20$. The function $(g-f)z=x^2(x^2+1)$ has no negative value, so (c) is 1.'
          - problem: 'In $\mathbb{Z}$, look at the integers $x$ from $-3$ to $3$. (a) Give $(-4)^2$. (b) Count the $x$ with $x^2$ in the cone. (c) Give the least value of $x^2$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 16; b = 7; c = 0'
            solution_sketch: 'The square $(-4)^2$ is $16$. Each square of an integer is at least $0$, so all 7 integers count and (b) is 7. The least square is $0^2=0$.'
          # argument: Theorem 4.33
          - problem: 'Prove part 1 of this statement. In an ordered ring, if $x\le y$ and $z$ is any element, then $x+z\le y+z$.'
            answer_contract: {"kind":"written"}
            answer: 'The difference (y+z) - (x+z) equals y - x, which lies in the cone.'
            solution_sketch: 'Let $x\le y$, so $y-x\in R^+$. For any $z$, $(y+z)-(x+z)=y-x$. This lies in $R^+$. By Definition 4.25, $x+z\le y+z$.'
          # argument: Theorem 4.33
          - problem: 'Prove part 2 of this statement. In an ordered ring, if $x\le y$ and $z\in R^+$, then $xz\le yz$.'
            answer_contract: {"kind":"written"}
            answer: 'The difference yz - xz equals (y - x)z, a product of two elements of the cone.'
            solution_sketch: 'Let $x\le y$ and $z\in R^+$. Then $y-x\in R^+$. Distributivity gives $yz-xz=(y-x)z$. Condition 1 of Definition 4.23 puts this product in $R^+$. So $xz\le yz$.'
          # source: FoM exercise 4.4-4-26
          - problem: 'Prove: in an ordered ring, if $x\le y$ and $u\le v$, then $x+u\le y+v$.'
            answer_contract: {"kind":"written"}
            answer: 'The difference (y+v) - (x+u) equals (y-x) + (v-u), a sum of two elements of the cone.'
            solution_sketch: 'For Proposition 4.34, both $y-x$ and $v-u$ lie in $R^+$. Rearranging gives $(y+v)-(x+u)=(y-x)+(v-u)$. Condition 1 of Definition 4.23 puts the sum in $R^+$. So $x+u\le y+v$.'
          # argument: Proposition 4.34
          - problem: 'Prove in two steps: in an ordered ring, $x\le y$ and $u\le v$ give $x+u\le y+v$.'
            answer_contract: {"kind":"written"}
            answer: 'Add u to both sides of x <= y, then add y to both sides of u <= v. Transitivity joins the two results.'
            solution_sketch: 'Part 1 of Theorem 4.33 gives $x+u\le y+u$ from $x\le y$. The same part gives $u+y\le v+y$ from $u\le v$. The sums commute, so $y+u\le y+v$. Transitivity of $\le$ from Theorem 4.26 joins the two steps to give $x+u\le y+v$.'
          # source: FoM exercise 4.4-4-32
          - problem: 'Let $S$ be a nonempty set of integers. (a) Prove: if some integer $u$ has $u\ge s$ for all $s\in S$, then $S$ holds a greatest element. (b) Prove: if some integer $l$ has $l\le s$ for all $s\in S$, then $S$ holds a least element.'
            answer_contract: {"kind":"written"}
            answer: 'The differences u - s have a least element by well ordering, and it gives a maximum; for (b) use the differences s - l.'
            solution_sketch: 'For (a), look at the set of all $u-s$ with $s\in S$. It is nonempty and holds only elements of $\mathbb{N}_0$. By the well ordering of $\mathbb{N}_0$ it has a least element $u-m$. For all $s\in S$ we get $u-m\le u-s$, so $s\le m$ by Theorem 4.33. For (b), use the set of all $s-l$ in the same way.'
          # source: FoM exercise 4.4-4-33
          - problem: 'Prove: in a totally ordered ring, $x^2\ge0$ for every element $x$.'
            answer_contract: {"kind":"written"}
            answer: 'Totality puts x or -x in the cone. In both cases x squared equals a product of two cone elements, so it lies in the cone.'
            solution_sketch: 'By Theorem 4.28, $x\in R^+$ or $-x\in R^+$. If $x\in R^+$, then $x^2=x\cdot x\in R^+$. If $-x\in R^+$, then $x^2=(-x)(-x)\in R^+$. In both cases $x^2\ge0$ by Lemma 4.27.'
        constraints: 'add the same element to both sides, multiply by a cone element, add two inequalities'
      - id: kp6
        name: 'Theorem 4.35 to Theorem 4.38: negative factors, cancellation and the absolute value'
        key_prerequisites: [fom-4-2-groups-rings]
        exemplars:
          - problem: 'In $\mathbb{Z}$, let $x=2$, $y=6$ and $z=-3$. Here $x\le y$. (a) Give $xz$. (b) Give $yz$. (c) Give 1 if $xz\ge yz$ and 0 if not.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = -6; b = -18; c = 1'
            solution_sketch: 'The products are $2\cdot(-3)=-6$ and $6\cdot(-3)=-18$. The first is above the second, so $xz\ge yz$ and (c) is 1. A negative factor reverses the order.'
          - problem: 'Take $\mathbb{Z}$ with the cone $\mathbb{N}_0$. (a) Give $|-7|$. (b) Give $|0|$. (c) Give $|5-12|$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 7; b = 0; c = 7'
            solution_sketch: 'The absolute value of a negative number is its opposite, so $|-7|=7$. The absolute value of $0$ is $0$. The difference $5-12$ is $-7$, so $|5-12|=7$.'
          - problem: 'In $\mathbb{Z}$, let $x=-4$ and $y=-6$. (a) Give $|xy|$. (b) Give $|x||y|$. (c) Give $|x+y|$. (d) Give $|x|+|y|$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}}]}
            answer: 'a = 24; b = 24; c = 10; d = 10'
            solution_sketch: 'The product $xy$ is $24$, so (a) is 24. Also $|x||y|=4\cdot6=24$. The sum $x+y$ is $-10$, so (c) is 10. Also $|x|+|y|=4+6=10$.'
          - problem: 'In $\mathbb{Z}$, let $x=-4$ and $y=6$. (a) Give $|x+y|$. (b) Give $|x|+|y|$. (c) Give 1 if $|x+y|\le|x|+|y|$ and 0 if not.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 2; b = 10; c = 1'
            solution_sketch: 'The sum $x+y$ is $2$, so (a) is 2. The two absolute values are $4$ and $6$, and they add to $10$. Since $2\le10$, (c) is 1. This is the triangular inequality.'
          - problem: 'In $\mathbb{Z}$, let $x=3$ and $y=-8$. (a) Give $||x|-|y||$. (b) Give $|x-y|$. (c) Give 1 if $||x|-|y||\le|x-y|$ and 0 if not.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 5; b = 11; c = 1'
            solution_sketch: 'We have $|x|=3$ and $|y|=8$, so $||x|-|y||=5$. The difference $x-y$ is $11$, so (b) is 11. Since $5\le11$, (c) is 1.'
          - problem: 'Work in $\mathbb{Z}$. (a) Give the integer $x$ with $7x=35$. (b) Give the greatest integer $x$ with $3x\le14$. (c) Give the least integer $x$ with $-3x\le12$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 5; b = 4; c = -4'
            solution_sketch: 'For (a), cancel the factor $7$ to get $x=5$. For (b), divide by the positive number $3$ to get $x\le14/3$, so $x=4$. For (c), divide by the negative number $-3$ and reverse the order to get $x\ge-4$, so $x=-4$.'
          - problem: 'In the ring $\mathbb{Z}_6$, give each answer as a number from $0$ to $5$. (a) Give the class of $2\cdot3$. (b) Give the class of $2\cdot4$. (c) Give the class of $2\cdot1$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 0; b = 2; c = 2'
            solution_sketch: 'The product $2\cdot3=6$ is $0$ modulo $6$, so (a) is 0. The product $2\cdot4=8$ is $2$ modulo $6$, so (b) is 2. The product $2\cdot1$ is $2$, so (c) is 2. So $2\cdot4=2\cdot1$ with $4\ne1$, and cancelling $2$ fails in $\mathbb{Z}_6$.'
          - problem: 'Work in $\mathbb{Z}$. (a) Count the integer solutions of $|3x-1|<8$. (b) Give the smallest positive integer solution of $|2x+1|>9$. (c) Give the largest negative integer solution of $|2x+1|>9$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 5; b = 5; c = -6'
            solution_sketch: 'The first inequality gives $-7<3x<9$, so $x$ is one of $-2,-1,0,1,2$, which is 5 solutions. The second gives $2x+1>9$ or $2x+1<-9$, that is $x>4$ or $x<-5$. The smallest positive solution is $5$ and the largest negative one is $-6$.'
          - problem: 'Work in $\mathbb{Z}$ and look at the integers $x$ with $2\le|x-3|\le4$. (a) Count them. (b) Give their sum.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}}]}
            answer: 'a = 6; b = 18'
            solution_sketch: 'The case $x-3\in\{2,3,4\}$ gives $x=5,6,7$. The case $x-3\in\{-2,-3,-4\}$ gives $x=1,0,-1$. That makes 6 integers. Their sum is $18+0=18$.'
          # argument: Theorem 4.35
          - problem: 'Prove: let $R$ be an ordered ring. If $x\le y$ and $z<0$, then $xz\ge yz$.'
            answer_contract: {"kind":"written"}
            answer: 'Both y - x and -z lie in the cone. Their product xz - yz = (-z)(y - x) lies in the cone too.'
            solution_sketch: 'From $x\le y$ we get $y-x\in R^+$. From $z<0$ we get $-z\in R^+$. Distributivity gives $xz-yz=(-z)(y-x)$. Condition 1 of Definition 4.23 puts this product in $R^+$. So $xz\ge yz$.'
          # argument: Theorem 4.36
          - problem: 'Prove part 2 of this statement. Let $R$ be a totally ordered ring with no zero divisors. If $xz\le yz$ and $z>0$, then $x\le y$.'
            answer_contract: {"kind":"written"}
            answer: 'Assume x > y; then Theorem 4.33 gives xz >= yz, and cancellation makes it xz > yz, which contradicts xz <= yz.'
            solution_sketch: 'Let $xz\le yz$ and $z>0$. Assume for contradiction that $x>y$. Part 2 of Theorem 4.33 gives $xz\ge yz$. Since $x\ne y$ and $z\ne0$, part 1 of Theorem 4.36 gives $xz\ne yz$. So $xz>yz$, which contradicts $xz\le yz$. Hence $x\le y$ by totality.'
          # argument: Theorem 4.38
          - problem: 'Prove parts 0 and 1 of this statement. In a totally ordered ring, $|x|\ge0$ for every $x$, and $|x|=0$ holds only for $x=0$.'
            answer_contract: {"kind":"written"}
            answer: 'Split by the sign of x; for x < 0 the value -x lies in the cone and is not zero, and a zero absolute value forces x = 0.'
            solution_sketch: 'If $x\ge0$, then $|x|=x\ge0$ by Definition 4.37. If $x<0$, then $-x\in R^+$ is nonzero, so $|x|=-x>0$. Now let $|x|=0$ and assume $x\ne0$. If $x>0$, then $0<x=|x|=0$, which is false. If $x<0$, then $0<-x=|x|=0$, which is false. So $x=0$.'
          # argument: Theorem 4.38
          - problem: 'Prove part 2 of this statement. In a totally ordered ring, $|xy|=|x||y|$ for all $x,y$.'
            answer_contract: {"kind":"written"}
            answer: 'Split into the four sign cases. Theorem 4.35 and Definition 4.23 give the sign of xy in each case.'
            solution_sketch: 'Use Definition 4.37 and split into cases. For $x\ge0$ and $y\ge0$, condition 1 of Definition 4.23 gives $xy\ge0$ and $|xy|=xy=|x||y|$. For $x\ge0$ and $y<0$, Theorem 4.35 gives $xy\le0$, so $|xy|=-xy=x(-y)=|x||y|$. The case $x<0$, $y\ge0$ is the same. For $x<0$ and $y<0$, Proposition 4.18 gives $xy=(-x)(-y)\ge0$, so $|xy|=xy=|x||y|$.'
          # argument: Theorem 4.38
          - problem: 'Prove the triangular inequality. In a totally ordered ring, $|x+y|\le|x|+|y|$ for all $x,y$.'
            answer_contract: {"kind":"written"}
            answer: 'Use x <= |x| and -x <= |x| for both numbers. Add the bounds, and look at the sign of x + y.'
            solution_sketch: 'First, $x\le|x|$ and $-x\le|x|$ for each element, by Definition 4.37. If $x+y\ge0$, then $|x+y|=x+y\le|x|+|y|$ by Theorem 4.33. If $x+y<0$, then $|x+y|=-x+(-y)\le|x|+|y|$ by Theorem 4.33. So the inequality holds in both cases.'
          # argument: Theorem 4.38
          - problem: 'Prove the reverse triangular inequality. In a totally ordered ring, $||x|-|y||\le|x-y|$ for all $x,y$, when $|x|\ge|y|$.'
            answer_contract: {"kind":"written"}
            answer: 'Write |x| = |(x - y) + y| and apply the triangular inequality. Subtract |y| from both sides.'
            solution_sketch: 'Let $|x|\ge|y|$. Then $|x|=|(x-y)+y|$. The triangular inequality of Theorem 4.38 gives $|x|\le|x-y|+|y|$. Subtract $|y|$ from both sides with Theorem 4.33. This gives $|x|-|y|\le|x-y|$. Since $|x|-|y|\ge0$, the left side equals $||x|-|y||$.'
          # source: FoM exercise 4.4-4-29
          - problem: 'Work in a totally ordered ring where $ab=0$ implies $a=0$ or $b=0$. Let $x,y,z$ be elements of the ring. (a) Prove: if $xz=yz$ and $z\ne0$, then $x=y$. (b) Let $xz\le yz$ and $z>0$. Suppose $x>y$ and derive a contradiction. Name the step that needs the order to be total. (c) Prove: if $xz\le yz$ and $z<0$, then $x\ge y$.'
            answer_contract: {"kind":"written"}
            answer: 'Use (x-y)z = 0 for (a); totality turns not x <= y into x > y in (b); Theorem 4.35 gives (c) like part 2.'
            solution_sketch: 'For (a), $xz=yz$ gives $(x-y)z=0$, and $z\ne0$ gives $x=y$. For (b), totality is needed at the start: it turns the failure of $x\le y$ into $x>y$. Theorem 4.36 part 1 and Theorem 4.35 then give $xz>yz$, which contradicts $xz\le yz$. For (c), let $xz\le yz$ and $z<0$, and assume $x<y$. Theorem 4.35 gives $xz\ge yz$, and part 1 gives $xz>yz$. This contradicts $xz\le yz$.'
          # source: FoM exercise 4.4-4-30
          - problem: 'Finish the proof of Theorem 4.38 in a totally ordered ring. (a) Prove: if $x<0$ and $y\ge0$, then $|xy|=|x||y|$. (b) Prove: $-x\le|x|$ for all $x$. (c) Prove: if $|x|<|y|$, then $||x|-|y||\le|x-y|$.'
            answer_contract: {"kind":"written"}
            answer: 'Split by sign for (a) and (b); for (c) swap x and y in the reverse triangular inequality.'
            solution_sketch: 'For (a), Theorem 4.38 uses Theorem 4.35, which gives $xy\le0$, so $|xy|=-xy=(-x)y=|x||y|$. For (b), if $x\ge0$ then $-x\le0\le x=|x|$. If $x<0$ then $-x=|x|$. For (c), apply the case $|y|\ge|x|$ of the reverse triangular inequality with $x$ and $y$ swapped. Use $|y-x|=|x-y|$.'
          # source: FoM exercise 4.4-4-34
          - problem: 'Do five tasks in a totally ordered ring, with $x$ any element and $a\in R^+$ for (a) and (b). (a) Prove: $|x|<a$ if and only if $-a<x<a$. (b) Prove: $|x|>a$ if and only if $x>a$ or $x<-a$. (c) Solve $|7x+2|<3$ in $\mathbb{Z}$. (d) Solve $|6x+5|>2$ in $\mathbb{Z}$. (e) Solve $3\le|2x+4|\le11$ in $\mathbb{Z}$.'
            answer_contract: {"kind":"written"}
            answer: 'Split by the sign of x for (a) and (b). Then (c) gives x = 0, (d) gives all integers except -1, and (e) gives -7 to -4 and 0 to 3.'
            solution_sketch: 'For (a) and (b), use Definition 4.37 and split by the sign of $x$. For (c), $-3<7x+2<3$ gives $-5<7x<1$, so $x=0$. For (d), $6x+5>2$ gives $x\ge0$ and $6x+5<-2$ gives $x\le-2$, so every integer except $-1$ works. For (e), $3\le2x+4\le11$ gives $x=0,1,2,3$ and $-11\le2x+4\le-3$ gives $x=-7,-6,-5,-4$.'
        constraints: 'reverse the order for a negative factor; cancel a nonzero factor; compute absolute values and solve inequalities in the integers'
    diagnostic_exemplar:
      problem: 'Take the ring $\mathbb{Z}$ with the positive cone $\mathbb{N}_0$. Give 1 if $-6$ lies in the cone and 0 if not.'
      answer_contract: {"kind":"exact"}
      answer: '0'
      solution_sketch: 'The cone $\mathbb{N}_0$ holds the integers from $0$ upward. The number $-6$ lies below $0$, so the answer is 0.'
