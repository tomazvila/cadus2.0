          - problem: 'The map $f(n)=[(n+1,1)]$ sends a positive integer $n$ to an integer class, and $[(a,b)]$ stands for $a-b$. (a) Give $n$ with $f(n)=[(10,1)]$. (b) Give $n$ with $f(n)=[(12,2)]$. (c) Count the numbers $n$ in $\{1,\dots,20\}$ with $f(n)=[(8,3)]$.'
