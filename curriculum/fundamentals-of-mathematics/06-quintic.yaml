        exemplars:
          - problem: 'Count the primitive roots of unity. (a) Give the number of primitive 6th roots of unity. (b) Give the number of primitive 12th roots of unity. (c) Give the number of primitive 7th roots of unity.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 2; b = 4; c = 6'
            solution_sketch: 'Let $\omega=e^{2\pi i/n}$. The power $\omega^k$ is primitive exactly when $\gcd(k,n)=1$. For $n=6$ the exponents are 1 and 5, so a = 2. For $n=12$ they are 1, 5, 7, 11, so b = 4. For $n=7$ they are 1 to 6, so c = 6.'
          - problem: 'Let $\omega=e^{2\pi i/8}$. Give 1 for true and 0 for false. (a) $\omega^3$ is a primitive 8th root of unity. (b) $\omega^6$ is a primitive 8th root of unity. (c) $\omega^5$ is a primitive 8th root of unity.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 0; c = 1'
            solution_sketch: 'The power $\omega^k$ is primitive exactly when $\gcd(k,8)=1$. Here $\gcd(3,8)=1$, so a = 1. Here $\gcd(6,8)=2$, so b = 0. Here $\gcd(5,8)=1$, so c = 1.'
          - problem: 'Work in the group $(\mathbb{Z}_{12},+)$. (a) Give the number of elements of the subgroup generated by $[8]$. (b) Give the number of elements of the subgroup generated by $[5]$. (c) Give the number of elements of the subgroup generated by $[9]$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 3; b = 12; c = 4'
            solution_sketch: 'The multiples of $[8]$ are $[8],[4],[0]$, so a = 3. Since $\gcd(5,12)=1$, the element $[5]$ generates all of $\mathbb{Z}_{12}$, so b = 12. The multiples of $[9]$ are $[9],[6],[3],[0]$, so c = 4.'
          - problem: 'Count the subgroups of a cyclic group. (a) Give the number of subgroups of $(\mathbb{Z}_{12},+)$. (b) Give the number of subgroups of $(\mathbb{Z}_{7},+)$. (c) Give the number of subgroups of $(\mathbb{Z}_{30},+)$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 6; b = 2; c = 8'
            solution_sketch: 'The subgroups of $\mathbb{Z}_m$ match the positive divisors of $m$. The number 12 has 6 divisors, so a = 6. The number 7 has 2 divisors, so b = 2. The number 30 has 8 divisors, so c = 8.'
          - problem: 'Let $\mathbb{F}=\mathbb{Q}(i)$. Let $w$ be a complex root of $x^4-2$. The polynomial $x^4-2$ is irreducible over $\mathbb{F}$. (a) Give the number of roots of $x^4-2$ that lie in $\mathbb{F}(w)$. (b) Give the number of elements of the Galois group $G(\mathbb{F}(w)/\mathbb{F})$. (c) Give the number of elements of order 4 in this Galois group.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 4; b = 4; c = 2'
            solution_sketch: 'The field $\mathbb{F}$ holds the 4th roots of unity, so the roots $w,iw,-w,-iw$ all lie in $\mathbb{F}(w)$ and a = 4. The degree of the extension is 4, so the group has 4 elements and b = 4. The group is isomorphic to $\mathbb{Z}_4$, which has 2 elements of order 4, so c = 2.'
          - problem: 'Let $\mathbb{F}$ be a field of characteristic 0 that holds all $n$th roots of unity. Let $w$ be a root of $x^n-f$. (a) Let $\mathbb{F}=\mathbb{Q}(i)$ and $x^4-16$. Give the number of elements of $G(\mathbb{F}(w)/\mathbb{F})$. (b) Let $\mathbb{F}=\mathbb{Q}(i)$ and $x^2-3$. Give the number of elements of $G(\mathbb{F}(w)/\mathbb{F})$. (c) Let $\mathbb{F}=\mathbb{Q}(\zeta)$ with $\zeta^2+\zeta+1=0$ and $x^3-2$. Give the number of elements of $G(\mathbb{F}(w)/\mathbb{F})$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 2; c = 3'
            solution_sketch: 'In (a) all roots of $x^4-16$ are $\pm2,\pm2i$ and lie in $\mathbb{F}$, so the group has 1 element. In (b) $\sqrt3$ is not in $\mathbb{Q}(i)$, so the degree is 2 and b = 2. In (c) $\sqrt[3]{2}$ has degree 3 over $\mathbb{Q}(\zeta)$, so c = 3.'
          - problem: 'Let $w$ be a root of $x^5-f$ and let $r$ be a primitive 5th root of unity. Let $\sigma$ and $\mu$ be automorphisms with $\sigma(w)=r^4w$ and $\mu(w)=r^2w$, and both fix $r$. For an automorphism $\tau$ with $\tau(w)=r^kw$ let $\Phi(\tau)$ be the number $k$ in $\{0,1,2,3,4\}$. (a) Give $\Phi(\mu\circ\sigma)$. (b) Give $\Phi(\sigma\circ\sigma)$. (c) Give $\Phi(\mu\circ\mu\circ\mu)$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 3; c = 1'
            solution_sketch: 'Exponents add modulo 5 when automorphisms compose. For (a) $2+4=6\equiv1$, so a = 1. For (b) $4+4=8\equiv3$, so b = 3. For (c) $2+2+2=6\equiv1$, so c = 1.'
          # argument: Theorem 6.70
          - problem: 'Prove the first step: take a field $\mathbb{F}$ with characteristic 0 that holds all $n$th roots of unity. Let $f\in\mathbb{F}$ with $f\ne0$ and let $w$ be a root of $x^n-f$. Then $\mathbb{F}(w)$ is the splitting field of $x^n-f$.'
            answer_contract: {"kind":"written"}
            answer: 'A primitive root r gives n distinct roots w, rw, up to r^(n-1) w of the polynomial, all in F(w). So F(w) holds every root.'
            solution_sketch: 'Let $r$ be a primitive $n$th root of unity (Definition 6.69). Then $1,r,\dots,r^{n-1}$ are the $n$ distinct $n$th roots of unity. So $w,rw,\dots,r^{n-1}w$ are $n$ distinct roots of $x^n-f$, and all lie in $\mathbb{F}(w)$. A polynomial of degree $n$ has at most $n$ roots, so these are all of them. Theorem 6.34 uses this list when it sends $w$ to another root.'
          # argument: Theorem 6.70
          - problem: 'Prove the second step: in the setting of the first step, the Galois group $G(\mathbb{F}(w)/\mathbb{F})$ is isomorphic to a subgroup of $\mathbb{Z}_n$. In particular it is commutative.'
            answer_contract: {"kind":"written"}
            answer: 'Send sigma to the k with sigma(w) = r^k w. This map is an injective homomorphism into Z_n, and Z_n is commutative.'
            solution_sketch: 'By Theorem 6.34, each $\sigma$ in the group has $\sigma(w)=r^kw$ for a unique $k$ modulo $n$. Define $\Phi(\sigma)=[k]_n$. For $\mu(w)=r^jw$ and $\sigma(w)=r^kw$, the composition gives $\mu\circ\sigma(w)=r^{j+k}w$, so $\Phi$ is a homomorphism. If $\Phi(\sigma)=[0]_n$, then $\sigma(w)=w$, so $\sigma=\mathrm{id}$ by Theorem 6.31. So $\Phi$ is injective, and the group is isomorphic to a subgroup of the commutative group $\mathbb{Z}_n$.'
          # source: FoM exercise 6.8-6-70
          - problem: 'Let $G$ and $H$ be groups and let $\Phi:G\to H$ be a homomorphism. Prove: $\Phi$ is injective if and only if the equation $\Phi(g)=e_H$ forces $g=e_G$.'
            answer_contract: {"kind":"written"}
            answer: 'Use Phi(a) = Phi(b) exactly when Phi(a b^-1) = e. A trivial kernel then gives a = b, and injectivity gives a trivial kernel.'
            solution_sketch: 'If $\Phi$ is injective and $\Phi(g)=e_H=\Phi(e_G)$, then $g=e_G$. Now let only $e_G$ map to $e_H$. Let $\Phi(a)=\Phi(b)$. Then $\Phi(ab^{-1})=\Phi(a)\Phi(b)^{-1}=e_H$. So $ab^{-1}=e_G$ and $a=b$.'
          # source: FoM exercise 6.8-6-71
          - problem: 'Take a field $\mathbb{F}$ with characteristic 0 and an $n$th root of unity $\theta$. Prove that the Galois group $G(\mathbb{F}(\theta)/\mathbb{F})$ is commutative.'
            answer_contract: {"kind":"written"}
            answer: 'An automorphism sends theta to a power of theta. Composing two of them adds the exponents, so the order of composition does not matter.'
            solution_sketch: 'Let $d$ be the order of $\theta$. Every automorphism $\sigma$ sends $\theta$ to a $d$th root of unity. All $d$th roots of unity are powers of $\theta$, so $\sigma(\theta)=\theta^k$. For $\mu(\theta)=\theta^j$ the composition gives $\mu\circ\sigma(\theta)=\theta^{jk}$ and also $\sigma\circ\mu(\theta)=\theta^{jk}$. An automorphism of $\mathbb{F}(\theta)$ over $\mathbb{F}$ is fixed by its value at $\theta$, so $\mu\circ\sigma=\sigma\circ\mu$.'
          # source: FoM exercise 6.8-6-72
          - problem: 'Prove that each subgroup of $(\mathbb{Z}_m,+)$ is isomorphic to $(\mathbb{Z}_n,+)$ for some $n$.'
            answer_contract: {"kind":"written"}
            answer: 'A subgroup is generated by its smallest positive element d. It then has n = m/d elements and is isomorphic to Z_n.'
            solution_sketch: 'Let $H$ be a subgroup. If $H=\{[0]\}$, then $H\cong\mathbb{Z}_1$. Otherwise let $d$ be the smallest positive integer with $[d]\in H$. Division with remainder shows that every element of $H$ is a multiple of $[d]$. So $H$ is generated by $[d]$, and $d$ divides $m$. Hence $H$ has $n=m/d$ elements and $H\cong\mathbb{Z}_n$.'
          # source: FoM exercise 6.8-6-73
          - problem: 'Let $\mathbb{F}$ be a field and let $\sigma_1,\dots,\sigma_n:\mathbb{F}\to\mathbb{F}$ be pairwise different nonzero field homomorphisms. Prove: if $\lambda_1\sigma_1+\dots+\lambda_n\sigma_n$ is the zero function, then all $\lambda_j$ are 0.'
            answer_contract: {"kind":"written"}
            answer: 'Induct on n. Pick a with sigma_(n+1)(a) different from sigma_1(a) and subtract two relations to remove one term.'
            solution_sketch: 'For $n=1$, a nonzero homomorphism has $\sigma_1(1)=1$, so $\lambda_1=0$. In the step, assume $\sum_{j=1}^{n+1}\lambda_j\sigma_j=0$. Pick $a$ with $\sigma_{n+1}(a)\ne\sigma_1(a)$. Evaluate the sum at $ax$ and subtract $\sigma_1(a)$ times the sum at $x$. The $\sigma_1$ term cancels, so the induction hypothesis gives $\lambda_{n+1}(\sigma_{n+1}(a)-\sigma_1(a))=0$. Hence $\lambda_{n+1}=0$, and the hypothesis gives the rest.'
          # source: FoM exercise 6.8-6-74
          - problem: 'Take a field $\mathbb{F}$ with characteristic 0 that holds all $n$th roots of unity. Take a normal extension $\mathbb{E}$ of $\mathbb{F}$ with a Galois group isomorphic to $\mathbb{Z}_n$, generated by $\sigma$. Let $r$ be a primitive $n$th root of unity. Prove all of these steps. (a) Some $c\in\mathbb{E}$ has $b=\sum_{j=0}^{n-1}r^j\sigma^j(c)\ne0$. (b) $\sigma(b)=r^{-1}b$, hence $\sigma(b^n)=b^n$. (c) $a=b^n$ lies in $\mathbb{F}$ and $b$ is a root of $x^n-a$. (d) The minimal polynomial of $b$ has degree at least $n$. (e) That minimal polynomial is $x^n-a$. (f) $\mathbb{E}=\mathbb{F}(b)$.'
            answer_contract: {"kind":"written"}
            answer: 'Dedekind''s theorem gives b not 0. Then sigma(b) = r^-1 b yields n distinct roots of the minimal polynomial, so it is x^n - a and E = F(b).'
            solution_sketch: 'Part (a): the maps $\sigma^j$ are different, so Exercise 6-73 gives a $c$ with $b\ne0$. Part (b): shifting the index gives $\sigma(b)=r^{-1}b$, so $\sigma(b^n)=b^n$. Part (c): $b^n$ is fixed by the whole group, so $a\in\mathbb{F}$. Part (d): the images $\sigma^j(b)=r^{-j}b$ are $n$ distinct roots of the minimal polynomial. Parts (e) and (f): the degree is $n$, so the minimal polynomial is $x^n-a$, and $[\mathbb{F}(b):\mathbb{F}]=n=[\mathbb{E}:\mathbb{F}]$.'
        constraints: 'Practice items: decidable values and one written proof for each result.'
      - id: kp2
        name: 'Definition 6.71 and Lemma 6.72: solvable groups and their quotients'
        key_prerequisites: []
        exemplars:
          - problem: 'Give 1 for true and 0 for false. (a) The group $\mathbb{Z}_6$ is solvable. (b) The group $A_5$ is solvable. (c) The group $S_3$ is solvable.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 0; c = 1'
            solution_sketch: 'The group $\mathbb{Z}_6$ is commutative, so the sequence $\{e\}\lhd\mathbb{Z}_6$ works and a = 1. The group $A_5$ is simple and not commutative, so only $\{e\}\lhd A_5$ is possible and b = 0. The sequence $\{e\}\lhd A_3\lhd S_3$ has factors of order 3 and 2, so c = 1.'
          - problem: 'Find the smallest number $m$ of steps in a nested sequence $\{e\}=G_0\lhd\dots\lhd G_m=G$ with commutative factors. (a) Let $G=S_3$. (b) Let $G=\mathbb{Z}_{12}$. (c) Let $G=A_4$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 2; b = 1; c = 2'
            solution_sketch: 'A non-commutative group needs at least 2 steps. For $S_3$ the sequence $\{e\}\lhd A_3\lhd S_3$ works, so a = 2. The group $\mathbb{Z}_{12}$ is commutative, so b = 1. For $A_4$ the sequence $\{e\}\lhd V_4\lhd A_4$ works, so c = 2.'
          - problem: 'Use the nested sequence $\{e\}\lhd V_4\lhd A_4\lhd S_4$. Here $V_4$ is the Klein four-group. (a) Give $|V_4/\{e\}|$. (b) Give $|A_4/V_4|$. (c) Give $|S_4/A_4|$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 4; b = 3; c = 2'
            solution_sketch: 'The group $V_4$ has 4 elements, so a = 4. The group $A_4$ has 12 elements, so $12/4=3$ and b = 3. The group $S_4$ has 24 elements, so $24/12=2$ and c = 2.'
          - problem: 'Let $G=S_4$ and let $N=V_4$ be the Klein four-group, a normal subgroup. (a) Give the number of elements of $G/N$. (b) Give 1 if $G/N$ is solvable and 0 if not. (c) Give the smallest number of steps in a nested sequence with commutative factors for $G/N$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 6; b = 1; c = 2'
            solution_sketch: 'The order is $24/4=6$, so a = 6. By Lemma 6.72 the quotient of the solvable group $S_4$ is solvable, so b = 1. The quotient is isomorphic to $S_3$, which is not commutative, so it needs 2 steps and c = 2.'
          - problem: 'Let $G=\mathbb{Z}_{12}$ and let $N$ be the subgroup generated by $[4]$. (a) Give the number of elements of $G/N$. (b) Give the number of elements of order 2 in $G/N$. (c) Give 1 if $G/N$ is commutative and 0 if not.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 4; b = 1; c = 1'
            solution_sketch: 'The subgroup $N$ has 3 elements, so $G/N$ has $12/3=4$ elements and a = 4. The quotient is isomorphic to $\mathbb{Z}_4$, which has exactly 1 element of order 2, so b = 1. A quotient of a commutative group is commutative, so c = 1.'
          - problem: 'Let $G=\mathbb{Z}_{12}$, let $G_1$ be the subgroup generated by $[4]$ and let $N$ be the subgroup generated by $[6]$. (a) Give the number of elements of $G_1N$. (b) Give the number of elements of $G_1N/N$. (c) Give the number of elements of $G_1\cap N$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 6; b = 3; c = 1'
            solution_sketch: 'Here $G_1=\{0,4,8\}$ and $N=\{0,6\}$. The sums give $\{0,2,4,6,8,10\}$, which has 6 elements, so a = 6. Then $6/2=3$ gives b = 3. The only common element is 0, so c = 1.'
          - problem: 'Use the nested sequence $\{[0]\}\lhd\langle[6]\rangle\lhd\langle[2]\rangle\lhd\mathbb{Z}_{12}$. (a) Give the order of the first factor group. (b) Give the order of the second factor group. (c) Give the order of the third factor group.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 2; b = 3; c = 2'
            solution_sketch: 'The groups have 1, 2, 6 and 12 elements. The factor orders are $2/1=2$, $6/2=3$ and $12/6=2$. So a = 2, b = 3 and c = 2.'
          # argument: Lemma 6.72
          - problem: 'Prove the first step: let $G$ be finite and solvable with nested normal subgroups $\{e\}=G_0\lhd\dots\lhd G_m=G$, and let $N\lhd G$. Then each $G_jN$ is a subgroup of $G$, and $G_{j-1}N/N$ is normal in $G_jN/N$.'
            answer_contract: {"kind":"written"}
            answer: 'Normality of N moves N past any element, so G_jN is closed under products and inverses. Cosets g N with g in G_j then show the normality.'
            solution_sketch: 'Take $x=g_xn_x$ and $y=g_yn_y$ in $G_jN$. Since $N$ is normal, $n_xg_y=g_yn$ for some $n\in N$, so $xy\in G_jN$. A similar step gives the inverse, so $G_jN$ is a subgroup. Each element of $G_jN/N$ has the form $g_jN$ with $g_j\in G_j$. Normality of $G_{j-1}$ in $G_j$ and of $N$ in $G$ then gives $(g_jN)(G_{j-1}N/N)=(G_{j-1}N/N)(g_jN)$.'
          # argument: Lemma 6.72
          - problem: 'Prove the second step: in the setting of the first step, the factor group $(G_jN/N)/(G_{j-1}N/N)$ is commutative. Then $G/N$ is solvable.'
            answer_contract: {"kind":"written"}
            answer: 'Each coset is g N with g in G_j. The commutativity of G_j over G_(j-1) carries over to the new factors, and G_m N / N is G/N.'
            solution_sketch: 'Let $g_j,h_j\in G_j$. Because $G_j/G_{j-1}$ is commutative, $g_jh_j$ and $h_jg_j$ differ by an element of $G_{j-1}$. The same relation holds after multiplying with $N$. So $g_jN$ and $h_jN$ commute modulo $G_{j-1}N/N$. Every element of $G_jN/N$ has this form, so the factor group is commutative. For $j=m$ the top group $G_mN/N$ equals $G/N$.'
          # source: FoM exercise 6.8-6-75
          - problem: 'Let $G$ and $H$ be groups and let $\varphi:G\to H$ be a homomorphism. Prove these two facts. (a) The set $K=\{g\in G:\varphi(g)=e\}$ is a normal subgroup of $G$. (b) If $\varphi$ is surjective, then $G/K$ is isomorphic to $H$.'
            answer_contract: {"kind":"written"}
            answer: 'Show K is closed and conjugation keeps it. Then send gK to phi(g): this map is a well defined bijective homomorphism.'
            solution_sketch: 'The identity lies in $K$, and $K$ is closed under products and inverses. For $k\in K$, $\varphi(gkg^{-1})=\varphi(g)\varphi(g)^{-1}=e$, so $K$ is normal. Define $\psi(gK)=\varphi(g)$. It is well defined and a homomorphism. It is injective because $\varphi(a)=\varphi(b)$ gives $ab^{-1}\in K$, and it is surjective because $\varphi$ is.'
          # source: FoM exercise 6.8-6-76
          - problem: 'Let $N\lhd G$ and let $H$ be a subgroup with $N\subseteq H$. Prove these facts. (a) If $H\lhd G$, then $G/H\cong(G/N)/(H/N)$. (b) If $G/N$ is commutative, then $H\lhd G$. (c) If $G/N$ is commutative, then $G/H$ and $H/N$ are commutative.'
            answer_contract: {"kind":"written"}
            answer: 'Map gN to gH and use the kernel result for (a). For (b) and (c), commutativity of G/N moves elements of H past any g modulo N.'
            solution_sketch: 'For (a), define $gN\mapsto gH$ from $G/N$ onto $G/H$. Its kernel is $H/N$, so Exercise 6-75 gives $G/H\cong(G/N)/(H/N)$. For (b), take $g\in G$ and $h\in H$. Commutativity of $G/N$ gives $ghg^{-1}h^{-1}\in N\subseteq H$, so $ghg^{-1}\in H$. For (c), $G/H$ is a quotient of the commutative group $G/N$, and $H/N$ is a subgroup of it.'
          # source: FoM exercise 6.8-6-77
          - problem: 'Prove that each finite solvable group $G$ has a nested sequence $\{e\}=G_0\lhd\dots\lhd G_n=G$ in which every factor $G_j/G_{j-1}$ has a prime number $p_j$ of elements.'
            answer_contract: {"kind":"written"}
            answer: 'Refine a given sequence: a commutative factor with a nonprime order has a subgroup of prime order, which splits the step into smaller steps.'
            solution_sketch: 'Start with a sequence that has commutative factors. If some factor has an order that is not prime, pick a prime $p$ that divides it. Cauchy''s Theorem gives a subgroup $S$ of order $p$ in the factor. Write $S=HG_{j-1}$ with $|H|=p$. Exercise 6-76 shows that $G_j/HG_{j-1}$ and $HG_{j-1}/G_{j-1}$ are commutative. This splits the step into two shorter steps, and the repeat ends in prime factors.'
        constraints: 'Practice items: decidable values and one written proof for each result.'
      - id: kp3
        name: 'Theorem 6.73: a root tower sits inside a normal extension with a root tower'
        key_prerequisites: []
        exemplars:
          - problem: 'Look at the tower $\mathbb{Q}\subseteq\mathbb{Q}(\sqrt2)\subseteq\mathbb{Q}(\sqrt2,\sqrt3)\subseteq\mathbb{Q}(\sqrt2,\sqrt3,\sqrt5)$. Each step adds a square root. (a) Give $[\mathbb{Q}(\sqrt2):\mathbb{Q}]$. (b) Give $[\mathbb{Q}(\sqrt2,\sqrt3):\mathbb{Q}]$. (c) Give $[\mathbb{Q}(\sqrt2,\sqrt3,\sqrt5):\mathbb{Q}]$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 2; b = 4; c = 8'
            solution_sketch: 'None of $\sqrt2,\sqrt3,\sqrt5$ lies in the field before it, so each step has degree 2. The degrees multiply. So a = 2, b = 2*2 = 4 and c = 2*2*2 = 8.'
          - problem: 'Look at the tower $\mathbb{Q}\subseteq\mathbb{Q}(\sqrt[3]{2})\subseteq\mathbb{Q}(\sqrt[3]{2},\sqrt3)$. (a) Give $[\mathbb{Q}(\sqrt[3]{2}):\mathbb{Q}]$. (b) Give $[\mathbb{Q}(\sqrt[3]{2},\sqrt3):\mathbb{Q}(\sqrt[3]{2})]$. (c) Give $[\mathbb{Q}(\sqrt[3]{2},\sqrt3):\mathbb{Q}]$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 3; b = 2; c = 6'
            solution_sketch: 'The polynomial $x^3-2$ is irreducible over $\mathbb{Q}$, so a = 3. The number $\sqrt3$ is not in a field of odd degree 3, so the second step has degree 2 and b = 2. The degrees multiply: 3*2 = 6, so c = 6.'
          - problem: 'Let $\mathbb{E}$ be the splitting field of $x^3-2$ over $\mathbb{Q}$. It is a normal extension that holds $\mathbb{Q}(\sqrt[3]{2})$. (a) Give $[\mathbb{E}:\mathbb{Q}]$. (b) Give $[\mathbb{E}:\mathbb{Q}(\sqrt[3]{2})]$. (c) Give the number of roots of $x^3-2$ in $\mathbb{E}$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 6; b = 2; c = 3'
            solution_sketch: 'The field $\mathbb{E}=\mathbb{Q}(\sqrt[3]{2},\zeta)$ with $\zeta^2+\zeta+1=0$ has degree 6 over $\mathbb{Q}$, so a = 6. Then $6/3=2$ gives b = 2. The polynomial has degree 3 and splits in $\mathbb{E}$, so c = 3.'
          - problem: 'Let $\mathbb{F}''=\mathbb{Q}(\sqrt2)$, a normal extension of $\mathbb{Q}$. Let $w$ be a number with $w^3=1+\sqrt2$. Let $f(x)$ be the product of $x^3-\sigma(w^3)$ over both automorphisms $\sigma$ in $G(\mathbb{F}''/\mathbb{Q})$. Expand $f$. (a) Give the degree of $f$. (b) Give the coefficient of $x^3$. (c) Give the constant term.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 6; b = -2; c = -1'
            solution_sketch: 'The two factors are $x^3-(1+\sqrt2)$ and $x^3-(1-\sqrt2)$. Their product is $(x^3-1)^2-2=x^6-2x^3-1$. So a = 6, b = -2 and c = -1.'
          - problem: 'Let $\mathbb{F}''=\mathbb{Q}(i)$, a normal extension of $\mathbb{Q}$. Let $w$ be a number with $w^2=2+i$. Let $f(x)$ be the product of $x^2-\sigma(w^2)$ over both automorphisms $\sigma$ in $G(\mathbb{F}''/\mathbb{Q})$. Expand $f$. (a) Give the degree of $f$. (b) Give the coefficient of $x^2$. (c) Give the constant term.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 4; b = -4; c = 5'
            solution_sketch: 'The two factors are $x^2-(2+i)$ and $x^2-(2-i)$. Their product is $(x^2-2)^2+1=x^4-4x^2+5$. So a = 4, b = -4 and c = 5.'
          - problem: 'Let $\mathbb{E}$ be the splitting field of $x^4-2$ over $\mathbb{Q}$. It equals $\mathbb{Q}(\sqrt[4]{2},i)$. (a) Give $[\mathbb{E}:\mathbb{Q}]$. (b) Give the number of roots of $x^4-2$ in $\mathbb{E}$. (c) Give $[\mathbb{E}:\mathbb{Q}(\sqrt[4]{2})]$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 8; b = 4; c = 2'
            solution_sketch: 'The element $\sqrt[4]{2}$ has degree 4 over $\mathbb{Q}$. The element $i$ is not real, so it adds degree 2. So a = 4*2 = 8 and c = 2. The polynomial splits in $\mathbb{E}$, so b = 4.'
          # argument: Theorem 6.73
          - problem: 'Prove: take a field $\mathbb{F}$ with characteristic 0 and a root tower $\mathbb{F}=\mathbb{F}_1\subseteq\dots\subseteq\mathbb{F}_q$. Then some normal extension $\mathbb{E}$ of $\mathbb{F}$ holds $\mathbb{F}_q$ and has a root tower over $\mathbb{F}$.'
            answer_contract: {"kind":"written"}
            answer: 'Induct on q. Add to the normal extension of the shorter tower all roots of a product built from the images of w^m.'
            solution_sketch: 'For $q=1$, the field $\mathbb{F}$ splits $x-1$. For $q\ge2$, take a normal extension $\mathbb{F}''$ of $\mathbb{F}$ with a root tower that holds $\mathbb{F}_{q-1}$. Write $\mathbb{F}_q=\mathbb{F}_{q-1}(w)$ with $w^{m}\in\mathbb{F}_{q-1}$. Let $f$ be the product of $x^m-\sigma(w^m)$ over $G(\mathbb{F}''/\mathbb{F})$. Each automorphism permutes the factors, so $f$ has coefficients in $\mathbb{F}$. The splitting field of $f$ over $\mathbb{F}''$ is the splitting field of $f$ times the polynomial for $\mathbb{F}''$, so it is normal, has a root tower and holds $w$.'
        constraints: 'Practice items: decidable values and one written proof for each result.'
      - id: kp4
        name: 'Theorem 6.74 and Theorem 6.75: a polynomial solvable by radicals has a solvable Galois group'
        key_prerequisites: [fom-6-7-fundamental-theorem-galois-theory]
        exemplars:
          - problem: 'The Galois group of $x^3-2$ over $\mathbb{Q}$ is isomorphic to $S_3$. (a) Give the number of elements of this group. (b) Give 1 if the group is solvable and 0 if not. (c) Give the smallest number of steps in a nested sequence with commutative factors.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 6; b = 1; c = 2'
            solution_sketch: 'The group $S_3$ has 3! = 6 elements, so a = 6. The sequence $\{e\}\lhd A_3\lhd S_3$ has commutative factors, so b = 1. The group is not commutative, so 1 step is too few and c = 2.'
          - problem: 'The Galois group of $x^4-2$ over $\mathbb{Q}$ is isomorphic to the dihedral group of order 8. (a) Give the number of elements of this group. (b) Give 1 if the group is solvable and 0 if not. (c) Give the number of elements of order 2.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 8; b = 1; c = 5'
            solution_sketch: 'The group has 8 elements, so a = 8. A group of order 8 has a normal subgroup of order 4, and all factors are commutative, so b = 1. The rotation by half a turn and the 4 reflections have order 2, so c = 5.'
          - problem: 'The Galois group of $x^4+x^3+x^2+x+1$ over $\mathbb{Q}$ is isomorphic to $\mathbb{Z}_4$. (a) Give the number of elements of this group. (b) Give 1 if the group is solvable and 0 if not. (c) Give the smallest number of steps in a nested sequence with commutative factors.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 4; b = 1; c = 1'
            solution_sketch: 'The group $\mathbb{Z}_4$ has 4 elements, so a = 4. It is commutative, so the sequence $\{e\}\lhd\mathbb{Z}_4$ works. So b = 1 and c = 1.'
          - problem: 'Let $p$ be a polynomial over $\mathbb{Q}$ with the given Galois group. Give 1 if Theorem 6.75 proves that $p(x)=0$ is not solvable by radicals, and 0 if it proves nothing. (a) The Galois group is $A_5$. (b) The Galois group is $A_6$. (c) The Galois group is $S_4$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 1; c = 0'
            solution_sketch: 'Theorem 6.75 needs a solvable Galois group if the equation is solvable by radicals. The groups $A_5$ and $A_6$ are simple and not commutative, so they are not solvable, and a = 1, b = 1. The group $S_4$ is solvable, so Theorem 6.75 proves nothing and c = 0.'
          - problem: 'Look at a root tower with exponents $n_1=2$, $n_2=3$ and $n_3=5$. Let $n=n_1n_2n_3$ and let $\theta$ be a primitive $n$th root of unity. (a) Give $n$. (b) Give the number of primitive $n$th roots of unity. (c) Give the order of $\theta^6$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 30; b = 8; c = 5'
            solution_sketch: 'We have $n=2\cdot3\cdot5=30$, so a = 30. The exponents $k$ with $\gcd(k,30)=1$ are 1, 7, 11, 13, 17, 19, 23, 29, so b = 8. The order of $\theta^6$ is $30/\gcd(6,30)=30/6=5$, so c = 5.'
          - problem: 'Let $\mathbb{E}=\mathbb{Q}(\sqrt2,\sqrt3,\sqrt5)$ over $\mathbb{Q}$. (a) Give the number of elements of $G(\mathbb{E}/\mathbb{Q})$. (b) Give the number of elements of $G(\mathbb{E}/\mathbb{Q}(\sqrt2))$. (c) Give the number of elements of $G(\mathbb{E}/\mathbb{Q}(\sqrt2,\sqrt3))$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 8; b = 4; c = 2'
            solution_sketch: 'For a normal extension the group order equals the degree. The degrees are 8, 4 and 2. So a = 8, b = 4 and c = 2.'
          - problem: 'Let $\mathbb{E}$ be the splitting field of $x^3-2$ over $\mathbb{Q}$, with $[\mathbb{E}:\mathbb{Q}]=6$. Let $\theta$ be a primitive 6th root of unity. Then $\theta\in\mathbb{E}$, so $\mathbb{E}(\theta)=\mathbb{E}$. (a) Give the number of elements of $G(\mathbb{E}(\theta)/\mathbb{Q})$. (b) Give the number of elements of $G(\mathbb{E}(\theta)/\mathbb{Q}(\theta))$. (c) Give the number of elements of $G(\mathbb{Q}(\theta)/\mathbb{Q})$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 6; b = 3; c = 2'
            solution_sketch: 'The first group has 6 elements, so a = 6. The field $\mathbb{Q}(\theta)$ has degree 2, so $6/2=3$ and b = 3. The last group has 2 elements, which matches the quotient order 6/3 = 2, so c = 2.'
          # argument: Theorem 6.74
          - problem: 'Prove: take a field $\mathbb{F}$ with characteristic 0 and a normal extension $\mathbb{E}$ of $\mathbb{F}$ that has a root tower over $\mathbb{F}$. Then $G(\mathbb{E}/\mathbb{F})$ is solvable.'
            answer_contract: {"kind":"written"}
            answer: 'Adjoin a primitive root of unity to every field of the tower. Each step then has a commutative group, and Lemma 6.72 passes solvability to G(E/F).'
            solution_sketch: 'Let $\theta$ be a primitive $n$th root of unity with $n=n_1\cdots n_{q-1}$. By Theorem 6.70 each step $\mathbb{F}_j(\theta)$ over $\mathbb{F}_{j-1}(\theta)$ is normal with a commutative group. Corollary 6.60 makes $\mathbb{E}(\theta)$ normal over each $\mathbb{F}_j(\theta)$. The Fundamental Theorem of Galois Theory makes the groups $G(\mathbb{E}(\theta)/\mathbb{F}_j(\theta))$ a nested sequence with commutative factors. So $G(\mathbb{E}(\theta)/\mathbb{F})$ is solvable. Then $G(\mathbb{E}/\mathbb{F})$ is a quotient of it, so Lemma 6.72 makes it solvable.'
          # argument: Theorem 6.75
          - problem: 'Prove: take a field $\mathbb{F}$ with characteristic 0 and a polynomial $p$ with coefficients in $\mathbb{F}$ such that $p(x)=0$ is solvable by radicals. Then $p$ has a solvable Galois group.'
            answer_contract: {"kind":"written"}
            answer: 'Embed the root tower in a normal extension with a root tower. Its group is solvable, and the group of p is a quotient of it.'
            solution_sketch: 'Let $\mathbb{S}$ be the splitting field of $p$. A root tower over $\mathbb{F}$ has a top field that holds all roots of $p$. Theorem 6.73 gives a normal extension $\mathbb{E}\supseteq\mathbb{S}$ with a root tower. By Theorem 6.74, $G(\mathbb{E}/\mathbb{F})$ is solvable. The Fundamental Theorem of Galois Theory gives $G(\mathbb{S}/\mathbb{F})\cong G(\mathbb{E}/\mathbb{F})/G(\mathbb{E}/\mathbb{S})$. Lemma 6.72 makes this quotient solvable.'
          # source: FoM exercise 6.8-6-78
          - problem: 'Take a field $\mathbb{F}$ with characteristic 0 and a normal extension $\mathbb{E}$ with solvable group $G$. Use a nested sequence of normal subgroups with prime factor orders $p_j$, the fixed fields $\mathbb{F}_j$, a primitive $n$th root $\theta$ with $n=|G|$ and Exercises 6-70, 6-74 and 6-77. Prove: (a) each $\mathbb{F}_j$ is normal over $\mathbb{F}_{j-1}$ with group isomorphic to the $j$th factor. (b) $\mathbb{F}_j(\theta)$ is normal over $\mathbb{F}_{j-1}$ and over $\mathbb{F}_{j-1}(\theta)$. (c) Restriction to $\mathbb{F}_j$ is a homomorphism and is injective on $G(\mathbb{F}_j(\theta)/\mathbb{F}_{j-1}(\theta))$, so that group is cyclic of order dividing $p_jn$. (d) The fields $\mathbb{F}_j(\theta)$ form a root tower for $\mathbb{E}(\theta)$. (e) If the Galois group of $p$ is solvable, then $p(x)=0$ is solvable by radicals.'
            answer_contract: {"kind":"written"}
            answer: 'The Galois correspondence gives the tower. Restriction gives cyclic steps, and Exercise 6-74 turns each step into a root extension.'
            solution_sketch: 'Part (a) follows from the Fundamental Theorem of Galois Theory. Part (b) holds because adjoining $\theta$ to a normal extension keeps it normal. Part (c): restriction is a homomorphism, and its kernel on the subgroup is trivial by Exercise 6-70. Part (d): the field $\mathbb{F}_{j-1}(\theta)$ holds the needed roots of unity, so Exercise 6-74 gives $\mathbb{F}_j(\theta)=\mathbb{F}_{j-1}(\theta)(b)$ with $b^{k}$ in the lower field. Part (e): take $\mathbb{E}$ as the splitting field of $p$ and use Exercise 6-77 with part (d).'
        constraints: 'Practice items: decidable values and one written proof for each result.'
