      - id: kp1
        name: 'Definition 6.55 and Definition 6.56: products of subsets and cosets'
        key_prerequisites: [cosets]
        exemplars:
          - problem: 'In the group $(\mathbb{Z},+)$ let $A=\{1,2\}$ and $B=\{10,20\}$. The product $AB$ is the set $A+B$ of all sums $a+b$. (a) Count the elements of $A+B$. (b) Give the greatest element of $A+B$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"n","contract":{"kind":"exact"}},{"name":"m","contract":{"kind":"exact"}}]}
            answer: 'n = 4; m = 22'
            solution_sketch: 'The sums are 11, 21, 12 and 22. These are 4 different numbers, so the count is 4. The greatest sum is 22.'
          - problem: 'In the group $(\mathbb{Z}_6,+)$ let $H=\{0,3\}$. (a) Count the elements of the coset $1+H$. (b) Give the smallest element of $1+H$. (c) Count the different cosets of $H$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"n","contract":{"kind":"exact"}},{"name":"m","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'n = 2; m = 1; c = 3'
            solution_sketch: 'The coset $1+H$ is $\{1,4\}$. It has 2 elements and its smallest element is 1. The group has 6 elements and each coset has 2, so there are 3 cosets.'
          - problem: 'In the group $(\mathbb{Z},+)$ let $H=5\mathbb{Z}$. (a) Give the smallest nonnegative element of $13+H$. (b) Give 1 if $13+H=8+H$ and 0 if not. (c) Give 1 if $13+H=2+H$ and 0 if not.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 3; b = 1; c = 0'
            solution_sketch: 'The number 13 leaves remainder 3 modulo 5, so the smallest nonnegative element is 3. The difference $13-8=5$ lies in $H$, so the cosets are equal and the value is 1. The difference $13-2=11$ is not in $H$, so the cosets differ and the value is 0.'
          - problem: 'In the group $(\mathbb{Z}_{12},+)$ let $A=\{0,4,8\}$ and $B=\{0,6\}$. (a) Count the elements of $A+B$. (b) Give the sum of all elements of $A+B$ as an integer. (c) Give 1 if $A+B$ is a subgroup and 0 if not.'
            answer_contract: {"kind":"multipart","parts":[{"name":"n","contract":{"kind":"exact"}},{"name":"s","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'n = 6; s = 30; c = 1'
            solution_sketch: 'The set $A+B$ is $\{0,2,4,6,8,10\}$. It has 6 elements and their sum is 30. It holds all even residues, which form a subgroup, so the value is 1.'
          - problem: 'In $S_3$ let $H=\{\mathrm{id},(12)\}$ and $g=(13)$. Multiply permutations from right to left. (a) Count the elements that lie in both $gH$ and $Hg$. (b) Give 1 if $gH=Hg$ and 0 if not. (c) Count the different left cosets of $H$ in $S_3$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 0; c = 3'
            solution_sketch: 'The coset $gH$ is $\{(13),(123)\}$ and the coset $Hg$ is $\{(13),(132)\}$. They share only $(13)$, so the count is 1 and the cosets differ, which gives 0. The group has 6 elements and each coset has 2, so there are 3 left cosets.'
          - problem: 'In $S_4$ let $H=\{\mathrm{id},(12)\}$ and $g=(123)$. Multiply permutations from right to left. (a) Count the elements that lie in both $gH$ and $Hg$. (b) Give 1 if $gH=Hg$ and 0 if not. (c) Count the different left cosets of $H$ in $S_4$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 0; c = 12'
            solution_sketch: 'The coset $gH$ is $\{(123),(13)\}$ and the coset $Hg$ is $\{(123),(23)\}$. They share only $(123)$, so the count is 1 and the value in (b) is 0. The group has 24 elements and each coset has 2, so there are 12 left cosets.'
          - problem: 'In the group $(\mathbb{Z}_{12},+)$ let $H=\{0,4,8\}$. (a) Count the different cosets of $H$. (b) Give the smallest element of $7+H$. (c) Count the elements of $H+H$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"n","contract":{"kind":"exact"}},{"name":"m","contract":{"kind":"exact"}},{"name":"k","contract":{"kind":"exact"}}]}
            answer: 'n = 4; m = 3; k = 3'
            solution_sketch: 'The group has 12 elements and $H$ has 3, so there are 4 cosets. The coset $7+H$ is $\{7,11,3\}$ and its smallest element is 3. The sum $H+H$ equals $H$, so it has 3 elements.'
          # source: FoM exercise 6.7-6-54
          - problem: 'Prove: for subsets $A,B,C$ of a group $G$, let $AB=\{ab : a\in A,\ b\in B\}$. Then $(AB)C=A(BC)$, the set $\{e\}$ is neutral for this product, and $HH=H$ for each subgroup $H$ of $G$.'
            answer_contract: {"kind":"written"}
            answer: 'Both (AB)C and A(BC) hold exactly the products abc. For HH = H, closure gives HH inside H, and h = he puts H inside HH.'
            solution_sketch: 'Use Definition 6.55. An element of $(AB)C$ has the form $(ab)c$ and an element of $A(BC)$ has the form $a(bc)$. The group law makes these equal, so the two sets are equal. Since $ea=a=ae$, the set $\{e\}$ is neutral on both sides. If $H$ is a subgroup, closure gives $HH\subseteq H$. Each $h\in H$ equals $he$ with $e\in H$, so $H\subseteq HH$.'
          # source: FoM exercise 6.7-6-55
          - problem: 'Prove: let $H$ be a subgroup of a group $G$ and write $a\sim b$ when $ab^{-1}\in H$. Then $\sim$ is an equivalence relation on $G$, and its classes are the right cosets $Hg$.'
            answer_contract: {"kind":"written"}
            answer: 'Reflexive, symmetric and transitive follow from e, inverses and products in H. The relation a~b means a = hb for some h in H, so the class of b is Hb.'
            solution_sketch: 'Use Definition 6.56. Since $e\in H$, we get $a\sim a$. If $ab^{-1}\in H$ then its inverse $ba^{-1}$ lies in $H$, so $\sim$ is symmetric. If $ab^{-1}$ and $bc^{-1}$ lie in $H$, their product $ac^{-1}$ lies in $H$, so $\sim$ is transitive. Next, $a\sim b$ means $ab^{-1}=h$ with $h\in H$, that is $a=hb$. So the class of $b$ is the set of all $hb$, which equals the right coset $Hb$.'
          # source: FoM exercise 6.7-6-56
          - problem: 'Prove: in $S_4$ let $H=\{\mathrm{id},(12)\}$ and $g=(123)$. Multiply permutations from right to left. Then $gH\neq Hg$.'
            answer_contract: {"kind":"written"}
            answer: 'Compute both cosets. The coset gH holds g and (13), while Hg holds g and (23), so the two sets differ.'
            solution_sketch: 'Apply Definition 6.56. Compute $g(12)$: the point 1 goes to 2 and then to 3, the point 3 goes to 1, and 2 stays, so $g(12)=(13)$. Compute $(12)g$: the point 1 goes to 2 and then to 1, the point 2 goes to 3, and 3 goes to 2, so $(12)g=(23)$. Hence $gH=\{g,(13)\}$ and $Hg=\{g,(23)\}$. The element $(13)$ is not in $Hg$, so the two cosets differ.'
        constraints: 'Work with products AB of subsets of a group and with left and right cosets, and see that left and right cosets can differ.'
      - id: kp2
        name: 'Definition 6.57 and Lemma 6.58: normal subgroups and three equivalent forms'
        key_prerequisites: [normal-subgroups, cosets]
        exemplars:
          - problem: 'In the group $(\mathbb{Z}_8,+)$ let $H=\{0,4\}$. (a) Give 1 if $H$ is a normal subgroup and 0 if not. (b) Count the different cosets of $H$. (c) Give the smallest element of $3+H$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 4; c = 3'
            solution_sketch: 'The group is abelian, so $g+H=H+g$ for every $g$ and $H$ is normal, which gives 1. The group has 8 elements and $H$ has 2, so there are 4 cosets. The coset $3+H$ is $\{3,7\}$ and its smallest element is 3.'
          - problem: 'In $S_3$ let $N=\{\mathrm{id},(123),(132)\}$ and $H=\{\mathrm{id},(12)\}$. (a) Give 1 if $N$ is a normal subgroup and 0 if not. (b) Give 1 if $H$ is a normal subgroup and 0 if not. (c) Count the different left cosets of $N$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 0; c = 2'
            solution_sketch: 'The group $N$ has index 2, so each left coset equals the matching right coset and $N$ is normal, which gives 1. For $H$ and $g=(13)$ we get $gHg^{-1}=\{\mathrm{id},(23)\}$, which differs from $H$, so the value is 0. The group has 6 elements and $N$ has 3, so there are 2 left cosets.'
          - problem: 'In $S_3$ let $H=\{\mathrm{id},(12)\}$ and $g=(13)$. Multiply permutations from right to left. The set $gHg^{-1}$ holds $\mathrm{id}$ and one transposition $(x\,y)$ with $x<y$. (a) Give $x$. (b) Give $y$. (c) Count the elements that lie in both $gHg^{-1}$ and $H$. (d) Give 1 if $gHg^{-1}\subseteq H$ and 0 if not.'
            answer_contract: {"kind":"multipart","parts":[{"name":"x","contract":{"kind":"exact"}},{"name":"y","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}}]}
            answer: 'x = 2; y = 3; c = 1; d = 0'
            solution_sketch: 'Conjugation sends $(1\,2)$ to $(g(1)\,g(2))=(3\,2)$, so $x=2$ and $y=3$. The sets $gHg^{-1}$ and $H$ share only $\mathrm{id}$, so the count is 1. The transposition $(23)$ is not in $H$, so the value in (d) is 0.'
          - problem: 'In $S_3$ let $N=\{\mathrm{id},(123),(132)\}$, $g=(12)$ and $n=(123)$. Multiply permutations from right to left. (a) Give 1 if $gng^{-1}\in N$ and 0 if not. (b) Give 1 if $gng^{-1}=n$ and 0 if not. (c) Give 1 if $gng^{-1}=n^{-1}$ and 0 if not.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 0; c = 1'
            solution_sketch: 'Conjugation gives $gng^{-1}=(g(1)\,g(2)\,g(3))=(2\,1\,3)=(132)$. This element lies in $N$, so (a) is 1. It differs from $n$, so (b) is 0. It equals $n^{-1}=(132)$, so (c) is 1.'
          - problem: 'Count the elements of each quotient group. (a) The quotient of $(\mathbb{Z}_{20},+)$ by the subgroup generated by 4. (b) The quotient of $S_4$ by the normal subgroup $V=\{\mathrm{id},(12)(34),(13)(24),(14)(23)\}$. (c) The quotient of $S_4$ by $A_4$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 4; b = 6; c = 2'
            solution_sketch: 'The size of a quotient group is the size of the group divided by the size of the subgroup. In (a) the subgroup has 5 elements, so $20/5=4$. In (b) we get $24/4=6$. In (c) the subgroup $A_4$ has 12 elements, so $24/12=2$.'
          - problem: 'In $S_4$ let $V=\{\mathrm{id},(12)(34),(13)(24),(14)(23)\}$ and $g=(123)$. Multiply permutations from right to left. (a) Give 1 if $g\,(12)(34)\,g^{-1}\in V$ and 0 if not. (b) Let $H=\{\mathrm{id},(12)\}$. Give 1 if $g\,(12)\,g^{-1}\in H$ and 0 if not. (c) Give 1 if $V$ is a normal subgroup of $S_4$ and 0 if not.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 0; c = 1'
            solution_sketch: 'Conjugation gives $g\,(12)(34)\,g^{-1}=(23)(14)$, which lies in $V$, so (a) is 1. It gives $g\,(12)\,g^{-1}=(23)$, which is not in $H$, so (b) is 0. Conjugation permutes the three double transpositions, so $V$ is normal and (c) is 1.'
          # argument: Lemma 6.58
          - problem: 'Prove the first step: let $N$ be a normal subgroup of a group $G$, that is, $gN=Ng$ for all $g\in G$. Then $gNg^{-1}=N$ for all $g\in G$.'
            answer_contract: {"kind":"written"}
            answer: 'Multiply the equation gN = Ng on the right by g inverse. Then gNg^-1 = Ngg^-1 = N.'
            solution_sketch: 'Use Definition 6.57. Let $g\in G$, so $gN=Ng$. Multiply every element of both sets on the right by $g^{-1}$. The left side becomes $gNg^{-1}$. The right side becomes $Ngg^{-1}=N$.'
          # argument: Lemma 6.58
          - problem: 'Prove the second step: let $N$ be a subgroup of a group $G$ with $gNg^{-1}\subseteq N$ for all $g\in G$. Then $gN=Ng$ for all $g\in G$.'
            answer_contract: {"kind":"written"}
            answer: 'Use the inclusion for g and for g inverse to get N inside gNg^-1, so gNg^-1 = N. Then multiply on the right by g.'
            solution_sketch: 'Use Definition 6.57. Apply the inclusion to $g^{-1}$ to get $g^{-1}Ng\subseteq N$. Multiply on the left by $g$ and on the right by $g^{-1}$ to get $N\subseteq gNg^{-1}$. With the inclusion for $g$ this gives $gNg^{-1}=N$. Multiply on the right by $g$ to get $gN=Ng$.'
          # source: FoM exercise 6.7-6-57
          - problem: 'Prove: for a subgroup $N$ of a group $G$, these three statements are equivalent. (1) $gN=Ng$ for all $g\in G$. (2) $gNg^{-1}=N$ for all $g\in G$. (3) $gNg^{-1}\subseteq N$ for all $g\in G$.'
            answer_contract: {"kind":"written"}
            answer: 'Show 1 implies 2 and 2 implies 3, then 3 implies 1 by applying the inclusion to g inverse. Multiplying by g or g inverse moves between the forms.'
            solution_sketch: 'Use Definition 6.57 and Lemma 6.58. For (1) to (2), multiply $gN=Ng$ on the right by $g^{-1}$. For (2) to (3), an equality gives an inclusion. For (3) to (1), apply (3) to $g^{-1}$ and move back to get $gNg^{-1}=N$. Then multiply on the right by $g$ to get $gN=Ng$. Hence the three statements are equivalent.'
          # source: FoM exercise 6.7-6-59
          - problem: 'Prove: in $S_4$ let $H=\{\mathrm{id},(12)\}$, $a=(123)$, $a''=(123)(12)$, $b=(124)$ and $b''=(124)(12)$. Multiply permutations from right to left. Then $a''H=aH$ and $b''H=bH$, but $(ab)H\neq(a''b'')H$. So the rule $(gH)(kH)=(gk)H$ is not well defined for this non-normal $H$.'
            answer_contract: {"kind":"written"}
            answer: 'Show aH = a''H and bH = b''H, then compute ab and a''b''. Their quotient ab inverse times a''b'' is not in H, so (ab)H and (a''b'')H differ.'
            solution_sketch: 'Use Definition 6.56. We have $a''=a(12)$ and $b''=b(12)$, so $a''H=aH$ and $b''H=bH$. Compute $ab=(13)(24)$. Compute $a''b''=a(12)b(12)=(143)$. The product $(ab)^{-1}a''b''=(124)$ is not in $H$. So $(ab)H\neq(a''b'')H$ and the rule fails.'
        constraints: 'Decide if a subgroup is normal by the forms gN = Ng, gNg^-1 = N and gNg^-1 inside N.'
      - id: kp3
        name: 'Theorem 6.59, Corollary 6.60 and Theorem 6.61: quotient groups and the Fundamental Theorem of Galois Theory'
        key_prerequisites: [quotient-groups, normal-subgroups, fom-6-2-field-extensions-splitting-fields, fom-6-3-uniqueness-splitting-field, fom-6-4-field-automorphisms-galois-groups, fom-6-5-normal-field-extensions, fom-3-4-induction]
        exemplars:
          - problem: 'Let $N=\{0,4,8\}$ in $(\mathbb{Z}_{12},+)$. Use the quotient group $\mathbb{Z}_{12}/N$. (a) Count its elements. (b) Give the smallest element of the coset $(1+N)+(3+N)$. (c) Give the order of the element $1+N$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"n","contract":{"kind":"exact"}},{"name":"s","contract":{"kind":"exact"}},{"name":"o","contract":{"kind":"exact"}}]}
            answer: 'n = 4; s = 0; o = 4'
            solution_sketch: 'The group has 12 elements and $N$ has 3, so the quotient has 4 elements. The sum is $4+N=\{4,8,0\}$ and its smallest element is 0. The multiples of 1 reach $N$ first at 4, so the order is 4.'
          - problem: 'Use the quotient group $\mathbb{Z}/6\mathbb{Z}$ with cosets $k+6\mathbb{Z}$. (a) Count its elements. (b) Give the smallest nonnegative element of $(4+6\mathbb{Z})+(5+6\mathbb{Z})$. (c) Give the order of $2+6\mathbb{Z}$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"n","contract":{"kind":"exact"}},{"name":"s","contract":{"kind":"exact"}},{"name":"o","contract":{"kind":"exact"}}]}
            answer: 'n = 6; s = 3; o = 3'
            solution_sketch: 'The cosets are given by the remainders 0 to 5, so there are 6. The sum is $9+6\mathbb{Z}$ and $9$ leaves remainder 3, so the answer is 3. The multiples $2,4,6$ reach $6\mathbb{Z}$ at the third step, so the order is 3.'
          - problem: 'Let $N=\{\mathrm{id},(123),(132)\}$ in $S_3$ and use the quotient group $S_3/N$. (a) Count its elements. (b) Give the order of the element $(12)N$. (c) Give 1 if the group $S_3/N$ is abelian and 0 if not.'
            answer_contract: {"kind":"multipart","parts":[{"name":"n","contract":{"kind":"exact"}},{"name":"o","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'n = 2; o = 2; c = 1'
            solution_sketch: 'The group $S_3$ has 6 elements and $N$ has 3, so the quotient has 2 elements. The element $(12)N$ differs from $N$ and $(12)^2=\mathrm{id}$, so its order is 2. Every group with 2 elements is abelian, so (c) is 1.'
          - problem: 'Let $\mathbb{E}$ be a normal extension of $\mathbb{Q}$ with $[\mathbb{E}:\mathbb{Q}]=12$. Let $\mathbb{D}$ be an intermediate field with $[\mathbb{D}:\mathbb{Q}]=3$. (a) Give $[\mathbb{E}:\mathbb{D}]$. (b) Give 1 if $\mathbb{E}$ is a normal extension of $\mathbb{D}$ and 0 if not. (c) Give $|G(\mathbb{E}/\mathbb{D})|$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 4; b = 1; c = 4'
            solution_sketch: 'The tower law gives $[\mathbb{E}:\mathbb{D}]=12/3=4$. By Corollary 6.60 the field $\mathbb{E}$ is normal over $\mathbb{D}$, so (b) is 1. For a normal extension the group order equals the degree, so (c) is 4.'
          - problem: 'Take a normal extension $\mathbb{E}$ of $\mathbb{F}$, where $\mathbb{F}$ has characteristic 0, with $|G(\mathbb{E}/\mathbb{F})|=24$ and $G(\mathbb{E}/\mathbb{F})\cong S_4$. (a) Give $|G(\mathbb{E}/\mathbb{D})|$ for an intermediate field $\mathbb{D}$ with $[\mathbb{D}:\mathbb{F}]=6$. (b) Give $[\mathbb{D}:\mathbb{F}]$ for an intermediate field $\mathbb{D}$ with $|G(\mathbb{E}/\mathbb{D})|=3$. (c) Count the intermediate fields $\mathbb{D}$ with $[\mathbb{D}:\mathbb{F}]=2$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 4; b = 8; c = 1'
            solution_sketch: 'Part 2 of Theorem 6.61 gives $[\mathbb{D}:\mathbb{F}]=24/|G(\mathbb{E}/\mathbb{D})|$. So (a) is $24/6=4$ and (b) is $24/3=8$. Fields of degree 2 match subgroups of index 2, and $S_4$ has only one such subgroup, $A_4$, so (c) is 1.'
          - problem: 'Let $\mathbb{E}$ be a normal extension of $\mathbb{Q}$ with $G(\mathbb{E}/\mathbb{Q})\cong S_3$. (a) Count the intermediate fields $\mathbb{D}$ between $\mathbb{Q}$ and $\mathbb{E}$. (b) Count the intermediate fields that are normal extensions of $\mathbb{Q}$. (c) Give $[\mathbb{D}:\mathbb{Q}]$ for the normal intermediate field $\mathbb{D}$ with $\mathbb{D}\neq\mathbb{Q}$ and $\mathbb{D}\neq\mathbb{E}$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 6; b = 3; c = 2'
            solution_sketch: 'By Theorem 6.61 the intermediate fields match the subgroups of $S_3$. There are 6 subgroups: one of order 1, three of order 2, one of order 3 and one of order 6. Normal fields match normal subgroups, and $S_3$ has 3 of them. The middle one is $A_3$, so the degree is $6/3=2$.'
          # argument: Theorem 6.59
          - problem: 'Prove the first step: let $N$ be a normal subgroup of a group $G$. If $gN=g''N$ and $kN=k''N$, then $(gk)N=(g''k'')N$.'
            answer_contract: {"kind":"written"}
            answer: 'Write g'' = gn and k'' = km with n and m in N. Normality gives nk = kn'' with n'' in N, so g''k'' = gk n''m lies in gkN.'
            solution_sketch: 'Use Lemma 6.58. From $gN=g''N$ we get $g''=gn$ with $n\in N$. In the same way $k''=km$ with $m\in N$. Since $N$ is normal, $kN=Nk$, so $nk=kn''$ for some $n''\in N$. Then $g''k''=gnkm=gkn''m$ and $n''m\in N$. Hence $g''k''\in gkN$ and the two cosets are equal.'
          # argument: Theorem 6.59
          - problem: 'Prove the second step: let $N$ be a normal subgroup of a group $G$. Then the cosets of $N$ with the rule $(gN)(kN)=(gk)N$ form a group.'
            answer_contract: {"kind":"written"}
            answer: 'The rule is well defined by the first step. The coset N is neutral, g inverse N is inverse to gN, and associativity comes from G.'
            solution_sketch: 'Use Lemma 6.58 and the first step. The rule is an operation on cosets because it does not depend on the representatives. Associativity follows from $((gk)l)N=(g(kl))N$. The coset $N$ is neutral, since $(eN)(kN)=kN$. The coset $g^{-1}N$ is inverse to $gN$, since $(g^{-1}g)N=N$.'
          # source: FoM exercise 6.7-6-58
          - problem: 'Prove: let $N$ be a normal subgroup of a group $G$. Then the rule $(gN)(kN)=(gk)N$ makes the set of left cosets of $N$ a group. The set product of $gN$ and $kN$ equals the coset $(gk)N$.'
            answer_contract: {"kind":"written"}
            answer: 'For the set product use Nk = kN and NN = N to get gNkN = gkNN = gkN. The group laws then follow from the laws of G.'
            solution_sketch: 'Use Definition 6.55, Lemma 6.58 and Theorem 6.59. Normality gives $Nk=kN$. So $(gN)(kN)=g(Nk)N=g(kN)N=(gk)NN$. Since $NN=N$, the set product equals $(gk)N$. The set product does not depend on the representatives, so the rule is well defined. Associativity, the neutral coset $N$ and the inverse coset $g^{-1}N$ come from $G$.'
          # argument: Corollary 6.60
          - problem: 'Prove: suppose $\mathbb{E}$ is a normal extension of $\mathbb{F}$, where $\mathbb{F}$ has characteristic 0. Take a field $\mathbb{D}$ with $\mathbb{F}\subseteq\mathbb{D}\subseteq\mathbb{E}$. Then $\mathbb{E}$ is also a normal extension of $\mathbb{D}$.'
            answer_contract: {"kind":"written"}
            answer: 'E splits some polynomial over F. That polynomial also has its coefficients in D, so E is a splitting field over D and hence normal.'
            solution_sketch: 'Use Theorem 6.35. Its first part gives a polynomial $f$ over $\mathbb{F}$ such that $\mathbb{E}$ is the splitting field of $f$. Each polynomial over $\mathbb{F}$ is also a polynomial over $\mathbb{D}$. Hence $f$ is a polynomial over $\mathbb{D}$ and $\mathbb{E}$ is its splitting field over $\mathbb{D}$. The same theorem then makes $\mathbb{E}$ a normal extension of $\mathbb{D}$.'
          # argument: Theorem 6.61
          - problem: 'Prove the first step of part 1 of the Galois correspondence: take $\mathbb{F}$ with characteristic 0, take a normal extension $\mathbb{E}$ of $\mathbb{F}$, and take intermediate fields $\mathbb{D}_1,\mathbb{D}_2$ with $G(\mathbb{E}/\mathbb{D}_1)=G(\mathbb{E}/\mathbb{D}_2)$. Then $\mathbb{D}_1=\mathbb{D}_2$.'
            answer_contract: {"kind":"written"}
            answer: 'Corollary 6.60 makes E normal over both fields, so each field is the fixed field of its group. Equal groups have equal fixed fields.'
            solution_sketch: 'Use Corollary 6.60. It makes $\mathbb{E}$ normal over each $\mathbb{D}_i$. Then part 3 of Theorem 6.35 gives that $\mathbb{D}_i$ is the fixed field of its group $G(\mathbb{E}/\mathbb{D}_i)$ for $i=1,2$. The two groups are equal, so the two fixed fields are equal. Hence $\mathbb{D}_1=\mathbb{D}_2$.'
          # argument: Theorem 6.61
          - problem: 'Prove the second step of part 1 of the Galois correspondence: take $\mathbb{F}$ with characteristic 0 and take a normal extension $\mathbb{E}$ of $\mathbb{F}$. Each subgroup $H$ of $G(\mathbb{E}/\mathbb{F})$ equals $G(\mathbb{E}/\mathbb{D})$ for some intermediate field $\mathbb{D}$.'
            answer_contract: {"kind":"written"}
            answer: 'Let D be the fixed field of H, so H lies in G(E/D). A primitive element of E over D has degree at most |H|, so both groups have |H| elements.'
            solution_sketch: 'Use Proposition 6.30, Corollary 6.60 and Theorem 6.38. Let $\mathbb{D}$ be the fixed field of $H$, so $H\subseteq G(\mathbb{E}/\mathbb{D})$. Corollary 6.60, Proposition 6.13 and Theorem 6.25 give $\theta$ with $\mathbb{E}=\mathbb{D}(\theta)$. Theorem 6.38 gives $|G(\mathbb{E}/\mathbb{D})|=[\mathbb{E}:\mathbb{D}]\geq|H|$. The product of $x-\sigma(\theta)$ over all $\sigma\in H$ is fixed by $H$, so its coefficients lie in $\mathbb{D}$, and it has degree $|H|$. Hence $[\mathbb{E}:\mathbb{D}]\leq|H|$, so $H=G(\mathbb{E}/\mathbb{D})$.'
          # argument: Theorem 6.61
          - problem: 'Prove part 2 of the Galois correspondence: take $\mathbb{F}$ with characteristic 0, take a normal extension $\mathbb{E}$ of $\mathbb{F}$, and take an intermediate field $\mathbb{D}$. Then $[\mathbb{E}:\mathbb{D}]=|G(\mathbb{E}/\mathbb{D})|$ and $[\mathbb{D}:\mathbb{F}]=|G(\mathbb{E}/\mathbb{F})|/|G(\mathbb{E}/\mathbb{D})|$.'
            answer_contract: {"kind":"written"}
            answer: 'Corollary 6.60 makes E normal over D and over F, so each degree equals a group order. The tower law then divides the two degrees.'
            solution_sketch: 'Use Corollary 6.60 and Theorem 6.38. By Corollary 6.60, $\mathbb{E}$ is normal over $\mathbb{D}$. By Theorem 6.38, $|G(\mathbb{E}/\mathbb{D})|=[\mathbb{E}:\mathbb{D}]$ and $|G(\mathbb{E}/\mathbb{F})|=[\mathbb{E}:\mathbb{F}]$. The tower law gives $[\mathbb{D}:\mathbb{F}]=[\mathbb{E}:\mathbb{F}]/[\mathbb{E}:\mathbb{D}]$. Replace the degrees by the group orders.'
          # argument: Theorem 6.61
          - problem: 'Prove part 3 of the Galois correspondence: take $\mathbb{F}$ with characteristic 0, take a normal extension $\mathbb{E}$ of $\mathbb{F}$, and take intermediate fields $\mathbb{D}_1,\mathbb{D}_2$. Then $\mathbb{D}_1\subsetneq\mathbb{D}_2$ holds if and only if $G(\mathbb{E}/\mathbb{D}_2)\subsetneq G(\mathbb{E}/\mathbb{D}_1)$.'
            answer_contract: {"kind":"written"}
            answer: 'A map that fixes a larger field fixes the smaller one, so inclusion reverses. For the converse use fixed fields from Theorem 6.35 and part 1.'
            solution_sketch: 'Use Proposition 6.30, Corollary 6.60 and Theorem 6.35. If $\mathbb{D}_1\subseteq\mathbb{D}_2$, each automorphism fixing $\mathbb{D}_2$ fixes $\mathbb{D}_1$, so $G(\mathbb{E}/\mathbb{D}_2)\subseteq G(\mathbb{E}/\mathbb{D}_1)$. Part 1 turns $\mathbb{D}_1\neq\mathbb{D}_2$ into a proper inclusion. Conversely, assume $G(\mathbb{E}/\mathbb{D}_2)\subsetneq G(\mathbb{E}/\mathbb{D}_1)$. By Corollary 6.60 and Theorem 6.35, each $\mathbb{D}_i$ is the fixed field of its group. Every element of $\mathbb{D}_1$ is then fixed by the smaller group, so $\mathbb{D}_1\subseteq\mathbb{D}_2$, and part 1 gives $\mathbb{D}_1\neq\mathbb{D}_2$.'
          # argument: Theorem 6.61
          - problem: 'Prove the first direction of part 4 of the Galois correspondence: take $\mathbb{F}$ with characteristic 0, take a normal extension $\mathbb{E}$ of $\mathbb{F}$, and take an intermediate field $\mathbb{D}$ that is a normal extension of $\mathbb{F}$. Then $G(\mathbb{E}/\mathbb{D})$ is a normal subgroup of $G(\mathbb{E}/\mathbb{F})$.'
            answer_contract: {"kind":"written"}
            answer: 'Each automorphism of E over F maps D into D, since it sends zeros of polynomials over F to zeros. So the transform of an element of G(E/D) still fixes D.'
            solution_sketch: 'Use Lemma 6.58 and Theorem 6.25. Take $d\in\mathbb{D}$ and $\nu\in G(\mathbb{E}/\mathbb{F})$. Theorem 6.25 gives an irreducible polynomial $p$ over $\mathbb{F}$ with zero $d$. Then $\nu(d)$ is a zero of $p$ too, so $\nu(d)\in\mathbb{D}$. Let $\sigma\in G(\mathbb{E}/\mathbb{D})$ and $\gamma\in G(\mathbb{E}/\mathbb{F})$. Then $\gamma\sigma\gamma^{-1}$ fixes all $d\in\mathbb{D}$, so Lemma 6.58 shows that $G(\mathbb{E}/\mathbb{D})$ is normal.'
          # argument: Theorem 6.61
          - problem: 'Prove the second direction of part 4 of the Galois correspondence: take $\mathbb{F}$ with characteristic 0, take a normal extension $\mathbb{E}$ of $\mathbb{F}$, and take an intermediate field $\mathbb{D}$ such that $G(\mathbb{E}/\mathbb{D})$ is a normal subgroup of $G(\mathbb{E}/\mathbb{F})$. Then $\mathbb{D}$ is a normal extension of $\mathbb{F}$ and $G(\mathbb{D}/\mathbb{F})\cong G(\mathbb{E}/\mathbb{F})/G(\mathbb{E}/\mathbb{D})$.'
            answer_contract: {"kind":"written"}
            answer: 'Restriction to D maps G(E/F) onto G(D/F) with kernel G(E/D), which gives the quotient. The fixed field of G(D/F) is F, so D is normal.'
            solution_sketch: 'Use Theorem 6.59, Corollary 6.60 and Theorem 6.35. Normality of $G(\mathbb{E}/\mathbb{D})$ gives $\gamma(\mathbb{D})=\mathbb{D}$ for every $\gamma\in G(\mathbb{E}/\mathbb{F})$. So restriction to $\mathbb{D}$ maps $G(\mathbb{E}/\mathbb{F})$ to $G(\mathbb{D}/\mathbb{F})$ and respects products. Every element of $G(\mathbb{D}/\mathbb{F})$ extends to $\mathbb{E}$, so the map is onto. Its kernel is $G(\mathbb{E}/\mathbb{D})$, which gives the isomorphism with the quotient group. An element of $\mathbb{D}$ fixed by $G(\mathbb{D}/\mathbb{F})$ is fixed by $G(\mathbb{E}/\mathbb{F})$, so it lies in $\mathbb{F}$ and Theorem 6.35 gives normality.'
          # source: FoM exercise 6.7-6-60
          - problem: 'Prove: let $N$ be a subgroup of a group $G$. (a) $N$ is normal if and only if for all $g\in G$ and $n\in N$ there is $m\in N$ with $gn=mg$. (b) $N$ is normal if and only if $gng^{-1}\in N$ for all $g\in G$ and $n\in N$.'
            answer_contract: {"kind":"written"}
            answer: 'Part (a) gives gN inside Ng, and g inverse gives the reverse. Part (b) is the form gNg^-1 inside N of Lemma 6.58.'
            solution_sketch: 'Use Lemma 6.58. For (a), the condition means $gN\subseteq Ng$ for every $g$. Applying it to $g^{-1}$ gives the reverse inclusion, so $gN=Ng$. For (b), put $m=gng^{-1}$ and see that $gn=mg$. So (b) is the same as the third statement of Lemma 6.58. Hence both statements are equivalent to normality.'
          # source: FoM exercise 6.7-6-61
          - problem: 'Prove: let $\mathbb{F}\subseteq\mathbb{D}\subseteq\mathbb{E}$ be fields such that $\mathbb{E}$ is a normal extension of $\mathbb{F}$. Each $\gamma''\in G(\mathbb{D}/\mathbb{F})$ extends to some $\gamma\in G(\mathbb{E}/\mathbb{F})$ with $\gamma|_{\mathbb{D}}=\gamma''$.'
            answer_contract: {"kind":"written"}
            answer: 'E is a splitting field over D by Corollary 6.60. Lemma 6.23 extends the isomorphism gamma'' of D to an automorphism of E, which fixes F.'
            solution_sketch: 'Use Lemma 6.23 and Corollary 6.60. By Corollary 6.60, $\mathbb{E}$ is a splitting field of a polynomial over $\mathbb{D}$. Apply Lemma 6.23 to the isomorphism $\gamma''$ from $\mathbb{D}$ to $\mathbb{D}$. It gives an automorphism $\gamma$ of $\mathbb{E}$ with $\gamma|_{\mathbb{D}}=\gamma''$. Since $\gamma''$ fixes $\mathbb{F}$, the map $\gamma$ fixes $\mathbb{F}$ too.'
        constraints: 'Compute in quotient groups and use the match between intermediate fields and subgroups of the Galois group.'
      - id: kp4
        name: 'Proposition 6.62 to Proposition 6.65: even and odd permutations and the group A_n'
        key_prerequisites: [even-odd-permutations, fom-6-6-groups-s-n]
        exemplars:
          - problem: 'Give 1 if the permutation is even and 0 if it is odd. (a) $(123)$. (b) $(1234)$. (c) $(12)(34)$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 0; c = 1'
            solution_sketch: 'A cycle of length $k$ is a product of $k-1$ transpositions. The cycle $(123)$ needs 2, so (a) is 1. The cycle $(1234)$ needs 3, so (b) is 0. The product $(12)(34)$ has 2 transpositions, so (c) is 1.'
          - problem: '(a) Give the number of transpositions in the product that you get by writing the 5-cycle $(12345)$ as a product of transpositions with the fewest factors. (b) Give that number for $(12)(345)$. (c) Give 1 if $(12)(345)$ is even and 0 if it is odd.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 4; b = 3; c = 0'
            solution_sketch: 'A cycle of length $k$ needs $k-1$ transpositions. The 5-cycle needs 4. The product $(12)(345)$ needs $1+2=3$. The number 3 is odd, so (c) is 0.'
          - problem: '(a) Give $|A_4|$. (b) Give $|A_5|$. (c) Give the number of cosets of $A_6$ in $S_6$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 12; b = 60; c = 2'
            solution_sketch: 'Exactly half of the permutations in $S_n$ are even. So $|A_4|=24/2=12$ and $|A_5|=120/2=60$. The group $A_6$ has index 2 in $S_6$, so there are 2 cosets.'
          - problem: 'Count the permutations. (a) The 3-cycles in $S_5$. (b) The elements of $A_4$ that are products of two disjoint transpositions. (c) The 5-cycles in $S_5$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 20; b = 3; c = 24'
            solution_sketch: 'A 3-cycle in $S_5$ is set by a 3-element subset and 2 directions, so $10\cdot 2=20$. The double transpositions of $\{1,2,3,4\}$ are $(12)(34)$, $(13)(24)$ and $(14)(23)$, so there are 3. A 5-cycle is set by an ordering of 5 points up to rotation, which gives $4!=24$.'
          - problem: 'Let $\sigma$ be the permutation of $\{1,2,3,4,5\}$ with $\sigma(1)=2$, $\sigma(2)=3$, $\sigma(3)=1$, $\sigma(4)=5$ and $\sigma(5)=4$. (a) Give 1 if $\sigma$ is even and 0 if it is odd. (b) Give the fewest transpositions in a product equal to $\sigma$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"p","contract":{"kind":"exact"}},{"name":"m","contract":{"kind":"exact"}}]}
            answer: 'p = 0; m = 3'
            solution_sketch: 'The permutation is $(123)(45)$. The 3-cycle needs 2 transpositions and $(45)$ needs 1, so the fewest is 3. The number 3 is odd, so $\sigma$ is odd and (a) is 0.'
          - problem: 'Give 1 if the result is even and 0 if it is odd. (a) The product of $(12)(345)$ and $(1234)$. (b) The product of $(123)$ and $(12)$. (c) The inverse of $(12345)$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 0; c = 1'
            solution_sketch: 'The permutation $(12)(345)$ is odd and $(1234)$ is odd. The product of two odd permutations is even, so (a) is 1. The permutation $(123)$ is even and $(12)$ is odd, so their product is odd and (b) is 0. The inverse of a 5-cycle is a 5-cycle, which is even, so (c) is 1.'
          - problem: 'In $S_4$ let $\sigma=(12)$. (a) Count the elements of the coset $\sigma A_4$. (b) Give 1 if $\sigma A_4=A_4\sigma$ and 0 if not. (c) Give 1 if $(12)(13)(14)$ is even and 0 if it is odd.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 12; b = 1; c = 0'
            solution_sketch: 'A coset of $A_4$ has 12 elements, so (a) is 12. The subgroup $A_4$ has index 2, so it is normal and (b) is 1. The product has 3 transpositions, so it is odd and (c) is 0.'
          # argument: Proposition 6.62
          - problem: 'Prove the first step: suppose a permutation $\sigma\in S_n$ has one list of transpositions with an even length and another list with an odd length, whose product is $\sigma$ in both cases. Then the identity has a list of transpositions with an odd length.'
            answer_contract: {"kind":"written"}
            answer: 'Multiply the inverse of one list by the other list. The identity then gets a list of odd length.'
            solution_sketch: 'Write $\sigma=\tau_1\cdots\tau_{2k}$ and $\sigma=\rho_1\cdots\rho_{2l+1}$. Each transposition is its own inverse. So $\sigma^{-1}=\tau_{2k}\cdots\tau_1$. Then $\sigma^{-1}\sigma$ equals $\tau_{2k}\cdots\tau_1\rho_1\cdots\rho_{2l+1}$. This is the identity, written with $2k+2l+1$ transpositions, which is an odd number.'
          # argument: Proposition 6.62
          - problem: 'Prove the second step: no odd-length list of transpositions in $S_n$ has the identity as its product.'
            answer_contract: {"kind":"written"}
            answer: 'Take an odd list for the identity that is shortest and then minimal in the largest point b. Push two factors that hold b together to reach a contradiction.'
            solution_sketch: 'Suppose an odd product equals the identity. Pick one with the fewest factors $2m+1$. Among those, pick one where the largest number $b$ that occurs is smallest, and where $b$ occurs the fewest times. The number $b$ occurs at least twice. Move two transpositions that hold $b$ next to each other with the rule $(bc)(ac)=(ca)(ab)$. Two equal neighbors give a shorter product, and two different neighbors $(ab)(bc)=(ca)(ab)$ give fewer copies of $b$, a contradiction in both cases.'
          # argument: Proposition 6.64
          - problem: 'Prove: the even permutations of $S_n$ form a subgroup, called $A_n$.'
            answer_contract: {"kind":"written"}
            answer: 'The identity is a product of zero transpositions. Joining two even products gives an even product, and reversing an even product gives an even product.'
            solution_sketch: 'Use Definition 6.63. The identity is even, so it is in the set. Join two even lists of transpositions to get a product with an even number of transpositions. Reverse a product of transpositions to get the inverse, and the number of factors stays even. Hence the set is closed under products and inverses, so it is a subgroup.'
          # source: FoM exercise 6.7-6-62
          - problem: 'Prove: for each $n\geq 1$, the set of even permutations in $S_n$ contains the identity and is closed under products and inverses.'
            answer_contract: {"kind":"written"}
            answer: 'Count transpositions: the identity has none, a product adds the two counts, and an inverse reverses the same factors.'
            solution_sketch: 'Prove Proposition 6.64; Theorem 6.28 is the hint of the book. The identity has zero transpositions, which is even. If $\sigma$ and $\tau$ are products of $a$ and $b$ transpositions with $a,b$ even, then $\sigma\tau$ is a product of $a+b$ transpositions, which is even. The inverse of $\sigma$ is the product of the same transpositions in reverse order. So it also has $a$ factors. These three facts give the subgroup $A_n$.'
          # argument: Proposition 6.65
          - problem: 'Prove: for $n>1$, the subgroup $A_n$ is a normal subgroup of $S_n$.'
            answer_contract: {"kind":"written"}
            answer: 'By Proposition 6.62 each permutation is even or odd. Multiplying by an even permutation keeps the parity, and by an odd one swaps it, so gA = Ag.'
            solution_sketch: 'Use Proposition 6.62. Each permutation of $S_n$ is either even or odd. For $\sigma\in S_n$ the maps $\nu\mapsto\sigma\nu$ and $\nu\mapsto\nu\sigma$ are bijections on $S_n$. If $\sigma$ is even, they keep parity, so $\sigma A_n=A_n=A_n\sigma$. If $\sigma$ is odd, they swap parity, so $\sigma A_n=S_n\setminus A_n=A_n\sigma$. Hence $A_n$ is normal.'
          # source: FoM exercise 6.7-6-63
          - problem: 'Prove: let $n\geq 5$, let $N$ be a normal subgroup of $A_n$ and let $(123)\in N$. Then $N=A_n$.'
            answer_contract: {"kind":"written"}
            answer: 'Transform (123) by even permutations to reach every 3-cycle. Then Lemma 6.67 shows that the 3-cycles generate A_n.'
            solution_sketch: 'Use Lemma 6.67. Let $(abc)$ be a 3-cycle. Pick $\sigma\in S_n$ with $\sigma(1)=a$, $\sigma(2)=b$, $\sigma(3)=c$. If $\sigma$ is odd, replace it by $\sigma(xy)$ with $x,y$ outside $\{1,2,3\}$, which exists since $n\geq 5$. Now $\sigma$ is even and $\sigma(123)\sigma^{-1}=(abc)$ lies in $N$. So $N$ holds all 3-cycles, and Lemma 6.67 gives $N=A_n$.'
          # source: FoM exercise 6.7-6-64
          - problem: 'Prove: let $m\geq 2$ be an integer and $m\mathbb{Z}=\{mk : k\in\mathbb{Z}\}$. (a) $m\mathbb{Z}$ is a normal subgroup of $(\mathbb{Z},+)$. (b) $\mathbb{Z}/m\mathbb{Z}$ is isomorphic to $(\mathbb{Z}_m,+)$.'
            answer_contract: {"kind":"written"}
            answer: 'The group Z is abelian, so every subgroup is normal. The map k to k mod m is a homomorphism onto Z_m with kernel mZ.'
            solution_sketch: 'Use Theorem 6.59. Every subgroup of an abelian group is normal, and $m\mathbb{Z}$ is a subgroup. Define $\phi(k+m\mathbb{Z})=k \bmod m$. Two integers lie in the same coset exactly when they have the same remainder, so $\phi$ is well defined and injective. It is onto $\mathbb{Z}_m$ and respects addition, so it is an isomorphism.'
        constraints: 'Find the parity of a permutation from its cycles and count even permutations.'
      - id: kp5
        name: 'Definition 6.66 and Lemma 6.67: simple groups and 3-cycles'
        key_prerequisites: [simple-groups, even-odd-permutations, fom-6-6-groups-s-n]
        exemplars:
          - problem: 'A group is simple when its only normal subgroups are the one-element subgroup and the whole group. Give 1 if the group is simple and 0 if not. (a) $(\mathbb{Z}_5,+)$. (b) $(\mathbb{Z}_6,+)$. (c) $S_3$. (d) $A_3$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 0; c = 0; d = 1'
            solution_sketch: 'A group of prime order has only two subgroups, so (a) is 1 and (d) is 1. The group $\mathbb{Z}_6$ has the normal subgroup $\{0,3\}$, so (b) is 0. The group $S_3$ has the normal subgroup $A_3$, so (c) is 0.'
          - problem: 'Count the normal subgroups of each group. (a) $(\mathbb{Z}_7,+)$. (b) $(\mathbb{Z}_6,+)$. (c) $S_3$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 2; b = 4; c = 3'
            solution_sketch: 'In an abelian group every subgroup is normal. The group $\mathbb{Z}_7$ has 2 subgroups. The group $\mathbb{Z}_6$ has one subgroup of each order 1, 2, 3 and 6, so 4. The group $S_3$ has the one-element subgroup, $A_3$ and itself, so 3.'
          - problem: 'Give the fewest 3-cycles whose product equals the permutation. (a) $(12)(23)$. (b) $(12)(34)$. (c) $(12345)$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 2; c = 2'
            solution_sketch: 'We get $(12)(23)=(123)$, so (a) is 1. The product $(12)(34)$ moves 4 points and one 3-cycle moves 3, so at least 2 are needed, and $(12)(34)=(132)(134)$ gives 2. The 5-cycle $(12345)$ moves 5 points and equals $(123)(345)$, so (c) is 2.'
          - problem: 'Count the 3-cycles. (a) In $S_4$. (b) In $S_6$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}}]}
            answer: 'a = 8; b = 40'
            solution_sketch: 'A 3-cycle is set by a 3-element subset and 2 directions. In $S_4$ there are $4\cdot 2=8$. In $S_6$ there are $20\cdot 2=40$.'
          - problem: 'Let $A=\{1,3\}$ and $B=\{0,2,4,6\}$ in the group $(\mathbb{Z}_8,+)$. (a) Count the elements of $A+A$. (b) Count the elements of $B+B$. (c) Give 1 if $B$ is a subgroup and 0 if not. (d) Give 1 if $A$ is a subgroup and 0 if not.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}}]}
            answer: 'a = 3; b = 4; c = 1; d = 0'
            solution_sketch: 'The sums in $A+A$ are 2, 4 and 6, so (a) is 3. The sums in $B+B$ are all of $B$, so (b) is 4 and $B$ is closed. The set $B$ also holds 0 and the inverse of each element, so (c) is 1. The set $A$ lacks 0, so (d) is 0.'
          - problem: 'Look at the odd permutations of $S_4$. (a) Count them. (b) Give 1 if the identity is among them and 0 if not. (c) Give 1 if the product of two odd permutations is odd and 0 if it is even.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 12; b = 0; c = 0'
            solution_sketch: 'Half of the 24 permutations of $S_4$ are odd, so (a) is 12. The identity has zero transpositions, which is even, so (b) is 0. Two odd counts add to an even count, so (c) is 0.'
          - problem: 'In the group $(\mathbb{Z}_{12},+)$ let $M=\{0,4,8\}$ and $N=\{0,6\}$. (a) Count the elements of $M+N$. (b) Count the elements of $M\cap N$. In $S_4$ let $H=\{\mathrm{id},(12)\}$. (c) Count the elements of the largest normal subgroup of $S_4$ that lies inside $H$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 6; b = 1; c = 1'
            solution_sketch: 'The set $M+N$ is $\{0,2,4,6,8,10\}$, so (a) is 6. The only common element of $M$ and $N$ is 0, so (b) is 1. The normal subgroups of $S_4$ are the one-element subgroup, $V$, $A_4$ and $S_4$. Only the one-element subgroup lies inside $H$, so (c) is 1.'
          # argument: Lemma 6.67
          - problem: 'Prove: for $n\geq 3$, each even permutation of $\{1,\dots,n\}$ is a product of 3-cycles.'
            answer_contract: {"kind":"written"}
            answer: 'Split an even permutation into pairs of transpositions. Each pair is (ab)(ab) = (abc)(cba), (ab)(bc) = (abc) or (ab)(cd) = (acb)(acd).'
            solution_sketch: 'Use Definition 6.63. An even permutation splits into consecutive pairs of transpositions. Take one pair $\tau\mu$. If $\tau=\mu=(ab)$, then $\tau\mu=\mathrm{id}=(abc)(cba)$ with a third point $c$. If $\tau=(ab)$ and $\mu=(bc)$, then $\tau\mu=(abc)$. If $\tau=(ab)$ and $\mu=(cd)$ are disjoint, then $\tau\mu=(acb)(acd)$.'
          # source: FoM exercise 6.7-6-65
          - problem: 'Prove: let $G$ be a group and $H\subseteq G$, and put $H^{-1}=\{h^{-1} : h\in H\}$. (a) $H$ is a subgroup if and only if $H\neq\emptyset$, $HH\subseteq H$ and $H^{-1}\subseteq H$. (b) $H$ is a subgroup if and only if $H\neq\emptyset$, $HH=H$ and $H^{-1}=H$.'
            answer_contract: {"kind":"written"}
            answer: 'The conditions mean nonempty, closed under products and closed under inverses. Equality follows from h = he and h = (h^-1)^-1.'
            solution_sketch: 'Use Definition 6.55. A subgroup is nonempty and closed under products and inverses, which are the conditions in (a). Conversely, pick $h\in H$. Then $e=hh^{-1}\in HH\subseteq H$, so $H$ is a subgroup. For (b), the equalities imply the inclusions in (a). If $H$ is a subgroup, then $h=he$ gives $H\subseteq HH$, and $h=(h^{-1})^{-1}$ gives $H\subseteq H^{-1}$.'
          # source: FoM exercise 6.7-6-66
          - problem: 'Prove: for $n\geq 2$, the odd permutations of $S_n$ do not form a subgroup.'
            answer_contract: {"kind":"written"}
            answer: 'The identity is even, so it is not in the set. Also the product of two odd permutations is even.'
            solution_sketch: 'Use Definition 6.63. The identity is a product of zero transpositions, so it is even. A subgroup holds the identity. So the set of odd permutations is not a subgroup. As a second reason, the product of two odd permutations has an even number of transpositions.'
          # source: FoM exercise 6.7-6-67 part (a)
          - problem: 'Prove: let $M$ and $N$ be normal subgroups of a group $G$. Then the product $MN$ is a normal subgroup of $G$.'
            answer_contract: {"kind":"written"}
            answer: 'Show that conjugation by any g maps a product mn into MN, and MN is closed under products and inverses.'
            solution_sketch: 'Use Lemma 6.58 and Exercise 6-65. For $m\in M$ and $n\in N$, we have $g\,mn\,g^{-1}=(gmg^{-1})(gng^{-1})$, which lies in $MN$. Products and inverses of elements of $MN$ stay in $MN$ because $M$ and $N$ are normal. So $MN$ is a subgroup. It is normal by the conjugation step.'
          # source: FoM exercise 6.7-6-67 part (b)
          - problem: 'Prove: in $S_4$ let $H=\{\mathrm{id},(12)\}$ and $K=\{\mathrm{id},(23)\}$. Then the product $HK$ is not a subgroup of $S_4$.'
            answer_contract: {"kind":"written"}
            answer: 'HK has 4 elements and holds a 3-cycle, so a subgroup of order 4 cannot equal HK.'
            solution_sketch: 'Use Lemma 6.58 and Exercise 6-65. The set $HK$ holds $\mathrm{id}$, $(12)$, $(23)$ and $(12)(23)$. The product $(12)(23)$ is a 3-cycle of order 3. A group of order 4 has no element of order 3, because 3 does not divide 4. So $HK$ is not a subgroup.'
          # source: FoM exercise 6.7-6-67 part (c)
          - problem: 'Prove: let $\mathcal{N}$ be a family of normal subgroups of a group $G$. Then the set of all finite products of elements of members of $\mathcal{N}$ is a normal subgroup of $G$.'
            answer_contract: {"kind":"written"}
            answer: 'The set is closed under products and inverses. Conjugation maps each factor into a member of the family, so the set is normal.'
            solution_sketch: 'Use Lemma 6.58 and Exercise 6-65. The set holds $\mathrm{id}$ and is closed under products and inverses, so it is a subgroup. For a product $n_1\cdots n_k$, we have $g\,n_1\cdots n_k\,g^{-1}=(gn_1g^{-1})\cdots(gn_kg^{-1})$. Each factor lies in the same member of the family. So the set is normal.'
          # source: FoM exercise 6.7-6-67 part (d)
          - problem: 'Prove: let $H$ be a subgroup of a group $G$. Then $H$ holds a largest normal subgroup of $G$.'
            answer_contract: {"kind":"written"}
            answer: 'The product of all normal subgroups of G inside H is a normal subgroup inside H. It holds each other one.'
            solution_sketch: 'Use Lemma 6.58 and Exercise 6-65. Take the family of all normal subgroups of $G$ inside $H$. Its set of finite products is a normal subgroup of $G$ by the previous step. This subgroup lies inside $H$ because $H$ is closed under products. It holds every member of the family, so it is the largest.'
        constraints: 'Decide if a small group is simple, count 3-cycles and use the subgroup test with set products.'
      - id: kp6
        name: 'Theorem 6.68: A_n is simple for n at least 5'
        key_prerequisites: [simple-groups, even-odd-permutations, fom-6-6-groups-s-n]
        exemplars:
          - problem: 'In $S_5$ let $g=(12)(45)$ and $n=(123)$. Multiply permutations from right to left. The element $gng^{-1}$ is a 3-cycle $(1\,x\,y)$. (a) Give $x$. (b) Give $y$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"x","contract":{"kind":"exact"}},{"name":"y","contract":{"kind":"exact"}}]}
            answer: 'x = 3; y = 2'
            solution_sketch: 'Conjugation gives $gng^{-1}=(g(1)\,g(2)\,g(3))=(2\,1\,3)$. Written with 1 first, this is $(1\,3\,2)$. So $x=3$ and $y=2$.'
          - problem: 'Count the elements of $A_5$ of each kind. (a) The 3-cycles. (b) The products of two disjoint transpositions. (c) The 5-cycles.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 20; b = 15; c = 24'
            solution_sketch: 'There are 20 three-cycles. There are $\binom{5}{2}\binom{3}{2}/2=15$ products of two disjoint transpositions. There are 24 five-cycles. The total with the identity is $1+20+15+24=60=|A_5|$.'
          - problem: 'Let $N$ be a normal subgroup of $A_n$ that holds the 3-cycle $(123)$. Give $|N|$ for each $n$. (a) $n=5$. (b) $n=6$. (c) $n=7$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 60; b = 360; c = 2520'
            solution_sketch: 'For $n\geq 5$ a normal subgroup of $A_n$ with a 3-cycle is $A_n$. So $|N|=n!/2$. This gives $60$, $360$ and $2520$.'
          - problem: 'Give 1 if the group is simple and 0 if not. A group is simple when its only normal subgroups are the one-element subgroup and the whole group. (a) $A_4$. (b) $A_5$. (c) $A_7$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 0; b = 1; c = 1'
            solution_sketch: 'The group $A_4$ has the normal subgroup $V$ of order 4, so (a) is 0. For $n\geq 5$ the group $A_n$ is simple, so (b) is 1 and (c) is 1.'
          - problem: 'In $S_5$ let $\alpha=(12345)$ and $\beta=(123)$. Multiply permutations from right to left. Let $\gamma=(\alpha\beta\alpha^{-1})\beta^{-1}$. The permutation $\alpha\beta\alpha^{-1}$ is a 3-cycle. (a) Give the sum of the three numbers that it moves. (b) Count the points of $\{1,2,3,4,5\}$ that $\gamma$ fixes. (c) Give 1 if $\gamma$ is even and 0 if it is odd.'
            answer_contract: {"kind":"multipart","parts":[{"name":"s","contract":{"kind":"exact"}},{"name":"f","contract":{"kind":"exact"}},{"name":"e","contract":{"kind":"exact"}}]}
            answer: 's = 9; f = 2; e = 1'
            solution_sketch: 'Conjugation gives $\alpha\beta\alpha^{-1}=(\alpha(1)\,\alpha(2)\,\alpha(3))=(2\,3\,4)$, and the sum is 9. The product $\gamma=(234)(132)=(142)$ is a 3-cycle, so it moves 3 points and fixes 2. A 3-cycle is even, so (c) is 1.'
          - problem: 'Count the permutations. (a) The products of two disjoint transpositions in $S_5$. (b) The products of two disjoint transpositions in $A_6$. (c) The 3-cycles in $A_6$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 15; b = 45; c = 40'
            solution_sketch: 'In $S_5$ take 2 points, then 2 of the other 3, and halve for the order: $10\cdot 3/2=15$. In $A_6$ we get $15\cdot 6/2=45$. A 3-cycle is set by a 3-element subset and 2 directions, so $20\cdot 2=40$.'
          - problem: 'Count the normal subgroups of each group. (a) $A_5$. (b) $A_4$. (c) $S_5$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 2; b = 3; c = 3'
            solution_sketch: 'The group $A_5$ is simple, so it has 2 normal subgroups. The group $A_4$ has the one-element subgroup, $V$ and itself, so 3. The group $S_5$ has the one-element subgroup, $A_5$ and itself, so 3.'
          # argument: Theorem 6.68
          - problem: 'Prove the first step of the simplicity of $A_n$ for $n\geq 5$: if a normal subgroup $N$ of $A_n$ holds a 3-cycle, then $N=A_n$.'
            answer_contract: {"kind":"written"}
            answer: 'Transform the 3-cycle by even permutations to get (123), then reach every 3-cycle. Lemma 6.67 then gives N = A_n.'
            solution_sketch: 'Use Lemma 6.67. Let $(abc)\in N$. Pick an even permutation $\gamma$ that maps $a,b,c$ to $1,2,3$; if it is odd, multiply it by a transposition of two other points, which exists since $n\geq 5$. Then $\gamma(abc)\gamma^{-1}=(123)\in N$. Conjugation of $(123)$ in the same way gives every 3-cycle. So $N$ holds all 3-cycles, and $N=A_n$ by Lemma 6.67.'
          # argument: Theorem 6.68
          - problem: 'Prove the second step of the simplicity of $A_n$ for $n\geq 5$: let $N\neq\{\mathrm{id}\}$ be a normal subgroup of $A_n$. If some $\alpha\in N$ has a cycle of length at least 4, or has a 3-cycle among its disjoint cycles, then $N$ holds a 3-cycle.'
            answer_contract: {"kind":"written"}
            answer: 'Form alpha beta alpha inverse beta inverse with a short cycle beta. It lies in N and reduces to a 3-cycle in each case.'
            solution_sketch: 'Use Definition 6.66. Case 1: $\alpha=(ijkl\ldots)\gamma$ with a long cycle and $\beta=(ijk)$. The product $\alpha\beta\alpha^{-1}\beta^{-1}$ lies in $N$ and equals the 3-cycle $(ilj)$. Case 2: $\alpha=(ijk)(lm\ldots)\gamma$ and $\beta=(ijl)$. Then $\alpha\beta\alpha^{-1}\beta^{-1}$ lies in $N$ and equals a 5-cycle. Case 1 applied to that 5-cycle gives a 3-cycle in $N$.'
          # argument: Theorem 6.68
          - problem: 'Prove the third step of the simplicity of $A_n$ for $n\geq 5$: let $N$ be a normal subgroup of $A_n$ that holds an element $\alpha\neq\mathrm{id}$ whose disjoint cycles are all transpositions. Then $N$ holds a 3-cycle.'
            answer_contract: {"kind":"written"}
            answer: 'Put alpha = (ij)(kl)gamma and beta = (ijk) to get (ik)(jl) in N. Transform it with a fifth point m and multiply to get a 3-cycle.'
            solution_sketch: 'Use Definition 6.66. Write $\alpha=(ij)(kl)\gamma$ with $\gamma$ disjoint from $i,j,k,l$ and put $\beta=(ijk)$. Then $\alpha\beta\alpha^{-1}\beta^{-1}=(ik)(jl)$ lies in $N$. Since $n\geq 5$, pick a point $m$ outside $\{i,j,k,l\}$ and put $\delta=(ikm)$. Then $\delta(ik)(jl)\delta^{-1}=(km)(jl)$ lies in $N$. The product of $(ik)(jl)$ and $(km)(jl)$ is the 3-cycle $(ik)(km)$ on $i,k,m$, which lies in $N$.'
          # source: FoM exercise 6.7-6-68
          - problem: 'Prove: let $G$ be a group. (a) If $\mathcal{N}$ is a family of normal subgroups of $G$, then $\bigcap\mathcal{N}$ is a normal subgroup of $G$. (b) Each subgroup $H$ of $G$ lies inside a smallest normal subgroup of $G$.'
            answer_contract: {"kind":"written"}
            answer: 'An element that lies in every member stays in every member after conjugation. The smallest one is the intersection of all normal subgroups that hold H.'
            solution_sketch: 'Use Lemma 6.58. For (a), the intersection of subgroups is a subgroup. If $n$ lies in every member and $g\in G$, then $gng^{-1}$ lies in every member, so it lies in the intersection. For (b), take the family of all normal subgroups of $G$ that hold $H$; it is not empty since $G$ is in it. By (a) its intersection is normal, holds $H$ and lies inside every other such subgroup.'
          # source: FoM exercise 6.7-6-69 part (a)
          - problem: 'Prove: let $P$ and $Q$ be ordered sets. Let $f:P\to Q$ and $g:Q\to P$ reverse order. Let $gf(x)\geq x$ for all $x\in P$ and $fg(a)\geq a$ for all $a\in Q$. Then $fgf=f$ and $gfg=g$.'
            answer_contract: {"kind":"written"}
            answer: 'Apply f to the first inequality to get fgf(x) at most f(x). The second inequality with a=f(x) gives the other bound.'
            solution_sketch: 'Use the definition of a Galois connection. Apply $f$ to $x\leq gf(x)$. Since $f$ reverses order, this gives $fgf(x)\leq f(x)$. Take $a=f(x)$ in $fg(a)\geq a$ to get $fgf(x)\geq f(x)$. So $fgf=f$. The same steps with the roles of $f$ and $g$ swapped give $gfg=g$.'
          # source: FoM exercise 6.7-6-69 part (b)
          - problem: 'Prove: Let $P$ and $Q$ be ordered sets, let $f:P\to Q$ and $g:Q\to P$ reverse order, and let $gf(x)\geq x$ for all $x\in P$ and $fg(a)\geq a$ for all $a\in Q$. Then the restriction of $f$ to $g[Q]$ and the restriction of $g$ to $f[P]$ are bijections, and each is the inverse of the other.'
            answer_contract: {"kind":"written"}
            answer: 'For a in Q, part (a) gives gfg(a)=g(a), so g then f is the identity on g[Q]. The same steps give the identity on f[P].'
            solution_sketch: 'Use part (a): $fgf=f$ and $gfg=g$. Take $x=g(a)$ in $g[Q]$. Then $gf(x)=gfg(a)=g(a)=x$, so $g$ undoes $f$ on $g[Q]$. In the same way $fg(y)=y$ for each $y$ in $f[P]$. The map $f$ sends $g[Q]$ into $f[P]$ and $g$ sends $f[P]$ into $g[Q]$. So both restrictions are bijections and inverse to each other.'
          # source: FoM exercise 6.7-6-69 part (c)
          - problem: 'Prove: Let $P$ and $Q$ be ordered sets, let $f:P\to Q$ and $g:Q\to P$ reverse order, and let $gf(x)\geq x$ for all $x\in P$ and $fg(a)\geq a$ for all $a\in Q$. Then for each $q\in f[P]$ the set $f^{-1}(q)$ has a largest element. Also for each $p\in g[Q]$ the set $g^{-1}(p)$ has a largest element.'
            answer_contract: {"kind":"written"}
            answer: 'With q=f(x), g(q) lies in the preimage of q, and each y in it has y at most gf(y)=g(q). The same steps work for g.'
            solution_sketch: 'Use part (a). Write $q=f(x)$. Then $f(g(q))=fgf(x)=q$, so $g(q)\in f^{-1}(q)$. Let $y\in f^{-1}(q)$. Then $y\leq gf(y)=g(q)$, so $g(q)$ is the largest element. Swap $f$ and $g$ for the second statement.'
          # source: FoM exercise 6.7-6-69 part (d)
          - problem: 'Prove: Let $P$ and $Q$ be ordered sets, let $f:P\to Q$ and $g:Q\to P$ reverse order, and let $gf(x)\geq x$ for all $x\in P$ and $fg(a)\geq a$ for all $a\in Q$. Then for each $p\in P$ the element $gf(p)$ is the smallest element of $\{x\in g[Q] : x\geq p\}$. State and prove the matching statement for each $q\in Q$.'
            answer_contract: {"kind":"written"}
            answer: 'gf(p) lies in g[Q] above p, and each x in g[Q] above p has x=gf(x) above gf(p) because f reverses order. The match is fg(q) in f[P].'
            solution_sketch: 'Use part (a). The element $gf(p)$ lies in $g[Q]$ and $gf(p)\geq p$. Let $x=g(a)\in g[Q]$ with $x\geq p$. Then $f(x)\leq f(p)$, so $g(f(x))\geq gf(p)$. Part (b) gives $gf(x)=x$, so $x\geq gf(p)$. The matching statement is that $fg(q)$ is the smallest element of $\{y\in f[P] : y\geq q\}$, with the same proof.'
          # source: FoM exercise 6.7-6-69 part (e)
          - problem: 'Prove: Let $P$ and $Q$ be ordered sets, let $f:P\to Q$ and $g:Q\to P$ reverse order, and let $gf(x)\geq x$ for all $x\in P$ and $fg(a)\geq a$ for all $a\in Q$. Then for each $p\in P$ the element $f(p)$ is the largest $q\in Q$ with $g(q)\geq p$. State and prove the matching statement for each $q\in Q$.'
            answer_contract: {"kind":"written"}
            answer: 'Since gf(p) is above p, f(p) qualifies. If g(q) is above p, applying f gives q below fg(q), which is below f(p).'
            solution_sketch: 'Use the definition of a Galois connection. Since $gf(p)\geq p$, the element $f(p)$ has the property. Let $q\in Q$ with $g(q)\geq p$. Applying $f$ gives $fg(q)\leq f(p)$. Also $q\leq fg(q)$, so $q\leq f(p)$. The matching statement is that $g(q)$ is the largest $p\in P$ with $f(p)\geq q$, with the same proof.'
          # source: FoM exercise 6.7-6-69 part (f)
          - problem: 'Prove: Take a field $\mathbb{F}$ of characteristic 0 and a normal extension $\mathbb{E}$ of $\mathbb{F}$. Let $P$ hold all fields $\mathbb{D}$ with $\mathbb{F}\subseteq\mathbb{D}\subseteq\mathbb{E}$ and let $Q$ be the set of subgroups of $G(\mathbb{E}/\mathbb{F})$. Let $f:P\to Q$ be given by $f(\mathbb{D})=G(\mathbb{E}/\mathbb{D})$ and let $g:Q\to P$ be the inverse of $f$. Order $P$ and $Q$ by inclusion. Then $(f,g)$ is a Galois connection, where this means that $f$ and $g$ reverse order, $gf(x)\geq x$ for all $x\in P$ and $fg(a)\geq a$ for all $a\in Q$..'
            answer_contract: {"kind":"written"}
            answer: 'A bigger field has fewer automorphisms, so f reverses order. Theorem 6.61 makes f a bijection, so g reverses order and gf and fg are identities.'
            solution_sketch: 'Use Theorem 6.61. If $\mathbb{D}_1\subseteq\mathbb{D}_2$, then each automorphism that fixes $\mathbb{D}_2$ fixes $\mathbb{D}_1$, so $f(\mathbb{D}_2)\subseteq f(\mathbb{D}_1)$. By part 1 of Theorem 6.61, $f$ is a bijection. The inverse $g$ also reverses order, because $f$ and $g$ are inverse bijections of the same kind. Now $gf(\mathbb{D})=\mathbb{D}$ and $fg(H)=H$. So both inequalities hold with equality.'
          # source: FoM exercise 6.7-6-69 part (g)
          - problem: 'Prove: Take a field $\mathbb{F}$ of characteristic 0 and a normal extension $\mathbb{E}$ of $\mathbb{F}$. Let $P$ hold all fields $\mathbb{D}$ with $\mathbb{F}\subseteq\mathbb{D}\subseteq\mathbb{E}$ and let $Q$ be the set of subgroups of $G(\mathbb{E}/\mathbb{F})$. Order $P$ and $Q$ by inclusion. Let $f(\mathbb{D})$ be the largest normal subgroup of $G(\mathbb{E}/\mathbb{F})$ inside $G(\mathbb{E}/\mathbb{D})$. Let $N_H$ be the smallest normal subgroup of $G(\mathbb{E}/\mathbb{F})$ that holds $H$, and put $g(H)$ equal to the field that $N_H$ fixes. Then $(f,g)$ is a Galois connection, that is,  $f$ and $g$ reverse order, $gf(x)\geq x$ for all $x\in P$ and $fg(a)\geq a$ for all $a\in Q$..'
            answer_contract: {"kind":"written"}
            answer: 'Both maps reverse order, and the fixed field of f(D) holds D. Also fg(H) is the normal closure of H, which holds H.'
            solution_sketch: 'Use Exercise 6-67d, Exercise 6-68b and Theorem 6.61. If $\mathbb{D}_1\subseteq\mathbb{D}_2$, then $G(\mathbb{E}/\mathbb{D}_2)\subseteq G(\mathbb{E}/\mathbb{D}_1)$, so $f(\mathbb{D}_2)\subseteq f(\mathbb{D}_1)$. If $H_1\subseteq H_2$, the normal closures keep this inclusion, so $g$ reverses order. The subgroup $f(\mathbb{D})$ lies inside $G(\mathbb{E}/\mathbb{D})$ and is normal, so $gf(\mathbb{D})$ is the fixed field of $f(\mathbb{D})$ and holds $\mathbb{D}$. For $H$ with normal closure $M$, $fg(H)=M\supseteq H$ by Theorem 6.61.'
          # source: FoM exercise 6.7-6-69 part (h)
          - problem: 'Prove or refute: Take a field $\mathbb{F}$ of characteristic 0 and a normal extension $\mathbb{E}$ of $\mathbb{F}$. Let $P$ hold all fields $\mathbb{D}$ with $\mathbb{F}\subseteq\mathbb{D}\subseteq\mathbb{E}$ and let $Q$ be the set of subgroups of $G(\mathbb{E}/\mathbb{F})$. Order $P$ and $Q$ by reversed inclusion, so $x\leq y$ means $x\supseteq y$. Let $f(\mathbb{D})$ be the smallest normal subgroup of $G(\mathbb{E}/\mathbb{F})$ that holds $G(\mathbb{E}/\mathbb{D})$. Let $g(H)$ be the fixed field of $H$. Then $(f,g)$ is a Galois connection.'
            answer_contract: {"kind":"written"}
            answer: 'Refuted: for the splitting field of x^3-2 over Q and a subgroup H of order 2 in S_3, fg(H)=S_3, so the needed inclusion of S_3 in H fails.'
            solution_sketch: 'The statement is false. Take $\mathbb{F}=\mathbb{Q}$ and $\mathbb{E}$ the splitting field of $x^3-2$, so $G(\mathbb{E}/\mathbb{F})\cong S_3$ by Theorem 6.61. For a subgroup $H$ of order 2, $G(\mathbb{E}/g(H))=H$, so $fg(H)=S_3$. The condition $fg(H)\geq H$ means $fg(H)\subseteq H$ in this order. It fails because $S_3\not\subseteq H$.'
        constraints: 'Compute transforms of cycles and count elements of A_n by cycle type.'
    diagnostic_exemplar:
      problem: 'In the group $(\mathbb{Z}_{10},+)$ let $H=\{0,5\}$. Give the number of elements of the coset $3+H$.'
      answer_contract: {"kind":"exact"}
      answer: '2'
      solution_sketch: 'The coset $3+H$ is $\{3,8\}$. It has 2 elements, so the answer is 2.'
