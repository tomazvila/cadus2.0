      - id: kp1
        name: 'Definition 6.15: linear combinations, independence, bases and finite extensions'
        key_prerequisites: [fom-5-9-beyond-fields-vector-spaces]
        exemplars:
          - problem: 'Work in $\mathbb{R}$ over $\mathbb{Q}$ with $a_1=1$ and $a_2=\sqrt2$. Write each number as $\lambda_1a_1+\lambda_2a_2$ with rational $\lambda_1,\lambda_2$. Give (a) $\lambda_1$ for $(1+\sqrt2)^2$, (b) $\lambda_2$ for $(1+\sqrt2)^2$, (c) $\lambda_1$ for $(2+\sqrt2)(3-\sqrt2)$, (d) $\lambda_2$ for $(2+\sqrt2)(3-\sqrt2)$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}}]}
            answer: 'a = 3; b = 2; c = 4; d = 1'
            solution_sketch: 'Expand with $\sqrt2^2=2$. Then $(1+\sqrt2)^2=3+2\sqrt2$, so (a) is 3 and (b) is 2. Also $(2+\sqrt2)(3-\sqrt2)=6-2\sqrt2+3\sqrt2-2=4+\sqrt2$, so (c) is 4 and (d) is 1.'
          - problem: 'Work in $\mathbb{C}$ over $\mathbb{R}$ with $a_1=1$ and $a_2=i$. Write each number as $\lambda_1+\lambda_2i$ with real $\lambda_1,\lambda_2$. Give (a) $\lambda_1$ for $(2+3i)(1-i)$, (b) $\lambda_2$ for $(2+3i)(1-i)$, (c) $\lambda_1$ for $(1+i)^4$, (d) $\lambda_2$ for $(1+i)^4$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}}]}
            answer: 'a = 5; b = 1; c = -4; d = 0'
            solution_sketch: 'Expand with $i^2=-1$. Then $(2+3i)(1-i)=2-2i+3i+3=5+i$, so (a) is 5 and (b) is 1. Also $(1+i)^2=2i$ and $(2i)^2=-4$, so $(1+i)^4=-4+0i$. Hence (c) is -4 and (d) is 0.'
          - problem: 'Take sets of complex numbers over $\mathbb{R}$. For each set, give 1 if the set is linearly independent over $\mathbb{R}$ and 0 if it is not. (a) $\{1,i\}$. (b) $\{1,2\}$. (c) $\{i,2i\}$. (d) $\{1,1+i\}$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 0; c = 0; d = 1'
            solution_sketch: 'In (b) the combination $2\cdot1-1\cdot2=0$ uses nonzero coefficients, so the value is 0. In (c) the combination $2\cdot i-1\cdot(2i)=0$ does the same, so the value is 0. In (a) and (d) the equation $\lambda_1+\lambda_2 z=0$ with $z\notin\mathbb{R}$ forces $\lambda_2=0$ and then $\lambda_1=0$. So (a) and (d) get 1.'
          - problem: 'Give the number of elements of a basis of each field over the given field. (a) $\mathbb{C}$ over $\mathbb{R}$. (b) $\mathbb{R}$ over $\mathbb{R}$. (c) The field $\{a+b\sqrt2+c\sqrt3+d\sqrt6 : a,b,c,d\in\mathbb{Q}\}$ over $\mathbb{Q}$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 2; b = 1; c = 4'
            solution_sketch: 'The set $\{1,i\}$ is a basis in (a), so the count is 2. The set $\{1\}$ is a basis in (b), so the count is 1. In (c) the set $\{1,\sqrt2,\sqrt3,\sqrt6\}$ is a basis, so the count is 4.'
          - problem: 'Let $x=2+\sqrt2$ and $y=1-3\sqrt2$. Write $x+y$ and $xy$ as $\lambda_1+\lambda_2\sqrt2$ with rational $\lambda_1,\lambda_2$. Give (a) $\lambda_1$ of $x+y$, (b) $\lambda_2$ of $x+y$, (c) $\lambda_1$ of $xy$, (d) $\lambda_2$ of $xy$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}}]}
            answer: 'a = 3; b = -2; c = -4; d = -5'
            solution_sketch: 'The sum is $3-2\sqrt2$, so (a) is 3 and (b) is -2. The product is $2-6\sqrt2+\sqrt2-3\cdot2=-4-5\sqrt2$. So (c) is -4 and (d) is -5.'
          - problem: 'In $\mathbb{C}$ over $\mathbb{R}$, the set $\{2+3i,\ 4+ti\}$ with real $t$ is linearly dependent. (a) Give $t$. (b) Give the real number $\lambda$ with $4+ti=\lambda(2+3i)$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}}]}
            answer: 'a = 6; b = 2'
            solution_sketch: 'A dependent pair of two nonzero numbers has one number as a real multiple of the other. The real part gives $4=2\lambda$, so $\lambda=2$. Then $t=3\lambda=6$.'
          # source: FoM exercise 6.3-6-18
          - problem: 'Prove: Take fields $F\subseteq E$ and a basis $\{a_1,\dots,a_n\}$ of $E$ over $F$. Each $e\in E$ has exactly one list of coefficients $\lambda_j\in F$ with $e=\sum_{j=1}^n\lambda_ja_j$.'
            answer_contract: {"kind":"written"}
            answer: 'Two coefficient lists for the same e give a combination of the a_j equal to 0. Independence forces every difference to be 0.'
            solution_sketch: 'Existence follows from the basis property in Definition 6.15. Take two lists lambda_j and mu_j with the same sum e. Subtract: the sum of (lambda_j - mu_j) a_j is 0. Linear independence of the a_j gives lambda_j - mu_j = 0 for every j. Hence the two lists are equal.'
          # source: FoM exercise 6.3-6-27
          - problem: 'Prove: Let $B$ be a finite basis of $E$ over $F$ and let $L\subseteq E$ be linearly independent over $F$ with $|L|=|B|$. Then $L$ is a basis of $E$ over $F$.'
            answer_contract: {"kind":"written"}
            answer: 'If L is not a basis, add an element outside the span of L. This gives an independent set with more elements than B, which no independent set has.'
            solution_sketch: 'Suppose L is not a basis. Then some e in E is not an F-combination of the elements of L. The set L plus e is linearly independent and has |B|+1 elements. By Theorem 5.75 no independent set has more than |B| elements. This is a contradiction. So L spans E and is a basis.'
        constraints: 'Write numbers in a basis, decide independence and count basis elements; the items vary the fields and the numbers.'
