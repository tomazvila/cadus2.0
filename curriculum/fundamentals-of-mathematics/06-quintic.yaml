      - id: kp1
        name: 'Lemma 6.76: the meet of two normal subgroups'
        key_prerequisites: [fom-6-7-fundamental-theorem-galois-theory]
        exemplars:
          - problem: 'Work in $G=\mathbb{Z}_{12}$. Let $H$ be the subgroup generated by $[2]$ and let $N$ be the subgroup generated by $[3]$. (a) Give $|H|$. (b) Give $|N|$. (c) Give $|H\cap N|$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 6; b = 4; c = 2'
            solution_sketch: 'Here $H=\{0,2,4,6,8,10\}$, so a = 6. Here $N=\{0,3,6,9\}$, so b = 4. The common elements are 0 and 6, so c = 2.'
          - problem: 'Work in $G=\mathbb{Z}_{30}$. (a) Give $|\langle[6]\rangle\cap\langle[10]\rangle|$. (b) Give $|\langle[2]\rangle\cap\langle[3]\rangle|$. (c) Give $|\langle[5]\rangle\cap\langle[15]\rangle|$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 5; c = 2'
            solution_sketch: 'The group $\langle[6]\rangle$ has 5 elements and $\langle[10]\rangle$ has 3, with only 0 in common, so a = 1. The group $\langle[2]\rangle$ has 15 elements and $\langle[3]\rangle$ has 10. Their meet is $\langle[6]\rangle$ with 5 elements, so b = 5. Since $[15]=3[5]$, the group $\langle[15]\rangle$ with 2 elements lies inside $\langle[5]\rangle$, so c = 2.'
          - problem: 'Work in $G=S_3$. Let $A_3$ be the subgroup of even permutations. (a) Give $|A_3\cap S_3|$. (b) Give $|A_3\cap\{\mathrm{id}\}|$. (c) Give 1 if $A_3\cap S_3$ is normal in $S_3$ and 0 if not.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 3; b = 1; c = 1'
            solution_sketch: 'The meet of $A_3$ with $S_3$ is $A_3$, which has 3 elements, so a = 3. The meet with $\{\mathrm{id}\}$ is $\{\mathrm{id}\}$, so b = 1. Lemma 6.76 makes $A_3\cap S_3$ normal in $S_3$, so c = 1.'
          - problem: 'Work in $G=S_4$. Let $V_4$ be the Klein four-group. Both $A_4$ and $V_4$ are normal in $G$. (a) Give $|A_4\cap V_4|$. (b) Give $|A_4\cap S_4|$. (c) Give the index $[A_4:A_4\cap V_4]$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 4; b = 12; c = 3'
            solution_sketch: 'Every element of $V_4$ is even, so $A_4\cap V_4=V_4$ with 4 elements and a = 4. Also $A_4\cap S_4=A_4$ with 12 elements, so b = 12. Then $12/4=3$ gives c = 3.'
          - problem: 'Work in $S_4$ with $x=(1\,2)$ and $y=(1\,3)(2\,4)$. Here $y$ lies in the Klein four-group $V_4=\{\mathrm{id},(1\,2)(3\,4),(1\,3)(2\,4),(1\,4)(2\,3)\}$. (a) Give the image of 1 under $xyx^{-1}$. (b) Give the image of 2 under $xyx^{-1}$. (c) Give 1 if $xyx^{-1}$ lies in $V_4$ and 0 if not.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 4; b = 3; c = 1'
            solution_sketch: 'Conjugation by $x$ swaps the labels 1 and 2 in $y$. So $xyx^{-1}=(2\,3)(1\,4)$. It sends 1 to 4, so a = 4. It sends 2 to 3, so b = 3. This is the element $(1\,4)(2\,3)$ of $V_4$, so c = 1.'
          - problem: 'Count normal subgroups. (a) Give the number of normal subgroups of $S_3$. (b) Give the number of normal subgroups of $\mathbb{Z}_6$. (c) Give the number of normal subgroups of $S_3$ that lie inside $A_3$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 3; b = 4; c = 2'
            solution_sketch: 'The normal subgroups of $S_3$ are $\{\mathrm{id}\}$, $A_3$ and $S_3$, so a = 3. Every subgroup of $\mathbb{Z}_6$ is normal, and 6 has 4 divisors, so b = 4. Inside $A_3$ lie $\{\mathrm{id}\}$ and $A_3$, so c = 2.'
          # argument: Lemma 6.76
          - problem: 'Prove: let $G$ be a group and let $H$ and $N$ be normal subgroups of $G$. Then $H\cap N$ is a normal subgroup of $N$.'
            answer_contract: {"kind":"written"}
            answer: 'H meet N is a subgroup. Conjugating an element of it by x in N stays in H because H is normal, and stays in N because N is a group.'
            solution_sketch: 'An intersection of two subgroups is a subgroup. Let $x\in N$ and $y\in H\cap N$. Since $H$ is normal in $G$, $xyx^{-1}\in H$. Since $N$ is a group, $xyx^{-1}\in N$. So $xyx^{-1}\in H\cap N$ for every $x\in N$, and Lemma 6.58 gives that $H\cap N$ is normal in $N$.'
        constraints: 'Practice items: decidable values and one written proof for each result.'
      - id: kp2
        name: 'Theorem 6.77: the group S_n is not solvable for n at least 5'
        key_prerequisites: [fom-6-7-fundamental-theorem-galois-theory]
        exemplars:
          - problem: 'Compare the symmetric group and the alternating group on 5 points. (a) Give $|S_5|$. (b) Give $|A_5|$. (c) Give $|S_5/A_5|$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 120; b = 60; c = 2'
            solution_sketch: 'We have $|S_5|=5!=120$, so a = 120. The even permutations are half of them, so b = 60. The quotient has $120/60=2$ elements, so c = 2.'
          - problem: 'Count normal subgroups. (a) Give the number of normal subgroups of $S_5$. (b) Give the number of normal subgroups of $S_7$. (c) Give the number of normal subgroups of $A_5$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 3; b = 3; c = 2'
            solution_sketch: 'For $n\ge5$ the normal subgroups of $S_n$ are $\{\mathrm{id}\}$, $A_n$ and $S_n$, so a = 3 and b = 3. The group $A_5$ is simple and has only $\{\mathrm{id}\}$ and $A_5$, so c = 2.'
          - problem: 'Give 1 for an even permutation and 0 for an odd permutation. (a) $(1\,2\,3)$. (b) $(1\,2)(3\,4)$. (c) $(1\,2\,3\,4)$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 1; c = 0'
            solution_sketch: 'A 3-cycle is a product of 2 transpositions, so a = 1. Two transpositions give an even permutation, so b = 1. A 4-cycle is a product of 3 transpositions, so c = 0.'
          - problem: 'Give the order of each permutation. (a) A 3-cycle. (b) $(1\,2)(3\,4)(5\,6)$. (c) The square of the 4-cycle $(1\,2\,3\,4)$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 3; b = 2; c = 2'
            solution_sketch: 'A 3-cycle returns to the identity after 3 steps, so a = 3. Disjoint transpositions each have order 2, so b = 2. The square of the 4-cycle is $(1\,3)(2\,4)$, which has order 2, so c = 2.'
          - problem: 'Count the transpositions. (a) Give the number of transpositions in $S_5$. (b) Give the number of transpositions in $S_6$. (c) Give the number of transpositions in $S_4$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 10; b = 15; c = 6'
            solution_sketch: 'A transposition swaps one pair of points, so the number is the number of pairs. For 5 points it is 10, for 6 points it is 15 and for 4 points it is 6. So a = 10, b = 15 and c = 6.'
          - problem: 'Look at the nested sequence $\{\mathrm{id}\}\lhd A_5\lhd S_5$. (a) Give the number of elements of the factor group $A_5/\{\mathrm{id}\}$. (b) Give the number of elements of the factor group $S_5/A_5$. (c) Give 1 if $A_5/\{\mathrm{id}\}$ is commutative and 0 if not.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 60; b = 2; c = 0'
            solution_sketch: 'The first factor is $A_5$ itself with 60 elements, so a = 60. The second factor has $120/60=2$ elements, so b = 2. The group $A_5$ holds the 3-cycles $(1\,2\,3)$ and $(1\,2\,4)$, which do not commute, so c = 0.'
          - problem: 'Let $\tau$ be a product of 7 disjoint transpositions in some $S_n$, with $\tau=(1\,2)(3\,4)\delta$. (a) Give the number of disjoint transpositions in $\delta$. (b) Give the smallest $n$ for which $S_n$ holds a product of 3 disjoint transpositions. (c) Give the number of points that $\tau$ moves.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 5; b = 6; c = 14'
            solution_sketch: 'Taking out $(1\,2)$ and $(3\,4)$ leaves $7-2=5$ transpositions, so a = 5. Three disjoint transpositions move 6 points, so b = 6. Seven disjoint transpositions move 14 points, so c = 14.'
          # argument: Theorem 6.77
          - problem: 'Prove the first step: let $n\ge5$ and let $N\ne\{\mathrm{id}\}$ be a normal subgroup of $S_n$. Then $N$ holds $A_n$.'
            answer_contract: {"kind":"written"}
            answer: 'N meet A_n is normal in the simple group A_n. It is not trivial, since a trivial meet forces a product (1 4)(2 3) of transpositions that is even.'
            solution_sketch: 'By Lemma 6.76, $N\cap A_n$ is normal in $A_n$. By Theorem 6.68, $A_n$ is simple, so $N\cap A_n$ is $\{\mathrm{id}\}$ or $A_n$. Suppose it is $\{\mathrm{id}\}$. Then all nontrivial elements of $N$ are odd, and the square of each is the identity. So each is an odd count of disjoint transpositions multiplied together. Conjugating $(1\,2)(3\,4)\delta$ and multiplying produces the even element $(1\,4)(2\,3)$ in $N$, a contradiction.'
          # argument: Theorem 6.77
          - problem: 'Prove the second step: let $n\ge5$ and let $N$ be a normal subgroup of $S_n$ that holds $A_n$. Then $N=A_n$ or $N=S_n$.'
            answer_contract: {"kind":"written"}
            answer: 'If N holds an odd permutation, it holds a transposition. Conjugation then gives every transposition, so N = S_n.'
            solution_sketch: 'Let $N$ differ from $A_n$. Then $N$ holds an odd permutation. Together with $A_n$ it holds a transposition, for example $(1\,2)$, by Theorem 6.68 and the first step. Normality gives $(a\,b)=(1\,a)(2\,b)(1\,2)(a\,1)(b\,2)$ in $N$ for all $a,b\ge3$. In the same way $(1\,b)$ and $(a\,2)$ lie in $N$. So $N$ holds all transpositions and $N=S_n$.'
          # argument: Theorem 6.77
          - problem: 'Prove the third step: for $n\ge5$ the group $S_n$ is not solvable. Use that its only normal subgroups are $\{\mathrm{id}\}$, $A_n$ and $S_n$.'
            answer_contract: {"kind":"written"}
            answer: 'Only two nested sequences are possible. Each has a factor that equals S_n or A_n, and neither group is commutative.'
            solution_sketch: 'A nested sequence from $\{\mathrm{id}\}$ to $S_n$ uses normal subgroups. By the first two steps and Lemma 6.76 only two sequences exist: $\{\mathrm{id}\}\lhd S_n$ and $\{\mathrm{id}\}\lhd A_n\lhd S_n$. The first has the factor $S_n/\{\mathrm{id}\}\cong S_n$. The second has the factor $A_n/\{\mathrm{id}\}\cong A_n$. By Theorem 6.68 and Definition 6.71, neither factor is commutative, so $S_n$ is not solvable.'
        constraints: 'Practice items: decidable values and one written proof for each result.'
      - id: kp3
        name: 'Theorem 6.78 and Definition 6.79: Abel''s Theorem and abelian groups'
        key_prerequisites: [fom-6-6-groups-s-n, fom-6-1-irreducible-polynomials, fom-6-8-consequences-solvability-by-radicals]
        exemplars:
          - problem: 'Use this rule. A prime $p$ fits a polynomial when $p$ divides every coefficient except the leading one and $p^2$ does not divide the constant term. (a) Give the prime that fits $x^5-4x+2$. (b) Give the prime that fits $x^5-10x+5$. (c) Give the prime that fits $x^7-14x+7$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 2; b = 5; c = 7'
            solution_sketch: 'For $x^5-4x+2$ the prime 2 divides 4 and 2, and 4 does not divide 2, so a = 2. For $x^5-10x+5$ the prime 5 divides 10 and 5, and 25 does not divide 5, so b = 5. For $x^7-14x+7$ the prime 7 divides 14 and 7, and 49 does not divide 7, so c = 7.'
          - problem: 'Let $p(x)=x^5-4x+2$. (a) Give the number of real roots of $p$. (b) Give the number of nonreal complex roots of $p$. (c) Give $p(1)$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 3; b = 2; c = -1'
            solution_sketch: 'The values at $-2,-1,0,1,2$ are $-22,5,2,-1,32$ in order. This gives sign changes in three intervals, and the derivative $5x^4-4$ allows at most 3 real roots. So a = 3, and the other 2 roots are nonreal, so b = 2. Also $p(1)=1-4+2=-1$, so c = -1.'
          - problem: 'Let $p$ be an irreducible polynomial of degree 5 over $\mathbb{Q}$ with exactly 2 nonreal roots. Complex conjugation permutes the 5 roots. (a) Give the number of roots that conjugation moves. (b) Give the order of the permutation of the roots that conjugation produces. (c) Give the number of elements of the group $S_5$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 2; b = 2; c = 120'
            solution_sketch: 'Conjugation swaps the 2 nonreal roots and fixes the 3 real roots, so a = 2. A swap of two points has order 2, so b = 2. The group $S_5$ has 5! = 120 elements, so c = 120.'
          - problem: 'Give 1 for a commutative (abelian) group and 0 for a group that is not commutative. (a) $\mathbb{Z}_{12}$. (b) $S_3$. (c) The group $\{e\}$ with one element.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 0; c = 1'
            solution_sketch: 'The group $\mathbb{Z}_{12}$ is commutative, so a = 1. In $S_3$ the product $(1\,2)(1\,3)$ differs from $(1\,3)(1\,2)$, so b = 0. A group with one element is commutative, so c = 1.'
          - problem: 'Give 1 for true and 0 for false. (a) Each polynomial of degree 2 over $\mathbb{Q}$ gives an equation that is solvable by radicals. (b) Each polynomial of degree 4 over $\mathbb{Q}$ gives an equation that is solvable by radicals. (c) Each polynomial of degree 5 over $\mathbb{Q}$ gives an equation that is solvable by radicals.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 1; c = 0'
            solution_sketch: 'The quadratic formula solves degree 2, so a = 1. There is a formula with radicals for degree 4, so b = 1. Abel''s Theorem gives a quintic that is not solvable by radicals, so c = 0.'
          - problem: 'Look at polynomials of prime degree. (a) Give the smallest prime $n$ with $n\ge5$. (b) Give $|S_7|$. (c) Give the number of transpositions in $S_7$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 5; b = 5040; c = 21'
            solution_sketch: 'The smallest prime from 5 up is 5, so a = 5. We have $7!=5040$, so b = 5040. The number of pairs of 7 points is 21, so c = 21.'
          # argument: Theorem 6.78
          - problem: 'Prove: there is a polynomial $p$ of degree 5 such that $p(x)=0$ is not solvable by radicals. In particular there is no quintic formula.'
            answer_contract: {"kind":"written"}
            answer: 'Take the quintic whose Galois group is S_5. S_5 is not solvable, so Theorem 6.75 forbids a solution by radicals.'
            solution_sketch: 'Example 6.54 shows that the polynomial of Example 6.4 has a Galois group isomorphic to $S_5$. By Theorem 6.77 the group $S_5$ is not solvable. Suppose $p(x)=0$ is solvable by radicals. Then Theorem 6.75 makes the Galois group solvable, a contradiction. So $p(x)=0$ is not solvable by radicals.'
          # source: FoM exercise 6.9-6-79
          - problem: 'Find a polynomial $p$ of degree 7 such that $p(x)=0$ is not solvable by radicals. Prove your choice works.'
            answer_contract: {"kind":"written"}
            answer: 'Multiply the quintic of Abel''s Theorem by x squared. A root tower for the product holds all roots of the quintic, which is impossible.'
            solution_sketch: 'Let $q$ be a quintic with $q(x)=0$ not solvable by radicals, from Theorem 6.78. Set $p(x)=x^2q(x)$, which has degree 7. Every root of $q$ is a root of $p$. Suppose $p(x)=0$ has a root tower that holds all roots. Then it holds all roots of $q$, so $q(x)=0$ is solvable by radicals, a contradiction.'
          # source: FoM exercise 6.9-6-80
          - problem: 'Prove that for each prime $n\ge5$ there is an irreducible polynomial $p$ of degree $n$ such that $p(x)=0$ is not solvable by radicals.'
            answer_contract: {"kind":"written"}
            answer: 'Take an irreducible p of prime degree n with exactly two nonreal roots. Its group holds an n-cycle and a transposition, so it is S_n, not solvable.'
            solution_sketch: 'Pick an irreducible polynomial of prime degree $n$ over $\mathbb{Q}$ with exactly 2 nonreal roots. Its Galois group holds an element of order $n$, which is an $n$-cycle, by Cauchy''s Theorem. Complex conjugation gives a transposition. An $n$-cycle and a transposition of prime $n$ generate $S_n$. By Theorem 6.77 the group $S_n$ is not solvable, so Theorem 6.75 gives the result.'
        constraints: 'Practice items: decidable values and one written proof for each result.'
    diagnostic_exemplar:
      problem: 'Count transpositions. (a) Give the number of transpositions in $S_3$. (b) Give the number of transpositions in $S_5$.'
      answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}}]}
      answer: 'a = 3; b = 10'
      solution_sketch: 'A transposition swaps one pair of points. For 3 points there are 3 pairs, so a = 3. For 5 points there are 10 pairs, so b = 10.'
