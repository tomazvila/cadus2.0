    knowledge_points:
      - id: kp1
        name: 'Definition 6.27 and Theorem 6.28: subgroups and the subgroup test'
        key_prerequisites: [subgroups-subgroup-tests]
        exemplars:
          - problem: 'Work in the group $(\mathbb{Z},+)$. Give 1 for a subgroup and 0 for a set that is not a subgroup. (a) the even integers (b) the odd integers (c) the positive integers (d) the multiples of 5'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 0; c = 0; d = 1'
            solution_sketch: 'A subgroup is nonempty, closed under the operation and closed under inverses. The even integers pass all three tests, so (a) is 1. The odd integers lack 0 and $1+1=2$ is even, so (b) is 0. The positive integers lack inverses, so (c) is 0. The multiples of 5 pass all three tests, so (d) is 1.'
          - problem: 'Work in the group $(\mathbb{Z}_6,+)$ with $S=\{0,2,4\}$. (a) Give the inverse of 2 in $\mathbb{Z}_6$. (b) Give $2+4$ in $\mathbb{Z}_6$. (c) Give the inverse of 4 in $\mathbb{Z}_6$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 4; b = 0; c = 2'
            solution_sketch: 'Inverses and sums use arithmetic mod 6. For (a) we have $2+4=6\equiv 0$, so the inverse of 2 is 4. For (b) the sum $2+4$ is 0. For (c) the same equation shows that the inverse of 4 is 2. All three results stay in $S$.'
          - problem: 'Work in the group $(\mathbb{Z}_8,+)$ with $S=\{0,1,2,3\}$. (a) Give the inverse of 3 in $\mathbb{Z}_8$. (b) Give 1 if $S$ is closed under addition and 0 if it is not. (c) Give the number of elements of $S$ whose inverse is in $S$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 5; b = 0; c = 1'
            solution_sketch: 'For (a) we have $3+5=8\equiv 0$, so the inverse is 5. For (b) we have $3+3=6$, which is not in $S$, so the value is 0. The inverses of 1, 2 and 3 are 7, 6 and 5, and none of them is in $S$. Only 0 is its own inverse, so (c) is 1.'
          - problem: 'Work in the group of units $U(10)=\{1,3,7,9\}$ with multiplication mod 10. Give 1 for a subgroup and 0 for a set that is not a subgroup. (a) $\{1,9\}$ (b) $\{1,3\}$ (c) $\{1,3,7,9\}$ (d) $\{3,7\}$'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 0; c = 1; d = 0'
            solution_sketch: 'Test closure first. In (a) we have $9\cdot 9=81\equiv 1$, so the set is closed and has inverses, and the value is 1. In (b) we have $3\cdot 3=9$, which is outside the set, so the value is 0. Set (c) is the whole group, so the value is 1. In (d) we have $3\cdot 3=9$, which is outside the set, so the value is 0.'
          - problem: 'Work in $(\mathbb{Z}_{12},+)$. Each subgroup below holds all multiples of one element. (a) Give the number of elements of the subgroup built from 8. (b) Give the number of elements of the subgroup built from 5. (c) Give the largest element of the subgroup built from 9.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 3; b = 12; c = 9'
            solution_sketch: 'The multiples of 8 mod 12 are 8, 4 and 0, so (a) is 3. Since 5 and 12 share no factor, the multiples of 5 reach every residue, so (b) is 12. The multiples of 9 mod 12 are 9, 6, 3 and 0. The largest one is 9, so (c) is 9.'
          - problem: 'Count the subgroups of each group. (a) $(\mathbb{Z}_6,+)$ (b) $(\mathbb{Z}_7,+)$ (c) $(\mathbb{Z}_{12},+)$'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 4; b = 2; c = 6'
            solution_sketch: 'Each subgroup of $\mathbb{Z}_n$ has an order that divides $n$, and each divisor gives exactly one subgroup. The divisors of 6 are 1, 2, 3 and 6, so (a) is 4. The divisors of 7 are 1 and 7, so (b) is 2. The divisors of 12 are 1, 2, 3, 4, 6 and 12, so (c) is 6.'
          - problem: 'Work in $(\mathbb{Z},+)$. (a) Give the smallest positive integer that is in both $4\mathbb{Z}$ and $6\mathbb{Z}$. (b) Give the smallest positive integer of the form $4m+6n$ with integers $m,n$. (c) Give the smallest positive integer of the form $9m+12n$ with integers $m,n$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 12; b = 2; c = 3'
            solution_sketch: 'For (a) the common multiples of 4 and 6 are the multiples of 12, so the smallest is 12. The sums $4m+6n$ form a subgroup, and the smallest positive element is the common divisor 2, so (b) is 2. The sums $9m+12n$ give the common divisor 3, because $12-9=3$, so (c) is 3.'
          # argument: Theorem 6.28
          - problem: 'Prove the first step: Let $(G,\circ)$ be a group and let $S$ be a subgroup of $G$. Then $S$ is nonempty, $S$ is closed under $\circ$, and $S$ contains the inverse in $G$ of each of its elements.'
            answer_contract: {"kind":"written"}
            answer: 'S has an identity, so it is nonempty. Closure is part of the group on S, and uniqueness shows that identities and inverses agree with those of G.'
            solution_sketch: 'The set S is a group, so it has an identity e'' and thus it is nonempty. The operation on S maps S times S into S, so S is closed. In G we have e''e''=e'', and cancellation in G gives e''=e. The inverse of x in S satisfies xy=e, and by uniqueness of inverses in G it equals the inverse of x in G.'
          # argument: Theorem 6.28
          - problem: 'Prove the second step: Let $(G,\circ)$ be a group and let $S\subseteq G$ be nonempty, closed under $\circ$, and closed under inverses in $G$. Then $S$ is a subgroup of $G$.'
            answer_contract: {"kind":"written"}
            answer: 'Closure makes the restriction an operation on S. Associativity is inherited, the identity is x times its inverse, and inverses are in S by assumption.'
            solution_sketch: 'Take x in S. By assumption the inverse of x is in S, and by closure x times that inverse is in S, so the identity e of G is in S. The restriction of the operation to S is a well defined operation, because S is closed. Associativity holds in S because it holds in G. The element e is an identity in S and each x in S has an inverse in S, so S is a group.'
          # source: FoM exercise 6.4-6-34
          - problem: 'Prove: Let $(G,\circ)$ be a group and let $S\subseteq G$. Then $S$ is a subgroup of $G$ exactly when $S$ is nonempty, closed under $\circ$, and closed under inverses.'
            answer_contract: {"kind":"written"}
            answer: 'Show both directions: a subgroup inherits the three properties from G, and the three properties give identity, operation and inverses in S.'
            solution_sketch: 'For the forward direction use the identity and inverse uniqueness of G to see that S is nonempty and closed under inverses. Closure is part of being a group on S. For the reverse direction pick x in S and form x times its inverse to place the identity in S. Associativity comes from G. This is the statement of Theorem 6.28 and it matches Definition 6.27.'
          # source: FoM exercise 6.4-6-38
          - problem: 'Let $G$ be a finite group and let $S\subseteq G$. Prove that $S$ is a subgroup of $G$ exactly when $S$ is nonempty and closed under the operation of $G$.'
            answer_contract: {"kind":"written"}
            answer: 'In a finite group each element has finite order, so its inverse is a positive power of it. Closure then puts the inverse in S.'
            solution_sketch: 'One direction is immediate from the three conditions of Theorem 6.28. For the other direction take x in S. The powers of x lie in S by closure, and G is finite, so two powers agree: x^i=x^j with i<j. Cancellation gives x^(j-i)=e, so the inverse of x is the power x^(j-i-1) of x, which lies in S. So the three conditions of Theorem 6.28 hold.'
        constraints: 'Test subgroups of small groups with the three conditions and count subgroups.'
      - id: kp2
        name: 'Definition 6.29 and Proposition 6.30: the group of automorphisms that fix a field and fixed fields'
        key_prerequisites: [automorphism-groups]
        exemplars:
          - problem: 'Let $\sigma$ be the field automorphism of $\mathbb{Q}(\sqrt{2})$ with $\sigma(\sqrt{2})=-\sqrt{2}$ that fixes every rational number. Write each value as $p+q\sqrt{2}$ with rational $p,q$. (a) Give $p$ for $\sigma(5+3\sqrt{2})$. (b) Give $q$ for $\sigma(5+3\sqrt{2})$. (c) Give $\sigma(7)$. (d) Give $q$ for $\sigma((1+\sqrt{2})^2)$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}}]}
            answer: 'a = 5; b = -3; c = 7; d = -2'
            solution_sketch: 'The map $\sigma$ keeps sums and products, and it fixes rationals. So $\sigma(5+3\sqrt{2})=5-3\sqrt{2}$, which gives (a) 5 and (b) -3. The value $\sigma(7)$ is 7. Since $(1+\sqrt{2})^2=3+2\sqrt{2}$, the image is $3-2\sqrt{2}$, so (d) is -2.'
          - problem: 'Give the number of elements of each group. (a) $G(\mathbb{C}/\mathbb{R})$ (b) $G(\mathbb{C}/\mathbb{C})$ (c) $G(\mathbb{Q}(\sqrt{2})/\mathbb{Q})$'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 2; b = 1; c = 2'
            solution_sketch: 'An automorphism of $\mathbb{C}$ that fixes $\mathbb{R}$ is determined by the image of $i$, which is $i$ or $-i$. So (a) is 2. An automorphism that fixes all of $\mathbb{C}$ is the identity, so (b) is 1. For (c) the image of $\sqrt{2}$ is $\sqrt{2}$ or $-\sqrt{2}$, so the count is 2.'
          - problem: 'Let $\sigma$ be complex conjugation on $\mathbb{C}$. (a) Give the imaginary part of $\sigma(3+4i)$. (b) Give the imaginary part of $\sigma(\sigma(2-5i))$. (c) Give the imaginary part of $\sigma^{-1}(i)$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = -4; b = -5; c = -1'
            solution_sketch: 'Conjugation flips the sign of the imaginary part. So $\sigma(3+4i)=3-4i$, and (a) is -4. Applying $\sigma$ twice returns $2-5i$, so (b) is -5. The map $\sigma$ is its own inverse, so $\sigma^{-1}(i)=-i$ and (c) is -1.'
          - problem: 'Let $\sigma$ be the automorphism of $\mathbb{Q}(\sqrt{2})$ with $\sigma(\sqrt{2})=-\sqrt{2}$ that fixes every rational number. Give 1 if $\sigma(x)=x$ and 0 if not. (a) $x=3$ (b) $x=\sqrt{2}$ (c) $x=1+\sqrt{2}$ (d) $x=\sqrt{2}\cdot\sqrt{2}$'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 0; c = 0; d = 1'
            solution_sketch: 'The fixed elements are the rational numbers. For (a) the number 3 is rational, so the value is 1. For (b) we have $\sigma(\sqrt{2})=-\sqrt{2}$, so the value is 0. For (c) the image is $1-\sqrt{2}$, so the value is 0. For (d) the product equals 2, which is rational, so the value is 1.'
          - problem: 'Let $\sigma(p+q\sqrt{2})=p-q\sqrt{2}$ on $\mathbb{Q}(\sqrt{2})$, and let $\tau=\sigma\circ\sigma$. (a) Give $p$ for $\tau(4+9\sqrt{2})$. (b) Give $q$ for $\tau(4+9\sqrt{2})$. (c) Give the order of $\sigma$ in the group $G(\mathbb{Q}(\sqrt{2})/\mathbb{Q})$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 4; b = 9; c = 2'
            solution_sketch: 'Applying $\sigma$ twice flips the sign of $q$ twice. So $\tau(4+9\sqrt{2})=4+9\sqrt{2}$, which gives (a) 4 and (b) 9. The map $\tau$ is the identity and $\sigma$ is not the identity, so the order of $\sigma$ is 2.'
          - problem: 'Let $\sigma$ be complex conjugation on $\mathbb{C}$. Give 1 if $\sigma$ lies in $G(\mathbb{C}/F)$ and 0 if not. (a) $F=\mathbb{R}$ (b) $F=\mathbb{Q}$ (c) $F=\mathbb{C}$ (d) $F=\mathbb{Q}(i)$'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 1; c = 0; d = 0'
            solution_sketch: 'The group $G(\mathbb{C}/F)$ holds the automorphisms that fix every element of $F$. Conjugation fixes all real numbers, so (a) is 1. It fixes the rational numbers, so (b) is 1. It sends $i$ to $-i$, so it does not fix $\mathbb{C}$ or $\mathbb{Q}(i)$. Hence (c) is 0 and (d) is 0.'
          - problem: 'Count the subgroups of each group. (a) $G(\mathbb{Q}(\sqrt{2})/\mathbb{Q})$ (b) $G(\mathbb{C}/\mathbb{R})$ (c) $G(\mathbb{C}/\mathbb{C})$'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 2; b = 2; c = 1'
            solution_sketch: 'Groups (a) and (b) have 2 elements each. A group of 2 elements has exactly 2 subgroups, the trivial one and the whole group. So (a) is 2 and (b) is 2. The group in (c) has only the identity, so it has 1 subgroup.'
          # argument: Proposition 6.30
          - problem: 'Prove the first step: Take fields with $\mathbb{F}\subseteq\mathbb{D}\subseteq\mathbb{E}$. Then $G(\mathbb{E}/\mathbb{D})$ is a subgroup of $G(\mathbb{E}/\mathbb{F})$.'
            answer_contract: {"kind":"written"}
            answer: 'An automorphism that fixes D also fixes the smaller field F. So the first set lies in the second, and both use composition.'
            solution_sketch: 'By Theorem 6.28 it is enough to test the subgroup conditions, or use the group structure of Proposition 6.30 part 1. Each automorphism of E that fixes D also fixes F, because F is inside D. So G(E/D) is a subset of G(E/F). Both sets are groups under composition, and so the first is a subgroup of the second.'
          # argument: Proposition 6.30
          - problem: 'Prove the second step: Take a field $\mathbb{E}$ that extends $\mathbb{F}$, and a subgroup $H$ of $G(\mathbb{E}/\mathbb{F})$. Then the elements of $\mathbb{E}$ fixed by every element of $H$ form a subfield of $\mathbb{E}$ that holds $\mathbb{F}$.'
            answer_contract: {"kind":"written"}
            answer: 'Each h in H keeps sums, products and inverses, so fixed elements stay fixed under these operations. Elements of F are fixed by H.'
            solution_sketch: 'Let x and y be fixed by every h in H. Then h(x+y)=h(x)+h(y)=x+y, and h(xy)=h(x)h(y)=xy. Also h(-x)=-h(x)=-x, and for x not 0 we have h(1/x)=1/h(x)=1/x. The elements 0 and 1 are fixed, and each element of F is fixed because H lies in G(E/F). These tests show that the fixed set is a subfield, as in Theorem 6.28.'
          # source: FoM exercise 6.4-6-35
          - problem: 'Let $\mathbb{E}$ be a field. (a) Prove that the inverse of a field automorphism of $\mathbb{E}$ is a field automorphism of $\mathbb{E}$. (b) Prove that $G(\mathbb{E}/\mathbb{F})$ is a group under composition for each subfield $\mathbb{F}$ of $\mathbb{E}$.'
            answer_contract: {"kind":"written"}
            answer: 'For (a) write x and y as images and pull sums and products back. For (b) use the subgroup test inside the group of all bijections of E.'
            solution_sketch: 'For (a) pick u and v with x=s(u) and y=s(v). Then s^(-1)(x+y)=s^(-1)(s(u+v))=u+v, and the same works for products. For (b) the identity fixes F, so the set is nonempty. The composition of two automorphisms that fix F fixes F. By part (a) and Theorem 6.28 the inverse also fixes F, so the set is a group.'
          # source: FoM exercise 6.4-6-37
          - problem: 'Let $\sigma:\mathbb{E}\to\mathbb{E}$ be a field automorphism. (a) Prove that $\sigma(0)=0$. (b) Prove that $\sigma(1)=1$.'
            answer_contract: {"kind":"written"}
            answer: 'Additivity gives s(0)=s(0)+s(0), so cancel to get 0. Multiplicativity gives s(1)=s(1)s(1), so cancel s(1), which is not 0, to get 1.'
            solution_sketch: 'For (a) write s(0)=s(0+0)=s(0)+s(0). Add the additive inverse of s(0) to both sides to get s(0)=0. For (b) write s(1)=s(1*1)=s(1)s(1). The element s(1) is not 0, because s is injective and s(0)=0. Multiply by the inverse of s(1) to get s(1)=1.'
        constraints: 'Compute images under automorphisms of small field extensions.'
      - id: kp3
        name: 'Theorem 6.31, Definition 6.32 and Theorem 6.34: automorphisms are determined by images of zeros and the Galois group permutes zeros'
        key_prerequisites: [fom-6-3-uniqueness-splitting-field]
        exemplars:
          - problem: 'Let $\theta$ be a zero in an extension of $\mathbb{F}$ of an irreducible polynomial of degree $n$ over $\mathbb{F}$. Give the largest possible number of elements of $G(\mathbb{F}(\theta)/\mathbb{F})$. (a) $n=5$ (b) $n=2$ (c) $n=1$'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 5; b = 2; c = 1'
            solution_sketch: 'Each automorphism is fixed by the image of $\theta$, and that image is a zero of the polynomial. A polynomial of degree $n$ has at most $n$ zeros. So the bound is 5 for (a), 2 for (b) and 1 for (c).'
          - problem: 'Count zeros. (a) Give the number of real zeros of $x^3-2$. (b) Give the number of real zeros of $x^2-7$. (c) Give the number of elements of $G(\mathbb{Q}(\sqrt[3]{2})/\mathbb{Q})$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 2; c = 1'
            solution_sketch: 'The cube root of 2 is the only real zero of $x^3-2$, so (a) is 1. The zeros of $x^2-7$ are $\pm\sqrt{7}$, so (b) is 2. An automorphism of $\mathbb{Q}(\sqrt[3]{2})$ sends the cube root to a real zero of $x^3-2$. Only one real zero exists, so (c) is 1.'
          - problem: 'Give the number of elements of the Galois group of the irreducible polynomial over the field. (a) $x^2-5$ over $\mathbb{Q}$ (b) $x^2+1$ over $\mathbb{R}$ (c) $x^3-2$ over $\mathbb{Q}$ (d) $x^2-2$ over $\mathbb{Q}(\sqrt{3})$'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}}]}
            answer: 'a = 2; b = 2; c = 6; d = 2'
            solution_sketch: 'The splitting field of $x^2-5$ over $\mathbb{Q}$ is $\mathbb{Q}(\sqrt{5})$, and its group has 2 elements. The splitting field of $x^2+1$ over $\mathbb{R}$ is $\mathbb{C}$, and its group has 2 elements. The splitting field of $x^3-2$ over $\mathbb{Q}$ has degree 6, so its group has 6 elements. The splitting field of $x^2-2$ over $\mathbb{Q}(\sqrt{3})$ is $\mathbb{Q}(\sqrt{2},\sqrt{3})$, and its group has 2 elements.'
          - problem: 'The polynomial $x^2-3$ over $\mathbb{Q}$ has the zeros $\theta_1=\sqrt{3}$ and $\theta_2=-\sqrt{3}$. Let $\sigma$ be the automorphism in the Galois group that is not the identity. (a) Give $k$ with $\sigma(\theta_1)=\theta_k$. (b) Give $k$ with $\sigma(\theta_2)=\theta_k$. (c) Give the order of $\sigma$ as a permutation of the zeros.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 2; b = 1; c = 2'
            solution_sketch: 'The map $\sigma$ sends $\sqrt{3}$ to a zero other than itself, so it sends $\theta_1$ to $\theta_2$. Then (a) is 2. It also swaps back, so $\sigma(\theta_2)=\theta_1$ and (b) is 1. A swap of two objects has order 2.'
          - problem: 'A polynomial has $k$ zeros in its splitting field. Give the largest possible number of elements of a group of permutations of the zeros. (a) $k=3$ (b) $k=2$ (c) $k=4$'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 6; b = 2; c = 24'
            solution_sketch: 'The group of all permutations of $k$ objects has $k!$ elements. So (a) is $3!=6$, (b) is $2!=2$, and (c) is $4!=24$. The Galois group is isomorphic to a group inside these permutation groups.'
          - problem: 'Let $\sigma$ swap 1 and 2 and fix 3. Let $\tau$ swap 2 and 3 and fix 1. Both maps permute $\{1,2,3\}$. (a) Give $(\sigma\circ\tau)(1)$. (b) Give $(\sigma\circ\tau)(2)$. (c) Give $(\sigma\circ\tau)(3)$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 2; b = 3; c = 1'
            solution_sketch: 'The composition applies $\tau$ first and then $\sigma$. For 1 we have $\tau(1)=1$ and $\sigma(1)=2$, so (a) is 2. For 2 we have $\tau(2)=3$ and $\sigma(3)=3$, so (b) is 3. For 3 we have $\tau(3)=2$ and $\sigma(2)=1$, so (c) is 1.'
          # argument: Theorem 6.31
          - problem: 'Prove the first step: Take a polynomial $p$ over $\mathbb{F}$ that is irreducible of degree $n$, a zero $\theta$ of $p$ in an extension of $\mathbb{F}$, and $\sigma\in G(\mathbb{F}(\theta)/\mathbb{F})$. Then $\sigma(\theta)$ determines $\sigma$.'
            answer_contract: {"kind":"written"}
            answer: 'Each element is a combination of powers of theta over F. Sigma fixes F, so only sigma(theta) decides the image.'
            solution_sketch: 'By Theorem 6.20 the powers 1, theta, up to theta^(n-1), are a basis of F(theta) over F. So each a is a sum of a_j theta^j with a_j in F. Since sigma fixes F and keeps sums and products, sigma(a) is the sum of a_j sigma(theta)^j. The right side depends only on sigma(theta), so sigma is determined by it.'
          # argument: Theorem 6.31
          - problem: 'Prove the second step: In the setting of the first step, $G(\mathbb{F}(\theta)/\mathbb{F})$ has at most $n$ elements.'
            answer_contract: {"kind":"written"}
            answer: 'Sigma sends the zero theta of p to a zero of p, and p has at most n zeros. The step before shows that sigma is determined by its value at theta.'
            solution_sketch: 'Since sigma fixes F, we have 0=sigma(p(theta))=p(sigma(theta)). So sigma(theta) is a zero of p. The polynomial p has degree n, so it has at most n zeros. By the first step and Theorem 6.20, sigma is determined by sigma(theta). Hence at most n different automorphisms exist.'
          # argument: Theorem 6.34
          - problem: 'Prove the first step: Take an irreducible polynomial $p$ over $\mathbb{F}$ with zeros $\theta_1,\dots,\theta_k$ and splitting field $\mathbb{E}$. Each $\sigma\in G(\mathbb{E}/\mathbb{F})$ permutes the zeros, and the values on the zeros determine $\sigma$.'
            answer_contract: {"kind":"written"}
            answer: 'Sigma maps zeros of p to zeros of p, and it is injective, so it permutes them. The zeros generate E over F, so their images determine sigma.'
            solution_sketch: 'As in Theorem 6.31, p(sigma(theta_j))=sigma(p(theta_j))=0, so sigma(theta_j) is a zero of p. The map sigma is injective, so it permutes the finite set of zeros. Every element of E is a polynomial expression in the zeros with coefficients in F. Sigma fixes F, so its values on the zeros decide its values on E.'
          # argument: Theorem 6.34
          - problem: 'Prove the second step: In the setting of the first step, the map that sends $\sigma$ to its restriction to $\{\theta_1,\dots,\theta_k\}$ is an injective map from $G(\mathbb{E}/\mathbb{F})$ to the permutations of the zeros that keeps composition.'
            answer_contract: {"kind":"written"}
            answer: 'Restriction keeps composition, so the map keeps products. Equal restrictions give equal automorphisms, so the map is injective.'
            solution_sketch: 'Restriction keeps composition, because (s o u) of theta is s of u of theta. So the map is a homomorphism into the permutations of the zeros. If two automorphisms agree on the zeros, the first step shows that they agree on E. So the map is injective. The image is a group of permutations, and G(E/F) is isomorphic to it. Theorem 6.31 gives the same idea for one zero.'
          # source: FoM exercise 6.4-6-36
          - problem: 'Take an irreducible polynomial $p$ over $\mathbb{F}$ of degree $n$ with zeros $\theta_1,\dots,\theta_k$ and splitting field $\mathbb{E}$, and take $\sigma\in G(\mathbb{E}/\mathbb{F})$. (a) Prove that each $x\in\mathbb{F}(\theta_1,\dots,\theta_k)$ is a sum of terms $a\,\theta_1^{j_1}\cdots\theta_k^{j_k}$ with $a\in\mathbb{F}$ and exponents below $n$. (b) Show that the values $\sigma(\theta_j)$ determine the map $\sigma$.'
            answer_contract: {"kind":"written"}
            answer: 'For (a) adjoin the zeros one at a time and use a basis of powers at each step. For (b) apply sigma to the sum form.'
            solution_sketch: 'For (a) write F(theta_1,...,theta_k) as F(theta_1)(theta_2)...(theta_k). At each step the powers up to n-1 form a basis, so repeat Theorem 6.20 k times. Multiply out the bases to get the sum form. For (b) apply sigma to the sum form. Sigma fixes the coefficients, so only the values sigma(theta_j) matter.'
          # source: FoM exercise 6.4-6-39
          - problem: 'Take an irreducible polynomial $p$ over $\mathbb{F}$ with zeros $\mu_1,\dots,\mu_n$ and splitting field $\mathbb{E}$. For each pair $i,j$ let some $\varphi_{ij}\in G(\mathbb{E}/\mathbb{F})$ satisfy $\varphi_{ij}(\mu_i)=\mu_j$. Prove that $\mathbb{F}$ is the fixed field of $G(\mathbb{E}/\mathbb{F})$. Hint: use that $\mathbb{E}=\mathbb{F}(\mu_1,\dots,\mu_n)$ and that products of powers of the zeros, with exponents below $\deg p$, span $\mathbb{E}$ over $\mathbb{F}$.'
            answer_contract: {"kind":"written"}
            answer: 'Expand a fixed element in products of zeros. The maps phi_ij force equal coefficients, and a squaring step then puts the element in F.'
            solution_sketch: 'By Proposition 6.13 the field E equals F(mu_1,...,mu_n), and Theorem 6.20 gives a basis of products of powers of the zeros. Let x be fixed by the whole group. The maps phi_ij permute the zeros transitively, so they permute the basis terms, and all coefficients of x are equal to one element a. If a is not 0, then x-a is also fixed and has all coefficients 0 or equal, and a squaring step forces a nonzero multiple of a product of zeros to vanish. This is absurd, so x lies in F.'
        constraints: 'Count zeros, bound group sizes and compose permutations of zeros.'
    diagnostic_exemplar:
      problem: 'Let $\sigma$ be complex conjugation on $\mathbb{C}$. (a) Give the imaginary part of $\sigma(6+i)$. (b) Give the real part of $\sigma(6+i)$.'
      answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}}]}
      answer: 'a = -1; b = 6'
      solution_sketch: 'Conjugation flips the sign of the imaginary part. So $\sigma(6+i)=6-i$. The imaginary part is -1, so (a) is -1. The real part is 6, so (b) is 6.'
  - id: fom-6-5-normal-field-extensions
    name: '6.5 Normal Field Extensions'
    program_items: [394, 395, 396, 397]
    core: false
    difficulty: 0.85
    drill: false
    answer_kind: multi-step
    expected_time_secs: 840
    prerequisites:
      - id: fom-6-4-field-automorphisms-galois-groups
        weight: 0.6
        key: true
      - id: fom-6-3-uniqueness-splitting-field
        weight: 0.4
        key: false
      - id: fom-6-2-field-extensions-splitting-fields
        weight: 0.4
