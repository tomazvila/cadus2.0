    knowledge_points:
      - id: kp1
        name: 'Definition 6.6, Definition 6.7 and Proposition 6.8: subfields, solving by radicals, intersections of subfields'
        key_prerequisites: [fom-5-2-fields, fom-6-1-irreducible-polynomials]
        exemplars:
          - problem: 'Use the usual operations on the real numbers. Give 1 if the set is a subfield of $\mathbb{R}$ and 0 if it is not. (a) $\mathbb{Q}$ (b) $\mathbb{Z}$ (c) $\{a+b\sqrt2 : a,b\in\mathbb{Q}\}$ (d) $\{a+b\sqrt2 : a,b\in\mathbb{Z}\}$'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 0; c = 1; d = 0'
            solution_sketch: 'The rationals form a field, so (a) is 1. The integers lack the inverse of 2, so (b) is 0. The set in (c) is closed under all four operations, so (c) is 1. In (d) the inverse of $\sqrt2$ is $\sqrt2/2$, which has non-integer coefficients, so (d) is 0.'
          - problem: 'Use the usual operations on the complex numbers. Give 1 if the set is a subfield of $\mathbb{C}$ and 0 if it is not. (a) $\mathbb{R}$ (b) $\{0,1\}$ (c) $\{a+bi : a,b\in\mathbb{Q}\}$ (d) $\{bi : b\in\mathbb{R}\}$'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 0; c = 1; d = 0'
            solution_sketch: 'The reals form a field, so (a) is 1. In (b) we have $1+1=2$, which is outside the set, so (b) is 0. The set in (c) is closed under sum, product and inverse, so (c) is 1. In (d) the product $i\cdot i=-1$ is outside the set, so (d) is 0.'
          - problem: 'Let $A=\{a+b\sqrt2 : a,b\in\mathbb{Q}\}$ and $B=\{a+b\sqrt3 : a,b\in\mathbb{Q}\}$. Both are subfields of $\mathbb{R}$, and so is $A\cap B$. Give 1 if the number lies in $A\cap B$ and 0 if not. (a) 2 (b) $\sqrt2$ (c) $1/2$ (d) $\sqrt6$'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 0; c = 1; d = 0'
            solution_sketch: 'Rational numbers lie in both sets, so (a) and (c) are 1. The number $\sqrt2$ lies in $A$ but not in $B$, so (b) is 0. The number $\sqrt6$ lies in neither set, so (d) is 0.'
          - problem: 'Work in the field $\mathbb{Z}_5$. (a) Give the multiplicative inverse of 3. (b) Give the additive inverse of 4. (c) Give 1 if $\{0,1,4\}$ is closed under addition and 0 if it is not. (d) Give 1 if $\{0,1,4\}$ is closed under multiplication and 0 if it is not.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}}]}
            answer: 'a = 2; b = 1; c = 0; d = 1'
            solution_sketch: 'We have $3\cdot2=6=1$ in $\mathbb{Z}_5$, so (a) is 2. We have $4+1=5=0$, so (b) is 1. We have $1+1=2$, which is outside the set, so (c) is 0. The products $4\cdot4=16=1$, $1\cdot4=4$ and the products with 0 stay in the set, so (d) is 1.'
          - problem: 'The solutions of $x^2+sx+t=0$ are $(-s\pm\sqrt d)/2$ with $d=s^2-4t$. Give $d$ for each equation. (a) $x^2-6x+4=0$ (b) $x^2+2x-7=0$ (c) $x^2-x+3=0$'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 20; b = 32; c = -11'
            solution_sketch: 'In (a) we have $36-16=20$. In (b) we have $4+28=32$. In (c) we have $1-12=-11$.'
          - problem: '(a) Give the number of polynomials of degree at most 2, including the zero polynomial, whose coefficients all lie in $\{-1,0,1\}$. (b) Give the number of such polynomials of degree exactly 2. (c) Give 1 if $\sqrt2$ is a zero of a nonzero polynomial with integer coefficients and 0 if it is not.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 27; b = 18; c = 1'
            solution_sketch: 'Each of the 3 coefficients has 3 choices, so (a) is $3^3=27$. For degree exactly 2 the leading coefficient has 2 nonzero choices and the others have 3 each, so (b) is $2\cdot9=18$. The number $\sqrt2$ is a zero of $x^2-2$, so (c) is 1.'
          # argument: Proposition 6.8
          - problem: 'Prove: Take a family of subfields $\mathbb{F}_j$ with $j\in J$ of one field $\mathbb{E}$. Then the intersection of all $\mathbb{F}_j$ is a subfield of $\mathbb{E}$.'
            answer_contract: {"kind":"written"}
            answer: 'Each subfield holds 0 and 1 and is closed under the field operations, so the results for elements of the intersection lie in every F_j.'
            solution_sketch: 'The elements 0 and 1 lie in every $\mathbb{F}_j$, so they lie in the intersection. Take $x$ and $y$ in the intersection. Then $x+y$, $xy$ and $-x$ lie in each $\mathbb{F}_j$, because each is a subfield. If $x\neq0$, then $x^{-1}$ lies in each $\mathbb{F}_j$. So the intersection is closed under the operations and holds 0 and 1. The field axioms hold because they hold in $\mathbb{E}$.'
          # source: FoM exercise 6.2-6-9
          - problem: 'Prove: (a) The ring $\mathbb{Z}[\,x\,]$ of polynomials with integer coefficients is countable. (b) The set of algebraic real numbers, which are the zeros of nonzero integer polynomials, is countable. (c) The set of real numbers that are not algebraic is uncountable.'
            answer_contract: {"kind":"written"}
            answer: 'The polynomials form a countable union of countable sets, each polynomial has finitely many zeros, and the reals are uncountable.'
            solution_sketch: 'For (a) the polynomials of degree at most $n$ correspond to $\mathbb{Z}^{n+1}$, which is countable. A countable union over $n$ is countable. For (b) each nonzero polynomial has finitely many zeros. The algebraic numbers form a countable union of finite sets, so they are countable. For (c) the set of real numbers is uncountable. Removing a countable set leaves an uncountable set.'
          # source: FoM exercise 6.2-6-13
          - problem: 'Prove: Let $\mathbb{F}$ be a field and let $\mathbb{D}\subseteq\mathbb{F}$ hold an element other than 0. Then $\mathbb{D}$ is a subfield of $\mathbb{F}$ if and only if it is closed under sum and product and holds $-x$ for each $x$ in $\mathbb{D}$ and $x^{-1}$ for each nonzero $x$ in $\mathbb{D}$.'
            answer_contract: {"kind":"written"}
            answer: 'Closure gives the operations, x plus minus x gives 0, x times its inverse gives 1, and the axioms transfer from F.'
            solution_sketch: 'If $\mathbb{D}$ is a subfield, then Definition 6.6 gives the closure properties. Conversely, take a nonzero $x$ in $\mathbb{D}$. Then $x+(-x)=0$ and $x\,x^{-1}=1$ lie in $\mathbb{D}$. Associativity, commutativity and distributivity hold in $\mathbb{D}$ because they hold in $\mathbb{F}$. Inverses exist by assumption. So $\mathbb{D}$ is a field with the same 0 and 1.'
          # source: FoM exercise 6.2-6-14
          - problem: 'Prove: For every complex number $a+bi$ with real $a$ and $b$, there is a polynomial $p$ with real coefficients such that $p(a+bi)=0$.'
            answer_contract: {"kind":"written"}
            answer: 'Take p(x) = (x-a)^2 + b^2. Then p(a+bi) = (bi)^2 + b^2 = 0.'
            solution_sketch: 'Let $p(x)=x^2-2ax+a^2+b^2=(x-a)^2+b^2$. Its coefficients are real. At $x=a+bi$ we get $(bi)^2+b^2=-b^2+b^2=0$. So $p(a+bi)=0$.'
        constraints: 'Decide whether a set is a subfield and compute in small fields.'
      - id: kp2
        name: 'Definition 6.9, Definition 6.10, Theorem 6.12 and Proposition 6.13: splitting fields and adjoined elements (Example 6.11, Example 6.14)'
        key_prerequisites: [splitting-fields, field-extensions-degree, minimal-polynomials]
        exemplars:
          - problem: 'Let $p$ be a polynomial and let $\mathbb{E}$ be the field named. Give 1 if $p$ splits into linear factors in $\mathbb{E}[\,x\,]$ and 0 if it does not. (a) $x^2-2$ in $\mathbb{Q}(\sqrt2)$ (b) $x^2-2$ in $\mathbb{Q}$ (c) $x^2+1$ in $\mathbb{R}$ (d) $x^2+1$ in $\mathbb{C}$'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 0; c = 0; d = 1'
            solution_sketch: 'In (a) we have $x^2-2=(x-\sqrt2)(x+\sqrt2)$ with both factors over $\mathbb{Q}(\sqrt2)$, so the value is 1. In (b) the zeros are not rational, so the value is 0. In (c) the zeros $\pm i$ are not real, so the value is 0. In (d) we have $(x-i)(x+i)$, so the value is 1.'
          - problem: 'Every element of $\mathbb{Q}(\sqrt2)$ has the form $x+y\sqrt2$ with rational $x$ and $y$. (a) Give $x$ for $(2+\sqrt2)(1+\sqrt2)$. (b) Give $y$ for $(2+\sqrt2)(1+\sqrt2)$. (c) Give $x$ for $1/(1+\sqrt2)$. (d) Give $y$ for $1/(1+\sqrt2)$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}}]}
            answer: 'a = 4; b = 3; c = -1; d = 1'
            solution_sketch: 'We have $(2+\sqrt2)(1+\sqrt2)=2+2\sqrt2+\sqrt2+2=4+3\sqrt2$, so $x=4$ and $y=3$. We have $1/(1+\sqrt2)=(1-\sqrt2)/(1-2)=-1+\sqrt2$, so $x=-1$ and $y=1$.'
          - problem: 'Every element of $\mathbb{Q}(i)$ has the form $u+vi$ with rational $u$ and $v$. (a) Give $u$ for $(2+i)(3-i)$. (b) Give $v$ for $(2+i)(3-i)$. (c) Give $u$ for $(1+i)^4$. (d) Give $v$ for $(1+i)^4$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}}]}
            answer: 'a = 7; b = 1; c = -4; d = 0'
            solution_sketch: 'We have $(2+i)(3-i)=6-2i+3i-i^2=7+i$, so $u=7$ and $v=1$. We have $(1+i)^2=2i$ and $(2i)^2=-4$, so $u=-4$ and $v=0$.'
          - problem: 'Let $p(x)=(x-1)(x^2-3)$ over $\mathbb{Q}$. (a) Give the number of distinct real zeros of $p$. (b) Give the number of those zeros that are not rational. (c) Give the squarefree integer $d>0$ such that $\mathbb{Q}(\sqrt d)$ is the splitting field of $p$ over $\mathbb{Q}$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 3; b = 2; c = 3'
            solution_sketch: 'The zeros are $1,\sqrt3,-\sqrt3$, so (a) is 3. Two of them are not rational, so (b) is 2. By Proposition 6.13 the splitting field is $\mathbb{Q}(\sqrt3,-\sqrt3)=\mathbb{Q}(\sqrt3)$, so $d=3$.'
          - problem: 'Let $p(x)=x^2+4$ over $\mathbb{R}$. (a) Give the number of zeros of $p$ in $\mathbb{C}$ that are not real. (b) Give the imaginary part of the zero with positive imaginary part. (c) Give 1 if the splitting field of $p$ over $\mathbb{R}$ is $\mathbb{C}$ and 0 if it is not.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 2; b = 2; c = 1'
            solution_sketch: 'The zeros are $2i$ and $-2i$, so (a) is 2 and (b) is 2. By Proposition 6.13 the splitting field is $\mathbb{R}(2i,-2i)$. This field holds $i=(2i)/2$ and equals $\mathbb{R}(i)=\mathbb{C}$ by Example 6.11, so (c) is 1.'
          - problem: 'Give 1 if the number lies in $\mathbb{Q}(\sqrt2)$ and 0 if not. (a) $3/(1+\sqrt2)$ (b) $\sqrt3$ (c) $(\sqrt2)^5$ (d) $\sqrt2+\sqrt3$'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 0; c = 1; d = 0'
            solution_sketch: 'The elements of $\mathbb{Q}(\sqrt2)$ are rational combinations of $\sqrt2$ by Theorem 6.12. Numbers (a) and (c) are such combinations, with $(\sqrt2)^5=4\sqrt2$, so they get 1. The number $\sqrt3$ is not of the form $x+y\sqrt2$, so (b) is 0. Then $\sqrt2+\sqrt3$ is not in the field either, so (d) is 0.'
          # argument: Theorem 6.12
          - problem: 'Prove: Suppose $\mathbb{E}$ extends the field $\mathbb{F}$ and the elements $\theta_1,\dots,\theta_n$ lie in $\mathbb{E}\setminus\mathbb{F}$. Then each element of $\mathbb{F}(\theta_1,\dots,\theta_n)$ is a rational combination of the $\theta_j$ and elements of $\mathbb{F}$, built with sums, products, negatives and inverses.'
            answer_contract: {"kind":"written"}
            answer: 'Rational combinations form a field with F and the thetas, and every such subfield holds them, so they equal the smallest one.'
            solution_sketch: 'Show that every rational combination is a quotient of two polynomial combinations, by induction on the number of operations. Then show that the rational combinations form a subfield of $\mathbb{E}$ that holds $\mathbb{F}$ and the $\theta_j$. Next show that each subfield that holds $\mathbb{F}$ and the $\theta_j$ holds all polynomial combinations and then all quotients. By Definition 6.10 the field $\mathbb{F}(\theta_1,\dots,\theta_n)$ is the intersection of all such subfields. So it equals the set of rational combinations.'
          # argument: Proposition 6.13
          - problem: 'Prove: Suppose $p$ is a polynomial over a field $\mathbb{F}$ and $p$ splits in an extension $\mathbb{E}$ of $\mathbb{F}$. Let $\theta_1,\dots,\theta_n$ be the zeros of $p$ in $\mathbb{E}$ that are not in $\mathbb{F}$. Then $\mathbb{F}(\theta_1,\dots,\theta_n)$ is the splitting field for $p$ over $\mathbb{F}$.'
            answer_contract: {"kind":"written"}
            answer: 'The linear factors of p use F and the thetas. A subfield of E where p splits holds all zeros, so it holds F with the thetas adjoined.'
            solution_sketch: 'Write $p=a_d\prod(x-\theta_j)^{m_j}\prod(x-v_k)^{M_k}$ with the zeros $v_k$ in $\mathbb{F}$. All factors lie in $\mathbb{F}(\theta_1,\dots,\theta_n)[\,x\,]$, so $p$ splits there. Let $\mathbb{D}$ be a subfield of $\mathbb{E}$ that holds $\mathbb{F}$ and in which $p$ splits. Unique factorization in $\mathbb{E}[\,x\,]$ shows that the linear factors of $p$ over $\mathbb{D}$ are the same as above, so $\mathbb{D}$ holds the $\theta_j$. By Definition 6.10 it holds $\mathbb{F}(\theta_1,\dots,\theta_n)$. The intersection of all such $\mathbb{D}$ is then this field, which is the splitting field of Definition 6.9.'
          # source: FoM exercise 6.2-6-10
          - problem: 'Prove: Suppose $p$ is a polynomial over a field $\mathbb{F}$ and $\mathbb{S}$ is the splitting field for $p$ over $\mathbb{F}$. Then $p$ splits in $\mathbb{S}$.'
            answer_contract: {"kind":"written"}
            answer: 'S is the intersection of the fields D where p splits, and the linear factors of p have coefficients in every D.'
            solution_sketch: 'By Definition 6.9 the field $\mathbb{S}$ is the intersection of all extension fields $\mathbb{D}$ of $\mathbb{F}$ inside $\mathbb{E}$ in which $p$ splits. In each $\mathbb{D}$ the factorization of $p$ into linear factors is the one in $\mathbb{E}[\,x\,]$, by unique factorization. So the coefficients of these linear factors lie in each $\mathbb{D}$. Hence they lie in the intersection $\mathbb{S}$, and $p$ splits in $\mathbb{S}$.'
          # source: FoM exercise 6.2-6-11
          - problem: 'Prove all parts: Let $\mathbb{E}$ extend the field $\mathbb{F}$ and take $\theta_1,\dots,\theta_n$ in $\mathbb{E}$. A polynomial combination of the $\theta_j$ is a polynomial in the $\theta_j$ with coefficients in $\mathbb{F}$. Let $r_1=p_1/q_1$ and $r_2=p_2/q_2$, where each $p_i$ and $q_i$ is a polynomial combination and no $q_i$ is 0. A quotient of this form is called a rational combination. (a) The product $r_1r_2$ is a rational combination. (b) The negative $-r_1$ is a rational combination. (c) If $r_1\neq0$, then $r_1^{-1}$ is a rational combination.'
            answer_contract: {"kind":"written"}
            answer: 'Use p1 p2 over q1 q2, minus p1 over q1, and q1 over p1, since polynomial combinations are closed under sums, products and negatives.'
            solution_sketch: 'Polynomial combinations are closed under sums, products and negatives. For (a) write $r_1r_2=(p_1p_2)/(q_1q_2)$, and $q_1q_2\neq0$. For (b) write $-r_1=(-p_1)/q_1$. For (c) the numerator $p_1$ is not 0, because $r_1\neq0$, so $r_1^{-1}=q_1/p_1$. These are the steps of the induction in the proof of Theorem 6.12.'
          # source: FoM exercise 6.2-6-12
          - problem: 'Prove all parts: Let $\mathbb{E}$ extend the field $\mathbb{F}$ and take $\theta_1,\dots,\theta_n$ in $\mathbb{E}$. A rational combination of the $\theta_j$ is a quotient $p/q$ of two polynomials in the $\theta_j$ with coefficients in $\mathbb{F}$, where $q$ is not 0. (a) The rational combinations of $\theta_1,\dots,\theta_n$ form a field. (b) Every subfield of $\mathbb{E}$ that holds $\mathbb{F}$ and the $\theta_j$ holds all rational combinations.'
            answer_contract: {"kind":"written"}
            answer: 'For (a) use closure of the quotient form under all operations. For (b) induct on the number of operations, polynomial combinations first.'
            solution_sketch: 'For (a) write each rational combination as a quotient of polynomial combinations, as in Theorem 6.12. Sums, products, negatives and inverses stay in this form, and the field axioms hold in $\mathbb{E}$. For (b) let $\mathbb{D}$ be such a subfield. By induction on the number of operations, $\mathbb{D}$ holds every polynomial combination, because it is closed under sums, products and negatives. Then $\mathbb{D}$ holds every quotient of them with a nonzero denominator, because it is closed under inverses.'
          # source: FoM exercise 6.2-6-15
          - problem: 'Prove: Suppose $\mathbb{E}$ extends the field $\mathbb{F}$ and $\theta\in\mathbb{E}$ is a zero of a nonzero polynomial $p$ over $\mathbb{F}$. Show that some irreducible polynomial $q$ over $\mathbb{F}$ has the zero $\theta$.'
            answer_contract: {"kind":"written"}
            answer: 'Take a nonzero polynomial over F of least degree with the zero theta. A factorization gives theta as a zero of a factor of smaller degree.'
            solution_sketch: 'A nonzero polynomial with a zero has positive degree. Among the nonzero polynomials over $\mathbb{F}$ with the zero $\theta$, pick $q$ of least degree. Assume $q=yz$ with $y$ and $z$ of positive degree. Then $y(\theta)z(\theta)=0$ in the field $\mathbb{E}$, so $y(\theta)=0$ or $z(\theta)=0$. That factor has smaller degree than $q$, which contradicts the choice of $q$. So $q$ is irreducible by Definition 6.1.'
          # source: FoM exercise 6.2-6-16
          - problem: 'Prove all parts. A length is constructible if a straightedge and compass produce a segment of that length, starting from a segment of length 1. (a) Each natural number $n$ is a constructible length. (b) Each positive rational length is constructible. (c) Let $\mathbb{F}_j$ be a subfield of $\mathbb{R}$ that holds the coordinates of the points built so far. A new point is a meeting point of two distinct lines, a line and a circle, or two distinct circles, all through points with coordinates in $\mathbb{F}_j$. Then the new point has coordinates in $\mathbb{F}_j(w)$ for some $w$ with $w^2$ in $\mathbb{F}_j$. Include the tangent case. (d) For each constructible length $c$ there are fields $\mathbb{F}_0=\mathbb{Q}\subseteq\mathbb{F}_1\subseteq\dots\subseteq\mathbb{F}_k$ with $\mathbb{F}_j=\mathbb{F}_{j-1}(w_j)$, $w_j^2\in\mathbb{F}_{j-1}$ and $c\in\mathbb{F}_k$.'
            answer_contract: {"kind":"written"}
            answer: 'Build n by copying and a over b by similar triangles. Lines give linear and circles give quadratic equations, so a new point needs one square root.'
            solution_sketch: 'For (a) copy the unit segment $n$ times in a row. For (b) use similar triangles to get $a/b$ from the lengths $a$ and $b$. For (c) write each line as a linear equation and each circle as a quadratic equation with coefficients in $\mathbb{F}_j$. Two distinct lines give a linear system with a solution in $\mathbb{F}_j$. Subtract the equations of two circles to get a line, then substitute the line into a circle to get a quadratic equation with one square root $w$, and $w=0$ in the tangent case. For (d) use induction on the number of new points and the result of (c).'
        constraints: 'Decide splitting, write elements of an adjoined field, find splitting fields.'
    diagnostic_exemplar:
      problem: '(a) Give the number of zeros of $x^2-4$ in $\mathbb{Q}$. (b) Give the number of zeros of $x^2+1$ in $\mathbb{C}$.'
      answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}}]}
      answer: 'a = 2; b = 2'
      solution_sketch: 'The zeros of $x^2-4$ are 2 and $-2$, so (a) is 2. The zeros of $x^2+1$ are $i$ and $-i$, so (b) is 2.'
