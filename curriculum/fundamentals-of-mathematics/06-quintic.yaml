    knowledge_points:
      - id: kp1
        name: 'Definition 6.1, Lemma 6.2 and Theorem 6.3: irreducible polynomials, Gauss and Eisenstein'
        key_prerequisites: [fom-5-2-fields, polynomial-rings, irreducibility-factorization]
        exemplars:
          - problem: 'Give 1 if the polynomial is irreducible in $\mathbb{Q}[\,x\,]$ and 0 if it is reducible. (a) $x^2-4$ (b) $x^2+1$ (c) $x^2-2x+1$ (d) $x^3-2$'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}}]}
            answer: 'a = 0; b = 1; c = 0; d = 1'
            solution_sketch: 'Polynomial (a) equals $(x-2)(x+2)$, so the value is 0. Polynomial (b) has no rational zero, so the value is 1. Polynomial (c) equals $(x-1)^2$, so the value is 0. Polynomial (d) is a cubic with no rational zero, so the value is 1.'
          - problem: 'Give 1 if the polynomial is irreducible in $\mathbb{R}[\,x\,]$ and 0 if it is reducible. (a) $x^2+1$ (b) $x^2-2$ (c) $x^3+x$ (d) $x$'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 0; c = 0; d = 1'
            solution_sketch: 'Polynomial (a) has no real zero, so the value is 1. Polynomial (b) equals $(x-\sqrt2)(x+\sqrt2)$ over the reals, so the value is 0. Polynomial (c) equals $x(x^2+1)$, so the value is 0. Polynomial (d) has degree 1, so no factors of positive degree exist and the value is 1.'
          - problem: 'Work in $\mathbb{Z}_2[\,x\,]$. Give 1 if the polynomial is irreducible and 0 if it is reducible. (a) $x^2+x+1$ (b) $x^2+1$ (c) $x^3+x+1$ (d) $x^2+x$'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 0; c = 1; d = 0'
            solution_sketch: 'A quadratic or cubic is reducible exactly when it has a zero in $\mathbb{Z}_2$. Polynomial (a) takes the value 1 at 0 and at 1, so the value is 1. Polynomial (b) equals $(x+1)^2$, so the value is 0. Polynomial (c) takes the value 1 at 0 and at 1, so the value is 1. Polynomial (d) equals $x(x+1)$, so the value is 0.'
          - problem: 'Take $p(x)=2x^2+5x-3$. It has integer coefficients and it factors as $(2x-1)(x+a)$ with an integer $a$. (a) Give $a$. (b) Give the denominator of the zero of $p$ that is not an integer. (c) Give the integer zero of $p$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 3; b = 2; c = -3'
            solution_sketch: 'We have $(2x-1)(x+3)=2x^2+5x-3$, so $a=3$. The zeros are $1/2$ and $-3$. The denominator of $1/2$ is 2. The integer zero is $-3$.'
          - problem: 'A prime $q$ meets the Eisenstein conditions for $a_nx^n+\dots+a_0$ if $q$ divides $a_0,\dots,a_{n-1}$, $q$ does not divide $a_n$ and $q^2$ does not divide $a_0$. Give 1 if the conditions hold and 0 if they fail. (a) $x^3+6x+3$ with $q=3$ (b) $x^3+6x+9$ with $q=3$ (c) $2x^3+4x+2$ with $q=2$ (d) $x^4+10x^2+5x+15$ with $q=5$'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 0; c = 0; d = 1'
            solution_sketch: 'In (a) the prime 3 divides 3, 6 and 0, and 9 does not divide 3, so the value is 1. In (b) the number 9 divides the constant 9, so the value is 0. In (c) the prime 2 divides the leading coefficient 2, so the value is 0. In (d) the prime 5 divides 15, 5, 10 and 0, and 25 does not divide 15, so the value is 1.'
          - problem: 'Each polynomial meets the Eisenstein conditions for exactly one prime. Give that prime. (a) $x^2+6x+2$ (b) $x^3+9x^2+15$ (c) $x^4+14x+7$'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 2; b = 3; c = 7'
            solution_sketch: 'In (a) the prime 2 divides 6 and 2, and 4 does not divide 2. In (b) the prime 3 divides 9, 0 and 15, and 9 does not divide 15. In (c) the prime 7 divides 14, 0, 0 and 7, and 49 does not divide 7. The primes are 2, 3 and 7.'
          # argument: Lemma 6.2
          - problem: 'Prove: Let $p$ be a polynomial with integer coefficients. If $p$ is the product of two polynomials of positive degree with rational coefficients, then $p$ is the product of two polynomials of positive degree with integer coefficients.'
            answer_contract: {"kind":"written"}
            answer: 'Clear denominators and divide out gcds to get primitive integer factors. A product of primitive polynomials is primitive.'
            solution_sketch: 'Write $p=yz$ with rational coefficients. Multiply $y$ and $z$ by the least common multiple of their denominators to get integer polynomials. Pull out the gcd of the coefficients of each factor, so that $p=c\,YZ$ with primitive integer polynomials $Y$ and $Z$ and a rational $c$. The product $YZ$ is primitive, because a prime that divides all its coefficients leads to a contradiction. Since $p$ has integer coefficients, $c$ is an integer, and $(cY)Z$ is the wanted factorization.'
          # argument: Theorem 6.3
          - problem: 'Prove: Let $p=a_nx^n+\dots+a_0$ have integer coefficients. Let $q$ be a prime that divides $a_0,\dots,a_{n-1}$ but not $a_n$, and let $q^2$ not divide $a_0$. Then $p$ is irreducible in $\mathbb{Q}[\,x\,]$.'
            answer_contract: {"kind":"written"}
            answer: 'Assume p=yz over the integers. Mod q, p is a_n x^n, so y and z are monomials, q divides both constants, and q squared divides a_0.'
            solution_sketch: 'By Lemma 6.2 it is enough to show that $p$ is irreducible in $\mathbb{Z}[\,x\,]$. Assume $p=yz$ with $y$ and $z$ of positive degree in $\mathbb{Z}[\,x\,]$. Reduce the coefficients mod $q$. Then $p$ becomes $a_nx^n$, so $y$ and $z$ become monomials, because $\mathbb{Z}_q[\,x\,]$ has unique factorization. Both have degree at least 1, so $q$ divides $y_0$ and $z_0$. Then $q^2$ divides $a_0=y_0z_0$, which contradicts the assumption.'
          # source: FoM exercise 6.1-6-1
          - problem: 'Prove: Let $p$ and $q$ be integers with greatest common divisor 1 such that $p/q$ is a zero of $f(x)=a_nx^n+\dots+a_0$ with integer coefficients. (a) Show that $p$ divides $a_0$. (b) Show that $q$ divides $a_n$.'
            answer_contract: {"kind":"written"}
            answer: 'Multiply f(p/q)=0 by q^n. Then p divides a_0 q^n and q divides a_n p^n, and the gcd of p and q is 1.'
            solution_sketch: 'Multiply $f(p/q)=0$ by $q^n$ to get $a_np^n+a_{n-1}p^{n-1}q+\dots+a_0q^n=0$. Every term except the last has the factor $p$, so $p$ divides $a_0q^n$. Every term except the first has the factor $q$, so $q$ divides $a_np^n$. The numbers $p$ and $q$ share no prime factor. So $p$ divides $a_0$ and $q$ divides $a_n$.'
          # source: FoM exercise 6.1-6-2
          - problem: 'Prove: (a) For every prime $p$ and every integer $n\ge2$, the $n$-th root of $p$ is not rational. (b) Let $k$ and $n\ge2$ be natural numbers such that the $n$-th root of $k$ is rational. Then $k$ is the $n$-th power of a natural number. Use the Rational Zeros Theorem.'
            answer_contract: {"kind":"written"}
            answer: 'A rational n-th root of k is a rational zero of x^n minus k, so it is an integer r with r^n = k. A prime is no n-th power.'
            solution_sketch: 'A rational $n$-th root $r$ of $k$ is a zero of $x^n-k$. By the Rational Zeros Theorem the denominator of $r$ divides the leading coefficient 1, so $r$ is an integer. Then $k=r^n$, which proves (b). For (a) let $k=p$ be prime. A prime has no representation $r^n$ with $n\ge2$, because $r^n$ has at least $n$ prime factors counted with multiplicity or equals 1. So the $n$-th root of $p$ is not rational.'
          # source: FoM exercise 6.1-6-3
          - problem: 'Prove: Let $R$ be a commutative ring, let $p\in R[\,x\,]$ and let $a\in R$. Then $p$ is irreducible in $R[\,x\,]$ if and only if $g(x)=p(x-a)$ is irreducible in $R[\,x\,]$.'
            answer_contract: {"kind":"written"}
            answer: 'A factorization p=yz gives g(x)=y(x-a)z(x-a) with the same degrees, and the shift by a gives the converse.'
            solution_sketch: 'Assume $p=yz$ with $y$ and $z$ of positive degree. Then $g(x)=y(x-a)z(x-a)$, and the factors keep their degrees, so $g$ is reducible by Definition 6.1. Apply the same argument to $g$ and the shift by $-a$ to get $p(x)=g(x+a)$. So the polynomial $g$ is reducible exactly when $p$ is reducible.'
          # source: FoM exercise 6.1-6-4
          - problem: 'Prove: For every prime $p$, the polynomial $f(x)=x^{p-1}+x^{p-2}+\dots+x+1$ is irreducible in $\mathbb{Q}[\,x\,]$.'
            answer_contract: {"kind":"written"}
            answer: 'Expand f(x+1) = ((x+1)^p - 1)/x by the Binomial Theorem. Its coefficients are divisible by p and the constant is p, so Eisenstein applies.'
            solution_sketch: 'We have $f(x)(x-1)=x^p-1$, so $f(x+1)=((x+1)^p-1)/x$. By the Binomial Theorem $f(x+1)=x^{p-1}+\binom{p}{p-1}x^{p-2}+\dots+\binom{p}{2}x+p$. The prime $p$ divides $\binom{p}{k}$ for $0<k<p$. The constant $p$ is not divisible by $p^2$, and the leading coefficient is 1. So Theorem 6.3 applies with the prime $p$ and shows that $f(x+1)$ is irreducible. By Exercise 6-3, $f$ is irreducible.'
        constraints: 'Decide irreducibility of small polynomials and check the Eisenstein conditions.'
      - id: kp2
        name: 'Example 6.4: x^5 - 4x + 2 is irreducible, with shifts and zero counts'
        key_prerequisites: [fom-5-2-fields, irreducibility-factorization]
        exemplars:
          - problem: 'Take $p(x)=x^5-4x+2$. (a) Give the prime $q$ that Eisenstein''s criterion uses for $p$. (b) Give the largest exponent $e$ with $q^e$ dividing the constant coefficient. (c) Give the number of coefficients of $x^0,x^1,x^2,x^3,x^4$ that $q$ divides, counting the zero coefficients.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 2; b = 1; c = 5'
            solution_sketch: 'The constant 2 has only the prime 2, so $q=2$. The number 4 does not divide 2, so $e=1$. The coefficients of $x^0$ to $x^4$ are $2,-4,0,0,0$. The prime 2 divides all 5 of them.'
          - problem: 'Let $p(x)=x^2+4x+7$ and $g(x)=p(x-2)$. (a) Give the coefficient of $x$ in $g$. (b) Give the constant term of $g$. (c) Give 1 if $g$ is irreducible in $\mathbb{Q}[\,x\,]$ and 0 if it is reducible.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 0; b = 3; c = 1'
            solution_sketch: 'We have $g(x)=(x-2)^2+4(x-2)+7=x^2-4x+4+4x-8+7=x^2+3$. So the coefficient of $x$ is 0 and the constant is 3. The polynomial $x^2+3$ has no rational zero, so $g$ is irreducible and (c) is 1.'
          - problem: 'Let $f(x)=x^2+x+1$ and $h(x)=f(x+1)$. (a) Give the coefficient of $x$ in $h$. (b) Give the constant term of $h$. (c) Give the prime for which $h$ meets the Eisenstein conditions.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 3; b = 3; c = 3'
            solution_sketch: 'We have $h(x)=(x+1)^2+(x+1)+1=x^2+2x+1+x+1+1=x^2+3x+3$. The coefficient of $x$ is 3 and the constant is 3. The prime 3 divides 3 and 3, and 9 does not divide 3. So the prime is 3.'
          - problem: 'The polynomial $x^2-2x+5$ has the zero $1+2i$. (a) Give the real part of the other zero. (b) Give the imaginary part of the other zero. (c) Give the product of the two zeros.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = -2; c = 5'
            solution_sketch: 'The coefficients are real, so the other zero is the mirror value $1-2i$. Its real part is 1 and its imaginary part is $-2$. The product is $(1+2i)(1-2i)=1+4=5$.'
          - problem: 'Let $f(x)=2x^3-3x^2-3x+2$. (a) Give the number of distinct values $p/q$ that the Rational Zeros Theorem allows as zeros, with $p$ dividing 2, $q$ dividing 2 and $q>0$. (b) Give the smallest rational zero of $f$. (c) Give the number of rational zeros of $f$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 6; b = -1; c = 3'
            solution_sketch: 'The candidates are $\pm1,\pm2,\pm1/2$, which makes 6. We have $f(2)=16-12-6+2=0$ and $f(-1)=-2-3+3+2=0$ and $f(1/2)=1/4-3/4-3/2+2=0$. So $f$ has the 3 zeros $2$, $-1$ and $1/2$. The smallest is $-1$.'
          - problem: 'Let $f(x)=x^4-3x^3+2x^2+x-5$. (a) Give the count of sign flips along the coefficients of $f(x)$. (b) Give the count of sign flips along the coefficients of $f(-x)$. (c) Give the smallest possible number of positive zeros of $f$, counted with multiplicity, by Descartes'' Rule of Signs.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 3; b = 1; c = 1'
            solution_sketch: 'The coefficients $1,-3,2,1,-5$ change sign 3 times. We have $f(-x)=x^4+3x^3+2x^2-x-5$, with coefficients $1,3,2,-1,-5$, which change sign 1 time. The number of positive zeros is 3 or $3-2=1$, so the smallest is 1.'
          # source: FoM exercise 6.1-6-8
          - problem: 'Prove: Take a real polynomial $f$. Let $V$ be the number of times the sign flips along its coefficients in order, with zeros skipped. (a) With $f=a_0x^n+\dots+a_n$ and $a_0$ and $a_n$ nonzero, the number of positive zeros is even if $a_0a_n>0$ and odd if $a_0a_n<0$, counted with multiplicity. (b) $V$ has the same parity. (c) Dividing out a positive zero lowers $V$ by at least 1. (d) The number of positive zeros equals $V$ or is smaller by an even number. (e) The same holds for negative zeros with $f(-x)$.'
            answer_contract: {"kind":"written"}
            answer: 'Dividing out a positive zero lowers the sign changes by at least 1, so zeros are at most V. Both counts have the parity set by the sign of a_0 a_n.'
            solution_sketch: 'For (a) use the Intermediate Value Theorem and the equal signs of $f$ for large positive $x$. For (b) use induction on $n$ with the sign of $a_0a_n$. For (c) write $f(x)=(x-\rho)g(x)$ with $\rho>0$ and compare the coefficient sequences of $f$ and $g$ by induction on $n$. Repeat (c) for each zero to get $V-t\ge0$ for $t$ positive zeros. Parts (a) and (b) give the same parity for $t$ and $V$, so $V-t$ is even, which proves (d). Apply (d) to $f(-x)$ for (e).'
          # source: FoM exercise 6.1-6-6
          - problem: 'Prove: Let $p(x)=a_nx^n+\dots+a_0$ have real coefficients, and let $a+bi$ with $b\neq0$ be a zero of $p$. Then $a-bi$ is a zero of $p$.'
            answer_contract: {"kind":"written"}
            answer: 'The bar map respects sums and products and fixes real coefficients, so the bar of p(z) equals p of the bar of z, and 0 is fixed.'
            solution_sketch: 'For complex $z$ and $w$ we have $\overline{z+w}=\bar z+\bar w$ and $\overline{zw}=\bar z\bar w$. The coefficients $a_j$ are real, so $\overline{a_j}=a_j$. Hence $\overline{p(z)}=p(\bar z)$. With $z=a+bi$ we get $p(\bar z)=\overline{0}=0$. So $a-bi$ is a zero of $p$.'
          # source: FoM exercise 6.1-6-7
          - problem: 'Prove: The polynomial $2x^2-4$ is irreducible in $\mathbb{Q}[\,x\,]$, although it factors as $2(x^2-2)$.'
            answer_contract: {"kind":"written"}
            answer: 'The factor 2 has degree 0, so it does not count. Two linear factors give a rational zero, but the square root of 2 is not rational.'
            solution_sketch: 'Definition 6.1 asks for two factors of positive degree. The factor 2 has degree 0, so $2(x^2-2)$ does not show reducibility. Assume $2x^2-4=yz$ with $y$ and $z$ of degree 1. Then $p$ has a rational zero $r$ with $r^2=2$. No such rational number exists, so the polynomial is irreducible in $\mathbb{Q}[\,x\,]$.'
          # source: FoM exercise 6.1-6-5
          - problem: 'Prove: The polynomial $f(x)=8x^3-6x-1$ is irreducible in $\mathbb{Q}[\,x\,]$.'
            answer_contract: {"kind":"written"}
            answer: 'A reducible cubic has a rational zero. The Rational Zeros Theorem leaves a short list of candidates, and none is a zero.'
            solution_sketch: 'A cubic with a factorization has a factor of degree 1, so it has a rational zero. By Exercise 6-1 the candidates are $\pm1,\pm1/2,\pm1/4,\pm1/8$. With $y=2x$ we get $f=y^3-3y-1$, and a zero $y$ must be an integer dividing $-1$. We have $1-3-1=-3$ and $-1+3-1=1$, so neither $y=1$ nor $y=-1$ is a zero. So $f$ has no rational zero and is irreducible.'
        constraints: 'Apply Eisenstein after a shift, count zeros and sign changes.'
    diagnostic_exemplar:
      problem: '(a) Give 1 if $x^2+1$ is reducible in $\mathbb{R}[\,x\,]$ and 0 if it is irreducible. (b) Give 1 if $x^2-1$ is reducible in $\mathbb{Q}[\,x\,]$ and 0 if it is irreducible.'
      answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}}]}
      answer: 'a = 0; b = 1'
      solution_sketch: 'The polynomial $x^2+1$ has no real zero, so (a) is 0. The polynomial $x^2-1$ equals $(x-1)(x+1)$, so (b) is 1.'
