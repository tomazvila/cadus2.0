    knowledge_points:
      - id: kp1
        name: 'Theorem 6.35 and Definition 6.36: normal extensions and three equivalent conditions'
        key_prerequisites: [fom-6-2-field-extensions-splitting-fields, fom-6-3-uniqueness-splitting-field, fom-6-4-field-automorphisms-galois-groups, fom-4-5-division-rings]
        exemplars:
          - problem: 'Give 1 if $\mathbb{E}$ is a normal extension of $\mathbb{F}$ and 0 if it is not. (a) $\mathbb{E}=\mathbb{Q}(\sqrt{2})$, $\mathbb{F}=\mathbb{Q}$ (b) $\mathbb{E}=\mathbb{R}$, $\mathbb{F}=\mathbb{Q}$ (c) $\mathbb{E}=\mathbb{C}$, $\mathbb{F}=\mathbb{R}$ (d) $\mathbb{E}=\mathbb{Q}(\sqrt[3]{2})$, $\mathbb{F}=\mathbb{Q}$'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 0; c = 1; d = 0'
            solution_sketch: 'A normal extension is finite, and each irreducible polynomial with one zero in it has all its zeros in it. In (a) the field is the splitting field of $x^2-2$, so the value is 1. In (b) the extension is not finite, so the value is 0. In (c) the field is the splitting field of $x^2+1$, so the value is 1. In (d) the polynomial $x^3-2$ has a zero in the field and two zeros outside it, so the value is 0.'
          - problem: 'Give 1 if every zero of the polynomial in $\mathbb{C}$ lies in the field $\mathbb{E}$ and 0 if not. (a) $x^2-2$ and $\mathbb{E}=\mathbb{Q}(\sqrt{2})$ (b) $x^3-2$ and $\mathbb{E}=\mathbb{Q}(\sqrt[3]{2})$ (c) $x^2+1$ and $\mathbb{E}=\mathbb{Q}(i)$ (d) $x^2-3$ and $\mathbb{E}=\mathbb{Q}(\sqrt{2})$'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 0; c = 1; d = 0'
            solution_sketch: 'The zeros of $x^2-2$ are $\pm\sqrt{2}$, both in the field, so (a) is 1. The zeros of $x^3-2$ include two nonreal numbers, and the field is real, so (b) is 0. The zeros of $x^2+1$ are $\pm i$, both in $\mathbb{Q}(i)$, so (c) is 1. The zeros of $x^2-3$ are $\pm\sqrt{3}$, which are outside $\mathbb{Q}(\sqrt{2})$, so (d) is 0.'
          - problem: 'Count zeros of polynomials. (a) Give the number of zeros of $x^3-2$ in $\mathbb{C}$. (b) Give the number of zeros of $x^3-2$ in $\mathbb{R}$. (c) Give the number of zeros of $x^4-16$ in $\mathbb{R}$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 3; b = 1; c = 2'
            solution_sketch: 'A polynomial of degree 3 has 3 zeros in $\mathbb{C}$, and $x^3-2$ has distinct zeros, so (a) is 3. Only the cube root of 2 is real, so (b) is 1. We have $x^4-16=(x^2-4)(x^2+4)$. The real zeros are 2 and -2, so (c) is 2.'
          - problem: 'Give the characteristic of each field. (a) $\mathbb{Q}$ (b) $\mathbb{F}_3$ (c) $\mathbb{F}_5$ (d) $\mathbb{Q}(\sqrt{2})$'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}}]}
            answer: 'a = 0; b = 3; c = 5; d = 0'
            solution_sketch: 'The characteristic is the smallest positive $m$ with $m\cdot 1=0$, or 0 if no such $m$ exists. In $\mathbb{Q}$ no sum of ones is 0, so (a) is 0. In $\mathbb{F}_3$ we have $1+1+1=0$, so (b) is 3. In $\mathbb{F}_5$ the value is 5. The field $\mathbb{Q}(\sqrt{2})$ holds $\mathbb{Q}$, so (d) is 0.'
          - problem: 'Give 1 if $\mathbb{F}$ is the fixed field of $G(\mathbb{E}/\mathbb{F})$ and 0 if it is not. (a) $\mathbb{E}=\mathbb{Q}(\sqrt{2})$, $\mathbb{F}=\mathbb{Q}$ (b) $\mathbb{E}=\mathbb{C}$, $\mathbb{F}=\mathbb{R}$ (c) $\mathbb{E}=\mathbb{Q}(\sqrt[3]{2})$, $\mathbb{F}=\mathbb{Q}$ (d) $\mathbb{E}=\mathbb{Q}(\sqrt[3]{2})$, $\mathbb{F}=\mathbb{Q}(\sqrt[3]{2})$'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 1; c = 0; d = 1'
            solution_sketch: 'In (a) the nonidentity map sends $\sqrt{2}$ to $-\sqrt{2}$, so only rational numbers stay fixed, and the value is 1. In (b) conjugation fixes only real numbers, so the value is 1. In (c) the group has 1 element, so the fixed field is the whole of $\mathbb{E}$, which is larger than $\mathbb{Q}$, and the value is 0. In (d) the fixed field is $\mathbb{E}=\mathbb{F}$, so the value is 1.'
          - problem: 'Give the degree of the splitting field over the base field. (a) $x^2-5$ over $\mathbb{Q}$ (b) $x^3-2$ over $\mathbb{Q}$ (c) $x^2+1$ over $\mathbb{R}$'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 2; b = 6; c = 2'
            solution_sketch: 'The splitting field of $x^2-5$ is $\mathbb{Q}(\sqrt{5})$, of degree 2. The splitting field of $x^3-2$ holds the real cube root of 2, which gives degree 3, and a cube root of unity, which gives a further factor 2. So (b) is 6. The splitting field of $x^2+1$ over $\mathbb{R}$ is $\mathbb{C}$, of degree 2.'
          # argument: Theorem 6.35
          - problem: 'Prove the first step: Take a field $\mathbb{F}$ with characteristic 0 and a finite extension $\mathbb{E}$ that is the splitting field of a polynomial $f$ over $\mathbb{F}$ of positive degree. Then each irreducible polynomial over $\mathbb{F}$ with one zero in $\mathbb{E}$ splits in $\mathbb{E}$.'
            answer_contract: {"kind":"written"}
            answer: 'Lemmas 6.22 and 6.23 give an isomorphism of E onto E(t2) that fixes F. The degrees match, so E equals E(t2) and t2 lies in E.'
            solution_sketch: 'Let t1 in E and t2 be zeros of p. Lemma 6.22 gives an isomorphism from F(t1) to F(t2) that sends t1 to t2. The field E is the splitting field of f over F(t1), and E(t2) is the splitting field of f over F(t2), by Proposition 6.13. Lemma 6.23 extends the isomorphism to E and E(t2) and fixes F. So the degrees over F agree, which gives E equal to E(t2), so t2 is in E.'
          # argument: Theorem 6.35
          - problem: 'Prove the second step: Take a field $\mathbb{F}$ with characteristic 0 and a finite extension $\mathbb{E}$ in which each irreducible polynomial over $\mathbb{F}$ with one zero in $\mathbb{E}$ splits. Then $\mathbb{F}$ is the fixed field of $G(\mathbb{E}/\mathbb{F})$.'
            answer_contract: {"kind":"written"}
            answer: 'A t outside F has an irreducible polynomial with a second zero in E. Lemmas 6.22 and 6.23 give an automorphism that moves t.'
            solution_sketch: 'Let t be in E outside F and let p be its irreducible polynomial. By assumption p splits in E, and p has a zero t2 different from t, because the characteristic is 0. Lemma 6.22 maps F(t) to F(t2), and Lemma 6.23 extends the map to an automorphism of E that fixes F. This automorphism sends t to t2, so t is not fixed. Hence only elements of F are fixed.'
          # argument: Theorem 6.35
          - problem: 'Prove the third step: Take a field $\mathbb{F}$ with characteristic 0 and a finite extension $\mathbb{E}$ such that $\mathbb{F}$ is the fixed field of $G(\mathbb{E}/\mathbb{F})$. Then $\mathbb{E}$ is the splitting field of some polynomial over $\mathbb{F}$ of positive degree.'
            answer_contract: {"kind":"written"}
            answer: 'For each a in E, the product of x minus each image of a has coefficients in F. The product over a basis has splitting field E.'
            solution_sketch: 'For a in E let a_1,...,a_n be the distinct images of a under G(E/F). This set is finite by Theorems 6.25 and 6.31. Form f_a, the product of x minus a_j. Each automorphism permutes the a_j, so it fixes the coefficients of f_a, and by Corollary 4.59 these coefficients lie in F. Take the product of f_v over a basis v of E over F. This polynomial splits in E and its splitting field holds all basis vectors, so it equals E.'
          # source: FoM exercise 6.5-6-40
          - problem: 'Take an automorphism $\sigma$ of a field $\mathbb{E}$. Let $\tilde\sigma$ map a polynomial over $\mathbb{E}$ to the polynomial with $\sigma$ applied to each coefficient. (a) Prove that $\tilde\sigma$ is a ring isomorphism on the polynomials over $\mathbb{E}$. (b) For a polynomial $p$ over $\mathbb{F}$ and $\sigma\in G(\mathbb{E}/\mathbb{F})$, prove that $p$ and $\tilde\sigma(p)$ share their zeros. (c) For a polynomial $p$ over $\mathbb{E}$ with all zeros fixed by $\sigma$, prove that $p$ and $\tilde\sigma(p)$ have the same zeros.'
            answer_contract: {"kind":"written"}
            answer: 'Check (a) on sums, products and inverses of coefficients; for (b) sigma fixes the coefficients; for (c) apply sigma to p of a zero.'
            solution_sketch: 'For (a) the sum rule is clear. The product rule follows from the formula for the coefficients of a product, because sigma keeps sums and products. The inverse map uses the inverse of sigma. For (b) the coefficients of p lie in F and sigma fixes them, so the image of p is p. For (c) if z is a zero of p, then the image of p at sigma(z) equals sigma of p(z), which is 0, and sigma(z)=z.'
        constraints: 'Decide normality, count zeros, find characteristics and fixed fields.'
      - id: kp2
        name: 'Example 6.37 and Theorem 6.38: the size of the group of a normal extension equals the degree'
        key_prerequisites: [fom-6-1-irreducible-polynomials, fom-6-2-field-extensions-splitting-fields, fom-6-3-uniqueness-splitting-field, fom-6-4-field-automorphisms-galois-groups]
        exemplars:
          - problem: 'Each extension is normal over its base field. Give the number of elements of the group. (a) $G(\mathbb{Q}(\sqrt{2})/\mathbb{Q})$ (b) $G(\mathbb{C}/\mathbb{R})$ (c) $G(\mathbb{Q}(\sqrt{2})/\mathbb{Q}(\sqrt{2}))$'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 2; b = 2; c = 1'
            solution_sketch: 'For a normal extension the number of elements equals the degree. The degree $[\mathbb{Q}(\sqrt{2}):\mathbb{Q}]$ is 2, so (a) is 2. The degree $[\mathbb{C}:\mathbb{R}]$ is 2, so (b) is 2. The degree of a field over itself is 1, so (c) is 1.'
          - problem: 'Let $\mathbb{E}=\mathbb{Q}(\sqrt{2},\sqrt{3})$, the splitting field of $(x^2-2)(x^2-3)$ over $\mathbb{Q}$. (a) Give $[\mathbb{E}:\mathbb{Q}]$. (b) Give the number of elements of $G(\mathbb{E}/\mathbb{Q})$. (c) Give the number of elements of $G(\mathbb{E}/\mathbb{Q}(\sqrt{2}))$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 4; b = 4; c = 2'
            solution_sketch: 'Adjoining $\sqrt{2}$ gives degree 2, and adjoining $\sqrt{3}$ after that gives another factor 2. So (a) is 4. The extension is normal, so the group has 4 elements as well. Over $\mathbb{Q}(\sqrt{2})$ the degree is 2, so (c) is 2.'
          - problem: 'Count zeros. (a) Give the number of real zeros of $x^3-5$. (b) Give the number of nonreal zeros of $x^3-5$ in $\mathbb{C}$. (c) Give 1 if $\mathbb{Q}(\sqrt[3]{5})$ is a normal extension of $\mathbb{Q}$ and 0 if it is not.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 2; c = 0'
            solution_sketch: 'The real cube root of 5 is the only real zero of $x^3-5$, so (a) is 1. The cubic has 3 zeros in $\mathbb{C}$, so 2 zeros are nonreal and (b) is 2. The irreducible polynomial $x^3-5$ has one zero in $\mathbb{Q}(\sqrt[3]{5})$ but not all of them, so (c) is 0.'
          - problem: 'Give each value. (a) Give $[\mathbb{Q}(\sqrt[3]{2}):\mathbb{Q}]$. (b) Give the number of elements of $G(\mathbb{Q}(\sqrt[3]{2})/\mathbb{Q})$. (c) Give the number of elements of $G(\mathbb{E}/\mathbb{Q})$, where $\mathbb{E}$ is the splitting field of $x^3-2$ over $\mathbb{Q}$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 3; b = 1; c = 6'
            solution_sketch: 'The polynomial $x^3-2$ is irreducible of degree 3, so (a) is 3. Only the real zero lies in the real field, so the group has 1 element and (b) is 1. The splitting field $\mathbb{E}$ is normal over $\mathbb{Q}$ with degree 6. So its group has 6 elements and (c) is 6.'
          - problem: 'Let $\mathbb{E}=\mathbb{Q}(\sqrt{2},\sqrt{3})$. (a) Give the number of zeros of $x^2-2$ in $\mathbb{E}$. (b) Give the number of zeros of $x^2-3$ in $\mathbb{E}$. (c) Give the number of pairs $(\sigma(\sqrt{2}),\sigma(\sqrt{3}))$ that occur as $\sigma$ runs over $G(\mathbb{E}/\mathbb{Q})$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 2; b = 2; c = 4'
            solution_sketch: 'Each of the two polynomials has two zeros, and all four lie in $\mathbb{E}$. So (a) is 2 and (b) is 2. An automorphism is determined by the two images. The group has 4 elements, so all 4 pairs of images occur and (c) is 4.'
          - problem: 'Give each value. (a) Give $[\mathbb{Q}(\sqrt{2},\sqrt{3}):\mathbb{Q}(\sqrt{3})]$. (b) Give $[\mathbb{Q}(\sqrt{2},\sqrt{3},\sqrt{5}):\mathbb{Q}]$. (c) Give the number of elements of $G(\mathbb{Q}(\sqrt{2},\sqrt{3},\sqrt{5})/\mathbb{Q})$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 2; b = 8; c = 8'
            solution_sketch: 'Adjoining $\sqrt{2}$ to $\mathbb{Q}(\sqrt{3})$ doubles the degree, so (a) is 2. Each of the three square roots doubles the degree, so (b) is $2\cdot2\cdot2=8$. The field is the splitting field of $(x^2-2)(x^2-3)(x^2-5)$. It is normal over $\mathbb{Q}$, so the group has 8 elements.'
          # argument: Theorem 6.38
          - problem: 'Prove the first step: Take a normal extension $\mathbb{E}$ of a field $\mathbb{F}$ with characteristic 0. Then $\mathbb{E}=\mathbb{F}(\theta)$ for some $\theta$ whose irreducible polynomial has degree $n=[\mathbb{E}:\mathbb{F}]$, and $G(\mathbb{E}/\mathbb{F})$ has at most $n$ elements.'
            answer_contract: {"kind":"written"}
            answer: 'E is a splitting field with one generator theta. The powers of theta give the degree n, and Theorem 6.31 bounds the group by n.'
            solution_sketch: 'By Theorem 6.35 the field E is a splitting field, so E=F(g_1,...,g_m) by Proposition 6.13. Theorem 6.25 gives theta with E=F(theta). Let p be the irreducible polynomial of theta, of degree n. By Theorem 6.20 the powers of theta up to n-1 form a basis, so n=[E:F]. Then Theorem 6.31 gives at most n automorphisms.'
          # argument: Theorem 6.38
          - problem: 'Prove the second step: In the setting of the first step, $G(\mathbb{E}/\mathbb{F})$ has at least $n$ elements, so $|G(\mathbb{E}/\mathbb{F})|=[\mathbb{E}:\mathbb{F}]$.'
            answer_contract: {"kind":"written"}
            answer: 'The polynomial p has n distinct zeros in E. Lemmas 6.22 and 6.23 give one automorphism for each zero, and these differ.'
            solution_sketch: 'The characteristic is 0, so p has n distinct zeros t_1=theta,...,t_n. Since E is normal and theta lies in E, all t_j lie in E. For each j, Lemma 6.22 gives an isomorphism from F(theta) to F(t_j) with theta mapped to t_j. Lemma 6.23 extends it to an automorphism of E that fixes F. These n automorphisms send theta to different values, so they differ, and there are at least n of them.'
          # source: FoM exercise 6.5-6-41
          - problem: 'Take a field $\mathbb{F}$ with characteristic 0, a normal extension $\mathbb{D}$ of $\mathbb{F}$ and a normal extension $\mathbb{E}$ of $\mathbb{D}$. Prove that $\mathbb{E}$ need not be normal over $\mathbb{F}$. Use $\mathbb{F}=\mathbb{Q}$, $\mathbb{D}=\mathbb{Q}(\sqrt{2})$, and $\mathbb{E}$ the splitting field of $x^2-\sqrt{2}$ over $\mathbb{D}$.'
            answer_contract: {"kind":"written"}
            answer: 'The field E holds the real fourth root of 2. The polynomial x^4-2 is irreducible over Q, but its nonreal zeros are not in E.'
            solution_sketch: 'The field D is the splitting field of x^2-2 and E is the splitting field of x^2 minus the square root of 2, so both steps are normal. The field E is real and holds the real fourth root r of 2. The polynomial x^4-2 is irreducible over Q by Eisenstein, and r is a zero in E. The zero i r is nonreal, so it is not in E. Hence E is not normal over Q.'
          # source: FoM exercise 6.5-6-42
          - problem: 'Take a field $\mathbb{F}$ with characteristic 0 and a normal extension $\mathbb{E}\supset\mathbb{F}$. Assume $\mathbb{E}\neq\mathbb{F}$. Prove that $\mathbb{E}=\mathbb{F}(w)$ for some $w$ outside $\mathbb{F}$, and that for some $k$ the powers $1,w,\dots,w^{k-1}$ form a basis of $\mathbb{E}$ over $\mathbb{F}$.'
            answer_contract: {"kind":"written"}
            answer: 'A normal extension is a splitting field, so one generator w exists. Its powers form a basis, and w lies outside F because E differs from F.'
            solution_sketch: 'By Theorem 6.35 the field E is a splitting field. Proposition 6.13 writes E as F with finitely many zeros adjoined. Theorem 6.25 gives w with E=F(w), and the irreducible polynomial of w has degree k. By Theorem 6.20 the powers 1, w, up to w^(k-1) are a basis. If w lay in F, then E equals F, which is excluded.'
        constraints: 'Compare group sizes with degrees of small extensions.'
    diagnostic_exemplar:
      problem: '(a) Give the degree $[\mathbb{Q}(\sqrt{7}):\mathbb{Q}]$. (b) Give 1 if $\mathbb{Q}(\sqrt{7})$ is a normal extension of $\mathbb{Q}$ and 0 if it is not.'
      answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}}]}
      answer: 'a = 2; b = 1'
      solution_sketch: 'The polynomial $x^2-7$ is irreducible over $\mathbb{Q}$, so the degree is 2. The field is the splitting field of $x^2-7$, so it is a normal extension. Hence (a) is 2 and (b) is 1.'
