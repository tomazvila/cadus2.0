        exemplars:
          - problem: 'For each extension, give 1 if it is a finite extension and 0 if it is not. (a) $\mathbb{C}$ over $\mathbb{R}$. (b) $\mathbb{R}$ over $\mathbb{Q}$. (c) $\{a+b\sqrt2 : a,b\in\mathbb{Q}\}$ over $\mathbb{Q}$. (d) $\mathbb{R}$ over $\mathbb{R}$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 0; c = 1; d = 1'
            solution_sketch: 'The sets $\{1,i\}$, $\{1,\sqrt2\}$ and $\{1\}$ are bases in (a), (c) and (d), so those values are 1. The field $\mathbb{R}$ is not countable. Every field with a finite basis over $\mathbb{Q}$ is countable, so (b) is 0.'
          - problem: 'Give the index of each extension. (a) $[\mathbb{C}:\mathbb{R}]$. (b) $[\mathbb{C}:\mathbb{C}]$. (c) $[\mathbb{Q}(i):\mathbb{Q}]$, where $\mathbb{Q}(i)=\{a+bi : a,b\in\mathbb{Q}\}$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 2; b = 1; c = 2'
            solution_sketch: 'The basis $\{1,i\}$ works in (a) and in (c), so both indices are 2. In (b) the basis $\{1\}$ has one element, so the index is 1.'
          - problem: 'For each set, give 1 if the set is countable and 0 if it is not. (a) $\mathbb{Q}$. (b) $\mathbb{R}$. (c) The set of all numbers $\lambda_1\sqrt2+\lambda_2\sqrt3+\lambda_3\sqrt5$ with $\lambda_1,\lambda_2,\lambda_3\in\mathbb{Q}$. (d) $\mathbb{C}$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 0; c = 1; d = 0'
            solution_sketch: 'The set $\mathbb{Q}$ is countable, so (a) is 1. The set in (c) is the image of $\mathbb{Q}^3$, which is countable, so (c) is 1. The sets $\mathbb{R}$ and $\mathbb{C}$ are not countable, so (b) and (d) are 0.'
          - problem: 'Write $(3-4i)^2$ as $\lambda_1+\lambda_2i$ with real $\lambda_1,\lambda_2$. Give (a) $\lambda_1$ and (b) $\lambda_2$. Then (c) compute $(3-4i)(3+4i)$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = -7; b = -24; c = 25'
            solution_sketch: 'Expand: $(3-4i)^2=9-24i+16i^2=-7-24i$. So (a) is -7 and (b) is -24. Also $(3-4i)(3+4i)=9+16=25$, so (c) is 25.'
          - problem: 'The numbers $1,\sqrt2,\sqrt3$ are linearly independent over $\mathbb{Q}$, so different coefficient lists give different numbers. Count the different numbers of the form $\lambda_1+\lambda_2\sqrt2+\lambda_3\sqrt3$ when (a) each $\lambda_j$ is in $\{0,1,2\}$, (b) each $\lambda_j$ is in $\{0,1\}$, (c) $\lambda_3=0$ and $\lambda_1,\lambda_2$ are in $\{0,1,2,3\}$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 27; b = 8; c = 16'
            solution_sketch: 'Each coefficient list gives its own number. In (a) there are $3\cdot3\cdot3=27$ lists. In (b) there are $2\cdot2\cdot2=8$ lists. In (c) there are $4\cdot4=16$ lists.'
          - problem: 'In $\mathbb{C}$ over $\mathbb{R}$, the set $\{1+i,\ 1-i\}$ is a basis. Write $3+5i=\lambda(1+i)+\mu(1-i)$ and $6i=\lambda''(1+i)+\mu''(1-i)$ with real coefficients. Give (a) $\lambda$, (b) $\mu$, (c) $\lambda''$, (d) $\mu''$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}}]}
            answer: 'a = 4; b = -1; c = 3; d = -3'
            solution_sketch: 'Compare real and imaginary parts. For $3+5i$ we need $\lambda+\mu=3$ and $\lambda-\mu=5$, so $\lambda=4$ and $\mu=-1$. For $6i$ we need $\lambda''+\mu''=0$ and $\lambda''-\mu''=6$, so $\lambda''=3$ and $\mu''=-3$.'
          # source: FoM exercise 6.3-6-21
          - problem: 'Prove: Take an extension $E$ of a field $F$ and elements $\theta_1,\dots,\theta_n\in E$. For every $k\in\{2,\dots,n\}$ we have $F(\theta_1,\dots,\theta_k)=\big(F(\theta_1,\dots,\theta_{k-1})\big)(\theta_k)$.'
            answer_contract: {"kind":"written"}
            answer: 'Both fields are the smallest subfield of E that holds F and theta_1 to theta_k. Each one holds the other by this minimality.'
            solution_sketch: 'Call the left field L and the right field R. The field R holds F and the first k elements. So R holds L, because L is the smallest such field. The field L holds the field of the first k-1 elements and the k-th element. So L holds R, because R is the smallest such field. Hence L = R.'
          # source: FoM exercise 6.3-6-17
          - problem: 'Prove directly: The set $\{a+b\sqrt[3]{2}+c(\sqrt[3]{2})^2 : a,b,c\in\mathbb{Q}\}$ is a subfield of $\mathbb{C}$. Do not use Theorem 6.20.'
            answer_contract: {"kind":"written"}
            answer: 'Closure under sums and products follows from t^3=2. For inverses, x^3-2 is irreducible, so Euclid algorithm gives s with s(t)d(t)=1.'
            solution_sketch: 'Let t be the real cube root of 2, so t^3=2. The set holds 0 and 1 and is closed under sums and negatives, as the proof avoids Theorem 6.20. A product has powers of t up to 4, and t^3=2 and t^4=2t reduce it to the same form. For a nonzero d(t), the polynomial x^3-2 is irreducible over Q, so d and x^3-2 share only constants. Euclid algorithm gives s d + u (x^3-2) = 1. At x=t this gives s(t)d(t)=1, and s(t) is in the set after the reduction.'
        constraints: 'Decide finiteness, count and use countability; the items vary the fields and the coefficient sets.'
      - id: kp3
        name: 'Definition 6.18 and Theorem 6.19: the index and the tower law'
        key_prerequisites: [fom-5-9-beyond-fields-vector-spaces]
        exemplars:
          - problem: 'Give the index of $E$ over $F$ when $E$ has the stated basis over $F$. (a) $E=\mathbb{C}$, $F=\mathbb{R}$, basis $\{1,i\}$. (b) $E=\mathbb{Q}(\sqrt[3]{2})$, $F=\mathbb{Q}$, basis $\{1,\sqrt[3]{2},\sqrt[3]{4}\}$. (c) A basis $\{1,\theta,\theta^2,\theta^3,\theta^4\}$ of $E$ over $F$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 2; b = 3; c = 5'
            solution_sketch: 'The index is the number of elements of a basis. The basis in (a) has 2 elements. The basis in (b) has 3 elements. The basis in (c) has 5 elements.'
          - problem: 'Let $F\subseteq D\subseteq E$ be fields with finite indices. Give (a) $[E:F]$ when $[E:D]=3$ and $[D:F]=4$, (b) $[E:D]$ when $[E:F]=20$ and $[D:F]=5$, (c) $[D:F]$ when $[E:F]=30$ and $[E:D]=6$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 12; b = 4; c = 5'
            solution_sketch: 'The index of $E$ over $F$ is the product $[E:D][D:F]$. In (a) the product is $3\cdot4=12$. In (b) we get $20/5=4$. In (c) we get $30/6=5$.'
          - problem: 'Let $F\subseteq D\subseteq E$ be fields. Let $\{e_1,\dots,e_m\}$ be a basis of $E$ over $D$ and $\{d_1,\dots,d_n\}$ a basis of $D$ over $F$. Give (a) the number of products $e_id_j$ when $m=4$ and $n=3$, (b) the number of products when $m=5$ and $n=5$, (c) the number of products when $m=2$ and $n=7$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 12; b = 25; c = 14'
            solution_sketch: 'The products $e_id_j$ form a basis of $E$ over $F$, with one product for each pair $(i,j)$. The count is $mn$. So the counts are $4\cdot3=12$, $5\cdot5=25$ and $2\cdot7=14$.'
          - problem: 'Let $F=\mathbb{Q}$, $D=\mathbb{Q}(\sqrt2)$ and $E=\mathbb{Q}(\sqrt2,\sqrt3)$, with $[D:F]=2$ and $[E:D]=2$. Use the basis $\{1,\sqrt2\}$ of $D$ over $F$ and the basis $\{1,\sqrt3\}$ of $E$ over $D$. Give (a) $[E:F]$, (b) the number $r$ with $\sqrt3\cdot\sqrt2=\sqrt r$, (c) the coefficient of $1$ in $(\sqrt2+\sqrt3)^2$ in the basis $\{1,\sqrt2,\sqrt3,\sqrt6\}$, (d) the coefficient of $\sqrt6$ in that expression.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}}]}
            answer: 'a = 4; b = 6; c = 5; d = 2'
            solution_sketch: 'The index is $2\cdot2=4$, so (a) is 4. The product of the two basis elements is $\sqrt6$, so (b) is 6. Expand: $(\sqrt2+\sqrt3)^2=2+2\sqrt6+3=5+2\sqrt6$. So (c) is 5 and (d) is 2.'
          - problem: 'Let $F\subseteq D\subseteq E$ be fields. (a) Find every distinct value that $[D:F]$ takes over the intermediate fields $D$ when $[E:F]=7$, and give the sum of these values. (b) Give 1 if some $D$ has $[D:F]=3$ when $[E:F]=10$, and 0 if none has. (c) Give 1 if some $D$ has $[E:D]=2$ when $[E:F]=9$, and 0 if none has.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 8; b = 0; c = 0'
            solution_sketch: 'The index $[D:F]$ divides $[E:F]$. For 7 the values are 1 and 7, and both occur ($D=F$ and $D=E$). The sum is 8. The number 3 does not divide 10, and 2 does not divide 9. So (b) and (c) are 0.'
          - problem: 'Let $F\subseteq D_1\subseteq D_2\subseteq E$ be fields with $[D_1:F]=2$, $[D_2:D_1]=3$ and $[E:D_2]=5$. Give (a) $[E:F]$, (b) $[E:D_1]$, (c) $[D_2:F]$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 30; b = 15; c = 6'
            solution_sketch: 'Multiply the indices of the steps. The product is $2\cdot3\cdot5=30$ for (a). Then $[E:D_1]=3\cdot5=15$ for (b). Also $[D_2:F]=2\cdot3=6$ for (c).'
          # argument: Theorem 6.19
          - problem: 'Prove the first step: Let $E$ be a finite extension of a field $F$ and let $D$ be a field with $F\subseteq D\subseteq E$. Then $D$ is a finite extension of $F$ and $E$ is a finite extension of $D$.'
            answer_contract: {"kind":"written"}
            answer: 'A basis of E over F has k elements, so no F-independent subset of D has more than k elements. A D-independent set in E is F-independent too.'
            solution_sketch: 'A basis of E over F has k elements. By Theorem 5.75 no F-independent subset of E has more than k elements. A largest F-independent subset of D is then a basis of D over F, so D is a finite extension of F. An independent set over D in E is also independent over F, because F is inside D. So it has at most k elements, and a largest one is a basis of E over D.'
          # argument: Theorem 6.19
          - problem: 'Prove the second step: Let $E$ be a finite extension of a field $F$ and let $D$ be a field with $F\subseteq D\subseteq E$. Then $[E:F]=[E:D][D:F]$.'
            answer_contract: {"kind":"written"}
            answer: 'Take bases e_i of E over D and d_j of D over F. The products e_i d_j form a basis of E over F, so the index is the product of the two indices.'
            solution_sketch: 'By the first step and Theorem 5.75, both indices are finite. Let m=[E:D] and n=[D:F], with bases e_1,...,e_m and d_1,...,d_n. If a sum of lambda_ij e_i d_j is 0 with lambda_ij in F, group it as a sum over i of (sum over j of lambda_ij d_j) e_i. Independence of the e_i gives each inner sum 0, and independence of the d_j gives each lambda_ij = 0. For x in E write x as a sum of mu_i e_i with mu_i in D, then write each mu_i with the d_j. So the mn products form a basis and [E:F]=mn.'
          # source: FoM exercise 6.3-6-31
          - problem: 'Prove: Let $F_0$ be a field. Let $F_j=F_{j-1}(w_j)$ with $w_j^2\in F_{j-1}$ for $j=1,\dots,k$. Then $[F_k:F_0]$ is a power of $2$.'
            answer_contract: {"kind":"written"}
            answer: 'Each step has index 1 or 2, because w_j is a zero of x^2 minus w_j^2 over the field before it. The tower law multiplies these indices.'
            solution_sketch: 'Fix a step and let a be the square of its new element, which lies in the earlier field. Then the new element is a zero of x^2-a. If it is in the earlier field, the index of the step is 1. If not, x^2-a has no zero there and is irreducible of degree 2. Then Theorem 6.20 gives the index 2. By Theorem 6.19 the total index is a product of numbers from {1,2}, a power of 2.'
          # source: FoM exercise 6.3-6-32
          - problem: 'Prove: The polynomial $f(x)=8x^3-6x-1$ is irreducible over $\mathbb{Q}$. Let $c$ be a zero of $f$ in an extension of $\mathbb{Q}$. Then $[\mathbb{Q}(c):\mathbb{Q}]=3$.'
            answer_contract: {"kind":"written"}
            answer: 'Theorem 6.20 gives the basis 1, c, c^2 of Q(c) over Q, since f is irreducible of degree 3. A basis with 3 elements means the index is 3.'
            solution_sketch: 'The polynomial f is irreducible over Q and has degree 3. By Theorem 6.20 the set {1,c,c^2} is a basis of Q(c) over Q. By Definition 6.18 the index is the number of elements of a basis. So [Q(c):Q]=3.'
        constraints: 'Multiply and divide indices in a tower of fields; the items vary the indices and the fields.'
      - id: kp4
        name: 'Theorem 6.20, Definition 6.21 and Lemma 6.22: the basis of F(theta) and the extension of an isomorphism'
        key_prerequisites: [fom-6-2-field-extensions-splitting-fields, field-extensions-degree]
        exemplars:
          - problem: 'In each case $p$ is irreducible over the field $F$ and $\theta$ is a zero of $p$ in an extension of $F$. Give $[F(\theta):F]$. (a) $F=\mathbb{Q}$, $p=x^2-3$. (b) $F=\mathbb{Q}$, $p=x^3-2$. (c) $F=\mathbb{Q}$, $p=x^4-2$. (d) $F=\mathbb{R}$, $p=x^2+1$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}}]}
            answer: 'a = 2; b = 3; c = 4; d = 2'
            solution_sketch: 'The set $\{1,\theta,\dots,\theta^{n-1}\}$ is a basis of $F(\theta)$ over $F$, where $n=\deg p$. So the index equals the degree of $p$. The degrees are 2, 3, 4 and 2.'
          - problem: 'Let $\theta$ be a zero of the irreducible polynomial $x^3-2$ over $\mathbb{Q}$. Then $\{1,\theta,\theta^2\}$ is a basis of $\mathbb{Q}(\theta)$ over $\mathbb{Q}$. Write $\theta^4+\theta^3+1$ as $a+b\theta+c\theta^2$ with rational $a,b,c$. Give (a) $a$, (b) $b$ and (c) $c$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 3; b = 2; c = 0'
            solution_sketch: 'From $\theta^3=2$ we get $\theta^4=2\theta$. So $\theta^4+\theta^3+1=2\theta+2+1=3+2\theta+0\theta^2$. Hence $a=3$, $b=2$ and $c=0$.'
          - problem: 'Let $\theta$ be a zero of the irreducible polynomial $x^2-2$ over $\mathbb{Q}$. Write each number as $a+b\theta$ with rational $a,b$. Give (a) $a$ and (b) $b$ for $(3+\theta)(2-\theta)$. Give (c) $b$ for $\theta^5$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 4; b = -1; c = 4'
            solution_sketch: 'Expand with $\theta^2=2$: $(3+\theta)(2-\theta)=6-3\theta+2\theta-2=4-\theta$. So (a) is 4 and (b) is -1. Also $\theta^4=4$, so $\theta^5=4\theta$ and (c) is 4.'
          - problem: 'In $\mathbb{Q}(\sqrt2)$ and in $\mathbb{Q}(\sqrt3)$ write the inverse of each number as $s+t\sqrt d$ with rational $s,t$. Give (a) $s$ and (b) $t$ for the inverse of $2+\sqrt3$ with $d=3$. Give (c) $s$ and (d) $t$ for the inverse of $3+2\sqrt2$ with $d=2$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}}]}
            answer: 'a = 2; b = -1; c = 3; d = -2'
            solution_sketch: 'Note that $(2+\sqrt3)(2-\sqrt3)=4-3=1$, so the inverse is $2-\sqrt3$. This gives (a) 2 and (b) -1. Also $(3+2\sqrt2)(3-2\sqrt2)=9-8=1$, so the inverse is $3-2\sqrt2$. This gives (c) 3 and (d) -2.'
          - problem: 'For each function, give 1 if it is a field isomorphism and 0 if it is not. (a) The map $x\mapsto x$ from $\mathbb{R}$ to $\mathbb{R}$. (b) The map $a+bi\mapsto a-bi$ from $\mathbb{C}$ to $\mathbb{C}$. (c) The map $x\mapsto 2x$ from $\mathbb{Q}$ to $\mathbb{Q}$. (d) The map $x\mapsto x^2$ from $\mathbb{R}$ to $\mathbb{R}$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 1; c = 0; d = 0'
            solution_sketch: 'The identity and the conjugation are bijective and keep sums and products, so (a) and (b) are 1. In (c), $2(ab)=2ab$ but $(2a)(2b)=4ab$, so the product is not kept and the value is 0. In (d), the map sends $-1$ and $1$ to the same value, so it is not bijective and the value is 0.'
          - problem: 'Let $\varphi^*:\mathbb{Q}(\sqrt2)\to\mathbb{Q}(\sqrt2)$ be the field isomorphism with $\varphi^*(z)=z$ for rational $z$ and $\varphi^*(\sqrt2)=-\sqrt2$. Then $\varphi^*(a+b\sqrt2)=a-b\sqrt2$. Write $\varphi^*(3+5\sqrt2)$ as $a+b\sqrt2$ and give (a) $a$ and (b) $b$. Write $\varphi^*((1+\sqrt2)^2)$ as $c+d\sqrt2$ and give (c) $c$ and (d) $d$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}}]}
            answer: 'a = 3; b = -5; c = 3; d = -2'
            solution_sketch: 'Change the sign of the $\sqrt2$ part. This gives $\varphi^*(3+5\sqrt2)=3-5\sqrt2$, so (a) is 3 and (b) is -5. Also $(1+\sqrt2)^2=3+2\sqrt2$, so its image is $3-2\sqrt2$. Hence (c) is 3 and (d) is -2.'
          - problem: 'Let $\varphi:\mathbb{Q}(\sqrt2)\to\mathbb{Q}(\sqrt2)$ be given by $\varphi(a+b\sqrt2)=a-b\sqrt2$. Let $p_1=x^2+(1+\sqrt2)x+(3-\sqrt2)$. Let $p_2$ be the polynomial with every coefficient of $p_1$ replaced by its image under $\varphi$. Write the coefficient of $x$ in $p_2$ as $a+b\sqrt2$ and the constant term of $p_2$ as $c+d\sqrt2$. Give (a) $a$, (b) $b$, (c) $c$ and (d) $d$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = -1; c = 3; d = 1'
            solution_sketch: 'The image of $1+\sqrt2$ is $1-\sqrt2$. This gives $a=1$ and $b=-1$. The image of $3-\sqrt2$ is $3+\sqrt2$. This gives $c=3$ and $d=1$.'
          # source: FoM exercise 6.3-6-28
          - problem: 'Let $S$ be the splitting field of $x^2-3$ over $\mathbb{Q}$. Give (a) $[S:\mathbb{Q}]$. Write $(1+\sqrt3)(2-\sqrt3)$ as $u+v\sqrt3$ with rational $u,v$. Give (b) $u$ and (c) $v$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 2; b = -1; c = 1'
            solution_sketch: 'The splitting field is $\mathbb{Q}(\sqrt3)$ and $x^2-3$ is irreducible, so the index is 2 and every element has the form $u+v\sqrt3$. Expand: $(1+\sqrt3)(2-\sqrt3)=2-\sqrt3+2\sqrt3-3=-1+\sqrt3$. So $u=-1$ and $v=1$.'
          # argument: Theorem 6.20
          - problem: 'Prove the first step: Let $F$ be a field, $p\in F\left[x\right]$ irreducible of degree $n$ and $\theta$ a zero of $p$ in an extension of $F$. Every element of $F(\theta)$ is an $F$-linear combination of $1,\theta,\dots,\theta^{n-1}$.'
            answer_contract: {"kind":"written"}
            answer: 'An element is m(theta) over d(theta) with m and d of degree below n. Euclid algorithm with p inverts d(theta), and a division by p reduces the degree.'
            solution_sketch: 'By Theorem 6.12 each z in F(theta) is m(theta) divided by d(theta), with m and d polynomials over F of degree below n and d(theta) not 0. Since p is irreducible and d has smaller degree, d and p share only constants. Euclid algorithm gives s, t with s d + t p = 1. At theta this gives s(theta)d(theta)=1, so z = m(theta)s(theta). Division of m s by p leaves a remainder r of degree below n with z = r(theta).'
          # argument: Theorem 6.20
          - problem: 'Prove the second step: Let $F$ be a field, $p\in F\left[x\right]$ irreducible of degree $n$ and $\theta$ a zero of $p$ in an extension of $F$. The set $\{1,\theta,\dots,\theta^{n-1}\}$ is linearly independent over $F$.'
            answer_contract: {"kind":"written"}
            answer: 'Take a nonzero polynomial q of least degree with q(theta)=0 and divide p by q. The remainder has theta as a zero and is smaller, so it is 0, and p is reducible.'
            solution_sketch: 'Suppose the set is dependent, so a nonzero polynomial of degree below n has theta as a zero. Pick such a polynomial q of least degree. Divide p by q: p = bq + c with deg c < deg q. Then c(theta) = p(theta) - b(theta)q(theta) = 0, so c = 0 by the minimality of q. Then q divides p with deg q < n, so p is reducible, a contradiction. The first step rests on Theorem 6.12.'
          # argument: Lemma 6.22
          - problem: 'Prove: Let $\varphi:F_1\to F_2$ be a field isomorphism and let $p_1\in F_1\left[x\right]$ be irreducible. Let $p_2$ be the polynomial over $F_2$ with the images under $\varphi$ as coefficients. Let $\theta_1$ be a zero of $p_1$ in an extension of $F_1$ and $\theta_2$ a zero of $p_2$ in an extension of $F_2$. Then there is a field isomorphism $\varphi^*:F_1(\theta_1)\to F_2(\theta_2)$ with $\varphi^*(\theta_1)=\theta_2$ and $\varphi^*(z)=\varphi(z)$ for all $z\in F_1$.'
            answer_contract: {"kind":"written"}
            answer: 'Send the sum of a_j theta_1^j to the sum of phi(a_j) theta_2^j. Both fields have bases of n elements and p_2 is irreducible, so this map is an isomorphism.'
            solution_sketch: 'Let n be the degree of p_1. The map on coefficients is a ring isomorphism of the polynomial rings, so p_2 is irreducible of degree n. By Theorem 6.20 the sets {1,theta_1,...,theta_1^(n-1)} and {1,theta_2,...,theta_2^(n-1)} are bases over F_1 and F_2. Define phi* by sending the sum of a_j theta_1^j to the sum of phi(a_j) theta_2^j. This map is bijective and keeps sums. It keeps products, because theta_1^n and theta_2^n reduce with p_1 and p_2, whose coefficients match under phi.'
          # source: FoM exercise 6.3-6-19
          - problem: 'Prove: Let $\varphi:F_1\to F_2$ be a field isomorphism. Define $\tilde\varphi:F_1\left[x\right]\to F_2\left[x\right]$ by applying $\varphi$ to every coefficient. (a) Prove that $\tilde\varphi$ is a ring isomorphism. (b) Prove that $p\in F_1\left[x\right]$ is reducible in $F_1\left[x\right]$ iff $\tilde\varphi(p)$ is reducible in $F_2\left[x\right]$.'
            answer_contract: {"kind":"written"}
            answer: 'Sums and products of polynomials use only sums and products of coefficients, which phi keeps. A factorization maps to a factorization, and back.'
            solution_sketch: 'The coefficient of x^k in a product is a sum of products of coefficients, and phi keeps sums and products. So the map keeps sums and products of polynomials. It is bijective, because the coefficientwise inverse of phi is its inverse. For part (b) apply the map to a factorization p = qr with q and r nonconstant. Degrees stay equal, so the image is a factorization into nonconstant factors. The inverse map gives the other direction.'
          # source: FoM exercise 6.3-6-20
          - problem: 'Prove: Let $\varphi:F_1\to F_2$ be a field isomorphism. Let $p_1\in F_1\left[x\right]$ be irreducible of degree $n$, and let $p_2$ be $p_1$ with $\varphi$ applied to every coefficient. Let $\theta_1$ be a zero of $p_1$ and $\theta_2$ a zero of $p_2$ in extensions of $F_1$ and $F_2$. Then the map $\varphi^*$ that sends $\sum a_j\theta_1^j$ to $\sum\varphi(a_j)\theta_2^j$ is a field isomorphism from $F_1(\theta_1)$ to $F_2(\theta_2)$.'
            answer_contract: {"kind":"written"}
            answer: 'The map matches two bases coefficient by coefficient, so it is bijective. Products reduce with p_1 and p_2, whose coefficients match under phi.'
            solution_sketch: 'Lemma 6.22 gives the setting, with bases of n elements on both sides. The map sends a coefficient list to the image list, so it is bijective. It keeps sums, because phi keeps sums. For a product, multiply and reduce powers of theta at least n with p_1 on one side and with p_2 on the other. The two reductions match, because the coefficients of p_2 are the images of those of p_1.'
          # source: FoM exercise 6.3-6-26
          - problem: 'Prove: Let $p\in F\left[x\right]$ be irreducible of degree $n$ and let $\theta$ be a zero of $p$ in an extension of $F$. Every $z\in F(\theta)$ is a zero of a nonzero polynomial in $F\left[x\right]$.'
            answer_contract: {"kind":"written"}
            answer: 'F(theta) has a basis of n elements, so the n+1 elements 1, z, ..., z^n are dependent over F. A dependence is a nonzero polynomial with zero z.'
            solution_sketch: 'By Theorem 6.20 the field F(theta) has a basis with n elements. By Theorem 5.75 an independent set in it has at most n elements. So the n+1 elements 1, z, ..., z^n are dependent over F. Then there are lambda_0,...,lambda_n in F, not all 0, with the sum of lambda_j z^j equal to 0. The polynomial with these coefficients is nonzero and has z as a zero.'
        constraints: 'Reduce powers of a zero of an irreducible polynomial, invert elements and apply an isomorphism to coefficients; the items vary the polynomials.'
      - id: kp5
        name: 'Lemma 6.23 and Theorem 6.24: splitting fields are unique up to isomorphism'
        key_prerequisites: [fom-6-2-field-extensions-splitting-fields, splitting-fields]
        exemplars:
          - problem: 'Give the index of the splitting field over $\mathbb{Q}$ of each polynomial. (a) $x^2-2$. (b) $x^2-9$. (c) $x^2+4$. (d) $x^3-2$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}}]}
            answer: 'a = 2; b = 1; c = 2; d = 6'
            solution_sketch: 'The field of $x^2-2$ is $\mathbb{Q}(\sqrt2)$ with index 2. The polynomial $x^2-9$ splits over $\mathbb{Q}$, so the index is 1. The field of $x^2+4$ is $\mathbb{Q}(i)$ with index 2. The field of $x^3-2$ is $\mathbb{Q}(\sqrt[3]{2},\omega)$ with index $3\cdot2=6$.'
          - problem: 'Splitting fields of one polynomial are isomorphic, so they have the same size. Give (a) the index over $\mathbb{Q}$ of any splitting field of $x^3-2$. Give the number of elements of any splitting field of (b) $x^2+x+1$ over $\mathbb{Z}_2$ and (c) $x^2+1$ over $\mathbb{Z}_3$. The two polynomials are irreducible.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 6; b = 4; c = 9'
            solution_sketch: 'The index in (a) is 6, as computed for $\mathbb{Q}(\sqrt[3]{2},\omega)$. In (b) and (c) the splitting field has index 2 over the field with 2 or 3 elements. So it has $2^2=4$ elements in (b) and $3^2=9$ elements in (c).'
          - problem: 'Let $S$ be a splitting field of a polynomial $p$ over $F$, with $[S:F]=n$. Let $\theta$ be a zero of an irreducible factor of $p$ of degree $d$ over $F$. Give $[S:F(\theta)]$ for (a) $n=12$, $d=3$, (b) $n=6$, $d=2$, (c) $n=24$, $d=4$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 4; b = 3; c = 6'
            solution_sketch: 'We have $[F(\theta):F]=d$. The tower law gives $[S:F(\theta)]=n/d$. The values are $12/3=4$, $6/2=3$ and $24/4=6$.'
          - problem: 'Let $S$ be the splitting field of $x^4-5x^2+6$ over $\mathbb{Q}$. Give (a) the number of zeros of the polynomial in $S$, (b) $[S:\mathbb{Q}]$, (c) the product of the zeros, (d) the sum of the squares of the zeros.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}}]}
            answer: 'a = 4; b = 4; c = 6; d = 10'
            solution_sketch: 'We have $x^4-5x^2+6=(x^2-2)(x^2-3)$. The zeros are $\pm\sqrt2$ and $\pm\sqrt3$, so (a) is 4. The field is $\mathbb{Q}(\sqrt2,\sqrt3)$ with index $2\cdot2=4$, so (b) is 4. The product is $(-2)(-3)=6$ and the sum of squares is $2+2+3+3=10$.'
          - problem: 'Let $\theta_1=\sqrt[3]{2}$ and let $\theta_2=\omega\sqrt[3]{2}$ with $\omega^3=1$ and $\omega\ne1$. Both are zeros of the irreducible polynomial $x^3-2$ over $\mathbb{Q}$. Let $\varphi^*:\mathbb{Q}(\theta_1)\to\mathbb{Q}(\theta_2)$ send $a+b\theta_1+c\theta_1^2$ to $a+b\theta_2+c\theta_2^2$ for rational $a,b,c$. Write each image as $a''+b''\theta_2+c''\theta_2^2$. Give (a) $\varphi^*(\theta_1^3)$ as a rational number, (b) $a''$ for $\varphi^*(\theta_1^4+3\theta_1^3)$, (c) $b''$ for $\varphi^*(\theta_1^4+3\theta_1^3)$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 2; b = 6; c = 2'
            solution_sketch: 'Both $\theta_1^3$ and $\theta_2^3$ equal 2, so (a) is 2. Next $\theta_1^4+3\theta_1^3=2\theta_1+6$. Its image is $2\theta_2+6$. So $a''=6$ and $b''=2$.'
          - problem: 'Count the field isomorphisms $\Phi:S\to S$ with $\Phi(z)=z$ for every rational $z$, where $S$ is the splitting field over $\mathbb{Q}$ of (a) $x-5$, (b) $x^2-2$, (c) $x^3-2$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 2; c = 6'
            solution_sketch: 'In (a) the field is $\mathbb{Q}$ and only the identity works, so the count is 1. In (b) the image of $\sqrt2$ is $\sqrt2$ or $-\sqrt2$, so the count is 2. In (c) the image of $\sqrt[3]{2}$ has 3 choices and the image of $\omega$ has 2 choices, so the count is 6.'
          # argument: Lemma 6.23
          - problem: 'Prove: Take a field isomorphism $\varphi:F_1\to F_2$ and a nonconstant $p_1\in F_1\left[x\right]$. Let $p_2$ be the polynomial over $F_2$ with the images under $\varphi$ as coefficients. Let $S_1$ and $S_2$ be splitting fields of $p_1$ over $F_1$ and of $p_2$ over $F_2$. Prove that a field isomorphism $\Phi:S_1\to S_2$ exists that agrees with $\varphi$ on $F_1$.'
            answer_contract: {"kind":"written"}
            answer: 'Use induction on the index of S_1 over F_1. Extend phi to a zero of an irreducible factor with Lemma 6.22, then use the induction hypothesis.'
            solution_sketch: 'Use induction on n=[S_1:F_1]. If n=1, then p_1 splits over F_1 as a product of x-a_j, and p_2 splits as a product of x-phi(a_j), so phi is the isomorphism. If n>1, take an irreducible factor q_1 of p_1 and its image q_2. Pick zeros theta_1 in S_1 and theta_2 in S_2. Lemma 6.22 extends phi to F_1(theta_1). The field S_1 is a splitting field of p_1 over F_1(theta_1), and Theorem 6.19 gives a smaller index, so the induction hypothesis applies.'
          # argument: Theorem 6.24
          - problem: 'Prove: Take a field $F$ and a polynomial $p\in F\left[x\right]$. Any two splitting fields of $p$ over $F$ are isomorphic.'
            answer_contract: {"kind":"written"}
            answer: 'Apply Lemma 6.23 with both fields equal to F and phi the identity map on F.'
            solution_sketch: 'Let S_1 and S_2 be two splitting fields of p over F. Take F_1=F_2=F and phi the identity map in Lemma 6.23. Then p_2=p_1=p. Lemma 6.23 gives an isomorphism from S_1 to S_2. Hence the two splitting fields are isomorphic.'
          # source: FoM exercise 6.3-6-22
          - problem: 'Prove: Take $f\in F\left[x\right]$ nonzero and a zero $\theta$ of $f$ in an extension of $F$. (a) Prove that some irreducible $q\in F\left[x\right]$ has $q(\theta)=0$. (b) Let $p$ be $q$ divided by its leading coefficient. Prove that no other monic irreducible polynomial has $\theta$ as a zero. (c) Prove that $p$ divides every $g\in F\left[x\right]$ with $g(\theta)=0$.'
            answer_contract: {"kind":"written"}
            answer: 'Induct on the degree for part (a). For parts (b) and (c) divide by p and use a remainder of smaller degree that still has theta as a zero.'
            solution_sketch: 'For (a) use induction on deg f. If f is irreducible, take q=f. Otherwise f=gh with smaller degrees, and theta is a zero of g or h. For (c) divide g by p to get g = bp + r with deg r < deg p. Then r(theta)=0, so r=0 by the minimality of the degree of p. For (b) apply (c) to a second such polynomial p2: p divides p2, and both are irreducible with leading coefficient 1, so p2=p.'
          # source: FoM exercise 6.3-6-29
          - problem: 'Prove: Take a zero $\theta$ of a nonzero polynomial over $F$. Let $q$ be a nonzero polynomial with $q(\theta)=0$ and the least degree among such polynomials. If $\tilde q\in F\left[x\right]$ has $\tilde q(\theta)=0$, then $\tilde q=fq$ for some $f\in F\left[x\right]$.'
            answer_contract: {"kind":"written"}
            answer: 'Divide the other polynomial by q. The remainder has theta as a zero and a smaller degree than q, so it is 0.'
            solution_sketch: 'Divide q~ by q to get q~ = fq + r with r = 0 or deg r < deg q. Then r(theta) = q~(theta) - f(theta)q(theta) = 0. A nonzero r has theta as a zero and a degree below deg q. This contradicts the choice of q. So r = 0 and q~ = fq.'
          # source: FoM exercise 6.3-6-30
          - problem: 'Prove: Take a field $F$ of characteristic $0$ and an extension $E$ with $[E:F]=n$. Then $E=F(\theta)$ for some $\theta\in E$ that is a zero of a nonzero polynomial in $F\left[x\right]$.'
            answer_contract: {"kind":"written"}
            answer: 'Take a basis of E. Each basis element is a zero of a polynomial over F, so Theorem 6.25 gives one theta that generates E.'
            solution_sketch: 'The field E has a basis of n elements over F. For each basis element a, the n+1 powers 1, a, ..., a^n are dependent, so each basis element is a zero of a nonzero polynomial over F. Theorem 6.25 gives theta in E that generates the same field as all basis elements. Every element of E is an F-combination of the basis elements, so that field is E. Hence E=F(theta). Theta is a zero of a polynomial over F by the last part of Theorem 6.25.'
        constraints: 'Find indices and sizes of splitting fields and count isomorphisms; the items vary the polynomials.'
      - id: kp6
        name: 'Theorem 6.25 and Definition 6.26: one generator for a finite extension and root towers'
        key_prerequisites: [fom-6-2-field-extensions-splitting-fields, field-extensions-degree]
        exemplars:
          - problem: 'The polynomial $x^2-2x-4$ has two zeros of the form $1\pm w$. (a) Give the positive integer $m$ with $w^2=m$ and $w>0$. Give (b) the sum of the two zeros and (c) the product of the two zeros.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 5; b = 2; c = -4'
            solution_sketch: 'By the quadratic formula the zeros are $(2\pm\sqrt{20})/2=1\pm\sqrt5$. So $m=5$. The sum is $2$ and the product is $1-5=-4$.'
          - problem: 'Let $\alpha_1=2\sqrt2$, $\alpha_2=-2\sqrt2$, $\beta_1=\sqrt2$ and $\beta_2=-\sqrt2$. Compute (a) $(\alpha_1-\alpha_2)/(\beta_1-\beta_2)$ and (b) $(\alpha_1-\alpha_2)/(\beta_2-\beta_1)$. Now let $\alpha_1=3\sqrt2$ and $\alpha_2=-3\sqrt2$. Compute (c) $(\alpha_1-\alpha_2)/(\beta_1-\beta_2)$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 2; b = -2; c = 3'
            solution_sketch: 'For (a): $4\sqrt2/(2\sqrt2)=2$. For (b) the denominator changes sign, so the value is -2. For (c): $6\sqrt2/(2\sqrt2)=3$.'
          - problem: 'Let $\theta=\sqrt2+\sqrt3$. There are integers $b,c$ with $\theta^4+b\theta^2+c=0$. Give (a) $b$ and (b) $c$. Give (c) $[\mathbb{Q}(\theta):\mathbb{Q}]$, where $\mathbb{Q}(\theta)=\mathbb{Q}(\sqrt2,\sqrt3)$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = -10; b = 1; c = 4'
            solution_sketch: 'Compute $\theta^2=5+2\sqrt6$. Then $(\theta^2-5)^2=24$, so $\theta^4-10\theta^2+1=0$. Hence $b=-10$ and $c=1$. The field $\mathbb{Q}(\sqrt2,\sqrt3)$ has index $2\cdot2=4$.'
          - problem: 'Let $\theta=\sqrt2+2\sqrt3$. Write $\theta^2$ as $r+s\sqrt6$ with integer $r,s$ and give (a) $r$ and (b) $s$. There are integers $b,c$ with $\theta^4+b\theta^2+c=0$. Give (c) $b$ and (d) $c$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}}]}
            answer: 'a = 14; b = 4; c = -28; d = 100'
            solution_sketch: 'Expand: $\theta^2=2+4\sqrt6+12=14+4\sqrt6$. So $r=14$ and $s=4$. Then $(\theta^2-14)^2=96$, so $\theta^4-28\theta^2+100=0$. Hence $b=-28$ and $c=100$.'
          - problem: 'Let $F_1=\mathbb{Q}$ and $F_j=F_{j-1}(w_j)$ for $j=2,3,4$ with $w_2=\sqrt2$, $w_3=\sqrt3$ and $w_4=\sqrt5$. Each step has index 2. Give (a) $[F_4:F_1]$, (b) $[F_3:F_1]$, (c) $[F_4:F_2]$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 8; b = 4; c = 4'
            solution_sketch: 'The tower law multiplies the indices of the steps. For (a) the product is $2\cdot2\cdot2=8$. For (b) it is $2\cdot2=4$. For (c) it is $2\cdot2=4$.'
          - problem: 'Let $F_1=\mathbb{Q}$ and $F_2=F_1(w_2)$ with $w_2^3=2$ and $w_2$ real. Let $F_3=F_2(w_3)$ with $w_3^2=-3$. Then $x^3-2$ has all its zeros in $F_3$. Give (a) $[F_2:F_1]$, (b) $[F_3:F_2]$, (c) $[F_3:F_1]$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 3; b = 2; c = 6'
            solution_sketch: 'The polynomial $x^3-2$ is irreducible of degree 3, so (a) is 3. The number $w_3$ is not real, so it is not in $F_2$, and it is a zero of $x^2+3$. So (b) is 2. By the tower law (c) is $3\cdot2=6$.'
          # argument: Theorem 6.25
          - problem: 'Prove the first step: Take $F$ of characteristic $0$. Let $\alpha=\alpha_1,\dots,\alpha_n$ be the distinct zeros of an irreducible monic polynomial over $F$ and let $\beta=\beta_1,\dots,\beta_{n''}$ be the distinct zeros of another one. Then some $a\in F\setminus\{0\}$ has $a(\beta_j-\beta)\ne\alpha-\alpha_i$ for all $i>1$ and $j>1$.'
            answer_contract: {"kind":"written"}
            answer: 'Each pair (i, j) rules out at most one value of a. A field of characteristic 0 has infinitely many nonzero elements, so some a stays.'
            solution_sketch: 'For each pair with i>1 and j>1, the equation a(beta_j - beta) = alpha - alpha_i has at most one solution a, because beta_j - beta is not 0. So only finitely many values of a are ruled out. The field F has characteristic 0, so it holds the infinite set of integer multiples of 1. Hence some nonzero a in F is not ruled out.'
          # argument: Theorem 6.25
          - problem: 'Prove the second step: In the setting of the first step, let $\theta=\alpha+a\beta$. Then $\beta\in F(\theta)$ and $F(\alpha,\beta)=F(\theta)$.'
            answer_contract: {"kind":"written"}
            answer: 'Let h(x) be p_alpha(theta - a x). It shares only the zero beta with p_beta, so their gcd over F(theta) is x minus beta, which puts beta in F(theta).'
            solution_sketch: 'Clearly F(theta) is inside F(alpha,beta). Let h(x)=p_alpha(theta-ax), a polynomial over F(theta). Then h(beta)=p_alpha(alpha)=0, so h and p_beta share the zero beta. By the choice of a, no other zero beta_j of p_beta is a zero of h. The zeros of p_beta have multiplicity 1, so the monic gcd g of h and p_beta over F(theta) is x - beta. Euclid algorithm writes g as a combination of h and p_beta with coefficients in F(theta), so beta is in F(theta), and alpha = theta - a beta is in F(theta).'
          # source: FoM exercise 6.3-6-23
          - problem: 'Prove: Take a field $F$ of characteristic $0$ and a monic irreducible $p\in F\left[x\right]$. All zeros of $p$ are distinct.'
            answer_contract: {"kind":"written"}
            answer: 'A repeated zero of p is also a zero of the formal derivative p'', which is nonzero of lower degree. Then p divides p'', which is impossible.'
            solution_sketch: 'Suppose theta is a repeated zero, so p = (x - theta)^2 g in an extension. The product rule gives p''(theta) = 0. Since the characteristic is 0, p'' is nonzero of degree n-1. By Exercise 6-22c, p divides every polynomial over F with theta as a zero, so p divides p''. This is impossible, because p'' is nonzero with smaller degree than p.'
          # source: FoM exercise 6.3-6-24
          - problem: 'Prove: Let $p$ be a prime, let $R$ be the field of rational functions in a variable $a$ with coefficients in $\mathbb{Z}_p$, and let $K$ be the subset of rational functions in $a^p$. (a) Prove that $K$ is a subfield of $R$. (b) Prove that $x^p-a^p=(x-a)^p$ in every field of characteristic $p$. (c) Prove that $x^p-a^p$ is irreducible in $K\left[x\right]$.'
            answer_contract: {"kind":"written"}
            answer: 'Part b uses (u+v)^p = u^p + v^p in characteristic p. For part c, a factor (x-a)^k has x-coefficient -ka, which puts a in K unless p divides k.'
            solution_sketch: 'For (a) sums, products and quotients of rational functions in a^p are again rational functions in a^p. For (b) the binomial coefficients C(p,k) with 0<k<p are multiples of p, so (x-a)^p = x^p - a^p in characteristic p. For (c) a monic factor of x^p - a^p over K is (x-a)^k with 0<k<p, by unique factorization of polynomials over R. Its coefficient of x^(k-1) is -ka, which lies in K. Since k is not 0 in Z_p, a lies in K, which is false. So there is no proper factor.'
          # source: FoM exercise 6.3-6-25
          - problem: 'Prove: Let $F$ be a field. For $f=\sum_{j=0}^n a_jx^j$ define $f''=\sum_{j=1}^n ja_jx^{j-1}$. (a) Prove that $(\alpha f+\beta g)''=\alpha f''+\beta g''$ for $\alpha,\beta\in F$. (b) Prove that $(fg)''=f''g+g''f$. (c) Prove that $f$ has a repeated zero in some extension iff $f$ and $f''$ have a nonconstant common divisor in $F\left[x\right]$. (d) Prove that an irreducible $f$ has a repeated zero iff $f''=0$. (e) In characteristic $0$, prove that an irreducible $f$ has no repeated zero. (f) In characteristic $p>0$, prove that every power of $x$ in an irreducible $f$ has an exponent that is a multiple of $p$.'
            answer_contract: {"kind":"written"}
            answer: 'Check (a) and (b) on powers of x, then use them. A repeated zero is a common zero of f and f'', so gcds and irreducibility give (d) to (f).'
            solution_sketch: 'Parts (a) and (b) follow from the rules on monomials x^j and x^k. For (c), a repeated zero c gives f=(x-c)^2 h, so f''(c)=0 by (b), and the gcd of f and f'' is nonconstant. In the other direction a nonconstant gcd g has a zero c, which is a zero of f and f'', and (b) shows that c is repeated. For (d), by Exercise 6-22c an irreducible f divides f'' if they share a zero, and the degree forces f''=0. Parts (e) and (f) follow, because j a_j = 0 forces p to divide j when a_j is not 0.'
          # source: FoM exercise 6.3-6-33
          - problem: 'Prove: No construction with straightedge and compass trisects every angle. (a) Prove that equilateral triangles are constructible. (b) Prove that $60^\circ$ angles are constructible. (c) Prove that a trisection construction gives the length $\cos(20^\circ)$ constructible. (d) Prove that $\cos(3\alpha)=4\cos^3(\alpha)-3\cos(\alpha)$. (e) Prove that $\cos(20^\circ)$ is a zero of $8x^3-6x-1$. (f) Use two facts to prove that $\cos(20^\circ)$ is not constructible. Fact one: if a length is constructible, its field index over $\mathbb{Q}$ is a power of 2. Fact two: $8x^3-6x-1$ is irreducible over $\mathbb{Q}$, so a zero of it has index 3.'
            answer_contract: {"kind":"written"}
            answer: 'Build the 60 degree angle, and trisecting it gives cos 20 degrees, a zero of 8x^3-6x-1 of index 3. Constructible lengths have index a power of 2.'
            solution_sketch: 'Parts (a) and (b) follow from two circles of the same radius through each other centers. For (c), a trisected 60 degree angle is a 20 degree angle, and its cosine is a length in a right triangle. For (d) expand cos(2a+a) with the addition rules. For (e) put alpha = 20 degrees and use cos 60 degrees = 1/2. Each constructed length lies in a tower of steps with w_j^2 in the earlier field, so Exercise 6-31 gives a power of 2 as index, and Exercise 6-32 gives index 3 for cos 20 degrees.'
        constraints: 'Find a generator, its polynomial and the indices of a root tower; the items vary the radicals.'
    diagnostic_exemplar:
      problem: 'Let $F\subseteq D\subseteq E$ be fields with $[E:D]=3$ and $[D:F]=5$. Give $[E:F]$.'
      answer_contract: {"kind":"exact"}
      answer: '15'
      solution_sketch: 'The tower law gives the product of the two indices. The product is 3 times 5, which is 15.'
