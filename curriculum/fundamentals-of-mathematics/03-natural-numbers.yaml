            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 32; b = 81; c = -8'
            solution_sketch: 'Multiply the factors. We get $2^5=32$ and $3^4=81$. For (c) we get $(-2)(-2)(-2)=-8$.'
          - problem: '(a) Give $2^3\cdot 2^4$. (b) Give the exponent $e$ with $2^3\cdot 2^4=2^e$. (c) Give $(2^3)^2$.'
