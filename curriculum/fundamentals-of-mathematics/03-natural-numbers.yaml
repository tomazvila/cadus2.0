          # argument: Theorem 3.109
          - problem: 'Prove: let $p$ and $q$ be different primes, $n=pq$, and let $e,d$ be natural numbers with $de\equiv 1 \pmod{(p-1)(q-1)}$. If $c$ is the remainder of $m^e$ divided by $n$, then $c^d\equiv m \pmod n$.'
            answer_contract: {"kind":"written"}
            answer: 'Write ed = 1 + x(p-1). Use Fermat''s Little Theorem modulo p, or note that both sides are 0 if p divides m; do the same modulo q.'
            solution_sketch: 'Modulo $n$, $c^d\equiv m^{ed}$. Since $de\equiv 1$ modulo $(p-1)(q-1)$, $ed=1+x(p-1)=1+y(q-1)$. If $p$ does not divide $m$, then Theorem 3.108 gives $m^{p-1}\equiv 1$, so $m^{ed}=(m^{p-1})^xm\equiv m$ modulo $p$. If $p$ divides $m$, both $m^{ed}$ and $m$ are 0 modulo $p$. The same argument works modulo $q$. Exercise 3-107b then gives $c^d\equiv m$ modulo $n$.'
          # source: FoM exercise 3.9-3-107
          - problem: 'Let $k,n\in\mathbb{N}$ and $a,b\in\mathbb{N}_0$. (a) Prove that if $a\equiv b \pmod{kn}$, then $a\equiv b$ modulo $k$ and modulo $n$. (b) Prove that if $k$ and $n$ have no common factor, then $a\equiv b$ modulo $k$ and modulo $n$ together give $a\equiv b \pmod{kn}$.'
            answer_contract: {"kind":"written"}
            answer: '(a) If kn divides a - b, then k and n divide it. (b) If k divides a - b and n divides the multiple, n divides the cofactor because k and n are coprime.'
            solution_sketch: 'Assume $a>b$, or swap the names. For (a), $a-b=jkn=(jn)k=(jk)n$, so $k$ and $n$ both divide $a-b$. For (b), $a-b=ik$ for some $i$. Then $n$ divides $ik$, and $k$ and $n$ have no common factor, so Exercise 3-59a gives that $n$ divides $i$. So $kn$ divides $a-b$.'
