    knowledge_points:
      - id: kp1
        name: 'Theorem 3.16 to Proposition 3.19: trichotomy and cancellation of sums'
        key_prerequisites: [fom-2-6-axiom-infinity-natural-numbers]
        exemplars:
          - problem: 'In this item, $\mathbb{N}$ starts at 1. Take $n=4$ and $m=9$. (a) Give the number $d$ in $\mathbb{N}$ with $n+d=m$. (b) Count the numbers $d$ in $\mathbb{N}$ with $m+d=n$. (c) Count the numbers $d$ in $\mathbb{N}$ with $n+d=n$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 5; b = 0; c = 0'
            solution_sketch: 'For (a), $4+5=9$, so the number is 5. For (b), $9+d$ is at least 10, so it never equals 4, and the count is 0. For (c), $4+d$ is larger than 4 for every $d$, so the count is 0.'
          - problem: 'In this item, $\mathbb{N}$ starts at 1. For each part, give 1 if a number $d$ in $\mathbb{N}$ with the stated equation exists and 0 if no such number exists. (a) $6+d=6$. (b) $6+d=10$. (c) $10+d=6$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 0; b = 1; c = 0'
            solution_sketch: 'In (a), $6+d$ is larger than 6, so no $d$ exists and the value is 0. In (b), $d=4$ works, so the value is 1. In (c), $10+d$ is larger than 10, so it never equals 6 and the value is 0.'
          - problem: 'In this item, $\mathbb{N}$ starts at 1. Look at these three conditions on $n$ and $m$. Condition 1 is $n=m$. Condition 2 is $n+d=m$ for some $d$ in $\mathbb{N}$. Condition 3 is $m+d=n$ for some $d$ in $\mathbb{N}$. (a) For $n=m=7$, count the conditions that hold. (b) For $n=15$ and $m=6$, count the conditions that hold. (c) For $n=15$ and $m=6$, give the number $d$ in $\mathbb{N}$ with $m+d=n$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 1; c = 9'
            solution_sketch: 'Exactly one condition holds for every pair, so the count in (a) and in (b) is 1. In (a), condition 1 holds. In (b), $6+9=15$, so condition 3 holds with $d=9$.'
          - problem: 'In this item, $\mathbb{N}$ starts at 1. Cancel the common term. (a) Give $a$ when $7+a=7+12$. (b) Give $a$ when $a+9=15+9$. (c) Give $x$ when $(3+x)+2=11$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 12; b = 15; c = 6'
            solution_sketch: 'In (a), cancel the left term 7 to get $a=12$. In (b), cancel the right term 9 to get $a=15$. In (c), cancel 2 to get $3+x=9$, and then cancel 3 to get $x=6$.'
          - problem: 'In this item, $\mathbb{N}$ starts at 1. Take the numbers 1, 2, 3 and 4. Count the ordered pairs $(n,m)$ of these numbers for each case. (a) The pairs with $n=m$. (b) The pairs with $n+d=m$ for some $d$ in $\mathbb{N}$. (c) The pairs with $m+d=n$ for some $d$ in $\mathbb{N}$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 4; b = 6; c = 6'
            solution_sketch: 'The 16 pairs split in three classes. The four pairs with $n=m$ give the count 4. The pairs with $n$ smaller than $m$ number 6, and so do the pairs with $m$ smaller than $n$. The three counts 4, 6 and 6 add to 16.'
          - problem: 'In this item, $\mathbb{N}$ starts at 1. Take $d=3$ and $n=5$. (a) Compute $n+d$. (b) Compute $(n+1)+d$. (c) Compute $(n+d)+1$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 8; b = 9; c = 9'
            solution_sketch: 'The sum $n+d$ is $5+3=8$. Next, $(5+1)+3=6+3=9$. Last, $(n+d)+1=8+1=9$. The last two values agree, because $(n+1)+d=(n+d)+1$.'
          - problem: 'In this item, $\mathbb{N}$ starts at 1. Give each truth value as 1 for true and 0 for false. (a) For all $a,b,c$ in $\mathbb{N}$: if $c+a=c+b$, then $a=b$. (b) For all $a,b,c$ in $\mathbb{N}$: if $a+c=b$, then $a=b$. (c) For all $a,b,c$ in $\mathbb{N}$: if $a+b=c+b$, then $a=c$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 0; c = 1'
            solution_sketch: 'Statement (a) is the cancellation rule, so its value is 1. In (b), take $a=1$, $c=1$ and $b=2$. Then $a+c=b$ but $a\ne b$, so the value is 0. Statement (c) follows from (a) and commutativity, so its value is 1.'
          # argument: Theorem 3.16
          - problem: 'Prove the first step of the trichotomy condition: for all $n,d$ in $\mathbb{N}$, $n+d\ne n$.'
            answer_contract: {"kind":"written"}
            answer: 'Fix d and use induction on n. The base case holds because 1 is not a successor, and the step uses cancellation of successors.'
            solution_sketch: 'Fix $d$ and let $S$ be the set of all $n$ with $n+d\ne n$. The number 1 is in $S$, because $1+d=d+1$ is a successor and 1 is not a successor. Let $n$ be in $S$ and assume $(n+1)+d=n+1$. Then $(n+d)+1=n+1$, so $n+d=n$ by the cancellation of successors in Theorem 2.64. This contradicts $n$ in $S$, so $n+1$ is in $S$ and induction gives $S=\mathbb{N}$.'
          # argument: Theorem 3.16
          - problem: 'Prove the second step of the trichotomy condition: for $n,m$ in $\mathbb{N}$, no two of these three conditions hold together. Condition 1 is $n=m$. Condition 2 is $n+d=m$ for some $d$ in $\mathbb{N}$. Condition 3 is $m+d=n$ for some $d$ in $\mathbb{N}$.'
            answer_contract: {"kind":"written"}
            answer: 'Use the first step. Conditions 1 and 2 give n + d = n, and conditions 2 and 3 together give m = m + (d + e).'
            solution_sketch: 'Use the first step, which comes from the proof of Theorem 3.16 and rests on Theorem 2.64. If conditions 1 and 2 hold, then $n+d=n$, which the first step forbids. If conditions 1 and 3 hold, then $m+d=m$, which the first step forbids. If conditions 2 and 3 hold, then $n+d=m$ and $m+e=n$. Then $m=n+d=(m+e)+d=m+(e+d)$, which the first step forbids.'
          # argument: Theorem 3.16
          - problem: 'Prove the third step of the trichotomy condition: for all $n,m$ in $\mathbb{N}$, at least one of these holds. Either $n=m$, or $n+d=m$ for some $d$ in $\mathbb{N}$, or $m+d=n$ for some $d$ in $\mathbb{N}$.'
            answer_contract: {"kind":"written"}
            answer: 'Use induction on n and, inside it, induction on m. Every number is 1 or a successor, and that settles the base cases.'
            solution_sketch: 'Let $S$ be the set of all $n$ for which every $m$ satisfies one of the three conditions. Show first that 1 is in $S$, because each $m$ is 1 or a successor $d+1=1+d$ by Theorem 2.64. For the step, assume $n$ is in $S$ and run a second induction on $m$ for the number $n+1$. The case $m=1$ follows from the base case. For the step from $m$ to $m+1$, split in three cases for $m$ and use the cancellation of successors from Theorem 2.64 to write $d$ as 1 or as a successor.'
          # argument: Proposition 3.17
          - problem: 'Prove: if $a,b,c$ are in $\mathbb{N}$ and $c+a=c+b$, then $a=b$.'
            answer_contract: {"kind":"written"}
            answer: 'Assume a differs from b. Trichotomy gives a + d = b or b + d = a, and then c + b = (c + b) + d, and Theorem 3.16 forbids that.'
            solution_sketch: 'Assume $a\ne b$. Then Theorem 3.16 gives a number $d$ with $a+d=b$ or with $b+d=a$. Assume $a+d=b$ without loss of generality. Then $c+b=c+(a+d)=(c+a)+d=(c+b)+d$. Put $n=c+b$. Then $n+d=n$, which contradicts Theorem 3.16.'
          # argument: Proposition 3.19
          - problem: 'Prove: if $a,b,c$ are in $\mathbb{N}$ and $a+c=b+c$, then $a=b$.'
            answer_contract: {"kind":"written"}
            answer: 'Commutativity turns a + c = b + c into c + a = c + b. Then Proposition 3.17 gives a = b.'
            solution_sketch: 'Start with $a+c=b+c$. Commutativity of addition gives $c+a=a+c$ and $b+c=c+b$. Hence $c+a=c+b$. Proposition 3.17 now gives $a=b$.'
          # source: FoM exercise 3.2-3-9
          - problem: 'Prove: if $a,b,c$ are in $\mathbb{N}$ with $c+a=c+b$, then $b+d=a$ is impossible for every $d$ in $\mathbb{N}$.'
            answer_contract: {"kind":"written"}
            answer: 'Substitute a = b + d. Then c + a = (c + a) + d, and Theorem 3.16 forbids that.'
            solution_sketch: 'Assume $b+d=a$ for some $d$ in $\mathbb{N}$. Then $c+a=c+(b+d)=(c+b)+d$. Since $c+b=c+a$, this reads $c+a=(c+a)+d$. Put $n=c+a$. Then $n=n+d$, which contradicts Theorem 3.16. This is the second case in the proof of Proposition 3.17.'
          # source: FoM exercise 3.2-3-10
          - problem: 'Prove two cancellation rules for $a,b,c$ in $\mathbb{N}$. (a) If $ca=cb$, then $a=b$. Use induction on $a$. (b) If $ac=bc$, then $a=b$.'
            answer_contract: {"kind":"written"}
            answer: 'For part a, use induction on a and cancel a sum with Proposition 3.19. Part b follows from part a and commutativity of the product.'
            solution_sketch: 'For part (a), induct on $a$. If $a=1$ and $b$ is a successor $e+1$, then $c=ce+c$, which contradicts Theorem 3.16. If $a+1$ replaces $a$ and $b=1$, the same contradiction appears. Otherwise write $b=e+1$ and get $ca+c=ce+c$. Proposition 3.19 gives $ca=ce$, the hypothesis gives $a=e$, and so $a+1=b$. Part (b) follows from part (a), because $ac=ca$ and $bc=cb$.'
        constraints: 'trichotomy of $n+d=m$; cancellation of a common term in a sum; decidable items use natural numbers from 1'
      - id: kp2
        name: 'Definition 3.20: the order less than and less than or equal on the natural numbers'
        key_prerequisites: []
        exemplars:
          - problem: 'In this item, $\mathbb{N}$ starts at 1. Give each truth value as 1 for true and 0 for false. Use the order of Definition 3.20. (a) $3<8$. (b) $8<3$. (c) $5<5$. (d) $5\le 5$.'
