      - id: kp1
        name: 'Proposition 3.107: a number with no common factor with m has an inverse modulo m'
        key_prerequisites: [fom-3-4-induction]
        exemplars:
          - problem: 'Find the number $y\in\{1,\dots,m-1\}$ with $xy\equiv 1 \pmod m$. (a) $x=3$, $m=7$. (b) $x=5$, $m=12$. (c) $x=7$, $m=15$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 5; b = 5; c = 13'
            solution_sketch: 'Test the values of y. In (a), $3\cdot 5=15\equiv 1$ modulo 7. In (b), $5\cdot 5=25\equiv 1$ modulo 12. In (c), $7\cdot 13=91\equiv 1$ modulo 15.'
          - problem: 'Give 1 if the two numbers have no common factor above $1$ and 0 if they have one. (a) $8$ and $15$. (b) $9$ and $15$. (c) $14$ and $45$. (d) $21$ and $35$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 0; c = 1; d = 0'
            solution_sketch: 'Look for a shared prime factor. The numbers 8 and 15 share none, so (a) is 1. The numbers 9 and 15 share 3, so (b) is 0. The numbers 14 and 45 share none, so (c) is 1. The numbers 21 and 35 share 7, so (d) is 0.'
          - problem: 'Count the numbers $x\in\{1,\dots,m-1\}$ that have no common factor above $1$ with $m$. (a) $m=10$. (b) $m=11$. (c) $m=12$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 4; b = 10; c = 4'
            solution_sketch: 'For m = 10 the numbers are 1, 3, 7 and 9, which gives 4. For m = 11, a prime, all numbers work, which gives 10. For m = 12 the numbers are 1, 5, 7 and 11, which gives 4.'
          - problem: 'Find the number $y\in\{1,\dots,8\}$ with $xy\equiv 1 \pmod 9$. (a) $x=2$. (b) $x=4$. (c) $x=8$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 5; b = 7; c = 8'
            solution_sketch: 'In (a), $2\cdot 5=10\equiv 1$ modulo 9. In (b), $4\cdot 7=28\equiv 1$ modulo 9. In (c), $8\cdot 8=64\equiv 1$ modulo 9.'
          - problem: 'Count the numbers $c\in\{1,\dots,m-1\}$ with $cx\equiv 0 \pmod m$. (a) $x=4$, $m=12$. (b) $x=5$, $m=12$. (c) $x=9$, $m=15$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 3; b = 0; c = 2'
            solution_sketch: 'In (a), 12 divides $4c$ exactly when 3 divides $c$, so the values are 3, 6 and 9, which gives 3. In (b), 5 and 12 have no common factor, so no value works and the count is 0. In (c), 15 divides $9c$ exactly when 5 divides $c$, so the values are 5 and 10, which gives 2.'
          - problem: 'Give the smallest number $c\ge 1$ with $cx\equiv 0 \pmod m$. (a) $x=6$, $m=15$. (b) $x=10$, $m=25$. (c) $x=14$, $m=21$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 5; b = 5; c = 3'
            solution_sketch: 'Divide m by the common factor of x and m. In (a), the common factor is 3, and $15/3=5$. In (b), the common factor is 5, and $25/5=5$. In (c), the common factor is 7, and $21/7=3$.'
          - problem: 'Find the number $y\ge 1$ below the modulus with $xy\equiv 1$. (a) $x=7$ modulo $40$. (b) $x=11$ modulo $26$. (c) $x=13$ modulo $35$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 23; b = 19; c = 27'
            solution_sketch: 'Test the values of y. In (a), $7\cdot 23=161$, which is 1 modulo 40. In (b), $11\cdot 19=209$, which is 1 modulo 26. In (c), $13\cdot 27=351$, which is 1 modulo 35.'
          # argument: Proposition 3.107
          - problem: 'Prove: let $x,m\in\mathbb{N}$ have no common factor. If $m$ does not divide $c$, then $cx\not\equiv 0 \pmod m$. Moreover, some $y\in\mathbb{N}$ has $xy\equiv 1 \pmod m$.'
            answer_contract: {"kind":"written"}
            answer: 'Since x and m have no common factor, m divides bx only if m divides b. So x, 2x, up to (m-1)x are distinct nonzero classes, and one of them is 1.'
            solution_sketch: 'Use Exercise 3-59a: if $x$ and $m$ have no common factor and $m$ divides $bx$, then $m$ divides $b$. By contraposition, if $m$ does not divide $c$, then $cx\not\equiv 0$. For the second part, the numbers $x,2x,\dots,(m-1)x$ lie in $m-1$ different classes, and none of them is $[0]$. By Theorem 3.54, these classes are all $m-1$ classes other than $[0]$. So one of them is $[1]$, which gives $y$ with $xy\equiv 1$.'
          # source: FoM exercise 3.9-3-100
          - problem: 'Let $x,m\in\mathbb{N}$ have a common factor $k>1$. Prove that some $c\in\mathbb{N}$ that $m$ does not divide has $cx\equiv 0 \pmod m$.'
            answer_contract: {"kind":"written"}
            answer: 'Take c = m/k. Then c is smaller than m, so m does not divide it, and cx = (m/k)x = m(x/k) is a multiple of m.'
            solution_sketch: 'This is the converse of Proposition 3.107. Write $m=km''$ and $x=kx''$. Take $c=m''$. Then $0<c<m$, so $m$ does not divide $c$. Also $cx=m''kx''=mx''$, so $cx\equiv 0$ modulo $m$.'
          # source: FoM exercise 3.9-3-108
          - problem: 'Let $n_1,\dots,n_k$ be natural numbers. Each pair of them has only the common factor 1. (a) Prove that for all $a_1,\dots,a_k$ some $x$ has $x\equiv a_j \pmod{n_j}$ for every $j$. (b) Prove that two such solutions are equivalent modulo $n_1\cdots n_k$. (c) Prove that the map from $x\in\{0,\dots,n_1\cdots n_k-1\}$ to the $k$-tuple of the remainders of $x$ modulo $n_1,\dots,n_k$ is a bijection. Prove that it keeps sums and products, where the $j$-th entry of a sum or product of tuples is taken modulo $n_j$.'
            answer_contract: {"kind":"written"}
            answer: 'Build x from inverses as in Proposition 3.107; two solutions differ by a multiple of every n_j, so the remainder map is a bijection.'
            solution_sketch: 'For (a) and k = 2, Proposition 3.107 gives $y_1,y_2$ with $n_1y_1\equiv 1$ modulo $n_2$ and $n_2y_2\equiv 1$ modulo $n_1$. Then $x=a_1n_2y_2+a_2n_1y_1$ solves both congruences. More moduli follow by induction. For (b), two solutions differ by a multiple of every $n_j$, so Exercise 3-107b gives a multiple of the product. For (c), parts (a) and (b) show that the remainder map is onto and one-to-one on the numbers below the product. The remainder of a sum or product modulo $n_j$ depends only on the remainders of the terms, so the map keeps sums and products.'
        constraints: 'Find inverses, test for common factors and find zero products modulo m; the items vary the numbers and moduli.'
      - id: kp2
        name: 'Theorem 3.108: Fermat''s Little Theorem'
        key_prerequisites: [fom-3-4-induction]
        exemplars:
          - problem: 'Give the remainder of each power. (a) $2^{100}$ divided by $13$. (b) $3^{50}$ divided by $7$. (c) $5^{101}$ divided by $11$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 3; b = 2; c = 5'
            solution_sketch: 'Use $a^{p-1}\equiv 1$. In (a), $2^{12}\equiv 1$ modulo 13 and $100=12\cdot 8+4$, so the remainder of 16 is 3. In (b), $3^6\equiv 1$ modulo 7 and $50=6\cdot 8+2$, so the remainder of 9 is 2. In (c), $5^{10}\equiv 1$ modulo 11 and $101=10\cdot 10+1$, so the remainder is 5.'
          # source: FoM exercise 3.9-3-102
          - problem: 'Work modulo $5$. For $a=1,2,3,4$, let $m$ be the smallest positive integer with $a^m\equiv 1 \pmod 5$. Give $m$ for (a) $a=1$, (b) $a=2$, (c) $a=3$, (d) $a=4$. (e) Count the values of $a$ for which $m$ is not equal to $4$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}},{"name":"e","contract":{"kind":"exact"}}]}
            answer: 'a=1;b=4;c=4;d=2;e=2'
            solution_sketch: 'Compute the powers. For a = 1 the smallest m is 1. The powers of 2 are 2, 4, 3, 1, so m is 4. The powers of 3 are 3, 4, 2, 1, so m is 4. The powers of 4 are 4 and 1, so m is 2. The values a = 1 and a = 4 give m different from 4, so the count is 2.'
          - problem: 'Give the smallest positive integer $m$ with $a^m\equiv 1 \pmod 7$. (a) $a=2$. (b) $a=3$. (c) $a=6$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 3; b = 6; c = 2'
            solution_sketch: 'Compute the powers. The powers of 2 are 2, 4, 1, so m is 3. The powers of 3 are 3, 2, 6, 4, 5, 1, so m is 6. The powers of 6 are 6 and 1, so m is 2.'
          - problem: 'Give the remainder. (a) $\binom{7}{3}$ divided by $7$. (b) $6^7-5^7-1$ divided by $7$. (c) $\binom{6}{3}$ divided by $6$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 0; b = 0; c = 2'
            solution_sketch: 'In (a), $\binom{7}{3}=35=7\cdot 5$, so the remainder is 0. In (b), $6^7\equiv 6$ and $5^7\equiv 5$ by Fermat, so the remainder of $6-5-1$ is 0. In (c), $\binom{6}{3}=20=6\cdot 3+2$, so the remainder is 2.'
          - problem: 'Compute the remainder of $2^{p-1}$ divided by $p$. (a) $p=9$. (b) $p=15$. (c) $p=17$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 4; b = 4; c = 1'
            solution_sketch: 'In (a), $2^8=256=9\cdot 28+4$, so the remainder is 4. In (b), $2^4\equiv 1$ modulo 15 and $14=4\cdot 3+2$, so the remainder is 4. In (c), 17 is prime and 17 does not divide 2, so Fermat gives 1.'
          - problem: 'Count the numbers $a\in\{1,\dots,p-1\}$ with $a^{p-1}\equiv 1 \pmod p$. (a) $p=7$. (b) $p=9$. (c) $p=15$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 6; b = 2; c = 4'
            solution_sketch: 'For the prime 7, Fermat gives every a, so the count is 6. For p = 9, test the powers $a^8$: the values a = 1 and a = 8 give 1, and the other units and the multiples of 3 do not, so the count is 2. For p = 15, only a = 1, 4, 11 and 14 give 1, so the count is 4.'
          # argument: Theorem 3.108
          - problem: 'Prove: let $p$ be a prime number. Then $a^p\equiv a \pmod p$ for every $a\in\mathbb{N}$. Moreover, $a^{p-1}\equiv 1 \pmod p$ for every $a\in\mathbb{N}$ that $p$ does not divide.'
            answer_contract: {"kind":"written"}
            answer: 'Prove a^p = a by induction with the binomial theorem. Then cancel one factor a with an inverse from Proposition 3.107.'
            solution_sketch: 'Prove $a^p\equiv a$ by induction on $a$. The base step $a=1$ is clear. In the induction step, $(a+1)^p=1+a^p+{}$ terms with a binomial coefficient that $p$ divides, so $(a+1)^p\equiv 1+a^p\equiv a+1$. For the second part, let $p$ not divide $a$. Proposition 3.107 gives $b$ with $ab\equiv 1$ modulo $p$. Multiply $a^p\equiv a$ by $b$ to get $a^{p-1}\equiv 1$.'
          # source: FoM exercise 3.9-3-101
          - problem: 'Let $a,p\in\mathbb{N}$ have no common factor and let $n,m\in\mathbb{N}$ with $a^{n+m}\equiv a^n \pmod p$. Prove that $a^m\equiv 1 \pmod p$.'
            answer_contract: {"kind":"written"}
            answer: 'The number a^n has an inverse modulo p, because a^n and p have no common factor. Multiply a^(n+m) = a^n by that inverse.'
            solution_sketch: 'Use Proposition 3.107. The numbers $a^n$ and $p$ have no common factor. So some $b$ has $a^nb\equiv 1$ modulo $p$. Multiply $a^{n+m}\equiv a^n$ by $b$. The left side becomes $a^m$ and the right side becomes 1.'
          # source: FoM exercise 3.9-3-109
          - problem: 'Let $p\in\mathbb{N}$. (a) Prove that if some $a\in\{2,\dots,p-1\}$ has $a^{p-1}\not\equiv 1 \pmod p$, then $p$ is not prime. (b) Let $p,q\in\mathbb{N}$ have only the common factor 1, and let $d,e\in\mathbb{N}$ with $de\equiv 1$ modulo $(p-1)(q-1)$. Let $M\subseteq\mathbb{N}$ be a finite set so that every $m\in M$ has $m^{p-1}\equiv 1$ modulo $p$ and $m^{q-1}\equiv 1$ modulo $q$. Let $c$ be the remainder of $m^e$ divided by $pq$. Prove that $c^d\equiv m$ modulo $pq$ for every $m\in M$.'
            answer_contract: {"kind":"written"}
            answer: '(a) is the contrapositive of Fermat''s Little Theorem. (b) The RSA proof uses p and q only through the congruences m^(p-1) = 1 and m^(q-1) = 1.'
            solution_sketch: 'For (a), if $p$ is prime, Theorem 3.108 gives $a^{p-1}\equiv 1$ for every $a$ that $p$ does not divide, and the given $a$ is not a multiple of $p$ because $a<p$. So $p$ is not prime. For (b), follow the proof of Theorem 3.109. Write $de=1+t(p-1)(q-1)$, so $c^d\equiv m^{de}$ modulo $pq$. The two assumed congruences give $m^{de}\equiv m$ modulo $p$ and modulo $q$. Since $p$ and $q$ have only the common factor 1, $m^{de}\equiv m$ modulo $pq$.'
        constraints: 'Reduce powers modulo a prime, find orders and test the Fermat condition; the items vary the numbers.'
      - id: kp3
        name: 'Theorem 3.109: RSA encryption and decryption'
        key_prerequisites: [fom-3-8-arithmetic-modulo-m]
        exemplars:
          # source: FoM exercise 3.9-3-103
          - problem: 'Encrypt and decrypt with RSA. In the first case, the message is $2$, the public key is $(n,e)=(91,31)$ and the private key is $7$. In the second case, the message is $7$, the public key is $(85,13)$ and the private key is $5$. (a) Give the encrypted message of the first case. (b) Decrypt that encrypted message and give the result. (c) Give the encrypted message of the second case. (d) Decrypt that encrypted message and give the result.'
            answer_contract: {"kind":"multipart","parts":[{"name":"ea","contract":{"kind":"exact"}},{"name":"da","contract":{"kind":"exact"}},{"name":"eb","contract":{"kind":"exact"}},{"name":"db","contract":{"kind":"exact"}}]}
            answer: 'ea = 37; da = 2; eb = 57; db = 7'
            solution_sketch: 'Encrypt with $c=m^e$ modulo $n$, then decrypt with $c^d$ modulo $n$. In (a), $2^{31}$ modulo 91 is 37. In (b), $37^7$ modulo 91 is 2, the message. In (c), $7^{13}$ modulo 85 is 57. In (d), $57^5$ modulo 85 is 7, the message.'
          # source: FoM exercise 3.9-3-104
          - problem: 'A message was encrypted with RSA to $c=54$ under the public key $(n,e)=(119,17)$. Note that $119=7\cdot 17$. (a) Give the private key $d$ with $de\equiv 1$ modulo $(7-1)(17-1)$ and $0<d<96$. (b) Give the message $m$ with $0\le m<119$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"d","contract":{"kind":"exact"}},{"name":"m","contract":{"kind":"exact"}}]}
            answer: 'd = 17; m = 3'
            solution_sketch: 'Here $(7-1)(17-1)=96$. In (a), $17\cdot 17=289=3\cdot 96+1$, so d is 17. In (b), $m=54^{17}$ modulo 119, which is 3.'
          # source: FoM exercise 3.9-3-105
          - problem: 'Letters become numbers: space is $00$, A is $01$, B is $02$, up to Z as $26$. Two letters form a block of four digits, and RSA with the public key $(n,e)=(3233,17)$ and the private key $d=2753$ treats the block as one number. (a) Encrypt the block HI, which is the number $809$. (b) Encrypt the block GO, which is the number $715$. (c) Decrypt the number 449 and give the result without leading zeros. (d) Decrypt the number 2487 and give the result without leading zeros.'
            answer_contract: {"kind":"multipart","parts":[{"name":"ea","contract":{"kind":"exact"}},{"name":"eb","contract":{"kind":"exact"}},{"name":"dc","contract":{"kind":"exact"}},{"name":"dd","contract":{"kind":"exact"}}]}
            answer: 'ea = 1171; eb = 1837; dc = 1415; dd = 501'
            solution_sketch: 'Encrypt with $c=m^{17}$ modulo 3233. In (a), $809^{17}$ modulo 3233 is 1171. In (b), $715^{17}$ modulo 3233 is 1837. Decrypt with $c^{2753}$ modulo 3233. In (c), the result is 1415, the block NO. In (d), the result is 501, the block EA.'
          # source: FoM exercise 3.9-3-106
          - problem: 'A pair $(n,e)$ is valid when $n=pq$ for two different primes $p$ and $q$, and $1<e<(p-1)(q-1)$, and $e$ has no common factor above $1$ with $(p-1)(q-1)$. Give 1 if the pair is valid and 0 if not. (a) $(77,13)$. (b) $(490,133)$. (c) $(187,91)$. (d) $(24341,17)$. (e) $(1717,15)$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}},{"name":"e","contract":{"kind":"exact"}}]}
            answer: 'a=1;b=0;c=1;d=1;e=0'
            solution_sketch: 'Factor n. In (a), $77=7\cdot 11$, the product is 60 and 13 has no common factor with it, so the value is 1. In (b), $490=2\cdot 5\cdot 7^2$ is not a product of two primes, so the value is 0. In (c), $187=11\cdot 17$, the product is 160 and 91 has no common factor with it, so the value is 1. In (d), $24341=101\cdot 241$, the product is 24000 and 17 has no common factor with it, so the value is 1. In (e), $1717=17\cdot 101$, the product is 1600 and 15 shares 5 with it, so the value is 0.'
          - problem: 'Take the primes $p=7$ and $q=11$ and $e=13$. (a) Give $n=pq$. (b) Give $(p-1)(q-1)$. (c) Give the number $d$ with $0<d<(p-1)(q-1)$ and $de\equiv 1$ modulo $(p-1)(q-1)$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"n","contract":{"kind":"exact"}},{"name":"f","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}}]}
            answer: 'n = 77; f = 60; d = 37'
            solution_sketch: 'In (a), $7\cdot 11=77$. In (b), $6\cdot 10=60$. In (c), $13\cdot 37=481=8\cdot 60+1$, so d is 37.'
          - problem: 'Take the primes $p=5$ and $q=11$ and the public exponent $e=3$. (a) Give the private key $d$ with $0<d<40$ and $de\equiv 1$ modulo $40$. (b) Give the encrypted message of $m=9$. (c) Decrypt the encrypted message of $m=9$ and give the result.'
            answer_contract: {"kind":"multipart","parts":[{"name":"d","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"m","contract":{"kind":"exact"}}]}
            answer: 'd = 27; c = 14; m = 9'
            solution_sketch: 'Here $n=55$ and $(p-1)(q-1)=40$. In (a), $3\cdot 27=81=2\cdot 40+1$, so d is 27. In (b), $9^3=729$, which has remainder 14 modulo 55. In (c), $14^{27}$ modulo 55 is 9.'
          - problem: 'Use RSA with $p=3$, $q=11$, $n=33$, public exponent $e=3$ and private exponent $d=7$. Give the encrypted message of (a) $m=2$, (b) $m=5$, (c) $m=10$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 8; b = 26; c = 10'
            solution_sketch: 'Compute $m^3$ modulo 33. In (a), $2^3=8$, so the result is 8. In (b), $5^3=125=3\cdot 33+26$, so the result is 26. In (c), $10^3=1000=30\cdot 33+10$, so the result is 10.'
          - problem: 'Take the primes $p=3$ and $q=7$. (a) Give $(p-1)(q-1)$. (b) Count the numbers $e\in\{2,\dots,11\}$ that have no common factor above $1$ with $(p-1)(q-1)$.'
