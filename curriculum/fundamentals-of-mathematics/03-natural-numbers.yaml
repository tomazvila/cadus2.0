            answer: 'a = 128; b = 7; c = 64'
            solution_sketch: 'We get $8\cdot16=128$. The exponents add, so $e=3+4=7$ and $2^7=128$. In (c) we get $8^2=64$.'
          - problem: '(a) Give $(2\cdot 5)^3$. (b) Give the exponent $e$ with $(3^2)^4=3^e$. (c) Give $(3^2)^3$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 1000; b = 8; c = 729'
            solution_sketch: 'We get $10^3=1000$. The exponents multiply, so $e=2\cdot4=8$. In (c) the exponent is 6 and $3^6=729$.'
          - problem: 'For $a,b\in\mathbb{N}$ let $a*b=a^b$. (a) Give $2*3$. (b) Give $(2*3)*2$. (c) Give $2*(3*2)$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 8; b = 64; c = 512'
            solution_sketch: 'We get $2*3=2^3=8$. Then $(2*3)*2=8^2=64$. Also $3*2=9$, and then $2*9=2^9=512$. The three values are 8, 64 and 512.'
          - problem: 'Let $f(x)=x+1$ and $g(x)=2x$. Let $f\cdot g$ mean $x\mapsto f(g(x))$. (a) Give $(f\cdot g)(3)$. (b) Give the value at $0$ of $(f\cdot g)\cdot(f\cdot g)$. (c) Give the value at $0$ of $f\cdot f\cdot g\cdot g$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 7; b = 3; c = 2'
            solution_sketch: 'We get $f(g(3))=f(6)=7$. For (b) $f(g(0))=1$, then $f(g(1))=3$. For (c) apply $g$ twice to 0 to get 0, then $f$ twice to get 2.'
          # argument: Theorem 3.71
          - problem: 'Prove: Let $(S,\cdot)$ be a semigroup, let $a\in S$ and $m,n\in\mathbb{N}$. Here $a^n$ is the product of $n$ factors equal to $a$. Then $a^{m+n}=a^m\cdot a^n$.'
            answer_contract: {"kind":"written"}
            answer: 'Write the power as a product of m+n factors a and split it after the m-th factor.'
            solution_sketch: 'By Definition 3.70, $a^{m+n}$ is the product of $m+n$ factors equal to $a$. Split this product after the $m$-th factor with the product version of the splitting rule. The first block is $a^m$. The second block is $a^n$ after the index shift. Hence $a^{m+n}=a^m\cdot a^n$.'
          # argument: Theorem 3.71
          - problem: 'Prove: Let $(S,\cdot)$ be a semigroup and let $a,b\in S$ with $a\cdot b=b\cdot a$. Then $(a\cdot b)^n=a^n\cdot b^n$ for every $n\in\mathbb{N}$.'
            answer_contract: {"kind":"written"}
            answer: 'Use induction on n. Commutativity moves one factor a past the block of n factors b.'
            solution_sketch: 'For $n=1$ both sides equal $a\cdot b$. Assume $(ab)^n=a^nb^n$. Then $(ab)^{n+1}=(ab)^n(ab)=a^nb^n\,a\,b$. First show by induction on $n$ that $b^n a=a\,b^n$. Then $a^nb^n\,a\,b=a^n a\,b^n b$, which is $a^{n+1}b^{n+1}$ by part 1 of Theorem 3.71.'
          # source: FoM exercise 3.5-3-47
          - problem: 'Let $(S,\cdot)$ be a semigroup, let $a,b\in S$ and $m,n\in\mathbb{N}$. Use these product rules: a product of $m+n$ factors splits after the $m$-th factor into two products, a shift of the index range keeps the product, and in a commutative semigroup a product of pairs $a_jb_j$ regroups into the product of the $a_j$ times the product of the $b_j$. Prove: (a) $a^{m+n}=a^m\cdot a^n$. (b) If $a\cdot b=b\cdot a$, then $(a\cdot b)^n=a^n\cdot b^n$. (c) $(a^m)^n=a^{mn}$.'
            answer_contract: {"kind":"written"}
            answer: 'Use the splitting rule for (a) and induction on n for (b) and (c). In (c) the product of n blocks has mn factors.'
            solution_sketch: 'Part (a) splits the product of $m+n$ factors after the $m$-th factor, as in Theorem 3.71. Part (b) is an induction on $n$ that moves one factor with commutativity. Part (c) is an induction on $n$. The step uses $(a^m)^{n+1}=(a^m)^n\cdot a^m=a^{mn}\cdot a^m$. Then part (a) gives $a^{mn+m}=a^{m(n+1)}$.'
          # source: FoM exercise 3.5-3-50
          - problem: 'For $a,b\in\mathbb{N}$ let $a*b=a^b$. Prove with one numeric example for each part. (a) The operation $*$ is not associative. (b) The operation $*$ is not commutative. (c) The operation $*$ is not distributive over $+$. (d) The operation $+$ is not distributive over $*$. For (c) and (d) use the law with the new operation on the outside, as for multiplication.'
            answer_contract: {"kind":"written"}
            answer: 'Give one example for each part, such as (2*3)*2 = 64 but 2*(3*2) = 512 for part (a).'
            solution_sketch: 'Part (a): $(2*3)*2=8*2=64$ and $2*(3*2)=2*9=512$. Part (b): $2*3=8$ and $3*2=9$. Part (c): $(1+1)*2=4$ but $1*2+1*2=2$. Part (d): $1+(2*2)=5$ but $(1+2)*(1+2)=27$. One example refutes each law.'
          # source: FoM exercise 3.5-3-51
          - problem: 'Prove by induction on $n$. (a) $\sum_{j=1}^{n} (2j-1)=n^2$. (b) $\sum_{j=0}^{n} 2^j=2^{n+1}-1$. (c) $\sum_{j=1}^{n} 3^j=\frac{3^{n+1}-3}{2}$.'
            answer_contract: {"kind":"written"}
            answer: 'Use induction on n in each part. Add the next term to the formula for n and rewrite the result as the formula for n+1.'
            solution_sketch: 'In (a) the base case is $1=1^2$. The step is $n^2+2(n+1)-1=(n+1)^2$. In (b) the base case is $n=0$ with $1=2-1$. The step is $2^{n+1}-1+2^{n+1}=2^{n+2}-1$. In (c) the base case is $3=(9-3)/2$. The step is $(3^{n+1}-3)/2+3^{n+1}=(3^{n+2}-3)/2$.'
          # source: FoM exercise 3.5-3-52
          - problem: 'Prove by induction on $n$. (a) $\sum_{j=1}^{n} j=\frac{n(n+1)}{2}$. (b) $\sum_{j=1}^{n} j^3=\frac{n^2(n+1)^2}{4}$. (c) $\sum_{j=1}^{n} j^4=\frac{n(n+1)(2n+1)(3n^2+3n-1)}{30}$.'
            answer_contract: {"kind":"written"}
            answer: 'Use induction on n. In each part add the next term to the formula and factor the result into the formula for n+1.'
            solution_sketch: 'For $n=1$ the three formulas give 1, 1 and $1\cdot2\cdot3\cdot5/30=1$. In (a) the step is $\frac{n(n+1)}{2}+(n+1)=\frac{(n+1)(n+2)}{2}$. In (b) the step is $\frac{n^2(n+1)^2}{4}+(n+1)^3=\frac{(n+1)^2(n+2)^2}{4}$. In (c) the step adds $(n+1)^4$ and factors the sum as $\frac{(n+1)(n+2)(2n+3)(3n^2+9n+5)}{30}$. This is the formula for $n+1$.'
        constraints: 'products by recursion, powers, and the three power rules'
      - id: kp5
        name: 'Definition 3.72 and Theorem 3.73: the number 0 and induction on N_0'
        key_prerequisites: [fom-3-4-induction]
        exemplars:
          - problem: '(a) Give $12+0$. (b) Give $12\cdot 0$. (c) Give $12^0$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 12; b = 0; c = 1'
            solution_sketch: 'Adding 0 leaves 12, so a is 12. Multiplying by 0 gives 0, so b is 0. By Definition 3.72 any power with exponent 0 is 1, so c is 1.'
          - problem: 'A sum with no terms equals 0. (a) Give $\sum_{j=5}^{3} j$. (b) Give $\sum_{j=1}^{0} 7$. (c) Give $\sum_{j=0}^{3} j$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 0; b = 0; c = 6'
            solution_sketch: 'A sum whose end index is below the start index is empty and equals 0, so a and b are 0. In (c) the terms are 0, 1, 2, 3 and the sum is 6.'
          - problem: '(a) Give the number of elements of $\{n\in\mathbb{N}_0: n\le 9\}$. (b) Give the number of elements of $\{n\in\mathbb{N}_0: n^2<30\}$. (c) Give the number of elements of $\{n\in\mathbb{N}: n<8\}$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 10; b = 6; c = 7'
            solution_sketch: 'The set in (a) holds 0 to 9, which is 10 numbers. The set in (b) holds 0 to 5, which is 6 numbers. The set in (c) holds 1 to 7, which is 7 numbers.'
          - problem: 'Give $\sum_{j=0}^{n} 2^j$ for (a) $n=0$, (b) $n=3$, (c) $n=5$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 15; c = 63'
            solution_sketch: 'For n = 0 the only term is 1. For n = 3 the terms are 1, 2, 4, 8 and the sum is 15. For n = 5 add 16 and 32 to get 63.'
          - problem: 'Let $P(n)$ be the statement $n^2\le 2n$ on $\mathbb{N}_0$. Give 1 if $P(n)$ holds and 0 if not. (a) $n=0$. (b) $n=2$. (c) $n=3$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 1; c = 0'
            solution_sketch: 'For n = 0 we get $0\le0$, so a is 1. For n = 2 we get $4\le4$, so b is 1. For n = 3 we get $9\le6$, which fails, so c is 0.'
          - problem: 'A statement $P(n)$ on $\mathbb{N}_0$ has $P(0)$ true. The step from $P(n)$ to $P(n+1)$ holds for each $n\in\mathbb{N}_0$. (a) Give the number of steps from $P(0)$ to $P(6)$. (b) Give the number of steps from $P(3)$ to $P(10)$. (c) Give the number of steps from $P(0)$ to $P(25)$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 6; b = 7; c = 25'
            solution_sketch: 'Each step raises the index by 1. So the counts are 6-0 = 6, 10-3 = 7 and 25-0 = 25.'
          # argument: Theorem 3.73
          - problem: 'Prove: Let $P(n)$ be a statement for $n\in\mathbb{N}_0$. If $P(0)$ holds and $P(n)$ implies $P(n+1)$ for every $n\in\mathbb{N}_0$, then $P(n)$ holds for every $n\in\mathbb{N}_0$.'
            answer_contract: {"kind":"written"}
            answer: 'P(0) and the step give P(1). Then the Principle of Induction on N gives P(n) for all n in N, and P(0) covers the case 0.'
            solution_sketch: 'The step from $n=0$ gives $P(1)$. Apply Theorem 3.45 with base case $n=1$. The step for $n\in\mathbb{N}$ is a special case of the step for $n\in\mathbb{N}_0$. So $P(n)$ holds for all $n\in\mathbb{N}$. Together with $P(0)$ it holds on $\mathbb{N}_0$.'
          # source: FoM exercise 3.5-3-49
          - problem: 'Prove each law on $\mathbb{N}_0$. (a) Addition is associative. (b) Addition is commutative. (c) Multiplication is associative. (d) Multiplication is commutative. (e) Multiplication is distributive over addition.'
            answer_contract: {"kind":"written"}
            answer: 'Each law holds on N by earlier results. Treat the cases with a zero by Definition 3.72, where both sides equal the same value.'
            solution_sketch: 'Each law holds on $\mathbb{N}$ by the results of the section. Take the elements of $\mathbb{N}_0$ in the law. If none is 0, use the law on $\mathbb{N}$. If one is 0, Definition 3.72 shows that both sides equal the same expression. Check the cases with 0 one by one. In (e) a factor 0 makes both sides 0.'
          # source: FoM exercise 3.5-3-53
          - problem: 'For $p,n\in\mathbb{N}$ let $S_p(n)=\sum_{j=1}^{n} j^p$. (a) Prove by induction on $n$ that $S_p(n)=\frac{1}{p+1}\Big(n(n+1)^p-\sum_{j=1}^{p-1}\binom{p}{j-1}S_j(n)\Big)$. (b) Derive a closed formula for $S_5(n)$ without a sum.'
            answer_contract: {"kind":"written"}
            answer: 'Part (a): induct on n and expand powers with the binomial theorem. Part (b): S_5(n) = n^2(n+1)^2(2n^2+2n-1)/12.'
            solution_sketch: 'For $n=1$ the right side of (a) equals 1. In the step, split off the term $j=n+1$ of $S_p(n+1)$. Expand the powers of $n+2$ with Theorem 3.77. The terms cancel and leave the formula for $n+1$. For (b) use the formula with $p=1,2,3,4$ and then $p=5$. This gives $S_5(n)=\frac{n^2(n+1)^2(2n^2+2n-1)}{12}$.'
          # source: FoM exercise 3.5-3-54
          - problem: 'Prove: A finite set $A$ has exactly $\binom{|A|}{k}$ subsets with $k$ elements for each $k\in\{0,\dots,|A|\}$.'
            answer_contract: {"kind":"written"}
            answer: 'Induct on |A|. Sort the k-subsets by whether they hold a fixed element, and add the two counts with Pascal''s rule.'
            solution_sketch: 'Induct on $|A|$. For $|A|=0$ the only subset is the empty set, and the count is 1. Fix $x\in A$ with $|A|=n+1$. The $k$-subsets without $x$ are the $k$-subsets of $A\setminus\{x\}$, and they number $\binom{n}{k}$. The $k$-subsets with $x$ match the $(k-1)$-subsets of $A\setminus\{x\}$, and they number $\binom{n}{k-1}$. Theorem 3.76 adds the two counts to $\binom{n+1}{k}$.'
        constraints: 'empty sums, the neutral values of 0, and induction from the base case 0'
      - id: kp6
        name: 'Definition 3.74 to Theorem 3.77: factorials, binomial coefficients and the Binomial Theorem'
        key_prerequisites: [fom-3-3-more-abstract-viewpoint-binary, fom-3-4-induction]
        exemplars:
          - problem: '(a) Give $5!$. (b) Give $0!$. (c) Give $\frac{7!}{5!}$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 120; b = 1; c = 42'
            solution_sketch: 'We get 5! = 1*2*3*4*5 = 120. By Definition 3.74 we have 0! = 1. Also 7!/5! = 6*7 = 42.'
          - problem: '(a) Give $\binom{6}{2}$. (b) Give $\binom{7}{0}$. (c) Give $\binom{8}{3}$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 15; b = 1; c = 56'
            solution_sketch: 'We get 6!/(2!4!) = 15. Also 7!/(0!7!) = 1. Finally 8!/(3!5!) = 56.'
          - problem: '(a) Give $\binom{6}{2}$. (b) Give $\binom{6}{3}$. (c) Give $\binom{7}{3}$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 15; b = 20; c = 35'
            solution_sketch: 'We get 15 and 20 from the factorial formula. Pascal''s rule adds the two values: 15+20 = 35, which is the value in (c).'
          - problem: '(a) Give $\sum_{k=0}^{6}\binom{6}{k}$. (b) Give $\binom{6}{4}$. (c) Give the number of $k\in\{0,\dots,6\}$ with $\binom{6}{k}=6$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 64; b = 15; c = 2'
            solution_sketch: 'The row 1, 6, 15, 20, 15, 6, 1 adds to 64. The entry for k = 4 is 15. The entry 6 occurs for k = 1 and k = 5, which is 2 values.'
          - problem: 'Expand with the Binomial Theorem. (a) Give the coefficient of $x^3y$ in $(x+y)^4$. (b) Give the coefficient of $x^2y^2$ in $(x+y)^4$. (c) Give the coefficient of $x^2y^3$ in $(x+y)^5$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 4; b = 6; c = 10'
            solution_sketch: 'The coefficient of $x^ky^{n-k}$ is $\binom{n}{k}$. So (a) is $\binom{4}{3}=4$, (b) is $\binom{4}{2}=6$ and (c) is $\binom{5}{2}=10$.'
          - problem: '(a) Give the coefficient of $x^3$ in $(x+2)^5$. (b) Give the coefficient of $x^2$ in $(2x+1)^4$. (c) Give the sum of all coefficients of $(x+y)^7$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 40; b = 24; c = 128'
            solution_sketch: 'In (a) the coefficient is $\binom{5}{3}\cdot2^2=40$. In (b) it is $\binom{4}{2}\cdot2^2=24$. In (c) put $x=y=1$ to get $2^7=128$.'
          # argument: Lemma 3.75
          - problem: 'Prove: For all $n,k\in\mathbb{N}_0$ with $k\le n$ the quotient $\frac{n!}{k!\,(n-k)!}$ is a natural number.'
            answer_contract: {"kind":"written"}
            answer: 'Induct on n. Pascal''s rule writes the coefficient for n+1 as a sum of two coefficients for n, which are natural numbers.'
            solution_sketch: 'The cases $k=0$ and $k=n$ give 1. Induct on $n$, with base case $n=1$. For the step take $k$ between 1 and $n$. The computation of Theorem 3.76 shows that $\binom{n}{k-1}+\binom{n}{k}$ equals the quotient for $n+1$ and $k$. Both parts are natural numbers by the hypothesis, so the quotient exists by Definition 3.43 and Proposition 3.44.'
          # argument: Theorem 3.76
          - problem: 'Prove Pascal''s rule: for $n,k\in\mathbb{N}$ with $k\le n$ we have $\binom{n}{k-1}+\binom{n}{k}=\binom{n+1}{k}$.'
            answer_contract: {"kind":"written"}
            answer: 'Write both coefficients with factorials, bring them to the common denominator k!(n+1-k)!, and add.'
            solution_sketch: 'Use Lemma 3.75 and Definition 3.74. Write the two coefficients as $\frac{n!}{(k-1)!(n-k+1)!}$ and $\frac{n!}{k!(n-k)!}$. Multiply the first by $k/k$ and the second by $(n+1-k)/(n+1-k)$. Both fractions then have the denominator $k!(n+1-k)!$. The numerators add to $n!(k+n+1-k)=(n+1)!$, which gives $\binom{n+1}{k}$.'
          # argument: Theorem 3.77
          - problem: 'Prove the first step of the induction for the Binomial Theorem. Let $(S,+)$ be a commutative semigroup. Let $\cdot$ be associative, commutative and distributive over $+$, with a neutral element. Assume $(a+b)^n=\sum_{k=0}^{n}\binom{n}{k}a^kb^{n-k}$. Prove that $(a+b)^{n+1}=\sum_{k=0}^{n}\binom{n}{k}a^{k+1}b^{n-k}+\sum_{k=0}^{n}\binom{n}{k}a^{k}b^{n+1-k}$.'
            answer_contract: {"kind":"written"}
            answer: 'Write (a+b)^(n+1) as (a+b)(a+b)^n, insert the hypothesis, and distribute a and b over the sum.'
            solution_sketch: 'Split off one factor: $(a+b)^{n+1}=(a+b)(a+b)^n$. Insert the induction hypothesis for $(a+b)^n$. Distribute the factor $a+b$ over the sum with Theorem 3.66. Theorem 3.76 is needed only in the second step. Multiply $a$ into each term and $b$ into each term. Use commutativity to merge the powers of $a$ and $b$.'
          # argument: Theorem 3.77
          - problem: 'Prove the second step of the induction for the Binomial Theorem. In the setting of the first step, show that $\sum_{k=0}^{n}\binom{n}{k}a^{k+1}b^{n-k}+\sum_{k=0}^{n}\binom{n}{k}a^{k}b^{n+1-k}=\sum_{j=0}^{n+1}\binom{n+1}{j}a^jb^{n+1-j}$.'
            answer_contract: {"kind":"written"}
            answer: 'Shift the index of the first sum, split off the end terms, and merge the rest with Pascal''s rule.'
            solution_sketch: 'In the first sum put $j=k+1$. In the second sum put $j=k$. Split off the term $j=n+1$ of the first sum and the term $j=0$ of the second sum. Combine the sums over $j=1,\dots,n$ with Theorem 3.76. The two end terms equal the terms $j=n+1$ and $j=0$ of the right side because $\binom{n}{n}=\binom{n+1}{n+1}=1$.'
          # source: FoM exercise 3.5-3-55
          - problem: 'Prove each statement. In (a) to (j) assume the usual rules for the real numbers. (a) For $q\neq1$: $\sum_{j=1}^{n} q^j=\frac{q-q^{n+1}}{1-q}$. (b) $\sum_{j=1}^{n}\big(\frac1j-\frac1{j+1}\big)=1-\frac1{n+1}$. (c) For $x\neq y$: $\sum_{j=1}^{n} x^{n-j}y^{j-1}=\frac{x^n-y^n}{x-y}$. (d) For $x\neq1$ and $n\ge0$: $\prod_{j=0}^{n}\big(1+x^{2^j}\big)=\frac{1-x^{2^{n+1}}}{1-x}$. (e) For $n\ge2$: $\prod_{j=1}^{n-1}\big(1+\frac1j\big)=n$. (f) For $n\ge2$: $\prod_{j=1}^{n-1}\big(1+\frac1j\big)^j=\frac{n^n}{n!}$. (g) $\sum_{j=1}^{2^n}\frac1j\ge1+\frac n2$. (h) For $x>-1$, $x\neq0$, $n\ge2$: $(1+x)^n>1+nx$. (i) If $p\ge2$, then $p^n>n$ for all $n\ge1$. (j) For $-1\le x\le1$ and $k\in\mathbb{N}$: $(1+x)^k\le1+kx+3^kx^2$.'
            answer_contract: {"kind":"written"}
            answer: 'Use induction on n in every part. Add the next term or factor to the formula for n and rewrite the result as the formula for n+1.'
            solution_sketch: 'Each part is an induction on $n$ with a short base case. In (a) to (d) the step adds the next term or factor and uses a common denominator. In (e) and (f) the step multiplies by the next factor, and the fractions cancel. In (g) the step adds $2^n$ terms, each at least $\frac1{2^{n+1}}$, which adds at least $\frac12$. In (h) multiply the hypothesis by $1+x>0$ and drop the term $nx^2$. In (i) and (j) multiply the hypothesis by $p$ or by $1+x\ge0$, and use $k\le3^k$ in (j).'
          # source: FoM exercise 3.5-3-56
          - problem: 'Let $(S,+)$ be a commutative semigroup. Let $\cdot$ be associative, commutative and distributive over $+$. Use subtraction as in Definition 3.41 with the rules of Proposition 3.42. Prove: (a) $(a+b)^2=a^2+2ab+b^2$. (b) $(a-b)^2=a^2-2ab+b^2$. (c) $(a+b)(a-b)=a^2-b^2$.'
            answer_contract: {"kind":"written"}
            answer: 'Expand with the distributive law, collect equal terms with commutativity, and cancel terms with the rules of subtraction.'
            solution_sketch: 'Multiply out each product with the distributive law. Use commutativity to write $ba$ as $ab$. In (a) collect the two terms $ab$ into $2ab$. In (b) the rules of Proposition 3.42 handle the minus signs, and Definition 3.41 defines the difference. In (c) the terms $ab$ and $-ab$ cancel.'
          # source: FoM exercise 3.5-3-57
          - problem: 'Let $(S,+)$ be a commutative semigroup. Let $\cdot$ be an associative, commutative product on $S$ that is distributive over $+$ and has a neutral element. Subtraction has the properties of Proposition 3.42. Let $n\in\mathbb{N}$. Prove: $x^n-y^n=(x-y)\sum_{j=0}^{n-1}x^jy^{n-1-j}$.'
            answer_contract: {"kind":"written"}
            answer: 'Multiply out the right side. The two sums have the same terms except for the end terms, and these give x^n - y^n.'
            solution_sketch: 'Pull $x-y$ into the sum with Theorem 3.66. This gives $\sum x^{j+1}y^{n-1-j}-\sum x^jy^{n-j}$ for $j=0,\dots,n-1$. Shift the index in the first sum. Then the terms for $j=1,\dots,n-1$ cancel in pairs by Proposition 3.42. The terms left are $x^n$ and $-y^n$, as in Definition 3.41.'
        constraints: 'factorials, binomial coefficients, Pascal''s rule and the expansion of a binomial power'
    diagnostic_exemplar:
      problem: 'Give the sum $1+2+3+4$ written as $\sum_{j=1}^{4} j$.'
      answer_contract: {"kind":"exact"}
      answer: '10'
      solution_sketch: 'Add the four terms. We get 1+2 = 3, then 3+3 = 6, then 6+4 = 10.'
