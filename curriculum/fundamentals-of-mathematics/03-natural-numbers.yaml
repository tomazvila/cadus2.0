            solution_sketch: 'Each step adds the next square to the sum before it. We get $s_3=1+4+9=14$. Then $s_4=14+16=30$ and $s_5=30+25=55$. So the three values are 14, 30 and 55.'
          - problem: '(a) Give $\sum_{j=3}^{6} j$. (b) Give $\sum_{j=2}^{4} j^2$. (c) Give the number of terms of $\sum_{j=5}^{12} j$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 18; b = 29; c = 8'
            solution_sketch: 'In (a) the terms are 3, 4, 5, 6 and the sum is 18. In (b) the terms are 4, 9, 16 and the sum is 29. In (c) the index runs from 5 to 12, which gives 8 terms.'
          - problem: 'Let $a_1=3$ and $a_{j+1}=2a_j$. (a) Give $a_4$. (b) Give $\sum_{j=1}^{4} a_j$. (c) Give $\sum_{j=1}^{5} a_j-\sum_{j=1}^{4} a_j$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 24; b = 45; c = 48'
            solution_sketch: 'The terms are 3, 6, 12, 24 and 48. So $a_4=24$ and the sum of the first four terms is 45. The difference in (c) is the fifth term 48.'
          - problem: 'On $\mathbb{N}$ let $x\circ y=x+y+1$. This operation is associative. (a) Give $(1\circ 2)\circ 3$. (b) Give $1\circ(2\circ 3)$. (c) Give the canonical product $((1\circ 2)\circ 3)\circ 4$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 8; b = 8; c = 13'
            solution_sketch: 'First $1\circ 2=4$ and $4\circ 3=8$. Also $2\circ 3=6$ and $1\circ 6=8$, so both brackets give 8. Then $8\circ 4=13$.'
          - problem: 'On $\mathbb{Z}$ let $x\circ y=x-y$. (a) Give $(10\circ 4)\circ 3$. (b) Give $10\circ(4\circ 3)$. (c) Give 1 if $\circ$ is associative and 0 if not.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 3; b = 9; c = 0'
            solution_sketch: 'First $10-4=6$ and $6-3=3$. Also $4-3=1$ and $10-1=9$. The two results differ, so $\circ$ is not associative and c is 0.'
          - problem: 'A product of $n$ factors $a_1\circ\dots\circ a_n$ in this fixed order gets brackets so that each step joins two blocks. Count the different bracketings. (a) Give the count for 3 factors. (b) Give the count for 4 factors. (c) Give the count for 5 factors.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 2; b = 5; c = 14'
            solution_sketch: 'For 3 factors the split is 1+2 or 2+1, and each gives 1 bracketing, so the count is 2. For 4 factors the splits give 2+1+2 = 5. For 5 factors the splits give 5+2+2+5 = 14.'
          # argument: Theorem 3.59
          - problem: 'Prove: Let $(S,\circ)$ be a semigroup and let $a_1,\dots,a_n\in S$. Every bracketed product of $a_1,\dots,a_n$ in this order equals the canonical product $C(a_1,\dots,a_n)$. So brackets do not matter in a semigroup.'
            answer_contract: {"kind":"written"}
            answer: 'Use strong induction on n. Split the product at its last multiplication, rewrite both blocks as canonical products, and join them with associativity.'
            solution_sketch: 'Induct on the number $n$ of factors. For $n=1$ there is nothing to show. A bracketed product of $n+1$ factors ends with one multiplication of a block of the first $k$ factors and a block of the rest. By the induction hypothesis both blocks equal canonical products, as in Definition 3.55 and Definition 3.57. A second induction on the length of the right block, with associativity, shows that $C(a_1,\dots,a_k)\circ C(a_{k+1},\dots,a_{n+1})=C(a_1,\dots,a_{n+1})$. Hence every bracketing gives the canonical product.'
          # source: FoM exercise 3.5-3-41
          - problem: 'Let $(S,\circ)$ be a semigroup. (a) Define the canonical product $C(a_1,\dots,a_n)$ of elements of $S$ with a rule that adds one factor at a time from the left. (b) Define an arbitrarily bracketed product $M(a_1,\dots,a_n)$ of elements of $S$.'
            answer_contract: {"kind":"written"}
            answer: 'C(a1)=a1 and C(a1..a(n+1)) = C(a1..an) times a(n+1). M(a1)=a1, and M of more factors is M of the first k factors times M of the rest.'
            solution_sketch: 'Definition 3.55 builds $C$ by adding one factor on the right in each step. Definition 3.57 builds $M$ by splitting the list at one position and multiplying the two bracketed blocks. Each choice of split positions gives one bracketing. Theorem 3.59 shows that all these products agree.'
        constraints: 'sums by recursion, canonical product, number of bracketings'
      - id: kp2
        name: 'Example 3.62 and Example 3.63: evaluate a sum and check an induction formula'
        key_prerequisites: [fom-3-4-induction]
        exemplars:
          - problem: '(a) Give $\sum_{j=1}^{4} j^2$. (b) Give $\sum_{j=1}^{6} j^2$. (c) Give $\sum_{j=1}^{3} j^3$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 30; b = 91; c = 36'
            solution_sketch: 'Add the terms. In (a) we get 1+4+9+16 = 30. In (b) we add 25 and 36 to get 91. In (c) we get 1+8+27 = 36.'
          - problem: '(a) Give $\sum_{j=1}^{5} (3j-1)$. (b) Give $\sum_{j=2}^{5} 2^j$. (c) Give $\sum_{j=1}^{4} (-1)^j j$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 40; b = 60; c = 2'
            solution_sketch: 'In (a) the terms are 2, 5, 8, 11, 14 and the sum is 40. In (b) the terms are 4, 8, 16, 32 and the sum is 60. In (c) the terms are -1, 2, -3, 4 and the sum is 2.'
          - problem: 'Let $s_n=\sum_{j=1}^{n} j^2$. (a) Give $s_5$. (b) Give the term that the step from $s_5$ to $s_6$ adds. (c) Give $s_6$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 55; b = 36; c = 91'
            solution_sketch: 'Add the first five squares to get $s_5=1+4+9+16+25=55$. The step from $s_5$ to $s_6$ adds the next square $6^2=36$. Then $s_6=55+36=91$, which is the last answer.'
          - problem: 'Let $F(n)=\frac{n(n+1)(2n+1)}{6}$. (a) Give $F(4)$. (b) Give $F(7)$. (c) Give $F(10)$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 30; b = 140; c = 385'
            solution_sketch: 'Put each value of $n$ in the formula. We get $F(4)=4\cdot5\cdot9/6=30$. Also $F(7)=7\cdot8\cdot15/6=140$. Finally $F(10)=10\cdot11\cdot21/6=385$.'
          - problem: 'Let $F(n)=\frac{n(n+1)(2n+1)}{6}$. Take $n=6$. (a) Give $F(6)$. (b) Give $\frac{(n+1)(n+2)(2n+3)}{6}$. (c) Give the value in the second part minus the value in the first part.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 91; b = 140; c = 49'
            solution_sketch: 'We get $F(6)=6\cdot7\cdot13/6=91$. The value in (b) is $7\cdot8\cdot15/6=140$. The difference is 140-91 = 49, which equals $7^2$, the new term $(n+1)^2$.'
          - problem: 'Test the formula $G(n)=\frac{n^2(n+1)}{2}$ against $\sum_{j=1}^{n} j^2$. Give 1 if the two values are equal and 0 if not. (a) $n=1$. (b) $n=2$. (c) $n=3$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 0; c = 0'
            solution_sketch: 'For $n=1$ both values are 1, so a is 1. For $n=2$ the sum is 5 and $G(2)=6$, so b is 0. For $n=3$ the sum is 14 and $G(3)=18$, so c is 0.'
          # source: FoM exercise 3.5-3-45
          - problem: 'Prove: For every natural number $n$ the sum $\sum_{j=1}^{n} 1$ equals $n$.'
            answer_contract: {"kind":"written"}
            answer: 'Use induction on n. The base case is one term equal to 1, and the step adds one more term equal to 1.'
            solution_sketch: 'Let $P(n)$ be the equation $\sum_{j=1}^{n} 1=n$. For $n=1$ the sum has the single term 1, so $P(1)$ holds. Assume $P(n)$. By Definition 3.61 the sum to $n+1$ is the sum to $n$ plus 1, which is $n+1$. By the Principle of Induction $P(n)$ holds for every $n$.'
          # source: FoM exercise 3.5-3-46
          - problem: 'Let $(S,\cdot)$ be a semigroup with elements $a_j,b_j\in S$. Prove each rule for products. (a) $\prod_{j=1}^{n} a_{j+k}=\prod_{i=k+1}^{k+n} a_i$. (b) For $m<n$: $\prod_{j=1}^{m} a_j\cdot\prod_{j=m+1}^{n} a_j=\prod_{j=1}^{n} a_j$. (c) If $\cdot$ is commutative and $\sigma$ is a bijection of $\{1,\dots,n\}$, then $\prod_{j=1}^{n} a_j=\prod_{j=1}^{n} a_{\sigma(j)}$. (d) If $\cdot$ is commutative, then $\prod_{j=1}^{n} (a_jb_j)=\big(\prod_{j=1}^{n} a_j\big)\big(\prod_{j=1}^{n} b_j\big)$.'
            answer_contract: {"kind":"written"}
            answer: 'Copy the proofs of the sum rules with products: induction on n, remove the last factor, and use commutativity in parts (c) and (d).'
            solution_sketch: 'Each part repeats a proof for sums. Parts (a) and (b) use induction on $n$ and split off the last factor. Part (c) uses induction on $n$ and moves the factor with index $n+1$ to the end by commutativity. Part (d) uses induction on $n$ and regroups four factors by commutativity and associativity. The base case $n=1$ is trivial in every part.'
        constraints: 'evaluate sums term by term and check the induction step for sums of squares'
      - id: kp3
        name: 'Theorem 3.64 to Theorem 3.68: shifting, splitting, reordering and scaling sums'
        key_prerequisites: [fom-3-4-induction]
        exemplars:
          - problem: 'Let $a_i=i^2$. (a) Give $\sum_{j=1}^{3} a_{j+2}$. (b) Give $\sum_{i=3}^{5} a_i$. (c) Give $\sum_{j=1}^{4} a_{j+3}$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 50; b = 50; c = 126'
            solution_sketch: 'In (a) the terms are $a_3,a_4,a_5$, which are 9, 16, 25, and the sum is 50. Part (b) has the same terms, so it is 50. In (c) the terms are 16, 25, 36, 49 and the sum is 126.'
          - problem: 'Let $a_j=3j$. (a) Give $\sum_{j=1}^{4} a_j$. (b) Give $\sum_{j=5}^{7} a_j$. (c) Give $\sum_{j=1}^{7} a_j$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 30; b = 54; c = 84'
            solution_sketch: 'We get $3(1+2+3+4)=30$ and $3(5+6+7)=54$. The two sums join to the full sum 30+54 = 84.'
          - problem: 'Use $\sum_{j=1}^{5} j=15$. (a) Give $\sum_{j=1}^{5} 4j$. (b) Give $\sum_{j=1}^{5} (j+4)$. (c) Give $\sum_{j=1}^{5} 4$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 60; b = 35; c = 20'
            solution_sketch: 'A constant factor leaves the sum, so (a) is $4\cdot15=60$. Five terms equal to 4 add to 20, so (c) is 20. Then (b) is 15+20 = 35.'
          - problem: 'In $(\mathbb{Z},+)$ let $na$ be the sum of $n$ terms equal to $a$. Let $a=3$. (a) Give $6a$. (b) Give $(2+5)a$. (c) Give $2a+5a$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 18; b = 21; c = 21'
            solution_sketch: 'Six terms equal to 3 add to 18. Seven terms equal to 3 add to 21, so (b) is 21. Also $2a+5a=6+15=21$.'
          - problem: 'Let $a_1,a_2,a_3,a_4$ be $4,7,1,9$ and let $b_1,b_2,b_3,b_4$ be $1,2,3,4$. Let $\sigma(1)=3$, $\sigma(2)=1$, $\sigma(3)=4$, $\sigma(4)=2$. (a) Give $\sum_{j=1}^{4} a_{\sigma(j)}$. (b) Give $\sum_{j=1}^{4} a_j$. (c) Give $\sum_{j=1}^{4} (a_j+b_j)$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 21; b = 21; c = 31'
            solution_sketch: 'In (a) the terms are $a_3,a_1,a_4,a_2$, which are 1, 4, 9, 7, and the sum is 21. Part (b) uses the same numbers, so it is 21. Part (c) adds the sum of the $b_j$, which is 10, so it is 31.'
          - problem: 'Let $a_j=j$ and $b_j=2^j$. (a) Give $\sum_{j=1}^{4} a_j$. (b) Give $\sum_{j=1}^{4} b_j$. (c) Give $\sum_{j=1}^{4} (a_j+b_j)$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 10; b = 30; c = 40'
            solution_sketch: 'We get 1+2+3+4 = 10 and 2+4+8+16 = 30. The sum of the terms $a_j+b_j$ is the sum of the two sums, which is 40.'
          # argument: Theorem 3.64
          - problem: 'Prove: Let $(S,+)$ be a semigroup with elements $a_j\in S$ and let $k\in\mathbb{N}$. For every $n\in\mathbb{N}$ we have $\sum_{j=1}^{n} a_{j+k}=\sum_{i=k+1}^{k+n} a_i$.'
            answer_contract: {"kind":"written"}
            answer: 'Use induction on n and split off the last term. The base case is one term a(k+1) on both sides.'
            solution_sketch: 'Use induction on $n$, as in Example 3.47. For $n=1$ both sides equal $a_{k+1}$. Assume the equation for $n$. By Definition 3.61 remove the final term of the sum to $n+1$. The induction hypothesis turns the rest into the right-hand sum to $k+n$, and the last term is $a_{k+n+1}$. Join the two parts to get the right-hand sum to $k+n+1$.'
          # source: FoM exercise 3.5-3-42
          - problem: 'Prove: Let $(S,+)$ be a semigroup with elements $a_j\in S$ and let $m<n$. Then $\sum_{j=1}^{m} a_j+\sum_{j=m+1}^{n} a_j=\sum_{j=1}^{n} a_j$.'
            answer_contract: {"kind":"written"}
            answer: 'Fix m and use induction on n. Split off the last term of each sum and regroup with associativity.'
            solution_sketch: 'This is part 2 of Theorem 3.64. Fix $m$ and induct on $n$, starting at $n=m+1$. For $n=m+1$ the second sum is the single term $a_{m+1}$, and Definition 3.61 gives the equation. Assume the equation for $n$. Remove the final term of the sum to $n+1$ and of the sum from $m+1$ to $n+1$. Use the hypothesis and associativity of $+$ to regroup.'
          # argument: Theorem 3.65
          - problem: 'Prove: Let $(S,+)$ be a commutative semigroup, let $a_1,\dots,a_n\in S$ and let $\sigma$ be a bijection of $\{1,\dots,n\}$. Then $\sum_{j=1}^{n} a_{\sigma(j)}=\sum_{j=1}^{n} a_j$.'
            answer_contract: {"kind":"written"}
            answer: 'Use induction on n. Pull the term with index n+1 to the end with commutativity, then use the hypothesis on a smaller bijection.'
            solution_sketch: 'Induct on $n$. For $n=1$ there is only one bijection. Let $\sigma$ be a bijection of $\{1,\dots,n+1\}$. If $\sigma(n+1)=n+1$, remove the final term and use the hypothesis. Otherwise pick $i$ with $\sigma(i)=n+1$ and split the sum at $i$ with Theorem 3.64. Commutativity moves $a_{n+1}$ to the end, and the other indices form a bijection $\tau$ of $\{1,\dots,n\}$, so the hypothesis applies.'
          # source: FoM exercise 3.5-3-43
          - problem: 'Prove: Let $(S,+)$ be a commutative semigroup with elements $a_j,b_j\in S$. Then $\sum_{j=1}^{n} (a_j+b_j)=\sum_{j=1}^{n} a_j+\sum_{j=1}^{n} b_j$.'
            answer_contract: {"kind":"written"}
            answer: 'Use induction on n. Split off the last term, apply the hypothesis, and regroup four terms with associativity and commutativity.'
            solution_sketch: 'This is part 2 of Theorem 3.65. For $n=1$ both sides equal $a_1+b_1$. Assume the equation for $n$. By Definition 3.61 and the hypothesis, the left side for $n+1$ becomes $(\sum a_j+\sum b_j)+(a_{n+1}+b_{n+1})$. Commutativity and associativity regroup this to $(\sum a_j+a_{n+1})+(\sum b_j+b_{n+1})$. This term equals the two sums for $n+1$.'
          # argument: Theorem 3.66
          - problem: 'Prove: Let $(S,+)$ be a semigroup with a second operation $\cdot$ that is distributive over $+$. Let $c\in S$ and $a_j\in S$. Then $\sum_{j=1}^{n} c\,a_j=c\sum_{j=1}^{n} a_j$ for every $n\in\mathbb{N}$.'
            answer_contract: {"kind":"written"}
            answer: 'Use induction on n. Split off the last term and use the distributive law once.'
            solution_sketch: 'Use induction on $n$, with the same plan as for Theorem 3.64. For $n=1$ both sides equal $c\,a_1$. Assume the equation for $n$ and let $s$ be the sum of the $a_j$ to $n$. By Definition 3.61 the left side for $n+1$ is $\sum c\,a_j+c\,a_{n+1}$. The hypothesis replaces the first part by $c\,s$. The distributive law gives $c\,s+c\,a_{n+1}=c(s+a_{n+1})$.'
          # source: FoM exercise 3.5-3-44
          - problem: 'Prove that constants pull out of a sum. Let $(S,+)$ be a semigroup. Let $\cdot$ be an operation on $S$ that is distributive over $+$. Let $c,a_1,\dots,a_n\in S$. Show that $c\,(a_1+\dots+a_n)$ equals the sum of the products $c\,a_j$.'
            answer_contract: {"kind":"written"}
            answer: 'Induct on n. The step needs only c(s + a) = c s + c a for the sum s of the first n terms.'
            solution_sketch: 'This is Theorem 3.66. For $n=1$ both sides equal $c\,a_1$. Assume the rule for $n$. Write the sum of $n+1$ terms as $s+a_{n+1}$, where $s$ is the sum of the first $n$ terms. The distributive law gives $c(s+a_{n+1})=c\,s+c\,a_{n+1}$. The hypothesis turns $c\,s$ into the sum of the first $n$ products.'
          # argument: Theorem 3.68
          - problem: 'Prove: Let $(S,+)$ be a semigroup, let $a\in S$ and $m,n\in\mathbb{N}$. Here $na$ is the sum of $n$ terms equal to $a$. Then $(m+n)a=ma+na$.'
            answer_contract: {"kind":"written"}
            answer: 'Write (m+n)a as a sum of m+n terms equal to a. Split it after the m-th term with the splitting rule.'
            solution_sketch: 'By Definition 3.67, $(m+n)a$ is a sum of $m+n$ terms equal to $a$. Part 2 of Theorem 3.64 splits it into the first $m$ terms and the last $n$ terms. The first block is $ma$. Part 1 of Theorem 3.64 shifts the index of the last block, so it is $na$. Hence $(m+n)a=ma+na$.'
          # argument: Theorem 3.68
          - problem: 'Prove: Let $(S,+)$ be a semigroup with commutative operation $+$, let $a,b\in S$ and $n\in\mathbb{N}$. Then $n(a+b)=na+nb$.'
            answer_contract: {"kind":"written"}
            answer: 'Write n(a+b) as a sum of n terms a+b. Then split this sum into the sum of n terms a and the sum of n terms b.'
            solution_sketch: 'By Definition 3.67, $n(a+b)$ is the sum of $n$ terms equal to $a+b$. Part 2 of Theorem 3.65 splits this sum into the sum of $n$ terms equal to $a$ and the sum of $n$ terms equal to $b$. These sums are $na$ and $nb$. Hence $n(a+b)=na+nb$. The commutativity of $+$ is the hypothesis of Theorem 3.65.'
          # source: FoM exercise 3.5-3-48
          - problem: 'Multiplication is distributive over addition when $a(b+c)=ab+ac$ and $(b+c)a=ba+ca$. Write the two equations for addition being distributive over multiplication. Test them for $a=1$, $b=2$, $c=3$ on the natural numbers.'
            answer_contract: {"kind":"written"}
            answer: 'a+(b*c) = (a+b)*(a+c) and (b*c)+a = (b+a)*(c+a). For 1, 2, 3 we get 1+6 = 7 but 3*4 = 12, so they fail.'
            solution_sketch: 'Multiplication is distributive over addition when $a(b+c)=ab+ac$ and $(b+c)a=ba+ca$. Swap the two operations in both equations. This gives $a+bc=(a+b)(a+c)$ and $bc+a=(b+a)(c+a)$. For $a=1$, $b=2$, $c=3$ the left side is 7 and the right side is 12. So the equations fail for these numbers.'
        constraints: 'the rules for shifting, splitting, reordering and scaling a sum, and the multiple na'
      - id: kp4
        name: 'Definition 3.69, Definition 3.70 and Theorem 3.71: products and powers'
        key_prerequisites: []
        exemplars:
          - problem: '(a) Give $\prod_{j=1}^{4} j$. (b) Give $\prod_{j=1}^{3} 2j$. (c) Give $\prod_{j=2}^{4} (j+1)$.'
