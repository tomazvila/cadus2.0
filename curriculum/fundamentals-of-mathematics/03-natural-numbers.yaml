      - id: kp1
        name: 'Definition 3.25 to Example 3.30: associative and commutative operations'
        key_prerequisites: [fom-3-1-arithmetic-natural-numbers, binary-operations]
        exemplars:
          - problem: 'Compute with integers. (a) Compute $(10-4)-3$. (b) Compute $10-(4-3)$. (c) Give 1 if the two results are equal and 0 if they differ.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 3; b = 9; c = 0'
            solution_sketch: 'First, $10-4=6$ and $6-3=3$, so (a) is 3. Next, $4-3=1$ and $10-1=9$, so (b) is 9. The results 3 and 9 differ, so (c) is 0.'
          - problem: 'Give each truth value as 1 for true and 0 for false. (a) Subtraction of integers is associative. (b) Multiplication of natural numbers is associative. (c) Subtraction of integers is commutative. (d) Addition of natural numbers is commutative.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}}]}
            answer: 'a = 0; b = 1; c = 0; d = 1'
            solution_sketch: 'Subtraction fails both laws: $(10-4)-3=3$ but $10-(4-3)=9$, and $5-3=2$ but $3-5=-2$. So (a) and (c) are 0. Multiplication is associative and addition is commutative, so (b) and (d) are 1.'
          - problem: 'On the integers, let $a\circ b=3a+b$. (a) Compute $2\circ 5$. (b) Compute $5\circ 2$. (c) Give 1 if $\circ$ is commutative and 0 if it is not.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 11; b = 17; c = 0'
            solution_sketch: 'We have $2\circ 5=6+5=11$ and $5\circ 2=15+2=17$. The two results differ, so one pair breaks the law. Hence $\circ$ is not commutative and (c) is 0.'
          - problem: 'On the integers, let $a\circ b=2a+b$. (a) Compute $(1\circ 2)\circ 3$. (b) Compute $1\circ(2\circ 3)$. (c) Give 1 if $\circ$ is associative and 0 if it is not.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 11; b = 9; c = 0'
            solution_sketch: 'First, $1\circ 2=4$ and $4\circ 3=8+3=11$. Next, $2\circ 3=7$ and $1\circ 7=2+7=9$. The results 11 and 9 differ, so $\circ$ is not associative and (c) is 0.'
          - problem: 'Let $S=\{1,2,3\}$. Let $f$ send $1,2,3$ to $2,3,1$. Let $g$ send $1,2,3$ to $1,3,2$. (a) Compute $(f\circ g)(1)$. (b) Compute $(g\circ f)(1)$. (c) Give 1 if $f\circ g=g\circ f$ and 0 if not.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 2; b = 3; c = 0'
            solution_sketch: 'Apply $g$ first. We get $g(1)=1$, then $f(1)=2$, so (a) is 2. Next, $f(1)=2$, then $g(2)=3$, so (b) is 3. The values differ, so the two functions do not commute and (c) is 0.'
          - problem: 'On the natural numbers, let $a\circ b=a^b$. (a) Compute $(2\circ 2)\circ 3$. (b) Compute $2\circ(2\circ 3)$. (c) Give 1 if $\circ$ is associative and 0 if it is not.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 64; b = 256; c = 0'
            solution_sketch: 'First, $2\circ 2=4$ and $4^3=64$. Next, $2\circ 3=8$ and $2^8=256$. The results 64 and 256 differ, so $\circ$ is not associative and (c) is 0.'
          - problem: 'On $\{0,1,2,3\}$, let $a\circ b=|a-b|$. (a) Count the ordered pairs $(x,y)$ with $x\circ y=y\circ x$. (b) Count the ordered triples $(x,y,z)$ with $(x\circ y)\circ z\ne x\circ(y\circ z)$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}}]}
            answer: 'a = 16; b = 10'
            solution_sketch: 'Since $|x-y|=|y-x|$, all 16 ordered pairs commute. For (b), check all 64 triples. The 10 triples that fail are $(1,1,2)$, $(1,1,3)$, $(1,2,3)$, $(2,1,1)$, $(2,1,3)$, $(2,2,3)$, $(3,1,1)$, $(3,1,2)$, $(3,2,1)$ and $(3,2,2)$.'
          # source: FoM exercise 3.3-3-24
          - problem: 'For each operation, count how many of the two laws (associative and commutative) it obeys; the count is 0, 1 or 2. If some result of the operation lies outside the set, the operation does not exist on that set; give 0. (a) Union on the power set $P(A)$. (b) Intersection on $P(A)$. (c) The AND operation on propositions. (d) The OR operation on propositions. (e) Subtraction on the integers. (f) Division on the nonzero rationals. (g) Composition of injective functions from $\mathbb{N}$ to $\mathbb{N}$. (h) Composition of surjective functions from $\mathbb{N}$ to $\mathbb{N}$. (i) Composition of functions from $\mathbb{N}$ to $\mathbb{N}$ that are injective or surjective.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}},{"name":"e","contract":{"kind":"exact"}},{"name":"f","contract":{"kind":"exact"}},{"name":"g","contract":{"kind":"exact"}},{"name":"h","contract":{"kind":"exact"}},{"name":"i","contract":{"kind":"exact"}}]}
            answer: 'a=2;b=2;c=2;d=2;e=0;f=0;g=1;h=1;i=0'
            solution_sketch: 'Union, intersection, AND and OR obey both laws, so (a) to (d) are 2. Subtraction has $(10-4)-3=3$ against $10-(4-3)=9$, and division has $(8/4)/2=1$ against $8/(4/2)=4$, so (e) and (f) are 0. Composition is associative, but $n+1$ and $2n$ give $2n+1$ and $2n+2$, so (g) is 1. For (h), $\lceil n/2\rceil$ and the shift down by 1 do not commute, so (h) is 1. For (i), the shift up by 1 after a map with $1\mapsto 1$ and $n\mapsto n-1$ is neither injective nor surjective, so (i) is 0.'
          # source: FoM exercise 3.3-3-16
          - problem: 'Study composition on $F(S,S)$, the set of all functions from a set $S$ to itself. (a) Prove that the composite of two members of $F(S,S)$ is again a member of $F(S,S)$. (b) For functions $h:A\to B$, $g:B\to C$ and $f:C\to D$, prove that $f\circ(g\circ h)=(f\circ g)\circ h$, and deduce that composition is associative on $F(S,S)$. (c) Give a set $S$ and two functions $f,g$ on $S$ with $f\circ g\ne g\circ f$. (d) Find a function $e$ in $F(S,S)$ with $e\circ f=f=f\circ e$ for every $f$ in $F(S,S)$.'
            answer_contract: {"kind":"written"}
            answer: 'Compare both sides at each point x, and take the identity map as neutral. On a two-point set, a constant map and a swap map do not commute.'
            solution_sketch: 'For (a), the composite sends each point of $S$ to exactly one point of $S$. For (b), both sides send each $x$ in $A$ to $f(g(h(x)))$, so the two functions are equal. For (c), let $S=\{1,2\}$, let $c$ send both points to 1, and let $s$ swap the points. Then $(c\circ s)(2)=1$ but $(s\circ c)(2)=2$. For (d), the identity function $e(x)=x$ is neutral.'
          # source: FoM exercise 3.3-3-22
          - problem: 'Let $R$ be the set of all rotations of a cube about its center after which every face of the cube again faces along an axis. Write $r_2\circ r_1$ for the rotation $r_1$ followed by the rotation $r_2$. (a) Prove that $r_2\circ r_1$ is again a member of $R$, so $\circ$ is a binary operation on $R$. (b) Prove that $\circ$ is not commutative.'
            answer_contract: {"kind":"written"}
            answer: 'The composite of two such rotations keeps every face on an axis. A quarter turn about x then about y differs from y then x.'
            solution_sketch: 'For (a), each rotation of $R$ moves the six faces onto the six faces. The composite does the same, so it lies in $R$. For (b), let $a$ be the quarter turn about the x-axis and $b$ the quarter turn about the y-axis. The face on the positive z-axis goes to the negative y-axis under $a$ then $b$. It goes to the positive x-axis under $b$ then $a$, so $b\circ a\ne a\circ b$.'
          # source: FoM exercise 3.3-3-29
          - problem: 'Each phrase below has two readings. The reading depends on which two neighboring words you group. For each phrase, give both readings. (a) canned food drive (b) tall book box (c) artificial fruit flavor (d) good test problem (e) new mathematics teacher (f) old school approach'
            answer_contract: {"kind":"written"}
            answer: 'Group the first two words, or group the last two words. For example, (artificial fruit) flavor differs from artificial (fruit flavor).'
            solution_sketch: 'In (a), a drive for canned food differs from a drive done with cans. In (b), a tall box for books differs from a box for tall books. In (c), a flavor of fake fruit differs from a fake flavor of fruit. In (d), a problem for good tests differs from a good problem for tests. In (e), a teacher of new mathematics differs from a new teacher of mathematics. In (f), an approach of an old school differs from an old-style approach to school.'
        constraints: 'Decide associativity and commutativity of an operation by computing both sides on given inputs.'
      - id: kp2
        name: 'Definition 3.31 to Proposition 3.38: neutral elements and distributivity'
        key_prerequisites: [fom-3-1-arithmetic-natural-numbers, binary-operations]
        exemplars:
          - problem: 'Work with the natural numbers. (a) Compute $7\cdot(4+5)$. (b) Compute $7\cdot 4+7\cdot 5$. (c) Compute $1\cdot 12$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 63; b = 63; c = 12'
            solution_sketch: 'First, $4+5=9$ and $7\cdot 9=63$, so (a) is 63. Next, $7\cdot 4+7\cdot 5=28+35=63$, so (b) is 63. The number 1 is neutral for multiplication, so $1\cdot 12=12$ and (c) is 12.'
          - problem: 'The natural numbers start at 1. (a) Give the neutral element of multiplication of natural numbers. (b) Count the neutral elements of addition of natural numbers. (c) Give the neutral element of the operation $a\circ b=\max(a,b)$ on $\{2,3,4,5\}$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 0; c = 2'
            solution_sketch: 'For (a), $1\cdot a=a=a\cdot 1$, so the element is 1. For (b), $e+a=a$ is impossible for every $a$ in the natural numbers, so the count is 0. For (c), $\max(2,a)=a$ for every $a$ in the set, so the element is 2.'
          - problem: 'On the integers, let $a\circ b=a+b-3$. (a) Give the neutral element $e$ of $\circ$. (b) Compute $5\circ 7$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}}]}
            answer: 'a = 3; b = 9'
            solution_sketch: 'The element $e$ must obey $e+a-3=a$ for every $a$. This forces $e=3$. Then $5\circ 7=5+7-3=9$, so $b=9$.'
          - problem: 'On the set $\{1,2,3,4\}$, count the neutral elements of each operation. (a) $a\circ b=\max(a,b)$. (b) $a\circ b=\min(a,b)$. (c) $a\circ b=a$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 1; c = 0'
            solution_sketch: 'For $\max$, only 1 gives $\max(1,a)=a$ for all $a$, so (a) is 1. For $\min$, only 4 gives $\min(4,a)=a$ for all $a$, so (b) is 1. For $a\circ b=a$, we get $e\circ a=e$, which differs from $a$ when $a\ne e$. So (c) is 0.'
          - problem: 'On the integers, let $\cdot$ be multiplication and $+$ be addition. (a) Compute $3+(4\cdot 5)$. (b) Compute $(3+4)\cdot(3+5)$. (c) Give 1 if $+$ is left distributive over $\cdot$ and 0 if it is not.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 23; b = 56; c = 0'
            solution_sketch: 'First, $4\cdot 5=20$ and $3+20=23$. Next, $3+4=7$, $3+5=8$ and $7\cdot 8=56$. The results 23 and 56 differ, so addition is not distributive over multiplication and (c) is 0.'
          - problem: 'Let $x=1$, $y=2$, $z=3$ and $u=4$ be natural numbers. (a) Compute $(x+y)(z+u)$. (b) Compute $xz+xu$. (c) Compute $yz+yu$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 21; b = 7; c = 14'
            solution_sketch: 'First, $(1+2)(3+4)=3\cdot 7=21$. Next, $xz+xu=3+4=7$. Then $yz+yu=6+8=14$. The sum $7+14=21$ agrees with (a).'
          # source: FoM exercise 3.3-3-25
          - problem: 'For each pair of operations, count how many of the two operations are distributive over the other one. (a) Addition and multiplication of natural numbers. (b) Union and intersection on a power set $P(A)$. (c) AND and OR on propositions.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 2; c = 2'
            solution_sketch: 'In (a), multiplication is distributive over addition, but addition is not distributive over multiplication, so the count is 1. In (b), union is distributive over intersection and intersection is distributive over union, so the count is 2. In (c), AND and OR distribute over each other, so the count is 2.'
          # argument: Theorem 3.34
          - problem: 'Prove: addition on $\mathbb{N}$ is associative and commutative, so $(\mathbb{N},+)$ is a commutative semigroup.'
            answer_contract: {"kind":"written"}
            answer: 'Associativity and commutativity of addition are the two laws that define a commutative semigroup.'
            solution_sketch: 'Proposition 3.6 gives $(n+m)+k=n+(m+k)$ for all $n,m,k$. It also gives $n+m=m+n$ for all $n,m$. Addition is a binary operation on $\mathbb{N}$. These three facts show that $(\mathbb{N},+)$ is a commutative semigroup.'
          # argument: Theorem 3.34
          - problem: 'Prove: $(\mathbb{N},\cdot)$ is a commutative semigroup with neutral element $1$.'
            answer_contract: {"kind":"written"}
            answer: 'Multiplication is associative and commutative by the known laws. Also n times 1 equals n, and commutativity gives 1 times n equals n.'
            solution_sketch: 'Proposition 3.12 gives associativity and commutativity of multiplication. The definition of multiplication gives $n\cdot 1=n$. Commutativity then gives $1\cdot n=n$. So 1 is a neutral element.'
          # argument: Theorem 3.34
          - problem: 'Prove: multiplication is distributive over addition on $\mathbb{N}$.'
            answer_contract: {"kind":"written"}
            answer: 'Left distributivity and right distributivity are known facts. Together they give distributivity.'
            solution_sketch: 'Proposition 3.14 gives $n\cdot(m+k)=n\cdot m+n\cdot k$. Proposition 3.13 gives $(n+m)\cdot k=n\cdot k+m\cdot k$. By the definition, an operation is distributive when it is left and right distributive.'
          # argument: Proposition 3.35
          - problem: 'Prove: a semigroup $(S,\circ)$ has at most one neutral element.'
            answer_contract: {"kind":"written"}
            answer: 'Let e and f be neutral elements. Compute the product of e and f in two ways: it equals e and it equals f.'
            solution_sketch: 'Let $e$ and $f$ both be neutral. Since $f$ is neutral, $e\circ f=e$. Since $e$ is neutral, $e\circ f=f$. Hence $e=f$.'
          # argument: Proposition 3.38
          - problem: 'Prove: assume $(S,+)$ is a commutative semigroup, and $\cdot$ is an associative operation on $S$ that distributes over $+$. Then $(x+y)(z+u)=(xz+yz)+(xu+yu)$ for all $x,y,z,u$ in $S$.'
            answer_contract: {"kind":"written"}
            answer: 'Apply left distributivity to the factor x+y, then right distributivity to each summand.'
            solution_sketch: 'By left distributivity, $(x+y)(z+u)=(x+y)z+(x+y)u$. By right distributivity, $(x+y)z=xz+yz$ and $(x+y)u=xu+yu$. Put these together. The result is $(xz+yz)+(xu+yu)$.'
          # source: FoM exercise 3.3-3-17
          - problem: 'Assume $(S,+)$ is a commutative semigroup, and $\cdot$ is an associative operation on $S$ that distributes over $+$. Prove that $(x+y)(z+u)=(xz+xu)+(yz+yu)$ for all $x,y,z,u$ in $S$.'
            answer_contract: {"kind":"written"}
            answer: 'Expand with both distributive laws. Then swap the middle two summands with commutativity and associativity of addition.'
            solution_sketch: 'Expand $(x+y)(z+u)$ as $(xz+yz)+(xu+yu)$ with both distributive laws, as in Proposition 3.38. Swap $yz$ and $xu$ using commutativity and associativity of $+$. The result is $(xz+xu)+(yz+yu)$. The natural numbers case is Proposition 3.15.'
          # source: FoM exercise 3.3-3-21
          - problem: 'Prove that no natural number $n$ other than $1$ has a natural number $m$ with $nm=1$.'
            answer_contract: {"kind":"written"}
            answer: 'Since m is at least 1, the product nm is at least n. For n larger than 1 this gives nm larger than 1.'
            solution_sketch: 'Take $n>1$ and any $m\ge 1$. Then $nm\ge n\cdot 1=n$ by Theorem 3.24. Since $n>1$, we get $nm>1$. So $nm=1$ is impossible.'
          # source: FoM exercise 3.3-3-23
          - problem: 'For $x,y$ in $[-1,1]$ define $x\oplus y=\frac{x+y}{2}$ when $x\ne 0$ and $y\ne 0$. Define $x\oplus y=x$ when $y=0$, and $x\oplus y=y$ when $x=0$. Use ordinary multiplication $\cdot$. Prove five facts. (a) $\oplus$ is commutative. (b) $0$ is neutral for $\oplus$. (c) Each $x$ has a $y$ with $x\oplus y=0$. (d) $\cdot$ is associative and commutative with neutral element $1$. (e) $\oplus$ is not associative.'
            answer_contract: {"kind":"written"}
            answer: 'Check each law case by case on zero and nonzero inputs. For (e), compare the two groupings of 1, 1 and minus 1.'
            solution_sketch: 'For (a), the formula is symmetric in $x$ and $y$ in each case. For (b), the rules for $y=0$ and $x=0$ give $x\oplus 0=x=0\oplus x$. For (c), take $y=-x$: then $x\oplus(-x)=0$ for $x\ne 0$, and $0\oplus 0=0$. For (d), use the laws of real numbers. For (e), $(1\oplus 1)\oplus(-1)=1\oplus(-1)=0$ but $1\oplus(1\oplus(-1))=1\oplus 0=1$.'
        constraints: 'Find neutral elements, count them, and test distributive laws by computing both sides.'
      - id: kp3
        name: 'Definition 3.39 to Proposition 3.42: partial operations and subtraction'
        key_prerequisites: [fom-3-2-ordering-natural-numbers, fom-3-1-arithmetic-natural-numbers]
        exemplars:
          - problem: 'The natural numbers start at 1. The difference $m-n$ exists only when $n<m$. (a) Compute $17-9$. (b) Give the number $d$ with $5+d=21$. (c) Give 1 if $6-9$ exists and 0 if it does not.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 8; b = 16; c = 0'
            solution_sketch: 'For (a), $9+8=17$, so the difference is 8. For (b), $5+16=21$, so $d=16$. For (c), $6<9$ is true but the order is wrong: $9<6$ is false, so $6-9$ does not exist and (c) is 0.'
          - problem: 'Subtraction is defined on the pairs $(m,n)$ of natural numbers with $n<m$. Take the pairs with $m,n\in\{1,2,3,4,5\}$. (a) Count the pairs for which $m-n$ exists. (b) Count the pairs for which $m-n$ exists and equals 2.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}}]}
            answer: 'a = 10; b = 3'
            solution_sketch: 'A pair needs $n<m$. We pick 2 different numbers out of 5 and put the larger one first, which gives 10 pairs. The pairs with $m-n=2$ are $(3,1)$, $(4,2)$ and $(5,3)$, which makes 3.'
          - problem: 'Count the pairs $(n,m)$ with $n,m\in\{1,2,3,4\}$. (a) Count the pairs with $n+m=5$. (b) Count the pairs with $n\cdot m=12$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}}]}
            answer: 'a = 4; b = 2'
            solution_sketch: 'The pairs with sum 5 are $(1,4)$, $(2,3)$, $(3,2)$ and $(4,1)$, so (a) is 4. The pairs with product 12 are $(3,4)$ and $(4,3)$, so (b) is 2.'
          - problem: 'Let $n=4$ and $m=11$. (a) Give the number $d$ with $n+d=m$. (b) Count the natural numbers $d$ with $n+d=m$. (c) Compute $(m-n)+n$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 7; b = 1; c = 11'
            solution_sketch: 'We have $4+7=11$, so $d=7$ and (a) is 7. Only one number works, so (b) is 1. Then $(m-n)+n=7+4=11$, so (c) is 11.'
          - problem: 'Let $m=10$, $n=3$, $x=9$ and $y=4$. (a) Compute $(m+x)-(n+y)$. (b) Compute $m-n$. (c) Compute $x-y$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 12; b = 7; c = 5'
            solution_sketch: 'First, $m+x=19$ and $n+y=7$, so $19-7=12$. Next, $m-n=10-3=7$. Then $x-y=9-4=5$. Note that $7+5=12$.'
          - problem: 'Let $m=8$, $n=5$ and $x=6$. (a) Compute $mx$. (b) Compute $nx$. (c) Compute $mx-nx$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 48; b = 30; c = 18'
            solution_sketch: 'We have $mx=8\cdot 6=48$ and $nx=5\cdot 6=30$. Then $mx-nx=48-30=18$. This agrees with $(m-n)x=3\cdot 6=18$.'
          - problem: 'Let $n=2$, $m=5$ and $x=11$. Let $y$ be the natural number with $n+x=m+y$. (a) Give $y$. (b) Compute $m-n$. (c) Compute $x-y$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 8; b = 3; c = 3'
            solution_sketch: 'We have $n+x=13$, so $5+y=13$ and $y=8$. Then $m-n=5-2=3$ and $x-y=11-8=3$. The two differences agree.'
          # argument: Proposition 3.40
          - problem: 'Prove: let $n,m\in\mathbb{N}$ with $n<m$. Then there is only one number $d$ with $n+d=m$.'
            answer_contract: {"kind":"written"}
            answer: 'Take two such numbers d and e. Then n + d = n + e, and cancellation of the left summand gives d = e.'
            solution_sketch: 'Let $d$ and $e$ both satisfy $n+d=m$ and $n+e=m$. Then $n+d=n+e$. Proposition 3.17 lets us cancel $n$, so $d=e$.'
          # argument: Proposition 3.42
          - problem: 'Prove: let $n<m$ and $y<x$ in $\mathbb{N}$. Then $n+y<m+x$, and $(m+x)-(n+y)=(m-n)+(x-y)$.'
            answer_contract: {"kind":"written"}
            answer: 'Let d and e be the two differences; regroup to show that (n+y)+(d+e) equals m+x, so d+e is the difference.'
            solution_sketch: 'By Definition 3.41, let $n+d=m$ and $y+e=x$. Regroup with Proposition 3.6: $(n+y)+(d+e)=((n+y)+d)+e=(n+(y+d))+e=(n+(d+y))+e=((n+d)+y)+e=(m+y)+e=m+(y+e)=m+x$. So $n+y<m+x$. The difference is $d+e=(m-n)+(x-y)$.'
          # source: FoM exercise 3.3-3-18
          - problem: 'Let $n<m$ and $y<x$ in $\mathbb{N}$. (a) Prove that $nx<mx$ and $mx-nx=(m-n)x$. (b) Prove that $n+x=m+y$ implies $m-n=x-y$.'
            answer_contract: {"kind":"written"}
            answer: 'Write m = n + d, so distributivity gives mx = nx + dx. For part b, cancel n from n + x = n + d + y to get x = d + y.'
            solution_sketch: 'These are parts 2 and 3 of Proposition 3.42. Let $d=m-n$ by Definition 3.41. For (a), Proposition 3.13 gives $mx=(n+d)x=nx+dx$, so $nx<mx$ and $mx-nx=dx=(m-n)x$. For (b), $n+x=m+y=(n+d)+y=n+(d+y)$. Proposition 3.17 gives $x=d+y$. So $x-y=d=m-n$.'
          # source: FoM exercise 3.3-3-26
          - problem: 'Treat addition as a map that takes a pair of natural numbers to a natural number. Prove that this map is not injective and not surjective.'
            answer_contract: {"kind":"written"}
            answer: 'The pairs (1,2) and (2,1) both go to 3. The value 1 is never a sum, because each sum is a successor and 1 is no successor.'
            solution_sketch: 'Take the pairs $(1,2)$ and $(2,1)$. Both have the sum 3, so the function is not injective. Every sum $n+m$ is a successor, since $n+1=n''$ and $n+m''=(n+m)''$. The number 1 is no successor. So the value 1 has no preimage and the map is not surjective.'
          # source: FoM exercise 3.3-3-27
          - problem: 'Treat multiplication as a map that takes a pair of natural numbers to a natural number. Prove that this map is surjective and not injective.'
            answer_contract: {"kind":"written"}
            answer: 'The pair (n,1) goes to n for each n. The pairs (1,2) and (2,1) both go to 2.'
            solution_sketch: 'Take any $n$ in $\mathbb{N}$. Then $n\cdot 1=n$, so $(n,1)$ is a preimage of $n$. Hence the function is surjective. The pairs $(1,2)$ and $(2,1)$ both give 2, so the function is not injective.'
          # source: FoM exercise 3.3-3-28
          - problem: 'Let $(S,+)$ be a commutative semigroup. Let $S^+\subseteq S$ be such that, for all $x,y$ in $S$, exactly one of three cases holds: $x=y$, or $x+d=y$ for some $d$ in $S^+$, or $y+d=x$ for some $d$ in $S^+$. Prove these facts. (a) $z+x=z+y$ implies $x=y$. (b) $x+z=y+z$ implies $x=y$. (c) Let also $x+y\in S^+$ for all $x,y\in S^+$. The relation $x\le y$ iff $x=y$ or $x+d=y$ for some $d$ in $S^+$ is a total order on $S$. (d) If $x\le y$, then $x+z\le y+z$. (e) Let $\cdot$ be associative and distributive over $+$, with $xy\in S^+$ for $x,y\in S^+$. If $x\le y$ and $z\in S^+$, then $xz\le yz$. (f) Explain why part (e) needs $z\in S^+$.'
            answer_contract: {"kind":"written"}
            answer: 'Each part follows from the three-case rule and the semigroup laws. In part f, multiplying by 0 or by a negative integer destroys or reverses the order.'
            solution_sketch: 'For (a), suppose $x\ne y$ and let $y=x+d$ with $d$ in $S^+$. Then $z+y=(z+x)+d=(z+y)+d$, so the pair $z+y$ and $z+y$ fits case one and case two at once. That breaks the exactly-one rule, so $x=y$. Part (b) follows from (a) and commutativity. Parts (c) to (e) use closure of $S^+$ under addition, the three cases, Proposition 3.6 and distributivity. For (f), in the integers multiplication by 0 or by a negative number breaks the order.'
        constraints: 'Compute differences of natural numbers and test the rules for differences on numbers.'
      - id: kp4
        name: 'Definition 3.43 to Proposition 3.44: quotients of natural numbers'
        key_prerequisites: [fom-3-1-arithmetic-natural-numbers]
        exemplars:
          - problem: 'The quotient of $n$ and $d$ is the natural number $q$ with $n=dq$, if it exists. (a) Give the quotient of 12 and 4. (b) Give the quotient of 35 and 7. (c) Give 1 if the quotient of 7 and 3 exists and 0 if it does not.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 3; b = 5; c = 0'
            solution_sketch: 'Since $4\cdot 3=12$, (a) is 3. Since $7\cdot 5=35$, (b) is 5. No natural number $q$ has $3q=7$, so the quotient of 7 and 3 does not exist and (c) is 0.'
          - problem: 'A natural number $d$ with $d<24$ has a quotient with 24 when $24=dq$ for some natural number $q$. (a) Count the natural numbers $d<24$ that have a quotient with 24. (b) Give the largest such $d$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}}]}
            answer: 'a = 7; b = 12'
            solution_sketch: 'Each $d$ must be smaller than 24 and divide 24. These are 1, 2, 3, 4, 6, 8 and 12. That gives 7 numbers, and the largest is 12.'
          - problem: 'Let $n=8$, $m=20$ and $d=4$. Write $a/b$ for the quotient of $a$ and $b$. (a) Compute $m/d$. (b) Compute $n/d$. (c) Compute $(m+n)/d$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 5; b = 2; c = 7'
            solution_sketch: 'We have $20/4=5$ and $8/4=2$. The sum is $m+n=28$ and $28/4=7$. This agrees with $5+2=7$.'
          - problem: 'Let $n=12$, $d=4$, $m=20$ and $e=5$. Write $a/b$ for the quotient of $a$ and $b$. (a) Compute $n/d$. (b) Compute $m/e$. (c) Compute $(mn)/(de)$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 3; b = 4; c = 12'
            solution_sketch: 'We have $12/4=3$ and $20/5=4$. Then $mn=240$ and $de=20$, so $(mn)/(de)=12$. This agrees with $3\cdot 4=12$.'
          - problem: 'Let $m=21$, $n=6$ and $d=3$. Write $a/b$ for the quotient of $a$ and $b$. (a) Compute $m/d$. (b) Compute $n/d$. (c) Compute $(m-n)/d$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 7; b = 2; c = 5'
            solution_sketch: 'We have $21/3=7$ and $6/3=2$. Then $m-n=15$ and $15/3=5$. This agrees with $7-2=5$.'
          - problem: 'Let $n=15$, $d=5$, $m=21$ and $e=7$. (a) Compute $ne$. (b) Compute $md$. (c) Give the quotient of $n$ and $d$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 105; b = 105; c = 3'
            solution_sketch: 'We have $ne=15\cdot 7=105$ and $md=21\cdot 5=105$, so the two products agree. The quotient of 15 and 5 is 3. The quotient of 21 and 7 is also 3.'
          # argument: Proposition 3.44
          - problem: 'Prove: let $n,m,d\in\mathbb{N}$ be such that the quotients $n/d$ and $m/d$ exist. Then $(m+n)/d$ exists and equals $m/d+n/d$.'
            answer_contract: {"kind":"written"}
            answer: 'Write n = dq and m = dp. Then m + n = d(p + q) by distributivity, so the quotient is p + q.'
            solution_sketch: 'By Definition 3.43, write $n=dq$ and $m=dp$. Left distributivity from Proposition 3.14 gives $m+n=dp+dq=d(p+q)$. So $(m+n)/d$ exists and equals $p+q=m/d+n/d$.'
          # argument: Proposition 3.44
          - problem: 'Prove: let $n,m,d,e\in\mathbb{N}$ be such that $n/d$ and $m/e$ exist and $ne=md$. Then $n/d=m/e$.'
            answer_contract: {"kind":"written"}
            answer: 'Write n = dq and m = ep. From ne = md get qde = pde, then cancel de to get q = p.'
            solution_sketch: 'By Definition 3.43, write $n=dq$ and $m=ep$. Then $ne=dqe=q(de)$ and $md=epd=p(de)$ by Proposition 3.12. So $q(de)=p(de)$. Cancel the factor $de$ to get $q=p$.'
          # source: FoM exercise 3.3-3-20
          - problem: 'Prove all four parts of the following result. Let $m,n,d,e\in\mathbb{N}$. (1) If $n/d$ and $m/d$ exist, then $(m+n)/d$ exists and equals $m/d+n/d$. (2) If $n/d$ and $m/e$ exist, then $(mn)/(de)$ exists and equals $(m/e)(n/d)$. (3) If $n/d$ and $m/d$ exist and $n<m$, then $(m-n)/d$ exists and equals $m/d-n/d$. (4) If $n/d$ and $m/e$ exist and $ne=md$, then $n/d=m/e$.'
            answer_contract: {"kind":"written"}
            answer: 'Write each number as a product with its quotient. Then use distributivity, commutativity and cancellation of a common factor.'
            solution_sketch: 'Write $n=dq$ and $m=ep$ as in Definition 3.43. This is Proposition 3.44. Part 1 uses Proposition 3.14. Part 2 gives $mn=(de)(pq)$ by Proposition 3.12. Part 3 writes $m=dp$ and $n=dq$, so $p=q+t$ and $m=n+dt$. Part 4 cancels $de$ from $q(de)=p(de)$.'
          # source: FoM exercise 3.3-3-19
          - problem: 'Let $n,d,q,\tilde q\in\mathbb{N}$ with $n=dq$ and $n=d\tilde q$. (a) Prove that $q=\tilde q$. (b) State the set $A$ of pairs on which division is defined. (c) State division as a subset of $(\mathbb{N}\times\mathbb{N})\times\mathbb{N}$.'
            answer_contract: {"kind":"written"}
            answer: 'Cancel the common factor d in dq = d times q-tilde. The set A holds the pairs (n,d) with n = dq for some q, and division sends (n,d) to q.'
            solution_sketch: 'For (a), $dq=d\tilde q$ and cancellation of $d$ give $q=\tilde q$. For (b), $A$ is the set of pairs $(n,d)$ such that some $q$ has $n=dq$. For (c), division is the set of triples $((n,d),q)$ with $n=dq$. By Definition 3.41 and part (a), each pair in $A$ has exactly one value.'
        constraints: 'Compute quotients of natural numbers and test the rules for quotients on numbers.'
