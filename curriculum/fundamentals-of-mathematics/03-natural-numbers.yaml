    knowledge_points:
      - id: kp1
        name: 'Definition 3.90 to Example 3.95: equivalence relations and their classes'
        key_prerequisites: [fom-2-5-axiom-powers-relations-functions, relations-equivalence]
        exemplars:
          # source: FoM exercise 3.7-3-83
          - problem: 'Prove: (a) For natural numbers, let $m\sim n$ when $m$ and $n$ have the same number of distinct prime divisors. This relation is an equivalence relation. (b) The same holds when $m\sim n$ means the same number of prime factors counted with multiplicity.'
            answer_contract: {"kind":"written"}
            answer: 'Both relations compare a number computed from m and n. Equality of numbers is reflexive, symmetric and transitive.'
            solution_sketch: 'Use Definition 3.90 and Example 3.92. Let $f(n)$ be the number of distinct prime divisors of $n$, so $m\sim n$ means $f(m)=f(n)$. Then $f(n)=f(n)$ gives reflexivity. If $f(m)=f(n)$, then $f(n)=f(m)$, which gives symmetry. If $f(m)=f(n)$ and $f(n)=f(k)$, then $f(m)=f(k)$, which gives transitivity. For (b) use Example 3.93 and let $f(n)$ be the count with multiplicity.'
          # source: FoM exercise 3.7-3-84
          - problem: 'Here $\mathbb N$ starts at 1. Prove that each relation is an equivalence relation. Then give its classes. (a) On $\mathbb N$: $m\sim n$ when $2$ divides $m-n$ or $n-m$. (b) On the real numbers with a finite decimal expansion: $a\sim b$ when $a$ and $b$ have the same number of decimal digits after the point. (c) On $\mathbb Z$, for fixed $m$: $a\sim b$ when $m$ divides $b-a$. (d) On $\mathbb N\times\mathbb N$: $(a,b)\sim(c,d)$ when $a+d=b+c$. (e) On $\mathbb N\times\mathbb N$: $(a,b)\sim(c,d)$ when $ad=bc$.'
            answer_contract: {"kind":"written"}
            answer: 'Test the three properties from the formula. The classes are the parity classes, the digit counts, the residues, and the pairs with equal difference or ratio.'
            solution_sketch: 'Use Definition 3.90 for the three properties and Definition 3.94 for the classes. In (a) and (c), the difference $b-a$ is divisible by $m$, so the relation is congruence modulo $m$ and the classes are the residues. In (b), the set holds only numbers with a finite decimal expansion, so the digit count is a function of the number, so equality of counts is an equivalence relation. In (d), $a+d=b+c$ means $a-b=c-d$, so the classes are the pairs with equal difference. In (e), $ad=bc$ means $a/b=c/d$, so the classes are the pairs with equal ratio.'
          - problem: 'Let $R=\{(1,1),(2,2),(3,3),(1,2)\}$ be a relation on the set $\{1,2,3\}$. Give each truth value as 1 for true and 0 for false. (a) $R$ is reflexive. (b) $R$ is symmetric. (c) $R$ is transitive.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 0; c = 1'
            solution_sketch: 'Each of $1$, $2$ and $3$ is related to itself, so $R$ is reflexive and (a) is 1. The pair $(1,2)$ is in $R$ and the pair $(2,1)$ is not, so (b) is 0. No two pairs chain to a new pair, so (c) is 1.'
          - problem: 'Two natural numbers are related when they have the same set of prime divisors. Give each truth value as 1 for true and 0 for false. (a) $12$ and $18$ are related. (b) $45$ and $75$ are related. (c) $6$ and $9$ are related. (d) $1$ and $7$ are related.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 1; c = 0; d = 0'
            solution_sketch: 'The prime divisors of $12$ and $18$ are $2$ and $3$, so (a) is 1. The numbers $45=3^2\cdot 5$ and $75=3\cdot 5^2$ both have $3$ and $5$, so (b) is 1. The number $9$ has only $3$, and $6$ has $2$ and $3$, so (c) is 0. The number $1$ has no prime divisor and $7$ has one, so (d) is 0.'
          - problem: 'Two natural numbers are related when they have the same number of distinct prime divisors. Give each truth value as 1 for true and 0 for false. (a) $12$ and $90$ are related. (b) $30$ and $66$ are related. (c) $7$ and $49$ are related. (d) $1$ and $2$ are related.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}}]}
            answer: 'a = 0; b = 1; c = 1; d = 0'
            solution_sketch: 'The number $12$ has the 2 primes $2$ and $3$, and $90$ has the 3 primes $2$, $3$ and $5$, so (a) is 0. Both $30$ and $66$ have 3 distinct primes, so (b) is 1. Both $7$ and $49$ have 1 prime, so (c) is 1. The number $1$ has 0 primes and $2$ has 1, so (d) is 0.'
          # source: FoM exercise 3.7-3-86
          - problem: 'Give 1 if the relation is an equivalence relation and 0 if it is not. All relations are on $\mathbb N$. (a) $m\sim n$ when $m+n$ is even. (b) $m\sim n$ when $mn$ is even. (c) $m\sim n$ when $m=n+3$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 0; c = 0'
            solution_sketch: 'In (a), $m+n$ is even exactly when $m$ and $n$ have the same parity, and this is reflexive, symmetric and transitive, so the value is 1. In (b), $1\sim 1$ fails because $1\cdot 1$ is odd, so the value is 0. In (c), $m=m+3$ is never true, so the value is 0.'
          - problem: 'Count the prime factors of a number with multiplicity. For example, $12=2\cdot 2\cdot 3$ has 3 prime factors. (a) Give the count for $72$. (b) Give the count for $100$. (c) Give 1 if $72$ and $108$ have the same count and 0 if not.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 5; b = 4; c = 1'
            solution_sketch: 'Write $72=2^3\cdot 3^2$, so the count is $3+2=5$. Write $100=2^2\cdot 5^2$, so the count is $2+2=4$. Write $108=2^2\cdot 3^3$, so its count is $2+3=5$ and (c) is 1.'
          - problem: 'Let $\sim$ be the relation on $\{1,2,\dots,10\}$ with $m\sim n$ when $m-n$ is divisible by $3$. The class of $x$ is the set of all $y$ with $y\sim x$. (a) Count the elements of the class of $4$. (b) Give the smallest element of the class of $8$. (c) Count the different classes.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 4; b = 2; c = 3'
            solution_sketch: 'The class of $4$ is $\{1,4,7,10\}$, so (a) is 4. The class of $8$ is $\{2,5,8\}$, so (b) is 2. The remainder of $x$ modulo $3$ is 0, 1 or 2, so there are 3 different classes.'
          # source: FoM exercise 3.7-3-85
          - problem: 'Look at three properties of a relation: reflexive, symmetric and transitive. Here $\mathbb N$ starts at 1. For each relation on $\mathbb N$ below, give the number of these properties that fail. (a) $m\sim n$ when $n=1$. (b) $m\sim n$ when $m+n\le 3$. (c) $m\sim n$ when $m-n=2$. (d) $m\sim n$ when $3$ is a prime factor of $m$ and of $n$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}}]}
            answer: 'a = 2; b = 2; c = 3; d = 1'
            solution_sketch: 'In (a), $2\sim 2$ fails and $2\sim 1$ has no reverse pair, so 2 properties fail; transitivity holds. In (b), $2\sim 2$ fails, and $2\sim 1$, $1\sim 2$ do not give $2\sim 2$, so 2 properties fail. In (c), all 3 fail: $m-m=0$, the reverse gives $-2$, and two steps give $4$. In (d), $1\sim 1$ fails, and the other 2 hold, so the count is 1.'
          - problem: 'Two natural numbers are related when they have the same set of prime divisors. Look at the numbers from $1$ to $50$. (a) Count the numbers related to $12$. (b) Count the numbers related to $7$. (c) Count the numbers related to $30$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 6; b = 2; c = 1'
            solution_sketch: 'The numbers related to $12$ are the numbers with prime divisors exactly $2$ and $3$: $6, 12, 18, 24, 36, 48$. That gives 6. The numbers related to $7$ are $7$ and $49$, so (b) is 2. Only $30$ itself has prime divisors $2$, $3$ and $5$ up to $50$, because the next one is $60$, so (c) is 1.'
        constraints: 'Test the three properties of a relation and compute classes; the items vary the relations and keep the values 1 and 0.'
      - id: kp2
        name: 'Example 3.96 to Proposition 3.99: classes and partitions'
        key_prerequisites: [fom-2-5-axiom-powers-relations-functions, equivalence-classes-partitions]
        exemplars:
          # argument: Proposition 3.99
          - problem: 'Prove the first step: for an equivalence relation $\sim$ on a set $X$, the classes are nonempty, two classes are equal or disjoint, and the classes cover $X$.'
            answer_contract: {"kind":"written"}
            answer: 'Reflexivity puts x in its own class. If two classes share an element z, symmetry and transitivity show each class lies in the other.'
            solution_sketch: 'Reflexivity (Definition 3.90) puts $x$ in its own class, so each class (Definition 3.94) is nonempty and the classes cover $X$. Suppose $z$ lies in the class of $x$ and in the class of $y$. Then $x\sim z\sim y$, so $x\sim y$ by transitivity. A point $u$ of the class of $x$ has $u\sim x\sim y$, so $u$ lies in the class of $y$. The reverse inclusion is the same.'
          # argument: Proposition 3.99
          - problem: 'Prove the second step: let $\{X_i\}_{i\in I}$ be a partition of $X$. Let $a\sim b$ when some $X_i$ holds both $a$ and $b$. Then $\sim$ is an equivalence relation.'
            answer_contract: {"kind":"written"}
            answer: 'The sets cover X, so each x lies in some block. The blocks are disjoint, so two blocks that share y are equal, and transitivity follows.'
            solution_sketch: 'Use Definition 3.98 and Definition 3.90. Each $x$ lies in some $X_i$, so $x\sim x$. If $x,y\in X_i$, then $y\sim x$, so $\sim$ is symmetric. Let $x,y\in X_i$ and $y,z\in X_j$. Then $y\in X_i\cap X_j$, so $X_i=X_j$ because the blocks are pairwise disjoint. So $x,z\in X_i$ and $x\sim z$.'
          - problem: 'Let $X=\{1,2,3,4\}$. Give each truth value as 1 for true and 0 for false. (a) $\{1,2\},\{3\},\{4\}$ is a partition of $X$. (b) $\{1,2\},\{2,3\},\{4\}$ is a partition of $X$. (c) $\{1\},\{3,4\}$ is a partition of $X$. (d) $\{1,2,3,4\}$ is a partition of $X$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 0; c = 0; d = 1'
            solution_sketch: 'A partition has nonempty sets that do not overlap and cover $X$. The family in (a) does, so the value is 1. In (b) the sets share the element $2$, so the value is 0. In (c) the element $2$ is missing, so the value is 0. In (d) the one set is $X$, so the value is 1.'
          - problem: 'Let $X=\{1,2,\dots,12\}$ and let $m\sim n$ when $4$ divides $m-n$. (a) Count the equivalence classes. (b) Count the elements of the class of $5$. (c) Give the largest element of the class of $2$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 4; b = 3; c = 10'
            solution_sketch: 'The remainder modulo $4$ is 0, 1, 2 or 3, so there are 4 classes. The class of $5$ is $\{1,5,9\}$, so (b) is 3. The class of $2$ is $\{2,6,10\}$, so (c) is 10.'
          - problem: 'Cut the set $\{1,\dots,6\}$ into the blocks $\{1,2\}$, $\{3,4,5\}$ and $\{6\}$. Let $a\sim b$ when $a$ and $b$ lie in one block. (a) Give 1 if $2\sim 1$ and 0 if not. (b) Give 1 if $3\sim 6$ and 0 if not. (c) Count the ordered pairs $(a,b)$ with $a\sim b$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 0; c = 14'
            solution_sketch: 'The numbers $1$ and $2$ lie in one block, so (a) is 1. The numbers $3$ and $6$ lie in different blocks, so (b) is 0. Each block of size $k$ gives $k^2$ ordered pairs. The total is $4+9+1=14$.'
          - problem: 'On pairs of natural numbers, let $(a,b)\sim(c,d)$ when $a+d=b+c$. (a) Give 1 if $(3,5)\sim(1,3)$ and 0 if not. (b) Give 1 if $(2,2)\sim(4,5)$ and 0 if not. (c) Give the number $x$ with $(7,4)\sim(x,2)$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 0; c = 5'
            solution_sketch: 'In (a), $3+3=6$ and $5+1=6$, so the value is 1. In (b), $2+5=7$ and $2+4=6$, so the value is 0. In (c), the rule gives $7+2=4+x$, so $x=5$.'
          # source: FoM exercise 3.7-3-87
          - problem: 'Four relations are listed below. Let F be the number of failed properties among reflexive, symmetric and transitive. Let K be the number of equivalence classes if F is 0, and 0 if F is not 0. Relation 1: $\{(1,1),(2,2),(3,3),(4,4),(2,3),(3,2)\}$ on $\{1,2,3,4\}$. Relation 2: the same pairs on $\{1,2,3,4,5\}$. Relation 3: $\{(1,1),(2,2),(3,3),(2,3)\}$ on $\{1,2,3\}$. Relation 4: $\{(1,1),(2,2),(3,3),(1,2),(2,1),(2,3),(3,2)\}$ on $\{1,2,3\}$. Give (a) F of relation 1, (b) K of relation 1, (c) F of relation 2, (d) K of relation 2, (e) F of relation 3, (f) K of relation 3, (g) F of relation 4, (h) K of relation 4.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}},{"name":"e","contract":{"kind":"exact"}},{"name":"f","contract":{"kind":"exact"}},{"name":"g","contract":{"kind":"exact"}},{"name":"h","contract":{"kind":"exact"}}]}
            answer: 'a=0;b=3;c=1;d=0;e=1;f=0;g=1;h=0'
            solution_sketch: 'In relation 1 all three properties hold. The classes are $\{1\}$, $\{2,3\}$ and $\{4\}$, so (a) is 0 and (b) is 3. In relation 2 the pair $(5,5)$ is missing, so only reflexivity fails. In relation 3 the pair $(3,2)$ is missing, so only symmetry fails. In relation 4 the pairs $(1,2)$ and $(2,3)$ need $(1,3)$, so only transitivity fails.'
          - problem: 'Count the ways to cut a set into nonempty blocks. (a) Count the partitions of $\{1,2,3\}$. (b) Count the partitions of $\{1,2,3,4\}$. (c) Count the partitions of $\{1,2,3,4\}$ with exactly 2 blocks.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 5; b = 15; c = 7'
            solution_sketch: 'For $\{1,2,3\}$ the shapes are one block (1 way), 2+1 (3 ways) and 1+1+1 (1 way), so (a) is 5. For $\{1,2,3,4\}$ the shapes 4, 3+1, 2+2, 2+1+1 and 1+1+1+1 give 1+4+3+6+1=15. The shapes with 2 blocks are 3+1 and 2+2, which give 4+3=7.'
          # source: FoM exercise 3.7-3-88
          - problem: 'Let $V_0(X)=X$ and $V_n(X)=V_{n-1}(X)\cup\mathcal P(V_{n-1}(X))$ for $n\ge 1$. Assume that no element of $X$ is a set of the form $\{x\}$ or $\{x,y\}$. Write the ordered pair $(x,y)$ as the set $\{\{x\},\{x,y\}\}$. (a) For a relation $\sim$ on $X$, give the smallest $n$ such that $\sim\ \in V_n(X)$ for every such relation $\sim$. (b) For a partition $\{X_i\}_{i\in I}$ of $X$ with $I\subseteq X$, give the smallest $n$ such that the function $i\mapsto X_i$ lies in $V_n(X)$ for every such partition. Name the parts a and b.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}}]}
            answer: 'a = 3; b = 4'
            solution_sketch: 'In (a), the elements $x,y$ lie in $V_0$, so $\{x\}$ and $\{x,y\}$ lie in $V_1$ and the pair lies in $V_2$. A relation is a set of pairs, so it lies in $V_3$. In (b), $X_i\subseteq X$ lies in $V_1$, so $\{i,X_i\}$ lies in $V_2$ and the pair $(i,X_i)$ lies in $V_3$. The function is a set of such pairs, so it lies in $V_4$.'
          - problem: 'Look at the numbers from $1$ to $30$. Put two numbers in one class when the rule holds. (a) Rule: the same number of distinct prime divisors. Count the classes. (b) Rule: the same number of prime factors with multiplicity. Count the classes. (c) Rule: the same set of prime divisors. Count the classes.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 4; b = 5; c = 19'
            solution_sketch: 'In (a), the counts 0, 1, 2 and 3 occur, with $30=2\cdot3\cdot5$ the largest count, so there are 4 classes. In (b), the counts 0 to 4 occur, with $16=2^4$ at the top, so there are 5 classes. In (c), each class holds the numbers with one radical, and the radicals are the 19 squarefree numbers up to $30$.'
        constraints: 'Count classes and test partitions; the items vary the sets and keep the values 1 and 0.'
    diagnostic_exemplar:
      problem: 'Let $R=\{(1,1),(2,2)\}$ on the set $\{1,2\}$. Give 1 if $R$ is an equivalence relation and 0 if not.'
      answer_contract: {"kind":"exact"}
      answer: '1'
      solution_sketch: 'Both elements are related to themselves, so $R$ is reflexive. Symmetry and transitivity hold because the only pairs are $(1,1)$ and $(2,2)$. So the answer is 1.'
