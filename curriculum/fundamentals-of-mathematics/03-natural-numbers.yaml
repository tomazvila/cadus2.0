      - id: kp1
        name: 'Definition 3.100 and Proposition 3.101: equivalence modulo m is an equivalence relation'
        key_prerequisites: [fom-3-3-more-abstract-viewpoint-binary, fom-3-7-equivalence-relations]
        exemplars:
          - problem: 'Work with equivalence modulo $m$ on $\mathbb{N}_0$. (a) Count the equivalence classes modulo $1$. (b) Count the equivalence classes modulo $10$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 10'
            solution_sketch: 'Modulo 1, every difference is divisible by 1, so all numbers lie in 1 class. Modulo 10, the classes are given by the 10 remainders 0 to 9, so there are 10 classes.'
          - problem: 'Give 1 if the two numbers are equivalent modulo the given modulus and 0 if they are not. (a) $17$ and $5$ modulo $6$. (b) $23$ and $9$ modulo $7$. (c) $30$ and $12$ modulo $8$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 1; c = 0'
            solution_sketch: 'Take the difference. In (a), $17-5=12$ and $6$ divides $12$, so the value is 1. In (b), $23-9=14$ and $7$ divides $14$, so the value is 1. In (c), $30-12=18$ and $8$ does not divide $18$, so the value is 0.'
          - problem: 'Look at the numbers $y\in\{0,1,\dots,20\}$ with $y\equiv 7 \pmod 5$. (a) Count them. (b) Give the largest one. (c) Give their sum.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 4; b = 17; c = 38'
            solution_sketch: 'The numbers are 2, 7, 12, 17. That gives 4 numbers. The largest is 17. The sum is 38.'
          - problem: 'Let $m$ be a natural number with $100\equiv 40 \pmod m$. (a) Give the largest possible $m$. (b) Count the possible values of $m$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}}]}
            answer: 'a = 60; b = 12'
            solution_sketch: 'The condition means that $m$ divides $100-40=60$. The largest such $m$ is 60. The divisors of 60 are 1, 2, 3, 4, 5, 6, 10, 12, 15, 20, 30, 60, so there are 12 values.'
          - problem: 'Count the numbers $z\in\{0,1,\dots,60\}$ that are equivalent modulo $9$ to both numbers given. (a) Both numbers are $4$ and $22$. (b) Both numbers are $4$ and $20$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}}]}
            answer: 'a = 7; b = 0'
            solution_sketch: 'Since $22-4=18$ is divisible by 9, the numbers 4 and 22 are equivalent, and the numbers equivalent to 4 are 4, 13, 22, 31, 40, 49, 58. That gives 7 numbers. Since $20-4=16$ is not divisible by 9, no number is equivalent to both 4 and 20, so the count is 0.'
          - problem: 'Count the pairs $(x,y)$ with $x<y$ that are equivalent modulo the given modulus. (a) Both numbers in $\{0,\dots,9\}$, modulus $5$. (b) Both numbers in $\{0,\dots,8\}$, modulus $3$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}}]}
            answer: 'a = 5; b = 9'
            solution_sketch: 'In (a), each class holds 2 numbers and gives 1 pair, and there are 5 classes, so the count is 5. In (b), each class holds 3 numbers and gives 3 pairs, and there are 3 classes, so the count is 9.'
          # argument: Proposition 3.101
          - problem: 'Prove the first step: for a natural number $m$, equivalence modulo $m$ on $\mathbb{N}_0$ is reflexive and symmetric.'
            answer_contract: {"kind":"written"}
            answer: 'Reflexive: x equals x, so the first case of the definition holds. Symmetric: swap the two numbers, because m divides the difference in either order.'
            solution_sketch: 'Use Definition 3.100. For reflexivity, x = x holds, so x is equivalent to x. For symmetry, assume x is equivalent to y. If x = y, nothing is left to prove. If x > y, then m divides x - y, so the definition gives y equivalent to x. If x < y, the same argument works with y - x.'
          # argument: Proposition 3.101
          - problem: 'Prove the second step: for a natural number $m$, equivalence modulo $m$ on $\mathbb{N}_0$ is transitive.'
            answer_contract: {"kind":"written"}
            answer: 'Take three distinct numbers and order them. In each of the three orders, write the two known differences as multiples of m and add or subtract them.'
            solution_sketch: 'Use Definition 3.100 and Proposition 3.42. If two of the numbers are equal, nothing is left to prove. Assume x < z. If y < x < z, then z - x = (z - y) - (x - y) = (k - j)m. If x < z < y, then z - x = (y - x) - (y - z) = (j - k)m. If x < y < z, then z - x = (z - y) + (y - x) = (k + j)m.'
          # source: FoM exercise 3.8-3-89
          - problem: 'Let $k<m<n$ be natural numbers. Prove three identities for differences. (a) $n-m=(n-k)-(m-k)$. (b) $m-k=(n-k)-(n-m)$. (c) $n-k=(n-m)+(m-k)$.'
            answer_contract: {"kind":"written"}
            answer: 'A difference is the number that you add to the smaller number to get the larger one. Check each identity by adding the right side to the smaller number.'
            solution_sketch: 'These are the details of Proposition 3.101, in the style of Proposition 3.42. For (c), $k+(m-k)=m$ and $m+(n-m)=n$, so $n-k=(n-m)+(m-k)$. For (a), subtract $m-k$ from both sides of (c). For (b), subtract $n-m$ from both sides of (c).'
        constraints: 'Decide equivalence of numbers modulo m, count classes and members; the items vary the numbers and moduli.'
      - id: kp2
        name: 'Proposition 3.102: a number is equivalent to its remainder'
        key_prerequisites: [division-algorithm]
        exemplars:
          - problem: 'Give the remainder of the division. (a) $1234$ divided by $7$. (b) $4567$ divided by $9$. (c) $100000$ divided by $11$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 2; b = 4; c = 10'
            solution_sketch: 'In (a), $1234=7\cdot 176+2$, so the remainder is 2. In (b), $4567=9\cdot 507+4$, so the remainder is 4. In (c), $100000=11\cdot 9090+10$, so the remainder is 10.'
          - problem: 'Look at the numbers equivalent to $37$ modulo $12$. (a) Give the smallest one above $100$. (b) Give the largest one below $100$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}}]}
            answer: 'a = 109; b = 97'
            solution_sketch: 'The remainder of 37 divided by 12 is 1, so the numbers are $12q+1$. The first one above 100 is $12\cdot 9+1=109$. The last one below 100 is $12\cdot 8+1=97$.'
          - problem: 'Give the remainder of each number. (a) $2^{10}$ divided by $13$. (b) $3^{20}$ divided by $7$. (c) $7^{100}$ divided by $6$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 10; b = 2; c = 1'
            solution_sketch: 'In (a), $2^{10}=1024=13\cdot 78+10$, so the remainder is 10. In (b), $3^6\equiv 1$ modulo 7 and $3^{20}=(3^6)^3\cdot 3^2$, so the remainder of 9 is 2. In (c), $7\equiv 1$ modulo 6, so the remainder is 1.'
          - problem: 'Look at the numbers $x\in\{0,1,\dots,50\}$ with remainder $4$ when divided by $6$. (a) Count them. (b) Give their sum.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}}]}
            answer: 'a = 8; b = 200'
            solution_sketch: 'The numbers are 4, 10, 16, 22, 28, 34, 40, 46. That gives 8 numbers. Their sum is 200.'
          - problem: 'Give the remainder of $123456789$ divided by the given number. (a) Divide by $9$. (b) Divide by $11$. (c) Divide by $4$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 0; b = 5; c = 1'
            solution_sketch: 'In (a), the digit sum is 45, and 9 divides 45, so the remainder is 0. In (b), the alternating digit sum gives the remainder 5. In (c), only the last two digits matter, and $89=4\cdot 22+1$, so the remainder is 1.'
          # source: FoM exercise 3.8-3-93
          - problem: 'For each modulus $m$, count the pairs $(x,y)$ with $x,y\in\{0,1,\dots,m-1\}$ and $xy\equiv 0 \pmod m$. (a) $m=2$. (b) $m=3$. (c) $m=4$. (d) $m=5$. (e) $m=6$. (f) $m=7$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}},{"name":"e","contract":{"kind":"exact"}},{"name":"f","contract":{"kind":"exact"}}]}
            answer: 'a=3;b=5;c=8;d=9;e=15;f=13'
            solution_sketch: 'Check the pairs for each modulus. For a prime modulus $p$, the pairs have $x=0$ or $y=0$, which gives $2p-1$ pairs: 3 for 2, 5 for 3, 9 for 5 and 13 for 7. For $m=4$, the extra pair $(2,2)$ gives 8. For $m=6$, the extra pairs $(2,3)$, $(3,2)$, $(3,4)$ and $(4,3)$ give 15.'
          # argument: Proposition 3.102
          - problem: 'Prove: for a natural number $m$ and $x\in\mathbb{N}_0$, the number $x$ is equivalent modulo $m$ to the remainder $d$ of the division of $x$ by $m$.'
            answer_contract: {"kind":"written"}
            answer: 'Write x = qm + d with d the remainder. Then x - d = qm is divisible by m, so x is equivalent to d.'
            solution_sketch: 'Use Definition 3.100 and the division with remainder. Write $x=qm+d$ with $0\le d<m$. If $q=0$, then $x=d$ and the first case of the definition holds. Otherwise $x>d$ and $x-d=qm$ is divisible by $m$. So the second case of the definition holds.'
          # source: FoM exercise 3.8-3-90
          - problem: 'Let $m$ be a natural number and let $d$ be the remainder of $x\in\mathbb{N}_0$ divided by $m$. Prove from the definition of equivalence that $x\equiv d \pmod m$.'
            answer_contract: {"kind":"written"}
            answer: 'The number x - d equals qm for the quotient q, so m divides it. The definition then gives the equivalence of x and d.'
            solution_sketch: 'This is Proposition 3.102. Write $x=qm+d$ with $0\le d<m$. If $q=0$, then $x=d$. If $q>0$, then $x>d$ and $m$ divides $x-d=qm$. In both cases Definition 3.100 gives $x\equiv d$ modulo $m$.'
        constraints: 'Reduce numbers and powers to remainders; the items vary the numbers and moduli.'
      - id: kp3
        name: 'Theorem 3.103: equivalence modulo m respects sums'
        key_prerequisites: [fom-3-3-more-abstract-viewpoint-binary]
        exemplars:
          - problem: 'Give the remainder of each sum. (a) $123+456$ divided by $10$. (b) $1234567+7654321$ divided by $9$. (c) $99999+1$ divided by $100$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 9; b = 2; c = 0'
            solution_sketch: 'In (a), the sum is 579, so the remainder is 9. In (b), each number has digit sum 28, so each has remainder 1, and the remainders add to 2, which has remainder 2. In (c), the sum is 100000 and 100 divides it, so the remainder is 0.'
          - problem: 'Let $a$ and $b$ be natural numbers with $a\equiv 3$ and $b\equiv 5$ modulo $7$. Give the remainder modulo $7$ of (a) $a+b$, (b) $a+a$, (c) $a+b+b$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 6; c = 6'
            solution_sketch: 'Add the remainders and reduce. In (a), $3+5=8$, which has remainder 1. In (b), $3+3=6$, which has remainder 6. In (c), $3+5+5=13$, which has remainder 6.'
          - problem: 'Find the number $x$ in the given range that solves the congruence. (a) $x+8\equiv 3 \pmod{11}$ with $x\in\{0,\dots,10\}$. (b) $x+25\equiv 2 \pmod 9$ with $x\in\{0,\dots,8\}$. (c) $x+x\equiv 1 \pmod 7$ with $x\in\{0,\dots,6\}$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 6; b = 4; c = 4'
            solution_sketch: 'In (a), 6+8=14, which is 3 modulo 11. In (b), 25 has remainder 7, and 4+7=11, which is 2 modulo 9. In (c), 4+4=8, which is 1 modulo 7.'
          - problem: 'Give the remainder of the sum. (a) $1+2+\dots+100$ divided by $7$. (b) $1+2+\dots+50$ divided by $5$. (c) $1+2+\dots+20$ divided by $12$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 3; b = 0; c = 6'
            solution_sketch: 'The sums are 5050, 1275 and 210. In (a), $5050=7\cdot 721+3$, so the remainder is 3. In (b), 5 divides 1275, so the remainder is 0. In (c), $210=12\cdot 17+6$, so the remainder is 6.'
          - problem: 'Count the pairs $(a,b)$ with $a+b\equiv 0$ modulo the given modulus. (a) $a,b\in\{0,\dots,4\}$, modulus $5$. (b) $a\in\{0,\dots,5\}$, $b\in\{0,\dots,3\}$, modulus $4$. (c) $a,b\in\{0,\dots,7\}$, modulus $6$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 5; b = 6; c = 11'
            solution_sketch: 'List the pairs. In (a), each $a$ has exactly one partner $b$, so the count is 5. In (b), $a$ in {0,4} has the partner 0, $a$ in {1,5} has the partner 3, and each of 2 and 3 has 1 partner, so the count is 6. In (c), the sums 0, 6 and 12 give 11 pairs.'
          - problem: 'Add the number $r$ to itself again and again. Give the smallest count $k\ge 1$ of terms with $kr\equiv 0$ modulo $m$. (a) $r=5$, $m=15$. (b) $r=4$, $m=10$. (c) $r=6$, $m=15$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 3; b = 5; c = 5'
            solution_sketch: 'In (a), $3\cdot 5=15$, so the count is 3. In (b), $5\cdot 4=20$, and 10 divides 20, so the count is 5. In (c), $5\cdot 6=30$, and 15 divides 30, so the count is 5.'
          # argument: Theorem 3.103
          - problem: 'Prove: let $m$ be a natural number and let $a,b,c,d\in\mathbb{N}_0$ with $a\equiv c$ and $b\equiv d$ modulo $m$. Then $a+b\equiv c+d \pmod m$.'
            answer_contract: {"kind":"written"}
            answer: 'Write the difference of the two sums as a sum or a difference of the two given multiples of m. The result is a multiple of m.'
            solution_sketch: 'Use Definition 3.100 and Proposition 3.42. Rename the variables so that $a+b\ge c+d$ and $a\ge c$. Then $a-c=k_1m$. If $b\ge d$, then $b-d=k_2m$ and $(a+b)-(c+d)=(k_1+k_2)m$. If $b<d$, then $d-b=k_2m$ and $k_1\ge k_2$, so the difference is $(k_1-k_2)m$. In both cases $m$ divides the difference, so the sums are equivalent.'
          # source: FoM exercise 3.8-3-91
          - problem: 'Prove two identities for differences. (a) For natural numbers $k,m,n$ with $m<n$: $n-m=(n+k)-(m+k)$. (b) For natural numbers $k,l,m,n$ with $l+k\le n+m$, $l\le n$ and $m<k$: $(n+m)-(l+k)=(n-l)-(k-m)$.'
            answer_contract: {"kind":"written"}
            answer: 'In both parts, add the right side to the smaller number on the left side and check that the sum is the larger number.'
            solution_sketch: 'These are the identities in the proof of Theorem 3.103. For (a), $(m+k)+(n-m)=n+k$, so the difference is $n-m$. For (b), the condition $l+k\le n+m$ gives $n-l\ge k-m$. Then $(l+k)+[(n-l)-(k-m)]=n+m$. So the bracket is the difference $(n+m)-(l+k)$.'
          # source: FoM exercise 3.8-3-94
          - problem: 'Let $m$ be a natural number and let $a<b$ be numbers in $\mathbb{N}_0$. Prove that $a\equiv b \pmod m$ exactly when $b-a\equiv 0 \pmod m$.'
            answer_contract: {"kind":"written"}
            answer: 'Both statements mean that m divides b - a, because b is larger than a and b - a is larger than 0.'
            solution_sketch: 'Use Definition 3.100. Since $a<b$, the first statement means that $m$ divides $b-a$. Since $b-a>0$, the second statement means that $m$ divides $(b-a)-0$. These two conditions are the same. So the two statements are equivalent.'
        constraints: 'Add residues, solve one-step congruences and count pairs; the items vary the numbers and moduli.'
      - id: kp4
        name: 'Theorem 3.104: equivalence modulo m respects products'
        key_prerequisites: [fom-3-6-divisibility]
        exemplars:
          - problem: 'Give the remainder of each product. (a) $123\cdot 456$ divided by $10$. (b) $1234\cdot 4321$ divided by $9$. (c) $999\cdot 1001$ divided by $7$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 8; b = 1; c = 0'
            solution_sketch: 'In (a), the last digits give $3\cdot 6=18$, so the remainder is 8. In (b), both numbers have digit sum 10 and remainder 1, so the remainder is 1. In (c), 1001 is divisible by 7, so the remainder is 0.'
          - problem: 'Give the last digit of each number. (a) $7^{123}$. (b) $13^{47}$. (c) $2^{2024}$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 3; b = 7; c = 6'
            solution_sketch: 'The last digit is the remainder modulo 10. The powers of 7 repeat with period 4, and $123=4\cdot 30+3$, so (a) is 3. The last digit of 13 is 3, and $3^{47}$ has $47=4\cdot 11+3$, so (b) is 7. The powers of 2 repeat with period 4 from $2^4=16$, and $2024$ is divisible by 4, so (c) is 6.'
          - problem: 'Give the remainder of each power. (a) $2^{100}$ divided by $7$. (b) $7^{50}$ divided by $10$. (c) $3^{100}$ divided by $8$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 2; b = 9; c = 1'
            solution_sketch: 'In (a), $2^3=8\equiv 1$ modulo 7 and $100=3\cdot 33+1$, so the remainder is 2. In (b), $7^4=2401\equiv 1$ modulo 10 and $50=4\cdot 12+2$, so the remainder of 49 is 9. In (c), $3^2=9\equiv 1$ modulo 8, so the remainder is 1.'
          - problem: 'Count the different remainders of $x^2$ when $x$ runs over all integers, for the given modulus. (a) Modulus $7$. (b) Modulus $8$. (c) Modulus $10$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 4; b = 3; c = 6'
            solution_sketch: 'Square the remainders 0 up to m-1. Modulo 7 the squares are 0, 1, 4 and 2, which gives 4 values. Modulo 8 the squares are 0, 1 and 4, which gives 3 values. Modulo 10 the squares are 0, 1, 4, 9, 6 and 5, which gives 6 values.'
          - problem: 'Find the number $x$ with $0\le x<m$ that solves the congruence. (a) $3x\equiv 1 \pmod 7$. (b) $4x\equiv 3 \pmod{11}$. (c) $5x\equiv 2 \pmod 9$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 5; b = 9; c = 4'
            solution_sketch: 'Test the values. In (a), $3\cdot 5=15\equiv 1$. In (b), $4\cdot 9=36\equiv 3$. In (c), $5\cdot 4=20\equiv 2$.'
          - problem: 'Count the numbers $x$ in the given range with $cx\equiv 0$ modulo $m$. (a) $c=6$, $m=12$, $x\in\{1,\dots,11\}$. (b) $c=4$, $m=10$, $x\in\{1,\dots,9\}$. (c) $c=15$, $m=21$, $x\in\{1,\dots,20\}$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 5; b = 1; c = 2'
            solution_sketch: 'In (a), 12 divides $6x$ exactly when $x$ is even, which gives 5 numbers. In (b), 10 divides $4x$ exactly when 5 divides $x$, which gives 1 number. In (c), 21 divides $15x$ exactly when 7 divides $x$, which gives 2 numbers.'
          # argument: Theorem 3.104
          - problem: 'Prove: let $m$ be a natural number and let $a,b,c,d\in\mathbb{N}_0$ with $a\equiv c$ and $b\equiv d$ modulo $m$. Then $a\cdot b\equiv c\cdot d \pmod m$.'
            answer_contract: {"kind":"written"}
            answer: 'Write ab - cd as (a - c)b + c(b - d). Both terms are multiples of m, so the sum is a multiple of m.'
            solution_sketch: 'Use Definition 3.100. Rename the variables so that $ab\ge cd$ and $a\ge c$. Then $a-c=k_1m$. If $b\ge d$, then $b-d=k_2m$ and $ab-cd=(ab-cb)+(cb-cd)=(k_1b+ck_2)m$. If $b<d$, the same idea gives a multiple of $m$, as in Exercise 3-92. So $m$ divides $ab-cd$.'
          # source: FoM exercise 3.8-3-92
          - problem: 'Let $m$ be a natural number and let $a,b,c,d\in\mathbb{N}_0$ with $a\equiv c$ and $b\equiv d$ modulo $m$, $ab\ge cd$, $a\ge c$ and $b<d$. Prove that $m$ divides $ab-cd$.'
            answer_contract: {"kind":"written"}
            answer: 'Write ab - cd as (a - c)d - a(d - b). Both differences are multiples of m, so the result is a multiple of m.'
            solution_sketch: 'Use Theorem 3.104. Put $a-c=k_1m$ and $d-b=k_2m$. Then $ab-cd=(a-c)d-a(d-b)=(k_1d-ak_2)m$. The number $ab-cd$ is not negative, so $k_1d-ak_2$ is not negative. So $m$ divides $ab-cd$.'
        constraints: 'Multiply residues, find last digits and solve small congruences; the items vary the numbers and moduli.'
      - id: kp5
        name: 'Corollary 3.105 and Definition 3.106: the classes modulo m and the set Z_m'
        key_prerequisites: [fom-3-7-equivalence-relations]
        exemplars:
          - problem: 'Work in $\mathbb{Z}_m$. Give the smallest nonnegative representative of the result. (a) $[5]_7+[4]_7$. (b) $[5]_7\cdot[4]_7$. (c) $[8]_9\cdot[8]_9$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 2; b = 6; c = 1'
            solution_sketch: 'Compute with any representatives and reduce. In (a), $5+4=9$, which has remainder 2 modulo 7. In (b), $5\cdot 4=20$, which has remainder 6 modulo 7. In (c), $8\cdot 8=64$, which has remainder 1 modulo 9.'
          - problem: 'Add all the classes of $\mathbb{Z}_m$. Give the smallest nonnegative representative of the sum. (a) $m=7$. (b) $m=8$. (c) $m=10$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 0; b = 4; c = 5'
            solution_sketch: 'Add the representatives 0 up to m-1. For m = 7 the sum is 21, which has remainder 0. For m = 8 the sum is 28, which has remainder 4. For m = 10 the sum is 45, which has remainder 5.'
          - problem: 'Count the classes $[u]_m\in\mathbb{Z}_m$ with $[u]_m\cdot[u]_m=[0]_m$. (a) $m=12$. (b) $m=8$. (c) $m=9$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 2; b = 2; c = 3'
            solution_sketch: 'Test the representatives. Modulo 12 the squares 0 and 36 work, from x = 0 and x = 6, which gives 2 classes. Modulo 8 the values x = 0 and x = 4 work, which gives 2 classes. Modulo 9 the values x = 0, 3 and 6 work, which gives 3 classes.'
          - problem: 'Solve in $\mathbb{Z}_m$. (a) Give the smallest nonnegative integer $u$ with $[u]_{11}+[9]_{11}=[4]_{11}$. (b) Give the smallest nonnegative integer $u$ with $[u]_8+[6]_8=[2]_8$. (c) Count the classes $[u]_6$ with $[2]_6\cdot[u]_6=[4]_6$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 6; b = 4; c = 2'
            solution_sketch: 'In (a), 6+9=15, which is 4 modulo 11. In (b), 4+6=10, which is 2 modulo 8. In (c), the values u = 2 and u = 5 give 4 and 10, and 10 has remainder 4 modulo 6, so the count is 2.'
          - problem: 'Count the pairs $([u]_m,[y]_m)$ in $\mathbb{Z}_m$ with $[u]_m\cdot[y]_m=[1]_m$. (a) $m=8$. (b) $m=9$. (c) $m=12$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 4; b = 6; c = 4'
            solution_sketch: 'Each class with a partner has exactly one partner. Modulo 8 the classes 1, 3, 5 and 7 have a partner, which gives 4 pairs. Modulo 9 the classes 1, 2, 4, 5, 7 and 8 have a partner, which gives 6 pairs. Modulo 12 the classes 1, 5, 7 and 11 have a partner, which gives 4 pairs.'
          - problem: 'In $\mathbb{Z}_5$, try the rule $[a]_5\ast[b]_5:=[a^b]_5$. (a) Give the remainder of $2^3$ divided by $5$. (b) Give the remainder of $2^8$ divided by $5$. (c) Give 1 if $2^3$ and $2^8$ are equivalent modulo $5$, and 0 if not.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 3; b = 1; c = 0'
            solution_sketch: 'In (a), $2^3=8$, which has remainder 3. In (b), $2^8=256$, which has remainder 1. The classes $[3]_5$ and $[8]_5$ are equal, but the results 3 and 1 differ, so $2^3$ and $2^8$ are not equivalent modulo 5, the rule is not well-defined, and (c) is 0.'
          # argument: Corollary 3.105
          - problem: 'Prove: let $m$ be a natural number. If $[a]_m=[c]_m$ and $[b]_m=[d]_m$, then $[a+b]_m=[c+d]_m$ and $[ab]_m=[cd]_m$.'
            answer_contract: {"kind":"written"}
            answer: 'Equal classes mean equivalent numbers. The theorems on sums and products then give equivalent sums and products, so their classes are equal.'
            solution_sketch: 'Use Theorem 3.103 and Theorem 3.104. Equal classes mean $a\equiv c$ and $b\equiv d$ modulo $m$. Theorem 3.103 gives $a+b\equiv c+d$. Theorem 3.104 gives $ab\equiv cd$. Equivalent numbers lie in one class, so the classes are equal.'
          # source: FoM exercise 3.8-3-95
          - problem: 'Two relations on $\mathbb{N}\times\mathbb{N}$. (a) Let $(a,b)\sim(c,d)$ hold when $a+d=b+c$. (i) Check that $\sim$ is reflexive, symmetric and transitive. (ii) Prove that $[(a,b)]\ast[(c,d)]:=[(ac,bd)]$ is not well-defined. (iii) Prove that $[(a,b)]\ast[(c,d)]:=[(a+d,bc)]$ is not well-defined. (b) Let $(a,b)\sim(c,d)$ hold when $ad=bc$. (i) Check that $\sim$ is reflexive, symmetric and transitive. (ii) Prove that $[(a,b)]\ast[(c,d)]:=[(a+c,b+d)]$ is not well-defined. (iii) Prove that $[(a,b)]\ast[(c,d)]:=[(ac,b+d)]$ is not well-defined.'
            answer_contract: {"kind":"written"}
            answer: 'Check the three laws for each relation. For each operation, find two pairs in one class whose results lie in different classes.'
            solution_sketch: 'Part (a)i: the relation is reflexive and symmetric at once, and adding $a+d=b+c$ to $c+f=d+e$ gives $a+f=b+e$. Part (a)ii: the pairs $(1,1)$ and $(2,2)$ are related, but with $(1,2)$ they give $(1,2)$ and $(2,4)$, which are not related. Part (a)iii: the pairs $(1,1)$ and $(2,2)$ with $(2,1)$ give $(2,2)$ and $(3,4)$, which are not related. Part (b)i: multiplying $ad=bc$ by $cf=de$ and cancelling $cd$ gives $af=be$. Part (b)ii: with $(1,2)$ the related pairs $(1,1)$ and $(2,2)$ give $(2,3)$ and $(3,4)$, and $2\cdot 4\ne 3\cdot 3$. Part (b)iii: with $(1,1)$ the same pairs give $(1,2)$ and $(2,3)$, and $1\cdot 3\ne 2\cdot 2$.'
          # source: FoM exercise 3.8-3-96
          - problem: 'Four functions. (a) Prove that $f(n)=4n$ from $\mathbb{N}$ to $\mathbb{N}$ is injective. (b) Prove that $f([n]_6)=[4]_6[n]_6$ from $\mathbb{Z}_6$ to $\mathbb{Z}_6$ is not injective. (c) Prove that $f(n)=3n$ from $\mathbb{N}$ to $\mathbb{N}$ is not surjective. (d) Prove that $f([n]_4)=[3]_4[n]_4$ from $\mathbb{Z}_4$ to $\mathbb{Z}_4$ is surjective.'
            answer_contract: {"kind":"written"}
            answer: 'Use a cancellation for (a), a pair of different classes with equal values for (b), a missing value for (c) and a list of all values for (d).'
            solution_sketch: 'For (a), if $4n=4k$ then $n=k$. For (b), $[4]_6[1]_6=[4]_6$ and $[4]_6[4]_6=[16]_6=[4]_6$, but $[1]_6\ne[4]_6$. For (c), the number 1 is not a multiple of 3. For (d), the values at $[0]$, $[1]$, $[2]$ and $[3]$ are $[0]$, $[3]$, $[2]$ and $[1]$, so every class is a value.'
          # source: FoM exercise 3.8-3-97
          - problem: 'Three equations. (a) Prove that $x+6=2$ has no solution in $\mathbb{N}$. (b) Prove that $[u]_8+[6]_8=[2]_8$ has a solution in $\mathbb{Z}_8$. (c) Let $m\in\mathbb{N}$ with $m\ne 1$. Prove that $[u]_m+[6]_m=[2]_m$ has a solution in $\mathbb{Z}_m$.'
            answer_contract: {"kind":"written"}
            answer: 'The sum x + 6 is at least 7, so it never equals 2. In the classes modulo m, the number 3m - 4 solves the equation, because 3m - 4 + 6 = 3m + 2.'
            solution_sketch: 'For (a), $x+6\ge 7$, so $x+6\ne 2$. For (b), $x=4$ gives $4+6=10$, which is 2 modulo 8. For (c), the number $x=3m-4$ is a natural number because $m\ge 2$. Then $x+6=3m+2\equiv 2$ modulo $m$.'
          # source: FoM exercise 3.8-3-98
          - problem: 'Let $b>1$ be a natural number. Two numbers $d$ and $e$ have base $b$ digits $d_n\dots d_0$ and $e_n\dots e_0$, with leading zeros so that both have $n+1$ digits. Set $c_0=0$ and let $c_{k+1}$ be $1$ if $d_k+e_k+c_k\ge b$ and $0$ if not. Let $s_k$ be the remainder of $d_k+e_k+c_k$ divided by $b$ for $k=0,\dots,n$, and let $s_{n+1}=c_{n+1}$. Prove that $s_{n+1}s_n\dots s_0$ are the base $b$ digits of $d+e$.'
            answer_contract: {"kind":"written"}
            answer: 'At each position, d_k + e_k + c_k = s_k + b c_(k+1). Multiply by b^k and add over all positions; the carry terms cancel in pairs.'
            solution_sketch: 'At each position $k$, the definitions give $d_k+e_k+c_k=s_k+bc_{k+1}$ with $0\le s_k<b$. Multiply this equation by $b^k$ and add over $k=0,\dots,n$. The terms $c_kb^k$ on the left side and $c_{k+1}b^{k+1}$ on the right side cancel, except $c_0=0$ and $c_{n+1}b^{n+1}$. So $d+e=\sum_{k=0}^{n+1}s_kb^k$ with all $s_k$ in $\{0,\dots,b-1\}$. This is the base $b$ representation.'
          # source: FoM exercise 3.8-3-99
          - problem: 'Let $p$ be a prime number that is not $2$ or $3$. (a) Prove that $p\equiv 1$ or $p\equiv -1$ modulo $6$. (b) Prove that if $p+2$ is a prime number, too, then $6$ divides $p+1$.'
            answer_contract: {"kind":"written"}
            answer: 'A prime above 3 has remainder 1 or 5 modulo 6, because 2 and 3 do not divide it. If p + 2 is prime too, the remainder 1 fails, so p + 1 is divisible by 6.'
            solution_sketch: 'Use Proposition 3.102 to write $p=6q+r$ with $r\in\{0,\dots,5\}$. The remainders 0, 2 and 4 make $p$ even and the remainder 3 makes $p$ divisible by 3, so $p$ is not prime. So $r$ is 1 or 5, which means $p\equiv 1$ or $p\equiv -1$. For (b), if $r=1$, then $p+2=6q+3$ is divisible by 3 and larger than 3, so it is not prime. So $r=5$, and $p+1=6q+6$ is divisible by 6.'
        constraints: 'Compute with classes in Z_m and test whether a rule on classes is well-defined; the items vary the moduli.'
