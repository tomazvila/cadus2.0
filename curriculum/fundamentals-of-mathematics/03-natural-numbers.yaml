            answer: 'a = 24; b = 48; c = 60'
            solution_sketch: 'In (a) we get 1*2*3*4 = 24. In (b) the factors are 2, 4, 6 and the product is 48. In (c) the factors are 3, 4, 5 and the product is 60.'
