            answer: 'a = 1; b = 0; c = 0; d = 1'
            solution_sketch: 'In (a), $3+5=8$, so the value is 1. In (b), no $d$ gives $8+d=3$, so the value is 0. In (c), $5+d=5$ has no solution, so the value is 0. In (d), $5=5$, so the value is 1.'
          - problem: 'In this item, $\mathbb{N}$ starts at 1. In each part, give the number $d$ in $\mathbb{N}$ that proves the order. (a) $6<14$ with $6+d=14$. (b) $1<100$ with $1+d=100$. (c) $25<26$ with $25+d=26$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 8; b = 99; c = 1'
            solution_sketch: 'Subtract the smaller number from the larger number. In (a), $14-6=8$. In (b), $100-1=99$. In (c), $26-25=1$.'
          - problem: 'In this item, $\mathbb{N}$ starts at 1. Count the numbers $m$ in $\mathbb{N}$ with each property. (a) $m<6$. (b) $m\le 6$. (c) $3<m$ and $m<10$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 5; b = 6; c = 6'
            solution_sketch: 'In (a), the numbers are 1, 2, 3, 4 and 5, so the count is 5. In (b), the number 6 joins them, so the count is 6. In (c), the numbers are 4, 5, 6, 7, 8 and 9, so the count is 6.'
          - problem: 'In this item, $\mathbb{N}$ starts at 1. (a) Give the only number $n$ in $\mathbb{N}$ with $7<n$ and $n<9$. (b) Give the only number $m$ in $\mathbb{N}$ with $m\le 1$. (c) Count the numbers $n$ in $\mathbb{N}$ with $n<1$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 8; b = 1; c = 0'
            solution_sketch: 'In (a), the numbers larger than 7 and smaller than 9 are just 8. In (b), every number is at least 1, so only 1 qualifies. In (c), no number is smaller than 1, so the count is 0.'
          - problem: 'In this item, $\mathbb{N}$ starts at 1. Take the numbers 1, 2 and 3. (a) Give the truth value of $2+3<2+4$ as 1 for true and 0 for false. (b) Count the pairs $(m,n)$ of these numbers with $m<n$. (c) Count the pairs $(m,n)$ of these numbers with $m\le n$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 3; c = 6'
            solution_sketch: 'In (a), $5<6$, so the value is 1. In (b), the pairs are (1,2), (1,3) and (2,3), so the count is 3. In (c), add the three pairs with $m=n$, so the count is 6.'
          - problem: 'In this item, $\mathbb{N}$ starts at 1. Give each truth value as 1 for true and 0 for false. (a) For all $n$ in $\mathbb{N}$: $n<n+1$. (b) For all $n$ in $\mathbb{N}$: $1<n$. (c) For all $n$ in $\mathbb{N}$: $1\le n$. (d) For some $n$ in $\mathbb{N}$: $n<1$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 0; c = 1; d = 0'
            solution_sketch: 'In (a), $n+1=n+1$ with $d=1$, so the value is 1. In (b), $n=1$ fails, because $1<1$ is false, so the value is 0. In (c), the case $n=1$ gives equality and the other cases give $1<n$, so the value is 1. In (d), no number is smaller than 1, so the value is 0.'
        constraints: 'decide $m<n$ by a witness $d$ with $m+d=n$; count numbers in ranges'
      - id: kp3
        name: 'Definition 3.21: order relations and total order relations'
        key_prerequisites: []
        exemplars:
          - problem: 'A relation $R$ on a set $X$ is a set of pairs. It is reflexive when $(x,x)$ is in $R$ for every $x$ in $X$. It is antisymmetric when $(x,y)$ and $(y,x)$ in $R$ force $x=y$. It is transitive when $(x,y)$ and $(y,z)$ in $R$ force $(x,z)$ in $R$. It is total when each two elements $x,y$ have $(x,y)$ or $(y,x)$ in $R$. Take $X=\{1,2,3\}$ and $R=\{(1,1),(2,2),(3,3),(1,2)\}$. Give each truth value as 1 for true and 0 for false. (a) $R$ is reflexive. (b) $R$ is antisymmetric. (c) $R$ is transitive. (d) $R$ is total.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 1; c = 1; d = 0'
            solution_sketch: 'The pairs (1,1), (2,2) and (3,3) are in $R$, so (a) has the value 1. No pair has its reverse in $R$ except the pairs $(x,x)$, so (b) has the value 1. The only chain is (1,1) with (1,2), and it stays in $R$, so (c) has the value 1. Neither (2,3) nor (3,2) is in $R$, so (d) has the value 0.'
          - problem: 'A set $X$ has 4 elements. (a) Count the pairs in the smallest reflexive relation on $X$. (b) Count the pairs in the largest relation on $X$. (c) Count the pairs in a total order relation on $X$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 4; b = 16; c = 10'
            solution_sketch: 'The smallest reflexive relation holds the 4 pairs $(x,x)$. The largest relation holds all $4\cdot 4=16$ pairs. A total order on 4 elements lines them up. Element $k$ sits below the $4-k$ later elements, so the count is $4+3+2+1=10$.'
          - problem: 'A relation $R$ on $\{1,2,3\}$ is a set of pairs. In this item, $\mathbb{N}$ starts at 1. Count how many of the three properties reflexive, antisymmetric and transitive hold, for each relation $<$ and $=$ and $\le$ on this set, with $(x,y)$ in the relation when $x<y$, $x=y$ or $x\le y$. (a) The relation $<$. (b) The relation $=$. (c) The relation $\le$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 2; b = 3; c = 3'
            solution_sketch: 'The relation $<$ fails reflexivity, since $1<1$ is false. It is vacuously antisymmetric and it is transitive, so the count is 2. The relation $=$ has all three properties, so the count is 3. The relation $\le$ has all three properties, so the count is 3.'
          # source: FoM exercise 3.2-3-12
          - problem: 'A relation on a set is a set of pairs. It is reflexive when each element is paired with itself. It is antisymmetric when $(x,y)$ and $(y,x)$ in the relation force $x=y$. It is transitive when $(x,y)$ and $(y,z)$ in the relation force $(x,z)$. For each relation, count how many of these three properties hold. Give a count from 0 to 3. (a) $\{(b,a),(a,b)\}$ on $\{a,b\}$. (b) $\{(a,a),(a,b),(b,b)\}$ on $\{a,b\}$. (c) $\{(a,b),(b,c),(a,c)\}$ on $\{a,b,c\}$. (d) $\{(a,a),(b,b),(c,c),(a,b),(a,c)\}$ on $\{a,b,c\}$. (e) $\{(a,a),(b,b),(c,c),(a,b),(b,c)\}$ on $\{a,b,c\}$. (f) $\{(a,a),(b,b),(c,c),(a,b),(b,c),(a,c)\}$ on $\{a,b,c\}$. (g) The relation $\supseteq$ on a family of sets. Next, take pairs of positive integers and write $(i,j)\,R\,(m,n)$ for these rules. (h) $i<m$, or $i=m$ and $j\le n$. (i) $i<m$, or $i=m$ and $j<n$. (j) $i\le m$ and $j\le n$. (k) $ij\le mn$. (l) $ij\le m+n$. Compare numbers in the usual way.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}},{"name":"e","contract":{"kind":"exact"}},{"name":"f","contract":{"kind":"exact"}},{"name":"g","contract":{"kind":"exact"}},{"name":"h","contract":{"kind":"exact"}},{"name":"i","contract":{"kind":"exact"}},{"name":"j","contract":{"kind":"exact"}},{"name":"k","contract":{"kind":"exact"}},{"name":"l","contract":{"kind":"exact"}}]}
            answer: 'a=0;b=3;c=2;d=3;e=2;f=3;g=3;h=3;i=2;j=3;k=2;l=0'
            solution_sketch: 'Relation (a) has count 0, because it misses $(a,a)$ and breaks the other two properties. Relations (b), (d), (f), (g), (h) and (j) have count 3. Relations (c) and (e) have count 2: (c) is not reflexive and (e) misses $(a,c)$. Relation (i) has count 2, since $(i,j)\,R\,(i,j)$ fails. Relation (k) has count 2, because $(1,4)$ and $(2,2)$ break antisymmetry. Relation (l) has count 0, as $(3,3)$ breaks reflexivity, $(1,2)$ and $(1,1)$ break antisymmetry, and $(3,3),(1,8),(1,7)$ break transitivity.'
          - problem: 'On the set $X=\{1,2,3,4,6,12\}$, write $x\preceq y$ when $x$ divides $y$. This is an order relation. (a) Count the pairs $(x,y)$ in $X\times X$ with $x\preceq y$. (b) Count the unordered pairs $\{x,y\}$ of two different elements that are not comparable. (c) Count the elements of $X$ that are not comparable to 3.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 18; b = 3; c = 2'
            solution_sketch: 'The element 1 divides 6 elements, 2 divides 4, 3 divides 3, 4 divides 2, 6 divides 2 and 12 divides 1. The sum is 18. The pairs {2,3}, {3,4} and {4,6} are not comparable, so (b) is 3. Of the elements 1, 2, 3, 4, 6, 12, the elements 2 and 4 are not comparable to 3, so (c) is 2.'
          - problem: 'Let $X=\{\{1\},\{2\},\{1,2\}\}$ and let $R$ be the containment relation $\subseteq$ on $X$. (a) Count the pairs $(A,B)$ of elements of $X$ with $A\subseteq B$. (b) Count the unordered pairs of different elements that are not comparable. (c) Give the truth value of ''every two elements of $X$ are comparable'' as 1 for true and 0 for false.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 5; b = 1; c = 0'
            solution_sketch: 'Each set contains itself, which gives 3 pairs. Also $\{1\}\subseteq\{1,2\}$ and $\{2\}\subseteq\{1,2\}$, so the count in (a) is 5. The sets $\{1\}$ and $\{2\}$ are not comparable, so (b) is 1. Because of this pair, the value in (c) is 0.'
          - problem: 'On $X=\{1,2,3,4\}$ let $x\sim y$ hold when $x-y$ is even. Give each truth value as 1 for true and 0 for false. (a) $\sim$ is reflexive. (b) $\sim$ is antisymmetric. (c) $\sim$ is transitive.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 0; c = 1'
            solution_sketch: 'Each difference $x-x=0$ is even, so (a) has the value 1. Both $1\sim 3$ and $3\sim 1$ hold, but $1\ne 3$, so (b) has the value 0. If $x-y$ and $y-z$ are even, then $x-z$ is even, so (c) has the value 1.'
          - problem: 'A relation on a set is a set of pairs. It is reflexive when each element is paired with itself. It is antisymmetric when $(x,y)$ and $(y,x)$ in the relation force $x=y$. It is transitive when $(x,y)$ and $(y,z)$ in the relation force $(x,z)$. For each relation, count how many of these three properties hold. (a) $\{(1,1),(2,2),(3,3)\}$ on $\{1,2,3\}$. (b) $\{(1,2),(2,3)\}$ on $\{1,2,3\}$. (c) $\{(1,1),(2,2),(1,2),(2,1)\}$ on $\{1,2,3\}$. (d) $\{(1,1),(2,2),(3,3),(1,2),(2,3),(1,3)\}$ on $\{1,2,3\}$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}}]}
            answer: 'a = 3; b = 1; c = 1; d = 3'
            solution_sketch: 'In (a), all three properties hold, so the count is 3. In (b), only antisymmetry holds, because $(1,1)$ and $(1,3)$ are missing, so the count is 1. In (c), only transitivity holds, because $(3,3)$ is missing and $(1,2),(2,1)$ break antisymmetry, so the count is 1. In (d), all three properties hold, so the count is 3.'
          # source: FoM exercise 3.2-3-13
          - problem: 'Define $f\le g$ for functions $f,g$ from $\mathbb{N}$ to $\mathbb{N}$ to mean $f(n)\le g(n)$ for every $n$ in $\mathbb{N}$. Prove (a) that this relation obeys the three order properties for these functions. (b) Decide whether this order is total, and prove your decision.'
            answer_contract: {"kind":"written"}
            answer: 'Each order property holds at every input, as it holds for natural numbers. It is not total: the identity and the constant function 7 are incomparable.'
            solution_sketch: 'For (a), use Definition 3.21 and Theorem 3.23 at each input $n$. Reflexivity, antisymmetry and transitivity hold for the values $f(n)$, and antisymmetry gives equal functions. For (b), take $f(n)=n$ and $g(n)=7$. Then $f(1)\le g(1)$ but $f(10)>g(10)$, so neither $f\le g$ nor $g\le f$ holds. The order is not total.'
        constraints: 'reflexive, antisymmetric, transitive and total for small relations given by pairs'
      - id: kp4
        name: 'Example 3.22 and Theorem 3.23: abstract orders and the order of the natural numbers'
        key_prerequisites: []
        exemplars:
          - problem: 'Take the set $X=\{a,b,c\}$ and the relation $R=\{(x,x):x\in X\}$. (a) Count the pairs in $R$. (b) Give the truth value of ''every two elements of $X$ are comparable'' as 1 for true and 0 for false. (c) Give the truth value of ''$R$ is antisymmetric'' as 1 for true and 0 for false.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 3; b = 0; c = 1'
            solution_sketch: 'The relation $R$ holds one pair for each element, so the count is 3. The elements $a$ and $b$ are not paired, so the value in (b) is 0. A pair $(x,y)$ with its reverse forces $x=y$, so the value in (c) is 1.'
          - problem: 'Order the sets $\emptyset$, $\{1\}$, $\{2\}$ and $\{1,2\}$ by containment $\subseteq$. (a) Count the pairs $(A,B)$ of these sets with $A\subseteq B$. (b) Count the unordered pairs of different sets that are not comparable. (c) Give the truth value of ''every two of these sets are comparable'' as 1 for true and 0 for false.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 9; b = 1; c = 0'
            solution_sketch: 'The empty set lies in 4 sets, $\{1\}$ lies in 2, $\{2\}$ lies in 2 and $\{1,2\}$ lies in 1. The sum is 9. Only $\{1\}$ and $\{2\}$ are not comparable, so (b) is 1 and (c) is 0.'
          - problem: 'In this item, $\mathbb{N}$ starts at 1. Check transitivity of $\le$ on $\mathbb{N}$ with $x=2$, $y=5$ and $z=11$. (a) Give the $d$ with $x+d=y$. (b) Give the $e$ with $y+e=z$. (c) Give the number $d+e$ with $x+(d+e)=z$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 3; b = 6; c = 9'
            solution_sketch: 'In (a), $2+3=5$, so $d=3$. In (b), $5+6=11$, so $e=6$. In (c), $d+e=3+6=9$, and $2+9=11$, so $x<z$.'
          - problem: 'Take $\le$ on $\mathbb{N}$ and the pairs $x,y$ in $\{1,2,3,4,5\}$. Count the pairs $(x,y)$ for each case. (a) $x\le y$. (b) $x<y$. (c) $x\le y$ and $y\le x$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 15; b = 10; c = 5'
            solution_sketch: 'For $x\le y$, the value $x=k$ pairs with $6-k$ values of $y$, so the count is $5+4+3+2+1=15$. Remove the 5 pairs with $x=y$ to get 10 for (b). The pairs in (c) need $x=y$, so the count is 5.'
          - problem: 'In this item, $\mathbb{N}$ starts at 1. Give each truth value as 1 for true and 0 for false. (a) For all $x,y$ in $\mathbb{N}$: if $x\le y$ and $y\le x$, then $x=y$. (b) For some $x,y$ in $\mathbb{N}$: $x<y$ and $y<x$. (c) For some $x$ in $\mathbb{N}$: $x<x$. (d) For all $x,y$ in $\mathbb{N}$: $x\le y$ or $y\le x$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 0; c = 0; d = 1'
            solution_sketch: 'Statement (a) is antisymmetry, so its value is 1. Statements (b) and (c) give $x+d=x$ for some $d$, which is impossible, so their values are 0. Statement (d) is totality, so its value is 1.'
          - problem: 'In this item, $\mathbb{N}$ starts at 1. Define $n\sqsubseteq m$ to mean $n=m$ or $n+5\le m$. (a) Give the truth value of $3\sqsubseteq 8$ as 1 for true and 0 for false. (b) Give the truth value of $3\sqsubseteq 7$ as 1 for true and 0 for false. (c) Count the numbers $m$ in $\{1,\ldots,12\}$ with $2\sqsubseteq m$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 0; c = 7'
            solution_sketch: 'In (a), $3+5\le 8$, so the value is 1. In (b), $3\ne 7$ and $8\le 7$ is false, so the value is 0. In (c), $m=2$ qualifies, and so do $m=7,8,9,10,11,12$, so the count is 7.'
          # argument: Theorem 3.23
          - problem: 'Prove: the usual order $\le$ of $\mathbb{N}$ obeys the three order properties, and any two numbers are comparable.'
            answer_contract: {"kind":"written"}
            answer: 'Check reflexivity, antisymmetry and transitivity from the definition of the order. Use the trichotomy condition for antisymmetry and for totality.'
            solution_sketch: 'Reflexivity holds because $x=x$. For antisymmetry, assume $x\ne y$, $x+d=y$ and $y+e=x$. Then $y+(e+d)=y$, and Theorem 3.16 forbids that. For transitivity, add the two witnesses: $x+d=y$ and $y+e=z$ give $x+(d+e)=z$. For totality, Theorem 3.16 gives $x=y$, $x<y$ or $y<x$.'
          # source: FoM exercise 3.2-3-14
          - problem: 'Let $n\sqsubseteq m$ hold for $n,m$ in $\mathbb{N}$ when $n=m$ or $n+5\le m$. Prove (a) that $\sqsubseteq$ is an order relation on $\mathbb{N}$. (b) Decide whether $\sqsubseteq$ is a total order, and prove your decision.'
            answer_contract: {"kind":"written"}
            answer: 'Check the three order properties with the usual order, using Theorem 3.23. The order is not total, because 1 and 3 are incomparable.'
            solution_sketch: 'Reflexivity holds by the case $n=m$. For antisymmetry, assume $n\sqsubseteq m$ and $m\sqsubseteq n$ with $n\ne m$. Then $n+5\le m$ and $m+5\le n$, which gives $n+10\le n$ by Theorem 3.23. This contradicts Theorem 3.16. For transitivity, add the gaps of 5 to get a gap of at least 5. The numbers 1 and 3 give neither $1\sqsubseteq 3$ nor $3\sqsubseteq 1$.'
        constraints: 'identity relation and containment as orders; the three order properties of the order on the natural numbers'
      - id: kp5
        name: 'Theorem 3.24: the order and the operations of addition and multiplication'
        key_prerequisites: [fom-2-6-axiom-infinity-natural-numbers]
        exemplars:
          - problem: 'In this item, $\mathbb{N}$ starts at 1. Take $x=4$, $y=9$ and $z=5$. (a) Compute $x+z$. (b) Compute $y+z$. (c) Give the truth value of $x+z\le y+z$ as 1 for true and 0 for false.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 9; b = 14; c = 1'
            solution_sketch: 'The sum $x+z$ is $4+5=9$. The sum $y+z$ is $9+5=14$. Because $9\le 14$, the value in (c) is 1.'
          - problem: 'In this item, $\mathbb{N}$ starts at 1. Take $x=3$, $y=8$ and $z=6$. (a) Compute $xz$. (b) Compute $yz$. (c) Give the number $d$ with $xz+d=yz$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 18; b = 48; c = 30'
            solution_sketch: 'The product $xz$ is $3\cdot 6=18$. The product $yz$ is $8\cdot 6=48$. Then $d=48-18=30$, so $xz\le yz$.'
          - problem: 'In this item, $\mathbb{N}$ starts at 1. Give each truth value as 1 for true and 0 for false. (a) For all $x,y,z$ in $\mathbb{N}$: if $x\le y$, then $x+z\le y+z$. (b) For all $x,y,z$ in $\mathbb{N}$: if $x<y$, then $xz<yz$. (c) For all $x,y,z$ in $\mathbb{N}$: if $x\le y$, then $xz\le y$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 1; c = 0'
            solution_sketch: 'Statement (a) is part 1 of Theorem 3.24, so its value is 1. Statement (b) is the strict form of part 2, and $z\ge 1$ keeps the gap, so its value is 1. In (c), take $x=2$, $y=2$ and $z=3$. Then $xz=6$ and $6\le 2$ is false, so the value is 0.'
          - problem: 'In this item, $\mathbb{N}$ starts at 1. Take $x=5$ and $y=12$. (a) Give the $d$ with $x+d=y$. (b) For $z=4$, compute $zd$. (c) For $z=4$, compute $yz$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 7; b = 28; c = 48'
            solution_sketch: 'In (a), $5+7=12$, so $d=7$. In (b), $zd=4\cdot 7=28$. In (c), $yz=12\cdot 4=48$, and $xz+zd=20+28=48$, as the proof of part 2 requires.'
          - problem: 'In this item, $\mathbb{N}$ starts at 1. Count the numbers $z$ in $\{1,\ldots,10\}$ with each property. (a) $3z\le 17$. (b) $5+z\le 9$. (c) $z+3\le 2z$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 5; b = 4; c = 8'
            solution_sketch: 'In (a), $z\le 5$ gives the count 5. In (b), $z\le 4$ gives the count 4. In (c), the inequality means $3\le z$, so $z$ runs from 3 to 10 and the count is 8.'
          - problem: 'In this item, $\mathbb{N}$ starts at 1. Give the least number in $\mathbb{N}$ for each part. (a) The least $z$ with $20\le 6z$. (b) The least $z$ with $50\le 7+z$. (c) The least $n$ with $100\le 3n$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 4; b = 43; c = 34'
            solution_sketch: 'In (a), $6\cdot 3=18$ is too small and $6\cdot 4=24$ works, so $z=4$. In (b), $7+z\ge 50$ means $z\ge 43$. In (c), $3\cdot 33=99$ is too small and $3\cdot 34=102$ works, so $n=34$.'
          # argument: Theorem 3.24
          - problem: 'Prove: if $x,y,z$ are in $\mathbb{N}$ and $x\le y$, then $x+z\le y+z$.'
            answer_contract: {"kind":"written"}
            answer: 'If x equals y, the sums are equal. If x + d = y, then (x + z) + d = y + z by associativity and commutativity.'
            solution_sketch: 'Use Definition 3.20. If $x=y$, then $x+z=y+z$. Otherwise there is a $d$ in $\mathbb{N}$ with $x+d=y$. Then $(x+z)+d=x+(z+d)=x+(d+z)=(x+d)+z=y+z$. So $x+z<y+z$, and in particular $x+z\le y+z$.'
          # source: FoM exercise 3.2-3-11
          - problem: 'Prove part 2 of Theorem 3.24: multiplying both sides of an inequality by a number $z$ in $\mathbb{N}$ keeps the inequality.'
            answer_contract: {"kind":"written"}
            answer: 'If x equals y, the products are equal. If x + d = y, then xz + dz = yz by distributivity, so xz < yz.'
            solution_sketch: 'Use Definition 3.20 and Theorem 3.24. If $x=y$, then $xz=yz$. Otherwise there is a $d$ in $\mathbb{N}$ with $x+d=y$. Distributivity gives $yz=(x+d)z=xz+dz$. Hence $xz<yz$ with the witness $dz$, and $xz\le yz$.'
          # source: FoM exercise 3.2-3-15
          - problem: 'Build $\mathbb{N}$ from sets. The number 1 is the set $\{\emptyset\}$. The successor of a number $n$ is the set $n\cup\{n\}$. So every number is a set. Let $n\sqsubseteq m$ mean that the set $n$ is contained in the set $m$. Prove: for $n,m$ in $\mathbb{N}$, $n\le m$ holds if and only if $n\sqsubseteq m$.'
            answer_contract: {"kind":"written"}
            answer: 'Use induction on m. The successor of m is m together with m as an element, so containment follows the order step by step.'
            solution_sketch: 'Use the construction of Theorem 2.64, where $1=\{\emptyset\}$ and the successor of $m$ is $m\cup\{m\}$. For the forward direction, induct on $d$ in $n+d=m$ and note that each successor step adds a set. For the reverse direction, induct on $m$. The case $m=1$ leaves only $n=1$. For the step, a subset of $m\cup\{m\}$ either lies in $m$ or contains the element $m$, and both cases give $n\le m+1$.'
        constraints: 'compute sums and products on both sides of an inequality; the witness of a product inequality'
