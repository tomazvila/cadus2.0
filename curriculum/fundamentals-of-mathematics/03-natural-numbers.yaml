      - id: kp1
        name: 'Definition 3.1, Definition 3.3, Proposition 3.4 and Proposition 3.6: binary operations, addition, associativity and commutativity'
        key_prerequisites: [fom-2-6-axiom-infinity-natural-numbers]
        exemplars:
          - problem: 'A binary operation on a set sends each ordered pair of elements of the set to one element of the same set. Give 1 if the rule is a binary operation on $\mathbb{N}$ and 0 if not. Here $\mathbb{N}$ starts at 1. (a) $m\ast n=m+n$. (b) $m\ast n=m-n$. (c) $m\ast n=\gcd(m,n)$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 0; c = 1'
            solution_sketch: 'The sum of two natural numbers is a natural number, so (a) gets 1. For $m=n=1$ the difference is $0$, which is not in the set, so (b) gets 0. The gcd of two natural numbers is a natural number, so (c) gets 1.'
          - problem: 'Use $n+1=n''$ and $n+m''=(n+m)''$. Write $2=1+1$, $3=2+1$ and $4=3+1$. (a) Give $4+1$. (b) Give $4+2$. (c) Give $4+3$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 5; b = 6; c = 7'
            solution_sketch: 'By the first rule $4+1=4''=5$. Then $4+2=4+1''=(4+1)''=5''=6$. Then $4+3=4+2''=(4+2)''=6''=7$. So a = 5, b = 6 and c = 7.'
          - problem: 'Let $n=7$, $m=2$ and $k=5$. (a) Give $(n+m)+k$. (b) Give $n+(m+k)$. (c) Give $m+n$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 14; b = 14; c = 9'
            solution_sketch: 'First $n+m=9$, and then $9+5=14$, so a = 14. Next $m+k=7$, and then $7+7=14$, so b = 14. Last $m+n=2+7=9$, so c = 9. Associativity and commutativity give equal values.'
          - problem: 'A rule $\ast$ is commutative when $m\ast n=n\ast m$ for all natural numbers. Give 1 if the rule is commutative and 0 if not. (a) $m\ast n=m+n$. (b) $m\ast n=m^n$. (c) $m\ast n=m$. (d) $m\ast n=m+n+mn$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 0; c = 0; d = 1'
            solution_sketch: 'Addition is commutative, so (a) gets 1. For (b), $2^3=8$ and $3^2=9$, so (b) gets 0. For (c), $1\ast 2=1$ and $2\ast 1=2$, so (c) gets 0. For (d), the sum $m+n+mn$ is unchanged when $m$ and $n$ swap, so (d) gets 1.'
          - problem: 'Let $m^n$ be the power of $m$ with exponent $n$. (a) Give $(2^3)^2$. (b) Give $2^{(3^2)}$. (c) Give 1 if the operation $m\ast n=m^n$ is associative and 0 if not.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 64; b = 512; c = 0'
            solution_sketch: 'First $2^3=8$ and $8^2=64$, so a = 64. Next $3^2=9$ and $2^9=512$, so b = 512. The two values differ, so the operation is not associative and c = 0.'
          - problem: 'A rule $\ast$ is associative when $(m\ast n)\ast k=m\ast(n\ast k)$ for all natural numbers. Give 1 if the rule is associative and 0 if not. (a) $m\ast n=\max(m,n)$. (b) $m\ast n=mn+1$. (c) $m\ast n=m+n$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 0; c = 1'
            solution_sketch: 'Both groupings of $\max(m,n,k)$ give the largest of the three numbers, so (a) gets 1. For (b), $(1\ast 2)\ast 3=3\ast 3=10$ and $1\ast(2\ast 3)=1\ast 7=8$, so (b) gets 0. Addition is associative, so (c) gets 1.'
          - problem: 'In the sum rule, $((n,m''),k'')$ is in the relation exactly when $((n,m),k)$ is in the relation. The pair $((6,1),7)$ is in the relation. (a) Give $k$ with $((6,2),k)$ in the relation. (b) Give $k$ with $((6,3),k)$ in the relation. (c) Give $k$ with $((6,5),k)$ in the relation.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 8; b = 9; c = 11'
            solution_sketch: 'The rule moves from $((6,m),k)$ to $((6,m''),k'')$. So $((6,2),8)$ is in the relation, then $((6,3),9)$. Each further step adds 1 to both numbers, so $((6,5),11)$ is in the relation. The values are 8, 9 and 11.'
          # source: FoM exercise 3.1-3-1
          - problem: 'State the laws for a binary operation $\circ$ on a set $S$ and a second binary operation $\ast$ on $S$. Give the equation for each of these laws. (a) $\circ$ is associative. (b) $\circ$ is commutative. (c) $e\in S$ is a neutral element for $\circ$. (d) $\circ$ is left distributive over $\ast$. (e) $\circ$ is right distributive over $\ast$.'
            answer_contract: {"kind":"written"}
            answer: 'Each law is an equation that holds for all elements: grouping, order, a neutral element, and the two forms of distributing.'
            solution_sketch: 'Associative: $(a\circ b)\circ c=a\circ(b\circ c)$ for all $a,b,c$. Commutative: $a\circ b=b\circ a$ for all $a,b$. Neutral element: $e\circ a=a\circ e=a$ for all $a$. Left distributive: $a\circ(b\ast c)=(a\circ b)\ast(a\circ c)$. Right distributive: $(b\ast c)\circ a=(b\circ a)\ast(c\circ a)$.'
          # argument: Proposition 3.4
          - problem: 'Prove the first step: for all $n,m\in\mathbb{N}$ there is some $k\in\mathbb{N}$ with $n+m=k$ by the rules $n+1=n''$ and $n+m''=(n+m)''$.'
            answer_contract: {"kind":"written"}
            answer: 'Fix n and induct on m. The case m = 1 gives n'', and a sum k for m gives the sum k'' for m''.'
            solution_sketch: 'Fix $n$ and let $S$ be the set of $m$ that have a sum with $n$. Definition 3.3 gives $n+1=n''$, so $1\in S$. Let $m\in S$ with sum $k$. Then $n+m''=(n+m)''=k''$, so $m''\in S$. The Principle of Induction in Theorem 2.64 gives $S=\mathbb{N}$.'
          # argument: Proposition 3.4
          - problem: 'Prove the second step: for all $n,m\in\mathbb{N}$ the sum $n+m$ is a single number. Use the rules $n+1=n''$ and $n+m''=(n+m)''$.'
            answer_contract: {"kind":"written"}
            answer: 'Fix n and induct on m. A sum for m'' must be the successor of the single sum for m.'
            solution_sketch: 'Fix $n$ and let $S$ be the set of $m$ with exactly one sum. Definition 3.3 gives only the pair $((n,1),n'')$ for $m=1$, so $1\in S$. Let $m\in S$ with the sum $k$. A sum for $m''$ has the form $j''$ where $j$ is a sum for $m$, so $j=k$. Hence $m''$ has the single sum $k''$. Theorem 2.64 gives $S=\mathbb{N}$.'
          # argument: Proposition 3.6
          - problem: 'Prove: addition on $\mathbb{N}$ is associative. That is, $(n+m)+k=n+(m+k)$ for all $n,m,k\in\mathbb{N}$.'
            answer_contract: {"kind":"written"}
            answer: 'Fix n and m and induct on k. The case k = 1 follows from the sum rules, and the step adds one successor on both sides.'
            solution_sketch: 'Fix $n,m$ and let $S$ be the set of $k$ with $(n+m)+k=n+(m+k)$. For $k=1$, the rules of Definition 3.3 turn $(n+m)+1$ into $(n+m)''$ and then into $n+m''$ and $n+(m+1)$, so $1\in S$. Let $k\in S$. Then $(n+m)+k''=((n+m)+k)''=(n+(m+k))''=n+(m+k)''=n+(m+k'')$. Hence $k''\in S$ and Theorem 2.64 gives $S=\mathbb{N}$.'
          # argument: Proposition 3.6
          - problem: 'Prove: addition on $\mathbb{N}$ is commutative. That is, $n+m=m+n$ for all $n,m\in\mathbb{N}$. Start with the lemma $1+n=n''$.'
            answer_contract: {"kind":"written"}
            answer: 'Prove 1 + n = n'' by induction. Then induct on m: the step uses associativity and the lemma.'
            solution_sketch: 'Let $T$ be the set of $n$ with $1+n=n''$. Then $1+1=1''$, and from $1+n=n''$ we get $1+n''=(1+n)''=n''''$, so $T=\mathbb{N}$ by Theorem 2.64. Fix $n$ and let $S$ be the set of $m$ with $n+m=m+n$. Then $n+1=n''=1+n$ gives $1\in S$. For $m\in S$ we get $n+m''=(n+m)''=(m+n)''=m+n''=m+(n+1)=(m+n)+1$, and also $m''+n=(m+1)+n=m+(1+n)$, which equals the same value by associativity and the lemma.'
        constraints: 'binary operations, the recursive rules of addition, and the laws of addition'
      - id: kp2
        name: 'Definition 3.7, Proposition 3.8, Definition 3.9 and Proposition 3.10: numerals, sums, products and equations in the natural numbers'
        key_prerequisites: []
        exemplars:
          - problem: 'Let $2=1+1$, $3=2+1$, $4=3+1$, $5=4+1$, $6=5+1$ and $7=6+1$. (a) Give the numeral that equals $4+1$. (b) Give the numeral that equals $(1+1)+1$. (c) Give the numeral $n$ with $n+1=6$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 5; b = 3; c = 5'
            solution_sketch: 'By the definition of $5$, we have $4+1=5$. By the definition of $3$, we have $(1+1)+1=2+1=3$. Since $5+1=6$, the numeral is $5$. So a = 5, b = 3 and c = 5.'
          - problem: 'Take $2=1+1$, $3=2+1$ and so on. Give the numeral for each sum. (a) $2+2$. (b) $3+2$. (c) $4+4$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 4; b = 5; c = 8'
            solution_sketch: 'Write $2+2=2+(1+1)=(2+1)+1=3+1=4$. Write $3+2=(3+1)+1=4+1=5$. Count four steps of $+1$ from $4$ to get $4+4=8$. So a = 4, b = 5 and c = 8.'
          - problem: 'Use $n\cdot 1=n$ and $n\cdot m''=n\cdot m+n$. (a) Give $5\cdot 1$. (b) Give $5\cdot 2$. (c) Give $5\cdot 3$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 5; b = 10; c = 15'
            solution_sketch: 'The first rule gives $5\cdot 1=5$. Then $5\cdot 2=5\cdot 1+5=10$. Then $5\cdot 3=5\cdot 2+5=15$. So a = 5, b = 10 and c = 15.'
          - problem: 'Use $n\cdot m''=n\cdot m+n$. Assume $7\cdot 5=35$. (a) Give $7\cdot 6$. (b) Give $7\cdot 7$. (c) Give $7\cdot 8$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 42; b = 49; c = 56'
            solution_sketch: 'Each step in the second factor adds $7$. So $7\cdot 6=35+7=42$. Then $7\cdot 7=42+7=49$. Then $7\cdot 8=49+7=56$.'
          - problem: 'A new product $\odot$ on $\mathbb{N}$ uses $n\odot 1=n$ and $n\odot m''=(n\odot m)+n+1$. (a) Give $2\odot 1$. (b) Give $2\odot 2$. (c) Give $2\odot 3$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 2; b = 5; c = 8'
            solution_sketch: 'The first rule gives $2\odot 1=2$. Then $2\odot 2=2+2+1=5$. Then $2\odot 3=5+2+1=8$. So a = 2, b = 5 and c = 8.'
          # source: FoM exercise 3.1-3-8
          - problem: 'Natural numbers start at 1. Solve each equation in $\mathbb{N}$. Give the solution, or give 0 when no natural number solves the equation. (a) $x+2=6$. (b) $x+6=2$. (c) $2x+5=9$. (d) $3x+2=4$. (e) $x^2-1=0$. (f) $x^2-2=0$. (g) $x^2+1=0$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}},{"name":"e","contract":{"kind":"exact"}},{"name":"f","contract":{"kind":"exact"}},{"name":"g","contract":{"kind":"exact"}}]}
            answer: 'a=4;b=0;c=2;d=0;e=1;f=0;g=0'
            solution_sketch: 'In (a), $x=4$. In (b), $x=-4$, which is not natural, so b = 0. In (c), $2x=4$ gives $x=2$. In (d), $3x=2$ gives no natural number, so d = 0. In (e), $x=1$ is the only natural root, so e = 1. In (f) the roots are not natural and in (g) there is no real root, so f = 0 and g = 0.'
          # argument: Proposition 3.8
          - problem: 'Prove: $4+3=7$ with $2=1+1$, $3=2+1$, $4=3+1$, $5=4+1$, $6=5+1$ and $7=6+1$.'
            answer_contract: {"kind":"written"}
            answer: 'Rewrite 3 as 2 + 1 and 2 as 1 + 1. Use associativity step by step until the sum reads 6 + 1.'
            solution_sketch: 'Write $4+3=4+(2+1)=(4+2)+1$ by the definition of $3$ and associativity. Next $4+2=4+(1+1)=(4+1)+1=5+1=6$. Then $(4+2)+1=6+1=7$ by the definition of $7$. Proposition 3.6 gives the associativity in each step.'
          # argument: Proposition 3.10
          - problem: 'Prove the first step: for all $n,m\in\mathbb{N}$ the product $n\cdot m$ has a value, with the rules $n\cdot 1=n$ and $n\cdot m''=n\cdot m+n$.'
            answer_contract: {"kind":"written"}
            answer: 'Fix n and induct on m. The case m = 1 gives n, and the step adds n to the value for m.'
            solution_sketch: 'Fix $n$ and let $S$ be the set of $m$ for which $n\cdot m$ has a value. The first rule gives $1\in S$. If $m\in S$, then $n\cdot m''=n\cdot m+n$ is a sum of natural numbers, so it exists by Proposition 3.4. Hence $m''\in S$. The Principle of Induction gives $S=\mathbb{N}$.'
          # argument: Proposition 3.10
          - problem: 'Prove the second step: for all $n,m\in\mathbb{N}$ the product $n\cdot m$ has only one value, with the rules $n\cdot 1=n$ and $n\cdot m''=n\cdot m+n$.'
            answer_contract: {"kind":"written"}
            answer: 'Fix n and induct on m. The value for m'' is the single value for m plus n.'
            solution_sketch: 'Fix $n$ and let $S$ be the set of $m$ with exactly one product. The pair for $m=1$ holds only $n$, so $1\in S$. If $m\in S$ has the product $k$, then a product for $m''$ must be $k+n$ by the second rule. Proposition 3.4 states that the sum $k+n$ is single. Hence $m''\in S$ and $S=\mathbb{N}$.'
          # source: FoM exercise 3.1-3-3
          - problem: 'Prove: the rules $n\cdot 1=n$ and $n\cdot m''=n\cdot m+n$ give exactly one natural number for each pair $n,m$. Follow the pattern of the proof for addition.'
            answer_contract: {"kind":"written"}
            answer: 'Fix n and induct on m. Existence and a single value both follow from the sum being a binary operation.'
            solution_sketch: 'Fix $n$ and let $S$ be the set of $m$ for which exactly one value of $n\cdot m$ exists. The case $m=1$ gives only $n$. For the step, the value of $n\cdot m''$ must be $(n\cdot m)+n$, and Proposition 3.4 makes this sum exist and be single. The Principle of Induction gives $S=\mathbb{N}$. This is the content of Proposition 3.10.'
          # source: FoM exercise 3.1-3-2
          - problem: 'Use $2=1+1$, $3=2+1$, $4=3+1$, $5=4+1$, $6=5+1$ and so on, with the laws of addition on $\mathbb{N}$. Prove each equation. (a) $3+4=7$. (b) $2+2=4$. (c) $2+5=7$. (d) $4+4=8$.'
            answer_contract: {"kind":"written"}
            answer: 'Split the second summand with the numeral rules. Then use associativity until one numeral plus 1 remains.'
            solution_sketch: 'For (a), $3+4=3+(3+1)=(3+3)+1$, and $3+3=(3+2)+1=((3+1)+1)+1=6$, so the sum is $6+1=7$. For (b), $2+2=2+(1+1)=(2+1)+1=3+1=4$. For (c), $2+5=2+(4+1)=(2+4)+1$, and $2+4=(2+3)+1$, with $2+3=(2+2)+1=5$, so $2+4=6$ and the sum is 7. For (d), $4+4=4+(3+1)=(4+3)+1=7+1=8$, using Proposition 3.8. Definition 3.7 gives each numeral.'
          # source: FoM exercise 3.1-3-4
          - problem: 'Use $2=1+1$, $3=2+1$, $4=3+1$ and so on, with the laws of addition and the rules of multiplication on $\mathbb{N}$. Prove each equation. (a) $2\cdot 3=6$. (b) $4\cdot 2=8$. (c) $3\cdot 4=12$.'
            answer_contract: {"kind":"written"}
            answer: 'Apply n times m'' = n times m plus n to build up the product. Then add with the numeral rules.'
            solution_sketch: 'For (a), $2\cdot 3=2\cdot 2+2=(2\cdot 1+2)+2=(2+2)+2=4+2=6$. For (b), $4\cdot 2=4\cdot 1+4=4+4=8$ by Proposition 3.8 style addition. For (c), $3\cdot 4=3\cdot 3+3=(3\cdot 2+3)+3$, and $3\cdot 2=3+3=6$, so $3\cdot 4=(6+3)+3=9+3=12$. Definition 3.7 gives each numeral.'
        constraints: 'numerals as repeated successors, recursive products, and equations over the natural numbers'
      - id: kp3
        name: 'Proposition 3.12, Proposition 3.13, Proposition 3.14 and Proposition 3.15: laws of multiplication and distributivity'
        key_prerequisites: []
        exemplars:
          - problem: 'Let $n=3$, $m=4$ and $k=5$. (a) Give $(n+m)\cdot k$. (b) Give $n\cdot k+m\cdot k$. (c) Give $n\cdot(m+k)$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 35; b = 35; c = 27'
            solution_sketch: 'First $n+m=7$ and $7\cdot 5=35$, so a = 35. Next $n\cdot k=15$ and $m\cdot k=20$, and the sum is 35, so b = 35. Last $m+k=9$ and $3\cdot 9=27$, so c = 27.'
          - problem: 'The number 1 is neutral for multiplication. (a) Give $1\cdot 12$. (b) Give $12\cdot 1$. (c) Give the number $e$ with $7\cdot e=7$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 12; b = 12; c = 1'
            solution_sketch: 'The neutral element leaves each number unchanged on both sides. So $1\cdot 12=12$ and $12\cdot 1=12$. Also $7\cdot 1=7$, so e = 1.'
          - problem: 'Natural numbers $n$, $m$ and $k$ are arbitrary. Give 1 if the equation holds for all natural numbers and 0 if not. (a) $(n+m)\cdot k=n\cdot k+m\cdot k$. (b) $n\cdot(m+k)=n\cdot m+k$. (c) $(n\cdot m)\cdot k=n\cdot(m\cdot k)$. (d) $n+(m\cdot k)=(n+m)\cdot(n+k)$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 0; c = 1; d = 0'
            solution_sketch: 'Equation (a) is right distributivity and (c) is associativity, so both get 1. For (b) take $n=2$, $m=1$, $k=1$: the left side is $4$ and the right side is $3$, so (b) gets 0. For (d) take $n=m=k=1$: the left side is $2$ and the right side is $4$, so (d) gets 0.'
          - problem: 'Multiply out the product and count the products of two letters in the full sum. (a) $(a+b)(c+d)$. (b) $(a+b)((c+d)+e)$. (c) $(a+b+c)(d+e)$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 4; b = 6; c = 6'
            solution_sketch: 'Each summand of the first factor meets each summand of the second factor. In (a) that is $2\cdot 2=4$ products. In (b) it is $2\cdot 3=6$ products. In (c) it is $3\cdot 2=6$ products.'
          - problem: 'Let $a=1$, $b=2$, $c=3$ and $d=4$. (a) Give $(a+b)(c+d)$. (b) Give $ac+ad$. (c) Give $bc+bd$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 21; b = 7; c = 14'
            solution_sketch: 'First $a+b=3$ and $c+d=7$, so a = 21. Next $ac+ad=3+4=7$, so b = 7. Last $bc+bd=6+8=14$, so c = 14. The sum $7+14$ equals 21, as the expansion states.'
          - problem: 'Find the natural number $n$ in each equation. (a) $n\cdot(2+5)=35$. (b) $3\cdot(n+4)=27$. (c) $(n+1)\cdot 4=20$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 5; b = 5; c = 4'
            solution_sketch: 'In (a), $2+5=7$ and $5\cdot 7=35$, so n = 5. In (b), $27/3=9$ and $9-4=5$, so n = 5. In (c), $20/4=5$ and $5-1=4$, so n = 4.'
          - problem: 'Let $a=1$, $b=2$, $c=3$, $d=4$ and $e=5$. (a) Give $(a+b)((c+d)+e)$. (b) Give $ac+ad+ae$. (c) Give $bc+bd+be$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 36; b = 12; c = 24'
            solution_sketch: 'First $c+d+e=12$ and $3\cdot 12=36$, so a = 36. Next $3+4+5=12$, so b = 12. Last $6+8+10=24$, so c = 24. The sums 12 and 24 add to 36.'
          # argument: Proposition 3.12
          - problem: 'Prove: multiplication on $\mathbb{N}$ is associative. That is, $(n\cdot m)\cdot k=n\cdot(m\cdot k)$ for all $n,m,k\in\mathbb{N}$.'
            answer_contract: {"kind":"written"}
            answer: 'Induct on k with n and m fixed. The step needs right distributivity to split the product.'
            solution_sketch: 'Fix $n,m$ and let $S$ be the set of $k$ with $(n\cdot m)\cdot k=n\cdot(m\cdot k)$. For $k=1$ both sides equal $n\cdot m$. For the step, $(n\cdot m)\cdot k''=(n\cdot m)\cdot k+n\cdot m=n\cdot(m\cdot k)+n\cdot m$. Left distributivity makes this $n\cdot(m\cdot k+m)=n\cdot(m\cdot k'')$. This part uses Proposition 3.13 and Proposition 3.14.'
          # argument: Proposition 3.12
          - problem: 'Prove: multiplication on $\mathbb{N}$ is commutative. That is, $n\cdot m=m\cdot n$ for all $n,m\in\mathbb{N}$. Start with the lemma $1\cdot n=n$.'
            answer_contract: {"kind":"written"}
            answer: 'Prove 1 times n equals n by induction. Then induct on m, with right distributivity for the step.'
            solution_sketch: 'Let $T$ be the set of $n$ with $1\cdot n=n$. Then $1\cdot 1=1$, and $1\cdot n''=1\cdot n+1=n+1=n''$, so $T=\mathbb{N}$. Fix $n$ and let $S$ be the set of $m$ with $n\cdot m=m\cdot n$. Then $n\cdot 1=n=1\cdot n$ gives $1\in S$. For the step, $n\cdot m''=n\cdot m+n=m\cdot n+1\cdot n=(m+1)\cdot n=m''\cdot n$ by right distributivity.'
          # argument: Proposition 3.12
          - problem: 'Prove: the number 1 leaves each natural number unchanged under multiplication on either side. That is, $n\cdot 1=1\cdot n=n$ for all $n\in\mathbb{N}$.'
            answer_contract: {"kind":"written"}
            answer: 'The rule n times 1 equals n gives one side. Induction on n gives 1 times n equals n.'
            solution_sketch: 'The first rule of Definition 3.9 gives $n\cdot 1=n$. For the other side, let $S$ be the set of $n$ with $1\cdot n=n$. Then $1\cdot 1=1$, so $1\in S$. If $n\in S$, then $1\cdot n''=1\cdot n+1=n+1=n''$, so $n''\in S$. Theorem 2.64 gives $S=\mathbb{N}$.'
          # argument: Proposition 3.13
          - problem: 'Prove: for all $n,m,k\in\mathbb{N}$ we have $(n+m)\cdot k=n\cdot k+m\cdot k$.'
            answer_contract: {"kind":"written"}
            answer: 'Induct on k with n and m fixed. The step regroups four summands with the laws of addition.'
            solution_sketch: 'Fix $n,m$ and let $S$ be the set of $k$ with $(n+m)\cdot k=n\cdot k+m\cdot k$. For $k=1$ both sides equal $n+m$. For the step, $(n+m)\cdot k''=(n+m)\cdot k+(n+m)=(n\cdot k+m\cdot k)+(n+m)$. Regroup with Proposition 3.6 into $(n\cdot k+n)+(m\cdot k+m)=n\cdot k''+m\cdot k''$. Then $S=\mathbb{N}$. Proposition 3.12 lists the later laws that use this result.'
          # argument: Proposition 3.14
          - problem: 'Prove: for all $n,m,k\in\mathbb{N}$ we have $n\cdot(m+k)=n\cdot m+n\cdot k$.'
            answer_contract: {"kind":"written"}
            answer: 'Swap the factors with commutativity, use right distributivity, and swap back.'
            solution_sketch: 'Start with $n\cdot(m+k)=(m+k)\cdot n$ by commutativity of multiplication. Right distributivity gives $m\cdot n+k\cdot n$. Commutativity again gives $n\cdot m+n\cdot k$. This uses Proposition 3.12 and Proposition 3.13.'
          # argument: Proposition 3.15
          - problem: 'Prove: for all $a,b,c,d\in\mathbb{N}$ we have $(a+b)(c+d)=(ac+ad)+(bc+bd)$. Start with left distributivity.'
            answer_contract: {"kind":"written"}
            answer: 'Split the product with left distributivity, then right distributivity twice, then regroup the four terms.'
            solution_sketch: 'Left distributivity gives $(a+b)(c+d)=(a+b)c+(a+b)d$. Right distributivity gives $(ac+bc)+(ad+bd)$. Associativity and commutativity of addition regroup the four terms into $(ac+ad)+(bc+bd)$.'
          # source: FoM exercise 3.1-3-5
          - problem: 'Prove all five parts of Proposition 3.12 in this order. (a) $1\cdot n=n$. (b) $(n+m)\cdot k=n\cdot k+m\cdot k$. (c) $n\cdot m=m\cdot n$. (d) $n\cdot(m+k)=n\cdot m+n\cdot k$. (e) $(n\cdot m)\cdot k=n\cdot(m\cdot k)$.'
            answer_contract: {"kind":"written"}
            answer: 'Use induction for (a), (b) and (e). Parts (c) and (d) follow from (a) and (b) with swapped factors.'
            solution_sketch: 'Part (a) is induction on n. Part (b) is induction on k with associativity of addition. Part (c) is induction on m and uses (a) and (b). Part (d) follows from (b) and (c) by swapping factors. Part (e) is induction on k and uses (d). This order proves Proposition 3.12.'
          # source: FoM exercise 3.1-3-6
          - problem: 'Prove the equation $(a+b)(c+d)=(ac+ad)+(bc+bd)$ in two steps for all $a,b,c,d\in\mathbb{N}$. Use right distributivity once and left distributivity twice.'
            answer_contract: {"kind":"written"}
            answer: 'Right distributivity with k equal to c + d splits the first factor. Then left distributivity splits each part.'
            solution_sketch: 'Right distributivity with $k=c+d$ gives $(a+b)(c+d)=a(c+d)+b(c+d)$. Left distributivity on each part gives $(ac+ad)+(bc+bd)$. Proposition 3.13 and Proposition 3.14 give the two laws. They prove Proposition 3.15 again.'
          # source: FoM exercise 3.1-3-7
          - problem: 'Let $a,b,c,d,e\in\mathbb{N}$. (a) Prove $(a+b)((c+d)+e)=((((ac+ad)+ae)+bc)+bd)+be$. (b) Prove that the full product of a sum of $m$ summands and a sum of $n$ summands has $mn$ products as summands.'
            answer_contract: {"kind":"written"}
            answer: 'Use left and right distributivity to split each factor. Then every summand of one factor meets every summand of the other, so there are mn products.'
            solution_sketch: 'For (a), right distributivity gives $a((c+d)+e)+b((c+d)+e)$. Left distributivity splits each product into three terms, and associativity of addition groups the six terms. For (b), split the first factor one summand at a time with right distributivity. Then split each product with left distributivity, as in Proposition 3.15. Each of the $m$ summands of the first factor meets each of the $n$ summands of the second factor once, so $mn$ products appear.'
        constraints: 'laws of multiplication, distributivity and multiplying out sums'
