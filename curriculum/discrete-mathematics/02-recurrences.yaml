unit: recurrences
course: discrete-mathematics
module: "Recurrences & Generating Functions"
topics:
  - id: recurrence-relations
    name: "Recurrence Relations & Modeling"
    core: true
    difficulty: 0.55
    drill: false
    answer_kind: numeric
    expected_time_secs: 150
    prerequisites:
      - id: function-notation
        weight: 0.6
        key: true
      - id: mathematical-induction
        weight: 0.5
        key: true
      - id: multiplication-principle
        weight: 0.4
        key: false
    knowledge_points:
      - id: kp1
        name: "Computing terms from a recurrence"
        key_prerequisites: [function-notation]
        exemplars:
          - problem: 'Let $a_1 = 1$ and $a_n = 2a_{n-1} + 1$ for $n \ge 2$. Find $a_2$, $a_3$ and $a_4$.'
            answer: '3, 7, 15'
            answer_contract: {"kind":"list","member":{"kind":"exact"},"ordered":true}
            solution_sketch: 'Each term is built from the term before it, so work forward one term at a time. First $a_2 = 2 \cdot 1 + 1 = 3$, then $a_3 = 2 \cdot 3 + 1 = 7$ and $a_4 = 2 \cdot 7 + 1 = 15$.'
          - problem: 'The Fibonacci numbers satisfy $F_1 = F_2 = 1$ and $F_n = F_{n-1} + F_{n-2}$ for $n \ge 3$. Find $F_8$.'
            answer: '21'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Each Fibonacci number is the sum of the two numbers before it. The list is $1, 1, 2, 3, 5, 8, 13, 21$, so $F_8 = 21$.'
          - problem: 'Let $b_1 = 1$, $b_2 = 2$ and $b_n = b_{n-1} + 2b_{n-2}$ for $n \ge 3$. Find $b_3$, $b_4$ and $b_5$.'
            answer: '4, 8, 16'
            answer_contract: {"kind":"list","member":{"kind":"exact"},"ordered":true}
            solution_sketch: 'This recurrence uses the two terms before the new one. So $b_3 = 2 + 2 \cdot 1 = 4$, $b_4 = 4 + 2 \cdot 2 = 8$ and $b_5 = 8 + 2 \cdot 4 = 16$.'
          - problem: 'A lake holds $100$ fish at the start of year $0$. Each year the number of fish doubles and then $20$ fish are caught. Let $p_n$ be the number of fish after $n$ years. How many fish are in the lake after $3$ years?'
            answer: '660'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Doubling and then removing $20$ fish gives $p_n = 2p_{n-1} - 20$ with $p_0 = 100$. Then $p_1 = 180$, $p_2 = 340$ and $p_3 = 660$.'
          - problem: 'A patient takes $10$ mg of a drug every morning. During each day the body removes half of the drug that is present. Let $m_n$ be the amount of the drug in the body, in mg, just after the dose on day $n$, with $m_1 = 10$. How much of the drug is in the body just after the dose on day $4$?'
            answer: '18.75'
            answer_contract: {"kind":"unit","quantity":"mass","unit":"mg","allow_omitted":true}
            solution_sketch: 'Half of the earlier amount remains and then $10$ mg is added, so $m_n = m_{n-1}/2 + 10$. This gives $m_2 = 15$, $m_3 = 17.5$ and $m_4 = 18.75$ mg.'
          - problem: 'A sequence satisfies $a_n = 3a_{n-1} - 1$ for $n \ge 2$, and $a_4 = 41$. Find $a_3$.'
            answer: '14'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The recurrence at $n = 4$ says $41 = 3a_3 - 1$. So $3a_3 = 42$, and dividing by $3$ gives $a_3 = 14$.'
          - problem: 'A sequence has $e_1 = 3$, $e_2 = 5$ and $e_n = 2e_{n-1} - e_{n-2}$ for $n \ge 3$. What is $e_3$?'
            answer: '7'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The recurrence subtracts $e_{n-2}$ and does not add it. The value is $e_3 = 2 \cdot 5 - 3 = 7$.'
          - problem: 'Let $d_1 = 4$, $d_2 = 1$ and $d_n = d_{n-1} - d_{n-2}$ for $n \ge 3$. Find $d_3$, $d_4$, $d_5$, $d_6$ and $d_7$.'
            answer: '-3, -4, -1, 3, 4'
            answer_contract: {"kind":"list","member":{"kind":"exact"},"ordered":true}
            solution_sketch: 'Subtract the term two places back from the term one place back each time. So $d_3 = 1 - 4 = -3$, $d_4 = -3 - 1 = -4$, $d_5 = -4 + 3 = -1$, $d_6 = -1 + 4 = 3$ and $d_7 = 3 + 1 = 4$.'
        constraints: "first- or second-order recurrences with integer coefficients; compute 3-5 terms"
      - id: kp2
        name: "Modeling counting problems with recurrences"
        key_prerequisites: [function-notation, multiplication-principle]
        try_first:
          problem: 'You climb a staircase taking $1$ or $2$ steps at a time. In how many ways can you climb $4$ stairs?'
          answer_contract: {"kind":"exact"}
          answer: '5'
          reveal: 'The first move is $1$ step, leaving $3$ stairs in $3$ ways, or $2$ steps, leaving $2$ stairs in $2$ ways, so there are $3 + 2 = 5$ ways. Splitting by the first move is the idea of this lesson.'
        exemplars:
          - problem: 'You climb a staircase taking $1$ or $2$ steps at a time. By considering the first move, find a recurrence for the number $c_n$ of ways to climb $n$ stairs. How many ways are there to climb $5$ stairs?'
            answer: '8'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'A first move of $1$ step leaves $n-1$ stairs and a first move of $2$ steps leaves $n-2$ stairs, so $c_n = c_{n-1} + c_{n-2}$. With $c_1 = 1$ and $c_2 = 2$ we get $c_3 = 3$, $c_4 = 5$ and $c_5 = 8$.'
          - problem: 'In the Tower of Hanoi with $n$ disks, let $H_n$ be the least number of moves that transfers the tower. To transfer $n$ disks, move the top $n-1$ disks away, move the largest disk, and move the $n-1$ disks back on top of it. Use this to find a recurrence for $H_n$, and then find $H_4$.'
            answer: '15'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The two transfers of $n-1$ disks and the move of the largest disk give $H_n = 2H_{n-1} + 1$ with $H_1 = 1$. Then $H_2 = 3$, $H_3 = 7$ and $H_4 = 15$.'
          - problem: 'You climb a staircase taking $1$, $2$ or $3$ steps at a time. By considering the first step, find a recurrence for the number $c_n$ of ways to climb $n$ stairs, with $c_0 = 1$. How many ways are there to climb $5$ stairs?'
            answer: '13'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The first step is $1$, $2$ or $3$ stairs, so $c_n = c_{n-1} + c_{n-2} + c_{n-3}$ for $n \ge 3$, with $c_0 = 1$, $c_1 = 1$ and $c_2 = 2$. Then $c_3 = 4$, $c_4 = 7$ and $c_5 = 13$.'
          - problem: 'A $2 \times n$ strip is tiled with $1 \times 2$ dominoes. Let $T_n$ be the number of tilings. By considering the left end of the strip, find a recurrence for $T_n$. How many tilings are there of a $2 \times 7$ strip?'
            answer: '21'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'A vertical domino at the left end leaves a $2 \times (n-1)$ strip, and two horizontal dominoes leave a $2 \times (n-2)$ strip. So $T_n = T_{n-1} + T_{n-2}$ with $T_1 = 1$ and $T_2 = 2$, which gives $T_3 = 3$, $T_4 = 5$, $T_5 = 8$, $T_6 = 13$ and $T_7 = 21$.'
          - problem: 'A message is built by joining blocks of length $2$ and blocks of length $3$. Let $m_n$ be the number of block sequences with total length $n$, with $m_0 = 1$. By considering the first block, find a recurrence for $m_n$. How many block sequences have total length $8$?'
            answer: '4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The first block has length $2$ or $3$, so $m_n = m_{n-2} + m_{n-3}$ for $n \ge 3$, with $m_0 = 1$, $m_1 = 0$ and $m_2 = 1$. Then $m_3 = 1$, $m_4 = 1$, $m_5 = 2$, $m_6 = 2$, $m_7 = 3$ and $m_8 = 4$.'
          - problem: 'You climb a staircase taking $1$ or $3$ steps at a time. By considering the first step, find a recurrence for the number $s_n$ of ways to climb $n$ stairs, with $s_0 = 1$. How many ways are there to climb $7$ stairs?'
            answer: '9'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The first step is $1$ or $3$ stairs, so $s_n = s_{n-1} + s_{n-3}$ for $n \ge 3$, with $s_0 = s_1 = s_2 = 1$. Then $s_3 = 2$, $s_4 = 3$, $s_5 = 4$, $s_6 = 6$ and $s_7 = 9$.'
          - problem: 'A ticket machine accepts $1$-dollar coins and $2$-dollar coins. In how many different orders can coins worth exactly $8$ dollars be inserted?'
            answer: '34'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Let $w_n$ be the number of orders for $n$ dollars. The first coin is worth $1$ or $2$ dollars, so $w_n = w_{n-1} + w_{n-2}$ with $w_1 = 1$ and $w_2 = 2$. This gives $3, 5, 8, 13, 21$ and $w_8 = 34$.'
          - problem: 'In the Tower of Hanoi with $n$ disks, the least number of moves satisfies $H_n = 2H_{n-1} + 1$ with $H_1 = 1$. A monk can make at most $500$ moves. What is the greatest number of disks he can transfer?'
            answer: '8'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The values are $H_5 = 31$, $H_6 = 63$, $H_7 = 127$, $H_8 = 255$ and $H_9 = 511$. Since $255 \le 500 < 511$, the monk can transfer $8$ disks but not $9$.'
          - problem: 'You climb a staircase taking $1$ or $4$ steps at a time, and $u_n$ is the number of ways to climb $n$ stairs. By considering the first step, find $u_9$, with $u_0 = 1$.'
            answer: '10'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The first step is $1$ or $4$ stairs, so $u_n = u_{n-1} + u_{n-4}$, with $u_n = 0$ for $n < 0$. This gives $u_1 = u_2 = u_3 = 1$, then $u_4 = 2$, $u_5 = 3$, $u_6 = 4$, $u_7 = 5$, $u_8 = 7$ and $u_9 = 10$.'
        constraints: "condition-on-the-first-choice arguments; verify small cases by direct enumeration"
      - id: kp3
        name: "Recurrences for strings with forbidden patterns"
        key_prerequisites: [function-notation, multiplication-principle]
        exemplars:
          - problem: 'How many bit strings of length $4$ contain no two consecutive $0$s?'
            answer: '8'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Let $b_n$ count such strings. A valid string ends in $1$ (after any valid string of length $n-1$) or in $10$ (after any valid string of length $n-2$), so $b_n = b_{n-1} + b_{n-2}$. With $b_1 = 2$ and $b_2 = 3$ we get $b_3 = 5$ and $b_4 = 8$.'
          - problem: 'Let $f(n)$ be the number of binary sequences of length $n$ in which no two $1$s are adjacent. By grouping the sequences by their last symbol, find a recurrence for $f(n)$. How many such sequences have length $7$?'
            answer: '34'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'A sequence ending in $0$ follows any valid sequence of length $n-1$. A sequence ending in $1$ must have $0$ before it, so the first $n-2$ symbols form any valid sequence. Hence $f(n) = f(n-1) + f(n-2)$ with $f(1) = 2$ and $f(2) = 3$, which gives $5, 8, 13, 21$ and $f(7) = 34$.'
          - problem: 'Let $g(n)$ be the number of binary sequences of length $n$ in which no $0$ comes immediately before a $1$. By grouping the sequences by their last symbol, find a recurrence for $g(n)$. Find $g(3)$ and $g(4)$.'
            answer: '4, 5'
            answer_contract: {"kind":"list","member":{"kind":"exact"},"ordered":true}
            solution_sketch: 'A sequence ending in $0$ follows any valid sequence of length $n-1$. A sequence ending in $1$ must consist of $1$s only, which is one sequence. So $g(n) = g(n-1) + 1$ with $g(1) = 2$, giving $g(2) = 3$, $g(3) = 4$ and $g(4) = 5$.'
          - problem: 'Let $h(n)$ be the number of binary sequences of length $n$ in which no $1$ comes immediately before a $0$. By grouping the sequences by their last symbol, find a recurrence for $h(n)$. How many such sequences have length $9$?'
            answer: '10'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'A sequence ending in $1$ follows any valid sequence of length $n-1$. A sequence ending in $0$ must consist of $0$s only, which is one sequence. So $h(n) = h(n-1) + 1$ with $h(1) = 2$, and counting up gives $h(9) = 10$.'
          - problem: 'Let $w(n)$ be the number of binary sequences of length $n$ in which no two $0$s are adjacent. By grouping the sequences by their last symbol, find a recurrence for $w(n)$. For which $n$ is $w(n) = 21$?'
            answer: '6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'A sequence ending in $1$ follows any valid sequence of length $n-1$, and one ending in $0$ has $1$ before it and any valid sequence of length $n-2$ before that. So $w(n) = w(n-1) + w(n-2)$ with $w(1) = 2$ and $w(2) = 3$. The values $5, 8, 13, 21$ show that $w(6) = 21$.'
          - problem: 'A row of $8$ plots is planted with red or white flowers, and no two red flowers may be neighbors. In how many ways can the row be planted?'
            answer: '55'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Let $r_n$ count the plantings of $n$ plots. A white first plot leaves $n-1$ free plots, and a red first plot forces a white second plot and leaves $n-2$ plots, so $r_n = r_{n-1} + r_{n-2}$ with $r_1 = 2$ and $r_2 = 3$. Counting up gives $5, 8, 13, 21, 34$ and $r_8 = 55$.'
          - problem: 'How many strings of length $4$ over the digits $0$, $1$ and $2$ contain no two consecutive $0$s?'
            answer: '60'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Let $t_n$ count these strings. A string ends in $1$ or $2$ after any valid string of length $n-1$, or ends in $10$ or $20$ after any valid string of length $n-2$, so $t_n = 2t_{n-1} + 2t_{n-2}$. With $t_1 = 3$ and $t_2 = 8$ we get $t_3 = 22$ and $t_4 = 60$.'
          - problem: 'A drummer plays a pattern of $9$ beats. Each beat is a hit or a rest, and two rests never come one directly after the other. How many different patterns are possible?'
            answer: '89'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Let $p_n$ count the patterns with $n$ beats. A pattern ends in a hit after any valid pattern of $n-1$ beats, or in a hit and then a rest after any valid pattern of $n-2$ beats, so $p_n = p_{n-1} + p_{n-2}$ with $p_1 = 2$ and $p_2 = 3$. Counting up gives $p_9 = 89$.'
          - problem: 'How many bit strings of length $3$ have no two consecutive $0$s?'
            answer: '5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Of the $8$ strings of length $3$, exactly three contain two consecutive $0$s: $000$, $001$ and $100$. So $8 - 3 = 5$ strings remain.'
        constraints: "binary strings, forbidden block of length 2; classify by the last character(s)"
    diagnostic_exemplar:
      problem: 'Let $b_n$ count bit strings of length $n$ with no two consecutive $1$s (classify by the last character to find a recurrence). Compute $b_5$.'
      answer: '13'
      solution_sketch: '$b_n = b_{n-1} + b_{n-2}$ with $b_1 = 2$, $b_2 = 3$: then $5, 8, 13$.'
    anki_seeds:
      - front: "A recurrence relation defines $a_n$ in terms of..."
        back: "earlier terms of the sequence, together with enough initial conditions to start it."
        type: basic
      - front: "Standard move for modeling with a recurrence"
        back: "Condition on the first (or last) choice, and express the rest as a smaller instance of the same problem."
        type: basic

  - id: iteration-telescoping
    name: "Solving by Iteration & Telescoping"
    core: true
    difficulty: 0.55
    drill: false
    answer_kind: numeric
    expected_time_secs: 150
    prerequisites:
      - id: recurrence-relations
        weight: 0.8
        key: true
      - id: summation-notation
        weight: 0.6
        key: true
    knowledge_points:
      - id: kp1
        name: "Unrolling arithmetic- and geometric-type recurrences"
        key_prerequisites: [recurrence-relations]
        exemplars:
          - problem: 'Find a closed formula for $a_n$ when $a_n = a_{n-1} + 4$ and $a_0 = 1$.'
            answer: '4n + 1'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Each step adds $4$, so after $n$ steps $a_n = 1 + 4n$. Check: $a_1 = 5$, which equals $a_0 + 4$.'
          - problem: 'Find a closed formula for $a_n$ when $a_n = a_{n-1} - 2$ and $a_0 = 9$.'
            answer: '-2n + 9'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Each step subtracts $2$, so after $n$ steps $a_n = 9 - 2n$. Check: $a_1 = 7$, which equals $a_0 - 2$.'
          - problem: 'A sequence satisfies $a_n = 2a_{n-1}$ with $a_0 = 5$. Find $a_6$.'
            answer: '320'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Each step doubles the term, so $a_n = 5 \cdot 2^n$. Then $a_6 = 5 \cdot 64 = 320$.'
          - problem: 'A sequence satisfies $a_n = 3a_{n-1}$ with $a_0 = 2$. Find $a_5$.'
            answer: '486'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Each step triples the term, so $a_n = 2 \cdot 3^n$. Then $a_5 = 2 \cdot 243 = 486$.'
          - problem: 'A sequence satisfies $a_n = a_{n-1} + d$ with $a_0 = 4$ and $a_5 = 19$. Find $d$.'
            answer: '3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'After $5$ steps $a_5 = 4 + 5d$. So $19 = 4 + 5d$, which gives $5d = 15$ and $d = 3$.'
          - problem: 'A gym charges a joining fee of $40$ dollars plus $25$ dollars for each month. Let $c_n$ be the total paid after $n$ months, so $c_0 = 40$. How many dollars have been paid after $12$ months?'
            answer: '340'
            answer_contract: {"kind":"unit","quantity":"dollar","unit":"dollar","allow_omitted":true}
            solution_sketch: 'Each month adds $25$, so $c_n = c_{n-1} + 25$ and $c_n = 40 + 25n$. Then $c_{12} = 40 + 300 = 340$.'
          - problem: 'A gym charges a joining fee of $40$ dollars plus $25$ dollars for each month. After how many months has a member paid a total of $690$ dollars?'
            answer: '26'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The total after $n$ months is $40 + 25n$. Setting $40 + 25n = 690$ gives $25n = 650$, and dividing by $25$ gives $n = 26$.'
          - problem: 'A culture holds $500$ bacteria at hour $0$, and the number of bacteria doubles every hour. How many bacteria are in the culture after $6$ hours?'
            answer: '32000'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Each hour multiplies the number by $2$, so after $n$ hours there are $500 \cdot 2^n$. After $6$ hours there are $500 \cdot 64 = 32000$.'
          - problem: 'A ball is dropped from a height of $243$ cm. After each bounce it rises to one third of its previous height. How high does it rise after the fourth bounce?'
            answer: '3'
            answer_contract: {"kind":"unit","quantity":"length","unit":"cm","allow_omitted":true}
            solution_sketch: 'Each bounce divides the height by $3$, so the height after $n$ bounces is $243/3^n$. After $4$ bounces it is $243/81 = 3$ cm.'
        constraints: "a_n = a_{n-1} + d or a_n = r a_{n-1}; integer parameters; always verify by substitution"
      - id: kp2
        name: "Telescoping variable-step recurrences"
        key_prerequisites: [recurrence-relations, summation-notation]
        try_first:
          problem: 'A sequence starts at $a_0 = 0$ and each term adds its own position number, so $a_n = a_{n-1} + n$. What is $a_4$?'
          answer_contract: {"kind":"exact"}
          answer: '10'
          reveal: 'The terms are $1, 3, 6, 10$, because the amount added grows by $1$ each step. Adding $1 + 2 + 3 + 4$ is the idea of this lesson.'
        exemplars:
          - problem: 'Find a closed formula for $a_n$ when $a_n = a_{n-1} + n$ and $a_0 = 0$.'
            answer: 'n(n+1)/2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Unrolling gives $a_n = 1 + 2 + \cdots + n$, the sum of the first $n$ whole numbers. This sum equals $n(n+1)/2$, and $a_3 = 6$ agrees.'
          - problem: 'Find a closed formula for $a_n$ when $a_n = a_{n-1} + (2n - 1)$ and $a_0 = 0$.'
            answer: 'n^2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Unrolling gives the sum of the first $n$ odd numbers $1 + 3 + 5 + \cdots + (2n-1)$, which is $n^2$. Check: $a_1 = 1$, $a_2 = 4$ and $a_3 = 9$.'
          - problem: 'Find a closed formula for $a_n$ when $a_n = a_{n-1} + 2n$ and $a_0 = 0$.'
            answer: 'n(n+1)'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Unrolling gives $a_n = 2 + 4 + \cdots + 2n = 2(1 + 2 + \cdots + n)$. Since $1 + 2 + \cdots + n = n(n+1)/2$, we get $a_n = n(n+1)$.'
          - problem: 'Find a closed formula for $a_n$ when $a_n = a_{n-1} + (2n + 1)$ and $a_0 = 0$.'
            answer: 'n(n+2)'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Unrolling gives $a_n = \sum_{k=1}^{n} (2k + 1) = 2 \cdot n(n+1)/2 + n$. This equals $n^2 + 2n = n(n+2)$.'
          - problem: 'A sequence satisfies $a_n = a_{n-1} + 2^n$ with $a_0 = 0$. Find $a_5$.'
            answer: '62'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Unrolling gives $a_5 = 2 + 4 + 8 + 16 + 32$, a geometric sum with ratio $2$. The sum of $2^1$ to $2^5$ is $2^6 - 2 = 62$, so $a_5 = 62$.'
          - problem: 'Find a closed formula for $a_n$ when $a_n = a_{n-1} + 3n$ and $a_0 = 0$.'
            answer: '3n(n+1)/2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Unrolling gives $a_n = 3 + 6 + \cdots + 3n = 3(1 + 2 + \cdots + n)$. This equals $3n(n+1)/2$.'
          - problem: 'At a party, each person who arrives shakes hands with everyone already present. Let $h_n$ be the total number of handshakes after $n$ people have arrived, so $h_1 = 0$ and $h_n = h_{n-1} + (n-1)$. How many handshakes have taken place once $12$ people have arrived?'
            answer: '66'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Unrolling gives $h_{12} = 1 + 2 + \cdots + 11$, the sum of the first $11$ whole numbers. This equals $11 \cdot 12/2 = 66$.'
          - problem: 'A saver puts $10$ dollars in a box in week $1$, $20$ dollars in week $2$, $30$ dollars in week $3$, and so on, adding $10$ dollars more each week. Let $s_n$ be the total in the box after $n$ weeks, so $s_n = s_{n-1} + 10n$ and $s_0 = 0$. How many dollars are in the box after $12$ weeks?'
            answer: '780'
            answer_contract: {"kind":"unit","quantity":"dollar","unit":"dollar","allow_omitted":true}
            solution_sketch: 'Unrolling gives $s_n = 10(1 + 2 + \cdots + n) = 5n(n+1)$. For $n = 12$ this is $5 \cdot 12 \cdot 13 = 780$.'
          - problem: 'A saver puts $10$ dollars in a box in week $1$, $20$ dollars in week $2$, and so on, adding $10$ dollars more each week. The total after $n$ weeks is $s_n = s_{n-1} + 10n$ with $s_0 = 0$. After how many weeks does the total first exceed $1000$ dollars?'
            answer: '14'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The total after $n$ weeks is $s_n = 5n(n+1)$. Since $s_{13} = 910$ and $s_{14} = 1050$, the total first exceeds $1000$ dollars after $14$ weeks.'
        constraints: "step depends linearly on n; solution is a known sum (triangular, odd numbers, geometric); the item must test THIS KP: Telescoping variable-step recurrences"
    diagnostic_exemplar:
      problem: 'Find a closed formula for $a_n$ when $a_n = a_{n-1} + n$ and $a_0 = 1$.'
      answer: 'n(n+1)/2 + 1'
      answer_contract: {kind: exact}
      solution_sketch: 'Telescoping adds $1 + 2 + \cdots + n$ to $a_0$; check: $1, 2, 4, 7, 11$.'
