  - id: euler-trails-circuits
    name: "Euler Trails & Circuits"
    core: false                # named terminal graph result
    difficulty: 0.6
    drill: false
    answer_kind: numeric
    expected_time_secs: 150
    prerequisites:
      - id: walks-paths-connectivity
        weight: 0.8
        key: true
      - id: degree-handshake
        weight: 0.7
        key: true
    knowledge_points:
      - id: kp1
        name: "Existence criteria from degree parity"
        key_prerequisites: [walks-paths-connectivity, degree-handshake]
        exemplars:
          - problem: "A connected graph has degree sequence 2, 2, 2, 4, 4, 2. State the strongest Euler route that exists and give the number of odd-degree vertices. Give the route and the odd count."
            answer: "route = circuit; odd = 0"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["circuit"], ["trail"]]}, "name": "route"}, {"contract": {"kind": "exact"}, "name": "odd"}]}
            solution_sketch: "First count degrees: the sequence has no odd values, so the number of odd-degree vertices is 0. The option trail is wrong because a connected graph with 0 odd vertices has an Euler circuit, which is stronger than a trail. By the Euler circuit criterion, 0 odd vertices gives an Euler circuit. The answer is route = circuit; odd = 0."
          - problem: "Every vertex of a connected graph on 6 vertices has degree 3. State the strongest Euler route that exists and give the number of odd-degree vertices. Give the route and the odd count."
            answer: "verdict = neither; odd = 6"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["circuit"], ["trail"], ["neither"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "odd"}]}
            solution_sketch: "Step 1: count the degrees. Every one of the 6 vertices has degree 3, which is odd, so the graph has 6 odd-degree vertices. Step 2: the option circuit is wrong because an Euler circuit requires 0 odd-degree vertices, not 6. Step 3: the option trail is wrong because an Euler trail requires exactly 2 odd-degree vertices, not 6. Step 4: by the Euler criteria, a connected graph with more than 2 odd-degree vertices has neither route. The answer is verdict = neither; odd = 6."
          - problem: "A connected graph has an Euler trail but no Euler circuit. How many odd-degree vertices does it have?"
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "By the Euler trail criterion, a connected graph has an Euler trail exactly when it has 0 or 2 odd-degree vertices. The case with no Euler circuit rules out 0 odd vertices, because 0 odd vertices gives a circuit. The only remaining possibility is 2 odd-degree vertices. The answer is 2."
          - problem: "A connected graph has neither an Euler circuit nor an Euler trail. What is the smallest possible number of odd-degree vertices it can have?"
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The Euler criteria say a circuit needs 0 odd vertices and a trail needs 0 or 2 odd vertices. To have neither, the graph must have more than 2 odd vertices. The number of odd-degree vertices in any graph is even by the handshake lemma, so the smallest number greater than 2 is 4. The answer is 4."
          - problem: "A connected graph has degree sequence 1, 2, 2, 3, 2, 2. State the strongest Euler route that exists and give the number of odd-degree vertices. Give the route and the odd count."
            answer: "route = trail; odd = 2"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["circuit"], ["trail"]]}, "name": "route"}, {"contract": {"kind": "exact"}, "name": "odd"}]}
            solution_sketch: "Count odd degrees: degree 1 appears once and degree 3 appears once, so there are 2 odd-degree vertices. The option circuit is wrong because a connected graph with 2 odd vertices has no Euler circuit. A connected graph with exactly 2 odd vertices has an Euler trail. The answer is route = trail; odd = 2."
          - problem: "A connected graph has an Euler circuit. How many odd-degree vertices does it have?"
            answer: "0"
            answer_contract: {"kind": "exact"}
            solution_sketch: "By the Euler circuit criterion, a connected graph has an Euler circuit exactly when every vertex has even degree. Even degree means no vertex has odd degree. The answer is 0."
        constraints: "connected graphs <= 8 vertices; answer must cite the odd-degree count (0, 2, or more)"
      - id: kp2
        name: "Bridges of Konigsberg and route problems"
        key_prerequisites: [walks-paths-connectivity, degree-handshake]
        exemplars:
          - problem: "A connected multigraph has degree sequence 5, 3, 3, 3. How many vertices of odd degree does it have?"
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: List the vertex degrees in order: 5, 3, 3, 3. Step 2: Apply the parity test for an Euler trail: a connected graph has an Euler trail only when at most two vertices have odd degree. Step 3: Count the odd entries: 5, 3, 3 and 3 are all odd, so the count is 4. The answer is 4."
          - problem: "For the complete graphs K_3, K_4, K_5 and K_6, how many have an Euler circuit?"
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: K_n has an Euler circuit exactly when every degree n - 1 is even, so n must be odd. Step 2: Among 3, 4, 5, 6, the odd values are 3 and 5. Step 3: That gives two graphs, so the count is 2. The answer is 2."
          - problem: "A delivery route uses a connected multigraph with vertices 1, 2, 3, 4. Their degrees are 3, 2, 4, 1. How many vertices have odd degree?"
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: Read the degree of each vertex: vertex 1 has 3, vertex 2 has 2, vertex 3 has 4, vertex 4 has 1. Step 2: The odd degrees are 3 and 1, so vertices 1 and 4 are odd. Step 3: There are two odd-degree vertices. The answer is 2."
          - problem: "A connected multigraph has all even vertex degrees. Select the type of Euler route it has, and give the number of odd-degree vertices."
            answer: "route = circuit; odd = 0"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["circuit"], ["trail"]]}, "name": "route"}, {"contract": {"kind": "exact"}, "name": "odd"}]}
            solution_sketch: "Step 1: Use the parity test: an Euler circuit needs every degree even. Step 2: The option trail is wrong because a trail need not return to the start, while an all-even graph always allows a closed circuit. Step 3: Because all degrees are even, the graph has a circuit and zero odd vertices. The answer is route = circuit; odd = 0."
          - problem: "A connected graph has 6 vertices of odd degree. Find the minimum number of trails needed to cover every edge exactly once."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: An Euler trail can have at most two odd-degree vertices, its endpoints. Step 2: Each trail can cover at most two odd vertices, so 6 odd vertices need at least 6 / 2 = 3 trails. Step 3: Three trails are enough because the graph is connected. The answer is 3."
          - problem: "A bridge network has vertices 1, 2, 3, 4, 5. Their degrees are 2, 2, 2, 2, 4. How many vertices have odd degree?"
            answer: "0"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: Read the degrees: 2, 2, 2, 2 and 4. Step 2: Every degree is even, so no vertex has odd degree. Step 3: The count of odd-degree vertices is zero. The answer is 0."
        constraints: "route/bridge framings; multigraphs allowed; justification through degree parity required"
    diagnostic_exemplar:
      problem: 'For which $n \ge 3$ does the complete graph $K_n$ have an Euler circuit? Justify your answer with the degrees.'
      answer: 'exactly the odd n: K_n is connected and every vertex has degree n - 1, which is even precisely when n is odd (for even n every degree is odd, and more than two odd vertices rule out even an Euler trail)'
      answer_contract: {kind: none}
      solution_sketch: 'Euler circuit $\iff$ connected and all degrees even; in $K_n$ every degree is $n - 1$.'
    anki_seeds:
      - front: "Euler circuit existence criterion"
        back: "Connected (ignoring isolated vertices) and every vertex of even degree."
        type: basic
      - front: "Euler trail (not circuit) existence criterion"
        back: "Connected with exactly two odd-degree vertices — the trail's endpoints."
        type: basic

  - id: hamilton-paths-cycles
    name: "Hamilton Paths & Cycles"
    core: false                # named terminal graph result
    difficulty: 0.65
    drill: false
    answer_kind: numeric
    expected_time_secs: 180
    prerequisites:
      - id: walks-paths-connectivity
        weight: 0.8
        key: true
      - id: permutations
        weight: 0.5
        key: false
    knowledge_points:
      - id: kp1
        name: "Finding and counting Hamilton cycles"
        key_prerequisites: [walks-paths-connectivity]
        exemplars:
          - problem: 'How many distinct Hamilton cycles does $K_4$ have (cycles counted up to starting point and direction)?'
            answer: "3"
            solution_sketch: '$(4-1)!/2 = 3$.'
          - problem: 'How many distinct Hamilton cycles does $K_5$ have?'
            answer: "12"
            solution_sketch: '$(5-1)!/2 = 24/2 = 12$.'
          - problem: "A complete graph on $6$ vertices has an edge between every pair of vertices. How many distinct Hamilton cycles does it have, if cycles that differ only by their starting point or their direction are counted as one cycle?"
            answer: "60"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Model the graph as $K_6$: a Hamilton cycle is a cyclic ordering of all 6 vertices. Rotations give the same cycle, so a fixed starting point leaves $5! = 120$ orderings, and each cycle equals its own reverse, so divide by 2: $120/2 = 60$. This matches the formula $(n-1)!/2 = (6-1)!/2 = 60$. The answer is 60."
          - problem: "Six friends sit around a round table. Seating arrangements that differ only by rotation or by reflection are considered the same. How many distinct seating arrangements are there?"
            answer: "60"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Model the six friends as vertices of the complete graph $K_6$, and each seating as a Hamilton cycle. A rotation gives the same cyclic order, so fix the starting point, and a reflection identifies a cycle with its reverse. The formula for $K_n$ is $(n-1)!/2$. Substituting $n = 6$ gives $(6-1)!/2 = 120/2 = 60$. The answer is 60."
          - problem: "Five friends sit around a round table. Arrangements that differ only by a rotation are considered the same, but a seating and its mirror image are considered different arrangements. How many distinct seating arrangements are there?"
            answer: "24"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Fix one friend's seat to remove the effect of rotations, then arrange the remaining 4 friends in the other seats: $4! = 24$. Mirror images are declared different here, so unlike the usual round-table count there is no division by 2. The answer is 24."
          - problem: "In the complete graph $K_6$, a Hamilton cycle and the same cycle traveled in the opposite direction are counted as two different cycles; the starting point is still irrelevant. How many distinct Hamilton cycles does $K_6$ have under this counting?"
            answer: "120"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Fix one vertex of $K_6$ as the starting point to remove rotations, then order the remaining 5 vertices in $5! = 120$ ways. Each such ordering is one directed Hamilton cycle, and opposite directions are counted separately, so no division by 2 is made. This equals $(n-1)! = (6-1)! = 120$. The answer is 120."
        constraints: "complete graphs n <= 6; formula (n-1)!/2; or exhibit a Hamilton cycle in a small graph"
      - id: kp2
        name: "Dirac's sufficient condition"
        key_prerequisites: [walks-paths-connectivity]
        exemplars:
          - problem: "A graph has 8 vertices and every vertex has degree at least 4. State whether Dirac's condition is met, and give the smallest degree threshold n/2 that Dirac's theorem uses."
            answer: "dirac = holds; threshold = 4"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["holds"], ["fails"]]}, "name": "dirac"}, {"contract": {"kind": "exact"}, "name": "threshold"}]}
            solution_sketch: "Step 1 (Dirac's theorem): the theorem needs n >= 3 and minimum degree at least n/2. Step 2 (threshold computation): here n = 8, so n/2 = 4. Step 3 (comparison): the minimum degree is at least 4, so the condition is met; the option fails would be wrong because 4 is not below the threshold. Dirac's condition is sufficient, not necessary, for a Hamilton cycle. Answer: dirac = holds; threshold = 4."
          - problem: "A graph has 6 vertices and its minimum degree is 2. State whether Dirac's theorem applies, and give the threshold n/2 it would require."
            answer: "condition = notmet; threshold = 3"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["met"], ["notmet"]]}, "name": "condition"}, {"contract": {"kind": "exact"}, "name": "threshold"}]}
            solution_sketch: "Step 1 (Dirac's theorem): the theorem needs n >= 3 and minimum degree at least n/2. Step 2 (threshold computation): here n = 6, so n/2 = 3. Step 3 (comparison): the minimum degree is 2, which is less than 3, so the condition is not met; the option met would be wrong because 2 is below the threshold. Dirac's condition is sufficient, not necessary, so the graph may still have a Hamilton cycle. Answer: condition = notmet; threshold = 3."
          - problem: "For a graph on 10 vertices, Dirac's theorem guarantees a Hamilton cycle when every vertex has degree at least n/2. Find the smallest integer degree bound that satisfies this condition."
            answer: "5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (Dirac's theorem): the bound is n/2 with n >= 3. Step 2 (substitution): for n = 10, n/2 = 5. Step 3 (integer degree): the smallest integer degree bound that satisfies the condition is 5. Answer: 5."
          - problem: "A graph on 8 vertices satisfies Dirac's condition. Find the smallest integer minimum degree it can have."
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (Dirac's theorem): the minimum degree must be at least n/2. Step 2 (substitution): for n = 8, n/2 = 4. Step 3 (integer degree): since degrees are integers, the smallest possible minimum degree is 4. Dirac's condition is sufficient, not necessary. Answer: 4."
          - problem: "A network graph has 7 vertices and minimum degree 4. State whether Dirac's condition is met, and give n/2 as a fraction."
            answer: "condition = met; threshold = 7/2"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["met"], ["notmet"]]}, "name": "condition"}, {"contract": {"kind": "exact"}, "name": "threshold"}]}
            solution_sketch: "Step 1 (Dirac's theorem): the theorem needs n >= 3 and minimum degree at least n/2. Step 2 (threshold computation): here n = 7, so n/2 = 7/2. Step 3 (comparison): the minimum degree is 4, and 4 is greater than 7/2, so the condition is met; the option notmet would be wrong because 4 is not below 7/2. Answer: condition = met; threshold = 7/2."
          - problem: "A connected graph has 9 vertices, every vertex has even degree, and minimum degree 4. Dirac's condition is sufficient for a Hamilton cycle but not necessary. State whether Dirac's condition is met, and give n/2."
            answer: "condition = notmet; threshold = 9/2"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["met"], ["notmet"]]}, "name": "condition"}, {"contract": {"kind": "exact"}, "name": "threshold"}]}
            solution_sketch: "Step 1 (Euler contrast): the even-degree fact is the Euler criterion, not Dirac's condition. Step 2 (threshold computation): Dirac's condition requires minimum degree at least n/2; here n = 9, so n/2 = 9/2. Step 3 (comparison): the minimum degree is 4, which is less than 9/2, so the condition is not met; the option met would be wrong because 4 is below the threshold. Answer: condition = notmet; threshold = 9/2."
        constraints: "n <= 10; must distinguish sufficient from necessary; contrast with Euler criteria"
    diagnostic_exemplar:
      problem: 'A graph has $10$ vertices, each of degree at least $5$. Must it have a Hamilton cycle? Name the theorem that applies — and is the condition also necessary?'
      answer: 'Yes'
      answer_contract: {"kind":"label","options":[["Yes"],["No"]]}
      solution_sketch: 'Yes — Dirac''s theorem: every degree $\ge n/2 = 5$ forces a Hamilton cycle. The condition is sufficient but not necessary: $C_{10}$ is Hamiltonian with all degrees $2$. Dirac''s bound is $n/2$; the cycle $C_{10}$ witnesses non-necessity.'
    anki_seeds:
      - front: "Hamilton cycle vs. Euler circuit"
        back: "Hamilton: visits every vertex exactly once. Euler: uses every edge exactly once."
        type: basic
      - front: "Dirac's theorem"
        back: 'If $n \ge 3$ and every vertex has degree $\ge n/2$, the graph has a Hamilton cycle.'
        type: basic
      - front: "Number of distinct Hamilton cycles in $K_n$"
        back: '$(n-1)!/2$.'
        type: basic

  - id: trees-characterizations
    name: "Trees & Their Characterizations"
    core: true
    difficulty: 0.65
    drill: false
    answer_kind: numeric
    expected_time_secs: 180
    prerequisites:
      - id: walks-paths-connectivity
        weight: 0.85
        key: true
      - id: mathematical-induction
        weight: 0.4
        key: false
      - id: degree-handshake
        weight: 0.5
        key: true
    knowledge_points:
      - id: kp1
        name: "n vertices, n-1 edges, unique paths"
        key_prerequisites: [walks-paths-connectivity]
        exemplars:
          - problem: 'A tree has $17$ edges. How many vertices does it have?'
            answer: "18"
            solution_sketch: 'A tree on $n$ vertices has exactly $n - 1$ edges.'
          - problem: 'A forest has $20$ vertices and $3$ components. How many edges does it have?'
            answer: "17"
            solution_sketch: 'Each tree component with $n_i$ vertices has $n_i - 1$ edges; total $20 - 3 = 17$.'
          - problem: "A tree has 23 vertices. How many edges does it have?"
            answer: "22"
            answer_contract: {"kind": "exact"}
            solution_sketch: "For any tree on n vertices, the number of edges is n - 1. Here n = 23, so the edge count is 23 - 1 = 22. The answer is 22."
          - problem: "A forest has 24 vertices and 4 components. How many edges does it have?"
            answer: "20"
            answer_contract: {"kind": "exact"}
            solution_sketch: "A forest with c components satisfies the relation |E| = |V| - c. Here |V| = 24 and c = 4, so |E| = 24 - 4 = 20. The answer is 20."
          - problem: "A forest has 9 edges and 5 components. How many vertices does it have?"
            answer: "14"
            answer_contract: {"kind": "exact"}
            solution_sketch: "For a forest, the edge count relation |E| = |V| - c rearranges to |V| = |E| + c. With |E| = 9 and c = 5, this gives |V| = 9 + 5 = 14. The answer is 14."
          - problem: "A tree has 30 vertices. Two distinct vertices are chosen. How many simple paths between them does the tree have?"
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "A tree is connected and has no cycles, so the simple path between any two distinct vertices is unique. Therefore the chosen pair has exactly 1 simple path. The answer is 1."
        constraints: "trees/forests <= 30 vertices; use |E| = |V| - c"
      - id: kp2
        name: "Degree constraints and leaves"
        key_prerequisites: [walks-paths-connectivity, degree-handshake]
        exemplars:
          - problem: "A tree on 6 vertices is proposed with degree sequence 3, 3, 2, 1, 1, 1. Determine whether this sequence can be realized by a tree, and give the degree sum as S."
            answer: "verdict = impossible; S = 11"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["possible"], ["impossible"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "S"}]}
            solution_sketch: "The proposed object is the degree sequence 3, 3, 2, 1, 1, 1 on n = 6 vertices. Step 1 (degree-sum rule): a tree on n vertices has degree sum 2(n-1) = 2(6-1) = 10. Step 2 (compute the given sum): 3+3+2+1+1+1 = 11, so S = 11. Step 3 (compare): 11 does not equal the required 10, so the sequence fails the necessary condition and cannot be realized by a tree. Step 4 (name the error): choosing possible would overlook that the sum 11 exceeds the value 2(n-1) = 10 that every tree must have. The sequence is not realizable: verdict = impossible; S = 11."
          - problem: "Every tree with at least 2 vertices has a minimum possible number of leaves. For a tree with 10 vertices, what is the smallest possible number of leaves? Give the answer as a whole number."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full object is any tree on n = 10 vertices. Step 1 (degree-sum rule): the degree sum is 2(n-1) = 18. Step 2 (leaf lower bound): if there were 0 or 1 leaves, all other vertices would have degree at least 2, giving degree sum at least 1 + 2*9 = 19, which exceeds 18. Step 3 (attainment): a path on 10 vertices has exactly 2 leaves. The smallest possible number of leaves is 2."
          - problem: "A tree has 8 vertices. Find the sum of the degrees of all its vertices."
            answer: "14"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full object is a tree with n = 8 vertices. Step 1 (degree-sum rule): the sum of degrees is 2(n-1). Step 2 (substitute): 2(8-1) = 14. The sum of the degrees is 14."
          - problem: "A tree has degree sum 18. How many vertices does the tree have?"
            answer: "10"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full object is a tree whose degree sum is 18. Step 1 (degree-sum rule): the sum is 2(n-1). Step 2 (solve): 2(n-1) = 18, so n-1 = 9 and n = 10. The tree has 10 vertices."
          - problem: "A tree on 9 vertices has one vertex of degree 4, two vertices of degree 3, and all remaining vertices are leaves. How many leaves does the tree have?"
            answer: "6"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full object is a tree on n = 9 vertices with one degree 4 vertex and two degree 3 vertices. Step 1 (degree-sum rule): total degree sum is 2(9-1) = 16. Step 2 (known degrees): the non-leaf degrees sum to 4+3+3 = 10. Step 3 (leaves): if there are L leaves, each of degree 1, then 10 + L = 16, so L = 6. The tree has 6 leaves."
          - problem: "A tree on 10 vertices has one vertex of degree 5 and two vertices of degree 3, and all remaining vertices are leaves. How many leaves does the tree have?"
            answer: "7"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full object is a tree on n = 10 vertices with one degree 5 vertex and two degree 3 vertices. Step 1 (degree-sum rule): total degree sum is 2(10-1) = 18. Step 2 (known degrees): the non-leaf degrees sum to 5+3+3 = 11. Step 3 (leaves): if there are L leaves, each of degree 1, then 11 + L = 18, so L = 7. The tree has 7 leaves."
        constraints: "degree sums checked against 2(n-1); n <= 10"
    diagnostic_exemplar:
      problem: 'Can a tree on $8$ vertices have degree sequence $3, 3, 2, 2, 1, 1, 1, 1$? Check the degree sum against what a tree requires, and exhibit such a tree or rule it out.'
      answer: 'Yes: the degree sum is $14 = 2(n-1)$, matching a tree''s $7$ edges — e.g. a path $a$-$c$-$d$-$b$ with two extra leaves on each of $a$ and $b$.'
      answer_contract: {kind: none}
      solution_sketch: 'A tree on $8$ vertices has exactly $7$ edges, so the degrees must sum to $14$; the construction realizes the sequence.'
