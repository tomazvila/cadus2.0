        back: "Hamilton: visits every vertex exactly once. Euler: uses every edge exactly once."
        type: basic
      - front: "Dirac's theorem"
        back: 'If $n \ge 3$ and every vertex has degree $\ge n/2$, the graph has a Hamilton cycle.'
        type: basic
      - front: "Number of distinct Hamilton cycles in $K_n$"
        back: '$(n-1)!/2$.'
        type: basic

  - id: trees-characterizations
    name: "Trees & Their Characterizations"
    core: true
    difficulty: 0.65
    drill: false
    answer_kind: numeric
    expected_time_secs: 180
    prerequisites:
      - id: walks-paths-connectivity
        weight: 0.85
        key: true
      - id: mathematical-induction
        weight: 0.4
        key: false
      - id: degree-handshake
        weight: 0.5
        key: true
    knowledge_points:
      - id: kp1
        name: 'n vertices, n-1 edges, unique paths'
        key_prerequisites: [walks-paths-connectivity]
        try_first:
          problem: 'A connected graph on $5$ vertices has no cycle. How many edges does it have?'
          answer_contract: {"kind": "exact"}
          answer: '4'
          reveal: 'Each new vertex needs exactly one edge to join the tree, and the first vertex needs none. So $n$ vertices need $n - 1$ edges.'
        exemplars:
          - problem: 'A tree has $17$ edges. How many vertices does it have?'
            answer: '18'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A tree on $n$ vertices has exactly $n - 1$ edges. Here $n - 1 = 17$, so $n = 17 + 1 = 18$. The tree has $18$ vertices.'
          - problem: 'A forest has $20$ vertices and $3$ components. How many edges does it have?'
            answer: '17'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Each component is a tree with one edge fewer than its vertices. Together the $3$ components have $3$ fewer edges than the $20$ vertices. So the forest has $20 - 3 = 17$ edges.'
          - problem: 'A forest has $9$ edges and $5$ components. How many vertices does it have?'
            answer: '14'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'For a forest, the number of edges is the number of vertices minus the number of components. So the number of vertices is the number of edges plus the number of components. This gives $9 + 5 = 14$ vertices.'
          - problem: 'A school links its $40$ computers with the fewest cables that still let every computer reach every other one. How many cables does it use?'
            answer: '39'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Fewest cables with every computer reachable means the network is a tree, because any cycle would let a cable go without breaking a connection. A tree on $40$ vertices has $40 - 1 = 39$ edges. The school uses $39$ cables.'
          - problem: 'A farm has $45$ fields. Paths join some of the fields, $38$ paths in all, and no set of paths forms a closed loop. Into how many separate groups of joined fields do the fields fall?'
            answer: '7'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'With no closed loop the paths form a forest, so the number of paths is the number of fields minus the number of groups. This gives $38 = 45 - c$, so $c = 45 - 38 = 7$. The fields fall into $7$ groups.'
          - problem: 'A tree has $30$ vertices. How many simple paths join two given distinct vertices of the tree?'
            answer: '1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A tree is connected, so at least one simple path joins any two vertices. A tree has no cycle, so there cannot be two different paths. The tree has exactly $1$ simple path between the two vertices.'
          - problem: 'A network of $12$ offices is connected by $15$ cables, and every office can reach every other. What is the greatest number of cables that can be removed so that every office can still reach every other?'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'What remains must be a connected network with no wasted cable, which is a tree on $12$ offices with $12 - 1 = 11$ cables. The network has $15$ cables now, so up to $15 - 11 = 4$ can be removed. Removing a fifth cable would disconnect an office.'
          - problem: 'Sam says that a connected graph with $10$ vertices and $10$ edges is a tree. Is Sam right?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "sam is right", "he is right"], ["no", "sam is wrong", "he is wrong", "sam is not right", "it is not a tree"]]}
            solution_sketch: 'A tree on $n$ vertices has $n - 1$ edges, so a tree on $10$ vertices has $9$ edges. The graph has $10$ edges, one too many, so it contains a cycle and is not a tree. Sam is wrong.'
        constraints: 'trees/forests <= 45 vertices; use |E| = |V| - c; network and farm contexts'
      - id: kp2
        name: 'Degree constraints and leaves'
        key_prerequisites: [walks-paths-connectivity, degree-handshake]
        exemplars:
          - problem: 'A tree has $8$ vertices. What is the sum of the degrees of all its vertices?'
            answer: '14'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A tree on $8$ vertices has $7$ edges. Each edge adds $1$ to the degree of each of its two ends, so the degree sum is $2 \times 7 = 14$.'
          - problem: 'Is there a tree with $6$ vertices whose degrees are $3, 3, 2, 1, 1, 1$?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "there is", "possible"], ["no", "there is not", "impossible", "not possible"]]}
            solution_sketch: 'A tree on $6$ vertices has $5$ edges, so its degrees must add up to $2 \times 5 = 10$. The given degrees add up to $3+3+2+1+1+1 = 11$. The sums differ, so no tree has these degrees.'
          - problem: 'A tree has degree sum $18$. How many vertices does it have?'
            answer: '10'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A tree on $n$ vertices has degree sum $2(n-1)$. Setting $2(n-1) = 18$ gives $n - 1 = 9$. So $n = 10$ and the tree has $10$ vertices.'
          - problem: 'The cables of a small network form a tree on $9$ computers. One computer has $4$ cables, two computers have $3$ cables each, and all the other computers have a single cable. How many computers have a single cable?'
            answer: '6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A tree on $9$ vertices has degree sum $2(9-1) = 16$. The three computers with several cables account for $4+3+3 = 10$. The remaining degree is $16 - 10 = 6$, and each remaining computer has degree $1$, so there are $6$ of them.'
          - problem: 'A tree on $10$ vertices has one vertex of degree $5$ and two vertices of degree $3$, and all the other vertices are leaves. How many leaves does the tree have?'
            answer: '7'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A tree on $10$ vertices has degree sum $2(10-1) = 18$. The three vertices that are not leaves account for $5+3+3 = 11$. So the leaves account for $18 - 11 = 7$, and each leaf has degree $1$, so there are $7$ leaves.'
          - problem: 'What is the smallest possible number of leaves in a tree with $10$ vertices?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The degree sum is $2 \times 9 = 18$. If there were $0$ or $1$ leaves, the other vertices would have degree at least $2$, giving a degree sum of at least $1 + 2 \times 9 = 19$, which is too large. A path on $10$ vertices has exactly $2$ leaves, so the smallest number is $2$.'
          - problem: 'A tree-shaped network joins $14$ computers. Every computer has either $1$ cable or $3$ cables attached. How many computers have exactly $1$ cable?'
            answer: '8'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A tree on $14$ vertices has degree sum $2 \times 13 = 26$. Let $x$ computers have $1$ cable, so $14 - x$ have $3$ cables, and $x + 3(14 - x) = 26$. This gives $42 - 2x = 26$, so $x = 8$.'
          - problem: 'A tree has $11$ leaves, and every vertex that is not a leaf has degree $3$. How many vertices does the tree have?'
            answer: '20'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Let the tree have $n$ vertices, so $n - 11$ vertices have degree $3$. The degree sum is $11 + 3(n - 11) = 2(n-1)$. This gives $3n - 22 = 2n - 2$, so $n = 20$.'
          - problem: 'Is there a tree on $7$ vertices whose degrees are $4, 3, 1, 1, 1, 1, 1$?'
            answer: 'yes'
            answer_contract: {"kind": "label", "options": [["yes", "there is", "possible"], ["no", "there is not", "impossible", "not possible"]]}
            solution_sketch: 'A tree on $7$ vertices has $6$ edges, so its degrees must add up to $12$, and $4+3+1+1+1+1+1 = 12$. Join the vertex of degree $4$ to the vertex of degree $3$, then give the first $3$ leaves and the second $2$ leaves. This uses $7$ vertices and gives the required degrees, so such a tree exists.'
        constraints: 'degree sums checked against 2(n-1); n <= 20'
    diagnostic_exemplar:
      problem: 'Can a tree on $8$ vertices have degree sequence $3, 3, 2, 2, 1, 1, 1, 1$? Check the degree sum against what a tree requires, and exhibit such a tree or rule it out.'
      answer: 'Yes: the degree sum is $14 = 2(n-1)$, matching a tree''s $7$ edges — e.g. a path $a$-$c$-$d$-$b$ with two extra leaves on each of $a$ and $b$.'
      answer_contract: {kind: none}
      solution_sketch: 'A tree on $8$ vertices has exactly $7$ edges, so the degrees must sum to $14$; the construction realizes the sequence.'
