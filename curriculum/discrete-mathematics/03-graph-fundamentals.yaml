            solution_sketch: "Full objects: G is the path 1-2-3-4-5-6, while H is a 4-cycle a-b-c-d-a plus the separate edge e-f. Step 1: compare component counts, because the number of connected components is invariant under relabeling. G is connected with 1 component, while H has 2 components. Step 2: a difference in an invariant proves that no relabeling can match the edges. The option isomorphic is wrong because it ignores that H is disconnected. The answer is verdict = distinct; components = 1."
          - problem: "Graph G is the 4-cycle 1-2-3-4-1 with vertex 5 attached to 1 and vertex 6 attached to 3. Graph H is the triangle a-b-c-a with vertex d attached to a, vertex e attached to d, and vertex f attached to c. Both graphs have 6 vertices, 6 edges, and degree sequence 3,3,2,2,1,1. Find the length of the shortest cycle in G."
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Full objects: G is the 4-cycle 1-2-3-4-1 with leaves 5 at 1 and 6 at 3, while H is a triangle with a longer tail. Step 1: find a cycle in G; the 4-cycle 1-2-3-4-1 has length 4, so the shortest cycle is at most 4. Step 2: check for shorter cycles; G has no triangle because vertices 5 and 6 have degree 1 and cannot lie on a cycle, and the square has no diagonal. Thus the shortest cycle has length exactly 4. The answer is 4."
          - problem: "Graph G is the triangle 1-2-3-1 together with the edge 4-5 and the isolated vertex 6. Graph H is the path 1-2-3-4-5 together with the isolated vertex 6. Both graphs have 6 vertices, 4 edges, and degree sequence 2,2,2,1,1,0. Find the number of components of G."
