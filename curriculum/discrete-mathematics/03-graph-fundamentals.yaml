          - problem: "Graph G has vertices 1,2,3,4,5,6 and edges 12, 23, 34, 45, 51, 16. Graph H has vertices a,b,c,d,e,f and edges ab, bc, ca, cd, de, ef. Both graphs have 6 vertices, 6 edges, and degree sequence 3,2,2,2,2,1. State whether G and H can be relabeled to match and give the length of the shortest cycle in G."
