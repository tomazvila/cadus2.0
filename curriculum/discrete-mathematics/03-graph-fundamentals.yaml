          reveal: 'Fixing one friend removes the rotations and leaves $3! = 6$ orders of the others. Counting cycles of a complete graph works the same way, with a further division by $2$ when a cycle and its reverse are the same.'
        exemplars:
          - problem: 'How many distinct Hamilton cycles does $K_5$ have? Cycles that differ only in their starting vertex or direction are counted as one.'
            answer: '12'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A Hamilton cycle in $K_5$ is a cyclic order of all $5$ vertices. Fixing the starting vertex leaves $4! = 24$ orders, and a cycle and its reverse are the same cycle, so divide by $2$. This gives $24/2 = 12$ cycles.'
          - problem: 'How many distinct Hamilton cycles does $K_4$ have, if a cycle and its reverse are the same and the starting vertex does not matter?'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Fixing the starting vertex leaves $3! = 6$ orders of the other three vertices. Each cycle appears twice in this list, once in each direction. So the number of cycles is $6/2 = 3$.'
          - problem: 'Six friends sit around a round table. Seating arrangements that differ only by rotation or by reflection are considered the same. How many distinct seating arrangements are there?'
            answer: '60'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Model the six friends as the vertices of the complete graph $K_6$, and each seating as a Hamilton cycle. A rotation gives the same cyclic order, and a reflection identifies a cycle with its reverse. The count is $(6-1)!/2 = 120/2 = 60$.'
          - problem: 'Five friends sit around a round table. Arrangements that differ only by a rotation are considered the same, but a seating and its mirror image are considered different arrangements. How many distinct seating arrangements are there?'
            answer: '24'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Fix one friend''s seat to remove the effect of rotations, then arrange the remaining $4$ friends in the other seats in $4! = 24$ ways. Mirror images are different here, so there is no division by $2$. The answer is $24$.'
          - problem: 'In the complete graph $K_6$, a Hamilton cycle and the same cycle traveled in the opposite direction are counted as two different cycles; the starting point is still irrelevant. How many distinct Hamilton cycles does $K_6$ have under this counting?'
            answer: '120'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Fix one vertex of $K_6$ as the starting point to remove rotations, then order the remaining $5$ vertices in $5! = 120$ ways. Opposite directions are counted separately, so no division by $2$ is made. The answer is $120$.'
          - problem: 'A salesman must visit each of $7$ cities exactly once and return to his starting city. Every two cities are joined by a direct road. How many different round trips are there, if a trip and the same trip in reverse count as one?'
            answer: '360'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A round trip is a Hamilton cycle in $K_7$. Fixing the starting city leaves $6! = 720$ orders, and each trip appears twice, once in each direction. So there are $720/2 = 360$ round trips.'
          - problem: 'A planner lists every distinct round trip through $7$ cities, where every two cities are joined by a road and a trip and its reverse count as one. She writes down $12$ trips per hour. How many hours does the list take?'
            answer: '30'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The number of round trips is the number of Hamilton cycles of $K_7$, which is $6!/2 = 360$. She writes $12$ trips each hour, so the time is found by division: $360/12 = 30$ hours.'
          - problem: 'Eight guests sit around a round table. Two seatings are the same if one is a rotation or a reflection of the other. How many different seatings are there?'
            answer: '2520'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The seatings correspond to the Hamilton cycles of $K_8$. Fixing one guest removes rotations and leaves $7! = 5040$ orders, and reflection pairs them up. So there are $5040/2 = 2520$ seatings.'
          - problem: 'The graph has vertices $a, b, 1, 2, 3$, and its edges join each of $a$ and $b$ to each of $1, 2, 3$, with no other edges. Does it have a Hamilton cycle?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "it does", "it has one"], ["no", "it does not", "it has none"]]}
            solution_sketch: 'Every edge joins one of the two vertices $a, b$ to one of $1, 2, 3$. A cycle through all five vertices would have to alternate between these two groups, which needs equally many vertices in each. One group has $2$ vertices and the other has $3$, so no Hamilton cycle exists.'
          - problem: 'The graph has vertices $a, b, 1, 2, 3$, and its edges join each of $a$ and $b$ to each of $1, 2, 3$, with no other edges. A Hamilton path visits every vertex exactly once and need not return to its start. How many Hamilton paths does the graph have, if a path and its reverse count as one?'
            answer: '6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A Hamilton path alternates between the groups $\{a, b\}$ and $\{1, 2, 3\}$, so it must start and end in the group of $3$ and has the form number, letter, number, letter, number. The three numbers can be placed in $3! = 6$ orders and the two letters in $2! = 2$ orders, giving $12$ paths with a direction. A path and its reverse count as one, so there are $12/2 = 6$ paths.'
        constraints: 'complete graphs n <= 8; formula (n-1)!/2; round tables and tours; or decide on a Hamilton cycle in a small graph'
      - id: kp2
        name: 'Dirac''s sufficient condition'
        key_prerequisites: [walks-paths-connectivity]
        exemplars:
          - problem: 'A graph has $8$ vertices and every vertex has degree at least $4$. Must it have a Hamilton cycle?'
            answer: 'yes'
            answer_contract: {"kind": "label", "options": [["yes", "it must", "it has one"], ["no", "not necessarily", "it need not"]]}
            solution_sketch: 'Here $n = 8$ and $n/2 = 4$. Every vertex has degree at least $4$, which equals $n/2$. So Dirac''s theorem applies and the graph must have a Hamilton cycle.'
          - problem: 'What is the smallest minimum degree that Dirac''s theorem needs in order to guarantee a Hamilton cycle in a graph with $12$ vertices?'
            answer: '6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Dirac''s theorem needs every vertex to have degree at least $n/2$. For $n = 12$ this is $12/2 = 6$. So the smallest minimum degree that the theorem accepts is $6$.'
          - problem: 'Ten guests are to sit around a round table so that each guest sits between two people he knows. Every guest knows at least $k$ of the others. What is the smallest $k$ for which Dirac''s theorem guarantees such a seating?'
            answer: '5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The seating is a Hamilton cycle in the graph whose edges join guests who know each other. This graph has $10$ vertices, so Dirac''s theorem needs every degree to be at least $10/2 = 5$. So the smallest $k$ is $5$.'
          - problem: 'The cycle graph $C_8$ has vertices $1, 2, \dots, 8$ and edges $12, 23, 34, 45, 56, 67, 78, 81$. Every vertex has degree $2$, which is below the Dirac bound $8/2 = 4$. How many Hamilton cycles does $C_8$ have?'
            answer: '1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The cycle $1, 2, 3, 4, 5, 6, 7, 8, 1$ visits every vertex once, so $C_8$ has a Hamilton cycle although Dirac''s condition fails. A Hamilton cycle must use two edges at every vertex, and each vertex has only $2$ edges. So every edge is used, and there is exactly $1$ Hamilton cycle.'
          - problem: 'A company has $20$ offices. It wants every office joined by a direct cable to at least $10$ other offices, so that Dirac''s theorem guarantees a closed tour through all offices. What is the smallest number of cables that this needs?'
            answer: '100'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Every one of the $20$ offices has at least $10$ cables, so the degrees add up to at least $20 \times 10 = 200$. Each cable is counted at both of its ends, so the number of cables is at least $200/2 = 100$. A graph with all degrees equal to $10$ has exactly $100$ cables.'
          - problem: 'At a conference, $9$ delegates must sit around a round table so that neighbours know each other. Each delegate knows at least $4$ of the others. Does Dirac''s theorem guarantee such a seating?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "it does", "guaranteed"], ["no", "it does not", "not guaranteed"]]}
            solution_sketch: 'The seating is a Hamilton cycle in the acquaintance graph, which has $9$ vertices. Dirac''s theorem needs every degree to be at least $9/2 = 4.5$. A degree of $4$ is below this, so the theorem does not apply, although a seating might still exist.'
          - problem: 'A delivery firm has $14$ depots. It wants every depot joined by a direct road to at least $d$ other depots, so that Dirac''s theorem guarantees a route that visits every depot once and returns. What is the smallest such $d$?'
            answer: '7'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The route is a Hamilton cycle in a graph with $14$ vertices. Dirac''s theorem needs every degree to be at least $14/2 = 7$. So the smallest $d$ is $7$.'
          - problem: 'The complete bipartite graph $K_{3,3}$ has vertices $a, b, c, 1, 2, 3$, and its edges join each of $a, b, c$ to each of $1, 2, 3$, with no other edges. Every vertex has degree $3 = 6/2$, so Dirac''s theorem applies. How many Hamilton cycles does the graph have, if cycles that differ only in their starting vertex or direction count as one?'
            answer: '6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A Hamilton cycle alternates between the groups $\{a, b, c\}$ and $\{1, 2, 3\}$. Starting at $a$, the numbers can be placed in $3! = 6$ orders and the letters $b, c$ in $2! = 2$ orders, giving $12$ cycles with a direction. A cycle and its reverse are the same cycle, so there are $12/2 = 6$ cycles.'
          - problem: 'A graph is made from two copies of $K_4$ that share exactly one vertex, so it has $7$ vertices. Every vertex has degree at least $3$, which is below $7/2$. How many Hamilton cycles does this graph have?'
            answer: '0'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The shared vertex joins the two copies, so removing it leaves two separate groups of $3$ vertices with no edge between them. A Hamilton cycle with one vertex removed is a path, which is connected, so no Hamilton cycle exists. The graph has $0$ Hamilton cycles, which shows that a degree below $n/2$ can fail.'
        constraints: 'n <= 20; must distinguish sufficient from necessary; contrast with Euler criteria'
    diagnostic_exemplar:
      problem: 'A graph has $10$ vertices, each of degree at least $5$. Must it have a Hamilton cycle?'
      answer: 'yes'
      answer_contract: {"kind": "label", "options": [["yes", "it must", "it has one"], ["no", "not necessarily", "it need not"]]}
      solution_sketch: 'Yes — Dirac''s theorem: every degree $\ge n/2 = 5$ forces a Hamilton cycle. The condition is sufficient but not necessary: $C_{10}$ is Hamiltonian with all degrees $2$. Dirac''s bound is $n/2$; the cycle $C_{10}$ witnesses non-necessity.'
