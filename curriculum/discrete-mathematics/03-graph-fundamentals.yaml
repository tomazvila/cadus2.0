        weight: 0.3
        key: false
    knowledge_points:
      - id: kp1
        name: "Non-isomorphism via basic invariants"
        key_prerequisites: [graphs-intro, degree-handshake]
        exemplars:
          - problem: 'Graph $G$ has $6$ vertices and $7$ edges, and graph $H$ has $6$ vertices and $8$ edges. Are $G$ and $H$ isomorphic?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "they are isomorphic", "isomorphic"], ["no", "they are not isomorphic", "not isomorphic", "nonisomorphic"]]}
            solution_sketch: 'Both graphs have $6$ vertices, so the vertex counts agree. The edge counts are $7$ and $8$, and an isomorphism keeps the number of edges, so the graphs are not isomorphic.'
          - problem: 'Graph $G$ has $5$ vertices with degrees $3, 3, 2, 2, 2$, and graph $H$ has $5$ vertices with degrees $4, 2, 2, 2, 2$. How many vertices of $H$ are adjacent to every other vertex of $H$?'
            answer: '1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A vertex of a graph with $5$ vertices is adjacent to every other vertex exactly when its degree is $4$. Graph $H$ has one such vertex, and graph $G$ has none, so $H$ has $1$ of them and the graphs are not isomorphic.'
          - problem: 'Graphs $G$ and $H$ are isomorphic. Graph $G$ has $6$ vertices with degrees $4, 3, 3, 2, 2, 2$. How many edges does $H$ have?'
            answer: '8'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Isomorphic graphs have the same degrees, and these add up to $4 + 3 + 3 + 2 + 2 + 2 = 16$. By the handshake lemma the number of edges is $16 / 2 = 8$.'
          - problem: 'Two floor plans are drawn as graphs, with a vertex for each room and an edge for each door. Plan A has $8$ rooms and $11$ doors. In plan B each of the $8$ rooms has exactly $3$ doors. How many more doors does plan B have than plan A?'
            answer: '1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Each door is counted from both of its rooms, so plan B has $8 \cdot 3 / 2 = 12$ doors. Plan A has $11$ doors, so plan B has $12 - 11 = 1$ more door.'
          - problem: 'Graphs $G$ and $H$ are isomorphic, and $G$ has $7$ vertices and $10$ edges. What is the sum of the degrees of the vertices of $H$?'
            answer: '20'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Isomorphic graphs have the same number of edges, so $H$ also has $10$ edges. The sum of the degrees is $2 \cdot 10 = 20$.'
          - problem: 'Graph $G$ has $6$ vertices with degrees $4, 4, 4, 4, 2, 2$, and graph $H$ has $6$ vertices with degrees $5, 5, 3, 3, 3, 3$. Which degrees occur in $H$ but not in $G$?'
            answer: '3, 5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The degrees that occur in $G$ are $2$ and $4$. The degrees that occur in $H$ are $3$ and $5$, and neither of them occurs in $G$, so the answer is $3$ and $5$.'
          - problem: 'The computer networks A and B have the same layout. Network A has $5$ servers with $4, 3, 3, 2, 2$ links. How many servers of network B have an odd number of links?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Networks with the same layout have the same numbers of links at their servers. The odd numbers are $3$ and $3$, so $2$ servers of network B have an odd number of links.'
        constraints: "graphs with <= 8 vertices given by counts, edge lists, or degree sequences; yes/no answers must name the violated invariant (vertex count, edge count, degree sequence); degree sums even; the item must test THIS KP: Non-isomorphism via basic invariants"
      - id: kp2
        name: "Exhibiting an isomorphism"
        key_prerequisites: [graphs-intro, functions-injective-surjective]
        exemplars:
          - problem: '$G$ has vertices $1, 2, 3, 4$ and edges $12, 13, 14$. $H$ has vertices $a, b, c, d$ and edges $ca, cb, cd$. Let $f$ be an isomorphism from $G$ to $H$. What is $f(1)$?'
            answer: 'c'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Vertex $1$ is the only vertex of degree $3$ in $G$, and vertex $c$ is the only vertex of degree $3$ in $H$. An isomorphism keeps degrees, so $f(1) = c$.'
          - problem: '$G$ has vertices $1, 2, 3, 4$ and edges $12, 23, 34, 41$. $H$ has vertices $1, 2, 3, 4$ and edges $13, 32, 24, 41$. Let $f$ be an isomorphism from $G$ to $H$ with $f(1) = 1$ and $f(2) = 3$. What is $f(3)$?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: '$G$ is the cycle $1-2-3-4-1$ and $H$ is the cycle $1-3-2-4-1$. Vertex $3$ is the neighbor of $2$ other than $1$, so $f(3)$ is the neighbor of $f(2) = 3$ in $H$ other than $f(1) = 1$, which is $2$.'
          - problem: '$G$ is the path $1 - 2 - 3 - 4 - 5$, and $H$ has vertices $1, 2, 3, 4, 5$ and edges $12, 13, 34, 45$. What are the possible values of $f(1)$ for an isomorphism $f$ from $G$ to $H$?'
            answer: '2, 5'
            answer_contract: {"kind": "exact"}
            solution_sketch: '$H$ is the path $2 - 1 - 3 - 4 - 5$, so its endpoints are $2$ and $5$. Vertex $1$ is an endpoint of $G$, so $f(1)$ is $2$ or $5$, and both choices give an isomorphism.'
          - problem: 'Two town maps have the same layout. Map A has junctions $P, Q, R, S, T$ and roads $PQ, QR, RS, ST, TQ$. Map B has junctions $1, 2, 3, 4, 5$ and roads $31, 15, 52, 24, 41$. In an isomorphism from map A to map B, which junction of map B corresponds to $P$?'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Junction $P$ is the only junction of map A with one road. In map B the only junction with one road is $3$, so $P$ corresponds to $3$.'
          - problem: '$G$ has vertices $1, \dots, 6$ and edges $12, 13, 14, 24, 25, 26, 34, 46$. $H$ has vertices $1, \dots, 6$ and edges $12, 13, 14, 16, 23, 24, 25, 35$. The graphs have exactly one isomorphism $f$ from $G$ to $H$. What is $f(6)$?'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Vertex $5$ is the only vertex of degree $1$ in $G$, and vertex $6$ is the only one in $H$, so $f(5) = 6$. Following the edges from there forces $f(2) = 1$, $f(4) = 2$ and $f(1) = 3$. Vertex $6$ of $G$ is joined to $2$ and $4$, and in $H$ only vertices $3$ and $4$ are joined to both $1$ and $2$, so $f(6) = 4$.'
          - problem: 'Sam proposes the map $1 \to a$, $2 \to b$, $3 \to d$, $4 \to c$, $5 \to e$ from the cycle $1-2-3-4-5-1$ to the cycle $a-b-c-d-e-a$. Is this map an isomorphism?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "it is an isomorphism", "an isomorphism"], ["no", "it is not an isomorphism", "not an isomorphism"]]}
            solution_sketch: 'The edge $23$ goes to $bd$ and the edge $45$ goes to $ce$, and neither is an edge of the second cycle. The other edges $12$, $34$ and $51$ map to edges, so $2$ edges fail, and Sam''s map is not an isomorphism.'
          - problem: 'Graph $G$ has vertices $1, 2, 3, 4, 5$ and edges $12, 23, 34, 45, 51$. Graph $H$ has vertices $a, b, c, d, e$ and edges $ab, bd, de, ec, ca$. Are $G$ and $H$ isomorphic?'
            answer: 'yes'
            answer_contract: {"kind": "label", "options": [["yes", "they are isomorphic", "isomorphic"], ["no", "they are not isomorphic", "not isomorphic", "nonisomorphic"]]}
            solution_sketch: '$G$ is the cycle $1-2-3-4-5-1$ and $H$ is the cycle $a-b-d-e-c-a$. The map $1 \to a$, $2 \to b$, $3 \to d$, $4 \to e$, $5 \to c$ sends every edge to an edge, so they are isomorphic.'
          - problem: 'Two computer networks have the same layout. Network 1 has servers $1, \dots, 6$ and links $12, 23, 34, 45, 56, 36$. Network 2 has servers $a, \dots, f$ and links $fc, ca, ae, eb, bd, ad$. Which server of network 2 plays the role of server $3$, the only server of network 1 with three links?'
            answer: 'a'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'An isomorphism keeps degrees, so the server with three links in network 2 plays the role of server $3$. The links $ca$, $ae$ and $ad$ show that this server is $a$.'
        constraints: "graphs with 4-6 vertices given as edge lists; the answer is a vertex bijection (mapping table); degree matching should guide the construction, and every edge must map to an edge"
      - id: kp3
        name: "Same degree sequence, still not isomorphic"
        key_prerequisites: [degree-handshake, walks-paths-connectivity]
        try_first:
          problem: 'Graph $G$ is the cycle $C_6$, and graph $H$ consists of two separate triangles. Each graph has $6$ vertices, $6$ edges, and every vertex of degree $2$. Are $G$ and $H$ isomorphic?'
          answer_contract: {"kind": "label", "options": [["yes", "they are isomorphic", "isomorphic"], ["no", "they are not isomorphic", "not isomorphic", "nonisomorphic"]]}
          answer: 'no'
          reveal: 'The graph $G$ is in one piece, but $H$ has two pieces, and an isomorphism keeps the number of connected components. Equal degrees do not make two graphs isomorphic.'
        exemplars:
          - problem: 'Graph $G$ is the $8$-cycle $1-2-3-4-5-6-7-8-1$. Graph $H$ has vertices $a, b, c, d, e, f, g, h$ and edges $ab, bc, ca, de, ef, fg, gh, hd$. Both graphs have $8$ vertices, $8$ edges, and every vertex of degree $2$. Are $G$ and $H$ isomorphic?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "they are isomorphic", "isomorphic"], ["no", "they are not isomorphic", "not isomorphic", "nonisomorphic"]]}
            solution_sketch: '$G$ has $1$ connected component, but $H$ is a triangle together with a separate $5$-cycle, so $H$ has $2$ components. An isomorphism keeps the number of components, so the graphs are not isomorphic.'
          - problem: 'Lab A joins six computers $1, \dots, 6$ in a line $1-2-3-4-5-6$. Lab B has computers $a, \dots, f$ with cables $ab, bc, cd, da, ef$. Both labs have $6$ computers, $5$ cables, and two computers with one cable and four with two. How many separate connected groups of computers does lab B have?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'In lab B the cables $ab$, $bc$, $cd$ and $da$ join $a, b, c, d$ into one group. The cable $ef$ joins $e$ and $f$ into a second group, so lab B has $2$ groups while lab A has $1$.'
          - problem: 'Graph $G$ has vertices $1, \dots, 5$ and edges $12, 23, 34, 45, 52$. Graph $H$ has vertices $a, \dots, e$ and edges $ab, bc, ca, cd, de$. Both graphs have $5$ vertices, $5$ edges, and degree sequence $3, 2, 2, 2, 1$. What is the length of the shortest cycle in $H$?'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The edges $ab$, $bc$ and $ca$ form a cycle of length $3$, and a cycle needs at least $3$ vertices. So the shortest cycle in $H$ has length $3$, while the only cycle of $G$ has length $4$.'
          - problem: 'Each of two wiring diagrams has $6$ junctions and $9$ wires, with exactly $3$ wires at every junction. In diagram A, each of the junctions $1, 2, 3$ is wired to each of $4, 5, 6$, and there are no other wires. In diagram B, the junctions $1, 2, 3$ are wired in a triangle, the junctions $4, 5, 6$ are wired in a triangle, and the extra wires are $14$, $25$ and $36$. How many triangles, that is sets of three junctions that are pairwise wired, does diagram A contain?'
            answer: '0'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Every wire of diagram A joins a junction of $\{1, 2, 3\}$ to a junction of $\{4, 5, 6\}$, so no triangle has all three sides. Diagram A has $0$ triangles, but diagram B has $2$, so the diagrams are not the same.'
          - problem: 'Graph $G$ has vertices $1, \dots, 6$ and edges $12, 23, 34, 45, 51, 16$. Graph $H$ has vertices $a, \dots, f$ and edges $ab, bc, ca, cd, de, ef$. Both graphs have $6$ vertices, $6$ edges, and degree sequence $3, 2, 2, 2, 2, 1$. What is the length of the shortest cycle in $G$?'
            answer: '5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The only cycle in $G$ is $1-2-3-4-5-1$, since vertex $6$ has degree $1$ and lies on no cycle. Its length is $5$, while $H$ has a cycle of length $3$, so the graphs are different.'
          - problem: 'Graph $G$ is the triangle $1-2-3-1$ together with the edge $45$ and the isolated vertex $6$. Graph $H$ is the path $1-2-3-4-5$ together with the isolated vertex $6$. Both graphs have $6$ vertices, $4$ edges, and degree sequence $2, 2, 2, 1, 1, 0$. How many connected components does $G$ have?'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The triangle is one component, the edge $45$ is a second component, and the isolated vertex $6$ is a third component. So $G$ has $3$ components, and $H$ has $2$.'
          - problem: 'Graph $G$ has vertices $1, \dots, 6$ and edges $12, 23, 31, 34, 45, 56$. Graph $H$ has vertices $a, \dots, f$ and edges $ce, ea, ac, af, fb, bd$. Both graphs have $6$ vertices, $6$ edges, and degree sequence $3, 2, 2, 2, 2, 1$. Are $G$ and $H$ isomorphic?'
            answer: 'yes'
            answer_contract: {"kind": "label", "options": [["yes", "they are isomorphic", "isomorphic"], ["no", "they are not isomorphic", "not isomorphic", "nonisomorphic"]]}
            solution_sketch: '$G$ is a triangle $1-2-3$ with the path $3-4-5-6$ attached at $3$. The map $1 \to c$, $2 \to e$, $3 \to a$, $4 \to f$, $5 \to b$, $6 \to d$ sends every edge to an edge, so the graphs are isomorphic.'
        constraints: "pairs with <= 8 vertices agreeing on vertex count, edge count, and degree sequence; distinguish via component counts or cycle lengths; yes/no answers must name the distinguishing invariant"
    diagnostic_exemplar:
      problem: '$G$ is the cycle $C_8$; $H$ consists of two disjoint $4$-cycles. Both are $2$-regular with $8$ vertices and $8$ edges. Decide whether $G$ and $H$ are isomorphic: give an isomorphism, or name an invariant that differs.'
      answer: 'Not isomorphic: $G$ is connected ($1$ component) while $H$ has $2$ components, and the number of components is preserved by isomorphisms.'
      answer_contract: {kind: none}
      solution_sketch: 'Vertex count, edge count, and degree sequence all agree — the component count is the distinguishing invariant.'
    anki_seeds:
      - front: "Definition of a graph isomorphism"
        back: 'A bijection $f$ between the vertex sets with $uv$ an edge iff $f(u)f(v)$ is an edge.'
        type: basic
      - front: "Invariants preserved by graph isomorphism"
        back: "Vertex count, edge count, degree sequence, number of components, cycle lengths."
        type: basic
      - front: "Does an equal degree sequence guarantee two graphs are isomorphic?"
        back: 'No — $C_6$ and two disjoint triangles are both $2$-regular on $6$ vertices but not isomorphic (component counts differ).'
        type: basic

  - id: euler-trails-circuits
    name: "Euler Trails & Circuits"
    core: false                # named terminal graph result
    difficulty: 0.6
    drill: false
    answer_kind: numeric
    expected_time_secs: 150
    prerequisites:
      - id: walks-paths-connectivity
        weight: 0.8
        key: true
      - id: degree-handshake
        weight: 0.7
        key: true
    knowledge_points:
      - id: kp1
        name: 'Existence criteria from degree parity'
        key_prerequisites: [walks-paths-connectivity, degree-handshake]
        try_first:
          problem: 'Is it possible to draw a triangle with corners $A, B, C$ by tracing each side exactly once without lifting the pencil, and to finish at the corner where you started?'
          answer_contract: {"kind": "label", "options": [["yes", "it is possible", "possible"], ["no", "it is not possible", "not possible", "impossible"]]}
          answer: 'yes'
          reveal: 'Each corner of a triangle meets two sides, an even number, so you can leave every corner you enter. This pairing of edges at each vertex is the idea behind the Euler circuit test.'
        exemplars:
          - problem: 'The graph $G$ has vertices $1, 2, 3, 4, 5, 6$ and edges $12, 23, 34, 45, 56, 61, 13$. Does $G$ have an Euler circuit, an Euler trail that is not a circuit, or neither?'
            answer: 'trail'
            answer_contract: {"kind": "label", "options": [["circuit", "euler circuit", "an euler circuit"], ["trail", "euler trail", "an euler trail", "trail but not a circuit", "an euler trail but not a circuit", "euler trail but no euler circuit"], ["neither", "none", "no euler circuit or trail", "no euler circuit and no euler trail"]]}
            solution_sketch: 'The graph is connected, because the edges $12, 23, 34, 45, 56, 61$ form a cycle through all six vertices. Vertices $1$ and $3$ have degree $3$, and the other four vertices have degree $2$. Exactly two vertices have odd degree, so $G$ has an Euler trail but no Euler circuit.'
          - problem: 'A street inspector must drive along every street of a town exactly once and end at the junction where she started. The street map is connected with six junctions, and the numbers of streets that meet at the junctions are $2, 2, 2, 4, 4, 2$. How many streets does she drive along in all?'
            answer: '8'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Every junction has even degree and the map is connected, so a tour of the kind she wants exists. The degrees add up to $2+2+2+4+4+2 = 16$, and each street is counted at both of its ends, so there are $16/2 = 8$ streets. The tour uses each street once, so she drives along $8$ streets.'
          - problem: 'A connected graph has neither an Euler circuit nor an Euler trail. What is the smallest possible number of vertices of odd degree that it has?'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A circuit needs $0$ odd vertices and a trail needs $0$ or $2$ odd vertices. To have neither, the graph must have more than $2$ odd vertices. The number of odd-degree vertices is always even by the handshake lemma, so the smallest number greater than $2$ is $4$.'
          - problem: 'A connected graph has an Euler trail but no Euler circuit. How many vertices of odd degree does it have?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A connected graph has an Euler trail exactly when it has $0$ or $2$ vertices of odd degree. With no Euler circuit, the case of $0$ odd vertices is ruled out, because $0$ odd vertices gives a circuit. The only case left is $2$ vertices of odd degree.'
          - problem: 'A park has six junctions $1, 2, 3, 4, 5, 6$ and paths $12, 23, 34, 45, 56, 61, 14$. A ranger wants to walk along every path exactly once and finish at the junction where she started. Is this possible?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "it is possible", "possible"], ["no", "it is not possible", "not possible", "impossible"]]}
            solution_sketch: 'Junctions $1$ and $4$ each have three paths, and the other four junctions have two paths. A walk that uses every path once and returns to its start needs every junction to have an even number of paths. Two junctions have an odd number, so the ranger cannot do it.'
          - problem: 'A country has $n$ towns, with one road joining every two towns. An inspector wants to drive along every road exactly once and return to the town where she started. For $4 \le n \le 10$, what is the largest $n$ for which this is possible?'
            answer: '9'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The road map is the complete graph $K_n$, which is connected and has every degree equal to $n-1$. An Euler circuit needs every degree to be even, so $n-1$ must be even and $n$ must be odd. The largest odd value of $n$ from $4$ to $10$ is $9$.'
          - problem: 'The graph with vertices $1, 2, 3, 4, 5, 6$ and edges $12, 23, 34, 45, 56, 61, 13$ has an Euler trail that starts at vertex $3$. At which vertex does this trail end?'
            answer: '1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The vertices of odd degree are $1$ and $3$, because both have degree $3$ and the other vertices have degree $2$. An Euler trail that is not a circuit starts at one odd vertex and ends at the other. The trail starts at $3$, so it ends at $1$.'
        constraints: 'connected graphs <= 8 vertices; degree parity decides circuit, trail or neither; contexts: tours, ranger and inspector routes'
      - id: kp2
        name: 'Bridges of Konigsberg and route problems'
        key_prerequisites: [walks-paths-connectivity, degree-handshake]
        exemplars:
          - problem: 'In the old town of Konigsberg, four districts were joined by seven bridges. Three districts had $3$ bridges each and one district had $5$ bridges. Could a person cross every bridge exactly once?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "it could", "possible"], ["no", "it could not", "not possible", "impossible"]]}
            solution_sketch: 'Treat the districts as vertices and the bridges as edges, so the degrees are $3, 3, 3, 5$. All four degrees are odd, which is more than two vertices of odd degree. So no walk crosses every bridge exactly once, whether or not it returns to its start.'
          - problem: 'In the Konigsberg network the four districts have $3, 3, 3$ and $5$ bridges. What is the smallest number of new bridges, each joining two districts, that must be built so that a walk can cross every bridge exactly once and end where it started?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A walk of that kind needs every district to have an even number of bridges. All four districts have an odd number, and each new bridge changes the count at exactly two districts. So at least $4/2 = 2$ new bridges are needed, and two are enough if they join the districts in two pairs.'
          - problem: 'A connected road network has six junctions where an odd number of roads meet, and every other junction has an even number. Each gritting route is a walk that uses a road at most once. What is the fewest routes that together cover every road exactly once?'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A single route covers every road exactly once only when it has at most two odd vertices, which are its two ends. Each route can therefore use up at most two of the six odd junctions as its ends, so at least $6/2 = 3$ routes are needed. Three routes are enough because the network is connected.'
          - problem: 'A delivery network is a connected multigraph on junctions $1, 2, 3, 4$ whose degrees are $3, 2, 4, 1$. A driver must use every street exactly once and end at a different junction from the one where she started. At which junctions can the route start?'
            answer: '1, 4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The degrees $3$ and $1$ are odd, so junctions $1$ and $4$ are the odd vertices, and junctions $2$ and $3$ have even degree. An Euler trail that is not a circuit starts at one odd vertex and ends at the other. So the route can start only at junction $1$ or at junction $4$.'
          - problem: 'A museum has $6$ rooms, and every two rooms are joined by exactly one door. A guard wants to walk through every door exactly once and finish in the room where she started. What is the smallest number of doors that must be removed so that this is possible, with every room still reachable from every other?'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Each room has $5$ doors, an odd number, so all $6$ rooms must change parity. Removing one door changes the count at exactly two rooms, so at least $6/2 = 3$ doors must go. Removing three doors that share no room leaves $4$ doors at every room and keeps the museum connected, so $3$ is enough.'
          - problem: 'The districts $A, B, C, D, E$ of a town are joined by bridges $AB, AB, BC, CD, DE, EA, AC$, where $AB$ is listed twice because there are two bridges between $A$ and $B$. A walker starts in district $B$ and crosses every bridge exactly once. In which district does the walk end?'
            answer: 'C'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'District $A$ has four bridges, $B$ has three, $C$ has three, and $D$ and $E$ have two each. The odd districts are $B$ and $C$. A walk that crosses every bridge once and starts at the odd district $B$ must end at the other odd district, which is $C$.'
          - problem: 'A museum has $8$ rooms, and every two rooms are joined by exactly one door. What is the fewest number of walks, each using a door at most once, that together use every door exactly once?'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Each room has $7$ doors, an odd number, so all $8$ rooms have odd degree. Each walk has two ends, and only an end can be a room of odd degree, so at least $8/2 = 4$ walks are needed. Four walks are enough because the museum is connected.'
        constraints: 'route/bridge framings; multigraphs allowed; justification through degree parity required'
    diagnostic_exemplar:
      problem: 'For which $n \ge 3$ does the complete graph $K_n$ have an Euler circuit? Justify your answer with the degrees.'
      answer: 'exactly the odd n: K_n is connected and every vertex has degree n - 1, which is even precisely when n is odd (for even n every degree is odd, and more than two odd vertices rule out even an Euler trail)'
      answer_contract: {kind: none}
      solution_sketch: 'Euler circuit $\iff$ connected and all degrees even; in $K_n$ every degree is $n - 1$.'
    anki_seeds:
      - front: "Euler circuit existence criterion"
        back: "Connected (ignoring isolated vertices) and every vertex of even degree."
        type: basic
      - front: "Euler trail (not circuit) existence criterion"
        back: "Connected with exactly two odd-degree vertices — the trail's endpoints."
        type: basic

