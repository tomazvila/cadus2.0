unit: number-theory
course: discrete-mathematics
module: "Number Theory"
topics:
  - id: division-algorithm
    name: "Divisibility & the Division Algorithm"
    core: true
    difficulty: 0.45
    drill: false
    answer_kind: numeric
    expected_time_secs: 90
    prerequisites:
      - id: long-division
        weight: 0.7
        key: true
      - id: divisibility-rules
        weight: 0.5
        key: false
      - id: divisibility-parity-proofs
        weight: 0.4
        key: true
    knowledge_points:
      - id: kp1
        name: "Quotient and remainder, including negative dividends"
        key_prerequisites: [long-division]
        exemplars:
          - problem: 'Find the quotient $q$ and remainder $r$ with $0 \le r < 13$ when $100$ is divided by $13$.'
            answer: '7 R9'
            answer_contract: {kind: quotient_remainder, divisor: 13}
            solution_sketch: '$13 \cdot 7 = 91 \le 100 < 104 = 13 \cdot 8$, so $q = 7$ and $r = 100 - 91 = 9$.'
          - problem: 'Find $q$ and $r$ with $0 \le r < 6$ so that $-27 = 6q + r$.'
            answer: '-5 R3'
            answer_contract: {kind: quotient_remainder, divisor: 6}
            solution_sketch: 'The remainder must be nonnegative: $6 \cdot (-5) = -30 \le -27$, so $r = -27 - (-30) = 3$. Note $q = -4$ would give $r = -3 < 0$, which is not allowed.'
          - problem: "Find the quotient $q$ and remainder $r$ with $0 \\le r < 5$ when $84$ is divided by $5$. Give the answer as (q, r)."
            answer: "(16, 4)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "Step 1: By the division algorithm, write $84 = 5q + r$ with $0 \\le r < 5$. Step 2: By testing multiples, $5 \\cdot 16 = 80$, so $q = 16$ and $r = 84 - 80 = 4$. The quotient and remainder are (16, 4)."
          - problem: "Find the quotient $q$ and remainder $r$ with $0 \\le r < 7$ so that $-100 = 7q + r$. Give the answer as (q, r)."
            answer: "(-15, 5)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "Step 1: By the division algorithm for a negative dividend, $q = floor(-100/7) = -15$. Step 2: By the remainder formula, $r = -100 - 7(-15) = 5$, and $0 \\le 5 < 7$. The quotient and remainder are (-15, 5)."
          - problem: "Use the division algorithm to divide $250$ by $14$. Give the quotient $q$ and remainder $r$ as (q, r), with $0 \\le r < 14$."
            answer: "(17, 12)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "Step 1: By the division algorithm, locate the largest multiple of $14$ not exceeding $250$. Step 2: Since $14 \\cdot 17 = 238$ and $14 \\cdot 18 = 252$, $q = 17$ and $r = 250 - 238 = 12$. The quotient and remainder are (17, 12)."
          - problem: "Find $q$ and $r$ with $0 \\le r < 9$ so that $-47 = 9q + r$. Give the answer as (q, r)."
            answer: "(-6, 7)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "Step 1: By the division algorithm for a negative dividend, $q = floor(-47/9) = -6$. Step 2: By the remainder formula, $r = -47 - 9(-6) = 7$, and $0 \\le 7 < 9$. The quotient and remainder are (-6, 7)."
        constraints: "divisors 2-15; include at least one negative dividend; remainder must satisfy 0 <= r < d"
      - id: kp2
        name: "Residue classes as a case tool"
        key_prerequisites: [divisibility-parity-proofs]
        exemplars:
          - problem: 'Every integer has the form $3k$, $3k+1$, or $3k+2$. Which of these forms can a perfect square take? Equivalently: what are the possible remainders of $n^2$ on division by $3$?'
            answer: '{0, 1}'
            answer_contract: {kind: set}
            solution_sketch: '$(3k)^2 = 3(3k^2)$ leaves $0$; $(3k+1)^2 = 3(3k^2+2k)+1$ leaves $1$; $(3k+2)^2 = 3(3k^2+4k+1)+1$ leaves $1$.'
          - problem: 'What are the possible remainders of a perfect square on division by $4$?'
            answer: '{0, 1}'
            answer_contract: {kind: set}
            solution_sketch: 'A perfect square is never $2$ or $3$ mod $4$. Even squares $(2k)^2 = 4k^2$ leave $0$; odd squares $(2k+1)^2 = 4(k^2+k)+1$ leave $1$.'
          - problem: "Use the residue classes modulo 8. Find all possible remainders of n^3 on division by 8."
            answer: "{0, 1, 3, 5, 7}"
            answer_contract: {"kind": "set"}
            solution_sketch: "The full residue class list modulo 8 is 0,1,2,3,4,5,6,7. Residue-class step: test each class. Substitution step: cubing gives 0,1,8,27,64,125,216,343. Reduction step: these are 0,1,0,3,0,5,0,7 modulo 8. Collect step: the distinct remainders are 0,1,3,5,7, so the answer is {0, 1, 3, 5, 7}."
          - problem: "Use the residue classes modulo 4. Find all possible remainders of n^3 on division by 4."
            answer: "{0, 1, 3}"
            answer_contract: {"kind": "set"}
            solution_sketch: "The full residue class list modulo 4 is 0,1,2,3. Residue-class step: test each class. Substitution step: cubing gives 0,1,8,27. Reduction step: these are 0,1,0,3 modulo 4. Collect step: the distinct remainders are 0,1,3, so the answer is {0, 1, 3}."
          - problem: "Use the residue classes modulo 8. Find all possible remainders of n(n+1) on division by 8."
            answer: "{0, 2, 4, 6}"
            answer_contract: {"kind": "set"}
            solution_sketch: "The full residue class list modulo 8 is 0,1,2,3,4,5,6,7. Residue-class step: test each class. Substitution step: n(n+1) gives 0,2,6,12,20,30,42,56. Reduction step: these are 0,2,6,4,4,6,2,0 modulo 8. Collect step: the distinct remainders are 0,2,4,6, so the answer is {0, 2, 4, 6}."
          - problem: "Use the residue classes modulo 8. Find all possible remainders of n^2 + n + 1 on division by 8."
            answer: "{1, 3, 5, 7}"
            answer_contract: {"kind": "set"}
            solution_sketch: "The full residue class list modulo 8 is 0,1,2,3,4,5,6,7. Residue-class step: test each class. Substitution step: n^2+n+1 gives 1,3,7,13,21,31,43,57. Reduction step: these are 1,3,7,5,5,7,3,1 modulo 8. Collect step: the distinct remainders are 1,3,5,7, so the answer is {1, 3, 5, 7}."
        constraints: "moduli 3, 4, or 8; verify claims by checking each residue class"
    diagnostic_exemplar:
      problem: 'Using the residue classes mod $8$, find all possible remainders of a perfect square on division by $8$.'
      answer: '{0, 1, 4}'
      answer_contract: {kind: set}
      solution_sketch: 'Check $r = 0, \dots, 7$: $r^2 \bmod 8$ gives $0, 1, 4, 1, 0, 1, 4, 1$.'
    anki_seeds:
      - front: "Division algorithm: for integers $a$ and $d > 0$ there exist unique $q, r$ with..."
        back: '$a = dq + r$ and $0 \le r < d$.'
        type: basic
      - front: "Possible remainders of a perfect square mod 4?"
        back: "0 or 1 (never 2 or 3)."
        type: basic

  - id: euclidean-algorithm
    name: "Euclidean Algorithm & Bezout's Identity"
    core: true
    difficulty: 0.5
    drill: false
    answer_kind: numeric
    expected_time_secs: 150
    prerequisites:
      - id: division-algorithm
        weight: 0.8
        key: true
      - id: gcf-lcm
        weight: 0.6
        key: true
    knowledge_points:
      - id: kp1
        name: "Computing gcd by repeated division"
        key_prerequisites: [division-algorithm, gcf-lcm]
        exemplars:
          - problem: 'Use the Euclidean algorithm to compute $\gcd(252, 198)$.'
            answer: "18"
            solution_sketch: '$252 = 1 \cdot 198 + 54$; $198 = 3 \cdot 54 + 36$; $54 = 1 \cdot 36 + 18$; $36 = 2 \cdot 18 + 0$. Last nonzero remainder: $18$.'
          - problem: 'Use the Euclidean algorithm to compute $\gcd(1071, 462)$.'
            answer: "21"
            solution_sketch: '$1071 = 2 \cdot 462 + 147$; $462 = 3 \cdot 147 + 21$; $147 = 7 \cdot 21 + 0$.'
          - problem: "Find the greatest common divisor of 418 and 253 by repeated division."
            answer: "11"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Find the greatest common divisor of 418 and 253 by repeated division. The Euclidean algorithm uses the division algorithm to replace the gcd of a and b by the gcd of b and a mod b. Compute 418 = 1*253 + 165, so gcd(418, 253) = gcd(253, 165). Next 253 = 1*165 + 88, so gcd(253, 165) = gcd(165, 88). Next 165 = 1*88 + 77, so gcd(165, 88) = gcd(88, 77). Next 88 = 1*77 + 11, so gcd(88, 77) = gcd(77, 11). Finally 77 = 7*11 + 0, so the last nonzero remainder is 11. The greatest common divisor is 11."
          - problem: "A florist has a 1274 cm ribbon and an 858 cm ribbon. She cuts both ribbons into pieces of one equal whole length, with no ribbon left over, choosing the greatest such length. Find that length in cm."
            answer: "26"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The greatest piece length is the gcd of 1274 and 858. The Euclidean algorithm uses the division algorithm to replace the gcd of a and b by the gcd of b and a mod b. Compute 1274 = 1*858 + 416, so gcd(1274, 858) = gcd(858, 416). Next 858 = 2*416 + 26, so gcd(858, 416) = gcd(416, 26). Finally 416 = 16*26 + 0, so the last nonzero remainder is 26. The piece length is 26."
          - problem: "A rectangular floor measures 840 cm by 468 cm. It is tiled exactly by square tiles of the largest possible side length. Find that side length in cm."
            answer: "12"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The largest square tile side is the gcd of 840 and 468. Use the Euclidean algorithm with the division algorithm at each step. Compute 840 = 1*468 + 372, so gcd(840, 468) = gcd(468, 372). Next 468 = 1*372 + 96, so gcd(468, 372) = gcd(372, 96). Next 372 = 3*96 + 84, so gcd(372, 96) = gcd(96, 84). Next 96 = 1*84 + 12, so gcd(96, 84) = gcd(84, 12). Finally 84 = 7*12 + 0, so the last nonzero remainder is 12. The side length is 12."
          - problem: "A teacher has 561 markers and 323 crayons. She packs them all into identical kits, each kit holding the same number of markers and the same number of crayons as every other kit. Find the greatest number of kits she can make."
            answer: "17"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The greatest number of kits is the gcd of 561 and 323. The Euclidean algorithm uses the division algorithm to replace the gcd of a and b by the gcd of b and a mod b. Compute 561 = 1*323 + 238, so gcd(561, 323) = gcd(323, 238). Next 323 = 1*238 + 85, so gcd(323, 238) = gcd(238, 85). Next 238 = 2*85 + 68, so gcd(238, 85) = gcd(85, 68). Next 85 = 1*68 + 17, so gcd(85, 68) = gcd(68, 17). Finally 68 = 4*17 + 0, so the last nonzero remainder is 17. The greatest number of kits is 17."
        constraints: "operands 40-2000 requiring 3-5 division steps; answers > 1 preferred"
      - id: kp2
        name: "gcd-lcm relationship"
        key_prerequisites: [gcf-lcm]
        exemplars:
          - problem: 'Given $\gcd(252, 198) = 18$, compute $\mathrm{lcm}(252, 198)$.'
            answer: "2772"
            solution_sketch: '$\mathrm{lcm}(a,b) = ab/\gcd(a,b) = 252 \cdot 198 / 18 = 252 \cdot 11 = 2772$.'
          - problem: 'Two positive integers have product $864$ and gcd $6$. What is their lcm?'
            answer: "144"
            solution_sketch: '$\mathrm{lcm} = 864 / 6 = 144$.'
          - problem: "Two positive integers are 48 and 180. Using the identity $\\gcd(a,b) \\cdot \\mathrm{lcm}(a,b) = ab$, compute $\\mathrm{lcm}(48, 180)$."
            answer: "720"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1, Euclidean algorithm: 180 = 3*48 + 36, 48 = 1*36 + 12, 36 = 3*12 + 0, so gcd(48, 180) = 12. Step 2, product identity: gcd(48, 180) * lcm(48, 180) = 48 * 180 = 8640. Step 3, division: lcm = 8640 / 12 = 720. The lcm of 48 and 180 is 720."
          - problem: "Let $g = \\gcd(72, 120)$ and $l = \\mathrm{lcm}(72, 120)$. Compute both values, using the identity $g \\cdot l = 72 \\cdot 120$. Give the answer as g = value; l = value."
            answer: "g = 24; l = 360"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "g"}, {"contract": {"kind": "exact"}, "name": "l"}]}
            solution_sketch: "Step 1, Euclidean algorithm: 120 = 1*72 + 48, 72 = 1*48 + 24, 48 = 2*24 + 0, so g = gcd(72, 120) = 24. Step 2, product identity: g * l = 72 * 120 = 8640. Step 3, division: l = 8640 / 24 = 360. The results are g = 24; l = 360."
          - problem: "One bell rings every 85 seconds and another rings every 119 seconds, and both just rang at the same moment. Using the identity $\\gcd(a,b) \\cdot \\mathrm{lcm}(a,b) = ab$, determine after how many seconds the two bells will next ring at the same time."
            answer: "595"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1, simultaneous ring: the first time that is a multiple of both 85 and 119 is lcm(85, 119). Step 2, Euclidean algorithm: 119 = 1*85 + 34, 85 = 2*34 + 17, 34 = 2*17 + 0, so gcd(85, 119) = 17. Step 3, product identity: lcm = 85 * 119 / 17 = 10115 / 17 = 595. The bells next ring together after 595 seconds."
          - problem: "A student claims that $\\mathrm{lcm}(34, 48) = 1632$. Compute $\\gcd(34, 48)$ with the Euclidean algorithm, then use the identity $\\gcd(a,b) \\cdot \\mathrm{lcm}(a,b) = 34 \\cdot 48$ to check the claim. Give the verdict and the lcm in the form verdict = word; lcm = number."
            answer: "verdict = incorrect; lcm = 816"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["correct"], ["incorrect"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "lcm"}]}
            solution_sketch: "Step 1, Euclidean algorithm: 48 = 1*34 + 14, 34 = 2*14 + 6, 14 = 2*6 + 2, 6 = 3*2 + 0, so gcd(34, 48) = 2. Step 2, product identity: lcm(34, 48) = 34 * 48 / 2 = 1632 / 2 = 816. The wrong option correct comes from multiplying 34 by 48 and forgetting to divide by the gcd 2. Thus verdict = incorrect; lcm = 816."
        constraints: "use gcd(a,b) * lcm(a,b) = ab; numbers chosen so the division is exact"
      - id: kp3
        name: "Back-substitution: gcd as an integer combination"
        key_prerequisites: [division-algorithm]
        exemplars:
          - problem: 'Find integers $x, y$ with $20x + 7y = 1$.'
            answer: 'x = -1; y = 3'
            answer_contract: {kind: multipart, parts: [{name: x, contract: {kind: exact}}, {name: y, contract: {kind: exact}}]}
            solution_sketch: '$20 = 2 \cdot 7 + 6$; $7 = 1 \cdot 6 + 1$. Back-substitute: $1 = 7 - 6 = 7 - (20 - 2 \cdot 7) = 3 \cdot 7 - 20$.'
          - problem: 'Express $\gcd(42, 30) = 6$ in the form $42x + 30y$.'
            answer: 'x = 3; y = -4'
            answer_contract: {kind: multipart, parts: [{name: x, contract: {kind: exact}}, {name: y, contract: {kind: exact}}]}
            solution_sketch: '$42 = 1 \cdot 30 + 12$; $30 = 2 \cdot 12 + 6$. Back-substitute: $6 = 30 - 2 \cdot 12 = 30 - 2(42 - 30) = 3 \cdot 30 - 2 \cdot 42$; equivalently $42 \cdot 3 + 30 \cdot (-4) = 126 - 120 = 6$. Any pair satisfying the equation is correct.'
          - problem: "Use the Euclidean algorithm on 56 and 15, then back-substitute to express gcd(56, 15) = 1 as 56x + 15y. Give integers x and y as x = ...; y = ..."
            answer: "x = -4; y = 15"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "x"}, {"contract": {"kind": "exact"}, "name": "y"}]}
            solution_sketch: "Euclidean algorithm: 56 = 3*15 + 11, 15 = 1*11 + 4, 11 = 2*4 + 3, 4 = 1*3 + 1, so the last nonzero remainder is 1. Back-substitution: 1 = 4 - 1*3 = 4 - (11 - 2*4) = 3*4 - 11 = 3*(15 - 11) - 11 = 3*15 - 4*11 = 3*15 - 4*(56 - 3*15) = 15*15 - 4*56. Verification: 56*(-4) + 15*15 = -224 + 225 = 1, so x = -4; y = 15."
          - problem: "Express gcd(50, 18) = 2 in the form 50x + 18y using back-substitution from the Euclidean algorithm. Give integers x and y as x = ...; y = ..."
            answer: "x = 4; y = -11"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "x"}, {"contract": {"kind": "exact"}, "name": "y"}]}
            solution_sketch: "Euclidean algorithm: 50 = 2*18 + 14, 18 = 1*14 + 4, 14 = 3*4 + 2, so the last nonzero remainder is 2. Back-substitution: 2 = 14 - 3*4 = 14 - 3*(18 - 14) = 4*14 - 3*18 = 4*(50 - 2*18) - 3*18 = 4*50 - 11*18. Verification: 50*4 + 18*(-11) = 200 - 198 = 2, so x = 4; y = -11."
          - problem: "Find the integer x with 0 <= x < 6 such that 23x + 6y = 1 for some integer y."
            answer: "5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Euclidean algorithm: 23 = 3*6 + 5, 6 = 1*5 + 1, so gcd(23, 6) = 1. Back-substitution: 1 = 6 - 1*5 = 6 - (23 - 3*6) = 4*6 - 23, giving a base solution x = -1, y = 4. General solutions are x = -1 + 6k, y = 4 - 23k. The condition 0 <= x < 6 forces k = 1, so x = 5."
          - problem: "Find integers x and y with 40x + 17y = 1, using the Euclidean algorithm and back-substitution."
            answer: "x = 3; y = -7"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "x"}, {"contract": {"kind": "exact"}, "name": "y"}]}
            solution_sketch: "Euclidean algorithm: 40 = 2*17 + 6, 17 = 2*6 + 5, 6 = 1*5 + 1, so the last nonzero remainder is 1. Back-substitution: 1 = 6 - 1*5 = 6 - (17 - 2*6) = 3*6 - 17 = 3*(40 - 2*17) - 17 = 3*40 - 7*17. Verification: 40*3 + 17*(-7) = 120 - 119 = 1, so x = 3; y = -7."
        constraints: "operands small enough for 2-3 back-substitution steps; accept any valid Bezout pair, require a verification check"
    diagnostic_exemplar:
      problem: 'Run the Euclidean algorithm on $25$ and $7$, then back-substitute to find integers $x, y$ with $25x + 7y = 1$.'
      answer: 'x = 2; y = -7'
      answer_contract: {kind: multipart, parts: [{name: x, contract: {kind: exact}}, {name: y, contract: {kind: exact}}]}
      solution_sketch: '$25 = 3 \cdot 7 + 4$, $7 = 1 \cdot 4 + 3$, $4 = 1 \cdot 3 + 1$; back: $1 = 4 - 3 = 2 \cdot 4 - 7 = 2 \cdot 25 - 7 \cdot 7$.'
    anki_seeds:
      - front: "Euclidean algorithm key step: $\\gcd(a, b) = \\gcd(b, \\; ?)$ for $a = bq + r$"
        back: '$\gcd(b, r)$ — replace the pair with the divisor and the remainder.'
        type: basic
      - front: "Bezout's identity"
        back: 'For any integers $a, b$ (not both zero) there exist integers $x, y$ with $ax + by = \gcd(a,b)$.'
        type: basic
      - front: "Relation between gcd and lcm of $a, b > 0$"
        back: '$\gcd(a,b) \cdot \mathrm{lcm}(a,b) = ab$.'
        type: basic

  - id: modular-arithmetic
    name: "Modular Arithmetic"
    core: true
    difficulty: 0.5
    drill: false
    answer_kind: numeric
    expected_time_secs: 90
    prerequisites:
      - id: division-algorithm
        weight: 0.8
        key: true
      - id: integer-exponents-intro
        weight: 0.4
        key: false
    knowledge_points:
      - id: kp1
        name: "Reducing mod m, including negatives"
        key_prerequisites: [division-algorithm]
        exemplars:
          - problem: 'Compute $17 \bmod 5$.'
            answer: "2"
          - problem: 'Compute $-13 \bmod 7$ (answer in $\{0, 1, \dots, 6\}$).'
            answer: "1"
            solution_sketch: '$-13 = 7 \cdot (-2) + 1$, so the least nonnegative residue is $1$.'
          - problem: "Compute -34 mod 26 and give the least nonnegative residue."
            answer: "18"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (division algorithm): write the full statement -34 = 26q + r with 0 <= r < 26. Step 2 (choose the quotient): take q = -2, so 26 * (-2) = -52, and then r = -34 + 52 = 18, which satisfies 0 <= 18 < 26. The least nonnegative residue is 18."
          - problem: "Compute (-5)^3 mod 23 and give the least nonnegative residue."
            answer: "13"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (integer exponents): the full value is (-5)^3 = -125. Step 2 (division algorithm): write -125 = 23q + r with 0 <= r < 23. Step 3 (choose the quotient): take q = -6, so 23 * (-6) = -138 and r = -125 + 138 = 13, with 0 <= 13 < 23. The least nonnegative residue is 13."
          - problem: "Compute the least nonnegative residue of -(7^2) modulo 15."
            answer: "11"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (integer exponents): the full value is -(7^2) = -49. Step 2 (division algorithm): write -49 = 15q + r with 0 <= r < 15. Step 3 (choose the quotient): take q = -4, so 15 * (-4) = -60 and r = -49 + 60 = 11, with 0 <= 11 < 15. The least nonnegative residue is 11."
          - problem: "A modulus m with 2 <= m <= 26 satisfies: the least nonnegative residue of 90 modulo m is 18. Find m."
            answer: "24"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (division algorithm): the condition 90 mod m = 18 means 90 = mq + 18 for some integer q, so m divides 90 - 18 = 72, and since the remainder is 18 we need m > 18. Step 2 (divisibility): the divisors of 72 are 1, 2, 3, 4, 6, 8, 9, 12, 18, 24, 36, 72; the only one with 18 < m <= 26 is 24. Step 3 (check): 90 = 24 * 3 + 18, and 0 <= 18 < 24. The answer is 24."
        constraints: "moduli 2-26; include negative arguments; answers are least nonnegative residues"
      - id: kp2
        name: "Adding and multiplying residues"
        key_prerequisites: [division-algorithm]
        exemplars:
          - problem: 'Compute $(37 \cdot 43) \bmod 10$ without multiplying the full numbers.'
            answer: "1"
            solution_sketch: 'Reduce first: $37 \equiv 7$ and $43 \equiv 3 \pmod{10}$, so the product is $\equiv 21 \equiv 1$.'
          - problem: 'Compute $(6 + 9) \bmod 11$.'
            answer: "4"
            solution_sketch: '$15 = 11 + 4$.'
          - problem: "Compute (58 * 47) mod 13 by reducing each factor first. Give the residue in 0 to 12."
            answer: "9"
            answer_contract: {"kind": "exact"}
            solution_sketch: "For (58 * 47) mod 13, reduce first using the division algorithm: 58 = 4*13 + 6, so 58 mod 13 = 6, and 47 = 3*13 + 8, so 47 mod 13 = 8. By the multiplication rule for residues, 6*8 = 48. Reduce the product modulo 13: 48 = 3*13 + 9. The answer is 9."
          - problem: "Compute (17 + 29) mod 12 by reducing each summand first. Give the residue in 0 to 11."
            answer: "10"
            answer_contract: {"kind": "exact"}
            solution_sketch: "For (17 + 29) mod 12, reduce first using the division algorithm: 17 = 1*12 + 5, so 17 mod 12 = 5, and 29 = 2*12 + 5, so 29 mod 12 = 5. By the addition rule for residues, 5 + 5 = 10. Since 10 is less than 12, the answer is 10."
          - problem: "Compute (123 * 45) mod 26 by reducing each factor first. Give the residue in 0 to 25."
            answer: "23"
            answer_contract: {"kind": "exact"}
            solution_sketch: "For (123 * 45) mod 26, reduce first using the division algorithm: 123 = 4*26 + 19, so 123 mod 26 = 19, and 45 = 1*26 + 19, so 45 mod 26 = 19. By the multiplication rule for residues, 19*19 = 361. Reduce modulo 26: 361 = 13*26 + 23. The answer is 23."
          - problem: "Compute (87 * 64 + 25) mod 17 by reducing each number first. Give the residue in 0 to 16."
            answer: "0"
            answer_contract: {"kind": "exact"}
            solution_sketch: "For (87 * 64 + 25) mod 17, reduce first using the division algorithm: 87 = 5*17 + 2, so 87 mod 17 = 2; 64 = 3*17 + 13, so 64 mod 17 = 13; and 25 = 1*17 + 8, so 25 mod 17 = 8. By the multiplication rule for residues, 2*13 = 26, and 26 mod 17 = 9. By the addition rule for residues, 9 + 8 = 17, and 17 mod 17 = 0. The answer is 0."
        constraints: "force reduce-first strategy: operands 2-3 digits, moduli <= 26"
      - id: kp3
        name: "Modular exponentiation by repeated squaring"
        key_prerequisites: [division-algorithm, integer-exponents-intro]
        exemplars:
          - problem: 'Compute $2^{10} \bmod 7$.'
            answer: "2"
            solution_sketch: '$2^3 = 8 \equiv 1 \pmod 7$, so $2^{10} = (2^3)^3 \cdot 2 \equiv 1 \cdot 2 = 2$.'
          - problem: 'Compute $3^4 \bmod 5$.'
            answer: "1"
            solution_sketch: '$3^2 = 9 \equiv 4 \equiv -1$, so $3^4 \equiv (-1)^2 = 1 \pmod 5$.'
          - problem: "Find the remainder when $5^{11}$ is divided by $13$."
            answer: "8"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full object is 5^11 modulo 13. Use repeated squaring. Step 1: 5^2 = 25 and 25 mod 13 = 12, so 5^2 is congruent to -1 modulo 13. Step 2: split 5^11 as (5^2)^5 times 5, so 5^11 is congruent to (-1)^5 times 5 = -5 modulo 13. Step 3: reduce to a least nonnegative residue: -5 + 13 = 8. The answer is 8."
          - problem: "What is the least nonnegative residue of $7^5$ modulo $11$?"
            answer: "10"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full object is 7^5 modulo 11. Use repeated squaring. Step 1: 7^2 = 49 and 49 mod 11 = 5. Step 2: square that: 7^4 is congruent to 5^2 = 25, and 25 mod 11 = 3. Step 3: multiply by 7 once more: 7^5 is congruent to 3 times 7 = 21, and 21 mod 11 = 10, which is -1 modulo 11. The answer is 10."
          - problem: "Evaluate $6^7$ modulo $13$."
            answer: "7"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full object is 6^7 modulo 13. Use repeated squaring. Step 1: 6^3 = 216 and 216 mod 13 = 8. Step 2: square: 6^6 is congruent to 8^2 = 64, and 64 mod 13 = 12, so 6^6 is congruent to -1 modulo 13. Step 3: multiply by 6 once more: 6^7 is congruent to 12 times 6 = 72, and 72 mod 13 = 7. The answer is 7."
          - problem: "Determine the value of $4^9$ modulo $11$."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full object is 4^9 modulo 11. Use repeated squaring. Step 1: 4^2 = 16 and 16 mod 11 = 5. Step 2: square: 4^4 is congruent to 5^2 = 25, and 25 mod 11 = 3. Step 3: 4^5 is congruent to 3 times 4 = 12, and 12 mod 11 = 1. Step 4: 4^9 is congruent to 1 times 3 = 3. The answer is 3."
        constraints: "exponents 3-20, moduli <= 15; solvable by spotting a small power congruent to 1 or -1"
    diagnostic_exemplar:
      problem: 'Compute $2^{20} \bmod 9$.'
      answer: '4'
      solution_sketch: '$2^6 = 64 \equiv 1 \pmod 9$, so $2^{18} \equiv 1$ and $2^{20} \equiv 2^2 = 4$.'
    anki_seeds:
      - front: 'Definition: $a \equiv b \pmod m$ means...'
        back: '$m \mid (a - b)$ — equivalently $a$ and $b$ leave the same remainder on division by $m$.'
        type: basic
      - front: "Key computational rule of modular arithmetic"
        back: "You may reduce mod $m$ before or after adding/multiplying — the result is the same."
        type: basic

  - id: linear-congruences
    name: "Linear Congruences & Modular Inverses"
    core: true
    difficulty: 0.6
    drill: false
    answer_kind: numeric
    expected_time_secs: 180
    prerequisites:
      - id: modular-arithmetic
        weight: 0.9
        key: true
      - id: euclidean-algorithm
        weight: 0.7
        key: true
    knowledge_points:
      - id: kp1
        name: "When is ax = b (mod m) solvable?"
        key_prerequisites: [euclidean-algorithm, modular-arithmetic]
        exemplars:
          - problem: 'Give the set of all solutions mod $6$ of $4x \equiv 2 \pmod 6$.'
            answer: '$\{2, 5\}$'
            solution_sketch: '$d = \gcd(4,6) = 2$ divides $2$, so there are $d = 2$ solutions. Divide through: $2x \equiv 1 \pmod 3$, so $x \equiv 2 \pmod 3$, giving $x \in \{2, 5\}$ mod $6$.'
          - problem: 'How many solutions mod $6$ does $4x \equiv 3 \pmod 6$ have?'
            answer: "0"
            solution_sketch: '$\gcd(4,6) = 2$ does not divide $3$, so the congruence is unsolvable.'
          - problem: "Compute the number of solutions of the congruence 9x ≡ 6 (mod 15)."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The congruence is 9x ≡ 6 (mod 15). Step 1 (solvability criterion): compute gcd(9,15) = 3 with the Euclidean algorithm. Step 2 (divisibility test): 3 divides 6, so the congruence is solvable. Step 3 (solution count): the number of solutions mod 15 equals gcd(9,15), which is 3. The final count is 3."
          - problem: "Find the number of residues b mod 10 for which the congruence 6x ≡ b (mod 10) has a solution."
            answer: "5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The congruence family is 6x ≡ b (mod 10). Step 1 (solvability criterion): compute gcd(6,10) = 2. Step 2 (divisibility test): a solution exists exactly when 2 divides b. Step 3 (counting): the even residues mod 10 are 0, 2, 4, 6, 8, so 5 residues work. The final count is 5."
          - problem: "State how many solutions mod 18 the congruence 12x ≡ 8 (mod 18) has."
            answer: "0"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The congruence is 12x ≡ 8 (mod 18). Step 1 (solvability criterion): compute gcd(12,18) = 6 with the Euclidean algorithm. Step 2 (divisibility test): 6 does not divide 8, so the congruence has no solution mod 18. The number of solutions is 0."
          - problem: "Determine the number of solutions of 8x ≡ 20 (mod 12)."
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The congruence is 8x ≡ 20 (mod 12). Step 1 (solvability criterion): compute gcd(8,12) = 4. Step 2 (divisibility test): 4 divides 20, so the congruence is solvable. Step 3 (solution count): the number of solutions mod 12 equals gcd(8,12) = 4. The final count is 4."
        constraints: "moduli <= 30; include both solvable and unsolvable cases; solution count = gcd(a,m) when it divides b, else 0"
      - id: kp2
        name: "Modular inverses via the extended Euclidean algorithm"
        key_prerequisites: [euclidean-algorithm]
        exemplars:
          - problem: 'Find the inverse of $7$ modulo $26$.'
            answer: "15"
            solution_sketch: '$26 = 3 \cdot 7 + 5$; $7 = 1 \cdot 5 + 2$; $5 = 2 \cdot 2 + 1$. Back-substitute: $1 = 5 - 2 \cdot 2 = 5 - 2(7 - 5) = 3 \cdot 5 - 2 \cdot 7 = 3 \cdot 26 - 11 \cdot 7$, so $-11 \equiv 15$ works. Check: $7 \cdot 15 = 105 = 4 \cdot 26 + 1$.'
          - problem: 'Find the inverse of $5$ modulo $12$.'
            answer: "5"
            solution_sketch: '$5 \cdot 5 = 25 = 2 \cdot 12 + 1$, so $5$ is its own inverse mod $12$.'
          - problem: "What number x satisfies 9x congruent to 1 modulo 26? Give x as the least positive residue."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (Euclidean algorithm): 26 = 2*9 + 8 and 9 = 1*8 + 1. Step 2 (back-substitution): 1 = 9 - 8 = 9 - (26 - 2*9) = 3*9 - 26. Step 3 (least positive residue): the coefficient of 9 is 3, so x = 3. Step 4 (verification product): 9*3 = 27 = 1*26 + 1, so 9*3 is 1 modulo 26. The answer is 3."
          - problem: "Find the least positive residue x with 17x congruent to 1 modulo 40."
            answer: "33"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (Euclidean algorithm): 40 = 2*17 + 6, 17 = 2*6 + 5, and 6 = 1*5 + 1. Step 2 (back-substitution): 1 = 6 - 5 = 6 - (17 - 2*6) = 3*6 - 17 = 3*(40 - 2*17) - 17 = 3*40 - 7*17. Step 3 (least positive residue): the coefficient of 17 is -7, and -7 is 33 modulo 40. Step 4 (verification product): 17*33 = 561 = 14*40 + 1, so 17*33 is 1 modulo 40. The answer is 33."
          - problem: "In a check-digit scheme, a multiplier 23 is used modulo 31. Find its modular inverse as the least positive residue."
            answer: "27"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (Euclidean algorithm): 31 = 1*23 + 8, 23 = 2*8 + 7, and 8 = 1*7 + 1. Step 2 (back-substitution): 1 = 8 - 7 = 8 - (23 - 2*8) = 3*8 - 23 = 3*(31 - 23) - 23 = 3*31 - 4*23. Step 3 (least positive residue): the coefficient of 23 is -4, and -4 is 27 modulo 31. Step 4 (verification product): 23*27 = 621 = 20*31 + 1, so 23*27 is 1 modulo 31. The answer is 27."
          - problem: "Use the Euclidean algorithm to find the inverse of 13 modulo 37. Give the answer as the least positive residue."
            answer: "20"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (Euclidean algorithm): 37 = 2*13 + 11, 13 = 1*11 + 2, and 11 = 5*2 + 1. Step 2 (back-substitution): 1 = 11 - 5*2 = 11 - 5*(13 - 11) = 6*11 - 5*13 = 6*(37 - 2*13) - 5*13 = 6*37 - 17*13. Step 3 (least positive residue): the coefficient of 13 is -17, and -17 is 20 modulo 37. Step 4 (verification product): 13*20 = 260 = 7*37 + 1, so 13*20 is 1 modulo 37. The answer is 20."
        constraints: "gcd(a,m) = 1 always; moduli 7-40; answer as least positive residue; require the verification product"
      - id: kp3
        name: "Solving by multiplying by the inverse"
        key_prerequisites: [euclidean-algorithm, modular-arithmetic]
        exemplars:
          - problem: 'Solve $7x \equiv 3 \pmod{26}$; give $x$ as the least nonnegative residue.'
            answer: "19"
            solution_sketch: '$7^{-1} \equiv 15 \pmod{26}$, so $x \equiv 15 \cdot 3 = 45 \equiv 19$. Check: $7 \cdot 19 = 133 = 5 \cdot 26 + 3$.'
          - problem: 'Solve $5x \equiv 7 \pmod{12}$; give $x$ as the least nonnegative residue.'
            answer: "11"
            solution_sketch: '$5^{-1} \equiv 5$, so $x \equiv 5 \cdot 7 = 35 \equiv 11 \pmod{12}$. Check: $55 = 4 \cdot 12 + 7$.'
        constraints: "coefficient invertible mod m; unique answer as least nonnegative residue with a check"
    diagnostic_exemplar:
      problem: 'Solve $3x \equiv 4 \pmod 7$; give $x$ as the least nonnegative residue.'
      answer: "6"
      solution_sketch: '$3 \cdot 5 = 15 \equiv 1$, so $3^{-1} \equiv 5$ and $x \equiv 5 \cdot 4 = 20 \equiv 6$. Check: $3 \cdot 6 = 18 \equiv 4 \pmod 7$.'
    anki_seeds:
      - front: '$ax \equiv b \pmod m$ is solvable iff...'
        back: '$\gcd(a, m) \mid b$; when solvable it has exactly $\gcd(a,m)$ solutions mod $m$.'
        type: basic
      - front: '$a$ has an inverse mod $m$ iff...'
        back: '$\gcd(a, m) = 1$.'
        type: basic

  - id: chinese-remainder-theorem
    name: "Chinese Remainder Theorem"
    core: false                # terminal number-theory result; nothing here builds on it
    difficulty: 0.65
    drill: false
    answer_kind: numeric
    expected_time_secs: 240
    prerequisites:
      - id: linear-congruences
        weight: 0.85
        key: true
    knowledge_points:
      - id: kp1
        name: "Two congruences with coprime moduli"
        key_prerequisites: [linear-congruences]
        exemplars:
          - problem: 'Find the least nonnegative $x$ with $x \equiv 2 \pmod 3$ and $x \equiv 3 \pmod 5$ (the full solution class is unique mod $15$).'
            answer: '8'
            solution_sketch: 'Write $x = 5k + 3$; then $5k + 3 \equiv 2 \pmod 3$ gives $2k \equiv 2$, so $k \equiv 1 \pmod 3$. Thus $x = 5(3j + 1) + 3 = 15j + 8$. Check: $8 \bmod 3 = 2$, $8 \bmod 5 = 3$.'
          - problem: 'Find the smallest positive $x$ with $x \equiv 0 \pmod 7$ and $x \equiv 1 \pmod 4$.'
            answer: "21"
            solution_sketch: 'Check multiples of $7$ mod $4$: $7 \equiv 3$, $14 \equiv 2$, $21 \equiv 1$. So $x \equiv 21 \pmod{28}$.'
          - problem: "Find the least nonnegative $x$ with $x \\equiv 1 \\pmod 5$ and $x \\equiv 2 \\pmod 7$."
            answer: "16"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Write $x = 5k + 1$ from the first congruence. Substitute into the second: $5k + 1 \\equiv 2 \\pmod 7$, so $5k \\equiv 1 \\pmod 7$. Multiply by the inverse $3$: $k \\equiv 3 \\pmod 7$. Thus $x = 5(3) + 1 = 16$. Check: $16 \\bmod 5 = 1$ and $16 \\bmod 7 = 2$. The least nonnegative solution is 16."
          - problem: "Find the least nonnegative $x$ with $x \\equiv 3 \\pmod 4$ and $x \\equiv 4 \\pmod 9$."
            answer: "31"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Write $x = 4k + 3$ from the first congruence. Substitute into the second: $4k + 3 \\equiv 4 \\pmod 9$, so $4k \\equiv 1 \\pmod 9$. The inverse of $4$ modulo $9$ is $7$, so $k \\equiv 7 \\pmod 9$. Then $x = 4(7) + 3 = 31$. Check: $31 \\bmod 4 = 3$ and $31 \\bmod 9 = 4$. The least nonnegative solution is 31."
          - problem: "A number leaves remainder $2$ when divided by $5$ and remainder $4$ when divided by $7$. Find the smallest positive such number."
            answer: "32"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Let $x$ be the number, so $x \\equiv 2 \\pmod 5$ and $x \\equiv 4 \\pmod 7$. Write $x = 5k + 2$. Substitute: $5k + 2 \\equiv 4 \\pmod 7$, so $5k \\equiv 2 \\pmod 7$. The inverse of $5$ modulo $7$ is $3$, so $k \\equiv 6 \\pmod 7$. Then $x = 5(6) + 2 = 32$. Check: $32 \\bmod 5 = 2$ and $32 \\bmod 7 = 4$. The smallest positive such number is 32."
          - problem: "Find the least nonnegative $x$ with $x \\equiv 5 \\pmod 9$ and $x \\equiv 1 \\pmod{11}$."
            answer: "23"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Write $x = 9k + 5$ from the first congruence. Substitute into the second: $9k + 5 \\equiv 1 \\pmod{11}$, so $9k \\equiv 7 \\pmod{11}$. The inverse of $9$ modulo $11$ is $5$, so $k \\equiv 35 \\equiv 2 \\pmod{11}$. Then $x = 9(2) + 5 = 23$. Check: $23 \\bmod 9 = 5$ and $23 \\bmod{11} = 1$. The least nonnegative solution is 23."
        constraints: "pairwise coprime moduli, each <= 13; answer as the unique residue mod the product plus a verification; the item must test THIS KP: Two congruences with coprime moduli"
      - id: kp2
        name: "Systems of congruences; uniqueness mod the product"
        key_prerequisites: [linear-congruences]
        exemplars:
          - problem: 'Solve the system $x \equiv 1 \pmod 2$, $x \equiv 2 \pmod 3$, $x \equiv 3 \pmod 5$; give the least nonnegative solution.'
            answer: '23'
            solution_sketch: 'From the last two: $x \equiv 8 \pmod{15}$ (i.e. $x \in \{8, 23\}$ mod $30$). Oddness picks $23$. Check: $23 = 11 \cdot 2 + 1 = 7 \cdot 3 + 2 = 4 \cdot 5 + 3$.'
          - problem: 'A number of soldiers leaves remainder $3$ when lined up in rows of $4$ and remainder $1$ in rows of $5$. What is the smallest possible positive count?'
            answer: "11"
            solution_sketch: '$x \equiv 3 \pmod 4$ and $x \equiv 1 \pmod 5$: candidates $1, 6, 11, \dots$; $11 \equiv 3 \pmod 4$. So $x \equiv 11 \pmod{20}$, smallest positive is $11$.'
          - problem: "Solve the system $x \\equiv 1 \\pmod 3$, $x \\equiv 4 \\pmod 5$, $x \\equiv 3 \\pmod 7$. Give the least nonnegative solution."
            answer: "94"
            answer_contract: {"kind": "exact"}
            solution_sketch: "First combine $x \\equiv 1 \\pmod 3$ and $x \\equiv 4 \\pmod 5$: write $x = 1 + 3k$, then $3k \\equiv 3 \\pmod 5$, so $k \\equiv 1 \\pmod 5$ by modular inverse, giving $x \\equiv 4 \\pmod{15}$. Now combine with the third congruence: $x = 4 + 15m \\equiv 3 \\pmod 7$, so $15m \\equiv 6 \\pmod 7$; since $15 \\equiv 1 \\pmod 7$, $m \\equiv 6 \\pmod 7$. Thus $x = 4 + 15 \\cdot 6 = 94$ modulo $105$, and verification gives $94 \\equiv 1 \\pmod 3$, $4 \\pmod 5$, $3 \\pmod 7$. The least nonnegative solution is 94."
          - problem: "Solve the system $x \\equiv 2 \\pmod 3$, $x \\equiv 3 \\pmod 4$, $x \\equiv 4 \\pmod 5$. Give the least positive integer solution."
            answer: "59"
            answer_contract: {"kind": "exact"}
            solution_sketch: "First combine $x \\equiv 2 \\pmod 3$ and $x \\equiv 3 \\pmod 4$: write $x = 2 + 3k$, then $3k \\equiv 1 \\pmod 4$, so $k \\equiv 3 \\pmod 4$ by modular inverse, giving $x \\equiv 11 \\pmod{12}$. Combine with $x \\equiv 4 \\pmod 5$: $x = 11 + 12m \\equiv 4 \\pmod 5$, so $12m \\equiv 3 \\pmod 5$; since $12 \\equiv 2 \\pmod 5$, $m \\equiv 4 \\pmod 5$. Thus $x = 11 + 12 \\cdot 4 = 59$ modulo 60, and $59 \\equiv 2 \\pmod 3$, $3 \\pmod 4$, $4 \\pmod 5$. The least positive solution is 59."
          - problem: "A pile of stones has remainder 1 when grouped in pairs, remainder 2 when grouped in fives, and remainder 3 when grouped in sevens. What is the least positive number of stones?"
            answer: "17"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Translate to congruences: $x \\equiv 1 \\pmod 2$, $x \\equiv 2 \\pmod 5$, $x \\equiv 3 \\pmod 7$. First combine $x \\equiv 1 \\pmod 2$ and $x \\equiv 2 \\pmod 5$: write $x = 1 + 2k$, then $2k \\equiv 1 \\pmod 5$, so $k \\equiv 3 \\pmod 5$, giving $x \\equiv 7 \\pmod{10}$. Combine with the third: $x = 7 + 10m \\equiv 3 \\pmod 7$, so $10m \\equiv 3 \\pmod 7$; since $10 \\equiv 3 \\pmod 7$, $3m \\equiv 3$, so $m \\equiv 1 \\pmod 7$. Thus $x = 7 + 10 \\cdot 1 = 17$ modulo 70, and $17 \\equiv 1 \\pmod 2$, $2 \\pmod 5$, $3 \\pmod 7$. The least positive number of stones is 17."
          - problem: "Solve the system $x \\equiv 5 \\pmod 7$, $x \\equiv 8 \\pmod 9$. Give the least nonnegative solution."
            answer: "26"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Substitute $x = 5 + 7k$ into the second congruence: $5 + 7k \\equiv 8 \\pmod 9$, so $7k \\equiv 3 \\pmod 9$. The modular inverse of 7 modulo 9 is 4 because $7 \\cdot 4 = 28 \\equiv 1 \\pmod 9$, so $k \\equiv 12 \\equiv 3 \\pmod 9$. Then $x = 5 + 7 \\cdot 3 = 26$ modulo 63, and $26 \\equiv 5 \\pmod 7$, $8 \\pmod 9$. The least nonnegative solution is 26."
        constraints: "2-3 congruences, moduli pairwise coprime with product <= 120; solve iteratively (substitution), always verify"
    diagnostic_exemplar:
      problem: 'Solve the system $x \equiv 1 \pmod 3$, $x \equiv 2 \pmod 5$, $x \equiv 0 \pmod 4$: give the smallest positive solution.'
      answer: '52'
      solution_sketch: '$x \equiv 0 \pmod 4$ with $x \equiv 2 \pmod 5$ gives $x \equiv 12 \pmod{20}$; of $12, 32, 52$, only $52 \equiv 1 \pmod 3$. Unique mod $60$.'
    anki_seeds:
      - front: "Chinese Remainder Theorem (two moduli)"
        back: 'If $\gcd(m, n) = 1$, the system $x \equiv a \pmod m$, $x \equiv b \pmod n$ has a unique solution mod $mn$.'
        type: basic
      - front: "CRT hypothesis that must be checked before solving"
        back: "The moduli are pairwise coprime."
        type: basic

  - id: fermat-euler-theorems
    name: "Fermat's Little Theorem & Euler's Theorem"
    core: true
    difficulty: 0.65
    drill: false
    answer_kind: numeric
    expected_time_secs: 180
    prerequisites:
      - id: modular-arithmetic
        weight: 0.85
        key: true
      - id: prime-factorization
        weight: 0.6
        key: true
      - id: linear-congruences
        weight: 0.4
        key: false
    knowledge_points:
      - id: kp1
        name: "Fermat's little theorem: reducing huge exponents mod p"
        key_prerequisites: [modular-arithmetic, prime-factorization]
        exemplars:
          - problem: 'Compute $2^{100} \bmod 7$.'
            answer: "2"
            solution_sketch: 'By Fermat, $2^6 \equiv 1 \pmod 7$. $100 = 6 \cdot 16 + 4$, so $2^{100} \equiv 2^4 = 16 \equiv 2$.'
          - problem: 'Compute $3^{53} \bmod 11$.'
            answer: "5"
            solution_sketch: 'By Fermat, $3^{10} \equiv 1 \pmod{11}$, and $53 = 10 \cdot 5 + 3$, so $3^{53} \equiv 3^3 = 27 = 2 \cdot 11 + 5 \equiv 5$.'
          - problem: "Find the least nonnegative residue of $4^{129}$ modulo $17$."
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "We evaluate $4^{129}\\pmod{17}$. Step 1 (Fermat's little theorem): since 17 is prime and 17 does not divide 4, $4^{16}\\equiv1\\pmod{17}$. Step 2 (reduce the exponent modulo p-1): $129 = 16\\cdot8 + 1$, so $4^{129}\\equiv4^1\\pmod{17}$. The least nonnegative residue is 4."
          - problem: "Find the remainder when $8^{333}$ is divided by $19$."
            answer: "18"
            answer_contract: {"kind": "exact"}
            solution_sketch: "We evaluate $8^{333}\\pmod{19}$. Step 1 (Fermat's little theorem): since 19 is prime and 19 does not divide 8, $8^{18}\\equiv1\\pmod{19}$. Step 2 (reduce the exponent modulo p-1): $333 = 18\\cdot18 + 9$, so $8^{333}\\equiv8^9\\pmod{19}$. Step 3 (repeated squaring): $8^2\\equiv7$, $8^4\\equiv11$, $8^8\\equiv7$; thus $8^9=8^8\\cdot8\\equiv7\\cdot8=56\\equiv18\\pmod{19}$. The remainder is 18."
          - problem: "A device changes state on a $17$-hour cycle. Its state after $6^{430}$ hours is the remainder of $6^{430}$ modulo $17$. Find the remainder."
            answer: "9"
            answer_contract: {"kind": "exact"}
            solution_sketch: "We evaluate $6^{430}\\pmod{17}$. Step 1 (Fermat's little theorem): since 17 is prime and 17 does not divide 6, $6^{16}\\equiv1\\pmod{17}$. Step 2 (reduce the exponent modulo p-1): $430 = 16\\cdot26 + 14$, so $6^{430}\\equiv6^{14}\\pmod{17}$. Step 3 (repeated squaring): $6^2\\equiv2$, $6^4\\equiv4$, $6^8\\equiv16$; then $6^{14}=6^8\\cdot6^4\\cdot6^2\\equiv16\\cdot4\\cdot2=128\\equiv9\\pmod{17}$. The remainder is 9."
          - problem: "For the prime $13$, an exponent $E$ satisfies $2^E \\equiv 6 \\pmod{13}$ and $50 \\le E \\le 1000$. Find the smallest such exponent $E$."
            answer: "53"
            answer_contract: {"kind": "exact"}
            solution_sketch: "We need the smallest $E$ with $50 \\le E \\le 1000$ and $2^E \\equiv 6 \\pmod{13}$. Step 1 (Fermat's little theorem/order check): since 13 is prime, $2^{12}\\equiv1\\pmod{13}$; checking powers gives $2^5\\equiv6\\pmod{13}$, and the period for base 2 is exactly 12. Step 2 (reduce exponent condition): therefore $2^E\\equiv2^5$ if and only if $E\\equiv5\\pmod{12}$. Step 3 (smallest in range): the eligible exponents are $5,17,29,41,53,\\ldots$. The first one at least 50 is 53. The smallest such exponent is 53."
        constraints: "prime moduli <= 23, base not divisible by p, exponents 50-1000; reduce the exponent mod p-1; the item must test THIS KP: Fermat's little theorem: reducing huge exponents mod p"
      - id: kp2
        name: "Euler's phi function"
        key_prerequisites: [prime-factorization]
        exemplars:
          - problem: 'Compute $\varphi(10)$.'
            answer: "4"
            solution_sketch: 'The units mod $10$ are $1, 3, 7, 9$. Or $\varphi(10) = 10(1 - \tfrac12)(1 - \tfrac15) = 4$.'
          - problem: 'Compute $\varphi(45)$.'
            answer: "24"
            solution_sketch: '$45 = 3^2 \cdot 5$, so $\varphi(45) = 45(1 - \tfrac13)(1 - \tfrac15) = 45 \cdot \tfrac23 \cdot \tfrac45 = 24$.'
          - problem: 'Compute $\varphi(100)$.'
            answer: "40"
            solution_sketch: '$100 = 2^2 \cdot 5^2$: $\varphi(100) = 100 \cdot \tfrac12 \cdot \tfrac45 = 40$.'
        constraints: "n <= 200 with at most two distinct prime factors; use the product formula"
      - id: kp3
        name: "Euler's theorem for composite moduli"
        key_prerequisites: [modular-arithmetic, prime-factorization]
        exemplars:
          - problem: 'Compute $3^{42} \bmod 100$ (the last two digits of $3^{42}$).'
            answer: "9"
            solution_sketch: '$\gcd(3, 100) = 1$ and $\varphi(100) = 40$, so $3^{40} \equiv 1 \pmod{100}$ and $3^{42} \equiv 3^2 = 9$ — last two digits $09$.'
          - problem: 'Find the last two digits of $7^{42}$.'
            answer: "49"
            solution_sketch: '$7^{40} \equiv 1 \pmod{100}$, so $7^{42} \equiv 7^2 = 49$.'
          - problem: "Compute $11^{43} \\bmod 100$."
            answer: "31"
            answer_contract: {"kind": "exact"}
            solution_sketch: "First check coprimality with math.gcd(11, 100) = 1, so Euler's theorem applies with phi(100) = 40. Reduce the exponent: 43 = 40 + 3, so 11^43 is congruent to 11^3 modulo 100. Compute: 11^2 = 121 leaves remainder 21, and 21 * 11 = 231 leaves remainder 31; a check with pow(11, 43, 100) confirms 31. The answer is 31."
          - problem: "Find the last two digits of $19^{45}$."
            answer: "99"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Since math.gcd(19, 100) = 1 and phi(100) = 40, Euler's theorem gives 19^40 congruent to 1 modulo 100. Reduce the exponent: 45 = 40 + 5, so 19^45 is congruent to 19^5 modulo 100. Compute: 19^2 = 361 leaves 61, 61^2 = 3721 leaves 21, and 21 * 19 = 399 leaves 99; the check pow(19, 45, 100) = 99 agrees. The answer is 99."
          - problem: "Find the last digit of $3^{101}$."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Here math.gcd(3, 10) = 1 and phi(10) = 4, so Euler's theorem gives 3^4 congruent to 1 modulo 10. Write the exponent as 101 = 100 + 1 where 100 = 25 * 4 is a multiple of phi(10), so 3^101 is congruent to 3^1 modulo 10. The check pow(3, 101, 10) returns 3. The answer is 3."
          - problem: "Determine the remainder when $9^{44}$ is divided by $100$."
            answer: "61"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Because math.gcd(9, 100) = 1 and phi(100) = 40, Euler's theorem gives 9^40 congruent to 1 modulo 100. Reduce the exponent: 44 = 40 + 4, so 9^44 is congruent to 9^4 modulo 100. Compute: 9^2 = 81 and 81^2 = 6561 leaves remainder 61; the check pow(9, 44, 100) = 61 confirms it. The answer is 61."
        constraints: "modulus 10 or 100; base coprime to the modulus; exponent within 5 of a multiple of phi"
    diagnostic_exemplar:
      problem: 'Find the last two digits of $3^{43}$.'
      answer: '27'
      solution_sketch: '$\varphi(100) = 40$ and $\gcd(3, 100) = 1$, so $3^{40} \equiv 1 \pmod{100}$; $3^{43} \equiv 3^3 = 27$.'
    anki_seeds:
      - front: "Fermat's little theorem"
        back: 'If $p$ is prime and $p \nmid a$, then $a^{p-1} \equiv 1 \pmod p$.'
        type: basic
      - front: "Euler's theorem"
        back: 'If $\gcd(a, n) = 1$, then $a^{\varphi(n)} \equiv 1 \pmod n$.'
        type: basic
      - front: '$\varphi(p^k)$ for prime $p$'
        back: '$p^k - p^{k-1} = p^k(1 - 1/p)$.'
        type: basic

  - id: rsa-cryptography
    name: "RSA: Number Theory in Action"
    core: false                # applications capstone for the number-theory spine
    difficulty: 0.7
    drill: false
    answer_kind: numeric
    expected_time_secs: 300
    prerequisites:
      - id: fermat-euler-theorems
        weight: 0.8
        key: true
      - id: linear-congruences
        weight: 0.7
        key: true
    knowledge_points:
      - id: kp1
        name: "Key generation: n, phi(n), and the private exponent"
        key_prerequisites: [fermat-euler-theorems, linear-congruences]
        exemplars:
          - problem: 'RSA with $p = 3$, $q = 11$, $e = 3$. Compute $n$, $\varphi(n)$, and the private exponent $d$.'
            answer: 'n = 33; phi = 20; d = 7'
            answer_contract: {kind: multipart, parts: [{name: n, contract: {kind: exact}}, {name: phi, contract: {kind: exact}}, {name: d, contract: {kind: exact}}]}
            solution_sketch: '$n = pq = 33$; $\varphi(n) = (p-1)(q-1) = 2 \cdot 10 = 20$; $d = e^{-1} \bmod 20$: $3 \cdot 7 = 21 \equiv 1 \pmod{20}$, so $d = 7$.'
          - problem: 'RSA with $p = 5$, $q = 11$, $e = 3$. Find $d$.'
            answer: '27'
            solution_sketch: '$\varphi(55) = 4 \cdot 10 = 40$ and $3 \cdot 27 = 81 = 2 \cdot 40 + 1$, so $d = 27$.'
          - problem: "RSA with $p = 5$, $q = 7$, $e = 5$. Compute $n$, $\\varphi(n)$, and the private exponent $d$."
            answer: "n = 35; phi = 24; d = 5"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "n"}, {"contract": {"kind": "exact"}, "name": "phi"}, {"contract": {"kind": "exact"}, "name": "d"}]}
            solution_sketch: "Step 1 (n = p q): $n = 5 \\cdot 7 = 35$. Step 2 (phi = (p-1)(q-1)): $\\varphi(n) = 4 \\cdot 6 = 24$. Step 3 (inverse by extended Euclid): solve $5d \\equiv 1 \\pmod{24}$; $5 \\cdot 5 = 25 \\equiv 1 \\pmod{24}$, so $d = 5$. The key is n = 35; phi = 24; d = 5."
          - problem: "RSA with $p = 7$, $q = 11$, $e = 13$. Find $\\varphi(n)$ and the private exponent $d$."
            answer: "phi = 60; d = 37"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "phi"}, {"contract": {"kind": "exact"}, "name": "d"}]}
            solution_sketch: "Step 1 (phi = (p-1)(q-1)): $\\varphi(n) = 6 \\cdot 10 = 60$. Step 2 (inverse by extended Euclid): solve $13d \\equiv 1 \\pmod{60}$; $13 \\cdot 37 = 481 = 8 \\cdot 60 + 1$, so $d = 37$. The result is phi = 60; d = 37."
          - problem: "RSA with $p = 11$, $q = 13$, $e = 7$. Find the private exponent $d$ as the least positive residue modulo $\\varphi(n)$."
            answer: "103"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (phi = (p-1)(q-1)): $\\varphi(n) = 10 \\cdot 12 = 120$. Step 2 (inverse by extended Euclid): solve $7d \\equiv 1 \\pmod{120}$; $7 \\cdot 103 = 721 = 6 \\cdot 120 + 1$, so $d = 103$. The private exponent is 103."
          - problem: "An RSA public key has $n = 91$ and $e = 5$. Find the private exponent $d$ as the least positive residue modulo $\\varphi(n)$."
            answer: "29"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (factor n and phi = (p-1)(q-1)): $n = 91 = 7 \\cdot 13$, so $\\varphi(n) = 6 \\cdot 12 = 72$. Step 2 (inverse by extended Euclid): solve $5d \\equiv 1 \\pmod{72}$; $5 \\cdot 29 = 145 = 2 \\cdot 72 + 1$, so $d = 29$. The private exponent is 29."
        constraints: "primes from {3,5,7,11,13}; e coprime to phi; d found via extended Euclid, stated as least positive residue"
      - id: kp2
        name: "Encrypting and decrypting small messages"
        key_prerequisites: [fermat-euler-theorems, modular-arithmetic]
        exemplars:
          - problem: 'With public key $n = 33$, $e = 3$, encrypt the message $m = 4$.'
            answer: "31"
            solution_sketch: '$c = m^e \bmod n = 4^3 = 64 = 33 + 31 \equiv 31 \pmod{33}$.'
          - problem: 'With $n = 33$, $d = 7$, decrypt the ciphertext $c = 8$.'
            answer: "2"
            solution_sketch: '$m = c^d \bmod n = 8^7 \bmod 33$. $8^2 = 64 \equiv 31 \equiv -2$; $8^4 \equiv 4$; $8^7 = 8^4 \cdot 8^2 \cdot 8 \equiv 4 \cdot (-2) \cdot 8 = -64 \equiv 2 \pmod{33}$. (Check: $2^3 = 8$.)'
          - problem: "A public RSA key is n = 35, e = 5. Encrypt the message m = 3. Find the ciphertext."
            answer: "33"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The ciphertext is c = m^e mod n = 3^5 mod 35. Step 1 (repeated squaring): 3^2 = 9 and 3^4 = 81 = 11 mod 35. Step 2 (multiply residues): 3^5 = 3^4 * 3 = 11 * 3 = 33 mod 35. The ciphertext is 33."
          - problem: "With the private key n = 33, d = 7, decrypt the ciphertext c = 26. State the original message."
            answer: "5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The plaintext is m = c^d mod n = 26^7 mod 33. Step 1 (repeated squaring): 26^2 = 676 = 16 mod 33 and 26^4 = 16^2 = 256 = 25 mod 33. Step 2 (combine powers): 26^7 = 26^4 * 26^2 * 26 = 25 * 16 * 26 = 4 * 26 = 104 = 5 mod 33. The original message is 5."
          - problem: "An RSA system has p = 5, q = 7, e = 5. Decrypt the ciphertext c = 33. State the message."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The modulus is n = 35 and phi = (5 - 1)(7 - 1) = 24. Step 1 (modular inverse): d = 5^(-1) mod 24 = 5 because 5 * 5 = 25 = 1 mod 24. Step 2 (repeated squaring): 33 = -2 mod 35, so 33^5 = (-2)^5 = -32 = 3 mod 35. The decrypted message is 3."
          - problem: "Use the RSA public key n = 33, e = 3 to encrypt the message m = 8. Determine the ciphertext."
            answer: "17"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The ciphertext is c = m^e mod n = 8^3 mod 33. Step 1 (power): 8^2 = 64 = 31 = -2 mod 33. Step 2 (multiply): 8^3 = 8^2 * 8 = 31 * 8 = 248 = 248 - 231 = 17 mod 33. The ciphertext is 17."
        constraints: "n <= 60, messages 2-20 coprime to n; exponentiation by repeated squaring; verify round-trip when feasible"
    diagnostic_exemplar:
      problem: 'RSA with $p = 3$, $q = 11$, $e = 3$: encrypt $m = 2$, then state the private exponent $d$.'
      answer: 'c = 8; d = 7'
      answer_contract: {kind: multipart, parts: [{name: c, contract: {kind: exact}}, {name: d, contract: {kind: exact}}]}
      solution_sketch: '$c = 2^3 = 8 \bmod 33$; $d = 3^{-1} \bmod 20 = 7$ since $21 \equiv 1 \pmod{20}$.'
    anki_seeds:
      - front: "RSA key relation between $e$ and $d$"
        back: '$ed \equiv 1 \pmod{\varphi(n)}$ where $n = pq$ and $\varphi(n) = (p-1)(q-1)$.'
        type: basic
      - front: "Why is RSA hard to break but easy to use?"
        back: 'Encrypting needs only $n$ and $e$; finding $d$ requires $\varphi(n)$, which in practice requires factoring $n$.'
        type: basic
