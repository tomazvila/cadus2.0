        back: '$v - e + f = 2$ (faces include the unbounded outer face).'
        type: basic
      - front: "Planar edge bound (simple, $v \\ge 3$) and its triangle-free sharpening"
        back: '$e \le 3v - 6$; if the graph has no triangles, $e \le 2v - 4$.'
        type: basic
      - front: "The two minimal nonplanar graphs (Kuratowski)"
        back: '$K_5$ and $K_{3,3}$.'
        type: basic

  - id: bipartite-graphs-matchings
    name: "Bipartite Graphs & Matchings"
    core: false                # terminal graph topic
    difficulty: 0.7
    drill: false
    answer_kind: numeric
    expected_time_secs: 240
    prerequisites:
      - id: graph-coloring
        weight: 0.6
        key: true
      - id: walks-paths-connectivity
        weight: 0.6
        key: true
    knowledge_points:
      - id: kp1
        name: "Recognizing bipartite graphs"
        key_prerequisites: [graph-coloring, walks-paths-connectivity]
        exemplars:
          - problem: 'Is $C_6$ bipartite? Is $C_5$?'
            answer: 'c6 = yes; c5 = no'
            answer_contract: {kind: multipart, parts: [{name: c6, contract: {"kind":"label","options":[["yes"],["no"]]}}, {name: c5, contract: {"kind":"label","options":[["yes"],["no"]]}}]}
            solution_sketch: 'A graph is bipartite iff it has no odd cycle; even cycles $2$-color by alternation, odd cycles do not.'
          - problem: 'How many edges does the complete bipartite graph $K_{3,4}$ have?'
            answer: "12"
            solution_sketch: 'Every one of the $3$ left vertices meets all $4$ right vertices: $3 \cdot 4 = 12$.'
        constraints: "cycles, K_{m,n} with m,n <= 5, small ad hoc graphs; justification via odd cycles or an explicit 2-coloring"
      - id: kp2
        name: "Matchings and Hall's condition"
        key_prerequisites: [graph-coloring, walks-paths-connectivity]
        exemplars:
          - problem: 'What is the size of a maximum matching in $K_{3,5}$?'
            answer: "3"
            solution_sketch: 'A matching uses each left vertex at most once, so at most $3$ edges; pairing each left vertex with a distinct right vertex achieves it.'
          - problem: "Four workers each take one task. Every worker is able to do task p, and every worker is also able to do task q. Find the size of a maximum matching."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: build the bipartite graph; the four workers form one side and the tasks p and q the other side, with an edge from each worker to p and to q. Step 2: apply Hall's condition; the set of all four workers has neighborhood {p, q} of size 2, which is less than 4, so no matching of size 3 or 4 exists. Step 3: a matching of size 2 does exist, for example worker A with task p and worker B with task q. Therefore the maximum matching size is 2."
          - problem: "Students A, B, C, D can take projects: A: {p, q}, B: {q, r}, C: {r, s}, D: {s, p}. Find the size of a maximum matching."
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The bipartite graph has left side {A, B, C, D} and right side {p, q, r, s}. The edges are A-p, A-q, B-q, B-r, C-r, C-s, D-s, D-p. A perfect matching of size 4 is A-p, B-q, C-r, D-s, so Hall's condition is satisfied for this graph. Therefore the maximum matching size is 4."
          - problem: "Servers S1, S2, S3 can handle only task t. Find the size of a maximum matching."
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The bipartite graph has left side {S1, S2, S3} and right side {t}. Every edge joins a server to the same task t. A matching can use at most one edge because task t can be matched once, and one edge does exist. Therefore the maximum matching size is 1."
          - problem: "A bipartite graph has left vertices L1, L2, L3, L4 with neighborhoods: L1: {a}, L2: {b}, L3: {a, b}, L4: {c}. Find the size of a maximum matching."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The bipartite graph has left side {L1, L2, L3, L4} and right side {a, b, c}. The edges are L1-a, L2-b, L3-a, L3-b, L4-c. A matching of size 3 is L1-a, L2-b, L4-c. No matching of size 4 exists because the set {L1, L2, L3} has neighborhood {a, b} of size 2, so Hall's condition fails. Therefore the maximum matching size is 3."
          - problem: "Employees E1, E2, E3, E4, E5 can do tasks: E1: {t1, t2}, E2: {t2, t3}, E3: {t3, t4}, E4: {t4, t5}, E5: {t5, t1}. Find the size of a maximum matching."
            answer: "5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The bipartite graph has left side {E1, E2, E3, E4, E5} and right side {t1, t2, t3, t4, t5}. The edges form a 10-cycle: E1-t1, E1-t2, E2-t2, E2-t3, E3-t3, E3-t4, E4-t4, E4-t5, E5-t5, E5-t1. A perfect matching of size 5 is E1-t1, E2-t2, E3-t3, E4-t4, E5-t5. Therefore the maximum matching size is 5."
        constraints: "bipartite sides <= 5; either compute a maximum matching size or exhibit a violating set S"
    diagnostic_exemplar:
      problem: 'Workers $1, 2, 3, 4$ can do jobs: $W_1\!: \{a, b\}$, $W_2\!: \{b\}$, $W_3\!: \{b, c\}$, $W_4\!: \{b\}$. Can every worker get a distinct job? Verify with Hall''s condition.'
      answer: 'No'
      answer_contract: {"kind":"label","options":[["Yes"],["No"]]}
      solution_sketch: 'No: the set $\\{W_2, W_4\\}$ has neighborhood $\\{b\\}$ of size $1 < 2$, violating Hall''s condition. Two workers can only do job $b$; Hall''s condition fails on that pair.'
    anki_seeds:
      - front: "A graph is bipartite iff it contains no..."
        back: "odd cycle."
        type: basic
      - front: "Hall's marriage condition"
        back: 'Every set $S$ of left vertices satisfies $|N(S)| \ge |S|$; equivalent to a matching saturating the left side.'
        type: basic
      - front: "Edge count of $K_{m,n}$"
        back: '$mn$.'
        type: basic
