unit: graph-algorithms
course: discrete-mathematics
module: "Graph Algorithms & Coloring"
topics:
  - id: spanning-trees-mst
    name: "Spanning Trees & Minimum Spanning Trees"
    core: false                # named algorithm; nothing downstream
    difficulty: 0.65
    drill: false
    answer_kind: numeric
    expected_time_secs: 240
    prerequisites:
      - id: trees-characterizations
        weight: 0.8
        key: true
    knowledge_points:
      - id: kp1
        name: 'Spanning tree basics'
        key_prerequisites: [trees-characterizations]
        exemplars:
          - problem: 'A connected graph has $12$ vertices. How many edges does each of its spanning trees have?'
            answer: "11"
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A spanning tree is a tree that contains all $12$ vertices. A tree on $12$ vertices has $12 - 1 = 11$ edges.'
          - problem: 'A council wants to build as few roads as possible so that all $9$ villages of a district are joined, directly or through other villages, by road. How many roads must it build?'
            answer: "8"
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The villages are vertices and the roads are edges. The cheapest connected network has no cycle, so it is a spanning tree, and a tree on $9$ vertices has $9 - 1 = 8$ edges.'
          - problem: 'How many spanning trees does the cycle $C_6$ have?'
            answer: "6"
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A spanning tree of a cycle is found by deleting exactly one edge. The cycle $C_6$ has $6$ edges and each deletion leaves a spanning path, so there are $6$ spanning trees.'
          - problem: 'A connected graph consists of a $5$-cycle with one pendant edge attached at one vertex. How many spanning trees does it have?'
            answer: "5"
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The pendant edge lies in every spanning tree, because deleting it would cut off its leaf. The $5$-cycle needs exactly one edge deleted, with $5$ choices, so there are $5$ spanning trees.'
          - problem: 'A network of computers is joined by exactly $14$ cables, and removing any one cable would cut some computer off from the others. How many computers are in the network?'
            answer: "15"
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The cables form a connected graph with no cycle, which is a tree. A tree with $14$ edges has $14 + 1 = 15$ vertices, so there are $15$ computers.'
          - problem: 'A connected graph has $10$ vertices and $13$ edges. How many edges must be deleted to leave a spanning tree?'
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A spanning tree on $10$ vertices keeps $10 - 1 = 9$ edges. The graph has $13$ edges, so $13 - 9 = 4$ edges must be deleted.'
          - problem: 'A graph has $9$ vertices and $7$ edges. Does it have a spanning tree?'
            answer: "no"
            answer_contract: {"kind": "label", "options": [["yes", "yes it does", "yes, it does", "it does", "it has one", "yes it has one"], ["no", "no it does not", "no, it does not", "it does not", "it has none", "it has no spanning tree", "no spanning tree", "not"]]}
            solution_sketch: 'A spanning tree on $9$ vertices has $9 - 1 = 8$ edges, and all of them are edges of the graph. The graph has only $7$ edges, which is fewer than $8$, so it is not connected and has no spanning tree.'
          - problem: 'A connected graph consists of a $7$-cycle with a pendant path of two edges attached at one vertex. How many spanning trees does it have?'
            answer: "7"
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Both edges of the pendant path lie in every spanning tree, because deleting either one would cut off the leaf. The $7$-cycle needs exactly one edge deleted, with $7$ choices, so there are $7$ spanning trees.'
          - problem: 'Two triangles share exactly one vertex, like a bow tie. How many spanning trees does this graph have?'
            answer: "9"
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A spanning tree must delete exactly one edge from each triangle, because each triangle is a cycle. Each triangle gives $3$ choices, so there are $3 \cdot 3 = 9$ spanning trees.'
          - problem: 'A connected graph consists of an $8$-cycle with a pendant edge attached at each of two adjacent vertices. How many spanning trees does it have?'
            answer: "8"
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Both pendant edges lie in every spanning tree, because deleting either one would cut off its leaf. The $8$-cycle needs exactly one edge deleted, with $8$ choices, so there are $8$ spanning trees.'
        constraints: 'cycles, near-trees and block graphs where spanning trees can be counted by edge deletion; edge counts of trees in contexts; <= 12 vertices'
      - id: kp2
        name: 'Kruskal and Prim on small weighted graphs'
        key_prerequisites: [trees-characterizations]
        exemplars:
          - problem: 'A weighted graph has vertices $A, B, C, D$ and edges with weights $AB = 2$, $AC = 1$, $BC = 3$, $BD = 4$, $CD = 5$. Find the total weight of a minimum spanning tree.'
            answer: "7"
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Kruskal sorts the edges by weight: $AC$ (1), $AB$ (2), $BC$ (3), $BD$ (4), $CD$ (5). It takes $AC$ (1); takes $AB$ (2); skips $BC$ (3) because it closes a cycle; takes $BD$ (4). The tree weight is 1 + 2 + 4 = 7.'
          - problem: 'Five offices $A, B, C, D, E$ are to be joined by cables, directly or through other offices. The possible cable runs and their costs in dollars are $AB = 50$, $AC = 20$, $BC = 10$, $BD = 70$, $CD = 60$, $CE = 90$, $DE = 40$. What is the least total cost of a cable network that joins all five offices?'
            answer: "130"
            answer_contract: {"kind": "unit", "quantity": "dollar", "unit": "dollar", "allow_omitted": true}
            solution_sketch: 'Kruskal sorts the edges by cost: $BC$ (10), $AC$ (20), $DE$ (40), $AB$ (50), $CD$ (60), $BD$ (70), $CE$ (90). It takes $BC$ (10); takes $AC$ (20); takes $DE$ (40); skips $AB$ (50) because it closes a cycle; takes $CD$ (60). The tree cost is 10 + 20 + 40 + 60 = 130 dollars.'
          - problem: 'A weighted graph has vertices $A, B, C, D, E$ and edges with weights $AB = 1$, $BC = 2$, $CD = 3$, $DE = 4$, $AC = 5$, $BD = 6$, $CE = 7$. Find the total weight of a minimum spanning tree.'
            answer: "10"
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Kruskal sorts the edges by weight: $AB$ (1), $BC$ (2), $CD$ (3), $DE$ (4), $AC$ (5), $BD$ (6), $CE$ (7). It takes $AB$ (1); takes $BC$ (2); takes $CD$ (3); takes $DE$ (4). The tree weight is 1 + 2 + 3 + 4 = 10.'
          - problem: 'A weighted graph has vertices $A, B, C, D, E, F$ and edges with weights $AB = 4$, $AC = 3$, $BC = 2$, $BD = 5$, $CD = 7$, $CE = 8$, $DE = 6$, $DF = 9$, $EF = 1$. Prim''s algorithm starts at $A$ and repeatedly adds the lightest edge that joins a new vertex to the tree. What is the weight of the third edge it adds?'
            answer: "5"
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Prim grows the tree from $A$. Its edges, in order, are $AC$ (3), $CB$ (2), $BD$ (5), $DE$ (6), $EF$ (1). The third edge added has weight 5.'
          - problem: 'A school has six buildings $A, B, C, D, E, F$. Cable can be laid between some pairs of buildings, and the possible lengths in meters are $AB = 40$, $AC = 65$, $BC = 30$, $BD = 55$, $CD = 45$, $CE = 70$, $DE = 25$, $DF = 60$, $EF = 35$. What is the shortest total length of cable that connects all six buildings?'
            answer: "175"
            answer_contract: {"kind": "unit", "quantity": "length", "unit": "m", "allow_omitted": true}
            solution_sketch: 'Kruskal sorts the edges by weight: $DE$ (25), $BC$ (30), $EF$ (35), $AB$ (40), $CD$ (45), $BD$ (55), $DF$ (60), $AC$ (65), $CE$ (70). It takes $DE$ (25); takes $BC$ (30); takes $EF$ (35); takes $AB$ (40); takes $CD$ (45). The tree weight is 25 + 30 + 35 + 40 + 45 = 175. The lengths are in meters.'
          - problem: 'A weighted graph has vertices $A, B, C, D, E$ and edges with weights $AB = 3$, $AC = 8$, $BC = 2$, $BD = 6$, $CD = 9$, $CE = 4$, $DE = 7$. What is the weight of the heaviest edge in a minimum spanning tree?'
            answer: "6"
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Kruskal sorts the edges by weight: $BC$ (2), $AB$ (3), $CE$ (4), $BD$ (6), $DE$ (7), $AC$ (8), $CD$ (9). It takes $BC$ (2); takes $AB$ (3); takes $CE$ (4); takes $BD$ (6). The tree weight is 2 + 3 + 4 + 6 = 15. The tree edges have weights 2, 3, 4, 6, so the heaviest has weight 6.'
          - problem: 'A weighted graph has vertices $A, B, C, D, E$ and edges with weights $AB = 1$, $BC = 2$, $AC = 3$, $CD = 4$, $DE = 5$, $BE = 6$. Sam adds the four lightest edges, $AB, BC, AC, CD$, and says they form a minimum spanning tree of weight $10$. What is the weight of a minimum spanning tree?'
            answer: "12"
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The edge $AC$ closes a cycle with $AB$ and $BC$, so Sam''s four edges do not form a tree. Kruskal sorts the edges by weight: $AB$ (1), $BC$ (2), $AC$ (3), $CD$ (4), $DE$ (5), $BE$ (6). It takes $AB$ (1); takes $BC$ (2); skips $AC$ (3) because it closes a cycle; takes $CD$ (4); takes $DE$ (5). The tree weight is 1 + 2 + 4 + 5 = 12.'
          - problem: 'Four pumping stations $P, Q, R, S$ must be linked by pipes. The possible pipe lengths in kilometers are $PQ = 12$, $PR = 7$, $QR = 9$, $QS = 5$, $RS = 11$. What is the least total length of pipe that links all four stations?'
            answer: "21"
            answer_contract: {"kind": "unit", "quantity": "length", "unit": "km", "allow_omitted": true}
            solution_sketch: 'Kruskal sorts the edges by weight: $QS$ (5), $PR$ (7), $QR$ (9), $RS$ (11), $PQ$ (12). It takes $QS$ (5); takes $PR$ (7); takes $QR$ (9). The tree weight is 5 + 7 + 9 = 21. The lengths are in kilometers.'
        constraints: '4-6 vertices, 5-9 edges, distinct small integer weights so the MST is unique; ask for the total weight, the heaviest tree edge, or the weight of a named Prim step'
    diagnostic_exemplar:
      problem: 'Vertices $P, Q, R, S$; weights $PQ = 3$, $QR = 1$, $RS = 2$, $PS = 4$, $PR = 6$. What is the MST weight?'
      answer: "6"
      solution_sketch: 'Take $QR(1)$, $RS(2)$, $PQ(3)$: spans all four vertices, weight $6$.'
    anki_seeds:
      - front: "Kruskal's algorithm in one sentence"
        back: "Scan edges in increasing weight order, keeping each edge that does not create a cycle, until all vertices are connected."
        type: basic
      - front: "Every spanning tree of a connected graph on $n$ vertices has exactly..."
        back: '$n - 1$ edges.'
        type: basic

  - id: dijkstra-shortest-paths
    name: "Shortest Paths & Dijkstra's Algorithm"
    core: false                # named algorithm the curriculum arrives at and never reuses
    difficulty: 0.65
    drill: false
    answer_kind: numeric
    expected_time_secs: 240
    prerequisites:
      - id: walks-paths-connectivity
        weight: 0.8
        key: true
    knowledge_points:
      - id: kp1
        name: 'Running Dijkstra on a small weighted graph'
        key_prerequisites: [walks-paths-connectivity]
        exemplars:
          - problem: 'A weighted graph has vertices $A, B, C, D$ and edges with weights $AB = 4$, $AC = 2$, $CB = 1$, $BD = 5$, $CD = 8$. Find the length of a shortest path from $A$ to $D$.'
            answer: "8"
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Dijkstra from $A$ settles the vertices in the order $A$ (0), $C$ (2), $B$ (3), $D$ (8). The route to $B$ through $C$ costs 2 + 1 = 3, which beats the direct edge of 4. The route to $D$ through $B$ costs 3 + 5 = 8, which beats 2 + 8 = 10 through $C$, so the shortest path is A-C-B-D with length 8.'
          - problem: 'A weighted graph has vertices $A, B, C, D$ and edges with weights $AB = 7$, $AC = 3$, $CD = 2$, $DB = 1$. What is the distance from $A$ to $B$?'
            answer: "6"
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The direct edge $AB$ costs 7. The path A-C-D-B costs 3 + 2 + 1 = 6, which is less, so the distance from $A$ to $B$ is 6.'
          - problem: 'Six towns $A, B, C, D, E, F$ are joined by roads, and the road lengths in kilometers are $AB = 7$, $AC = 9$, $AF = 14$, $BC = 10$, $BD = 15$, $CD = 11$, $CF = 2$, $DE = 6$, $EF = 9$. What is the length of the shortest route from $A$ to $E$?'
            answer: "20"
            answer_contract: {"kind": "unit", "quantity": "length", "unit": "km", "allow_omitted": true}
            solution_sketch: 'Dijkstra from $A$ settles the towns in the order $A$ (0), $B$ (7), $C$ (9), $F$ (11), $D$ (20), $E$ (20). The shortest route is A-C-F-E, of length 9 + 2 + 9 = 20 kilometers. The route through $B$ and $D$ is longer, at 7 + 15 + 6 = 28.'
          - problem: 'Six towns $A, B, C, D, E, F$ are joined by roads, and the road lengths in kilometers are $AB = 7$, $AC = 9$, $AF = 14$, $BC = 10$, $BD = 15$, $CD = 11$, $CF = 2$, $DE = 6$, $EF = 9$. How many roads does the shortest route from $A$ to $E$ use?'
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The shortest route from $A$ to $E$ is A-C-F-E. It passes through 4 towns, so it uses 3 roads.'
          - problem: 'A courier can drive straight from $A$ to $D$ on a road of 12 kilometers. Other roads link the towns in between, with lengths $AB = 5$, $BC = 3$, $CD = 2$, $AC = 9$. By how many kilometers is the shortest route from $A$ to $D$ shorter than the direct road?'
            answer: "2"
            answer_contract: {"kind": "unit", "quantity": "length", "unit": "km", "allow_omitted": true}
            solution_sketch: 'The shortest route is A-B-C-D, of length 5 + 3 + 2 = 10 kilometers. The direct road is 12 kilometers, so the shortest route is shorter by 12 - 10 = 2 kilometers.'
          - problem: 'A bus drives at $30$ km/h on every road between five stops $A, B, C, D, E$. The road lengths in kilometers are $AB = 10$, $AC = 4$, $CB = 3$, $BD = 5$, $CE = 9$, $DE = 2$. How long does the quickest trip from $A$ to $E$ take?'
            answer: "26"
            answer_contract: {"kind": "unit", "quantity": "time", "unit": "min", "allow_omitted": true}
            solution_sketch: 'Dijkstra from $A$ gives the shortest distance to $E$ as 13 kilometers, along A-C-E. At 30 km/h the bus covers 0.5 kilometer each minute, so 13 kilometers take 13 / 0.5 = 26 minutes.'
          - problem: 'A weighted graph has vertices $A, B, C, D, E$ and edges with weights $AB = 3$, $AC = 5$, $BC = 1$, $BD = 4$, $CE = 2$, $DE = 6$. What is the greatest distance from $A$ to any other vertex?'
            answer: "7"
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Dijkstra from $A$ settles the vertices in the order $A$ (0), $B$ (3), $C$ (4), $E$ (6), $D$ (7). The distances from $A$ are B: 3, C: 4, D: 7, E: 6, so the greatest is 7.'
        constraints: '4-6 vertices, nonnegative integer weights <= 15; the greedy settle order must matter (a direct edge beaten by a detour); ask for one distance, the number of edges of the path, or the greatest distance'
      - id: kp2
        name: 'Why nonnegative weights matter; tracing distances'
        key_prerequisites: [walks-paths-connectivity]
        exemplars:
          - problem: 'In a directed graph the arcs are $A \to B$ with weight $2$, $A \to C$ with weight $3$, and $C \to B$ with weight $-2$. Dijkstra''s algorithm settles $B$ at distance $2$ using the arc $A \to B$. What is the true shortest distance from $A$ to $B$?'
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The path $A \to C \to B$ costs 3 + (-2) = 1, which is less than 2. A negative arc can shorten a path into a vertex that was already settled, which is why Dijkstra''s algorithm needs nonnegative weights.'
          - problem: 'A weighted graph has vertices $A, B, C, D$ and edges with weights $AB = 5$, $AC = 2$, $CB = 2$, $BD = 4$, $CD = 7$. What is the distance from $A$ to $D$?'
            answer: "8"
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Dijkstra from $A$ settles $A$ (0), $C$ (2), $B$ (4), $D$ (8). Going through $C$ lowers the distance to $B$ from 5 to 2 + 2 = 4. Then $D$ is reached through $B$ at 4 + 4 = 8, which beats 2 + 7 = 9 through $C$, so the distance is 8.'
          - problem: 'A data network has routers $A, B, C, D$, and the delays in milliseconds on its links are $AB = 10$, $AC = 2$, $CB = 3$, $BD = 1$, $CD = 7$. A message is sent from $A$ along the path with the least total delay. What is the delay at $D$?'
            answer: "6"
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Dijkstra from $A$ settles $A$ (0), $C$ (2), $B$ (5), $D$ (6). The best path to $D$ is A-C-B-D, with delay 2 + 3 + 1 = 6 milliseconds, which beats 2 + 7 = 9 through $C$ alone.'
          - problem: 'A cargo plane flies from $A$ to $B$ either directly, using $6$ units of fuel, or through $C$. The leg $A \to C$ uses $7$ units, and the leg $C \to B$ gains $3$ units from a tailwind, so it counts as $-3$. Dijkstra''s algorithm settles $B$ at $6$ before looking at $C$. What is the least fuel the trip from $A$ to $B$ needs?'
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The route through $C$ costs 7 + (-3) = 4 units, which is less than the 6 units of the direct leg. The greedy settle of $B$ at 6 was wrong because of the negative leg, so the least fuel is 4 units.'
          - problem: 'A weighted graph has vertices $A, B, C, D$ and edges with weights $AB = 9$, $AC = 4$, $CB = 3$, $BD = 2$. Sam runs Dijkstra''s algorithm from $A$, takes the direct edge $AB$, and reports the distance from $A$ to $D$ as $11$. What is the correct distance?'
            answer: "9"
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Sam did not settle $C$ first. The path A-C-B-D costs 4 + 3 + 2 = 9, which is less than 9 + 2 = 11, so the correct distance is 9.'
          - problem: 'In a directed graph the arcs are $A \to B$ with weight $3$, $A \to C$ with weight $4$, and $C \to B$ with weight $-2$. Dijkstra''s algorithm run from $A$ settles $B$ at distance $3$. Is $3$ the true shortest distance from $A$ to $B$?'
            answer: "no"
            answer_contract: {"kind": "label", "options": [["yes", "yes it is", "yes, it is", "it is", "correct", "right"], ["no", "no it is not", "no, it is not", "it is not", "not correct", "incorrect", "wrong", "not the true distance"]]}
            solution_sketch: 'The path $A \to C \to B$ costs 4 + (-2) = 2, which is less than 3. So 3 is too large and is not the true distance, because the negative arc breaks the greedy settle step.'
          - problem: 'A weighted graph has vertices $A, B, C, D, E$ and edges with weights $AB = 6$, $AC = 1$, $CB = 2$, $BD = 3$, $CD = 7$, $DE = 4$, $BE = 9$. What is the distance from $A$ to $E$?'
            answer: "10"
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Dijkstra from $A$ settles $A$ (0), $C$ (1), $B$ (3), $D$ (6), $E$ (10). The route to $B$ through $C$ costs 1 + 2 = 3, which beats the direct edge of 6. Then $D$ costs 3 + 3 = 6 and $E$ costs 6 + 4 = 10, which beats 3 + 9 = 12, so the distance is 10.'
        constraints: 'ask for one distance in a small graph, or for the true distance where a negative arc breaks the greedy settle; graphs small enough to trace by hand'
    diagnostic_exemplar:
      problem: 'Vertices $A, B, C, D$; weights $AB = 7$, $AC = 3$, $CD = 2$, $DB = 1$. What is the distance from $A$ to $B$?'
      answer: "6"
      solution_sketch: '$A\!-\!C\!-\!D\!-\!B$ costs $3 + 2 + 1 = 6 < 7$.'
    anki_seeds:
      - front: "Dijkstra's algorithm requires edge weights to be..."
        back: "nonnegative — otherwise a settled vertex could later be improved."
        type: basic
      - front: "Dijkstra invariant when a vertex is settled"
        back: "Its tentative distance equals the true shortest-path distance from the source."
        type: basic

  - id: graph-coloring
    name: "Graph Coloring & Chromatic Number"
    core: true
    difficulty: 0.65
    drill: false
    answer_kind: numeric
    expected_time_secs: 180
    prerequisites:
      - id: graphs-intro
        weight: 0.7
        key: true
      - id: degree-handshake
        weight: 0.5
        key: false
      - id: walks-paths-connectivity
        weight: 0.5
        key: true
    knowledge_points:
      - id: kp1
        name: 'Chromatic numbers of standard graphs'
        key_prerequisites: [graphs-intro, walks-paths-connectivity]
        try_first:
          problem: 'Three friends are all rivals of one another. They are split into teams so that no two rivals are on the same team. What is the fewest number of teams?'
          answer_contract: {"kind": "exact"}
          answer: '3'
          reveal: 'Every two of the three are rivals, so each needs a team of their own and the answer is $3$. This least number of colors for a graph is its chromatic number, here $\chi(K_3) = 3$.'
        exemplars:
          - problem: 'Find $\chi(C_5)$, the chromatic number of the $5$-cycle.'
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Two colors would have to alternate around the cycle, which is impossible when the number of vertices is odd. Three colors suffice, for example $1, 2, 1, 2, 3$ around the cycle, so $\chi(C_5) = 3$.'
          - problem: 'In the complete graph $K_6$, every two of the six vertices are joined by an edge. What is the chromatic number of $K_6$?'
            answer: "6"
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Every pair of vertices is adjacent, so no color can be used twice. That needs at least 6 colors, and giving each vertex its own color is a proper coloring, so $\chi(K_6) = 6$.'
          - problem: 'A tree has $8$ vertices. What is its chromatic number?'
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A tree on $8$ vertices has $7$ edges, so one color is not enough. Give the root color 1, its neighbors color 2, and keep alternating with the distance from the root; the tree has no cycle, so no edge joins two vertices of the same color, and $\chi = 2$.'
          - problem: 'The wheel $W_6$ has a hub joined to every vertex of a $5$-cycle, the rim. What is the chromatic number of $W_6$?'
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The rim is a 5-cycle, which is an odd cycle and needs 3 colors. The hub is adjacent to every rim vertex, so it needs a fourth color. Coloring the rim $1, 2, 1, 2, 3$ and the hub $4$ works, so $\chi(W_6) = 4$.'
          - problem: 'A company places $10$ radio transmitters in a ring. Each transmitter interferes only with the two neighbors beside it in the ring, and transmitters that interfere must use different frequencies. What is the fewest number of frequencies needed?'
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The interference graph is a cycle on 10 vertices. An even cycle can be colored by alternating two colors, and one frequency is not enough because neighbors interfere, so 2 frequencies are needed.'
          - problem: 'A complete graph has $28$ edges. What is its chromatic number?'
            answer: "8"
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A complete graph on $n$ vertices has $n(n-1)/2$ edges, and $8 \cdot 7 / 2 = 28$, so the graph is $K_8$. Every pair of its vertices is adjacent, so it needs 8 colors and $\chi = 8$.'
          - problem: 'Nine guests sit around a round table, and each guest quarrels with exactly the two guests sitting beside them. The host splits the guests into groups so that no two guests who quarrel are in the same group. What is the fewest number of groups?'
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The quarrels form a cycle on 9 vertices, which is an odd cycle. Two groups would have to alternate around the table and fail at the closing seat, so at least 3 are needed. Three groups suffice, for example 1, 2, 1, 2, 1, 2, 1, 2, 3 around the table.'
          - problem: 'Find $\chi(C_6)$, the chromatic number of the $6$-cycle.'
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: 'An even cycle can be colored by alternating two colors, $1, 2, 1, 2, 1, 2$. One color is not enough because adjacent vertices need different colors, so $\chi(C_6) = 2$.'
          - problem: 'The complete bipartite graph $K_{3,4}$ has $3$ vertices on one side and $4$ on the other, and every vertex on one side is joined to every vertex on the other. What is its chromatic number?'
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Give color 1 to the 3 vertices on one side and color 2 to the 4 vertices on the other side. No edge joins two vertices on the same side, so this is proper, and one color is not enough, so $\chi = 2$.'
        constraints: 'cycles, complete graphs, trees, wheels and complete bipartite graphs with <= 10 vertices; ask for the chromatic number'
      - id: kp2
        name: 'Scheduling via coloring; the Delta + 1 bound'
        key_prerequisites: [graphs-intro, walks-paths-connectivity]
        exemplars:
          - problem: 'Four exams $M, P, C, B$ have conflicts $MP$, $MC$, $PC$, $CB$, where a conflict means that some student takes both exams. What is the fewest number of exam slots so that no student has two exams in the same slot?'
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The exams $M$, $P$, $C$ conflict in pairs, so they form a triangle and need 3 different slots. Put $B$ in the slot of $M$, since $B$ conflicts only with $C$, so 3 slots are enough and the fewest is 3.'
          - problem: 'A graph has maximum degree $\Delta = 4$. Greedy coloring never needs more than how many colors?'
            answer: "5"
            answer_contract: {"kind": "exact"}
            solution_sketch: 'When greedy coloring reaches a vertex, at most $\Delta = 4$ of its neighbors are colored, so at most 4 colors are blocked. A fifth color is always free, so 5 colors are always enough.'
          - problem: 'A district schedules six committee meetings $A, B, C, D, E, F$. Two meetings clash when they share a member, and the clashes are $AB$, $BC$, $CD$, $DE$, $EF$, $FA$. What is the fewest number of time slots in which no two clashing meetings run together?'
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The clash graph is a cycle on 6 vertices. Put $A, C, E$ in slot 1 and $B, D, F$ in slot 2, and every clash joins different slots. One slot cannot work because $AB$ clash, so the fewest is 2.'
          - problem: 'Five exams $P, Q, R, S, T$ have conflicts $PQ$, $PR$, $PS$, $QR$, $QS$, $RS$, $RT$, $ST$. What is the fewest number of exam slots so that no student has two exams in the same slot?'
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The exams $P, Q, R, S$ conflict in every pair, so they need 4 different slots. Exam $T$ conflicts only with $R$ and $S$, so it can share the slot of $P$, and 4 slots are enough.'
          - problem: 'Every router in a network is linked to at most $7$ other routers, and linked routers must use different channels. How many channels are enough, whatever the layout of the network?'
            answer: "8"
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Each router has at most 7 neighbors, so at most 7 channels are blocked when greedy coloring reaches it. An eighth channel is always free, so $\Delta + 1 = 8$ channels are enough.'
          - problem: 'A project has seven tasks $A, B, C, D, E, F, G$. Two tasks cannot run in the same slot when they share a worker, and the conflicts are $AB$, $AC$, $BC$, $CD$, $DE$, $EF$, $FG$, $GA$. What is the fewest number of time slots needed?'
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The tasks $A, B, C$ conflict in every pair, so they need 3 slots. The assignment $A=1, B=2, C=3, D=1, E=2, F=3, G=2$ gives different slots to every conflicting pair, so 3 slots are enough.'
          - problem: 'Six exams $A, B, C, D, E, F$ have conflicts $AB$, $AC$, $AD$, $AE$, $BC$, $DE$, $EF$. Greedy coloring is guaranteed to use at most $\Delta + 1$ colors, where $\Delta$ is the largest number of conflicts any one exam has. What is this bound for these exams?'
            answer: "5"
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Exam $A$ conflicts with $B, C, D, E$, which is 4 conflicts, and no other exam has more, so $\Delta = 4$. The bound $\Delta + 1$ is then 5.'
          - problem: 'A conflict graph of exams has maximum degree $3$. Is it possible that it needs $5$ time slots?'
            answer: "no"
            answer_contract: {"kind": "label", "options": [["yes", "yes it is possible", "yes, it is possible", "it is possible", "possible"], ["no", "no it is not possible", "no, it is not possible", "it is not possible", "not possible", "impossible", "no it is not", "no, it is not"]]}
            solution_sketch: 'Greedy coloring always works with $\Delta + 1 = 4$ colors, because each exam has at most 3 conflicts. So 4 slots are always enough, and 5 slots are never needed.'
        constraints: 'conflict graphs with 4-7 items; the minimum number of slots, or the Delta + 1 bound for greedy coloring'
    diagnostic_exemplar:
      problem: 'Exams $M, P, C, S$ have conflicts $MP$, $PC$, $MC$, $CS$, $MS$. What is the minimum number of exam slots so that no student sits conflicting exams simultaneously?'
      answer: '3'
