  - id: planar-graphs-euler-formula
    name: "Planar Graphs & Euler's Formula"
    core: false                # named terminal graph result
    difficulty: 0.7
    drill: false
    answer_kind: numeric
    expected_time_secs: 240
    prerequisites:
      - id: trees-characterizations
        weight: 0.6
        key: true
      - id: degree-handshake
        weight: 0.6
        key: true
      - id: graph-coloring
        weight: 0.3
        key: false
    knowledge_points:
      - id: kp1
        name: 'v - e + f = 2'
        key_prerequisites: [trees-characterizations]
        exemplars:
          - problem: 'A connected planar graph is drawn in the plane with $8$ vertices and $12$ edges. How many faces, including the outer face, does the drawing have?'
            answer: "6"
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Euler''s formula for a connected planar graph is $v - e + f = 2$. Substituting gives $8 - 12 + f = 2$, so $f = 2 - 8 + 12 = 6$.'
          - problem: 'A connected planar drawing has $10$ vertices and $7$ faces. How many edges does it have?'
            answer: "15"
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Euler''s formula gives $v - e + f = 2$, so $e = v + f - 2$. Then $e = 10 + 7 - 2 = 15$.'
          - problem: 'A connected planar drawing has $11$ edges and $5$ faces. How many vertices does the graph have?'
            answer: "8"
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Euler''s formula gives $v - e + f = 2$, so $v = 2 + e - f$. Then $v = 2 + 11 - 5 = 8$.'
          - problem: 'A road map joins $12$ towns by $20$ roads that do not cross, and every town can be reached from every other. Into how many regions, including the outside, do the roads divide the plane?'
            answer: "10"
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The towns are vertices, the roads are edges and the regions are faces of a connected planar graph. Euler''s formula gives $f = 2 - v + e = 2 - 12 + 20 = 10$.'
          - problem: 'A convex polyhedron has $12$ vertices and $30$ edges. Drawn flat, its vertices and edges form a connected planar graph whose faces are the faces of the polyhedron. How many faces does the polyhedron have?'
            answer: "20"
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Euler''s formula gives $f = 2 - v + e = 2 - 12 + 30 = 20$. The polyhedron has 20 faces.'
          - problem: 'A connected planar drawing has $9$ vertices and $8$ edges. How many faces does it have?'
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Euler''s formula gives $f = 2 - 9 + 8 = 1$. A connected graph with $9$ vertices and $8 = 9 - 1$ edges is a tree, which has only the outer face.'
          - problem: 'Sam draws a connected planar graph with $6$ vertices and $10$ edges and counts $5$ faces, including the outer face. How many faces should the drawing have?'
            answer: "6"
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Euler''s formula gives $f = 2 - v + e = 2 - 6 + 10 = 6$. Sam''s count of 5 is one too small, probably because the outer face was left out.'
          - problem: 'A polyhedron has $24$ vertices and $14$ faces. How many edges does it have?'
            answer: "36"
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The polyhedron drawn flat is a connected planar graph, so $v - e + f = 2$. Then $e = v + f - 2 = 24 + 14 - 2 = 36$.'
          - problem: 'A planar embedding of a connected graph has $15$ vertices and $20$ edges. Determine the number of faces, including the outer face.'
            answer: "7"
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Euler''s formula for a connected planar graph is $v - e + f = 2$. So $f = 2 - 15 + 20 = 7$, and the drawing has 7 faces.'
        constraints: 'connected planar graphs; solve v - e + f = 2 for the missing quantity; values <= 30'
      - id: kp2
        name: 'Edge bounds and proving nonplanarity'
        key_prerequisites: [trees-characterizations, degree-handshake]
        exemplars:
          - problem: 'What is the largest number of edges that a simple planar graph with $7$ vertices can have?'
            answer: "15"
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A simple planar graph with $v \ge 3$ vertices has $e \le 3v - 6$ edges, and this bound is reached when every face is a triangle. For $v = 7$ the bound is $3 \cdot 7 - 6 = 15$.'
          - problem: 'The complete graph $K_6$ has $15$ edges. By how many edges does it exceed the largest number of edges that a simple planar graph with $6$ vertices can have?'
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A simple planar graph with $6$ vertices has at most $3 \cdot 6 - 6 = 12$ edges. The graph $K_6$ has $15$, which is $15 - 12 = 3$ more, so $K_6$ is not planar.'
          - problem: 'A simple planar graph with $8$ vertices has no triangles. What is the largest number of edges it can have?'
            answer: "12"
            answer_contract: {"kind": "exact"}
            solution_sketch: 'When there is no triangle, every face has at least 4 edges on its boundary, and the bound sharpens to $e \le 2v - 4$. For $v = 8$ this is $2 \cdot 8 - 4 = 12$.'
          - problem: 'A planner draws a road map with $10$ junctions. Roads do not cross, at most one road joins any two junctions, and no three junctions are joined to one another in pairs. What is the largest number of roads the map can have?'
            answer: "16"
            answer_contract: {"kind": "exact"}
            solution_sketch: 'No three junctions are joined in pairs, so the graph has no triangles and $e \le 2v - 4$. For $v = 10$ this is $2 \cdot 10 - 4 = 16$ roads.'
          - problem: 'A circuit board holds $9$ components. A wire joins two components, at most one wire joins any two, and no two wires may cross. What is the largest number of wires the board can have?'
            answer: "21"
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The wires form a simple planar graph on $9$ vertices, so $e \le 3v - 6$. For $v = 9$ this is $3 \cdot 9 - 6 = 21$, so the board can have 21 wires.'
          - problem: 'The graph $K_{3,3}$ has $6$ vertices, $9$ edges and no triangles. Is $K_{3,3}$ planar?'
            answer: "no"
            answer_contract: {"kind": "label", "options": [["yes", "yes it is", "yes, it is", "it is", "it is planar", "planar", "yes it is planar", "yes, it is planar"], ["no", "no it is not", "no, it is not", "it is not", "it is not planar", "not planar", "nonplanar", "no, it is not planar"]]}
            solution_sketch: 'With no triangles, a simple planar graph on 6 vertices has at most $2 \cdot 6 - 4 = 8$ edges. The graph $K_{3,3}$ has 9 edges, which is more than 8, so it is not planar.'
          - problem: 'A simple connected planar graph has $8$ vertices, and every face, including the outer face, is bounded by exactly $3$ edges. How many faces does it have?'
            answer: "12"
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Each edge borders 2 faces and each face has 3 edges, so $3f = 2e$. Euler''s formula $v - e + f = 2$ then gives $e = 3v - 6 = 18$, so $f = 2 - 8 + 18 = 12$.'
          - problem: 'Sam says that a simple planar graph with $6$ vertices has at most $2 \cdot 6 - 4 = 8$ edges. The graph may contain triangles. What is the largest number of edges it can have?'
            answer: "12"
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The bound $2v - 4$ holds only when the graph has no triangles. A graph that may contain triangles obeys $e \le 3v - 6 = 3 \cdot 6 - 6 = 12$, so the correct largest number is 12.'
          - problem: 'The wheel with a hub joined to every vertex of a $6$-cycle has $7$ vertices and $12$ edges, and it contains triangles. Is it planar?'
            answer: "yes"
            answer_contract: {"kind": "label", "options": [["yes", "yes it is", "yes, it is", "it is", "it is planar", "planar", "yes it is planar", "yes, it is planar"], ["no", "no it is not", "no, it is not", "it is not", "it is not planar", "not planar", "nonplanar", "no, it is not planar"]]}
            solution_sketch: 'The bound $3 \cdot 7 - 6 = 15$ allows 12 edges, so it does not rule the graph out. Draw the 6-cycle as a hexagon and put the hub inside it, joined to the 6 corners, and no edges cross.'
          - problem: 'The complete bipartite graph $K_{3,4}$ has $7$ vertices, $12$ edges and no triangles. By how many edges does it exceed the largest number of edges that a simple planar graph with $7$ vertices and no triangles can have?'
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Without triangles, at most $2v - 4 = 2 \cdot 7 - 4 = 10$ edges are possible. The graph $K_{3,4}$ has $12$, which is 2 more, so it is not planar.'
        constraints: 'apply e <= 3v-6 or e <= 2v-4 (triangle-free) to find a largest edge count, an excess over it, or a verdict; the item must test THIS KP: Edge bounds and proving nonplanarity'
    diagnostic_exemplar:
      problem: 'A connected planar drawing of a simple graph has $9$ vertices and $14$ edges. How many faces, including the outer face, does the drawing have?'
      answer: '7'
      solution_sketch: 'Euler: $f = 2 - v + e = 2 - 9 + 14 = 7$. The drawing has $7$ faces, including the outer face.'
    anki_seeds:
      - front: "Euler's formula for connected planar graphs"
        back: '$v - e + f = 2$ (faces include the unbounded outer face).'
        type: basic
      - front: "Planar edge bound (simple, $v \\ge 3$) and its triangle-free sharpening"
        back: '$e \le 3v - 6$; if the graph has no triangles, $e \le 2v - 4$.'
        type: basic
      - front: "The two minimal nonplanar graphs (Kuratowski)"
        back: '$K_5$ and $K_{3,3}$.'
        type: basic

  - id: bipartite-graphs-matchings
    name: "Bipartite Graphs & Matchings"
    core: false                # terminal graph topic
    difficulty: 0.7
    drill: false
    answer_kind: numeric
    expected_time_secs: 240
    prerequisites:
      - id: graph-coloring
        weight: 0.6
        key: true
      - id: walks-paths-connectivity
        weight: 0.6
        key: true
    knowledge_points:
      - id: kp1
        name: 'Recognizing bipartite graphs'
        key_prerequisites: [graph-coloring, walks-paths-connectivity]
        exemplars:
          - problem: 'Is the cycle $C_6$ bipartite?'
            answer: "yes"
            answer_contract: {"kind": "label", "options": [["yes", "yes it is", "yes, it is", "it is", "it is bipartite", "bipartite", "yes it is bipartite", "yes, it is bipartite"], ["no", "no it is not", "no, it is not", "it is not", "it is not bipartite", "not bipartite", "no it is not bipartite", "no, it is not bipartite"]]}
            solution_sketch: 'Color the vertices around the cycle alternately with two colors, $1, 2, 1, 2, 1, 2$. Every edge joins different colors, so the two color classes are the two parts and $C_6$ is bipartite.'
          - problem: 'How many edges does the complete bipartite graph $K_{3,4}$ have?'
            answer: "12"
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Every one of the $3$ vertices on one side is joined to all $4$ vertices on the other side. So the number of edges is $3 \cdot 4 = 12$.'
          - problem: 'A simple bipartite graph has $5$ vertices in one part and $7$ in the other. What is the largest number of edges it can have?'
            answer: "35"
            answer_contract: {"kind": "exact"}
            solution_sketch: 'No edge lies inside a part, and each edge joins one vertex of each part. At most every one of the $5$ vertices is joined to every one of the $7$, so at most $5 \cdot 7 = 35$ edges.'
          - problem: 'A school dance has $6$ boys and $9$ girls. How many different pairs of one boy and one girl are possible?'
            answer: "54"
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Each pair is an edge between the $6$ boys and the $9$ girls, so the pairs are the edges of $K_{6,9}$. There are $6 \cdot 9 = 54$ of them.'
          - problem: 'In a bipartite graph the left part has $6$ vertices, and each of them has degree $4$. The right part has $8$ vertices, which all have the same degree. What is that degree?'
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Every edge has exactly one end in the left part, so the number of edges is $6 \cdot 4 = 24$. The same $24$ edges end in the right part, so each of its $8$ vertices has degree $24 / 8 = 3$.'
          - problem: 'A tournament has $5$ teams in group $X$ and $4$ teams in group $Y$. Every team in $X$ plays every team in $Y$ exactly once, and no two teams in the same group play each other. How many games are played?'
            answer: "20"
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The teams are vertices and the games are edges, and no edge lies inside a group, so the graph is bipartite. There are $5 \cdot 4 = 20$ games.'
          - problem: 'The graph has vertices $1, 2, \dots, 6$ and edges $12$, $23$, $34$, $45$, $56$, $61$, $13$. What is the length of its shortest odd cycle?'
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The edges $12$, $23$ and $13$ form a triangle, which is a cycle of length 3. No cycle has length 1, so the shortest odd cycle has length 3.'
          - problem: 'The graph has vertices $1, 2, \dots, 6$ and edges $12$, $23$, $34$, $45$, $56$, $61$, $13$. Is the graph bipartite?'
            answer: "no"
            answer_contract: {"kind": "label", "options": [["yes", "yes it is", "yes, it is", "it is", "it is bipartite", "bipartite", "yes it is bipartite", "yes, it is bipartite"], ["no", "no it is not", "no, it is not", "it is not", "it is not bipartite", "not bipartite", "no it is not bipartite", "no, it is not bipartite"]]}
            solution_sketch: 'The graph contains the triangle $1, 2, 3$, which is an odd cycle. A bipartite graph has no odd cycle, because alternating two parts around an odd cycle fails, so the graph is not bipartite.'
          - problem: 'The graph has vertices $1, 2, \dots, 7$ and edges $12$, $23$, $34$, $45$, $51$, $36$, $67$, $72$. What is the length of its shortest odd cycle?'
            answer: "5"
            answer_contract: {"kind": "exact"}
            solution_sketch: 'No three vertices are pairwise joined, so the graph has no triangle. The cycle $1, 2, 3, 4, 5$ has length 5, which is odd, and it is the shortest odd cycle, so the graph is not bipartite.'
        constraints: 'cycles, K_{m,n} with m,n <= 9, small ad hoc graphs; edge and degree counts of bipartite graphs; at most two verdict items'
      - id: kp2
        name: 'Matchings and Hall''s condition'
        key_prerequisites: [graph-coloring, walks-paths-connectivity]
        try_first:
          problem: 'Two workers can do only job $p$, and a third worker can do job $p$ or job $q$. Can all three workers be given different jobs?'
          answer_contract: {"kind": "label", "options": [["yes", "yes they can", "yes, they can", "they can", "it is possible", "possible", "yes it is possible", "yes, it is possible"], ["no", "no they cannot", "no, they cannot", "they cannot", "it is not possible", "impossible", "no it is not possible", "no, it is not possible"]]}
          answer: 'no'
          reveal: 'Only two jobs, $p$ and $q$, are available to the three workers, so one worker must go without. Hall''s condition fails for this set of three workers, because they can do fewer jobs than there are workers.'
        exemplars:
          - problem: 'What is the size of a maximum matching in $K_{3,5}$?'
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A matching uses each left vertex at most once, so it has at most $3$ edges. Pairing the left vertices with $3$ different right vertices reaches this, so the maximum size is 3.'
          - problem: 'Four workers can each do task $p$ or task $q$, and no other task. Each worker takes at most one task, and each task goes to at most one worker. What is the greatest number of tasks that can be assigned?'
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: 'There are only two tasks, $p$ and $q$, and each goes to one worker, so at most 2 can be assigned. Giving $p$ to one worker and $q$ to another reaches 2.'
          - problem: 'Four students $A, B, C, D$ can take projects as follows: $A$ takes $p$ or $q$, $B$ takes $q$ or $r$, $C$ takes $r$ or $s$, and $D$ takes $s$ or $p$. Each student takes one project and each project goes to one student. What is the greatest number of students who can get a project?'
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The pairing $A$-$p$, $B$-$q$, $C$-$r$, $D$-$s$ gives every student a different project. So all 4 students get a project, which is the most possible.'
          - problem: 'Three servers $S_1, S_2, S_3$ can each run only the job $t$. A job runs on one server at a time. What is the greatest number of servers that can be given a job at once?'
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: 'All three servers want the same job $t$, and $t$ goes to one server only. So at most 1 server gets a job, and giving $t$ to $S_1$ reaches 1.'
          - problem: 'Four workers $L_1, L_2, L_3, L_4$ can do jobs as follows: $L_1\!: \{a\}$, $L_2\!: \{b\}$, $L_3\!: \{a, b\}$, $L_4\!: \{c\}$. What is the greatest number of workers who can be given different jobs?'
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The set $\{L_1, L_2, L_3\}$ can do only the jobs $a$ and $b$, so at most 2 of those three get a job. Adding $L_4$ with job $c$ gives 3, for example $L_1$-$a$, $L_2$-$b$, $L_4$-$c$.'
          - problem: 'Workers $W_1, W_2, W_3, W_4$ can do jobs as follows: $W_1\!: \{a, b\}$, $W_2\!: \{a, c\}$, $W_3\!: \{b, d\}$, $W_4\!: \{c, d\}$. Can every worker be given a different job?'
            answer: "yes"
            answer_contract: {"kind": "label", "options": [["yes", "yes they can", "yes, they can", "they can", "it is possible", "possible", "yes it is possible", "yes, it is possible"], ["no", "no they cannot", "no, they cannot", "they cannot", "it is not possible", "impossible", "no it is not possible", "no, it is not possible"]]}
            solution_sketch: 'The assignment $W_1$-$a$, $W_2$-$c$, $W_3$-$b$, $W_4$-$d$ gives the 4 workers 4 different jobs. So every worker can be given a different job.'
          - problem: 'Workers $W_1, W_2, W_3, W_4$ can do jobs as follows: $W_1\!: \{a, b\}$, $W_2\!: \{b\}$, $W_3\!: \{b, c\}$, $W_4\!: \{b\}$. Can every worker be given a different job?'
            answer: "no"
            answer_contract: {"kind": "label", "options": [["yes", "yes they can", "yes, they can", "they can", "it is possible", "possible", "yes it is possible", "yes, it is possible"], ["no", "no they cannot", "no, they cannot", "they cannot", "it is not possible", "impossible", "no it is not possible", "no, it is not possible"]]}
            solution_sketch: 'The workers $W_2, W_3, W_4$ can do only the jobs $b$ and $c$, which are 2 jobs for 3 workers. By Hall''s condition a matching of all 4 workers does not exist, so the answer is no.'
          - problem: 'Workers $W_1, W_2, W_3, W_4$ can do jobs as follows: $W_1\!: \{a, b\}$, $W_2\!: \{b\}$, $W_3\!: \{b, c\}$, $W_4\!: \{b\}$. How many different jobs can the workers $W_2, W_3, W_4$ do between them?'
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The worker $W_2$ can do only $b$, $W_4$ can do only $b$, and $W_3$ can do $b$ or $c$. Together they can do the jobs $b$ and $c$, which is 2 jobs.'
          - problem: 'Workers $W_1, W_2, W_3, W_4$ can do jobs as follows: $W_1\!: \{a, b\}$, $W_2\!: \{b\}$, $W_3\!: \{b, c\}$, $W_4\!: \{b\}$. What is the greatest number of these workers who can be given different jobs?'
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Three workers $W_2, W_3, W_4$ share only 2 jobs, so one of them goes without. Giving $W_1$ job $a$, $W_2$ job $b$ and $W_3$ job $c$ gives 3 workers different jobs, so the maximum is 3.'
          - problem: 'Five employees $E_1, \dots, E_5$ can do tasks as follows: $E_1\!: \{t_1, t_2\}$, $E_2\!: \{t_2, t_3\}$, $E_3\!: \{t_3, t_4\}$, $E_4\!: \{t_4, t_5\}$, $E_5\!: \{t_5, t_1\}$. Each employee takes one task and each task goes to one employee. What is the greatest number of employees who can get a task?'
            answer: "5"
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Give each employee $E_i$ the task $t_i$. This gives 5 employees 5 different tasks, so the greatest number is 5.'
          - problem: 'At a dance there are $7$ men and $5$ women, and any man may dance with any woman. What is the greatest number of couples that can dance at the same time?'
            answer: "5"
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Each couple uses one man and one woman, so the number of couples is at most the number of women, which is 5. Pairing the 5 women with 5 different men reaches it.'
        constraints: 'bipartite sides <= 7; compute a maximum matching size, a neighborhood size, or decide whether every worker can be matched'
    diagnostic_exemplar:
      problem: 'Workers $1, 2, 3, 4$ can do jobs: $W_1\!: \{a, b\}$, $W_2\!: \{b\}$, $W_3\!: \{b, c\}$, $W_4\!: \{b\}$. Can every worker get a distinct job? Verify with Hall''s condition.'
