unit: graph-algorithms
course: discrete-mathematics
module: "Graph Algorithms & Coloring"
topics:
  - id: spanning-trees-mst
    name: "Spanning Trees & Minimum Spanning Trees"
    core: false                # named algorithm; nothing downstream
    difficulty: 0.65
    drill: false
    answer_kind: numeric
    expected_time_secs: 240
    prerequisites:
      - id: trees-characterizations
        weight: 0.8
        key: true
    knowledge_points:
      - id: kp1
        name: "Spanning tree basics"
        key_prerequisites: [trees-characterizations]
        exemplars:
          - problem: 'A connected graph has $12$ vertices. How many edges does each of its spanning trees have?'
            answer: "11"
            solution_sketch: 'A spanning tree is a tree on all $12$ vertices: $n - 1 = 11$ edges.'
          - problem: 'How many spanning trees does the cycle $C_4$ have?'
            answer: "4"
            solution_sketch: 'Deleting any one of the $4$ edges leaves a spanning path; a cycle on $n$ vertices has exactly $n$ spanning trees.'
          - problem: "How many spanning trees does the cycle C6 have?"
            answer: "6"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Rule: edge deletion from a cycle. A spanning tree of a cycle on n vertices is obtained by deleting exactly one edge. The cycle C6 has 6 edges, and deleting any one of them leaves a spanning path. So the number of spanning trees is 6."
          - problem: "A connected graph consists of a 5-cycle with one pendant edge attached at one vertex. How many spanning trees does it have?"
            answer: "5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Rule: forced tree edge plus cycle edge deletion. The pendant edge must be in every spanning tree, because deleting it isolates its leaf. The remaining 5-cycle needs exactly one edge deleted. There are 5 choices for that edge, so the number of spanning trees is 5."
          - problem: "A connected graph consists of a 7-cycle with a pendant path of length 2 attached at one vertex. How many spanning trees does it have?"
            answer: "7"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Rule: forced path edges plus cycle edge deletion. The two edges of the pendant path must be in every spanning tree, because deleting either one disconnects the leaf. The remaining 7-cycle needs exactly one edge deleted. There are 7 choices for that edge, so the number of spanning trees is 7."
          - problem: "A connected graph consists of an 8-cycle with a pendant edge attached at each of two adjacent vertices. How many spanning trees does it have?"
            answer: "8"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Rule: forced pendant edges plus cycle edge deletion. Both pendant edges must be in every spanning tree, because deleting either one isolates its leaf. The remaining 8-cycle needs exactly one edge deleted. There are 8 choices for that edge, so the number of spanning trees is 8."
        constraints: "cycles and near-trees where spanning trees can be counted by edge deletion; <= 12 vertices"
      - id: kp2
        name: "Kruskal and Prim on small weighted graphs"
        key_prerequisites: [trees-characterizations]
        exemplars:
          - problem: 'Vertices $A, B, C, D$; edge weights $AB = 1$, $BC = 2$, $CD = 3$, $AD = 4$, $AC = 5$. Find the total weight of a minimum spanning tree.'
            answer: "6"
            solution_sketch: 'Kruskal: take $AB$ ($1$), $BC$ ($2$), $CD$ ($3$) — no cycles formed, all vertices covered. Weight $1 + 2 + 3 = 6$.'
          - problem: "Vertices A, B, C, D have edge weights AB = 2, AC = 1, BC = 3, BD = 4, CD = 5. Find the total weight of a minimum spanning tree."
            answer: "7"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The graph is AB = 2, AC = 1, BC = 3, BD = 4, CD = 5. Kruskal sorts the edges as AC = 1, AB = 2, BC = 3, BD = 4, CD = 5. It takes AC and AB, skips BC because it closes a cycle, and takes BD to join D. The rule is Kruskal's algorithm with a cycle check. The total weight is 1 + 2 + 4 = 7."
          - problem: "Vertices A, B, C, D, E have edge weights AB = 1, BC = 2, CD = 3, DE = 4, AC = 5, BD = 6, CE = 7. Find the total weight of a minimum spanning tree."
            answer: "10"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The graph is AB = 1, BC = 2, CD = 3, DE = 4, AC = 5, BD = 6, CE = 7. Kruskal sorts the edges as AB = 1, BC = 2, CD = 3, DE = 4, AC = 5, BD = 6, CE = 7. It takes AB, BC, CD, DE; the edges AC, BD, CE are skipped because each closes a cycle. The rule is Kruskal's algorithm with a cycle check. The total weight is 1 + 2 + 3 + 4 = 10."
          - problem: "Vertices A, B, C, D, E have edge weights AB = 3, BC = 1, CD = 5, DE = 2, AC = 4, BD = 6, CE = 7. Find the total weight of a minimum spanning tree."
            answer: "11"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The graph is AB = 3, BC = 1, CD = 5, DE = 2, AC = 4, BD = 6, CE = 7. Kruskal sorts the edges as BC = 1, DE = 2, AB = 3, AC = 4, CD = 5, BD = 6, CE = 7. It takes BC, DE, AB; AC is skipped as a cycle; it takes CD to join the two components. The rule is Kruskal's algorithm with a cycle check. The total weight is 1 + 2 + 3 + 5 = 11."
          - problem: "Vertices A, B, C, D, E have edge weights AC = 3, AB = 1, BC = 2, CD = 4, DE = 5, BD = 6, CE = 7. Find the total weight of a minimum spanning tree."
            answer: "12"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The graph is AC = 3, AB = 1, BC = 2, CD = 4, DE = 5, BD = 6, CE = 7. Kruskal sorts the edges as AB = 1, BC = 2, AC = 3, CD = 4, DE = 5, BD = 6, CE = 7. It takes AB, BC, CD, DE; AC, BD, CE are skipped as cycles. The rule is Kruskal's algorithm with a cycle check. The total weight is 1 + 2 + 4 + 5 = 12."
          - problem: "Vertices A, B, C, D have edge weights AB = 2, BC = 3, CD = 4, AC = 5, BD = 6. Find the total weight of a minimum spanning tree."
            answer: "9"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The graph is AB = 2, BC = 3, CD = 4, AC = 5, BD = 6. Kruskal sorts the edges as AB = 2, BC = 3, CD = 4, AC = 5, BD = 6. It takes AB, BC, CD; AC and BD are skipped because they close cycles. The rule is Kruskal's algorithm with a cycle check. The total weight is 2 + 3 + 4 = 9."
        constraints: "4-6 vertices, 5-8 edges, distinct small integer weights so the MST is unique; ask for total weight and/or edge list"
    diagnostic_exemplar:
      problem: 'Vertices $P, Q, R, S$; weights $PQ = 3$, $QR = 1$, $RS = 2$, $PS = 4$, $PR = 6$. What is the MST weight?'
      answer: "6"
      solution_sketch: 'Take $QR(1)$, $RS(2)$, $PQ(3)$: spans all four vertices, weight $6$.'
    anki_seeds:
      - front: "Kruskal's algorithm in one sentence"
        back: "Scan edges in increasing weight order, keeping each edge that does not create a cycle, until all vertices are connected."
        type: basic
      - front: "Every spanning tree of a connected graph on $n$ vertices has exactly..."
        back: '$n - 1$ edges.'
        type: basic

  - id: dijkstra-shortest-paths
    name: "Shortest Paths & Dijkstra's Algorithm"
    core: false                # named algorithm the curriculum arrives at and never reuses
    difficulty: 0.65
    drill: false
    answer_kind: numeric
    expected_time_secs: 240
    prerequisites:
      - id: walks-paths-connectivity
        weight: 0.8
        key: true
    knowledge_points:
      - id: kp1
        name: "Running Dijkstra on a small weighted graph"
        key_prerequisites: [walks-paths-connectivity]
        exemplars:
          - problem: 'Vertices $A, B, C, D$; weights $AB = 4$, $AC = 2$, $CB = 1$, $BD = 5$, $CD = 8$. Find the length of the shortest path from $A$ to $D$.'
            answer: "8"
            solution_sketch: 'Dijkstra from $A$: settle $A(0)$, $C(2)$, then $B$ via $C$ ($2 + 1 = 3 < 4$), then $D$ via $B$ ($3 + 5 = 8 < 2 + 8 = 10$). Path $A\!-\!C\!-\!B\!-\!D$.'
          - problem: 'Same graph: what is the distance from $A$ to $B$?'
            answer: "3"
            solution_sketch: 'The direct edge costs $4$; the path $A\!-\!C\!-\!B$ costs $2 + 1 = 3$.'
        constraints: "4-6 vertices, nonnegative integer weights <= 9; the greedy settle order must matter (a direct edge beaten by a detour)"
      - id: kp2
        name: "Why nonnegative weights matter; tracing distances"
        key_prerequisites: [walks-paths-connectivity]
        exemplars:
          - problem: 'Dijkstra settles $B$ at distance $2$ using the edge $AB = 2$. The graph also has $AC = 3$ and a negative edge $CB = -2$. What is the true distance from $A$ to $B$?'
            answer: "1"
            solution_sketch: '$A\!-\!C\!-\!B$ costs $3 + (-2) = 1 < 2$: a negative edge shortens a path into an already-settled vertex, which is why Dijkstra requires nonnegative weights.'
          - problem: 'Vertices $A, B, C, D$; weights $AB = 7$, $AC = 3$, $CD = 2$, $DB = 1$. Give the final distances from $A$ as the ordered triple $(d(B), d(C), d(D))$.'
            answer: '$(6, 3, 5)$'
            solution_sketch: 'Settle $A(0)$, $C(3)$, $D(3+2=5)$, then $B$ via $D$ ($5 + 1 = 6 < 7$).'
          - problem: "Vertices A, B, C, D. Edge weights: A-B = 5, A-C = 2, C-B = 2, B-D = 4, C-D = 6. Run Dijkstra from A. Give the final distances as (d(B), d(C), d(D))."
            answer: "(4, 2, 8)"
            answer_contract: {"arity": 3, "kind": "coordinates"}
            solution_sketch: "Full graph: A-B = 5, A-C = 2, C-B = 2, B-D = 4, C-D = 6. Dijkstra settles A at 0, then C at 2. Relaxing C-B gives B = min(5, 2+2) = 4. Settle B at 4, then relax B-D to get D = 4+4 = 8. The distance triple is (4, 2, 8)."
          - problem: "A greedy run marks B with tentative distance 6, coming from edge AB = 6. The same graph contains AC = 7 together with a negative edge CB = -3. Find the actual shortest distance from A to B."
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Full graph: AB has weight 6, AC has weight 7, and CB has weight -3. Greedy Dijkstra settles B at 6 using AB. The path A-C-B costs 7 + (-3) = 4, which is smaller, so the negative edge breaks the settle step. The true distance is 4."
          - problem: "A network has nodes A, B, C, D. Link costs: A-B = 10, A-C = 2, C-B = 3, B-D = 1, C-D = 7. Starting at A, give the settled distances to B, C, and D as (d(B), d(C), d(D))."
            answer: "(5, 2, 6)"
            answer_contract: {"arity": 3, "kind": "coordinates"}
            solution_sketch: "Full graph: A-B = 10, A-C = 2, C-B = 3, B-D = 1, C-D = 7. Settle A at 0, then C at 2. Relaxing C-B gives B = min(10, 2+3) = 5. Settle B, then D = min(2+7, 5+1) = 6. The settled distance triple is (5, 2, 6)."
          - problem: "The greedy algorithm settles B at 3 through edge AB = 3. Another route is A to C with weight 4, then C to B with a negative weight -2. What is the shortest distance from A to B?"
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Full graph: AB has weight 3, AC has weight 4, and CB has weight -2. The greedy step settles B at 3 using AB. The path A-C-B costs 4 + (-2) = 2, which is shorter, so the negative edge breaks the greedy settle. The actual shortest distance is 2."
        constraints: "ask for the distance triple, or for a small counterexample showing a negative edge breaks the greedy settle; graphs small enough to trace by hand"
    diagnostic_exemplar:
      problem: 'Vertices $A, B, C, D$; weights $AB = 7$, $AC = 3$, $CD = 2$, $DB = 1$. What is the distance from $A$ to $B$?'
      answer: "6"
      solution_sketch: '$A\!-\!C\!-\!D\!-\!B$ costs $3 + 2 + 1 = 6 < 7$.'
    anki_seeds:
      - front: "Dijkstra's algorithm requires edge weights to be..."
        back: "nonnegative — otherwise a settled vertex could later be improved."
        type: basic
      - front: "Dijkstra invariant when a vertex is settled"
        back: "Its tentative distance equals the true shortest-path distance from the source."
        type: basic

  - id: graph-coloring
    name: "Graph Coloring & Chromatic Number"
    core: true
    difficulty: 0.65
    drill: false
    answer_kind: numeric
    expected_time_secs: 180
    prerequisites:
      - id: graphs-intro
        weight: 0.7
        key: true
      - id: degree-handshake
        weight: 0.5
        key: false
      - id: walks-paths-connectivity
        weight: 0.5
        key: true
    knowledge_points:
      - id: kp1
        name: "Chromatic numbers of standard graphs"
        key_prerequisites: [graphs-intro, walks-paths-connectivity]
        exemplars:
          - problem: 'Find $\chi(C_5)$, the chromatic number of the $5$-cycle.'
            answer: "3"
            solution_sketch: 'Two colors force alternation, impossible around an odd cycle; three colors suffice (color $1,2,1,2,3$).'
          - problem: 'Give $(\chi(C_6), \chi(K_5))$ as an ordered pair.'
            answer: '$(2, 5)$'
            solution_sketch: 'Even cycles alternate two colors; in $K_5$ all vertices are mutually adjacent, forcing five distinct colors.'
          - problem: "The cycle $C_7$ is a ring of seven vertices. Find the chromatic number of $C_7$, and give both a coloring and a lower-bound argument."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The graph is $C_7$, an odd cycle. The lower bound uses the odd-cycle fact: two colors would alternate around the cycle and fail to close, so at least 3 colors are needed. A 3-coloring exists as 1,2,1,2,1,2,3 around the ring. So the chromatic number is 3."
          - problem: "In the complete graph $K_6$, every two distinct vertices are joined by an edge. Find the chromatic number of $K_6$, and give both a coloring and a lower-bound argument."
            answer: "6"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The graph is $K_6$, a clique of size 6. The lower bound follows because every pair of vertices is adjacent, so no color can be reused at all, forcing at least 6 colors. Assign a different color to each of the six vertices to get a proper coloring. Thus the chromatic number is 6."
          - problem: "The wheel $W_6$ consists of a hub joined to every vertex of a 5-cycle rim. Find the chromatic number of $W_6$, and give both a coloring and a lower-bound argument."
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The graph is $W_6$, with a 5-cycle rim and a hub adjacent to all rim vertices. The lower bound comes from the rim: a 5-cycle is an odd cycle, so it needs 3 colors, and the hub touches all rim vertices, so it needs a fourth color. A 4-coloring uses 1,2,1,2,3 on the rim and 4 on the hub. Therefore the chromatic number is 4."
          - problem: "A tree $T$ has 8 vertices and is connected with no cycles. Find the chromatic number of $T$, and give both a coloring and a lower-bound argument."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The graph is a tree $T$ on 8 vertices. The lower bound is 2 because the tree has edges, so one color cannot work. A 2-coloring follows by bipartitioning the tree: place the root in color 1, its neighbors in color 2, and continue alternating by distance from the root. Hence the chromatic number is 2."
        constraints: "cycles, complete graphs, trees, wheels with <= 8 vertices; require both a coloring and a lower-bound argument"
      - id: kp2
        name: "Scheduling via coloring; the Delta + 1 bound"
        key_prerequisites: [graphs-intro, walks-paths-connectivity]
        exemplars:
          - problem: 'Exams $M, P, C, B$: conflicts $MP$, $MC$, $PC$, $CB$. What is the minimum number of exam slots (no student takes conflicting exams simultaneously)?'
            answer: "3"
            solution_sketch: 'The conflict graph contains the triangle $MPC$, so $\ge 3$; color $M=1$, $P=2$, $C=3$, $B=1$. Slots $= \chi = 3$.'
          - problem: 'A graph has maximum degree $\Delta = 4$. What upper bound does greedy coloring guarantee for $\chi$?'
            answer: "5"
            solution_sketch: 'Greedy always finds a free color among $\Delta + 1$, since a vertex has at most $\Delta$ colored neighbors.'
          - problem: "A district schedules six committee meetings A, B, C, D, E, F. Two meetings clash when they share a member, and the clashes are AB, BC, CD, DE, EF, FA. Find the minimum number of time slots needed so that no two clashing meetings run at the same time."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The clash graph has vertices A, B, C, D, E, F with the six listed edges, which form a cycle through all vertices. Lower bound: the edge AB joins two clashing meetings, so one slot cannot work and at least 2 slots are needed. Upper bound: assign slot 1 to A, C, E and slot 2 to B, D, F; then every listed clash joins meetings in different slots, so 2 slots suffice. Since 2 slots are enough and fewer fail, the minimum number of time slots is 2."
          - problem: "Five exams P, Q, R, S, T have conflicts PQ, PR, PS, QR, QS, RS, RT, ST. What is the minimum number of exam slots so that no student sits conflicting exams at the same time?"
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Exams P, Q, R, S form a K4 because every pair among them conflicts, so at least 4 slots are needed. Upper bound: color P=1, Q=2, R=3, S=4, and T=1, which is proper because T conflicts only with R and S. The minimum number of slots is 4."
          - problem: "A project has seven tasks A, B, C, D, E, F, G. Tasks cannot run in the same slot if they share a worker. The conflicts are AB, AC, BC, CD, DE, EF, FG, GA. What is the minimum number of time slots needed?"
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The tasks A, B, C form a triangle because all three pairs conflict, so at least 3 slots are needed. Upper bound: the coloring A=1, B=2, C=3, D=1, E=2, F=3, G=2 is proper because each listed conflict joins different colors. Thus the minimum number of time slots is 3."
          - problem: "Five exams A, B, C, D, E have conflicts AB, AC, AD, BC, BD, CD. What is the minimum number of exam slots so that no student sits conflicting exams at the same time?"
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The four exams A, B, C, D form a K4 because every pair among them conflicts, so at least 4 slots are needed. Upper bound: color A=1, B=2, C=3, D=4, and E=1, which is proper since E has no conflicts. The minimum number of slots is 4."
        constraints: "conflict graphs with 4-7 items; lower bound from a clique, upper bound from an explicit coloring"
    diagnostic_exemplar:
      problem: 'Exams $M, P, C, S$ have conflicts $MP$, $PC$, $MC$, $CS$, $MS$. What is the minimum number of exam slots so that no student sits conflicting exams simultaneously?'
      answer: '3'
      solution_sketch: '$M, P, C$ form a triangle, so at least $3$ slots; giving $S$ the slot of $P$ (they do not conflict) yields a $3$-coloring.'
    anki_seeds:
      - front: "Chromatic number of an even cycle / odd cycle"
        back: "2 / 3."
        type: basic
      - front: "Greedy coloring bound"
        back: '$\chi(G) \le \Delta(G) + 1$, where $\Delta$ is the maximum degree.'
        type: basic

  - id: planar-graphs-euler-formula
    name: "Planar Graphs & Euler's Formula"
    core: false                # named terminal graph result
    difficulty: 0.7
    drill: false
    answer_kind: numeric
    expected_time_secs: 240
    prerequisites:
      - id: trees-characterizations
        weight: 0.6
        key: true
      - id: degree-handshake
        weight: 0.6
        key: true
      - id: graph-coloring
        weight: 0.3
        key: false
    knowledge_points:
      - id: kp1
        name: "v - e + f = 2"
        key_prerequisites: [trees-characterizations]
        exemplars:
          - problem: 'A connected planar graph is drawn with $8$ vertices and $12$ edges. How many faces (including the outer face) does the drawing have?'
            answer: "6"
            solution_sketch: '$f = 2 - v + e = 2 - 8 + 12 = 6$.'
          - problem: 'A connected planar drawing has $10$ vertices and $7$ faces. How many edges does it have?'
            answer: "15"
            solution_sketch: '$e = v + f - 2 = 10 + 7 - 2 = 15$.'
          - problem: "A connected planar drawing has 11 edges and 5 faces. How many vertices does the graph have?"
            answer: "8"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Euler's formula for a connected planar graph is v - e + f = 2. Substitute e = 11 and f = 5: v - 11 + 5 = 2, so v = 8. The number of vertices is 8."
          - problem: "A connected planar drawing has 12 vertices and 17 edges. How many faces (including the outer face) does the drawing have?"
            answer: "7"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Euler's formula for a connected planar graph is v - e + f = 2. Substitute v = 12 and e = 17: 12 - 17 + f = 2, so f = 7. The number of faces is 7."
          - problem: "A connected planar drawing has 6 vertices and 8 faces. How many edges does the drawing have?"
            answer: "12"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Euler's formula for a connected planar graph is v - e + f = 2. Substitute v = 6 and f = 8: 6 - e + 8 = 2, so e = 12. The number of edges is 12."
          - problem: "A planar embedding of a connected graph has 15 vertices and 20 edges. Determine the number of faces (including the outer face)."
            answer: "7"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Euler's formula for a connected planar graph is v - e + f = 2. Substitute v = 15 and e = 20: 15 - 20 + f = 2, so f = 7. The number of faces is 7."
        constraints: "connected planar graphs; solve v - e + f = 2 for the missing quantity; values <= 30"
      - id: kp2
        name: "Edge bounds and proving nonplanarity"
        key_prerequisites: [trees-characterizations, degree-handshake]
        exemplars:
          - problem: 'Every simple connected planar graph with $v \ge 3$ satisfies $e \le 3v - 6$. Compute this bound for $K_5$ ($v = 5$), then compare it with the $10$ edges of $K_5$.'
            answer: "9"
            solution_sketch: '$3 \cdot 5 - 6 = 9$, and $K_5$ has $e = 10 > 9$, so $K_5$ is not planar.'
          - problem: '$K_{3,3}$ has $9$ edges and $6$ vertices, and $9 \le 3 \cdot 6 - 6 = 12$, so that bound says nothing. $K_{3,3}$ is triangle-free, so the sharper bound $e \le 2v - 4$ applies: compute it for $v = 6$.'
            answer: "8"
            solution_sketch: 'Bipartite graphs have no $3$-cycles, so every face needs $\ge 4$ edges, giving $e \le 2v - 4 = 8$; since $9 > 8$, $K_{3,3}$ is not planar.'
          - problem: "The complete graph K6 has 6 vertices, 15 edges, and contains cycles of length 3. Bound A is e <= 3v - 6. Bound B is e <= 2v - 4 and is available only when the graph has no cycle of length 3. State which bound applies to K6 and give its value."
            answer: "which = A; bound = 12"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["A"], ["B"]]}, "name": "which"}, {"contract": {"kind": "exact"}, "name": "bound"}]}
            solution_sketch: "The graph is K6 with v = 6 and e = 15, and it contains cycles of length 3. Step 1: Because a 3-cycle is present, the sharper bound for graphs without triangles is unavailable, so the general Euler bound e <= 3v - 6 applies. Step 2: Substitute v = 6 into e <= 3v - 6: 3(6) - 6 = 12. Step 3: The value of the applicable bound is 12. The answer is which = A; bound = 12."
          - problem: "The complete bipartite graph K3,4 has 7 vertices and 12 edges. It has no cycle of length 3. Bound A is e <= 3v - 6. Bound B is e <= 2v - 4 and is available only when the graph has no cycle of length 3. State which bound applies to K3,4 and give its value."
            answer: "which = B; bound = 10"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["A"], ["B"]]}, "name": "which"}, {"contract": {"kind": "exact"}, "name": "bound"}]}
            solution_sketch: "The graph is K3,4 with v = 7 and e = 12, and it has no cycle of length 3. Step 1: Because no 3-cycle is present, the sharper bound for graphs without triangles applies: e <= 2v - 4. Step 2: Substitute v = 7 into e <= 2v - 4: 2(7) - 4 = 10. Step 3: The value of the applicable bound is 10. The answer is which = B; bound = 10."
          - problem: "The complete bipartite graph K3,5 has 8 vertices and 15 edges. It has no cycle of length 3. Bound A is e <= 3v - 6. Bound B is e <= 2v - 4 and is available only when the graph has no cycle of length 3. Determine which bound applies to K3,5 and compute its value."
            answer: "which = B; bound = 12"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["A"], ["B"]]}, "name": "which"}, {"contract": {"kind": "exact"}, "name": "bound"}]}
            solution_sketch: "The graph is K3,5 with v = 8 and e = 15, and it has no cycle of length 3. Step 1: Because no 3-cycle is present, the sharper bound for graphs without triangles applies: e <= 2v - 4. Step 2: Substitute v = 8 into e <= 2v - 4: 2(8) - 4 = 12. Step 3: The value of the applicable bound is 12. The answer is which = B; bound = 12."
          - problem: "The wheel graph W6 has a center vertex joined to each of 6 cycle vertices, so it has 7 vertices and 12 edges, and it contains cycles of length 3. Bound A is e <= 3v - 6. Bound B is e <= 2v - 4 and is available only when the graph has no cycle of length 3. State which bound applies to W6 and compute its value."
            answer: "which = A; bound = 15"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["A"], ["B"]]}, "name": "which"}, {"contract": {"kind": "exact"}, "name": "bound"}]}
            solution_sketch: "The graph is W6 with v = 7 and e = 12, and it contains cycles of length 3. Step 1: Because a 3-cycle is present, the sharper bound for graphs without triangles is unavailable, so the general Euler bound e <= 3v - 6 applies. Step 2: Substitute v = 7 into e <= 3v - 6: 3(7) - 6 = 15. Step 3: The value of the applicable bound is 15. The answer is which = A; bound = 15."
        constraints: "apply e <= 3v-6 or e <= 2v-4 (triangle-free); state which bound applies and why, and compute its value; the item must test THIS KP: Edge bounds and proving nonplanarity"
    diagnostic_exemplar:
      problem: 'A connected planar drawing of a simple graph has $9$ vertices and $14$ edges. Give (the number of faces of the drawing, the maximum number of edges the bound $e \le 3v - 6$ permits on $9$ vertices) as an ordered pair.'
      answer: '$(7, 21)$'
      solution_sketch: 'Euler: $f = 2 - v + e = 2 - 9 + 14 = 7$; bound: $3 \cdot 9 - 6 = 21$.'
    anki_seeds:
