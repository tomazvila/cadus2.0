unit: gradient-optimization
course: multivariable-calculus
module: "Gradients & Optimization"
topics:
  - id: computing-the-gradient
    name: "Computing the Gradient"
    core: true
    difficulty: 0.66
    drill: false
    answer_kind: numeric
    expected_time_secs: 90
    prerequisites:
      - id: partial-derivatives
        weight: 0.8
        key: true
      - id: vectors-in-rn
        weight: 0.4
        key: false
    knowledge_points:
      - id: kp1
        name: "Gradients of two-variable functions"
        key_prerequisites: [partial-derivatives]
        exemplars:
          - problem: 'Find the gradient of $f(x, y) = 3x^2 y + y^3$.'
            answer: '(6xy, 3x^2+3y^2)'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Differentiate with respect to $x$ and hold $y$ constant: $3x^2 y$ gives $6xy$ and $y^3$ gives $0$. Differentiate with respect to $y$ and hold $x$ constant: $3x^2 y$ gives $3x^2$ and $y^3$ gives $3y^2$. So $\nabla f = \langle 6xy,\ 3x^2 + 3y^2 \rangle$.'
          - problem: 'Let $f(x, y) = 4x^2 + 3y^2$. Find $\nabla f(2, 1)$.'
            answer: '(16, 6)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'The partial derivatives are $f_x = 8x$ and $f_y = 6y$. At the point $(2, 1)$ they equal $8 \cdot 2 = 16$ and $6 \cdot 1 = 6$. So $\nabla f(2, 1) = \langle 16, 6 \rangle$.'
          - problem: 'Let $f(x, y) = x^3 y^2$. Find $\nabla f(1, 2)$.'
            answer: '(12, 4)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'Hold $y$ constant to get $f_x = 3x^2 y^2$, and hold $x$ constant to get $f_y = 2x^3 y$. At $(1, 2)$ these are $3 \cdot 1 \cdot 4 = 12$ and $2 \cdot 1 \cdot 2 = 4$. So $\nabla f(1, 2) = \langle 12, 4 \rangle$.'
          - problem: 'A hill has height $h(x, y) = 100 - x^2 - 2y^2$ metres at the point $(x, y)$, where $x$ and $y$ are measured in metres east and north of a hut. Find $\nabla h(3, 2)$.'
            answer: '(-6, -8)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'The partial derivatives are $h_x = -2x$ and $h_y = -4y$. At $(3, 2)$ they equal $-6$ and $-8$. So $\nabla h(3, 2) = \langle -6, -8 \rangle$.'
          - problem: 'The temperature on a metal plate is $T(x, y) = 2x^2 + xy$ degrees Celsius at the point $(x, y)$, where $x$ and $y$ are measured in centimetres. A bug at $(1, 3)$ walks east, which is the direction of increasing $x$. If the temperature keeps rising at the rate it has at the start, how many centimetres must the bug walk for the temperature to rise by $14$ degrees?'
            answer: '2'
            answer_contract: {"kind":"unit","quantity":"length","unit":"cm","allow_omitted":true}
            solution_sketch: 'Walking east changes only $x$, so the rate is $T_x = 4x + y$. At $(1, 3)$ this equals $7$ degrees per centimetre. To gain $14$ degrees we divide: $14 / 7 = 2$ centimetres.'
          - problem: 'Sam finds the gradient of $f(x, y) = x^2 y$ at the point $(3, 2)$ and writes $\nabla f(3, 2) = (2 \cdot 3,\ 3^2) = (6, 9)$. What is the correct value of $\nabla f(3, 2)$?'
            answer: '(12, 9)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'Sam left out the factor $y$ in $f_x$. The correct partial derivative is $f_x = 2xy$, which equals $2 \cdot 3 \cdot 2 = 12$ at the point. The second component $f_y = x^2 = 9$ was right, so $\nabla f(3, 2) = \langle 12, 9 \rangle$.'
          - problem: 'Let $f(x, y) = 2x^3 - 4xy + y^2$. Find $\nabla f(1, 3)$.'
            answer: '(-6, 2)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'The partial derivatives are $f_x = 6x^2 - 4y$ and $f_y = -4x + 2y$. At $(1, 3)$ they equal $6 - 12 = -6$ and $-4 + 6 = 2$. So $\nabla f(1, 3) = \langle -6, 2 \rangle$.'
          - problem: 'Let $f(x, y) = x^2 - 4x + y^2 + 6y$. Find the point at which $\nabla f$ is the zero vector.'
            answer: '(2, -3)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'The gradient is $\langle 2x - 4,\ 2y + 6 \rangle$. Setting both components equal to $0$ gives $x = 2$ and $y = -3$. So the gradient is the zero vector at $(2, -3)$.'
        constraints: 'polynomial functions of two variables, gradient at a point with small integer components; word problems use a surface height or a temperature'
      - id: kp2
        name: "Gradients requiring the product, quotient, or chain rule"
        key_prerequisites: [partial-derivatives]
        exemplars:
          - problem: 'Find the gradient of $f(x, y) = \ln(x^2 + y^2)$.'
            answer: '(2x/(x^2+y^2), 2y/(x^2+y^2))'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The chain rule gives $f_x = \frac{1}{x^2 + y^2} \cdot 2x$ and $f_y = \frac{1}{x^2 + y^2} \cdot 2y$. The outer function $\ln$ has derivative one over its input. So $\nabla f = \langle \frac{2x}{x^2 + y^2},\ \frac{2y}{x^2 + y^2} \rangle$.'
          - problem: 'Find the gradient of $f(x, y) = x e^{xy}$.'
            answer: '((1 + x*y)*e^(x*y), x^2*e^(x*y))'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'For $f_x$ use the product rule: $f_x = e^{xy} + x \cdot y e^{xy} = (1 + xy) e^{xy}$. For $f_y$ the factor $x$ is constant and the exponent $xy$ has derivative $x$ in $y$, so $f_y = x \cdot x e^{xy} = x^2 e^{xy}$. This gives both components of $\nabla f$.'
          - problem: 'The temperature of a metal plate is $T(x, y) = 50 \ln(x^2 + y^2)$ degrees Celsius at the point $(x, y)$, where $x$ and $y$ are measured in centimetres. Find $\nabla T(3, 4)$.'
            answer: '(12, 16)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'By the chain rule $T_x = \frac{100x}{x^2 + y^2}$ and $T_y = \frac{100y}{x^2 + y^2}$. At $(3, 4)$ the denominator is $25$, so $T_x = 300/25 = 12$ and $T_y = 400/25 = 16$. Hence $\nabla T(3, 4) = \langle 12, 16 \rangle$.'
          - problem: 'The electric potential near a wire is $V(x, y) = \dfrac{1}{\sqrt{x^2 + y^2}}$ volts at the point $(x, y)$, where $x$ and $y$ are measured in metres. Find $\nabla V(3, 4)$.'
            answer: '(-3/125, -4/125)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'Write $V = (x^2 + y^2)^{-1/2}$. The chain rule gives $V_x = -x (x^2 + y^2)^{-3/2}$ and $V_y = -y (x^2 + y^2)^{-3/2}$. At $(3, 4)$ we have $x^2 + y^2 = 25$ and $25^{3/2} = 125$, so $\nabla V(3, 4) = \langle -3/125,\ -4/125 \rangle$.'
          - problem: 'Find the gradient of $f(x, y) = \dfrac{x}{x^2 + y^2}$.'
            answer: '((y^2-x^2)/(x^2+y^2)^2,-2xy/(x^2+y^2)^2)'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The quotient rule in $x$ gives $f_x = \frac{(x^2 + y^2) - x(2x)}{(x^2 + y^2)^2} = \frac{y^2 - x^2}{(x^2 + y^2)^2}$. In $y$ the numerator is constant, so $f_y = \frac{-x(2y)}{(x^2 + y^2)^2} = \frac{-2xy}{(x^2 + y^2)^2}$. These are the two components of $\nabla f$.'
          - problem: 'Ben differentiates $f(x, y) = e^{x^2 y}$ with respect to $x$ and gets $f_x = e^{x^2 y}$, as if the exponent were not there. What is the correct $f_x$?'
            answer: '2xy*e^(x^2*y)'
            answer_contract: {"kind":"function","vars":["x","y"]}
            solution_sketch: 'The exponent $x^2 y$ is an inner function, so the chain rule multiplies by its derivative. With respect to $x$ that derivative is $2xy$. So $f_x = 2xy\, e^{x^2 y}$.'
          - problem: 'Find the gradient of $f(x, y) = e^{x^2 + y^2}$.'
            answer: '(2x*e^(x^2+y^2), 2y*e^(x^2+y^2))'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The chain rule in $x$ gives $f_x = e^{x^2 + y^2} \cdot 2x$. The chain rule in $y$ gives $f_y = e^{x^2 + y^2} \cdot 2y$. So $\nabla f = \langle 2x e^{x^2 + y^2},\ 2y e^{x^2 + y^2} \rangle$.'
          - problem: 'Find the gradient of $f(x, y) = \sqrt{x^2 + y^2}$.'
            answer: '(x/sqrt(x^2+y^2), y/sqrt(x^2+y^2))'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The chain rule with the outer square root gives $f_x = \frac{1}{2\sqrt{x^2 + y^2}} \cdot 2x = \frac{x}{\sqrt{x^2 + y^2}}$. The same step in $y$ gives $f_y = \frac{y}{\sqrt{x^2 + y^2}}$. In each component the factor $2$ cancels.'
          - problem: 'Let $f(x, y) = x \ln(y^2 + 1)$. Find $\nabla f(2, 1)$.'
            answer: '(ln(2), 2)'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'With respect to $x$ the factor $\ln(y^2 + 1)$ is constant, so $f_x = \ln(y^2 + 1)$, which equals $\ln 2$ at $(2, 1)$. With respect to $y$ the chain rule gives $f_y = x \cdot \frac{2y}{y^2 + 1}$, which equals $2 \cdot \frac{2}{2} = 2$. So $\nabla f(2, 1) = \langle \ln 2, 2 \rangle$.'
        constraints: 'one product, quotient or composite structure per function (e^{xy}, ln(x^2+y^2), sqrt, 1/r); symbolic gradients are exact tuples; results simplify cleanly'
      - id: kp3
        name: "Gradients in three variables"
        key_prerequisites: [partial-derivatives, vectors-in-rn]
        exemplars:
          - problem: 'Let $f(x, y, z) = xyz$. Find $\nabla f(2, 1, 4)$.'
            answer: '(4, 8, 2)'
            answer_contract: {"kind":"coordinates","arity":3}
            solution_sketch: 'Each partial derivative leaves the product of the other two variables, so $\nabla f = \langle yz,\ xz,\ xy \rangle$. At $(2, 1, 4)$ this is $\langle 1 \cdot 4,\ 2 \cdot 4,\ 2 \cdot 1 \rangle$. So $\nabla f(2, 1, 4) = \langle 4, 8, 2 \rangle$.'
          - problem: 'Find the gradient of $f(x, y, z) = x^2 y + y z^2$.'
            answer: '(2xy, x^2+z^2, 2yz)'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Hold $y$ and $z$ constant to get $f_x = 2xy$. Hold $x$ and $z$ constant to get $f_y = x^2 + z^2$. Hold $x$ and $y$ constant to get $f_z = 2yz$, so $\nabla f = \langle 2xy,\ x^2 + z^2,\ 2yz \rangle$.'
          - problem: 'Let $f(x, y, z) = x^2 + y^2 + z^2$. Find $\nabla f(3, -1, 2)$.'
            answer: '(6, -2, 4)'
            answer_contract: {"kind":"coordinates","arity":3}
            solution_sketch: 'The gradient is $\langle 2x,\ 2y,\ 2z \rangle$. At $(3, -1, 2)$ the components are $6$, $-2$ and $4$. So $\nabla f(3, -1, 2) = \langle 6, -2, 4 \rangle$.'
          - problem: 'The temperature in a room is $T(x, y, z) = 20 + 2xz - y^2$ degrees Celsius at the point $(x, y, z)$, where all distances are measured in metres. Find $\nabla T(1, 2, 3)$.'
            answer: '(6, -4, 2)'
            answer_contract: {"kind":"coordinates","arity":3}
            solution_sketch: 'The partial derivatives are $T_x = 2z$, $T_y = -2y$ and $T_z = 2x$. At $(1, 2, 3)$ they equal $6$, $-4$ and $2$. So $\nabla T(1, 2, 3) = \langle 6, -4, 2 \rangle$.'
          - problem: 'The salt concentration in a tank is $c(x, y, z) = 3x^2 + yz$ grams per litre at the point $(x, y, z)$, where distances are measured in metres and $z$ points upward. A probe at $(1, 2, 1)$ moves straight up. If the concentration keeps changing at its initial rate, how many metres must the probe rise for the concentration to increase by $5$ grams per litre?'
            answer: '5/2'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'Moving straight up changes only $z$, so the rate is $c_z = y$. At $(1, 2, 1)$ this equals $2$ grams per litre for each metre. To gain $5$ grams per litre we divide: $5 / 2 = 2.5$ metres.'
          - problem: 'Sam finds the gradient of $f(x, y, z) = xy + yz + zx$ and writes $\nabla f = (y,\ z,\ x)$. What is the correct value of $\nabla f(2, -3, 4)$?'
            answer: '(1, 6, -1)'
            answer_contract: {"kind":"coordinates","arity":3}
            solution_sketch: 'Sam kept only one term in each component. Each variable appears in two terms, so $f_x = y + z$, $f_y = x + z$ and $f_z = x + y$. At $(2, -3, 4)$ these equal $1$, $6$ and $-1$.'
          - problem: 'Let $f(x, y, z) = xyz + x^2 + y^2 + z^2$. Find $\nabla f(1, 2, -1)$.'
            answer: '(0, 3, 0)'
            answer_contract: {"kind":"coordinates","arity":3}
            solution_sketch: 'The partial derivatives are $f_x = yz + 2x$, $f_y = xz + 2y$ and $f_z = xy + 2z$. At $(1, 2, -1)$ they equal $-2 + 2 = 0$, $-1 + 4 = 3$ and $2 - 2 = 0$. So $\nabla f(1, 2, -1) = \langle 0, 3, 0 \rangle$.'
          - problem: 'Let $f(x, y, z) = x^3 + y^3 + z^3$. Find $\nabla f(-1, 2, -2)$.'
            answer: '(3, 12, 12)'
            answer_contract: {"kind":"coordinates","arity":3}
            solution_sketch: 'The gradient is $\langle 3x^2,\ 3y^2,\ 3z^2 \rangle$. At $(-1, 2, -2)$ the squares are $1$, $4$ and $4$. So $\nabla f(-1, 2, -2) = \langle 3, 12, 12 \rangle$.'
        constraints: 'three-variable functions of degree at most 3 and simple room or tank models; integer evaluation points'
    diagnostic_exemplar:
      problem: 'Let $f(x, y, z) = x^2 y e^{z}$. Evaluate $\nabla f(1, 2, 0)$.'
      answer: '$\langle 4, 1, 2 \rangle$'
      answer_contract: {kind: none}
      solution_sketch: '$\nabla f = \langle 2xy e^z,\; x^2 e^z,\; x^2 y e^z \rangle$; at $(1, 2, 0)$ this is $\langle 4, 1, 2 \rangle$.'
    anki_seeds:
      - front: 'Definition of the gradient $\nabla f$ for $f(x, y)$?'
        back: '$\nabla f = \langle f_x, f_y \rangle$ — the vector of partial derivatives.'
        type: basic
      - front: 'Gradient of $f(x, y, z)$?'
        back: '$\nabla f = \langle f_x, f_y, f_z \rangle$'
        type: basic

  - id: gradient-directional-derivatives
    name: "Directional Derivatives and Steepest Ascent"
    core: true
    difficulty: 0.75
    drill: false
    answer_kind: numeric
    expected_time_secs: 180
    prerequisites:
      - id: computing-the-gradient
        weight: 0.8
        key: true
      - id: dot-product
        weight: 0.6
        key: true
      - id: tangent-planes-linear-approximation
        weight: 0.3
        key: false
    knowledge_points:
      - id: kp1
        name: "Directional derivatives"
        key_prerequisites: [computing-the-gradient, dot-product]
        exemplars:
          - problem: 'Find the directional derivative of $f(x, y) = x^2 + y^2$ at $(1, 2)$ in the direction of $\mathbf{v} = \langle 3, 4 \rangle$.'
            answer: '22/5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The gradient at $(1, 2)$ is $\langle 2, 4 \rangle$. The vector $\mathbf{v}$ has length $5$, so the unit vector is $\mathbf{u} = \langle 3/5, 4/5 \rangle$. Then $D_{\mathbf{u}} f = 6/5 + 16/5 = 22/5$.'
          - problem: 'Find the directional derivative of $f(x, y) = x y^2$ at $(2, 1)$ in the direction of $\mathbf{v} = \langle 3, 4 \rangle$.'
            answer: '19/5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The gradient is $\langle y^2, 2xy \rangle$, which equals $\langle 1, 4 \rangle$ at $(2, 1)$. The unit vector in the direction of $\mathbf{v}$ is $\langle 3/5, 4/5 \rangle$. The dot product is $3/5 + 16/5 = 19/5$.'
          - problem: 'Find the directional derivative of $f(x, y) = x^2 + 3xy$ at $(1, 2)$ in the direction of $\mathbf{v} = \langle 5, 12 \rangle$.'
            answer: '76/13'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The gradient is $\langle 2x + 3y, 3x \rangle = \langle 8, 3 \rangle$ at $(1, 2)$. The length of $\mathbf{v}$ is $13$, so $\mathbf{u} = \langle 5/13, 12/13 \rangle$. Then $D_{\mathbf{u}} f = 40/13 + 36/13 = 76/13$.'
          - problem: 'Find the directional derivative of $f(x, y) = x^2 - y^2$ at $(3, 1)$ in the direction of the unit vector $\mathbf{u} = \langle 1/\sqrt{2},\ -1/\sqrt{2} \rangle$.'
            answer: '4sqrt(2)'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The gradient at $(3, 1)$ is $\langle 6, -2 \rangle$. The vector $\mathbf{u}$ is already a unit vector, so no division is needed. The dot product is $6/\sqrt{2} + 2/\sqrt{2} = 8/\sqrt{2} = 4\sqrt{2}$.'
          - problem: 'Find the directional derivative of $f(x, y, z) = xy + yz$ at $(1, 2, 3)$ in the direction of $\mathbf{v} = \langle 1, 2, 2 \rangle$.'
            answer: '14/3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The gradient is $\langle y,\ x + z,\ y \rangle = \langle 2, 4, 2 \rangle$ at $(1, 2, 3)$. The length of $\mathbf{v}$ is $3$, so $\mathbf{u} = \langle 1/3, 2/3, 2/3 \rangle$. Then $D_{\mathbf{u}} f = 2/3 + 8/3 + 4/3 = 14/3$.'
          - problem: 'Find the directional derivative of $f(x, y) = x^3 + y^2$ at $(1, -1)$ in the direction of $\mathbf{v} = \langle 4, 3 \rangle$.'
            answer: '6/5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The gradient is $\langle 3x^2, 2y \rangle = \langle 3, -2 \rangle$ at $(1, -1)$. The length of $\mathbf{v}$ is $5$, so $\mathbf{u} = \langle 4/5, 3/5 \rangle$. Then $D_{\mathbf{u}} f = 12/5 - 6/5 = 6/5$.'
          - problem: 'The temperature of a metal plate is $T(x, y) = x^2 y$ degrees Celsius at the point $(x, y)$, where $x$ and $y$ are measured in centimetres. A beetle at $(1, 2)$ crawls straight toward the point $(4, 6)$. At what rate, in degrees per centimetre, does the temperature it feels change as it starts out?'
            answer: '16/5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The beetle moves along $\mathbf{v} = \langle 4 - 1,\ 6 - 2 \rangle = \langle 3, 4 \rangle$, which has length $5$. The gradient $\langle 2xy, x^2 \rangle$ equals $\langle 4, 1 \rangle$ at $(1, 2)$. So the rate is $\langle 4, 1 \rangle \cdot \langle 3/5, 4/5 \rangle = 16/5$.'
          - problem: 'The height of a hillside is $h(x, y) = 2x^2 + y^2$ metres at the point $(x, y)$, where $x$ and $y$ are measured in metres. A hiker at $(2, 1)$ walks in the direction of $\mathbf{v} = \langle 5, 12 \rangle$. If the slope stays the same, how many horizontal metres must she walk to climb $32$ metres?'
            answer: '13/2'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'The gradient $\langle 4x, 2y \rangle$ equals $\langle 8, 2 \rangle$ at $(2, 1)$, and $\mathbf{u} = \langle 5/13, 12/13 \rangle$. The climb rate is $40/13 + 24/13 = 64/13$ metres per metre. To climb $32$ metres she walks $32 \div 64/13 = 13/2 = 6.5$ metres.'
          - problem: 'Sam computes the directional derivative of $f(x, y) = x^2 + y$ at $(1, 1)$ in the direction of $\mathbf{v} = \langle 3, 4 \rangle$ as $\nabla f \cdot \mathbf{v} = 10$. What is the correct value?'
            answer: '2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Sam used $\mathbf{v}$ directly, but its length is $5$, not $1$. The unit vector is $\mathbf{u} = \langle 3/5, 4/5 \rangle$ and $\nabla f(1, 1) = \langle 2, 1 \rangle$. So $D_{\mathbf{u}} f = 6/5 + 4/5 = 2$.'
        constraints: 'direction vectors are Pythagorean-triple multiples, points toward a given point, or unit diagonals; normalization is always part of the work when the length is not 1'
      - id: kp2
        name: "Steepest ascent and descent"
        key_prerequisites: [computing-the-gradient, dot-product]
        exemplars:
          - problem: 'A hill has height $h(x, y) = x^2 + 2y^2$ metres at the point $(x, y)$, where $x$ and $y$ are measured in metres. A hiker stands at $(3, 1)$. Find the unit vector that points in the direction of steepest ascent.'
            answer: '(3/sqrt(13), 2/sqrt(13))'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'The gradient $\langle 2x, 4y \rangle$ equals $\langle 6, 4 \rangle$ at $(3, 1)$ and points uphill most steeply. Its length is $\sqrt{52} = 2\sqrt{13}$. Dividing by it gives $\langle 3/\sqrt{13},\ 2/\sqrt{13} \rangle$.'
          - problem: 'The temperature of a metal plate is $T(x, y) = 2x^2 + y^2$ degrees Celsius at the point $(x, y)$. A probe sits at $(1, 2)$. Find the unit vector that points in the direction in which the temperature falls fastest.'
            answer: '(-1/sqrt(2), -1/sqrt(2))'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'The gradient $\langle 4x, 2y \rangle$ equals $\langle 4, 4 \rangle$ at $(1, 2)$. The temperature falls fastest opposite to the gradient, along $\langle -4, -4 \rangle$ with length $4\sqrt{2}$. The unit vector is $\langle -1/\sqrt{2},\ -1/\sqrt{2} \rangle$.'
          - problem: 'The depth of a lake is $d(x, y) = x^2 y$ metres at the point $(x, y)$, where $x$ and $y$ are measured in metres. A boat is at $(2, 2)$. What is the greatest rate, in metres of depth per metre travelled, at which the depth increases?'
            answer: '4sqrt(5)'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The greatest rate of increase equals the length of the gradient. The gradient $\langle 2xy, x^2 \rangle$ equals $\langle 8, 4 \rangle$ at $(2, 2)$. Its length is $\sqrt{80} = 4\sqrt{5}$.'
          - problem: 'Let $f(x, y, z) = x^2 + y^2 + z^2$ be the squared distance from the origin. A particle sits at $(1, 1, 2)$. Find the unit vector that points in the direction in which $f$ increases fastest.'
            answer: '(1/sqrt(6), 1/sqrt(6), 2/sqrt(6))'
            answer_contract: {"kind":"coordinates","arity":3}
            solution_sketch: 'The gradient $\langle 2x, 2y, 2z \rangle$ equals $\langle 2, 2, 4 \rangle$ at $(1, 1, 2)$. Its length is $\sqrt{24} = 2\sqrt{6}$. Dividing by the length gives $\langle 1/\sqrt{6},\ 1/\sqrt{6},\ 2/\sqrt{6} \rangle$.'
          - problem: 'The air pressure over a surface is $p(x, y) = xy$ units at the point $(x, y)$. A sensor is at $(1, 3)$. What is the rate of change of $p$ in the direction in which $p$ decreases fastest?'
            answer: '-sqrt(10)'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The gradient $\langle y, x \rangle$ equals $\langle 3, 1 \rangle$ at $(1, 3)$. The fastest decrease is opposite to the gradient, and the rate there is minus its length. The length is $\sqrt{9 + 1} = \sqrt{10}$, so the rate is $-\sqrt{10}$.'
          - problem: 'A saddle-shaped surface has height $h(x, y) = x^2 - y^2$. A marble is released at the point $(2, 1)$. Find the unit vector that points in the direction in which the marble starts to roll.'
            answer: '(-2/sqrt(5), 1/sqrt(5))'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'A marble rolls in the direction of steepest descent. The gradient $\langle 2x, -2y \rangle$ equals $\langle 4, -2 \rangle$ at $(2, 1)$, so the descent direction is $\langle -4, 2 \rangle$ with length $\sqrt{20} = 2\sqrt{5}$. The unit vector is $\langle -2/\sqrt{5},\ 1/\sqrt{5} \rangle$.'
          - problem: 'A snow mound has height $h(x, y) = 80 - \dfrac{x^2 + y^2}{10}$ metres at the point $(x, y)$, where $x$ and $y$ are measured in metres. A skier at $(6, 8)$ slides down along the direction of steepest descent. If the slope stays the same, how many horizontal metres must she slide to drop $30$ metres?'
            answer: '15'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'The gradient $\langle -x/5, -y/5 \rangle$ equals $\langle -6/5, -8/5 \rangle$ at $(6, 8)$. Its length is $2$, so she loses $2$ metres of height for each horizontal metre. To drop $30$ metres she slides $30 / 2 = 15$ metres.'
          - problem: 'The temperature of a plate is $T(x, y) = 3x^2 + y^2$ degrees Celsius. Mia says that at $(1, 2)$ the temperature falls fastest in the direction of the unit vector $\langle 3/\sqrt{13},\ 2/\sqrt{13} \rangle$. Which unit vector is correct?'
            answer: '(-3/sqrt(13), -2/sqrt(13))'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'The gradient $\langle 6x, 2y \rangle$ equals $\langle 6, 4 \rangle$ at $(1, 2)$, and its unit vector is $\langle 3/\sqrt{13},\ 2/\sqrt{13} \rangle$. That vector points toward the fastest increase, so Mia has the wrong sign. The fastest decrease is $\langle -3/\sqrt{13},\ -2/\sqrt{13} \rangle$.'
        constraints: 'gradient lengths simplify to k*sqrt(m) with small squarefree m; ascent or descent is always named in the question; contexts include hills, plates, lakes and slopes with a distance to find'
      - id: kp3
        name: "Extreme and zero values of the directional derivative"
        key_prerequisites: [computing-the-gradient, dot-product]
        try_first:
          problem: 'At a point $P$ the gradient of $f$ is $\langle 3, 4 \rangle$. Is there a direction in which $f$ increases at the rate $6$ per unit of distance?'
          answer_contract: {"kind":"label","options":[["yes","y","there is"],["no","n","there is no such direction","no direction","there is none"]]}
          answer: 'no'
          reveal: 'The rate in a direction is $|\nabla f| \cos\theta$, and $\cos\theta$ is never more than $1$. So no direction gives a rate above $|\nabla f| = 5$, and this lesson shows how to find the largest, smallest and zero rates.'
        exemplars:
          - problem: 'Let $f(x, y) = x^2 + y^2$. Find the largest possible value of the directional derivative of $f$ at the point $(1, 2)$.'
            answer: '2sqrt(5)'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The directional derivative is $|\nabla f| \cos\theta$, so its largest value is $|\nabla f|$. The gradient at $(1, 2)$ is $\langle 2, 4 \rangle$, with length $\sqrt{20}$. This equals $2\sqrt{5}$.'
          - problem: 'For $f(x, y) = xy^2$ there are exactly two unit vectors $\mathbf{u}$ with $D_{\mathbf{u}} f(2, 1) = 0$. Find the one with a positive first component.'
            answer: '(4/sqrt(17), -1/sqrt(17))'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'The gradient at $(2, 1)$ is $\langle 1, 4 \rangle$, and the directional derivative is $0$ when $\mathbf{u}$ is perpendicular to it. The vectors $\pm\langle 4, -1 \rangle$ are perpendicular to $\langle 1, 4 \rangle$ and have length $\sqrt{17}$. The one with positive first component is $\langle 4/\sqrt{17},\ -1/\sqrt{17} \rangle$.'
          - problem: 'At a vent, the temperature of a greenhouse increases fastest in one direction, at $5$ degrees Celsius per metre. A bee flies from the vent in that direction. If the rate stays the same, how many metres must it fly for the temperature to rise by $12$ degrees?'
            answer: '12/5'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'The fastest rate of increase is the length of the gradient, which is $5$ degrees per metre. The bee flies along the gradient, so the rate applies the whole way. To rise by $12$ degrees it flies $12 / 5 = 2.4$ metres.'
          - problem: 'The height of a hillside is $h(x, y) = x^3 - y^2$ metres at the point $(x, y)$, where $x$ and $y$ are measured in metres. A skier at $(1, 2)$ picks any horizontal direction. What is the smallest possible rate of change of height, in metres per metre?'
            answer: '-5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The smallest value of the directional derivative is $-|\nabla h|$. The gradient $\langle 3x^2, -2y \rangle$ equals $\langle 3, -4 \rangle$ at $(1, 2)$. Its length is $\sqrt{9 + 16} = 5$, so the smallest rate is $-5$.'
          - problem: 'At a point, the gradient of the temperature has length $8$ degrees Celsius per metre. A cyclist rides in a direction that makes an angle of $60^\circ$ with the gradient. At what rate, in degrees per metre, does the temperature change as she starts to ride?'
            answer: '4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'For a unit direction the rate is $|\nabla T| \cos\theta$. Here $|\nabla T| = 8$ and $\theta = 60^\circ$, so $\cos\theta = 1/2$. The rate is $8 \cdot 1/2 = 4$ degrees per metre.'
          - problem: 'The air temperature is $T(x, y) = x^2 + xy$ degrees Celsius at the point $(x, y)$, where $x$ and $y$ are measured in kilometres. A glider at $(2, 0)$ wants to fly in air of constant temperature, so it must start along a unit vector $\mathbf{u}$ with $D_{\mathbf{u}} T = 0$. Find that vector if it points east, that is, if its first component is positive.'
            answer: '(1/sqrt(5), -2/sqrt(5))'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'The gradient $\langle 2x + y, x \rangle$ equals $\langle 4, 2 \rangle$ at $(2, 0)$. A direction of no change is perpendicular to it, for example $\langle 1, -2 \rangle$, because $4 - 4 = 0$. Its length is $\sqrt{5}$, so the unit vector is $\langle 1/\sqrt{5},\ -2/\sqrt{5} \rangle$.'
          - problem: 'Let $f(x, y, z) = x^2 + y^2 + z^2$. Find the largest possible value of the directional derivative of $f$ at $(1, 1, 2)$.'
            answer: '2sqrt(6)'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The largest value equals the length of the gradient. The gradient at $(1, 1, 2)$ is $\langle 2, 2, 4 \rangle$. Its length is $\sqrt{4 + 4 + 16} = \sqrt{24} = 2\sqrt{6}$.'
          - problem: 'Ana says that the largest possible rate of change of $f(x, y) = x^2 + y^2$ at the point $(3, 4)$ is $14$, because the components of the gradient add up to $14$. What is the correct largest rate?'
            answer: '10'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The gradient at $(3, 4)$ is $\langle 6, 8 \rangle$. The largest rate is its length, not the sum of its components. The length is $\sqrt{36 + 64} = \sqrt{100} = 10$.'
        constraints: 'gradients with small integer components; zero-change directions are unit vectors with a stated sign condition; contexts include angle, distance and temperature problems'
    diagnostic_exemplar:
      problem: 'In which direction does $f(x, y) = x^2 y$ increase fastest at $(1, 2)$, and what is that maximal rate of increase?'
      answer: 'Direction $\frac{1}{\sqrt{17}}\langle 4, 1 \rangle$; maximal rate $\sqrt{17}$.'
      answer_contract: {kind: none}
      solution_sketch: '$\nabla f = \langle 2xy, x^2 \rangle$, so $\nabla f(1,2) = \langle 4, 1 \rangle$. The steepest ascent is along $\nabla f$, and the maximal directional derivative is $|\nabla f| = \sqrt{17}$.'
    anki_seeds:
      - front: 'Directional derivative of $f$ in the direction of unit vector $\mathbf{u}$?'
        back: '$D_{\mathbf{u}} f = \nabla f \cdot \mathbf{u}$ ($\mathbf{u}$ must be a unit vector).'
        type: basic
      - front: 'In which direction does $f$ increase fastest, and at what rate?'
        back: 'In the direction of $\nabla f$, at rate $|\nabla f|$.'
        type: basic
      - front: 'In which directions is the directional derivative zero?'
        back: 'Perpendicular to $\nabla f$ — along the level curve through the point.'
        type: basic

  - id: gradients-and-level-curves
    name: "Gradients and Level Curves"
    core: false                # geometric interpretation; feeds only tangent planes to level surfaces
    difficulty: 0.72
    drill: false
    answer_kind: numeric
    expected_time_secs: 150
    prerequisites:
      - id: computing-the-gradient
        weight: 0.7
        key: true
      - id: gradient-directional-derivatives
        weight: 0.4
        key: false
    knowledge_points:
      - id: kp1
        name: "Normal and tangent vectors to level curves"
        key_prerequisites: [computing-the-gradient]
        exemplars:
          - problem: 'The circle $x^2 + y^2 = 25$ is a level curve of $f(x, y) = x^2 + y^2$. Find $\nabla f(3, 4)$, which is a vector normal to the circle at $(3, 4)$.'
            answer: '(6, 8)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'The gradient of $f$ is $\langle 2x, 2y \rangle$. At $(3, 4)$ it equals $\langle 6, 8 \rangle$. The gradient is perpendicular to the level curve, so $\langle 6, 8 \rangle$ is normal to the circle.'
          - problem: 'Find the unit vector tangent to the curve $xy = 6$ at the point $(2, 3)$ that points in the direction of increasing $x$.'
            answer: '(2/sqrt(13), -3/sqrt(13))'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'The curve is a level curve of $f(x, y) = xy$, whose gradient at $(2, 3)$ is $\langle 3, 2 \rangle$. A tangent vector is perpendicular to the gradient, for example $\langle 2, -3 \rangle$, which has positive first component. Its length is $\sqrt{13}$, so the unit tangent is $\langle 2/\sqrt{13},\ -3/\sqrt{13} \rangle$.'
          - problem: 'Let $f(x, y) = x^2 + y^2$. The point $(5, 12)$ lies on the level curve $f = 169$. Find the gradient of $f$ at that point, a vector normal to the curve.'
            answer: '(10, 24)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'The partial derivatives are $f_x = 2x$ and $f_y = 2y$. At $(5, 12)$ they equal $10$ and $24$. Since a gradient is normal to its level curve, $\langle 10, 24 \rangle$ is normal to the curve at that point.'
          - problem: 'The parabola $y = x^2 + 1$ is the level curve $f = 1$ of $f(x, y) = y - x^2$. Find $\nabla f(2, 5)$, a vector normal to the parabola at $(2, 5)$.'
            answer: '(-4, 1)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'The partial derivatives are $f_x = -2x$ and $f_y = 1$. At $(2, 5)$ they equal $-4$ and $1$. So $\nabla f(2, 5) = \langle -4, 1 \rangle$ is normal to the parabola there.'
          - problem: 'The height of a hill is $h(x, y) = xy$ metres at the point $(x, y)$, where $x$ and $y$ are measured in metres. A hiker at $(3, 4)$ wants to walk along the contour line through that point, neither climbing nor descending, in the direction of increasing $x$. Find the unit vector of her direction.'
            answer: '(3/5, -4/5)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'A contour line is a level curve, so the hiker walks perpendicular to the gradient. The gradient $\langle y, x \rangle$ equals $\langle 4, 3 \rangle$ at $(3, 4)$, so a perpendicular vector is $\langle 3, -4 \rangle$ with length $5$. The unit vector is $\langle 3/5,\ -4/5 \rangle$.'
          - problem: 'A hill has height $h(x, y) = 100 - x^2 - y^2$ metres at the point $(x, y)$, where $x$ and $y$ are measured in metres. Rain water on the ground at $(3, 4)$ starts to run downhill at right angles to the contour line. Find the unit vector of the direction in which it runs.'
            answer: '(3/5, 4/5)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'Water runs in the direction of steepest descent, which is opposite to the gradient. The gradient $\langle -2x, -2y \rangle$ equals $\langle -6, -8 \rangle$ at $(3, 4)$, so the descent direction is $\langle 6, 8 \rangle$ with length $10$. The unit vector is $\langle 3/5,\ 4/5 \rangle$.'
          - problem: 'Sam says that the gradient of $f(x, y) = x^2 + 4y^2$ at $(2, 1)$ is tangent to the ellipse $x^2 + 4y^2 = 8$. Find the unit vector tangent to the ellipse at $(2, 1)$ that has a positive first component.'
            answer: '(2/sqrt(5), -1/sqrt(5))'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'The gradient is $\langle 4, 8 \rangle$, but a gradient is normal to its level curve, so Sam is wrong. A tangent vector is perpendicular to it, for example $\langle 2, -1 \rangle$, since $8 - 8 = 0$. Its length is $\sqrt{5}$, so the unit tangent is $\langle 2/\sqrt{5},\ -1/\sqrt{5} \rangle$.'
          - problem: 'The parabola $y = x^2 + 1$ passes through $(1, 2)$. Find a tangent vector to the parabola at that point whose first component is $1$.'
            answer: '(1, 2)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'The parabola is the level curve $f = 1$ of $f(x, y) = y - x^2$, and $\nabla f(1, 2) = \langle -2, 1 \rangle$. A tangent vector is perpendicular to this, and $\langle 1, 2 \rangle$ works because $-2 + 2 = 0$. The slope $2$ agrees with $dy/dx = 2x = 2$ at $x = 1$.'
        constraints: 'level curves are circles, hyperbolas xy = c, ellipses or parabolas; points have integer coordinates on the curve; unit normal or tangent vectors come with a sign condition'
      - id: kp2
        name: "Tangent lines to level curves"
        key_prerequisites: [computing-the-gradient]
        exemplars:
          - problem: 'Find an equation of the tangent line to the circle $x^2 + y^2 = 25$ at the point $(3, 4)$.'
            answer: '3x + 4y = 25'
            answer_contract: {"kind":"polynomial_relation"}
            solution_sketch: 'The circle is the level curve $f = 25$ of $f(x, y) = x^2 + y^2$, and $\nabla f(3, 4) = \langle 6, 8 \rangle$ is normal to it. The line through $(3, 4)$ with this normal is $6(x - 3) + 8(y - 4) = 0$. Dividing by $2$ and simplifying gives $3x + 4y = 25$.'
          - problem: 'Find an equation of the tangent line at $(2, 4)$ to the level curve of $f(x, y) = x^2 - y$ that passes through that point.'
            answer: '4x - y = 4'
            answer_contract: {"kind":"polynomial_relation"}
            solution_sketch: 'The gradient is $\langle 2x, -1 \rangle$, which equals $\langle 4, -1 \rangle$ at $(2, 4)$ and is normal to the level curve. The tangent line is $4(x - 2) - (y - 4) = 0$. Simplifying gives $4x - y = 4$.'
          - problem: 'The ellipse $x^2 + 4y^2 = 8$ passes through $(2, 1)$. Find the slope of its tangent line at that point.'
            answer: '-1/2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The ellipse is a level curve of $f(x, y) = x^2 + 4y^2$, and $\nabla f(2, 1) = \langle 4, 8 \rangle$ is normal to it. The tangent line has slope $-f_x / f_y = -4/8$. This reduces to $-1/2$.'
          - problem: 'A contour line of the height $h(x, y) = xy$ passes through the point $(3, 2)$. The tangent line to this contour at $(3, 2)$ crosses the $y$-axis. At what value of $y$ does it cross?'
            answer: '4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The gradient $\langle y, x \rangle$ equals $\langle 2, 3 \rangle$ at $(3, 2)$, so the tangent line is $2(x - 3) + 3(y - 2) = 0$, or $2x + 3y = 12$. On the $y$-axis $x = 0$, so $3y = 12$. This gives $y = 4$.'
          - problem: 'Find an equation of the tangent line at $(2, 1)$ to the level curve of $f(x, y) = x^3 - y^2$ through that point.'
            answer: '6x - y = 11'
            answer_contract: {"kind":"polynomial_relation"}
            solution_sketch: 'The gradient $\langle 3x^2, -2y \rangle$ equals $\langle 12, -2 \rangle$ at $(2, 1)$. The tangent line is $12(x - 2) - 2(y - 1) = 0$. Dividing by $2$ and simplifying gives $6x - y = 11$.'
          - problem: 'Find an equation of the tangent line at $(1, 2)$ to the level curve of $f(x, y) = x^2 + y^3$ through that point.'
            answer: 'x + 6y = 13'
            answer_contract: {"kind":"polynomial_relation"}
            solution_sketch: 'The gradient $\langle 2x, 3y^2 \rangle$ equals $\langle 2, 12 \rangle$ at $(1, 2)$. The tangent line is $2(x - 1) + 12(y - 2) = 0$. Dividing by $2$ and simplifying gives $x + 6y = 13$.'
          - problem: 'A hill has height $h(x, y) = x^2 + y^2$ metres at the point $(x, y)$, where $x$ and $y$ are measured in metres. A surveyor at $(5, 12)$ on the contour $h = 169$ walks along the straight tangent line to this contour until she reaches the $x$-axis. What is the $x$-coordinate of that point?'
            answer: '169/5'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'The gradient $\langle 2x, 2y \rangle$ equals $\langle 10, 24 \rangle$ at $(5, 12)$, so the tangent line is $5x + 12y = 169$. On the $x$-axis $y = 0$, so $5x = 169$. Dividing gives $x = 169/5 = 33.8$ metres.'
          - problem: 'A circular lake has the shore $x^2 + y^2 = 100$, where $x$ and $y$ are measured in metres. A straight path leaves the shore at $(6, 8)$ and touches the lake only at that point. Find an equation of the line along which the path runs.'
            answer: '3x + 4y = 50'
            answer_contract: {"kind":"polynomial_relation"}
            solution_sketch: 'The gradient of $f(x, y) = x^2 + y^2$ at $(6, 8)$ is $\langle 12, 16 \rangle$, which is normal to the shore. The line is $12(x - 6) + 16(y - 8) = 0$. Dividing by $4$ and simplifying gives $3x + 4y = 50$.'
        constraints: 'normal vectors have small integer components; tangent lines simplify to integer-coefficient equations; slope and intercept questions solve linearly'
      - id: kp3
        name: "Reading contour maps"
        key_prerequisites: [computing-the-gradient, gradient-directional-derivatives]
        exemplars:
          - problem: 'On a contour map the lines are drawn every $10$ metres of height. Near a point $A$, two neighbouring lines are $40$ metres apart horizontally. Estimate the slope of the hill at $A$, in metres of height per horizontal metre.'
            answer: '1/4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Between two neighbouring lines the height changes by $10$ metres over a horizontal distance of $40$ metres. The slope is the change divided by the distance. So the slope is $10 / 40 = 1/4$.'
          - problem: 'On a contour map of another hill the lines are drawn every $20$ metres of height. Near a point $A$ neighbouring lines are $50$ metres apart, and near a point $B$ they are $30$ metres apart. At which of the two points is the hill steeper?'
            answer: 'B'
            answer_contract: {"kind":"label","options":[["B","point B","at B","at point B","it is steeper at B","steeper at B","B is steeper"],["A","point A","at A","at point A","it is steeper at A","steeper at A","A is steeper"]]}
            solution_sketch: 'The height changes by the same $20$ metres between neighbouring lines at both points. The lines are closer at $B$, so the same change happens over a shorter distance. The slope at $B$ is $20/30$, which is greater than $20/50$ at $A$, so $B$ is steeper.'
          - problem: 'On a map of the temperature in a lake, neighbouring contour lines are $5$ degrees Celsius apart. A boat sails $200$ metres in a straight line directly across the contour lines, from the $10$ degree line to the $30$ degree line. Estimate the average rate of change of temperature along the course, in degrees per metre.'
            answer: '1/10'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The temperature changes by $30 - 10 = 20$ degrees over $200$ metres. The average rate is the change divided by the distance. So the rate is $20 / 200 = 1/10$ degree per metre.'
          - problem: 'The steepest slope of a hill at a point $P$ is $0.25$ metres of height per horizontal metre. A hiker walks $120$ horizontal metres straight uphill from $P$ and the slope stays the same. How many metres of height does she gain?'
            answer: '30'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'A slope of $0.25$ means $0.25$ metres of height for each horizontal metre. Over $120$ horizontal metres she gains $0.25 \cdot 120$ metres. This equals $30$ metres.'
          - problem: 'The height of a hill is $h(x, y) = x^2 + y^2$ metres. On its contour map the contour $h = 100$ is a circle of radius $10$ and the contour $h = 121$ is a circle of radius $11$, so along the $x$-axis they are $1$ metre apart. Estimate the slope of the hill between them, in metres of height per horizontal metre.'
            answer: '21'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The height changes by $121 - 100 = 21$ metres between the two contours. They are $11 - 10 = 1$ metre apart horizontally. The slope is $21 / 1 = 21$ metres per metre.'
          - problem: 'On a hillside the contour lines are drawn every $20$ metres of height, and the slope between neighbouring lines is $0.4$. A path climbs straight uphill from the $100$ metre line to the $160$ metre line. How long is the path measured horizontally?'
            answer: '150'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'The path climbs $160 - 100 = 60$ metres of height. A slope of $0.4$ means $0.4$ metres of height for each horizontal metre. The horizontal length is $60 / 0.4 = 150$ metres.'
          - problem: 'Near a point $P$ the contour lines of $f$ run from east to west, and $f$ increases toward the north. In which direction does $\nabla f(P)$ point?'
            answer: 'north'
            answer_contract: {"kind":"label","options":[["north","n","toward the north","towards the north","northward","due north","it points north","it points toward the north"],["south","s","toward the south","towards the south","southward","due south","it points south","it points toward the south"],["east","e","toward the east","towards the east","eastward","due east","it points east","it points toward the east"],["west","w","toward the west","towards the west","westward","due west","it points west","it points toward the west"]]}
            solution_sketch: 'The gradient is perpendicular to the contour lines, so it points north or south. It points toward increasing values of $f$. Since $f$ increases toward the north, the gradient points north.'
          - problem: 'On a contour map of $f$ the lines are drawn every $3$ units of $f$. Near a point $P$ neighboring lines are $0.5$ metres apart, and near a point $Q$ they are $2$ metres apart. How many times larger is $|\nabla f(P)|$ than $|\nabla f(Q)|$?'
            answer: '4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Near each point $|\nabla f|$ is about the step divided by the distance between lines. At $P$ it is $3/0.5 = 6$ and at $Q$ it is $3/2 = 1.5$. So the ratio is $6/1.5 = 4$.'
        constraints: 'contour maps with a stated step in height or temperature; slopes come from step divided by distance; direction questions name compass directions'
    diagnostic_exemplar:
      problem: 'Use the gradient to find the tangent line to the level curve of $f(x, y) = x^2 - xy$ through the point $(3, 1)$.'
      answer: '$5x - 3y = 12$'
      answer_contract: {kind: none}
      solution_sketch: '$\nabla f = \langle 2x - y, -x \rangle$, so $\nabla f(3,1) = \langle 5, -3 \rangle$ is normal to the level curve $f = 6$ there. The tangent line is $5(x - 3) - 3(y - 1) = 0$, i.e. $5x - 3y = 12$.'
    anki_seeds:
      - front: 'Geometric relation between $\nabla f$ and the level curve of $f$ through a point?'
        back: '$\nabla f$ is perpendicular (normal) to the level curve, pointing toward increasing $f$.'
        type: basic
      - front: 'What do closely spaced contour lines indicate about $|\nabla f|$?'
        back: 'A large $|\nabla f|$ — the function changes rapidly there.'
        type: basic

  - id: tangent-planes-level-surfaces
    name: "Tangent Planes to Level Surfaces"
    core: false                # geometric application of the gradient; terminal
    difficulty: 0.78
    drill: false
    answer_kind: numeric
    expected_time_secs: 180
    prerequisites:
      - id: gradients-and-level-curves
        weight: 0.7
        key: true
      - id: computing-the-gradient
        weight: 0.5
        key: true
      - id: lines-planes-space
        weight: 0.4
        key: false
    knowledge_points:
      - id: kp1
        name: "Normal vectors to surfaces via the gradient"
        key_prerequisites: [computing-the-gradient, gradients-and-level-curves]
        exemplars:
          - problem: 'The sphere $x^2 + y^2 + z^2 = 21$ is the level surface $F = 21$ of $F(x, y, z) = x^2 + y^2 + z^2$. Find $\nabla F(2, 1, 4)$, a vector normal to the sphere at the point $(2, 1, 4)$.'
            answer: '(4, 2, 8)'
            answer_contract: {"kind":"coordinates","arity":3}
            solution_sketch: 'The partial derivatives of $F$ are $2x$, $2y$ and $2z$. At $(2, 1, 4)$ they equal $4$, $2$ and $8$. A gradient is normal to its level surface, so $\langle 4, 2, 8 \rangle$ is normal to the sphere.'
          - problem: 'The surface $z = x^2 + 2y^2$ passes through $(1, 2, 9)$. Write it as the level surface $F = 0$ of $F(x, y, z) = x^2 + 2y^2 - z$, and find the normal vector $\nabla F(1, 2, 9)$.'
            answer: '(2, 8, -1)'
            answer_contract: {"kind":"coordinates","arity":3}
            solution_sketch: 'The partial derivatives are $F_x = 2x$, $F_y = 4y$ and $F_z = -1$. At $(1, 2, 9)$ they equal $2$, $8$ and $-1$. So the normal vector is $\langle 2, 8, -1 \rangle$.'
          - problem: 'The ellipsoid $x^2 + 4y^2 + z^2 = 21$ contains the point $(1, 2, 2)$. Find a vector normal to it at that point by taking the gradient of $F(x, y, z) = x^2 + 4y^2 + z^2$.'
            answer: '(2, 16, 4)'
            answer_contract: {"kind":"coordinates","arity":3}
            solution_sketch: 'The partial derivatives are $F_x = 2x$, $F_y = 8y$ and $F_z = 2z$. At $(1, 2, 2)$ they equal $2$, $16$ and $4$. So $\nabla F(1, 2, 2) = \langle 2, 16, 4 \rangle$ is normal to the ellipsoid.'
          - problem: 'The hyperboloid $x^2 + y^2 - z^2 = 4$ contains the point $(3, 2, 3)$. Find $\nabla F(3, 2, 3)$ for $F(x, y, z) = x^2 + y^2 - z^2$, a vector normal to the surface there.'
            answer: '(6, 4, -6)'
            answer_contract: {"kind":"coordinates","arity":3}
            solution_sketch: 'The partial derivatives are $F_x = 2x$, $F_y = 2y$ and $F_z = -2z$. At $(3, 2, 3)$ they equal $6$, $4$ and $-6$. So the normal vector is $\langle 6, 4, -6 \rangle$.'
          - problem: 'A roof is modelled by the surface $z = 6 - x^2 - y^2$, where all distances are measured in metres. Find the unit vector normal to the roof at the point $(1, 1, 4)$ that points upward.'
            answer: '(2/3, 2/3, 1/3)'
            answer_contract: {"kind":"coordinates","arity":3}
            solution_sketch: 'Write the roof as $F(x, y, z) = x^2 + y^2 + z - 6 = 0$. Then $\nabla F = \langle 2x, 2y, 1 \rangle$, which equals $\langle 2, 2, 1 \rangle$ at $(1, 1, 4)$ and points upward. Its length is $3$, so the unit normal is $\langle 2/3,\ 2/3,\ 1/3 \rangle$.'
          - problem: 'A spherical tank has the surface $x^2 + y^2 + z^2 = 21$, where distances are measured in metres. Find the unit vector normal to the tank at the point $(2, 1, 4)$ that points out of the tank.'
            answer: '(2/sqrt(21), 1/sqrt(21), 4/sqrt(21))'
            answer_contract: {"kind":"coordinates","arity":3}
            solution_sketch: 'The gradient of $x^2 + y^2 + z^2$ at $(2, 1, 4)$ is $\langle 4, 2, 8 \rangle$, which points away from the centre. Its length is $\sqrt{16 + 4 + 64} = \sqrt{84} = 2\sqrt{21}$. Dividing by it gives $\langle 2/\sqrt{21},\ 1/\sqrt{21},\ 4/\sqrt{21} \rangle$.'
          - problem: 'The surface $z = 3x^2 + y^2$ passes through $(1, 1, 4)$. Write it as the level surface $F = 0$ of $F(x, y, z) = 3x^2 + y^2 - z$, and find the normal vector $\nabla F(1, 1, 4)$.'
            answer: '(6, 2, -1)'
            answer_contract: {"kind":"coordinates","arity":3}
            solution_sketch: 'The partial derivatives are $F_x = 6x$, $F_y = 2y$ and $F_z = -1$. At $(1, 1, 4)$ they equal $6$, $2$ and $-1$. So the normal vector is $\langle 6, 2, -1 \rangle$.'
          - problem: 'Sam writes the surface $z = x^2 - y^2$ as $F(x, y, z) = x^2 - y^2 - z = 0$ and finds the normal vector $\nabla F(2, 1, 3) = \langle 4, -2, 1 \rangle$. What is the correct value of $\nabla F(2, 1, 3)$?'
            answer: '(4, -2, -1)'
            answer_contract: {"kind":"coordinates","arity":3}
            solution_sketch: 'Sam has the right first two components, but the term $-z$ has derivative $-1$, not $1$. So $F_z = -1$. The correct gradient is $\nabla F(2, 1, 3) = \langle 4, -2, -1 \rangle$, since $F_x = 2x = 4$ and $F_y = -2y = -2$.'
        constraints: 'quadric surfaces with integer points; graphs z = f(x,y) rewritten as F = f - z = 0; unit normals with an upward or outward condition'
      - id: kp2
        name: "Tangent planes to level surfaces"
        key_prerequisites: [computing-the-gradient, gradients-and-level-curves, lines-planes-space]
        exemplars:
          - problem: 'Find an equation of the tangent plane to the sphere $x^2 + y^2 + z^2 = 21$ at the point $(1, 2, 4)$.'
            answer: 'x + 2y + 4z = 21'
            answer_contract: {"kind":"polynomial_relation"}
            solution_sketch: 'The gradient of $F = x^2 + y^2 + z^2$ at $(1, 2, 4)$ is $\langle 2, 4, 8 \rangle$, which is normal to the sphere. The plane is $2(x - 1) + 4(y - 2) + 8(z - 4) = 0$. Dividing by $2$ and simplifying gives $x + 2y + 4z = 21$.'
          - problem: 'Find an equation of the tangent plane to the surface $x^2 - y^2 + z^2 = 12$ at the point $(3, 1, 2)$.'
            answer: '3x - y + 2z = 12'
            answer_contract: {"kind":"polynomial_relation"}
            solution_sketch: 'The gradient is $\langle 2x, -2y, 2z \rangle$, which equals $\langle 6, -2, 4 \rangle$ at $(3, 1, 2)$. The plane is $6(x - 3) - 2(y - 1) + 4(z - 2) = 0$. Dividing by $2$ and simplifying gives $3x - y + 2z = 12$.'
          - problem: 'Find an equation of the tangent plane to the ellipsoid $2x^2 + 3y^2 + z^2 = 23$ at the point $(1, 2, 3)$.'
            answer: '2x + 6y + 3z = 23'
            answer_contract: {"kind":"polynomial_relation"}
            solution_sketch: 'The gradient is $\langle 4x, 6y, 2z \rangle$, which equals $\langle 4, 12, 6 \rangle$ at $(1, 2, 3)$. The plane is $4(x - 1) + 12(y - 2) + 6(z - 3) = 0$. Dividing by $2$ and simplifying gives $2x + 6y + 3z = 23$.'
          - problem: 'Find an equation of the tangent plane to the paraboloid $z = x^2 + y^2$ at the point $(1, 2, 5)$.'
            answer: '2x + 4y - z = 5'
            answer_contract: {"kind":"polynomial_relation"}
            solution_sketch: 'Write the paraboloid as $F = x^2 + y^2 - z = 0$, so $\nabla F = \langle 2x, 2y, -1 \rangle = \langle 2, 4, -1 \rangle$ at $(1, 2, 5)$. The plane is $2(x - 1) + 4(y - 2) - (z - 5) = 0$. Simplifying gives $2x + 4y - z = 5$.'
          - problem: 'The point $(3, 4, z)$ lies on the sphere $x^2 + y^2 + z^2 = 50$ and has $z > 0$. Find an equation of the tangent plane to the sphere at that point.'
            answer: '3x + 4y + 5z = 50'
            answer_contract: {"kind":"polynomial_relation"}
            solution_sketch: 'First $9 + 16 + z^2 = 50$ gives $z^2 = 25$, so $z = 5$. The gradient at $(3, 4, 5)$ is $\langle 6, 8, 10 \rangle$, so the plane is $6(x - 3) + 8(y - 4) + 10(z - 5) = 0$. Dividing by $2$ and simplifying gives $3x + 4y + 5z = 50$.'
          - problem: 'Find an equation of the tangent plane to the hyperboloid $x^2 + y^2 - z^2 = 4$ at the point $(3, 2, 3)$.'
            answer: '3x + 2y - 3z = 4'
            answer_contract: {"kind":"polynomial_relation"}
            solution_sketch: 'The gradient is $\langle 2x, 2y, -2z \rangle$, which equals $\langle 6, 4, -6 \rangle$ at $(3, 2, 3)$. The plane is $6(x - 3) + 4(y - 2) - 6(z - 3) = 0$. Dividing by $2$ and simplifying gives $3x + 2y - 3z = 4$.'
          - problem: 'A dome has the shape of the part of the sphere $x^2 + y^2 + z^2 = 49$ with $z > 0$, where distances are measured in metres. A flat panel touches the dome at the point $(2, 3, 6)$. Find an equation of the plane that contains the panel.'
            answer: '2x + 3y + 6z = 49'
            answer_contract: {"kind":"polynomial_relation"}
            solution_sketch: 'The gradient of $x^2 + y^2 + z^2$ at $(2, 3, 6)$ is $\langle 4, 6, 12 \rangle$, which is normal to the dome. The plane is $4(x - 2) + 6(y - 3) + 12(z - 6) = 0$. Dividing by $2$ and simplifying gives $2x + 3y + 6z = 49$.'
          - problem: 'A flat panel touches the dome $x^2 + y^2 + z^2 = 49$ at the point $(2, 3, 6)$, where distances are measured in metres. At what height does the plane of the panel cross the $z$-axis?'
            answer: '49/6'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'The plane of the panel is $2x + 3y + 6z = 49$. On the $z$-axis $x = 0$ and $y = 0$, so $6z = 49$. Dividing gives $z = 49/6$, which is about $8.17$ metres.'
        constraints: 'spheres and quadrics through integer points; plane equations simplify to integer coefficients; intercept questions solve linearly'
      - id: kp3
        name: "Normal lines"
        key_prerequisites: [computing-the-gradient, lines-planes-space]
        exemplars:
          - problem: 'The normal line to the sphere $x^2 + y^2 + z^2 = 6$ at the point $(1, 1, 2)$ has the direction of $\nabla F(1, 1, 2)$, where $F(x, y, z) = x^2 + y^2 + z^2$. Find that vector.'
            answer: '(2, 2, 4)'
            answer_contract: {"kind":"coordinates","arity":3}
            solution_sketch: 'The partial derivatives of $F$ are $2x$, $2y$ and $2z$. At $(1, 1, 2)$ they equal $2$, $2$ and $4$. The normal line has the direction of the gradient, so the vector is $\langle 2, 2, 4 \rangle$.'
          - problem: 'The normal line to the sphere $x^2 + y^2 + z^2 = 25$ at the point $(0, 0, 5)$ meets the $xy$-plane at a point. Find that point.'
            answer: '(0, 0, 0)'
            answer_contract: {"kind":"coordinates","arity":3}
            solution_sketch: 'The gradient at $(0, 0, 5)$ is $\langle 0, 0, 10 \rangle$, so the normal line is $(0, 0, 5 + 10t)$. It meets the $xy$-plane where $5 + 10t = 0$, that is $t = -1/2$. This gives the point $(0, 0, 0)$, the centre of the sphere.'
          - problem: 'The paraboloid $z = x^2 + y^2$ passes through $(1, 2, 5)$. With $F(x, y, z) = x^2 + y^2 - z$, find the vector $\nabla F(1, 2, 5)$, which gives the direction of the normal line at that point.'
            answer: '(2, 4, -1)'
            answer_contract: {"kind":"coordinates","arity":3}
            solution_sketch: 'The partial derivatives are $F_x = 2x$, $F_y = 2y$ and $F_z = -1$. At $(1, 2, 5)$ they equal $2$, $4$ and $-1$. So the direction of the normal line is $\langle 2, 4, -1 \rangle$.'
          - problem: 'The paraboloid $z = x^2 + y^2$ passes through $(1, 3, 10)$. The normal line to the paraboloid at that point meets the $xy$-plane at a point. Find that point.'
            answer: '(21, 63, 0)'
            answer_contract: {"kind":"coordinates","arity":3}
            solution_sketch: 'With $F = x^2 + y^2 - z$ the gradient at $(1, 3, 10)$ is $\langle 2, 6, -1 \rangle$, so the line is $(1 + 2t,\ 3 + 6t,\ 10 - t)$. It meets the $xy$-plane when $10 - t = 0$, so $t = 10$. This gives the point $(21, 63, 0)$.'
          - problem: 'The normal line to the ellipsoid $x^2 + 4y^2 + z^2 = 21$ at the point $(1, 2, 2)$ meets the plane $x = 0$ at a point. Find that point.'
            answer: '(0, -6, 0)'
            answer_contract: {"kind":"coordinates","arity":3}
            solution_sketch: 'The gradient at $(1, 2, 2)$ is $\langle 2, 16, 4 \rangle$, so the line is $(1 + 2t,\ 2 + 16t,\ 2 + 4t)$. It meets the plane $x = 0$ when $1 + 2t = 0$, so $t = -1/2$. This gives the point $(0, -6, 0)$.'
          - problem: 'The cone $x^2 + y^2 = z^2$ passes through $(3, 4, 5)$. With $F(x, y, z) = x^2 + y^2 - z^2$, find the vector $\nabla F(3, 4, 5)$, which gives the direction of the normal line at that point.'
            answer: '(6, 8, -10)'
            answer_contract: {"kind":"coordinates","arity":3}
            solution_sketch: 'The partial derivatives are $F_x = 2x$, $F_y = 2y$ and $F_z = -2z$. At $(3, 4, 5)$ they equal $6$, $8$ and $-10$. So the direction of the normal line is $\langle 6, 8, -10 \rangle$.'
          - problem: 'A laser beam leaves the surface $x^2 + 4y^2 + z^2 = 21$ at the point $(1, 2, 2)$ and travels outward along the normal line, where $x$ increases. At what point does the beam reach the plane $x = 3$?'
            answer: '(3, 18, 6)'
            answer_contract: {"kind":"coordinates","arity":3}
            solution_sketch: 'The gradient at $(1, 2, 2)$ is $\langle 2, 16, 4 \rangle$ and points outward, so the beam is $(1 + 2t,\ 2 + 16t,\ 2 + 4t)$ with $t > 0$. It reaches $x = 3$ when $1 + 2t = 3$, so $t = 1$. This gives the point $(3, 18, 6)$.'
          - problem: 'A hill has the surface $z = 10 - x^2 - y^2$, where distances are measured in metres and $z$ is the height above sea level. A drill is pushed into the hill at the point $(1, 2, 5)$ along the normal line, going downward into the ground. At what point does the drill reach sea level, $z = 0$?'
            answer: '(-9, -18, 0)'
            answer_contract: {"kind":"coordinates","arity":3}
            solution_sketch: 'Write the hill as $F = x^2 + y^2 + z - 10 = 0$, so the gradient at $(1, 2, 5)$ is $\langle 2, 4, 1 \rangle$, which points up. Going down means the line is $(1 - 2s,\ 2 - 4s,\ 5 - s)$. It reaches $z = 0$ when $s = 5$, which gives the point $(-9, -18, 0)$.'
          - problem: 'The normal line to the paraboloid $z = x^2 + y^2$ at the point $P_0 = (1, 2, 5)$ is the line $P(t) = P_0 + t\,\nabla F(P_0)$, where $F(x, y, z) = x^2 + y^2 - z$. Find $P(t)$.'
            answer: '(1 + 2t, 2 + 4t, 5 - t)'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The gradient is $\nabla F = \langle 2x, 2y, -1 \rangle$, which equals $\langle 2, 4, -1 \rangle$ at $(1, 2, 5)$. Adding $t$ times this vector to $P_0$ gives each coordinate in turn. So $P(t) = (1 + 2t,\ 2 + 4t,\ 5 - t)$.'
          - problem: 'The normal line to the ellipsoid $x^2 + 4y^2 + z^2 = 21$ at the point $P_0 = (1, 2, 2)$ is the line $P(t) = P_0 + t\,\nabla F(P_0)$, where $F(x, y, z) = x^2 + 4y^2 + z^2$. Find $P(t)$.'
            answer: '(1 + 2t, 2 + 16t, 2 + 4t)'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The gradient is $\nabla F = \langle 2x, 8y, 2z \rangle$, which equals $\langle 2, 16, 4 \rangle$ at $(1, 2, 2)$. Adding $t$ times this vector to $P_0$ gives each coordinate in turn. So $P(t) = (1 + 2t,\ 2 + 16t,\ 2 + 4t)$.'
        constraints: 'direction vectors are gradients with integer components; intersection questions with a coordinate plane solve linearly in t and give a point'
    diagnostic_exemplar:
      problem: 'Find parametric equations for the normal line to the surface $x^2 + y^2 + z^2 = 9$ at $(2, 2, 1)$.'
      answer: '$x = 2 + 2t,\; y = 2 + 2t,\; z = 1 + t$'
      answer_contract: {kind: none}
      solution_sketch: '$\nabla F = \langle 2x, 2y, 2z \rangle$ gives $\langle 4, 4, 2 \rangle \parallel \langle 2, 2, 1 \rangle$ at the point; the normal line runs through $(2,2,1)$ in that direction.'
    anki_seeds:
      - front: 'Tangent plane to the level surface $F(x,y,z) = c$ at point $P$?'
        back: '$\nabla F(P) \cdot (\mathbf{r} - P) = 0$ — the plane through $P$ with normal $\nabla F(P)$.'
        type: basic
      - front: 'How do you treat the graph $z = f(x, y)$ as a level surface?'
        back: 'Set $F(x,y,z) = f(x,y) - z$; the graph is the level surface $F = 0$ with normal $\langle f_x, f_y, -1 \rangle$.'
        type: basic

  - id: multivariable-critical-points
    name: "Critical Points of Multivariable Functions"
    core: true
    difficulty: 0.72
    drill: false
    answer_kind: numeric
    expected_time_secs: 150
    prerequisites:
      - id: computing-the-gradient
        weight: 0.7
        key: true
      - id: systems-substitution
        weight: 0.4
        key: false
      - id: partial-derivatives
        weight: 0.4
        key: false
    knowledge_points:
      - id: kp1
        name: "The definition and simple critical points"
        key_prerequisites: [computing-the-gradient]
        exemplars:
          - problem: 'Find the critical point of $f(x, y) = x^2 + y^2 - 4x + 6y$.'
            answer: '(2, -3)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'The partial derivatives are $f_x = 2x - 4$ and $f_y = 2y + 6$. At a critical point both are zero, so $2x - 4 = 0$ and $2y + 6 = 0$. These give $x = 2$ and $y = -3$, and the critical point is $(2, -3)$.'
          - problem: 'The gradient of $f(x, y) = xy - 3x + 5y$ is zero at exactly one point. Find that point.'
            answer: '(-5, 3)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'Here $f_x = y - 3$ and $f_y = x + 5$. The gradient is zero when both vanish, so $y = 3$ and $x = -5$. The point is $(-5, 3)$.'
          - problem: 'The temperature at the point $(x, y)$ of a metal plate is $T(x, y) = x^2 + 2y^2 - 6x + 8y + 40$ degrees Celsius, where $x$ and $y$ are in centimetres. Find the critical point of $T$.'
            answer: '(3, -2)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'The partial derivatives are $T_x = 2x - 6$ and $T_y = 4y + 8$. Setting each one to zero gives $x = 3$ and $y = -2$. The critical point is $(3, -2)$.'
          - problem: 'The height of a hill is $h(x, y) = 100 + 2xy - 10x + 8y$ metres. At which point do both slopes $h_x$ and $h_y$ of the ground equal zero?'
            answer: '(-4, 5)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'The slopes are $h_x = 2y - 10$ and $h_y = 2x + 8$. Setting $2y - 10 = 0$ gives $y = 5$, and setting $2x + 8 = 0$ gives $x = -4$. The point is $(-4, 5)$.'
          - problem: 'Sam looks for the critical point of $f(x, y) = xy - 6x + 2y$. He solves $f_x = y - 6 = 0$, gets $y = 6$ and stops. What is the critical point of $f$?'
            answer: '(-2, 6)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'Sam used only $f_x$. The second condition is $f_y = x + 2 = 0$, which gives $x = -2$. Together with $y = 6$ the critical point is $(-2, 6)$.'
          - problem: 'Find the critical point of $f(x, y, z) = x^2 + y^2 + z^2 - 2x + 4y - 6z$.'
            answer: '(1, -2, 3)'
            answer_contract: {"kind": "coordinates", "arity": 3}
            solution_sketch: 'With three variables all three partial derivatives must vanish: $f_x = 2x - 2$, $f_y = 2y + 4$ and $f_z = 2z - 6$. Solving gives $x = 1$, $y = -2$ and $z = 3$. The critical point is $(1, -2, 3)$.'
          - problem: 'Is $(1, 2)$ a critical point of $f(x, y) = x^2 + y^2 - 2x - 4y$?'
            answer: 'yes'
            answer_contract: {"kind": "label", "options": [["yes", "it is", "it is a critical point"], ["no", "it is not", "it is not a critical point"]]}
            solution_sketch: 'The partial derivatives are $f_x = 2x - 2$ and $f_y = 2y - 4$. At $(1, 2)$ both equal $0$, so the gradient is zero. The point is a critical point.'
          - problem: 'Is $(2, 3)$ a critical point of $f(x, y) = x^2 y - 12x$?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "it is", "it is a critical point"], ["no", "it is not", "it is not a critical point"]]}
            solution_sketch: 'The partial derivatives are $f_x = 2xy - 12$ and $f_y = x^2$. At $(2, 3)$ we get $f_x = 0$ but $f_y = 4$, which is not zero. Both partial derivatives must vanish, so the point is not a critical point.'
          - problem: 'For $f(x, y) = x^2 + y^2 - 6x + by$, the point $(3, -2)$ is the critical point. Find $b$.'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The partial derivative in $y$ is $f_y = 2y + b$. At the critical point $y = -2$ it must be zero, so $-4 + b = 0$. Hence $b = 4$.'
        constraints: "grad f = 0 solves immediately, one equation per variable; single critical point; contexts of temperature and height; points in the plane or in space"
      - id: kp2
        name: "Critical points of quadratic functions"
        key_prerequisites: [computing-the-gradient, systems-substitution]
        exemplars:
          - problem: 'Find the critical point of $f(x, y) = x^2 + 2y^2 - 4x + 4y$.'
            answer: '(2, -1)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'The partial derivatives are $f_x = 2x - 4$ and $f_y = 4y + 4$. Each equation has one unknown: $2x - 4 = 0$ gives $x = 2$ and $4y + 4 = 0$ gives $y = -1$. The critical point is $(2, -1)$.'
          - problem: 'Find the value of $f(x, y) = 2x^2 + 3y^2 + 8x - 12y + 5$ at its critical point.'
            answer: '-15'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'From $f_x = 4x + 8 = 0$ we get $x = -2$, and from $f_y = 6y - 12 = 0$ we get $y = 2$. Then $f(-2, 2) = 8 + 12 - 16 - 24 + 5 = -15$. The value at the critical point is $-15$.'
          - problem: 'A factory makes $x$ chairs and $y$ tables a day. Its daily cost in dollars is $C(x, y) = 2x^2 + y^2 - 80x - 60y + 3000$. Find the critical point of $C$.'
            answer: '(20, 30)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'The partial derivatives are $C_x = 4x - 80$ and $C_y = 2y - 60$. Setting each to zero and dividing gives $x = 80/4 = 20$ and $y = 60/2 = 30$. The critical point is $(20, 30)$.'
          - problem: 'Find the critical point of $f(x, y) = 4x^2 + 5y^2 - 24x + 10y + 3$.'
            answer: '(3, -1)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'The partial derivatives are $f_x = 8x - 24$ and $f_y = 10y + 10$. Then $8x - 24 = 0$ gives $x = 3$ and $10y + 10 = 0$ gives $y = -1$. The critical point is $(3, -1)$.'
          - problem: 'A valley floor has height $h(x, y) = \frac{x^2}{4} + \frac{y^2}{2} - 3x + 4y + 50$ metres. Find the height of the ground at the point where both slopes $h_x$ and $h_y$ are zero.'
            answer: '33'
            answer_contract: {"kind": "unit", "quantity": "length", "unit": "m", "allow_omitted": true}
            solution_sketch: 'The slopes are $h_x = x/2 - 3$ and $h_y = y + 4$, which vanish at $x = 6$ and $y = -4$. Then $h(6, -4) = 9 + 8 - 18 - 16 + 50 = 33$. The ground is 33 metres high at that point.'
          - problem: 'Maya differentiates $f(x, y) = x^2 + 5y^2 - 10x + 20y + 7$ and solves $f_y = 10y + 20 = 0$ to get $y = 2$. What is the correct critical point of $f$?'
            answer: '(5, -2)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'Maya made a sign error: $10y + 20 = 0$ gives $y = -2$, not $2$. The other condition is $f_x = 2x - 10 = 0$, so $x = 5$. The critical point is $(5, -2)$.'
          - problem: 'Find the value of $f(x, y) = 3x^2 + y^2 - 18x + 4y + 20$ at its critical point.'
            answer: '-11'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'From $f_x = 6x - 18 = 0$ we get $x = 3$, and from $f_y = 2y + 4 = 0$ we get $y = -2$. Then $f(3, -2) = 27 + 4 - 54 - 8 + 20 = -11$. The value is $-11$.'
          - problem: 'A shop earns a weekly profit of $P(x, y) = 90x + 48y - 3x^2 - 2y^2$ dollars from selling $x$ coats and $y$ scarves. Find the profit at the critical point of $P$.'
            answer: '963'
            answer_contract: {"kind": "unit", "quantity": "dollar", "unit": "dollar", "allow_omitted": true}
            solution_sketch: 'The partial derivatives are $P_x = 90 - 6x$ and $P_y = 48 - 4y$. Dividing gives $x = 90/6 = 15$ and $y = 48/4 = 12$. Then $P(15, 12) = 1350 + 576 - 675 - 288 = 963$ dollars.'
        constraints: "quadratics with linear terms; the two equations decouple and give integer solutions; value of f at the point; contexts with cost, height and profit"
      - id: kp3
        name: "Systems requiring factoring or substitution"
        key_prerequisites: [computing-the-gradient, systems-substitution]
        exemplars:
          - problem: 'Find all critical points of $f(x, y) = x^3 - 3x + y^2$.'
            answer: '(1, 0), (-1, 0)'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The partial derivatives are $f_x = 3x^2 - 3$ and $f_y = 2y$. Factoring $3(x - 1)(x + 1) = 0$ gives $x = 1$ or $x = -1$, and $2y = 0$ gives $y = 0$. The critical points are $(1, 0)$ and $(-1, 0)$.'
          - problem: 'The temperature at the point $(x, y)$ of a metal sheet is $T(x, y) = x^3 - 3x^2 + y^2 - 2y$ degrees Celsius. Find all critical points of $T$.'
            answer: '(0, 1), (2, 1)'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The partial derivatives are $T_x = 3x^2 - 6x = 3x(x - 2)$ and $T_y = 2y - 2$. So $x = 0$ or $x = 2$, and $y = 1$. The critical points are $(0, 1)$ and $(2, 1)$.'
          - problem: 'Find all critical points of $f(x, y) = x^3 + y^3 - 3xy$.'
            answer: '(0, 0), (1, 1)'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The partial derivatives are $f_x = 3x^2 - 3y$ and $f_y = 3y^2 - 3x$. From $f_x = 0$ we get $y = x^2$. Substituting into $f_y = 0$ gives $3x(x^3 - 1) = 0$, so $x = 0$ or $x = 1$, and the critical points are $(0, 0)$ and $(1, 1)$.'
          - problem: 'Find all critical points of $f(x, y) = x^2 y + y^2 - 4y$.'
            answer: '(0, 2), (2, 0), (-2, 0)'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The partial derivatives are $f_x = 2xy$ and $f_y = x^2 + 2y - 4$. From $2xy = 0$ either $x = 0$ or $y = 0$. If $x = 0$, then $y = 2$. If $y = 0$, then $x^2 = 4$, so $x = 2$ or $x = -2$. The critical points are $(0, 2)$, $(2, 0)$ and $(-2, 0)$.'
          - problem: 'Ravi solves $f_x = 3x^2 - 27 = 0$ for $f(x, y) = x^3 - 27x + y^2 - 6y$, writes $x = 3$, and lists only the critical point $(3, 3)$. Find all critical points of $f$.'
            answer: '(3, 3), (-3, 3)'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Ravi lost a root: $3x^2 - 27 = 0$ gives $x^2 = 9$, so $x = 3$ or $x = -3$. The equation $f_y = 2y - 6 = 0$ gives $y = 3$. The critical points are $(3, 3)$ and $(-3, 3)$.'
          - problem: 'Find all critical points of $f(x, y) = x^4 - 2x^2 + y^2 - 4y$.'
            answer: '(0, 2), (1, 2), (-1, 2)'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The partial derivatives are $f_x = 4x^3 - 4x = 4x(x - 1)(x + 1)$ and $f_y = 2y - 4$. So $x = 0$, $x = 1$ or $x = -1$, and $y = 2$. The critical points are $(0, 2)$, $(1, 2)$ and $(-1, 2)$.'
          - problem: 'The height of a landscape is $h(x, y) = x^3 - 12x + y^2 - 6y$ metres. Find all points where both slopes $h_x$ and $h_y$ are zero.'
            answer: '(2, 3), (-2, 3)'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The slopes are $h_x = 3x^2 - 12$ and $h_y = 2y - 6$. The first is zero when $x^2 = 4$, so $x = 2$ or $x = -2$, and the second when $y = 3$. The points are $(2, 3)$ and $(-2, 3)$.'
          - problem: 'Find all critical points of $f(x, y) = 3xy - x^2 y - xy^2$.'
            answer: '(0, 0), (3, 0), (0, 3), (1, 1)'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Factor the partial derivatives: $f_x = y(3 - 2x - y)$ and $f_y = x(3 - x - 2y)$. If $y = 0$, then $x = 0$ or $x = 3$. If $y = 3 - 2x$ and $x = 0$, then $y = 3$. If $y = 3 - 2x$ and $3 - x - 2y = 0$, then $x = 1$ and $y = 1$. The critical points are $(0, 0)$, $(3, 0)$, $(0, 3)$ and $(1, 1)$.'
        constraints: "the system grad f = 0 solves by substitution or factoring with integer solutions; at most 4 real critical points; contexts with temperature and height"
    diagnostic_exemplar:
      problem: 'Find all critical points of $f(x, y) = x^3 - 12x + y^2 - 4y$.'
      answer: '$(2, 2)$ and $(-2, 2)$'
      answer_contract: {kind: none}
      solution_sketch: '$f_x = 3x^2 - 12 = 0$ gives $x = \pm 2$; $f_y = 2y - 4 = 0$ gives $y = 2$.'
    anki_seeds:
      - front: 'Definition of a critical point of $f(x, y)$?'
        back: 'A point where $\nabla f = \mathbf{0}$ (both partials vanish) or where a partial derivative fails to exist.'
        type: basic
      - front: 'Where can a local extremum of a differentiable $f(x, y)$ occur?'
        back: 'Only at a critical point — where $\nabla f = \mathbf{0}$.'
        type: basic

  - id: multivariable-local-extrema
    name: "Local Extrema and the Second-Derivative Test"
    core: true
    difficulty: 0.78
    drill: false
    answer_kind: numeric
    expected_time_secs: 240
    prerequisites:
      - id: multivariable-critical-points
        weight: 0.8
        key: true
      - id: partial-derivatives
        weight: 0.6
        key: true
    knowledge_points:
      - id: kp1
        name: "Computing the discriminant D"
        key_prerequisites: [multivariable-critical-points, partial-derivatives]
        exemplars:
          - problem: 'Find the discriminant $D = f_{xx} f_{yy} - f_{xy}^2$ of $f(x, y) = x^3 - 3x + y^2$.'
            answer: '12x'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'The second partials are $f_{xx} = 6x$, $f_{yy} = 2$ and $f_{xy} = 0$. Then $D = (6x)(2) - 0^2 = 12x$. The discriminant is $12x$.'
          - problem: 'Compute $D = f_{xx} f_{yy} - f_{xy}^2$ for $f(x, y) = x^2 + 3xy + y^2$.'
            answer: '-5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The second partials are the constants $f_{xx} = 2$, $f_{yy} = 2$ and $f_{xy} = 3$. Then $D = (2)(2) - 3^2 = 4 - 9 = -5$. So $D = -5$.'
          - problem: 'Compute $D = f_{xx} f_{yy} - f_{xy}^2$ for $f(x, y) = x^2 y^2$.'
            answer: '-12x^2y^2'
            answer_contract: {"kind": "function", "vars": ["x", "y"]}
            solution_sketch: 'The second partials are $f_{xx} = 2y^2$, $f_{yy} = 2x^2$ and $f_{xy} = 4xy$. Then $D = (2y^2)(2x^2) - (4xy)^2 = 4x^2y^2 - 16x^2y^2 = -12x^2y^2$.'
          - problem: 'A company''s weekly profit, in thousands of dollars, is $P(x, y) = 60x + 40y - x^2 - xy - 2y^2$. Find the discriminant $D = P_{xx} P_{yy} - P_{xy}^2$.'
            answer: '7'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The second partials are the constants $P_{xx} = -2$, $P_{yy} = -4$ and $P_{xy} = -1$. Then $D = (-2)(-4) - (-1)^2 = 8 - 1 = 7$. So $D = 7$.'
          - problem: 'Evaluate $D = f_{xx} f_{yy} - f_{xy}^2$ at the point $(1, 2)$ for $f(x, y) = x^3 + y^3 - 3xy$.'
            answer: '63'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The second partials are $f_{xx} = 6x$, $f_{yy} = 6y$ and $f_{xy} = -3$. So $D = 36xy - 9$, and at $(1, 2)$ this is $72 - 9 = 63$. The value is $63$.'
          - problem: 'The height of the ground near a mountain pass is $h(x, y) = x^2 - 4xy + 2y^2$ metres. Compute $D = h_{xx} h_{yy} - h_{xy}^2$.'
            answer: '-8'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The second partials are the constants $h_{xx} = 2$, $h_{yy} = 4$ and $h_{xy} = -4$. Then $D = (2)(4) - (-4)^2 = 8 - 16 = -8$. So $D = -8$.'
          - problem: 'The second partials of a function $f$ are $f_{xx} = 2x$, $f_{yy} = 3$ and $f_{xy} = 0$. Find $D = f_{xx} f_{yy} - f_{xy}^2$.'
            answer: '6x'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'Substitute into the formula: $D = (2x)(3) - 0^2 = 6x$. The discriminant is $6x$.'
          - problem: 'Compute $D = f_{xx} f_{yy} - f_{xy}^2$ for $f(x, y) = x^2 y + y^3$.'
            answer: '12y^2 - 4x^2'
            answer_contract: {"kind": "function", "vars": ["x", "y"]}
            solution_sketch: 'The second partials are $f_{xx} = 2y$, $f_{yy} = 6y$ and $f_{xy} = 2x$. Then $D = (2y)(6y) - (2x)^2 = 12y^2 - 4x^2$.'
        constraints: "second partials are constants or monomials; D is a number or a polynomial in x and y; contexts with profit and ground height"
      - id: kp2
        name: "The second-derivative test"
        key_prerequisites: [multivariable-critical-points, partial-derivatives]
        try_first:
          problem: 'Let $f(x, y) = x^2 - y^2$, so $f(0, 0) = 0$. Is $f(0, 0)$ the smallest value of $f$ among the points close to the origin?'
          answer_contract: {"kind": "label", "options": [["yes", "it is", "it is the smallest value"], ["no", "it is not", "it is not the smallest value"]]}
          answer: 'no'
          reveal: 'Along the $x$-axis $f = x^2$ is never below $0$, but along the $y$-axis $f = -y^2$ is never above $0$. A point can be a high point in one direction and a low point in another, so we need a test that looks at all directions.'
        exemplars:
          - problem: 'Use the second-derivative test to classify the critical point $(1, 0)$ of $f(x, y) = x^3 - 3x + y^2$.'
            answer: 'local minimum'
            answer_contract: {"kind": "label", "options": [["local minimum", "minimum", "a local minimum", "min"], ["local maximum", "maximum", "a local maximum", "max"], ["saddle point", "saddle", "a saddle point"]]}
            solution_sketch: 'The second partials are $f_{xx} = 6x$, $f_{yy} = 2$ and $f_{xy} = 0$. At $(1, 0)$ we get $f_{xx} = 6$ and $D = (6)(2) - 0 = 12$. Since $D > 0$ and $f_{xx} > 0$, the point is a local minimum.'
          - problem: 'The function $f(x, y) = x^3 + y^3 - 3xy$ has a critical point at $(1, 1)$. What is the value of $D = f_{xx} f_{yy} - f_{xy}^2$ there?'
            answer: '27'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The second partials are $f_{xx} = 6x$, $f_{yy} = 6y$ and $f_{xy} = -3$. At $(1, 1)$ this gives $D = (6)(6) - (-3)^2 = 36 - 9 = 27$. Since $D > 0$ and $f_{xx} = 6 > 0$, the point is a local minimum.'
          - problem: 'A company''s weekly profit, in thousands of dollars, is $P(x, y) = -2x^2 - y^2 + 24x + 10y - 30$. Find the local extreme value of $P$.'
            answer: '67'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The critical point solves $P_x = -4x + 24 = 0$ and $P_y = -2y + 10 = 0$, so it is $(6, 5)$. Here $P_{xx} = -4$, $P_{yy} = -2$ and $P_{xy} = 0$, so $D = 8 > 0$ and $P_{xx} < 0$, which gives a local maximum. The local extreme value is the profit $P(6, 5) = -72 - 25 + 144 + 50 - 30 = 67$ thousand dollars.'
          - problem: 'The function $f(x, y) = -x^3 + 3x - y^2$ has critical points $(1, 0)$ and $(-1, 0)$. Find the value of $f$ at the one that is a local maximum.'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The second partials are $f_{xx} = -6x$, $f_{yy} = -2$ and $f_{xy} = 0$, so $D = 12x$. At $(1, 0)$, $D = 12 > 0$ and $f_{xx} = -6 < 0$, a local maximum. At $(-1, 0)$, $D = -12 < 0$, a saddle point. So $f(1, 0) = -1 + 3 = 2$.'
          - problem: 'The height of the ground near a mountain pass is $h(x, y) = 800 + x^2 - 4xy$ metres, and $(0, 0)$ is its critical point. Is that point a peak, the bottom of a valley or a saddle?'
            answer: 'saddle point'
            answer_contract: {"kind": "label", "options": [["saddle point", "saddle", "a saddle", "a pass", "pass"], ["local maximum", "peak", "a peak", "maximum"], ["local minimum", "valley", "valley bottom", "minimum"]]}
            solution_sketch: 'The second partials are $h_{xx} = 2$, $h_{yy} = 0$ and $h_{xy} = -4$. Then $D = (2)(0) - (-4)^2 = -16 < 0$. A negative $D$ means a saddle point: the ground rises in one direction and falls in another.'
          - problem: 'The function $f(x, y) = x^4 + y^4$ has a critical point at the origin. What is $D = f_{xx} f_{yy} - f_{xy}^2$ there?'
            answer: '0'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The second partials are $f_{xx} = 12x^2$, $f_{yy} = 12y^2$ and $f_{xy} = 0$, and all of them are $0$ at the origin. So $D = 0$, and the test gives no answer. The origin is in fact a minimum, which the test cannot show.'
          - problem: 'Lena says that $f(x, y) = x^2 - 6xy + y^2$ has a local minimum at the origin because $f_{xx} = 2 > 0$. Find $D$ at the origin.'
            answer: '-32'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The second partials are $f_{xx} = 2$, $f_{yy} = 2$ and $f_{xy} = -6$. Then $D = (2)(2) - (-6)^2 = 4 - 36 = -32$. Since $D < 0$, the origin is a saddle point, so Lena is wrong.'
          - problem: 'The depth of a lake is $d(x, y) = x^2 + 3y^2 - 6x + 12y + 30$ metres. Use the second-derivative test on the critical point of $d$ to find the least depth.'
            answer: '9'
            answer_contract: {"kind": "unit", "quantity": "length", "unit": "m", "allow_omitted": true}
            solution_sketch: 'The critical point solves $d_x = 2x - 6 = 0$ and $d_y = 6y + 12 = 0$, so it is $(3, -2)$. Here $d_{xx} = 2$, $d_{yy} = 6$ and $d_{xy} = 0$, so $D = 12 > 0$ and $d_{xx} > 0$, a minimum. The depth is $d(3, -2) = 9 + 12 - 18 - 24 + 30 = 9$ metres.'
        constraints: "D = f_xx f_yy - f_xy^2 evaluates to a number at each critical point; the verdict is a minimum, a maximum or a saddle; one case with D = 0 shows the test can fail; contexts with profit, ground height and depth"
      - id: kp3
        name: "Complete find-and-classify problems"
        key_prerequisites: [multivariable-critical-points, partial-derivatives]
        exemplars:
          - problem: 'Find and classify the critical points of $f(x, y) = x^3 + y^3 - 3xy$. What is the value of $f$ at the local minimum?'
            answer: '-1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Setting $f_x = 3x^2 - 3y = 0$ and $f_y = 3y^2 - 3x = 0$ gives the critical points $(0, 0)$ and $(1, 1)$. Here $D = 36xy - 9$, which is $-9 < 0$ at $(0, 0)$ (a saddle point) and $27 > 0$ with $f_{xx} = 6 > 0$ at $(1, 1)$ (a local minimum). The value there is $f(1, 1) = 1 + 1 - 3 = -1$.'
          - problem: 'Find and classify the critical points of $f(x, y) = x^4 + y^4 - 4xy$. What is the value of $f$ at the local minima?'
            answer: '-2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Setting $f_x = 4x^3 - 4y = 0$ and $f_y = 4y^3 - 4x = 0$ gives $y = x^3$ and $x = x^9$, so the critical points are $(0, 0)$, $(1, 1)$ and $(-1, -1)$. Here $D = 144x^2y^2 - 16$, which is $-16 < 0$ at the origin and $128 > 0$ with $f_{xx} = 12 > 0$ at the other two. Both give $f = 1 + 1 - 4 = -2$.'
          - problem: 'Find and classify the critical points of $f(x, y) = x^3 + y^3 + 3xy$. What type of critical point is the one with the smaller $x$-coordinate?'
            answer: 'local maximum'
            answer_contract: {"kind": "label", "options": [["local minimum", "minimum", "a local minimum", "min"], ["local maximum", "maximum", "a local maximum", "max"], ["saddle point", "saddle", "a saddle point"]]}
            solution_sketch: 'Setting $f_x = 3x^2 + 3y = 0$ and $f_y = 3y^2 + 3x = 0$ gives $y = -x^2$ and $x = -x^4$, so the critical points are $(0, 0)$ and $(-1, -1)$. At $(-1, -1)$ we have $D = 36xy - 9 = 27 > 0$ and $f_{xx} = -6 < 0$. The point with the smaller $x$ is $(-1, -1)$, a local maximum.'
          - problem: 'The height of a hill is $h(x, y) = 12x - x^3 - y^2 + 4y$ metres. Find and classify the critical points. How high is the summit, the local maximum?'
            answer: '20'
            answer_contract: {"kind": "unit", "quantity": "length", "unit": "m", "allow_omitted": true}
            solution_sketch: 'Setting $h_x = 12 - 3x^2 = 0$ and $h_y = -2y + 4 = 0$ gives the points $(2, 2)$ and $(-2, 2)$. Here $D = (-6x)(-2) = 12x$. At $(2, 2)$, $D = 24 > 0$ and $h_{xx} = -12 < 0$, a local maximum, while $(-2, 2)$ is a saddle point. The summit height is $h(2, 2) = 24 - 8 - 4 + 8 = 20$ metres.'
          - problem: 'The cost of a part, in dollars, depends on two machine settings $x$ and $y$ through $C(x, y) = x^3 - 12x + y^2 - 6y + 60$. Find and classify the critical points. What is the lowest local cost?'
            answer: '35'
            answer_contract: {"kind": "unit", "quantity": "dollar", "unit": "dollar", "allow_omitted": true}
            solution_sketch: 'Setting $C_x = 3x^2 - 12 = 0$ and $C_y = 2y - 6 = 0$ gives the points $(2, 3)$ and $(-2, 3)$. Here $D = (6x)(2) = 12x$, so $D = 24 > 0$ with $C_{xx} = 12 > 0$ at $(2, 3)$ (a local minimum) and $D = -24 < 0$ at $(-2, 3)$ (a saddle point). The cost is $C(2, 3) = 8 - 24 + 9 - 18 + 60 = 35$ dollars.'
          - problem: 'Find and classify the critical points of $f(x, y) = x^3 + y^2 - 3x^2 - 6y$. What is the value of $f$ at the local minimum?'
            answer: '-13'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Setting $f_x = 3x^2 - 6x = 0$ and $f_y = 2y - 6 = 0$ gives the points $(0, 3)$ and $(2, 3)$. Here $D = (6x - 6)(2) = 12(x - 1)$, so $D = -12 < 0$ at $(0, 3)$ (a saddle point) and $D = 12 > 0$ with $f_{xx} = 6 > 0$ at $(2, 3)$. The value is $f(2, 3) = 8 + 9 - 12 - 18 = -13$.'
          - problem: 'Find and classify the critical points of $f(x, y) = x^3 - 3x^2 + 3y^2 - 6y$. What type of critical point is the one with the smaller $x$-coordinate?'
            answer: 'saddle point'
            answer_contract: {"kind": "label", "options": [["local minimum", "minimum", "a local minimum", "min"], ["local maximum", "maximum", "a local maximum", "max"], ["saddle point", "saddle", "a saddle point"]]}
            solution_sketch: 'Setting $f_x = 3x^2 - 6x = 0$ and $f_y = 6y - 6 = 0$ gives the points $(0, 1)$ and $(2, 1)$. Here $D = (6x - 6)(6) = 36(x - 1)$. At $(0, 1)$, $D = -36 < 0$, so the point with the smaller $x$ is a saddle point.'
          - problem: 'Sam finds the four critical points of $f(x, y) = x^3 - 3x + y^3 - 3y$ and says that all four are local minima. What is the value of $f$ at the point that is really a local maximum?'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The critical points are $(\pm 1, \pm 1)$, and $D = (6x)(6y) = 36xy$. At $(1, 1)$, $D = 36 > 0$ and $f_{xx} = 6 > 0$ (a minimum), but at $(-1, -1)$, $D = 36 > 0$ and $f_{xx} = -6 < 0$, a local maximum. The points $(1, -1)$ and $(-1, 1)$ have $D = -36$, saddle points. The value is $f(-1, -1) = -1 + 3 - 1 + 3 = 4$.'
        constraints: "2-4 critical points found by factoring or substitution; every classification is decisive; the answer is the value of f at an extremum or the type of one point; contexts with height and cost"
    diagnostic_exemplar:
      problem: 'Find and classify all critical points of $f(x, y) = x^3 - 6xy + 3y^2$.'
      answer: '$(0, 0)$ is a saddle point; $(2, 2)$ is a local minimum with $f(2,2) = -4$.'
      answer_contract: {kind: none}
      solution_sketch: '$f_y = -6x + 6y = 0$ gives $y = x$, and $f_x = 3x^2 - 6y = 0$ then gives $3x^2 - 6x = 0$, so $x = 0$ or $x = 2$. With $f_{xx} = 6x$, $f_{yy} = 6$, $f_{xy} = -6$: $D = 36x - 36$, which is $-36 < 0$ at $(0,0)$ (saddle) and $36 > 0$ with $f_{xx} = 12 > 0$ at $(2,2)$ (local minimum).'
    anki_seeds:
      - front: 'Second-derivative test discriminant for $f(x, y)$?'
        back: '$D = f_{xx} f_{yy} - f_{xy}^2$, evaluated at the critical point.'
        type: basic
      - front: 'Second-derivative test outcomes: $D < 0$; $D > 0, f_{xx} > 0$; $D > 0, f_{xx} < 0$; $D = 0$?'
        back: 'Saddle; local min; local max; inconclusive.'
        type: basic

  - id: absolute-extrema-closed-regions
    name: "Absolute Extrema on Closed Regions"
    core: false                # optimisation application; terminal
    difficulty: 0.80
    drill: false
    answer_kind: numeric
    expected_time_secs: 300
    prerequisites:
      - id: multivariable-local-extrema
        weight: 0.7
        key: true
      - id: closed-interval-method
        weight: 0.5
        key: true
      - id: multivariable-critical-points
        weight: 0.4
        key: false
    knowledge_points:
      - id: kp1
        name: "Linear objectives: extrema on the boundary"
        key_prerequisites: [multivariable-critical-points, closed-interval-method]
        exemplars:
          - problem: 'Find the absolute maximum of $f(x, y) = 6 - x - y$ on the triangle with vertices $(0, 0)$, $(4, 0)$ and $(0, 4)$.'
            answer: '6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The function is linear, so it has no interior critical point and its extremes lie on the boundary. At the vertices $f(0, 0) = 6$, $f(4, 0) = 2$ and $f(0, 4) = 2$. On the hypotenuse $x + y = 4$, so $f = 2$ there. The absolute maximum is $6$.'
          - problem: 'Find the absolute maximum of $f(x, y) = 5x + 2y$ on the square with corners $(0, 0)$, $(1, 0)$, $(0, 1)$ and $(1, 1)$.'
            answer: '7'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The function is linear, so its largest value on the square is at a corner. The corner values are $f(0, 0) = 0$, $f(1, 0) = 5$, $f(0, 1) = 2$ and $f(1, 1) = 7$. The absolute maximum is $7$.'
          - problem: 'A bakery has 40 kilograms of flour. A loaf uses 2 kilograms and earns 3 dollars profit, and a cake uses 1 kilogram and earns 5 dollars profit. The bakery makes $x$ loaves and $y$ cakes with $x \ge 0$, $y \ge 0$ and $2x + y \le 40$. What is the greatest possible profit?'
            answer: '200'
            answer_contract: {"kind": "unit", "quantity": "dollar", "unit": "dollar", "allow_omitted": true}
            solution_sketch: 'The profit is $P = 3x + 5y$ on the triangle with vertices $(0, 0)$, $(20, 0)$ and $(0, 40)$. The vertex values are $P = 0$, $P = 60$ and $P = 200$. The greatest profit is $200$ dollars, from $40$ cakes and no loaves.'
          - problem: 'At which point of the square $[0, 1] \times [0, 1]$ does $f(x, y) = 2x + 5y$ have its absolute maximum?'
            answer: '(1, 1)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'The function is linear, so the maximum is at a corner of the square. The corner values are $f(0, 0) = 0$, $f(1, 0) = 2$, $f(0, 1) = 5$ and $f(1, 1) = 7$. The largest is $7$, at the point $(1, 1)$.'
          - problem: 'Find the absolute minimum of $f(x, y) = 3x - 2y$ on the triangle with vertices $(0, 0)$, $(2, 0)$ and $(0, 2)$.'
            answer: '-4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The function is linear, so check the vertices. We get $f(0, 0) = 0$, $f(2, 0) = 6$ and $f(0, 2) = -4$. The absolute minimum is $-4$.'
          - problem: 'The cost of a batch is $C(x, y) = 4x + 3y$ dollars, where $x$ kilograms of paint and $y$ kilograms of resin are used with $1 \le x \le 5$ and $2 \le y \le 6$. What is the lowest possible cost?'
            answer: '10'
            answer_contract: {"kind": "unit", "quantity": "dollar", "unit": "dollar", "allow_omitted": true}
            solution_sketch: 'The cost is linear on a rectangle, so the lowest value is at a corner. Both coefficients are positive, so the cost is least when $x$ and $y$ are least. At $(1, 2)$ the cost is $4 + 6 = 10$ dollars.'
          - problem: 'Find the smallest value of $f(x, y) = 8 - 2x - y$ on the triangle with vertices $(0, 0)$, $(3, 0)$ and $(0, 6)$.'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The vertex values are $f(0, 0) = 8$, $f(3, 0) = 2$ and $f(0, 6) = 2$. The edge from $(3, 0)$ to $(0, 6)$ lies on $2x + y = 6$, so $f = 8 - 6 = 2$ along the whole edge. The smallest value is $2$.'
        constraints: "linear objectives on triangles, squares and rectangles; extremes at vertices or constant along one edge; contexts with profit and cost"
      - id: kp2
        name: "Disks: parametrized boundaries"
        key_prerequisites: [multivariable-local-extrema, closed-interval-method]
        exemplars:
          - problem: 'Find the absolute maximum of $f(x, y) = x^2 + y^2 + 8x$ on the circle $x^2 + y^2 = 25$.'
            answer: '65'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'On the circle we have $x^2 + y^2 = 25$, so $f = 25 + 8x$. Here $x$ runs over $[-5, 5]$ and $25 + 8x$ increases with $x$. The maximum is at $x = 5$: $25 + 40 = 65$.'
          - problem: 'Find the absolute minimum of $f(x, y) = x^2 + y^2 - 4x$ on the circle $x^2 + y^2 = 36$.'
            answer: '12'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'On the circle we have $x^2 + y^2 = 36$, so $f = 36 - 4x$ with $x \in [-6, 6]$. This decreases as $x$ grows, so the minimum is at $x = 6$: $36 - 24 = 12$.'
          - problem: 'Find the absolute maximum of $f(x, y) = x + y$ on the circle $x^2 + y^2 = 8$.'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Parametrize the circle by $x = 2\sqrt{2}\cos t$ and $y = 2\sqrt{2}\sin t$. Then $f = 2\sqrt{2}(\cos t + \sin t)$, and $\cos t + \sin t$ has largest value $\sqrt{2}$. So the maximum is $2\sqrt{2} \cdot \sqrt{2} = 4$, at $(2, 2)$.'
          - problem: 'A rectangle with sides parallel to the axes is inscribed in the circle $x^2 + y^2 = 25$, where the units are metres. If one corner is at $(x, y)$ in the first quadrant, the area is $4xy$. What is the largest possible area of the rectangle?'
            answer: '50'
            answer_contract: {"kind": "unit", "quantity": "area", "unit": "m^2", "allow_omitted": true}
            solution_sketch: 'Parametrize the corner by $x = 5\cos t$ and $y = 5\sin t$ with $0 \le t \le \pi/2$. Then the area is $4xy = 100 \sin t \cos t = 50 \sin 2t$. The largest value of $\sin 2t$ is $1$, so the largest area is $50$ square metres.'
          - problem: 'Find the absolute maximum of $f(x, y) = x^2 + y^2 + 10y$ on the disk $x^2 + y^2 \le 4$.'
            answer: '24'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Inside the disk $f_y = 2y + 10$ is never zero, so there is no interior critical point. On the boundary circle $f = 4 + 10y$ with $y \in [-2, 2]$. The maximum is at $y = 2$: $4 + 20 = 24$.'
          - problem: 'Find the absolute minimum of $f(x, y) = x^2 + y^2 + 6x$ on the disk $x^2 + y^2 \le 1$.'
            answer: '-5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The only critical point is $(-3, 0)$, which lies outside the disk. On the circle $f = 1 + 6x$ with $x \in [-1, 1]$, so the minimum is at $x = -1$: $1 - 6 = -5$.'
          - problem: 'A circular metal plate occupies the disk $x^2 + y^2 \le 16$, with $x$ and $y$ in centimetres. Its temperature at $(x, y)$ is $T(x, y) = x^2 + y^2 - 10x + 60$ degrees Celsius. What is the lowest temperature on the plate?'
            answer: '36'
            answer_contract: {"kind": "unit", "quantity": "temperature", "unit": "°C", "allow_omitted": true}
            solution_sketch: 'The only critical point is $(5, 0)$, which lies outside the plate. On the edge $T = 16 - 10x + 60 = 76 - 10x$ with $x \in [-4, 4]$. The lowest value is at $x = 4$: $76 - 40 = 36$ degrees Celsius.'
        constraints: "on the boundary circle the objective reduces to one variable via x^2 + y^2 = r^2 or a parametrization; disks whose critical point lies outside; contexts with area and temperature"
      - id: kp3
        name: "Interior critical points versus boundary candidates"
        key_prerequisites: [multivariable-local-extrema, closed-interval-method]
        exemplars:
          - problem: 'Find the absolute minimum of $f(x, y) = x^2 + y^2 - 2x - 2y$ on the square $0 \le x \le 2$, $0 \le y \le 2$.'
            answer: '-2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The interior critical point solves $f_x = 2x - 2 = 0$ and $f_y = 2y - 2 = 0$, so it is $(1, 1)$ with $f(1, 1) = -2$. On the edges the values are at least $-1$, and the four corner values are all $0$. The smallest candidate is $-2$.'
          - problem: 'Find the absolute minimum of $f(x, y) = xy - x - y + 3$ on the triangle with vertices $(0, 0)$, $(2, 0)$ and $(0, 4)$.'
            answer: '-1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The interior critical point is $(1, 1)$ with $f(1, 1) = 2$. On the edge $x = 0$ we get $f = 3 - y$, which is $-1$ at $(0, 4)$. On the other edges the values are no smaller than $-1$, so the smallest candidate is $-1$.'
          - problem: 'Find the absolute maximum of $f(x, y) = x^2 + y^2 - 6x - 2y + 4$ on the square $0 \le x \le 4$, $0 \le y \le 4$.'
            answer: '12'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The interior critical point is $(3, 1)$ with $f = -6$, which is a minimum, not a maximum. This function is a bowl, so its largest value is at the corner farthest from $(3, 1)$. The corner values are $4$, $-4$, $4$ and $12$ at $(0, 0)$, $(4, 0)$, $(4, 4)$ and $(0, 4)$.'
          - problem: 'A lake bed over the rectangle $0 \le x \le 6$, $0 \le y \le 4$ (units in kilometres) has depth $d(x, y) = x^2 + y^2 - 6x - 4y + 20$ metres. What is the least depth of the lake?'
            answer: '7'
            answer_contract: {"kind": "unit", "quantity": "length", "unit": "m", "allow_omitted": true}
            solution_sketch: 'The interior critical point solves $d_x = 2x - 6 = 0$ and $d_y = 2y - 4 = 0$, so it is $(3, 2)$ with $d = 9 + 4 - 18 - 8 + 20 = 7$. On the edges the depth is at least $11$. The least depth is $7$ metres.'
          - problem: 'A square plate occupies $0 \le x \le 4$, $0 \le y \le 4$, with units in centimetres. Its temperature is $T(x, y) = 40 - x^2 - y^2 + 2x + 6y$ degrees Celsius. What is the highest temperature on the plate?'
            answer: '50'
            answer_contract: {"kind": "unit", "quantity": "temperature", "unit": "°C", "allow_omitted": true}
            solution_sketch: 'The interior critical point solves $T_x = -2x + 2 = 0$ and $T_y = -2y + 6 = 0$, so it is $(1, 3)$ with $T = 40 - 1 - 9 + 2 + 18 = 50$. On the edges the temperature stays below $50$. The highest temperature is $50$ degrees Celsius.'
          - problem: 'Find the absolute minimum of $f(x, y) = x^2 + y^2 - 4x$ on the disk $x^2 + y^2 \le 9$.'
            answer: '-4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The interior critical point solves $f_x = 2x - 4 = 0$ and $f_y = 2y = 0$, so it is $(2, 0)$ with $f = -4$, inside the disk. On the circle $f = 9 - 4x \ge -3$ for $x \in [-3, 3]$. The smallest value is $-4$.'
          - problem: 'Sam finds the absolute maximum of $f(x, y) = x^2 + y^2 - 6y$ on the disk $x^2 + y^2 \le 16$ by checking only the critical point $(0, 3)$, and he says it is $-9$. What is the correct absolute maximum?'
            answer: '40'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The critical point $(0, 3)$ gives $-9$, but that is the minimum candidate. On the boundary circle $f = 16 - 6y$ with $y \in [-4, 4]$, and the largest value is at $y = -4$: $16 + 24 = 40$. So the absolute maximum is $40$.'
          - problem: 'Find the absolute maximum of $f(x, y) = x^2 + y^2 - 6x - 4y + 5$ on the triangle with vertices $(0, 0)$, $(8, 0)$ and $(0, 4)$.'
            answer: '21'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The interior critical point $(3, 2)$ gives $-8$, a minimum. The function is a bowl, so the maximum is at a vertex. The vertex values are $5$ at $(0, 0)$, $21$ at $(8, 0)$ and $5$ at $(0, 4)$, so the maximum is $21$.'
          - problem: 'Find the absolute maximum of $f(x, y) = 2x^2 + y^2 - 4x - 2y + 1$ on the rectangle $0 \le x \le 3$, $0 \le y \le 2$.'
            answer: '7'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The interior critical point is $(1, 1)$ with $f = -2$. On the boundary the largest value is at the corners $(3, 0)$ and $(3, 2)$, where $f = 18 - 12 + 1 = 7$. The absolute maximum is $7$.'
          - problem: 'Find the absolute minimum of $f(x, y) = x^2 + y^2 - 8x - 4y$ on the triangle with vertices $(0, 0)$, $(4, 0)$ and $(0, 4)$.'
            answer: '-18'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The only critical point is $(4, 2)$, which lies outside the triangle. On the hypotenuse $y = 4 - x$ we get $f = 2x^2 - 12x$, which is least at $x = 3$ and equals $-18$ at $(3, 1)$. The other two edges give at least $-16$ and $-4$, so the absolute minimum is $-18$.'
          - problem: 'Find the absolute minimum of $f(x, y) = x^2 + y^2 - 8x - 2y$ on the rectangle $0 \le x \le 3$, $0 \le y \le 2$.'
            answer: '-16'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The only critical point is $(4, 1)$, which lies outside the rectangle. On the edge $x = 3$ we get $f = y^2 - 2y - 15$, which is least at $y = 1$ and equals $-16$. The other edges give values of at least $-15$, so the absolute minimum is $-16$.'
        constraints: "regions are disks, rectangles or triangles; interior critical points are compared with boundary candidates; contexts with temperature and depth"
    diagnostic_exemplar:
      problem: 'Find the absolute extrema of $f(x, y) = x^2 + y^2 - 2y$ on the disk $x^2 + y^2 \le 4$.'
      answer: 'Absolute minimum $-1$ at $(0, 1)$; absolute maximum $8$ at $(0, -2)$.'
      answer_contract: {kind: none}
      solution_sketch: 'Interior: $\nabla f = 0$ at $(0, 1)$, $f = -1$. Boundary: $f = 4 - 2y$, $y \in [-2, 2]$, giving $8$ at $(0,-2)$ and $0$ at $(0,2)$.'
    anki_seeds:
      - front: 'Why must $f$ attain absolute extrema on a closed bounded region?'
        back: 'The Extreme Value Theorem: a continuous function on a closed, bounded region attains its max and min.'
        type: basic
      - front: 'Procedure for absolute extrema of $f$ on a closed region $D$?'
        back: '1) Find interior critical points; 2) find extremes of $f$ restricted to the boundary; 3) compare all candidate values.'
        type: basic

  - id: applied-multivariable-optimization
    name: "Applied Optimization in Several Variables"
    core: false                # applied optimisation genre; terminal
    difficulty: 0.81
    drill: false
    answer_kind: numeric
    expected_time_secs: 300
    prerequisites:
      - id: multivariable-local-extrema
        weight: 0.8
        key: true
      - id: basic-optimization
        weight: 0.4
        key: false
    knowledge_points:
      - id: kp1
        name: 'Distance problems'
        key_prerequisites: [multivariable-local-extrema]
        exemplars:
          - problem: 'Find the point on the plane $x+2y+3z=14$ closest to the origin.'
            answer: '(1, 2, 3)'
            answer_contract: {"kind":"coordinates","arity":3}
            solution_sketch: 'The squared distance from the origin is $x^2+y^2+z^2$, and the plane gives $z=(14-x-2y)/3$. Setting both partial derivatives of $x^2+y^2+((14-x-2y)/3)^2$ to zero gives $x=1$ and $y=2$. Then $z=(14-1-4)/3=3$, so the closest point is $(1,2,3)$.'
          - problem: 'How far is the plane $2x+2y+z=9$ from the origin?'
            answer: '3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Minimize $x^2+y^2+z^2$ with $z=9-2x-2y$. The partial derivatives vanish when $x=2z$ and $y=2z$, and the plane then gives $9z=9$, so the nearest point is $(2,2,1)$. Its distance from the origin is $\sqrt{4+4+1}=3$.'
          - problem: 'A flat solar panel lies in the plane $x+y+2z=8$, with coordinates in meters measured from a base station at the origin. At which point of the panel should the cable to the station end so that the cable is as short as possible?'
            answer: '(4/3, 4/3, 8/3)'
            answer_contract: {"kind":"coordinates","arity":3}
            solution_sketch: 'The cable is shortest where the squared distance $x^2+y^2+z^2$ is smallest on the plane. Write $z=(8-x-y)/2$ and set both partial derivatives to zero, which gives $z=2x$ and $z=2y$. The plane then gives $6x=8$, so $x=4/3$, $y=4/3$ and $z=8/3$.'
          - problem: 'Find the point on the plane $x+y+z=6$ closest to the point $(4,0,0)$.'
            answer: '(14/3, 2/3, 2/3)'
            answer_contract: {"kind":"coordinates","arity":3}
            solution_sketch: 'Minimize $(x-4)^2+y^2+(6-x-y)^2$ after replacing $z$ by $6-x-y$. Setting the partial derivatives to zero gives $2x+y=10$ and $x+2y=6$. Solving gives $y=2/3$ and $x=14/3$, and then $z=6-14/3-2/3=2/3$.'
          - problem: 'A drone must stay on the flat route $2x-3y+6z=14$, with coordinates in meters from a beacon at the origin. What is the least distance the drone can come to the beacon?'
            answer: '2'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'The squared distance $x^2+y^2+z^2$ is smallest at the point $(4/7,-6/7,12/7)$ on the route, found by setting the partial derivatives of the two-variable function to zero. That point lies $\sqrt{(16+36+144)/49}=\sqrt{4}=2$ meters from the beacon. So the least distance is 2 meters.'
          - problem: 'Sam says that the point $(3,3,0)$ is the point of the plane $x+y+z=6$ closest to the origin, because it is on the plane and has no $z$ part. What is the correct closest point?'
            answer: '(2, 2, 2)'
            answer_contract: {"kind":"coordinates","arity":3}
            solution_sketch: 'The point $(3,3,0)$ is at distance $\sqrt{18}$, which is more than $\sqrt{12}$. Minimizing $x^2+y^2+(6-x-y)^2$ gives $2x+y=6$ and $x+2y=6$, so $x=y=2$. Then $z=6-2-2=2$, and the closest point is $(2,2,2)$.'
          - problem: 'Find the point on the plane $3x+4z=12$ closest to the origin.'
            answer: '(36/25, 0, 48/25)'
            answer_contract: {"kind":"coordinates","arity":3}
            solution_sketch: 'The plane has no $y$ term, so the squared distance $x^2+y^2+z^2$ is smallest when $y=0$. With $z=(12-3x)/4$, the derivative of $x^2+z^2$ vanishes when $z=4x/3$. Then $3x+16x/3=12$ gives $x=36/25$ and $z=48/25$.'
          - problem: 'A surveyor''s marker is at the point $(1,2,3)$, with coordinates in meters, and a flat rock face lies in the plane $x+2y+2z=3$. How far is the marker from the rock face?'
            answer: '8/3'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'Minimize $(x-1)^2+(y-2)^2+(z-3)^2$ over the plane, using $x=3-2y-2z$. The closest point of the plane is $(1,2,3)-\frac{8}{9}(1,2,2)=(1/9,2/9,11/9)$, which satisfies $1/9+4/9+22/9=3$. The distance is the length of $\frac{8}{9}(1,2,2)$, which is $\frac{8}{9}\cdot 3=\frac{8}{3}$ meters.'
        constraints: 'squared distance, then eliminate one variable with the plane equation; points have three coordinates, distances are numbers or lengths in meters'
      - id: kp2
        name: 'Product and box problems'
        key_prerequisites: [multivariable-local-extrema]
        exemplars:
          - problem: 'Three positive numbers have sum $42$. Find the largest possible value of their product.'
            answer: '2744'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Call the numbers $x$, $y$ and $42-x-y$, so the product is $P=xy(42-x-y)$. Setting $P_x=y(42-2x-y)=0$ and $P_y=x(42-x-2y)=0$ gives $x=y=14$, and the third number is also $14$. The largest product is $14^3=2744$.'
          - problem: 'An open-top rectangular box must have volume $256$ m$^3$. The box uses the least material for its base and four sides. How tall is it?'
            answer: '4'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'Let the base be $x$ by $y$ and the height $z=256/(xy)$. The material is $S=xy+512/y+512/x$, and $S_x=y-512/x^2=0$, $S_y=x-512/y^2=0$ give $x=y=8$. Then $z=256/64=4$ meters.'
          - problem: 'A closed rectangular box must have volume $512$ m$^3$. What is the least surface area it can have?'
            answer: '384'
            answer_contract: {"kind":"unit","quantity":"area","unit":"m^2","allow_omitted":true}
            solution_sketch: 'Let the sides be $x$, $y$ and $z=512/(xy)$, so $S=2xy+1024/y+1024/x$. Setting $S_x=0$ and $S_y=0$ gives $x=y=8$, so $z=8$ and the box is a cube. The surface area is $6\cdot 64=384$ square meters.'
          - problem: 'A box with an open top must hold $96$ m$^3$. Its base costs $3$ dollars per square meter and each of its four sides costs $1$ dollar per square meter. What is the least possible cost of the material?'
            answer: '144'
            answer_contract: {"kind":"unit","quantity":"dollar","unit":"dollar","allow_omitted":true}
            solution_sketch: 'With base $x$ by $y$ and height $z=96/(xy)$, the cost is $C=3xy+2xz+2yz=3xy+192/y+192/x$. The conditions $C_x=0$ and $C_y=0$ give $x=y=4$, so $z=6$. Then $C=48+48+48=144$ dollars.'
          - problem: 'Three positive numbers have product $125$. Find the smallest possible value of their sum.'
            answer: '15'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Call the numbers $x$, $y$ and $125/(xy)$, so the sum is $S=x+y+125/(xy)$. Setting $S_x=0$ and $S_y=0$ gives $x=y=5$, and the third number is $5$ as well. The smallest sum is $5+5+5=15$.'
          - problem: 'A closed box of volume $512$ m$^3$ with the least possible surface area is painted once on the outside. One can of paint covers $12$ m$^2$. How many cans are needed?'
            answer: '32'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The box of least surface area for volume $512$ is a cube of side $8$ m, with surface area $6\cdot 64=384$ square meters. Each can covers $12$ square meters, so the number of cans is $384\div 12=32$.'
          - problem: 'A courier accepts a box only when length plus width plus height is at most $90$ cm. What is the largest volume such a box can have?'
            answer: '27000'
            answer_contract: {"kind":"unit","quantity":"cubic_volume","unit":"cm^3","allow_omitted":true}
            solution_sketch: 'The volume is largest when the sum is exactly $90$, so write $z=90-x-y$ and maximize $V=xy(90-x-y)$. Setting $V_x=0$ and $V_y=0$ gives $x=y=30$, so $z=30$. The largest volume is $30^3=27000$ cubic centimeters.'
        constraints: 'eliminate one variable with the given constraint, then solve grad = 0; answers are numbers or measured values (lengths, areas, volumes, costs) with small integer dimensions'
      - id: kp3
        name: 'Confirming the nature of the optimum'
        key_prerequisites: [multivariable-local-extrema]
        exemplars:
          - problem: 'The function $g(x,y)=x^2+y^2+(3-x-y)^2$ has a critical point at $(1,1)$. Find the discriminant $D=g_{xx}g_{yy}-g_{xy}^2$ there.'
            answer: '12'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The second partial derivatives are $g_{xx}=4$, $g_{yy}=4$ and $g_{xy}=2$ everywhere. So $D=4\cdot4-2^2=12$. Since $D>0$ and $g_{xx}>0$, the point is a local minimum.'
          - problem: 'The function $P(x,y)=xy(30-x-y)$ has a critical point at $(10,10)$. Is it a local maximum, a local minimum or a saddle point?'
            answer: 'maximum'
            answer_contract: {"kind":"label","options":[["maximum","local maximum","a local maximum","a maximum","max"],["minimum","local minimum","a local minimum","a minimum","min"],["saddle","saddle point","a saddle point"]]}
            solution_sketch: 'Expand $P=30xy-x^2y-xy^2$, so $P_{xx}=-2y=-20$, $P_{yy}=-2x=-20$ and $P_{xy}=30-2x-2y=-10$ at $(10,10)$. Then $D=(-20)(-20)-(-10)^2=300>0$ and $P_{xx}<0$. So the critical point is a local maximum.'
          - problem: 'The material needed for an open box is $S(x,y)=xy+\dfrac{512}{x}+\dfrac{512}{y}$ square meters, and $(8,8)$ is a critical point. Find the discriminant $D$ at that point.'
            answer: '3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The second partial derivatives are $S_{xx}=1024/x^3=2$, $S_{yy}=1024/y^3=2$ and $S_{xy}=1$ at $(8,8)$. So $D=2\cdot2-1^2=3$. Since $D>0$ and $S_{xx}>0$, the box has the least material there.'
          - problem: 'Sam finds $f_{xx}=2>0$ for $f(x,y)=x^2-4xy+y^2$ at its critical point $(0,0)$ and says the point is a local minimum. What is the correct classification of $(0,0)$?'
            answer: 'saddle'
            answer_contract: {"kind":"label","options":[["saddle","saddle point","a saddle point"],["minimum","local minimum","a local minimum","a minimum","min"],["maximum","local maximum","a local maximum","a maximum","max"]]}
            solution_sketch: 'The second partial derivatives are $f_{xx}=2$, $f_{yy}=2$ and $f_{xy}=-4$. So $D=2\cdot2-(-4)^2=-12<0$, and a negative $D$ always means a saddle point, whatever the sign of $f_{xx}$. Sam did not check $D$.'
          - problem: 'A firm''s profit, in thousands of dollars, is $\Pi(x,y)=-x^2-3y^2+4x+6y$, where $x$ and $y$ are the amounts of two inputs. Its only critical point is $(2,1)$, and the test shows that it is a maximum. What is the largest profit?'
            answer: '7'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The second partial derivatives are $\Pi_{xx}=-2$, $\Pi_{yy}=-6$ and $\Pi_{xy}=0$, so $D=12>0$ and the point is a maximum. The profit there is $-4-3+8+6=7$ thousand dollars.'
          - problem: 'The function $f(x,y)=3x^2+3y^2+2xy$ has a critical point at $(0,0)$. Find the discriminant $D$ there.'
            answer: '32'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The second partial derivatives are $f_{xx}=6$, $f_{yy}=6$ and $f_{xy}=2$. So $D=6\cdot6-2^2=32$. Since $D>0$ and $f_{xx}>0$, the origin is a local minimum.'
          - problem: 'The function $f(x,y)=x^2+4y^2-2x+8y$ has a critical point at $(1,-1)$. Find the discriminant $D$ there.'
            answer: '16'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The second partial derivatives are $f_{xx}=2$, $f_{yy}=8$ and $f_{xy}=0$. So $D=2\cdot8-0^2=16$. Since $D>0$ and $f_{xx}>0$, the point is a local minimum.'
        constraints: 'second partials evaluate to integers; D nonzero so the test is decisive; verdicts are answered with natural words (maximum, minimum, saddle point)'
    diagnostic_exemplar:
      problem: 'An open-top rectangular box must have volume $108$ m$^3$. Find the dimensions that minimize the material used (base plus four sides).'
      answer: 'Base $6 \times 6$ m with height $3$ m, using $108$ m$^2$ of material.'
      answer_contract: {kind: none}
      solution_sketch: 'With base $x \times y$ and height $z = \frac{108}{xy}$, the material is $S = xy + 2xz + 2yz = xy + \frac{216}{y} + \frac{216}{x}$. Then $S_x = y - \frac{216}{x^2} = 0$ and $S_y = x - \frac{216}{y^2} = 0$ force $x = y$ and $x^3 = 216$, so $x = y = 6$ and $z = 3$; $S = 36 + 36 + 36 = 108$.'
    anki_seeds:
      - front: 'When optimizing distance, what should you minimize instead of the distance itself?'
        back: 'The squared distance $d^2$ — it has the same minimizer and avoids square roots in the derivatives.'
        type: basic
      - front: 'Strategy for optimizing $f(x, y, z)$ with one equation constraint (without Lagrange)?'
        back: 'Solve the constraint for one variable, substitute, and find critical points of the resulting two-variable function.'
        type: basic

  - id: lagrange-multipliers-single-constraint
    name: "Lagrange Multipliers: One Constraint"
    core: true
    difficulty: 0.78
    drill: false
    answer_kind: numeric
    expected_time_secs: 240
    prerequisites:
      - id: gradient-directional-derivatives
        weight: 0.7
        key: true
      - id: multivariable-critical-points
        weight: 0.5
        key: true
      - id: systems-substitution
        weight: 0.3
        key: false
    knowledge_points:
      - id: kp1
        name: 'The Lagrange condition'
        key_prerequisites: [gradient-directional-derivatives, multivariable-critical-points]
        exemplars:
          - problem: 'Find the largest value of $f(x,y)=xy$ on the circle $x^2+y^2=18$.'
            answer: '9'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'With $g=x^2+y^2$, the condition $\nabla f=\lambda\nabla g$ gives $y=2\lambda x$ and $x=2\lambda y$, so $y^2=x^2$ and $y=\pm x$. The constraint gives $2x^2=18$, so $x=\pm3$. The values of $xy$ are $9$ at $(3,3)$ and $(-3,-3)$ and $-9$ at the other two points, so the largest value is $9$.'
          - problem: 'Find the smallest value of $f(x,y)=xy$ on the circle $x^2+y^2=32$.'
            answer: '-16'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The Lagrange equations $y=2\lambda x$ and $x=2\lambda y$ force $y=\pm x$, and the constraint gives $2x^2=32$, so $x=\pm4$. The values of $xy$ at the four points are $16$ and $-16$. The smallest value is $-16$.'
          - problem: 'Use Lagrange multipliers to find the largest value of $f(x,y)=x+3y$ on the ellipse $x^2+3y^2=16$.'
            answer: '8'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'With $g=x^2+3y^2$, the equations are $1=2\lambda x$ and $3=6\lambda y$, so $x=y$. The constraint becomes $4x^2=16$, so $x=\pm2$. Then $f=4x$ has largest value $8$ at $(2,2)$.'
          - problem: 'Use Lagrange multipliers for $f(x,y)=x+2y$ subject to $x^2+2y^2=12$. The maximum occurs at $(2,2)$. What is the value of $\lambda$ there?'
            answer: '1/4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Here $\nabla f=(1,2)$ and $\nabla g=(2x,4y)$, which is $(4,8)$ at $(2,2)$. The condition $(1,2)=\lambda(4,8)$ gives $\lambda=1/4$.'
          - problem: 'Use Lagrange multipliers to find the point where $f(x,y)=3x+4y$ is largest on the ellipse $3x^2+4y^2=28$.'
            answer: '(2, 2)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'The equations $3=6\lambda x$ and $4=8\lambda y$ give $x=y$. The constraint becomes $7x^2=28$, so $x=\pm2$. Then $f=7x$ is largest at $x=2$, so the point is $(2,2)$.'
          - problem: 'The temperature at a point $(x,y)$ of a metal plate is $T=2x+5y$ degrees Celsius. The edge of the plate is the ellipse $2x^2+5y^2=63$. What is the highest temperature on the edge?'
            answer: '21'
            answer_contract: {"kind":"unit","quantity":"temperature","unit":"°C","allow_omitted":true}
            solution_sketch: 'With $g=2x^2+5y^2$, the equations $2=4\lambda x$ and $5=10\lambda y$ give $x=y$. The constraint becomes $7x^2=63$, so $x=\pm3$. The temperature $T=7x$ is highest at $x=3$, where it equals $21$ degrees.'
          - problem: 'A factory can choose output levels $(x,y)$ of two products, in thousands of units, only along the curve $x^2+4y^2=45$. Each unit of the first product earns $1$ dollar and each unit of the second earns $4$ dollars. What is the greatest income, in thousands of dollars?'
            answer: '15'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The income is $f=x+4y$ and $g=x^2+4y^2$. The equations $1=2\lambda x$ and $4=8\lambda y$ give $x=y$, and the constraint gives $5x^2=45$, so $x=\pm3$. The income $5x$ is greatest at $x=3$, so the greatest income is $15$ thousand dollars.'
          - problem: 'Find the point in the second quadrant where $f(x,y)=xy$ is smallest on the circle $x^2+y^2=8$.'
            answer: '(-2, 2)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'The equations $y=2\lambda x$ and $x=2\lambda y$ give $y=\pm x$, and the constraint gives $2x^2=8$, so $x=\pm2$. The smallest value of $xy$ is $-4$, reached at $(2,-2)$ and $(-2,2)$. The point in the second quadrant, where $x<0$ and $y>0$, is $(-2,2)$.'
        constraints: 'systems written from grad f = lambda grad g; circle and ellipse constraints; answers are values, points, or the multiplier'
      - id: kp2
        name: 'Linear constraints'
        key_prerequisites: [gradient-directional-derivatives, systems-substitution]
        exemplars:
          - problem: 'Find the point with $x>0$ and $y>0$ on the line $x+y=10$ where the product $xy$ is largest.'
            answer: '(5, 5)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'With $f=xy$ and $g=x+y$, the condition $\nabla f=\lambda\nabla g$ gives $y=\lambda$ and $x=\lambda$, so $x=y$. The constraint $x+y=10$ then gives $2x=10$, so $x=5$ and $y=5$.'
          - problem: 'Find the point on the line $x+2y=5$ that is closest to the origin.'
            answer: '(1, 2)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'Minimize $f=x^2+y^2$ subject to $g=x+2y=5$. The equations $2x=\lambda$ and $2y=2\lambda$ give $y=2x$. Substituting into the constraint gives $x+4x=5$, so $x=1$ and $y=2$.'
          - problem: 'A rectangular pen is built against a long straight wall. Fence is used on the three other sides: two sides of length $x$ meters perpendicular to the wall, and one side of length $y$ meters parallel to it. There are $12$ m of fence. What is the largest area the pen can have?'
            answer: '18'
            answer_contract: {"kind":"unit","quantity":"area","unit":"m^2","allow_omitted":true}
            solution_sketch: 'The area is $f=xy$ and the fence gives $g=2x+y=12$. The equations $y=2\lambda$ and $x=\lambda$ give $y=2x$, so $4x=12$, $x=3$ and $y=6$. The largest area is $3\cdot6=18$ square meters.'
          - problem: 'What is the distance from the origin to the line $3x+y=10$?'
            answer: 'sqrt(10)'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Minimize $f=x^2+y^2$ subject to $3x+y=10$. The equations $2x=3\lambda$ and $2y=\lambda$ give $x=3y$, so $10y=10$, $y=1$ and $x=3$. The least value of $f$ is $9+1=10$, so the distance is $\sqrt{10}$.'
          - problem: 'A workshop spends a budget of $12$ thousand dollars on two inputs. One unit of labor costs $1$ thousand dollars and one unit of machine time costs $3$ thousand dollars. Output is $Q=xy$, where $x$ is the number of units of labor and $y$ the number of units of machine time. How many units of machine time give the greatest output?'
            answer: '2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The budget is $x+3y=12$. The equations $y=\lambda$ and $x=3\lambda$ give $x=3y$, so $6y=12$ and $y=2$. Then $x=6$, so the greatest output uses $2$ units of machine time.'
          - problem: 'Sam says that the point of the line $x+y=4$ closest to the origin is $(4,0)$, because the smallest value must come where one coordinate is zero. What is the correct closest point?'
            answer: '(2, 2)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'The point $(4,0)$ is at distance $4$, but $(2,2)$ is at distance $\sqrt8$. The Lagrange equations $2x=\lambda$ and $2y=\lambda$ give $x=y$, and the constraint gives $2x=4$. So the closest point is $(2,2)$.'
          - problem: 'The function $f(x,y)=x^2+y^2$ has its least value on the line $x+2y=5$ at the point $(1,2)$. At that point $\nabla f=\lambda\nabla g$ with $g(x,y)=x+2y$. What is $\lambda$?'
            answer: '2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Here $\nabla f=(2x,2y)=(2,4)$ at $(1,2)$ and $\nabla g=(1,2)$. The condition $(2,4)=\lambda(1,2)$ gives $\lambda=2$.'
        constraints: 'linear constraint, quadratic or product objective; answers are points, values, or the multiplier; contexts are budgets and fences'
      - id: kp3
        name: 'Circle constraints'
        key_prerequisites: [gradient-directional-derivatives, multivariable-critical-points]
        exemplars:
          - problem: 'Find the largest value of $f(x,y)=2x+3y$ on the circle $x^2+y^2=13$.'
            answer: '13'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The equations $2=2\lambda x$ and $3=2\lambda y$ give $x=1/\lambda$ and $y=3/(2\lambda)$. The constraint gives $13/(4\lambda^2)=13$, so $\lambda=\pm1/2$ and the points are $(2,3)$ and $(-2,-3)$. The values of $f$ are $13$ and $-13$, so the largest is $13$.'
          - problem: 'Find the smallest value of $f(x,y)=5x+12y$ on the circle $x^2+y^2=169$.'
            answer: '-169'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The equations $5=2\lambda x$ and $12=2\lambda y$ give $x=5t$ and $y=12t$ with $t=1/(2\lambda)$. The constraint gives $169t^2=169$, so $t=\pm1$. Then $f=169t$ has smallest value $-169$ at $(-5,-12)$.'
          - problem: 'Find the smallest value of $f(x,y)=x^2+xy+y^2$ on the circle $x^2+y^2=18$.'
            answer: '9'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The equations are $2x+y=2\lambda x$ and $x+2y=2\lambda y$. Adding them gives $x+y=0$ when $\lambda\neq 3/2$, and subtracting them gives $x=y$ when $\lambda\neq1/2$. The points $(3,-3)$ and $(-3,3)$ give $f=9$, and $(3,3)$ and $(-3,-3)$ give $f=27$, so the smallest value is $9$.'
          - problem: 'The function $f(x,y)=6x+8y$ has the largest value $60$ on the circle $x^2+y^2=r^2$. Find the radius $r$.'
            answer: '6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The equations $6=2\lambda x$ and $8=2\lambda y$ give $x=3/\lambda$ and $y=4/\lambda$, so the constraint is $25/\lambda^2=r^2$. Then the extreme values of $f$ are $\pm10r$, and $10r=60$ gives $r=6$.'
          - problem: 'For $f(x,y)=7x+24y$ on the circle $x^2+y^2=625$, the smallest value occurs at $(-7,-24)$. At that point $\nabla f=\lambda\nabla g$ with $g=x^2+y^2$. What is $\lambda$?'
            answer: '-1/2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Here $\nabla f=(7,24)$ and $\nabla g=(2x,2y)=(-14,-48)$ at $(-7,-24)$. The condition $(7,24)=\lambda(-14,-48)$ gives $\lambda=-1/2$.'
          - problem: 'A rectangle with sides parallel to the axes is inscribed in the circle $x^2+y^2=16$, with units in meters. A corner is at $(x,y)$ in the first quadrant. What is the largest area the rectangle can have?'
            answer: '32'
            answer_contract: {"kind":"unit","quantity":"area","unit":"m^2","allow_omitted":true}
            solution_sketch: 'The rectangle has sides $2x$ and $2y$, so its area is $4xy$. The equations $4y=2\lambda x$ and $4x=2\lambda y$ give $x=y$, and the constraint gives $2x^2=16$, so $x=y=2\sqrt2$. The area is $4\cdot8=32$ square meters.'
          - problem: 'A workshop makes $x$ and $y$ hundred units of two goods, limited by $x^2+y^2=100$. The profit is $3x+4y$ hundred dollars. What is the greatest profit, in hundreds of dollars?'
            answer: '50'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The equations $3=2\lambda x$ and $4=2\lambda y$ give $y=4x/3$. The constraint gives $25x^2/9=100$, so $x=6$ and $y=8$. The profit is $18+32=50$ hundred dollars.'
        constraints: 'circle radius chosen so the critical points have integer or simple fractional coordinates; answers are extreme values, points, radii, or multipliers'
    diagnostic_exemplar:
      problem: 'Use Lagrange multipliers to find the maximum value of $f(x, y) = x + 2y$ on the circle $x^2 + y^2 = 20$.'
      answer: 'Maximum $10$, at $(2, 4)$.'
      answer_contract: {kind: none}
      solution_sketch: '$\nabla f = \lambda \nabla g$ gives $1 = 2\lambda x$ and $2 = 2\lambda y$, so $y = 2x$. Substituting into $x^2 + y^2 = 20$ gives $5x^2 = 20$, $x = \pm 2$; $f(2,4) = 10$ and $f(-2,-4) = -10$.'
    anki_seeds:
      - front: 'Lagrange multiplier condition for extremizing $f$ subject to $g = c$?'
        back: '$\nabla f = \lambda \nabla g$ together with the constraint $g = c$.'
        type: basic
      - front: 'Geometric picture behind Lagrange multipliers?'
        back: 'At a constrained extremum the level curve of $f$ is tangent to the constraint curve, so the two gradients are parallel.'
        type: basic

  - id: lagrange-multipliers
    name: "Lagrange Multipliers: Harder Problems and Two Constraints"
    core: false                # harder-problem extension of the single-constraint method; terminal
    difficulty: 0.84
    drill: false
    answer_kind: numeric
    expected_time_secs: 300
    prerequisites:
      - id: lagrange-multipliers-single-constraint
        weight: 0.8
        key: true
      - id: multivariable-local-extrema
        weight: 0.5
        key: true
      - id: systems-elimination
        weight: 0.3
        key: false
    knowledge_points:
      - id: kp1
        name: 'Three variables and applied problems'
        key_prerequisites: [lagrange-multipliers-single-constraint, multivariable-local-extrema]
        exemplars:
          - problem: 'Use Lagrange multipliers to find the distance from the origin to the plane $x+2y+2z=12$.'
            answer: '4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Minimize $f=x^2+y^2+z^2$ subject to $x+2y+2z=12$. The equations $2x=\lambda$, $2y=2\lambda$ and $2z=2\lambda$ give $y=z=2x$, so $9x=12$ and $x=4/3$. The closest point is $(4/3,8/3,8/3)$, at distance $\sqrt{(16+64+64)/9}=4$.'
          - problem: 'Three positive numbers $x$, $y$ and $z$ have sum $15$. Use Lagrange multipliers to find the largest possible value of $xyz$.'
            answer: '125'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'With $f=xyz$ and $g=x+y+z$, the equations are $yz=\lambda$, $xz=\lambda$ and $xy=\lambda$. Since the numbers are positive, $x=y=z$, so $3x=15$ and $x=5$. The largest product is $5\cdot5\cdot5=125$.'
          - problem: 'A closed rectangular box has volume $64$ m$^3$. Use Lagrange multipliers to find the least surface area it can have.'
            answer: '96'
            answer_contract: {"kind":"unit","quantity":"area","unit":"m^2","allow_omitted":true}
            solution_sketch: 'Minimize $S=2(xy+yz+xz)$ subject to $xyz=64$. The equations $y+z=\lambda yz$, $x+z=\lambda xz$ and $x+y=\lambda xy$ force $x=y=z$, and $x^3=64$ gives $x=4$. Then $S=2(16+16+16)=96$ square meters.'
          - problem: 'Find the point on the plane $x+y+z=6$ that is closest to the origin.'
            answer: '(2, 2, 2)'
            answer_contract: {"kind":"coordinates","arity":3}
            solution_sketch: 'Minimize $x^2+y^2+z^2$ subject to $x+y+z=6$. The equations $2x=\lambda$, $2y=\lambda$ and $2z=\lambda$ give $x=y=z$, so $3x=6$ and $x=2$. The closest point is $(2,2,2)$.'
          - problem: 'Three positive numbers $x$, $y$ and $z$ have sum $12$. Use Lagrange multipliers to find the largest possible value of $xy+yz+xz$.'
            answer: '48'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'With $g=x+y+z$, the equations are $y+z=\lambda$, $x+z=\lambda$ and $x+y=\lambda$, which give $x=y=z$. The constraint gives $3x=12$, so $x=4$. The largest value is $16+16+16=48$.'
          - problem: 'A gift box is tied with $96$ cm of ribbon that runs once along each of its $12$ edges. The box has length $x$, width $y$ and height $z$. What is the largest volume the box can have?'
            answer: '512'
            answer_contract: {"kind":"unit","quantity":"cubic_volume","unit":"cm^3","allow_omitted":true}
            solution_sketch: 'The $12$ edges are four of each length, so $4(x+y+z)=96$ and $x+y+z=24$. The equations $yz=\lambda$, $xz=\lambda$ and $xy=\lambda$ give $x=y=z=8$. The largest volume is $8^3=512$ cubic centimeters.'
          - problem: 'Find the least value of $f=x^2+y^2+z^2$ for positive $x$, $y$ and $z$ with $x+y+z=9$.'
            answer: '27'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The equations $2x=\lambda$, $2y=\lambda$ and $2z=\lambda$ give $x=y=z$, so $3x=9$ and $x=3$. The least value is $9+9+9=27$.'
        constraints: 'symmetric objectives so the multiplier system solves by ratios; distances come out as integers or simple radicals; contexts are boxes and ribbon'
      - id: kp2
        name: 'Harder constraints and exceptional cases'
        key_prerequisites: [lagrange-multipliers-single-constraint, multivariable-local-extrema]
        exemplars:
          - problem: 'Find the largest value of $f(x,y)=xy$ on the ellipse $\dfrac{x^2}{8}+\dfrac{y^2}{2}=1$.'
            answer: '2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The equations are $y=\lambda x/4$ and $x=\lambda y$. Multiplying them by $x$ and $y$ gives $x^2=4y^2$, and the ellipse becomes $y^2=1$. So $y=\pm1$, $x=\pm2$, and the values of $xy$ are $\pm2$. The largest is $2$.'
          - problem: 'Find the smallest value of $f(x,y)=x^2y$ on the circle $x^2+y^2=3$.'
            answer: '-2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The equations are $2xy=2\lambda x$ and $x^2=2\lambda y$. The first gives $x=0$ or $\lambda=y$. If $x=0$, then $f=0$. If $\lambda=y$, then $x^2=2y^2$, so $3y^2=3$ and $y=\pm1$, with $f=2y=\pm2$. The smallest value is $-2$.'
          - problem: 'A beam of width $w$ and depth $h$, both in decimeters, is cut from a round log, so that $w^2+h^2=12$. The strength of the beam is proportional to $wh^2$. What is the largest value of $wh^2$?'
            answer: '16'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The equations are $h^2=2\lambda w$ and $2wh=2\lambda h$. The second gives $\lambda=w$ for $h\neq0$, so $h^2=2w^2$. The constraint gives $3w^2=12$, so $w=2$ and $h^2=8$. Then $wh^2=16$, and the cases $h=0$ or $w=0$ give $0$.'
          - problem: 'Find the largest value of $f(x,y)=x^2y^2$ on the ellipse $\dfrac{x^2}{8}+\dfrac{y^2}{2}=1$.'
            answer: '4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The equations are $2xy^2=\lambda x/4$ and $2x^2y=\lambda y$. The branches with $x=0$ or $y=0$ give $f=0$. Otherwise $\lambda=8y^2=2x^2$, so $x^2=4y^2$, and the ellipse gives $y^2=1$ and $x^2=4$. Then $f=4$.'
          - problem: 'A closed cylinder is inscribed in a sphere of radius $\sqrt3$ m, so that its radius $r$ and half its height $z$ satisfy $r^2+z^2=3$. The volume of the cylinder is $2\pi r^2z$. What is its largest volume?'
            answer: '4pi'
            answer_contract: {"kind":"unit","quantity":"cubic_volume","unit":"m^3","allow_omitted":true}
            solution_sketch: 'Maximize $r^2z$ subject to $r^2+z^2=3$. The equations $2rz=2\lambda r$ and $r^2=2\lambda z$ give $\lambda=z$ for $r\neq0$, so $r^2=2z^2$. The constraint gives $3z^2=3$, so $z=1$ and $r^2=2$. Then $V=2\pi\cdot2=4\pi$ cubic meters.'
          - problem: 'Sam looks for the smallest value of $f(x,y)=x^2y^2$ on the ellipse $\dfrac{x^2}{8}+\dfrac{y^2}{2}=1$. He divides each Lagrange equation by $x$ or $y$, finds only the points $(\pm2,\pm1)$ where $f=4$, and says the smallest value is $4$. What is the correct smallest value?'
            answer: '0'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Dividing by $x$ or $y$ drops the branches $x=0$ and $y=0$. The ellipse contains $(0,\pm\sqrt2)$ and $(\pm2\sqrt2,0)$, where $f=0$. Since $f\geq0$ everywhere, the smallest value is $0$, and the value $4$ is the largest.'
          - problem: 'Find the largest value of $f(x,y)=x^2y$ on the ellipse $\dfrac{x^2}{4}+y^2=1$.'
            answer: '8sqrt(3)/9'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The equations are $2xy=\lambda x/2$ and $x^2=2\lambda y$. The branch $x=0$ gives $f=0$. Otherwise $\lambda=4y$ and $x^2=8y^2$, so $3y^2=1$ and $y=\pm1/\sqrt3$. Then $f=x^2y=8y^3=8/(3\sqrt3)=8\sqrt3/9$ at $y=1/\sqrt3$.'
          - problem: 'Find the largest value of $f(x,y)=xy^2$ on the circle $x^2+y^2=4$.'
            answer: '16sqrt(3)/9'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The equations are $y^2=2\lambda x$ and $2xy=2\lambda y$. The branch $y=0$ gives $f=0$. Otherwise $\lambda=x$ and $y^2=2x^2$, so $3x^2=4$ and $x=\pm2/\sqrt3$. Then $f=x\cdot2x^2=2x^3=16/(3\sqrt3)=16\sqrt3/9$ at $x=2/\sqrt3$.'
        constraints: 'ellipse or circle constraints; the multiplier system branches (x = 0 case must be checked); answers exact with small radicals; contexts are a beam, a cylinder in a sphere, and an error analysis'
      - id: kp3
        name: 'Two constraints'
        key_prerequisites: [lagrange-multipliers-single-constraint, multivariable-local-extrema]
        try_first:
          problem: 'What is the least value of $x^2+y^2+z^2$ at points that satisfy both $x=1$ and $y=2$?'
          answer_contract: {"kind":"exact"}
          answer: '5'
