        exemplars:
          - problem: 'Find the largest value of $f(x,y,z)=x+y+z$ on the circle where the sphere $x^2+y^2+z^2=4$ meets the plane $z=1$.'
            answer: '1+sqrt(6)'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Write $\nabla f=\lambda\nabla g+\mu\nabla h$ with $g=x^2+y^2+z^2$ and $h=z$. The first two components give $1=2\lambda x$ and $1=2\lambda y$, so $x=y$. With $z=1$, the sphere gives $2x^2+1=4$, so $x=\pm\sqrt6/2$. Then $f=2x+1$ is largest at $x=\sqrt6/2$, where $f=1+\sqrt6$.'
          - problem: 'Find the least value of $x^2+y^2+z^2$ when $x+y+z=6$ and $x-y=0$.'
            answer: '12'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The conditions are $2x=\lambda+\mu$, $2y=\lambda-\mu$ and $2z=\lambda$. Since $x=y$, $\mu=0$ and then $x=z$ as well. The constraint gives $3x=6$, so $x=y=z=2$, and the least value is $4+4+4=12$.'
          - problem: 'A cable runs along the straight line where the wall $x+2y=5$ meets the ceiling $z=2$, with coordinates in meters measured from a sensor at the origin. How close does the cable come to the sensor?'
            answer: '3'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'Minimize $x^2+y^2+z^2$ subject to $x+2y=5$ and $z=2$. The equations $2x=\lambda$ and $2y=2\lambda$ give $y=2x$, so $5x=5$, $x=1$ and $y=2$. The least squared distance is $1+4+4=9$, so the cable comes within $3$ meters.'
          - problem: 'Find the largest value of $f(x,y,z)=x+2y+2z$ on the circle where the sphere $x^2+y^2+z^2=9$ meets the plane $z=1$.'
            answer: '2+2sqrt(10)'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The first two components give $1=2\lambda x$ and $2=2\lambda y$, so $y=2x$. With $z=1$ the sphere gives $5x^2=8$, so $x=\pm2\sqrt{10}/5$. Then $f=5x+2$ is largest at the positive value, where $f=2+2\sqrt{10}$.'
          - problem: 'Find the largest value of $f(x,y,z)=x+y+2z$ on the circle where the sphere $x^2+y^2+z^2=9$ meets the plane $z=1$.'
            answer: '6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The first two components give $x=y$. With $z=1$ the sphere gives $2x^2=8$, so $x=y=\pm2$. Then $f=2x+2$ is largest at $x=2$, where $f=6$.'
          - problem: 'Find the largest value of $xyz$ on the intersection of the sphere $x^2+y^2+z^2=12$ and the plane $x+y+z=0$.'
            answer: '4sqrt(2)'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Write $yz=2\lambda x+\mu$, $xz=2\lambda y+\mu$ and $xy=2\lambda z+\mu$. Subtracting the first two equations gives $(x-y)(2\lambda+z)=0$, and the same holds for each pair, so at an extreme point two of the numbers are equal, say $x=y=t$. The plane gives $z=-2t$ and the sphere gives $6t^2=12$, so $t=\pm\sqrt2$. Then $xyz=-2t^3$ is largest at $t=-\sqrt2$, where it equals $4\sqrt2$.'
          - problem: 'A drone flies along the circle where the sphere $x^2+y^2+z^2=14$ meets the plane $z=3$, with coordinates in meters from a lamp. The light it receives is $I=2x+y+z$ lux. What is the largest light value on its path?'
