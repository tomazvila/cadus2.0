unit: gradient-optimization
course: multivariable-calculus
module: "Gradients & Optimization"
topics:
  - id: computing-the-gradient
    name: "Computing the Gradient"
    core: true
    difficulty: 0.66
    drill: false
    answer_kind: numeric
    expected_time_secs: 90
    prerequisites:
      - id: partial-derivatives
        weight: 0.8
        key: true
      - id: vectors-in-rn
        weight: 0.4
        key: false
    knowledge_points:
      - id: kp1
        name: "Gradients of two-variable functions"
        key_prerequisites: [partial-derivatives]
        exemplars:
          - problem: "Let f(x, y) = 4x^2 + 3y^2. Evaluate the gradient at the point (2, 1) and give the answer as (fx, fy)."
            answer: "(16, 6)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "The gradient is the vector of partial derivatives. First, fx = 8x by the power rule, and fy = 6y by the power rule. At (2, 1), fx = 8*2 = 16 and fy = 6*1 = 6. So the gradient is (16, 6)."
          - problem: "Let f(x, y) = x^3 y^2. Evaluate the gradient at (1, 2) and give the answer as (fx, fy)."
            answer: "(12, 4)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "The gradient is the vector of partial derivatives. First, fx = 3x^2 y^2 by the power rule because y is constant, and fy = 2x^3 y by the power rule because x is constant. At (1, 2), fx = 3*1*4 = 12 and fy = 2*1*2 = 4. So the gradient is (12, 4)."
          - problem: "Let f(x, y) = 5x^2 y + y^3. Find fx and fy."
            answer: "fx = 10xy; fy = 5x^2+3y^2"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "function", "vars": ["x", "y"]}, "name": "fx"}, {"contract": {"kind": "function", "vars": ["x", "y"]}, "name": "fy"}]}
            solution_sketch: "Write the gradient as the pair of partial derivatives. For fx, treat y as a constant: the derivative of 5x^2 y is 10xy, and y^3 has derivative 0, so fx = 10xy. For fy, treat x as a constant: the derivative of 5x^2 y is 5x^2, and the derivative of y^3 is 3y^2, so fy = 5x^2+3y^2. Thus fx = 10xy; fy = 5x^2+3y^2."
          - problem: "Let f(x, y) = x^2 + 6xy - y^2. Give fx and fy."
            answer: "fx = 2x+6y; fy = 6x-2y"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "function", "vars": ["x", "y"]}, "name": "fx"}, {"contract": {"kind": "function", "vars": ["x", "y"]}, "name": "fy"}]}
            solution_sketch: "Compute each partial derivative by treating the other variable as a constant. For fx, x^2 gives 2x, 6xy gives 6y, and -y^2 gives 0, so fx = 2x+6y. For fy, x^2 gives 0, 6xy gives 6x, and -y^2 gives -2y, so fy = 6x-2y. The gradient is fx = 2x+6y; fy = 6x-2y."
          - problem: "Let f(x, y) = 2x^3 - 4xy + y^2. Evaluate the gradient at (1, 3) and give the answer as (fx, fy)."
            answer: "(-6, 2)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "Find the partial derivatives first. fx = 6x^2 - 4y by the power rule, and fy = -4x + 2y by the power rule. At (1, 3), fx = 6 - 12 = -6 and fy = -4 + 6 = 2. The gradient at (1, 3) is (-6, 2)."
          - problem: "Let f(x, y) = x^2 y^2 - 3x. Evaluate the gradient at (2, 1) and give the answer as (fx, fy)."
            answer: "(1, 8)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "Compute the partial derivatives first. fx = 2x y^2 - 3, and fy = 2x^2 y. At (2, 1), fx = 2*2*1 - 3 = 1 and fy = 2*4*1 = 8. The gradient at (2, 1) is (1, 8)."
        constraints: "polynomial integrands; evaluation points give small integer components"
      - id: kp2
        name: "Gradients requiring the product, quotient, or chain rule"
        key_prerequisites: [partial-derivatives]
        exemplars:
          - problem: "Let f(x, y) = ln(x^2+y^2). Find the gradient, and give fx and fy."
            answer: "fx = 2x/(x^2+y^2); fy = 2y/(x^2+y^2)"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "function", "vars": ["x", "y"]}, "name": "fx"}, {"contract": {"kind": "function", "vars": ["x", "y"]}, "name": "fy"}]}
            solution_sketch: "Start with f(x, y) = ln(x^2+y^2). The chain rule gives f_x = (1/(x^2+y^2)) * 2x = 2x/(x^2+y^2). The same chain rule gives f_y = (1/(x^2+y^2)) * 2y = 2y/(x^2+y^2). Therefore fx = 2x/(x^2+y^2); fy = 2y/(x^2+y^2)."
          - problem: "Let f(x, y) = x e^(xy). Find the gradient, and give fx and fy."
            answer: "fx = (1+xy)e^(xy); fy = x^2e^(xy)"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "function", "vars": ["x", "y"]}, "name": "fx"}, {"contract": {"kind": "function", "vars": ["x", "y"]}, "name": "fy"}]}
            solution_sketch: "Start with f(x, y) = x e^(xy). By the product rule with a chain-rule factor, f_x = e^(xy) + x*y e^(xy) = (1+xy)e^(xy). Because the derivative of the exponent xy in y is x, f_y = x*x e^(xy) = x^2e^(xy). Thus fx = (1+xy)e^(xy); fy = x^2e^(xy)."
          - problem: "Let f(x, y) = sqrt(x^2+y^2). Find the gradient, and give fx and fy."
            answer: "fx = x/sqrt(x^2+y^2); fy = y/sqrt(x^2+y^2)"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "function", "vars": ["x", "y"]}, "name": "fx"}, {"contract": {"kind": "function", "vars": ["x", "y"]}, "name": "fy"}]}
            solution_sketch: "Start with f(x, y) = sqrt(x^2+y^2). The chain rule with the outer square root gives f_x = (1/(2sqrt(x^2+y^2)))*2x = x/sqrt(x^2+y^2). Symmetry gives f_y = y/sqrt(x^2+y^2). Therefore fx = x/sqrt(x^2+y^2); fy = y/sqrt(x^2+y^2)."
          - problem: "Let f(x, y) = x/(x^2+y^2). Find the gradient, and give fx and fy."
            answer: "fx = (y^2-x^2)/(x^2+y^2)^2; fy = -2xy/(x^2+y^2)^2"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "function", "vars": ["x", "y"]}, "name": "fx"}, {"contract": {"kind": "function", "vars": ["x", "y"]}, "name": "fy"}]}
            solution_sketch: "Start with f(x, y) = x/(x^2+y^2). The quotient rule in x gives f_x = ((x^2+y^2) - x(2x))/(x^2+y^2)^2 = (y^2-x^2)/(x^2+y^2)^2. The quotient rule in y gives f_y = (0 - x(2y))/(x^2+y^2)^2 = -2xy/(x^2+y^2)^2. Therefore fx = (y^2-x^2)/(x^2+y^2)^2; fy = -2xy/(x^2+y^2)^2."
          - problem: "Let f(x, y) = e^(x^2+y^2). Find the gradient, and give fx and fy."
            answer: "fx = 2x e^(x^2+y^2); fy = 2y e^(x^2+y^2)"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "function", "vars": ["x", "y"]}, "name": "fx"}, {"contract": {"kind": "function", "vars": ["x", "y"]}, "name": "fy"}]}
            solution_sketch: "Start with f(x, y) = e^(x^2+y^2). The chain rule in x gives f_x = e^(x^2+y^2)*2x = 2x e^(x^2+y^2). The chain rule in y gives f_y = e^(x^2+y^2)*2y = 2y e^(x^2+y^2). Thus fx = 2x e^(x^2+y^2); fy = 2y e^(x^2+y^2)."
          - problem: "Let f(x, y) = x ln(y^2+1). Find the gradient, and give fx and fy."
            answer: "fx = ln(y^2+1); fy = 2xy/(y^2+1)"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "function", "vars": ["x", "y"]}, "name": "fx"}, {"contract": {"kind": "function", "vars": ["x", "y"]}, "name": "fy"}]}
            solution_sketch: "Start with f(x, y) = x ln(y^2+1). The product rule in x gives f_x = ln(y^2+1). The product rule in y with the chain rule gives f_y = x*(2y/(y^2+1)) = 2xy/(y^2+1). Thus fx = ln(y^2+1); fy = 2xy/(y^2+1)."
        constraints: "one composite or product structure per function (e^{xy}, ln(x^2+y^2), sqrt); results factor cleanly"
      - id: kp3
        name: "Gradients in three variables"
        key_prerequisites: [partial-derivatives, vectors-in-rn]
        exemplars:
          - problem: "Let f(x, y, z) = xyz. Evaluate the gradient of f at the point (2, 1, 4). Give the answer as (fx, fy, fz)."
            answer: "(4, 8, 2)"
            answer_contract: {"arity": 3, "kind": "coordinates"}
            solution_sketch: "For f(x, y, z) = xyz, the gradient is (yz, xz, xy). Use the product rule for each partial derivative. At (2, 1, 4): yz = 1*4 = 4, xz = 2*4 = 8, xy = 2*1 = 2. The gradient is (4, 8, 2)."
          - problem: "Let f(x, y, z) = x^2 + y^2 + z^2. Evaluate the gradient of f at (3, -1, 2). Give the answer as (fx, fy, fz)."
            answer: "(6, -2, 4)"
            answer_contract: {"arity": 3, "kind": "coordinates"}
            solution_sketch: "For f(x, y, z) = x^2 + y^2 + z^2, the gradient is (2x, 2y, 2z). Use the power rule on each term. At (3, -1, 2): 2x = 6, 2y = -2, 2z = 4. The gradient is (6, -2, 4)."
          - problem: "Let f(x, y, z) = x^2 y + z^3. Evaluate the gradient of f at (2, 3, -1). Give the answer as (fx, fy, fz)."
            answer: "(12, 4, 3)"
            answer_contract: {"arity": 3, "kind": "coordinates"}
            solution_sketch: "For f(x, y, z) = x^2 y + z^3, the gradient is (2xy, x^2, 3z^2). Use the power and product rules on the partial derivatives. At (2, 3, -1): 2xy = 2*2*3 = 12, x^2 = 4, 3z^2 = 3*1 = 3. The gradient is (12, 4, 3)."
          - problem: "Let f(x, y, z) = xyz + x^2 + y^2 + z^2. Evaluate the gradient of f at (1, 2, -1). Give the answer as (fx, fy, fz)."
            answer: "(0, 3, 0)"
            answer_contract: {"arity": 3, "kind": "coordinates"}
            solution_sketch: "For f(x, y, z) = xyz + x^2 + y^2 + z^2, the gradient is (yz + 2x, xz + 2y, xy + 2z). Differentiate each term with the product and power rules. At (1, 2, -1): yz + 2x = -2 + 2 = 0, xz + 2y = -1 + 4 = 3, xy + 2z = 2 - 2 = 0. The gradient is (0, 3, 0)."
          - problem: "Let f(x, y, z) = x^3 + y^3 + z^3. Evaluate the gradient of f at (-1, 2, -2). Give the answer as (fx, fy, fz)."
            answer: "(3, 12, 12)"
            answer_contract: {"arity": 3, "kind": "coordinates"}
            solution_sketch: "For f(x, y, z) = x^3 + y^3 + z^3, the gradient is (3x^2, 3y^2, 3z^2). Use the power rule on each term. At (-1, 2, -2): 3x^2 = 3, 3y^2 = 12, 3z^2 = 12. The gradient is (3, 12, 12)."
          - problem: "Let f(x, y, z) = xy + yz + zx. Evaluate the gradient of f at (2, -3, 4). Give the answer as (fx, fy, fz)."
            answer: "(1, 6, -1)"
            answer_contract: {"arity": 3, "kind": "coordinates"}
            solution_sketch: "For f(x, y, z) = xy + yz + zx, the gradient is (y + z, x + z, x + y). Use the sum and product rules on the partial derivatives. At (2, -3, 4): y + z = 1, x + z = 6, x + y = -1. The gradient is (1, 6, -1)."
        constraints: "three-variable polynomials of degree at most 3; integer evaluation points"
    diagnostic_exemplar:
      problem: 'Let $f(x, y, z) = x^2 y e^{z}$. Evaluate $\nabla f(1, 2, 0)$.'
      answer: '$\langle 4, 1, 2 \rangle$'
      answer_contract: {kind: none}
      solution_sketch: '$\nabla f = \langle 2xy e^z,\; x^2 e^z,\; x^2 y e^z \rangle$; at $(1, 2, 0)$ this is $\langle 4, 1, 2 \rangle$.'
    anki_seeds:
      - front: 'Definition of the gradient $\nabla f$ for $f(x, y)$?'
        back: '$\nabla f = \langle f_x, f_y \rangle$ — the vector of partial derivatives.'
        type: basic
      - front: 'Gradient of $f(x, y, z)$?'
        back: '$\nabla f = \langle f_x, f_y, f_z \rangle$'
        type: basic

  - id: gradient-directional-derivatives
    name: "Directional Derivatives and Steepest Ascent"
    core: true
    difficulty: 0.75
    drill: false
    answer_kind: numeric
    expected_time_secs: 180
    prerequisites:
      - id: computing-the-gradient
        weight: 0.8
        key: true
      - id: dot-product
        weight: 0.6
        key: true
      - id: tangent-planes-linear-approximation
        weight: 0.3
        key: false
    knowledge_points:
      - id: kp1
        name: "Directional derivatives"
        key_prerequisites: [computing-the-gradient, dot-product]
        exemplars:
          - problem: 'Find the directional derivative of $f(x, y) = x^2 + y^2$ at $(1, 2)$ in the direction of $\mathbf{v} = \langle 3, 4 \rangle$.'
            answer: '$\frac{22}{5}$'
            solution_sketch: '$\nabla f(1,2) = \langle 2, 4 \rangle$; unit vector $\mathbf{u} = \langle \frac{3}{5}, \frac{4}{5} \rangle$; $D_{\mathbf{u}} f = \frac{6}{5} + \frac{16}{5} = \frac{22}{5}$.'
          - problem: "Find the directional derivative of f(x, y) = x y^2 at (2, 1) in the direction of v = <3, 4> as a fraction."
            answer: "19/5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1, gradient: for f(x, y) = x y^2, grad f = <y^2, 2xy>, so grad f(2, 1) = <1, 4>. Step 2, unit direction: the length of <3, 4> is 5, so u = <3/5, 4/5>. Step 3, dot product: <1, 4> dot <3/5, 4/5> = 3/5 + 16/5 = 19/5. The directional derivative is 19/5."
          - problem: "Find the directional derivative of f(x, y) = x^2 + 3xy at (1, 2) in the direction of v = <5, 12> as a fraction."
            answer: "76/13"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1, gradient: for f(x, y) = x^2 + 3xy, grad f = <2x + 3y, 3x>, so grad f(1, 2) = <8, 3>. Step 2, unit direction: the length of <5, 12> is 13, so u = <5/13, 12/13>. Step 3, dot product: <8, 3> dot <5/13, 12/13> = 40/13 + 36/13 = 76/13. The directional derivative is 76/13."
          - problem: "Find the directional derivative of f(x, y) = x^2 - y^2 at (3, 1) in the direction of the unit vector v = <1/sqrt(2), -1/sqrt(2)> as an exact value."
            answer: "4sqrt(2)"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1, gradient: for f(x, y) = x^2 - y^2, grad f = <2x, -2y>, so grad f(3, 1) = <6, -2>. Step 2, direction: the vector <1/sqrt(2), -1/sqrt(2)> is already unit. Step 3, dot product: <6, -2> dot <1/sqrt(2), -1/sqrt(2)> = 8/sqrt(2) = 4sqrt(2). The directional derivative is 4sqrt(2)."
          - problem: "Find the directional derivative of f(x, y, z) = x y + y z at (1, 2, 3) in the direction of v = <1, 2, 2> as a fraction."
            answer: "14/3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1, gradient: for f(x, y, z) = x y + y z, grad f = <y, x + z, y>, so grad f(1, 2, 3) = <2, 4, 2>. Step 2, unit direction: the length of <1, 2, 2> is 3, so u = <1/3, 2/3, 2/3>. Step 3, dot product: <2, 4, 2> dot <1/3, 2/3, 2/3> = 2/3 + 8/3 + 4/3 = 14/3. The directional derivative is 14/3."
          - problem: "Find the directional derivative of f(x, y) = x^3 + y^2 at (1, -1) in the direction of v = <4, 3> as a fraction."
            answer: "6/5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1, gradient: for f(x, y) = x^3 + y^2, grad f = <3x^2, 2y>, so grad f(1, -1) = <3, -2>. Step 2, unit direction: the length of <4, 3> is 5, so u = <4/5, 3/5>. Step 3, dot product: <3, -2> dot <4/5, 3/5> = 12/5 - 6/5 = 6/5. The directional derivative is 6/5."
        constraints: "direction vectors are Pythagorean-triple multiples or unit diagonals; ALWAYS require normalization when |v| != 1"
      - id: kp2
        name: "Steepest ascent and descent"
        key_prerequisites: [computing-the-gradient, dot-product]
        exemplars:
          - problem: "A hill has height $f(x, y) = x^2 + 2y^2$ metres. A hiker is at the point $(3, 1)$. Find the unit vector in the direction of steepest ascent and the rate of change in that direction, giving the direction as (a, b)."
            answer: "dir = (3/sqrt(13), 2/sqrt(13)); rate = 2sqrt(13)"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"arity": 2, "kind": "coordinates"}, "name": "dir"}, {"contract": {"kind": "exact"}, "name": "rate"}]}
            solution_sketch: "The full result is dir = (3/sqrt(13), 2/sqrt(13)); rate = 2sqrt(13). Step 1 (partial derivatives): f_x = 2x and f_y = 4y, so the gradient at (3, 1) is (6, 4). Step 2 (steepest ascent): the gradient points in the direction of fastest increase. Step 3 (normalize): its magnitude is sqrt(52) = 2sqrt(13), so dividing the gradient by that magnitude gives the unit direction. The asked result is dir = (3/sqrt(13), 2/sqrt(13)); rate = 2sqrt(13)."
          - problem: "The temperature on a flat plate is $f(x, y) = 2x^2 + y^2$ degrees at the point $(x, y)$. A probe is placed at $(1, 2)$. Find the unit vector in the direction of steepest descent and the rate of change in that direction, giving the direction as (a, b)."
            answer: "dir = (-1/sqrt(2), -1/sqrt(2)); rate = -4sqrt(2)"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"arity": 2, "kind": "coordinates"}, "name": "dir"}, {"contract": {"kind": "exact"}, "name": "rate"}]}
            solution_sketch: "The full result is dir = (-1/sqrt(2), -1/sqrt(2)); rate = -4sqrt(2). Step 1 (partial derivatives): f_x = 4x and f_y = 2y, so the gradient at (1, 2) is (4, 4). Step 2 (steepest descent): the direction of fastest decrease is the opposite of the gradient vector. Step 3 (normalize): the magnitude is sqrt(32) = 4sqrt(2), so the unit direction is (-1/sqrt(2), -1/sqrt(2)) and the rate there is negative. The asked result is dir = (-1/sqrt(2), -1/sqrt(2)); rate = -4sqrt(2)."
          - problem: "The depth of a lake is $f(x, y) = x^2 y$ metres at the point $(x, y)$. A boat is at $(2, 2)$. Find the unit vector in the direction of steepest ascent and the rate of change in that direction, giving the direction as (a, b)."
            answer: "dir = (2/sqrt(5), 1/sqrt(5)); rate = 4sqrt(5)"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"arity": 2, "kind": "coordinates"}, "name": "dir"}, {"contract": {"kind": "exact"}, "name": "rate"}]}
            solution_sketch: "The full result is dir = (2/sqrt(5), 1/sqrt(5)); rate = 4sqrt(5). Step 1 (partial derivatives): f_x = 2xy and f_y = x^2, so the gradient at (2, 2) is (8, 4). Step 2 (steepest ascent): the gradient gives the uphill direction. Step 3 (normalize): the magnitude is sqrt(80) = 4sqrt(5), so dividing the gradient by it gives the unit direction. The asked result is dir = (2/sqrt(5), 1/sqrt(5)); rate = 4sqrt(5)."
          - problem: "The square of the distance from the origin is $f(x, y, z) = x^2 + y^2 + z^2$ at the point $(x, y, z)$. A particle sits at $(1, 1, 2)$. Find the unit vector in the direction of steepest ascent and the rate of change in that direction, giving the direction as (a, b, c)."
            answer: "dir = (1/sqrt(6), 1/sqrt(6), 2/sqrt(6)); rate = 2sqrt(6)"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"arity": 3, "kind": "coordinates"}, "name": "dir"}, {"contract": {"kind": "exact"}, "name": "rate"}]}
            solution_sketch: "The full result is dir = (1/sqrt(6), 1/sqrt(6), 2/sqrt(6)); rate = 2sqrt(6). Step 1 (partial derivatives): f_x = 2x, f_y = 2y and f_z = 2z, so the gradient at (1, 1, 2) is (2, 2, 4). Step 2 (steepest ascent): the gradient points toward fastest increase. Step 3 (normalize): its length is sqrt(24) = 2sqrt(6), so dividing gives the unit vector. The asked result is dir = (1/sqrt(6), 1/sqrt(6), 2/sqrt(6)); rate = 2sqrt(6)."
          - problem: "A pressure field on a surface is $f(x, y) = xy$ units at the point $(x, y)$. A sensor is at $(1, 3)$. Find the unit vector in the direction of steepest descent and the rate of change in that direction, giving the direction as (a, b)."
            answer: "dir = (-3/sqrt(10), -1/sqrt(10)); rate = -sqrt(10)"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"arity": 2, "kind": "coordinates"}, "name": "dir"}, {"contract": {"kind": "exact"}, "name": "rate"}]}
            solution_sketch: "The full result is dir = (-3/sqrt(10), -1/sqrt(10)); rate = -sqrt(10). Step 1 (partial derivatives): f_x = y and f_y = x, so the gradient at (1, 3) is (3, 1). Step 2 (steepest descent): the downhill direction is the negative of the gradient. Step 3 (normalize): the magnitude is sqrt(10), so the unit direction is (-3/sqrt(10), -1/sqrt(10)) and the rate there is -sqrt(10). The asked result is dir = (-3/sqrt(10), -1/sqrt(10)); rate = -sqrt(10)."
          - problem: "A saddle surface has height $f(x, y) = x^2 - y^2$. A marble is at the point $(2, 1)$. Find the unit vector in the direction of steepest descent and the rate of change in that direction, giving the direction as (a, b)."
            answer: "dir = (-2/sqrt(5), 1/sqrt(5)); rate = -2sqrt(5)"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"arity": 2, "kind": "coordinates"}, "name": "dir"}, {"contract": {"kind": "exact"}, "name": "rate"}]}
            solution_sketch: "The full result is dir = (-2/sqrt(5), 1/sqrt(5)); rate = -2sqrt(5). Step 1 (partial derivatives): f_x = 2x and f_y = -2y, so the gradient at (2, 1) is (4, -2). Step 2 (steepest descent): the direction of fastest decrease is the negative of the gradient. Step 3 (normalize): the magnitude is sqrt(20) = 2sqrt(5), so the unit vector is (-2/sqrt(5), 1/sqrt(5)). The asked result is dir = (-2/sqrt(5), 1/sqrt(5)); rate = -2sqrt(5)."
        constraints: "gradient magnitudes simplify to k*sqrt(m) with small squarefree m; ask for ascent or descent explicitly"
      - id: kp3
        name: "Extreme and zero values of the directional derivative"
        key_prerequisites: [computing-the-gradient, dot-product]
        exemplars:
          - problem: "For f(x, y) = x y^2, the directions of zero change at the point (2, 1) are the unit vectors (a, 1)/sqrt(a^2 + 1) with integer a. Find a."
            answer: "-4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (gradient): the partial derivatives of f(x, y) = x y^2 are f_x = y^2 and f_y = 2xy, so at (2, 1) the gradient is (1, 4). Step 2 (zero condition): a direction gives zero change exactly when it is perpendicular to the gradient, so (1, 4) dot (a, 1) = a + 4 = 0. Solving gives a = -4, so the answer is -4."
          - problem: "At a point P, the gradient of f has length 7. Over all unit vectors u, find the largest and the smallest possible values of the directional derivative of f at P."
            answer: "max = 7; min = -7"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "max"}, {"contract": {"kind": "exact"}, "name": "min"}]}
            solution_sketch: "Step 1 (dot product form): for any unit vector u the directional derivative is the gradient dotted with u, so D_u f = |grad f| cos(theta). Step 2 (extremes): cosine ranges from -1 to 1, so D_u f ranges over [-7, 7]. The largest value is 7 and the smallest value is -7, so the answer is max = 7; min = -7."
          - problem: "For f(x, y) = x^2 + y^2, find the maximum possible value of the directional derivative at the point (1, 2)."
            answer: "2sqrt(5)"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (gradient): the partial derivatives are f_x = 2x and f_y = 2y, so at (1, 2) the gradient is (2, 4). Step 2 (maximum): the maximum directional derivative equals the length of the gradient, sqrt(2^2 + 4^2) = sqrt(20). Simplifying the radical gives 2sqrt(5). The answer is 2sqrt(5)."
          - problem: "For f(x, y) = x^2 + x y, the directions of zero change at the point (2, 0) are the unit vectors (1, b)/sqrt(b^2 + 1) with integer b. Find b."
            answer: "-2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (gradient): the partial derivatives of f(x, y) = x^2 + x y are f_x = 2x + y and f_y = x, so at (2, 0) the gradient is (4, 2). Step 2 (zero condition): zero change requires the direction to be perpendicular to the gradient, so (4, 2) dot (1, b) = 4 + 2b = 0. Solving gives b = -2, so the answer is -2."
          - problem: "For f(x, y) = x^3 - y^2, find the minimum possible value of the directional derivative at the point (1, 2)."
            answer: "-5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (gradient): the partial derivatives of f(x, y) = x^3 - y^2 are f_x = 3x^2 and f_y = -2y, so at (1, 2) the gradient is (3, -4). Step 2 (minimum): the minimum directional derivative is the negative of the gradient length, and sqrt(9 + 16) = 5. Thus the minimum is -5. The answer is -5."
          - problem: "For f(x, y, z) = x^2 + y^2 + z^2, find the maximum possible value of the directional derivative at the point (1, 1, 2)."
            answer: "2sqrt(6)"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (gradient): the gradient of f(x, y, z) = x^2 + y^2 + z^2 is (2x, 2y, 2z), which at (1, 1, 2) is (2, 2, 4). Step 2 (maximum): the maximum directional derivative equals the gradient length, sqrt(4 + 4 + 16) = sqrt(24). Simplifying the radical gives 2sqrt(6). The answer is 2sqrt(6)."
        constraints: "gradients with small integer components; zero-change directions have integer components before normalizing"
    diagnostic_exemplar:
      problem: 'In which direction does $f(x, y) = x^2 y$ increase fastest at $(1, 2)$, and what is that maximal rate of increase?'
      answer: 'Direction $\frac{1}{\sqrt{17}}\langle 4, 1 \rangle$; maximal rate $\sqrt{17}$.'
      answer_contract: {kind: none}
      solution_sketch: '$\nabla f = \langle 2xy, x^2 \rangle$, so $\nabla f(1,2) = \langle 4, 1 \rangle$. The steepest ascent is along $\nabla f$, and the maximal directional derivative is $|\nabla f| = \sqrt{17}$.'
    anki_seeds:
      - front: 'Directional derivative of $f$ in the direction of unit vector $\mathbf{u}$?'
        back: '$D_{\mathbf{u}} f = \nabla f \cdot \mathbf{u}$ ($\mathbf{u}$ must be a unit vector).'
        type: basic
      - front: 'In which direction does $f$ increase fastest, and at what rate?'
        back: 'In the direction of $\nabla f$, at rate $|\nabla f|$.'
        type: basic
      - front: 'In which directions is the directional derivative zero?'
        back: 'Perpendicular to $\nabla f$ — along the level curve through the point.'
        type: basic

  - id: gradients-and-level-curves
    name: "Gradients and Level Curves"
    core: false                # geometric interpretation; feeds only tangent planes to level surfaces
    difficulty: 0.72
    drill: false
    answer_kind: numeric
    expected_time_secs: 150
    prerequisites:
      - id: computing-the-gradient
        weight: 0.7
        key: true
      - id: gradient-directional-derivatives
        weight: 0.4
        key: false
    knowledge_points:
      - id: kp1
        name: "Normal and tangent vectors to level curves"
        key_prerequisites: [computing-the-gradient]
        exemplars:
          - problem: "The curve x^2 + y^2 = 25 is a level curve of f(x, y) = x^2 + y^2. Find the gradient vector at (3, 4), which is normal to the curve, and give the answer as (a, b)."
            answer: "(6, 8)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "The gradient of f(x, y) = x^2 + y^2 is (2x, 2y) by partial differentiation. At the point (3, 4) the gradient is (6, 8), and a gradient is normal to its level curve. The normal vector is (6, 8)."
          - problem: "The curve xy = 6 is a level curve of f(x, y) = xy. Find the tangent vector to this level curve at (2, 3) whose first component is 2, and give the answer as (a, b)."
            answer: "(2, -3)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "The gradient of f(x, y) = xy is (y, x), so at (2, 3) it is (3, 2). A tangent vector must be perpendicular to the gradient. The vector (2, -3) has dot product 6 - 6 = 0 with (3, 2), so the tangent vector is (2, -3)."
          - problem: "The curve x^2 + y^2 = 169 is a level curve of f(x, y) = x^2 + y^2. Find the gradient vector at (5, 12), which is normal to the curve, and give the answer as (a, b)."
            answer: "(10, 24)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "The gradient of f(x, y) = x^2 + y^2 is (2x, 2y) by partial differentiation. At the point (5, 12) the gradient is (10, 24), and a gradient is normal to its level curve. The normal vector is (10, 24)."
          - problem: "The curve y = x^2 + 1 is a level curve of f(x, y) = y - x^2. Find the gradient vector at (2, 5), which is normal to the curve, and give the answer as (a, b)."
            answer: "(-4, 1)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "The gradient of f(x, y) = y - x^2 is (-2x, 1) by partial differentiation. At the point (2, 5) the gradient is (-4, 1), and a gradient is normal to its level curve. The normal vector is (-4, 1)."
          - problem: "The curve y = x^2 + 1 is a level curve of f(x, y) = y - x^2. Find the tangent vector to this level curve at (1, 2) whose first component is 1, and give the answer as (a, b)."
            answer: "(1, 2)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "The gradient of f(x, y) = y - x^2 is (-2x, 1), so at (1, 2) it is (-2, 1). A tangent vector must be perpendicular to the gradient. The vector (1, 2) has dot product -2 + 2 = 0 with (-2, 1), so the tangent vector is (1, 2)."
          - problem: "The curve xy = 12 is a level curve of f(x, y) = xy. Find the gradient vector at (3, 4), which is normal to the curve, and give the answer as (a, b)."
            answer: "(4, 3)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "The gradient of f(x, y) = xy is (y, x) by partial differentiation. At the point (3, 4) the gradient is (4, 3), and a gradient is normal to its level curve. The normal vector is (4, 3)."
        constraints: "level curves are circles, hyperbolas xy = c, or parabolas; points have integer coordinates on the curve"
      - id: kp2
        name: "Tangent lines to level curves"
        key_prerequisites: [computing-the-gradient]
        exemplars:
          - problem: "At the point (3, 4), the circle x^2 + y^2 = 25 has a tangent line. Put that line in the form A x + B y = C. Find A, B and C."
            answer: "A = 3; B = 4; C = 25"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "A"}, {"contract": {"kind": "exact"}, "name": "B"}, {"contract": {"kind": "exact"}, "name": "C"}]}
            solution_sketch: "The full tangent line is 3x + 4y = 25. Step 1: compute the gradient of f(x, y) = x^2 + y^2, which is (2x, 2y). Step 2: at (3, 4) the gradient is (6, 8), so a normal vector is (3, 4) after dividing by 2. Step 3: use the normal vector through (3, 4) to write 3(x - 3) + 4(y - 4) = 0 and simplify to 3x + 4y = 25. The answer is A = 3; B = 4; C = 25."
          - problem: "The level curve of f(x, y) = x^2 - y through (2, 4) has a tangent line. Write that line as A x + B y = C. Determine A, B and C."
            answer: "A = 4; B = -1; C = 4"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "A"}, {"contract": {"kind": "exact"}, "name": "B"}, {"contract": {"kind": "exact"}, "name": "C"}]}
            solution_sketch: "The full tangent line is 4x - y = 4. Step 1: compute the gradient of f(x, y) = x^2 - y, which is (2x, -1). Step 2: at (2, 4) the gradient is (4, -1), and this gradient is normal to the level curve. Step 3: a normal vector (4, -1) through (2, 4) gives 4(x - 2) - (y - 4) = 0, which simplifies to 4x - y = 4. The answer is A = 4; B = -1; C = 4."
          - problem: "The ellipse x^2 + 4y^2 = 8 passes through (2, 1). Compute the slope of its tangent line at that point as a fraction."
            answer: "-1/2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The tangent line has slope -1/2. Step 1: the ellipse is a level curve of f(x, y) = x^2 + 4y^2, so its gradient is (2x, 8y). Step 2: at (2, 1) the gradient is (4, 8), which is normal to the curve. Step 3: the tangent slope is -fx/fy = -4/8, which reduces to -1/2. The answer is -1/2."
          - problem: "For f(x, y) = xy, the level curve through (3, 2) has a tangent line. Find the y-intercept of that line."
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The tangent line is 2x + 3y = 12. Step 1: compute the gradient of f(x, y) = xy, which is (y, x). Step 2: at (3, 2) the gradient is (2, 3), and this is normal to the level curve. Step 3: the line through (3, 2) with normal (2, 3) is 2(x - 3) + 3(y - 2) = 0, which simplifies to 2x + 3y = 12. Set x = 0 to get 3y = 12, so the y-intercept is 4. The answer is 4."
          - problem: "The level curve of f(x, y) = x^3 - y^2 through (2, 1) has a tangent line. Express it as A x + B y = C. Solve for A, B and C."
            answer: "A = 6; B = -1; C = 11"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "A"}, {"contract": {"kind": "exact"}, "name": "B"}, {"contract": {"kind": "exact"}, "name": "C"}]}
            solution_sketch: "The full tangent line is 6x - y = 11. Step 1: compute the gradient of f(x, y) = x^3 - y^2, which is (3x^2, -2y). Step 2: at (2, 1) the gradient is (12, -2), so a normal vector is (6, -1) after dividing by 2. Step 3: use the normal vector (6, -1) through (2, 1) to write 6(x - 2) - (y - 1) = 0, which simplifies to 6x - y = 11. The answer is A = 6; B = -1; C = 11."
          - problem: "For the level curve of f(x, y) = x^2 + y^3 through (1, 2), write the tangent line in the form A x + B y = C. State A, B and C."
            answer: "A = 1; B = 6; C = 13"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "A"}, {"contract": {"kind": "exact"}, "name": "B"}, {"contract": {"kind": "exact"}, "name": "C"}]}
            solution_sketch: "The full tangent line is x + 6y = 13. Step 1: compute the gradient of f(x, y) = x^2 + y^3, which is (2x, 3y^2). Step 2: at (1, 2) the gradient is (2, 12), so a normal vector is (1, 6) after dividing by 2. Step 3: use the normal vector (1, 6) through (1, 2) to write 1(x - 1) + 6(y - 2) = 0, which simplifies to x + 6y = 13. The answer is A = 1; B = 6; C = 13."
        constraints: "normal vectors have small integer components; tangent lines simplify to integer-coefficient equations"
      - id: kp3
        name: "Reading contour maps"
        key_prerequisites: [computing-the-gradient, gradient-directional-derivatives]
        exemplars:
          - problem: 'On a contour map of $f$, the contour lines near $P$ are very close together. What does that say about $|\nabla f(P)|$?'
            answer: '$|\nabla f(P)|$ is large — $f$ changes quickly there.'
            solution_sketch: 'Closely packed contours mean a large rate of change, so $|\nabla f(P)|$ is large.'
            answer_contract: {kind: none}
          - problem: 'Near $P$ the contours of $f$ run east-west and $f$ increases toward the north. In which direction does $\nabla f(P)$ point?'
            answer: 'North — perpendicular to the contours, toward increasing $f$.'
            solution_sketch: 'The gradient points perpendicular to the level curves toward increasing $f$, i.e. north.'
            answer_contract: {kind: none}
        constraints: "qualitative contour-map reasoning; answers are directions or comparative statements, no computation"
    diagnostic_exemplar:
      problem: 'Use the gradient to find the tangent line to the level curve of $f(x, y) = x^2 - xy$ through the point $(3, 1)$.'
      answer: '$5x - 3y = 12$'
      answer_contract: {kind: none}
      solution_sketch: '$\nabla f = \langle 2x - y, -x \rangle$, so $\nabla f(3,1) = \langle 5, -3 \rangle$ is normal to the level curve $f = 6$ there. The tangent line is $5(x - 3) - 3(y - 1) = 0$, i.e. $5x - 3y = 12$.'
    anki_seeds:
      - front: 'Geometric relation between $\nabla f$ and the level curve of $f$ through a point?'
        back: '$\nabla f$ is perpendicular (normal) to the level curve, pointing toward increasing $f$.'
        type: basic
      - front: 'What do closely spaced contour lines indicate about $|\nabla f|$?'
        back: 'A large $|\nabla f|$ — the function changes rapidly there.'
        type: basic

  - id: tangent-planes-level-surfaces
    name: "Tangent Planes to Level Surfaces"
    core: false                # geometric application of the gradient; terminal
    difficulty: 0.78
    drill: false
    answer_kind: numeric
    expected_time_secs: 180
    prerequisites:
      - id: gradients-and-level-curves
        weight: 0.7
        key: true
      - id: computing-the-gradient
        weight: 0.5
        key: true
      - id: lines-planes-space
        weight: 0.4
        key: false
    knowledge_points:
      - id: kp1
        name: "Normal vectors to surfaces via the gradient"
        key_prerequisites: [computing-the-gradient, gradients-and-level-curves]
        exemplars:
          - problem: "The surface x^2 + y^2 + z^2 = 21 contains the integer point (2, 1, 4). Use F(x, y, z) = x^2 + y^2 + z^2. Find the gradient vector of F at that point, which is normal to the surface, as (x, y, z)."
            answer: "(4, 2, 8)"
            answer_contract: {"arity": 3, "kind": "coordinates"}
            solution_sketch: "Step 1 (level surface): write the surface as F(x, y, z) = x^2 + y^2 + z^2 - 21 = 0. Step 2 (gradient rule): grad F = (2x, 2y, 2z). Step 3 (evaluate): grad F(2, 1, 4) = (4, 2, 8). The normal vector is (4, 2, 8)."
          - problem: "The graph z = x^2 + 2y^2 passes through (1, 2, 9). Rewrite it as F(x, y, z) = x^2 + 2y^2 - z = 0. Find the gradient vector of F at that point as (x, y, z)."
            answer: "(2, 8, -1)"
            answer_contract: {"arity": 3, "kind": "coordinates"}
            solution_sketch: "Step 1 (graph to level surface): set F(x, y, z) = x^2 + 2y^2 - z. Step 2 (gradient rule): grad F = (2x, 4y, -1). Step 3 (evaluate): at (1, 2, 9), grad F = (2, 8, -1). The normal vector is (2, 8, -1)."
          - problem: "The ellipsoid x^2 + 4y^2 + z^2 = 21 contains (1, 2, 2). With F(x, y, z) = x^2 + 4y^2 + z^2 - 21, find the gradient vector at that point as (x, y, z)."
            answer: "(2, 16, 4)"
            answer_contract: {"arity": 3, "kind": "coordinates"}
            solution_sketch: "Step 1 (level surface): F(x, y, z) = x^2 + 4y^2 + z^2 - 21. Step 2 (gradient): grad F = (2x, 8y, 2z). Step 3 (evaluate at (1, 2, 2)): grad F = (2, 16, 4). The normal vector is (2, 16, 4)."
          - problem: "The hyperboloid x^2 + y^2 - z^2 = 4 contains (3, 2, 3). Use F(x, y, z) = x^2 + y^2 - z^2 - 4. Find the gradient vector at that point as (x, y, z)."
            answer: "(6, 4, -6)"
            answer_contract: {"arity": 3, "kind": "coordinates"}
            solution_sketch: "Step 1 (level surface): F(x, y, z) = x^2 + y^2 - z^2 - 4 = 0. Step 2 (gradient): grad F = (2x, 2y, -2z). Step 3 (evaluate): grad F(3, 2, 3) = (6, 4, -6). The normal vector is (6, 4, -6)."
          - problem: "The graph z = 3x^2 + y^2 passes through (1, 1, 4). Rewrite it as F(x, y, z) = 3x^2 + y^2 - z = 0. Find the gradient vector of F at (1, 1, 4) as (x, y, z)."
            answer: "(6, 2, -1)"
            answer_contract: {"arity": 3, "kind": "coordinates"}
            solution_sketch: "Step 1 (graph to level surface): F(x, y, z) = 3x^2 + y^2 - z. Step 2 (gradient): grad F = (6x, 2y, -1). Step 3 (evaluate at (1, 1, 4)): grad F = (6, 2, -1). The normal vector is (6, 2, -1)."
          - problem: "The graph z = x^2 - y^2 passes through (2, 1, 3). Write it as F(x, y, z) = x^2 - y^2 - z = 0. Find the gradient vector of F at that point as (x, y, z)."
            answer: "(4, -2, -1)"
            answer_contract: {"arity": 3, "kind": "coordinates"}
            solution_sketch: "Step 1 (graph to level surface): F(x, y, z) = x^2 - y^2 - z. Step 2 (gradient): grad F = (2x, -2y, -1). Step 3 (evaluate at (2, 1, 3)): grad F = (4, -2, -1). The normal vector is (4, -2, -1)."
        constraints: "quadric surfaces with integer points; graphs z = f(x,y) rewritten as F = f - z = 0"
      - id: kp2
        name: "Tangent planes to level surfaces"
        key_prerequisites: [computing-the-gradient, gradients-and-level-curves, lines-planes-space]
        exemplars:
          - problem: "Find the tangent plane to the sphere x^2 + y^2 + z^2 = 21 at the point (1, 2, 4). Give the normal vector as (a, b, c) with no common factor and the constant d, and write the answer as n = (a, b, c); d = k."
            answer: "n = (1, 2, 4); d = 21"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"arity": 3, "kind": "coordinates"}, "name": "n"}, {"contract": {"kind": "exact"}, "name": "d"}]}
            solution_sketch: "Gradient step: for F = x^2 + y^2 + z^2, grad F = (2x, 2y, 2z). At (1, 2, 4), grad F = (2, 4, 8), so a primitive normal vector is (1, 2, 4) after dividing by 2. Plane step: the tangent plane is 1(x - 1) + 2(y - 2) + 4(z - 4) = 0. Simplification step: this becomes x + 2y + 4z = 21, so n = (1, 2, 4); d = 21."
          - problem: "Find the tangent plane to the quadric x^2 - y^2 + z^2 = 12 at the point (3, 1, 2). Give the normal vector as (a, b, c) with no common factor and the constant d, and write the answer as n = (a, b, c); d = k."
            answer: "n = (3, -1, 2); d = 12"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"arity": 3, "kind": "coordinates"}, "name": "n"}, {"contract": {"kind": "exact"}, "name": "d"}]}
            solution_sketch: "Gradient step: for F = x^2 - y^2 + z^2, grad F = (2x, -2y, 2z). At (3, 1, 2), grad F = (6, -2, 4), so a primitive normal vector is (3, -1, 2) after dividing by 2. Plane step: the tangent plane is 3(x - 3) - 1(y - 1) + 2(z - 2) = 0. Simplification step: this becomes 3x - y + 2z = 12, so n = (3, -1, 2); d = 12."
          - problem: "Find the tangent plane to the ellipsoid 2x^2 + 3y^2 + z^2 = 23 at the point (1, 2, 3). Give the normal vector as (a, b, c) with no common factor and the constant d, and write the answer as n = (a, b, c); d = k."
            answer: "n = (2, 6, 3); d = 23"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"arity": 3, "kind": "coordinates"}, "name": "n"}, {"contract": {"kind": "exact"}, "name": "d"}]}
            solution_sketch: "Gradient step: for F = 2x^2 + 3y^2 + z^2, grad F = (4x, 6y, 2z). At (1, 2, 3), grad F = (4, 12, 6), so a primitive normal vector is (2, 6, 3) after dividing by 2. Plane step: the tangent plane is 2(x - 1) + 6(y - 2) + 3(z - 3) = 0. Simplification step: this becomes 2x + 6y + 3z = 23, so n = (2, 6, 3); d = 23."
          - problem: "Find the tangent plane to the paraboloid z = x^2 + y^2 at the point (1, 2, 5). Give the normal vector as (a, b, c) with no common factor and the constant d, and write the answer as n = (a, b, c); d = k."
            answer: "n = (2, 4, -1); d = 5"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"arity": 3, "kind": "coordinates"}, "name": "n"}, {"contract": {"kind": "exact"}, "name": "d"}]}
            solution_sketch: "Gradient step: write F = x^2 + y^2 - z, so grad F = (2x, 2y, -1). At (1, 2, 5), grad F = (2, 4, -1), which is already primitive. Plane step: the tangent plane is 2(x - 1) + 4(y - 2) - 1(z - 5) = 0. Simplification step: this becomes 2x + 4y - z = 5, so n = (2, 4, -1); d = 5."
          - problem: "The point (3, 4, z) lies on the sphere x^2 + y^2 + z^2 = 50 with z > 0. Find the tangent plane to the sphere at that point. Give the normal vector as (a, b, c) with no common factor and the constant d, and write the answer as n = (a, b, c); d = k."
            answer: "n = (3, 4, 5); d = 50"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"arity": 3, "kind": "coordinates"}, "name": "n"}, {"contract": {"kind": "exact"}, "name": "d"}]}
            solution_sketch: "Point step: since (3, 4, z) is on the sphere, 9 + 16 + z^2 = 50, so z^2 = 25 and z = 5. Gradient step: for F = x^2 + y^2 + z^2, grad F = (2x, 2y, 2z); at (3, 4, 5) this is (6, 8, 10), so a primitive normal vector is (3, 4, 5). Plane step: the tangent plane is 3(x - 3) + 4(y - 4) + 5(z - 5) = 0, which simplifies to 3x + 4y + 5z = 50, so n = (3, 4, 5); d = 50."
          - problem: "Find the tangent plane to the hyperboloid x^2 + y^2 - z^2 = 4 at the point (3, 2, 3). Give the normal vector as (a, b, c) with no common factor and the constant d, and write the answer as n = (a, b, c); d = k."
            answer: "n = (3, 2, -3); d = 4"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"arity": 3, "kind": "coordinates"}, "name": "n"}, {"contract": {"kind": "exact"}, "name": "d"}]}
            solution_sketch: "Gradient step: for F = x^2 + y^2 - z^2, grad F = (2x, 2y, -2z). At (3, 2, 3), grad F = (6, 4, -6), so a primitive normal vector is (3, 2, -3) after dividing by 2. Plane step: the tangent plane is 3(x - 3) + 2(y - 2) - 3(z - 3) = 0. Simplification step: this becomes 3x + 2y - 3z = 4, so n = (3, 2, -3); d = 4."
        constraints: "spheres and quadrics through integer points; plane equations simplify to integer coefficients"
      - id: kp3
        name: "Normal lines"
        key_prerequisites: [computing-the-gradient, lines-planes-space]
        exemplars:
          - problem: "The surface x^2 + y^2 + z^2 = 6 has a normal line at (1, 1, 2). Give the direction vector of this normal line as (x, y, z)."
            answer: "(2, 2, 4)"
            answer_contract: {"arity": 3, "kind": "coordinates"}
            solution_sketch: "Step 1 (level surface): the level function is F = x^2 + y^2 + z^2. Step 2 (gradient rule): its gradient is (2x, 2y, 2z). Step 3 (evaluation rule): at (1, 1, 2), the gradient is (2, 2, 4). Step 4 (normal line rule): the normal line uses this gradient as direction. The direction vector is (2, 2, 4)."
          - problem: "The normal line to x^2 + y^2 + z^2 = 25 at (0, 0, 5) is followed until it meets the xy-plane. Give that intersection point as (x, y, z)."
            answer: "(0, 0, 0)"
            answer_contract: {"arity": 3, "kind": "coordinates"}
            solution_sketch: "Step 1 (level surface): the level function is F = x^2 + y^2 + z^2. Step 2 (gradient rule): its gradient at (0, 0, 5) is (0, 0, 10). Step 3 (normal line rule): the normal line is (0, 0, 5) + t(0, 0, 10). Step 4 (plane intersection rule): set z = 0, so 5 + 10t = 0 and t = -1/2. Step 5 (evaluation rule): the point is (0, 0, 0). The intersection point is (0, 0, 0)."
          - problem: "The level surface is x^2 + y^2 - z = 0. Give the direction vector of the normal line at (1, 2, 5) as (x, y, z)."
            answer: "(2, 4, -1)"
            answer_contract: {"arity": 3, "kind": "coordinates"}
            solution_sketch: "Step 1 (level surface): the level function is F = x^2 + y^2 - z. Step 2 (gradient rule): its gradient is (2x, 2y, -1). Step 3 (evaluation rule): at (1, 2, 5), the gradient is (2, 4, -1). Step 4 (normal line rule): the normal line direction is the gradient. The direction vector is (2, 4, -1)."
          - problem: "For the surface x^2 + y^2 - z = 0, the normal line at (1, 3, 10) can be written (1, 3, 10) + t times its gradient there. Find the value of t where this line meets the plane z = 0."
            answer: "10"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (level surface): the level function is F = x^2 + y^2 - z. Step 2 (gradient rule): its gradient is (2x, 2y, -1). Step 3 (evaluation rule): at (1, 3, 10), the gradient is (2, 6, -1). Step 4 (normal line rule): the line is (1, 3, 10) + t(2, 6, -1). Step 5 (plane intersection rule): z = 10 - t, and z = 0 gives t = 10. The value is 10."
          - problem: "The normal line to x^2 + 4y^2 + z^2 = 21 at (1, 2, 2) is followed until it meets the plane x = 0. Give that intersection point as (x, y, z)."
            answer: "(0, -6, 0)"
            answer_contract: {"arity": 3, "kind": "coordinates"}
            solution_sketch: "Step 1 (level surface): the level function is F = x^2 + 4y^2 + z^2. Step 2 (gradient rule): its gradient is (2x, 8y, 2z). Step 3 (evaluation rule): at (1, 2, 2), the gradient is (2, 16, 4). Step 4 (normal line rule): the line is (1, 2, 2) + t(2, 16, 4). Step 5 (plane intersection rule): x = 1 + 2t = 0 gives t = -1/2. Step 6 (evaluation rule): y = 2 + 16(-1/2) = -6 and z = 2 + 4(-1/2) = 0. The intersection point is (0, -6, 0)."
          - problem: "The level surface is x^2 + y^2 - z^2 = 0. Give the direction vector of the normal line at (3, 4, 5) as (x, y, z)."
            answer: "(6, 8, -10)"
            answer_contract: {"arity": 3, "kind": "coordinates"}
            solution_sketch: "Step 1 (level surface): the level function is F = x^2 + y^2 - z^2. Step 2 (gradient rule): its gradient is (2x, 2y, -2z). Step 3 (evaluation rule): at (3, 4, 5), the gradient is (6, 8, -10). Step 4 (normal line rule): the normal line direction is the gradient. The direction vector is (6, 8, -10)."
        constraints: "direction vectors are gradients with integer components; intersection questions solve linearly in t"
    diagnostic_exemplar:
      problem: 'Find parametric equations for the normal line to the surface $x^2 + y^2 + z^2 = 9$ at $(2, 2, 1)$.'
      answer: '$x = 2 + 2t,\; y = 2 + 2t,\; z = 1 + t$'
      answer_contract: {kind: none}
      solution_sketch: '$\nabla F = \langle 2x, 2y, 2z \rangle$ gives $\langle 4, 4, 2 \rangle \parallel \langle 2, 2, 1 \rangle$ at the point; the normal line runs through $(2,2,1)$ in that direction.'
    anki_seeds:
      - front: 'Tangent plane to the level surface $F(x,y,z) = c$ at point $P$?'
        back: '$\nabla F(P) \cdot (\mathbf{r} - P) = 0$ — the plane through $P$ with normal $\nabla F(P)$.'
        type: basic
      - front: 'How do you treat the graph $z = f(x, y)$ as a level surface?'
        back: 'Set $F(x,y,z) = f(x,y) - z$; the graph is the level surface $F = 0$ with normal $\langle f_x, f_y, -1 \rangle$.'
        type: basic

  - id: multivariable-critical-points
    name: "Critical Points of Multivariable Functions"
    core: true
    difficulty: 0.72
    drill: false
    answer_kind: numeric
    expected_time_secs: 150
    prerequisites:
      - id: computing-the-gradient
        weight: 0.7
        key: true
      - id: systems-substitution
        weight: 0.4
        key: false
      - id: partial-derivatives
        weight: 0.4
        key: false
    knowledge_points:
      - id: kp1
        name: "The definition and simple critical points"
        key_prerequisites: [computing-the-gradient]
        exemplars:
          - problem: 'Find the critical point of $f(x, y) = xy - x$.'
            answer: '$(0, 1)$'
            solution_sketch: '$f_x = y - 1 = 0$ and $f_y = x = 0$.'
          - problem: 'Find the critical point of $f(x, y) = x^2 + y^2$.'
            answer: '$(0, 0)$'
          - problem: "Find the critical point of $f(x, y) = 2x^2 + 3y^2 - 8x + 12y$. Give the critical point as (x, y)."
            answer: "(2, -2)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "Write $f_x = 4x - 8$ and $f_y = 6y + 12$. At a critical point both partial derivatives are zero, so solve $4x - 8 = 0$ and $6y + 12 = 0$. This gives $x = 2$ and $y = -2$. The critical point is (2, -2)."
          - problem: "Find the critical point of $f(x, y) = xy - 3x + 4y$. Give the critical point as (x, y)."
            answer: "(-4, 3)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "Compute $f_x = y - 3$ and $f_y = x + 4$. A critical point needs $f_x = 0$ and $f_y = 0$. Solve $y - 3 = 0$ and $x + 4 = 0$ to get $y = 3$ and $x = -4$. The critical point is (-4, 3)."
          - problem: "A surface has height $f(x, y) = x^2 + 5y^2 - 10x + 20y + 7$. Give the critical point as (x, y)."
            answer: "(5, -2)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "Find $f_x = 2x - 10$ and $f_y = 10y + 20$. Set each partial derivative to zero by the critical point definition. Solve $2x - 10 = 0$ and $10y + 20 = 0$, giving $x = 5$ and $y = -2$. The critical point is (5, -2)."
          - problem: "For $f(x, y) = x^2 + y^2 - 6x + by$, the point $(3, -2)$ is the only critical point. Find $b$."
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Compute the y-partial derivative $f_y = 2y + b$. At a critical point $f_y = 0$, so substitute $y = -2$. Then $-4 + b = 0$, which gives $b = 4$. The value is 4."
        constraints: "grad f = 0 solves immediately, one equation per variable; single critical point"
      - id: kp2
        name: "Critical points of quadratic functions"
        key_prerequisites: [computing-the-gradient, systems-substitution]
        exemplars:
          - problem: "Find the critical point of f(x, y) = x^2 + y^2 - 2x - 6y + 14. Give the answer as (x, y)."
            answer: "(1, 3)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "The function is f(x, y) = x^2 + y^2 - 2x - 6y + 14. Step 1, apply partial differentiation: f_x = 2x - 2 and f_y = 2y - 6. Step 2, solve the linear equations: 2x - 2 = 0 gives x = 1, and 2y - 6 = 0 gives y = 3. The critical point is (1, 3)."
          - problem: "Find the critical point of f(x, y) = x^2 + 2y^2 - 4x + 4y. Give the answer as (x, y)."
            answer: "(2, -1)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "The function is f(x, y) = x^2 + 2y^2 - 4x + 4y. Step 1, apply partial differentiation: f_x = 2x - 4 and f_y = 4y + 4. Step 2, solve f_x = 0 for x = 2 and solve f_y = 0 for y = -1. The critical point is (2, -1)."
          - problem: "The function f(x, y) = 2x^2 + 3y^2 + 8x - 12y + 5 has one critical point. Find the value of f at that critical point."
            answer: "-15"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The function is f(x, y) = 2x^2 + 3y^2 + 8x - 12y + 5. Step 1, set the partial derivatives to zero: f_x = 4x + 8 = 0 gives x = -2, and f_y = 6y - 12 = 0 gives y = 2. Step 2, evaluate f at (-2, 2): 2(4) + 3(4) + 8(-2) - 12(2) + 5 = 8 + 12 - 16 - 24 + 5 = -15. The value at the critical point is -15."
          - problem: "The function f(x, y) = 3x^2 + y^2 - 18x + 4y + 20 has one critical point. Find the value of f at that critical point."
            answer: "-11"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The function is f(x, y) = 3x^2 + y^2 - 18x + 4y + 20. Step 1, set the partial derivatives to zero: f_x = 6x - 18 = 0 gives x = 3, and f_y = 2y + 4 = 0 gives y = -2. Step 2, evaluate f at (3, -2): 3(9) + 4 - 54 + 4(-2) + 20 = 27 + 4 - 54 - 8 + 20 = -11. The value at the critical point is -11."
          - problem: "Find the sum of the coordinates of the critical point of f(x, y) = 4x^2 + 5y^2 - 24x + 10y + 3."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The function is f(x, y) = 4x^2 + 5y^2 - 24x + 10y + 3. Step 1, solve the partial derivative equations: f_x = 8x - 24 = 0 gives x = 3, and f_y = 10y + 10 = 0 gives y = -1. Step 2, add the coordinates: 3 + (-1) = 2. The sum of the coordinates is 2."
          - problem: "Find the critical point of f(x, y) = x^2 + 4y^2 + 6x - 16y + 9. Give the answer as (x, y)."
            answer: "(-3, 2)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "The function is f(x, y) = x^2 + 4y^2 + 6x - 16y + 9. Step 1, apply partial differentiation: f_x = 2x + 6 and f_y = 8y - 16. Step 2, solve f_x = 0 for x = -3 and solve f_y = 0 for y = 2. The critical point is (-3, 2)."
        constraints: "quadratics with linear terms; the two equations decouple and give integer solutions"
      - id: kp3
        name: "Systems requiring factoring or substitution"
        key_prerequisites: [computing-the-gradient, systems-substitution]
        exemplars:
          - problem: "Find the critical point of f(x, y) = x^3 - 3x + y^2 with x > 0. Give the answer as (x, y)."
            answer: "(1, 0)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "Set the gradient to zero: f_x = 3x^2 - 3 and f_y = 2y. Solve f_x = 0 by factoring: 3(x - 1)(x + 1) = 0, so x = 1 or x = -1. Solve f_y = 0: 2y = 0, so y = 0. The critical points are (1, 0) and (-1, 0); the one with x > 0 is (1, 0)."
          - problem: "Find the critical point of f(x, y) = x^3 + y^3 - 3xy with x > 0. Give the answer as (x, y)."
            answer: "(1, 1)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "Set the gradient to zero: f_x = 3x^2 - 3y and f_y = 3y^2 - 3x. From f_x = 0, y = x^2. Substitute into f_y = 0: 3(x^2)^2 - 3x = 0, so 3x(x^3 - 1) = 0. Thus x = 0 or x = 1. The corresponding critical points are (0, 0) and (1, 1); the one with x > 0 is (1, 1)."
          - problem: "Find the critical point of f(x, y) = x^2 + y^3 - 3y^2 with y > 0. Give the answer as (x, y)."
            answer: "(0, 2)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "Set the gradient to zero: f_x = 2x and f_y = 3y^2 - 6y. Solve f_x = 0: 2x = 0, so x = 0. Factor f_y = 0: 3y(y - 2) = 0, so y = 0 or y = 2. The critical points are (0, 0) and (0, 2); the one with y > 0 is (0, 2)."
          - problem: "Find the critical point of f(x, y) = x^3 + y^3 - 3x^2 with x > 0. Give the answer as (x, y)."
            answer: "(2, 0)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "Set the gradient to zero: f_x = 3x^2 - 6x and f_y = 3y^2. Factor f_x = 0: 3x(x - 2) = 0, so x = 0 or x = 2. Solve f_y = 0: 3y^2 = 0, so y = 0. The critical points are (0, 0) and (2, 0); the one with x > 0 is (2, 0)."
          - problem: "Find the critical point of f(x, y) = x^2 y + y^2 - 4y with x < 0. Give the answer as (x, y)."
            answer: "(-2, 0)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "Set the gradient to zero: f_x = 2xy and f_y = x^2 + 2y - 4. Factor f_x = 0: 2xy = 0, so x = 0 or y = 0. If x = 0, f_y = 0 gives 2y - 4 = 0, so y = 2 and (0, 2) is critical. If y = 0, f_y = 0 gives x^2 - 4 = 0, so x = 2 or x = -2, giving (2, 0) and (-2, 0). The critical point with x < 0 is (-2, 0)."
          - problem: "Find the critical point of f(x, y) = x^4 - 2x^2 + y^2 - 4y with x < 0. Give the answer as (x, y)."
            answer: "(-1, 2)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "Set the gradient to zero: f_x = 4x^3 - 4x and f_y = 2y - 4. Factor f_x = 0: 4x(x^2 - 1) = 0, so x = 0, x = 1, or x = -1. Solve f_y = 0: 2y - 4 = 0, so y = 2. The critical points are (0, 2), (1, 2), and (-1, 2); the one with x < 0 is (-1, 2)."
        constraints: "the system grad f = 0 solves by substitution/factoring with integer solutions; at most 3 real critical points"
    diagnostic_exemplar:
      problem: 'Find all critical points of $f(x, y) = x^3 - 12x + y^2 - 4y$.'
      answer: '$(2, 2)$ and $(-2, 2)$'
      answer_contract: {kind: none}
      solution_sketch: '$f_x = 3x^2 - 12 = 0$ gives $x = \pm 2$; $f_y = 2y - 4 = 0$ gives $y = 2$.'
    anki_seeds:
      - front: 'Definition of a critical point of $f(x, y)$?'
        back: 'A point where $\nabla f = \mathbf{0}$ (both partials vanish) or where a partial derivative fails to exist.'
        type: basic
      - front: 'Where can a local extremum of a differentiable $f(x, y)$ occur?'
        back: 'Only at a critical point — where $\nabla f = \mathbf{0}$.'
        type: basic

  - id: multivariable-local-extrema
    name: "Local Extrema and the Second-Derivative Test"
    core: true
    difficulty: 0.78
    drill: false
    answer_kind: numeric
    expected_time_secs: 240
    prerequisites:
      - id: multivariable-critical-points
        weight: 0.8
        key: true
      - id: partial-derivatives
        weight: 0.6
        key: true
    knowledge_points:
      - id: kp1
        name: "Computing the discriminant D"
        key_prerequisites: [multivariable-critical-points, partial-derivatives]
        exemplars:
          - problem: 'Compute $D = f_{xx} f_{yy} - f_{xy}^2$ for $f(x, y) = x^3 - 3x + y^2$.'
            answer: '$D = 12x$'
            solution_sketch: '$f_{xx} = 6x$, $f_{yy} = 2$, $f_{xy} = 0$, so $D = (6x)(2) - 0 = 12x$.'
          - problem: 'Compute $D$ for $f(x, y) = x^2 + xy + y^2$.'
            answer: '$D = 3$'
            solution_sketch: '$f_{xx} = 2$, $f_{yy} = 2$, $f_{xy} = 1$: $D = 4 - 1 = 3$.'
          - problem: "Let $f(x, y) = 2x^3 + y^2$. Compute $D = f_{xx} f_{yy} - f_{xy}^2$. Give $D$ as a function of $x$."
            answer: "24x"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "Write the second partials first: f_{xx} = 12x, f_{yy} = 2, and f_{xy} = 0 by the power rule. Substitute into the discriminant rule D = f_{xx} f_{yy} - f_{xy}^2, so D = (12x)(2) - 0^2 = 24x. The discriminant is 24x."
          - problem: "Let $f(x, y) = x^2 + 3xy + y^2$. Compute $D = f_{xx} f_{yy} - f_{xy}^2$. Give $D$ as an integer."
            answer: "-5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "First compute the constant second partials: f_{xx} = 2, f_{yy} = 2, and f_{xy} = 3. Apply the discriminant rule D = f_{xx} f_{yy} - f_{xy}^2, which gives D = (2)(2) - 3^2 = 4 - 9 = -5. So D = -5."
          - problem: "For a function $f$, the second partials are $f_{xx} = 2x$, $f_{yy} = 3$, and $f_{xy} = 0$. Compute $D = f_{xx} f_{yy} - f_{xy}^2$. Give $D$ as a function of $x$."
            answer: "6x"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "The given second partials are f_{xx} = 2x, f_{yy} = 3, and f_{xy} = 0. Use the discriminant rule D = f_{xx} f_{yy} - f_{xy}^2 and substitute: D = (2x)(3) - 0^2 = 6x. Therefore D = 6x."
          - problem: "Let $f(x, y) = x^2 + y^4$. Compute $D = f_{xx} f_{yy} - f_{xy}^2$. Give $D$ as a function of $y$."
            answer: "24y^2"
            answer_contract: {"kind": "function", "vars": ["y"]}
            solution_sketch: "Compute the second partials: f_{xx} = 2, f_{yy} = 12y^2, and f_{xy} = 0. Apply D = f_{xx} f_{yy} - f_{xy}^2, so D = (2)(12y^2) - 0^2 = 24y^2. Thus D = 24y^2."
        constraints: "second partials are constants or monomials; D is a constant or single monomial"
      - id: kp2
        name: "The second-derivative test"
        key_prerequisites: [multivariable-critical-points, partial-derivatives]
        exemplars:
          - problem: "For f(x, y) = x^3 - 3x + y^2, the point (1, 0) is a critical point and D = f_xx f_yy - f_xy^2. Give the verdict and D."
            answer: "verdict = minimum; D = 12"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["minimum"], ["saddle"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "D"}]}
            solution_sketch: "For f(x, y) = x^3 - 3x + y^2, the second partials are f_xx = 6x, f_yy = 2, and f_xy = 0. At (1, 0), f_xx = 6 and D = (6)(2) - 0^2 = 12 by the second-derivative test. Since D > 0 and f_xx > 0, the point is a local minimum. A wrong option 'saddle' comes from ignoring the sign of f_xx. The answer is verdict = minimum; D = 12."
          - problem: "For f(x, y) = x^2 + xy + y^2, the origin is a critical point and D = f_xx f_yy - f_xy^2. Give D as an integer."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "For f(x, y) = x^2 + xy + y^2, the second partials are f_xx = 2, f_yy = 2, and f_xy = 1. At the origin, D = (2)(2) - 1^2 = 3 using the second-derivative test. The answer is 3."
          - problem: "For f(x, y) = xy, the origin is a critical point and D = f_xx f_yy - f_xy^2. Give D as an integer."
            answer: "-1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "For f(x, y) = xy, the second partials are f_xx = 0, f_yy = 0, and f_xy = 1. At the origin, D = (0)(0) - 1^2 = -1 by the second-derivative test. The answer is -1."
          - problem: "For f(x, y) = -x^2 - y^2, the origin is a critical point and D = f_xx f_yy - f_xy^2. Give D as an integer."
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "For f(x, y) = -x^2 - y^2, the second partials are f_xx = -2, f_yy = -2, and f_xy = 0. At the origin, D = (-2)(-2) - 0^2 = 4 using the second-derivative test. The answer is 4."
          - problem: "For f(x, y) = -x^3 + 3x - y^2, the point (1, 0) is a critical point and D = f_xx f_yy - f_xy^2. Give the verdict and D."
            answer: "verdict = maximum; D = 12"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["maximum"], ["saddle"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "D"}]}
            solution_sketch: "For f(x, y) = -x^3 + 3x - y^2, the second partials are f_xx = -6x, f_yy = -2, and f_xy = 0. At (1, 0), f_xx = -6 and D = (-6)(-2) - 0^2 = 12 by the second-derivative test. Since D > 0 and f_xx < 0, the point is a local maximum. A wrong option 'saddle' comes from ignoring the sign of f_xx. The answer is verdict = maximum; D = 12."
          - problem: "For f(x, y) = x^3 + y^3 - 3xy, the origin is a critical point and D = f_xx f_yy - f_xy^2. Give the verdict and D."
            answer: "verdict = saddle; D = -9"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["saddle"], ["minimum"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "D"}]}
            solution_sketch: "For f(x, y) = x^3 + y^3 - 3xy, the second partials are f_xx = 6x, f_yy = 6y, and f_xy = -3. At the origin, f_xx = 0 and f_yy = 0, so D = (0)(0) - (-3)^2 = -9 by the second-derivative test. Since D < 0, the origin is a saddle point. A wrong option 'minimum' comes from ignoring that D is negative. The answer is verdict = saddle; D = -9."
        constraints: "D = f_xx f_yy - f_xy^2 evaluates to a nonzero integer at each critical point (test never inconclusive)"
      - id: kp3
        name: "Complete find-and-classify problems"
        key_prerequisites: [multivariable-critical-points, partial-derivatives]
        exemplars:
          - problem: "Find and classify all critical points of $f(x, y) = x^3 + y^3 - 3xy$. Give the function value at the local minimum."
            answer: "-1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: Set $f_x = 3x^2 - 3y = 0$ and $f_y = 3y^2 - 3x = 0$. From $f_x$, $y = x^2$. Substitute into $f_y$: $3x^4 - 3x = 0$, so $x = 0$ or $x = 1$. The critical points are $(0,0)$ and $(1,1)$. Step 2: The second-derivative test uses $D = f_{xx} f_{yy} - (f_{xy})^2 = (6x)(6y) - (-3)^2 = 36xy - 9$. At $(0,0)$, $D = -9 < 0$, so $(0,0)$ is a saddle point. At $(1,1)$, $D = 27 > 0$ and $f_{xx} = 6 > 0$, so $(1,1)$ is a local minimum. Step 3: The function value at $(1,1)$ is $f(1,1) = 1 + 1 - 3 = -1$. The answer is -1."
          - problem: "Find and classify all critical points of $f(x, y) = x^4 + y^4 - 4xy$. Give the function value at the local minima."
            answer: "-2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: $f_x = 4x^3 - 4y = 0$ gives $y = x^3$. $f_y = 4y^3 - 4x = 0$ gives $x = y^3$. Substitute to get $x = x^9$, so $x = 0, 1, -1$. Critical points are $(0,0)$, $(1,1)$, $(-1,-1)$. Step 2: $D = f_{xx} f_{yy} - (f_{xy})^2 = (12x^2)(12y^2) - (-4)^2 = 144x^2y^2 - 16$. At $(0,0)$, $D = -16 < 0$, so saddle. At $(1,1)$ and $(-1,-1)$, $D = 128 > 0$ and $f_{xx} = 12 > 0$, so both are local minima. Step 3: $f(1,1) = 1+1-4 = -2$, and $f(-1,-1) = -2$. The answer is -2."
          - problem: "Find and classify all critical points of $f(x, y) = x^3 + y^3 + 3xy$. State the type of the critical point with the smaller x-coordinate."
            answer: "local maximum"
            answer_contract: {"kind": "label", "options": [["local minimum"], ["local maximum"], ["saddle point"], ["undetermined"]]}
            solution_sketch: "Step 1: $f_x = 3x^2 + 3y = 0$ gives $y = -x^2$. $f_y = 3y^2 + 3x = 0$ gives $x = -y^2$. Substitute to get $x = -x^4$, so $x = 0$ or $x = -1$. Critical points are $(0,0)$ and $(-1,-1)$. Step 2: $D = (6x)(6y) - (3)^2 = 36xy - 9$. At $(0,0)$, $D = -9 < 0$, so saddle. At $(-1,-1)$, $D = 27 > 0$ and $f_{xx} = -6 < 0$, so local maximum. The point with smaller x is $(-1,-1)$, which is a local maximum. Step 3: The answer is local maximum. Wrong options: local minimum is the error of taking $f_{xx} > 0$; saddle point is the error of using $D < 0$; undetermined is the error of stopping before the second-derivative test."
          - problem: "Find and classify all critical points of $f(x, y) = x^3 - 3x^2 + 3y^2 - 6y$. For the critical point with the larger x-coordinate, state its type and its function value."
            answer: "type = minimum; value = -7"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["saddle"], ["minimum"]]}, "name": "type"}, {"contract": {"kind": "exact"}, "name": "value"}]}
            solution_sketch: "Step 1: $f_x = 3x^2 - 6x = 3x(x-2) = 0$ gives $x = 0$ or $x = 2$. $f_y = 6y - 6 = 0$ gives $y = 1$. Critical points are $(0,1)$ and $(2,1)$. Step 2: $D = f_{xx} f_{yy} - (f_{xy})^2 = (6x-6)(6) - 0 = 36(x-1)$. At $(0,1)$, $D = -36 < 0$, so saddle. At $(2,1)$, $D = 36 > 0$ and $f_{xx} = 6 > 0$, so local minimum. The larger x is 2, so the point is $(2,1)$, a local minimum. Step 3: $f(2,1) = 8 - 12 + 3 - 6 = -7$. The answer is type = minimum; value = -7. Wrong label option: saddle is the error of classifying the larger-x point as the saddle at $(0,1)$."
          - problem: "Find and classify all critical points of $f(x, y) = x^3 + y^2 - 3x^2 - 6y$. Give the function value at the local minimum."
            answer: "-13"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: $f_x = 3x^2 - 6x = 3x(x-2) = 0$ gives $x = 0$ or $x = 2$. $f_y = 2y - 6 = 0$ gives $y = 3$. Critical points are $(0,3)$ and $(2,3)$. Step 2: $D = f_{xx} f_{yy} - (f_{xy})^2 = (6x-6)(2) - 0 = 12(x-1)$. At $(0,3)$, $D = -12 < 0$, so saddle. At $(2,3)$, $D = 12 > 0$ and $f_{xx} = 6 > 0$, so local minimum. Step 3: $f(2,3) = 8 + 9 - 12 - 18 = -13$. The answer is -13."
          - problem: "Find and classify all critical points of $f(x, y) = x^3 + y^3 - 6xy$. For the critical point with the smaller x-coordinate, state its type and its function value."
            answer: "type = saddle; value = 0"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["saddle"], ["minimum"]]}, "name": "type"}, {"contract": {"kind": "exact"}, "name": "value"}]}
            solution_sketch: "Step 1: $f_x = 3x^2 - 6y = 0$ gives $y = x^2/2$. $f_y = 3y^2 - 6x = 0$ gives $x = y^2/2$. Substitute to get $x = (x^2/2)^2 / 2 = x^4/8$, so $x = 0$ or $x = 2$. Critical points are $(0,0)$ and $(2,2)$. Step 2: $D = (6x)(6y) - (-6)^2 = 36xy - 36$. At $(0,0)$, $D = -36 < 0$, so saddle. At $(2,2)$, $D = 108 > 0$ and $f_{xx} = 12 > 0$, so local minimum. The smaller x is 0, so the point is $(0,0)$, a saddle point. Step 3: $f(0,0) = 0$. The answer is type = saddle; value = 0. Wrong label option: minimum is the error of classifying the smaller-x point as the minimum at $(2,2)$."
        constraints: "2-3 critical points found by substitution; every classification decisive; report function values at extrema"
    diagnostic_exemplar:
      problem: 'Find and classify all critical points of $f(x, y) = x^3 - 6xy + 3y^2$.'
      answer: '$(0, 0)$ is a saddle point; $(2, 2)$ is a local minimum with $f(2,2) = -4$.'
      answer_contract: {kind: none}
      solution_sketch: '$f_y = -6x + 6y = 0$ gives $y = x$, and $f_x = 3x^2 - 6y = 0$ then gives $3x^2 - 6x = 0$, so $x = 0$ or $x = 2$. With $f_{xx} = 6x$, $f_{yy} = 6$, $f_{xy} = -6$: $D = 36x - 36$, which is $-36 < 0$ at $(0,0)$ (saddle) and $36 > 0$ with $f_{xx} = 12 > 0$ at $(2,2)$ (local minimum).'
    anki_seeds:
      - front: 'Second-derivative test discriminant for $f(x, y)$?'
        back: '$D = f_{xx} f_{yy} - f_{xy}^2$, evaluated at the critical point.'
        type: basic
      - front: 'Second-derivative test outcomes: $D < 0$; $D > 0, f_{xx} > 0$; $D > 0, f_{xx} < 0$; $D = 0$?'
        back: 'Saddle; local min; local max; inconclusive.'
        type: basic

  - id: absolute-extrema-closed-regions
    name: "Absolute Extrema on Closed Regions"
    core: false                # optimisation application; terminal
    difficulty: 0.80
    drill: false
    answer_kind: numeric
    expected_time_secs: 300
    prerequisites:
      - id: multivariable-local-extrema
        weight: 0.7
        key: true
      - id: closed-interval-method
        weight: 0.5
        key: true
      - id: multivariable-critical-points
        weight: 0.4
        key: false
    knowledge_points:
      - id: kp1
        name: "Linear objectives: extrema on the boundary"
        key_prerequisites: [multivariable-critical-points, closed-interval-method]
        exemplars:
          - problem: "Find the absolute maximum and minimum values of f(x, y) = 6 - x - y on the triangle with vertices (0,0), (4,0) and (0,4)."
            answer: "maximum = 6; minimum = 2"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "maximum"}, {"contract": {"kind": "exact"}, "name": "minimum"}]}
            solution_sketch: "The function f(x, y) = 6 - x - y is linear, so its absolute extrema on the triangle occur at the vertices or along an edge where the function is constant. Evaluate at the vertices: f(0,0) = 6, f(4,0) = 2, f(0,4) = 2. On the hypotenuse x + y = 4, f = 6 - x - (4 - x) = 2, so the minimum is 2 along that edge. The absolute maximum is 6 and the absolute minimum is 2, so the answer is maximum = 6; minimum = 2."
          - problem: "Find the absolute maximum and minimum values of f(x, y) = 5x + 2y on the square with corners (0,0), (1,0), (0,1) and (1,1)."
            answer: "maximum = 7; minimum = 0"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "maximum"}, {"contract": {"kind": "exact"}, "name": "minimum"}]}
            solution_sketch: "The function f(x, y) = 5x + 2y is linear, so its extrema on the square occur at the vertices. Evaluate at the four corners: f(0,0) = 0, f(1,0) = 5, f(0,1) = 2, f(1,1) = 7. The largest value is 7 and the smallest value is 0, so the answer is maximum = 7; minimum = 0."
          - problem: "Find the absolute maximum value of f(x, y) = 3x - 2y on the triangle with vertices (0,0), (2,0) and (0,2)."
            answer: "6"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The function f(x, y) = 3x - 2y is linear, so the maximum on the triangle occurs at a vertex or along an edge where f is constant. Evaluate at the vertices: f(0,0) = 0, f(2,0) = 6, f(0,2) = -4. On the hypotenuse x + y = 2, f = 3x - 2(2 - x) = 5x - 4, which is at most 6 at x = 2. The absolute maximum value is 6."
          - problem: "Find the absolute minimum value of f(x, y) = 4x + 3y on the triangle with vertices (0,0), (3,0) and (0,3)."
            answer: "0"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The function f(x, y) = 4x + 3y is linear, so the minimum on the triangle occurs at a vertex or along an edge where f is constant. Evaluate at the vertices: f(0,0) = 0, f(3,0) = 12, f(0,3) = 9. On the hypotenuse x + y = 3, f = 4x + 3(3 - x) = x + 9, which is at least 9 at x = 0. The absolute minimum value is 0."
          - problem: "Find the point where the absolute maximum of f(x, y) = 2x + 5y on the square [0,1] x [0,1] occurs. Give the answer as (x, y)."
            answer: "(1, 1)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "For a linear function on a square, the maximum occurs at a vertex. Evaluate at the four corners: f(0,0) = 0, f(1,0) = 2, f(0,1) = 5, f(1,1) = 7. The largest value is 7, which occurs at the point (1, 1). The point is (1, 1)."
          - problem: "Find the absolute maximum value of f(x, y) = 10 - 2x - 3y on the triangle with vertices (0,0), (2,0) and (0,2)."
            answer: "10"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The function f(x, y) = 10 - 2x - 3y is linear, so the maximum on the triangle occurs at a vertex or along an edge where f is constant. Evaluate at the vertices: f(0,0) = 10, f(2,0) = 6, f(0,2) = 4. On the hypotenuse x + y = 2, f = 10 - 2x - 3(2 - x) = 4 + x, which is at most 6 at x = 2. The absolute maximum value is 10."
        constraints: "linear objectives on triangles or squares; extremes at vertices or constant along one edge"
      - id: kp2
        name: "Disks: parametrized boundaries"
        key_prerequisites: [multivariable-local-extrema, closed-interval-method]
        exemplars:
          - problem: "Let f(x, y) = x^2 + y^2 + 4x. On the circle x^2 + y^2 = 9, find the absolute maximum value of f."
            answer: "21"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full object is f(x,y)=x^2+y^2+4x on the circle x^2+y^2=9. Step 1: use the circle equation x^2+y^2=9 to reduce the boundary to the single variable expression f=9+4x. Step 2: on the circle x lies in [-3,3], so the linear expression 9+4x is largest at x=3. The absolute maximum value is 21."
          - problem: "Let f(x, y) = x^2 + y^2 - 6y. On the circle x^2 + y^2 = 16, find the absolute minimum value of f."
            answer: "-8"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full object is f(x,y)=x^2+y^2-6y on the circle x^2+y^2=16. Step 1: replace x^2+y^2 by 16 on the boundary to get f=16-6y. Step 2: y lies in [-4,4], so the decreasing linear expression 16-6y is smallest at y=4. The absolute minimum value is -8."
          - problem: "Let f(x, y) = x^2 + y^2 + 8x. On the circle x^2 + y^2 = 25, find the absolute maximum value of f."
            answer: "65"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full object is f(x,y)=x^2+y^2+8x on the circle x^2+y^2=25. Step 1: substitute the boundary relation x^2+y^2=25, giving f=25+8x. Step 2: x ranges from -5 to 5, and the increasing linear expression reaches its maximum at x=5. The absolute maximum value is 65."
          - problem: "Let f(x, y) = x^2 + y^2 - 4x. On the circle x^2 + y^2 = 36, find the absolute minimum value of f."
            answer: "12"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full object is f(x,y)=x^2+y^2-4x on the circle x^2+y^2=36. Step 1: use x^2+y^2=36 to reduce the boundary to f=36-4x. Step 2: x lies in [-6,6], so the decreasing linear expression is smallest at x=6. The absolute minimum value is 12."
          - problem: "Let f(x, y) = x^2 + y^2 + 10y. On the circle x^2 + y^2 = 4, find the absolute maximum value of f."
            answer: "24"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full object is f(x,y)=x^2+y^2+10y on the circle x^2+y^2=4. Step 1: replace x^2+y^2 by 4 on the boundary to get f=4+10y. Step 2: y lies in [-2,2], so the increasing linear expression is largest at y=2. The absolute maximum value is 24."
          - problem: "Let f(x, y) = x^2 + y^2 + 6x. On the circle x^2 + y^2 = 1, find the absolute minimum value of f."
            answer: "-5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full object is f(x,y)=x^2+y^2+6x on the circle x^2+y^2=1. Step 1: substitute x^2+y^2=1 on the boundary, giving f=1+6x. Step 2: x ranges from -1 to 1, so the increasing linear expression is smallest at x=-1. The absolute minimum value is -5."
        constraints: "on the boundary circle the objective reduces to one variable via x^2 + y^2 = r^2; candidates at integer points"
      - id: kp3
        name: "Interior critical points versus boundary candidates"
        key_prerequisites: [multivariable-local-extrema, closed-interval-method]
        exemplars:
          - problem: "Find the absolute minimum and maximum values of f(x, y) = x^2 + y^2 - 2x - 2y on the square with 0 <= x <= 2 and 0 <= y <= 2, and give the two values as min and max."
            answer: "min = -2; max = 0"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "min"}, {"contract": {"kind": "exact"}, "name": "max"}]}
            solution_sketch: "The interior critical point solves fx = 2x - 2 = 0 and fy = 2y - 2 = 0, giving (1, 1) with f(1, 1) = -2. On the boundary the closed-interval method reduces each edge to a one-variable quadratic, with values from -1 up to 0 at the four corners. Comparing the interior candidate with all boundary candidates gives min = -2; max = 0."
          - problem: "Find the absolute minimum and maximum values of f(x, y) = xy - x - y + 3 on the triangle with vertices (0, 0), (2, 0) and (0, 4), and give the two values as min and max."
            answer: "min = -1; max = 3"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "min"}, {"contract": {"kind": "exact"}, "name": "max"}]}
            solution_sketch: "The interior critical point solves fx = y - 1 = 0 and fy = x - 1 = 0, giving (1, 1) with f(1, 1) = 2. On the boundary x = 0 the function is 3 - y, on y = 0 it is 3 - x, and on the hypotenuse y = 4 - 2x it is -2x^2 + 5x - 1 with maximum 17/8 at x = 5/4, so the boundary values run from -1 at (0, 4) to 3 at (0, 0). Comparing the interior candidate with the boundary candidates gives min = -1; max = 3."
          - problem: "Find the absolute minimum value of f(x, y) = x^2 + y^2 - 4x - 2y on the square with 0 <= x <= 3 and 0 <= y <= 3."
            answer: "-5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The interior critical point solves fx = 2x - 4 = 0 and fy = 2y - 2 = 0, giving (2, 1) with f(2, 1) = -5. On the boundary the closed-interval method gives values between -4 on the edge y = 0 and 3 at a corner. Since -5 is below every boundary candidate, the absolute minimum is -5."
          - problem: "Find the absolute maximum value of f(x, y) = x^2 + y^2 - 6x - 4y + 5 on the triangle with vertices (0, 0), (8, 0) and (0, 4)."
            answer: "21"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The interior critical point solves fx = 2x - 6 = 0 and fy = 2y - 4 = 0, giving (3, 2) with f(3, 2) = -8. On the boundary the closed-interval method gives x^2 - 6x + 5 on y = 0, y^2 - 4y + 5 on x = 0, and (5/4)x^2 - 8x + 5 on the hypotenuse, whose largest value is 21 at (8, 0). Comparing the interior candidate with the boundary candidates gives an absolute maximum of 21."
          - problem: "Find the absolute minimum and maximum values of f(x, y) = x^2 + y^2 - 4x on the disk x^2 + y^2 <= 9, and give the two values as min and max."
            answer: "min = -4; max = 21"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "min"}, {"contract": {"kind": "exact"}, "name": "max"}]}
            solution_sketch: "The interior critical point solves fx = 2x - 4 = 0 and fy = 2y = 0, giving (2, 0) with f(2, 0) = -4. On the boundary circle x^2 + y^2 = 9 the function becomes 9 - 4x for -3 <= x <= 3, and the closed-interval method gives values from -3 at x = 3 to 21 at x = -3. Comparing the interior value -4 with the boundary values gives min = -4; max = 21."
          - problem: "Find the absolute maximum value of f(x, y) = 2x^2 + y^2 - 4x - 2y + 1 on the rectangle with 0 <= x <= 3 and 0 <= y <= 2."
            answer: "7"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The interior critical point solves fx = 4x - 4 = 0 and fy = 2y - 2 = 0, giving (1, 1) with f(1, 1) = -2. On the four boundary edges the closed-interval method gives values between -1 and 7, and the largest boundary value 7 occurs at (3, 0) and (3, 2). Comparing the interior candidate with the boundary candidates gives an absolute maximum of 7."
        constraints: "regions are disks, rectangles, or triangles; boundary restriction reduces to one variable with exact endpoints; require comparing interior and boundary candidates"
    diagnostic_exemplar:
      problem: 'Find the absolute extrema of $f(x, y) = x^2 + y^2 - 2y$ on the disk $x^2 + y^2 \le 4$.'
      answer: 'Absolute minimum $-1$ at $(0, 1)$; absolute maximum $8$ at $(0, -2)$.'
      answer_contract: {kind: none}
      solution_sketch: 'Interior: $\nabla f = 0$ at $(0, 1)$, $f = -1$. Boundary: $f = 4 - 2y$, $y \in [-2, 2]$, giving $8$ at $(0,-2)$ and $0$ at $(0,2)$.'
    anki_seeds:
      - front: 'Why must $f$ attain absolute extrema on a closed bounded region?'
        back: 'The Extreme Value Theorem: a continuous function on a closed, bounded region attains its max and min.'
        type: basic
      - front: 'Procedure for absolute extrema of $f$ on a closed region $D$?'
        back: '1) Find interior critical points; 2) find extremes of $f$ restricted to the boundary; 3) compare all candidate values.'
        type: basic

  - id: applied-multivariable-optimization
    name: "Applied Optimization in Several Variables"
    core: false                # applied optimisation genre; terminal
    difficulty: 0.81
    drill: false
    answer_kind: numeric
    expected_time_secs: 300
    prerequisites:
      - id: multivariable-local-extrema
        weight: 0.8
        key: true
      - id: basic-optimization
        weight: 0.4
        key: false
    knowledge_points:
      - id: kp1
        name: "Distance problems"
        key_prerequisites: [multivariable-local-extrema]
        exemplars:
          - problem: "Find the point on the plane x + 2y + 3z = 14 closest to the origin. Give the answer as (x, y, z)."
            answer: "(1, 2, 3)"
            answer_contract: {"arity": 3, "kind": "coordinates"}
            solution_sketch: "Step 1: write the squared distance f(x, y) = x^2 + y^2 + ((14 - x - 2y)/3)^2 after substituting the plane equation for z. Step 2: set the two partial derivatives of f to zero, which gives x = 1 and y = 2. Step 3: use the plane to get z = (14 - 1 - 4)/3 = 3. The closest point is (1, 2, 3)."
          - problem: "Which point on the plane 2x + 2y + z = 9 is nearest the origin? Give the answer as (x, y, z)."
            answer: "(2, 2, 1)"
            answer_contract: {"arity": 3, "kind": "coordinates"}
            solution_sketch: "Step 1: minimize the squared distance f(x, y) = x^2 + y^2 + (9 - 2x - 2y)^2 by writing z = 9 - 2x - 2y. Step 2: the partial derivatives vanish when x = 2z and y = 2z. Step 3: the plane equation then gives 9 = 9z, so z = 1, x = 2, y = 2. The nearest point is (2, 2, 1)."
          - problem: "The plane x + y + 2z = 8: find the point on it with least distance from the origin. Give the answer as (x, y, z)."
            answer: "(4/3, 4/3, 8/3)"
            answer_contract: {"arity": 3, "kind": "coordinates"}
            solution_sketch: "Step 1: write the squared distance f(x, y) = x^2 + y^2 + ((8 - x - y)/2)^2 by solving the plane for z. Step 2: set both partial derivatives to zero, giving z = 2x and z = 2y. Step 3: substitute into the plane to get 6x = 8, so x = 4/3, y = 4/3, z = 8/3. The closest point is (4/3, 4/3, 8/3)."
          - problem: "Find the point on the plane x - 2y + 2z = 9 that minimizes the distance to the origin. Give the answer as (x, y, z)."
            answer: "(1, -2, 2)"
            answer_contract: {"arity": 3, "kind": "coordinates"}
            solution_sketch: "Step 1: minimize the squared distance f(x, y) = x^2 + y^2 + ((9 - x + 2y)/2)^2 after substituting z from the plane. Step 2: the partial derivatives are zero when x = 1 and y = -2. Step 3: the plane then gives z = (9 - 1 - 4)/2 = 2. The closest point is (1, -2, 2)."
          - problem: "Find the point on the plane x + y + z = 6 closest to the point (4, 0, 0). Give the answer as (x, y, z)."
            answer: "(14/3, 2/3, 2/3)"
            answer_contract: {"arity": 3, "kind": "coordinates"}
            solution_sketch: "Step 1: minimize the squared distance f(x, y) = (x - 4)^2 + y^2 + (6 - x - y)^2 by replacing z with 6 - x - y. Step 2: setting the partial derivatives to zero gives 2x + y = 10 and x + 2y = 6. Step 3: solve to get y = 2/3 and x = 14/3, then z = 6 - 14/3 - 2/3 = 2/3. The closest point is (14/3, 2/3, 2/3)."
          - problem: "Find the point on the plane 3x + 4z = 12 closest to the origin. Give the answer as (x, y, z)."
            answer: "(36/25, 0, 48/25)"
            answer_contract: {"arity": 3, "kind": "coordinates"}
            solution_sketch: "Step 1: since the plane lacks y, set y = 0 and minimize f(x, z) = x^2 + z^2 subject to 3x + 4z = 12. Step 2: solve the plane for z and set the derivative to zero, giving z = 4x/3. Step 3: substitute back to get 25x/3 = 12, so x = 36/25 and z = 48/25. The closest point is (36/25, 0, 48/25)."
        constraints: "minimize SQUARED distance; substitute the plane equation to get two free variables; answers integers or simple fractions/radicals"
      - id: kp2
        name: "Product and box problems"
        key_prerequisites: [multivariable-local-extrema]
        exemplars:
          - problem: "Three positive numbers have sum 42. Find the largest possible value of their product."
            answer: "2744"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1, constraint substitution: let the numbers be x, y and 42 - x - y, so the product is P = xy(42 - x - y). Step 2, gradient conditions: set P_x = y(42 - 2x - y) = 0 and P_y = x(42 - x - 2y) = 0. Step 3, solve the system: x = y = 14, and the third number is also 14. The maximum product is 14^3 = 2744."
          - problem: "An open-top rectangular box must have volume 256 cubic meters. Find the dimensions that minimize the material used for the base and four sides. Give the answer as (width, depth, height)."
            answer: "(8, 8, 4)"
            answer_contract: {"arity": 3, "kind": "coordinates"}
            solution_sketch: "Step 1, constraint substitution: let the base be x by y and the height be z, with xyz = 256, so z = 256/(xy). Step 2, write the material S = xy + 2xz + 2yz = xy + 512/y + 512/x. Step 3, gradient conditions: S_x = y - 512/x^2 = 0 and S_y = x - 512/y^2 = 0 give x = y = 8. Step 4, substitute back: z = 256/64 = 4, so the dimensions are (8, 8, 4)."
          - problem: "A closed rectangular box must have volume 512 cubic meters. Find the minimum surface area of the box."
            answer: "384"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1, constraint substitution: let the side lengths be x, y and z, with xyz = 512, so z = 512/(xy). Step 2, write the surface area S = 2xy + 2xz + 2yz = 2xy + 1024/y + 1024/x. Step 3, gradient conditions: S_x = 2y - 1024/x^2 = 0 and S_y = 2x - 1024/y^2 = 0 give x = y = 8. Step 4, substitute back: z = 512/64 = 8 and the minimum surface area is 384."
          - problem: "An open-top rectangular box must have volume 500 cubic meters. Find the minimum material needed for its base and four sides, in square meters."
            answer: "300"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1, constraint substitution: let the base be x by y and the height be z, with xyz = 500, so z = 500/(xy). Step 2, write the material S = xy + 2xz + 2yz = xy + 1000/y + 1000/x. Step 3, gradient conditions: S_x = y - 1000/x^2 = 0 and S_y = x - 1000/y^2 = 0 give x = y = 10. Step 4, substitute back: z = 500/100 = 5 and the minimum material is 300."
          - problem: "Three positive numbers have product 125. Find the smallest possible value of their sum."
            answer: "15"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1, constraint substitution: let the numbers be x, y and 125/(xy), so the sum is S = x + y + 125/(xy). Step 2, gradient conditions: S_x = 1 - 125/(x^2 y) = 0 and S_y = 1 - 125/(x y^2) = 0. Step 3, solve the system: x = y = 5, and the third number is also 5. The smallest sum is 5 + 5 + 5 = 15."
          - problem: "A closed rectangular box must have volume 343 cubic meters. Find the dimensions that minimize the surface area. Give the answer as (length, width, height)."
            answer: "(7, 7, 7)"
            answer_contract: {"arity": 3, "kind": "coordinates"}
            solution_sketch: "Step 1, constraint substitution: let the side lengths be x, y and z, with xyz = 343, so z = 343/(xy). Step 2, write the surface area S = 2xy + 2xz + 2yz = 2xy + 686/y + 686/x. Step 3, gradient conditions: S_x = 2y - 686/x^2 = 0 and S_y = 2x - 686/y^2 = 0 give x = y = 7. Step 4, substitute back: z = 343/49 = 7, so the dimensions are (7, 7, 7)."
        constraints: "eliminate one variable with the given constraint, then solve grad = 0; dimensions come out as small integers"
      - id: kp3
        name: "Confirming the nature of the optimum"
        key_prerequisites: [multivariable-local-extrema]
        exemplars:
          - problem: "For g(x, y) = x^2 + y^2 + (3 - x - y)^2, use the second-derivative test at the critical point (1, 1). State the nature of the critical point and give the value of D."
            answer: "verdict = minimum; D = 12"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["minimum"], ["maximum"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "D"}]}
            solution_sketch: "Write g_x = 4x + 2y - 6 and g_y = 2x + 4y - 6 by the power rule. At (1, 1) both partials are 0. The second partials are g_xx = 4, g_yy = 4, and g_xy = 2. The second-derivative test gives D = 4*4 - 2^2 = 12. Since D > 0 and g_xx > 0, the critical point is a local minimum. The answer is verdict = minimum; D = 12."
          - problem: "For P(x, y) = xy(30 - x - y), use the second-derivative test at the critical point (10, 10). State the nature of the critical point and give the value of D."
            answer: "verdict = maximum; D = 300"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["minimum"], ["maximum"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "D"}]}
            solution_sketch: "Expand P as 30xy - x^2 y - x y^2. The first partials are P_x = 30y - 2xy - y^2 and P_y = 30x - x^2 - 2xy. At (10, 10) both are 0. The second partials are P_xx = -20, P_yy = -20, and P_xy = -10 by the power rule. The second-derivative test gives D = (-20)(-20) - (-10)^2 = 300. Since D > 0 and P_xx < 0, the critical point is a local maximum. The answer is verdict = maximum; D = 300."
          - problem: "For f(x, y) = x^2 + 4y^2 - 2x + 8y, use the second-derivative test at the critical point (1, -1). State the nature of the critical point and give the value of D."
            answer: "verdict = minimum; D = 16"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["minimum"], ["maximum"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "D"}]}
            solution_sketch: "Compute f_x = 2x - 2 and f_y = 8y + 8 by the power rule. Setting them to zero gives the critical point (1, -1). The second partials are f_xx = 2, f_yy = 8, and f_xy = 0. The second-derivative test gives D = 2*8 - 0^2 = 16. Since D > 0 and f_xx > 0, the critical point is a local minimum. The answer is verdict = minimum; D = 16."
          - problem: "For f(x, y) = -x^2 - 3y^2 + 4x + 6y, use the second-derivative test at the critical point (2, 1). State the nature of the critical point and give the value of D."
            answer: "verdict = maximum; D = 12"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["minimum"], ["maximum"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "D"}]}
            solution_sketch: "Compute f_x = -2x + 4 and f_y = -6y + 6 by the power rule. Setting them to zero gives the critical point (2, 1). The second partials are f_xx = -2, f_yy = -6, and f_xy = 0. The second-derivative test gives D = (-2)(-6) - 0^2 = 12. Since D > 0 and f_xx < 0, the critical point is a local maximum. The answer is verdict = maximum; D = 12."
          - problem: "For f(x, y) = 3x^2 + 3y^2 + 2xy, use the second-derivative test at the critical point (0, 0). Give D and fxx as (D, fxx)."
            answer: "(32, 6)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "Compute f_x = 6x + 2y and f_y = 6y + 2x by the power rule. The critical point solves both to zero, giving (0, 0). The second partials are f_xx = 6, f_yy = 6, and f_xy = 2. The second-derivative test gives D = 6*6 - 2^2 = 32. The answer is (32, 6)."
          - problem: "For f(x, y) = 2x^2 + 5y^2 - 4x + 10y, use the second-derivative test at the critical point (1, -1). Give D and fxx as (D, fxx)."
            answer: "(40, 4)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "Compute f_x = 4x - 4 and f_y = 10y + 10 by the power rule. The critical point solves both to zero, giving (1, -1). The second partials are f_xx = 4, f_yy = 10, and f_xy = 0. The second-derivative test gives D = 4*10 - 0^2 = 40. The answer is (40, 4)."
        constraints: "second partials evaluate to integers; D nonzero so the test is decisive"
    diagnostic_exemplar:
      problem: 'An open-top rectangular box must have volume $108$ m$^3$. Find the dimensions that minimize the material used (base plus four sides).'
      answer: 'Base $6 \times 6$ m with height $3$ m, using $108$ m$^2$ of material.'
      answer_contract: {kind: none}
      solution_sketch: 'With base $x \times y$ and height $z = \frac{108}{xy}$, the material is $S = xy + 2xz + 2yz = xy + \frac{216}{y} + \frac{216}{x}$. Then $S_x = y - \frac{216}{x^2} = 0$ and $S_y = x - \frac{216}{y^2} = 0$ force $x = y$ and $x^3 = 216$, so $x = y = 6$ and $z = 3$; $S = 36 + 36 + 36 = 108$.'
    anki_seeds:
      - front: 'When optimizing distance, what should you minimize instead of the distance itself?'
        back: 'The squared distance $d^2$ — it has the same minimizer and avoids square roots in the derivatives.'
        type: basic
      - front: 'Strategy for optimizing $f(x, y, z)$ with one equation constraint (without Lagrange)?'
        back: 'Solve the constraint for one variable, substitute, and find critical points of the resulting two-variable function.'
        type: basic

  - id: lagrange-multipliers-single-constraint
    name: "Lagrange Multipliers: One Constraint"
    core: true
    difficulty: 0.78
    drill: false
    answer_kind: numeric
    expected_time_secs: 240
    prerequisites:
      - id: gradient-directional-derivatives
        weight: 0.7
        key: true
      - id: multivariable-critical-points
        weight: 0.5
        key: true
      - id: systems-substitution
        weight: 0.3
        key: false
    knowledge_points:
      - id: kp1
        name: "The Lagrange condition"
        key_prerequisites: [gradient-directional-derivatives, multivariable-critical-points]
        exemplars:
          - problem: "Use Lagrange multipliers for $f(x,y)=x+2y$ subject to $x^2+2y^2=12$. Find the value of $\\lambda$ at the point $(2,2)$."
            answer: "1/4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The Lagrange condition is grad f = lambda grad g, with f = x + 2y and g = x^2 + 2y^2. Step 1: compute grad f = (1, 2) and grad g = (2x, 4y). Step 2: at (2, 2), grad g = (4, 8), so (1, 2) = lambda (4, 8). Step 3: solve 1 = 4 lambda to get lambda = 1/4. The value is 1/4."
          - problem: "Use Lagrange multipliers to maximize $f(x,y)=x+3y$ subject to $x^2+3y^2=16$. Find the maximum value."
            answer: "8"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The Lagrange condition is grad f = lambda grad g, with f = x + 3y and g = x^2 + 3y^2. Step 1: write 1 = 2 lambda x and 3 = 6 lambda y. Step 2: both equations give lambda = 1/(2x) and lambda = 1/(2y), so x = y. Step 3: the constraint becomes 4x^2 = 16, so x = 2 or x = -2. Step 4: f = x + 3y = 4x, whose largest value is 8. The maximum value is 8."
          - problem: "Use Lagrange multipliers to maximize $f(x,y)=2x+3y$ subject to $2x^2+3y^2=20$. Find the maximum value."
            answer: "10"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The Lagrange condition is grad f = lambda grad g, with f = 2x + 3y and g = 2x^2 + 3y^2. Step 1: write 2 = 4 lambda x and 3 = 6 lambda y. Step 2: these give lambda = 1/(2x) and lambda = 1/(2y), so x = y. Step 3: the constraint becomes 5x^2 = 20, so x = 2 or x = -2. Step 4: f = 2x + 3y = 5x, whose largest value is 10. The maximum value is 10."
          - problem: "Use Lagrange multipliers to maximize $f(x,y)=3x+4y$ subject to $3x^2+4y^2=28$. Give the point where the maximum occurs as (x, y)."
            answer: "(2, 2)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "The Lagrange condition is grad f = lambda grad g, with f = 3x + 4y and g = 3x^2 + 4y^2. Step 1: write 3 = 6 lambda x and 4 = 8 lambda y. Step 2: these give lambda = 1/(2x) and lambda = 1/(2y), so x = y. Step 3: the constraint becomes 7x^2 = 28, so x = 2 or x = -2. Step 4: f = 3x + 4y = 7x, which is largest at x = 2, y = 2. The maximum occurs at the point (2, 2)."
          - problem: "Use Lagrange multipliers to maximize $f(x,y)=x+4y$ subject to $x^2+4y^2=45$. Find the maximum value."
            answer: "15"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The Lagrange condition is grad f = lambda grad g, with f = x + 4y and g = x^2 + 4y^2. Step 1: write 1 = 2 lambda x and 4 = 8 lambda y. Step 2: these give lambda = 1/(2x) and lambda = 1/(2y), so x = y. Step 3: the constraint becomes 5x^2 = 45, so x = 3 or x = -3. Step 4: f = x + 4y = 5x, whose largest value is 15. The maximum value is 15."
          - problem: "Use Lagrange multipliers to maximize $f(x,y)=2x+5y$ subject to $2x^2+5y^2=63$. Find the maximum value."
            answer: "21"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The Lagrange condition is grad f = lambda grad g, with f = 2x + 5y and g = 2x^2 + 5y^2. Step 1: write 2 = 4 lambda x and 5 = 10 lambda y. Step 2: these give lambda = 1/(2x) and lambda = 1/(2y), so x = y. Step 3: the constraint becomes 7x^2 = 63, so x = 3 or x = -3. Step 4: f = 2x + 5y = 7x, whose largest value is 21. The maximum value is 21."
        constraints: "systems written from grad f = lambda grad g; when solving, symmetry gives x = y and integer points"
      - id: kp2
        name: "Linear constraints"
        key_prerequisites: [gradient-directional-derivatives, systems-substitution]
        exemplars:
          - problem: "Use Lagrange multipliers to find the point where f(x, y) = xy is largest subject to x + y = 10, with x > 0 and y > 0. Give the answer as (x, y)."
            answer: "(5, 5)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "The Lagrange multiplier condition for f = xy and g = x + y - 10 gives grad f = lambda grad g, so y = lambda and x = lambda. These equations imply x = y, and the constraint x + y = 10 then gives 2x = 10, so x = 5 and y = 5. The maximizing point is (5, 5)."
          - problem: "Use Lagrange multipliers to find the point where f(x, y) = x^2 + y^2 is smallest subject to x + 2y = 5. Give the answer as (x, y)."
            answer: "(1, 2)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "The Lagrange multiplier condition for f = x^2 + y^2 and g = x + 2y - 5 gives 2x = lambda and 2y = 2 lambda. Dividing the two equations gives y = 2x, and substituting into x + 2y = 5 gives x + 4x = 5, so x = 1 and y = 2. The minimizing point is (1, 2)."
          - problem: "Use Lagrange multipliers to find the point where f(x, y) = xy is largest subject to 2x + y = 12, with x > 0 and y > 0. Give the answer as (x, y)."
            answer: "(3, 6)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "The Lagrange multiplier condition for f = xy and g = 2x + y - 12 gives y = 2 lambda and x = lambda. Eliminating lambda gives y = 2x, and the constraint 2x + y = 12 becomes 2x + 2x = 12, so x = 3 and y = 6. The maximizing point is (3, 6)."
          - problem: "Use Lagrange multipliers to find the point where f(x, y) = x^2 + y^2 is smallest subject to 3x + y = 10. Give the answer as (x, y)."
            answer: "(3, 1)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "The Lagrange multiplier condition for f = x^2 + y^2 and g = 3x + y - 10 gives 2x = 3 lambda and 2y = lambda. Eliminating lambda gives x = 3y, and substituting into 3x + y = 10 gives 9y + y = 10, so y = 1 and x = 3. The minimizing point is (3, 1)."
          - problem: "Use Lagrange multipliers to find the point where f(x, y) = xy is largest subject to x + 3y = 12, with x > 0 and y > 0. Give the answer as (x, y)."
            answer: "(6, 2)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "The Lagrange multiplier condition for f = xy and g = x + 3y - 12 gives y = lambda and x = 3 lambda. Eliminating lambda gives x = 3y, and the constraint x + 3y = 12 becomes 3y + 3y = 12, so y = 2 and x = 6. The maximizing point is (6, 2)."
          - problem: "Use Lagrange multipliers to find the point where f(x, y) = x^2 + y^2 is smallest subject to x + y = 4. Give the answer as (x, y)."
            answer: "(2, 2)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "The Lagrange multiplier condition for f = x^2 + y^2 and g = x + y - 4 gives 2x = lambda and 2y = lambda. These equations imply x = y, and the constraint x + y = 4 then gives 2x = 4, so x = 2 and y = 2. The minimizing point is (2, 2)."
        constraints: "linear constraint, quadratic or product objective; solutions are integer points"
      - id: kp3
        name: "Circle constraints"
        key_prerequisites: [gradient-directional-derivatives, multivariable-critical-points]
        exemplars:
          - problem: "Let $f(x, y) = xy$. Use Lagrange multipliers to find the maximum and minimum values of $f$ on the circle $x^2 + y^2 = 8$, and give the point where each extreme occurs with a positive x-coordinate."
            answer: "max = 4; min = -4; pmax = (2, 2); pmin = (2, -2)"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "max"}, {"contract": {"kind": "exact"}, "name": "min"}, {"contract": {"arity": 2, "kind": "coordinates"}, "name": "pmax"}, {"contract": {"arity": 2, "kind": "coordinates"}, "name": "pmin"}]}
            solution_sketch: "Set up the Lagrange system for $f(x,y)=xy$ on $x^2+y^2=8$: the equations $y=2\\lambda x$ and $x=2\\lambda y$, divided by each other, force $x^2=y^2$ by the substitution rule. The constraint then gives $x^2=4$, so $x=\\pm 2$ and $y=\\pm 2$, giving four candidate points. Evaluate $f$ at each: $f(2,2)=4$ and $f(-2,-2)=4$ are the largest values, while $f(2,-2)=-4$ and $f(-2,2)=-4$ are the smallest. Taking the candidate points with positive x-coordinate, the answer is max = 4; min = -4; pmax = (2, 2); pmin = (2, -2)."
          - problem: "Let $f(x, y) = 5x + 12y$. Use Lagrange multipliers to find the maximum and minimum values of $f$ on the circle $x^2 + y^2 = 169$, and give the point where each extreme occurs."
            answer: "max = 169; min = -169; pmax = (5, 12); pmin = (-5, -12)"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "max"}, {"contract": {"kind": "exact"}, "name": "min"}, {"contract": {"arity": 2, "kind": "coordinates"}, "name": "pmax"}, {"contract": {"arity": 2, "kind": "coordinates"}, "name": "pmin"}]}
            solution_sketch: "Write the Lagrange system for $f(x,y)=5x+12y$ on $x^2+y^2=169$: $5=2\\lambda x$, $12=2\\lambda y$, and the constraint. Dividing the two gradient equations gives $x/5=y/12$, so set $x=5t$ and $y=12t$ by substitution. The constraint gives $169t^2=169$, so $t=1$ or $t=-1$. Evaluate: $f(5,12)=25+144=169$ and $f(-5,-12)=-169$. The answer is max = 169; min = -169; pmax = (5, 12); pmin = (-5, -12)."
          - problem: "Let $f(x, y) = x^2 + xy + y^2$. Use Lagrange multipliers to find the maximum and minimum values of $f$ on the circle $x^2 + y^2 = 18$, and give the point where each extreme occurs with a positive y-coordinate."
            answer: "max = 27; min = 9; pmax = (3, 3); pmin = (-3, 3)"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "max"}, {"contract": {"kind": "exact"}, "name": "min"}, {"contract": {"arity": 2, "kind": "coordinates"}, "name": "pmax"}, {"contract": {"arity": 2, "kind": "coordinates"}, "name": "pmin"}]}
            solution_sketch: "Write the Lagrange system for $f(x,y)=x^2+xy+y^2$ on $x^2+y^2=18$: $2x+y=2\\lambda x$ and $x+2y=2\\lambda y$. A nonzero solution of this linear system requires $(2-2\\lambda)^2=1$, so $\\lambda=1/2$ or $\\lambda=3/2$. For $\\lambda=3/2$ the equations force $y=x$, giving $(3,3)$ and $(-3,-3)$ with $f=27$; for $\\lambda=1/2$ they force $y=-x$, giving $(3,-3)$ and $(-3,3)$ with $f=9$. Taking the points with positive y-coordinate, the answer is max = 27; min = 9; pmax = (3, 3); pmin = (-3, 3)."
          - problem: "The function $f(x, y) = 6x + 8y$ attains a maximum value of $60$ on the circle $x^2 + y^2 = r^2$. Use Lagrange multipliers to find $r^2$."
            answer: "36"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The Lagrange equations for $f(x,y)=6x+8y$ on $x^2+y^2=r^2$ are $6=2\\lambda x$ and $8=2\\lambda y$, so $x=3/\\lambda$ and $y=4/\\lambda$ by substitution. The constraint gives $25/\\lambda^2=r^2$, so $\\lambda=\\pm 5/r$, and the extreme values are $f=50/\\lambda=\\pm 10r$. The maximum is therefore $10r$, and $10r=60$ gives $r=6$. The answer is 36."
          - problem: "Let $f(x, y) = 7x + 24y$ on the circle $x^2 + y^2 = 625$. Use Lagrange multipliers to find the value of the multiplier $\\lambda$ at the point where $f$ attains its minimum."
            answer: "-1/2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Write the Lagrange equations for $f(x,y)=7x+24y$ on $x^2+y^2=625$: $7=2\\lambda x$ and $24=2\\lambda y$, so $x=7/(2\\lambda)$ and $y=12/\\lambda$. Substituting into the constraint gives $625/(4\\lambda^2)=625$, so $4\\lambda^2=1$ and $\\lambda=\\pm 1/2$. At the minimum the point is $(-7,-24)$, where $7=2\\lambda(-7)$ forces $\\lambda=-1/2$. The answer is -1/2."
          - problem: "Let $f(x, y) = xy$. Use Lagrange multipliers to find the maximum and minimum values of $f$ on the circle $x^2 + y^2 = 32$, and give the point in quadrant II where the minimum occurs."
            answer: "max = 16; min = -16; pmin = (-4, 4)"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "max"}, {"contract": {"kind": "exact"}, "name": "min"}, {"contract": {"arity": 2, "kind": "coordinates"}, "name": "pmin"}]}
            solution_sketch: "Set up the Lagrange system for $f(x,y)=xy$ on $x^2+y^2=32$: the equations $y=2\\lambda x$ and $x=2\\lambda y$ force $x^2=y^2$ by the substitution rule. The constraint then gives $x^2=16$, so the candidates are $(\\pm 4, \\pm 4)$. Evaluate: $f(4,4)=16$ and $f(-4,-4)=16$ are the maxima, while $f(4,-4)=-16$ and $f(-4,4)=-16$ are the minima. The quadrant II minimum point is (-4, 4), so the answer is max = 16; min = -16; pmin = (-4, 4)."
        constraints: "circle radius chosen so critical points are integer or half-integer; report BOTH max and min with locations"
    diagnostic_exemplar:
      problem: 'Use Lagrange multipliers to find the maximum value of $f(x, y) = x + 2y$ on the circle $x^2 + y^2 = 20$.'
      answer: 'Maximum $10$, at $(2, 4)$.'
      answer_contract: {kind: none}
      solution_sketch: '$\nabla f = \lambda \nabla g$ gives $1 = 2\lambda x$ and $2 = 2\lambda y$, so $y = 2x$. Substituting into $x^2 + y^2 = 20$ gives $5x^2 = 20$, $x = \pm 2$; $f(2,4) = 10$ and $f(-2,-4) = -10$.'
    anki_seeds:
      - front: 'Lagrange multiplier condition for extremizing $f$ subject to $g = c$?'
        back: '$\nabla f = \lambda \nabla g$ together with the constraint $g = c$.'
        type: basic
      - front: 'Geometric picture behind Lagrange multipliers?'
        back: 'At a constrained extremum the level curve of $f$ is tangent to the constraint curve, so the two gradients are parallel.'
        type: basic

  - id: lagrange-multipliers
    name: "Lagrange Multipliers: Harder Problems and Two Constraints"
    core: false                # harder-problem extension of the single-constraint method; terminal
    difficulty: 0.84
    drill: false
    answer_kind: numeric
    expected_time_secs: 300
    prerequisites:
      - id: lagrange-multipliers-single-constraint
        weight: 0.8
        key: true
      - id: multivariable-local-extrema
        weight: 0.5
        key: true
      - id: systems-elimination
        weight: 0.3
        key: false
    knowledge_points:
      - id: kp1
        name: "Three variables and applied problems"
        key_prerequisites: [lagrange-multipliers-single-constraint, multivariable-local-extrema]
        exemplars:
          - problem: "Maximize V = xyz subject to x + y + z = 15 with x, y, z > 0. Find the maximum value of V."
            answer: "125"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Set up Lagrange multipliers for V = xyz and the constraint x + y + z = 15. The multiplier equations yz = lambda, xz = lambda, and xy = lambda force x = y = z because all variables are positive. The constraint gives 3x = 15, so x = 5. The maximum value is V = 5*5*5 = 125."
          - problem: "Use Lagrange multipliers to find the minimum distance from the origin to the plane x + 2y + 2z = 12. Give the distance as a number."
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Minimize the squared distance f = x^2 + y^2 + z^2 subject to x + 2y + 2z = 12. The Lagrange equations 2x = lambda, 2y = 2lambda, and 2z = 2lambda give y = z = 2x. The constraint becomes x + 4x + 4x = 12, so x = 4/3, and the closest point is (4/3, 8/3, 8/3). The distance is sqrt((4/3)^2 + (8/3)^2 + (8/3)^2) = 4."
          - problem: "Minimize f = x^2 + y^2 + z^2 subject to x + y + z = 9 with x, y, z > 0. Find the minimum value of f."
            answer: "27"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Minimize f = x^2 + y^2 + z^2 subject to x + y + z = 9. The Lagrange equations 2x = lambda, 2y = lambda, and 2z = lambda give x = y = z. The constraint gives 3x = 9, so x = 3. The minimum value is 3^2 + 3^2 + 3^2 = 27."
          - problem: "Find the point on the plane x + y + z = 6 that is closest to the origin. Give the answer as (x, y, z)."
            answer: "(2, 2, 2)"
            answer_contract: {"arity": 3, "kind": "coordinates"}
            solution_sketch: "Minimize the squared distance f = x^2 + y^2 + z^2 subject to x + y + z = 6. The Lagrange equations 2x = lambda, 2y = lambda, and 2z = lambda give x = y = z. The constraint gives 3x = 6, so x = 2. The closest point is (2, 2, 2)."
          - problem: "Maximize S = xy + yz + xz subject to x + y + z = 12 with x, y, z > 0. Find the maximum value of S."
            answer: "48"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Maximize S = xy + yz + xz subject to x + y + z = 12. The Lagrange equations y + z = lambda, x + z = lambda, and x + y = lambda give x = y = z. The constraint gives 3x = 12, so x = 4. The maximum value is 16 + 16 + 16 = 48."
          - problem: "A closed rectangular box has volume 64. Use Lagrange multipliers to minimize its surface area S = 2(xy + yz + xz) subject to xyz = 64 with x, y, z > 0. Find the minimum surface area."
            answer: "96"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Minimize S = 2(xy + yz + xz) subject to xyz = 64. The Lagrange equations y + z = lambda yz, x + z = lambda xz, and x + y = lambda xy force x = y = z by ratios. The volume constraint gives x^3 = 64, so x = 4. The minimum surface area is 2(16 + 16 + 16) = 96."
        constraints: "symmetric objectives so the multiplier system solves by ratios; distances come out as integers or simple radicals"
      - id: kp2
        name: "Harder constraints and exceptional cases"
        key_prerequisites: [lagrange-multipliers-single-constraint, multivariable-local-extrema]
        exemplars:
          - problem: "Find the maximum value of $f(x,y) = xy$ on the ellipse $\\frac{x^2}{8} + \\frac{y^2}{2} = 1$. Give the exact value."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Set up Lagrange equations: $y = \\lambda \\frac{x}{4}$ and $x = \\lambda y$. Multiply the first by $x$ and the second by $y$: $xy = \\lambda \\frac{x^2}{4} = \\lambda y^2$, so $x^2 = 4y^2$. Substitute into the ellipse: $\\frac{4y^2}{8} + \\frac{y^2}{2} = y^2 = 1$, so $y = \\pm 1$ and $x = \\pm 2$. The values are $xy = \\pm 2$. The maximum value is 2."
          - problem: "Find the minimum value of $f(x,y) = x^2 y$ on the circle $x^2 + y^2 = 3$. Give the exact value."
            answer: "-2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Lagrange equations: $2xy = 2\\lambda x$ and $x^2 = 2\\lambda y$. The first gives $2x(y - \\lambda) = 0$, so either $x = 0$ or $\\lambda = y$. If $x = 0$, then $y^2 = 3$ and $f = 0$. If $\\lambda = y$, then $x^2 = 2y^2$; the circle gives $3y^2 = 3$, so $y = \\pm 1$ and $x^2 = 2$. The values are $2(\\pm 1) = \\pm 2$. The minimum value is -2."
          - problem: "Find the maximum value of $f(x,y) = x^2 y$ on the ellipse $\\frac{x^2}{4} + y^2 = 1$. Give the exact value."
            answer: "8sqrt(3)/9"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Lagrange equations: $2xy = \\lambda \\frac{x}{2}$ and $x^2 = 2\\lambda y$. The first gives $x(2y - \\lambda/2) = 0$. The branch $x = 0$ gives $y = \\pm 1$ and $f = 0$. Otherwise $\\lambda = 4y$, and the second equation gives $x^2 = 8y^2$. Substitute into the ellipse: $\\frac{8y^2}{4} + y^2 = 3y^2 = 1$, so $y = \\pm 1/\\sqrt{3}$ and $x^2 = 8/3$. The values are $x^2 y = \\pm \\frac{8}{3\\sqrt{3}} = \\pm \\frac{8\\sqrt{3}}{9}$. The maximum value is 8sqrt(3)/9."
          - problem: "Find the maximum value of $f(x,y) = x^2 y^2$ on the ellipse $\\frac{x^2}{8} + \\frac{y^2}{2} = 1$. Give the exact value."
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Lagrange equations: $2xy^2 = \\lambda \\frac{x}{4}$ and $2x^2 y = \\lambda y$. The first gives $x(2y^2 - \\lambda/4) = 0$; the second gives $y(2x^2 - \\lambda) = 0$. The branch $x = 0$ or $y = 0$ gives $f = 0$. Otherwise $\\lambda = 8y^2$ and $\\lambda = 2x^2$, so $x^2 = 4y^2$. Substitute into the ellipse: $\\frac{4y^2}{8} + \\frac{y^2}{2} = y^2 = 1$, so $y = \\pm 1$ and $x^2 = 4$. Then $f = 4 \\cdot 1 = 4$. The maximum value is 4."
          - problem: "Find the maximum value of $f(x,y) = x y^2$ on the circle $x^2 + y^2 = 4$. Give the exact value."
            answer: "16sqrt(3)/9"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Lagrange equations: $y^2 = 2\\lambda x$ and $2xy = 2\\lambda y$. The second gives $2y(x - \\lambda) = 0$, so either $y = 0$ or $\\lambda = x$. If $y = 0$, then $x^2 = 4$ and $f = 0$. If $\\lambda = x$, then $y^2 = 2x^2$; the circle gives $3x^2 = 4$, so $x = \\pm 2/\\sqrt{3}$ and $y^2 = 8/3$. The values are $x y^2 = \\pm \\frac{2}{\\sqrt{3}} \\cdot \\frac{8}{3} = \\pm \\frac{16}{3\\sqrt{3}} = \\pm \\frac{16\\sqrt{3}}{9}$. The maximum value is 16sqrt(3)/9."
          - problem: "Find the maximum value of $f(x,y) = x^2 y$ on the circle $x^2 + y^2 = 1$. Give the exact value."
            answer: "2sqrt(3)/9"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Lagrange equations: $2xy = 2\\lambda x$ and $x^2 = 2\\lambda y$. The first gives $2x(y - \\lambda) = 0$, so either $x = 0$ or $\\lambda = y$. If $x = 0$, then $y^2 = 1$ and $f = 0$. If $\\lambda = y$, then $x^2 = 2y^2$; the circle gives $3y^2 = 1$, so $y = \\pm 1/\\sqrt{3}$ and $x^2 = 2/3$. The values are $x^2 y = \\pm \\frac{2}{3\\sqrt{3}} = \\pm \\frac{2\\sqrt{3}}{9}$. The maximum value is 2sqrt(3)/9."
        constraints: "ellipse or circle constraints; the multiplier system branches (x = 0 case must be checked); answers exact with small radicals"
      - id: kp3
        name: "Two constraints"
        key_prerequisites: [lagrange-multipliers-single-constraint, multivariable-local-extrema]
        exemplars:
          - problem: "Find the maximum value of f(x, y, z) = x + y + z on the circle where the sphere x^2 + y^2 + z^2 = 4 meets the plane z = 1."
            answer: "1+sqrt(6)"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (Lagrange rule): write grad f = lambda grad g + mu grad h with g = x^2 + y^2 + z^2 and h = z. Step 2 (equations): 1 = 2 lambda x and 1 = 2 lambda y force x = y. Step 3 (constraints): z = 1 and 2x^2 + 1 = 4 give x = sqrt(6)/2 or x = -sqrt(6)/2. Step 4 (evaluate): f = 2x + 1, so the maximum occurs at x = sqrt(6)/2. The maximum value is 1+sqrt(6)."
          - problem: "Find the minimum value of x^2 + y^2 + z^2 subject to the two constraints x + y + z = 6 and x - y = 0."
            answer: "12"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (Lagrange rule): write 2x = lambda + mu, 2y = lambda - mu, 2z = lambda for the two constraints. Step 2 (symmetry): x - y = 0 gives x = y, so 2x = lambda. Step 3 (constraints): comparing 2x = lambda with 2z = lambda gives z = x, and x + y + z = 6 gives x = y = z = 2. Step 4 (evaluate): x^2 + y^2 + z^2 = 4 + 4 + 4 = 12. The minimum value is 12."
          - problem: "Find the minimum value of x^2 + y^2 + z^2 subject to x + 2y = 5 and z = 2."
            answer: "9"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (Lagrange rule): write 2x = lambda, 2y = 2 lambda, 2z = mu for the constraints x + 2y = 5 and z = 2. Step 2 (elimination): the first two equations give y = 2x. Step 3 (constraint): x + 2(2x) = 5 gives x = 1 and y = 2. Step 4 (evaluate): with z = 2, x^2 + y^2 + z^2 = 1 + 4 + 4 = 9. The minimum value is 9."
          - problem: "Find the maximum value of f(x, y, z) = x + 2y + 2z on the circle where the sphere x^2 + y^2 + z^2 = 9 meets the plane z = 1."
            answer: "2+2sqrt(10)"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (Lagrange rule): write grad f = lambda grad g + mu grad h with g = x^2 + y^2 + z^2 and h = z. Step 2 (equations): 1 = 2 lambda x and 2 = 2 lambda y give y = 2x. Step 3 (constraints): z = 1 and x^2 + 4x^2 + 1 = 9 give 5x^2 = 8, so x = 2sqrt(10)/5 and y = 4sqrt(10)/5. Step 4 (evaluate): f = 5x + 2, so the maximum is 5(2sqrt(10)/5) + 2. The maximum value is 2+2sqrt(10)."
          - problem: "Find the maximum value of f(x, y, z) = x + y + 2z on the circle where the sphere x^2 + y^2 + z^2 = 9 meets the plane z = 1."
            answer: "6"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (Lagrange rule): write grad f = lambda grad g + mu grad h with g = x^2 + y^2 + z^2 and h = z. Step 2 (equations): 1 = 2 lambda x and 1 = 2 lambda y give x = y. Step 3 (constraints): z = 1 and 2x^2 + 1 = 9 give x^2 = 4, so x = y = 2 for the maximum. Step 4 (evaluate): f = 2 + 2 + 2 = 6. The maximum value is 6."
          - problem: "Find the maximum value of xyz on the intersection of the sphere x^2 + y^2 + z^2 = 12 and the plane x + y + z = 0."
            answer: "4sqrt(2)"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (Lagrange rule): write yz = 2 lambda x + mu, xz = 2 lambda y + mu, xy = 2 lambda z + mu. Step 2 (symmetry): subtracting the first two equations shows the extremum has x = y. Step 3 (constraints): with x = y = t, the plane gives z = -2t and the sphere gives 6t^2 = 12, so t^2 = 2. Step 4 (evaluate): xyz = -2t^3, which is largest at t = -sqrt(2). The maximum value is 4sqrt(2)."
        constraints: "constraints are a plane plus a sphere/plane; the system stays linear after symmetry reductions; answers integers or single radicals"
