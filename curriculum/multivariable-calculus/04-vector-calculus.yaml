    core: false                # gentle first statement of the big theorems; feeds only the supplemental stokes-theorem / divergence-theorem topics
    difficulty: 0.85
    drill: false
    answer_kind: multi-step
    expected_time_secs: 240
    prerequisites:
      - id: computing-div-curl
        weight: 0.8
        key: true
      - id: surface-integrals
        weight: 0.6
        key: true
      - id: greens-theorem
        weight: 0.4
        key: false
    knowledge_points:
      - id: kp1
        name: "Interpreting divergence and curl"
        key_prerequisites: [computing-div-curl]
        exemplars:
          - problem: 'For $\mathbf{F} = \langle x, y \rangle$, compute $\operatorname{div}\mathbf{F}$ and interpret it.'
            answer: '$\operatorname{div}\mathbf{F} = 2 > 0$: the field is expanding — every point acts as a source.'
          - problem: 'Compute $\operatorname{curl} \mathbf{F}$ for $\mathbf{F} = \langle -y, x, 0 \rangle$ and interpret it.'
            answer: '$\langle 0, 0, 2 \rangle$: the field rotates counterclockwise about the $z$-axis, with constant angular tendency.'
          - problem: 'Compute $\operatorname{curl} \mathbf{F}$ for $\mathbf{F} = \langle yz, xz, xy \rangle$. What does the result say about $\mathbf{F}$?'
            answer: '$\mathbf{0}$; the field is irrotational, and indeed $\mathbf{F} = \nabla(xyz)$.'
            solution_sketch: 'Each component of the curl cancels, e.g. $\partial_y(xy) - \partial_z(xz) = x - x = 0$.'
        constraints: "radial vs rotational model fields; interpretation must name source/sink or axis and sense of rotation"
      - id: kp2
        name: "The divergence theorem"
        key_prerequisites: [computing-div-curl, surface-integrals]
        exemplars:
          - problem: 'Use the divergence theorem to find the outward flux of $\mathbf{F} = \langle x, y, z \rangle$ through the unit sphere.'
            answer: '$4\pi$'
            solution_sketch: '$\operatorname{div}\mathbf{F} = 3$, so the flux is $\iiint_B 3\, dV = 3 \cdot \frac{4\pi}{3} = 4\pi$.'
          - problem: 'Use the divergence theorem to find the outward flux of $\mathbf{F} = \langle x, y^2, z \rangle$ through the boundary of the unit cube $[0,1]^3$.'
            answer: "3"
            solution_sketch: '$\operatorname{div}\mathbf{F} = 1 + 2y + 1$; $\iiint (2 + 2y)\, dV = 2 + 1 = 3$.'
          - problem: 'Find the outward flux of $\mathbf{F} = \langle x, y, z \rangle$ through the sphere of radius $2$.'
            answer: '$32\pi$'
            solution_sketch: '$\operatorname{div}\mathbf{F} = 3$ times the ball volume $\frac{32\pi}{3}$.'
        constraints: "div F constant or linear; solids are balls and boxes with known volumes"
      - id: kp3
        name: "Stokes' theorem"
        key_prerequisites: [computing-div-curl, surface-integrals]
        exemplars:
          - problem: 'Use Stokes'' theorem to evaluate $\oint_C \mathbf{F} \cdot d\mathbf{r}$ for $\mathbf{F} = \langle -y, x, 0 \rangle$, where $C$ is the unit circle in the $xy$-plane (counterclockwise seen from above), taking $S$ to be the unit disk.'
            answer: '$2\pi$'
            solution_sketch: '$\operatorname{curl}\mathbf{F} = \langle 0, 0, 2 \rangle$; the flux through the disk with upward normal is $2 \cdot \pi = 2\pi$, matching the direct computation from Green''s theorem.'
          - problem: 'Use Stokes'' theorem to evaluate $\oint_C \mathbf{F} \cdot d\mathbf{r}$ for $\mathbf{F} = \langle -y, x, z^2 \rangle$ around the circle $x^2 + y^2 = 4$ in the plane $z = 0$, counterclockwise from above.'
            answer: '$8\pi$'
            solution_sketch: '$\operatorname{curl}\mathbf{F} = \langle 0, 0, 2 \rangle$; flux through the disk of radius $2$ is $2 \cdot 4\pi = 8\pi$ (the $z^2$ component does not affect the curl''s $z$-part).'
        constraints: "constant-curl fields over flat disks; orientation counterclockwise from above with upward normal"
    diagnostic_exemplar:
      problem: 'Use Stokes'' theorem to evaluate $\oint_C \mathbf{F} \cdot d\mathbf{r}$ for $\mathbf{F} = \langle -y,\; x,\; z^2 \rangle$, where $C$ is the circle $x^2 + y^2 = 9$ in the plane $z = 0$, counterclockwise seen from above.'
      answer: '$18\pi$'
      solution_sketch: '$\operatorname{curl}\mathbf{F} = \langle 0, 0, 2 \rangle$. Taking $S$ to be the disk of radius $3$ with upward normal, the flux of the curl is $2 \cdot \pi \cdot 3^2 = 18\pi$.'
    anki_seeds:
      - front: 'Divergence theorem (statement)?'
        back: 'The outward flux of $\mathbf{F}$ through a closed surface equals $\iiint_E \operatorname{div}\mathbf{F}\, dV$ over the enclosed solid.'
        type: basic
      - front: 'Stokes'' theorem (statement)?'
        back: '$\oint_{\partial S} \mathbf{F} \cdot d\mathbf{r} = \iint_S \operatorname{curl}\mathbf{F} \cdot d\mathbf{S}$, with compatible orientations.'
        type: basic
      - front: 'Which classical theorem does Green''s theorem generalize to in 3D, in each of its two forms?'
        back: 'Circulation form $\to$ Stokes'' theorem; flux form $\to$ the divergence theorem.'
        type: basic

  - id: general-flux-integrals
    name: "General Flux Integrals"
    core: false                # feeds only the supplemental Stokes/divergence theorem topics; the whole flux/theorem branch is a terminal destination nothing downstream consumes
    difficulty: 0.85
    drill: false
    answer_kind: multi-step
    expected_time_secs: 280
    prerequisites:
      - id: surface-integrals
        weight: 0.8
        key: true
      - id: parametrized-surfaces
        weight: 0.5
        key: true
      - id: double-integrals-polar
        weight: 0.4
        key: false
    knowledge_points:
      - id: kp1
        name: "Flux via F · (r_u x r_v) with non-constant integrands"
        key_prerequisites: [surface-integrals, parametrized-surfaces]
        exemplars:
          - problem: 'Find the outward flux of $\mathbf{F} = \langle xz, yz, 0 \rangle$ across the lateral surface of the cylinder $x^2 + y^2 = 1$, $0 \le z \le 2$.'
            answer: '$4\pi$'
            solution_sketch: 'With $\mathbf{r}(\theta, z) = \langle \cos\theta, \sin\theta, z \rangle$, $\mathbf{r}_\theta \times \mathbf{r}_z = \langle \cos\theta, \sin\theta, 0 \rangle$ (outward). $\mathbf{F} \cdot (\mathbf{r}_\theta \times \mathbf{r}_z) = z\cos^2\theta + z\sin^2\theta = z$ — not constant, so integrate: $\int_0^{2\pi}\int_0^2 z\, dz\, d\theta = 2\pi \cdot 2 = 4\pi$.'
          - problem: 'Find the outward flux of $\mathbf{F} = \langle 0, 0, z \rangle$ through the unit sphere.'
            answer: '$\frac{4\pi}{3}$'
            solution_sketch: 'In spherical parameters the outward normal is $\mathbf{N} = \sin\varphi\, \langle \sin\varphi\cos\theta, \sin\varphi\sin\theta, \cos\varphi \rangle$, so $\mathbf{F} \cdot \mathbf{N} = \cos\varphi \cdot \sin\varphi\cos\varphi = \sin\varphi\cos^2\varphi$. Then $\int_0^{2\pi}\int_0^\pi \sin\varphi\cos^2\varphi\, d\varphi\, d\theta = 2\pi \left[-\frac{\cos^3\varphi}{3}\right]_0^\pi = \frac{4\pi}{3}$ (equal to the volume of the ball — a fact the divergence theorem will explain).'
        constraints: "cylinders and spheres with small integer radii; F . N is a product like z, z cos^2(theta), or sin(phi) cos^2(phi) requiring one genuine iterated integral (u-substitution at worst); answers exact multiples of pi"
      - id: kp2
        name: "Flux through graphs with polar conversion"
        key_prerequisites: [surface-integrals, double-integrals-polar]
        exemplars:
          - problem: 'Find the upward flux of $\mathbf{F} = \langle x, y, 0 \rangle$ through the paraboloid $z = 4 - x^2 - y^2$, $z \ge 0$.'
            answer: '$16\pi$'
            solution_sketch: 'Upward normal $\langle -g_x, -g_y, 1 \rangle = \langle 2x, 2y, 1 \rangle$: $\mathbf{F} \cdot \mathbf{N} = 2x^2 + 2y^2 = 2r^2$. In polar over $r \le 2$: $\int_0^{2\pi}\int_0^2 2r^2 \cdot r\, dr\, d\theta = 2\pi \cdot 2 \cdot \frac{16}{4} = 16\pi$.'
          - problem: 'Find the upward flux of $\mathbf{F} = \langle y, -x, z \rangle$ through the paraboloid $z = 1 - x^2 - y^2$, $z \ge 0$.'
            answer: '$\frac{\pi}{2}$'
            solution_sketch: '$\mathbf{N} = \langle 2x, 2y, 1 \rangle$: $\mathbf{F} \cdot \mathbf{N} = 2xy - 2xy + (1 - x^2 - y^2) = 1 - r^2$. $\int_0^{2\pi}\int_0^1 (1 - r^2)\, r\, dr\, d\theta = 2\pi\left(\frac{1}{2} - \frac{1}{4}\right) = \frac{\pi}{2}$.'
        constraints: "surfaces are paraboloids z = a - x^2 - y^2 or planes over disks; F . <-g_x, -g_y, 1> reduces to a polynomial in r after polar conversion; answers exact multiples of pi or small rational multiples of pi"
      - id: kp3
        name: "Closed surfaces piece by piece"
        key_prerequisites: [surface-integrals, parametrized-surfaces]
        exemplars:
          - problem: 'Find the total outward flux of $\mathbf{F} = \langle x, y, z^2 \rangle$ through the closed cylinder $x^2 + y^2 = 1$, $0 \le z \le 1$ (lateral surface plus both caps), computing each piece separately.'
            answer: '$3\pi$'
            solution_sketch: 'Lateral: $\mathbf{F} \cdot \mathbf{n} = x^2 + y^2 = 1$, contributing the lateral area $2\pi$. Top cap ($z = 1$, $\mathbf{n} = \langle 0,0,1 \rangle$): $z^2 = 1$, contributing $\pi$. Bottom cap ($z = 0$, $\mathbf{n} = \langle 0,0,-1 \rangle$): $-z^2 = 0$. Total $2\pi + \pi + 0 = 3\pi$.'
          - problem: 'Find the total outward flux of $\mathbf{F} = \langle x^2, 0, 0 \rangle$ through the boundary of the unit cube $[0,1]^3$, face by face.'
            answer: "1"
            solution_sketch: 'Only the faces $x = 1$ and $x = 0$ see the field: at $x = 1$, $\mathbf{F} \cdot \mathbf{n} = 1$ giving $1$; at $x = 0$, $\mathbf{F} \cdot \mathbf{n} = -x^2 = 0$. The four remaining faces have $\mathbf{F} \perp \mathbf{n}$. Total $1$.'
        constraints: "closed cylinders and boxes assembled from 2-6 pieces; each piece is a flat cap, box face, or lateral surface whose contribution is a one-line integral; always state the outward normal of each piece"
    diagnostic_exemplar:
      problem: 'Find the total outward flux of $\mathbf{F} = \langle x,\; y,\; z^2 \rangle$ through the closed cylinder $x^2 + y^2 = 1$, $0 \le z \le 2$ (lateral surface plus both caps), computing each piece separately.'
      answer: '$8\pi$'
      solution_sketch: 'Lateral surface: the outward unit normal is $\langle x, y, 0 \rangle$, so $\mathbf{F}\cdot\mathbf{n} = x^2 + y^2 = 1$ and the flux is the area $4\pi$. Top cap $z = 2$: $\mathbf{F}\cdot\mathbf{n} = z^2 = 4$ over area $\pi$, giving $4\pi$. Bottom cap $z = 0$: $\mathbf{F}\cdot\mathbf{n} = -z^2 = 0$. Total $8\pi$ (matching $\iiint (2 + 2z)\,dV$).'
    anki_seeds:
      - front: 'General formula for the flux of $\mathbf{F}$ through a parametrized surface $\mathbf{r}(u, v)$ over domain $D$?'
        back: '$\iint_D \mathbf{F}(\mathbf{r}(u,v)) \cdot (\mathbf{r}_u \times \mathbf{r}_v)\, du\, dv$ — orient by the direction of $\mathbf{r}_u \times \mathbf{r}_v$.'
        type: basic
      - front: 'What happens to a flux integral $\iint_S \mathbf{F} \cdot d\mathbf{S}$ if the orientation of $S$ is reversed?'
        back: 'It changes sign.'
        type: basic
      - front: 'Outward normal direction of $\mathbf{r}(\varphi, \theta)$ on a sphere, as computed from $\mathbf{r}_\varphi \times \mathbf{r}_\theta$?'
        back: '$\sin\varphi$ times the radial unit vector — outward, with magnitude the area factor $\rho^2 \sin\varphi$ on a sphere of radius $\rho$.'
        type: basic

  - id: stokes-theorem
    name: "Stokes' Theorem"
    core: false                # terminal theorem-application topic: no course in the tree builds on Stokes' theorem (verified by grep across DE/AA/CT), so it is a destination, not machinery (PDF p. 391)
    difficulty: 0.87
    drill: false
    answer_kind: multi-step
    expected_time_secs: 300
    prerequisites:
      - id: divergence-curl
        weight: 0.6
        key: true
      - id: general-flux-integrals
        weight: 0.7
        key: true
      - id: computing-div-curl
        weight: 0.5
        key: false
      - id: vector-line-integrals
        weight: 0.4
        key: false
    knowledge_points:
      - id: kp1
        name: "Circulation via non-constant curl"
        key_prerequisites: [divergence-curl, computing-div-curl]
        exemplars:
          - problem: 'Use Stokes'' theorem to evaluate $\oint_C \mathbf{F} \cdot d\mathbf{r}$ for $\mathbf{F} = \langle -y^3, x^3, 0 \rangle$, where $C$ is the unit circle in the $xy$-plane, counterclockwise seen from above.'
            answer: '$\frac{3\pi}{2}$'
            solution_sketch: '$\operatorname{curl}\mathbf{F} = \langle 0, 0, 3x^2 + 3y^2 \rangle$ — not constant. Flux through the unit disk with upward normal, in polar: $\int_0^{2\pi}\int_0^1 3r^2 \cdot r\, dr\, d\theta = 2\pi \cdot \frac{3}{4} = \frac{3\pi}{2}$.'
          - problem: 'Use Stokes'' theorem to evaluate $\oint_C \mathbf{F} \cdot d\mathbf{r}$ for $\mathbf{F} = \langle xy, x^2, 0 \rangle$ around the boundary of the unit square $[0,1]^2$ in the $xy$-plane, counterclockwise seen from above.'
            answer: '$\frac{1}{2}$'
            solution_sketch: 'The $z$-component of the curl is $\partial_x(x^2) - \partial_y(xy) = 2x - x = x$; $\iint_{[0,1]^2} x\, dA = \frac{1}{2}$.'
        constraints: "curl F has a non-constant z-component (a polynomial like 3r^2, x, or 1 - 2y); C bounds a disk or square in the xy-plane; the double integral is a one-step polar or iterated computation"
      - id: kp2
        name: "Surface independence: choosing a convenient surface"
        key_prerequisites: [divergence-curl, general-flux-integrals]
        exemplars:
          - problem: 'Evaluate $\iint_S \operatorname{curl}\mathbf{F} \cdot d\mathbf{S}$ for $\mathbf{F} = \langle -y, x, xz \rangle$, where $S$ is the paraboloid $z = 4 - x^2 - y^2$, $z \ge 0$, with upward normal.'
            answer: '$8\pi$'
            solution_sketch: '$S$ shares its boundary (the circle $x^2 + y^2 = 4$ in $z = 0$) with the flat disk, so by Stokes'' theorem both surfaces give the same value. $\operatorname{curl}\mathbf{F} = \langle 0, -z, 2 \rangle$, which on the disk ($z = 0$) is $\langle 0, 0, 2 \rangle$: flux $= 2 \cdot 4\pi = 8\pi$.'
          - problem: 'Explain why the flux of $\operatorname{curl}\mathbf{F}$ through the upper unit hemisphere (upward normal) equals its flux through the unit disk in the $xy$-plane (upward normal), and use this to evaluate it for $\mathbf{F} = \langle -y, x, z^2 \rangle$.'
            answer: 'Both surfaces have the same positively oriented boundary (the unit circle), so Stokes'' theorem equates both fluxes to $\oint_C \mathbf{F} \cdot d\mathbf{r}$; the value is $2\pi$.'
            solution_sketch: '$\operatorname{curl}\mathbf{F} = \langle 0, 0, 2 \rangle$; through the disk the flux is $2\pi$, hence through the hemisphere too.'
        constraints: "the two surfaces share a circular boundary; the convenient replacement is a flat disk where the curl's z-component is a constant or single monomial; the inconvenient surface is a paraboloid or hemisphere"
      - id: kp3
        name: "Both sides of the theorem"
        key_prerequisites: [divergence-curl, general-flux-integrals, vector-line-integrals]
        exemplars:
          - problem: 'Verify Stokes'' theorem for $\mathbf{F} = \langle z, x, y \rangle$ on the upper unit hemisphere with upward normal: compute both $\oint_C \mathbf{F} \cdot d\mathbf{r}$ around the unit circle and $\iint_S \operatorname{curl}\mathbf{F} \cdot d\mathbf{S}$, and confirm they agree.'
            answer: 'Both sides equal $\pi$.'
            solution_sketch: 'Line side: $\mathbf{r}(t) = \langle \cos t, \sin t, 0 \rangle$ gives $\mathbf{F} \cdot \mathbf{r}'' = \cos^2 t$, integrating to $\pi$. Surface side: $\operatorname{curl}\mathbf{F} = \langle 1, 1, 1 \rangle$ and $\operatorname{curl}\mathbf{F} \cdot \mathbf{N} = \sin^2\varphi\cos\theta + \sin^2\varphi\sin\theta + \sin\varphi\cos\varphi$; the $\theta$-integrals kill the first two terms, leaving $2\pi \int_0^{\pi/2} \sin\varphi\cos\varphi\, d\varphi = \pi$.'
          - problem: 'Evaluate $\iint_S \operatorname{curl}\mathbf{F} \cdot d\mathbf{S}$ for $\mathbf{F} = \langle y^2, x, z^2 \rangle$, where $S$ is the paraboloid $z = 1 - x^2 - y^2$, $z \ge 0$, with upward normal — by integrating around the boundary instead.'
            answer: '$\pi$'
            solution_sketch: 'The boundary is the unit circle in $z = 0$, counterclockwise from above: $\mathbf{F}(\mathbf{r}(t)) \cdot \mathbf{r}''(t) = -\sin^3 t + \cos^2 t$, and $\int_0^{2\pi}(-\sin^3 t + \cos^2 t)\, dt = 0 + \pi = \pi$.'
        constraints: "verification exemplars use fields with constant curl but genuinely curved surfaces (spherical integral on one side); reversal exemplars trade a hard surface integral for a boundary integral that reduces via sin/cos power integrals over full periods"
    diagnostic_exemplar:
      problem: 'Use Stokes'' theorem to evaluate $\iint_S \operatorname{curl}\mathbf{F} \cdot d\mathbf{S}$ for $\mathbf{F} = \langle -y,\; x,\; xz \rangle$, where $S$ is the paraboloid $z = 9 - x^2 - y^2$, $z \ge 0$, with upward normal.'
      answer: '$18\pi$'
      solution_sketch: 'The boundary of $S$ is the circle $x^2 + y^2 = 9$ in $z = 0$, counterclockwise from above. There $\mathbf{F} = \langle -y, x, 0 \rangle$, and with $\mathbf{r}(t) = \langle 3\cos t, 3\sin t, 0 \rangle$ the integrand $\mathbf{F}\cdot\mathbf{r}'' = 9$, so the circulation — and hence the flux of the curl — is $18\pi$.'
    anki_seeds:
      - front: 'Why can $\iint_S \operatorname{curl}\mathbf{F} \cdot d\mathbf{S}$ be computed on a different surface $S''$?'
        back: 'If $S$ and $S''$ share the same positively oriented boundary, Stokes'' theorem equates both fluxes to $\oint_{\partial S} \mathbf{F} \cdot d\mathbf{r}$ — pick the convenient surface (usually a flat disk).'
        type: basic
      - front: 'Orientation convention in Stokes'' theorem?'
        back: 'The boundary is traversed counterclockwise when viewed from the side the normal points to (right-hand rule: thumb along $\mathbf{n}$, fingers along $C$).'
        type: basic

  - id: divergence-theorem
    name: "The Divergence Theorem"
    core: false                # terminal theorem-application topic: no course in the tree builds on the divergence theorem (verified by grep across DE/AA/CT), so it is a destination, not machinery (PDF p. 391)
    difficulty: 0.87
    drill: false
    answer_kind: multi-step
    expected_time_secs: 300
    prerequisites:
      - id: divergence-curl
        weight: 0.6
        key: true
      - id: general-flux-integrals
        weight: 0.6
        key: true
      - id: triple-integrals-cylindrical
        weight: 0.6
        key: true
      - id: cylindrical-spherical-coordinates
        weight: 0.5
        key: false
    knowledge_points:
      - id: kp1
        name: "Non-constant divergence over boxes and cylinders"
        key_prerequisites: [divergence-curl, triple-integrals-cylindrical]
        exemplars:
          - problem: 'Use the divergence theorem to find the outward flux of $\mathbf{F} = \langle x^2, y^2, z^2 \rangle$ through the boundary of the unit cube $[0,1]^3$.'
            answer: "3"
            solution_sketch: '$\operatorname{div}\mathbf{F} = 2x + 2y + 2z$; $\iiint_{[0,1]^3} (2x + 2y + 2z)\, dV = 3 \cdot 2 \cdot \frac{1}{2} = 3$.'
          - problem: 'Use the divergence theorem to find the outward flux of $\mathbf{F} = \langle x, y, z^2 \rangle$ through the closed cylinder $x^2 + y^2 \le 1$, $0 \le z \le 1$, and check it against the piece-by-piece surface computation, which gives $3\pi$.'
            answer: '$3\pi$'
            solution_sketch: '$\operatorname{div}\mathbf{F} = 2 + 2z$; slicing the cylinder, $\iiint (2 + 2z)\, dV = \pi \int_0^1 (2 + 2z)\, dz = \pi(2 + 1) = 3\pi$ — agreeing with the lateral-plus-caps computation.'
        constraints: "div F is a genuine polynomial (2x + 2y + 2z, 2 + 2z, 3z^2), never constant; solids are unit cubes, boxes, or cylinders integrated by slicing or in cylindrical coordinates"
      - id: kp2
        name: "Spherical solids"
        key_prerequisites: [divergence-curl, cylindrical-spherical-coordinates]
        exemplars:
          - problem: 'Use the divergence theorem to find the outward flux of $\mathbf{F} = \langle x^3, y^3, z^3 \rangle$ through the unit sphere.'
            answer: '$\frac{12\pi}{5}$'
            solution_sketch: '$\operatorname{div}\mathbf{F} = 3(x^2 + y^2 + z^2) = 3\rho^2$; in spherical coordinates $\iiint 3\rho^2 \cdot \rho^2 \sin\varphi\, d\rho\, d\varphi\, d\theta = 4\pi \cdot 3 \cdot \frac{1}{5} = \frac{12\pi}{5}$.'
          - problem: 'Use the divergence theorem to find the outward flux of $\mathbf{F} = \langle xy^2, yz^2, zx^2 \rangle$ through the unit sphere.'
            answer: '$\frac{4\pi}{5}$'
            solution_sketch: '$\operatorname{div}\mathbf{F} = y^2 + z^2 + x^2 = \rho^2$; $\iiint_B \rho^2\, dV = \int_0^{2\pi}\int_0^\pi\int_0^1 \rho^4 \sin\varphi\, d\rho\, d\varphi\, d\theta = 2\pi \cdot 2 \cdot \frac{1}{5} = \frac{4\pi}{5}$.'
        constraints: "div F reduces to a function of rho^2 alone; balls centered at the origin with radius 1 or 2; the triple integral is a product of one-variable integrals in spherical coordinates"
      - id: kp3
        name: "Strategic uses: closing surfaces and divergence-free fields"
        key_prerequisites: [divergence-curl, general-flux-integrals]
        exemplars:
          - problem: 'Find the upward flux of $\mathbf{F} = \langle y, -x, z \rangle$ through the paraboloid $z = 1 - x^2 - y^2$, $z \ge 0$, by closing the surface with the unit disk in the plane $z = 0$ and applying the divergence theorem.'
            answer: '$\frac{\pi}{2}$'
            solution_sketch: '$\operatorname{div}\mathbf{F} = 1$, so the outward flux through the closed surface equals the enclosed volume $\int_0^{2\pi}\int_0^1 (1 - r^2)\, r\, dr\, d\theta = \frac{\pi}{2}$. On the bottom disk the outward normal is $\langle 0, 0, -1 \rangle$ and $\mathbf{F} \cdot \mathbf{n} = -z = 0$, so the paraboloid carries all of it: $\frac{\pi}{2}$ — matching the direct parametrized computation.'
          - problem: 'What is the outward flux of $\mathbf{F} = \langle y, z, x \rangle$ through the sphere of radius $3$? Justify without computing any surface integral.'
            answer: "0"
            solution_sketch: '$\operatorname{div}\mathbf{F} = 0 + 0 + 0 = 0$, so by the divergence theorem the flux through any closed surface is $\iiint 0\, dV = 0$.'
        constraints: "closing exemplars use paraboloids or hemispheres capped by a flat disk on which F . n is 0 or constant; divergence-free exemplars require citing the theorem, not integrating; answers small rational multiples of pi or 0"
    diagnostic_exemplar:
      problem: 'Find the upward flux of $\mathbf{F} = \langle y,\; -x,\; z \rangle$ through the paraboloid $z = 4 - x^2 - y^2$, $z \ge 0$, by closing the surface with the disk $x^2 + y^2 \le 4$ in the plane $z = 0$ and applying the divergence theorem.'
      answer: '$8\pi$'
      solution_sketch: '$\operatorname{div}\mathbf{F} = 1$, so the total outward flux through the closed surface equals the volume $\int_0^{2\pi}\!\int_0^2 (4 - r^2)\,r\,dr\,d\theta = 8\pi$. On the bottom disk the outward normal is $\langle 0,0,-1\rangle$ and $\mathbf{F}\cdot\mathbf{n} = -z = 0$, so the whole $8\pi$ passes upward through the paraboloid.'
    anki_seeds:
      - front: 'If $\operatorname{div}\mathbf{F} = 0$ everywhere, what is the outward flux of $\mathbf{F}$ through any closed surface?'
        back: '$0$ — by the divergence theorem the flux equals $\iiint \operatorname{div}\mathbf{F}\, dV = 0$.'
        type: basic
      - front: 'Strategy for computing the flux of $\mathbf{F}$ through a surface $S$ that is NOT closed, using the divergence theorem?'
        back: 'Close $S$ with a simple cap (usually a flat disk), apply the theorem to the enclosed solid, then subtract the cap''s flux.'
        type: basic
      - front: 'The divergence theorem applies to surfaces that are ___ and oriented ___.'
        back: 'Closed (bounding a solid region); oriented by the outward normal.'
        type: basic
