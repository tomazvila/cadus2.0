unit: vector-calculus
course: multivariable-calculus
module: "Vector Calculus"
topics:
  - id: vector-fields
    name: "Vector Fields"
    core: true
    difficulty: 0.72
    drill: false
    answer_kind: numeric
    expected_time_secs: 120
    prerequisites:
      - id: vectors-in-rn
        weight: 0.6
        key: true
      - id: functions-several-variables
        weight: 0.6
        key: true
      - id: gradient-directional-derivatives
        weight: 0.4
        key: false
    knowledge_points:
      - id: kp1
        name: "Evaluating and recognizing fields"
        key_prerequisites: [vectors-in-rn, functions-several-variables]
        exemplars:
          - problem: "Let F(x,y) = (-y, x). Compute F(2, 1), and state whether the field turns about the origin or points away from it. Give the vector as (a, b) and the verdict."
            answer: "verdict = rotational; v = (-1, 2)"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["radial"], ["rotational"]]}, "name": "verdict"}, {"contract": {"arity": 2, "kind": "coordinates"}, "name": "v"}]}
            solution_sketch: "Step 1: evaluate the field componentwise at (2, 1), giving F(2, 1) = (-1, 2). Step 2: test the direction by the dot product with the position vector (2, 1): (-1)(2) + (2)(1) = 0, so the vector is perpendicular to the position vector and the field turns about the origin. The option radial is wrong because a radial vector would be parallel to the position vector. The key is verdict = rotational; v = (-1, 2)."
          - problem: "Let F(x,y) = (x, y). Find the magnitude of F(3, 4), and state whether the field points away from the origin or turns about it. Give the magnitude and the verdict."
            answer: "verdict = radial; mag = 5"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["radial"], ["rotational"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "mag"}]}
            solution_sketch: "Step 1: evaluate F(3, 4) = (3, 4). Step 2: compute the magnitude by the distance formula: sqrt(3^2 + 4^2) = 5. The vector is a positive multiple of (3, 4), so it points along the position vector. The option rotational is wrong because a rotational vector would be perpendicular to the position vector. The key is verdict = radial; mag = 5."
          - problem: "Let F(x,y) = (2x, 2y). Find F(1, -2). Give the answer as (a, b)."
            answer: "(2, -4)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "Step 1: substitute x = 1 and y = -2 into F(x, y) = (2x, 2y). Step 2: compute each component: 2(1) = 2 and 2(-2) = -4. The answer is (2, -4)."
          - problem: "Let F(x,y) = (-3y, 3x). Find F(1, 2). Give the answer as (a, b)."
            answer: "(-6, 3)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "Step 1: substitute x = 1 and y = 2 into F(x, y) = (-3y, 3x). Step 2: compute each component: -3(2) = -6 and 3(1) = 3. The answer is (-6, 3)."
          - problem: "Let F(x,y) = (x + y, x - y). Find F(2, 3). Give the answer as (a, b)."
            answer: "(5, -1)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "Step 1: substitute x = 2 and y = 3 into F(x, y) = (x + y, x - y). Step 2: compute the first component 2 + 3 = 5 and the second component 2 - 3 = -1. The answer is (5, -1)."
          - problem: "Let F(x,y) = (x^2 - y, x y). Find F(2, -1). Give the answer as (a, b)."
            answer: "(5, -2)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "Step 1: substitute x = 2 and y = -1 into F(x, y) = (x^2 - y, x y). Step 2: compute the first component 2^2 - (-1) = 5 and the second component (2)(-1) = -2. The answer is (5, -2)."
        constraints: "fields built from x, y with integer coefficients; evaluation at small integer points; identify radial vs rotational"
      - id: kp2
        name: "Gradient fields"
        key_prerequisites: [functions-several-variables, gradient-directional-derivatives]
        exemplars:
          - problem: 'Find the gradient field of $f(x, y) = x^2 y - y^3$.'
            answer: '$\nabla f = \langle 2xy, x^2 - 3y^2 \rangle$'
            solution_sketch: '$\nabla f=\langle 2xy, x^2-3y^2\rangle$.'
            answer_contract: {kind: none}
          - problem: 'Find a function $f$ whose gradient field is $\mathbf{F} = \langle 2x, 2y \rangle$.'
            answer: '$f(x, y) = x^2 + y^2$ (plus any constant)'
            answer_contract: {kind: none}
            solution_sketch: 'Antidifferentiate: $f_x = 2x \Rightarrow f = x^2 + g(y)$; then $g''(y) = 2y$.'
        constraints: "potentials are polynomials of degree at most 3"
    diagnostic_exemplar:
      problem: 'Find the gradient field of $f(x, y) = x^3 y - y^2$ and evaluate it at $(1, 2)$.'
      answer: '$\nabla f = \langle 3x^2 y,\; x^3 - 2y \rangle$; $\nabla f(1, 2) = \langle 6, -3 \rangle$.'
      answer_contract: {kind: none}
      solution_sketch: 'Differentiate in each variable: $f_x = 3x^2y$, $f_y = x^3 - 2y$; at $(1,2)$ these are $6$ and $1 - 4 = -3$.'
    anki_seeds:
      - front: 'What is a vector field on $\mathbb{R}^2$?'
        back: 'A function assigning a vector $\mathbf{F}(x, y)$ to each point $(x, y)$.'
        type: basic
      - front: 'What is the gradient field of a scalar function $f$?'
        back: 'The vector field $\nabla f = \langle f_x, f_y \rangle$; fields of this form are called conservative.'
        type: basic

  - id: scalar-line-integrals
    name: "Scalar Line Integrals"
    core: true
    difficulty: 0.74
    drill: false
    answer_kind: numeric
    expected_time_secs: 180
    prerequisites:
      - id: arc-length-space-curves
        weight: 0.7
        key: true
      - id: definite-integrals-ftc
        weight: 0.4
        key: false
      - id: trigonometric-integrals
        weight: 0.4
        key: false
    knowledge_points:
      - id: kp1
        name: "Line integrals along segments"
        key_prerequisites: [arc-length-space-curves]
        exemplars:
          - problem: 'Evaluate $\int_C x \, ds$ where $C$ is the segment from $(0, 0)$ to $(3, 4)$.'
            answer: '$\frac{15}{2}$'
            solution_sketch: 'Parametrize $\mathbf{r}(t) = \langle 3t, 4t \rangle$, $0 \le t \le 1$; $ds = 5\, dt$, so $\int_0^1 3t \cdot 5\, dt = \frac{15}{2}$.'
          - problem: 'Evaluate $\int_C (x + y)\, ds$ where $C$ is the segment from $(0, 0)$ to $(3, 4)$.'
            answer: '$\frac{35}{2}$'
            solution_sketch: 'With $\mathbf{r}(t) = \langle 3t, 4t \rangle$, $ds = 5\,dt$: $\int_0^1 7t \cdot 5\, dt = \frac{35}{2}$.'
          - problem: "Evaluate $\\int_C (x + 2y)\\, ds$, where $C$ is the straight segment from $(0, 0)$ to $(5, 12)$."
            answer: "377/2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Parametrize the segment $C$ as $\\mathbf{r}(t) = \\langle 5t, 12t \\rangle$ for $0 \\le t \\le 1$, so the speed is $|\\mathbf{r}'(t)| = \\sqrt{25 + 144} = 13$ and $ds = 13\\, dt$ by the arc-length rule. Substitute the parametrization into the integrand: $x + 2y = 5t + 24t = 29t$. The power rule gives $\\int_0^1 29t \\cdot 13\\, dt = 377 \\cdot \\frac{1}{2} = \\frac{377}{2}$. The value of the line integral is 377/2."
          - problem: "Evaluate $\\int_C (3x - y)\\, ds$, where $C$ is the straight segment from $(2, 3)$ to $(5, 7)$."
            answer: "55/2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Parametrize $C$ as $\\mathbf{r}(t) = \\langle 2 + 3t, 3 + 4t \\rangle$ for $0 \\le t \\le 1$; the speed is $|\\mathbf{r}'(t)| = \\sqrt{9 + 16} = 5$, so $ds = 5\\, dt$ by the arc-length rule. Along $C$, substitution gives $3x - y = 3(2 + 3t) - (3 + 4t) = 3 + 5t$. The power rule then gives $\\int_0^1 (3 + 5t) \\cdot 5\\, dt = 15 + \\frac{25}{2} = \\frac{55}{2}$. The value of the line integral is 55/2."
          - problem: "A curve $C$ runs straight from $(6, 8)$ to $(0, 0)$. Evaluate $\\int_C (3x + y)\\, ds$."
            answer: "130"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Parametrize $C$ as $\\mathbf{r}(t) = \\langle 6 - 6t, 8 - 8t \\rangle$ for $0 \\le t \\le 1$; the speed is $|\\mathbf{r}'(t)| = \\sqrt{36 + 64} = 10$, so $ds = 10\\, dt$ by the arc-length rule. A scalar line integral does not change when the direction of travel is reversed. Along $C$, substitution gives $3x + y = 3(6 - 6t) + (8 - 8t) = 26 - 26t$. The power rule gives $\\int_0^1 (26 - 26t) \\cdot 10\\, dt = 260 - 130 = 130$. The value of the line integral is 130."
          - problem: "Evaluate $\\int_C xy\\, ds$, where $C$ is the straight segment from $(0, 1)$ to $(6, 9)$."
            answer: "190"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Parametrize $C$ as $\\mathbf{r}(t) = \\langle 6t, 1 + 8t \\rangle$ for $0 \\le t \\le 1$; the speed is $|\\mathbf{r}'(t)| = \\sqrt{36 + 64} = 10$, so $ds = 10\\, dt$ by the arc-length rule. Along $C$, distributive expansion gives $xy = 6t(1 + 8t) = 6t + 48t^2$. The power rule then gives $\\int_0^1 (6t + 48t^2) \\cdot 10\\, dt = 30 + 160 = 190$. The value of the line integral is 190."
        constraints: "segments with Pythagorean-triple directions so ds = |r'| dt is a constant integer"
      - id: kp2
        name: "Line integrals along circles and curves"
        key_prerequisites: [arc-length-space-curves, trigonometric-integrals]
        exemplars:
          - problem: 'Evaluate $\int_C (x^2 + y^2)\, ds$ where $C$ is the unit circle.'
            answer: '$2\pi$'
            solution_sketch: 'On the unit circle $x^2 + y^2 = 1$, so the integral is the arc length $2\pi$.'
          - problem: 'Evaluate $\int_C x^2 \, ds$ where $C$ is the circle of radius $2$ centered at the origin.'
            answer: '$8\pi$'
            solution_sketch: '$\mathbf{r}(t) = \langle 2\cos t, 2\sin t \rangle$, $ds = 2\,dt$: $\int_0^{2\pi} 4\cos^2 t \cdot 2\, dt = 8 \cdot \pi$.'
          - problem: "Evaluate the line integral of f(x,y) = x^2 with respect to arc length along C, where C is the circle of radius 3 centered at the origin."
            answer: "27pi"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The integral is the scalar line integral of x^2 ds over C, the circle of radius 3. Parameterize C by r(t) = (3 cos t, 3 sin t) for 0 <= t <= 2pi, using the circle parameterization rule. The speed rule gives |r'(t)| = 3, so ds = 3 dt, and x^2 = 9 cos^2 t. Substitute into the integral: int_0^(2pi) 27 cos^2 t dt. The half-angle identity shows the full-period average of cos^2 t is 1/2, so the integral is 27 pi. The value is 27pi."
          - problem: "Evaluate the line integral of f(x,y) = y^2 with respect to arc length along C, where C is the circle of radius 4 centered at the origin."
            answer: "64pi"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The integral is the scalar line integral of y^2 ds over C, the circle of radius 4. Parameterize C by r(t) = (4 cos t, 4 sin t), and the speed rule gives ds = 4 dt. Then y^2 = 16 sin^2 t, so the integral becomes int_0^(2pi) 64 sin^2 t dt. The full-period average of sin^2 t is 1/2, so the value is 64 pi. The value is 64pi."
          - problem: "Evaluate the line integral of f(x,y) = x^2 - y^2 with respect to arc length along C, where C is the circle of radius 2 centered at the origin."
            answer: "0"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The integral is the scalar line integral of (x^2 - y^2) ds over the circle of radius 2. Parameterize C by r(t) = (2 cos t, 2 sin t) with ds = 2 dt. Then x^2 - y^2 = 4(cos^2 t - sin^2 t) = 4 cos(2t). Substitute and integrate: int_0^(2pi) 8 cos(2t) dt = 0, because a full period of cos(2t) has zero signed area. The value is 0."
          - problem: "Evaluate the line integral of f(x,y) = x^2 y^2 with respect to arc length along C, where C is the unit circle."
            answer: "pi/4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The integral is the scalar line integral of x^2 y^2 ds over the unit circle. Parameterize C by r(t) = (cos t, sin t) with ds = dt. Then x^2 y^2 = cos^2 t sin^2 t, and the product-to-sum identity gives cos^2 t sin^2 t = (1/8)(1 - cos(4t)). Integrate over a full period: (1/8)(2pi) = pi/4. The value is pi/4."
        constraints: "circles centered at the origin with small integer radii; use cos^2 integrals over full periods"
      - id: kp3
        name: "Mass of a wire and 3D curves"
        key_prerequisites: [arc-length-space-curves]
        exemplars:
          - problem: 'A wire follows the upper unit semicircle and has density $\rho(x, y) = y$. Find its mass.'
            answer: "2"
            solution_sketch: '$\mathbf{r}(t) = \langle \cos t, \sin t \rangle$, $t \in [0, \pi]$, $ds = dt$: $m = \int_0^\pi \sin t\, dt = 2$.'
          - problem: 'Evaluate $\int_C z \, ds$ where $C$ is the helix $\mathbf{r}(t) = \langle \cos t, \sin t, t \rangle$, $0 \le t \le 2\pi$.'
            answer: '$2\sqrt{2}\,\pi^2$'
            solution_sketch: '$|\mathbf{r}''(t)| = \sqrt{2}$: $\int_0^{2\pi} t \sqrt{2}\, dt = \sqrt{2} \cdot 2\pi^2$.'
          - problem: "A wire follows the quarter unit circle in the first quadrant and has density rho(x,y) = y. Find its mass."
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Parameterize C by r(t) = <cos(t), sin(t)> for 0 <= t <= pi/2. The arc length rule gives ds = |r'(t)| dt = 1 dt. The scalar line integral formula gives mass = integral from 0 to pi/2 of y ds = integral from 0 to pi/2 of sin(t) dt. The FTC evaluates this as -cos(t) from 0 to pi/2 = 1. The mass is 1."
          - problem: "A wire follows the helix r(t) = <2cos(t), 2sin(t), 5t> for 0 <= t <= pi/3 and has density rho(x,y,z) = z. Find its mass."
            answer: "5sqrt(29)pi^2/18"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Parameterize C by r(t) = <2cos(t), 2sin(t), 5t> for 0 <= t <= pi/3. The arc length rule gives speed |r'(t)| = sqrt(4 + 25) = sqrt(29), so ds = sqrt(29) dt. The scalar line integral formula gives mass = integral from 0 to pi/3 of z ds = integral from 0 to pi/3 of 5t sqrt(29) dt. Factor the constants and use the FTC: 5sqrt(29) times t^2/2 from 0 to pi/3 = 5sqrt(29) pi^2/18. The mass is 5sqrt(29)pi^2/18."
          - problem: "A wire follows the helix r(t) = <2cos(t), 2sin(t), 2t> for 0 <= t <= pi and has density rho(x,y,z) = y. Find its mass."
            answer: "8sqrt(2)"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Parameterize C by r(t) = <2cos(t), 2sin(t), 2t> for 0 <= t <= pi. The arc length rule gives speed |r'(t)| = sqrt(4 + 4) = 2sqrt(2), so ds = 2sqrt(2) dt. The scalar line integral formula gives mass = integral from 0 to pi of y ds = integral from 0 to pi of 2sin(t) 2sqrt(2) dt. The FTC gives 4sqrt(2) times -cos(t) from 0 to pi = 4sqrt(2) times 2 = 8sqrt(2). The mass is 8sqrt(2)."
          - problem: "A wire follows the helix r(t) = <4cos(t), 4sin(t), 3t> for 0 <= t <= pi/2 and has density rho(x,y,z) = x. Find its mass."
            answer: "20"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Parameterize C by r(t) = <4cos(t), 4sin(t), 3t> for 0 <= t <= pi/2. The arc length rule gives speed |r'(t)| = sqrt(16 + 9) = 5, so ds = 5 dt. The scalar line integral formula gives mass = integral from 0 to pi/2 of x ds = integral from 0 to pi/2 of 4cos(t) 5 dt. The FTC evaluates 20 sin(t) from 0 to pi/2 = 20. The mass is 20."
        constraints: "curves with constant speed (circles, helices); densities linear in one coordinate; answers exact"
    diagnostic_exemplar:
      problem: 'A wire follows the helix $\mathbf{r}(t) = \langle 3\cos t,\; 3\sin t,\; 4t \rangle$ for $0 \le t \le \pi$ and has density $\rho(x, y, z) = z$. Find its mass.'
      answer: '$10\pi^2$'
      solution_sketch: '$|\mathbf{r}''| = \sqrt{9\sin^2 t + 9\cos^2 t + 16} = 5$, so $m = \int_0^{\pi} (4t)(5)\,dt = 20\cdot\frac{\pi^2}{2} = 10\pi^2$.'
    anki_seeds:
      - front: 'In a scalar line integral $\int_C f\, ds$, the element $ds$ equals...'
        back: '$|\mathbf{r}''(t)|\, dt$'
        type: basic
      - front: 'Physical interpretation of $\int_C \rho\, ds$ for a wire $C$ with density $\rho$?'
        back: 'The mass of the wire.'
        type: basic

  - id: vector-line-integrals
    name: "Line Integrals of Vector Fields"
    core: true
    difficulty: 0.77
    drill: false
    answer_kind: numeric
    expected_time_secs: 200
    prerequisites:
      - id: scalar-line-integrals
        weight: 0.7
        key: true
      - id: vector-fields
        weight: 0.7
        key: true
      - id: dot-product
        weight: 0.4
        key: false
    knowledge_points:
      - id: kp1
        name: "Computing F · dr along parametrized curves"
        key_prerequisites: [scalar-line-integrals, vector-fields, dot-product]
        exemplars:
          - problem: 'Evaluate $\int_C \mathbf{F} \cdot d\mathbf{r}$ for $\mathbf{F} = \langle y, x \rangle$ along $\mathbf{r}(t) = \langle t, t^2 \rangle$, $0 \le t \le 1$.'
            answer: "1"
            solution_sketch: '$\mathbf{F}(\mathbf{r}(t)) \cdot \mathbf{r}''(t) = t^2 \cdot 1 + t \cdot 2t = 3t^2$; $\int_0^1 3t^2\, dt = 1$.'
          - problem: 'Evaluate $\int_C \mathbf{F} \cdot d\mathbf{r}$ for $\mathbf{F} = \langle y, z, x \rangle$ along $\mathbf{r}(t) = \langle t, t, t \rangle$, $0 \le t \le 1$.'
            answer: '$\frac{3}{2}$'
            solution_sketch: '$\mathbf{F}(\mathbf{r}(t)) = \langle t, t, t \rangle$, $\mathbf{r}''(t) = \langle 1, 1, 1 \rangle$; integrand $3t$, integral $\frac{3}{2}$.'
          - problem: "Let F = <2x, 3y> and let r(t) = <2t, t> for 0 <= t <= 1. Evaluate the line integral of F dot dr along this curve."
            answer: "11/2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Parametrize by r(t) = <2t, t> and find r'(t) = <2, 1> using the component derivative rule. Substitute to get F(r(t)) = <4t, 3t>, then apply the dot product rule: F(r(t)) dot r'(t) = 8t + 3t = 11t. Integrate with the power rule: the integral from 0 to 1 of 11t dt is 11/2, so the answer is 11/2."
          - problem: "Let F = <x, y^2> and let r(t) = <t, 3t^2> for 0 <= t <= 1. Evaluate the line integral of F dot dr along this curve."
            answer: "19/2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Parametrize by r(t) = <t, 3t^2> and find r'(t) = <1, 6t> by the component derivative rule. Substitute to get F(r(t)) = <t, 9t^4>, so the dot product rule gives F(r(t)) dot r'(t) = t + 54t^5. Integrate with the power rule: 1/2 + 9 = 19/2, so the answer is 19/2."
          - problem: "Let F = <y + z, x + z, x + y> and let r(t) = <t, 2t, 3t> for 0 <= t <= 1. Evaluate the line integral of F dot dr along this curve."
            answer: "11"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Parametrize by r(t) = <t, 2t, 3t> and find r'(t) = <1, 2, 3> with the component derivative rule. Substitute into F to get F(r(t)) = <5t, 4t, 3t>, then the dot product rule gives F(r(t)) dot r'(t) = 5t + 8t + 9t = 22t. Integrate with the power rule: the integral from 0 to 1 of 22t dt is 11, so the answer is 11."
          - problem: "Let F = <y, x^2> and let r(t) = <2t^2, t> for 0 <= t <= 1. Evaluate the line integral of F dot dr along this curve."
            answer: "32/15"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Parametrize by r(t) = <2t^2, t> and find r'(t) = <4t, 1> using the component derivative rule. Substitute to get F(r(t)) = <t, 4t^4>, then the dot product rule gives F(r(t)) dot r'(t) = 4t^2 + 4t^4. Integrate with the power rule: 4/3 + 4/5 = 32/15, so the answer is 32/15."
        constraints: "curves are lines or parabolas; F polynomial; integrands reduce to single-variable polynomials"
      - id: kp2
        name: "Circulation around closed curves"
        key_prerequisites: [scalar-line-integrals, vector-fields, dot-product]
        exemplars:
          - problem: 'Evaluate $\oint_C \mathbf{F} \cdot d\mathbf{r}$ for $\mathbf{F} = \langle y, -x \rangle$ around the unit circle traversed counterclockwise.'
            answer: '$-2\pi$'
            solution_sketch: 'With $\mathbf{r} = \langle \cos t, \sin t \rangle$: $\mathbf{F}\cdot\mathbf{r}'' = \sin t(-\sin t) + (-\cos t)(\cos t) = -1$; integrate over $[0, 2\pi]$.'
          - problem: 'Evaluate $\oint_C \mathbf{F} \cdot d\mathbf{r}$ for $\mathbf{F} = \langle -y, x \rangle$ around the circle of radius $2$, counterclockwise.'
            answer: '$8\pi$'
            solution_sketch: '$\mathbf{r} = \langle 2\cos t, 2\sin t \rangle$: $\mathbf{F}\cdot\mathbf{r}'' = 4\sin^2 t + 4\cos^2 t = 4$; $\int_0^{2\pi} 4\, dt = 8\pi$.'
          - problem: "Evaluate the circulation of $\\mathbf{F} = \\langle 2y, -2x \\rangle$ around the unit circle centered at the origin, traversed counterclockwise."
            answer: "-4pi"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The circulation is $\\oint_C \\mathbf{F}\\cdot d\\mathbf{r}$ with $\\mathbf{F}=\\langle 2y,-2x\\rangle$ on the unit circle. Parameterize the circle by $\\mathbf{r}(t) = \\langle \\cos t, \\sin t \\rangle$ for $0 \\le t \\le 2\\pi$, so $\\mathbf{F}=\\langle 2\\sin t,-2\\cos t\\rangle$ and $\\mathbf{r}'(t)=\\langle -\\sin t,\\cos t\\rangle$. The dot product is $-2\\sin^2 t -2\\cos^2 t = -2(\\sin^2 t+\\cos^2 t)=-2$ by the Pythagorean identity. Integrate the constant over $[0,2\\pi]$: $-2(2\\pi)=-4\\pi$. The circulation is -4pi."
          - problem: "Evaluate $\\oint_C \\mathbf{F} \\cdot d\\mathbf{r}$ for $\\mathbf{F} = \\langle -y, 2x \\rangle$ around the circle of radius $2$ centered at the origin, counterclockwise."
            answer: "12pi"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The line integral is $\\oint_C \\mathbf{F}\\cdot d\\mathbf{r}$ with $\\mathbf{F}=\\langle -y,2x\\rangle$. Parameterize the radius-2 circle by $\\mathbf{r}(t)=\\langle 2\\cos t,2\\sin t\\rangle$, $0 \\le t \\le 2\\pi$. Then $\\mathbf{F}=\\langle -2\\sin t,4\\cos t\\rangle$ and $\\mathbf{r}'(t)=\\langle -2\\sin t,2\\cos t\\rangle$. The dot product is $4\\sin^2 t + 8\\cos^2 t = 4(\\sin^2 t+\\cos^2 t) + 4\\cos^2 t = 4 + 4\\cos^2 t$. Integrate termwise: $\\int_0^{2\\pi} 4\\,dt = 8\\pi$ and $\\int_0^{2\\pi} 4\\cos^2 t\\,dt = 4\\pi$. The sum is $12\\pi$, so the circulation is 12pi."
          - problem: "Evaluate the line integral $\\oint_C \\mathbf{F} \\cdot d\\mathbf{r}$ for $\\mathbf{F} = \\langle y, 3x \\rangle$ around the unit circle centered at the origin, traversed counterclockwise."
            answer: "2pi"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The line integral is $\\oint_C \\mathbf{F}\\cdot d\\mathbf{r}$ with $\\mathbf{F}=\\langle y,3x\\rangle$. Parameterize the unit circle by $\\mathbf{r}(t)=\\langle \\cos t,\\sin t\\rangle$, $0 \\le t \\le 2\\pi$. On $C$, $\\mathbf{F}=\\langle \\sin t,3\\cos t\\rangle$ and $\\mathbf{r}'(t)=\\langle -\\sin t,\\cos t\\rangle$. The dot product is $-\\sin^2 t + 3\\cos^2 t = -1 + 4\\cos^2 t$ by the identity $\\sin^2 t+\\cos^2 t=1$. Integrate: $\\int_0^{2\\pi} -1\\,dt = -2\\pi$ and $\\int_0^{2\\pi} 4\\cos^2 t\\,dt = 4\\pi$. The total is $2\\pi$, so the line integral is 2pi."
          - problem: "Evaluate $\\oint_C \\mathbf{F} \\cdot d\\mathbf{r}$ for $\\mathbf{F} = \\langle 2y, -x \\rangle$ around the circle of radius $3$ centered at the origin, traversed counterclockwise."
            answer: "-27pi"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The line integral is $\\oint_C \\mathbf{F}\\cdot d\\mathbf{r}$ with $\\mathbf{F}=\\langle 2y,-x\\rangle$. Parameterize the radius-3 circle by $\\mathbf{r}(t)=\\langle 3\\cos t,3\\sin t\\rangle$, $0 \\le t \\le 2\\pi$. Then $\\mathbf{F}=\\langle 6\\sin t,-3\\cos t\\rangle$ and $\\mathbf{r}'(t)=\\langle -3\\sin t,3\\cos t\\rangle$. The dot product is $-18\\sin^2 t - 9\\cos^2 t = -9(\\sin^2 t+\\cos^2 t) - 9\\sin^2 t = -9 - 9\\sin^2 t$. Integrate: $\\int_0^{2\\pi} -9\\,dt = -18\\pi$ and $\\int_0^{2\\pi} -9\\sin^2 t\\,dt = -9\\pi$. The total is $-27\\pi$, so the circulation is -27pi."
        constraints: "circles centered at the origin; the integrand collapses via sin^2 + cos^2 = 1"
      - id: kp3
        name: "Work and orientation"
        key_prerequisites: [scalar-line-integrals, vector-fields, dot-product]
        exemplars:
          - problem: 'Find the work done by $\mathbf{F} = \langle y, x \rangle$ on a particle moving along the segment from $(0, 0)$ to $(2, 3)$.'
            answer: "6"
            solution_sketch: '$\mathbf{r}(t) = \langle 2t, 3t \rangle$: $\mathbf{F}\cdot\mathbf{r}'' = 3t \cdot 2 + 2t \cdot 3 = 12t$; $\int_0^1 12t\, dt = 6$.'
          - problem: 'If $\int_C \mathbf{F} \cdot d\mathbf{r} = 7$, what is the integral along the same curve traversed in the opposite direction?'
            answer: '$-7$'
            solution_sketch: 'Reversing orientation reverses $d\mathbf{r}$, so a vector line integral changes sign.'
          - problem: "Find the work done by F = <2x, y> on a particle moving along the segment from (1, 0) to (3, 4)."
            answer: "16"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Parametrize the segment: r(t) = <1+2t, 4t> for 0 <= t <= 1, so r'(t) = <2, 4>. The field on the path is F(r(t)) = <2+4t, 4t>, so the dot product is (2+4t)2 + (4t)4 = 4 + 24t. Integrate from 0 to 1: 4 + 12 = 16, so the work is 16."
          - problem: "The work done by F along a curve C from A to B is -5. Find the work done by F along the same curve traversed from B to A."
            answer: "5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "For a vector line integral, reversing the orientation changes dr to -dr, so the sign of the work reverses. The original work is -5, so the reversed work is -(-5) = 5."
          - problem: "Find the work done by F = <-y, x> along the quarter circle from (1, 0) to (0, 1) traversed counterclockwise."
            answer: "pi/2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Parametrize the quarter circle counterclockwise as r(t) = <cos t, sin t> for 0 <= t <= pi/2, so r'(t) = <-sin t, cos t>. The field is F = <-y, x> = <-sin t, cos t>; the dot product is sin^2 t + cos^2 t = 1. Integrate from 0 to pi/2: the work is pi/2."
          - problem: "Find the work done by F = <z, x, y> along the straight segment from (0, 0, 0) to (1, 2, 3)."
            answer: "11/2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Parametrize the segment as r(t) = <t, 2t, 3t> for 0 <= t <= 1, so r'(t) = <1, 2, 3>. The field on the path is F = <3t, t, 2t>; the dot product with r' is 3t + 2t + 6t = 11t. Integrate: 11/2, so the work is 11/2."
        constraints: "work = line integral of F; always state orientation; sign-flip questions use given integer values"
    diagnostic_exemplar:
      problem: 'Evaluate $\oint_C \mathbf{F} \cdot d\mathbf{r}$ for $\mathbf{F} = \langle y, -x \rangle$ around the circle of radius $3$ centred at the origin, traversed counterclockwise.'
      answer: '$-18\pi$'
      solution_sketch: 'With $\mathbf{r}(t) = \langle 3\cos t, 3\sin t \rangle$: $\mathbf{F} = \langle 3\sin t, -3\cos t \rangle$ and $\mathbf{r}''(t) = \langle -3\sin t, 3\cos t \rangle$, so $\mathbf{F}\cdot\mathbf{r}'' = -9$ and the integral is $-9(2\pi) = -18\pi$.'
    anki_seeds:
      - front: 'How do you evaluate $\int_C \mathbf{F} \cdot d\mathbf{r}$ with a parametrization $\mathbf{r}(t)$, $a \le t \le b$?'
        back: '$\int_a^b \mathbf{F}(\mathbf{r}(t)) \cdot \mathbf{r}''(t)\, dt$'
        type: basic
      - front: 'What happens to $\int_C \mathbf{F} \cdot d\mathbf{r}$ when the orientation of $C$ is reversed?'
        back: 'It changes sign. (Scalar integrals $\int_C f\, ds$ do not.)'
        type: basic

  - id: line-integrals
    name: "Line Integrals: Differential Forms and Piecewise Paths"
    core: true
    difficulty: 0.78
    drill: false
    answer_kind: numeric
    expected_time_secs: 240
    prerequisites:
      - id: vector-line-integrals
        weight: 0.8
        key: true
      - id: scalar-line-integrals
        weight: 0.5
        key: true
      - id: arc-length-space-curves
        weight: 0.3
        key: false
    knowledge_points:
      - id: kp1
        name: "Differential-form line integrals"
        key_prerequisites: [vector-line-integrals, scalar-line-integrals]
        exemplars:
          - problem: 'Evaluate $\int_C y^2\, dx + x\, dy$ where $C$ is the segment from $(0,0)$ to $(1,1)$.'
            answer: '$\frac{5}{6}$'
            solution_sketch: 'Parametrize $x = t$, $y = t$: $\int_0^1 (t^2 + t)\, dt = \frac{1}{3} + \frac{1}{2} = \frac{5}{6}$.'
          - problem: 'Evaluate $\int_C y\, dx + x\, dy$ along $\mathbf{r}(t) = \langle t, t^2 \rangle$, $0 \le t \le 1$.'
            answer: "1"
            solution_sketch: '$dx = dt$, $dy = 2t\, dt$: $\int_0^1 (t^2 + 2t^2)\, dt = 1$. (Same as $\mathbf{F} = \langle y, x \rangle$ in vector form.)'
          - problem: "The curve C is the segment from (0,0) to (2,1). Evaluate ∫_C (2x+y) dx + x dy."
            answer: "6"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The line integral is ∫_C (2x+y) dx + x dy on the segment from (0,0) to (2,1). Step 1, use the segment parametrization: x=2t and y=t for 0 ≤ t ≤ 1, so dx=2 dt and dy=dt. Step 2, substitute into the differential form: 2x+y = 5t and x=2t, giving (5t)(2 dt)+(2t)(dt)=12t dt. Step 3, evaluate the t-integral: ∫_0^1 12t dt = 6t^2 from 0 to 1 = 6. The value of the line integral is 6."
          - problem: "The curve C is the parabola y=x^2 from (0,0) to (1,1). Evaluate ∫_C -y dx + x dy."
            answer: "1/3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The line integral is ∫_C -y dx + x dy along the parabola y=x^2 from (0,0) to (1,1). Step 1, use the parabola parametrization: x=t and y=t^2 for 0 ≤ t ≤ 1, so dx=dt and dy=2t dt. Step 2, substitute: -y dx + x dy = -t^2 dt + t(2t dt) = t^2 dt. Step 3, integrate: ∫_0^1 t^2 dt = 1/3. The value of the line integral is 1/3."
          - problem: "The curve C is the segment from (0,0) to (1,2). Evaluate ∫_C (2x-y) dx + (x+y) dy."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The line integral is ∫_C (2x-y) dx + (x+y) dy on the segment from (0,0) to (1,2). Step 1, parametrize the segment: x=t and y=2t for 0 ≤ t ≤ 1, so dx=dt and dy=2 dt. Step 2, substitute: 2x-y=0 and x+y=3t, so the form becomes 0 dt + (3t)(2 dt) = 6t dt. Step 3, integrate: ∫_0^1 6t dt = 3t^2 from 0 to 1 = 3. The value of the line integral is 3."
          - problem: "The curve C is the parabola y=x^2 from (0,0) to (2,4). Evaluate ∫_C (3x+y) dx + (2x+y) dy."
            answer: "82/3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The line integral is ∫_C (3x+y) dx + (2x+y) dy along the parabola y=x^2 from (0,0) to (2,4). Step 1, use x=t and y=t^2 for 0 ≤ t ≤ 2, so dx=dt and dy=2t dt. Step 2, substitute: 3x+y=3t+t^2 and 2x+y=2t+t^2, giving (3t+t^2) dt + (2t+t^2)(2t dt) = (3t+5t^2+2t^3) dt. Step 3, integrate term by term: ∫_0^2 (3t+5t^2+2t^3) dt = 6 + 40/3 + 8 = 82/3. The value of the line integral is 82/3."
        constraints: "P dx + Q dy with polynomial P, Q; curves are segments or parabolas"
      - id: kp2
        name: "Piecewise paths and path dependence"
        key_prerequisites: [vector-line-integrals]
        exemplars:
          - problem: "Let C be the path (0,0) to (1,0) to (1,1). Evaluate the line integral along C of y^2 dx + x dy. The straight segment from (0,0) to (1,1) gives 5/6 for the same integrand. Find the value along C and the path behavior, written as verdict = depends or fixed; I = value."
            answer: "verdict = depends; I = 1"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["depends"], ["fixed"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "I"}]}
            solution_sketch: "The integral is y^2 dx + x dy along the path (0,0) to (1,0) to (1,1). Step 1: on (0,0) to (1,0), y = 0 and dy = 0, so the contribution is 0. Step 2: on (1,0) to (1,1), dx = 0 and x = 1, so the contribution is the integral from 0 to 1 of 1 dy = 1. Step 3: the straight-segment value is 5/6, which differs from 1, so the path behavior is depends. So verdict = depends; I = 1."
          - problem: 'Evaluate $\oint_C x\, dy - y\, dx$ counterclockwise around the triangle $(0,0)$, $(1,0)$, $(0,1)$.'
            answer: "1"
            solution_sketch: 'The legs along the axes contribute $0$; on the hypotenuse $x = 1-t$, $y = t$: $\int_0^1 \left((1-t) + t\right) dt = 1$. (This equals twice the enclosed area.)'
          - problem: "Let C be the path (0,0) to (2,0) to (2,1) to (3,3). Evaluate the line integral along C of (x+y) dx + (x-y) dy. Give the answer as an integer."
            answer: "9"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The integral is (x+y) dx + (x-y) dy along (0,0) to (2,0) to (2,1) to (3,3). Step 1: on (0,0) to (2,0), y=0 and dy=0, so the integral of x dx from 0 to 2 is 2. Step 2: on (2,0) to (2,1), x=2 and dx=0, so the integral of (2-y) dy from 0 to 1 is 3/2. Step 3: on (2,1) to (3,3), use x=2+t and y=1+2t, so the integral of (5+t) dt from 0 to 1 is 11/2. The sum is 2 + 3/2 + 11/2 = 9."
          - problem: "Let C be the path (0,0) to (0,2) to (3,2) to (4,0). Evaluate the line integral along C of (x+y) dx + (x-y) dy. Give the answer as an integer."
            answer: "8"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The integral is (x+y) dx + (x-y) dy along (0,0) to (0,2) to (3,2) to (4,0). Step 1: on (0,0) to (0,2), x=0 and dx=0, so the integral of -y dy from 0 to 2 is -2. Step 2: on (0,2) to (3,2), y=2 and dy=0, so the integral of (x+2) dx from 0 to 3 is 21/2. Step 3: on (3,2) to (4,0), use x=3+t and y=2-2t, so the integral of (3-7t) dt from 0 to 1 is -1/2. The sum is -2 + 21/2 - 1/2 = 8."
          - problem: "Let C be the path (0,0) to (1,0) to (1,1) to (2,2). Evaluate the line integral along C of y dx + x dy. Give the answer as an integer."
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The integral is y dx + x dy along (0,0) to (1,0) to (1,1) to (2,2). Step 1: on (0,0) to (1,0), y=0 and dy=0, so the contribution is 0. Step 2: on (1,0) to (1,1), x=1 and dx=0, so the integral of 1 dy from 0 to 1 is 1. Step 3: on (1,1) to (2,2), y=x and dy=dx, so the integral of 2x dx from 1 to 2 is 3. The sum is 0+1+3=4."
          - problem: "Let C be the path (0,0) to (1,0) to (1,2) to (3,4). Evaluate the line integral along C of 2x dx + y dy. Give the answer as an integer."
            answer: "17"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The integral is 2x dx + y dy along (0,0) to (1,0) to (1,2) to (3,4). Step 1: on (0,0) to (1,0), y=0 and dy=0, so the integral of 2x dx from 0 to 1 is 1. Step 2: on (1,0) to (1,2), x=1 and dx=0, so the integral of y dy from 0 to 2 is 2. Step 3: on (1,2) to (3,4), use x=1+2t and y=2+2t, so the integral of (8+12t) dt from 0 to 1 is 14. The sum is 1+2+14=17."
        constraints: "paths of 2-3 segments parallel to axes plus one slanted edge; each piece contributes a one-line integral"
      - id: kp3
        name: "Three-dimensional and closed-curve capstones"
        key_prerequisites: [vector-line-integrals, scalar-line-integrals]
        exemplars:
          - problem: 'Evaluate $\int_C \mathbf{F} \cdot d\mathbf{r}$ for $\mathbf{F} = \langle y, x, z \rangle$ along $\mathbf{r}(t) = \langle t, t, t^2 \rangle$, $0 \le t \le 1$.'
            answer: '$\frac{3}{2}$'
            solution_sketch: '$\mathbf{F}(\mathbf{r}(t)) \cdot \mathbf{r}''(t) = t + t + t^2 \cdot 2t = 2t + 2t^3$; $\int_0^1 (2t + 2t^3)\, dt = 1 + \frac{1}{2}$.'
          - problem: 'Evaluate $\oint_C x^2\, dy$ counterclockwise around the unit square $[0,1]^2$.'
            answer: "1"
            solution_sketch: 'Only the vertical edges contribute: right edge ($x = 1$, $dy > 0$) gives $1$; left edge ($x = 0$) gives $0$; horizontal edges have $dy = 0$.'
        constraints: "3D curves polynomial in t; closed squares/triangles traversed counterclockwise; answers small rationals"
    diagnostic_exemplar:
      problem: 'Evaluate $\oint_C x^2\,dy - y\,dx$ counterclockwise around the triangle with vertices $(0,0)$, $(1,0)$, $(0,1)$.'
      answer: '$\dfrac{5}{6}$'
      answer_contract: {kind: none}
      solution_sketch: 'On $(0,0) \to (1,0)$: $y = 0$, $dy = 0$, contribution $0$. On $(1,0) \to (0,1)$, with $x = 1-t$, $y = t$: the integrand is $\left[(1-t)^2 + t\right]dt$, giving $\tfrac{1}{3} + \tfrac{1}{2} = \tfrac{5}{6}$. On $(0,1) \to (0,0)$: $x = 0$, $dx = 0$, contribution $0$.'
    anki_seeds:
      - front: 'How does $\int_C P\, dx + Q\, dy$ relate to a vector line integral?'
        back: 'It equals $\int_C \mathbf{F} \cdot d\mathbf{r}$ for $\mathbf{F} = \langle P, Q \rangle$.'
        type: basic
      - front: 'Does the value of $\int_C \mathbf{F} \cdot d\mathbf{r}$ depend only on the endpoints of $C$?'
        back: 'In general no — only for conservative fields is the integral path-independent.'
        type: basic

  - id: conservative-fields-potential-functions
    name: "Conservative Fields and Potential Functions"
    core: true
    difficulty: 0.80
    drill: false
    answer_kind: numeric
    expected_time_secs: 240
    prerequisites:
      - id: line-integrals
        weight: 0.8
        key: true
      - id: gradient-directional-derivatives
        weight: 0.6
        key: true
    knowledge_points:
      - id: kp1
        name: "Testing for conservativity"
        key_prerequisites: [line-integrals, gradient-directional-derivatives]
        exemplars:
          - problem: 'Is $\mathbf{F} = \langle 2xy, x^2 \rangle$ conservative on $\mathbb{R}^2$?'
            answer: 'Yes: $\frac{\partial}{\partial y}(2xy) = 2x = \frac{\partial}{\partial x}(x^2)$.'
            solution_sketch: '$P_y=2x$ and $Q_x=2x$, so the field is conservative on $\mathbb{R}^2$.'
            answer_contract: {kind: none}
          - problem: 'Is $\mathbf{F} = \langle y, -x \rangle$ conservative?'
            answer: 'No: $P_y = 1 \ne -1 = Q_x$.'
            solution_sketch: '$P_y=1$ and $Q_x=-1$ differ, so the field is not conservative.'
            answer_contract: {kind: none}
          - problem: 'Is $\mathbf{F} = \langle y^2 + 2x, 2xy + 3 \rangle$ conservative on $\mathbb{R}^2$?'
            answer: 'Yes: $P_y = 2y = Q_x$.'
            solution_sketch: '$P_y=2y$ and $Q_x=2y$, so the field is conservative on $\mathbb{R}^2$.'
            answer_contract: {kind: none}
        constraints: "fields polynomial on all of R^2 (simply connected, so P_y = Q_x is decisive)"
      - id: kp2
        name: "Finding potential functions"
        key_prerequisites: [line-integrals, gradient-directional-derivatives]
        exemplars:
          - problem: 'Find a potential function for $\mathbf{F} = \langle 2xy, x^2 \rangle$.'
            answer: '$f(x, y) = x^2 y$ (plus any constant)'
            answer_contract: {kind: none}
            solution_sketch: '$f_x = 2xy \Rightarrow f = x^2 y + g(y)$; then $f_y = x^2 + g''(y) = x^2$ forces $g'' = 0$.'
          - problem: 'Find a potential function for $\mathbf{F} = \langle e^y, x e^y \rangle$.'
            answer: '$f(x, y) = x e^y$'
            solution_sketch: 'Integrating $f_x=e^y$ gives $f=xe^y+g(y)$; then $f_y=xe^y+g''(y)=xe^y$, so $g$ is constant.'
            answer_contract: {kind: none}
          - problem: 'Find a potential function for $\mathbf{F} = \langle 2x + y, x + 2y \rangle$.'
            answer: '$f(x, y) = x^2 + xy + y^2$'
            answer_contract: {kind: none}
            solution_sketch: 'Integrate $f_x = 2x + y$ in $x$: $f = x^2 + xy + g(y)$; match $f_y = x + g''(y) = x + 2y$.'
        constraints: "potentials are polynomials or x e^y-type products; verify by re-differentiating"
      - id: kp3
        name: "Harder potentials"
        key_prerequisites: [line-integrals, gradient-directional-derivatives]
        exemplars:
          - problem: 'Find a potential function for $\mathbf{F} = \langle 2xy + y^3, x^2 + 3xy^2 \rangle$.'
            answer: '$f(x, y) = x^2 y + x y^3$'
            answer_contract: {kind: none}
            solution_sketch: 'Check $P_y = 2x + 3y^2 = Q_x$; integrate $f_x$: $f = x^2 y + x y^3 + g(y)$; matching $f_y$ forces $g'' = 0$.'
          - problem: 'Find a potential function for $\mathbf{F} = \langle 3x^2 + 2xy, x^2 + 2y \rangle$.'
            answer: '$f(x, y) = x^3 + x^2 y + y^2$'
            answer_contract: {kind: none}
            solution_sketch: '$f = x^3 + x^2 y + g(y)$ from $f_x$; then $g''(y) = 2y$.'
        constraints: "every mixed term appears in BOTH components; degree at most 4; always verify with the component test first"
    diagnostic_exemplar:
      problem: 'Show that $\mathbf{F} = \langle 3x^2 + 2xy^3,\; 3x^2y^2 + 4y \rangle$ is conservative and find a potential function.'
      answer: '$P_y = 6xy^2 = Q_x$, so $\mathbf{F}$ is conservative; $f(x, y) = x^3 + x^2y^3 + 2y^2$ (plus any constant).'
      answer_contract: {kind: none}
      solution_sketch: 'Integrating $P$ in $x$: $f = x^3 + x^2y^3 + g(y)$. Then $f_y = 3x^2y^2 + g''(y) = 3x^2y^2 + 4y$ forces $g''(y) = 4y$, so $g(y) = 2y^2$.'
    anki_seeds:
      - front: 'Component test for a conservative field $\mathbf{F} = \langle P, Q \rangle$ on a simply connected domain?'
        back: '$\dfrac{\partial P}{\partial y} = \dfrac{\partial Q}{\partial x}$'
        type: basic
      - front: 'What does it mean for $\mathbf{F}$ to be conservative?'
        back: '$\mathbf{F} = \nabla f$ for some potential function $f$.'
        type: basic

  - id: fundamental-theorem-line-integrals
    name: "The Fundamental Theorem for Line Integrals"
    core: false                # stated theorem; feeds only conservative-fields-3d
    difficulty: 0.81
    drill: false
    answer_kind: numeric
    expected_time_secs: 180
    prerequisites:
      - id: conservative-fields-potential-functions
        weight: 0.8
        key: true
      - id: vector-line-integrals
        weight: 0.4
        key: false
    knowledge_points:
      - id: kp1
        name: "Applying the theorem"
        key_prerequisites: [conservative-fields-potential-functions, vector-line-integrals]
        exemplars:
          - problem: 'Evaluate $\int_C \nabla f \cdot d\mathbf{r}$ for $f(x, y) = x^2 y$ along any curve from $(1, 1)$ to $(2, 3)$.'
            answer: "11"
            solution_sketch: '$f(2, 3) - f(1, 1) = 12 - 1 = 11$, independent of the path.'
          - problem: 'Evaluate $\int_C \mathbf{F} \cdot d\mathbf{r}$ for the conservative field $\mathbf{F} = \langle 2xy, x^2 \rangle$ along any path from $(0, 0)$ to $(1, 2)$.'
            answer: "2"
            solution_sketch: 'Potential $f = x^2 y$: $f(1, 2) - f(0, 0) = 2$.'
          - problem: 'What is $\oint_C \mathbf{F} \cdot d\mathbf{r}$ for a conservative field $\mathbf{F}$ around any closed curve?'
            answer: "0"
            solution_sketch: 'Endpoints coincide, so $f(\text{end}) - f(\text{start}) = 0$.'
          - problem: "Let f(x, y) = x^2 + 2y^2. Evaluate the line integral of grad f along any path from (1, 1) to (2, 2)."
            answer: "9"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: The vector field is grad f, so the fundamental theorem for line integrals applies. Step 2: The theorem gives the integral as f(end) minus f(start). Step 3: f(2, 2) = 4 + 8 = 12 and f(1, 1) = 1 + 2 = 3. Step 4: Subtract endpoint values: 12 - 3 = 9. The value of the line integral is 9."
          - problem: "Let f(x, y) = xy + y^2. Find the value of the line integral of grad f from (1, 2) to (3, 1)."
            answer: "-2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: Because the integrand is grad f, the fundamental theorem for line integrals replaces the integral with endpoint values. Step 2: f(3, 1) = 3*1 + 1^2 = 4 and f(1, 2) = 1*2 + 2^2 = 6. Step 3: Subtract: 4 - 6 = -2. The value of the line integral is -2."
          - problem: "Let f(x, y, z) = x^2 + y^2 + z^2. Compute the line integral of grad f along any curve from (1, 0, 2) to (2, 1, 1)."
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: The vector field is grad f, so the fundamental theorem for line integrals applies. Step 2: The integral equals f(2, 1, 1) - f(1, 0, 2). Step 3: f(2, 1, 1) = 4 + 1 + 1 = 6 and f(1, 0, 2) = 1 + 0 + 4 = 5. Step 4: 6 - 5 = 1. The value of the line integral is 1."
        constraints: "endpoints at small integer points; potential values exact integers"
      - id: kp2
        name: "Find the potential, then evaluate"
        key_prerequisites: [conservative-fields-potential-functions, vector-line-integrals]
        exemplars:
          - problem: 'Evaluate $\int_C \mathbf{F} \cdot d\mathbf{r}$ for $\mathbf{F} = \langle 2x + y, x \rangle$ along any path from $(0, 0)$ to $(2, 3)$.'
            answer: "10"
            solution_sketch: 'Potential $f = x^2 + xy$: $f(2, 3) - f(0, 0) = 4 + 6 = 10$.'
          - problem: 'Evaluate $\int_C \mathbf{F} \cdot d\mathbf{r}$ for $\mathbf{F} = \langle e^y, x e^y \rangle$ along any path from $(1, 0)$ to $(2, \ln 2)$.'
            answer: "3"
            solution_sketch: 'Potential $f = x e^y$: $f(2, \ln 2) - f(1, 0) = 4 - 1 = 3$.'
          - problem: "Let F = <3x^2 + 2y, 2x>. Find the value of the line integral of F along any path from (0, 0) to (2, 1)."
            answer: "12"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The field is F = <3x^2 + 2y, 2x> and the path runs from (0, 0) to (2, 1). Step 1 (potential function): integrate the first component 3x^2 + 2y with respect to x to get f = x^3 + 2xy plus a function of y; the second component 2x confirms f = x^3 + 2xy. Step 2 (fundamental theorem for line integrals): the integral equals f(2, 1) - f(0, 0) = (8 + 4) - 0 = 12. The value of the line integral is 12."
          - problem: "Let F = <2x + 3y^2, 6xy>. Evaluate the line integral of F along any path from (1, 1) to (2, 3)."
            answer: "54"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The field is F = <2x + 3y^2, 6xy> with endpoints (1, 1) and (2, 3). Step 1 (potential function): integrate 2x + 3y^2 with respect to x to get f = x^2 + 3xy^2 plus a function of y; the second component 6xy confirms f = x^2 + 3xy^2. Step 2 (fundamental theorem for line integrals): the integral equals f(2, 3) - f(1, 1) = (4 + 54) - (1 + 3) = 58 - 4 = 54. The value of the line integral is 54."
          - problem: "Let F = <y cos(xy), x cos(xy)>. Evaluate the line integral of F along any path from (0, 0) to (pi/2, 1)."
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The field is F = <y cos(xy), x cos(xy)> and the path runs from (0, 0) to (pi/2, 1). Step 1 (potential function): integrate y cos(xy) with respect to x to get f = sin(xy) plus a function of y; the second component x cos(xy) confirms f = sin(xy). Step 2 (fundamental theorem for line integrals): the integral equals f(pi/2, 1) - f(0, 0) = sin(pi/2) - sin(0) = 1 - 0 = 1. The value of the line integral is 1."
          - problem: "Let F = <2xy^3, 3x^2 y^2>. Determine the value of the line integral of F along any path from (1, 1) to (2, 2)."
            answer: "31"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The field is F = <2xy^3, 3x^2 y^2> with endpoints (1, 1) and (2, 2). Step 1 (potential function): integrate 2xy^3 with respect to x to get f = x^2 y^3 plus a function of y; the second component 3x^2 y^2 confirms f = x^2 y^3. Step 2 (fundamental theorem for line integrals): the integral equals f(2, 2) - f(1, 1) = 32 - 1 = 31. The value of the line integral is 31."
        constraints: "field given without its potential; endpoints chosen so f evaluates to integers"
    diagnostic_exemplar:
      problem: 'Evaluate $\int_C \mathbf{F} \cdot d\mathbf{r}$ for $\mathbf{F} = \langle 2xy,\; x^2 + 3y^2 \rangle$ along any path from $(0, 0)$ to $(2, 1)$.'
      answer: '$5$'
      solution_sketch: '$P_y = 2x = Q_x$, so $\mathbf{F}$ is conservative with potential $f(x,y) = x^2 y + y^3$. By the fundamental theorem the integral is $f(2,1) - f(0,0) = 5 - 0 = 5$.'
    anki_seeds:
      - front: 'Fundamental theorem for line integrals?'
        back: '$\int_C \nabla f \cdot d\mathbf{r} = f(\mathbf{r}(b)) - f(\mathbf{r}(a))$ — path-independent, zero on closed curves.'
        type: basic
      - front: 'Equivalent conditions for a continuous field $\mathbf{F}$ on an open connected domain?'
        back: '$\mathbf{F}$ conservative $\iff$ line integrals are path-independent $\iff$ $\oint_C \mathbf{F}\cdot d\mathbf{r} = 0$ for every closed curve.'
        type: basic

  - id: computing-div-curl
    name: "Computing Divergence and Curl"
    core: true
    difficulty: 0.78
    drill: false
    answer_kind: expression
    expected_time_secs: 150
    prerequisites:
      - id: vector-fields
        weight: 0.7
        key: true
      - id: cross-product
        weight: 0.6
        key: true
      - id: partial-derivatives
        weight: 0.5
        key: false
    knowledge_points:
      - id: kp1
        name: "Divergence"
        key_prerequisites: [vector-fields, partial-derivatives]
        exemplars:
          - problem: 'Compute $\operatorname{div} \mathbf{F}$ for $\mathbf{F} = \langle x^2, xy, z^2 \rangle$.'
            answer: '$3x + 2z$'
            solution_sketch: '$\nabla \cdot \mathbf{F} = \frac{\partial}{\partial x}(x^2) + \frac{\partial}{\partial y}(xy) + \frac{\partial}{\partial z}(z^2) = 2x + x + 2z$.'
          - problem: 'Compute $\operatorname{div} \mathbf{F}$ for $\mathbf{F} = \langle xy, yz, zx \rangle$.'
            answer: '$x + y + z$'
        constraints: "polynomial fields in three variables, degree at most 2 per component"
      - id: kp2
        name: "Curl"
        key_prerequisites: [vector-fields, cross-product]
        exemplars:
          - problem: 'Compute $\operatorname{curl} \mathbf{F}$ for $\mathbf{F} = \langle y, z, x \rangle$.'
            answer: '$\langle -1, -1, -1 \rangle$'
            answer_contract: {kind: none}
            solution_sketch: '$\nabla \times \mathbf{F} = \langle \partial_y x - \partial_z z,\; \partial_z y - \partial_x x,\; \partial_x z - \partial_y y \rangle = \langle -1, -1, -1 \rangle$.'
          - problem: 'Compute $\operatorname{curl} \mathbf{F}$ for $\mathbf{F} = \langle xy, yz, xz \rangle$.'
            answer: '$\langle -y, -z, -x \rangle$'
            answer_contract: {kind: none}
            solution_sketch: 'First component: $\partial_y(xz) - \partial_z(yz) = -y$; the others follow the same cyclic pattern.'
        constraints: "components are monomials in x, y, z; compute via the symbolic determinant with i, j, k"
      - id: kp3
        name: "The identities curl grad = 0 and div curl = 0"
        key_prerequisites: [vector-fields, cross-product, partial-derivatives]
        exemplars:
          - problem: 'Verify the identity $\operatorname{curl}(\nabla f) = \mathbf{0}$ for $f = x^2 y + z$: compute $\nabla f$, then $\operatorname{curl}(\nabla f)$, and state the vector you get.'
            answer: "0"
            solution_sketch: '$\nabla f = \langle 2xy,\; x^2,\; 1 \rangle$, and its curl is $\langle 0 - 0,\; 0 - 0,\; 2x - 2x \rangle = \mathbf{0}$ — the zero vector, as $\operatorname{curl}(\nabla f) = \mathbf{0}$ guarantees.'
          - problem: 'For $\mathbf{F} = \langle xy, yz, xz \rangle$, compute $\operatorname{div}(\operatorname{curl} \mathbf{F})$.'
            answer: "0"
            solution_sketch: '$\operatorname{curl}\mathbf{F} = \langle -y, -z, -x \rangle$, whose divergence is $0 + 0 + 0 = 0$ — as the identity $\nabla \cdot (\nabla \times \mathbf{F}) = 0$ guarantees.'
        constraints: "verifications on concrete low-degree fields; state which identity the computation illustrates"
    diagnostic_exemplar:
      problem: 'For $\mathbf{F} = \langle x^2, y^2, z^2 \rangle$, confirm that $\operatorname{curl} \mathbf{F} = \mathbf{0}$ and then state $\operatorname{div} \mathbf{F}$.'
      answer: '$2x + 2y + 2z$'
      solution_sketch: 'Each component depends only on its own variable, so all mixed partials in the curl vanish; the divergence is $2x + 2y + 2z$.'
    anki_seeds:
      - front: 'Formulas: $\operatorname{div}\mathbf{F}$ and $\operatorname{curl}\mathbf{F}$ in terms of $\nabla$?'
        back: '$\operatorname{div}\mathbf{F} = \nabla \cdot \mathbf{F}$ (a scalar); $\operatorname{curl}\mathbf{F} = \nabla \times \mathbf{F}$ (a vector).'
        type: basic
      - front: 'What is $\operatorname{curl}(\nabla f)$ for any twice continuously differentiable $f$?'
        back: '$\mathbf{0}$ — gradient fields are irrotational.'
        type: basic
      - front: 'What is $\operatorname{div}(\operatorname{curl} \mathbf{F})$ for any twice continuously differentiable $\mathbf{F}$?'
        back: '$0$ — curl fields are divergence-free.'
        type: basic

  - id: conservative-fields-3d
    name: "Conservative Fields in Three Dimensions"
    core: false                # vector-calculus capstone; terminal
    difficulty: 0.83
    drill: false
    answer_kind: numeric
    expected_time_secs: 240
    prerequisites:
      - id: conservative-fields-potential-functions
        weight: 0.7
        key: true
      - id: computing-div-curl
        weight: 0.7
        key: true
      - id: fundamental-theorem-line-integrals
        weight: 0.4
        key: false
    knowledge_points:
      - id: kp1
        name: "The curl test"
        key_prerequisites: [conservative-fields-potential-functions, computing-div-curl]
        exemplars:
          - problem: "Let F = <2xy + z, x^2 + 3z, x + 3y>. Let c be the value of the nonzero component of curl F, or 0 if curl F is the zero vector. Find c."
            answer: "0"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Write F = <2xy + z, x^2 + 3z, x + 3y> and compute curl F = <R_y - Q_z, P_z - R_x, Q_x - P_y>. Here R_y = 3 and Q_z = 3, P_z = 1 and R_x = 1, Q_x = 2x and P_y = 2x, so every component is zero. By the curl test on all of R^3, a vanishing curl means F is conservative, so the nonzero component value is c = 0. The final answer is 0."
          - problem: "Let F = <3y, 5x, 0>. Let c be the value of the nonzero component of curl F, or 0 if curl F is the zero vector. Compute c."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Write F = <3y, 5x, 0> and compute curl F = <R_y - Q_z, P_z - R_x, Q_x - P_y>. Here R_y = 0 and Q_z = 0, P_z = 0 and R_x = 0, Q_x = 5 and P_y = 3, so curl F = <0, 0, 2>. The constant nonzero z-component is 2, so c = 2. The final answer is 2."
          - problem: "Let F = <0, 7z, 4y>. Let c be the value of the nonzero component of curl F, or 0 if curl F is the zero vector. Determine c."
            answer: "-3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Write F = <0, 7z, 4y> and compute curl F = <R_y - Q_z, P_z - R_x, Q_x - P_y>. Here R_y = 4 and Q_z = 7, P_z = 0 and R_x = 0, Q_x = 0 and P_y = 0, so curl F = <-3, 0, 0>. The only nonzero component is -3, so c = -3. The final answer is -3."
          - problem: "Let F = <2y, 3x, 0>. Let c be the value of the nonzero component of curl F, or 0 if curl F is the zero vector. Evaluate c."
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Write F = <2y, 3x, 0> and compute curl F = <R_y - Q_z, P_z - R_x, Q_x - P_y>. Here R_y = 0 and Q_z = 0, P_z = 0 and R_x = 0, Q_x = 3 and P_y = 2, so curl F = <0, 0, 1>. The constant nonzero z-component is 1, so c = 1. The final answer is 1."
          - problem: "Let F = <0, 6z, 5y>. Let c be the value of the nonzero component of curl F, or 0 if curl F is the zero vector. Give c."
            answer: "-1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Write F = <0, 6z, 5y> and compute curl F = <R_y - Q_z, P_z - R_x, Q_x - P_y>. Here R_y = 5 and Q_z = 6, P_z = 0 and R_x = 0, Q_x = 0 and P_y = 0, so curl F = <-1, 0, 0>. The only nonzero component is -1, so c = -1. The final answer is -1."
          - problem: "Let F = <y + z, x + z, x + y>. Let c be the value of the nonzero component of curl F, or 0 if curl F is the zero vector. State c."
            answer: "0"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Write F = <y + z, x + z, x + y> and compute curl F = <R_y - Q_z, P_z - R_x, Q_x - P_y>. Here R_y = 1 and Q_z = 1, P_z = 1 and R_x = 1, Q_x = 1 and P_y = 1, so every component is zero. By the curl test on all of R^3, a vanishing curl means F is conservative, so c = 0. The final answer is 0."
        constraints: "polynomial fields on all of R^3; the curl either vanishes identically or has a constant nonzero component"
      - id: kp2
        name: "Finding 3D potential functions"
        key_prerequisites: [conservative-fields-potential-functions, computing-div-curl]
        exemplars:
          - problem: 'Find a potential function for $\mathbf{F} = \langle yz, xz, xy \rangle$.'
            answer: '$f(x, y, z) = xyz$'
            answer_contract: {kind: none}
            solution_sketch: '$f = xyz + g(y,z)$ from $f_x = yz$; matching $f_y = xz$ and $f_z = xy$ forces $g$ constant.'
          - problem: 'Find a potential function for $\mathbf{F} = \langle y + z, x + z, x + y \rangle$.'
            answer: '$f(x, y, z) = xy + yz + zx$'
            answer_contract: {kind: none}
            solution_sketch: 'Integrate $f_x = y + z$: $f = xy + xz + g(y,z)$; then $f_y = x + g_y = x + z$ gives $g = yz$, and $f_z$ checks out.'
        constraints: "potentials are sums of degree-2 or -3 monomials; successive integration in x, then y, then z"
      - id: kp3
        name: "Path-independent integrals in space"
        key_prerequisites: [conservative-fields-potential-functions, computing-div-curl, fundamental-theorem-line-integrals]
        exemplars:
          - problem: 'Evaluate $\int_C \mathbf{F} \cdot d\mathbf{r}$ for $\mathbf{F} = \langle yz, xz, xy \rangle$ along any path from $(1, 1, 1)$ to $(2, 3, 1)$.'
            answer: "5"
            solution_sketch: 'Potential $f = xyz$: $f(2,3,1) - f(1,1,1) = 6 - 1 = 5$.'
          - problem: 'Evaluate $\int_C \mathbf{F} \cdot d\mathbf{r}$ for $\mathbf{F} = \langle 2x, 2y, 2z \rangle$ along any path from $(0, 0, 0)$ to $(1, 2, 2)$.'
            answer: "9"
            solution_sketch: 'Potential $f = x^2 + y^2 + z^2$: $f(1,2,2) = 9$.'
        constraints: "endpoints at small integer points; potential values exact integers"
    diagnostic_exemplar:
      problem: 'Evaluate $\int_C \mathbf{F} \cdot d\mathbf{r}$ for $\mathbf{F} = \langle yz,\; xz + 2y,\; xy \rangle$ along any path from $(1, 0, 2)$ to $(2, 1, 3)$.'
      answer: '$7$'
      solution_sketch: '$\operatorname{curl}\mathbf{F} = \langle x - x,\; y - y,\; z - z \rangle = \mathbf{0}$, so $\mathbf{F}$ is conservative with potential $f = xyz + y^2$. The integral is $f(2,1,3) - f(1,0,2) = 7 - 0 = 7$.'
    anki_seeds:
      - front: 'Test for a conservative field $\mathbf{F}$ on $\mathbb{R}^3$ (simply connected)?'
        back: '$\operatorname{curl}\mathbf{F} = \mathbf{0}$'
        type: basic
      - front: 'Procedure for finding a 3D potential function?'
        back: 'Integrate $f_x = P$ in $x$ (constant of integration $g(y,z)$), then match $f_y = Q$ and $f_z = R$ to pin down $g$.'
        type: basic

  - id: greens-theorem
    name: "Green's Theorem"
    core: false                # stated theorem feeding only the terminal capstones
    difficulty: 0.82
    drill: false
    answer_kind: numeric
    expected_time_secs: 240
    prerequisites:
      - id: line-integrals
        weight: 0.8
        key: true
      - id: double-integrals
        weight: 0.7
        key: true
      - id: double-integrals-polar
        weight: 0.4
        key: false
      - id: conservative-fields-potential-functions
        weight: 0.3
        key: false
    knowledge_points:
      - id: kp1
        name: "Converting circulation integrals to double integrals"
        key_prerequisites: [line-integrals, double-integrals]
        exemplars:
          - problem: 'Use Green''s theorem to evaluate $\oint_C (-y\, dx + x\, dy)$ where $C$ is the unit circle, counterclockwise.'
            answer: '$2\pi$'
            solution_sketch: '$Q_x - P_y = 1 - (-1) = 2$; the integral is $\iint_D 2\, dA = 2\pi$.'
          - problem: 'Use Green''s theorem to evaluate $\oint_C xy\, dx + x^2\, dy$ where $C$ is the boundary of the unit square $[0,1]^2$, counterclockwise.'
            answer: '$\frac{1}{2}$'
            solution_sketch: '$Q_x - P_y = 2x - x = x$; $\iint_{[0,1]^2} x\, dA = \frac{1}{2}$.'
          - problem: 'Use Green''s theorem to evaluate $\oint_C y^2\, dx + 3xy\, dy$ where $C$ bounds the upper half of the unit disk, counterclockwise.'
            answer: '$\frac{2}{3}$'
            solution_sketch: '$Q_x - P_y = 3y - 2y = y$; in polar, $\int_0^\pi \int_0^1 r\sin\theta \cdot r\, dr\, d\theta = \frac{1}{3} \cdot 2 = \frac{2}{3}$.'
        constraints: "C is a circle, square, or half-disk, always counterclockwise; Q_x - P_y is a monomial"
      - id: kp2
        name: "Area via Green's theorem"
        key_prerequisites: [line-integrals, double-integrals]
        exemplars:
          - problem: 'Use $A = \frac{1}{2}\oint_C (x\, dy - y\, dx)$ to find the area of the ellipse $x = 3\cos t$, $y = 2\sin t$.'
            answer: '$6\pi$'
            solution_sketch: '$\frac{1}{2}\int_0^{2\pi} \left(3\cos t \cdot 2\cos t - 2\sin t \cdot (-3\sin t)\right) dt = \frac{1}{2}\int_0^{2\pi} 6\, dt = 6\pi$.'
          - problem: 'Why does $\frac{1}{2}\oint_C (x\, dy - y\, dx)$ compute the enclosed area?'
            answer: 'Because $Q_x - P_y = \frac{1}{2} - \left(-\frac{1}{2}\right) = 1$, so by Green''s theorem the integral equals $\iint_D 1\, dA = A$.'
            solution_sketch: 'Here $Q_x-P_y=\tfrac12-(-\tfrac12)=1$, so Green''s theorem gives $\iint_D 1\,dA$, the area of $D$.'
            answer_contract: {kind: none}
        constraints: "ellipses and polygons parametrized with sin/cos or segments; the integrand collapses via sin^2 + cos^2 = 1"
    diagnostic_exemplar:
      problem: 'Use Green''s theorem to evaluate $\oint_C xy\,dx + x^2\,dy$ where $C$ is the boundary of the triangle with vertices $(0,0)$, $(2,0)$, $(2,2)$, traversed counterclockwise.'
      answer: '$\dfrac{8}{3}$'
      answer_contract: {kind: none}
      solution_sketch: '$Q_x - P_y = 2x - x = x$, and the triangle is $0 \le x \le 2$, $0 \le y \le x$, so the integral is $\int_0^2\!\int_0^x x\,dy\,dx = \int_0^2 x^2\,dx = \tfrac{8}{3}$.'
    anki_seeds:
      - front: 'Green''s theorem (circulation form)?'
        back: '$\oint_C P\, dx + Q\, dy = \iint_D \left(\frac{\partial Q}{\partial x} - \frac{\partial P}{\partial y}\right) dA$, with $C$ the positively oriented boundary of $D$.'
        type: basic
      - front: 'Area formula from Green''s theorem?'
        back: '$A = \frac{1}{2}\oint_C (x\, dy - y\, dx)$'
        type: basic

  - id: flux-form-greens-theorem
    name: "Flux and the Divergence Form of Green's Theorem"
    core: false                # restatement of Green's theorem; terminal
    difficulty: 0.83
    drill: false
    answer_kind: numeric
    expected_time_secs: 240
    prerequisites:
      - id: greens-theorem
        weight: 0.7
        key: true
      - id: computing-div-curl
        weight: 0.6
        key: true
      - id: vector-line-integrals
        weight: 0.4
        key: false
    knowledge_points:
      - id: kp1
        name: "Outward flux across a curve, directly"
        key_prerequisites: [greens-theorem, vector-line-integrals]
        exemplars:
          - problem: 'Compute the outward flux $\oint_C \mathbf{F} \cdot \mathbf{n}\, ds$ of $\mathbf{F} = \langle x, y \rangle$ across the unit circle.'
            answer: '$2\pi$'
            solution_sketch: 'On the unit circle the outward normal is $\langle \cos t, \sin t \rangle$ and $\mathbf{F} \cdot \mathbf{n} = \cos^2 t + \sin^2 t = 1$; the flux is the arc length $2\pi$.'
          - problem: 'Compute the outward flux of $\mathbf{F} = \langle x, 0 \rangle$ across the unit circle.'
            answer: '$\pi$'
            solution_sketch: '$\mathbf{F} \cdot \mathbf{n} = \cos^2 t$; $\int_0^{2\pi} \cos^2 t\, dt = \pi$.'
        constraints: "circles centered at the origin where n = <cos t, sin t>; F.n reduces via cos^2 or sin^2 averages"
      - id: kp2
        name: "The divergence (flux) form of Green's theorem"
        key_prerequisites: [greens-theorem, computing-div-curl]
        exemplars:
          - problem: 'Use the flux form of Green''s theorem to find the outward flux of $\mathbf{F} = \langle x^2, y^2 \rangle$ across the boundary of the unit square $[0,1]^2$.'
            answer: "2"
            solution_sketch: '$\operatorname{div}\mathbf{F} = 2x + 2y$; flux $= \iint_{[0,1]^2} (2x + 2y)\, dA = 1 + 1 = 2$.'
          - problem: 'Find the outward flux of $\mathbf{F} = \langle x, y \rangle$ across the circle $x^2 + y^2 = 9$.'
            answer: '$18\pi$'
            solution_sketch: '$\operatorname{div}\mathbf{F} = 2$, so the flux is $2 \cdot \text{area} = 2 \cdot 9\pi = 18\pi$.'
          - problem: 'Find the outward flux of $\mathbf{F} = \langle xy, y^2 \rangle$ across the boundary of the unit square $[0,1]^2$.'
            answer: '$\frac{3}{2}$'
            solution_sketch: '$\operatorname{div}\mathbf{F} = y + 2y = 3y$; $\iint 3y\, dA = \frac{3}{2}$.'
        constraints: "div F is a constant or single monomial; regions are squares and origin-centered disks"
    diagnostic_exemplar:
      problem: 'Use the flux form of Green''s theorem to find the outward flux of $\mathbf{F} = \langle x^2 y,\; x y^2 \rangle$ across the boundary of the unit square $[0,1]^2$.'
      answer: '$1$'
      solution_sketch: '$\operatorname{div}\mathbf{F} = 2xy + 2xy = 4xy$, so the flux is $\int_0^1\!\int_0^1 4xy\,dx\,dy = 4\cdot\tfrac{1}{2}\cdot\tfrac{1}{2} = 1$.'
    anki_seeds:
      - front: 'Flux (divergence) form of Green''s theorem?'
        back: '$\oint_C \mathbf{F} \cdot \mathbf{n}\, ds = \iint_D \operatorname{div}\mathbf{F}\, dA$, with $\mathbf{n}$ the outward normal.'
        type: basic
      - front: 'The two forms of Green''s theorem measure what quantities?'
        back: 'Tangential form: circulation, via $Q_x - P_y$ (curl). Normal form: outward flux, via $P_x + Q_y$ (divergence).'
        type: basic

