unit: vector-calculus
course: multivariable-calculus
module: "Vector Calculus"
topics:
  - id: vector-fields
    name: "Vector Fields"
    core: true
    difficulty: 0.72
    drill: false
    answer_kind: numeric
    expected_time_secs: 120
    prerequisites:
      - id: vectors-in-rn
        weight: 0.6
        key: true
      - id: functions-several-variables
        weight: 0.6
        key: true
      - id: gradient-directional-derivatives
        weight: 0.4
        key: false
    knowledge_points:
      - id: kp1
        name: 'Evaluating and recognizing fields'
        key_prerequisites: [vectors-in-rn, functions-several-variables]
        exemplars:
          - problem: 'Let $\mathbf{F}(x, y) = \langle x + y,\; x - y \rangle$. Find $\mathbf{F}(2, 3)$.'
            answer: '(5, -1)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'Substitute $x = 2$ and $y = 3$ into each component separately. The first component is $2 + 3 = 5$ and the second is $2 - 3 = -1$. So $\mathbf{F}(2, 3) = (5, -1)$.'
          - problem: 'A wind map gives the wind velocity, in metres per second, at the point $(x, y)$ as $\mathbf{V}(x, y) = \langle 3x,\; -y \rangle$. What is the wind velocity at the point $(2, 4)$?'
            answer: '(6, -4)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'The velocity at a point is the field evaluated at that point. Put $x = 2$ and $y = 4$ into $\langle 3x, -y \rangle$ to get $\langle 3(2), -4 \rangle = (6, -4)$. Both components are in metres per second.'
          - problem: 'Let $\mathbf{F}(x, y) = \langle -y,\; x \rangle$. Does this field point away from the origin, or does it turn about the origin?'
            answer: 'turns about the origin'
            answer_contract: {"kind":"label","options":[["points away from the origin","away from the origin","radial","outward","away","points away","points outward"],["turns about the origin","turns","rotational","rotates","it rotates about the origin","turns around the origin","rotates about the origin","circular"]]}
            solution_sketch: 'At $(2, 1)$ the field vector is $(-1, 2)$, and its dot product with the position vector $(2, 1)$ is $-2 + 2 = 0$. A zero dot product means the vectors are perpendicular, so the field does not point away from the origin. It turns about the origin.'
          - problem: 'In a whirlpool the water velocity at $(x, y)$ is $\mathbf{v}(x, y) = \langle -2y,\; 2x \rangle$ metres per second. How fast is the water moving at the point $(3, 4)$?'
            answer: '10'
            answer_contract: {"kind":"unit","quantity":"speed","unit":"m/s","allow_omitted":true}
            solution_sketch: 'First evaluate the field at $(3, 4)$ to get $\mathbf{v}(3, 4) = (-8, 6)$. The speed is the length of this vector, $\sqrt{64 + 36} = 10$. The water moves at $10$ metres per second.'
          - problem: 'Let $\mathbf{F}(x, y, z) = \langle yz,\; xz,\; xy \rangle$. Find $\mathbf{F}(1, 2, 3)$.'
            answer: '(6, 3, 2)'
            answer_contract: {"kind":"coordinates","arity":3}
            solution_sketch: 'Substitute $x = 1$, $y = 2$, $z = 3$ into each of the three components. This gives $yz = 6$, $xz = 3$ and $xy = 2$. So $\mathbf{F}(1, 2, 3) = (6, 3, 2)$.'
          - problem: 'The field $\mathbf{F}(x, y) = \langle x,\; y \rangle$ has magnitude $10$ at a point $(6, y)$ with $y > 0$. Find $y$.'
            answer: '8'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'At the point $(6, y)$ the field is $(6, y)$, with magnitude $\sqrt{36 + y^2}$. Set $\sqrt{36 + y^2} = 10$ to get $y^2 = 64$. Since $y > 0$, we have $y = 8$.'
          - problem: 'Evaluate $\mathbf{F}(x, y) = \langle x^2 - y,\; xy \rangle$ at $(2, -1)$. What is $\mathbf{F}(2, -1)$?'
            answer: '(5, -2)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'Put $x = 2$ and $y = -1$ into each component. The first is $2^2 - (-1) = 5$, and the second is $(2)(-1) = -2$. So the value is $(5, -2)$.'
          - problem: 'Find the point where the field $\mathbf{F}(x, y) = \langle x - 2,\; y + 3 \rangle$ is the zero vector.'
            answer: '(2, -3)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'The vector is zero only when both components are zero. Solving $x - 2 = 0$ and $y + 3 = 0$ gives $x = 2$ and $y = -3$. The field vanishes at $(2, -3)$.'
          - problem: 'Let $\mathbf{F}(x, y) = \langle -y,\; x \rangle$. Find $\mathbf{F}(3, 4) \cdot \langle 3, 4 \rangle$.'
            answer: '0'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'First $\mathbf{F}(3, 4) = (-4, 3)$. Then the dot product with $(3, 4)$ is $(-4)(3) + (3)(4) = 0$. A zero result shows the field vector is perpendicular to the position vector.'
        constraints: 'fields built from x, y (and z) with integer coefficients; evaluation at small integer points; radial versus rotational; magnitudes and zeros of a field'
      - id: kp2
        name: 'Gradient fields'
        key_prerequisites: [functions-several-variables, gradient-directional-derivatives]
        exemplars:
          - problem: 'Find the gradient field of $f(x, y) = x^2 y + y^3$.'
            answer: '(2xy, x^2 + 3y^2)'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The gradient field is $\langle f_x, f_y \rangle$. Differentiating in $x$ with $y$ held constant gives $f_x = 2xy$. Differentiating in $y$ gives $f_y = x^2 + 3y^2$, so $\nabla f = (2xy, x^2 + 3y^2)$.'
          - problem: 'Find a function $f$ whose gradient field is $\mathbf{F}(x, y) = \langle 2xy,\; x^2 + 4y \rangle$.'
            answer: 'x^2 y + 2y^2'
            answer_contract: {"kind":"function","vars":["x","y"],"up_to_constant":true}
            solution_sketch: 'Integrating $f_x = 2xy$ in $x$ gives $f = x^2 y + g(y)$. Then $f_y = x^2 + g''(y)$ must equal $x^2 + 4y$, so $g''(y) = 4y$ and $g(y) = 2y^2$. Hence $f = x^2 y + 2y^2$, and any constant may be added.'
          - problem: 'Let $f(x, y) = x^3 - 3xy^2$. Find $\nabla f(2, 1)$.'
            answer: '(9, -12)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'The partial derivatives are $f_x = 3x^2 - 3y^2$ and $f_y = -6xy$. At $(2, 1)$ they equal $12 - 3 = 9$ and $-6(2)(1) = -12$. So $\nabla f(2, 1) = (9, -12)$.'
          - problem: 'The height of a hill, in metres, is $h(x, y) = 50 - x^2 - 2y^2$. A hiker stands at $(1, 2)$. Find the gradient of $h$ at that point, the vector that points in the direction of steepest climb.'
            answer: '(-2, -8)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'The gradient is $\nabla h = (-2x, -4y)$. At $(1, 2)$ this is $(-2, -8)$. The hiker climbs fastest by walking in the direction $(-2, -8)$, back toward the summit at the origin.'
          - problem: 'The electric potential in a region is $V(x, y) = x^2 y$ volts, and the electric field is $\mathbf{E} = -\nabla V$. Find $\mathbf{E}(2, 1)$.'
            answer: '(-4, -4)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'First $\nabla V = (2xy, x^2)$, which equals $(4, 4)$ at $(2, 1)$. The field is the negative of this gradient, so $\mathbf{E}(2, 1) = (-4, -4)$. The sign matters: the field points down the potential.'
          - problem: 'Find the gradient field of $f(x, y, z) = x^2 y + z^3$.'
            answer: '(2xy, x^2, 3z^2)'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Differentiate with respect to each of the three variables in turn. This gives $f_x = 2xy$, $f_y = x^2$ and $f_z = 3z^2$. So $\nabla f = (2xy, x^2, 3z^2)$.'
          - problem: 'Find a function $f$ whose gradient field is $\mathbf{F}(x, y, z) = \langle 2xy,\; x^2 + z,\; y \rangle$.'
            answer: 'x^2 y + y z'
            answer_contract: {"kind":"function","vars":["x","y","z"],"up_to_constant":true}
            solution_sketch: 'Integrating $f_x = 2xy$ in $x$ gives $x^2 y + g(y, z)$. Matching $f_y = x^2 + z$ shows $g_y = z$, so $g = yz + h(z)$. Then $f_z = y + h''(z)$ must equal $y$, so $h$ is constant and $f = x^2 y + yz$.'
          - problem: 'Is $\mathbf{F}(x, y) = \langle 3y,\; 2x \rangle$ the gradient field of some function $f$?'
            answer: 'no'
            answer_contract: {"kind":"label","options":[["no","it is not","not a gradient field","there is no such function"],["yes","it is","gradient field","there is such a function"]]}
            solution_sketch: 'If $\mathbf{F} = \nabla f$, then $f_x = 3y$ and $f_y = 2x$, so the mixed partials would be $f_{xy} = 3$ and $f_{yx} = 2$. These are different, but mixed partials of a smooth function are equal. So $\mathbf{F}$ is not a gradient field.'
          - problem: 'Let $\mathbf{F}(x, y) = \langle P, Q \rangle = \langle 3y,\; 2x \rangle$. Find $\dfrac{\partial Q}{\partial x} - \dfrac{\partial P}{\partial y}$.'
            answer: '-1'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Here $\partial Q/\partial x = 2$ and $\partial P/\partial y = 3$. Their difference is $2 - 3 = -1$. A gradient field would give $0$, so this field is not a gradient field.'
          - problem: 'Is $\mathbf{F}(x, y) = \langle 2xy,\; x^2 \rangle$ the gradient field of some function $f$?'
            answer: 'yes'
            answer_contract: {"kind":"label","options":[["no","it is not","not a gradient field","there is no such function"],["yes","it is","gradient field","there is such a function"]]}
            solution_sketch: 'The mixed partials agree: $\partial(x^2)/\partial x = 2x$ and $\partial(2xy)/\partial y = 2x$. In fact $f = x^2 y$ has $f_x = 2xy$ and $f_y = x^2$. So $\mathbf{F}$ is a gradient field.'
          - problem: 'The field $\mathbf{F}(x, y) = \langle 2x + y,\; x + 2y \rangle$ is the gradient of a function $f$ with $f(0, 0) = 0$. Find $f(1, 2)$.'
            answer: '7'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Integrating $f_x = 2x + y$ gives $x^2 + xy + g(y)$, and matching $f_y = x + 2y$ gives $g(y) = y^2$. So $f = x^2 + xy + y^2$, which is $0$ at the origin. Then $f(1, 2) = 1 + 2 + 4 = 7$.'
          - problem: 'What is a function $f$ whose gradient field is $\mathbf{F}(x, y) = \langle 2xy + 3,\; x^2 + 2y \rangle$?'
            answer: 'x^2 y + 3x + y^2'
            answer_contract: {"kind":"function","vars":["x","y"],"up_to_constant":true}
            solution_sketch: 'Integrating $f_x$ in $x$ gives $x^2 y + 3x$ plus an unknown function $g(y)$. Matching $f_y = x^2 + g''(y)$ with $x^2 + 2y$ gives $g(y) = y^2$. So $f = x^2 y + 3x + y^2$.'
        constraints: 'potentials are polynomials of degree at most 3; gradient fields are written as a bracketed list of components; is-it-a-gradient-field items use the mixed-partials test'
    diagnostic_exemplar:
      problem: 'Find the gradient field of $f(x, y) = x^3 y - y^2$ and evaluate it at $(1, 2)$.'
      answer: '$\nabla f = \langle 3x^2 y,\; x^3 - 2y \rangle$; $\nabla f(1, 2) = \langle 6, -3 \rangle$.'
      answer_contract: {kind: none}
      solution_sketch: 'Differentiate in each variable: $f_x = 3x^2y$, $f_y = x^3 - 2y$; at $(1,2)$ these are $6$ and $1 - 4 = -3$.'
    anki_seeds:
      - front: 'What is a vector field on $\mathbb{R}^2$?'
        back: 'A function assigning a vector $\mathbf{F}(x, y)$ to each point $(x, y)$.'
        type: basic
      - front: 'What is the gradient field of a scalar function $f$?'
        back: 'The vector field $\nabla f = \langle f_x, f_y \rangle$; fields of this form are called conservative.'
        type: basic

  - id: scalar-line-integrals
    name: "Scalar Line Integrals"
    core: true
    difficulty: 0.74
    drill: false
    answer_kind: numeric
    expected_time_secs: 180
    prerequisites:
      - id: arc-length-space-curves
        weight: 0.7
        key: true
      - id: definite-integrals-ftc
        weight: 0.4
        key: false
      - id: trigonometric-integrals
        weight: 0.4
        key: false
    knowledge_points:
      - id: kp1
        name: 'Line integrals along segments'
        key_prerequisites: [arc-length-space-curves]
        try_first:
          problem: 'A straight wire is $10$ centimetres long and has constant density $3$ grams per centimetre. What is its mass in grams?'
          answer_contract: {"kind":"exact"}
          answer: '30'
          reveal: 'Mass is density times length when the density is constant. When the density changes along the wire, we add up density times a small length $ds$ along the curve, and that sum is the line integral $\int_C \rho\,ds$.'
        exemplars:
          - problem: 'Evaluate $\int_C x\, ds$, where $C$ is the straight segment from $(0, 0)$ to $(3, 4)$.'
            answer: '15/2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Parametrize the segment as $\mathbf{r}(t) = (3t, 4t)$ for $0 \le t \le 1$. The speed is $\sqrt{9 + 16} = 5$, so $ds = 5\,dt$. Then $\int_C x\,ds = \int_0^1 3t \cdot 5\,dt = 15 \cdot \tfrac{1}{2} = \tfrac{15}{2}$.'
          - problem: 'Evaluate $\int_C (x + y)\, ds$, where $C$ is the straight segment from $(0, 0)$ to $(3, 4)$.'
            answer: '35/2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'On the segment $x + y = 7t$, and $ds = 5\,dt$ because the length of the segment is $5$. So the integral is $\int_0^1 7t \cdot 5\,dt = 35 \cdot \tfrac{1}{2} = \tfrac{35}{2}$.'
          - problem: 'A straight wire runs from $(0, 0)$ to $(6, 8)$, with distances in centimetres. Its density at $(x, y)$ is $\rho = x + y$ grams per centimetre. Find the mass of the wire.'
            answer: '70'
            answer_contract: {"kind":"unit","quantity":"mass","unit":"g","allow_omitted":true}
            solution_sketch: 'The mass is $\int_C \rho\,ds$. On the wire $\rho = 14t$, and $ds = 10\,dt$ because the wire is $10$ centimetres long. So $m = \int_0^1 14t \cdot 10\,dt = 140 \cdot \tfrac{1}{2} = 70$ grams.'
          - problem: 'Find the average value of $f(x, y) = x + y$ along the straight segment from $(0, 0)$ to $(6, 8)$.'
            answer: '7'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The average value is the integral of $f$ along the segment divided by its length. The integral is $\int_0^1 14t \cdot 10\,dt = 70$, and the length is $10$. So the average value is $70 / 10 = 7$.'
          - problem: 'Evaluate $\int_C (3x - y)\, ds$, where $C$ is the straight segment from $(2, 3)$ to $(5, 7)$.'
            answer: '55/2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Parametrize by $x = 2 + 3t$, $y = 3 + 4t$ for $0 \le t \le 1$. Then $3x - y = 3 + 5t$ and $ds = 5\,dt$. The integral is $\int_0^1 (3 + 5t) \cdot 5\,dt = 5(3 + \tfrac{5}{2}) = \tfrac{55}{2}$.'
          - problem: 'Evaluate $\int_C xy\, ds$, where $C$ is the straight segment from $(0, 1)$ to $(6, 9)$.'
            answer: '190'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Parametrize by $x = 6t$, $y = 1 + 8t$ for $0 \le t \le 1$. The speed is $\sqrt{36 + 64} = 10$. So the integral is $\int_0^1 6t(1 + 8t) \cdot 10\,dt = 60(\tfrac{1}{2} + \tfrac{8}{3}) = 190$.'
          - problem: 'A rope hangs straight from $(0, 0)$ to $(5, 12)$, with distances in metres. Its density at $(x, y)$ is $\rho = x + 2y$ kilograms per metre. Find the mass of the rope.'
            answer: '188.5'
            answer_contract: {"kind":"unit","quantity":"mass","unit":"kg","allow_omitted":true}
            solution_sketch: 'The rope is $13$ metres long, so $ds = 13\,dt$. On the rope $\rho = 5t + 24t = 29t$, so $m = \int_0^1 29t \cdot 13\,dt = \tfrac{377}{2}$. The mass is $188.5$ kilograms.'
          - problem: 'Evaluate $\int_C (3x + y)\, ds$, where $C$ is the straight segment from $(6, 8)$ to $(0, 0)$.'
            answer: '130'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Parametrize by $x = 6 - 6t$, $y = 8 - 8t$ for $0 \le t \le 1$, with $ds = 10\,dt$. Then $3x + y = 26 - 26t$, and the integral is $\int_0^1 (26 - 26t) \cdot 10\,dt = 260 \cdot \tfrac{1}{2} = 130$.'
          - problem: 'A scalar function $f$ has $\int_C f\, ds = 12$ along a segment $C$ from $A$ to $B$. What is the value of $\int f\, ds$ along the same segment traversed from $B$ to $A$?'
            answer: '12'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The arc length element $ds$ is always positive, whatever the direction of travel. So reversing the segment does not change the integral. The value is still $12$.'
          - problem: 'A straight wire runs from $(0, 0)$ to $(6, 8)$, with distances in metres. It has constant density $2.5$ kilograms per metre. Find its mass.'
            answer: '25'
            answer_contract: {"kind":"unit","quantity":"mass","unit":"kg","allow_omitted":true}
            solution_sketch: 'The wire has length $\sqrt{36 + 64} = 10$ metres. With constant density the integral $\int_C \rho\,ds$ is the density times the length. So the mass is $2.5 \cdot 10 = 25$ kilograms.'
        constraints: 'segments with Pythagorean-triple directions so ds = |r''| dt is a constant integer; masses and average values along segments'
      - id: kp2
        name: 'Line integrals along circles and curves'
        key_prerequisites: [arc-length-space-curves, trigonometric-integrals]
        exemplars:
          - problem: 'Evaluate $\int_C x^2\, ds$, where $C$ is the circle of radius $2$ centered at the origin.'
            answer: '8pi'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Parametrize by $\mathbf{r}(t) = (2\cos t, 2\sin t)$ for $0 \le t \le 2\pi$, so $ds = 2\,dt$. Then $\int_C x^2\,ds = \int_0^{2\pi} 4\cos^2 t \cdot 2\,dt = 8\pi$, because $\int_0^{2\pi} \cos^2 t\,dt = \pi$.'
          - problem: 'Evaluate $\int_C (x^2 + y^2)\, ds$, where $C$ is the unit circle centered at the origin.'
            answer: '2pi'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'On the unit circle $x^2 + y^2 = 1$, and $ds = dt$ for $0 \le t \le 2\pi$. So the integral is $\int_0^{2\pi} 1\,dt = 2\pi$. This is just the circumference.'
          - problem: 'Evaluate $\int_C y^2\, ds$, where $C$ is the circle of radius $4$ centered at the origin.'
            answer: '64pi'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Parametrize by $(4\cos t, 4\sin t)$, so $ds = 4\,dt$ and $y^2 = 16\sin^2 t$. The integral is $64\int_0^{2\pi} \sin^2 t\,dt = 64\pi$.'
          - problem: 'A circular hoop of radius $5$ metres is centered at the origin. Its density at $(x, y)$ is $\rho = y^2$ kilograms per metre. Find the mass of the hoop.'
            answer: '125pi'
            answer_contract: {"kind":"unit","quantity":"mass","unit":"kg","allow_omitted":true}
            solution_sketch: 'With $\mathbf{r}(t) = (5\cos t, 5\sin t)$ we have $ds = 5\,dt$ and $\rho = 25\sin^2 t$. So $m = \int_0^{2\pi} 25\sin^2 t \cdot 5\,dt = 125\pi$. The mass is $125\pi$ kilograms.'
          - problem: 'Find the average value of $f(x, y) = x^2$ around the circle of radius $3$ centered at the origin.'
            answer: '9/2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The integral of $x^2$ around the circle is $\int_0^{2\pi} 9\cos^2 t \cdot 3\,dt = 27\pi$. The circumference is $6\pi$. The average value is $27\pi / 6\pi = \tfrac{9}{2}$.'
          - problem: 'Evaluate $\int_C (x^2 - y^2)\, ds$, where $C$ is the circle of radius $2$ centered at the origin.'
            answer: '0'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'On the circle $x^2 - y^2 = 4\cos^2 t - 4\sin^2 t$ and $ds = 2\,dt$. The integrals of $\cos^2 t$ and $\sin^2 t$ over a full period are both $\pi$. So the two parts cancel and the integral is $0$.'
          - problem: 'Evaluate $\int_C y\, ds$, where $C$ is the upper half of the circle of radius $2$ centered at the origin.'
            answer: '8'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Parametrize the upper half by $(2\cos t, 2\sin t)$ for $0 \le t \le \pi$, with $ds = 2\,dt$. Then $\int_C y\,ds = \int_0^{\pi} 2\sin t \cdot 2\,dt = 4 \cdot 2 = 8$.'
          - problem: 'Evaluate $\int_C x^2 y^2\, ds$, where $C$ is the unit circle centered at the origin.'
            answer: 'pi/4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'On the unit circle $x^2 y^2 = \cos^2 t \sin^2 t = \tfrac{1}{4}\sin^2 2t$, and $ds = dt$. Since $\int_0^{2\pi} \sin^2 2t\,dt = \pi$, the integral is $\tfrac{1}{4}\pi = \tfrac{\pi}{4}$.'
          - problem: 'Find the average value of $f(x, y) = x^2 + y^2$ around the circle of radius $5$ centered at the origin.'
            answer: '25'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'On the circle of radius $5$ we have $x^2 + y^2 = 25$ at every point. A function with a constant value has that value as its average. So the average is $25$.'
          - problem: 'Evaluate $\int_C y^2\, ds$ around the circle of radius $6$ centered at the origin.'
            answer: '216pi'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The arc-length factor is $ds = 6\,dt$. The integral is $\int_0^{2\pi} 36\sin^2 t \cdot 6\,dt = 216\pi$.'
          - problem: 'A thin circular wire of radius $2$ centimetres is centered at the origin. Its density at $(x, y)$ is $\rho = y^2$ grams per centimetre. Find its mass.'
            answer: '8pi'
            answer_contract: {"kind":"unit","quantity":"mass","unit":"g","allow_omitted":true}
            solution_sketch: 'On the wire $y^2 = 4\sin^2 t$ and $ds = 2\,dt$. So $m = \int_0^{2\pi} 4\sin^2 t \cdot 2\,dt = 8\pi$. The mass is $8\pi$ grams.'
        constraints: 'circles centered at the origin with small integer radii and upper half circles; use cos^2 integrals over full periods; average values around a circle'
      - id: kp3
        name: 'Mass of a wire and 3D curves'
        key_prerequisites: [arc-length-space-curves]
        exemplars:
          - problem: 'A wire follows the upper unit semicircle $x^2 + y^2 = 1$, $y \ge 0$, and has density $\rho(x, y) = y$. Find its mass.'
            answer: '2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Parametrize by $(\cos t, \sin t)$ for $0 \le t \le \pi$, so $ds = dt$ and $\rho = \sin t$. The mass is $\int_0^{\pi} \sin t\,dt = 2$.'
          - problem: 'Evaluate $\int_C z\, ds$, where $C$ is the helix $\mathbf{r}(t) = \langle \cos t, \sin t, t \rangle$, $0 \le t \le 2\pi$.'
            answer: '2sqrt(2)pi^2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The speed is $|\mathbf{r}''(t)| = \sqrt{\sin^2 t + \cos^2 t + 1} = \sqrt{2}$, a constant. Then $\int_C z\,ds = \sqrt{2}\int_0^{2\pi} t\,dt = \sqrt{2} \cdot 2\pi^2 = 2\sqrt{2}\,\pi^2$.'
          - problem: 'A wire follows the quarter of the unit circle in the first quadrant and has density $\rho(x, y) = y$. Find its mass.'
            answer: '1'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Parametrize by $(\cos t, \sin t)$ for $0 \le t \le \pi/2$, so $ds = dt$ and $\rho = \sin t$. The mass is $\int_0^{\pi/2} \sin t\,dt = 1$.'
          - problem: 'A wire follows the helix $\mathbf{r}(t) = \langle 2\cos t,\, 2\sin t,\, 5t \rangle$ for $0 \le t \le \pi/3$ and has density $\rho(x, y, z) = z$. Find its mass.'
            answer: '5sqrt(29)pi^2/18'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The speed is $\sqrt{4 + 25} = \sqrt{29}$, and $\rho = 5t$. So $m = \sqrt{29}\int_0^{\pi/3} 5t\,dt = 5\sqrt{29} \cdot \tfrac{\pi^2}{18} = \tfrac{5\sqrt{29}\,\pi^2}{18}$.'
          - problem: 'A wire follows the helix $\mathbf{r}(t) = \langle 2\cos t,\, 2\sin t,\, 2t \rangle$ for $0 \le t \le \pi$ and has density $\rho(x, y, z) = y$. Find its mass.'
            answer: '8sqrt(2)'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The speed is $\sqrt{4 + 4} = 2\sqrt{2}$, and $\rho = 2\sin t$. So $m = \int_0^{\pi} 2\sin t \cdot 2\sqrt{2}\,dt = 4\sqrt{2} \cdot 2 = 8\sqrt{2}$.'
          - problem: 'A wire follows the helix $\mathbf{r}(t) = \langle 4\cos t,\, 4\sin t,\, 3t \rangle$ for $0 \le t \le \pi/2$ and has density $\rho(x, y, z) = x$. Find its mass.'
            answer: '20'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The speed is $\sqrt{16 + 9} = 5$, and $\rho = 4\cos t$. So $m = \int_0^{\pi/2} 4\cos t \cdot 5\,dt = 20 \cdot 1 = 20$.'
          - problem: 'A wire is bent into the quarter of the circle $x^2 + y^2 = 9$ in the first quadrant. Its density at $(x, y)$ is $\rho = x + y$ kilograms per metre, with distances in metres. Find its mass.'
            answer: '18'
            answer_contract: {"kind":"unit","quantity":"mass","unit":"kg","allow_omitted":true}
            solution_sketch: 'Parametrize by $(3\cos t, 3\sin t)$ for $0 \le t \le \pi/2$, so $ds = 3\,dt$. Then $m = \int_0^{\pi/2} 3(\cos t + \sin t) \cdot 3\,dt = 9(1 + 1) = 18$.'
          - problem: 'A spring is wound along the helix $\mathbf{r}(t) = \langle 3\cos t,\, 3\sin t,\, 4t \rangle$ for $0 \le t \le 2\pi$, with distances in metres. Find the length of the wire.'
            answer: '10pi'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'The length is $\int_C ds$. The speed is $\sqrt{9 + 16} = 5$, so the length is $\int_0^{2\pi} 5\,dt = 10\pi$ metres.'
          - problem: 'Find the average density of a wire along the upper unit semicircle with density $\rho(x, y) = y$, that is, its mass divided by its length.'
            answer: '2/pi'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The mass is $\int_0^{\pi} \sin t\,dt = 2$. The length of a half circle of radius $1$ is $\pi$. So the average density is $2/\pi$.'
        constraints: 'curves with constant speed (circles, helices); densities linear in one coordinate; answers exact; lengths and average densities'
    diagnostic_exemplar:
      problem: 'A wire follows the helix $\mathbf{r}(t) = \langle 3\cos t,\; 3\sin t,\; 4t \rangle$ for $0 \le t \le \pi$ and has density $\rho(x, y, z) = z$. Find its mass.'
      answer: '$10\pi^2$'
      solution_sketch: '$|\mathbf{r}''| = \sqrt{9\sin^2 t + 9\cos^2 t + 16} = 5$, so $m = \int_0^{\pi} (4t)(5)\,dt = 20\cdot\frac{\pi^2}{2} = 10\pi^2$.'
    anki_seeds:
      - front: 'In a scalar line integral $\int_C f\, ds$, the element $ds$ equals...'
        back: '$|\mathbf{r}''(t)|\, dt$'
        type: basic
      - front: 'Physical interpretation of $\int_C \rho\, ds$ for a wire $C$ with density $\rho$?'
        back: 'The mass of the wire.'
        type: basic

  - id: vector-line-integrals
    name: "Line Integrals of Vector Fields"
    core: true
    difficulty: 0.77
    drill: false
    answer_kind: numeric
    expected_time_secs: 200
    prerequisites:
      - id: scalar-line-integrals
        weight: 0.7
        key: true
      - id: vector-fields
        weight: 0.7
        key: true
      - id: dot-product
        weight: 0.4
        key: false
    knowledge_points:
      - id: kp1
        name: 'Computing F · dr along parametrized curves'
        key_prerequisites: [scalar-line-integrals, vector-fields, dot-product]
        exemplars:
          - problem: 'Evaluate $\int_C \mathbf{F} \cdot d\mathbf{r}$ for $\mathbf{F} = \langle y,\; x \rangle$ along $\mathbf{r}(t) = \langle t,\; t^2 \rangle$, $0 \le t \le 1$.'
            answer: '1'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Here $\mathbf{r}''(t) = \langle 1, 2t \rangle$ and $\mathbf{F}(\mathbf{r}(t)) = \langle t^2, t \rangle$. The dot product is $t^2 + 2t^2 = 3t^2$. So the integral is $\int_0^1 3t^2\,dt = 1$.'
          - problem: 'Evaluate $\int_C \mathbf{F} \cdot d\mathbf{r}$ for $\mathbf{F} = \langle y,\; z,\; x \rangle$ along $\mathbf{r}(t) = \langle t,\; t,\; t \rangle$, $0 \le t \le 1$.'
            answer: '3/2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'On the curve $\mathbf{F} = \langle t, t, t \rangle$ and $\mathbf{r}''(t) = \langle 1, 1, 1 \rangle$. The dot product is $3t$. So the integral is $\int_0^1 3t\,dt = \tfrac{3}{2}$.'
          - problem: 'Evaluate $\int_C \mathbf{F} \cdot d\mathbf{r}$ for $\mathbf{F} = \langle 2x,\; 3y \rangle$ along $\mathbf{r}(t) = \langle 2t,\; t \rangle$, $0 \le t \le 1$.'
            answer: '11/2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'On the curve $\mathbf{F} = \langle 4t, 3t \rangle$ and $\mathbf{r}''(t) = \langle 2, 1 \rangle$. The dot product is $8t + 3t = 11t$. So the integral is $\int_0^1 11t\,dt = \tfrac{11}{2}$.'
          - problem: 'A particle moves along the path $\mathbf{r}(t) = \langle t,\; t^2 \rangle$, $0 \le t \le 2$, with distances in metres, in the force field $\mathbf{F} = \langle y,\; x \rangle$ newtons. How much work, in joules, does the field do on the particle?'
            answer: '8'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The work is $\int_C \mathbf{F} \cdot d\mathbf{r}$. On the path $\mathbf{F} = \langle t^2, t \rangle$ and $\mathbf{r}''(t) = \langle 1, 2t \rangle$, so the integrand is $3t^2$. Then $\int_0^2 3t^2\,dt = 8$ joules.'
          - problem: 'Evaluate $\int_C \mathbf{F} \cdot d\mathbf{r}$ for $\mathbf{F} = \langle x,\; y^2 \rangle$ along $\mathbf{r}(t) = \langle t,\; 3t^2 \rangle$, $0 \le t \le 1$.'
            answer: '19/2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'On the curve $\mathbf{F} = \langle t, 9t^4 \rangle$ and $\mathbf{r}''(t) = \langle 1, 6t \rangle$. The dot product is $t + 54t^5$. So the integral is $\tfrac{1}{2} + 9 = \tfrac{19}{2}$.'
          - problem: 'Evaluate $\int_C \mathbf{F} \cdot d\mathbf{r}$ for $\mathbf{F} = \langle y + z,\; x + z,\; x + y \rangle$ along $\mathbf{r}(t) = \langle t,\; 2t,\; 3t \rangle$, $0 \le t \le 1$.'
            answer: '11'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'On the curve $\mathbf{F} = \langle 5t, 4t, 3t \rangle$ and $\mathbf{r}''(t) = \langle 1, 2, 3 \rangle$. The dot product is $5t + 8t + 9t = 22t$. So the integral is $\int_0^1 22t\,dt = 11$.'
          - problem: 'Evaluate $\int_C \mathbf{F} \cdot d\mathbf{r}$ for $\mathbf{F} = \langle y,\; x^2 \rangle$ along $\mathbf{r}(t) = \langle 2t^2,\; t \rangle$, $0 \le t \le 1$.'
            answer: '32/15'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'On the curve $\mathbf{F} = \langle t, 4t^4 \rangle$ and $\mathbf{r}''(t) = \langle 4t, 1 \rangle$. The dot product is $4t^2 + 4t^4$. So the integral is $\tfrac{4}{3} + \tfrac{4}{5} = \tfrac{32}{15}$.'
          - problem: 'Evaluate $\int_C \mathbf{F} \cdot d\mathbf{r}$ for $\mathbf{F} = \langle x,\; y \rangle$, where $C$ is the straight segment from $(0, 0)$ to $(2, 4)$.'
            answer: '10'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Parametrize the segment by $\mathbf{r}(t) = \langle 2t, 4t \rangle$ for $0 \le t \le 1$, so $\mathbf{r}''(t) = \langle 2, 4 \rangle$. Then $\mathbf{F} \cdot \mathbf{r}'' = 4t + 16t = 20t$. The integral is $\int_0^1 20t\,dt = 10$.'
          - problem: 'Evaluate $\int_C \mathbf{F} \cdot d\mathbf{r}$ for $\mathbf{F} = \langle x^2,\; y \rangle$ along $\mathbf{r}(t) = \langle t,\; t^2 \rangle$, $0 \le t \le 1$.'
            answer: '5/6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Here $\mathbf{r}''(t) = \langle 1, 2t \rangle$, so the second component is multiplied by $2t$. The integrand is $t^2 + t^2 \cdot 2t = t^2 + 2t^3$. So the integral is $\tfrac{1}{3} + \tfrac{1}{2} = \tfrac{5}{6}$.'
          - problem: 'A bead is pulled along the curve $\mathbf{r}(t) = \langle 2t,\; t^3 \rangle$, $0 \le t \le 1$, with distances in metres, by the force $\mathbf{F} = \langle y,\; 3x \rangle$ newtons. How much work, in joules, does the force do?'
            answer: '5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'On the curve $\mathbf{F} = \langle t^3, 6t \rangle$ and $\mathbf{r}''(t) = \langle 2, 3t^2 \rangle$. The dot product is $2t^3 + 18t^3 = 20t^3$. So the work is $\int_0^1 20t^3\,dt = 5$ joules.'
        constraints: 'curves are lines or parabolas; F polynomial; integrands reduce to single-variable polynomials; work along a given path'
      - id: kp2
        name: 'Circulation around closed curves'
        key_prerequisites: [scalar-line-integrals, vector-fields, dot-product]
        exemplars:
          - problem: 'Evaluate $\oint_C \mathbf{F} \cdot d\mathbf{r}$ for $\mathbf{F} = \langle y,\; -x \rangle$ around the unit circle centered at the origin, traversed counterclockwise.'
            answer: '-2pi'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'With $\mathbf{r}(t) = \langle \cos t, \sin t \rangle$ we get $\mathbf{F} = \langle \sin t, -\cos t \rangle$ and $\mathbf{r}'' = \langle -\sin t, \cos t \rangle$. The dot product is $-\sin^2 t - \cos^2 t = -1$. So the circulation is $\int_0^{2\pi} (-1)\,dt = -2\pi$.'
          - problem: 'Evaluate $\oint_C \mathbf{F} \cdot d\mathbf{r}$ for $\mathbf{F} = \langle -y,\; x \rangle$ around the circle of radius $2$ centered at the origin, traversed counterclockwise.'
            answer: '8pi'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'With $\mathbf{r}(t) = \langle 2\cos t, 2\sin t \rangle$ we get $\mathbf{F} = \langle -2\sin t, 2\cos t \rangle$ and $\mathbf{r}'' = \langle -2\sin t, 2\cos t \rangle$. The dot product is $4$. So the circulation is $\int_0^{2\pi} 4\,dt = 8\pi$.'
          - problem: 'Evaluate the circulation of $\mathbf{F} = \langle 2y,\; -2x \rangle$ around the unit circle centered at the origin, traversed counterclockwise.'
            answer: '-4pi'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'With $\mathbf{r}(t) = \langle \cos t, \sin t \rangle$ the dot product $\mathbf{F} \cdot \mathbf{r}''$ is $-2\sin^2 t - 2\cos^2 t = -2$. So the circulation is $\int_0^{2\pi} (-2)\,dt = -4\pi$.'
          - problem: 'In a model of a whirlpool, the water velocity at $(x, y)$ is $\mathbf{v} = \langle -2y,\; 2x \rangle$ metres per second. Find the circulation of the water around the circle of radius $3$ metres centered at the origin, traversed counterclockwise.'
            answer: '36pi'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'With $\mathbf{r}(t) = \langle 3\cos t, 3\sin t \rangle$ the velocity is $\langle -6\sin t, 6\cos t \rangle$ and $\mathbf{r}'' = \langle -3\sin t, 3\cos t \rangle$. The dot product is $18$. So the circulation is $\int_0^{2\pi} 18\,dt = 36\pi$.'
          - problem: 'Evaluate $\oint_C \mathbf{F} \cdot d\mathbf{r}$ for $\mathbf{F} = \langle -y,\; 2x \rangle$ around the circle of radius $2$ centered at the origin, traversed counterclockwise.'
            answer: '12pi'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'On the circle $\mathbf{F} = \langle -2\sin t, 4\cos t \rangle$ and $\mathbf{r}'' = \langle -2\sin t, 2\cos t \rangle$. The dot product is $4\sin^2 t + 8\cos^2 t$. Each square integrates to $\pi$ over a full turn, so the circulation is $4\pi + 8\pi = 12\pi$.'
          - problem: 'Evaluate $\oint_C \mathbf{F} \cdot d\mathbf{r}$ for $\mathbf{F} = \langle y,\; 3x \rangle$ around the unit circle centered at the origin, traversed counterclockwise.'
            answer: '2pi'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'On the unit circle $\mathbf{F} \cdot \mathbf{r}'' = (\sin t)(-\sin t) + (3\cos t)(\cos t) = -\sin^2 t + 3\cos^2 t$. Each square integrates to $\pi$ over a full turn. So the circulation is $-\pi + 3\pi = 2\pi$.'
          - problem: 'Evaluate $\oint_C \mathbf{F} \cdot d\mathbf{r}$ for $\mathbf{F} = \langle 2y,\; -x \rangle$ around the circle of radius $3$ centered at the origin, traversed counterclockwise.'
            answer: '-27pi'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'On the circle $\mathbf{F} = \langle 6\sin t, -3\cos t \rangle$ and $\mathbf{r}'' = \langle -3\sin t, 3\cos t \rangle$. The dot product is $-18\sin^2 t - 9\cos^2 t$. So the circulation is $-18\pi - 9\pi = -27\pi$.'
          - problem: 'Find the circulation of $\mathbf{F} = \langle -y,\; x \rangle$ around the circle of radius $2$ centered at the origin, traversed clockwise.'
            answer: '-8pi'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Traversed clockwise, the circle is $\mathbf{r}(t) = \langle 2\cos t, -2\sin t \rangle$. Then $\mathbf{F} \cdot \mathbf{r}'' = -4$ and the circulation is $-8\pi$. This is the negative of the counterclockwise value $8\pi$.'
          - problem: 'The circulation of $\mathbf{F} = \langle -y,\; x \rangle$ counterclockwise around a circle of radius $R$ centered at the origin is $18\pi$. Find $R$.'
            answer: '3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'On a circle of radius $R$ the dot product $\mathbf{F} \cdot \mathbf{r}''$ is $R^2$, so the circulation is $2\pi R^2$. Setting $2\pi R^2 = 18\pi$ gives $R^2 = 9$. Since $R > 0$, $R = 3$.'
          - problem: 'In a model of a storm, the wind velocity at $(x, y)$ is $\mathbf{v} = \langle -y,\; x \rangle$ metres per second, with distances in metres. Find the circulation of the wind around the circle of radius $10$ centered at the origin, traversed counterclockwise.'
            answer: '200pi'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'On the circle of radius $10$ the dot product $\mathbf{v} \cdot \mathbf{r}''$ equals $10^2 = 100$. So the circulation is $\int_0^{2\pi} 100\,dt = 200\pi$.'
        constraints: 'circles centered at the origin, counterclockwise or clockwise; the integrand collapses via sin^2 + cos^2 = 1'
      - id: kp3
        name: 'Work and orientation'
        key_prerequisites: [scalar-line-integrals, vector-fields, dot-product]
        try_first:
          problem: 'A constant force of $5$ newtons pushes a cart $4$ metres in the direction of the force. How much work, in joules, does the force do?'
          answer_contract: {"kind":"exact"}
          answer: '20'
          reveal: 'Work is force times distance when the force is constant and points along the motion. When the force changes or the path bends, we add up the work $\mathbf{F} \cdot d\mathbf{r}$ over each small step, and that sum is the line integral.'
        exemplars:
          - problem: 'Find the work done by the force field $\mathbf{F}(x, y) = \langle y,\; x \rangle$ on a particle moving along the straight segment from $(0, 0)$ to $(2, 3)$.'
            answer: '6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Parametrize by $\mathbf{r}(t) = \langle 2t, 3t \rangle$ for $0 \le t \le 1$. Then $\mathbf{F} \cdot \mathbf{r}'' = (3t)(2) + (2t)(3) = 12t$. The work is $\int_0^1 12t\,dt = 6$.'
          - problem: 'A force field does $7$ joules of work on a particle that moves along a curve $C$ from $A$ to $B$. How much work does it do on a particle that moves back along the same curve from $B$ to $A$?'
            answer: '-7'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Reversing the direction of travel changes the sign of $d\mathbf{r}$, while the field stays the same. So the work changes sign. The work on the way back is $-7$ joules.'
          - problem: 'Find the work done by $\mathbf{F}(x, y) = \langle 2x,\; y \rangle$ on a particle moving along the straight segment from $(1, 0)$ to $(3, 4)$.'
            answer: '16'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Parametrize by $x = 1 + 2t$, $y = 4t$ for $0 \le t \le 1$. Then $\mathbf{F} \cdot \mathbf{r}'' = 2(1 + 2t)(2) + (4t)(4) = 4 + 24t$. The work is $\int_0^1 (4 + 24t)\,dt = 16$.'
          - problem: 'A crate is pulled in a straight line from $(0, 0)$ to $(4, 3)$, with distances in metres, by the constant force $\mathbf{F} = \langle 3,\; 2 \rangle$ newtons. How much work, in joules, does the force do?'
            answer: '18'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'For a constant force the work is the dot product of the force and the displacement. The displacement is $\langle 4, 3 \rangle$, so the work is $(3)(4) + (2)(3) = 18$ joules.'
          - problem: 'Find the work done by $\mathbf{F}(x, y) = \langle -y,\; x \rangle$ on a particle moving counterclockwise along the quarter circle from $(1, 0)$ to $(0, 1)$.'
            answer: 'pi/2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Parametrize by $\mathbf{r}(t) = \langle \cos t, \sin t \rangle$ for $0 \le t \le \pi/2$. Then $\mathbf{F} \cdot \mathbf{r}'' = \sin^2 t + \cos^2 t = 1$. The work is $\int_0^{\pi/2} 1\,dt = \tfrac{\pi}{2}$.'
          - problem: 'Find the work done by $\mathbf{F}(x, y, z) = \langle z,\; x,\; y \rangle$ on a particle moving along the straight segment from $(0, 0, 0)$ to $(1, 2, 3)$.'
            answer: '11/2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Parametrize by $\mathbf{r}(t) = \langle t, 2t, 3t \rangle$ for $0 \le t \le 1$. Then $\mathbf{F} = \langle 3t, t, 2t \rangle$ and $\mathbf{r}'' = \langle 1, 2, 3 \rangle$, so $\mathbf{F} \cdot \mathbf{r}'' = 3t + 2t + 6t = 11t$. The work is $\tfrac{11}{2}$.'
          - problem: 'A particle goes once clockwise around the circle of radius $2$ centered at the origin, with distances in metres, in the force field $\mathbf{F} = \langle -y,\; x \rangle$ newtons. How much work, in joules, does the field do?'
            answer: '-8pi'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Going counterclockwise, the dot product $\mathbf{F} \cdot \mathbf{r}''$ is $4$ and the work is $8\pi$. Going clockwise reverses the direction, so the work is $-8\pi$ joules.'
          - problem: 'A constant force $\mathbf{F} = \langle 4,\; 3 \rangle$ newtons pushes a crate in the positive $x$-direction and does $40$ joules of work. How far does the crate move?'
            answer: '10'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'Moving a distance $d$ in the $x$-direction gives the displacement $\langle d, 0 \rangle$. The work is $\mathbf{F} \cdot \langle d, 0 \rangle = 4d$. Setting $4d = 40$ gives $d = 10$ metres.'
          - problem: 'Find the work done by $\mathbf{F} = \langle y,\; x \rangle$ on a particle moving along the straight segment from $(3, 4)$ to $(0, 0)$.'
            answer: '-12'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Along the segment from $(0, 0)$ to $(3, 4)$ the work is $12$. The particle travels from $(3, 4)$ to $(0, 0)$, so the sign flips and the work is $-12$.'
        constraints: 'work = line integral of F; always state orientation; sign-flip questions use given integer values; constant forces use the dot product'
    diagnostic_exemplar:
      problem: 'Evaluate $\oint_C \mathbf{F} \cdot d\mathbf{r}$ for $\mathbf{F} = \langle y, -x \rangle$ around the circle of radius $3$ centred at the origin, traversed counterclockwise.'
      answer: '$-18\pi$'
      solution_sketch: 'With $\mathbf{r}(t) = \langle 3\cos t, 3\sin t \rangle$: $\mathbf{F} = \langle 3\sin t, -3\cos t \rangle$ and $\mathbf{r}''(t) = \langle -3\sin t, 3\cos t \rangle$, so $\mathbf{F}\cdot\mathbf{r}'' = -9$ and the integral is $-9(2\pi) = -18\pi$.'
    anki_seeds:
      - front: 'How do you evaluate $\int_C \mathbf{F} \cdot d\mathbf{r}$ with a parametrization $\mathbf{r}(t)$, $a \le t \le b$?'
        back: '$\int_a^b \mathbf{F}(\mathbf{r}(t)) \cdot \mathbf{r}''(t)\, dt$'
        type: basic
      - front: 'What happens to $\int_C \mathbf{F} \cdot d\mathbf{r}$ when the orientation of $C$ is reversed?'
        back: 'It changes sign. (Scalar integrals $\int_C f\, ds$ do not.)'
        type: basic

  - id: line-integrals
    name: "Line Integrals: Differential Forms and Piecewise Paths"
    core: true
    difficulty: 0.78
    drill: false
    answer_kind: numeric
    expected_time_secs: 240
    prerequisites:
      - id: vector-line-integrals
        weight: 0.8
        key: true
      - id: scalar-line-integrals
        weight: 0.5
        key: true
      - id: arc-length-space-curves
        weight: 0.3
        key: false
    knowledge_points:
      - id: kp1
        name: 'Differential-form line integrals'
        key_prerequisites: [vector-line-integrals, scalar-line-integrals]
        exemplars:
          - problem: 'Evaluate $\int_C y^2\, dx + x\, dy$, where $C$ is the straight segment from $(0, 0)$ to $(1, 1)$.'
            answer: '5/6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Parametrize by $x = t$, $y = t$ for $0 \le t \le 1$, so $dx = dt$ and $dy = dt$. The integrand becomes $t^2\,dt + t\,dt$. So the integral is $\tfrac{1}{3} + \tfrac{1}{2} = \tfrac{5}{6}$.'
          - problem: 'Evaluate $\int_C y\, dx + x\, dy$ along $\mathbf{r}(t) = \langle t,\; t^2 \rangle$, $0 \le t \le 1$.'
            answer: '1'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Here $x = t$, $y = t^2$, $dx = dt$ and $dy = 2t\,dt$. The integrand is $t^2\,dt + t \cdot 2t\,dt = 3t^2\,dt$. So the integral is $\int_0^1 3t^2\,dt = 1$.'
          - problem: 'Evaluate $\int_C (2x + y)\, dx + x\, dy$, where $C$ is the straight segment from $(0, 0)$ to $(2, 1)$.'
            answer: '6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Parametrize by $x = 2t$, $y = t$, so $dx = 2\,dt$ and $dy = dt$. The integrand is $(5t)(2) + (2t)(1) = 12t$. So the integral is $\int_0^1 12t\,dt = 6$.'
          - problem: 'Evaluate $\int_C -y\, dx + x\, dy$, where $C$ is the parabola $y = x^2$ from $(0, 0)$ to $(1, 1)$.'
            answer: '1/3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Parametrize by $x = t$, $y = t^2$, so $dx = dt$ and $dy = 2t\,dt$. The integrand is $-t^2 + t \cdot 2t = t^2$. So the integral is $\int_0^1 t^2\,dt = \tfrac{1}{3}$.'
          - problem: 'Evaluate $\int_C (2x - y)\, dx + (x + y)\, dy$, where $C$ is the straight segment from $(0, 0)$ to $(1, 2)$.'
            answer: '3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Parametrize by $x = t$, $y = 2t$, so $dx = dt$ and $dy = 2\,dt$. The integrand is $(0)(1) + (3t)(2) = 6t$. So the integral is $\int_0^1 6t\,dt = 3$.'
          - problem: 'Evaluate $\int_C (3x + y)\, dx + (2x + y)\, dy$, where $C$ is the parabola $y = x^2$ from $(0, 0)$ to $(2, 4)$.'
            answer: '82/3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Parametrize by $x = t$, $y = t^2$ for $0 \le t \le 2$, so $dy = 2t\,dt$. The integrand is $(3t + t^2) + (2t + t^2)(2t) = 3t + 5t^2 + 2t^3$. So the integral is $6 + \tfrac{40}{3} + 8 = \tfrac{82}{3}$.'
          - problem: 'Evaluate $\int_C y\, dx$, where $C$ is the arc of the curve $y = \sqrt{x}$ from $(0, 0)$ to $(4, 2)$.'
            answer: '16/3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Parametrize by $x = t^2$, $y = t$ for $0 \le t \le 2$, so $dx = 2t\,dt$. The integrand is $t \cdot 2t = 2t^2$. So the integral is $\int_0^2 2t^2\,dt = \tfrac{16}{3}$.'
          - problem: 'Evaluate $\int_C x\, dy$, where $C$ is the line $y = 2x + 1$ from $(0, 1)$ to $(2, 5)$.'
            answer: '4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Parametrize by $x = t$, $y = 2t + 1$ for $0 \le t \le 2$, so $dy = 2\,dt$. The integrand is $t \cdot 2 = 2t$. So the integral is $\int_0^2 2t\,dt = 4$.'
          - problem: 'A bead moves along a straight wire from $(1, 0)$ to $(3, 2)$, with distances in metres. The force on it has horizontal component $y$ newtons and vertical component $2x$ newtons. How much work, in joules, does the force do?'
            answer: '10'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The work is $\int_C y\,dx + 2x\,dy$. Parametrize by $x = 1 + 2t$, $y = 2t$, so $dx = 2\,dt$ and $dy = 2\,dt$. The integrand is $(2t)(2) + 2(1 + 2t)(2) = 4 + 12t$, and the work is $4 + 6 = 10$ joules.'
          - problem: 'A particle moves along the parabola $y = x^2$ from $(0, 0)$ to $(1, 1)$, with distances in metres. The force on it has horizontal component $x^2$ newtons and vertical component $y$ newtons. How much work, in joules, does the force do?'
            answer: '5/6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The work is $\int_C x^2\,dx + y\,dy$. With $x = t$ and $y = t^2$ we have $dx = dt$ and $dy = 2t\,dt$. The integrand is $t^2 + 2t^3$, so the work is $\tfrac{1}{3} + \tfrac{1}{2} = \tfrac{5}{6}$ joules.'
          - problem: 'Evaluate $\int_C (x + y)\, dx$ along the straight segment from $(0, 0)$ to $(2, 4)$.'
            answer: '6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'When $x = 2t$, $dx = 2\,dt$. The integral is $\int_0^1 6t \cdot 2\,dt = 6$.'
        constraints: 'P dx + Q dy with polynomial P, Q; curves are segments, parabolas or arcs of simple graphs'
      - id: kp2
        name: 'Piecewise paths and path dependence'
        key_prerequisites: [vector-line-integrals]
        exemplars:
          - problem: 'Evaluate $\int_C y^2\, dx + x\, dy$, where $C$ is the path from $(0, 0)$ to $(1, 0)$ to $(1, 1)$.'
            answer: '1'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'On the first segment $y = 0$ and $dy = 0$, so the integrand is $0$. On the second segment $x = 1$ and $dx = 0$, so the integral is $\int_0^1 1\,dy = 1$. The total is $0 + 1 = 1$.'
          - problem: 'Is the value of $\int y^2\, dx + x\, dy$ from $(0, 0)$ to $(1, 1)$ the same along the path through $(1, 0)$ as along the straight segment?'
            answer: 'no'
            answer_contract: {"kind":"label","options":[["no","it does not","not the same","different"],["yes","it does","the same","same"]]}
            solution_sketch: 'Along the path through $(1, 0)$ the integral is $0 + 1 = 1$. Along the straight segment, with $x = y = t$, it is $\int_0^1 (t^2 + t)\,dt = \tfrac{5}{6}$. Since $1 \ne \tfrac{5}{6}$, the values differ.'
          - problem: 'Evaluate $\int_C (x + y)\, dx + (x - y)\, dy$, where $C$ is the path from $(0, 0)$ to $(0, 2)$ to $(3, 2)$ to $(4, 0)$.'
            answer: '8'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'On the segment $(0,0) \to (0,2)$ we have $dx = 0$ and the integral is $\int_0^2 (-y)\,dy = -2$. On $(0,2) \to (3,2)$ we have $dy = 0$ and the integral is $\int_0^3 (x + 2)\,dx = \tfrac{21}{2}$. On $(3,2) \to (4,0)$ the integrand is $3 - 7t$, giving $-\tfrac{1}{2}$. The total is $8$.'
          - problem: 'A particle is moved from $(0, 0)$ to $(2, 0)$ to $(2, 1)$ to $(3, 3)$, with distances in metres. The force on it has horizontal component $x + y$ newtons and vertical component $x - y$ newtons. How much work, in joules, does the force do along this path?'
            answer: '9'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Split the path into three segments. On $(0,0) \to (2,0)$ the integral is $\int_0^2 x\,dx = 2$. On $(2,0) \to (2,1)$ it is $\int_0^1 (2 - y)\,dy = \tfrac{3}{2}$. On $(2,1) \to (3,3)$ it is $\int_0^1 (5 + t)\,dt = \tfrac{11}{2}$, and the total is $9$ joules.'
          - problem: 'Evaluate $\int_C y\, dx + x\, dy$, where $C$ is the path from $(0, 0)$ to $(1, 0)$ to $(1, 1)$ to $(2, 2)$.'
            answer: '4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'On the first segment $y = 0$ and $dy = 0$, giving $0$. On the second segment $dx = 0$, giving $\int_0^1 1\,dy = 1$. On the third segment $x = y = 1 + t$, giving $\int_0^1 2(1 + t)\,dt = 3$. The total is $0 + 1 + 3 = 4$.'
          - problem: 'Evaluate $\int_C 2x\, dx + y\, dy$, where $C$ is the path from $(0, 0)$ to $(1, 0)$ to $(1, 2)$ to $(3, 4)$.'
            answer: '17'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'On $(0,0) \to (1,0)$ the integral is $\int_0^1 2x\,dx = 1$. On $(1,0) \to (1,2)$ it is $\int_0^2 y\,dy = 2$. On $(1,2) \to (3,4)$, with $x = 1 + 2t$ and $y = 2 + 2t$, the integrand is $2(1 + 2t)(2) + (2 + 2t)(2) = 8 + 12t$, giving $14$. The total is $1 + 2 + 14 = 17$.'
          - problem: 'Along the path from $(0, 0)$ to $(2, 0)$ to $(2, 2)$ the integral $\int y\, dx + x\, dy$ equals $4$. Is its value along the straight segment from $(0, 0)$ to $(2, 2)$ the same?'
            answer: 'yes'
            answer_contract: {"kind":"label","options":[["no","it does not","not the same","different"],["yes","it does","the same","same"]]}
            solution_sketch: 'Along the straight segment $x = y = 2t$, so $dx = dy = 2\,dt$. The integrand is $(2t)(2) + (2t)(2) = 8t$, and $\int_0^1 8t\,dt = 4$. Both paths give $4$, so the values are the same.'
          - problem: 'Evaluate $\oint_C y\, dx$, where $C$ is the boundary of the rectangle with vertices $(0, 0)$, $(3, 0)$, $(3, 2)$ and $(0, 2)$, traversed counterclockwise.'
            answer: '-6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'On the bottom edge $y = 0$, so the integral is $0$. On the two vertical edges $dx = 0$, so they give $0$. On the top edge $y = 2$ and $x$ runs from $3$ to $0$, so the integral is $\int_3^0 2\,dx = -6$.'
          - problem: 'Evaluate $\oint_C x\, dy - y\, dx$, where $C$ is the triangle with vertices $(0, 0)$, $(1, 0)$ and $(0, 1)$, traversed counterclockwise.'
            answer: '1'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'On $(0,0) \to (1,0)$ both $y$ and $dy$ are $0$, giving $0$. On $(1,0) \to (0,1)$ with $x = 1 - t$, $y = t$ the integrand is $(1 - t) + t = 1$, giving $1$. On $(0,1) \to (0,0)$ both $x$ and $dx$ are $0$, giving $0$. The total is $1$.'
          - problem: 'A hiker walks from $(0, 0)$ to $(3, 0)$ to $(3, 2)$ to $(1, 4)$, with distances in metres. The force on the hiker has horizontal component $2x$ newtons and vertical component $3y$ newtons. How much work, in joules, does the force do along this walk?'
            answer: '25'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'On $(0,0) \to (3,0)$ the work is $\int_0^3 2x\,dx = 9$. On $(3,0) \to (3,2)$ it is $\int_0^2 3y\,dy = 6$. On $(3,2) \to (1,4)$ the work is $\left[x^2 + \tfrac{3}{2}y^2\right]$ from $(3,2)$ to $(1,4)$, which is $25 - 15 = 10$. The total is $9 + 6 + 10 = 25$ joules.'
        constraints: 'paths of 2-3 segments parallel to axes plus one slanted edge; each piece contributes a one-line integral; closed rectangles and triangles'
      - id: kp3
        name: 'Three-dimensional and closed-curve capstones'
        key_prerequisites: [vector-line-integrals, scalar-line-integrals]
        exemplars:
          - problem: 'Evaluate $\int_C \mathbf{F} \cdot d\mathbf{r}$ for $\mathbf{F} = \langle y,\; x,\; z \rangle$ along $\mathbf{r}(t) = \langle t,\; t,\; t^2 \rangle$, $0 \le t \le 1$.'
            answer: '3/2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'On the curve $\mathbf{F} = \langle t, t, t^2 \rangle$ and $\mathbf{r}'' = \langle 1, 1, 2t \rangle$. The dot product is $t + t + 2t^3$. So the integral is $\int_0^1 (2t + 2t^3)\,dt = 1 + \tfrac{1}{2} = \tfrac{3}{2}$.'
          - problem: 'Evaluate $\oint_C x^2\, dy$, where $C$ is the boundary of the unit square with vertices $(0, 0)$, $(1, 0)$, $(1, 1)$ and $(0, 1)$, traversed counterclockwise.'
            answer: '1'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'On the two horizontal edges $dy = 0$, so they give $0$. On the left edge $x = 0$, so it gives $0$. On the right edge $x = 1$ and $y$ runs from $0$ to $1$, so the integral is $\int_0^1 1\,dy = 1$.'
          - problem: 'Evaluate $\int_C (x\, dy - y\, dx)$ along $\mathbf{r}(t) = \langle t,\; t^2,\; t^3 \rangle$, $0 \le t \le 1$.'
            answer: '1/3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The $z$-coordinate does not appear in the integrand. With $x = t$, $y = t^2$ we have $dx = dt$ and $dy = 2t\,dt$. The integrand is $2t^2 - t^2 = t^2$, so the integral is $\tfrac{1}{3}$.'
          - problem: 'Evaluate $\oint_C (x\, dy - y\, dx)$, where $C$ is the triangle with vertices $(0, 0)$, $(2, 0)$ and $(0, 2)$, traversed counterclockwise.'
            answer: '4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'On the edges along the axes the integrand is $0$, since either $(x, dx)$ or $(y, dy)$ vanish. On $(2,0) \to (0,2)$ with $x = 2 - 2t$, $y = 2t$ the integrand is $(2 - 2t)(2) + (2t)(2) = 4$. So the integral is $\int_0^1 4\,dt = 4$.'
          - problem: 'Evaluate $\int_C (x\, dy - y\, dx)$ along $\mathbf{r}(t) = \langle t^2,\; t,\; t^3 \rangle$, $0 \le t \le 1$.'
            answer: '-1/3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'With $x = t^2$, $y = t$ we have $dx = 2t\,dt$ and $dy = dt$. The integrand is $t^2 - t \cdot 2t = -t^2$. So the integral is $-\tfrac{1}{3}$.'
          - problem: 'Evaluate $\oint_C (x\, dy - y\, dx)$, where $C$ is the square with vertices $(0, 0)$, $(2, 0)$, $(2, 2)$ and $(0, 2)$, traversed counterclockwise.'
            answer: '8'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'On the bottom and left edges the integrand is $0$. On the right edge $x = 2$ and $dx = 0$, giving $\int_0^2 2\,dy = 4$. On the top edge $y = 2$ and $dy = 0$, giving $\int_2^0 (-2)\,dx = 4$. The total is $8$.'
          - problem: 'The area enclosed by a simple closed curve $C$ traversed counterclockwise is $\tfrac{1}{2}\oint_C (x\, dy - y\, dx)$. Use this to find the area of the triangle with vertices $(0, 0)$, $(4, 0)$ and $(0, 3)$.'
            answer: '6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'On the two edges along the axes the integrand is $0$. On $(4,0) \to (0,3)$ with $x = 4 - 4t$, $y = 3t$ the integrand is $(4 - 4t)(3) + (3t)(4) = 12$, giving $12$. The area is half of this, $\tfrac{1}{2}(12) = 6$.'
          - problem: 'Use the area formula $\tfrac{1}{2}\oint_C (x\, dy - y\, dx)$ to find the area enclosed by the ellipse $x = 3\cos t$, $y = 2\sin t$, $0 \le t \le 2\pi$.'
            answer: '6pi'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Here $x\,dy - y\,dx = (3\cos t)(2\cos t) + (2\sin t)(3\sin t) = 6$ times $dt$. So the integral around the ellipse is $\int_0^{2\pi} 6\,dt = 12\pi$. The area is half of this, $6\pi$.'
          - problem: 'A fly moves along the curve $\mathbf{r}(t) = \langle t,\; t^2,\; t^3 \rangle$, $0 \le t \le 1$, with distances in metres, in the force field $\mathbf{F} = \langle y,\; z,\; x \rangle$ newtons. How much work, in joules, does the field do?'
            answer: '89/60'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'On the curve $\mathbf{F} = \langle t^2, t^3, t \rangle$ and $\mathbf{r}'' = \langle 1, 2t, 3t^2 \rangle$. The dot product is $t^2 + 2t^4 + 3t^3$. So the work is $\tfrac{1}{3} + \tfrac{2}{5} + \tfrac{3}{4} = \tfrac{89}{60}$ joules.'
          - problem: 'What is the value of $\oint_C (x\, dy - y\, dx)$ for the counterclockwise circle of radius $2$ centered at the origin?'
            answer: '8pi'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'A closed curve does not force the integral to be zero. On the circle $x = 2\cos t$, $y = 2\sin t$ the integrand is $4\cos^2 t + 4\sin^2 t = 4$. So the integral is $\int_0^{2\pi} 4\,dt = 8\pi$.'
        constraints: '3D curves polynomial in t; closed squares, triangles and ellipses traversed counterclockwise; answers small rationals or multiples of pi'
    diagnostic_exemplar:
      problem: 'Evaluate $\oint_C x^2\,dy - y\,dx$ counterclockwise around the triangle with vertices $(0,0)$, $(1,0)$, $(0,1)$.'
      answer: '$\dfrac{5}{6}$'
      answer_contract: {kind: none}
      solution_sketch: 'On $(0,0) \to (1,0)$: $y = 0$, $dy = 0$, contribution $0$. On $(1,0) \to (0,1)$, with $x = 1-t$, $y = t$: the integrand is $\left[(1-t)^2 + t\right]dt$, giving $\tfrac{1}{3} + \tfrac{1}{2} = \tfrac{5}{6}$. On $(0,1) \to (0,0)$: $x = 0$, $dx = 0$, contribution $0$.'
    anki_seeds:
      - front: 'How does $\int_C P\, dx + Q\, dy$ relate to a vector line integral?'
        back: 'It equals $\int_C \mathbf{F} \cdot d\mathbf{r}$ for $\mathbf{F} = \langle P, Q \rangle$.'
        type: basic
      - front: 'Does the value of $\int_C \mathbf{F} \cdot d\mathbf{r}$ depend only on the endpoints of $C$?'
        back: 'In general no — only for conservative fields is the integral path-independent.'
        type: basic

  - id: conservative-fields-potential-functions
    name: "Conservative Fields and Potential Functions"
    core: true
    difficulty: 0.80
    drill: false
    answer_kind: numeric
    expected_time_secs: 240
    prerequisites:
      - id: line-integrals
        weight: 0.8
        key: true
      - id: gradient-directional-derivatives
        weight: 0.6
        key: true
    knowledge_points:
      - id: kp1
        name: "Testing for conservativity"
        key_prerequisites: [line-integrals, gradient-directional-derivatives]
        exemplars:
          - problem: 'Is the field $\mathbf{F}=\langle 6xy^2,\;6x^2y+5\rangle$ conservative on $\mathbb{R}^2$?'
            answer: 'yes'
            answer_contract: {"kind": "label", "options": [["yes", "it is conservative", "conservative", "the field is conservative"], ["no", "it is not conservative", "not conservative", "nonconservative", "the field is not conservative"]]}
            solution_sketch: 'Take $P=6xy^2$ and $Q=6x^2y+5$. Then $P_y=12xy$ and $Q_x=12xy$, so the two partial derivatives are equal. The components are polynomials on all of $\mathbb{R}^2$, so $\mathbf{F}$ is conservative.'
          - problem: 'For $\mathbf{F}=\langle P,Q\rangle=\langle x^2y+3x,\;2xy^2+4y\rangle$, compute $P_y-Q_x$.'
            answer: 'x^2 - 2y^2'
            answer_contract: {"kind": "function", "vars": ["x", "y"]}
            solution_sketch: 'Here $P_y=x^2$ and $Q_x=2y^2$. So $P_y-Q_x=x^2-2y^2$, which is not zero, and this field is not conservative.'
          - problem: 'For which value of $k$ is $\mathbf{F}=\langle 2xy+3,\;kx^2+y\rangle$ conservative?'
            answer: '1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The test is $P_y=Q_x$. Here $P_y=2x$ and $Q_x=2kx$, so $2x=2kx$ for all $x$, which forces $k=1$.'
          - problem: 'A force field $\mathbf{F}=\langle 5x^2y,\;3xy^2\rangle$ newtons acts on a bead in the plane. Is the work done on the bead the same along every path between two given points?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "it is the same", "the same", "path independent", "it is path independent"], ["no", "it is not the same", "not the same", "it depends on the path", "the work depends on the path", "path dependent", "it is path dependent", "not path independent"]]}
            solution_sketch: 'The work is path independent only if $\mathbf{F}$ is conservative, so test $P_y=Q_x$. Here $P_y=5x^2$ and $Q_x=3y^2$, which differ, so the work depends on the path.'
          - problem: 'A force field acts on a bead in the plane: $\mathbf{F}=\langle ay+x^2,\;4x+3y^2\rangle$, where $a$ is a constant. The work done in moving the bead between two points does not depend on the path. Find $a$.'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Path independence means $\mathbf{F}$ is conservative, so $P_y=Q_x$. Here $P_y=a$ and $Q_x=4$, so $a=4$.'
          - problem: 'Find $P_y-Q_x$ for $\mathbf{F}=\langle P,Q\rangle=\langle 4x^3+y,\;2x+5y^4\rangle$.'
            answer: '-1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Here $P_y=1$ and $Q_x=2$ at every point. So $P_y-Q_x=1-2=-1$.'
          - problem: 'What does the test $P_y-Q_x$ give for the field $\mathbf{F}=\langle 2xy,\;x^2+y\rangle$?'
            answer: '0'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The correct test compares $P_y$ with $Q_x$. Here $P_y=2x$ and $Q_x=2x$, so $P_y-Q_x=0$ and the field is in fact conservative.'
        constraints: "fields polynomial on all of R^2 (simply connected, so P_y = Q_x is decisive); items ask for a verdict, for P_y - Q_x, or for the parameter that makes a field conservative"
      - id: kp2
        name: "Finding potential functions"
        key_prerequisites: [line-integrals, gradient-directional-derivatives]
        try_first:
          problem: 'A function $f(x,y)$ satisfies $f_x=2xy$, $f_y=x^2$ and $f(0,0)=0$. What is $f(1,3)$?'
          answer_contract: {"kind": "exact"}
          answer: '3'
          reveal: 'Integrating $f_x=2xy$ in $x$ gives $x^2y$ plus a function of $y$, and $f_y=x^2$ shows that this function is constant, so $f=x^2y$ and $f(1,3)=3$. Finding $f$ from its partial derivatives is exactly what a potential function does.'
        exemplars:
          - problem: 'Find a potential function for $\mathbf{F}=\langle 2xy,\;x^2+3y^2\rangle$.'
            answer: 'x^2*y + y^3'
            answer_contract: {"kind": "function", "vars": ["x", "y"], "up_to_constant": true}
            solution_sketch: 'We need $f_x=2xy$ and $f_y=x^2+3y^2$. Integrating $f_x$ in $x$ gives $f=x^2y+g(y)$, and then $f_y=x^2+g''(y)$ must equal $x^2+3y^2$, so $g''(y)=3y^2$ and $g=y^3$. Hence $f=x^2y+y^3$.'
          - problem: 'Find a potential function for $\mathbf{F}=\langle 3e^y,\;3xe^y\rangle$.'
            answer: '3*x*e^y'
            answer_contract: {"kind": "function", "vars": ["x", "y"], "up_to_constant": true}
            solution_sketch: 'Integrating $f_x=3e^y$ in $x$ gives $f=3xe^y+g(y)$. Then $f_y=3xe^y+g''(y)$ already equals $3xe^y$, so $g''(y)=0$ and $f=3xe^y$.'
          - problem: 'The velocity field of water flowing in a thin sheet is $\mathbf{v}=\langle 2x+y,\;x+2y\rangle$ metres per second. Find a velocity potential, that is, a function $\varphi(x,y)$ with $\nabla\varphi=\mathbf{v}$.'
            answer: 'x^2 + x*y + y^2'
            answer_contract: {"kind": "function", "vars": ["x", "y"], "up_to_constant": true}
            solution_sketch: 'Integrating $\varphi_x=2x+y$ in $x$ gives $\varphi=x^2+xy+g(y)$. Then $\varphi_y=x+g''(y)$ must equal $x+2y$, so $g''(y)=2y$ and $g=y^2$. Hence $\varphi=x^2+xy+y^2$.'
          - problem: 'Find a potential function for $\mathbf{F}=\langle 2x\sin y,\;x^2\cos y+1\rangle$.'
            answer: 'x^2*sin(y) + y'
            answer_contract: {"kind": "function", "vars": ["x", "y"], "up_to_constant": true}
            solution_sketch: 'Integrating $f_x=2x\sin y$ in $x$ gives $f=x^2\sin y+g(y)$. Then $f_y=x^2\cos y+g''(y)$ must equal $x^2\cos y+1$, so $g''(y)=1$ and $g=y$. Hence $f=x^2\sin y+y$.'
          - problem: 'A particle in the plane feels the force $\mathbf{F}=\langle 2xy^3,\;3x^2y^2\rangle$ newtons. Find a function $f$ with $\nabla f=\mathbf{F}$; the work done between two points is then the change in $f$.'
            answer: 'x^2*y^3'
            answer_contract: {"kind": "function", "vars": ["x", "y"], "up_to_constant": true}
            solution_sketch: 'Integrating $f_x=2xy^3$ in $x$ gives $f=x^2y^3+g(y)$. Then $f_y=3x^2y^2+g''(y)$ already equals $3x^2y^2$, so $g''(y)=0$ and $f=x^2y^3$.'
          - problem: 'Find a potential function for $\mathbf{F}=\langle 4x+3y,\;3x+6y\rangle$.'
            answer: '2x^2 + 3xy + 3y^2'
            answer_contract: {"kind": "function", "vars": ["x", "y"], "up_to_constant": true}
            solution_sketch: 'Integrating $f_x=4x+3y$ in $x$ gives $f=2x^2+3xy+g(y)$. Then $f_y=3x+g''(y)$ must equal $3x+6y$, so $g''(y)=6y$ and $g=3y^2$. Hence $f=2x^2+3xy+3y^2$.'
          - problem: 'Find a potential function for $\mathbf{F}=\langle 2xe^y,\;x^2e^y\rangle$.'
            answer: 'x^2*e^y'
            answer_contract: {"kind": "function", "vars": ["x", "y"], "up_to_constant": true}
            solution_sketch: 'Integrating $f_x=2xe^y$ in $x$ gives $f=x^2e^y+g(y)$. Then $f_y=x^2e^y+g''(y)$ already equals $x^2e^y$, so $g''(y)=0$ and $f=x^2e^y$.'
        constraints: "potentials are polynomials, products with e^y, or x^2 sin y type terms; verify by re-differentiating"
      - id: kp3
        name: "Harder potentials"
        key_prerequisites: [line-integrals, gradient-directional-derivatives]
        exemplars:
          - problem: 'Find a potential function for $\mathbf{F}=\langle 2xy+y^3,\;x^2+3xy^2\rangle$.'
            answer: 'x^2*y + x*y^3'
            answer_contract: {"kind": "function", "vars": ["x", "y"], "up_to_constant": true}
            solution_sketch: 'First, $P_y=2x+3y^2$ and $Q_x=2x+3y^2$, so $\mathbf{F}$ is conservative. Integrating $f_x=2xy+y^3$ in $x$ gives $f=x^2y+xy^3+g(y)$, and $f_y=x^2+3xy^2+g''(y)$ matches $Q$ when $g''(y)=0$. Hence $f=x^2y+xy^3$.'
          - problem: 'Find a potential function for $\mathbf{F}=\langle 3x^2+2xy,\;x^2+2y\rangle$.'
            answer: 'x^3 + x^2*y + y^2'
            answer_contract: {"kind": "function", "vars": ["x", "y"], "up_to_constant": true}
            solution_sketch: 'Here $P_y=2x=Q_x$, so a potential exists. Integrating $f_x=3x^2+2xy$ in $x$ gives $f=x^3+x^2y+g(y)$, and $f_y=x^2+g''(y)$ must equal $x^2+2y$, so $g=y^2$. Hence $f=x^3+x^2y+y^2$.'
          - problem: 'The slope of a hillside is described by the gradient field $\nabla h=\langle 2xy^2+3x^2,\;2x^2y+2y\rangle$, where $h(x,y)$ is the height in metres. Find a possible height function $h$.'
            answer: 'x^2*y^2 + x^3 + y^2'
            answer_contract: {"kind": "function", "vars": ["x", "y"], "up_to_constant": true}
            solution_sketch: 'Integrating $h_x=2xy^2+3x^2$ in $x$ gives $h=x^2y^2+x^3+g(y)$. Then $h_y=2x^2y+g''(y)$ must equal $2x^2y+2y$, so $g''(y)=2y$ and $g=y^2$. Hence $h=x^2y^2+x^3+y^2$.'
          - problem: 'Does the field $\mathbf{F}=\langle 2y^2+x,\;3xy+y\rangle$ have a potential function on the plane?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "it has one", "a potential exists", "there is one"], ["no", "it has none", "no potential exists", "there is none", "it has no potential function"]]}
            solution_sketch: 'A potential exists only if $P_y=Q_x$. Here $P_y=4y$ and $Q_x=3y$, which differ, so $\mathbf{F}$ is not conservative and has no potential function.'
          - problem: 'The conservative field $\mathbf{F}=\langle 2xyz,\;x^2z+3y^2,\;x^2y+2z\rangle$ acts in space. Find a potential function $f(x,y,z)$.'
            answer: 'x^2*y*z + y^3 + z^2'
            answer_contract: {"kind": "function", "vars": ["x", "y", "z"], "up_to_constant": true}
            solution_sketch: 'Integrating $f_x=2xyz$ in $x$ gives $f=x^2yz+g(y,z)$. Then $f_y=x^2z+g_y$ must equal $x^2z+3y^2$, so $g=y^3+h(z)$, and $f_z=x^2y+h''(z)$ must equal $x^2y+2z$, so $h=z^2$. Hence $f=x^2yz+y^3+z^2$.'
          - problem: 'The field $\mathbf{F}=\langle 3x^2y+2xy^2,\;x^3+2x^2y\rangle$ is conservative. Find the potential function $f$ that satisfies $f(0,0)=5$.'
            answer: 'x^3*y + x^2*y^2 + 5'
            answer_contract: {"kind": "function", "vars": ["x", "y"]}
            solution_sketch: 'Integrating $f_x=3x^2y+2xy^2$ in $x$ gives $f=x^3y+x^2y^2+g(y)$, and $f_y=x^3+2x^2y+g''(y)$ already equals $Q$, so $g$ is a constant. Then $f(0,0)=5$ gives $g=5$, so $f=x^3y+x^2y^2+5$.'
          - problem: 'A particle moves in the force field $\mathbf{F}=\langle y^3+2xy+3x^2,\;3xy^2+x^2\rangle$ newtons. Find a function $f$ with $\nabla f=\mathbf{F}$.'
            answer: 'x*y^3 + x^2*y + x^3'
            answer_contract: {"kind": "function", "vars": ["x", "y"], "up_to_constant": true}
            solution_sketch: 'Integrating $f_x=y^3+2xy+3x^2$ in $x$ gives $f=xy^3+x^2y+x^3+g(y)$. Then $f_y=3xy^2+x^2+g''(y)$ already equals $Q$, so $g''(y)=0$ and $f=xy^3+x^2y+x^3$.'
          - problem: 'Find a potential function for $\mathbf{F}=\langle e^x\sin y+2x,\;e^x\cos y+3y^2\rangle$.'
            answer: 'e^x*sin(y) + x^2 + y^3'
            answer_contract: {"kind": "function", "vars": ["x", "y"], "up_to_constant": true}
            solution_sketch: 'Integrating $f_x=e^x\sin y+2x$ in $x$ gives $f=e^x\sin y+x^2+g(y)$. Then $f_y=e^x\cos y+g''(y)$ must equal $e^x\cos y+3y^2$, so $g''(y)=3y^2$ and $g=y^3$. Hence $f=e^x\sin y+x^2+y^3$.'
        constraints: "polynomial fields and fields with e^x sin y terms; a potential exists only if P_y = Q_x, so one item asks for the verdict first; one item pins the constant with f(0, 0) = 5"
    diagnostic_exemplar:
      problem: 'Show that $\mathbf{F} = \langle 3x^2 + 2xy^3,\; 3x^2y^2 + 4y \rangle$ is conservative and find a potential function.'
      answer: '$P_y = 6xy^2 = Q_x$, so $\mathbf{F}$ is conservative; $f(x, y) = x^3 + x^2y^3 + 2y^2$ (plus any constant).'
      answer_contract: {kind: none}
      solution_sketch: 'Integrating $P$ in $x$: $f = x^3 + x^2y^3 + g(y)$. Then $f_y = 3x^2y^2 + g''(y) = 3x^2y^2 + 4y$ forces $g''(y) = 4y$, so $g(y) = 2y^2$.'
    anki_seeds:
      - front: 'Component test for a conservative field $\mathbf{F} = \langle P, Q \rangle$ on a simply connected domain?'
        back: '$\dfrac{\partial P}{\partial y} = \dfrac{\partial Q}{\partial x}$'
        type: basic
      - front: 'What does it mean for $\mathbf{F}$ to be conservative?'
        back: '$\mathbf{F} = \nabla f$ for some potential function $f$.'
        type: basic

  - id: fundamental-theorem-line-integrals
    name: "The Fundamental Theorem for Line Integrals"
    core: false                # stated theorem; feeds only conservative-fields-3d
    difficulty: 0.81
    drill: false
    answer_kind: numeric
    expected_time_secs: 180
    prerequisites:
      - id: conservative-fields-potential-functions
        weight: 0.8
        key: true
      - id: vector-line-integrals
        weight: 0.4
        key: false
    knowledge_points:
      - id: kp1
        name: "Applying the theorem"
        key_prerequisites: [conservative-fields-potential-functions, vector-line-integrals]
        try_first:
          problem: 'Let $f(x,y)=x+y$. Evaluate $\int_C\nabla f\cdot d\mathbf{r}$ along the straight segment $C$ from $(0,0)$ to $(2,3)$, using $\mathbf{r}(t)=\langle 2t,3t\rangle$ for $0\le t\le 1$.'
          answer_contract: {"kind": "exact"}
          answer: '5'
          reveal: 'Here $\nabla f=\langle 1,1\rangle$ and $\mathbf{r}''(t)=\langle 2,3\rangle$, so the integrand is $5$ and the integral is $5$. This equals $f(2,3)-f(0,0)=5-0$, and every other path between these two points gives the same value.'
        exemplars:
          - problem: 'Evaluate $\int_C\nabla f\cdot d\mathbf{r}$, where $f(x,y)=x^2y$ and $C$ is any curve from $(1,1)$ to $(2,3)$.'
            answer: '11'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Because the integrand is $\nabla f$, only the endpoints matter. We have $f(2,3)=4\cdot 3=12$ and $f(1,1)=1$, so the integral is $12-1=11$.'
          - problem: 'A conservative force field $\mathbf{F}$ moves a particle once around a closed loop and back to its starting point. How much work does $\mathbf{F}$ do?'
            answer: '0'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'For a conservative field the work equals $f(\text{end})-f(\text{start})$ for a potential $f$. On a closed loop the end point is the start point, so the work is $0$.'
          - problem: 'Let $f(x,y)=xy+y^2$. Find the value of $\int_C\nabla f\cdot d\mathbf{r}$ for any curve $C$ from $(1,2)$ to $(3,1)$.'
            answer: '-2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'By the Fundamental Theorem the integral is the change of $f$ from start to end. Here $f(3,1)=3+1=4$ and $f(1,2)=2+4=6$, so the integral is $4-6=-2$.'
          - problem: 'A particle moves under the force $\mathbf{F}=-\nabla U$, where $U(x,y)=3x+y^2$ joules is its potential energy and $x,y$ are in metres. How much work, in joules, does $\mathbf{F}$ do as the particle moves along any path from $(0,0)$ to $(2,3)$?'
            answer: '-15'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The work is $\int_C-\nabla U\cdot d\mathbf{r}=-\bigl(U(2,3)-U(0,0)\bigr)$. Here $U(2,3)=6+9=15$ and $U(0,0)=0$, so the work is $-15$ joules.'
          - problem: 'A conservative force moves a crate from A to B along a curved path and does $12$ J of work. How much work does the same force do when the crate is moved from B back to A along a straight line?'
            answer: '-12'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The work depends only on the end points, and reversing the direction swaps start and end. So the work from B to A is the negative of the work from A to B, which is $-12$ J.'
          - problem: 'Let $f(x,y,z)=x^2+y^2+z^2$. Evaluate $\int_C\nabla f\cdot d\mathbf{r}$ along any curve $C$ from $(1,0,2)$ to $(2,1,1)$.'
            answer: '1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The integral is $f(2,1,1)-f(1,0,2)$. Here $f(2,1,1)=4+1+1=6$ and $f(1,0,2)=1+0+4=5$, so the integral is $6-5=1$.'
          - problem: 'Evaluate $\int_C\nabla f\cdot d\mathbf{r}$ for $f(x,y)=xe^y$ and any curve $C$ from $(1,0)$ to $(3,\ln 2)$.'
            answer: '5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The integral is $f(3,\ln 2)-f(1,0)$. Here $f(3,\ln 2)=3e^{\ln 2}=6$ and $f(1,0)=1$, so the integral is $6-1=5$.'
        constraints: "endpoints at small integer points; potential values exact numbers; includes closed loops, reversed paths and F = -grad U"
      - id: kp2
        name: "Find the potential, then evaluate"
        key_prerequisites: [conservative-fields-potential-functions, vector-line-integrals]
        exemplars:
          - problem: 'Evaluate $\int_C\mathbf{F}\cdot d\mathbf{r}$ for $\mathbf{F}=\langle 2x+y,\;x\rangle$, where $C$ is any path from $(0,0)$ to $(2,3)$.'
            answer: '10'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Here $P_y=1=Q_x$, so $\mathbf{F}$ is conservative. A potential is $f=x^2+xy$, since $f_x=2x+y$ and $f_y=x$. The integral is $f(2,3)-f(0,0)=4+6-0=10$.'
          - problem: 'The force on a bead is $\mathbf{F}=\langle y^2,\;2xy\rangle$ newtons, with $x,y$ in metres. Find the work done, in joules, as the bead moves along any path from $(1,2)$ to $(3,1)$.'
            answer: '-1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Here $P_y=2y=Q_x$, so $\mathbf{F}$ is conservative with potential $f=xy^2$. The work is $f(3,1)-f(1,2)=3-4=-1$ joule.'
          - problem: 'Let $\mathbf{F}=\langle 3x^2+2y,\;2x\rangle$. Find the value of $\int_C\mathbf{F}\cdot d\mathbf{r}$ along any path from $(0,0)$ to $(2,1)$.'
            answer: '12'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Here $P_y=2=Q_x$, so a potential exists. Integrating $f_x=3x^2+2y$ gives $f=x^3+2xy$, which also has $f_y=2x$. The integral is $f(2,1)-f(0,0)=8+4-0=12$.'
          - problem: 'Let $\mathbf{F}=\langle 2x+3y^2,\;6xy\rangle$. Evaluate $\int_C\mathbf{F}\cdot d\mathbf{r}$ along any path from $(1,1)$ to $(2,3)$.'
            answer: '54'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Here $P_y=6y$ and $Q_x=6y$, so $\mathbf{F}$ is conservative. A potential is $f=x^2+3xy^2$. Then $f(2,3)=4+54=58$ and $f(1,1)=4$, so the integral is $58-4=54$.'
          - problem: 'A sled is pulled across frozen ground by the force $\mathbf{F}=\langle 2x+y,\;x+2y\rangle$ newtons, with $x,y$ in metres. Find the work done, in joules, as the sled moves along any path from $(0,0)$ to $(3,4)$.'
            answer: '37'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Here $P_y=1=Q_x$, so $\mathbf{F}$ is conservative with potential $f=x^2+xy+y^2$. The work is $f(3,4)-f(0,0)=9+12+16=37$ joules.'
          - problem: 'The field $\mathbf{F}=\langle -y,\;x\rangle$ has $\int_C\mathbf{F}\cdot d\mathbf{r}=0$ along the straight segment $C$ from $(0,0)$ to $(1,1)$. Is the integral also $0$ along the parabola $y=x^2$ from $(0,0)$ to $(1,1)$?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "it is also 0", "also 0", "it is 0", "it is zero", "also zero"], ["no", "it is not 0", "not 0", "it is not", "it is 1/3", "1/3"]]}
            solution_sketch: 'Along $y=x^2$ take $\mathbf{r}(t)=\langle t,t^2\rangle$, so $\mathbf{F}\cdot\mathbf{r}''=-t^2+2t^2=t^2$ and the integral is $\int_0^1t^2\,dt=\tfrac13$. This is not $0$, so $\mathbf{F}$ is not conservative and the integral depends on the path.'
          - problem: 'Evaluate $\int_C\mathbf{F}\cdot d\mathbf{r}$ for $\mathbf{F}=\langle e^y,\;xe^y\rangle$ along any path from $(1,0)$ to $(2,\ln 2)$.'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Here $P_y=e^y=Q_x$, so a potential exists, and $f=xe^y$ has $f_x=e^y$ and $f_y=xe^y$. The integral is $f(2,\ln 2)-f(1,0)=4-1=3$.'
          - problem: 'Evaluate $\int_C\mathbf{F}\cdot d\mathbf{r}$ for $\mathbf{F}=\langle y\cos(xy),\;x\cos(xy)\rangle$ along any path from $(0,0)$ to $\left(\frac{\pi}{2},1\right)$.'
            answer: '1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A potential is $f=\sin(xy)$, because $f_x=y\cos(xy)$ and $f_y=x\cos(xy)$. The integral is $f\left(\frac{\pi}{2},1\right)-f(0,0)=\sin\frac{\pi}{2}-0=1$.'
          - problem: 'Evaluate $\int_C\mathbf{F}\cdot d\mathbf{r}$ for $\mathbf{F}=\langle 2xy^3,\;3x^2y^2\rangle$ along any path from $(1,1)$ to $(2,2)$.'
            answer: '31'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Here $P_y=6xy^2=Q_x$, so $\mathbf{F}$ is conservative with potential $f=x^2y^3$. Then $f(2,2)=4\cdot 8=32$ and $f(1,1)=1$, so the integral is $32-1=31$.'
        constraints: "field given without its potential, or as a force field in context; endpoints chosen so f evaluates to exact values; one item shows a non-conservative field whose integral depends on the path"
    diagnostic_exemplar:
      problem: 'Evaluate $\int_C \mathbf{F} \cdot d\mathbf{r}$ for $\mathbf{F} = \langle 2xy,\; x^2 + 3y^2 \rangle$ along any path from $(0, 0)$ to $(2, 1)$.'
      answer: '$5$'
      solution_sketch: '$P_y = 2x = Q_x$, so $\mathbf{F}$ is conservative with potential $f(x,y) = x^2 y + y^3$. By the fundamental theorem the integral is $f(2,1) - f(0,0) = 5 - 0 = 5$.'
    anki_seeds:
      - front: 'Fundamental theorem for line integrals?'
        back: '$\int_C \nabla f \cdot d\mathbf{r} = f(\mathbf{r}(b)) - f(\mathbf{r}(a))$ — path-independent, zero on closed curves.'
        type: basic
      - front: 'Equivalent conditions for a continuous field $\mathbf{F}$ on an open connected domain?'
        back: '$\mathbf{F}$ conservative $\iff$ line integrals are path-independent $\iff$ $\oint_C \mathbf{F}\cdot d\mathbf{r} = 0$ for every closed curve.'
        type: basic

  - id: computing-div-curl
    name: "Computing Divergence and Curl"
    core: true
    difficulty: 0.78
    drill: false
    answer_kind: expression
    expected_time_secs: 150
    prerequisites:
      - id: vector-fields
        weight: 0.7
        key: true
      - id: cross-product
        weight: 0.6
        key: true
      - id: partial-derivatives
        weight: 0.5
        key: false
    knowledge_points:
      - id: kp1
        name: "Divergence"
        key_prerequisites: [vector-fields, partial-derivatives]
        exemplars:
          - problem: 'Compute $\operatorname{div}\mathbf{F}$ for $\mathbf{F}=\langle x^2,\;xy,\;z^2\rangle$.'
            answer: '3x + 2z'
            answer_contract: {"kind": "function", "vars": ["x", "y", "z"]}
            solution_sketch: 'Differentiate each component with respect to its own variable: $\partial_x(x^2)=2x$, $\partial_y(xy)=x$ and $\partial_z(z^2)=2z$. Adding the three results gives $\operatorname{div}\mathbf{F}=3x+2z$.'
          - problem: 'Compute $\operatorname{div}\mathbf{F}$ for $\mathbf{F}=\langle xy,\;yz,\;zx\rangle$.'
            answer: 'x + y + z'
            answer_contract: {"kind": "function", "vars": ["x", "y", "z"]}
            solution_sketch: 'We have $\partial_x(xy)=y$, $\partial_y(yz)=z$ and $\partial_z(zx)=x$. Adding them gives $\operatorname{div}\mathbf{F}=x+y+z$.'
          - problem: 'A gas flows with velocity field $\mathbf{v}=\langle x^2y,\;yz,\;xz^2\rangle$. The divergence at a point measures how fast the gas expands there. Find the divergence at the point $(2,1,1)$.'
            answer: '9'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'We have $\operatorname{div}\mathbf{v}=2xy+z+2xz$. At $(2,1,1)$ this is $4+1+4=9$.'
          - problem: 'Find $\operatorname{div}\mathbf{F}$ at the point $(1,2,3)$ for $\mathbf{F}=\langle x^2y,\;y^2z,\;z^2x\rangle$.'
            answer: '22'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'We have $\operatorname{div}\mathbf{F}=2xy+2yz+2zx$. At $(1,2,3)$ this is $4+12+6=22$.'
          - problem: 'A fluid has velocity field $\mathbf{v}=\langle x^2y,\;-xy^2,\;z\rangle$. Is the flow incompressible, that is, is $\operatorname{div}\mathbf{v}=0$ everywhere?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "it is incompressible", "incompressible"], ["no", "it is not incompressible", "not incompressible", "compressible"]]}
            solution_sketch: 'We have $\partial_x(x^2y)=2xy$, $\partial_y(-xy^2)=-2xy$ and $\partial_z(z)=1$. The first two terms cancel but the sum is $\operatorname{div}\mathbf{v}=1$, which is not $0$, so the flow is not incompressible.'
          - problem: 'Find $\operatorname{div}\mathbf{F}$ for $\mathbf{F}=\langle xe^y,\;y\sin z,\;xz^2\rangle$.'
            answer: 'e^y + sin(z) + 2xz'
            answer_contract: {"kind": "function", "vars": ["x", "y", "z"]}
            solution_sketch: 'We have $\partial_x(xe^y)=e^y$, $\partial_y(y\sin z)=\sin z$ and $\partial_z(xz^2)=2xz$. Adding them gives $\operatorname{div}\mathbf{F}=e^y+\sin z+2xz$.'
          - problem: 'A fluid has velocity field $\mathbf{v}=\langle kx,\;2y,\;-z\rangle$, where $k$ is a constant. For which $k$ is the fluid incompressible?'
            answer: '-1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'We have $\operatorname{div}\mathbf{v}=k+2-1=k+1$. The fluid is incompressible when this is $0$, which gives $k=-1$.'
          - problem: 'What is the divergence of $\mathbf{F}=\langle y^2,\;z^2,\;x^2\rangle$?'
            answer: '0'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Each component must be differentiated with respect to its own variable. Here $\partial_x(y^2)=0$, $\partial_y(z^2)=0$ and $\partial_z(x^2)=0$, so $\operatorname{div}\mathbf{F}=0$.'
        constraints: "polynomial fields in three variables, degree at most 3 per component, plus one field with e^y and sin z; includes divergence at a point and a parameter that makes the divergence zero"
      - id: kp2
        name: "Curl"
        key_prerequisites: [vector-fields, cross-product]
        exemplars:
          - problem: 'Compute $\operatorname{curl}\mathbf{F}$ for $\mathbf{F}=\langle yz,\;2zx,\;3xy\rangle$.'
            answer: '(x, -2y, z)'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The first component is $\partial_y(3xy)-\partial_z(2zx)=3x-2x=x$. The second is $\partial_z(yz)-\partial_x(3xy)=y-3y=-2y$, and the third is $\partial_x(2zx)-\partial_y(yz)=2z-z=z$.'
          - problem: 'Compute $\operatorname{curl}\mathbf{F}$ for $\mathbf{F}=\langle xyz,\;2yz,\;xz\rangle$.'
            answer: '(-2y, x*y - z, -x*z)'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The first component is $\partial_y(xz)-\partial_z(2yz)=0-2y=-2y$. The second is $\partial_z(xyz)-\partial_x(xz)=xy-z$, and the third is $\partial_x(2yz)-\partial_y(xyz)=0-xz=-xz$.'
          - problem: 'Find the curl of $\mathbf{F}=\langle xy,\;yz,\;zx\rangle$ at the point $(1,2,3)$.'
            answer: '(-2, -3, -1)'
            answer_contract: {"kind": "coordinates", "arity": 3}
            solution_sketch: 'In general $\operatorname{curl}\mathbf{F}=\langle 0-y,\;0-z,\;0-x\rangle=\langle -y,-z,-x\rangle$. At $(1,2,3)$ this is $\langle -2,-3,-1\rangle$.'
          - problem: 'The velocity of the point $(x,y,z)$ on a spinning turntable is $\mathbf{v}=\langle -3y,\;3x,\;0\rangle$ metres per second. Find $\operatorname{curl}\mathbf{v}$.'
            answer: '(0, 0, 6)'
            answer_contract: {"kind": "coordinates", "arity": 3}
            solution_sketch: 'The first two components are $0-0=0$ and $0-0=0$. The third is $\partial_x(3x)-\partial_y(-3y)=3+3=6$, so the curl is $\langle 0,0,6\rangle$.'
          - problem: 'Compute $\operatorname{curl}\mathbf{F}$ for $\mathbf{F}=\langle x^2y,\;y^2z,\;z^2x\rangle$.'
            answer: '(-y^2, -z^2, -x^2)'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The first component is $\partial_y(z^2x)-\partial_z(y^2z)=0-y^2$. The second is $\partial_z(x^2y)-\partial_x(z^2x)=0-z^2$, and the third is $\partial_x(y^2z)-\partial_y(x^2y)=0-x^2$.'
          - problem: 'Water flows with velocity $\mathbf{v}=\langle yz,\;xz,\;xy\rangle$. Is the flow irrotational, that is, is $\operatorname{curl}\mathbf{v}=\mathbf{0}$?'
            answer: 'yes'
            answer_contract: {"kind": "label", "options": [["yes", "it is irrotational", "irrotational"], ["no", "it is not irrotational", "not irrotational", "rotational"]]}
            solution_sketch: 'The first component is $\partial_y(xy)-\partial_z(xz)=x-x=0$. The second is $\partial_z(yz)-\partial_x(xy)=y-y=0$, and the third is $\partial_x(xz)-\partial_y(yz)=z-z=0$, so the curl is zero and the flow is irrotational.'
          - problem: 'A platform rotates about the $z$-axis, and the velocity of the point $(x,y,z)$ on it is $\mathbf{v}=\langle -4y,\;4x,\;0\rangle$. The curl of $\mathbf{v}$ equals twice the angular velocity. Find the angular speed in radians per second.'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The curl is $\langle 0,0,\partial_x(4x)-\partial_y(-4y)\rangle=\langle 0,0,8\rangle$. This is twice the angular velocity, so the angular velocity is $\langle 0,0,4\rangle$ and the angular speed is $4$ radians per second.'
          - problem: 'Compute $\operatorname{curl}\mathbf{F}$ for $\mathbf{F}=\langle x^2z,\;y^2x,\;z^2y\rangle$.'
            answer: '(z^2, x^2, y^2)'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The first component is $\partial_y(z^2y)-\partial_z(y^2x)=z^2-0$. The second is $\partial_z(x^2z)-\partial_x(z^2y)=x^2-0$, and the third is $\partial_x(y^2x)-\partial_y(x^2z)=y^2-0$.'
        constraints: "components are monomials or short sums in x, y, z; the curl is requested in general or at a point; computed from the symbolic determinant with i, j, k"
      - id: kp3
        name: "The identities curl grad = 0 and div curl = 0"
        key_prerequisites: [vector-fields, cross-product, partial-derivatives]
        try_first:
          problem: 'Let $f(x,y,z)=xyz$. What is the $z$-component of $\operatorname{curl}(\nabla f)$ at the point $(1,2,3)$?'
          answer_contract: {"kind": "exact"}
          answer: '0'
          reveal: 'Here $\nabla f=\langle yz,xz,xy\rangle$, so the $z$-component is $\partial_x(xz)-\partial_y(yz)=z-z=0$. The mixed partial derivatives of $f$ cancel in pairs, which is why $\operatorname{curl}(\nabla f)=\mathbf{0}$ for every smooth $f$.'
        exemplars:
          - problem: 'Let $f(x,y,z)=x^2z+y^3$. Find $\operatorname{curl}(\nabla f)$.'
            answer: '(0, 0, 0)'
            answer_contract: {"kind": "coordinates", "arity": 3}
            solution_sketch: 'We have $\nabla f=\langle 2xz,\;3y^2,\;x^2\rangle$. Its curl is $\langle 0-0,\;2x-2x,\;0-0\rangle=\langle 0,0,0\rangle$, as the identity $\operatorname{curl}(\nabla f)=\mathbf{0}$ predicts.'
          - problem: 'Find $\operatorname{div}(\operatorname{curl}\mathbf{F})$ for $\mathbf{F}=\langle xy,\;yz,\;xz\rangle$.'
            answer: '0'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'First, $\operatorname{curl}\mathbf{F}=\langle 0-y,\;0-z,\;0-x\rangle=\langle -y,-z,-x\rangle$. Then $\operatorname{div}(\operatorname{curl}\mathbf{F})=0+0+0=0$.'
          - problem: 'For $\mathbf{F}=\langle xy^2,\;yz^2,\;x^2z\rangle$, find the $x$-component of $\operatorname{curl}\mathbf{F}$.'
            answer: '-2yz'
            answer_contract: {"kind": "function", "vars": ["x", "y", "z"]}
            solution_sketch: 'The $x$-component is $\partial_y(x^2z)-\partial_z(yz^2)$. Here $\partial_y(x^2z)=0$ and $\partial_z(yz^2)=2yz$, so the component is $-2yz$.'
          - problem: 'For $f(x,y,z)=y^2\sin x+xz^3$, find the $y$-component of $\nabla f$.'
            answer: '2*y*sin(x)'
            answer_contract: {"kind": "function", "vars": ["x", "y", "z"]}
            solution_sketch: 'The $y$-component of $\nabla f$ is $f_y$. Differentiating with respect to $y$ and treating $x$ and $z$ as constants gives $f_y=2y\sin x$.'
          - problem: 'The velocity field of a fluid is $\mathbf{v}=\nabla\varphi$, where $\varphi(x,y,z)=x^2y+yz^3$. Is the flow irrotational?'
            answer: 'yes'
            answer_contract: {"kind": "label", "options": [["yes", "it is irrotational", "irrotational"], ["no", "it is not irrotational", "not irrotational", "rotational"]]}
            solution_sketch: 'The curl of a gradient is always $\mathbf{0}$, so $\operatorname{curl}\mathbf{v}=\operatorname{curl}(\nabla\varphi)=\mathbf{0}$. The flow is therefore irrotational.'
          - problem: 'Is there a vector field $\mathbf{G}$ on $\mathbb{R}^3$ with $\operatorname{curl}\mathbf{G}=\langle x,\;y,\;z\rangle$?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "there is one", "such a field exists", "it exists"], ["no", "there is none", "no such field exists", "it does not exist"]]}
            solution_sketch: 'Since $\operatorname{div}(\operatorname{curl}\mathbf{G})=0$ for every $\mathbf{G}$, a curl must have zero divergence. But $\operatorname{div}\langle x,y,z\rangle=3$, which is not $0$, so no such field exists.'
          - problem: 'For which value of $a$ is $\langle ax,\;y,\;2z\rangle$ the curl of some vector field?'
            answer: '-3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A curl always has divergence $0$. Here $\operatorname{div}\langle ax,y,2z\rangle=a+1+2=a+3$, which is $0$ only for $a=-3$.'
          - problem: 'Every magnetic field has zero divergence. A field $\mathbf{B}=\langle 2x,\;ky,\;-3z\rangle$ tesla is proposed, where $k$ is a constant. For which $k$ can it be a magnetic field?'
            answer: '1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A magnetic field must satisfy $\operatorname{div}\mathbf{B}=0$. Here $\operatorname{div}\mathbf{B}=2+k-3=k-1$, which is $0$ only for $k=1$.'
        constraints: "verifications on concrete low-degree fields; the two identities are used both to compute and to decide whether a field can be a gradient or a curl"
    diagnostic_exemplar:
      problem: 'For $\mathbf{F} = \langle x^2, y^2, z^2 \rangle$, confirm that $\operatorname{curl} \mathbf{F} = \mathbf{0}$ and then state $\operatorname{div} \mathbf{F}$.'
      answer: '$2x + 2y + 2z$'
      solution_sketch: 'Each component depends only on its own variable, so all mixed partials in the curl vanish; the divergence is $2x + 2y + 2z$.'
    anki_seeds:
      - front: 'Formulas: $\operatorname{div}\mathbf{F}$ and $\operatorname{curl}\mathbf{F}$ in terms of $\nabla$?'
        back: '$\operatorname{div}\mathbf{F} = \nabla \cdot \mathbf{F}$ (a scalar); $\operatorname{curl}\mathbf{F} = \nabla \times \mathbf{F}$ (a vector).'
        type: basic
      - front: 'What is $\operatorname{curl}(\nabla f)$ for any twice continuously differentiable $f$?'
        back: '$\mathbf{0}$ — gradient fields are irrotational.'
        type: basic
      - front: 'What is $\operatorname{div}(\operatorname{curl} \mathbf{F})$ for any twice continuously differentiable $\mathbf{F}$?'
        back: '$0$ — curl fields are divergence-free.'
        type: basic

  - id: conservative-fields-3d
    name: "Conservative Fields in Three Dimensions"
    core: false                # vector-calculus capstone; terminal
    difficulty: 0.83
    drill: false
    answer_kind: numeric
    expected_time_secs: 240
    prerequisites:
      - id: conservative-fields-potential-functions
        weight: 0.7
        key: true
      - id: computing-div-curl
        weight: 0.7
        key: true
      - id: fundamental-theorem-line-integrals
        weight: 0.4
        key: false
    knowledge_points:
      - id: kp1
        name: "The curl test"
        key_prerequisites: [conservative-fields-potential-functions, computing-div-curl]
        exemplars:
          - problem: 'Is the field $\mathbf{F}=\langle 2xy+z,\;x^2+3z,\;x+3y\rangle$ conservative on $\mathbb{R}^3$?'
            answer: 'yes'
            answer_contract: {"kind": "label", "options": [["yes", "it is conservative", "conservative", "the field is conservative"], ["no", "it is not conservative", "not conservative", "nonconservative", "the field is not conservative"]]}
            solution_sketch: 'Take $P=2xy+z$, $Q=x^2+3z$ and $R=x+3y$. Then $\partial_yR-\partial_zQ=3-3=0$, $\partial_zP-\partial_xR=1-1=0$ and $\partial_xQ-\partial_yP=2x-2x=0$. The curl is $\mathbf{0}$ on all of $\mathbb{R}^3$, so the field is conservative.'
          - problem: 'Find $\operatorname{curl}\mathbf{F}$ for $\mathbf{F}=\langle 3y,\;5x,\;0\rangle$.'
            answer: '(0, 0, 2)'
            answer_contract: {"kind": "coordinates", "arity": 3}
            solution_sketch: 'The first two components are $\partial_y(0)-\partial_z(5x)=0$ and $\partial_z(3y)-\partial_x(0)=0$. The third is $\partial_x(5x)-\partial_y(3y)=5-3=2$, so the curl is $\langle 0,0,2\rangle$ and $\mathbf{F}$ is not conservative.'
          - problem: 'Find $\operatorname{curl}\mathbf{F}$ for $\mathbf{F}=\langle 0,\;7z,\;4y\rangle$.'
            answer: '(-3, 0, 0)'
            answer_contract: {"kind": "coordinates", "arity": 3}
            solution_sketch: 'The first component is $\partial_y(4y)-\partial_z(7z)=4-7=-3$. The other two are $\partial_z(0)-\partial_x(4y)=0$ and $\partial_x(7z)-\partial_y(0)=0$, so the curl is $\langle -3,0,0\rangle$.'
          - problem: 'A force field in space is $\mathbf{F}=\langle y,\;z,\;x\rangle$ newtons. Is the work done by $\mathbf{F}$ on a particle the same along every path between two given points?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "it is the same", "the same", "path independent", "it is path independent"], ["no", "it is not the same", "not the same", "it depends on the path", "the work depends on the path", "path dependent", "it is path dependent", "not path independent"]]}
            solution_sketch: 'The work is path independent only if $\operatorname{curl}\mathbf{F}=\mathbf{0}$. Here $\operatorname{curl}\mathbf{F}=\langle 0-1,\;0-1,\;0-1\rangle=\langle -1,-1,-1\rangle$, which is not zero, so the work depends on the path.'
          - problem: 'A force field in space is $\mathbf{F}=\langle 2xy+kz,\;x^2+3z,\;x+3y\rangle$ newtons, where $k$ is a constant. For which $k$ does $\mathbf{F}$ do the same work between two points along every path?'
            answer: '1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The work is path independent when $\operatorname{curl}\mathbf{F}=\mathbf{0}$. The second component is $\partial_zP-\partial_xR=k-1$, and the other two components are $0$, so $k=1$.'
          - problem: 'Find $\operatorname{curl}\mathbf{F}$ for $\mathbf{F}=\langle y+z,\;x+z,\;x+y\rangle$.'
            answer: '(0, 0, 0)'
            answer_contract: {"kind": "coordinates", "arity": 3}
            solution_sketch: 'The first component is $\partial_y(x+y)-\partial_z(x+z)=1-1=0$. The second is $\partial_z(y+z)-\partial_x(x+y)=1-1=0$ and the third is $\partial_x(x+z)-\partial_y(y+z)=1-1=0$, so the curl is $\langle 0,0,0\rangle$.'
          - problem: 'The field $\mathbf{F}=\langle yz,\;xz,\;x\rangle$ has $P_y=Q_x$. What is $\operatorname{curl}\mathbf{F}$?'
            answer: '(-x, y - 1, 0)'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The first component is $\partial_y(x)-\partial_z(xz)=0-x=-x$. The second is $\partial_z(yz)-\partial_x(x)=y-1$ and the third is $\partial_x(xz)-\partial_y(yz)=z-z=0$. The curl is not zero, so $\mathbf{F}$ is not conservative; in space all three pairs must be tested.'
        constraints: "polynomial fields on all of R^3; the curl either vanishes identically or has a nonzero component; one partial test is not enough in space"
      - id: kp2
        name: "Finding 3D potential functions"
        key_prerequisites: [conservative-fields-potential-functions, computing-div-curl]
        try_first:
          problem: 'A function $f(x,y,z)$ satisfies $f_x=y$, $f_y=x+z$ and $f_z=y$, and $f(0,0,0)=0$. What is $f(1,2,3)$?'
          answer_contract: {"kind": "exact"}
          answer: '8'
          reveal: 'Integrating $f_x=y$ gives $xy$ plus a function of $y$ and $z$, and the other two equations show that this function is $yz$ plus a constant, so $f=xy+yz$ and $f(1,2,3)=2+6=8$. The same matching of one variable at a time finds a potential for any conservative field in space.'
        exemplars:
          - problem: 'Find a potential function for $\mathbf{F}=\langle 2xz,\;z,\;x^2+y\rangle$.'
            answer: 'x^2*z + y*z'
            answer_contract: {"kind": "function", "vars": ["x", "y", "z"], "up_to_constant": true}
            solution_sketch: 'Integrating $f_x=2xz$ in $x$ gives $f=x^2z+g(y,z)$. Then $f_y=g_y$ must equal $z$, so $g=yz+h(z)$. Finally $f_z=x^2+y+h''(z)$ must equal $x^2+y$, so $h''(z)=0$ and $f=x^2z+yz$.'
          - problem: 'Find a potential function for $\mathbf{F}=\langle 2x+y,\;x+2z,\;2y+3z^2\rangle$.'
            answer: 'x^2 + x*y + 2*y*z + z^3'
            answer_contract: {"kind": "function", "vars": ["x", "y", "z"], "up_to_constant": true}
            solution_sketch: 'Integrating $f_x=2x+y$ gives $f=x^2+xy+g(y,z)$. Then $f_y=x+g_y$ must equal $x+2z$, so $g=2yz+h(z)$. Finally $f_z=2y+h''(z)$ must equal $2y+3z^2$, so $h=z^3$ and $f=x^2+xy+2yz+z^3$.'
          - problem: 'A force field in space is $\mathbf{F}=\langle 3x^2+yz,\;xz,\;xy\rangle$ newtons. Find the potential function $f$ of $\mathbf{F}$ with $f(0,0,0)=0$.'
            answer: 'x^3 + x*y*z'
            answer_contract: {"kind": "function", "vars": ["x", "y", "z"]}
            solution_sketch: 'Integrating $f_x=3x^2+yz$ gives $f=x^3+xyz+g(y,z)$. Both $f_y=xz+g_y$ and $f_z=xy+g_z$ already match, so $g$ is constant, and $f(0,0,0)=0$ makes it $0$. Hence $f=x^3+xyz$.'
          - problem: 'Find a potential function for $\mathbf{F}=\langle 2xy,\;x^2+2yz,\;y^2+3z^2\rangle$.'
            answer: 'x^2*y + y^2*z + z^3'
            answer_contract: {"kind": "function", "vars": ["x", "y", "z"], "up_to_constant": true}
            solution_sketch: 'Integrating $f_x=2xy$ gives $f=x^2y+g(y,z)$. Then $f_y=x^2+g_y$ must equal $x^2+2yz$, so $g=y^2z+h(z)$. Finally $f_z=y^2+h''(z)$ must equal $y^2+3z^2$, so $h=z^3$ and $f=x^2y+y^2z+z^3$.'
          - problem: 'Find a potential function for $\mathbf{F}=\langle yz+2x,\;xz+2y,\;xy+2z\rangle$.'
            answer: 'x*y*z + x^2 + y^2 + z^2'
            answer_contract: {"kind": "function", "vars": ["x", "y", "z"], "up_to_constant": true}
            solution_sketch: 'Integrating $f_x=yz+2x$ gives $f=xyz+x^2+g(y,z)$. Then $f_y=xz+g_y$ must equal $xz+2y$, so $g=y^2+h(z)$. Finally $f_z=xy+h''(z)$ must equal $xy+2z$, so $h=z^2$ and $f=xyz+x^2+y^2+z^2$.'
          - problem: 'The velocity field of a fluid in space is $\mathbf{v}=\langle y+z,\;x+z,\;x+y\rangle$. Find a velocity potential, that is, a function $\varphi$ with $\nabla\varphi=\mathbf{v}$.'
            answer: 'x*y + x*z + y*z'
            answer_contract: {"kind": "function", "vars": ["x", "y", "z"], "up_to_constant": true}
            solution_sketch: 'Integrating $\varphi_x=y+z$ gives $\varphi=xy+xz+g(y,z)$. Then $\varphi_y=x+g_y$ must equal $x+z$, so $g=yz+h(z)$, and $\varphi_z=x+y+h''(z)$ forces $h''(z)=0$. Hence $\varphi=xy+xz+yz$.'
          - problem: 'Find a potential function for $\mathbf{F}=\langle 2xy,\;x^2+z^2,\;2yz\rangle$.'
            answer: 'x^2*y + y*z^2'
            answer_contract: {"kind": "function", "vars": ["x", "y", "z"], "up_to_constant": true}
            solution_sketch: 'Integrating $f_x=2xy$ gives $f=x^2y+g(y,z)$. Then $f_y=x^2+g_y$ must equal $x^2+z^2$, so $g=yz^2+h(z)$. Finally $f_z=2yz+h''(z)$ equals $2yz$, so $h$ is constant and $f=x^2y+yz^2$.'
          - problem: 'Find a potential function for $\mathbf{F}=\langle yz^2,\;xz^2+2y,\;2xyz\rangle$.'
            answer: 'x*y*z^2 + y^2'
            answer_contract: {"kind": "function", "vars": ["x", "y", "z"], "up_to_constant": true}
            solution_sketch: 'Integrating $f_x=yz^2$ gives $f=xyz^2+g(y,z)$. Then $f_y=xz^2+g_y$ must equal $xz^2+2y$, so $g=y^2+h(z)$, and $f_z=2xyz+h''(z)$ forces $h''(z)=0$. Hence $f=xyz^2+y^2$.'
        constraints: "potentials are sums of degree-2 to degree-4 monomials; successive integration in x, then y, then z; one item fixes the constant with f(0, 0, 0) = 0"
      - id: kp3
        name: "Path-independent integrals in space"
        key_prerequisites: [conservative-fields-potential-functions, computing-div-curl, fundamental-theorem-line-integrals]
        exemplars:
          - problem: 'Evaluate $\int_C\mathbf{F}\cdot d\mathbf{r}$ for $\mathbf{F}=\langle yz,\;xz,\;xy\rangle$ along any path from $(1,1,1)$ to $(2,3,1)$.'
            answer: '5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A potential is $f=xyz$, since $f_x=yz$, $f_y=xz$ and $f_z=xy$. The integral is $f(2,3,1)-f(1,1,1)=6-1=5$.'
          - problem: 'A force field in space is $\mathbf{F}=\langle 2x+3y^2,\;6xy,\;2z\rangle$ newtons. Find the work done, in joules, as a particle moves along any path from $(0,0,0)$ to $(1,2,1)$.'
            answer: '14'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The curl of $\mathbf{F}$ is $\mathbf{0}$, and a potential is $f=x^2+3xy^2+z^2$. The work is $f(1,2,1)-f(0,0,0)=1+12+1-0=14$ joules.'
          - problem: 'Evaluate $\int_C\mathbf{F}\cdot d\mathbf{r}$ for $\mathbf{F}=\langle 2x,\;2y,\;2z\rangle$ along any path from $(0,0,0)$ to $(1,2,2)$.'
            answer: '9'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A potential is $f=x^2+y^2+z^2$, since $\nabla f=\langle 2x,2y,2z\rangle$. The integral is $f(1,2,2)-f(0,0,0)=1+4+4-0=9$.'
          - problem: 'A robot arm moves a tool from the origin to the point $(1,3,2)$ metres under the force $\mathbf{F}=\langle z,\;2y,\;x\rangle$ newtons. Find the work done, in joules, along any path.'
            answer: '11'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A potential is $f=xz+y^2$, since $f_x=z$, $f_y=2y$ and $f_z=x$. The work is $f(1,3,2)-f(0,0,0)=2+9-0=11$ joules.'
          - problem: 'Evaluate $\int_C\mathbf{F}\cdot d\mathbf{r}$ for $\mathbf{F}=\langle 2xy,\;x^2+3z^2,\;6yz\rangle$ along any path from $(1,1,0)$ to $(2,1,1)$.'
            answer: '6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A potential is $f=x^2y+3yz^2$, since $f_x=2xy$, $f_y=x^2+3z^2$ and $f_z=6yz$. Then $f(2,1,1)=4+3=7$ and $f(1,1,0)=1$, so the integral is $7-1=6$.'
          - problem: 'Is $\int_C\mathbf{F}\cdot d\mathbf{r}$ the same along every path $C$ from $(0,0,0)$ to $(1,1,1)$ when $\mathbf{F}=\langle z,\;x,\;2y\rangle$?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "it is the same", "the same", "path independent", "it is path independent"], ["no", "it is not the same", "not the same", "it depends on the path", "the work depends on the path", "path dependent", "it is path dependent", "not path independent"]]}
            solution_sketch: 'The integral is path independent only if $\operatorname{curl}\mathbf{F}=\mathbf{0}$. Here $\operatorname{curl}\mathbf{F}=\langle 2-0,\;1-0,\;1-0\rangle=\langle 2,1,1\rangle$, which is not zero, so the integral depends on the path.'
          - problem: 'A force field in space is $\mathbf{F}=\langle 2xy,\;x^2,\;3z^2\rangle$ newtons. Find the work done, in joules, as a particle moves along any path from $(1,1,1)$ back to the origin.'
            answer: '-2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A potential is $f=x^2y+z^3$, since $f_x=2xy$, $f_y=x^2$ and $f_z=3z^2$. The work is $f(0,0,0)-f(1,1,1)=0-2=-2$ joules.'
          - problem: 'Evaluate $\int_C\mathbf{F}\cdot d\mathbf{r}$ for $\mathbf{F}=\langle e^z,\;2y,\;xe^z\rangle$ along any path from $(0,0,0)$ to $(2,1,\ln 3)$.'
            answer: '7'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A potential is $f=xe^z+y^2$, since $f_x=e^z$, $f_y=2y$ and $f_z=xe^z$. Then $f(2,1,\ln 3)=2\cdot 3+1=7$ and $f(0,0,0)=0$, so the integral is $7$.'
        constraints: "endpoints at small integer points (or with ln 3); potential values exact numbers; includes a reversed path and one field whose curl is not zero"
    diagnostic_exemplar:
      problem: 'Evaluate $\int_C \mathbf{F} \cdot d\mathbf{r}$ for $\mathbf{F} = \langle yz,\; xz + 2y,\; xy \rangle$ along any path from $(1, 0, 2)$ to $(2, 1, 3)$.'
      answer: '$7$'
      solution_sketch: '$\operatorname{curl}\mathbf{F} = \langle x - x,\; y - y,\; z - z \rangle = \mathbf{0}$, so $\mathbf{F}$ is conservative with potential $f = xyz + y^2$. The integral is $f(2,1,3) - f(1,0,2) = 7 - 0 = 7$.'
    anki_seeds:
      - front: 'Test for a conservative field $\mathbf{F}$ on $\mathbb{R}^3$ (simply connected)?'
        back: '$\operatorname{curl}\mathbf{F} = \mathbf{0}$'
        type: basic
      - front: 'Procedure for finding a 3D potential function?'
        back: 'Integrate $f_x = P$ in $x$ (constant of integration $g(y,z)$), then match $f_y = Q$ and $f_z = R$ to pin down $g$.'
        type: basic

  - id: greens-theorem
    name: "Green's Theorem"
    core: false                # stated theorem feeding only the terminal capstones
    difficulty: 0.82
    drill: false
    answer_kind: numeric
    expected_time_secs: 240
    prerequisites:
      - id: line-integrals
        weight: 0.8
        key: true
      - id: double-integrals
        weight: 0.7
        key: true
      - id: double-integrals-polar
        weight: 0.4
        key: false
      - id: conservative-fields-potential-functions
        weight: 0.3
        key: false
    knowledge_points:
      - id: kp1
        name: "Converting circulation integrals to double integrals"
        key_prerequisites: [line-integrals, double-integrals]
        try_first:
          problem: 'A region $D$ has area $5$. What is $\iint_D 3\,dA$?'
          answer_contract: {"kind": "exact"}
          answer: '15'
          reveal: 'When $Q_x - P_y$ is a constant $c$, the double integral is $c$ times the area. Green''s theorem turns a loop integral into an area integral of this kind.'
        exemplars:
          - problem: 'Use Green''s theorem to evaluate $\oint_C xy\,dx + x^2\,dy$, where $C$ is the boundary of the unit square $[0,1]\times[0,1]$ traversed counterclockwise.'
            answer: '1/2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Here $P = xy$ and $Q = x^2$, so $Q_x - P_y = 2x - x = x$. Green''s theorem turns the line integral into $\iint_D x\,dA$ over the square, and this equals $\int_0^1\int_0^1 x\,dx\,dy = \tfrac{1}{2}$.'
          - problem: 'Use Green''s theorem to evaluate $\oint_C (-y\,dx + x\,dy)$, where $C$ is the unit circle traversed counterclockwise.'
            answer: '2pi'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Here $P = -y$ and $Q = x$, so $Q_x - P_y = 1 - (-1) = 2$. The integral equals $\iint_D 2\,dA = 2 \cdot \pi = 2\pi$, because the unit disk has area $\pi$.'
          - problem: 'Use Green''s theorem to evaluate $\oint_C y^2\,dx + 3xy\,dy$, where $C$ is the boundary of the upper half of the unit disk, traversed counterclockwise.'
            answer: '2/3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Here $Q_x - P_y = 3y - 2y = y$. In polar coordinates the half disk has $0 \le r \le 1$ and $0 \le \theta \le \pi$, so the integral is $\int_0^\pi\int_0^1 r\sin\theta \cdot r\,dr\,d\theta = \tfrac{1}{3}\cdot 2 = \tfrac{2}{3}$.'
          - problem: 'Use Green''s theorem to evaluate $\oint_C -x^2y\,dx$, where $C$ is the circle $x^2 + y^2 = 4$ traversed counterclockwise.'
            answer: '4pi'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Here $P = -x^2y$ and $Q = 0$, so $Q_x - P_y = 0 - (-x^2) = x^2$. In polar coordinates the integral is $\int_0^{2\pi}\int_0^2 r^2\cos^2\theta \cdot r\,dr\,d\theta = 4 \cdot \pi = 4\pi$.'
          - problem: 'Let $C$ be the boundary of the square $0 \le x \le 2$, $0 \le y \le 2$, traversed counterclockwise. Use Green''s theorem to evaluate $\oint_C xy^2\,dy$.'
            answer: '16/3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Here $P = 0$ and $Q = xy^2$, so $Q_x - P_y = y^2$. The double integral over the square is $\int_0^2\int_0^2 y^2\,dy\,dx = 2 \cdot \tfrac{8}{3} = \tfrac{16}{3}$.'
          - problem: 'Let $C$ be the boundary of the upper half of the disk $x^2 + y^2 \le 4$, traversed counterclockwise. Use Green''s theorem to evaluate $\oint_C xy^3\,dy$.'
            answer: '128/15'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Here $P = 0$ and $Q = xy^3$, so $Q_x - P_y = y^3$. In polar coordinates the integral is $\int_0^\pi\int_0^2 r^3\sin^3\theta \cdot r\,dr\,d\theta = \tfrac{32}{5}\cdot\tfrac{4}{3} = \tfrac{128}{15}$.'
          - problem: 'Evaluate $\oint_C 2xy\,dx + x^2\,dy$, where $C$ is the boundary of the triangle with vertices $(0,0)$, $(4,0)$ and $(1,3)$, traversed counterclockwise.'
            answer: '0'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Here $Q_x - P_y = 2x - 2x = 0$ at every point. So Green''s theorem gives $\iint_D 0\,dA = 0$ for the triangle, and no integration over the triangle is needed.'
          - problem: 'A cart is pushed by the force $\mathbf{F} = \langle -2y,\; 3x\rangle$ newtons while it moves once counterclockwise around the circle $x^2 + y^2 = 4$, with $x$ and $y$ in metres. How much work, in joules, does the force do?'
            answer: '20pi'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The work is $\oint_C -2y\,dx + 3x\,dy$. Here $Q_x - P_y = 3 - (-2) = 5$, so the work is $5$ times the area of the disk, $5 \cdot 4\pi = 20\pi$ joules.'
          - problem: 'The force $\mathbf{F} = \langle -2y,\; 3x\rangle$ newtons does $50$ joules of work on a cart that moves once counterclockwise around a closed loop, with $x$ and $y$ in metres. What area does the loop enclose?'
            answer: '10'
            answer_contract: {"kind": "unit", "quantity": "area", "unit": "m^2", "allow_omitted": true}
            solution_sketch: 'The work is $\oint_C -2y\,dx + 3x\,dy = \iint_D 5\,dA = 5 \cdot \text{area}$, because $Q_x - P_y = 3 + 2 = 5$. So $5 \cdot \text{area} = 50$, and the area is $50 \div 5 = 10$ square metres.'
          - problem: 'Evaluate $\oint_C 3y\,dx + x\,dy$ around the unit circle, traversed counterclockwise.'
            answer: '-2pi'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Green''s theorem uses $Q_x - P_y$, with $Q = x$ and $P = 3y$. So $Q_x - P_y = 1 - 3 = -2$, and the integral is $-2 \cdot \pi = -2\pi$.'
          - problem: 'Use Green''s theorem to evaluate $\oint_C (-y\,dx + x\,dy)$, where $C$ is the unit circle traversed clockwise.'
            answer: '-2pi'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Green''s theorem needs the counterclockwise direction. Going counterclockwise the value is $\iint_D 2\,dA = 2\pi$, and reversing the direction changes the sign, so the clockwise value is $-2\pi$.'
        constraints: "C is a circle, square, half-disk or triangle; counterclockwise except where the item asks about the clockwise direction; Q_x - P_y is a monomial or a constant"
      - id: kp2
        name: "Area via Green's theorem"
        key_prerequisites: [line-integrals, double-integrals]
        exemplars:
          - problem: 'Use $A = \frac{1}{2}\oint_C (x\,dy - y\,dx)$ to find the area of the ellipse $x = 3\cos t$, $y = 2\sin t$.'
            answer: '6pi'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'With $dx = -3\sin t\,dt$ and $dy = 2\cos t\,dt$ we get $x\,dy - y\,dx = 6\cos^2 t + 6\sin^2 t = 6$. The area is $\tfrac{1}{2}\int_0^{2\pi} 6\,dt = 6\pi$.'
          - problem: 'Use $A = \frac{1}{2}\oint_C (x\,dy - y\,dx)$ to find the area of the ellipse $x = 2\cos t$, $y = 5\sin t$.'
            answer: '10pi'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'With $dx = -2\sin t\,dt$ and $dy = 5\cos t\,dt$ we get $x\,dy - y\,dx = 10\cos^2 t + 10\sin^2 t = 10$. The area is $\tfrac{1}{2}\int_0^{2\pi} 10\,dt = 10\pi$.'
          - problem: 'Use $A = \frac{1}{2}\oint_C (x\,dy - y\,dx)$ on the triangle with vertices $(0,0)$, $(4,0)$ and $(0,3)$, traversed counterclockwise, to find its area.'
            answer: '6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'On the side from $(0,0)$ to $(4,0)$ we have $y = 0$ and $dy = 0$, so the integrand is $0$. The side from $(0,3)$ to $(0,0)$ has $x = 0$ and $dx = 0$, so it also gives $0$. On the slanted side $x = 4 - 4s$, $y = 3s$ and $x\,dy - y\,dx = 12\,ds$, so the area is $\tfrac{1}{2}\int_0^1 12\,ds = 6$.'
          - problem: 'Use $A = \frac{1}{2}\oint_C (x\,dy - y\,dx)$ to find the area of the quadrilateral with vertices $(0,0)$, $(5,0)$, $(5,4)$ and $(0,2)$, traversed counterclockwise.'
            answer: '15'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The sides on the $x$-axis and on the $y$-axis give $0$. On the side from $(5,0)$ to $(5,4)$ we have $x\,dy - y\,dx = 20\,ds$, and on the side from $(5,4)$ to $(0,2)$ we have $x\,dy - y\,dx = 10\,ds$. So the area is $\tfrac{1}{2}(20 + 10) = 15$.'
          - problem: 'The ellipse $x = a\cos t$, $y = 3\sin t$ with $a > 0$ has area $12\pi$. Find $a$.'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The area formula gives $\tfrac{1}{2}\int_0^{2\pi} 3a\,dt = 3\pi a$. Setting $3\pi a = 12\pi$ and dividing both sides by $3\pi$ gives $a = 4$.'
          - problem: 'Use $A = \frac{1}{2}\oint_C (x\,dy - y\,dx)$ to find the area of the parallelogram with vertices $(0,0)$, $(6,0)$, $(8,3)$ and $(2,3)$, traversed counterclockwise.'
            answer: '18'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The bottom side gives $0$ and the left side from $(2,3)$ to $(0,0)$ gives $0$. The side from $(6,0)$ to $(8,3)$ and the top side each give $x\,dy - y\,dx = 18\,ds$. So the area is $\tfrac{1}{2}(18 + 18) = 18$.'
          - problem: 'A lawn is bounded by the ellipse $x = 10\cos t$, $y = 6\sin t$, with $x$ and $y$ in metres. Grass seed costs $2$ dollars per square metre. What does it cost to seed the whole lawn?'
            answer: '120pi'
            answer_contract: {"kind": "unit", "quantity": "dollar", "unit": "dollar", "allow_omitted": true}
            solution_sketch: 'The area is $\tfrac{1}{2}\oint_C (x\,dy - y\,dx) = \tfrac{1}{2}\int_0^{2\pi} 60\,dt = 60\pi$ square metres. At $2$ dollars per square metre the cost is $2 \cdot 60\pi = 120\pi$ dollars.'
          - problem: 'A pond is bounded by the ellipse $x = 5\cos t$, $y = 4\sin t$, with $x$ and $y$ in metres, and it holds $60\pi$ cubic metres of water. What is the mean depth of the pond?'
            answer: '3'
            answer_contract: {"kind": "unit", "quantity": "length", "unit": "m", "allow_omitted": true}
            solution_sketch: 'The area of the pond is $\tfrac{1}{2}\int_0^{2\pi} 20\,dt = 20\pi$ square metres. Volume equals area times mean depth, so the mean depth is $60\pi \div 20\pi = 3$ metres.'
          - problem: 'Find the area of the ellipse $x = 2\cos t$, $y = 4\sin t$ with the line integral $\oint_C (x\,dy - y\,dx)$.'
            answer: '8pi'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'For this ellipse $x\,dy - y\,dx = 8\,dt$, so the line integral is $16\pi$. The area formula has the factor $\tfrac{1}{2}$, so the area is $\tfrac{1}{2}\cdot 16\pi = 8\pi$.'
        constraints: "ellipses and polygons parametrized with sin/cos or segments; the integrand collapses via sin^2 + cos^2 = 1; items may ask for a side, a cost or a depth"
    diagnostic_exemplar:
      problem: 'Use Green''s theorem to evaluate $\oint_C xy\,dx + x^2\,dy$ where $C$ is the boundary of the triangle with vertices $(0,0)$, $(2,0)$, $(2,2)$, traversed counterclockwise.'
      answer: '$\dfrac{8}{3}$'
      answer_contract: {kind: none}
      solution_sketch: '$Q_x - P_y = 2x - x = x$, and the triangle is $0 \le x \le 2$, $0 \le y \le x$, so the integral is $\int_0^2\!\int_0^x x\,dy\,dx = \int_0^2 x^2\,dx = \tfrac{8}{3}$.'
    anki_seeds:
      - front: 'Green''s theorem (circulation form)?'
        back: '$\oint_C P\, dx + Q\, dy = \iint_D \left(\frac{\partial Q}{\partial x} - \frac{\partial P}{\partial y}\right) dA$, with $C$ the positively oriented boundary of $D$.'
        type: basic
      - front: 'Area formula from Green''s theorem?'
        back: '$A = \frac{1}{2}\oint_C (x\, dy - y\, dx)$'
        type: basic

  - id: flux-form-greens-theorem
    name: "Flux and the Divergence Form of Green's Theorem"
    core: false                # restatement of Green's theorem; terminal
    difficulty: 0.83
    drill: false
    answer_kind: numeric
    expected_time_secs: 240
    prerequisites:
      - id: greens-theorem
        weight: 0.7
        key: true
      - id: computing-div-curl
        weight: 0.6
        key: true
      - id: vector-line-integrals
        weight: 0.4
        key: false
    knowledge_points:
      - id: kp1
        name: "Outward flux across a curve, directly"
        key_prerequisites: [greens-theorem, vector-line-integrals]
        exemplars:
          - problem: 'Compute the outward flux $\oint_C \mathbf{F}\cdot\mathbf{n}\,ds$ of $\mathbf{F} = \langle x, y\rangle$ across the unit circle.'
            answer: '2pi'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'On the unit circle $\mathbf{n} = \langle\cos t, \sin t\rangle$ and $ds = dt$. So $\mathbf{F}\cdot\mathbf{n} = \cos^2 t + \sin^2 t = 1$, and the flux is $\int_0^{2\pi} 1\,dt = 2\pi$.'
          - problem: 'Compute the outward flux of $\mathbf{F} = \langle x, 0\rangle$ across the unit circle.'
            answer: 'pi'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'On the unit circle $\mathbf{F}\cdot\mathbf{n} = \cos t \cdot \cos t = \cos^2 t$. Over a full turn $\cos^2 t$ has average value $\tfrac12$, so $\int_0^{2\pi}\cos^2 t\,dt = \pi$.'
          - problem: 'Compute the outward flux of $\mathbf{F} = \langle 0, 3y\rangle$ across the unit circle.'
            answer: '3pi'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'On the unit circle $\mathbf{F} = \langle 0, 3\sin t\rangle$ and $\mathbf{n} = \langle\cos t, \sin t\rangle$, so $\mathbf{F}\cdot\mathbf{n} = 3\sin^2 t$. Then $\int_0^{2\pi} 3\sin^2 t\,dt = 3\pi$.'
          - problem: 'Compute the outward flux of $\mathbf{F} = \langle y, x\rangle$ across the circle $x^2 + y^2 = 9$.'
            answer: '0'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'On the circle $\mathbf{F} = \langle 3\sin t, 3\cos t\rangle$, $\mathbf{n} = \langle\cos t, \sin t\rangle$ and $ds = 3\,dt$. So $\mathbf{F}\cdot\mathbf{n} = 6\sin t\cos t$, and $\int_0^{2\pi} 18\sin t\cos t\,dt = 0$ because the positive and negative parts cancel.'
          - problem: 'Compute the outward flux of $\mathbf{F} = \langle 2x, y\rangle$ across the circle $x^2 + y^2 = 4$.'
            answer: '12pi'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'On the circle $\mathbf{F} = \langle 4\cos t, 2\sin t\rangle$, $\mathbf{n} = \langle\cos t, \sin t\rangle$ and $ds = 2\,dt$. So $\mathbf{F}\cdot\mathbf{n} = 4\cos^2 t + 2\sin^2 t$, and the flux is $2\int_0^{2\pi}(4\cos^2 t + 2\sin^2 t)\,dt = 2(4\pi + 2\pi) = 12\pi$.'
          - problem: 'Is the outward flux of $\mathbf{F} = \langle -y, x\rangle$ across the unit circle positive, negative or zero?'
            answer: 'zero'
            answer_contract: {"kind": "label", "options": [["positive", "it is positive", "greater than zero"], ["negative", "it is negative", "less than zero"], ["zero", "it is zero", "no flux", "0"]]}
            solution_sketch: 'On the unit circle $\mathbf{F} = \langle -\sin t, \cos t\rangle$ and $\mathbf{n} = \langle\cos t, \sin t\rangle$. So $\mathbf{F}\cdot\mathbf{n} = -\sin t\cos t + \cos t\sin t = 0$ at every point, and the flux is $0$. The field is tangent to the circle, so nothing crosses it.'
          - problem: 'A thin layer of water flows over a flat plate with velocity $\mathbf{F} = \langle x, y\rangle$ metres per second. Find the rate, in square metres per second, at which water leaves the circular region $x^2 + y^2 \le 9$ across its boundary.'
            answer: '18pi'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'On the circle of radius $3$, $\mathbf{n} = \langle\cos t, \sin t\rangle$ and $\mathbf{F}\cdot\mathbf{n} = 3$. The circle has length $6\pi$, so the outward flux is $3 \cdot 6\pi = 18\pi$.'
          - problem: 'A thin layer of water flows with velocity $\mathbf{F} = \langle x, y\rangle$ metres per second. The outward flux across a circle centered at the origin is $50\pi$ square metres per second. What is the radius of the circle?'
            answer: '5'
            answer_contract: {"kind": "unit", "quantity": "length", "unit": "m", "allow_omitted": true}
            solution_sketch: 'On a circle of radius $R$ we have $\mathbf{F}\cdot\mathbf{n} = R$, and the circle has length $2\pi R$. So the flux is $2\pi R^2$, and $2\pi R^2 = 50\pi$ gives $R^2 = 25$ and $R = 5$ metres.'
          - problem: 'Find the outward flux of $\mathbf{F} = \langle 0, 4y\rangle$ across the unit circle.'
            answer: '4pi'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Flux needs the outward normal $\mathbf{n} = \langle\cos t, \sin t\rangle$, not the tangent vector. Then $\mathbf{F}\cdot\mathbf{n} = 4\sin^2 t$, and $\int_0^{2\pi} 4\sin^2 t\,dt = 4\pi$.'
        constraints: "circles centered at the origin where n = <cos t, sin t>, radius 1 to 3; F.n reduces via cos^2 or sin^2 averages; one item asks for the sign of the flux or the radius"
      - id: kp2
        name: "The divergence (flux) form of Green's theorem"
        key_prerequisites: [greens-theorem, computing-div-curl]
        exemplars:
          - problem: 'Use the flux form of Green''s theorem to find the outward flux of $\mathbf{F} = \langle x^2, y^2\rangle$ across the boundary of the unit square $[0,1]\times[0,1]$.'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The divergence is $\operatorname{div}\mathbf{F} = 2x + 2y$. The flux is $\iint_D (2x + 2y)\,dA = 1 + 1 = 2$ over the unit square.'
          - problem: 'Find the outward flux of $\mathbf{F} = \langle x, y\rangle$ across the circle $x^2 + y^2 = 9$.'
            answer: '18pi'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The divergence is $\operatorname{div}\mathbf{F} = 1 + 1 = 2$, a constant. So the flux is $2$ times the area of the disk, $2 \cdot 9\pi = 18\pi$.'
          - problem: 'Find the outward flux of $\mathbf{F} = \langle xy, y^2\rangle$ across the boundary of the unit square $[0,1]\times[0,1]$.'
            answer: '3/2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The divergence is $\operatorname{div}\mathbf{F} = y + 2y = 3y$. The flux is $\int_0^1\int_0^1 3y\,dy\,dx = \tfrac{3}{2}$.'
          - problem: 'Use the flux form of Green''s theorem to find the outward flux of $\mathbf{F} = \langle 2x, 3y\rangle$ across the boundary of the unit square $[0,1]\times[0,1]$.'
            answer: '5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The divergence is $\operatorname{div}\mathbf{F} = 2 + 3 = 5$. The unit square has area $1$, so the flux is $5 \cdot 1 = 5$.'
          - problem: 'Find the outward flux of $\mathbf{F} = \langle x^3, 0\rangle$ across the circle $x^2 + y^2 = 4$.'
            answer: '12pi'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The divergence is $3x^2$. Over the disk of radius $2$ we have $\iint x^2\,dA = \pi\cdot 2^4/4 = 4\pi$, so the flux is $3 \cdot 4\pi = 12\pi$.'
          - problem: 'Find the outward flux of $\mathbf{F} = \langle xy^2, 0\rangle$ across the boundary of the unit square $[0,1]\times[0,1]$.'
            answer: '1/3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The divergence is $\operatorname{div}\mathbf{F} = y^2$. The flux is $\int_0^1\int_0^1 y^2\,dy\,dx = \tfrac{1}{3}$.'
          - problem: 'Water flows over a pond surface with velocity $\mathbf{F} = \langle 2x, 3y\rangle$ metres per second. Find the rate, in square metres per second, at which water leaves the rectangle $0 \le x \le 4$, $0 \le y \le 3$ across its boundary.'
            answer: '60'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The divergence is $\operatorname{div}\mathbf{F} = 2 + 3 = 5$, a constant. The rectangle has area $12$, so the outward flux is $5 \cdot 12 = 60$.'
          - problem: 'Water flows over a plate with velocity $\mathbf{F} = \langle 2x, 3y\rangle$ metres per second. The outward flux across the boundary of a region is $35$ square metres per second. What is the area of the region?'
            answer: '7'
            answer_contract: {"kind": "unit", "quantity": "area", "unit": "m^2", "allow_omitted": true}
            solution_sketch: 'The divergence is $\operatorname{div}\mathbf{F} = 2 + 3 = 5$, so the flux is $5$ times the area. Then $5 \cdot \text{area} = 35$, and the area is $35 \div 5 = 7$ square metres.'
          - problem: 'The velocity field of a liquid is $\mathbf{F} = \langle -x, -y\rangle$. Is the net outflow of liquid across the boundary of the unit disk positive, negative or zero?'
            answer: 'negative'
            answer_contract: {"kind": "label", "options": [["positive", "it is positive", "net outflow", "greater than zero"], ["negative", "it is negative", "net inflow", "less than zero"], ["zero", "it is zero", "no net flow", "0"]]}
            solution_sketch: 'The divergence is $\operatorname{div}\mathbf{F} = -1 - 1 = -2$. So the flux is $-2$ times the area of the disk, which is $-2\pi$, a negative number: liquid flows in.'
          - problem: 'What is the outward flux of $\mathbf{F} = \langle xy, xy\rangle$ out of the unit square $[0,1]\times[0,1]$?'
            answer: '1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Flux uses the divergence $P_x + Q_y$, not $Q_x - P_y$. Here $P_x + Q_y = y + x$, and $\iint_D (x + y)\,dA = \tfrac12 + \tfrac12 = 1$.'
        constraints: "div F is a constant or a single monomial; regions are squares, rectangles and origin-centered disks; contexts use a flow velocity in metres per second"
    diagnostic_exemplar:
      problem: 'Use the flux form of Green''s theorem to find the outward flux of $\mathbf{F} = \langle x^2 y,\; x y^2 \rangle$ across the boundary of the unit square $[0,1]^2$.'
      answer: '$1$'
      solution_sketch: '$\operatorname{div}\mathbf{F} = 2xy + 2xy = 4xy$, so the flux is $\int_0^1\!\int_0^1 4xy\,dx\,dy = 4\cdot\tfrac{1}{2}\cdot\tfrac{1}{2} = 1$.'
    anki_seeds:
      - front: 'Flux (divergence) form of Green''s theorem?'
        back: '$\oint_C \mathbf{F} \cdot \mathbf{n}\, ds = \iint_D \operatorname{div}\mathbf{F}\, dA$, with $\mathbf{n}$ the outward normal.'
        type: basic
      - front: 'The two forms of Green''s theorem measure what quantities?'
        back: 'Tangential form: circulation, via $Q_x - P_y$ (curl). Normal form: outward flux, via $P_x + Q_y$ (divergence).'
        type: basic

  - id: parametrized-surfaces
    name: "Parametrized Surfaces"
    core: true
    difficulty: 0.80
    drill: false
    answer_kind: numeric
    expected_time_secs: 240
    prerequisites:
      - id: vector-valued-functions
        weight: 0.6
        key: true
      - id: cross-product
        weight: 0.7
        key: true
      - id: cylindrical-spherical-coordinates
        weight: 0.4
        key: false
    knowledge_points:
      - id: kp1
        name: "Parametrizing standard surfaces"
        key_prerequisites: [vector-valued-functions]
        exemplars:
          - problem: 'Parametrize the cylinder $x^2 + y^2 = 9$, $0 \le z \le 5$, by $\mathbf{r}(\theta, z)$ with $0 \le \theta \le 2\pi$ and $0 \le z \le 5$. Give $x$, $y$ and $z$ as functions of $\theta$ and $z$.'
            answer: 'x = 3cos(theta); y = 3sin(theta); z = z'
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "function", "vars": ["theta", "z"]}, "name": "x"}, {"contract": {"kind": "function", "vars": ["theta", "z"]}, "name": "y"}, {"contract": {"kind": "function", "vars": ["theta", "z"]}, "name": "z"}]}
            solution_sketch: 'Every point of the cylinder lies on the circle of radius $3$ around the $z$-axis, so $x = 3\cos\theta$ and $y = 3\sin\theta$. The height $z$ is free, which gives $\mathbf{r}(\theta, z) = \langle 3\cos\theta, 3\sin\theta, z\rangle$.'
          - problem: 'The surface $z = x^2 + 2y^2$ lies over the disk $x^2 + y^2 \le 4$. Parametrize it by $\mathbf{r}(u, v)$ with $x = u$ and $y = v$.'
            answer: '(u, v, u^2 + 2v^2)'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A graph $z = f(x, y)$ is parametrized by taking the two inputs as parameters. With $x = u$ and $y = v$ we get $z = u^2 + 2v^2$, so $\mathbf{r}(u, v) = \langle u, v, u^2 + 2v^2\rangle$ for $u^2 + v^2 \le 4$.'
          - problem: 'The plane $z = 5 - 2x + 3y$ lies over the square $0 \le x \le 1$, $0 \le y \le 1$. Parametrize this piece of the plane by $\mathbf{r}(s, t)$ with $x = s$ and $y = t$.'
            answer: '(s, t, 5 - 2s + 3t)'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'With $x = s$ and $y = t$ the height is $z = 5 - 2s + 3t$. So $\mathbf{r}(s, t) = \langle s, t, 5 - 2s + 3t\rangle$ for $0 \le s \le 1$ and $0 \le t \le 1$.'
          - problem: 'Parametrize the sphere $x^2 + y^2 + z^2 = 9$ by $\mathbf{r}(u, v)$, where $u$ is the angle from the positive $z$-axis, $0 \le u \le \pi$, and $v$ is the angle around the $z$-axis, $0 \le v \le 2\pi$. Give $x$, $y$ and $z$ as functions of $u$ and $v$.'
            answer: 'x = 3sin(u)cos(v); y = 3sin(u)sin(v); z = 3cos(u)'
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "function", "vars": ["u", "v"]}, "name": "x"}, {"contract": {"kind": "function", "vars": ["u", "v"]}, "name": "y"}, {"contract": {"kind": "function", "vars": ["u", "v"]}, "name": "z"}]}
            solution_sketch: 'On a sphere of radius $3$ the height is $z = 3\cos u$ and the horizontal distance from the $z$-axis is $3\sin u$. Turning through the angle $v$ gives $x = 3\sin u\cos v$ and $y = 3\sin u\sin v$.'
          - problem: 'Parametrize the cylinder $y^2 + z^2 = 16$, $0 \le x \le 3$, by $\mathbf{r}(\theta, x)$ with $0 \le \theta \le 2\pi$, where $\theta$ is the angle from the positive $y$-axis toward the positive $z$-axis. Give $x$, $y$ and $z$ as functions of $\theta$ and $x$.'
            answer: 'x = x; y = 4cos(theta); z = 4sin(theta)'
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "function", "vars": ["theta", "x"]}, "name": "x"}, {"contract": {"kind": "function", "vars": ["theta", "x"]}, "name": "y"}, {"contract": {"kind": "function", "vars": ["theta", "x"]}, "name": "z"}]}
            solution_sketch: 'This cylinder has the $x$-axis as its axis, so $x$ is free. The circle $y^2 + z^2 = 16$ has radius $4$, so $y = 4\cos\theta$ and $z = 4\sin\theta$, and $\mathbf{r}(\theta, x) = \langle x, 4\cos\theta, 4\sin\theta\rangle$.'
          - problem: 'The upper half of the sphere $x^2 + y^2 + z^2 = 4$, where $z \ge 0$, is parametrized by $\mathbf{r}(u, v) = \langle 2\sin u\cos v, 2\sin u\sin v, 2\cos u\rangle$ with $0 \le v \le 2\pi$ and $0 \le u \le b$. What is the largest value $b$ can have?'
            answer: 'pi/2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The height is $z = 2\cos u$, and the upper half needs $z \ge 0$, so $\cos u \ge 0$. For an angle $u$ measured from the positive $z$-axis this means $u \le \pi/2$, so $b = \pi/2$.'
          - problem: 'A satellite dish is modeled by $\mathbf{r}(u, v) = \langle u, v, \tfrac14(u^2 + v^2)\rangle$, with lengths in metres. Find the point of the dish at $u = 2$, $v = -4$.'
            answer: '(2, -4, 5)'
            answer_contract: {"kind": "coordinates", "arity": 3}
            solution_sketch: 'Put $u = 2$ and $v = -4$ into each component. The $z$-component is $\tfrac14(4 + 16) = 5$, so the point is $(2, -4, 5)$.'
          - problem: 'The wall of a pipe is $\mathbf{r}(\theta, z) = \langle 2\cos\theta, 2\sin\theta, z\rangle$, with lengths in metres. Find the point of the wall at $\theta = \pi/2$ and $z = 3$.'
            answer: '(0, 2, 3)'
            answer_contract: {"kind": "coordinates", "arity": 3}
            solution_sketch: 'Put $\theta = \pi/2$ and $z = 3$ into each component. Then $x = 2\cos(\pi/2) = 0$ and $y = 2\sin(\pi/2) = 2$, so the point is $(0, 2, 3)$.'
          - problem: 'A model of a planet is $\mathbf{r}(\phi, \theta) = \langle 5\sin\phi\cos\theta, 5\sin\phi\sin\theta, 5\cos\phi\rangle$. Find the point at $\phi = \pi/3$ and $\theta = \pi/2$.'
            answer: '(0, 5sqrt(3)/2, 5/2)'
            answer_contract: {"kind": "coordinates", "arity": 3}
            solution_sketch: 'At $\theta = \pi/2$ we have $\cos\theta = 0$ and $\sin\theta = 1$. With $\sin(\pi/3) = \sqrt3/2$ and $\cos(\pi/3) = 1/2$, the point is $(0, 5\sqrt3/2, 5/2)$.'
          - problem: 'A point on the sphere $x^2 + y^2 + z^2 = 18$ is $(3, 0, 3)$. The sphere is parametrized by $\mathbf{r}(u, v) = \langle 3\sqrt2\sin u\cos v, 3\sqrt2\sin u\sin v, 3\sqrt2\cos u\rangle$ with $0 \le u \le \pi$. Which value of $u$ gives this point?'
            answer: 'pi/4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The $z$-coordinate gives $3\sqrt2\cos u = 3$, so $\cos u = 1/\sqrt2$. For $0 \le u \le \pi$ this means $u = \pi/4$.'
          - problem: 'Which surface does $\mathbf{r}(u, v) = \langle 2\cos u, 2\sin u, v\rangle$, with $0 \le u \le 2\pi$ and $0 \le v \le 3$, describe: a cylinder, a sphere, a cone or a plane?'
            answer: 'cylinder'
            answer_contract: {"kind": "label", "options": [["cylinder", "a cylinder", "circular cylinder"], ["sphere", "a sphere"], ["cone", "a cone"], ["plane", "a plane"]]}
            solution_sketch: 'The first two components satisfy $x^2 + y^2 = 4\cos^2 u + 4\sin^2 u = 4$ for every $v$. So every point is at distance $2$ from the $z$-axis, and $v$ is the free height of a cylinder.'
          - problem: 'Parametrize the cylinder $x^2 + y^2 = 16$. What are $x$, $y$ and $z$ as functions of $\theta$ and $z$?'
            answer: 'x = 4cos(theta); y = 4sin(theta); z = z'
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "function", "vars": ["theta", "z"]}, "name": "x"}, {"contract": {"kind": "function", "vars": ["theta", "z"]}, "name": "y"}, {"contract": {"kind": "function", "vars": ["theta", "z"]}, "name": "z"}]}
            solution_sketch: 'The circle $x^2 + y^2 = 16$ has radius $4$, not $16$. So use $x = 4\cos\theta$ and $y = 4\sin\theta$, and $\mathbf{r}(\theta, z) = \langle 4\cos\theta, 4\sin\theta, z\rangle$.'
        constraints: "cylinders, spheres, and graphs; a parametrization is asked as a vector function of named parameters with the domain stated; items may evaluate a parametrization at given parameters"
      - id: kp2
        name: "Normal vectors r_u x r_v"
        key_prerequisites: [vector-valued-functions, cross-product]
        exemplars:
          - problem: 'For the plane $\mathbf{r}(u, v) = \langle u, v, 3 - 2u - v\rangle$, compute $\mathbf{r}_u \times \mathbf{r}_v$.'
            answer: '(2, 1, 1)'
            answer_contract: {"kind": "coordinates", "arity": 3}
            solution_sketch: 'The tangent vectors are $\mathbf{r}_u = \langle 1, 0, -2\rangle$ and $\mathbf{r}_v = \langle 0, 1, -1\rangle$. Their cross product is $\langle 0\cdot(-1) - (-2)\cdot 1,\; (-2)\cdot 0 - 1\cdot(-1),\; 1\cdot 1 - 0\cdot 0\rangle = \langle 2, 1, 1\rangle$.'
          - problem: 'For the cylinder $\mathbf{r}(\theta, z) = \langle 3\cos\theta, 3\sin\theta, z\rangle$, compute $\mathbf{r}_\theta \times \mathbf{r}_z$ at $\theta = \pi/3$.'
            answer: '(3/2, 3sqrt(3)/2, 0)'
            answer_contract: {"kind": "coordinates", "arity": 3}
            solution_sketch: 'The tangent vectors are $\mathbf{r}_\theta = \langle -3\sin\theta, 3\cos\theta, 0\rangle$ and $\mathbf{r}_z = \langle 0, 0, 1\rangle$. In general $\mathbf{r}_\theta \times \mathbf{r}_z = \langle 3\cos\theta, 3\sin\theta, 0\rangle$, which points away from the $z$-axis. At $\theta = \pi/3$ it is $\langle 3/2, 3\sqrt3/2, 0\rangle$.'
          - problem: 'For the plane $\mathbf{r}(u, v) = \langle 2u, v, 4 - u - v\rangle$, compute $\mathbf{r}_u \times \mathbf{r}_v$.'
            answer: '(1, 2, 2)'
            answer_contract: {"kind": "coordinates", "arity": 3}
            solution_sketch: 'The tangent vectors are $\mathbf{r}_u = \langle 2, 0, -1\rangle$ and $\mathbf{r}_v = \langle 0, 1, -1\rangle$. Their cross product is $\langle 0\cdot(-1) - (-1)\cdot 1,\; (-1)\cdot 0 - 2\cdot(-1),\; 2\cdot 1 - 0\cdot 0\rangle = \langle 1, 2, 2\rangle$.'
          - problem: 'For the cylinder $\mathbf{r}(\theta, z) = \langle 5\cos\theta, 5\sin\theta, 2z\rangle$, compute $\mathbf{r}_\theta \times \mathbf{r}_z$ at $\theta = \pi$.'
            answer: '(-10, 0, 0)'
            answer_contract: {"kind": "coordinates", "arity": 3}
            solution_sketch: 'The tangent vectors are $\mathbf{r}_\theta = \langle -5\sin\theta, 5\cos\theta, 0\rangle$ and $\mathbf{r}_z = \langle 0, 0, 2\rangle$. In general their cross product is $\langle 10\cos\theta, 10\sin\theta, 0\rangle$. At $\theta = \pi$ this is $\langle -10, 0, 0\rangle$.'
          - problem: 'For the cylinder $\mathbf{r}(\theta, z) = \langle 4\cos\theta, 4\sin\theta, z\rangle$, compute $\mathbf{r}_\theta \times \mathbf{r}_z$ at $\theta = \pi/2$.'
            answer: '(0, 4, 0)'
            answer_contract: {"kind": "coordinates", "arity": 3}
            solution_sketch: 'In general $\mathbf{r}_\theta \times \mathbf{r}_z = \langle 4\cos\theta, 4\sin\theta, 0\rangle$. At $\theta = \pi/2$ this is $\langle 0, 4, 0\rangle$.'
          - problem: 'For the plane $\mathbf{r}(u, v) = \langle u, v, u + v\rangle$, compute $\mathbf{r}_u \times \mathbf{r}_v$.'
            answer: '(-1, -1, 1)'
            answer_contract: {"kind": "coordinates", "arity": 3}
            solution_sketch: 'The tangent vectors are $\mathbf{r}_u = \langle 1, 0, 1\rangle$ and $\mathbf{r}_v = \langle 0, 1, 1\rangle$. Their cross product is $\langle 0\cdot 1 - 1\cdot 1,\; 1\cdot 0 - 1\cdot 1,\; 1\cdot 1 - 0\cdot 0\rangle = \langle -1, -1, 1\rangle$.'
          - problem: 'A ramp is the plane patch $\mathbf{r}(u, v) = \langle u, v, 1 + 3u - v\rangle$, with lengths in metres. Compute $\mathbf{r}_u \times \mathbf{r}_v$, a vector perpendicular to the ramp.'
            answer: '(-3, 1, 1)'
            answer_contract: {"kind": "coordinates", "arity": 3}
            solution_sketch: 'The tangent vectors are $\mathbf{r}_u = \langle 1, 0, 3\rangle$ and $\mathbf{r}_v = \langle 0, 1, -1\rangle$. Their cross product is $\langle 0\cdot(-1) - 3\cdot 1,\; 3\cdot 0 - 1\cdot(-1),\; 1\cdot 1 - 0\cdot 0\rangle = \langle -3, 1, 1\rangle$.'
          - problem: 'The wall of a tank is $\mathbf{r}(\theta, z) = \langle 2\cos\theta, 2\sin\theta, z\rangle$. At the point $(2, 0, 1)$ does $\mathbf{r}_\theta \times \mathbf{r}_z$ point out of the tank or into it?'
            answer: 'out of the tank'
            answer_contract: {"kind": "label", "options": [["out of the tank", "outward", "out", "it points out of the tank", "points out of the tank", "away from the axis"], ["into the tank", "inward", "in", "it points into the tank", "points into the tank", "toward the axis"]]}
            solution_sketch: 'The point $(2, 0, 1)$ has $\theta = 0$. There $\mathbf{r}_\theta \times \mathbf{r}_z = \langle 2\cos 0, 2\sin 0, 0\rangle = \langle 2, 0, 0\rangle$. This vector points away from the $z$-axis, so it points out of the tank.'
          - problem: 'For the cylinder $\mathbf{r}(\theta, z) = \langle 2\cos\theta, 2\sin\theta, z\rangle$, compute $\mathbf{r}_z \times \mathbf{r}_\theta$ at $\theta = 0$.'
            answer: '(-2, 0, 0)'
            answer_contract: {"kind": "coordinates", "arity": 3}
            solution_sketch: 'At $\theta = 0$ we have $\mathbf{r}_z = \langle 0, 0, 1\rangle$ and $\mathbf{r}_\theta = \langle 0, 2, 0\rangle$. Their cross product is $\langle 0\cdot 0 - 1\cdot 2,\; 1\cdot 0 - 0\cdot 0,\; 0\rangle = \langle -2, 0, 0\rangle$. Reversing the order reverses the vector.'
          - problem: 'For the unit sphere $\mathbf{r}(\phi, \theta) = \langle\sin\phi\cos\theta, \sin\phi\sin\theta, \cos\phi\rangle$, compute $\mathbf{r}_\phi \times \mathbf{r}_\theta$ at $\phi = \pi/2$ and $\theta = 0$.'
            answer: '(1, 0, 0)'
            answer_contract: {"kind": "coordinates", "arity": 3}
            solution_sketch: 'At $\phi = \pi/2$ and $\theta = 0$ we have $\mathbf{r}_\phi = \langle 0, 0, -1\rangle$ and $\mathbf{r}_\theta = \langle 0, 1, 0\rangle$. Their cross product is $\langle 0\cdot 0 - (-1)\cdot 1,\; (-1)\cdot 0 - 0\cdot 0,\; 0\rangle = \langle 1, 0, 0\rangle$, which points away from the center.'
          - problem: 'What is $\mathbf{r}_u \times \mathbf{r}_v$ for the plane $\mathbf{r}(u, v) = \langle u, v, 2u + v\rangle$?'
            answer: '(-2, -1, 1)'
            answer_contract: {"kind": "coordinates", "arity": 3}
            solution_sketch: 'The tangent vectors are $\mathbf{r}_u = \langle 1, 0, 2\rangle$ and $\mathbf{r}_v = \langle 0, 1, 1\rangle$. Their cross product is $\langle 0\cdot 1 - 2\cdot 1,\; 2\cdot 0 - 1\cdot 1,\; 1\rangle = \langle -2, -1, 1\rangle$.'
        constraints: "planes, cylinders and the unit sphere at a point; cross products have clean components; note the geometric direction of the normal and the effect of the order of the factors"
      - id: kp3
        name: "The surface-area element"
        key_prerequisites: [vector-valued-functions, cross-product]
        exemplars:
          - problem: 'Using $dS = |\mathbf{r}_\theta \times \mathbf{r}_z|\,d\theta\,dz$, find the lateral area of the cylinder $x^2 + y^2 = 4$, $0 \le z \le 3$.'
            answer: '12pi'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'With $\mathbf{r}(\theta, z) = \langle 2\cos\theta, 2\sin\theta, z\rangle$ we get $|\mathbf{r}_\theta \times \mathbf{r}_z| = 2$. The area is $\int_0^3\int_0^{2\pi} 2\,d\theta\,dz = 12\pi$, which matches $2\pi r h$.'
          - problem: 'For the plane patch $\mathbf{r}(u, v) = \langle u, v, 2u + 2v\rangle$, compute $|\mathbf{r}_u \times \mathbf{r}_v|$.'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'We have $\mathbf{r}_u \times \mathbf{r}_v = \langle -2, -2, 1\rangle$. Its length is $\sqrt{4 + 4 + 1} = 3$.'
          - problem: 'For the plane patch $\mathbf{r}(u, v) = \langle u, v, 2u + 3v\rangle$, compute $|\mathbf{r}_u \times \mathbf{r}_v|$.'
            answer: 'sqrt(14)'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'We have $\mathbf{r}_u = \langle 1, 0, 2\rangle$ and $\mathbf{r}_v = \langle 0, 1, 3\rangle$, so $\mathbf{r}_u \times \mathbf{r}_v = \langle -2, -3, 1\rangle$. Its length is $\sqrt{4 + 9 + 1} = \sqrt{14}$.'
          - problem: 'Find the lateral surface area of the cylinder $x^2 + y^2 = 16$, $0 \le z \le 6$, using the parametrization $\mathbf{r}(\theta, z) = \langle 4\cos\theta, 4\sin\theta, z\rangle$.'
            answer: '48pi'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Here $|\mathbf{r}_\theta \times \mathbf{r}_z| = 4$, so $dS = 4\,d\theta\,dz$. The area is $\int_0^6\int_0^{2\pi} 4\,d\theta\,dz = 4 \cdot 2\pi \cdot 6 = 48\pi$.'
          - problem: 'For the plane patch $\mathbf{r}(u, v) = \langle u, v, 1 + u + 2v\rangle$ over $0 \le u \le 2$, $0 \le v \le 5$, find its area.'
            answer: '10sqrt(6)'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'We have $\mathbf{r}_u \times \mathbf{r}_v = \langle -1, -2, 1\rangle$, whose length is $\sqrt6$. This is constant, so the area is $\sqrt6 \cdot 2 \cdot 5 = 10\sqrt6$.'
          - problem: 'For the cylinder $\mathbf{r}(\theta, z) = \langle 7\cos\theta, 7\sin\theta, z\rangle$, compute $|\mathbf{r}_\theta \times \mathbf{r}_z|$.'
            answer: '7'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'We have $\mathbf{r}_\theta \times \mathbf{r}_z = \langle 7\cos\theta, 7\sin\theta, 0\rangle$. Its length is $\sqrt{49\cos^2\theta + 49\sin^2\theta} = 7$.'
          - problem: 'A cylindrical tank has radius $3$ metres and height $4$ metres. One litre of paint covers $2$ square metres. How many litres of paint cover the whole curved wall of the tank?'
            answer: '12pi'
            answer_contract: {"kind": "unit", "quantity": "volume", "unit": "L", "allow_omitted": true}
            solution_sketch: 'Use $\mathbf{r}(\theta, z) = \langle 3\cos\theta, 3\sin\theta, z\rangle$, so $|\mathbf{r}_\theta \times \mathbf{r}_z| = 3$. The wall has area $3 \cdot 2\pi \cdot 4 = 24\pi$ square metres. Each litre covers $2$ square metres, so the paint needed is $24\pi \div 2 = 12\pi$ litres.'
          - problem: 'A chimney is a cylinder of radius $1$ metre. Its curved wall has area $20\pi$ square metres. How tall is the chimney?'
            answer: '10'
            answer_contract: {"kind": "unit", "quantity": "length", "unit": "m", "allow_omitted": true}
            solution_sketch: 'With $\mathbf{r}(\theta, z) = \langle\cos\theta, \sin\theta, z\rangle$ we get $|\mathbf{r}_\theta \times \mathbf{r}_z| = 1$, so the area is $2\pi h$. Then $2\pi h = 20\pi$ gives $h = 10$ metres.'
          - problem: 'A sloping roof is the plane patch $\mathbf{r}(u, v) = \langle u, v, 3 + u + 2v\rangle$ over $0 \le u \le 4$, $0 \le v \le 5$, with lengths in metres. Roofing costs $12$ dollars per square metre. What does it cost to cover the roof?'
            answer: '240sqrt(6)'
            answer_contract: {"kind": "unit", "quantity": "dollar", "unit": "dollar", "allow_omitted": true}
            solution_sketch: 'We have $|\mathbf{r}_u \times \mathbf{r}_v| = |\langle -1, -2, 1\rangle| = \sqrt6$. The area is $\sqrt6 \cdot 4 \cdot 5 = 20\sqrt6$ square metres. At $12$ dollars per square metre the cost is $240\sqrt6$ dollars.'
          - problem: 'Find the lateral area of the cylinder $x^2 + y^2 = 9$, $0 \le z \le 4$.'
            answer: '24pi'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'For $\mathbf{r}(\theta, z) = \langle 3\cos\theta, 3\sin\theta, z\rangle$ the factor $|\mathbf{r}_\theta \times \mathbf{r}_z|$ is $3$, the radius, not $9$. The area is $3 \cdot 2\pi \cdot 4 = 24\pi$.'
        constraints: "constant |r_u x r_v| on planes and cylinders; results reconcile with elementary area formulas; contexts include paint, cost and finding a height from an area"
    diagnostic_exemplar:
      problem: 'Find the lateral surface area of the cylinder $x^2 + y^2 = 4$, $0 \le z \le 5$, by parametrizing the surface and using $dS = |\mathbf{r}_\theta \times \mathbf{r}_z|\,d\theta\,dz$.'
      answer: '$20\pi$'
      solution_sketch: '$\mathbf{r}(\theta, z) = \langle 2\cos\theta, 2\sin\theta, z \rangle$ gives $\mathbf{r}_\theta \times \mathbf{r}_z = \langle 2\cos\theta, 2\sin\theta, 0 \rangle$ of magnitude $2$, so the area is $\int_0^{2\pi}\!\int_0^5 2\,dz\,d\theta = 20\pi$.'
    anki_seeds:
      - front: 'Normal vector to a parametrized surface $\mathbf{r}(u, v)$?'
        back: '$\mathbf{N} = \mathbf{r}_u \times \mathbf{r}_v$'
        type: basic
      - front: 'Surface-area element for a parametrized surface?'
        back: '$dS = |\mathbf{r}_u \times \mathbf{r}_v| \, du \, dv$'
        type: basic

  - id: surface-integrals
    name: "Surface Integrals and Flux"
    core: false                # feeds only the terminal flux/theorem branch (divergence-curl capstone + the supplemental general-flux/Stokes/divergence topics)
    difficulty: 0.84
    drill: false
    answer_kind: numeric
    expected_time_secs: 300
    prerequisites:
      - id: parametrized-surfaces
        weight: 0.8
        key: true
      - id: surface-area-double-integrals
        weight: 0.5
        key: true
      - id: double-integrals
        weight: 0.4
        key: false
    knowledge_points:
      - id: kp1
        name: "Scalar surface integrals"
        key_prerequisites: [parametrized-surfaces, surface-area-double-integrals]
        exemplars:
          - problem: 'Evaluate $\iint_S z\,dS$, where $S$ is the part of the plane $z = x + y$ over the square $0 \le x \le 1$, $0 \le y \le 1$.'
            answer: 'sqrt(3)'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'For $z = x + y$ we have $z_x = z_y = 1$, so $dS = \sqrt{1 + 1 + 1}\,dA = \sqrt3\,dA$. Then $\iint_S z\,dS = \sqrt3\iint_D (x + y)\,dA = \sqrt3 \cdot 1 = \sqrt3$.'
          - problem: 'Evaluate $\iint_S z\,dS$, where $S$ is the part of the plane $z = 1 - x - y$ over the triangle $x \ge 0$, $y \ge 0$, $x + y \le 1$.'
            answer: 'sqrt(3)/6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'For $z = 1 - x - y$ we have $dS = \sqrt{1 + 1 + 1}\,dA = \sqrt3\,dA$. Then $\iint_S z\,dS = \sqrt3\iint_D (1 - x - y)\,dA = \sqrt3 \cdot \tfrac16 = \tfrac{\sqrt3}{6}$.'
          - problem: 'Evaluate $\iint_S z\,dS$, where $S$ is the upper unit hemisphere $x^2 + y^2 + z^2 = 1$, $z \ge 0$.'
            answer: 'pi'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Use spherical parameters, where $z = \cos\phi$ and $dS = \sin\phi\,d\phi\,d\theta$. Then $\int_0^{2\pi}\int_0^{\pi/2}\cos\phi\sin\phi\,d\phi\,d\theta = 2\pi \cdot \tfrac12 = \pi$.'
          - problem: 'Evaluate $\iint_S (x + y)\,dS$, where $S$ is the part of the plane $z = 6 - 2x - 3y$ over the square $0 \le x \le 1$, $0 \le y \le 1$.'
            answer: 'sqrt(14)'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Here $z_x = -2$ and $z_y = -3$, so $dS = \sqrt{1 + 4 + 9}\,dA = \sqrt{14}\,dA$. Then $\iint_S (x + y)\,dS = \sqrt{14}\iint_D (x + y)\,dA = \sqrt{14} \cdot 1 = \sqrt{14}$.'
          - problem: 'Evaluate $\iint_S z\,dS$, where $S$ is the cylinder $x^2 + y^2 = 4$, $0 \le z \le 3$.'
            answer: '18pi'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'With $\mathbf{r}(\theta, z) = \langle 2\cos\theta, 2\sin\theta, z\rangle$ we have $dS = 2\,d\theta\,dz$. Then $\iint_S z\,dS = \int_0^{2\pi}\int_0^3 2z\,dz\,d\theta = 2\pi \cdot 9 = 18\pi$.'
          - problem: 'The upper half of a hollow ball, $x^2 + y^2 + z^2 = 4$, $z \ge 0$, is a thin shell whose density at height $z$ is $z$ kilograms per square metre. Find the mass of the shell in kilograms.'
            answer: '8pi'
            answer_contract: {"kind": "unit", "quantity": "mass", "unit": "kg", "allow_omitted": true}
            solution_sketch: 'The mass is $\iint_S z\,dS$. On a sphere of radius $2$ we have $z = 2\cos\phi$ and $dS = 4\sin\phi\,d\phi\,d\theta$. So the mass is $\int_0^{2\pi}\int_0^{\pi/2} 8\cos\phi\sin\phi\,d\phi\,d\theta = 2\pi \cdot 4 = 8\pi$.'
          - problem: 'A dome is the upper unit hemisphere $x^2 + y^2 + z^2 = 1$, $z \ge 0$, with lengths in metres. Its mean height is $\iint_S z\,dS$ divided by the area of the dome. Find the mean height.'
            answer: '1/2'
            answer_contract: {"kind": "unit", "quantity": "length", "unit": "m", "allow_omitted": true}
            solution_sketch: 'We know $\iint_S z\,dS = \pi$ for the upper unit hemisphere. The area of the dome is half the area of the unit sphere, $2\pi$. So the mean height is $\pi \div 2\pi = \tfrac12$ metre.'
          - problem: 'Evaluate $\iint_S z\,dS$ over the upper unit hemisphere.'
            answer: 'pi'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'On the hemisphere $dS = dA/z$, so $z\,dS = dA$. The integral is $\iint_D 1\,dA = \pi$, the area of the unit disk.'
        constraints: "planes over triangles/squares, hemispheres and cylinders; dS is constant or sin(phi); contexts are shell mass and mean height"
      - id: kp2
        name: "Flux integrals through closed and simple surfaces"
        key_prerequisites: [parametrized-surfaces, surface-area-double-integrals]
        exemplars:
          - problem: 'Find the upward flux of $\mathbf{F} = \langle 0, 0, 3\rangle$ through the disk $x^2 + y^2 \le 4$ in the plane $z = 0$.'
            answer: '12pi'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The upward unit normal of the disk is $\mathbf{n} = \langle 0, 0, 1\rangle$, so $\mathbf{F}\cdot\mathbf{n} = 3$. The flux is $3$ times the area of the disk, $3 \cdot 4\pi = 12\pi$.'
          - problem: 'Find the outward flux of $\mathbf{F} = \langle x, y, z\rangle$ through the unit sphere.'
            answer: '4pi'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'On the unit sphere the outward normal is $\mathbf{n} = \langle x, y, z\rangle$, so $\mathbf{F}\cdot\mathbf{n} = x^2 + y^2 + z^2 = 1$. The flux is the surface area, $4\pi$.'
          - problem: 'Find the outward flux of $\mathbf{F} = \langle x, y, 0\rangle$ through the curved surface of the cylinder $x^2 + y^2 = 1$, $0 \le z \le 2$.'
            answer: '4pi'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'On the cylinder $\mathbf{n} = \langle x, y, 0\rangle$, so $\mathbf{F}\cdot\mathbf{n} = x^2 + y^2 = 1$. The flux equals the area of the curved surface, $2\pi \cdot 1 \cdot 2 = 4\pi$.'
          - problem: 'A constant field $\mathbf{F} = \langle 0, 0, 5\rangle$ crosses the disk $x^2 + y^2 \le 9$ lying in the plane $z = 2$. Find the upward flux.'
            answer: '45pi'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The upward unit normal is $\langle 0, 0, 1\rangle$, so $\mathbf{F}\cdot\mathbf{n} = 5$. The disk has radius $3$ and area $9\pi$, so the flux is $5 \cdot 9\pi = 45\pi$.'
          - problem: 'The field $\mathbf{F} = \langle x, y, z\rangle$ points away from the origin. Find its outward flux through the sphere $x^2 + y^2 + z^2 = 9$.'
            answer: '108pi'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'On this sphere $\mathbf{n} = \langle x, y, z\rangle/3$, so $\mathbf{F}\cdot\mathbf{n} = (x^2 + y^2 + z^2)/3 = 9/3 = 3$. The sphere has area $4\pi \cdot 9 = 36\pi$, so the flux is $3 \cdot 36\pi = 108\pi$.'
          - problem: 'Find the outward flux of $\mathbf{F} = \langle x, y, 0\rangle$ through the curved surface of the cylinder $x^2 + y^2 = 4$, $0 \le z \le 3$.'
            answer: '24pi'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'On this cylinder $\mathbf{n} = \langle x, y, 0\rangle/2$, so $\mathbf{F}\cdot\mathbf{n} = (x^2 + y^2)/2 = 2$. The curved surface has area $2\pi \cdot 2 \cdot 3 = 12\pi$, so the flux is $2 \cdot 12\pi = 24\pi$.'
          - problem: 'Rain falls straight down at $5$ metres per second. Find the volume of rain, in cubic metres per second, that falls through a horizontal circular hatch of radius $2$ metres.'
            answer: '20pi'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The velocity is $\langle 0, 0, -5\rangle$, and the unit normal pointing down is $\langle 0, 0, -1\rangle$. So $\mathbf{F}\cdot\mathbf{n} = 5$, and the flux is $5 \cdot \pi \cdot 2^2 = 20\pi$ cubic metres per second.'
          - problem: 'Water flows straight up through a horizontal circular pipe opening at $4$ metres per second. The volume of water that crosses the opening is $36\pi$ cubic metres per second. What is the radius of the opening?'
            answer: '3'
            answer_contract: {"kind": "unit", "quantity": "length", "unit": "m", "allow_omitted": true}
            solution_sketch: 'The flux is the speed times the area, so $4 \cdot \pi R^2 = 36\pi$. Dividing by $4\pi$ gives $R^2 = 9$, so the radius is $R = 3$ metres.'
          - problem: 'Air moves with the horizontal velocity $\mathbf{F} = \langle x, y, 0\rangle$. Is the flux through the disk $x^2 + y^2 \le 4$ in the plane $z = 1$, with upward normal, positive, negative or zero?'
            answer: 'zero'
            answer_contract: {"kind": "label", "options": [["zero", "it is zero", "no flux", "0"], ["positive", "it is positive", "greater than zero"], ["negative", "it is negative", "less than zero"]]}
            solution_sketch: 'The upward normal of the disk is $\langle 0, 0, 1\rangle$, so $\mathbf{F}\cdot\mathbf{n} = 0$ at every point. The flux is $0$, because the air moves along the disk and not through it.'
          - problem: 'Compute the outward flux of $\mathbf{F} = \langle x, y, z\rangle$ through the sphere $x^2 + y^2 + z^2 = 4$.'
            answer: '32pi'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'On this sphere $\mathbf{n} = \langle x, y, z\rangle/2$, so $\mathbf{F}\cdot\mathbf{n} = 4/2 = 2$, not $1$. The sphere has area $4\pi \cdot 4 = 16\pi$, so the flux is $2 \cdot 16\pi = 32\pi$.'
        constraints: "surfaces where F.n is constant (radial fields on spheres/cylinders, constant fields on flat disks); contexts are flow rates and finding a radius"
      - id: kp3
        name: "Flux through graphs z = g(x, y)"
        key_prerequisites: [parametrized-surfaces, surface-area-double-integrals]
        exemplars:
          - problem: 'Find the upward flux of $\mathbf{F} = \langle y, x, z\rangle$ through the part of the plane $z = 1 - x - y$ over the triangle $x \ge 0$, $y \ge 0$, $x + y \le 1$.'
            answer: '1/2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The upward normal is $\langle -g_x, -g_y, 1\rangle = \langle 1, 1, 1\rangle$. Then $\mathbf{F}\cdot\mathbf{N} = y + x + (1 - x - y) = 1$, and the flux is $\iint_D 1\,dA = \tfrac12$.'
          - problem: 'Find the upward flux of $\mathbf{F} = \langle 0, 0, x\rangle$ through the part of the plane $z = x + y$ over the square $0 \le x \le 1$, $0 \le y \le 1$.'
            answer: '1/2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The upward normal is $\langle -1, -1, 1\rangle$, so $\mathbf{F}\cdot\mathbf{N} = x$. The flux is $\int_0^1\int_0^1 x\,dx\,dy = \tfrac12$.'
          - problem: 'Find the upward flux of $\mathbf{F} = \langle 0, 0, z\rangle$ through the part of the plane $z = x + y$ over the triangle $x \ge 0$, $y \ge 0$, $x + y \le 1$.'
            answer: '1/3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The upward normal is $\langle -1, -1, 1\rangle$, so $\mathbf{F}\cdot\mathbf{N} = z = x + y$. Over the triangle $\iint_D (x + y)\,dA = \tfrac13$, which is the flux.'
          - problem: 'Find the upward flux of $\mathbf{F} = \langle 0, 0, xy\rangle$ through the part of the plane $z = x + y$ over the square $0 \le x \le 1$, $0 \le y \le 1$.'
            answer: '1/4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The upward normal is $\langle -1, -1, 1\rangle$, so $\mathbf{F}\cdot\mathbf{N} = xy$. The flux is $\int_0^1\int_0^1 xy\,dx\,dy = \tfrac12\cdot\tfrac12 = \tfrac14$.'
          - problem: 'Find the upward flux of $\mathbf{F} = \langle x, y, z\rangle$ through the part of the paraboloid $z = x^2 + y^2$ over the square $0 \le x \le 1$, $0 \le y \le 1$.'
            answer: '-2/3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The upward normal is $\langle -2x, -2y, 1\rangle$. So $\mathbf{F}\cdot\mathbf{N} = -2x^2 - 2y^2 + (x^2 + y^2) = -x^2 - y^2$, and the flux is $-\tfrac13 - \tfrac13 = -\tfrac23$. The flux is negative because the field points into the bowl.'
          - problem: 'Find the upward flux of $\mathbf{F} = \langle 0, 0, xy\rangle$ through the part of the plane $z = x + y$ over the triangle $x \ge 0$, $y \ge 0$, $x + y \le 1$.'
            answer: '1/24'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The upward normal is $\langle -1, -1, 1\rangle$, so $\mathbf{F}\cdot\mathbf{N} = xy$. Over the triangle $\iint_D xy\,dA = \tfrac1{24}$, which is the flux.'
          - problem: 'Wind blows with velocity $\mathbf{F} = \langle x, y, z\rangle$ metres per second. A roof is the part of the plane $z = 3 - x - y$ over the triangle $x \ge 0$, $y \ge 0$, $x + y \le 1$. Find the volume of air, in cubic metres per second, that crosses the roof upward.'
            answer: '3/2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The upward normal is $\langle 1, 1, 1\rangle$, so $\mathbf{F}\cdot\mathbf{N} = x + y + (3 - x - y) = 3$. The triangle has area $\tfrac12$, so the flux is $3 \cdot \tfrac12 = \tfrac32$.'
          - problem: 'Rain falls straight down at $2$ metres per second onto a sloping roof, the part of the plane $z = x + 2y$ over the rectangle $0 \le x \le 2$, $0 \le y \le 3$, with lengths in metres. Find the volume of rain, in cubic metres per second, that hits the roof.'
            answer: '12'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The velocity is $\mathbf{F} = \langle 0, 0, -2\rangle$ and the downward normal is $\langle 1, 2, -1\rangle$, so $\mathbf{F}\cdot\mathbf{N} = 2$. The rectangle has area $6$, so the volume of rain per second is $2 \cdot 6 = 12$ cubic metres.'
          - problem: 'The upward flux of $\mathbf{F} = \langle 0, 0, c\rangle$ through the part of the plane $z = x + 2y$ over the rectangle $0 \le x \le 2$, $0 \le y \le 3$ is $30$. Find the constant $c$.'
            answer: '5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The upward normal is $\langle -1, -2, 1\rangle$, so $\mathbf{F}\cdot\mathbf{N} = c$. The flux is $c$ times the area of the rectangle, which is $6$. Then $6c = 30$, so $c = 5$.'
          - problem: 'Find the upward flux of $\mathbf{F} = \langle x, 0, 0\rangle$ through the part of the plane $z = x + y$ over the square $0 \le x \le 1$, $0 \le y \le 1$.'
            answer: '-1/2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The upward normal is $\langle -g_x, -g_y, 1\rangle = \langle -1, -1, 1\rangle$, not $\langle 1, 1, 1\rangle$. So $\mathbf{F}\cdot\mathbf{N} = -x$, and the flux is $-\int_0^1\int_0^1 x\,dx\,dy = -\tfrac12$.'
        constraints: "flux formula F . <-g_x, -g_y, 1> dA over triangles/squares/rectangles; integrands collapse to constants or single monomials; one paraboloid item"
    diagnostic_exemplar:
      problem: 'Find the upward flux of $\mathbf{F} = \langle x,\; y,\; z \rangle$ through the part of the plane $z = 2 - x - y$ lying over the triangle $x \ge 0$, $y \ge 0$, $x + y \le 2$.'
      answer: '$4$'
      solution_sketch: 'For a graph $z = g(x,y)$ with upward normal, the flux is $\iint_D (-F_1 g_x - F_2 g_y + F_3)\,dA = \iint_D \left(x + y + (2 - x - y)\right)dA = \iint_D 2\,dA$. The triangle has area $2$, so the flux is $4$.'
    anki_seeds:
      - front: 'Flux integral of $\mathbf{F}$ through a parametrized surface $\mathbf{r}(u, v)$?'
        back: '$\iint_S \mathbf{F} \cdot d\mathbf{S} = \iint_D \mathbf{F} \cdot (\mathbf{r}_u \times \mathbf{r}_v)\, du\, dv$'
        type: basic
      - front: 'Upward flux of $\mathbf{F} = \langle P, Q, R \rangle$ through the graph $z = g(x, y)$?'
        back: '$\iint_D \mathbf{F} \cdot \langle -g_x, -g_y, 1 \rangle \, dA$'
        type: basic

  - id: divergence-curl
    name: "Divergence, Curl, and the Big Theorems"
    core: false                # gentle first statement of the big theorems; feeds only the supplemental stokes-theorem / divergence-theorem topics
    difficulty: 0.85
    drill: false
    answer_kind: numeric
    expected_time_secs: 240
    prerequisites:
      - id: computing-div-curl
        weight: 0.8
        key: true
      - id: surface-integrals
        weight: 0.6
        key: true
      - id: greens-theorem
        weight: 0.4
        key: false
    knowledge_points:
      - id: kp1
        name: "Interpreting divergence and curl"
        key_prerequisites: [computing-div-curl]
        try_first:
          problem: 'Air flows along the $x$-axis with velocity $\mathbf{F} = \langle 6x,\, 0,\, 0 \rangle$, so it moves faster where $x$ is larger. A cube $[0,1]^3$ has the face $x = 0$ and the face $x = 1$ across the flow. How much more air leaves through the face $x = 1$ than enters through the face $x = 0$ each second?'
          answer_contract: {"kind":"exact"}
          answer: '6'
          reveal: 'Air leaves at speed $6$ and enters at speed $0$ across faces of area $1$, so the net outflow is $6$. This equals $\partial_x(6x) = 6$, the divergence: the net outflow per unit volume.'
        exemplars:
          - problem: 'Find the divergence of $\mathbf{F} = \langle 2x,\, 3y,\, -z \rangle$.'
            answer: '4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Differentiate each component with respect to its own variable: $\partial_x(2x) = 2$, $\partial_y(3y) = 3$ and $\partial_z(-z) = -1$. The sum is $2 + 3 - 1 = 4$, so $\operatorname{div}\mathbf{F} = 4$.'
          - problem: 'Water in a flat basin moves with velocity $\mathbf{F} = \langle -x,\, -y \rangle$. Near the origin, does the flow act as a source or as a sink?'
            answer: 'sink'
            answer_contract: {"kind":"label","options":[["sink","a sink","it is a sink","it acts as a sink","the origin is a sink","the origin acts as a sink","the flow acts as a sink"],["source","a source","it is a source","it acts as a source","the origin is a source","the origin acts as a source","the flow acts as a source"]]}
            solution_sketch: 'The divergence is $\partial_x(-x) + \partial_y(-y) = -1 - 1 = -2$. A negative divergence means that fluid is drawn in at each point, so the origin acts as a sink.'
          - problem: 'In a stirred tank the water has velocity $\mathbf{F} = \langle -2y,\, 2x,\, 0 \rangle$ in meters per second. Find the curl of $\mathbf{F}$.'
            answer: '(0, 0, 4)'
            answer_contract: {"kind":"coordinates","arity":3}
            solution_sketch: 'Only the $z$-component can be nonzero: $\partial_x(2x) - \partial_y(-2y) = 2 + 2 = 4$. The other two components are $0$, so $\operatorname{curl}\mathbf{F} = \langle 0, 0, 4 \rangle$ and the water spins counterclockwise about the $z$-axis.'
          - problem: 'A small paddle wheel is placed in the flow $\mathbf{F} = \langle yz,\, xz,\, xy \rangle$. Does the wheel spin?'
            answer: 'no'
            answer_contract: {"kind":"label","options":[["no","would not spin","does not spin","irrotational","it does not spin","the wheel does not spin","the wheel would not spin"],["yes","would spin","spins","rotational","it spins","the wheel spins","the wheel would spin","it would spin"]]}
            solution_sketch: 'The curl is $\langle \partial_y(xy) - \partial_z(xz),\ \partial_z(yz) - \partial_x(xy),\ \partial_x(xz) - \partial_y(yz) \rangle = \langle x - x,\ y - y,\ z - z \rangle = \langle 0, 0, 0 \rangle$. A zero curl means no local rotation, so the wheel does not spin.'
          - problem: 'Gas leaves a small source with velocity $\mathbf{F} = \langle kx,\, ky,\, kz \rangle$, where $k$ is a constant. The divergence of the field is $15$. Find $k$.'
            answer: '5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The divergence is $k + k + k = 3k$. Setting $3k = 15$ and dividing both sides by $3$ gives $k = 5$.'
          - problem: 'What is the divergence of $\mathbf{F} = \langle xy,\, yz,\, zx \rangle$?'
            answer: 'x + y + z'
            answer_contract: {"kind":"function","vars":["x","y","z"]}
            solution_sketch: 'The three partial derivatives are $\partial_x(xy) = y$, $\partial_y(yz) = z$ and $\partial_z(zx) = x$. The divergence is a scalar, so add them: $\operatorname{div}\mathbf{F} = x + y + z$.'
          - problem: 'The velocity of water in a whirlpool is $\mathbf{F} = \langle -ay,\, ax,\, 0 \rangle$, where $a$ is a constant, and the $z$-component of its curl is $14$. Find $a$.'
            answer: '7'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The $z$-component of the curl is $\partial_x(ax) - \partial_y(-ay) = a + a = 2a$. Setting $2a = 14$ gives $a = 7$.'
        constraints: "radial vs rotational model fields; interpretation must name source/sink or axis and sense of rotation"
      - id: kp2
        name: "The divergence theorem"
        key_prerequisites: [computing-div-curl, surface-integrals]
        exemplars:
          - problem: 'Use the divergence theorem to find the outward flux of $\mathbf{F} = \langle 2x,\, 3y,\, 4z \rangle$ through the boundary of the box $[0,2] \times [0,1] \times [0,1]$.'
            answer: '18'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The divergence is $2 + 3 + 4 = 9$, a constant. The box has volume $2 \cdot 1 \cdot 1 = 2$, so the outward flux is $9 \cdot 2 = 18$.'
          - problem: 'A gas expands with velocity $\mathbf{F} = \langle 2x,\, 2y,\, 2z \rangle$ in meters per second. At what rate, in cubic meters per second, does the gas leave a sphere of radius $3$ m centered at the origin?'
            answer: '216pi'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The divergence is $2 + 2 + 2 = 6$. The sphere encloses a ball of volume $\frac{4}{3}\pi(3)^3 = 36\pi$, so the rate is $6 \cdot 36\pi = 216\pi$.'
          - problem: 'Fluid moves with velocity $\mathbf{F} = \langle x,\, y,\, z \rangle$ in meters per second. It leaves a sphere centered at the origin at a net rate of $32\pi$ cubic meters per second. Find the radius of the sphere.'
            answer: '2'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'The divergence is $3$, so the net rate is $3 \cdot \frac{4}{3}\pi R^3 = 4\pi R^3$. Setting $4\pi R^3 = 32\pi$ gives $R^3 = 8$, so $R = 2$ meters.'
          - problem: 'Use the divergence theorem to find the outward flux of $\mathbf{F} = \langle x^2,\, 2y,\, 3z \rangle$ through the boundary of the unit cube $[0,1]^3$.'
            answer: '6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The divergence is $2x + 2 + 3 = 2x + 5$. Over the unit cube, $\iiint (2x + 5)\,dV = 1 + 5 = 6$.'
          - problem: 'Air in a room shaped like a box $2$ m by $3$ m by $1$ m has velocity $\mathbf{F} = \langle cx,\, y,\, 2z \rangle$ meters per second, where $c$ is a constant. Air leaves through the walls at a net rate of $66$ cubic meters per second. Find $c$.'
            answer: '8'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The divergence is $c + 1 + 2 = c + 3$, a constant. The volume is $2 \cdot 3 \cdot 1 = 6$, so $6(c + 3) = 66$. Dividing by $6$ gives $c + 3 = 11$, so $c = 8$.'
          - problem: 'Use the divergence theorem for $\mathbf{F} = \langle x,\, y,\, z \rangle$ on the ball of radius $2$. What is the flux?'
            answer: '32pi'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The divergence theorem integrates over the volume, not the surface. The ball has volume $\frac{4}{3}\pi(2)^3 = \frac{32\pi}{3}$, so the flux is $3 \cdot \frac{32\pi}{3} = 32\pi$.'
          - problem: 'Air moves with velocity $\mathbf{F} = \langle -2x,\, -2y,\, z \rangle$ near the unit sphere centered at the origin. Does the net flow of air leave the sphere or enter it?'
            answer: 'enters'
            answer_contract: {"kind":"label","options":[["enters","air enters","it enters","flows in","net inflow","the air enters","air flows in","the air flows in"],["leaves","air leaves","it leaves","flows out","net outflow","the air leaves","air flows out","the air flows out"]]}
            solution_sketch: 'The divergence is $-2 - 2 + 1 = -3$, which is negative everywhere. By the divergence theorem the outward flux is $-3$ times the volume of the ball, a negative number, so air enters the sphere on balance.'
        constraints: "div F constant or linear; solids are balls and boxes with known volumes"
      - id: kp3
        name: "Stokes' theorem"
        key_prerequisites: [computing-div-curl, surface-integrals]
        exemplars:
          - problem: 'Use Stokes'' theorem to evaluate $\oint_C \mathbf{F} \cdot d\mathbf{r}$ for $\mathbf{F} = \langle -3y,\, 3x,\, 0 \rangle$, where $C$ is the circle $x^2 + y^2 = 4$ in the plane $z = 0$, oriented counterclockwise as seen from above.'
            answer: '24pi'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The curl is $\langle 0, 0, 3 - (-3) \rangle = \langle 0, 0, 6 \rangle$. With the upward normal on the disk of radius $2$, the flux is $6 \cdot \pi \cdot 2^2 = 24\pi$.'
          - problem: 'Water in a circular pond of radius $5$ m swirls with velocity $\mathbf{F} = \langle -y,\, x,\, 0 \rangle$ meters per second, where the origin is the center of the pond. Find the circulation of the velocity around the shoreline, traveled counterclockwise as seen from above.'
            answer: '50pi'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The curl is $\langle 0, 0, 2 \rangle$, so the circulation equals $2$ times the area of the pond. The area is $\pi \cdot 5^2 = 25\pi$, so the circulation is $50\pi$.'
          - problem: 'A whirlpool in a circular pool has velocity $\mathbf{F} = \langle -5y,\, 5x,\, 0 \rangle$ meters per second, where the origin is the center of the pool. The circulation around the rim, counterclockwise as seen from above, is $160\pi$. Find the radius of the pool.'
            answer: '4'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'The curl is $\langle 0, 0, 10 \rangle$, so the circulation is $10\pi r^2$. Setting $10\pi r^2 = 160\pi$ gives $r^2 = 16$, so $r = 4$ meters.'
          - problem: 'Use Stokes'' theorem to evaluate $\oint_C \mathbf{F} \cdot d\mathbf{r}$ for $\mathbf{F} = \langle 2y,\, -2x,\, 0 \rangle$, where $C$ is the circle $x^2 + y^2 = 16$ in the plane $z = 0$, oriented counterclockwise as seen from above.'
            answer: '-64pi'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The curl is $\langle 0, 0, -2 - 2 \rangle = \langle 0, 0, -4 \rangle$. The disk has area $16\pi$, so the circulation is $-4 \cdot 16\pi = -64\pi$.'
          - problem: 'Use Stokes'' theorem to evaluate $\oint_C \mathbf{F} \cdot d\mathbf{r}$ for $\mathbf{F} = \langle -y,\, x,\, z^2 \rangle$, where $C$ is the circle $x^2 + y^2 = 4$ in the plane $z = 3$, oriented counterclockwise as seen from above.'
            answer: '8pi'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The curl is $\langle 0, 0, 2 \rangle$, because the term $z^2$ does not change it. The disk bounded by $C$ has radius $2$ and area $4\pi$, so the circulation is $2 \cdot 4\pi = 8\pi$.'
          - problem: 'Let $\mathbf{F} = \langle -y,\, x,\, 0 \rangle$. Use Stokes'' theorem to find the flux of $\operatorname{curl}\mathbf{F}$ through the disk $x^2 + y^2 \le 36$ in the plane $z = 2$, with upward normal.'
            answer: '72pi'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The curl is $\langle 0, 0, 2 \rangle$ and the upward normal is $\langle 0, 0, 1 \rangle$, so the integrand is the constant $2$. The disk has area $36\pi$, so the flux is $72\pi$.'
          - problem: 'What is the circulation of $\mathbf{F} = \langle -y,\, x,\, 0 \rangle$ around the unit circle, counterclockwise as seen from above?'
            answer: '2pi'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The circulation needs the curl. The curl is $\langle 0, 0, 2 \rangle$, so the circulation is $2$ times the area $\pi$, which is $2\pi$.'
          - problem: 'Let $C$ be the unit circle in the $xy$-plane, traveled counterclockwise as seen from above. Is the circulation of $\mathbf{F} = \langle y,\, -x,\, 0 \rangle$ around $C$ positive or negative?'
            answer: 'negative'
            answer_contract: {"kind":"label","options":[["negative","it is negative","less than zero","the circulation is negative","negative circulation","circulation is negative"],["positive","it is positive","greater than zero","the circulation is positive","positive circulation","circulation is positive"]]}
            solution_sketch: 'The curl is $\langle 0, 0, -1 - 1 \rangle = \langle 0, 0, -2 \rangle$. The circulation is $-2$ times the area $\pi$, which is $-2\pi$, so it is negative.'
        constraints: "constant-curl fields over flat disks; orientation counterclockwise from above with upward normal"
    diagnostic_exemplar:
      problem: 'Use Stokes'' theorem to evaluate $\oint_C \mathbf{F} \cdot d\mathbf{r}$ for $\mathbf{F} = \langle -y,\; x,\; z^2 \rangle$, where $C$ is the circle $x^2 + y^2 = 9$ in the plane $z = 0$, counterclockwise seen from above.'
      answer: '$18\pi$'
      solution_sketch: '$\operatorname{curl}\mathbf{F} = \langle 0, 0, 2 \rangle$. Taking $S$ to be the disk of radius $3$ with upward normal, the flux of the curl is $2 \cdot \pi \cdot 3^2 = 18\pi$.'
    anki_seeds:
      - front: 'Divergence theorem (statement)?'
        back: 'The outward flux of $\mathbf{F}$ through a closed surface equals $\iiint_E \operatorname{div}\mathbf{F}\, dV$ over the enclosed solid.'
        type: basic
      - front: 'Stokes'' theorem (statement)?'
        back: '$\oint_{\partial S} \mathbf{F} \cdot d\mathbf{r} = \iint_S \operatorname{curl}\mathbf{F} \cdot d\mathbf{S}$, with compatible orientations.'
        type: basic
      - front: 'Which classical theorem does Green''s theorem generalize to in 3D, in each of its two forms?'
        back: 'Circulation form $\to$ Stokes'' theorem; flux form $\to$ the divergence theorem.'
        type: basic

  - id: general-flux-integrals
    name: "General Flux Integrals"
    core: false                # feeds only the supplemental Stokes/divergence theorem topics; the whole flux/theorem branch is a terminal destination nothing downstream consumes
    difficulty: 0.85
    drill: false
    answer_kind: numeric
    expected_time_secs: 280
    prerequisites:
      - id: surface-integrals
        weight: 0.8
        key: true
      - id: parametrized-surfaces
        weight: 0.5
        key: true
      - id: double-integrals-polar
        weight: 0.4
        key: false
    knowledge_points:
      - id: kp1
        name: "Flux via F · (r_u x r_v) with non-constant integrands"
        key_prerequisites: [surface-integrals, parametrized-surfaces]
        exemplars:
          - problem: 'Find the outward flux of $\mathbf{F} = \langle 0,\, 0,\, z \rangle$ through the sphere $x^2 + y^2 + z^2 = 9$.'
            answer: '36pi'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Parametrize the sphere by $\mathbf{r}(\varphi,\theta) = \langle 3\sin\varphi\cos\theta,\, 3\sin\varphi\sin\theta,\, 3\cos\varphi \rangle$. The outward normal is $\mathbf{r}_\varphi \times \mathbf{r}_\theta = 9\sin\varphi\,\langle \sin\varphi\cos\theta,\, \sin\varphi\sin\theta,\, \cos\varphi \rangle$, so $\mathbf{F}\cdot(\mathbf{r}_\varphi \times \mathbf{r}_\theta) = 27\sin\varphi\cos^2\varphi$. Then $\int_0^{2\pi}\!\int_0^{\pi} 27\sin\varphi\cos^2\varphi\,d\varphi\,d\theta = 2\pi \cdot 27 \cdot \frac{2}{3} = 36\pi$.'
          - problem: 'Find the outward flux of $\mathbf{F} = \langle xz,\, 0,\, 0 \rangle$ across the lateral surface of the cylinder $x^2 + y^2 = 4$, $0 \le z \le 3$.'
            answer: '18pi'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Parametrize by $\mathbf{r}(\theta, z) = \langle 2\cos\theta,\, 2\sin\theta,\, z \rangle$. Then $\mathbf{r}_\theta \times \mathbf{r}_z = \langle 2\cos\theta,\, 2\sin\theta,\, 0 \rangle$ points outward, and $\mathbf{F}\cdot(\mathbf{r}_\theta \times \mathbf{r}_z) = 4z\cos^2\theta$. The integral is $\int_0^{3}\!\int_0^{2\pi} 4z\cos^2\theta\,d\theta\,dz = 4\pi \cdot \frac{9}{2} = 18\pi$.'
          - problem: 'A cylindrical tank wall is the surface $x^2 + y^2 = 1$, $0 \le z \le 2$, with lengths in meters. Water seeps outward through it with velocity $\mathbf{F} = \langle xz,\, yz,\, 0 \rangle$ meters per second. Find the rate, in cubic meters per second, at which water leaves through the wall.'
            answer: '4pi'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'With $\mathbf{r}(\theta, z) = \langle \cos\theta,\, \sin\theta,\, z \rangle$ the outward normal is $\langle \cos\theta,\, \sin\theta,\, 0 \rangle$, so $\mathbf{F}\cdot(\mathbf{r}_\theta \times \mathbf{r}_z) = z$. The rate is $\int_0^{2}\!\int_0^{2\pi} z\,d\theta\,dz = 2\pi \cdot 2 = 4\pi$.'
          - problem: 'Find the outward flux of $\mathbf{F} = \langle 0,\, 0,\, z^3 \rangle$ through the sphere of radius $2$ centered at the origin.'
            answer: '128pi/5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'On the sphere $\mathbf{r}_\varphi \times \mathbf{r}_\theta = 4\sin\varphi\,\langle \sin\varphi\cos\theta,\, \sin\varphi\sin\theta,\, \cos\varphi \rangle$ and $z = 2\cos\varphi$. So $\mathbf{F}\cdot(\mathbf{r}_\varphi \times \mathbf{r}_\theta) = 8\cos^3\varphi \cdot 4\sin\varphi\cos\varphi = 32\sin\varphi\cos^4\varphi$. Integrating gives $2\pi \cdot 32 \cdot \frac{2}{5} = \frac{128\pi}{5}$.'
          - problem: 'A silo wall is the surface $x^2 + y^2 = 4$, $0 \le z \le h$, with lengths in meters. Grain dust drifts outward through it with velocity $\mathbf{F} = \langle xz,\, yz,\, 0 \rangle$ meters per second, at a total rate of $64\pi$ cubic meters per second. Find the height $h$ of the silo.'
            answer: '4'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'With $\mathbf{r}(\theta, z) = \langle 2\cos\theta,\, 2\sin\theta,\, z \rangle$ we get $\mathbf{F}\cdot(\mathbf{r}_\theta \times \mathbf{r}_z) = 4z$. The rate is $\int_0^{h}\!\int_0^{2\pi} 4z\,d\theta\,dz = 4\pi h^2$. Setting $4\pi h^2 = 64\pi$ gives $h^2 = 16$, so $h = 4$ meters.'
          - problem: 'Find the outward flux of $\mathbf{F} = \langle xz,\, yz,\, 0 \rangle$ through the cylinder $x^2 + y^2 = 1$, $0 \le z \le 3$.'
            answer: '9pi'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'On the surface $\mathbf{F}\cdot\mathbf{n} = z$ varies from $0$ to $3$, so $z$ cannot be fixed at $3$. The flux is $\int_0^{2\pi}\!\int_0^{3} z\,dz\,d\theta = 2\pi \cdot \frac{9}{2} = 9\pi$.'
          - problem: 'A spherical balloon of radius $2$ m has air drifting through its skin with velocity $\mathbf{F} = \langle x,\, 0,\, 0 \rangle$ meters per second. Find the rate, in cubic meters per second, at which air leaves the balloon.'
            answer: '32pi/3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'With the outward normal $4\sin\varphi\,\langle \sin\varphi\cos\theta,\, \sin\varphi\sin\theta,\, \cos\varphi \rangle$ and $x = 2\sin\varphi\cos\theta$, the integrand is $8\sin^3\varphi\cos^2\theta$. The $\varphi$-integral of $\sin^3\varphi$ is $\frac{4}{3}$ and the $\theta$-integral of $\cos^2\theta$ is $\pi$. So the rate is $8 \cdot \frac{4}{3} \cdot \pi = \frac{32\pi}{3}$.'
        constraints: "cylinders and spheres with small integer radii; F . N is a product like z, z cos^2(theta), or sin(phi) cos^2(phi) requiring one genuine iterated integral (u-substitution at worst); answers exact multiples of pi"
      - id: kp2
        name: "Flux through graphs with polar conversion"
        key_prerequisites: [surface-integrals, double-integrals-polar]
        exemplars:
          - problem: 'Find the upward flux of $\mathbf{F} = \langle x,\, y,\, 0 \rangle$ through the paraboloid $z = 4 - x^2 - y^2$, $z \ge 0$.'
            answer: '16pi'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The upward normal is $\langle -g_x, -g_y, 1 \rangle = \langle 2x, 2y, 1 \rangle$, so $\mathbf{F}\cdot\mathbf{N} = 2x^2 + 2y^2 = 2r^2$. The shadow is the disk $r \le 2$, so the flux is $\int_0^{2\pi}\!\int_0^2 2r^2 \cdot r\,dr\,d\theta = 2\pi \cdot 8 = 16\pi$.'
          - problem: 'Let $\mathbf{F} = \langle 0,\, 0,\, z \rangle$. Find the upward flux of $\mathbf{F}$ through the paraboloid $z = 9 - x^2 - y^2$, $z \ge 0$.'
            answer: '81pi/2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The upward normal is $\langle 2x, 2y, 1 \rangle$, so $\mathbf{F}\cdot\mathbf{N} = z = 9 - r^2$. The shadow is the disk $r \le 3$, and $\int_0^3 (9 - r^2)\,r\,dr = \frac{81}{4}$. Multiplying by $2\pi$ gives $\frac{81\pi}{2}$.'
          - problem: 'Let $\mathbf{F} = \langle x,\, y,\, z \rangle$. Find the upward flux of $\mathbf{F}$ through the part of the plane $z = 3 + 2x - y$ over the disk $x^2 + y^2 \le 4$.'
            answer: '12pi'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The upward normal is $\langle -2, 1, 1 \rangle$, so $\mathbf{F}\cdot\mathbf{N} = -2x + y + z$. On the plane this equals $-2x + y + 3 + 2x - y = 3$. The flux is $3$ times the area $4\pi$ of the disk, which is $12\pi$.'
          - problem: 'Rain falls with velocity $\mathbf{F} = \langle 0,\, 0,\, -2 \rangle$ meters per second onto a dome-shaped roof $z = 1 - x^2 - y^2$, $z \ge 0$, with lengths in meters. Find the rate, in cubic meters per second, at which rain passes downward through the roof.'
            answer: '2pi'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The upward normal is $\langle 2x, 2y, 1 \rangle$, so $\mathbf{F}\cdot\mathbf{N} = -2$. Over the shadow disk of area $\pi$ the upward flux is $-2\pi$. The downward flux, which is the rain rate, is $2\pi$.'
          - problem: 'Let $\mathbf{F} = \langle x^2,\, y^2,\, z \rangle$. Find the upward flux of $\mathbf{F}$ through the paraboloid $z = 3 - x^2 - y^2$, $z \ge 0$.'
            answer: '9pi/2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The upward normal is $\langle 2x, 2y, 1 \rangle$, so $\mathbf{F}\cdot\mathbf{N} = 2x^3 + 2y^3 + 3 - r^2$. The cubic terms integrate to $0$ over the disk $r \le \sqrt{3}$ by symmetry. What remains is $2\pi\int_0^{\sqrt{3}} (3 - r^2)\,r\,dr = 2\pi \cdot \frac{9}{4} = \frac{9\pi}{2}$.'
          - problem: 'A solar panel lies in the plane $z = 3 + 2x - y$ over the disk $x^2 + y^2 \le a^2$, with lengths in meters. The wind has velocity $\mathbf{F} = \langle x,\, y,\, z \rangle$ meters per second, and its upward flux through the panel is $27\pi$ cubic meters per second. Find $a$.'
            answer: '3'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'As in the plane computation, $\mathbf{F}\cdot\mathbf{N} = 3$ on the panel, so the flux is $3\pi a^2$. Setting $3\pi a^2 = 27\pi$ gives $a^2 = 9$, so $a = 3$ meters.'
          - problem: 'Find the upward flux of $\mathbf{F} = \langle x,\, y,\, 0 \rangle$ through the surface $z = 1 - x^2 - y^2$, $z \ge 0$.'
            answer: 'pi'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The upward normal is $\langle -g_x, -g_y, 1 \rangle = \langle 2x, 2y, 1 \rangle$, not $\langle g_x, g_y, 1 \rangle$. Then $\mathbf{F}\cdot\mathbf{N} = 2r^2$ and the flux is $\int_0^{2\pi}\!\int_0^1 2r^3\,dr\,d\theta = \pi$.'
        constraints: "surfaces are paraboloids z = a - x^2 - y^2 or planes over disks; F . <-g_x, -g_y, 1> reduces to a polynomial in r after polar conversion; answers exact multiples of pi or small rational multiples of pi"
      - id: kp3
        name: "Closed surfaces piece by piece"
        key_prerequisites: [surface-integrals, parametrized-surfaces]
        exemplars:
          - problem: 'Find the total outward flux of $\mathbf{F} = \langle x,\, y,\, z \rangle$ through the closed cylinder $x^2 + y^2 = 1$, $0 \le z \le 3$, which consists of the lateral surface, the top disk and the bottom disk.'
            answer: '9pi'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'On the lateral surface the outward normal is $\langle x, y, 0 \rangle$, so $\mathbf{F}\cdot\mathbf{n} = 1$ over area $6\pi$, which gives $6\pi$. On the top disk $\mathbf{n} = \langle 0, 0, 1 \rangle$ and $\mathbf{F}\cdot\mathbf{n} = 3$ over area $\pi$, which gives $3\pi$. On the bottom disk $z = 0$, so $\mathbf{F}\cdot\mathbf{n} = 0$. The total is $6\pi + 3\pi + 0 = 9\pi$.'
          - problem: 'Find the total outward flux of $\mathbf{F} = \langle x^2,\, 0,\, 0 \rangle$ through the boundary of the unit cube $[0,1]^3$, face by face.'
            answer: '1'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Only the faces $x = 0$ and $x = 1$ can contribute, because $\mathbf{F}$ points along the $x$-axis. On $x = 1$ the outward normal is $\langle 1, 0, 0 \rangle$ and $\mathbf{F}\cdot\mathbf{n} = 1$ over area $1$. On $x = 0$ the field is $\mathbf{0}$, so the total is $1$.'
          - problem: 'Find the total outward flux of $\mathbf{F} = \langle x,\, 2y,\, 3z \rangle$ through the boundary of the box $0 \le x \le 1$, $0 \le y \le 2$, $0 \le z \le 3$.'
            answer: '36'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'On $x = 1$ the flux is $1 \cdot 6 = 6$ and on $x = 0$ it is $0$. On $y = 2$ it is $4 \cdot 3 = 12$ and on $y = 0$ it is $0$. On $z = 3$ it is $9 \cdot 2 = 18$ and on $z = 0$ it is $0$. The total is $6 + 12 + 18 = 36$.'
          - problem: 'Find the total outward flux of $\mathbf{F} = \langle 0,\, y,\, z \rangle$ through the closed cylinder $x^2 + y^2 = 4$, $0 \le z \le 3$, including both caps.'
            answer: '24pi'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'On the lateral surface $\mathbf{n} = \langle x/2, y/2, 0 \rangle$ and $\mathbf{F}\cdot\mathbf{n} = y^2/2$, and integrating over the surface gives $12\pi$. On the top cap $\mathbf{F}\cdot\mathbf{n} = 3$ over area $4\pi$, which gives $12\pi$. On the bottom cap $z = 0$, so the contribution is $0$. The total is $12\pi + 12\pi = 24\pi$.'
          - problem: 'A closed tank is the cylinder $x^2 + y^2 = 1$, $0 \le z \le 3$, including its top and bottom, with lengths in meters. Gas inside moves with velocity $\mathbf{F} = \langle 0,\, 0,\, z \rangle$ meters per second. Find the net rate, in cubic meters per second, at which gas leaves the tank through its whole surface.'
            answer: '3pi'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'On the lateral surface the normal is horizontal and $\mathbf{F}$ is vertical, so $\mathbf{F}\cdot\mathbf{n} = 0$. On the top $\mathbf{F}\cdot\mathbf{n} = 3$ over area $\pi$, which gives $3\pi$, and on the bottom $z = 0$ gives $0$. The net rate is $3\pi$.'
          - problem: 'A closed grain bin is the cylinder $x^2 + y^2 = 1$, $0 \le z \le h$, including its top and bottom, with lengths in meters. Warm air moves with velocity $\mathbf{F} = \langle x,\, y,\, z \rangle$ meters per second and leaves the bin through its whole surface at a net rate of $15\pi$ cubic meters per second. Find $h$.'
            answer: '5'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'The lateral surface gives $\mathbf{F}\cdot\mathbf{n} = 1$ over area $2\pi h$, so $2\pi h$. The top gives $h$ over area $\pi$, so $\pi h$, and the bottom gives $0$. The total is $3\pi h$, and $3\pi h = 15\pi$ gives $h = 5$ meters.'
          - problem: 'What is the total outward flux of $\mathbf{F} = \langle x,\, y,\, z + 1 \rangle$ through the whole closed cylinder surface $x^2 + y^2 = 1$, $0 \le z \le 2$, with lateral surface, top disk and bottom disk?'
            answer: '6pi'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The bottom disk counts. Its normal is $\langle 0, 0, -1 \rangle$ and $\mathbf{F}\cdot\mathbf{n} = -(0 + 1) = -1$ over area $\pi$, which contributes $-\pi$. The lateral surface gives $4\pi$ and the top gives $3\pi$, so the total is $4\pi + 3\pi - \pi = 6\pi$.'
        constraints: "closed cylinders and boxes assembled from 2-6 pieces; each piece is a flat cap, box face, or lateral surface whose contribution is a one-line integral; always state the outward normal of each piece"
    diagnostic_exemplar:
      problem: 'Find the total outward flux of $\mathbf{F} = \langle x,\; y,\; z^2 \rangle$ through the closed cylinder $x^2 + y^2 = 1$, $0 \le z \le 2$ (lateral surface plus both caps), computing each piece separately.'
      answer: '$8\pi$'
      solution_sketch: 'Lateral surface: the outward unit normal is $\langle x, y, 0 \rangle$, so $\mathbf{F}\cdot\mathbf{n} = x^2 + y^2 = 1$ and the flux is the area $4\pi$. Top cap $z = 2$: $\mathbf{F}\cdot\mathbf{n} = z^2 = 4$ over area $\pi$, giving $4\pi$. Bottom cap $z = 0$: $\mathbf{F}\cdot\mathbf{n} = -z^2 = 0$. Total $8\pi$ (matching $\iiint (2 + 2z)\,dV$).'
    anki_seeds:
      - front: 'General formula for the flux of $\mathbf{F}$ through a parametrized surface $\mathbf{r}(u, v)$ over domain $D$?'
        back: '$\iint_D \mathbf{F}(\mathbf{r}(u,v)) \cdot (\mathbf{r}_u \times \mathbf{r}_v)\, du\, dv$ — orient by the direction of $\mathbf{r}_u \times \mathbf{r}_v$.'
        type: basic
      - front: 'What happens to a flux integral $\iint_S \mathbf{F} \cdot d\mathbf{S}$ if the orientation of $S$ is reversed?'
        back: 'It changes sign.'
        type: basic
      - front: 'Outward normal direction of $\mathbf{r}(\varphi, \theta)$ on a sphere, as computed from $\mathbf{r}_\varphi \times \mathbf{r}_\theta$?'
        back: '$\sin\varphi$ times the radial unit vector — outward, with magnitude the area factor $\rho^2 \sin\varphi$ on a sphere of radius $\rho$.'
        type: basic

  - id: stokes-theorem
    name: "Stokes' Theorem"
    core: false                # terminal theorem-application topic: no course in the tree builds on Stokes' theorem (verified by grep across DE/AA/CT), so it is a destination, not machinery (PDF p. 391)
    difficulty: 0.87
    drill: false
    answer_kind: numeric
    expected_time_secs: 300
    prerequisites:
      - id: divergence-curl
        weight: 0.6
        key: true
      - id: general-flux-integrals
        weight: 0.7
        key: true
      - id: computing-div-curl
        weight: 0.5
        key: false
      - id: vector-line-integrals
        weight: 0.4
        key: false
    knowledge_points:
      - id: kp1
        name: "Circulation via non-constant curl"
        key_prerequisites: [divergence-curl, computing-div-curl]
        exemplars:
          - problem: 'Use Stokes'' theorem to evaluate $\oint_C \mathbf{F} \cdot d\mathbf{r}$ for $\mathbf{F} = \langle -y^3,\, x^3,\, 0 \rangle$, where $C$ is the unit circle in the $xy$-plane, counterclockwise as seen from above.'
            answer: '3pi/2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The curl is $\langle 0, 0, 3x^2 + 3y^2 \rangle = \langle 0, 0, 3r^2 \rangle$, and the upward normal keeps only this component. So the circulation is $\int_0^{2\pi}\!\int_0^1 3r^2 \cdot r\,dr\,d\theta = 2\pi \cdot \frac{3}{4} = \frac{3\pi}{2}$.'
          - problem: 'Use Stokes'' theorem to evaluate $\oint_C \mathbf{F} \cdot d\mathbf{r}$ for $\mathbf{F} = \langle xy,\, x^2,\, 0 \rangle$, where $C$ is the boundary of the unit square $[0,1]^2$ in the $xy$-plane, counterclockwise as seen from above.'
            answer: '1/2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The $z$-component of the curl is $\partial_x(x^2) - \partial_y(xy) = 2x - x = x$. Over the unit square, $\int_0^1\!\int_0^1 x\,dx\,dy = \frac{1}{2}$.'
          - problem: 'A current in a circular lake of radius $2$ km has velocity $\mathbf{F} = \langle -\frac{y^3}{3},\, \frac{x^3}{3},\, 0 \rangle$ kilometers per hour, where the origin is the center of the lake. Find the circulation of the current around the shore, counterclockwise as seen from above.'
            answer: '8pi'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The $z$-component of the curl is $x^2 + y^2 = r^2$. The circulation is $\int_0^{2\pi}\!\int_0^2 r^2 \cdot r\,dr\,d\theta = 2\pi \cdot 4 = 8\pi$.'
          - problem: 'Let $\mathbf{F} = \langle -y - y^2,\, 0,\, 0 \rangle$ and let $C$ be the boundary of the square $[0,1] \times [0,1]$ in the $xy$-plane, counterclockwise as seen from above. Use Stokes'' theorem to evaluate $\oint_C \mathbf{F} \cdot d\mathbf{r}$.'
            answer: '2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The $z$-component of the curl is $\partial_x(0) - \partial_y(-y - y^2) = 1 + 2y$. Then $\int_0^1\!\int_0^1 (1 + 2y)\,dx\,dy = 1 + 1 = 2$.'
          - problem: 'Wind blows over a square field $1$ km by $1$ km with velocity $\mathbf{F} = \langle 0,\, \frac{x^3}{3} + xy,\, 0 \rangle$ kilometers per hour. Find the circulation of the wind around the edge of the field, counterclockwise as seen from above.'
            answer: '5/6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The $z$-component of the curl is $\partial_x\left(\frac{x^3}{3} + xy\right) = x^2 + y$. Then $\int_0^1\!\int_0^1 (x^2 + y)\,dx\,dy = \frac{1}{3} + \frac{1}{2} = \frac{5}{6}$.'
          - problem: 'Evaluate $\oint_C \mathbf{F} \cdot d\mathbf{r}$ for $\mathbf{F} = \langle -x^2 y,\, 0,\, 0 \rangle$, where $C$ is the circle $x^2 + y^2 = 4$ in the $xy$-plane, counterclockwise as seen from above.'
            answer: '4pi'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The $z$-component of the curl is $-\partial_y(-x^2 y) = x^2$. In polar coordinates $\int_0^{2\pi}\!\int_0^2 r^2\cos^2\theta \cdot r\,dr\,d\theta = 4 \cdot \pi = 4\pi$.'
          - problem: 'An eddy in a flat circular reservoir of radius $a$ meters has velocity $\mathbf{F} = \langle -y^3,\, x^3,\, 0 \rangle$ meters per second, where the origin is the center of the reservoir. The circulation around the shore, counterclockwise as seen from above, is $24\pi$. Find $a$.'
            answer: '2'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'The $z$-component of the curl is $3r^2$, so the circulation is $\int_0^{2\pi}\!\int_0^a 3r^3\,dr\,d\theta = \frac{3\pi a^4}{2}$. Setting $\frac{3\pi a^4}{2} = 24\pi$ gives $a^4 = 16$, so $a = 2$ meters.'
          - problem: 'Apply Stokes'' theorem to $\mathbf{F} = \langle -2y,\, x^2,\, 0 \rangle$ on the unit circle, counterclockwise as seen from above. What is the circulation?'
            answer: '2pi'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The $z$-component of the curl has two terms: $\partial_x F_y = 2x$ and $-\partial_y F_x = 2$. So it is $2x + 2$. Over the unit disk the $2x$ part integrates to $0$ and the constant $2$ gives $2 \cdot \pi = 2\pi$.'
        constraints: "curl F has a non-constant z-component (a polynomial like 3r^2, x, or 1 - 2y); C bounds a disk or square in the xy-plane; the double integral is a one-step polar or iterated computation"
      - id: kp2
        name: "Surface independence: choosing a convenient surface"
        key_prerequisites: [divergence-curl, general-flux-integrals]
        exemplars:
          - problem: 'Evaluate $\iint_S \operatorname{curl}\mathbf{F} \cdot d\mathbf{S}$ for $\mathbf{F} = \langle -y,\, x,\, xz \rangle$, where $S$ is the paraboloid $z = 4 - x^2 - y^2$, $z \ge 0$, with upward normal.'
            answer: '8pi'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The boundary of $S$ is the circle $x^2 + y^2 = 4$ in the plane $z = 0$. On the flat disk it spans, $\operatorname{curl}\mathbf{F} = \langle 0, -z, 2 \rangle = \langle 0, 0, 2 \rangle$, so the flux is $2 \cdot 4\pi = 8\pi$.'
          - problem: 'Let $\mathbf{F} = \langle 0,\, x^3,\, 0 \rangle$ and let $S$ be the upper hemisphere $x^2 + y^2 + z^2 = 4$, $z \ge 0$, with upward normal. Evaluate the flux of $\operatorname{curl}\mathbf{F}$ through $S$.'
            answer: '12pi'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The boundary is the circle $x^2 + y^2 = 4$ in the plane $z = 0$, and the flat disk it spans gives the same flux. The curl is $\langle 0, 0, 3x^2 \rangle$, so the flux is $\int_0^{2\pi}\!\int_0^2 3r^2\cos^2\theta \cdot r\,dr\,d\theta = 3 \cdot 4 \cdot \pi = 12\pi$.'
          - problem: 'A tent has the shape $z = 1 - x^2 - y^2$, $z \ge 0$, with lengths in meters. The wind has velocity $\mathbf{F} = \langle -y,\, 2x,\, z^2 \rangle$ meters per second. Find the flux of $\operatorname{curl}\mathbf{F}$ through the tent, with upward normal.'
            answer: '3pi'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The curl is $\langle 0, 0, 2 - (-1) \rangle = \langle 0, 0, 3 \rangle$, a constant vector. The flat unit disk in the plane $z = 0$ has the same boundary as the tent, so the flux is $3 \cdot \pi = 3\pi$.'
          - problem: 'Let $\mathbf{F} = \langle -y,\, 3x,\, xz \rangle$ and let $S$ be the upper hemisphere $x^2 + y^2 + z^2 = 4$, $z \ge 0$, with upward normal. Find $\iint_S \operatorname{curl}\mathbf{F} \cdot d\mathbf{S}$.'
            answer: '16pi'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The curl is $\langle 0, -z, 4 \rangle$. On the flat disk of radius $2$ in the plane $z = 0$, which has the same boundary as $S$, the curl is $\langle 0, 0, 4 \rangle$, so the flux is $4 \cdot 4\pi = 16\pi$.'
          - problem: 'Let $\mathbf{F} = \langle -2y,\, x,\, z \rangle$ and let $S$ be the paraboloid $z = 9 - x^2 - y^2$, $z \ge 0$, with upward normal. Find the flux of $\operatorname{curl}\mathbf{F}$ through $S$.'
            answer: '27pi'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The curl is $\langle 0, 0, 1 - (-2) \rangle = \langle 0, 0, 3 \rangle$. The boundary of $S$ is the circle of radius $3$ in the plane $z = 0$, so the flux is $3 \cdot 9\pi = 27\pi$.'
          - problem: 'Let $\mathbf{F} = \langle -y,\, 4x,\, z^3 \rangle$ and let $S$ be the paraboloid $z = 4 - x^2 - y^2$, $z \ge 0$, with upward normal. Evaluate $\iint_S \operatorname{curl}\mathbf{F} \cdot d\mathbf{S}$.'
            answer: '20pi'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The curl is $\langle 0, 0, 4 - (-1) \rangle = \langle 0, 0, 5 \rangle$. The boundary of $S$ is the circle of radius $2$ in the plane $z = 0$, so the flux is $5 \cdot 4\pi = 20\pi$.'
          - problem: 'A dome of radius $2$ m is the upper hemisphere $x^2 + y^2 + z^2 = 4$, $z \ge 0$. The wind has velocity $\mathbf{F} = \langle -y,\, kx,\, xz \rangle$ meters per second, where $k$ is a constant, and the flux of $\operatorname{curl}\mathbf{F}$ through the dome, with upward normal, is $28\pi$. Find $k$.'
            answer: '6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The curl is $\langle 0, -z, k + 1 \rangle$. On the flat disk of radius $2$ in the plane $z = 0$ it is $\langle 0, 0, k + 1 \rangle$, so the flux is $4\pi(k + 1)$. Setting $4\pi(k + 1) = 28\pi$ gives $k + 1 = 7$, so $k = 6$.'
          - problem: 'Find the flux of $\operatorname{curl}\mathbf{F}$ through the upper hemisphere $x^2 + y^2 + z^2 = 9$, $z \ge 0$, with upward normal, for $\mathbf{F} = \langle -y,\, x,\, xz \rangle$.'
            answer: '18pi'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The flux depends only on the boundary circle $x^2 + y^2 = 9$, so the flat disk it spans gives the same value. On the disk the curl is $\langle 0, 0, 2 \rangle$ and the area is $9\pi$, so the flux is $2 \cdot 9\pi = 18\pi$.'
        constraints: "the two surfaces share a circular boundary; the convenient replacement is a flat disk where the curl's z-component is a constant or single monomial; the inconvenient surface is a paraboloid or hemisphere"
      - id: kp3
        name: "Both sides of the theorem"
        key_prerequisites: [divergence-curl, general-flux-integrals, vector-line-integrals]
        exemplars:
          - problem: 'Let $\mathbf{F} = \langle z,\, x,\, y \rangle$. Find the flux of $\operatorname{curl}\mathbf{F}$ through the upper unit hemisphere $x^2 + y^2 + z^2 = 1$, $z \ge 0$, with upward normal.'
            answer: 'pi'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The hemisphere has the unit circle in the plane $z = 0$ as its boundary, traversed counterclockwise from above: $\mathbf{r}(t) = \langle \cos t, \sin t, 0 \rangle$. On it $\mathbf{F}\cdot\mathbf{r}''(t) = x\cos t = \cos^2 t$, so the flux equals $\int_0^{2\pi}\cos^2 t\,dt = \pi$.'
          - problem: 'Air circulates over a dome-shaped hill $z = 4 - x^2 - y^2$, $z \ge 0$, with lengths in kilometers and velocity $\mathbf{F} = \langle y^2,\, x,\, z^2 \rangle$. Find the flux of $\operatorname{curl}\mathbf{F}$ through the hill, with upward normal.'
            answer: '4pi'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The boundary is the circle $\mathbf{r}(t) = \langle 2\cos t, 2\sin t, 0 \rangle$ with $z = 0$. Along it $\mathbf{F}\cdot\mathbf{r}''(t) = 4\sin^2 t \cdot (-2\sin t) + 2\cos t \cdot 2\cos t$. The $\sin^3 t$ term integrates to $0$ over a full period and $4\cos^2 t$ gives $4\pi$, so the flux is $4\pi$.'
          - problem: 'Evaluate $\oint_C \mathbf{F} \cdot d\mathbf{r}$ for $\mathbf{F} = \langle 3y,\, z,\, x \rangle$ around the unit circle $x^2 + y^2 = 1$ in the plane $z = 0$, counterclockwise as seen from above.'
            answer: '-3pi'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Take $\mathbf{r}(t) = \langle \cos t, \sin t, 0 \rangle$, so $\mathbf{r}''(t) = \langle -\sin t, \cos t, 0 \rangle$ and $\mathbf{F} = \langle 3\sin t, 0, \cos t \rangle$. Then $\mathbf{F}\cdot\mathbf{r}''(t) = -3\sin^2 t$ and $\int_0^{2\pi} -3\sin^2 t\,dt = -3\pi$.'
          - problem: 'Let $\mathbf{F} = \langle y,\, z,\, x \rangle$. Find the flux of $\operatorname{curl}\mathbf{F}$ through the upper unit hemisphere $x^2 + y^2 + z^2 = 1$, $z \ge 0$, with upward normal.'
            answer: '-pi'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'By Stokes'' theorem the flux equals the circulation around the unit circle in the plane $z = 0$, counterclockwise from above. On it $\mathbf{F}\cdot\mathbf{r}''(t) = \sin t \cdot (-\sin t) = -\sin^2 t$, so the flux is $\int_0^{2\pi} -\sin^2 t\,dt = -\pi$.'
          - problem: 'A dome-shaped greenhouse is the upper hemisphere $x^2 + y^2 + z^2 = 1$, $z \ge 0$, with lengths in meters. The wind has velocity $\mathbf{F} = \langle -cy,\, cx,\, z^2 \rangle$ meters per second, where $c$ is a constant, and the flux of $\operatorname{curl}\mathbf{F}$ through the dome, with upward normal, is $10\pi$. Find $c$.'
            answer: '5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The flux equals the circulation around the unit circle, where $\mathbf{F}\cdot\mathbf{r}''(t) = c\sin^2 t + c\cos^2 t = c$. So the flux is $\int_0^{2\pi} c\,dt = 2\pi c$. Setting $2\pi c = 10\pi$ gives $c = 5$.'
          - problem: 'Find the flux of $\operatorname{curl}\mathbf{F}$ through the upper unit hemisphere, with upward normal, for $\mathbf{F} = \langle 2y,\, z,\, x \rangle$.'
            answer: '-2pi'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'An upward normal needs the boundary counterclockwise as seen from above. Along $\mathbf{r}(t) = \langle \cos t, \sin t, 0 \rangle$ we have $\mathbf{F}\cdot\mathbf{r}''(t) = 2\sin t \cdot (-\sin t)$, and $\int_0^{2\pi} -2\sin^2 t\,dt = -2\pi$.'
          - problem: 'Verify Stokes'' theorem for $\mathbf{F} = \langle z,\, 2x,\, y \rangle$ on the upper unit hemisphere with upward normal: compute both $\oint_C \mathbf{F} \cdot d\mathbf{r}$ around the unit circle and $\iint_S \operatorname{curl}\mathbf{F} \cdot d\mathbf{S}$, and confirm that they agree. What common value do the two sides have?'
            answer: '2pi'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Around the unit circle $\mathbf{F}\cdot\mathbf{r}''(t) = 2\cos t \cdot \cos t$, so $\oint_C \mathbf{F} \cdot d\mathbf{r} = \int_0^{2\pi} 2\cos^2 t\,dt = 2\pi$. The curl is $\langle 1, 1, 2 \rangle$ and the surface integral over the hemisphere is also $2\pi$, so the two sides agree.'
        constraints: "verification exemplars use fields with constant curl but genuinely curved surfaces (spherical integral on one side); reversal exemplars trade a hard surface integral for a boundary integral that reduces via sin/cos power integrals over full periods"
    diagnostic_exemplar:
      problem: 'Use Stokes'' theorem to evaluate $\iint_S \operatorname{curl}\mathbf{F} \cdot d\mathbf{S}$ for $\mathbf{F} = \langle -y,\; x,\; xz \rangle$, where $S$ is the paraboloid $z = 9 - x^2 - y^2$, $z \ge 0$, with upward normal.'
      answer: '$18\pi$'
      solution_sketch: 'The boundary of $S$ is the circle $x^2 + y^2 = 9$ in $z = 0$, counterclockwise from above. There $\mathbf{F} = \langle -y, x, 0 \rangle$, and with $\mathbf{r}(t) = \langle 3\cos t, 3\sin t, 0 \rangle$ the integrand $\mathbf{F}\cdot\mathbf{r}'' = 9$, so the circulation — and hence the flux of the curl — is $18\pi$.'
    anki_seeds:
      - front: 'Why can $\iint_S \operatorname{curl}\mathbf{F} \cdot d\mathbf{S}$ be computed on a different surface $S''$?'
        back: 'If $S$ and $S''$ share the same positively oriented boundary, Stokes'' theorem equates both fluxes to $\oint_{\partial S} \mathbf{F} \cdot d\mathbf{r}$ — pick the convenient surface (usually a flat disk).'
        type: basic
      - front: 'Orientation convention in Stokes'' theorem?'
        back: 'The boundary is traversed counterclockwise when viewed from the side the normal points to (right-hand rule: thumb along $\mathbf{n}$, fingers along $C$).'
        type: basic

  - id: divergence-theorem
    name: "The Divergence Theorem"
    core: false                # terminal theorem-application topic: no course in the tree builds on the divergence theorem (verified by grep across DE/AA/CT), so it is a destination, not machinery (PDF p. 391)
    difficulty: 0.87
    drill: false
    answer_kind: numeric
    expected_time_secs: 300
    prerequisites:
      - id: divergence-curl
        weight: 0.6
        key: true
      - id: general-flux-integrals
        weight: 0.6
        key: true
      - id: triple-integrals-cylindrical
        weight: 0.6
        key: true
      - id: cylindrical-spherical-coordinates
        weight: 0.5
        key: false
    knowledge_points:
      - id: kp1
        name: "Non-constant divergence over boxes and cylinders"
        key_prerequisites: [divergence-curl, triple-integrals-cylindrical]
        exemplars:
          - problem: 'Use the divergence theorem to find the outward flux of $\mathbf{F} = \langle x^2,\, y^2,\, z^2 \rangle$ through the boundary of the unit cube $[0,1]^3$.'
            answer: '3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The divergence is $2x + 2y + 2z$. Each term integrates over the unit cube to $1$, so the outward flux is $1 + 1 + 1 = 3$.'
          - problem: 'Use the divergence theorem to find the outward flux of $\mathbf{F} = \langle x,\, y,\, z^2 \rangle$ through the closed cylinder $x^2 + y^2 \le 1$, $0 \le z \le 1$.'
            answer: '3pi'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The divergence is $1 + 1 + 2z = 2 + 2z$. Each horizontal slice of the cylinder has area $\pi$, so the flux is $\pi\int_0^1 (2 + 2z)\,dz = \pi \cdot 3 = 3\pi$.'
          - problem: 'Let $\mathbf{F} = \langle x^2,\, y,\, z \rangle$. Find the outward flux of $\mathbf{F}$ through the boundary of the box $[0,2] \times [0,1] \times [0,1]$.'
            answer: '8'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The divergence is $2x + 1 + 1 = 2x + 2$. The integral over the box is $\int_0^2 (2x + 2)\,dx \cdot 1 \cdot 1 = 4 + 4 = 8$.'
          - problem: 'Let $\mathbf{F} = \langle x,\, y,\, z^3 \rangle$. Find the outward flux of $\mathbf{F}$ through the closed cylinder $x^2 + y^2 \le 4$, $0 \le z \le 2$.'
            answer: '48pi'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The divergence is $2 + 3z^2$. Each slice has area $4\pi$, so the flux is $4\pi\int_0^2 (2 + 3z^2)\,dz = 4\pi \cdot 12 = 48\pi$.'
          - problem: 'Gas in a cubic tank $[0,1]^3$, with lengths in meters, has velocity $\mathbf{F} = \langle 2x,\, y^2,\, z^2 \rangle$ meters per second. Find the net rate, in cubic meters per second, at which gas leaves through the walls.'
            answer: '4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The divergence is $2 + 2y + 2z$. Over the unit cube the three terms integrate to $2$, $1$ and $1$, so the net rate is $4$.'
          - problem: 'Let $\mathbf{F} = \langle x^2,\, y^2,\, z \rangle$. Find the outward flux of $\mathbf{F}$ through the closed cylinder $x^2 + y^2 \le 1$, $0 \le z \le 2$.'
            answer: '2pi'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The divergence is $2x + 2y + 1$. The terms $2x$ and $2y$ integrate to $0$ over the disk by symmetry, so only $1$ remains. That gives the volume $\pi \cdot 1^2 \cdot 2 = 2\pi$.'
          - problem: 'Air in a cubic room $[0,1]^3$, with lengths in meters, has velocity $\mathbf{F} = \langle x^2,\, y^2,\, cz \rangle$ meters per second, where $c$ is a constant. Air leaves through the walls at a net rate of $7$ cubic meters per second. Find $c$.'
            answer: '5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The divergence is $2x + 2y + c$. Over the unit cube the integral is $1 + 1 + c = c + 2$. Setting $c + 2 = 7$ gives $c = 5$.'
          - problem: 'Find the outward flux of $\mathbf{F} = \langle x^2,\, y^2,\, z \rangle$ through the boundary of the box $[0,1] \times [0,1] \times [0,2]$.'
            answer: '6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The divergence is not constant, so its value at one point cannot replace the integral. Over the box, $\iiint (2x + 2y + 1)\,dV = 2 + 2 + 2 = 6$, because each term integrates over the box to $2$.'
        constraints: "div F is a genuine polynomial (2x + 2y + 2z, 2 + 2z, 3z^2), never constant; solids are unit cubes, boxes, or cylinders integrated by slicing or in cylindrical coordinates"
      - id: kp2
        name: "Spherical solids"
        key_prerequisites: [divergence-curl, cylindrical-spherical-coordinates]
        exemplars:
          - problem: 'Use the divergence theorem to find the outward flux of $\mathbf{F} = \langle x^3,\, y^3,\, z^3 \rangle$ through the unit sphere.'
            answer: '12pi/5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The divergence is $3x^2 + 3y^2 + 3z^2 = 3\rho^2$. In spherical coordinates the flux is $3 \cdot 2\pi \cdot 2 \cdot \int_0^1 \rho^4\,d\rho = 12\pi \cdot \frac{1}{5} = \frac{12\pi}{5}$.'
          - problem: 'Use the divergence theorem to find the outward flux of $\mathbf{F} = \langle xy^2,\, yz^2,\, zx^2 \rangle$ through the unit sphere.'
            answer: '4pi/5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The divergence is $y^2 + z^2 + x^2 = \rho^2$. The integral is $\int_0^{2\pi}\!\int_0^{\pi}\!\int_0^1 \rho^4\sin\varphi\,d\rho\,d\varphi\,d\theta = 2\pi \cdot 2 \cdot \frac{1}{5} = \frac{4\pi}{5}$.'
          - problem: 'Heat flows with flux density $\mathbf{F} = \langle x^3 + x,\, y^3 + y,\, z^3 + z \rangle$ in a ball of radius $2$ m centered at the origin. Find the total rate at which heat leaves through the surface of the ball.'
            answer: '544pi/5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The divergence is $3\rho^2 + 3$. The flux is $4\pi\int_0^2 (3\rho^2 + 3)\,\rho^2\,d\rho = 4\pi\left(\frac{96}{5} + 8\right) = 4\pi \cdot \frac{136}{5} = \frac{544\pi}{5}$.'
          - problem: 'Let $\mathbf{F} = (x^2 + y^2 + z^2)\,\langle x,\, y,\, z \rangle$. Find the outward flux of $\mathbf{F}$ through the boundary of the unit ball.'
            answer: '4pi'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The divergence is $3\rho^2 + 2\rho^2 = 5\rho^2$. The flux is $4\pi\int_0^1 5\rho^2 \cdot \rho^2\,d\rho = 4\pi \cdot 1 = 4\pi$.'
          - problem: 'Let $\mathbf{F} = (x^2 + y^2 + z^2)^2\,\langle x,\, y,\, z \rangle$. Find the outward flux of $\mathbf{F}$ through the sphere of radius $2$ centered at the origin.'
            answer: '512pi'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The divergence is $3\rho^4 + 4\rho^4 = 7\rho^4$. The flux is $4\pi\int_0^2 7\rho^4 \cdot \rho^2\,d\rho = 4\pi \cdot 128 = 512\pi$.'
          - problem: 'Let $\mathbf{F} = \langle x^3 + xy^2,\, y^3 + yz^2,\, z^3 + zx^2 \rangle$. Find the outward flux of $\mathbf{F}$ through the unit sphere.'
            answer: '16pi/5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The divergence is $3x^2 + y^2 + 3y^2 + z^2 + 3z^2 + x^2 = 4\rho^2$. The flux is $4\pi\int_0^1 4\rho^2 \cdot \rho^2\,d\rho = 4\pi \cdot \frac{4}{5} = \frac{16\pi}{5}$.'
          - problem: 'A gas cloud is a ball of radius $R$ meters centered at the origin. The gas has velocity $\mathbf{F} = \langle x^3,\, y^3,\, z^3 \rangle$ meters per second, and the net rate at which gas leaves the ball is $\frac{384\pi}{5}$ cubic meters per second. Find $R$.'
            answer: '2'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'The divergence is $3\rho^2$, so the net rate is $4\pi\int_0^R 3\rho^4\,d\rho = \frac{12\pi R^5}{5}$. Setting $\frac{12\pi R^5}{5} = \frac{384\pi}{5}$ gives $R^5 = 32$, so $R = 2$ meters.'
          - problem: 'Find the outward flux of $\mathbf{F} = \langle x^3,\, y^3,\, z^3 \rangle$ through the sphere of radius $3$.'
            answer: '2916pi/5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The divergence $3\rho^2$ changes with $\rho$, so its boundary value cannot replace the integral. The flux is $4\pi\int_0^3 3\rho^4\,d\rho = \frac{12\pi \cdot 3^5}{5} = \frac{2916\pi}{5}$.'
        constraints: "div F reduces to a function of rho^2 alone; balls centered at the origin with radius 1 or 2; the triple integral is a product of one-variable integrals in spherical coordinates"
      - id: kp3
        name: "Strategic uses: closing surfaces and divergence-free fields"
        key_prerequisites: [divergence-curl, general-flux-integrals]
        exemplars:
          - problem: 'Find the upward flux of $\mathbf{F} = \langle y,\, -x,\, z \rangle$ through the paraboloid $z = 1 - x^2 - y^2$, $z \ge 0$, by closing the surface with the unit disk in the plane $z = 0$ and applying the divergence theorem.'
            answer: 'pi/2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The divergence is $0 + 0 + 1 = 1$, so the flux through the closed surface is the volume under the paraboloid, $\int_0^{2\pi}\!\int_0^1 (1 - r^2)\,r\,dr\,d\theta = \frac{\pi}{2}$. On the disk the field $\langle y, -x, 0 \rangle$ is tangent, so the disk adds $0$. The upward flux through the paraboloid is $\frac{\pi}{2}$.'
          - problem: 'Find the outward flux of $\mathbf{F} = \langle y,\, z,\, x \rangle$ through the sphere of radius $3$ centered at the origin.'
            answer: '0'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The divergence is $\partial_x(y) + \partial_y(z) + \partial_z(x) = 0$ everywhere. By the divergence theorem the outward flux is the integral of $0$ over the ball, which is $0$.'
          - problem: 'A tent has the shape $z = 3 - x^2 - y^2$, $z \ge 0$, with lengths in meters. Air moves with velocity $\mathbf{F} = \langle x,\, y,\, 2z \rangle$ meters per second. Find the rate, in cubic meters per second, at which air passes upward through the tent.'
            answer: '18pi'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Close the tent with the disk $x^2 + y^2 \le 3$ in the plane $z = 0$. The divergence is $1 + 1 + 2 = 4$ and the enclosed volume is $\frac{9\pi}{2}$, so the closed flux is $18\pi$. On the disk $\mathbf{F}\cdot\mathbf{n} = -2z = 0$, so the tent carries all of $18\pi$.'
          - problem: 'Find the outward flux of $\mathbf{F} = \langle y + z,\, z - x,\, x - y \rangle$ through the sphere $x^2 + y^2 + z^2 = 4$.'
            answer: '0'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The divergence is $\partial_x(y + z) + \partial_y(z - x) + \partial_z(x - y) = 0$. A field with zero divergence has zero outward flux through any closed surface, so the flux is $0$.'
          - problem: 'A hemispherical dome is the surface $x^2 + y^2 + z^2 = 1$, $z \ge 0$, with lengths in meters, open at the floor $z = 0$. Air moves with velocity $\mathbf{F} = \langle 0,\, 0,\, 2z + 3 \rangle$ meters per second. Find the rate, in cubic meters per second, at which air passes upward through the dome.'
            answer: '13pi/3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Close the dome with the floor disk. The divergence is $2$ and the half ball has volume $\frac{2\pi}{3}$, so the closed flux is $\frac{4\pi}{3}$. On the floor $\mathbf{n} = \langle 0, 0, -1 \rangle$ and $\mathbf{F}\cdot\mathbf{n} = -3$, which gives $-3\pi$. So the dome carries $\frac{4\pi}{3} + 3\pi = \frac{13\pi}{3}$.'
          - problem: 'The upward flux of $\mathbf{F} = \langle 0,\, 0,\, cz \rangle$ through the upper unit hemisphere $x^2 + y^2 + z^2 = 1$, $z \ge 0$, equals $\frac{16\pi}{3}$. Find the constant $c$.'
            answer: '8'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The divergence is $c$, so the closed flux through the hemisphere and the floor disk is $c \cdot \frac{2\pi}{3}$. On the floor $\mathbf{F}\cdot\mathbf{n} = -cz = 0$, so the hemisphere carries all of it. Setting $\frac{2\pi c}{3} = \frac{16\pi}{3}$ gives $c = 8$.'
          - problem: 'The upper unit hemisphere is closed with the disk $x^2 + y^2 \le 1$ in the plane $z = 0$. The upward flux of $\mathbf{F} = \langle 0,\, 0,\, z + 2 \rangle$ through the closed surface is $\frac{2\pi}{3}$. What is the upward flux through the hemisphere itself?'
            answer: '8pi/3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Subtract the flux through the floor disk. On it $\mathbf{n} = \langle 0, 0, -1 \rangle$ and $\mathbf{F}\cdot\mathbf{n} = -2$ over area $\pi$, so the disk carries $-2\pi$. The hemisphere carries $\frac{2\pi}{3} - (-2\pi) = \frac{8\pi}{3}$.'
        constraints: "closing exemplars use paraboloids or hemispheres capped by a flat disk on which F . n is 0 or constant; divergence-free exemplars require citing the theorem, not integrating; answers small rational multiples of pi or 0"
    diagnostic_exemplar:
      problem: 'Find the upward flux of $\mathbf{F} = \langle y,\; -x,\; z \rangle$ through the paraboloid $z = 4 - x^2 - y^2$, $z \ge 0$, by closing the surface with the disk $x^2 + y^2 \le 4$ in the plane $z = 0$ and applying the divergence theorem.'
      answer: '$8\pi$'
      solution_sketch: '$\operatorname{div}\mathbf{F} = 1$, so the total outward flux through the closed surface equals the volume $\int_0^{2\pi}\!\int_0^2 (4 - r^2)\,r\,dr\,d\theta = 8\pi$. On the bottom disk the outward normal is $\langle 0,0,-1\rangle$ and $\mathbf{F}\cdot\mathbf{n} = -z = 0$, so the whole $8\pi$ passes upward through the paraboloid.'
    anki_seeds:
      - front: 'If $\operatorname{div}\mathbf{F} = 0$ everywhere, what is the outward flux of $\mathbf{F}$ through any closed surface?'
        back: '$0$ — by the divergence theorem the flux equals $\iiint \operatorname{div}\mathbf{F}\, dV = 0$.'
        type: basic
      - front: 'Strategy for computing the flux of $\mathbf{F}$ through a surface $S$ that is NOT closed, using the divergence theorem?'
        back: 'Close $S$ with a simple cap (usually a flat disk), apply the theorem to the enclosed solid, then subtract the cap''s flux.'
        type: basic
      - front: 'The divergence theorem applies to surfaces that are ___ and oriented ___.'
        back: 'Closed (bounding a solid region); oriented by the outward normal.'
        type: basic
