unit: multiple-integrals
course: multivariable-calculus
module: "Multiple Integrals"
topics:
  - id: iterated-integrals-rectangles
    name: "Iterated Integrals over Rectangles"
    core: true
    difficulty: 0.66
    drill: false
    answer_kind: numeric
    expected_time_secs: 150
    prerequisites:
      - id: definite-integrals-ftc
        weight: 0.8
        key: true
      - id: functions-several-variables
        weight: 0.5
        key: true
    knowledge_points:
      - id: kp1
        name: "Partial (inner) integration"
        key_prerequisites: [definite-integrals-ftc]
        exemplars:
          - problem: 'Evaluate the inner integral $\int_0^1 x y^2 \, dy$ (treat $x$ as a constant).'
            answer: '$\frac{x}{3}$'
            solution_sketch: '$x \int_0^1 y^2\, dy = x \cdot \frac{1}{3}$.'
          - problem: 'Evaluate $\int_0^2 (2x + y) \, dx$ (treat $y$ as a constant).'
            answer: '$4 + 2y$'
            solution_sketch: '$\left[x^2 + xy\right]_0^2 = 4 + 2y$.'
          - problem: "Evaluate the inner integral $\\int_1^3 (x^2 + 2xy)\\,dy$ (treat $x$ as a constant). Give the result as a function of $x$."
            answer: "2x^2+8x"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "The full object is $\\int_1^3 (x^2+2xy)\\,dy$. By linearity, split it into $x^2\\int_1^3 dy$ and $2x\\int_1^3 y\\,dy$. The power rule gives $x^2 y + x y^2$; evaluating at 3 and 1 gives $2x^2+8x$. The result is 2x^2+8x."
          - problem: "Evaluate the inner integral $\\int_0^2 (3xy^2 + y)\\,dx$ (treat $y$ as a constant). Give the result as a function of $y$."
            answer: "6y^2+2y"
            answer_contract: {"kind": "function", "vars": ["y"]}
            solution_sketch: "The full object is $\\int_0^2 (3xy^2 + y)\\,dx$. By linearity, write it as $3y^2\\int_0^2 x\\,dx + y\\int_0^2 dx$. The power rule gives $3y^2(x^2/2) + yx$; evaluating from 0 to 2 gives $6y^2+2y$. The result is 6y^2+2y."
          - problem: "Evaluate the inner integral $\\int_0^x (2y + 3)\\,dy$ (treat $x$ as a parameter). Give the result as a function of $x$."
            answer: "x^2+3x"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "The full object is $\\int_0^x (2y+3)\\,dy$. The power rule gives the antiderivative $y^2+3y$. Evaluate at $y=x$ and $y=0$: $(x^2+3x)-0=x^2+3x$. The result is x^2+3x."
          - problem: "Evaluate the inner integral $\\int_1^2 4xy^3\\,dx$ (treat $y$ as a constant). Give the result as a function of $y$."
            answer: "6y^3"
            answer_contract: {"kind": "function", "vars": ["y"]}
            solution_sketch: "The full object is $\\int_1^2 4xy^3\\,dx$. Factor the constant $4y^3$ and use the power rule: $4y^3\\int_1^2 x\\,dx = 4y^3[x^2/2]_1^2$. Evaluate: $4y^3(2-1/2)=4y^3(3/2)=6y^3$. The result is 6y^3."
        constraints: "polynomial integrands; the non-integrated variable survives as a parameter in the answer"
      - id: kp2
        name: "Iterated integrals over rectangles"
        key_prerequisites: [definite-integrals-ftc, functions-several-variables]
        exemplars:
          - problem: 'Evaluate $\int_0^2 \int_0^1 x y^2 \, dy \, dx$.'
            answer: '$\frac{2}{3}$'
            solution_sketch: 'Inner: $\int_0^1 y^2\, dy = \frac{1}{3}$, leaving $\int_0^2 \frac{x}{3}\, dx = \frac{1}{3}\cdot 2 = \frac{2}{3}$.'
          - problem: 'Evaluate $\int_0^1 \int_0^2 (x + 2y) \, dy \, dx$.'
            answer: "5"
            solution_sketch: 'Inner: $\left[xy + y^2\right]_0^2 = 2x + 4$; then $\int_0^1 (2x + 4)\, dx = 1 + 4 = 5$.'
          - problem: "Evaluate $\\int_0^1 \\int_0^3 (x^2 + y) \\, dy \\, dx$ and give the exact value as a fraction."
            answer: "11/2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "For $\\int_0^1 \\int_0^3 (x^2 + y) \\, dy \\, dx$, hold $x$ fixed and integrate $y$ from 0 to 3 by the Fundamental Theorem of Calculus, giving $3x^2 + 9/2$. Then integrate $3x^2 + 9/2$ in $x$ from 0 to 1 by the Fundamental Theorem of Calculus, giving $x^3 + (9/2)x$ evaluated from 0 to 1, which is $1 + 9/2$. The value is 11/2."
          - problem: "Evaluate $\\int_0^2 \\int_0^3 (x + y^2) \\, dy \\, dx$ and give the exact value."
            answer: "24"
            answer_contract: {"kind": "exact"}
            solution_sketch: "For $\\int_0^2 \\int_0^3 (x + y^2) \\, dy \\, dx$, hold $x$ fixed and integrate $y$ from 0 to 3 by the Fundamental Theorem of Calculus, giving $3x + 9$. Then integrate $3x + 9$ in $x$ from 0 to 2 by the Fundamental Theorem of Calculus, giving $(3/2)x^2 + 9x$ evaluated from 0 to 2, which is $6 + 18$. The value is 24."
          - problem: "Evaluate $\\int_0^1 \\int_0^4 (x y + x^2) \\, dy \\, dx$ and give the exact value as a fraction."
            answer: "16/3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "For $\\int_0^1 \\int_0^4 (x y + x^2) \\, dy \\, dx$, hold $x$ fixed and integrate $y$ from 0 to 4 by the Fundamental Theorem of Calculus, giving $8x + 4x^2$. Then integrate $8x + 4x^2$ in $x$ from 0 to 1 by the Fundamental Theorem of Calculus, giving $4x^2 + (4/3)x^3$ evaluated from 0 to 1, which is $4 + 4/3$. The value is 16/3."
          - problem: "Evaluate $\\int_1^2 \\int_0^1 (x y + y^2) \\, dy \\, dx$ and give the exact value as a fraction."
            answer: "13/12"
            answer_contract: {"kind": "exact"}
            solution_sketch: "For $\\int_1^2 \\int_0^1 (x y + y^2) \\, dy \\, dx$, hold $x$ fixed and integrate $y$ from 0 to 1 by the Fundamental Theorem of Calculus, giving $x/2 + 1/3$. Then integrate $x/2 + 1/3$ in $x$ from 1 to 2 by the Fundamental Theorem of Calculus, giving $x^2/4 + x/3$ evaluated from 1 to 2, which is $(1 + 2/3) - (1/4 + 1/3) = 13/12$. The value is 13/12."
        constraints: "polynomial integrands; rectangle bounds are small integers; answers exact rationals"
      - id: kp3
        name: "Fubini's theorem and separable products"
        key_prerequisites: [definite-integrals-ftc, functions-several-variables]
        exemplars:
          - problem: 'Evaluate $\iint_R 6x^2 y \, dA$ where $R = [0,1] \times [0,2]$.'
            answer: "4"
            solution_sketch: 'Separable: $\left(\int_0^1 6x^2\, dx\right)\left(\int_0^2 y\, dy\right) = 2 \cdot 2 = 4$.'
          - problem: 'Evaluate $\iint_R x \sin y \, dA$ where $R = [0,1] \times [0,\pi]$.'
            answer: "1"
            solution_sketch: '$\left(\int_0^1 x\, dx\right)\left(\int_0^\pi \sin y\, dy\right) = \frac{1}{2} \cdot 2 = 1$.'
          - problem: "Evaluate $\\iint_R 3x^2 y^3 \\, dA$ where $R = [0,1] \\times [0,1]$."
            answer: "1/4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "By Fubini's theorem, the product integrand separates: the integral equals $\\left(\\int_0^1 3x^2\\, dx\\right)\\left(\\int_0^1 y^3\\, dy\\right)$. The x-integral is $1$ and the y-integral is $1/4$. Their product is $1/4$, so the value of the double integral is 1/4."
          - problem: "Evaluate $\\iint_R x^2 \\sin y \\, dA$ where $R = [0,3] \\times [0,\\pi]$."
            answer: "18"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Fubini's theorem lets the product integrand factor: the double integral equals $\\left(\\int_0^3 x^2\\, dx\\right)\\left(\\int_0^\\pi \\sin y\\, dy\\right)$. The x-integral is $9$ and the y-integral is $2$. Multiplying gives 18."
          - problem: "Let $R = [0,1] \\times [0,1]$. The double integral $\\iint_R c x^2 y \\, dA$ has value $5$. Find the constant $c$."
            answer: "30"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Separate the product integrand by Fubini's theorem: $\\iint_R c x^2 y \\, dA = c\\left(\\int_0^1 x^2\\, dx\\right)\\left(\\int_0^1 y\\, dy\\right)$. The single integrals are $1/3$ and $1/2$, so the integral equals $c/6$. Set $c/6 = 5$ and solve: the constant is 30."
          - problem: "Evaluate $\\iint_R 3x \\sin y \\, dA$ where $R = [0,1] \\times [0,\\pi/2]$."
            answer: "3/2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The integrand is a product, so Fubini's theorem gives $\\iint_R 3x \\sin y \\, dA = \\left(\\int_0^1 3x\\, dx\\right)\\left(\\int_0^{\\pi/2} \\sin y\\, dy\\right)$. The x-integral is $3/2$ and the y-integral is $1$. Their product is 3/2."
        constraints: "integrands are products g(x)h(y); factor into two single-variable integrals"
    diagnostic_exemplar:
      problem: 'Evaluate $\int_0^1 \int_0^2 4xy \, dy \, dx$.'
      answer: "4"
      solution_sketch: 'Inner: $\int_0^2 4xy\, dy = 8x$; then $\int_0^1 8x\, dx = 4$.'
    anki_seeds:
      - front: 'Fubini''s theorem (informal) for continuous $f$ on a rectangle?'
        back: 'The double integral equals the iterated integral in either order: $\int\!\!\int f\, dy\, dx = \int\!\!\int f\, dx\, dy$.'
        type: basic
      - front: 'How do you evaluate an iterated integral $\int_a^b \int_c^d f\, dy\, dx$?'
        back: 'Inside out: integrate in $y$ treating $x$ as constant, then integrate the result in $x$.'
        type: basic

  - id: describing-planar-regions
    name: "Describing Regions of Integration"
    core: true
    difficulty: 0.68
    drill: false
    answer_kind: numeric
    expected_time_secs: 150
    prerequisites:
      - id: area-between-curves
        weight: 0.6
        key: true
      - id: graphing-linear-equations
        weight: 0.3
        key: false
    knowledge_points:
      - id: kp1
        name: "Type I descriptions (vertical slices)"
        key_prerequisites: [area-between-curves]
        exemplars:
          - problem: 'Describe the region bounded by $y = x^2$ and $y = x$ as a type I region.'
            answer: '$0 \le x \le 1$, $\;x^2 \le y \le x$'
            answer_contract: {kind: none}
            solution_sketch: 'The curves meet at $(0,0)$ and $(1,1)$, and $x \ge x^2$ on $[0,1]$.'
          - problem: 'Describe the triangle with vertices $(0,0)$, $(1,0)$, $(1,1)$ as a type I region.'
            answer: '$0 \le x \le 1$, $\;0 \le y \le x$'
            solution_sketch: 'The triangle has $0\le x\le 1$ with $y$ from the bottom edge $y=0$ to the top edge $y=x$.'
            answer_contract: {kind: none}
        constraints: "regions bounded by lines and one parabola; intersection points at integer coordinates"
      - id: kp2
        name: "Type II descriptions (horizontal slices)"
        key_prerequisites: [area-between-curves]
        exemplars:
          - problem: 'Describe the region bounded by $y = x^2$ and $y = x$ as a type II region.'
            answer: '$0 \le y \le 1$, $\;y \le x \le \sqrt{y}$'
            answer_contract: {kind: none}
            solution_sketch: 'Solve each boundary for $x$: the line $y = x$ gives $x = y$ (left edge), the parabola $y = x^2$ gives $x = \sqrt{y}$ (right edge); on $[0, 1]$, $y \le \sqrt{y}$.'
          - problem: 'Describe the triangle with vertices $(0,0)$, $(1,0)$, $(1,1)$ as a type II region.'
            answer: '$0 \le y \le 1$, $\;y \le x \le 1$'
            solution_sketch: 'For fixed $y\in[0,1]$, $x$ runs from the edge $x=y$ to the edge $x=1$.'
            answer_contract: {kind: none}
        constraints: "same regions as kp1 re-sliced horizontally; boundaries solved for x in terms of y"
      - id: kp3
        name: "Reading the region from an iterated integral"
        key_prerequisites: [area-between-curves]
        exemplars:
          - problem: 'Sketch/describe the region of $\int_0^1 \int_y^1 f(x,y) \, dx \, dy$ and rewrite the integral with the order reversed.'
            answer: 'The triangle $0 \le y \le x \le 1$; reversed: $\int_0^1 \int_0^x f(x,y)\, dy\, dx$.'
            solution_sketch: 'The inner integral has $x\ge y$, $0\le y\le 1$, so the region is the triangle $0\le y\le x\le 1$; reversing gives $\int_0^1\int_0^x f\,dy\,dx$.'
            answer_contract: {kind: none}
          - problem: 'The first-quadrant region under $y = 4 - x^2$ is $0 \le x \le 2$, $0 \le y \le 4 - x^2$. Describe it as a type II region.'
            answer: '$0 \le y \le 4$, $\;0 \le x \le \sqrt{4 - y}$'
            solution_sketch: 'For fixed $y\in[0,4]$ the region runs from $x=0$ to $x=\sqrt{4-y}$.'
            answer_contract: {kind: none}
        constraints: "regions are triangles or parabola-bounded; both orders must be written with exact bounds"
    diagnostic_exemplar:
      problem: 'Describe the region of $\int_0^2 \int_x^2 f(x, y)\,dy\,dx$, and rewrite the integral with the order of integration reversed.'
      answer: 'The triangle $0 \le x \le y \le 2$ (vertices $(0,0)$, $(0,2)$, $(2,2)$); reversed, $\int_0^2 \int_0^y f(x, y)\,dx\,dy$.'
      answer_contract: {kind: none}
      solution_sketch: 'The given limits are the type I description $0 \le x \le 2$, $x \le y \le 2$. Slicing horizontally instead: $y$ runs over $[0, 2]$ and, for each $y$, $x$ runs from $0$ to $y$.'
    anki_seeds:
      - front: 'Type I vs type II region?'
        back: 'Type I: $a \le x \le b$, $g_1(x) \le y \le g_2(x)$. Type II: $c \le y \le d$, $h_1(y) \le x \le h_2(y)$.'
        type: basic
      - front: 'First step when reversing the order of an iterated integral?'
        back: 'Sketch the region from the given bounds, then re-slice it in the other direction.'
        type: basic

  - id: double-integrals
    name: "Double Integrals over General Regions"
    core: true
    difficulty: 0.72
    drill: false
    answer_kind: numeric
    expected_time_secs: 240
    prerequisites:
      - id: iterated-integrals-rectangles
        weight: 0.8
        key: true
      - id: describing-planar-regions
        weight: 0.7
        key: true
      - id: integration-substitution
        weight: 0.4
        key: false
    knowledge_points:
      - id: kp1
        name: "General regions (type I and type II)"
        key_prerequisites: [iterated-integrals-rectangles, describing-planar-regions]
        exemplars:
          - problem: 'Evaluate $\iint_D x \, dA$ where $D$ is bounded by $y = x^2$ and $y = x$.'
            answer: '$\frac{1}{12}$'
            solution_sketch: 'On $[0,1]$, $x \ge x^2$: $\int_0^1 \int_{x^2}^{x} x \, dy\, dx = \int_0^1 x(x - x^2)\, dx = \frac{1}{3} - \frac{1}{4} = \frac{1}{12}$.'
          - problem: 'Evaluate $\iint_D xy \, dA$ where $D$ is the triangle with vertices $(0,0)$, $(1,0)$, $(1,1)$.'
            answer: '$\frac{1}{8}$'
            solution_sketch: 'Type I: $0 \le x \le 1$, $0 \le y \le x$: $\int_0^1 x \cdot \frac{x^2}{2}\, dx = \frac{1}{2}\cdot\frac{1}{4} = \frac{1}{8}$.'
          - problem: "Evaluate $\\iint_D y \\, dA$ where $D$ is bounded by $y = x^2$ and $y = 4$."
            answer: "128/5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full object is $\\iint_D y \\, dA$ over the region between $y = x^2$ and $y = 4$. First use a type I setup: the curves meet at $x = -2$ and $x = 2$, so $\\int_{-2}^{2} \\int_{x^2}^{4} y \\, dy \\, dx$. The inner integral by the power rule is $(16 - x^4)/2$. The outer integral is $\\frac{1}{2}\\int_{-2}^{2}(16 - x^4)\\,dx = \\frac{1}{2}(32 - 64/5)$. The value is 128/5."
          - problem: "Evaluate $\\iint_D x \\, dA$ where $D$ is bounded by $y = x^2$ and $y = 2x$."
            answer: "4/3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full object is $\\iint_D x \\, dA$ over the region between $y = x^2$ and $y = 2x$. Set up a type I integral: the intersections are $x = 0$ and $x = 2$, and $2x \\ge x^2$ on that interval, so $\\int_0^2 \\int_{x^2}^{2x} x \\, dy \\, dx$. The inner integral gives $x(2x - x^2) = 2x^2 - x^3$. The outer integral by the power rule is $\\int_0^2 (2x^2 - x^3)\\,dx = 16/3 - 4$. The value is 4/3."
          - problem: "Evaluate $\\iint_D 1 \\, dA$ where $D$ is bounded by $x = y^2$ and $x = 4$."
            answer: "32/3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full object is $\\iint_D 1 \\, dA$ over the region between $x = y^2$ and $x = 4$. Use a type II setup: the intersections are $y = -2$ and $y = 2$, so $\\int_{-2}^{2} \\int_{y^2}^{4} 1 \\, dx \\, dy$. The inner integral gives $4 - y^2$. The outer integral by the power rule is $\\int_{-2}^{2}(4 - y^2)\\,dy = [4y - y^3/3]_{-2}^{2}$. The value is 32/3."
          - problem: "Evaluate $\\iint_D xy \\, dA$ where $D$ is bounded by $y = x^2$, $y = 0$, and $x = 2$."
            answer: "16/3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full object is $\\iint_D xy \\, dA$ over the region bounded by $y = x^2$, $y = 0$, and $x = 2$. Use a type I setup: $0 \\le x \\le 2$ and $0 \\le y \\le x^2$, so $\\int_0^2 \\int_0^{x^2} xy \\, dy \\, dx$. The inner integral by the power rule is $x(x^4)/2 = x^5/2$. The outer integral is $\\frac{1}{2}\\int_0^2 x^5\\,dx = \\frac{1}{2}(64/6)$. The value is 16/3."
        constraints: "regions bounded by lines and one parabola; intersection points at integer coordinates"
      - id: kp2
        name: "Volumes and harder regions"
        key_prerequisites: [iterated-integrals-rectangles, describing-planar-regions]
        exemplars:
          - problem: 'Find the volume under the plane $z = x + y$ and above the triangle $x \ge 0$, $y \ge 0$, $x + y \le 1$.'
            answer: '$\frac{1}{3}$'
            solution_sketch: '$\int_0^1 \int_0^{1-x} (x+y)\, dy\, dx = \int_0^1 \left(x(1-x) + \frac{(1-x)^2}{2}\right) dx = \frac{1}{6} + \frac{1}{6} = \frac{1}{3}$.'
          - problem: 'Evaluate $\iint_D (2x + y) \, dA$ where $D$ is bounded by $y = x^2$ and $y = 4$.'
            answer: '$\frac{128}{5}$'
            solution_sketch: '$\int_{-2}^2 \int_{x^2}^4 (2x + y)\, dy\, dx$: the $2x$ part integrates to zero by symmetry, leaving $\int_{-2}^2 \frac{16 - x^4}{2}\, dx = 32 - \frac{32}{5} = \frac{128}{5}$.'
          - problem: "Find the volume under z = x + y + 2 over the triangle x >= 0, y >= 0, x + y <= 1."
            answer: "4/3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The volume is V = double integral over D of (x + y + 2) dA, where D is x >= 0, y >= 0, x + y <= 1. Step 1 (describe the region): set up the iterated integral with y from 0 to 1 - x and x from 0 to 1. Step 2 (iterated integration): integrate (x + y + 2) in y to get x(1 - x) + (1 - x)^2/2 + 2(1 - x). Step 3 (integrate in x): the x integral gives 1/6 + 1/6 + 1 = 4/3. The volume is 4/3."
          - problem: "Evaluate the double integral of 3x + 2y over D, where D is the region between y = x^2 and y = 4."
            answer: "256/5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The double integral is I = double integral over D of (3x + 2y) dA, with D between y = x^2 and y = 4. Step 1 (symmetry): D is symmetric about the y-axis and 3x is odd in x, so that term vanishes. Step 2 (iterated integration): integrate 2y in y from x^2 to 4 to get 16 - x^4. Step 3 (integrate in x): integrate 16 - x^4 from -2 to 2 to get 256/5. The value of the integral is 256/5."
          - problem: "Evaluate the double integral of x + y over D, where D is the triangle with vertices (0,0), (2,2), and (0,2)."
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The double integral is I = double integral over D of (x + y) dA, where D is the triangle with vertices (0,0), (2,2), and (0,2). Step 1 (describe the region): write D as 0 <= x <= 2 and x <= y <= 2. Step 2 (iterated integration): integrate x + y in y to get x(2 - x) + (4 - x^2)/2. Step 3 (integrate in x): integrate 2 + 2x - (3/2)x^2 from 0 to 2 to get 4. The value of the integral is 4."
          - problem: "Find the volume under z = x^3 + y over the region between y = x^2 and y = 1."
            answer: "4/5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The volume is V = double integral over D of (x^3 + y) dA, where D is the region between y = x^2 and y = 1. Step 1 (symmetry): D is symmetric about the y-axis and x^3 is odd, so that term vanishes. Step 2 (iterated integration): integrate y in y from x^2 to 1 to get (1 - x^4)/2. Step 3 (integrate in x): integrate (1 - x^4)/2 from -1 to 1 to get 4/5. The volume is 4/5."
        constraints: "volume interpretation z = f(x,y) >= 0; symmetric regions where odd terms vanish; answers exact rationals"
      - id: kp3
        name: "Reversing the order of integration"
        key_prerequisites: [iterated-integrals-rectangles, describing-planar-regions, integration-substitution]
        exemplars:
          - problem: 'Evaluate $\int_0^1 \int_y^1 e^{x^2} \, dx \, dy$ by reversing the order of integration.'
            answer: '$\frac{e - 1}{2}$'
            solution_sketch: 'The region is $0 \le y \le x \le 1$; reversed: $\int_0^1 \int_0^x e^{x^2}\, dy\, dx = \int_0^1 x e^{x^2}\, dx = \frac{e-1}{2}$.'
          - problem: 'Evaluate $\int_0^1 \int_x^1 \sin(y^2) \, dy \, dx$ by reversing the order of integration.'
            answer: '$\frac{1 - \cos 1}{2}$'
            solution_sketch: 'Region $0 \le x \le y \le 1$; reversed: $\int_0^1 y \sin(y^2)\, dy = \left[-\frac{\cos(y^2)}{2}\right]_0^1$.'
          - problem: "Evaluate $\\int_0^2 \\int_{y/2}^{1} e^{x^2} \\, dx \\, dy$ by reversing the order of integration."
            answer: "e-1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Region: 0 <= y <= 2 and y/2 <= x <= 1 becomes 0 <= x <= 1 and 0 <= y <= 2x. Reversed integral: $\\int_0^1 \\int_0^{2x} e^{x^2} \\, dy \\, dx = \\int_0^1 2x e^{x^2} \\, dx$. Use substitution $u = x^2$, $du = 2x\\,dx$, to get $\\int_0^1 e^u \\, du = e - 1$. The value is e-1."
          - problem: "Evaluate $\\int_0^2 \\int_y^2 e^{x^2} \\, dx \\, dy$ by reversing the order of integration."
            answer: "(e^4-1)/2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Region: 0 <= y <= 2 and y <= x <= 2 becomes 0 <= x <= 2 and 0 <= y <= x. Reversed integral: $\\int_0^2 \\int_0^x e^{x^2} \\, dy \\, dx = \\int_0^2 x e^{x^2} \\, dx$. Use substitution $u = x^2$, $du = 2x\\,dx$, to get $\\frac{1}{2}(e^4 - 1)$. The value is (e^4-1)/2."
          - problem: "Evaluate $\\int_0^{1/2} \\int_{2x}^{1} e^{y^2} \\, dy \\, dx$ by reversing the order of integration."
            answer: "(e-1)/4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Region: 0 <= x <= 1/2 and 2x <= y <= 1 becomes 0 <= y <= 1 and 0 <= x <= y/2. Reversed integral: $\\int_0^1 \\int_0^{y/2} e^{y^2} \\, dx \\, dy = \\int_0^1 (y/2) e^{y^2} \\, dy$. Use substitution $u = y^2$, $du = 2y\\,dy$, to get $\\frac{1}{4}(e - 1)$. The value is (e-1)/4."
          - problem: "Evaluate $\\int_0^{1/2} \\int_{2x}^{1} \\sin(y^2) \\, dy \\, dx$ by reversing the order of integration. Give the answer to 4 decimals."
            answer: "0.1149"
            answer_contract: {"decimals": 4, "kind": "approx"}
            solution_sketch: "Region: 0 <= x <= 1/2 and 2x <= y <= 1 becomes 0 <= y <= 1 and 0 <= x <= y/2. Reversed integral: $\\int_0^1 \\int_0^{y/2} \\sin(y^2) \\, dx \\, dy = \\int_0^1 (y/2) \\sin(y^2) \\, dy$. Use substitution $u = y^2$, $du = 2y\\,dy$, to get $\\frac{1}{4}(1 - \\cos 1)$. Numerically this is 0.1149 to 4 decimals. The answer is 0.1149."
        constraints: "inner integrand has no elementary antiderivative in the given order (e^{x^2}, sin(y^2)); reversal makes it a u-substitution"
    diagnostic_exemplar:
      problem: 'Evaluate $\int_0^1 \int_{3y}^{3} e^{x^2}\,dx\,dy$ by reversing the order of integration.'
      answer: '$\dfrac{e^9 - 1}{6}$'
      answer_contract: {kind: none}
      solution_sketch: 'The region $0 \le y \le 1$, $3y \le x \le 3$ is the triangle $0 \le x \le 3$, $0 \le y \le x/3$. Reversed: $\int_0^3 \int_0^{x/3} e^{x^2}\,dy\,dx = \int_0^3 \frac{x}{3}e^{x^2}\,dx = \frac{1}{6}\left[e^{x^2}\right]_0^3 = \frac{e^9 - 1}{6}$.'
    anki_seeds:
      - front: 'When must you reverse the order of integration in a double integral?'
        back: 'When the inner integrand has no elementary antiderivative in the given order (e.g. $e^{x^2}$, $\sin(y^2)$).'
        type: basic
      - front: 'Geometric meaning of $\iint_D f\, dA$ for $f \ge 0$?'
        back: 'The volume under the surface $z = f(x, y)$ above the region $D$.'
        type: basic

  - id: multivariable-average-value
    name: "Average Value over a Region"
    core: false                # head of the terminal mass/moments application branch
    difficulty: 0.72
    drill: false
    answer_kind: numeric
    expected_time_secs: 150
    prerequisites:
      - id: double-integrals
        weight: 0.7
        key: true
      - id: average-value-function
        weight: 0.5
        key: true
    knowledge_points:
      - id: kp1
        name: "Average value over rectangles"
        key_prerequisites: [double-integrals, average-value-function]
        exemplars:
          - problem: 'Find the average value of $f(x, y) = xy$ over $R = [0,2] \times [0,4]$.'
            answer: "2"
            solution_sketch: '$\bar{f} = \frac{1}{8}\iint_R xy\, dA = \frac{1}{8} \cdot 2 \cdot 8 = 2$.'
          - problem: 'Find the average value of $f(x, y) = x^2$ over $R = [0,3] \times [0,1]$.'
            answer: "3"
            solution_sketch: '$\frac{1}{3}\int_0^3 x^2\, dx \cdot \int_0^1 dy = \frac{1}{3} \cdot 9 = 3$.'
          - problem: "Find the average value of f(x, y) = x y^2 over the rectangle R = [0,1] x [0,2]. Give the answer as a fraction."
            answer: "2/3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The average value formula is \\bar f = (1/Area(R)) \\iint_R f(x,y) dA. The rectangle area is (1-0)(2-0)=2, and by separability the integral is (\\int_0^1 x dx)(\\int_0^2 y^2 dy) = (1/2)(8/3)=4/3. Divide by the area: (4/3)/2 = 2/3. The average value is 2/3."
          - problem: "Find the average value of f(x, y) = x^2 y^2 over the rectangle R = [0,1] x [0,2]. Give the answer as a fraction."
            answer: "4/9"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The average value formula is \\bar f = (1/Area(R)) \\iint_R f(x,y) dA. The area is 2. Separability gives the integral (\\int_0^1 x^2 dx)(\\int_0^2 y^2 dy) = (1/3)(8/3)=8/9. The average is (8/9)/2 = 4/9. The average value is 4/9."
          - problem: "Compute the average value of f(x, y) = y^3 over the rectangle R = [0,2] x [0,1]. Give the answer as a fraction."
            answer: "1/4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The average value formula is \\bar f = (1/Area(R)) \\iint_R f(x,y) dA. The area is 2. Since f does not depend on x, the integral factors as (\\int_0^2 1 dx)(\\int_0^1 y^3 dy) = (2)(1/4)=1/2. Divide by the area: (1/2)/2 = 1/4. The average value is 1/4."
          - problem: "The temperature at a point (x, y) on a rectangular plate is T(x, y) = x^2 y, where R = [0,1] x [0,3]. Find the average temperature over the plate as a fraction."
            answer: "1/2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The average temperature is the average value formula \\bar T = (1/Area(R)) \\iint_R T(x,y) dA. The plate area is (1)(3)=3. Separability gives the integral (\\int_0^1 x^2 dx)(\\int_0^3 y dy) = (1/3)(9/2)=3/2. Divide by the area: (3/2)/3 = 1/2. The average temperature is 1/2."
        constraints: "separable integrands over small-integer rectangles; averages are integers or simple fractions"
      - id: kp2
        name: "Average value over general regions"
        key_prerequisites: [double-integrals, average-value-function]
        exemplars:
          - problem: 'Find the average value of $f(x, y) = x$ over the triangle with vertices $(0,0)$, $(2,0)$, $(2,2)$.'
            answer: '$\frac{4}{3}$'
            solution_sketch: 'Area $= 2$; $\iint x\, dA = \int_0^2 \int_0^x x\, dy\, dx = \int_0^2 x^2\, dx = \frac{8}{3}$; average $= \frac{8/3}{2} = \frac{4}{3}$.'
          - problem: 'Find the average value of $f(x, y) = y$ over the triangle with vertices $(0,0)$, $(1,0)$, $(0,1)$.'
            answer: '$\frac{1}{3}$'
            solution_sketch: 'Area $= \frac{1}{2}$; $\iint y\, dA = \int_0^1 \frac{(1-x)^2}{2}\, dx = \frac{1}{6}$; average $= \frac{1/6}{1/2} = \frac{1}{3}$.'
        constraints: "triangular regions with integer vertices; remember to divide by the AREA, not by a side length"
    diagnostic_exemplar:
      problem: 'Find the average value of $f(x, y) = x + y$ over the triangle with vertices $(0,0)$, $(2,0)$, $(0,2)$.'
      answer: '$\dfrac{4}{3}$'
      answer_contract: {kind: none}
      solution_sketch: 'The triangle has area $2$. By symmetry $\iint (x+y)\,dA = 2\iint x\,dA = 2\int_0^2 x(2 - x)\,dx = 2\left(4 - \tfrac{8}{3}\right) = \tfrac{8}{3}$, so the average is $\tfrac{8}{3} \div 2 = \tfrac{4}{3}$.'
    anki_seeds:
      - front: 'Average value of $f$ over a plane region $D$?'
        back: '$\bar{f} = \dfrac{1}{\operatorname{Area}(D)} \iint_D f \, dA$'
        type: basic
      - front: 'When averaging $f$ over a region $D$, what exactly do you divide the integral by?'
        back: 'By $\operatorname{Area}(D) = \iint_D 1\, dA$ — never by a side length, a radius, or the length of an interval.'
        type: basic

  - id: double-integral-applications
    name: "Mass, Moments, and Centroids"
    core: false                # mass, moments and centroids application; terminal
    difficulty: 0.76
    drill: false
    answer_kind: numeric
    expected_time_secs: 240
    prerequisites:
      - id: double-integrals
        weight: 0.8
        key: true
      - id: multivariable-average-value
        weight: 0.4
        key: false
    knowledge_points:
      - id: kp1
        name: "Mass of a lamina"
        key_prerequisites: [double-integrals]
        exemplars:
          - problem: 'Find the mass of the lamina occupying $[0,1] \times [0,1]$ with density $\rho(x, y) = x + y$.'
            answer: "1"
            solution_sketch: '$m = \iint (x + y)\, dA = \frac{1}{2} + \frac{1}{2} = 1$.'
          - problem: 'Find the mass of the triangular lamina with vertices $(0,0)$, $(1,0)$, $(1,1)$ and density $\rho(x, y) = 2xy$.'
            answer: '$\frac{1}{4}$'
            solution_sketch: '$m = \int_0^1 \int_0^x 2xy\, dy\, dx = \int_0^1 x \cdot x^2\, dx = \frac{1}{4}$.'
          - problem: "Find the mass of the lamina occupying $[0,1] \\times [0,2]$ with density $\\rho(x, y) = 3x + y$."
            answer: "5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The mass is $m = \\iint_R (3x + y)\\, dA$ over $R = [0,1] \\times [0,2]$. Set up the iterated integral by the definition of mass: $m = \\int_0^1 \\int_0^2 (3x + y)\\, dy\\, dx$. Evaluate the inner integral by the power rule: $6x + 2$. Evaluate the outer integral by the power rule: $\\int_0^1 (6x + 2)\\, dx = 3 + 2 = 5$. The mass is 5."
          - problem: "Find the mass of the triangular lamina with vertices $(0,0)$, $(2,0)$, $(0,1)$ and density $\\rho(x, y) = 2x + y$ as a fraction."
            answer: "5/3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The mass is $m = \\iint_T (2x + y)\\, dA$ over the triangle $0 \\le x \\le 2$, $0 \\le y \\le 1 - x/2$. Set up the iterated integral by the definition of mass: $m = \\int_0^2 \\int_0^{1 - x/2} (2x + y)\\, dy\\, dx$. Evaluate the inner integral by the power rule: $(3/2)x + 1/2 - (7/8)x^2$. Evaluate the outer integral by the power rule: $\\int_0^2 ((3/2)x + 1/2 - (7/8)x^2)\\, dx = 5/3$. The mass is 5/3."
          - problem: "Find the mass of the lamina occupying $[0,1] \\times [0,3]$ with density $\\rho(x, y) = x^2 + y$ as a fraction."
            answer: "11/2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The mass is $m = \\iint_R (x^2 + y)\\, dA$ over $R = [0,1] \\times [0,3]$. Set up the iterated integral by the definition of mass: $m = \\int_0^1 \\int_0^3 (x^2 + y)\\, dy\\, dx$. Evaluate the inner integral by the power rule: $3x^2 + 9/2$. Evaluate the outer integral by the power rule: $\\int_0^1 (3x^2 + 9/2)\\, dx = 1 + 9/2 = 11/2$. The mass is 11/2."
          - problem: "Find the mass of the triangular lamina with vertices $(0,0)$, $(3,0)$, $(0,2)$ and density $\\rho(x, y) = xy$ as a fraction."
            answer: "3/2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The mass is $m = \\iint_T xy\\, dA$ over the triangle $0 \\le x \\le 3$, $0 \\le y \\le 2 - 2x/3$. Set up the iterated integral by the definition of mass: $m = \\int_0^3 \\int_0^{2 - 2x/3} xy\\, dy\\, dx$. Evaluate the inner integral by the power rule: $2x - 4x^2/3 + 2x^3/9$. Evaluate the outer integral by the power rule: $\\int_0^3 (2x - 4x^2/3 + 2x^3/9)\\, dx = 3/2$. The mass is 3/2."
        constraints: "density polynomial of degree at most 2; rectangles or triangles with integer vertices; masses exact rationals"
      - id: kp2
        name: "Moments about the axes"
        key_prerequisites: [double-integrals]
        exemplars:
          - problem: 'For the lamina on $[0,1]^2$ with density $\rho = y$, compute the moment $M_x = \iint y \rho \, dA$.'
            answer: '$\frac{1}{3}$'
            solution_sketch: '$M_x = \iint y^2\, dA = \int_0^1 y^2\, dy = \frac{1}{3}$.'
          - problem: "For the uniform lamina with density 1 on the rectangle [0,3] x [0,2], compute the moments about the coordinate axes. Use M_y = double integral of x rho dA and M_x = double integral of y rho dA. Give the answer as My = value; Mx = value with exact values."
            answer: "My = 9; Mx = 6"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "My"}, {"contract": {"kind": "exact"}, "name": "Mx"}]}
            solution_sketch: "Use the moment formulas M_y = double integral of x rho dA and M_x = double integral of y rho dA on the rectangle [0,3] x [0,2] with rho = 1. For M_y, separate the rectangle integral into (integral x dx from 0 to 3)(integral 1 dy from 0 to 2), which is (9/2)(2) = 9. For M_x, separate into (integral 1 dx from 0 to 3)(integral y dy from 0 to 2), which is (3)(2) = 6, so My = 9; Mx = 6."
          - problem: "A flat plate occupies the rectangle [0,4] x [0,1] and has constant density 1. Find its two moments about the axes: M_y = double integral x rho dA and M_x = double integral y rho dA. Give the answer as My = value; Mx = value."
            answer: "My = 8; Mx = 2"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "My"}, {"contract": {"kind": "exact"}, "name": "Mx"}]}
            solution_sketch: "Use M_y = double integral of x rho dA and M_x = double integral of y rho dA on [0,4] x [0,1] with rho = 1. M_y separates as (integral x dx from 0 to 4)(integral 1 dy from 0 to 1) = (8)(1) = 8. M_x separates as (integral 1 dx from 0 to 4)(integral y dy from 0 to 1) = (4)(1/2) = 2, so My = 8; Mx = 2."
          - problem: "A lamina occupies the rectangle [0,2] x [0,3]. Its density is rho(x, y) = x. Compute the moment about the x-axis, M_x = double integral of y rho dA. Give the answer as an exact fraction or integer."
            answer: "9"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Use the moment formula M_x = double integral of y rho dA with rho = x on [0,2] x [0,3]. Separate the rectangle integral: (integral x dx from 0 to 2)(integral y dy from 0 to 3) = (2)(9/2) = 9. The moment about the x-axis is 9."
          - problem: "A lamina occupies the square [0,1] x [0,1]. Its density is rho(x, y) = x + y. Compute the moment about the y-axis, M_y = double integral of x rho dA. Give the answer as an exact fraction."
            answer: "7/12"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Use the moment formula M_y = double integral of x rho dA with rho = x + y on [0,1] x [0,1]. Expand x(x + y) = x^2 + xy and integrate over the square: 1/3 + (1/2)(1/2) = 1/3 + 1/4 = 7/12. The moment about the y-axis is 7/12."
          - problem: "A lamina occupies the rectangle [0,1] x [0,2]. Its density is rho(x, y) = x + y. Compute the moments about both axes, with M_y = double integral of x rho dA and M_x = double integral of y rho dA. Give the answer as My = value; Mx = value with exact fractions."
            answer: "My = 5/3; Mx = 11/3"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "My"}, {"contract": {"kind": "exact"}, "name": "Mx"}]}
            solution_sketch: "Use M_y = double integral of x rho dA and M_x = double integral of y rho dA with rho = x + y on [0,1] x [0,2]. For M_y integrate x^2 + xy over the rectangle: inner dx gives 1/3 + y/2, and the outer dy gives 2/3 + 1 = 5/3. For M_x integrate xy + y^2: inner dx gives y/2 + y^2, and the outer dy gives 1 + 8/3 = 11/3, so My = 5/3; Mx = 11/3."
        constraints: "M_y integrates x*rho, M_x integrates y*rho; rectangles only; answers exact rationals"
      - id: kp3
        name: "Center of mass and centroids"
        key_prerequisites: [double-integrals]
        exemplars:
          - problem: 'Find the centroid of the triangle with vertices $(0,0)$, $(1,0)$, $(1,1)$.'
            answer: '$\left(\frac{2}{3}, \frac{1}{3}\right)$'
            solution_sketch: 'Area $\frac{1}{2}$; $\bar{x} = 2\int_0^1 x \cdot x\, dx = \frac{2}{3}$, $\bar{y} = 2\int_0^1 \frac{x^2}{2}\, dx = \frac{1}{3}$ (the average of the vertices).'
          - problem: 'Find the centroid of the region under $y = 4 - x^2$ and above the $x$-axis.'
            answer: '$\left(0, \frac{8}{5}\right)$'
            solution_sketch: 'By symmetry $\bar{x} = 0$. Area $= \frac{32}{3}$; $\iint y\, dA = \int_{-2}^2 \frac{(4-x^2)^2}{2}\, dx = \frac{256}{15}$, so $\bar{y} = \frac{256/15}{32/3} = \frac{8}{5}$.'
          - problem: 'Find the center of mass of the lamina on $[0,1]^2$ with density $\rho(x, y) = y$.'
            answer: '$\left(\frac{1}{2}, \frac{2}{3}\right)$'
            solution_sketch: '$m = \frac{1}{2}$; $\bar{x} = \frac{1}{m}\iint x y\, dA = 2 \cdot \frac{1}{4} = \frac{1}{2}$; $\bar{y} = \frac{1}{m}\iint y^2\, dA = 2 \cdot \frac{1}{3} = \frac{2}{3}$.'
          - problem: "Find the centroid of the triangle with vertices (0,0), (3,0), and (0,2). Give the answer as (x, y)."
            answer: "(1, 2/3)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "The triangle has vertices (0,0), (3,0), and (0,2), and the centroid formula averages the vertices. The x-coordinate is (0 + 3 + 0)/3 = 1. The y-coordinate is (0 + 0 + 2)/3 = 2/3. The centroid is (1, 2/3)."
          - problem: "Find the center of mass of the lamina on the rectangle [0,3] x [0,2] whose density is equal to the x-coordinate. Give the answer as (x, y)."
            answer: "(2, 1)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "The lamina is the rectangle [0,3] x [0,2] with density x. The mass is the double integral of density: m = integral from 0 to 3 integral from 0 to 2 of x dy dx = 9. The x-moment is integral from 0 to 3 integral from 0 to 2 of x^2 dy dx = 18, so xbar = 18/9 = 2. By symmetry in y, ybar = 1. The center of mass is (2, 1)."
          - problem: "Find the center of mass of the lamina on the unit square [0,1] x [0,1] whose density is x + y. Give the answer as (x, y)."
            answer: "(7/12, 7/12)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "The lamina is the unit square [0,1] x [0,1] with density x + y. The mass is the double integral of density: m = integral from 0 to 1 integral from 0 to 1 of (x + y) dy dx = 1. The x-moment is integral from 0 to 1 integral from 0 to 1 of x(x + y) dy dx = 7/12. By symmetry in x and y, ybar = 7/12. The center of mass is (7/12, 7/12)."
        constraints: "use symmetry when available; centroids/centers have small rational coordinates"
    diagnostic_exemplar:
      problem: 'Find the centre of mass of the lamina occupying $[0, 2] \times [0, 1]$ with density $\rho(x, y) = x$.'
      answer: '$\left(\dfrac{4}{3},\; \dfrac{1}{2}\right)$'
      answer_contract: {kind: none}
      solution_sketch: '$m = \int_0^2\!\int_0^1 x\,dy\,dx = 2$; $M_y = \int_0^2\!\int_0^1 x^2\,dy\,dx = \tfrac{8}{3}$; $M_x = \int_0^2\!\int_0^1 xy\,dy\,dx = 1$. Hence $\bar x = \tfrac{8}{3}/2 = \tfrac{4}{3}$ and $\bar y = 1/2$.'
    anki_seeds:
      - front: 'Center of mass formulas for a lamina with density $\rho$?'
        back: '$\bar{x} = \frac{M_y}{m} = \frac{1}{m}\iint x\rho\, dA$, $\;\bar{y} = \frac{M_x}{m} = \frac{1}{m}\iint y\rho\, dA$.'
        type: basic
      - front: 'What is the centroid of a region?'
        back: 'The center of mass with constant density — the geometric center $\left(\frac{1}{A}\iint x\, dA, \frac{1}{A}\iint y\, dA\right)$.'
        type: basic

  - id: double-integrals-polar
    name: "Double Integrals in Polar Coordinates"
    core: true
    difficulty: 0.75
    drill: false
    answer_kind: numeric
    expected_time_secs: 180
    prerequisites:
      - id: double-integrals
        weight: 0.8
        key: true
      - id: polar-coordinates
        weight: 0.6
        key: true
      - id: polar-area
        weight: 0.5
        key: true
      - id: unit-circle
        weight: 0.3
        key: false
    knowledge_points:
      - id: kp1
        name: "Converting and evaluating over disks"
        key_prerequisites: [double-integrals, polar-coordinates]
        exemplars:
          - problem: 'Evaluate $\iint_D (x^2 + y^2)\, dA$ where $D$ is the disk $x^2 + y^2 \le 4$.'
            answer: '$8\pi$'
            solution_sketch: '$\int_0^{2\pi} \int_0^2 r^2 \cdot r \, dr\, d\theta = 2\pi \left[\frac{r^4}{4}\right]_0^2 = 2\pi \cdot 4 = 8\pi$.'
          - problem: 'Evaluate $\iint_D e^{-x^2 - y^2}\, dA$ where $D$ is the unit disk.'
            answer: '$\pi\left(1 - \frac{1}{e}\right)$'
            solution_sketch: '$\int_0^{2\pi} \int_0^1 e^{-r^2} r \, dr\, d\theta = 2\pi \cdot \frac{1 - e^{-1}}{2}$; the extra $r$ makes the substitution $u = r^2$ work.'
          - problem: "Evaluate $\\iint_D (x^2+y^2)^2\\, dA$ where $D$ is the unit disk."
            answer: "pi/3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Convert to polar coordinates: x^2+y^2 = r^2 and dA = r dr dtheta. The integrand becomes (r^2)^2 = r^4, so the integral is \\int_0^{2\\pi}\\int_0^1 r^5\\, dr\\, d\\theta. Integrate with the power rule: \\int_0^1 r^5\\, dr = 1/6 and \\int_0^{2\\pi} d\\theta = 2\\pi, so the value is pi/3."
          - problem: "Evaluate $\\iint_D (x^2+y^2)\\, dA$ where $D$ is the annulus $1 \\le x^2+y^2 \\le 4$."
            answer: "15pi/2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Use polar coordinates: the annulus is 1 <= r <= 2 and dA = r dr dtheta. The integrand x^2+y^2 becomes r^2, so the integral is \\int_0^{2\\pi}\\int_1^2 r^3\\, dr\\, d\\theta. The inner integral is [r^4/4]_1^2 = 15/4 by the power rule, and multiplying by 2\\pi gives 15pi/2."
          - problem: "Evaluate $\\iint_D e^{-(x^2+y^2)/4}\\, dA$ where $D$ is the disk $x^2+y^2 \\le 4$."
            answer: "4pi(1 - e^(-1))"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Convert to polar coordinates: x^2+y^2 = r^2 and dA = r dr dtheta. The integral is \\int_0^{2\\pi}\\int_0^2 e^{-r^2/4} r\\, dr\\, d\\theta. Let u = r^2/4, so du = r/2 dr and r dr = 2 du; the inner integral becomes 2\\int_0^1 e^{-u} du = 2(1 - e^{-1}) by the exponential rule. Multiply by 2\\pi to get 4pi(1 - e^(-1))."
          - problem: "Evaluate $\\iint_D (x^2+y^2)^3\\, dA$ where $D$ is the disk $x^2+y^2 \\le 4$."
            answer: "64pi"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Polar conversion gives x^2+y^2 = r^2 and dA = r dr dtheta. The integrand becomes r^6, so the integral is \\int_0^{2\\pi}\\int_0^2 r^7\\, dr\\, d\\theta. The inner integral is [r^8/8]_0^2 = 32 by the power rule, and multiplying by 2\\pi gives 64pi."
        constraints: "integrands are functions of x^2+y^2; disks or annuli centered at the origin; radii small integers"
      - id: kp2
        name: "Areas and volumes via polar"
        key_prerequisites: [double-integrals, polar-coordinates, polar-area]
        exemplars:
          - problem: 'Find the area enclosed by the cardioid $r = 2 + 2\sin\theta$.'
            answer: '$6\pi$'
            solution_sketch: '$A = \frac{1}{2}\int_0^{2\pi} (2 + 2\sin\theta)^2\, d\theta = \frac{1}{2}\int_0^{2\pi} \left(4 + 8\sin\theta + 4\sin^2\theta\right) d\theta = \frac{1}{2}\left(8\pi + 0 + 4\pi\right) = 6\pi$, using $\int_0^{2\pi} \sin^2\theta\, d\theta = \pi$.'
          - problem: 'Find the volume of the solid under $z = 4 - x^2 - y^2$ and above the $xy$-plane.'
            answer: '$8\pi$'
            solution_sketch: 'The paraboloid meets $z = 0$ at $r = 2$: $\int_0^{2\pi} \int_0^2 (4 - r^2) r \, dr\, d\theta = 2\pi\left[2r^2 - \frac{r^4}{4}\right]_0^2 = 2\pi(8 - 4) = 8\pi$.'
          - problem: "A region in the plane is enclosed by the polar curve $r = 4\\sin\\theta$. Find the area of the region."
            answer: "4pi"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The polar area integral is $A = \\frac{1}{2}\\int_0^{\\pi} (4\\sin\\theta)^2\\,d\\theta$ because the circle is traced for $0 \\le \\theta \\le \\pi$. Expanding gives $A = 8\\int_0^{\\pi} \\sin^2\\theta\\,d\\theta$. Since $\\int_0^{\\pi} \\sin^2\\theta\\,d\\theta = \\pi/2$, the area is $8(\\pi/2) = 4\\pi$. The area is 4pi."
          - problem: "A region is enclosed by the cardioid $r = 4 + 4\\sin\\theta$. Find the area of the region."
            answer: "24pi"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The polar area formula gives $A = \\frac{1}{2}\\int_0^{2\\pi} (4 + 4\\sin\\theta)^2\\,d\\theta$. The square expands to $16 + 32\\sin\\theta + 16\\sin^2\\theta$. The constant term contributes $32\\pi$, the sine term contributes $0$, and the $\\sin^2$ term contributes $16\\pi$. Thus $A = \\frac{1}{2}(32\\pi + 16\\pi) = 24\\pi$. The area is 24pi."
          - problem: "The solid lies under the paraboloid $z = 8 - x^2 - y^2$ and over the $xy$-plane. Find the volume of the solid."
            answer: "32pi"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The projection is the disk $r \\le 2\\sqrt{2}$, since $z = 0$ gives $r^2 = 8$. In polar coordinates the volume is $V = \\int_0^{2\\pi}\\int_0^{2\\sqrt{2}} (8 - r^2)r\\,dr\\,d\\theta$. The inner integral is $[4r^2 - r^4/4]_0^{2\\sqrt{2}} = 32 - 16 = 16$. Multiplying by the angular integral $2\\pi$ gives $32\\pi$. The volume is 32pi."
          - problem: "The solid lies under the paraboloid $z = 20 - 5x^2 - 5y^2$ and over the $xy$-plane. Find the volume of the solid."
            answer: "40pi"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The projection is the disk $r \\le 2$, since $z = 0$ gives $r^2 = 4$. In polar coordinates the volume is $V = \\int_0^{2\\pi}\\int_0^2 (20 - 5r^2)r\\,dr\\,d\\theta$. The inner integral is $[10r^2 - 5r^4/4]_0^2 = 40 - 20 = 20$. Multiplying by the angular integral $2\\pi$ gives $40\\pi$. The volume is 40pi."
        constraints: "cardioids/circles for area; paraboloid caps for volume; answers exact multiples of pi"
    diagnostic_exemplar:
      problem: 'Find the volume of the solid lying under the paraboloid $z = 16 - x^2 - y^2$ and above the $xy$-plane.'
      answer: '$128\pi$'
      solution_sketch: 'The paraboloid meets $z = 0$ on the circle $r = 4$, so $V = \int_0^{2\pi}\!\int_0^4 (16 - r^2)\,r\,dr\,d\theta = 2\pi\left[8r^2 - \tfrac{r^4}{4}\right]_0^4 = 2\pi(128 - 64) = 128\pi$.'
    anki_seeds:
      - front: 'Area element in polar coordinates?'
        back: '$dA = r \, dr \, d\theta$ — never forget the extra factor $r$.'
        type: basic
      - front: 'When should a double integral be converted to polar?'
        back: 'When the region is a disk/annulus/sector or the integrand involves $x^2 + y^2$.'
        type: basic

  - id: surface-area-double-integrals
    name: "Surface Area via Double Integrals"
    core: true
    difficulty: 0.80
    drill: false
    answer_kind: numeric
    expected_time_secs: 240
    prerequisites:
      - id: double-integrals
        weight: 0.7
        key: true
      - id: partial-derivatives
        weight: 0.5
        key: true
      - id: double-integrals-polar
        weight: 0.5
        key: true
    knowledge_points:
      - id: kp1
        name: "The surface-area formula and planes"
        key_prerequisites: [double-integrals, partial-derivatives]
        exemplars:
          - problem: 'Find the area of the part of the plane $z = 2x + 2y$ lying over the square $[0,1] \times [0,1]$.'
            answer: "3"
            solution_sketch: '$dS = \sqrt{1 + f_x^2 + f_y^2}\, dA = \sqrt{1 + 4 + 4}\, dA = 3\, dA$; the base area is $1$.'
          - problem: 'Find the area of the part of the plane $z = 3 - x - y$ over the triangle $x, y \ge 0$, $x + y \le 1$.'
            answer: '$\frac{\sqrt{3}}{2}$'
            solution_sketch: '$\sqrt{1 + 1 + 1} = \sqrt{3}$ times the base area $\frac{1}{2}$.'
          - problem: "Consider the part of the plane z = x + 2y that lies over the rectangle 0 <= x <= 2, 0 <= y <= 3. Find the surface area of this part of the plane."
            answer: "6sqrt(6)"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: the surface-area formula gives dS = sqrt(1 + zx^2 + zy^2) dA. Step 2: for z = x + 2y, zx = 1 and zy = 2, so the factor is sqrt(1 + 1 + 4) = sqrt(6). Step 3: the base rectangle has area 6, so the surface area is 6sqrt(6)."
          - problem: "Consider the part of the plane z = 5 - 2x + y that lies over the triangle x >= 0, y >= 0, x + y <= 2. Find the surface area of this part of the plane."
            answer: "2sqrt(6)"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: the surface-area formula gives dS = sqrt(1 + zx^2 + zy^2) dA. Step 2: for z = 5 - 2x + y, zx = -2 and zy = 1, so the factor is sqrt(1 + 4 + 1) = sqrt(6). Step 3: the base triangle has area 2, so the surface area is 2sqrt(6)."
          - problem: "Consider the part of the plane z = 4 - x that lies over the rectangle 0 <= x <= 4, 0 <= y <= 1. Find the surface area of this part of the plane."
            answer: "4sqrt(2)"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: the surface-area formula gives dS = sqrt(1 + zx^2 + zy^2) dA. Step 2: for z = 4 - x, zx = -1 and zy = 0, so the factor is sqrt(1 + 1 + 0) = sqrt(2). Step 3: the base rectangle has area 4, so the surface area is 4sqrt(2)."
          - problem: "Consider the part of the plane z = 2x - 3y + 6 over the triangle with vertices (0,0), (3,0), and (0,2). Find the surface area of this part of the plane."
            answer: "3sqrt(14)"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: the surface-area formula gives dS = sqrt(1 + zx^2 + zy^2) dA. Step 2: for z = 2x - 3y + 6, zx = 2 and zy = -3, so the factor is sqrt(1 + 4 + 9) = sqrt(14). Step 3: the base triangle has area 3, so the surface area is 3sqrt(14)."
        constraints: "planes with integer coefficients so sqrt(1+fx^2+fy^2) is constant; base regions with simple areas"
      - id: kp2
        name: "Curved surfaces via polar coordinates"
        key_prerequisites: [double-integrals, partial-derivatives, double-integrals-polar]
        exemplars:
          - problem: 'Find the area of the part of the paraboloid $z = x^2 + y^2$ below the plane $z = 1$.'
            answer: '$\frac{\pi}{6}\left(5\sqrt{5} - 1\right)$'
            solution_sketch: '$\sqrt{1 + 4x^2 + 4y^2} = \sqrt{1 + 4r^2}$: $\int_0^{2\pi}\int_0^1 \sqrt{1 + 4r^2}\, r\, dr\, d\theta = 2\pi \cdot \frac{1}{12}\left(5^{3/2} - 1\right)$.'
          - problem: 'Find the area of the part of the cone $z = \sqrt{x^2 + y^2}$ with $0 \le z \le 2$.'
            answer: '$4\sqrt{2}\,\pi$'
            solution_sketch: 'For the cone $\sqrt{1 + f_x^2 + f_y^2} = \sqrt{2}$ at every point off the axis, so the area is $\sqrt{2}$ times the area of the disk $r \le 2$, i.e. $\sqrt{2} \cdot 4\pi$. (Note: $f_x, f_y$ are undefined at the apex $(0,0)$, so this is technically an improper integral; the integrand is the constant $\sqrt{2}$ on the punctured disk and the single missing point has measure zero, so the integral converges to the stated value.)'
        constraints: "radially symmetric surfaces; the substitution u = 1 + 4r^2 (or a constant factor) finishes the integral; answers exact"
    diagnostic_exemplar:
      problem: 'Find the area of the part of the paraboloid $z = x^2 + y^2$ lying below the plane $z = 4$.'
      answer: '$\dfrac{\pi}{6}\left(17\sqrt{17} - 1\right)$'
      answer_contract: {kind: none}
      solution_sketch: '$dS = \sqrt{1 + 4x^2 + 4y^2}\,dA$, and the shadow is the disk $r \le 2$, so $A = \int_0^{2\pi}\!\int_0^2 \sqrt{1 + 4r^2}\,r\,dr\,d\theta = 2\pi \cdot \tfrac{1}{12}\left[(1 + 4r^2)^{3/2}\right]_0^2 = \tfrac{\pi}{6}\left(17\sqrt{17} - 1\right)$.'
    anki_seeds:
      - front: 'Surface area of the graph $z = f(x, y)$ over a region $D$?'
        back: '$\iint_D \sqrt{1 + f_x^2 + f_y^2} \, dA$'
        type: basic
      - front: 'Why does the surface-area integrand carry the factor $\sqrt{1 + f_x^2 + f_y^2}$?'
        back: 'It is $\left|\langle 1, 0, f_x \rangle \times \langle 0, 1, f_y \rangle\right|$ — the area of the tangent parallelogram, i.e. the tilt factor by which a patch $dA$ of the region stretches on the graph. A flat graph ($f_x = f_y = 0$) gives factor $1$.'
        type: basic

  - id: triple-integrals
    name: "Triple Integrals"
    core: true
    difficulty: 0.78
    drill: false
    answer_kind: numeric
    expected_time_secs: 240
    prerequisites:
      - id: double-integrals
        weight: 0.8
        key: true
      - id: coordinates-surfaces-3d
        weight: 0.3
        key: false
    knowledge_points:
      - id: kp1
        name: "Triple integrals over boxes"
        key_prerequisites: [double-integrals]
        exemplars:
          - problem: 'Evaluate $\int_0^1 \int_0^2 \int_0^3 xyz \, dz \, dy \, dx$.'
            answer: '$\frac{9}{2}$'
            solution_sketch: 'Separable: $\left(\int_0^1 x\,dx\right)\left(\int_0^2 y\,dy\right)\left(\int_0^3 z\,dz\right) = \frac{1}{2} \cdot 2 \cdot \frac{9}{2} = \frac{9}{2}$.'
          - problem: 'Evaluate $\iiint_B (x + z) \, dV$ where $B = [0,1]^3$ is the unit cube.'
            answer: "1"
            solution_sketch: 'By symmetry each of $\iiint x\, dV$ and $\iiint z\, dV$ equals $\frac{1}{2}$ (mean of $x$ on $[0,1]$ times volume $1$).'
        constraints: "integrands separable or a sum of single variables; box edges at small integers"
      - id: kp2
        name: "General solids: tetrahedra and volume"
        key_prerequisites: [double-integrals]
        exemplars:
          - problem: 'Use a triple integral to find the volume of the tetrahedron bounded by the coordinate planes and $x + y + z = 1$.'
            answer: '$\frac{1}{6}$'
            solution_sketch: '$\int_0^1 \int_0^{1-x} \int_0^{1-x-y} dz\, dy\, dx = \int_0^1 \int_0^{1-x} (1-x-y)\, dy\, dx = \int_0^1 \frac{(1-x)^2}{2}\, dx = \frac{1}{6}$.'
          - problem: 'Evaluate $\iiint_E z \, dV$ where $E$ is the tetrahedron bounded by the coordinate planes and $x + y + z = 1$.'
            answer: '$\frac{1}{24}$'
            solution_sketch: 'Inner: $\int_0^{1-x-y} z\, dz = \frac{(1-x-y)^2}{2}$; then $\int_0^{1-x} \frac{(1-x-y)^2}{2} dy = \frac{(1-x)^3}{6}$; finally $\int_0^1 \frac{(1-x)^3}{6} dx = \frac{1}{24}$.'
          - problem: "Use a triple integral to find the volume of the tetrahedron cut from the first octant by the coordinate planes and the plane x + y + z = 2. Give the volume as a fraction."
            answer: "4/3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The solid is 0 <= z <= 2 - x - y, with 0 <= y <= 2 - x and 0 <= x <= 2, so the volume is the triple integral of 1 over this region. The inner integral gives 2 - x - y, the middle integral gives (2 - x)^2/2, and the outer integral of a power gives 8/6. The volume is 4/3."
          - problem: "Evaluate the triple integral of y over the tetrahedron E bounded by the coordinate planes and the plane x + 2y + z = 4. Give the value as a fraction."
            answer: "8/3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "For fixed x and y, z runs from 0 to 4 - x - 2y, the y-range is 0 to (4 - x)/2, and x runs from 0 to 4, so the integral is the triple integral of y over E. Integrating y(4 - x - 2y) in y by the power rule gives (4 - x)^3/24, and integrating this power in x gives 64/24. The value is 8/3."
          - problem: "Evaluate the triple integral of z over the tetrahedron E bounded by the coordinate planes and the plane 2x + y + z = 2. Give the value as a fraction."
            answer: "1/3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "For fixed x and y, z runs from 0 to 2 - 2x - y, the y-range is 0 to 2 - 2x, and x runs from 0 to 1, so the integral is the triple integral of z over E. The inner integral gives (2 - 2x - y)^2/2, the y-integral by the power rule gives (2 - 2x)^3/6, and the x-integral gives 1/3. The value is 1/3."
          - problem: "Find the volume of the tetrahedron bounded by the coordinate planes and the plane x + 2y + 3z = 12."
            answer: "48"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The intercepts are x = 12, y = 6, and z = 4, so the volume is the triple integral of 1 over the tetrahedron. Using the order dz dy dx, z runs from 0 to (12 - x - 2y)/3, y from 0 to (12 - x)/2, and x from 0 to 12. The y-integral by the power rule gives (12 - x)^2/12, and the outer power integral gives 48. The volume is 48."
        constraints: "solids bounded by coordinate planes and one slanted plane; powers of (1-x) integrate exactly"
      - id: kp3
        name: "Solids bounded by curved surfaces"
        key_prerequisites: [double-integrals]
        exemplars:
          - problem: 'Find the volume of the solid bounded below by $z = 0$, above by $z = y$, over the region $0 \le y \le 1 - x^2$.'
            answer: '$\frac{8}{15}$'
            solution_sketch: '$V = \int_{-1}^1 \int_0^{1-x^2} \int_0^y dz\, dy\, dx = \int_{-1}^1 \frac{(1-x^2)^2}{2}\, dx = \frac{8}{15}$.'
          - problem: 'Evaluate $\iiint_E z \, dV$ where $E = \{(x,y,z) : 0 \le x \le 1,\; 0 \le y \le 1,\; 0 \le z \le x + y\}$.'
            answer: '$\frac{7}{12}$'
            solution_sketch: 'Inner: $\int_0^{x+y} z\, dz = \frac{(x+y)^2}{2}$; then $\frac{1}{2}\iint (x^2 + 2xy + y^2)\, dA = \frac{1}{2}\left(\frac{1}{3} + \frac{1}{2} + \frac{1}{3}\right) = \frac{7}{12}$.'
        constraints: "z-bounds are polynomial surfaces; after the inner integral the problem reduces to an earlier double integral"
    diagnostic_exemplar:
      problem: 'Evaluate $\iiint_E x\,dV$ where $E$ is the tetrahedron bounded by the coordinate planes and the plane $x + 2y + z = 2$.'
      answer: '$\dfrac{1}{3}$'
      answer_contract: {kind: none}
      solution_sketch: 'Bounds: $0 \le x \le 2$, $0 \le y \le \frac{2-x}{2}$, $0 \le z \le 2 - x - 2y$. Integrating in $z$ then $y$ gives $\int_0^{(2-x)/2}(2 - x - 2y)\,dy = \frac{(2-x)^2}{4}$, so the integral is $\int_0^2 \frac{x(2-x)^2}{4}\,dx = \frac{1}{4}\left(12 - \frac{32}{3}\right) = \frac{1}{3}$.'
    anki_seeds:
      - front: 'How do you compute a volume with a triple integral?'
        back: '$V = \iiint_E 1 \, dV$ — integrate the constant $1$ over the solid.'
        type: basic
      - front: 'Volume of the tetrahedron cut off by $x + y + z = 1$ and the coordinate planes?'
        back: '$\frac{1}{6}$'
        type: basic

  - id: triple-integral-applications
    name: "Mass and Average Value in Three Dimensions"
    core: false                # mass / average-value application; terminal
    difficulty: 0.80
    drill: false
    answer_kind: numeric
    expected_time_secs: 240
    prerequisites:
      - id: triple-integrals
        weight: 0.8
        key: true
      - id: double-integral-applications
        weight: 0.5
        key: true
    knowledge_points:
      - id: kp1
        name: "Mass with variable density"
        key_prerequisites: [triple-integrals, double-integral-applications]
        exemplars:
          - problem: 'Find the mass of the box $[0,1] \times [0,2] \times [0,3]$ with density $\rho(x,y,z) = 2z$.'
            answer: "18"
            solution_sketch: '$m = \iiint 2z\, dV = (1)(2)\int_0^3 2z\, dz = 2 \cdot 9 = 18$.'
          - problem: 'Find the mass of the unit cube $[0,1]^3$ with density $\rho(x,y,z) = x + y + z$.'
            answer: '$\frac{3}{2}$'
            solution_sketch: 'Each term contributes $\frac{1}{2}$: $m = 3 \cdot \frac{1}{2} = \frac{3}{2}$.'
          - problem: "Find the mass of the box [0,2] x [0,1] x [0,3] whose density is 5x."
            answer: "30"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The mass is the triple integral of the density over the box: m = ∫0^3 ∫0^1 ∫0^2 5x dx dy dz. Integrate x first with the power rule: ∫0^2 5x dx = 10. The remaining y and z integrals give 1 and 3, so m = 10 * 1 * 3 = 30. The mass is 30."
          - problem: "Find the mass of the box [0,1] x [0,4] x [0,2] whose density is 3y."
            answer: "48"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The mass is the triple integral of the density over the box: m = ∫0^2 ∫0^4 ∫0^1 3y dx dy dz. Integrate y first with the power rule: ∫0^4 3y dy = 24. The x and z lengths are 1 and 2, so m = 1 * 24 * 2 = 48. The mass is 48."
          - problem: "Find the mass of the box [0,2] x [0,1] x [0,3] whose density is x + 2y."
            answer: "12"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The mass is the triple integral of the density over the box: m = ∫0^3 ∫0^1 ∫0^2 (x + 2y) dx dy dz. Integrate x first with the power rule: ∫0^2 (x + 2y) dx = 2 + 4y. Integrate y next with the power rule: ∫0^1 (2 + 4y) dy = 4. The z integral gives 3 * 4 = 12, so the mass is 12."
          - problem: "Find the mass of the box [0,1] x [0,3] x [0,1] whose density is 2x + z."
            answer: "9/2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The mass is the triple integral of the density over the box: m = ∫0^1 ∫0^3 ∫0^1 (2x + z) dx dy dz. Integrate x first with the power rule: ∫0^1 (2x + z) dx = 1 + z. Multiply by the y-length 3 to get 3 + 3z, then integrate z with the power rule: ∫0^1 (3 + 3z) dz = 9/2. The mass is 9/2."
        constraints: "density linear in one or more variables; boxes only; masses exact rationals"
      - id: kp2
        name: "Center of mass and average value"
        key_prerequisites: [triple-integrals, double-integral-applications]
        exemplars:
          - problem: 'The box $[0,1] \times [0,1] \times [0,2]$ has density $\rho = z$. Find $\bar{z}$, the $z$-coordinate of its center of mass.'
            answer: '$\frac{4}{3}$'
            solution_sketch: '$m = \int_0^2 z\, dz = 2$; $M_{xy} = \iiint z^2\, dV = \int_0^2 z^2\, dz = \frac{8}{3}$; $\bar{z} = \frac{8/3}{2} = \frac{4}{3}$.'
          - problem: 'Find the average value of $f(x,y,z) = xyz$ over the cube $[0,2]^3$.'
            answer: "1"
            solution_sketch: '$\iiint xyz\, dV = 2 \cdot 2 \cdot 2 = 8$; volume $8$; average $1$.'
          - problem: 'Find $\bar{z}$ for the uniform tetrahedron bounded by the coordinate planes and $x + y + z = 1$.'
            answer: '$\frac{1}{4}$'
            solution_sketch: '$\iiint z\, dV = \frac{1}{24}$ and $V = \frac{1}{6}$, so $\bar{z} = \frac{1/24}{1/6} = \frac{1}{4}$.'
          - problem: "The solid box $[0,1] \\times [0,1] \\times [0,1]$ has density $\\rho = x$. Find $\\bar{x}$, the $x$-coordinate of its center of mass."
            answer: "2/3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: mass by the triple integral $m = \\iiint \\rho\\,dV = \\int_0^1\\int_0^1\\int_0^1 x\\,dz\\,dy\\,dx = \\frac12$. Step 2: moment $M_{yz} = \\iiint x\\rho\\,dV = \\int_0^1 x^2\\,dx = \\frac13$. Step 3: center of mass $\\bar{x} = M_{yz}/m = (1/3)/(1/2) = 2/3$. The answer is 2/3."
          - problem: "Find the average value of $f(x,y,z) = xyz$ over the box $[0,1] \\times [0,2] \\times [0,3]$."
            answer: "3/4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: compute the triple integral $I = \\iiint xyz\\,dV = (\\int_0^1 x\\,dx)(\\int_0^2 y\\,dy)(\\int_0^3 z\\,dz) = (1/2)(2)(9/2) = 9/2$. Step 2: volume of the box is $1\\cdot2\\cdot3 = 6$. Step 3: average value $I/V = (9/2)/6 = 3/4$. The answer is 3/4."
          - problem: "The solid tetrahedron bounded by $x+y+z=1$ and the coordinate planes has density $\\rho = y$. Find $\\bar{y}$, the $y$-coordinate of its center of mass."
            answer: "2/5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: mass by the triple integral $m = \\iiint \\rho\\,dV = \\iiint y\\,dV = 1/24$ over the tetrahedron. Step 2: moment $M_{xz} = \\iiint y\\rho\\,dV = \\iiint y^2\\,dV = 1/60$. Step 3: $\\bar{y} = M_{xz}/m = (1/60)/(1/24) = 2/5$. The answer is 2/5."
        constraints: "reuse standard solids (boxes, unit tetrahedron); coordinates and averages are small rationals"
    diagnostic_exemplar:
      problem: 'The box $[0,2] \times [0,1] \times [0,3]$ has density $\rho(x, y, z) = z$. Find $\bar z$, the $z$-coordinate of its centre of mass.'
      answer: '$2$'
      solution_sketch: '$m = 2\int_0^3 z\,dz = 9$ and $M_{xy} = 2\int_0^3 z^2\,dz = 18$, so $\bar z = 18/9 = 2$.'
    anki_seeds:
      - front: 'Average value of $f$ over a solid $E$?'
        back: '$\bar{f} = \dfrac{1}{V(E)} \iiint_E f \, dV$'
        type: basic
      - front: '$\bar{z}$ for a solid with density $\rho$?'
        back: '$\bar{z} = \dfrac{M_{xy}}{m} = \dfrac{1}{m}\iiint z\rho \, dV$'
        type: basic

  - id: triple-integrals-cylindrical
    name: "Triple Integrals in Cylindrical Coordinates"
    core: true
    difficulty: 0.79
    drill: false
    answer_kind: numeric
    expected_time_secs: 200
    prerequisites:
      - id: triple-integrals
        weight: 0.8
        key: true
      - id: double-integrals-polar
        weight: 0.7
        key: true
    knowledge_points:
      - id: kp1
        name: "Setting up cylindrical integrals"
        key_prerequisites: [triple-integrals, double-integrals-polar]
        exemplars:
          - problem: 'Describe the solid cylinder $x^2 + y^2 \le 4$, $0 \le z \le 3$ in cylindrical coordinates.'
            answer: '$0 \le r \le 2$, $\;0 \le \theta \le 2\pi$, $\;0 \le z \le 3$'
            solution_sketch: 'With $x^2+y^2\le 4$ meaning $0\le r\le 2$ and $z$ free from $0$ to $3$: $0\le r\le 2$, $0\le\theta\le 2\pi$, $0\le z\le 3$.'
            answer_contract: {kind: none}
          - problem: 'Rewrite $\iiint_E z \, dV$ over the cylinder $x^2 + y^2 \le 1$, $0 \le z \le 2$ as an iterated integral in cylindrical coordinates (do not evaluate).'
            answer: '$\int_0^{2\pi} \int_0^1 \int_0^2 z\, r \, dz\, dr\, d\theta$'
            answer_contract: {kind: none}
            solution_sketch: 'The region is a product in $(r, \theta, z)$; the volume element contributes the factor $r$.'
        constraints: "solids are coordinate cylinders/cones; the answer is the description or set-up, always including the factor r"
      - id: kp2
        name: "Evaluating cylindrical integrals"
        key_prerequisites: [triple-integrals, double-integrals-polar]
        exemplars:
          - problem: 'Use cylindrical coordinates to evaluate $\iiint_E z \, dV$ where $E$ is the cylinder $x^2 + y^2 \le 1$, $0 \le z \le 2$.'
            answer: '$2\pi$'
            solution_sketch: '$\int_0^{2\pi}\int_0^1\int_0^2 z\, r\, dz\, dr\, d\theta = 2\pi \cdot \frac{1}{2} \cdot 2 = 2\pi$ (with $\int_0^2 z\,dz = 2$ and $\int_0^1 r\,dr = \frac{1}{2}$).'
          - problem: 'Find the volume of the solid above the cone $z = \sqrt{x^2 + y^2}$ and below the plane $z = 2$.'
            answer: '$\frac{8\pi}{3}$'
            solution_sketch: 'For $0 \le r \le 2$, $z$ runs from $r$ to $2$: $\int_0^{2\pi}\int_0^2 (2 - r) r\, dr\, d\theta = 2\pi\left(4 - \frac{8}{3}\right) = \frac{8\pi}{3}$.'
          - problem: "Use cylindrical coordinates to evaluate the triple integral of (x^2 + y^2) dV over the solid cylinder x^2 + y^2 <= 1 with 0 <= z <= 3."
            answer: "3pi/2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Use the cylindrical volume element dV = r dz dr dtheta to write the full integral as the integral from 0 to 2pi of the integral from 0 to 1 of the integral from 0 to 3 of r^2 * r dz dr dtheta. Evaluate the inner z-integral to get 3, the middle r-integral to get 1/4, and the outer theta-integral to get 2pi. Multiply 2pi by 3 and by 1/4 to get 3pi/2. The answer is 3pi/2."
          - problem: "Use cylindrical coordinates to evaluate the triple integral of z^2 dV over the solid cylinder x^2 + y^2 <= 4 with 0 <= z <= 1."
            answer: "4pi/3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Use the cylindrical volume element dV = r dz dr dtheta to write the full integral as the integral from 0 to 2pi of the integral from 0 to 2 of the integral from 0 to 1 of z^2 * r dz dr dtheta. Evaluate the z-integral to get 1/3, the r-integral to get 2, and the theta-integral to get 2pi. Multiply 2pi by 1/3 and by 2 to get 4pi/3. The answer is 4pi/3."
          - problem: "Use cylindrical coordinates to evaluate the triple integral of (x^2 + y^2) dV over the solid between the cone z = sqrt(x^2 + y^2) and the plane z = 1."
            answer: "pi/10"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Use the cylindrical volume element dV = r dz dr dtheta. The solid has 0 <= r <= 1, r <= z <= 1, and 0 <= theta <= 2pi. The full integral is the integral from 0 to 2pi of the integral from 0 to 1 of the integral from r to 1 of r^2 * r dz dr dtheta. The z-integral gives 1 - r, so the r-integral is the integral from 0 to 1 of r^3(1 - r) dr = 1/4 - 1/5 = 1/20. Multiply 2pi by 1/20 to get pi/10. The answer is pi/10."
          - problem: "Use cylindrical coordinates to evaluate the triple integral of z dV over the solid between the paraboloid z = x^2 + y^2 and the plane z = 4."
            answer: "64pi/3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Use the cylindrical volume element dV = r dz dr dtheta. The paraboloid z = x^2 + y^2 is z = r^2, so 0 <= r <= 2, r^2 <= z <= 4, and 0 <= theta <= 2pi. The full integral is the integral from 0 to 2pi of the integral from 0 to 2 of the integral from r^2 to 4 of z * r dz dr dtheta. The z-integral gives (16 - r^4)/2. After the theta-integral gives 2pi, the remaining factor is pi times the integral from 0 to 2 of (16r - r^5) dr. That integral is 32 - 64/6 = 64/3, so the value is 64pi/3. The answer is 64pi/3."
        constraints: "solids with rotational symmetry about the z-axis (cylinders, cones, paraboloids); dV = r dz dr dtheta"
      - id: kp3
        name: "Volumes of rotationally symmetric solids"
        key_prerequisites: [triple-integrals, double-integrals-polar]
        exemplars:
          - problem: 'Find the volume of the solid under the paraboloid $z = 9 - x^2 - y^2$ and above the $xy$-plane.'
            answer: '$\frac{81\pi}{2}$'
            solution_sketch: '$\int_0^{2\pi}\int_0^3 (9 - r^2) r\, dr\, d\theta = 2\pi\left(\frac{81}{2} - \frac{81}{4}\right) = \frac{81\pi}{2}$.'
          - problem: 'Evaluate $\iiint_E (x^2 + y^2) \, dV$ where $E$ is the cylinder $x^2 + y^2 \le 4$, $0 \le z \le 1$.'
            answer: '$8\pi$'
            solution_sketch: '$\int_0^{2\pi}\int_0^2\int_0^1 r^2 \cdot r\, dz\, dr\, d\theta = 2\pi \cdot \frac{16}{4} = 8\pi$.'
        constraints: "paraboloids and cylinders with small integer radii; answers exact multiples of pi"
    diagnostic_exemplar:
      problem: 'Use cylindrical coordinates to find the volume of the solid bounded above by the paraboloid $z = 12 - x^2 - y^2$ and below by the cone $z = \sqrt{x^2 + y^2}$.'
      answer: '$\dfrac{99\pi}{2}$'
      answer_contract: {kind: none}
      solution_sketch: 'The surfaces meet where $12 - r^2 = r$, i.e. $r = 3$. Then $V = \int_0^{2\pi}\!\int_0^3 \left[(12 - r^2) - r\right] r\,dr\,d\theta = 2\pi\left[6r^2 - \tfrac{r^4}{4} - \tfrac{r^3}{3}\right]_0^3 = 2\pi\left(54 - \tfrac{81}{4} - 9\right) = \tfrac{99\pi}{2}$.'
    anki_seeds:
      - front: 'Volume element in cylindrical coordinates?'
        back: '$dV = r \, dz \, dr \, d\theta$'
        type: basic
      - front: 'When are cylindrical coordinates the right choice for a triple integral?'
        back: 'When the solid or integrand is symmetric about the $z$-axis (cylinders, cones, paraboloids, $x^2 + y^2$ terms).'
        type: basic

  - id: cylindrical-spherical-coordinates
    name: "Spherical Coordinates and Choosing a System"
    core: true
    difficulty: 0.82
    drill: false
    answer_kind: numeric
    expected_time_secs: 240
    prerequisites:
      - id: triple-integrals-cylindrical
        weight: 0.8
        key: true
      - id: triple-integrals
        weight: 0.4
        key: false
      - id: partial-derivatives-trig-exp
        weight: 0.5
        key: true
      - id: determinants-2x2
        weight: 0.4
        key: false
    knowledge_points:
      - id: kp1
        name: "Spherical coordinates: conversion and set-up"
        key_prerequisites: [triple-integrals-cylindrical]
        exemplars:
          - problem: 'Convert the spherical point $(\rho, \varphi, \theta) = \left(2, \frac{\pi}{3}, 0\right)$ to rectangular coordinates.'
            answer: '$(\sqrt{3}, 0, 1)$'
            solution_sketch: '$x = 2\sin\frac{\pi}{3}\cos 0 = \sqrt{3}$, $y = 2\sin\frac{\pi}{3}\sin 0 = 0$, $z = 2\cos\frac{\pi}{3} = 1$.'
          - problem: "Convert the spherical point (rho, phi, theta) = (4, pi/6, pi/2) to rectangular coordinates. Give the answer as (x, y, z)."
            answer: "(0, 2, 2sqrt(3))"
            answer_contract: {"arity": 3, "kind": "coordinates"}
            solution_sketch: "Use the conversion rule x = rho sin(phi) cos(theta), y = rho sin(phi) sin(theta), and z = rho cos(phi). Substitute rho = 4, phi = pi/6, theta = pi/2 and use standard unit-circle values: x = 4*(1/2)*0 = 0, y = 4*(1/2)*1 = 2, z = 4*(sqrt(3)/2) = 2sqrt(3). The answer is (0, 2, 2sqrt(3))."
          - problem: "Convert the rectangular point (x, y, z) = (0, 3, 3sqrt(3)) to spherical coordinates. Give the answer as (rho, phi, theta)."
            answer: "(6, pi/6, pi/2)"
            answer_contract: {"arity": 3, "kind": "coordinates"}
            solution_sketch: "Use rho = sqrt(x^2 + y^2 + z^2), phi = acos(z/rho), and theta = pi/2 because x = 0 and y > 0. Substitute (0, 3, 3sqrt(3)): rho = sqrt(0 + 9 + 27) = 6 and phi = acos(3sqrt(3)/6) = acos(sqrt(3)/2) = pi/6. The answer is (6, pi/6, pi/2)."
          - problem: "A point has rectangular coordinates (x, y, z) = (4, -4, 4sqrt(2)). Find its spherical radial coordinate rho."
            answer: "8"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Use the radial-coordinate rule rho = sqrt(x^2 + y^2 + z^2). Substitute x = 4, y = -4, z = 4sqrt(2): rho = sqrt(16 + 16 + 32) = sqrt(64). Since sqrt(64) = 8, the answer is 8."
          - problem: "Set up a triple integral in spherical coordinates for the region inside the sphere rho <= 5 and with polar angle phi <= pi/4. The variables have lower limits theta = 0, phi = 0, and rho = 0. Give the upper limits in the form rhomax = value; phimax = value; thetamax = value."
            answer: "rhomax = 5; phimax = pi/4; thetamax = 2pi"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "rhomax"}, {"contract": {"kind": "exact"}, "name": "phimax"}, {"contract": {"kind": "exact"}, "name": "thetamax"}]}
            solution_sketch: "Use spherical set-up for a ball of radius 5 with a cone cut at phi = pi/4. The radial coordinate gives rho from 0 to 5, the cone gives phi from 0 to pi/4, and the full azimuth gives theta from 0 to 2pi. The answer is rhomax = 5; phimax = pi/4; thetamax = 2pi."
          - problem: "Set up a triple integral in spherical coordinates for the upper half of the ball rho <= 3, where z >= 0. The variables have lower limits theta = 0, phi = 0, and rho = 0. Give the upper limits in the form rhomax = value; phimax = value; thetamax = value."
            answer: "rhomax = 3; phimax = pi/2; thetamax = 2pi"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "rhomax"}, {"contract": {"kind": "exact"}, "name": "phimax"}, {"contract": {"kind": "exact"}, "name": "thetamax"}]}
            solution_sketch: "Use spherical set-up for the upper half of a ball of radius 3. The condition z >= 0 means phi runs from 0 to pi/2, the full azimuth gives theta from 0 to 2pi, and the radial coordinate gives rho from 0 to 3. The answer is rhomax = 3; phimax = pi/2; thetamax = 2pi."
        constraints: "angles at standard unit-circle values; balls, half-balls, and cones as regions"
      - id: kp2
        name: "Evaluating spherical integrals"
        key_prerequisites: [triple-integrals-cylindrical]
        exemplars:
          - problem: 'Use spherical coordinates to verify the volume of the ball of radius $3$.'
            answer: '$36\pi$'
            solution_sketch: '$\int_0^{2\pi}\int_0^{\pi}\int_0^3 \rho^2 \sin\varphi \, d\rho\, d\varphi\, d\theta = 2\pi \cdot 2 \cdot 9 = 36\pi$ (with $\int_0^3 \rho^2 d\rho = 9$, $\int_0^\pi \sin\varphi\, d\varphi = 2$).'
          - problem: 'Evaluate $\iiint_E z \, dV$ where $E$ is the upper half of the unit ball.'
            answer: '$\frac{\pi}{4}$'
            solution_sketch: '$z = \rho\cos\varphi$: $\int_0^{2\pi}\int_0^{\pi/2}\int_0^1 \rho^3 \cos\varphi \sin\varphi\, d\rho\, d\varphi\, d\theta = 2\pi \cdot \frac{1}{4} \cdot \frac{1}{2} = \frac{\pi}{4}$.'
          - problem: "Let E be the ball centered at the origin with radius 4. Use spherical coordinates to evaluate the triple integral of 1 over E. Give the exact value."
            answer: "256pi/3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (spherical volume element): dV = rho^2 sin(phi) d rho d phi d theta, so the integrand 1 becomes rho^2 sin(phi). Step 2 (separated limits for a ball): rho runs 0 to 4, phi runs 0 to pi, and theta runs 0 to 2pi. Step 3 (power and sine rules): the rho integral is 64/3, the phi integral is 2, and the theta integral is 2pi. Multiply to get 256pi/3. The exact value is 256pi/3."
          - problem: 'Evaluate $\iiint_B e^{(x^2+y^2+z^2)^{3/2}} dV$ over the unit ball.'
            answer: '$\frac{4\pi(e - 1)}{3}$'
            solution_sketch: 'The integrand is $e^{\rho^3}$; $\int_0^1 e^{\rho^3}\rho^2\, d\rho = \frac{e-1}{3}$ (substitute $u = \rho^3$), times $\int\sin\varphi = 2$ and $2\pi$.'
          - problem: "Let E be the upper half of the ball centered at the origin with radius 2. Use spherical coordinates to evaluate the triple integral of z over E. Give the exact value."
            answer: "4pi"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (spherical substitution): z = rho cos(phi) and dV = rho^2 sin(phi) d rho d phi d theta, so z dV becomes rho^3 cos(phi) sin(phi). Step 2 (upper half-ball limits): rho runs 0 to 2, phi runs 0 to pi/2, and theta runs 0 to 2pi. Step 3 (power and product-to-sum rules): the rho integral is 4, the phi integral is 1/2, and the theta integral is 2pi. Multiply to get 4pi. The exact value is 4pi."
          - problem: "Let E be the ball centered at the origin with radius 2. Use spherical coordinates to evaluate the triple integral of rho over E. Give the exact value."
            answer: "16pi"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (spherical volume element): dV = rho^2 sin(phi) d rho d phi d theta, so rho dV becomes rho^3 sin(phi). Step 2 (ball limits): rho runs 0 to 2, phi runs 0 to pi, and theta runs 0 to 2pi. Step 3 (power and sine rules): the rho integral is 4, the phi integral is 2, and the theta integral is 2pi. Multiply to get 16pi. The exact value is 16pi."
        constraints: "balls and half-balls centered at the origin; integrands are functions of rho alone or a single factor of cos(phi) (e.g. z = rho cos phi); dV = rho^2 sin(phi) d rho d phi d theta; the triple integral separates into a product of three one-variable integrals"
      - id: kp3
        name: "Jacobians and choosing a coordinate system"
        key_prerequisites: [triple-integrals-cylindrical, partial-derivatives-trig-exp, determinants-2x2]
        exemplars:
          - problem: 'Compute the Jacobian $\frac{\partial(x, y)}{\partial(r, \theta)}$ for the polar map $x = r\cos\theta$, $y = r\sin\theta$.'
            answer: '$r$'
            solution_sketch: '$\det\begin{pmatrix} \cos\theta & -r\sin\theta \\ \sin\theta & r\cos\theta \end{pmatrix} = r\cos^2\theta + r\sin^2\theta = r$ — this determinant is why $dA = r\,dr\,d\theta$.'
          - problem: 'Find the volume of the "ice-cream cone" region inside the cone $\varphi \le \frac{\pi}{3}$ and the sphere $\rho \le 1$.'
            answer: '$\frac{\pi}{3}$'
            solution_sketch: '$\int_0^{2\pi}\int_0^{\pi/3}\int_0^1 \rho^2\sin\varphi\, d\rho\, d\varphi\, d\theta = 2\pi \cdot \frac{1}{3}\left(1 - \cos\frac{\pi}{3}\right) = \frac{2\pi}{3} \cdot \frac{1}{2} = \frac{\pi}{3}$.'
        constraints: "2x2 Jacobians only; cone half-angles at standard unit-circle values"
    diagnostic_exemplar:
      problem: 'Use spherical coordinates to find the volume of the region inside the sphere $\rho \le 2$ and above the cone $\varphi \le \frac{\pi}{3}$.'
      answer: '$\dfrac{8\pi}{3}$'
      answer_contract: {kind: none}
      solution_sketch: '$V = \int_0^{2\pi}\!\int_0^{\pi/3}\!\int_0^2 \rho^2 \sin\varphi \,d\rho\,d\varphi\,d\theta = 2\pi \cdot \tfrac{8}{3} \cdot \left[-\cos\varphi\right]_0^{\pi/3} = 2\pi \cdot \tfrac{8}{3} \cdot \tfrac{1}{2} = \tfrac{8\pi}{3}$.'
    anki_seeds:
      - front: 'Volume element in spherical coordinates?'
        back: '$dV = \rho^2 \sin\varphi \, d\rho \, d\varphi \, d\theta$'
        type: basic
      - front: 'Spherical-to-rectangular conversion formulas?'
        back: '$x = \rho\sin\varphi\cos\theta$, $y = \rho\sin\varphi\sin\theta$, $z = \rho\cos\varphi$.'
        type: basic

  - id: change-of-variables-jacobians
    name: "Change of Variables and Jacobians"
    core: false                # terminal capstone of the multiple-integral module
    difficulty: 0.84
    drill: false
    answer_kind: numeric
    expected_time_secs: 300
    prerequisites:
      - id: double-integrals
        weight: 0.7
        key: true
      - id: partial-derivatives-trig-exp
        weight: 0.6
        key: true
      - id: determinants-2x2
        weight: 0.6
        key: true
      - id: cylindrical-spherical-coordinates
        weight: 0.3
        key: false
    knowledge_points:
      - id: kp1
        name: "Computing Jacobians of transformations"
        key_prerequisites: [double-integrals, partial-derivatives-trig-exp, determinants-2x2]
        exemplars:
          - problem: 'Compute the Jacobian $\frac{\partial(x, y)}{\partial(u, v)}$ for $x = 2u + v$, $y = u + 2v$.'
            answer: "3"
            solution_sketch: '$\det\begin{pmatrix} 2 & 1 \\ 1 & 2 \end{pmatrix} = 4 - 1 = 3$.'
          - problem: 'Compute the Jacobian for $x = u^2 - v^2$, $y = 2uv$.'
            answer: '$4u^2 + 4v^2$'
            solution_sketch: '$\det\begin{pmatrix} 2u & -2v \\ 2v & 2u \end{pmatrix} = 4u^2 + 4v^2$.'
          - problem: "For $x = 3u + 2v$ and $y = u + 4v$, compute the Jacobian $\\frac{\\partial(x,y)}{\\partial(u,v)}$."
            answer: "10"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The Jacobian is the determinant of the matrix of partial derivatives: $\\det\\begin{pmatrix} 3 & 2 \\\\ 1 & 4 \\end{pmatrix}$ (build the matrix step). Evaluate the 2x2 determinant: $3 \\cdot 4 - 2 \\cdot 1 = 12 - 2 = 10$ (determinant rule). The Jacobian is 10."
          - problem: "For $x = u^2 + v^2$ and $y = uv$, compute the Jacobian."
            answer: "2u^2-2v^2"
            answer_contract: {"kind": "function", "vars": ["u", "v"]}
            solution_sketch: "The Jacobian is the determinant of the matrix of partial derivatives: $\\det\\begin{pmatrix} 2u & 2v \\\\ v & u \\end{pmatrix}$ (partial derivatives step). Evaluate the 2x2 determinant: $2u \\cdot u - 2v \\cdot v = 2u^2 - 2v^2$ (determinant rule). The Jacobian is 2u^2-2v^2."
          - problem: "For $x = u^2 - v$ and $y = u + v^2$, compute the Jacobian."
            answer: "4uv+1"
            answer_contract: {"kind": "function", "vars": ["u", "v"]}
            solution_sketch: "The Jacobian is the determinant of the matrix of partial derivatives: $\\det\\begin{pmatrix} 2u & -1 \\\\ 1 & 2v \\end{pmatrix}$ (partial derivatives step). Evaluate the 2x2 determinant: $2u \\cdot 2v - (-1) \\cdot 1 = 4uv + 1$ (determinant rule). The Jacobian is 4uv+1."
          - problem: "For $x = 5u - v$ and $y = 2u + 3v$, compute the Jacobian."
            answer: "17"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The Jacobian is the determinant of the matrix of partial derivatives: $\\det\\begin{pmatrix} 5 & -1 \\\\ 2 & 3 \\end{pmatrix}$ (build the matrix step). Evaluate the 2x2 determinant: $5 \\cdot 3 - (-1) \\cdot 2 = 15 + 2 = 17$ (determinant rule). The Jacobian is 17."
        constraints: "linear or classic quadratic maps; Jacobians are integers or clean polynomials in u, v"
      - id: kp2
        name: "Transforming double integrals"
        key_prerequisites: [double-integrals, determinants-2x2]
        exemplars:
          - problem: 'Evaluate $\iint_R (x + y)\, dA$ where $R$ is the parallelogram with vertices $(0,0)$, $(2,1)$, $(3,3)$, $(1,2)$, using $x = 2u + v$, $y = u + 2v$.'
            answer: "9"
            solution_sketch: 'The map sends $[0,1]^2$ to $R$ with Jacobian $3$; $x + y = 3u + 3v$, so the integral is $\int_0^1\int_0^1 3(u+v) \cdot 3\, du\, dv = 9$.'
          - problem: 'Evaluate $\iint_R e^{(x-y)/(x+y)}\, dA$ where $R$ is the triangle bounded by $x = 0$, $y = 0$, $x + y = 1$, using $u = x - y$, $v = x + y$.'
            answer: '$\frac{1}{4}\left(e - \frac{1}{e}\right)$'
            solution_sketch: '$x = \frac{u+v}{2}$, $y = \frac{v-u}{2}$ has Jacobian $\frac{1}{2}$; the region becomes $0 \le v \le 1$, $-v \le u \le v$: $\frac{1}{2}\int_0^1 \int_{-v}^{v} e^{u/v}\, du\, dv = \frac{1}{2}\int_0^1 v\left(e - e^{-1}\right) dv$.'
          - problem: "Evaluate the double integral over R of (x + 2y) dA, where R is the parallelogram with vertices (0,0), (1,2), (3,5), (2,3), using x = u + 2v, y = 2u + 3v. Give the answer as a fraction."
            answer: "13/2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Use the change of variables formula with x = u + 2v and y = 2u + 3v. The Jacobian determinant is det [1, 2; 2, 3] = 3 - 4 = -1, so |J| = 1. The map sends the unit square in the uv-plane to the parallelogram R. The integrand becomes x + 2y = (u + 2v) + 2(2u + 3v) = 5u + 8v. Integrate over the unit square: integral from 0 to 1 of integral from 0 to 1 of (5u + 8v) du dv = integral from 0 to 1 of (5/2 + 8v) dv = 5/2 + 4. The value of the integral is 13/2."
          - problem: "Evaluate the double integral over R of (x + y) dA, where R is the triangle with vertices (0,0), (1,0), (0,1), using u = x + y, v = x - y. Give the answer as a fraction."
            answer: "1/3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Use the change of variables u = x + y and v = x - y, so x = (u + v)/2 and y = (u - v)/2. The Jacobian determinant is det [1/2, 1/2; 1/2, -1/2] = -1/2, so |J| = 1/2. The triangle R maps to the uv-region 0 <= u <= 1, -u <= v <= u. The integrand becomes x + y = u. Integrate: integral from u = 0 to 1 of integral from v = -u to u of u*(1/2) dv du = integral from 0 to 1 of u^2 du. The value of the integral is 1/3."
          - problem: "Evaluate the double integral over R of (x^2 - y^2) dA, where R is the diamond with vertices (0,0), (1,1), (2,0), (1,-1), using x = u + v, y = u - v. Give the answer as an integer."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Use the change of variables x = u + v and y = u - v. The Jacobian determinant is det [1, 1; 1, -1] = -2, so |J| = 2. The unit square in the uv-plane maps to the diamond R. The integrand becomes x^2 - y^2 = (u + v)^2 - (u - v)^2 = 4uv. Integrate: integral from 0 to 1 of integral from 0 to 1 of 4uv*2 du dv = 8*(1/2)*(1/2). The value of the integral is 2."
          - problem: "Evaluate the double integral over R of (x + 2y) dA, where R is the rectangle with vertices (0,0), (2,0), (2,3), (0,3), using x = 2u, y = 3v. Give the answer as an integer."
            answer: "24"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Use the change of variables x = 2u and y = 3v. The Jacobian determinant is det [2, 0; 0, 3] = 6, so |J| = 6. The unit square in the uv-plane maps to the rectangle R. The integrand becomes x + 2y = 2u + 6v. Integrate: integral from 0 to 1 of integral from 0 to 1 of (2u + 6v)*6 du dv = 6*(1 + 3). The value of the integral is 24."
        constraints: "the substitution is given; regions map to squares/triangles in the uv-plane; remember |J| and the direction of the map"
      - id: kp3
        name: "Choosing a transformation"
        key_prerequisites: [double-integrals, partial-derivatives-trig-exp, determinants-2x2]
        exemplars:
          - problem: 'Find the area of the region in the first quadrant bounded by $xy = 1$, $xy = 4$, $y = x$, and $y = 4x$, using $u = xy$, $v = y/x$.'
            answer: '$3\ln 2$'
            solution_sketch: '$x = \sqrt{u/v}$, $y = \sqrt{uv}$ has Jacobian $\frac{1}{2v}$; area $= \int_1^4 \int_1^4 \frac{1}{2v}\, dv\, du = 3 \cdot \frac{\ln 4}{2} = 3\ln 2$.'
          - problem: "The region is bounded by y = x, y = x + 3, y = -x, and y = -x + 4. Choose new variables that turn the boundary lines into constant coordinate lines. Find the area of the region."
            answer: "6"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The boundary lines suggest u = y - x and v = y + x, because y = x and y = x + 3 give u = 0 and u = 3, while y = -x and y = -x + 4 give v = 0 and v = 4. Solve for x and y: x = (v - u)/2 and y = (v + u)/2, so the Jacobian is the absolute value of the determinant [[-1/2, 1/2],[1/2, 1/2]], which is 1/2. The area is the integral of 1/2 over 0 <= u <= 3 and 0 <= v <= 4, giving (1/2)(3)(4) = 6. The area is 6."
          - problem: "Use u = x + y and v = x - y on the region bounded by x + y = 1, x + y = 4, x - y = 0, and x - y = 3. Find the area of the region as a fraction."
            answer: "9/2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Set u = x + y and v = x - y, so the boundary lines become u = 1, u = 4, v = 0, and v = 3. Solve x = (u + v)/2 and y = (u - v)/2, so the Jacobian determinant has absolute value 1/2. The area is the double integral of 1/2 over 1 <= u <= 4 and 0 <= v <= 3, which equals (1/2)(3)(3) = 9/2. The area is 9/2."
          - problem: "Use u = x + y and v = x - y on the region bounded by x + y = 0, x + y = 2, x - y = 0, and x - y = 4. Evaluate the double integral of (x + y)^2 over the region as a fraction."
            answer: "16/3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Use u = x + y and v = x - y, so u runs from 0 to 2 and v runs from 0 to 4 on the region. The inverse is x = (u + v)/2 and y = (u - v)/2, whose Jacobian has absolute value 1/2. The integrand becomes u^2, so the integral is the double integral of (1/2)u^2 over 0 <= u <= 2 and 0 <= v <= 4. Integrating in v first gives 2u^2, then integrating u from 0 to 2 gives (2/3)(8) = 16/3. The value of the integral is 16/3."
          - problem: "The region is bounded by y = 2x, y = 2x + 4, y = -x, and y = -x + 2. Choose new variables that turn the boundary lines into constant coordinate lines. Find the area of the region as a fraction."
            answer: "8/3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Choose u = y - 2x and v = y + x, because y = 2x and y = 2x + 4 give u = 0 and u = 4, while y = -x and y = -x + 2 give v = 0 and v = 2. Solve x = (v - u)/3 and y = (2v + u)/3, whose Jacobian determinant has absolute value 1/3. The area is the double integral of 1/3 over 0 <= u <= 4 and 0 <= v <= 2, which equals (1/3)(4)(2) = 8/3. The area is 8/3."
          - problem: "Use polar coordinates x = r cos(theta) and y = r sin(theta) on the disk x^2 + y^2 <= 9. Evaluate the double integral of x^2 + y^2 over the disk."
            answer: "81pi/2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Use polar coordinates x = r cos(theta) and y = r sin(theta), for which the Jacobian is r. The disk x^2 + y^2 <= 9 becomes 0 <= r <= 3 and 0 <= theta <= 2pi. The integrand x^2 + y^2 becomes r^2, so the integral is the double integral of r^3 over those limits. Integrating gives 2pi times (81/4), which equals 81pi/2. The value of the integral is 81pi/2."
        constraints: "boundary curves become u = const, v = const; final answers involve at most one logarithm"
    diagnostic_exemplar:
      problem: 'Evaluate $\iint_R (x + y)\,dA$, where $R$ is the parallelogram with vertices $(0,0)$, $(3,1)$, $(4,3)$, $(1,2)$, using the change of variables $x = 3u + v$, $y = u + 2v$.'
      answer: '$\dfrac{35}{2}$'
      answer_contract: {kind: none}
      solution_sketch: 'The map sends the unit square $0 \le u, v \le 1$ onto $R$, and its Jacobian is $3 \cdot 2 - 1 \cdot 1 = 5$. Since $x + y = 4u + 3v$, the integral is $\int_0^1\!\int_0^1 (4u + 3v)\cdot 5\,du\,dv = 5\left(2 + \tfrac{3}{2}\right) = \tfrac{35}{2}$.'
    anki_seeds:
      - front: 'Change-of-variables formula for double integrals?'
        back: '$\iint_R f(x,y)\, dA = \iint_S f(x(u,v), y(u,v)) \left|\frac{\partial(x,y)}{\partial(u,v)}\right| du\, dv$'
        type: basic
      - front: 'How does polar coordinates fit the change-of-variables theorem?'
        back: 'It is the special case $x = r\cos\theta$, $y = r\sin\theta$ with Jacobian $r$ — hence $dA = r\,dr\,d\theta$.'
        type: basic
