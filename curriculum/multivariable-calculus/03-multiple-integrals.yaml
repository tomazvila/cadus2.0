unit: multiple-integrals
course: multivariable-calculus
module: "Multiple Integrals"
topics:
  - id: iterated-integrals-rectangles
    name: "Iterated Integrals over Rectangles"
    core: true
    difficulty: 0.66
    drill: false
    answer_kind: numeric
    expected_time_secs: 150
    prerequisites:
      - id: definite-integrals-ftc
        weight: 0.8
        key: true
      - id: functions-several-variables
        weight: 0.5
        key: true
    knowledge_points:
      - id: kp1
        name: "Partial (inner) integration"
        key_prerequisites: [definite-integrals-ftc]
        try_first:
          problem: 'Let $x = 5$. Evaluate $\int_0^2 x\, dy$.'
          answer_contract: {"kind": "exact"}
          answer: '10'
          reveal: 'While $y$ runs from $0$ to $2$, the letter $x$ stays at the fixed value $5$. So the integral is $\int_0^2 5\, dy = 10$, and in general $\int_0^2 x\, dy = 2x$.'
        exemplars:
          - problem: 'Evaluate $\int_0^1 x y^2 \, dy$.'
            answer: 'x/3'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'Only $y$ changes, so $x$ is a constant factor: $x\int_0^1 y^2\,dy = x \cdot \frac{1}{3}$. The result is $\frac{x}{3}$, which still contains $x$.'
          - problem: 'Evaluate $\int_0^2 (2x + y) \, dx$.'
            answer: '4 + 2y'
            answer_contract: {"kind": "function", "vars": ["y"]}
            solution_sketch: 'Now $x$ is the variable and $y$ is a constant. An antiderivative is $x^2 + xy$, and at $x = 2$ and $x = 0$ it gives $\left[x^2 + xy\right]_0^2 = 4 + 2y$.'
          - problem: 'Evaluate $\int_1^3 (x^2 + 2xy)\,dy$.'
            answer: '2x^2 + 8x'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'Hold $x$ fixed. An antiderivative in $y$ is $x^2 y + x y^2$, so the integral is $(3x^2 + 9x) - (x^2 + x) = 2x^2 + 8x$.'
          - problem: 'Evaluate $\int_0^x (2y + 3)\,dy$.'
            answer: 'x^2 + 3x'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'An antiderivative in $y$ is $y^2 + 3y$. The upper limit is $x$ and the lower limit is $0$, so the value is $(x^2 + 3x) - 0 = x^2 + 3x$.'
          - problem: 'A roof over a rectangular floor has height $z = x + y^2$ metres above the point $(x, y)$ of the floor. Along the line at fixed $x$, the cross-section of the roof above $0 \le y \le 3$ has area $A(x) = \int_0^3 (x + y^2)\,dy$ square metres. Find $A(x)$.'
            answer: '3x + 9'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'Hold $x$ fixed and integrate in $y$: $\int_0^3 (x + y^2)\,dy = \left[xy + \frac{y^3}{3}\right]_0^3 = 3x + 9$. So $A(x) = 3x + 9$ square metres.'
          - problem: 'The cross-section of a roof above the line $0 \le y \le 3$ at fixed $x$ has area $A(x) = 3x + 9$ square metres, and the line is $3$ metres long. Find the average height of the roof along that line, as a function of $x$.'
            answer: 'x + 3'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'The average height is the area divided by the length of the line. So $\frac{3x + 9}{3} = x + 3$ metres, which is the area per metre of length.'
          - problem: 'Evaluate $\int_1^2 4xy^3\,dx$.'
            answer: '6y^3'
            answer_contract: {"kind": "function", "vars": ["y"]}
            solution_sketch: 'Hold $y$ fixed. Factor out the constant $4y^3$: $4y^3\int_1^2 x\,dx = 4y^3\left[\frac{x^2}{2}\right]_1^2 = 4y^3\cdot\frac{3}{2} = 6y^3$.'
          - problem: 'Evaluate $\int_0^2 6xy\,dy$.'
            answer: '12x'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'The differential is $dy$, so $x$ is the constant. Then $\int_0^2 6xy\,dy = 6x\left[\frac{y^2}{2}\right]_0^2 = 12x$.'
        constraints: 'polynomial integrands; the variable that is not integrated survives as a parameter in the answer; one item divides a cross-section area by a length'
      - id: kp2
        name: "Iterated integrals over rectangles"
        key_prerequisites: [definite-integrals-ftc, functions-several-variables]
        exemplars:
          - problem: 'Evaluate $\int_0^2 \int_0^1 x y^2 \, dy \, dx$.'
            answer: '2/3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The inner integral is $\int_0^1 xy^2\,dy = \frac{x}{3}$. Then $\int_0^2 \frac{x}{3}\,dx = \frac{1}{3}\cdot 2 = \frac{2}{3}$.'
          - problem: 'Evaluate $\int_0^1 \int_0^2 (x + 2y) \, dy \, dx$.'
            answer: '5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The inner integral is $\left[xy + y^2\right]_0^2 = 2x + 4$. Then $\int_0^1 (2x + 4)\,dx = 1 + 4 = 5$.'
          - problem: 'Evaluate $\int_0^1 \int_0^3 (x^2 + y) \, dy \, dx$.'
            answer: '11/2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Hold $x$ fixed: $\int_0^3 (x^2 + y)\,dy = 3x^2 + \frac{9}{2}$. Then $\int_0^1 \left(3x^2 + \frac{9}{2}\right)dx = 1 + \frac{9}{2} = \frac{11}{2}$.'
          - problem: 'A rectangular metal plate covers $0 \le x \le 2$ and $0 \le y \le 3$, with $x$ and $y$ in metres. Its density at $(x, y)$ is $x + y$ kilograms per square metre. Find the mass of the plate.'
            answer: '15'
            answer_contract: {"kind": "unit", "quantity": "mass", "unit": "kg", "allow_omitted": true}
            solution_sketch: 'The mass is $\int_0^2 \int_0^3 (x + y)\,dy\,dx$. The inner integral is $3x + \frac{9}{2}$, and then $\int_0^2 \left(3x + \frac{9}{2}\right)dx = 6 + 9 = 15$. The mass is $15$ kg.'
          - problem: 'Evaluate $\int_1^2 \int_0^1 (x y + y^2) \, dy \, dx$.'
            answer: '13/12'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The inner integral is $\frac{x}{2} + \frac{1}{3}$. Then $\int_1^2 \left(\frac{x}{2} + \frac{1}{3}\right)dx = \frac{3}{4} + \frac{1}{3} = \frac{13}{12}$.'
          - problem: 'A hill over the rectangle $0 \le x \le 3$, $0 \le y \le 2$ (in metres) has height $x^2 + y$ metres above the point $(x, y)$. Find the volume of earth between the rectangle and the hill.'
            answer: '24'
            answer_contract: {"kind": "unit", "quantity": "cubic_volume", "unit": "m^3", "allow_omitted": true}
            solution_sketch: 'The volume is $\int_0^3 \int_0^2 (x^2 + y)\,dy\,dx$. The inner integral is $2x^2 + 2$, and then $\int_0^3 (2x^2 + 2)\,dx = 18 + 6 = 24$. The volume is $24$ cubic metres.'
          - problem: 'Evaluate $\int_0^2 \int_0^3 (x + y^2) \, dy \, dx$.'
            answer: '24'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The inner integral is $3x + 9$. Then $\int_0^2 (3x + 9)\,dx = 6 + 18 = 24$.'
          - problem: 'Evaluate $\int_0^1 \int_0^2 (x + y)\,dy\,dx$.'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Note that $\int_0^2 x\,dy = 2x$, not $x$. The inner integral is $2x + 2$, and then $\int_0^1 (2x + 2)\,dx = 1 + 2 = 3$.'
        constraints: 'polynomial integrands; rectangle bounds are small integers; answers exact rationals; two items set the integral up from a density or a height over a rectangle'
      - id: kp3
        name: "Fubini's theorem and separable products"
        key_prerequisites: [definite-integrals-ftc, functions-several-variables]
        exemplars:
          - problem: 'Evaluate $\iint_R 6x^2 y \, dA$, where $R = [0,1] \times [0,2]$.'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Fubini''s theorem applies because $R$ is a rectangle. The integral is $\left(\int_0^1 6x^2\,dx\right)\left(\int_0^2 y\,dy\right) = 2 \cdot 2 = 4$.'
          - problem: 'Evaluate $\iint_R x \sin y \, dA$, where $R = [0,1] \times [0,\pi]$.'
            answer: '1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The integrand is a product of a function of $x$ and a function of $y$. Split it: $\left(\int_0^1 x\,dx\right)\left(\int_0^\pi \sin y\,dy\right) = \frac{1}{2} \cdot 2 = 1$.'
          - problem: 'Evaluate $\iint_R 3x^2 y^3 \, dA$, where $R = [0,1] \times [0,1]$.'
            answer: '1/4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The integral is $\left(\int_0^1 3x^2\,dx\right)\left(\int_0^1 y^3\,dy\right)$. The first factor is $1$ and the second is $\frac{1}{4}$, so the value is $\frac{1}{4}$.'
          - problem: 'A rectangular plate covers $0 \le x \le 2$ and $0 \le y \le 3$, with $x$ and $y$ in metres. Its density at $(x, y)$ is $x y^2$ kilograms per square metre. Find the mass of the plate.'
            answer: '18'
            answer_contract: {"kind": "unit", "quantity": "mass", "unit": "kg", "allow_omitted": true}
            solution_sketch: 'The density is a product, so the mass is $\left(\int_0^2 x\,dx\right)\left(\int_0^3 y^2\,dy\right) = 2 \cdot 9 = 18$. The plate has mass $18$ kg.'
          - problem: 'Evaluate $\iint_R x^2 \sin y \, dA$, where $R = [0,3] \times [0,\pi]$.'
            answer: '18'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The integrand is a product of a function of $x$ and a function of $y$. Split it: $\left(\int_0^3 x^2\,dx\right)\left(\int_0^\pi \sin y\,dy\right) = 9 \cdot 2 = 18$.'
          - problem: 'Does the equation $\iint_R (x + y)\,dA = \left(\int_0^1 x\,dx\right)\left(\int_0^1 y\,dy\right)$ hold for $R = [0,1] \times [0,1]$?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "it holds", "it does hold", "true"], ["no", "it does not hold", "it does not", "false"]]}
            solution_sketch: 'The right side is $\frac{1}{2}\cdot\frac{1}{2} = \frac{1}{4}$. The left side is $\int_0^1 \left(x + \frac{1}{2}\right)dx = 1$, so the two sides differ and the product rule fails for a sum.'
          - problem: 'Evaluate $\iint_R 3x \sin y \, dA$, where $R = [0,1] \times [0,\pi/2]$.'
            answer: '3/2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The integrand is a product, and $R$ is a rectangle. The integral is $\left(\int_0^1 3x\,dx\right)\left(\int_0^{\pi/2} \sin y\,dy\right) = \frac{3}{2} \cdot 1 = \frac{3}{2}$.'
          - problem: 'A rectangular plate covers $0 \le x \le 2$ and $0 \le y \le 3$, with $x$ and $y$ in metres. Its density is $c x y$ kilograms per square metre, where $c$ is a constant. The plate has mass $27$ kg. Find $c$.'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The mass is $c\left(\int_0^2 x\,dx\right)\left(\int_0^3 y\,dy\right) = c \cdot 2 \cdot \frac{9}{2} = 9c$. Setting $9c = 27$ and dividing by $9$ gives $c = 3$.'
          - problem: 'Let $R = [0,1] \times [0,1]$. The double integral $\iint_R c x^2 y \, dA$ has value $5$. Find the constant $c$.'
            answer: '30'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The integral equals $c\left(\int_0^1 x^2\,dx\right)\left(\int_0^1 y\,dy\right) = \frac{c}{3}\cdot\frac{1}{2} = \frac{c}{6}$. Setting $\frac{c}{6} = 5$ gives $c = 30$.'
        constraints: 'integrands are products g(x)h(y) over a rectangle, factored into two single-variable integrals; one verdict item shows that a sum does not factor; two items are plate-mass contexts'
    diagnostic_exemplar:
      problem: 'Evaluate $\int_0^1 \int_0^2 4xy \, dy \, dx$.'
      answer: "4"
      solution_sketch: 'Inner: $\int_0^2 4xy\, dy = 8x$; then $\int_0^1 8x\, dx = 4$.'
    anki_seeds:
      - front: 'Fubini''s theorem (informal) for continuous $f$ on a rectangle?'
        back: 'The double integral equals the iterated integral in either order: $\int\!\!\int f\, dy\, dx = \int\!\!\int f\, dx\, dy$.'
        type: basic
      - front: 'How do you evaluate an iterated integral $\int_a^b \int_c^d f\, dy\, dx$?'
        back: 'Inside out: integrate in $y$ treating $x$ as constant, then integrate the result in $x$.'
        type: basic

  - id: describing-planar-regions
    name: "Describing Regions of Integration"
    core: true
    difficulty: 0.68
    drill: false
    answer_kind: numeric
    expected_time_secs: 150
    prerequisites:
      - id: area-between-curves
        weight: 0.6
        key: true
      - id: graphing-linear-equations
        weight: 0.3
        key: false
    knowledge_points:
      - id: kp1
        name: "Type I descriptions (vertical slices)"
        key_prerequisites: [area-between-curves]
        exemplars:
          - problem: 'The region $R$ is bounded by the curves $y = x^2$ and $y = 2x$. Describe $R$ as a type I region, $a \le x \le b$ and $g(x) \le y \le h(x)$. Find $a$, $b$, $g$ and $h$.'
            answer: 'a = 0; b = 2; g = x^2; h = 2x'
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "a"}, {"contract": {"kind": "exact"}, "name": "b"}, {"contract": {"kind": "function", "vars": ["x"]}, "name": "g"}, {"contract": {"kind": "function", "vars": ["x"]}, "name": "h"}]}
            solution_sketch: 'The curves meet where $x^2 = 2x$, so $x = 0$ and $x = 2$. At $x = 1$ the line gives $2$ and the parabola gives $1$, so the line is the upper curve. Hence $a = 0$, $b = 2$, $g = x^2$, $h = 2x$.'
          - problem: 'The region $R$ is the triangle with vertices $(0,0)$, $(4,0)$ and $(4,4)$. Describe $R$ as a type I region, $a \le x \le b$ and $g(x) \le y \le h(x)$. Find $a$, $b$, $g$ and $h$.'
            answer: 'a = 0; b = 4; g = 0; h = x'
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "a"}, {"contract": {"kind": "exact"}, "name": "b"}, {"contract": {"kind": "function", "vars": ["x"]}, "name": "g"}, {"contract": {"kind": "function", "vars": ["x"]}, "name": "h"}]}
            solution_sketch: 'The triangle lies between $x = 0$ and $x = 4$. Its bottom edge is $y = 0$ and its top edge is the diagonal $y = x$. Hence $a = 0$, $b = 4$, $g = 0$, $h = x$.'
          - problem: 'The curves $y = x^2$ and $y = 2 - x$ bound a region. Find the $x$-coordinates of the points where the curves meet.'
            answer: '-2, 1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Set $x^2 = 2 - x$, so $x^2 + x - 2 = 0$. This factors as $(x + 2)(x - 1) = 0$, so the curves meet at $x = -2$ and $x = 1$.'
          - problem: 'The region $R$ is bounded by the curves $y = x^2$ and $y = 4$. Describe $R$ as a type I region, $a \le x \le b$ and $g(x) \le y \le h(x)$. Find $a$, $b$, $g$ and $h$.'
            answer: 'a = -2; b = 2; g = x^2; h = 4'
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "a"}, {"contract": {"kind": "exact"}, "name": "b"}, {"contract": {"kind": "function", "vars": ["x"]}, "name": "g"}, {"contract": {"kind": "function", "vars": ["x"]}, "name": "h"}]}
            solution_sketch: 'Setting $x^2 = 4$ gives $x = -2$ and $x = 2$. At $x = 0$ the line gives $4$ and the parabola gives $0$, so the line is the upper curve. Hence $a = -2$, $b = 2$, $g = x^2$, $h = 4$.'
          - problem: 'A garden bed lies between the curve $y = x^2$ and the straight path $y = 2x + 3$, with $x$ and $y$ in metres. Find the area of the bed.'
            answer: '32/3'
            answer_contract: {"kind": "unit", "quantity": "area", "unit": "m^2", "allow_omitted": true}
            solution_sketch: 'The curves meet where $x^2 = 2x + 3$, so $x = -1$ and $x = 3$, and the path is the upper curve. The area is $\int_{-1}^{3} (2x + 3 - x^2)\,dx = \left[x^2 + 3x - \frac{x^3}{3}\right]_{-1}^{3} = \frac{32}{3}$ square metres.'
          - problem: 'A triangular field has corners at $(0,0)$, $(6,0)$ and $(6,3)$, with distances in metres. A path runs across the field along the line $x = 4$, from one side of the field to the other. How long is the path?'
            answer: '2'
            answer_contract: {"kind": "unit", "quantity": "length", "unit": "m", "allow_omitted": true}
            solution_sketch: 'The field is $0 \le x \le 6$ and $0 \le y \le \frac{x}{2}$, because the long side runs from $(0,0)$ to $(6,3)$. At $x = 4$ the path runs from $y = 0$ to $y = 2$, so it is $2$ metres long.'
          - problem: 'The region $R$ is bounded by the curves $y = x^2$ and $y = x + 2$. Describe $R$ as a type I region, $a \le x \le b$ and $g(x) \le y \le h(x)$. Find $a$, $b$, $g$ and $h$.'
            answer: 'a = -1; b = 2; g = x^2; h = x + 2'
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "a"}, {"contract": {"kind": "exact"}, "name": "b"}, {"contract": {"kind": "function", "vars": ["x"]}, "name": "g"}, {"contract": {"kind": "function", "vars": ["x"]}, "name": "h"}]}
            solution_sketch: 'Setting $x^2 = x + 2$ gives $(x - 2)(x + 1) = 0$, so $x = -1$ and $x = 2$. At $x = 0$ the line gives $2$ and the parabola gives $0$, so the line is on top. Hence $a = -1$, $b = 2$, $g = x^2$, $h = x + 2$.'
          - problem: 'The region between $y = x^2$ and $y = 2x$ is described as $0 \le x \le 2$ and $g(x) \le y \le h(x)$. What is the upper boundary $h(x)$?'
            answer: '2x'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'At $x = 1$ the line $y = 2x$ gives $2$ and the parabola $y = x^2$ gives $1$. So the line is the upper curve, and the correct description is $x^2 \le y \le 2x$ with upper boundary $h(x) = 2x$.'
          - problem: 'The region $R$ is bounded by the curves $y = x^2$ and $y = 3x - 2$. Describe $R$ as a type I region, $a \le x \le b$ and $g(x) \le y \le h(x)$. Find $a$, $b$, $g$ and $h$.'
            answer: 'a = 1; b = 2; g = x^2; h = 3x - 2'
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "a"}, {"contract": {"kind": "exact"}, "name": "b"}, {"contract": {"kind": "function", "vars": ["x"]}, "name": "g"}, {"contract": {"kind": "function", "vars": ["x"]}, "name": "h"}]}
            solution_sketch: 'Setting $x^2 = 3x - 2$ gives $(x - 1)(x - 2) = 0$, so $x = 1$ and $x = 2$. At $x = 1.5$ the line gives $2.5$ and the parabola gives $2.25$, so the line is on top. Hence $a = 1$, $b = 2$, $g = x^2$, $h = 3x - 2$.'
        constraints: 'regions bounded by lines and one parabola, or by a triangle; intersection points at integer coordinates; the region may be given in words, by vertices or inside a measured context (path length, bed area)'
      - id: kp2
        name: "Type II descriptions (horizontal slices)"
        key_prerequisites: [area-between-curves]
        exemplars:
          - problem: 'The region $R$ lies in the first quadrant. It is bounded by the parabola $y = x^2$, the line $y = 4$ and the $y$-axis. Describe $R$ as a type II region, $c \le y \le d$ and $p(y) \le x \le q(y)$. Find $c$, $d$, $p$ and $q$.'
            answer: 'c = 0; d = 4; p = 0; q = sqrt(y)'
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "c"}, {"contract": {"kind": "exact"}, "name": "d"}, {"contract": {"kind": "function", "vars": ["y"]}, "name": "p"}, {"contract": {"kind": "function", "vars": ["y"]}, "name": "q"}]}
            solution_sketch: 'The $y$-values run from $0$ at the origin to $4$ on the line. Solving $y = x^2$ for $x \ge 0$ gives $x = \sqrt{y}$, and the left edge is the $y$-axis, $x = 0$. Hence $c = 0$, $d = 4$, $p = 0$, $q = \sqrt{y}$.'
          - problem: 'The region $R$ is the triangle with vertices $(0,0)$, $(1,0)$ and $(1,1)$. Describe $R$ as a type II region, $c \le y \le d$ and $p(y) \le x \le q(y)$. Find $c$, $d$, $p$ and $q$.'
            answer: 'c = 0; d = 1; p = y; q = 1'
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "c"}, {"contract": {"kind": "exact"}, "name": "d"}, {"contract": {"kind": "function", "vars": ["y"]}, "name": "p"}, {"contract": {"kind": "function", "vars": ["y"]}, "name": "q"}]}
            solution_sketch: 'The $y$-values run from $0$ to $1$. At height $y$ the slice starts on the diagonal $x = y$ and ends on the vertical side $x = 1$. Hence $c = 0$, $d = 1$, $p = y$, $q = 1$.'
          - problem: 'The region $R$ is bounded by the parabola $y = x^2$ and the line $y = 4$. Describe $R$ as a type II region, $c \le y \le d$ and $p(y) \le x \le q(y)$. Find $c$, $d$, $p$ and $q$.'
            answer: 'c = 0; d = 4; p = -sqrt(y); q = sqrt(y)'
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "c"}, {"contract": {"kind": "exact"}, "name": "d"}, {"contract": {"kind": "function", "vars": ["y"]}, "name": "p"}, {"contract": {"kind": "function", "vars": ["y"]}, "name": "q"}]}
            solution_sketch: 'The $y$-values run from $0$ to $4$. Solving $y = x^2$ gives the two branches $x = -\sqrt{y}$ and $x = \sqrt{y}$. So the slice at height $y$ runs from $-\sqrt{y}$ to $\sqrt{y}$.'
          - problem: 'A field is bounded by the parabola $x = y^2$ and the straight fence $x = 4$, with $x$ and $y$ in metres. A walker crosses the field along the line $y = 1$, from one side to the other. How long is the walk?'
            answer: '3'
            answer_contract: {"kind": "unit", "quantity": "length", "unit": "m", "allow_omitted": true}
            solution_sketch: 'On the line $y = 1$ the parabola is at $x = 1^2 = 1$ and the fence is at $x = 4$. The walker covers the distance from $x = 1$ to $x = 4$, which is $3$ metres.'
          - problem: 'The region $R$ is bounded by the parabola $x = y^2$ and the line $x = y + 2$. Describe $R$ as a type II region, $c \le y \le d$ and $p(y) \le x \le q(y)$. Find $c$, $d$, $p$ and $q$.'
            answer: 'c = -1; d = 2; p = y^2; q = y + 2'
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "c"}, {"contract": {"kind": "exact"}, "name": "d"}, {"contract": {"kind": "function", "vars": ["y"]}, "name": "p"}, {"contract": {"kind": "function", "vars": ["y"]}, "name": "q"}]}
            solution_sketch: 'Setting $y^2 = y + 2$ gives $(y - 2)(y + 1) = 0$, so $y = -1$ and $y = 2$. At $y = 0$ the parabola gives $x = 0$ and the line gives $x = 2$, so the parabola is the left edge. Hence $c = -1$, $d = 2$, $p = y^2$, $q = y + 2$.'
          - problem: 'A pond is bounded by the parabola $x = 4 - y^2$ and the straight bank $x = y - 2$, with $x$ and $y$ in metres. Find the area of the pond.'
            answer: '125/6'
            answer_contract: {"kind": "unit", "quantity": "area", "unit": "m^2", "allow_omitted": true}
            solution_sketch: 'The curves meet where $4 - y^2 = y - 2$, so $(y + 3)(y - 2) = 0$ and $y = -3$ or $y = 2$. The parabola is the right edge, so the area is $\int_{-3}^{2} (6 - y - y^2)\,dy = \frac{125}{6}$ square metres.'
          - problem: 'Can the region between $y = x^2$ and $y = x + 2$ be written as one type II region, $c \le y \le d$ and $p(y) \le x \le q(y)$, with a single formula for $p(y)$ and a single formula for $q(y)$?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "it can", "it can be written", "it can be written as one", "one region"], ["no", "it cannot", "it can not", "it cannot be written", "two pieces"]]}
            solution_sketch: 'For $0 \le y \le 1$ a slice runs from $-\sqrt{y}$ to $\sqrt{y}$. For $1 \le y \le 4$ it runs from $y - 2$ to $\sqrt{y}$, because the left edge switches from the parabola to the line at $y = 1$. So no single formula for $p(y)$ works.'
          - problem: 'The region $R$ is bounded by the curve $y = e^x$, the line $y = e$ and the $y$-axis. Describe $R$ as a type II region, $c \le y \le d$ and $p(y) \le x \le q(y)$. Find $c$, $d$, $p$ and $q$.'
            answer: 'c = 1; d = e; p = 0; q = ln(y)'
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "c"}, {"contract": {"kind": "exact"}, "name": "d"}, {"contract": {"kind": "function", "vars": ["y"]}, "name": "p"}, {"contract": {"kind": "function", "vars": ["y"]}, "name": "q"}]}
            solution_sketch: 'The curve meets the $y$-axis at $y = 1$ and the line at $y = e$, so $y$ runs from $1$ to $e$. Solving $y = e^x$ gives $x = \ln y$, so the slice runs from $x = 0$ to $x = \ln y$. Hence $c = 1$, $d = e$, $p = 0$, $q = \ln y$.'
          - problem: 'The region $R$ is the triangle with vertices $(0,1)$, $(0,3)$ and $(2,3)$. Describe $R$ as a type II region, $c \le y \le d$ and $p(y) \le x \le q(y)$. Find $c$, $d$, $p$ and $q$.'
            answer: 'c = 1; d = 3; p = 0; q = y - 1'
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "c"}, {"contract": {"kind": "exact"}, "name": "d"}, {"contract": {"kind": "function", "vars": ["y"]}, "name": "p"}, {"contract": {"kind": "function", "vars": ["y"]}, "name": "q"}]}
            solution_sketch: 'The $y$-values run from $1$ to $3$. The slanted side through $(0,1)$ and $(2,3)$ is $y = x + 1$, which gives $x = y - 1$. So each slice runs from $x = 0$ to $x = y - 1$.'
        constraints: 'the same families of regions as kp1 sliced horizontally; boundaries solved for x in terms of y; one verdict item asks whether one type II formula exists; two items are measured contexts (walk length, pond area)'
      - id: kp3
        name: "Reading the region from an iterated integral"
        key_prerequisites: [area-between-curves]
        exemplars:
          - problem: 'The integral $\int_0^3 \int_x^3 f(x,y)\,dy\,dx$ is taken over a triangle. Reverse the order of integration, so that it has the form $\int_c^d \int_{p(y)}^{q(y)} f(x,y)\,dx\,dy$. Find $c$, $d$, $p$ and $q$.'
            answer: 'c = 0; d = 3; p = 0; q = y'
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "c"}, {"contract": {"kind": "exact"}, "name": "d"}, {"contract": {"kind": "function", "vars": ["y"]}, "name": "p"}, {"contract": {"kind": "function", "vars": ["y"]}, "name": "q"}]}
            solution_sketch: 'The region is $0 \le x \le 3$ and $x \le y \le 3$. For a fixed $y$ between $0$ and $3$, the value of $x$ runs from $0$ to $y$. Hence $c = 0$, $d = 3$, $p = 0$, $q = y$.'
          - problem: 'The integral $\int_0^3 \int_0^{9-x^2} f(x,y)\,dy\,dx$ is taken over a region under a parabola. Reverse the order of integration, so that it has the form $\int_c^d \int_{p(y)}^{q(y)} f(x,y)\,dx\,dy$. Find $c$, $d$, $p$ and $q$.'
            answer: 'c = 0; d = 9; p = 0; q = sqrt(9 - y)'
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "c"}, {"contract": {"kind": "exact"}, "name": "d"}, {"contract": {"kind": "function", "vars": ["y"]}, "name": "p"}, {"contract": {"kind": "function", "vars": ["y"]}, "name": "q"}]}
            solution_sketch: 'The region is $0 \le x \le 3$ and $0 \le y \le 9 - x^2$. For a fixed $y$ between $0$ and $9$, the value of $x$ runs from $0$ to $\sqrt{9 - y}$. Hence $c = 0$, $d = 9$, $p = 0$, $q = \sqrt{9 - y}$.'
          - problem: 'A surveyor records the area of a plot, in square metres, as $\int_0^6 \int_{x/2}^3 dy\,dx$. Find the area of the plot.'
            answer: '9'
            answer_contract: {"kind": "unit", "quantity": "area", "unit": "m^2", "allow_omitted": true}
            solution_sketch: 'The inner integral is $\int_{x/2}^3 dy = 3 - \frac{x}{2}$. Then $\int_0^6 \left(3 - \frac{x}{2}\right)dx = 18 - 9 = 9$ square metres.'
          - problem: 'The integral $\int_0^5 \int_0^{y} f(x,y)\,dx\,dy$ is taken over a triangle. Reverse the order of integration, so that it has the form $\int_a^b \int_{g(x)}^{h(x)} f(x,y)\,dy\,dx$. Find $a$, $b$, $g$ and $h$.'
            answer: 'a = 0; b = 5; g = x; h = 5'
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "a"}, {"contract": {"kind": "exact"}, "name": "b"}, {"contract": {"kind": "function", "vars": ["x"]}, "name": "g"}, {"contract": {"kind": "function", "vars": ["x"]}, "name": "h"}]}
            solution_sketch: 'The region is $0 \le y \le 5$ and $0 \le x \le y$. For a fixed $x$ between $0$ and $5$, the value of $y$ runs from $x$ to $5$. Hence $a = 0$, $b = 5$, $g = x$, $h = 5$.'
          - problem: 'A surveyor describes a plot by the iterated integral $\int_0^6 \int_{x/2}^3 dy\,dx$, with $x$ and $y$ in metres. How wide is the plot, measured along the $x$-direction, at height $y = 2$?'
            answer: '4'
            answer_contract: {"kind": "unit", "quantity": "length", "unit": "m", "allow_omitted": true}
            solution_sketch: 'The plot is $0 \le x \le 6$ and $\frac{x}{2} \le y \le 3$. The condition $y \ge \frac{x}{2}$ gives $x \le 2y$, so at $y = 2$ the plot runs from $x = 0$ to $x = 4$. It is $4$ metres wide.'
          - problem: 'The integral $\int_0^2 \int_x^2 f(x,y)\,dy\,dx$ is reversed to $\int_0^2 \int_y^2 f(x,y)\,dx\,dy$. Is the new integral taken over the same region as the original?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "it is", "same region", "the same"], ["no", "it is not", "not the same", "different region"]]}
            solution_sketch: 'The original region is $0 \le x \le 2$ and $x \le y \le 2$, so $x \le y$. The new region is $0 \le y \le 2$ and $y \le x \le 2$, so $y \le x$. These are two different triangles, and the correct reversal is $\int_0^2 \int_0^y f\,dx\,dy$.'
          - problem: 'The integral $\int_0^4 \int_y^4 f(x,y)\,dx\,dy$ is taken over a triangle. Reverse the order of integration, so that it has the form $\int_a^b \int_{g(x)}^{h(x)} f(x,y)\,dy\,dx$. Find $a$, $b$, $g$ and $h$.'
            answer: 'a = 0; b = 4; g = 0; h = x'
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "a"}, {"contract": {"kind": "exact"}, "name": "b"}, {"contract": {"kind": "function", "vars": ["x"]}, "name": "g"}, {"contract": {"kind": "function", "vars": ["x"]}, "name": "h"}]}
            solution_sketch: 'The region is $0 \le y \le 4$ and $y \le x \le 4$. For a fixed $x$ between $0$ and $4$, the value of $y$ runs from $0$ to $x$. Hence $a = 0$, $b = 4$, $g = 0$, $h = x$.'
          - problem: 'The integral $\int_0^2 \int_0^{4-x^2} f(x,y)\,dy\,dx$ is taken over a region bounded by a parabola. Reverse the order of integration, so that it has the form $\int_c^d \int_{p(y)}^{q(y)} f(x,y)\,dx\,dy$. Find $c$, $d$, $p$ and $q$.'
            answer: 'c = 0; d = 4; p = 0; q = sqrt(4 - y)'
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "c"}, {"contract": {"kind": "exact"}, "name": "d"}, {"contract": {"kind": "function", "vars": ["y"]}, "name": "p"}, {"contract": {"kind": "function", "vars": ["y"]}, "name": "q"}]}
            solution_sketch: 'The region is $0 \le x \le 2$ and $0 \le y \le 4 - x^2$. For a fixed $y$ between $0$ and $4$, the value of $x$ runs from $0$ to $\sqrt{4 - y}$. Hence $c = 0$, $d = 4$, $p = 0$, $q = \sqrt{4 - y}$.'
          - problem: 'The integral $\int_0^2 \int_0^{y/2} f(x,y)\,dx\,dy$ is taken over a triangle. Reverse the order of integration, so that it has the form $\int_a^b \int_{g(x)}^{h(x)} f(x,y)\,dy\,dx$. Find $a$, $b$, $g$ and $h$.'
            answer: 'a = 0; b = 1; g = 2x; h = 2'
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "a"}, {"contract": {"kind": "exact"}, "name": "b"}, {"contract": {"kind": "function", "vars": ["x"]}, "name": "g"}, {"contract": {"kind": "function", "vars": ["x"]}, "name": "h"}]}
            solution_sketch: 'The region is $0 \le y \le 2$ and $0 \le x \le \frac{y}{2}$. The condition $x \le \frac{y}{2}$ gives $y \ge 2x$, and $x$ runs from $0$ to $1$. So for a fixed $x$, $y$ runs from $2x$ to $2$: $a = 0$, $b = 1$, $g = 2x$, $h = 2$.'
        constraints: 'regions are triangles or parabola-bounded; both orders are written with exact bounds; two items read a measured plot from its iterated integral; one verdict item checks a reversal'
    diagnostic_exemplar:
      problem: 'Describe the region of $\int_0^2 \int_x^2 f(x, y)\,dy\,dx$, and rewrite the integral with the order of integration reversed.'
      answer: 'The triangle $0 \le x \le y \le 2$ (vertices $(0,0)$, $(0,2)$, $(2,2)$); reversed, $\int_0^2 \int_0^y f(x, y)\,dx\,dy$.'
      answer_contract: {kind: none}
      solution_sketch: 'The given limits are the type I description $0 \le x \le 2$, $x \le y \le 2$. Slicing horizontally instead: $y$ runs over $[0, 2]$ and, for each $y$, $x$ runs from $0$ to $y$.'
    anki_seeds:
      - front: 'Type I vs type II region?'
        back: 'Type I: $a \le x \le b$, $g_1(x) \le y \le g_2(x)$. Type II: $c \le y \le d$, $h_1(y) \le x \le h_2(y)$.'
        type: basic
      - front: 'First step when reversing the order of an iterated integral?'
        back: 'Sketch the region from the given bounds, then re-slice it in the other direction.'
        type: basic

  - id: double-integrals
    name: "Double Integrals over General Regions"
    core: true
    difficulty: 0.72
    drill: false
    answer_kind: numeric
    expected_time_secs: 240
    prerequisites:
      - id: iterated-integrals-rectangles
        weight: 0.8
        key: true
      - id: describing-planar-regions
        weight: 0.7
        key: true
      - id: integration-substitution
        weight: 0.4
        key: false
    knowledge_points:
      - id: kp1
        name: "General regions (type I and type II)"
        key_prerequisites: [iterated-integrals-rectangles, describing-planar-regions]
        exemplars:
          - problem: 'Evaluate $\iint_D x \, dA$, where $D$ is the region bounded by $y = x^2$ and $y = x$.'
            answer: '1/12'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The curves meet at $x = 0$ and $x = 1$, and $x \ge x^2$ there. So the integral is $\int_0^1 \int_{x^2}^{x} x\,dy\,dx = \int_0^1 (x^2 - x^3)\,dx = \frac{1}{3} - \frac{1}{4} = \frac{1}{12}$.'
          - problem: 'Evaluate $\iint_D xy \, dA$, where $D$ is the triangle with vertices $(0,0)$, $(1,0)$ and $(1,1)$.'
            answer: '1/8'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The triangle is $0 \le x \le 1$ and $0 \le y \le x$. The inner integral is $\int_0^x xy\,dy = \frac{x^3}{2}$, and then $\int_0^1 \frac{x^3}{2}\,dx = \frac{1}{8}$.'
          - problem: 'Evaluate $\iint_D y \, dA$, where $D$ is the region bounded by $y = x^2$ and $y = 4$.'
            answer: '128/5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The curves meet at $x = -2$ and $x = 2$. The inner integral is $\int_{x^2}^{4} y\,dy = \frac{16 - x^4}{2}$. Then $\frac{1}{2}\int_{-2}^{2} (16 - x^4)\,dx = \frac{1}{2}\left(64 - \frac{64}{5}\right) = \frac{128}{5}$.'
          - problem: 'A thin plate occupies the region between $y = x^2$ and $y = 2x$, with $x$ and $y$ in metres. Its density at $(x, y)$ is $y$ kilograms per square metre. Find the mass of the plate.'
            answer: '32/15'
            answer_contract: {"kind": "unit", "quantity": "mass", "unit": "kg", "allow_omitted": true}
            solution_sketch: 'The curves meet at $x = 0$ and $x = 2$, and the line is above the parabola. The inner integral is $\int_{x^2}^{2x} y\,dy = 2x^2 - \frac{x^4}{2}$, and then $\int_0^2 \left(2x^2 - \frac{x^4}{2}\right)dx = \frac{16}{3} - \frac{16}{5} = \frac{32}{15}$. The mass is $\frac{32}{15}$ kg.'
          - problem: 'Evaluate $\iint_D 1 \, dA$, where $D$ is the region bounded by $x = y^2$ and $x = 4$.'
            answer: '32/3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Use horizontal slices. The curves meet at $y = -2$ and $y = 2$, and $x$ runs from $y^2$ to $4$. So the integral is $\int_{-2}^{2} (4 - y^2)\,dy = \left[4y - \frac{y^3}{3}\right]_{-2}^{2} = \frac{32}{3}$.'
          - problem: 'A district of a town is the triangle $x \ge 0$, $y \ge 0$, $x + y \le 2$, with $x$ and $y$ in kilometres. The population density at $(x, y)$ is $3x$ thousand people per square kilometre. Find the population of the district, in thousands.'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The population is $\int_0^2 \int_0^{2-x} 3x\,dy\,dx$. The inner integral is $3x(2 - x)$, and then $\int_0^2 (6x - 3x^2)\,dx = 12 - 8 = 4$. The district has $4$ thousand people.'
          - problem: 'The floor of a tank is the region between $x = y^2$ and $x = 4$, with $x$ and $y$ in metres. The floor is covered by a layer of gravel of constant depth $c$ metres. The layer has volume $64$ cubic metres. Find $c$.'
            answer: '6'
            answer_contract: {"kind": "unit", "quantity": "length", "unit": "m", "allow_omitted": true}
            solution_sketch: 'The area of the floor is $\iint_D 1\,dA = \frac{32}{3}$ square metres. The volume is the depth times the area, so $c \cdot \frac{32}{3} = 64$. Dividing by $\frac{32}{3}$ gives $c = 6$ metres.'
          - problem: 'Evaluate $\iint_D xy \, dA$, where $D$ is the region bounded by $y = x^2$, $y = 0$ and $x = 2$.'
            answer: '16/3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The region is $0 \le x \le 2$ and $0 \le y \le x^2$. The inner integral is $\int_0^{x^2} xy\,dy = \frac{x^5}{2}$, and then $\frac{1}{2}\int_0^2 x^5\,dx = \frac{1}{2}\cdot\frac{64}{6} = \frac{16}{3}$.'
          - problem: 'Evaluate $\iint_D x \, dA$, where $D$ is the region bounded by $y = x^2$ and $y = 2x$.'
            answer: '4/3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The curves meet at $x = 0$ and $x = 2$, and the line is above the parabola. So the integral is $\int_0^2 \int_{x^2}^{2x} x\,dy\,dx = \int_0^2 (2x^2 - x^3)\,dx = \frac{16}{3} - 4 = \frac{4}{3}$.'
        constraints: 'regions bounded by lines and one parabola, or by a triangle; intersection points at integer coordinates; two items are density contexts and one asks for a depth from a volume'
      - id: kp2
        name: "Volumes and harder regions"
        key_prerequisites: [iterated-integrals-rectangles, describing-planar-regions]
        exemplars:
          - problem: 'Find the volume under the plane $z = x + y$ and above the triangle $x \ge 0$, $y \ge 0$, $x + y \le 1$.'
            answer: '1/3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The volume is $\int_0^1 \int_0^{1-x} (x + y)\,dy\,dx$. The inner integral is $x(1 - x) + \frac{(1-x)^2}{2}$, and the outer integral is $\frac{1}{6} + \frac{1}{6} = \frac{1}{3}$.'
          - problem: 'Evaluate $\iint_D (2x + y) \, dA$, where $D$ is the region bounded by $y = x^2$ and $y = 4$.'
            answer: '128/5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The region is symmetric about the $y$-axis and $2x$ is odd in $x$, so the $2x$ part integrates to zero. What is left is $\int_{-2}^{2} \frac{16 - x^4}{2}\,dx = \frac{1}{2}\left(64 - \frac{64}{5}\right) = \frac{128}{5}$.'
          - problem: 'Find the volume under the plane $z = 3x + y + 1$ and above the triangle $x \ge 0$, $y \ge 0$, $x + y \le 1$.'
            answer: '7/6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The volume is $\int_0^1 \int_0^{1-x} (3x + y + 1)\,dy\,dx$. The integral of $3x$ is $\frac{1}{2}$, the integral of $y$ is $\frac{1}{6}$, and the integral of $1$ is the area $\frac{1}{2}$. The sum is $\frac{7}{6}$.'
          - problem: 'A mound of sand stands on the triangle $x \ge 0$, $y \ge 0$, $x + y \le 2$, with $x$ and $y$ in metres. The height of the mound above the point $(x, y)$ is $2 - x - y$ metres. Find the volume of sand.'
            answer: '4/3'
            answer_contract: {"kind": "unit", "quantity": "cubic_volume", "unit": "m^3", "allow_omitted": true}
            solution_sketch: 'The volume is $\int_0^2 \int_0^{2-x} (2 - x - y)\,dy\,dx$. The inner integral is $\frac{(2-x)^2}{2}$, and then $\int_0^2 \frac{(2-x)^2}{2}\,dx = \frac{4}{3}$ cubic metres.'
          - problem: 'Evaluate $\iint_D (3x + 2y) \, dA$, where $D$ is the region bounded by $y = x^2$ and $y = 4$.'
            answer: '256/5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The $3x$ part is odd and the region is symmetric about the $y$-axis, so it contributes $0$. The $2y$ part gives twice $\iint_D y\,dA = \frac{128}{5}$, so the value is $\frac{256}{5}$.'
          - problem: 'Evaluate $\iint_D (x + y) \, dA$, where $D$ is the triangle with vertices $(0,0)$, $(2,2)$ and $(0,2)$.'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The triangle is $0 \le x \le 2$ and $x \le y \le 2$. The inner integral is $x(2 - x) + \frac{4 - x^2}{2} = 2 + 2x - \frac{3}{2}x^2$, and then $\int_0^2 \left(2 + 2x - \frac{3}{2}x^2\right)dx = 4 + 4 - 4 = 4$.'
          - problem: 'A heap of gravel has volume $\frac{4}{3}$ cubic metres. It is levelled into a flat layer of constant depth over the triangle with corners $(0,0)$, $(2,0)$ and $(0,2)$, with distances in metres. How deep is the layer?'
            answer: '2/3'
            answer_contract: {"kind": "unit", "quantity": "length", "unit": "m", "allow_omitted": true}
            solution_sketch: 'The triangle has area $\frac{1}{2}(2)(2) = 2$ square metres. A flat layer has volume equal to depth times area, so the depth is $\frac{4/3}{2} = \frac{2}{3}$ metre.'
          - problem: 'A thin plate occupies the region between $y = x^2$ and $y = 1$, with $x$ and $y$ in metres. Its density at $(x, y)$ is $5x + 3y$ kilograms per square metre. Find the mass of the plate.'
            answer: '12/5'
            answer_contract: {"kind": "unit", "quantity": "mass", "unit": "kg", "allow_omitted": true}
            solution_sketch: 'The region is symmetric about the $y$-axis, so the $5x$ part contributes $0$. The $3y$ part gives $3\int_{-1}^{1} \frac{1 - x^4}{2}\,dx = 3 \cdot \frac{4}{5} = \frac{12}{5}$. The mass is $\frac{12}{5}$ kg.'
          - problem: 'Find the volume under the surface $z = x^3 + y$ and above the region between $y = x^2$ and $y = 1$.'
            answer: '4/5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The region is symmetric about the $y$-axis and $x^3$ is odd, so that part gives $0$. The inner integral of $y$ is $\frac{1 - x^4}{2}$, and then $\int_{-1}^{1} \frac{1 - x^4}{2}\,dx = 1 - \frac{1}{5} = \frac{4}{5}$.'
        constraints: 'volume interpretation z = f(x,y) >= 0; symmetric regions where odd terms vanish; answers exact rationals; three items are measured contexts (volume of a mound, depth of a levelled layer, mass of a plate)'
      - id: kp3
        name: "Reversing the order of integration"
        key_prerequisites: [iterated-integrals-rectangles, describing-planar-regions, integration-substitution]
        try_first:
          problem: 'Evaluate $\int_0^1 \int_y^1 6x\,dx\,dy$ by integrating with respect to $y$ first.'
          answer_contract: {"kind": "exact"}
          answer: '2'
          reveal: 'Integrating in $y$ first means describing the same triangle $0 \le y \le x \le 1$ with $y$ on the inside. The integral becomes $\int_0^1 \int_0^x 6x\,dy\,dx = \int_0^1 6x^2\,dx = 2$, the same value as in the original order.'
        exemplars:
          - problem: 'Evaluate $\int_0^1 \int_y^1 e^{x^2} \, dx \, dy$ by reversing the order of integration.'
            answer: '(e - 1)/2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The region is $0 \le y \le x \le 1$. Reversed, the integral is $\int_0^1 \int_0^x e^{x^2}\,dy\,dx = \int_0^1 x e^{x^2}\,dx$. The substitution $u = x^2$ gives $\frac{1}{2}\int_0^1 e^u\,du = \frac{e - 1}{2}$.'
          - problem: 'Evaluate $\int_0^1 \int_x^1 \sin(y^2) \, dy \, dx$ by reversing the order of integration.'
            answer: '(1 - cos(1))/2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The region is $0 \le x \le y \le 1$. Reversed, the integral is $\int_0^1 \int_0^y \sin(y^2)\,dx\,dy = \int_0^1 y \sin(y^2)\,dy$. The substitution $u = y^2$ gives $\frac{1}{2}(1 - \cos 1)$.'
          - problem: 'Evaluate $\int_0^2 \int_{y/2}^{1} e^{x^2} \, dx \, dy$ by reversing the order of integration.'
            answer: 'e - 1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The region $0 \le y \le 2$, $\frac{y}{2} \le x \le 1$ is also $0 \le x \le 1$, $0 \le y \le 2x$. So the integral is $\int_0^1 2x e^{x^2}\,dx$, and the substitution $u = x^2$ gives $\int_0^1 e^u\,du = e - 1$.'
          - problem: 'A thin triangular plate has corners $(0,0)$, $(0,2)$ and $(4,2)$, with distances in metres. Its density at $(x, y)$ is $e^{y^2}$ kilograms per square metre. Find the mass of the plate.'
            answer: 'e^4 - 1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The plate is $0 \le y \le 2$ and $0 \le x \le 2y$, because the long side is the line $y = \frac{x}{2}$. The mass is $\int_0^2 \int_0^{2y} e^{y^2}\,dx\,dy = \int_0^2 2y e^{y^2}\,dy = e^4 - 1$ kilograms.'
          - problem: 'Evaluate $\int_0^2 \int_y^2 e^{x^2} \, dx \, dy$ by reversing the order of integration.'
            answer: '(e^4 - 1)/2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The region is $0 \le y \le x \le 2$. Reversed, the integral is $\int_0^2 \int_0^x e^{x^2}\,dy\,dx = \int_0^2 x e^{x^2}\,dx = \frac{1}{2}(e^4 - 1)$.'
          - problem: 'Evaluate $\int_0^{1/2} \int_{2x}^{1} e^{y^2} \, dy \, dx$ by reversing the order of integration.'
            answer: '(e - 1)/4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The region is $0 \le x \le \frac{1}{2}$, $2x \le y \le 1$, which is also $0 \le y \le 1$, $0 \le x \le \frac{y}{2}$. The integral becomes $\int_0^1 \frac{y}{2} e^{y^2}\,dy = \frac{1}{4}(e - 1)$.'
          - problem: 'A thin triangular plate has corners $(0,0)$, $(0,1)$ and $(2,1)$, with distances in metres. Its density at $(x, y)$ is $\sin(y^2)$ kilograms per square metre. Find the mass of the plate.'
            answer: '1 - cos(1)'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The plate is $0 \le y \le 1$ and $0 \le x \le 2y$. The mass is $\int_0^1 \int_0^{2y} \sin(y^2)\,dx\,dy = \int_0^1 2y \sin(y^2)\,dy = 1 - \cos 1$ kilograms.'
          - problem: 'Evaluate $\int_0^{1/2} \int_{2x}^{1} \sin(y^2) \, dy \, dx$ by reversing the order of integration.'
            answer: '(1 - cos(1))/4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The region is $0 \le y \le 1$, $0 \le x \le \frac{y}{2}$. The integral becomes $\int_0^1 \frac{y}{2}\sin(y^2)\,dy = \frac{1}{4}(1 - \cos 1)$, which is about $0.1149$.'
        constraints: 'the inner integrand has no elementary antiderivative in the given order (e^{x^2}, sin(y^2)); reversal makes it a u-substitution; two items are plate-mass contexts where the learner must choose the order'
    diagnostic_exemplar:
      problem: 'Evaluate $\int_0^1 \int_{3y}^{3} e^{x^2}\,dx\,dy$ by reversing the order of integration.'
      answer: '$\dfrac{e^9 - 1}{6}$'
      answer_contract: {kind: none}
      solution_sketch: 'The region $0 \le y \le 1$, $3y \le x \le 3$ is the triangle $0 \le x \le 3$, $0 \le y \le x/3$. Reversed: $\int_0^3 \int_0^{x/3} e^{x^2}\,dy\,dx = \int_0^3 \frac{x}{3}e^{x^2}\,dx = \frac{1}{6}\left[e^{x^2}\right]_0^3 = \frac{e^9 - 1}{6}$.'
    anki_seeds:
      - front: 'When must you reverse the order of integration in a double integral?'
        back: 'When the inner integrand has no elementary antiderivative in the given order (e.g. $e^{x^2}$, $\sin(y^2)$).'
        type: basic
      - front: 'Geometric meaning of $\iint_D f\, dA$ for $f \ge 0$?'
        back: 'The volume under the surface $z = f(x, y)$ above the region $D$.'
        type: basic

  - id: multivariable-average-value
    name: "Average Value over a Region"
    core: false                # head of the terminal mass/moments application branch
    difficulty: 0.72
    drill: false
    answer_kind: numeric
    expected_time_secs: 150
    prerequisites:
      - id: double-integrals
        weight: 0.7
        key: true
      - id: average-value-function
        weight: 0.5
        key: true
    knowledge_points:
      - id: kp1
        name: "Average value over rectangles"
        key_prerequisites: [double-integrals, average-value-function]
        try_first:
          problem: 'A rectangular plate measures $2$ m by $3$ m. Its total mass of $18$ kg is spread over the plate. How many kilograms is that per square metre?'
          answer_contract: {"kind": "exact"}
          answer: '3'
          reveal: 'The mass per square metre is the total divided by the area, $\frac{18}{6} = 3$. The average value of a function over a region is built the same way: the double integral divided by the area.'
        exemplars:
          - problem: 'Find the average value of $f(x, y) = xy$ over $R = [0,2] \times [0,4]$.'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The area of $R$ is $2 \cdot 4 = 8$. The integral is $\left(\int_0^2 x\,dx\right)\left(\int_0^4 y\,dy\right) = 2 \cdot 8 = 16$. The average is $\frac{16}{8} = 2$.'
          - problem: 'Find the average value of $f(x, y) = x^2$ over $R = [0,3] \times [0,1]$.'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The area of $R$ is $3$. The integral is $\int_0^3 x^2\,dx \cdot \int_0^1 dy = 9 \cdot 1 = 9$. The average is $\frac{9}{3} = 3$.'
          - problem: 'A rectangular plate covers $0 \le x \le 3$ and $0 \le y \le 2$, with $x$ and $y$ in metres. Its density at $(x, y)$ is $x + y^2$ kilograms per square metre. Find the average density of the plate, in kilograms per square metre.'
            answer: '17/6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The total mass is $\int_0^3 \int_0^2 (x + y^2)\,dy\,dx = \int_0^3 \left(2x + \frac{8}{3}\right)dx = 9 + 8 = 17$ kg. The area is $6$ square metres, so the average density is $\frac{17}{6}$.'
          - problem: 'Find the average value of $f(x, y) = x y^2$ over the rectangle $R = [0,1] \times [0,2]$.'
            answer: '2/3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The area is $2$. The integral is $\left(\int_0^1 x\,dx\right)\left(\int_0^2 y^2\,dy\right) = \frac{1}{2}\cdot\frac{8}{3} = \frac{4}{3}$. The average is $\frac{4/3}{2} = \frac{2}{3}$.'
          - problem: 'The temperature at the point $(x, y)$ of a rectangular plate $R = [0,1] \times [0,3]$ is $T(x, y) = x^2 y$ degrees Celsius. Find the average temperature of the plate.'
            answer: '1/2'
            answer_contract: {"kind": "unit", "quantity": "temperature", "unit": "°C", "allow_omitted": true}
            solution_sketch: 'The area is $3$. The integral is $\left(\int_0^1 x^2\,dx\right)\left(\int_0^3 y\,dy\right) = \frac{1}{3}\cdot\frac{9}{2} = \frac{3}{2}$. The average is $\frac{3/2}{3} = \frac{1}{2}$ degree Celsius.'
          - problem: 'Find the average value of $f(x, y) = x^2 y^2$ over the rectangle $R = [0,1] \times [0,2]$.'
            answer: '4/9'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The area is $2$. The integral is $\left(\int_0^1 x^2\,dx\right)\left(\int_0^2 y^2\,dy\right) = \frac{1}{3}\cdot\frac{8}{3} = \frac{8}{9}$. The average is $\frac{8/9}{2} = \frac{4}{9}$.'
          - problem: 'A rectangular steel plate measures $6$ m by $4$ m. Its average density is $2.5$ kilograms per square metre. Find the mass of the plate.'
            answer: '60'
            answer_contract: {"kind": "unit", "quantity": "mass", "unit": "kg", "allow_omitted": true}
            solution_sketch: 'The average density is the total mass divided by the area. So the mass is the average times the area: $2.5 \cdot 24 = 60$ kg.'
          - problem: 'Let $R = [0,2] \times [0,3]$. The function $f(x, y) = c x y$ has average value $6$ over $R$. Find the constant $c$.'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The integral of $xy$ over $R$ is $2 \cdot \frac{9}{2} = 9$ and the area is $6$, so the average of $cxy$ is $\frac{9c}{6} = \frac{3c}{2}$. Setting $\frac{3c}{2} = 6$ gives $c = 4$.'
          - problem: 'Find the average value of $f(x, y) = y^3$ over the rectangle $R = [0,2] \times [0,1]$.'
            answer: '1/4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The area is $2$. The integral is $\left(\int_0^2 dx\right)\left(\int_0^1 y^3\,dy\right) = 2 \cdot \frac{1}{4} = \frac{1}{2}$. The average is $\frac{1/2}{2} = \frac{1}{4}$.'
        constraints: 'separable integrands over small-integer rectangles; averages are integers or simple fractions; two items are contexts that divide a total by an area (average density, average temperature) and one multiplies an average by an area'
      - id: kp2
        name: "Average value over general regions"
        key_prerequisites: [double-integrals, average-value-function]
        exemplars:
          - problem: 'Find the average value of $f(x, y) = x$ over the triangle with vertices $(0,0)$, $(2,0)$ and $(2,2)$.'
            answer: '4/3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The area is $2$. The integral is $\int_0^2 \int_0^x x\,dy\,dx = \int_0^2 x^2\,dx = \frac{8}{3}$. The average is $\frac{8/3}{2} = \frac{4}{3}$.'
          - problem: 'Find the average value of $f(x, y) = y$ over the triangle with vertices $(0,0)$, $(1,0)$ and $(0,1)$.'
            answer: '1/3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The area is $\frac{1}{2}$. The integral is $\int_0^1 \frac{(1-x)^2}{2}\,dx = \frac{1}{6}$. The average is $\frac{1/6}{1/2} = \frac{1}{3}$.'
          - problem: 'A triangular metal plate has corners $(0,0)$, $(6,0)$ and $(0,6)$, with distances in metres. The temperature at $(x, y)$ is $x + 2y$ degrees Celsius. Find the average temperature of the plate.'
            answer: '6'
            answer_contract: {"kind": "unit", "quantity": "temperature", "unit": "°C", "allow_omitted": true}
            solution_sketch: 'The area is $\frac{1}{2}(6)(6) = 18$. The integral is $\int_0^6 \int_0^{6-x} (x + 2y)\,dy\,dx = 108$. The average is $\frac{108}{18} = 6$ degrees Celsius.'
          - problem: 'Find the average value of $f(x, y) = x^2$ over the triangle with vertices $(0,0)$, $(2,0)$ and $(0,2)$.'
            answer: '2/3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The area is $2$. The integral is $\int_0^2 \int_0^{2-x} x^2\,dy\,dx = \int_0^2 (2x^2 - x^3)\,dx = \frac{4}{3}$. The average is $\frac{4/3}{2} = \frac{2}{3}$.'
          - problem: 'Find the average value of $f(x, y) = y$ over the region between $y = x^2$ and $y = 4$.'
            answer: '12/5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The integral is $\iint_D y\,dA = \frac{128}{5}$. The area is $\int_{-2}^{2} (4 - x^2)\,dx = \frac{32}{3}$. The average is $\frac{128/5}{32/3} = \frac{12}{5}$.'
          - problem: 'A triangular plate has corners $(0,0)$, $(4,0)$ and $(0,3)$, with distances in metres. Its average density is $2$ kilograms per square metre. Find the mass of the plate.'
            answer: '12'
            answer_contract: {"kind": "unit", "quantity": "mass", "unit": "kg", "allow_omitted": true}
            solution_sketch: 'The area of the triangle is $\frac{1}{2}(4)(3) = 6$ square metres. The mass is the average density times the area: $2 \cdot 6 = 12$ kg.'
          - problem: 'Find the average value of $f(x, y) = x + y$ over the triangle with vertices $(0,0)$, $(6,0)$ and $(0,3)$.'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The area is $\frac{1}{2}(6)(3) = 9$. The integral is $\int_0^6 \int_0^{3 - x/2} (x + y)\,dy\,dx = 27$. The average is $\frac{27}{9} = 3$.'
          - problem: 'Find the average value of $f(x, y) = x$ over the triangle with vertices $(0,0)$, $(3,0)$ and $(3,3)$.'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The average divides by the area, not by a side length. The triangle has area $\frac{1}{2}(3)(3) = \frac{9}{2}$. So the average is $\frac{9}{9/2} = 2$.'
          - problem: 'Find the average value of $f(x, y) = xy$ over the triangle with vertices $(0,0)$, $(3,0)$ and $(0,2)$.'
            answer: '1/2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The area is $3$. The integral is $\int_0^3 \int_0^{2 - 2x/3} xy\,dy\,dx = \frac{3}{2}$. The average is $\frac{3/2}{3} = \frac{1}{2}$.'
          - problem: 'Find the average value of $f(x, y) = x^2 y$ over the triangle with vertices $(0,0)$, $(3,0)$ and $(0,2)$.'
            answer: '3/5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The area is $3$. The integral is $\int_0^3 \int_0^{2 - 2x/3} x^2 y\,dy\,dx = \frac{9}{5}$. The average is $\frac{9/5}{3} = \frac{3}{5}$.'
        constraints: 'triangular regions with integer vertices, plus one region between a parabola and a line; divide by the AREA, not by a side length; contexts include an average temperature and a mass from an average density'
    diagnostic_exemplar:
      problem: 'Find the average value of $f(x, y) = x + y$ over the triangle with vertices $(0,0)$, $(2,0)$, $(0,2)$.'
      answer: '$\dfrac{4}{3}$'
      answer_contract: {kind: none}
      solution_sketch: 'The triangle has area $2$. By symmetry $\iint (x+y)\,dA = 2\iint x\,dA = 2\int_0^2 x(2 - x)\,dx = 2\left(4 - \tfrac{8}{3}\right) = \tfrac{8}{3}$, so the average is $\tfrac{8}{3} \div 2 = \tfrac{4}{3}$.'
    anki_seeds:
      - front: 'Average value of $f$ over a plane region $D$?'
        back: '$\bar{f} = \dfrac{1}{\operatorname{Area}(D)} \iint_D f \, dA$'
        type: basic
      - front: 'When averaging $f$ over a region $D$, what exactly do you divide the integral by?'
        back: 'By $\operatorname{Area}(D) = \iint_D 1\, dA$ — never by a side length, a radius, or the length of an interval.'
        type: basic

  - id: double-integral-applications
    name: "Mass, Moments, and Centroids"
    core: false                # mass, moments and centroids application; terminal
    difficulty: 0.76
    drill: false
    answer_kind: numeric
    expected_time_secs: 240
    prerequisites:
      - id: double-integrals
        weight: 0.8
        key: true
      - id: multivariable-average-value
        weight: 0.4
        key: false
    knowledge_points:
      - id: kp1
        name: "Mass of a lamina"
        key_prerequisites: [double-integrals]
        exemplars:
          - problem: 'Find the mass of the lamina occupying the rectangle $0 \le x \le 1$, $0 \le y \le 2$ with density $\rho(x,y) = 3x + y$.'
            answer: '5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The mass is $\int_0^1\int_0^2 (3x+y)\,dy\,dx$. The inner integral is $6x+2$. Then $\int_0^1 (6x+2)\,dx = 3+2 = 5$.'
          - problem: 'Find the mass of the triangular lamina with vertices $(0,0)$, $(2,0)$ and $(0,1)$ and density $\rho(x,y) = 2x + y$.'
            answer: '5/3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The triangle is $0 \le x \le 2$, $0 \le y \le 1 - x/2$. Integrating $2x+y$ in $y$ and then in $x$ gives $3 - \tfrac{7}{3} + 1 = \tfrac{5}{3}$.'
          - problem: 'A thin metal plate occupies the square $0 \le x \le 2$, $0 \le y \le 2$, with $x$ and $y$ in metres. At the point $(x,y)$ its density is $x + y$ kilograms per square metre. What is the mass of the plate?'
            answer: '8'
            answer_contract: {"kind":"unit","quantity":"mass","unit":"kg","allow_omitted":true}
            solution_sketch: 'The mass is the integral of the density over the plate. We get $\int_0^2\int_0^2 (x+y)\,dy\,dx = \int_0^2 (2x+2)\,dx = 4+4 = 8$ kilograms.'
          - problem: 'A lamina occupies the rectangle $0 \le x \le 2$, $0 \le y \le 3$. Its density is $\rho(x,y) = kx$ for a constant $k$, and its mass is $18$. Find $k$.'
            answer: '3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The mass is $\int_0^2\int_0^3 kx\,dy\,dx = 3k \cdot 2 = 6k$. Setting $6k = 18$ and dividing by $6$ gives $k = 3$.'
          - problem: 'Find the mass of the triangular lamina with vertices $(0,0)$, $(3,0)$ and $(0,2)$ and density $\rho(x,y) = xy$.'
            answer: '3/2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The triangle is $0 \le x \le 3$, $0 \le y \le 2 - 2x/3$. The inner integral is $\tfrac{x}{2}(2-\tfrac{2x}{3})^2$, and the outer integral then gives $\tfrac{3}{2}$.'
          - problem: 'Find the mass of the triangular lamina with vertices $(0,0)$, $(1,0)$ and $(1,1)$ and density $\rho(x,y) = 2xy$.'
            answer: '1/4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The triangle is $0 \le x \le 1$, $0 \le y \le x$. The inner integral is $\int_0^x 2xy\,dy = x^3$, so the mass is $\int_0^1 x^3\,dx = \tfrac{1}{4}$.'
          - problem: 'A rectangular sheet occupies $0 \le x \le 2$, $0 \le y \le 1$, with lengths in metres. Its density is $1 + y^2$ kilograms per square metre. How heavy is the sheet?'
            answer: '8/3'
            answer_contract: {"kind":"unit","quantity":"mass","unit":"kg","allow_omitted":true}
            solution_sketch: 'The mass is $\int_0^2\int_0^1 (1+y^2)\,dy\,dx$. The inner integral is $1 + \tfrac13 = \tfrac43$. Multiplying by the width $2$ gives $\tfrac{8}{3}$ kilograms.'
          - problem: 'A rectangular plate of area $4$ square metres has a total mass of $10$ kilograms. What is its average density in kilograms per square metre?'
            answer: '5/2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Average density is total mass divided by area, because mass equals average density times area. So $10 \div 4 = \tfrac{5}{2}$ kilograms per square metre.'
        constraints: "density polynomial of degree at most 2; rectangles or triangles with integer vertices; masses exact rationals"
      - id: kp2
        name: "Moments about the axes"
        key_prerequisites: [double-integrals]
        exemplars:
          - problem: 'A lamina occupies the rectangle $0 \le x \le 3$, $0 \le y \le 2$ and has constant density $\rho = 1$. Find its moment $M_y$ about the $y$-axis.'
            answer: '9'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The moment about the $y$-axis is $M_y = \iint x\rho\,dA$. Here it is $\int_0^3 x\,dx \cdot \int_0^2 dy = \tfrac{9}{2}\cdot 2 = 9$.'
          - problem: 'A lamina occupies the rectangle $0 \le x \le 4$, $0 \le y \le 1$ and has constant density $\rho = 1$. Find its moment $M_x$ about the $x$-axis.'
            answer: '2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The moment about the $x$-axis is $M_x = \iint y\rho\,dA$. Here it is $\int_0^4 dx \cdot \int_0^1 y\,dy = 4\cdot\tfrac{1}{2} = 2$.'
          - problem: 'A lamina occupies the square $0 \le x \le 2$, $0 \le y \le 2$ and has density $\rho(x,y) = x$. Find its moment $M_x$ about the $x$-axis.'
            answer: '4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The moment is $M_x = \iint y\rho\,dA = \int_0^2 x\,dx \cdot \int_0^2 y\,dy$. Each factor equals $2$, so $M_x = 4$.'
          - problem: 'A lamina occupies the square $0 \le x \le 1$, $0 \le y \le 1$ and has density $\rho(x,y) = x + y$. Find its moment $M_y$ about the $y$-axis.'
            answer: '7/12'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The moment is $M_y = \iint x(x+y)\,dA = \int_0^1\int_0^1 (x^2 + xy)\,dy\,dx$. The inner integral is $x^2 + \tfrac{x}{2}$, and the outer integral gives $\tfrac13 + \tfrac14 = \tfrac{7}{12}$.'
          - problem: 'A lamina occupies the rectangle $0 \le x \le 1$, $0 \le y \le 2$ and has density $\rho(x,y) = x + y$. Find its moment $M_x$ about the $x$-axis.'
            answer: '11/3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The moment is $M_x = \iint y(x+y)\,dA = \int_0^1\int_0^2 (xy + y^2)\,dy\,dx$. The inner integral is $2x + \tfrac83$, and the outer integral gives $1 + \tfrac83 = \tfrac{11}{3}$.'
          - problem: 'A rectangular plate occupies $0 \le x \le 4$, $0 \le y \le 1$, with lengths in metres, and has constant density $3$ kilograms per square metre. Find its moment $M_y$ about the $y$-axis, in kilogram-metres.'
            answer: '24'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The moment about the $y$-axis weights the density by $x$, so $M_y = \iint 3x\,dA$. The integrand depends on $x$ alone and the limits are constants, so $M_y = 3\int_0^4 x\,dx \cdot \int_0^1 dy = 3 \cdot 8 \cdot 1 = 24$ kilogram-metres.'
          - problem: 'A plate has mass $2$ kilograms and moment $M_y = \tfrac{8}{3}$ kilogram-metres about the $y$-axis. How far from the $y$-axis is its centre of mass?'
            answer: '4/3'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'The centre of mass is at $\bar{x} = M_y/m$, because the moment equals mass times distance. So $\bar{x} = \tfrac{8}{3} \div 2 = \tfrac{4}{3}$ metres.'
          - problem: 'A plate has mass $5$ kilograms and moment $M_x = 15$ kilogram-metres about the $x$-axis. How far above the $x$-axis is its centre of mass?'
            answer: '3'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'The distance is $\bar{y} = M_x/m$, because the moment equals mass times distance. So $\bar{y} = 15 \div 5 = 3$ metres.'
          - problem: 'Find the moment $M_x$ of the lamina on $0 \le x \le 2$, $0 \le y \le 1$ with density $\rho(x,y) = x$.'
            answer: '1'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The moment about the $x$-axis weights the density by $y$, not $x$. So $M_x = \iint y\rho\,dA = \int_0^2 x\,dx \cdot \int_0^1 y\,dy = 2\cdot\tfrac12 = 1$.'
        constraints: "M_y integrates x*rho, M_x integrates y*rho; rectangles only; answers exact rationals"
      - id: kp3
        name: "Center of mass and centroids"
        key_prerequisites: [double-integrals]
        try_first:
          problem: 'A uniform plate occupies the square $0 \le x \le 2$, $0 \le y \le 2$. What is the $x$-coordinate of its centre of mass?'
          answer_contract: {"kind":"exact"}
          answer: '1'
          reveal: 'The square is symmetric about the line $x = 1$, so its centre of mass lies on that line. Symmetry can give a coordinate of the centroid before any integral is set up.'
        exemplars:
          - problem: 'Find the centre of mass of the lamina occupying $0 \le x \le 3$, $0 \le y \le 2$ with density $\rho(x,y) = x$.'
            answer: '(2, 1)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'The mass is $m = 9$. The moments are $M_y = \iint x^2\,dA = 18$ and $M_x = \iint xy\,dA = 9$. So $\bar x = 18/9 = 2$ and $\bar y = 9/9 = 1$.'
          - problem: 'Find the centroid of the triangle with vertices $(0,0)$, $(3,0)$ and $(0,2)$.'
            answer: '(1, 2/3)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'The area is $3$. The moments are $\iint x\,dA = 3$ and $\iint y\,dA = 2$. So $\bar x = 3/3 = 1$ and $\bar y = 2/3$.'
          - problem: 'Find the centroid of the region bounded above by the parabola $y = 4 - x^2$ and below by the $x$-axis.'
            answer: '(0, 8/5)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'The region is symmetric about the $y$-axis, so $\bar x = 0$. The area is $\tfrac{32}{3}$ and $\iint y\,dA = \tfrac{256}{15}$, so $\bar y = \tfrac{256}{15} \cdot \tfrac{3}{32} = \tfrac{8}{5}$.'
          - problem: 'Find the centre of mass of the lamina occupying $0 \le x \le 1$, $0 \le y \le 1$ with density $\rho(x,y) = x + y$.'
            answer: '(7/12, 7/12)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'The mass is $m = 1$. The moments are $M_y = \tfrac{7}{12}$ and, by the symmetry of the density in $x$ and $y$, $M_x = \tfrac{7}{12}$. So the centre of mass is $(\tfrac{7}{12}, \tfrac{7}{12})$.'
          - problem: 'Find the centroid of the region lying between the curves $y = x^2$ and $y = x$.'
            answer: '(1/2, 2/5)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'The curves meet at $x = 0$ and $x = 1$, and the area is $\tfrac16$. The moments are $\iint x\,dA = \tfrac{1}{12}$ and $\iint y\,dA = \tfrac{1}{15}$. So $\bar x = \tfrac12$ and $\bar y = \tfrac25$.'
          - problem: 'A plate has mass $6$ kilograms, moment $M_y = 15$ kilogram-metres about the $y$-axis and moment $M_x = 9$ kilogram-metres about the $x$-axis. Where is its centre of mass?'
            answer: '(5/2, 3/2)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'The centre of mass is $(M_y/m,\; M_x/m)$, because each moment equals mass times distance. So $\bar x = 15/6 = \tfrac52$ and $\bar y = 9/6 = \tfrac32$.'
          - problem: 'A triangular sign has corners at $(0,0)$, $(6,0)$ and $(0,3)$, with lengths in metres, and it has the same thickness everywhere. At which point must a single support be placed so that the sign balances?'
            answer: '(2, 1)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'The sign balances at its centroid, because its density is uniform. The area is $9$, with $\iint x\,dA = 18$ and $\iint y\,dA = 9$. So $\bar x = 18/9 = 2$ and $\bar y = 9/9 = 1$.'
          - problem: 'Find the centre of mass of the lamina occupying $0 \le x \le 1$, $0 \le y \le 1$ with density $\rho(x,y) = y$.'
            answer: '(1/2, 2/3)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'The mass is $\tfrac12$. The moments are $M_y = \iint xy\,dA = \tfrac14$ and $M_x = \iint y^2\,dA = \tfrac13$. So $\bar x = \tfrac12$ and $\bar y = \tfrac23$.'
        constraints: "use symmetry when available; centroids/centers have small rational coordinates"
    diagnostic_exemplar:
      problem: 'Find the centre of mass of the lamina occupying $[0, 2] \times [0, 1]$ with density $\rho(x, y) = x$.'
      answer: '$\left(\dfrac{4}{3},\; \dfrac{1}{2}\right)$'
      answer_contract: {kind: none}
      solution_sketch: '$m = \int_0^2\!\int_0^1 x\,dy\,dx = 2$; $M_y = \int_0^2\!\int_0^1 x^2\,dy\,dx = \tfrac{8}{3}$; $M_x = \int_0^2\!\int_0^1 xy\,dy\,dx = 1$. Hence $\bar x = \tfrac{8}{3}/2 = \tfrac{4}{3}$ and $\bar y = 1/2$.'
    anki_seeds:
      - front: 'Center of mass formulas for a lamina with density $\rho$?'
        back: '$\bar{x} = \frac{M_y}{m} = \frac{1}{m}\iint x\rho\, dA$, $\;\bar{y} = \frac{M_x}{m} = \frac{1}{m}\iint y\rho\, dA$.'
        type: basic
      - front: 'What is the centroid of a region?'
        back: 'The center of mass with constant density — the geometric center $\left(\frac{1}{A}\iint x\, dA, \frac{1}{A}\iint y\, dA\right)$.'
        type: basic

  - id: double-integrals-polar
    name: "Double Integrals in Polar Coordinates"
    core: true
    difficulty: 0.75
    drill: false
    answer_kind: numeric
    expected_time_secs: 180
    prerequisites:
      - id: double-integrals
        weight: 0.8
        key: true
      - id: polar-coordinates
        weight: 0.6
        key: true
      - id: polar-area
        weight: 0.5
        key: true
      - id: unit-circle
        weight: 0.3
        key: false
    knowledge_points:
      - id: kp1
        name: "Converting and evaluating over disks"
        key_prerequisites: [double-integrals, polar-coordinates]
        try_first:
          problem: 'Is $\int_0^{2\pi}\int_0^1 1\,dr\,d\theta$ equal to the area of the unit disk?'
          answer_contract: {"kind":"label","options":[["yes","it is","correct"],["no","it is not","incorrect"]]}
          answer: 'no'
          reveal: 'The integral equals $2\pi$, but the area of the unit disk is $\pi$. In polar coordinates the area element is $r\,dr\,d\theta$, so the integrand must carry the factor $r$.'
        exemplars:
          - problem: 'Evaluate $\iint_D (x^2 + y^2)\,dA$, where $D$ is the disk $x^2 + y^2 \le 4$.'
            answer: '8*pi'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'In polar coordinates the disk is $0 \le r \le 2$, $0 \le \theta \le 2\pi$, and $x^2+y^2 = r^2$. So the integral is $\int_0^{2\pi}\int_0^2 r^3\,dr\,d\theta = 4 \cdot 2\pi = 8\pi$.'
          - problem: 'Evaluate $\iint_D (x^2 + y^2)\,dA$, where $D$ is the annulus $1 \le x^2 + y^2 \le 4$.'
            answer: '15*pi/2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The annulus is $1 \le r \le 2$. So the integral is $\int_0^{2\pi}\int_1^2 r^3\,dr\,d\theta = \tfrac{15}{4}\cdot 2\pi = \tfrac{15\pi}{2}$.'
          - problem: 'Evaluate $\iint_D e^{-(x^2+y^2)}\,dA$, where $D$ is the disk $x^2 + y^2 \le 1$.'
            answer: 'pi*(1 - e^(-1))'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'In polar coordinates the integrand is $e^{-r^2}$. The inner integral is $\int_0^1 r e^{-r^2}\,dr = \tfrac12(1 - e^{-1})$, and multiplying by $2\pi$ gives $\pi(1 - e^{-1})$.'
          - problem: 'A circular plate occupies the disk $x^2 + y^2 \le 4$, with lengths in metres. At the point $(x,y)$ its density is $9 - x^2 - y^2$ kilograms per square metre. What is the mass of the plate?'
            answer: '28*pi'
            answer_contract: {"kind":"unit","quantity":"mass","unit":"kg","allow_omitted":true}
            solution_sketch: 'The mass is $\iint (9 - r^2)\,dA = \int_0^{2\pi}\int_0^2 (9 - r^2)\,r\,dr\,d\theta$. The inner integral is $18 - 4 = 14$, so the mass is $28\pi$ kilograms.'
          - problem: 'What is the average value of $f(x,y) = x^2 + y^2$ over the disk $x^2 + y^2 \le 4$?'
            answer: '2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The average value is the integral divided by the area. The integral is $8\pi$ and the area of the disk is $4\pi$, so the average value is $8\pi \div 4\pi = 2$.'
          - problem: 'Evaluate $\iint_D (x^2 + y^2)^3\,dA$, where $D$ is the disk $x^2 + y^2 \le 4$.'
            answer: '64*pi'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The integrand is $r^6$, so the integral is $\int_0^{2\pi}\int_0^2 r^7\,dr\,d\theta$. The inner integral is $\tfrac{2^8}{8} = 32$, and multiplying by $2\pi$ gives $64\pi$.'
          - problem: 'Evaluate $\iint_D (x^2 + y^2)\,dA$ over the disk $x^2 + y^2 \le 1$.'
            answer: 'pi/2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The area element is $r\,dr\,d\theta$, so the integrand gets the extra factor $r$. The integral is $\int_0^{2\pi}\int_0^1 r^3\,dr\,d\theta = \tfrac14 \cdot 2\pi = \tfrac{\pi}{2}$.'
          - problem: 'Evaluate $\iint_D \sqrt{x^2 + y^2}\,dA$, where $D$ is the disk $x^2 + y^2 \le 9$.'
            answer: '18*pi'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The integrand is $r$, so the integral is $\int_0^{2\pi}\int_0^3 r^2\,dr\,d\theta$. The inner integral is $\tfrac{27}{3} = 9$, and multiplying by $2\pi$ gives $18\pi$.'
        constraints: "integrands are functions of x^2+y^2; disks or annuli centered at the origin; radii small integers"
      - id: kp2
        name: "Areas and volumes via polar"
        key_prerequisites: [double-integrals, polar-coordinates, polar-area]
        exemplars:
          - problem: 'Find the area enclosed by the cardioid $r = 2 + 2\sin\theta$.'
            answer: '6*pi'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The cardioid is traced once for $0 \le \theta \le 2\pi$, so the area is $\tfrac12\int_0^{2\pi} (2+2\sin\theta)^2\,d\theta = \tfrac12\int_0^{2\pi}(4 + 8\sin\theta + 4\sin^2\theta)\,d\theta$. The three terms integrate to $8\pi$, $0$ and $4\pi$, so this equals $\tfrac12(8\pi + 0 + 4\pi) = 6\pi$.'
          - problem: 'Find the volume of the solid under the paraboloid $z = 4 - x^2 - y^2$ and above the $xy$-plane.'
            answer: '8*pi'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The paraboloid meets $z = 0$ on the circle $r = 2$. So $V = \int_0^{2\pi}\int_0^2 (4 - r^2)\,r\,dr\,d\theta = 4 \cdot 2\pi = 8\pi$.'
          - problem: 'Find the area of the region enclosed by the circle $r = 4\sin\theta$.'
            answer: '4*pi'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The circle is traced once for $0 \le \theta \le \pi$. So the area is $\tfrac12\int_0^{\pi} 16\sin^2\theta\,d\theta = 8 \cdot \tfrac{\pi}{2} = 4\pi$.'
          - problem: 'A sprinkler waters the region enclosed by the curve $r = 2 + \cos\theta$, where $r$ is in metres. What area does it water?'
            answer: '9*pi/2'
            answer_contract: {"kind":"unit","quantity":"area","unit":"m^2","allow_omitted":true}
            solution_sketch: 'The curve is traced once for $0 \le \theta \le 2\pi$, so the area is $\tfrac12\int_0^{2\pi}(2+\cos\theta)^2\,d\theta$. The terms $4$, $4\cos\theta$ and $\cos^2\theta$ integrate to $8\pi$, $0$ and $\pi$, so the area is $\tfrac12(8\pi + 0 + \pi) = \tfrac{9\pi}{2}$ square metres.'
          - problem: 'A mound of soil has height $z = 20 - 5x^2 - 5y^2$ metres above level ground at the point $(x,y)$, where $x$ and $y$ are in metres, and the mound ends where $z = 0$. What is the volume of the mound?'
            answer: '40*pi'
            answer_contract: {"kind":"unit","quantity":"cubic_volume","unit":"m^3","allow_omitted":true}
            solution_sketch: 'The height is zero on the circle $r = 2$. So $V = \int_0^{2\pi}\int_0^2 (20 - 5r^2)\,r\,dr\,d\theta = 20 \cdot 2\pi = 40\pi$ cubic metres.'
          - problem: 'A cylinder has the same base as the solid under $z = 4 - x^2 - y^2$ above the $xy$-plane and the same volume as that solid. What is the height of the cylinder?'
            answer: '2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The solid has volume $8\pi$ and its base is the disk $r \le 2$ of area $4\pi$. Height equals volume divided by base area, so the height is $8\pi \div 4\pi = 2$.'
          - problem: 'Find the area of one petal of the rose $r = 2\cos 2\theta$, the petal that is centred on the positive $x$-axis.'
            answer: 'pi/2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'That petal is traced for $-\tfrac{\pi}{4} \le \theta \le \tfrac{\pi}{4}$. So the area is $\tfrac12\int_{-\pi/4}^{\pi/4} 4\cos^2 2\theta\,d\theta = 2 \cdot \tfrac{\pi}{4} = \tfrac{\pi}{2}$.'
          - problem: 'Find the volume of the solid under the cone $z = 3 - \sqrt{x^2 + y^2}$ and above the $xy$-plane.'
            answer: '9*pi'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The cone meets $z = 0$ on the circle $r = 3$, and the height is $3 - r$. So $V = \int_0^{2\pi}\int_0^3 (3 - r)\,r\,dr\,d\theta = \tfrac92 \cdot 2\pi = 9\pi$.'
        constraints: "cardioids/circles for area; paraboloid caps for volume; answers exact multiples of pi"
    diagnostic_exemplar:
      problem: 'Find the volume of the solid lying under the paraboloid $z = 16 - x^2 - y^2$ and above the $xy$-plane.'
      answer: '$128\pi$'
      solution_sketch: 'The paraboloid meets $z = 0$ on the circle $r = 4$, so $V = \int_0^{2\pi}\!\int_0^4 (16 - r^2)\,r\,dr\,d\theta = 2\pi\left[8r^2 - \tfrac{r^4}{4}\right]_0^4 = 2\pi(128 - 64) = 128\pi$.'
    anki_seeds:
      - front: 'Area element in polar coordinates?'
        back: '$dA = r \, dr \, d\theta$ — never forget the extra factor $r$.'
        type: basic
      - front: 'When should a double integral be converted to polar?'
        back: 'When the region is a disk/annulus/sector or the integrand involves $x^2 + y^2$.'
        type: basic

  - id: surface-area-double-integrals
    name: "Surface Area via Double Integrals"
    core: true
    difficulty: 0.80
    drill: false
    answer_kind: numeric
    expected_time_secs: 240
    prerequisites:
      - id: double-integrals
        weight: 0.7
        key: true
      - id: partial-derivatives
        weight: 0.5
        key: true
      - id: double-integrals-polar
        weight: 0.5
        key: true
    knowledge_points:
      - id: kp1
        name: "The surface-area formula and planes"
        key_prerequisites: [double-integrals, partial-derivatives]
        try_first:
          problem: 'The part of the plane $z = x$ lies over the square $0 \le x \le 1$, $0 \le y \le 1$. Is the area of this part greater than $1$?'
          answer_contract: {"kind":"label","options":[["yes","it is","correct"],["no","it is not","incorrect"]]}
          answer: 'yes'
          reveal: 'The plane is tilted, so it covers more area than its base: the area is $\sqrt{2}$. The factor $\sqrt{1+f_x^2+f_y^2}$ measures this tilt.'
        exemplars:
          - problem: 'Find the area of the part of the plane $z = 2x + 2y$ that lies over the square $0 \le x \le 1$, $0 \le y \le 1$.'
            answer: '3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Here $f_x = f_y = 2$, so $\sqrt{1+f_x^2+f_y^2} = \sqrt{9} = 3$. The base has area $1$, so the area is $3 \cdot 1 = 3$.'
          - problem: 'Find the area of the part of the plane $z = 3 - x - y$ that lies over the triangle $x \ge 0$, $y \ge 0$, $x + y \le 1$.'
            answer: 'sqrt(3)/2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Here $f_x = f_y = -1$, so the factor is $\sqrt{3}$. The triangle has area $\tfrac12$, so the area is $\tfrac{\sqrt{3}}{2}$.'
          - problem: 'Find the area of the part of the plane $z = x + 2y$ that lies over the rectangle $0 \le x \le 2$, $0 \le y \le 3$.'
            answer: '6*sqrt(6)'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Here $f_x = 1$ and $f_y = 2$, so the factor is $\sqrt{6}$. The rectangle has area $6$, so the area is $6\sqrt{6}$.'
          - problem: 'Find the area of the part of the plane $z = 5 - 2x + y$ that lies over the triangle $x \ge 0$, $y \ge 0$, $x + y \le 2$.'
            answer: '2*sqrt(6)'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Here $f_x = -2$ and $f_y = 1$, so the factor is $\sqrt{6}$. The triangle has area $2$, so the area is $2\sqrt{6}$.'
          - problem: 'A roof is the part of the plane $z = x/2$ above a rectangular floor $0 \le x \le 8$, $0 \le y \le 6$, with lengths in metres. How many square metres of roofing does it need?'
            answer: '24*sqrt(5)'
            answer_contract: {"kind":"unit","quantity":"area","unit":"m^2","allow_omitted":true}
            solution_sketch: 'Here $f_x = \tfrac12$ and $f_y = 0$, so the factor is $\sqrt{1 + \tfrac14} = \tfrac{\sqrt5}{2}$. The floor has area $48$, so the roof has area $24\sqrt{5}$ square metres.'
          - problem: 'A flat roof panel lies in the plane $z = 2x + 2y$, with lengths in metres, and its surface area is $27$ square metres. What is the area of the floor directly beneath the panel?'
            answer: '9'
            answer_contract: {"kind":"unit","quantity":"area","unit":"m^2","allow_omitted":true}
            solution_sketch: 'For this plane the panel is $3$ times as large as its base, since $\sqrt{1+4+4} = 3$. So the base area is $27 \div 3 = 9$ square metres.'
          - problem: 'Find the area of the part of the plane $z = 2x - 3y + 6$ that lies over the triangle with vertices $(0,0)$, $(3,0)$ and $(0,2)$.'
            answer: '3*sqrt(14)'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Here $f_x = 2$ and $f_y = -3$, so the factor is $\sqrt{14}$. The triangle has area $3$, so the area is $3\sqrt{14}$.'
          - problem: 'What is the area of the part of the plane $z = x + y$ over the square $0 \le x \le 1$, $0 \le y \le 1$?'
            answer: 'sqrt(3)'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The plane is tilted, so its area is larger than its base. Here $f_x = f_y = 1$ and the factor is $\sqrt{3}$, so the area is $\sqrt{3} \cdot 1 = \sqrt{3}$.'
        constraints: "planes with integer coefficients so sqrt(1+fx^2+fy^2) is constant; base regions with simple areas"
      - id: kp2
        name: "Curved surfaces via polar coordinates"
        key_prerequisites: [double-integrals, partial-derivatives, double-integrals-polar]
        exemplars:
          - problem: 'Find the area of the part of the paraboloid $z = x^2 + y^2$ that lies below the plane $z = 1$.'
            answer: 'pi*(5*sqrt(5) - 1)/6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The surface lies over the disk $r \le 1$ and $\sqrt{1+f_x^2+f_y^2} = \sqrt{1+4r^2}$. So $A = 2\pi\int_0^1 \sqrt{1+4r^2}\,r\,dr = 2\pi \cdot \tfrac{1}{12}(5\sqrt5 - 1) = \tfrac{\pi}{6}(5\sqrt5 - 1)$.'
          - problem: 'Find the area of the part of the cone $z = \sqrt{x^2 + y^2}$ that lies between $z = 0$ and $z = 2$.'
            answer: '4*sqrt(2)*pi'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'For the cone $f_x^2 + f_y^2 = 1$, so the factor is $\sqrt2$. The base is the disk $r \le 2$ of area $4\pi$, so the area is $4\sqrt2\,\pi$.'
          - problem: 'Find the area of the part of the paraboloid $z = 2x^2 + 2y^2$ that lies below the plane $z = 8$.'
            answer: 'pi*(65*sqrt(65) - 1)/24'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The surface lies over the disk $r \le 2$ and the factor is $\sqrt{1+16r^2}$. So $A = 2\pi\int_0^2 \sqrt{1+16r^2}\,r\,dr = 2\pi\cdot\tfrac{1}{48}(65\sqrt{65} - 1) = \tfrac{\pi}{24}(65\sqrt{65}-1)$.'
          - problem: 'Find the area of the part of the cone $z = 3\sqrt{x^2 + y^2}$ that lies between $z = 0$ and $z = 6$.'
            answer: '4*sqrt(10)*pi'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'For this cone $f_x^2 + f_y^2 = 9$, so the factor is $\sqrt{10}$. The base is the disk $r \le 2$ of area $4\pi$, so the area is $4\sqrt{10}\,\pi$.'
          - problem: 'Find the area of the part of the sphere $z = \sqrt{9 - x^2 - y^2}$ that lies over the disk $x^2 + y^2 \le 4$.'
            answer: '6*pi*(3 - sqrt(5))'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Here $f_x^2 + f_y^2 = \tfrac{r^2}{9-r^2}$, so the factor is $\sqrt{1 + \tfrac{r^2}{9-r^2}} = \tfrac{3}{\sqrt{9-r^2}}$. So $A = 2\pi\int_0^2 \tfrac{3r}{\sqrt{9-r^2}}\,dr = 6\pi(3 - \sqrt5)$.'
          - problem: 'A satellite dish is the part of the paraboloid $z = \tfrac14(x^2 + y^2)$ below the plane $z = 1$, with lengths in metres. How many square metres of metal does the dish need?'
            answer: '8*pi*(2*sqrt(2) - 1)/3'
            answer_contract: {"kind":"unit","quantity":"area","unit":"m^2","allow_omitted":true}
            solution_sketch: 'The dish lies over the disk $r \le 2$ and the factor is $\sqrt{1 + \tfrac{r^2}{4}}$. So $A = 2\pi\int_0^2 \sqrt{1+\tfrac{r^2}{4}}\,r\,dr = \tfrac{8\pi}{3}(2\sqrt2 - 1)$ square metres.'
          - problem: 'The part of the cone $z = \sqrt{x^2 + y^2}$ with $0 \le z \le 5$ lies over a circular disk in the $xy$-plane. How many times as large as the area of that disk is the area of this part of the cone?'
            answer: 'sqrt(2)'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The cone has area $\sqrt2$ times the area of its base, because its factor is $\sqrt{1+1} = \sqrt2$. The base disk has area $25\pi$ and the cone has area $25\sqrt2\,\pi$, so the ratio is $\sqrt2$.'
          - problem: 'Find the area of the part of the paraboloid $z = x^2 + y^2$ that lies inside the cylinder $x^2 + y^2 = 3$.'
            answer: 'pi*(13*sqrt(13) - 1)/6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The surface lies over the disk $r \le \sqrt3$ and the factor is $\sqrt{1+4r^2}$. So $A = 2\pi\int_0^{\sqrt3} \sqrt{1+4r^2}\,r\,dr = 2\pi\cdot\tfrac{1}{12}(13\sqrt{13} - 1) = \tfrac{\pi}{6}(13\sqrt{13}-1)$.'
        constraints: "radially symmetric surfaces; the substitution u = 1 + 4r^2 (or a constant factor) finishes the integral; answers exact"
    diagnostic_exemplar:
      problem: 'Find the area of the part of the paraboloid $z = x^2 + y^2$ lying below the plane $z = 4$.'
      answer: '$\dfrac{\pi}{6}\left(17\sqrt{17} - 1\right)$'
      answer_contract: {kind: none}
      solution_sketch: '$dS = \sqrt{1 + 4x^2 + 4y^2}\,dA$, and the shadow is the disk $r \le 2$, so $A = \int_0^{2\pi}\!\int_0^2 \sqrt{1 + 4r^2}\,r\,dr\,d\theta = 2\pi \cdot \tfrac{1}{12}\left[(1 + 4r^2)^{3/2}\right]_0^2 = \tfrac{\pi}{6}\left(17\sqrt{17} - 1\right)$.'
    anki_seeds:
      - front: 'Surface area of the graph $z = f(x, y)$ over a region $D$?'
        back: '$\iint_D \sqrt{1 + f_x^2 + f_y^2} \, dA$'
        type: basic
      - front: 'Why does the surface-area integrand carry the factor $\sqrt{1 + f_x^2 + f_y^2}$?'
        back: 'It is $\left|\langle 1, 0, f_x \rangle \times \langle 0, 1, f_y \rangle\right|$ — the area of the tangent parallelogram, i.e. the tilt factor by which a patch $dA$ of the region stretches on the graph. A flat graph ($f_x = f_y = 0$) gives factor $1$.'
        type: basic

  - id: triple-integrals
    name: "Triple Integrals"
    core: true
    difficulty: 0.78
    drill: false
    answer_kind: numeric
    expected_time_secs: 240
    prerequisites:
      - id: double-integrals
        weight: 0.8
        key: true
      - id: coordinates-surfaces-3d
        weight: 0.3
        key: false
    knowledge_points:
      - id: kp1
        name: "Triple integrals over boxes"
        key_prerequisites: [double-integrals]
        exemplars:
          - problem: 'Evaluate $\iiint_B xyz\,dV$, where $B$ is the box $0 \le x \le 1$, $0 \le y \le 2$, $0 \le z \le 3$.'
            answer: '9/2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The integrand is a product of a function of each variable and the limits are constants, so the integral factors into three single integrals. Their values are $\tfrac12$, $2$ and $\tfrac92$, so the integral is $\tfrac12 \cdot 2 \cdot \tfrac92 = \tfrac92$.'
          - problem: 'Evaluate $\iiint_B (x + z)\,dV$, where $B$ is the cube $0 \le x \le 1$, $0 \le y \le 1$, $0 \le z \le 1$.'
            answer: '1'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Split the sum into two integrals. Each of $\iiint x\,dV$ and $\iiint z\,dV$ equals $\tfrac12$ over the unit cube, so the total is $\tfrac12 + \tfrac12 = 1$.'
          - problem: 'Evaluate $\iiint_B xyz\,dV$, where $B$ is the box $0 \le x \le 1$, $0 \le y \le 3$, $0 \le z \le 1$.'
            answer: '9/8'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The integrand is a product and the limits are constants, so the integral factors into three single integrals. Their values are $\tfrac12$, $\tfrac92$ and $\tfrac12$, so the integral is $\tfrac98$.'
          - problem: 'Evaluate $\iiint_B (x + y + z)\,dV$, where $B$ is the box $0 \le x \le 2$, $0 \le y \le 1$, $0 \le z \le 1$.'
            answer: '4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Split the sum into three integrals. They equal $2$, $1$ and $1$, so the total is $4$.'
          - problem: 'Evaluate $\iiint_B (x^2 + z)\,dV$, where $B$ is the box $0 \le x \le 2$, $0 \le y \le 3$, $0 \le z \le 1$.'
            answer: '11'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Split the sum. The first integral is $\tfrac83 \cdot 3 \cdot 1 = 8$ and the second is $2 \cdot 3 \cdot \tfrac12 = 3$. So the total is $11$.'
          - problem: 'A block occupies the box $0 \le x \le 2$, $0 \le y \le 3$, $0 \le z \le 2$, with lengths in metres. Its density at $(x,y,z)$ is $y$ kilograms per cubic metre. What is the mass of the block?'
            answer: '18'
            answer_contract: {"kind":"unit","quantity":"mass","unit":"kg","allow_omitted":true}
            solution_sketch: 'The mass is the integral of the density over the block. The density depends on $y$ alone, so $\iiint y\,dV = 2 \cdot \tfrac92 \cdot 2 = 18$ kilograms.'
          - problem: 'The density of the block $0 \le x \le 2$, $0 \le y \le 3$, $0 \le z \le 2$ is $ky$ kilograms per cubic metre for a constant $k$, and its mass is $54$ kilograms. Find $k$.'
            answer: '3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The mass is $k\iiint y\,dV = 18k$. Setting $18k = 54$ and dividing by $18$ gives $k = 3$.'
          - problem: 'What is the average value of $f(x,y,z) = xyz$ over the box $0 \le x \le 2$, $0 \le y \le 1$, $0 \le z \le 1$?'
            answer: '1/4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The integral of $xyz$ over the box is $2 \cdot \tfrac12 \cdot \tfrac12 = \tfrac12$. The volume of the box is $2$, so the average value is $\tfrac12 \div 2 = \tfrac14$.'
        constraints: "integrands separable or a sum of single variables; box edges at small integers"
      - id: kp2
        name: "General solids: tetrahedra and volume"
        key_prerequisites: [double-integrals]
        try_first:
          problem: 'The tetrahedron is bounded by the coordinate planes and the plane $x + y + z = 1$. When $x = \tfrac14$, what is the largest value of $y$ at a point of the tetrahedron?'
          answer_contract: {"kind":"exact"}
          answer: '3/4'
          reveal: 'At $x = \tfrac14$ the largest $y$ occurs where $z = 0$ and $x + y = 1$, so $y = \tfrac34$. This is why the middle limit of the integral is $0 \le y \le 1 - x$.'
        exemplars:
          - problem: 'Use a triple integral to find the volume of the tetrahedron bounded by the coordinate planes and the plane $x + y + z = 1$.'
            answer: '1/6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The limits are $0 \le x \le 1$, $0 \le y \le 1-x$, $0 \le z \le 1-x-y$. The inner integrals give $\int_0^1 \tfrac{(1-x)^2}{2}\,dx = \tfrac16$.'
          - problem: 'Evaluate $\iiint_E z\,dV$, where $E$ is the tetrahedron bounded by the coordinate planes and the plane $x + y + z = 1$.'
            answer: '1/24'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The inner integral is $\int_0^{1-x-y} z\,dz = \tfrac{(1-x-y)^2}{2}$. The middle integral is $\tfrac{(1-x)^3}{6}$, and the outer integral gives $\tfrac{1}{24}$.'
          - problem: 'Find the volume of the tetrahedron bounded by the coordinate planes and the plane $x + 2y + 3z = 12$.'
            answer: '48'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The plane meets the axes at $x = 12$, $y = 6$ and $z = 4$. The volume is $\int_0^{12}\int_0^{(12-x)/2}\tfrac{12-x-2y}{3}\,dy\,dx = 48$.'
          - problem: 'Evaluate $\iiint_E y\,dV$, where $E$ is the tetrahedron bounded by the coordinate planes and the plane $x + 2y + z = 4$.'
            answer: '8/3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The limits are $0 \le x \le 4$, $0 \le y \le (4-x)/2$, $0 \le z \le 4 - x - 2y$. Integrating $y(4-x-2y)$ in $y$ gives $\tfrac{(4-x)^3}{24}$, and the outer integral gives $\tfrac83$.'
          - problem: 'Evaluate $\iiint_E z\,dV$, where $E$ is the tetrahedron bounded by the coordinate planes and the plane $2x + y + z = 2$.'
            answer: '1/3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The limits are $0 \le x \le 1$, $0 \le y \le 2 - 2x$, $0 \le z \le 2 - 2x - y$. The inner integral is $\tfrac{(2-2x-y)^2}{2}$, and the next two integrals give $\tfrac13$.'
          - problem: 'A pile of sand fills the tetrahedron bounded by the floor $z = 0$, the walls $x = 0$ and $y = 0$, and the plane $x + y + z = 3$, with lengths in metres. How many cubic metres of sand are in the pile?'
            answer: '9/2'
            answer_contract: {"kind":"unit","quantity":"cubic_volume","unit":"m^3","allow_omitted":true}
            solution_sketch: 'The pile is the tetrahedron with intercepts $3$, $3$ and $3$ on the axes. Its volume is $\int_0^3 \tfrac{(3-x)^2}{2}\,dx = \tfrac{27}{6} = \tfrac92$ cubic metres.'
          - problem: 'What is the average value of $z$ over the tetrahedron bounded by the coordinate planes and the plane $x + y + z = 1$?'
            answer: '1/4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The integral of $z$ over the tetrahedron is $\tfrac{1}{24}$ and its volume is $\tfrac16$. The average value is $\tfrac{1}{24} \div \tfrac16 = \tfrac14$.'
          - problem: 'A solid fills the tetrahedron in the first octant under the plane $x + y + z = 2$, with lengths in metres. Its density is $3$ kilograms per cubic metre everywhere. What is its mass?'
            answer: '4'
            answer_contract: {"kind":"unit","quantity":"mass","unit":"kg","allow_omitted":true}
            solution_sketch: 'The volume of the tetrahedron is $\tfrac{2^3}{6} = \tfrac43$ cubic metres. The mass is density times volume, so $3 \cdot \tfrac43 = 4$ kilograms.'
        constraints: "solids bounded by coordinate planes and one slanted plane; powers of (1-x) integrate exactly"
      - id: kp3
        name: "Solids bounded by curved surfaces"
        key_prerequisites: [double-integrals]
        exemplars:
          - problem: 'Find the volume of the solid bounded below by the plane $z = 0$ and above by the plane $z = y$, over the region of the $xy$-plane enclosed by the parabola $y = 1 - x^2$ and the $x$-axis.'
            answer: '8/15'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The base is $-1 \le x \le 1$, $0 \le y \le 1 - x^2$. The inner integral is $\int_0^{1-x^2} y\,dy = \tfrac{(1-x^2)^2}{2}$, and the outer integral gives $\tfrac{8}{15}$.'
          - problem: 'Evaluate $\iiint_E z\,dV$, where $E = \{(x,y,z) : 0 \le x \le 1,\ 0 \le y \le 1,\ 0 \le z \le x + y\}$.'
            answer: '7/12'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The inner integral is $\tfrac{(x+y)^2}{2}$. Over the unit square, $\iint (x+y)^2\,dA = \tfrac13 + \tfrac12 + \tfrac13 = \tfrac76$, so the answer is $\tfrac{7}{12}$.'
          - problem: 'Find the volume of the solid $E = \{(x,y,z) : 0 \le x \le 1,\ 0 \le y \le 1,\ 0 \le z \le x + 2y^2\}$.'
            answer: '7/6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The inner integral in $z$ gives the height $x + 2y^2$ of the solid above each point of the square. The volume is then $\int_0^1\int_0^1 (x + 2y^2)\,dy\,dx = \tfrac12 + \tfrac23 = \tfrac76$.'
          - problem: 'Find the volume of the solid between the plane $z = 0$ and the surface $z = 1 - x^2$ over the rectangle $0 \le x \le 1$, $0 \le y \le 2$.'
            answer: '4/3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The height is $1 - x^2$ and the rectangle has width $2$ in $y$. So $V = 2\int_0^1 (1 - x^2)\,dx = 2 \cdot \tfrac23 = \tfrac43$.'
          - problem: 'Evaluate $\iiint_E z\,dV$, where $E = \{(x,y,z) : 0 \le x \le 1,\ 0 \le y \le 1,\ 0 \le z \le 1 + xy\}$.'
            answer: '29/36'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The inner integral is $\tfrac{(1+xy)^2}{2}$. Over the unit square $\iint (1 + 2xy + x^2y^2)\,dA = 1 + \tfrac12 + \tfrac19 = \tfrac{29}{18}$, so the answer is $\tfrac{29}{36}$.'
          - problem: 'A block stands on the rectangle $0 \le x \le 2$, $0 \le y \le 1$, with lengths in metres. Its top is the surface $z = 4 - x^2$, and its base is the plane $z = 0$. What is the volume of the block?'
            answer: '16/3'
            answer_contract: {"kind":"unit","quantity":"cubic_volume","unit":"m^3","allow_omitted":true}
            solution_sketch: 'The height is $4 - x^2$ and the rectangle has width $1$ in $y$. So $V = \int_0^2 (4 - x^2)\,dx = 8 - \tfrac83 = \tfrac{16}{3}$ cubic metres.'
          - problem: 'What is the average height of the block that stands on $0 \le x \le 2$, $0 \le y \le 1$ and has the top surface $z = 4 - x^2$ (lengths in metres)?'
            answer: '8/3'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'The volume of the block is $\tfrac{16}{3}$ cubic metres and its base has area $2$ square metres. The average height is $\tfrac{16}{3} \div 2 = \tfrac83$ metres.'
          - problem: 'The solid $E = \{(x,y,z) : 0 \le x \le 1,\ 0 \le y \le 1,\ 0 \le z \le x^2 + cy\}$ has volume $\tfrac12$ for a constant $c$. Find $c$.'
            answer: '1/3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The volume is $\int_0^1\int_0^1 (x^2 + cy)\,dy\,dx = \tfrac13 + \tfrac{c}{2}$. Setting this equal to $\tfrac12$ gives $\tfrac{c}{2} = \tfrac16$, so $c = \tfrac13$.'
        constraints: "z-bounds are polynomial surfaces; after the inner integral the problem reduces to an earlier double integral"
    diagnostic_exemplar:
      problem: 'Evaluate $\iiint_E x\,dV$ where $E$ is the tetrahedron bounded by the coordinate planes and the plane $x + 2y + z = 2$.'
      answer: '$\dfrac{1}{3}$'
      answer_contract: {kind: none}
      solution_sketch: 'Bounds: $0 \le x \le 2$, $0 \le y \le \frac{2-x}{2}$, $0 \le z \le 2 - x - 2y$. Integrating in $z$ then $y$ gives $\int_0^{(2-x)/2}(2 - x - 2y)\,dy = \frac{(2-x)^2}{4}$, so the integral is $\int_0^2 \frac{x(2-x)^2}{4}\,dx = \frac{1}{4}\left(12 - \frac{32}{3}\right) = \frac{1}{3}$.'
    anki_seeds:
      - front: 'How do you compute a volume with a triple integral?'
        back: '$V = \iiint_E 1 \, dV$ — integrate the constant $1$ over the solid.'
        type: basic
      - front: 'Volume of the tetrahedron cut off by $x + y + z = 1$ and the coordinate planes?'
        back: '$\frac{1}{6}$'
        type: basic

  - id: triple-integral-applications
    name: "Mass and Average Value in Three Dimensions"
    core: false                # mass / average-value application; terminal
    difficulty: 0.80
    drill: false
    answer_kind: numeric
    expected_time_secs: 240
    prerequisites:
      - id: triple-integrals
        weight: 0.8
        key: true
      - id: double-integral-applications
        weight: 0.5
        key: true
    knowledge_points:
      - id: kp1
        name: "Mass with variable density"
        key_prerequisites: [triple-integrals, double-integral-applications]
        exemplars:
          - problem: 'Find the mass of the box $[0,1] \times [0,2] \times [0,3]$ with density $\rho(x,y,z) = 2z$.'
            answer: '18'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The mass is the triple integral of the density over the box. The density depends only on $z$, so $m = \int_0^1 dx \cdot \int_0^2 dy \cdot \int_0^3 2z\,dz = 1 \cdot 2 \cdot 9 = 18$.'
          - problem: 'Find the mass of the unit cube $[0,1]^3$ with density $\rho(x,y,z) = x + y + z$.'
            answer: '3/2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Each of the three terms integrates to $\frac{1}{2}$ over the unit cube, because the other two variables each contribute a factor $1$. So the mass is $3 \cdot \frac{1}{2} = \frac{3}{2}$.'
          - problem: 'A concrete block occupies $0 \le x \le 2$, $0 \le y \le 1$, $0 \le z \le 3$, with all lengths in metres. Its density grows with height: $\rho = 5z$ kilograms per cubic metre. What is the mass of the block?'
            answer: '45'
            answer_contract: {"kind":"unit","quantity":"mass","unit":"kg","allow_omitted":true}
            solution_sketch: 'The mass is the triple integral of the density over the block. Only $z$ appears in the density, so $m = 2 \cdot 1 \cdot \int_0^3 5z\,dz = 2 \cdot \frac{45}{2} = 45$. The block has a mass of 45 kilograms.'
          - problem: 'Find the mass of the box $[0,2] \times [0,1] \times [0,3]$ whose density is $\rho = 5x$.'
            answer: '30'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The mass is the triple integral of $5x$ over the box. Integrating in $x$ gives $\int_0^2 5x\,dx = 10$. The lengths in $y$ and $z$ are $1$ and $3$, so $m = 10 \cdot 1 \cdot 3 = 30$.'
          - problem: 'A box $[0,2] \times [0,2] \times [0,1]$, with lengths in metres, has density $\rho = x + y$ kilograms per cubic metre. A second box of the same size is made of one material with constant density $\rho_0$ and has the same total mass. What is $\rho_0$?'
            answer: '2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The mass of the first box is $\iiint (x+y)\,dV = 4 + 4 = 8$ kilograms. The second box has volume $2 \cdot 2 \cdot 1 = 4$ cubic metres, and mass equals density times volume. So $\rho_0 = 8 \div 4 = 2$.'
          - problem: 'Find the mass of the box $[0,1] \times [0,3] \times [0,1]$ with density $\rho = 2x + z$.'
            answer: '9/2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The density changes across the box, so the mass needs the triple integral. We get $\iiint (2x+z)\,dV = 2 \cdot \frac{1}{2} \cdot 3 + \frac{1}{2} \cdot 3 = 3 + \frac{3}{2} = \frac{9}{2}$.'
          - problem: 'Find the mass of the box $[0,2] \times [0,1] \times [0,3]$ whose density is $\rho = x + 2y$.'
            answer: '12'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Split the density into its two terms. The term $x$ gives $2 \cdot 1 \cdot 3 = 6$ and the term $2y$ gives $2 \cdot 1 \cdot 3 = 6$. The mass is $6 + 6 = 12$.'
          - problem: 'Find the mass of the box $[0,1] \times [0,4] \times [0,2]$ whose density is $\rho = 3y$.'
            answer: '48'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The mass is the triple integral of $3y$ over the box. Integrating in $y$ gives $\int_0^4 3y\,dy = 24$. The lengths in $x$ and $z$ are $1$ and $2$, so $m = 1 \cdot 24 \cdot 2 = 48$.'
          - problem: 'A box $[0,2] \times [0,3] \times [0,1]$, with lengths in metres, has density $\rho = kz$ kilograms per cubic metre, where $k$ is a constant. The total mass is $24$ kilograms. What is $k$?'
            answer: '8'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The mass is $\iiint kz\,dV = k \cdot 2 \cdot 3 \cdot \int_0^1 z\,dz = 3k$. Setting $3k = 24$ and dividing by $3$ gives $k = 8$.'
        constraints: 'density linear in one or more variables or a single power of one variable; boxes only; masses exact rationals; word problems give lengths in metres and masses in kilograms'
      - id: kp2
        name: "Center of mass and average value"
        key_prerequisites: [triple-integrals, double-integral-applications]
        try_first:
          problem: 'A room is the box $0 \le x \le 4$, $0 \le y \le 2$, $0 \le z \le 3$, with lengths in metres. The temperature at the point $(x,y,z)$ is $T = 2x$ degrees Celsius. What is the average temperature in the room?'
          answer_contract: {"kind":"exact"}
          answer: '4'
          reveal: 'The temperature depends only on $x$, so the average over the room is the average of $2x$ on $0 \le x \le 4$, which is $4$. In general the average value of $f$ is the integral of $f$ divided by the volume.'
        exemplars:
          - problem: 'The box $[0,1] \times [0,1] \times [0,2]$ has density $\rho = z$. Find $\bar{z}$, the $z$-coordinate of its center of mass.'
            answer: '4/3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The mass is $m = \int_0^2 z\,dz = 2$. The moment is $M_{xy} = \iiint z^2\,dV = \int_0^2 z^2\,dz = \frac{8}{3}$. So $\bar{z} = \frac{8/3}{2} = \frac{4}{3}$.'
          - problem: 'Find the average value of $f(x,y,z) = xyz$ over the cube $[0,2]^3$.'
            answer: '1'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The integral is $\iiint xyz\,dV = 2 \cdot 2 \cdot 2 = 8$, because each factor $\int_0^2 t\,dt$ equals $2$. The volume is $8$, so the average value is $8 \div 8 = 1$.'
          - problem: 'Find $\bar{z}$ for the uniform tetrahedron bounded by the coordinate planes and the plane $x + y + z = 1$.'
            answer: '1/4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The integral $\iiint z\,dV$ over the tetrahedron is $\frac{1}{24}$ and the volume is $\frac{1}{6}$. So $\bar{z} = \frac{1/24}{1/6} = \frac{1}{4}$.'
          - problem: 'A box $[0,1] \times [0,2] \times [0,4]$, with lengths in metres, has density $\rho = 3z$ kilograms per cubic metre. How high above the base $z = 0$ is its center of mass?'
            answer: '8/3'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'The mass is $m = 1 \cdot 2 \cdot \int_0^4 3z\,dz = 48$ and the moment is $M_{xy} = 2 \cdot \int_0^4 3z^2\,dz = 128$. So $\bar{z} = \frac{128}{48} = \frac{8}{3}$ metres.'
          - problem: 'A solid has mass $24$ kilograms and its moment about the $xy$-plane is $M_{xy} = 60$ kilogram-metres. How high above the $xy$-plane is its center of mass?'
            answer: '5/2'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'The height of the center of mass is the moment divided by the mass. So $\bar{z} = \frac{60}{24} = \frac{5}{2}$ metres.'
          - problem: 'The air in a room $0 \le x \le 4$, $0 \le y \le 3$, $0 \le z \le 2$, with lengths in metres, has temperature $T = 10 + 2z$ degrees Celsius at height $z$. What is the average temperature of the air in the room?'
            answer: '12'
            answer_contract: {"kind":"unit","quantity":"temperature","unit":"\u00b0C","allow_omitted":true}
            solution_sketch: 'The integral of $T$ over the room is $240 + 48 = 288$, because $\iiint 10\,dV = 10 \cdot 24$ and $\iiint 2z\,dV = 12 \cdot 4$. The volume is $24$, so the average temperature is $288 \div 24 = 12$ degrees Celsius.'
          - problem: 'The tetrahedron bounded by $x + y + z = 1$ and the coordinate planes has density $\rho = y$. Find $\bar{y}$, the $y$-coordinate of its center of mass.'
            answer: '2/5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The mass is $\iiint y\,dV = \frac{1}{24}$ and the moment is $\iiint y^2\,dV = \frac{1}{60}$. So $\bar{y} = \frac{1/60}{1/24} = \frac{24}{60} = \frac{2}{5}$.'
          - problem: 'The solid unit cube $[0,1]^3$ has density $\rho = x$. Find $\bar{x}$, the $x$-coordinate of its center of mass.'
            answer: '2/3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The mass is $\int_0^1 x\,dx = \frac{1}{2}$ and the moment is $\int_0^1 x^2\,dx = \frac{1}{3}$. So $\bar{x} = \frac{1/3}{1/2} = \frac{2}{3}$.'
          - problem: 'Find the average value of $f(x,y,z) = xyz$ over the box $[0,1] \times [0,2] \times [0,3]$.'
            answer: '3/4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The integral is $\frac{1}{2} \cdot 2 \cdot \frac{9}{2} = \frac{9}{2}$ and the volume is $6$. So the average value is $\frac{9/2}{6} = \frac{3}{4}$.'
          - problem: 'A box $[0,2] \times [0,3] \times [0,4]$, with lengths in metres, has density $\rho = x + y + z$ kilograms per cubic metre. What is the average density of the box?'
            answer: '9/2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The mass is $\iiint (x+y+z)\,dV = 24 + 36 + 48 = 108$ kilograms and the volume is $24$ cubic metres. So the average density is $108 \div 24 = \frac{9}{2}$ kilograms per cubic metre.'
        constraints: 'reuse standard solids (boxes, unit tetrahedron); coordinates and averages are small rationals; word problems use metres, kilograms and degrees Celsius'
    diagnostic_exemplar:
      problem: 'The box $[0,2] \times [0,1] \times [0,3]$ has density $\rho(x, y, z) = z$. Find $\bar z$, the $z$-coordinate of its centre of mass.'
      answer: '$2$'
      solution_sketch: '$m = 2\int_0^3 z\,dz = 9$ and $M_{xy} = 2\int_0^3 z^2\,dz = 18$, so $\bar z = 18/9 = 2$.'
    anki_seeds:
      - front: 'Average value of $f$ over a solid $E$?'
        back: '$\bar{f} = \dfrac{1}{V(E)} \iiint_E f \, dV$'
        type: basic
      - front: '$\bar{z}$ for a solid with density $\rho$?'
        back: '$\bar{z} = \dfrac{M_{xy}}{m} = \dfrac{1}{m}\iiint z\rho \, dV$'
        type: basic

  - id: triple-integrals-cylindrical
    name: "Triple Integrals in Cylindrical Coordinates"
    core: true
    difficulty: 0.79
    drill: false
    answer_kind: numeric
    expected_time_secs: 200
    prerequisites:
      - id: triple-integrals
        weight: 0.8
        key: true
      - id: double-integrals-polar
        weight: 0.7
        key: true
    knowledge_points:
      - id: kp1
        name: "Setting up cylindrical integrals"
        key_prerequisites: [triple-integrals, double-integrals-polar]
        try_first:
          problem: 'A solid cylinder has radius $1$ and height $1$, so its volume is $\pi$. Evaluate $\int_0^{2\pi}\int_0^{1}\int_0^{1} 1\,dz\,dr\,d\theta$.'
          answer_contract: {"kind":"exact"}
          answer: '2pi'
          reveal: 'The value is $2\pi$, which is twice the true volume $\pi$. A small piece of the base at radius $r$ has area $r\,dr\,d\theta$, not $dr\,d\theta$, so the integrand needs the extra factor $r$.'
        exemplars:
          - problem: 'Write $\iiint_E (x^2+y^2)\,dV$, where $E$ is the solid cylinder $x^2+y^2 \le 4$, $0 \le z \le 3$, as an iterated integral $\int_0^{2\pi}\int_0^{2}\int_0^{3} g\,dz\,dr\,d\theta$ in cylindrical coordinates. What is the integrand $g$?'
            answer: 'r^3'
            answer_contract: {"kind":"function","vars":["r","theta","z"]}
            solution_sketch: 'In cylindrical coordinates $x^2 + y^2 = r^2$, and the volume element is $dV = r\,dz\,dr\,d\theta$. So the integrand is $r^2 \cdot r = r^3$.'
          - problem: 'Write $\iiint_E x\,dV$, where $E$ is the solid cylinder $x^2+y^2 \le 16$, $0 \le z \le 5$, as an iterated integral $\int_0^{2\pi}\int_0^{4}\int_0^{5} g\,dz\,dr\,d\theta$ in cylindrical coordinates. What is the integrand $g$?'
            answer: 'r^2*cos(theta)'
            answer_contract: {"kind":"function","vars":["r","theta","z"]}
            solution_sketch: 'In cylindrical coordinates $x = r\cos\theta$, and the volume element is $dV = r\,dz\,dr\,d\theta$. So the integrand is $r\cos\theta \cdot r = r^2\cos\theta$.'
          - problem: 'The solid $E$ lies above the cone $z = \sqrt{x^2+y^2}$ and below the plane $z = 3$. In cylindrical coordinates it is described by $0 \le \theta \le 2\pi$, $0 \le r \le 3$ and $a \le z \le 3$. What is the lower bound $a$?'
            answer: 'r'
            answer_contract: {"kind":"function","vars":["r"]}
            solution_sketch: 'On the cone $z = \sqrt{x^2+y^2} = r$, so the cone is the surface $z = r$. The solid lies above it, so $z$ runs from $r$ up to $3$ and $a = r$.'
          - problem: 'The solid between the paraboloid $z = x^2+y^2$ and the plane $z = 4$ is described in cylindrical coordinates by $0 \le \theta \le 2\pi$, $0 \le r \le b$ and $r^2 \le z \le 4$. What is $b$?'
            answer: '2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The paraboloid $z = r^2$ meets the plane $z = 4$ where $r^2 = 4$. So the outer radius of the solid is $b = 2$.'
          - problem: 'A cylindrical column of radius $2$ metres and height $5$ metres has density $\rho = 1 + r^2$ kilograms per cubic metre, where $r$ is the distance from the axis. Its mass is $\int_0^{2\pi}\int_0^{2}\int_0^{5} g\,dz\,dr\,d\theta$. What is the integrand $g$?'
            answer: 'r + r^3'
            answer_contract: {"kind":"function","vars":["r"]}
            solution_sketch: 'The mass is the integral of the density with the volume element $dV = r\,dz\,dr\,d\theta$. So the integrand is $g = (1 + r^2) \cdot r = r + r^3$.'
          - problem: 'Write $\iiint_E z\,dV$ over the solid cylinder $x^2+y^2 \le 9$, $0 \le z \le 4$ as $\int_0^{2\pi}\int_0^{3}\int_0^{4} g\,dz\,dr\,d\theta$. What integrand $g$ replaces $z$?'
            answer: 'r*z'
            answer_contract: {"kind":"function","vars":["r","z"]}
            solution_sketch: 'The volume element is $dV = r\,dz\,dr\,d\theta$, so the integrand gets the factor $r$. The integrand is $z \cdot r = rz$.'
          - problem: 'A grain silo is a cylinder of radius $3$ metres and height $5$ metres. Use cylindrical coordinates to find its volume.'
            answer: '45pi'
            answer_contract: {"kind":"unit","quantity":"cubic_volume","unit":"m^3","allow_omitted":true}
            solution_sketch: 'The silo is a circular cylinder, so we integrate $1$ with the volume element $dV = r\,dz\,dr\,d\theta$. The volume is $\int_0^{2\pi}\int_0^{3}\int_0^{5} r\,dz\,dr\,d\theta = 5 \cdot \frac{9}{2} \cdot 2\pi = 45\pi$ cubic metres.'
          - problem: 'Water of depth $h$ fills a cylindrical tank of radius $2$ metres, so its volume is $\int_0^{2\pi}\int_0^{2}\int_0^{h} r\,dz\,dr\,d\theta$. The tank holds $20\pi$ cubic metres of water. How deep is the water?'
            answer: '5'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'The integral equals $h \cdot \frac{4}{2} \cdot 2\pi = 4\pi h$ cubic metres. Setting $4\pi h = 20\pi$ and dividing by $4\pi$ gives $h = 5$ metres.'
        constraints: 'solids are coordinate cylinders, cones and paraboloids; the answer is one piece of the set-up (integrand including the factor r, or a bound) or a value found from it'
      - id: kp2
        name: "Evaluating cylindrical integrals"
        key_prerequisites: [triple-integrals, double-integrals-polar]
        exemplars:
          - problem: 'Use cylindrical coordinates to evaluate $\iiint_E z\,dV$, where $E$ is the cylinder $x^2 + y^2 \le 1$, $0 \le z \le 2$.'
            answer: '2pi'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The integral is $\int_0^{2\pi}\int_0^{1}\int_0^{2} z\,r\,dz\,dr\,d\theta$. The three factors are $\int_0^2 z\,dz = 2$, $\int_0^1 r\,dr = \frac{1}{2}$ and $2\pi$, so the value is $2 \cdot \frac{1}{2} \cdot 2\pi = 2\pi$.'
          - problem: 'Find the volume of the solid above the cone $z = \sqrt{x^2 + y^2}$ and below the plane $z = 2$.'
            answer: '8pi/3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'For $0 \le r \le 2$ the height $z$ runs from $r$ to $2$. So $V = \int_0^{2\pi}\int_0^2 (2 - r)\,r\,dr\,d\theta = 2\pi\left(4 - \frac{8}{3}\right) = \frac{8\pi}{3}$.'
          - problem: 'Use cylindrical coordinates to evaluate $\iiint_E (x^2+y^2)\,dV$, where $E$ is the solid cylinder $x^2 + y^2 \le 1$, $0 \le z \le 3$.'
            answer: '3pi/2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The integrand $x^2 + y^2$ becomes $r^2$ in cylindrical coordinates. With the factor $r$ the integral is $\int_0^{2\pi}\int_0^{1}\int_0^{3} r^3\,dz\,dr\,d\theta = 3 \cdot \frac{1}{4} \cdot 2\pi = \frac{3\pi}{2}$.'
          - problem: 'A solid cylinder of radius $2$ metres and height $3$ metres has density $\rho = 4z$ kilograms per cubic metre at height $z$. Find its mass.'
            answer: '72pi'
            answer_contract: {"kind":"unit","quantity":"mass","unit":"kg","allow_omitted":true}
            solution_sketch: 'The mass is $\int_0^{2\pi}\int_0^{2}\int_0^{3} 4z\,r\,dz\,dr\,d\theta$. The factors are $\int_0^3 4z\,dz = 18$, $\int_0^2 r\,dr = 2$ and $2\pi$, so $m = 18 \cdot 2 \cdot 2\pi = 72\pi$ kilograms.'
          - problem: 'Use cylindrical coordinates to evaluate $\iiint_E (x^2+y^2)\,dV$, where $E$ is the solid between the cone $z = \sqrt{x^2 + y^2}$ and the plane $z = 1$.'
            answer: 'pi/10'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The height $z$ runs from $r$ to $1$ for $0 \le r \le 1$. So the integral is $2\pi\int_0^1 r^2 (1 - r)\,r\,dr = 2\pi\left(\frac{1}{4} - \frac{1}{5}\right) = \frac{\pi}{10}$.'
          - problem: 'Find the average value of $x^2 + y^2$ over the solid cylinder $x^2 + y^2 \le 4$, $0 \le z \le 5$.'
            answer: '2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The integral of $x^2 + y^2$ is $\int_0^{2\pi}\int_0^2\int_0^5 r^3\,dz\,dr\,d\theta = 5 \cdot 4 \cdot 2\pi = 40\pi$. The volume is $\pi \cdot 4 \cdot 5 = 20\pi$. The average value is $40\pi \div 20\pi = 2$.'
          - problem: 'Use cylindrical coordinates to evaluate $\iiint_E z\,dV$, where $E$ is the solid between the paraboloid $z = x^2 + y^2$ and the plane $z = 4$.'
            answer: '64pi/3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'For $0 \le r \le 2$ the height runs from $r^2$ to $4$. So the integral is $2\pi\int_0^2 \frac{16 - r^4}{2}\,r\,dr = 2\pi \cdot \frac{32}{3} = \frac{64\pi}{3}$.'
          - problem: 'Use cylindrical coordinates to evaluate $\iiint_E z^2\,dV$, where $E$ is the solid cylinder $x^2 + y^2 \le 4$, $0 \le z \le 1$.'
            answer: '4pi/3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The integrand $z^2$ stays the same and the volume element adds the factor $r$. The integral is $\int_0^{2\pi}\int_0^{2}\int_0^{1} z^2\,r\,dz\,dr\,d\theta = \frac{1}{3} \cdot 2 \cdot 2\pi = \frac{4\pi}{3}$.'
          - problem: 'A solid cylinder of radius $3$ metres and height $4$ metres has constant density $2$ kilograms per cubic metre. Its moment of inertia about its axis is $I = \iiint \rho\,(x^2+y^2)\,dV$. Find $I$.'
            answer: '324pi'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The density is constant, so it comes outside the integral. With $\rho = 2$ the integral is $2\int_0^{2\pi}\int_0^{3}\int_0^{4} r^3\,dz\,dr\,d\theta = 2 \cdot 4 \cdot \frac{81}{4} \cdot 2\pi = 324\pi$ kilogram square metres.'
          - problem: 'Evaluate $\iiint_E z\,dV$ over the solid cylinder $x^2 + y^2 \le 9$, $0 \le z \le 2$.'
            answer: '18pi'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The volume element is $dV = r\,dz\,dr\,d\theta$. The integral is $\int_0^{2\pi}\int_0^{3}\int_0^{2} z\,r\,dz\,dr\,d\theta = 2 \cdot \frac{9}{2} \cdot 2\pi = 18\pi$.'
        constraints: 'solids with rotational symmetry about the z-axis (cylinders, cones, paraboloids); dV = r dz dr dtheta; word problems give mass, average value or moment of inertia'
      - id: kp3
        name: "Volumes of rotationally symmetric solids"
        key_prerequisites: [triple-integrals, double-integrals-polar]
        exemplars:
          - problem: 'Find the volume of the solid under the paraboloid $z = 9 - x^2 - y^2$ and above the $xy$-plane.'
            answer: '81pi/2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The paraboloid meets $z = 0$ at $r = 3$. So $V = \int_0^{2\pi}\int_0^3 (9 - r^2)\,r\,dr\,d\theta = 2\pi\left(\frac{81}{2} - \frac{81}{4}\right) = \frac{81\pi}{2}$.'
          - problem: 'Evaluate $\iiint_E (x^2 + y^2)\,dV$, where $E$ is the cylinder $x^2 + y^2 \le 4$, $0 \le z \le 1$.'
            answer: '8pi'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The integrand $x^2 + y^2$ becomes $r^2$ and $dV$ adds a factor $r$. The integral is $\int_0^{2\pi}\int_0^{2}\int_0^{1} r^2 \cdot r\,dz\,dr\,d\theta = 1 \cdot 4 \cdot 2\pi = 8\pi$.'
          - problem: 'A bowl is the solid above the paraboloid $z = x^2 + y^2$ and below the plane $z = 4$, with lengths in metres. How much water does the bowl hold when it is full?'
            answer: '8pi'
            answer_contract: {"kind":"unit","quantity":"cubic_volume","unit":"m^3","allow_omitted":true}
            solution_sketch: 'The paraboloid meets the plane where $r = 2$. So $V = \int_0^{2\pi}\int_0^2 (4 - r^2)\,r\,dr\,d\theta = 2\pi(8 - 4) = 8\pi$ cubic metres.'
          - problem: 'Find the volume of the solid bounded by the paraboloid $z = 25 - x^2 - y^2$ and the plane $z = 0$.'
            answer: '625pi/2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The paraboloid meets $z = 0$ at $r = 5$. So $V = 2\pi\int_0^5 (25 - r^2)\,r\,dr = 2\pi\left(\frac{625}{2} - \frac{625}{4}\right) = \frac{625\pi}{2}$.'
          - problem: 'The water from the full bowl above, which holds $8\pi$ cubic metres, is poured into a cylindrical tank with a base of area $4\pi$ square metres. How deep is the water in the tank?'
            answer: '2'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'The depth is the volume divided by the base area. So the depth is $\frac{8\pi}{4\pi} = 2$ metres.'
          - problem: 'A solid lies inside the cylinder $x^2 + y^2 \le 16$, between the plane $z = 0$ and the paraboloid $z = x^2 + y^2$. Find its volume.'
            answer: '128pi'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'In cylindrical coordinates $0 \le r \le 4$ and $0 \le z \le r^2$. So $V = 2\pi\int_0^4 r^2\cdot r\,dr = 2\pi \cdot 64 = 128\pi$.'
          - problem: 'A hill has height $z = 36 - x^2 - y^2$ metres above level ground $z = 0$, where $x$ and $y$ are in metres. Find the volume of earth in the hill.'
            answer: '648pi'
            answer_contract: {"kind":"unit","quantity":"cubic_volume","unit":"m^3","allow_omitted":true}
            solution_sketch: 'The hill ends where $36 - r^2 = 0$, so $r = 6$. Then $V = 2\pi\int_0^6 (36 - r^2)\,r\,dr = 2\pi(648 - 324) = 648\pi$ cubic metres.'
          - problem: 'Find the volume of the solid between the paraboloids $z = x^2 + y^2 + 2$ and $z = 10 - x^2 - y^2$.'
            answer: '16pi'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The paraboloids meet where $r^2 + 2 = 10 - r^2$, so $r = 2$. Then $V = 2\pi\int_0^2 (8 - 2r^2)\,r\,dr = 2\pi(16 - 8) = 16\pi$.'
          - problem: 'Find the volume of the solid inside the cylinder $x^2 + y^2 \le 9$ that lies between the plane $z = 0$ and the paraboloid $z = 18 - 2x^2 - 2y^2$.'
            answer: '81pi'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'In cylindrical coordinates $0 \le r \le 3$ and $0 \le z \le 18 - 2r^2$. So $V = 2\pi\int_0^3 (18 - 2r^2)\,r\,dr = 2\pi\left(81 - \frac{81}{2}\right) = 81\pi$.'
        constraints: 'paraboloids and cylinders with small integer radii; answers exact multiples of pi; word problems give volumes in cubic metres'
    diagnostic_exemplar:
      problem: 'Use cylindrical coordinates to find the volume of the solid bounded above by the paraboloid $z = 12 - x^2 - y^2$ and below by the cone $z = \sqrt{x^2 + y^2}$.'
      answer: '$\dfrac{99\pi}{2}$'
      answer_contract: {kind: none}
      solution_sketch: 'The surfaces meet where $12 - r^2 = r$, i.e. $r = 3$. Then $V = \int_0^{2\pi}\!\int_0^3 \left[(12 - r^2) - r\right] r\,dr\,d\theta = 2\pi\left[6r^2 - \tfrac{r^4}{4} - \tfrac{r^3}{3}\right]_0^3 = 2\pi\left(54 - \tfrac{81}{4} - 9\right) = \tfrac{99\pi}{2}$.'
    anki_seeds:
      - front: 'Volume element in cylindrical coordinates?'
        back: '$dV = r \, dz \, dr \, d\theta$'
        type: basic
      - front: 'When are cylindrical coordinates the right choice for a triple integral?'
        back: 'When the solid or integrand is symmetric about the $z$-axis (cylinders, cones, paraboloids, $x^2 + y^2$ terms).'
        type: basic

  - id: cylindrical-spherical-coordinates
    name: "Spherical Coordinates and Choosing a System"
    core: true
    difficulty: 0.82
    drill: false
    answer_kind: numeric
    expected_time_secs: 240
    prerequisites:
      - id: triple-integrals-cylindrical
        weight: 0.8
        key: true
      - id: triple-integrals
        weight: 0.4
        key: false
      - id: partial-derivatives-trig-exp
        weight: 0.5
        key: true
      - id: determinants-2x2
        weight: 0.4
        key: false
    knowledge_points:
      - id: kp1
        name: "Spherical coordinates: conversion and set-up"
        key_prerequisites: [triple-integrals-cylindrical]
        exemplars:
          - problem: 'Convert the spherical point $(\rho, \varphi, \theta) = \left(2, \frac{\pi}{3}, 0\right)$ to rectangular coordinates.'
            answer: '(sqrt(3), 0, 1)'
            answer_contract: {"kind":"coordinates","arity":3}
            solution_sketch: 'Use $x = \rho\sin\varphi\cos\theta$, $y = \rho\sin\varphi\sin\theta$ and $z = \rho\cos\varphi$. This gives $x = 2\sin\frac{\pi}{3}\cos 0 = \sqrt{3}$, $y = 0$ and $z = 2\cos\frac{\pi}{3} = 1$.'
          - problem: 'Convert the spherical point $(\rho, \varphi, \theta) = \left(4, \frac{\pi}{6}, \frac{\pi}{2}\right)$ to rectangular coordinates.'
            answer: '(0, 2, 2sqrt(3))'
            answer_contract: {"kind":"coordinates","arity":3}
            solution_sketch: 'Use $x = \rho\sin\varphi\cos\theta$, $y = \rho\sin\varphi\sin\theta$ and $z = \rho\cos\varphi$. Then $x = 4 \cdot \frac{1}{2} \cdot 0 = 0$, $y = 4 \cdot \frac{1}{2} \cdot 1 = 2$ and $z = 4 \cdot \frac{\sqrt{3}}{2} = 2\sqrt{3}$.'
          - problem: 'Find the spherical coordinates $(\rho, \varphi, \theta)$ of the point with rectangular coordinates $(0, 3, 3\sqrt{3})$.'
            answer: '(6, pi/6, pi/2)'
            answer_contract: {"kind":"coordinates","arity":3}
            solution_sketch: 'The distance is $\rho = \sqrt{0 + 9 + 27} = 6$. Then $\cos\varphi = \frac{3\sqrt{3}}{6} = \frac{\sqrt{3}}{2}$ gives $\varphi = \frac{\pi}{6}$, and the point lies on the positive $y$-axis side, so $\theta = \frac{\pi}{2}$.'
          - problem: 'A point has rectangular coordinates $(4, -4, 4\sqrt{2})$. Find its spherical coordinate $\rho$.'
            answer: '8'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The coordinate $\rho$ is the distance from the origin. So $\rho = \sqrt{16 + 16 + 32} = \sqrt{64} = 8$.'
          - problem: 'A radar station at the origin finds an aircraft at distance $10$ kilometres, at an angle $\varphi = \frac{\pi}{3}$ from the upward vertical ($z$-axis) and with $\theta = \frac{\pi}{2}$. How high is the aircraft above the station?'
            answer: '5'
            answer_contract: {"kind":"unit","quantity":"length","unit":"km","allow_omitted":true}
            solution_sketch: 'The height is the coordinate $z = \rho\cos\varphi$. So $z = 10\cos\frac{\pi}{3} = 10 \cdot \frac{1}{2} = 5$ kilometres.'
          - problem: 'A drone hovers at the point $(2, 2, 2\sqrt{2})$ metres, where the $z$-axis points up. Find the polar angle $\varphi$ of the drone.'
            answer: 'pi/4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The distance is $\rho = \sqrt{4 + 4 + 8} = 4$. Then $\cos\varphi = \frac{2\sqrt{2}}{4} = \frac{\sqrt{2}}{2}$, so $\varphi = \frac{\pi}{4}$.'
          - problem: 'A solid is the part of the ball $x^2 + y^2 + z^2 \le 25$ that lies above the cone $z = \sqrt{x^2 + y^2}$. In spherical coordinates the solid is $0 \le \rho \le 5$, $0 \le \theta \le 2\pi$ and $0 \le \varphi \le b$. What is $b$?'
            answer: 'pi/4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'On the cone $z = \sqrt{x^2+y^2}$ we have $z = r$, so $\tan\varphi = \frac{r}{z} = 1$ and $\varphi = \frac{\pi}{4}$. The solid above the cone has smaller $\varphi$, so $b = \frac{\pi}{4}$.'
          - problem: 'A solid is the part of the ball $x^2 + y^2 + z^2 \le 4$ that lies above the cone $z = \sqrt{3}\sqrt{x^2 + y^2}$. In spherical coordinates it is $0 \le \rho \le 2$, $0 \le \theta \le 2\pi$ and $0 \le \varphi \le b$. What is $b$?'
            answer: 'pi/6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'On the cone $z = \sqrt{3}\,r$, so $\tan\varphi = \frac{r}{z} = \frac{1}{\sqrt{3}}$ and $\varphi = \frac{\pi}{6}$. The solid above the cone has smaller $\varphi$, so $b = \frac{\pi}{6}$.'
          - problem: 'A solid is the part of the ball $x^2 + y^2 + z^2 \le 4$ that lies below the $xy$-plane, where $z \le 0$. In spherical coordinates the solid is $0 \le \rho \le 2$, $0 \le \theta \le 2\pi$ and $a \le \varphi \le \pi$. What is $a$?'
            answer: 'pi/2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The $xy$-plane is the surface $\varphi = \frac{\pi}{2}$, because there $z = \rho\cos\varphi = 0$. Points below the plane have $z < 0$, so $\cos\varphi < 0$ and $\varphi$ is larger than $\frac{\pi}{2}$, which gives $a = \frac{\pi}{2}$.'
          - problem: 'What is the value of $z$ for the spherical point $(\rho, \varphi, \theta) = \left(6, \frac{\pi}{6}, \frac{\pi}{3}\right)$?'
            answer: '3sqrt(3)'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The height is $z = \rho\cos\varphi$. So $z = 6\cos\frac{\pi}{6} = 6 \cdot \frac{\sqrt{3}}{2} = 3\sqrt{3}$.'
        constraints: 'angles at standard unit-circle values; conversions both ways, balls, half-balls and cones as regions, one bound asked at a time; word problems use a radar or drone position'
      - id: kp2
        name: "Evaluating spherical integrals"
        key_prerequisites: [triple-integrals-cylindrical]
        exemplars:
          - problem: 'Use spherical coordinates to find the volume of the ball of radius $3$.'
            answer: '36pi'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The volume is $\int_0^{2\pi}\int_0^{\pi}\int_0^3 \rho^2\sin\varphi\,d\rho\,d\varphi\,d\theta$. The three factors are $9$, $2$ and $2\pi$, so $V = 9 \cdot 2 \cdot 2\pi = 36\pi$.'
          - problem: 'Evaluate $\iiint_E z\,dV$, where $E$ is the upper half of the unit ball.'
            answer: 'pi/4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Since $z = \rho\cos\varphi$, the integral is $\int_0^{2\pi}\int_0^{\pi/2}\int_0^1 \rho^3\cos\varphi\sin\varphi\,d\rho\,d\varphi\,d\theta$. The factors are $\frac{1}{4}$, $\frac{1}{2}$ and $2\pi$, so the value is $\frac{\pi}{4}$.'
          - problem: 'Let $E$ be the ball of radius $4$ centered at the origin. Use spherical coordinates to find the volume of $E$.'
            answer: '256pi/3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'A full ball has $0 \le \varphi \le \pi$ and $0 \le \theta \le 2\pi$. The volume is $\int_0^{2\pi}\int_0^{\pi}\int_0^4 \rho^2\sin\varphi\,d\rho\,d\varphi\,d\theta = \frac{64}{3} \cdot 2 \cdot 2\pi = \frac{256\pi}{3}$.'
          - problem: 'Evaluate $\iiint_B e^{(x^2+y^2+z^2)^{3/2}}\,dV$, where $B$ is the unit ball.'
            answer: '4pi(e - 1)/3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The integrand is $e^{\rho^3}$, so the $\rho$-integral is $\int_0^1 e^{\rho^3}\rho^2\,d\rho = \frac{e - 1}{3}$. The other factors are $2$ and $2\pi$, so the value is $\frac{4\pi(e-1)}{3}$.'
          - problem: 'A solid ball of radius $3$ metres has density equal to the distance from its center, $\rho$ kilograms per cubic metre at distance $\rho$ metres. Find its mass.'
            answer: '81pi'
            answer_contract: {"kind":"unit","quantity":"mass","unit":"kg","allow_omitted":true}
            solution_sketch: 'The mass is $\int_0^{2\pi}\int_0^{\pi}\int_0^3 \rho \cdot \rho^2\sin\varphi\,d\rho\,d\varphi\,d\theta$. The factors are $\frac{81}{4}$, $2$ and $2\pi$, so $m = 81\pi$ kilograms.'
          - problem: 'What is the average distance from the center to a point of a solid ball of radius $3$ metres?'
            answer: '9/4'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'The integral of the distance $\rho$ over the ball is $81\pi$ and the volume is $36\pi$. The average distance is $81\pi \div 36\pi = \frac{9}{4}$ metres.'
          - problem: 'Let $E$ be the upper half of the ball of radius $2$ centered at the origin. Use spherical coordinates to evaluate $\iiint_E z\,dV$.'
            answer: '4pi'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Since $z = \rho\cos\varphi$, the integral separates into $\int_0^2 \rho^3\,d\rho = 4$, $\int_0^{\pi/2}\cos\varphi\sin\varphi\,d\varphi = \frac{1}{2}$ and $2\pi$. The value is $4 \cdot \frac{1}{2} \cdot 2\pi = 4\pi$.'
          - problem: 'A dome is a hemisphere of radius $5$ metres. Use spherical coordinates to find the volume of air it encloses.'
            answer: '250pi/3'
            answer_contract: {"kind":"unit","quantity":"cubic_volume","unit":"m^3","allow_omitted":true}
            solution_sketch: 'The dome is $0 \le \rho \le 5$, $0 \le \varphi \le \frac{\pi}{2}$ and $0 \le \theta \le 2\pi$. So $V = \frac{125}{3} \cdot 1 \cdot 2\pi = \frac{250\pi}{3}$ cubic metres.'
          - problem: 'A solid ball of radius $2$ metres has constant density and a mass of $64$ kilograms. What is its density in kilograms per cubic metre?'
            answer: '6/pi'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The volume of the ball is $\int_0^{2\pi}\int_0^{\pi}\int_0^2 \rho^2\sin\varphi\,d\rho\,d\varphi\,d\theta = \frac{32\pi}{3}$. Density is mass divided by volume, so it is $64 \cdot \frac{3}{32\pi} = \frac{6}{\pi}$.'
          - problem: 'Let $E$ be the ball of radius $2$ centered at the origin. Use spherical coordinates to evaluate $\iiint_E \rho\,dV$.'
            answer: '16pi'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The integrand is $\rho$, so the $\rho$-integral is $\int_0^2 \rho^3\,d\rho = 4$. The other factors are $2$ and $2\pi$, so the value is $4 \cdot 2 \cdot 2\pi = 16\pi$.'
        constraints: 'balls and half-balls centered at the origin; integrands are functions of rho alone or carry a single factor of cos(phi) (z = rho cos phi); dV = rho^2 sin(phi) d rho d phi d theta; the triple integral separates into a product of three one-variable integrals; word problems give mass, average distance or density of a ball'
      - id: kp3
        name: "Jacobians and choosing a coordinate system"
        key_prerequisites: [triple-integrals-cylindrical, partial-derivatives-trig-exp, determinants-2x2]
        exemplars:
          - problem: 'Compute the Jacobian $\frac{\partial(x, y)}{\partial(r, \theta)}$ for the polar map $x = r\cos\theta$, $y = r\sin\theta$.'
            answer: 'r'
            answer_contract: {"kind":"function","vars":["r"]}
            solution_sketch: 'The Jacobian is the determinant with rows $(\cos\theta, -r\sin\theta)$ and $(\sin\theta, r\cos\theta)$. It equals $r\cos^2\theta + r\sin^2\theta = r$.'
          - problem: 'Find the volume of the ice-cream cone region inside the cone $\varphi \le \frac{\pi}{3}$ and the sphere $\rho \le 1$.'
            answer: 'pi/3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The volume is $\int_0^{2\pi}\int_0^{\pi/3}\int_0^1 \rho^2\sin\varphi\,d\rho\,d\varphi\,d\theta$. The factors are $\frac{1}{3}$, $1 - \cos\frac{\pi}{3} = \frac{1}{2}$ and $2\pi$, so $V = \frac{\pi}{3}$.'
          - problem: 'The solid $E$ is the ball $x^2 + y^2 + z^2 \le 9$ and the integrand is $x^2 + y^2 + z^2$. Which coordinate system makes this integral easiest: rectangular, cylindrical or spherical?'
            answer: 'spherical'
            answer_contract: {"kind":"label","options":[["spherical","spherical coordinates","spherical coordinate system"],["cylindrical","cylindrical coordinates","cylindrical coordinate system"],["rectangular","rectangular coordinates","cartesian","cartesian coordinates"]]}
            solution_sketch: 'Both the ball and the integrand are described by $\rho$, because $x^2 + y^2 + z^2 = \rho^2$ and the ball is $\rho \le 3$. So the limits are constants in spherical coordinates.'
          - problem: 'A hollow ball has inner radius $1$ metre and outer radius $2$ metres. Its density at distance $\rho$ metres from the center is $\frac{1}{\rho}$ kilograms per cubic metre. Find its mass.'
            answer: '6pi'
            answer_contract: {"kind":"unit","quantity":"mass","unit":"kg","allow_omitted":true}
            solution_sketch: 'The mass is $\int_0^{2\pi}\int_0^{\pi}\int_1^2 \frac{1}{\rho}\rho^2\sin\varphi\,d\rho\,d\varphi\,d\theta$. The factors are $\int_1^2 \rho\,d\rho = \frac{3}{2}$, $2$ and $2\pi$, so $m = 6\pi$ kilograms.'
          - problem: 'An ice-cream treat is the solid with its tip at the origin, bounded by the cone $\varphi = \frac{\pi}{3}$ and the sphere $\rho = 6$ centimetres. Find its volume.'
            answer: '72pi'
            answer_contract: {"kind":"unit","quantity":"cubic_volume","unit":"cm^3","allow_omitted":true}
            solution_sketch: 'The volume is $\int_0^{2\pi}\int_0^{\pi/3}\int_0^6 \rho^2\sin\varphi\,d\rho\,d\varphi\,d\theta$. The factors are $72$, $\frac{1}{2}$ and $2\pi$, so $V = 72\pi$ cubic centimetres.'
          - problem: 'Find the average value of $z$ over the upper half of the unit ball.'
            answer: '3/8'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The integral of $z$ over the half-ball is $\frac{\pi}{4}$ and the volume is $\frac{2\pi}{3}$. The average value is $\frac{\pi}{4} \div \frac{2\pi}{3} = \frac{3}{8}$.'
          - problem: 'The solid $E$ is the cylinder $x^2 + y^2 \le 4$, $0 \le z \le 3$ and the integrand is $x^2 + y^2$. Which coordinate system makes this integral easiest: rectangular, cylindrical or spherical?'
            answer: 'cylindrical'
            answer_contract: {"kind":"label","options":[["spherical","spherical coordinates","spherical coordinate system"],["cylindrical","cylindrical coordinates","cylindrical coordinate system"],["rectangular","rectangular coordinates","cartesian","cartesian coordinates"]]}
            solution_sketch: 'The solid is bounded by $r = 2$ and by the planes $z = 0$ and $z = 3$, and the integrand is $r^2$. So the limits are constants in cylindrical coordinates.'
          - problem: 'Find the volume of the solid inside the cone $\varphi \le \frac{\pi}{6}$ and the sphere $\rho \le 3$.'
            answer: '9pi(2 - sqrt(3))'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The volume is $\int_0^{2\pi}\int_0^{\pi/6}\int_0^3 \rho^2\sin\varphi\,d\rho\,d\varphi\,d\theta = 2\pi \cdot \left(1 - \frac{\sqrt{3}}{2}\right) \cdot 9$. This equals $9\pi(2 - \sqrt{3})$.'
          - problem: 'The polar map $x = r\cos\theta$, $y = r\sin\theta$ is used near the point with $r = 3$ and $\theta = \frac{\pi}{4}$. By what factor does the map multiply small areas there?'
            answer: '3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Small areas are multiplied by the Jacobian of the map. The Jacobian of the polar map is $r$, so near $r = 3$ the factor is $3$.'
        constraints: '2x2 Jacobians only; cone half-angles at standard unit-circle values; at most two items ask which coordinate system to use; word problems use solids bounded by spheres and cones centered at the origin'
    diagnostic_exemplar:
      problem: 'Use spherical coordinates to find the volume of the region inside the sphere $\rho \le 2$ and above the cone $\varphi \le \frac{\pi}{3}$.'
      answer: '$\dfrac{8\pi}{3}$'
      answer_contract: {kind: none}
      solution_sketch: '$V = \int_0^{2\pi}\!\int_0^{\pi/3}\!\int_0^2 \rho^2 \sin\varphi \,d\rho\,d\varphi\,d\theta = 2\pi \cdot \tfrac{8}{3} \cdot \left[-\cos\varphi\right]_0^{\pi/3} = 2\pi \cdot \tfrac{8}{3} \cdot \tfrac{1}{2} = \tfrac{8\pi}{3}$.'
    anki_seeds:
      - front: 'Volume element in spherical coordinates?'
        back: '$dV = \rho^2 \sin\varphi \, d\rho \, d\varphi \, d\theta$'
        type: basic
      - front: 'Spherical-to-rectangular conversion formulas?'
        back: '$x = \rho\sin\varphi\cos\theta$, $y = \rho\sin\varphi\sin\theta$, $z = \rho\cos\varphi$.'
        type: basic

  - id: change-of-variables-jacobians
    name: "Change of Variables and Jacobians"
    core: false                # terminal capstone of the multiple-integral module
    difficulty: 0.84
    drill: false
    answer_kind: numeric
    expected_time_secs: 300
    prerequisites:
      - id: double-integrals
        weight: 0.7
        key: true
      - id: partial-derivatives-trig-exp
        weight: 0.6
        key: true
      - id: determinants-2x2
        weight: 0.6
        key: true
      - id: cylindrical-spherical-coordinates
        weight: 0.3
        key: false
    knowledge_points:
      - id: kp1
        name: "Computing Jacobians of transformations"
        key_prerequisites: [double-integrals, partial-derivatives-trig-exp, determinants-2x2]
        try_first:
          problem: 'The map $x = 2u$, $y = 3v$ sends the square $0 \le u \le 1$, $0 \le v \le 1$ onto a rectangle in the $xy$-plane. What is the area of that rectangle?'
          answer_contract: {"kind":"exact"}
          answer: '6'
          reveal: 'The rectangle is $2$ by $3$, so its area is $6$. This equals the determinant $\begin{vmatrix} 2 & 0 \\ 0 & 3 \end{vmatrix} = 6$: the Jacobian is the factor by which the map multiplies areas.'
        exemplars:
          - problem: 'Compute the Jacobian $\frac{\partial(x, y)}{\partial(u, v)}$ for $x = 2u + v$, $y = u + 2v$.'
            answer: '3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The partial derivatives are $x_u = 2$, $x_v = 1$, $y_u = 1$ and $y_v = 2$. The Jacobian is the determinant $2 \cdot 2 - 1 \cdot 1 = 3$.'
          - problem: 'Compute the Jacobian $\frac{\partial(x, y)}{\partial(u, v)}$ for $x = u^2 - v^2$, $y = 2uv$.'
            answer: '4u^2 + 4v^2'
            answer_contract: {"kind":"function","vars":["u","v"]}
            solution_sketch: 'The partial derivatives are $x_u = 2u$, $x_v = -2v$, $y_u = 2v$ and $y_v = 2u$. The determinant is $(2u)(2u) - (-2v)(2v) = 4u^2 + 4v^2$.'
          - problem: 'Compute the Jacobian $\frac{\partial(x, y)}{\partial(u, v)}$ for $x = 3u + 2v$, $y = u + 5v$.'
            answer: '13'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The partial derivatives are $x_u = 3$, $x_v = 2$, $y_u = 1$ and $y_v = 5$. The determinant is $3 \cdot 5 - 2 \cdot 1 = 13$.'
          - problem: 'The map $x = 4u + v$, $y = 2u + 3v$ sends the unit square $0 \le u \le 1$, $0 \le v \le 1$ onto a parallelogram in the $xy$-plane. What is the area of the parallelogram?'
            answer: '10'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The area of the image of the unit square is the absolute value of the Jacobian. The determinant is $4 \cdot 3 - 1 \cdot 2 = 10$, so the area is $10$.'
          - problem: 'Compute the Jacobian $\frac{\partial(x, y)}{\partial(u, v)}$ for $x = u^2 + v^2$, $y = uv$.'
            answer: '2u^2 - 2v^2'
            answer_contract: {"kind":"function","vars":["u","v"]}
            solution_sketch: 'The partial derivatives are $x_u = 2u$, $x_v = 2v$, $y_u = v$ and $y_v = u$. The determinant is $(2u)(u) - (2v)(v) = 2u^2 - 2v^2$.'
          - problem: 'Find the Jacobian of $x = 3u + 4v$, $y = 2u + v$.'
            answer: '-5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'A determinant subtracts the two products: $x_u y_v - x_v y_u$. So the Jacobian is $3 \cdot 1 - 4 \cdot 2 = -5$.'
          - problem: 'Compute the Jacobian $\frac{\partial(x, y)}{\partial(u, v)}$ for $x = u^2 - v$, $y = u + v^2$.'
            answer: '4uv + 1'
            answer_contract: {"kind":"function","vars":["u","v"]}
            solution_sketch: 'The partial derivatives are $x_u = 2u$, $x_v = -1$, $y_u = 1$ and $y_v = 2v$. The determinant is $(2u)(2v) - (-1)(1) = 4uv + 1$.'
          - problem: 'The map $x = 3u + v$, $y = u + 2v$ sends a region $S$ in the $uv$-plane onto a region $R$ in the $xy$-plane. The area of $R$ is $35$. What is the area of $S$?'
            answer: '7'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The map multiplies areas by the Jacobian $3 \cdot 2 - 1 \cdot 1 = 5$. So $35 = 5 \cdot (\text{area of } S)$, and dividing by $5$ gives area $7$.'
          - problem: 'Compute the Jacobian $\frac{\partial(x, y)}{\partial(u, v)}$ for $x = 5u - v$, $y = 2u + 3v$.'
            answer: '17'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The partial derivatives are $x_u = 5$, $x_v = -1$, $y_u = 2$ and $y_v = 3$. The determinant is $5 \cdot 3 - (-1)(2) = 17$.'
          - problem: 'Find the value of the Jacobian of $x = u^2 - v^2$, $y = 2uv$ at the point $(u, v) = (1, 2)$.'
            answer: '20'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The Jacobian is $4u^2 + 4v^2$ at every point. At $(1, 2)$ it equals $4 \cdot 1 + 4 \cdot 4 = 20$.'
        constraints: 'linear or classic quadratic maps; Jacobians are integers or clean polynomials in u, v; word problems ask for the area scale factor of a map'
      - id: kp2
        name: "Transforming double integrals"
        key_prerequisites: [double-integrals, determinants-2x2]
        exemplars:
          - problem: 'Evaluate $\iint_R (x + y)\,dA$, where $R$ is the parallelogram with vertices $(0,0)$, $(2,1)$, $(3,3)$ and $(1,2)$, using $x = 2u + v$, $y = u + 2v$.'
            answer: '9'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The map sends the unit square to $R$ and has Jacobian $3$. On the square $x + y = 3u + 3v$, so the integral is $\int_0^1\int_0^1 (3u + 3v) \cdot 3\,du\,dv = 3 \cdot 3 = 9$.'
          - problem: 'Evaluate $\iint_R e^{(x-y)/(x+y)}\,dA$, where $R$ is the triangle bounded by $x = 0$, $y = 0$ and $x + y = 1$, using $u = x - y$, $v = x + y$.'
            answer: '(e - 1/e)/4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Solving gives $x = \frac{u+v}{2}$ and $y = \frac{v-u}{2}$, with $|J| = \frac{1}{2}$. The triangle becomes $0 \le v \le 1$, $-v \le u \le v$, so the integral is $\frac{1}{2}\int_0^1 v\left(e - e^{-1}\right)dv = \frac{1}{4}\left(e - \frac{1}{e}\right)$.'
          - problem: 'Evaluate $\iint_R (x + 2y)\,dA$ over the rectangle with vertices $(0,0)$, $(2,0)$, $(2,3)$ and $(0,3)$, using $x = 2u$, $y = 3v$.'
            answer: '24'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The integral needs the Jacobian. Here $J = 2 \cdot 3 = 6$, so the integral is $6\int_0^1\int_0^1 (2u + 6v)\,du\,dv = 6 \cdot 4 = 24$.'
          - problem: 'Evaluate $\iint_R (x + 2y)\,dA$, where $R$ is the parallelogram with vertices $(0,0)$, $(1,2)$, $(3,5)$ and $(2,3)$, using $x = u + 2v$, $y = 2u + 3v$.'
            answer: '13/2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The Jacobian is $1 \cdot 3 - 2 \cdot 2 = -1$, so $|J| = 1$. On the unit square $x + 2y = 5u + 8v$, so the integral is $\int_0^1\int_0^1 (5u + 8v)\,du\,dv = \frac{5}{2} + 4 = \frac{13}{2}$.'
          - problem: 'Evaluate $\iint_R (x + y)\,dA$, where $R$ is the triangle with vertices $(0,0)$, $(1,0)$ and $(0,1)$, using $u = x + y$, $v = x - y$.'
            answer: '1/3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Solving gives $x = \frac{u+v}{2}$ and $y = \frac{u-v}{2}$, with $|J| = \frac{1}{2}$. The triangle becomes $0 \le u \le 1$, $-u \le v \le u$, so the integral is $\int_0^1 u \cdot \frac{1}{2} \cdot 2u\,du = \frac{1}{3}$.'
          - problem: 'A metal plate lies in the parallelogram with corners $(0,0)$, $(3,1)$, $(4,3)$ and $(1,2)$, with lengths in metres. Its density at $(x,y)$ is $2x + y$ kilograms per square metre. Use $x = 3u + v$, $y = u + 2v$ to find the mass of the plate.'
            answer: '55/2'
            answer_contract: {"kind":"unit","quantity":"mass","unit":"kg","allow_omitted":true}
            solution_sketch: 'The Jacobian is $3 \cdot 2 - 1 \cdot 1 = 5$ and the density is $2x + y = 7u + 4v$. So $m = \int_0^1\int_0^1 (7u + 4v) \cdot 5\,du\,dv = 5\left(\frac{7}{2} + 2\right) = \frac{55}{2}$ kilograms.'
          - problem: 'Evaluate $\iint_R (x^2 - y^2)\,dA$, where $R$ is the diamond with vertices $(0,0)$, $(1,1)$, $(2,0)$ and $(1,-1)$, using $x = u + v$, $y = u - v$.'
            answer: '2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The Jacobian is $1 \cdot (-1) - 1 \cdot 1 = -2$, so $|J| = 2$. On the unit square $x^2 - y^2 = 4uv$, so the integral is $\int_0^1\int_0^1 4uv \cdot 2\,du\,dv = 8 \cdot \frac{1}{4} = 2$.'
          - problem: 'A parallelogram-shaped solar panel has corners $(0,0)$, $(2,1)$, $(3,3)$ and $(1,2)$, with lengths in metres. The power it receives per square metre at $(x,y)$ is $x + y$ watts. What is the average power per square metre over the panel?'
            answer: '3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Using $x = 2u + v$, $y = u + 2v$, the integral of $x + y$ over the panel is $9$ and the area of the panel is the Jacobian $3$. So the average is $9 \div 3 = 3$ watts per square metre.'
        constraints: 'the substitution is given; regions map to squares or triangles in the uv-plane; remember |J| and the direction of the map; word problems give a plate, a panel or a field with the substitution'
      - id: kp3
        name: "Choosing a transformation"
        key_prerequisites: [double-integrals, partial-derivatives-trig-exp, determinants-2x2]
        exemplars:
          - problem: 'Find the area of the region in the first quadrant bounded by $xy = 1$, $xy = 4$, $y = x$ and $y = 4x$, using $u = xy$, $v = y/x$.'
            answer: '3ln(2)'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Here $x = \sqrt{u/v}$, $y = \sqrt{uv}$ and $|J| = \frac{1}{2v}$, and the region is $1 \le u \le 4$, $1 \le v \le 4$. The area is $3 \cdot \frac{1}{2}\ln 4 = 3\ln 2$.'
          - problem: 'The region is bounded by the lines $y = x$, $y = x + 3$, $y = -x$ and $y = -x + 4$. Choose new variables that turn the boundary lines into constant coordinate lines, and find the area of the region.'
            answer: '6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Take $u = y - x$ and $v = y + x$, so the region is $0 \le u \le 3$ and $0 \le v \le 4$. The Jacobian is $\frac{1}{2}$ in absolute value, so the area is $3 \cdot 4 \cdot \frac{1}{2} = 6$.'
          - problem: 'Use $u = x + y$ and $v = x - y$ on the region bounded by $x + y = 1$, $x + y = 4$, $x - y = 0$ and $x - y = 3$. Find the area of the region.'
            answer: '9/2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The region is $1 \le u \le 4$ and $0 \le v \le 3$, a rectangle of area $9$. The map $x = \frac{u+v}{2}$, $y = \frac{u-v}{2}$ has $|J| = \frac{1}{2}$, so the area is $\frac{9}{2}$.'
          - problem: 'Use $u = x + y$ and $v = x - y$ on the region bounded by $x + y = 0$, $x + y = 2$, $x - y = 0$ and $x - y = 4$. Evaluate the double integral of $(x + y)^2$ over the region.'
            answer: '16/3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The region is $0 \le u \le 2$ and $0 \le v \le 4$, and $|J| = \frac{1}{2}$. So the integral is $\int_0^4\int_0^2 u^2 \cdot \frac{1}{2}\,du\,dv = \frac{1}{2} \cdot \frac{8}{3} \cdot 4 = \frac{16}{3}$.'
          - problem: 'A garden bed is bounded by fences along the lines $y = 2x$, $y = 2x + 4$, $y = -x$ and $y = -x + 2$, with lengths in metres. Choose new variables that turn the fences into constant coordinate lines, and find the area of the bed.'
            answer: '8/3'
            answer_contract: {"kind":"unit","quantity":"area","unit":"m^2","allow_omitted":true}
            solution_sketch: 'Take $u = y - 2x$ and $v = y + x$, so the bed is $0 \le u \le 4$ and $0 \le v \le 2$. Solving gives $x = \frac{v - u}{3}$, $y = \frac{u + 2v}{3}$ with $|J| = \frac{1}{3}$, so the area is $8 \cdot \frac{1}{3} = \frac{8}{3}$ square metres.'
          - problem: 'A field is bounded by the lines $y = x$, $y = x + 5$, $y = -x$ and $y = -x + 4$, with lengths in kilometres. One bag of seed covers $\frac{1}{2}$ square kilometre. How many bags are needed to cover the field?'
            answer: '20'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Take $u = y - x$ and $v = y + x$, so the field is $0 \le u \le 5$ and $0 \le v \le 4$ with $|J| = \frac{1}{2}$. The area is $20 \cdot \frac{1}{2} = 10$ square kilometres, and dividing by $\frac{1}{2}$ gives $20$ bags.'
          - problem: 'Use polar coordinates $x = r\cos\theta$, $y = r\sin\theta$ on the disk $x^2 + y^2 \le 9$. Evaluate the double integral of $x^2 + y^2$ over the disk.'
            answer: '81pi/2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'In polar coordinates $x^2 + y^2 = r^2$ and $dA = r\,dr\,d\theta$. So the integral is $\int_0^{2\pi}\int_0^3 r^3\,dr\,d\theta = \frac{81}{4} \cdot 2\pi = \frac{81\pi}{2}$.'
          - problem: 'A round plate $x^2 + y^2 \le 4$, with lengths in metres, has density $x^2 + y^2$ kilograms per square metre. Use polar coordinates to find its mass.'
            answer: '8pi'
            answer_contract: {"kind":"unit","quantity":"mass","unit":"kg","allow_omitted":true}
            solution_sketch: 'In polar coordinates the density is $r^2$ and $dA = r\,dr\,d\theta$. So $m = \int_0^{2\pi}\int_0^2 r^3\,dr\,d\theta = 4 \cdot 2\pi = 8\pi$ kilograms.'
        constraints: 'boundary curves become u = const, v = const; final answers involve at most one logarithm; word problems give a garden bed, a field or a plate bounded by the curves'
    diagnostic_exemplar:
      problem: 'Evaluate $\iint_R (x + y)\,dA$, where $R$ is the parallelogram with vertices $(0,0)$, $(3,1)$, $(4,3)$, $(1,2)$, using the change of variables $x = 3u + v$, $y = u + 2v$.'
      answer: '$\dfrac{35}{2}$'
      answer_contract: {kind: none}
      solution_sketch: 'The map sends the unit square $0 \le u, v \le 1$ onto $R$, and its Jacobian is $3 \cdot 2 - 1 \cdot 1 = 5$. Since $x + y = 4u + 3v$, the integral is $\int_0^1\!\int_0^1 (4u + 3v)\cdot 5\,du\,dv = 5\left(2 + \tfrac{3}{2}\right) = \tfrac{35}{2}$.'
    anki_seeds:
      - front: 'Change-of-variables formula for double integrals?'
        back: '$\iint_R f(x,y)\, dA = \iint_S f(x(u,v), y(u,v)) \left|\frac{\partial(x,y)}{\partial(u,v)}\right| du\, dv$'
        type: basic
      - front: 'How does polar coordinates fit the change-of-variables theorem?'
        back: 'It is the special case $x = r\cos\theta$, $y = r\sin\theta$ with Jacobian $r$ — hence $dA = r\,dr\,d\theta$.'
        type: basic
