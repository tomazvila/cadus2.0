unit: space
course: multivariable-calculus
module: "Vectors & Space Curves"
topics:
  - id: three-dimensional-coordinates
    name: "The Three-Dimensional Coordinate System"
    core: true
    difficulty: 0.55
    drill: false
    answer_kind: numeric
    expected_time_secs: 90
    prerequisites:
      - id: pythagorean-theorem
        weight: 0.6
        key: true
      - id: distance-midpoint-formulas
        weight: 0.5
        key: true
      - id: coordinate-plane
        weight: 0.4
        key: false
    knowledge_points:
      - id: kp1
        name: "Points, axes, and coordinate planes"
        key_prerequisites: [coordinate-plane]
        exemplars:
          - problem: 'How far is the point $(5, -2, 6)$ from the $xz$-plane?'
            answer: '2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The $xz$-plane is the plane $y = 0$, so the distance is the absolute value of the $y$-coordinate. Here $|-2| = 2$.'
          - problem: 'In which coordinate plane does the point $(3, 0, -2)$ lie?'
            answer: 'xz-plane'
            answer_contract: {"kind":"label","options":[["xz-plane","the xz-plane","xz plane","the xz plane","xz"],["xy-plane","the xy-plane","xy plane","the xy plane","xy"],["yz-plane","the yz-plane","yz plane","the yz plane","yz"]]}
            solution_sketch: 'The $y$-coordinate of the point is zero, so the point lies in the plane $y = 0$. That plane holds the $x$-axis and the $z$-axis, so it is the $xz$-plane.'
          - problem: 'Find the projection of the point $(4, -1, 7)$ onto the $xy$-plane.'
            answer: '(4, -1, 0)'
            answer_contract: {"kind":"coordinates","arity":3}
            solution_sketch: 'The projection onto the $xy$-plane keeps $x$ and $y$ and sets $z$ to zero. So $(4, -1, 7)$ goes to $(4, -1, 0)$.'
          - problem: 'A drone hovers at $(120, 80, 45)$ meters. The $xy$-plane is the ground, $x$ points east, $y$ points north and $z$ points up. How high above the ground is the drone?'
            answer: '45'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'The ground is the $xy$-plane, so the height of the drone is its $z$-coordinate. The drone is $45$ m above the ground.'
          - problem: 'The point $P(2, -5, 3)$ is reflected in the $xz$-plane. Find the image of $P$.'
            answer: '(2, 5, 3)'
            answer_contract: {"kind":"coordinates","arity":3}
            solution_sketch: 'A reflection in the $xz$-plane keeps $x$ and $z$ and changes the sign of $y$. So $(2, -5, 3)$ goes to $(2, 5, 3)$.'
          - problem: 'A drone hovers at $(30, 40, 12)$ meters above the ground, which is the $xy$-plane. It descends straight down at $0.5$ m/s. How long does it take to land?'
            answer: '24'
            answer_contract: {"kind":"unit","quantity":"time","unit":"s","allow_omitted":true}
            solution_sketch: 'The drone is $12$ m above the ground, and it covers $0.5$ m each second. So it takes $12 \div 0.5 = 24$ s to land.'
          - problem: 'Drop a perpendicular from the point $(3, -4, 8)$ to the $z$-axis. Find the point where it meets the $z$-axis.'
            answer: '(0, 0, 8)'
            answer_contract: {"kind":"coordinates","arity":3}
            solution_sketch: 'Every point of the $z$-axis has $x = 0$ and $y = 0$. The perpendicular keeps the height, so the foot is $(0, 0, 8)$.'
          - problem: 'A mine is mapped with the ground as the $xy$-plane and $z$ pointing up. A tunnel junction is at $(200, -150, -60)$ meters. How far below the ground is the junction?'
            answer: '60'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'The ground is the plane $z = 0$, so the depth is the absolute value of the $z$-coordinate. Here $|-60| = 60$ m.'
          - problem: 'How far is the point $(-4, 3, 7)$ from the $yz$-plane?'
            answer: '4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The $yz$-plane is the plane $x = 0$, so the distance is the absolute value of the $x$-coordinate. Here $|-4| = 4$.'
        constraints: "integer coordinates; ask about one coordinate plane or axis at a time"
      - id: kp2
        name: "Distance in space"
        key_prerequisites: [pythagorean-theorem, distance-midpoint-formulas]
        try_first:
          problem: 'A room is $2$ m long, $3$ m wide and $6$ m high. How long is the straight line from a floor corner to the opposite corner of the ceiling?'
          answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
          answer: '7'
          reveal: 'The squares of the three edges add up: $4 + 9 + 36 = 49$, and $\sqrt{49} = 7$. Distance in space is the Pythagorean theorem with a third square.'
        exemplars:
          - problem: 'Find the distance between the points $(2, -1, 3)$ and $(5, 3, 15)$.'
            answer: '13'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The coordinate differences are $3$, $4$ and $12$. So $d = \sqrt{9 + 16 + 144} = \sqrt{169} = 13$.'
          - problem: 'Find the distance from the origin to the point $(4, -4, 7)$.'
            answer: '9'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The squares of the coordinates are $16$, $16$ and $49$. So $d = \sqrt{81} = 9$.'
          - problem: 'A drone flies in a straight line from $A(3, 1, 4)$ to $B(5, 7, 13)$, with coordinates in meters. How far does it fly?'
            answer: '11'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'The coordinate differences are $2$, $6$ and $9$. So the distance is $\sqrt{4 + 36 + 81} = \sqrt{121} = 11$ m.'
          - problem: 'A drone flies in a straight line at a constant $5$ m/s from $A(10, 0, 5)$ to $B(30, 30, 65)$, with coordinates in meters. How long does the flight take?'
            answer: '14'
            answer_contract: {"kind":"unit","quantity":"time","unit":"s","allow_omitted":true}
            solution_sketch: 'The coordinate differences are $20$, $30$ and $60$, so the flight is $\sqrt{400 + 900 + 3600} = 70$ m long. At $5$ m/s the time is $70 \div 5 = 14$ s.'
          - problem: 'Which point is closer to the origin, $P(3, 4, 12)$ or $Q(2, 6, 9)$?'
            answer: 'Q'
            answer_contract: {"kind":"label","options":[["Q","point Q","the point Q"],["P","point P","the point P"]]}
            solution_sketch: 'The distance from the origin to $P$ is $\sqrt{9 + 16 + 144} = 13$. The distance to $Q$ is $\sqrt{4 + 36 + 81} = 11$, which is smaller, so $Q$ is closer.'
          - problem: 'A wifi router at $(2, 3, 1)$ meters reaches phones up to $6$ m away. A phone is at $(4, 9, 4)$ meters. How far outside the range of the router is the phone?'
            answer: '1'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'The phone is $\sqrt{4 + 36 + 9} = 7$ m from the router. The range is $6$ m, so the phone is $7 - 6 = 1$ m outside it.'
          - problem: 'A storage crate measures $8$ m by $9$ m by $12$ m. How long is the longest straight rod that fits inside it?'
            answer: '17'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'The longest rod runs from one corner to the opposite corner. Its length is $\sqrt{64 + 81 + 144} = \sqrt{289} = 17$ m.'
          - problem: 'The distance between $(1, 2, 3)$ and $(5, 2, z)$ is $5$, and $z > 3$. Find $z$.'
            answer: '6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The squared distance is $16 + 0 + (z - 3)^2 = 25$, so $(z - 3)^2 = 9$. Since $z > 3$, we get $z - 3 = 3$ and $z = 6$.'
          - problem: 'Sam finds the distance between $(1, 0, 2)$ and $(4, 4, 14)$ by adding the differences: $3 + 4 + 12 = 19$. What is the correct distance?'
            answer: '13'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The differences must be squared before they are added, and then the root is taken. So $d = \sqrt{9 + 16 + 144} = 13$, not $19$.'
        constraints: "coordinate differences form Pythagorean quadruples (e.g. 1-2-2-3, 2-3-6-7, 3-4-12-13) so distances are whole numbers"
      - id: kp3
        name: "Midpoints in space"
        key_prerequisites: [distance-midpoint-formulas]
        exemplars:
          - problem: 'Find the midpoint of the segment from $(2, 4, -1)$ to $(6, 0, 5)$.'
            answer: '(4, 2, 2)'
            answer_contract: {"kind":"coordinates","arity":3}
            solution_sketch: 'Average each coordinate: $\frac{2+6}{2} = 4$, $\frac{4+0}{2} = 2$ and $\frac{-1+5}{2} = 2$. The midpoint is $(4, 2, 2)$.'
          - problem: 'The midpoint of $\overline{AB}$ is $M(3, 1, 2)$ and $A = (1, -1, 0)$. Find $B$.'
            answer: '(5, 3, 4)'
            answer_contract: {"kind":"coordinates","arity":3}
            solution_sketch: 'The midpoint is the average of the endpoints, so $B = 2M - A = (6 - 1, 2 + 1, 4 - 0)$. This gives $B = (5, 3, 4)$.'
          - problem: 'Two satellites are at $(14, -8, 6)$ and $(-2, 4, 10)$. A relay is placed halfway between them. Find the position of the relay.'
            answer: '(6, -2, 8)'
            answer_contract: {"kind":"coordinates","arity":3}
            solution_sketch: 'Halfway means the midpoint, so average each coordinate. This gives $\frac{14-2}{2} = 6$, $\frac{-8+4}{2} = -2$ and $\frac{6+10}{2} = 8$, so the relay is at $(6, -2, 8)$.'
          - problem: 'A cable is stretched between the tops of two towers at $(0, 0, 40)$ and $(30, 50, 60)$ meters, where $z$ is the height above the ground. A sensor is fixed at the midpoint of the cable. How high above the ground is the sensor?'
            answer: '50'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'Only the $z$-coordinates matter for the height. The sensor is at $\frac{40 + 60}{2} = 50$ m above the ground.'
          - problem: 'A rectangular box has one corner at $P(1, 2, -3)$. The center of the box is the midpoint of the diagonal from $P$ to the opposite corner $Q$, and it is at $C(4, 3, 0)$. Find $Q$.'
            answer: '(7, 4, 3)'
            answer_contract: {"kind":"coordinates","arity":3}
            solution_sketch: 'The center is the midpoint of $PQ$, so $Q = 2C - P = (8 - 1, 6 - 2, 0 + 3)$. This gives $Q = (7, 4, 3)$.'
          - problem: 'The points $A(1, 2, 3)$ and $B(5, 6, 5)$ are the ends of a segment. How far is $A$ from the midpoint of the segment?'
            answer: '3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The distance from $A$ to $B$ is $\sqrt{16 + 16 + 4} = 6$. The midpoint is halfway, so its distance from $A$ is $6 \div 2 = 3$.'
          - problem: 'The midpoint of $\overline{AB}$ is $M(1, -2, 4)$ and $B = (3, 0, 9)$. Find $A$.'
            answer: '(-1, -4, -1)'
            answer_contract: {"kind":"coordinates","arity":3}
            solution_sketch: 'Since $M$ is the midpoint, $A = 2M - B = (2 - 3, -4 - 0, 8 - 9)$. This gives $A = (-1, -4, -1)$.'
          - problem: 'Sam finds the midpoint of $(2, 6, -4)$ and $(8, -2, 4)$ as $(10, 4, 0)$. What is the correct midpoint?'
            answer: '(5, 2, 0)'
            answer_contract: {"kind":"coordinates","arity":3}
            solution_sketch: 'Sam added the coordinates but did not divide by $2$. The correct midpoint is $\left(\frac{2+8}{2}, \frac{6-2}{2}, \frac{-4+4}{2}\right) = (5, 2, 0)$.'
        constraints: "even coordinate sums so midpoints have whole-number coordinates"
    diagnostic_exemplar:
      problem: 'The midpoint of the segment $\overline{AB}$ is $M(3, 1, 5)$ and $A = (2, -1, 3)$. Find the distance from $A$ to $B$.'
      answer: '6'
      solution_sketch: '$B = 2M - A = (4, 3, 7)$; $\overrightarrow{AB} = \langle 2, 4, 4 \rangle$ and $|\overrightarrow{AB}| = \sqrt{4 + 16 + 16} = 6$.'
    anki_seeds:
      - front: 'Distance formula in $\mathbb{R}^3$ between $(x_1,y_1,z_1)$ and $(x_2,y_2,z_2)$?'
        back: '$\sqrt{(x_2-x_1)^2 + (y_2-y_1)^2 + (z_2-z_1)^2}$'
        type: basic
      - front: 'The distance from a point $(a, b, c)$ to the $xy$-plane is {{c1::$|c|$}}.'
        back: '$|c|$'
        type: cloze

  - id: spheres-in-space
    name: "Equations of Spheres"
    core: true
    difficulty: 0.58
    drill: false
    answer_kind: numeric
    expected_time_secs: 120
    prerequisites:
      - id: three-dimensional-coordinates
        weight: 0.7
        key: true
      - id: completing-the-square
        weight: 0.6
        key: true
      - id: equations-of-circles
        weight: 0.4
        key: false
    knowledge_points:
      - id: kp1
        name: "Standard form of a sphere"
        key_prerequisites: [three-dimensional-coordinates, equations-of-circles]
        try_first:
          problem: 'Every point of a spherical shell is $3$ units from the origin. The point $(1, 2, z)$ with $z > 0$ lies on the shell. Find $z$.'
          answer_contract: {"kind":"exact"}
          answer: '2'
          reveal: 'The point is $3$ units from the origin, so $1 + 4 + z^2 = 9$ and $z = 2$. This distance condition, written with $x$, $y$ and $z$, is the equation of the sphere.'
        exemplars:
          - problem: 'Write an equation of the sphere with center $(2, -1, 0)$ and radius $5$.'
            answer: '(x - 2)^2 + (y + 1)^2 + z^2 = 25'
            answer_contract: {"kind":"polynomial_relation"}
            solution_sketch: 'Subtract each center coordinate from its variable and put the square of the radius on the right. This gives $(x - 2)^2 + (y + 1)^2 + z^2 = 25$.'
          - problem: 'A sphere has equation $(x-5)^2+y^2+(z+2)^2=17$. Find its center.'
            answer: '(5, 0, -2)'
            answer_contract: {"kind":"coordinates","arity":3}
            solution_sketch: 'Compare with $(x-h)^2+(y-k)^2+(z-l)^2=r^2$. Here $h=5$, $k=0$ and $z+2=z-(-2)$ gives $l=-2$, so the center is $(5, 0, -2)$.'
          - problem: 'A spherical tank has a diameter of $14$ m. With the origin on the ground below its center and $z$ pointing up, its center is at $(0, 0, 8)$. Write an equation of the surface of the tank.'
            answer: 'x^2 + y^2 + (z - 8)^2 = 49'
            answer_contract: {"kind":"polynomial_relation"}
            solution_sketch: 'The radius is half the diameter, so $r = 14 \div 2 = 7$ and $r^2 = 49$. The equation is $x^2 + y^2 + (z - 8)^2 = 49$.'
          - problem: 'A sphere has equation $(x+1)^2+(y-4)^2+z^2=20$. Find its radius.'
            answer: '2sqrt(5)'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The right side is $r^2 = 20$. So $r = \sqrt{20} = 2\sqrt{5}$.'
          - problem: 'A sphere has center $(-1, 2, 0)$ and passes through the point $(2, 4, 1)$. Write an equation of the sphere.'
            answer: '(x + 1)^2 + (y - 2)^2 + z^2 = 14'
            answer_contract: {"kind":"polynomial_relation"}
            solution_sketch: 'The radius squared is the squared distance from the center to the point: $r^2 = 9 + 4 + 1 = 14$. So the equation is $(x + 1)^2 + (y - 2)^2 + z^2 = 14$.'
          - problem: 'A radio mast stands at $(100, 200, 50)$ meters, and its signal reaches every point within $300$ m of the mast. Is a plane at $(220, 360, 50)$ meters within the reach of the signal?'
            answer: 'yes'
            answer_contract: {"kind":"label","options":[["yes","yes, it is","it is","inside","within reach","it is within reach","yes, it is within reach"],["no","no, it is not","it is not","outside","out of reach","it is not within reach","no, it is not within reach"]]}
            solution_sketch: 'The distance from the mast to the plane is $\sqrt{120^2 + 160^2 + 0^2} = 200$ m. This is less than $300$ m, so the plane is inside the sphere of reach.'
          - problem: 'The point $(3, k, 2)$ with $k > 0$ lies on the sphere $x^2+y^2+z^2=18$. Find $k$.'
            answer: 'sqrt(5)'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Substitute the point: $9 + k^2 + 4 = 18$, so $k^2 = 5$. Since $k > 0$, $k = \sqrt{5}$.'
          - problem: 'The point $(0, t, 0)$ with $t > 2$ lies on the sphere $(x-1)^2+(y-2)^2+z^2=11$. Find $t$.'
            answer: '2+sqrt(10)'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Substitute the point: $1 + (t-2)^2 = 11$, so $(t-2)^2 = 10$. Since $t > 2$, $t = 2 + \sqrt{10}$.'
          - problem: 'A loudspeaker at $(3, -2, 1)$ meters is audible up to $12$ m away. Write an equation of the boundary surface of the region where it is audible.'
            answer: '(x - 3)^2 + (y + 2)^2 + (z - 1)^2 = 144'
            answer_contract: {"kind":"polynomial_relation"}
            solution_sketch: 'The boundary is the sphere of radius $12$ around the loudspeaker, so $r^2 = 144$. The equation is $(x - 3)^2 + (y + 2)^2 + (z - 1)^2 = 144$.'
          - problem: 'A sphere has center $(0, 3, -4)$ and radius $\sqrt{7}$. Write an equation of the sphere.'
            answer: 'x^2 + (y - 3)^2 + (z + 4)^2 = 7'
            answer_contract: {"kind":"polynomial_relation"}
            solution_sketch: 'The radius squared is $(\sqrt{7})^2 = 7$. So the equation is $x^2 + (y - 3)^2 + (z + 4)^2 = 7$.'
        constraints: "integer centers; radius a whole number or the square root of a whole number under 30"
      - id: kp2
        name: "Completing the square"
        key_prerequisites: [completing-the-square]
        exemplars:
          - problem: 'Find the center of the sphere $x^2+y^2+z^2+6x-8y+4z-7=0$.'
            answer: '(-3, 4, -2)'
            answer_contract: {"kind":"coordinates","arity":3}
            solution_sketch: 'Complete the square in each variable: $(x+3)^2 + (y-4)^2 + (z+2)^2 = 9 + 16 + 4 + 7 = 36$. The center is $(-3, 4, -2)$.'
          - problem: 'Find the radius of the sphere $x^2+y^2+z^2-2x+6y-4z-1=0$.'
            answer: 'sqrt(15)'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Completing the squares gives $(x-1)^2 + (y+3)^2 + (z-2)^2 = 1 + 9 + 4 + 1 = 15$. So the radius is $\sqrt{15}$.'
          - problem: 'Find the radius of the sphere $x^2+y^2+z^2-4y+6z-12=0$.'
            answer: '5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Completing the squares gives $x^2 + (y-2)^2 + (z+3)^2 = 4 + 9 + 12 = 25$. So the radius is $\sqrt{25} = 5$.'
          - problem: 'The surface of a spherical tank is $x^2+y^2+z^2-6x+4y-8z-7=0$, with lengths in meters. What is the diameter of the tank?'
            answer: '12'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'Completing the squares gives $(x-3)^2 + (y+2)^2 + (z-4)^2 = 9 + 4 + 16 + 7 = 36$, so the radius is $6$ m. The diameter is twice the radius, $12$ m.'
          - problem: 'A balloon is the sphere $x^2+y^2+z^2-20z+75=0$, with lengths in meters and $z$ pointing up from the ground. How high above the ground is the lowest point of the balloon?'
            answer: '5'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'Completing the square gives $x^2 + y^2 + (z-10)^2 = 100 - 75 = 25$. The center is at height $10$ m and the radius is $5$ m, so the lowest point is at height $10 - 5 = 5$ m.'
          - problem: 'Does $x^2+y^2+z^2-2x+4y-6z+20=0$ describe a sphere?'
            answer: 'no'
            answer_contract: {"kind":"label","options":[["yes","yes, it is","it is","it is a sphere","yes, it is a sphere"],["no","no, it is not","it is not","it is not a sphere","no, it is not a sphere","not a sphere"]]}
            solution_sketch: 'Completing the squares gives $(x-1)^2 + (y+2)^2 + (z-3)^2 = 1 + 4 + 9 - 20 = -6$. A sum of squares cannot equal $-6$, so no point satisfies the equation and there is no sphere.'
          - problem: 'Find the center of the sphere $2x^2+2y^2+2z^2-4x+8y-8z-32=0$.'
            answer: '(1, -2, 2)'
            answer_contract: {"kind":"coordinates","arity":3}
            solution_sketch: 'First divide the equation by $2$ to get $x^2+y^2+z^2-2x+4y-4z-16=0$. Completing the squares gives $(x-1)^2 + (y+2)^2 + (z-2)^2 = 25$, so the center is $(1, -2, 2)$.'
          - problem: 'For which value of $k$ does $x^2+y^2+z^2-4x+6y-2z+k=0$ describe a single point?'
            answer: '14'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Completing the squares gives $(x-2)^2 + (y+3)^2 + (z-1)^2 = 4 + 9 + 1 - k = 14 - k$. The graph is a single point when the right side is $0$, so $k = 14$.'
          - problem: 'Sam completes the squares for $x^2+y^2+z^2+6x-4y-8z+4=0$ and gets $(x+3)^2+(y-2)^2+(z-4)^2=4$, so he says the radius is $2$. What is the correct radius?'
            answer: '5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Sam forgot the added squares on the right side. The correct right side is $9 + 4 + 16 - 4 = 25$, so the radius is $5$.'
        constraints: "even linear coefficients; the radius squared is a whole number, and the radius may be a square root"
      - id: kp3
        name: "Spheres from geometric data"
        key_prerequisites: [three-dimensional-coordinates]
        exemplars:
          - problem: 'The points $(1, 2, 3)$ and $(3, 6, 5)$ are the ends of a diameter of a sphere. Write an equation of the sphere.'
            answer: '(x - 2)^2 + (y - 4)^2 + (z - 4)^2 = 6'
            answer_contract: {"kind":"polynomial_relation"}
            solution_sketch: 'The center is the midpoint $(2, 4, 4)$. The squared diameter is $4 + 16 + 4 = 24$, so $r^2 = 24 \div 4 = 6$ and the equation follows.'
          - problem: 'A sphere is centered at $(1, 2, 2)$ and passes through the origin. Find the other point where the sphere meets the $z$-axis.'
            answer: '(0, 0, 4)'
            answer_contract: {"kind":"coordinates","arity":3}
            solution_sketch: 'The squared radius is $1 + 4 + 4 = 9$. A point $(0, 0, z)$ on the sphere has $1 + 4 + (z-2)^2 = 9$, so $z = 0$ or $z = 4$, and the other point is $(0, 0, 4)$.'
          - problem: 'The widest line of a spherical balloon runs from $(0, 1, 2)$ to $(4, 9, 10)$, with coordinates in meters. What is the radius of the balloon?'
            answer: '6'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'The widest line is a diameter. Its length is $\sqrt{16 + 64 + 64} = 12$ m, and the radius is half of that, $6$ m.'
          - problem: 'A flare goes off at $(2, -1, 3)$. At one instant its light has just reached the point $(5, 3, 15)$. Write an equation of the sphere that the light front forms at that instant.'
            answer: '(x - 2)^2 + (y + 1)^2 + (z - 3)^2 = 169'
            answer_contract: {"kind":"polynomial_relation"}
            solution_sketch: 'The radius is the distance from the flare to the point: $r^2 = 9 + 16 + 144 = 169$. The equation is $(x - 2)^2 + (y + 1)^2 + (z - 3)^2 = 169$.'
          - problem: 'An explosion at the origin sends out a shock wave at $350$ m/s. How long does the wave take to reach a sensor at $(200, 300, 600)$ meters?'
            answer: '2'
            answer_contract: {"kind":"unit","quantity":"time","unit":"s","allow_omitted":true}
            solution_sketch: 'The sensor is $\sqrt{200^2 + 300^2 + 600^2} = 700$ m from the origin. At $350$ m/s the wave needs $700 \div 350 = 2$ s.'
          - problem: 'An explosion at the origin sends out a shock wave at $300$ m/s. Write an equation of the wave front $2$ s after the explosion, with lengths in meters.'
            answer: 'x^2 + y^2 + z^2 = 360000'
            answer_contract: {"kind":"polynomial_relation"}
            solution_sketch: 'In $2$ s the wave travels $300 \cdot 2 = 600$ m, so the front is a sphere of radius $600$. Then $r^2 = 360000$ and the equation follows.'
          - problem: 'A sphere centered at $(a, 1, 2)$ has squared radius $34$ and passes through $(3, 4, 5)$. Find the larger possible value of $a$.'
            answer: '7'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The squared distance gives $(3-a)^2 + 9 + 9 = 34$, so $(a-3)^2 = 16$. Then $a = 7$ or $a = -1$, and the larger value is $7$.'
          - problem: 'The points $(1, 2, 3)$ and $(5, y, 7)$ are the ends of a diameter of a sphere with $r^2 = 9$. Find the larger possible value of $y$.'
            answer: '4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The squared diameter is $16 + (y-2)^2 + 16$, and it equals $4 r^2 = 36$. So $(y-2)^2 = 4$, which gives $y = 0$ or $y = 4$, and the larger value is $4$.'
          - problem: 'A sphere has a diameter with endpoints $(0, 1, 2)$ and $(4, 5, 8)$. Write an equation of the sphere.'
            answer: '(x - 2)^2 + (y - 3)^2 + (z - 5)^2 = 17'
            answer_contract: {"kind":"polynomial_relation"}
            solution_sketch: 'The center is the midpoint $(2, 3, 5)$. The squared diameter is $16 + 16 + 36 = 68$, so $r^2 = 68 \div 4 = 17$ and the equation follows.'
        constraints: "midpoints and squared radii are whole numbers; pass-through points use Pythagorean quadruples"
    diagnostic_exemplar:
      problem: 'Find an equation of the sphere that is concentric with $x^2 + y^2 + z^2 - 2x + 4y - 4z = 3$ and passes through the origin.'
      answer: '$(x-1)^2 + (y+2)^2 + (z-2)^2 = 9$'
      answer_contract: {kind: none}
      solution_sketch: 'Completing the square gives centre $(1, -2, 2)$. Its distance to the origin is $\sqrt{1 + 4 + 4} = 3$, so the radius is $3$.'
    anki_seeds:
      - front: 'Equation of the sphere with center $(a, b, c)$ and radius $r$?'
        back: '$(x-a)^2 + (y-b)^2 + (z-c)^2 = r^2$'
        type: basic
      - front: 'How do you find the center and radius of $x^2+y^2+z^2+Dx+Ey+Fz+G=0$?'
        back: 'Complete the square in each of $x$, $y$, $z$ separately.'
        type: basic

  - id: cylinders-and-traces
    name: "Cylinders and Traces"
    core: true
    difficulty: 0.60
    drill: false
    answer_kind: numeric
    expected_time_secs: 120
    prerequisites:
      - id: three-dimensional-coordinates
        weight: 0.6
        key: true
      - id: quadratic-graphs-vertex
        weight: 0.4
        key: false
      - id: ellipses
        weight: 0.4
        key: false
    knowledge_points:
      - id: kp1
        name: "Cylinders: equations missing a variable"
        key_prerequisites: [three-dimensional-coordinates, quadratic-graphs-vertex]
        try_first:
          problem: 'The point $(3, 4, 0)$ lies on the surface $x^2+y^2=25$. Does the point $(3, 4, 100)$ also lie on it?'
          answer_contract: {"kind":"label","options":[["yes","yes, it does","it does","it lies on it"],["no","no, it does not","it does not","it is not on it"]]}
          answer: 'yes'
          reveal: 'The equation $x^2+y^2=25$ does not contain $z$, so moving the point up or down keeps it on the surface. A surface like this is a cylinder.'
        exemplars:
          - problem: 'Is the graph of $x^2+z^2=81$ in space a sphere, a cylinder or a cone?'
            answer: 'cylinder'
            answer_contract: {"kind":"label","options":[["cylinder","a cylinder","circular cylinder","a circular cylinder","it is a cylinder"],["sphere","a sphere","it is a sphere"],["cone","a cone","it is a cone"]]}
            solution_sketch: 'The variable $y$ does not appear, so every plane $y = c$ cuts the same circle $x^2 + z^2 = 81$. The surface is a cylinder, and its radius is $9$.'
          - problem: 'The surface $\frac{y^2}{36}+\frac{z^2}{64}=1$ is a cylinder. Which coordinate axis is it parallel to?'
            answer: 'x-axis'
            answer_contract: {"kind":"label","options":[["x-axis","the x-axis","x axis","the x axis","x"],["y-axis","the y-axis","y axis","the y axis","y"],["z-axis","the z-axis","z axis","the z axis","z"]]}
            solution_sketch: 'The variable $x$ does not appear, so the cylinder is swept parallel to the $x$-axis. Its cross-section is the ellipse with semi-axes $6$ and $8$.'
          - problem: 'Write an equation of the circular cylinder of radius $4$ whose axis is the $z$-axis.'
            answer: 'x^2 + y^2 = 16'
            answer_contract: {"kind":"polynomial_relation"}
            solution_sketch: 'Every cross-section perpendicular to the $z$-axis is a circle of radius $4$ about the axis. So the equation is $x^2 + y^2 = 16$, and $z$ is free.'
          - problem: 'A point on the cylinder $x^2+y^2=100$ has $x = 8$ and $z = 1$, and $y > 0$. Find $y$.'
            answer: '6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The equation does not contain $z$, so $z=1$ does not matter. Then $64 + y^2 = 100$, so $y^2 = 36$ and $y = 6$.'
          - problem: 'A straight pipe lies along the $x$-axis, and its wall is the surface $y^2+z^2=25$, with lengths in meters. What is the diameter of the pipe?'
            answer: '10'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'The cross-section is the circle $y^2 + z^2 = 25$ with radius $5$ m. The diameter is twice the radius, $10$ m.'
          - problem: 'The parabola $z = x^2$ lies in the $xz$-plane. Write an equation of the surface formed by all lines parallel to the $y$-axis through points of this parabola.'
            answer: 'z = x^2'
            answer_contract: {"kind":"polynomial_relation"}
            solution_sketch: 'Moving along the $y$-direction does not change $x$ or $z$. So a point is on the surface exactly when its $x$ and $z$ satisfy $z = x^2$, and $y$ is free.'
          - problem: 'The wall of a tunnel is the surface $\frac{x^2}{25}+\frac{z^2}{16}=1$, where the tunnel runs along the $y$-axis and lengths are in meters. How wide is the tunnel, measured along the $x$-axis?'
            answer: '10'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'The cross-section is an ellipse with semi-axis $\sqrt{25} = 5$ in the $x$-direction. The width is twice that, $10$ m.'
          - problem: 'A point on the surface $x = 5y + 3$ has $x = 43$ and $z = 6$. Find $y$.'
            answer: '8'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The equation does not contain $z$, so the surface is a cylinder over a line and $z=6$ does not matter. Then $5y + 3 = 43$, so $y = 8$.'
          - problem: 'A point on the surface $y = x^2$ has $y = 13$ and $z = 4$, and $x > 0$. Find $x$.'
            answer: 'sqrt(13)'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The equation does not contain $z$, so $z=4$ does not matter. Then $x^2 = 13$, and since $x > 0$, $x = \sqrt{13}$.'
          - problem: 'A point on the surface $\frac{y^2}{36}+\frac{z^2}{64}=1$ has $z = 4$ and $x = 2$, and $y > 0$. Find $y$.'
            answer: '3sqrt(3)'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The equation does not contain $x$, so $x=2$ does not matter. Then $\frac{y^2}{36} = 1 - \frac{16}{64} = \frac34$, so $y^2 = 27$ and $y = 3\sqrt{3}$.'
        constraints: "exactly one variable missing; the plane curve is a line, circle, ellipse, or parabola with whole-number parameters"
      - id: kp2
        name: "Traces of surfaces"
        key_prerequisites: [three-dimensional-coordinates, ellipses]
        exemplars:
          - problem: 'Find the trace of the surface $z = x^2 + y^2$ in the plane $y = 3$.'
            answer: 'z = x^2 + 9'
            answer_contract: {"kind":"polynomial_relation"}
            solution_sketch: 'Replace $y$ by $3$ in the equation. This gives $z = x^2 + 9$, a parabola in the plane $y = 3$.'
          - problem: 'Find the trace of the ellipsoid $x^2+\frac{y^2}{4}+\frac{z^2}{9}=1$ in the plane $z = 0$.'
            answer: 'x^2 + y^2/4 = 1'
            answer_contract: {"kind":"polynomial_relation"}
            solution_sketch: 'Replace $z$ by $0$ in the equation. This leaves $x^2 + \frac{y^2}{4} = 1$, an ellipse in the $xy$-plane.'
          - problem: 'The trace of the surface $z = x^2+y^2$ in the plane $z = 4$ is a circle. Find its center.'
            answer: '(0, 0, 4)'
            answer_contract: {"kind":"coordinates","arity":3}
            solution_sketch: 'Set $z = 4$ to get $x^2 + y^2 = 4$. This circle is centered on the $z$-axis in the plane $z = 4$, so its center is $(0, 0, 4)$.'
          - problem: 'A satellite dish is the surface $z = \frac{x^2+y^2}{8}$, with lengths in meters and $z$ measured up from the bottom of the dish. The dish is cut by the horizontal plane $z = 2$. What is the radius of the circular cut?'
            answer: '4'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'At $z = 2$ the equation gives $x^2 + y^2 = 8 \cdot 2 = 16$. This circle has radius $\sqrt{16} = 4$ m.'
          - problem: 'A hill has height $z = 100 - x^2 - y^2$ meters above the point $(x, y)$ of a map, with $x$ and $y$ in meters. The contour line at height $36$ m is a circle. What is its radius?'
            answer: '8'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'The contour is the trace in the plane $z = 36$. Then $x^2 + y^2 = 100 - 36 = 64$, so the radius is $8$ m.'
          - problem: 'What curve is the trace of the surface $z = x^2-y^2$ in the plane $z = 1$?'
            answer: 'hyperbola'
            answer_contract: {"kind":"label","options":[["hyperbola","a hyperbola"],["ellipse","an ellipse"],["parabola","a parabola"],["circle","a circle"]]}
            solution_sketch: 'Set $z = 1$ to get $x^2 - y^2 = 1$. One squared term is positive and the other negative, so the curve is a hyperbola.'
          - problem: 'A spherical buoy of radius $13$ cm has the surface $x^2+y^2+z^2=169$, with lengths in centimeters and $z$ pointing up. The water level is the plane $z = 5$. What is the radius of the circle where the water meets the buoy?'
            answer: '12'
            answer_contract: {"kind":"unit","quantity":"length","unit":"cm","allow_omitted":true}
            solution_sketch: 'At $z = 5$ the equation gives $x^2 + y^2 = 169 - 25 = 144$. So the circle has radius $\sqrt{144} = 12$ cm.'
          - problem: 'The plane $z = c$ with $c > 0$ meets the sphere $x^2+y^2+z^2=25$ in a circle of radius $3$. Find $c$.'
            answer: '4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'In the plane $z = c$ the trace is $x^2 + y^2 = 25 - c^2$. Its radius is $3$, so $25 - c^2 = 9$, which gives $c = 4$.'
          - problem: 'Sam says the trace of $z = x^2 + 4y^2$ in the plane $z = 4$ is a parabola. What kind of curve is it?'
            answer: 'ellipse'
            answer_contract: {"kind":"label","options":[["ellipse","an ellipse"],["hyperbola","a hyperbola"],["parabola","a parabola"],["circle","a circle"]]}
            solution_sketch: 'Set $z = 4$ to get $x^2 + 4y^2 = 4$, which is $\frac{x^2}{4} + y^2 = 1$. Both squared terms are positive with different sizes, so the trace is an ellipse, not a circle.'
          - problem: 'Find the radius of the trace of the cylinder $x^2+z^2=16$ in the plane $y = 5$.'
            answer: '4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The equation does not contain $y$, so the trace is the same circle $x^2 + z^2 = 16$. Its radius is $4$.'
        constraints: "traces in coordinate planes or planes parallel to them; resulting conics have whole-number or simple radical parameters"
    diagnostic_exemplar:
      problem: 'Find the trace of the surface $x^2 + z^2 = 9$ in the plane $y = 4$, and say what that trace tells you about the whole surface.'
      answer: 'The circle $x^2 + z^2 = 9$ of radius $3$, lying in the plane $y = 4$ and centred on the $y$-axis. Since $y$ does not appear in the equation, the same circle is the trace in every plane $y = c$, so the surface is a circular cylinder of radius $3$ with axis the $y$-axis.'
      answer_contract: {kind: none}
      solution_sketch: 'Setting $y = 4$ leaves the equation unchanged, so the trace is $x^2 + z^2 = 9$ at $y = 4$; independence of $y$ makes the surface a cylinder.'
    anki_seeds:
      - front: 'In $\mathbb{R}^3$, an equation missing one variable describes a...'
        back: 'Cylinder: the plane curve extended parallel to the axis of the missing variable.'
        type: basic
      - front: 'What is a trace of a surface?'
        back: 'The curve of intersection of the surface with a plane (usually a coordinate plane or a plane parallel to one).'
        type: basic

  - id: coordinates-surfaces-3d
    name: "Quadric Surfaces"
    core: true
    difficulty: 0.63
    drill: false
    answer_kind: numeric
    expected_time_secs: 150
    prerequisites:
      - id: spheres-in-space
        weight: 0.6
        key: true
      - id: cylinders-and-traces
        weight: 0.6
        key: true
      - id: hyperbolas
        weight: 0.4
        key: false
    knowledge_points:
      - id: kp1
        name: "Ellipsoids and paraboloids"
        key_prerequisites: [spheres-in-space, cylinders-and-traces]
        exemplars:
          - problem: 'Which type of surface is $\frac{x^2}{16}+\frac{y^2}{4}+\frac{z^2}{9}=1$?'
            answer: 'ellipsoid'
            answer_contract: {"kind":"label","options":[["ellipsoid","an ellipsoid"],["elliptic paraboloid","an elliptic paraboloid","paraboloid","a paraboloid","circular paraboloid","a circular paraboloid"],["hyperbolic paraboloid","a hyperbolic paraboloid","saddle","a saddle"]]}
            solution_sketch: 'All three squared terms are positive and the right side is $1$, so the surface is an ellipsoid. No variable appears to the first power, so it is not a paraboloid.'
          - problem: 'How long is the longest axis of the ellipsoid $\frac{x^2}{4}+\frac{y^2}{25}+\frac{z^2}{9}=1$?'
            answer: '10'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The semi-axes are $\sqrt{4} = 2$, $\sqrt{25} = 5$ and $\sqrt{9} = 3$. The longest axis lies along $y$ and has length $2 \cdot 5 = 10$.'
          - problem: 'An egg is modeled by the ellipsoid $\frac{x^2}{16}+\frac{y^2}{16}+\frac{z^2}{36}=1$, with lengths in centimeters and the long axis along $z$. How tall is the egg?'
            answer: '12'
            answer_contract: {"kind":"unit","quantity":"length","unit":"cm","allow_omitted":true}
            solution_sketch: 'The semi-axis along $z$ is $\sqrt{36} = 6$ cm. The height is the full axis, twice that: $12$ cm.'
          - problem: 'A model of a rugby ball is an ellipsoid centered at the origin. It is $30$ cm long along the $x$-axis and $20$ cm wide along the $y$-axis and along the $z$-axis. Write an equation of the ellipsoid.'
            answer: 'x^2/225 + y^2/100 + z^2/100 = 1'
            answer_contract: {"kind":"polynomial_relation"}
            solution_sketch: 'The semi-axes are half the lengths: $15$, $10$ and $10$. So the denominators are $15^2 = 225$, $100$ and $100$.'
          - problem: 'The ellipsoid $\frac{x^2}{9}+\frac{y^2}{16}+\frac{z^2}{c^2}=1$ contains the point $(0, 0, 5)$, and $c > 0$. Find $c$.'
            answer: '5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Substitute the point: $\frac{25}{c^2} = 1$, so $c^2 = 25$. Since $c > 0$, $c = 5$.'
          - problem: 'The paraboloid $z = \frac{x^2}{a^2}+\frac{y^2}{9}$ passes through the point $(2, 0, 1)$, and $a > 0$. Find $a$.'
            answer: '2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Substitute the point: $1 = \frac{4}{a^2}$, so $a^2 = 4$. Since $a > 0$, $a = 2$.'
          - problem: 'Which type of surface is $z = x^2 - y^2$?'
            answer: 'hyperbolic paraboloid'
            answer_contract: {"kind":"label","options":[["ellipsoid","an ellipsoid"],["elliptic paraboloid","an elliptic paraboloid","paraboloid","a paraboloid","circular paraboloid","a circular paraboloid"],["hyperbolic paraboloid","a hyperbolic paraboloid","saddle","a saddle"]]}
            solution_sketch: 'The variable $z$ appears to the first power, and the two squared terms have opposite signs. So the surface is a hyperbolic paraboloid, a saddle.'
          - problem: 'The surface $z = x^2+y^2$ meets the plane $z = 9$ in a circle. What is the radius of that circle?'
            answer: '3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Set $z = 9$ to get $x^2 + y^2 = 9$. The radius is $\sqrt{9} = 3$.'
          - problem: 'A telescope mirror is the surface $z = \frac{x^2+y^2}{40}$, with lengths in centimeters and $z$ measured from the center of the mirror. The rim is at $z = 10$. What is the diameter of the mirror?'
            answer: '40'
            answer_contract: {"kind":"unit","quantity":"length","unit":"cm","allow_omitted":true}
            solution_sketch: 'At the rim $x^2 + y^2 = 40 \cdot 10 = 400$, so the radius is $20$ cm. The diameter is twice the radius, $40$ cm.'
          - problem: 'Sam reads the semi-axes of $4x^2+9y^2+36z^2=36$ as $4$, $9$ and $36$. What is the length of the longest semi-axis?'
            answer: '3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Divide the equation by $36$ to get $\frac{x^2}{9}+\frac{y^2}{4}+z^2=1$. The semi-axes are $3$, $2$ and $1$, so the longest is $3$.'
          - problem: 'Find the lengths of the three semi-axes of the ellipsoid $\frac{x^2}{49}+\frac{y^2}{16}+\frac{z^2}{36}=1$.'
            answer: '4, 6, 7'
            answer_contract: {"kind":"list","member":{"kind":"exact"},"ordered":false}
            solution_sketch: 'Each denominator is the square of a semi-axis. So the semi-axes are $\sqrt{16} = 4$, $\sqrt{36} = 6$ and $\sqrt{49} = 7$.'
        constraints: "standard-position quadrics with whole-number denominators; one degree-1 variable for paraboloids"
      - id: kp2
        name: "Hyperboloids and cones"
        key_prerequisites: [cylinders-and-traces, hyperbolas]
        try_first:
          problem: 'The surface $x^2+y^2-z^2=9$ meets the plane $z = 4$ in a circle. What is the radius of that circle?'
          answer_contract: {"kind":"exact"}
          answer: '5'
          reveal: 'In the plane $z=4$ we get $x^2+y^2=9+16=25$, so the radius is $5$. The slices never shrink to a point, which is why the surface is one connected piece, a hyperboloid of one sheet.'
        exemplars:
          - problem: 'Identify the surface $\frac{x^2}{4}+\frac{y^2}{9}-z^2=1$.'
            answer: 'one sheet'
            answer_contract: {"kind":"label","options":[["one sheet","hyperboloid of one sheet","a hyperboloid of one sheet","one-sheet hyperboloid","1 sheet","one"],["two sheets","hyperboloid of two sheets","a hyperboloid of two sheets","two-sheet hyperboloid","2 sheets","two"],["cone","a cone","double cone"]]}
            solution_sketch: 'There is one minus sign and the right side is $1$, so the surface is a hyperboloid of one sheet. A cone would need the right side to be $0$.'
          - problem: 'Identify the surface $z^2-x^2-y^2=1$.'
            answer: 'two sheets'
            answer_contract: {"kind":"label","options":[["one sheet","hyperboloid of one sheet","a hyperboloid of one sheet","one-sheet hyperboloid","1 sheet","one"],["two sheets","hyperboloid of two sheets","a hyperboloid of two sheets","two-sheet hyperboloid","2 sheets","two"],["cone","a cone","double cone"]]}
            solution_sketch: 'There are two minus signs and the right side is $1$, so the surface is a hyperboloid of two sheets. The slices $z=k$ are empty when $|k|<1$.'
          - problem: 'For which value of $k$ is $x^2+y^2-z^2=k$ a cone?'
            answer: '0'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'A cone needs the right side to be zero, as in $z^2 = x^2 + y^2$. So $k = 0$.'
          - problem: 'A cooling tower is modeled by the surface $\frac{x^2+y^2}{100}-\frac{z^2}{3600}=1$, with lengths in meters and $z$ measured up from the narrowest circle. What is the diameter of the tower at height $z = 45$?'
            answer: '25'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'At $z = 45$ we get $\frac{x^2+y^2}{100} = 1 + \frac{2025}{3600} = \frac{25}{16}$, so $x^2 + y^2 = 156.25$ and the radius is $12.5$ m. The diameter is $25$ m.'
          - problem: 'A conical funnel is the surface $z^2 = 4(x^2+y^2)$, with lengths in centimeters. How wide is the funnel at height $z = 10$?'
            answer: '10'
            answer_contract: {"kind":"unit","quantity":"length","unit":"cm","allow_omitted":true}
            solution_sketch: 'At $z = 10$ we get $4(x^2 + y^2) = 100$, so $x^2 + y^2 = 25$ and the radius is $5$ cm. The width is the diameter, $10$ cm.'
          - problem: 'Write an equation of the cone with its vertex at the origin and the $z$-axis as its axis, whose cross-section at height $z = 2$ is a circle of radius $6$.'
            answer: 'x^2 + y^2 = 9z^2'
            answer_contract: {"kind":"polynomial_relation"}
            solution_sketch: 'The radius at height $z$ is proportional to $z$, so $r = 3z$ because $6 \div 2 = 3$. So $x^2 + y^2 = 9z^2$.'
          - problem: 'The hyperboloid $4x^2+4y^2-z^2=36$ meets the plane $z = 0$ in a circle. What is the radius of that circle?'
            answer: '3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Set $z = 0$ to get $4x^2 + 4y^2 = 36$, so $x^2 + y^2 = 9$. The circle has radius $\sqrt{9} = 3$.'
          - problem: 'The cone $4z^2 = x^2+y^2$ meets the plane $z = 3$ in a circle. What is its radius?'
            answer: '6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'At $z = 3$ we get $x^2 + y^2 = 4 \cdot 9 = 36$. The radius is $\sqrt{36} = 6$.'
        constraints: "the signs decide the type: one minus sign with =1 gives one sheet, two minus signs give two sheets, =0 gives a cone"
      - id: kp3
        name: "Axis and orientation from the equation"
        key_prerequisites: [spheres-in-space, cylinders-and-traces]
        exemplars:
          - problem: 'Which coordinate axis is the axis of the hyperboloid $\frac{x^2}{4}+y^2-\frac{z^2}{9}=1$?'
            answer: 'z-axis'
            answer_contract: {"kind":"label","options":[["x-axis","the x-axis","x axis","the x axis","x"],["y-axis","the y-axis","y axis","the y axis","y"],["z-axis","the z-axis","z axis","the z axis","z"]]}
            solution_sketch: 'Two terms are positive and only $-\frac{z^2}{9}$ is negative. The odd variable out is $z$, so the axis is the $z$-axis.'
          - problem: 'Find the vertex with positive $x$-coordinate of the hyperboloid $\frac{x^2}{16}-y^2-\frac{z^2}{4}=1$.'
            answer: '(4, 0, 0)'
            answer_contract: {"kind":"coordinates","arity":3}
            solution_sketch: 'The only positive term is $x^2$, so the axis is the $x$-axis. The vertices have $y = z = 0$, so $\frac{x^2}{16} = 1$ and $x = 4$.'
          - problem: 'The hyperboloid $\frac{x^2}{9}-\frac{y^2}{4}-z^2=1$ has two vertices on its axis. How far apart are they?'
            answer: '6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The axis is the $x$-axis, and the vertices have $y = z = 0$. So $x^2 = 9$ and the vertices are $(3, 0, 0)$ and $(-3, 0, 0)$, which are $6$ apart.'
          - problem: 'The plane $y = 16$ meets the paraboloid $y = \frac{x^2}{4}+\frac{z^2}{9}$ in an ellipse. Find the point of this ellipse with $z = 0$ and $x > 0$.'
            answer: '(8, 16, 0)'
            answer_contract: {"kind":"coordinates","arity":3}
            solution_sketch: 'Set $y = 16$ and $z = 0$ to get $\frac{x^2}{4} = 16$. So $x^2 = 64$ and $x = 8$, and the point is $(8, 16, 0)$.'
          - problem: 'Does the paraboloid $y = -\frac{x^2}{9}-\frac{z^2}{4}$ open toward positive $y$ or toward negative $y$?'
            answer: 'negative y'
            answer_contract: {"kind":"label","options":[["negative y","toward negative y","negative","the negative y direction","negative y-direction","the negative y-direction","-y"],["positive y","toward positive y","positive","the positive y direction","positive y-direction","the positive y-direction","+y"]]}
            solution_sketch: 'The right side $-\frac{x^2}{9}-\frac{z^2}{4}$ is never positive, so every point of the surface has $y \le 0$. The paraboloid opens toward negative $y$.'
          - problem: 'A fountain basin is the surface $y = \frac{x^2+z^2}{9}$, with lengths in meters and $y$ pointing up from the lowest point of the basin. The water is $4$ m deep. What is the diameter of the water surface?'
            answer: '12'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'At depth $y = 4$ we get $x^2 + z^2 = 9 \cdot 4 = 36$, so the water surface is a circle of radius $6$ m. Its diameter is $12$ m.'
          - problem: 'The plane $y = -9$ meets the paraboloid $y = -\frac{x^2}{9}-\frac{z^2}{4}$ in an ellipse. Find the $x$-intercept of this ellipse with $x > 0$.'
            answer: '9'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Set $y = -9$ and $z = 0$ to get $\frac{x^2}{9} = 9$. So $x^2 = 81$ and $x = 9$.'
          - problem: 'A cone is the surface $z^2 = \frac{x^2}{4}+\frac{y^2}{9}$. Find the point of the cone in the plane $y = 0$ with $z = 6$ and $x > 0$.'
            answer: '(12, 0, 6)'
            answer_contract: {"kind":"coordinates","arity":3}
            solution_sketch: 'In the plane $y = 0$ we get $z^2 = \frac{x^2}{4}$. At $z = 6$ this gives $36 = \frac{x^2}{4}$, so $x = 12$ and the point is $(12, 0, 6)$.'
          - problem: 'A radar dish is the surface $x = -\frac{y^2+z^2}{16}$, with lengths in meters. The rim of the dish is at $x = -4$. What is the radius of the rim?'
            answer: '8'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'At the rim $-4 = -\frac{y^2+z^2}{16}$, so $y^2 + z^2 = 64$. The radius of the rim is $\sqrt{64} = 8$ m.'
        constraints: "the axis is the odd variable out: the degree-1 variable for a paraboloid, the variable whose sign differs for hyperboloids and cones"
    diagnostic_exemplar:
      problem: 'Identify the surface $4x^2 - y^2 - 4z^2 = 4$ and state its axis.'
      answer: 'A hyperboloid of two sheets with axis the $x$-axis (standard form $x^2 - \frac{y^2}{4} - z^2 = 1$).'
      answer_contract: {kind: none}
      solution_sketch: 'Divide by $4$: $x^2 - \frac{y^2}{4} - z^2 = 1$. Two minus signs (a single positive term) means two sheets, and the axis is that of the positive term, the $x$-axis.'
    anki_seeds:
      - front: 'For $\pm x^2 \pm y^2 \pm z^2 = 1$: one minus sign gives a hyperboloid of {{c1::one sheet}}; two minus signs give {{c2::two sheets}}.'
        back: 'one sheet / two sheets'
        type: cloze
      - front: 'Elliptic vs hyperbolic paraboloid: $z = x^2 + y^2$ is {{c1::elliptic (a bowl)}}; $z = x^2 - y^2$ is {{c2::hyperbolic (a saddle)}}.'
        back: 'elliptic (bowl) / hyperbolic (saddle)'
        type: cloze

  - id: lines-in-space
    name: "Lines in Space"
    core: true
    difficulty: 0.62
    drill: false
    answer_kind: numeric
    expected_time_secs: 120
    prerequisites:
      - id: vectors-in-rn
        weight: 0.7
        key: true
      - id: three-dimensional-coordinates
        weight: 0.5
        key: false
      - id: parametric-equations
        weight: 0.4
        key: false
    knowledge_points:
      - id: kp1
        name: 'Parametric equations of lines'
        key_prerequisites: [vectors-in-rn]
        exemplars:
          - problem: 'Write parametric equations for the line through $A(1, 2, 3)$ and $B(4, 0, 5)$, with the point at $A$ when $t = 0$ and at $B$ when $t = 1$.'
            answer: '(1 + 3t, 2 - 2t, 3 + 2t)'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The direction vector is $\vec{AB} = \langle 3, -2, 2 \rangle$. Start at $A$ and add $t$ times this vector: $x = 1 + 3t$, $y = 2 - 2t$, $z = 3 + 2t$, so $t = 1$ gives $B$.'
          - problem: 'A line passes through $(1, 0, 2)$ with direction vector $\langle 3, -1, 4 \rangle$. Where does it cross the plane $z = 14$?'
            answer: '(10, -3, 14)'
            answer_contract: {"kind":"coordinates","arity":3}
            solution_sketch: 'The line is $x = 1 + 3t$, $y = -t$, $z = 2 + 4t$. Setting $2 + 4t = 14$ gives $t = 3$, so the crossing point is $(10, -3, 14)$.'
          - problem: 'A drone is at the point $(0, 0, 20)$ and flies with constant velocity $\langle 2, -1, -4 \rangle$ m/s, where the lengths are in metres and the third coordinate is the height. How long does it take to reach the ground, $z = 0$?'
            answer: '5'
            answer_contract: {"kind":"unit","quantity":"time","unit":"s","allow_omitted":true}
            solution_sketch: 'After $t$ seconds the height is $20 - 4t$. This equals $0$ when $t = 20 \div 4 = 5$, so the drone lands after 5 seconds.'
          - problem: 'A line has parametric equations $x = 1 + 2t$, $y = -1 + 4t$, $z = 6 - 3t$. Where does it cross the plane $z = 0$?'
            answer: '(5, 7, 0)'
            answer_contract: {"kind":"coordinates","arity":3}
            solution_sketch: 'Setting $6 - 3t = 0$ gives $t = 2$. Then $x = 1 + 4 = 5$ and $y = -1 + 8 = 7$, so the point is $(5, 7, 0)$.'
          - problem: 'A line passes through $P(0, 2, 1)$ and $Q(4, 2, -3)$, with the point at $P$ when $t = 0$ and at $Q$ when $t = 1$. Find the point of the line at $t = 1/2$.'
            answer: '(2, 2, -1)'
            answer_contract: {"kind":"coordinates","arity":3}
            solution_sketch: 'The direction vector is $\vec{PQ} = \langle 4, 0, -4 \rangle$, so the line is $(4t, 2, 1 - 4t)$. At $t = 1/2$ the point is $(2, 2, -1)$, halfway from $P$ to $Q$.'
          - problem: 'The line through $(2, -1, 4)$ with direction vector $\langle 1, 3, -2 \rangle$ crosses the plane $y = 0$. Find the crossing point.'
            answer: '(7/3, 0, 10/3)'
            answer_contract: {"kind":"coordinates","arity":3}
            solution_sketch: 'The line is $x = 2 + t$, $y = -1 + 3t$, $z = 4 - 2t$. Setting $-1 + 3t = 0$ gives $t = 1/3$, so the point is $(7/3, 0, 10/3)$.'
          - problem: 'Sam writes the line through $A(2, 1, 0)$ and $B(5, 3, -2)$, with $t = 0$ at $A$ and $t = 1$ at $B$, as $x = 2 + 5t$, $y = 1 + 3t$, $z = -2t$. What are the correct parametric equations?'
            answer: '(2 + 3t, 1 + 2t, -2t)'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Sam used the coordinates of $B$ as the direction. The direction is $B - A = \langle 3, 2, -2 \rangle$, so the line is $x = 2 + 3t$, $y = 1 + 2t$, $z = -2t$.'
          - problem: 'A laser beam leaves the point $(0, 1, 5)$ in the direction $\langle 3, 2, -1 \rangle$, with lengths in metres and the third coordinate the height. It hits a wall that lies in the plane $x = 6$. At what height does it hit the wall?'
            answer: '3'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'The beam is $x = 3t$, $y = 1 + 2t$, $z = 5 - t$. The wall is reached when $3t = 6$, so $t = 2$ and the height is $5 - 2 = 3$ m.'
          - problem: 'The line $x = 1 + 2t$, $y = 3 - t$, $z = 2 + t$ has $x$-coordinate $9$ at one point. At what value of $t$ does this happen?'
            answer: '4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Set $1 + 2t = 9$. Then $2t = 8$, so $t = 4$.'
        constraints: "integer points and direction vectors; parametrizations are pinned by the base point and the values of t stated in the problem"
      - id: kp2
        name: 'Symmetric equations and points on a line'
        key_prerequisites: [vectors-in-rn, three-dimensional-coordinates]
        exemplars:
          - problem: 'Does the point $(7, -4, 8)$ lie on the line $\dfrac{x-1}{3} = \dfrac{y+2}{-1} = \dfrac{z-4}{2}$?'
            answer: 'yes'
            answer_contract: {"kind":"label","options":[["yes","it does","it lies on the line"],["no","it does not","it does not lie on the line"]]}
            solution_sketch: 'Compute each fraction at the point: $(7-1)/3 = 2$, $(-4+2)/(-1) = 2$ and $(8-4)/2 = 2$. All three equal $2$, so the point lies on the line.'
          - problem: 'The line $\dfrac{x-5}{2} = \dfrac{y+1}{3} = \dfrac{z-4}{-6}$ has a direction vector with $x$-component $1$. Find that direction vector.'
            answer: '(1, 3/2, -3)'
            answer_contract: {"kind":"coordinates","arity":3}
            solution_sketch: 'The denominators give the direction $\langle 2, 3, -6 \rangle$. Dividing every component by $2$ makes the $x$-component $1$, so the vector is $(1, 3/2, -3)$.'
          - problem: 'The line $\dfrac{x-2}{4} = \dfrac{y-1}{5} = \dfrac{z-3}{-2}$ has a point where each of the three fractions equals $1$. Find that point.'
            answer: '(6, 6, 1)'
            answer_contract: {"kind":"coordinates","arity":3}
            solution_sketch: 'Each fraction equals $1$, so $x - 2 = 4$, $y - 1 = 5$ and $z - 3 = -2$. This gives $x = 6$, $y = 6$ and $z = 1$.'
          - problem: 'Does the point $(8, -3, 6)$ lie on the line $\dfrac{x-2}{3} = \dfrac{y-1}{-2} = \dfrac{z+3}{4}$?'
            answer: 'no'
            answer_contract: {"kind":"label","options":[["yes","it does","it lies on the line"],["no","it does not","it does not lie on the line"]]}
            solution_sketch: 'The $x$-fraction is $(8-2)/3 = 2$ and the $y$-fraction is $(-3-1)/(-2) = 2$. The $z$-fraction is $(6+3)/4 = 9/4$, which is not $2$, so the point is not on the line.'
          - problem: 'The line $\dfrac{x-1}{3} = \dfrac{y-2}{-4} = \dfrac{z+5}{2}$ passes through a point with $x = 7$. What is the $z$-coordinate of that point?'
            answer: '-1'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'At $x = 7$ the first fraction is $(7-1)/3 = 2$, so each fraction is $2$. Then $z + 5 = 4$, so $z = -1$.'
          - problem: 'The line $\dfrac{x-3}{2} = \dfrac{y+1}{4} = \dfrac{z-6}{-5}$ passes through a point with $y = 7$. What is the $x$-coordinate of that point?'
            answer: '7'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'At $y = 7$ the second fraction is $(7+1)/4 = 2$, so each fraction is $2$. Then $x - 3 = 4$, so $x = 7$.'
          - problem: 'A zip line starts at the point $(0, 0, 30)$ and runs in the direction $\langle 4, 3, -2 \rangle$, with lengths in metres and the third coordinate the height. How high above the ground is the zip line at the point where $x = 20$?'
            answer: '20'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'The line is $(4t, 3t, 30 - 2t)$. Setting $4t = 20$ gives $t = 5$, and the height is $30 - 10 = 20$ m.'
          - problem: 'A drone starts at $(1, 2, 3)$ and flies with constant velocity $\langle 2, 1, -1 \rangle$ m/s, with lengths in metres. After how many seconds is it at the point $(9, 6, -1)$?'
            answer: '4'
            answer_contract: {"kind":"unit","quantity":"time","unit":"s","allow_omitted":true}
            solution_sketch: 'The position is $(1 + 2t, 2 + t, 3 - t)$. The $x$-equation $1 + 2t = 9$ gives $t = 4$, and $y$ and $z$ also fit at $t = 4$, so it takes 4 seconds.'
          - problem: 'The line $\dfrac{x+2}{5} = \dfrac{y-4}{2} = \dfrac{z-1}{-3}$ has a point where the common value of the three fractions is $-1$. Find that point.'
            answer: '(-7, 2, 4)'
            answer_contract: {"kind":"coordinates","arity":3}
            solution_sketch: 'Set each fraction equal to $-1$: $x + 2 = -5$, $y - 4 = -2$ and $z - 1 = 3$. This gives $x = -7$, $y = 2$ and $z = 4$.'
        constraints: "all direction components nonzero for symmetric form; membership checks resolve with one integer t"
      - id: kp3
        name: 'Parallel, intersecting, and skew lines'
        key_prerequisites: [vectors-in-rn]
        try_first:
          problem: 'In a plane, two lines that are not parallel always meet. In space, can two lines fail to meet and still not be parallel?'
          answer_contract: {"kind":"label","options":[["yes","they can","it is possible"],["no","they cannot","it is not possible"]]}
          answer: 'yes'
          reveal: 'Lines in space can pass each other at different heights. Such lines are called skew, and they need all three coordinate equations to be tested.'
        exemplars:
          - problem: 'Are the lines $L_1$: $x = 1 + t$, $y = 2 + t$, $z = 3 + t$ and $L_2$: $x = 2 + s$, $y = 1 + 2s$, $z = s$ parallel, intersecting, or skew?'
            answer: 'skew'
            answer_contract: {"kind":"label","options":[["skew","they are skew","skew lines"],["intersecting","they intersect","intersect"],["parallel","they are parallel","parallel lines"]]}
            solution_sketch: 'The directions $\langle 1, 1, 1 \rangle$ and $\langle 1, 2, 1 \rangle$ are not parallel. The $x$ and $y$ equations give $s = 2$ and $t = 3$, but then $z$ gives $6$ on $L_1$ and $2$ on $L_2$, so the lines are skew.'
          - problem: 'The lines $L_1$: $x = 2 + t$, $y = 2 - t$, $z = 3 + 2t$ and $L_2$: $x = 3$, $y = -1 + s$, $z = 3 + s$ meet at one point. Find that point.'
            answer: '(3, 1, 5)'
            answer_contract: {"kind":"coordinates","arity":3}
            solution_sketch: 'The $x$-equation $2 + t = 3$ gives $t = 1$. Then $L_1$ is at $(3, 1, 5)$, and $s = 2$ puts $L_2$ at the same point.'
          - problem: 'The lines $L_1$ and $L_2$ have direction vectors $\langle 2, -4, 6 \rangle$ and $\langle -1, 2, -3 \rangle$. By what scalar $k$ must $\langle -1, 2, -3 \rangle$ be multiplied to give $\langle 2, -4, 6 \rangle$?'
            answer: '-2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Compare the first components: $2 = k(-1)$, so $k = -2$. The other components agree, since $-4 = -2 \cdot 2$ and $6 = -2 \cdot (-3)$, so the lines are parallel.'
          - problem: 'The lines $L_1$: $x = 2 + t$, $y = 4 - t$, $z = 1 + 3t$ and $L_2$: $x = 2 + 2s$, $y = 2$, $z = 8 - s$ meet. At what value of $t$ do they meet?'
            answer: '2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The $y$-equations give $4 - t = 2$, so $t = 2$. Then $x = 4$ gives $s = 1$, and $z = 7$ on both lines, so they meet at $t = 2$.'
          - problem: 'Are the lines $L_1$: $x = 1 + 2t$, $y = 3 - t$, $z = 4 + t$ and $L_2$: $x = 5 + 4s$, $y = 1 - 2s$, $z = 2 + 2s$ parallel, intersecting, or skew?'
            answer: 'parallel'
            answer_contract: {"kind":"label","options":[["skew","they are skew","skew lines"],["intersecting","they intersect","intersect"],["parallel","they are parallel","parallel lines"]]}
            solution_sketch: 'The directions $\langle 2, -1, 1 \rangle$ and $\langle 4, -2, 2 \rangle$ are multiples, so the lines are parallel. The point $(1, 3, 4)$ is not on $L_2$ (it needs $s = -1$, which gives $z = 0$), so they are two different parallel lines.'
          - problem: 'The line $L_1$ has direction vector $\langle 2, k, -3 \rangle$ and the line $L_2$ has direction vector $\langle -4, 6, 6 \rangle$. The lines are parallel. Find $k$.'
            answer: '-3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The multiplier from the first components is $2 \div (-4) = -1/2$. Then $-3 = (-1/2)(6)$ confirms it, and $k = (-1/2)(6) = -3$.'
          - problem: 'The lines $L_1$: $x = 1 + t$, $y = 2t$, $z = 3 + t$ and $L_2$: $x = 2s$, $y = 1 + s$, $z = c - 2s$ intersect. Find the constant $c$.'
            answer: '6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The $x$ and $y$ equations give $1 + t = 2s$ and $2t = 1 + s$, so $s = 1$ and $t = 1$. Then $z = 4$ on $L_1$, so $c - 2 = 4$ and $c = 6$.'
          - problem: 'Two straight wires hang from a ceiling along $L_1$: $x = 1 + 2t$, $y = t$, $z = 3$ and $L_2$: $x = s$, $y = 1 + s$, $z = 3$, with lengths in metres. The wires touch at one point. Find that point.'
            answer: '(-3, -2, 3)'
            answer_contract: {"kind":"coordinates","arity":3}
            solution_sketch: 'Both wires have $z = 3$. Then $1 + 2t = s$ and $t = 1 + s$ give $t = -2$ and $s = -3$, so the point is $(-3, -2, 3)$.'
          - problem: 'Drone A is at $(2 + 3t,\; 1 + 2t,\; 40 - 5t)$ and drone B is at $(18 - t,\; 21 - 3t,\; 4 + 4t)$ after $t$ seconds, with lengths in metres. After how many seconds are the two drones at the same point?'
            answer: '4'
            answer_contract: {"kind":"unit","quantity":"time","unit":"s","allow_omitted":true}
            solution_sketch: 'Both drones use the same time $t$. Setting $2 + 3t = 18 - t$ gives $t = 4$, and $1 + 2t = 21 - 3t$ and $40 - 5t = 4 + 4t$ also give $t = 4$.'
        constraints: "systems resolve with small integer parameters; skew examples must fail exactly one coordinate equation"
    diagnostic_exemplar:
      problem: 'The line $L_1$ has parametric equations $x = 1 + 2t$, $y = 3 - t$, $z = 2 + t$, and $L_2$ passes through $(3, 2, 4)$ with direction vector $\langle 1, 1, 0 \rangle$. Are $L_1$ and $L_2$ parallel, intersecting, or skew?'
      answer: 'Skew.'
      answer_contract: {kind: none}
      solution_sketch: 'The directions $\langle 2, -1, 1 \rangle$ and $\langle 1, 1, 0 \rangle$ are not multiples, so the lines are not parallel. Writing $L_2$ as $x = 3 + s$, $y = 2 + s$, $z = 4$: the $z$-equation forces $t = 2$, giving the point $(5, 1, 4)$ on $L_1$, and then $x$ forces $s = 2$, giving $(5, 4, 4)$ on $L_2$. The $y$-coordinates disagree, so the lines never meet: skew.'
    anki_seeds:
      - front: 'Vector equation of the line through point $\mathbf{r}_0$ with direction $\mathbf{v}$?'
        back: '$\mathbf{r}(t) = \mathbf{r}_0 + t\mathbf{v}$'
        type: basic
      - front: 'Skew lines are lines that...'
        back: 'do not intersect and are not parallel (impossible in the plane, common in space).'
        type: basic

  - id: planes-in-space
    name: "Equations of Planes"
    core: true
    difficulty: 0.65
    drill: false
    answer_kind: numeric
    expected_time_secs: 150
    prerequisites:
      - id: dot-product
        weight: 0.6
        key: true
      - id: cross-product
        weight: 0.6
        key: true
      - id: lines-in-space
        weight: 0.5
        key: false
    knowledge_points:
      - id: kp1
        name: 'Point-normal form'
        key_prerequisites: [dot-product]
        exemplars:
          - problem: 'Find an equation of the plane through $(2, 1, 5)$ with normal vector $\langle 3, -2, 1 \rangle$.'
            answer: '3x - 2y + z = 9'
            answer_contract: {"kind":"polynomial_relation"}
            solution_sketch: 'The coefficients are the components of the normal, so the equation is $3x - 2y + z = d$. Substituting $(2, 1, 5)$ gives $d = 6 - 2 + 5 = 9$.'
          - problem: 'Find an equation of the plane through the origin with normal vector $\langle 2, 5, -3 \rangle$.'
            answer: '2x + 5y - 3z = 0'
            answer_contract: {"kind":"polynomial_relation"}
            solution_sketch: 'The equation has the form $2x + 5y - 3z = d$. The plane passes through the origin, so $d = 0$.'
          - problem: 'A line has direction vector $\langle 2, -1, 3 \rangle$. Find an equation of the plane that is perpendicular to this line and passes through $(-1, 3, 2)$.'
            answer: '2x - y + 3z = 1'
            answer_contract: {"kind":"polynomial_relation"}
            solution_sketch: 'The direction of the line is a normal of the plane, so the equation is $2x - y + 3z = d$. Substituting $(-1, 3, 2)$ gives $d = -2 - 3 + 6 = 1$.'
          - problem: 'Sam finds the plane through $(1, 2, 3)$ with normal vector $\langle 2, -1, 4 \rangle$ and writes $2x - y + 4z = 6$. What is the correct equation?'
            answer: '2x - y + 4z = 12'
            answer_contract: {"kind":"polynomial_relation"}
            solution_sketch: 'Sam used $1 + 2 + 3 = 6$ as the constant. The constant is the normal dotted with the point: $2(1) - 2 + 4(3) = 12$.'
          - problem: 'A flat ramp lies in the plane $2x - y + 4z = 12$, with lengths in metres and $z$ the height. How high is the ramp above the floor point with $x = 4$ and $y = 0$?'
            answer: '1'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'Substitute $x = 4$ and $y = 0$: $8 + 4z = 12$. Then $4z = 4$, so $z = 1$ and the ramp is 1 m high there.'
          - problem: 'A point of the plane $4x + y - 2z = 6$ has $x = 1$ and $y = 0$. Find its $z$-coordinate.'
            answer: '-1'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Substitute $x = 1$ and $y = 0$: $4 - 2z = 6$. Then $-2z = 2$, so $z = -1$.'
          - problem: 'A flat solar panel is perpendicular to the sun rays, which have direction $\langle 1, 2, 2 \rangle$, and it passes through $(2, 3, 1)$, with lengths in metres. Find an equation of the plane of the panel.'
            answer: 'x + 2y + 2z = 10'
            answer_contract: {"kind":"polynomial_relation"}
            solution_sketch: 'The direction of the rays is a normal of the panel, so the equation is $x + 2y + 2z = d$. Substituting $(2, 3, 1)$ gives $d = 2 + 6 + 2 = 10$.'
          - problem: 'Does the point $(2, 0, 3)$ lie on the plane through $(1, 1, 1)$ with normal vector $\langle 2, 3, -1 \rangle$?'
            answer: 'no'
            answer_contract: {"kind":"label","options":[["yes","it does","it lies on the plane"],["no","it does not","it does not lie on the plane"]]}
            solution_sketch: 'The plane is $2x + 3y - z = 4$, because $2 + 3 - 1 = 4$. At $(2, 0, 3)$ the left side is $4 - 3 = 1$, which is not $4$, so the point is not on the plane.'
          - problem: 'A plane passes through $(1, 0, 2)$ and is perpendicular to the line through $P(3, -1, 4)$ and $Q(1, 1, 0)$. Find an equation of the plane.'
            answer: 'x - y + 2z = 5'
            answer_contract: {"kind":"polynomial_relation"}
            solution_sketch: 'A normal is $\vec{PQ} = \langle -2, 2, -4 \rangle$, which gives $-2x + 2y - 4z = -10$. Dividing by $-2$ gives $x - y + 2z = 5$.'
        constraints: "integer normals and points; right-hand sides are small integers"
      - id: kp2
        name: 'Plane through three points'
        key_prerequisites: [cross-product]
        exemplars:
          - problem: 'Find an equation of the plane through $A(1, 0, 0)$, $B(0, 2, 0)$ and $C(0, 0, 3)$.'
            answer: '6x + 3y + 2z = 6'
            answer_contract: {"kind":"polynomial_relation"}
            solution_sketch: 'The edge vectors are $\vec{AB} = \langle -1, 2, 0 \rangle$ and $\vec{AC} = \langle -1, 0, 3 \rangle$, and their cross product is $\langle 6, 3, 2 \rangle$. Using $A$ gives $d = 6$, so the plane is $6x + 3y + 2z = 6$.'
          - problem: 'Find a normal vector of the plane through $P(0, 0, 0)$, $Q(1, 1, 0)$ and $R(0, 1, 1)$ whose $z$-component is $1$.'
            answer: '(1, -1, 1)'
            answer_contract: {"kind":"coordinates","arity":3}
            solution_sketch: 'The cross product of $\langle 1, 1, 0 \rangle$ and $\langle 0, 1, 1 \rangle$ has components $1 \cdot 1 - 0 \cdot 1 = 1$, $0 \cdot 0 - 1 \cdot 1 = -1$ and $1 \cdot 1 - 1 \cdot 0 = 1$. This vector has $z$-component $1$, so the normal vector is $(1, -1, 1)$.'
          - problem: 'Find an equation of the plane through $A(1, 2, 0)$, $B(0, 1, 2)$ and $C(2, 0, 1)$.'
            answer: 'x + y + z = 3'
            answer_contract: {"kind":"polynomial_relation"}
            solution_sketch: 'The edge vectors are $\langle -1, -1, 2 \rangle$ and $\langle 1, -2, 1 \rangle$, and their cross product is $\langle 3, 3, 3 \rangle$, so a normal is $\langle 1, 1, 1 \rangle$. Using $A$ gives $d = 1 + 2 + 0 = 3$.'
          - problem: 'The points $A(1, 0, 2)$, $B(0, 1, 1)$, $C(3, 2, k)$ and $D(1, 1, 0)$ lie in one plane. Find $k$.'
            answer: '-4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The plane through $A$, $B$, $D$ has normal $\vec{AB} \times \vec{AD} = \langle -1, -2, -1 \rangle$, so it is $x + 2y + z = 3$. Then $C$ must satisfy $3 + 4 + k = 3$, so $k = -4$.'
          - problem: 'A straight ramp passes through the points $(0, 0, 0)$, $(4, 0, 1)$ and $(0, 3, 1)$, with lengths in metres and $z$ the height. Find an equation of the plane of the ramp.'
            answer: '3x + 4y - 12z = 0'
            answer_contract: {"kind":"polynomial_relation"}
            solution_sketch: 'The cross product of $\langle 4, 0, 1 \rangle$ and $\langle 0, 3, 1 \rangle$ is $\langle -3, -4, 12 \rangle$. The plane passes through the origin, so it is $-3x - 4y + 12z = 0$, which is the same as $3x + 4y - 12z = 0$.'
          - problem: 'The ramp through $(0, 0, 0)$, $(4, 0, 1)$ and $(0, 3, 1)$ lies in the plane $3x + 4y - 12z = 0$, with lengths in metres and $z$ the height. How high is the ramp above the floor point with $x = 8$ and $y = 6$?'
            answer: '4'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'Substitute $x = 8$ and $y = 6$: $24 + 24 - 12z = 0$. Then $12z = 48$, so $z = 4$ and the ramp is 4 m high there.'
          - problem: 'Does the point $D(2, 2, 0)$ lie on the plane through $A(1, 0, 2)$, $B(2, 1, 0)$ and $C(0, 1, 3)$?'
            answer: 'no'
            answer_contract: {"kind":"label","options":[["yes","it does","it lies on the plane"],["no","it does not","it does not lie on the plane"]]}
            solution_sketch: 'The cross product of $\vec{AB} = \langle 1, 1, -2 \rangle$ and $\vec{AC} = \langle -1, 1, 1 \rangle$ is $\langle 3, 1, 2 \rangle$, so the plane is $3x + y + 2z = 7$. At $D$ the left side is $8$, not $7$, so $D$ is not on the plane.'
          - problem: 'A triangular glass panel has its corners at $(1, 0, 0)$, $(0, 3, 0)$ and $(0, 0, 2)$, with lengths in metres and $z$ the height. How high is the panel above the floor point with $x = 1/4$ and $y = 3/2$?'
            answer: '1/2'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'The plane through the corners is $6x + 2y + 3z = 6$. At $x = 1/4$ and $y = 3/2$ this gives $3/2 + 3 + 3z = 6$, so $3z = 3/2$ and $z = 1/2$ m.'
        constraints: "integer points with small integer cross products; always verify all three points satisfy the final equation"
      - id: kp3
        name: 'Parallel and perpendicular planes'
        key_prerequisites: [dot-product]
        exemplars:
          - problem: 'Find an equation of the plane through $(1, 2, -1)$ that is parallel to the plane $2x - 3y + z = 5$.'
            answer: '2x - 3y + z = -5'
            answer_contract: {"kind":"polynomial_relation"}
            solution_sketch: 'Parallel planes share a normal, so the new plane is $2x - 3y + z = d$. Substituting $(1, 2, -1)$ gives $d = 2 - 6 - 1 = -5$.'
          - problem: 'Are the planes $2x - y + 2z = 3$ and $4x - 2y + 4z = 7$ parallel, perpendicular, or neither?'
            answer: 'parallel'
            answer_contract: {"kind":"label","options":[["parallel","they are parallel","parallel planes"],["perpendicular","they are perpendicular","perpendicular planes"],["neither","they are neither","neither parallel nor perpendicular"]]}
            solution_sketch: 'The normals are $\langle 2, -1, 2 \rangle$ and $\langle 4, -2, 4 \rangle$, and the second is $2$ times the first. So the planes are parallel.'
          - problem: 'Are the planes $x + 2y - z = 3$ and $2x + y + 4z = 1$ parallel, perpendicular, or neither?'
            answer: 'perpendicular'
            answer_contract: {"kind":"label","options":[["parallel","they are parallel","parallel planes"],["perpendicular","they are perpendicular","perpendicular planes"],["neither","they are neither","neither parallel nor perpendicular"]]}
            solution_sketch: 'The normals are $\langle 1, 2, -1 \rangle$ and $\langle 2, 1, 4 \rangle$. Their dot product is $2 + 2 - 4 = 0$, so the planes are perpendicular.'
          - problem: 'The planes $2x + ky + 3z = 1$ and $4x + 6y + 6z = 5$ are parallel. Find $k$.'
            answer: '3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The normals must be multiples. From $x$ and $z$ the multiplier is $2$, so $k = 6 \div 2 = 3$.'
          - problem: 'The planes $x + 2y - z = 4$ and $3x - y + kz = 2$ are perpendicular. Find $k$.'
            answer: '1'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The normals must have dot product $0$: $3 - 2 - k = 0$. So $k = 1$.'
          - problem: 'The planes $2x - 3y + 4z = 1$ and $-6x + 9y + cz = 4$ are parallel. Find $c$.'
            answer: '-12'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The second normal is $-3$ times the first, since $-6 = -3 \cdot 2$ and $9 = -3 \cdot (-3)$. So $c = -3 \cdot 4 = -12$.'
          - problem: 'A sloping roof panel lies in the plane $2x + y + 2z = 8$, with lengths in metres. A flat shelf must be parallel to the panel and pass through the point $(1, 1, 1)$. Find an equation of the plane of the shelf.'
            answer: '2x + y + 2z = 5'
            answer_contract: {"kind":"polynomial_relation"}
            solution_sketch: 'The shelf has the same normal as the panel, so its plane is $2x + y + 2z = d$. Substituting $(1, 1, 1)$ gives $d = 2 + 1 + 2 = 5$.'
          - problem: 'A wall lies in the plane $x + 2y = 6$. A second wall is perpendicular to the first, passes through the origin and contains the $z$-axis. Find an equation of the plane of the second wall.'
            answer: '2x - y = 0'
            answer_contract: {"kind":"polynomial_relation"}
            solution_sketch: 'The second plane contains the $z$-axis, so its normal is $\langle a, b, 0 \rangle$, and it is perpendicular to $\langle 1, 2, 0 \rangle$, so $a + 2b = 0$. Taking $a = 2$ and $b = -1$ gives $2x - y = 0$, which passes through the origin.'
        constraints: "parallel/perpendicular tests reduce to scalar-multiple or zero-dot-product checks on integer normals"
    diagnostic_exemplar:
      problem: 'Find an equation of the plane through $(1, 2, 3)$ that is perpendicular to both of the planes $x + y - z = 1$ and $2x - y + z = 4$.'
      answer: '$y + z = 5$'
      answer_contract: {kind: none}
      solution_sketch: 'Such a plane has a normal orthogonal to both given normals, so take $\langle 1, 1, -1 \rangle \times \langle 2, -1, 1 \rangle = \langle 0, -3, -3 \rangle \parallel \langle 0, 1, 1 \rangle$. Point-normal form: $(y - 2) + (z - 3) = 0$, i.e. $y + z = 5$.'
    anki_seeds:
      - front: 'How do you get a normal vector to the plane through three points $A$, $B$, $C$?'
        back: '$\vec{AB} \times \vec{AC}$'
        type: basic
      - front: 'Two planes are parallel exactly when their {{c1::normal vectors}} are parallel.'
        back: 'normal vectors'
        type: cloze

  - id: lines-planes-space
    name: "Intersections and Distances in Space"
    core: false                # intersection / distance problem genre; terminal
    difficulty: 0.68
    drill: false
    answer_kind: numeric
    expected_time_secs: 180
    prerequisites:
      - id: lines-in-space
        weight: 0.7
        key: true
      - id: planes-in-space
        weight: 0.7
        key: true
      - id: vector-projections
        weight: 0.4
        key: false
    knowledge_points:
      - id: kp1
        name: 'Line-plane intersections'
        key_prerequisites: [lines-in-space, planes-in-space]
        exemplars:
          - problem: 'Find the point where the line $x = 1 + t$, $y = 2t$, $z = 3 - t$ meets the plane $x + y + z = 6$.'
            answer: '(2, 2, 2)'
            answer_contract: {"kind":"coordinates","arity":3}
            solution_sketch: 'Substitute into the plane: $(1 + t) + 2t + (3 - t) = 4 + 2t = 6$, so $t = 1$. The point is $(2, 2, 2)$.'
          - problem: 'Find the point where the line $x = 1 + 2t$, $y = -t$, $z = t$ meets the plane $2x + y + z = 10$.'
            answer: '(5, -2, 2)'
            answer_contract: {"kind":"coordinates","arity":3}
            solution_sketch: 'Substitute into the plane: $2(1 + 2t) - t + t = 2 + 4t = 10$, so $t = 2$. The point is $(5, -2, 2)$.'
          - problem: 'Does the line $x = t$, $y = 1 - t$, $z = 2$ meet the plane $x + y + z = 5$?'
            answer: 'no'
            answer_contract: {"kind":"label","options":[["yes","it does","it meets the plane"],["no","it does not","it never meets the plane","they are parallel"]]}
            solution_sketch: 'Substituting gives $t + (1 - t) + 2 = 3$ for every $t$. Since $3 \ne 5$, no point of the line is on the plane.'
          - problem: 'The line $x = 2 + 3t$, $y = 1 - t$, $z = -4 + 2t$ meets the plane $x - y + 2z = 1$. Find the point where they meet.'
            answer: '(5, 0, -2)'
            answer_contract: {"kind":"coordinates","arity":3}
            solution_sketch: 'Substitute into the plane: $(2 + 3t) - (1 - t) + 2(-4 + 2t) = -7 + 8t = 1$, so $t = 1$. The point is $(5, 0, -2)$.'
          - problem: 'The line $\dfrac{x-1}{2} = \dfrac{y+2}{-1} = \dfrac{z}{3}$ meets the plane $x + y + z = 7$. Find the point where they meet.'
            answer: '(5, -4, 6)'
            answer_contract: {"kind":"coordinates","arity":3}
            solution_sketch: 'Write the line as $x = 1 + 2t$, $y = -2 - t$, $z = 3t$. Substituting gives $-1 + 4t = 7$, so $t = 2$ and the point is $(5, -4, 6)$.'
          - problem: 'The line through $(1, 0, 2)$ and $(3, 1, 0)$ meets the plane $x + y + z = 5$. Find the point where they meet.'
            answer: '(5, 2, -2)'
            answer_contract: {"kind":"coordinates","arity":3}
            solution_sketch: 'The direction is $\langle 2, 1, -2 \rangle$, so the line is $(1 + 2t, t, 2 - 2t)$. Substituting gives $3 + t = 5$, so $t = 2$ and the point is $(5, 2, -2)$.'
          - problem: 'A ray of light starts at $(1, 2, 5)$ and travels in the direction $\langle 1, -1, -2 \rangle$. It hits a flat roof that lies in the plane $x + y + 2z = 5$. Find the point where the ray hits the roof.'
            answer: '(3, 0, 1)'
            answer_contract: {"kind":"coordinates","arity":3}
            solution_sketch: 'The ray is $(1 + t, 2 - t, 5 - 2t)$. Substituting gives $13 - 4t = 5$, so $t = 2$ and the ray hits the roof at $(3, 0, 1)$.'
          - problem: 'A drone starts at $(0, 0, 20)$ and flies with constant velocity $\langle 3, 2, -4 \rangle$ m/s, with lengths in metres. A flat hillside lies in the plane $2x + 2y + z = 44$. After how many seconds does the drone reach the hillside?'
            answer: '4'
            answer_contract: {"kind":"unit","quantity":"time","unit":"s","allow_omitted":true}
            solution_sketch: 'After $t$ seconds the drone is at $(3t, 2t, 20 - 4t)$. Substituting gives $6t + 4t + 20 - 4t = 20 + 6t = 44$, so $t = 4$ seconds.'
        constraints: "substitution yields a linear equation with integer solution t, or a contradiction in the parallel case"
      - id: kp2
        name: 'Distances to planes and lines'
        key_prerequisites: [planes-in-space, vector-projections]
        exemplars:
          - problem: 'Find the distance from the point $(1, 1, 1)$ to the plane $2x - y + 2z = 10$.'
            answer: '7/3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The numerator is $|2 - 1 + 2 - 10| = 7$ and the normal has length $\sqrt{4 + 1 + 4} = 3$. The distance is $7/3$.'
          - problem: 'Find the distance between the parallel planes $x + 2y + 2z = 1$ and $x + 2y + 2z = 10$.'
            answer: '3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The point $(1, 0, 0)$ is on the first plane. Its distance to the second plane is $|1 - 10| \div \sqrt{1 + 4 + 4} = 9 \div 3 = 3$.'
          - problem: 'Find the distance from the point $Q(1, 2, 3)$ to the line through $P(1, 0, 1)$ with direction vector $\langle 0, 1, 0 \rangle$.'
            answer: '2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Here $\vec{PQ} = \langle 0, 2, 2 \rangle$, and $\vec{PQ} \times \mathbf{v} = \langle -2, 0, 0 \rangle$ has length $2$. The direction vector has length $1$, so the distance is $2$.'
          - problem: 'Find the distance from the point $(3, 0, -1)$ to the plane $2x + 2y + z = 9$.'
            answer: '4/3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The numerator is $|6 + 0 - 1 - 9| = 4$ and the normal has length $\sqrt{4 + 4 + 1} = 3$. The distance is $4/3$.'
          - problem: 'Find the distance between the parallel planes $3x + 4y = 2$ and $3x + 4y = 7$.'
            answer: '1'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The point $(2, -1, 0)$ is on the first plane, since $6 - 4 = 2$. Its distance to the second plane is $|2 - 7| \div \sqrt{9 + 16} = 5 \div 5 = 1$.'
          - problem: 'Find the distance from the point $Q(2, 3, 4)$ to the $x$-axis.'
            answer: '5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The $x$-axis passes through the origin with direction $\langle 1, 0, 0 \rangle$. The cross product of $\langle 2, 3, 4 \rangle$ and $\langle 1, 0, 0 \rangle$ is $\langle 0, 4, -3 \rangle$, which has length $5$, so the distance is $5$.'
          - problem: 'Sam finds the distance from $(3, 1, 2)$ to the plane $2x + y + 2z = 1$ and gets $10$. What is the correct distance?'
            answer: '10/3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Sam forgot to divide by the length of the normal. The numerator is $|6 + 1 + 4 - 1| = 10$ and the normal has length $\sqrt{4 + 1 + 4} = 3$, so the distance is $10/3$.'
          - problem: 'A flat wall lies in the plane $2x + 3y + 6z = 12$, with lengths in metres. A bird sits at the point $(4, 3, 2)$. How far is the bird from the wall?'
            answer: '17/7'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'The numerator is $|8 + 9 + 12 - 12| = 17$ and the normal has length $\sqrt{4 + 9 + 36} = 7$. The bird is $17/7$ m from the wall.'
          - problem: 'Two parallel glass sheets lie in the planes $2x - y + 2z = 3$ and $2x - y + 2z = 18$, with lengths in metres. How far apart are the sheets?'
            answer: '5'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'The difference of the constants is $18 - 3 = 15$. The normal has length $\sqrt{4 + 1 + 4} = 3$, so the sheets are $15 \div 3 = 5$ m apart.'
          - problem: 'A straight cable passes through $P(1, 0, 0)$ with direction vector $\langle 0, 3, 4 \rangle$, with lengths in metres. A sensor is at $Q(3, 3, 4)$. How far is the sensor from the cable?'
            answer: '2'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'Here $\vec{PQ} = \langle 2, 3, 4 \rangle$, and $\vec{PQ} \times \mathbf{v} = \langle 0, -8, 6 \rangle$ has length $10$. The direction vector has length $5$, so the distance is $10 \div 5 = 2$ m.'
        constraints: "normal magnitudes are integers (e.g. components 1-2-2, 2-1-2); answers are integers or simple fractions"
      - id: kp3
        name: 'Line of intersection of two planes'
        key_prerequisites: [planes-in-space, lines-in-space]
        exemplars:
          - problem: 'Find parametric equations for the line of intersection of the planes $x + y + z = 2$ and $x - y + z = 0$, using $z = t$.'
            answer: '(1 - t, 1, t)'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Adding the equations gives $2x + 2z = 2$, so $x = 1 - z = 1 - t$. Subtracting them gives $2y = 2$, so $y = 1$.'
          - problem: 'The planes $x + 2y - z = 3$ and $2x - y + z = 1$ meet in a line. Find the point of this line with $z = 0$.'
            answer: '(1, 1, 0)'
            answer_contract: {"kind":"coordinates","arity":3}
            solution_sketch: 'With $z = 0$ the equations are $x + 2y = 3$ and $2x - y = 1$. Then $y = 2x - 1$, so $5x - 2 = 3$, giving $x = 1$ and $y = 1$.'
          - problem: 'Find parametric equations for the line of intersection of the planes $x + y = 3$ and $y + z = 5$, using $z = t$.'
            answer: '(t - 2, 5 - t, t)'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The second plane gives $y = 5 - t$. The first plane then gives $x = 3 - y = t - 2$.'
          - problem: 'The planes $x + 2y - z = 3$ and $2x - y + z = 1$ meet in a line. Find a direction vector of that line with $x$-component $1$.'
            answer: '(1, -3, -5)'
            answer_contract: {"kind":"coordinates","arity":3}
            solution_sketch: 'The normals are $\langle 1, 2, -1 \rangle$ and $\langle 2, -1, 1 \rangle$. The components of the cross product are $2 \cdot 1 - (-1)(-1) = 1$, $(-1)(2) - 1 \cdot 1 = -3$ and $1 \cdot (-1) - 2 \cdot 2 = -5$. The $x$-component is already $1$, so the direction is $(1, -3, -5)$.'
          - problem: 'Find parametric equations for the line of intersection of the planes $x - 3z = 2$ and $y + 2z = -1$, using $z = t$.'
            answer: '(2 + 3t, -1 - 2t, t)'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The first plane gives $x = 2 + 3z = 2 + 3t$. The second plane gives $y = -1 - 2z = -1 - 2t$.'
          - problem: 'Two roof surfaces lie in the planes $x + z = 6$ and $y + 2z = 4$, with lengths in metres. They meet along the ridge. Find the point of the ridge at height $z = 2$.'
            answer: '(4, 0, 2)'
            answer_contract: {"kind":"coordinates","arity":3}
            solution_sketch: 'At $z = 2$ the first plane gives $x = 6 - 2 = 4$. The second plane gives $y = 4 - 4 = 0$, so the point is $(4, 0, 2)$.'
          - problem: 'Find parametric equations for the line of intersection of the planes $x + y - z = 1$ and $x + 2y - 5z = 0$, using $z = t$.'
            answer: '(2 - 3t, -1 + 4t, t)'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Subtracting the first equation from the second gives $y - 4z = -1$, so $y = -1 + 4t$. Then $x = 1 - y + z = 2 - 3t$.'
          - problem: 'Two glass panels lie in the planes $x + y + z = 6$ and $2x - y + z = 3$, with lengths in metres. They meet along an edge. Find the point of the edge with $x = 0$.'
            answer: '(0, 3/2, 9/2)'
            answer_contract: {"kind":"coordinates","arity":3}
            solution_sketch: 'With $x = 0$ the equations are $y + z = 6$ and $-y + z = 3$. Adding gives $2z = 9$, so $z = 9/2$ and $y = 6 - 9/2 = 3/2$.'
          - problem: 'Find parametric equations for the line of intersection of the planes $x = 4$ and $y - 2z = -3$, using $z = t$.'
            answer: '(4, -3 + 2t, t)'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The first plane gives $x = 4$. The second plane gives $y = -3 + 2z = -3 + 2t$.'
        constraints: "cross products of the normals have integer components; a coordinate can be set to 0 to solve for an integer point; the parameter is named in the problem (z = t)"
    diagnostic_exemplar:
      problem: 'Find parametric equations for the line of intersection of the planes $x + y + z = 6$ and $2x - y + z = 3$.'
      answer: '$x = -3 + 2t,\; y = t,\; z = 9 - 3t$'
      answer_contract: {kind: none}
      solution_sketch: 'Subtracting gives $-x + 2y = 3$, so $x = 2y - 3$, and then $z = 6 - x - y = 9 - 3y$. Setting $y = t$ gives the parametrization; its direction $\langle 2, 1, -3 \rangle$ is (up to sign) $\langle 1, 1, 1 \rangle \times \langle 2, -1, 1 \rangle$.'
    anki_seeds:
      - front: 'Distance from point $(x_0,y_0,z_0)$ to plane $ax + by + cz = d$?'
        back: '$\dfrac{|ax_0 + by_0 + cz_0 - d|}{\sqrt{a^2 + b^2 + c^2}}$'
        type: basic
      - front: 'Direction vector of the line of intersection of two planes with normals $\mathbf{n}_1$, $\mathbf{n}_2$?'
        back: '$\mathbf{n}_1 \times \mathbf{n}_2$'
        type: basic

  - id: vector-functions-basics
    name: "Vector Functions and Space Curves"
    core: true
    difficulty: 0.60
    drill: false
    answer_kind: numeric
    expected_time_secs: 100
    prerequisites:
      - id: parametric-equations
        weight: 0.6
        key: true
      - id: vectors-in-rn
        weight: 0.5
        key: true
      - id: domain-range
        weight: 0.3
        key: false
    knowledge_points:
      - id: kp1
        name: 'Evaluation and domains'
        key_prerequisites: [vectors-in-rn, domain-range]
        exemplars:
          - problem: 'Let $\mathbf{r}(t) = \langle t^2,\ t - 1,\ 1/t \rangle$. Find $\mathbf{r}(2)$.'
            answer: '(4, 1, 1/2)'
            answer_contract: {"kind":"coordinates","arity":3}
            solution_sketch: 'Put $t = 2$ into each component. This gives $2^2 = 4$, then $2 - 1 = 1$, then $1/2$. So $\mathbf{r}(2) = (4, 1, 1/2)$.'
          - problem: 'For which values of $t$ is $\mathbf{r}(t) = \langle \sqrt{t - 1},\ \ln(4 - t),\ 1/t \rangle$ defined?'
            answer: '1 <= t < 4'
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'The root needs $t - 1 \ge 0$, so $t \ge 1$. The logarithm needs $4 - t > 0$, so $t < 4$. The reciprocal needs $t \ne 0$, which already holds on this interval. So $1 \le t < 4$.'
          - problem: 'A drone leaves its launch pad. After $t$ seconds its position in metres is $\mathbf{r}(t) = \langle 4t,\ 3t,\ 20t - 5t^2 \rangle$. Where is the drone after $3$ seconds?'
            answer: '(12, 9, 15)'
            answer_contract: {"kind":"coordinates","arity":3}
            solution_sketch: 'Put $t = 3$ into each component. This gives $4(3) = 12$, $3(3) = 9$ and $20(3) - 5(9) = 15$. So the drone is at $(12, 9, 15)$, with all three numbers in metres.'
          - problem: 'A bee flies along $\mathbf{r}(t) = \langle 2t,\ t + 1,\ 3t \rangle$, where $t$ is in seconds and lengths are in metres. At what time is the bee at the point $(6, 4, 9)$?'
            answer: '3'
            answer_contract: {"kind":"unit","quantity":"time","unit":"s","allow_omitted":true}
            solution_sketch: 'The first component gives $2t = 6$, so $t = 3$. Check the other two: $t + 1 = 4$ and $3t = 9$. All three agree, so the bee is at that point at $t = 3$ seconds.'
          - problem: 'For which values of $t$ is $\mathbf{r}(t) = \langle \sqrt{6 - t},\ \dfrac{1}{t + 1},\ \ln(t + 4) \rangle$ defined?'
            answer: '-4 < t < -1 or -1 < t <= 6'
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'The root needs $6 - t \ge 0$, so $t \le 6$. The reciprocal needs $t \ne -1$. The logarithm needs $t + 4 > 0$, so $t > -4$. Removing $t = -1$ from $-4 < t \le 6$ leaves $-4 < t < -1$ or $-1 < t \le 6$.'
          - problem: 'Does the curve $\mathbf{r}(t) = \langle t,\ t^2,\ t^3 \rangle$ pass through the point $(2, 4, 9)$?'
            answer: 'no'
            answer_contract: {"kind":"label","options":[["no","it does not","it does not pass through it","not on the curve"],["yes","it does","it passes through it","on the curve"]]}
            solution_sketch: 'The first component gives $t = 2$. At $t = 2$ the point of the curve is $(2, 4, 8)$, and its last entry is $8$, not $9$. So the curve does not pass through $(2, 4, 9)$.'
          - problem: 'Sam says $\mathbf{r}(t) = \langle \ln t,\ \sqrt{9 - t},\ 2t \rangle$ is defined for all $t < 9$. For which values of $t$ is it actually defined?'
            answer: '0 < t <= 9'
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'The logarithm needs $t > 0$, which Sam left out. The root needs $9 - t \ge 0$, so $t \le 9$, and $t = 9$ is allowed. So the function is defined for $0 < t \le 9$.'
          - problem: 'Let $\mathbf{r}(t) = \langle \cos t,\ \sin t,\ t \rangle$. Find $\mathbf{r}(\pi)$.'
            answer: '(-1, 0, pi)'
            answer_contract: {"kind":"coordinates","arity":3}
            solution_sketch: 'Put $t = \pi$ into each component. Then $\cos \pi = -1$, $\sin \pi = 0$ and the last entry is $\pi$. So $\mathbf{r}(\pi) = (-1, 0, \pi)$.'
          - problem: 'The position of the drone in the earlier flight is $\mathbf{r}(t) = \langle 4t,\ 3t,\ 20t - 5t^2 \rangle$ metres. How far is the drone from its launch point after $3$ seconds?'
            answer: '15sqrt(2)'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'At $t = 3$ the drone is at $(12, 9, 15)$, and the launch point is the origin. The distance is $\sqrt{12^2 + 9^2 + 15^2} = \sqrt{450} = 15\sqrt{2}$ metres.'
        constraints: 'components use one root, log, or reciprocal each; domains are single intervals or a union of two; evaluation items use integer or simple trigonometric inputs'
      - id: kp2
        name: 'Limits of vector functions'
        key_prerequisites: [parametric-equations]
        exemplars:
          - problem: 'Find $\displaystyle\lim_{t \to 0} \left\langle \frac{\sin 3t}{t},\ t^2 + 4,\ e^{2t} \right\rangle$.'
            answer: '(3, 4, 1)'
            answer_contract: {"kind":"coordinates","arity":3}
            solution_sketch: 'Take the limit of each component. First, $\frac{\sin 3t}{t} = 3 \cdot \frac{\sin 3t}{3t} \to 3$. Second, $t^2 + 4 \to 4$. Third, $e^{2t} \to e^0 = 1$. So the limit is $(3, 4, 1)$.'
          - problem: 'Find $\displaystyle\lim_{t \to 2} \left\langle \frac{t^2 - 4}{t - 2},\ t^3,\ 5 \right\rangle$.'
            answer: '(4, 8, 5)'
            answer_contract: {"kind":"coordinates","arity":3}
            solution_sketch: 'Take the limit of each component. First, $\frac{t^2 - 4}{t - 2} = t + 2 \to 4$ for $t \ne 2$. Second, $t^3 \to 8$. The constant $5$ stays $5$. So the limit is $(4, 8, 5)$.'
          - problem: 'Find $\displaystyle\lim_{t \to 0} \left\langle \frac{\sin 4t}{2t},\ \frac{t^2 + 5t}{t},\ 3t + 2 \right\rangle$.'
            answer: '(2, 5, 2)'
            answer_contract: {"kind":"coordinates","arity":3}
            solution_sketch: 'First, $\frac{\sin 4t}{2t} = 2 \cdot \frac{\sin 4t}{4t} \to 2$. Second, $\frac{t^2 + 5t}{t} = t + 5 \to 5$ for $t \ne 0$. Third, $3t + 2 \to 2$. So the limit is $(2, 5, 2)$.'
          - problem: 'A dust grain drifts so that, $t > 0$ seconds after release, its position in centimetres is $\left\langle \dfrac{\sin 3t}{t},\ \dfrac{t^2 + 2t}{t},\ 5 \right\rangle$. Which point does the grain approach as $t \to 0^+$?'
            answer: '(3, 2, 5)'
            answer_contract: {"kind":"coordinates","arity":3}
            solution_sketch: 'Take the limit of each component as $t \to 0^+$. First, $\frac{\sin 3t}{t} \to 3$. Second, $\frac{t^2 + 2t}{t} = t + 2 \to 2$. The last entry is always $5$. So the grain approaches $(3, 2, 5)$.'
          - problem: 'Find $\displaystyle\lim_{t \to \infty} \left\langle \frac{1}{t},\ \frac{2t + 1}{t},\ e^{-t} \right\rangle$.'
            answer: '(0, 2, 0)'
            answer_contract: {"kind":"coordinates","arity":3}
            solution_sketch: 'First, $\frac{1}{t} \to 0$. Second, $\frac{2t + 1}{t} = 2 + \frac{1}{t} \to 2$. Third, $e^{-t} \to 0$. So the limit is $(0, 2, 0)$.'
          - problem: 'Does $\displaystyle\lim_{t \to 0} \left\langle \frac{|t|}{t},\ t,\ 1 \right\rangle$ exist?'
            answer: 'no'
            answer_contract: {"kind":"label","options":[["no","it does not exist","the limit does not exist","does not exist"],["yes","it exists","the limit exists","exists"]]}
            solution_sketch: 'A vector limit exists only if every component limit exists. For $\frac{|t|}{t}$ the limit from the right is $1$ and from the left is $-1$. These differ, so the first component has no limit, and the limit of the vector does not exist.'
          - problem: 'The function $\mathbf{r}(t) = \left\langle \dfrac{t^2 - 1}{t - 1},\ t + 3,\ 2 \right\rangle$ is defined for $t \ne 1$. What vector must be assigned to $\mathbf{r}(1)$ so that $\mathbf{r}$ is continuous at $t = 1$?'
            answer: '(2, 4, 2)'
            answer_contract: {"kind":"coordinates","arity":3}
            solution_sketch: 'Continuity at $t = 1$ requires $\mathbf{r}(1)$ to equal the limit as $t \to 1$. First, $\frac{t^2 - 1}{t - 1} = t + 1 \to 2$. Second, $t + 3 \to 4$. The last entry is $2$. So $\mathbf{r}(1) = (2, 4, 2)$.'
          - problem: 'A glider''s position in metres at time $t$ seconds is $\mathbf{r}(t) = \left\langle \dfrac{t^2 - 25}{t - 5},\ 2t,\ \dfrac{100}{t^2} \right\rangle$ for $t \ne 5$. The formula fails at $t = 5$, but the glider flies on without a jump. At which point is the glider at $t = 5$?'
            answer: '(10, 10, 4)'
            answer_contract: {"kind":"coordinates","arity":3}
            solution_sketch: 'The glider has no jump, so its position at $t = 5$ is the limit as $t \to 5$. First, $\frac{t^2 - 25}{t - 5} = t + 5 \to 10$. Second, $2t \to 10$. Third, $\frac{100}{25} = 4$. So the glider is at $(10, 10, 4)$.'
          - problem: 'Sam finds $\displaystyle\lim_{t \to 0} \left\langle \frac{\sin 2t}{t},\ \cos t,\ t + 1 \right\rangle$ and writes $(1, 1, 1)$, because $\frac{\sin u}{u} \to 1$. What is the correct limit?'
            answer: '(2, 1, 1)'
            answer_contract: {"kind":"coordinates","arity":3}
            solution_sketch: 'The standard limit needs the same $u$ in the numerator and the denominator. Here $\frac{\sin 2t}{t} = 2 \cdot \frac{\sin 2t}{2t} \to 2$. Also $\cos t \to 1$ and $t + 1 \to 1$. So the correct limit is $(2, 1, 1)$.'
        constraints: 'componentwise limits solvable by standard single-variable techniques (factoring, sin t / t); one verdict item on whether a limit exists; continuity items ask for the vector that makes r continuous'
      - id: kp3
        name: 'Identifying space curves'
        key_prerequisites: [parametric-equations, vectors-in-rn]
        exemplars:
          - problem: 'What kind of curve is $\mathbf{r}(t) = \langle 1 + 2t,\ 3t,\ 4 - t \rangle$?'
            answer: 'line'
            answer_contract: {"kind":"label","options":[["line","a line","straight line","a straight line"],["circle","a circle"],["helix","a helix","spiral"],["parabola","a parabola"],["ellipse","an ellipse"]]}
            solution_sketch: 'Every component has the form constant plus number times $t$. So the point moves from $(1, 0, 4)$ along the fixed direction $\langle 2, 3, -1 \rangle$. The curve is a straight line.'
          - problem: 'The curve $\mathbf{r}(t) = \langle 3\cos 2t,\ 3\sin 2t,\ 4 \rangle$ is a circle. Find its radius.'
            answer: '3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The first two components satisfy $x^2 + y^2 = 9\cos^2 2t + 9\sin^2 2t = 9$. So the circle has radius $\sqrt{9} = 3$. The constant $z = 4$ only fixes the height of its plane.'
          - problem: 'Every point of the curve $\mathbf{r}(t) = \langle t\cos t,\ t\sin t,\ t \rangle$ lies on a cone. Find an equation of the cone.'
            answer: 'x^2 + y^2 = z^2'
            answer_contract: {"kind":"polynomial_relation"}
            solution_sketch: 'Here $x^2 + y^2 = t^2\cos^2 t + t^2\sin^2 t = t^2$. Since $z = t$, we get $z^2 = t^2$ as well. So every point satisfies $x^2 + y^2 = z^2$.'
          - problem: 'What kind of curve is $\mathbf{r}(t) = \langle 2\cos t,\ 2\sin t,\ 3t \rangle$?'
            answer: 'helix'
            answer_contract: {"kind":"label","options":[["helix","a helix","spiral"],["line","a line","straight line"],["circle","a circle"],["parabola","a parabola"],["ellipse","an ellipse"]]}
            solution_sketch: 'The first two components give $x^2 + y^2 = 4$ for every $t$, so the point stays at distance $2$ from the $z$-axis. The height $z = 3t$ grows steadily. The point winds around a cylinder while rising, so the curve is a helix.'
          - problem: 'The curve $\mathbf{r}(t) = \langle 2\cos t,\ 2\sin t,\ 3t \rangle$ lies on a cylinder around the $z$-axis. Find an equation of the cylinder.'
            answer: 'x^2 + y^2 = 4'
            answer_contract: {"kind":"polynomial_relation"}
            solution_sketch: 'Compute $x^2 + y^2 = 4\cos^2 t + 4\sin^2 t = 4$. This does not involve $z = 3t$. So the curve lies on the cylinder $x^2 + y^2 = 4$.'
          - problem: 'A spiral staircase has the shape $\mathbf{r}(t) = \langle 2\cos t,\ 2\sin t,\ 0.75t \rangle$, where lengths are in metres. How high does the staircase rise during one full turn, from $t = 0$ to $t = 2\pi$?'
            answer: '3pi/2'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'The height is $z = 0.75t$. At $t = 0$ it is $0$, and at $t = 2\pi$ it is $0.75 \cdot 2\pi = 3\pi/2$. So the staircase rises $3\pi/2$ metres in one full turn.'
          - problem: 'A spiral ramp follows $\mathbf{r}(t) = \langle 5\cos t,\ 5\sin t,\ 0.5t \rangle$ metres, starting at $t = 0$. Its top is $6\pi$ metres above the start. How many full turns does the ramp make?'
            answer: '6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The height is $z = 0.5t$, so the top is where $0.5t = 6\pi$, which gives $t = 12\pi$. One full turn takes $2\pi$ units of $t$. So the number of turns is $12\pi \div 2\pi = 6$.'
          - problem: 'A particle moves with position $\mathbf{r}(t) = \langle 2 - 3t,\ 1 + t,\ 5t \rangle$ metres. Find the vector from its position at $t = 0$ to its position at $t = 1$.'
            answer: '(-3, 1, 5)'
            answer_contract: {"kind":"coordinates","arity":3}
            solution_sketch: 'At $t = 0$ the particle is at $(2, 1, 0)$ and at $t = 1$ it is at $(-1, 2, 5)$. Subtract: $(-1 - 2,\ 2 - 1,\ 5 - 0) = (-3, 1, 5)$.'
          - problem: 'Sam says the curve $\mathbf{r}(t) = \langle 3\cos t,\ 3\sin t,\ 5 \rangle$ is a circle of radius $9$, because $x^2 + y^2 = 9$. What is the correct radius?'
            answer: '3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The equation $x^2 + y^2 = 9$ has the form $x^2 + y^2 = \rho^2$, where $\rho$ is the radius. So $\rho = \sqrt{9} = 3$. Sam gave $\rho^2$ instead of $\rho$.'
        constraints: 'curves are lines, circles, helices, or curves lying on a named quadric; surface items ask for an equation, verdict items name no option in the question'
    diagnostic_exemplar:
      problem: 'Describe the curve $\mathbf{r}(t) = \langle 2\cos t,\; 2\sin t,\; \ln t \rangle$, including its domain.'
      answer: 'Domain $t > 0$. The curve lies on the cylinder $x^2 + y^2 = 4$: it winds counterclockwise around the $z$-axis at radius $2$ while its height $z = \ln t$ increases without bound, dropping to $-\infty$ as $t \to 0^+$.'
      answer_contract: {kind: none}
      solution_sketch: '$\ln t$ forces $t > 0$; and $x^2 + y^2 = 4\cos^2 t + 4\sin^2 t = 4$, so every point lies on the cylinder of radius $2$.'
    anki_seeds:
      - front: 'How do you take the limit of a vector function $\mathbf{r}(t)$?'
        back: 'Componentwise: the limit of each coordinate function separately.'
        type: basic
      - front: 'The curve $\langle \cos t, \sin t, t \rangle$ is a {{c1::helix}} winding around the $z$-axis.'
        back: 'helix'
        type: cloze

  - id: vector-valued-functions
    name: "Calculus of Vector Functions"
    core: true
    difficulty: 0.65
    drill: false
    answer_kind: numeric
    expected_time_secs: 150
    prerequisites:
      - id: vector-functions-basics
        weight: 0.7
        key: true
      - id: derivatives-trig
        weight: 0.5
        key: true
      - id: derivatives-exp-log
        weight: 0.4
        key: false
      - id: definite-integrals-ftc
        weight: 0.4
        key: false
    knowledge_points:
      - id: kp1
        name: 'Derivatives of vector functions'
        key_prerequisites: [vector-functions-basics, derivatives-trig]
        exemplars:
          - problem: 'Let $\mathbf{r}(t) = \langle t^3,\ 4t^2 - t,\ 5 \rangle$. Find $\mathbf{r}''(t)$.'
            answer: '(3t^2, 8t - 1, 0)'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Differentiate each component separately. The derivative of $t^3$ is $3t^2$, the derivative of $4t^2 - t$ is $8t - 1$, and the derivative of the constant $5$ is $0$. So $\mathbf{r}''(t) = \langle 3t^2, 8t - 1, 0 \rangle$.'
          - problem: 'Let $\mathbf{r}(t) = \langle t^3,\ \sin 2t,\ e^{-t} \rangle$. Find $\mathbf{r}''(0)$.'
            answer: '(0, 2, -1)'
            answer_contract: {"kind":"coordinates","arity":3}
            solution_sketch: 'Differentiate each component: $\mathbf{r}''(t) = \langle 3t^2, 2\cos 2t, -e^{-t} \rangle$ by the chain rule. At $t = 0$ this is $\langle 0, 2, -1 \rangle$. So $\mathbf{r}''(0) = (0, 2, -1)$.'
          - problem: 'Let $\mathbf{r}(t) = \langle t\,e^t,\ \cos 2t,\ (t^2 + 1)^3 \rangle$. Find the first component of $\mathbf{r}''(t)$.'
            answer: 'e^t + t e^t'
            answer_contract: {"kind":"function","vars":["t"]}
            solution_sketch: 'The first component of $\mathbf{r}''(t)$ is the derivative of $t\,e^t$. The product rule gives $1 \cdot e^t + t \cdot e^t$. So the first component is $e^t + t e^t$, which equals $e^t(1 + t)$.'
          - problem: 'A bee flies along $\mathbf{r}(t) = \langle t^2,\ 3t,\ t^3 \rangle$, where $t$ is in seconds and lengths are in metres. Find its velocity vector at $t = 2$.'
            answer: '(4, 3, 12)'
            answer_contract: {"kind":"coordinates","arity":3}
            solution_sketch: 'The velocity is the derivative $\mathbf{r}''(t) = \langle 2t, 3, 3t^2 \rangle$. At $t = 2$ this is $\langle 4, 3, 12 \rangle$. So the velocity is $(4, 3, 12)$ metres per second.'
          - problem: 'Let $\mathbf{r}(t) = \langle t^4,\ t^3 - t,\ 3t^2 + 2t \rangle$. Find $\mathbf{r}''''(t)$.'
            answer: '(12t^2, 6t, 6)'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Differentiate twice, one component at a time. The first derivative is $\langle 4t^3, 3t^2 - 1, 6t + 2 \rangle$. Differentiating again gives $\langle 12t^2, 6t, 6 \rangle$.'
          - problem: 'Sam differentiates $\mathbf{r}(t) = \langle t^2,\ e^{2t},\ \sin t \rangle$ and writes $\mathbf{r}''(t) = \langle 2t, e^{2t}, \cos t \rangle$. What is the correct second component of $\mathbf{r}''(t)$?'
            answer: '2e^(2t)'
            answer_contract: {"kind":"function","vars":["t"]}
            solution_sketch: 'Sam forgot the chain rule for $e^{2t}$. Its derivative is $e^{2t} \cdot 2 = 2e^{2t}$. The other two components of Sam''s answer, $2t$ and $\cos t$, are right.'
          - problem: 'The position of the bee in the earlier flight is $\mathbf{r}(t) = \langle t^2,\ 3t,\ t^3 \rangle$ metres at $t$ seconds. How fast is the bee rising at $t = 2$?'
            answer: '12'
            answer_contract: {"kind":"unit","quantity":"speed","unit":"m/s","allow_omitted":true}
            solution_sketch: 'The height is the third component $z = t^3$. Its rate of change is $z''(t) = 3t^2$. At $t = 2$ this is $3 \cdot 4 = 12$, so the bee rises at $12$ metres per second.'
          - problem: 'For $\mathbf{r}(t) = \langle t^2 + t,\ e^{2t},\ 5t \rangle$, at what time is the first component of $\mathbf{r}''(t)$ equal to $7$?'
            answer: '3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The first component of $\mathbf{r}''(t)$ is the derivative of $t^2 + t$, which is $2t + 1$. Setting $2t + 1 = 7$ gives $t = 3$.'
          - problem: 'Let $\mathbf{r}(t) = \langle (2t + 1)^3,\ t^2/2,\ 7 \rangle$. Find $\mathbf{r}''(t)$.'
            answer: '(6(2t+1)^2, t, 0)'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Differentiate each component. The chain rule gives $3(2t + 1)^2 \cdot 2 = 6(2t + 1)^2$ for the first. The derivative of $t^2/2$ is $t$, and the derivative of the constant $7$ is $0$. So $\mathbf{r}''(t) = \langle 6(2t + 1)^2, t, 0 \rangle$.'
          - problem: 'Let $\mathbf{r}(t) = \langle \sin t,\ \cos t,\ t^3 \rangle$. Find $\mathbf{r}''(\pi)$.'
            answer: '(-1, 0, 3pi^2)'
            answer_contract: {"kind":"coordinates","arity":3}
            solution_sketch: 'Differentiate each component: $\mathbf{r}''(t) = \langle \cos t, -\sin t, 3t^2 \rangle$. At $t = \pi$ the first entry is $\cos \pi = -1$, the second is $-\sin \pi = 0$ and the third is $3\pi^2$. So $\mathbf{r}''(\pi) = (-1, 0, 3\pi^2)$.'
          - problem: 'Let $\mathbf{r}(t) = \langle t^3,\ e^{3t},\ \ln t \rangle$ for $t > 0$. Find $\mathbf{r}''(t)$.'
            answer: '(3t^2, 3e^(3t), 1/t)'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Differentiate each component separately. The derivative of $t^3$ is $3t^2$, the derivative of $e^{3t}$ is $3e^{3t}$ by the chain rule, and the derivative of $\ln t$ is $1/t$. So $\mathbf{r}''(t) = \langle 3t^2, 3e^{3t}, 1/t \rangle$.'
        constraints: 'polynomial, trigonometric, exponential and log components; vector-form answers use one tuple; chain and product rules on single components; second derivatives allowed'
      - id: kp2
        name: 'Tangent vectors and tangent lines'
        key_prerequisites: [vector-functions-basics]
        exemplars:
          - problem: 'Find the tangent vector to the curve $\mathbf{r}(t) = \langle t^2,\ t^3,\ t \rangle$ at $t = 1$.'
            answer: '(2, 3, 1)'
            answer_contract: {"kind":"coordinates","arity":3}
            solution_sketch: 'The tangent vector is $\mathbf{r}''(t) = \langle 2t, 3t^2, 1 \rangle$. At $t = 1$ this is $\langle 2, 3, 1 \rangle$. So the tangent vector is $(2, 3, 1)$.'
          - problem: 'Find the tangent vector to the curve $\mathbf{r}(t) = \langle \cos t,\ \sin t,\ t \rangle$ at $t = 0$.'
            answer: '(0, 1, 1)'
            answer_contract: {"kind":"coordinates","arity":3}
            solution_sketch: 'The tangent vector is $\mathbf{r}''(t) = \langle -\sin t, \cos t, 1 \rangle$. At $t = 0$ this is $\langle 0, 1, 1 \rangle$. So the tangent vector is $(0, 1, 1)$.'
          - problem: 'Find parametric equations of the tangent line to $\mathbf{r}(t) = \langle t^2,\ 2t,\ t^3 \rangle$ at $t = 1$. Use $s$ as the parameter, so that the line is at the point of tangency when $s = 0$ and has direction $\mathbf{r}''(1)$.'
            answer: '(1 + 2s, 2 + 2s, 1 + 3s)'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The point of tangency is $\mathbf{r}(1) = (1, 2, 1)$. The direction is $\mathbf{r}''(1)$, where $\mathbf{r}''(t) = \langle 2t, 2, 3t^2 \rangle$, so $\mathbf{r}''(1) = \langle 2, 2, 3 \rangle$. The line is $(1 + 2s, 2 + 2s, 1 + 3s)$.'
          - problem: 'Find the direction vector $\mathbf{r}''(-1)$ of the tangent line to $\mathbf{r}(t) = \langle t^2,\ 2t,\ t^4 \rangle$ at $t = -1$.'
            answer: '(-2, 2, -4)'
            answer_contract: {"kind":"coordinates","arity":3}
            solution_sketch: 'The derivative is $\mathbf{r}''(t) = \langle 2t, 2, 4t^3 \rangle$. At $t = -1$ this is $\langle -2, 2, -4 \rangle$. So the direction vector is $(-2, 2, -4)$.'
          - problem: 'For $\mathbf{r}(t) = \langle t^3,\ 2t^2,\ 4t \rangle$, at what time $t > 0$ is the tangent vector equal to $(12, 8, 4)$?'
            answer: '2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The tangent vector is $\mathbf{r}''(t) = \langle 3t^2, 4t, 4 \rangle$. Setting $4t = 8$ gives $t = 2$. The other components agree: $3 \cdot 4 = 12$ and $4 = 4$. So $t = 2$.'
          - problem: 'A bead slides along a wire shaped like $\mathbf{r}(t) = \langle t^2,\ t^3,\ t \rangle$ metres, with $t$ in seconds. At $t = 1$ it leaves the wire and moves in a straight line with constant velocity $\mathbf{r}''(1)$. Where is the bead $2$ seconds after it leaves?'
            answer: '(5, 7, 3)'
            answer_contract: {"kind":"coordinates","arity":3}
            solution_sketch: 'At $t = 1$ the bead is at $\mathbf{r}(1) = (1, 1, 1)$ with velocity $\mathbf{r}''(1) = \langle 2, 3, 1 \rangle$. After $2$ seconds it has moved $2 \cdot (2, 3, 1) = (4, 6, 2)$. So it is at $(1 + 4, 1 + 6, 1 + 2) = (5, 7, 3)$.'
          - problem: 'Find the unit tangent vector to $\mathbf{r}(t) = \langle 3\cos t,\ 3\sin t,\ 4t \rangle$ at $t = 0$.'
            answer: '(0, 3/5, 4/5)'
            answer_contract: {"kind":"coordinates","arity":3}
            solution_sketch: 'The tangent vector is $\mathbf{r}''(t) = \langle -3\sin t, 3\cos t, 4 \rangle$, which is $\langle 0, 3, 4 \rangle$ at $t = 0$. Its length is $\sqrt{0 + 9 + 16} = 5$. Dividing by $5$ gives the unit tangent vector $(0, 3/5, 4/5)$.'
          - problem: 'Sam says the tangent vector to $\mathbf{r}(t) = \langle t^2,\ t^3,\ t \rangle$ at $t = 2$ is $\mathbf{r}(2) = (4, 8, 2)$. What is the correct tangent vector?'
            answer: '(4, 12, 1)'
            answer_contract: {"kind":"coordinates","arity":3}
            solution_sketch: 'Sam found the position $\mathbf{r}(2)$, not the tangent vector. The tangent vector is $\mathbf{r}''(2)$, where $\mathbf{r}''(t) = \langle 2t, 3t^2, 1 \rangle$. At $t = 2$ this is $(4, 12, 1)$.'
          - problem: 'A roller-coaster car moves along the track $\mathbf{r}(t) = \langle t^2,\ t,\ t^3 - 3t \rangle$ metres, with $t$ in seconds and the third component the height. At $t = 1$, is the car moving parallel to the ground?'
            answer: 'yes'
            answer_contract: {"kind":"label","options":[["yes","it is","parallel to the ground","it is moving parallel"],["no","it is not","not parallel","it is not moving parallel"]]}
            solution_sketch: 'The velocity is $\mathbf{r}''(t) = \langle 2t, 1, 3t^2 - 3 \rangle$. At $t = 1$ this is $\langle 2, 1, 0 \rangle$, and its height component is $0$. So the car is neither rising nor falling, and it moves parallel to the ground.'
          - problem: 'Find parametric equations of the tangent line to $\mathbf{r}(t) = \langle t,\ e^t,\ t^2 \rangle$ at $t = 0$. Use $s$ as the parameter, so that the line is at the point of tangency when $s = 0$ and has direction $\mathbf{r}''(0)$.'
            answer: '(s, 1 + s, 0)'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The point of tangency is $\mathbf{r}(0) = (0, 1, 0)$. The direction is $\mathbf{r}''(0)$, where $\mathbf{r}''(t) = \langle 1, e^t, 2t \rangle$, so $\mathbf{r}''(0) = \langle 1, 1, 0 \rangle$. The line is $(s, 1 + s, 0)$.'
        constraints: 'tangent-line base points and directions are integer vectors after evaluation; the unit tangent item has an integer-length derivative; one verdict item on whether the tangent is horizontal'
      - id: kp3
        name: 'Integrals of vector functions'
        key_prerequisites: [vector-functions-basics, definite-integrals-ftc]
        exemplars:
          - problem: 'Evaluate $\displaystyle\int_0^1 \langle 2t,\ 6t^2,\ 12t^3 \rangle\, dt$.'
            answer: '(1, 2, 3)'
            answer_contract: {"kind":"coordinates","arity":3}
            solution_sketch: 'Integrate each component: $2t$ gives $t^2$, $6t^2$ gives $2t^3$, and $12t^3$ gives $3t^4$. Evaluate each from $0$ to $1$ to get $1$, $2$ and $3$. So the integral is $(1, 2, 3)$.'
          - problem: 'Let $\mathbf{r}''(t) = \langle 2t,\ 4t^3,\ 6t^5 \rangle$ and $\mathbf{r}(0) = \langle 1, -1, 2 \rangle$. Find $\mathbf{r}(1)$.'
            answer: '(2, 0, 3)'
            answer_contract: {"kind":"coordinates","arity":3}
            solution_sketch: 'Antidifferentiate each component: $\mathbf{r}(t) = \langle t^2 + C_1, t^4 + C_2, t^6 + C_3 \rangle$. The condition $\mathbf{r}(0) = \langle 1, -1, 2 \rangle$ gives $C_1 = 1$, $C_2 = -1$ and $C_3 = 2$. Then $\mathbf{r}(1) = (2, 0, 3)$.'
          - problem: 'Let $\mathbf{r}''(t) = \langle 2t,\ \cos t,\ 3 \rangle$ and $\mathbf{r}(0) = \langle 1, 0, 5 \rangle$. Find $\mathbf{r}(\pi/2)$.'
            answer: '(pi^2/4 + 1, 1, 3pi/2 + 5)'
            answer_contract: {"kind":"coordinates","arity":3}
            solution_sketch: 'Antidifferentiate each component: $\mathbf{r}(t) = \langle t^2 + C_1, \sin t + C_2, 3t + C_3 \rangle$. The condition $\mathbf{r}(0) = \langle 1, 0, 5 \rangle$ gives $C_1 = 1$, $C_2 = 0$ and $C_3 = 5$. At $t = \pi/2$ this is $(\pi^2/4 + 1, 1, 3\pi/2 + 5)$.'
          - problem: 'Evaluate $\displaystyle\int_0^{\pi} \langle \cos t,\ \sin t,\ 1 \rangle\, dt$.'
            answer: '(0, 2, pi)'
            answer_contract: {"kind":"coordinates","arity":3}
            solution_sketch: 'Integrate each component: $\cos t$ gives $\sin t$, $\sin t$ gives $-\cos t$, and $1$ gives $t$. Evaluate from $0$ to $\pi$: $0$, then $1 + 1 = 2$, then $\pi$. So the integral is $(0, 2, \pi)$.'
          - problem: 'A particle has velocity $\mathbf{v}(t) = \langle 2t,\ 3t^2,\ 6 \rangle$ metres per second. Find its displacement vector from $t = 0$ to $t = 2$.'
            answer: '(4, 8, 12)'
            answer_contract: {"kind":"coordinates","arity":3}
            solution_sketch: 'The displacement is the integral of the velocity. Integrating each component gives $t^2$, $t^3$ and $6t$. Evaluating from $0$ to $2$ gives $4$, $8$ and $12$. So the displacement is $(4, 8, 12)$ metres.'
          - problem: 'A particle has velocity $\mathbf{v}(t) = \langle 2t,\ 3t^2,\ 6 \rangle$ metres per second. Find its average velocity over the time from $t = 0$ to $t = 2$.'
            answer: '(2, 4, 6)'
            answer_contract: {"kind":"coordinates","arity":3}
            solution_sketch: 'The displacement over this time is $(4, 8, 12)$ metres. The average velocity is the displacement divided by the time $2$ seconds. So it is $(4/2, 8/2, 12/2) = (2, 4, 6)$ metres per second.'
          - problem: 'Let $\mathbf{r}''(t) = \langle 6t,\ 3t^2,\ 2t \rangle$ and $\mathbf{r}(1) = \langle 2, 1, 3 \rangle$. Find $\mathbf{r}(t)$.'
            answer: '(3t^2 - 1, t^3, t^2 + 2)'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Antidifferentiate each component: $\mathbf{r}(t) = \langle 3t^2 + C_1, t^3 + C_2, t^2 + C_3 \rangle$. At $t = 1$ this is $\langle 3 + C_1, 1 + C_2, 1 + C_3 \rangle = \langle 2, 1, 3 \rangle$. So $C_1 = -1$, $C_2 = 0$ and $C_3 = 2$.'
          - problem: 'Evaluate $\displaystyle\int_1^2 \langle 2t,\ 3t^2,\ 4t^3 \rangle\, dt$.'
            answer: '(3, 7, 15)'
            answer_contract: {"kind":"coordinates","arity":3}
            solution_sketch: 'Integrate each component: $t^2$, $t^3$ and $t^4$. Evaluate from $1$ to $2$: $4 - 1 = 3$, $8 - 1 = 7$ and $16 - 1 = 15$. So the integral is $(3, 7, 15)$.'
          - problem: 'A drone starts at the point $(1, 2, 3)$ and flies with velocity $\mathbf{v}(t) = \langle 2t,\ 3t^2,\ 4t^3 \rangle$ metres per second. Where is the drone after $2$ seconds?'
            answer: '(5, 10, 19)'
            answer_contract: {"kind":"coordinates","arity":3}
            solution_sketch: 'The position is $\mathbf{r}(t) = \langle t^2, t^3, t^4 \rangle + \mathbf{C}$, and $\mathbf{r}(0) = (1, 2, 3)$ gives $\mathbf{C} = (1, 2, 3)$. At $t = 2$ this is $(4 + 1, 8 + 2, 16 + 3) = (5, 10, 19)$.'
          - problem: 'Sam evaluates $\displaystyle\int_0^2 \langle 6t,\ 3t^2,\ 2 \rangle\, dt$ by putting $t = 2$ into the integrand and gets $\langle 12, 12, 2 \rangle$. What is the correct value?'
            answer: '(12, 8, 4)'
            answer_contract: {"kind":"coordinates","arity":3}
            solution_sketch: 'Sam substituted into the integrand instead of integrating it. Integrate each component: $3t^2$, $t^3$ and $2t$. Evaluate from $0$ to $2$: $12$, $8$ and $4$. So the correct value is $(12, 8, 4)$.'
          - problem: 'Evaluate $\displaystyle\int_0^2 \langle t,\ t^2,\ t^3 \rangle\, dt$.'
            answer: '(2, 8/3, 4)'
            answer_contract: {"kind":"coordinates","arity":3}
            solution_sketch: 'Integrate each component: $t^2/2$, $t^3/3$ and $t^4/4$. Evaluate from $0$ to $2$: $4/2 = 2$, $8/3$ and $16/4 = 4$. So the integral is $(2, 8/3, 4)$.'
        constraints: 'polynomial or simple trigonometric and exponential components; initial conditions with small integers; displacement and average-velocity items from a velocity vector'
    diagnostic_exemplar:
      problem: 'Given $\mathbf{r}''(t) = \langle 2t,\; 1,\; 3t^2 \rangle$ and $\mathbf{r}(0) = \langle 0, 1, 0 \rangle$, find parametric equations for the tangent line to the curve $\mathbf{r}$ at $t = 1$.'
      answer: '$x = 1 + 2s,\; y = 2 + s,\; z = 1 + 3s$'
      answer_contract: {kind: none}
      solution_sketch: 'Integrating componentwise and fitting $\mathbf{r}(0)$ gives $\mathbf{r}(t) = \langle t^2, t + 1, t^3 \rangle$. Then $\mathbf{r}(1) = \langle 1, 2, 1 \rangle$ is the base point and $\mathbf{r}''(1) = \langle 2, 1, 3 \rangle$ the direction.'
    anki_seeds:
      - front: 'How do you differentiate a vector-valued function $\mathbf{r}(t)$?'
        back: 'Componentwise: differentiate each coordinate function separately.'
        type: basic
      - front: 'How do you integrate a vector-valued function?'
        back: 'Componentwise; a vector constant of integration is fixed by an initial condition.'
        type: basic

  - id: motion-in-space
    name: "Motion in Space: Velocity and Acceleration"
    core: false                # kinematics application; terminal
    difficulty: 0.66
    drill: false
    answer_kind: numeric
    expected_time_secs: 150
    prerequisites:
      - id: vector-valued-functions
        weight: 0.8
        key: true
      - id: definite-integrals-ftc
        weight: 0.4
        key: false
    knowledge_points:
      - id: kp1
        name: 'Velocity, speed, and acceleration'
        key_prerequisites: [vector-valued-functions]
        exemplars:
          - problem: 'For $\mathbf{r}(t) = \langle t^2,\ 2t,\ \ln t \rangle$, find the speed at $t = 1$.'
            answer: '3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The velocity is $\mathbf{v}(t) = \langle 2t, 2, 1/t \rangle$, which is $\langle 2, 2, 1 \rangle$ at $t = 1$. The speed is its length: $\sqrt{4 + 4 + 1} = 3$.'
          - problem: 'A particle has position $\mathbf{r}(t) = \langle t^2,\ 2t,\ t^3 \rangle$. Find its velocity vector at $t = 2$.'
            answer: '(4, 2, 12)'
            answer_contract: {"kind":"coordinates","arity":3}
            solution_sketch: 'The velocity is $\mathbf{v}(t) = \mathbf{r}''(t) = \langle 2t, 2, 3t^2 \rangle$. At $t = 2$ this is $\langle 4, 2, 12 \rangle$. So the velocity is $(4, 2, 12)$.'
          - problem: 'A particle has position $\mathbf{r}(t) = \langle e^t,\ t^2,\ \sin t \rangle$. Find its acceleration vector at $t = 0$.'
            answer: '(1, 2, 0)'
            answer_contract: {"kind":"coordinates","arity":3}
            solution_sketch: 'The velocity is $\mathbf{v}(t) = \langle e^t, 2t, \cos t \rangle$. The acceleration is $\mathbf{a}(t) = \mathbf{v}''(t) = \langle e^t, 2, -\sin t \rangle$. At $t = 0$ this is $(1, 2, 0)$.'
          - problem: 'For $\mathbf{r}(t) = \langle t^2,\ t^3,\ t \rangle$, find the speed at $t = 1$.'
            answer: 'sqrt(14)'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The velocity is $\mathbf{v}(t) = \langle 2t, 3t^2, 1 \rangle$, which is $\langle 2, 3, 1 \rangle$ at $t = 1$. The speed is $\sqrt{2^2 + 3^2 + 1^2} = \sqrt{14}$.'
          - problem: 'A particle has position $\mathbf{r}(t) = \langle t^3,\ 2t^2 - t,\ 4t \rangle$. Find its velocity vector $\mathbf{v}(t)$.'
            answer: '(3t^2, 4t - 1, 4)'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Differentiate each component of the position. The derivative of $t^3$ is $3t^2$, the derivative of $2t^2 - t$ is $4t - 1$, and the derivative of $4t$ is $4$. So $\mathbf{v}(t) = \langle 3t^2, 4t - 1, 4 \rangle$.'
          - problem: 'A drone flies so that its position after $t$ seconds is $\mathbf{r}(t) = \langle 4t,\ 3t,\ 20t - 5t^2 \rangle$ metres. How fast is it flying at $t = 1$?'
            answer: '5sqrt(5)'
            answer_contract: {"kind":"unit","quantity":"speed","unit":"m/s","allow_omitted":true}
            solution_sketch: 'The velocity is $\mathbf{v}(t) = \langle 4, 3, 20 - 10t \rangle$, which is $\langle 4, 3, 10 \rangle$ at $t = 1$. The speed is $\sqrt{16 + 9 + 100} = \sqrt{125} = 5\sqrt{5}$ metres per second.'
          - problem: 'A drone flies so that its position after $t$ seconds is $\mathbf{r}(t) = \langle t^2,\ 4t,\ 3t \rangle$ metres. How many times as fast is it flying at $t = 6$ as at $t = 0$?'
            answer: '13/5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The velocity is $\mathbf{v}(t) = \langle 2t, 4, 3 \rangle$. At $t = 0$ the speed is $\sqrt{0 + 16 + 9} = 5$, and at $t = 6$ it is $\sqrt{144 + 16 + 9} = 13$. The ratio is $13 \div 5 = 13/5$.'
          - problem: 'A ball has position $\mathbf{r}(t) = \langle 3t,\ 4t,\ 10t - t^2 \rangle$ metres. At $t = 2$, is the ball speeding up or slowing down?'
            answer: 'slowing down'
            answer_contract: {"kind":"label","options":[["slowing down","it is slowing down","slows down","slowing"],["speeding up","it is speeding up","speeds up","speeding"]]}
            solution_sketch: 'The velocity is $\langle 3, 4, 10 - 2t \rangle$ and the acceleration is $\langle 0, 0, -2 \rangle$. At $t = 2$ the velocity is $\langle 3, 4, 6 \rangle$, and $\mathbf{v} \cdot \mathbf{a} = -12$ is negative. The acceleration works against the motion, so the ball is slowing down.'
          - problem: 'A particle has position $\mathbf{r}(t) = \langle 5\cos t,\ 5\sin t,\ 12t \rangle$. Find its speed at any time $t$.'
            answer: '13'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The velocity is $\langle -5\sin t, 5\cos t, 12 \rangle$. Its length is $\sqrt{25\sin^2 t + 25\cos^2 t + 144} = \sqrt{25 + 144} = 13$. The speed is $13$ at every time.'
          - problem: 'Sam says the speed of $\mathbf{r}(t) = \langle 2t,\ t^2,\ t^3 \rangle$ at $t = 1$ is $|\mathbf{r}(1)| = \sqrt{6}$. What is the correct speed?'
            answer: 'sqrt(17)'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Sam found the distance from the origin, not the speed. The speed is the length of the velocity $\mathbf{v}(t) = \langle 2, 2t, 3t^2 \rangle$, which is $\langle 2, 2, 3 \rangle$ at $t = 1$. So the speed is $\sqrt{4 + 4 + 9} = \sqrt{17}$.'
          - problem: 'A particle has position $\mathbf{r}(t) = \langle \sin 3t,\ t^2,\ e^{2t} \rangle$. Find its velocity vector at $t = 0$.'
            answer: '(3, 0, 2)'
            answer_contract: {"kind":"coordinates","arity":3}
            solution_sketch: 'Differentiate each component of the position. The chain rule gives $\mathbf{v}(t) = \langle 3\cos 3t, 2t, 2e^{2t} \rangle$. At $t = 0$ this is $\langle 3, 0, 2 \rangle$. So the velocity is $(3, 0, 2)$.'
          - problem: 'A particle has position $\mathbf{r}(t) = \langle \cos 2t,\ \sin 2t,\ t \rangle$. Find its speed at $t = 0$.'
            answer: 'sqrt(5)'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The velocity is $\mathbf{v}(t) = \langle -2\sin 2t, 2\cos 2t, 1 \rangle$, which is $\langle 0, 2, 1 \rangle$ at $t = 0$. The speed is its length: $\sqrt{0 + 4 + 1} = \sqrt{5}$.'
        constraints: 'speeds at the requested instant are integers, rationals or single clean radicals; vector-form answers use one tuple of components'
      - id: kp2
        name: 'Recovering velocity and position'
        key_prerequisites: [vector-valued-functions, definite-integrals-ftc]
        exemplars:
          - problem: 'A particle has velocity $\mathbf{v}(t) = \langle 4t,\ 2t,\ 3 \rangle$ and initial position $\mathbf{r}(0) = \langle 2, 1, 0 \rangle$. Find its position $\mathbf{r}(t)$.'
            answer: '(2t^2 + 2, t^2 + 1, 3t)'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Antidifferentiate each component of the velocity: $\mathbf{r}(t) = \langle 2t^2 + C_1, t^2 + C_2, 3t + C_3 \rangle$. At $t = 0$ this equals $\langle C_1, C_2, C_3 \rangle = \langle 2, 1, 0 \rangle$. So $\mathbf{r}(t) = \langle 2t^2 + 2, t^2 + 1, 3t \rangle$.'
          - problem: 'A particle has acceleration $\mathbf{a}(t) = \langle 0,\ 4,\ 6t \rangle$, initial velocity $\mathbf{v}(0) = \langle 2, 1, 0 \rangle$ and initial position $\mathbf{r}(0) = \langle 0, 1, 0 \rangle$. Find its position $\mathbf{r}(t)$.'
            answer: '(2t, 2t^2 + t + 1, t^3)'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Integrate the acceleration: $\mathbf{v}(t) = \langle C_1, 4t + C_2, 3t^2 + C_3 \rangle$. The condition $\mathbf{v}(0)$ gives $\mathbf{v}(t) = \langle 2, 4t + 1, 3t^2 \rangle$. Integrate again and use $\mathbf{r}(0)$ to get $\mathbf{r}(t) = \langle 2t, 2t^2 + t + 1, t^3 \rangle$.'
          - problem: 'A particle has velocity $\mathbf{v}(t) = \langle 2t,\ 4t,\ 3t^2 \rangle$ and initial position $\mathbf{r}(0) = \langle 1, 2, 3 \rangle$. Where is the particle at $t = 2$?'
            answer: '(5, 10, 11)'
            answer_contract: {"kind":"coordinates","arity":3}
            solution_sketch: 'Antidifferentiate each component and fix the constants with $\mathbf{r}(0)$: $\mathbf{r}(t) = \langle t^2 + 1, 2t^2 + 2, t^3 + 3 \rangle$. At $t = 2$ this is $(4 + 1, 8 + 2, 8 + 3) = (5, 10, 11)$.'
          - problem: 'A particle has acceleration $\mathbf{a}(t) = \langle 4,\ 2t,\ 6t^2 \rangle$ and initial velocity $\mathbf{v}(0) = \langle 1, 0, 2 \rangle$. Find its velocity $\mathbf{v}(t)$.'
            answer: '(4t + 1, t^2, 2t^3 + 2)'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Antidifferentiate each component: $\mathbf{v}(t) = \langle 4t + C_1, t^2 + C_2, 2t^3 + C_3 \rangle$. At $t = 0$ this equals $\langle C_1, C_2, C_3 \rangle = \langle 1, 0, 2 \rangle$. So $\mathbf{v}(t) = \langle 4t + 1, t^2, 2t^3 + 2 \rangle$.'
          - problem: 'A rocket starts from rest at the origin. During its climb its acceleration is $\mathbf{a}(t) = \langle 0,\ 0,\ 6t \rangle$ metres per second squared, with the third component pointing up. How high is the rocket after $5$ seconds?'
            answer: '125'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'Integrate the vertical acceleration $6t$ to get the vertical velocity $3t^2$, because the rocket starts at rest. Integrate again to get the height $z(t) = t^3$. At $t = 5$ the height is $125$ metres.'
          - problem: 'A rocket starts from rest at the origin with acceleration $\mathbf{a}(t) = \langle 0,\ 0,\ 6t \rangle$ metres per second squared, the third component pointing up. After how many seconds is it $1000$ metres high?'
            answer: '10'
            answer_contract: {"kind":"unit","quantity":"time","unit":"s","allow_omitted":true}
            solution_sketch: 'The vertical velocity is $3t^2$ and the height is $z(t) = t^3$. Setting $t^3 = 1000$ gives $t = 10$. So the rocket is $1000$ metres high after $10$ seconds.'
          - problem: 'A drone starts at the origin with velocity $\mathbf{v}(t) = \langle t,\ 2t,\ 2t \rangle$ metres per second. How far is it from the origin after $4$ seconds?'
            answer: '24'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'Integrating each component gives $\mathbf{r}(t) = \langle t^2/2, t^2, t^2 \rangle$. At $t = 4$ this is $(8, 16, 16)$. The distance from the origin is $\sqrt{64 + 256 + 256} = \sqrt{576} = 24$ metres.'
          - problem: 'A particle has acceleration $\mathbf{a}(t) = \langle 0,\ 0,\ -10 \rangle$ metres per second squared, initial velocity $\mathbf{v}(0) = \langle 3, 4, 20 \rangle$ metres per second, and starts at the origin. How fast is it moving at $t = 2$?'
            answer: '5'
            answer_contract: {"kind":"unit","quantity":"speed","unit":"m/s","allow_omitted":true}
            solution_sketch: 'Integrate the acceleration and use $\mathbf{v}(0)$: $\mathbf{v}(t) = \langle 3, 4, 20 - 10t \rangle$. At $t = 2$ this is $\langle 3, 4, 0 \rangle$. The speed is $\sqrt{9 + 16 + 0} = 5$ metres per second.'
          - problem: 'Sam finds the position from $\mathbf{v}(t) = \langle 6t,\ 2,\ 0 \rangle$ and $\mathbf{r}(0) = \langle 1, 1, 1 \rangle$ as $\mathbf{r}(t) = \langle 3t^2, 2t, 0 \rangle$. What is the correct position?'
            answer: '(3t^2 + 1, 2t + 1, 1)'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Sam left out the constants. The antidifferentiation gives $\langle 3t^2 + C_1, 2t + C_2, C_3 \rangle$, and $\mathbf{r}(0) = \langle 1, 1, 1 \rangle$ gives $C_1 = C_2 = C_3 = 1$. So $\mathbf{r}(t) = \langle 3t^2 + 1, 2t + 1, 1 \rangle$.'
        constraints: 'polynomial accelerations and velocities; integer initial conditions so all constants are clean; vector-form answers are polynomial'
      - id: kp3
        name: 'Projectile motion'
        key_prerequisites: [vector-valued-functions, definite-integrals-ftc]
        try_first:
          problem: 'A stone is thrown straight up from the ground at $20$ m/s, so its height after $t$ seconds is $20t - 5t^2$ metres. After how many seconds is it back on the ground?'
          answer_contract: {"kind":"exact"}
          answer: '4'
          reveal: 'The height is $0$ again when $5t(4 - t) = 0$, so $t = 4$. A projectile uses the same vertical equation, while its horizontal speed stays constant.'
        exemplars:
          - problem: 'A projectile is fired from the origin with initial velocity $\langle 20, 0, 40 \rangle$ m/s. Its acceleration is $\langle 0, 0, -10 \rangle$ m/s$^2$. When does it return to $z = 0$?'
            answer: '8'
            answer_contract: {"kind":"unit","quantity":"time","unit":"s","allow_omitted":true}
            solution_sketch: 'Integrating twice gives the height $z(t) = 40t - 5t^2$. Setting $z(t) = 0$ gives $5t(8 - t) = 0$. The root $t = 0$ is the launch, so the projectile lands at $t = 8$ seconds.'
          - problem: 'A projectile is fired from the origin with initial velocity $\langle 30, 0, 30 \rangle$ m/s. Its acceleration is $\langle 0, 0, -10 \rangle$ m/s$^2$. Find its maximum height.'
            answer: '45'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'The height is $z(t) = 30t - 5t^2$. The maximum is where $z''(t) = 30 - 10t = 0$, so $t = 3$. Then $z(3) = 90 - 45 = 45$, so the maximum height is $45$ metres.'
          - problem: 'A projectile is fired from the origin with initial velocity $\langle 15, 0, 20 \rangle$ m/s. Its acceleration is $\langle 0, 0, -10 \rangle$ m/s$^2$. How far does it travel horizontally before it returns to $z = 0$?'
            answer: '60'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'The height is $z(t) = 20t - 5t^2 = 5t(4 - t)$, so the projectile lands at $t = 4$. The horizontal motion is $x(t) = 15t$. At $t = 4$ this gives $x = 60$ metres.'
          - problem: 'A cannonball is fired from the ground and lands $100$ metres away after $10$ seconds in the air. What is its horizontal speed?'
            answer: '10'
            answer_contract: {"kind":"unit","quantity":"speed","unit":"m/s","allow_omitted":true}
            solution_sketch: 'The horizontal speed is constant, so $x(t) = v_x t$. The cannonball lands at $x = 100$ when $t = 10$. So $v_x = 100 \div 10 = 10$ metres per second.'
          - problem: 'A projectile is fired from the origin with initial velocity $\langle 20, 0, v \rangle$ m/s. Its acceleration is $\langle 0, 0, -10 \rangle$ m/s$^2$, and its maximum height is $45$ metres. Find the initial vertical speed $v$.'
            answer: '30'
            answer_contract: {"kind":"unit","quantity":"speed","unit":"m/s","allow_omitted":true}
            solution_sketch: 'The height is $z(t) = vt - 5t^2$, with maximum at $t = v/10$. The maximum height is $v^2/20$. Setting $v^2/20 = 45$ gives $v^2 = 900$, so $v = 30$ metres per second.'
          - problem: 'A projectile is fired from the origin with initial velocity $\langle 35, 0, 20 \rangle$ m/s. Its acceleration is $\langle 0, 0, -10 \rangle$ m/s$^2$. How far does it travel horizontally before it returns to $z = 0$?'
            answer: '140'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'The height is $z(t) = 20t - 5t^2 = 5t(4 - t)$, so the projectile lands at $t = 4$. The horizontal motion is $x(t) = 35t$. At $t = 4$ this gives $x = 140$ metres.'
          - problem: 'A stone is thrown horizontally at $10$ m/s from the edge of a cliff that is $80$ metres high. Its height above the ground after $t$ seconds is $80 - 5t^2$ metres. How far from the foot of the cliff does the stone land?'
            answer: '40'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'The stone lands when $80 - 5t^2 = 0$, so $t^2 = 16$ and $t = 4$ seconds. The horizontal motion is $x(t) = 10t$. At $t = 4$ this gives $x = 40$ metres from the foot of the cliff.'
          - problem: 'A ball is kicked from the ground with horizontal speed $15$ m/s. It lands $90$ metres away. Its acceleration is $\langle 0, 0, -10 \rangle$ m/s$^2$. What was its initial vertical speed?'
            answer: '30'
            answer_contract: {"kind":"unit","quantity":"speed","unit":"m/s","allow_omitted":true}
            solution_sketch: 'The time in the air is the distance divided by the horizontal speed: $90 \div 15 = 6$ seconds. The height is $z(t) = vt - 5t^2$, which is $0$ again at $t = v/5$. So $v/5 = 6$ and $v = 30$ metres per second.'
          - problem: 'A projectile is fired from the origin with initial velocity $\langle 20, 0, 30 \rangle$ m/s. Its acceleration is $\langle 0, 0, -10 \rangle$ m/s$^2$. Sam says it lands at $t = 3$, where $z''(t) = 0$. When does it actually land?'
            answer: '6'
            answer_contract: {"kind":"unit","quantity":"time","unit":"s","allow_omitted":true}
            solution_sketch: 'At $t = 3$ the vertical velocity is $0$, which is the top of the flight, not the landing. The height is $z(t) = 30t - 5t^2 = 5t(6 - t)$. So the projectile lands at $t = 6$ seconds.'
          - problem: 'A projectile is fired from the origin with initial velocity $\langle 0, 0, 20 \rangle$ m/s. The wind gives it acceleration $\langle 2, 0, -10 \rangle$ m/s$^2$. How far from the origin horizontally does it land?'
            answer: '16'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'The height is $z(t) = 20t - 5t^2 = 5t(4 - t)$, so it lands at $t = 4$. The horizontal motion has constant acceleration $2$ from rest, so $x(t) = t^2$. At $t = 4$ this gives $x = 16$ metres.'
          - problem: 'A projectile is fired from the origin with initial velocity $\langle 20, 0, 30 \rangle$ m/s. Its acceleration is $\langle 0, 0, -10 \rangle$ m/s$^2$. How fast is it moving when it lands?'
            answer: '10sqrt(13)'
            answer_contract: {"kind":"unit","quantity":"speed","unit":"m/s","allow_omitted":true}
            solution_sketch: 'The projectile lands at $t = 6$. The velocity is $\langle 20, 0, 30 - 10t \rangle$, which is $\langle 20, 0, -30 \rangle$ at $t = 6$. The speed is $\sqrt{400 + 900} = \sqrt{1300} = 10\sqrt{13}$ metres per second.'
        constraints: 'use g = 10 m/s^2; launch speeds chosen so landing times and heights are integers; answers are measured quantities with unit'
    diagnostic_exemplar:
      problem: 'A projectile leaves the origin with initial velocity $\langle 20, 0, 30 \rangle$ m/s and has constant acceleration $\langle 0, 0, -10 \rangle$ m/s$^2$. How far does it travel horizontally before returning to $z = 0$?'
      answer: '$120$ m (it lands at $t = 6$ s).'
      answer_contract: {kind: none}
      solution_sketch: 'Integrating twice: $\mathbf{v}(t) = \langle 20, 0, 30 - 10t \rangle$, $\mathbf{r}(t) = \langle 20t, 0, 30t - 5t^2 \rangle$. Then $z = 0$ again at $t = 6$, where $x = 120$.'
    anki_seeds:
      - front: 'For position $\mathbf{r}(t)$: velocity, speed, and acceleration are...'
        back: '$\mathbf{v} = \mathbf{r}''$, speed $= |\mathbf{v}|$, $\mathbf{a} = \mathbf{r}''''$.'
        type: basic
      - front: 'To recover position from acceleration you integrate {{c1::twice}}, using {{c2::$\mathbf{v}(0)$ and $\mathbf{r}(0)$}} to fix the constants.'
        back: 'twice / the initial velocity and position'
        type: cloze

  - id: arc-length-space-curves
    name: "Arc Length of Space Curves"
    core: true
    difficulty: 0.68
    drill: false
    answer_kind: numeric
    expected_time_secs: 180
    prerequisites:
      - id: vector-valued-functions
        weight: 0.8
        key: true
      - id: definite-integrals-ftc
        weight: 0.6
        key: true
      - id: arc-length
        weight: 0.4
        key: false
      - id: integration-substitution
        weight: 0.4
        key: false
    knowledge_points:
      - id: kp1
        name: "Arc length via constant or simple speed"
        key_prerequisites: [vector-valued-functions, definite-integrals-ftc]
        try_first:
          problem: 'A particle moves with the constant velocity $\langle 3,4,12\rangle$, in metres per second, for 2 seconds. How far does it travel, in metres?'
          answer_contract: {"kind":"exact"}
          answer: '26'
          reveal: 'Distance is speed times time, and the speed is the length of the velocity vector, $\sqrt{9+16+144}=13$. Arc length for a curve with constant speed works the same way.'
        exemplars:
          - problem: 'Find the length of the helix $\mathbf{r}(t)=\langle \cos t,\sin t,t\rangle$ for $0\le t\le 2\pi$.'
            answer: '2pi*sqrt(2)'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Differentiate each component to get $\mathbf{r}''(t)=\langle -\sin t,\cos t,1\rangle$. Its length is $\sqrt{\sin^2 t+\cos^2 t+1}=\sqrt{2}$, which does not depend on $t$. So $L=\sqrt{2}\cdot 2\pi=2\pi\sqrt{2}$.'
          - problem: 'Find the length of $\mathbf{r}(t)=\langle 3t,4t,5\rangle$ for $0\le t\le 2$.'
            answer: '10'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Here $\mathbf{r}''(t)=\langle 3,4,0\rangle$, so the speed is $\sqrt{9+16}=5$ at every $t$. The length is the speed times the interval length, $5\cdot 2=10$.'
          - problem: 'A spring is wound in the shape of the helix $\mathbf{r}(t)=\langle 3\cos t,3\sin t,4t\rangle$, with lengths in centimetres. How much wire is needed for the part with $0\le t\le 4\pi$?'
            answer: '20pi'
            answer_contract: {"kind":"unit","quantity":"length","unit":"cm","allow_omitted":true}
            solution_sketch: 'The speed is $\sqrt{9\sin^2 t+9\cos^2 t+16}=\sqrt{25}=5$ centimetres per unit of $t$. The interval has length $4\pi$, so the wire has length $5\cdot 4\pi=20\pi$ centimetres.'
          - problem: 'A drone flies along $\mathbf{r}(t)=\langle 2t,-t,2t\rangle$, with distances in metres and $t$ in seconds. How long does it take to fly 36 metres along its path?'
            answer: '12'
            answer_contract: {"kind":"unit","quantity":"time","unit":"s","allow_omitted":true}
            solution_sketch: 'The velocity is $\langle 2,-1,2\rangle$, so the speed is $\sqrt{4+1+4}=3$ metres per second. The time is the distance divided by the speed, $36\div 3=12$ seconds. Multiplying would give a distance, not a time.'
          - problem: 'Find the length of $\mathbf{r}(t)=\langle t,2t,2t\rangle$ for $0\le t\le 5$.'
            answer: '15'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Here $\mathbf{r}''(t)=\langle 1,2,2\rangle$, so the speed is $\sqrt{1+4+4}=3$. The interval has length $5$, so $L=3\cdot 5=15$.'
          - problem: 'Sam finds the length of $\mathbf{r}(t)=\langle 3t,4t,12t\rangle$ for $0\le t\le 1$ as $3+4+12=19$. What is the correct length?'
            answer: '13'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The speed is the length of the velocity vector $\langle 3,4,12\rangle$, which is $\sqrt{9+16+144}=13$. Sam added the components instead of taking the square root of the sum of squares. So $L=13\cdot 1=13$.'
          - problem: 'Find the length of the helix $\mathbf{r}(t)=\langle 2\cos t,2\sin t,t\rangle$ for $0\le t\le 2\pi$.'
            answer: '2pi*sqrt(5)'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Here $\mathbf{r}''(t)=\langle -2\sin t,2\cos t,1\rangle$, so the speed is $\sqrt{4+1}=\sqrt{5}$ by $\sin^2 t+\cos^2 t=1$. The length is $\sqrt{5}\cdot 2\pi=2\pi\sqrt{5}$.'
          - problem: 'Find the length of the helix $\mathbf{r}(t)=\langle 3\cos t,3\sin t,4t\rangle$ for $0\le t\le \pi/2$.'
            answer: '5pi/2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Here $\mathbf{r}''(t)=\langle -3\sin t,3\cos t,4\rangle$, so the speed is $\sqrt{9+16}=5$. The interval has length $\pi/2$, so $L=5\cdot\pi/2=5\pi/2$.'
          - problem: 'Find the length of $\mathbf{r}(t)=\langle 2t,-t,2t\rangle$ for $1\le t\le 3$.'
            answer: '6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The velocity $\langle 2,-1,2\rangle$ has length $3$. The interval has length $3-1=2$, so $L=3\cdot 2=6$.'
          - problem: 'A hiker climbs a spiral path $\mathbf{r}(t)=\langle 12\cos t,12\sin t,5t\rangle$, with lengths in metres, from $t=0$ to $t=2\pi$. How far does the hiker walk along the path?'
            answer: '26pi'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'Here $\mathbf{r}''(t)=\langle -12\sin t,12\cos t,5\rangle$, so the speed is $\sqrt{144+25}=13$ metres per unit of $t$. One turn takes $2\pi$, so the hiker walks $13\cdot 2\pi=26\pi$ metres.'
        constraints: "speed is constant (helices, lines): |r'| a clean radical or integer"

      - id: kp2
        name: "Arc length with perfect-square speeds"
        key_prerequisites: [vector-valued-functions, definite-integrals-ftc]
        exemplars:
          - problem: 'Find the length of $\mathbf{r}(t)=\langle 2t,t^2,\ln t\rangle$ for $1\le t\le 2$.'
            answer: '3 + ln(2)'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Here $\mathbf{r}''(t)=\langle 2,2t,1/t\rangle$, so $|\mathbf{r}''|^2=4+4t^2+1/t^2=(2t+1/t)^2$. The speed is $2t+1/t$ for $t>0$. Then $L=\int_1^2(2t+1/t)\,dt=[t^2+\ln t]_1^2=3+\ln 2$.'
          - problem: 'A robot arm tip follows $\mathbf{r}(t)=\langle e^t\cos t,e^t\sin t,e^t\rangle$, with lengths in centimetres and $t$ in seconds. How far does the tip travel from $t=0$ to $t=1$?'
            answer: 'sqrt(3)(e - 1)'
            answer_contract: {"kind":"unit","quantity":"length","unit":"cm","allow_omitted":true}
            solution_sketch: 'Every component of $\mathbf{r}''(t)$ carries the factor $e^t$, and $|\mathbf{r}''|^2=e^{2t}[(\cos t-\sin t)^2+(\sin t+\cos t)^2+1]=3e^{2t}$. So the speed is $\sqrt{3}\,e^t$, and $L=\sqrt{3}\int_0^1 e^t\,dt=\sqrt{3}(e-1)$ centimetres.'
          - problem: 'Find the length of $\mathbf{r}(t)=\langle \tfrac23 t^3,t,t^2\rangle$ for $0\le t\le 1$.'
            answer: '5/3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Here $\mathbf{r}''(t)=\langle 2t^2,1,2t\rangle$, so $|\mathbf{r}''|^2=4t^4+4t^2+1=(2t^2+1)^2$. The speed is $2t^2+1$, so the integral is easy to evaluate. Then $L=\int_0^1(2t^2+1)\,dt=\tfrac23+1=\tfrac53$.'
          - problem: 'Find the length of $\mathbf{r}(t)=\langle 2e^t,e^t\sin t,e^t\cos t\rangle$ for $0\le t\le 1$.'
            answer: 'sqrt(6)(e - 1)'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Here $\mathbf{r}''(t)=\langle 2e^t,e^t(\sin t+\cos t),e^t(\cos t-\sin t)\rangle$. Its squared length is $e^{2t}[4+2]=6e^{2t}$, since the two trigonometric squares add to $2$. So $L=\sqrt{6}\int_0^1 e^t\,dt=\sqrt{6}(e-1)$.'
          - problem: 'A section of roller-coaster track follows $\mathbf{r}(t)=\langle 2t,t^2,\tfrac13 t^3\rangle$ for $0\le t\le 6$, with lengths in metres. How long is the section?'
            answer: '84'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'Here $\mathbf{r}''(t)=\langle 2,2t,t^2\rangle$, so $|\mathbf{r}''|^2=4+4t^2+t^4=(t^2+2)^2$. The speed is $t^2+2$, so the integral is easy to evaluate. Then $L=\int_0^6(t^2+2)\,dt=72+12=84$ metres.'
          - problem: 'A curve is given by $\mathbf{r}(t)=\langle t^3,3t^2,6t\rangle$ for $t\ge 0$. Its arc length from $t=0$ to $t=b$ is $20$. Find $b$.'
            answer: '2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Here $\mathbf{r}''(t)=\langle 3t^2,6t,6\rangle$, so $|\mathbf{r}''|^2=9(t^2+2)^2$ and the speed is $3t^2+6$. The length from $0$ to $b$ is $b^3+6b$. Setting $b^3+6b=20$ gives $b=2$, since $8+12=20$ and the left side increases with $b$.'
          - problem: 'Mia finds the length of $\mathbf{r}(t)=\langle 6t,9t^2,\ln t\rangle$ for $1\le t\le 2$ by taking the speed at $t=1$, which is $19$, and multiplying by the interval length $1$. She gets $19$. What is the correct length?'
            answer: '27 + ln(2)'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Here $\mathbf{r}''(t)=\langle 6,18t,1/t\rangle$, and $|\mathbf{r}''|^2=36+324t^2+1/t^2=(18t+1/t)^2$. The speed changes with $t$, so one speed cannot be multiplied by the interval length. The length is $\int_1^2(18t+1/t)\,dt=[9t^2+\ln t]_1^2=27+\ln 2$.'
          - problem: 'Find the length of $\mathbf{r}(t)=\langle e^{2t}\cos t,e^{2t}\sin t,e^{2t}\rangle$ for $0\le t\le 1$.'
            answer: '(3/2)(e^2 - 1)'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Here $\mathbf{r}''(t)=\langle e^{2t}(2\cos t-\sin t),e^{2t}(2\sin t+\cos t),2e^{2t}\rangle$. Its squared length is $e^{4t}[5+4]=9e^{4t}$, so the speed is $3e^{2t}$. Then $L=3\int_0^1 e^{2t}\,dt=\tfrac32(e^2-1)$.'
        constraints: "the squared speed must factor as a perfect square or a constant times e^{2t}; exact answers with ln and e"

      - id: kp3
        name: "Speed and arc length parametrization"
        key_prerequisites: [vector-valued-functions]
        exemplars:
          - problem: 'For the line $\mathbf{r}(t)=\langle 5t,12t,0\rangle$, find the arc length function $s(t)$ measured from $t=0$.'
            answer: '13t'
            answer_contract: {"kind":"function","vars":["t"]}
            solution_sketch: 'Here $\mathbf{r}''(t)=\langle 5,12,0\rangle$, so the speed is $\sqrt{25+144}=13$. The arc length function is $s(t)=\int_0^t 13\,du=13t$.'
          - problem: 'Reparametrize the helix $\mathbf{r}(t)=\langle 5\cos t,5\sin t,12t\rangle$ by arc length $s$ measured from $t=0$.'
            answer: 'x=5cos(s/13);y=5sin(s/13);z=12s/13'
            answer_contract: {"kind":"multipart","parts":[{"contract":{"kind":"function","vars":["s"]},"name":"x"},{"contract":{"kind":"function","vars":["s"]},"name":"y"},{"contract":{"kind":"function","vars":["s"]},"name":"z"}]}
            solution_sketch: 'The speed is $\sqrt{25\sin^2 t+25\cos^2 t+144}=13$, so $s=13t$ and $t=s/13$. Substituting $t=s/13$ into $\mathbf{r}(t)$ gives $\langle 5\cos(s/13),5\sin(s/13),12s/13\rangle$.'
          - problem: 'A car drives up a spiral ramp whose path is $\mathbf{r}(t)=\langle 8\cos t,8\sin t,15t\rangle$, with distances in metres and $t$ in seconds. How fast is the car moving?'
            answer: '17'
            answer_contract: {"kind":"unit","quantity":"speed","unit":"m/s","allow_omitted":true}
            solution_sketch: 'Here $\mathbf{r}''(t)=\langle -8\sin t,8\cos t,15\rangle$, so the speed is $\sqrt{64+225}=\sqrt{289}=17$ metres per second. The speed is the same at every time.'
          - problem: 'A drone flies along $\mathbf{r}(t)=\langle 7t,24t,0\rangle$, with distances in metres and $t$ in seconds. After how many seconds has it flown 75 metres from its starting point?'
            answer: '3'
            answer_contract: {"kind":"unit","quantity":"time","unit":"s","allow_omitted":true}
            solution_sketch: 'The velocity is $\langle 7,24,0\rangle$, so the speed is $\sqrt{49+576}=25$ metres per second. The distance flown is $s(t)=25t$. Setting $25t=75$ gives $t=3$ seconds.'
          - problem: 'Reparametrize the line $\mathbf{r}(t)=\langle 2t+1,-t+3,2t-4\rangle$ by arc length measured from $t=0$.'
            answer: '(1 + 2s/3, 3 - s/3, -4 + 2s/3)'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Here $\mathbf{r}''(t)=\langle 2,-1,2\rangle$, so the speed is $3$ and $s=3t$, which gives $t=s/3$. Substituting into $\mathbf{r}(t)$ gives $\langle 1+2s/3,\,3-s/3,\,-4+2s/3\rangle$.'
          - problem: 'Find the arc length of the helix $\mathbf{r}(t)=\langle 20\cos t,20\sin t,21t\rangle$ from $t=0$ to $t=2$.'
            answer: '58'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Here $\mathbf{r}''(t)=\langle -20\sin t,20\cos t,21\rangle$, so the speed is $\sqrt{400+441}=29$. The arc length function is $s(t)=29t$, so the length from $t=0$ to $t=2$ is $29\cdot 2=58$.'
          - problem: 'A bug crawls along the helix $\mathbf{r}(t)=\langle 3\cos t,3\sin t,4t\rangle$, with distances in centimetres and $t$ in seconds. How many seconds does it need to crawl 40 centimetres?'
            answer: '8'
            answer_contract: {"kind":"unit","quantity":"time","unit":"s","allow_omitted":true}
            solution_sketch: 'The speed is $\sqrt{9+16}=5$ centimetres per second. The time is the distance divided by the speed, $40\div 5=8$ seconds.'
          - problem: 'For $\mathbf{r}(t)=\langle e^t\cos t,e^t\sin t,e^t\rangle$, find the arc length function $s(t)$ measured from $t=0$.'
            answer: 'sqrt(3)(e^t - 1)'
            answer_contract: {"kind":"function","vars":["t"]}
            solution_sketch: 'Here $|\mathbf{r}''(u)|=\sqrt{3}\,e^u$, because every component of the derivative carries the factor $e^u$. Then $s(t)=\int_0^t\sqrt{3}\,e^u\,du=\sqrt{3}(e^t-1)$.'
        constraints: "constant-speed curves so s(t) is linear in t; one curve with speed sqrt(3)e^t for s(t)"
    diagnostic_exemplar:
      problem: 'Find the length of $\mathbf{r}(t) = \left\langle \tfrac{1}{3}t^3,\; t^2,\; 2t \right\rangle$ for $0 \le t \le 3$.'
      answer: '15'
      solution_sketch: '$\mathbf{r}''(t) = \langle t^2, 2t, 2 \rangle$ and $|\mathbf{r}''|^2 = t^4 + 4t^2 + 4 = (t^2 + 2)^2$, so the speed is $t^2 + 2$. Then $L = \int_0^3 (t^2 + 2)\,dt = 9 + 6 = 15$.'
    anki_seeds:
      - front: 'Arc length of $\mathbf{r}(t)$ for $a \le t \le b$?'
        back: '$L = \int_a^b |\mathbf{r}''(t)|\, dt$'
        type: basic
      - front: 'The speed of a particle with position $\mathbf{r}(t)$ is...'
        back: '$|\mathbf{r}''(t)|$, the magnitude of the velocity vector; also $ds/dt$.'
        type: basic

  - id: unit-tangent-normal-vectors
    name: "Unit Tangent and Normal Vectors"
    core: false                # feeds only curvature; terminal branch
    difficulty: 0.70
    drill: false
    answer_kind: numeric
    expected_time_secs: 150
    prerequisites:
      - id: vector-valued-functions
        weight: 0.7
        key: true
      - id: arc-length-space-curves
        weight: 0.4
        key: false
      - id: derivatives-trig
        weight: 0.4
        key: false
    knowledge_points:
      - id: kp1
        name: "The unit tangent vector"
        key_prerequisites: [vector-valued-functions]
        try_first:
          problem: 'At one instant the velocity of a particle is $\langle 2,3,6\rangle$, in metres per second. What is its speed, in metres per second?'
          answer_contract: {"kind":"exact"}
          answer: '7'
          reveal: 'The speed is the length of the velocity vector, $\sqrt{4+9+36}=7$. Dividing the velocity by this number gives a vector of length $1$ in the direction of motion, the unit tangent vector.'
        exemplars:
          - problem: 'Find the unit tangent vector $\mathbf{T}(t)$ of the curve $\mathbf{r}(t)=\langle 12\cos t,12\sin t,5t\rangle$.'
            answer: 'x=-12sin(t)/13;y=12cos(t)/13;z=5/13'
            answer_contract: {"kind":"multipart","parts":[{"contract":{"kind":"function","vars":["t"]},"name":"x"},{"contract":{"kind":"function","vars":["t"]},"name":"y"},{"contract":{"kind":"function","vars":["t"]},"name":"z"}]}
            solution_sketch: 'Differentiate to get $\mathbf{r}''(t)=\langle -12\sin t,12\cos t,5\rangle$. The speed is $\sqrt{144\sin^2 t+144\cos^2 t+25}=13$. Dividing each component by $13$ gives $\mathbf{T}(t)$.'
          - problem: 'Find the unit tangent vector $\mathbf{T}(t)$ of the line $\mathbf{r}(t)=\langle t,4t,8t\rangle$.'
            answer: '(1/9, 4/9, 8/9)'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Here $\mathbf{r}''(t)=\langle 1,4,8\rangle$, and its length is $\sqrt{1+16+64}=9$. Dividing by $9$ gives $\mathbf{T}(t)=\langle 1/9,4/9,8/9\rangle$, which has length $1$.'
          - problem: 'Find the unit tangent vector $\mathbf{T}(t)$ of the circle $\mathbf{r}(t)=\langle 4\cos t,0,4\sin t\rangle$.'
            answer: 'x=-sin(t);y=0;z=cos(t)'
            answer_contract: {"kind":"multipart","parts":[{"contract":{"kind":"function","vars":["t"]},"name":"x"},{"contract":{"kind":"function","vars":["t"]},"name":"y"},{"contract":{"kind":"function","vars":["t"]},"name":"z"}]}
            solution_sketch: 'Here $\mathbf{r}''(t)=\langle -4\sin t,0,4\cos t\rangle$. The speed is $\sqrt{16\sin^2 t+0+16\cos^2 t}=4$. Dividing by $4$ gives $\mathbf{T}(t)=\langle -\sin t,0,\cos t\rangle$.'
          - problem: 'A bead slides along a wire shaped like $\mathbf{r}(t)=\langle 5t,12\sin t,12\cos t\rangle$. Find the unit vector in the direction of its motion at time $t$.'
            answer: 'x=5/13;y=12cos(t)/13;z=-12sin(t)/13'
            answer_contract: {"kind":"multipart","parts":[{"contract":{"kind":"function","vars":["t"]},"name":"x"},{"contract":{"kind":"function","vars":["t"]},"name":"y"},{"contract":{"kind":"function","vars":["t"]},"name":"z"}]}
            solution_sketch: 'The direction of motion is given by the unit tangent. Here $\mathbf{r}''(t)=\langle 5,12\cos t,-12\sin t\rangle$ and the speed is $\sqrt{25+144}=13$. Dividing by $13$ gives $\langle 5/13,12\cos t/13,-12\sin t/13\rangle$.'
          - problem: 'Lee says the unit tangent vector of the line $\mathbf{r}(t)=\langle 2t,3t,6t\rangle$ is $\langle 2,3,6\rangle/11$, dividing by the sum of the components. What is the correct unit tangent vector?'
            answer: '(2/7, 3/7, 6/7)'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The velocity is $\langle 2,3,6\rangle$. Its length is $\sqrt{4+9+36}=7$, not the sum $11$ of its components. So $\mathbf{T}=\langle 2/7,3/7,6/7\rangle$.'
          - problem: 'Find the unit tangent vector $\mathbf{T}(t)$ of the curve $\mathbf{r}(t)=\langle 4t,3\cos t,3\sin t\rangle$.'
            answer: 'x=4/5;y=-3sin(t)/5;z=3cos(t)/5'
            answer_contract: {"kind":"multipart","parts":[{"contract":{"kind":"function","vars":["t"]},"name":"x"},{"contract":{"kind":"function","vars":["t"]},"name":"y"},{"contract":{"kind":"function","vars":["t"]},"name":"z"}]}
            solution_sketch: 'Here $\mathbf{r}''(t)=\langle 4,-3\sin t,3\cos t\rangle$. The speed is $\sqrt{16+9}=5$. Dividing by $5$ gives $\langle 4/5,-3\sin t/5,3\cos t/5\rangle$.'
          - problem: 'A drone flies along $\mathbf{r}(t)=\langle 5\cos t,12t,5\sin t\rangle$. Find the unit vector that gives its direction of flight at time $t$.'
            answer: 'x=-5sin(t)/13;y=12/13;z=5cos(t)/13'
            answer_contract: {"kind":"multipart","parts":[{"contract":{"kind":"function","vars":["t"]},"name":"x"},{"contract":{"kind":"function","vars":["t"]},"name":"y"},{"contract":{"kind":"function","vars":["t"]},"name":"z"}]}
            solution_sketch: 'The direction of flight is the unit tangent. Here $\mathbf{r}''(t)=\langle -5\sin t,12,5\cos t\rangle$ with speed $\sqrt{25+144}=13$. So the direction is $\langle -5\sin t/13,12/13,5\cos t/13\rangle$.'
          - problem: 'Find the unit tangent vector $\mathbf{T}(t)$ of the curve $\mathbf{r}(t)=\langle 2t,t^2,\tfrac13 t^3\rangle$.'
            answer: '(2/(t^2+2), 2t/(t^2+2), t^2/(t^2+2))'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Here $\mathbf{r}''(t)=\langle 2,2t,t^2\rangle$ and $|\mathbf{r}''|^2=4+4t^2+t^4=(t^2+2)^2$. The speed is $t^2+2$, which is never zero. So $\mathbf{T}(t)=\langle 2,2t,t^2\rangle/(t^2+2)$.'
          - problem: 'Is $\langle 2/3,2/3,1/3\rangle$ the unit tangent vector of the line $\mathbf{r}(t)=\langle 2t,t,2t\rangle$?'
            answer: 'no'
            answer_contract: {"kind":"label","options":[["yes","it is","it is the unit tangent vector","it is the unit tangent"],["no","it is not","it is not the unit tangent vector","it is not the unit tangent","not","it isnt"]]}
            solution_sketch: 'The velocity is $\langle 2,1,2\rangle$ with length $3$, so the unit tangent vector is $\langle 2/3,1/3,2/3\rangle$. The vector $\langle 2/3,2/3,1/3\rangle$ has length $1$ but points in a different direction. So the answer is no.'
          - problem: 'Find the unit tangent vector $\mathbf{T}(t)$ of the curve $\mathbf{r}(t)=\langle 2\cos t,2\sin t,3t\rangle$.'
            answer: 'x=-2sin(t)/sqrt(13);y=2cos(t)/sqrt(13);z=3/sqrt(13)'
            answer_contract: {"kind":"multipart","parts":[{"contract":{"kind":"function","vars":["t"]},"name":"x"},{"contract":{"kind":"function","vars":["t"]},"name":"y"},{"contract":{"kind":"function","vars":["t"]},"name":"z"}]}
            solution_sketch: 'Here $\mathbf{r}''(t)=\langle -2\sin t,2\cos t,3\rangle$, so the speed is $\sqrt{4\sin^2 t+4\cos^2 t+9}=\sqrt{13}$. Dividing each component by $\sqrt{13}$ gives $\mathbf{T}(t)=\langle -2\sin t,2\cos t,3\rangle/\sqrt{13}$. The speed is not a whole number, so the factor $1/\sqrt{13}$ stays in every component.'
        constraints: "speeds are constants or clean radicals so T has an exact closed form; one curve with polynomial speed"

      - id: kp2
        name: "The principal unit normal vector"
        key_prerequisites: [vector-valued-functions, derivatives-trig]
        exemplars:
          - problem: 'Find the principal unit normal vector $\mathbf{N}(t)$ of the circle $\mathbf{r}(t)=\langle 2\cos t,2\sin t,0\rangle$.'
            answer: 'x=-cos(t);y=-sin(t);z=0'
            answer_contract: {"kind":"multipart","parts":[{"contract":{"kind":"function","vars":["t"]},"name":"x"},{"contract":{"kind":"function","vars":["t"]},"name":"y"},{"contract":{"kind":"function","vars":["t"]},"name":"z"}]}
            solution_sketch: 'Here $\mathbf{r}''(t)=\langle -2\sin t,2\cos t,0\rangle$ has constant length $2$, so $\mathbf{T}=\langle -\sin t,\cos t,0\rangle$. Then $\mathbf{T}''=\langle -\cos t,-\sin t,0\rangle$ has length $1$, so $\mathbf{N}=\mathbf{T}''$. This vector points from the curve toward the centre, with $z$-component $0$.'
          - problem: 'Find the principal unit normal vector $\mathbf{N}(t)$ of the helix $\mathbf{r}(t)=\langle t,\cos t,\sin t\rangle$.'
            answer: 'x=0;y=-cos(t);z=-sin(t)'
            answer_contract: {"kind":"multipart","parts":[{"contract":{"kind":"function","vars":["t"]},"name":"x"},{"contract":{"kind":"function","vars":["t"]},"name":"y"},{"contract":{"kind":"function","vars":["t"]},"name":"z"}]}
            solution_sketch: 'Here $\mathbf{r}''(t)=\langle 1,-\sin t,\cos t\rangle$ has length $\sqrt{2}$, so $\mathbf{T}=\langle 1,-\sin t,\cos t\rangle/\sqrt{2}$. Then $\mathbf{T}''=\langle 0,-\cos t,-\sin t\rangle/\sqrt{2}$ has length $1/\sqrt{2}$. Dividing by that length gives $\mathbf{N}=\langle 0,-\cos t,-\sin t\rangle$.'
          - problem: 'Find the principal unit normal vector $\mathbf{N}(t)$ of the circle $\mathbf{r}(t)=\langle \cos t,0,\sin t\rangle$.'
            answer: 'x=-cos(t);y=0;z=-sin(t)'
            answer_contract: {"kind":"multipart","parts":[{"contract":{"kind":"function","vars":["t"]},"name":"x"},{"contract":{"kind":"function","vars":["t"]},"name":"y"},{"contract":{"kind":"function","vars":["t"]},"name":"z"}]}
            solution_sketch: 'Here $\mathbf{r}''(t)=\langle -\sin t,0,\cos t\rangle$ has length $1$, so $\mathbf{T}=\mathbf{r}''$. Then $\mathbf{T}''=\langle -\cos t,0,-\sin t\rangle$ also has length $1$. So $\mathbf{N}=\langle -\cos t,0,-\sin t\rangle$.'
          - problem: 'A car drives round a circular track $\mathbf{r}(t)=\langle 100\cos(t/10),100\sin(t/10),0\rangle$, with distances in metres. Find the principal unit normal vector $\mathbf{N}(t)$ of its path.'
            answer: 'x=-cos(t/10);y=-sin(t/10);z=0'
            answer_contract: {"kind":"multipart","parts":[{"contract":{"kind":"function","vars":["t"]},"name":"x"},{"contract":{"kind":"function","vars":["t"]},"name":"y"},{"contract":{"kind":"function","vars":["t"]},"name":"z"}]}
            solution_sketch: 'Here $\mathbf{r}''(t)=\langle -10\sin(t/10),10\cos(t/10),0\rangle$ has constant length $10$, so $\mathbf{T}=\langle -\sin(t/10),\cos(t/10),0\rangle$. Then $\mathbf{T}''=\langle -\cos(t/10),-\sin(t/10),0\rangle/10$ has length $1/10$. Dividing by it gives $\mathbf{N}=\langle -\cos(t/10),-\sin(t/10),0\rangle$.'
          - problem: 'Find the principal unit normal vector $\mathbf{N}(t)$ of the circle $\mathbf{r}(t)=\langle \cos t,-\sin t,0\rangle$.'
            answer: 'x=-cos(t);y=sin(t);z=0'
            answer_contract: {"kind":"multipart","parts":[{"contract":{"kind":"function","vars":["t"]},"name":"x"},{"contract":{"kind":"function","vars":["t"]},"name":"y"},{"contract":{"kind":"function","vars":["t"]},"name":"z"}]}
            solution_sketch: 'Here $\mathbf{r}''(t)=\langle -\sin t,-\cos t,0\rangle$ has length $1$, so $\mathbf{T}=\mathbf{r}''$. Then $\mathbf{T}''=\langle -\cos t,\sin t,0\rangle$ has length $1$. So $\mathbf{N}=\langle -\cos t,\sin t,0\rangle$, and the circle is traced clockwise.'
          - problem: 'Find the principal unit normal vector $\mathbf{N}(t)$ of the circle $\mathbf{r}(t)=\langle \sin t,\cos t,0\rangle$.'
            answer: 'x=-sin(t);y=-cos(t);z=0'
            answer_contract: {"kind":"multipart","parts":[{"contract":{"kind":"function","vars":["t"]},"name":"x"},{"contract":{"kind":"function","vars":["t"]},"name":"y"},{"contract":{"kind":"function","vars":["t"]},"name":"z"}]}
            solution_sketch: 'Here $\mathbf{r}''(t)=\langle \cos t,-\sin t,0\rangle$ has length $1$, so $\mathbf{T}=\mathbf{r}''$. Then $\mathbf{T}''=\langle -\sin t,-\cos t,0\rangle$ has length $1$. So $\mathbf{N}=\langle -\sin t,-\cos t,0\rangle$.'
          - problem: 'A roller-coaster rider follows the helix $\mathbf{r}(t)=\langle 6\cos t,6\sin t,2t\rangle$, with distances in metres. Find the principal unit normal vector $\mathbf{N}(t)$ of the path.'
            answer: 'x=-cos(t);y=-sin(t);z=0'
            answer_contract: {"kind":"multipart","parts":[{"contract":{"kind":"function","vars":["t"]},"name":"x"},{"contract":{"kind":"function","vars":["t"]},"name":"y"},{"contract":{"kind":"function","vars":["t"]},"name":"z"}]}
            solution_sketch: 'Here $\mathbf{r}''(t)=\langle -6\sin t,6\cos t,2\rangle$ has constant length $\sqrt{40}$, so $\mathbf{T}''=\langle -6\cos t,-6\sin t,0\rangle/\sqrt{40}$. Its length is $6/\sqrt{40}$. Dividing by it gives $\mathbf{N}=\langle -\cos t,-\sin t,0\rangle$, which is horizontal.'
          - problem: 'For the helix $\mathbf{r}(t)=\langle 3\cos t,3\sin t,t\rangle$, does the principal unit normal vector point toward the $z$-axis or away from it?'
            answer: 'toward'
            answer_contract: {"kind":"label","options":[["toward","toward the z-axis","towards the z-axis","toward the axis","towards the axis","towards","toward the z axis","towards the z axis"],["away","away from the z-axis","away from the axis","away from the z axis","away from"]]}
            solution_sketch: 'Here $\mathbf{T}''$ is a positive multiple of $\langle -\cos t,-\sin t,0\rangle$, so $\mathbf{N}=\langle -\cos t,-\sin t,0\rangle$. This is minus the horizontal part $\langle\cos t,\sin t,0\rangle$ of the position, so it points toward the $z$-axis.'
          - problem: 'Find the principal unit normal vector $\mathbf{N}(t)$ of the circle $\mathbf{r}(t)=\langle \cos(t/2),\sin(t/2),0\rangle$.'
            answer: 'x=-cos(t/2);y=-sin(t/2);z=0'
            answer_contract: {"kind":"multipart","parts":[{"contract":{"kind":"function","vars":["t"]},"name":"x"},{"contract":{"kind":"function","vars":["t"]},"name":"y"},{"contract":{"kind":"function","vars":["t"]},"name":"z"}]}
            solution_sketch: 'Here $\mathbf{r}''(t)=\langle -\tfrac12\sin(t/2),\tfrac12\cos(t/2),0\rangle$ has length $\tfrac12$, so $\mathbf{T}=\langle -\sin(t/2),\cos(t/2),0\rangle$. Then $\mathbf{T}''$ has length $\tfrac12$ and points along $\langle -\cos(t/2),-\sin(t/2),0\rangle$. So $\mathbf{N}=\langle -\cos(t/2),-\sin(t/2),0\rangle$.'
        constraints: "circles and helices (constant speed) so |T'| is constant and N is exact"

      - id: kp3
        name: "Evaluating T, N, and the binormal at a point"
        key_prerequisites: [vector-valued-functions]
        exemplars:
          - problem: 'For the curve $\mathbf{r}(t)=\langle 3\cos t,3\sin t,4t\rangle$, find the unit tangent vector $\mathbf{T}$ at $t=\pi/2$.'
            answer: '(-3/5, 0, 4/5)'
            answer_contract: {"kind":"coordinates","arity":3}
            solution_sketch: 'Here $\mathbf{r}''(t)=\langle -3\sin t,3\cos t,4\rangle$ and the speed is $5$, so $\mathbf{T}(t)=\langle -3\sin t,3\cos t,4\rangle/5$. At $t=\pi/2$ we have $\sin t=1$ and $\cos t=0$. So $\mathbf{T}(\pi/2)=(-3/5,0,4/5)$.'
          - problem: 'For the curve $\mathbf{r}(t)=\langle 5\cos t,5\sin t,12t\rangle$, find the binormal vector $\mathbf{B}$ at $t=0$.'
            answer: '(0, -12/13, 5/13)'
            answer_contract: {"kind":"coordinates","arity":3}
            solution_sketch: 'The speed is $13$, so $\mathbf{T}=\langle -5\sin t,5\cos t,12\rangle/13$, and $\mathbf{N}=\langle -\cos t,-\sin t,0\rangle$. Then $\mathbf{B}=\mathbf{T}\times\mathbf{N}=\langle 12\sin t,-12\cos t,5\rangle/13$. At $t=0$ this is $(0,-12/13,5/13)$.'
          - problem: 'For the curve $\mathbf{r}(t)=\langle 3\cos t,3\sin t,4t\rangle$, find the principal unit normal vector $\mathbf{N}$ at $t=0$.'
            answer: '(-1, 0, 0)'
            answer_contract: {"kind":"coordinates","arity":3}
            solution_sketch: 'The unit tangent is $\mathbf{T}=\langle -3\sin t,3\cos t,4\rangle/5$. Differentiating and dividing by the length gives $\mathbf{N}(t)=\langle -\cos t,-\sin t,0\rangle$. At $t=0$ we have $\cos t=1$ and $\sin t=0$, so $\mathbf{N}(0)=(-1,0,0)$.'
          - problem: 'For the curve $\mathbf{r}(t)=\langle t,\cos t,\sin t\rangle$, find the unit tangent vector $\mathbf{T}$ at $t=0$.'
            answer: '(1/sqrt(2), 0, 1/sqrt(2))'
            answer_contract: {"kind":"coordinates","arity":3}
            solution_sketch: 'Here $\mathbf{r}''(t)=\langle 1,-\sin t,\cos t\rangle$ has length $\sqrt{2}$, so $\mathbf{T}(t)=\langle 1,-\sin t,\cos t\rangle/\sqrt{2}$. At $t=0$ we have $\sin t=0$ and $\cos t=1$. So $\mathbf{T}(0)=(1/\sqrt{2},0,1/\sqrt{2})$.'
          - problem: 'For the curve $\mathbf{r}(t)=\langle \cos t,\sin t,t\rangle$, find the principal unit normal vector $\mathbf{N}$ at $t=\pi/2$.'
            answer: '(0, -1, 0)'
            answer_contract: {"kind":"coordinates","arity":3}
            solution_sketch: 'The speed is $\sqrt{2}$, so $\mathbf{T}=\langle -\sin t,\cos t,1\rangle/\sqrt{2}$. Differentiating and dividing by the length gives $\mathbf{N}(t)=\langle -\cos t,-\sin t,0\rangle$. At $t=\pi/2$ we have $\cos t=0$ and $\sin t=1$, so $\mathbf{N}(\pi/2)=(0,-1,0)$.'
          - problem: 'A bead slides along the helical wire $\mathbf{r}(t)=\langle \cos t,\sin t,t\rangle$. What is the unit vector in the direction of its motion at $t=\pi/2$?'
            answer: '(-1/sqrt(2), 0, 1/sqrt(2))'
            answer_contract: {"kind":"coordinates","arity":3}
            solution_sketch: 'The direction of motion is the unit tangent, $\mathbf{T}(t)=\langle -\sin t,\cos t,1\rangle/\sqrt{2}$. At $t=\pi/2$ we have $\sin t=1$ and $\cos t=0$. So the direction is $(-1/\sqrt{2},0,1/\sqrt{2})$.'
          - problem: 'For the curve $\mathbf{r}(t)=\langle t,\cos t,\sin t\rangle$, find the principal unit normal vector $\mathbf{N}$ at $t=\pi/2$.'
            answer: '(0, 0, -1)'
            answer_contract: {"kind":"coordinates","arity":3}
            solution_sketch: 'The unit tangent is $\mathbf{T}=\langle 1,-\sin t,\cos t\rangle/\sqrt{2}$, and dividing $\mathbf{T}''$ by its length gives $\mathbf{N}(t)=\langle 0,-\cos t,-\sin t\rangle$. At $t=\pi/2$ we have $\cos t=0$ and $\sin t=1$. So $\mathbf{N}(\pi/2)=(0,0,-1)$.'
          - problem: 'For the curve $\mathbf{r}(t)=\langle \cos t,\sin t,t\rangle$, find the binormal vector $\mathbf{B}$ at $t=\pi/2$.'
            answer: '(1/sqrt(2), 0, 1/sqrt(2))'
            answer_contract: {"kind":"coordinates","arity":3}
            solution_sketch: 'At $t=\pi/2$ the unit tangent is $\mathbf{T}=(-1,0,1)/\sqrt{2}$ and the unit normal is $\mathbf{N}=(0,-1,0)$. Their cross product is $\mathbf{B}=\mathbf{T}\times\mathbf{N}=(1,0,1)/\sqrt{2}$. The vector has length $1$ and is perpendicular to both $\mathbf{T}$ and $\mathbf{N}$.'
          - problem: 'A drone flies along $\mathbf{r}(t)=\langle 3\cos t,3\sin t,4t\rangle$. At $t=\pi$, what is the unit vector that points in the direction its path is bending?'
            answer: '(1, 0, 0)'
            answer_contract: {"kind":"coordinates","arity":3}
            solution_sketch: 'The path bends toward the principal unit normal $\mathbf{N}(t)=\langle -\cos t,-\sin t,0\rangle$. At $t=\pi$ we have $\cos t=-1$ and $\sin t=0$. So $\mathbf{N}(\pi)=(1,0,0)$.'
        constraints: "evaluate at multiples of pi/2 so sines and cosines are 0 or +-1"
    diagnostic_exemplar:
      problem: 'For $\mathbf{r}(t) = \langle \cos t, \sin t, t \rangle$, find $\mathbf{T}(0)$ and $\mathbf{N}(0)$.'
      answer: '$\mathbf{T}(0) = \frac{1}{\sqrt{2}}\langle 0, 1, 1 \rangle$, $\;\mathbf{N}(0) = \langle -1, 0, 0 \rangle$'
      answer_contract: {kind: none}
      solution_sketch: '$\mathbf{r}''(t) = \langle -\sin t, \cos t, 1\rangle$ has constant length $\sqrt{2}$, so $\mathbf{T} = \frac{1}{\sqrt{2}}\langle -\sin t, \cos t, 1\rangle$; then $\mathbf{T}''$ has length $\frac{1}{\sqrt{2}}$ and $\mathbf{N} = \mathbf{T}''/|\mathbf{T}''| = \langle -\cos t, -\sin t, 0\rangle$. Evaluate both at $t = 0$.'
    anki_seeds:
      - front: 'Formula for the unit tangent vector $\mathbf{T}(t)$?'
        back: '$\mathbf{T}(t) = \mathbf{r}''(t) / |\mathbf{r}''(t)|$'
        type: basic
      - front: 'Formula for the principal unit normal $\mathbf{N}(t)$?'
        back: '$\mathbf{N}(t) = \mathbf{T}''(t) / |\mathbf{T}''(t)|$'
        type: basic
      - front: 'The binormal vector is $\mathbf{B} = $ {{c1::$\mathbf{T} \times \mathbf{N}$}}.'
        back: '$\mathbf{T} \times \mathbf{N}$'
        type: cloze

  - id: curvature
    name: "Curvature"
    core: false                # terminal geometric quantity; nothing here uses it
    difficulty: 0.74
    drill: false
    answer_kind: numeric
    expected_time_secs: 180
    prerequisites:
      - id: unit-tangent-normal-vectors
        weight: 0.7
        key: true
      - id: cross-product
        weight: 0.5
        key: true
      - id: arc-length-space-curves
        weight: 0.4
        key: false
    knowledge_points:
      - id: kp1
        name: "Curvature from the unit tangent"
        key_prerequisites: [unit-tangent-normal-vectors, arc-length-space-curves]
        try_first:
          problem: 'A car drives once round a circular track of radius 3 km, so its direction of travel turns through $2\pi$ radians over a distance of $6\pi$ km. By how many radians does its direction turn per kilometre?'
          answer_contract: {"kind":"exact"}
          answer: '1/3'
          reveal: 'Turning per unit of distance is $2\pi/6\pi=1/3$. This turning per unit length is the curvature, and a circle of radius $3$ has curvature $1/3$.'
        exemplars:
          - problem: 'Use $\kappa=|\mathbf{T}''(t)|/|\mathbf{r}''(t)|$ to find the curvature of the circle $\mathbf{r}(t)=\langle 2\cos t,2\sin t,0\rangle$.'
            answer: '1/2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Here $|\mathbf{r}''|=2$ and $\mathbf{T}''=\langle -\cos t,-\sin t,0\rangle$ has length $1$, so $\kappa=1/2$. This agrees with $\kappa=1/a$ for a circle of radius $a$.'
          - problem: 'Use $\kappa=|\mathbf{T}''(t)|/|\mathbf{r}''(t)|$ to find the curvature of the helix $\mathbf{r}(t)=\langle 2\cos t,2\sin t,2t\rangle$.'
            answer: '1/4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Here $\mathbf{r}''=\langle -2\sin t,2\cos t,2\rangle$ has length $2\sqrt{2}$, and $\mathbf{T}''=\langle -\cos t,-\sin t,0\rangle/\sqrt{2}$ has length $1/\sqrt{2}$. So $\kappa=(1/\sqrt{2})/(2\sqrt{2})=1/4$.'
          - problem: 'A particle climbs the helix $\mathbf{r}(t)=\langle\cos t,\sin t,2t\rangle$. What is the curvature of its path?'
            answer: '1/5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Here $\mathbf{r}''=\langle -\sin t,\cos t,2\rangle$ has length $\sqrt{5}$, and $\mathbf{T}''=\langle -\cos t,-\sin t,0\rangle/\sqrt{5}$ has length $1/\sqrt{5}$. So $\kappa=(1/\sqrt{5})/\sqrt{5}=1/5$.'
          - problem: 'A bead runs clockwise around the circle $\mathbf{r}(t)=\langle 6\sin t,6\cos t,0\rangle$. What is the curvature of its path?'
            answer: '1/6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Here $\mathbf{r}''=\langle 6\cos t,-6\sin t,0\rangle$ has length $6$, so $\mathbf{T}=\langle\cos t,-\sin t,0\rangle$ and $\mathbf{T}''$ has length $1$. So $\kappa=1/6$. Reversing the direction does not change the curvature.'
          - problem: 'A circular rail is described by $\mathbf{r}(t)=\langle a\cos t,a\sin t,0\rangle$, with $a$ in metres, and its curvature is $1/5$ at every point. What is the radius of the rail?'
            answer: '5'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'The speed is $a$ and $|\mathbf{T}''|=1$, so $\kappa=1/a$. Setting $1/a=1/5$ gives $a=5$. The radius is $5$ metres.'
          - problem: 'For which $b>0$ does the helix $\mathbf{r}(t)=\langle\cos t,\sin t,bt\rangle$ have curvature $1/5$?'
            answer: '2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The speed is $\sqrt{1+b^2}$ and $|\mathbf{T}''|=1/\sqrt{1+b^2}$, so $\kappa=1/(1+b^2)$. Setting $1/(1+b^2)=1/5$ gives $b^2=4$. Since $b>0$, we get $b=2$.'
          - problem: 'Find the curvature of the helix $\mathbf{r}(t)=\langle\cos t,\sin t,t\rangle$.'
            answer: '1/2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'For this helix the velocity has length $|\mathbf{r}''|=\sqrt{2}$. The unit tangent changes at the rate $|\mathbf{T}''|=1/\sqrt{2}$, so $\kappa=(1/\sqrt{2})/\sqrt{2}=1/2$.'
          - problem: 'A spring has the shape $\mathbf{r}(t)=\langle 3\cos t,3\sin t,4t\rangle$. What is its curvature?'
            answer: '3/25'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Here $|\mathbf{r}''|=5$ and $\mathbf{T}''=\langle -3\cos t,-3\sin t,0\rangle/5$ has length $3/5$. So $\kappa=(3/5)/5=3/25$.'
        constraints: "constant-speed curves (circles, helices) so kappa is a constant rational"

      - id: kp2
        name: "The cross-product formula"
        key_prerequisites: [unit-tangent-normal-vectors, cross-product]
        exemplars:
          - problem: 'Use $\kappa=\dfrac{|\mathbf{r}''\times\mathbf{r}''''|}{|\mathbf{r}''|^3}$ to find the curvature of the twisted cubic $\mathbf{r}(t)=\langle t,t^2,t^3\rangle$ at $t=0$.'
            answer: '2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'At $t=0$ we have $\mathbf{r}''=\langle 1,0,0\rangle$ and $\mathbf{r}''''=\langle 0,2,0\rangle$. Their cross product is $\langle 0,0,2\rangle$, which has length $2$, so $\kappa=2/1^3=2$.'
          - problem: 'Find the curvature of $\mathbf{r}(t)=\langle 3t,t^2,t^3\rangle$ at $t=0$.'
            answer: '2/9'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Here $\mathbf{r}''=\langle 3,2t,3t^2\rangle$ and $\mathbf{r}''''=\langle 0,2,6t\rangle$. At $t=0$ the cross product $\langle 3,0,0\rangle\times\langle 0,2,0\rangle=\langle 0,0,6\rangle$ has length $6$, and $|\mathbf{r}''|^3=27$. So $\kappa=6/27=2/9$.'
          - problem: 'Find the curvature of the plane curve $y=x^2$ at the point $(1,1)$.'
            answer: '2sqrt(5)/25'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'For a graph $y=f(x)$ the curvature is $\kappa=|y''''|/(1+y''^2)^{3/2}$. Here $y''=2x$ and $y''''=2$, so at $x=1$ we get $\kappa=2/5^{3/2}=2/(5\sqrt{5})=2\sqrt{5}/25$.'
          - problem: 'Find the curvature of $\mathbf{r}(t)=\langle t,3t^2,t^3\rangle$ at $t=0$.'
            answer: '6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Here $\mathbf{r}''=\langle 1,6t,3t^2\rangle$ and $\mathbf{r}''''=\langle 0,6,6t\rangle$. At $t=0$ the cross product $\langle 1,0,0\rangle\times\langle 0,6,0\rangle=\langle 0,0,6\rangle$ has length $6$, and $|\mathbf{r}''|^3=1$. So $\kappa=6$.'
          - problem: 'Find the curvature of the helix $\mathbf{r}(t)=\langle 2\cos t,2\sin t,t\rangle$ at $t=0$.'
            answer: '2/5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'At $t=0$ we have $\mathbf{r}''=\langle 0,2,1\rangle$ and $\mathbf{r}''''=\langle -2,0,0\rangle$. Their cross product is $\langle 0,-2,4\rangle$ with length $\sqrt{20}=2\sqrt{5}$, and $|\mathbf{r}''|^3=5\sqrt{5}$. So $\kappa=2\sqrt{5}/(5\sqrt{5})=2/5$.'
          - problem: 'A road follows the curve $y=x^3$. Find the curvature of the road at the point $(1,1)$.'
            answer: '3sqrt(10)/50'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'For $y=x^3$ we have $y''=3x^2$ and $y''''=6x$, so at $x=1$ we get $y''=3$ and $y''''=6$. Then $\kappa=6/(1+9)^{3/2}=6/(10\sqrt{10})=3\sqrt{10}/50$.'
          - problem: 'Dan finds the curvature of $\mathbf{r}(t)=\langle 2t,3t^2,t^3\rangle$ at $t=0$ as $|\mathbf{r}''\times\mathbf{r}''''|/|\mathbf{r}''|^2=3$. What is the correct curvature?'
            answer: '3/2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'At $t=0$ we have $\mathbf{r}''=\langle 2,0,0\rangle$ and $\mathbf{r}''''=\langle 0,6,0\rangle$, so the cross product has length $12$. The formula divides by $|\mathbf{r}''|^3=8$, not by $|\mathbf{r}''|^2=4$. So $\kappa=12/8=3/2$.'
          - problem: 'A wave-shaped track follows $y=\sin x$. Find the curvature of the track at the crest $x=\pi/2$.'
            answer: '1'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'For $y=\sin x$ we have $y''=\cos x$ and $y''''=-\sin x$. At $x=\pi/2$ this gives $y''=0$ and $y''''=-1$, so $\kappa=|-1|/(1+0)^{3/2}=1$.'
          - problem: 'Find the curvature $\kappa(t)$ of the spiral $\mathbf{r}(t)=\langle e^t\cos t,e^t\sin t,0\rangle$ as a function of $t$.'
            answer: '1/(sqrt(2)e^t)'
            answer_contract: {"kind":"function","vars":["t"]}
            solution_sketch: 'Here $\mathbf{r}''=e^t\langle\cos t-\sin t,\sin t+\cos t,0\rangle$ and $\mathbf{r}''''=e^t\langle -2\sin t,2\cos t,0\rangle$. The cross product has length $2e^{2t}$ and $|\mathbf{r}''|^3=2\sqrt{2}\,e^{3t}$. So $\kappa(t)=2e^{2t}/(2\sqrt{2}\,e^{3t})=1/(\sqrt{2}\,e^t)$.'
        constraints: "evaluate at a specific t so cross products have small integer components; plane curves use the |y''| formula"

      - id: kp3
        name: "Interpreting curvature"
        key_prerequisites: [unit-tangent-normal-vectors]
        exemplars:
          - problem: 'A flat curve in a road is an arc of a circle of radius 250 metres. What is the curvature of the road along the arc?'
            answer: '1/250'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'A circle of radius $R$ has curvature $\kappa=1/R$. With $R=250$ the curvature is $1/250$ per metre. A larger radius gives a gentler bend.'
          - problem: 'A particle moves along the straight line $y=3x-2$ in the $xy$-plane. What is the curvature of its path?'
            answer: '0'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The path is a straight line, so its unit tangent vector is constant. A constant vector has derivative $0$, so $|\mathbf{T}''|=0$ and the curvature is $0$.'
          - problem: 'For the parabola $y=x^2$, find the point where the curvature is largest.'
            answer: '(0, 0)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'For $y=x^2$ the curvature is $\kappa(x)=2/(1+4x^2)^{3/2}$. The denominator is smallest at $x=0$, so the curvature is largest there, and $y=0$. The point is $(0,0)$.'
          - problem: 'What is the radius of curvature of the parabola $y=x^2$ at the point where its curvature is largest?'
            answer: '1/2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'At the vertex $(0,0)$ the curvature of $y=x^2$ is $\kappa=2$. The radius of curvature is $1/\kappa$, so it is $1/2$.'
          - problem: 'For the parabola $y=x^2$, find the maximum value of the curvature.'
            answer: '2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The curvature is $\kappa(x)=2/(1+4x^2)^{3/2}$. The denominator is at least $1$, so the maximum occurs at $x=0$, where $\kappa(0)=2$.'
          - problem: 'As the radius of a circle grows, does its curvature increase or decrease?'
            answer: 'decreases'
            answer_contract: {"kind":"label","options":[["increases","it increases","increase","gets larger","it gets larger","increasing","larger","goes up"],["decreases","it decreases","decrease","gets smaller","it gets smaller","decreasing","smaller","goes down"]]}
            solution_sketch: 'A circle of radius $R$ has curvature $1/R$. As $R$ grows, $1/R$ gets smaller, so the curvature decreases. A big circle is nearly straight.'
          - problem: 'At one point of a highway ramp the curvature is $0.04$ per metre. What is the radius of curvature of the ramp there?'
            answer: '25'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'The radius of curvature is the reciprocal of the curvature, so $R=1/0.04=25$. The radius of curvature is $25$ metres. Multiplying by $0.04$ would give the wrong answer.'
          - problem: 'Which bends more sharply, a circle of radius 3 or a circle of radius 5?'
            answer: 'radius 3'
            answer_contract: {"kind":"label","options":[["radius 3","the circle of radius 3","3","the smaller one","circle of radius 3","the smaller","smaller","the circle with radius 3"],["radius 5","the circle of radius 5","5","the larger one","circle of radius 5","the larger","larger","the circle with radius 5"]]}
            solution_sketch: 'The curvatures are $1/3$ and $1/5$. Since $1/3>1/5$, the circle of radius $3$ bends more sharply.'
          - problem: 'What is the radius of curvature of the parabola $y=x^2/8$ at its vertex $(0,0)$?'
            answer: '4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'For $y=x^2/8$ we have $y''=0$ and $y''''=1/4$ at the vertex, so $\kappa=1/4$. The radius of curvature is $1/\kappa=4$.'
          - problem: 'Find the curvature $\kappa(x)$ of the parabola $y=x^2$ as a function of $x$.'
            answer: '2/(1+4x^2)^(3/2)'
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'For $y=x^2$ we have $y''=2x$ and $y''''=2$. Then $\kappa(x)=|y''''|/(1+y''^2)^{3/2}=2/(1+4x^2)^{3/2}$. This is the function whose largest value $2$ occurs at $x=0$.'
        constraints: "conceptual: lines, circles, and locating maximum curvature of a parabola"
    diagnostic_exemplar:
      problem: 'Find the curvature of $\mathbf{r}(t) = \langle 2t,\; t^2,\; t^3 \rangle$ at $t = 0$, and state the radius of curvature there.'
      answer: '$\kappa = \frac{1}{2}$; radius of curvature $2$.'
      answer_contract: {kind: none}
      solution_sketch: '$\mathbf{r}''(0) = \langle 2, 0, 0 \rangle$ and $\mathbf{r}''''(0) = \langle 0, 2, 0 \rangle$, so $\mathbf{r}'' \times \mathbf{r}'''' = \langle 0, 0, 4 \rangle$ and $\kappa = \frac{4}{2^3} = \frac{1}{2}$; the radius of curvature is $1/\kappa = 2$.'
