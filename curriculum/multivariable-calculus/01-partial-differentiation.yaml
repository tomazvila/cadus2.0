unit: partial-differentiation
course: multivariable-calculus
module: "Partial Differentiation"
topics:
  - id: evaluating-multivariable-functions
    name: "Evaluating Multivariable Functions and Domains"
    core: true
    difficulty: 0.55
    drill: false
    answer_kind: numeric
    expected_time_secs: 90
    prerequisites:
      - id: domain-range
        weight: 0.6
        key: true
      - id: evaluating-functions
        weight: 0.4
        key: false
      - id: logarithm-basics
        weight: 0.3
        key: false
    knowledge_points:
      - id: kp1
        name: "Evaluation"
        key_prerequisites: [evaluating-functions]
        exemplars:
          - problem: 'Let $g(x, y) = \dfrac{xy}{x^2 + y^2}$. Compute $g(1, 2)$.'
            answer: '$\frac{2}{5}$'
          - problem: 'Let $f(x, y) = x^2 y - 3y$. Compute $f(2, -1)$.'
            answer: '$-1$'
            solution_sketch: '$4 \cdot (-1) - 3(-1) = -4 + 3 = -1$.'
          - problem: 'Let $f(x, y, z) = xyz + z^2$. Compute $f(2, 3, 1)$.'
            answer: "7"
          - problem: "Let f(x, y) = (x + 2y)/(x - y). Compute f(3, 1)."
            answer: "5/2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Substitute the inputs into the formula: f(3, 1) = (3 + 2*1)/(3 - 1). Simplify the numerator and the denominator by arithmetic: 5/2. The answer is 5/2."
          - problem: "Let h(x, y, z) = x^2 + yz - z. Compute h(2, 1, 3)."
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Substitute the inputs into the formula: h(2, 1, 3) = 2^2 + 1*3 - 3. Simplify each term by arithmetic: 4 + 3 - 3 = 4. The answer is 4."
          - problem: "A flat plate has temperature T(x, y) = (2x - y)/(x + y) at the point (x, y). Compute T(3, 2)."
            answer: "4/5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Substitute the point into the temperature formula: T(3, 2) = (2*3 - 2)/(3 + 2). Simplify the numerator and the denominator by arithmetic: 4/5. The answer is 4/5."
        constraints: "small integer inputs; rational outputs with single-digit numerators and denominators"
      - id: kp2
        name: "Domains"
        key_prerequisites: [domain-range, logarithm-basics]
        exemplars:
          - problem: "Let $f(x, y) = \\sqrt{16 - x^2 - y^2}$. Find the radius of the domain of $f$."
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (square-root rule): the radicand must be nonnegative, so $16 - x^2 - y^2 \\ge 0$. Step 2 (disk rule): this inequality is $x^2 + y^2 \\le 16$, which describes a closed disk of radius $\\sqrt{16}$. The answer is 4."
          - problem: "Let $f(x, y) = \\ln(2x + y - 5)$. Find the smallest integer $k$ such that the point $(k, 0)$ lies in the domain of $f$."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (log rule): the argument of the logarithm must be positive, so $2x + y - 5 > 0$. Step 2 (substitute the point): at $(k, 0)$ the condition is $2k - 5 > 0$, that is $k > 2.5$. Step 3 (integer choice): the smallest integer strictly greater than $2.5$ is $3$. The answer is 3."
          - problem: "Let $f(x, y) = \\dfrac{x + y}{x - 2y}$. Find the slope of the line excluded from the domain of $f$."
            answer: "1/2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (denominator rule): $x - 2y$ cannot be zero, so the domain excludes the line $x - 2y = 0$. Step 2 (line rule): solving $x - 2y = 0$ for $y$ gives $y = \\frac{x}{2}$, a line through the origin of slope $\\frac{1}{2}$. The answer is 1/2."
          - problem: "Let $f(x, y) = \\sqrt{36 - (x - 1)^2 - y^2}$. Find the radius of the domain of $f$."
            answer: "6"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (square-root rule): the radicand must be nonnegative, so $36 - (x - 1)^2 - y^2 \\ge 0$. Step 2 (disk rule): this is $(x - 1)^2 + y^2 \\le 36$, a disk centered at $(1, 0)$ with radius $\\sqrt{36}$. The answer is 6."
          - problem: "Let $f(x, y) = \\ln(3x + 2y - 6)$. The boundary of the domain is a line. Find the x-intercept of this line."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (log rule): the argument must be positive, so $3x + 2y - 6 > 0$. Step 2 (line rule): the boundary line is $3x + 2y = 6$. Step 3 (intercept): setting $y = 0$ gives $3x = 6$, so the intercept is $x = 2$. The answer is 2."
          - problem: "Let $f(x, y) = \\dfrac{x + y}{2x - 5y}$. The domain is the plane with one line removed. Find the slope of that line."
            answer: "2/5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (denominator rule): $2x - 5y$ cannot be zero, so the domain is the plane minus the line $2x - 5y = 0$. Step 2 (line rule): solving $2x - 5y = 0$ for $y$ gives $y = \\frac{2x}{5}$, so the slope of the removed line is $\\frac{2}{5}$. The answer is 2/5."
        constraints: "domains defined by one square root, log, or nonzero denominator; regions are disks, half-planes, or the plane minus a line"
      - id: kp3
        name: "Ranges of simple functions"
        key_prerequisites: [domain-range]
        exemplars:
          - problem: 'Find the range of $f(x, y) = \sqrt{9 - x^2 - y^2}$.'
            answer: '$[0, 3]$'
            solution_sketch: 'The radicand runs from $0$ (on the boundary circle) to $9$ (at the origin).'
          - problem: "Let f(x, y) = x^2 + y^2. Give the range of f as an inequality in z."
            answer: "z >= 0"
            answer_contract: {"kind": "inequality_union"}
            solution_sketch: "The function is f(x, y) = x^2 + y^2. Step 1 (square bounds): x^2 is at least 0 and y^2 is at least 0, so x^2 + y^2 is at least 0. Step 2 (attainment): the value z = 0 occurs at (0, 0), so every value z >= 0 is possible. The range is z >= 0."
          - problem: "Let f(x, y) = sqrt(16 - x^2 - y^2). Give the range of f as an inequality in z."
            answer: "0 <= z <= 4"
            answer_contract: {"kind": "inequality_union"}
            solution_sketch: "The function is f(x, y) = sqrt(16 - x^2 - y^2). Step 1 (radicand bounds): the expression 16 - x^2 - y^2 runs from 0 on the circle x^2 + y^2 = 16 up to 16 at the origin. Step 2 (square root): taking sqrt gives z from 0 to 4, so the range is 0 <= z <= 4."
          - problem: "Let f(x, y) = x^2 + y^2 + 2. Give the range of f as an inequality in z."
            answer: "z >= 2"
            answer_contract: {"kind": "inequality_union"}
            solution_sketch: "The function is f(x, y) = x^2 + y^2 + 2. Step 1 (square bounds): x^2 + y^2 is at least 0. Step 2 (add the constant): adding 2 gives z at least 2, and z = 2 occurs at (0, 0). The range is z >= 2."
          - problem: "Let f(x, y) = sqrt(36 - x^2 - y^2). Give the range of f as an inequality in z."
            answer: "0 <= z <= 6"
            answer_contract: {"kind": "inequality_union"}
            solution_sketch: "The function is f(x, y) = sqrt(36 - x^2 - y^2). Step 1 (radicand bounds): 36 - x^2 - y^2 runs from 0 on x^2 + y^2 = 36 to 36 at the origin. Step 2 (square root): sqrt of the radicand runs from 0 to 6, so the range is 0 <= z <= 6."
          - problem: "Let f(x, y) = x^2 + y^2 - 3. Give the range of f as an inequality in z."
            answer: "z >= -3"
            answer_contract: {"kind": "inequality_union"}
            solution_sketch: "The function is f(x, y) = x^2 + y^2 - 3. Step 1 (square bounds): x^2 + y^2 is at least 0. Step 2 (subtract the constant): subtracting 3 gives z at least -3, and z = -3 occurs at (0, 0). The range is z >= -3."
        constraints: "ranges of sums of squares or a root of one; closed-form interval answers"
    diagnostic_exemplar:
      problem: 'Let $f(x, y) = \sqrt{25 - x^2 - y^2}$. Compute $f(3, 0)$ and state the domain and the range of $f$.'
      answer: '$f(3, 0) = 4$; domain the closed disk $x^2 + y^2 \le 25$; range $[0, 5]$.'
      answer_contract: {kind: none}
      solution_sketch: '$f(3,0) = \sqrt{25 - 9} = 4$. The radicand must be non-negative, giving the disk of radius $5$; on it $25 - x^2 - y^2$ runs over $[0, 25]$, so $f$ runs over $[0, 5]$.'
    anki_seeds:
      - front: 'The domain of a function $f(x, y)$ is a subset of...'
        back: 'the plane $\mathbb{R}^2$ (the set of input points where the formula is defined).'
        type: basic
      - front: 'Domain of $f(x,y) = \ln g(x,y)$?'
        back: 'The region where $g(x, y) > 0$.'
        type: basic

  - id: functions-several-variables
    name: "Level Curves and Contour Maps"
    core: true
    difficulty: 0.62
    drill: false
    answer_kind: numeric
    expected_time_secs: 120
    prerequisites:
      - id: evaluating-multivariable-functions
        weight: 0.7
        key: true
      - id: coordinates-surfaces-3d
        weight: 0.5
        key: true
    knowledge_points:
      - id: kp1
        name: "Level curves"
        key_prerequisites: [evaluating-multivariable-functions]
        exemplars:
          - problem: "For $f(x, y) = x^2 + y^2$, find the value of $k$ for the level curve that passes through $(3, 4)$."
            answer: "25"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Use the level curve condition f = k. Evaluate f(3, 4) = 3^2 + 4^2 = 25. The level curve x^2 + y^2 = 25 has k = 25. The value of k is 25."
          - problem: 'Find an equation of the level curve of $f(x, y) = y - x^2$ passing through $(1, 3)$.'
            answer: '$y = x^2 + 2$'
            solution_sketch: '$f(1, 3) = 3 - 1 = 2$, so the level curve is $y - x^2 = 2$.'
          - problem: "For $f(x, y) = xy$, consider the level set $f(x, y) = 6$. What type of curve is this level set?"
            answer: "hyperbola"
            answer_contract: {"kind": "label", "options": [["hyperbola"], ["circle"], ["line"], ["parabola"]]}
            solution_sketch: "Use the level set condition f = k: xy = 6. A circle would need both variables squared with the same sign, not a product. A line would be a first-degree equation such as x + y = c, not xy = c. A parabola would have one squared variable, not a product equal to a constant. The product xy = 6 is a hyperbola, so the answer is hyperbola."
          - problem: "For $f(x, y) = 2x + 3y$, find the value of $k$ for the level curve that passes through $(1, 2)$."
            answer: "8"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Use the level curve condition f = k. Evaluate f(1, 2) = 2(1) + 3(2) = 8. The level curve 2x + 3y = 8 has k = 8. The value of k is 8."
          - problem: "For $f(x, y) = x^2 + y^2$, the level curve $f(x, y) = k$ is a circle of radius 7. Find $k$."
            answer: "49"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Use the level curve condition f = k. A circle of radius 7 has equation x^2 + y^2 = 49. So k = 49. The value of k is 49."
          - problem: "For $f(x, y) = x^2 + y$, find an equation of the level curve passing through $(2, 3)$ in the form $y = \\ldots$."
            answer: "7-x^2"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "Use the level curve condition f = k. Evaluate f(2, 3) = 2^2 + 3 = 7, so the level curve is x^2 + y = 7. Solve for y: y = 7 - x^2. The right side is 7-x^2."
        constraints: "level sets are circles, lines, parabolas, or hyperbolas; k values keep radii and intercepts exact"
      - id: kp2
        name: "Reading contour maps"
        key_prerequisites: [evaluating-multivariable-functions, coordinates-surfaces-3d]
        exemplars:
          - problem: "For $f(x, y) = x^2 + y^2$, the contours $k = 1, 4, 9$ are circles of radii $1, 2, 3$. Find the increase in the level value when the radius moves from $2$ to $3$."
            answer: "5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Read the contour levels at the two radii: radius 2 lies on k = 4, radius 3 lies on k = 9. Subtract the levels: 9 - 4 = 5. The increase in the level value is 5."
          - problem: "The level curves of a function $f(x, y)$ are evenly spaced parallel lines. Moving $4$ units perpendicular to the lines changes $f$ by $16$. Find the constant rate of change of $f$ per unit distance in that direction."
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Evenly spaced parallel level curves mean a constant rate of change. Rate equals change in f divided by distance moved: 16 / 4 = 4. The constant rate of change is 4."
          - problem: "On a contour map, two adjacent level curves labeled $30$ and $50$ are $2$ units apart. Compute the average rate of change of $f$ per unit distance perpendicular to the curves."
            answer: "10"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The level change is 50 - 30 = 20. The distance is 2 units. Rate equals level change divided by distance: 20 / 2 = 10. The average rate of change is 10."
          - problem: "A function $f(x, y)$ has straight parallel level curves. Along the $x$-axis, $f$ increases by $6$ per unit $x$. Along the $y$-axis, $f$ does not change. Find $f(3, 2) - f(0, 0)$."
            answer: "18"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Parallel level curves mean the rate is constant in each axis direction. Moving 3 units in x adds 6 * 3 = 18. Moving 2 units in y adds 0. The total change is 18, so f(3, 2) - f(0, 0) = 18."
          - problem: "On a contour map, level curves $k = 0$ and $k = 10$ are $5$ units apart, while $k = 10$ and $k = 20$ are $2$ units apart. Find the average rate of change of $f$ per unit distance in the interval where the contour lines are closer together."
            answer: "5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Closer contour lines mean a steeper change. The closer interval is between k = 10 and k = 20, with level change 10 and distance 2. Rate equals 10 / 2 = 5. The average rate of change is 5."
          - problem: "The level curves of $f$ are evenly spaced parallel lines. Moving $10$ units perpendicular to the lines changes $f$ by $25$. Determine the shape of the graph and the rate of change per unit distance. Give the rate as a fraction."
            answer: "shape = flat; rate = 5/2"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["flat"], ["curved"]]}, "name": "shape"}, {"contract": {"kind": "exact"}, "name": "rate"}]}
            solution_sketch: "Evenly spaced parallel level curves mean the graph is flat, a plane. The rate is change in f divided by distance: 25 / 10 = 5/2. The option curved is wrong because a plane has straight parallel level curves, not a curved surface. Thus shape = flat; rate = 5/2."
        constraints: "qualitative reading of contour maps: spacing vs steepness, parallel lines vs planes"
      - id: kp3
        name: "Graphs of two-variable functions"
        key_prerequisites: [coordinates-surfaces-3d]
        exemplars:
          - problem: "A two-variable function has graph z = f(x, y) = sqrt(36 - x^2 - y^2). Squaring both sides of z = sqrt(36 - x^2 - y^2) and using the quadric catalog, select the surface that is the graph."
            answer: "upper hemisphere"
            answer_contract: {"kind": "label", "options": [["upper hemisphere"], ["lower hemisphere"], ["elliptic paraboloid"], ["tilted plane"]]}
            solution_sketch: "Start with the full object z = sqrt(36 - x^2 - y^2). Squaring gives x^2 + y^2 + z^2 = 36 with z >= 0, which by the sphere entry of the quadric catalog is the upper half of a sphere. A lower hemisphere would need z <= 0, which a square root cannot give; an elliptic paraboloid would have z to the first power with squared x and y terms; a tilted plane would be linear in x and y. The answer is upper hemisphere."
          - problem: "A two-variable function has graph z = f(x, y) = 10 - x - 2y. Moving all variables of z = 10 - x - 2y to one side and using the quadric catalog, select the surface that is the graph."
            answer: "tilted plane"
            answer_contract: {"kind": "label", "options": [["upper hemisphere"], ["lower hemisphere"], ["elliptic paraboloid"], ["tilted plane"]]}
            solution_sketch: "Start with the full object z = 10 - x - 2y. Rearranging gives x + 2y + z = 10, a linear equation, so by the plane entry of the quadric catalog the graph is a tilted plane. An upper hemisphere or a lower hemisphere would come from a square root of a difference of squares; an elliptic paraboloid would have quadratic terms in x or y. The answer is tilted plane."
          - problem: "The graph of f(x, y) = x^2 + y^2 + 1 is an elliptic paraboloid that opens upward. Find its vertex. Give the answer as (x, y, z)."
            answer: "(0, 0, 1)"
            answer_contract: {"arity": 3, "kind": "coordinates"}
            solution_sketch: "The graph satisfies z = x^2 + y^2 + 1, so rewrite it as z - 1 = x^2 + y^2. By the shifted-paraboloid form of the quadric catalog, the vertex lies where the squared terms vanish: x = 0 and y = 0. Substituting gives z = 1, so the vertex is the point (0, 0, 1)."
          - problem: "The graph of f(x, y) = sqrt(25 - x^2 - y^2) is an upper hemisphere of a sphere. Find the radius of that sphere."
            answer: "5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Write z = sqrt(25 - x^2 - y^2). Squaring gives the sphere equation x^2 + y^2 + z^2 = 25 with z >= 0. The radius is the square root of the constant term, sqrt(25) = 5."
          - problem: "The graph of f(x, y) = 9 - x^2 - y^2 is an elliptic paraboloid that opens downward. Find the z-coordinate of its vertex."
            answer: "9"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The graph satisfies z = 9 - x^2 - y^2. Rewrite it as z - 9 = -(x^2 + y^2), so the vertex sits above x = 0, y = 0. Substituting gives z = 9, so the z-coordinate is 9."
          - problem: "The graph of f(x, y) = x^2 + y^2 is an elliptic paraboloid. Its level curve at height z = 4 is a circle centered at the origin. Find the radius of this level curve."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "On the level curve at height 4, set f(x, y) = 4. This gives x^2 + y^2 = 4, a circle of the paraboloid's horizontal cross-section. The radius is sqrt(4) = 2."
        constraints: "graphs are planes, paraboloids, or hemispheres recognizable from the quadric catalog"
    diagnostic_exemplar:
      problem: 'Identify the graph of $f(x, y) = \sqrt{16 - x^2 - y^2}$ and describe its level curves.'
      answer: 'The graph is the upper hemisphere of the sphere $x^2 + y^2 + z^2 = 16$ (radius $4$). The level curves $f = k$ are the concentric circles $x^2 + y^2 = 16 - k^2$ of radius $\sqrt{16 - k^2}$, for $0 \le k \le 4$; equally spaced levels crowd together near the rim $x^2 + y^2 = 16$, where the hemisphere is steepest, and spread out near the top $k = 4$, where it flattens.'
      answer_contract: {kind: none}
      solution_sketch: 'Squaring $z = \sqrt{16 - x^2 - y^2}$ with $z \ge 0$ gives $x^2 + y^2 + z^2 = 16$, $z \ge 0$. Setting $f = k$ gives $x^2 + y^2 = 16 - k^2$.'
    anki_seeds:
      - front: 'What is a level curve of $f(x, y)$?'
        back: 'The set of points where $f(x, y) = k$ for a fixed constant $k$; the contour at height $k$.'
        type: basic
      - front: 'The level curves of $f(x,y) = x^2 + y^2$ are {{c1::concentric circles centered at the origin}}.'
        back: 'concentric circles centered at the origin'
        type: cloze

  - id: level-surfaces
    name: "Functions of Three Variables and Level Surfaces"
    core: false                # descriptive leaf topic
    difficulty: 0.65
    drill: false
    answer_kind: numeric
    expected_time_secs: 120
    prerequisites:
      - id: functions-several-variables
        weight: 0.7
        key: true
      - id: coordinates-surfaces-3d
        weight: 0.6
        key: true
    knowledge_points:
      - id: kp1
        name: "Level surfaces of f(x, y, z)"
        key_prerequisites: [functions-several-variables]
        exemplars:
          - problem: "Let f(x, y, z) = x^2 + y^2 + z^2. The level surface f(x, y, z) = k passes through the point (1, 2, 2). Find k."
            answer: "9"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The level surface f(x,y,z)=k contains the point (1,2,2). Step 1: evaluate f at the point: 1^2 + 2^2 + 2^2 = 1 + 4 + 4 = 9. Step 2: set k equal to this value, so k = 9."
          - problem: "Let f(x, y, z) = x^2 + y^2 - z. The level surface f(x, y, z) = k passes through the origin (0, 0, 0). Find k."
            answer: "0"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The level surface f(x,y,z)=k contains (0,0,0). Step 1: substitute the point: 0^2 + 0^2 - 0 = 0. Step 2: the level values satisfy k = 0, so k = 0."
          - problem: "Let f(x, y, z) = 2x^2 + y^2 + 3z^2. The level surface f(x, y, z) = k passes through (1, -1, 2). Find k."
            answer: "15"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Substitute the point into the function. Step 1: compute 2(1)^2 + (-1)^2 + 3(2)^2 = 2 + 1 + 12 = 15. Step 2: the level surface through the point has k = 15."
          - problem: "Let f(x, y, z) = 2x - y + 4z. The level surface f(x, y, z) = k passes through (3, 1, -2). Find k."
            answer: "-3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Evaluate f at the given point. Step 1: substitute (3,1,-2) into f: 2(3) - 1 + 4(-2) = 6 - 1 - 8 = -3. Step 2: the level constant is k = -3."
          - problem: "Let f(x, y, z) = x^2 - y^2 + z^2. The level surface f(x, y, z) = k passes through (1, 2, 3). Find k."
            answer: "6"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The level surface contains the point (1,2,3). Step 1: evaluate f at the point: 1^2 - 2^2 + 3^2 = 1 - 4 + 9 = 6. Step 2: set k equal to the value, so k = 6."
          - problem: "Let f(x, y, z) = 3x + y - 2z. The level surface f(x, y, z) = k passes through (1, 2, 3). Find k."
            answer: "-1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Substitute the point into the linear function. Step 1: compute 3(1) + 2 - 2(3) = 3 + 2 - 6 = -1. Step 2: the level surface has k = -1."
        constraints: "f is a quadratic or linear polynomial; the required level passes through a given small-integer point"
      - id: kp2
        name: "Identifying the surface"
        key_prerequisites: [functions-several-variables, coordinates-surfaces-3d]
        exemplars:
          - problem: "The level surface 3x - y + 2z = 6 comes from the standard quadric catalog. Which type of quadric surface is this?"
            answer: "plane"
            answer_contract: {"kind": "label", "options": [["plane"], ["sphere"], ["cylinder"], ["cone"]]}
            solution_sketch: "The equation 3x - y + 2z = 6 is linear in x, y, z, so its graph is a plane. The wrong options are sphere, which needs three squared terms; cylinder, which needs a missing variable or a repeated squared pair; and cone, which needs a constant term of zero. The surface is a plane."
          - problem: "Consider the level surface x^2 - y^2 + z^2 = 4. Which type of quadric surface is this?"
            answer: "hyperboloid"
            answer_contract: {"kind": "label", "options": [["hyperboloid"], ["sphere"], ["cone"], ["paraboloid"]]}
            solution_sketch: "The equation x^2 - y^2 + z^2 = 4 has two positive squares and one negative square with a nonzero constant, so it is a hyperboloid. The wrong options are sphere, which needs all squared terms with the same sign; cone, which needs the constant to be zero; and paraboloid, which needs one variable to appear linearly. The surface is a hyperboloid."
          - problem: "For the level surface x^2 + y^2 = 36 in R^3, find the radius of the circular cross-section."
            answer: "6"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The equation x^2 + y^2 = 36 has no z, so it is a circular cylinder about the z-axis. The cross-section radius is sqrt(36). The radius is 6."
          - problem: "For the level surface x^2 + y^2 + z^2 - 6x + 4y - 2z = 3, give the coordinates of its center as (x, y, z)."
            answer: "(3, -2, 1)"
            answer_contract: {"arity": 3, "kind": "coordinates"}
            solution_sketch: "Group the terms: x^2 - 6x + y^2 + 4y + z^2 - 2z = 3. Complete the square: (x-3)^2 + (y+2)^2 + (z-1)^2 = 17, a sphere. The center is (3, -2, 1)."
          - problem: "For the level surface z = x^2 + y^2, find the radius of the circular cross-section at z = 9."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The surface z = x^2 + y^2 is a circular paraboloid opening upward. Setting z = 9 gives x^2 + y^2 = 9, a circle of radius sqrt(9). The radius is 3."
          - problem: "For the level surface z^2 = x^2 + y^2, find the radius of the circular cross-section at z = 5."
            answer: "5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The surface z^2 = x^2 + y^2 is a double cone. Setting z = 5 gives x^2 + y^2 = 25, a circle of radius sqrt(25). The radius is 5."
        constraints: "surfaces come from the standard quadric catalog: spheres, planes, cylinders, cones, paraboloids, hyperboloids"
    diagnostic_exemplar:
      problem: 'Identify the level surface of $f(x, y, z) = x^2 + y^2 - z^2$ at $k = 4$, and at $k = 0$.'
      answer: '$k = 4$: the hyperboloid of one sheet $x^2 + y^2 - z^2 = 4$ with axis the $z$-axis. $k = 0$: the double cone $z^2 = x^2 + y^2$ with axis the $z$-axis.'
      answer_contract: {kind: none}
      solution_sketch: 'For $k > 0$ the equation $x^2 + y^2 - z^2 = k$ has one negative square and non-empty traces $z = c$ for every $c$, so it is a one-sheeted hyperboloid; at $k = 0$ it degenerates to $x^2 + y^2 = z^2$, the cone.'
    anki_seeds:
      - front: 'What is a level surface of $f(x, y, z)$?'
        back: 'The set of points in space where $f(x, y, z) = k$ for a fixed constant $k$.'
        type: basic
      - front: 'Why do we describe $f(x, y, z)$ with level surfaces instead of a graph?'
        back: 'Its graph $w = f(x,y,z)$ lives in four dimensions; level surfaces show the function inside $\mathbb{R}^3$.'
        type: basic

  - id: limits-along-paths
    name: "Limits Along Paths"
    core: false                # head of the terminal multivariable-limits branch
    difficulty: 0.68
    drill: false
    answer_kind: numeric
    expected_time_secs: 150
    prerequisites:
      - id: functions-several-variables
        weight: 0.6
        key: true
      - id: limit-laws
        weight: 0.6
        key: true
    knowledge_points:
      - id: kp1
        name: "Evaluating a limit along a given path"
        key_prerequisites: [functions-several-variables, limit-laws]
        exemplars:
          - problem: "Evaluate the limit of xy/(x^2 + y^2) as (x, y) approaches (0, 0) along the line y = 2x. Give the exact value as a fraction."
            answer: "2/5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Start with the full expression xy/(x^2 + y^2). Substitute y = 2x to restrict to the line, giving (x*2x)/(x^2 + (2x)^2) = 2x^2/(5x^2). For x not 0 this simplifies to 2/5, so the limit along the path is 2/5."
          - problem: "Evaluate the limit of (x^2 - y^2)/(x^2 + y^2) as (x, y) approaches (0, 0) along the line y = 2x. Give the exact value as a fraction."
            answer: "-3/5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Start with the full expression (x^2 - y^2)/(x^2 + y^2). Substitute y = 2x to get (x^2 - 4x^2)/(x^2 + 4x^2) = -3x^2/(5x^2). For x not 0 this simplifies to -3/5, so the limit along the path is -3/5."
          - problem: "Evaluate the limit of xy/(x^2 + y^2) as (x, y) approaches (0, 0) along the parabola y = x^2. Give the exact value."
            answer: "0"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Start with the full expression xy/(x^2 + y^2). Substitute y = x^2 to get x*x^2/(x^2 + x^4) = x^3/(x^2(1 + x^2)). For x not 0 this simplifies to x/(1 + x^2), and as x approaches 0 it approaches 0. The limit along the path is 0."
          - problem: "Evaluate the limit of (x^2 y)/(x^4 + y^2) as (x, y) approaches (0, 0) along the parabola y = x^2. Give the exact value as a fraction."
            answer: "1/2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Start with the full expression (x^2 y)/(x^4 + y^2). Substitute y = x^2 to get (x^2*x^2)/(x^4 + (x^2)^2) = x^4/(2x^4). For x not 0 this simplifies to 1/2, so the limit along the path is 1/2."
          - problem: "Evaluate the limit of (x^2 - y^2)/(x^2 + y^2) as (x, y) approaches (0, 0) along the line y = 3x. Give the exact value as a fraction."
            answer: "-4/5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Start with the full expression (x^2 - y^2)/(x^2 + y^2). Substitute y = 3x to get (x^2 - 9x^2)/(x^2 + 9x^2) = -8x^2/(10x^2). For x not 0 this simplifies to -4/5, so the limit along the path is -4/5."
          - problem: "Evaluate the limit of (x^2 - y^2)/(x^2 + y^2) as (x, y) approaches (0, 0) along the x-axis. Give the exact value."
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Start with the full expression (x^2 - y^2)/(x^2 + y^2). On the x-axis y = 0, so the expression becomes (x^2 - 0)/(x^2 + 0) = 1 for x not 0. The limit along the x-axis is therefore 1."
        constraints: "paths are lines y = mx, axes, or parabolas; the restricted limit is a one-variable computation"
      - id: kp2
        name: "The two-path test"
        key_prerequisites: [functions-several-variables, limit-laws]
        exemplars:
          - problem: "Consider the limit of f(x,y) = xy/(x^2 + y^2) as (x,y) goes to (0,0). Use the paths y = 0 and y = x. Give the verdict and the limit L along y = 0."
            answer: "verdict = DNE; L = 0"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["DNE"], ["exists"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "L"}]}
            solution_sketch: "For f(x,y) = xy/(x^2 + y^2): Step 1 (path y = 0): f(x,0) = 0/(x^2) = 0, so the limit along y = 0 is 0. Step 2 (path y = x): f(x,x) = x^2/(2x^2) = 1/2. Step 3 (two-path test): the two path limits 0 and 1/2 differ, so the limit does not exist. The wrong option exists would mean the two path limits agree, but they do not. The answer is verdict = DNE; L = 0."
          - problem: "Consider the limit of f(x,y) = 2xy^2/(x^2 + y^4) as (x,y) goes to (0,0). Use the paths y = 0 and x = y^2. Give the verdict and the limit L along x = y^2."
            answer: "verdict = DNE; L = 1"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["DNE"], ["exists"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "L"}]}
            solution_sketch: "For f(x,y) = 2xy^2/(x^2 + y^4): Step 1 (path y = 0): f(x,0) = 0/(x^2) = 0. Step 2 (path x = y^2): f(y^2,y) = 2 y^2 y^2/(y^4 + y^4) = 2y^4/(2y^4) = 1. Step 3 (two-path test): the two path limits 0 and 1 differ, so the limit does not exist. The wrong option exists would mean the two path limits agree, but they do not. The answer is verdict = DNE; L = 1."
          - problem: "Consider the limit of f(x,y) = x^2/(x^2 + y^2) as (x,y) goes to (0,0). Use the paths y = 0 and y = x. Give the verdict and the limit L along y = x."
            answer: "verdict = DNE; L = 1/2"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["DNE"], ["exists"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "L"}]}
            solution_sketch: "For f(x,y) = x^2/(x^2 + y^2): Step 1 (path y = 0): f(x,0) = x^2/x^2 = 1. Step 2 (path y = x): f(x,x) = x^2/(2x^2) = 1/2. Step 3 (two-path test): the two path limits 1 and 1/2 differ, so the limit does not exist. The wrong option exists would mean the two path limits agree, but they do not. The answer is verdict = DNE; L = 1/2."
          - problem: "Consider the limit of f(x,y) = xy/(x^2 + 2y^2) as (x,y) goes to (0,0). Use the paths y = 0 and y = x. Give the verdict and the limit L along y = x."
            answer: "verdict = DNE; L = 1/3"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["DNE"], ["exists"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "L"}]}
            solution_sketch: "For f(x,y) = xy/(x^2 + 2y^2): Step 1 (path y = 0): f(x,0) = 0/(x^2) = 0. Step 2 (path y = x): f(x,x) = x^2/(x^2 + 2x^2) = x^2/(3x^2) = 1/3. Step 3 (two-path test): the two path limits 0 and 1/3 differ, so the limit does not exist. The wrong option exists would mean the two path limits agree, but they do not. The answer is verdict = DNE; L = 1/3."
          - problem: "Consider the limit of f(x,y) = (2x^2 + y^2)/(x^2 + y^2) as (x,y) goes to (0,0). Use the paths y = 0 and y = x. Give a = limit along y = 0 and b = limit along y = x."
            answer: "a = 2; b = 3/2"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "a"}, {"contract": {"kind": "exact"}, "name": "b"}]}
            solution_sketch: "For f(x,y) = (2x^2 + y^2)/(x^2 + y^2): Step 1 (path y = 0): f(x,0) = 2x^2/x^2 = 2. Step 2 (path y = x): f(x,x) = (2x^2 + x^2)/(x^2 + x^2) = 3x^2/(2x^2) = 3/2. Step 3 (two-path test): the two path limits 2 and 3/2 differ, so the limit does not exist. The answer is a = 2; b = 3/2."
          - problem: "Consider the limit of f(x,y) = (3x^2 + y^2)/(x^2 + y^2) as (x,y) goes to (0,0). Use the paths y = 0 and y = x. Give a = limit along y = 0 and b = limit along y = x."
            answer: "a = 3; b = 2"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "a"}, {"contract": {"kind": "exact"}, "name": "b"}]}
            solution_sketch: "For f(x,y) = (3x^2 + y^2)/(x^2 + y^2): Step 1 (path y = 0): f(x,0) = 3x^2/x^2 = 3. Step 2 (path y = x): f(x,x) = (3x^2 + x^2)/(x^2 + x^2) = 4x^2/(2x^2) = 2. Step 3 (two-path test): the two path limits 3 and 2 differ, so the limit does not exist. The answer is a = 3; b = 2."
        constraints: "rational functions homogeneous of degree 0 (or needing one parabolic path); always exhibit two explicit paths"
    diagnostic_exemplar:
      problem: 'Determine whether $\lim_{(x,y) \to (0,0)} \dfrac{x^2 - y^2}{x^2 + y^2}$ exists.'
      answer: 'No: along $y = 0$ the limit is $1$; along $x = 0$ it is $-1$.'
      answer_contract: {kind: none}
      solution_sketch: 'The two coordinate-axis paths give different values, so no limit exists.'
    anki_seeds:
      - front: 'Two-path test for multivariable limits?'
        back: 'If two different paths into the point give different limits, the limit does not exist. (Agreeing paths prove nothing.)'
        type: basic
      - front: 'Can checking every straight line prove a multivariable limit exists?'
        back: 'No — e.g. $\frac{2xy^2}{x^2+y^4}$ is $0$ along every line but $1$ along $x = y^2$. Use squeeze/polar bounds instead.'
        type: basic

  - id: multivariable-limits-continuity
    name: "Multivariable Limits and Continuity"
    core: false                # terminal limits branch; nothing differentiates through it
    difficulty: 0.72
    drill: false
    answer_kind: numeric
    expected_time_secs: 180
    prerequisites:
      - id: limits-along-paths
        weight: 0.7
        key: true
      - id: continuity
        weight: 0.5
        key: true
      - id: limit-laws
        weight: 0.4
        key: false
    knowledge_points:
      - id: kp1
        name: "Limits that exist: substitution and algebra"
        key_prerequisites: [limit-laws, limits-along-paths]
        exemplars:
          - problem: 'Compute $\lim_{(x,y) \to (1,2)} (x^2 y + 3y)$.'
            answer: "8"
            solution_sketch: 'Polynomials are continuous: substitute to get $1 \cdot 2 + 6 = 8$.'
          - problem: 'Compute $\lim_{(x,y) \to (0,0)} \dfrac{x^2 - y^2}{x - y}$ (taken over points with $x \ne y$).'
            answer: "0"
            solution_sketch: 'For $x \ne y$, $\frac{x^2 - y^2}{x - y} = x + y$, which tends to $0$.'
          - problem: "Compute the limit as (x,y) goes to (2,-1) of x^2 + xy - y^2."
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "For the limit of x^2 + xy - y^2 as (x,y) goes to (2,-1), the function is a polynomial, so it is continuous by the limit laws. Substitute x = 2 and y = -1: 4 + (2)(-1) - 1 = 1. The limit is 1."
          - problem: "Compute the limit as (x,y) goes to (1,-1) of (x^2 - y^2)/(x + y), taken over points with x + y not equal to 0."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "For the limit of (x^2 - y^2)/(x + y) as (x,y) goes to (1,-1), factor the numerator as (x - y)(x + y). Cancel the common factor x + y on the domain x + y not equal to 0, giving x - y. Substitute (1,-1): 1 - (-1) = 2. The limit is 2."
          - problem: "Compute the limit as (x,y) goes to (1,2) of (x^2 + y^2)/(x + y)."
            answer: "5/3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "For the limit of (x^2 + y^2)/(x + y) as (x,y) goes to (1,2), the function is rational and continuous where the denominator is not zero. Substitute x = 1 and y = 2: (1 + 4)/(1 + 2) = 5/3. The limit is 5/3."
          - problem: "Compute the limit as (x,y) goes to (3,1) of (x^2 - 9)/(xy - 3y), taken over points with y(x - 3) not equal to 0."
            answer: "6"
            answer_contract: {"kind": "exact"}
            solution_sketch: "For the limit of (x^2 - 9)/(xy - 3y) as (x,y) goes to (3,1), factor the numerator as (x - 3)(x + 3) and the denominator as y(x - 3). Cancel the common factor x - 3 on the domain y(x - 3) not equal to 0, giving (x + 3)/y. Substitute (3,1): (3 + 3)/1 = 6. The limit is 6."
        constraints: "continuous functions or a single factor cancellation; answers are small exact numbers"
      - id: kp2
        name: "Squeeze arguments"
        key_prerequisites: [limits-along-paths, limit-laws]
        exemplars:
          - problem: 'Compute $\lim_{(x,y) \to (0,0)} \dfrac{x^2 y}{x^2 + y^2}$.'
            answer: "0"
            solution_sketch: '$\left|\frac{x^2 y}{x^2 + y^2}\right| \le |y|$ since $x^2 \le x^2 + y^2$; squeeze with $|y| \to 0$.'
          - problem: 'Compute $\lim_{(x,y) \to (0,0)} \dfrac{x^3}{x^2 + y^2}$.'
            answer: "0"
            solution_sketch: '$\left|\frac{x^3}{x^2 + y^2}\right| = |x| \cdot \frac{x^2}{x^2 + y^2} \le |x| \to 0$.'
          - problem: "Compute $\\lim_{(x,y)\\to(0,0)} \\left(3 + \\dfrac{x^2 y}{x^2+y^2}\\right)$."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Limit laws split the sum: the limit of 3 plus the limit of x^2 y/(x^2+y^2) as (x,y) tends to (0,0). For the fraction, x^2 <= x^2+y^2 gives |x^2 y/(x^2+y^2)| <= |y|, and |y| tends to 0, so the squeeze rule gives that fraction a limit of 0. Therefore the sum has limit 3 + 0 = 3."
          - problem: "Compute $\\lim_{(x,y)\\to(0,0)} \\left(-1 + \\dfrac{x^3}{x^2+y^2}\\right)$."
            answer: "-1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Limit laws split the sum: the limit of -1 plus the limit of x^3/(x^2+y^2) as (x,y) tends to (0,0). For the fraction, x^2 <= x^2+y^2 gives |x^3/(x^2+y^2)| = |x| * x^2/(x^2+y^2) <= |x|, and |x| tends to 0, so the squeeze rule gives that fraction a limit of 0. Therefore the sum has limit -1 + 0 = -1."
          - problem: "Compute $\\lim_{(x,y)\\to(0,0)} \\left(5 + \\dfrac{x^2 y}{2x^2+3y^2}\\right)$."
            answer: "5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Limit laws split the sum: the limit of 5 plus the limit of x^2 y/(2x^2+3y^2) as (x,y) tends to (0,0). Since 2x^2 <= 2x^2+3y^2, we get |x^2 y/(2x^2+3y^2)| <= |y|/2, and |y|/2 tends to 0, so the squeeze rule gives the fraction a limit of 0. Therefore the sum has limit 5 + 0 = 5."
          - problem: "Compute $\\lim_{(x,y)\\to(0,0)} \\left(7 + \\dfrac{x^3}{x^2+4y^2}\\right)$."
            answer: "7"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Limit laws split the sum: the limit of 7 plus the limit of x^3/(x^2+4y^2) as (x,y) tends to (0,0). Since x^2 <= x^2+4y^2, we get |x^3/(x^2+4y^2)| = |x| * x^2/(x^2+4y^2) <= |x|, and |x| tends to 0, so the squeeze rule gives the fraction a limit of 0. Therefore the sum has limit 7 + 0 = 7."
        constraints: "numerator degree strictly exceeds denominator degree; the bounding factor is |x| or |y|"
      - id: kp3
        name: "Continuity and deciding existence"
        key_prerequisites: [continuity, limits-along-paths]
        exemplars:
          - problem: "The function f(x,y) = 1/(x^2 + y^2 - 1) is continuous everywhere except on one circle. Find the radius of that circle."
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "For f(x,y)=1/(x^2+y^2-1), a quotient of continuous functions is continuous where the denominator is nonzero. The denominator fails at x^2+y^2-1=0, which is the circle x^2+y^2=1. Its radius is 1."
          - problem: "The function f(x,y) = ln(x + y) is continuous on the half-plane x + y > c. Find c."
            answer: "0"
            answer_contract: {"kind": "exact"}
            solution_sketch: "For f(x,y)=ln(x+y), the logarithm is continuous where its argument is positive. The boundary of x+y>0 is x+y=0, so c=0. The answer is 0."
          - problem: "Let f(x, y) = (x^2 + y^2)/sin(2(x^2 + y^2)). Consider the limit of f as (x, y) goes to (0, 0). State whether the limit exists, and give the value of the limit."
            answer: "verdict = exists; L = 1/2"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["exists"], ["absent"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "L"}]}
            solution_sketch: "For f(x,y)=(x^2+y^2)/sin(2(x^2+y^2)), set t = x^2+y^2; as (x,y) goes to (0,0), t goes to 0 through positive values (composition, limit laws). For t > 0 the sine bounds 2t cos(2t) <= sin(2t) <= 2t hold, and dividing by 2 sin(2t) gives 1/2 <= t/sin(2t) <= 1/(2 cos(2t)). Both bounds tend to 1/2, so the squeeze theorem forces the limit to equal 1/2. The option absent is the verdict for a function whose path limits disagree; here the two-sided squeeze bound proves one single limit value, so absent is wrong. So verdict = exists; L = 1/2."
          - problem: "The function f(x,y) = 1/(x^2 - y) is continuous everywhere except on the curve y = x^2. Find the value of y on this curve when x = 2."
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "For f(x,y)=1/(x^2-y), the quotient is continuous where the denominator x^2-y is nonzero. The failure curve is y=x^2. At x=2, y=2^2=4. The value is 4."
          - problem: "The function f(x,y) = sqrt(x - y^2) is continuous where its argument is nonnegative. Find the boundary value of x when y = 3."
            answer: "9"
            answer_contract: {"kind": "exact"}
            solution_sketch: "For f(x,y)=sqrt(x-y^2), the square root is continuous where x-y^2 >= 0. The boundary is x=y^2. At y=3, x=3^2=9. The boundary value is 9."
          - problem: "Consider the limit of x^2 y/(x^4 + y^2) as (x,y) goes to (0,0). What is the limit? Select the correct value."
            answer: "DNE"
            answer_contract: {"kind": "label", "options": [["0"], ["1/2"], ["DNE", "does not exist"], ["1"]]}
            solution_sketch: "For f(x,y)=x^2 y/(x^4+y^2), along y=0 the limit is 0, so option 0 is the path value on the x-axis. Along y=x^2 the function becomes x^4/(x^4+x^4)=1/2, so option 1/2 is the path value on that parabola. The value 1 is not approached on these paths and is a distractor. Since two paths give different limits, the limit does not exist. The answer is DNE."
        constraints: "continuity questions reduce to where a denominator or log/root argument fails; existence decisions need an explicit squeeze bound"
    diagnostic_exemplar:
      problem: 'Determine whether $\lim_{(x,y) \to (0,0)} \dfrac{x y^3}{x^2 + y^2}$ exists, and find it if so.'
      answer: 'Yes; the limit is $0$.'
      answer_contract: {kind: none}
      solution_sketch: '$\left|\frac{xy^3}{x^2+y^2}\right| = |xy| \cdot \frac{y^2}{x^2+y^2} \le |xy| \to 0$, so the squeeze gives $0$.'
    anki_seeds:
      - front: 'Standard squeeze bounds at $(0,0)$: $\dfrac{x^2}{x^2 + y^2} \le$ {{c1::$1$}} and $|x| \le$ {{c2::$\sqrt{x^2 + y^2}$}}.'
        back: '$1$ / $\sqrt{x^2+y^2}$'
        type: cloze
      - front: 'Where are rational functions of $x$ and $y$ continuous?'
        back: 'Everywhere the denominator is nonzero.'
        type: basic

  - id: multivariable-limits-polar
    name: "Multivariable Limits in Polar Coordinates"
    core: false                # special-case limit technique; terminal
    difficulty: 0.74
    drill: false
    answer_kind: numeric
    expected_time_secs: 150
    prerequisites:
      - id: multivariable-limits-continuity
        weight: 0.7
        key: true
      - id: polar-coordinates
        weight: 0.5
        key: true
      - id: lhopitals-rule
        weight: 0.0
        key: false
    knowledge_points:
      - id: kp1
        name: "Polar substitution for limits at the origin"
        key_prerequisites: [multivariable-limits-continuity, polar-coordinates]
        exemplars:
          - problem: 'Use polar coordinates to compute $\lim_{(x,y) \to (0,0)} \dfrac{x^3}{x^2 + y^2}$.'
            answer: "0"
            solution_sketch: '$x = r\cos\theta$, $y = r\sin\theta$: the quotient is $r\cos^3\theta$, and $|r\cos^3\theta| \le r \to 0$ uniformly in $\theta$.'
          - problem: 'Use polar coordinates to compute $\lim_{(x,y) \to (0,0)} \dfrac{xy}{\sqrt{x^2 + y^2}}$.'
            answer: "0"
            solution_sketch: '$x = r\cos\theta$, $y = r\sin\theta$ and $\sqrt{x^2+y^2} = r$: the quotient is $\frac{r^2\cos\theta\sin\theta}{r} = r\cos\theta\sin\theta$, and $|r\cos\theta\sin\theta| \le r \to 0$ uniformly in $\theta$.'
          - problem: 'Use polar coordinates to compute $\lim_{(x,y) \to (0,0)} (x^2 + y^2)\ln(x^2 + y^2)$.'
            answer: "0"
            solution_sketch: 'The expression is $r^2 \ln r^2 = 2r^2 \ln r \to 0$ as $r \to 0^+$ (independent of $\theta$; the one-variable limit is the $0 \cdot \infty$ form $\lim_{r \to 0^+} r^2\ln r$, rewritten as $\frac{\ln r}{r^{-2}}$ and evaluated by l''Hôpital).'
          - problem: "Substitute $x = r\\cos\\theta$ and $y = r\\sin\\theta$ into $f(x,y) = \\dfrac{x^2 y}{x^2 + y^2}$. The result has the form $r^k g(\\theta)$, where $g$ depends on $\\theta$ alone. Find $k$."
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Rule of polar substitution: $x = r\\cos\\theta$, $y = r\\sin\\theta$, and $x^2 + y^2 = r^2$. The numerator is $x^2 y = r^3 \\cos^2\\theta \\sin\\theta$, so the quotient is $r\\cos^2\\theta \\sin\\theta$. This is $r^k g(\\theta)$ with $g(\\theta) = \\cos^2\\theta \\sin\\theta$, a function of $\\theta$ alone. The power is $k = 1$."
          - problem: "Substitute $x = r\\cos\\theta$ and $y = r\\sin\\theta$ into $f(x,y) = \\dfrac{x^4}{x^2 + y^2}$. The result has the form $r^k g(\\theta)$, where $g$ depends on $\\theta$ alone. Find $k$."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Rule of polar substitution: $x = r\\cos\\theta$, $y = r\\sin\\theta$, and $x^2 + y^2 = r^2$. The numerator is $x^4 = r^4 \\cos^4\\theta$, so the quotient is $r^2\\cos^4\\theta$. This is $r^k g(\\theta)$ with $g(\\theta) = \\cos^4\\theta$, a function of $\\theta$ alone. The power is $k = 2$."
          - problem: "Use polar coordinates to decide whether the limit of $f(x,y) = \\dfrac{x^3 + y^3}{x^2 + y^2}$ as $(x,y) \\to (0,0)$ is a single number. Give the answer as verdict = ...; L = ..., where L is the limit when it is a single number."
            answer: "verdict = exists; L = 0"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["exists"], ["DNE"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "L"}]}
            solution_sketch: "Rule of polar substitution: $x = r\\cos\\theta$, $y = r\\sin\\theta$, and $x^2 + y^2 = r^2$. The quotient becomes $\\frac{r^3\\cos^3\\theta + r^3\\sin^3\\theta}{r^2} = r(\\cos^3\\theta + \\sin^3\\theta)$. Bounding rule: $|\\cos^3\\theta + \\sin^3\\theta| \\le 2$ for every $\\theta$, so $|f| \\le 2r$, and $2r \\to 0$ as $r \\to 0$ no matter what $\\theta$ is. The wrong verdict DNE comes from stopping at the angle-dependent factor $\\cos^3\\theta + \\sin^3\\theta$ and ignoring the factor $r$ that drives the product to $0$ for every $\\theta$. The limit is the single number $0$, so the answer is verdict = exists; L = 0."
        constraints: "after substitution the expression is bounded by a function of r alone tending to 0; that bounding function may itself require a one-variable limit (e.g. r^2 ln r -> 0), which must then be evaluated explicitly"
      - id: kp2
        name: "Detecting angle dependence"
        key_prerequisites: [multivariable-limits-continuity, polar-coordinates]
        exemplars:
          - problem: "Let t = theta. Write the polar form of (x^2 - y^2)/(x^2 + y^2) as a function of t, and decide whether the limit at the origin exists. Give the answer as verdict = word; polar = the polar form."
            answer: "verdict = DNE; polar = cos(2t)"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["DNE"], ["finite"]]}, "name": "verdict"}, {"contract": {"kind": "function", "vars": ["t"]}, "name": "polar"}]}
            solution_sketch: "Step 1 (polar substitution): put x = r cos(t) and y = r sin(t) with t = theta. The quotient becomes r^2(cos(t)^2 - sin(t)^2)/r^2, which simplifies to cos(t)^2 - sin(t)^2. Step 2 (double-angle identity): this equals cos(2t), which depends on t. The wrong option finite would mean independence of t, but the polar form is not constant. The answer is verdict = DNE; polar = cos(2t)."
          - problem: "Let t = theta. Write the polar form of xy/(x^2 + y^2) as a function of t, and decide whether the limit at the origin exists. Give the answer as verdict = word; polar = the polar form."
            answer: "verdict = DNE; polar = sin(2t)/2"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["DNE"], ["finite"]]}, "name": "verdict"}, {"contract": {"kind": "function", "vars": ["t"]}, "name": "polar"}]}
            solution_sketch: "Step 1 (polar substitution): put x = r cos(t) and y = r sin(t) with t = theta. The quotient becomes r^2 cos(t) sin(t)/r^2 = cos(t) sin(t). Step 2 (double-angle identity): cos(t) sin(t) = sin(2t)/2, which depends on t. The wrong option finite would mean independence of t, but this polar form is not constant. The answer is verdict = DNE; polar = sin(2t)/2."
          - problem: "Let t = theta. Write the polar form of (x^2 + y^2)/(x^2 + 2y^2) as a function of t. Give the answer as a function of t."
            answer: "1/(1+sin(t)^2)"
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: "Step 1 (polar substitution): put x = r cos(t) and y = r sin(t) with t = theta. The numerator is r^2 and the denominator is r^2(cos(t)^2 + 2 sin(t)^2). Step 2 (simplify): cancel r^2 and use cos(t)^2 + sin(t)^2 = 1 to get 1/(1 + sin(t)^2). This depends on t, so the limit does not exist. The answer is 1/(1+sin(t)^2)."
          - problem: "Let t = theta. Write the polar form of (x^2 - 2xy - y^2)/(x^2 + y^2) as a function of t. Give the answer as a function of t."
            answer: "cos(2t)-sin(2t)"
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: "Step 1 (polar substitution): put x = r cos(t) and y = r sin(t) with t = theta. The quotient becomes cos(t)^2 - 2 cos(t) sin(t) - sin(t)^2. Step 2 (double-angle identity): cos(t)^2 - sin(t)^2 = cos(2t) and 2 cos(t) sin(t) = sin(2t), so the polar form is cos(2t) - sin(2t). This depends on t, so the limit does not exist. The answer is cos(2t)-sin(2t)."
          - problem: "Let t = theta. Write the polar form of (2x^2 + 2y^2)/(x^2 + y^2) as a function of t, and decide whether the limit at the origin exists. Give the answer as verdict = word; value = the limit when it exists."
            answer: "verdict = finite; value = 2"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["DNE"], ["finite"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "value"}]}
            solution_sketch: "Step 1 (polar substitution): put x = r cos(t) and y = r sin(t) with t = theta. The quotient becomes (2r^2)/(r^2) = 2, which is independent of t. Step 2 (conclusion): a polar form independent of t gives the limit, so the limit is 2. The wrong option DNE would mean angle dependence, but the polar form is the constant 2. The answer is verdict = finite; value = 2."
          - problem: "Let t = theta. Write the polar form of (x^2 + 4xy + y^2)/(x^2 + y^2) as a function of t. Give the answer as a function of t."
            answer: "1+2sin(2t)"
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: "Step 1 (polar substitution): put x = r cos(t) and y = r sin(t) with t = theta. The quotient becomes cos(t)^2 + 4 cos(t) sin(t) + sin(t)^2. Step 2 (simplify): cos(t)^2 + sin(t)^2 = 1 and 4 cos(t) sin(t) = 2 sin(2t), so the polar form is 1 + 2 sin(2t). This depends on t, so the limit does not exist. The answer is 1+2sin(2t)."
        constraints: "homogeneous degree-0 quotients whose polar form is a pure function of theta"
    diagnostic_exemplar:
      problem: 'Use polar coordinates to decide whether $\lim_{(x,y) \to (0,0)} \dfrac{xy}{x^2 + 2y^2}$ exists.'
      answer: 'No, the limit does not exist.'
      answer_contract: {kind: none}
      solution_sketch: 'In polar coordinates the quotient is $\dfrac{r^2\cos\theta\sin\theta}{r^2(\cos^2\theta + 2\sin^2\theta)} = \dfrac{\cos\theta\,\sin\theta}{1 + \sin^2\theta}$: independent of $r$ but varying with $\theta$ (it equals $0$ along $\theta = 0$ and $\tfrac{1}{3}$ along $\theta = \pi/4$), so the value depends on the direction of approach.'
    anki_seeds:
      - front: 'Polar substitution for limits at the origin?'
        back: '$x = r\cos\theta$, $y = r\sin\theta$, so $x^2 + y^2 = r^2$ and $(x,y) \to (0,0)$ becomes $r \to 0^+$.'
        type: basic
      - front: 'When does the polar method prove a limit exists?'
        back: 'When $|f|$ is bounded by a function of $r$ alone that tends to $0$; if the polar form depends on $\theta$ but not $r$, the limit fails.'
        type: basic

  - id: first-order-partial-derivatives
    name: "First-Order Partial Derivatives"
    core: true
    difficulty: 0.58
    drill: false
    answer_kind: expression
    expected_time_secs: 100
    prerequisites:
      - id: evaluating-multivariable-functions
        weight: 0.6
        key: true
      - id: derivatives-of-polynomials
        weight: 0.6
        key: true
      - id: product-quotient-rules
        weight: 0.4
        key: false
    knowledge_points:
      - id: kp1
        name: "Partials of polynomials"
        key_prerequisites: [evaluating-multivariable-functions, derivatives-of-polynomials]
        exemplars:
          - problem: 'Let $f(x, y) = x^3 y^2 + 2x - y$. Find $f_x$ and $f_y$; state the pair $(f_x, f_y)$.'
            answer: '$(3x^2 y^2 + 2,\ 2x^3 y - 1)$'
            solution_sketch: 'For $f_x$ treat $y$ as a constant; for $f_y$ treat $x$ as a constant.'
          - problem: "Let f(x, y) = 5x^2 y + 2x y^3 - 7y. Find both first-order partial derivatives. Give fx and fy."
            answer: "fx = 10xy + 2y^3; fy = 5x^2 + 6xy^2 - 7"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "function", "vars": ["x", "y"]}, "name": "fx"}, {"contract": {"kind": "function", "vars": ["x", "y"]}, "name": "fy"}]}
            solution_sketch: "For fx hold y constant and apply the power rule in x: the derivatives of 5x^2 y, 2x y^3, and -7y are 10xy, 2y^3, and 0. For fy hold x constant: the derivatives are 5x^2, 6xy^2, and -7. The pair is fx = 10xy + 2y^3; fy = 5x^2 + 6xy^2 - 7."
          - problem: 'Let $f(x, y) = x^2 y^3$. Compute $f_y(1, 2)$.'
            answer: "12"
            solution_sketch: '$f_y = 3x^2 y^2$; at $(1, 2)$: $3 \cdot 1 \cdot 4 = 12$.'
          - problem: "Let f(x, y) = x^5 - 3x^2 y^2 + y. Find fx as a function of x and y."
            answer: "5x^4 - 6xy^2"
            answer_contract: {"kind": "function", "vars": ["x", "y"]}
            solution_sketch: "For fx treat y as a constant and differentiate each term in x with the power rule. The derivative of x^5 is 5x^4, the derivative of -3x^2 y^2 is -6xy^2, and the derivative of y is 0. The partial derivative is fx = 5x^4 - 6xy^2."
          - problem: "Let f(x, y) = 2x y^4 - x^3 + 5. Compute fy(2, 1)."
            answer: "16"
            answer_contract: {"kind": "exact"}
            solution_sketch: "First find fy by holding x constant: the derivative of 2x y^4 is 8xy^3, while -x^3 + 5 gives 0. Substitute x = 2 and y = 1: 8 times 2 times 1 is 16. The value is 16."
          - problem: "A factory's daily output is Q(x, y) = 3x^2 y - x y + 10, where x is liters of a chemical used and y is hours of labor. Find Qy as a formula in x and y."
            answer: "3x^2 - x"
            answer_contract: {"kind": "function", "vars": ["x", "y"]}
            solution_sketch: "For Qy hold x constant and differentiate each term in y with the power rule. The derivative of 3x^2 y is 3x^2, the derivative of -x y is -x, and the derivative of 10 is 0. The partial derivative is Qy = 3x^2 - x."
        constraints: "polynomial in x, y with integer coefficients, total degree at most 5"
      - id: kp2
        name: "The limit definition and notation"
        key_prerequisites: [derivatives-of-polynomials]
        exemplars:
          - problem: 'For $f(x, y) = x^2 - 2xy$, use the limit definition to compute $f_x(1, 2)$.'
            answer: '$-2$'
            solution_sketch: '$\frac{f(1+h,\,2) - f(1,\,2)}{h} = \frac{(1+h)^2 - 4(1+h) - (-3)}{h} = \frac{h^2 - 2h}{h} = h - 2 \to -2$. Check: $f_x = 2x - 2y = -2$ at $(1,2)$.'
          - problem: 'Let $f(x, y) = x y^2$. Use the limit definition of $f_y$ (not the power rule) to compute $f_y(2, 1)$.'
            answer: "4"
            solution_sketch: '$\frac{f(2,\,1+h) - f(2,\,1)}{h} = \frac{2(1+h)^2 - 2}{h} = \frac{4h + 2h^2}{h} = 4 + 2h \to 4$. Check: $f_y = 2xy = 4$ at $(2, 1)$.'
          - problem: "Let f(x, y) = 3x^2 - xy + y^2. Find ∂f/∂x as a function of x and y using the limit definition."
            answer: "6x - y"
            answer_contract: {"kind": "function", "vars": ["x", "y"]}
            solution_sketch: "Start with f(x, y) = 3x^2 - xy + y^2. Step 1: write the limit definition of the partial derivative with respect to x: f_x = lim h->0 [f(x+h, y) - f(x, y)]/h. Step 2: expand f(x+h, y) = 3(x+h)^2 - (x+h)y + y^2 = 3x^2 + 6xh + 3h^2 - xy - hy + y^2. Step 3: subtract f(x, y) and divide by h: [6xh + 3h^2 - hy]/h = 6x + 3h - y. Step 4: take the limit as h goes to 0, which gives 6x - y. The answer is 6x - y."
          - problem: "Let f(x, y) = x^2 + 5xy + y^2. Compute f_y(1, 2) using the limit definition of f_y."
            answer: "9"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Start with f(x, y) = x^2 + 5xy + y^2. Step 1: write the limit definition in y: f_y(1, 2) = lim h->0 [f(1, 2+h) - f(1, 2)]/h. Step 2: compute f(1, 2) = 1 + 10 + 4 = 15 and f(1, 2+h) = 1 + 5(2+h) + (2+h)^2 = 15 + 9h + h^2. Step 3: form the difference quotient [15 + 9h + h^2 - 15]/h = 9 + h. Step 4: take the limit as h goes to 0 to get 9. The answer is 9."
          - problem: "Let z = 2x^2 + 3y^2 - xy. Find ∂z/∂y as a function of x and y using the limit definition."
            answer: "6y - x"
            answer_contract: {"kind": "function", "vars": ["x", "y"]}
            solution_sketch: "Start with z = 2x^2 + 3y^2 - xy. Step 1: write the limit definition of ∂z/∂y: z_y = lim h->0 [z(x, y+h) - z(x, y)]/h. Step 2: expand z(x, y+h) = 2x^2 + 3(y+h)^2 - x(y+h) = 2x^2 + 3y^2 + 6yh + 3h^2 - xy - xh. Step 3: subtract z(x, y) and divide by h: [6yh + 3h^2 - xh]/h = 6y + 3h - x. Step 4: take the limit as h goes to 0 to get 6y - x. The answer is 6y - x."
          - problem: "Let f(x, y) = x^2 - 3xy + 2y^2. Compute f_x(-1, 2) using the limit definition."
            answer: "-8"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Start with f(x, y) = x^2 - 3xy + 2y^2. Step 1: write the limit definition in x at (-1, 2): f_x(-1, 2) = lim h->0 [f(-1+h, 2) - f(-1, 2)]/h. Step 2: compute f(-1, 2) = 1 + 6 + 8 = 15 and f(-1+h, 2) = (-1+h)^2 - 3(-1+h)(2) + 8 = 15 - 8h + h^2. Step 3: form the difference quotient [15 - 8h + h^2 - 15]/h = -8 + h. Step 4: take the limit as h goes to 0 to get -8. The answer is -8."
        constraints: "quadratic f so the difference quotient simplifies by cancellation; also test the equivalent notations for the partial derivative (∂z/∂x, ∂f/∂x, f_x) — never the straight-d dz/dx of one-variable calculus"
      - id: kp3
        name: "Products, quotients, and three variables"
        key_prerequisites: [product-quotient-rules, evaluating-multivariable-functions]
        exemplars:
          - problem: 'Let $f(x, y) = \dfrac{xy}{x + y}$. Find $f_x$.'
            answer: '$y^2/(x + y)^2$'
            solution_sketch: 'Quotient rule in $x$: $\frac{y(x+y) - xy}{(x+y)^2} = \frac{y^2}{(x+y)^2}$.'
          - problem: 'Let $f(x, y, z) = x^2 y + y z^3$. Find $f_z$.'
            answer: '$3yz^2$'
            solution_sketch: 'Both $x$ and $y$ are held constant; only the $yz^3$ term involves $z$.'
          - problem: "Let f(x, y) = x^2 y / (x + y). Find f_y."
            answer: "x^3/(x+y)^2"
            answer_contract: {"kind": "function", "vars": ["x", "y"]}
            solution_sketch: "Write the function: f(x, y) = x^2 y / (x + y). Hold x constant and apply the quotient rule in y: f_y = x^2 * ((1)(x + y) - y(1)) / (x + y)^2. Simplify the numerator: x^2 * x / (x + y)^2. The derivative is x^3/(x+y)^2."
          - problem: "Let f(x, y, z) = x^2 y z^2 + y^3 z. Find f_y."
            answer: "x^2 z^2 + 3 y^2 z"
            answer_contract: {"kind": "function", "vars": ["x", "y", "z"]}
            solution_sketch: "Write the function: f(x, y, z) = x^2 y z^2 + y^3 z. Hold x and z constant and differentiate each term in y using the power rule. The first term gives x^2 z^2, and the second gives 3 y^2 z. The derivative is x^2 z^2 + 3 y^2 z."
          - problem: "Let f(x, y) = x^2 e^y + y^3. Find f_x."
            answer: "2x e^y"
            answer_contract: {"kind": "function", "vars": ["x", "y"]}
            solution_sketch: "Write the function: f(x, y) = x^2 e^y + y^3. Hold y constant; e^y is a constant factor. Apply the power rule in x to x^2 and the constant rule to y^3. The derivative is 2x e^y."
          - problem: "Let f(x, y) = (x^2 + y^2) / (x + y). Find f_x."
            answer: "(x^2+2xy-y^2)/(x+y)^2"
            answer_contract: {"kind": "function", "vars": ["x", "y"]}
            solution_sketch: "Write the function: f(x, y) = (x^2 + y^2) / (x + y). Hold y constant and apply the quotient rule in x: numerator derivative 2x times (x + y) minus (x^2 + y^2) times 1. Simplify: (2x^2 + 2xy - x^2 - y^2)/(x + y)^2 = (x^2 + 2xy - y^2)/(x + y)^2. The derivative is (x^2+2xy-y^2)/(x+y)^2."
        constraints: "one quotient-rule layer at most; three-variable examples are polynomial"
    diagnostic_exemplar:
      problem: 'Let $f(x, y, z) = \dfrac{xy}{x + z}$. Find $f_x$.'
      answer: '$yz/(x + z)^2$'
      solution_sketch: 'Treat $y$ and $z$ as constants and use the quotient rule: $f_x = \dfrac{y(x + z) - xy}{(x + z)^2} = \dfrac{yz}{(x + z)^2}$.'
    anki_seeds:
      - front: 'Definition of the partial derivative $f_x(a, b)$ as a limit?'
        back: '$f_x(a,b) = \lim_{h \to 0} \frac{f(a+h,\,b) - f(a,\,b)}{h}$ — differentiate in $x$ holding $y = b$ fixed.'
        type: basic
      - front: 'To compute $f_x$, treat {{c1::every other variable}} as a constant.'
        back: 'every other variable'
        type: cloze

  - id: estimating-partial-derivatives
    name: "Interpreting and Estimating Partial Derivatives"
    core: false                # interpretation / estimation leaf topic
    difficulty: 0.62
    drill: false
    answer_kind: numeric
    expected_time_secs: 120
    prerequisites:
      - id: first-order-partial-derivatives
        weight: 0.6
        key: true
      - id: functions-several-variables
        weight: 0.5
        key: true
      - id: estimating-derivatives
        weight: 0.4
        key: false
    knowledge_points:
      - id: kp1
        name: "Estimating partials from tables"
        key_prerequisites: [first-order-partial-derivatives, estimating-derivatives]
        exemplars:
          - problem: "A table of values gives f(1, 2) = 5 and f(1.4, 2) = 7. Find the estimate of f_x(1, 2) as an integer."
            answer: "5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Use a forward difference quotient with y fixed at 2. The estimate is f_x(1,2) approximately (7 - 5)/(1.4 - 1) = 2/0.4 = 5. The estimate is 5."
          - problem: "A table gives f(2.8, 4) = 6.2 and f(3.2, 4) = 7.0. Find the central-difference estimate of f_x(3, 4)."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Use a central difference quotient with y fixed at 4. The estimate is f_x(3,4) approximately (7.0 - 6.2)/(3.2 - 2.8) = 0.8/0.4 = 2. The estimate is 2."
          - problem: "A table of a function g gives g(5, 1) = 12.0 and g(5, 1.5) = 13.5. Find the estimate of g_y(5, 1) and give it as a decimal to one decimal place."
            answer: "3.0"
            answer_contract: {"decimals": 1, "kind": "approx"}
            solution_sketch: "Use a forward difference quotient with x fixed at 5. The estimate is g_y(5,1) approximately (13.5 - 12.0)/(1.5 - 1) = 1.5/0.5 = 3.0. The estimate is 3.0."
          - problem: "A table gives h(3, 7) = 9 and h(3, 6) = 11. Find the estimate of h_y(3, 7) from these entries."
            answer: "-2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Use a backward difference quotient with x fixed at 3. The estimate is h_y(3,7) approximately (9 - 11)/(7 - 6) = -2/1 = -2. The estimate is -2."
          - problem: "A table gives p(2, 5) = 8. The forward-difference estimate of p_x(2, 5) using p(2.2, 5) is 15. Find p(2.2, 5)."
            answer: "11"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Set the forward difference quotient equal to 15 with y fixed at 5. Solve 15 = (p(2.2,5) - 8)/(2.2 - 2) = (p(2.2,5) - 8)/0.2. Then p(2.2,5) - 8 = 3, so p(2.2,5) = 11. The value is 11."
          - problem: "The temperature T in a room is measured at two nearby points: T(3, 4) = 21.4 and T(3.5, 4) = 23.4. Find the estimate of T_x(3, 4) and give it as a decimal to one decimal place."
            answer: "4.0"
            answer_contract: {"decimals": 1, "kind": "approx"}
            solution_sketch: "Use a forward difference quotient with y fixed at 4. The estimate is T_x(3,4) approximately (23.4 - 21.4)/(3.5 - 3) = 2.0/0.5 = 4.0. The estimate is 4.0."
        constraints: "one variable changes at a time; difference quotients evaluate to one-decimal or integer answers"
      - id: kp2
        name: "Interpretation and signs from contour maps"
        key_prerequisites: [first-order-partial-derivatives, functions-several-variables]
        exemplars:
          - problem: "On a contour map of f, moving right from P you cross the level curve f = 20 at x = 1 and the level curve f = 50 at x = 4. State which variable is held fixed in f_x(P), and estimate f_x(P)."
            answer: "fixed = y; fx = 10"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["y"], ["x"]]}, "name": "fixed"}, {"contract": {"kind": "exact"}, "name": "fx"}]}
            solution_sketch: "By the definition of the partial derivative, f_x holds y fixed, so the fixed variable is y. The difference quotient along the horizontal line gives (50 - 20)/(4 - 1) = 10. The wrong option x confuses the variable that changes with the variable held fixed. The answer is fixed = y; fx = 10."
          - problem: "On a contour map of f, moving right from P you cross f = 40 at x = 2 and f = 10 at x = 5. State the sign of f_x(P), and estimate f_x(P)."
            answer: "sign = negative; fx = -10"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["negative"], ["positive"]]}, "name": "sign"}, {"contract": {"kind": "exact"}, "name": "fx"}]}
            solution_sketch: "The sign of f_x is the sign of the change in f as x increases while y is fixed. The difference quotient gives (10 - 40)/(5 - 2) = -10, so the sign is negative. The wrong option positive ignores that f drops from 40 to 10 as x increases. The answer is sign = negative; fx = -10."
          - problem: "Along the horizontal line through P, the contour f = 30 crosses at x = 1 and the contour f = 50 crosses at x = 5. Find f_x near P."
            answer: "5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The partial derivative f_x is estimated by the change in f divided by the change in x along a horizontal line, where y is fixed. The difference quotient is (50 - 30)/(5 - 1) = 5. The answer is 5."
          - problem: "Along the vertical line through P, the contour f = 20 crosses at y = 0 and the contour f = 50 crosses at y = 5. Find f_y near P."
            answer: "6"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The partial derivative f_y is estimated by the change in f divided by the change in y along a vertical line, where x is fixed. The difference quotient is (50 - 20)/(5 - 0) = 6. The answer is 6."
          - problem: "On a contour map of f, moving upward from P you cross f = 70 at y = 1 and f = 40 at y = 4. State the sign of f_y(P), and estimate f_y(P)."
            answer: "sign = negative; fy = -10"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["negative"], ["positive"]]}, "name": "sign"}, {"contract": {"kind": "exact"}, "name": "fy"}]}
            solution_sketch: "The sign of f_y is the sign of the change in f as y increases while x is fixed. The difference quotient gives (40 - 70)/(4 - 1) = -10, so the sign is negative. The wrong option positive ignores that f drops from 70 to 40 as y increases. The answer is sign = negative; fy = -10."
          - problem: "On a contour map of temperature T, moving upward from Q you cross the level curve T = 60 at y = 2 and the level curve T = 44 at y = 4. State which variable is held fixed in T_y(Q), and estimate T_y(Q)."
            answer: "fixed = x; Ty = -8"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["x"], ["y"]]}, "name": "fixed"}, {"contract": {"kind": "exact"}, "name": "Ty"}]}
            solution_sketch: "By the definition of the partial derivative, T_y holds x fixed, so the fixed variable is x. The difference quotient along the vertical line gives (44 - 60)/(4 - 2) = -8. The wrong option y confuses the variable that changes with the variable held fixed. The answer is fixed = x; Ty = -8."
        constraints: "contour levels differ by round numbers; interpretation answers must name the fixed variable"
    diagnostic_exemplar:
      problem: 'On a contour map of $f$, the level curve $f = 30$ crosses the horizontal line through $P$ at $x = 4$ and the level curve $f = 24$ crosses it at $x = 6$. Estimate $f_x$ near $P$, and say what its sign means.'
      answer: '$f_x \approx \dfrac{24 - 30}{6 - 4} = -3$; the sign is negative, so $f$ decreases as one moves in the $+x$ direction.'
      answer_contract: {kind: none}
      solution_sketch: 'Along the horizontal line only $x$ varies, so the difference quotient in $x$ estimates $f_x$.'
    anki_seeds:
      - front: 'Difference-quotient estimate of $f_x(a,b)$ from a table?'
        back: '$f_x(a,b) \approx \dfrac{f(a+h,\,b) - f(a,\,b)}{h}$ for a small tabulated step $h$.'
        type: basic
      - front: 'On a contour map, $f_x > 0$ at $P$ means that moving in the $+x$ direction you cross to {{c1::higher}} level curves.'
        back: 'higher'
        type: cloze

  - id: partial-derivatives-trig-exp
    name: "Partial Derivatives with the Chain Rule"
    core: true
    difficulty: 0.63
    drill: false
    answer_kind: numeric
    expected_time_secs: 120
    prerequisites:
      - id: first-order-partial-derivatives
        weight: 0.7
        key: true
      - id: chain-rule
        weight: 0.6
        key: true
      - id: derivatives-trig
        weight: 0.4
        key: false
      - id: derivatives-exp-log
        weight: 0.4
        key: false
    knowledge_points:
      - id: kp1
        name: "Exponentials and logarithms"
        key_prerequisites: [chain-rule, derivatives-exp-log]
        exemplars:
          - problem: "Let f(x, y) = e^(xy). Find f_x(2, 3)."
            answer: "3e^6"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Write f(x, y) = e^(xy). Holding y fixed, the chain rule gives f_x = y e^(xy). At (2, 3), f_x = 3 e^(6) = 3e^6."
          - problem: "Let f(x, y) = ln(x^2 + y^2). Find f_x(1, 2)."
            answer: "2/5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Write f(x, y) = ln(x^2 + y^2). The chain rule gives f_x = (1/(x^2 + y^2)) * 2x. At (1, 2), f_x = 2/5."
          - problem: "Let f(x, y) = e^(x^2 y). Find f_y(1, 3)."
            answer: "e^3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Write f(x, y) = e^(x^2 y). Holding x fixed, the chain rule gives f_y = x^2 e^(x^2 y). At (1, 3), f_y = e^3."
          - problem: "Let f(x, y) = ln(x + y^2). Find f_y(3, 1)."
            answer: "1/2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Write f(x, y) = ln(x + y^2). Holding x fixed, the chain rule gives f_y = 2y/(x + y^2). At (3, 1), f_y = 1/2."
          - problem: "Let f(x, y) = e^(2x + 3y). Find f_x(0, 1)."
            answer: "2e^3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Write f(x, y) = e^(2x + 3y). Holding y fixed, the chain rule gives f_x = 2 e^(2x + 3y). At (0, 1), f_x = 2e^3."
          - problem: "Let f(x, y) = ln(x^2 + y). Find f_x(2, 1)."
            answer: "4/5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Write f(x, y) = ln(x^2 + y). The chain rule gives f_x = 2x/(x^2 + y). At (2, 1), f_x = 4/5."
        constraints: "one composition layer; inner functions polynomial in x, y"
      - id: kp2
        name: "Trigonometric compositions"
        key_prerequisites: [chain-rule, derivatives-trig]
        exemplars:
          - problem: 'Let $f(x, y) = \sin(x^2 y)$. Find $f_x$.'
            answer: '$2xy \cos(x^2 y)$'
            solution_sketch: 'Chain rule with inner function $x^2 y$: $\cos(x^2 y) \cdot 2xy$.'
          - problem: 'Let $f(x, y) = \cos(x y^2)$. Find $f_y$.'
            answer: '$-2xy \sin(x y^2)$'
            solution_sketch: '$-\sin(xy^2) \cdot \frac{\partial}{\partial y}(xy^2) = -\sin(xy^2) \cdot 2xy$.'
          - problem: "Let f(x, y) = sin(x^3 y). Find f_x."
            answer: "3x^2 y cos(x^3 y)"
            answer_contract: {"kind": "function", "vars": ["x", "y"]}
            solution_sketch: "Use the chain rule for a trigonometric composition: f_x = cos(x^3 y) times the x-derivative of the inner monomial x^3 y. The inner x-derivative is 3x^2 y. Multiplying gives f_x = 3x^2 y cos(x^3 y)."
          - problem: "Let f(x, y) = cos(x y^3). Find f_y."
            answer: "-3x y^2 sin(x y^3)"
            answer_contract: {"kind": "function", "vars": ["x", "y"]}
            solution_sketch: "Use the chain rule for a cosine composition: f_y = -sin(x y^3) times the y-derivative of the inner monomial x y^3. The inner y-derivative is 3x y^2. Multiplying gives f_y = -3x y^2 sin(x y^3)."
          - problem: "Let f(x, y) = sin(x^2 y^2). Find f_y."
            answer: "2x^2 y cos(x^2 y^2)"
            answer_contract: {"kind": "function", "vars": ["x", "y"]}
            solution_sketch: "Use the chain rule for a sine composition: f_y = cos(x^2 y^2) times the y-derivative of the inner monomial x^2 y^2. The inner y-derivative is 2x^2 y. Multiplying gives f_y = 2x^2 y cos(x^2 y^2)."
          - problem: "Let f(x, y) = cos(x^3 y^2). Find f_x."
            answer: "-3x^2 y^2 sin(x^3 y^2)"
            answer_contract: {"kind": "function", "vars": ["x", "y"]}
            solution_sketch: "Use the chain rule for a cosine composition: f_x = -sin(x^3 y^2) times the x-derivative of the inner monomial x^3 y^2. The inner x-derivative is 3x^2 y^2. Multiplying gives f_x = -3x^2 y^2 sin(x^3 y^2)."
        constraints: "sin or cos of a monomial in x, y; one chain-rule layer"
      - id: kp3
        name: "Combined forms and evaluation"
        key_prerequisites: [first-order-partial-derivatives, chain-rule]
        exemplars:
          - problem: 'Let $f(x, y) = y e^{x^2}$. Compute $f_x(1, 2)$.'
            answer: '$4e$'
            solution_sketch: '$f_x = 2xy e^{x^2}$; at $(1, 2)$: $2 \cdot 1 \cdot 2 \cdot e = 4e$.'
          - problem: 'Let $f(x, y) = e^{2x} \cos(3y)$. Find $f_y$.'
            answer: '$-3e^{2x} \sin(3y)$'
          - problem: "Let f(x, y) = e^x sin(2y). Compute f_y(1, pi/6)."
            answer: "e"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The function is f(x, y) = e^x sin(2y). Differentiate with respect to y, holding x fixed: f_y = 2 e^x cos(2y). Substitute x = 1 and y = pi/6: f_y = 2 e cos(pi/3) = 2 e * (1/2) = e."
          - problem: "Let f(x, y) = e^y sin(3x). Compute f_x(0, 1)."
            answer: "3e"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The function is f(x, y) = e^y sin(3x). Differentiate with respect to x, holding y fixed: f_x = 3 e^y cos(3x). Substitute x = 0 and y = 1: f_x = 3 e cos(0) = 3e."
          - problem: "Let f(x, y) = x e^(2y) cos(x). Find f_y as a function of x and y."
            answer: "2x e^(2y) cos(x)"
            answer_contract: {"kind": "function", "vars": ["x", "y"]}
            solution_sketch: "The function is f(x, y) = x e^(2y) cos(x). Differentiate with respect to y, holding x fixed: the factor x cos(x) is constant, and the derivative of e^(2y) is 2 e^(2y). Multiply: f_y = 2x e^(2y) cos(x)."
          - problem: "Let f(x, y) = e^x sin(3y). Compute f_y(1, pi/3)."
            answer: "-3e"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The function is f(x, y) = e^x sin(3y). Differentiate with respect to y, holding x fixed: f_y = 3 e^x cos(3y). Substitute x = 1 and y = pi/3: f_y = 3 e cos(pi) = 3e(-1) = -3e."
        constraints: "products of an exponential and a trig or polynomial factor; evaluations at points giving exact multiples of e"
    diagnostic_exemplar:
      problem: 'Let $f(x, y) = e^{2x}\sin(3y)$. Compute $f_y(1, 0)$.'
      answer: '$3e^2$'
      solution_sketch: '$f_y = 3e^{2x}\cos(3y)$; at $(1, 0)$ this is $3e^2 \cdot 1 = 3e^2$.'
    anki_seeds:
      - front: '$\dfrac{\partial}{\partial x} e^{xy} = $ ?'
        back: '$y e^{xy}$ (chain rule; $y$ is a constant while differentiating in $x$).'
        type: basic
      - front: 'Strategy for partials of composite functions like $\sin(x^2 y)$?'
        back: 'Hold the other variable constant and apply the single-variable chain rule to the inner function.'
        type: basic

  - id: partial-derivatives
    name: "Higher-Order and Mixed Partial Derivatives"
    core: true
    difficulty: 0.66
    drill: false
    answer_kind: expression
    expected_time_secs: 130
    prerequisites:
      - id: first-order-partial-derivatives
        weight: 0.7
        key: true
      - id: partial-derivatives-trig-exp
        weight: 0.7
        key: true
    knowledge_points:
      - id: kp1
        name: "Second-order partials"
        key_prerequisites: [first-order-partial-derivatives]
        exemplars:
          - problem: 'Let $f(x, y) = x^3 y^2$. Compute $f_{xx}$ and $f_{yy}$; state the pair $(f_{xx}, f_{yy})$.'
            answer: '$(6x y^2,\ 2x^3)$'
            solution_sketch: '$f_x = 3x^2y^2 \Rightarrow f_{xx} = 6xy^2$; $f_y = 2x^3 y \Rightarrow f_{yy} = 2x^3$.'
          - problem: 'Let $f(x, y) = x^4 - 3x^2 y^3$. Compute $f_{xx}$ and $f_{yy}$; state the pair $(f_{xx}, f_{yy})$.'
            answer: '$(12x^2 - 6y^3,\ -18x^2 y)$'
          - problem: "Let f(x, y) = 2x^4 y + 3x y^5. Find f_xx as a function of x and y."
            answer: "24*x^2*y"
            answer_contract: {"kind": "function", "vars": ["x", "y"]}
            solution_sketch: "Start with f(x, y) = 2x^4 y + 3x y^5. Differentiate in x once using the power rule: f_x = 8x^3 y + 3y^5. Differentiate in x again: f_xx = 24*x^2*y. The answer is 24*x^2*y."
          - problem: "Let f(x, y) = x^6 - 2x^2 y^4. Find f_yy as a function of x and y."
            answer: "-24*x^2*y^2"
            answer_contract: {"kind": "function", "vars": ["x", "y"]}
            solution_sketch: "Start with f(x, y) = x^6 - 2x^2 y^4. Differentiate in y once using the power rule: f_y = -8x^2 y^3. Differentiate in y again: f_yy = -24*x^2*y^2. The answer is -24*x^2*y^2."
          - problem: "Let f(x, y) = 4x^5 y - x^2 y^4. Give f_xx and f_yy as functions of x and y."
            answer: "fxx = 80*x^3*y - 2*y^4; fyy = -12*x^2*y^2"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "function", "vars": ["x", "y"]}, "name": "fxx"}, {"contract": {"kind": "function", "vars": ["x", "y"]}, "name": "fyy"}]}
            solution_sketch: "Start with f(x, y) = 4x^5 y - x^2 y^4. Differentiate in x once: f_x = 20x^4 y - 2x y^4 by the power rule. Differentiate in x again: f_xx = 80*x^3*y - 2*y^4. Differentiate in y once: f_y = 4x^5 - 4x^2 y^3. Differentiate in y again: f_yy = -12*x^2*y^2. The answer is fxx = 80*x^3*y - 2*y^4; fyy = -12*x^2*y^2."
          - problem: "Let f(x, y) = 5x^2 y^4 - 2x^4 y^2 + 7. Find f_yy as a function of x and y."
            answer: "60*x^2*y^2 - 4*x^4"
            answer_contract: {"kind": "function", "vars": ["x", "y"]}
            solution_sketch: "Start with f(x, y) = 5x^2 y^4 - 2x^4 y^2 + 7. Differentiate in y once: f_y = 20x^2 y^3 - 4x^4 y by the power rule. Differentiate in y again: f_yy = 60*x^2*y^2 - 4*x^4. The answer is 60*x^2*y^2 - 4*x^4."
        constraints: "polynomials of total degree at most 6; differentiate twice in the same variable"
      - id: kp2
        name: "Mixed partials and Clairaut''s theorem"
        key_prerequisites: [first-order-partial-derivatives, partial-derivatives-trig-exp]
        exemplars:
          - problem: 'Let $f(x, y) = x^3 y^2$. Compute $f_{xy}$ and $f_{yx}$, verify they agree, and state their common value.'
            answer: '$6x^2 y$'
            solution_sketch: '$f_x = 3x^2 y^2 \Rightarrow f_{xy} = 6x^2 y$; $f_y = 2x^3 y \Rightarrow f_{yx} = 6x^2 y$. Equality is Clairaut''s theorem.'
          - problem: 'Let $f(x, y) = y \ln x$. Compute $f_{xy}$.'
            answer: '$1/x$'
            solution_sketch: '$f_x = \frac{y}{x}$, so $f_{xy} = \frac{1}{x}$; equivalently $f_y = \ln x$ gives $f_{yx} = \frac{1}{x}$.'
          - problem: "Let f(x, y) = x^3 y^4. Compute f_xy and f_yx, and give both results."
            answer: "fxy = 12x^2 y^3; fyx = 12x^2 y^3"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "function", "vars": ["x", "y"]}, "name": "fxy"}, {"contract": {"kind": "function", "vars": ["x", "y"]}, "name": "fyx"}]}
            solution_sketch: "First compute f_x = 3x^2 y^4 by the power rule in x. Then f_xy = 12x^2 y^3 by the power rule in y. Compute f_y = 4x^3 y^3 by the power rule in y, so f_yx = 12x^2 y^3 by the power rule in x. Clairaut's theorem applies because the function is smooth, so the mixed partials agree. The common value is fxy = 12x^2 y^3; fyx = 12x^2 y^3."
          - problem: "Let f(x, y) = e^(x) sin(y). Compute f_xy and f_yx, and give both results."
            answer: "fxy = e^(x) cos(y); fyx = e^(x) cos(y)"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "function", "vars": ["x", "y"]}, "name": "fxy"}, {"contract": {"kind": "function", "vars": ["x", "y"]}, "name": "fyx"}]}
            solution_sketch: "First compute f_x = e^(x) sin(y) by the exponential rule in x. Then f_xy = e^(x) cos(y) by the derivative of sin(y). Compute f_y = e^(x) cos(y) by the derivative of sin(y), so f_yx = e^(x) cos(y) by the exponential rule in x. Clairaut's theorem applies because the function is smooth, so the mixed partials agree. The common value is fxy = e^(x) cos(y); fyx = e^(x) cos(y)."
          - problem: "Let f(x, y) = x^2 cos(y). Compute f_xy and f_yx, and give both results."
            answer: "fxy = -2x sin(y); fyx = -2x sin(y)"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "function", "vars": ["x", "y"]}, "name": "fxy"}, {"contract": {"kind": "function", "vars": ["x", "y"]}, "name": "fyx"}]}
            solution_sketch: "First compute f_x = 2x cos(y) by the power rule in x. Then f_xy = -2x sin(y) by the derivative of cos(y). Compute f_y = -x^2 sin(y) by the derivative of cos(y), so f_yx = -2x sin(y) by the power rule in x. Clairaut's theorem applies because the function is smooth, so the mixed partials agree. The common value is fxy = -2x sin(y); fyx = -2x sin(y)."
          - problem: "Let f(x, y) = x^2 e^(y). Compute f_xy and f_yx, and give both results."
            answer: "fxy = 2x e^y; fyx = 2x e^y"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "function", "vars": ["x", "y"]}, "name": "fxy"}, {"contract": {"kind": "function", "vars": ["x", "y"]}, "name": "fyx"}]}
            solution_sketch: "First compute f_x = 2x e^y by the power rule in x. Then f_xy = 2x e^y by the exponential rule in y. Compute f_y = x^2 e^y by the exponential rule in y, so f_yx = 2x e^y by the power rule in x. Clairaut's theorem applies because the function is smooth, so the mixed partials agree. The common value is fxy = 2x e^y; fyx = 2x e^y."
        constraints: "smooth functions where mixed partials agree; always confirm both orders"
      - id: kp3
        name: "Third-order partials and verifying PDEs"
        key_prerequisites: [first-order-partial-derivatives, partial-derivatives-trig-exp]
        exemplars:
          - problem: 'Let $f(x, y) = e^x \sin y$. Compute $f_{xx} + f_{yy}$.'
            answer: "0"
            solution_sketch: '$f_{xx} = e^x \sin y$ and $f_{yy} = -e^x \sin y$, so the sum vanishes ($f$ is harmonic).'
          - problem: 'Let $f(x, y) = x^3 y^2$. Compute $f_{xxy}$.'
            answer: '$12xy$'
            solution_sketch: '$f_x = 3x^2y^2$, $f_{xx} = 6xy^2$, $f_{xxy} = 12xy$.'
          - problem: 'Verify that $u(x, t) = e^{-t} \sin x$ satisfies the heat equation $u_t = u_{xx}$ by computing $u_t - u_{xx}$.'
            answer: "0"
            solution_sketch: '$u_t = -e^{-t}\sin x$ and $u_{xx} = -e^{-t}\sin x$, so $u_t - u_{xx} = 0$ and the heat equation holds.'
          - problem: "Let $f(x, y) = x^3 y^3$. Compute $f_{xyy}$."
            answer: "18x^2y"
            answer_contract: {"kind": "function", "vars": ["x", "y"]}
            solution_sketch: "Start with f(x, y) = x^3 y^3. Differentiate in x by the power rule: f_x = 3x^2 y^3. Differentiate in y by the power rule: f_xy = 9x^2 y^2. Differentiate in y again by the power rule: f_xyy = 18x^2 y. The answer is 18x^2y."
          - problem: "Let $f(x, y) = x^2 y^4$. Compute $f_{yyx}$."
            answer: "24xy^2"
            answer_contract: {"kind": "function", "vars": ["x", "y"]}
            solution_sketch: "Start with f(x, y) = x^2 y^4. Differentiate in y by the power rule: f_y = 4x^2 y^3. Differentiate in y again by the power rule: f_yy = 12x^2 y^2. Differentiate in x by the power rule: f_yyx = 24x y^2. The answer is 24xy^2."
          - problem: "Let $f(x, y) = e^{2x} cos(2y)$. State which class $f$ belongs to and give $f_{xx} + f_{yy}$."
            answer: "verdict = harmonic; value = 0"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["harmonic"], ["nonharmonic"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "value"}]}
            solution_sketch: "Start with f(x, y) = e^{2x} cos(2y). The x-partials: f_x = 2e^{2x} cos(2y) and f_xx = 4e^{2x} cos(2y) by the chain rule. The y-partials: f_y = -2e^{2x} sin(2y) and f_yy = -4e^{2x} cos(2y) by the chain rule. The sum f_xx + f_yy = 4e^{2x} cos(2y) - 4e^{2x} cos(2y) = 0, so f is harmonic. The wrong option nonharmonic comes from missing the negative sign in f_yy. The answer is verdict = harmonic; value = 0."
        constraints: "at most third order; PDE checks limited to the Laplace and heat equations with single-term solutions"
    diagnostic_exemplar:
      problem: 'Let $f(x, y) = x^4 y^3$. Compute $f_{xxy}$.'
      answer: '$36x^2y^2$'
      solution_sketch: '$f_x = 4x^3y^3$, $f_{xx} = 12x^2y^3$, $f_{xxy} = 36x^2y^2$.'
    anki_seeds:
      - front: 'Clairaut''s theorem says that when $f_{xy}$ and $f_{yx}$ are continuous, they are...'
        back: 'equal: $f_{xy} = f_{yx}$.'
        type: basic
      - front: 'The subscript notation $f_{xy}$ means differentiate first in {{c1::$x$}}, then in {{c2::$y$}} — i.e. $(f_x)_y = \frac{\partial^2 f}{\partial y \partial x}$.'
        back: '$x$ first, then $y$'
        type: cloze

  - id: tangent-planes-linear-approximation
    name: "Tangent Planes and Linear Approximation"
    core: true
    difficulty: 0.70
    drill: false
    answer_kind: numeric
    expected_time_secs: 150
    prerequisites:
      - id: partial-derivatives
        weight: 0.8
        key: true
      - id: planes-in-space
        weight: 0.5
        key: true
    knowledge_points:
