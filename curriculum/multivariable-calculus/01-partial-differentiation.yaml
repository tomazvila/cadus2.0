        key_prerequisites: [partial-derivatives, planes-in-space]
        exemplars:
          - problem: 'Find the tangent plane to $z = x^2 + y^2$ at the point $(1, 2, 5)$.'
            answer: '$z = 2x + 4y - 5$'
            solution_sketch: '$f_x(1,2) = 2$, $f_y(1,2) = 4$; $z = 5 + 2(x-1) + 4(y-2)$.'
          - problem: 'Find the tangent plane to $z = xy$ at the point $(2, 3, 6)$.'
            answer: '$z = 3x + 2y - 6$'
            solution_sketch: '$f_x = y = 3$, $f_y = x = 2$ at the point; $z = 6 + 3(x-2) + 2(y-3)$.'
          - problem: 'Find the tangent plane to $z = y e^x$ at the point $(0, 2, 2)$.'
            answer: '$z = 2x + y$'
            solution_sketch: '$f_x = y e^x = 2$ and $f_y = e^x = 1$ at $(0,2)$; $z = 2 + 2x + (y - 2)$.'
          - problem: "Find the tangent plane to z = x^2 + 3y^2 at the point (2, 1, 7). Give the answer as an expression for z in the form ax + by + c."
            answer: "4x+6y-7"
            answer_contract: {"kind": "function", "vars": ["x", "y"]}
            solution_sketch: "The surface is z = x^2 + 3y^2 and f(2,1) = 7. By the partial derivative rule, fx = 2x so fx(2,1) = 4, and fy = 6y so fy(2,1) = 6. The tangent plane formula gives z = 7 + 4(x - 2) + 6(y - 1), which simplifies to 4x + 6y - 7."
          - problem: "Find the tangent plane to z = 2x^2 - y^2 at the point (2, 1, 7). Give the answer as an expression for z in the form ax + by + c."
            answer: "8x-2y-7"
            answer_contract: {"kind": "function", "vars": ["x", "y"]}
            solution_sketch: "The surface is z = 2x^2 - y^2 and f(2,1) = 7. By the partial derivative rule, fx = 4x so fx(2,1) = 8, and fy = -2y so fy(2,1) = -2. The tangent plane formula gives z = 7 + 8(x - 2) - 2(y - 1), which simplifies to 8x - 2y - 7."
          - problem: "Find the tangent plane to z = x e^y at the point (2, 0, 2). Give the answer as an expression for z in the form ax + by + c."
            answer: "x+2y"
            answer_contract: {"kind": "function", "vars": ["x", "y"]}
            solution_sketch: "The surface is z = x e^y and f(2,0) = 2. By the partial derivative rule, fx = e^y so fx(2,0) = 1, and fy = x e^y so fy(2,0) = 2. The tangent plane formula gives z = 2 + 1(x - 2) + 2(y - 0), which simplifies to x + 2y."
        constraints: "integer base points; partials evaluate to small integers"
      - id: kp2
        name: "Linearization and estimates"
        key_prerequisites: [partial-derivatives]
        exemplars:
          - problem: "Use the linearization of f(x, y) = sqrt(x^2 + y^2) at (5, 12) to estimate f(5.1, 11.9). Give the answer to 3 decimals."
            answer: "12.946"
            answer_contract: {"decimals": 3, "kind": "approx"}
            solution_sketch: "By partial differentiation, for f(x, y) = sqrt(x^2 + y^2), fx = x / sqrt(x^2 + y^2) and fy = y / sqrt(x^2 + y^2). At (5, 12), f = 13, fx = 5/13, and fy = 12/13, so the linearization formula gives L(x, y) = 13 + (5/13)(x - 5) + (12/13)(y - 12). At (5.1, 11.9), L = 13 + (5/13)(0.1) + (12/13)(-0.1) = 12.946153..., which rounds to 12.946."
          - problem: "Use the linearization of f(x, y) = x y^2 at (1, 2) to estimate f(1.1, 1.9). Give the answer to 3 decimals."
            answer: "4.000"
            answer_contract: {"decimals": 3, "kind": "approx"}
            solution_sketch: "By partial differentiation, for f(x, y) = x y^2, fx = y^2 and fy = 2xy. At (1, 2), f = 4, fx = 4, and fy = 4, so the linearization formula gives L(x, y) = 4 + 4(x - 1) + 4(y - 2). At (1.1, 1.9), L = 4 + 4(0.1) + 4(-0.1) = 4.000."
          - problem: "Use the linearization of f(x, y) = e^(x + 2y) at (0, 0) to estimate f(0.02, -0.01). Give the answer to 2 decimals."
            answer: "1.00"
            answer_contract: {"decimals": 2, "kind": "approx"}
            solution_sketch: "By partial differentiation, for f(x, y) = e^(x + 2y), fx = e^(x + 2y) and fy = 2e^(x + 2y). At (0, 0), f = 1, fx = 1, and fy = 2, so the linearization formula gives L(x, y) = 1 + x + 2y. At (0.02, -0.01), L = 1 + 0.02 + 2(-0.01) = 1.00."
          - problem: "The area of a rectangle is A(x, y) = x y. Use the linearization of A at (10, 20) to estimate A(10.1, 19.8). Give the answer to 2 decimals."
            answer: "200.00"
            answer_contract: {"decimals": 2, "kind": "approx"}
            solution_sketch: "By partial differentiation, for A(x, y) = x y, Ax = y and Ay = x. At (10, 20), A = 200, Ax = 20, and Ay = 10, so the linearization formula gives L(x, y) = 200 + 20(x - 10) + 10(y - 20). At (10.1, 19.8), L = 200 + 20(0.1) + 10(-0.2) = 200.00."
          - problem: "Use the linearization of f(x, y) = x^3 y at (1, 2) to estimate f(1.02, 2.03). Give the answer to 2 decimals."
            answer: "2.15"
            answer_contract: {"decimals": 2, "kind": "approx"}
            solution_sketch: "By partial differentiation, for f(x, y) = x^3 y, fx = 3x^2 y and fy = x^3. At (1, 2), f = 2, fx = 6, and fy = 1, so the linearization formula gives L(x, y) = 2 + 6(x - 1) + (y - 2). At (1.02, 2.03), L = 2 + 6(0.02) + 1(0.03) = 2.15."
          - problem: "Use the linearization of f(x, y) = x / y at (2, 1) to estimate f(2.1, 0.9). Give the estimate as a fraction."
            answer: "23/10"
            answer_contract: {"kind": "exact"}
            solution_sketch: "By partial differentiation, for f(x, y) = x / y, fx = 1 / y and fy = -x / y^2. At (2, 1), f = 2, fx = 1, and fy = -2, so the linearization formula gives L(x, y) = 2 + (x - 2) - 2(y - 1). At (2.1, 0.9), L = 2 + (0.1) - 2(-0.1) = 2.3 = 23/10."
        constraints: "base points where f and its partials are exact rationals; estimates stay within 0.05 of the true value"
    diagnostic_exemplar:
      problem: 'Use the linearization of $f(x, y) = x^2 y$ at $(2, 3)$ to estimate $f(2.1, 2.9)$.'
      answer: '$12.8$'
      solution_sketch: '$f(2,3) = 12$, $f_x = 2xy = 12$, $f_y = x^2 = 4$, so $L(x,y) = 12 + 12(x-2) + 4(y-3)$ and $L(2.1, 2.9) = 12 + 1.2 - 0.4 = 12.8$.'
    anki_seeds:
      - front: 'Tangent plane to $z = f(x,y)$ at $(a, b, f(a,b))$?'
        back: '$z = f(a,b) + f_x(a,b)(x-a) + f_y(a,b)(y-b)$'
        type: basic
      - front: 'Linearization $L(x, y)$ of $f$ at $(a, b)$?'
        back: '$L(x,y) = f(a,b) + f_x(a,b)(x-a) + f_y(a,b)(y-b)$ — the tangent plane used as an approximation.'
        type: basic

  - id: differentials-error-estimation
    name: "Differentials and Error Estimation"
    core: false                # error-estimation application; terminal
    difficulty: 0.72
    drill: false
    answer_kind: numeric
    expected_time_secs: 180
    prerequisites:
      - id: tangent-planes-linear-approximation
        weight: 0.7
        key: true
      - id: differentials-error-propagation
        weight: 0.4
        key: false
    knowledge_points:
      - id: kp1
        name: "The total differential"
        key_prerequisites: [tangent-planes-linear-approximation]
        exemplars:
          - problem: "For z = x^2 y^3, use the total differential to estimate the change dz when x changes from 2 to 2.1 and y changes from 1 to 0.9. Give the answer to 1 decimal."
            answer: "-0.8"
            answer_contract: {"decimals": 1, "kind": "approx"}
            solution_sketch: "Step 1: Write the total differential: dz = 2xy^3 dx + 3x^2 y^2 dy. Step 2: At (2, 1), the coefficients are 4 and 12. Step 3: Substitute dx = 0.1 and dy = -0.1: dz = 4(0.1) + 12(-0.1) = 0.4 - 1.2. The value is -0.8."
          - problem: "For w = x^2 + y^2 + z^2, find the total differential dw at (2, 1, 1) when dx = 0.1, dy = -0.1, and dz = 0.1. Give the answer to 1 decimal."
            answer: "0.4"
            answer_contract: {"decimals": 1, "kind": "approx"}
            solution_sketch: "Step 1: Write the total differential: dw = 2x dx + 2y dy + 2z dz. Step 2: At (2, 1, 1), the coefficients are 4, 2, and 2. Step 3: Substitute dx = 0.1, dy = -0.1, and dz = 0.1: dw = 4(0.1) + 2(-0.1) + 2(0.1). The value is 0.4."
          - problem: "For r = sqrt(x^2 + y^2), use the total differential to estimate dr at (3, 4) when dx = 0.1 and dy = 0.1. Give the answer to 2 decimals."
            answer: "0.14"
            answer_contract: {"decimals": 2, "kind": "approx"}
            solution_sketch: "Step 1: Write the total differential: dr = (x/r) dx + (y/r) dy with r = sqrt(x^2 + y^2). Step 2: At (3, 4), r = 5, so the coefficients are 3/5 and 4/5. Step 3: Substitute dx = 0.1 and dy = 0.1: dr = 0.6(0.1) + 0.8(0.1). The value is 0.14."
          - problem: "A quantity is modeled by z = x^2 y. Find the total differential dz at (2, 3) when dx = 0.1 and dy = -0.1. Give the answer to 1 decimal."
            answer: "0.8"
            answer_contract: {"decimals": 1, "kind": "approx"}
            solution_sketch: "Step 1: Write the total differential: dz = 2xy dx + x^2 dy. Step 2: At (2, 3), the coefficients are 12 and 4. Step 3: Substitute dx = 0.1 and dy = -0.1: dz = 12(0.1) + 4(-0.1). The value is 0.8."
          - problem: "For f(x, y) = x^3 + y^3, the total differential at (2, 1) is df = A dx + B dy. Find A + B."
            answer: "15"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: Write the total differential: df = 3x^2 dx + 3y^2 dy. Step 2: At (2, 1), A = 12 and B = 3. Step 3: Add the coefficients: 12 + 3 = 15. The value is 15."
          - problem: "For s = sqrt(x + y), find the total differential ds at (3, 1) when dx = 0.2 and dy = 0.1. Give the answer to 2 decimals."
            answer: "0.08"
            answer_contract: {"decimals": 2, "kind": "approx"}
            solution_sketch: "Step 1: Write the total differential: ds = (1/(2 sqrt(x + y))) dx + (1/(2 sqrt(x + y))) dy. Step 2: At (3, 1), sqrt(4) = 2, so each coefficient is 1/4. Step 3: Substitute dx = 0.2 and dy = 0.1: ds = 0.25(0.2) + 0.25(0.1) = 0.05 + 0.025. The value is 0.08."
        constraints: "polynomial or single-radical functions; numeric evaluations use one-decimal increments"
      - id: kp2
        name: "Error estimation"
        key_prerequisites: [tangent-planes-linear-approximation]
        exemplars:
          - problem: "A rectangular block has measured edge lengths 5 cm, 8 cm, and 4 cm. Each edge may be off by as much as 0.05 cm. Use differentials to estimate the greatest possible error in the volume V = xyz. Give the answer as a decimal to 1 place."
            answer: "4.6"
            answer_contract: {"decimals": 1, "kind": "approx"}
            solution_sketch: "Step 1: The differential rule for V = xyz gives dV = yz dx + xz dy + xy dz. Step 2: At x = 5, y = 8, and z = 4 the coefficients are yz = 32, xz = 20, and xy = 40, so dV = (32 + 20 + 40)(0.05) = 92(0.05). Step 3: The product is 4.6. The greatest possible error in the volume is 4.6."
          - problem: "The radius and the height of a cylinder are measured with relative errors of 2 percent and 0.5 percent. Use differentials to estimate the greatest possible relative error in the volume V = pi r^2 h. Give the relative error as a decimal to 3 places."
            answer: "0.045"
            answer_contract: {"decimals": 3, "kind": "approx"}
            solution_sketch: "Step 1: For V = pi r^2 h take logarithms, and ln(V) = ln(pi) + 2 ln(r) + ln(h). Step 2: The logarithmic differential rule gives dV/V = 2 dr/r + dh/h, and the greatest error adds the magnitudes, so dV/V = 2(0.02) + 0.005. Step 3: The sum is 0.045. The greatest possible relative error is 0.045."
          - problem: "A triangle has base 24 cm and height 10 cm. The base may be off by 0.06 cm and the height by 0.05 cm. Use differentials to estimate the greatest possible error in the area A = (1/2) b h. Give the answer as a decimal to 1 place."
            answer: "0.9"
            answer_contract: {"decimals": 1, "kind": "approx"}
            solution_sketch: "Step 1: The differential rule for A = (1/2) b h gives dA = (1/2)(h db + b dh). Step 2: At b = 24 and h = 10, dA = (1/2)(10(0.06) + 24(0.05)) = (1/2)(0.6 + 1.2). Step 3: The sum is 0.9. The greatest possible error in the area is 0.9."
          - problem: "The mass of a cart is measured with a relative error of 0.5 percent, and its speed with a relative error of 1.5 percent. Use differentials to estimate the greatest possible relative error in the computed kinetic energy E = (1/2) m v^2. Give the relative error as a decimal to 3 places."
            answer: "0.035"
            answer_contract: {"decimals": 3, "kind": "approx"}
            solution_sketch: "Step 1: Take logarithms of E = (1/2) m v^2, so ln(E) = ln(1/2) + ln(m) + 2 ln(v). Step 2: The logarithmic differential rule gives dE/E = dm/m + 2 dv/v, and the greatest error adds the magnitudes: 0.005 + 2(0.015). Step 3: The sum is 0.035. The greatest possible relative error is 0.035."
          - problem: "A quantity is modeled by f(x, y) = x^2 y and is evaluated at x = 5, y = 2. The error in each variable is at most 0.05. Use differentials to estimate the greatest possible error in f. Give the answer as a decimal to 2 places."
            answer: "2.25"
            answer_contract: {"decimals": 2, "kind": "approx"}
            solution_sketch: "Step 1: The differential rule for f = x^2 y gives df = 2xy dx + x^2 dy. Step 2: At x = 5 and y = 2, df = 2(5)(2)(0.05) + 25(0.05) = 1 + 1.25. Step 3: The sum is 2.25. The greatest possible error in f is 2.25."
          - problem: "A cone has measured radius 3 cm and height 7 cm. The radius may be off by 0.05 cm and the height by 0.06 cm. Use pi = 3.14 and differentials to estimate the greatest possible error in the volume V = (1/3) pi r^2 h. Give the answer as a decimal to 4 places."
            answer: "2.7632"
            answer_contract: {"decimals": 4, "kind": "approx"}
            solution_sketch: "Step 1: The differential rule for V = (1/3) pi r^2 h gives dV = (1/3) pi (2 r h dr + r^2 dh). Step 2: With pi = 3.14, r = 3, h = 7, dr = 0.05, and dh = 0.06, the bracket is 2(3)(7)(0.05) + 9(0.06) = 2.1 + 0.54 = 2.64, and dV = (1/3)(3.14)(2.64). Step 3: The product is 2.7632. The greatest possible error in the volume is 2.7632."
        constraints: "measurement errors of 0.05-0.1 units or 0.5-2 percent; answers exact decimals or percents"
    diagnostic_exemplar:
      problem: 'A rectangular box is measured as $20 \times 10 \times 5$ cm, each dimension with a maximum error of $0.1$ cm. Use differentials to estimate the maximum error in the computed volume $V = xyz$.'
      answer: '$35$ cm$^3$'
      answer_contract: {kind: none}
      solution_sketch: '$dV = yz\,dx + xz\,dy + xy\,dz = (50 + 100 + 200)(0.1) = 35$.'
    anki_seeds:
      - front: 'Total differential of $z = f(x, y)$?'
        back: '$dz = f_x\, dx + f_y\, dy$'
        type: basic
      - front: 'Estimating maximum error with differentials: combine each term with...'
        back: 'the worst-case (same) sign: $|dz| \le |f_x||dx| + |f_y||dy|$.'
        type: basic

  - id: chain-rule-one-parameter
    name: "Chain Rule Along a Curve"
    core: true
    difficulty: 0.70
    drill: false
    answer_kind: numeric
    expected_time_secs: 150
    prerequisites:
      - id: partial-derivatives
        weight: 0.7
        key: true
      - id: chain-rule
        weight: 0.5
        key: true
      - id: parametric-equations
        weight: 0.3
        key: false
    knowledge_points:
      - id: kp1
        name: "The one-parameter chain rule"
        key_prerequisites: [partial-derivatives, chain-rule]
        exemplars:
          - problem: 'Let $z = x^2 y$ with $x = t^2$, $y = t^3$. Use the chain rule to find $\frac{dz}{dt}$, and simplify.'
            answer: '$7t^6$'
            solution_sketch: '$\frac{dz}{dt} = 2xy \cdot 2t + x^2 \cdot 3t^2 = 4t^6 + 3t^6 = 7t^6$. Check: $z = t^7$ directly.'
          - problem: 'Let $w = xy + z^2$ with $x = e^t$, $y = e^{-t}$, $z = t$. Find $\frac{dw}{dt}$.'
            answer: '$2t$'
            solution_sketch: '$\frac{dw}{dt} = y e^t + x(-e^{-t}) + 2z = 1 - 1 + 2t = 2t$. Check: $w = 1 + t^2$.'
          - problem: "Let $z = x y^2$ with $x = t$ and $y = t^2$. Find $\\frac{dz}{dt}$ as a function of $t$ using the chain rule, and simplify."
            answer: "5t^4"
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: "Write the chain rule: $\\frac{dz}{dt} = \\frac{\\partial z}{\\partial x}\\frac{dx}{dt} + \\frac{\\partial z}{\\partial y}\\frac{dy}{dt}$. Here $\\frac{\\partial z}{\\partial x} = y^2$ and $\\frac{\\partial z}{\\partial y} = 2xy$. The inner rates are $\\frac{dx}{dt} = 1$ and $\\frac{dy}{dt} = 2t$. Multiply and add: $y^2 \\cdot 1 + 2xy \\cdot 2t = t^4 + 4t^4 = 5t^4$. The derivative is 5t^4."
          - problem: "Let $z = x^2 + 2xy$ with $x = t^2$ and $y = t$. Find $\\frac{dz}{dt}$ when $t = 2$ using the chain rule."
            answer: "56"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Chain rule: $\\frac{dz}{dt} = (2x + 2y)\\frac{dx}{dt} + (2x)\\frac{dy}{dt}$. With $x = t^2$ and $y = t$, $\\frac{dx}{dt} = 2t$ and $\\frac{dy}{dt} = 1$. So $\\frac{dz}{dt} = (2t^2 + 2t)(2t) + (2t^2)(1) = 4t^3 + 6t^2$. At $t = 2$: $4(8) + 6(4) = 32 + 24 = 56$. The value is 56."
          - problem: "Let $z = x^2 + y^2$ with $x = t^2$ and $y = 3t$. Find $\\frac{dz}{dt}$ as a function of $t$ using the chain rule."
            answer: "4t^3+18t"
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: "Chain rule: $\\frac{dz}{dt} = 2x\\frac{dx}{dt} + 2y\\frac{dy}{dt}$. The inner rates are $\\frac{dx}{dt} = 2t$ and $\\frac{dy}{dt} = 3$. Substitute $x = t^2$, $y = 3t$: $2t^2 \\cdot 2t + 2(3t) \\cdot 3 = 4t^3 + 18t$. The derivative is 4t^3+18t."
          - problem: "Let $z = x \\sin(y)$ with $x = t^3$ and $y = t$. Find $\\frac{dz}{dt}$ as a function of $t$ using the chain rule."
            answer: "3t^2 sin(t)+t^3 cos(t)"
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: "Write $z = x\\sin(y)$. The chain rule gives $\\frac{dz}{dt} = \\sin(y)\\frac{dx}{dt} + x\\cos(y)\\frac{dy}{dt}$. Here $x = t^3$, $y = t$, so $\\frac{dx}{dt} = 3t^2$ and $\\frac{dy}{dt} = 1$. Substitute: $\\sin(t) \\cdot 3t^2 + t^3\\cos(t) \\cdot 1 = 3t^2\\sin(t) + t^3\\cos(t)$. The derivative is 3t^2 sin(t)+t^3 cos(t)."
        constraints: "compositions collapse to a clean single-variable check; require the chain-rule computation, not just substitution"
      - id: kp2
        name: "Rates along a moving point"
        key_prerequisites: [partial-derivatives, chain-rule]
        exemplars:
          - problem: "Let z = x^2 + y^2. At the point (3, 4) a particle has dx/dt = 4 and dy/dt = -3. Find dz/dt at that instant."
            answer: "0"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The chain rule gives dz/dt = z_x dx/dt + z_y dy/dt. At (3, 4), z_x = 2x = 6 and z_y = 2y = 8. The velocity (4, -3) is tangent to the level curve x^2 + y^2 = 25, so dz/dt = (6)(4) + (8)(-3) = 0. The rate is 0."
          - problem: "The temperature at (x, y) is T = x y^2. A bug at (2, 3) moves with dx/dt = -1 and dy/dt = 4. Find the rate of change of the temperature at that instant."
            answer: "39"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The chain rule gives dT/dt = T_x dx/dt + T_y dy/dt. At (2, 3), T_x = y^2 = 9 and T_y = 2xy = 12. Substitute the velocities: dT/dt = (9)(-1) + (12)(4) = -9 + 48. The rate of change of the temperature is 39."
          - problem: "Let z = x^3 y. A moving point at (2, 1) has dx/dt = 1 and dy/dt = 2. Find dz/dt at that instant."
            answer: "28"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The chain rule gives dz/dt = z_x dx/dt + z_y dy/dt. At (2, 1), z_x = 3x^2 y = 12 and z_y = x^3 = 8. Substitute the velocities: dz/dt = (12)(1) + (8)(2) = 12 + 16. The value of dz/dt is 28."
          - problem: "Let z = e^(x) sin(y). At the point (0, pi/2) the velocity is dx/dt = 2 and dy/dt = 3. Find dz/dt there."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The chain rule gives dz/dt = z_x dx/dt + z_y dy/dt. At (0, pi/2), z_x = e^(x) sin(y) = 1 and z_y = e^(x) cos(y) = 0. Substitute the velocities: dz/dt = (1)(2) + (0)(3) = 2. The rate is 2."
          - problem: "Let z = x^2 - y^2. A point at (3, -2) has dx/dt = 2 and dy/dt = 3. Find dz/dt at that instant."
            answer: "24"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The chain rule gives dz/dt = z_x dx/dt + z_y dy/dt. At (3, -2), z_x = 2x = 6 and z_y = -2y = 4. Substitute the velocities: dz/dt = (6)(2) + (4)(3) = 12 + 12. The value of dz/dt is 24."
          - problem: "Let z = x y. At the point (2, 3) a particle moves with dx/dt = 3 and dy/dt = -2. Find dz/dt at that instant."
            answer: "5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The chain rule gives dz/dt = z_x dx/dt + z_y dy/dt. At (2, 3), z_x = y = 3 and z_y = x = 2. Substitute the velocities: dz/dt = (3)(3) + (2)(-2) = 9 - 4. The rate is 5."
        constraints: "evaluation at a specific instant with integer partials and velocities; include one level-curve (zero-rate) case"
    diagnostic_exemplar:
      problem: 'The temperature at $(x, y)$ is $T(x, y) = x^2 y$. A particle passing through $(3, 2)$ has $\frac{dx}{dt} = -1$ and $\frac{dy}{dt} = 4$. How fast is the temperature at the particle changing?'
      answer: '$24$ degrees per unit time.'
      answer_contract: {kind: none}
      solution_sketch: '$\frac{dT}{dt} = T_x \frac{dx}{dt} + T_y \frac{dy}{dt} = 2xy(-1) + x^2(4) = 12(-1) + 9(4) = 24$.'
    anki_seeds:
      - front: 'Chain rule for $z = f(x, y)$, $x = x(t)$, $y = y(t)$?'
        back: '$\frac{dz}{dt} = \frac{\partial z}{\partial x}\frac{dx}{dt} + \frac{\partial z}{\partial y}\frac{dy}{dt}$'
        type: basic
      - front: 'If a point moves along a level curve of $f$, then $\frac{df}{dt} = $ {{c1::$0$}}.'
        back: '$0$'
        type: cloze

  - id: multivariable-chain-rule
    name: "The Multivariable Chain Rule"
    core: true
    difficulty: 0.75
    drill: false
    answer_kind: numeric
    expected_time_secs: 180
    prerequisites:
      - id: chain-rule-one-parameter
        weight: 0.8
        key: true
      - id: implicit-differentiation
        weight: 0.5
        key: false
      - id: partial-derivatives
        weight: 0.4
        key: false
    knowledge_points:
      - id: kp1
        name: "Chain rule with two independent variables"
        key_prerequisites: [chain-rule-one-parameter, partial-derivatives]
        exemplars:
          - problem: 'Let $z = x^2 + xy$ with $x = s + t$, $y = s - t$. Find $\frac{\partial z}{\partial s}$ in terms of $s$ and $t$.'
            answer: '$4s + 2t$'
            solution_sketch: '$\frac{\partial z}{\partial s} = (2x + y)(1) + x(1) = 3x + y = 3(s+t) + (s-t) = 4s + 2t$.'
          - problem: 'Let $z = e^x \sin y$ with $x = st^2$, $y = s^2 t$. Find $\frac{\partial z}{\partial t}$.'
            answer: '$e^{st^2}\left(2st \sin(s^2 t) + s^2 \cos(s^2 t)\right)$'
            solution_sketch: '$\frac{\partial z}{\partial t} = e^x \sin y \cdot 2st + e^x \cos y \cdot s^2$; substitute $x = st^2$, $y = s^2 t$.'
          - problem: "Let z = x^2 y + y^2 with x = 3s + t and y = s - 2t. Find ∂z/∂s at (s, t) = (1, 2)."
            answer: "-71"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Chain rule for two intermediates: ∂z/∂s = ∂z/∂x ∂x/∂s + ∂z/∂y ∂y/∂s. The partial derivatives are ∂z/∂x = 2xy, ∂z/∂y = x^2 + 2y, ∂x/∂s = 3, and ∂y/∂s = 1. At (s, t) = (1, 2), x = 5 and y = -3. Substitute: 6(5)(-3) + (25 + 2(-3)) = -90 + 19 = -71. The value is -71."
          - problem: "Let z = x^3 + x y^2 with x = s - t and y = 2s + t. Find ∂z/∂t at (s, t) = (1, 1)."
            answer: "-9"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Chain rule: ∂z/∂t = ∂z/∂x ∂x/∂t + ∂z/∂y ∂y/∂t. The partial derivatives are ∂z/∂x = 3x^2 + y^2 and ∂z/∂y = 2xy, while ∂x/∂t = -1 and ∂y/∂t = 1. At (s, t) = (1, 1), x = 0 and y = 3. Substitute: (0 + 9)(-1) + (0)(1) = -9. The value is -9."
          - problem: "Let z = x^2 y with x = s t and y = s^2 + t. Find ∂z/∂s as a function of s and t."
            answer: "4s^3t^2+2st^3"
            answer_contract: {"kind": "function", "vars": ["s", "t"]}
            solution_sketch: "Chain rule: ∂z/∂s = ∂z/∂x ∂x/∂s + ∂z/∂y ∂y/∂s. The partial derivatives are ∂z/∂x = 2xy and ∂z/∂y = x^2, with ∂x/∂s = t and ∂y/∂s = 2s. Substitute x = st and y = s^2 + t: 2(st)(s^2 + t)t + (s^2 t^2)(2s). Simplify to 4s^3t^2 + 2s t^3. So ∂z/∂s = 4s^3t^2+2st^3."
          - problem: "Let z = x^3 y^2 + x with x = s + 2t and y = 2s - t. Find ∂z/∂t at (s, t) = (2, 1)."
            answer: "482"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Chain rule: ∂z/∂t = ∂z/∂x ∂x/∂t + ∂z/∂y ∂y/∂t. The partial derivatives are ∂z/∂x = 3x^2 y^2 + 1 and ∂z/∂y = 2x^3 y, while ∂x/∂t = 2 and ∂y/∂t = -1. At (s, t) = (2, 1), x = 4 and y = 3. Substitute: (3(16)(9) + 1)(2) + (2(64)(3))(-1) = 866 - 384 = 482. The value is 482."
        constraints: "two intermediate and two independent variables; draw or imply the dependency tree"
      - id: kp2
        name: "Tree diagrams and the general version"
        key_prerequisites: [chain-rule-one-parameter, partial-derivatives]
        exemplars:
          - problem: 'Let $u = x^2 y^3$ with $x = s t^2$, $y = s^2 t$. Find $\frac{\partial u}{\partial s}$, and verify by substituting first.'
            answer: '$8 s^7 t^7$'
            solution_sketch: '$\frac{\partial u}{\partial s} = 2xy^3 \cdot t^2 + 3x^2y^2 \cdot 2st$; with $x = st^2$, $y = s^2t$ both terms combine to $2s^7t^7 + 6s^7t^7$. Check: $u = s^8 t^7$.'
          - problem: "Let z = f(x, y) with x = g(s, t), y = h(s, t). At (s, t) = (1, 2), g(1, 2) = 3, h(1, 2) = 4, g_s(1, 2) = -1, h_s(1, 2) = 6, f_x(3, 4) = 5, f_y(3, 4) = 2. Find the value of z_s at (1, 2)."
            answer: "7"
            answer_contract: {"kind": "exact"}
            solution_sketch: "By the multivariable chain rule, z_s = f_x g_s + f_y h_s along the tree with branches x and y. At (s, t) = (1, 2), the inner values are x = 3 and y = 4, so f_x = 5 and f_y = 2, while g_s = -1 and h_s = 6. Each branch is one product: the x branch gives 5(-1) = -5 and the y branch gives 2(6) = 12. Add the branch products: -5 + 12 = 7."
          - problem: "Let u = x^2 y with x = r cos(theta) and y = r sin(theta). Find the partial derivative u_r as a function of r and theta."
            answer: "3r^2 cos(theta)^2 sin(theta)"
            answer_contract: {"kind": "function", "vars": ["r", "theta"]}
            solution_sketch: "By the multivariable chain rule, u_r = u_x x_r + u_y y_r. The outer partials are u_x = 2xy and u_y = x^2. The inner rates are x_r = cos(theta) and y_r = sin(theta). Substitute x = r cos(theta) and y = r sin(theta): 2xy cos(theta) + x^2 sin(theta) = 2 r^2 cos(theta) sin(theta) cos(theta) + r^2 cos^2(theta) sin(theta). Combine the two products to get 3r^2 cos(theta)^2 sin(theta)."
          - problem: "Let w = f(x, y, z) with x = g(t), y = h(t), z = k(t). At t = 0, g(0) = 2, h(0) = -1, k(0) = 3, g'(0) = 4, h'(0) = -2, k'(0) = 5, f_x(2, -1, 3) = 1, f_y(2, -1, 3) = 3, f_z(2, -1, 3) = -2. Find dw/dt at t = 0."
            answer: "-12"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The multivariable chain rule gives dw/dt = f_x g'(0) + f_y h'(0) + f_z k'(0), one product per branch of the tree. Each branch contributes one product: f_x g'(0) = 1(4) = 4, f_y h'(0) = 3(-2) = -6, and f_z k'(0) = -2(5) = -10. Add the three branch products: 4 - 6 - 10 = -12."
          - problem: "Let u = x^2 y with x = s + t and y = s - t. Find the partial derivative u_t as a function of s and t."
            answer: "s^2 - 2st - 3t^2"
            answer_contract: {"kind": "function", "vars": ["s", "t"]}
            solution_sketch: "By the multivariable chain rule, u_t = u_x x_t + u_y y_t. The outer partials are u_x = 2xy and u_y = x^2. The inner rates are x_t = 1 and y_t = -1. Substitute x = s + t and y = s - t: 2(s + t)(s - t)(1) + (s + t)^2(-1). Expand: 2(s^2 - t^2) - (s^2 + 2st + t^2) = s^2 - 2st - 3t^2."
          - problem: "The temperature at a point (x, y) is T(x, y). A bug walks so that x = g(t) and y = h(t). At t = 1, g(1) = 2, h(1) = 3, g'(1) = -1, h'(1) = 4, T_x(2, 3) = 5, and T_y(2, 3) = -2. Find the rate of change of temperature dT/dt at t = 1."
            answer: "-13"
            answer_contract: {"kind": "exact"}
            solution_sketch: "By the multivariable chain rule, dT/dt = T_x g'(1) + T_y h'(1), one product for each branch. The x branch gives 5(-1) = -5 and the y branch gives (-2)(4) = -8. Add the branch products: -5 + (-8) = -13."
        constraints: "one symbolic and one numeric (table-values) exemplar; every branch of the tree contributes exactly one product"
      - id: kp3
        name: "Implicit differentiation via partials"
        key_prerequisites: [chain-rule-one-parameter]
        exemplars:
          - problem: "Use the formula dy/dx = -Fx/Fy to find dy/dx for the curve x^3 + y^3 = 12xy. Give dy/dx as a function of x and y."
            answer: "(4y-x^2)/(y^2-4x)"
            answer_contract: {"kind": "function", "vars": ["x", "y"]}
            solution_sketch: "Step 1: write the curve as F = x^3 + y^3 - 12xy = 0. Step 2: compute the partials Fx = 3x^2 - 12y and Fy = 3y^2 - 12x. Step 3: use the implicit partials formula dy/dx = -Fx/Fy, then cancel the common factor 3 and rearrange. The derivative is (4y-x^2)/(y^2-4x)."
          - problem: "For the surface x^2 + y^2 + z^2 = 16, find the partial derivative of z with respect to x using the formula for implicit differentiation via partials. Give the answer as a function of x and z."
            answer: "-x/z"
            answer_contract: {"kind": "function", "vars": ["x", "z"]}
            solution_sketch: "Step 1: write the surface as F = x^2 + y^2 + z^2 - 16 = 0. Step 2: compute Fx = 2x and Fz = 2z by partial differentiation. Step 3: apply the implicit partials formula partial z partial x = -Fx/Fz and cancel 2. The final answer is -x/z."
          - problem: "A curve is given by x^2y + y^3 = 5. Use dy/dx = -Fx/Fy to find its slope formula dy/dx. Give dy/dx as a function of x and y."
            answer: "-2xy/(x^2+3y^2)"
            answer_contract: {"kind": "function", "vars": ["x", "y"]}
            solution_sketch: "Step 1: put the curve in the form F = x^2 y + y^3 - 5 = 0. Step 2: find Fx = 2xy and Fy = x^2 + 3y^2. Step 3: use dy/dx = -Fx/Fy; there is no common factor to cancel. The slope formula is -2xy/(x^2+3y^2)."
          - problem: "Use the partials formula to find dy/dx for the curve x^4 + y^4 = 8xy. Give dy/dx as a function of x and y."
            answer: "(2y-x^3)/(y^3-2x)"
            answer_contract: {"kind": "function", "vars": ["x", "y"]}
            solution_sketch: "Step 1: write F = x^4 + y^4 - 8xy = 0. Step 2: compute Fx = 4x^3 - 8y and Fy = 4y^3 - 8x. Step 3: apply dy/dx = -Fx/Fy and cancel the common factor 4. The derivative is (2y-x^3)/(y^3-2x)."
          - problem: "For the curve x^2 + xy + y^2 = 7, use implicit differentiation via partials to find dy/dx. Give dy/dx as a function of x and y."
            answer: "-(2x+y)/(x+2y)"
            answer_contract: {"kind": "function", "vars": ["x", "y"]}
            solution_sketch: "Step 1: write F = x^2 + xy + y^2 - 7 = 0. Step 2: compute Fx = 2x + y and Fy = x + 2y. Step 3: use the implicit partials formula dy/dx = -Fx/Fy. The derivative is -(2x+y)/(x+2y)."
          - problem: "For the surface x^2y + yz + z^2 = 3, find the partial derivative of z with respect to y using the formula for implicit differentiation via partials. Give the answer as a function of x, y, and z."
            answer: "-(x^2+z)/(y+2z)"
            answer_contract: {"kind": "function", "vars": ["x", "y", "z"]}
            solution_sketch: "Step 1: write the surface as F = x^2 y + yz + z^2 - 3 = 0. Step 2: compute Fy = x^2 + z and Fz = y + 2z. Step 3: apply the implicit partials formula partial z partial y = -Fy/Fz. The partial derivative is -(x^2+z)/(y+2z)."
        constraints: "F polynomial with integer coefficients; answers simplified by canceling common factors"
    diagnostic_exemplar:
