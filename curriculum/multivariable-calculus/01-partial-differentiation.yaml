unit: partial-differentiation
course: multivariable-calculus
module: "Partial Differentiation"
topics:
  - id: evaluating-multivariable-functions
    name: "Evaluating Multivariable Functions and Domains"
    core: true
    difficulty: 0.55
    drill: false
    answer_kind: numeric
    expected_time_secs: 90
    prerequisites:
      - id: domain-range
        weight: 0.6
        key: true
      - id: evaluating-functions
        weight: 0.4
        key: false
      - id: logarithm-basics
        weight: 0.3
        key: false
    knowledge_points:
      - id: kp1
        name: "Evaluation"
        key_prerequisites: [evaluating-functions]
        step_check:
          step: 'the first input $2$ replaces $x$, and the second input $3$ replaces $y$.'
          question: 'Why does the input $2$ go in place of $x$ and the input $3$ in place of $y$?'
          options:
            - 'The smaller input always takes the place of the first variable'
            - 'Inputs are matched to the variables by position in $h(x, y)$'
            - 'Either order works, since a function takes the same value at $(2, 3)$ and $(3, 2)$'
            - 'The first input in the list goes to the variable that is written last'
          answer: 'Inputs are matched to the variables by position in $h(x, y)$'
          why: 'In $h(x, y)$ the first slot is $x$ and the second is $y$, so $h(2, 3)$ has $x = 2$ and $y = 3$; swapping them would give $h(3, 2)$, which is a different point.'
        exemplars:
          - problem: 'Let $g(x, y) = \dfrac{xy}{x^2 + y^2}$. Find $g(1, 2)$.'
            answer: '2/5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Put $x = 1$ and $y = 2$ into the formula to get $\frac{1 \cdot 2}{1^2 + 2^2}$. The numerator is $2$ and the denominator is $1 + 4 = 5$, so $g(1, 2) = \frac{2}{5}$.'
          - problem: 'Let $f(x, y) = x^2 y - 3y$. Find $f(2, -1)$.'
            answer: '-1'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Put $x = 2$ and $y = -1$ into the formula. Then $f(2, -1) = 4 \cdot (-1) - 3(-1) = -4 + 3 = -1$.'
          - problem: 'A flat plate has temperature $T(x, y) = \dfrac{2x - y}{x + y}$ degrees Celsius at the point $(x, y)$, measured in metres from one corner. What is the temperature at the point $(3, 2)$?'
            answer: '4/5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Put $x = 3$ and $y = 2$ into the temperature formula to get $\frac{2 \cdot 3 - 2}{3 + 2}$. The numerator is $4$ and the denominator is $5$, so the temperature is $\frac{4}{5}$ degrees.'
          - problem: 'Let $f(x, y, z) = xyz + z^2$. Find $f(2, 3, 1)$.'
            answer: '7'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The inputs fill the slots in order: $x = 2$, $y = 3$, $z = 1$. Then $f(2, 3, 1) = 2 \cdot 3 \cdot 1 + 1^2 = 6 + 1 = 7$.'
          - problem: 'Sam evaluates $f(x, y) = x^2 - y$ at the point $(2, 5)$ by putting $x = 5$ and $y = 2$, and gets $23$. What is the correct value of $f(2, 5)$?'
            answer: '-1'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Sam swapped the inputs, but the first input belongs to $x$ and the second to $y$. The correct value is $f(2, 5) = 2^2 - 5 = 4 - 5 = -1$.'
          - problem: 'A runner covers $d$ metres in $t$ seconds, so the average speed is $v(d, t) = \dfrac{d}{t}$ metres per second. Find $v(90, 12)$.'
            answer: '7.5'
            answer_contract: {"kind":"unit","quantity":"speed","unit":"m/s","allow_omitted":true}
            solution_sketch: 'Put $d = 90$ and $t = 12$ into the formula. The speed is distance divided by time, $\frac{90}{12} = 7.5$ metres per second.'
          - problem: 'A closed box has length $x$, width $y$ and height $z$ metres, so its surface area is $S(x, y, z) = 2(xy + yz + xz)$ square metres. Find $S(3, 2, 4)$.'
            answer: '52'
            answer_contract: {"kind":"unit","quantity":"area","unit":"m^2","allow_omitted":true}
            solution_sketch: 'Put $x = 3$, $y = 2$, $z = 4$ into the formula. The sum inside is $6 + 8 + 12 = 26$, and doubling it gives $52$ square metres.'
          - problem: 'The pressure of a gas is $P(T, V) = \dfrac{8T}{V}$ kilopascals when its temperature is $T$ kelvins and its volume is $V$ litres. Find the pressure when $T = 300$ and $V = 12$.'
            answer: '200'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Put $T = 300$ and $V = 12$ into the formula to get $\frac{8 \cdot 300}{12}$. The numerator is $2400$, and $2400$ divided by $12$ is $200$ kilopascals.'
          - problem: 'Let $f(x, y) = \dfrac{x + 2y}{x - y}$. Find $f(3, 1)$.'
            answer: '5/2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Put $x = 3$ and $y = 1$ into the formula to get $\frac{3 + 2}{3 - 1}$. The numerator is $5$ and the denominator is $2$, so $f(3, 1) = \frac{5}{2}$.'
        constraints: "small integer inputs; rational outputs with single-digit numerators and denominators; measured contexts keep decimal answers"
      - id: kp2
        name: "Domains"
        key_prerequisites: [domain-range, logarithm-basics]
        step_check:
          step: 'the natural log is defined only when its argument is positive'
          question: 'Why must $6 - 2x - y$ be strictly positive, not just nonnegative?'
          options:
            - 'Because the logarithm of a positive number is always positive'
            - 'Because $\ln x$ is only defined for values of $x$ above $1$'
            - 'Because $\ln$ of a negative number is zero instead of undefined'
            - 'Because $\ln 0$ is undefined, so the argument cannot be zero'
          answer: 'Because $\ln 0$ is undefined, so the argument cannot be zero'
          why: 'The logarithm needs a positive input; at $0$ it is undefined, so the boundary line $2x + y = 6$ is left out of the domain.'
        try_first:
          problem: 'Let $f(x, y) = \sqrt{x - y}$. Is $f$ defined at the point $(1, 3)$?'
          answer_contract: {"kind":"label","options":[["yes","it is defined","defined"],["no","it is not defined","not defined","undefined"]]}
          answer: 'no'
          reveal: 'At $(1, 3)$ the radicand is $1 - 3 = -2$, and a square root of a negative number is not real. The domain is the set of points where the formula gives a real number.'
        exemplars:
          - problem: 'Find the domain of $f(x, y) = \ln(2x + y - 5)$.'
            answer: '2x + y > 5'
            answer_contract: {"kind":"polynomial_relation"}
            solution_sketch: 'A logarithm needs a positive argument, so $2x + y - 5 > 0$. This means $2x + y > 5$, the open half-plane above the line $2x + y = 5$.'
          - problem: 'Find the domain of $f(x, y) = \sqrt{16 - x^2 - y^2}$.'
            answer: 'x^2 + y^2 <= 16'
            answer_contract: {"kind":"polynomial_relation"}
            solution_sketch: 'A square root needs a nonnegative radicand, so $16 - x^2 - y^2 \ge 0$. This means $x^2 + y^2 \le 16$, the closed disk of radius $4$ about the origin.'
          - problem: 'The formula $f(x, y) = \dfrac{x + y}{x - 2y}$ fails along one line. Find an equation of that line.'
            answer: 'x - 2y = 0'
            answer_contract: {"kind":"polynomial_relation"}
            solution_sketch: 'A denominator cannot be zero, so the formula fails where $x - 2y = 0$. That line, equivalent to $y = \frac{x}{2}$, passes through the origin and is removed from the domain.'
          - problem: 'A heated plate has temperature $T(x, y) = \dfrac{120}{25 - x^2 - y^2}$ at the point $(x, y)$, measured in metres from its centre. The formula has no value on one curve. Find an equation of that curve.'
            answer: 'x^2 + y^2 = 25'
            answer_contract: {"kind":"polynomial_relation"}
            solution_sketch: 'The denominator is zero exactly when $25 - x^2 - y^2 = 0$. That gives $x^2 + y^2 = 25$, the circle of radius $5$ about the centre of the plate.'
          - problem: 'Is the point $(4, 2)$ in the domain of $f(x, y) = \ln(x - 2y)$?'
            answer: 'no'
            answer_contract: {"kind":"label","options":[["yes","it is in the domain","in the domain"],["no","it is not in the domain","not in the domain"]]}
            solution_sketch: 'At $(4, 2)$ the argument is $4 - 2 \cdot 2 = 0$. A logarithm needs a positive argument, so $(4, 2)$ is on the boundary line and is not in the domain.'
          - problem: 'A sensor at the point $(1, 0)$ measures the signal strength $S(x, y) = \sqrt{36 - (x - 1)^2 - y^2}$, with $x$ and $y$ in kilometres. Find the set of points where the sensor gives a value.'
            answer: '(x - 1)^2 + y^2 <= 36'
            answer_contract: {"kind":"polynomial_relation"}
            solution_sketch: 'The radicand must be nonnegative, so $36 - (x - 1)^2 - y^2 \ge 0$. This means $(x - 1)^2 + y^2 \le 36$, a disk of radius $6$ km centred at $(1, 0)$.'
          - problem: 'Find the domain of $f(x, y) = \sqrt{y - x^2}$.'
            answer: 'y >= x^2'
            answer_contract: {"kind":"polynomial_relation"}
            solution_sketch: 'The radicand must be nonnegative, so $y - x^2 \ge 0$. This means $y \ge x^2$, the region on and above the parabola $y = x^2$.'
          - problem: 'Sam says the domain of $f(x, y) = \ln(3x + 2y - 6)$ is $3x + 2y \ge 6$. What is the correct domain?'
            answer: '3x + 2y > 6'
            answer_contract: {"kind":"polynomial_relation"}
            solution_sketch: 'Sam included the boundary line, but $\ln 0$ is undefined. The argument must be positive, so the domain is $3x + 2y > 6$.'
        constraints: "domains defined by one square root, log, or nonzero denominator; regions are disks, half-planes, the region above a parabola, or the plane minus a curve"
      - id: kp3
        name: "Ranges of simple functions"
        key_prerequisites: [domain-range]
        step_check:
          step: '$f$ takes every value between $0$ and $4$.'
          question: 'Why does $f$ take every value between $0$ and $4$, not only $0$ and $4$?'
          options:
            - 'The largest and smallest outputs are enough to fix the whole range'
            - 'Every number between $0$ and $4$ is the square root of itself'
            - 'The radicand varies steadily, so its root passes every value between'
            - 'The square root of any number between $0$ and $16$ is a whole number'
          answer: 'The radicand varies steadily, so its root passes every value between'
          why: 'As $x^2 + y^2$ grows from $0$ to $16$ the radicand falls steadily from $16$ to $0$, and the square root falls with it through every value from $4$ to $0$.'
        exemplars:
          - problem: 'Find the range of $f(x, y) = \sqrt{9 - x^2 - y^2}$.'
            answer: '0 <= z <= 3'
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'The radicand $9 - x^2 - y^2$ runs from $0$ on the circle $x^2 + y^2 = 9$ up to $9$ at the origin. Its square root therefore runs from $0$ to $3$.'
          - problem: 'Find the range of $f(x, y) = x^2 + y^2$.'
            answer: 'z >= 0'
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'Both $x^2$ and $y^2$ are at least $0$, so the sum is at least $0$. The value $0$ occurs at the origin and the sum grows without bound, so the range is $z \ge 0$.'
          - problem: 'A hemispherical dome has height $h(x, y) = \sqrt{36 - x^2 - y^2}$ metres above the point $(x, y)$ of its circular base. Find the range of heights over the base.'
            answer: '0 <= z <= 6'
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'The radicand $36 - x^2 - y^2$ runs from $0$ at the rim to $36$ at the centre. The square root runs from $0$ to $6$, so the heights lie between $0$ and $6$ metres.'
          - problem: 'Find the range of $f(x, y) = x^2 + y^2 + 2$.'
            answer: 'z >= 2'
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'The sum $x^2 + y^2$ is at least $0$, so adding $2$ gives values of at least $2$. The value $2$ occurs at the origin, so the range is $z \ge 2$.'
          - problem: 'A dish-shaped mirror has height $h(x, y) = x^2 + y^2 - 3$ metres above the floor at the horizontal position $(x, y)$. Find the range of heights of the mirror.'
            answer: 'z >= -3'
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'The sum $x^2 + y^2$ is at least $0$, so subtracting $3$ gives heights of at least $-3$. The lowest point is at the origin, so the range is $z \ge -3$.'
          - problem: 'Find the range of $f(x, y) = \sqrt{x^2 + y^2} + 1$.'
            answer: 'z >= 1'
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'The square root of $x^2 + y^2$ is at least $0$, so adding $1$ gives values of at least $1$. The value $1$ occurs at the origin and larger values occur farther out, so the range is $z \ge 1$.'
          - problem: 'Sam says the range of $f(x, y) = 4 - x^2 - y^2$ is $z \ge 4$. What is the correct range?'
            answer: 'z <= 4'
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'Sam forgot that subtracting $x^2 + y^2$ lowers the value. The largest output is $4$ at the origin, and the outputs fall without bound, so the range is $z \le 4$.'
        constraints: "ranges of sums of squares or a root of one, with a shift; interval answers on one side or between two bounds"
    diagnostic_exemplar:
      problem: 'Let $f(x, y) = \sqrt{25 - x^2 - y^2}$. Compute $f(3, 0)$ and state the domain and the range of $f$.'
      answer: '$f(3, 0) = 4$; domain the closed disk $x^2 + y^2 \le 25$; range $[0, 5]$.'
      answer_contract: {kind: none}
      solution_sketch: '$f(3,0) = \sqrt{25 - 9} = 4$. The radicand must be non-negative, giving the disk of radius $5$; on it $25 - x^2 - y^2$ runs over $[0, 25]$, so $f$ runs over $[0, 5]$.'
    anki_seeds:
      - front: 'The domain of a function $f(x, y)$ is a subset of...'
        back: 'the plane $\mathbb{R}^2$ (the set of input points where the formula is defined).'
        type: basic
      - front: 'Domain of $f(x,y) = \ln g(x,y)$?'
        back: 'The region where $g(x, y) > 0$.'
        type: basic

  - id: functions-several-variables
    name: "Level Curves and Contour Maps"
    core: true
    difficulty: 0.62
    drill: false
    answer_kind: numeric
    expected_time_secs: 120
    prerequisites:
      - id: evaluating-multivariable-functions
        weight: 0.7
        key: true
      - id: coordinates-surfaces-3d
        weight: 0.5
        key: true
    knowledge_points:
      - id: kp1
        name: "Level curves"
        key_prerequisites: [evaluating-multivariable-functions]
        step_check:
          step: 'Evaluate $f$ at the given point'
          question: 'Why does evaluating $f$ at the given point tell us the value of $k$?'
          options:
            - 'The level value is simply the sum of the coordinates of the given point'
            - 'The point is the centre of the level curve, so $k$ is its output there'
            - 'Every point of a level curve has the same output, as does this point'
            - 'A level curve is the set of points where the output is zero'
          answer: 'Every point of a level curve has the same output, as does this point'
          why: 'A level curve $f(x, y) = k$ collects all points with output $k$; since $(2, 5)$ is on the curve, $k = f(2, 5) = -3$.'
        try_first:
          problem: 'For $f(x, y) = x + 2y$, the points $(1, 3)$ and $(3, a)$ give the same output. Find $a$.'
          answer_contract: {"kind":"exact"}
          answer: '2'
          reveal: 'Both points lie on the level curve $x + 2y = 7$, since $f(1, 3) = 7$, so $3 + 2a = 7$ gives $a = 2$. A level curve is the set of all inputs that give one output.'
        exemplars:
          - problem: 'Find the value of $k$ for which the level curve $f(x, y) = k$ of $f(x, y) = x^2 + y^2$ passes through $(3, 4)$.'
            answer: '25'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The level curve through a point has $k$ equal to the output at that point. Here $f(3, 4) = 3^2 + 4^2 = 25$, so $k = 25$.'
          - problem: 'Find an equation of the level curve of $f(x, y) = y - x^2$ passing through $(1, 3)$.'
            answer: 'y = x^2 + 2'
            answer_contract: {"kind":"polynomial_relation"}
            solution_sketch: 'First $f(1, 3) = 3 - 1 = 2$, so the level value is $2$. The level curve is $y - x^2 = 2$, which is $y = x^2 + 2$.'
          - problem: 'For $f(x, y) = xy$, what type of curve is the level curve $f(x, y) = 6$?'
            answer: 'hyperbola'
            answer_contract: {"kind":"label","options":[["hyperbola","a hyperbola"],["circle","a circle"],["line","a line","straight line"],["parabola","a parabola"]]}
            solution_sketch: 'The level curve is $xy = 6$, so $y = \frac{6}{x}$. A product of the two variables equal to a constant is a hyperbola, not a circle, a line or a parabola.'
          - problem: 'The temperature on a metal plate is $T(x, y) = 2x + 3y$ degrees at the point $(x, y)$. An isotherm is a curve of constant temperature. Find an equation of the isotherm through the point $(1, 2)$.'
            answer: '2x + 3y = 8'
            answer_contract: {"kind":"polynomial_relation"}
            solution_sketch: 'The temperature at $(1, 2)$ is $T(1, 2) = 2 + 6 = 8$ degrees. The isotherm is the set of points with the same temperature, $2x + 3y = 8$.'
          - problem: 'Find the radius of the circle that is the level curve of $f(x, y) = x^2 + y^2$ through the point $(2, 4)$.'
            answer: '2sqrt(5)'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The level value is $f(2, 4) = 4 + 16 = 20$, so the level curve is $x^2 + y^2 = 20$. Its radius is $\sqrt{20} = 2\sqrt{5}$.'
          - problem: 'Sam says the level curve of $f(x, y) = x^2 + y^2$ through $(2, 3)$ is $x^2 + y^2 = 5$, because $2 + 3 = 5$. What is the correct equation?'
            answer: 'x^2 + y^2 = 13'
            answer_contract: {"kind":"polynomial_relation"}
            solution_sketch: 'Sam added the coordinates, but the level value is the output of $f$. Here $f(2, 3) = 4 + 9 = 13$, so the level curve is $x^2 + y^2 = 13$.'
          - problem: 'A hill has height $h(x, y) = 100 - x^2 - y^2$ metres above the point $(x, y)$ of a flat map. The contour at height $75$ metres is a circle about the origin. Find its radius.'
            answer: '5'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'The contour satisfies $100 - x^2 - y^2 = 75$, so $x^2 + y^2 = 25$. This circle has radius $\sqrt{25} = 5$ metres.'
          - problem: 'Find an equation of the level curve of $f(x, y) = x^2 + y$ passing through $(2, 3)$.'
            answer: 'y = 7 - x^2'
            answer_contract: {"kind":"polynomial_relation"}
            solution_sketch: 'First $f(2, 3) = 4 + 3 = 7$, so the level curve is $x^2 + y = 7$. Solving for $y$ gives $y = 7 - x^2$.'
          - problem: 'For $f(x, y) = x^2 + y^2$, the level curve $f(x, y) = k$ is a circle of radius $7$. Find $k$.'
            answer: '49'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'A circle of radius $7$ about the origin has equation $x^2 + y^2 = 49$. Comparing with $f(x, y) = k$ gives $k = 49$.'
        constraints: "level sets are circles, lines, parabolas, or hyperbolas; k values keep radii and intercepts exact"
      - id: kp2
        name: "Reading contour maps"
        key_prerequisites: [evaluating-multivariable-functions, coordinates-surfaces-3d]
        step_check:
          step: 'equal horizontal steps produce growing height gains'
          question: 'Why does the surface get steeper outward when the radii are equally spaced?'
          options:
            - 'The circles get smaller as the radius grows, so the slope rises'
            - 'Circular level curves always mean that the surface is steep'
            - 'The radii grow by $1$ each time, so the surface rises at a constant rate'
            - 'The level values jump by larger amounts over each equal radius step'
          answer: 'The level values jump by larger amounts over each equal radius step'
          why: 'Steepness is the change in level per unit of horizontal distance; the jumps are $6$, then $10$ over equal steps, so the surface climbs faster the farther out we go.'
        exemplars:
          - problem: 'On a contour map of $f(x, y)$ the level curves $f = 30$ and $f = 50$ are $2$ units apart. Find the average rate of change of $f$ per unit distance when moving from one curve to the other.'
            answer: '10'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The level changes by $50 - 30 = 20$ over a distance of $2$ units. The average rate is $\frac{20}{2} = 10$ per unit.'
          - problem: 'On a hiking map the contour lines for $100$ metres and $140$ metres of elevation are $80$ metres apart horizontally. What is the average slope, in metres of rise per metre of horizontal distance, between them?'
            answer: '1/2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The rise is $140 - 100 = 40$ metres over a horizontal distance of $80$ metres. The slope is $\frac{40}{80} = \frac{1}{2}$.'
          - problem: 'The contours $f = 1, 4, 9$ of $f(x, y) = x^2 + y^2$ are circles of radii $1, 2, 3$. By how much does $f$ increase when we move from the circle of radius $2$ to the circle of radius $3$?'
            answer: '5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Radius $2$ lies on the contour $f = 4$ and radius $3$ lies on $f = 9$. The increase is $9 - 4 = 5$.'
          - problem: 'The level curves of $f$ are evenly spaced parallel lines. Moving $4$ units perpendicular to the lines changes $f$ by $16$. Find the rate of change of $f$ per unit distance in that direction.'
            answer: '4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Evenly spaced parallel level curves mean the rate is constant. The rate is the change in $f$ divided by the distance, $\frac{16}{4} = 4$.'
          - problem: 'A function $f(x, y)$ has straight parallel level curves. Along the $x$-axis $f$ increases by $6$ per unit of $x$, and along the $y$-axis $f$ does not change. Find $f(3, 2) - f(0, 0)$.'
            answer: '18'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The rate is constant in each direction. Moving $3$ units in $x$ adds $6 \cdot 3 = 18$, and moving $2$ units in $y$ adds $0$, so the total change is $18$.'
          - problem: 'On the contour map of a hill the $100$ metre and $120$ metre contours are $10$ metres apart on the north side and $40$ metres apart on the south side. Which side of the hill is steeper?'
            answer: 'north'
            answer_contract: {"kind":"label","options":[["north","the north side","north side"],["south","the south side","south side"]]}
            solution_sketch: 'The rise of $20$ metres takes $10$ metres of horizontal distance on the north side and $40$ metres on the south side. Contours that are closer together mean a steeper slope, so the north side is steeper.'
          - problem: 'On a contour map the level curves $f = 0$ and $f = 10$ are $5$ units apart, and $f = 10$ and $f = 20$ are $2$ units apart. Find the larger of the two average rates of change of $f$ per unit distance.'
            answer: '5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Between $f = 0$ and $f = 10$ the rate is $\frac{10}{5} = 2$. Between $f = 10$ and $f = 20$ it is $\frac{10}{2} = 5$, which is the larger rate.'
          - problem: 'The level curves of $f$ are evenly spaced parallel lines. Moving $10$ units perpendicular to the lines changes $f$ by $25$. Find the rate of change of $f$ per unit distance.'
            answer: '5/2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Evenly spaced parallel level curves mean the rate is constant. The rate is $\frac{25}{10} = \frac{5}{2}$ per unit.'
        constraints: "qualitative and quantitative reading of contour maps: spacing vs steepness, parallel lines vs planes"
      - id: kp3
        name: "Graphs of two-variable functions"
        key_prerequisites: [coordinates-surfaces-3d]
        step_check:
          step: 'Move the constant to the left side'
          question: 'Why do we move the constant to the left side of the equation?'
          options:
            - 'It removes the squares, which cannot stay on one side of an equation'
            - 'It puts the equation in standard form, which shows the vertex height'
            - 'It makes the coefficient of $x^2$ equal to $1$, which it was not before'
            - 'It changes the surface from a paraboloid into a plane in the new form'
          answer: 'It puts the equation in standard form, which shows the vertex height'
          why: 'In the form $z - z_0 = x^2 + y^2$ the vertex is $(0, 0, z_0)$; here $z + 4 = x^2 + y^2$ gives $z_0 = -4$.'
        exemplars:
          - problem: 'What kind of surface is the graph of $f(x, y) = x^2 + y^2 - 4$?'
            answer: 'paraboloid'
            answer_contract: {"kind":"label","options":[["paraboloid","a paraboloid","elliptic paraboloid","circular paraboloid","paraboloid of revolution"],["plane","a plane"],["hemisphere","a hemisphere"],["cone","a cone"]]}
            solution_sketch: 'The graph is $z = x^2 + y^2 - 4$, which is $z + 4 = x^2 + y^2$. One variable to the first power and the other two squared with the same sign make a paraboloid, not a plane, a hemisphere or a cone.'
          - problem: 'What kind of surface is the graph of $f(x, y) = 10 - x - 2y$?'
            answer: 'plane'
            answer_contract: {"kind":"label","options":[["plane","a plane","tilted plane"],["paraboloid","a paraboloid"],["hemisphere","a hemisphere"],["cone","a cone"]]}
            solution_sketch: 'The graph $z = 10 - x - 2y$ is the same as $x + 2y + z = 10$. An equation of the first degree in $x$, $y$ and $z$ describes a plane.'
          - problem: 'The graph of $f(x, y) = x^2 + y^2 + 1$ is a paraboloid that opens upward. Find its vertex.'
            answer: '(0, 0, 1)'
            answer_contract: {"kind":"coordinates","arity":3}
            solution_sketch: 'The graph is $z - 1 = x^2 + y^2$, and the squares are smallest when $x = 0$ and $y = 0$. Then $z = 1$, so the vertex is $(0, 0, 1)$.'
          - problem: 'A hill has height $h(x, y) = 9 - x^2 - y^2$ metres above the point $(x, y)$ of the ground. Find the coordinates of its summit.'
            answer: '(0, 0, 9)'
            answer_contract: {"kind":"coordinates","arity":3}
            solution_sketch: 'The height is largest when $x^2 + y^2$ is smallest, which is at $x = 0$ and $y = 0$. There $h = 9$, so the summit is $(0, 0, 9)$.'
          - problem: 'The graph of $f(x, y) = \sqrt{25 - x^2 - y^2}$ is half of a sphere. Find the radius of that sphere.'
            answer: '5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Squaring $z = \sqrt{25 - x^2 - y^2}$ gives $x^2 + y^2 + z^2 = 25$ with $z \ge 0$. The radius is $\sqrt{25} = 5$.'
          - problem: 'A satellite dish is the graph of $z = \dfrac{x^2 + y^2}{4}$, with $x$, $y$ and $z$ in metres. The rim of the dish is at height $z = 9$. Find the diameter of the dish.'
            answer: '12'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'At the rim $\frac{x^2 + y^2}{4} = 9$, so $x^2 + y^2 = 36$ and the radius is $6$ metres. The diameter is twice the radius, which is $12$ metres.'
          - problem: 'The graph of $f(x, y) = x^2 + y^2$ is cut by the plane $z = 4$. Find the radius of the circle in which they meet.'
            answer: '2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'On the plane $z = 4$ the graph satisfies $x^2 + y^2 = 4$. This is a circle of radius $\sqrt{4} = 2$.'
          - problem: 'At what height $z$ does the plane cut the graph of $f(x, y) = x^2 + y^2$ in a circle of radius $5$?'
            answer: '25'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'A circle of radius $5$ about the origin has equation $x^2 + y^2 = 25$. On the graph $z = x^2 + y^2$, so the height is $z = 25$.'
        constraints: "graphs are planes, paraboloids, or hemispheres recognizable from the quadric catalog"
    diagnostic_exemplar:
      problem: 'Identify the graph of $f(x, y) = \sqrt{16 - x^2 - y^2}$ and describe its level curves.'
      answer: 'The graph is the upper hemisphere of the sphere $x^2 + y^2 + z^2 = 16$ (radius $4$). The level curves $f = k$ are the concentric circles $x^2 + y^2 = 16 - k^2$ of radius $\sqrt{16 - k^2}$, for $0 \le k \le 4$; equally spaced levels crowd together near the rim $x^2 + y^2 = 16$, where the hemisphere is steepest, and spread out near the top $k = 4$, where it flattens.'
      answer_contract: {kind: none}
      solution_sketch: 'Squaring $z = \sqrt{16 - x^2 - y^2}$ with $z \ge 0$ gives $x^2 + y^2 + z^2 = 16$, $z \ge 0$. Setting $f = k$ gives $x^2 + y^2 = 16 - k^2$.'
    anki_seeds:
      - front: 'What is a level curve of $f(x, y)$?'
        back: 'The set of points where $f(x, y) = k$ for a fixed constant $k$; the contour at height $k$.'
        type: basic
      - front: 'The level curves of $f(x,y) = x^2 + y^2$ are {{c1::concentric circles centered at the origin}}.'
        back: 'concentric circles centered at the origin'
        type: cloze

  - id: level-surfaces
    name: "Functions of Three Variables and Level Surfaces"
    core: false                # descriptive leaf topic
    difficulty: 0.65
    drill: false
    answer_kind: numeric
    expected_time_secs: 120
    prerequisites:
      - id: functions-several-variables
        weight: 0.7
        key: true
      - id: coordinates-surfaces-3d
        weight: 0.6
        key: true
    knowledge_points:
      - id: kp1
        name: "Level surfaces of f(x, y, z)"
        key_prerequisites: [functions-several-variables]
        step_check:
          step: 'substitute the point into $f$.'
          question: 'Why does substituting the point into $f$ give the level value $k$?'
          options:
            - 'The level value is always the sum of the three coordinates of the point'
            - 'A level surface is the set of points where the output is zero, as at this point'
            - 'Every point of a level surface has the same output, and this point is on it'
            - 'The point is the centre of the level surface, so $k$ is its output there'
          answer: 'Every point of a level surface has the same output, and this point is on it'
          why: 'The surface $f(x, y, z) = k$ collects all points with output $k$; since $(1, 1, 1)$ is on it, $k = f(1, 1, 1) = 0$.'
        exemplars:
          - problem: 'Find an equation of the level surface of $f(x, y, z) = x^2 + y^2 + z^2$ that passes through the point $(1, 2, 2)$.'
            answer: 'x^2 + y^2 + z^2 = 9'
            answer_contract: {"kind":"polynomial_relation"}
            solution_sketch: 'The level value is the output at the point, $f(1, 2, 2) = 1 + 4 + 4 = 9$. The level surface is $x^2 + y^2 + z^2 = 9$, a sphere of radius $3$.'
          - problem: 'The level surface $f(x, y, z) = k$ of $f(x, y, z) = 2x^2 + y^2 + 3z^2$ passes through the point $(1, -1, 2)$. Find $k$.'
            answer: '15'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Substitute the point into the function: $2(1)^2 + (-1)^2 + 3(2)^2 = 2 + 1 + 12$. So $k = 15$.'
          - problem: 'Find an equation of the level surface of $f(x, y, z) = 2x - y + 4z$ that passes through $(3, 1, -2)$.'
            answer: '2x - y + 4z = -3'
            answer_contract: {"kind":"polynomial_relation"}
            solution_sketch: 'The output at the point is $f(3, 1, -2) = 6 - 1 - 8 = -3$. The level surface is $2x - y + 4z = -3$, a plane.'
          - problem: 'The temperature in a room is $T(x, y, z) = 3x + y - 2z$ degrees at the point $(x, y, z)$. Find an equation of the surface of constant temperature through the point $(1, 2, 3)$.'
            answer: '3x + y - 2z = -1'
            answer_contract: {"kind":"polynomial_relation"}
            solution_sketch: 'The temperature at the point is $T(1, 2, 3) = 3 + 2 - 6 = -1$ degrees. The surface of constant temperature is $3x + y - 2z = -1$.'
          - problem: 'The level surface $f(x, y, z) = k$ of $f(x, y, z) = x^2 - y^2 + z^2$ passes through the point $(1, 2, 3)$. Find $k$.'
            answer: '6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Substitute the point into the function: $1^2 - 2^2 + 3^2 = 1 - 4 + 9$. So $k = 6$.'
          - problem: 'A lamp at the origin gives light of intensity $I(x, y, z) = \dfrac{36}{x^2 + y^2 + z^2}$ at the point $(x, y, z)$. The points with the same intensity as the point $(2, 2, 1)$ form a sphere. Find its radius.'
            answer: '3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The intensity at $(2, 2, 1)$ is $\frac{36}{4 + 4 + 1} = 4$. Setting $\frac{36}{x^2 + y^2 + z^2} = 4$ gives $x^2 + y^2 + z^2 = 9$, so the radius is $3$.'
          - problem: 'Sam finds the level surface of $f(x, y, z) = xy + z$ through $(2, 3, 1)$ and writes $xy + z = 5$, because $2 + 3 = 5$. What is the correct equation?'
            answer: 'xy + z = 7'
            answer_contract: {"kind":"polynomial_relation"}
            solution_sketch: 'Sam added two of the coordinates instead of evaluating $f$. The correct level value is $f(2, 3, 1) = 6 + 1 = 7$, so the surface is $xy + z = 7$.'
          - problem: 'The level surface $f(x, y, z) = k$ of $f(x, y, z) = x^2 + y^2 - z$ passes through the origin. Find $k$.'
            answer: '0'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Substitute the origin into the function: $0^2 + 0^2 - 0 = 0$. So $k = 0$, and the level surface is $z = x^2 + y^2$.'
        constraints: "f is a quadratic or linear polynomial (or a constant over a sum of squares); the required level passes through a given small-integer point"
      - id: kp2
        name: "Identifying the surface"
        key_prerequisites: [functions-several-variables, coordinates-surfaces-3d]
        step_check:
          step: 'the variable $y$ is absent, so the equation is unchanged as $y$ varies.'
          question: 'Why does a missing variable make $x^2 + z^2 = 9$ a cylinder?'
          options:
            - 'The surface is flat in the $y$ direction, so it is a plane with a circle on it'
            - 'The missing variable has been set equal to zero, so the surface is one circle'
            - 'The circle in $x$ and $z$ shrinks to a point as $y$ increases, leaving a cone'
            - 'Every slice at a fixed $y$ is the same circle, so the circles stack along $y$'
          answer: 'Every slice at a fixed $y$ is the same circle, so the circles stack along $y$'
          why: 'Any value of $y$ satisfies the equation, so each slice $y = c$ is the circle $x^2 + z^2 = 9$ and together these circles form a cylinder along the $y$-axis.'
        try_first:
          problem: 'The point $(3, 0, 0)$ lies on the surface $x^2 + y^2 = 9$. Does the point $(3, 0, 7)$ also lie on it?'
          answer_contract: {"kind":"label","options":[["yes","it does","it lies on it","it lies on the surface","it is on the surface"],["no","it does not","it does not lie on it"]]}
          answer: 'yes'
          reveal: 'The equation has no $z$, so changing $z$ never changes whether it holds. The surface contains the whole vertical line through each of its points, which is a cylinder.'
        exemplars:
          - problem: 'What type of surface is $3x - y + 2z = 6$?'
            answer: 'plane'
            answer_contract: {"kind":"label","options":[["plane","a plane"],["sphere","a sphere"],["cylinder","a cylinder"],["cone","a cone"]]}
            solution_sketch: 'The equation is of the first degree in $x$, $y$ and $z$, so it is a plane. A sphere needs three squared terms, a cylinder needs a missing variable, and a cone needs squares with no constant.'
          - problem: 'What type of surface is $x^2 - y^2 + z^2 = 4$?'
            answer: 'hyperboloid'
            answer_contract: {"kind":"label","options":[["hyperboloid","a hyperboloid","hyperboloid of one sheet","a hyperboloid of one sheet","one-sheeted hyperboloid","one sheet hyperboloid","hyperboloid of 1 sheet"],["sphere","a sphere"],["cone","a cone"],["paraboloid","a paraboloid"]]}
            solution_sketch: 'There are two positive squares and one negative square, with a nonzero constant $4$. That pattern is a hyperboloid, not a sphere, a cone or a paraboloid.'
          - problem: 'The surface $x^2 + y^2 = 36$ in space is a circular cylinder. Find the radius of its circular cross-section.'
            answer: '6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The equation has no $z$, so every horizontal slice is the same circle $x^2 + y^2 = 36$. Its radius is $\sqrt{36} = 6$.'
          - problem: 'Find the centre of the sphere $x^2 + y^2 + z^2 - 6x + 4y - 2z = 3$.'
            answer: '(3, -2, 1)'
            answer_contract: {"kind":"coordinates","arity":3}
            solution_sketch: 'Complete the square in each variable: $(x - 3)^2 + (y + 2)^2 + (z - 1)^2 = 17$. The centre is $(3, -2, 1)$.'
          - problem: 'A beacon sends a signal that reaches every point exactly $5$ metres from the point $(1, -2, 3)$. Find an equation of the sphere of these points.'
            answer: '(x - 1)^2 + (y + 2)^2 + (z - 3)^2 = 25'
            answer_contract: {"kind":"polynomial_relation"}
            solution_sketch: 'A sphere with centre $(1, -2, 3)$ and radius $5$ has equation $(x - 1)^2 + (y + 2)^2 + (z - 3)^2 = 5^2$. So the right side is $25$.'
          - problem: 'The surface $z = x^2 + y^2$ is cut by the plane $z = 9$. Find the radius of the circle in which they meet.'
            answer: '3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Setting $z = 9$ gives $x^2 + y^2 = 9$. This is a circle of radius $\sqrt{9} = 3$.'
          - problem: 'The wall of a grain silo is the surface $x^2 + y^2 = 16$, with $x$, $y$ and $z$ in metres. Find the diameter of the silo.'
            answer: '8'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'Every horizontal slice of the wall is the circle $x^2 + y^2 = 16$, of radius $4$ metres. The diameter is twice the radius, which is $8$ metres.'
          - problem: 'Find the radius of the sphere $x^2 + y^2 + z^2 - 6x + 4y - 2z = 3$.'
            answer: 'sqrt(17)'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Completing the square gives $(x - 3)^2 + (y + 2)^2 + (z - 1)^2 = 3 + 9 + 4 + 1 = 17$. The radius is $\sqrt{17}$.'
          - problem: 'The surface $z^2 = x^2 + y^2$ is cut by the plane $z = 5$. Find the radius of the circle in which they meet.'
            answer: '5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Setting $z = 5$ gives $x^2 + y^2 = 25$. This is a circle of radius $\sqrt{25} = 5$.'
        constraints: "surfaces come from the standard quadric catalog: spheres, planes, cylinders, cones, paraboloids, hyperboloids"
    diagnostic_exemplar:
      problem: 'Identify the level surface of $f(x, y, z) = x^2 + y^2 - z^2$ at $k = 4$, and at $k = 0$.'
      answer: '$k = 4$: the hyperboloid of one sheet $x^2 + y^2 - z^2 = 4$ with axis the $z$-axis. $k = 0$: the double cone $z^2 = x^2 + y^2$ with axis the $z$-axis.'
      answer_contract: {kind: none}
      solution_sketch: 'For $k > 0$ the equation $x^2 + y^2 - z^2 = k$ has one negative square and non-empty traces $z = c$ for every $c$, so it is a one-sheeted hyperboloid; at $k = 0$ it degenerates to $x^2 + y^2 = z^2$, the cone.'
    anki_seeds:
      - front: 'What is a level surface of $f(x, y, z)$?'
        back: 'The set of points in space where $f(x, y, z) = k$ for a fixed constant $k$.'
        type: basic
      - front: 'Why do we describe $f(x, y, z)$ with level surfaces instead of a graph?'
        back: 'Its graph $w = f(x,y,z)$ lives in four dimensions; level surfaces show the function inside $\mathbb{R}^3$.'
        type: basic

  - id: limits-along-paths
    name: "Limits Along Paths"
    core: false                # head of the terminal multivariable-limits branch
    difficulty: 0.68
    drill: false
    answer_kind: numeric
    expected_time_secs: 150
    prerequisites:
      - id: functions-several-variables
        weight: 0.6
        key: true
      - id: limit-laws
        weight: 0.6
        key: true
    knowledge_points:
      - id: kp1
        name: "Evaluating a limit along a given path"
        key_prerequisites: [functions-several-variables, limit-laws]
        step_check:
          step: 'Substitute $y = x^2$ into the function'
          question: 'Why can we substitute $y = x^2$ into the function to follow the path?'
          options:
            - 'Replacing $y$ by $x^2$ gives the same value as the limit at every point of the plane'
            - 'Each point of the path has $y = x^2$, so the function depends on $x$ only'
            - 'The path $y = x^2$ is the only one that ends at the origin'
            - 'Replacing $y$ by $x^2$ makes the denominator equal to zero for all $x$'
          answer: 'Each point of the path has $y = x^2$, so the function depends on $x$ only'
          why: 'Points of the parabola have the form $(x, x^2)$, so the function becomes a one-variable function of $x$, and the path limit is a one-variable limit as $x \to 0$.'
        try_first:
          problem: 'Find $\lim_{(x,y) \to (0,0)} \dfrac{x + y}{x}$ along the line $y = 2x$.'
          answer_contract: {"kind":"exact"}
          answer: '3'
          reveal: 'On the line $y = 2x$ the quotient is $\frac{3x}{x} = 3$ for every $x \ne 0$. Restricting the function to a path turns the limit into a one-variable limit.'
        exemplars:
          - problem: 'Find $\lim_{(x,y) \to (0,0)} \dfrac{xy}{x^2 + y^2}$ along the line $y = 2x$.'
            answer: '2/5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'On the line $y = 2x$ the function becomes $\frac{x \cdot 2x}{x^2 + (2x)^2} = \frac{2x^2}{5x^2}$. For $x \ne 0$ this is $\frac{2}{5}$, so the limit along the line is $\frac{2}{5}$.'
          - problem: 'Find $\lim_{(x,y) \to (0,0)} \dfrac{x^2 - y^2}{x^2 + y^2}$ along the line $y = 2x$.'
            answer: '-3/5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'On the line $y = 2x$ the function becomes $\frac{x^2 - 4x^2}{x^2 + 4x^2} = \frac{-3x^2}{5x^2}$. For $x \ne 0$ this is $-\frac{3}{5}$, so the limit along the line is $-\frac{3}{5}$.'
          - problem: 'Find $\lim_{(x,y) \to (0,0)} \dfrac{xy}{x^2 + y^2}$ along the parabola $y = x^2$.'
            answer: '0'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'On the parabola the function becomes $\frac{x \cdot x^2}{x^2 + x^4} = \frac{x^3}{x^2(1 + x^2)}$. For $x \ne 0$ this is $\frac{x}{1 + x^2}$, which approaches $0$ as $x \to 0$.'
          - problem: 'A robot drives towards a beacon at the origin along the line $y = x$. The signal it receives at the point $(x, y)$ is $S(x, y) = \dfrac{3xy}{x^2 + y^2}$. What value does the signal approach?'
            answer: '3/2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'On the line $y = x$ the signal is $\frac{3x \cdot x}{x^2 + x^2} = \frac{3x^2}{2x^2}$. For $x \ne 0$ this is $\frac{3}{2}$, so the signal approaches $\frac{3}{2}$.'
          - problem: 'Find $\lim_{(x,y) \to (0,0)} \dfrac{x^2 y}{x^4 + y^2}$ along the parabola $y = x^2$.'
            answer: '1/2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'On the parabola the function becomes $\frac{x^2 \cdot x^2}{x^4 + (x^2)^2} = \frac{x^4}{2x^4}$. For $x \ne 0$ this is $\frac{1}{2}$, so the limit along the parabola is $\frac{1}{2}$.'
          - problem: 'Sam finds $\lim_{(x,y) \to (0,0)} \dfrac{xy}{x^2 + y^2}$ along the line $y = 3x$ and writes $\frac{3}{4}$. What is the correct value?'
            answer: '3/10'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Sam wrote $y^2$ as $3x^2$ in the denominator, but $y^2 = (3x)^2 = 9x^2$. The function becomes $\frac{3x^2}{x^2 + 9x^2} = \frac{3x^2}{10x^2}$, so the limit is $\frac{3}{10}$.'
          - problem: 'Find $\lim_{(x,y) \to (0,0)} \dfrac{x^2 - y^2}{x^2 + y^2}$ along the line $y = 3x$.'
            answer: '-4/5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'On the line $y = 3x$ the function becomes $\frac{x^2 - 9x^2}{x^2 + 9x^2} = \frac{-8x^2}{10x^2}$. For $x \ne 0$ this is $-\frac{4}{5}$, so the limit along the line is $-\frac{4}{5}$.'
          - problem: 'A probe approaches the origin along the $x$-axis. It measures $T(x, y) = \dfrac{x^2 - y^2}{x^2 + y^2}$ at the point $(x, y)$. What value does the reading approach?'
            answer: '1'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'On the $x$-axis $y = 0$, so the reading is $\frac{x^2 - 0}{x^2 + 0}$. For $x \ne 0$ this equals $1$, so the reading approaches $1$.'
        constraints: "paths are lines y = mx, axes, or parabolas; the restricted limit is a one-variable computation"
      - id: kp2
        name: "The two-path test"
        key_prerequisites: [functions-several-variables, limit-laws]
        step_check:
          step: 'if they all agree, try a curve such as a parabola.'
          question: 'Why try a curve such as a parabola when every straight line gives the same value?'
          options:
            - 'Agreeing lines prove that the limit exists, and the parabola gives its value'
            - 'A parabola is the only kind of path on which a limit can fail to exist'
            - 'Agreeing lines prove nothing, since another path may give a new value'
            - 'A parabola reaches the origin faster than a line, which speeds up the test'
          answer: 'Agreeing lines prove nothing, since another path may give a new value'
          why: 'The limit must be the same along every path, not only along lines, so a curved path such as $y = x^2$ can expose a difference that all the lines miss.'
        exemplars:
          - problem: 'Does $\lim_{(x,y) \to (0,0)} \dfrac{xy}{x^2 + y^2}$ exist? Compare the values along $y = 0$ and along $y = x$.'
            answer: 'no'
            answer_contract: {"kind":"label","options":[["no","it does not exist","does not exist","DNE","the limit does not exist","limit does not exist","the limit does not exist."],["yes","it exists","the limit exists","exists"]]}
            solution_sketch: 'Along $y = 0$ the function is $0$, and along $y = x$ it is $\frac{x^2}{2x^2} = \frac{1}{2}$. The two path limits $0$ and $\frac{1}{2}$ differ, so the limit does not exist.'
          - problem: 'Let $f(x, y) = \dfrac{2xy^2}{x^2 + y^4}$. Find the limit of $f$ as $(x, y) \to (0, 0)$ along the parabola $x = y^2$ minus its limit along the line $y = 0$.'
            answer: '1'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'On the curve $x = y^2$ the function becomes $\frac{2y^2 \cdot y^2}{y^4 + y^4} = \frac{2y^4}{2y^4}$, which is $1$ for $y \ne 0$. Along $y = 0$ it is $0$, so the difference is $1 - 0 = 1$, and the two path limits disagree.'
          - problem: 'A sensor reads $R(x, y) = \dfrac{x^2}{x^2 + y^2}$ at the point $(x, y)$. A robot drives towards the origin along the line $y = x$. What reading does the sensor approach?'
            answer: '1/2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'On the line $y = x$ the reading is $\frac{x^2}{x^2 + x^2} = \frac{x^2}{2x^2}$. For $x \ne 0$ this is $\frac{1}{2}$, so the reading approaches $\frac{1}{2}$.'
          - problem: 'Let $f(x, y) = \dfrac{3x^2 + y^2}{x^2 + y^2}$. Find the limit of $f$ as $(x, y) \to (0, 0)$ along the line $y = 0$ minus its limit along the line $y = 2x$.'
            answer: '8/5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'On the line $y = 0$ the function is $\frac{3x^2}{x^2} = 3$. On the line $y = 2x$ it is $\frac{3x^2 + 4x^2}{x^2 + 4x^2} = \frac{7}{5}$, so the difference is $3 - \frac{7}{5} = \frac{8}{5}$.'
          - problem: 'Two robots drive towards the origin, one along the line $y = x$ and the other along the line $y = 2x$. Each receives the signal $R(x, y) = \dfrac{x^2 y}{x^2 + y^2}$. Do both signals approach the same value?'
            answer: 'yes'
            answer_contract: {"kind":"label","options":[["yes","they do","the same value","same value","they approach the same value","both approach the same value"],["no","they do not","different values"]]}
            solution_sketch: 'Along $y = x$ the signal is $\frac{x^3}{2x^2} = \frac{x}{2}$, and along $y = 2x$ it is $\frac{2x^3}{5x^2} = \frac{2x}{5}$. Both approach $0$, so they approach the same value.'
          - problem: 'Let $f(x, y) = \dfrac{xy}{x^2 + 2y^2}$. Find the limit of $f$ as $(x, y) \to (0, 0)$ along the line $y = x$ minus its limit along the line $y = 0$.'
            answer: '1/3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'On the line $y = x$ the function becomes $\frac{x^2}{x^2 + 2x^2} = \frac{x^2}{3x^2} = \frac{1}{3}$. Along $y = 0$ it is $0$, so the difference is $\frac{1}{3}$, and the two path limits disagree.'
          - problem: 'Sam finds that $\dfrac{x^2 - y^2}{x^2 + y^2}$ approaches $1$ along the $x$-axis and decides that the limit at the origin is $1$. Find the value approached along the $y$-axis, which shows that Sam is wrong.'
            answer: '-1'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'On the $y$-axis $x = 0$, so the function is $\frac{-y^2}{y^2}$. For $y \ne 0$ this is $-1$, which differs from $1$, so no limit exists.'
        constraints: "rational functions homogeneous of degree 0 (or needing one parabolic path); always exhibit two explicit paths"
    diagnostic_exemplar:
      problem: 'Determine whether $\lim_{(x,y) \to (0,0)} \dfrac{x^2 - y^2}{x^2 + y^2}$ exists.'
      answer: 'No: along $y = 0$ the limit is $1$; along $x = 0$ it is $-1$.'
      answer_contract: {kind: none}
      solution_sketch: 'The two coordinate-axis paths give different values, so no limit exists.'
    anki_seeds:
      - front: 'Two-path test for multivariable limits?'
        back: 'If two different paths into the point give different limits, the limit does not exist. (Agreeing paths prove nothing.)'
        type: basic
      - front: 'Can checking every straight line prove a multivariable limit exists?'
        back: 'No — e.g. $\frac{2xy^2}{x^2+y^4}$ is $0$ along every line but $1$ along $x = y^2$. Use squeeze/polar bounds instead.'
        type: basic

  - id: multivariable-limits-continuity
    name: "Multivariable Limits and Continuity"
    core: false                # terminal limits branch; nothing differentiates through it
    difficulty: 0.72
    drill: false
    answer_kind: numeric
    expected_time_secs: 180
    prerequisites:
      - id: limits-along-paths
        weight: 0.7
        key: true
      - id: continuity
        weight: 0.5
        key: true
      - id: limit-laws
        weight: 0.4
        key: false
    knowledge_points:
      - id: kp1
        name: "Limits that exist: substitution and algebra"
        key_prerequisites: [limit-laws, limits-along-paths]
        step_check:
          step: 'This is indeterminate, so substitution alone does not answer it.'
          question: 'Why does substituting $(2,2)$ not settle the limit?'
          options:
            - 'A denominator equal to $0$ always means that the limit does not exist'
            - '$\frac{0}{0}$ has no value, so the fraction must be simplified first'
            - 'Substitution is valid only for functions of a single variable'
            - 'Both parts equal $0$, so the limit of the quotient is $0$ itself'
          answer: '$\frac{0}{0}$ has no value, so the fraction must be simplified first'
          why: '$\frac{0}{0}$ is a signal, not a value: cancelling the common factor $x-y$ leaves $x+y$, which is continuous and gives $4$.'
        exemplars:
          - problem: 'Compute $\lim_{(x,y)\to(4,4)} \dfrac{x^2-y^2}{x-y}$, taken over points with $x \ne y$.'
            answer: '8'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'At $(4,4)$ both the numerator and the denominator are $0$, so substitution fails. For $x \ne y$ the fraction equals $x+y$, and substituting $(4,4)$ gives $4+4=8$.'
          - problem: 'Compute $\lim_{(x,y)\to(2,-1)} (x^2+xy-y^2)$.'
            answer: '1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The expression is a polynomial, so it is continuous and the limit is the value at the point. Substituting gives $4+(2)(-1)-1=1$.'
          - problem: 'Compute $\lim_{(x,y)\to(1,-1)} \dfrac{x^2-y^2}{x+y}$, taken over points with $x+y \ne 0$.'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Substitution gives $\frac{0}{0}$, so factor the numerator as $(x-y)(x+y)$ and cancel $x+y$. What is left is $x-y$, which equals $1-(-1)=2$ at the point.'
          - problem: 'Compute $\lim_{(x,y)\to(1,2)} (x^2y+3y)$.'
            answer: '8'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The expression is a polynomial, so the limit is its value at the point. Substituting gives $1\cdot 2+3\cdot 2=8$.'
          - problem: 'A thin metal plate has temperature $T(x,y)=\dfrac{x^2-9y^2}{x-3y}$ degrees Celsius at the point $(x,y)$, for $x \ne 3y$. What temperature do the points of the plate approach as they get closer and closer to $(6,2)$?'
            answer: '12'
            answer_contract: {"kind": "unit", "quantity": "temperature", "unit": "°C", "allow_omitted": true}
            solution_sketch: 'At $(6,2)$ the numerator and the denominator are both $0$. Factor the numerator as $(x-3y)(x+3y)$ and cancel $x-3y$ to get $x+3y$, which is $6+6=12$ at the point.'
          - problem: 'A thin plate has density $\rho(x,y)=\dfrac{x^2-9}{xy-3y}$ kilograms per square metre at the point $(x,y)$, where $y(x-3) \ne 0$. What density do the points near $(3,1)$ approach?'
            answer: '6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The density is a quotient that gives $\frac{0}{0}$ at $(3,1)$. Factor the numerator as $(x-3)(x+3)$ and the denominator as $y(x-3)$, cancel $x-3$, and substitute into $\frac{x+3}{y}$ to get $\frac{6}{1}=6$ kilograms per square metre.'
          - problem: 'Sam evaluates $\lim_{(x,y)\to(3,3)} \dfrac{x^2-y^2}{x-y}$, taken over points with $x \ne y$, by substituting $(3,3)$ and writes that the limit is $0$. What is the correct value of the limit?'
            answer: '6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Sam stopped at $\frac{0}{0}$, which is not a value. For $x \ne y$ the fraction equals $x+y$, and substituting $(3,3)$ gives $3+3=6$.'
          - problem: 'Compute $\lim_{(x,y)\to(1,1)} \dfrac{x^3-y^3}{x-y}$, taken over points with $x \ne y$.'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Factor $x^3-y^3=(x-y)(x^2+xy+y^2)$ and cancel $x-y$. The remaining polynomial $x^2+xy+y^2$ equals $1+1+1=3$ at $(1,1)$.'
        constraints: "continuous functions or a single factor cancellation; answers are small exact numbers; contexts give a plate temperature or density as a quotient"
      - id: kp2
        name: "Squeeze arguments"
        key_prerequisites: [limits-along-paths, limit-laws]
        step_check:
          step: 'Since $y^2 \le x^2 + y^2$, we get $\dfrac{y^2}{x^2 + y^2} \le 1$'
          question: 'Why is the fraction $\frac{y^2}{x^2+y^2}$ never larger than $1$?'
          options:
            - 'Both $x$ and $y$ are smaller than $1$ near the origin point, so it is'
            - 'Any fraction with a square in the numerator is always at most $1$'
            - 'The denominator is $y^2$ plus $x^2\ge0$, so it is $\ge y^2$'
            - 'The factor $|x|$ in front of the fraction forces it below $1$'
          answer: 'The denominator is $y^2$ plus $x^2\ge0$, so it is $\ge y^2$'
          why: 'Adding $x^2 \ge 0$ to $y^2$ can only make the denominator larger, so the fraction stays between $0$ and $1$ and the factor $|x|$ in front controls the size.'
        exemplars:
          - problem: 'Compute $\lim_{(x,y)\to(0,0)} \dfrac{x^2y}{x^2+y^2}$.'
            answer: '0'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Since $x^2 \le x^2+y^2$, we have $\left|\frac{x^2y}{x^2+y^2}\right| \le |y|$. As $|y| \to 0$ the squeeze theorem gives the limit $0$.'
          - problem: 'Compute $\lim_{(x,y)\to(0,0)} \left(3+\dfrac{x^2y}{x^2+y^2}\right)$.'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The limit laws split the sum into $3$ plus the limit of the fraction. The fraction satisfies $\left|\frac{x^2y}{x^2+y^2}\right| \le |y| \to 0$, so it tends to $0$ and the total is $3+0=3$.'
          - problem: 'Compute $\lim_{(x,y)\to(0,0)} \dfrac{x^4}{x^2+y^2}$.'
            answer: '0'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Write $\frac{x^4}{x^2+y^2}=x^2\cdot\frac{x^2}{x^2+y^2}$. The second factor is at most $1$, so the whole quotient is at most $x^2$ in size, and $x^2 \to 0$ squeezes the limit to $0$.'
          - problem: 'The temperature of a metal plate is $T(x,y)=20+\dfrac{x^2y}{x^2+y^2}$ degrees Celsius at every point $(x,y) \ne (0,0)$. What temperature do the points near the origin approach?'
            answer: '20'
            answer_contract: {"kind": "unit", "quantity": "temperature", "unit": "°C", "allow_omitted": true}
            solution_sketch: 'The fraction is squeezed by $\left|\frac{x^2y}{x^2+y^2}\right| \le |y|$, so it tends to $0$ at the origin. The temperature therefore approaches $20+0=20$ degrees Celsius.'
          - problem: 'The concentration of a dye in a pool is $C(x,y)=9+\dfrac{xy^2}{x^2+2y^2}$ grams per litre at every point $(x,y) \ne (0,0)$. What concentration do the points near the origin approach?'
            answer: '9'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Since $2y^2 \le x^2+2y^2$, the fraction satisfies $\left|\frac{xy^2}{x^2+2y^2}\right| \le \frac{|x|}{2}$, which tends to $0$. The concentration therefore approaches $9+0=9$ grams per litre.'
          - problem: 'Compute $\lim_{(x,y)\to(0,0)} \left(-1+\dfrac{x^3}{x^2+y^2}\right)$.'
            answer: '-1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The fraction satisfies $\left|\frac{x^3}{x^2+y^2}\right| = |x|\cdot\frac{x^2}{x^2+y^2} \le |x| \to 0$. The limit laws then give $-1+0=-1$.'
          - problem: 'Sam says that $\lim_{(x,y)\to(0,0)} \dfrac{x^3}{x^2+y^2}$ does not exist, because $\dfrac{x^2}{x^2+y^2}$ equals $1$ along the $x$-axis and $0$ along the $y$-axis. What is the limit of $\dfrac{x^3}{x^2+y^2}$?'
            answer: '0'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Sam forgot the extra factor $x$. Since $\left|\frac{x^3}{x^2+y^2}\right| = |x|\cdot\frac{x^2}{x^2+y^2} \le |x|$, the squeeze theorem gives the limit $0$.'
          - problem: 'Compute $\lim_{(x,y)\to(0,0)} \left(7+\dfrac{x^3}{x^2+4y^2}\right)$.'
            answer: '7'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Since $x^2 \le x^2+4y^2$, we have $\left|\frac{x^3}{x^2+4y^2}\right| \le |x| \to 0$. The limit is therefore $7+0=7$.'
        constraints: "numerator degree strictly exceeds denominator degree; the bounding factor is |x| or |y|; contexts add a constant to the fraction"
      - id: kp3
        name: "Continuity and deciding existence"
        key_prerequisites: [continuity, limits-along-paths]
        step_check:
          step: 'but a guess is not a proof'
          question: 'Why is the guess from the degrees of the numerator and denominator not enough?'
          options:
            - 'Degrees describe only polynomials, so they never apply near the origin'
            - 'Guesses from degrees are always wrong when the limit turns out to be $0$'
            - 'The limit may depend on the order of the factors in the numerator'
            - 'A bound valid for every approach rules out other path values'
          answer: 'A bound valid for every approach rules out other path values'
          why: 'Testing degrees or a few paths cannot rule out a different value on another path; an inequality such as $|f| \le y^4$ covers every path at once.'
        exemplars:
          - problem: 'Does $\lim_{(x,y)\to(0,0)} \dfrac{xy}{x^2+y^2}$ exist?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["no", "it does not exist", "does not exist", "the limit does not exist", "no, the limit does not exist", "DNE", "limit does not exist", "no it does not exist"], ["yes", "it exists", "exists", "the limit exists", "yes, the limit exists", "does exist", "yes it exists", "limit exists"]]}
            solution_sketch: 'Along the $x$-axis ($y=0$) the quotient is $0$ at every point. Along the line $y=x$ it is $\frac{x^2}{2x^2}=\frac12$ at every point, so two paths give different values and the limit does not exist.'
          - problem: 'The function $f(x,y)=\dfrac{1}{x^2+y^2-1}$ is continuous everywhere except on one circle. What is the radius of that circle?'
            answer: '1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A quotient of continuous functions is continuous where the denominator is not $0$. The denominator is $0$ on $x^2+y^2=1$, a circle of radius $1$.'
          - problem: 'Let $f(x,y)=\dfrac{xy}{x^2+y^2}$. At the points of the line $y=3x$ with $x \ne 0$, $f$ has one constant value. What is it?'
            answer: '3/10'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Substitute $y=3x$: the numerator is $3x^2$ and the denominator is $x^2+9x^2=10x^2$. The quotient is $\frac{3}{10}$ at every such point.'
          - problem: 'The function $f(x,y)=\ln(x+y)$ is continuous on the half-plane $x+y>c$. Find $c$.'
            answer: '0'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The logarithm is continuous wherever its argument is positive. The condition $x+y>0$ describes the half-plane, so $c=0$.'
          - problem: 'A sensor at the origin reports the reading $R(x,y)=\dfrac{1}{25-x^2-y^2}$ at the point $(x,y)$, with $x$ and $y$ in metres. The reading is undefined on a circle around the sensor. What is the radius of this circle?'
            answer: '5'
            answer_contract: {"kind": "unit", "quantity": "length", "unit": "m", "allow_omitted": true}
            solution_sketch: 'The reading is undefined where the denominator $25-x^2-y^2$ equals $0$. That is the circle $x^2+y^2=25$, whose radius is $5$ metres.'
          - problem: 'The function $f(x,y)=\dfrac{1}{x^2-y}$ is continuous everywhere except on the curve $y=x^2$. What is the value of $y$ at the point of this curve where $x=-3$?'
            answer: '9'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The denominator $x^2-y$ is $0$ exactly on the curve $y=x^2$. At $x=-3$ this gives $y=(-3)^2=9$.'
          - problem: 'Does $\lim_{(x,y)\to(0,0)} \dfrac{x^3y}{x^4+y^2}$ exist?'
            answer: 'yes'
            answer_contract: {"kind": "label", "options": [["no", "it does not exist", "does not exist", "the limit does not exist", "no, the limit does not exist", "DNE", "limit does not exist", "no it does not exist"], ["yes", "it exists", "exists", "the limit exists", "yes, the limit exists", "does exist", "yes it exists", "limit exists"]]}
            solution_sketch: 'Since $x^4+y^2 \ge 2x^2|y|$, we get $\left|\frac{x^3y}{x^4+y^2}\right| \le \frac{|x|}{2}$. This bound tends to $0$ along every approach, so the limit exists and equals $0$.'
          - problem: 'Compute $\lim_{(x,y)\to(0,0)} \dfrac{x^2+y^2}{\sin\left(2(x^2+y^2)\right)}$.'
            answer: '1/2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Put $u=x^2+y^2$, which tends to $0$ through positive values. Then the quotient is $\frac{u}{\sin 2u}$, and since $\frac{\sin 2u}{2u} \to 1$ the limit is $\frac12$.'
          - problem: 'A lake has depth $d(x,y)=\sqrt{x-y^2}$ metres at the point $(x,y)$, where $x$ and $y$ are kilometres east and north of a lighthouse. The depth is defined only where $x-y^2 \ge 0$. How far east of the lighthouse, in kilometres, is the shoreline on the line $y=3$?'
            answer: '9'
            answer_contract: {"kind": "unit", "quantity": "length", "unit": "km", "allow_omitted": true}
            solution_sketch: 'The shoreline is where the argument of the root equals $0$, so $x=y^2$. On the line $y=3$ this gives $x=3^2=9$ kilometres east.'
          - problem: 'Let $f(x,y)=\dfrac{x^2y}{x^4+y^2}$. At the points of the parabola $y=x^2$ with $x \ne 0$, $f$ has one constant value. What is it?'
            answer: '1/2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Substitute $y=x^2$: the numerator is $x^4$ and the denominator is $x^4+x^4=2x^4$. The quotient is $\frac12$ at every such point, while along the $x$-axis it is $0$, so the limit at the origin does not exist.'
        constraints: "continuity questions reduce to where a denominator or log/root argument fails; existence decisions name two path values or an explicit squeeze bound"
    diagnostic_exemplar:
      problem: 'Determine whether $\lim_{(x,y) \to (0,0)} \dfrac{x y^3}{x^2 + y^2}$ exists, and find it if so.'
      answer: 'Yes; the limit is $0$.'
      answer_contract: {kind: none}
      solution_sketch: '$\left|\frac{xy^3}{x^2+y^2}\right| = |xy| \cdot \frac{y^2}{x^2+y^2} \le |xy| \to 0$, so the squeeze gives $0$.'
    anki_seeds:
      - front: 'Standard squeeze bounds at $(0,0)$: $\dfrac{x^2}{x^2 + y^2} \le$ {{c1::$1$}} and $|x| \le$ {{c2::$\sqrt{x^2 + y^2}$}}.'
        back: '$1$ / $\sqrt{x^2+y^2}$'
        type: cloze
      - front: 'Where are rational functions of $x$ and $y$ continuous?'
        back: 'Everywhere the denominator is nonzero.'
        type: basic

  - id: multivariable-limits-polar
    name: "Multivariable Limits in Polar Coordinates"
    core: false                # special-case limit technique; terminal
    difficulty: 0.74
    drill: false
    answer_kind: numeric
    expected_time_secs: 150
    prerequisites:
      - id: multivariable-limits-continuity
        weight: 0.7
        key: true
      - id: polar-coordinates
        weight: 0.5
        key: true
      - id: lhopitals-rule
        weight: 0.0
        key: false
    knowledge_points:
      - id: kp1
        name: "Polar substitution for limits at the origin"
        key_prerequisites: [multivariable-limits-continuity, polar-coordinates]
        try_first:
          problem: 'Let $x=r\cos\theta$ and $y=r\sin\theta$. What is the value of $x^2+y^2$ when $r=3$?'
          answer_contract: {"kind": "exact"}
          answer: '9'
          reveal: 'Whatever $\theta$ is, $x^2+y^2=r^2\cos^2\theta+r^2\sin^2\theta=r^2=9$. Polar coordinates turn $x^2+y^2$ into $r^2$, and a point near the origin becomes a small $r$.'
        step_check:
          step: 'The rewritten expression $2r^4\ln r$ contains no $\theta$, so the value is the same for every direction of approach.'
          question: 'Why does the absence of $\theta$ in $2r^4\ln r$ help?'
          options:
            - 'The expression is then a constant, so no limit needs to be taken'
            - 'The limit then has to be found along the $x$-axis only'
            - 'The value depends only on closeness, not on direction'
            - 'Then $r$ may be replaced by $0$ at once, without any care for the form'
          answer: 'The value depends only on closeness, not on direction'
          why: 'With no $\theta$ left, every path into the origin gives the same one-variable limit in $r$, so one calculation covers all paths.'
        exemplars:
          - problem: 'Use polar coordinates to compute $\lim_{(x,y)\to(0,0)} \dfrac{x^3}{x^2+y^2}$.'
            answer: '0'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'With $x=r\cos\theta$ and $y=r\sin\theta$ the quotient becomes $r\cos^3\theta$. Since $|r\cos^3\theta| \le r$ and $r \to 0$ for every $\theta$, the limit is $0$.'
          - problem: 'Use polar coordinates to compute $\lim_{(x,y)\to(0,0)} \dfrac{\sin(x^2+y^2)}{x^2+y^2}$.'
            answer: '1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Since $x^2+y^2=r^2$, the expression is $\frac{\sin r^2}{r^2}$, which has no $\theta$ in it. As $r \to 0^+$ this tends to $1$.'
          - problem: 'Use polar coordinates to compute $\lim_{(x,y)\to(0,0)} \dfrac{x^2+y^2}{\sqrt{x^2+y^2+1}-1}$.'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The expression is $\frac{r^2}{\sqrt{r^2+1}-1}$. Multiplying top and bottom by $\sqrt{r^2+1}+1$ gives $\sqrt{r^2+1}+1$, which tends to $1+1=2$ as $r \to 0^+$.'
          - problem: 'Use polar coordinates to compute $\lim_{(x,y)\to(0,0)} \dfrac{xy}{\sqrt{x^2+y^2}}$.'
            answer: '0'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The quotient is $\frac{r^2\cos\theta\sin\theta}{r}=r\cos\theta\sin\theta$. Its size is at most $r$, which tends to $0$ for every $\theta$, so the limit is $0$.'
          - problem: 'The signal strength near a transmitter at the origin is $S(x,y)=\dfrac{5\left(1-e^{-(x^2+y^2)}\right)}{x^2+y^2}$ watts at the point $(x,y) \ne (0,0)$. What strength do the points close to the transmitter approach?'
            answer: '5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'In polar coordinates $S=\frac{5(1-e^{-r^2})}{r^2}$, which does not depend on $\theta$. Since $1-e^{-r^2} \approx r^2$ for small $r$, the strength tends to $5$ watts.'
          - problem: 'Use polar coordinates to compute $\lim_{(x,y)\to(0,0)} \dfrac{1-\cos\sqrt{x^2+y^2}}{x^2+y^2}$.'
            answer: '1/2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The expression is $\frac{1-\cos r}{r^2}$, free of $\theta$. By l''Hôpital''s rule, $\frac{\sin r}{2r} \to \frac12$ as $r \to 0^+$.'
          - problem: 'Use polar coordinates to compute $\lim_{(x,y)\to(0,0)} (x^2+y^2)\ln(x^2+y^2)$.'
            answer: '0'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The expression is $r^2\ln r^2=2r^2\ln r$. Writing it as $\frac{2\ln r}{r^{-2}}$ and applying l''Hôpital''s rule gives $-r^2 \to 0$ as $r \to 0^+$.'
          - problem: 'Sam writes $\dfrac{x^2y}{x^2+y^2}$ in polar coordinates as $r\cos^2\theta\sin\theta$ and says the limit at the origin does not exist because the result depends on $\theta$. What is the limit?'
            answer: '0'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Sam is right that the expression depends on $\theta$, but it is also multiplied by $r$. Since $|r\cos^2\theta\sin\theta| \le r \to 0$ for every $\theta$, the limit is $0$.'
          - problem: 'A thin plate has density $\rho(x,y)=\dfrac{x^2y^2}{x^2+y^2}$ kilograms per square metre at every point $(x,y) \ne (0,0)$. What density do the points near the origin approach?'
            answer: '0'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'In polar coordinates $\rho=r^2\cos^2\theta\sin^2\theta$, which is at most $r^2$ in size. Since $r^2 \to 0$ for every $\theta$, the density approaches $0$ kilograms per square metre.'
        constraints: "after substitution the expression is bounded by a function of r alone tending to 0, or is a one-variable limit in r (sin(r^2)/r^2, r^2 ln r) evaluated explicitly"
      - id: kp2
        name: "Detecting angle dependence"
        key_prerequisites: [multivariable-limits-continuity, polar-coordinates]
        step_check:
          step: 'Cancel the common factor $r^2$ (valid for $r > 0$)'
          question: 'Why is it allowed to cancel $r^2$ here?'
          options:
            - 'Near the origin, other points have $r>0$, so $r^2 \ne 0$'
            - 'Because $r^2$ tends to $0$, it can be dropped from any fraction'
            - 'Because $\cos^2\theta+\sin^2\theta=1$ removes every power of $r$'
            - 'Because $r$ always equals $1$ on the unit circle'
          answer: 'Near the origin, other points have $r>0$, so $r^2 \ne 0$'
          why: 'A limit at the origin looks only at points other than the origin itself, where $r>0$, so dividing top and bottom by $r^2$ is legitimate.'
        exemplars:
          - problem: 'Write $\dfrac{xy}{x^2+y^2}$ in polar coordinates as a function of $\theta$.'
            answer: 'sin(2theta)/2'
            answer_contract: {"kind": "function", "vars": ["theta"]}
            solution_sketch: 'With $x=r\cos\theta$ and $y=r\sin\theta$ the quotient is $\frac{r^2\cos\theta\sin\theta}{r^2}=\cos\theta\sin\theta$. By the double-angle identity this equals $\frac{\sin 2\theta}{2}$.'
          - problem: 'Does $\lim_{(x,y)\to(0,0)} \dfrac{x^2-y^2}{x^2+y^2}$ exist?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["no", "it does not exist", "does not exist", "the limit does not exist", "no, the limit does not exist", "DNE", "limit does not exist", "no it does not exist"], ["yes", "it exists", "exists", "the limit exists", "yes, the limit exists", "does exist", "yes it exists", "limit exists"]]}
            solution_sketch: 'In polar coordinates the quotient is $\cos^2\theta-\sin^2\theta=\cos 2\theta$. It is $1$ for $\theta=0$ and $-1$ for $\theta=\frac{\pi}{2}$, so the value depends on the direction and the limit does not exist.'
          - problem: 'What constant value does $\dfrac{xy}{x^2+y^2}$ take at every point, other than the origin, on the ray $\theta=\dfrac{\pi}{3}$?'
            answer: 'sqrt(3)/4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'On a ray the quotient equals its polar form $\frac{\sin 2\theta}{2}$. At $\theta=\frac{\pi}{3}$ this is $\frac{\sin(2\pi/3)}{2}=\frac{\sqrt3/2}{2}=\frac{\sqrt3}{4}$.'
          - problem: 'Two hikers walk toward a monitoring station at the origin, one along the positive $x$-axis and the other along the positive $y$-axis. At the point $(x,y)$ the station records the reading $R(x,y)=\dfrac{x^2-y^2}{x^2+y^2}$. By how much do the values approached by the two readings differ?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'In polar form $R=\cos 2\theta$. Along the $x$-axis, $\theta=0$ and $R=1$; along the $y$-axis, $\theta=\frac{\pi}{2}$ and $R=-1$. The difference is $1-(-1)=2$.'
          - problem: 'Sam finds that $\dfrac{xy}{x^2+y^2}$ equals $0$ along the $x$-axis and along the $y$-axis. What value does it take along the line $y=x$ (for $x \ne 0$)?'
            answer: '1/2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'On the line $y=x$ the numerator is $x^2$ and the denominator is $2x^2$. The quotient is $\frac12$, which differs from Sam''s $0$, so the limit at the origin does not exist.'
          - problem: 'Write $\dfrac{x^2+y^2}{x^2+2y^2}$ in polar coordinates as a function of $\theta$.'
            answer: '1/(1+sin(theta)^2)'
            answer_contract: {"kind": "function", "vars": ["theta"]}
            solution_sketch: 'The numerator is $r^2$ and the denominator is $r^2(\cos^2\theta+2\sin^2\theta)=r^2(1+\sin^2\theta)$. Cancelling $r^2$ leaves $\frac{1}{1+\sin^2\theta}$.'
          - problem: 'Write $\dfrac{x^2-2xy-y^2}{x^2+y^2}$ in polar coordinates as a function of $\theta$.'
            answer: 'cos(2theta)-sin(2theta)'
            answer_contract: {"kind": "function", "vars": ["theta"]}
            solution_sketch: 'The quotient is $\cos^2\theta-2\cos\theta\sin\theta-\sin^2\theta$. Since $\cos^2\theta-\sin^2\theta=\cos 2\theta$ and $2\cos\theta\sin\theta=\sin 2\theta$, this equals $\cos 2\theta-\sin 2\theta$.'
          - problem: 'The temperature of a plate is $T(x,y)=\dfrac{3x^2+5y^2}{x^2+y^2}$ degrees Celsius at every point $(x,y) \ne (0,0)$. What temperature do the points of the positive $y$-axis near the origin have?'
            answer: '5'
            answer_contract: {"kind": "unit", "quantity": "temperature", "unit": "°C", "allow_omitted": true}
            solution_sketch: 'On the positive $y$-axis, $x=0$ and $y>0$, so $T=\frac{5y^2}{y^2}=5$. The temperature is $5$ degrees Celsius at every such point, while along the $x$-axis it is $3$, so the limit at the origin does not exist.'
        constraints: "homogeneous degree-0 quotients whose polar form is a pure function of theta; values along rays and axes"
    diagnostic_exemplar:
      problem: 'Use polar coordinates to decide whether $\lim_{(x,y) \to (0,0)} \dfrac{xy}{x^2 + 2y^2}$ exists.'
      answer: 'No, the limit does not exist.'
      answer_contract: {kind: none}
      solution_sketch: 'In polar coordinates the quotient is $\dfrac{r^2\cos\theta\sin\theta}{r^2(\cos^2\theta + 2\sin^2\theta)} = \dfrac{\cos\theta\,\sin\theta}{1 + \sin^2\theta}$: independent of $r$ but varying with $\theta$ (it equals $0$ along $\theta = 0$ and $\tfrac{1}{3}$ along $\theta = \pi/4$), so the value depends on the direction of approach.'
    anki_seeds:
      - front: 'Polar substitution for limits at the origin?'
        back: '$x = r\cos\theta$, $y = r\sin\theta$, so $x^2 + y^2 = r^2$ and $(x,y) \to (0,0)$ becomes $r \to 0^+$.'
        type: basic
      - front: 'When does the polar method prove a limit exists?'
        back: 'When $|f|$ is bounded by a function of $r$ alone that tends to $0$; if the polar form depends on $\theta$ but not $r$, the limit fails.'
        type: basic

  - id: first-order-partial-derivatives
    name: "First-Order Partial Derivatives"
    core: true
    difficulty: 0.58
    drill: false
    answer_kind: expression
    expected_time_secs: 100
    prerequisites:
      - id: evaluating-multivariable-functions
        weight: 0.6
        key: true
      - id: derivatives-of-polynomials
        weight: 0.6
        key: true
      - id: product-quotient-rules
        weight: 0.4
        key: false
    knowledge_points:
      - id: kp1
        name: "Partials of polynomials"
        key_prerequisites: [evaluating-multivariable-functions, derivatives-of-polynomials]
        try_first:
          problem: 'Let $f(x,y)=x^2y$. Fix $y=3$ and write $g(x)=f(x,3)$. What is $g''(2)$?'
          answer_contract: {"kind": "exact"}
          answer: '12'
          reveal: 'With $y$ fixed at $3$, $g(x)=3x^2$, so $g''(x)=6x$ and $g''(2)=12$. This is exactly $f_x(2,3)$: a partial derivative is an ordinary derivative with the other variable frozen.'
        step_check:
          step: 'the term $4x^2 y^3$ has constant factor $4y^3$'
          question: 'Why is $y^3$ treated as a constant factor when finding $f_x$?'
          options:
            - 'Powers of $y$ are always too large for the power rule'
            - 'Differentiating in $x$ removes every $y$ from the term'
            - 'Only $x$ varies, so $y$ and its powers act as fixed numbers'
            - 'Constant factors are always dropped from a derivative of any kind'
          answer: 'Only $x$ varies, so $y$ and its powers act as fixed numbers'
          why: '$f_x$ measures the change when $x$ alone moves, so $4y^3$ is a fixed multiplier, exactly like the $4$ in $4x^2$.'
        exemplars:
          - problem: 'Let $f(x,y)=x^3y^2+2x-y$. Find $f_x$.'
            answer: '3x^2y^2+2'
            answer_contract: {"kind": "function", "vars": ["x", "y"]}
            solution_sketch: 'Treat $y$ as a constant and differentiate in $x$. The term $x^3y^2$ gives $3x^2y^2$, the term $2x$ gives $2$, and $-y$ gives $0$.'
          - problem: 'Let $f(x,y)=5x^2y+2xy^3-7y$. Find $f_y$.'
            answer: '5x^2+6xy^2-7'
            answer_contract: {"kind": "function", "vars": ["x", "y"]}
            solution_sketch: 'Treat $x$ as a constant and differentiate in $y$. The three terms give $5x^2$, $6xy^2$ and $-7$.'
          - problem: 'Let $f(x,y)=x^2y^3$. Compute $f_y(1,2)$.'
            answer: '12'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Treating $x$ as a constant, $f_y=3x^2y^2$. At $(1,2)$ this is $3\cdot 1\cdot 4=12$.'
          - problem: 'A factory''s daily output is $Q(x,y)=3x^2y-xy+10$ units, where $x$ is the litres of a chemical used and $y$ is the hours of labour. Find $Q_y$.'
            answer: '3x^2-x'
            answer_contract: {"kind": "function", "vars": ["x", "y"]}
            solution_sketch: 'To find $Q_y$ hold $x$ constant and differentiate in $y$. The term $3x^2y$ gives $3x^2$, the term $-xy$ gives $-x$, and the constant $10$ gives $0$.'
          - problem: 'A box has a square base of side $x$ metres and height $y$ metres, so its volume is $V(x,y)=x^2y$ cubic metres. When $x=3$ and $y=5$, how many cubic metres of volume are added per metre of extra base side, with the height unchanged?'
            answer: '30'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'With the height fixed, the rate of change of volume with respect to $x$ is $V_x=2xy$. At $x=3$, $y=5$ this is $2\cdot 3\cdot 5=30$ cubic metres per metre.'
          - problem: 'Let $f(x,y)=2xy^4-x^3+5$. Compute $f_y(2,1)$.'
            answer: '16'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Holding $x$ constant, $f_y=8xy^3$, since $-x^3+5$ has no $y$ in it. At $(2,1)$ this is $8\cdot 2\cdot 1=16$.'
          - problem: 'Sam finds $f_x$ for $f(x,y)=x^2y^3$ and writes $6xy^2$. What is the correct $f_x$?'
            answer: '2xy^3'
            answer_contract: {"kind": "function", "vars": ["x", "y"]}
            solution_sketch: 'Sam differentiated $y^3$ as well, but $y$ is a constant when finding $f_x$. Only $x^2$ changes, giving $2x\cdot y^3=2xy^3$.'
          - problem: 'Let $f(x,y)=x^5-3x^2y^2+y$. Find $f_x$.'
            answer: '5x^4-6xy^2'
            answer_contract: {"kind": "function", "vars": ["x", "y"]}
            solution_sketch: 'Treat $y$ as a constant. The term $x^5$ gives $5x^4$, the term $-3x^2y^2$ gives $-6xy^2$, and the term $y$ gives $0$.'
          - problem: 'The revenue of a shop is $R(x,y)=kx^2y+y$ thousand dollars, where $k$ is a constant, $x$ is the advertising spend and $y$ is the number of staff. At $x=1$ and $y=3$ the rate of change of revenue with respect to $x$ is $12$. Find $k$.'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The rate of change with respect to $x$ is $R_x=2kxy$. At $(1,3)$ this is $6k$, and setting $6k=12$ gives $k=2$.'
        constraints: "polynomial in x, y with integer coefficients, total degree at most 5; contexts include a rate and a constant to solve for"
      - id: kp2
        name: "The limit definition and notation"
        key_prerequisites: [derivatives-of-polynomials]
        step_check:
          step: 'hold $y$ fixed at $3$'
          question: 'Why is $y$ held fixed at $3$ while $x$ changes to $1+h$?'
          options:
            - 'Because $y=3$ makes the function simpler to expand out'
            - 'Because only $x$ changes in $f_x$, so $y$ must not move'
            - 'Because the limit of $h$ as it shrinks is equal to $3$'
            - 'Because both variables must change by the same amount $h$'
          answer: 'Because only $x$ changes in $f_x$, so $y$ must not move'
          why: 'A partial derivative isolates one input; if $y$ also moved, the quotient would mix the effects of both inputs.'
        exemplars:
          - problem: 'For $f(x,y)=x^2-2xy$, use the limit definition to compute $f_x(1,2)$.'
            answer: '-2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Hold $y=2$ and form $\frac{f(1+h,2)-f(1,2)}{h}=\frac{(1+h)^2-4(1+h)+3}{h}=\frac{h^2-2h}{h}=h-2$. As $h \to 0$ this tends to $-2$.'
          - problem: 'Let $f(x,y)=xy^2$. Use the limit definition of $f_y$ to compute $f_y(2,1)$.'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Hold $x=2$ and form $\frac{f(2,1+h)-f(2,1)}{h}=\frac{2(1+h)^2-2}{h}=4+2h$. As $h \to 0$ this tends to $4$.'
          - problem: 'Let $f(x,y)=3x^2-xy+y^2$. Use the limit definition to find $\dfrac{\partial f}{\partial x}$.'
            answer: '6x-y'
            answer_contract: {"kind": "function", "vars": ["x", "y"]}
            solution_sketch: 'Hold $y$ fixed and form $\frac{f(x+h,y)-f(x,y)}{h}=\frac{6xh+3h^2-hy}{h}=6x+3h-y$. As $h \to 0$ this tends to $6x-y$.'
          - problem: 'A hill has height $H(x,y)=100-x^2-2y^2$ metres above sea level at the point $(x,y)$, where $x$ and $y$ are kilometres east and north of a marker. Use the limit definition of $\dfrac{\partial H}{\partial x}$ to find the slope of the hill, in metres per kilometre, at $(1,2)$ in the eastward direction.'
            answer: '-2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Hold $y=2$ and form $\frac{H(1+h,2)-H(1,2)}{h}=\frac{-(1+h)^2+1}{h}=-2-h$. As $h \to 0$ this tends to $-2$, so the height falls by $2$ metres per kilometre going east.'
          - problem: 'Let $f(x,y)=x^2+5xy+y^2$. Use the limit definition of $f_y$ to compute $f_y(1,2)$.'
            answer: '9'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Hold $x=1$ and form $\frac{f(1,2+h)-f(1,2)}{h}$. Since $f(1,2+h)=15+9h+h^2$ and $f(1,2)=15$, the quotient is $9+h$, which tends to $9$.'
          - problem: 'Let $z=2x^2+3y^2-xy$. Use the limit definition to find $\dfrac{\partial z}{\partial y}$.'
            answer: '6y-x'
            answer_contract: {"kind": "function", "vars": ["x", "y"]}
            solution_sketch: 'Hold $x$ fixed and form $\frac{z(x,y+h)-z(x,y)}{h}=\frac{6yh+3h^2-xh}{h}=6y+3h-x$. As $h \to 0$ this tends to $6y-x$.'
          - problem: 'Let $f(x,y)=x^2-3xy+2y^2$. Use the limit definition to compute $f_x(-1,2)$.'
            answer: '-8'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Hold $y=2$. Then $f(-1,2)=15$ and $f(-1+h,2)=15-8h+h^2$, so the quotient is $-8+h$. As $h \to 0$ this tends to $-8$.'
          - problem: 'Sam differentiates $z=x^2+3xy+y^2$ with respect to $y$ and writes $\dfrac{\partial z}{\partial y}=2x+3x+2y$. What is the correct $\dfrac{\partial z}{\partial y}$?'
            answer: '3x+2y'
            answer_contract: {"kind": "function", "vars": ["x", "y"]}
            solution_sketch: 'Sam also differentiated $x^2$, but $x$ is held constant when differentiating in $y$, so that term gives $0$. Only $3xy$ and $y^2$ change, giving $3x+2y$.'
          - problem: 'A metal sheet has temperature $T(x,y)=x^2+xy$ degrees Celsius at the point $(x,y)$, with $x$ and $y$ in metres. Use the limit definition to find how many degrees per metre the temperature changes in the $x$-direction at $(2,1)$.'
            answer: '5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Hold $y=1$ and form $\frac{T(2+h,1)-T(2,1)}{h}=\frac{5h+h^2}{h}=5+h$. As $h \to 0$ this tends to $5$ degrees per metre.'
        constraints: "quadratic f so the difference quotient simplifies by cancellation; also test the equivalent notations for the partial derivative (∂z/∂x, ∂f/∂x, f_x), never the straight-d dz/dx of one-variable calculus"
      - id: kp3
        name: "Products, quotients, and three variables"
        key_prerequisites: [product-quotient-rules, evaluating-multivariable-functions]
        step_check:
          step: 'Since $y$ is a constant, $u_x = 2xy$ and $v_x = 1$'
          question: 'Why is $v_x=1$ for $v=x-y$?'
          options:
            - 'Subtracting makes the derivative equal to the first term of the quotient'
            - 'Because $y$ also depends on $x$, it contributes another $1$'
            - 'Every denominator has derivative $1$ in the quotient rule'
            - 'The term $x$ has derivative $1$, and the constant $y$ contributes $0$'
          answer: 'The term $x$ has derivative $1$, and the constant $y$ contributes $0$'
          why: '$\frac{\partial}{\partial x}(x-y)=1-0=1$, because $y$ does not change when only $x$ moves.'
        exemplars:
          - problem: 'Let $f(x,y)=\dfrac{xy}{x+y}$. Find $f_x$.'
            answer: 'y^2/(x+y)^2'
            answer_contract: {"kind": "function", "vars": ["x", "y"]}
            solution_sketch: 'Apply the quotient rule in $x$ with $y$ constant: $\frac{y(x+y)-xy}{(x+y)^2}$. The numerator simplifies to $y^2$.'
          - problem: 'Let $f(x,y,z)=x^2y+yz^3$. Find $f_z$.'
            answer: '3yz^2'
            answer_contract: {"kind": "function", "vars": ["x", "y", "z"]}
            solution_sketch: 'Both $x$ and $y$ are held constant, and only the term $yz^3$ contains $z$. Its derivative is $3yz^2$.'
          - problem: 'Let $f(x,y)=\dfrac{x^2y}{x+y}$. Find $f_y$.'
            answer: 'x^3/(x+y)^2'
            answer_contract: {"kind": "function", "vars": ["x", "y"]}
            solution_sketch: 'Hold $x$ constant and apply the quotient rule in $y$: $x^2\cdot\frac{(x+y)-y}{(x+y)^2}$. The numerator simplifies to $x^3$.'
          - problem: 'Let $f(x,y,z)=x^2yz^2+y^3z$. Find $f_y$.'
            answer: 'x^2z^2+3y^2z'
            answer_contract: {"kind": "function", "vars": ["x", "y", "z"]}
            solution_sketch: 'Hold $x$ and $z$ constant and differentiate each term in $y$. The first term gives $x^2z^2$ and the second gives $3y^2z$.'
          - problem: 'Let $f(x,y)=x^2e^y+y^3$. Find $f_x$.'
            answer: '2x e^y'
            answer_contract: {"kind": "function", "vars": ["x", "y"]}
            solution_sketch: 'Hold $y$ constant, so $e^y$ is a constant factor. The term $x^2e^y$ gives $2xe^y$ and $y^3$ gives $0$.'
          - problem: 'Let $f(x,y)=\dfrac{x^2+y^2}{x+y}$. Find $f_x$.'
            answer: '(x^2+2xy-y^2)/(x+y)^2'
            answer_contract: {"kind": "function", "vars": ["x", "y"]}
            solution_sketch: 'Apply the quotient rule in $x$: $\frac{2x(x+y)-(x^2+y^2)}{(x+y)^2}$. The numerator simplifies to $x^2+2xy-y^2$.'
          - problem: 'A mixture contains $x$ millilitres of a drug and $y$ millilitres of saline. Its concentration is $C(x,y)=\dfrac{100x}{x+y}$ percent. Find $\dfrac{\partial C}{\partial x}$.'
            answer: '100y/(x+y)^2'
            answer_contract: {"kind": "function", "vars": ["x", "y"]}
            solution_sketch: 'Apply the quotient rule in $x$ with $y$ constant: $\frac{100(x+y)-100x}{(x+y)^2}$. The numerator simplifies to $100y$.'
          - problem: 'The pressure of a gas is $P(n,t,v)=\dfrac{8nt}{v}$, where $n$ is the amount of gas, $t$ the temperature and $v$ the volume. Find $\dfrac{\partial P}{\partial v}$.'
            answer: '-8nt/v^2'
            answer_contract: {"kind": "function", "vars": ["n", "t", "v"]}
            solution_sketch: 'Hold $n$ and $t$ constant, so $P=8nt\cdot v^{-1}$. The power rule gives $-8nt\cdot v^{-2}=-\frac{8nt}{v^2}$.'
          - problem: 'Let $f(x,y)=\dfrac{x}{x+y}$. Compute $f_x(1,3)$.'
            answer: '3/16'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The quotient rule in $x$ gives $f_x=\frac{(x+y)-x}{(x+y)^2}=\frac{y}{(x+y)^2}$. At $(1,3)$ this is $\frac{3}{16}$.'
        constraints: "one quotient-rule layer at most; three-variable examples are polynomial or a single quotient; e^y appears as a constant factor"
    diagnostic_exemplar:
      problem: 'Let $f(x, y, z) = \dfrac{xy}{x + z}$. Find $f_x$.'
      answer: '$yz/(x + z)^2$'
      solution_sketch: 'Treat $y$ and $z$ as constants and use the quotient rule: $f_x = \dfrac{y(x + z) - xy}{(x + z)^2} = \dfrac{yz}{(x + z)^2}$.'
    anki_seeds:
      - front: 'Definition of the partial derivative $f_x(a, b)$ as a limit?'
        back: '$f_x(a,b) = \lim_{h \to 0} \frac{f(a+h,\,b) - f(a,\,b)}{h}$ — differentiate in $x$ holding $y = b$ fixed.'
        type: basic
      - front: 'To compute $f_x$, treat {{c1::every other variable}} as a constant.'
        back: 'every other variable'
        type: cloze

  - id: estimating-partial-derivatives
    name: "Interpreting and Estimating Partial Derivatives"
    core: false                # interpretation / estimation leaf topic
    difficulty: 0.62
    drill: false
    answer_kind: numeric
    expected_time_secs: 120
    prerequisites:
      - id: first-order-partial-derivatives
        weight: 0.6
        key: true
      - id: functions-several-variables
        weight: 0.5
        key: true
      - id: estimating-derivatives
        weight: 0.4
        key: false
    knowledge_points:
      - id: kp1
        name: "Estimating partials from tables"
        key_prerequisites: [first-order-partial-derivatives, estimating-derivatives]
        step_check:
          step: 'so $y$ stays at $1$ and only $x$ moves'
          question: 'Why must $y$ stay at $1$ in both table values?'
          options:
            - 'The table has entries only in the row $y=1$, and no others'
            - 'Because $y=1$ makes the difference quotient equal to $1$'
            - 'Because the step in $x$ would otherwise be too large to use'
            - 'Only $x$ may change, or $y$ mixes into the result'
          answer: 'Only $x$ may change, or $y$ mixes into the result'
          why: 'If $y$ changed too, the difference in $f$ would mix the effects of both inputs and would no longer estimate $f_x$.'
        exemplars:
          - problem: 'A table gives $f(1,2)=5$ and $f(1.4,2)=7$. Estimate $f_x(1,2)$.'
            answer: '5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Only $x$ changes, from $1$ to $1.4$, so $y$ stays at $2$. The difference quotient is $\frac{7-5}{1.4-1}=\frac{2}{0.4}=5$.'
          - problem: 'A table gives $f(2.8,4)=6.2$ and $f(3.2,4)=7.0$. Use the central difference to estimate $f_x(3,4)$.'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The two points straddle $x=3$ with $y=4$ fixed. The central difference is $\frac{7.0-6.2}{3.2-2.8}=\frac{0.8}{0.4}=2$.'
          - problem: 'A table of a function $g$ gives $g(5,1)=12.0$ and $g(5,1.5)=13.5$. Estimate $g_y(5,1)$ to one decimal place.'
            answer: '3.0'
            answer_contract: {"kind": "approx", "decimals": 1}
            solution_sketch: 'Only $y$ changes, from $1$ to $1.5$, with $x=5$ fixed. The difference quotient is $\frac{13.5-12.0}{1.5-1}=\frac{1.5}{0.5}=3.0$.'
          - problem: 'A table gives $h(3,7)=9$ and $h(3,6)=11$. Use these two entries to estimate $h_y(3,7)$.'
            answer: '-2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The entry at $y=6$ lies before $y=7$, so use a backward difference with $x=3$ fixed. The quotient is $\frac{9-11}{7-6}=\frac{-2}{1}=-2$.'
          - problem: 'A table gives $p(2,5)=8$. The forward-difference estimate of $p_x(2,5)$ that uses the entry $p(2.2,5)$ is $15$. Find $p(2.2,5)$.'
            answer: '11'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The estimate is $\frac{p(2.2,5)-8}{2.2-2}=15$. Multiplying both sides by $0.2$ gives $p(2.2,5)-8=3$, so $p(2.2,5)=11$.'
          - problem: 'The temperature in a room is measured at nearby points, in degrees Celsius: $T(3,4)=21.4$ and $T(3.5,4)=23.4$, where $x$ and $y$ are in metres. Estimate $T_x(3,4)$ to one decimal place.'
            answer: '4.0'
            answer_contract: {"kind": "approx", "decimals": 1}
            solution_sketch: 'Only $x$ changes, from $3$ to $3.5$, with $y=4$ fixed. The quotient is $\frac{23.4-21.4}{3.5-3}=\frac{2.0}{0.5}=4.0$ degrees per metre.'
          - problem: 'A table gives the fuel used by a truck, in litres per $100$ km, as $F(v,w)$ for speed $v$ km/h and load $w$ tonnes. It shows $F(80,10)=24.5$ and $F(90,10)=27.5$. Estimate $F_v(80,10)$ to one decimal place.'
            answer: '0.3'
            answer_contract: {"kind": "approx", "decimals": 1}
            solution_sketch: 'Only the speed changes, from $80$ to $90$, with the load $10$ fixed. The quotient is $\frac{27.5-24.5}{90-80}=\frac{3.0}{10}=0.3$ litres per $100$ km for each extra km/h.'
          - problem: 'For a function $f$ we know $f(2,3)=10$ and $f_x(2,3) \approx 4$. Use this to estimate $f(2.1,3)$.'
            answer: '10.4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Moving $x$ from $2$ to $2.1$ with $y=3$ fixed changes $f$ by about $4\cdot 0.1=0.4$. The estimate is $10+0.4=10.4$.'
          - problem: 'Using the estimate $f_x(2,3) \approx 6$, by how much must $x$ increase from $2$, with $y$ fixed at $3$, for $f$ to rise by $3$?'
            answer: '1/2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Since $f$ changes by about $6$ for each unit of $x$, the increase needed is the required rise divided by the rate. That is $\frac{3}{6}=\frac12$.'
        constraints: "one variable changes at a time; difference quotients evaluate to one-decimal or integer answers; includes using an estimate to predict or to invert"
      - id: kp2
        name: "Interpretation and signs from contour maps"
        key_prerequisites: [first-order-partial-derivatives, functions-several-variables]
        step_check:
          step: 'form the difference quotient'
          question: 'Why is the change in $f$ divided by the change in $x$?'
          options:
            - 'Dividing by $\Delta x$ converts contour levels into coordinates'
            - 'The division makes the sign of the estimate positive'
            - 'A rate is the change in output per unit of input'
            - 'The division averages the two contour values'
          answer: 'A rate is the change in output per unit of input'
          why: '$f_x$ is a rate: how much $f$ changes for each one-unit step in $x$, which is $\Delta f$ divided by $\Delta x$.'
        exemplars:
          - problem: 'On a contour map of $f$, along the horizontal line through $P$ the contour $f=30$ crosses at $x=1$ and the contour $f=50$ crosses at $x=5$. Estimate $f_x(P)$.'
            answer: '5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Along a horizontal line $y$ is fixed. The difference quotient is $\frac{50-30}{5-1}=\frac{20}{4}=5$.'
          - problem: 'On a contour map of $f$, along the vertical line through $P$ the contour $f=20$ crosses at $y=0$ and the contour $f=50$ crosses at $y=5$. Estimate $f_y(P)$.'
            answer: '6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Along a vertical line $x$ is fixed. The difference quotient is $\frac{50-20}{5-0}=\frac{30}{5}=6$.'
          - problem: 'On a contour map of $f$, moving right from $P$ you cross the contour $f=40$ at $x=2$ and the contour $f=10$ at $x=5$. Estimate $f_x(P)$.'
            answer: '-10'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The values fall as $x$ increases, with $y$ fixed. The difference quotient is $\frac{10-40}{5-2}=\frac{-30}{3}=-10$.'
          - problem: 'On a contour map of $f$, moving upward from $P$ you cross the contour $f=70$ at $y=1$ and the contour $f=40$ at $y=4$. Is $f_y(P)$ positive or negative?'
            answer: 'negative'
            answer_contract: {"kind": "label", "options": [["negative", "it is negative", "less than zero", "f_y is negative", "it's negative", "below zero"], ["positive", "it is positive", "greater than zero", "f_y is positive", "it's positive", "above zero"]]}
            solution_sketch: 'Moving up, $f$ drops from $70$ to $40$. The quotient $\frac{40-70}{4-1}=-10$ is below zero, so $f_y(P)$ is negative.'
          - problem: 'On a hiking map, an eastward path crosses the $400$ m elevation contour at $x=0$ and the $450$ m contour at $x=250$, where $x$ is the distance in metres east of the trailhead. Estimate the rate of change of elevation with respect to $x$ along the path, in metres of height per metre walked.'
            answer: '0.2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The elevation rises by $450-400=50$ metres over $250$ metres of walking. The rate is $\frac{50}{250}=0.2$ metres of height per metre walked.'
          - problem: 'On a map of temperature $T$ in degrees Celsius, moving north from a point $Q$ you cross the contour $T=60$ at $y=2$ and the contour $T=44$ at $y=4$, where $y$ is in kilometres. Estimate $T_y(Q)$ in degrees per kilometre.'
            answer: '-8'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The temperature falls as $y$ increases. The difference quotient is $\frac{44-60}{4-2}=\frac{-16}{2}=-8$ degrees per kilometre.'
          - problem: 'On a contour map of $f$, which variable is held fixed along the horizontal line through $P$ when you estimate $f_x(P)$?'
            answer: 'y'
            answer_contract: {"kind": "label", "options": [["y", "y is held fixed", "the variable y", "y is fixed", "y is held constant", "y is constant", "y stays fixed", "the y variable"], ["x", "x is held fixed", "the variable x", "x is fixed", "x is held constant", "x is constant", "x stays fixed", "the x variable"]]}
            solution_sketch: 'The partial derivative $f_x$ measures the change in $f$ as $x$ varies. Along a horizontal line the height is constant, so $y$ is held fixed.'
          - problem: 'Along an eastward path the elevation changes at the rate $h_x \approx 0.2$ metres of height per metre walked. How far must you walk to climb $30$ metres?'
            answer: '150'
            answer_contract: {"kind": "unit", "quantity": "length", "unit": "m", "allow_omitted": true}
            solution_sketch: 'The distance needed is the climb divided by the rate of climb. That is $\frac{30}{0.2}=150$ metres.'
        constraints: "contour levels differ by round numbers; interpretation answers name the fixed variable or the sign"
    diagnostic_exemplar:
      problem: 'On a contour map of $f$, the level curve $f = 30$ crosses the horizontal line through $P$ at $x = 4$ and the level curve $f = 24$ crosses it at $x = 6$. Estimate $f_x$ near $P$, and say what its sign means.'
      answer: '$f_x \approx \dfrac{24 - 30}{6 - 4} = -3$; the sign is negative, so $f$ decreases as one moves in the $+x$ direction.'
      answer_contract: {kind: none}
      solution_sketch: 'Along the horizontal line only $x$ varies, so the difference quotient in $x$ estimates $f_x$.'
    anki_seeds:
      - front: 'Difference-quotient estimate of $f_x(a,b)$ from a table?'
        back: '$f_x(a,b) \approx \dfrac{f(a+h,\,b) - f(a,\,b)}{h}$ for a small tabulated step $h$.'
        type: basic
      - front: 'On a contour map, $f_x > 0$ at $P$ means that moving in the $+x$ direction you cross to {{c1::higher}} level curves.'
        back: 'higher'
        type: cloze

  - id: partial-derivatives-trig-exp
    name: "Partial Derivatives with the Chain Rule"
    core: true
    difficulty: 0.63
    drill: false
    answer_kind: numeric
    expected_time_secs: 120
    prerequisites:
      - id: first-order-partial-derivatives
        weight: 0.7
        key: true
      - id: chain-rule
        weight: 0.6
        key: true
      - id: derivatives-trig
        weight: 0.4
        key: false
      - id: derivatives-exp-log
        weight: 0.4
        key: false
    knowledge_points:
      - id: kp1
        name: "Exponentials and logarithms"
        key_prerequisites: [chain-rule, derivatives-exp-log]
        step_check:
          step: 'Holding $y$ constant, $u_x = 6x$'
          question: 'Why is $u_x = 6x$, with no term coming from $y^2$?'
          options:
            - 'The term $y^2$ is small next to $3x^2$, so it is dropped here'
            - 'Holding $y$ constant makes the derivative of $y^2$ in $x$ equal to $0$'
            - 'The chain rule deletes every term of $u$ that contains $y$ at the start'
            - 'The derivative of $y^2$ is $2y$, and that term is saved for $f_y$ only'
          answer: 'Holding $y$ constant makes the derivative of $y^2$ in $x$ equal to $0$'
          why: 'In $\frac{\partial}{\partial x}$ the variable $y$ is a fixed number, so $y^2$ is a constant and its derivative is $0$.'
        exemplars:
          - problem: 'Let $f(x, y) = e^{x^2 y}$. Find $f_x$.'
            answer: '2x y e^(x^2 y)'
            answer_contract: {"kind":"function","vars":["x","y"]}
            solution_sketch: 'Write $f = e^{u}$ with $u = x^2 y$. Holding $y$ constant, $u_x = 2xy$, so the chain rule gives $f_x = 2xy\,e^{x^2 y}$.'
          - problem: 'Let $f(x, y) = \ln(x^2 + y^2)$. Find $f_x(1, 2)$.'
            answer: '2/5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The chain rule gives $f_x = \frac{2x}{x^2 + y^2}$. At $(1, 2)$ the denominator is $1 + 4 = 5$ and the numerator is $2$, so $f_x(1, 2) = \frac{2}{5}$.'
          - problem: 'The temperature, in degrees Celsius, at the point $(x, y)$ of a metal plate is $T(x, y) = 50e^{-(x^2 + 2y^2)}$, where $x$ and $y$ are in centimeters. How fast does the temperature change per centimeter as $x$ increases, at the point $(1, 1)$?'
            answer: '-100/e^3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Differentiate in $x$ with $y$ fixed: $T_x = 50e^{-(x^2 + 2y^2)}\cdot(-2x) = -100x\,e^{-(x^2 + 2y^2)}$. At $(1, 1)$ the exponent is $-3$, so $T_x = -100e^{-3}$ degrees per centimeter.'
          - problem: 'Let $f(x, y) = e^{xy}$. Find $f_x(2, 3)$.'
            answer: '3e^6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Holding $y$ fixed, the chain rule gives $f_x = y\,e^{xy}$. At $(2, 3)$ we have $xy = 6$, so $f_x(2, 3) = 3e^6$.'
          - problem: 'A shopper''s satisfaction from buying $x$ kilograms of fruit and $y$ kilograms of vegetables is $S(x, y) = \ln(x^2 + 3y)$. At $(x, y) = (2, 3)$, how fast does the satisfaction rise per extra kilogram of vegetables?'
            answer: '3/13'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Only $y$ changes, so differentiate in $y$ with $x$ fixed: $S_y = \frac{3}{x^2 + 3y}$. At $(2, 3)$ the denominator is $4 + 9 = 13$, so $S_y = \frac{3}{13}$.'
          - problem: 'Let $f(x, y) = \ln(x + y^2)$. Find $f_y(3, 1)$.'
            answer: '1/2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Holding $x$ fixed, the chain rule gives $f_y = \frac{2y}{x + y^2}$. At $(3, 1)$ this is $\frac{2}{3 + 1} = \frac{1}{2}$.'
          - problem: 'Sam differentiates $f(x, y) = e^{xy^2}$ with respect to $x$ and writes $f_x = 2xy\,e^{xy^2}$. What is the correct $f_x$?'
            answer: 'y^2 e^(x y^2)'
            answer_contract: {"kind":"function","vars":["x","y"]}
            solution_sketch: 'Sam differentiated the exponent $xy^2$ with respect to $y$. With respect to $x$, the variable $y$ is held fixed, so the inner derivative is $y^2$ and $f_x = y^2 e^{xy^2}$.'
          - problem: 'The concentration of a pollutant at the point $(x, y)$ of a lake is $C(x, y) = 40e^{-x^2/2 - y^2}$ milligrams per liter, where $x$ and $y$ are in kilometers. How fast does the concentration change per kilometer as $x$ increases, at the point $(2, 1)$?'
            answer: '-80/e^3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Differentiate in $x$ with $y$ fixed. The inner derivative of $-x^2/2 - y^2$ is $-x$, so $C_x = -40x\,e^{-x^2/2 - y^2}$. At $(2, 1)$ the exponent is $-3$, so $C_x = -80e^{-3}$ milligrams per liter per kilometer.'
          - problem: 'Let $f(x, y) = e^{2x + 3y}$. Find $f_x(0, 1)$.'
            answer: '2e^3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Holding $y$ fixed, the chain rule gives $f_x = 2e^{2x + 3y}$. At $(0, 1)$ the exponent is $3$, so $f_x(0, 1) = 2e^3$.'
          - problem: 'Let $f(x, y) = \ln(x^2 + y)$. Find $f_x(2, 1)$.'
            answer: '4/5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The chain rule gives $f_x = \frac{2x}{x^2 + y}$. At $(2, 1)$ this is $\frac{4}{4 + 1} = \frac{4}{5}$.'
        constraints: 'one composition layer; inner functions polynomial in x, y; measured contexts'
      - id: kp2
        name: "Trigonometric compositions"
        key_prerequisites: [chain-rule, derivatives-trig]
        step_check:
          step: 'leaving the inside untouched'
          question: 'Why is $x^3 y$ left unchanged inside the sine in $-\sin(x^3 y)$?'
          options:
            - 'The inside is a constant number here, so it can simply stay as it is'
            - 'The inside is differentiated first and then dropped from the final answer'
            - 'Sine and cosine ignore their input, so its derivative is never needed'
            - 'Only the outer function is differentiated here; the inside comes next'
          answer: 'Only the outer function is differentiated here; the inside comes next'
          why: 'The chain rule has two factors: the derivative of the outer function with the inside unchanged, and the derivative of the inside.'
        exemplars:
          - problem: 'Let $f(x, y) = \sin(x^2 y)$. Find $f_x$.'
            answer: '2x y cos(x^2 y)'
            answer_contract: {"kind":"function","vars":["x","y"]}
            solution_sketch: 'The inner function is $u = x^2 y$ and $\frac{d}{du}\sin u = \cos u$. Holding $y$ fixed, $u_x = 2xy$, so $f_x = 2xy\cos(x^2 y)$.'
          - problem: 'Let $f(x, y) = \cos(xy^2)$. Find $f_y$.'
            answer: '-2x y sin(x y^2)'
            answer_contract: {"kind":"function","vars":["x","y"]}
            solution_sketch: 'The derivative of $\cos u$ is $-\sin u$. Holding $x$ fixed, the inner derivative is $\frac{\partial}{\partial y}(xy^2) = 2xy$, so $f_y = -2xy\sin(xy^2)$.'
          - problem: 'Let $f(x, y) = \sin(xy)$. Find $f_y(2, \pi/6)$.'
            answer: '1'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Holding $x$ fixed, the chain rule gives $f_y = x\cos(xy)$. At $(2, \pi/6)$ we have $xy = \pi/3$, so $f_y = 2\cos(\pi/3) = 2\cdot\frac{1}{2} = 1$.'
          - problem: 'The height of a hill is $h(x, y) = 20\sin(xy)$ meters, where $x$ and $y$ are measured in kilometers. How fast does the height change, in meters per kilometer, when one walks in the direction of increasing $x$ from the point $(1, \pi/3)$?'
            answer: '10pi/3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Holding $y$ fixed, $h_x = 20y\cos(xy)$. At $(1, \pi/3)$ we have $xy = \pi/3$, so $h_x = 20\cdot\frac{\pi}{3}\cdot\frac{1}{2} = \frac{10\pi}{3}$ meters per kilometer.'
          - problem: 'A water wave has height $w(x, t) = 0.5\sin(2x - 3t)$ meters at the position $x$ meters and the time $t$ seconds. At the position $x = \pi/4$ and the time $t = \pi/6$, what is the vertical velocity of the water surface?'
            answer: '-1.5'
            answer_contract: {"kind":"unit","quantity":"speed","unit":"m/s","allow_omitted":true}
            solution_sketch: 'Holding $x$ fixed, the chain rule gives $w_t = 0.5\cdot(-3)\cos(2x - 3t) = -1.5\cos(2x - 3t)$. At the given point, $2x - 3t = \pi/2 - \pi/2 = 0$ and $\cos 0 = 1$, so $w_t = -1.5$ meters per second.'
          - problem: 'Sam finds $f_x$ for $f(x, y) = \cos(x^3 y)$ and writes $f_x = -\sin(x^3 y)$. What is the correct $f_x$?'
            answer: '-3x^2 y sin(x^3 y)'
            answer_contract: {"kind":"function","vars":["x","y"]}
            solution_sketch: 'Sam differentiated the outer function but forgot the inner derivative. The correct result multiplies $-\sin(x^3 y)$ by the inner derivative $\frac{\partial}{\partial x}(x^3 y) = 3x^2 y$, so $f_x = -3x^2 y\sin(x^3 y)$.'
          - problem: 'Let $f(x, y) = \cos(x^3 y^2)$. Find $f_x$.'
            answer: '-3x^2 y^2 sin(x^3 y^2)'
            answer_contract: {"kind":"function","vars":["x","y"]}
            solution_sketch: 'The derivative of $\cos u$ is $-\sin u$. Holding $y$ fixed, the inner derivative is $3x^2 y^2$, so $f_x = -3x^2 y^2\sin(x^3 y^2)$.'
          - problem: 'Let $f(x, y) = \sin(x^2 y^2)$. Find $f_y$.'
            answer: '2x^2 y cos(x^2 y^2)'
            answer_contract: {"kind":"function","vars":["x","y"]}
            solution_sketch: 'The derivative of $\sin u$ is $\cos u$. Holding $x$ fixed, the inner derivative is $2x^2 y$, so $f_y = 2x^2 y\cos(x^2 y^2)$.'
          - problem: 'Let $f(x, y) = \sin(x^3 y)$. Find $f_x$.'
            answer: '3x^2 y cos(x^3 y)'
            answer_contract: {"kind":"function","vars":["x","y"]}
            solution_sketch: 'The derivative of $\sin u$ is $\cos u$. Holding $y$ fixed, the inner derivative is $3x^2 y$, so $f_x = 3x^2 y\cos(x^3 y)$.'
        constraints: 'sin or cos of a monomial in x, y or of a linear form; one chain-rule layer; wave and hill contexts'
      - id: kp3
        name: "Combined forms and evaluation"
        key_prerequisites: [first-order-partial-derivatives, chain-rule]
        step_check:
          step: 'since the inner function $3y$ has derivative $3$'
          question: 'Why does the factor $3$ appear in front of $e^{3y}$ in the derivative?'
          options:
            - 'The inside $3y$ has derivative $3$, which multiplies the whole result'
            - 'The power of $e$ comes down in front, in the same way as in $x^3$ or $x^5$'
            - 'The $3$ comes from differentiating the factor $x^2$ at the same time'
            - 'Every exponential derivative gains the same constant factor $3$ always'
          answer: 'The inside $3y$ has derivative $3$, which multiplies the whole result'
          why: 'The chain rule gives $\frac{d}{dy}e^{u} = e^{u}\,u_y$, and here $u = 3y$ so $u_y = 3$.'
        exemplars:
          - problem: 'Let $f(x, y) = e^{2x}\cos(3y)$. Find $f_y$.'
            answer: '-3e^(2x) sin(3y)'
            answer_contract: {"kind":"function","vars":["x","y"]}
            solution_sketch: 'Holding $x$ fixed, the factor $e^{2x}$ is constant. The derivative of $\cos(3y)$ is $-3\sin(3y)$, so $f_y = -3e^{2x}\sin(3y)$.'
          - problem: 'Let $f(x, y) = y\,e^{x^2}$. Find $f_x(1, 2)$.'
            answer: '4e'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Holding $y$ fixed, the chain rule gives $f_x = 2xy\,e^{x^2}$. At $(1, 2)$ this is $2\cdot 1\cdot 2\cdot e = 4e$.'
          - problem: 'Let $f(x, y) = e^x\sin(2y)$. Find $f_y(1, \pi/6)$.'
            answer: 'e'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Holding $x$ fixed, $f_y = 2e^x\cos(2y)$. At $(1, \pi/6)$ we have $2y = \pi/3$, so $f_y = 2e\cdot\frac{1}{2} = e$.'
          - problem: 'The temperature, in degrees Celsius, of a thin rod at the position $x$ meters and the time $t$ minutes is $u(x, t) = 80e^{-2t}\sin x$. How fast is the temperature changing, in degrees per minute, at the position $x = \pi/2$ and the time $t = 1/2$?'
            answer: '-160/e'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Holding $x$ fixed, $u_t = 80\cdot(-2)e^{-2t}\sin x = -160e^{-2t}\sin x$. At $x = \pi/2$ we have $\sin x = 1$, and at $t = 1/2$ we have $e^{-1}$, so $u_t = -160e^{-1}$ degrees per minute.'
          - problem: 'Let $f(x, y) = e^y\sin(3x)$. Find $f_x(0, 1)$.'
            answer: '3e'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Holding $y$ fixed, $f_x = 3e^y\cos(3x)$. At $(0, 1)$ this is $3e\cos 0 = 3e$.'
          - problem: 'Let $f(x, y) = x\,e^{y}\sin x$. Find $f_x$.'
            answer: 'e^y (sin(x) + x cos(x))'
            answer_contract: {"kind":"function","vars":["x","y"]}
            solution_sketch: 'Holding $y$ fixed, $e^y$ is a constant factor, and $x\sin x$ needs the product rule. Its derivative is $\sin x + x\cos x$, so $f_x = e^y(\sin x + x\cos x)$.'
          - problem: 'Sam differentiates $f(x, y) = e^x\sin(2y)$ with respect to $y$ and writes $f_y = e^x\cos(2y)$. What is the correct $f_y$?'
            answer: '2e^x cos(2y)'
            answer_contract: {"kind":"function","vars":["x","y"]}
            solution_sketch: 'Sam left out the chain-rule factor. The inner function $2y$ has derivative $2$, so $f_y = e^x\cdot 2\cos(2y) = 2e^x\cos(2y)$.'
          - problem: 'A taut string vibrates and fades. Its displacement, in meters, at the position $x$ meters and the time $t$ seconds is $w(x, t) = 0.2e^{-t}\sin(2x)$. What is the vertical velocity of the point $x = \pi/4$ at the time $t = 0$?'
            answer: '-0.2'
            answer_contract: {"kind":"unit","quantity":"speed","unit":"m/s","allow_omitted":true}
            solution_sketch: 'Holding $x$ fixed, $w_t = -0.2e^{-t}\sin(2x)$. At $x = \pi/4$ we have $\sin(2x) = 1$, and at $t = 0$ we have $e^0 = 1$, so $w_t = -0.2$ meters per second.'
          - problem: 'Let $f(x, y) = x\,e^{2y}\cos x$. Find $f_y$.'
            answer: '2x e^(2y) cos(x)'
            answer_contract: {"kind":"function","vars":["x","y"]}
            solution_sketch: 'Holding $x$ fixed, the factor $x\cos x$ is constant. The derivative of $e^{2y}$ is $2e^{2y}$, so $f_y = 2x\,e^{2y}\cos x$.'
          - problem: 'Let $f(x, y) = e^x\sin(3y)$. Find $f_y(1, \pi/3)$.'
            answer: '-3e'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Holding $x$ fixed, $f_y = 3e^x\cos(3y)$. At $(1, \pi/3)$ we have $3y = \pi$, so $f_y = 3e\cdot(-1) = -3e$.'
        constraints: 'products of an exponential and a trig or polynomial factor; evaluations at points giving exact multiples of e; rod and string contexts'
    diagnostic_exemplar:
      problem: 'Let $f(x, y) = e^{2x}\sin(3y)$. Compute $f_y(1, 0)$.'
      answer: '$3e^2$'
      solution_sketch: '$f_y = 3e^{2x}\cos(3y)$; at $(1, 0)$ this is $3e^2 \cdot 1 = 3e^2$.'
    anki_seeds:
      - front: '$\dfrac{\partial}{\partial x} e^{xy} = $ ?'
        back: '$y e^{xy}$ (chain rule; $y$ is a constant while differentiating in $x$).'
        type: basic
      - front: 'Strategy for partials of composite functions like $\sin(x^2 y)$?'
        back: 'Hold the other variable constant and apply the single-variable chain rule to the inner function.'
        type: basic

  - id: partial-derivatives
    name: "Higher-Order and Mixed Partial Derivatives"
    core: true
    difficulty: 0.66
    drill: false
    answer_kind: expression
    expected_time_secs: 130
    prerequisites:
      - id: first-order-partial-derivatives
        weight: 0.7
        key: true
      - id: partial-derivatives-trig-exp
        weight: 0.7
        key: true
    knowledge_points:
      - id: kp1
        name: "Second-order partials"
        key_prerequisites: [first-order-partial-derivatives]
        step_check:
          step: 'First pass in $y$ (hold $x$ constant)'
          question: 'Why does $f_y$ contain the term $5x^3$?'
          options:
            - 'The term $5x^3 y$ is copied unchanged, because $x$ is the held variable'
            - 'The $y$ is dropped and then the $x^3$ is differentiated to $3x^2$'
            - 'In $y$ the factor $5x^3$ is a constant, and $y$ has derivative $1$'
            - 'Only terms with $y^2$ or a higher power of $y$ are differentiated'
          answer: 'In $y$ the factor $5x^3$ is a constant, and $y$ has derivative $1$'
          why: 'Holding $x$ constant, $5x^3 y$ is a constant times $y$, so its derivative in $y$ is that constant, $5x^3$.'
        exemplars:
          - problem: 'Let $f(x, y) = x^3 y^2$. Find $f_{xx}$.'
            answer: '6x y^2'
            answer_contract: {"kind":"function","vars":["x","y"]}
            solution_sketch: 'Differentiate in $x$ once: $f_x = 3x^2 y^2$. Differentiate in $x$ again, with $y$ fixed: $f_{xx} = 6xy^2$.'
          - problem: 'Let $f(x, y) = x^4 - 3x^2 y^3$. Find $f_{yy}$.'
            answer: '-18x^2 y'
            answer_contract: {"kind":"function","vars":["x","y"]}
            solution_sketch: 'Differentiate in $y$ once: $f_y = -9x^2 y^2$, because $x^4$ is constant. Differentiate in $y$ again: $f_{yy} = -18x^2 y$.'
          - problem: 'Let $f(x, y) = 2x^4 y + 3xy^5$. Find $f_{xx}$.'
            answer: '24x^2 y'
            answer_contract: {"kind":"function","vars":["x","y"]}
            solution_sketch: 'Differentiate in $x$ once: $f_x = 8x^3 y + 3y^5$. Differentiate in $x$ again: the term $3y^5$ is constant in $x$, so $f_{xx} = 24x^2 y$.'
          - problem: 'The height of a ridge, in meters, is $h(x, y) = x^4 y - 2x^2 y^3$, where $x$ and $y$ are in kilometers. The slope in the direction of increasing $x$ is $h_x$. How fast does this slope change per kilometer travelled in that direction at the point $(1, 2)$?'
            answer: '-8'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The slope is $h_x = 4x^3 y - 4xy^3$. Differentiating again in $x$ gives $h_{xx} = 12x^2 y - 4y^3$. At $(1, 2)$ this is $24 - 32 = -8$.'
          - problem: 'A factory''s weekly output is $Q(L, K) = 12LK^2 - L^3$ units, where $L$ is the number of labor hours and $K$ the number of machines. The marginal product of labor is $Q_L$. At $L = 2$ and $K = 3$, how fast does the marginal product of labor change per extra hour of labor?'
            answer: '-12'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The marginal product is $Q_L = 12K^2 - 3L^2$. Differentiating again in $L$ gives $Q_{LL} = -6L$. At $L = 2$ this is $-12$ units per hour, so the marginal product falls.'
          - problem: 'Let $f(x, y) = x^6 - 2x^2 y^4$. Find $f_{yy}$.'
            answer: '-24x^2 y^2'
            answer_contract: {"kind":"function","vars":["x","y"]}
            solution_sketch: 'Differentiate in $y$ once: $f_y = -8x^2 y^3$. Differentiate in $y$ again: $f_{yy} = -24x^2 y^2$.'
          - problem: 'Sam computes $f_{xx}$ for $f(x, y) = x^5 y^2 + y^3$ and gets $20x^3 y^2 + 6y$. What is the correct $f_{xx}$?'
            answer: '20x^3 y^2'
            answer_contract: {"kind":"function","vars":["x","y"]}
            solution_sketch: 'Sam differentiated the term $y^3$ with respect to $x$ as if $y$ were the variable. With respect to $x$ it is constant, so it vanishes at the first step. Then $f_x = 5x^4 y^2$ and $f_{xx} = 20x^3 y^2$.'
          - problem: 'Let $f(x, y) = 5x^2 y^4 - 2x^4 y^2 + 7$. Find $f_{yy}$.'
            answer: '60x^2 y^2 - 4x^4'
            answer_contract: {"kind":"function","vars":["x","y"]}
            solution_sketch: 'Differentiate in $y$ once: $f_y = 20x^2 y^3 - 4x^4 y$, and the constant $7$ vanishes. Differentiate in $y$ again: $f_{yy} = 60x^2 y^2 - 4x^4$.'
        constraints: 'polynomials of total degree at most 6; differentiate twice in the same variable; ridge and output contexts'
      - id: kp2
        name: "Mixed partials and Clairaut''s theorem"
        key_prerequisites: [first-order-partial-derivatives, partial-derivatives-trig-exp]
        try_first:
          problem: 'Let $f(x, y) = xy^3$. Differentiate $f$ with respect to $x$, then differentiate your result with respect to $y$, and evaluate the final result at $(2, 1)$.'
          answer_contract: {"kind":"exact"}
          answer: '3'
          reveal: 'The result $3y^2$ is $f_{xy}$, so $f_{xy}(2, 1) = 3$. Differentiating in the other order gives $f_y = 3xy^2$ and then $f_{yx} = 3y^2$, the same function, and that equality is what this lesson explains.'
        step_check:
          step: 'the two orders agree, as Clairaut''s theorem predicts'
          question: 'Why do the two orders of differentiation give the same function here?'
          options:
            - 'The mixed partials are continuous, so by Clairaut''s theorem the order does not matter'
            - 'Both orders use the same two derivative rules, so the answers agree by chance in every case'
            - 'The power of $x$ and the power of $y$ in $f$ are close to each other, which forces equality'
            - 'Differentiating first in $y$ always gives the same result as first in $x$, for every function'
          answer: 'The mixed partials are continuous, so by Clairaut''s theorem the order does not matter'
          why: 'Clairaut''s theorem says $f_{xy} = f_{yx}$ wherever both mixed partials are continuous; polynomials are smooth everywhere.'
        exemplars:
          - problem: 'Let $f(x, y) = x^3 y^2$. Find $f_{xy}$.'
            answer: '6x^2 y'
            answer_contract: {"kind":"function","vars":["x","y"]}
            solution_sketch: 'First differentiate in $x$: $f_x = 3x^2 y^2$. Then differentiate that result in $y$: $f_{xy} = 6x^2 y$.'
          - problem: 'Let $f(x, y) = y\ln x$. Find $f_{xy}$.'
            answer: '1/x'
            answer_contract: {"kind":"function","vars":["x","y"]}
            solution_sketch: 'First $f_x = \frac{y}{x}$. Then differentiating in $y$ gives $f_{xy} = \frac{1}{x}$. The other order agrees: $f_y = \ln x$ and $f_{yx} = \frac{1}{x}$.'
          - problem: 'Let $f(x, y) = e^x\sin y$. Find $f_{yx}$.'
            answer: 'e^x cos(y)'
            answer_contract: {"kind":"function","vars":["x","y"]}
            solution_sketch: 'First differentiate in $y$: $f_y = e^x\cos y$. Then differentiate that result in $x$: $f_{yx} = e^x\cos y$.'
          - problem: 'For one mole of an ideal gas, the pressure in kilopascals is $P(V, T) = \dfrac{8T}{V}$, where $V$ is the volume in liters and $T$ is the temperature in kelvin. Differentiate $P$ with respect to $V$, then differentiate the result with respect to $T$. What is this mixed partial derivative at $V = 4$?'
            answer: '-1/2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'First $P_V = -\frac{8T}{V^2}$. Then differentiating in $T$ gives $P_{VT} = -\frac{8}{V^2}$. At $V = 4$ this is $-\frac{8}{16} = -\frac{1}{2}$.'
          - problem: 'The cost, in dollars, of producing $x$ chairs and $y$ tables is $C(x, y) = 200 + 3x^2 y + 5xy^2$. The marginal cost of a chair is $C_x$. At the production level $(x, y) = (4, 5)$, how much does the marginal cost of a chair change per extra table made?'
            answer: '74'
            answer_contract: {"kind":"unit","quantity":"dollar","unit":"dollar","allow_omitted":true}
            solution_sketch: 'The marginal cost of a chair is $C_x = 6xy + 5y^2$. Differentiating in $y$ gives $C_{xy} = 6x + 10y$. At $(4, 5)$ this is $24 + 50 = 74$ dollars.'
          - problem: 'Sam computes $f_{xy}$ for $f(x, y) = x^4 y^3$ and gets $12x^3 y^3$. What is the correct $f_{xy}$?'
            answer: '12x^3 y^2'
            answer_contract: {"kind":"function","vars":["x","y"]}
            solution_sketch: 'Sam differentiated in $x$ twice, or forgot to differentiate in $y$ at the second step. First $f_x = 4x^3 y^3$. Then differentiating in $y$ gives $f_{xy} = 12x^3 y^2$.'
          - problem: 'Let $f(x, y) = x\,e^{xy}$. Find $f_{xy}$.'
            answer: '(2x + x^2 y) e^(x y)'
            answer_contract: {"kind":"function","vars":["x","y"]}
            solution_sketch: 'First $f_x = e^{xy} + xy\,e^{xy}$ by the product rule. Then differentiating in $y$ gives $f_{xy} = x\,e^{xy} + x\,e^{xy} + x^2 y\,e^{xy} = (2x + x^2 y)e^{xy}$. The other order agrees: $f_y = x^2 e^{xy}$ and $f_{yx} = (2x + x^2 y)e^{xy}$.'
          - problem: 'Let $f(x, y) = x^2\cos y$. Find $f_{xy}$.'
            answer: '-2x sin(y)'
            answer_contract: {"kind":"function","vars":["x","y"]}
            solution_sketch: 'First $f_x = 2x\cos y$. Then differentiating in $y$ gives $f_{xy} = -2x\sin y$.'
          - problem: 'Let $f(x, y) = x^3 y^4$. Find $f_{xy}(1, 2)$.'
            answer: '96'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'First $f_x = 3x^2 y^4$. Then $f_{xy} = 12x^2 y^3$. At $(1, 2)$ this is $12\cdot 1\cdot 8 = 96$.'
          - problem: 'Let $f(x, y) = x^2 e^y$. Find $f_{yx}$.'
            answer: '2x e^y'
            answer_contract: {"kind":"function","vars":["x","y"]}
            solution_sketch: 'First $f_y = x^2 e^y$. Then differentiating in $x$ gives $f_{yx} = 2x e^y$.'
        constraints: 'smooth functions where mixed partials agree; either order; gas and cost contexts'
      - id: kp3
        name: "Third-order partials and verifying PDEs"
        key_prerequisites: [first-order-partial-derivatives, partial-derivatives-trig-exp]
        step_check:
          step: 'then differentiate again in $x$'
          question: 'Why does the factor $-4$ appear in $u_{xx}$?'
          options:
            - 'The factor $-4$ comes from the $-4t$ in the exponent of $e$, as a constant'
            - 'The exponential $e^{-4t}$ is differentiated twice in $x$ as well, giving $-4$'
            - 'Differentiating $\cos$ twice always multiplies the result by $-4$ on its own'
            - 'Each derivative brings the factor $2$ of the inside, and $\cos$ gives a sign'
          answer: 'Each derivative brings the factor $2$ of the inside, and $\cos$ gives a sign'
          why: 'Each derivative in $x$ brings a factor $2$ from the inner function $2x$, and going from $\cos$ to $-\sin$ to $-\cos$ gives the minus sign: $2\cdot 2\cdot(-1) = -4$.'
        exemplars:
          - problem: 'Let $f(x, y) = x^3 y^2$. Find $f_{xxy}$.'
            answer: '12x y'
            answer_contract: {"kind":"function","vars":["x","y"]}
            solution_sketch: 'Differentiate in $x$: $f_x = 3x^2 y^2$, and again $f_{xx} = 6xy^2$. Then differentiate in $y$: $f_{xxy} = 12xy$.'
          - problem: 'Let $f(x, y) = e^x\sin y$. Find $f_{xx} + f_{yy}$.'
            answer: '0'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Differentiating twice in $x$ gives $f_{xx} = e^x\sin y$. Differentiating twice in $y$ gives $f_{yy} = -e^x\sin y$. The sum is $0$.'
          - problem: 'Does $u(x, t) = e^{-9t}\cos(3x)$ satisfy the heat equation $u_t = u_{xx}$?'
            answer: 'yes'
            answer_contract: {"kind":"label","options":[["yes","it does","it satisfies","it satisfies the equation","it satisfies the heat equation","it does satisfy","it is a solution","equal"],["no","it does not","it does not satisfy","it doesn't satisfy","it doesn't","it does not satisfy the equation","it is not a solution","not equal"]]}
            solution_sketch: 'We have $u_t = -9e^{-9t}\cos(3x)$. Also $u_x = -3e^{-9t}\sin(3x)$ and $u_{xx} = -9e^{-9t}\cos(3x)$. The two sides are equal, so the equation holds.'
          - problem: 'Let $f(x, y) = x^3 y^3$. Find $f_{xyy}$.'
            answer: '18x^2 y'
            answer_contract: {"kind":"function","vars":["x","y"]}
            solution_sketch: 'Differentiate in $x$: $f_x = 3x^2 y^3$. Differentiate in $y$: $f_{xy} = 9x^2 y^2$. Differentiate in $y$ again: $f_{xyy} = 18x^2 y$.'
          - problem: 'The temperature in a thin rod at the position $x$ and the time $t$ is $u(x, t) = e^{-t}\sin x$. Find $u_t - u_{xx}$.'
            answer: '0'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'We have $u_t = -e^{-t}\sin x$. Also $u_x = e^{-t}\cos x$ and $u_{xx} = -e^{-t}\sin x$. The difference $u_t - u_{xx}$ is $0$.'
          - problem: 'A model gives the temperature in a thin rod as $u(x, t) = e^{-t}\sin(2x)$. Does this function satisfy the heat equation $u_t = u_{xx}$?'
            answer: 'no'
            answer_contract: {"kind":"label","options":[["yes","it does","it satisfies","it satisfies the equation","it satisfies the heat equation","it does satisfy","it is a solution","equal"],["no","it does not","it does not satisfy","it doesn't satisfy","it doesn't","it does not satisfy the equation","it is not a solution","not equal"]]}
            solution_sketch: 'We have $u_t = -e^{-t}\sin(2x)$, but $u_{xx} = -4e^{-t}\sin(2x)$. The two sides differ by a factor of $4$, so the equation does not hold.'
          - problem: 'Let $f(x, y) = x^2 y^4$. Find $f_{yyx}$.'
            answer: '24x y^2'
            answer_contract: {"kind":"function","vars":["x","y"]}
            solution_sketch: 'Differentiate in $y$ twice: $f_{yy} = 12x^2 y^2$. Then differentiate in $x$: $f_{yyx} = 24xy^2$.'
          - problem: 'Let $f(x, y) = e^x\cos(2y)$. Find $f_{xx} + f_{yy}$.'
            answer: '-3e^x cos(2y)'
            answer_contract: {"kind":"function","vars":["x","y"]}
            solution_sketch: 'We have $f_{xx} = e^x\cos(2y)$ and $f_{yy} = -4e^x\cos(2y)$. The sum is $-3e^x\cos(2y)$, which is not $0$.'
          - problem: 'Let $f(x, y) = e^{2x}\cos(2y)$. Find $f_{xx} + f_{yy}$.'
            answer: '0'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'We have $f_{xx} = 4e^{2x}\cos(2y)$ and $f_{yy} = -4e^{2x}\cos(2y)$. The sum is $0$.'
        constraints: 'at most third order; PDE checks limited to the Laplace and heat equations with single-term solutions'
    diagnostic_exemplar:
      problem: 'Let $f(x, y) = x^4 y^3$. Compute $f_{xxy}$.'
      answer: '$36x^2y^2$'
      solution_sketch: '$f_x = 4x^3y^3$, $f_{xx} = 12x^2y^3$, $f_{xxy} = 36x^2y^2$.'
    anki_seeds:
      - front: 'Clairaut''s theorem says that when $f_{xy}$ and $f_{yx}$ are continuous, they are...'
        back: 'equal: $f_{xy} = f_{yx}$.'
        type: basic
      - front: 'The subscript notation $f_{xy}$ means differentiate first in {{c1::$x$}}, then in {{c2::$y$}} — i.e. $(f_x)_y = \frac{\partial^2 f}{\partial y \partial x}$.'
        back: '$x$ first, then $y$'
        type: cloze

  - id: tangent-planes-linear-approximation
    name: "Tangent Planes and Linear Approximation"
    core: true
    difficulty: 0.70
    drill: false
    answer_kind: numeric
    expected_time_secs: 150
    prerequisites:
      - id: partial-derivatives
        weight: 0.8
        key: true
      - id: planes-in-space
        weight: 0.5
        key: true
    knowledge_points:
      - id: kp1
        name: "Tangent planes to z = f(x, y)"
        key_prerequisites: [partial-derivatives, planes-in-space]
        step_check:
          step: 'which matches the given $z$-coordinate'
          question: 'Why do we first compute $f(2,1)$ and compare it with $7$?'
          options:
            - 'The value $f(2,1)$ is the slope of the tangent plane at that point'
            - 'The plane touches the surface, so the point must lie on the surface'
            - 'The check decides whether $f_x$ or $f_y$ is used first in the formula'
            - 'The tangent plane exists only when the value $f(a,b)$ is positive'
          answer: 'The plane touches the surface, so the point must lie on the surface'
          why: 'The tangent plane passes through the point of the surface above $(a, b)$, so its height there must be $f(a, b)$.'
        exemplars:
          - problem: 'Find an equation of the plane tangent to the surface $z = x^2 + y^2$ at the point $(1, 2, 5)$.'
            answer: 'z = 2x + 4y - 5'
            answer_contract: {"kind":"polynomial_relation"}
            solution_sketch: 'We have $f_x = 2x = 2$ and $f_y = 2y = 4$ at $(1, 2)$. The tangent plane is $z = 5 + 2(x - 1) + 4(y - 2)$, which simplifies to $z = 2x + 4y - 5$.'
          - problem: 'Find an equation of the plane tangent to the surface $z = xy$ at the point $(2, 3, 6)$.'
            answer: 'z = 3x + 2y - 6'
            answer_contract: {"kind":"polynomial_relation"}
            solution_sketch: 'At $(2, 3)$, $f_x = y = 3$ and $f_y = x = 2$. The tangent plane is $z = 6 + 3(x - 2) + 2(y - 3)$, which simplifies to $z = 3x + 2y - 6$.'
          - problem: 'Find an equation of the plane tangent to the surface $z = ye^x$ at the point $(0, 2, 2)$.'
            answer: 'z = 2x + y'
            answer_contract: {"kind":"polynomial_relation"}
            solution_sketch: 'At $(0, 2)$, $f_x = ye^x = 2$ and $f_y = e^x = 1$. The tangent plane is $z = 2 + 2x + (y - 2)$, which simplifies to $z = 2x + y$.'
          - problem: 'A hillside has height $z = 100 - x^2 - 2y^2$ meters at the position $(x, y)$ in meters. A surveyor lays a flat board so that it touches the hillside at the point $(3, 1, 89)$. Find an equation of the plane of the board.'
            answer: 'z = -6x - 4y + 111'
            answer_contract: {"kind":"polynomial_relation"}
            solution_sketch: 'At $(3, 1)$, $f_x = -2x = -6$ and $f_y = -4y = -4$. The board lies in the plane $z = 89 - 6(x - 3) - 4(y - 1)$, which simplifies to $z = -6x - 4y + 111$.'
          - problem: 'Find an equation of the plane tangent to the surface $z = 2x^2 - y^2$ at the point $(2, 1, 7)$.'
            answer: 'z = 8x - 2y - 7'
            answer_contract: {"kind":"polynomial_relation"}
            solution_sketch: 'At $(2, 1)$, $f_x = 4x = 8$ and $f_y = -2y = -2$. The tangent plane is $z = 7 + 8(x - 2) - 2(y - 1)$, which simplifies to $z = 8x - 2y - 7$.'
          - problem: 'The plane tangent to the surface $z = f(x, y)$ at the point where $x = 2$ and $y = 1$ has the equation $3x + 2y - z = 5$. What is $f_y(2, 1)$?'
            answer: '2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Solve the plane equation for $z$: $z = 3x + 2y - 5$. A tangent plane has the form $z = f(a,b) + f_x(x - a) + f_y(y - b)$, so the coefficient of $y$ is $f_y(2, 1) = 2$.'
          - problem: 'Find an equation of the plane tangent to the surface $z = xe^y$ at the point $(2, 0, 2)$.'
            answer: 'z = x + 2y'
            answer_contract: {"kind":"polynomial_relation"}
            solution_sketch: 'At $(2, 0)$, $f_x = e^y = 1$ and $f_y = xe^y = 2$. The tangent plane is $z = 2 + 1(x - 2) + 2y$, which simplifies to $z = x + 2y$.'
          - problem: 'A solar panel is mounted tangent to a dome of height $z = 9 - x^2 - y^2$ meters, at the point of the dome above $(x, y) = (1, 2)$. Find an equation of the plane of the panel.'
            answer: 'z = 14 - 2x - 4y'
            answer_contract: {"kind":"polynomial_relation"}
            solution_sketch: 'The dome has height $9 - 1 - 4 = 4$ above $(1, 2)$. There $f_x = -2x = -2$ and $f_y = -2y = -4$, so the plane is $z = 4 - 2(x - 1) - 4(y - 2)$, which simplifies to $z = 14 - 2x - 4y$.'
          - problem: 'Sam writes the tangent plane to $z = x^2 + 3y^2$ at the point $(1, 2, 13)$ as $z = 13 + 2x + 12y$. What is the correct equation of the tangent plane?'
            answer: 'z = 2x + 12y - 13'
            answer_contract: {"kind":"polynomial_relation"}
            solution_sketch: 'Sam left out the offsets $x - 1$ and $y - 2$. At $(1, 2)$, $f_x = 2$ and $f_y = 12$, so the plane is $z = 13 + 2(x - 1) + 12(y - 2)$, which simplifies to $z = 2x + 12y - 13$.'
          - problem: 'Find an equation of the plane tangent to the cone $z = \sqrt{x^2 + y^2}$ at the point $(3, 4, 5)$.'
            answer: '5z = 3x + 4y'
            answer_contract: {"kind":"polynomial_relation"}
            solution_sketch: 'At $(3, 4)$, $f_x = \frac{x}{\sqrt{x^2 + y^2}} = \frac{3}{5}$ and $f_y = \frac{4}{5}$. The tangent plane is $z = 5 + \frac{3}{5}(x - 3) + \frac{4}{5}(y - 4)$, which simplifies to $5z = 3x + 4y$.'
        constraints: 'integer base points; partials evaluate to small rationals; hillside, dome and reverse-reading contexts'
      - id: kp2
        name: "Linearization and estimates"
        key_prerequisites: [partial-derivatives]
        try_first:
          problem: 'The plane tangent to the surface $z = f(x, y)$ at the point where $(x, y) = (1, 2)$ is $z = 5 + 3(x - 1) - 2(y - 2)$. Near that point the surface is almost the same as the plane. Use the plane to estimate $f(1.1, 2.1)$.'
          answer_contract: {"kind":"exact"}
          answer: '5.1'
          reveal: 'At $(1.1, 2.1)$ the plane has height $5 + 3(0.1) - 2(0.1) = 5.1$. Close to the point of tangency the plane stays near the surface, so its height is a good estimate of $f$; this is the linearization.'
        step_check:
          step: 'has $x - 2 = 0.1$ and $y - 3 = -0.1$'
          question: 'Why do we insert $x - 2$ and $y - 3$, and not $x$ and $y$, next to the slopes $7$ and $2$?'
          options:
            - 'The slopes $7$ and $2$ multiply the coordinates $2.1$ and $2.9$ directly'
            - 'Subtracting the base point makes the estimate exact, not approximate'
            - 'The values $x - 2$ and $y - 3$ are the heights of the surface at the base point'
            - 'The linearization measures the changes away from the base point $(2, 3)$'
          answer: 'The linearization measures the changes away from the base point $(2, 3)$'
          why: '$L$ starts at the known value $f(2, 3)$ and adds the slope times the change in each variable, so only the changes $x - 2$ and $y - 3$ enter.'
        exemplars:
          - problem: 'Use the linearization of $f(x, y) = \sqrt{x^2 + y^2}$ at $(5, 12)$ to estimate $f(5.1, 11.9)$ to three decimal places.'
            answer: '12.946'
            answer_contract: {"kind":"approx","decimals":3}
            solution_sketch: 'At $(5, 12)$, $f = 13$, $f_x = \frac{5}{13}$ and $f_y = \frac{12}{13}$. So $L = 13 + \frac{5}{13}(0.1) + \frac{12}{13}(-0.1) = 12.946153\ldots$, which rounds to $12.946$.'
          - problem: 'Find the linearization $L(x, y)$ of $f(x, y) = x^2 + 3xy$ at the point $(1, 2)$.'
            answer: '8x + 3y - 7'
            answer_contract: {"kind":"function","vars":["x","y"]}
            solution_sketch: 'At $(1, 2)$, $f = 1 + 6 = 7$, $f_x = 2x + 3y = 8$ and $f_y = 3x = 3$. So $L(x, y) = 7 + 8(x - 1) + 3(y - 2) = 8x + 3y - 7$.'
          - problem: 'A resistor of $R = 4$ ohms carries a current $I = V/R$ amperes when the voltage is $V = 12$ volts. Use the linearization of $I(V, R) = V/R$ at $(12, 4)$ to estimate the current when the voltage is $12.3$ volts and the resistance is $3.9$ ohms, to two decimal places.'
            answer: '3.15'
            answer_contract: {"kind":"approx","decimals":2}
            solution_sketch: 'At $(12, 4)$, $I = 3$, $I_V = \frac{1}{R} = 0.25$ and $I_R = -\frac{V}{R^2} = -0.75$. So $L = 3 + 0.25(0.3) - 0.75(-0.1) = 3 + 0.075 + 0.075 = 3.15$ amperes.'
          - problem: 'Use the linearization of $f(x, y) = xy^2$ at $(1, 2)$ to estimate $f(1.1, 1.95)$ to two decimal places.'
            answer: '4.20'
            answer_contract: {"kind":"approx","decimals":2}
            solution_sketch: 'At $(1, 2)$, $f = 4$, $f_x = y^2 = 4$ and $f_y = 2xy = 4$. So $L = 4 + 4(0.1) + 4(-0.05) = 4 + 0.4 - 0.2 = 4.20$.'
          - problem: 'A cylindrical can is designed with radius $3$ cm and height $10$ cm. The machine makes one with radius $3.05$ cm and height $9.9$ cm. Use the linearization of $V = \pi r^2 h$ at $(r, h) = (3, 10)$ to estimate the volume of this can, in cubic centimeters, to one decimal place.'
            answer: '289.3'
            answer_contract: {"kind":"approx","decimals":1}
            solution_sketch: 'At $(3, 10)$, $V = 90\pi$, $V_r = 2\pi rh = 60\pi$ and $V_h = \pi r^2 = 9\pi$. So $L = 90\pi + 60\pi(0.05) + 9\pi(-0.1) = 92.1\pi$, which is about $289.3$.'
          - problem: 'Use the linearization of $f(x, y) = e^{x + 2y}$ at $(0, 0)$ to estimate $f(0.03, -0.01)$ to two decimal places.'
            answer: '1.01'
            answer_contract: {"kind":"approx","decimals":2}
            solution_sketch: 'At $(0, 0)$, $f = 1$, $f_x = 1$ and $f_y = 2$. So $L = 1 + 1(0.03) + 2(-0.01) = 1.01$.'
          - problem: 'A rectangular plot measures $10$ m by $20$ m. A second measurement gives $10.2$ m by $19.8$ m. Use the linearization of $A(x, y) = xy$ at $(10, 20)$ to estimate the area from the second measurement.'
            answer: '202'
            answer_contract: {"kind":"unit","quantity":"area","unit":"m^2","allow_omitted":true}
            solution_sketch: 'At $(10, 20)$, $A = 200$, $A_x = y = 20$ and $A_y = x = 10$. So $L = 200 + 20(0.2) + 10(-0.2) = 200 + 4 - 2 = 202$ square meters.'
          - problem: 'Use the linearization of $f(x, y) = x^3 y$ at $(1, 2)$ to estimate $f(1.02, 2.03)$ to two decimal places.'
            answer: '2.15'
            answer_contract: {"kind":"approx","decimals":2}
            solution_sketch: 'At $(1, 2)$, $f = 2$, $f_x = 3x^2 y = 6$ and $f_y = x^3 = 1$. So $L = 2 + 6(0.02) + 1(0.03) = 2.15$.'
          - problem: 'Use the linearization of $f(x, y) = \dfrac{x}{y}$ at $(2, 1)$ to estimate $f(2.1, 0.9)$.'
            answer: '23/10'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'At $(2, 1)$, $f = 2$, $f_x = \frac{1}{y} = 1$ and $f_y = -\frac{x}{y^2} = -2$. So $L = 2 + 1(0.1) - 2(-0.1) = 2.3 = \frac{23}{10}$.'
          - problem: 'Sam uses the linearization of $f(x, y) = x^2 y$ at $(3, 2)$ to estimate $f(3.1, 1.9)$ and gets $20.1$. What is the correct estimate, to one decimal place?'
            answer: '18.3'
            answer_contract: {"kind":"approx","decimals":1}
            solution_sketch: 'At $(3, 2)$, $f = 18$, $f_x = 2xy = 12$ and $f_y = x^2 = 9$. The change in $y$ is $-0.1$, so $L = 18 + 12(0.1) + 9(-0.1) = 18.3$. Sam added $0.9$ instead of subtracting it.'
        constraints: 'base points where f and its partials are exact rationals; estimates stay within 0.05 of the true value; resistor, can and plot contexts'
    diagnostic_exemplar:
      problem: 'Use the linearization of $f(x, y) = x^2 y$ at $(2, 3)$ to estimate $f(2.1, 2.9)$.'
      answer: '$12.8$'
      solution_sketch: '$f(2,3) = 12$, $f_x = 2xy = 12$, $f_y = x^2 = 4$, so $L(x,y) = 12 + 12(x-2) + 4(y-3)$ and $L(2.1, 2.9) = 12 + 1.2 - 0.4 = 12.8$.'
    anki_seeds:
      - front: 'Tangent plane to $z = f(x,y)$ at $(a, b, f(a,b))$?'
        back: '$z = f(a,b) + f_x(a,b)(x-a) + f_y(a,b)(y-b)$'
        type: basic
      - front: 'Linearization $L(x, y)$ of $f$ at $(a, b)$?'
        back: '$L(x,y) = f(a,b) + f_x(a,b)(x-a) + f_y(a,b)(y-b)$ — the tangent plane used as an approximation.'
        type: basic

  - id: differentials-error-estimation
    name: "Differentials and Error Estimation"
    core: false                # error-estimation application; terminal
    difficulty: 0.72
    drill: false
    answer_kind: numeric
    expected_time_secs: 180
    prerequisites:
      - id: tangent-planes-linear-approximation
        weight: 0.7
        key: true
      - id: differentials-error-propagation
        weight: 0.4
        key: false
    knowledge_points:
      - id: kp1
        name: 'The total differential'
        key_prerequisites: [tangent-planes-linear-approximation]
        step_check:
          step: 'Multiply each partial by its increment and add'
          question: 'Why does the total differential multiply each partial derivative by its own increment and add the results?'
          options:
            - 'The larger product gives the change in $z$, and the smaller one is a small correction'
            - 'Multiplying by the increments converts each partial into a value of $z$ at the new point'
            - 'Each term is the change in $z$ caused by one variable alone, and the changes add'
          answer: 'Each term is the change in $z$ caused by one variable alone, and the changes add'
          why: 'A partial derivative is the change in $z$ per unit change in one variable. Times that variable''s increment, it is the change in $z$ from that variable alone, and the separate changes add.'
        try_first:
          problem: 'The surface $z = 3x + 2y$ has constant slopes. By how much does $z$ change when $x$ increases by $0.1$ and $y$ decreases by $0.2$?'
          answer_contract: {"kind":"exact"}
          answer: '-0.1'
          reveal: 'The change is $3(0.1) + 2(-0.2) = -0.1$: each variable contributes its slope times its own increment, and the contributions add. On a curved surface the total differential does the same, with the slopes taken at the point.'
        exemplars:
          - problem: 'Let $z = x^2y^3$. Use the total differential to estimate the change in $z$ when $(x, y)$ moves from $(2, 1)$ to $(2.1, 0.9)$.'
            answer: '-0.8'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The total differential is $dz = 2xy^3\,dx + 3x^2y^2\,dy$. At $(2, 1)$ the coefficients are $4$ and $12$, and the increments are $dx = 0.1$ and $dy = -0.1$. So $dz = 4(0.1) + 12(-0.1) = 0.4 - 1.2 = -0.8$.'
          - problem: 'Let $w = x^2 + y^2 + z^2$. Use the total differential to estimate the change in $w$ when $(x, y, z)$ moves from $(2, 1, 1)$ to $(2.1, 0.9, 1.1)$.'
            answer: '0.4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'With three variables the differential has three terms: $dw = 2x\,dx + 2y\,dy + 2z\,dz$. At $(2, 1, 1)$ the coefficients are $4$, $2$ and $2$, and the increments are $0.1$, $-0.1$ and $0.1$. So $dw = 0.4 - 0.2 + 0.2 = 0.4$.'
          - problem: 'A point moves from $(3, 4)$ to $(3.1, 4.1)$ in the plane. Use the total differential to estimate the change in its distance $r = \sqrt{x^2 + y^2}$ from the origin.'
            answer: '0.14'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The partials are $r_x = x/r$ and $r_y = y/r$. At $(3, 4)$ we have $r = 5$, so the coefficients are $0.6$ and $0.8$. Then $dr = 0.6(0.1) + 0.8(0.1) = 0.14$.'
          - problem: 'A rectangular garden measures $12$ m by $5$ m. It is extended to $12.2$ m by $5.1$ m. Use the total differential of $A = lw$ to estimate the change in its area.'
            answer: '2.2'
            answer_contract: {"kind":"unit","quantity":"area","unit":"m^2","allow_omitted":true}
            solution_sketch: 'The total differential is $dA = w\,dl + l\,dw$. With $l = 12$, $w = 5$, $dl = 0.2$ and $dw = 0.1$ we get $dA = 5(0.2) + 12(0.1) = 1 + 1.2 = 2.2$. The area grows by about $2.2$ square metres.'
          - problem: 'A runner covers $d = 400$ m in $t = 50$ s, so the average speed is $v = d/t$. A recount gives $d = 402$ m and $t = 49$ s. Use the total differential to estimate the change in the average speed.'
            answer: '0.2'
            answer_contract: {"kind":"unit","quantity":"speed","unit":"m/s","allow_omitted":true}
            solution_sketch: 'The partials are $v_d = 1/t$ and $v_t = -d/t^2$. At $(400, 50)$ they equal $0.02$ and $-0.16$. With $dd = 2$ and $dt = -1$, $dv = 0.02(2) + (-0.16)(-1) = 0.04 + 0.16 = 0.2$ metres per second.'
          - problem: 'Let $z = xy$. Moving from $(3, 2)$ to $(3.1, 2.2)$ changes $z$ by $\Delta z$, and the total differential estimates this change as $dz$. Find $\Delta z - dz$.'
            answer: '0.02'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The estimate is $dz = y\,dx + x\,dy = 2(0.1) + 3(0.2) = 0.8$. The actual change is $\Delta z = 3.1(2.2) - 3(2) = 6.82 - 6 = 0.82$. So $\Delta z - dz = 0.02$, the small term $dx\,dy$ that the differential leaves out.'
          - problem: 'Let $s = \sqrt{x + y}$. Use the total differential to estimate the change in $s$ when $(x, y)$ moves from $(3, 1)$ to $(3.2, 1.1)$.'
            answer: '0.075'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Both partials equal $\frac{1}{2\sqrt{x+y}}$, and at $(3, 1)$ this is $\frac{1}{4} = 0.25$. With $dx = 0.2$ and $dy = 0.1$ we get $ds = 0.25(0.2) + 0.25(0.1) = 0.05 + 0.025 = 0.075$.'
          - problem: 'Sam estimates the change in $z = x^2y$ from $(2, 3)$ to $(2.1, 2.9)$ and writes $dz = 2xy\,dx = 12(0.1) = 1.2$. What is the correct estimate?'
            answer: '0.8'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Sam left out the $dy$ term. The full differential is $dz = 2xy\,dx + x^2\,dy = 12(0.1) + 4(-0.1) = 1.2 - 0.4$. So the correct estimate is $dz = 0.8$.'
        constraints: 'polynomial, radical or quotient functions of two or three variables; increments of 0.1 to 1 unit; contexts include areas, speeds, and a comparison of dz with the actual change'
      - id: kp2
        name: 'Error estimation'
        key_prerequisites: [tangent-planes-linear-approximation]
        step_check:
          step: 'add the worst-case contributions'
          question: 'Why do we add the three error contributions instead of letting some of them cancel?'
          options:
            - 'The errors in length, width and height always point the same way, so none can cancel'
            - 'The worst case is when every measurement is off in the direction that adds to it'
            - 'Errors in different measurements are independent, so they combine by multiplying'
          answer: 'The worst case is when every measurement is off in the direction that adds to it'
          why: 'We want the greatest possible error. That happens when every measurement is off in the direction that increases the result, so each term counts with the same sign.'
        exemplars:
          - problem: 'A rectangular block measures $5$ cm, $8$ cm and $4$ cm, and each edge may be off by as much as $0.05$ cm. Use differentials to estimate the greatest possible error in the volume.'
            answer: '4.6'
            answer_contract: {"kind":"unit","quantity":"cubic_volume","unit":"cm^3","allow_omitted":true}
            solution_sketch: 'For $V = xyz$ the differential is $dV = yz\,dx + xz\,dy + xy\,dz$. The coefficients are $32$, $20$ and $40$, so $dV = (32 + 20 + 40)(0.05) = 92(0.05) = 4.6$. The greatest possible error is $4.6$ cubic centimetres.'
          - problem: 'The radius of a cylinder is measured with a relative error of at most $2\%$ and its height with a relative error of at most $0.5\%$. Use differentials to estimate the greatest relative error in the volume $V = \pi r^2 h$.'
            answer: '4.5%'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Taking logarithms gives $\ln V = \ln \pi + 2\ln r + \ln h$, so $\frac{dV}{V} = 2\frac{dr}{r} + \frac{dh}{h}$. The greatest error adds the magnitudes: $2(2\%) + 0.5\% = 4.5\%$. The radius counts twice because it is squared.'
          - problem: 'A triangular sign has base $24$ cm and height $10$ cm. The base may be off by $0.06$ cm and the height by $0.05$ cm. Use differentials to estimate the greatest possible error in the area.'
            answer: '0.9'
            answer_contract: {"kind":"unit","quantity":"area","unit":"cm^2","allow_omitted":true}
            solution_sketch: 'For $A = \frac12 bh$ the differential is $dA = \frac12(h\,db + b\,dh)$. So $dA = \frac12(10(0.06) + 24(0.05)) = \frac12(0.6 + 1.2) = 0.9$. The greatest possible error is $0.9$ square centimetres.'
          - problem: 'A metal sample has mass $m = 250$ g, measured to within $1$ g, and volume $V = 100$ cm$^3$, measured to within $2$ cm$^3$. Use differentials to estimate the greatest possible error in the density $\rho = m/V$, in g/cm$^3$.'
            answer: '0.06'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The partials are $\rho_m = 1/V$ and $\rho_V = -m/V^2$, with magnitudes $0.01$ and $0.025$. The greatest error adds the magnitudes of the two terms: $0.01(1) + 0.025(2) = 0.01 + 0.05 = 0.06$ g/cm$^3$.'
          - problem: 'The mass of a cart is measured with a relative error of at most $0.5\%$ and its speed with a relative error of at most $1.5\%$. Use differentials to estimate the greatest relative error in its kinetic energy $E = \frac12 mv^2$.'
            answer: '3.5%'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Taking logarithms gives $\frac{dE}{E} = \frac{dm}{m} + 2\frac{dv}{v}$. The greatest error adds the magnitudes: $0.5\% + 2(1.5\%) = 0.5\% + 3\% = 3.5\%$.'
          - problem: 'A quantity $f(x, y) = x^2y$ is computed from $x = 5$ and $y = 2$, each measured to within $0.05$. Use differentials to estimate the greatest possible error in $f$.'
            answer: '2.25'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The differential is $df = 2xy\,dx + x^2\,dy$. At $(5, 2)$ the coefficients are $20$ and $25$, so $df = 20(0.05) + 25(0.05) = 1 + 1.25 = 2.25$.'
          - problem: 'A cone has radius $3$ cm and height $7$ cm, measured to within $0.05$ cm and $0.06$ cm. Use differentials to estimate the greatest possible error in the volume $V = \frac13\pi r^2 h$, to two decimal places.'
            answer: '2.76'
            answer_contract: {"kind":"approx","decimals":2}
            solution_sketch: 'The differential is $dV = \frac13\pi(2rh\,dr + r^2\,dh)$. The bracket is $2(3)(7)(0.05) + 9(0.06) = 2.1 + 0.54 = 2.64$, so $dV = \frac13\pi(2.64) = 0.88\pi \approx 2.7646$. To two decimal places the greatest error is $2.76$ cubic centimetres.'
          - problem: 'A car travels $d = 100$ m in $t = 12.5$ s. The distance is measured to within $0.5$ m and the time to within $0.1$ s. Use differentials to estimate the greatest possible error in the average speed $v = d/t$.'
            answer: '0.104'
            answer_contract: {"kind":"unit","quantity":"speed","unit":"m/s","allow_omitted":true}
            solution_sketch: 'The partials are $v_d = 1/t = 0.08$ and $v_t = -d/t^2 = -0.64$. The greatest error adds the magnitudes: $0.08(0.5) + 0.64(0.1) = 0.04 + 0.064 = 0.104$ metres per second.'
        constraints: 'measurement errors of 0.05 to 2 units or 0.5 to 2 percent; products, powers and quotients; answers are decimals, percents or measured quantities'
    diagnostic_exemplar:
      problem: 'A rectangular box is measured as $20 \times 10 \times 5$ cm, each dimension with a maximum error of $0.1$ cm. Use differentials to estimate the maximum error in the computed volume $V = xyz$.'
      answer: '$35$ cm$^3$'
      answer_contract: {kind: none}
      solution_sketch: '$dV = yz\,dx + xz\,dy + xy\,dz = (50 + 100 + 200)(0.1) = 35$.'
    anki_seeds:
      - front: 'Total differential of $z = f(x, y)$?'
        back: '$dz = f_x\, dx + f_y\, dy$'
        type: basic
      - front: 'Estimating maximum error with differentials: combine each term with...'
        back: 'the worst-case (same) sign: $|dz| \le |f_x||dx| + |f_y||dy|$.'
        type: basic

  - id: chain-rule-one-parameter
    name: "Chain Rule Along a Curve"
    core: true
    difficulty: 0.70
    drill: false
    answer_kind: numeric
    expected_time_secs: 150
    prerequisites:
      - id: partial-derivatives
        weight: 0.7
        key: true
      - id: chain-rule
        weight: 0.5
        key: true
      - id: parametric-equations
        weight: 0.3
        key: false
    knowledge_points:
      - id: kp1
        name: 'The one-parameter chain rule'
        key_prerequisites: [partial-derivatives, chain-rule]
        step_check:
          step: 'multiply the pairs and add'
          question: 'Why does $\frac{dz}{dt}$ add two products instead of using just one?'
          options:
            - 'The variable $t$ changes $z$ through $x$ and through $y$, so both effects count'
            - 'Only one product is the true rate, and the other is kept as a check on it'
            - 'The two products are added because $x$ and $y$ are both functions of $z$ itself'
          answer: 'The variable $t$ changes $z$ through $x$ and through $y$, so both effects count'
          why: 'As $t$ changes, $x$ changes and moves $z$, and $y$ changes and moves $z$. Each path from $t$ to $z$ contributes one product, and the contributions add.'
        try_first:
          problem: 'A point $(x, y)$ moves with $x = t$ and $y = 5t$. The quantity $z = 3x + 2y$ is computed along the way. How fast does $z$ change with $t$?'
          answer_contract: {"kind":"exact"}
          answer: '13'
          reveal: 'Here $\frac{dz}{dt} = 3\cdot 1 + 2\cdot 5 = 13$: each variable contributes its own rate, scaled by how strongly $z$ depends on it. The chain rule does this for any $z = f(x, y)$.'
        exemplars:
          - problem: 'Let $z = x^2y$ with $x = t^2$ and $y = t^3$. Use the chain rule to find $\dfrac{dz}{dt}$.'
            answer: '7t^6'
            answer_contract: {"kind":"function","vars":["t"]}
            solution_sketch: 'The chain rule gives $\frac{dz}{dt} = 2xy\cdot 2t + x^2\cdot 3t^2$. Substituting $x = t^2$ and $y = t^3$ gives $4t^6 + 3t^6 = 7t^6$. This agrees with $z = t^7$, whose derivative is $7t^6$.'
          - problem: 'Let $w = xy + z^2$ with $x = e^t$, $y = e^{-t}$ and $z = t$. Find $\dfrac{dw}{dt}$.'
            answer: '2t'
            answer_contract: {"kind":"function","vars":["t"]}
            solution_sketch: 'With three intermediate variables, $\frac{dw}{dt} = y\,e^t + x(-e^{-t}) + 2z\cdot 1$. Substituting gives $1 - 1 + 2t = 2t$. This agrees with $w = 1 + t^2$, whose derivative is $2t$.'
          - problem: 'Let $z = xy^2$ with $x = t$ and $y = t^2$. Find $\dfrac{dz}{dt}$.'
            answer: '5t^4'
            answer_contract: {"kind":"function","vars":["t"]}
            solution_sketch: 'The chain rule gives $\frac{dz}{dt} = y^2\cdot 1 + 2xy\cdot 2t$. Substituting $x = t$ and $y = t^2$ gives $t^4 + 4t^4 = 5t^4$. This agrees with $z = t^5$.'
          - problem: 'Let $z = x^2 + 2xy$ with $x = t^2$ and $y = t$. Find the value of $\dfrac{dz}{dt}$ at $t = 2$.'
            answer: '56'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The chain rule gives $\frac{dz}{dt} = (2x + 2y)\cdot 2t + 2x\cdot 1$. Substituting $x = t^2$ and $y = t$ gives $(2t^2 + 2t)(2t) + 2t^2 = 4t^3 + 6t^2$. At $t = 2$ this is $32 + 24 = 56$.'
          - problem: 'Let $z = x^2 + y^2$ with $x = t^2$ and $y = 3t$. Find $\dfrac{dz}{dt}$.'
            answer: '4t^3+18t'
            answer_contract: {"kind":"function","vars":["t"]}
            solution_sketch: 'The chain rule gives $\frac{dz}{dt} = 2x\cdot 2t + 2y\cdot 3$. Substituting $x = t^2$ and $y = 3t$ gives $4t^3 + 18t$.'
          - problem: 'Let $z = x\sin y$ with $x = t^3$ and $y = t$. Find $\dfrac{dz}{dt}$.'
            answer: '3t^2 sin(t)+t^3 cos(t)'
            answer_contract: {"kind":"function","vars":["t"]}
            solution_sketch: 'The chain rule gives $\frac{dz}{dt} = \sin y\cdot 3t^2 + x\cos y\cdot 1$. Substituting $x = t^3$ and $y = t$ gives $3t^2\sin t + t^3\cos t$.'
          - problem: 'A cylinder has radius $r = 2 + t$ cm and height $h = 10 - t$ cm, where $t$ is time in seconds. Find the rate at which the volume $V = \pi r^2 h$ is changing at $t = 1$, in cm$^3$ per second.'
            answer: '45*pi'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The chain rule gives $\frac{dV}{dt} = 2\pi rh\cdot\frac{dr}{dt} + \pi r^2\cdot\frac{dh}{dt}$. At $t = 1$ we have $r = 3$ and $h = 9$, with $\frac{dr}{dt} = 1$ and $\frac{dh}{dt} = -1$. So $\frac{dV}{dt} = 54\pi - 9\pi = 45\pi$.'
          - problem: 'A sample of gas has mass $m = 50 + 2t$ g and volume $V = 20 + t$ cm$^3$ at time $t$ seconds. Find how fast the density $\rho = m/V$ is changing at $t = 0$, in g/cm$^3$ per second.'
            answer: '-0.025'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The partials are $\rho_m = 1/V$ and $\rho_V = -m/V^2$. At $t = 0$ we have $m = 50$ and $V = 20$, so they equal $0.05$ and $-0.125$, and $\frac{dm}{dt} = 2$, $\frac{dV}{dt} = 1$. So $\frac{d\rho}{dt} = 0.05(2) - 0.125(1) = -0.025$. The density is falling.'
          - problem: 'Sam finds $\frac{dz}{dt}$ for $z = xy$ with $x = t^2$ and $y = t^4$ and writes $\frac{dz}{dt} = y\cdot 2t + x$. What is the correct derivative?'
            answer: '6t^5'
            answer_contract: {"kind":"function","vars":["t"]}
            solution_sketch: 'Sam forgot the factor $\frac{dy}{dt} = 4t^3$ in the second term. The correct sum is $y\cdot 2t + x\cdot 4t^3 = 2t^5 + 4t^5 = 6t^5$. This agrees with $z = t^6$.'
        constraints: 'compositions collapse to a clean single-variable check; require the chain-rule computation, not just substitution; contexts give both inner functions of time'
      - id: kp2
        name: 'Rates along a moving point'
        key_prerequisites: [partial-derivatives, chain-rule]
        step_check:
          step: 'Evaluate the partials at the instant'
          question: 'Why do we evaluate the partials at the point where the bug is now?'
          options:
            - 'The bug starts at that point, so the partials are found there once and then reused'
            - 'The rate $\frac{dT}{dt}$ is the same everywhere along the path, so one point is enough'
            - 'The slopes of $T$ change from point to point, so the rate depends on the position'
          answer: 'The slopes of $T$ change from point to point, so the rate depends on the position'
          why: 'The partials $T_x$ and $T_y$ are slopes of the temperature surface, and they differ from place to place. The rate at an instant uses the slopes where the bug is at that instant.'
        exemplars:
          - problem: 'The temperature at $(x, y)$ is $T = xy^2$ degrees. A bug at $(2, 3)$ moves so that $\frac{dx}{dt} = -1$ and $\frac{dy}{dt} = 4$, with $t$ in seconds. How fast is the temperature at the bug changing at that instant, in degrees per second?'
            answer: '39'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The chain rule gives $\frac{dT}{dt} = T_x\frac{dx}{dt} + T_y\frac{dy}{dt}$. At $(2, 3)$ we have $T_x = y^2 = 9$ and $T_y = 2xy = 12$. So $\frac{dT}{dt} = 9(-1) + 12(4) = -9 + 48 = 39$.'
          - problem: 'The pressure of a gas is $P = 8T/V$ kilopascals when $T$ is in kelvin and $V$ in litres. At an instant $T = 300$ and $V = 4$, while $T$ rises at $2$ K per minute and $V$ rises at $0.1$ L per minute. How fast is the pressure changing, in kilopascals per minute?'
            answer: '-11'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The partials are $P_T = 8/V = 2$ and $P_V = -8T/V^2 = -150$. So $\frac{dP}{dt} = 2(2) + (-150)(0.1) = 4 - 15 = -11$. The pressure falls, because the larger volume outweighs the higher temperature.'
          - problem: 'A hill has height $h = 100 - x^2 - 2y^2$ metres above sea level. A hiker at $(3, 1)$ walks so that $\frac{dx}{dt} = 1$ and $\frac{dy}{dt} = 2$, with $t$ in minutes. How fast is the height of the hiker changing at that instant, in metres per minute?'
            answer: '-14'
            answer_contract: {"kind":"unit","quantity":"speed","unit":"m/min","allow_omitted":true}
            solution_sketch: 'The partials are $h_x = -2x = -6$ and $h_y = -4y = -4$ at $(3, 1)$. So $\frac{dh}{dt} = (-6)(1) + (-4)(2) = -6 - 8 = -14$. The hiker is descending at $14$ metres per minute.'
          - problem: 'A particle moves in the plane, and $z = x^2 + y^2$ is the square of its distance from the origin. At $(3, 4)$ the particle has $\frac{dx}{dt} = 4$ and $\frac{dy}{dt} = -3$. How fast is $z$ changing at that instant?'
            answer: '0'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'At $(3, 4)$ the partials are $z_x = 2x = 6$ and $z_y = 2y = 8$. So $\frac{dz}{dt} = 6(4) + 8(-3) = 24 - 24 = 0$. The velocity is tangent to the circle $x^2 + y^2 = 25$, so the distance does not change at that instant.'
          - problem: 'A rectangle has length $x = 2$ m, increasing at $3$ m/s, and width $y = 3$ m, decreasing at $2$ m/s. How fast is its area $A = xy$ changing, in square metres per second?'
            answer: '5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The partials are $A_x = y = 3$ and $A_y = x = 2$. So $\frac{dA}{dt} = 3(3) + 2(-2) = 9 - 4 = 5$. The area grows by $5$ square metres per second, because the length gain outweighs the width loss.'
          - problem: 'Let $z = x^3y$. A moving point at $(2, 1)$ has $\frac{dx}{dt} = 1$ and $\frac{dy}{dt} = 2$. Find $\frac{dz}{dt}$ at that instant.'
            answer: '28'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'At $(2, 1)$ the partials are $z_x = 3x^2y = 12$ and $z_y = x^3 = 8$. So $\frac{dz}{dt} = 12(1) + 8(2) = 12 + 16 = 28$.'
          - problem: 'Let $z = e^x\sin y$. At the point $(0, \pi/2)$ the velocity is $\frac{dx}{dt} = 2$ and $\frac{dy}{dt} = 3$. Find $\frac{dz}{dt}$ there.'
            answer: '2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'At $(0, \pi/2)$ the partials are $z_x = e^x\sin y = 1$ and $z_y = e^x\cos y = 0$. So $\frac{dz}{dt} = 1(2) + 0(3) = 2$.'
          - problem: 'Let $z = x^2 - y^2$. A point at $(3, -2)$ has $\frac{dx}{dt} = 2$ and $\frac{dy}{dt} = 3$. Find $\frac{dz}{dt}$ at that instant.'
            answer: '24'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'At $(3, -2)$ the partials are $z_x = 2x = 6$ and $z_y = -2y = 4$. So $\frac{dz}{dt} = 6(2) + 4(3) = 12 + 12 = 24$.'
        constraints: 'evaluation at a specific instant with integer partials and velocities; include one level-curve (zero-rate) case; contexts include a quotient'
    diagnostic_exemplar:
      problem: 'The temperature at $(x, y)$ is $T(x, y) = x^2 y$. A particle passing through $(3, 2)$ has $\frac{dx}{dt} = -1$ and $\frac{dy}{dt} = 4$. How fast is the temperature at the particle changing?'
      answer: '$24$ degrees per unit time.'
      answer_contract: {kind: none}
      solution_sketch: '$\frac{dT}{dt} = T_x \frac{dx}{dt} + T_y \frac{dy}{dt} = 2xy(-1) + x^2(4) = 12(-1) + 9(4) = 24$.'
    anki_seeds:
      - front: 'Chain rule for $z = f(x, y)$, $x = x(t)$, $y = y(t)$?'
        back: '$\frac{dz}{dt} = \frac{\partial z}{\partial x}\frac{dx}{dt} + \frac{\partial z}{\partial y}\frac{dy}{dt}$'
        type: basic
      - front: 'If a point moves along a level curve of $f$, then $\frac{df}{dt} = $ {{c1::$0$}}.'
        back: '$0$'
        type: cloze

  - id: multivariable-chain-rule
    name: "The Multivariable Chain Rule"
    core: true
    difficulty: 0.75
    drill: false
    answer_kind: numeric
    expected_time_secs: 180
    prerequisites:
      - id: chain-rule-one-parameter
        weight: 0.8
        key: true
      - id: implicit-differentiation
        weight: 0.5
        key: false
      - id: partial-derivatives
        weight: 0.4
        key: false
    knowledge_points:
      - id: kp1
        name: 'Chain rule with two independent variables'
        key_prerequisites: [chain-rule-one-parameter, partial-derivatives]
        step_check:
          step: 'one through $x$ and one through $y$'
          question: 'Why does $\frac{\partial z}{\partial s}$ have two terms?'
          options:
            - 'The function $z$ has two terms, $x^2y$ and $y^2$, and each needs its own term'
            - 'A change in $s$ moves both $x$ and $y$, and each of them changes $z$'
            - 'There are two independent variables, $s$ and $t$, and each one gives one term'
          answer: 'A change in $s$ moves both $x$ and $y$, and each of them changes $z$'
          why: 'The number of terms counts the paths from $z$ to $s$. There is one path through $x$ and one through $y$, so there are two products to add.'
        exemplars:
          - problem: 'Let $z = x^2 + xy$ with $x = s + t$ and $y = s - t$. Use the chain rule to find $\dfrac{\partial z}{\partial s}$ in terms of $s$ and $t$.'
            answer: '4s+2t'
            answer_contract: {"kind":"function","vars":["s","t"]}
            solution_sketch: 'The chain rule gives $\frac{\partial z}{\partial s} = (2x + y)(1) + x(1) = 3x + y$. Substituting $x = s + t$ and $y = s - t$ gives $3(s + t) + (s - t) = 4s + 2t$.'
          - problem: 'Let $z = xe^y$ with $x = st$ and $y = s - t$. Find $\dfrac{\partial z}{\partial t}$.'
            answer: 's(1-t)e^(s-t)'
            answer_contract: {"kind":"function","vars":["s","t"]}
            solution_sketch: 'The chain rule gives $\frac{\partial z}{\partial t} = e^y\cdot s + xe^y\cdot(-1)$. Substituting $x = st$ and $y = s - t$ gives $se^{s-t} - ste^{s-t} = s(1 - t)e^{s-t}$.'
          - problem: 'Let $z = e^x\sin y$ with $x = st^2$ and $y = s^2t$. Find $\dfrac{\partial z}{\partial t}$.'
            answer: 'e^(s*t^2)*(2*s*t*sin(s^2*t) + s^2*cos(s^2*t))'
            answer_contract: {"kind":"function","vars":["s","t"]}
            solution_sketch: 'The chain rule gives $\frac{\partial z}{\partial t} = e^x\sin y\cdot 2st + e^x\cos y\cdot s^2$. Substituting $x = st^2$ and $y = s^2t$ gives $e^{st^2}\left(2st\sin(s^2t) + s^2\cos(s^2t)\right)$.'
          - problem: 'Let $z = x^2y + y^2$ with $x = 3s + t$ and $y = s - 2t$. Find the value of $\dfrac{\partial z}{\partial s}$ at $(s, t) = (1, 2)$.'
            answer: '-71'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The chain rule gives $\frac{\partial z}{\partial s} = 2xy(3) + (x^2 + 2y)(1)$. At $(s, t) = (1, 2)$ we have $x = 5$ and $y = -3$, so this is $-90 + 19 = -71$.'
          - problem: 'Let $z = x^3 + xy^2$ with $x = s - t$ and $y = 2s + t$. Find the value of $\dfrac{\partial z}{\partial t}$ at $(s, t) = (1, 1)$.'
            answer: '-9'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The chain rule gives $\frac{\partial z}{\partial t} = (3x^2 + y^2)(-1) + 2xy(1)$. At $(s, t) = (1, 1)$ we have $x = 0$ and $y = 3$, so this is $-9 + 0 = -9$.'
          - problem: 'Let $z = x^2y$ with $x = st$ and $y = s^2 + t$. Find $\dfrac{\partial z}{\partial s}$.'
            answer: '4s^3t^2+2st^3'
            answer_contract: {"kind":"function","vars":["s","t"]}
            solution_sketch: 'The chain rule gives $\frac{\partial z}{\partial s} = 2xy\cdot t + x^2\cdot 2s$. Substituting $x = st$ and $y = s^2 + t$ gives $2s^3t^2 + 2st^3 + 2s^3t^2 = 4s^3t^2 + 2st^3$.'
          - problem: 'Let $z = x^3y^2 + x$ with $x = s + 2t$ and $y = 2s - t$. Find the value of $\dfrac{\partial z}{\partial t}$ at $(s, t) = (2, 1)$.'
            answer: '482'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The chain rule gives $\frac{\partial z}{\partial t} = (3x^2y^2 + 1)(2) + 2x^3y(-1)$. At $(s, t) = (2, 1)$ we have $x = 4$ and $y = 3$, so this is $433(2) - 384 = 866 - 384 = 482$.'
          - problem: 'A rectangle has length $x = 3s + t$ and width $y = s - 2t$ metres, where $s$ and $t$ are two design settings. Find $\dfrac{\partial A}{\partial s}$ for the area $A = xy$ at $(s, t) = (4, 1)$, in square metres per unit of $s$.'
            answer: '19'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The chain rule gives $\frac{\partial A}{\partial s} = y\cdot 3 + x\cdot 1$. At $(s, t) = (4, 1)$ we have $x = 13$ and $y = 2$, so $\frac{\partial A}{\partial s} = 2(3) + 13 = 19$.'
          - problem: 'A drone flies $d = 40 + 5a + 2b$ metres in $\tau = 8 + a - b$ seconds, where $a$ and $b$ are two control settings, so its average speed is $v = d/\tau$. Find $\dfrac{\partial v}{\partial a}$ at $(a, b) = (2, 1)$, in metres per second per unit of $a$.'
            answer: '-7/81'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The partials are $v_d = 1/\tau$ and $v_\tau = -d/\tau^2$. At $(2, 1)$ we have $d = 52$ and $\tau = 9$, with $d_a = 5$ and $\tau_a = 1$. So $\frac{\partial v}{\partial a} = \frac{5}{9} - \frac{52}{81} = \frac{45 - 52}{81} = -\frac{7}{81}$.'
        constraints: 'two intermediate and two independent variables; draw or imply the dependency tree; contexts include areas and a quotient'
      - id: kp2
        name: 'Tree diagrams and the general version'
        key_prerequisites: [chain-rule-one-parameter, partial-derivatives]
        step_check:
          step: 'Multiply along each branch'
          question: 'Why do we multiply along a branch of the tree and add across the branches?'
          options:
            - 'Rates along one path add up, and separate paths multiply because they act together'
            - 'The tree has two levels, so we multiply down one level and add across the other'
            - 'Rates along one path compound, and each separate path adds its own share'
          answer: 'Rates along one path compound, and each separate path adds its own share'
          why: 'Along one path each rate scales the next, so the rates multiply. Different paths are separate ways for the change to reach the output, so their contributions add.'
        exemplars:
          - problem: 'Let $u = x^2y^3$ with $x = st^2$ and $y = s^2t$. Find $\dfrac{\partial u}{\partial s}$.'
            answer: '8s^7t^7'
            answer_contract: {"kind":"function","vars":["s","t"]}
            solution_sketch: 'The chain rule gives $\frac{\partial u}{\partial s} = 2xy^3\cdot t^2 + 3x^2y^2\cdot 2st$. Substituting $x = st^2$ and $y = s^2t$ gives $2s^7t^7 + 6s^7t^7 = 8s^7t^7$. This agrees with $u = s^8t^7$.'
          - problem: 'Let $z = f(x, y)$ with $x = g(s, t)$ and $y = h(s, t)$. At $(s, t) = (1, 2)$ we have $g = 3$, $h = 4$, $g_s = -1$ and $h_s = 6$. At $(3, 4)$ we have $f_x = 5$ and $f_y = 2$. Find $z_s$ at $(1, 2)$.'
            answer: '7'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The tree has two branches to $s$, so $z_s = f_xg_s + f_yh_s$. The branch through $x$ gives $5(-1) = -5$ and the branch through $y$ gives $2(6) = 12$. Adding the branches gives $-5 + 12 = 7$.'
          - problem: 'Let $u = x^2y$ with $x = r\cos\theta$ and $y = r\sin\theta$. Find $\dfrac{\partial u}{\partial r}$.'
            answer: '3r^2 cos(theta)^2 sin(theta)'
            answer_contract: {"kind":"function","vars":["r","theta"]}
            solution_sketch: 'The chain rule gives $u_r = 2xy\cos\theta + x^2\sin\theta$. Substituting $x = r\cos\theta$ and $y = r\sin\theta$ gives $2r^2\cos^2\theta\sin\theta + r^2\cos^2\theta\sin\theta = 3r^2\cos^2\theta\sin\theta$.'
          - problem: 'Let $w = f(x, y, z)$ with $x = g(t)$, $y = h(t)$ and $z = k(t)$. At $t = 0$ we have $g''(0) = 4$, $h''(0) = -2$ and $k''(0) = 5$. At the matching point, $f_x = 1$, $f_y = 3$ and $f_z = -2$. Find $\dfrac{dw}{dt}$ at $t = 0$.'
            answer: '-12'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The tree has three branches, so $\frac{dw}{dt} = f_xg''(0) + f_yh''(0) + f_zk''(0)$. The three products are $1(4) = 4$, $3(-2) = -6$ and $-2(5) = -10$. Adding them gives $4 - 6 - 10 = -12$.'
          - problem: 'Let $u = x^2y$ with $x = s + t$ and $y = s - t$. Find $\dfrac{\partial u}{\partial t}$.'
            answer: 's^2 - 2st - 3t^2'
            answer_contract: {"kind":"function","vars":["s","t"]}
            solution_sketch: 'The chain rule gives $u_t = 2xy(1) + x^2(-1)$. Substituting $x = s + t$ and $y = s - t$ gives $2(s^2 - t^2) - (s^2 + 2st + t^2) = s^2 - 2st - 3t^2$.'
          - problem: 'The temperature at a point $(x, y)$ is $T(x, y)$. A bug walks so that $x = g(t)$ and $y = h(t)$. At $t = 1$ we have $g''(1) = -1$ and $h''(1) = 4$, and at the bug''s position $T_x = 5$ and $T_y = -2$. Find $\dfrac{dT}{dt}$ at $t = 1$.'
            answer: '-13'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The tree has two branches, so $\frac{dT}{dt} = T_xg''(1) + T_yh''(1)$. The branch through $x$ gives $5(-1) = -5$ and the branch through $y$ gives $(-2)(4) = -8$. Adding gives $-5 - 8 = -13$.'
          - problem: 'A solution has concentration $c = a/b$, where the amount $a = g(s, t)$ and the volume $b = h(s, t)$ depend on two settings $s$ and $t$. At $(s, t) = (1, 2)$ we have $a = 6$, $b = 3$, $a_t = 2$ and $b_t = -1$. Find $c_t$ at $(1, 2)$.'
            answer: '4/3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The partials of $c = a/b$ are $c_a = 1/b = \frac13$ and $c_b = -a/b^2 = -\frac23$. So $c_t = c_aa_t + c_bb_t = \frac13(2) + \left(-\frac23\right)(-1) = \frac23 + \frac23 = \frac43$.'
        constraints: 'one symbolic and one numeric (table-values) exemplar; every branch of the tree contributes exactly one product; contexts include a quotient'
      - id: kp3
        name: 'Implicit differentiation via partials'
        key_prerequisites: [chain-rule-one-parameter]
        step_check:
          step: 'move every term to one side so the equation reads $F(x,y)=0$'
          question: 'Why do we first write the curve as $F(x, y) = 0$?'
          options:
            - 'The formula $-F_x/F_y$ is stated for $F = 0$, so every term must be on one side'
            - 'A zero on the right makes the partial derivatives $F_x$ and $F_y$ both equal to zero'
            - 'Moving every term to one side solves the equation for $y$ in terms of $x$'
          answer: 'The formula $-F_x/F_y$ is stated for $F = 0$, so every term must be on one side'
          why: 'The rule $\frac{dy}{dx} = -\frac{F_x}{F_y}$ comes from differentiating $F(x, y) = 0$. So we first collect all terms on one side and call that side $F$.'
        try_first:
          problem: 'The circle $x^2 + y^2 = 25$ passes through $(3, 4)$. What is the slope of its tangent line there?'
          answer_contract: {"kind":"exact"}
          answer: '-3/4'
          reveal: 'The radius to $(3, 4)$ has slope $\frac43$ and the tangent is perpendicular, so its slope is $-\frac34$. With $F = x^2 + y^2 - 25$, the formula $-F_x/F_y = -2x/2y = -\frac34$ gives the same slope without geometry.'
        exemplars:
          - problem: 'Use partial derivatives to find $\dfrac{dy}{dx}$ for the curve $x^3 + y^3 = 12xy$.'
            answer: '(4y-x^2)/(y^2-4x)'
            answer_contract: {"kind":"function","vars":["x","y"]}
            solution_sketch: 'Write $F = x^3 + y^3 - 12xy$. Then $F_x = 3x^2 - 12y$ and $F_y = 3y^2 - 12x$. So $\frac{dy}{dx} = -\frac{F_x}{F_y} = -\frac{3x^2 - 12y}{3y^2 - 12x}$, and cancelling $3$ gives $\frac{4y - x^2}{y^2 - 4x}$.'
          - problem: 'The sphere $x^2 + y^2 + z^2 = 16$ defines $z$ implicitly as a function of $x$ and $y$. Find $\dfrac{\partial z}{\partial x}$.'
            answer: '-x/z'
            answer_contract: {"kind":"function","vars":["x","z"]}
            solution_sketch: 'Write $F = x^2 + y^2 + z^2 - 16$. Then $F_x = 2x$ and $F_z = 2z$. So $\frac{\partial z}{\partial x} = -\frac{F_x}{F_z} = -\frac{2x}{2z} = -\frac{x}{z}$.'
          - problem: 'Find $\dfrac{dy}{dx}$ for the curve $x^2y + y^3 = 5$.'
            answer: '-2xy/(x^2+3y^2)'
            answer_contract: {"kind":"function","vars":["x","y"]}
            solution_sketch: 'Write $F = x^2y + y^3 - 5$. Then $F_x = 2xy$ and $F_y = x^2 + 3y^2$. So $\frac{dy}{dx} = -\frac{F_x}{F_y} = -\frac{2xy}{x^2 + 3y^2}$, and nothing cancels.'
          - problem: 'A cyclist rides on a track modeled by $2x^2 + y^2 = 18$, with $x$ and $y$ in kilometres. Find the slope of the track at the point $(1, 4)$.'
            answer: '-1/2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Write $F = 2x^2 + y^2 - 18$. Then $F_x = 4x$ and $F_y = 2y$, so $\frac{dy}{dx} = -\frac{4x}{2y}$. At $(1, 4)$ this is $-\frac48 = -\frac12$.'
          - problem: 'Find $\dfrac{dy}{dx}$ for the curve $x^4 + y^4 = 8xy$.'
            answer: '(2y-x^3)/(y^3-2x)'
            answer_contract: {"kind":"function","vars":["x","y"]}
            solution_sketch: 'Write $F = x^4 + y^4 - 8xy$. Then $F_x = 4x^3 - 8y$ and $F_y = 4y^3 - 8x$. So $\frac{dy}{dx} = -\frac{4x^3 - 8y}{4y^3 - 8x}$, and cancelling $4$ gives $\frac{2y - x^3}{y^3 - 2x}$.'
          - problem: 'Find $\dfrac{dy}{dx}$ for the curve $x^2 + xy + y^2 = 7$.'
            answer: '-(2x+y)/(x+2y)'
            answer_contract: {"kind":"function","vars":["x","y"]}
            solution_sketch: 'Write $F = x^2 + xy + y^2 - 7$. Then $F_x = 2x + y$ and $F_y = x + 2y$. So $\frac{dy}{dx} = -\frac{2x + y}{x + 2y}$.'
          - problem: 'The surface of a dome is $x^2 + y^2 + z^2 = 36$, with $z > 0$ and lengths in metres. Find the slope $\dfrac{\partial z}{\partial x}$ of the dome in the $x$-direction at the point $(4, 4, 2)$.'
            answer: '-2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Write $F = x^2 + y^2 + z^2 - 36$. Then $\frac{\partial z}{\partial x} = -\frac{F_x}{F_z} = -\frac{2x}{2z} = -\frac{x}{z}$. At $(4, 4, 2)$ this is $-\frac42 = -2$.'
          - problem: 'Sam says the slope of the curve $x^2y = 12$ at $(2, 3)$ is $\dfrac{F_x}{F_y} = 3$. What is the correct slope?'
            answer: '-3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Sam left out the minus sign in the formula. With $F = x^2y - 12$ we have $F_x = 2xy = 12$ and $F_y = x^2 = 4$ at $(2, 3)$, so $\frac{dy}{dx} = -\frac{12}{4} = -3$.'
          - problem: 'The surface $x^2y + yz + z^2 = 3$ defines $z$ implicitly as a function of $x$ and $y$. Find $\dfrac{\partial z}{\partial y}$.'
            answer: '-(x^2+z)/(y+2z)'
            answer_contract: {"kind":"function","vars":["x","y","z"]}
            solution_sketch: 'Write $F = x^2y + yz + z^2 - 3$. Then $F_y = x^2 + z$ and $F_z = y + 2z$. So $\frac{\partial z}{\partial y} = -\frac{F_y}{F_z} = -\frac{x^2 + z}{y + 2z}$.'
        constraints: 'F polynomial with integer coefficients; answers simplified by canceling common factors; contexts give a point and ask for the slope there'
    diagnostic_exemplar:
      problem: 'Use $\frac{dy}{dx} = -F_x / F_y$ to find $\frac{dy}{dx}$ for the curve $x^3 + y^3 = 9xy$.'
      answer: '$\dfrac{3y - x^2}{y^2 - 3x}$'
      answer_contract: {kind: none}
      solution_sketch: 'With $F = x^3 + y^3 - 9xy$: $F_x = 3x^2 - 9y$ and $F_y = 3y^2 - 9x$, so $\frac{dy}{dx} = -\dfrac{3x^2 - 9y}{3y^2 - 9x} = \dfrac{3y - x^2}{y^2 - 3x}$.'
    anki_seeds:
      - front: 'General multivariable chain rule via tree diagram?'
        back: 'For each independent variable, sum over every path from the output to it, multiplying the derivatives along each branch.'
        type: basic
      - front: 'Implicit differentiation formula: if $F(x, y) = 0$ defines $y(x)$, then $\frac{dy}{dx} = $ ...'
        back: '$-F_x / F_y$ (where $F_y \ne 0$)'
        type: basic
