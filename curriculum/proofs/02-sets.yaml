  - id: subsets-power-sets
    name: "Subsets and Power Sets"
    core: true
    difficulty: 0.55
    drill: false
    answer_kind: proof
    expected_time_secs: 180
    prerequisites:
      - id: subset-relation-basics
        weight: 0.5
        key: true
      - id: power-set-enumeration
        weight: 0.4
        key: true
      - id: set-operations
        weight: 0.3
      - id: quantifiers
        weight: 0.3
      - id: set-notation
        weight: 0.0
    knowledge_points:
      - id: kp1
        name: "Proving a subset relation"
        key_prerequisites: [set-notation]
        step_check:
          step: 'since $x$ was arbitrary, every element of $A \cap B$ lies in $A \cup B$'
          question: 'Why does a proof for one arbitrary $x$ cover every element of $A \cap B$?'
          options:
            - 'A single example always settles a statement about all elements'
            - 'Nothing about $x$ was used beyond its membership in $A \cap B$'
            - 'The sets $A \cap B$ and $A \cup B$ each have just one element'
            - 'Choosing $x$ at random makes it likely to stand for the others'
          answer: 'Nothing about $x$ was used beyond its membership in $A \cap B$'
          why: 'The argument used only that $x \in A \cap B$, so the same steps work for each element of $A \cap B$; one particular example would prove nothing, because the steps might use a special property of it.'
        exemplars:
          - problem: 'Let $A = \{n \in \mathbb{Z} : 6 \mid n\}$ and $B = \{n \in \mathbb{Z} : 3 \mid n\}$. Is $A \subseteq B$?'
            answer: 'yes'
            answer_contract: {"kind": "label", "options": [["yes", "it is", "true", "yes it is"], ["no", "it is not", "false", "no it is not"]]}
            solution_sketch: 'Take $x \in A$, so $x = 6k$ for some integer $k$. Then $x = 3(2k)$ with $2k$ an integer, so $3 \mid x$ and $x \in B$. This holds for every $x \in A$, so $A \subseteq B$.'
          - problem: 'To prove that $\{12n : n \in \mathbb{Z}\} \subseteq \{3m : m \in \mathbb{Z}\}$, take an arbitrary element $x = 12n$ with $n \in \mathbb{Z}$. Write $x = 3m$. What is $m$ in terms of $n$?'
            answer: '4n'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'We have $x = 12n = 3 \cdot 4n$, so $m = 4n$. Since $n$ is an integer, $4n$ is an integer, so $x$ has the form $3m$ with $m \in \mathbb{Z}$. This is the last step of the proof that $x \in \{3m : m \in \mathbb{Z}\}$.'
          - problem: 'Let $A = \{n \in \mathbb{Z} : 3 \mid n\}$ and $B = \{n \in \mathbb{Z} : 6 \mid n\}$. What is the least positive integer in $A$ that is not in $B$?'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The least positive element of $A$ is $3$. It is not a multiple of $6$, so $3 \notin B$. Hence $3$ shows that $A \not\subseteq B$, and it is the least positive integer that does so.'
          - problem: 'Let $A = \{1, 2\}$ and $B = \{2, 5\}$. Which element of $A \cup B$ shows that $A \cup B \not\subseteq A$?'
            answer: '5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The union is $A \cup B = \{1, 2, 5\}$. The elements $1$ and $2$ are in $A$, but $5$ is not in $A$. So $5$ is the element that shows $A \cup B \not\subseteq A$.'
          - problem: 'Sam says that $A \not\subseteq B$ means that every element of $A$ is outside $B$. Is Sam right?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "it is", "true", "yes it is"], ["no", "it is not", "false", "no it is not"]]}
            solution_sketch: 'The statement $A \subseteq B$ says every element of $A$ is in $B$. Its negation says that some element of $A$ is not in $B$, which is weaker than saying every element of $A$ is outside $B$. For example $\{1, 2\} \not\subseteq \{2, 3\}$, yet $2$ is in both sets. So Sam is not right.'
          - problem: 'Suppose $A \subseteq B$, $|A| = 5$ and $|B| = 9$. How many elements does $B \setminus A$ have?'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Because $A \subseteq B$, every element of $A$ is also in $B$. So $B \setminus A$ holds the elements of $B$ that are not among the $5$ elements of $A$. That is $9 - 5 = 4$ elements.'
          - problem: 'Every member of the debate club is also a member of the school choir. The choir has $21$ members and the debate club has $9$. How many choir members are not in the debate club?'
            answer: '12'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Because every debate club member is in the choir, the debate club is a subset of the choir. So the choir members outside the debate club are found by taking the $9$ debate members away from the $21$ choir members. That gives $21 - 9 = 12$ choir members.'
          - problem: 'A gym gives free entry on the days of a month that are multiples of $6$, and a cafe gives a discount on the days that are multiples of $3$. Take the days $1$ to $30$. Every free-entry day is also a discount day. On how many discount days is entry not free?'
            answer: '5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The multiples of $6$ up to $30$ are $6, 12, 18, 24, 30$, which makes $5$ days, and each of them is a multiple of $3$. The multiples of $3$ up to $30$ number $10$. So $10 - 5 = 5$ discount days are not free-entry days.'
          - problem: 'Write the full proof that for all sets $A$, $B$ and $C$, if $A \subseteq B$ and $B \subseteq C$, then $A \subseteq C$.'
            answer: 'A sub B and B sub C => A sub C'
            answer_contract: {"kind": "none"}
            solution_sketch: 'Let $A$, $B$ and $C$ be sets, and suppose $A \subseteq B$ and $B \subseteq C$. We must show that every element of $A$ is an element of $C$. Let $x$ be an arbitrary element of $A$. Since $x \in A$ and $A \subseteq B$, the definition of subset gives $x \in B$. Since $x \in B$ and $B \subseteq C$, the same definition gives $x \in C$. The element $x$ was arbitrary, so every element of $A$ lies in $C$. Therefore $A \subseteq C$. $\square$'
        constraints: 'decide and justify subset claims with the arbitrary-element method: unpack the definition, find a witness, name the element that makes an inclusion fail, negate a subset claim; one written proof of a subset statement'
      - id: kp2
        name: "Set equality by double inclusion"
        key_prerequisites: [set-operations]
        step_check:
          step: 'the statement is an iff, so we prove two directions'
          question: 'Why must the proof of an "if and only if" statement have two directions?'
          options:
            - 'The statement claims an implication each way, and each needs proof'
            - 'One direction proves the statement and the other only double-checks it'
            - 'Each direction proves that one of the two sets in the statement is empty'
            - 'Two directions are needed even when one side is a subset of the other'
          answer: 'The statement claims an implication each way, and each needs proof'
          why: '"$P$ if and only if $Q$" means "if $P$ then $Q$" and "if $Q$ then $P$"; proving one implication does not give the other, as $x > 2$ implies $x > 1$ but not the reverse.'
        exemplars:
          - problem: 'Is $\{x \in \mathbb{Z} : 2 \mid x\} \cap \{x \in \mathbb{Z} : 3 \mid x\}$ equal to $\{6n : n \in \mathbb{Z}\}$?'
            answer: 'yes'
            answer_contract: {"kind": "label", "options": [["yes", "it is", "true", "yes it is"], ["no", "it is not", "false", "no it is not"]]}
            solution_sketch: 'An integer in the intersection is divisible by $2$ and by $3$. Since $2$ and $3$ share no factor, it is divisible by $6$, so it has the form $6n$. Conversely $6n = 2(3n) = 3(2n)$ is divisible by both. The two sets have the same elements, so they are equal.'
          - problem: 'Let $x$ be an integer with $x = 2a$ and $x = 3b$ for integers $a$ and $b$. Write $x = 6c$, where $c$ is an integer expression in $a$ and $b$. What is $c$?'
            answer: 'a - b'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'From $x = 2a$ we get $3x = 6a$, and from $x = 3b$ we get $2x = 6b$. Subtracting, $x = 3x - 2x = 6a - 6b = 6(a - b)$. So $c = a - b$, which is an integer because $a$ and $b$ are integers.'
          - problem: 'Let $A = \{1, 2, 3\}$ and $B = \{2, 3, 4\}$. Which element of $A$ shows that $A \cap B \neq A$?'
            answer: '1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The intersection is $A \cap B = \{2, 3\}$. The element $1$ is in $A$ but not in $A \cap B$. So $A \subseteq A \cap B$ fails because of $1$, and the two sets are not equal.'
          - problem: 'Sam wants to prove $A \cap B = A$ and shows only that $A \cap B \subseteq A$. Is his proof complete?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "it is", "true", "yes it is"], ["no", "it is not", "false", "no it is not"]]}
            solution_sketch: 'To prove two sets equal, we must prove both inclusions. Sam proved $A \cap B \subseteq A$, which is true for all sets $A$ and $B$ and so says little about this claim. He still has to prove $A \subseteq A \cap B$. So his proof is not complete.'
          - problem: 'How many subsets $A$ of $\{1, 2, 3, 4\}$ satisfy $A \cup \{1, 2, 3\} = \{1, 2, 3\}$?'
            answer: '8'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The union $A \cup \{1, 2, 3\}$ equals $\{1, 2, 3\}$ exactly when $A \subseteq \{1, 2, 3\}$. So we count the subsets of $\{1, 2, 3\}$, which number $2^3 = 8$. The element $4$ must stay out of $A$.'
          - problem: 'What is the least positive element of $\{4k : k \in \mathbb{Z}\} \cap \{6k : k \in \mathbb{Z}\}$?'
            answer: '12'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'An element must be a multiple of $4$ and a multiple of $6$. The positive multiples of $4$ are $4, 8, 12, \dots$, and the first of these that is also a multiple of $6$ is $12$. So the least positive element is $12$.'
          - problem: 'Every student who plays chess also takes part in the quiz team, and every quiz team student plays chess. Nine students play chess. How many students are on the quiz team?'
            answer: '9'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Every chess player is on the quiz team, so the chess set is a subset of the quiz set. Every quiz team student plays chess, so the quiz set is a subset of the chess set. Each set contains the other, so the two sets are equal and both have $9$ elements.'
          - problem: 'Every member of the debate club is also in the school choir, so the union of the two groups equals the choir. The choir has $21$ members and the debate club has $9$. How many students belong to at least one of the two groups?'
            answer: '21'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Because $D \cup C = C$ holds exactly when $D \subseteq C$, the union of the two groups is the choir itself. So the number of students in at least one group is the size of the choir, which is $21$. The count $9$ of the debate club adds nothing new.'
          - problem: 'Write the full proof that for all sets $A$ and $B$, $A \cap B = A$ if and only if $A \subseteq B$.'
            answer: 'A cap B = A iff A sub B'
            answer_contract: {"kind": "none"}
            solution_sketch: 'We prove both directions. ($\Rightarrow$) Suppose $A \cap B = A$. Let $x \in A$. Since $A = A \cap B$, we get $x \in A \cap B$, so $x \in B$ by the definition of intersection. Hence every element of $A$ lies in $B$, so $A \subseteq B$. ($\Leftarrow$) Suppose $A \subseteq B$. We show $A \cap B = A$ by double inclusion. First, let $x \in A \cap B$. Then $x \in A$ by the definition of intersection, so $A \cap B \subseteq A$. Second, let $x \in A$. Since $A \subseteq B$, also $x \in B$. So $x \in A$ and $x \in B$, which means $x \in A \cap B$. Hence $A \subseteq A \cap B$. Both inclusions hold, so $A \cap B = A$. Both implications are proved, so $A \cap B = A$ if and only if $A \subseteq B$. $\square$'
        constraints: 'prove set equalities and biconditionals by two directions: witness expressions from two divisibility conditions, the element that makes one inclusion fail, a count that uses A union B = B iff A subset B; one written double-inclusion proof'
      - id: kp3
        name: "Reasoning about power sets"
        key_prerequisites: [power-set-enumeration]
        step_check:
          step: 'transitivity of $\subseteq$ gives $S \subseteq A$ and $S \subseteq B$'
          question: 'Why does $S \subseteq A \cap B$ give $S \subseteq A$?'
          options:
            - '$S$ is a subset of $A \cap B$, so $S$ has fewer elements than $A$'
            - 'The set $\mathcal{P}(A)$ contains $A \cap B$ as one of its elements'
            - '$S \in \mathcal{P}(A \cap B)$ already says $S \in \mathcal{P}(A)$ by definition'
            - 'Each element of $S$ is in $A \cap B$, which is contained in $A$'
          answer: 'Each element of $S$ is in $A \cap B$, which is contained in $A$'
          why: 'Subset is transitive: an element of $S$ lies in $A \cap B$, and every element of $A \cap B$ lies in $A$; the power set $\mathcal{P}(A \cap B)$ is not equal to $\mathcal{P}(A)$ by definition.'
        try_first:
          problem: 'How many elements does the power set $\mathcal{P}(\{1, 2\})$ have?'
          answer_contract: {"kind": "exact"}
          answer: '4'
          reveal: 'The elements of $\mathcal{P}(\{1, 2\})$ are the subsets $\varnothing$, $\{1\}$, $\{2\}$ and $\{1, 2\}$. A set is an element of $\mathcal{P}(A)$ exactly when it is a subset of $A$.'
        exemplars:
          - problem: 'For every set $A$, is $A \in \mathcal{P}(A)$?'
            answer: 'yes'
            answer_contract: {"kind": "label", "options": [["yes", "it is", "true", "yes it is"], ["no", "it is not", "false", "no it is not"]]}
            solution_sketch: 'A set belongs to $\mathcal{P}(A)$ exactly when it is a subset of $A$. Every set is a subset of itself, because each of its elements lies in it. So $A \in \mathcal{P}(A)$ for every set $A$.'
          - problem: 'Suppose $A \subseteq B$, $|A| = 2$ and $|B| = 4$. How many elements of $\mathcal{P}(B)$ are not elements of $\mathcal{P}(A)$?'
            answer: '12'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Since $A \subseteq B$, every subset of $A$ is a subset of $B$, so $\mathcal{P}(A) \subseteq \mathcal{P}(B)$. The set $\mathcal{P}(B)$ has $2^4 = 16$ elements and $\mathcal{P}(A)$ has $2^2 = 4$. So $16 - 4 = 12$ elements of $\mathcal{P}(B)$ are not in $\mathcal{P}(A)$.'
          - problem: 'How many elements does $\mathcal{P}(\{1, 2\}) \cap \mathcal{P}(\{2, 3\})$ have?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A set is in both power sets when it is a subset of $\{1, 2\}$ and of $\{2, 3\}$. That means it is a subset of $\{2\}$, the common part. The subsets of $\{2\}$ are $\varnothing$ and $\{2\}$, so there are $2$ elements.'
          - problem: 'For $A = \{1\}$ and $B = \{2\}$, how many elements of $\mathcal{P}(A \cup B)$ are not in $\mathcal{P}(A) \cup \mathcal{P}(B)$?'
            answer: '1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The set $\mathcal{P}(A \cup B) = \mathcal{P}(\{1, 2\})$ has $4$ elements: $\varnothing$, $\{1\}$, $\{2\}$ and $\{1, 2\}$. The set $\mathcal{P}(A) \cup \mathcal{P}(B)$ holds $\varnothing$, $\{1\}$ and $\{2\}$. Only $\{1, 2\}$ is missing, so the answer is $1$.'
          - problem: 'Sam proves that $A \subseteq B$ implies $\mathcal{P}(A) \subseteq \mathcal{P}(B)$. Does his proof also prove that $\mathcal{P}(A) \subseteq \mathcal{P}(B)$ implies $A \subseteq B$?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "it is", "true", "yes it is"], ["no", "it is not", "false", "no it is not"]]}
            solution_sketch: 'A proof of "if $P$ then $Q$" does not prove "if $Q$ then $P$". The second implication needs its own argument, which starts from the fact that $A \in \mathcal{P}(A)$. So the first proof does not prove the second implication.'
          - problem: 'How many sets $S$ satisfy $\{1, 2\} \subseteq S$ and $S \in \mathcal{P}(\{1, 2, 3, 4\})$?'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The condition $S \in \mathcal{P}(\{1, 2, 3, 4\})$ means $S \subseteq \{1, 2, 3, 4\}$. With $1$ and $2$ forced into $S$, each of $3$ and $4$ is in or out, giving $2 \times 2 = 4$ sets.'
          - problem: 'A club has $5$ members. Three of them are in the planning team. A committee is any group of club members, including the empty group. How many committees can be formed using only members of the planning team?'
            answer: '8'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A committee that uses only planning team members is a subset of the set of $3$ team members. These subsets are the elements of the power set of the team, so there are $2^3 = 8$ of them.'
          - problem: 'A club has $5$ members. Three of them are in the planning team. A committee is any group of club members, including the empty group. How many committees contain at least one member who is not in the planning team?'
            answer: '24'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The club has $2^5 = 32$ committees in all. The committees made only of planning team members are the $2^3 = 8$ subsets of the team, and these are among the $32$. So $32 - 8 = 24$ committees contain someone outside the team.'
          - problem: 'Write the full proof that for all sets $A$ and $B$, $A \subseteq B$ if and only if $\mathcal{P}(A) \subseteq \mathcal{P}(B)$, where $\mathcal{P}(X)$ is the set of all subsets of $X$.'
            answer: 'A subset B iff P(A) subset P(B)'
            answer_contract: {"kind": "none"}
            solution_sketch: 'We prove both directions. ($\Rightarrow$) Suppose $A \subseteq B$. Let $S$ be an arbitrary element of $\mathcal{P}(A)$, so $S \subseteq A$. Let $x \in S$. Then $x \in A$, and since $A \subseteq B$, we get $x \in B$. Hence every element of $S$ lies in $B$, so $S \subseteq B$ and $S \in \mathcal{P}(B)$. Since $S$ was an arbitrary element of $\mathcal{P}(A)$, we conclude $\mathcal{P}(A) \subseteq \mathcal{P}(B)$. ($\Leftarrow$) Suppose $\mathcal{P}(A) \subseteq \mathcal{P}(B)$. Every set is a subset of itself, so $A \subseteq A$, which means $A \in \mathcal{P}(A)$. Because $\mathcal{P}(A) \subseteq \mathcal{P}(B)$, it follows that $A \in \mathcal{P}(B)$. By the definition of the power set, $A \in \mathcal{P}(B)$ means $A \subseteq B$. Both implications are proved, so $A \subseteq B$ if and only if $\mathcal{P}(A) \subseteq \mathcal{P}(B)$. $\square$'
        constraints: 'prove power-set statements by unwinding S in P(A) iff S subset A: count elements of power sets, decide membership, test a claimed implication; one written proof about power sets'
    diagnostic_exemplar:
      problem: 'Prove: for all sets $A$ and $B$, $\mathcal{P}(A) \cap \mathcal{P}(B) = \mathcal{P}(A \cap B)$.'
      answer: 'Take any set $X$. Then $X \in \mathcal{P}(A) \cap \mathcal{P}(B)$ iff $X \in \mathcal{P}(A)$ and $X \in \mathcal{P}(B)$, i.e. iff $X \subseteq A$ and $X \subseteq B$. Now $X \subseteq A$ and $X \subseteq B$ hold iff every $x \in X$ lies in both $A$ and $B$, i.e. iff $X \subseteq A \cap B$, i.e. iff $X \in \mathcal{P}(A \cap B)$. Each step is an equivalence, so the two power sets have exactly the same elements and are equal (this is double inclusion run in both directions at once).'
      solution_sketch: 'Unwind membership in a power set as a subset relation, then use that being a subset of both sets is the same as being a subset of their intersection.'
    anki_seeds:
      - front: 'To prove $A \subseteq B$, you...'
        back: 'take an arbitrary $x \in A$ and show that $x \in B$.'
        type: basic
      - front: 'To prove two sets are equal, $A = B$...'
        back: 'prove $A \subseteq B$ and $B \subseteq A$ (double inclusion).'
        type: basic
      - front: 'Cardinality of the power set of an $n$-element set?'
        back: '$|\mathcal{P}(A)| = 2^{n}$.'
        type: basic

  - id: disjoint-sets-partitions
    name: "Disjoint Sets and Partitions"
    core: true
    difficulty: 0.55
    drill: false
    answer_kind: numeric
    expected_time_secs: 140
    prerequisites:
      - id: subset-relation-basics
        weight: 0.5
        key: true
      - id: union-intersection-difference
        weight: 0.4
        key: true
      - id: complement-universal-set
        weight: 0.2
    knowledge_points:
      - id: kp1
        name: 'Disjoint and pairwise disjoint sets'
        key_prerequisites: [union-intersection-difference]
        step_check:
          step: 'Since the pair $\{1, 3\}$ and $\{3, 8\}$ shares the element $3$, the family is not pairwise disjoint'
          question: 'Why does one pair that shares an element settle that the whole family is not pairwise disjoint?'
          options:
            - 'It does not settle it: a family is pairwise disjoint when most of its pairs are disjoint'
            - 'Every two different sets must have nothing in common, so one shared element breaks it'
            - 'The family fails only when all three sets contain the element $3$, not when just two of them do'
            - 'A shared element matters only when it is also counted again in the union of all the sets'
          answer: 'Every two different sets must have nothing in common, so one shared element breaks it'
          why: 'Pairwise disjoint is a condition on every pair of different sets, so a single pair with a common element, here $3$, is a counterexample.'
        exemplars:
          - problem: 'Are the sets $A = \{1, 2, 3, 4\}$ and $B = \{4, 5, 6\}$ disjoint?'
            answer: 'no'
            answer_contract: {"kind":"label","options":[["yes","they are disjoint","disjoint","yes, they are disjoint"],["no","they are not disjoint","not disjoint","overlapping","they overlap","no, they are not disjoint"]]}
            solution_sketch: 'Two sets are disjoint when they have no element in common. Here the element $4$ lies in both sets, so $A \cap B = \{4\}$ is not empty and the sets are not disjoint.'
          - problem: 'Let $A = \{1, 2, 3, 4, 5, 6\}$ and $B = \{2, 4, 6, 8\}$. Which elements of $A$ must be removed so that what is left of $A$ is disjoint from $B$?'
            answer: '2, 4, 6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The sets are disjoint when no element of the rest of $A$ lies in $B$. The elements of $A$ that also lie in $B$ are $2$, $4$ and $6$, so these three must be removed and $\{1, 3, 5\}$ is left.'
          - problem: 'Three study groups book the school laboratory for these hours: group X books $\{9, 10, 11\}$, group Y books $\{11, 12\}$ and group Z books $\{13, 14\}$. At which hour do two groups want the laboratory at the same time?'
            answer: '11'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Two groups clash when their sets of hours share an element. Groups X and Y both have the hour $11$, while group Z shares no hour with either of them, so the clash is at $11$.'
          - problem: 'Sam checks the family $A = \{1, 2\}$, $B = \{3, 4\}$, $C = \{2, 5\}$ like this: "$A$ and $B$ have nothing in common, and $B$ and $C$ have nothing in common, so the family is pairwise disjoint." Which element shows that Sam is wrong?'
            answer: '2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Pairwise disjoint means that every two different sets of the family are disjoint, and Sam did not check the pair $A$ and $C$. That pair shares the element $2$, so the family is not pairwise disjoint.'
          - problem: 'A chess club has the members with student numbers $\{4, 9, 16, 22\}$ and a drama club has the members $\{3, 8, 15, 20\}$. Can both clubs meet at the same time without any student having to be in two places?'
            answer: 'yes'
            answer_contract: {"kind":"label","options":[["yes","they can","both can meet","yes, they can"],["no","they cannot","no, they cannot"]]}
            solution_sketch: 'Both clubs can meet together exactly when no student belongs to both, that is when the two sets are disjoint. Comparing the numbers shows that no number appears in both lists, so the intersection is empty and the answer is yes.'
          - problem: 'Let $A = \{2, 4, 6, 8, 10, 12\}$, $B = \{3, 6, 9, 12\}$ and $C = \{5, 10\}$. Which numbers belong to more than one of the three sets?'
            answer: '6, 10, 12'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'A number belongs to two sets when it lies in the intersection of those two sets. Here $A \cap B = \{6, 12\}$, $A \cap C = \{10\}$ and $B \cap C$ is empty, so the numbers in more than one set are $6$, $10$ and $12$.'
          - problem: 'The interval $A = [0, 4)$ of real numbers is given. What is the least integer $c$ for which the interval $B = [c, 9)$ is disjoint from $A$?'
            answer: '4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The point $4$ is not in $A$ because $A$ stops just before $4$, so $[4, 9)$ and $[0, 4)$ share no number. For $c = 3$ the number $3$ lies in both intervals, so the least integer is $c = 4$.'
          - problem: 'Give a positive integer that lies in both $A = \{6k : k \text{ an integer}\}$ and $B = \{4k : k \text{ an integer}\}$.'
            answer: '12'
            answer_contract: {"kind":"property","check":"multiple_of","args":{"k":12,"min":1}}
            solution_sketch: 'A number lies in both sets when it is a multiple of $6$ and a multiple of $4$, that is a multiple of $12$. So $12$ works, because $12 = 6 \cdot 2 = 4 \cdot 3$, and so do $24$ and $36$.'
        constraints: 'check emptiness of intersections of listed sets, intervals and described sets, including a pairwise check over 3 sets; contexts with schedules and clubs'
      - id: kp2
        name: 'Recognizing partitions'
        key_prerequisites: [subset-relation-basics]
        step_check:
          step: 'Every element is covered'
          question: 'Why must the union of the blocks be the whole set $S$?'
          options:
            - 'Without it, two blocks could overlap, and then some element would be counted twice'
            - 'It makes the blocks equal in size, so every block holds the same number of elements'
            - 'Without it, an empty block could sneak in, and an empty block is never allowed'
            - 'Without it, some element of $S$ could be in no block, and $S$ would not be split'
          answer: 'Without it, some element of $S$ could be in no block, and $S$ would not be split'
          why: 'The covering condition says that each element of the set belongs to at least one block; the disjointness condition then makes it exactly one.'
        try_first:
          problem: 'Is $\{\{1, 2\}, \{3\}\}$ a partition of $\{1, 2, 3, 4\}$?'
          answer_contract: {"kind":"label","options":[["yes","it is a partition","a partition","they form a partition","yes, it is a partition"],["no","it is not a partition","not a partition","they do not form a partition","no, it is not a partition"]]}
          answer: 'no'
          reveal: 'No: the element $4$ lies in no block. A partition must use up every element of the set exactly once, so it needs nonempty blocks, no overlap, and no element left out.'
        exemplars:
          - problem: 'Is $\{\{1, 2\}, \{3, 4\}, \{5\}\}$ a partition of $\{1, 2, 3, 4, 5\}$?'
            answer: 'yes'
            answer_contract: {"kind":"label","options":[["yes","it is a partition","a partition","they form a partition","yes, it is a partition"],["no","it is not a partition","not a partition","they do not form a partition","no, it is not a partition"]]}
            solution_sketch: 'A partition needs nonempty blocks that are pairwise disjoint and whose union is the whole set. The three blocks are nonempty, no element lies in two of them, and $\{1, 2\} \cup \{3, 4\} \cup \{5\} = \{1, 2, 3, 4, 5\}$, so it is a partition.'
          - problem: 'The blocks $\{1, 2\}$, $\{3, 6\}$ and $\{4\}$ are blocks of a partition of $S = \{1, 2, 3, 4, 5, 6\}$ that is not yet complete. Which element of $S$ is not covered by these blocks?'
            answer: '5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The union of the blocks must be all of $S$. The blocks together contain $1, 2, 3, 4, 6$, so the element $5$ lies in no block and is not covered.'
          - problem: 'Sam says that $\{\{1, 2, 3\}, \{3, 4\}, \{5, 6\}\}$ is a partition of $\{1, 2, 3, 4, 5, 6\}$, because every element lies in some block. Which element shows that Sam is wrong?'
            answer: '3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Sam checked only that the blocks cover the set, and a partition also needs the blocks to be pairwise disjoint. The element $3$ lies in both $\{1, 2, 3\}$ and $\{3, 4\}$, so the blocks overlap.'
          - problem: 'A teacher splits a class of $28$ pupils into project teams of $4$ pupils each, so that every pupil is in exactly one team. How many teams are there?'
            answer: '7'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The teams are the blocks of a partition of the class, so the numbers of pupils in the teams add up to $28$. Each team has $4$ pupils, so the number of teams is $28 \div 4 = 7$.'
          - problem: 'The blocks $\{1, 4\}$ and $\{2, 5\}$ and one more block form a partition of $\{1, 2, 3, 4, 5, 6\}$. What is the third block?'
            answer: '3, 6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The blocks $\{1, 4\}$ and $\{2, 5\}$ use up $1, 2, 4, 5$. Every other element must lie in the third block, and it cannot repeat an element, so the third block is $\{3, 6\}$.'
          - problem: 'How many different partitions does the set $\{1, 2, 3\}$ have?'
            answer: '5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'A partition of $\{1, 2, 3\}$ has one, two or three blocks. The partitions are $\{\{1,2,3\}\}$, $\{\{1\},\{2,3\}\}$, $\{\{2\},\{1,3\}\}$, $\{\{3\},\{1,2\}\}$ and $\{\{1\},\{2\},\{3\}\}$, which makes $5$ partitions.'
          - problem: 'A school with $12$ pupils splits them into three teams, so that every pupil is in exactly one team. The first team has $3$ pupils and the second team has $4$ pupils. How many pupils are in the third team?'
            answer: '5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The three teams form a partition of the $12$ pupils, so their sizes add up to $12$. The third team has $12 - 3 - 4 = 5$ pupils.'
          - problem: 'Is $\{\{1, 2\}, \{3, 4\}, \varnothing\}$ a partition of $\{1, 2, 3, 4\}$?'
            answer: 'no'
            answer_contract: {"kind":"label","options":[["yes","it is a partition","a partition","they form a partition","yes, it is a partition"],["no","it is not a partition","not a partition","they do not form a partition","no, it is not a partition"]]}
            solution_sketch: 'Every block of a partition must be nonempty. The third block is the empty set, so this family is not a partition, even though the blocks are disjoint and their union is $\{1, 2, 3, 4\}$.'
        constraints: 'test the three partition conditions (nonempty blocks, pairwise disjoint, union is everything); find a missing element or block; count partitions of small sets; contexts with teams and groups'
      - id: kp3
        name: 'Partitions of infinite sets'
        key_prerequisites: [complement-universal-set]
        step_check:
          step: 'Since $r,s\in\{0,1,2,3\}$, the only way their difference is a multiple of $4$ is $r=s$'
          question: 'Why can $r - s$ be a multiple of $4$ only when $r = s$?'
          options:
            - 'Because $r$ and $s$ are both multiples of $4$, so their difference is a multiple of $4$'
            - 'Because $r - s$ is always larger than $4$ whenever $r$ and $s$ are different numbers'
            - 'The difference $r - s$ lies from $-3$ to $3$, and only $0$ is a multiple of $4$ there'
            - 'Because $4$ divides $k$ and $\ell$, so it also divides the remainders $r$ and $s$'
          answer: 'The difference $r - s$ lies from $-3$ to $3$, and only $0$ is a multiple of $4$ there'
          why: 'Both remainders lie from $0$ to $3$, so $-3 \le r - s \le 3$, and $0$ is the only multiple of $4$ in that range; hence $r = s$.'
        exemplars:
          - problem: 'Let $A_0 = \{3k : k \in \mathbb{Z}\}$, $A_1 = \{3k + 1 : k \in \mathbb{Z}\}$ and $A_2 = \{3k + 2 : k \in \mathbb{Z}\}$. Do $A_0$, $A_1$ and $A_2$ form a partition of $\mathbb{Z}$?'
            answer: 'yes'
            answer_contract: {"kind":"label","options":[["yes","it is a partition","a partition","they form a partition","yes, it is a partition"],["no","it is not a partition","not a partition","they do not form a partition","no, it is not a partition"]]}
            solution_sketch: 'Every integer leaves exactly one remainder $0$, $1$ or $2$ when divided by $3$. So each integer lies in exactly one of the three sets, which gives disjointness and covering, and each set is nonempty.'
          - problem: 'Let $A_r = \{3k + r : k \in \mathbb{Z}\}$ for $r = 0, 1, 2$. Which value of $r$ gives the set that contains $-7$?'
            answer: '2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Write $-7 = 3 \cdot (-3) + 2$, so the remainder of $-7$ on division by $3$ is $2$. The integer $-7$ therefore lies in $A_2$ and in no other of the three sets.'
          - problem: 'The sets $B_0 = \{4k : k \in \mathbb{Z}\}$, $B_1 = \{4k + 1 : k \in \mathbb{Z}\}$ and $B_2 = \{4k + 2 : k \in \mathbb{Z}\}$ do not cover $\mathbb{Z}$. Which integer from $20$ to $25$ lies in none of them?'
            answer: '23'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'An integer lies in none of the sets when its remainder on division by $4$ is $3$. In the range $20$ to $25$ the integers $20, 21, 22, 24, 25$ have remainders $0, 1, 2, 0, 1$, and only $23 = 4 \cdot 5 + 3$ has remainder $3$.'
          - problem: 'A school numbers its pupils $1, 2, 3, \dots$ and puts pupil $n$ in the house given by the remainder of $n$ divided by $4$, so there are four houses. Which house number (the remainder) does pupil $50$ get?'
            answer: '2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Divide $50$ by $4$: $50 = 4 \cdot 12 + 2$. The remainder is $2$, so pupil $50$ is in the house with number $2$.'
          - problem: 'Let $C_1 = \{n \in \mathbb{Z} : n \text{ is even}\}$ and $C_2 = \{n \in \mathbb{Z} : n \text{ is a multiple of } 3\}$. Which integer from $1$ to $10$ lies in both sets?'
            answer: '6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The sets $C_1$ and $C_2$ overlap, so they cannot be two blocks of one partition. The even numbers from $1$ to $10$ are $2, 4, 6, 8, 10$ and the multiples of $3$ are $3, 6, 9$, so only $6$ lies in both.'
          - problem: 'A factory sorts its shifts $1, 2, \dots, 30$ into five rota groups by the remainder of the shift number divided by $5$. Which shifts belong to the group with remainder $3$?'
            answer: '3, 8, 13, 18, 23, 28'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'A shift belongs to the group with remainder $3$ when its number has the form $5k + 3$. For $k = 0, 1, \dots, 5$ this gives $3, 8, 13, 18, 23, 28$, and the next one, $33$, is beyond shift $30$.'
          - problem: 'Let $D_1 = \{n \in \mathbb{Z} : n \text{ is even}\}$ and $D_2 = \{n \in \mathbb{Z} : n > 0\}$. Do $D_1$ and $D_2$ form a partition of $\mathbb{Z}$?'
            answer: 'no'
            answer_contract: {"kind":"label","options":[["yes","it is a partition","a partition","they form a partition","yes, it is a partition"],["no","it is not a partition","not a partition","they do not form a partition","no, it is not a partition"]]}
            solution_sketch: 'The sets $D_1$ and $D_2$ are not disjoint, because $2$ is even and positive. They also do not cover $\mathbb{Z}$, because $-3$ is odd and not positive, so the answer is no.'
          - problem: 'The integers are partitioned by their remainder on division by $6$. Which remainder do $-1$ and $11$ share?'
            answer: '5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Write $-1 = 6 \cdot (-1) + 5$ and $11 = 6 \cdot 1 + 5$. Both integers leave the remainder $5$, so they lie in the same block $\{6k + 5\}$.'
        constraints: 'described sets partitioning $\mathbb{Z}$ by parity or remainder; find the class of a given integer; spot a missing or shared integer; contexts with houses, rotas and shifts'
    diagnostic_exemplar:
      problem: 'Which of these are partitions: (i) $\{\{1,2\},\{3,4\}\}$ of $\{1,2,3,4\}$; (ii) the even integers together with the odd integers, of $\mathbb{Z}$; (iii) $\{\{1,2,3\},\{3,4\}\}$ of $\{1,2,3,4\}$?'
      answer_contract: {kind: none}
      answer: '(i) Yes: both blocks are nonempty, they are disjoint, and their union is $\{1,2,3,4\}$. (ii) Yes: both blocks are nonempty, no integer is both even and odd (disjoint), and every integer is one or the other, so they cover $\mathbb{Z}$. (iii) No: the blocks share the element $3$, so they are not pairwise disjoint.'
      solution_sketch: 'Check all three conditions for each family — nonempty blocks, pairwise disjoint, union equal to the whole set.'
    anki_seeds:
      - front: 'A partition of a set $A$ is...'
        back: 'a collection of nonempty, pairwise disjoint subsets of $A$ whose union is $A$.'
        type: basic
      - front: '"Disjoint" for two sets means...'
        back: '$A \cap B = \varnothing$.'
        type: basic

  - id: cartesian-products
    name: "Cartesian Products"
    core: true
    difficulty: 0.50
    drill: false
    answer_kind: numeric
    expected_time_secs: 140
    prerequisites:
      - id: set-notation
        weight: 0.5
        key: true
      - id: set-operations
        weight: 0.3
      - id: quantifiers
        weight: 0.0
    knowledge_points:
      - id: kp1
        name: 'Ordered pairs and products'
        key_prerequisites: [set-notation]
        step_check:
          step: 'hold the first coordinate fixed at one element of $A$'
          question: 'Why does the listing keep the first coordinate fixed while it runs through all of $B$?'
          options:
            - 'This way every element of $B$ is paired with that first coordinate, and no pair is skipped'
            - 'This way the pairs come out in alphabetical order, which the definition of $A \times B$ requires'
            - 'This way each element of $B$ is used only once, because a product cannot repeat an element'
            - 'This way both $(a, b)$ and $(b, a)$ are produced for every choice of $a$ and $b$'
          answer: 'This way every element of $B$ is paired with that first coordinate, and no pair is skipped'
          why: 'Holding $a$ fixed and running $b$ through all of $B$ produces every pair with first entry $a$ exactly once, and repeating this for each $a \in A$ produces all of $A \times B$.'
        exemplars:
          - problem: 'Let $A = \{1, 2\}$ and $B = \{x, y\}$. List the elements of $A \times B$.'
            answer: '(1,x),(1,y),(2,x),(2,y)'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The set $A \times B$ contains every ordered pair $(a, b)$ with $a \in A$ and $b \in B$. Pairing $1$ with $x$ and $y$, and then $2$ with $x$ and $y$, gives $(1, x), (1, y), (2, x), (2, y)$.'
          - problem: 'Let $A = \{2, 3, 5\}$ and $B = \{4, 6\}$. Which ordered pair $(a, b)$ in $A \times B$ has $a + b = 11$?'
            answer: '(5, 6)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'Run through the six pairs of $A \times B$ and add the entries. The sums are $6, 8, 7, 9, 9, 11$ in the order $(2,4), (2,6), (3,4), (3,6), (5,4), (5,6)$, so only $(5, 6)$ has sum $11$.'
          - problem: 'The Cartesian product of two sets is $A \times B = \{(2, 3), (2, 7), (5, 3), (5, 7), (8, 3), (8, 7)\}$. List the elements of $B$.'
            answer: '3, 7'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The second coordinates of the pairs of $A \times B$ are exactly the elements of $B$. The second coordinates that occur are $3$ and $7$, so $B = \{3, 7\}$.'
          - problem: 'Seats in a small hall are named by a pair (row, seat number). The rows are $1, 2, 3$ and every row has the seat numbers $1, 2$. List every seat in the second row.'
            answer: '(2,1),(2,2)'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The seats of the hall are the pairs of $\{1, 2, 3\} \times \{1, 2\}$, with the row first. The pairs with first entry $2$ are $(2, 1)$ and $(2, 2)$.'
          - problem: 'Let $A = \{1, 2\}$ and $B = \{3, 4\}$. Is $(3, 1)$ an element of $A \times B$?'
            answer: 'no'
            answer_contract: {"kind":"label","options":[["yes","it is an element","it is in the set","it belongs","an element","in the set"],["no","it is not an element","it is not in the set","it does not belong","not an element","not in the set"]]}
            solution_sketch: 'An element of $A \times B$ must have its first entry in $A$ and its second entry in $B$. The pair $(3, 1)$ has first entry $3$, which is not in $A$, so it lies in $B \times A$ and not in $A \times B$.'
          - problem: 'Let $A = \{4, 9, 11\}$ and $B = \{3, 7\}$. Which ordered pair $(a, b)$ in $A \times B$ has $a \cdot b = 63$?'
            answer: '(9, 7)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'Test the products of the six pairs: $4 \cdot 3 = 12$, $4 \cdot 7 = 28$, $9 \cdot 3 = 27$, $9 \cdot 7 = 63$, $11 \cdot 3 = 33$, $11 \cdot 7 = 77$. Only $(9, 7)$ gives $63$, and $(7, 9)$ is not in $A \times B$.'
          - problem: 'The squares of a game board are named by a pair (column, row). The columns are $a, b, c$ and the rows are $1, 2$. List all the squares of the board.'
            answer: '(a,1),(a,2),(b,1),(b,2),(c,1),(c,2)'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The squares are the pairs of $\{a, b, c\} \times \{1, 2\}$ with the column first. Fixing the column $a$ gives $(a, 1), (a, 2)$, and the columns $b$ and $c$ give the other four squares, so there are $6$ squares.'
          - problem: 'The Cartesian product $A \times B$ is $\{(1, a), (1, b), (2, a), (2, b), (3, a), (3, b)\}$. List the elements of $A$.'
            answer: '1, 2, 3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The first coordinates of the pairs of $A \times B$ are exactly the elements of $A$. The first coordinates that occur are $1$, $2$ and $3$, so $A = \{1, 2, 3\}$.'
          - problem: 'Let $A = \{1, 2, 3\}$ and $B = \{2, 4\}$. Is $(2, 2)$ an element of $A \times B$?'
            answer: 'yes'
            answer_contract: {"kind":"label","options":[["yes","it is an element","it is in the set","it belongs","an element","in the set"],["no","it is not an element","it is not in the set","it does not belong","not an element","not in the set"]]}
            solution_sketch: 'An element of $A \times B$ needs its first entry in $A$ and its second entry in $B$, and the two entries are allowed to be equal. Here $2 \in A$ and $2 \in B$, so $(2, 2)$ is an element of $A \times B$.'
        constraints: 'enumerate a product of small sets; order of coordinates matters; recover a factor from a listed product; contexts with seats and board squares'
      - id: kp2
        name: 'Counting a product'
        key_prerequisites: [set-notation]
        step_check:
          step: 'Apply the rule to $A \times B$: $|A \times B| = |A|\,|B| = 6 \cdot 2 = 12$'
          question: 'Why do we multiply $6$ by $2$ here and not add them?'
          options:
            - 'Adding gives $8$, and $8$ is too small for a set of pairs that has two coordinates'
            - 'Multiplication is used for every counting problem about two sets, whatever the question is'
            - 'Each of the $6$ elements of $A$ pairs with both elements of $B$, giving $6$ groups of $2$'
            - 'The pairs $(a, b)$ and $(b, a)$ both count, so the sizes are doubled and then added'
          answer: 'Each of the $6$ elements of $A$ pairs with both elements of $B$, giving $6$ groups of $2$'
          why: 'A pair uses one element from each set, so each element of $A$ starts $|B|$ pairs, and $|A|$ elements start $|A| \cdot |B|$ pairs in all.'
        try_first:
          problem: 'A shop sells $4$ kinds of hat and $5$ kinds of scarf. How many different outfits of one hat and one scarf are there?'
          answer_contract: {"kind":"exact"}
          answer: '20'
          reveal: 'There are $4 \cdot 5 = 20$ outfits: each of the $4$ hats goes with each of the $5$ scarves. Counting the ways to pick one item from each of two sets means multiplying the sizes, not adding them.'
        exemplars:
          - problem: 'Let $A$ be a set with $4$ elements and let $B$ be a set with $6$ elements. How many elements does $A \times B$ have?'
            answer: '24'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Each of the $4$ elements of $A$ is paired with each of the $6$ elements of $B$. So $|A \times B| = |A| \cdot |B| = 4 \cdot 6 = 24$.'
          - problem: 'A cafe offers $5$ soups and $3$ main courses. How many different meals of one soup and one main course can a customer order?'
            answer: '15'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'A meal is an ordered pair (soup, main course), so the meals are the elements of a Cartesian product. The number of meals is $5 \cdot 3 = 15$.'
          - problem: 'A cafe offers $3$ main courses, and a customer can order $18$ different meals made of one soup and one main course. How many soups does the cafe offer?'
            answer: '6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The $18$ meals are the pairs of a Cartesian product, so $18 = (\text{number of soups}) \cdot 3$. Dividing by $3$ gives $18 \div 3 = 6$ soups.'
          - problem: 'Let $A$ be a set with $9$ elements. How many elements does $A \times A$ have?'
            answer: '81'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The set $A \times A$ contains every ordered pair of two elements of $A$, and the two entries may be equal. So $|A \times A| = 9 \cdot 9 = 81$.'
          - problem: 'Let $A$ be a set with $7$ elements and let $B$ be the empty set. How many elements does $A \times B$ have?'
            answer: '0'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'A pair in $A \times B$ needs a second entry from $B$, and $B$ has no element. So there are no pairs, and $|A \times B| = 7 \cdot 0 = 0$.'
          - problem: 'A locker code is one of the $26$ letters of the alphabet followed by one of the digits from $0$ to $9$. How many different codes are there?'
            answer: '260'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'A code is an ordered pair (letter, digit), so the codes form the product of a set with $26$ elements and a set with $10$ elements. The number of codes is $26 \cdot 10 = 260$.'
          - problem: 'Let $A$ and $B$ be disjoint sets with $|A| = 5$ and $|B| = 7$. How many elements does $(A \times B) \cup (B \times A)$ have?'
            answer: '70'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Since $A$ and $B$ are disjoint, no pair of $A \times B$ equals a pair of $B \times A$, because the first entries lie in different sets. So the union has $5 \cdot 7 + 7 \cdot 5 = 70$ elements.'
          - problem: 'Sam counts the pairs of $A \times B$ for $|A| = 5$ and $|B| = 4$ by adding the sizes, and gets $9$. What is the correct number of pairs?'
            answer: '20'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Adding the sizes counts the elements of $A$ and $B$ once each, but a pair uses one element from each set. Every element of $A$ is paired with every element of $B$, so there are $5 \cdot 4 = 20$ pairs.'
          - problem: 'Let $A$, $B$ and $C$ be sets with $|A| = 2$, $|B| = 5$ and $|C| = 3$. How many ordered triples $(a, b, c)$ with $a \in A$, $b \in B$ and $c \in C$ are there?'
            answer: '30'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'There are $2$ choices for $a$, $5$ choices for $b$ and $3$ choices for $c$, and the choices are independent. So the number of triples is $2 \cdot 5 \cdot 3 = 30$.'
        constraints: 'use |A x B| = |A||B| forwards and backwards; the empty set; A x A; contexts with menus, codes and outfits, including ones that need division to find a missing size'
      - id: kp3
        name: 'Subsets of a product'
        key_prerequisites: [set-operations]
        step_check:
          step: 'keep only the pairs whose first entry is strictly greater than the second'
          question: 'Why is $(4,1)$ kept but $(1,4)$ dropped by the condition $a > b$?'
          options:
            - 'Order inside a pair does not matter, so $(1,4)$ equals $(4,1)$ and only one of them is kept'
            - 'The condition looks only at the larger entry of the pair, and $4$ is larger than $1$'
            - 'Pairs with a first entry of $1$ never belong to a subset of $A \times A$'
            - 'In $(4,1)$ the first entry is larger than the second, while in $(1,4)$ it is smaller'
          answer: 'In $(4,1)$ the first entry is larger than the second, while in $(1,4)$ it is smaller'
          why: 'The pairs $(4,1)$ and $(1,4)$ are different elements of $A \times A$, and the condition $a > b$ tests the first entry against the second in that order.'
        exemplars:
          - problem: 'Let $A = \{1, 2, 3, 4\}$. List the elements of $\{(a, b) \in A \times A : a > b\}$.'
            answer: '(2,1),(3,1),(3,2),(4,1),(4,2),(4,3)'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Test each ordered pair of $A \times A$ against the condition that the first entry is larger than the second. First entry $2$ gives $(2, 1)$, first entry $3$ gives $(3, 1), (3, 2)$, and first entry $4$ gives $(4, 1), (4, 2), (4, 3)$; first entry $1$ gives none.'
          - problem: 'Let $A = \{1, 2, 3, 4\}$. How many ordered pairs $(a, b) \in A \times A$ satisfy $a + b \le 5$?'
            answer: '10'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Count by the first entry. For $a = 1$ the second entry can be $1, 2, 3, 4$, for $a = 2$ it can be $1, 2, 3$, for $a = 3$ it can be $1, 2$, and for $a = 4$ it can only be $1$, so there are $4 + 3 + 2 + 1 = 10$ pairs.'
          - problem: 'Two dice, one red and one blue, are rolled. An outcome is the ordered pair (red, blue), so the outcomes are the elements of $\{1, \dots, 6\} \times \{1, \dots, 6\}$. How many outcomes have the sum $8$?'
            answer: '5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'List the pairs whose entries add up to $8$: $(2, 6), (3, 5), (4, 4), (5, 3), (6, 2)$. The first entry $1$ would need $7$, which is not a die face, so there are $5$ outcomes.'
          - problem: 'Let $A = \{1, 2, 3, 6\}$. How many ordered pairs $(a, b) \in A \times A$ satisfy "$a$ divides $b$"?'
            answer: '9'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Count the pairs by the first entry. The entry $1$ divides all four elements, $2$ divides $2$ and $6$, $3$ divides $3$ and $6$, and $6$ divides only $6$, so there are $4 + 2 + 2 + 1 = 9$ pairs.'
          - problem: 'Let $A = \{2, 3, 5\}$ and $B = \{1, 4\}$. List the elements of $\{(x, y) \in A \times B : x > y\}$.'
            answer: '(2,1),(3,1),(5,1),(5,4)'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Compare the first entry with the second entry for each of the six pairs of $A \times B$. The pairs $(2, 4)$ and $(3, 4)$ fail because $2 < 4$ and $3 < 4$, and the pairs $(2, 1), (3, 1), (5, 1), (5, 4)$ pass.'
          - problem: 'Sam lists the pairs $(a, b) \in \{1, 2, 3\} \times \{1, 2, 3\}$ with $a + b = 4$ as $(1, 3)$ and $(3, 1)$. Which pair did Sam leave out?'
            answer: '(2, 2)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'The pairs with sum $4$ are $(1, 3)$, $(2, 2)$ and $(3, 1)$. Sam forgot that the two entries may be equal, so he left out $(2, 2)$.'
          - problem: 'A robot walks on a board whose squares are the pairs (column, row) with column and row from $1$ to $4$. It may only stand on a square whose row is twice its column. List the squares where the robot may stand.'
            answer: '(1,2),(2,4)'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The condition is row $= 2 \cdot$ column. Column $1$ gives row $2$ and column $2$ gives row $4$, while column $3$ would need row $6$ and column $4$ would need row $8$, which are not on the board.'
          - problem: 'Let $A = \{1, 2, 3, 4, 5, 6, 7\}$. How many ordered pairs $(a, b) \in A \times A$ have $a \neq b$?'
            answer: '42'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The product $A \times A$ has $7 \cdot 7 = 49$ pairs, and exactly $7$ of them have equal entries. So $49 - 7 = 42$ pairs have $a \neq b$.'
        constraints: 'carve a subset of a product by a condition on coordinates (list it or count it); dice, boards and grids as contexts'
    diagnostic_exemplar:
      problem: 'With $A = \{1, 2, 3\}$, give $|A \times A|$ and list the pairs in $\{(a,b) \in A \times A : a + b \le 4\}$.'
      answer_contract: {kind: none}
      answer: '$|A \times A| = 3 \cdot 3 = 9$. The pairs with $a + b \le 4$ are $(1,1), (1,2), (1,3), (2,1), (2,2), (3,1)$ — six of the nine; order matters, so $(1,3)$ and $(3,1)$ count separately.'
      solution_sketch: 'Count the product as $|A| \cdot |A|$, then run through the ordered pairs and keep those whose coordinate sum is at most $4$.'
    anki_seeds:
      - front: 'The Cartesian product $A \times B$?'
        back: 'The set of ordered pairs $\{(a, b) : a \in A,\ b \in B\}$.'
        type: basic
      - front: '$|A \times B|$ in terms of $|A|$ and $|B|$?'
        back: '$|A \times B| = |A| \cdot |B|$.'
        type: basic

  - id: indexed-unions-intersections
    name: "Indexed Unions and Intersections"
    core: true
    difficulty: 0.55
    drill: false
    answer_kind: numeric
    expected_time_secs: 150
    prerequisites:
      - id: union-intersection-difference
        weight: 0.5
        key: true
      - id: quantifiers
        weight: 0.4
        key: true
      - id: interval-notation-real-sets
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: 'Finitely indexed families'
        key_prerequisites: [union-intersection-difference]
        step_check:
          step: 'build the intersection by keeping only elements present in all four sets'
          question: 'Why is $4$ dropped from the intersection although it lies in three of the four sets?'
          options:
            - 'The intersection must keep the elements that lie in exactly two of the sets'
            - 'An element of the intersection must lie in every set, and $4$ is missing from $C_1$'
            - 'An element is dropped when it also lies in the union, and $4$ lies in the union'
            - 'The intersection keeps the smallest element of each set, and $4$ is not the smallest one'
          answer: 'An element of the intersection must lie in every set, and $4$ is missing from $C_1$'
          why: 'The intersection asks for membership in all four sets, so a single set without the element, here $C_1 = \{1, 2, 3\}$, removes it.'
        exemplars:
          - problem: 'For $i = 1, 2, 3$ let $A_i = \{i, i+1, i+2\}$. Find $\bigcup_{i=1}^{3} A_i$.'
            answer: '1, 2, 3, 4, 5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Write out the sets: $A_1 = \{1, 2, 3\}$, $A_2 = \{2, 3, 4\}$ and $A_3 = \{3, 4, 5\}$. The union collects every element that lies in at least one of them, which gives $\{1, 2, 3, 4, 5\}$.'
          - problem: 'For $i = 1, 2, 3$ let $A_i = \{i, i+1, i+2\}$. Find $\bigcap_{i=1}^{3} A_i$.'
            answer: '3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The sets are $A_1 = \{1, 2, 3\}$, $A_2 = \{2, 3, 4\}$ and $A_3 = \{3, 4, 5\}$. The intersection keeps the elements that lie in every one of them, and only $3$ does, so the intersection is $\{3\}$.'
          - problem: 'Ana is free on the days $\{1, 3, 5, 6\}$ of a week, Ben on $\{2, 3, 5, 6\}$ and Cara on $\{3, 4, 5, 7\}$ (days numbered $1$ to $7$). On which days are all three of them free?'
            answer: '3, 5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'All three are free on a day exactly when the day lies in the intersection of the three sets. The days $3$ and $5$ appear in all three lists, while $1, 2, 4, 6, 7$ each miss at least one person.'
          - problem: 'For $i = 1, 2, 3$ let $A_i = \{2i, 2i+1, 8\}$. Find $\bigcap_{i=1}^{3} A_i$.'
            answer: '8'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The sets are $A_1 = \{2, 3, 8\}$, $A_2 = \{4, 5, 8\}$ and $A_3 = \{6, 7, 8\}$. The only element that lies in all three sets is $8$, so the intersection is $\{8\}$.'
          - problem: 'Three market stalls are open on the days $\{1, 2\}$, $\{2, 5\}$ and $\{6\}$ of a week. The market is open on a day when at least one stall is open. On which days is the market open?'
            answer: '1, 2, 5, 6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The market is open on a day exactly when the day lies in the union of the three sets. Collecting the days gives $1, 2$ from the first stall, $5$ as new from the second, and $6$ from the third, so the days are $1, 2, 5, 6$.'
          - problem: 'Sam finds the intersection of $A_1 = \{2, 4, 6\}$, $A_2 = \{4, 6, 8\}$ and $A_3 = \{6, 8, 10\}$ as $\{4, 6, 8\}$. What is the correct intersection?'
            answer: '6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Sam kept the elements that lie in two of the sets, but the intersection of a family needs the elements that lie in all of them. The element $4$ is missing from $A_3$ and $8$ is missing from $A_1$, so only $6$ is left.'
          - problem: 'Let $A_2 = \{2, 7\}$, $A_3 = \{3, 7\}$ and $A_4 = \{4, 7\}$. Find $\bigcup_{i=2}^{4} A_i$.'
            answer: '2, 3, 4, 7'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The union collects each element that lies in at least one set. The elements are $2$ from $A_2$, $3$ from $A_3$, $4$ from $A_4$ and $7$, which lies in all three sets but is listed once.'
          - problem: 'For $i = 1, 2, 3, 4$ let $A_i = \{i, 2i, 10\}$. How many elements does $\bigcup_{i=1}^{4} A_i$ have?'
            answer: '7'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The sets are $\{1, 2, 10\}$, $\{2, 4, 10\}$, $\{3, 6, 10\}$ and $\{4, 8, 10\}$. The union is $\{1, 2, 3, 4, 6, 8, 10\}$, because $2$, $4$ and $10$ occur more than once but count once, so it has $7$ elements.'
        constraints: '3-4 explicitly listable indexed sets; compute the union or the intersection (or count it); contexts with schedules and stalls'
      - id: kp2
        name: 'Interval families'
        key_prerequisites: [interval-notation-real-sets]
        step_check:
          step: 'if $x \le 0$ then $x < \tfrac{2}{n}$ for every $n$'
          question: 'Why does a number $x \le 0$ belong to none of the sets $A_n$?'
          options:
            - 'Each $A_n$ has the right endpoint $3$, and $x \le 0$ is too far from $3$'
            - 'The left endpoints $\tfrac{2}{n}$ come closer to $0$, so they reach $0$ for large $n$'
            - 'Every left endpoint $\tfrac{2}{n}$ is positive, so $x$ is left of every $A_n$'
            - 'Negative numbers cannot lie in an interval that has a fraction as an endpoint'
          answer: 'Every left endpoint $\tfrac{2}{n}$ is positive, so $x$ is left of every $A_n$'
          why: 'An interval $\left[\tfrac{2}{n}, 3\right)$ starts at a positive number, so $0$ and every number below $0$ lie to its left, and the endpoints never reach $0$.'
        try_first:
          problem: 'For $n \ge 1$ let $A_n = \left(0, \tfrac{1}{n}\right)$. Is there a positive number that lies in every $A_n$?'
          answer_contract: {"kind":"label","options":[["yes","there is","yes, there is"],["no","there is none","there is not","no, there is none","none","there is no such number","no such number"]]}
          answer: 'no'
          reveal: 'No: for a given $x > 0$ take $n$ with $\tfrac{1}{n} \le x$, and then $x \notin A_n$. The sets shrink toward $0$, so no positive number survives in all of them.'
        exemplars:
          - problem: 'For $n \ge 1$ let $A_n = \left[\tfrac{1}{n}, 2\right]$. Find $\bigcup_{n \ge 1} A_n$.'
            answer: '(0, 2]'
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'The left endpoints $\tfrac{1}{n}$ shrink toward $0$ but never reach it, and every $A_n$ ends at $2$. Each $x$ with $0 < x \le 2$ lies in $A_n$ once $n \ge \tfrac{1}{x}$, and $0$ lies in no $A_n$, so the union is $(0, 2]$.'
          - problem: 'For $n \ge 1$ let $B_n = \left[0, 1 + \tfrac{1}{n}\right)$. Find $\bigcap_{n \ge 1} B_n$.'
            answer: '[0, 1]'
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'A number $x$ is in every $B_n$ when $0 \le x < 1 + \tfrac{1}{n}$ for all $n$. Every $x \le 1$ passes, and every $x > 1$ fails once $\tfrac{1}{n} \le x - 1$, so the intersection is $[0, 1]$ and it contains the endpoint $1$.'
          - problem: 'For $n \ge 1$ let $C_n = \left[0, 3 - \tfrac{3}{n}\right]$. Find $\bigcup_{n \ge 1} C_n$.'
            answer: '[0, 3)'
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'The right endpoints $3 - \tfrac{3}{n}$ increase toward $3$ and never reach it. Every $x$ with $0 \le x < 3$ lies in some $C_n$, and $3$ lies in none, so the union is $[0, 3)$.'
          - problem: 'In test $n$ ($n = 1, 2, 3, \dots$) a thermostat holds the temperature from $20 - \tfrac{1}{n}$ to $25 + \tfrac{1}{n}$ degrees, endpoints included. Which temperatures are reached in every test?'
            answer: '[20, 25]'
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'A temperature $x$ is reached in every test when $20 - \tfrac{1}{n} \le x \le 25 + \tfrac{1}{n}$ for all $n$. Letting $\tfrac{1}{n}$ shrink forces $20 \le x \le 25$, and every such $x$ works, so the temperatures are $[20, 25]$.'
          - problem: 'In week $n$ a gardener waters the strip of garden from position $0$ to position $5 - \tfrac{1}{n}$ metres, endpoints included. Which positions are watered in at least one week?'
            answer: '[0, 5)'
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'A position $x$ is watered in some week when $0 \le x \le 5 - \tfrac{1}{n}$ for some $n$. Each $x < 5$ passes once $\tfrac{1}{n} \le 5 - x$, and $5$ itself never does, so the watered positions are $[0, 5)$.'
          - problem: 'For $n \ge 1$ let $F_n = \left[2 - \tfrac{1}{n}, 7 + \tfrac{1}{n}\right]$. How many integers belong to $\bigcap_{n \ge 1} F_n$?'
            answer: '6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'A number is in every $F_n$ when $2 - \tfrac{1}{n} \le x \le 7 + \tfrac{1}{n}$ for all $n$, which means $2 \le x \le 7$. The integers $2, 3, 4, 5, 6, 7$ lie in $[2, 7]$, so there are $6$ of them.'
          - problem: 'Sam says that $\bigcap_{n \ge 1} \left(0, 1 + \tfrac{1}{n}\right) = (0, 1)$. Which number does Sam wrongly leave out?'
            answer: '1'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The number $1$ satisfies $0 < 1 < 1 + \tfrac{1}{n}$ for every $n$, so it lies in every set of the family and hence in the intersection. Sam treated the right endpoints $1 + \tfrac{1}{n}$ as if the limit $1$ were excluded, but the correct intersection is $(0, 1]$.'
          - problem: 'For $n \ge 1$ let $D_n = \left[1, 6 + \tfrac{1}{n}\right]$. Find $\bigcap_{n \ge 1} D_n$.'
            answer: '[1, 6]'
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'Every $D_n$ starts at $1$, and the right endpoints $6 + \tfrac{1}{n}$ shrink toward $6$. A number $x > 6$ fails once $\tfrac{1}{n} < x - 6$, while $x = 6$ lies in every $D_n$, so the intersection is $[1, 6]$.'
        constraints: 'families of intervals shrinking or growing with n; decide which endpoints belong; contexts with thermostats and watering strips; the answer is an interval'
      - id: kp3
        name: 'Membership via quantifiers'
        key_prerequisites: [quantifiers]
        step_check:
          step: 'One failing index is enough to break the universal claim'
          question: 'Why does the single index $n = 1$ settle that $0.9$ is not in the intersection?'
          options:
            - 'The intersection is decided by the first set only, and $0.9$ is not in the first set'
            - 'Being in the intersection means being in every set, so one set without $0.9$ is enough'
            - 'The intersection is empty whenever the union is nonempty, so $0.9$ cannot lie in it'
            - 'Membership in the intersection means membership in some set, and $D_1$ is the wrong one'
          answer: 'Being in the intersection means being in every set, so one set without $0.9$ is enough'
          why: 'The intersection asks that $0.9 \in D_n$ for all $n$, so a single index with $0.9 \notin D_n$ already makes the statement false.'
        exemplars:
          - problem: 'For $n \ge 1$ let $A_n = \left(0, \tfrac{n}{n+2}\right)$. Is $0.8$ an element of $\bigcup_{n \ge 1} A_n$?'
            answer: 'yes'
            answer_contract: {"kind":"label","options":[["yes","it is an element","it is in the set","it belongs","an element","in the set"],["no","it is not an element","it is not in the set","it does not belong","not an element","not in the set"]]}
            solution_sketch: 'A number is in the union when it lies in at least one $A_n$, so we look for one index that works. The condition $0.8 < \tfrac{n}{n+2}$ holds when $n > 8$, and for $n = 9$ we get $\tfrac{9}{11} \approx 0.818 > 0.8$, so $0.8 \in A_9$ and the answer is yes.'
          - problem: 'For $n \ge 1$ let $A_n = \left(0, \tfrac{n}{n+2}\right)$. What is the least $n$ for which $0.8 \in A_n$?'
            answer: '9'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'We need $0.8 < \tfrac{n}{n+2}$, that is $0.8(n + 2) < n$, which simplifies to $1.6 < 0.2n$ and then to $n > 8$. The least integer with $n > 8$ is $9$, and indeed $\tfrac{8}{10} = 0.8$ is not larger than $0.8$.'
          - problem: 'For $n \ge 1$ let $A_n = \left(0, \tfrac{n}{n+2}\right)$. Is $0.8$ an element of $\bigcap_{n \ge 1} A_n$?'
            answer: 'no'
            answer_contract: {"kind":"label","options":[["yes","it is an element","it is in the set","it belongs","an element","in the set"],["no","it is not an element","it is not in the set","it does not belong","not an element","not in the set"]]}
            solution_sketch: 'A number is in the intersection only when it lies in every $A_n$, so one failing index is enough to show that it is not. For $n = 1$ we have $A_1 = \left(0, \tfrac{1}{3}\right)$ and $0.8 > \tfrac{1}{3}$, so the answer is no.'
          - problem: 'For $n \ge 1$ let $B_n = \left[0, 5 - \tfrac{1}{n}\right]$. What is the least positive integer that is not in $\bigcup_{n \ge 1} B_n$?'
            answer: '5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The set $B_1 = [0, 4]$ already contains $1, 2, 3, 4$. Every $B_n$ stops at $5 - \tfrac{1}{n}$, which is less than $5$, so $5$ lies in no $B_n$ and is the least positive integer outside the union.'
          - problem: 'A shop gives a discount in month $n$ ($n = 1, 2, \dots, 24$) to customers whose age $a$ satisfies $n \le a \le 2n$. In how many of the $24$ months does a customer of age $12$ get the discount?'
            answer: '7'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The discount applies in month $n$ when $n \le 12 \le 2n$, that is $6 \le n \le 12$. The months $6, 7, 8, 9, 10, 11, 12$ qualify, so there are $7$ months.'
          - problem: 'Three clubs meet on the days of a $30$-day month that are multiples of $2$, of $3$ and of $4$ respectively. On which days do all three clubs meet?'
            answer: '12, 24'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'A day is in the intersection of the three sets when it is a multiple of $2$, of $3$ and of $4$ at the same time. That means a multiple of $12$, and the multiples of $12$ up to $30$ are $12$ and $24$.'
          - problem: 'For $n = 1, 2, 3, 4, 5$ let $A_n = \{n, n+1\}$. Which integers from $0$ to $8$ lie outside $\bigcup_{n=1}^{5} A_n$?'
            answer: '0, 7, 8'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'An integer is outside the union when it lies in none of the sets. The union is $\{1, 2, 3, 4, 5, 6\}$, so the integers from $0$ to $8$ outside it are $0$, $7$ and $8$.'
          - problem: 'Sam says that $1.5 \in \bigcap_{n \ge 1} \left(0, 1 + \tfrac{1}{n}\right)$, because $1.5 \in (0, 2)$. For which $n$ does Sam''s claim first fail?'
            answer: '2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Sam checked only the first set, but the intersection needs every set. For $n = 2$ the set is $\left(0, 1.5\right)$, which does not contain $1.5$, so the claim first fails at $n = 2$.'
        constraints: 'decide membership in an indexed union (find a witness index) and in an indexed intersection (every index or one failing index); contexts with months and clubs'
    diagnostic_exemplar:
      problem: 'For $n \ge 1$ let $A_n = \left(0,\ 1 + \tfrac{1}{n}\right)$. Compute $\bigcup_{n \ge 1} A_n$ and $\bigcap_{n \ge 1} A_n$.'
      answer_contract: {kind: none}
      answer: 'The intervals shrink as $n$ grows ($A_1 \supseteq A_2 \supseteq \cdots$), so the union is the largest one: $\bigcup_{n \ge 1} A_n = A_1 = (0, 2)$. For the intersection, $x$ lies in every $A_n$ iff $x > 0$ and $x < 1 + \tfrac1n$ for every $n$; any $x > 1$ fails once $\tfrac1n < x - 1$, while every $x \le 1$ passes. Hence $\bigcap_{n \ge 1} A_n = (0, 1]$.'
      solution_sketch: 'For a nested decreasing family the union is the first set; for the intersection ask which $x$ survive every bound $1 + 1/n$.'
    anki_seeds:
      - front: 'For nested sets $A_1 \subseteq A_2 \subseteq \cdots$, what are $\bigcup A_n$ and $\bigcap A_n$ over a finite range?'
        back: 'The largest set and the smallest set in the range, respectively.'
        type: basic
      - front: '$\bigcap_{n \ge 1} \left(-\tfrac{1}{n}, \tfrac{1}{n}\right) = $ ?'
        back: '$\{0\}$.'
        type: basic

  - id: indexed-families
    name: "Indexed Families of Sets"
    core: true
    difficulty: 0.60
    drill: false
    answer_kind: proof
    expected_time_secs: 200
    prerequisites:
      - id: indexed-unions-intersections
        weight: 0.5
        key: true
      - id: quantifiers
        weight: 0.4
        key: true
      - id: subsets-power-sets
        weight: 0.3
      - id: set-operations
        weight: 0.2
    knowledge_points:
      - id: kp1
        name: 'Bounding an indexed family'
        key_prerequisites: [indexed-unions-intersections]
        step_check:
          step: 'fix any $i \in I$'
          question: 'Why does a proof for one arbitrary index $i \in I$ cover every index in $I$?'
          options:
            - 'The index $i$ is chosen as the smallest one, and the other indices behave in the same way'
            - 'The proof is then repeated by hand for each index until all of $I$ is done'
            - 'Since $i$ is arbitrary and the argument uses nothing special about $i$, it works for all'
            - 'The intersection over $I$ is the same set as the set $A_i$ for a single index $i$'
          answer: 'Since $i$ is arbitrary and the argument uses nothing special about $i$, it works for all'
          why: 'Because $i$ is any index of $I$ and the argument uses only $B \subseteq A_i$, the same argument works for each index, which gives the statement for every $i \in I$.'
        exemplars:
          - problem: 'For $i = 1, 2, 3$ let $A_i = \{i, i+1\}$. What is the least positive integer $m$ with $A_i \subseteq \{1, 2, \dots, m\}$ for every $i = 1, 2, 3$?'
            answer: '4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The sets are $A_1 = \{1, 2\}$, $A_2 = \{2, 3\}$ and $A_3 = \{3, 4\}$. The set $\{1, \dots, m\}$ must contain all of them, so it must contain the union $\{1, 2, 3, 4\}$, and the least such $m$ is $4$.'
          - problem: 'Let $\{A_i\}_{i \in I}$ be a family of sets and $B$ a set with $A_i \subseteq B$ for every $i \in I$. Must $\bigcup_{i \in I} A_i \subseteq B$?'
            answer: 'yes'
            answer_contract: {"kind":"label","options":[["yes","it is true","true","it holds","always","they do","it is","it is always true"],["no","it is false","false","not always","it does not hold","they do not","it is not","it is not always true"]]}
            solution_sketch: 'Take an element $x$ of the union. It lies in some $A_k$, and $A_k \subseteq B$ by hypothesis, so $x \in B$. Hence the union is contained in $B$, and the answer is yes.'
          - problem: 'Let $\{A_i\}_{i \in I}$ be a family of sets and $B$ a set with $B \subseteq A_j$ for one index $j \in I$. Must $B \subseteq \bigcap_{i \in I} A_i$?'
            answer: 'no'
            answer_contract: {"kind":"label","options":[["yes","it is true","true","it holds","always","they do","it is","it is always true"],["no","it is false","false","not always","it does not hold","they do not","it is not","it is not always true"]]}
            solution_sketch: 'The intersection needs $B \subseteq A_i$ for every index and not for one index only. For $A_1 = \{0\}$, $A_2 = \{1\}$ and $B = \{0\}$ we have $B \subseteq A_1$ but $B \not\subseteq A_1 \cap A_2 = \varnothing$, so the answer is no.'
          - problem: 'Let $A_1 = \{1, 2, 3\}$, $A_2 = \{2, 3, 4\}$, $A_3 = \{1, 3, 4\}$ and $B = \{2, 3\}$. For which index $i$ does $B \not\subseteq A_i$, so that $B \not\subseteq \bigcap_{i=1}^{3} A_i$?'
            answer: '3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'We have $B \subseteq A_1$ and $B \subseteq A_2$, because $2$ and $3$ lie in both sets. The element $2$ is not in $A_3 = \{1, 3, 4\}$, so $B \not\subseteq A_3$ and the index is $3$.'
          - problem: 'In a school the pupils of class $i$ ($i = 1, 2, 3, 4$) have the ages in $A_i = \{11, 12, \dots, 10 + i\}$. A sports club admits pupils of the ages $11, 12, \dots, m$. What is the least $m$ for which every pupil of every class is admitted?'
            answer: '14'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Every pupil is admitted exactly when every $A_i$ lies in $\{11, \dots, m\}$, that is when the union of the $A_i$ does. The largest class age is the one of class $4$, namely $10 + 4 = 14$, so $m = 14$.'
          - problem: 'For $i = 1, 2, \dots, 6$ let $A_i$ be the set of positive multiples of $i$, and let $B$ be the set of positive multiples of $6$. For which indices $i$ is $B \subseteq A_i$?'
            answer: '1, 2, 3, 6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'A multiple of $6$ is a multiple of $i$ exactly when $i$ divides $6$. The divisors of $6$ up to $6$ are $1, 2, 3, 6$, while $4$ fails because $6 \in B$ is not a multiple of $4$, and $5$ fails in the same way.'
          - problem: 'Three shops accept gift vouchers with the serial numbers $1$ to $40$, $1$ to $50$ and $10$ to $60$ respectively. How many serial numbers are accepted by every shop?'
            answer: '31'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'A serial number is accepted by every shop when it lies in the intersection of the three ranges. The intersection is $10$ to $40$, because it must be at least $10$ and at most $40$, and it has $40 - 10 + 1 = 31$ numbers.'
          - problem: 'Write the full proof that, for a family of sets $\{A_i\}_{i \in I}$ and a set $B$: (a) if $A_i \subseteq B$ for every $i \in I$, then $\bigcup_{i \in I} A_i \subseteq B$; and (b) if $A_j \subseteq B$ for at least one $j \in I$, then $\bigcap_{i \in I} A_i \subseteq B$.'
            answer: 'union and intersection lie in B'
            answer_contract: {"kind":"none"}
            solution_sketch: '(a) Suppose that $A_i \subseteq B$ for every $i \in I$. Let $x$ be an arbitrary element of $\bigcup_{i \in I} A_i$. By the definition of an indexed union, $x \in A_k$ for some index $k \in I$. By hypothesis $A_k \subseteq B$, so $x \in B$. Since $x$ was arbitrary, $\bigcup_{i \in I} A_i \subseteq B$. (b) Suppose that $A_j \subseteq B$ for some $j \in I$. Let $x$ be an arbitrary element of $\bigcap_{i \in I} A_i$. By the definition of an indexed intersection, $x \in A_i$ for every $i \in I$, so in particular $x \in A_j$. Since $A_j \subseteq B$, we get $x \in B$. Since $x$ was arbitrary, $\bigcap_{i \in I} A_i \subseteq B$. This proves (a) and (b). $\square$'
        constraints: 'short inclusion proofs straight from the quantifier meaning of union and intersection over an indexed family; graded items ask for bounds, indices and verdicts; one written proof per KP'
      - id: kp2
        name: 'Membership proofs with families'
        key_prerequisites: [quantifiers]
        step_check:
          step: 'Choose $n > \tfrac{1}{x-1}$'
          question: 'Why does the proof choose $n$ larger than $\tfrac{1}{x-1}$?'
          options:
            - 'It gives $1 + \tfrac{1}{n} < x$, so $x$ is outside $E_n$, which is a contradiction'
            - 'It makes $E_n$ equal to the whole interval $(0, 1]$, which then contains the number $x$'
            - 'It makes $\tfrac{1}{n}$ larger than $x - 1$, so that $x$ stays inside every set $E_n$'
            - 'It makes sure that $n$ is an integer, because $\tfrac{1}{x-1}$ itself need not be one'
          answer: 'It gives $1 + \tfrac{1}{n} < x$, so $x$ is outside $E_n$, which is a contradiction'
          why: 'For $n > \tfrac{1}{x-1}$ we get $\tfrac{1}{n} < x - 1$, hence $1 + \tfrac{1}{n} < x$, so $x \notin E_n$, which contradicts $x \in \bigcap E_n$.'
        exemplars:
          - problem: 'For $n \ge 1$ let $A_n = \left(-\tfrac{1}{n}, \tfrac{1}{n}\right)$. Does $0$ belong to $\bigcap_{n \ge 1} A_n$?'
            answer: 'yes'
            answer_contract: {"kind":"label","options":[["yes","it is an element","it is in the set","it belongs","an element","in the set"],["no","it is not an element","it is not in the set","it does not belong","not an element","not in the set"]]}
            solution_sketch: 'The number $0$ is in the intersection when it lies in $A_n$ for every $n$. For each $n$ we have $-\tfrac{1}{n} < 0 < \tfrac{1}{n}$, so $0 \in A_n$ for all $n$ and the answer is yes.'
          - problem: 'For $n \ge 1$ let $A_n = \left(-\tfrac{1}{n}, \tfrac{1}{n}\right)$. What is the least $n$ for which $0.05 \notin A_n$?'
            answer: '20'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The number $0.05$ lies in $A_n$ exactly when $0.05 < \tfrac{1}{n}$, that is when $n < 20$. For $n = 20$ the right endpoint is $\tfrac{1}{20} = 0.05$, which is not larger than $0.05$, so $0.05 \notin A_{20}$ and $20$ is the least such $n$.'
          - problem: 'For $n \ge 1$ let $B_n = \left[0, 1 + \tfrac{1}{n}\right)$. What is the least $n$ for which $1.02 \notin B_n$?'
            answer: '50'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The number $1.02$ lies in $B_n$ exactly when $1.02 < 1 + \tfrac{1}{n}$, that is when $\tfrac{1}{n} > 0.02$ and $n < 50$. For $n = 50$ the right endpoint is $1.02$ itself, so $1.02 \notin B_{50}$ and $50$ is the least such $n$.'
          - problem: 'For $n \ge 1$ let $Z_n = \left[0, \tfrac{1}{n}\right)$. Is the intersection $\bigcap_{n \ge 1} Z_n$ empty?'
            answer: 'no'
            answer_contract: {"kind":"label","options":[["yes","it is empty","empty"],["no","it is not empty","not empty","nonempty","non-empty"]]}
            solution_sketch: 'The number $0$ lies in $Z_n$ for every $n$, because $0 \le 0 < \tfrac{1}{n}$. So $0$ is in the intersection, which is therefore not empty, and in fact it is $\{0\}$.'
          - problem: 'In test $n$ a scale accepts a mass $x$ (in grams) if $x$ differs from $100$ by less than $\tfrac{1}{n}$ gram. A sample of $100.004$ grams is tested in tests $1, 2, 3, \dots$. In which test does it first fail?'
            answer: '250'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The sample passes test $n$ when $0.004 < \tfrac{1}{n}$, that is when $n < 250$. In test $250$ the tolerance is $\tfrac{1}{250} = 0.004$, which is not larger than $0.004$, so the sample first fails in test $250$.'
          - problem: 'Batch $n$ of metal rods is accepted if the length $\ell$ of a rod satisfies $\ell < 50 + \tfrac{1}{n}$ centimetres. For how many batches $n = 1, 2, 3, \dots$ is a rod of length $50.02$ centimetres accepted?'
            answer: '49'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The rod is accepted by batch $n$ when $50.02 < 50 + \tfrac{1}{n}$, that is when $\tfrac{1}{n} > 0.02$ and $n < 50$. The batches $1, 2, \dots, 49$ accept the rod, so there are $49$ batches.'
          - problem: 'Sam claims that $1.25 \in \bigcap_{n \ge 1} \left(0, 1 + \tfrac{1}{n}\right)$, because $1.25 < 2$. For which $n$ does Sam''s claim first fail?'
            answer: '4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Sam looked at the first set only, but the intersection needs every set. The number $1.25$ lies in $\left(0, 1 + \tfrac{1}{n}\right)$ when $\tfrac{1}{n} > 0.25$, that is for $n = 1, 2, 3$, and for $n = 4$ the right endpoint is $1.25$ itself, so the claim first fails at $n = 4$.'
          - problem: 'Write the full proof that $\bigcap_{n=1}^{\infty} A_n = \{0\}$, where $A_n = \left[-\tfrac{1}{n}, \tfrac{1}{n}\right]$ is a closed interval of real numbers for each positive integer $n$.'
            answer: 'intersection of A_n is {0}'
            answer_contract: {"kind":"none"}
            solution_sketch: 'We prove the two inclusions. First, $\{0\} \subseteq \bigcap_{n=1}^{\infty} A_n$: for every positive integer $n$ we have $-\tfrac{1}{n} \le 0 \le \tfrac{1}{n}$, so $0 \in A_n$ for every $n$, and hence $0 \in \bigcap_{n=1}^{\infty} A_n$. Second, $\bigcap_{n=1}^{\infty} A_n \subseteq \{0\}$: let $x \in \bigcap_{n=1}^{\infty} A_n$. Then $x \in A_n$ for every positive integer $n$, which means $|x| \le \tfrac{1}{n}$ for every positive integer $n$. Suppose, for contradiction, that $x \neq 0$. Then $|x| > 0$, so by the Archimedean property there is a positive integer $n$ with $n > \tfrac{1}{|x|}$. For this $n$ we get $\tfrac{1}{n} < |x|$, which contradicts $|x| \le \tfrac{1}{n}$. Hence $x = 0$, that is $x \in \{0\}$. The two inclusions together give $\bigcap_{n=1}^{\infty} A_n = \{0\}$. $\square$'
        constraints: 'prove a characterization of an indexed intersection by both inclusions; translate membership into a universal condition and find the index that excludes an element; graded items ask for that index, in contexts of tolerances and batches'
      - id: kp3
        name: 'Distributing over an indexed family'
        key_prerequisites: [quantifiers]
        step_check:
          step: 'The clause $x \in B$ does not mention $i$'
          question: 'Why may the clause $x \in B$ be moved inside "for every $i \in I$"?'
          options:
            - 'The quantifier "for every" applies only to the last clause, so $x \in B$ is not affected by it'
            - 'Every set $A_i$ is a subset of $B$, so the clause $x \in B$ holds for each $i$ anyway'
            - 'The clause $x \in B$ is false for some $i$, so moving it keeps the statement false'
            - 'The clause $x \in B$ does not depend on $i$, so asking it for all $i$ is the same as once'
          answer: 'The clause $x \in B$ does not depend on $i$, so asking it for all $i$ is the same as once'
          why: 'A condition that does not involve $i$ is true or false regardless of $i$, so it can sit inside or outside the quantifier (for a nonempty index set $I$).'
        exemplars:
          - problem: 'Let $B = \{1, 2, 3, 4, 5\}$, $A_1 = \{1, 6\}$, $A_2 = \{3, 6, 7\}$ and $A_3 = \{5, 8\}$. Find $B \cap \bigcup_{i=1}^{3} A_i$.'
            answer: '1, 3, 5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The union is $A_1 \cup A_2 \cup A_3 = \{1, 3, 5, 6, 7, 8\}$. Intersecting with $B$ keeps the elements that are also in $B$, which are $1$, $3$ and $5$.'
          - problem: 'Let $B$ be a set and let $\{A_i\}_{i \in I}$ be a family of sets with $I \neq \varnothing$. Is $B \cup \bigcap_{i \in I} A_i = \bigcap_{i \in I} (B \cup A_i)$ always true?'
            answer: 'yes'
            answer_contract: {"kind":"label","options":[["yes","it is true","true","it holds","always","they do","it is","it is always true"],["no","it is false","false","not always","it does not hold","they do not","it is not","it is not always true"]]}
            solution_sketch: 'An element $x$ is in the left side exactly when $x \in B$ or $x$ lies in every $A_i$. This holds exactly when, for every $i$, $x \in B$ or $x \in A_i$, which says $x \in \bigcap_{i \in I} (B \cup A_i)$, so the identity always holds.'
          - problem: 'Let $B$ be a set and let $\{A_i\}_{i \in I}$ be a family of sets. Is $B \cap \bigcup_{i \in I} A_i = \bigcap_{i \in I} (B \cap A_i)$ always true?'
            answer: 'no'
            answer_contract: {"kind":"label","options":[["yes","it is true","true","it holds","always","they do","it is","it is always true"],["no","it is false","false","not always","it does not hold","they do not","it is not","it is not always true"]]}
            solution_sketch: 'The left side asks for one index with $x \in A_i$, while the right side asks for every index. With $B = \{1, 2\}$, $A_1 = \{1\}$ and $A_2 = \{2\}$ the left side is $\{1, 2\}$ and the right side is empty, so the identity is not always true.'
          - problem: 'Let $B = \{1, 2\}$, $A_1 = \{1\}$ and $A_2 = \{2\}$. How many elements does $\bigcap_{i=1}^{2} (B \cap A_i)$ have?'
            answer: '0'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'We have $B \cap A_1 = \{1\}$ and $B \cap A_2 = \{2\}$. These two sets have no element in common, so their intersection has $0$ elements.'
          - problem: 'The school choir has the pupils $\{2, 4, 6, 8, 10\}$. The chess club has the pupils $\{1, 2, 3, 4\}$, the art club has $\{4, 5, 6\}$ and the music club has $\{9, 10, 11\}$. Which choir members belong to at least one of the three clubs?'
            answer: '2, 4, 6, 10'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'We want $B \cap \bigcup_{i=1}^{3} A_i$ with $B$ the choir. Checking each choir member, $2$ and $4$ are in chess, $4$ and $6$ are in art, $10$ is in music, and $8$ is in no club, so the answer is $2, 4, 6, 10$.'
          - problem: 'Pupils are numbered $1$ to $30$. Club $i$ for $i = 2, 3, 4$ has the pupils whose number is a multiple of $i$, and the choir has the pupils numbered $13$ to $30$. Which choir members belong to all three clubs?'
            answer: '24'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'A pupil is in all three clubs when the number is a multiple of $2$, $3$ and $4$, that is a multiple of $12$. The multiples of $12$ up to $30$ are $12$ and $24$, and only $24$ is in the choir, because $12 < 13$.'
          - problem: 'Let $B = \{1, 2, 3\}$, $A_1 = \{1, 2, 4\}$, $A_2 = \{2, 3, 4\}$ and $A_3 = \{2, 4, 5\}$. Find $B \cup \bigcap_{i=1}^{3} A_i$.'
            answer: '1, 2, 3, 4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The intersection is $A_1 \cap A_2 \cap A_3 = \{2, 4\}$, because only $2$ and $4$ lie in all three sets. Adding the elements of $B$ gives $\{1, 2, 3, 4\}$.'
          - problem: 'Write the full proof that $B \cap \bigcup_{i \in I} A_i = \bigcup_{i \in I} (B \cap A_i)$, where $\{A_i\}_{i \in I}$ is a family of sets indexed by $I$ and $B$ is a set.'
            answer: 'B n union A_i = union of B n A_i'
            answer_contract: {"kind":"none"}
            solution_sketch: 'We show that each side is a subset of the other. First, let $x \in B \cap \bigcup_{i \in I} A_i$. Then $x \in B$ and $x \in \bigcup_{i \in I} A_i$. By the definition of an indexed union there is an index $k \in I$ with $x \in A_k$. Now $x \in B$ and $x \in A_k$, so $x \in B \cap A_k$. Since $k \in I$, this gives $x \in \bigcup_{i \in I} (B \cap A_i)$. Second, let $x \in \bigcup_{i \in I} (B \cap A_i)$. Then there is an index $k \in I$ with $x \in B \cap A_k$, so $x \in B$ and $x \in A_k$. From $x \in A_k$ with $k \in I$ we get $x \in \bigcup_{i \in I} A_i$, and together with $x \in B$ this gives $x \in B \cap \bigcup_{i \in I} A_i$. Both inclusions hold, so the two sets are equal. $\square$'
        constraints: 'prove an identity involving an indexed family by element chasing; graded items compute both sides of an identity, decide true or false statements and find counterexamples; contexts with clubs and choirs'
    diagnostic_exemplar:
      problem: 'Prove the generalized De Morgan law $\left(\bigcup_{i \in I} A_i\right)^{c} = \bigcap_{i \in I} A_i^{\,c}$.'
      answer: 'Not in any $A_i$ iff in every complement.'
      solution_sketch: '$x \in (\bigcup_i A_i)^{c}$ iff $x \notin \bigcup_i A_i$ iff for all $i$, $x \notin A_i$, iff for all $i$, $x \in A_i^{c}$, iff $x \in \bigcap_i A_i^{c}$. $\square$'
    anki_seeds:
      - front: 'Meaning of $x \in \bigcup_{i \in I} A_i$ and $x \in \bigcap_{i \in I} A_i$?'
        back: '$\bigcup$: $x \in A_i$ for some $i \in I$. $\bigcap$: $x \in A_i$ for every $i \in I$.'
        type: basic
      - front: 'Generalized De Morgan law for a complemented indexed union?'
        back: '$\left(\bigcup_{i \in I} A_i\right)^{c} = \bigcap_{i \in I} A_i^{\,c}$ (and dually for an intersection).'
        type: basic

  - id: set-identities-proofs
    name: "Proving Set Identities"
    core: true
