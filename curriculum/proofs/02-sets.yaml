          step: 'Apply De Morgan: $\neg\,(x \in B \land x \notin C)$ iff $x \notin B \lor x \in C$'
          question: 'Why does "not ($x \in B$ and $x \notin C$)" become "$x \notin B$ or $x \in C$"?'
          options:
