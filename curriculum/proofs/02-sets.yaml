        weight: 0.0
    knowledge_points:
      - id: kp1
        name: "Distributive laws for sets"
        key_prerequisites: [set-operations]
        exemplars:
          - problem: 'Prove: $A \cap (B \cup C) = (A \cap B) \cup (A \cap C)$.'
            answer: 'Element chase using distributivity of $\land$ over $\lor$.'
            solution_sketch: '$x \in A \cap (B \cup C)$ iff $x \in A$ and ($x \in B$ or $x \in C$) iff ($x \in A$ and $x \in B$) or ($x \in A$ and $x \in C$) iff $x \in (A \cap B) \cup (A \cap C)$. $\square$'
          - problem: 'Prove: $A \cup (B \cap C) = (A \cup B) \cap (A \cup C)$.'
            answer: 'Element chase using distributivity of $\lor$ over $\land$.'
            solution_sketch: '$x \in A \cup (B \cap C)$ iff $x \in A$ or ($x \in B$ and $x \in C$) iff ($x \in A$ or $x \in B$) and ($x \in A$ or $x \in C$) iff $x \in (A \cup B) \cap (A \cup C)$. $\square$'
        constraints: "prove via element chasing, citing the logical distributive law"
      - id: kp2
        name: "De Morgan laws for sets"
        key_prerequisites: [logical-equivalence]
        exemplars:
          - problem: 'Prove: $(A \cup B)^{c} = A^{c} \cap B^{c}$.'
            answer: 'Element chase using De Morgan for logic.'
            solution_sketch: '$x \in (A \cup B)^{c}$ iff $\neg(x \in A \lor x \in B)$ iff $x \notin A \land x \notin B$ (De Morgan) iff $x \in A^{c} \cap B^{c}$. $\square$'
          - problem: 'Prove: $(A \cap B)^{c} = A^{c} \cup B^{c}$.'
            answer: 'Element chase using De Morgan for logic.'
            solution_sketch: '$x \in (A \cap B)^{c}$ iff $\neg(x \in A \land x \in B)$ iff $x \notin A \lor x \notin B$ (De Morgan) iff $x \in A^{c} \cup B^{c}$. $\square$'
        constraints: "reduce a set De Morgan law to the logical one"
      - id: kp3
        name: "Identities with set difference"
        key_prerequisites: [set-operations]
        exemplars:
          - problem: 'Prove: $A \setminus (B \cap C) = (A \setminus B) \cup (A \setminus C)$.'
            answer: 'Rewrite $\setminus$, apply De Morgan and distributivity.'
            solution_sketch: '$x \in A \setminus (B \cap C)$ iff $x \in A \land \neg(x \in B \land x \in C)$ iff $x \in A \land (x \notin B \lor x \notin C)$ iff $(x \in A \land x \notin B) \lor (x \in A \land x \notin C)$ iff $x \in (A \setminus B) \cup (A \setminus C)$. $\square$'
          - problem: 'Prove: $A \setminus (B \cup C) = (A \setminus B) \cap (A \setminus C)$.'
            answer: 'Rewrite $\setminus$, apply De Morgan.'
            solution_sketch: '$x \in A \setminus (B \cup C)$ iff $x \in A \land \neg(x \in B \lor x \in C)$ iff $x \in A \land x \notin B \land x \notin C$ iff $(x \in A \land x \notin B) \land (x \in A \land x \notin C)$ iff $x \in (A \setminus B) \cap (A \setminus C)$. $\square$'
        constraints: "express difference as membership plus non-membership; then chase"
    diagnostic_exemplar:
      problem: 'Prove: $A \setminus (B \setminus C) = (A \setminus B) \cup (A \cap C)$.'
      answer: 'Element chase. $x \in A \setminus (B \setminus C)$ iff $x \in A$ and $\lnot(x \in B \land x \notin C)$. By De Morgan the second condition becomes $x \notin B \lor x \in C$, so the whole condition is $x \in A \land (x \notin B \lor x \in C)$. Distributing the conjunction over the disjunction gives $(x \in A \land x \notin B) \lor (x \in A \land x \in C)$, i.e. $x \in A \setminus B$ or $x \in A \cap C$, i.e. $x \in (A \setminus B) \cup (A \cap C)$. Every step is an equivalence, so the two sets are equal.'
      solution_sketch: 'Rewrite the differences as conjunctions with negations, apply De Morgan to the inner difference, then distribute.'
