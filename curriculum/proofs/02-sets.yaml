            - 'The negation of "and" is "and" with both parts negated, so we get $x \notin B$ and $x \in C$'
            - 'The inner difference $B \setminus C$ is removed first, and what remains of $B$ is outside $C$'
            - 'Negation changes only the first part of a statement, so $x \in B$ becomes $x \notin B$'
          answer: 'A negated "and" is an "or" of the negated parts, and not ($x \notin C$) is $x \in C$'
          why: 'The De Morgan law says $\neg(p \land q) \equiv \neg p \lor \neg q$, and the negation of "$x \notin C$" is "$x \in C$".'
        exemplars:
          - problem: 'Let $A = \{1, 2, 3, 4, 5\}$, $B = \{2, 4\}$ and $C = \{4, 5, 6\}$. Find $A \setminus (B \cap C)$.'
