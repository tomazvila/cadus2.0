      - id: kp1
        name: 'Distributive laws for sets'
        key_prerequisites: [set-operations]
        step_check:
          step: 'to show two sets are equal, take an arbitrary element $x$'
          question: 'Why does it show that two sets are equal when an arbitrary element $x$ lies in one exactly when it lies in the other?'
          options:
            - 'One element that lies in both sets is enough to make the sets equal'
            - 'Since $x$ is arbitrary, the check covers every element of both sets'
            - 'Equal sets must have the same number of elements, and an element check counts them'
            - 'The element $x$ is chosen as the smallest element, and the other elements then follow'
          answer: 'Since $x$ is arbitrary, the check covers every element of both sets'
          why: 'Two sets are equal when they have the same elements; since $x$ is arbitrary, the argument works for each element, so no element lies in only one of the sets.'
        exemplars:
          - problem: 'Let $A = \{1, 2, 3\}$, $B = \{2, 3, 4\}$ and $C = \{3, 4, 5\}$. Find $A \cap (B \cup C)$.'
            answer: '2, 3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'First $B \cup C = \{2, 3, 4, 5\}$. The elements of $A$ that also lie in $B \cup C$ are $2$ and $3$, so $A \cap (B \cup C) = \{2, 3\}$.'
          - problem: 'For the same kind of sets, $A = \{1, 2, 3\}$, $B = \{2, 3, 4\}$ and $C = \{3, 4, 5\}$, find $A \cup (B \cap C)$.'
            answer: '1, 2, 3, 4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'First $B \cap C = \{3, 4\}$. Adding the elements of $A$ gives $A \cup (B \cap C) = \{1, 2, 3, 4\}$, and one checks that $(A \cup B) \cap (A \cup C) = \{1, 2, 3, 4\} \cap \{1, 2, 3, 4, 5\}$ is the same set.'
          - problem: 'Is $A \cup (B \cap C) = (A \cup B) \cap (A \cup C)$ true for all sets $A$, $B$ and $C$?'
            answer: 'yes'
            answer_contract: {"kind":"label","options":[["yes","it is true","true","it holds","always","they do","it is","it is always true"],["no","it is false","false","not always","it does not hold","they do not","it is not","it is not always true"]]}
            solution_sketch: 'This is the distributive law of union over intersection. An element in the left side is in $A$, or in both $B$ and $C$, and in each case it lies in $A \cup B$ and in $A \cup C$, so the identity holds for all sets.'
          - problem: 'Is $A \cap (B \cup C) = (A \cap B) \cup C$ true for all sets $A$, $B$ and $C$?'
            answer: 'no'
            answer_contract: {"kind":"label","options":[["yes","it is true","true","it holds","always","they do","it is","it is always true"],["no","it is false","false","not always","it does not hold","they do not","it is not","it is not always true"]]}
            solution_sketch: 'The correct law is $A \cap (B \cup C) = (A \cap B) \cup (A \cap C)$, and the right side here lacks the factor $A$ in front of $C$. For $A = \{1, 2\}$, $B = \{2, 3\}$, $C = \{3, 4\}$ the left side is $\{2\}$ and the right side is $\{2, 3, 4\}$, so the identity fails.'
          - problem: 'Let $A = \{1, 2\}$, $B = \{2, 3\}$ and $C = \{3, 4\}$. Which elements of $(A \cap B) \cup C$ are not in $A \cap (B \cup C)$?'
            answer: '3, 4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'We have $(A \cap B) \cup C = \{2\} \cup \{3, 4\} = \{2, 3, 4\}$ and $A \cap (B \cup C) = \{1, 2\} \cap \{2, 3, 4\} = \{2\}$. The elements $3$ and $4$ are in the first set but not in the second.'
          - problem: 'The pupils numbered $1$ to $20$ are on a trip. The choir has the even numbers, the chess club has the multiples of $3$ and the art club has the multiples of $5$. Which pupils are in the choir and also in the chess club or the art club?'
            answer: '6, 10, 12, 18, 20'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'We need $A \cap (B \cup C)$ with $A$ the even numbers. The multiples of $3$ or $5$ up to $20$ are $3, 5, 6, 9, 10, 12, 15, 18, 20$, and the even ones are $6, 10, 12, 18, 20$.'
          - problem: 'On a school trip the pupils $\{1, 2, 3, 5\}$ brought a hat, the pupils $\{2, 4, 7\}$ brought gloves and the pupils $\{4, 6, 8\}$ brought a scarf. Which pupils brought a hat, or brought both gloves and a scarf?'
            answer: '1, 2, 3, 4, 5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'We need $A \cup (B \cap C)$ with $A$ the hat set. The pupils with both gloves and a scarf are $B \cap C = \{4\}$, and adding the hat pupils $1, 2, 3, 5$ gives $\{1, 2, 3, 4, 5\}$.'
          - problem: 'Sam says that $A \cup (B \cap C) = (A \cup B) \cap C$. Test this with $A = \{1\}$, $B = \{2\}$ and $C = \{2, 3\}$: which element of $A \cup (B \cap C)$ is missing from $(A \cup B) \cap C$?'
            answer: '1'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'We have $A \cup (B \cap C) = \{1\} \cup \{2\} = \{1, 2\}$ and $(A \cup B) \cap C = \{1, 2\} \cap \{2, 3\} = \{2\}$. The element $1$ is in the first set but not in the second, so the identity is false.'
          - problem: 'Write the full proof that $A \cup (B \cap C) = (A \cup B) \cap (A \cup C)$ for all sets $A$, $B$ and $C$.'
            answer: 'A u (B n C) = (A u B) n (A u C)'
            answer_contract: {"kind":"none"}
            solution_sketch: 'We show that each side is a subset of the other. First, let $x \in A \cup (B \cap C)$. Then $x \in A$ or $x \in B \cap C$. Case 1: $x \in A$. Then $x \in A \cup B$ and $x \in A \cup C$, so $x \in (A \cup B) \cap (A \cup C)$. Case 2: $x \in B \cap C$. Then $x \in B$ and $x \in C$, so $x \in A \cup B$ and $x \in A \cup C$, and again $x \in (A \cup B) \cap (A \cup C)$. Second, let $x \in (A \cup B) \cap (A \cup C)$. Then $x \in A \cup B$ and $x \in A \cup C$. If $x \in A$, then $x \in A \cup (B \cap C)$. Suppose $x \notin A$. From $x \in A \cup B$ and $x \notin A$ we get $x \in B$, and from $x \in A \cup C$ and $x \notin A$ we get $x \in C$. So $x \in B \cap C$, hence $x \in A \cup (B \cap C)$. In both cases $x \in A \cup (B \cap C)$. The two inclusions give $A \cup (B \cap C) = (A \cup B) \cap (A \cup C)$. $\square$'
        constraints: 'prove a distributive set identity by element chasing and both inclusions; graded items compute both sides on small sets, decide true or false identities and find the elements that break a false one; contexts with clubs and trips'
      - id: kp2
        name: 'De Morgan laws for sets'
        key_prerequisites: [logical-equivalence]
        step_check:
          step: 'since $\neg(p \lor q) \equiv \neg p \land \neg q$'
          question: 'Why does "not ($x \in C$ or $x \in D$)" become "$x \notin C$ and $x \notin D$"?'
          options:
            - '"Not" turns every "or" into "and" in a statement, whatever else the statement says'
            - 'An element outside the union is outside the larger set, and the larger set is $C$'
            - 'An "or" fails only when both parts fail, so $x$ must miss both $C$ and $D$'
            - 'The complement of a union is the union of the complements, so "or" stays "or"'
          answer: 'An "or" fails only when both parts fail, so $x$ must miss both $C$ and $D$'
          why: 'An "or" statement is false exactly when both of its parts are false, so $x$ is outside $C \cup D$ exactly when $x \notin C$ and $x \notin D$.'
        exemplars:
          - problem: 'Let $U = \{1, 2, 3, 4, 5, 6\}$, $A = \{1, 2, 3\}$ and $B = \{3, 4\}$, and let complements be taken in $U$. Find $(A \cup B)^c$.'
            answer: '5, 6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'First $A \cup B = \{1, 2, 3, 4\}$. The complement in $U$ consists of the elements of $U$ outside this set, which are $5$ and $6$.'
          - problem: 'With $U = \{1, 2, 3, 4, 5, 6\}$, $A = \{1, 2, 3\}$ and $B = \{3, 4\}$, find $(A \cap B)^c$.'
            answer: '1, 2, 4, 5, 6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'First $A \cap B = \{3\}$. The complement in $U$ consists of all elements of $U$ except $3$, which are $1, 2, 4, 5, 6$, and this equals $A^c \cup B^c = \{4, 5, 6\} \cup \{1, 2, 5, 6\}$.'
          - problem: 'Let $A$ and $B$ be subsets of a universal set $U$. Is $(A \cap B)^c = A^c \cup B^c$ true for all such $A$ and $B$?'
            answer: 'yes'
            answer_contract: {"kind":"label","options":[["yes","it is true","true","it holds","always","they do","it is","it is always true"],["no","it is false","false","not always","it does not hold","they do not","it is not","it is not always true"]]}
            solution_sketch: 'This is one of the De Morgan laws. An element is outside $A \cap B$ exactly when it is outside $A$ or outside $B$, which means it lies in $A^c \cup B^c$, so the identity holds for all $A$ and $B$.'
          - problem: 'Let $A$ and $B$ be subsets of a universal set $U$. Is $(A \cap B)^c = A^c \cap B^c$ true for all such $A$ and $B$?'
            answer: 'no'
            answer_contract: {"kind":"label","options":[["yes","it is true","true","it holds","always","they do","it is","it is always true"],["no","it is false","false","not always","it does not hold","they do not","it is not","it is not always true"]]}
            solution_sketch: 'An element outside $A \cap B$ needs to be outside only one of the sets, while $A^c \cap B^c$ asks for both. For $U = \{1, 2\}$, $A = \{1\}$ and $B = \{2\}$ we get $(A \cap B)^c = \{1, 2\}$ but $A^c \cap B^c = \varnothing$.'
          - problem: 'Sam claims that $(A \cup B)^c = A^c \cup B^c$. Test it with $U = \{1, 2, 3, 4\}$, $A = \{1, 2\}$ and $B = \{2, 3\}$: which elements of $A^c \cup B^c$ are not in $(A \cup B)^c$?'
            answer: '1, 3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'We have $A^c = \{3, 4\}$ and $B^c = \{1, 4\}$, so $A^c \cup B^c = \{1, 3, 4\}$. Also $(A \cup B)^c = \{1, 2, 3\}^c = \{4\}$, so the elements $1$ and $3$ show that Sam is wrong; the correct law is $(A \cup B)^c = A^c \cap B^c$.'
          - problem: 'The pupils numbered $1$ to $10$ are the universal set. The pupils $\{1, 2, 3, 4, 5\}$ walked to school and the pupils $\{5, 6, 7\}$ came by bus. Which pupils neither walked nor came by bus?'
            answer: '8, 9, 10'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'We need $(A \cup B)^c$, the complement of the union of the two sets. The union is $\{1, 2, 3, 4, 5, 6, 7\}$, so the pupils outside it are $8, 9, 10$.'
          - problem: 'Of $30$ pupils, $12$ have a dog, $9$ have a cat and $4$ have both. How many pupils have neither a dog nor a cat?'
            answer: '13'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The pupils with a dog or a cat number $12 + 9 - 4 = 17$, because the $4$ pupils with both were counted twice. The pupils with neither form the complement of this union, so there are $30 - 17 = 13$ of them.'
          - problem: 'Let $U = \{1, 2, 3, 4, 5, 6\}$, $A = \{1, 2, 3, 4\}$ and $B = \{3, 4, 5\}$. Find $(A^c \cup B^c)^c$.'
            answer: '3, 4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'We have $A^c = \{5, 6\}$ and $B^c = \{1, 2, 6\}$, so $A^c \cup B^c = \{1, 2, 5, 6\}$. Its complement is $\{3, 4\}$, which is also $A \cap B$, as the De Morgan law and the double complement predict.'
          - problem: 'Write the full proof that $(A \cap B)^c = A^c \cup B^c$ for all subsets $A$ and $B$ of a universal set $U$, where $X^c$ denotes $U \setminus X$.'
            answer: 'complement of A n B = A^c u B^c'
            answer_contract: {"kind":"none"}
            solution_sketch: 'We show that each side is a subset of the other. First, let $x \in (A \cap B)^c$. Then $x \in U$ and $x \notin A \cap B$. So it is not true that both $x \in A$ and $x \in B$; hence $x \notin A$ or $x \notin B$. If $x \notin A$, then $x \in A^c$, because $x \in U$. If $x \notin B$, then $x \in B^c$. In either case $x \in A^c \cup B^c$. Second, let $x \in A^c \cup B^c$. Then $x \in A^c$ or $x \in B^c$, and in both cases $x \in U$. If $x \in A^c$, then $x \notin A$, so $x$ cannot belong to $A \cap B$, because every element of $A \cap B$ is in $A$. If $x \in B^c$, then $x \notin B$, and again $x \notin A \cap B$. So $x \in U$ and $x \notin A \cap B$, that is $x \in (A \cap B)^c$. The two inclusions give $(A \cap B)^c = A^c \cup B^c$. $\square$'
        constraints: 'reduce a set De Morgan law to the logical one; graded items compute complements of unions and intersections on small universes, decide true or false laws and count with complements; contexts with classes and pets'
      - id: kp3
        name: 'Identities with set difference'
