            answer_contract: {"kind":"exact"}
            solution_sketch: 'First $B \cap C = \{4\}$. Removing this element from $A$ leaves $A \setminus (B \cap C) = \{1, 2, 3, 5\}$.'
          - problem: 'With $A = \{1, 2, 3, 4, 5\}$, $B = \{2, 4\}$ and $C = \{4, 5, 6\}$, find $(A \setminus B) \setminus C$.'
            answer: '1, 3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'First $A \setminus B = \{1, 3, 5\}$. Removing the elements of $C$ from it takes out $5$ and leaves $\{1, 3\}$.'
          - problem: 'Is $(A \setminus B) \setminus C = A \setminus (B \cup C)$ true for all sets $A$, $B$ and $C$?'
            answer: 'yes'
            answer_contract: {"kind":"label","options":[["yes","it is true","true","it holds","always","they do","it is","it is always true"],["no","it is false","false","not always","it does not hold","they do not","it is not","it is not always true"]]}
            solution_sketch: 'An element is in the left side when it is in $A$, not in $B$ and not in $C$. That is exactly the condition for being in $A$ and not in $B \cup C$, so the two sets are equal for all $A$, $B$ and $C$.'
          - problem: 'Is $A \setminus (B \setminus C) = (A \setminus B) \setminus C$ true for all sets $A$, $B$ and $C$?'
            answer: 'no'
            answer_contract: {"kind":"label","options":[["yes","it is true","true","it holds","always","they do","it is","it is always true"],["no","it is false","false","not always","it does not hold","they do not","it is not","it is not always true"]]}
            solution_sketch: 'The two sides treat $C$ in different ways. For $A = \{1, 2, 3\}$, $B = \{2, 3\}$ and $C = \{3\}$ the left side is $\{1, 3\}$ and the right side is $\{1\}$, so the identity is not always true.'
          - problem: 'Let $A = \{1, 2, 3\}$, $B = \{2, 3\}$ and $C = \{3\}$. Which element of $A \setminus (B \setminus C)$ is not in $(A \setminus B) \setminus C$?'
            answer: '3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'We have $B \setminus C = \{2\}$, so $A \setminus (B \setminus C) = \{1, 3\}$. Also $A \setminus B = \{1\}$ and $(A \setminus B) \setminus C = \{1\}$, so the element $3$ is in the first set but not in the second.'
          - problem: 'A choir has the $12$ pupils numbered $1$ to $12$. The pupils $\{2, 4, 6, 8\}$ play the piano and the pupils $\{1, 2, 3\}$ play the violin. Which choir members play neither instrument?'
            answer: '5, 7, 9, 10, 11, 12'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'We need $A \setminus (B \cup C)$ with $A$ the choir. The pupils who play at least one instrument are $\{1, 2, 3, 4, 6, 8\}$, and removing them from $\{1, \dots, 12\}$ leaves $5, 7, 9, 10, 11, 12$.'
          - problem: 'A library has $50$ books. Of these, $20$ are fiction, $15$ are in French and $6$ are fiction in French. How many books are fiction but not in French?'
            answer: '14'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The fiction books that are in French are $6$ of the $20$ fiction books. The books that are fiction but not French number $20 - 6 = 14$, which is $|A \setminus B| = |A| - |A \cap B|$.'
          - problem: 'Sam claims that $A \setminus (B \cap C) = (A \setminus B) \cap (A \setminus C)$. Test it with $A = \{1, 2, 3\}$, $B = \{1, 2\}$ and $C = \{2, 3\}$: which elements of $A \setminus (B \cap C)$ are missing from $(A \setminus B) \cap (A \setminus C)$?'
            answer: '1, 3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'We have $B \cap C = \{2\}$, so $A \setminus (B \cap C) = \{1, 3\}$. Also $A \setminus B = \{3\}$ and $A \setminus C = \{1\}$, so the intersection of these is empty and Sam is wrong; the correct law has a union, $A \setminus (B \cap C) = (A \setminus B) \cup (A \setminus C)$.'
          - problem: 'Write the full proof that $A \setminus (B \cap C) = (A \setminus B) \cup (A \setminus C)$ for all sets $A$, $B$ and $C$.'
            answer: 'A-(B n C) = (A-B) u (A-C)'
            answer_contract: {"kind":"none"}
            solution_sketch: 'We show that each side is a subset of the other. First, let $x \in A \setminus (B \cap C)$. Then $x \in A$ and $x \notin B \cap C$. Since $x \notin B \cap C$, it is not true that both $x \in B$ and $x \in C$, so $x \notin B$ or $x \notin C$. If $x \notin B$, then $x \in A$ and $x \notin B$ give $x \in A \setminus B$. If $x \notin C$, then in the same way $x \in A \setminus C$. In either case $x \in (A \setminus B) \cup (A \setminus C)$. Second, let $x \in (A \setminus B) \cup (A \setminus C)$. Then $x \in A \setminus B$ or $x \in A \setminus C$. If $x \in A \setminus B$, then $x \in A$ and $x \notin B$, and because $x \notin B$ we have $x \notin B \cap C$; so $x \in A \setminus (B \cap C)$. If $x \in A \setminus C$, then $x \in A$ and $x \notin C$, so $x \notin B \cap C$ and again $x \in A \setminus (B \cap C)$. The two inclusions give $A \setminus (B \cap C) = (A \setminus B) \cup (A \setminus C)$. $\square$'
        constraints: 'express a difference as membership plus non-membership, then chase; graded items compute differences on small sets, decide true or false identities and count with differences; contexts with choirs and libraries'
    diagnostic_exemplar:
      problem: 'Prove: $A \setminus (B \setminus C) = (A \setminus B) \cup (A \cap C)$.'
      answer: 'Element chase. $x \in A \setminus (B \setminus C)$ iff $x \in A$ and $\lnot(x \in B \land x \notin C)$. By De Morgan the second condition becomes $x \notin B \lor x \in C$, so the whole condition is $x \in A \land (x \notin B \lor x \in C)$. Distributing the conjunction over the disjunction gives $(x \in A \land x \notin B) \lor (x \in A \land x \in C)$, i.e. $x \in A \setminus B$ or $x \in A \cap C$, i.e. $x \in (A \setminus B) \cup (A \cap C)$. Every step is an equivalence, so the two sets are equal.'
      solution_sketch: 'Rewrite the differences as conjunctions with negations, apply De Morgan to the inner difference, then distribute.'
    anki_seeds:
      - front: 'The two standard ways to prove a set identity?'
        back: 'Element-chasing (show $x \in$ LHS iff $x \in$ RHS) or double inclusion ($\subseteq$ both ways).'
        type: basic
      - front: 'De Morgan''s laws for sets?'
        back: '$(A \cup B)^{c} = A^{c} \cap B^{c}$ and $(A \cap B)^{c} = A^{c} \cup B^{c}$.'
        type: basic
