  - id: pigeonhole-principle
    name: "The Pigeonhole Principle"
    core: false                # terminal counting result
    difficulty: 0.60
    drill: false
    answer_kind: proof
    expected_time_secs: 210
    prerequisites:
      - id: functions-injective-surjective
        weight: 0.5
        key: true
      - id: counting-functions
        weight: 0.3
      - id: floor-ceiling-functions
        weight: 0.2
        key: false
      - id: quantifiers
        weight: 0.2
      - id: cartesian-products
        weight: 0.0
    knowledge_points:
      - id: kp1
        name: "The principle via functions"
        key_prerequisites: [functions-injective-surjective]
        step_check:
          step: 'Thus $f$ is a bijection from $A$ onto $f(A)$'
          question: 'Why does the proof say that $f$ is a bijection onto $f(A)$ and not onto $B$?'
          options:
            - 'Because $|A| > |B|$, the function $f$ is surjective onto $B$ already'
            - 'Outputs are distinct, but some elements of $B$ may never be hit'
            - 'A bijection can only be defined onto the image of a function'
            - 'The image $f(A)$ is always larger than the codomain $B$'
          answer: 'Outputs are distinct, but some elements of $B$ may never be hit'
          why: 'Injectivity makes each element of $A$ pair with a different element of $f(A)$. It does not say that every element of $B$ is hit, so $f$ need not be onto $B$.'
        try_first:
          problem: 'Ten guests are each given one of $8$ rooms. Is it possible that every guest has a room alone?'
          answer_contract: {"kind": "label", "options": [["yes"], ["no"]]}
          answer: 'no'
          reveal: 'No: every guest alone would need ten different rooms, but there are only eight. A function from a larger finite set to a smaller one cannot be injective, and that is the pigeonhole principle.'
        exemplars:
          - problem: 'Let $A$ be a set with $11$ elements and $B$ a set with $7$ elements. Can a function $f : A \to B$ be injective?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "it can", "yes, it can", "possible", "it is possible", "it can be injective", "yes, it can be injective"], ["no", "it cannot", "no, it cannot", "not possible", "impossible", "it cannot be injective", "no, it cannot be injective", "cannot be injective"]]}
            solution_sketch: 'An injective function sends the $11$ elements of $A$ to $11$ different elements of $B$. But $B$ has only $7$ elements. So $f$ cannot be injective, and two elements of $A$ must share a value.'
          - problem: 'A function $f$ from a finite set $A$ with $10$ elements into a finite set $B$ is injective. What is the smallest possible number of elements of $B$?'
            answer: '10'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'An injective $f$ is a bijection from $A$ onto its image, so the image has $10$ elements. The image lies inside $B$, so $B$ has at least $10$ elements. When $B$ has exactly $10$ elements the same map works, so the smallest number is $10$.'
          - problem: 'Let $B$ be a set with $5$ elements. What is the least number $N$ such that every function from a set with $N$ elements into $B$ fails to be injective?'
            answer: '6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'An injective function from a set with $N$ elements into $B$ needs $N \le 5$. For $N = 6$ no such function exists, so every function fails to be injective. For $N = 5$ a bijection onto $B$ exists, so $5$ is too small. The least number is $6$.'
          - problem: 'Sam claims that for every positive integer $n$ there is an injective function from a set with $n$ elements into a fixed set with $3$ elements. What is the least $n$ for which Sam''s claim is false?'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'An injective function from an $n$-element set into a $3$-element set needs $n \le 3$. For $n = 1, 2, 3$ such functions exist. For $n = 4$ the condition $4 \le 3$ fails, so the least counterexample is $n = 4$.'
          - problem: 'Let $A$ have $7$ elements and $B$ have $6$ elements. What is the largest possible number of elements of $f(A)$ for a function $f : A \to B$?'
            answer: '6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The image $f(A)$ is a subset of $B$, so it has at most $6$ elements. A function from $A$ onto $B$ exists because $A$ has more elements than $B$, and its image has all $6$ elements. So the largest possible number is $6$.'
          - problem: 'Is there an injective function from a set with $6$ elements to a set with $9$ elements?'
            answer: 'yes'
            answer_contract: {"kind": "label", "options": [["yes", "there is", "there is one", "yes, there is", "it can", "possible"], ["no", "there is not", "there is none", "no, there is not", "it cannot", "impossible"]]}
            solution_sketch: 'Name the elements of the first set $a_1, \dots, a_6$ and choose $6$ different elements $b_1, \dots, b_6$ of the second set. Send $a_i$ to $b_i$. Different inputs get different outputs, so this function is injective, and the answer is yes. The principle only forbids a domain larger than the codomain.'
          - problem: 'A school has $27$ students and gives each student one locker. What is the smallest number of lockers for which every student can have a locker of their own?'
            answer: '27'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Assigning lockers is a function from the $27$ students to the lockers, and each student has a locker alone exactly when it is injective. An injective function needs at least as many lockers as students. So at least $27$ lockers are needed, and $27$ are enough.'
          - problem: 'Eleven letters are put into seven mailboxes. What is the largest number $k$ such that some mailbox must receive at least $k$ letters?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'If every mailbox received at most $1$ letter, there would be at most $7$ letters, but there are $11$. So some mailbox receives at least $2$ letters. Three letters in one mailbox is not forced, because the split $2, 2, 2, 2, 1, 1, 1$ uses all $11$ letters. So the answer is $2$.'
          - problem: 'Write the full proof that if $A$ and $B$ are finite sets with $|A| = |B|$, then a function $f : A \to B$ is injective if and only if it is surjective.'
            answer: '|A|=|B|: f injective <=> surjective'
            answer_contract: {"kind": "none"}
            solution_sketch: 'Let $|A| = |B| = n$ and let $f : A \to B$ be a function. We use the pigeonhole principle: if $X$ and $Y$ are finite sets with $|X| > |Y|$, then no function from $X$ to $Y$ is injective. ($\Rightarrow$) Suppose $f$ is injective. Distinct elements of $A$ then have distinct images, so $f$ is a bijection from $A$ onto its image $f(A)$, and therefore $|f(A)| = |A| = n$. Now $f(A) \subseteq B$ and $|B| = n$. If some $b \in B$ were not in $f(A)$, then $f(A) \cup \{b\}$ would be a subset of $B$ with $n + 1$ elements, which is impossible. Hence $f(A) = B$, so $f$ is surjective. ($\Leftarrow$) Suppose $f$ is surjective, and suppose for contradiction that $f$ is not injective. Then there are $a_1 \ne a_2$ in $A$ with $f(a_1) = f(a_2)$. Let $A'' = A \setminus \{a_2\}$, so $|A''| = n - 1$. Every value of $f$ is also a value of $f$ on $A''$: for $a \ne a_2$ the value $f(a)$ is taken at $a \in A''$, and $f(a_2) = f(a_1)$ is taken at $a_1 \in A''$. Since $f$ is surjective, every $b \in B$ equals $f(a'')$ for some $a'' \in A''$. Choose one such $a''$ for each $b$ and call it $g(b)$. This defines a function $g : B \to A''$ with $f(g(b)) = b$ for every $b \in B$. The function $g$ is injective: if $g(b) = g(b'')$, then $b = f(g(b)) = f(g(b'')) = b''$. But $|B| = n > n - 1 = |A''|$, so by the pigeonhole principle no function from $B$ to $A''$ is injective. This contradiction shows that $f$ is injective. In both directions the claim is proved, so $f$ is injective if and only if it is surjective. $\square$'
        constraints: 'connect (non-)injectivity to the counting inequality; sizes, small contexts and one full proof'
      - id: kp2
        name: "Basic applications"
        key_prerequisites: [functions-injective-surjective]
        step_check:
          step: 'there are $9$ pigeons and only $7$ holes'
          question: 'Why is it enough that there are more pigeons than holes?'
          options:
            - 'The extra pigeons are removed, and the rest fill every hole once'
            - 'Each hole can take only one pigeon, so the extra pigeons are lost'
            - 'The number of holes is always the average number of pigeons per hole'
            - 'Distinct pigeons cannot all go to distinct holes if holes are fewer'
          answer: 'Distinct pigeons cannot all go to distinct holes if holes are fewer'
          why: 'If distinct pigeons always went to distinct holes, the pigeons would be no more than the holes. With more pigeons than holes, some hole receives two pigeons.'
        exemplars:
          - problem: 'How many people must a group have to be certain that two of them were born in the same one of the $50$ U.S. states?'
            answer: '51'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Send each person to their birth state. The holes are the $50$ states. With $50$ people, each state could appear once, so $50$ people are not enough. With $51$ people, more people than states, two share a state. The answer is $51$.'
          - problem: 'What is the smallest number of integers that must be chosen to be certain that two of them leave the same remainder on division by $5$?'
            answer: '6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The possible remainders are $0, 1, 2, 3, 4$, so there are $5$ holes. Five integers can leave five different remainders, so $5$ are not enough. With $6$ integers, two share a remainder. The answer is $6$.'
          - problem: 'A class has $13$ students. Must two of them have been born in the same month?'
            answer: 'yes'
            answer_contract: {"kind": "label", "options": [["yes", "they must", "two must", "yes, they must", "certain"], ["no", "not necessarily", "they need not", "no, they need not", "not certain"]]}
            solution_sketch: 'Send each student to their birth month. There are $13$ students and only $12$ months. By the pigeonhole principle two students are sent to the same month, so the answer is yes.'
          - problem: 'Exam scores are whole numbers from $0$ to $100$. How many students must take the exam to be certain that two of them have the same score?'
            answer: '102'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The scores $0, 1, \dots, 100$ give $101$ holes. With $101$ students all scores could differ, so that is not enough. With $102$ students, two share a score. The answer is $102$.'
          - problem: 'How many numbers must be chosen from $1, 2, \dots, 20$ to be certain that two of them add up to $21$?'
            answer: '11'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Split the numbers into the $10$ pairs $\{1, 20\}, \{2, 19\}, \dots, \{10, 11\}$, each with sum $21$. Ten chosen numbers can take one from each pair and avoid a sum of $21$. With $11$ chosen numbers, two lie in the same pair, and they add up to $21$. The answer is $11$.'
          - problem: 'A drawer holds $10$ red socks and $10$ blue socks. How many socks must you take out in the dark to be certain of a matching pair?'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The holes are the two colours. With $2$ socks the colours may differ, so $2$ are not enough. With $3$ socks, more socks than colours, two have the same colour. The answer is $3$.'
          - problem: 'Sam says that if five numbers are chosen from $\{1, 2, \dots, 10\}$, two of them must add up to $11$, because the pairs $\{1, 10\}, \{2, 9\}, \{3, 8\}, \{4, 7\}, \{5, 6\}$ are the holes. What is the smallest number of chosen numbers that really guarantees two with sum $11$?'
            answer: '6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'There are $5$ pairs, and five chosen numbers can take one from each pair, for example $1, 2, 3, 4, 5$, with no sum of $11$. So Sam is wrong. With $6$ chosen numbers, two lie in the same pair, and their sum is $11$. The answer is $6$.'
          - problem: 'How many people must a group have to be certain that two of them share a birthday, if there are $366$ possible dates in a year?'
            answer: '367'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Send each person to their birthday. The holes are the $366$ dates. With $366$ people, all dates could differ, so that is not enough. With $367$ people, two share a birthday. The answer is $367$.'
          - problem: 'Write the full proof that in any group of $n \ge 2$ people, two of them have the same number of friends within the group. Friendship is mutual, and nobody is a friend of themselves.'
            answer: 'n >= 2 people: two have equal friends'
            answer_contract: {"kind": "none"}
            solution_sketch: 'Let the group have $n \ge 2$ people. Nobody is their own friend, so each person has between $0$ and $n - 1$ friends in the group. Thus the number of friends of a person is one of the $n$ values $0, 1, \dots, n - 1$. We show that the values $0$ and $n - 1$ cannot both occur. Suppose some person $P$ has $n - 1$ friends. Then $P$ is a friend of every other person, and since friendship is mutual, every other person has at least one friend, namely $P$. Also $P$ has $n - 1 \ge 1$ friends because $n \ge 2$. So nobody has $0$ friends. Hence, if someone has $n - 1$ friends, the numbers of friends lie in $\{1, 2, \dots, n - 1\}$. If nobody has $n - 1$ friends, they lie in $\{0, 1, \dots, n - 2\}$. In both cases at most $n - 1$ different values occur. Take the $n$ people as pigeons and these at most $n - 1$ values as holes, and assign each person their number of friends. There are more pigeons than holes, so by the pigeonhole principle two people are assigned the same value. That is, two people have the same number of friends. $\square$'
        constraints: 'identify pigeons and holes, then apply the principle; contexts with states, months, socks and numbers, and one full proof'
      - id: kp3
        name: "Generalized pigeonhole"
        key_prerequisites: [functions-injective-surjective]
        step_check:
          step: 'giving at most $7 \cdot 2 = 14$ integers total'
          question: 'Why does assuming that no box holds $3$ integers give at most $14$ integers in total?'
          options:
            - 'Each integer lies in two boxes, so the number of integers is doubled'
            - 'The total is the number of boxes plus the largest allowed box size'
            - 'Seven boxes of at most two integers each hold at most $14$ in all'
            - 'Each box holds exactly two integers, and the last box is left empty'
          answer: 'Seven boxes of at most two integers each hold at most $14$ in all'
          why: 'Each of the $7$ boxes holds at most $2$ integers, so together they hold at most $7 \cdot 2 = 14$. Since there are $20$ integers, some box must hold at least $3$.'
        exemplars:
          - problem: 'Each of $43$ integers is divided by $8$. What is the largest $k$ such that at least $k$ of the integers must leave the same remainder?'
            answer: '6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The $8$ possible remainders are the boxes. If every box held at most $5$ integers, there would be at most $8 \cdot 5 = 40$ integers, but there are $43$. So some box holds at least $6$. The ceiling of $43/8 = 5.375$ is $6$, so the answer is $6$.'
          - problem: 'A total of $58$ balls are placed in $12$ boxes. What is the largest number $m$ such that some box must contain at least $m$ balls?'
            answer: '5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'If every box held at most $4$ balls, the total would be at most $12 \cdot 4 = 48$, but there are $58$ balls. So some box holds at least $5$. The ceiling of $58/12$ is $5$, and a split with at most $5$ per box exists, so the answer is $5$.'
          - problem: 'What is the smallest number of integers you must choose to be certain that at least $4$ of them leave the same remainder on division by $5$?'
            answer: '16'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'There are $5$ remainder classes. If every class held at most $3$ chosen integers, there would be at most $15$ integers, and $15$ integers split as $3$ in each class do avoid $4$ in a class. With $16$ integers some class holds at least $4$. The answer is $16$.'
          - problem: 'Sam says that if $20$ balls are placed in $6$ boxes, some box must hold at least $6$ balls. What is the largest number $m$ such that some box surely holds at least $m$ balls?'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'If every box held at most $3$ balls, the total would be at most $6 \cdot 3 = 18$, but there are $20$ balls. So some box holds at least $4$. The ceiling of $20/6$ is $4$, and a split like $4, 4, 3, 3, 3, 3$ shows that $5$ is not forced, so Sam is wrong and the answer is $4$.'
          - problem: 'Each of $34$ students chooses one of $7$ project topics. Must some topic be chosen by at least $6$ students?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "it must", "yes, it must", "some topic must"], ["no", "it need not", "not necessarily", "no, it need not", "not certain"]]}
            solution_sketch: 'The guaranteed size is the ceiling of $34/7$, which is $5$. A split such as $5, 5, 5, 5, 5, 5, 4$ uses all $34$ students and has no topic with $6$. So a topic with $6$ students is not forced, and the answer is no.'
          - problem: 'What is the largest number of integers that can be chosen so that no two of them leave the same remainder on division by $9$?'
            answer: '9'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'There are $9$ possible remainders, $0$ to $8$. The integers $0, 1, \dots, 8$ have different remainders, so $9$ integers are possible. A tenth integer would repeat a remainder, by the pigeonhole principle. The largest number is $9$.'
          - problem: 'How many cards must be drawn from a standard deck of $52$ cards, with $4$ suits, to be certain that at least $3$ of them have the same suit?'
            answer: '9'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'If at most $2$ cards came from each suit, there would be at most $4 \cdot 2 = 8$ cards. So $8$ cards may avoid $3$ of one suit, and $9$ cards cannot. With $9$ cards some suit has at least $3$. The answer is $9$.'
          - problem: 'A company runs $7$ buses, and $130$ passengers are each in one bus. At least how many passengers ride in the fullest bus?'
            answer: '19'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'If every bus carried at most $18$ passengers, the total would be at most $7 \cdot 18 = 126$, but there are $130$ passengers. So some bus carries at least $19$. The ceiling of $130/7 \approx 18.57$ is $19$, so the answer is $19$.'
          - problem: 'Write the full proof that among any $5$ integers there are $3$ whose sum is divisible by $3$.'
            answer: '5 integers => 3 with sum divisible by 3'
            answer_contract: {"kind": "none"}
            solution_sketch: 'Call the residue of an integer its remainder $0$, $1$ or $2$ on division by $3$. Every one of the five integers has one of these three residues. There are two cases. Case 1: all three residues occur among the five integers. Choose one integer of each residue, say $3p$, $3q + 1$ and $3r + 2$ with $p, q, r$ integers. Their sum is $3p + 3q + 1 + 3r + 2 = 3(p + q + r + 1)$, which is divisible by $3$. Case 2: at most two residues occur. Then the five integers lie in at most two boxes, one box for each residue that occurs. If each box held at most $2$ integers, there would be at most $4$ integers, a contradiction. By the generalized pigeonhole principle some residue $r$ is shared by at least $\lceil 5/2 \rceil = 3$ of the integers. Choose three of them, $3p + r$, $3q + r$ and $3s + r$. Their sum is $3p + 3q + 3s + 3r = 3(p + q + s + r)$, which is divisible by $3$. In both cases some three of the five integers have a sum divisible by $3$. $\square$'
        constraints: 'use residues and boxes as the holes; generalized form $\lceil n/k \rceil$; one full proof with a case split'
    diagnostic_exemplar:
      problem: 'Prove: if $5$ points are placed in a $2 \times 2$ square, two of them are within distance $\sqrt{2}$.'
      answer: 'Split into four unit cells; two points share a cell of diameter $\sqrt 2$.'
      solution_sketch: 'Partition the square into four $1 \times 1$ cells. With $5$ points and $4$ cells, two points lie in the same unit cell; the largest distance within a unit square is its diagonal $\sqrt 2$, so those two are within $\sqrt 2$. $\square$'
