      - front: 'An equivalence relation is a relation that is...'
        back: 'reflexive, symmetric, and transitive.'
        type: basic
      - front: 'Congruence modulo $n$ as a relation?'
        back: '$a \equiv b \pmod{n}$ iff $n \mid (a - b)$; it is an equivalence relation on $\mathbb{Z}$.'
        type: basic

  - id: computing-equivalence-classes
    name: "Computing Equivalence Classes"
    core: true
