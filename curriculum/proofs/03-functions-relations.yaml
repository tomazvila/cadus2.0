        key_prerequisites: [hasse-diagrams]
        exemplars:
          - problem: "In the poset of positive divisors of 18 under divisibility, find the minimum element and the maximum element."
            answer: "min = 1; max = 18"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "min"}, {"contract": {"kind": "exact"}, "name": "max"}]}
            solution_sketch: "List the positive divisors of 18: 1, 2, 3, 6, 9, 18. Step 1 (definition of minimum): 1 divides every element of the poset, so 1 is below everything and is the minimum. Step 2 (definition of maximum): every element divides 18, so 18 is above everything and is the maximum. The answer is min = 1; max = 18."
          - problem: "In the poset {2, 3, 6, 12} under divisibility, find the two minimal elements; give the smaller one first and the larger one second."
            answer: "small = 2; large = 3"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "small"}, {"contract": {"kind": "exact"}, "name": "large"}]}
            solution_sketch: "The elements are 2, 3, 6, 12. Step 1: nothing in the set divides 2 except 2, so 2 is minimal. Step 2: nothing in the set divides 3 except 3, so 3 is minimal. Step 3: 6 and 12 are above 2 or 3, so they are not minimal. The answer is small = 2; large = 3."
          - problem: "In the poset {2, 5, 10, 20} under divisibility, how many elements are maximal?"
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The elements are 2, 5, 10, 20. Step 1: 2 divides 10 and 20, so 2 is not maximal. Step 2: 5 divides 10 and 20, so 5 is not maximal. Step 3: 10 divides 20, so 10 is not maximal. Step 4: 20 has no element above it, so 20 is the only maximal element. The answer is 1."
          - problem: "In the poset {2, 3, 6, 12} under divisibility, state whether a minimum element exists and give the number of minimal elements."
            answer: "minimum = absent; count = 2"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["present"], ["absent"]]}, "name": "minimum"}, {"contract": {"kind": "exact"}, "name": "count"}]}
            solution_sketch: "The elements are 2, 3, 6, 12. Step 1: 2 and 3 are minimal because nothing below them is in the set. Step 2: no element divides both 2 and 3, so no minimum exists. The option present is wrong because it assumes a common lower bound. Step 3: the minimal elements are 2 and 3, so their number is 2. The answer is minimum = absent; count = 2."
          - problem: "In the poset {2, 3, 4, 8, 24} under divisibility, find the maximum element and the number of minimal elements."
            answer: "max = 24; count = 2"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "max"}, {"contract": {"kind": "exact"}, "name": "count"}]}
            solution_sketch: "The elements are 2, 3, 4, 8, 24. Step 1: 2 and 3 are minimal because nothing below them is in the set. Step 2: 4 and 8 are above 2, so they are not minimal; thus the minimal count is 2. Step 3: every element divides 24, so 24 is the maximum. The answer is max = 24; count = 2."
          - problem: "In the poset {2, 3, 5, 10, 30} under divisibility, determine which extremal elements exist. Select the correct description."
            answer: "maximum-only"
            answer_contract: {"kind": "label", "options": [["both-extremes"], ["minimum-only"], ["maximum-only"], ["neither-extreme"]]}
            solution_sketch: "The elements are 2, 3, 5, 10, 30. Step 1: 2, 3, and 5 have nothing below them, so there is no minimum because no element divides all three. Step 2: every element divides 30, so 30 is a maximum. Step 3: the option both-extremes is wrong because no minimum exists. Step 4: the option minimum-only is wrong because a maximum does exist. Step 5: the option neither-extreme is wrong because a maximum does exist. The answer is maximum-only."
        constraints: "small divisibility posets; distinguish minimal (nothing below) from minimum (below everything)"
      - id: kp2
        name: "Upper and lower bounds"
        key_prerequisites: [partial-orders]
        exemplars:
          - problem: "In P({a, b, c, d}) under the subset ordering, consider the two-element subset {{a}, {c}}. Find how many upper bounds it has, and how many elements its least upper bound has."
            answer: "count = 4; size = 2"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "count"}, {"contract": {"kind": "exact"}, "name": "size"}]}
            solution_sketch: "The poset is P({a, b, c, d}) under subset, and the subset is {{a}, {c}}. Step 1 uses the definition of upper bound: an upper bound must contain both {a} and {c}, so it is a superset of {a, c}; these are {a, c}, {a, b, c}, {a, c, d}, and {a, b, c, d}, giving 4 upper bounds. Step 2 uses the definition of least upper bound: the least upper bound is the union {a, c}, the intersection of all upper bounds, which has 2 elements. The answer is count = 4; size = 2."
          - problem: "In the poset of divisors of 12 ordered by divisibility, consider the two-element subset {4, 6}. Find its greatest lower bound."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The poset is the divisors of 12 under divisibility, and the subset is {4, 6}. Step 1 uses the definition of lower bound: a lower bound must divide both 4 and 6. The common divisors are 1 and 2. Step 2 uses the definition of greatest lower bound: among 1 and 2, the greatest is 2. The greatest lower bound is 2."
          - problem: "Order the divisors of 18 by divisibility. For the two-element subset {6, 9}, determine its least upper bound."
            answer: "18"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The poset is the divisors of 18 under divisibility, and the subset is {6, 9}. Step 1 uses the definition of upper bound: an upper bound must be a multiple of both 6 and 9 and must divide 18. The least common multiple is 18, and 18 divides 18. Step 2 uses the definition of least upper bound: the only upper bound is 18. The least upper bound is 18."
          - problem: "Consider the divisibility poset on the divisors of 24. What is the greatest lower bound of the two-element subset {8, 12}?"
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The poset is the divisors of 24 under divisibility, and the subset is {8, 12}. Step 1 uses the definition of lower bound: a lower bound must divide both 8 and 12. The common divisors are 1, 2, and 4. Step 2 uses the definition of greatest lower bound: the greatest common divisor is 4. The greatest lower bound is 4."
          - problem: "Let D be the divisors of 20 under divisibility. Find the least upper bound of the two-element subset {4, 10}."
            answer: "20"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The poset is the divisors of 20 under divisibility, and the subset is {4, 10}. Step 1 uses the definition of upper bound: an upper bound must be a multiple of both 4 and 10 and must divide 20. The least common multiple is 20, and 20 divides 20. Step 2 uses the definition of least upper bound: the only upper bound is 20. The least upper bound is 20."
          - problem: "In the divisibility poset on the divisors of 36, Find the greatest lower bound of the two-element subset {12, 18}."
            answer: "6"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The poset is the divisors of 36 under divisibility, and the subset is {12, 18}. Step 1 uses the definition of lower bound: a lower bound must divide both 12 and 18. The common divisors are 1, 2, 3, and 6. Step 2 uses the definition of greatest lower bound: the greatest common divisor is 6. The greatest lower bound is 6."
        constraints: "bounds of two-element subsets; lub/glb are union/intersection or lcm/gcd"
