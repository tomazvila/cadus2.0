  - id: computing-equivalence-classes
    name: "Computing Equivalence Classes"
    core: true
    difficulty: 0.60
    drill: false
    answer_kind: numeric
    expected_time_secs: 140
    prerequisites:
      - id: relations-equivalence
        weight: 0.6
        key: true
    knowledge_points:
      - id: kp1
        name: "Classes modulo n"
        key_prerequisites: [relations-equivalence]
        exemplars:
          - problem: "For congruence modulo 4 on the integers, find the smallest nonnegative representative of [-7]."
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The class [-7] contains every integer congruent to -7 modulo 4. Divide -7 by 4: -7 = -2*4 + 1, so the remainder is 1. Therefore the smallest nonnegative representative is 1."
          - problem: "For congruence modulo 5, which of the following integers is in the same class as -3? Select one."
            answer: "2"
            answer_contract: {"kind": "label", "options": [["2"], ["0"], ["4"], ["5"]]}
            solution_sketch: "Compute -3 modulo 5: add 5 to get 2, so the class is [2]. Check option 2: 2 mod 5 is 2, so 2 is in the same class. Option 0 is wrong because 0 mod 5 is 0, not 2. Option 4 is wrong because 4 mod 5 is 4, not 2. Option 5 is wrong because 5 mod 5 is 0, not 2. The correct option is 2."
          - problem: "For congruence modulo 6, find the smallest nonnegative representative of [29]."
            answer: "5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Reduce 29 modulo 6. Since 29 = 4*6 + 5, the remainder is 5. The smallest nonnegative representative of [29] is 5."
          - problem: "For congruence modulo 8 on the integers, determine the number of distinct equivalence classes."
            answer: "8"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The equivalence classes modulo 8 are determined by the remainders after division by 8. The possible remainders are 0 through 7. That gives 8 distinct classes. The number of distinct classes is 8."
          - problem: "For congruence modulo 7, which of the following integers is in the same class as 3? Select one."
            answer: "24"
            answer_contract: {"kind": "label", "options": [["24"], ["22"], ["16"], ["11"]]}
            solution_sketch: "Compute the class of 3 modulo 7: 3 mod 7 is 3, so look for a number congruent to 3. Check 24: 24 = 3*7 + 3, so 24 mod 7 is 3. Option 22 is wrong because 22 mod 7 is 1. Option 16 is wrong because 16 mod 7 is 2. Option 11 is wrong because 11 mod 7 is 4. The correct option is 24."
          - problem: "For congruence modulo 9, find the smallest nonnegative representative of [-25]."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Reduce -25 modulo 9 by adding multiples of 9. Since -25 + 27 = 2, and 27 is a multiple of 9, -25 is congruent to 2 mod 9. The remainder 2 is already between 0 and 8. The smallest nonnegative representative is 2."
        constraints: "residue classes mod $n \\le 10$; representatives and class equality"
      - id: kp2
        name: "Classes on finite sets"
        key_prerequisites: [relations-equivalence]
        exemplars:
          - problem: "On the set {1, 2, 3, 4, 5}, let a ~ b exactly when a and b have the same parity. Give the class of 1 and the class of 2 as sets."
            answer: "class1 = {1, 3, 5}; class2 = {2, 4}"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "set"}, "name": "class1"}, {"contract": {"kind": "set"}, "name": "class2"}]}
            solution_sketch: "Step 1: the relation same parity is reflexive, symmetric and transitive, so its classes partition the set. Step 2: by symmetry 1 relates to 3 and 5, so the class of 1 is class1 = {1, 3, 5}. Step 3: 2 relates to 4, so the class of 2 is class2 = {2, 4}. The full partition is class1 = {1, 3, 5}; class2 = {2, 4}."
          - problem: "On {1, 2, ..., 9}, let a ~ b exactly when a and b leave the same remainder on division by 3. Give the class of 7, the class of 2 and the class of 3 as sets."
            answer: "c7 = {1, 4, 7}; c2 = {2, 5, 8}; c3 = {3, 6, 9}"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "set"}, "name": "c7"}, {"contract": {"kind": "set"}, "name": "c2"}, {"contract": {"kind": "set"}, "name": "c3"}]}
            solution_sketch: "Step 1: compute the remainder of each element mod 3: 1, 4, 7 give 1; 2, 5, 8 give 2; 3, 6, 9 give 0. Step 2: elements with the same remainder are related, so each remainder group is exactly one class. The full partition is c7 = {1, 4, 7}; c2 = {2, 5, 8}; c3 = {3, 6, 9}."
          - problem: "On {1, 2, 3, 4, 5, 6}, define a ~ b when a = b or a + b = 7. How many equivalence classes does this relation have?"
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: reflexivity puts every element in its own class; symmetry joins a and b exactly when a + b = 7. Step 2: so 1 joins 6, 2 joins 5 and 3 joins 4, giving classes {1, 6}, {2, 5}, {3, 4}. Step 3: transitivity adds nothing new since no chain joins two of these pairs. The relation has 3 equivalence classes."
          - problem: "On {1, 2, ..., 8}, let a ~ b exactly when a and b leave the same remainder on division by 4. Find the size of the equivalence class of 5."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: division by 4 leaves remainder 1 for 1 and for 5, and these are the only elements of the set with remainder 1. Step 2: so the class of 5 is {1, 5}; the other elements 2, 6, 3, 7, 4, 8 have remainders 2, 2, 3, 3, 0, 0 and do not join it. The class of 5 has size 2."
          - problem: "The set {3, 6, 9, 12, 15, 18} carries the relation a ~ b exactly when a and b leave the same remainder on division by 5. How many equivalence classes are there?"
            answer: "5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: compute the remainders mod 5 of 3, 6, 9, 12, 15, 18: they are 3, 1, 4, 2, 0, 3 respectively. Step 2: grouping equal remainders gives the classes {3, 18}, {6}, {9}, {12}, {15}. The relation has 5 equivalence classes."
          - problem: "On {1, 2, 3, 4, 5, 6, 7, 8, 9}, let a ~ b exactly when a = b or a + b = 10. Give the equivalence class of 5 as a set."
            answer: "{5}"
            answer_contract: {"kind": "set"}
            solution_sketch: "Step 1: the condition a = b or a + b = 10 is reflexive by the first clause and symmetric, so it can define classes. Step 2: the element 5 pairs with itself since 5 + 5 = 10, and no other element x of the set satisfies 5 + x = 10. Step 3: so no element is joined to 5 except 5 itself. The equivalence class of 5 is the singleton set {5}."
        constraints: "list all classes of a concrete relation on a set of size at most 9"
      - id: kp3
        name: "Classes for rule-defined relations"
        key_prerequisites: [relations-equivalence]
        exemplars:
          - problem: "On $\\mathbb{Z}$ with $a \\sim b \\iff |a| = |b|$, the class of $6$ is $[6] = \\{x : x \\sim 6\\}$. Give the elements of $[6]$ in increasing order, separated by commas."
            answer: "-6, 6"
            answer_contract: {"kind": "list", "member": {"kind": "exact"}, "ordered": true}
            solution_sketch: "Definition of the class: $[6] = \\{x : x \\sim 6\\} = \\{x : |x| = 6\\}$. Solving the defining equation $|x| = 6$ gives $x = 6$ and $x = -6$, so the class has two elements. Listed in increasing order, the answer is -6, 6."
          - problem: "On $\\mathbb{R}$ with $x \\sim y \\iff x - y \\in \\mathbb{Z}$, the class of $a$ is $[a] = \\{x : x \\sim a\\}$. Give the unique element of $\\left[\\tfrac{9}{4}\\right]$ that lies in the interval $[0, 1)$, as a fraction."
            answer: "1/4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Definition of the class: $x \\sim 9/4$ iff $x - 9/4$ is an integer, so $[9/4] = \\{9/4 + k : k \\in \\mathbb{Z}\\}$. Its elements are $\\dots, -3/4, 1/4, 5/4, 9/4, \\dots$ and exactly one of them, $1/4$, lies in $[0, 1)$. The unique element of the class in $[0, 1)$ is 1/4."
          - problem: "On R, define x~y exactly when x^2=y^2. Determine the entire equivalence class of -3, as a set."
            answer: "{-3, 3}"
            answer_contract: {"kind": "set"}
            solution_sketch: "Substitute the chosen representative into the defining invariant, then solve the resulting equation for every element in the stated domain. Its full solution set is {-3, 3}."
          - problem: "On Z, define x~y exactly when x(x-1)=y(y-1). Determine the entire equivalence class of 4, as a set."
            answer: "{-3, 4}"
            answer_contract: {"kind": "set"}
            solution_sketch: "Substitute the chosen representative into the defining invariant, then solve the resulting equation for every element in the stated domain. Its full solution set is {-3, 4}."
          - problem: "On R, define x~y exactly when x^3-3x=y^3-3y. Determine the entire equivalence class of 2, as a set."
            answer: "{-1, 2}"
            answer_contract: {"kind": "set"}
            solution_sketch: "Substitute the chosen representative into the defining invariant, then solve the resulting equation for every element in the stated domain. Its full solution set is {-1, 2}."
          - problem: "On the positive real numbers define x~y exactly when x+1/x=y+1/y. Determine the entire equivalence class of 3, as a set."
            answer: "{1/3, 3}"
            answer_contract: {"kind": "set"}
            solution_sketch: "Equating the defining invariant to its value at 3 gives a quadratic after multiplying by the positive variable. Its positive roots are 1/3 and 3, so these form the whole class."
        constraints: "describe $[a] = \\{x : x \\sim a\\}$ for a rule-defined relation"
    diagnostic_exemplar:
      problem: 'On $\mathbb{Z}$ with $a \sim b \iff a - b$ even, describe $[7]$.'
      answer_contract: {kind: none}
      answer: 'The odd integers.'
      solution_sketch: '$n \sim 7$ iff $n - 7$ is even iff $n$ is odd.'
    anki_seeds:
      - front: '$[a]$ for congruence mod $n$?'
        back: '$\{a + kn : k \in \mathbb{Z}\}$.'
        type: basic
      - front: 'How many equivalence classes does congruence mod $n$ have?'
        back: '$n$ — one per remainder $0, 1, \dots, n-1$.'
        type: basic

