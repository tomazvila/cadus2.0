        back: '$\{(a, c) : \exists b,\ (a, b) \in R \text{ and } (b, c) \in S\}$ — apply $R$ first.'
        type: basic
      - front: 'Composition criterion for transitivity?'
        back: '$R$ is transitive iff $R \circ R \subseteq R$.'
