unit: functions-relations
course: proofs
module: "Functions & Relations"
topics:
  - id: functions-formal-definition
    name: "Functions: Formal Definition"
    core: true
    difficulty: 0.55
    drill: false
    answer_kind: proof
    expected_time_secs: 200
    prerequisites:
      - id: cartesian-products
        weight: 0.5
        key: true
      - id: set-notation
        weight: 0.3
      - id: quantifiers
        weight: 0.3
      - id: function-notation
        weight: 0.0
    knowledge_points:
      - id: kp1
        name: "Function as a special relation"
        key_prerequisites: [cartesian-products]
        exemplars:
          - problem: 'Explain why $R = \{(1, a), (2, b), (1, c)\}$ is not a function from $\{1, 2\}$ to $\{a, b, c\}$.'
            answer: 'The input $1$ is paired with both $a$ and $c$, violating uniqueness.'
            solution_sketch: 'A function assigns each domain element exactly one output. Here $(1, a)$ and $(1, c)$ give $1$ two images, so the uniqueness requirement fails. $\square$'
          - problem: 'Is $R = \{(1, a), (2, a), (3, b)\}$ a function from $\{1, 2, 3\}$ to $\{a, b\}$?'
            answer: 'Yes; each input has exactly one output (outputs may repeat).'
            solution_sketch: 'Each of $1, 2, 3$ appears as a first coordinate exactly once, so existence and uniqueness hold. Distinct inputs sharing an output ($1, 2 \mapsto a$) is allowed. $\square$'
        constraints: "check the existence-and-uniqueness condition on a listed relation"
      - id: kp2
        name: "Well-defined functions"
        key_prerequisites: [quantifiers]
        exemplars:
          - problem: 'Prove that the rule $f : \mathbb{Z} \to \mathbb{Z}$, $f(n) = 2n + 1$, is a well-defined function.'
            answer: 'Each input yields exactly one integer output.'
            solution_sketch: 'For each $n \in \mathbb{Z}$, the value $2n + 1$ is a uniquely determined integer, so every input has exactly one output in the codomain. Hence $f$ is a well-defined function. $\square$'
          - problem: 'Explain why $g(x) = 1/x$ is not a well-defined function $\mathbb{R} \to \mathbb{R}$.'
            answer: 'It has no value at $x = 0$, so not every input has an output.'
            solution_sketch: 'A function $\mathbb{R} \to \mathbb{R}$ must assign an output to every real, but $g(0) = 1/0$ is undefined; so $g$ is not a function on all of $\mathbb{R}$ (it is on $\mathbb{R} \setminus \{0\}$). $\square$'
        constraints: "verify each input has exactly one output in the stated codomain"
      - id: kp3
        name: "Equality of functions"
        key_prerequisites: [quantifiers]
        exemplars:
          - problem: 'Let $f, g : \mathbb{R} \to \mathbb{R}$ with $f(x) = (x + 1)^2$ and $g(x) = x^2 + 2x + 1$. Prove $f = g$.'
            answer: 'Same domain and codomain, and $f(x) = g(x)$ for all $x$.'
            solution_sketch: 'They share domain and codomain $\mathbb{R}$. For every $x$, $(x + 1)^2 = x^2 + 2x + 1 = g(x)$. Since they agree on every input, $f = g$. $\square$'
          - problem: 'Do $f(x) = x$ on $\mathbb{R}$ and $g(x) = x$ on $\mathbb{Z}$ define the same function?'
            answer: 'No; they have different domains.'
            solution_sketch: 'Function equality requires the same domain. Here the domains $\mathbb{R}$ and $\mathbb{Z}$ differ, so $f \ne g$ even though the rule matches. $\square$'
        constraints: "compare domain, codomain, and outputs pointwise"
    diagnostic_exemplar:
      problem: 'Is $\{(x, y) \in \mathbb{R}^2 : y^2 = x\}$ a function $\mathbb{R} \to \mathbb{R}$? And do $f(x) = x^2$ on $\mathbb{R}$ and $g(x) = x^2$ on $[0, \infty)$ define the same function? Justify both answers.'
      answer: 'The relation is not a function $\mathbb{R} \to \mathbb{R}$, on two counts: uniqueness fails, since $x = 4$ is paired with both $y = 2$ and $y = -2$; and totality fails, since no real $y$ has $y^2 = -1$, so $x = -1$ gets no image. And $f \ne g$: two functions are equal only when they have the same domain, the same codomain and the same values, and here the domains differ ($\mathbb{R}$ versus $[0,\infty)$) even though the rule is identical.'
      solution_sketch: 'A function assigns exactly one output to every input of its domain; then recall that a function is its domain, codomain and rule taken together.'
    anki_seeds:
      - front: 'Formal definition of a function $f : A \to B$?'
        back: 'A subset $f \subseteq A \times B$ such that each $a \in A$ is the first coordinate of exactly one pair $(a, b) \in f$.'
        type: basic
      - front: 'When are two functions equal?'
        back: 'Same domain, same codomain, and $f(x) = g(x)$ for every $x$ in the domain.'
        type: basic

  - id: floor-ceiling-functions
    name: "Floor and Ceiling Functions"
    core: true
    difficulty: 0.50
    drill: false
    answer_kind: multi-step
    expected_time_secs: 100
    prerequisites:
      - id: functions-formal-definition
        weight: 0.5
        key: true
      - id: function-notation
        weight: 0.2
    knowledge_points:
      - id: kp1
        name: "Evaluating floor and ceiling"
        key_prerequisites: [function-notation]
        exemplars:
          - problem: 'Compute $\lfloor 3.7 \rfloor$, $\lceil 3.2 \rceil$, $\lfloor -1.5 \rfloor$, and $\lceil -2.3 \rceil$.'
            answer: '$3$, $4$, $-2$, $-2$.'
            solution_sketch: 'Floor rounds down, ceiling rounds up: $\lfloor -1.5 \rfloor = -2$ since $-2 \le -1.5 < -1$, and $\lceil -2.3 \rceil = -2$ since $-3 < -2.3 \le -2$.'
          - problem: 'Compute $\lfloor 5 \rfloor$, $\lceil 5 \rceil$, and $\lfloor -0.5 \rfloor$.'
            answer: '$5$, $5$, $-1$.'
            solution_sketch: 'On integers, floor and ceiling both return the integer itself; $-1 \le -0.5 < 0$ gives floor $-1$.'
        constraints: "evaluate at positives, negatives, and integers; negatives are the trap"
      - id: kp2
        name: "Basic identities"
        key_prerequisites: [functions-formal-definition]
        exemplars:
          - problem: 'Verify $\lceil x \rceil = -\lfloor -x \rfloor$ at $x = 2.4$.'
            answer: 'Both sides equal $3$.'
            solution_sketch: '$\lceil 2.4 \rceil = 3$; and $-\lfloor -2.4 \rfloor = -(-3) = 3$.'
          - problem: 'Verify $\lfloor x + n \rfloor = \lfloor x \rfloor + n$ for $x = 1.5$, $n = 3$.'
            answer: 'Both sides equal $4$.'
            solution_sketch: '$\lfloor 4.5 \rfloor = 4$ and $\lfloor 1.5 \rfloor + 3 = 1 + 3 = 4$; integer shifts pass through the floor.'
        constraints: "verify a floor/ceiling identity at a concrete value"
      - id: kp3
        name: "Solving with floors and ceilings"
        key_prerequisites: [functions-formal-definition]
        exemplars:
          - problem: 'Describe all real $x$ with $\lfloor x \rfloor = 4$.'
            answer: '$4 \le x < 5$, i.e. $x \in [4, 5)$.'
            solution_sketch: 'Floor equals $4$ exactly when $x$ lies in the half-open interval from $4$ up to but not including $5$.'
          - problem: 'Describe all real $x$ with $\lceil x \rceil = -1$.'
            answer: '$-2 < x \le -1$, i.e. $x \in (-2, -1]$.'
            solution_sketch: 'Ceiling equals $-1$ exactly when $x$ is at most $-1$ but greater than $-2$.'
        constraints: "solution sets of $\\lfloor x \\rfloor = n$ or $\\lceil x \\rceil = n$ as intervals"
    diagnostic_exemplar:
      problem: 'Compute $\lfloor -2.4 \rfloor + \lceil 1.2 \rceil$, and describe all real $x$ with $\lceil x \rceil = 3$.'
      answer: '$\lfloor -2.4 \rfloor = -3$ (the greatest integer not exceeding $-2.4$) and $\lceil 1.2 \rceil = 2$, so the sum is $-1$. And $\lceil x \rceil = 3$ exactly when $2 < x \le 3$, i.e. $x \in (2, 3]$: the least integer at or above $x$ equals $3$ precisely for those $x$.'
      solution_sketch: 'Round down for the floor (careful with negatives) and up for the ceiling; then read the ceiling condition as a half-open interval.'
    anki_seeds:
      - front: 'Definition of $\lfloor x \rfloor$?'
        back: 'The greatest integer $\le x$ (so $\lfloor x \rfloor \le x < \lfloor x \rfloor + 1$).'
        type: basic
      - front: 'Definition of $\lceil x \rceil$?'
        back: 'The least integer $\ge x$.'
        type: basic

  - id: computing-compositions
    name: "Computing Compositions"
    core: true
    difficulty: 0.55
    drill: false
    answer_kind: multi-step
    expected_time_secs: 110
    prerequisites:
      - id: functions-formal-definition
        weight: 0.5
        key: true
      - id: function-composition
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: "Composing formulas"
        key_prerequisites: [function-composition]
        exemplars:
          - problem: 'For $f(x) = x^2 + 1$ and $g(x) = 3x$ on $\mathbb{R}$, find $(f \circ g)(x)$ and $(g \circ f)(x)$.'
            answer: '$(f \circ g)(x) = 9x^2 + 1$ and $(g \circ f)(x) = 3x^2 + 3$.'
            solution_sketch: '$f(g(x)) = (3x)^2 + 1 = 9x^2 + 1$; $g(f(x)) = 3(x^2 + 1) = 3x^2 + 3$.'
          - problem: 'For $f(x) = 2x - 1$ and $g(x) = x + 4$, compute $(f \circ g)(2)$ and $(g \circ f)(2)$.'
            answer: '$11$ and $7$.'
            solution_sketch: '$f(g(2)) = f(6) = 11$; $g(f(2)) = g(3) = 7$.'
        constraints: "compose two given formulas in both orders; symbolic or at a point"
      - id: kp2
        name: "Composing on finite sets"
        key_prerequisites: [functions-formal-definition]
        exemplars:
          - problem: 'On $A = \{1, 2, 3\}$ let $f : 1 \mapsto 2, 2 \mapsto 3, 3 \mapsto 1$ and $g : 1 \mapsto 1, 2 \mapsto 3, 3 \mapsto 2$. Tabulate $g \circ f$.'
            answer: '$1 \mapsto 3$, $2 \mapsto 2$, $3 \mapsto 1$.'
            solution_sketch: 'Apply $f$ first: $(g \circ f)(1) = g(2) = 3$, $(g \circ f)(2) = g(3) = 2$, $(g \circ f)(3) = g(1) = 1$.'
          - problem: 'With $f$ as above ($1 \mapsto 2, 2 \mapsto 3, 3 \mapsto 1$), tabulate $f \circ f$.'
            answer: '$1 \mapsto 3$, $2 \mapsto 1$, $3 \mapsto 2$.'
            solution_sketch: 'Follow each element two steps around the cycle.'
        constraints: "functions given by tables or arrow diagrams on a 3-4 element set"
      - id: kp3
        name: "Domains and order of composition"
        key_prerequisites: [functions-formal-definition]
        exemplars:
          - problem: 'For $f(x) = \sqrt{x}$ (domain $[0, \infty)$) and $g(x) = x - 2$ on $\mathbb{R}$, what is the natural domain of $f \circ g$?'
            answer: '$[2, \infty)$'
            solution_sketch: '$f(g(x)) = \sqrt{x - 2}$ needs $g(x) = x - 2 \ge 0$, i.e. $x \ge 2$.'
          - problem: 'Show by evaluation that $f \circ g \ne g \circ f$ for $f(x) = x^2$ and $g(x) = x + 1$.'
            answer: '$(f \circ g)(1) = 4$ but $(g \circ f)(1) = 2$.'
            solution_sketch: '$f(g(1)) = f(2) = 4$ while $g(f(1)) = g(1) = 2$; one differing input suffices.'
        constraints: "track the domain of the composite; show noncommutativity by one evaluation"
    diagnostic_exemplar:
      problem: 'For $f(x) = x + 3$ and $g(x) = x^2$, compute $(g \circ f)(1)$ and $(f \circ g)(1)$.'
      answer: '$16$ and $4$.'
      solution_sketch: '$g(f(1)) = g(4) = 16$; $f(g(1)) = f(1) = 4$.'
    anki_seeds:
      - front: 'Is function composition commutative?'
        back: 'No in general: $f \circ g \ne g \circ f$ (e.g. $x^2$ and $x + 1$).'
        type: basic
      - front: 'Natural domain of $g \circ f$?'
        back: 'All $x$ in the domain of $f$ with $f(x)$ in the domain of $g$.'
        type: basic

  - id: proving-injectivity
    name: "Proving Injectivity"
    core: true
    difficulty: 0.57
    drill: false
    answer_kind: proof
    expected_time_secs: 170
    prerequisites:
      - id: functions-formal-definition
        weight: 0.6
        key: true
      - id: direct-proof
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: "The injectivity template"
        key_prerequisites: [functions-formal-definition]
        exemplars:
          - problem: 'Prove $f : \mathbb{R} \to \mathbb{R}$, $f(x) = 5x - 7$, is injective.'
            answer: 'Assume $f(a) = f(b)$; solve to get $a = b$.'
            solution_sketch: 'Suppose $f(a) = f(b)$: $5a - 7 = 5b - 7$, so $5a = 5b$ and $a = b$. Hence $f$ is injective. $\square$'
          - problem: 'Prove $f : \mathbb{Z} \to \mathbb{Z}$, $f(n) = n + 3$, is injective.'
            answer: '$a + 3 = b + 3 \Rightarrow a = b$.'
            solution_sketch: 'Suppose $f(a) = f(b)$: $a + 3 = b + 3$; subtracting $3$ gives $a = b$. $\square$'
        constraints: "affine maps; the standard assume-$f(a)=f(b)$-derive-$a=b$ template"
      - id: kp2
        name: "Nonlinear examples"
        key_prerequisites: [direct-proof]
        exemplars:
          - problem: 'Prove $f : \mathbb{R} \to \mathbb{R}$, $f(x) = x^3 + 2$, is injective.'
            answer: '$a^3 + 2 = b^3 + 2 \Rightarrow a^3 = b^3 \Rightarrow a = b$.'
            solution_sketch: 'Suppose $f(a) = f(b)$: $a^3 = b^3$. Real cube roots are unique, so $a = b$. $\square$'
          - problem: 'Prove $f : \mathbb{R} \setminus \{0\} \to \mathbb{R}$, $f(x) = 1/x$, is injective.'
            answer: '$1/a = 1/b \Rightarrow a = b$ by cross-multiplying.'
            solution_sketch: 'Suppose $1/a = 1/b$ with $a, b \ne 0$. Multiplying both sides by $ab$ gives $b = a$. $\square$'
        constraints: "one algebraic step beyond affine: cubes, reciprocals, or a ratio"
      - id: kp3
        name: "The domain matters"
        key_prerequisites: [functions-formal-definition]
        exemplars:
          - problem: 'Prove $f : [0, \infty) \to \mathbb{R}$, $f(x) = x^2$, is injective.'
            answer: '$a^2 = b^2$ with $a, b \ge 0$ forces $a = b$.'
            solution_sketch: 'Suppose $a^2 = b^2$: then $(a-b)(a+b) = 0$. If $a + b = 0$ with $a, b \ge 0$ then $a = b = 0$; otherwise $a = b$. Either way $a = b$. $\square$'
          - problem: 'Prove $f : (-1, \infty) \to \mathbb{R}$, $f(x) = \dfrac{x}{x+1}$, is injective.'
            answer: 'Cross-multiply $a(b+1) = b(a+1)$ to get $a = b$.'
            solution_sketch: 'Suppose $\tfrac{a}{a+1} = \tfrac{b}{b+1}$ (denominators nonzero on the domain). Cross-multiplying: $ab + a = ab + b$, so $a = b$. $\square$'
        constraints: "restricted domains where injectivity holds though it fails on all of $\\mathbb{R}$"
    diagnostic_exemplar:
      problem: 'Prove that $f : [0, \infty) \to \mathbb{R}$, $f(x) = x^2 + 3$, is injective, and explain why the same rule on $\mathbb{R}$ is not.'
      answer: 'Suppose $f(a) = f(b)$ with $a, b \ge 0$. Then $a^2 + 3 = b^2 + 3$, so $a^2 = b^2$ and $(a-b)(a+b) = 0$. Either $a = b$, or $a + b = 0$ which with $a, b \ge 0$ forces $a = b = 0$; in both cases $a = b$, so $f$ is injective. On $\mathbb{R}$ the same rule is not injective: $f(-1) = 4 = f(1)$ while $-1 \ne 1$. The domain, not the formula, decides.'
      solution_sketch: 'Assume equal outputs, factor $a^2 - b^2$, and use nonnegativity to kill the $a + b$ branch; then give the counterexample the larger domain allows.'
    anki_seeds:
      - front: 'Contrapositive form of injectivity?'
        back: '$a \ne b \Rightarrow f(a) \ne f(b)$ — distinct inputs give distinct outputs.'
        type: basic
      - front: 'Why are strictly increasing functions injective?'
        back: '$a < b \Rightarrow f(a) < f(b)$, so distinct inputs give distinct outputs.'
        type: basic

  - id: proving-surjectivity
    name: "Proving Surjectivity"
    core: true
    difficulty: 0.58
    drill: false
    answer_kind: proof
    expected_time_secs: 170
    prerequisites:
      - id: functions-formal-definition
        weight: 0.6
        key: true
      - id: quantifiers
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: "The preimage-finding template"
        key_prerequisites: [functions-formal-definition]
        exemplars:
          - problem: 'Prove $f : \mathbb{R} \to \mathbb{R}$, $f(x) = 5x - 7$, is surjective.'
            answer: 'Given $y$, take $x = (y + 7)/5$; then $f(x) = y$.'
            solution_sketch: 'Let $y \in \mathbb{R}$ and set $x = (y+7)/5 \in \mathbb{R}$. Then $f(x) = 5 \cdot \tfrac{y+7}{5} - 7 = y$. $\square$'
          - problem: 'Prove $f : \mathbb{Z} \to \mathbb{Z}$, $f(n) = n + 3$, is surjective.'
            answer: 'Given $m$, take $n = m - 3$.'
            solution_sketch: 'Let $m \in \mathbb{Z}$; then $n = m - 3 \in \mathbb{Z}$ and $f(n) = (m - 3) + 3 = m$. $\square$'
        constraints: "affine maps; solve $f(x) = y$ for $x$ and verify"
      - id: kp2
        name: "Nonlinear examples"
        key_prerequisites: [functions-formal-definition]
        exemplars:
          - problem: 'Prove $f : \mathbb{R} \to \mathbb{R}$, $f(x) = x^3 + 2$, is surjective.'
            answer: 'Given $y$, take $x = \sqrt[3]{y - 2}$.'
            solution_sketch: 'Let $y \in \mathbb{R}$ and set $x = \sqrt[3]{y - 2} \in \mathbb{R}$. Then $f(x) = (y - 2) + 2 = y$. $\square$'
          - problem: 'Prove $f : \mathbb{R} \setminus \{0\} \to \mathbb{R} \setminus \{0\}$, $f(x) = 1/x$, is surjective.'
            answer: 'Given $y \ne 0$, take $x = 1/y$.'
            solution_sketch: 'Let $y \ne 0$; then $x = 1/y$ is defined, nonzero, and $f(x) = 1/(1/y) = y$. $\square$'
        constraints: "invert one nonlinear step; check the preimage lands in the domain"
      - id: kp3
        name: "The codomain matters"
        key_prerequisites: [quantifiers]
        exemplars:
          - problem: 'Prove $f : \mathbb{R} \to [0, \infty)$, $f(x) = x^2$, is surjective.'
            answer: 'Given $y \ge 0$, take $x = \sqrt{y}$.'
            solution_sketch: 'Let $y \ge 0$; then $x = \sqrt{y} \in \mathbb{R}$ and $f(x) = y$. (Onto $\mathbb{R}$ it would fail: $-1$ has no preimage.) $\square$'
          - problem: 'Prove $f : \mathbb{R} \to (0, \infty)$, $f(x) = e^{x}$, is surjective.'
            answer: 'Given $y > 0$, take $x = \ln y$.'
            solution_sketch: 'Let $y > 0$; then $x = \ln y$ is a real number and $f(x) = e^{\ln y} = y$. $\square$'
        constraints: "maps surjective onto a stated codomain but not onto all of $\\mathbb{R}$"
    diagnostic_exemplar:
      problem: 'Prove that $f : \mathbb{R} \to [1, \infty)$, $f(x) = x^2 + 1$, is surjective, and explain why the same rule as a map $\mathbb{R} \to \mathbb{R}$ is not.'
      answer: 'Let $y \in [1, \infty)$. Then $y - 1 \ge 0$, so $x = \sqrt{y-1}$ is a real number, and $f(x) = (\sqrt{y-1})^2 + 1 = y$. Every element of the codomain has a preimage, so $f$ is surjective. As a map into $\mathbb{R}$ it is not: $x^2 + 1 \ge 1$ for every real $x$, so nothing maps to $0$. Surjectivity depends on the codomain, not only on the rule.'
      solution_sketch: 'Given a target $y$, solve $f(x) = y$ and check the solution lies in the domain; then point to codomain elements that are unreachable.'
    anki_seeds:
      - front: 'To prove $f : A \to B$ surjective, you...'
        back: 'take an arbitrary $b \in B$ and exhibit $a \in A$ with $f(a) = b$.'
        type: basic
      - front: 'Which part of a function''s specification does surjectivity depend on?'
        back: 'The codomain — the same rule can be surjective onto a smaller codomain and not onto a larger one.'
        type: basic

  - id: functions-injective-surjective
    name: "Injective and Surjective Functions"
    core: true
    difficulty: 0.60
    drill: false
    answer_kind: proof
    expected_time_secs: 220
    prerequisites:
      - id: proving-injectivity
        weight: 0.5
        key: true
      - id: proving-surjectivity
        weight: 0.5
        key: true
      - id: negating-statements
        weight: 0.4
        key: true
      - id: functions-formal-definition
        weight: 0.3
      - id: quantifiers
        weight: 0.3
      - id: logical-equivalence
        weight: 0.0
    knowledge_points:
      - id: kp1
        name: "Proving bijectivity"
        key_prerequisites: [proving-injectivity, proving-surjectivity]
        exemplars:
          - problem: 'Prove $f : \mathbb{R} \to \mathbb{R}$, $f(x) = 3x - 5$, is a bijection.'
            answer: 'Injective: $3a - 5 = 3b - 5 \Rightarrow a = b$. Surjective: $x = (y+5)/3$ works.'
            solution_sketch: 'Injective: $f(a) = f(b)$ gives $3a = 3b$, so $a = b$. Surjective: for $y \in \mathbb{R}$, $x = (y+5)/3$ satisfies $f(x) = y$. Both hold, so $f$ is bijective. $\square$'
          - problem: 'Prove $f : \mathbb{R} \to \mathbb{R}$, $f(x) = x^3$, is a bijection.'
            answer: 'Injective since cube roots are unique; surjective via $x = \sqrt[3]{y}$.'
            solution_sketch: 'Injective: $a^3 = b^3 \Rightarrow a = b$ (real cube roots are unique). Surjective: for $y \in \mathbb{R}$, $x = \sqrt[3]{y}$ gives $f(x) = y$. $\square$'
        constraints: "run both templates in one proof; affine or odd-power maps"
      - id: kp2
        name: "Disproving with counterexamples"
        key_prerequisites: [negating-statements]
        exemplars:
          - problem: 'Show $f : \mathbb{R} \to \mathbb{R}$, $f(x) = x^2$, is neither injective nor surjective.'
            answer: '$f(-1) = f(1)$ (not injective); no $x$ with $f(x) = -1$ (not surjective).'
            solution_sketch: 'Injectivity fails since $f(1) = f(-1) = 1$ but $1 \ne -1$. Surjectivity fails since $-1 < 0$ has no real preimage ($x^2 \ge 0$). $\square$'
          - problem: 'Show $f : \mathbb{Z} \to \mathbb{Z}$, $f(n) = n^2$, is not injective.'
            answer: '$f(2) = f(-2) = 4$ but $2 \ne -2$.'
            solution_sketch: 'Injectivity requires $f(a) = f(b) \Rightarrow a = b$; but $f(2) = f(-2) = 4$ with $2 \ne -2$, a counterexample. $\square$'
        constraints: "disprove by exhibiting an explicit counterexample"
      - id: kp3
        name: "Classifying: one property without the other"
        key_prerequisites: [proving-injectivity, proving-surjectivity]
        exemplars:
          - problem: 'Show $f : \mathbb{N} \to \mathbb{N}$, $f(n) = n + 1$, is injective but not surjective (here $0 \in \mathbb{N}$).'
            answer: '$a + 1 = b + 1 \Rightarrow a = b$; but no $n \in \mathbb{N}$ has $f(n) = 0$.'
            solution_sketch: 'Injective: cancel the $+1$. Not surjective: $f(n) = 0$ would need $n = -1 \notin \mathbb{N}$. $\square$'
          - problem: 'Show $f : \mathbb{Z} \to \mathbb{N}$, $f(n) = |n|$, is surjective but not injective.'
            answer: 'Every $m \in \mathbb{N}$ is $|m|$; but $f(3) = f(-3)$.'
            solution_sketch: 'Surjective: for $m \in \mathbb{N}$, $f(m) = m$. Not injective: $f(3) = f(-3) = 3$ with $3 \ne -3$. $\square$'
        constraints: "prove one property and refute the other for the same map"
    diagnostic_exemplar:
      problem: 'Prove $f : \mathbb{Z} \to \mathbb{Z}$, $f(n) = 2n$, is injective but not surjective.'
      answer: '$2a = 2b \Rightarrow a = b$; but $1$ has no integer preimage.'
      solution_sketch: 'If $f(a) = f(b)$ then $2a = 2b$, so $a = b$ (injective). But $f(n) = 1$ has no integer solution ($n = 1/2 \notin \mathbb{Z}$), so $f$ is not surjective. $\square$'
    anki_seeds:
      - front: 'Definition: $f$ injective (one-to-one)?'
        back: '$f(a) = f(b) \Rightarrow a = b$ for all $a, b$ (equivalently $a \ne b \Rightarrow f(a) \ne f(b)$).'
        type: basic
      - front: 'Definition: $f : A \to B$ surjective (onto)?'
        back: 'For every $b \in B$ there exists $a \in A$ with $f(a) = b$.'
        type: basic
      - front: 'To prove $f$ injective, start by assuming...'
        back: '$f(a) = f(b)$, then derive $a = b$.'
        type: basic

  - id: function-composition-inverse
    name: "Composition and Inverses"
    core: true
    difficulty: 0.62
    drill: false
    answer_kind: proof
    expected_time_secs: 230
    prerequisites:
      - id: functions-injective-surjective
        weight: 0.5
        key: true
      - id: functions-formal-definition
        weight: 0.4
        key: true
      - id: computing-compositions
        weight: 0.3
      - id: function-composition
        weight: 0.0
    knowledge_points:
      - id: kp1
        name: "Composition preserves injectivity"
        key_prerequisites: [functions-injective-surjective]
        exemplars:
          - problem: 'Prove: if $f : A \to B$ and $g : B \to C$ are both injective, then $g \circ f$ is injective.'
            answer: '$g(f(a_1)) = g(f(a_2)) \Rightarrow f(a_1) = f(a_2) \Rightarrow a_1 = a_2$.'
            solution_sketch: 'Assume $(g \circ f)(a_1) = (g \circ f)(a_2)$, i.e. $g(f(a_1)) = g(f(a_2))$. Injectivity of $g$ gives $f(a_1) = f(a_2)$; injectivity of $f$ gives $a_1 = a_2$. So $g \circ f$ is injective. $\square$'
          - problem: 'Prove: if $g \circ f$ is injective, then $f$ is injective.'
            answer: '$f(a_1) = f(a_2) \Rightarrow g(f(a_1)) = g(f(a_2)) \Rightarrow a_1 = a_2$.'
            solution_sketch: 'Suppose $f(a_1) = f(a_2)$. Applying $g$ gives $(g \circ f)(a_1) = (g \circ f)(a_2)$, and injectivity of $g \circ f$ forces $a_1 = a_2$. (Note $g$ itself need not be injective.) $\square$'
        constraints: "peel off $g$ then $f$ using each map''s injectivity"
      - id: kp2
        name: "Inverses and bijections"
        key_prerequisites: [functions-injective-surjective]
        exemplars:
          - problem: 'Prove: if $f : A \to B$ is bijective then it has a two-sided inverse $f^{-1} : B \to A$.'
            answer: 'Define $f^{-1}(b)$ as the unique preimage; check both compositions are identities.'
            solution_sketch: 'Surjectivity gives, for each $b$, some $a$ with $f(a) = b$; injectivity makes it unique, so $f^{-1}(b) = a$ is well-defined. Then $f(f^{-1}(b)) = b$ and $f^{-1}(f(a)) = a$, so $f^{-1}$ is a two-sided inverse. $\square$'
          - problem: 'Find the inverse of $f : \mathbb{R} \to \mathbb{R}$, $f(x) = 2x + 3$, and verify it.'
            answer: '$f^{-1}(y) = (y - 3)/2$.'
            solution_sketch: 'Solve $y = 2x + 3$ for $x$: $x = (y - 3)/2$, so $f^{-1}(y) = (y-3)/2$. Check $f(f^{-1}(y)) = 2 \cdot \frac{y-3}{2} + 3 = y$ and $f^{-1}(f(x)) = x$. $\square$'
        constraints: "use surjectivity for existence and injectivity for uniqueness of the inverse"
      - id: kp3
        name: "Inverse of a composition"
        key_prerequisites: [functions-formal-definition]
        exemplars:
          - problem: 'For bijections $f : A \to B$ and $g : B \to C$, prove $(g \circ f)^{-1} = f^{-1} \circ g^{-1}$.'
            answer: 'Composition with $g \circ f$ gives the identities.'
            solution_sketch: '$(f^{-1} \circ g^{-1}) \circ (g \circ f) = f^{-1} \circ (g^{-1} \circ g) \circ f = f^{-1} \circ f = \mathrm{id}_A$, and similarly the other order gives $\mathrm{id}_C$. By uniqueness of inverses, $(g \circ f)^{-1} = f^{-1} \circ g^{-1}$. $\square$'
          - problem: 'For bijections $f, g$ on a set, prove $(f \circ g) \circ (g^{-1} \circ f^{-1}) = \mathrm{id}$.'
            answer: 'Cancel the inner inverses step by step.'
            solution_sketch: '$(f \circ g) \circ (g^{-1} \circ f^{-1}) = f \circ (g \circ g^{-1}) \circ f^{-1} = f \circ \mathrm{id} \circ f^{-1} = f \circ f^{-1} = \mathrm{id}$. $\square$'
        constraints: "verify a candidate inverse by composing both ways"
    diagnostic_exemplar:
      problem: 'For bijections $f : A \to B$ and $g : B \to C$, prove that $(g \circ f)^{-1} = f^{-1} \circ g^{-1}$.'
      answer: 'First, $g \circ f$ is a bijection: it is injective, since $g(f(a_1)) = g(f(a_2))$ gives $f(a_1) = f(a_2)$ by injectivity of $g$ and then $a_1 = a_2$ by injectivity of $f$; and surjective, since for $c \in C$ we may pick $b$ with $g(b) = c$ and then $a$ with $f(a) = b$. So it has a two-sided inverse. Now $(f^{-1} \circ g^{-1}) \circ (g \circ f) = f^{-1} \circ (g^{-1} \circ g) \circ f = f^{-1} \circ \mathrm{id}_B \circ f = \mathrm{id}_A$, and likewise $(g \circ f) \circ (f^{-1} \circ g^{-1}) = g \circ (f \circ f^{-1}) \circ g^{-1} = \mathrm{id}_C$. A two-sided inverse is unique, so $(g \circ f)^{-1} = f^{-1} \circ g^{-1}$.'
      solution_sketch: 'Check that $g \circ f$ is a bijection, then verify $f^{-1} \circ g^{-1}$ composes with it to the identity on both sides and appeal to uniqueness of inverses.'
    anki_seeds:
      - front: 'Definition of the composition $(g \circ f)(x)$?'
        back: '$g(f(x))$: apply $f$ first, then $g$ (requires codomain of $f$ = domain of $g$).'
        type: basic
      - front: 'A function is invertible if and only if it is...'
        back: 'bijective (both injective and surjective).'
        type: basic

  - id: counting-functions
    name: "Counting Functions Between Finite Sets"
    core: false                # terminal counting result
    difficulty: 0.58
    drill: false
    answer_kind: numeric
    expected_time_secs: 140
    prerequisites:
      - id: functions-formal-definition
        weight: 0.5
        key: true
      - id: cartesian-products
        weight: 0.4
        key: true
      - id: functions-injective-surjective
        weight: 0.4
        key: true
      - id: multiplication-principle
        weight: 0.6
        key: true
      - id: factorial-notation
        weight: 0.3
        key: false
    knowledge_points:
      - id: kp1
        name: "Counting all functions"
        key_prerequisites: [functions-formal-definition, cartesian-products, multiplication-principle]
        exemplars:
          - problem: 'How many functions are there from $\{1, 2, 3\}$ to $\{a, b\}$?'
            answer: '$8$'
            solution_sketch: 'A function is fixed by choosing $f(1)$, then $f(2)$, then $f(3)$. Choosing $f(1)$ splits the functions into $2$ equal families; inside each, choosing $f(2)$ splits again into $2$; inside each of those, choosing $f(3)$ splits into $2$. So the count doubles once per input: $2 \cdot 2 \cdot 2 = 2^3 = 8$.'
          - problem: 'If $|A| = 4$ and $|B| = 3$, how many functions $A \to B$ are there?'
            answer: '$81$'
            solution_sketch: 'Fix the images of the $4$ inputs one at a time. Each choice is free and has $3$ options, and each earlier choice leaves a separate family to be split $3$ ways again, so the counts multiply: $3 \cdot 3 \cdot 3 \cdot 3 = 3^4 = 81$, i.e. $|B|^{|A|}$.'
        constraints: "apply $|B|^{|A|}$, justifying it by the multiplication principle — splitting the count one input at a time; sets of size at most 5"
      - id: kp2
        name: "Counting injections"
        key_prerequisites: [functions-injective-surjective, multiplication-principle]
        exemplars:
          - problem: 'How many injective functions are there from $\{1, 2\}$ to $\{a, b, c\}$?'
            answer: '$6$'
            solution_sketch: 'There are $3$ choices for $f(1)$; each of them leaves $2$ unused outputs for $f(2)$, so the $3$ families of size $2$ give $3 \cdot 2 = 6$.'
          - problem: 'How many injections are there from a $3$-element set to a $5$-element set?'
            answer: '$60$'
            solution_sketch: 'Falling product: $5$ choices for the first input, $4$ for the second, $3$ for the third, so $5 \cdot 4 \cdot 3 = 60$.'
          - problem: 'How many injections are there from a $4$-element set to a $3$-element set?'
            answer: '$0$'
            solution_sketch: 'None exist when the domain outnumbers the codomain: a fourth input would have to repeat one of the $3$ outputs, so the count is $0$.'
        constraints: "falling products $|B|(|B|-1)\\cdots$; include one impossible case"
      - id: kp3
        name: "Counting bijections"
        key_prerequisites: [functions-injective-surjective]
        exemplars:
          - problem: 'How many bijections are there from $\{1, 2, 3\}$ to itself?'
            answer: '$6$'
            solution_sketch: '$3! = 3 \cdot 2 \cdot 1 = 6$ ways to match inputs to distinct outputs.'
          - problem: 'How many bijections are there from $\{1, 2, 3, 4\}$ to $\{a, b, c, d\}$?'
            answer: '$24$'
            solution_sketch: '$4! = 24$; equal sizes are required for any bijection to exist.'
        constraints: "factorials for equal-size sets; note bijections need $|A| = |B|$"
    diagnostic_exemplar:
      problem: 'How many of the functions from $\{1, 2\}$ to $\{x, y, z\}$ fail to be injective?'
      answer: '$3$'
      solution_sketch: 'Total functions: $3^2 = 9$. Injections: $3 \cdot 2 = 6$. So $9 - 6 = 3$ are non-injective — exactly the three constant functions.'
    anki_seeds:
      - front: 'Number of functions $A \to B$ (finite sets)?'
        back: '$|B|^{|A|}$.'
        type: basic
      - front: 'Number of bijections on an $n$-element set?'
        back: '$n!$.'
        type: basic

  - id: computing-images-preimages
    name: "Computing Images and Preimages"
    core: false                # supplemental, with images-preimages: terminal branch
    difficulty: 0.56
    drill: false
    answer_kind: multi-step
    expected_time_secs: 130
    prerequisites:
      - id: functions-formal-definition
        weight: 0.5
        key: true
      - id: set-operations
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: "Images of finite sets"
        key_prerequisites: [functions-formal-definition]
        exemplars:
          - problem: 'For $f : \mathbb{Z} \to \mathbb{Z}$, $f(n) = n^2$, compute $f(\{-2, -1, 0, 1, 2\})$.'
            answer: '$\{0, 1, 4\}$'
            solution_sketch: 'Apply $f$ to each input: $4, 1, 0, 1, 4$; as a set, $\{0, 1, 4\}$ — repeats collapse.'
          - problem: 'For $f : \{a, b, c\} \to \{x, y\}$ with $f(a) = x$, $f(b) = y$, $f(c) = x$, compute $f(\{a, c\})$.'
            answer: '$\{x\}$'
            solution_sketch: 'Both $a$ and $c$ map to $x$, so the image of $\{a, c\}$ is the single output $x$.'
        constraints: "apply $f(S) = \\{f(x) : x \\in S\\}$; collapsing repeats is the point"
      - id: kp2
        name: "Computing preimages"
        key_prerequisites: [functions-formal-definition]
        exemplars:
          - problem: 'For $f : \mathbb{Z} \to \mathbb{Z}$, $f(n) = n^2$, compute $f^{-1}(\{1, 4\})$ and $f^{-1}(\{3\})$.'
            answer: '$\{-2, -1, 1, 2\}$ and $\varnothing$.'
            solution_sketch: 'Solve $n^2 \in \{1, 4\}$: $n = \pm 1, \pm 2$. No integer squares to $3$, so that preimage is empty.'
          - problem: 'For $f : \mathbb{R} \to \mathbb{R}$, $f(x) = 2x + 1$, compute $f^{-1}(\{1, 3, 5\})$.'
            answer: '$\{0, 1, 2\}$'
            solution_sketch: 'Solve $2x + 1 = 1, 3, 5$ in turn: $x = 0, 1, 2$.'
        constraints: "solve $f(x) \\in T$; include an empty preimage"
      - id: kp3
        name: "Real functions on intervals"
        key_prerequisites: [set-operations]
        exemplars:
          - problem: 'For $f : \mathbb{R} \to \mathbb{R}$, $f(x) = x^2$, find the image $f([-1, 2])$.'
            answer: '$[0, 4]$'
            solution_sketch: 'On $[-1, 2]$ the square attains its minimum $0$ at $x = 0$ and maximum $4$ at $x = 2$; every value between is hit.'
          - problem: 'For $f : \mathbb{R} \to \mathbb{R}$, $f(x) = x^2$, find the preimage $f^{-1}([1, 4])$.'
            answer: '$[-2, -1] \cup [1, 2]$'
            solution_sketch: '$1 \le x^2 \le 4$ iff $1 \le |x| \le 2$, which splits into the two symmetric intervals.'
        constraints: "images/preimages of intervals under $x^2$ or affine maps; answers as intervals or unions"
    diagnostic_exemplar:
      problem: 'For $f : \mathbb{R} \to \mathbb{R}$, $f(x) = x^2$, find the image $f([-1, 3])$ and the preimage $f^{-1}([4, 9])$.'
      answer: '$f([-1,3]) = [0, 9]$: on $[-1,3]$ the square attains its least value $0$ at $x = 0$ and its greatest value $9$ at $x = 3$, and every value in between is attained. $f^{-1}([4,9]) = [-3,-2] \cup [2,3]$: the condition $4 \le x^2 \le 9$ says $2 \le |x| \le 3$, which allows both signs.'
      solution_sketch: 'For the image, track the minimum and maximum of $x^2$ over the interval; for the preimage, solve the inequality in $|x|$ and keep both signs.'
    anki_seeds:
      - front: 'Does $f^{-1}(T)$ require $f$ to be invertible?'
        back: 'No — the preimage $\{x : f(x) \in T\}$ is defined for every function.'
        type: basic
      - front: '$f^{-1}(\{b\}) = \varnothing$ means...'
        back: 'no input maps to $b$ ($b$ is not in the image of $f$).'
        type: basic

  - id: images-preimages
    name: "Images and Preimages"
    core: false                # supplemental: stated preservation properties; terminal
    difficulty: 0.62
    drill: false
    answer_kind: proof
    expected_time_secs: 220
    prerequisites:
      - id: computing-images-preimages
        weight: 0.5
        key: true
      - id: functions-formal-definition
        weight: 0.4
        key: true
      - id: set-operations
        weight: 0.4
        key: true
      - id: set-identities-proofs
        weight: 0.3
      - id: quantifiers
        weight: 0.0
    knowledge_points:
      - id: kp1
        name: "Monotonicity of image and preimage"
        key_prerequisites: [computing-images-preimages]
        exemplars:
          - problem: 'Prove: if $S \subseteq T$ (subsets of the domain), then $f(S) \subseteq f(T)$.'
            answer: '$y = f(x)$ with $x \in S \subseteq T$ gives $y \in f(T)$.'
            solution_sketch: 'Let $y \in f(S)$; then $y = f(x)$ for some $x \in S$. Since $S \subseteq T$, $x \in T$, so $y = f(x) \in f(T)$. $\square$'
          - problem: 'Prove: if $C \subseteq D$ (subsets of the codomain), then $f^{-1}(C) \subseteq f^{-1}(D)$.'
            answer: '$f(x) \in C \subseteq D$ gives $x \in f^{-1}(D)$.'
            solution_sketch: 'Let $x \in f^{-1}(C)$; then $f(x) \in C \subseteq D$, so $f(x) \in D$, i.e. $x \in f^{-1}(D)$. $\square$'
        constraints: "one-line inclusion proofs straight from the definitions of image and preimage"
      - id: kp2
        name: "Images and unions"
        key_prerequisites: [set-operations]
        exemplars:
          - problem: 'Prove: $f(S \cup T) = f(S) \cup f(T)$ for any function $f$ and subsets $S, T$ of the domain.'
            answer: 'Double inclusion via the definition of image.'
            solution_sketch: '$y \in f(S \cup T)$ iff $y = f(x)$ for some $x \in S \cup T$ iff $y = f(x)$ with $x \in S$ or $x \in T$ iff $y \in f(S)$ or $y \in f(T)$ iff $y \in f(S) \cup f(T)$. $\square$'
          - problem: 'Give a function and sets for which $f(S \cap T) \ne f(S) \cap f(T)$.'
            answer: 'e.g. $f(x) = x^2$, $S = \{1\}$, $T = \{-1\}$: $\varnothing \ne \{1\}$.'
            solution_sketch: 'With $f(x) = x^2$, $S = \{1\}$, $T = \{-1\}$: $S \cap T = \varnothing$ so $f(S \cap T) = \varnothing$, but $f(S) = f(T) = \{1\}$, so $f(S) \cap f(T) = \{1\}$. The inclusion $f(S \cap T) \subseteq f(S) \cap f(T)$ is strict here. $\square$'
        constraints: "chase an element through the image of a union; note images need not preserve $\\cap$"
      - id: kp3
        name: "Preimages preserve unions and intersections"
        key_prerequisites: [set-identities-proofs]
        exemplars:
          - problem: 'Prove: $f^{-1}(C \cap D) = f^{-1}(C) \cap f^{-1}(D)$.'
            answer: 'Element chase using $x \in f^{-1}(C)$ iff $f(x) \in C$.'
            solution_sketch: '$x \in f^{-1}(C \cap D)$ iff $f(x) \in C \cap D$ iff $f(x) \in C$ and $f(x) \in D$ iff $x \in f^{-1}(C)$ and $x \in f^{-1}(D)$ iff $x \in f^{-1}(C) \cap f^{-1}(D)$. $\square$'
          - problem: 'Prove: $f^{-1}(C \cup D) = f^{-1}(C) \cup f^{-1}(D)$.'
            answer: 'Element chase using $x \in f^{-1}(C)$ iff $f(x) \in C$.'
            solution_sketch: '$x \in f^{-1}(C \cup D)$ iff $f(x) \in C \cup D$ iff $f(x) \in C$ or $f(x) \in D$ iff $x \in f^{-1}(C)$ or $x \in f^{-1}(D)$ iff $x \in f^{-1}(C) \cup f^{-1}(D)$. $\square$'
        constraints: "use that preimage membership is defined by a condition on $f(x)$"
    diagnostic_exemplar:
      problem: 'Prove that $f(S \cap T) \subseteq f(S) \cap f(T)$ for any function $f$ and subsets $S, T$ of its domain, give an example where the inclusion is strict, and decide whether $f^{-1}(C \cap D) = f^{-1}(C) \cap f^{-1}(D)$ holds in general.'
      answer: 'Inclusion: let $y \in f(S \cap T)$, say $y = f(x)$ with $x \in S \cap T$. Then $x \in S$ gives $y \in f(S)$, and $x \in T$ gives $y \in f(T)$, so $y \in f(S) \cap f(T)$. Strictness: take $f(x) = x^2$, $S = \{1\}$, $T = \{-1\}$; then $S \cap T = \varnothing$, so $f(S \cap T) = \varnothing$, while $f(S) \cap f(T) = \{1\}$. For preimages equality always holds: $x \in f^{-1}(C \cap D)$ iff $f(x) \in C$ and $f(x) \in D$, iff $x \in f^{-1}(C)$ and $x \in f^{-1}(D)$.'
      solution_sketch: 'Chase an element for the inclusion; equality fails when two different inputs share an output. Preimages behave better because membership is tested after applying $f$.'
    anki_seeds:
      - front: 'Definitions of the image $f(S)$ and preimage $f^{-1}(T)$?'
        back: '$f(S) = \{f(x) : x \in S\}$; $f^{-1}(T) = \{x : f(x) \in T\}$.'
        type: basic
      - front: 'Which is better behaved with respect to $\cap$ and complements, image or preimage?'
        back: 'The preimage: it preserves unions, intersections, and complements; the image only gives $f(S \cap T) \subseteq f(S) \cap f(T)$.'
        type: basic

  - id: relations-digraphs-matrices
    name: "Representing Relations"
    core: true
    difficulty: 0.52
    drill: false
    answer_kind: multi-step
    expected_time_secs: 120
    prerequisites:
      - id: cartesian-products
        weight: 0.5
        key: true
      - id: set-notation
        weight: 0.2
    knowledge_points:
      - id: kp1
        name: "Relations as sets of pairs"
        key_prerequisites: [cartesian-products]
        exemplars:
          - problem: 'On $A = \{1, 2, 3, 4\}$, list the pairs of the relation $R = \{(a, b) : a \mid b\}$.'
            answer: '$\{(1,1),(1,2),(1,3),(1,4),(2,2),(2,4),(3,3),(4,4)\}$'
            solution_sketch: 'For each $a$, list the multiples of $a$ inside $A$: $1$ divides everything, $2$ divides $2, 4$, and each element divides itself.'
          - problem: 'On $A = \{1, 2, 3\}$, list the pairs of $R = \{(a, b) : a + b \text{ is even}\}$.'
            answer: '$\{(1,1),(1,3),(3,1),(3,3),(2,2)\}$'
            solution_sketch: '$a + b$ is even iff $a, b$ have the same parity: pair the odds $1, 3$ with each other and $2$ with itself.'
        constraints: "enumerate a rule-defined relation on a set of size at most 4"
      - id: kp2
        name: "Digraphs of relations"
        key_prerequisites: [cartesian-products]
        exemplars:
          - problem: 'Describe the digraph of $R = \{(1,2), (2,3), (3,1)\}$ on $\{1, 2, 3\}$. Which vertices have loops?'
            answer: 'A directed $3$-cycle $1 \to 2 \to 3 \to 1$; no loops.'
            solution_sketch: 'Each pair $(a, b)$ is an arrow $a \to b$; loops are the pairs $(a, a)$, of which there are none.'
          - problem: 'For the divisibility relation on $\{1, 2, 3, 4\}$, which vertices of its digraph carry loops, and why?'
            answer: 'All of them — $a \mid a$ for every $a$.'
            solution_sketch: 'A loop at $a$ means $(a, a) \in R$; divisibility is reflexive, so every vertex has one.'
        constraints: "translate between pair sets and arrows/loops on a small vertex set"
      - id: kp3
        name: "Zero-one matrices and counting relations"
        key_prerequisites: [cartesian-products]
        exemplars:
          - problem: 'Write the $3 \times 3$ zero-one matrix of $R = \{(1,1), (1,2), (2,3)\}$ on $\{1, 2, 3\}$ (rows = first coordinate).'
            answer: 'Rows: $(1, 1, 0)$, $(0, 0, 1)$, $(0, 0, 0)$.'
            solution_sketch: 'Entry $(i, j)$ is $1$ iff $(i, j) \in R$: row $1$ has ones in columns $1, 2$; row $2$ in column $3$.'
          - problem: 'How many relations are there on a $2$-element set?'
            answer: '$16$'
            solution_sketch: 'A relation is any subset of $A \times A$, which has $2^2 = 4$ pairs; $2^4 = 16$ subsets.'
        constraints: "matrix encoding on sets of size at most 3; count relations as $2^{n^2}$"
    diagnostic_exemplar:
      problem: 'On $A = \{1, 2, 3\}$ let $R = \{(a,b) : a \le b\}$. List the pairs of $R$, write its $3 \times 3$ zero-one matrix (rows indexed by the first coordinate), and say which vertices of its digraph carry loops.'
      answer: 'Pairs: $(1,1), (1,2), (1,3), (2,2), (2,3), (3,3)$. Matrix rows: $(1,1,1)$, $(0,1,1)$, $(0,0,1)$ — the entry in row $i$, column $j$ is $1$ exactly when $i \le j$. Every vertex carries a loop, since $a \le a$ for each $a$; loops are the diagonal $1$s.'
      solution_sketch: 'List the pairs whose first coordinate is at most the second, transcribe them into the matrix, and note that loops correspond to diagonal entries.'
    anki_seeds:
      - front: 'A relation on a set $A$ is...'
        back: 'any subset of $A \times A$ (pairs $(a, b)$ with $a$ related to $b$).'
        type: basic
      - front: 'Number of relations on an $n$-element set?'
        back: '$2^{n^2}$ — subsets of the $n^2$ pairs in $A \times A$.'
        type: basic

