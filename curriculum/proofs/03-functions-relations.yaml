          - problem: "Write the full proof: on the integers, define a ~ b exactly when the absolute values of a and b are equal. Prove that ~ is an equivalence relation. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Claim: the relation a ~ b defined by |a| = |b| on the integers is an equivalence relation, so we must confirm all three defining properties. Reflexive: for every integer a we have |a| = |a|, so a ~ a. Symmetric: assume a ~ b, that is |a| = |b|; equality of numbers is symmetric, so |b| = |a|, hence b ~ a. Transitive: assume a ~ b and b ~ c, so |a| = |b| and |b| = |c|; by transitivity of equality, |a| = |c|, hence a ~ c. All three properties hold, therefore ~ is an equivalence relation. (Note the relation is not equality: 2 and -2 are related but are different integers.)"
        constraints: "confirm all three defining properties"
