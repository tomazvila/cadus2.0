      - id: kp2
        name: "Disproving with counterexamples"
        key_prerequisites: [negating-statements]
        exemplars:
          - problem: "Let $f : \\mathbb{R} \\to \\mathbb{R}$ be given by $f(x) = x^2 + 1$. To disprove injectivity and surjectivity by explicit counterexamples, use that the equation $f(x) = v$ can have two different real solutions for a positive integer $v$, and that some integers are not values of $f$. Let $v$ be the smallest positive integer for which $f(x) = v$ has two different real solutions, and let miss be the largest integer that is not a value of $f$. Give $v$ and miss."
            answer: "v = 2; miss = 0"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "v"}, {"contract": {"kind": "exact"}, "name": "miss"}]}
            solution_sketch: "Full object: $f(x) = x^2 + 1$ on $\\mathbb{R}$. Since $f(t) = f(-t)$, a value $v$ has two different real solutions exactly when $v > 1$; the value $v = 1$ has the single solution $x = 0$, while $x^2 + 1 = 2$ gives $x = 1$ and $x = -1$, the explicit counterexample to injectivity. Every value of $f$ is at least $1$, so the integers that are not values are exactly those at most $0$, the counterexample to surjectivity, and the largest of them is $0$. The answer is v = 2; miss = 0."
          - problem: "Let $f : \\mathbb{Z} \\to \\mathbb{Z}$ be given by $f(n) = n^2$. A counterexample to injectivity is a value with two different preimages. Give the smallest nonnegative integer $y$ for which the equation $n^2 = y$ has two different integer solutions."
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Full object: $f(n) = n^2$ on $\\mathbb{Z}$. A value $y$ has two different integer preimages exactly when both $\\sqrt{y}$ and $-\\sqrt{y}$ are integers, that is, when $y$ is a positive perfect square. Check $y = 0$: only $n = 0$ works, one preimage. Check $y = 1$: $n = 1$ and $n = -1$ both satisfy $n^2 = 1$ and $1 \\ne -1$, the explicit counterexample. The answer is 1."
          - problem: "A student claims that $f : \\mathbb{Z} \\to \\mathbb{Z}$ with $f(n) = n^2 + n$ is injective and checks only $n = 0$, $1$ and $2$. Give the smallest positive integer $n$ for which $f(n) = f(m)$ for some integer $m$ different from $n$."
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Full object: $f(n) = n^2 + n = n(n+1)$ on $\\mathbb{Z}$. If $m = -n - 1$, then $f(m) = (-n-1)(-n) = n(n+1) = f(n)$, so every $n$ has a partner $m \\ne n$. For the smallest positive candidate $n = 1$: $f(1) = 2$ and $f(-2) = 4 - 2 = 2$, so $f(1) = f(-2)$ with $1 \\ne -2$, an explicit counterexample to the claim. The answer is 1."
          - problem: "Let $f : \\mathbb{R} \\to \\mathbb{R}$ be given by $f(x) = x^2 + 4x + 5$. A counterexample to surjectivity is a real number that is not a value of $f$. Give the largest integer that is not a value of $f$."
            answer: "0"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Full object: $f(x) = x^2 + 4x + 5$ on $\\mathbb{R}$. Complete the square: $f(x) = (x+2)^2 + 1$, so every value of $f$ is at least $1$. Hence every integer $y \\le 0$ is not a value, and each such $y$ is an explicit counterexample to surjectivity, while each integer $y \\ge 1$ is a value since $(x+2)^2 = y - 1$ has a real solution. The answer is 0."
          - problem: "Disprove that f:Z -> Z, f(n)=n^2, is surjective by exhibiting a positive integer outside its image. Give the smallest such positive integer."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Every integer preimage of a positive y must have absolute value at most y. Checking this finite necessary range shows that 1 has a preimage and 2 has none; thus 2 is the required counterexample."
          - problem: "For f:Z -> Z defined by f(n)=3n+2, disprove surjectivity by constructing a nonnegative integer outside its image. Give the smallest such integer and justify why it has no integer preimage."
            answer: "0"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Solving the target equation gives n=(y-2)/3, so a preimage exists only for targets congruent to 2 modulo 3. The smallest nonnegative missed target is 0. The encoded answer is 0."
          - problem: "Write the full proof: the function $f$ from $\\mathbb{R}$ to $\\mathbb{R}$ with $f(x) = x^4 + 1$ is neither injective nor surjective. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Full object: $f : \\mathbb{R} \\to \\mathbb{R}$ with $f(x) = x^4 + 1$. Step 1 (not injective, by an explicit counterexample): take $a = 1$ and $b = -1$; then $a \\ne b$, but $f(1) = 1^4 + 1 = 2$ and $f(-1) = (-1)^4 + 1 = 2$, so $f(a) = f(b)$ with $a \\ne b$, which is exactly the negation of injectivity. Step 2 (not surjective, by an explicit counterexample): every real $x$ satisfies $x^4 \\ge 0$, hence $f(x) = x^4 + 1 \\ge 1$; take $y = 0$, and the equation $x^4 + 1 = 0$ would force $x^4 = -1$, which has no real solution, so $y = 0$ has no preimage, the negation of surjectivity. Step 3 (conclusion): since injectivity fails by the explicit counterexample $a = 1$, $b = -1$, and surjectivity fails by the explicit counterexample $y = 0$, the function $f$ is neither injective nor surjective. This proves the claim."
        constraints: "disprove by exhibiting an explicit counterexample"
