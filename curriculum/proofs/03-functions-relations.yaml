          - problem: "On $A = \\{1, 2, 3\\}$, list the pairs of $R = \\{(a, b) : a + b \\text{ is even}\\}$. List the resulting pairs in increasing first-coordinate order, then second-coordinate order; flatten them into one ordered list of coordinates."
            answer: "1, 1, 1, 3, 2, 2, 3, 1, 3, 3"
