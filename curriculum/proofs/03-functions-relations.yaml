            solution_sketch: "Construct the full relation required by the operation, preserving the order of each pair. Listing those pairs in the requested order gives the flattened coordinates 1, 1, 1, 3, 2, 2, 3, 1, 3, 3."
          - problem: "On A = {1, 2, 3, 4}, let R = {(a, b) : a*b is even}. How many pairs are in R?"
            answer: "12"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The relation R is the set of pairs (a,b) in A x A for which a*b is even. Step 1: List all 16 ordered pairs from A x A. Step 2: The product a*b is odd exactly when both a and b are odd; there are 2 odd numbers in A, so 2*2 = 4 such pairs. Step 3: Subtract the 4 odd-product pairs from the 16 total pairs: 16 - 4 = 12. The number of pairs in R is 12."
          - problem: "On A = {1, 2, 3}, let R = {(a, b) : a < b}. Give the pairs of R in increasing order of first coordinate, then second coordinate, as a flat list of numbers separated by commas."
            answer: "1, 2, 1, 3, 2, 3"
            answer_contract: {"kind": "list", "member": {"kind": "exact"}, "ordered": true}
            solution_sketch: "The relation R is the set of pairs (a,b) in {1,2,3} x {1,2,3} with a < b. Step 1: For first coordinate 1, the second coordinates are 2 and 3, giving (1,2) and (1,3). Step 2: For first coordinate 2, the second coordinate is 3, giving (2,3). Step 3: Flatten the pairs in order: 1, 2, 1, 3, 2, 3. The required list is 1, 2, 1, 3, 2, 3."
          - problem: "On A = {1, 2, 3, 4}, let R = {(a, b) : |a - b| = 1}. How many pairs are in R?"
            answer: "6"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The relation R is the set of pairs (a,b) in A x A with |a - b| = 1. Step 1: List the pairs whose coordinates differ by exactly 1: (1,2), (2,1), (2,3), (3,2), (3,4), and (4,3). Step 2: Count these pairs: there are 6 of them. The number of pairs in R is 6."
          - problem: "On A = {1, 2, 3, 4}, let R = {(a, b) : a < b}. How many pairs of R have first coordinate 2?"
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The relation R is the set of pairs (a,b) in A x A with a < b. Step 1: Fix a = 2, so the condition is 2 < b. Step 2: The elements of A greater than 2 are 3 and 4, giving the pairs (2,3) and (2,4). Step 3: Counting these pairs gives 2. The number of pairs with first coordinate 2 is 2."
