      - id: kp2
        name: "Rule-defined relations with a failing property"
        key_prerequisites: [relations-properties]
        exemplars:
          - problem: "On the integers define a ~ b exactly when |a - b| <= 1. Number the properties 1 = reflexive, 2 = symmetric, 3 = transitive. The relation fails exactly one of the three properties. Give the number p of the failing property and a counterexample triple (a, b, c) with 0 <= a < b < c <= 2, written as p = ...; a = ...; b = ...; c = ...."
            answer: "p = 3; a = 0; b = 1; c = 2"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "p"}, {"contract": {"kind": "exact"}, "name": "a"}, {"contract": {"kind": "exact"}, "name": "b"}, {"contract": {"kind": "exact"}, "name": "c"}]}
            solution_sketch: "Reflexivity step: |x - x| = 0 <= 1 for every integer, so property 1 holds. Symmetry step: |a - b| = |b - a|, so property 2 holds. Transitivity step: 0 ~ 1 and 1 ~ 2 since each gap is 1, but |0 - 2| = 2 > 1, so 0 is not related to 2 and property 3 fails. Within 0 <= a < b < c <= 2 the only counterexample triple is (0, 1, 2). The answer is p = 3; a = 0; b = 1; c = 2."
          - problem: "On the integers define a ~ b exactly when ab >= 0. Number the properties 1 = reflexive, 2 = symmetric, 3 = transitive. The relation fails exactly one of the three properties. Give the number p of the failing property and a counterexample triple (a, b, c) with -1 <= a <= b <= c <= 1, written as p = ...; a = ...; b = ...; c = ...."
            answer: "p = 3; a = -1; b = 0; c = 1"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "p"}, {"contract": {"kind": "exact"}, "name": "a"}, {"contract": {"kind": "exact"}, "name": "b"}, {"contract": {"kind": "exact"}, "name": "c"}]}
            solution_sketch: "Reflexivity step: a * a = a^2 >= 0 for every integer, so property 1 holds. Symmetry step: ab = ba, so property 2 holds. Transitivity step: -1 ~ 0 and 0 ~ 1 because both products are 0, but (-1) * 1 = -1 < 0, so -1 is not related to 1 and property 3 fails. Among triples with -1 <= a <= b <= c <= 1 the only transitivity counterexample is (-1, 0, 1). The answer is p = 3; a = -1; b = 0; c = 1."
          - problem: "On the integers define a ~ b exactly when a <= b. Number the properties 1 = reflexive, 2 = symmetric, 3 = transitive. The relation fails exactly one of the three properties. Give the number p of the failing property and a counterexample triple (a, b, a) with 0 <= a < b <= 1, written as p = ...; a = ...; b = ...; c = ...."
            answer: "p = 2; a = 0; b = 1; c = 0"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "p"}, {"contract": {"kind": "exact"}, "name": "a"}, {"contract": {"kind": "exact"}, "name": "b"}, {"contract": {"kind": "exact"}, "name": "c"}]}
            solution_sketch: "Reflexivity step: a <= a holds, so property 1 holds. Transitivity step: a <= b and b <= c give a <= c, so property 3 holds. Symmetry step: with a = 0 and b = 1 we have 0 ~ 1 since 0 <= 1, but 1 ~ 0 is false since 1 <= 0 fails, so property 2 fails. With 0 <= a < b <= 1 the only symmetry counterexample is (0, 1, 0). The answer is p = 2; a = 0; b = 1; c = 0."
          - problem: "On the positive integers define a ~ b exactly when a divides b. Number the properties 1 = reflexive, 2 = symmetric, 3 = transitive. The relation fails exactly one of the three properties. Give the number p of the failing property and a counterexample triple (a, b, a) with 2 <= a < b <= 4, written as p = ...; a = ...; b = ...; c = ...."
            answer: "p = 2; a = 2; b = 4; c = 2"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "p"}, {"contract": {"kind": "exact"}, "name": "a"}, {"contract": {"kind": "exact"}, "name": "b"}, {"contract": {"kind": "exact"}, "name": "c"}]}
            solution_sketch: "Reflexivity step: every positive integer divides itself, so property 1 holds. Transitivity step: if a divides b and b divides c, then a divides c, so property 3 holds. Symmetry step: 2 divides 4 but 4 does not divide 2, so 2 ~ 4 while 4 ~ 2 is false and property 2 fails. In the range 2 <= a < b <= 4 the pairs (2, 3) and (3, 4) are not related pairs, so (2, 4, 2) is the only counterexample. The answer is p = 2; a = 2; b = 4; c = 2."
          - problem: "On the integers define a ~ b exactly when |a| <= |b|. Number the properties 1 = reflexive, 2 = symmetric, 3 = transitive. The relation fails exactly one of the three properties. Give the number p of the failing property and a counterexample triple (a, b, a) with 1 <= a < b <= 2, written as p = ...; a = ...; b = ...; c = ...."
            answer: "p = 2; a = 1; b = 2; c = 1"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "p"}, {"contract": {"kind": "exact"}, "name": "a"}, {"contract": {"kind": "exact"}, "name": "b"}, {"contract": {"kind": "exact"}, "name": "c"}]}
            solution_sketch: "Reflexivity step: |a| <= |a| holds, so property 1 holds. Transitivity step: |a| <= |b| and |b| <= |c| give |a| <= |c|, so property 3 holds. Symmetry step: |1| <= |2| holds but |2| <= |1| is false, so 1 ~ 2 while 2 ~ 1 is false and property 2 fails. In the range 1 <= a < b <= 2 the only pair is (1, 2), giving the counterexample (1, 2, 1). The answer is p = 2; a = 1; b = 2; c = 1."
          - problem: "On the integers define a ~ b exactly when ab > 0. Number the properties 1 = reflexive, 2 = symmetric, 3 = transitive. The relation fails exactly one of the three properties. Give the number p of the failing property and a counterexample triple (a, b, c) with a = b = c and 0 <= a <= 1, written as p = ...; a = ...; b = ...; c = ...."
            answer: "p = 1; a = 0; b = 0; c = 0"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "p"}, {"contract": {"kind": "exact"}, "name": "a"}, {"contract": {"kind": "exact"}, "name": "b"}, {"contract": {"kind": "exact"}, "name": "c"}]}
            solution_sketch: "Symmetry step: if ab > 0 then ba > 0, so property 2 holds. Transitivity step: ab > 0 and bc > 0 force b to be nonzero and a, c to share the sign of b, so ac > 0 and property 3 holds. Reflexivity step: with a = 0 the product 0 * 0 = 0 is not > 0, so 0 ~ 0 is false and property 1 fails. With a = b = c and 0 <= a <= 1 the value a = 1 is related to itself, so the only counterexample is (0, 0, 0). The answer is p = 1; a = 0; b = 0; c = 0."
