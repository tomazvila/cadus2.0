    diagnostic_exemplar:
      problem: 'Show that the relation "$a \mid b$" on $\mathbb{Z}^{+}$ is reflexive, antisymmetric and transitive, but not symmetric.'
      answer: 'Reflexive: $a = a \cdot 1$, so $a \mid a$. Antisymmetric: if $a \mid b$ and $b \mid a$ with $a, b > 0$, write $b = ak$ and $a = bm$; then $a = akm$, so $km = 1$ with $k, m$ positive integers, forcing $k = m = 1$ and $a = b$. Transitive: $b = ak$ and $c = bm$ give $c = a(km)$, so $a \mid c$. Not symmetric: $2 \mid 4$ but $4 \nmid 2$.'
      solution_sketch: 'Verify each property from the definition $a \mid b \iff b = ak$; positivity is what makes antisymmetry work, and one counterexample refutes symmetry.'
    anki_seeds:
      - front: 'When is a relation $R$ on $A$ reflexive?'
        back: '$\forall a,\ aRa$.'
        type: basic
      - front: 'When is a relation $R$ symmetric?'
        back: '$aRb \Rightarrow bRa$.'
        type: basic
      - front: 'When is a relation $R$ transitive?'
        back: '$aRb \land bRc \Rightarrow aRc$.'
        type: basic
      - front: 'When is a relation $R$ antisymmetric?'
        back: '$aRb \land bRa \Rightarrow a = b$.'
        type: basic

  - id: verifying-equivalence-properties
    name: "Verifying the Three Properties"
    core: true
    difficulty: 0.56
    drill: false
    answer_kind: numeric
    expected_time_secs: 150
    prerequisites:
      - id: relations-properties
        weight: 0.6
        key: true
    knowledge_points:
      - id: kp1
        name: "Checks on listed relations"
        key_prerequisites: [relations-properties]
        exemplars:
          - problem: "On {1, 2, 3}, let R = {(1,1),(2,2),(3,3),(1,3),(3,1)}. How many of the three properties reflexive, symmetric, and transitive does R have? Give the number."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The relation is R = {(1,1),(2,2),(3,3),(1,3),(3,1)}. Reflexive check: all three loops (1,1), (2,2), (3,3) are present, so reflexivity holds. Symmetric check: the non-loop pairs (1,3) and (3,1) each have their reverse in R, so symmetry holds. Transitive check: the chains (1,3),(3,1) give (1,1), and (3,1),(1,3) give (3,3), both present, so transitivity holds. The answer is 3."
          - problem: "On {1, 2, 3}, let R = {(1,1),(2,2),(1,2),(2,1),(2,3)}. Find how many of the three properties reflexive, symmetric, and transitive R has. Give the number."
            answer: "0"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The relation is R = {(1,1),(2,2),(1,2),(2,1),(2,3)}. Reflexive check: (3,3) is missing, so reflexivity fails. Symmetric check: (2,3) is in R but (3,2) is not, so symmetry fails. Transitive check: (1,2) and (2,3) are in R but (1,3) is not, so transitivity fails. The answer is 0."
          - problem: "On {1, 2, 3}, let R = {(1,1),(2,2),(3,3),(1,2),(2,1),(2,3),(3,2)}. Determine how many of the three properties hold for R. Give the number."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The relation is R = {(1,1),(2,2),(3,3),(1,2),(2,1),(2,3),(3,2)}. Reflexive check: all three loops are present, so reflexivity holds. Symmetric check: every non-loop pair (1,2), (2,1), (2,3), (3,2) has its reverse in R, so symmetry holds. Transitive check: (1,2) and (2,3) are in R but (1,3) is missing, so transitivity fails. The answer is 2."
          - problem: "On {1, 2, 3}, let R = {(1,2),(2,1)}. Evaluate how many of the three properties reflexive, symmetric, and transitive R satisfies. Give the number."
            answer: "1"
            answer_contract: {"kind": "exact"}
