unit: functions-relations
course: proofs
module: "Functions & Relations"
topics:
  - id: functions-formal-definition
    name: "Functions: Formal Definition"
    core: true
    difficulty: 0.55
    drill: false
    answer_kind: proof
    expected_time_secs: 200
    prerequisites:
      - id: cartesian-products
        weight: 0.5
        key: true
      - id: set-notation
        weight: 0.3
      - id: quantifiers
        weight: 0.3
      - id: function-notation
        weight: 0.0
    knowledge_points:
      - id: kp1
        name: "Function as a special relation"
        key_prerequisites: [cartesian-products]
        step_check:
          step: 'scan for a repeated first coordinate'
          question: 'Why does the check for uniqueness look for a repeated first coordinate and not a repeated second coordinate?'
          options:
            - 'A repeated second coordinate means two inputs share one output, and that breaks the definition of a function'
            - 'The definition forbids an input with two images, while outputs may repeat as often as they like'
            - 'The first coordinates are the only ones that can lie outside of the domain of the relation'
            - 'The second coordinates are never listed in the relation, so they cannot be compared'
          answer: 'The definition forbids an input with two images, while outputs may repeat as often as they like'
          why: 'A function sends each input to exactly one output; two inputs may share an output, but one input may not have two outputs.'
        try_first:
          problem: 'The relation $R = \{(1, x), (2, y), (2, z), (3, x)\}$ is defined on the inputs $1, 2, 3$. How many different outputs does the input $2$ have in $R$?'
          answer_contract: {"kind": "exact"}
          answer: '2'
          reveal: 'An input with two outputs breaks the definition of a function, because a function must send each input to exactly one output. The lesson turns this idea into a two-part check for every input.'
        exemplars:
          - problem: 'Let $A = \{1, 2, 3\}$ and $B = \{a, b, c\}$. Is the relation $R = \{(1, a), (2, c), (3, a)\}$ a function from $A$ to $B$?'
            answer: 'yes'
            answer_contract: {"kind": "label", "options": [["yes", "it is a function", "function", "R is a function"], ["no", "it is not a function", "not a function", "R is not a function", "it's not a function"]]}
            solution_sketch: 'Each of $1$, $2$, $3$ occurs as a first coordinate exactly once, so every input has exactly one image. The output $a$ is used twice, by $1$ and by $3$, but a function may send two inputs to one output. So $R$ is a function from $A$ to $B$.'
          - problem: 'Let $A = \{1, 2, 3, 4\}$ and $B = \{a, b, c\}$. Is the relation $R = \{(1, a), (2, b), (2, c), (4, a)\}$ a function from $A$ to $B$?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "it is a function", "function", "R is a function"], ["no", "it is not a function", "not a function", "R is not a function", "it's not a function"]]}
            solution_sketch: 'The input $2$ occurs in the pairs $(2, b)$ and $(2, c)$, so it has two images and uniqueness fails. The input $3$ occurs in no pair, so it has no image and existence fails as well. One failure is enough, so $R$ is not a function from $A$ to $B$.'
          - problem: 'A coat check gives each of the tickets $1, 2, 3, 4, 5$ one hook from $A, B, C, D$. The list of pairs (ticket, hook) is $(1, A), (2, C), (3, A), (4, B), (2, B), (5, D)$. This list is not a function from tickets to hooks. Which ticket number is assigned to two hooks?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Read down the list of first coordinates: $1, 2, 3, 4, 2, 5$. Only the ticket $2$ repeats, and it appears in $(2, C)$ and in $(2, B)$. So ticket $2$ has two hooks, and every other ticket has exactly one.'
          - problem: 'A shop lists pairs (item number, price in dollars) for the items $1$ to $6$: $(1, 5), (2, 8), (3, 5), (5, 9), (6, 8), (6, 7)$. Which item has no listed price?'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The first coordinates in the list are $1, 2, 3, 5, 6, 6$. The item number $4$ does not occur, so the existence condition fails for item $4$. Item $6$ fails the uniqueness condition, since it has the two prices $8$ and $7$, but only item $4$ has no price.'
          - problem: 'Sam claims that $R = \{(2, a), (4, b), (2, c), (3, a)\}$ is a function from $\{1, 2, 3, 4\}$ to $\{a, b, c\}$, and checks only that every second coordinate lies in the codomain. What is the smallest element of the domain that is not assigned exactly one output?'
            answer: '1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Sam skipped both conditions on the inputs. The input $1$ occurs in no pair, so it fails existence. The input $2$ occurs in $(2, a)$ and $(2, c)$, so it fails uniqueness. Scanning the domain in the order $1, 2, 3, 4$, the first failure is $1$.'
          - problem: 'Let $R = \{(1, a), (2, b), (1, c), (3, a), (3, d), (4, b)\}$ be a relation with domain $\{1, 2, 3, 4\}$ and codomain $\{a, b, c, d\}$. What is the fewest number of pairs that must be removed from $R$ so that it becomes a function?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The inputs $1$ and $3$ each occur in two pairs, and the inputs $2$ and $4$ occur once. Remove one pair for $1$ and one pair for $3$, for example $(1, c)$ and $(3, d)$; then every input has exactly one pair. A single removal cannot repair two different doubled inputs, so the fewest is $2$.'
          - problem: 'Let $R = \{(x, y) \in \mathbb{Z} \times \mathbb{Z} : y^2 = x\}$. What is the smallest positive integer $x$ that has no image under $R$?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The input $x$ has an image exactly when $x$ is the square of an integer. The integer $1 = 1^2$ has the images $1$ and $-1$, so it does have images. The number $2$ is not a perfect square, so $2$ has no image, and it is the smallest positive integer without one.'
          - problem: 'Write the full proof that $f = \{(x, y) \in \mathbb{Z} \times \mathbb{Z} : 3x + y = 4\}$ is a function from $\mathbb{Z}$ to $\mathbb{Z}$.'
            answer: '{(x,y): 3x+y=4} is a function Z->Z'
            answer_contract: {"kind": "none"}
            solution_sketch: 'By definition $f$ is a subset of $\mathbb{Z} \times \mathbb{Z}$, so it is a relation from $\mathbb{Z}$ to $\mathbb{Z}$. To show that it is a function, we must show that every integer $x$ is the first coordinate of exactly one pair in $f$. Existence. Let $x$ be an arbitrary integer and put $y = 4 - 3x$. Because $x$ is an integer, $y$ is an integer, and $3x + y = 3x + (4 - 3x) = 4$. Hence $(x, y) \in f$, so $x$ is the first coordinate of at least one pair. Uniqueness. Suppose that $(x, y_1) \in f$ and $(x, y_2) \in f$ are two pairs with the same first coordinate $x$. Then $3x + y_1 = 4$ and $3x + y_2 = 4$. Subtracting the second equation from the first gives $y_1 - y_2 = 0$, so $y_1 = y_2$, and the two pairs are equal. Hence $x$ is the first coordinate of exactly one pair of $f$. Since $x$ was an arbitrary integer, every integer is the first coordinate of exactly one pair of $f$. Therefore $f$ is a function from $\mathbb{Z}$ to $\mathbb{Z}$, and it is the function $f(x) = 4 - 3x$. $\square$'
        constraints: "check the existence-and-uniqueness condition on a listed relation"
      - id: kp2
        name: "Well-defined functions"
        key_prerequisites: [quantifiers]
        step_check:
          step: 'their difference $3n - 4$ is an integer'
          question: 'Why does the proof check that $3n - 4$ is an integer?'
          options:
            - 'Only integers can be subtracted, so the check shows the subtraction is allowed'
            - 'A non-integer output would be a second output, so uniqueness would fail'
            - 'The inputs are integers, so rules built from them give integers automatically'
            - 'The codomain is $\mathbb{Z}$, and every output must lie in the codomain'
          answer: 'The codomain is $\mathbb{Z}$, and every output must lie in the codomain'
          why: 'A rule is a function $\mathbb{Z} \to \mathbb{Z}$ only when every output lies in the stated codomain; an output outside $\mathbb{Z}$ would break the definition.'
        exemplars:
          - problem: 'The rule $g(x) = 1/x$ is proposed as a function from $\mathbb{R}$ to $\mathbb{R}$. For which real number $x$ does the rule give no output?'
            answer: '0'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A function from $\mathbb{R}$ to $\mathbb{R}$ must assign an output to every real number. The rule asks for $1/x$, and division by zero is not defined. So the rule gives no output at $x = 0$, and it is not a function from $\mathbb{R}$ to $\mathbb{R}$.'
          - problem: 'A clock shows the hours $1, 2, \dots, 12$. The rule $t(h) = h + 5$ is proposed as a function from $\{1, \dots, 12\}$ to $\{1, \dots, 12\}$ (''five hours later''). What is the smallest input $h$ for which $t(h)$ is not in the codomain?'
            answer: '8'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The output $h + 5$ lies in the codomain exactly when $h + 5 \le 12$, that is, when $h \le 7$. For $h = 8$ the rule gives $13$, which is not an hour on the clock. So the smallest input that leaves the codomain is $8$.'
          - problem: 'The rule $f(x) = x + 3$ for $x \le 2$ and $f(x) = 2x$ for $x \ge 2$ is proposed as a function from $\mathbb{R}$ to $\mathbb{R}$. For which real number $x$ do the two cases give two different outputs?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'An input that lies in both cases is given two outputs unless the two formulas agree there. Only $x = 2$ lies in both cases. The first case gives $2 + 3 = 5$ and the second gives $2 \cdot 2 = 4$, so $x = 2$ has two different outputs and the rule is not well defined.'
          - problem: 'Ana defines a rule on the rational numbers by $f(a/b) = a + b$, where $a/b$ is any fraction with integers $a$ and $b$. She computes $f(1/2) = 1 + 2 = 3$. The fraction $3/6$ equals $1/2$. What value does her rule give when she uses the fraction $3/6$?'
            answer: '9'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Using the fraction $3/6$, the rule gives $f(3/6) = 3 + 6 = 9$. But $3/6 = 1/2$ and the first computation gave $3$. One number has two outputs, $3$ and $9$, so Ana''s rule is not well defined.'
          - problem: 'For an integer $m$ write $[n]_m$ for the class of the integer $n$ modulo $m$. Sam defines a rule $f([n]_6) = [n]_4$ and checks $f([1]_6) = [1]_4$. Since $7$ and $1$ are in the same class modulo $6$, the rule also says $f([1]_6) = [7]_4$. Which integer from $0$ to $3$ represents the class $[7]_4$?'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The integer $7$ leaves the remainder $3$ when divided by $4$, so $[7]_4 = [3]_4$. But $[1]_4$ is a different class, since $3$ and $1$ differ by $2$, which is not a multiple of $4$. So the class $f([1]_6)$ would have two values, and Sam''s rule is not well defined.'
          - problem: 'Let $[n]_m$ be the class of $n$ modulo $m$. Is the rule $f([n]_{10}) = [n]_5$ a well-defined function from the classes modulo $10$ to the classes modulo $5$?'
            answer: 'yes'
            answer_contract: {"kind": "label", "options": [["yes", "it is well defined", "well defined", "it is a function", "well-defined", "it is well-defined"], ["no", "it is not well defined", "not well defined", "it is not a function", "it's not well defined", "not well-defined", "it is not well-defined"]]}
            solution_sketch: 'Suppose $[a]_{10} = [b]_{10}$, so $10$ divides $a - b$. Since $5$ divides $10$, also $5$ divides $a - b$, so $[a]_5 = [b]_5$. The output does not depend on the chosen representative, so the rule is well defined.'
          - problem: 'Let $[n]_m$ be the class of $n$ modulo $m$. Is the rule $f([n]_6) = [n]_4$ a well-defined function from the classes modulo $6$ to the classes modulo $4$?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "it is well defined", "well defined", "it is a function", "well-defined", "it is well-defined"], ["no", "it is not well defined", "not well defined", "it is not a function", "it's not well defined", "not well-defined", "it is not well-defined"]]}
            solution_sketch: 'The integers $1$ and $7$ are in the same class modulo $6$, but $[1]_4 \ne [7]_4$ because $4$ does not divide $7 - 1 = 6$. So one input class has two outputs. The rule is not well defined, because $4$ does not divide $6$.'
          - problem: 'Write the full proof that the rule $f([n]_6) = [n]_3$ is a well-defined function from $\mathbb{Z}_6$ to $\mathbb{Z}_3$, where $[n]_m = \{k \in \mathbb{Z} : m \mid k - n\}$ is the class of $n$ modulo $m$, $\mathbb{Z}_6$ is the set of classes modulo $6$ and $\mathbb{Z}_3$ is the set of classes modulo $3$.'
            answer: 'f([n]_6)=[n]_3 is well defined'
            answer_contract: {"kind": "none"}
            solution_sketch: 'Every element of $\mathbb{Z}_6$ has the form $[n]_6$ for some integer $n$, and the rule assigns to it the class $[n]_3$, which is an element of $\mathbb{Z}_3$. The same class can be written as $[a]_6$ and as $[b]_6$ with $a \ne b$, so the rule is a function only if the output does not depend on this choice. We must show: if $[a]_6 = [b]_6$, then $[a]_3 = [b]_3$. Suppose $[a]_6 = [b]_6$. Since $a \in [a]_6$, we get $a \in [b]_6$, so $6 \mid a - b$. Write $a - b = 6k$ for an integer $k$. Then $a - b = 3(2k)$ with $2k$ an integer, so $3 \mid a - b$. Now let $c \in [a]_3$. Then $3 \mid c - a$, and so $c - b = (c - a) + (a - b)$ is a sum of two multiples of $3$, hence $3 \mid c - b$ and $c \in [b]_3$. This shows $[a]_3 \subseteq [b]_3$, and exchanging the roles of $a$ and $b$ gives $[b]_3 \subseteq [a]_3$. Therefore $[a]_3 = [b]_3$. Every input class therefore has exactly one output class, which does not depend on the representative, so $f$ is a well-defined function from $\mathbb{Z}_6$ to $\mathbb{Z}_3$. $\square$'
        constraints: "verify each input has exactly one output in the stated codomain"
      - id: kp3
        name: "Equality of functions"
        key_prerequisites: [quantifiers]
        step_check:
          step: 'Since $x$ was arbitrary'
          question: 'Why does the proof stress that $x$ was an arbitrary real number?'
          options:
            - 'An arbitrary number is a number that was chosen at random, so no input can be missed'
            - 'The proof of $f = g$ needs only one input, and an arbitrary input is the easiest to use'
            - 'The argument used no special property of $x$, so it covers every input of the domain'
            - 'Arbitrary inputs make the codomains of $f$ and $g$ equal, which the definition requires'
          answer: 'The argument used no special property of $x$, so it covers every input of the domain'
          why: 'Equality of functions needs $f(x) = g(x)$ at every input, and an argument that uses nothing special about $x$ holds for all of them at once.'
        exemplars:
          - problem: 'Let $f, g : \mathbb{R} \to \mathbb{R}$ be defined by $f(x) = (x + 2)^2$ and $g(x) = x^2 + 4x + 4$. Are $f$ and $g$ equal functions?'
            answer: 'yes'
            answer_contract: {"kind": "label", "options": [["yes", "they are equal", "equal", "f = g", "the same function"], ["no", "they are not equal", "not equal", "f is not equal to g", "they're not equal", "f ≠ g", "f != g"]]}
            solution_sketch: 'Both functions have the domain $\mathbb{R}$ and the codomain $\mathbb{R}$. For every real $x$, expanding gives $(x + 2)^2 = x^2 + 4x + 4$, so $f(x) = g(x)$ at every input. All three conditions hold, so $f = g$.'
          - problem: 'Let $f : \mathbb{R} \to \mathbb{R}$ and $g : \mathbb{Z} \to \mathbb{Z}$ both be given by the rule $x \mapsto 2x$. Are $f$ and $g$ equal functions?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "they are equal", "equal", "f = g", "the same function"], ["no", "they are not equal", "not equal", "f is not equal to g", "they're not equal", "f ≠ g", "f != g"]]}
            solution_sketch: 'The rules agree wherever both are defined, but the domains differ: $f$ is defined on $\mathbb{R}$ and $g$ only on $\mathbb{Z}$. The codomains differ too. Equal functions need the same domain and the same codomain, so $f \ne g$.'
          - problem: 'Let $f, g : \mathbb{R} \to \mathbb{R}$ be given by $f(x) = x^2 + x$ and $g(x) = 2x$. These functions are not equal. What is the smallest positive integer $x$ at which $f(x) \ne g(x)$?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'At $x = 1$ we get $f(1) = 2$ and $g(1) = 2$, so the values agree. At $x = 2$ we get $f(2) = 6$ and $g(2) = 4$, which differ. One input where the outputs differ shows $f \ne g$, and $2$ is the smallest positive integer at which they differ.'
          - problem: 'A taxi company charges $f(d) = 3d + 4$ dollars for a ride of $d$ kilometers. A second company charges $g(d) = 5d - 2$ dollars. The two price functions are not equal. For which distance $d$ do the two companies charge the same price?'
            answer: '3'
            answer_contract: {"kind": "unit", "quantity": "length", "unit": "km", "allow_omitted": true}
            solution_sketch: 'The two companies charge the same price when $3d + 4 = 5d - 2$. Subtracting $3d$ and adding $2$ gives $6 = 2d$, so $d = 3$. At $3$ kilometers both charge $13$ dollars; at every other distance the prices differ, which is why the functions are not equal.'
          - problem: 'Sam says that $f, g : \mathbb{R} \to \mathbb{R}$, $f(x) = \sqrt{x^2}$ and $g(x) = x$, are equal functions, because they agree at $x = 1, 2, 3$. What is the greatest integer $x$ at which $f(x) \ne g(x)$?'
            answer: '-1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Since $\sqrt{x^2} = |x|$, the two functions agree exactly when $x \ge 0$. For every negative $x$ we have $|x| \ne x$. The greatest negative integer is $-1$, where $f(-1) = 1$ and $g(-1) = -1$.'
          - problem: 'Let $f, g : \{1, 2, 3, 4\} \to \mathbb{Z}$ be given by $f(x) = x^3$ and $g(x) = 6x^2 - 11x + 6$. These two functions agree at $x = 1, 2, 3$. At which element of the domain do they differ?'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'At $x = 1, 2, 3$ the two rules give $1, 8, 27$, so the functions agree there. At $x = 4$ the first rule gives $f(4) = 64$ and the second gives $g(4) = 96 - 44 + 6 = 58$. So the functions differ at $4$, and agreement at three inputs does not make them equal.'
          - problem: 'A lab converts a Celsius reading $c$ to Fahrenheit with $f(c) = \frac{9}{5}c + 32$. An old table uses the rule $g(c) = 2c + 30$ instead. The two rules are different functions. At which Celsius temperature do they give the same Fahrenheit reading?'
            answer: '10'
            answer_contract: {"kind": "unit", "quantity": "temperature", "unit": "°C", "allow_omitted": true}
            solution_sketch: 'The rules agree when $\frac{9}{5}c + 32 = 2c + 30$. Multiplying by $5$ gives $9c + 160 = 10c + 150$, so $c = 10$. At $10$ degrees both rules give $50$ degrees Fahrenheit, and at every other temperature they differ.'
          - problem: 'Write the full proof that for all functions $f : A \to B$, $g : B \to C$ and $h : C \to D$ we have $h \circ (g \circ f) = (h \circ g) \circ f$.'
            answer: 'h o (g o f) = (h o g) o f'
            answer_contract: {"kind": "none"}
            solution_sketch: 'Two functions are equal when they have the same domain, the same codomain and the same value at every input. The function $g \circ f$ goes from $A$ to $C$, so $h \circ (g \circ f)$ goes from $A$ to $D$. The function $h \circ g$ goes from $B$ to $D$, so $(h \circ g) \circ f$ also goes from $A$ to $D$. Thus both sides have domain $A$ and codomain $D$. Now let $x$ be an arbitrary element of $A$. By the definition of composition, $(h \circ (g \circ f))(x) = h((g \circ f)(x)) = h(g(f(x)))$. In the same way, $((h \circ g) \circ f)(x) = (h \circ g)(f(x)) = h(g(f(x)))$. The two values are equal for every $x \in A$. All three conditions hold, so $h \circ (g \circ f) = (h \circ g) \circ f$. $\square$'
        constraints: "compare domain, codomain, and outputs pointwise"
    diagnostic_exemplar:
      problem: 'Is $\{(x, y) \in \mathbb{R}^2 : y^2 = x\}$ a function $\mathbb{R} \to \mathbb{R}$? And do $f(x) = x^2$ on $\mathbb{R}$ and $g(x) = x^2$ on $[0, \infty)$ define the same function? Justify both answers.'
      answer: 'The relation is not a function $\mathbb{R} \to \mathbb{R}$, on two counts: uniqueness fails, since $x = 4$ is paired with both $y = 2$ and $y = -2$; and totality fails, since no real $y$ has $y^2 = -1$, so $x = -1$ gets no image. And $f \ne g$: two functions are equal only when they have the same domain, the same codomain and the same values, and here the domains differ ($\mathbb{R}$ versus $[0,\infty)$) even though the rule is identical.'
      solution_sketch: 'A function assigns exactly one output to every input of its domain; then recall that a function is its domain, codomain and rule taken together.'
    anki_seeds:
      - front: 'Formal definition of a function $f : A \to B$?'
        back: 'A subset $f \subseteq A \times B$ such that each $a \in A$ is the first coordinate of exactly one pair $(a, b) \in f$.'
        type: basic
      - front: 'When are two functions equal?'
        back: 'Same domain, same codomain, and $f(x) = g(x)$ for every $x$ in the domain.'
        type: basic

  - id: floor-ceiling-functions
    name: "Floor and Ceiling Functions"
    core: true
    difficulty: 0.50
    drill: false
    answer_kind: numeric
    expected_time_secs: 100
    prerequisites:
      - id: functions-formal-definition
        weight: 0.5
        key: true
      - id: function-notation
        weight: 0.2
    knowledge_points:
      - id: kp1
        name: "Evaluating floor and ceiling"
        key_prerequisites: [function-notation]
        step_check:
          step: '$\lfloor -2.7 \rfloor$ must be at or below $-2.7$'
          question: 'Why is $\lfloor -2.7 \rfloor$ equal to $-3$ and not to $-2$?'
          options:
            - 'Rounding down always drops the decimal part, and $-3$ is nearest to $-2.7$'
            - 'Negative numbers are rounded away from zero by every rounding function'
            - 'The number $-2$ is larger than $-2.7$, so it is not at or below $-2.7$'
            - 'The floor of a negative number is the number with its sign changed'
          answer: 'The number $-2$ is larger than $-2.7$, so it is not at or below $-2.7$'
          why: 'The floor is the greatest integer that is at most $x$; since $-2 > -2.7$, the integer $-2$ is too large, and the greatest integer at or below $-2.7$ is $-3$.'
        try_first:
          problem: 'On the number line, which integer is the nearest integer at or to the left of $-2.5$?'
          answer_contract: {"kind": "exact"}
          answer: '-3'
          reveal: 'Moving left on the number line from $-2.5$ you meet $-3$ first, because $-3 < -2.5 < -2$. This is the idea of the floor: the greatest integer that is at most the number.'
        exemplars:
          - problem: 'Evaluate $\lfloor 4.6 \rfloor + \lceil 4.1 \rceil$.'
            answer: '9'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The floor of $4.6$ is the greatest integer at most $4.6$, which is $4$. The ceiling of $4.1$ is the least integer at least $4.1$, which is $5$. The sum is $4 + 5 = 9$.'
          - problem: 'Evaluate $\lfloor -2.7 \rfloor$.'
            answer: '-3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The floor is the greatest integer that is at most $-2.7$. Since $-3 \le -2.7 < -2$, the answer is $-3$. Rounding down moves to the left on the number line, so a negative number moves away from zero.'
          - problem: 'Evaluate $\lceil -3.4 \rceil + \lfloor -3.4 \rfloor$.'
            answer: '-7'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The ceiling is the least integer at least $-3.4$. Because $-4 < -3.4 \le -3$, we get $\lceil -3.4 \rceil = -3$ and $\lfloor -3.4 \rfloor = -4$. The sum is $-3 + (-4) = -7$.'
          - problem: 'Evaluate $\lfloor \sqrt{5} \rfloor + \lceil \sqrt{5} \rceil$.'
            answer: '5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Since $2^2 = 4 < 5 < 9 = 3^2$, we have $2 < \sqrt{5} < 3$. So the floor of $\sqrt{5}$ is $2$ and the ceiling is $3$. The sum is $2 + 3 = 5$.'
          - problem: 'Sam says that $\lfloor -6.4 \rfloor = -6$, because ''you just drop the decimals''. What is the correct value of $\lfloor -6.4 \rfloor$?'
            answer: '-7'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Dropping the decimals gives $-6$, but $-6$ is larger than $-6.4$, so it is not at or below $-6.4$. The greatest integer at most $-6.4$ is $-7$, since $-7 \le -6.4 < -6$. So the correct value is $-7$.'
          - problem: 'A school must take $130$ pupils to a museum. Each bus holds $40$ pupils. How many buses must the school order?'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The number of buses must be at least $130/40 = 3.25$, and it must be a whole number. The least integer that is at least $3.25$ is $\lceil 3.25 \rceil = 4$. Three buses seat only $120$ pupils, so $4$ buses are needed.'
          - problem: 'A baker packs cookies in boxes of $12$. She has $100$ cookies. How many full boxes can she make?'
            answer: '8'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The number of full boxes is the whole number of times $12$ fits into $100$. Since $100/12 \approx 8.33$, the floor is $\lfloor 100/12 \rfloor = 8$. Eight boxes use $96$ cookies, and $4$ cookies are left over.'
        constraints: "evaluate at positives, negatives, and integers; negatives are the trap"
      - id: kp2
        name: "Basic identities"
        key_prerequisites: [functions-formal-definition]
        step_check:
          step: 'Now negate: $-\lceil -3.6 \rceil = -(-3) = 3$'
          question: 'Why does the right-hand side, $-\lceil -x \rceil$, give $3$ at $x = 3.6$ and not $4$?'
          options:
            - 'The least integer at least $-3.6$ is $-3$, and the minus sign then turns it into $3$'
            - 'The ceiling of $-3.6$ rounds away from zero to $-4$, and negating $-4$ gives $4$ rather than $3$'
            - 'The minus sign in front removes the ceiling, so the value is just $3.6$ rounded down to $3$'
            - 'Negating a ceiling always gives the integer part of the number, which is $3$ for $3.6$'
          answer: 'The least integer at least $-3.6$ is $-3$, and the minus sign then turns it into $3$'
          why: '$\lceil -3.6 \rceil = -3$ because $-3$ is the least integer at least $-3.6$; negating gives $3$, which equals $\lfloor 3.6 \rfloor$.'
        exemplars:
          - problem: 'Given that $\lfloor x \rfloor = 2$, find $\lfloor x + 5 \rfloor$.'
            answer: '7'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Adding an integer to $x$ shifts the floor by that integer: $\lfloor x + n \rfloor = \lfloor x \rfloor + n$. Here $n = 5$, so $\lfloor x + 5 \rfloor = 2 + 5 = 7$. Check with $x = 2.5$: $\lfloor 7.5 \rfloor = 7$.'
          - problem: 'Given that $\lceil x \rceil = 9$, find $\lceil x - 4 \rceil$.'
            answer: '5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'An integer shift passes through the ceiling: $\lceil x + n \rceil = \lceil x \rceil + n$. With $n = -4$ we get $\lceil x - 4 \rceil = 9 - 4 = 5$. Check with $x = 8.5$: $\lceil 4.5 \rceil = 5$.'
          - problem: 'Given that $\lfloor x \rfloor = -3$, find $\lceil -x \rceil$.'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The identity $\lceil -x \rceil = -\lfloor x \rfloor$ holds for every real $x$. So $\lceil -x \rceil = -(-3) = 3$. Check with $x = -2.5$: $\lfloor x \rfloor = -3$ and $\lceil 2.5 \rceil = 3$.'
          - problem: 'Is it true that $\lfloor x \rfloor - \lceil x \rceil = -1$ for every real number $x$?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "it is true", "true", "always"], ["no", "it is not true", "false", "not always", "it's not true", "not true"]]}
            solution_sketch: 'For a non-integer such as $x = 7.25$ we get $7 - 8 = -1$. But for an integer such as $x = 7$ the floor and the ceiling are both $7$, so the difference is $0$. One counterexample is enough, so the statement is not true for every real $x$.'
          - problem: 'Sam claims that $\lfloor x + y \rfloor = \lfloor x \rfloor + \lfloor y \rfloor$ for all real numbers $x$ and $y$. What is the value of $\lfloor x + y \rfloor - \lfloor x \rfloor - \lfloor y \rfloor$ when $x = y = 0.5$?'
            answer: '1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Here $\lfloor 0.5 + 0.5 \rfloor = \lfloor 1 \rfloor = 1$ and $\lfloor 0.5 \rfloor = 0$. So the difference is $1 - 0 - 0 = 1$, not $0$. The two sides of Sam''s claim differ at $x = y = 0.5$, so Sam is wrong.'
          - problem: 'A clerk packs eggs in boxes of $12$ and orders $\lfloor (N + 11)/12 \rfloor$ boxes for $N$ eggs. How many boxes does the formula give for $N = 100$?'
            answer: '9'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The formula gives $\lfloor 111/12 \rfloor = \lfloor 9.25 \rfloor = 9$. This agrees with $\lceil 100/12 \rceil = \lceil 8.33 \dots \rceil = 9$, the number of boxes needed to hold all the eggs. Adding $11$ before taking the floor is the same as rounding up.'
          - problem: 'A parking meter charges $2$ dollars for each started hour, so a stay of $t$ hours costs $2\lceil t \rceil$ dollars. Ana parks for $3.4$ hours and then stays one more hour. What is her bill?'
            answer: '10'
            answer_contract: {"kind": "unit", "quantity": "dollar", "unit": "dollar", "allow_omitted": true}
            solution_sketch: 'The new stay is $3.4 + 1 = 4.4$ hours, and $\lceil 4.4 \rceil = 5$ started hours. The bill is $2 \cdot 5 = 10$ dollars. This agrees with the rule $\lceil t + 1 \rceil = \lceil t \rceil + 1$, which gives $4 + 1 = 5$ started hours.'
          - problem: 'Does the identity $\lfloor x + n \rfloor = \lfloor x \rfloor + n$ hold for every real number $x$ and every integer $n$?'
            answer: 'yes'
            answer_contract: {"kind": "label", "options": [["yes", "it is true", "true", "always"], ["no", "it is not true", "false", "not always", "it's not true", "not true"]]}
            solution_sketch: 'Let $m = \lfloor x \rfloor$, so $m \le x < m + 1$. Adding the integer $n$ gives $m + n \le x + n < m + n + 1$. So the greatest integer at most $x + n$ is $m + n$, which is $\lfloor x \rfloor + n$, and the identity holds.'
        constraints: "Choose and justify general floor/ceiling rewrites, respecting integer shifts and the distinction between integer and noninteger arguments; do not merely evaluate a supplied identity at one point."
      - id: kp3
        name: "Solving with floors and ceilings"
        key_prerequisites: [functions-formal-definition]
        step_check:
          step: '$x = -1$ has $\lfloor -1 \rfloor = -1$, so it is excluded'
          question: 'Why is $x = -1$ left out of the solution of $\lfloor x \rfloor = -2$?'
          options:
            - 'The value $x = -1$ is the right end of the interval, and right ends are always excluded'
            - 'The floor of $-1$ is $-2$ only for non-integer numbers, and $-1$ is an integer'
            - 'The interval must be open on both sides, because the floor is a strict inequality'
            - 'The floor of $-1$ is $-1$, not $-2$, so $-1$ does not satisfy the equation'
          answer: 'The floor of $-1$ is $-1$, not $-2$, so $-1$ does not satisfy the equation'
          why: 'Every solution must satisfy the equation itself: $\lfloor -1 \rfloor = -1 \ne -2$, so $-1$ is not a solution, while $\lfloor -2 \rfloor = -2$ shows the left end $-2$ is included.'
        exemplars:
          - problem: 'Find all real numbers $x$ with $\lfloor x \rfloor = 7$.'
            answer: '7 <= x < 8'
            answer_contract: {"kind": "inequality_union"}
            solution_sketch: 'The floor of $x$ equals $7$ exactly when $7$ is the greatest integer at most $x$. That means $7 \le x$ and $x < 8$. So the solutions are the real numbers with $7 \le x < 8$.'
          - problem: 'Find all real numbers $x$ with $\lceil x \rceil = -2$.'
            answer: '-3 < x <= -2'
            answer_contract: {"kind": "inequality_union"}
            solution_sketch: 'The ceiling of $x$ equals $n$ exactly when $n - 1 < x \le n$. With $n = -2$ this reads $-3 < x \le -2$. Check the ends: $\lceil -3 \rceil = -3$, so $-3$ is excluded, and $\lceil -2 \rceil = -2$, so $-2$ is included.'
          - problem: 'Find all real numbers $x$ with $\lfloor 2x - 1 \rfloor = 3$.'
            answer: '2 <= x < 5/2'
            answer_contract: {"kind": "inequality_union"}
            solution_sketch: 'The equation holds exactly when $3 \le 2x - 1 < 4$. Adding $1$ gives $4 \le 2x < 5$. Dividing by $2$ gives $2 \le x < 5/2$.'
          - problem: 'Find all real numbers $x$ with $\lceil 3x \rceil = 5$.'
            answer: '4/3 < x <= 5/3'
            answer_contract: {"kind": "inequality_union"}
            solution_sketch: 'The ceiling of $3x$ equals $5$ exactly when $4 < 3x \le 5$. Dividing by $3$ gives $4/3 < x \le 5/3$. At $x = 5/3$ we get $3x = 5$ and $\lceil 5 \rceil = 5$, so the right end is included.'
          - problem: 'A taxi charges $2$ dollars for each started kilometer, so a ride of $d$ kilometers costs $2\lceil d \rceil$ dollars. A ride costs $14$ dollars. What are the possible distances $d$?'
            answer: '6 < d <= 7'
            answer_contract: {"kind": "inequality_union"}
            solution_sketch: 'The fare is $14$, so $2\lceil d \rceil = 14$ and $\lceil d \rceil = 7$. The ceiling equals $7$ exactly when $6 < d \le 7$. So the ride was longer than $6$ kilometers and at most $7$ kilometers.'
          - problem: 'Sam solves $\lceil x \rceil = 6$ and writes $6 \le x < 7$. What is the correct set of solutions?'
            answer: '5 < x <= 6'
            answer_contract: {"kind": "inequality_union"}
            solution_sketch: 'Sam used the rule for the floor. For the ceiling, $\lceil x \rceil = 6$ means that $6$ is the least integer at least $x$, so $5 < x \le 6$. Check: $x = 6.5$ has ceiling $7$, so it is not a solution, while $x = 6$ is a solution.'
          - problem: 'A child''s age in completed years is $\lfloor a \rfloor$, where $a$ is the exact age in years. A child is $12$ years old in this sense. What are the possible exact ages $a$?'
            answer: '12 <= a < 13'
            answer_contract: {"kind": "inequality_union"}
            solution_sketch: 'The completed years equal $12$ exactly when $\lfloor a \rfloor = 12$, that is, $12 \le a < 13$. The child has already had the twelfth birthday, so $a = 12$ is allowed. The thirteenth birthday has not come, so $a = 13$ is not allowed.'
          - problem: 'Find all real numbers $x$ with $\lfloor x \rfloor = 5$ or $\lceil x \rceil = 5$.'
            answer: '4 < x < 6'
            answer_contract: {"kind": "inequality_union"}
            solution_sketch: 'The floor equation gives $5 \le x < 6$ and the ceiling equation gives $4 < x \le 5$. The union of these two intervals is $4 < x < 6$. The point $x = 5$ lies in both.'
        constraints: "solution sets of $\\lfloor x \\rfloor = n$ or $\\lceil x \\rceil = n$ as intervals"
    diagnostic_exemplar:
      problem: 'Compute $\lfloor -2.4 \rfloor + \lceil 1.2 \rceil$, and describe all real $x$ with $\lceil x \rceil = 3$.'
      answer_contract: {kind: none}
      answer: '$\lfloor -2.4 \rfloor = -3$ (the greatest integer not exceeding $-2.4$) and $\lceil 1.2 \rceil = 2$, so the sum is $-1$. And $\lceil x \rceil = 3$ exactly when $2 < x \le 3$, i.e. $x \in (2, 3]$: the least integer at or above $x$ equals $3$ precisely for those $x$.'
      solution_sketch: 'Round down for the floor (careful with negatives) and up for the ceiling; then read the ceiling condition as a half-open interval.'
    anki_seeds:
      - front: 'Definition of $\lfloor x \rfloor$?'
        back: 'The greatest integer $\le x$ (so $\lfloor x \rfloor \le x < \lfloor x \rfloor + 1$).'
        type: basic
      - front: 'Definition of $\lceil x \rceil$?'
        back: 'The least integer $\ge x$.'
        type: basic

  - id: computing-compositions
    name: "Computing Compositions"
    core: true
    difficulty: 0.55
    drill: false
    answer_kind: numeric
    expected_time_secs: 110
    prerequisites:
      - id: functions-formal-definition
        weight: 0.5
        key: true
      - id: function-composition
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: "Composing formulas"
        key_prerequisites: [function-composition]
        step_check:
          step: 'so we will substitute $4x$ into $f$'
          question: 'Why do we replace every $x$ in the formula of $f$ by $4x$, and not every $x$ in the formula of $g$ by $f(x)$?'
          options:
            - 'The function with the larger numbers always goes on the inside of the composition'
            - 'Substituting into $g$ gives the same result, because the order of composition does not matter'
            - 'The first function in the written product, $f$, is always applied first to $x$'
            - 'The notation $(f \circ g)(x)$ means $f(g(x))$, so the output of $g$ is the input of $f$'
          answer: 'The notation $(f \circ g)(x)$ means $f(g(x))$, so the output of $g$ is the input of $f$'
          why: 'In $f(g(x))$ the function $g$ acts first and its output $4x$ becomes the input of $f$; the other order $g(f(x))$ is a different composition.'
        try_first:
          problem: 'Let $f(x) = x + 1$ and $g(x) = 2x$. What is $f(g(3))$?'
          answer_contract: {"kind": "exact"}
          answer: '7'
          reveal: 'First $g(3) = 6$, and then $f(6) = 7$: the inner function acts first and its output goes into the outer function. The lesson does the same with a formula instead of a number.'
        exemplars:
          - problem: 'Let $f(x) = x^2 + 2$ and $g(x) = 4x$. Find $(f \circ g)(x)$.'
            answer: '16x^2 + 2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'By definition $(f \circ g)(x) = f(g(x))$, so $g$ acts first. Substitute $g(x) = 4x$ for $x$ in the formula of $f$: $(4x)^2 + 2$. Since $(4x)^2 = 16x^2$, the composite is $16x^2 + 2$.'
          - problem: 'Let $f(x) = 3x - 2$ and $g(x) = x^2 + 1$. Find $(g \circ f)(x)$.'
            answer: '9x^2 - 12x + 5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'By definition $(g \circ f)(x) = g(f(x))$, so $f$ acts first. Substitute $3x - 2$ for $x$ in $g$: $(3x - 2)^2 + 1 = 9x^2 - 12x + 4 + 1$. Collecting terms gives $9x^2 - 12x + 5$.'
          - problem: 'Sam computes $(f \circ g)(x)$ for $f(x) = x^2$ and $g(x) = x + 3$ and writes $x^2 + 3$. What is the correct value of $(f \circ g)(x)$?'
            answer: 'x^2 + 6x + 9'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Sam added $3$ after squaring, which is $g(f(x))$. The composite $(f \circ g)(x) = f(g(x))$ squares the whole output of $g$: $(x + 3)^2$. Expanding gives $x^2 + 6x + 9$.'
          - problem: 'Let $f(x) = \sqrt{x}$ and $g(x) = x^2 + 9$. Find $(f \circ g)(x)$.'
            answer: 'sqrt(x^2 + 9)'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Here $(f \circ g)(x) = f(g(x))$, so the inner function is $g(x) = x^2 + 9$. Putting it under the square root gives $\sqrt{x^2 + 9}$. This cannot be simplified further, because $\sqrt{x^2 + 9}$ is not $x + 3$.'
          - problem: 'Let $f(x) = 5/x$ and $g(x) = x - 1$. Find $(g \circ f)(2)$.'
            answer: '3/2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The function $f$ acts first: $f(2) = 5/2$. Then $g$ is applied to this value: $g(5/2) = 5/2 - 1 = 3/2$. So $(g \circ f)(2) = 3/2$.'
          - problem: 'Let $f(x) = 3x + 2$. Suppose that $(f \circ g)(x) = 6x^2 - 1$ for all real $x$. Find $g(x)$.'
            answer: '2x^2 - 1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'By definition $(f \circ g)(x) = f(g(x)) = 3g(x) + 2$. Setting this equal to $6x^2 - 1$ gives $3g(x) = 6x^2 - 3$. Dividing by $3$ gives $g(x) = 2x^2 - 1$.'
          - problem: 'A taxi charges $C(d) = 2d + 3$ dollars for a ride of $d$ kilometers. After $t$ hours at a steady speed of $40$ kilometers per hour, the distance is $d(t) = 40t$ kilometers. Write the cost of the ride as a function of $t$.'
            answer: '80t + 3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The cost depends on the distance, and the distance depends on the time, so the cost is $C(d(t))$. Substitute $d = 40t$ into $C$: $2 \cdot 40t + 3$. This simplifies to $80t + 3$ dollars.'
          - problem: 'A car uses $G(d) = d/12$ gallons of fuel on a trip of $d$ miles. It drives at $54$ miles per hour, so after $h$ hours the distance is $d(h) = 54h$ miles. Write the fuel used as a function of $h$.'
            answer: '9h/2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The fuel used is $G(d(h))$. Substitute $d = 54h$ into $G$: $54h/12$. Dividing the numerator and the denominator by $6$ gives $9h/2$ gallons.'
        constraints: "compose two given formulas in both orders; symbolic or at a point"
      - id: kp2
        name: "Composing on finite sets"
        key_prerequisites: [functions-formal-definition]
        step_check:
          step: 'so $(g \circ f)(1) = g(3) = 1$'
          question: 'Why do we evaluate $g$ at $3$ and not at $1$ when computing $(g \circ f)(1)$?'
          options:
            - 'The input $1$ is the first element of the set, and the first element is used only by $f$'
            - 'Because $f(1) = 3$, and the output of the inner function $f$ is the input of $g$'
            - 'The table of $g$ has no entry for $1$, so the next value of the table is used'
            - 'Both functions are applied to $1$, and then the two results are combined into one'
          answer: 'Because $f(1) = 3$, and the output of the inner function $f$ is the input of $g$'
          why: '$(g \circ f)(1) = g(f(1))$: first find $f(1) = 3$ in the table of $f$, then look up $3$ in the table of $g$.'
        exemplars:
          - problem: 'On $A = \{1, 2, 3\}$ the function $f$ sends $1$ to $2$, $2$ to $3$ and $3$ to $2$, and $g$ sends $1$ to $3$, $2$ to $2$ and $3$ to $3$. Find $(g \circ f)(1)$.'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'By definition $(g \circ f)(1) = g(f(1))$. The function $f$ sends $1$ to $2$, and then $g$ sends $2$ to $2$. So $(g \circ f)(1) = 2$.'
          - problem: 'On $A = \{1, 2, 3, 4\}$ let $f$ send $1$ to $3$, $2$ to $4$, $3$ to $2$ and $4$ to $4$. Find $(f \circ f)(3)$.'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Apply $f$ twice, starting at $3$. The first application gives $f(3) = 2$, and the second gives $f(2) = 4$. So $(f \circ f)(3) = 4$.'
          - problem: 'On $A = \{1, 2, 3, 4\}$ let $f$ send $1$, $2$, $3$ to $3$ and $4$ to $4$, and let $g$ send $1$ to $4$, $2$ to $4$, $3$ to $2$ and $4$ to $1$. For which element $x$ of $A$ is $(g \circ f)(x) = 1$?'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Compute $g(f(x))$ for each $x$. For $x = 1, 2, 3$ we get $g(3) = 2$. For $x = 4$ we get $g(f(4)) = g(4) = 1$. So $x = 4$ is the only element with $(g \circ f)(x) = 1$.'
          - problem: 'On $A = \{1, 2, 3\}$ the composite $h = g \circ f$ sends $1$ to $2$, $2$ to $3$ and $3$ to $3$. The function $f$ sends $1$ to $2$, $2$ to $1$ and $3$ to $3$. Find $g(2)$.'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'We know $h(x) = g(f(x))$. The input $1$ has $f(1) = 2$, so $g(2) = g(f(1)) = h(1) = 2$. So $g(2) = 2$.'
          - problem: 'On $A = \{1, 2, 3\}$ let $f$ send $1$ to $3$, $2$ to $1$ and $3$ to $1$. Find $(f \circ f \circ f)(2)$.'
            answer: '1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Apply $f$ three times, starting at $2$. The first application gives $f(2) = 1$, the second gives $f(1) = 3$ and the third gives $f(3) = 1$. So $(f \circ f \circ f)(2) = 1$.'
          - problem: 'Five children stand in a circle and each passes a note to a fixed child. Child $1$ passes to $3$, child $2$ to $4$, child $3$ to $5$, child $4$ to $1$ and child $5$ to $2$. The note starts with child $2$ and is passed three times. Which child holds it at the end?'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Follow the note: child $2$ passes to $4$, child $4$ passes to $1$, and child $1$ passes to $3$. In symbols, $f(f(f(2))) = f(f(4)) = f(1) = 3$. The note ends with child $3$.'
          - problem: 'An airline flies between four cities $1, 2, 3, 4$. On the first day each traveler takes the flight $f$: $1 \to 2$, $2 \to 4$, $3 \to 1$, $4 \to 3$. On the second day each takes the flight $g$: $1 \to 4$, $2 \to 3$, $3 \to 2$, $4 \to 1$. A traveler starts in city $3$. In which city is the traveler after the second day?'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'After the first day the traveler is in $f(3) = 1$. After the second day the traveler is in $g(1) = 4$. So $(g \circ f)(3) = 4$, and the traveler ends in city $4$.'
          - problem: 'On $A = \{1, 2, 3, 4\}$ the function $f$ sends $1$ to $3$, $2$ to $4$, $3$ to $3$ and $4$ to $2$, and $g$ sends $1$ to $4$, $2$ to $3$, $3$ to $2$ and $4$ to $4$. Find $(f \circ g)(3)$.'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'By definition $(f \circ g)(3) = f(g(3))$. The function $g$ sends $3$ to $2$, and then $f$ sends $2$ to $4$. So $(f \circ g)(3) = 4$, whereas $(g \circ f)(3) = g(3) = 2$ shows that the order matters.'
        constraints: "functions given by tables or arrow diagrams on a 3-4 element set"
      - id: kp3
        name: "Domains and order of composition"
        key_prerequisites: [functions-formal-definition]
        step_check:
          step: '$f$ needs a nonnegative input'
          question: 'Why is the condition for the natural domain $x - 9 \ge 0$ and not $x \ge 0$?'
          options:
            - 'The number $9$ must be added to $x$ before the square root can be taken'
            - 'The domain of $g$ is $x \ge 9$, and the square root only repeats that restriction'
            - 'The square root receives $g(x) = x - 9$, so that value must be nonnegative'
            - 'The condition $x \ge 0$ is correct, and $x - 9 \ge 0$ is a different condition on $g$'
          answer: 'The square root receives $g(x) = x - 9$, so that value must be nonnegative'
          why: 'The outer function $f$ receives the number $g(x) = x - 9$, so it is $x - 9$ that must be nonnegative; this gives $x \ge 9$.'
        exemplars:
          - problem: 'Let $f(x) = \sqrt{x}$ and $g(x) = x - 5$. Find the natural domain of $f \circ g$.'
            answer: 'x >= 5'
            answer_contract: {"kind": "inequality_union"}
            solution_sketch: 'The composite is $(f \circ g)(x) = \sqrt{x - 5}$. The square root needs a nonnegative input, so $x - 5 \ge 0$. Hence the natural domain is $x \ge 5$.'
          - problem: 'Let $f(x) = 2x + 1$ and $g(x) = x^2$. Is $f \circ g = g \circ f$?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "they are equal", "equal", "f o g = g o f"], ["no", "they are not equal", "not equal", "f o g is not g o f", "they're not equal"]]}
            solution_sketch: 'Test one input. At $x = 3$ we get $(f \circ g)(3) = f(9) = 19$ and $(g \circ f)(3) = g(7) = 49$. The values differ, so the two composites are not equal.'
          - problem: 'Let $f(x) = \sqrt{x}$ and $g(x) = 1/(x - 3)$. Find the natural domain of $f \circ g$.'
            answer: 'x > 3'
            answer_contract: {"kind": "inequality_union"}
            solution_sketch: 'The composite is $(f \circ g)(x) = \sqrt{1/(x - 3)}$. The square root needs $1/(x - 3) \ge 0$, and the fraction is never zero, so $1/(x - 3) > 0$. That holds exactly when the denominator $x - 3$ is positive, so $x > 3$.'
          - problem: 'Let $f(x) = \sqrt{x}$ and $g(x) = 4 - x^2$. Find the natural domain of $f \circ g$.'
            answer: '-2 <= x <= 2'
            answer_contract: {"kind": "inequality_union"}
            solution_sketch: 'The composite is $(f \circ g)(x) = \sqrt{4 - x^2}$. The square root needs $4 - x^2 \ge 0$, that is, $x^2 \le 4$. This holds exactly for $-2 \le x \le 2$.'
          - problem: 'Let $f(x) = 1/x$ and $g(x) = \sqrt{x}$. Find the natural domain of $g \circ f$.'
            answer: 'x > 0'
            answer_contract: {"kind": "inequality_union"}
            solution_sketch: 'The composite is $(g \circ f)(x) = \sqrt{1/x}$. The function $f$ needs $x \ne 0$, and the square root needs $1/x \ge 0$. A reciprocal is nonnegative only for positive $x$, so $x > 0$.'
          - problem: 'Let $f(x) = \sqrt{x}$ and $g(x) = x^2 - 9$. Find the natural domain of $f \circ g$.'
            answer: 'x <= -3 or x >= 3'
            answer_contract: {"kind": "inequality_union"}
            solution_sketch: 'The composite is $(f \circ g)(x) = \sqrt{x^2 - 9}$. The square root needs $x^2 - 9 \ge 0$, that is, $x^2 \ge 9$. This holds for $x \le -3$ and for $x \ge 3$.'
          - problem: 'Sam tests $f(x) = x^2$ and $g(x) = x + 3$ at $x = -1$ and finds $(f \circ g)(-1) = 4 = (g \circ f)(-1)$. Sam concludes that $f \circ g = g \circ f$. What is the value of $(f \circ g)(1) - (g \circ f)(1)$?'
            answer: '12'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'At $x = 1$ we get $(f \circ g)(1) = f(4) = 16$ and $(g \circ f)(1) = g(1) = 4$. The difference is $16 - 4 = 12$. One input with different values shows that $f \circ g \ne g \circ f$, so Sam''s single test proved nothing.'
          - problem: 'A square tile has area $a(t) = t - 9$ square centimeters at oven setting $t$, and its side length is $s(a) = \sqrt{a}$ centimeters. For which settings $t$ is the side length $s(a(t))$ defined?'
            answer: 't >= 9'
            answer_contract: {"kind": "inequality_union"}
            solution_sketch: 'The side length is $s(a(t)) = \sqrt{t - 9}$. The square root needs $t - 9 \ge 0$. So the side length is defined exactly for $t \ge 9$.'
          - problem: 'A tank holds $V(t) = 100 - 4t$ liters after $t \ge 0$ minutes, and the depth is $h(V) = \sqrt{V}$ centimeters. For which times $t \ge 0$ is the depth $h(V(t))$ defined?'
            answer: '0 <= t <= 25'
            answer_contract: {"kind": "inequality_union"}
            solution_sketch: 'The depth is $h(V(t)) = \sqrt{100 - 4t}$, which needs $100 - 4t \ge 0$. Dividing $100 \ge 4t$ by $4$ gives $t \le 25$. Together with $t \ge 0$ the depth is defined for $0 \le t \le 25$.'
        constraints: "track the domain of the composite; show noncommutativity by one evaluation"
    diagnostic_exemplar:
      problem: 'For $f(x) = x + 3$ and $g(x) = x^2$, compute $(g \circ f)(1)$ and $(f \circ g)(1)$.'
      answer_contract: {kind: none}
      answer: '$16$ and $4$.'
      solution_sketch: '$g(f(1)) = g(4) = 16$; $f(g(1)) = f(1) = 4$.'
    anki_seeds:
      - front: 'Is function composition commutative?'
        back: 'No in general: $f \circ g \ne g \circ f$ (e.g. $x^2$ and $x + 1$).'
        type: basic
      - front: 'Natural domain of $g \circ f$?'
        back: 'All $x$ in the domain of $f$ with $f(x)$ in the domain of $g$.'
        type: basic

  - id: proving-injectivity
    name: "Proving Injectivity"
    core: true
    difficulty: 0.57
    drill: false
    answer_kind: proof
    expected_time_secs: 170
    prerequisites:
      - id: functions-formal-definition
        weight: 0.6
        key: true
      - id: direct-proof
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: "The injectivity template"
        key_prerequisites: [functions-formal-definition]
        step_check:
          step: 'Then divide both sides by $4$'
          question: 'Why may both sides of $4a = 4b$ be divided by $4$?'
          options:
            - 'Because $4$ is not zero, the division keeps the equation true and gives $a = b$'
            - 'Dividing by a number never changes an equation, whatever the number is'
            - 'Division is the only operation that can turn an equation of outputs into one of inputs'
            - 'The inputs $a$ and $b$ are real numbers, and real numbers can always be divided by $4$'
          answer: 'Because $4$ is not zero, the division keeps the equation true and gives $a = b$'
          why: 'Division by a nonzero number is reversible, so $4a = 4b$ gives $a = b$; for a coefficient $0$ the step would fail, and that is exactly the constant function.'
        try_first:
          problem: 'Let $f(x) = 3x + 1$ on $\mathbb{R}$. Suppose that $a = 2$ and $f(a) = f(b)$. What must $b$ be?'
          answer_contract: {"kind": "exact"}
          answer: '2'
          reveal: 'Here $f(2) = 7$ and $3b + 1 = 7$ forces $b = 2$: two different inputs cannot give the output $7$. This is what injective means, and the lesson shows how to prove it for every pair of inputs at once.'
        exemplars:
          - problem: 'Is the function $f : \mathbb{R} \to \mathbb{R}$, $f(x) = 4x - 9$, injective?'
            answer: 'yes'
            answer_contract: {"kind": "label", "options": [["yes", "it is injective", "injective", "one-to-one"], ["no", "it is not injective", "not injective", "not one-to-one", "it's not injective", "not 1-1"]]}
            solution_sketch: 'Suppose $f(a) = f(b)$, so $4a - 9 = 4b - 9$. Adding $9$ gives $4a = 4b$, and dividing by $4 \ne 0$ gives $a = b$. Equal outputs force equal inputs, so $f$ is injective.'
          - problem: 'Is the constant function $f : \mathbb{R} \to \mathbb{R}$, $f(x) = 7$, injective?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "it is injective", "injective", "one-to-one"], ["no", "it is not injective", "not injective", "not one-to-one", "it's not injective", "not 1-1"]]}
            solution_sketch: 'The inputs $1$ and $2$ are different, but $f(1) = 7 = f(2)$. Two different inputs share one output, so $f$ is not injective. In the template, the line $0 \cdot a = 0 \cdot b$ cannot be divided by $0$.'
          - problem: 'The function $f : \mathbb{R} \to \mathbb{R}$, $f(x) = |x - 3|$, is not injective, because $f(5) = 2$. What is the other real number $x$ with $f(x) = 2$?'
            answer: '1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'We need $|x - 3| = 2$, so $x - 3 = 2$ or $x - 3 = -2$. The first case gives $x = 5$, and the second gives $x = 1$. So $f(1) = 2 = f(5)$, and the other input is $1$.'
          - problem: 'The function $f : \mathbb{Z} \to \mathbb{Z}$, $f(n) = n^2 - 4n$, satisfies $f(0) = 0$. What is the other integer $n$ with $f(n) = 0$?'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'We solve $n^2 - 4n = 0$, which factors as $n(n - 4) = 0$. So $n = 0$ or $n = 4$. Hence $f(4) = 0 = f(0)$, the function is not injective, and the other input is $4$.'
          - problem: 'A phone plan charges $c(m) = 0.1m + 5$ dollars for $m$ minutes of calls. Ana''s March bill equals her April bill, and she called for $120$ minutes in March. For how many minutes did she call in April?'
            answer: '120'
            answer_contract: {"kind": "unit", "quantity": "time", "unit": "minute", "allow_omitted": true}
            solution_sketch: 'The plan is injective: if $0.1a + 5 = 0.1b + 5$, then $0.1a = 0.1b$ and $a = b$. So equal bills come from equal minutes. Ana called for $120$ minutes in April as well.'
          - problem: 'A thermometer converts Celsius to Fahrenheit by $F(c) = \frac{9}{5}c + 32$. Two thermometers show the same Fahrenheit reading, and the first shows $20$ degrees Celsius. What does the second show in Celsius?'
            answer: '20'
            answer_contract: {"kind": "unit", "quantity": "temperature", "unit": "°C", "allow_omitted": true}
            solution_sketch: 'Suppose $F(a) = F(b)$. Then $\frac{9}{5}a + 32 = \frac{9}{5}b + 32$, so $\frac{9}{5}a = \frac{9}{5}b$, and dividing by $\frac{9}{5} \ne 0$ gives $a = b$. Equal Fahrenheit readings come from equal Celsius readings, so the second shows $20$ degrees.'
          - problem: 'For which real number $c$ is the function $f : \mathbb{R} \to \mathbb{R}$, $f(x) = cx + 4$, not injective?'
            answer: '0'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'If $f(a) = f(b)$, then $ca + 4 = cb + 4$, so $c(a - b) = 0$. When $c \ne 0$ this forces $a = b$, so $f$ is injective. When $c = 0$ the function is the constant $4$, and $f(1) = f(2)$, so the answer is $c = 0$.'
          - problem: 'Write the full proof that $f : \mathbb{R} \to \mathbb{R}$ defined by $f(x) = \pi x - e$ is injective.'
            answer: 'f(x) = pi x - e is injective'
            answer_contract: {"kind": "none"}
            solution_sketch: 'Recall that $f$ is injective if for all $a, b \in \mathbb{R}$, $f(a) = f(b)$ implies $a = b$. Let $a, b \in \mathbb{R}$ and suppose that $f(a) = f(b)$. By the definition of $f$, this says $\pi a - e = \pi b - e$. Adding $e$ to both sides gives $\pi a = \pi b$. Since $\pi \ne 0$, we may divide both sides by $\pi$, and we get $a = b$. We have shown that $f(a) = f(b)$ implies $a = b$ for all real numbers $a$ and $b$. Therefore $f$ is injective. $\square$'
        constraints: "affine maps; the standard assume-$f(a)=f(b)$-derive-$a=b$ template Closed exemplars may audit general proofs of this method; do not certify proposed inferences in the problem."
      - id: kp2
        name: "Nonlinear examples"
        key_prerequisites: [direct-proof]
        step_check:
          step: 'multiply both sides by $ab$'
          question: 'Why does the proof first note that $a \neq 0$ and $b \neq 0$ before multiplying by $ab$?'
          options:
            - 'The numbers $a$ and $b$ must be nonzero so that the output $3/a$ is a whole number'
            - 'Both sides of an equation may only be multiplied by a nonzero number if it is an integer'
            - 'Multiplying by $ab$ is wrong if $ab = 0$, because the equation becomes $0 = 0$'
            - 'A zero input would be a second input with the same output, so injectivity would fail'
          answer: 'Multiplying by $ab$ is wrong if $ab = 0$, because the equation becomes $0 = 0$'
          why: 'The factor $ab$ is nonzero because $a, b \neq 0$ (these numbers are in the domain), so multiplying by it loses no information; multiplying by $0$ would lose all of it.'
        exemplars:
          - problem: 'Is the function $f : \mathbb{R} \setminus \{0\} \to \mathbb{R}$, $f(x) = \dfrac{5}{x} + 2$, injective?'
            answer: 'yes'
            answer_contract: {"kind": "label", "options": [["yes", "it is injective", "injective", "one-to-one"], ["no", "it is not injective", "not injective", "not one-to-one", "it's not injective", "not 1-1"]]}
            solution_sketch: 'Suppose $f(a) = f(b)$, so $5/a + 2 = 5/b + 2$. Subtracting $2$ gives $5/a = 5/b$, and multiplying by $ab \ne 0$ gives $5b = 5a$. Dividing by $5$ gives $a = b$, so $f$ is injective.'
          - problem: 'Is the function $f : \mathbb{R} \setminus \{0\} \to \mathbb{R}$, $f(x) = \dfrac{1}{x^2}$, injective?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "it is injective", "injective", "one-to-one"], ["no", "it is not injective", "not injective", "not one-to-one", "it's not injective", "not 1-1"]]}
            solution_sketch: 'Take $a = 1$ and $b = -1$. Then $f(1) = 1 = f(-1)$ although $1 \ne -1$. Two different inputs give the same output, so $f$ is not injective.'
          - problem: 'A cube-shaped tank with side $s$ meters holds $V(s) = s^3$ cubic meters. Two tanks hold the same volume, and the first has side $3$ meters. What is the side of the second tank?'
            answer: '3'
            answer_contract: {"kind": "unit", "quantity": "length", "unit": "m", "allow_omitted": true}
            solution_sketch: 'Suppose $a^3 = b^3$ for positive sides $a$ and $b$. Then $(a - b)(a^2 + ab + b^2) = 0$, and the second factor is positive, so $a = b$. The volume determines the side, so the second tank also has side $3$ meters.'
          - problem: 'The function $f : \mathbb{R} \to \mathbb{R}$, $f(x) = x^3 - 3x$, satisfies $f(0) = 0$, so it is not injective. What is the positive real number $x$ with $f(x) = 0$?'
            answer: 'sqrt(3)'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'We solve $x^3 - 3x = 0$, which factors as $x(x^2 - 3) = 0$. So $x = 0$ or $x = \sqrt{3}$ or $x = -\sqrt{3}$. The positive solution is $x = \sqrt{3}$, and $f(\sqrt{3}) = f(0) = 0$.'
          - problem: 'A trip of $120$ kilometers at speed $v$ kilometers per hour takes $t(v) = 120/v$ hours. Two trips of $120$ kilometers take the same time, and the first was driven at $40$ kilometers per hour. What was the speed of the second trip?'
            answer: '40'
            answer_contract: {"kind": "unit", "quantity": "speed", "unit": "km/h", "allow_omitted": true}
            solution_sketch: 'Suppose $120/a = 120/b$ for positive speeds. Multiplying by $ab$ gives $120b = 120a$, so $a = b$. The time determines the speed, so the second trip was also driven at $40$ kilometers per hour.'
          - problem: 'The function $f : \mathbb{R} \setminus \{0\} \to \mathbb{R}$, $f(x) = x + \dfrac{1}{x}$, satisfies $f(2) = 5/2$, so it is not injective. What is the other input $x \ne 2$ with $f(x) = 5/2$?'
            answer: '1/2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'We solve $x + 1/x = 5/2$. Multiplying by $2x$ gives $2x^2 + 2 = 5x$, that is, $2x^2 - 5x + 2 = 0$, which factors as $(2x - 1)(x - 2) = 0$. The solutions are $x = 2$ and $x = 1/2$, so the other input is $1/2$.'
          - problem: 'Write the full proof that $f : \mathbb{R} \setminus \{3\} \to \mathbb{R}$ defined by $f(x) = \dfrac{2x + 1}{x - 3}$ is injective.'
            answer: 'f(x) = (2x+1)/(x-3) is injective'
            answer_contract: {"kind": "none"}
            solution_sketch: 'Let $a, b \in \mathbb{R} \setminus \{3\}$ and suppose $f(a) = f(b)$. This says $\frac{2a + 1}{a - 3} = \frac{2b + 1}{b - 3}$. Since $a \ne 3$ and $b \ne 3$, both denominators are nonzero, so we may multiply both sides by $(a - 3)(b - 3)$ and get $(2a + 1)(b - 3) = (2b + 1)(a - 3)$. Expanding the left side gives $2ab - 6a + b - 3$, and expanding the right side gives $2ab - 6b + a - 3$. Subtracting $2ab - 3$ from both sides leaves $-6a + b = -6b + a$. Collecting terms gives $7b = 7a$, and dividing by $7$ gives $a = b$. We have shown that $f(a) = f(b)$ implies $a = b$ for all $a, b \in \mathbb{R} \setminus \{3\}$. Therefore $f$ is injective. $\square$'
        constraints: "one algebraic step beyond affine: cubes, reciprocals, or a ratio Closed exemplars may audit general proofs of this method; do not certify proposed inferences in the problem."
      - id: kp3
        name: "The domain matters"
        key_prerequisites: [functions-formal-definition]
        step_check:
          step: 'Here the domain does the work'
          question: 'What does the domain $[1, \infty)$ contribute in Case 2?'
          options:
            - 'It shows that $a + b = 2$ is impossible, so only Case 1 can occur in the proof'
            - 'It makes $a - b$ positive, so the first factor can be cancelled in the equation'
            - 'It turns the equation into a statement about only positive numbers, which is always true'
            - 'It forces $a = b = 1$, since two numbers at least $1$ with sum $2$ both equal $1$'
          answer: 'It forces $a = b = 1$, since two numbers at least $1$ with sum $2$ both equal $1$'
          why: 'In Case 2 we have $a + b = 2$; with $a \ge 1$ and $b \ge 1$ the only possibility is $a = b = 1$, so the extra solution $b = 2 - a$ does not occur in this domain.'
        exemplars:
          - problem: 'Is the function $f : [2, \infty) \to \mathbb{R}$, $f(x) = x^2$, injective?'
            answer: 'yes'
            answer_contract: {"kind": "label", "options": [["yes", "it is injective", "injective", "one-to-one"], ["no", "it is not injective", "not injective", "not one-to-one", "it's not injective", "not 1-1"]]}
            solution_sketch: 'Suppose $f(a) = f(b)$ with $a, b \ge 2$. Then $a^2 - b^2 = (a - b)(a + b) = 0$, and $a + b \ge 4 > 0$, so $a - b = 0$. Hence $a = b$ and $f$ is injective on this domain.'
          - problem: 'Is the function $f : \mathbb{R} \to \mathbb{R}$, $f(x) = x^2$, injective?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "it is injective", "injective", "one-to-one"], ["no", "it is not injective", "not injective", "not one-to-one", "it's not injective", "not 1-1"]]}
            solution_sketch: 'The inputs $2$ and $-2$ are different, but $f(2) = 4 = f(-2)$. So two different inputs share an output, and $f$ is not injective on $\mathbb{R}$. The same rule is injective on $[2, \infty)$, so the domain decides.'
          - problem: 'The function $f : \mathbb{R} \to \mathbb{R}$, $f(x) = x^2 - 4x$, is not injective, because $f(1) = -3$. What is the other real number $x$ with $f(x) = -3$?'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'We solve $x^2 - 4x = -3$, that is, $x^2 - 4x + 3 = 0$, which factors as $(x - 1)(x - 3) = 0$. The solutions are $1$ and $3$, so $f(3) = -3 = f(1)$ and the other input is $3$.'
          - problem: 'The function $f(x) = x^2 + 4x$ is restricted to the domain $[a, \infty)$. What is the smallest real number $a$ for which this restricted function is injective?'
            answer: '-2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Rewrite $f(x) = (x + 2)^2 - 4$, which is symmetric about $x = -2$. Two different inputs $-2 + h$ and $-2 - h$ give the same output, so the domain must not contain points on both sides of $-2$. On $[-2, \infty)$ the function is injective, so the smallest value is $a = -2$.'
          - problem: 'A ball is thrown upward, and its height is $h(t) = -5t^2 + 30t$ meters after $t$ seconds. At $t = 1$ the height is $25$ meters. At what other time $t$ is the ball at the same height?'
            answer: '5'
            answer_contract: {"kind": "unit", "quantity": "time", "unit": "second", "allow_omitted": true}
            solution_sketch: 'We solve $-5t^2 + 30t = 25$, that is, $t^2 - 6t + 5 = 0$, which factors as $(t - 1)(t - 5) = 0$. The ball is at $25$ meters at $t = 1$ on the way up and at $t = 5$ on the way down. So the other time is $5$ seconds.'
          - problem: 'A rectangle has perimeter $24$ meters and width $w$ meters, so its area is $A(w) = w(12 - w)$ square meters. A field of width $2$ meters has the same area as a field of a different width. What is that other width?'
            answer: '10'
            answer_contract: {"kind": "unit", "quantity": "length", "unit": "m", "allow_omitted": true}
            solution_sketch: 'The area of the first field is $A(2) = 20$. We solve $w(12 - w) = 20$, that is, $w^2 - 12w + 20 = 0$, which factors as $(w - 2)(w - 10) = 0$. So the other width is $10$ meters.'
          - problem: 'Write the full proof that $f : [3, \infty) \to \mathbb{R}$ defined by $f(x) = x^2 - 6x + 5$ is injective.'
            answer: 'x^2-6x+5 is injective on [3, inf)'
            answer_contract: {"kind": "none"}
            solution_sketch: 'Let $a, b \in [3, \infty)$ and suppose $f(a) = f(b)$, so $a^2 - 6a + 5 = b^2 - 6b + 5$. Subtracting $5$ and moving all terms to the left gives $a^2 - b^2 - 6a + 6b = 0$. Factoring, $(a - b)(a + b) - 6(a - b) = 0$, that is, $(a - b)(a + b - 6) = 0$. A product of two real numbers is zero only if one factor is zero, so there are two cases. Case 1: $a - b = 0$, and then $a = b$. Case 2: $a + b - 6 = 0$, so $a + b = 6$. Since $a \ge 3$ and $b \ge 3$, we have $a + b \ge 6$, and equality holds only if $a = 3$ and $b = 3$. So in this case $a = b = 3$. In both cases $a = b$, so $f$ is injective on $[3, \infty)$. The restriction is needed: on all of $\mathbb{R}$ we have $f(0) = 5 = f(6)$. $\square$'
        constraints: "restricted domains where injectivity holds though it fails on all of $\\mathbb{R}$ Closed exemplars may audit general proofs of this method; do not certify proposed inferences in the problem."
    diagnostic_exemplar:
      problem: 'Prove that $f : [0, \infty) \to \mathbb{R}$, $f(x) = x^2 + 3$, is injective, and explain why the same rule on $\mathbb{R}$ is not.'
      answer: 'Suppose $f(a) = f(b)$ with $a, b \ge 0$. Then $a^2 + 3 = b^2 + 3$, so $a^2 = b^2$ and $(a-b)(a+b) = 0$. Either $a = b$, or $a + b = 0$ which with $a, b \ge 0$ forces $a = b = 0$; in both cases $a = b$, so $f$ is injective. On $\mathbb{R}$ the same rule is not injective: $f(-1) = 4 = f(1)$ while $-1 \ne 1$. The domain, not the formula, decides.'
      solution_sketch: 'Assume equal outputs, factor $a^2 - b^2$, and use nonnegativity to kill the $a + b$ branch; then give the counterexample the larger domain allows.'
    anki_seeds:
      - front: 'Contrapositive form of injectivity?'
        back: '$a \ne b \Rightarrow f(a) \ne f(b)$ — distinct inputs give distinct outputs.'
        type: basic
      - front: 'Why are strictly increasing functions injective?'
        back: '$a < b \Rightarrow f(a) < f(b)$, so distinct inputs give distinct outputs.'
        type: basic

  - id: proving-surjectivity
    name: "Proving Surjectivity"
    core: true
    difficulty: 0.58
    drill: false
    answer_kind: proof
    expected_time_secs: 170
    prerequisites:
      - id: functions-formal-definition
        weight: 0.6
        key: true
      - id: quantifiers
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: "The preimage-finding template"
        key_prerequisites: [functions-formal-definition]
        step_check:
          step: 'Verify by substitution'
          question: 'Why does the proof substitute $x = \dfrac{y - 9}{4}$ back into $f$?'
          options:
            - 'The substitution shows that the formula for $x$ is as short and simple as possible'
            - 'The substitution proves that $f$ is injective as well as surjective'
            - 'The solving step may contain an error, and the substitution only corrects the formula'
            - 'The substitution shows that $f(x) = y$ really holds, so $y$ has a preimage'
          answer: 'The substitution shows that $f(x) = y$ really holds, so $y$ has a preimage'
          why: 'Surjectivity asks for an $x$ with $f(x) = y$; computing $f(x) = y$ for the candidate confirms that the candidate really is a preimage.'
        try_first:
          problem: 'Let $f(x) = 5x - 7$ on $\mathbb{R}$. Which real number $x$ satisfies $f(x) = 3$?'
          answer_contract: {"kind": "exact"}
          answer: '2'
          reveal: 'Solving $5x - 7 = 3$ gives $5x = 10$, so $x = 2$. Doing the same with a target $y$ in place of $3$ is how a proof shows that every target is reached.'
        exemplars:
          - problem: 'Let $f : \mathbb{R} \to \mathbb{R}$ be defined by $f(x) = 5x - 7$. Given $y \in \mathbb{R}$, find the real number $x$ with $f(x) = y$.'
            answer: '(y + 7)/5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'We solve $5x - 7 = y$. Adding $7$ to both sides gives $5x = y + 7$, and dividing by $5$ gives $x = (y + 7)/5$. Check: $f((y + 7)/5) = 5 \cdot (y + 7)/5 - 7 = y$.'
          - problem: 'Let $f : \mathbb{Z} \to \mathbb{Z}$ be defined by $f(n) = n + 3$. Given $m \in \mathbb{Z}$, find the integer $n$ with $f(n) = m$.'
            answer: 'm - 3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'We solve $n + 3 = m$ and subtract $3$ from both sides, which gives $n = m - 3$. This is an integer whenever $m$ is an integer. Check: $f(m - 3) = (m - 3) + 3 = m$.'
          - problem: 'Let $f : \mathbb{R} \to \mathbb{R}$ be defined by $f(x) = -3x + 8$. Given $y \in \mathbb{R}$, find the real number $x$ with $f(x) = y$.'
            answer: '(8 - y)/3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'We solve $-3x + 8 = y$. Subtracting $8$ gives $-3x = y - 8$, and dividing by $-3$ gives $x = (8 - y)/3$. Check: $f((8 - y)/3) = -(8 - y) + 8 = y$.'
          - problem: 'A taxi charges $2d + 3$ dollars for a ride of $d$ kilometers. Ana pays $21$ dollars. How long was her ride in kilometers?'
            answer: '9'
            answer_contract: {"kind": "unit", "quantity": "length", "unit": "km", "allow_omitted": true}
            solution_sketch: 'We solve $2d + 3 = 21$. Subtracting $3$ gives $2d = 18$, and dividing by $2$ gives $d = 9$. Check: $2 \cdot 9 + 3 = 21$, so the ride was $9$ kilometers.'
          - problem: 'A plumber charges a call-out fee of $40$ dollars plus $35$ dollars per hour of work. A bill is $145$ dollars. How many hours did the plumber work?'
            answer: '3'
            answer_contract: {"kind": "unit", "quantity": "time", "unit": "hour", "allow_omitted": true}
            solution_sketch: 'The bill for $h$ hours is $35h + 40$, so we solve $35h + 40 = 145$. Subtracting $40$ gives $35h = 105$, and dividing by $35$ gives $h = 3$. Check: $35 \cdot 3 + 40 = 145$.'
          - problem: 'Is the function $f : \mathbb{Z} \to \mathbb{Z}$, $f(n) = 2n + 5$, surjective?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "it is surjective", "surjective", "onto"], ["no", "it is not surjective", "not surjective", "not onto", "it's not surjective"]]}
            solution_sketch: 'The equation $2n + 5 = y$ has the solution $n = (y - 5)/2$, but this is an integer only when $y$ is odd. For the target $y = 0$ no integer $n$ works, since $2n + 5$ is always odd. So $f$ is not surjective.'
          - problem: 'Is the function $f : \mathbb{R} \to \mathbb{R}$, $f(x) = 2x + 5$, surjective?'
            answer: 'yes'
            answer_contract: {"kind": "label", "options": [["yes", "it is surjective", "surjective", "onto"], ["no", "it is not surjective", "not surjective", "not onto", "it's not surjective"]]}
            solution_sketch: 'Let $y \in \mathbb{R}$ and take $x = (y - 5)/2$, which is a real number. Then $f(x) = 2 \cdot (y - 5)/2 + 5 = y$. So every real target has a preimage, and $f$ is surjective.'
          - problem: 'Sam wants to show that $f : \mathbb{R} \to \mathbb{R}$, $f(x) = 3x - 6$, is surjective. For a target $y$ Sam solves $3x - 6 = y$ and writes $x = y/3 + 6$. What is the correct preimage of $y$?'
            answer: 'y/3 + 2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Adding $6$ to both sides gives $3x = y + 6$. Dividing by $3$ gives $x = y/3 + 2$, not $y/3 + 6$, because the $6$ must be divided as well. Check: $f(y/3 + 2) = y + 6 - 6 = y$.'
          - problem: 'Write the full proof that $f : \mathbb{Z} \times \mathbb{Z} \to \mathbb{Z} \times \mathbb{Z}$ defined by $f(m, n) = (m + n, m + 2n)$ is surjective.'
            answer: 'f(m,n) = (m+n, m+2n) is surjective'
            answer_contract: {"kind": "none"}
            solution_sketch: 'Let $(a, b) \in \mathbb{Z} \times \mathbb{Z}$ be arbitrary. We must find integers $m$ and $n$ with $f(m, n) = (a, b)$, that is, $m + n = a$ and $m + 2n = b$. Subtracting the first equation from the second gives $n = b - a$. Substituting into the first equation gives $m = a - n = a - (b - a) = 2a - b$. Since $a$ and $b$ are integers, $m = 2a - b$ and $n = b - a$ are integers, so $(m, n)$ lies in the domain $\mathbb{Z} \times \mathbb{Z}$. Now check: $m + n = (2a - b) + (b - a) = a$ and $m + 2n = (2a - b) + 2(b - a) = b$. Hence $f(2a - b, b - a) = (a, b)$. Since $(a, b)$ was an arbitrary element of the codomain, every element of $\mathbb{Z} \times \mathbb{Z}$ has a preimage, and $f$ is surjective. $\square$'
        constraints: "affine maps; solve $f(x) = y$ for $x$ and verify"
      - id: kp2
        name: "Nonlinear examples"
        key_prerequisites: [functions-formal-definition]
        step_check:
          step: 'Check the preimage lands in the domain'
          question: 'Why must the proof check that $x = \sqrt[5]{y + 3}$ lies in the domain of $f$?'
          options:
            - 'The domain tells us which fifth root to take, and the check selects the positive one'
            - 'A preimage outside the domain is not an input of $f$, so it proves nothing'
            - 'Without the check the equation $x^5 - 3 = y$ would have several solutions'
            - 'The check shows that $f$ is injective, which surjectivity needs'
          answer: 'A preimage outside the domain is not an input of $f$, so it proves nothing'
          why: 'Surjectivity needs an input of $f$ with $f(x) = y$; an $x$ outside the domain does not count, even if the equation holds for it.'
        exemplars:
          - problem: 'Let $f : \mathbb{R} \to \mathbb{R}$ be defined by $f(x) = x^3 + 7$. Given $y \in \mathbb{R}$, find the real number $x$ with $f(x) = y$.'
            answer: '(y - 7)^(1/3)'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'We solve $x^3 + 7 = y$. Subtracting $7$ gives $x^3 = y - 7$, and taking the real cube root gives $x = \sqrt[3]{y - 7} = (y - 7)^{1/3}$. A real cube root exists for every real number, even a negative one, so $x \in \mathbb{R}$.'
          - problem: 'Let $f : \mathbb{R} \setminus \{0\} \to \mathbb{R} \setminus \{0\}$ be defined by $f(x) = 3/x$. Given a nonzero $y$, find the number $x$ with $f(x) = y$.'
            answer: '3/y'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'We solve $3/x = y$. Multiplying by $x$ gives $3 = xy$, and dividing by $y \ne 0$ gives $x = 3/y$. This $x$ is nonzero, so it lies in the domain, and $f(3/y) = 3/(3/y) = y$.'
          - problem: 'Is the function $f : \mathbb{R} \to \mathbb{R}$, $f(x) = x^2$, surjective?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "it is surjective", "surjective", "onto"], ["no", "it is not surjective", "not surjective", "not onto", "it's not surjective"]]}
            solution_sketch: 'For the target $y = -1$ we would need $x^2 = -1$, and no real number has a negative square. So $-1$ has no preimage, and $f$ is not surjective.'
          - problem: 'Sam claims that $f : \mathbb{R} \to \mathbb{R}$, $f(x) = x^2 + 3$, is surjective, because $x = \sqrt{y - 3}$ is a preimage of $y$. Sam checks $y = 3, 4, 7$. What is the largest integer $y$ for which Sam''s preimage is not a real number?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The number $\sqrt{y - 3}$ is real only when $y - 3 \ge 0$, that is, $y \ge 3$. So for every integer $y < 3$ there is no real preimage; in fact $x^2 + 3 \ge 3$ for all real $x$. The largest such integer is $2$.'
          - problem: 'A cube-shaped tank must hold exactly $125$ cubic meters. The volume of a cube with side $s$ meters is $V(s) = s^3$. What side length does the tank need?'
            answer: '5'
            answer_contract: {"kind": "unit", "quantity": "length", "unit": "m", "allow_omitted": true}
            solution_sketch: 'We solve $s^3 = 125$. Taking the cube root gives $s = \sqrt[3]{125} = 5$. Check: $5^3 = 125$, so the side is $5$ meters.'
          - problem: 'A trip of $150$ kilometers at speed $v$ kilometers per hour takes $t(v) = 150/v$ hours. A trip takes $3$ hours. What was the speed?'
            answer: '50'
            answer_contract: {"kind": "unit", "quantity": "speed", "unit": "km/h", "allow_omitted": true}
            solution_sketch: 'We solve $150/v = 3$. Multiplying by $v$ gives $150 = 3v$, and dividing by $3$ gives $v = 50$. Check: $150/50 = 3$, so the speed was $50$ kilometers per hour.'
          - problem: 'The function $f : \mathbb{R} \setminus \{2\} \to \mathbb{R}$, $f(x) = \dfrac{x + 1}{x - 2}$, takes every real value except one. Which value $y$ is not taken?'
            answer: '1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Solving $y(x - 2) = x + 1$ gives $x(y - 1) = 2y + 1$. For $y = 1$ this reads $0 = 3$, which is impossible, so the value $1$ is never taken. For every other $y$ we get $x = (2y + 1)/(y - 1)$, so the missing value is $1$.'
          - problem: 'Let $f : (0, \infty) \to (0, \infty)$ be defined by $f(x) = 1/x^2$. Given $y > 0$, find the number $x > 0$ with $f(x) = y$.'
            answer: '1/sqrt(y)'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'We solve $1/x^2 = y$, so $x^2 = 1/y$. Since $x$ must be positive, $x = 1/\sqrt{y}$. This is a positive number, so it lies in the domain, and $f(1/\sqrt{y}) = 1/(1/y) = y$.'
          - problem: 'Write the full proof that $f : \mathbb{R} \setminus \{2\} \to \mathbb{R} \setminus \{1\}$ defined by $f(x) = \dfrac{x + 1}{x - 2}$ is surjective.'
            answer: 'f(x) = (x+1)/(x-2) is onto R minus {1}'
            answer_contract: {"kind": "none"}
            solution_sketch: 'Let $y \in \mathbb{R} \setminus \{1\}$ be arbitrary. Since $y \ne 1$, the number $x = \frac{2y + 1}{y - 1}$ is a well-defined real number. We check that $x$ lies in the domain. If $x = 2$, then $2y + 1 = 2(y - 1) = 2y - 2$, which gives $1 = -2$, a contradiction. So $x \ne 2$ and $x \in \mathbb{R} \setminus \{2\}$. Now we compute $f(x)$. We have $x + 1 = \frac{2y + 1 + y - 1}{y - 1} = \frac{3y}{y - 1}$ and $x - 2 = \frac{2y + 1 - 2(y - 1)}{y - 1} = \frac{3}{y - 1}$. Therefore $f(x) = \frac{3y/(y - 1)}{3/(y - 1)} = y$. The rule also maps into the stated codomain, because $f(x) = 1$ would need $x + 1 = x - 2$, which is impossible, so $f(x) \ne 1$ for every $x \in \mathbb{R} \setminus \{2\}$. Since $y$ was an arbitrary element of the codomain, every element of $\mathbb{R} \setminus \{1\}$ has a preimage in the domain, and $f$ is surjective. $\square$'
        constraints: "invert one nonlinear step; check the preimage lands in the domain"
      - id: kp3
        name: "The codomain matters"
        key_prerequisites: [quantifiers]
        step_check:
          step: 'we have $y - 1 \ge 0$'
          question: 'Why is it important that $y - 1 \ge 0$ for every $y$ in the codomain $[1, \infty)$?'
          options:
            - 'The square root of $y - 1$ is real only if $y - 1$ is not negative'
            - 'The inequality shows that $f$ is increasing, and increasing functions are surjective'
            - 'The inequality makes $x$ positive, and the domain of $f$ contains only positive numbers'
            - 'Because $y - 1$ is large, the equation $x^2 = y - 1$ has two solutions instead of one'
          answer: 'The square root of $y - 1$ is real only if $y - 1$ is not negative'
          why: 'The codomain $[1, \infty)$ is what guarantees $y - 1 \ge 0$; for a target such as $y = 0$ the square root would not be real and no preimage would exist.'
        exemplars:
          - problem: 'Let $f : \mathbb{R} \to [5, \infty)$ be defined by $f(x) = x^2 + 5$. Given $y \ge 5$, find the nonnegative real number $x$ with $f(x) = y$.'
            answer: 'sqrt(y - 5)'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'We solve $x^2 + 5 = y$, so $x^2 = y - 5$. Since $y \ge 5$, the number $y - 5$ is not negative, so $x = \sqrt{y - 5}$ is a real number. Check: $(\sqrt{y - 5})^2 + 5 = y$.'
          - problem: 'Let $f : \mathbb{R} \to [-1, \infty)$ be defined by $f(x) = x^2 - 1$. Given $y \ge -1$, find the nonnegative real number $x$ with $f(x) = y$.'
            answer: 'sqrt(y + 1)'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'We solve $x^2 - 1 = y$, so $x^2 = y + 1$. Since $y \ge -1$, the number $y + 1$ is not negative, so $x = \sqrt{y + 1}$ is a real number. Check: $(\sqrt{y + 1})^2 - 1 = y$.'
          - problem: 'Consider $f : \mathbb{R} \to \mathbb{R}$ with $f(x) = e^x$. What is the largest integer that has no preimage under $f$?'
            answer: '0'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Every value $e^x$ is positive, and every positive number is a value. So the integers $0, -1, -2, \dots$ have no preimage. The largest of them is $0$.'
          - problem: 'For which real number $a$ is the function $f : \mathbb{R} \to [a, \infty)$, $f(x) = x^2 + 6$, surjective?'
            answer: '6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The values of $f$ are exactly the numbers $x^2 + 6 \ge 6$, and each number $y \ge 6$ is reached by $x = \sqrt{y - 6}$. So the set of values is $[6, \infty)$. For $f$ to be surjective onto $[a, \infty)$ this set must be the codomain, so $a = 6$.'
          - problem: 'The rule $f(x) = x^2 + 1$ is used with the domain $\mathbb{R}$ and the codomain $(1, \infty)$. Is $f$ not a function into this codomain, a function that is not surjective, or a surjective function?'
            answer: 'it is not a function'
            answer_contract: {"kind": "label", "options": [["it is not a function", "not a function", "no function", "not a function into this codomain", "it is not a function into this codomain"], ["it is a function but not surjective", "not surjective", "not onto", "a function that is not surjective", "a function but not surjective"], ["it is surjective", "surjective", "onto", "a surjective function"]]}
            solution_sketch: 'The value $f(0) = 1$ is not in the codomain $(1, \infty)$. So the rule does not map every input into the codomain, and it is not a function from $\mathbb{R}$ to $(1, \infty)$. Surjectivity cannot even be asked.'
          - problem: 'A ball is thrown upward, and its height is $h(t) = 20t - 5t^2$ meters after $t$ seconds. For $h$ to be a surjective map from the real numbers onto $(-\infty, c]$, what is the number $c$?'
            answer: '20'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Complete the square: $h(t) = -5(t - 2)^2 + 20$. The largest value is $20$ at $t = 2$, and every number up to $20$ is reached. So the codomain must be $(-\infty, 20]$, and $c = 20$.'
          - problem: 'A farmer has $40$ meters of fence for a rectangle of width $w$ meters. The area is $A(w) = w(20 - w)$ square meters. For $A$ to map the real numbers onto $(-\infty, c]$, what is the number $c$?'
            answer: '100'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Complete the square: $A(w) = 100 - (w - 10)^2$. The largest value is $100$ at $w = 10$, and every number up to $100$ is reached. So $c = 100$.'
          - problem: 'Is the function $f : \mathbb{R} \to \mathbb{R}$, $f(x) = x^2 + 1$, surjective?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "it is surjective", "surjective", "onto"], ["no", "it is not surjective", "not surjective", "not onto", "it's not surjective"]]}
            solution_sketch: 'For every real $x$ we have $x^2 + 1 \ge 1$, so a target such as $0$ is never reached. Thus $f$ is not surjective as a map into $\mathbb{R}$. Onto $[1, \infty)$ the same rule is surjective, so the codomain decides.'
          - problem: 'Write the full proof that $f : \mathbb{R} \to [-4, \infty)$ defined by $f(x) = x^2 + 6x + 5$ is surjective.'
            answer: 'x^2+6x+5 is onto [-4, inf)'
            answer_contract: {"kind": "none"}
            solution_sketch: 'Completing the square gives $f(x) = x^2 + 6x + 9 - 4 = (x + 3)^2 - 4$. Let $y \in [-4, \infty)$ be arbitrary, so $y \ge -4$ and $y + 4 \ge 0$. Because $y + 4 \ge 0$, the number $\sqrt{y + 4}$ is a real number. Put $x = -3 + \sqrt{y + 4}$. Then $x \in \mathbb{R}$, so $x$ lies in the domain. Now compute $f(x) = (x + 3)^2 - 4 = (\sqrt{y + 4})^2 - 4 = (y + 4) - 4 = y$. Since $y$ was an arbitrary element of $[-4, \infty)$, every element of the codomain has a preimage, and $f$ is surjective onto $[-4, \infty)$. $\square$'
        constraints: "maps surjective onto a stated codomain but not onto all of $\\mathbb{R}$"
    diagnostic_exemplar:
      problem: 'Prove that $f : \mathbb{R} \to [1, \infty)$, $f(x) = x^2 + 1$, is surjective, and explain why the same rule as a map $\mathbb{R} \to \mathbb{R}$ is not.'
      answer: 'Let $y \in [1, \infty)$. Then $y - 1 \ge 0$, so $x = \sqrt{y-1}$ is a real number, and $f(x) = (\sqrt{y-1})^2 + 1 = y$. Every element of the codomain has a preimage, so $f$ is surjective. As a map into $\mathbb{R}$ it is not: $x^2 + 1 \ge 1$ for every real $x$, so nothing maps to $0$. Surjectivity depends on the codomain, not only on the rule.'
      solution_sketch: 'Given a target $y$, solve $f(x) = y$ and check the solution lies in the domain; then point to codomain elements that are unreachable.'
    anki_seeds:
      - front: 'To prove $f : A \to B$ surjective, you...'
        back: 'take an arbitrary $b \in B$ and exhibit $a \in A$ with $f(a) = b$.'
        type: basic
      - front: 'Which part of a function''s specification does surjectivity depend on?'
        back: 'The codomain — the same rule can be surjective onto a smaller codomain and not onto a larger one.'
        type: basic

