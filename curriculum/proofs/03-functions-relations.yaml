      - id: quantifiers
        weight: 0.3
      - id: propositional-logic
        weight: 0.0
    knowledge_points:
      - id: kp1
        name: "Relations and the four properties"
        key_prerequisites: [cartesian-products]
        exemplars:
          - problem: 'On $\{1, 2, 3\}$, is $R = \{(1,1),(2,2),(3,3),(1,2),(2,1)\}$ reflexive? symmetric? transitive?'
            answer: 'Reflexive: yes. Symmetric: yes. Transitive: yes.'
            solution_sketch: 'All pairs $(i,i)$ are present (reflexive); $(1,2)$ and $(2,1)$ both appear (symmetric); every chain stays inside, e.g. $(1,2),(2,1) \Rightarrow (1,1) \in R$ (transitive).'
          - problem: 'On $\{1, 2, 3\}$, is $R = \{(1, 2), (2, 3)\}$ transitive?'
            answer: 'No; $(1,2), (2,3) \in R$ but $(1,3) \notin R$.'
            solution_sketch: 'Transitivity requires $(1,2), (2,3) \in R \Rightarrow (1,3) \in R$, but $(1,3) \notin R$, so $R$ is not transitive. $\square$'
        constraints: "check reflexive/symmetric/transitive on a listed relation over a small set"
      - id: kp2
        name: "Antisymmetry"
        key_prerequisites: [set-notation]
        exemplars:
          - problem: 'Is $\le$ on $\mathbb{Z}$ antisymmetric? Is it symmetric?'
            answer: 'Antisymmetric: yes. Symmetric: no.'
            solution_sketch: 'If $a \le b$ and $b \le a$ then $a = b$ (antisymmetric). But $1 \le 2$ while $2 \not\le 1$, so it is not symmetric.'
          - problem: 'Is the relation $=$ on $\mathbb{Z}$ antisymmetric?'
            answer: 'Yes (trivially).'
            solution_sketch: 'If $a = b$ and $b = a$ then $a = b$, so the antisymmetry condition holds. (Equality is also symmetric — both can hold at once.) $\square$'
        constraints: "distinguish antisymmetry from symmetry"
      - id: kp3
        name: "Proving a property holds"
        key_prerequisites: [quantifiers]
        exemplars:
          - problem: 'Prove that $a \sim b \iff a - b \in \mathbb{Z}$ on $\mathbb{R}$ is transitive.'
            answer: '$a - b, b - c \in \mathbb{Z} \Rightarrow a - c \in \mathbb{Z}$.'
            solution_sketch: 'Assume $a \sim b$ and $b \sim c$: $a - b \in \mathbb{Z}$ and $b - c \in \mathbb{Z}$. Then $a - c = (a - b) + (b - c) \in \mathbb{Z}$, so $a \sim c$. $\square$'
          - problem: 'Prove that $a \sim b \iff a + b$ is even, on $\mathbb{Z}$, is symmetric.'
            answer: '$a + b$ even iff $b + a$ even.'
            solution_sketch: 'Assume $a \sim b$, so $a + b$ is even. Since $b + a = a + b$, $b + a$ is even, so $b \sim a$. Hence $\sim$ is symmetric. $\square$'
        constraints: "prove a named property from its definition"
    diagnostic_exemplar:
      problem: 'Show that the relation "$a \mid b$" on $\mathbb{Z}^{+}$ is reflexive, antisymmetric and transitive, but not symmetric.'
      answer: 'Reflexive: $a = a \cdot 1$, so $a \mid a$. Antisymmetric: if $a \mid b$ and $b \mid a$ with $a, b > 0$, write $b = ak$ and $a = bm$; then $a = akm$, so $km = 1$ with $k, m$ positive integers, forcing $k = m = 1$ and $a = b$. Transitive: $b = ak$ and $c = bm$ give $c = a(km)$, so $a \mid c$. Not symmetric: $2 \mid 4$ but $4 \nmid 2$.'
      solution_sketch: 'Verify each property from the definition $a \mid b \iff b = ak$; positivity is what makes antisymmetry work, and one counterexample refutes symmetry.'
    anki_seeds:
      - front: 'When is a relation $R$ on $A$ reflexive?'
        back: '$\forall a,\ aRa$.'
        type: basic
      - front: 'When is a relation $R$ symmetric?'
        back: '$aRb \Rightarrow bRa$.'
        type: basic
      - front: 'When is a relation $R$ transitive?'
        back: '$aRb \land bRc \Rightarrow aRc$.'
        type: basic
      - front: 'When is a relation $R$ antisymmetric?'
        back: '$aRb \land bRa \Rightarrow a = b$.'
        type: basic

  - id: verifying-equivalence-properties
    name: "Verifying the Three Properties"
    core: true
    difficulty: 0.56
    drill: false
    answer_kind: multi-step
    expected_time_secs: 150
    prerequisites:
      - id: relations-properties
        weight: 0.6
        key: true
    knowledge_points:
      - id: kp1
        name: "Checks on listed relations"
        key_prerequisites: [relations-properties]
        exemplars:
          - problem: 'On $\{1, 2, 3\}$, is $R = \{(1,1),(2,2),(3,3),(1,3),(3,1)\}$ reflexive, symmetric, and transitive?'
            answer: 'Yes to all three — it is an equivalence relation.'
            solution_sketch: 'All loops present; $(1,3)$ pairs with $(3,1)$; chains like $(1,3),(3,1)$ land on $(1,1) \in R$ and $(3,1),(1,3)$ on $(3,3) \in R$.'
          - problem: 'On $\{1, 2, 3\}$, which properties fail for $R = \{(1,1),(2,2),(1,2),(2,1),(2,3)\}$?'
            answer: 'Reflexivity ($(3,3)$ missing) and symmetry ($(2,3)$ without $(3,2)$); transitivity also fails ($(1,2),(2,3)$ but $(1,3) \notin R$).'
            solution_sketch: 'Check each property against the list; a single missing pair witnesses each failure.'
        constraints: "systematic three-property checks on relations listed over a 3-element set"
      - id: kp2
        name: "Rule-defined relations with a failing property"
        key_prerequisites: [relations-properties]
        exemplars:
          - problem: 'On $\mathbb{Z}$, define $a \sim b \iff |a - b| \le 1$. Which of the three properties hold?'
            answer: 'Reflexive and symmetric, but not transitive.'
            solution_sketch: '$|a - a| = 0 \le 1$; $|a-b| = |b-a|$; but $0 \sim 1$ and $1 \sim 2$ while $|0 - 2| = 2 > 1$.'
          - problem: 'On $\mathbb{Z}$, define $a \sim b \iff ab \ge 0$. Show $\sim$ is not transitive.'
            answer: '$1 \sim 0$ and $0 \sim -1$, but $1 \cdot (-1) < 0$.'
            solution_sketch: '$1 \cdot 0 = 0 \ge 0$ and $0 \cdot (-1) = 0 \ge 0$, yet $1 \not\sim -1$; zero bridges the two signs.'
        constraints: "identify the failing property and give a concrete counterexample triple"
      - id: kp3
        name: "Full verdicts"
        key_prerequisites: [relations-properties]
        exemplars:
          - problem: 'On $\mathbb{Z}^{+}$, is $a \sim b \iff a \equiv b \pmod{10}$ (same last digit) an equivalence relation?'
            answer: 'Yes.'
            solution_sketch: 'Same-last-digit is reflexive, symmetric (equality of digits is symmetric), and transitive (if $a, b$ share a digit and $b, c$ share it, so do $a, c$).'
          - problem: 'On $\mathbb{Z}$, is $a \sim b \iff a < b$ an equivalence relation?'
            answer: 'No — it is neither reflexive nor symmetric.'
            solution_sketch: '$a < a$ never holds, and $a < b$ excludes $b < a$; either failure alone disqualifies it.'
        constraints: "deliver a verdict with a reason for each property; one positive and one negative case"
    diagnostic_exemplar:
      problem: 'On $\mathbb{Z}$, define $a \sim b \iff 4 \mid (a - b)$. Check each of the three properties and give a verdict.'
      answer: 'Reflexive, symmetric, transitive — an equivalence relation.'
      solution_sketch: '$4 \mid 0$; $4 \mid (a-b) \Rightarrow 4 \mid (b-a)$; and $4 \mid (a-b), 4 \mid (b-c) \Rightarrow 4 \mid (a-c)$ by adding.'
    anki_seeds:
      - front: 'To show a relation is NOT an equivalence relation...'
        back: 'exhibit one property that fails, with a concrete counterexample.'
        type: basic
      - front: 'Reflexivity fails for $R$ on $A$ when...'
        back: 'some $a \in A$ has $(a, a) \notin R$.'
        type: basic

  - id: relations-equivalence
    name: "Equivalence Relations"
    core: true
    difficulty: 0.60
    drill: false
    answer_kind: proof
    expected_time_secs: 210
    prerequisites:
      - id: relations-properties
        weight: 0.6
        key: true
      - id: verifying-equivalence-properties
        weight: 0.5
        key: true
      - id: cartesian-products
        weight: 0.2
      - id: quantifiers
        weight: 0.0
    knowledge_points:
      - id: kp1
        name: "Definition and quick checks"
        key_prerequisites: [relations-properties]
        exemplars:
          - problem: 'Verify that equality $=$ on any set is an equivalence relation.'
            answer: 'Reflexive, symmetric, and transitive all hold immediately.'
            solution_sketch: '$a = a$ (reflexive); $a = b \Rightarrow b = a$ (symmetric); $a = b \land b = c \Rightarrow a = c$ (transitive). So $=$ is an equivalence relation. $\square$'
          - problem: 'Is "$a \sim b \iff a \le b$" on $\mathbb{Z}$ an equivalence relation?'
            answer: 'No; it is not symmetric.'
            solution_sketch: '$\le$ is reflexive and transitive, but $1 \le 2$ while $2 \not\le 1$, so it is not symmetric; hence not an equivalence relation. $\square$'
        constraints: "confirm all three defining properties"
      - id: kp2
        name: "Proving a relation is an equivalence relation"
        key_prerequisites: [relations-properties]
        exemplars:
          - problem: 'Prove $a \sim b \iff a - b \in \mathbb{Z}$ is an equivalence relation on $\mathbb{R}$.'
            answer: 'Reflexive ($0 \in \mathbb{Z}$), symmetric (negation), transitive (sum).'
            solution_sketch: 'Reflexive: $a - a = 0 \in \mathbb{Z}$. Symmetric: $a - b \in \mathbb{Z} \Rightarrow b - a = -(a - b) \in \mathbb{Z}$. Transitive: $a - b, b - c \in \mathbb{Z} \Rightarrow a - c \in \mathbb{Z}$. $\square$'
          - problem: 'Prove "$x \sim y \iff x - y \in 2\mathbb{Z}$" (same parity) on $\mathbb{Z}$ is an equivalence relation.'
            answer: 'Reflexive, symmetric, transitive via even differences.'
            solution_sketch: 'Reflexive: $x - x = 0 \in 2\mathbb{Z}$. Symmetric: $x - y \in 2\mathbb{Z} \Rightarrow y - x = -(x - y) \in 2\mathbb{Z}$. Transitive: $x - y, y - z \in 2\mathbb{Z} \Rightarrow x - z \in 2\mathbb{Z}$. $\square$'
        constraints: "prove reflexivity, symmetry, transitivity in turn"
      - id: kp3
        name: "Congruence modulo n"
        key_prerequisites: [relations-properties]
        exemplars:
          - problem: 'Prove congruence mod $5$ ($a \equiv b \iff 5 \mid (a - b)$) is an equivalence relation on $\mathbb{Z}$.'
            answer: 'Reflexive, symmetric, transitive via divisibility of differences.'
            solution_sketch: 'Reflexive: $5 \mid 0 = a - a$. Symmetric: $5 \mid (a - b) \Rightarrow 5 \mid (b - a)$. Transitive: $5 \mid (a - b)$ and $5 \mid (b - c)$ give $5 \mid [(a - b) + (b - c)] = a - c$. $\square$'
          - problem: 'Prove "$f \sim g \iff f(0) = g(0)$" on functions $\mathbb{R} \to \mathbb{R}$ is an equivalence relation.'
            answer: 'Reflexive, symmetric, transitive from equality of $f(0)$.'
            solution_sketch: 'Reflexive: $f(0) = f(0)$. Symmetric: $f(0) = g(0) \Rightarrow g(0) = f(0)$. Transitive: $f(0) = g(0)$ and $g(0) = h(0) \Rightarrow f(0) = h(0)$. $\square$'
        constraints: "use an equality or divisibility fact about a derived quantity"
    diagnostic_exemplar:
      problem: 'On $\mathbb{Z}$, define $a \sim b \iff a^2 = b^2$. Prove $\sim$ is an equivalence relation.'
      answer: 'Reflexive, symmetric, transitive from equality of $a^2$.'
      solution_sketch: 'Reflexive: $a^2 = a^2$. Symmetric: $a^2 = b^2 \Rightarrow b^2 = a^2$. Transitive: $a^2 = b^2$ and $b^2 = c^2 \Rightarrow a^2 = c^2$. So $\sim$ is an equivalence relation (classes $\{a, -a\}$). $\square$'
    anki_seeds:
      - front: 'An equivalence relation is a relation that is...'
        back: 'reflexive, symmetric, and transitive.'
        type: basic
      - front: 'Congruence modulo $n$ as a relation?'
        back: '$a \equiv b \pmod{n}$ iff $n \mid (a - b)$; it is an equivalence relation on $\mathbb{Z}$.'
        type: basic

  - id: computing-equivalence-classes
    name: "Computing Equivalence Classes"
    core: true
    difficulty: 0.60
    drill: false
    answer_kind: multi-step
    expected_time_secs: 140
    prerequisites:
      - id: relations-equivalence
        weight: 0.6
        key: true
    knowledge_points:
      - id: kp1
        name: "Classes modulo n"
        key_prerequisites: [relations-equivalence]
        exemplars:
          - problem: 'For congruence mod $4$ on $\mathbb{Z}$, describe $[2]$ and state how many distinct classes there are.'
            answer: '$[2] = \{\dots, -6, -2, 2, 6, 10, \dots\} = \{2 + 4k : k \in \mathbb{Z}\}$; four classes in all.'
            solution_sketch: 'The class of $2$ collects everything congruent to $2$ mod $4$; the classes are $[0], [1], [2], [3]$, one per remainder.'
          - problem: 'For congruence mod $5$, find the smallest nonnegative representative of $[-3]$, and decide whether $[7] = [2]$.'
            answer: '$2$; yes.'
            solution_sketch: '$-3 + 5 = 2$, so $[-3] = [2]$. And $7 - 2 = 5$ is divisible by $5$, so $[7] = [2]$.'
        constraints: "residue classes mod $n \\le 10$; representatives and class equality"
      - id: kp2
        name: "Classes on finite sets"
        key_prerequisites: [relations-equivalence]
        exemplars:
          - problem: 'On $\{1, 2, 3, 4, 5\}$ with $a \sim b \iff a, b$ have the same parity, list the equivalence classes.'
            answer: '$\{1, 3, 5\}$ and $\{2, 4\}$.'
            solution_sketch: 'The odds form one class and the evens another; each element lies in exactly one.'
          - problem: 'On $\{1, 2, \dots, 9\}$ with $a \sim b \iff a \equiv b \pmod 3$, list the equivalence classes.'
            answer: '$\{3, 6, 9\}$, $\{1, 4, 7\}$, $\{2, 5, 8\}$.'
            solution_sketch: 'Group by remainder mod $3$: remainders $0$, $1$, $2$ respectively.'
        constraints: "list all classes of a concrete relation on a set of size at most 9"
      - id: kp3
        name: "Classes for rule-defined relations"
        key_prerequisites: [relations-equivalence]
        exemplars:
          - problem: 'On $\mathbb{Z}$ with $a \sim b \iff |a| = |b|$, describe $[5]$ and $[0]$.'
            answer: '$[5] = \{5, -5\}$ and $[0] = \{0\}$.'
            solution_sketch: '$|n| = 5$ has two solutions; $|n| = 0$ only one.'
          - problem: 'On $\mathbb{R}$ with $x \sim y \iff x - y \in \mathbb{Z}$, describe the class $\left[\tfrac{1}{2}\right]$.'
            answer: '$\left\{\tfrac{1}{2} + k : k \in \mathbb{Z}\right\}$'
            solution_sketch: 'Everything differing from $\tfrac12$ by an integer: $\dots, -\tfrac12, \tfrac12, \tfrac32, \dots$'
        constraints: "describe $[a] = \\{x : x \\sim a\\}$ for a rule-defined relation"
    diagnostic_exemplar:
      problem: 'On $\mathbb{Z}$ with $a \sim b \iff a - b$ even, describe $[7]$.'
      answer: 'The odd integers.'
      solution_sketch: '$n \sim 7$ iff $n - 7$ is even iff $n$ is odd.'
    anki_seeds:
      - front: '$[a]$ for congruence mod $n$?'
        back: '$\{a + kn : k \in \mathbb{Z}\}$.'
        type: basic
      - front: 'How many equivalence classes does congruence mod $n$ have?'
        back: '$n$ — one per remainder $0, 1, \dots, n-1$.'
        type: basic

  - id: equivalence-classes-partitions
    name: "Equivalence Classes and Partitions"
    core: true
    difficulty: 0.65
    drill: false
    answer_kind: proof
    expected_time_secs: 230
    prerequisites:
      - id: relations-equivalence
        weight: 0.5
        key: true
      - id: computing-equivalence-classes
        weight: 0.5
        key: true
      - id: disjoint-sets-partitions
        weight: 0.3
      - id: set-operations
        weight: 0.3
      - id: subsets-power-sets
        weight: 0.3
      - id: quantifiers
        weight: 0.0
    knowledge_points:
      - id: kp1
        name: "The quotient set"
        key_prerequisites: [computing-equivalence-classes]
        exemplars:
          - problem: 'Prove that the classes $[0], [1], [2], [3]$ of congruence mod $4$ are pairwise distinct, so the quotient set $\mathbb{Z}/\!\equiv_4$ has exactly $4$ elements.'
            answer: 'If $[i] = [j]$ with $0 \le i, j \le 3$ then $4 \mid (i - j)$, forcing $i = j$.'
            solution_sketch: 'If $[i] = [j]$ then $i \equiv j \pmod 4$, so $4 \mid (i - j)$. But $|i - j| \le 3$, so $i - j = 0$. Every integer is congruent to its remainder, so these four classes are all of them. $\square$'
          - problem: 'On $\mathbb{R}$ with $x \sim y \iff x - y \in \mathbb{Z}$, prove every equivalence class contains exactly one element of $[0, 1)$.'
            answer: 'Existence: $x - \lfloor x \rfloor \in [0,1)$. Uniqueness: two such representatives differ by an integer in $(-1, 1)$, hence $0$.'
            solution_sketch: 'For $x$, the number $x - \lfloor x \rfloor$ lies in $[0,1)$ and is $\sim x$. If $r, s \in [0,1)$ are both in the class, $r - s \in \mathbb{Z}$ and $-1 < r - s < 1$, so $r = s$. $\square$'
        constraints: "prove distinctness/uniqueness statements about the set of classes"
      - id: kp2
        name: "a ~ b iff [a] = [b]"
        key_prerequisites: [relations-equivalence]
        exemplars:
          - problem: 'Prove: for an equivalence relation, $a \sim b$ if and only if $[a] = [b]$.'
            answer: 'Both directions using reflexivity, symmetry, transitivity.'
            solution_sketch: 'If $a \sim b$: for $x \in [a]$, $x \sim a \sim b$ so $x \in [b]$, giving $[a] \subseteq [b]$; symmetrically $[b] \subseteq [a]$, so $[a] = [b]$. Conversely if $[a] = [b]$, then $a \in [a] = [b]$ means $a \sim b$. $\square$'
          - problem: 'Prove: for an equivalence relation, if $a \not\sim b$ then $[a] \cap [b] = \varnothing$.'
            answer: 'A common element would force $a \sim b$.'
            solution_sketch: 'Suppose $x \in [a] \cap [b]$. Then $a \sim x$ and $b \sim x$, so $a \sim x \sim b$ gives $a \sim b$, contradicting $a \not\sim b$. Hence $[a] \cap [b] = \varnothing$. $\square$'
        constraints: "relate equivalence to equality (or disjointness) of classes"
      - id: kp3
        name: "Classes partition the set"
        key_prerequisites: [set-operations]
        exemplars:
          - problem: 'Prove: distinct equivalence classes are disjoint, so the classes partition the set.'
            answer: 'If two classes meet, they are equal.'
            solution_sketch: 'Each $a$ lies in $[a]$ (reflexivity), so classes cover the set. If $x \in [a] \cap [b]$, then $a \sim x \sim b$, so $a \sim b$ and $[a] = [b]$. Hence two classes are equal or disjoint: a partition. $\square$'
          - problem: 'Prove: a partition $\mathcal{Q}$ of $A$ induces an equivalence relation whose classes are the blocks of $\mathcal{Q}$.'
            answer: 'Define $a \sim b$ iff same block; check the three properties.'
            solution_sketch: 'Define $a \sim b$ iff $a, b$ lie in the same block. Every $a$ is in some block (reflexive); same-block is symmetric; if $a, b$ share a block and $b, c$ share a block, that block is common (blocks are disjoint), so $a, c$ share it (transitive). The class of $a$ is its block. $\square$'
        constraints: "show covering plus pairwise disjointness; and the converse direction"
    diagnostic_exemplar:
      problem: 'Let $\sim$ be an equivalence relation on a set $A$. Prove that $[a] = [b]$ if and only if $a \sim b$, and deduce that two distinct equivalence classes are disjoint.'
      answer: '($\Leftarrow$) Suppose $a \sim b$. For $x \in [a]$ we have $x \sim a$ and $a \sim b$, so $x \sim b$ by transitivity, giving $[a] \subseteq [b]$; using $b \sim a$ (symmetry) the same argument gives $[b] \subseteq [a]$, so $[a] = [b]$. ($\Rightarrow$) If $[a] = [b]$, then $a \in [a]$ by reflexivity, so $a \in [b]$, i.e. $a \sim b$. Deduction: if $[a] \cap [b] \ne \varnothing$, pick $x$ in both; then $x \sim a$ and $x \sim b$, so $a \sim x$ and $x \sim b$ give $a \sim b$, hence $[a] = [b]$. Contrapositively, distinct classes have empty intersection — so the classes partition $A$.'
      solution_sketch: 'Use all three properties: transitivity for the inclusions, reflexivity for the converse, symmetry plus transitivity to turn a shared element into $a \sim b$.'
    anki_seeds:
      - front: 'Equivalence class $[a]$ of an element $a$?'
        back: '$[a] = \{x : x \sim a\}$, the set of all elements equivalent to $a$.'
        type: basic
      - front: 'Fundamental correspondence between equivalence relations and partitions?'
        back: 'The equivalence classes of a relation on $A$ form a partition of $A$; conversely every partition arises from a unique equivalence relation.'
        type: basic

  - id: composition-of-relations
    name: "Composition of Relations"
    core: true
    difficulty: 0.60
    drill: false
    answer_kind: multi-step
    expected_time_secs: 160
    prerequisites:
      - id: relations-properties
        weight: 0.5
        key: true
      - id: relations-digraphs-matrices
        weight: 0.4
        key: true
      - id: computing-compositions
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: "Computing S o R"
        key_prerequisites: [relations-digraphs-matrices]
        exemplars:
          - problem: 'On $\{1, 2, 3\}$ let $R = \{(1,2), (2,3)\}$ and $S = \{(2,1), (3,3)\}$. Compute $S \circ R = \{(a, c) : \exists b,\ (a,b) \in R \text{ and } (b,c) \in S\}$.'
            answer: '$\{(1,1), (2,3)\}$'
            solution_sketch: '$(1,2) \in R$ chains with $(2,1) \in S$ to give $(1,1)$; $(2,3) \in R$ chains with $(3,3) \in S$ to give $(2,3)$.'
          - problem: 'On $\{1, 2, 3\}$ let $R = \{(1,1), (1,2), (2,3)\}$ and $S = \{(1,3), (2,2), (3,1)\}$. Compute $S \circ R$.'
            answer: '$\{(1,3), (1,2), (2,1)\}$'
            solution_sketch: '$(1,1)$ chains with $(1,3)$; $(1,2)$ with $(2,2)$; $(2,3)$ with $(3,1)$.'
        constraints: "chain pairs through a middle element on a 3-element set"
      - id: kp2
        name: "Powers of a relation"
        key_prerequisites: [relations-digraphs-matrices]
        exemplars:
          - problem: 'For $R = \{(1,2), (2,3), (3,1)\}$ on $\{1, 2, 3\}$, compute $R^2 = R \circ R$ and $R^3$.'
            answer: '$R^2 = \{(1,3), (2,1), (3,2)\}$ and $R^3 = \{(1,1), (2,2), (3,3)\}$.'
            solution_sketch: 'Follow the cycle two steps, then three: three steps around a $3$-cycle returns each element to itself.'
          - problem: 'For $R$ = "$a < b$" on $\{1, 2, 3\}$, compute $R^2$.'
            answer: '$\{(1, 3)\}$'
            solution_sketch: '$R = \{(1,2),(1,3),(2,3)\}$; the only two-step chain is $1 < 2 < 3$.'
        constraints: "compute $R^2$ (and occasionally $R^3$) on a small relation"
      - id: kp3
        name: "Transitivity via composition"
        key_prerequisites: [relations-properties]
        exemplars:
          - problem: 'Using the criterion "$R$ is transitive iff $R \circ R \subseteq R$", decide whether $R = \{(1,2), (2,3), (1,3)\}$ on $\{1,2,3\}$ is transitive.'
            answer: 'Yes: $R \circ R = \{(1,3)\} \subseteq R$.'
            solution_sketch: 'The only chain is $(1,2)$ then $(2,3)$, giving $(1,3)$, which is in $R$; so $R \circ R \subseteq R$.'
          - problem: 'Using the same criterion, show $R = \{(1,2), (2,1)\}$ on $\{1, 2\}$ is not transitive.'
            answer: '$R \circ R = \{(1,1), (2,2)\} \not\subseteq R$.'
            solution_sketch: '$(1,2)$ chains with $(2,1)$ to $(1,1) \notin R$; the criterion fails, matching the direct check.'
        constraints: "decide transitivity by computing $R \\circ R$ and testing containment"
    diagnostic_exemplar:
      problem: 'On $\{1, 2, 3\}$ let $R = \{(1,2), (2,2), (2,3)\}$. Compute $R \circ R$, and use the criterion "$R$ is transitive iff $R \circ R \subseteq R$" to decide whether $R$ is transitive.'
      answer: '$R \circ R = \{(a,c) : \exists b,\ (a,b) \in R \text{ and } (b,c) \in R\}$. Following $(1,2)$ by $(2,2)$ and by $(2,3)$ gives $(1,2)$ and $(1,3)$; following $(2,2)$ by $(2,2)$ and $(2,3)$ gives $(2,2)$ and $(2,3)$. So $R \circ R = \{(1,2), (1,3), (2,2), (2,3)\}$. Since $(1,3) \notin R$, we have $R \circ R \not\subseteq R$, so $R$ is not transitive.'
      solution_sketch: 'Match every pair whose second coordinate starts another pair, then test the composed relation for containment in $R$.'
    anki_seeds:
      - front: 'Definition of the composition $S \circ R$ of relations?'
        back: '$\{(a, c) : \exists b,\ (a, b) \in R \text{ and } (b, c) \in S\}$ — apply $R$ first.'
        type: basic
      - front: 'Composition criterion for transitivity?'
        back: '$R$ is transitive iff $R \circ R \subseteq R$.'
        type: basic

  - id: relation-closures
    name: "Closures of Relations"
    core: true
    difficulty: 0.60
    drill: false
    answer_kind: multi-step
    expected_time_secs: 150
    prerequisites:
      - id: relations-properties
        weight: 0.5
        key: true
      - id: composition-of-relations
        weight: 0.4
        key: true
      - id: set-operations
        weight: 0.2
    knowledge_points:
      - id: kp1
        name: "Reflexive closure"
        key_prerequisites: [relations-properties]
        exemplars:
          - problem: 'Find the reflexive closure of $R = \{(1,2), (2,3)\}$ on $\{1, 2, 3\}$.'
            answer: '$\{(1,1), (2,2), (3,3), (1,2), (2,3)\}$'
            solution_sketch: 'Add every loop $(a, a)$: the reflexive closure is $R \cup \Delta$ where $\Delta = \{(a,a) : a \in A\}$.'
          - problem: 'How many pairs must be added to $R = \{(1,1), (1,2)\}$ on $\{1, 2, 3\}$ to make it reflexive?'
            answer: '$2$ — the loops $(2,2)$ and $(3,3)$.'
            solution_sketch: '$(1,1)$ is already present; the closure adds only the missing diagonal pairs.'
        constraints: "add the missing diagonal pairs on a set of size at most 4"
      - id: kp2
        name: "Symmetric closure"
        key_prerequisites: [relations-properties]
        exemplars:
          - problem: 'Find the symmetric closure of $R = \{(1,2), (3,2)\}$ on $\{1, 2, 3\}$.'
            answer: '$\{(1,2), (2,1), (3,2), (2,3)\}$'
            solution_sketch: 'Add the reverse of every pair: the symmetric closure is $R \cup R^{-1}$ where $R^{-1} = \{(b,a) : (a,b) \in R\}$.'
          - problem: 'Compute the inverse relation $R^{-1}$ for $R = \{(1,1), (1,3), (2,3)\}$.'
            answer: '$\{(1,1), (3,1), (3,2)\}$'
            solution_sketch: 'Reverse each pair; $(1,1)$ is its own reverse.'
        constraints: "form $R^{-1}$ and $R \\cup R^{-1}$ on small listed relations"
      - id: kp3
        name: "Transitive closure"
        key_prerequisites: [composition-of-relations]
        exemplars:
          - problem: 'Find the transitive closure of $R = \{(1,2), (2,3)\}$ on $\{1, 2, 3\}$.'
            answer: '$\{(1,2), (2,3), (1,3)\}$'
            solution_sketch: 'The chain $1 \to 2 \to 3$ forces $(1,3)$; no further chains appear, so one added pair suffices.'
          - problem: 'Find the transitive closure of $R = \{(1,2), (2,1)\}$ on $\{1, 2\}$.'
            answer: '$\{(1,2), (2,1), (1,1), (2,2)\}$'
            solution_sketch: 'Chains $1 \to 2 \to 1$ and $2 \to 1 \to 2$ force both loops; the result is now transitive.'
        constraints: "close small relations under chaining; add pairs until no chain escapes"
    diagnostic_exemplar:
      problem: 'On $\{a, b, c\}$ let $R = \{(a,b), (b,c)\}$. Give the pairs added by the reflexive closure, by the symmetric closure, and by the transitive closure.'
      answer: 'Reflexive closure adds the missing loops $(a,a)$, $(b,b)$, $(c,c)$. Symmetric closure adds the reversals $(b,a)$ and $(c,b)$. Transitive closure adds $(a,c)$, forced by the chain $(a,b), (b,c)$; no further pairs are then required.'
      solution_sketch: 'Each closure adds exactly the pairs the property demands and nothing more: loops, reversals, and composites along chains.'
    anki_seeds:
      - front: 'Reflexive closure of $R$ on $A$?'
        back: '$R \cup \{(a,a) : a \in A\}$ — the smallest reflexive relation containing $R$.'
        type: basic
      - front: 'Symmetric closure of $R$?'
        back: '$R \cup R^{-1}$, where $R^{-1}$ reverses every pair.'
        type: basic

  - id: partial-orders
    name: "Partial Orders"
    core: true
    difficulty: 0.62
    drill: false
    answer_kind: proof
    expected_time_secs: 210
    prerequisites:
      - id: relations-properties
        weight: 0.6
        key: true
      - id: quantifiers
        weight: 0.2
      - id: set-notation
        weight: 0.0
    knowledge_points:
      - id: kp1
        name: "The partial-order axioms"
        key_prerequisites: [relations-properties]
        exemplars:
          - problem: 'Show that $\subseteq$ on $\mathcal{P}(X)$ is a partial order.'
            answer: 'Reflexive, antisymmetric (double inclusion), transitive.'
            solution_sketch: '$A \subseteq A$ (reflexive); $A \subseteq B \land B \subseteq A \Rightarrow A = B$ (antisymmetric); $A \subseteq B \land B \subseteq C \Rightarrow A \subseteq C$ (transitive). So $(\mathcal{P}(X), \subseteq)$ is a poset. $\square$'
          - problem: 'Show that $\le$ on $\mathbb{N}$ is a partial order.'
            answer: 'Reflexive, antisymmetric, transitive.'
            solution_sketch: '$n \le n$; $m \le n \land n \le m \Rightarrow m = n$; $m \le n \land n \le p \Rightarrow m \le p$. So $(\mathbb{N}, \le)$ is a partial order (in fact total). $\square$'
        constraints: "verify reflexivity, antisymmetry, transitivity"
      - id: kp2
        name: "Proving a relation is a partial order"
        key_prerequisites: [relations-properties]
        exemplars:
          - problem: 'Prove divisibility $\mid$ is a partial order on $\mathbb{Z}^{+}$.'
            answer: 'Reflexive, antisymmetric on positives, transitive.'
            solution_sketch: '$a \mid a$; if $a \mid b$ and $b \mid a$ with $a, b > 0$ then $a = b$; if $a \mid b$ and $b \mid c$ then $a \mid c$. So $\mid$ is a partial order on $\mathbb{Z}^{+}$. $\square$'
          - problem: 'Prove the relation $(a, b) \preceq (c, d) \iff a \le c \text{ and } b \le d$ on $\mathbb{Z} \times \mathbb{Z}$ is a partial order.'
            answer: 'Componentwise reflexive, antisymmetric, transitive.'
            solution_sketch: 'Reflexive: $a \le a$, $b \le b$. Antisymmetric: $(a,b) \preceq (c,d)$ and $(c,d) \preceq (a,b)$ give $a = c$, $b = d$. Transitive: chain each coordinate. So it is a partial order (the product order). $\square$'
        constraints: "confirm all three axioms, noting positivity for antisymmetry"
      - id: kp3
        name: "Total vs. partial; comparability"
        key_prerequisites: [quantifiers]
        exemplars:
          - problem: 'Is divisibility on $\mathbb{Z}^{+}$ a total order? Justify.'
            answer: 'No: $2$ and $3$ are incomparable.'
            solution_sketch: 'A total order requires any two elements to be comparable. But $2 \nmid 3$ and $3 \nmid 2$, so $2$ and $3$ are incomparable; $\mid$ is partial, not total. $\square$'
          - problem: 'Is the product order on $\mathbb{Z} \times \mathbb{Z}$ total? Justify.'
            answer: 'No: $(1, 0)$ and $(0, 1)$ are incomparable.'
            solution_sketch: 'Neither $(1,0) \preceq (0,1)$ (as $1 \not\le 0$) nor $(0,1) \preceq (1,0)$ (as $1 \not\le 0$), so the two are incomparable; the order is partial, not total. $\square$'
        constraints: "test comparability of all pairs to decide totality"
    diagnostic_exemplar:
      problem: 'Prove that $\subseteq$ is a partial order on $\mathcal{P}(\{1,2,3\})$, and decide whether it is a total order.'
      answer: 'Reflexive: $X \subseteq X$ for every set $X$. Antisymmetric: if $X \subseteq Y$ and $Y \subseteq X$ then $X = Y$, by double inclusion. Transitive: if $X \subseteq Y$ and $Y \subseteq Z$, then $x \in X$ gives $x \in Y$ and hence $x \in Z$, so $X \subseteq Z$. So $\subseteq$ is a partial order. It is not total: $\{1\}$ and $\{2\}$ are incomparable, since neither is contained in the other.'
      solution_sketch: 'Check the three axioms for $\subseteq$, then exhibit two incomparable subsets to rule out totality.'
    anki_seeds:
      - front: 'A partial order is a relation that is...'
        back: 'reflexive, antisymmetric, and transitive.'
        type: basic
      - front: 'Difference between a partial order and a total (linear) order?'
        back: 'In a total order every two elements are comparable; a partial order may have incomparable elements.'
        type: basic

  - id: hasse-diagrams
    name: "Hasse Diagrams"
    core: true
    difficulty: 0.64
    drill: false
    answer_kind: multi-step
    expected_time_secs: 160
    prerequisites:
      - id: partial-orders
        weight: 0.6
        key: true
      - id: relations-digraphs-matrices
        weight: 0.2
    knowledge_points:
      - id: kp1
        name: "Drawing Hasse diagrams"
        key_prerequisites: [partial-orders]
        exemplars:
          - problem: 'For the divisors of $12$, $\{1, 2, 3, 4, 6, 12\}$, ordered by divisibility, list the covering edges of the Hasse diagram.'
            answer: '$1\!-\!2$, $1\!-\!3$, $2\!-\!4$, $2\!-\!6$, $3\!-\!6$, $4\!-\!12$, $6\!-\!12$.'
            solution_sketch: 'Draw $a$ below $b$ when $a \mid b$ with no divisor strictly between: e.g. $1\!-\!4$ is omitted because $1 \mid 2 \mid 4$.'
          - problem: 'Describe the Hasse diagram of $\mathcal{P}(\{a, b\})$ under $\subseteq$.'
            answer: 'A diamond: $\varnothing$ at the bottom, $\{a\}$ and $\{b\}$ in the middle, $\{a, b\}$ on top.'
            solution_sketch: 'Each covering step adds one element; $\{a\}$ and $\{b\}$ are incomparable, side by side.'
        constraints: "posets with at most 8 elements: divisor lattices or small power sets"
      - id: kp2
        name: "Reading a Hasse diagram"
        key_prerequisites: [partial-orders]
        exemplars:
          - problem: 'In the Hasse diagram of the divisors of $12$ under $\mid$, is $2 \preceq 12$? Is $4 \preceq 6$?'
            answer: 'Yes ($2 \mid 12$, via the path $2\!-\!4\!-\!12$ or $2\!-\!6\!-\!12$); no ($4 \nmid 6$).'
            solution_sketch: '$a \preceq b$ iff there is an upward path from $a$ to $b$; there is none from $4$ to $6$.'
          - problem: 'In the divisors-of-$12$ poset, which elements cover $1$?'
            answer: '$2$ and $3$.'
            solution_sketch: '$b$ covers $1$ when $1 \mid b$ with nothing strictly between — exactly the prime divisors.'
        constraints: "recover order relations and covers from upward paths"
      - id: kp3
        name: "Chains and comparability"
        key_prerequisites: [partial-orders]
        exemplars:
          - problem: 'Find a longest chain in the divisors of $12$ under divisibility.'
            answer: '$1 \mid 2 \mid 4 \mid 12$ ($4$ elements; $1 \mid 2 \mid 6 \mid 12$ and $1 \mid 3 \mid 6 \mid 12$ also work).'
            solution_sketch: 'A chain climbs one cover at a time; four elements is the maximum since each step multiplies in one more prime factor and $12 = 2^2 \cdot 3$ has three.'
          - problem: 'List the incomparable pairs in $\mathcal{P}(\{a, b\})$ under $\subseteq$.'
            answer: 'Only $\{a\}$ and $\{b\}$.'
            solution_sketch: 'Neither singleton contains the other; every other pair is nested.'
        constraints: "identify chains and incomparable pairs in the drawn poset"
    diagnostic_exemplar:
      problem: 'For the divisors of $18$ ordered by divisibility, list the covering edges of the Hasse diagram, give a longest chain, and name an incomparable pair.'
      answer: 'The divisors are $1, 2, 3, 6, 9, 18$. Covering edges (steps with nothing strictly between): $1\!-\!2$, $1\!-\!3$, $2\!-\!6$, $3\!-\!6$, $3\!-\!9$, $6\!-\!18$, $9\!-\!18$. A longest chain has four elements, for example $1 \mid 3 \mid 9 \mid 18$ (also $1 \mid 2 \mid 6 \mid 18$ or $1 \mid 3 \mid 6 \mid 18$). An incomparable pair: $2$ and $3$, since neither divides the other ($2$ and $9$ also work).'
      solution_sketch: 'Draw only the covering relations, omitting edges implied by transitivity, then read a longest chain and an incomparable pair off the diagram.'
    anki_seeds:
      - front: 'Which edges does a Hasse diagram draw?'
        back: 'Only covering relations — loops and transitively-implied edges are omitted; smaller elements sit lower.'
        type: basic
      - front: '"$b$ covers $a$" in a poset means...'
        back: '$a \prec b$ with no element strictly between.'
        type: basic

  - id: minimal-maximal-elements
    name: "Minimal, Maximal, and Bounds"
    core: false                # supplemental: order-theory destination above partial-orders
    difficulty: 0.66
    drill: false
    answer_kind: multi-step
    expected_time_secs: 170
    prerequisites:
      - id: partial-orders
        weight: 0.5
        key: true
      - id: hasse-diagrams
        weight: 0.4
        key: true
    knowledge_points:
      - id: kp1
        name: "Minimal/maximal vs minimum/maximum"
        key_prerequisites: [hasse-diagrams]
        exemplars:
          - problem: 'In the divisors of $12$ under divisibility, find the minimum and maximum elements.'
            answer: 'Minimum $1$, maximum $12$.'
            solution_sketch: '$1$ divides every divisor and every divisor divides $12$, so both extremes are comparable to everything.'
          - problem: 'In the poset $\{2, 3, 6, 12\}$ under divisibility, find all minimal elements. Is there a minimum?'
            answer: 'Minimal: $2$ and $3$; no minimum.'
            solution_sketch: 'Nothing in the set divides $2$ or $3$ (other than themselves), so both are minimal; a minimum would have to divide both, and no single element does.'
        constraints: "small divisibility posets; distinguish minimal (nothing below) from minimum (below everything)"
      - id: kp2
        name: "Upper and lower bounds"
        key_prerequisites: [partial-orders]
        exemplars:
          - problem: 'In $\mathcal{P}(\{a, b, c\})$ under $\subseteq$, find all upper bounds of $\{\{a\}, \{b\}\}$ and the least upper bound.'
            answer: 'Upper bounds $\{a, b\}$ and $\{a, b, c\}$; least upper bound $\{a, b\}$.'
            solution_sketch: 'An upper bound must contain both singletons, hence both $a$ and $b$; the smallest such set is $\{a, b\}$ (the union).'
          - problem: 'In the divisors of $12$ under divisibility, find all lower bounds of $\{4, 6\}$ and the greatest lower bound.'
            answer: 'Lower bounds $1$ and $2$; greatest lower bound $2$.'
            solution_sketch: 'A lower bound divides both $4$ and $6$: the common divisors $1, 2$. The greatest is $\gcd(4, 6) = 2$.'
        constraints: "bounds of two-element subsets; lub/glb are union/intersection or lcm/gcd"
      - id: kp3
        name: "Uniqueness of extremes"
        key_prerequisites: [partial-orders]
        exemplars:
          - problem: 'Prove: a poset has at most one maximum element.'
            answer: 'Two maxima $m, m''$ satisfy $m \preceq m''$ and $m'' \preceq m$, so $m = m''$ by antisymmetry.'
            solution_sketch: 'If $m$ and $m''$ are both maxima, each is $\succeq$ everything, so $m \preceq m''$ and $m'' \preceq m$; antisymmetry gives $m = m''$. $\square$'
          - problem: 'Prove: in a finite poset, every element lies below some maximal element.'
            answer: 'Climb strictly upward; finiteness forces the climb to stop at a maximal element.'
            solution_sketch: 'Start at $a$. If the current element is not maximal, move strictly up. Antisymmetry means no element repeats, so in a finite poset the climb halts — at an element with nothing above it, i.e. a maximal element above $a$. $\square$'
        constraints: "short proofs from antisymmetry and finiteness"
    diagnostic_exemplar:
      problem: 'In the poset $\{2, 3, 4, 6, 12\}$ under divisibility: find all minimal and all maximal elements, say whether a minimum exists, and find all lower bounds of $\{4, 6\}$ together with their greatest lower bound.'
      answer: 'Minimal elements: $2$ and $3$ — no other element of the set divides either. Maximal element: $12$ alone, and since every element divides $12$ it is in fact a maximum. There is no minimum: a minimum would have to divide both $2$ and $3$, and neither of them divides the other. Lower bounds of $\{4, 6\}$: the elements dividing both $4$ and $6$, i.e. just $2$; so the greatest lower bound is $2$.'
      solution_sketch: 'Minimal means nothing lies strictly below it, while a minimum must lie below everything. For the bounds, list the elements dividing both $4$ and $6$ and take the largest.'
    anki_seeds:
      - front: 'Maximal vs maximum in a poset?'
        back: 'Maximal: nothing strictly above it. Maximum: above (or equal to) every element; a maximum is unique.'
        type: basic
      - front: 'In $(\mathbb{Z}^{+}, \mid)$, the glb and lub of $\{a, b\}$?'
        back: '$\gcd(a, b)$ and $\mathrm{lcm}(a, b)$.'
        type: basic

  - id: pigeonhole-principle
    name: "The Pigeonhole Principle"
    core: false                # terminal counting result
    difficulty: 0.60
    drill: false
    answer_kind: proof
    expected_time_secs: 210
    prerequisites:
      - id: functions-injective-surjective
        weight: 0.5
        key: true
      - id: counting-functions
        weight: 0.3
      - id: floor-ceiling-functions
        weight: 0.2
        key: false
      - id: quantifiers
        weight: 0.2
      - id: cartesian-products
        weight: 0.0
    knowledge_points:
      - id: kp1
        name: "The principle via functions"
        key_prerequisites: [functions-injective-surjective]
        exemplars:
          - problem: 'Prove: if $f : A \to B$ with $|A| > |B|$ (finite sets), then $f$ is not injective.'
            answer: 'An injection would force $|A| \le |B|$.'
            solution_sketch: 'If $f$ were injective it would biject $A$ onto $f(A) \subseteq B$, giving $|A| = |f(A)| \le |B|$, contradicting $|A| > |B|$. So two elements of $A$ share an image. $\square$'
          - problem: 'Prove: if $f : A \to B$ is injective with $A, B$ finite, then $|A| \le |B|$.'
            answer: 'An injection bijects $A$ onto $f(A) \subseteq B$.'
            solution_sketch: 'An injective $f$ gives a bijection $A \to f(A)$, so $|A| = |f(A)|$; and $f(A) \subseteq B$ gives $|f(A)| \le |B|$. Hence $|A| \le |B|$. $\square$'
        constraints: "connect (non-)injectivity to the counting inequality"
      - id: kp2
        name: "Basic applications"
        key_prerequisites: [functions-injective-surjective]
        exemplars:
          - problem: 'Prove: among any $13$ people, two share a birth month.'
            answer: '$13$ pigeons, $12$ holes.'
            solution_sketch: 'Map each person to their birth month, $f : \{13 \text{ people}\} \to \{12 \text{ months}\}$. Since $13 > 12$, $f$ is not injective, so two people map to the same month. $\square$'
          - problem: 'Prove: among any $8$ integers, two leave the same remainder on division by $7$.'
            answer: '$8$ integers, $7$ remainders.'
            solution_sketch: 'Map each integer to its remainder mod $7$, in $\{0, \dots, 6\}$ ($7$ holes). With $8$ integers and $7$ remainders, two share a remainder. $\square$'
        constraints: "identify pigeons and holes, then apply the principle"
      - id: kp3
        name: "Generalized pigeonhole"
        key_prerequisites: [functions-injective-surjective]
        exemplars:
          - problem: 'Prove: among any $n + 1$ integers, two leave the same remainder on division by $n$.'
            answer: '$n + 1$ integers, $n$ possible remainders.'
            solution_sketch: 'Map each integer to its remainder mod $n$, landing in $\{0, 1, \dots, n - 1\}$ ($n$ values). With $n + 1$ integers and $n$ remainders, two share a remainder; their difference is then divisible by $n$. $\square$'
          - problem: 'Prove: if $25$ balls are placed in $6$ boxes, some box has at least $5$ balls.'
            answer: '$\lceil 25/6 \rceil = 5$.'
            solution_sketch: 'If every box held at most $4$ balls, the total would be at most $6 \cdot 4 = 24 < 25$. So some box has at least $\lceil 25/6 \rceil = 5$ balls. $\square$'
        constraints: "use residues/boxes as the holes; generalized form $\\lceil n/k \\rceil$"
    diagnostic_exemplar:
      problem: 'Prove: if $5$ points are placed in a $2 \times 2$ square, two of them are within distance $\sqrt{2}$.'
      answer: 'Split into four unit cells; two points share a cell of diameter $\sqrt 2$.'
      solution_sketch: 'Partition the square into four $1 \times 1$ cells. With $5$ points and $4$ cells, two points lie in the same unit cell; the largest distance within a unit square is its diagonal $\sqrt 2$, so those two are within $\sqrt 2$. $\square$'
    anki_seeds:
      - front: 'Pigeonhole principle (function form)?'
        back: 'If $f : A \to B$ with $|A| > |B|$ (finite), then $f$ is not injective: some value is taken at least twice.'
        type: basic
      - front: 'Generalized pigeonhole: $n$ objects in $k$ boxes?'
        back: 'Some box contains at least $\lceil n/k \rceil$ objects.'
        type: basic
