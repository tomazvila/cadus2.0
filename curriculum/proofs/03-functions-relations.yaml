        exemplars:
          - problem: "Let $R = \\{(1,2), (2,3), (3,1)\\}$ on the vertex set $\\{1, 2, 3\\}$; each pair $(a, b)$ gives an arrow $a \\to b$. How many vertices of the digraph of $R$ carry loops?"
            answer: "0"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (arrow rule): the pairs of $R$ give the arrows $1 \\to 2$, $2 \\to 3$ and $3 \\to 1$, and no pair has equal coordinates. Step 2 (loop test): a loop at a vertex $a$ needs the pair $(a, a)$ in $R$, and $(1,2)$, $(2,3)$, $(3,1)$ contains no such pair. Step 3: no vertex carries a loop, so the number of loops is 0."
          - problem: "For the divisibility relation on $\\{1, 2, 3, 4\\}$, the pair $(a, b)$ is in $R$ exactly when $a$ divides $b$. Give the set of vertices of the digraph that carry loops."
