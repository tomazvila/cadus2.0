        weight: 0.0
    knowledge_points:
      - id: kp1
        name: "Monotonicity of image and preimage"
        key_prerequisites: [computing-images-preimages]
        exemplars:
          - problem: "Let $f(x) = 2x + 1$, with $S = \\{0, 3, 5\\}$ and $T = \\{-1, 0, 2, 3, 5\\}$, so $S \\subseteq T$. To prove $f(S) \\subseteq f(T)$ straight from the definition of image, take $y = 7$ in $f(S)$; the first line of the proof chooses an $x$ in $S$ with $f(x) = 7$. Find that $x$."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "By the definition of image, $y \\in f(S)$ means $y = f(x)$ for some $x \\in S$. Solve $2x + 1 = 7$: $x = 3$, and $3 \\in S = \\{0, 3, 5\\}$. Since $S \\subseteq T$, the same $x$ lies in $T$, so $y = f(3) \\in f(T)$, which is the one-line inclusion. The witness is $x = 3$."
          - problem: "Let $f(x) = x^2 - 3$, with $C = \\{1\\}$ and $D = \\{1, 6\\}$, so $C \\subseteq D$. The point $x = -2$ lies in $f^{-1}(C)$. Determine whether $x = -2$ is also a member of $f^{-1}(D)$, and give the value of $f(-2)$."
            answer: "verdict = member; fx = 1"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["member"], ["outsider"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "fx"}]}
            solution_sketch: "By the definition of preimage, $x \\in f^{-1}(D)$ exactly when $f(x) \\in D$. Compute $f(-2) = (-2)^2 - 3 = 1$. Since $1 \\in D = \\{1, 6\\}$, the point $-2$ lies in $f^{-1}(D)$; this is the one-line inclusion forced by $C \\subseteq D$. The verdict is member and $f(-2) = 1$."
          - problem: "Let $f(x) = x^2$, $S = \\{-2, -1, 0, 1\\}$ and $T = \\{-3, -2, -1, 0, 1, 2, 3\\}$, so $S \\subseteq T$ and monotonicity gives $f(S) \\subseteq f(T)$. Compute the two images and their set difference. How many elements does $f(T) \\setminus f(S)$ have?"
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "By the definition of image, $f(S) = \\{f(s) : s \\in S\\}$: $f(-2) = 4$, $f(-1) = 1$, $f(0) = 0$, $f(1) = 1$, so $f(S) = \\{0, 1, 4\\}$. The extra points $\\pm 3$ in $T$ give $f(\\pm 3) = 9$, so $f(T) = \\{0, 1, 4, 9\\}$. The difference $f(T) \\setminus f(S) = \\{9\\}$ is nonempty, in agreement with the inclusion $f(S) \\subseteq f(T)$. The answer is 1."
          - problem: "Let $f(x) = x^2$, $C = \\{1, 4\\}$ and $D = \\{0, 1, 4, 9\\}$, so $C \\subseteq D$ and monotonicity gives $f^{-1}(C) \\subseteq f^{-1}(D)$. Compute the two preimages and their difference. How many elements does $f^{-1}(D) \\setminus f^{-1}(C)$ have?"
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "By the definition of preimage, $f^{-1}(C) = \\{x : f(x) \\in C\\}$. Solving $x^2 = 1$ and $x^2 = 4$ gives $f^{-1}(C) = \\{-2, -1, 1, 2\\}$. Solving $x^2 \\in \\{0, 1, 4, 9\\}$ gives $f^{-1}(D) = \\{-3, -2, -1, 0, 1, 2, 3\\}$. The difference $f^{-1}(D) \\setminus f^{-1}(C) = \\{-3, 0, 3\\}$ confirms the inclusion $f^{-1}(C) \\subseteq f^{-1}(D)$. The answer is 3."
          - problem: "Claim: if $S \\subseteq T$ then $f(S) \\subseteq f(T)$. A student argues: Step 1: let $y \\in f(S)$. Step 2: then $y = f(x)$ for every $x \\in T$. Step 3: since $S \\subseteq T$, every $x \\in S$ lies in $T$. Step 4: therefore $y = f(x)$ for some $x \\in T$, so $y \\in f(T)$. Which step is the first that is not valid?"
            answer: "Step 2"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "Step 1 is a valid start: it just picks an element $y$ of $f(S)$. Step 2 is the first invalid step: the definition of image gives $y = f(x)$ for some $x \\in S$, not for every $x \\in T$. Step 3 states a true fact about the subset relation, and Step 4 would follow if Step 2 read 'for some $x \\in S$'. The answer is Step 2."
          - problem: "To prove that $C \\subseteq D$ implies $f^{-1}(C) \\subseteq f^{-1}(D)$, a proof reads: Line 1: let $x \\in f^{-1}(C)$. Line 2: [missing]. Line 3: since $C \\subseteq D$, we get $f(x) \\in D$. Line 4: therefore $x \\in f^{-1}(D)$. Select the statement that fills Line 2 and makes the proof correct."
            answer: "f(x) in C"
            answer_contract: {"kind": "label", "options": [["f(x) in C"], ["x in C"], ["f(x) not in C"], ["x in f^-1(D)"]]}
            solution_sketch: "Line 1 chooses $x \\in f^{-1}(C)$, so by the definition of preimage the missing line is exactly $f(x) \\in C$, written as the option f(x) in C. The option x in C confuses the preimage with the image of a point. The option f(x) not in C is a sign error and contradicts Line 3. The option x in f^-1(D) assumes the conclusion and is circular. The answer is f(x) in C."
          - problem: "Write the full proof: if $S \\subseteq T$ (subsets of the domain of $f$), then $f(S) \\subseteq f(T)$, and if $C \\subseteq D$ (subsets of the codomain of $f$), then $f^{-1}(C) \\subseteq f^{-1}(D)$. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1 (image inclusion): let $y \\in f(S)$. By the definition of image, $y = f(x)$ for some $x \\in S$. Step 2: since $S \\subseteq T$, this $x$ lies in $T$. Step 3: then $y = f(x)$ with $x \\in T$, so $y \\in f(T)$ by the definition of image. Hence $f(S) \\subseteq f(T)$. Step 4 (preimage inclusion): let $x \\in f^{-1}(C)$. By the definition of preimage, $f(x) \\in C$. Step 5: since $C \\subseteq D$, we get $f(x) \\in D$. Step 6: by the definition of preimage again, $x \\in f^{-1}(D)$. Hence $f^{-1}(C) \\subseteq f^{-1}(D)$. Both inclusions are one-line proofs straight from the definitions, with no injectivity needed."
        constraints: "one-line inclusion proofs straight from the definitions of image and preimage"
      - id: kp2
        name: "Images and unions"
        key_prerequisites: [set-operations]
        exemplars:
          - problem: "Let $f$ be the function with $f(1) = 10$, $f(2) = 10$, $f(3) = 20$, and let $S = \\{1, 2\\}$ and $T = \\{2, 3\\}$ be subsets of its domain. Compute the number of elements of $f(S \\cup T)$."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "First form the union: $S \\cup T = \\{1, 2, 3\\}$ by the definition of union. Apply the definition of image elementwise: $f(1) = 10$, $f(2) = 10$, $f(3) = 20$, so $f(S \\cup T) = \\{10, 20\\}$. The two values are distinct, so the image has two elements. The answer is 2."
          - problem: "Let $f(x) = x^2$ on the integers, with $S = \\{-2, 3\\}$ and $T = \\{-3, 5\\}$. In the element chase proving $f(S \\cup T) \\subseteq f(S) \\cup f(T)$, take $y = 4$, which lies in $f(S \\cup T)$. Give the element $x$ of $S \\cup T$ that satisfies $f(x) = y$."
            answer: "-2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "By the definition of image, $y \\in f(S \\cup T)$ means $y = f(x)$ for some $x \\in S \\cup T$; this is the element chase. Evaluate the full function on $S \\cup T$: $f(-2) = 4$, $f(3) = 9$, $f(-3) = 9$, $f(5) = 25$. Only $-2$ maps to $4$, and $-2 \\in S$, so $y \\in f(S)$. The witness is -2."
          - problem: "Let $f(x) = x^2$ with $S = \\{2\\}$ and $T = \\{-2\\}$. A student claims $f(S \\cap T) = f(S) \\cap f(T)$; here $S \\cap T$ is empty, so $f(S \\cap T)$ has no elements. Compute the number of elements of $f(S) \\cap f(T)$."
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Compute both sides: $S \\cap T = \\varnothing$, so $f(S \\cap T) = \\varnothing$ has no elements. But $f(S) = \\{4\\}$ and $f(T) = \\{4\\}$, so $f(S) \\cap f(T) = \\{4\\}$, which has one element. The two sides differ, showing images need not preserve intersections; the collapse $f(2) = f(-2)$ is the cause. The answer is 1."
          - problem: "A student argues that $f(S \\cap T) = f(S) \\cap f(T)$ always holds. Step 1: let $y$ lie in $f(S) \\cap f(T)$. Step 2: then $y$ lies in $f(S)$ and $y$ lies in $f(T)$. Step 3: so $y = f(s)$ for some $s$ in $S$, and $y = f(t)$ for some $t$ in $T$. Step 4: hence $s = t$, so $s$ lies in $S \\cap T$. Step 5: therefore $y$ lies in $f(S \\cap T)$, proving equality. Which step is the first step that is not valid?"
            answer: "Step 4"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"], ["Step 5"]]}
            solution_sketch: "The full argument runs from $y \\in f(S) \\cap f(T)$ to $y \\in f(S \\cap T)$. Step 1 correctly picks $y$ in the intersection by its definition, and Step 2 is a valid restatement of intersection membership. Step 3 is valid: membership in an image supplies a preimage element. Step 4 is the first invalid step: $f(s) = f(t)$ forces $s = t$ only when $f$ is injective, and for $f(x) = x^2$ with $S = \\{3\\}$, $T = \\{-3\\}$ the values $s = 3$ and $t = -3$ differ while $f(s) = f(t)$. Step 5 would follow if Step 4 held, since then $s \\in S \\cap T$ and $y = f(s)$. The answer is Step 4."
          - problem: "To prove $f(S \\cup T) \\subseteq f(S) \\cup f(T)$, the argument starts: let $y$ lie in $f(S \\cup T)$. The next line of the element chase is missing. Select the line that is true and that lets the proof continue."
            answer: "y = f(x) for some x with x in S or x in T"
            answer_contract: {"kind": "label", "options": [["y = f(x) for some x with x in S or x in T"], ["y = f(x) for every x with x in S or x in T"], ["y = f(x) for some x with x in S and x in T"], ["f(y) = x for some x with x in S or x in T"]]}
            solution_sketch: "The full chase starts from $y \\in f(S \\cup T)$. By the definition of image, the missing line must exhibit one element $x$ of $S \\cup T$ with $y = f(x)$, and $x \\in S \\cup T$ unfolds to $x \\in S$ or $x \\in T$. The option 'y = f(x) for every x with x in S or x in T' confuses existence with universality. The option 'y = f(x) for some x with x in S and x in T' uses the wrong set, since the witness need not lie in both sets. The option 'f(y) = x for some x with x in S or x in T' reverses input and output. The answer is y = f(x) for some x with x in S or x in T."
          - problem: "In the second inclusion of the proof that $f(S \\cup T) = f(S) \\cup f(T)$, one argues: if $y$ lies in $f(S)$ or $y$ lies in $f(T)$, then $y$ lies in $f(S \\cup T)$. Which fact justifies this step?"
            answer: "the definition of union"
            answer_contract: {"kind": "label", "options": [["the definition of union"], ["injectivity of f"], ["disjointness of S and T"], ["the definition of preimage"]]}
            solution_sketch: "The full implication to justify is: from $y \\in f(S)$ or $y \\in f(T)$, conclude $y \\in f(S \\cup T)$. Step 1: if $y \\in f(S)$, the definition of image gives $y = f(x)$ for some $x \\in S$. Step 2: since $x \\in S$ gives $x \\in S \\cup T$ by the definition of union, the definition of image gives $y \\in f(S \\cup T)$, and the case $y \\in f(T)$ is the same. The option 'injectivity of f' is wrong because the proof never splits a value back into a unique preimage, so no injectivity is used. The option 'disjointness of S and T' is wrong because a union contains both sets whether or not they overlap. The option 'the definition of preimage' is wrong because preimages concern $f^{-1}$ of a subset of the codomain, while this step moves forward from points of $S$ and $T$. The answer is the definition of union."
          - problem: "Write the full proof: $f(S \\cup T) = f(S) \\cup f(T)$ for any function $f$ and subsets $S, T$ of its domain. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1 (inclusion into the union): let $y \\in f(S \\cup T)$. By the definition of image, $y = f(x)$ for some $x \\in S \\cup T$. By the definition of union, $x \\in S$ or $x \\in T$. If $x \\in S$, then $y \\in f(S)$; if $x \\in T$, then $y \\in f(T)$. In either case $y \\in f(S) \\cup f(T)$, so $f(S \\cup T) \\subseteq f(S) \\cup f(T)$. Step 2 (inclusion out of the union): let $y \\in f(S) \\cup f(T)$; then $y \\in f(S)$ or $y \\in f(T)$, so $y = f(x)$ for some $x \\in S$ or some $x \\in T$. In both cases $x \\in S \\cup T$, hence $y \\in f(S \\cup T)$, giving $f(S) \\cup f(T) \\subseteq f(S \\cup T)$. Step 3 (conclusion): the two inclusions give equality. Caution: the analogous claim for $\\cap$ fails, since $f(s) = f(t)$ need not give $s = t$; take $f(x) = x^2$, $S = \\{2\\}$, $T = \\{-2\\}$."
        constraints: "chase an element through the image of a union; note images need not preserve $\\cap$"
      - id: kp3
        name: "Preimages preserve unions and intersections"
        key_prerequisites: [set-identities-proofs]
        exemplars:
          - problem: "Let $f: \\{1,2,3,4,5\\} \\to \\{1,2,3,4\\}$ with $f(1)=1$, $f(2)=2$, $f(3)=2$, $f(4)=3$, $f(5)=4$, and let $C = \\{2,3,4\\}$ and $D = \\{1,2,3\\}$. Using $x \\in f^{-1}(C \\cap D)$ iff $f(x) \\in C \\cap D$, give $|f^{-1}(C \\cap D)|$."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full sets: $C \\cap D = \\{2,3\\}$, the common elements of $C$ and $D$. Step 1 (definition of preimage): $x \\in f^{-1}(C \\cap D)$ iff the condition $f(x) \\in C \\cap D$ holds. Step 2: $f(2)=2$, $f(3)=2$ and $f(4)=3$ land in $\\{2,3\\}$, while $f(1)=1$ and $f(5)=4$ do not, so $f^{-1}(C \\cap D) = \\{2,3,4\\}$. Counting gives three elements. The answer is 3."
          - problem: "Let $f: \\{1,2,3,4,5,6\\} \\to \\{a,b,c\\}$ with $f(1)=a$, $f(2)=b$, $f(3)=b$, $f(4)=c$, $f(5)=a$, $f(6)=c$, and let $C = \\{a\\}$ and $D = \\{c\\}$. Using $x \\in f^{-1}(C \\cup D)$ iff $f(x) \\in C \\cup D$, give $|f^{-1}(C \\cup D)|$."
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full sets: $C \\cup D = \\{a,c\\}$. Step 1 (definition of preimage): $x \\in f^{-1}(C \\cup D)$ iff the condition $f(x) \\in C \\cup D$ holds. Step 2: $f(1)=a$, $f(4)=c$, $f(5)=a$ and $f(6)=c$ land in $\\{a,c\\}$, while $f(2)=f(3)=b$ do not, so $f^{-1}(C \\cup D) = \\{1,4,5,6\\}$. This matches $f^{-1}(C) \\cup f^{-1}(D) = \\{1,5\\} \\cup \\{4,6\\}$. The answer is 4."
          - problem: "Let $f: \\mathbb{R} \\to \\mathbb{R}$ with $f(x) = x^2$, and let $C = \\{y : y \\ge 1\\}$ and $D = \\{y : y \\le 9\\}$. Using $x \\in f^{-1}(C \\cap D)$ iff $f(x) \\in C \\cap D$, give the number of integers in $f^{-1}(C \\cap D)$."
            answer: "6"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full sets: $C \\cap D = \\{y : 1 \\le y \\le 9\\}$. Step 1 (definition of preimage): $x \\in f^{-1}(C \\cap D)$ iff $x^2 \\in C \\cap D$, that is $1 \\le x^2 \\le 9$. Step 2: solving gives $1 \\le |x| \\le 3$, so the integers are $-3,-2,-1,1,2,3$. Counting gives six integers. The answer is 6."
          - problem: "Let $C$ and $D$ be subsets of the codomain of a function $f$. In the element chase for $f^{-1}(C \\cap D) = f^{-1}(C) \\cap f^{-1}(D)$, the line $x \\in f^{-1}(C \\cap D)$ iff ? is written with its right side missing. Select the right side that follows from the definition of preimage."
            answer: "$f(x) \\in C \\cap D$"
            answer_contract: {"kind": "label", "options": [["$f(x) \\in C \\cap D$"], ["$f(x) \\in C \\cup D$"], ["$x \\in f^{-1}(C) \\cap f^{-1}(D)$"], ["$x \\in f^{-1}(C) \\cup f^{-1}(D)$"]]}
            solution_sketch: "The full line starts from the membership $x \\in f^{-1}(C \\cap D)$. By the definition of preimage, this membership is the condition on the value $f(x)$, so the right side is $f(x) \\in C \\cap D$. The option $f(x) \\in C \\cup D$ swaps the intersection for a union. The option $x \\in f^{-1}(C) \\cup f^{-1}(D)$ also brings in the union and jumps to the preimages of the parts. The option $x \\in f^{-1}(C) \\cap f^{-1}(D)$ states the goal of the whole chase instead of the first line. The answer is $f(x) \\in C \\cap D$."
          - problem: "Let $A$ and $B$ be subsets of the codomain of a function $f$. In the element chase that proves $f^{-1}(A \\cup B) = f^{-1}(A) \\cup f^{-1}(B)$, the line $x \\in f^{-1}(A \\cup B)$ iff $\\;?$ is missing its right side. Select the line that is true and that continues the chase with the definition of preimage."
            answer: "$f(x) \\in A$ or $f(x) \\in B$"
            answer_contract: {"kind": "label", "options": [["$f(x) \\in A$ or $f(x) \\in B$"], ["$f(x) \\in A$ and $f(x) \\in B$"], ["$x \\in f^{-1}(A)$ or $x \\in f^{-1}(B)$"], ["$x \\in f^{-1}(A)$ and $x \\in f^{-1}(B)$"]]}
            solution_sketch: "The full chase starts at $x \\in f^{-1}(A \\cup B)$. By the definition of preimage, membership is the condition on $f(x)$, so the next line is $f(x) \\in A \\cup B$, which splits into $f(x) \\in A$ or $f(x) \\in B$. The option with and treats the union as an intersection. The option jumping to $x \\in f^{-1}(A)$ or $x \\in f^{-1}(B)$ restates the goal instead of applying the definition of preimage to $A \\cup B$. The remaining option is the intersection identity, not the union one. The answer is $f(x) \\in A$ or $f(x) \\in B$."
          - problem: "Let $f: \\{1,2,3,4,5,6\\} \\to \\{a,b,c,d\\}$ with $f(1)=a$, $f(2)=b$, $f(3)=a$, $f(4)=c$, $f(5)=b$, $f(6)=d$, and let $C = \\{a,b\\}$ and $Y = \\{a,b,c,d\\}$. Using $x \\in f^{-1}(Y \\setminus C)$ iff $f(x) \\notin C$, give $|f^{-1}(Y \\setminus C)|$."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full sets: $Y = \\{a,b,c,d\\}$ and $C = \\{a,b\\}$, so $Y \\setminus C = \\{c,d\\}$. Step 1 (definition of preimage): $x \\in f^{-1}(Y \\setminus C)$ iff the condition $f(x) \\notin C$ holds. Step 2: $f(4)=c$ and $f(6)=d$ are the only values outside $C$, so $f^{-1}(Y \\setminus C) = \\{4,6\\}$, matching $X \\setminus f^{-1}(C)$. The answer is 2."
          - problem: "Write the full proof: for every function $f$ and all subsets $P, Q$ of its codomain, $f^{-1}(P \\cup Q) = f^{-1}(P) \\cup f^{-1}(Q)$. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Proof. Step 1 (definition of preimage): take any $x$ in the domain; $x \\in f^{-1}(P \\cup Q)$ iff $f(x) \\in P \\cup Q$, since preimage membership is defined by the condition on $f(x)$. Step 2 (definition of union of codomain sets): $f(x) \\in P \\cup Q$ iff $f(x) \\in P$ or $f(x) \\in Q$. Step 3 (definition of preimage, applied twice): $f(x) \\in P$ iff $x \\in f^{-1}(P)$, and $f(x) \\in Q$ iff $x \\in f^{-1}(Q)$. Step 4 (definition of union of domain sets): $x \\in f^{-1}(P)$ or $x \\in f^{-1}(Q)$ iff $x \\in f^{-1}(P) \\cup f^{-1}(Q)$. Chaining the four if-and-only-if steps gives $x \\in f^{-1}(P \\cup Q)$ iff $x \\in f^{-1}(P) \\cup f^{-1}(Q)$. Since $x$ was arbitrary, the two sets have exactly the same elements, so $f^{-1}(P \\cup Q) = f^{-1}(P) \\cup f^{-1}(Q)$. The same chase with and in place of or proves the intersection version. This proves the claim, so the answer is See the solution."
        constraints: "use that preimage membership is defined by a condition on $f(x)$"
    diagnostic_exemplar:
      problem: 'Prove that $f(S \cap T) \subseteq f(S) \cap f(T)$ for any function $f$ and subsets $S, T$ of its domain, give an example where the inclusion is strict, and decide whether $f^{-1}(C \cap D) = f^{-1}(C) \cap f^{-1}(D)$ holds in general.'
      answer: 'Inclusion: let $y \in f(S \cap T)$, say $y = f(x)$ with $x \in S \cap T$. Then $x \in S$ gives $y \in f(S)$, and $x \in T$ gives $y \in f(T)$, so $y \in f(S) \cap f(T)$. Strictness: take $f(x) = x^2$, $S = \{1\}$, $T = \{-1\}$; then $S \cap T = \varnothing$, so $f(S \cap T) = \varnothing$, while $f(S) \cap f(T) = \{1\}$. For preimages equality always holds: $x \in f^{-1}(C \cap D)$ iff $f(x) \in C$ and $f(x) \in D$, iff $x \in f^{-1}(C)$ and $x \in f^{-1}(D)$.'
      solution_sketch: 'Chase an element for the inclusion; equality fails when two different inputs share an output. Preimages behave better because membership is tested after applying $f$.'
    anki_seeds:
      - front: 'Definitions of the image $f(S)$ and preimage $f^{-1}(T)$?'
        back: '$f(S) = \{f(x) : x \in S\}$; $f^{-1}(T) = \{x : f(x) \in T\}$.'
        type: basic
      - front: 'Which is better behaved with respect to $\cap$ and complements, image or preimage?'
        back: 'The preimage: it preserves unions, intersections, and complements; the image only gives $f(S \cap T) \subseteq f(S) \cap f(T)$.'
        type: basic

  - id: relations-digraphs-matrices
    name: "Representing Relations"
    core: true
    difficulty: 0.52
    drill: false
    answer_kind: numeric
    expected_time_secs: 120
    prerequisites:
      - id: cartesian-products
        weight: 0.5
        key: true
      - id: set-notation
        weight: 0.2
    knowledge_points:
      - id: kp1
        name: "Relations as sets of pairs"
        key_prerequisites: [cartesian-products]
        exemplars:
          - problem: 'On $A = \{1, 2, 3, 4\}$, list the pairs of the relation $R = \{(a, b) : a \mid b\}$.'
            answer: '$\{(1,1),(1,2),(1,3),(1,4),(2,2),(2,4),(3,3),(4,4)\}$'
            solution_sketch: 'For each $a$, list the multiples of $a$ inside $A$: $1$ divides everything, $2$ divides $2, 4$, and each element divides itself.'
          - problem: 'On $A = \{1, 2, 3\}$, list the pairs of $R = \{(a, b) : a + b \text{ is even}\}$.'
            answer: '$\{(1,1),(1,3),(3,1),(3,3),(2,2)\}$'
            solution_sketch: '$a + b$ is even iff $a, b$ have the same parity: pair the odds $1, 3$ with each other and $2$ with itself.'
          - problem: "On A = {1, 2, 3, 4}, let R = {(a, b) : a*b is even}. How many pairs are in R?"
            answer: "12"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The relation R is the set of pairs (a,b) in A x A for which a*b is even. Step 1: List all 16 ordered pairs from A x A. Step 2: The product a*b is odd exactly when both a and b are odd; there are 2 odd numbers in A, so 2*2 = 4 such pairs. Step 3: Subtract the 4 odd-product pairs from the 16 total pairs: 16 - 4 = 12. The number of pairs in R is 12."
          - problem: "On A = {1, 2, 3}, let R = {(a, b) : a < b}. Give the pairs of R in increasing order of first coordinate, then second coordinate, as a flat list of numbers separated by commas."
            answer: "1, 2, 1, 3, 2, 3"
            answer_contract: {"kind": "list", "member": {"kind": "exact"}, "ordered": true}
            solution_sketch: "The relation R is the set of pairs (a,b) in {1,2,3} x {1,2,3} with a < b. Step 1: For first coordinate 1, the second coordinates are 2 and 3, giving (1,2) and (1,3). Step 2: For first coordinate 2, the second coordinate is 3, giving (2,3). Step 3: Flatten the pairs in order: 1, 2, 1, 3, 2, 3. The required list is 1, 2, 1, 3, 2, 3."
          - problem: "On A = {1, 2, 3, 4}, let R = {(a, b) : |a - b| = 1}. How many pairs are in R?"
            answer: "6"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The relation R is the set of pairs (a,b) in A x A with |a - b| = 1. Step 1: List the pairs whose coordinates differ by exactly 1: (1,2), (2,1), (2,3), (3,2), (3,4), and (4,3). Step 2: Count these pairs: there are 6 of them. The number of pairs in R is 6."
          - problem: "On A = {1, 2, 3, 4}, let R = {(a, b) : a < b}. How many pairs of R have first coordinate 2?"
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The relation R is the set of pairs (a,b) in A x A with a < b. Step 1: Fix a = 2, so the condition is 2 < b. Step 2: The elements of A greater than 2 are 3 and 4, giving the pairs (2,3) and (2,4). Step 3: Counting these pairs gives 2. The number of pairs with first coordinate 2 is 2."
        constraints: "enumerate a rule-defined relation on a set of size at most 4"
      - id: kp2
        name: "Digraphs of relations"
        key_prerequisites: [cartesian-products]
        exemplars:
          - problem: "Let $R = \\{(1,2), (2,3), (3,1)\\}$ on the vertex set $\\{1, 2, 3\\}$; each pair $(a, b)$ gives an arrow $a \\to b$. How many vertices of the digraph of $R$ carry loops?"
            answer: "0"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (arrow rule): the pairs of $R$ give the arrows $1 \\to 2$, $2 \\to 3$ and $3 \\to 1$, and no pair has equal coordinates. Step 2 (loop test): a loop at a vertex $a$ needs the pair $(a, a)$ in $R$, and $(1,2)$, $(2,3)$, $(3,1)$ contains no such pair. Step 3: no vertex carries a loop, so the number of loops is 0."
          - problem: "For the divisibility relation on $\\{1, 2, 3, 4\\}$, the pair $(a, b)$ is in $R$ exactly when $a$ divides $b$. Give the set of vertices of the digraph that carry loops."
            answer: "{1, 2, 3, 4}"
            answer_contract: {"kind": "set"}
            solution_sketch: "Step 1 (loop test): vertex $a$ carries a loop exactly when $(a, a)$ is in $R$. Step 2 (divisibility): $a$ divides $a$ for every $a$, so $(a, a)$ is in $R$ for $a = 1, 2, 3, 4$. Step 3: the set of looped vertices is {1, 2, 3, 4}."
          - problem: "The digraph of a relation on $A = \\{1, 2, 3, 4\\}$ has the arrows $1 \\to 3$, $2 \\to 3$, $3 \\to 4$ and a loop at 3. Find the in-degree of vertex 3."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (arrow rule read as pairs): the arrow list comes from the pairs $(1,3)$, $(2,3)$, $(3,4)$ and the loop pair $(3,3)$. Step 2 (in-degree rule): the in-degree of a vertex counts the arrows that enter it, here $1 \\to 3$, $2 \\to 3$ and the loop $3 \\to 3$. Step 3: three arrows enter vertex 3, so the in-degree of vertex 3 is 3."
          - problem: "On $A = \\{2, 3, 4\\}$ let $R$ be the set of pairs $(a, b)$ with $a \\le b$. Find the out-degree of vertex 3 in the digraph of $R$."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (pair rule): $R$ contains the pairs with $a \\le b$, namely $(2,2)$, $(2,3)$, $(2,4)$, $(3,3)$, $(3,4)$, $(4,4)$. Step 2 (out-degree rule): the out-degree of 3 counts the pairs with first coordinate 3, namely $(3,3)$ and $(3,4)$, which give the arrows $3 \\to 3$ and $3 \\to 4$. Step 3: the out-degree of vertex 3 is 2."
          - problem: "On $A = \\{2, 3, 4, 6\\}$ let $R$ be the set of pairs $(a, b)$ such that $a$ divides $b$; each pair gives one arrow $a \\to b$. How many arrows does the digraph of $R$ have?"
            answer: "7"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (pair rule): list the pairs with $a$ dividing $b$: $(2,2)$, $(2,4)$, $(2,6)$, $(3,3)$, $(3,6)$, $(4,4)$, $(6,6)$. Step 2 (arrow rule): each pair gives exactly one arrow, so the arrow count equals the pair count. Step 3: there are 7 pairs, so the digraph has 7 arrows."
        constraints: "translate between pair sets and arrows/loops on a small vertex set"
      - id: kp3
        name: "Zero-one matrices and counting relations"
        key_prerequisites: [cartesian-products]
        exemplars:
          - problem: 'How many relations are there on a $2$-element set?'
            answer: '$16$'
            solution_sketch: 'A relation is any subset of $A \times A$, which has $2^2 = 4$ pairs; $2^4 = 16$ subsets.'
          - problem: "On $A = \\{1,2,3\\}$ define $R = \\{(1,3), (2,1), (2,2), (3,3)\\}$. Give the $3 \\times 3$ zero-one matrix of $R$ as [a,b;c,d]."
            answer: "[0,0,1;1,1,0;0,0,1]"
            answer_contract: {"cols": 3, "kind": "matrix", "rows": 3}
            solution_sketch: "The relation is $R = \\{(1,3), (2,1), (2,2), (3,3)\\}$. Step 1 uses the definition of a zero-one matrix: entry $(i,j)$ is $1$ exactly when $(i,j)$ belongs to $R$. Step 2 fills row 1 with a 1 only in column 3, row 2 with ones in columns 1 and 2, and row 3 with a 1 only in column 3. The zero-one matrix is [0,0,1;1,1,0;0,0,1]."
          - problem: "Let $A = \\{a\\}$. How many relations are there on $A$?"
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The Cartesian product $A \\times A$ is $\\{(a,a)\\}$. Step 1 uses the definition of a relation: every subset of $A \\times A$ is a relation on $A$. Step 2 counts subsets of a one-element set: $2^1 = 2$. The number of relations is 2."
          - problem: "On $A = \\{1,2\\}$ define $R = \\{(1,2), (2,1)\\}$. Give the $2 \\times 2$ zero-one matrix of $R$ as [a,b;c,d]."
            answer: "[0,1;1,0]"
            answer_contract: {"cols": 2, "kind": "matrix", "rows": 2}
            solution_sketch: "The relation is $R = \\{(1,2), (2,1)\\}$. Step 1 uses the zero-one matrix encoding: entry $(i,j)$ is $1$ when $(i,j)$ belongs to $R$. Step 2 puts a 1 in row 1 column 2 and a 1 in row 2 column 1. The zero-one matrix is [0,1;1,0]."
          - problem: "Let $B = \\{1,2,3\\}$. How many relations are there on $B$?"
            answer: "512"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The Cartesian product $B \\times B$ has $3 \\cdot 3 = 9$ ordered pairs. Step 1 uses the definition of a relation: every subset of $B \\times B$ is a relation on $B$. Step 2 counts subsets of a nine-element set: $2^9 = 512$. The number of relations is 512."
          - problem: "On $A = \\{1,2,3\\}$ define $R = \\{(1,1), (1,2), (3,2)\\}$. Give the $3 \\times 3$ zero-one matrix of $R$ as [a,b;c,d]."
            answer: "[1,1,0;0,0,0;0,1,0]"
            answer_contract: {"cols": 3, "kind": "matrix", "rows": 3}
            solution_sketch: "The relation is $R = \\{(1,1), (1,2), (3,2)\\}$. Step 1 uses the zero-one matrix encoding: entry $(i,j)$ is $1$ exactly when $(i,j)$ belongs to $R$. Step 2 fills row 1 with ones in columns 1 and 2, row 2 with all zeros, and row 3 with a 1 only in column 2. The zero-one matrix is [1,1,0;0,0,0;0,1,0]."
        constraints: "matrix encoding on sets of size at most 3; count relations as $2^{n^2}$"
    diagnostic_exemplar:
      problem: 'On $A = \{1, 2, 3\}$ let $R = \{(a,b) : a \le b\}$. List the pairs of $R$, write its $3 \times 3$ zero-one matrix (rows indexed by the first coordinate), and say which vertices of its digraph carry loops.'
      answer_contract: {kind: none}
      answer: 'Pairs: $(1,1), (1,2), (1,3), (2,2), (2,3), (3,3)$. Matrix rows: $(1,1,1)$, $(0,1,1)$, $(0,0,1)$ — the entry in row $i$, column $j$ is $1$ exactly when $i \le j$. Every vertex carries a loop, since $a \le a$ for each $a$; loops are the diagonal $1$s.'
      solution_sketch: 'List the pairs whose first coordinate is at most the second, transcribe them into the matrix, and note that loops correspond to diagonal entries.'
    anki_seeds:
      - front: 'A relation on a set $A$ is...'
        back: 'any subset of $A \times A$ (pairs $(a, b)$ with $a$ related to $b$).'
        type: basic
      - front: 'Number of relations on an $n$-element set?'
        back: '$2^{n^2}$ — subsets of the $n^2$ pairs in $A \times A$.'
        type: basic

  - id: relations-properties
    name: "Relations and Their Properties"
    core: true
    difficulty: 0.55
    drill: false
    answer_kind: proof
    expected_time_secs: 190
    prerequisites:
      - id: cartesian-products
        weight: 0.5
        key: true
      - id: relations-digraphs-matrices
        weight: 0.4
        key: true
      - id: set-notation
        weight: 0.3
      - id: quantifiers
        weight: 0.3
      - id: propositional-logic
        weight: 0.0
    knowledge_points:
      - id: kp1
        name: "Relations and the four properties"
        key_prerequisites: [cartesian-products]
        exemplars:
          - problem: "On the set {1, 2, 3}, let R = {(1,1), (2,2), (3,3), (1,2), (2,1)}. A relation on a set can be reflexive, symmetric, or transitive. How many of these three properties does R have?"
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Start from the full object: on {1, 2, 3}, R = {(1,1), (2,2), (3,3), (1,2), (2,1)}. Reflexivity rule: the pair (a,a) must be in R for every element a, and (1,1), (2,2), (3,3) are all in R. Symmetry rule: every pair in R must have its reverse in R, and (1,2) pairs with (2,1). Transitivity rule: every chain of two pairs must close, and (1,2) with (2,1) forces (1,1) while (2,1) with (1,2) forces (2,2), both present. All three rules hold for R, so the count of properties is three. The answer is 3."
          - problem: "On the set {1, 2, 3}, let R = {(1,2), (2,3)}. The relation R is not transitive, because a chain of two pairs of R forces a pair that is missing. Give the one ordered pair that must be added to R to make R transitive, as (a, b)."
            answer: "(1, 3)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "Start from the full object: on {1, 2, 3}, R = {(1,2), (2,3)}. Transitivity rule: whenever (a,b) and (b,c) are in R, the pair (a,c) must also be in R. Apply the rule: the chain (1,2) with (2,3) forces (1,3), and (1,3) is not in R. This is the only chain of two pairs in R, so one added pair closes it. The answer is (1, 3)."
          - problem: "On the set {1, 2, 3, 4}, let R = {(1,1), (2,2), (1,3), (3,1), (3,4)}. A relation is symmetric when whenever (a,b) is in R, the reverse (b,a) is also in R. How many ordered pairs must be added to R so that R becomes symmetric?"
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Start from the full object: on {1, 2, 3, 4}, R = {(1,1), (2,2), (1,3), (3,1), (3,4)}. Symmetry rule: each pair (a,b) in R needs its reverse (b,a) in R. Check the pairs: (1,3) has reverse (3,1) in R, (3,1) has reverse (1,3) in R, and the diagonal pairs are their own reverses. The pair (3,4) has no reverse (4,3) in R, so adding (4,3) is the only addition needed. The answer is 1."
          - problem: "On the set {1, 2, 3, 4}, let R = {(1,1), (3,3), (1,2), (2,1)}. A relation is reflexive when the pair (a,a) is in R for every element a of the set. How many of the four diagonal pairs (1,1), (2,2), (3,3), (4,4) are not in R?"
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Start from the full object: on {1, 2, 3, 4}, R = {(1,1), (3,3), (1,2), (2,1)}. Reflexivity rule: the diagonal pair (a,a) must be in R for every element a of {1, 2, 3, 4}. Check the four diagonals: (1,1) is in R and (3,3) is in R, but (2,2) is not in R and (4,4) is not in R. Exactly two diagonal pairs are missing. The answer is 2."
          - problem: "On the set {1, 2, 3, 4}, let R = {(1,2), (2,3), (3,4)}. A relation is transitive when whenever (a,b) and (b,c) are in R, the pair (a,c) is also in R. How many ordered pairs must be added to R to make R transitive?"
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Start from the full object: on {1, 2, 3, 4}, R = {(1,2), (2,3), (3,4)}. Transitivity rule: whenever (a,b) and (b,c) are in R, the pair (a,c) must be in R. First chain: (1,2) with (2,3) forces (1,3). Second chain: (2,3) with (3,4) forces (2,4). Third chain: (1,3) with (3,4) then forces (1,4). The forced pairs (1,3), (2,4) and (1,4) are missing, and adding them closes every chain. The answer is 3."
          - problem: "On the set {1, 2, 3, 4}, let R = {(2,2), (4,4), (1,3), (3,1), (4,2)}. A relation is reflexive when the pair (a,a) is in R for every element a of the set. How many elements a of the set have their diagonal pair (a,a) in R?"
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Start from the full object: on {1, 2, 3, 4}, R = {(2,2), (4,4), (1,3), (3,1), (4,2)}. Reflexivity rule: the pair (a,a) must be in R for every element a of {1, 2, 3, 4}. Check each element: (2,2) is in R and (4,4) is in R, but (1,1) is not in R and (3,3) is not in R. Exactly two elements have their diagonal pair present, so R is not reflexive. The answer is 2."
          - problem: "Write the full proof: on the set {1, 2, 3}, the relation R = {(1,1), (2,2), (3,3), (1,2), (2,1), (2,3), (3,2)} is reflexive and symmetric but not transitive. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1 (reflexive): the set is {1, 2, 3}, and the diagonal pairs (1,1), (2,2), (3,3) are all in R, so a R a holds for every element a. Step 2 (symmetric): every pair of distinct elements has its reverse in R, since (1,2) pairs with (2,1) and (2,3) pairs with (3,2), so a R b implies b R a for all elements a and b. Step 3 (not transitive): the chain (1,2) with (2,3) lies in R, so the transitivity rule forces (1,3) to be in R, but (1,3) is not in R; the chain (3,2) with (2,1) gives a second failure, since it forces (3,1), which is also missing. Conclusion: R is reflexive and symmetric but not transitive, which completes the proof."
        constraints: "check reflexive/symmetric/transitive on a listed relation over a small set"
      - id: kp2
        name: "Antisymmetry"
        key_prerequisites: [set-notation]
        exemplars:
          - problem: "Let $R = \\{(1,1),(1,2),(1,3),(2,2),(3,3)\\}$ on $A = \\{1,2,3\\}$. Decide whether $R$ is antisymmetric, and count the ordered pairs $(x,y)$ with $x \\ne y$ such that $(x,y)$ and $(y,x)$ are both in $R$. Give verdict and violations."
            answer: "verdict = yes; violations = 0"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["yes"], ["no"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "violations"}]}
            solution_sketch: "Full object: $R = \\{(1,1),(1,2),(1,3),(2,2),(3,3)\\}$ on $A = \\{1,2,3\\}$. Antisymmetry rule: a violation needs $(x,y)$ and $(y,x)$ both in $R$ with $x \\ne y$. Check the off-diagonal pairs: $(1,2)$ would need $(2,1)$, and $(1,3)$ would need $(3,1)$; neither reverse is in $R$. So $R$ is antisymmetric and no pair violates it. Note that $R$ is not symmetric, since $(1,2)$ is in $R$ but $(2,1)$ is not: the two properties are different. The answer is verdict = yes; violations = 0."
          - problem: "Let $R = \\{(a,b),(b,a),(b,b),(c,c)\\}$ on $A = \\{a,b,c\\}$. Determine whether $R$ is antisymmetric, and count the ordered pairs $(x,y)$ with $x \\ne y$ whose reverse $(y,x)$ is also in $R$. Give verdict and counter."
            answer: "verdict = no; counter = 2"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["yes"], ["no"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "counter"}]}
            solution_sketch: "Full object: $R = \\{(a,b),(b,a),(b,b),(c,c)\\}$ on $A = \\{a,b,c\\}$. Antisymmetry rule: a pair and its reverse in $R$ with different entries is a violation. The pair $(a,b)$ and its reverse $(b,a)$ are both in $R$ and $a \\ne b$, so $R$ is not antisymmetric. The violating ordered pairs are $(a,b)$ and $(b,a)$, so the count is $2$. The diagonal pairs $(b,b)$ and $(c,c)$ never matter, which is why a relation like equality can be antisymmetric trivially. The answer is verdict = no; counter = 2."
          - problem: "A relation $R$ on the set $\\{1,2\\}$ is both symmetric and antisymmetric. Find the largest possible number of ordered pairs in $R$."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Full object: a relation $R$ on $\\{1,2\\}$ with both properties. Symmetry forces the reverse of every pair into $R$; antisymmetry forbids a pair and its reverse with unequal entries. Any off-diagonal pair $(x,y)$ with $x \\ne y$ would have its reverse forced by symmetry and forbidden by antisymmetry at once, so only diagonal pairs survive. The largest such $R$ is $\\{(1,1),(2,2)\\}$, which has $2$ ordered pairs. The answer is 2."
          - problem: "A student claims that $R = \\{(2,3),(3,2),(1,1),(1,4),(4,4)\\}$ on $\\{1,2,3,4\\}$ is antisymmetric and checks only the pairs $(1,1)$ and $(4,4)$. Give the smallest $x$ such that some $y$ with $x \\ne y$ has both $(x,y)$ and $(y,x)$ in $R$."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Full object: $R = \\{(2,3),(3,2),(1,1),(1,4),(4,4)\\}$ on $\\{1,2,3,4\\}$. A violation of antisymmetry is an ordered pair $(x,y)$ with $x \\ne y$ whose reverse $(y,x)$ is also in $R$. The diagonal pairs $(1,1)$ and $(4,4)$ that the student checked never matter for antisymmetry. For $x = 1$ the pairs are $(1,1)$ and $(1,4)$, and $(4,1)$ is not in $R$. The pair $(2,3)$ has its reverse $(3,2)$ in $R$, so the smallest such $x$ is $2$. The answer is 2."
          - problem: "Let $R = \\{(1,2),(2,1),(1,3),(3,1),(2,3),(3,2)\\}$ be a relation on $A = \\{1,2,3\\}$. Find the smallest number of ordered pairs that must be removed from $R$ so that the remaining relation is antisymmetric."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Full object: $R = \\{(1,2),(2,1),(1,3),(3,1),(2,3),(3,2)\\}$ on $A = \\{1,2,3\\}$. Step 1, the definition of antisymmetry: a violation is a pair $(x,y)$ with $x \\ne y$ whose reverse $(y,x)$ is also in $R$. Step 2, count the conflicts: the unordered pairs $\\{1,2\\}$, $\\{1,3\\}$ and $\\{2,3\\}$ each bring two opposite ordered pairs into $R$, so there are three conflicts. Step 3, minimum removals: one removed ordered pair repairs only one conflict, so at least three removals are needed, and deleting $(2,1)$, $(3,1)$ and $(3,2)$ leaves $\\{(1,2),(1,3),(2,3)\\}$, which is antisymmetric. The answer is 3."
          - problem: "A relation $R$ on a set $A$ is both antisymmetric and symmetric. To prove that $R$ is contained in the diagonal relation $\\{(a,a) : a \\in A\\}$, the argument takes $(a,b) \\in R$, derives $(b,a) \\in R$ by symmetry in line 1, applies one property in line 2, and concludes $(a,b) = (a,a)$ in line 3. Select the line that completes the argument."
            answer: "by antisymmetry, a = b"
            answer_contract: {"kind": "label", "options": [["by antisymmetry, a = b"], ["by antisymmetry, (a,b) = (b,a)"], ["by symmetry, a = b"], ["by antisymmetry, a != b"]]}
            solution_sketch: "Given $(a,b) \\in R$, line 1 uses symmetry to get $(b,a) \\in R$. Line 2 must apply antisymmetry to the two pairs $(a,b)$ and $(b,a)$: the definition then forces $a = b$, and line 3 turns this into $(a,b) = (a,a)$, so $R$ lies in the diagonal. The option 'by antisymmetry, (a,b) = (b,a)' confuses the condition $a = b$ with equality of ordered pairs. The option 'by symmetry, a = b' cites the wrong property, since symmetry gives no equality. The option 'by antisymmetry, a != b' flips the condition. The missing line is: by antisymmetry, a = b."
          - problem: "Write the full proof: a relation on a set that is both antisymmetric and symmetric is contained in the diagonal relation. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Let $R$ be antisymmetric and symmetric on a set $A$, and take any $(a,b) \\in R$. Step 1 (symmetry): because $R$ is symmetric, the reverse $(b,a)$ is also in $R$. Step 2 (antisymmetry): the pair $(a,b)$ and its reverse $(b,a)$ are both in $R$, so the definition of antisymmetry forces $a = b$. Step 3 (conclusion): $(a,b) = (a,a)$, so every element of $R$ has equal entries and $R \\subseteq \\{(a,a) : a \\in A\\}$. Note where each property is used: symmetry supplies the reverse pair, and antisymmetry turns the two-way membership into equality; neither property alone suffices, which is exactly how antisymmetry differs from symmetry."
        constraints: "distinguish antisymmetry from symmetry"
      - id: kp3
        name: "Proving a property holds"
        key_prerequisites: [quantifiers]
        exemplars:
          - problem: "To prove that the relation ~ on R, defined by a ~ b exactly when a - b is an integer, is transitive, assume a ~ b and b ~ c with a - b = 2 and b - c = -5. The proof writes a - c = (a - b) + (b - c). Compute a - c."
            answer: "-3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (definition of transitivity): assume a ~ b and b ~ c. Step 2 (hypothesis): a - b = 2 and b - c = -5, both integers. Step 3 (rearrangement): a - c = (a - b) + (b - c) = 2 + (-5) = -3. Since -3 is an integer, a ~ c, which completes the transitivity argument. The answer is -3."
          - problem: "To prove that the relation ~ on Z, defined by a ~ b exactly when a + b is even, is symmetric, assume a ~ b with a = 7 and b = 3, so a + b is even. The proof writes b + a and then concludes b ~ a. Give b + a."
            answer: "10"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (definition of symmetry): assume a ~ b, so a + b is even. Step 2 (commutative law of addition): b + a = a + b = 7 + 3 = 10. Step 3 (definition of ~ again): b + a = 10 is even, so b ~ a, which proves symmetry. The answer is 10."
          - problem: "A student claims that the relation ~ on Z, defined by a ~ b exactly when a·b is at least 0, is transitive. Take the triple a = 1, b = 0, c = -1, for which a ~ b and b ~ c both hold. Give a·c."
            answer: "-1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (check a ~ b): a·b = 1·0 = 0, which is at least 0, so a ~ b. Step 2 (check b ~ c): b·c = 0·(-1) = 0, which is at least 0, so b ~ c. Step 3 (what transitivity would need): a·c = 1·(-1) = -1, which is not at least 0, so a is not related to c and transitivity fails. The answer is -1."
          - problem: "To prove that the relation ~ on Z, defined by a ~ b exactly when a - b is even, is symmetric, assume a ~ b with a - b = -6. The key step rewrites the hypothesis as b - a = -(a - b). Compute b - a."
            answer: "6"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (definition of symmetry): assume a ~ b, so a - b = -6 is even. Step 2 (negation of an even integer): b - a = -(a - b) = -(-6) = 6, which is even. Step 3 (definition of ~ again): since b - a is even, b ~ a, so ~ is symmetric. The answer is 6."
          - problem: "Claim: the relation ~ on R, defined by a ~ b exactly when a - b is an integer, is symmetric. Step 1: assume a ~ b, so a - b is an integer. Step 2: b - a = a - b. Step 3: b - a is an integer. Step 4: b ~ a, so ~ is symmetric. Which step is the first step that is not valid?"
            answer: "Step 2"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "Step 1 is the hypothesis and is correct. Step 2 is false: b - a = -(a - b), and the two sides agree only when a = b; the error is a dropped sign flip. Step 3 would follow from the correct identity b - a = -(a - b), since the integers are closed under negation. Step 4 is valid once Step 3 holds. The answer is Step 2."
          - problem: "In the proof that the relation ~ on Z, defined by a ~ b exactly when a + b is even, is transitive, assume a ~ b and b ~ c, so a + b and b + c are even. The line a + c = ? is missing. Select the line that is true and that uses the hypothesis."
            answer: "(a+b)+(b+c)-2b"
            answer_contract: {"kind": "label", "options": [["(a+b)+(b+c)-2b"], ["(a+b)+(b+c)"], ["(a+b)-(b+c)"], ["(a+b)+(b+c)+2b"]]}
            solution_sketch: "From the hypotheses, a + b and b + c are even. The identity a + c = (a + b) + (b + c) - 2b holds because the middle terms 2b cancel, and it exhibits a + c as a sum of even quantities. Option (a+b)+(b+c) forgets to subtract 2b, a missing cancellation. Option (a+b)-(b+c) gives a - c, a sign error. Option (a+b)+(b+c)+2b adds 2b twice instead of canceling it. The answer is (a+b)+(b+c)-2b."
          - problem: "Write the full proof: the relation ~ on R, defined by a ~ b exactly when a - b is an integer, is transitive. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Setup: let a, b, c be arbitrary real numbers with a ~ b and b ~ c. Step 1 (hypothesis, definition of ~): a - b is an integer and b - c is an integer. Step 2 (closure of the integers under addition): write a - c = (a - b) + (b - c); a sum of two integers is an integer, so a - c is an integer. Step 3 (definition of ~ again): since a - c is an integer, a ~ c. Step 4 (universal generalization): a, b, c were arbitrary, so ~ is transitive. QED."
        constraints: "prove a named property from its definition"
    diagnostic_exemplar:
      problem: 'Show that the relation "$a \mid b$" on $\mathbb{Z}^{+}$ is reflexive, antisymmetric and transitive, but not symmetric.'
      answer: 'Reflexive: $a = a \cdot 1$, so $a \mid a$. Antisymmetric: if $a \mid b$ and $b \mid a$ with $a, b > 0$, write $b = ak$ and $a = bm$; then $a = akm$, so $km = 1$ with $k, m$ positive integers, forcing $k = m = 1$ and $a = b$. Transitive: $b = ak$ and $c = bm$ give $c = a(km)$, so $a \mid c$. Not symmetric: $2 \mid 4$ but $4 \nmid 2$.'
      solution_sketch: 'Verify each property from the definition $a \mid b \iff b = ak$; positivity is what makes antisymmetry work, and one counterexample refutes symmetry.'
    anki_seeds:
      - front: 'When is a relation $R$ on $A$ reflexive?'
        back: '$\forall a,\ aRa$.'
        type: basic
      - front: 'When is a relation $R$ symmetric?'
        back: '$aRb \Rightarrow bRa$.'
        type: basic
      - front: 'When is a relation $R$ transitive?'
        back: '$aRb \land bRc \Rightarrow aRc$.'
        type: basic
      - front: 'When is a relation $R$ antisymmetric?'
        back: '$aRb \land bRa \Rightarrow a = b$.'
        type: basic

  - id: verifying-equivalence-properties
    name: "Verifying the Three Properties"
    core: true
    difficulty: 0.56
    drill: false
    answer_kind: numeric
    expected_time_secs: 150
    prerequisites:
      - id: relations-properties
        weight: 0.6
        key: true
    knowledge_points:
      - id: kp1
        name: "Checks on listed relations"
        key_prerequisites: [relations-properties]
        exemplars:
          - problem: "On {1, 2, 3}, let R = {(1,1),(2,2),(3,3),(1,3),(3,1)}. How many of the three properties reflexive, symmetric, and transitive does R have? Give the number."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The relation is R = {(1,1),(2,2),(3,3),(1,3),(3,1)}. Reflexive check: all three loops (1,1), (2,2), (3,3) are present, so reflexivity holds. Symmetric check: the non-loop pairs (1,3) and (3,1) each have their reverse in R, so symmetry holds. Transitive check: the chains (1,3),(3,1) give (1,1), and (3,1),(1,3) give (3,3), both present, so transitivity holds. The answer is 3."
          - problem: "On {1, 2, 3}, let R = {(1,1),(2,2),(1,2),(2,1),(2,3)}. Find how many of the three properties reflexive, symmetric, and transitive R has. Give the number."
            answer: "0"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The relation is R = {(1,1),(2,2),(1,2),(2,1),(2,3)}. Reflexive check: (3,3) is missing, so reflexivity fails. Symmetric check: (2,3) is in R but (3,2) is not, so symmetry fails. Transitive check: (1,2) and (2,3) are in R but (1,3) is not, so transitivity fails. The answer is 0."
          - problem: "On {1, 2, 3}, let R = {(1,1),(2,2),(3,3),(1,2),(2,1),(2,3),(3,2)}. Determine how many of the three properties hold for R. Give the number."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The relation is R = {(1,1),(2,2),(3,3),(1,2),(2,1),(2,3),(3,2)}. Reflexive check: all three loops are present, so reflexivity holds. Symmetric check: every non-loop pair (1,2), (2,1), (2,3), (3,2) has its reverse in R, so symmetry holds. Transitive check: (1,2) and (2,3) are in R but (1,3) is missing, so transitivity fails. The answer is 2."
          - problem: "On {1, 2, 3}, let R = {(1,2),(2,1)}. Evaluate how many of the three properties reflexive, symmetric, and transitive R satisfies. Give the number."
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The relation is R = {(1,2),(2,1)}. Reflexive check: none of the loops (1,1), (2,2), (3,3) are in R, so reflexivity fails. Symmetric check: the pairs (1,2) and (2,1) each have their reverse in R, so symmetry holds. Transitive check: (1,2) and (2,1) are in R but (1,1) is missing, so transitivity fails. The answer is 1."
          - problem: "On {1, 2, 3}, let R = {(1,1),(2,2),(3,3),(1,2),(2,1),(1,3),(3,1),(2,3),(3,2)}. Determine the number of properties among reflexive, symmetric, and transitive that R has. Give the number."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The relation is R = {(1,1),(2,2),(3,3),(1,2),(2,1),(1,3),(3,1),(2,3),(3,2)}. Reflexive check: all three loops are present, so reflexivity holds. Symmetric check: every ordered pair in R has its reverse in R, so symmetry holds. Transitive check: every chain of two pairs in R produces a pair that is also in R, so transitivity holds. The answer is 3."
          - problem: "On {1, 2, 3}, let R = {(1,1),(2,2),(3,3),(1,2)}. Find the number of properties among reflexive, symmetric, and transitive that R satisfies. Give the number."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The relation is R = {(1,1),(2,2),(3,3),(1,2)}. Reflexive check: all three loops are present, so reflexivity holds. Symmetric check: (1,2) is in R but (2,1) is not, so symmetry fails. Transitive check: the only non-loop pair (1,2) combines with loops to give (1,2), which is present, so transitivity holds. The answer is 2."
        constraints: "systematic three-property checks on relations listed over a 3-element set"
      - id: kp2
        name: "Rule-defined relations with a failing property"
        key_prerequisites: [relations-properties]
        exemplars:
          - problem: "On the integers define a ~ b exactly when |a - b| <= 1. Number the properties 1 = reflexive, 2 = symmetric, 3 = transitive. The relation fails exactly one of the three properties. Give the number p of the failing property and a counterexample triple (a, b, c) with 0 <= a < b < c <= 2, written as p = ...; a = ...; b = ...; c = ...."
            answer: "p = 3; a = 0; b = 1; c = 2"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "p"}, {"contract": {"kind": "exact"}, "name": "a"}, {"contract": {"kind": "exact"}, "name": "b"}, {"contract": {"kind": "exact"}, "name": "c"}]}
            solution_sketch: "Reflexivity step: |x - x| = 0 <= 1 for every integer, so property 1 holds. Symmetry step: |a - b| = |b - a|, so property 2 holds. Transitivity step: 0 ~ 1 and 1 ~ 2 since each gap is 1, but |0 - 2| = 2 > 1, so 0 is not related to 2 and property 3 fails. Within 0 <= a < b < c <= 2 the only counterexample triple is (0, 1, 2). The answer is p = 3; a = 0; b = 1; c = 2."
          - problem: "On the integers define a ~ b exactly when ab >= 0. Number the properties 1 = reflexive, 2 = symmetric, 3 = transitive. The relation fails exactly one of the three properties. Give the number p of the failing property and a counterexample triple (a, b, c) with -1 <= a <= b <= c <= 1, written as p = ...; a = ...; b = ...; c = ...."
            answer: "p = 3; a = -1; b = 0; c = 1"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "p"}, {"contract": {"kind": "exact"}, "name": "a"}, {"contract": {"kind": "exact"}, "name": "b"}, {"contract": {"kind": "exact"}, "name": "c"}]}
            solution_sketch: "Reflexivity step: a * a = a^2 >= 0 for every integer, so property 1 holds. Symmetry step: ab = ba, so property 2 holds. Transitivity step: -1 ~ 0 and 0 ~ 1 because both products are 0, but (-1) * 1 = -1 < 0, so -1 is not related to 1 and property 3 fails. Among triples with -1 <= a <= b <= c <= 1 the only transitivity counterexample is (-1, 0, 1). The answer is p = 3; a = -1; b = 0; c = 1."
          - problem: "On the integers define a ~ b exactly when a <= b. Number the properties 1 = reflexive, 2 = symmetric, 3 = transitive. The relation fails exactly one of the three properties. Give the number p of the failing property and a counterexample triple (a, b, a) with 0 <= a < b <= 1, written as p = ...; a = ...; b = ...; c = ...."
            answer: "p = 2; a = 0; b = 1; c = 0"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "p"}, {"contract": {"kind": "exact"}, "name": "a"}, {"contract": {"kind": "exact"}, "name": "b"}, {"contract": {"kind": "exact"}, "name": "c"}]}
            solution_sketch: "Reflexivity step: a <= a holds, so property 1 holds. Transitivity step: a <= b and b <= c give a <= c, so property 3 holds. Symmetry step: with a = 0 and b = 1 we have 0 ~ 1 since 0 <= 1, but 1 ~ 0 is false since 1 <= 0 fails, so property 2 fails. With 0 <= a < b <= 1 the only symmetry counterexample is (0, 1, 0). The answer is p = 2; a = 0; b = 1; c = 0."
          - problem: "On the positive integers define a ~ b exactly when a divides b. Number the properties 1 = reflexive, 2 = symmetric, 3 = transitive. The relation fails exactly one of the three properties. Give the number p of the failing property and a counterexample triple (a, b, a) with 2 <= a < b <= 4, written as p = ...; a = ...; b = ...; c = ...."
            answer: "p = 2; a = 2; b = 4; c = 2"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "p"}, {"contract": {"kind": "exact"}, "name": "a"}, {"contract": {"kind": "exact"}, "name": "b"}, {"contract": {"kind": "exact"}, "name": "c"}]}
            solution_sketch: "Reflexivity step: every positive integer divides itself, so property 1 holds. Transitivity step: if a divides b and b divides c, then a divides c, so property 3 holds. Symmetry step: 2 divides 4 but 4 does not divide 2, so 2 ~ 4 while 4 ~ 2 is false and property 2 fails. In the range 2 <= a < b <= 4 the pairs (2, 3) and (3, 4) are not related pairs, so (2, 4, 2) is the only counterexample. The answer is p = 2; a = 2; b = 4; c = 2."
          - problem: "On the integers define a ~ b exactly when |a| <= |b|. Number the properties 1 = reflexive, 2 = symmetric, 3 = transitive. The relation fails exactly one of the three properties. Give the number p of the failing property and a counterexample triple (a, b, a) with 1 <= a < b <= 2, written as p = ...; a = ...; b = ...; c = ...."
            answer: "p = 2; a = 1; b = 2; c = 1"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "p"}, {"contract": {"kind": "exact"}, "name": "a"}, {"contract": {"kind": "exact"}, "name": "b"}, {"contract": {"kind": "exact"}, "name": "c"}]}
            solution_sketch: "Reflexivity step: |a| <= |a| holds, so property 1 holds. Transitivity step: |a| <= |b| and |b| <= |c| give |a| <= |c|, so property 3 holds. Symmetry step: |1| <= |2| holds but |2| <= |1| is false, so 1 ~ 2 while 2 ~ 1 is false and property 2 fails. In the range 1 <= a < b <= 2 the only pair is (1, 2), giving the counterexample (1, 2, 1). The answer is p = 2; a = 1; b = 2; c = 1."
          - problem: "On the integers define a ~ b exactly when ab > 0. Number the properties 1 = reflexive, 2 = symmetric, 3 = transitive. The relation fails exactly one of the three properties. Give the number p of the failing property and a counterexample triple (a, b, c) with a = b = c and 0 <= a <= 1, written as p = ...; a = ...; b = ...; c = ...."
            answer: "p = 1; a = 0; b = 0; c = 0"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "p"}, {"contract": {"kind": "exact"}, "name": "a"}, {"contract": {"kind": "exact"}, "name": "b"}, {"contract": {"kind": "exact"}, "name": "c"}]}
            solution_sketch: "Symmetry step: if ab > 0 then ba > 0, so property 2 holds. Transitivity step: ab > 0 and bc > 0 force b to be nonzero and a, c to share the sign of b, so ac > 0 and property 3 holds. Reflexivity step: with a = 0 the product 0 * 0 = 0 is not > 0, so 0 ~ 0 is false and property 1 fails. With a = b = c and 0 <= a <= 1 the value a = 1 is related to itself, so the only counterexample is (0, 0, 0). The answer is p = 1; a = 0; b = 0; c = 0."
        constraints: "identify the failing property and give a concrete counterexample triple"
      - id: kp3
        name: "Full verdicts"
        key_prerequisites: [relations-properties]
        exemplars:
          - problem: "On the set of all integers, define $a \\sim b$ to mean that $a - b$ is a multiple of $5$. Test the reflexive, symmetric and transitive properties, giving a reason for each, then determine whether this relation is an equivalence relation, and give the number of equivalence classes it has."
            answer: "verdict = yes; classes = 5"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["yes"], ["no"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "classes"}]}
            solution_sketch: "Work with the relation on the integers defined by $a - b$ being a multiple of $5$; the method of this KP, testing each property and then issuing the verdict, is applied in the three tests below. Reflexivity test: $a - a = 0$ is a multiple of $5$, so the reflexive property holds. Symmetry test: if $a - b$ is a multiple of $5$ then $b - a = -(a-b)$ is too, so the symmetric property holds. Transitivity test: the sum of two multiples of $5$ is a multiple of $5$, so $a - c$ is a multiple of $5$ whenever $a - b$ and $b - c$ are, and the transitive property holds. The wrong verdict no would come from doubting that $0$ counts as a multiple of $5$. Counting the residue classes $0, 1, 2, 3, 4$ modulo $5$ gives $5$ classes. The result is verdict = yes; classes = 5."
          - problem: "On the set of all integers, define $a \\sim b$ to mean $a < b$. Test the reflexive, symmetric and transitive properties, giving a reason for each, then determine whether this relation is an equivalence relation, and give the number of the three properties that fail."
            answer: "verdict = no; fails = 2"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["yes"], ["no"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "fails"}]}
            solution_sketch: "Work with the relation $a \\sim b$ meaning $a < b$ on the integers; the method of this KP, testing each property and then issuing the verdict, is applied in the three tests below. Reflexivity test: $a < a$ is false for every integer $a$, so the reflexive property fails. Symmetry test: $2 < 5$ holds while $5 < 2$ does not, so the symmetric property fails. Transitivity test: $a < b$ and $b < c$ always imply $a < c$, so the transitive property holds. The wrong verdict yes comes from overlooking that no integer is less than itself. Counting the failed properties gives reflexivity and symmetry, that is $2$ failures. The result is verdict = no; fails = 2."
          - problem: "On the set $\\{1, 2, 3, 4\\}$, define $a \\sim b$ to mean that $a$ divides $b$. Test the reflexive, symmetric and transitive properties, giving a reason for each, then determine whether this relation is an equivalence relation, and give the number of pairs $(a, b)$ from the set with $a \\sim b$ but not $b \\sim a$."
            answer: "verdict = no; asym = 4"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["yes"], ["no"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "asym"}]}
            solution_sketch: "Work with the divides relation on the set $\\{1, 2, 3, 4\\}$; the method of this KP, testing each property and then issuing the verdict, is applied in the three tests below. Reflexivity test: each of $1, 2, 3, 4$ divides itself, so the reflexive property holds. Symmetry test: $2$ divides $4$ but $4$ does not divide $2$, so the symmetric property fails. Transitivity test: if $a$ divides $b$ and $b$ divides $c$ then $a$ divides $c$, so the transitive property holds. The wrong verdict yes treats divisibility as if it were mutual. Counting the one-way pairs gives $(1,2)$, $(1,3)$, $(1,4)$ and $(2,4)$, that is $4$ pairs. The result is verdict = no; asym = 4."
          - problem: "On the set of all integers, define $a \\sim b$ to mean that $a + b$ is odd. Test the reflexive, symmetric and transitive properties, giving a reason for each, then determine whether this relation is an equivalence relation, and give the number of elements of $\\{0, 1, 2\\}$ that are related to themselves."
            answer: "verdict = no; self = 0"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["yes"], ["no"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "self"}]}
            solution_sketch: "Work with the relation $a \\sim b$ meaning $a + b$ is odd on the integers; the method of this KP, testing each property and then issuing the verdict, is applied in the three tests below. Reflexivity test: $a + a = 2a$ is even for every integer, so the reflexive property fails. Symmetry test: $a + b = b + a$, so an odd sum stays odd when the pair is reversed, and the symmetric property holds. Transitivity test: $0 + 1$ and $1 + 2$ are odd but $0 + 2 = 2$ is even, so the transitive property fails. The wrong verdict yes forgets that doubling an integer never gives an odd number. No element of $\\{0, 1, 2\\}$ is related to itself, so the count of self-related elements is $0$. The result is verdict = no; self = 0."
          - problem: "A relation $R$ on the set $\\{1, 2, 3, 4\\}$ consists of the pairs $(1,1)$, $(2,2)$, $(3,3)$, $(4,4)$, $(1,2)$, $(1,3)$, $(1,4)$, $(2,3)$ and $(3,4)$. Test the reflexive, symmetric and transitive properties of $R$, giving a reason for each, then give the number of the first property that fails, using $1$ = reflexive, $2$ = symmetric, $3$ = transitive and $0$ = no failure, and give the number of listed pairs whose reverse is not listed."
            answer: "first = 2; missing = 5"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "first"}, {"contract": {"kind": "exact"}, "name": "missing"}]}
            solution_sketch: "Work with the relation $R$ made of the pairs $(1,1)$, $(2,2)$, $(3,3)$, $(4,4)$, $(1,2)$, $(1,3)$, $(1,4)$, $(2,3)$ and $(3,4)$ on $\\{1, 2, 3, 4\\}$; the method of this KP, testing each property in order, is applied in the three tests below. Reflexivity test: all four self-pairs are present, so the reflexive property holds. Symmetry test: $(1,2)$ is present but $(2,1)$ is not, so the symmetric property fails. Transitivity test: $(2,3)$ and $(3,4)$ are present but $(2,4)$ is not, so the transitive property fails. The first failing property is the symmetric one, coded $2$, and the pairs without a listed reverse are $(1,2)$, $(1,3)$, $(1,4)$, $(2,3)$ and $(3,4)$, that is $5$ pairs. The result is first = 2; missing = 5."
          - problem: "A relation $R$ on the set $\\{1, 2, 3\\}$ consists of all nine pairs $(a, b)$ with $a$ and $b$ in the set. Test the reflexive, symmetric and transitive properties of $R$, giving a reason for each, then give the number of the three properties that hold and the total number of pairs in $R$."
            answer: "holds = 3; pairs = 9"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "holds"}, {"contract": {"kind": "exact"}, "name": "pairs"}]}
            solution_sketch: "Work with the universal relation $R$ containing all nine pairs on the set $\\{1, 2, 3\\}$; the method of this KP, testing each property in order, is applied in the three tests below. Reflexivity test: $(1,1)$, $(2,2)$ and $(3,3)$ are all in $R$, so the reflexive property holds. Symmetry test: whenever $(a,b)$ is in $R$ so is $(b,a)$, since every pair is in $R$, so the symmetric property holds. Transitivity test: $(a,b)$ and $(b,c)$ in $R$ force $(a,c)$ in $R$, since every pair is in $R$, so the transitive property holds. All three properties hold, so the count of holding properties is $3$, and the relation contains $3 \\times 3 = 9$ pairs in total. The result is holds = 3; pairs = 9."
        constraints: "deliver a verdict with a reason for each property; one positive and one negative case"
    diagnostic_exemplar:
      problem: 'On $\mathbb{Z}$, define $a \sim b \iff 4 \mid (a - b)$. Check each of the three properties and give a verdict.'
      answer_contract: {kind: none}
      answer: 'Reflexive, symmetric, transitive — an equivalence relation.'
      solution_sketch: '$4 \mid 0$; $4 \mid (a-b) \Rightarrow 4 \mid (b-a)$; and $4 \mid (a-b), 4 \mid (b-c) \Rightarrow 4 \mid (a-c)$ by adding.'
    anki_seeds:
      - front: 'To show a relation is NOT an equivalence relation...'
        back: 'exhibit one property that fails, with a concrete counterexample.'
        type: basic
      - front: 'Reflexivity fails for $R$ on $A$ when...'
        back: 'some $a \in A$ has $(a, a) \notin R$.'
        type: basic

  - id: relations-equivalence
    name: "Equivalence Relations"
    core: true
    difficulty: 0.60
    drill: false
    answer_kind: proof
    expected_time_secs: 210
    prerequisites:
      - id: relations-properties
        weight: 0.6
        key: true
      - id: verifying-equivalence-properties
        weight: 0.5
        key: true
      - id: cartesian-products
        weight: 0.2
      - id: quantifiers
        weight: 0.0
    knowledge_points:
      - id: kp1
        name: "Definition and quick checks"
        key_prerequisites: [relations-properties]
        exemplars:
          - problem: "A relation on a set with 5 elements is reflexive only if it contains every pair (a, a). How many ordered pairs must such a relation contain at least?"
            answer: "5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (definition of reflexive): a relation R on a set S is reflexive when (a, a) in R for every a in S. Step 2 (count): S has 5 elements, so the diagonal pairs (a, a) are one for each element. Step 3 (conclude): there are 5 such pairs, so a reflexive relation contains at least 5 ordered pairs. The answer is 5."
          - problem: "On the set {1, 2, 3} consider the relation a ~ b exactly when a <= b. Count the ordered pairs (a, b) of this relation for which the reversed pair (b, a) does not appear. How many such pairs are there?"
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (list the relation): the pairs with a <= b in {1, 2, 3} are (1,1), (2,2), (3,3), (1,2), (1,3), (2,3). Step 2 (test symmetry): the reversed pairs of (1,2), (1,3), (2,3) are not in the list, while the diagonal pairs reverse to themselves. Step 3 (count): exactly 3 pairs fail symmetry, confirming that <= is not symmetric. The answer is 3."
          - problem: "A relation R on {1, 2, 3} contains exactly the pairs (1,2) and (2,3). It is not transitive, since 1 relates to 2 and 2 relates to 3 but 1 does not relate to 3. How many ordered pairs must be added to R to make it transitive?"
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (definition of transitive): whenever (a,b) and (b,c) are in R, the pair (a,c) must also be in R. Step 2 (apply): the only chain is 1 to 2 and 2 to 3, forcing (1,3). Step 3 (check): adding (1,3) creates no new chain, since 3 relates to nothing. So exactly 1 pair must be added. The answer is 1."
          - problem: "A relation R on {1, 2, 3, 4} contains exactly the pairs (1,2), (2,3), (3,4), (1,3). It fails to be transitive. Give the first pair (a, b) with a < b that is forced by transitivity but is missing from R, as (a, b)."
            answer: "(1,4)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "Step 1 (scan chains): (1,2) and (2,3) already give (1,3), which is present. Step 2 (continue): (1,3) and (3,4) force (1,4), and (2,3) with (3,4) forces (2,4). Step 3 (find the first missing): among the forced pairs, (1,4) is the smallest with a < b and it is not in R. The answer is (1,4)."
          - problem: "A student claims: every relation that is reflexive and transitive is also symmetric, and hence an equivalence relation. Step 1: let a ~ b. Step 2: by symmetry, b ~ a. Step 3: this holds for all a and b, so the relation is symmetric. Step 4: being also reflexive and transitive, it is an equivalence relation. Which step is the first step that is not valid?"
            answer: "Step 2"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "Step 1 is a legitimate assumption. Step 2 is invalid: it invokes symmetry, which is exactly what is being proved and is not among the hypotheses (only reflexivity and transitivity are given). Step 3 inherits the fault of Step 2, and Step 4 rests on the unproven symmetry claim. The answer is Step 2."
          - problem: "On a set with 4 elements, an equivalence relation has two equivalence classes, each with 2 elements. Every two elements of one class relate to each other in both directions, and nothing else relates. How many ordered pairs does this relation contain?"
            answer: "8"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (per class): a class of size 2 contributes all ordered pairs within it, that is 2 times 2 = 4 pairs. Step 2 (both classes): the second class of size 2 also contributes 4 pairs, and no pair joins the two classes. Step 3 (total): 4 + 4 = 8 ordered pairs. The answer is 8."
          - problem: "Write the full proof: on the integers, define a ~ b exactly when the absolute values of a and b are equal. Prove that ~ is an equivalence relation. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Claim: the relation a ~ b defined by |a| = |b| on the integers is an equivalence relation, so we must confirm all three defining properties. Reflexive: for every integer a we have |a| = |a|, so a ~ a. Symmetric: assume a ~ b, that is |a| = |b|; equality of numbers is symmetric, so |b| = |a|, hence b ~ a. Transitive: assume a ~ b and b ~ c, so |a| = |b| and |b| = |c|; by transitivity of equality, |a| = |c|, hence a ~ c. All three properties hold, therefore ~ is an equivalence relation. (Note the relation is not equality: 2 and -2 are related but are different integers.)"
        constraints: "confirm all three defining properties"
      - id: kp2
        name: "Proving a relation is an equivalence relation"
        key_prerequisites: [relations-properties]
        exemplars:
          - problem: "On R, define $a \\sim b$ exactly when $a - b$ is an integer. To prove reflexivity, you must show that $a \\sim a$ for every real $a$, that is, that $a - a$ is an integer. Give the value of $a - a$."
            answer: "0"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Reflexivity asks whether $a \\sim a$ holds for every real $a$. Compute the defining difference: $a - a = 0$. Since $0$ is an integer, $(a,a)$ lies in the relation and reflexivity holds. The answer is 0."
          - problem: "On R, define $a \\sim b$ exactly when $a - b$ is an integer. To prove symmetry, assume $a \\sim b$, so $a - b = -7$, and show that $b - a$ is also an integer. Give the value of $b - a$."
            answer: "7"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Symmetry requires that $a \\sim b$ implies $b \\sim a$. Assume $a - b = -7$. Negate both sides: $b - a = -(a - b) = 7$, and $7$ is an integer. The answer is 7."
          - problem: "On Z, define $x \\sim y$ exactly when $x - y$ is even. For the transitivity step, assume $x \\sim y$ and $y \\sim z$, say $x - y = 4$ and $y - z = 6$. Give the value of $x - z$, the number that must be even."
            answer: "10"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Transitivity requires: $x \\sim y$ and $y \\sim z$ imply $x \\sim z$. Assume $x - y = 4$ and $y - z = 6$. Add the two equations: $(x - y) + (y - z) = x - z = 10$, which is even. The answer is 10."
          - problem: "On Z, define $a \\sim b$ exactly when $a \\cdot b$ is even. A student claims that $\\sim$ is reflexive, so that $a \\sim a$ for every integer $a$. Give the smallest positive integer $a$ for which $a \\sim a$ fails."
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Reflexivity would need $a \\cdot a$ to be even for every integer $a$. Test $a = 1$: $1 \\cdot 1 = 1$, which is odd, so $a \\sim a$ already fails at $a = 1$. The answer is 1."
          - problem: "On Z, define $x \\sim y$ exactly when $x - y$ is even. In the transitivity step, assume $x - y = 2m$ and $y - z = 2k$ with $m = 3$ and $k = 5$. Give the integer $w$ for which $x - z = 2w$."
            answer: "8"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Transitivity requires the difference $x - z$, so add the two assumed equations: $(x - y) + (y - z) = 2m + 2k$, and the middle terms cancel. Factor $2$: $x - z = 2(m + k)$, whose witness is $w = m + k$. Insert $m = 3$ and $k = 5$: $w = 8$. The answer is 8."
          - problem: "In the proof that the relation $x \\sim y$ on Z, defined by $x - y$ even, is symmetric, one line is missing: assume $x \\sim y$, so $x - y = 2m$ for an integer $m$; then $y - x = \\;?$. Select the line that is true and completes the symmetry argument."
            answer: "-2m"
            answer_contract: {"kind": "label", "options": [["-2m"], ["2m"], ["-m"], ["-2k"]]}
            solution_sketch: "The relation is $x \\sim y$ exactly when $x - y$ is even, and the symmetry step must show $y \\sim x$. From the hypothesis $x - y = 2m$, apply negation: $y - x = -(x - y) = -2m$, which is even because $m$ is an integer, so $y \\sim x$. The option $2m$ is the error of forgetting the negation; the option $-m$ drops the factor $2$; the option $-2k$ names a variable that this step never defines. The answer is -2m."
          - problem: "Write the full proof: on Z, define $x \\sim y$ exactly when $x + y$ is even. Prove that $\\sim$ is an equivalence relation. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Reflexivity: for any integer $x$, $x + x = 2x$ is even, so $x \\sim x$. Symmetry: assume $x \\sim y$, so $x + y$ is even; then $y + x = x + y$ is even by commutativity, so $y \\sim x$. Transitivity: assume $x \\sim y$ and $y \\sim z$, so $x + y = 2m$ and $y + z = 2k$ for integers $m$ and $k$. Then $x + z = (x + y) + (y + z) - 2y = 2m + 2k - 2y = 2(m + k - y)$, which is even since $m + k - y$ is an integer, so $x \\sim z$. Reflexivity, symmetry and transitivity all hold, so $\\sim$ is an equivalence relation on Z."
        constraints: "prove reflexivity, symmetry, transitivity in turn"
      - id: kp3
        name: "Congruence modulo n"
        key_prerequisites: [relations-properties]
        exemplars:
          - problem: "To prove that congruence modulo 5 is transitive, assume 5 divides a - b and 5 divides b - c. Write the derived quantity a - c as (a - b) + q, where q is an expression in b and c. Give q."
            answer: "b-c"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Add the two hypothesis quantities: (a - b) + (b - c). The middle terms b and -b cancel, so the sum telescopes to a - c. Both summands are multiples of 5, so 5 divides a - c. The answer is b-c."
          - problem: "On the set of functions from R to R, define f ~ g exactly when f(1) = g(1). Let f(x) = 2x + 3 and g(x) = x^2 - 4. Compute the value of the derived quantity f(1) - g(1)."
            answer: "8"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Substitute into each function: f(1) = 2 + 3 = 5 and g(1) = 1 - 4 = -3 by arithmetic. The difference is 5 - (-3) = 8. Since the difference is not 0, the equality fact fails and f, g are not related. The answer is 8."
          - problem: "In the proof that congruence modulo 7 is symmetric, one assumes a - b = 7t and must show 7 divides b - a. Write b - a as an integer multiple of a - b and give that multiple."
            answer: "-1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Symmetry needs 7 | (b - a) from the hypothesis 7 | (a - b). Factor: b - a = -(a - b) = -(7t) = 7(-t), so b - a is again a multiple of 7. The integer multiple of a - b is -1."
          - problem: "A student claims that the relation a ~ b on the positive integers, defined by a ~ b exactly when 3 divides a + b, is an equivalence relation, and checks reflexivity only at a = 3. Give the smallest positive integer a for which a ~ a is false."
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Reflexivity demands 3 | (a + a) = 2a. Test a = 1: the value 2 is not a multiple of 3, so a ~ a already fails there. The check at a = 3 covers only a multiple of 3 and proves nothing in general. The smallest such a is 1."
          - problem: "Claim: a ~ b iff 4 | (a - b) is an equivalence relation on Z. Step 1: a - a = 0 and 4 divides 0, so a ~ a. Step 2: if a - b = 4t, then b - a = 4(-t), so a ~ b gives b ~ a. Step 3: if 4 | (a - b) and 4 | (b - c), then 4 | [(a - b) - (b - c)], hence 4 | (a - c) and a ~ c. Step 4: therefore the relation is an equivalence relation. Which step is the first step that is not valid?"
            answer: "Step 3"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "Step 1 is a correct reflexivity argument since 0 is a multiple of 4. Step 2 is valid: negating a multiple of 4 keeps a multiple of 4. Step 3 is the first invalid step: (a - b) - (b - c) equals a - 2b + c, not a - c, so divisibility of that quantity does not give 4 | (a - c); the sum, not the difference, must be used. Step 4 merely states the conclusion and collapses with Step 3. The answer is Step 3."
          - problem: "In the proof that a ~ b iff 6 | (a - b) is transitive, the line that rewrites the derived quantity a - c using the two hypotheses is missing. Select the correct missing line."
            answer: "(a-b)+(b-c)"
            answer_contract: {"kind": "label", "options": [["(a-b)+(b-c)"], ["(a-b)-(b-c)"], ["(a+b)+(b+c)"], ["(a-c)+(b-c)"]]}
            solution_sketch: "The correct line is (a-b)+(b-c): it is the sum of the two hypothesis quantities, telescopes to a - c, and is a multiple of 6. The option (a-b)-(b-c) makes a sign error and gives a - 2b + c. The option (a+b)+(b+c) uses sums in place of differences and gives a + 2b + c. The option (a-c)+(b-c) mixes the endpoint with the middle term and gives a + b - 2c, so it does not combine the hypotheses. The answer is (a-b)+(b-c)."
          - problem: "Write the full proof: the relation a ~ b on Z, defined by a ~ b exactly when 7 | (a - b), is an equivalence relation. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1 (reflexive): for every a, the derived quantity a - a = 0, and 7 divides 0, so a ~ a. Step 2 (symmetric): assume a ~ b, so a - b = 7t for some integer t. Then b - a = -(a - b) = -7t = 7(-t), so 7 | (b - a) and b ~ a. Step 3 (transitive): assume a ~ b and b ~ c, so a - b = 7s and b - c = 7t. Add the two divisibility facts: a - c = (a - b) + (b - c) = 7(s + t), so 7 | (a - c) and a ~ c. Conclusion: the relation is reflexive, symmetric and transitive, hence congruence modulo 7 is an equivalence relation on Z."
        constraints: "use an equality or divisibility fact about a derived quantity"
    diagnostic_exemplar:
      problem: 'On $\mathbb{Z}$, define $a \sim b \iff a^2 = b^2$. Prove $\sim$ is an equivalence relation.'
      answer: 'Reflexive, symmetric, transitive from equality of $a^2$.'
      solution_sketch: 'Reflexive: $a^2 = a^2$. Symmetric: $a^2 = b^2 \Rightarrow b^2 = a^2$. Transitive: $a^2 = b^2$ and $b^2 = c^2 \Rightarrow a^2 = c^2$. So $\sim$ is an equivalence relation (classes $\{a, -a\}$). $\square$'
    anki_seeds:
      - front: 'An equivalence relation is a relation that is...'
        back: 'reflexive, symmetric, and transitive.'
        type: basic
      - front: 'Congruence modulo $n$ as a relation?'
        back: '$a \equiv b \pmod{n}$ iff $n \mid (a - b)$; it is an equivalence relation on $\mathbb{Z}$.'
        type: basic

  - id: computing-equivalence-classes
    name: "Computing Equivalence Classes"
    core: true
    difficulty: 0.60
    drill: false
    answer_kind: numeric
    expected_time_secs: 140
    prerequisites:
      - id: relations-equivalence
        weight: 0.6
        key: true
    knowledge_points:
      - id: kp1
        name: "Classes modulo n"
        key_prerequisites: [relations-equivalence]
        exemplars:
          - problem: "For congruence modulo 4 on the integers, find the smallest nonnegative representative of [-7]."
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The class [-7] contains every integer congruent to -7 modulo 4. Divide -7 by 4: -7 = -2*4 + 1, so the remainder is 1. Therefore the smallest nonnegative representative is 1."
          - problem: "For congruence modulo 5, which of the following integers is in the same class as -3? Select one."
            answer: "2"
            answer_contract: {"kind": "label", "options": [["2"], ["0"], ["4"], ["5"]]}
            solution_sketch: "Compute -3 modulo 5: add 5 to get 2, so the class is [2]. Check option 2: 2 mod 5 is 2, so 2 is in the same class. Option 0 is wrong because 0 mod 5 is 0, not 2. Option 4 is wrong because 4 mod 5 is 4, not 2. Option 5 is wrong because 5 mod 5 is 0, not 2. The correct option is 2."
          - problem: "For congruence modulo 6, find the smallest nonnegative representative of [29]."
            answer: "5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Reduce 29 modulo 6. Since 29 = 4*6 + 5, the remainder is 5. The smallest nonnegative representative of [29] is 5."
          - problem: "For congruence modulo 8 on the integers, determine the number of distinct equivalence classes."
            answer: "8"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The equivalence classes modulo 8 are determined by the remainders after division by 8. The possible remainders are 0 through 7. That gives 8 distinct classes. The number of distinct classes is 8."
          - problem: "For congruence modulo 7, which of the following integers is in the same class as 3? Select one."
            answer: "24"
            answer_contract: {"kind": "label", "options": [["24"], ["22"], ["16"], ["11"]]}
            solution_sketch: "Compute the class of 3 modulo 7: 3 mod 7 is 3, so look for a number congruent to 3. Check 24: 24 = 3*7 + 3, so 24 mod 7 is 3. Option 22 is wrong because 22 mod 7 is 1. Option 16 is wrong because 16 mod 7 is 2. Option 11 is wrong because 11 mod 7 is 4. The correct option is 24."
          - problem: "For congruence modulo 9, find the smallest nonnegative representative of [-25]."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Reduce -25 modulo 9 by adding multiples of 9. Since -25 + 27 = 2, and 27 is a multiple of 9, -25 is congruent to 2 mod 9. The remainder 2 is already between 0 and 8. The smallest nonnegative representative is 2."
        constraints: "residue classes mod $n \\le 10$; representatives and class equality"
      - id: kp2
        name: "Classes on finite sets"
        key_prerequisites: [relations-equivalence]
        exemplars:
          - problem: "On the set {1, 2, 3, 4, 5}, let a ~ b exactly when a and b have the same parity. Give the class of 1 and the class of 2 as sets."
            answer: "class1 = {1, 3, 5}; class2 = {2, 4}"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "set"}, "name": "class1"}, {"contract": {"kind": "set"}, "name": "class2"}]}
            solution_sketch: "Step 1: the relation same parity is reflexive, symmetric and transitive, so its classes partition the set. Step 2: by symmetry 1 relates to 3 and 5, so the class of 1 is class1 = {1, 3, 5}. Step 3: 2 relates to 4, so the class of 2 is class2 = {2, 4}. The full partition is class1 = {1, 3, 5}; class2 = {2, 4}."
          - problem: "On {1, 2, ..., 9}, let a ~ b exactly when a and b leave the same remainder on division by 3. Give the class of 7, the class of 2 and the class of 3 as sets."
            answer: "c7 = {1, 4, 7}; c2 = {2, 5, 8}; c3 = {3, 6, 9}"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "set"}, "name": "c7"}, {"contract": {"kind": "set"}, "name": "c2"}, {"contract": {"kind": "set"}, "name": "c3"}]}
            solution_sketch: "Step 1: compute the remainder of each element mod 3: 1, 4, 7 give 1; 2, 5, 8 give 2; 3, 6, 9 give 0. Step 2: elements with the same remainder are related, so each remainder group is exactly one class. The full partition is c7 = {1, 4, 7}; c2 = {2, 5, 8}; c3 = {3, 6, 9}."
          - problem: "On {1, 2, 3, 4, 5, 6}, define a ~ b when a = b or a + b = 7. How many equivalence classes does this relation have?"
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: reflexivity puts every element in its own class; symmetry joins a and b exactly when a + b = 7. Step 2: so 1 joins 6, 2 joins 5 and 3 joins 4, giving classes {1, 6}, {2, 5}, {3, 4}. Step 3: transitivity adds nothing new since no chain joins two of these pairs. The relation has 3 equivalence classes."
          - problem: "On {1, 2, ..., 8}, let a ~ b exactly when a and b leave the same remainder on division by 4. Find the size of the equivalence class of 5."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: division by 4 leaves remainder 1 for 1 and for 5, and these are the only elements of the set with remainder 1. Step 2: so the class of 5 is {1, 5}; the other elements 2, 6, 3, 7, 4, 8 have remainders 2, 2, 3, 3, 0, 0 and do not join it. The class of 5 has size 2."
          - problem: "The set {3, 6, 9, 12, 15, 18} carries the relation a ~ b exactly when a and b leave the same remainder on division by 5. How many equivalence classes are there?"
            answer: "5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: compute the remainders mod 5 of 3, 6, 9, 12, 15, 18: they are 3, 1, 4, 2, 0, 3 respectively. Step 2: grouping equal remainders gives the classes {3, 18}, {6}, {9}, {12}, {15}. The relation has 5 equivalence classes."
          - problem: "On {1, 2, 3, 4, 5, 6, 7, 8, 9}, let a ~ b exactly when a = b or a + b = 10. Give the equivalence class of 5 as a set."
            answer: "{5}"
            answer_contract: {"kind": "set"}
            solution_sketch: "Step 1: the condition a = b or a + b = 10 is reflexive by the first clause and symmetric, so it can define classes. Step 2: the element 5 pairs with itself since 5 + 5 = 10, and no other element x of the set satisfies 5 + x = 10. Step 3: so no element is joined to 5 except 5 itself. The equivalence class of 5 is the singleton set {5}."
        constraints: "list all classes of a concrete relation on a set of size at most 9"
      - id: kp3
        name: "Classes for rule-defined relations"
        key_prerequisites: [relations-equivalence]
        exemplars:
          - problem: "On $\\mathbb{Z}$ with $a \\sim b \\iff |a| = |b|$, the class of $6$ is $[6] = \\{x : x \\sim 6\\}$. Give the elements of $[6]$ in increasing order, separated by commas."
            answer: "-6, 6"
            answer_contract: {"kind": "list", "member": {"kind": "exact"}, "ordered": true}
            solution_sketch: "Definition of the class: $[6] = \\{x : x \\sim 6\\} = \\{x : |x| = 6\\}$. Solving the defining equation $|x| = 6$ gives $x = 6$ and $x = -6$, so the class has two elements. Listed in increasing order, the answer is -6, 6."
          - problem: "On $\\mathbb{R}$ with $x \\sim y \\iff x - y \\in \\mathbb{Z}$, the class of $a$ is $[a] = \\{x : x \\sim a\\}$. Give the unique element of $\\left[\\tfrac{9}{4}\\right]$ that lies in the interval $[0, 1)$, as a fraction."
            answer: "1/4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Definition of the class: $x \\sim 9/4$ iff $x - 9/4$ is an integer, so $[9/4] = \\{9/4 + k : k \\in \\mathbb{Z}\\}$. Its elements are $\\dots, -3/4, 1/4, 5/4, 9/4, \\dots$ and exactly one of them, $1/4$, lies in $[0, 1)$. The unique element of the class in $[0, 1)$ is 1/4."
          - problem: "On $\\mathbb{Z}$, define $a \\sim b \\iff a - b$ is a multiple of $5$, so $[a] = \\{x : x \\sim a\\}$. Determine the smallest nonnegative integer that belongs to $[11]$."
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Definition of the class: $[11] = \\{x : 5 \\text{ divides } x - 11\\}$, which is the set of integers congruent to $11$ modulo $5$. Since $11 = 2 \\cdot 5 + 1$, the class is $\\{\\dots, -9, -4, 1, 6, 11, \\dots\\}$. The smallest nonnegative element of $[11]$ is 1."
          - problem: "On the set $\\{1, 2, \\dots, 12\\}$, define $a \\sim b \\iff a$ and $b$ leave the same remainder on division by $4$, so $[a] = \\{x \\text{ in the set} : x \\sim a\\}$. Give the elements of $[9]$ in increasing order, separated by commas."
            answer: "1, 5, 9"
            answer_contract: {"kind": "list", "member": {"kind": "exact"}, "ordered": true}
            solution_sketch: "Definition of the class: $[9]$ collects the elements of $\\{1, \\dots, 12\\}$ with the same remainder as $9$ on division by $4$. Since $9 = 2 \\cdot 4 + 1$, the remainder is $1$, and the elements with remainder $1$ are $1, 5, 9$ ($13$ lies outside the ground set). In increasing order, the class is 1, 5, 9."
          - problem: "On $\\mathbb{Z}$, define $a \\sim b \\iff a - b$ is a multiple of $6$, so $[a] = \\{x : x \\sim a\\}$. How many integers of $[20]$ lie between $0$ and $30$ inclusive?"
            answer: "5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Definition of the class: $[20] = \\{x : 6 \\text{ divides } x - 20\\}$, the integers congruent to $20$ modulo $6$. Since $20 = 3 \\cdot 6 + 2$, the elements between $0$ and $30$ are $2, 8, 14, 20, 26$ (the next one, $32$, is too large). Counting them gives 5."
          - problem: "On $\\mathbb{Z}$, define $a \\sim b \\iff a + b$ is even, so $[a] = \\{x : x \\sim a\\}$. How many distinct equivalence classes does this relation have on $\\mathbb{Z}$?"
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Definition of the class: for even $a$, the condition $x + a$ even holds exactly for even $x$, so $[a]$ is the set of all even integers. For odd $a$, the condition holds exactly for odd $x$, so $[a]$ is the set of all odd integers. Hence every class is the evens or the odds, and the relation has 2 distinct equivalence classes."
        constraints: "describe $[a] = \\{x : x \\sim a\\}$ for a rule-defined relation"
