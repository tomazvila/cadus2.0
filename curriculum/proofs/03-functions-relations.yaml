      - id: kp1
        name: "The preimage-finding template"
        key_prerequisites: [functions-formal-definition]
        exemplars:
          - problem: "Let f:R -> R be given by f(x)=5x-7. Construct a preimage in the domain for an arbitrary target y in R. Give the preimage as a formula in y."
            answer: "(y+7)/5"
            answer_contract: {"kind": "function", "vars": ["y"]}
            solution_sketch: "Solve the equation $5x - 7 = y$ for $x$: adding $7$ to both sides gives $5x = y + 7$ (isolation step of the template). Dividing by $5$ and verifying gives $f((y+7)/5) = 5 \\cdot (y+7)/5 - 7 = y$, which confirms the choice (verification step). The preimage of $y$ is $(y+7)/5$."
          - problem: "Let f:Z -> Z be given by f(n)=n+3. Construct a preimage in the domain for an arbitrary target m in Z. Give the preimage as a formula in m."
            answer: "m-3"
            answer_contract: {"kind": "function", "vars": ["m"]}
            solution_sketch: "Solve $n + 3 = m$ for $n$: subtracting $3$ from both sides gives $n = m - 3$, an integer whenever $m$ is an integer (isolation step). Verification: $f(m - 3) = (m - 3) + 3 = m$ (verification step of the template). The preimage of $m$ is $m - 3$."
          - problem: "Let f:R -> R be given by f(x)=4x+9. Construct a preimage in the domain for an arbitrary target y in R. Give the preimage as a formula in y."
            answer: "(y-9)/4"
            answer_contract: {"kind": "function", "vars": ["y"]}
            solution_sketch: "Isolate $x$ in $4x + 9 = y$: subtracting $9$ gives $4x = y - 9$, and dividing by $4$ gives $x = (y-9)/4$ (isolation step of the template). Check the candidate: $f((y-9)/4) = 4 \\cdot (y-9)/4 + 9 = y$ (verification step). The preimage of $y$ is $(y-9)/4$."
          - problem: "Let f:R -> R be given by f(x)=-3x+8. Construct a preimage for an arbitrary target y in R, and give the preimage as a formula in y."
            answer: "(8-y)/3"
            answer_contract: {"kind": "function", "vars": ["y"]}
            solution_sketch: "Solve the target equation for x without restricting y, and substitute the resulting real number back into f. The expression (8-y)/3 maps to y for every real target."
          - problem: "Claim: $f : \\mathbb{R} \\to \\mathbb{R}$ with $f(x) = 3x - 6$ is surjective. Step 1: Let $y \\in \\mathbb{R}$ be given. Step 2: Solving $3x - 6 = y$ gives $3x = y + 6$. Step 3: So $x = y/3 + 6$. Step 4: Then $f(x) = 3(y/3 + 6) - 6 = y + 12 = y$, so $f$ is surjective. Which step is the first step that is not valid?"
            answer: "Step 3"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "Step 1 is valid: $y$ is introduced as an arbitrary real (setup of the template). Step 2 is valid: $3x - 6 = y$ rearranges to $3x = y + 6$ (isolation step). Step 3 is the first invalid step: dividing $3x = y + 6$ by $3$ gives $x = y/3 + 2$, not $y/3 + 6$ (division slip). Step 4 also fails, since it substitutes the wrong candidate $x = y/3 + 6$. The answer is Step 3."
          - problem: "A proof that $f : \\mathbb{R} \\to \\mathbb{R}$ with $f(x) = 2x + 5$ is surjective begins: let $y \\in \\mathbb{R}$ be arbitrary, and the next line 'take $x = ?$' is missing. Select the line that completes the proof."
            answer: "(y-5)/2"
            answer_contract: {"kind": "label", "options": [["(y-5)/2"], ["(y+5)/2"], ["(5-y)/2"], ["2y-5"]]}
            solution_sketch: "Solve $2x + 5 = y$ for $x$: subtract $5$ and divide by $2$ to get $x = (y-5)/2$, and verify $f((y-5)/2) = y$ (isolation and verification steps of the template). The option $(y+5)/2$ makes a sign error when moving the $5$ across. The option $(5-y)/2$ flips the sign of $y$ as well. The option $2y-5$ moves the $5$ but forgets to divide by $2$. The answer is $(y-5)/2$."
          - problem: "Write the full proof: $f : \\mathbb{R} \\to \\mathbb{R}$ with $f(x) = 7x - 4$ is surjective. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1 (setup): Let $y$ be an arbitrary real number; we must find a real $x$ with $f(x) = y$. Step 2 (solve): The equation $7x - 4 = y$ rearranges to $7x = y + 4$, so $x = (y + 4)/7$. Step 3 (domain check): This $x$ is a real number, because the reals are closed under addition and division by the nonzero real $7$. Step 4 (verify): Substituting gives $f(x) = 7 \\cdot (y + 4)/7 - 4 = y + 4 - 4 = y$, exactly the chosen $y$. Step 5 (conclude): Since $y$ was arbitrary and every real $y$ has a preimage $x = (y + 4)/7$ in $\\mathbb{R}$, the function $f(x) = 7x - 4$ is surjective, which completes the preimage-finding template."
        constraints: "affine maps; solve $f(x) = y$ for $x$ and verify"
