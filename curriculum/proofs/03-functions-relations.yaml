            answer_contract: {"kind": "set"}
            solution_sketch: "Step 1 (loop test): vertex $a$ carries a loop exactly when $(a, a)$ is in $R$. Step 2 (divisibility): $a$ divides $a$ for every $a$, so $(a, a)$ is in $R$ for $a = 1, 2, 3, 4$. Step 3: the set of looped vertices is {1, 2, 3, 4}."
          - problem: "The digraph of a relation on $A = \\{1, 2, 3, 4\\}$ has the arrows $1 \\to 3$, $2 \\to 3$, $3 \\to 4$ and a loop at 3. Find the in-degree of vertex 3."
