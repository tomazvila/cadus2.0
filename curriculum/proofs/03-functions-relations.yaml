        back: '$\gcd(a, b)$ and $\mathrm{lcm}(a, b)$.'
        type: basic

  - id: pigeonhole-principle
    name: "The Pigeonhole Principle"
    core: false                # terminal counting result
    difficulty: 0.60
    drill: false
    answer_kind: proof
    expected_time_secs: 210
    prerequisites:
      - id: functions-injective-surjective
        weight: 0.5
        key: true
      - id: counting-functions
        weight: 0.3
      - id: floor-ceiling-functions
        weight: 0.2
        key: false
      - id: quantifiers
        weight: 0.2
      - id: cartesian-products
        weight: 0.0
    knowledge_points:
      - id: kp1
        name: "The principle via functions"
        key_prerequisites: [functions-injective-surjective]
        exemplars:
          - problem: "Let |A|=11 and |B|=7. Can a function f:A -> B be injective? Give in order 1 for possible or 0 for impossible, and the smallest guaranteed size of a fiber of f."
            answer: "0, 2"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "Injectivity would require eleven distinct outputs inside a seven-element codomain, which is impossible. Distributing eleven inputs over seven fibers forces a fiber of size at least 2; the answer is 0, 2."
          - problem: "Let f be an injective function from a finite set A with 10 elements into a finite set B. The image f(A) is contained in B, and injectivity links the two sizes through the counting inequality. Give the smallest possible size of B."
            answer: "10"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Injectivity rule: f maps A bijectively onto its image, so the image has size 10. Containment rule: the image sits inside B, and B is finite, so the counting inequality gives size of B at least 10. Attainment: when B has exactly 10 elements the same map is also surjective, so the bound is reached. The answer is 10."
          - problem: "Let B be a fixed set with 5 elements. Find the smallest whole number N such that every function from a set with N elements to B fails to be injective."
            answer: "6"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Counting inequality for injections: an injective function from A to B would force the size of A to be at most 5. Threshold: once the domain has more than 5 elements, no injection can exist, so every such function fails injectivity, and the first such value is 6. Check below: with 5 elements a bijection onto B exists, so any smaller value fails. The answer is 6."
          - problem: "A student claims that for every positive whole number n there is an injective function from a set with n elements into a fixed set with 3 elements. Give the smallest n for which the claim is false."
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Counting inequality: an injective function would force n to be at most 3. Check small cases: n equal to 1, 2 and 3 all admit injective functions, so the claim holds there. Failure: at n equal to 4 the required inequality reads 4 at most 3, which is false, so no injection exists. The answer is 4."
          - problem: "A student proves the claim: if A and B are finite sets with the size of A greater than the size of B, then no function f from A to B is injective. Step 1: assume, toward a contradiction, that f is injective. Step 2: an injective f is a bijection from A onto B. Step 3: a bijection preserves size, so A and B have equal size. Step 4: this contradicts the hypothesis, so f is not injective. Which step is the first step that is not valid?"
            answer: "Step 2"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "Step 1 is a legal setup for a proof by contradiction. Step 2 is the first invalid step: an injective f is a bijection from A onto its image f(A), not onto all of B, because f need not be surjective. Step 3 is a true statement about bijections but it rests on the false Step 2. Step 4 is a valid conclusion once a genuine contradiction is reached. The answer is Step 2."
          - problem: "Let A be a set with 7 elements and B be a set with 6 elements. Consider all functions f from A to B; each has an image f(A) contained in B. Give your answer as verdict = yes or no for whether an injective function from A to B exists, and max = the largest possible size of f(A)."
            answer: "verdict = no; max = 6"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["yes"], ["no"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "max"}]}
            solution_sketch: "Counting inequality: an injective f would force the size of A to be at most the size of B, that is 7 at most 6, which is false, so the verdict is no. Image bound: f(A) is contained in B, so its size is at most 6. Attainment: a surjective function from A onto B exists, so the image can contain all 6 elements. The answer is verdict = no; max = 6."
          - problem: "Write the full proof: for finite sets A and B with the size of A greater than the size of B, every function f from A to B fails to be injective. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Statement: for finite sets A and B with the size of A greater than the size of B, no function f from A to B is injective. Step 1: assume, toward a contradiction, that f is injective. Step 2: an injective function sends distinct elements of A to distinct elements of B, so f restricts to a bijection from A onto its image f(A), which gives size of A equal to size of f(A). Step 3: every value f(a) lies in B, so f(A) is contained in B, and since B is finite this gives size of f(A) at most size of B. Step 4: combining Steps 2 and 3 yields the counting inequality size of A at most size of B, which contradicts the hypothesis that A is larger than B. Step 5: the assumption fails, so f is not injective, and two distinct elements of A must share the same value in B. This is exactly the pigeonhole principle stated in the language of functions."
        constraints: "connect (non-)injectivity to the counting inequality"
      - id: kp2
        name: "Basic applications"
        key_prerequisites: [functions-injective-surjective]
        exemplars:
          - problem: "Each person in a group is mapped to the state of the United States in which they were born, one of 50 possible states. How many people must be in the group to force two of them to share a birth state?"
            answer: "51"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Full object: the map that sends each person to their birth state, into a set of 50 possible states. Step 1, identify the holes: the holes are the 50 states. Step 2, apply the pigeonhole principle: more pigeons than holes forces two pigeons in one hole, so the smallest forcing number is 50 + 1. The answer is 51."
          - problem: "A set of integers is to be mapped, each integer to its remainder on division by 5. How many integers must the set contain to force two of them to leave the same remainder?"
            answer: "6"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Full object: the map that sends each integer to its remainder on division by 5. Step 1, identify the holes: the possible remainders are 0, 1, 2, 3 and 4, so there are 5 holes. Step 2, apply the pigeonhole principle: more pigeons than holes forces a repeated remainder, so the smallest number of integers is 5 + 1. The answer is 6."
          - problem: "Among 40 people, each has one of 8 blood types. Determine the largest integer k for which some blood type is guaranteed to occur at least k times, and the smallest group size that would guarantee one type occurs at least 6 times. Give the two numbers in order."
            answer: "5, 41"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "Use the blood types as eight fibers. Forty people force a fiber of size 5, while keeping every fiber at most 5 holds at most 40 people, so the two answers are 5, 41."
          - problem: "A proof maps each of 12 people to one of the 12 birth months and concludes that two people share a month. Determine whether the conclusion is correct for 12 people, and give the smallest number of extra people that makes it correct."
            answer: "verdict = invalid; extra = 1"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["valid"], ["invalid"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "extra"}]}
            solution_sketch: "Full object: the map from the 12 people to the 12 birth months, each person sent to their own month. Step 1, count pigeons and holes: there are 12 pigeons and 12 holes, and the pigeonhole principle needs more pigeons than holes, so the option valid is the error of applying the principle at equality; the map can send one person to each month. Step 2, find the forcing count: 13 people against 12 holes forces two people into one month, so one extra person makes the conclusion correct. The answer is verdict = invalid; extra = 1."
          - problem: "Exam scores are whole numbers from 0 to 100, and the proof maps each student to their score. How many students must take the exam to force two of them to have the same score?"
            answer: "102"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Full object: the map that sends each student to their score, a whole number from 0 to 100. Step 1, identify the holes: the scores 0 through 100 give 101 holes. Step 2, apply the pigeonhole principle: more pigeons than holes forces two students with the same score, so the smallest number of students is 101 + 1. The answer is 102."
          - problem: "Numbers are chosen from the whole numbers 1 through 20, and the proof uses as holes the pairs of numbers that sum to 21. How many numbers must be chosen to force two of them to sum to 21?"
            answer: "11"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Full object: the 10 holes are the pairs (1,20), (2,19), (3,18) and so on down to (10,11), each summing to 21, and every number from 1 to 20 lies in exactly one pair. Step 1, identify the pigeons: the pigeons are the chosen numbers. Step 2, apply the pigeonhole principle: more pigeons than pairs forces two chosen numbers into the same pair, and those two sum to 21; with only 10 numbers one can take one from each pair and avoid it. The answer is 11."
          - problem: "Write the full proof: in any group of 21 people, two were born on the same day of the week. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1, identify pigeons and holes: the pigeons are the 21 people and the holes are the 7 days of the week. Step 2, define the map: let f send each person to the day of the week on which they were born, a map from a set of 21 pigeons into a set of 7 holes. Step 3, apply the pigeonhole principle: if f were injective, the 21 people would need 21 distinct days, but only 7 days exist, so f is not injective. Step 4, conclude: two people are sent to the same day of the week, so in any group of 21 people two were born on the same day of the week."
        constraints: "identify pigeons and holes, then apply the principle"
      - id: kp3
        name: "Generalized pigeonhole"
        key_prerequisites: [functions-injective-surjective]
        exemplars:
          - problem: "Each of 43 integers is divided by 8, and the remainder is recorded. Find the largest number k such that at least k of the integers must leave the same remainder."
            answer: "6"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Model: the 43 integers are the objects and the 8 possible remainders 0 through 7 are the holes. Rule: the generalized pigeonhole principle guarantees that some hole receives at least the ceiling of 43 over 8 objects. Compute: 43/8 = 5.375, so the ceiling is 6; with at most 5 per class the total would be at most 40, which is less than 43. The answer is 6."
          - problem: "A total of 58 balls are placed in 12 boxes. Find the largest number m such that some box must contain at least m balls."
            answer: "5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Setup: 58 balls are the objects and the 12 boxes are the holes. Rule: the generalized pigeonhole principle in ceiling form says some box holds at least the ceiling of 58 over 12 balls. Compute: 58/12 = 4.83, so the ceiling is 5; if every box held at most 4 balls the total would be at most 48, which is less than 58. The answer is 5."
          - problem: "Integers are chosen one at a time, and each is divided by 9 to record its remainder. Find the maximum number of integers you can choose so that no two of them leave the same remainder."
            answer: "9"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Setup: division by 9 gives exactly 9 remainder classes, 0 through 8. Rule: by the pigeonhole principle, a tenth integer must repeat a remainder already used, since there are only 9 holes. Bound check: the integers 0, 1, 2, 3, 4, 5, 6, 7, 8 have nine distinct remainders, so 9 is achievable. The answer is 9."
          - problem: "You want to be certain that at least 4 of your chosen integers leave the same remainder on division by 5. How many integers must you choose at minimum?"
            answer: "16"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Setup: the holes are the 5 remainder classes mod 5, and the target is 4 integers in one class. Rule: the generalized pigeonhole principle needs more than 3 times 5 objects, since each class can otherwise hold 3. Compute: if every class held at most 3, the total would be at most 15, so 16 integers force a class with 4. Sharpness: 15 integers split as 3 in each class fail, so 15 is not enough. The answer is 16."
          - problem: "Claim: if 20 balls are placed in 6 boxes, some box has at least 6 balls. Step 1: suppose every box contains at most 3 balls. Step 2: then the total is at most 6 times 3, that is 18. Step 3: since 20 is greater than 18, the supposition is false. Step 4: therefore some box contains at least 6 balls. Which step is the first step that is not valid?"
            answer: "Step 4"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "Step 1 is a legitimate supposition for a proof by contradiction. Step 2 correctly computes 6 times 3 as 18. Step 3 correctly derives the contradiction, since 20 exceeds 18. Step 4 is the first invalid step: refuting the supposition that every box holds at most 3 only proves that some box holds at least 4, not 6; the correct guaranteed bound is the ceiling of 20 over 6, which is 4. The answer is Step 4."
          - problem: "Each of 34 students chooses exactly one of 7 project topics. Determine whether some topic must be chosen by at least 6 students, and give the largest m such that the most-chosen topic must have at least m students."
            answer: "verdict = no; minimum = 5"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["yes"], ["no"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "minimum"}]}
            solution_sketch: "Setup: the 34 students are the objects and the 7 topics are the holes. Rule: the generalized pigeonhole principle gives a most-chosen topic with at least the ceiling of 34 over 7 students, and the ceiling of 34 over 7 is 5. Since 5 is less than 6, a topic with at least 6 students is not guaranteed, and a split like 5, 5, 5, 5, 5, 5, 4 shows that 5 is the best possible bound. The answer is verdict = no; minimum = 5."
          - problem: "Write the full proof: among any 35 integers, at least 7 leave the same remainder on division by 5. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1 (the holes): map each of the 35 integers to its remainder on division by 5; the holes are the five remainder classes 0, 1, 2, 3, 4. Step 2 (hypothesis for contradiction): suppose every class contains at most 6 of the integers. Step 3 (count): then the total number of integers is at most 5 times 6, that is 30, which is smaller than 35, a contradiction. Step 4 (conclusion): therefore some remainder class contains at least the ceiling of 35 over 5, namely 7, so at least 7 of the integers leave the same remainder on division by 5, which completes the proof by the generalized pigeonhole principle."
