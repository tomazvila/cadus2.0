unit: functions-relations
course: proofs
module: "Functions & Relations"
topics:
  - id: functions-formal-definition
    name: "Functions: Formal Definition"
    core: true
    difficulty: 0.55
    drill: false
    answer_kind: proof
    expected_time_secs: 200
    prerequisites:
      - id: cartesian-products
        weight: 0.5
        key: true
      - id: set-notation
        weight: 0.3
      - id: quantifiers
        weight: 0.3
      - id: function-notation
        weight: 0.0
    knowledge_points:
      - id: kp1
        name: "Function as a special relation"
        key_prerequisites: [cartesian-products]
        exemplars:
          - problem: "Let $R = \\{(1,b), (3,a), (1,c)\\}$ be a relation with domain $\\{1,2,3\\}$ and codomain $\\{a,b,c,d\\}$. Check each element of the domain for existence of an image and uniqueness of the image. Give the verdict on whether R is a function and the number of domain elements without exactly one image."
            answer: "verdict = no; bad = 2"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["yes"], ["no"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "bad"}]}
            solution_sketch: "Object: $R = \\{(1,b), (3,a), (1,c)\\}$ with domain $\\{1,2,3\\}$ and codomain $\\{a,b,c,d\\}$. Existence step (quantifiers): input 1 has images b and c, input 2 has no image, input 3 has image a. Uniqueness step (function definition): input 1 appears in two pairs, so it fails uniqueness as well. The failing domain elements are 1 and 2, and the verdict is negative. The answer is verdict = no; bad = 2."
          - problem: "Let $R = \\{(1,c), (2,a), (3,c)\\}$ be a relation from $\\{1,2,3\\}$ to $\\{a,b,c\\}$. Check the existence-and-uniqueness condition for each first coordinate. Give the verdict on whether R is a function and the number of domain elements without exactly one image."
            answer: "verdict = yes; bad = 0"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["yes"], ["no"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "bad"}]}
            solution_sketch: "Object: $R = \\{(1,c), (2,a), (3,c)\\}$ with domain $\\{1,2,3\\}$ and codomain $\\{a,b,c\\}$. Existence step: each of 1, 2, 3 occurs as a first coordinate, so each input has an image. Uniqueness step: each first coordinate occurs in exactly one pair; the shared output c for inputs 1 and 3 is allowed because uniqueness constrains inputs, not outputs. No domain element fails. The answer is verdict = yes; bad = 0."
          - problem: "A student claims that $R = \\{(2,a), (4,b), (2,c), (3,a)\\}$ is a function from $\\{1,2,3,4\\}$ to $\\{a,b,c\\}$ and checks only that every second coordinate lies in the codomain. Give the smallest element of the domain that is not assigned exactly one output."
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Object: $R = \\{(2,a), (4,b), (2,c), (3,a)\\}$ with domain $\\{1,2,3,4\\}$. Existence step: input 1 occurs in no pair, so it fails existence. Uniqueness step: input 2 occurs in $(2,a)$ and $(2,c)$, so it fails uniqueness. Scanning the domain in order 1, 2, 3, 4, the first failure is at 1. The smallest element of the domain that is not assigned exactly one output is 1."
          - problem: "Let $R = \\{(1,a), (2,b), (1,c), (3,a), (3,d), (4,b)\\}$ be a relation with domain $\\{1,2,3,4\\}$ and codomain $\\{a,b,c,d\\}$. Determine how many pairs must be removed so that every domain element is the first coordinate of exactly one remaining pair."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Object: $R = \\{(1,a), (2,b), (1,c), (3,a), (3,d), (4,b)\\}$ with domain $\\{1,2,3,4\\}$. Count step: first coordinates 1 and 3 each occur in two pairs, while 2 and 4 occur once. Deletion step: remove one pair for 1 (keep $(1,a)$) and one for 3 (keep $(3,a)$); then every element of the domain appears exactly once, and one deletion cannot fix two distinct doubled inputs. The number of pairs to remove is 2."
          - problem: "Let R={(1,a),(2,b),(2,a)} be a relation from domain {1,2} to codomain {a,b,c}. Apply the existence-and-uniqueness condition for a function. Which option identifies the condition that fails for this relation? Select one option."
            answer: "an input has two images"
            answer_contract: {"kind": "label", "options": [["a function from the domain"], ["an input has two images"], ["an output has two inputs"], ["a codomain element unused"]]}
            solution_sketch: "Object: $R = \\{(1,a), (2,b), (2,a)\\}$ with domain $\\{1,2\\}$ and codomain $\\{a,b,c\\}$. Existence step (quantifiers): 1 and 2 each occur as a first coordinate, so each input has an image. Uniqueness step (function definition): input 2 occurs in $(2,b)$ and $(2,a)$, so it has two images and uniqueness fails. The option a function from the domain ignores that failure; the option an output has two inputs reverses the condition, which only constrains inputs; the option a codomain element unused wrongly requires every codomain element to appear. The answer is an input has two images."
          - problem: "For domain A={1,2,3} and codomain B={4,5}, examine R={(1,4),(2,5),(2,4)}. Give in order the number of inputs without an output, the number with multiple outputs, and 1 if R is a function A -> B or 0 otherwise."
            answer: "1, 1, 0"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "Check the output fiber of every input in the declared domain. Input 3 has no output and input 2 has two, so the indicators are 1, 1, 0."
          - problem: "Write the full proof: $R = \\{(x, y) : y = x + 1 \\text{ and } x \\in \\{1, 2, 3\\}\\}$ is a function from $\\{1, 2, 3\\}$ to $\\{2, 3, 4\\}$. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1 (relation check): every pair $(x,y)$ in $R$ has $x \\in \\{1,2,3\\}$ and $y = x+1 \\in \\{2,3,4\\}$, so $R$ is a relation from $\\{1,2,3\\}$ to $\\{2,3,4\\}$. Step 2 (existence): let $x$ be an arbitrary element of $\\{1,2,3\\}$; the pair $(x, x+1)$ satisfies the defining condition, so $(x, x+1) \\in R$ and $x$ has an image. Step 3 (uniqueness): suppose $(x,y)$ and $(x,y')$ both lie in $R$; by the defining condition $y = x+1$ and $y' = x+1$, hence $y = y'$, so each input has exactly one image. Step 4 (conclusion): existence and uniqueness hold for every element of the domain, therefore $R$ is a function from $\\{1,2,3\\}$ to $\\{2,3,4\\}$."
        constraints: "check the existence-and-uniqueness condition on a listed relation"
      - id: kp2
        name: "Well-defined functions"
        key_prerequisites: [quantifiers]
        exemplars:
          - problem: "A rule on residue classes modulo 3 is proposed by [n] -> [2n+1]. Compare the candidates [n] -> [n+1] and [n] -> [floor(n/2)] as well. Decide for each rule whether changing an integer representative leaves its output class unchanged. Give the three indicators in order, 1 for well-defined and 0 otherwise."
            answer: "1, 1, 0"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "For each rule, compare outputs at representatives separated by a multiple of 3. The affine rules preserve congruence, while representatives 0 and 3 give different classes under floor(n/2), so the indicators are 1, 1, 0."
          - problem: "The rule g(x) = 1/x is proposed as a function from R to R. Give the real number x for which g has no output."
            answer: "0"
            answer_contract: {"kind": "exact"}
            solution_sketch: "A function from R to R must assign an output to every real number. At x = 0 the rule gives 1/0, which is undefined. Thus the missing input is 0. The answer is 0."
          - problem: "The rule h: Z -> Z with h(n) = n/2 is proposed as a function. Give the smallest positive integer n for which h(n) is not an integer."
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Test positive integers in order. For n = 1, h(1) = 1/2, which is not an integer. Therefore the smallest positive integer is 1. The answer is 1."
          - problem: "Let A = {1, 2} and B = {3, 4}. The relation R = {(1, 3), (2, 3), (2, 4)} is proposed as a function A -> B. Give the input in A that has two different outputs."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "List the pairs: (1, 3), (2, 3), (2, 4). Input 1 has only output 3, but input 2 has outputs 3 and 4. Thus the input with two different outputs is 2. The answer is 2."
          - problem: "A student checks whether the relation S = {(1, 4), (2, 4), (2, 7), (3, 7)} is a well-defined function from A = {1, 2, 3} to B = {4, 7}. Step 1: Every element of A appears in at least one pair of S. Step 2: Every element of B appears in at least one pair of S. Step 3: Since every element of B appears as an output, each input has exactly one output. Step 4: Therefore S is a well-defined function from A to B. Which step is the first step that is not valid?"
            answer: "Step 3"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "Step 1 is true: each of 1, 2, 3 appears in at least one pair of S. Step 2 is true: both 4 and 7 appear as outputs. Step 3 is the first invalid step: covering every element of B does not give one output per input, and the input 2 is paired with both 4 and 7. Step 4 would hold only if Step 3 were correct. The method of this knowledge point is the check that each input has exactly one output in the stated codomain, and it fails at input 2. The answer is Step 3."
          - problem: "Let A = {1, 2, 3} and B = {4, 5}. The relation R = {(1, 4), (2, 5), (3, 4)} is proposed as a function A -> B. Give the number of inputs in A that have exactly one output."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "List the pairs: (1, 4), (2, 5), (3, 4). Check each input: 1 has one output 4, 2 has one output 5, and 3 has one output 4. All three inputs have exactly one output. The answer is 3."
          - problem: "Write the full proof: the rule f: Z -> Z with f(n) = 5n - 3 is a well-defined function. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Claim: f: Z -> Z with f(n) = 5n - 3 is well-defined. Step 1 (domain): Let n be any integer. Step 2 (output existence): 5n - 3 is an integer because 5n and 3 are integers and integers are closed under subtraction. Step 3 (codomain): This integer 5n - 3 lies in Z, the stated codomain. Step 4 (uniqueness): Suppose a and b are integers with a = b. Then f(a) = 5a - 3 and f(b) = 5b - 3, so f(a) - f(b) = 5(a - b) = 0, hence f(a) = f(b). Step 5 (conclusion): Every integer input has exactly one integer output, so f is a well-defined function from Z to Z."
        constraints: "verify each input has exactly one output in the stated codomain"
      - id: kp3
        name: "Equality of functions"
        key_prerequisites: [quantifiers]
        exemplars:
          - problem: "Compare f: R -> R, f(x)=(x+2)^2, with g: R -> R, g(x)=x^2+4*x+4. Give four indicators: equal domains; equal codomains; rules agree at every input in the common domain; equal functions. Use 1 for yes and 0 for no."
            answer: "1, 1, 1, 1"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "Check both declared sets as well as pointwise agreement; equality of formulas alone does not settle the typed-function comparison. The four indicators are 1, 1, 1, 1."
          - problem: "Compare f: R -> R, f(x)=2*x, with g: Z -> Z, g(x)=2*x. Give four indicators: equal domains; equal codomains; rules agree at every input in the common domain; equal functions. Use 1 for yes and 0 for no."
            answer: "0, 0, 1, 0"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "Check both declared sets as well as pointwise agreement; equality of formulas alone does not settle the typed-function comparison. The four indicators are 0, 0, 1, 0."
          - problem: "Compare f: Z -> Z, f(n)=n^2, with g: Z -> nonnegative integers, g(n)=n^2. Give four indicators: equal domains; equal codomains; rules agree on their common domain; equal functions. Use 1 for yes and 0 for no."
            answer: "1, 0, 1, 0"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "The two rules agree for every integer and share the same domain. Their declared codomains differ, so the indicators are 1, 0, 1, 0."
          - problem: "Compare f: R -> R, f(x)=x^2+x, with g: R -> R, g(x)=2*x. Give four indicators: equal domains; equal codomains; rules agree at every input in the common domain; equal functions. Use 1 for yes and 0 for no."
            answer: "1, 1, 0, 0"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "Check both declared sets as well as pointwise agreement; equality of formulas alone does not settle the typed-function comparison. The four indicators are 1, 1, 0, 0."
          - problem: "Compare f: R -> R, f(x)=abs(x), with g: R -> nonnegative reals, g(x)=abs(x). Give four indicators: equal domains; equal codomains; rules agree at every input in the common domain; equal functions. Use 1 for yes and 0 for no."
            answer: "1, 0, 1, 0"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "Check both declared sets as well as pointwise agreement; equality of formulas alone does not settle the typed-function comparison. The four indicators are 1, 0, 1, 0."
          - problem: "Compare f: nonnegative reals -> R, f(x)=x^2, with g: R -> R, g(x)=x^2. Give four indicators: equal domains; equal codomains; rules agree at every input in the common domain; equal functions. Use 1 for yes and 0 for no."
            answer: "0, 1, 1, 0"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "Check both declared sets as well as pointwise agreement; equality of formulas alone does not settle the typed-function comparison. The four indicators are 0, 1, 1, 0."
          - problem: "Write the full proof: let $f, g : \\mathbb{R} \\to \\mathbb{R}$ be given by $f(x) = (2x)^2$ and $g(x) = 4x^2$. Prove that $f = g$. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Definition step: two functions are equal exactly when they have the same domain, the same codomain, and equal outputs at every input, that is, $f(x) = g(x)$ for every $x$ in the domain. Domain and codomain step: both $f$ and $g$ are declared from $\\mathbb{R}$ to $\\mathbb{R}$, so the domains coincide and the codomains coincide. Pointwise step: for every real $x$, the power of a product gives $(2x)^2 = 2^2 x^2 = 4x^2 = g(x)$, so the outputs agree at every input. Conclusion step: all three conditions of the definition of function equality hold, namely same domain, same codomain, and pointwise agreement on all of $\\mathbb{R}$; hence $f = g$. $\\square$"
        constraints: "compare domain, codomain, and outputs pointwise"
    diagnostic_exemplar:
      problem: 'Is $\{(x, y) \in \mathbb{R}^2 : y^2 = x\}$ a function $\mathbb{R} \to \mathbb{R}$? And do $f(x) = x^2$ on $\mathbb{R}$ and $g(x) = x^2$ on $[0, \infty)$ define the same function? Justify both answers.'
      answer: 'The relation is not a function $\mathbb{R} \to \mathbb{R}$, on two counts: uniqueness fails, since $x = 4$ is paired with both $y = 2$ and $y = -2$; and totality fails, since no real $y$ has $y^2 = -1$, so $x = -1$ gets no image. And $f \ne g$: two functions are equal only when they have the same domain, the same codomain and the same values, and here the domains differ ($\mathbb{R}$ versus $[0,\infty)$) even though the rule is identical.'
      solution_sketch: 'A function assigns exactly one output to every input of its domain; then recall that a function is its domain, codomain and rule taken together.'
    anki_seeds:
      - front: 'Formal definition of a function $f : A \to B$?'
        back: 'A subset $f \subseteq A \times B$ such that each $a \in A$ is the first coordinate of exactly one pair $(a, b) \in f$.'
        type: basic
      - front: 'When are two functions equal?'
        back: 'Same domain, same codomain, and $f(x) = g(x)$ for every $x$ in the domain.'
        type: basic

  - id: floor-ceiling-functions
    name: "Floor and Ceiling Functions"
    core: true
    difficulty: 0.50
    drill: false
    answer_kind: numeric
    expected_time_secs: 100
    prerequisites:
      - id: functions-formal-definition
        weight: 0.5
        key: true
      - id: function-notation
        weight: 0.2
    knowledge_points:
      - id: kp1
        name: "Evaluating floor and ceiling"
        key_prerequisites: [function-notation]
        exemplars:
          - problem: "Compute $\\lfloor 4.6 \\rfloor$, $\\lceil 2.1 \\rceil$, $\\lfloor -2.7 \\rfloor$, and $\\lceil -3.4 \\rceil$. Give each value."
            answer: "f1 = 4; c1 = 3; f2 = -3; c2 = -3"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "f1"}, {"contract": {"kind": "exact"}, "name": "c1"}, {"contract": {"kind": "exact"}, "name": "f2"}, {"contract": {"kind": "exact"}, "name": "c2"}]}
            solution_sketch: "Floor rule: the floor is the greatest integer at most the input, so $\\lfloor 4.6 \\rfloor = 4$. Ceiling rule: the ceiling is the least integer at least the input, so $\\lceil 2.1 \\rceil = 3$. Negative inputs are the trap: $-3 \\le -2.7 < -2$, so $\\lfloor -2.7 \\rfloor = -3$, and $-4 < -3.4 \\le -3$, so $\\lceil -3.4 \\rceil = -3$. The values are f1 = 4; c1 = 3; f2 = -3; c2 = -3."
          - problem: "Compute $\\lfloor 8 \\rfloor$, $\\lceil 8 \\rceil$, and $\\lceil -1/3 \\rceil$. Give each value."
            answer: "a = 8; b = 8; c = 0"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "a"}, {"contract": {"kind": "exact"}, "name": "b"}, {"contract": {"kind": "exact"}, "name": "c"}]}
            solution_sketch: "Integer rule: at an integer input the floor and the ceiling both return the integer itself, so $\\lfloor 8 \\rfloor = 8$ and $\\lceil 8 \\rceil = 8$. Small negative rule: $-1 \\le -1/3 < 0$, so the least integer at least $-1/3$ is $0$. The values are a = 8; b = 8; c = 0."
          - problem: "Compute $\\lfloor -6.4 \\rfloor + \\lceil 2.3 \\rceil$."
            answer: "-4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Floor rule: $-7 \\le -6.4 < -6$, so $\\lfloor -6.4 \\rfloor = -7$; floor rounds toward negative infinity, not toward zero. Ceiling rule: $2 < 2.3 \\le 3$, so $\\lceil 2.3 \\rceil = 3$. The sum is $-7 + 3 = -4$. The answer is -4."
          - problem: "Compute $\\lfloor 2.5 \\rfloor + \\lfloor 3.5 \\rfloor$."
            answer: "5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Floor rule: $\\lfloor 2.5 \\rfloor = 2$ since 2 is the greatest integer at most 2.5. Floor rule again: $\\lfloor 3.5 \\rfloor = 3$ since 3 is the greatest integer at most 3.5. Note the floor is taken before adding: $2 + 3 = 5$. The answer is 5."
          - problem: "Compute $\\lfloor -7 \\rfloor + \\lceil -7 \\rceil$."
            answer: "-14"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Integer rule: at an integer input the floor and the ceiling coincide, so $\\lfloor -7 \\rfloor = -7$ and $\\lceil -7 \\rceil = -7$. No rounding happens at an integer, even a negative one. The sum is $-7 + (-7) = -14$. The answer is -14."
          - problem: "Compute $\\lfloor \\sqrt{5} \\rfloor$ and $\\lceil \\sqrt{5} \\rceil$. Give both values."
            answer: "a = 2; b = 3"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "a"}, {"contract": {"kind": "exact"}, "name": "b"}]}
            solution_sketch: "Locate the input: $2^2 = 4 < 5 < 9 = 3^2$, so $2 < \\sqrt{5} < 3$. Floor rule: the greatest integer at most $\\sqrt{5}$ is 2. Ceiling rule: the least integer at least $\\sqrt{5}$ is 3. The values are a = 2; b = 3."
        constraints: "evaluate at positives, negatives, and integers; negatives are the trap"
      - id: kp2
        name: "Basic identities"
        key_prerequisites: [functions-formal-definition]
        exemplars:
          - problem: "Which formula equals ceil(x) for every real x and every integer n? 1: -floor(-x); 2: floor(-x); 3: floor(x); 4: -ceil(-x). Give the candidate number."
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Write an arbitrary real x as its integer part plus a remainder in [0,1), and distinguish the zero-remainder case. Apply the definitions across both cases; only candidate 1 holds for every permitted x and n."
          - problem: "Which formula equals floor(x+n) for every real x and every integer n? 1: floor(x)-n; 2: floor(x)+n; 3: ceil(x)+n; 4: n-floor(x). Give the candidate number."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Write an arbitrary real x as its integer part plus a remainder in [0,1), and distinguish the zero-remainder case. Apply the definitions across both cases; only candidate 2 holds for every permitted x and n."
          - problem: "Which formula equals ceil(x+n) for every real x and every integer n? 1: ceil(x)-n; 2: floor(x)+n; 3: ceil(x)+n; 4: n-ceil(x). Give the candidate number."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Write an arbitrary real x as its integer part plus a remainder in [0,1), and distinguish the zero-remainder case. Apply the definitions across both cases; only candidate 3 holds for every permitted x and n."
          - problem: "Which formula equals floor(-x) for every real x and every integer n? 1: floor(x); 2: -floor(x); 3: ceil(x); 4: -ceil(x). Give the candidate number."
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Write an arbitrary real x as its integer part plus a remainder in [0,1), and distinguish the zero-remainder case. Apply the definitions across both cases; only candidate 4 holds for every permitted x and n."
          - problem: "Which formula equals ceil(-x+n) for every real x and every integer n? 1: n-floor(x); 2: n-ceil(x); 3: n+floor(x); 4: -n-floor(x). Give the candidate number."
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Write an arbitrary real x as its integer part plus a remainder in [0,1), and distinguish the zero-remainder case. Apply the definitions across both cases; only candidate 1 holds for every permitted x and n."
          - problem: "Which formula equals floor(x)-ceil(x) for every real x? 1: 1 for noninteger x and 0 for integer x; 2: -1 for noninteger x and 0 for integer x; 3: -1 for every real x; 4: 0 for every real x. Give the candidate number."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Write an arbitrary real x as its integer part plus a remainder in [0,1), and distinguish the zero-remainder case. Apply the definitions across both cases; only candidate 2 holds for every permitted x and n."
        constraints: "Choose and justify general floor/ceiling rewrites, respecting integer shifts and the distinction between integer and noninteger arguments; do not merely evaluate a supplied identity at one point."
      - id: kp3
        name: "Solving with floors and ceilings"
        key_prerequisites: [functions-formal-definition]
        exemplars:
          - problem: "Describe all real x whose floor equals 7. Give the answer as an inequality in x."
            answer: "7 <= x < 8"
            answer_contract: {"kind": "inequality_union"}
            solution_sketch: "Definition of floor: the floor of x is the greatest integer at most x. For the floor of x equal to 7, x must be at least 7 and less than 8. Thus the solution is 7 <= x < 8."
          - problem: "Describe all real x whose ceiling equals -2. Give the answer as an inequality in x."
            answer: "-3 < x <= -2"
            answer_contract: {"kind": "inequality_union"}
            solution_sketch: "Definition of ceiling: the ceiling of x is the least integer at least x. The equation with the ceiling of x equal to n holds exactly when n - 1 < x <= n. With n = -2 this becomes -3 < x <= -2, and every x in that interval has ceiling -2, while x = -3 has ceiling -3 and x = -2 has ceiling -2. Thus the solution set is -3 < x <= -2."
          - problem: "Describe all real x whose ceiling equals 6. Give the answer as an inequality in x."
            answer: "5 < x <= 6"
            answer_contract: {"kind": "inequality_union"}
            solution_sketch: "Definition of ceiling: the ceiling of x equal to n means n - 1 < x <= n. With n = 6 this becomes 5 < x <= 6. Thus the solution is 5 < x <= 6."
          - problem: "Describe all real x whose floor equals -5. Give the answer as an inequality in x."
            answer: "-5 <= x < -4"
            answer_contract: {"kind": "inequality_union"}
            solution_sketch: "Definition of floor: the floor of x equal to m means m <= x < m + 1. With m = -5 this becomes -5 <= x < -4. Thus the solution is -5 <= x < -4."
          - problem: "Describe all real x satisfying floor(2x-1)=3. Give the solution as an inequality in x."
            answer: "2 <= x < 5/2"
            answer_contract: {"kind": "inequality_union"}
            solution_sketch: "The floor equation requires 3 <= 2x-1 < 4. Solving both bounds gives 2 <= x < 5/2."
          - problem: "Describe all real x whose floor equals 5 or whose ceiling equals 5. Give the answer as an inequality in x."
            answer: "4 < x < 6"
            answer_contract: {"kind": "inequality_union"}
            solution_sketch: "Definition of floor: floor of x equal to 5 gives 5 <= x < 6. Definition of ceiling: ceiling of x equal to 5 gives 4 < x <= 5. The union of these two intervals is 4 < x < 6. Thus the solution is 4 < x < 6."
        constraints: "solution sets of $\\lfloor x \\rfloor = n$ or $\\lceil x \\rceil = n$ as intervals"
    diagnostic_exemplar:
