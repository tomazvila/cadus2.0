            solution_sketch: "The range of f(x) = e^x on R is (0, ∞), so every y <= 0 lies outside the image. The integers with no preimage are 0, -1, -2, and so on. The largest of these is 0. The largest integer with no preimage is 0."
          - problem: "Let f : R -> [a, ∞) be given by f(x) = x^2 + 6. Give the smallest real number a for which f is surjective."
            answer: "6"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The rule f(x) = x^2 + 6 attains exactly the values x^2 + 6 >= 6, so its image is [6, ∞). For the map to be onto [a, ∞) the number a must be the least image value, so a = 6. Check: every y >= 6 has x = sqrt(y - 6) with f(x) = y, and no y < 6 is attained. The smallest such a is 6."
          - problem: "The formula f(x)=x^2+1 is proposed as a map from R onto each of these codomains: A=R, B=[1,infinity), C=(1,infinity). For each, determine whether it is a well-defined surjection. Return 0 if the formula is not even a map into that codomain, 1 if it is a map but not onto, and 2 if it is onto. Justify each verdict by a general preimage argument or a counterexample."
            answer: "1, 2, 0"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "The exact image is [1,infinity): every target at least 1 has a square-root preimage. The real codomain has missed values, while the strictly larger-than-1 codomain excludes the actual value f(0)=1. The encoded answer is 1, 2, 0."
          - problem: "In the proof that f : R -> [-1, ∞) with f(x) = x^2 - 1 is surjective, the line that produces the preimage of a given y >= -1 is missing. Select the line that is correct."
            answer: "take x = sqrt(y + 1)"
            answer_contract: {"kind": "label", "options": [["take x = sqrt(y + 1)"], ["take x = sqrt(y - 1)"], ["take x = sqrt(1 - y)"], ["take x = y + 1"]]}
            solution_sketch: "Solve y = x^2 - 1 for x: add 1 to get x^2 = y + 1, and y >= -1 makes y + 1 nonnegative, so x = sqrt(y + 1) is real. The option sqrt(y - 1) subtracts instead of adds and fails when y lies between -1 and 1. The option sqrt(1 - y) reverses the sign of y. The option y + 1 forgets the square root, so f of it is not y. The correct line is take x = sqrt(y + 1)."
          - problem: "Write the full proof: f : R -> [3, ∞) with f(x) = x^2 + 3 is surjective onto [3, ∞) but not onto R. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1: let y be an arbitrary element of the codomain [3, ∞), so y is a real number with y >= 3. Step 2: set x = sqrt(y - 3); since y - 3 >= 0, x is a real number, so x lies in the domain R. Step 3: compute f(x) = (sqrt(y - 3))^2 + 3 = y - 3 + 3 = y. Step 4: every y in [3, ∞) has a preimage, so f is surjective onto [3, ∞). Step 5: the same rule as a map R -> R is not surjective, because y = 0 lies in R while x^2 + 3 = 0 has no real solution; surjectivity depends on the stated codomain."
        constraints: "maps surjective onto a stated codomain but not onto all of $\\mathbb{R}$"
    diagnostic_exemplar:
      problem: 'Prove that $f : \mathbb{R} \to [1, \infty)$, $f(x) = x^2 + 1$, is surjective, and explain why the same rule as a map $\mathbb{R} \to \mathbb{R}$ is not.'
      answer: 'Let $y \in [1, \infty)$. Then $y - 1 \ge 0$, so $x = \sqrt{y-1}$ is a real number, and $f(x) = (\sqrt{y-1})^2 + 1 = y$. Every element of the codomain has a preimage, so $f$ is surjective. As a map into $\mathbb{R}$ it is not: $x^2 + 1 \ge 1$ for every real $x$, so nothing maps to $0$. Surjectivity depends on the codomain, not only on the rule.'
      solution_sketch: 'Given a target $y$, solve $f(x) = y$ and check the solution lies in the domain; then point to codomain elements that are unreachable.'
    anki_seeds:
      - front: 'To prove $f : A \to B$ surjective, you...'
        back: 'take an arbitrary $b \in B$ and exhibit $a \in A$ with $f(a) = b$.'
        type: basic
      - front: 'Which part of a function''s specification does surjectivity depend on?'
        back: 'The codomain — the same rule can be surjective onto a smaller codomain and not onto a larger one.'
        type: basic

