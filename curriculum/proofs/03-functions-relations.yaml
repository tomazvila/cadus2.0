            answer: "[0,0,1;1,1,0;0,0,1]"
            answer_contract: {"cols": 3, "kind": "matrix", "rows": 3}
            solution_sketch: "The relation is $R = \\{(1,3), (2,1), (2,2), (3,3)\\}$. Step 1 uses the definition of a zero-one matrix: entry $(i,j)$ is $1$ exactly when $(i,j)$ belongs to $R$. Step 2 fills row 1 with a 1 only in column 3, row 2 with ones in columns 1 and 2, and row 3 with a 1 only in column 3. The zero-one matrix is [0,0,1;1,1,0;0,0,1]."
          - problem: "Let $A = \\{a\\}$. How many relations are there on $A$?"
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The Cartesian product $A \\times A$ is $\\{(a,a)\\}$. Step 1 uses the definition of a relation: every subset of $A \\times A$ is a relation on $A$. Step 2 counts subsets of a one-element set: $2^1 = 2$. The number of relations is 2."
          - problem: "On $A = \\{1,2\\}$ define $R = \\{(1,2), (2,1)\\}$. Give the $2 \\times 2$ zero-one matrix of $R$ as [a,b;c,d]."
            answer: "[0,1;1,0]"
            answer_contract: {"cols": 2, "kind": "matrix", "rows": 2}
            solution_sketch: "The relation is $R = \\{(1,2), (2,1)\\}$. Step 1 uses the zero-one matrix encoding: entry $(i,j)$ is $1$ when $(i,j)$ belongs to $R$. Step 2 puts a 1 in row 1 column 2 and a 1 in row 2 column 1. The zero-one matrix is [0,1;1,0]."
          - problem: "Let $B = \\{1,2,3\\}$. How many relations are there on $B$?"
            answer: "512"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The Cartesian product $B \\times B$ has $3 \\cdot 3 = 9$ ordered pairs. Step 1 uses the definition of a relation: every subset of $B \\times B$ is a relation on $B$. Step 2 counts subsets of a nine-element set: $2^9 = 512$. The number of relations is 512."
          - problem: "On $A = \\{1,2,3\\}$ define $R = \\{(1,1), (1,2), (3,2)\\}$. Give the $3 \\times 3$ zero-one matrix of $R$ as [a,b;c,d]."
            answer: "[1,1,0;0,0,0;0,1,0]"
            answer_contract: {"cols": 3, "kind": "matrix", "rows": 3}
            solution_sketch: "The relation is $R = \\{(1,1), (1,2), (3,2)\\}$. Step 1 uses the zero-one matrix encoding: entry $(i,j)$ is $1$ exactly when $(i,j)$ belongs to $R$. Step 2 fills row 1 with ones in columns 1 and 2, row 2 with all zeros, and row 3 with a 1 only in column 2. The zero-one matrix is [1,1,0;0,0,0;0,1,0]."
        constraints: "matrix encoding on sets of size at most 3; count relations as $2^{n^2}$"
    diagnostic_exemplar:
      problem: 'On $A = \{1, 2, 3\}$ let $R = \{(a,b) : a \le b\}$. List the pairs of $R$, write its $3 \times 3$ zero-one matrix (rows indexed by the first coordinate), and say which vertices of its digraph carry loops.'
      answer_contract: {kind: none}
      answer: 'Pairs: $(1,1), (1,2), (1,3), (2,2), (2,3), (3,3)$. Matrix rows: $(1,1,1)$, $(0,1,1)$, $(0,0,1)$ — the entry in row $i$, column $j$ is $1$ exactly when $i \le j$. Every vertex carries a loop, since $a \le a$ for each $a$; loops are the diagonal $1$s.'
      solution_sketch: 'List the pairs whose first coordinate is at most the second, transcribe them into the matrix, and note that loops correspond to diagonal entries.'
    anki_seeds:
