        type: basic
      - front: 'Definition of $\lceil x \rceil$?'
        back: 'The least integer $\ge x$.'
        type: basic

  - id: computing-compositions
    name: "Computing Compositions"
    core: true
    difficulty: 0.55
    drill: false
    answer_kind: numeric
    expected_time_secs: 110
    prerequisites:
      - id: functions-formal-definition
        weight: 0.5
        key: true
      - id: function-composition
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: "Composing formulas"
        key_prerequisites: [function-composition]
        exemplars:
          - problem: "Let $f(x) = x^2 + 2$ and $g(x) = 4x$ on the real numbers. Find $(f \\circ g)(x)$ and $(g \\circ f)(x)$ as functions of $x$. Give the answers as fog and gof."
            answer: "fog = 16x^2+2; gof = 4x^2+8"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "function", "vars": ["x"]}, "name": "fog"}, {"contract": {"kind": "function", "vars": ["x"]}, "name": "gof"}]}
            solution_sketch: "Write the full objects first: $(f \\circ g)(x) = f(g(x))$ and $(g \\circ f)(x) = g(f(x))$, this is the definition of composition. Substitute the inner formula into the outer one: $(f \\circ g)(x) = (4x)^2 + 2 = 16x^2 + 2$. For the other order, substitute $f(x) = x^2 + 2$ into $g$: $(g \\circ f)(x) = 4(x^2 + 2) = 4x^2 + 8$. So fog = 16x^2+2; gof = 4x^2+8."
          - problem: "Let $f(x) = 3x - 2$ and $g(x) = x^2 + 1$. Compute $(f \\circ g)(2)$ and $(g \\circ f)(2)$. Give the answers as fog and gof."
            answer: "fog = 13; gof = 17"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "fog"}, {"contract": {"kind": "exact"}, "name": "gof"}]}
            solution_sketch: "Work from the inside out, this is the definition of composition applied at a point. The inner value is $g(2) = 4 + 1 = 5$, so $(f \\circ g)(2) = f(5) = 15 - 2 = 13$. In the other order $f(2) = 6 - 2 = 4$, so $(g \\circ f)(2) = g(4) = 16 + 1 = 17$. The values are fog = 13; gof = 17."
          - problem: "Let $f(x) = 1/x$ and $g(x) = x + 5$ (with the usual domains). Find $(f \\circ g)(x)$ and $(g \\circ f)(x)$ as functions of $x$. Give the answers as fog and gof."
            answer: "fog = 1/(x+5); gof = 1/x+5"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "function", "vars": ["x"]}, "name": "fog"}, {"contract": {"kind": "function", "vars": ["x"]}, "name": "gof"}]}
            solution_sketch: "State the two full objects: $(f \\circ g)(x) = f(g(x))$ and $(g \\circ f)(x) = g(f(x))$. Substituting $g(x) = x + 5$ into the reciprocal gives $(f \\circ g)(x) = 1/(x + 5)$. Substituting $f(x) = 1/x$ into $g$ gives $(g \\circ f)(x) = 1/x + 5$. Hence fog = 1/(x+5); gof = 1/x+5."
          - problem: "Let $f(x) = 5/x$ and $g(x) = x - 1$. Compute $(f \\circ g)(2)$ and $(g \\circ f)(2)$ as fractions or integers. Give the answers as fog and gof."
            answer: "fog = 5; gof = 3/2"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "fog"}, {"contract": {"kind": "exact"}, "name": "gof"}]}
            solution_sketch: "Evaluate the inner function first, using the definition of composition. Since $g(2) = 1$, we get $(f \\circ g)(2) = f(1) = 5/1 = 5$. For the other order, $f(2) = 5/2$, so $(g \\circ f)(2) = g(5/2) = 5/2 - 1 = 3/2$. The values are fog = 5; gof = 3/2."
          - problem: "Let $f(x) = \\sqrt{x}$ and $g(x) = x^2 + 9$. Find $(f \\circ g)(x)$ and $(g \\circ f)(x)$ as functions of $x$. Give the answers as fog and gof."
            answer: "fog = sqrt(x^2+9); gof = x+9"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "function", "vars": ["x"]}, "name": "fog"}, {"contract": {"kind": "function", "vars": ["x"]}, "name": "gof"}]}
            solution_sketch: "Set up the two full objects from the definition of composition: $(f \\circ g)(x) = f(g(x))$ and $(g \\circ f)(x) = g(f(x))$. Place $g(x) = x^2 + 9$ under the square root to get $(f \\circ g)(x) = \\sqrt{x^2 + 9}$. Then apply $g$ to $f(x) = \\sqrt{x}$: $(\\sqrt{x})^2 + 9 = x + 9$. Thus fog = sqrt(x^2+9); gof = x+9."
          - problem: "Let $f(x) = 3x + 2$, and suppose that $(f \\circ g)(x) = 6x^2 - 1$ for all real $x$. Find $g(x)$ as a function of $x$."
            answer: "2x^2-1"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "By the definition of composition, $(f \\circ g)(x) = f(g(x)) = 3g(x) + 2$. Set this full object equal to the given formula: $3g(x) + 2 = 6x^2 - 1$. Solving gives $3g(x) = 6x^2 - 3$, so $g(x) = 2x^2 - 1$. The answer is 2x^2-1."
        constraints: "compose two given formulas in both orders; symbolic or at a point"
      - id: kp2
        name: "Composing on finite sets"
        key_prerequisites: [functions-formal-definition]
        exemplars:
          - problem: "On $A = \\{1, 2, 3\\}$ the function $f$ sends $1$ to $2$, $2$ to $3$ and $3$ to $2$, and $g$ sends $1$ to $3$, $2$ to $2$ and $3$ to $3$. Find the three values of the composition $g \\circ f$ and give them as $v_1 = (g \\circ f)(1)$, $v_2 = (g \\circ f)(2)$, $v_3 = (g \\circ f)(3)$."
            answer: "v1 = 2; v2 = 3; v3 = 2"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "v1"}, {"contract": {"kind": "exact"}, "name": "v2"}, {"contract": {"kind": "exact"}, "name": "v3"}]}
            solution_sketch: "The full table of $g \\circ f$ is $1 \\mapsto 2$, $2 \\mapsto 3$, $3 \\mapsto 2$. Step 1 (apply the inner function): $f$ sends $1$ to $2$, $2$ to $3$ and $3$ to $2$. Step 2 (apply the outer function): $g(2) = 2$, $g(3) = 3$, $g(2) = 2$ for the inputs $1, 2, 3$ in order. This gives v1 = 2; v2 = 3; v3 = 2."
          - problem: "On $A = \\{1, 2, 3, 4\\}$ let $f$ send $1$ to $3$, $2$ to $4$, $3$ to $2$ and $4$ to $4$. Compute $(f \\circ f)(2)$."
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Compose $f$ with itself: the inner step gives $f(2) = 4$, and the outer step gives $f(4) = 4$. Hence $(f \\circ f)(2) = f(f(2)) = f(4) = 4$."
          - problem: "On $A = \\{1, 2, 3, 4\\}$ let $f$ send $1$ to $3$, $2$ to $3$, $3$ to $3$ and $4$ to $4$, and let $g$ send $1$ to $4$, $2$ to $4$, $3$ to $2$ and $4$ to $1$. How many elements $x$ of $A$ satisfy $(g \\circ f)(x) = 2$?"
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Apply $f$ and then $g$ to every element of the full set: $(g \\circ f)(1) = g(3) = 2$, $(g \\circ f)(2) = g(3) = 2$, $(g \\circ f)(3) = g(3) = 2$, $(g \\circ f)(4) = g(4) = 1$. The elements $1, 2, 3$ give the value $2$, so the count is 3."
          - problem: "On $A = \\{1, 2, 3\\}$ the composition $h = g \\circ f$ has table $1 \\mapsto 2$, $2 \\mapsto 3$, $3 \\mapsto 3$, and $f$ sends $1$ to $2$, $2$ to $1$ and $3$ to $3$. Find $g(2)$."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (find the inner value): the element that $f$ sends to $2$ is $1$, since $f(1) = 2$. Step 2 (read the composition table): $g(2) = g(f(1)) = h(1) = 2$. Therefore g(2) = 2."
          - problem: "On $A = \\{1, 2, 3\\}$ let $f$ send $1$ to $3$, $2$ to $1$ and $3$ to $1$. Compute $(f \\circ f \\circ f)(2)$."
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Apply $f$ three times starting at $2$: the first application gives $f(2) = 1$, the second gives $f(1) = 3$, and the third gives $f(3) = 1$. So $(f \\circ f \\circ f)(2) = f(f(f(2))) = 1$."
          - problem: "On $A = \\{1, 2, 3, 4\\}$ the function $f$ sends $1$ to $3$, $2$ to $4$, $3$ to $3$ and $4$ to $2$, and $g$ sends $1$ to $4$, $2$ to $3$, $3$ to $2$ and $4$ to $4$. Find the four values of $f \\circ g$ and give them as $v_1 = (f \\circ g)(1)$, $v_2 = (f \\circ g)(2)$, $v_3 = (f \\circ g)(3)$, $v_4 = (f \\circ g)(4)$."
            answer: "v1 = 2; v2 = 3; v3 = 4; v4 = 2"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "v1"}, {"contract": {"kind": "exact"}, "name": "v2"}, {"contract": {"kind": "exact"}, "name": "v3"}, {"contract": {"kind": "exact"}, "name": "v4"}]}
            solution_sketch: "The full table of $f \\circ g$ is $1 \\mapsto 2$, $2 \\mapsto 3$, $3 \\mapsto 4$, $4 \\mapsto 2$. Step 1 (apply the inner function): $g(1) = 4$, $g(2) = 3$, $g(3) = 2$, $g(4) = 4$. Step 2 (apply the outer function to each image): $f(4) = 2$, $f(3) = 3$, $f(2) = 4$, $f(4) = 2$. This gives v1 = 2; v2 = 3; v3 = 4; v4 = 2."
        constraints: "functions given by tables or arrow diagrams on a 3-4 element set"
      - id: kp3
        name: "Domains and order of composition"
        key_prerequisites: [functions-formal-definition]
        exemplars:
          - problem: "Let $f(x) = \\sqrt{x}$, with domain $[0, \\infty)$, and $g(x) = x - 5$ on $\\mathbb{R}$. Then $(f \\circ g)(x) = \\sqrt{x - 5}$. Give the natural domain of $f \\circ g$ as an inequality in x."
            answer: "x >= 5"
            answer_contract: {"kind": "inequality_union"}
            solution_sketch: "Write the composite first: $(f \\circ g)(x) = \\sqrt{x - 5}$. The outer square root rule requires its input to be nonnegative, so $x - 5 \\ge 0$. Solve the inequality to get $x \\ge 5$. The natural domain of $f \\circ g$ is x >= 5."
          - problem: "For $f(x) = x^2$ and $g(x) = x + 3$, the two composites $f \\circ g$ and $g \\circ f$ need not agree. Compute $(f \\circ g)(2)$ and $(g \\circ f)(2)$, and give the values fg and gf."
            answer: "fg = 25; gf = 7"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "fg"}, {"contract": {"kind": "exact"}, "name": "gf"}]}
            solution_sketch: "Apply the inner function first: $g(2) = 5$, so $f(g(2)) = f(5) = 25$. In the other order, $f(2) = 4$, so $g(f(2)) = g(4) = 7$. The two values differ, so one evaluation shows the composites are not equal. The values are fg = 25; gf = 7."
          - problem: "Let $f(x) = \\sqrt{x}$ with domain $[0, \\infty)$ and $g(x) = 1/(x - 3)$, defined for $x \\ne 3$. The composite is $(f \\circ g)(x) = \\sqrt{1/(x - 3)}$. Give the natural domain of $f \\circ g$ as an inequality in x."
            answer: "x > 3"
            answer_contract: {"kind": "inequality_union"}
            solution_sketch: "Start from the composite object: $(f \\circ g)(x) = \\sqrt{1/(x - 3)}$. The square root needs $1/(x - 3) \\ge 0$, and the fraction is nonnegative exactly when the denominator $x - 3$ is positive. Solve: $x > 3$. The natural domain of $f \\circ g$ is x > 3."
          - problem: "Let $f(x) = \\sqrt{x}$ with domain $[0, \\infty)$ and $g(x) = 4 - x^2$ on $\\mathbb{R}$. Then $(f \\circ g)(x) = \\sqrt{4 - x^2}$. Give the natural domain of $f \\circ g$ as an inequality in x."
            answer: "-2 <= x <= 2"
            answer_contract: {"kind": "inequality_union"}
            solution_sketch: "Form the composite: $(f \\circ g)(x) = \\sqrt{4 - x^2}$. The square root rule requires $4 - x^2 \\ge 0$, that is, $x^2 \\le 4$. Solving this quadratic inequality gives the bounded interval. The natural domain of $f \\circ g$ is -2 <= x <= 2."
          - problem: "Let $f(x) = 1/x$, defined for $x \\ne 0$, and $g(x) = \\sqrt{x}$ with domain $[0, \\infty)$. Here the outer function is $g$, so $(g \\circ f)(x) = \\sqrt{1/x}$. Give the natural domain of $g \\circ f$ as an inequality in x."
            answer: "x > 0"
            answer_contract: {"kind": "inequality_union"}
            solution_sketch: "Write the composite object first: $(g \\circ f)(x) = \\sqrt{1/x}$. The square root needs $1/x \\ge 0$, and $x \\ne 0$ because $f$ is undefined there. The fraction is nonnegative only when $x$ is positive. The natural domain of $g \\circ f$ is x > 0."
          - problem: "Take $f(x) = 2x + 1$ and $g(x) = x^2$. Order matters for composition. Compute $(f \\circ g)(3)$ and $(g \\circ f)(3)$, and give the values fg and gf."
            answer: "fg = 19; gf = 49"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "fg"}, {"contract": {"kind": "exact"}, "name": "gf"}]}
            solution_sketch: "Evaluate the inner function first: $g(3) = 9$, so $f(g(3)) = 2 \\cdot 9 + 1 = 19$. In the reverse order, $f(3) = 7$, so $g(f(3)) = 7^2 = 49$. The two results differ, which confirms $f \\circ g \\ne g \\circ f$ by one evaluation. The values are fg = 19; gf = 49."
        constraints: "track the domain of the composite; show noncommutativity by one evaluation"
    diagnostic_exemplar:
      problem: 'For $f(x) = x + 3$ and $g(x) = x^2$, compute $(g \circ f)(1)$ and $(f \circ g)(1)$.'
      answer_contract: {kind: none}
      answer: '$16$ and $4$.'
      solution_sketch: '$g(f(1)) = g(4) = 16$; $f(g(1)) = f(1) = 4$.'
    anki_seeds:
      - front: 'Is function composition commutative?'
        back: 'No in general: $f \circ g \ne g \circ f$ (e.g. $x^2$ and $x + 1$).'
        type: basic
      - front: 'Natural domain of $g \circ f$?'
        back: 'All $x$ in the domain of $f$ with $f(x)$ in the domain of $g$.'
        type: basic

