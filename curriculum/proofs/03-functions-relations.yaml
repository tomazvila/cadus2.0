    knowledge_points:
      - id: kp1
        name: "The quotient set"
        key_prerequisites: [computing-equivalence-classes]
        step_check:
          step: 'the only multiple of $5$ with absolute value at most $4$ is $0$'
          question: 'Why does $|i - j| \le 4$ force $i - j = 0$ here?'
          options:
            - 'A multiple of $5$ that is smaller than $5$ in size can only be $0$'
            - 'Two numbers from $0$ to $4$ are always equal when $5$ divides both'
            - 'Every difference of two numbers from $0$ to $4$ is a multiple of $5$'
            - 'The classes were assumed different, so $i - j$ cannot be $5$ or more'
          answer: 'A multiple of $5$ that is smaller than $5$ in size can only be $0$'
          why: 'The multiples of $5$ are $0, \pm 5, \pm 10, \dots$, and only $0$ has absolute value below $5$; the assumption $5 \mid (i - j)$ comes from $[i] = [j]$, not from a property of the numbers $0$ to $4$.'
        try_first:
          problem: 'Congruence modulo $3$ splits $\mathbb{Z}$ into classes. Is every integer in one of the classes $[0]$, $[1]$, $[2]$?'
          answer_contract: {"kind": "label", "options": [["yes", "it is", "yes it is"], ["no", "it is not", "no it is not", "not"]]}
          answer: 'yes'
          reveal: 'Yes: division with remainder gives $n = 3q + r$ with $r \in \{0, 1, 2\}$, so $n \in [r]$. The quotient set is the set of these classes, and proving it has $3$ elements needs both coverage and distinctness.'
        exemplars:
          - problem: 'Congruence modulo $6$ is an equivalence relation on $\mathbb{Z}$. How many distinct equivalence classes does it have?'
            answer: '6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Division with remainder writes every integer as $6q + r$ with $0 \le r \le 5$, so every integer lies in one of the classes $[0], [1], \dots, [5]$. Two different remainders between $0$ and $5$ differ by less than $6$, so they are not congruent and their classes are different. There are exactly $6$ classes.'
          - problem: 'For congruence modulo $5$ on $\mathbb{Z}$, is $[17] = [2]$?'
            answer: 'yes'
            answer_contract: {"kind": "label", "options": [["yes", "it is", "yes it is", "they are equal", "the classes are equal", "equal"], ["no", "it is not", "no it is not", "not", "not equal", "they are not equal", "the classes are different"]]}
            solution_sketch: 'Both $17$ and $2$ leave remainder $2$ when divided by $5$, because $17 - 2 = 15$ is a multiple of $5$. So $17 \equiv 2 \pmod 5$ and the two classes are the same set. The answer is yes.'
          - problem: 'Days are numbered $0, 1, 2, \dots$ starting from a Monday. Two day numbers are equivalent when they fall on the same weekday. Which number from $0$ to $6$ is equivalent to day $100$?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Two day numbers fall on the same weekday exactly when they differ by a multiple of $7$. Division with remainder gives $100 = 7 \cdot 14 + 2$, so day $100$ is equivalent to day $2$. The number is $2$.'
          - problem: 'Let $\sim$ be congruence modulo $5$ on $\mathbb{Z}$. Which number $r$ with $0 \le r \le 4$ satisfies $[-17] = [r]$?'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Division with remainder also works for negative integers: $-17 = 5 \cdot (-4) + 3$. So $-17 - 3 = -20$ is a multiple of $5$, which gives $-17 \equiv 3 \pmod 5$ and $[-17] = [3]$. The number is $3$.'
          - problem: 'A music loop repeats every $8$ beats. Beat numbers $1, 2, 3, \dots$ are equivalent when they hit the same position in the loop. How many of the beats numbered $1$ to $100$ are equivalent to beat $3$?'
            answer: '13'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Beat $n$ is equivalent to beat $3$ exactly when $n - 3$ is a multiple of $8$, so $n = 3, 11, 19, \dots$. The largest such $n$ not above $100$ is $99 = 3 + 8 \cdot 12$. The beats are $3 + 8k$ for $k = 0, 1, \dots, 12$, which gives $13$ beats.'
          - problem: 'On $\mathbb{R}$ let $x \sim y$ mean that $x - y$ is an integer. Which element of $[0, 1)$ lies in the equivalence class of $-2.3$?'
            answer: '0.7'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'We need a number $r$ with $0 \le r < 1$ such that $-2.3 - r$ is an integer. Subtract the floor: $r = -2.3 - \lfloor -2.3 \rfloor = -2.3 - (-3) = 0.7$, and then $-2.3 - 0.7 = -3$ is an integer. The element is $0.7$.'
          - problem: 'On the set $\{1, 2, \dots, 20\}$ let $a \sim b$ mean $a \equiv b \pmod 6$. How many elements does the largest equivalence class have?'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The classes are the sets of numbers with a common remainder on division by $6$. Remainders $1$ and $2$ occur $4$ times each (for example $1, 7, 13, 19$), and remainders $3, 4, 5, 0$ occur $3$ times each, which accounts for $4+4+3+3+3+3 = 20$ numbers. The largest class has $4$ elements.'
          - problem: 'Sam claims that $[0], [1], [3], [4]$ are all the equivalence classes of congruence modulo $5$ on $\mathbb{Z}$. Which number $n$ with $0 \le n \le 4$ lies in none of them?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The classes $[0], [1], [3], [4]$ contain exactly the integers with remainder $0, 1, 3, 4$ on division by $5$. The number $2$ has remainder $2$, so it is congruent to none of $0, 1, 3, 4$. Sam left out $[2]$, so the number is $2$.'
          - problem: 'Congruence modulo $4$ splits $\mathbb{Z}$ into classes. Is every integer in one of the classes $[0]$, $[1]$, $[2]$?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "it is", "yes it is", "every integer is"], ["no", "it is not", "no it is not", "not", "not every integer"]]}
            solution_sketch: 'Division by $4$ leaves a remainder from $0$ to $3$, so there are four classes $[0], [1], [2], [3]$. The integer $3$ has remainder $3$, so $3 - 0$, $3 - 1$ and $3 - 2$ are not multiples of $4$, and $3$ is in none of $[0]$, $[1]$, $[2]$. The answer is no.'
          - problem: 'Write the full proof that, for every positive integer $n$, congruence modulo $n$ has exactly $n$ equivalence classes on $\mathbb{Z}$, namely $[0], [1], \dots, [n-1]$. (Here $a \equiv b \pmod n$ means $n \mid (a - b)$.)'
            answer: 'exactly n classes mod n'
            answer_contract: {"kind": "none"}
            solution_sketch: 'Let $n$ be a positive integer and write $a \equiv b$ for $n \mid (a - b)$. We show that every integer lies in one of $[0], \dots, [n-1]$ and that these $n$ classes are pairwise different. Covering: let $m$ be any integer. By division with remainder, $m = qn + r$ for integers $q$ and $r$ with $0 \le r \le n - 1$. Then $m - r = qn$ is a multiple of $n$, so $m \equiv r$ and $m \in [r]$. Moreover $[m] = [r]$: if $x \in [m]$, then $x \equiv m$ and $m \equiv r$ give $x \equiv r$ by transitivity, and if $x \in [r]$, then $x \equiv r$ and $r \equiv m$ (symmetry) give $x \equiv m$. So every class $[m]$ is one of $[0], \dots, [n-1]$. Distinctness: let $i$ and $j$ be integers with $0 \le i, j \le n - 1$ and suppose $[i] = [j]$. By reflexivity $i \in [i]$, so $i \in [j]$, which means $i \equiv j$, that is, $n \mid (i - j)$. From $0 \le i \le n - 1$ and $0 \le j \le n - 1$ we get $-(n-1) \le i - j \le n - 1$, so $|i - j| < n$. The only multiple of $n$ whose absolute value is less than $n$ is $0$, so $i - j = 0$ and $i = j$. Thus two different numbers in $\{0, \dots, n-1\}$ give different classes. By covering, every class equals one of $[0], \dots, [n-1]$, and by distinctness these are $n$ different classes. Therefore congruence modulo $n$ has exactly $n$ equivalence classes. $\square$'
        constraints: "the quotient set of an equivalence relation: count classes, find representatives, and prove that a list of classes is complete and has no repeats; the proof item asks for a full written proof"
      - id: kp2
        name: "a ~ b iff [a] = [b]"
        key_prerequisites: [relations-equivalence]
        step_check:
          step: 'By reflexivity $a \equiv a \pmod 4$, so $a \in [a]$'
          question: 'Why does the element $a$ lie in $[a]$ at all?'
          options:
            - 'Symmetry gives $a \sim b$, and $[a]$ holds every element that equals $a$'
            - 'Reflexivity gives $a \sim a$, and $[a]$ holds every $x$ with $x \sim a$'
            - 'Transitivity gives $a \sim a$ from $a \sim b$ and $b \sim a$, which puts $a$ in $[a]$'
            - 'Every set of the form $[a]$ holds the element $a$ by the definition of a set'
          answer: 'Reflexivity gives $a \sim a$, and $[a]$ holds every $x$ with $x \sim a$'
          why: 'The class $[a]$ is the set of all $x$ with $x \sim a$, so $a \in [a]$ is exactly the statement $a \sim a$, which is reflexivity.'
        exemplars:
          - problem: 'Under congruence modulo $6$ on $\mathbb{Z}$, is $[26] = [8]$?'
            answer: 'yes'
            answer_contract: {"kind": "label", "options": [["yes", "it is", "yes it is", "they are equal", "the classes are equal", "equal"], ["no", "it is not", "no it is not", "not", "not equal", "they are not equal", "the classes are different"]]}
            solution_sketch: 'Two classes are equal exactly when their representatives are equivalent. Here $26 - 8 = 18 = 6 \cdot 3$ is a multiple of $6$, so $26 \equiv 8 \pmod 6$ and $[26] = [8]$. The answer is yes.'
          - problem: 'In congruence modulo $8$ on $\mathbb{Z}$, find the number $r$ with $0 \le r < 8$ such that $[75] = [r]$.'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The classes $[75]$ and $[r]$ are equal exactly when $75 \equiv r \pmod 8$. Division with remainder gives $75 = 8 \cdot 9 + 3$, so $75 - 3 = 72$ is a multiple of $8$. Hence $[75] = [3]$ and $r = 3$.'
          - problem: 'A $24$-hour clock shows an hour $h$ with $0 \le h \le 23$. Two whole numbers of hours give the same clock hour, and so are equivalent, when they differ by a multiple of $24$. A flight leaves at hour $19$ and lasts $31$ hours. At which clock hour does it land?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The flight lands at hour number $19 + 31 = 50$. Since $50 = 24 \cdot 2 + 2$, the number $50$ is equivalent to $2$, so $[50] = [2]$. The flight lands at clock hour $2$.'
          - problem: 'A traffic light repeats a $5$-second cycle. Two seconds are equivalent when they are in the same phase of the cycle, that is, when they differ by a multiple of $5$. Counting second $3$ itself, how many seconds from $1$ to $100$ are equivalent to second $3$?'
            answer: '20'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A second $n$ is equivalent to second $3$ exactly when $n \equiv 3 \pmod 5$, so $n = 3, 8, 13, \dots, 98$. These are the numbers $3 + 5k$ for $k = 0, 1, \dots, 19$. So $20$ of the seconds are equivalent to second $3$.'
          - problem: 'Sam claims that $[5] \neq [17]$ in congruence modulo $12$ because $5 \neq 17$. Is Sam right?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["no", "no Sam is not right", "Sam is not right", "Sam is wrong", "not right"], ["yes", "yes Sam is right", "Sam is right", "right"]]}
            solution_sketch: 'Different representatives can name the same class. Here $17 - 5 = 12$ is a multiple of $12$, so $5 \equiv 17 \pmod{12}$ and $[5] = [17]$. Sam is not right, so the answer is no.'
          - problem: 'In congruence modulo $7$ on $\mathbb{Z}$, find the smallest positive integer $x$ with $[x] = [-20]$.'
            answer: '1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The classes are equal exactly when $x \equiv -20 \pmod 7$. Since $-20 = 7 \cdot (-3) + 1$, the number $-20$ is equivalent to $1$, and $1$ is the smallest positive integer in the class. The number is $1$.'
          - problem: 'Write the full proof that, for an equivalence relation $\sim$ on a set $A$ with $[a] = \{x \in A : x \sim a\}$ for each $a \in A$, we have $a \sim b$ if and only if $[a] = [b]$, for all $a, b \in A$.'
            answer: 'a ~ b iff [a] = [b]'
            answer_contract: {"kind": "none"}
            solution_sketch: 'Let $a, b \in A$. ($\Rightarrow$) Suppose $a \sim b$. First we show $[a] \subseteq [b]$. Let $x \in [a]$, so $x \sim a$. Since $x \sim a$ and $a \sim b$, transitivity gives $x \sim b$, so $x \in [b]$. For the reverse inclusion, symmetry turns $a \sim b$ into $b \sim a$. Let $y \in [b]$, so $y \sim b$. Since $y \sim b$ and $b \sim a$, transitivity gives $y \sim a$, so $y \in [a]$. Hence $[b] \subseteq [a]$, and the two inclusions give $[a] = [b]$. ($\Leftarrow$) Suppose $[a] = [b]$. By reflexivity $a \sim a$, so $a \in [a]$. Because $[a] = [b]$, the element $a$ also lies in $[b]$, and by the definition of $[b]$ this means $a \sim b$. Both directions are proved, so $a \sim b$ if and only if $[a] = [b]$. $\square$'
        constraints: "relate equivalence of elements to equality of classes with congruence computations; the proof item asks for the general biconditional"
      - id: kp3
        name: "Classes partition the set"
        key_prerequisites: [set-operations]
        step_check:
          step: 'Suppose $x\in[a]\cap[b]$'
          question: 'What does a common element $x$ of $[a]$ and $[b]$ show?'
          options:
            - 'It shows $a = b$, since two classes can share only equal elements'
            - 'It shows $[a]$ and $[b]$ are different classes that overlap in $x$'
            - 'It gives $a \sim x$ and $x \sim b$, so $a \sim b$ and $[a] = [b]$'
            - 'It shows that $x$ is the only element the two classes share'
          answer: 'It gives $a \sim x$ and $x \sim b$, so $a \sim b$ and $[a] = [b]$'
          why: 'From $x \sim a$ and $x \sim b$, symmetry and transitivity give $a \sim b$; so two classes with a common element are the same class, and different classes never overlap.'
        exemplars:
          - problem: 'Let $A = \{1, 2, \dots, 10\}$ and let $a \sim b$ mean $a \equiv b \pmod 4$. How many blocks does the partition of $A$ into equivalence classes have?'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The classes are the sets of numbers in $A$ with a common remainder on division by $4$. The remainders $1, 2, 3, 0$ all occur in $A$, for example in $\{1, 5, 9\}$, $\{2, 6, 10\}$, $\{3, 7\}$ and $\{4, 8\}$. The partition has $4$ blocks.'
          - problem: 'A class of $30$ students is split into five groups, and two students are related when they are in the same group. Four of the groups have $4$, $6$, $7$ and $5$ students. How many students are in the fifth group?'
            answer: '8'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The groups are the equivalence classes, and they form a partition: every student is in exactly one group. So the five group sizes add up to $30$. The four known groups have $4 + 6 + 7 + 5 = 22$ students, so the fifth group has $30 - 22 = 8$ students.'
          - problem: 'The sets $\{1,2\}$, $\{3\}$ and $\{4,5,6\}$ form a partition of $\{1, 2, \dots, 6\}$. Let $a \sim b$ mean that $a$ and $b$ lie in the same block. How many ordered pairs $(a, b)$ satisfy $a \sim b$?'
            answer: '14'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A block with $k$ elements gives $k \cdot k$ ordered pairs $(a, b)$ with both entries in that block. The blocks have $2$, $1$ and $3$ elements, so the number of pairs is $4 + 1 + 9 = 14$. Pairs with entries in different blocks are not related.'
          - problem: 'The sets $B_1 = \{1, 2, 3\}$, $B_2 = \{3, 4\}$ and $B_3 = \{5, 6\}$ cover $\{1, 2, \dots, 6\}$. Which element lies in two of the blocks, so that the three sets are not a partition?'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'In a partition any two different blocks are disjoint. The blocks $B_1$ and $B_2$ share the element $3$, so $B_1 \cap B_2 \neq \varnothing$. The element is $3$.'
          - problem: 'Let $R$ be the relation on $\{1, 2, 3, 4, 5\}$ defined by $a \mathrel{R} b$ if and only if $|a - b| \le 1$. Is $R$ an equivalence relation?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["no", "it is not", "no it is not", "not an equivalence relation", "it is not an equivalence relation", "not transitive"], ["yes", "it is", "yes it is", "it is an equivalence relation"]]}
            solution_sketch: 'The relation $R$ is reflexive and symmetric, but it is not transitive: $1 \mathrel{R} 2$ and $2 \mathrel{R} 3$, while $|1 - 3| = 2$ gives $1 \not\mathrel{R} 3$. Equivalently, the numbers related to $1$ form $\{1, 2\}$ and the numbers related to $3$ form $\{2, 3, 4\}$; these sets share $2$ without being equal, which no two equivalence classes can do. The answer is no.'
          - problem: 'Twenty players are split into teams of $4$, and two players are related when they are on the same team. How many equivalence classes does this relation have?'
            answer: '5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The teams are the equivalence classes, and every player is on exactly one team, so the teams partition the $20$ players. Each class has $4$ players, so the number of classes is $20 \div 4 = 5$.'
          - problem: 'Do the sets $\{1, 2\}$, $\{3, 4\}$ and $\{5, 6\}$ form a partition of $\{1, 2, \dots, 6\}$?'
            answer: 'yes'
            answer_contract: {"kind": "label", "options": [["yes", "it is", "yes it is", "they form a partition", "a partition"], ["no", "it is not", "no it is not", "not", "they do not form a partition", "not a partition"]]}
            solution_sketch: 'A partition needs nonempty blocks that are pairwise disjoint and cover the set. The three sets are nonempty and share no element, and together they contain $1, 2, 3, 4, 5, 6$. All conditions hold, so the answer is yes.'
          - problem: 'Write the full proof that, if $\sim$ is an equivalence relation on a nonempty set $A$, then the equivalence classes $[a] = \{x \in A : x \sim a\}$ form a partition of $A$: every class is nonempty, every element of $A$ lies in some class, and any two classes are either equal or disjoint.'
            answer: 'classes of ~ partition A'
            answer_contract: {"kind": "none"}
            solution_sketch: 'Let $\sim$ be an equivalence relation on $A$. Nonempty and covering: let $a \in A$. By reflexivity $a \sim a$, so $a \in [a]$. Hence every class $[a]$ is nonempty, and every element $a$ of $A$ lies in at least one class, so the union of the classes is $A$. Equal or disjoint: let $a, b \in A$ and suppose $[a] \cap [b] \neq \varnothing$. We prove $[a] = [b]$, which shows that two classes that are not equal are disjoint. Pick $x \in [a] \cap [b]$, so $x \sim a$ and $x \sim b$. By symmetry $a \sim x$, and then $a \sim x$ and $x \sim b$ give $a \sim b$ by transitivity. Now let $y \in [a]$, so $y \sim a$. Since $y \sim a$ and $a \sim b$, transitivity gives $y \sim b$, so $y \in [b]$ and $[a] \subseteq [b]$. By symmetry $b \sim a$, and the same argument with the roles of $a$ and $b$ exchanged gives $[b] \subseteq [a]$. Therefore $[a] = [b]$. So the classes are nonempty, they cover $A$, and any two of them are equal or disjoint: they form a partition of $A$. $\square$'
        constraints: "classes of an equivalence relation form a partition: count blocks, use covering and disjointness, and decide whether a relation or family is an equivalence relation or a partition; the proof item asks for the partition theorem"
    diagnostic_exemplar:
      problem: 'Let $\sim$ be an equivalence relation on a set $A$. Prove that $[a] = [b]$ if and only if $a \sim b$, and deduce that two distinct equivalence classes are disjoint.'
      answer: '($\Leftarrow$) Suppose $a \sim b$. For $x \in [a]$ we have $x \sim a$ and $a \sim b$, so $x \sim b$ by transitivity, giving $[a] \subseteq [b]$; using $b \sim a$ (symmetry) the same argument gives $[b] \subseteq [a]$, so $[a] = [b]$. ($\Rightarrow$) If $[a] = [b]$, then $a \in [a]$ by reflexivity, so $a \in [b]$, i.e. $a \sim b$. Deduction: if $[a] \cap [b] \ne \varnothing$, pick $x$ in both; then $x \sim a$ and $x \sim b$, so $a \sim x$ and $x \sim b$ give $a \sim b$, hence $[a] = [b]$. Contrapositively, distinct classes have empty intersection — so the classes partition $A$.'
      solution_sketch: 'Use all three properties: transitivity for the inclusions, reflexivity for the converse, symmetry plus transitivity to turn a shared element into $a \sim b$.'
    anki_seeds:
      - front: 'Equivalence class $[a]$ of an element $a$?'
        back: '$[a] = \{x : x \sim a\}$, the set of all elements equivalent to $a$.'
        type: basic
      - front: 'Fundamental correspondence between equivalence relations and partitions?'
        back: 'The equivalence classes of a relation on $A$ form a partition of $A$; conversely every partition arises from a unique equivalence relation.'
        type: basic

