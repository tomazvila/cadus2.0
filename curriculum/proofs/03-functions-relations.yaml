      - id: kp3
        name: "Full verdicts"
        key_prerequisites: [relations-properties]
        exemplars:
          - problem: "On the set of all integers, define $a \\sim b$ to mean that $a - b$ is a multiple of $5$. Test the reflexive, symmetric and transitive properties, giving a reason for each, then determine whether this relation is an equivalence relation, and give the number of equivalence classes it has."
            answer: "verdict = yes; classes = 5"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["yes"], ["no"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "classes"}]}
            solution_sketch: "Work with the relation on the integers defined by $a - b$ being a multiple of $5$; the method of this KP, testing each property and then issuing the verdict, is applied in the three tests below. Reflexivity test: $a - a = 0$ is a multiple of $5$, so the reflexive property holds. Symmetry test: if $a - b$ is a multiple of $5$ then $b - a = -(a-b)$ is too, so the symmetric property holds. Transitivity test: the sum of two multiples of $5$ is a multiple of $5$, so $a - c$ is a multiple of $5$ whenever $a - b$ and $b - c$ are, and the transitive property holds. The wrong verdict no would come from doubting that $0$ counts as a multiple of $5$. Counting the residue classes $0, 1, 2, 3, 4$ modulo $5$ gives $5$ classes. The result is verdict = yes; classes = 5."
          - problem: "On the set of all integers, define $a \\sim b$ to mean $a < b$. Test the reflexive, symmetric and transitive properties, giving a reason for each, then determine whether this relation is an equivalence relation, and give the number of the three properties that fail."
            answer: "verdict = no; fails = 2"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["yes"], ["no"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "fails"}]}
            solution_sketch: "Work with the relation $a \\sim b$ meaning $a < b$ on the integers; the method of this KP, testing each property and then issuing the verdict, is applied in the three tests below. Reflexivity test: $a < a$ is false for every integer $a$, so the reflexive property fails. Symmetry test: $2 < 5$ holds while $5 < 2$ does not, so the symmetric property fails. Transitivity test: $a < b$ and $b < c$ always imply $a < c$, so the transitive property holds. The wrong verdict yes comes from overlooking that no integer is less than itself. Counting the failed properties gives reflexivity and symmetry, that is $2$ failures. The result is verdict = no; fails = 2."
          - problem: "On the set $\\{1, 2, 3, 4\\}$, define $a \\sim b$ to mean that $a$ divides $b$. Test the reflexive, symmetric and transitive properties, giving a reason for each, then determine whether this relation is an equivalence relation, and give the number of pairs $(a, b)$ from the set with $a \\sim b$ but not $b \\sim a$."
            answer: "verdict = no; asym = 4"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["yes"], ["no"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "asym"}]}
            solution_sketch: "Work with the divides relation on the set $\\{1, 2, 3, 4\\}$; the method of this KP, testing each property and then issuing the verdict, is applied in the three tests below. Reflexivity test: each of $1, 2, 3, 4$ divides itself, so the reflexive property holds. Symmetry test: $2$ divides $4$ but $4$ does not divide $2$, so the symmetric property fails. Transitivity test: if $a$ divides $b$ and $b$ divides $c$ then $a$ divides $c$, so the transitive property holds. The wrong verdict yes treats divisibility as if it were mutual. Counting the one-way pairs gives $(1,2)$, $(1,3)$, $(1,4)$ and $(2,4)$, that is $4$ pairs. The result is verdict = no; asym = 4."
          - problem: "On the set of all integers, define $a \\sim b$ to mean that $a + b$ is odd. Test the reflexive, symmetric and transitive properties, giving a reason for each, then determine whether this relation is an equivalence relation, and give the number of elements of $\\{0, 1, 2\\}$ that are related to themselves."
            answer: "verdict = no; self = 0"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["yes"], ["no"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "self"}]}
            solution_sketch: "Work with the relation $a \\sim b$ meaning $a + b$ is odd on the integers; the method of this KP, testing each property and then issuing the verdict, is applied in the three tests below. Reflexivity test: $a + a = 2a$ is even for every integer, so the reflexive property fails. Symmetry test: $a + b = b + a$, so an odd sum stays odd when the pair is reversed, and the symmetric property holds. Transitivity test: $0 + 1$ and $1 + 2$ are odd but $0 + 2 = 2$ is even, so the transitive property fails. The wrong verdict yes forgets that doubling an integer never gives an odd number. No element of $\\{0, 1, 2\\}$ is related to itself, so the count of self-related elements is $0$. The result is verdict = no; self = 0."
          - problem: "A relation $R$ on the set $\\{1, 2, 3, 4\\}$ consists of the pairs $(1,1)$, $(2,2)$, $(3,3)$, $(4,4)$, $(1,2)$, $(1,3)$, $(1,4)$, $(2,3)$ and $(3,4)$. Test the reflexive, symmetric and transitive properties of $R$, giving a reason for each, then give the number of the first property that fails, using $1$ = reflexive, $2$ = symmetric, $3$ = transitive and $0$ = no failure, and give the number of listed pairs whose reverse is not listed."
            answer: "first = 2; missing = 5"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "first"}, {"contract": {"kind": "exact"}, "name": "missing"}]}
            solution_sketch: "Work with the relation $R$ made of the pairs $(1,1)$, $(2,2)$, $(3,3)$, $(4,4)$, $(1,2)$, $(1,3)$, $(1,4)$, $(2,3)$ and $(3,4)$ on $\\{1, 2, 3, 4\\}$; the method of this KP, testing each property in order, is applied in the three tests below. Reflexivity test: all four self-pairs are present, so the reflexive property holds. Symmetry test: $(1,2)$ is present but $(2,1)$ is not, so the symmetric property fails. Transitivity test: $(2,3)$ and $(3,4)$ are present but $(2,4)$ is not, so the transitive property fails. The first failing property is the symmetric one, coded $2$, and the pairs without a listed reverse are $(1,2)$, $(1,3)$, $(1,4)$, $(2,3)$ and $(3,4)$, that is $5$ pairs. The result is first = 2; missing = 5."
          - problem: "A relation $R$ on the set $\\{1, 2, 3\\}$ consists of all nine pairs $(a, b)$ with $a$ and $b$ in the set. Test the reflexive, symmetric and transitive properties of $R$, giving a reason for each, then give the number of the three properties that hold and the total number of pairs in $R$."
            answer: "holds = 3; pairs = 9"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "holds"}, {"contract": {"kind": "exact"}, "name": "pairs"}]}
            solution_sketch: "Work with the universal relation $R$ containing all nine pairs on the set $\\{1, 2, 3\\}$; the method of this KP, testing each property in order, is applied in the three tests below. Reflexivity test: $(1,1)$, $(2,2)$ and $(3,3)$ are all in $R$, so the reflexive property holds. Symmetry test: whenever $(a,b)$ is in $R$ so is $(b,a)$, since every pair is in $R$, so the symmetric property holds. Transitivity test: $(a,b)$ and $(b,c)$ in $R$ force $(a,c)$ in $R$, since every pair is in $R$, so the transitive property holds. All three properties hold, so the count of holding properties is $3$, and the relation contains $3 \\times 3 = 9$ pairs in total. The result is holds = 3; pairs = 9."
        constraints: "deliver a verdict with a reason for each property; one positive and one negative case"
