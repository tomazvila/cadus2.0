            solution_sketch: "Nonzero integers may have negative multipliers; the pair -1,-1 prevents antisymmetry. Positivity permits cancellation and forces the integer factors of 1 to be 1; multiplication supplies transitivity. Divisibility of arbitrary integers does not exclude a=b=0, so the cancellation premise fails. The first unsupported assertions are 3, 0, 2."
          - problem: "Audit each proposed proof independently. Argument A: On all integers, use divisibility. Step 1: a=a*1 proves reflexivity. Step 2: if b=am and a=bn, then a is nonzero, so mn=1. Step 3: therefore m=n=1, proving antisymmetry. Argument B: On the nonzero integers, use divisibility. Step 1: a=a*1 proves reflexivity. Step 2: b=am and a=bn give mn=1 by nonzero cancellation. Step 3: integer factors of 1 satisfy m=n=1, so a=b and antisymmetry holds. Argument C: On the positive integers, let a precede b when a divides b. Step 1: a=a*1 proves reflexivity. Step 2: if b=am and a=bn with positive integers m,n, then mn=1, so m=n=1 and a=b, proving antisymmetry. Step 3: b=am and c=bn give c=a(mn), proving transitivity. Give the first numbered assertion in each argument that fails to follow from its data and preceding justified assertions. Use 0 if every assertion follows; return the numbers in argument order."
            answer: "2, 3, 0"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "Divisibility of arbitrary integers does not exclude a=b=0, so the cancellation premise fails. Nonzero integers may have negative multipliers; the pair -1,-1 prevents antisymmetry. Positivity permits cancellation and forces the integer factors of 1 to be 1; multiplication supplies transitivity. The first unsupported assertions are 2, 3, 0."
          - problem: "Write the full proof: the componentwise order on pairs of nonnegative integers, defined by (a, b) precedes (c, d) exactly when a ≤ c and b ≤ d, is a partial order. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1 (reflexive): for any pair (a, b) we have a ≤ a and b ≤ b, so (a, b) precedes (a, b). Step 2 (antisymmetric): suppose (a, b) precedes (c, d) and (c, d) precedes (a, b). Then a ≤ c and c ≤ a, so a = c by antisymmetry of the usual order on the numbers; likewise b ≤ d and d ≤ b give b = d. Hence (a, b) = (c, d), which is the antisymmetry of the relation. Step 3 (transitive): suppose (a, b) precedes (c, d) and (c, d) precedes (e, f). Then a ≤ c and c ≤ e, so a ≤ e by transitivity of the usual order, and b ≤ d and d ≤ f give b ≤ f. Hence (a, b) precedes (e, f). Step 4 (conclusion): all three axioms hold, so the componentwise order is a partial order on the pairs of nonnegative integers. This completes the proof."
        constraints: "confirm all three axioms, noting positivity for antisymmetry Closed exemplars may audit general proofs of this method; do not certify proposed inferences in the problem."
      - id: kp3
        name: "Total vs. partial; comparability"
        key_prerequisites: [quantifiers]
        exemplars:
          - problem: "On the set {2, 3, 6, 12, 18}, say that one element precedes another when it divides it. Test comparability in both directions for every unordered pair of distinct elements. How many of the ten pairs are incomparable?"
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Full object: the set {2, 3, 6, 12, 18} with divisibility, which has ten unordered pairs of distinct elements. Step 1, direct test of each pair in both directions: 2 divides 6, 12 and 18, 3 divides 6, 12 and 18, and 6 divides 12 and 18, so eight pairs are comparable. Step 2, the pair 2 with 3 and the pair 12 with 18 fail the test in both directions. The answer is 2."
          - problem: "On the grid {0, 1, 2} x {0, 1}, say that a pair (a, b) precedes (c, d) when a is at most c and b is at most d. Test comparability in both directions for every unordered pair of distinct elements. How many of the fifteen pairs are incomparable?"
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Full object: the grid {0, 1, 2} x {0, 1} with the product order, six elements and fifteen unordered pairs of distinct elements. Step 1, direct test: the pairs (0,1) with (1,0), (0,1) with (2,0), and (1,1) with (2,0) would need the second coordinate to decrease, so neither direction holds. Step 2, every other pair has both coordinates running the same way and is comparable. The answer is 3."
          - problem: "On the power set of {1, 2, 3}, order subsets by containment. The power set has eight subsets and twenty-eight unordered pairs of distinct subsets. Test containment in both directions for each pair. How many of the pairs are incomparable?"
            answer: "9"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Full object: the power set of {1, 2, 3}, eight subsets and twenty-eight unordered pairs of distinct subsets, ordered by containment. Step 1, the empty set and the full set are comparable with every subset, so only the six middle subsets can fail. Step 2, count the failing pairs: three pairs of one-element subsets, three pairs of two-element subsets, and three mixed pairs such as {1} with {2, 3}. The answer is 9."
          - problem: "A student claims that for every positive integer n, the number n and the number n plus 4 are comparable under divisibility. Test the claim at the first few values of n, checking divisibility in both directions. Give the smallest n for which the claim fails."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Full object: the claim that n and n plus 4 are comparable under divisibility, tested for each positive integer n. Step 1, direct test at n = 1: 1 divides 5, so the pair is comparable. Step 2, direct test at n = 2: 2 divides 6, so the pair is comparable again. Step 3, direct test at n = 3: 3 does not divide 7 and 7 does not divide 3, so the claim fails. The answer is 3."
          - problem: "Take the positive divisors of 24, namely 1, 2, 3, 4, 6, 8, 12 and 24, with the divisibility relation. Test each unordered pair of distinct divisors in both directions. How many of the twenty-eight pairs are incomparable?"
            answer: "6"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Full object: the set of divisors of 24, eight elements with divisibility and twenty-eight unordered pairs of distinct elements. Step 1, direct test of the pairs where one member divides the other, including every pair that contains 1 and every pair that contains 24: twenty-two pairs are comparable. Step 2, the six remaining pairs, for example 2 with 3 and 8 with 12, fail the test in both directions. The answer is 6."
          - problem: "On the set {1, 2, 4, 8, 16}, say that one element precedes another when it divides it. Test comparability in both directions for every unordered pair of distinct elements. How many of the ten pairs are incomparable?"
            answer: "0"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Full object: the set {1, 2, 4, 8, 16} with divisibility and ten unordered pairs of distinct elements. Step 1, direct test of each pair: every element is a power of 2 that divides each larger element, so the relation lines the five elements up in one chain. Step 2, all ten pairs are comparable, so this order is total. The answer is 0."
          - problem: "Write the full proof: divisibility on the positive integers is not a total order. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Definition: a total order needs every two elements x and y to satisfy x precedes y or y precedes x, which is comparability of all pairs. Strategy: one incomparable pair is enough to refute totality. Step 1: take the positive integers 2 and 3. Step 2: 2 does not divide 3, so 2 does not precede 3. Step 3: 3 does not divide 2, so 3 does not precede 2. Step 4: neither direction holds, so 2 and 3 are incomparable. Conclusion: one incomparable pair breaks the requirement that all pairs be comparable, so divisibility on the positive integers is a partial order and not a total order."
        constraints: "test comparability of all pairs to decide totality"
    diagnostic_exemplar:
      problem: 'Prove that $\subseteq$ is a partial order on $\mathcal{P}(\{1,2,3\})$, and decide whether it is a total order.'
      answer: 'Reflexive: $X \subseteq X$ for every set $X$. Antisymmetric: if $X \subseteq Y$ and $Y \subseteq X$ then $X = Y$, by double inclusion. Transitive: if $X \subseteq Y$ and $Y \subseteq Z$, then $x \in X$ gives $x \in Y$ and hence $x \in Z$, so $X \subseteq Z$. So $\subseteq$ is a partial order. It is not total: $\{1\}$ and $\{2\}$ are incomparable, since neither is contained in the other.'
      solution_sketch: 'Check the three axioms for $\subseteq$, then exhibit two incomparable subsets to rule out totality.'
    anki_seeds:
      - front: 'A partial order is a relation that is...'
        back: 'reflexive, antisymmetric, and transitive.'
        type: basic
      - front: 'Difference between a partial order and a total (linear) order?'
        back: 'In a total order every two elements are comparable; a partial order may have incomparable elements.'
        type: basic

  - id: hasse-diagrams
    name: "Hasse Diagrams"
    core: true
    difficulty: 0.64
    drill: false
    answer_kind: numeric
    expected_time_secs: 160
    prerequisites:
      - id: partial-orders
        weight: 0.6
        key: true
      - id: relations-digraphs-matrices
        weight: 0.2
    knowledge_points:
      - id: kp1
        name: "Drawing Hasse diagrams"
        key_prerequisites: [partial-orders]
        exemplars:
          - problem: "For the divisors of 20 ordered by divisibility, find the number of covering edges in its Hasse diagram."
            answer: "7"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The divisors of 20 are 1, 2, 4, 5, 10, 20. By the covering rule an edge joins a to b when a divides b and no divisor of 20 lies strictly between them, which gives 1-2, 1-5, 2-4, 2-10, 4-20, 5-10 and 10-20. Counting these edges gives 7."
          - problem: "For the power set of {a, b, c} ordered by subset inclusion, find the number of covering edges in its Hasse diagram."
            answer: "12"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The power set has the eight sets empty, {a}, {b}, {c}, {a,b}, {a,c}, {b,c}, {a,b,c}. By the covering rule an edge joins two sets when one is contained in the other and adds exactly one element, so 3 edges leave the empty set, 6 edges leave the singletons and 3 edges leave the pairs. The total 3 + 6 + 3 is 12."
          - problem: "For the divisors of 28 ordered by divisibility, find the set of elements that cover the element 1."
            answer: "{2, 7}"
            answer_contract: {"kind": "set"}
            solution_sketch: "The divisors of 28 are 1, 2, 4, 7, 14, 28. By the covering rule an element b covers 1 when 1 divides b and no divisor of 28 lies strictly between 1 and b, and only 2 and 7 divide 28 with no divisor of 28 between them and 1. The covering set is {2, 7}."
          - problem: "In the divisibility poset on the divisors of 30, determine how many elements cover 1."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The divisors of 30 are 1, 2, 3, 5, 6, 10, 15, 30. By the covering rule an element covers 1 when 1 divides it and no divisor of 30 lies strictly between 1 and it, and the divisors with that property are exactly the primes 2, 3 and 5. So the number of such elements is 3."
          - problem: "For the divisors of 16 ordered by divisibility, find the number of covering edges in its Hasse diagram."
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The divisors of 16 are 1, 2, 4, 8, 16, and every earlier element divides the next one, so the diagram is a single vertical chain. By the covering rule the edges join consecutive elements, namely 1-2, 2-4, 4-8 and 8-16, because nothing lies between consecutive ones. The number of covering edges is 4."
          - problem: "In the divisibility poset on the divisors of 24, find the set of elements that cover 4."
            answer: "{8, 12}"
            answer_contract: {"kind": "set"}
            solution_sketch: "The divisors of 24 are 1, 2, 3, 4, 6, 8, 12, 24. By the covering rule an element covers 4 when 4 divides it and no divisor of 24 lies strictly between 4 and it, and among the multiples of 4 above 4 only 8 and 12 have that property, since 4 divides 12 and 12 divides 24. The covering set is {8, 12}."
        constraints: "posets with at most 8 elements: divisor lattices or small power sets"
      - id: kp2
        name: "Reading a Hasse diagram"
        key_prerequisites: [partial-orders]
        exemplars:
          - problem: "A poset has as its elements the divisors of 12, ordered by divisibility. Its Hasse diagram has the covering edges 1-2, 1-3, 2-4, 2-6, 3-6, 4-12, 6-12, and x <= y holds exactly when there is an upward path from x to y. How many elements x of this poset satisfy x <= 6?"
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Walk the upward-path rule downward from 6: the edges into 6 come from 2 and 3, and the edges into 2 and 3 come from 1. So x <= 6 holds exactly for x in {1, 2, 3, 6}, while 4 and 12 have no path to 6. The count of such elements is 4."
          - problem: "In the poset of the divisors of 12 under divisibility, the Hasse diagram has covering edges 1-2, 1-3, 2-4, 2-6, 3-6, 4-12, 6-12; an element covers another exactly when a covering edge runs upward between them. Which elements cover 2? Give the answer as a set in curly braces."
            answer: "{4, 6}"
            answer_contract: {"kind": "set"}
            solution_sketch: "An element covers 2 exactly when a covering edge leads upward from 2 in the diagram. The edges out of 2 go to 4 and to 6; 12 does not cover 2 since the path 2-4-12 has 4 strictly between. The elements covering 2 are {4, 6}."
          - problem: "A poset has as its elements the 8 subsets of {1, 2, 3}, ordered by inclusion, so A <= B holds when A is a subset of B. Two elements are joined by a covering edge of the Hasse diagram exactly when one is obtained from the other by adding a single element. How many covering edges does the Hasse diagram of this poset have?"
            answer: "12"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Count covering edges by size gap, since an edge joins subsets differing by one element. From size 0 to size 1 there are 3 edges; from size 1 to size 2 each of the 3 singletons gains 2 elements, giving 6 edges; from size 2 to size 3 there are 3 edges. The total number of covering edges is 12."
          - problem: "A poset has as its elements the divisors of 18, ordered by divisibility. Its Hasse diagram has the covering edges 1-2, 1-3, 2-6, 3-6, 3-9, 6-18, 9-18, and x <= y holds exactly when there is an upward path from x to y. How many elements x of this poset satisfy 9 <= x?"
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Follow the upward paths that start at 9: the only edge out of 9 is 9-18, and 18 is a top element with no edge out. So 9 <= x holds for x = 9 and for x = 18, and no other element lies above 9. The number of such elements is 2."
          - problem: "A poset has as its elements the divisors of 20, ordered by divisibility. Its Hasse diagram has the covering edges 1-2, 1-5, 2-4, 2-10, 4-20, 5-10, 10-20, and x <= y holds exactly when there is an upward path from x to y. Determine whether 2 <= 20, and give the number of upward paths from 2 to 20 along covering edges."
            answer: "verdict = comparable; paths = 2"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["comparable"], ["incomparable"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "paths"}]}
            solution_sketch: "From 2 the covering edges go up to 4 and to 10, and both 4 and 10 have a covering edge to 20, so an upward path from 2 to 20 exists. The paths are 2-4-20 and 2-10-20, and there are no others since 4 and 10 have no further upward edges except to 20. The verdict incomparable is wrong because such a path does exist. The answer is verdict = comparable; paths = 2."
          - problem: "A poset has as its elements the divisors of 30, ordered by divisibility. Its Hasse diagram has the covering edges 1-2, 1-3, 1-5, 2-6, 2-10, 3-6, 3-15, 5-10, 5-15, 6-30, 10-30, 15-30; an element is covered by another exactly when a covering edge runs upward from it. How many elements of this poset are covered by exactly two elements?"
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Count the downward covering edges at each element of the diagram. The elements 6, 10 and 15 each have exactly two incoming edges, from the pairs 2 and 3, 2 and 5, and 3 and 5 respectively; the atoms 2, 3, 5 have one, and 30 has three. The elements covered by exactly two elements are 6, 10 and 15, so the count of elements covered by exactly two elements is 3."
        constraints: "recover order relations and covers from upward paths"
      - id: kp3
        name: "Chains and comparability"
        key_prerequisites: [partial-orders]
        exemplars:
          - problem: "The divisors of 20 are ordered by divisibility. Find the number of elements in a longest chain."
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The poset is the divisors of 20: 1, 2, 4, 5, 10, 20. Rule: each cover multiplies by one prime, so a longest chain uses every prime factor with multiplicity. The factorization 20 = 2^2 * 5 has three prime factors counted with multiplicity, so a longest chain has 3 + 1 = 4 elements, for example 1, 2, 4, 20. The answer is 4."
          - problem: "In the power set of {a, b, c} ordered by inclusion, how many unordered pairs of elements are incomparable?"
            answer: "9"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The poset has 8 subsets. Rule: two subsets are comparable exactly when one is contained in the other. Count total unordered pairs: 8*7/2 = 28. Count comparable proper pairs: for each of the 3 letters it is in the smaller only, in both, or in the larger only, giving 3^3 = 27 ordered pairs A subset B; subtract the 8 diagonal pairs A = B to get 19 comparable unordered pairs. Then 28 - 19 = 9. The answer is 9."
          - problem: "For the divisors of 24 under divisibility, find the number of elements in a longest chain."
            answer: "5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The divisors of 24 are 1, 2, 3, 4, 6, 8, 12, 24. Rule: a chain can add at most one prime factor at each cover, and 24 = 2^3 * 3 has four prime factors with multiplicity. A longest chain uses all four factors, so it has 4 + 1 = 5 elements, for example 1, 2, 4, 8, 24. The answer is 5."
          - problem: "The divisors of 12 are ordered by divisibility. How many unordered pairs of divisors are incomparable?"
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The poset is the divisors of 12: 1, 2, 3, 4, 6, 12. Rule: two divisors are incomparable when neither divides the other. Checking the unordered pairs gives (2,3), (3,4), and (4,6); no other pair is incomparable. The answer is 3."
          - problem: "In the power set of {a, b, c, d} ordered by inclusion, how many unordered pairs of subsets are incomparable?"
            answer: "55"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The poset is the Boolean lattice with 16 subsets. Rule: count all unordered pairs and subtract the comparable ones. Total unordered pairs: 16*15/2 = 120. For comparable proper pairs A subset B, each of the 4 letters is in A only, in both, or in B only, giving 3^4 = 81 ordered pairs A subset B including A = B; subtract the 16 diagonal pairs to get 65 comparable unordered pairs. Then 120 - 65 = 55. The answer is 55."
          - problem: "Consider the poset on {a, b, c, d, e, f, g} with cover relations a<b, b<c, c<d, d<e, e<f, a<g, g<f. Find the number of elements in a longest chain."
            answer: "6"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The poset has the chain a<b<c<d<e<f, which uses six elements. Rule: a chain follows cover relations upward, and no chain can exceed the number of elements on a longest directed path. The path a<g<f uses only three elements, so the longest chain is a<b<c<d<e<f with six elements. The answer is 6."
        constraints: "identify chains and incomparable pairs in the drawn poset"
    diagnostic_exemplar:
      problem: 'For the divisors of $18$ ordered by divisibility, list the covering edges of the Hasse diagram, give a longest chain, and name an incomparable pair.'
      answer_contract: {kind: none}
      answer: 'The divisors are $1, 2, 3, 6, 9, 18$. Covering edges (steps with nothing strictly between): $1\!-\!2$, $1\!-\!3$, $2\!-\!6$, $3\!-\!6$, $3\!-\!9$, $6\!-\!18$, $9\!-\!18$. A longest chain has four elements, for example $1 \mid 3 \mid 9 \mid 18$ (also $1 \mid 2 \mid 6 \mid 18$ or $1 \mid 3 \mid 6 \mid 18$). An incomparable pair: $2$ and $3$, since neither divides the other ($2$ and $9$ also work).'
      solution_sketch: 'Draw only the covering relations, omitting edges implied by transitivity, then read a longest chain and an incomparable pair off the diagram.'
    anki_seeds:
      - front: 'Which edges does a Hasse diagram draw?'
        back: 'Only covering relations — loops and transitively-implied edges are omitted; smaller elements sit lower.'
        type: basic
      - front: '"$b$ covers $a$" in a poset means...'
        back: '$a \prec b$ with no element strictly between.'
        type: basic

