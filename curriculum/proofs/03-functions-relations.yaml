    diagnostic_exemplar:
      problem: 'Prove that $f : [0, \infty) \to \mathbb{R}$, $f(x) = x^2 + 3$, is injective, and explain why the same rule on $\mathbb{R}$ is not.'
      answer: 'Suppose $f(a) = f(b)$ with $a, b \ge 0$. Then $a^2 + 3 = b^2 + 3$, so $a^2 = b^2$ and $(a-b)(a+b) = 0$. Either $a = b$, or $a + b = 0$ which with $a, b \ge 0$ forces $a = b = 0$; in both cases $a = b$, so $f$ is injective. On $\mathbb{R}$ the same rule is not injective: $f(-1) = 4 = f(1)$ while $-1 \ne 1$. The domain, not the formula, decides.'
      solution_sketch: 'Assume equal outputs, factor $a^2 - b^2$, and use nonnegativity to kill the $a + b$ branch; then give the counterexample the larger domain allows.'
    anki_seeds:
      - front: 'Contrapositive form of injectivity?'
        back: '$a \ne b \Rightarrow f(a) \ne f(b)$ — distinct inputs give distinct outputs.'
        type: basic
      - front: 'Why are strictly increasing functions injective?'
        back: '$a < b \Rightarrow f(a) < f(b)$, so distinct inputs give distinct outputs.'
        type: basic

  - id: proving-surjectivity
    name: "Proving Surjectivity"
