            solution_sketch: "Reflexivity: for every $x$ in $\\{1, 2, 3, 6\\}$ we have $x = x \\cdot 1$, so $x$ divides $x$; the reflexive axiom holds. Antisymmetry: suppose $x$ divides $y$ and $y$ divides $x$, so $y = xm$ and $x = yn$ with positive integers $m, n$; then $x = xmn$, hence $mn = 1$, so $m = n = 1$ and $x = y$; the antisymmetric axiom holds. Transitivity: if $x$ divides $y$ and $y$ divides $z$, write $y = xm$ and $z = yn$; then $z = x(mn)$ with $mn$ a positive integer, so $x$ divides $z$; the transitive axiom holds. All three axioms are verified, so the divisibility relation is a partial order on $\\{1, 2, 3, 6\\}$. $\\square$"
        constraints: "verify reflexivity, antisymmetry, transitivity"
      - id: kp2
        name: "Proving a relation is a partial order"
        key_prerequisites: [relations-properties]
        exemplars:
          - problem: "Audit each proposed proof independently. Argument A: On the positive integers, let a precede b when a divides b. Step 1: a=a*1 proves reflexivity. Step 2: if b=am and a=bn with positive integers m,n, then mn=1, so m=n=1 and a=b, proving antisymmetry. Step 3: b=am and c=bn give c=a(mn), proving transitivity. Argument B: On all integers, use divisibility. Step 1: a=a*1 proves reflexivity. Step 2: if b=am and a=bn, then a is nonzero, so mn=1. Step 3: therefore m=n=1, proving antisymmetry. Give the first numbered assertion in each argument that fails to follow from its data and preceding justified assertions. Use 0 if every assertion follows; return the numbers in argument order."
            answer: "0, 2"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "Positivity permits cancellation and forces the integer factors of 1 to be 1; multiplication supplies transitivity. Divisibility of arbitrary integers does not exclude a=b=0, so the cancellation premise fails. The first unsupported assertions are 0, 2."
          - problem: "Audit each proposed proof independently. Argument A: On all integers, use divisibility. Step 1: a=a*1 proves reflexivity. Step 2: if b=am and a=bn, then a is nonzero, so mn=1. Step 3: therefore m=n=1, proving antisymmetry. Argument B: On the positive integers, let a precede b when a divides b. Step 1: a=a*1 proves reflexivity. Step 2: if b=am and a=bn with positive integers m,n, then mn=1, so m=n=1 and a=b, proving antisymmetry. Step 3: b=am and c=bn give c=a(mn), proving transitivity. Give the first numbered assertion in each argument that fails to follow from its data and preceding justified assertions. Use 0 if every assertion follows; return the numbers in argument order."
            answer: "2, 0"
