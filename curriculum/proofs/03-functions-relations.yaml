          - problem: "A student claims that $f : \\mathbb{R} \\to \\mathbb{R}$, $f(x) = x^2 + 3$, is surjective, taking $x = \\sqrt{y - 3}$ for each $y$. The student checks $y = 3$, $y = 4$ and $y = 7$ and stops. Give the smallest positive integer $y$ for which the chosen preimage is not a real number."
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full object is the claimed map $f : \\mathbb{R} \\to \\mathbb{R}$, $f(x) = x^2 + 3$. Step 1 (invert the nonlinear step): the proposed preimage is $x = \\sqrt{y - 3}$. Step 2 (check the preimage lands in the domain): $\\sqrt{y-3}$ is real only when $y \\ge 3$. Step 3 (smallest counterexample): for $y = 1$ the value $\\sqrt{-2}$ is not real, so no $x$ exists. The answer is $1$."
          - problem: "For f:[0,infinity) -> [2,infinity), f(x)=x^2+2, choose the formula that gives a domain preimage for every y>=2. Formula bank: 1: -sqrt(y-2); 2: sqrt(y+2); 3: sqrt(y-2); 4: y-2. Give the formula number."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Solve f(x)=y for an arbitrary target in the full declared codomain, then check both domain membership and substitution. Exactly formula 3 passes both tests."
          - problem: "Claim: $f : \\mathbb{R} \\to \\mathbb{R}$, $f(x) = x^2$, is surjective. Step 1: let $y$ be an arbitrary real number. Step 2: set $x = \\sqrt{y}$; then $x$ is a real number. Step 3: $f(x) = (\\sqrt{y})^2 = y$. Step 4: since $y$ was arbitrary, $f$ is surjective. Which step is the first step that is not valid?"
            answer: "Step 2"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "Step 1 is valid: letting $y$ be an arbitrary codomain element is the correct setup of a surjectivity proof. Step 2 is the first invalid step, because $\\sqrt{y}$ is not a real number when $y < 0$, so the preimage does not land in the domain for such $y$. Step 3 repeats the flaw only implicitly; its algebra is correct whenever the preimage is real. Step 4 would follow from Step 3 if Step 2 held. The answer is Step 2."
          - problem: "Claim: $f : (0,\\infty) \\to (0,\\infty)$, $f(x) = 1/x^2$, is surjective. In the proof, after the line let $y > 0$, the line giving the preimage $x$ is missing. Select the line that is true and that keeps $x$ in the domain $(0,\\infty)$."
            answer: "$x = 1/\\sqrt{y}$"
            answer_contract: {"kind": "label", "options": [["$x = 1/\\sqrt{y}$"], ["$x = -1/\\sqrt{y}$"], ["$x = 1/y^2$"], ["$x = \\sqrt{y}$"]]}
            solution_sketch: "The full object is $f : (0,\\infty) \\to (0,\\infty)$, $f(x) = 1/x^2$. The correct line is $x = 1/\\sqrt{y}$: it is positive, hence in $(0,\\infty)$, and $f(x) = 1/(1/y) = y$. The option $x = -1/\\sqrt{y}$ makes a sign error, giving a preimage outside $(0,\\infty)$. The option $x = 1/y^2$ inverts in the wrong direction, since $f(1/y^2) = y^4$. The option $x = \\sqrt{y}$ forgets the reciprocal, since $f(\\sqrt{y}) = 1/y$. The answer is $x = 1/\\sqrt{y}$."
          - problem: "Write the full proof: $f : \\mathbb{R}\\setminus\\{0\\} \\to \\mathbb{R}\\setminus\\{0\\}$, $f(x) = 4/x^3$, is surjective. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1 (arbitrary target): let $y \\in \\mathbb{R}\\setminus\\{0\\}$ be arbitrary, so $y \\ne 0$. Step 2 (invert the nonlinear step): solve $4/x^3 = y$ for $x$; then $x^3 = 4/y$ and $x = \\sqrt[3]{4/y}$, which is a well-defined real number. Step 3 (preimage lands in the domain): since $y \\ne 0$ we have $4/y \\ne 0$, so $x = \\sqrt[3]{4/y} \\ne 0$ and $x$ lies in the domain $\\mathbb{R}\\setminus\\{0\\}$. Step 4 (verify): $f(x) = 4/x^3 = 4/(4/y) = y$. Step 5 (conclude): $y$ was an arbitrary element of the codomain and we produced an $x$ in the domain with $f(x) = y$, so every codomain element has a preimage and $f$ is surjective. $\\square$"
        constraints: "invert one nonlinear step; check the preimage lands in the domain"
