            answer_contract: {"kind": "none"}
            solution_sketch: "Setup: let a, b, c be arbitrary real numbers with a ~ b and b ~ c. Step 1 (hypothesis, definition of ~): a - b is an integer and b - c is an integer. Step 2 (closure of the integers under addition): write a - c = (a - b) + (b - c); a sum of two integers is an integer, so a - c is an integer. Step 3 (definition of ~ again): since a - c is an integer, a ~ c. Step 4 (universal generalization): a, b, c were arbitrary, so ~ is transitive. QED."
