          - problem: "Write the full proof: on the set {1, 2, 3}, the relation R = {(1,1), (2,2), (3,3), (1,2), (2,1), (2,3), (3,2)} is reflexive and symmetric but not transitive. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1 (reflexive): the set is {1, 2, 3}, and the diagonal pairs (1,1), (2,2), (3,3) are all in R, so a R a holds for every element a. Step 2 (symmetric): every pair of distinct elements has its reverse in R, since (1,2) pairs with (2,1) and (2,3) pairs with (3,2), so a R b implies b R a for all elements a and b. Step 3 (not transitive): the chain (1,2) with (2,3) lies in R, so the transitivity rule forces (1,3) to be in R, but (1,3) is not in R; the chain (3,2) with (2,1) gives a second failure, since it forces (3,1), which is also missing. Conclusion: R is reflexive and symmetric but not transitive, which completes the proof."
        constraints: "check reflexive/symmetric/transitive on a listed relation over a small set"
      - id: kp2
        name: "Antisymmetry"
        key_prerequisites: [set-notation]
        exemplars:
          - problem: "Let $R = \\{(1,1),(1,2),(1,3),(2,2),(3,3)\\}$ on $A = \\{1,2,3\\}$. Decide whether $R$ is antisymmetric, and count the ordered pairs $(x,y)$ with $x \\ne y$ such that $(x,y)$ and $(y,x)$ are both in $R$. Give verdict and violations."
            answer: "verdict = yes; violations = 0"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["yes"], ["no"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "violations"}]}
            solution_sketch: "Full object: $R = \\{(1,1),(1,2),(1,3),(2,2),(3,3)\\}$ on $A = \\{1,2,3\\}$. Antisymmetry rule: a violation needs $(x,y)$ and $(y,x)$ both in $R$ with $x \\ne y$. Check the off-diagonal pairs: $(1,2)$ would need $(2,1)$, and $(1,3)$ would need $(3,1)$; neither reverse is in $R$. So $R$ is antisymmetric and no pair violates it. Note that $R$ is not symmetric, since $(1,2)$ is in $R$ but $(2,1)$ is not: the two properties are different. The answer is verdict = yes; violations = 0."
          - problem: "Let $R = \\{(a,b),(b,a),(b,b),(c,c)\\}$ on $A = \\{a,b,c\\}$. Determine whether $R$ is antisymmetric, and count the ordered pairs $(x,y)$ with $x \\ne y$ whose reverse $(y,x)$ is also in $R$. Give verdict and counter."
            answer: "verdict = no; counter = 2"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["yes"], ["no"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "counter"}]}
            solution_sketch: "Full object: $R = \\{(a,b),(b,a),(b,b),(c,c)\\}$ on $A = \\{a,b,c\\}$. Antisymmetry rule: a pair and its reverse in $R$ with different entries is a violation. The pair $(a,b)$ and its reverse $(b,a)$ are both in $R$ and $a \\ne b$, so $R$ is not antisymmetric. The violating ordered pairs are $(a,b)$ and $(b,a)$, so the count is $2$. The diagonal pairs $(b,b)$ and $(c,c)$ never matter, which is why a relation like equality can be antisymmetric trivially. The answer is verdict = no; counter = 2."
          - problem: "A relation $R$ on the set $\\{1,2\\}$ is both symmetric and antisymmetric. Find the largest possible number of ordered pairs in $R$."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Full object: a relation $R$ on $\\{1,2\\}$ with both properties. Symmetry forces the reverse of every pair into $R$; antisymmetry forbids a pair and its reverse with unequal entries. Any off-diagonal pair $(x,y)$ with $x \\ne y$ would have its reverse forced by symmetry and forbidden by antisymmetry at once, so only diagonal pairs survive. The largest such $R$ is $\\{(1,1),(2,2)\\}$, which has $2$ ordered pairs. The answer is 2."
          - problem: "A student claims that $R = \\{(2,3),(3,2),(1,1),(1,4),(4,4)\\}$ on $\\{1,2,3,4\\}$ is antisymmetric and checks only the pairs $(1,1)$ and $(4,4)$. Give the smallest $x$ such that some $y$ with $x \\ne y$ has both $(x,y)$ and $(y,x)$ in $R$."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Full object: $R = \\{(2,3),(3,2),(1,1),(1,4),(4,4)\\}$ on $\\{1,2,3,4\\}$. A violation of antisymmetry is an ordered pair $(x,y)$ with $x \\ne y$ whose reverse $(y,x)$ is also in $R$. The diagonal pairs $(1,1)$ and $(4,4)$ that the student checked never matter for antisymmetry. For $x = 1$ the pairs are $(1,1)$ and $(1,4)$, and $(4,1)$ is not in $R$. The pair $(2,3)$ has its reverse $(3,2)$ in $R$, so the smallest such $x$ is $2$. The answer is 2."
          - problem: "Let $R = \\{(1,2),(2,1),(1,3),(3,1),(2,3),(3,2)\\}$ be a relation on $A = \\{1,2,3\\}$. Find the smallest number of ordered pairs that must be removed from $R$ so that the remaining relation is antisymmetric."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Full object: $R = \\{(1,2),(2,1),(1,3),(3,1),(2,3),(3,2)\\}$ on $A = \\{1,2,3\\}$. Step 1, the definition of antisymmetry: a violation is a pair $(x,y)$ with $x \\ne y$ whose reverse $(y,x)$ is also in $R$. Step 2, count the conflicts: the unordered pairs $\\{1,2\\}$, $\\{1,3\\}$ and $\\{2,3\\}$ each bring two opposite ordered pairs into $R$, so there are three conflicts. Step 3, minimum removals: one removed ordered pair repairs only one conflict, so at least three removals are needed, and deleting $(2,1)$, $(3,1)$ and $(3,2)$ leaves $\\{(1,2),(1,3),(2,3)\\}$, which is antisymmetric. The answer is 3."
          - problem: "On {0,1}, consider relations A={(0,0),(1,1)}, B={(0,1),(1,0)}, C={(0,1)}, D={(0,0),(1,1),(0,1),(1,0)}. For each relation decide whether it is both symmetric and antisymmetric. Give four indicators in A,B,C,D order, using 1 for yes and 0 for no."
            answer: "1, 0, 0, 0"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "Symmetry requires reversed pairs, while antisymmetry forbids a two-way connection between distinct elements. Only the diagonal relation has both properties, giving 1, 0, 0, 0."
          - problem: "Write the full proof: a relation on a set that is both antisymmetric and symmetric is contained in the diagonal relation. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Let $R$ be antisymmetric and symmetric on a set $A$, and take any $(a,b) \\in R$. Step 1 (symmetry): because $R$ is symmetric, the reverse $(b,a)$ is also in $R$. Step 2 (antisymmetry): the pair $(a,b)$ and its reverse $(b,a)$ are both in $R$, so the definition of antisymmetry forces $a = b$. Step 3 (conclusion): $(a,b) = (a,a)$, so every element of $R$ has equal entries and $R \\subseteq \\{(a,a) : a \\in A\\}$. Note where each property is used: symmetry supplies the reverse pair, and antisymmetry turns the two-way membership into equality; neither property alone suffices, which is exactly how antisymmetry differs from symmetry."
        constraints: "distinguish antisymmetry from symmetry"
