  - id: equivalence-classes-partitions
    name: "Equivalence Classes and Partitions"
    core: true
    difficulty: 0.65
    drill: false
    answer_kind: proof
    expected_time_secs: 230
    prerequisites:
      - id: relations-equivalence
        weight: 0.5
