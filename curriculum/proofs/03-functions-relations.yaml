      problem: 'Prove: if $5$ points are placed in a $2 \times 2$ square, two of them are within distance $\sqrt{2}$.'
      answer: 'Split into four unit cells; two points share a cell of diameter $\sqrt 2$.'
      solution_sketch: 'Partition the square into four $1 \times 1$ cells. With $5$ points and $4$ cells, two points lie in the same unit cell; the largest distance within a unit square is its diagonal $\sqrt 2$, so those two are within $\sqrt 2$. $\square$'
