          - problem: "On $\\{1, 2, 3\\}$ let $R = \\{(1,1), (1,2), (2,3)\\}$ and $S = \\{(1,3), (2,2), (3,1)\\}$. Compute $S \\circ R$. List the resulting pairs in increasing first-coordinate order, then second-coordinate order; flatten them into one ordered list of coordinates."
            answer: "1, 2, 1, 3, 2, 1"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "Construct the full relation required by the operation, preserving the order of each pair. Listing those pairs in the requested order gives the flattened coordinates 1, 2, 1, 3, 2, 1."
          - problem: "On {1, 2, 3} let R = {(1,2), (2,1), (3,2)} and S = {(1,3), (2,2), (3,1)}, where S o R = {(a,c) : there is b with (a,b) in R and (b,c) in S}. How many ordered pairs are in S o R?"
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Apply the composition rule: (a,c) is in S o R exactly when some middle element b has (a,b) in R and (b,c) in S. Chain every pair of R: (1,2) with (2,2) in S gives (1,2); (2,1) with (1,3) in S gives (2,3); (3,2) with (2,2) in S gives (3,2). No other pair of S starts at a second component of R, so S o R = {(1,2), (2,3), (3,2)}. The number of ordered pairs in S o R is 3."
          - problem: "On {1, 2, 3} let R = {(1,2), (1,3), (2,3)} and S = {(2,1), (3,2), (1,1)}, where S o R = {(a,c) : there is b with (a,b) in R and (b,c) in S}. Give the second components of the pairs of S o R in increasing order, repeats included, as a comma-separated list."
            answer: "1, 2, 2"
            answer_contract: {"kind": "list", "member": {"kind": "exact"}, "ordered": true}
            solution_sketch: "Use the composition rule: (a,c) is in S o R when (a,b) in R and (b,c) in S for a middle element b. Chain all pairs of R: (1,2) with (2,1) gives (1,1); (1,3) with (3,2) gives (1,2); (2,3) with (3,2) gives (2,2); element 3 has no outgoing pair in R. The full composition is S o R = {(1,1), (1,2), (2,2)}. Reading the second components in increasing order, repeats included, gives 1, 2, 2."
          - problem: "On {1, 2, 3} let R = {(1,3), (2,2)} and S = {(2,2), (3,1)}, where S o R = {(a,c) : there is b with (a,b) in R and (b,c) in S}. Which of the four option sets equals S o R?"
            answer: "(1,1), (2,2)"
            answer_contract: {"kind": "label", "options": [["(1,1), (2,2)"], ["(2,2), (3,3)"], ["(1,1), (3,3)"], ["(1,1), (2,2), (3,3)"]]}
            solution_sketch: "Chain each pair of R through a middle element into S: (1,3) in R with (3,1) in S gives (1,1), and (2,2) in R with (2,2) in S gives (2,2). The full object is S o R = {(1,1), (2,2)}. The wrong option (2,2), (3,3) comes from composing in the wrong direction; the wrong option (1,1), (3,3) drops the chain through the middle element 2 and adds (3,3); the wrong option (1,1), (2,2), (3,3) adds (3,3), which has no chain because no pair of R starts at 3. The correct option is (1,1), (2,2)."
