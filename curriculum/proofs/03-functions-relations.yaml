    knowledge_points:
      - id: kp1
        name: "Counting all functions"
        key_prerequisites: [functions-formal-definition, cartesian-products, multiplication-principle]
        exemplars:
          - problem: "How many functions are there from $\\{1, 2, 3\\}$ to $\\{a, b\\}$?"
            answer: "$8$"
            answer_contract: {"kind": "exact"}
            solution_sketch: "A function is fixed by choosing $f(1)$, then $f(2)$, then $f(3)$. Choosing $f(1)$ splits the functions into $2$ equal families; inside each, choosing $f(2)$ splits again into $2$; inside each of those, choosing $f(3)$ splits into $2$. So the count doubles once per input: $2 \\cdot 2 \\cdot 2 = 2^3 = 8$."
          - problem: "If $|A| = 4$ and $|B| = 3$, how many functions $A \\to B$ are there?"
            answer: "$81$"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Fix the images of the $4$ inputs one at a time. Each choice is free and has $3$ options, and each earlier choice leaves a separate family to be split $3$ ways again, so the counts multiply: $3 \\cdot 3 \\cdot 3 \\cdot 3 = 3^4 = 81$, i.e. $|B|^{|A|}$."
          - problem: "Let A = {1, 2, 3, 4} and B = {p, q}. Find the number of functions from A to B."
            answer: "16"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The set A has 4 elements and the set B has 2 elements. A function is fixed by choosing the image of 1, then the image of 2, then the image of 3, then the image of 4; by the multiplication principle each input has 2 choices and the choices multiply. The count is 2*2*2*2 = 16. The number of functions is 16."
          - problem: "Suppose A has 5 elements and B has 3 elements. Find the number of functions from A to B."
            answer: "243"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The domain A has 5 elements and the codomain B has 3 elements. By the multiplication principle, each of the 5 inputs has 3 independent choices in B, so the choices multiply. The count is 3^5 = 243, which is |B|^|A|. The number of functions is 243."
          - problem: "The number of functions from a finite set A to a set B with 2 elements is 32. Find the number of elements in A."
            answer: "5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The rule for all functions is that the count equals |B|^|A|. Here |B| = 2 and the count is 32, so solve 2^|A| = 32. Since 2^5 = 32, the domain has size 5. The number of elements in A is 5."
          - problem: "A vending machine code assigns to each of 5 buttons one of 4 letters. How many distinct codes are possible?"
            answer: "1024"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Each code assigns to each of the 5 buttons one of the 4 letters, so a code is a function from a 5-element set to a 4-element set. By the multiplication principle, each button gives 4 independent choices and the 5 choices multiply. The count is 4^5 = 1024. The number of possible codes is 1024."
        constraints: "apply $|B|^{|A|}$, justifying it by the multiplication principle — splitting the count one input at a time; sets of size at most 5"
      - id: kp2
        name: "Counting injections"
        key_prerequisites: [functions-injective-surjective, multiplication-principle]
        exemplars:
          - problem: "How many injective functions are there from $\\{1, 2\\}$ to $\\{a, b, c\\}$?"
            answer: "$6$"
            answer_contract: {"kind": "exact"}
            solution_sketch: "There are $3$ choices for $f(1)$; each of them leaves $2$ unused outputs for $f(2)$, so the $3$ families of size $2$ give $3 \\cdot 2 = 6$."
          - problem: "How many injections are there from a $3$-element set to a $5$-element set?"
            answer: "$60$"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Falling product: $5$ choices for the first input, $4$ for the second, $3$ for the third, so $5 \\cdot 4 \\cdot 3 = 60$."
          - problem: "How many injections are there from a $4$-element set to a $3$-element set?"
            answer: "$0$"
            answer_contract: {"kind": "exact"}
            solution_sketch: "None exist when the domain outnumbers the codomain: a fourth input would have to repeat one of the $3$ outputs, so the count is $0$."
          - problem: "There are 72 injections from a 2-element set A to a set B that has n elements. Find n."
            answer: "9"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The falling product for injections from a 2-element set into an n-element set is n(n-1), by the multiplication principle. Set n(n-1) = 72 and factor: 72 = 9 times 8, and n = -8 is not a set size, so n = 9. The answer is 9."
          - problem: "A teacher has 3 distinct trophies to award to 6 students, and no student may receive more than one trophy. How many ways are there to assign the trophies to the students?"
            answer: "120"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Model each trophy as an input and each student as an output; no repeated output means the assignment is an injection from a 3-element set to a 6-element set. Falling product by the multiplication principle: 6 choices for the first trophy, then 5, then 4, giving 6 times 5 times 4 = 120. The answer is 120."
          - problem: "Let A = {1, 2, 3} and B = {a, b, c, d, e, f}. How many injections f from A to B satisfy f(1) = a?"
            answer: "20"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The condition f(1) = a fixes one output, so 5 outputs of B remain for the inputs 2 and 3. Falling product by the multiplication principle: 5 choices for f(2), then 4 choices for f(3). The product 5 times 4 = 20, so the answer is 20."
        constraints: "falling products $|B|(|B|-1)\\cdots$; include one impossible case"
      - id: kp3
        name: "Counting bijections"
        key_prerequisites: [functions-injective-surjective]
        exemplars:
          - problem: "How many bijections are there from $\\{1, 2, 3\\}$ to itself?"
            answer: "$6$"
            answer_contract: {"kind": "exact"}
            solution_sketch: "$3! = 3 \\cdot 2 \\cdot 1 = 6$ ways to match inputs to distinct outputs."
          - problem: "How many bijections are there from $\\{1, 2, 3, 4\\}$ to $\\{a, b, c, d\\}$?"
            answer: "$24$"
            answer_contract: {"kind": "exact"}
            solution_sketch: "$4! = 24$; equal sizes are required for any bijection to exist."
          - problem: "Let A = {0, 1, 2, 3, 4} and B = {v, w, x, y, z}. How many bijections are there from A to B?"
            answer: "120"
            answer_contract: {"kind": "exact"}
            solution_sketch: "A bijection matches each of the 5 inputs to a distinct output, so |A| = |B| holds and the factorial rule applies. By the multiplication principle there are 5 choices for the first input, then 4, 3, 2, 1, giving 5! = 120. The number of bijections from A to B is 120."
          - problem: "A set A has 3 elements and a set B has 4 elements. How many bijections are there from A to B?"
            answer: "0"
            answer_contract: {"kind": "exact"}
            solution_sketch: "A bijection must pair every element of A with a distinct element of B and hit every element of B, which forces |A| = |B|. Here |A| = 3 and |B| = 4 differ, so no bijection can exist. The number of bijections is 0."
          - problem: "The number of bijections from a set A to a set B is 5040, where A and B have the same size n. Find n."
            answer: "7"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Rule: two finite sets of size n have exactly n! bijections. Set n! = 5040 and test factorials: 6! = 720 is too small and 7! = 5040 matches. Therefore n = 7."
          - problem: "Let A = {a, b, c, d, e, f} and B = {2, 4, 6, 8, 10, 12}. How many bijections are there from A to B?"
            answer: "720"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Both sets have 6 elements, so bijections exist and the factorial rule applies. By the multiplication principle the first input has 6 choices, the next 5, and so on down to 1, giving 6! = 720. So there are 720 bijections from A to B."
        constraints: "factorials for equal-size sets; note bijections need $|A| = |B|$"
    diagnostic_exemplar:
      problem: 'How many of the functions from $\{1, 2\}$ to $\{x, y, z\}$ fail to be injective?'
      answer: '$3$'
      solution_sketch: 'Total functions: $3^2 = 9$. Injections: $3 \cdot 2 = 6$. So $9 - 6 = 3$ are non-injective — exactly the three constant functions.'
    anki_seeds:
      - front: 'Number of functions $A \to B$ (finite sets)?'
        back: '$|B|^{|A|}$.'
        type: basic
      - front: 'Number of bijections on an $n$-element set?'
        back: '$n!$.'
        type: basic

  - id: computing-images-preimages
    name: "Computing Images and Preimages"
    core: false                # supplemental, with images-preimages: terminal branch
    difficulty: 0.56
    drill: false
    answer_kind: numeric
    expected_time_secs: 130
    prerequisites:
      - id: functions-formal-definition
        weight: 0.5
        key: true
      - id: set-operations
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: "Images of finite sets"
        key_prerequisites: [functions-formal-definition]
        exemplars:
          - problem: "For the function on the integers given by f(n)=n^2, find the image of S={-2, -1, 0, 1, 2} as a set."
            answer: "{0, 1, 4}"
            answer_contract: {"kind": "set"}
            solution_sketch: "Apply the function to every member of S and collect the distinct resulting values. Repeated outputs occur once in the image, which is {0, 1, 4}."
          - problem: "For the function on {1,2,3} given by f(1)=4, f(2)=5, f(3)=4, find the image of S={1, 3} as a set."
            answer: "{4}"
            answer_contract: {"kind": "set"}
            solution_sketch: "Apply the function to every member of S and collect the distinct resulting values. Repeated outputs occur once in the image, which is {4}."
          - problem: "For the function on the integers given by f(n)=2n+1, find the image of S={-3, -1, 2} as a set."
            answer: "{-5, -1, 5}"
            answer_contract: {"kind": "set"}
            solution_sketch: "Apply the function to every member of S and collect the distinct resulting values. Repeated outputs occur once in the image, which is {-5, -1, 5}."
          - problem: "For the function on the integers given by f(n)=abs(n), find the image of S={-2, 0, 2, 3} as a set."
            answer: "{0, 2, 3}"
            answer_contract: {"kind": "set"}
            solution_sketch: "Apply the function to every member of S and collect the distinct resulting values. Repeated outputs occur once in the image, which is {0, 2, 3}."
          - problem: "For the function on the integers given by f(n) is the remainder of n on division by 3, find the image of S={0, 1, 2, 3} as a set."
            answer: "{0, 1, 2}"
            answer_contract: {"kind": "set"}
            solution_sketch: "Apply the function to every member of S and collect the distinct resulting values. Repeated outputs occur once in the image, which is {0, 1, 2}."
          - problem: "For the function on the integers given by f(n)=n^2+1, find the image of S={-2, 1, 2} as a set."
            answer: "{2, 5}"
            answer_contract: {"kind": "set"}
            solution_sketch: "Apply the function to every member of S and collect the distinct resulting values. Repeated outputs occur once in the image, which is {2, 5}."
        constraints: "apply $f(S) = \\{f(x) : x \\in S\\}$; collapsing repeats is the point"
      - id: kp2
        name: "Computing preimages"
        key_prerequisites: [functions-formal-definition]
        exemplars:
          - problem: "For $f : \\mathbb{R} \\to \\mathbb{R}$, $f(x) = 2x + 1$, compute $f^{-1}(\\{1, 3, 5\\})$."
            answer: "$\\{0, 1, 2\\}$"
            answer_contract: {"kind": "set"}
            solution_sketch: "Solve $2x + 1 = 1, 3, 5$ in turn: $x = 0, 1, 2$."
          - problem: "Let $f : \\mathbb{Z} \\to \\mathbb{Z}$ with $f(n) = n^2$. Give the preimage $f^{-1}(\\{16, 25\\})$ as a set."
            answer: "{-5, -4, 4, 5}"
            answer_contract: {"kind": "set"}
            solution_sketch: "Step 1: by the definition of the preimage, solve $n^2 = 16$ and $n^2 = 25$ over the integers. Step 2: $n^2 = 16$ gives $n = 4$ or $n = -4$; $n^2 = 25$ gives $n = 5$ or $n = -5$. Step 3: the four integers are distinct, so the answer is {-5, -4, 4, 5}."
          - problem: "Let $f : \\mathbb{R} \\to \\mathbb{R}$ with $f(x) = 3x - 2$. Give the preimage $f^{-1}(\\{4, 7, 10\\})$ as a set."
            answer: "{2, 3, 4}"
            answer_contract: {"kind": "set"}
            solution_sketch: "Step 1: by the definition of the preimage, solve $3x - 2 = 4$, $3x - 2 = 7$ and $3x - 2 = 10$ in turn. Step 2: the solutions are $x = 2$, $x = 3$ and $x = 4$. Step 3: the linear function is injective, so the preimage is {2, 3, 4}."
          - problem: "Let f:R -> R be given by f(x)=2x+4. Compute the preimage of {-2,6,10} as a set."
            answer: "{-3, 1, 3}"
            answer_contract: {"kind": "set"}
            solution_sketch: "Solve f(x)=t separately for every target t in the given set, retaining every real solution. Their union is the preimage {-3, 1, 3}."
          - problem: "Let $f : \\mathbb{Z} \\to \\mathbb{Z}$ with $f(n) = n^2 + 3$. Determine how many elements the preimage $f^{-1}(\\{2\\})$ has."
            answer: "0"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: the preimage of {2} contains the integers $n$ with $n^2 + 3 = 2$. Step 2: that equation is $n^2 = -1$, which has no integer solution, so the preimage is the empty set. Step 3: the empty set has 0 elements, so the answer is 0."
          - problem: "Let $f : \\mathbb{Z} \\to \\mathbb{Z}$ with $f(n) = n^2 - n$. Call the two preimages $A = f^{-1}(\\{2, 12\\})$ and $B = f^{-1}(\\{6, 20\\})$. Compute $A$ and $B$, giving both as sets."
            answer: "A = {-3, -1, 2, 4}; B = {-4, -2, 3, 5}"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "set"}, "name": "A"}, {"contract": {"kind": "set"}, "name": "B"}]}
            solution_sketch: "Step 1: solve $n^2 - n = 2$ and $n^2 - n = 12$; factoring $n(n-1) = 2$ gives $n = 2$ or $n = -1$, and $n(n-1) = 12$ gives $n = 4$ or $n = -3$, so $A = \\{-3, -1, 2, 4\\}$. Step 2: solve $n^2 - n = 6$ and $n^2 - n = 20$; $n(n-1) = 6$ gives $n = 3$ or $n = -2$, and $n(n-1) = 20$ gives $n = 5$ or $n = -4$, so $B = \\{-4, -2, 3, 5\\}$. The full result is A = {-3, -1, 2, 4}; B = {-4, -2, 3, 5}."
        constraints: "solve $f(x) \\in T$; include an empty preimage"
      - id: kp3
        name: "Real functions on intervals"
        key_prerequisites: [set-operations]
        exemplars:
          - problem: "For f:R -> R with f(x)=x^2, find f([-1,2]). Give the image as an inequality in y."
            answer: "0 <= y <= 4"
            answer_contract: {"kind": "inequality_union"}
            solution_sketch: "The continuous square function reaches its minimum at 0 and its maximum at the right endpoint 2. Every intermediate value occurs, giving 0 <= y <= 4."
          - problem: "For $f : \\mathbb{R} \\to \\mathbb{R}$, $f(x) = x^2$, find the preimage $f^{-1}([9, 16])$. Give the answer as an inequality in x."
            answer: "-4 <= x <= -3 or 3 <= x <= 4"
            answer_contract: {"kind": "inequality_union"}
            solution_sketch: "Object: the set of x with 9 <= x^2 <= 16 for f(x) = x^2. Step 1 (double inequality rule): 9 <= x^2 <= 16 holds exactly when 3 <= abs(x) <= 4. Step 2 (absolute value rule): abs(x) <= 4 gives -4 <= x <= 4, while abs(x) >= 3 gives x <= -3 or x >= 3; intersecting the two conditions keeps the two outer branches. The preimage is -4 <= x <= -3 or 3 <= x <= 4."
          - problem: "For $f : \\mathbb{R} \\to \\mathbb{R}$, $f(x) = x^2$, find the image $f([-3, 2])$. Give the answer as an inequality in x."
            answer: "0 <= x <= 9"
            answer_contract: {"kind": "inequality_union"}
            solution_sketch: "Object: f(x) = x^2 on the interval [-3, 2]. Step 1 (vertex and endpoints rule): the square decreases on [-3, 0] and increases on [0, 2], so the minimum is 0^2 = 0 at x = 0 and the maximum is max((-3)^2, 2^2) = 9 at x = -3. Step 2 (intermediate value rule): the square is continuous, so every value between 0 and 9 is attained on the interval. The image is 0 <= x <= 9."
          - problem: "Let $f(x) = 3x - 2$ with domain $\\mathbb{R}$. Find the image of the interval $[1, 4]$ under $f$. Give the answer as an inequality in x."
            answer: "1 <= x <= 10"
            answer_contract: {"kind": "inequality_union"}
            solution_sketch: "Object: f(x) = 3x - 2 on [1, 4]. Step 1 (endpoint rule for increasing affine maps): f(1) = 3 - 2 = 1 and f(4) = 12 - 2 = 10. Step 2 (intermediate value rule): f is continuous and increasing, so every value between 1 and 10 is attained and none outside. The image is 1 <= x <= 10."
          - problem: "Let $f(x) = -2x + 5$ with domain $\\mathbb{R}$. Determine $f^{-1}([-1, 7])$. Give the answer as an inequality in x."
            answer: "-1 <= x <= 3"
            answer_contract: {"kind": "inequality_union"}
            solution_sketch: "Object: the set of x with -1 <= -2x + 5 <= 7 for f(x) = -2x + 5. Step 1 (double inequality rule): subtract 5 from all three parts to get -6 <= -2x <= 2. Step 2 (division by a negative rule): dividing by -2 flips both inequalities, giving 3 >= x >= -1. Since f is onto, every value of [-1, 7] is attained, so the preimage is -1 <= x <= 3."
          - problem: "For $f(x) = x^2$ on $\\mathbb{R}$, compute $f^{-1}([-2, 1])$. Give the answer as an inequality in x."
            answer: "-1 <= x <= 1"
            answer_contract: {"kind": "inequality_union"}
            solution_sketch: "Object: the set of x with -2 <= x^2 <= 1 for f(x) = x^2. Step 1 (nonnegativity rule): x^2 >= 0 for every real x, so the condition -2 <= x^2 holds automatically and only x^2 <= 1 restricts x. Step 2 (square root rule): x^2 <= 1 holds exactly when abs(x) <= 1, that is -1 <= x <= 1. The preimage is -1 <= x <= 1."
        constraints: "images/preimages of intervals under $x^2$ or affine maps; answers as intervals or unions"
    diagnostic_exemplar:
      problem: 'For $f : \mathbb{R} \to \mathbb{R}$, $f(x) = x^2$, find the image $f([-1, 3])$ and the preimage $f^{-1}([4, 9])$.'
      answer_contract: {kind: none}
      answer: '$f([-1,3]) = [0, 9]$: on $[-1,3]$ the square attains its least value $0$ at $x = 0$ and its greatest value $9$ at $x = 3$, and every value in between is attained. $f^{-1}([4,9]) = [-3,-2] \cup [2,3]$: the condition $4 \le x^2 \le 9$ says $2 \le |x| \le 3$, which allows both signs.'
      solution_sketch: 'For the image, track the minimum and maximum of $x^2$ over the interval; for the preimage, solve the inequality in $|x|$ and keep both signs.'
    anki_seeds:
      - front: 'Does $f^{-1}(T)$ require $f$ to be invertible?'
        back: 'No — the preimage $\{x : f(x) \in T\}$ is defined for every function.'
        type: basic
      - front: '$f^{-1}(\{b\}) = \varnothing$ means...'
        back: 'no input maps to $b$ ($b$ is not in the image of $f$).'
        type: basic

