      - id: kp1
        name: 'Classes modulo n'
        key_prerequisites: [relations-equivalence]
        step_check:
          step: 'we get $[-2] = [4]$'
          question: 'Why does adding $6$ to $-2$ not change its class modulo $6$?'
          options:
            - 'Adding $6$ moves every number into the class of the number $0$'
            - 'Classes modulo $6$ are only defined for the numbers $0$ to $5$ and no others'
            - 'The new number differs from $-2$ by $6$, so the two are congruent'
            - 'Adding $6$ gives a number that is equal to the old one'
          answer: 'The new number differs from $-2$ by $6$, so the two are congruent'
          why: 'Congruent numbers differ by a multiple of the modulus, so $4 = -2 + 6$ lies in the class of $-2$.'
        exemplars:
          - problem: 'For congruence modulo $4$ on the integers, what is the smallest nonnegative integer in the class of $-7$?'
            answer: '1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The class of $-7$ contains every integer that differs from $-7$ by a multiple of $4$. Adding $8$ gives $-7 + 8 = 1$, and $1$ is the smallest nonnegative integer in the class because $1 < 4$. So the answer is $1$.'
          - problem: 'Which of the integers $0$, $2$, $4$, $5$ is congruent to $-3$ modulo $5$?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Two integers are congruent modulo $5$ when their difference is a multiple of $5$. We have $2 - (-3) = 5$, so $2$ is congruent to $-3$. The differences for $0$, $4$ and $5$ are $3$, $7$ and $8$, and none is a multiple of $5$.'
          - problem: 'A $12$-hour clock shows the hour $5$. What hour does it show $100$ hours later?'
            answer: '9'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'After $100$ hours the clock shows the hour $5 + 100 = 105$ modulo $12$. Since $105 = 8 \cdot 12 + 9$, the clock shows the hour $9$.'
          - problem: 'For congruence modulo $6$, what is the smallest nonnegative integer in the class of $29$?'
            answer: '5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'We divide $29$ by $6$: $29 = 4 \cdot 6 + 5$. So $29 - 24 = 5$ lies in the class of $29$, and $5$ is the smallest nonnegative integer in it.'
          - problem: 'The days of a week are numbered $0$ to $6$, and today is day $4$. What is the number of the day $100$ days from today?'
            answer: '6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The day number after $100$ days is $4 + 100 = 104$ modulo $7$. Since $104 = 14 \cdot 7 + 6$, the day number is $6$.'
          - problem: 'For congruence modulo $6$, are the classes of $8$ and $2$ equal?'
            answer: 'yes'
            answer_contract: {"kind": "label", "options": [["yes", "it is", "true", "they are equal", "equal", "[8] = [2]"], ["no", "it is not", "false", "they are not equal", "not equal"]]}
            solution_sketch: 'Two classes modulo $6$ are equal exactly when their representatives differ by a multiple of $6$. We have $8 - 2 = 6$, which is a multiple of $6$. So $[8] = [2]$.'
          - problem: 'Sam reduces $-25$ modulo $9$ by computing $25 - 18 = 7$ and says that the smallest nonnegative integer in the class of $-25$ is $7$. What is the correct value?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Sam found the remainder of $25$, not of $-25$. The class of $-25$ contains $-25 + 27 = 2$, because $27$ is a multiple of $9$, and $2$ is nonnegative and smaller than $9$. So the correct value is $2$; check that $7 - (-25) = 32$ is not a multiple of $9$.'
          - problem: 'How many of the integers from $1$ to $100$ are in the class of $3$ modulo $7$?'
            answer: '14'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The integers in the class of $3$ are $3, 10, 17, \dots$, that is, $3 + 7k$. The largest one not above $100$ is $3 + 7 \cdot 13 = 94$, because $3 + 7 \cdot 14 = 101$ is too large. So $k$ runs from $0$ to $13$, which gives $14$ integers.'
          - problem: 'For congruence modulo $6$, are the classes of $11$ and $2$ equal?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "it is", "true", "they are equal", "equal", "[11] = [2]"], ["no", "it is not", "false", "they are not equal", "not equal"]]}
            solution_sketch: 'Two classes modulo $6$ are equal exactly when their representatives differ by a multiple of $6$. We have $11 - 2 = 9$, which is not a multiple of $6$. So $[11] \neq [2]$.'
        constraints: 'residue classes mod $n \le 10$; representatives and class equality'
      - id: kp2
        name: 'Classes on finite sets'
        key_prerequisites: [relations-equivalence]
        step_check:
          step: 'every element $1$ through $8$ appears in exactly one class'
          question: 'Why must the sizes of the four classes add up to $8$?'
          options:
            - 'Each element lies in exactly one class, so the classes do not overlap'
            - 'The relation was defined on a set of $8$ elements, so each class has size $2$'
            - 'Classes are always made equal in size, so four classes of size $2$ give $8$'
            - 'The sum of the class sizes is the number of classes times $2$, because $4 \cdot 2 = 8$'
          answer: 'Each element lies in exactly one class, so the classes do not overlap'
          why: 'Each element belongs to exactly one class, so counting the elements class by class counts every element once.'
        exemplars:
          - problem: 'On the set $\{1, 2, 3, 4, 5\}$, let $a \sim b$ exactly when $a$ and $b$ have the same parity. Which elements are in the equivalence class of $1$?'
            answer: '1, 3, 5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The class of $1$ consists of all elements with the same parity as $1$, that is, the odd elements. The odd elements of the set are $1$, $3$ and $5$. So the class of $1$ is $\{1, 3, 5\}$.'
          - problem: 'On $\{1, 2, \dots, 9\}$, let $a \sim b$ exactly when $a$ and $b$ leave the same remainder on division by $3$. Which elements are in the equivalence class of $7$?'
            answer: '1, 4, 7'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Division of $7$ by $3$ leaves the remainder $1$. The elements of the set with remainder $1$ are $1$, $4$ and $7$, because $4 = 3 + 1$ and $7 = 6 + 1$. So the class of $7$ is $\{1, 4, 7\}$.'
          - problem: 'On $\{1, 2, 3, 4, 5, 6\}$ define $a \sim b$ when $a = b$ or $a + b = 7$. This is an equivalence relation. How many equivalence classes does it have?'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Each element is related to itself, and $a + b = 7$ joins $1$ with $6$, $2$ with $5$ and $3$ with $4$. No element is joined to two different partners, so the classes are $\{1, 6\}$, $\{2, 5\}$ and $\{3, 4\}$. There are $3$ classes.'
          - problem: 'At a dinner, $13$ guests numbered $1$ to $13$ are seated at tables, and guests $a$ and $b$ sit at the same table when their numbers leave the same remainder on division by $4$. How many guests sit at the table of guest $5$?'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The number $5$ leaves the remainder $1$ on division by $4$. The numbers from $1$ to $13$ with remainder $1$ are $1$, $5$, $9$ and $13$. So $4$ guests sit at that table.'
          - problem: 'A teacher numbers $40$ students from $1$ to $40$ and forms teams so that students $a$ and $b$ are on the same team exactly when $a - b$ is a multiple of $6$. How many students are on the team of student $4$?'
            answer: '7'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The students on the team of student $4$ have the numbers $4 + 6k$. The largest of them not above $40$ is $4 + 6 \cdot 6 = 40$, so $k$ runs from $0$ to $6$. That gives $7$ students.'
          - problem: 'The set $\{3, 6, 9, 12, 15, 18\}$ carries the relation $a \sim b$ exactly when $a$ and $b$ leave the same remainder on division by $5$. How many equivalence classes are there?'
            answer: '5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The remainders of $3, 6, 9, 12, 15, 18$ on division by $5$ are $3, 1, 4, 2, 0, 3$. Only $3$ and $18$ share a remainder, so the classes are $\{3, 18\}$, $\{6\}$, $\{9\}$, $\{12\}$ and $\{15\}$. That gives $5$ classes.'
          - problem: 'On $\{1, 2, \dots, 9\}$ define $a \sim b$ when $a = b$ or $a + b = 10$. Which elements are in the equivalence class of $5$?'
            answer: '5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The element $5$ is related to itself, and $5 + b = 10$ gives $b = 5$ again. No other element is related to $5$. So the class of $5$ is $\{5\}$, a class with one element.'
          - problem: 'On $\{1, 2, \dots, 10\}$, let $a \sim b$ exactly when $a$ and $b$ leave the same remainder on division by $3$. Is $4 \sim 10$?'
            answer: 'yes'
            answer_contract: {"kind": "label", "options": [["yes", "it is", "true", "4 ~ 10", "they are related", "related"], ["no", "it is not", "false", "not related", "they are not related", "4 is not related to 10"]]}
            solution_sketch: 'Two numbers leave the same remainder on division by $3$ exactly when their difference is a multiple of $3$. We have $10 - 4 = 6 = 2 \cdot 3$, and both $4$ and $10$ leave the remainder $1$. So $4 \sim 10$.'
        constraints: 'list all classes of a concrete relation on a set of size at most 9'
      - id: kp3
        name: 'Classes for rule-defined relations'
        key_prerequisites: [relations-equivalence]
        step_check:
          step: 'the two integers with absolute value $4$ are $x = 4$ and $x = -4$'
          question: 'Why does the class of $-4$ contain two integers and not only $-4$?'
          options:
            - 'The class of every number contains that number and its negative, whatever the rule is'
            - 'Both $4$ and $-4$ have absolute value $4$, and the rule uses only that'
            - 'A class always has two elements, because $\sim$ relates $a$ to $b$ and $b$ to $a$'
            - 'The number $4$ was added to make the class larger than a single element'
          answer: 'Both $4$ and $-4$ have absolute value $4$, and the rule uses only that'
          why: 'The rule $|x| = |a|$ holds for every $x$ with the same absolute value as $a$, and $4$ and $-4$ both have absolute value $4$.'
        exemplars:
          - problem: 'On $\mathbb{Z}$ let $a \sim b$ exactly when $|a| = |b|$. Which integers are in the equivalence class of $6$?'
            answer: '-6, 6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'An integer $x$ is in the class of $6$ exactly when $|x| = |6| = 6$. The equation $|x| = 6$ has the two solutions $x = 6$ and $x = -6$. So the class of $6$ is $\{-6, 6\}$.'
          - problem: 'On $\mathbb{R}$ let $x \sim y$ exactly when $x - y$ is an integer. Which element of the equivalence class of $\tfrac{9}{4}$ lies in the interval from $0$ up to but not including $1$?'
            answer: '1/4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The class of $\tfrac{9}{4}$ consists of the numbers $\tfrac{9}{4} + k$ with $k$ an integer, that is, $\dots, -\tfrac{3}{4}, \tfrac{1}{4}, \tfrac{5}{4}, \tfrac{9}{4}, \dots$. Exactly one of them, $\tfrac{1}{4}$, satisfies $0 \le x < 1$. So the answer is $\tfrac{1}{4}$.'
          - problem: 'A circular running track is $400$ m long. Two distances along the track count as the same point on the track when they differ by a multiple of $400$ m. A runner has run $1050$ m from the start line. How many metres from the start line along the track is the runner, between $0$ m and $400$ m?'
            answer: '250'
            answer_contract: {"kind": "unit", "quantity": "length", "unit": "m", "allow_omitted": true}
            solution_sketch: 'The runner is at the same point as the distance $1050 - 400k$ for any integer $k$. We have $1050 = 2 \cdot 400 + 250$, so after two full laps the runner is $250$ m past the start line. So the answer is $250$ m.'
          - problem: 'On $\mathbb{R}$ let $x \sim y$ exactly when $x^2 = y^2$. Which real numbers are in the equivalence class of $-3$?'
            answer: '-3, 3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A real number $x$ is in the class of $-3$ exactly when $x^2 = (-3)^2 = 9$. The equation $x^2 = 9$ has the solutions $x = 3$ and $x = -3$. So the class of $-3$ is $\{-3, 3\}$.'
          - problem: 'On $\mathbb{Z}$ let $x \sim y$ exactly when $x(x - 1) = y(y - 1)$. Which integers are in the equivalence class of $4$?'
            answer: '-3, 4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'We need $x(x - 1) = 4 \cdot 3 = 12$, which is $x^2 - x - 12 = 0$. This factors as $(x - 4)(x + 3) = 0$, so $x = 4$ or $x = -3$. So the class of $4$ is $\{-3, 4\}$.'
          - problem: 'A radio mast stands at the origin of a map whose unit is $1$ km. Two points of the map are in the same class when they have the same distance from the mast. A town lies at the point $(6, 8)$. What is the radius of the circle that contains the class of the town?'
            answer: '10'
            answer_contract: {"kind": "unit", "quantity": "length", "unit": "km", "allow_omitted": true}
            solution_sketch: 'The distance of a point $(x, y)$ from the origin is $\sqrt{x^2 + y^2}$, and the class of the town is the set of points with this distance. For the town the distance is $\sqrt{36 + 64} = \sqrt{100} = 10$. So the class is the circle of radius $10$ km around the mast.'
          - problem: 'On $\mathbb{R}$ let $x \sim y$ exactly when $x^3 - 3x = y^3 - 3y$. Which real numbers are in the equivalence class of $2$?'
            answer: '-1, 2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'We need $x^3 - 3x = 8 - 6 = 2$, which is $x^3 - 3x - 2 = 0$. This factors as $(x - 2)(x + 1)^2 = 0$, so $x = 2$ or $x = -1$. So the class of $2$ is $\{-1, 2\}$.'
          - problem: 'On the positive real numbers let $x \sim y$ exactly when $x + \tfrac{1}{x} = y + \tfrac{1}{y}$. Which numbers are in the equivalence class of $3$?'
            answer: '1/3, 3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'We need $x + \tfrac{1}{x} = 3 + \tfrac{1}{3} = \tfrac{10}{3}$. Multiplying by $3x$ gives $3x^2 - 10x + 3 = 0$, which factors as $(3x - 1)(x - 3) = 0$. So $x = \tfrac{1}{3}$ or $x = 3$, and both are positive.'
          - problem: 'Two points $(x, y)$ with integer coordinates are in the same class when $x^2 + y^2$ has the same value for both. How many points with integer coordinates are in the class of $(5, 0)$?'
            answer: '12'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The class of $(5, 0)$ consists of the integer points with $x^2 + y^2 = 25$. These are $(\pm 5, 0)$, $(0, \pm 5)$, $(\pm 3, \pm 4)$ and $(\pm 4, \pm 3)$, which is $2 + 2 + 4 + 4 = 12$ points.'
          - problem: 'On $\{1, 2, \dots, 10\}$, let $a \sim b$ exactly when $a$ and $b$ leave the same remainder on division by $3$. Is $5 \sim 9$?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "it is", "true", "5 ~ 9", "they are related", "related"], ["no", "it is not", "false", "not related", "they are not related", "5 is not related to 9"]]}
            solution_sketch: 'Two numbers leave the same remainder on division by $3$ exactly when their difference is a multiple of $3$. We have $9 - 5 = 4$, which is not a multiple of $3$, and $5$ leaves the remainder $2$ while $9$ leaves the remainder $0$. So $5 \sim 9$ is false.'
        constraints: 'describe $[a] = \{x : x \sim a\}$ for a rule-defined relation'
