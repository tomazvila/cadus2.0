      - front: 'Universal instantiation?'
        back: 'From $\forall x\, P(x)$, conclude $P(c)$ for any particular $c$ in the domain.'
        type: basic
      - front: 'Existential generalization?'
        back: 'From $P(c)$ for some particular $c$, conclude $\exists x\, P(x)$.'
