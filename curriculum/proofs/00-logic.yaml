            solution_sketch: "Full statement: for every x in {-2,-1,0,1,2}, x^2 > 0. Step 1, universal-statement rule: a counterexample is an element where the predicate is false. Step 2, exhaustive check: x=-2 gives 4 > 0 true, x=-1 gives 1 > 0 true, x=0 gives 0 > 0 false, x=1 gives 1 > 0 true, x=2 gives 4 > 0 true. Only x=0 fails. The answer is 1."
