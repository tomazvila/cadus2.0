    diagnostic_exemplar:
      problem: 'Premises: "every integer divisible by $6$ is even" and "$15$ is not even". What follows about $15$? And do the premises "every integer divisible by $6$ is even" and "$10$ is even" let you conclude that $10$ is divisible by $6$?'
      answer_contract: {kind: none}
      answer: 'Instantiating the universal at $15$ gives "if $6 \mid 15$ then $15$ is even"; with "$15$ is not even", modus tollens yields $6 \nmid 15$ (universal modus tollens). The second inference is invalid: it affirms the consequent of the instantiated conditional — and indeed $10$ is even while $6 \nmid 10$.'
      solution_sketch: 'Instantiate the universal at the named integer, then apply modus tollens; the second pattern affirms the consequent, and a counterexample refutes it.'
