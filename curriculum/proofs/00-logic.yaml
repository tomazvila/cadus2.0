            answer: "2, 3, 1"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "Negate the whole quantified statement by exchanging every universal and existential quantifier and negating the predicate. The complete resulting formulas have bank numbers 2, 3, 1."
          - problem: "All variables range independently over nonempty domains, and R is an arbitrary predicate. Negate each complete statement: (a) forall x, not R(x); (b) exists x, not R(x); (c) forall x, R(x). Formula bank: 1: forall x, not R(x); 2: forall x, R(x); 3: exists x, R(x); 4: exists x, not R(x). Give the bank numbers for (a), (b), (c), in order."
