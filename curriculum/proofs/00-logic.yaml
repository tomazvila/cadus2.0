      - id: kp2
        name: "Negating conditionals and compounds"
        key_prerequisites: [logical-equivalence]
        exemplars:
          - problem: "Negate the statement: if a number is a multiple of 6 then it is even. Which option gives the negation?"
            answer: "multiple of 6 and not even"
            answer_contract: {"kind": "label", "options": [["multiple of 6 and not even"], ["not a multiple of 6 and even"], ["not a multiple of 6 and not even"], ["multiple of 6 or not even"]]}
            solution_sketch: "The negation of P -> Q is P and not Q. Here P is a multiple of 6 and Q is even, so the negation is multiple of 6 and not even. The option 'not a multiple of 6 and even' negates the wrong part. The option 'not a multiple of 6 and not even' negates both parts. The option 'multiple of 6 or not even' keeps a disjunction. The answer is multiple of 6 and not even."
          - problem: "Negate: x > 3 and x <= 7. Give the answer as an inequality in x."
            answer: "x <= 3 or x > 7"
            answer_contract: {"kind": "inequality_union"}
            solution_sketch: "By De Morgan, the negation of an and is an or with each part negated. The negation of x > 3 is x <= 3. The negation of x <= 7 is x > 7. Combining these gives x <= 3 or x > 7. The answer is x <= 3 or x > 7."
          - problem: "Negate: x < -2 or x >= 5. Give the answer as an inequality in x."
            answer: "-2 <= x < 5"
            answer_contract: {"kind": "inequality_union"}
            solution_sketch: "By De Morgan, the negation of an or is an and with each part negated. The negation of x < -2 is x >= -2. The negation of x >= 5 is x < 5. Together they give -2 <= x < 5. The answer is -2 <= x < 5."
          - problem: "Negate: x <= 1 or x > 4. Give the answer as an inequality in x."
            answer: "1 < x <= 4"
            answer_contract: {"kind": "inequality_union"}
            solution_sketch: "By De Morgan, the negation of an or is an and with each part negated. The negation of x <= 1 is x > 1. The negation of x > 4 is x <= 4. Combined, they give 1 < x <= 4. The answer is 1 < x <= 4."
          - problem: "Negate: x >= 0 and x < 10. Give the answer as an inequality in x."
            answer: "x < 0 or x >= 10"
            answer_contract: {"kind": "inequality_union"}
            solution_sketch: "By De Morgan, the negation of an and is an or with each part negated. The negation of x >= 0 is x < 0. The negation of x < 10 is x >= 10. Combined, they give x < 0 or x >= 10. The answer is x < 0 or x >= 10."
          - problem: "Negate the statement: if x > 2 then x^2 > 4. Which option gives the negation?"
            answer: "x > 2 and x^2 <= 4"
            answer_contract: {"kind": "label", "options": [["x > 2 and x^2 <= 4"], ["x <= 2 and x^2 > 4"], ["x <= 2 and x^2 <= 4"], ["x > 2 or x^2 <= 4"]]}
            solution_sketch: "The negation of P -> Q is P and not Q. Here P is x > 2 and Q is x^2 > 4, so the negation is x > 2 and x^2 <= 4. The option 'x <= 2 and x^2 > 4' negates the wrong part. The option 'x <= 2 and x^2 <= 4' negates both parts. The option 'x > 2 or x^2 <= 4' keeps a disjunction. The answer is x > 2 and x^2 <= 4."
        constraints: "negate implications via $P \\land \\neg Q$; negate $\\land$ / $\\lor$ via De Morgan"
