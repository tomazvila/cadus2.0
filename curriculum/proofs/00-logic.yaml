        back: 'Switch every $\forall \leftrightarrow \exists$ and replace the conditional $P \to Q$ by $P \land \neg Q$.'
        type: basic

  - id: counterexamples-and-disproof
    name: "Counterexamples and Disproof"
    core: true
    difficulty: 0.58
    drill: false
    answer_kind: numeric
    expected_time_secs: 150
    prerequisites:
      - id: quantifiers
        weight: 0.5
        key: true
      - id: negating-statements
        weight: 0.4
        key: true
    knowledge_points:
      - id: kp1
        name: "Refuting universal statements"
        key_prerequisites: [quantifiers]
        exemplars:
          - problem: "Disprove the claim that every prime number is odd. Give the smallest prime that refutes the claim."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (refuting a universal statement): a single failing instance disproves a claim of the form 'every prime is odd'. Step 2 (verification): test primes from the smallest: 2 is prime, and 2 is even, so it is not odd, which violates the claim. Step 3 (minimality): no smaller prime exists, since 2 is the smallest prime of all. The counterexample is 2."
          - problem: "Disprove the claim that n^2 > 3n + 1 for every integer n greater than 1. Give the smallest integer that refutes the claim."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (refuting a universal statement): look for one integer n greater than 1 where n^2 <= 3n + 1. Step 2 (verification): at n = 2 we get n^2 = 4 and 3n + 1 = 7, and 4 > 7 is false, so the claim fails. Step 3 (minimality): 2 is the smallest integer greater than 1, so no earlier value can be tested. The counterexample is 2."
          - problem: "A student claims that 2^n + 1 is prime for every positive integer n. Give the smallest positive integer that refutes the claim."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (refuting a universal statement): test n = 1, 2, 3 in order until the primality claim breaks. Step 2 (verification): 2^1 + 1 = 3 is prime and 2^2 + 1 = 5 is prime, but 2^3 + 1 = 9 = 3 * 3 is composite, so the claim fails. The smallest counterexample is 3."
          - problem: "Disprove the conjecture that n^2 + n + 41 is prime for every positive integer n. Give the smallest positive integer counterexample."
            answer: "40"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (refuting a universal statement): search for a positive integer n where n^2 + n + 41 is composite. Step 2 (verification): the values for n = 1 up to 39 are all prime, but at n = 40 the value is 1600 + 40 + 41 = 1681 = 41 * 41, which is composite. The smallest counterexample is 40."
          - problem: "A conjecture states that n^2 + 3n + 1 is prime for all positive integers n. Give the smallest value of n that disproves it."
            answer: "6"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (refuting a universal statement): test n = 1, 2, 3, ... for compositeness of n^2 + 3n + 1. Step 2 (verification): the values 5, 11, 19, 29, 41 for n = 1 to 5 are all prime, but at n = 6 the value is 36 + 18 + 1 = 55 = 5 * 11, which is composite. The smallest counterexample is 6."
          - problem: "Someone claims that n! + 1 is prime for every positive integer n. Give the smallest positive integer that refutes the claim."
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (refuting a universal statement): test n = 1, 2, 3, ... for compositeness of n! + 1. Step 2 (verification): 1! + 1 = 2, 2! + 1 = 3 and 3! + 1 = 7 are all prime, but 4! + 1 = 24 + 1 = 25 = 5 * 5 is composite. The smallest counterexample is 4."
        constraints: "one explicit counterexample with verification that it violates the claim"
      - id: kp2
        name: "Testing conjectures"
        key_prerequisites: [quantifiers]
        exemplars:
          - problem: "Conjecture: $n^2 + n + 41$ is prime for every natural number $n$. Find the smallest natural number $n$ for which this conjecture fails."
            answer: "40"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The conjecture is that $n^2 + n + 41$ is prime for every natural number $n$. Step 1, test small cases: $n=0$ gives 41 and the values remain prime through $n=39$. Step 2, compute and factor at $n=40$: $40^2 + 40 + 41 = 1681 = 41 \\cdot 41$. The smallest natural counterexample is n = 40."
          - problem: "Conjecture: the number $2^p - 1$ is prime for every prime number $p$. Find the smallest prime $p$ for which this conjecture fails."
            answer: "11"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The conjecture is that $2^p - 1$ is prime for every prime $p$. Step 1, test small cases: $p=2,3,5,7$ give prime values. Step 2, compute and factor at $p=11$: $2^{11} - 1 = 2047 = 23 \\cdot 89$. The smallest prime counterexample is p = 11."
          - problem: "Conjecture: $n^2 + n + 17$ is prime for every nonnegative integer $n$. Find the smallest nonnegative integer $n$ that disproves the conjecture."
            answer: "16"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The conjecture is that $n^2 + n + 17$ is prime for every nonnegative integer $n$. Step 1, test small cases: $n=0$ gives 17 and $n=1$ gives 19; the values stay prime through $n=15$. Step 2, compute and factor at $n=16$: $16^2 + 16 + 17 = 289 = 17 \\cdot 17$. The smallest nonnegative counterexample is n = 16."
          - problem: "Conjecture: the number $2^n - 1$ is prime for every odd integer $n > 1$. Find the smallest odd integer $n > 1$ for which the conjecture fails."
            answer: "9"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The conjecture is that $2^n - 1$ is prime for every odd integer $n > 1$. Step 1, test small odd cases: $n=3$ gives 7 and $n=5$ gives 31, both prime. Step 2, compute and factor at $n=9$: $2^9 - 1 = 511 = 7 \\cdot 73$. The smallest odd counterexample is n = 9."
          - problem: "Conjecture: $n^3 + n + 1$ is prime for every positive integer $n$. Find the smallest positive integer $n$ that disproves the conjecture."
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The conjecture is that $n^3 + n + 1$ is prime for every positive integer $n$. Step 1, test small cases: $n=1$ gives 3, $n=2$ gives 11, and $n=3$ gives 31, all prime. Step 2, compute and factor at $n=4$: $4^3 + 4 + 1 = 69 = 3 \\cdot 23$. The smallest positive counterexample is n = 4."
          - problem: "Conjecture: $n^2 - n + 41$ is prime for every positive integer $n$. Find the smallest positive integer $n$ for which this conjecture fails."
            answer: "41"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The conjecture is that $n^2 - n + 41$ is prime for every positive integer $n$. Step 1, test small cases: $n=1$ gives 41 and the values remain prime through $n=40$. Step 2, compute and factor at $n=41$: $41^2 - 41 + 41 = 1681 = 41 \\cdot 41$. The smallest positive counterexample is n = 41."
        constraints: "conjectures that hold for small cases; the counterexample must be verified by factoring or computation"
      - id: kp3
        name: "What disproves what"
        key_prerequisites: [negating-statements]
        exemplars:
          - problem: "Consider the statement: if a positive integer n is divisible by 3, then n is divisible by 6. Find the smallest positive integer n that disproves it."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The statement is an implication with a universal quantifier over positive integers. To disprove it, find one n with 3 divides n but 6 does not divide n. The value n = 3 satisfies 3 divides 3, but 6 does not divide 3. Smaller positive integers 1 and 2 do not satisfy the hypothesis. The smallest counterexample is 3."
          - problem: "To disprove the claim that there exists a natural number n with n + 1 = 0, what must be shown?"
            answer: "For every n, n + 1 is not 0"
            answer_contract: {"kind": "label", "options": [["For every n, n + 1 is not 0"], ["There is an n with n + 1 not 0"], ["The value n = 1 fails"], ["The value n = 2 fails"]]}
            solution_sketch: "Negate the existential statement: the negation of there exists n with n + 1 = 0 is for every n, n + 1 is not 0. The correct obligation is to prove every natural number n fails the equation. The option There is an n with n + 1 not 0 is wrong because it is still an existential statement and does not cover every n. The option The value n = 1 fails is wrong because one failed value cannot disprove a claim that some value works. The option The value n = 2 fails is wrong for the same one-value reason. The answer is For every n, n + 1 is not 0."
          - problem: "Disprove the claim that n^2 + 1 is prime for every positive integer n. Give the smallest positive counterexample n."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The claim being disproved is that n^2 + 1 is prime for every positive integer n. Check n = 1: 1^2 + 1 = 2, prime. Check n = 2: 2^2 + 1 = 5, prime. Check n = 3: 3^2 + 1 = 10, not prime. The smallest positive integer is 3."
          - problem: "Find the smallest positive integer n that disproves the statement: if n is prime, then n is odd."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The statement has the form for all positive integers n, if n is prime then n is odd. A counterexample needs a prime that is not odd. The integer 2 is prime and is even, so it is not odd. No smaller positive prime exists. The smallest counterexample is 2."
          - problem: "Which option is the exact logical negation of the statement: for every real number x, x squared is greater than x? Select one option."
            answer: "One x with x squared at most x"
            answer_contract: {"kind": "label", "options": [["One x with x squared at most x"], ["For all x, x squared at most x"], ["One x with x squared above x"], ["No x has x squared at most x"]]}
            solution_sketch: "To disprove a universal statement, it is enough to give one counterexample. The statement for every real x has x squared greater than x is false at x = 0, because 0 squared is at most 0. The correct obligation is to find one x with x squared at most x. The option For all x, x squared at most x is wrong because it proves a stronger universal claim than needed. The option One x with x squared above x is wrong because it confirms the original statement instead of refuting it. The option No x has x squared at most x is wrong because it is the opposite of the needed counterexample. The answer is One x with x squared at most x."
          - problem: "Find the smallest positive integer n that disproves the statement: if n is a perfect square, then n is even."
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The statement claims every perfect-square positive integer is even. A counterexample needs a perfect square that is odd. The integer 1 equals 1^2, so it is a perfect square, and 1 is odd. There is no smaller positive integer. The smallest counterexample is 1."
        constraints: "match the disproof obligation to the negated form of the statement"
    diagnostic_exemplar:
      problem: 'Disprove: "for every positive integer $n$, $n^2 + n + 1$ is prime." Then state what would be needed to disprove the existential claim "$\exists n \in \mathbb{N},\ n^2 = 2$".'
      answer_contract: {kind: none}
      answer: 'Counterexample: $n = 4$ gives $16 + 4 + 1 = 21 = 3 \cdot 7$, which is composite, so the universal claim is false (it does hold for $n = 1, 2, 3$, which is exactly why checking a few cases proves nothing). To disprove the existential claim one must prove its negation, the universal "$\forall n \in \mathbb{N},\ n^2 \ne 2$": no single example helps, but $1^2 = 1 < 2 < 4 = 2^2$ and squaring is increasing on $\mathbb{N}$, so no natural number squares to $2$.'
      solution_sketch: 'A universal claim falls to one counterexample, found by testing small cases; an existential claim falls only to a proof of the corresponding universal.'
    anki_seeds:
      - front: 'What disproves a universal statement $\forall x\, P(x)$?'
        back: 'A single counterexample: one $x$ in the domain with $P(x)$ false.'
        type: basic
      - front: 'What disproves an existential statement $\exists x\, P(x)$?'
        back: 'A proof of the universal negation $\forall x\, \neg P(x)$ — one failed example is not enough.'
        type: basic
      - front: 'What disproves a conditional claim $P \to Q$?'
        back: 'An instance where $P$ is true and $Q$ is false.'
        type: basic

  - id: rules-of-inference
    name: "Rules of Inference"
    core: true
    difficulty: 0.60
    drill: false
    answer_kind: numeric
    expected_time_secs: 150
    prerequisites:
      - id: logical-equivalence
        weight: 0.4
        key: true
      - id: conditional-statements
        weight: 0.4
        key: true
      - id: truth-tables
        weight: 0.0
    knowledge_points:
      - id: kp1
        name: "Modus ponens and modus tollens"
        key_prerequisites: [conditional-statements]
        exemplars:
          - problem: "A coach reasons: if the team wins, the fans cheer. The team wins. State which rule of inference the coach uses, and give the truth value of the statement the fans cheer (1 for true, 0 for false)."
            answer: "rule = ponens; value = 1"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["ponens"], ["tollens"]]}, "name": "rule"}, {"contract": {"kind": "exact"}, "name": "value"}]}
            solution_sketch: "The coach asserts the conditional 'if the team wins, the fans cheer' and then affirms its antecedent, 'the team wins'. Rule check: affirming the antecedent of a conditional is modus ponens; the tollens option is wrong because modus tollens needs the denial of the consequent, which is not given. Modus ponens concludes the consequent, so 'the fans cheer' is true, which has truth value 1. The answer is rule = ponens; value = 1."
          - problem: "From P -> Q and not Q, what does modus tollens conclude? Select the correct statement."
            answer: "not P"
            answer_contract: {"kind": "label", "options": [["P and Q"], ["not P"], ["P or Q"], ["P if Q"]]}
            solution_sketch: "Modus tollens has the form: from P -> Q and not Q, infer not P. Step 1: the premises give the conditional P -> Q and the negation of its consequent, so modus tollens applies and negates the antecedent. The option P and Q is wrong because it affirms the consequent and also contradicts not Q. The option P or Q is wrong because no inference rule here produces a disjunction. The option P if Q is wrong because it only states the converse of the given conditional. The answer is not P."
          - problem: "Given A -> B and A, what is the truth value of B? Give 1 for true and 0 for false. Give the answer as a whole number."
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Modus ponens has the form A -> B and A, so it concludes B. Since the premises hold, B is true. The truth value is 1."
          - problem: "Given A -> B and not B, what is the truth value of A? Give 1 for true and 0 for false. Give the answer as a whole number."
            answer: "0"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Modus tollens has the form A -> B and not B, so it concludes not A. Since not A holds, A is false. The truth value is 0."
          - problem: "Given C -> D and C, what is the truth value of D? Give 1 for true and 0 for false. Give the answer as a whole number."
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Modus ponens has the form C -> D and C, so it concludes D. Since the premises hold, D is true. The truth value is 1."
          - problem: "Given C -> D and not D, what is the truth value of C? Give 1 for true and 0 for false. Give the answer as a whole number."
            answer: "0"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Modus tollens has the form C -> D and not D, so it concludes not C. Since not C holds, C is false. The truth value is 0."
        constraints: "apply modus ponens and modus tollens"
      - id: kp2
        name: "Valid vs. invalid argument forms"
        key_prerequisites: [truth-tables]
        exemplars:
          - problem: "Consider the argument form: If P then Q. Q. Therefore P. Which named argument form is this?"
            answer: "Affirming the consequent"
            answer_contract: {"kind": "label", "options": [["Modus ponens"], ["Modus tollens"], ["Affirming the consequent"], ["Denying the antecedent"]]}
            solution_sketch: "The full form is: If P then Q, Q, therefore P. Rule: match the second premise to each named form. Modus ponens would need P as the second premise, not Q, so it is wrong here. Modus tollens would need not Q as the second premise, so it is wrong here. Denying the antecedent would need not P as the second premise, so it is wrong here. The second premise affirms the consequent Q, so the answer is Affirming the consequent."
          - problem: "Consider the argument form: If P then Q. Not P. Therefore not Q. Which named argument form is this?"
            answer: "Denying the antecedent"
            answer_contract: {"kind": "label", "options": [["Modus ponens"], ["Modus tollens"], ["Affirming the consequent"], ["Denying the antecedent"]]}
            solution_sketch: "The full form is: If P then Q, not P, therefore not Q. Rule: match the second premise to each named form. Modus ponens would need P as the second premise, so it is wrong here. Modus tollens would need not Q as the second premise, so it is wrong here. Affirming the consequent would need Q as the second premise, so it is wrong here. The second premise denies the antecedent P, so the answer is Denying the antecedent."
          - problem: "For the argument form: If P then Q. P. Therefore Q. How many of the four truth-table rows for P and Q make both premises true and the conclusion false?"
            answer: "0"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full form is: If P then Q, P, therefore Q. Rule: a counterexample is a row with both premises true and the conclusion false. Build the four rows for P and Q. Row (T,T) makes both premises true and the conclusion true. Row (T,F) makes P true but If P then Q false. Row (F,T) makes P false. Row (F,F) makes P false. No row makes both premises true and the conclusion false, so the answer is 0."
          - problem: "For the argument form: If P then Q. Q. Therefore P. How many of the four truth-table rows for P and Q make both premises true and the conclusion false?"
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full form is: If P then Q, Q, therefore P. Rule: a counterexample is a row with both premises true and the conclusion false. Build the four rows for P and Q. Row (T,T) makes both premises true and the conclusion true. Row (T,F) makes Q false. Row (F,T) makes If P then Q true and Q true but P false, so it is a counterexample. Row (F,F) makes Q false. One row is a counterexample, so the answer is 1."
          - problem: "For the argument P implies Q; not Q; therefore not P, count the truth-table rows that make both premises true and the conclusion false. Give the count."
            answer: "0"
            answer_contract: {"kind": "exact"}
            solution_sketch: "An invalid argument needs true premises and a false conclusion in the same row. Modus tollens has no such row, so the count is 0."
          - problem: "For the argument form: If P then Q. Not P. Therefore not Q. How many of the four truth-table rows for P and Q make both premises true and the conclusion false?"
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full form is: If P then Q, not P, therefore not Q. Rule: a counterexample is a row with both premises true and the conclusion false. Build the four rows for P and Q. Row (T,T) makes not P false. Row (T,F) makes not P false. Row (F,T) makes If P then Q true and not P true but not Q false, so it is a counterexample. Row (F,F) makes If P then Q true and not P true and not Q true. One row is a counterexample, so the answer is 1."
        constraints: "identify affirming-the-consequent and denying-the-antecedent fallacies"
      - id: kp3
        name: "Chaining inferences"
        key_prerequisites: [logical-equivalence]
        exemplars:
          - problem: "Premises: (P implies Q); (Q implies R); P. Which conclusion follows by chaining these premises? Conclusion bank: 1: R; 2: not R; 3: (R and not R); 4: not P. Give its number."
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Carry the information through the implications or remove the excluded disjunct before applying the next implication. The only forced bank conclusion is 1."
          - problem: "Premises: (P or Q); not P; (Q implies R). Which conclusion follows by chaining these premises? Conclusion bank: 1: not R; 2: R; 3: (R and not R); 4: not (Q implies R). Give its number."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Carry the information through the implications or remove the excluded disjunct before applying the next implication. The only forced bank conclusion is 2."
          - problem: "Premises: (P implies Q); (Q implies R); not R. Which conclusion follows by chaining these premises? Conclusion bank: 1: not not P; 2: (not P and not not P); 3: not P; 4: not not R. Give its number."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Carry the information through the implications or remove the excluded disjunct before applying the next implication. The only forced bank conclusion is 3."
          - problem: "Premises: (P or Q); (R implies not P); R. Which conclusion follows by chaining these premises? Conclusion bank: 1: not Q; 2: (Q and not Q); 3: not R; 4: Q. Give its number."
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Carry the information through the implications or remove the excluded disjunct before applying the next implication. The only forced bank conclusion is 4."
          - problem: "Premises: (P or Q); not P; (Q implies not R). Which conclusion follows by chaining these premises? Conclusion bank: 1: not R; 2: not not R; 3: (not R and not not R); 4: not (Q implies not R). Give its number."
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Carry the information through the implications or remove the excluded disjunct before applying the next implication. The only forced bank conclusion is 1."
          - problem: "Premises: (P implies Q); (Q implies R); (R implies S); P. Which conclusion follows by chaining these premises? Conclusion bank: 1: not S; 2: S; 3: (S and not S); 4: not P. Give its number."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Carry the information through the implications or remove the excluded disjunct before applying the next implication. The only forced bank conclusion is 2."
        constraints: "combine hypothetical/disjunctive syllogism with modus ponens/tollens"
    diagnostic_exemplar:
      problem: 'From $A \to B$, $B \to C$ and $\neg C$, what can you conclude about $A$? And from $A \to B$ together with $B$, may you conclude $A$?'
      answer_contract: {kind: none}
      answer: 'From $A \to B$ and $B \to C$, hypothetical syllogism gives $A \to C$; combined with $\neg C$, modus tollens gives $\neg A$. From $A \to B$ and $B$, however, nothing about $A$ follows — that is the fallacy of affirming the consequent (take $A$: "$n = 2$", $B$: "$n$ is even", and $n = 4$).'
      solution_sketch: 'Chain the two conditionals and apply modus tollens; the second pattern is the classic invalid form.'
    anki_seeds:
      - front: 'Modus ponens?'
        back: 'From $P \to Q$ and $P$, conclude $Q$.'
        type: basic
      - front: 'Modus tollens?'
        back: 'From $P \to Q$ and $\neg Q$, conclude $\neg P$.'
        type: basic
      - front: 'Fallacy of affirming the consequent?'
        back: 'Invalidly concluding $P$ from $P \to Q$ and $Q$.'
        type: basic

