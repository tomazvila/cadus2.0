        exemplars:
          - problem: "Consider the statement: there exists an integer x with x^2 = 9. If the statement is true, give the smallest positive witness x; if it is false, give 0. Find the required value."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The statement is existential over the integers with the predicate x^2 = 9. By the existential witness rule, a single witness in the domain makes the statement true. Test positive integers in order: 1^2 = 1, 2^2 = 4, and 3^2 = 9, so x = 3 is a witness and no smaller positive integer is. The answer is 3."
          - problem: "Consider the statement: there exists n in the set {1, 2, 3} with n^2 = 6. Count the elements of the domain that satisfy the predicate. How many witnesses are there?"
            answer: "0"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The statement is existential over the finite domain {1, 2, 3} with the predicate n^2 = 6. By the existential rule, the statement is true only if some element of the domain satisfies the predicate. Compute the squares of all elements: 1, 4, and 9; none equals 6, so the statement is false and there are no witnesses. The answer is 0."
          - problem: "Consider the statement: there exists an integer x with 3x - 4 = 8. If such an integer exists, find the smallest witness x; otherwise give 0."
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The statement is existential over the integers with the predicate 3x - 4 = 8. By the existential witness rule, solve the equation and check that the solution lies in the domain. Solving gives 3x = 12, so x = 4, which is an integer witness. The answer is 4."
          - problem: "Check the statement: there exists an integer n whose square is 25. Give the smallest witness n if one exists, or 0 if none does."
            answer: "-5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The statement is existential over the integers with the predicate n^2 = 25. By the existential witness rule, solve n^2 = 25 to find the candidate witnesses. The solutions are n = -5 and n = 5, and both are integers, so the smallest witness is -5. The answer is -5."
          - problem: "Decide by witness search whether some integer x satisfies x^2 = -1. Give the smallest witness if one exists, and 0 if there is no witness."
            answer: "0"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The statement is existential over the integers with the predicate x^2 = -1. By the existential witness rule, a witness would be an integer whose square is negative. Every integer square is nonnegative, so no integer satisfies the predicate and the statement is false. The answer is 0."
          - problem: "The claim is that some integer x solves x^2 + x = 6. Determine the smallest witness x, or answer 0 if the claim fails."
            answer: "-3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The statement is existential over the integers with the predicate x^2 + x = 6. By the existential witness rule, solve the equation to find the candidates. Factoring gives (x - 2)(x + 3) = 0, so x = 2 or x = -3, and both are integers. The smallest witness is -3, so the answer is -3."
