    diagnostic_exemplar:
      problem: 'Express "divisibility by $10$ is necessary and sufficient for divisibility by both $2$ and $5$" as a symbolic biconditional, and rewrite "$n^2$ is odd unless $n$ is even" as a conditional.'
      answer_contract: {kind: none}
      answer: '$10 \mid n \leftrightarrow (2 \mid n \land 5 \mid n)$: "necessary" gives $(2 \mid n \land 5 \mid n) \to 10 \mid n$ read one way and "sufficient" the other, so the two conditionals combine into a biconditional. And "$A$ unless $B$" means "if not $B$ then $A$": "if $n$ is not even, then $n^2$ is odd".'
      solution_sketch: 'Necessary-and-sufficient means both directions, i.e. a biconditional; "unless" puts the negated condition in the antecedent.'
    anki_seeds:
      - front: '"$Q$ is necessary for $P$" and "$Q$ is sufficient for $P$" as conditionals?'
        back: 'Necessary: $P \to Q$. Sufficient: $Q \to P$.'
        type: basic
      - front: '"$P$ only if $Q$" as a conditional?'
        back: '$P \to Q$.'
        type: basic
      - front: '"$P$ unless $Q$" as a conditional?'
        back: '$\neg Q \to P$.'
        type: basic

