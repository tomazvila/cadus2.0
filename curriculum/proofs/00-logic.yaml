            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (test the witness y=1): for every x in {1,2}, 1*x = x, so the inner universal claim holds. Step 2 (check uniqueness): y=2 fails at x=1 because 2*1 = 2, not 1. The answer is 1."
          - problem: "Over the real numbers, the statement ∀x ∃y, x*y = 1 is false. Give the real number x that is a counterexample."
            answer: "0"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (negate the universal): a counterexample is a real x for which no real y satisfies x*y = 1. Step 2 (test each candidate): for x not equal to 0, y = 1/x is a real witness, so only x = 0 can fail. Step 3 (verify x = 0): 0*y = 0 for every real y, never 1, so no witness exists. The answer is 0."
          - problem: "Let X = Y = {1,2,3}. A relation R is given by its truth table, with rows x and columns y in increasing order: [[1, 0, 0], [0, 1, 0], [0, 0, 1]]. Decide (a) forall x exists y R(x,y); (b) exists y forall x R(x,y). Give the two truth values in order, using 1 for true and 0 for false."
            answer: "1, 0"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "In (a), the witness may depend on the row; in (b), one column must work in every row. The resulting truth values are 1, 0."
          - problem: "Over the integers, the statement ∀x ∃y, x = 2y is false. Give the smallest positive integer x that is a counterexample."
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (negate the universal): a counterexample is an integer x for which x = 2y has no integer solution y. Step 2 (test x=1): the equation 1 = 2y gives y = 1/2, not an integer. The answer is 1."
          - problem: "Let X = Y = {1,2,3}. A relation R is given by its truth table, with rows x and columns y in increasing order: [[0, 1, 1], [1, 1, 0], [0, 1, 0]]. Decide (a) forall x exists y R(x,y); (b) exists y forall x R(x,y). Give the two truth values in order, using 1 for true and 0 for false."
            answer: "1, 1"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "In (a), the witness may depend on the row; in (b), one column must work in every row. The resulting truth values are 1, 1."
          - problem: "Over the domain {0, 1, 2, 3}, the statement ∀x ∃y, y^2 = x is false. Give the smallest counterexample x in the domain."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (negate the universal): a counterexample is an x with no y in {0,1,2,3} whose square is x. Step 2 (test x=2): the squares 0^2=0, 1^2=1, 2^2=4, and 3^2=9 skip 2. The answer is 2."
        constraints: "nested quantifiers over small finite domains or $\\mathbb{R}$/$\\mathbb{Z}$; require a witness or counterexample"
    diagnostic_exemplar:
      problem: 'Is $\exists x \in \mathbb{N},\ \forall y \in \mathbb{N},\ x \le y$ true? Identify such an $x$ if so.'
      answer_contract: {kind: none}
      answer: 'True; the least natural number works ($0$, or $1$ under the convention $\mathbb{N} = \{1, 2, \dots\}$).'
      solution_sketch: '$\mathbb{N}$ has a least element $x$ with $x \le y$ for every $y$, so the statement holds.'
    anki_seeds:
      - front: 'Does the order of $\forall$ and $\exists$ matter?'
        back: 'Yes. $\forall x\, \exists y$ can be true while $\exists y\, \forall x$ is false.'
        type: basic
      - front: 'In $\forall x\, \exists y\, P(x, y)$, what may $y$ depend on?'
        back: 'On $x$: a different witness $y$ may be chosen for each $x$.'
        type: basic

