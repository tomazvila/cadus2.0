    diagnostic_exemplar:
      problem: 'Translate "some perfect square is odd" using quantifiers and give its truth value; then decide whether "for every $n \in \{2, 4, 6\}$, $n^2 + 1$ is prime" is true.'
      answer_contract: {kind: none}
      answer: '$\exists n \in \mathbb{Z},\ (n \text{ is a perfect square} \land n \text{ is odd})$ — true, witnessed by $n = 9 = 3^2$. The universal statement is also true: $2^2 + 1 = 5$, $4^2 + 1 = 17$ and $6^2 + 1 = 37$ are all prime, and those are the only three cases.'
      solution_sketch: 'An existential statement needs a single witness; a universal statement over a finite domain needs every case checked.'
    anki_seeds:
      - front: 'Meaning of $\forall x\, P(x)$ and $\exists x\, P(x)$?'
        back: '$\forall$: $P(x)$ holds for every $x$ in the domain. $\exists$: $P(x)$ holds for at least one $x$.'
        type: basic
      - front: 'Translating "every $A$ is $B$" vs. "some $A$ is $B$"?'
        back: 'Every: $\forall x\,(A(x) \to B(x))$. Some: $\exists x\,(A(x) \land B(x))$.'
        type: basic

