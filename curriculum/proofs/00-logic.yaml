          - problem: "All variables range independently over nonempty domains, and R is an arbitrary predicate. Negate each complete statement: (a) forall x, forall y, exists z, R(x,y,z); (b) forall x, exists y, forall z, R(x,y,z); (c) forall x, exists y, forall z, not R(x,y,z). Formula bank: 1: forall x, forall y, forall z, R(x,y,z); 2: exists x, forall y, exists z, R(x,y,z); 3: forall x, forall y, forall z, not R(x,y,z); 4: exists x, exists y, forall z, not R(x,y,z); 5: forall x, forall y, exists z, R(x,y,z); 6: exists x, forall y, exists z, not R(x,y,z). Give the bank numbers for (a), (b), (c), in order."
