    diagnostic_exemplar:
      problem: 'Negate, pushing the negation all the way in: "$\forall \epsilon > 0\ \exists n \in \mathbb{N}$, if $n > 10$ then $1/n < \epsilon$".'
      answer_contract: {kind: none}
      answer: '$\exists \epsilon > 0\ \forall n \in \mathbb{N},\ (n > 10 \ \land\ 1/n \ge \epsilon)$. Each quantifier flips as the negation passes it ($\forall$ to $\exists$, then $\exists$ to $\forall$), and the negation of the conditional "$n > 10 \to 1/n < \epsilon$" is the conjunction "$n > 10$ and $1/n \ge \epsilon$".'
