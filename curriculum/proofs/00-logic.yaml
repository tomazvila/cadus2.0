unit: logic
course: proofs
module: "Logic"
topics:
  - id: propositions-and-truth-values
    name: "Propositions and Truth Values"
    core: true
    difficulty: 0.40
    drill: false
    answer_kind: numeric
    expected_time_secs: 90
    prerequisites:
      - id: evaluating-expressions
        weight: 0.2
        key: true
    knowledge_points:
      - id: kp1
        name: "Propositions vs. non-propositions"
        key_prerequisites: []
        exemplars:
          - problem: "Classify the statement \"9 is a prime number.\" Which category fits it?"
            answer: "proposition"
            answer_contract: {"kind": "label", "options": [["proposition"], ["open sentence"], ["command"], ["paradox"]]}
            solution_sketch: "Step 1: Apply the definition — a proposition is a declarative statement that is either true or false. The statement that 9 is a prime number is declarative, and it is false since 9 equals 3 times 3, so it still has a truth value. Step 2: Rule out the other categories. It is not an open sentence because it contains no variable; it is not a command because it tells no one to act; it is not a paradox because it makes no claim about itself. The correct category is proposition."
          - problem: "Classify the statement \"This statement is false.\" What category does it fall into?"
            answer: "paradox"
            answer_contract: {"kind": "label", "options": [["proposition"], ["open sentence"], ["command"], ["paradox"]]}
            solution_sketch: "Step 1: Test both truth values. If the statement is true, then what it says holds, so it must be false — a contradiction. If it is false, then what it says fails, so it must be true — again a contradiction. Step 2: Since no consistent truth value can be assigned, it is not a proposition; it is not an open sentence because it has no variable, and it is not a command because it tells no one to act. The correct category is paradox."
          - problem: "Here are four items: (a) 3 + 4 = 7. (b) y > 10. (c) Close the window. (d) 15 is a prime number. How many of these items are propositions?"
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: Apply the definition of a proposition, a declarative statement with a truth value. Item (a), 3 + 4 = 7, is declarative and true, so it is a proposition. Item (b), y > 10, contains the variable y, so it is an open sentence. Item (c), Close the window, tells someone to act, so it is a command. Item (d), 15 is a prime number, is declarative and false, so it is a proposition. Step 2: Count the propositions: items (a) and (d) qualify, so the answer is 2."
          - problem: "A list has four entries: (a) 5 is an odd number. (b) n is even. (c) Be quiet. (d) 7 > 2. How many entries in the list are open sentences?"
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: Apply the definition of an open sentence, a statement whose truth depends on the value of a variable. Entry (a), 5 is an odd number, is declarative and true, so it is a proposition. Entry (b), n is even, depends on the variable n, so it is an open sentence. Entry (c), Be quiet, tells someone to act, so it is a command. Entry (d), 7 > 2, is declarative and true, so it is a proposition. Step 2: Count the open sentences: only entry (b) qualifies, so the answer is 1."
          - problem: "Four statements appear on a quiz: (a) Solve the equation. (b) Please sit down. (c) Turn off your phone. (d) 2 + 2 = 5. How many of these statements are commands?"
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: Apply the definition of a command, a statement that tells someone to do something and has no truth value. Statement (a), Solve the equation, is an order, so it is a command. Statement (b), Please sit down, is an order, so it is a command. Statement (c), Turn off your phone, is an order, so it is a command. Statement (d), 2 + 2 = 5, is declarative and false, so it is a proposition. Step 2: Count the commands: statements (a), (b), and (c) qualify, so the answer is 3."
          - problem: "A teacher shows four statements: (a) This statement is false. (b) 9 + 5 = 14. (c) Sit down. (d) t is a prime number. How many of these statements are not propositions?"
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: Classify each statement. Statement (a), This statement is false, refers to itself: if it is true it is false, and if it is false it is true, so it is a paradox. Statement (b), 9 + 5 = 14, is declarative and false, so it is a proposition. Statement (c), Sit down, is an order, so it is a command. Statement (d), t is a prime number, depends on the variable t, so it is an open sentence. Step 2: Count the non-propositions: they come from statements (a), (c), and (d), so the answer is 3."
        constraints: "classify statements as proposition / open sentence / command / paradox"
      - id: kp2
        name: "Truth values of concrete statements"
        key_prerequisites: []
        exemplars:
          - problem: "Consider the statement \"$5/6 + 3/8 = 3/4$\". State its truth value and give the correct value of the left side as a fraction."
            answer: "verdict = fails; value = 29/24"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["holds"], ["fails"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "value"}]}
            solution_sketch: "The statement is $5/6 + 3/8 = 3/4$. Step 1 (common denominator 24): $5/6 = 20/24$ and $3/8 = 9/24$. Step 2 (add the fractions): $20/24 + 9/24 = 29/24$. Step 3 (compare the sides): $3/4 = 18/24$, and $29/24$ differs from $18/24$, so the statement fails. The option holds is wrong because the left side is $29/24$, not $3/4$. The answer is verdict = fails; value = 29/24."
          - problem: "Consider the statement \"$\\sqrt{2} > 1.4$\". State its truth value and give the value of $\\sqrt{2}$ to 2 decimals as a decimal."
            answer: "verdict = valid; value = 1.41"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["valid"], ["invalid"]]}, "name": "verdict"}, {"contract": {"decimals": 2, "kind": "approx"}, "name": "value"}]}
            solution_sketch: "The statement is $\\sqrt{2} > 1.4$. Step 1 (bound the radical): $1.41^2 = 1.9881 < 2$ and $1.42^2 = 2.0164 > 2$, so $\\sqrt{2}$ lies between $1.41$ and $1.42$. Step 2 (round): $\\sqrt{2} \\approx 1.4142$, which is $1.41$ to 2 decimals. Step 3 (compare): $1.41 > 1.4$, so the statement is valid. The option invalid is wrong because $\\sqrt{2}$ is about $1.41$, which exceeds $1.4$. The answer is verdict = valid; value = 1.41."
          - problem: "Consider the statement \"$2^{10} = 999 + 25$\". State its truth value and give the value of $2^{10}$."
            answer: "verdict = correct; value = 1024"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["correct"], ["incorrect"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "value"}]}
            solution_sketch: "The statement is $2^{10} = 999 + 25$. Step 1 (evaluate the power by doubling): $2^5 = 32$ and $32 \\cdot 32 = 1024$, so $2^{10} = 1024$. Step 2 (evaluate the sum): $999 + 25 = 1024$. Step 3 (compare the sides): both sides equal $1024$, so the statement is correct. The option incorrect is wrong because $2^{10} = 1024$ and $999 + 25 = 1024$. The answer is verdict = correct; value = 1024."
          - problem: "Consider the statement \"$2 + 3 \\cdot 4^2 = 100$\". State its truth value and give the value of the left side."
            answer: "verdict = differs; value = 50"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["matches"], ["differs"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "value"}]}
            solution_sketch: "The statement is $2 + 3 \\cdot 4^2 = 100$. Step 1 (exponents first): $4^2 = 16$. Step 2 (multiplication before addition): $3 \\cdot 16 = 48$. Step 3 (addition last): $2 + 48 = 50$. Step 4 (compare the sides): $50$ differs from $100$, so the statement is false. The option matches is wrong because the order of operations gives $50$, not $100$. The answer is verdict = differs; value = 50."
          - problem: "A card shows the statement \"$\\sqrt{80} < 9$\". Compute the left side to decide whether the statement is true, and give the value of $\\sqrt{80}$ to 2 decimals as a decimal."
            answer: "8.94"
            answer_contract: {"decimals": 2, "kind": "approx"}
            solution_sketch: "Full object: the left side of $\\sqrt{80} < 9$ is $8.94$, so the statement is true. Step 1 (bound the radical): $8.9^2 = 79.21 < 80$ and $8.95^2 = 80.1025 > 80$, so $\\sqrt{80}$ lies between $8.9$ and $8.95$. Step 2 (round): $\\sqrt{80} \\approx 8.9443$, which is $8.94$ to 2 decimals. Step 3 (decide): $8.94 < 9$, so the statement on the card is true. The answer is 8.94."
          - problem: "A card shows the statement \"$3/8 + 1/4 > 0.6$\". Compute the left side to decide whether the statement is true, and give the value of $3/8 + 1/4$ to 3 decimals as a decimal."
            answer: "0.625"
            answer_contract: {"decimals": 3, "kind": "approx"}
            solution_sketch: "Full object: the left side of $3/8 + 1/4 > 0.6$ is $0.625$, so the statement is true. Step 1 (common denominator 8): $1/4 = 2/8$. Step 2 (add the fractions): $3/8 + 2/8 = 5/8$. Step 3 (decimal form): $5/8 = 0.625$ to 3 decimals. Step 4 (decide): $0.625 > 0.6$, so the statement on the card is true. The answer is 0.625."
        constraints: "concrete arithmetic statements; the learner must compute the truth value"
      - id: kp3
        name: "Open sentences become propositions by substitution"
        key_prerequisites: [evaluating-expressions]
        exemplars:
          - problem: "The open sentence 3x - 2 > 7 is not a proposition. Substitute x = 4. Give the truth value of the resulting proposition and the value of its left side, in the form verdict = a; L = b."
            answer: "verdict = true; L = 10"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["true"], ["false"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "L"}]}
            solution_sketch: "Step 1 (substitution rule): substitute x = 4 into the open sentence 3x - 2 > 7 to get the proposition 3(4) - 2 > 7. Step 2 (order of operations): the left side is 12 - 2 = 10. Step 3 (comparison): 10 > 7 holds, so the verdict is true and the left side is 10; the wrong verdict false comes from reading the inequality backwards. The answer is verdict = true; L = 10."
          - problem: "The open sentence x^2 = 5 is not a proposition. Substitute x = -3. Give the truth value of the resulting proposition and the value of its left side, in the form verdict = a; L = b."
            answer: "verdict = false; L = 9"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["true"], ["false"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "L"}]}
            solution_sketch: "Step 1 (substitution rule): substitute x = -3 into the open sentence x^2 = 5 to get the proposition (-3)^2 = 5. Step 2 (power evaluation): the left side is (-3)^2 = 9. Step 3 (comparison): 9 does not equal 5, so the verdict is false; the wrong verdict true comes from squaring the 5 as well. The answer is verdict = false; L = 9."
          - problem: "The open sentence x/2 = 3 is not a proposition. Substitute x = 7. Give the truth value of the resulting proposition and the value of its left side, in the form verdict = a; L = b."
            answer: "verdict = false; L = 7/2"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["true"], ["false"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "L"}]}
            solution_sketch: "Step 1 (substitution rule): substitute x = 7 into the open sentence x/2 = 3 to get the proposition 7/2 = 3. Step 2 (evaluation of the quotient): the left side is 7/2. Step 3 (comparison): 7/2 is not 3, so the verdict is false. The answer is verdict = false; L = 7/2."
          - problem: "The open sentence 2x^2 - x = 12 is not a proposition. Substitute x = 3 and evaluate the left side of the resulting proposition. Find its value."
            answer: "15"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (substitution rule): substitute x = 3 into the open sentence 2x^2 - x = 12 to get the proposition 2(3)^2 - 3 = 12. Step 2 (order of operations): the left side is 18 - 3 = 15. Step 3 (comparison): the left side is 15, which does not equal the right side 12. The answer is 15."
          - problem: "The open sentence x^2 + x = 22 is not a proposition. Substitute x = 4 and evaluate the left side of the resulting proposition. Find its value."
            answer: "20"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (substitution rule): substitute x = 4 into the open sentence x^2 + x = 22 to get the proposition 4^2 + 4 = 22. Step 2 (order of operations): the left side is 16 + 4 = 20. Step 3 (comparison): the left side is 20, which does not equal the right side 22. The answer is 20."
          - problem: "The open sentence x^2 = 5x - 6 is not a proposition. Substitute each of the values 1, 2, 3, 4, 5 in turn and give the set of values for which the resulting proposition is true."
            answer: "{2, 3}"
            answer_contract: {"kind": "set"}
            solution_sketch: "Step 1 (substitution rule): substitute each candidate into the open sentence x^2 = 5x - 6 and evaluate both sides. Step 2 (evaluation): x = 1 gives 1 and -1; x = 2 gives 4 and 4; x = 3 gives 9 and 9; x = 4 gives 16 and 14; x = 5 gives 25 and 19. Step 3 (comparison): the proposition is true exactly for x = 2 and x = 3. The answer is {2, 3}."
        constraints: "one-variable open sentences; substitute a specific value and evaluate"
    diagnostic_exemplar:
      problem: 'Classify each as a proposition (with truth value), open sentence, or neither: (a) "$5 < 7$" (b) "$x + 2 = 9$" (c) "Study hard." (d) "$91$ is prime."'
      answer_contract: {kind: none}
      answer: '(a) proposition, true; (b) open sentence; (c) neither (a command); (d) proposition, false ($91 = 7 \cdot 13$).'
      solution_sketch: '(a) and (d) are declaratives with definite truth values; (b) depends on $x$; (c) is imperative. $91 = 7 \cdot 13$ makes (d) false.'
    anki_seeds:
      - front: 'What is a proposition?'
        back: 'A declarative statement that is either true or false, but not both.'
        type: basic
      - front: 'How does an open sentence like "$x > 3$" become a proposition?'
        back: 'By substituting a specific value for the variable (or by quantifying it).'
        type: basic

  - id: logical-connectives
    name: "Logical Connectives"
    core: true
    difficulty: 0.42
    drill: false
    answer_kind: numeric
    expected_time_secs: 90
    prerequisites:
      - id: propositions-and-truth-values
        weight: 0.6
        key: true
    knowledge_points:
      - id: kp1
        name: "Negation"
        key_prerequisites: [propositions-and-truth-values]
        exemplars:
          - problem: "Consider the proposition x > 6. Give its negation as an inequality in x."
            answer: "x <= 6"
            answer_contract: {"kind": "inequality_union"}
            solution_sketch: "The proposition is x > 6. Negating a strict greater-than inequality reverses the relation and includes the endpoint, so x > 6 becomes x <= 6. The answer is x <= 6."
          - problem: "Consider the proposition x < 4. Give its negation as an inequality in x."
            answer: "x >= 4"
            answer_contract: {"kind": "inequality_union"}
            solution_sketch: "The proposition is x < 4. Negating a strict less-than inequality reverses the relation and includes the endpoint, so x < 4 becomes x >= 4. The answer is x >= 4."
          - problem: "Consider the proposition x >= -2. Give its negation as an inequality in x."
            answer: "x < -2"
            answer_contract: {"kind": "inequality_union"}
            solution_sketch: "The proposition is x >= -2. Negating a greater-than-or-equal inequality reverses it to a strict less-than inequality, so x >= -2 becomes x < -2. The answer is x < -2."
          - problem: "Consider the proposition x <= 5. Give its negation as an inequality in x."
            answer: "x > 5"
            answer_contract: {"kind": "inequality_union"}
            solution_sketch: "The proposition is x <= 5. Negating a less-than-or-equal inequality reverses it to a strict greater-than inequality, so x <= 5 becomes x > 5. The answer is x > 5."
          - problem: "Let P be the proposition 2x + 3 > 9. Using 1 for true and 0 for false, evaluate the truth value of not P when x = 1."
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1, evaluate the inner proposition: at x = 1 the statement 2x + 3 > 9 reads 5 > 9, which is false, so P is false. Step 2, negation flips the truth value of P, so not P is true, coded as 1. The answer is 1."
          - problem: "Consider the proposition P: x lies in the closed interval [1, 4]. Give the negation of P as an inequality in x."
            answer: "x < 1 or x > 4"
            answer_contract: {"kind": "inequality_union"}
            solution_sketch: "The proposition says x is between 1 and 4 inclusive. Its negation says x is outside the interval, so x must fall below 1 or above 4, giving x < 1 or x > 4. The answer is x < 1 or x > 4."
        constraints: "single-proposition negations; no quantifiers"
      - id: kp2
        name: "Conjunction and disjunction"
        key_prerequisites: [propositions-and-truth-values]
        exemplars:
          - problem: "Let P and Q be propositions. Determine how many rows of the truth table for $\\neg P \\land Q$ have the value true."
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full object is the formula $\\neg P \\land Q$. List the four rows for $(P,Q)$: TT, TF, FT, FF. Apply negation to P and conjunction with Q: only FT makes $\\neg P$ true and Q true. The number of true rows is 1."
          - problem: "Let P and Q be propositions. Determine how many rows of the truth table for $P \\lor \\neg Q$ have the value true."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full object is the formula $P \\lor \\neg Q$. The four rows are TT, TF, FT, FF. By the disjunction rule, $P \\lor \\neg Q$ is false only on the row where P is false and Q is true (FT), so three rows are true. The number of true rows is 3."
          - problem: "Let P and Q be propositions. Determine how many rows of the truth table for $(P \\land Q) \\lor (\\neg P \\land \\neg Q)$ have the value true."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full object is $(P \\land Q) \\lor (\\neg P \\land \\neg Q)$. The four rows are TT, TF, FT, FF. The conjunction $P \\land Q$ holds on TT and $\\neg P \\land \\neg Q$ holds on FF, so the disjunction is true on two rows. The number of true rows is 2."
          - problem: "Let P and Q be propositions. Determine how many rows of the truth table for $(P \\lor \\neg P) \\land (Q \\lor \\neg Q)$ have the value true."
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full object is $(P \\lor \\neg P) \\land (Q \\lor \\neg Q)$. In every row, one of $P$ and $\\neg P$ is true, and one of $Q$ and $\\neg Q$ is true. The conjunction of two true disjunctions is true in all four rows. The number of true rows is 4."
          - problem: "Let P and Q be propositions. Determine how many rows of the truth table for $P \\land Q \\land \\neg P$ have the value true."
            answer: "0"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full object is $P \\land Q \\land \\neg P$. For the conjunction to be true, $P$, $Q$, and $\\neg P$ must all be true. No row can make both $P$ and $\\neg P$ true, so the formula is false in all four rows. The number of true rows is 0."
          - problem: "Let P and Q be propositions. Determine how many rows of the truth table for $\\neg P \\lor Q$ have the value true."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full object is $\\neg P \\lor Q$. The four rows are TT, TF, FT, FF. By the disjunction rule, $\\neg P \\lor Q$ is false only on the row where P is true and Q is false (TF), so three rows are true. The number of true rows is 3."
        constraints: "connectives limited to negation, conjunction, disjunction; two atomic propositions"
      - id: kp3
        name: "Mathematical or is inclusive"
        key_prerequisites: [propositions-and-truth-values]
        exemplars:
          - problem: "Let P be the statement '12 mod 5 = 2' and Q the statement '12 mod 4 = 0'. Determine the truth value of the disjunction P or Q, giving 1 for true and 0 for false."
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1, inclusive-or rule: the disjunction P or Q is true when at least one disjunct is true, and it is still true when both are true. Step 2, check P: 12 mod 5 = 2, so P is true. Step 3, check Q: 12 mod 4 = 0, so Q is true as well. Both disjuncts are true, and the inclusive reading keeps the disjunction true. The truth value is 1."
          - problem: "For the statements P: 15 mod 2 = 0 and Q: 15 mod 5 = 0, give the truth value of the disjunction P or Q as 1 for true and 0 for false."
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1, inclusive-or rule: one true disjunct is enough to make P or Q true. Step 2, check P: 15 mod 2 = 1, so P is false. Step 3, check Q: 15 mod 5 = 0, so Q is true. Since at least one disjunct holds, the disjunction is true. The truth value is 1."
          - problem: "Check the statements P: 7 mod 2 = 0 and Q: 7 mod 3 = 0. What is the truth value of the disjunction P or Q, written as 1 for true and 0 for false?"
            answer: "0"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1, inclusive-or rule: the disjunction is false only when both disjuncts are false. Step 2, check P: 7 mod 2 = 1, so P is false. Step 3, check Q: 7 mod 3 = 1, so Q is false. Neither disjunct holds, so the disjunction is false. The truth value is 0."
          - problem: "Consider the truth table of the disjunction P or Q over the four rows T-T, T-F, F-T and F-F, counting the row where both P and Q are true as well. How many rows of this truth table have the value 1?"
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1, inclusive-or rule: P or Q is true in every row with at least one true disjunct, including the row T-T where both hold. Step 2, mark the true rows: T-T gives 1, T-F gives 1, F-T gives 1, and only F-F gives 0. Step 3, count the rows of value 1: there are 3. The count of true rows is 3."
          - problem: "Treat the or as inclusive, so a number satisfying both parts is counted once. How many of the integers from 1 to 10 make the statement 'n mod 2 = 0 or n mod 3 = 0' true?"
            answer: "7"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1, split by disjunct: the even numbers are 2, 4, 6, 8, 10, which gives 5 values, and the multiples of 3 are 3, 6, 9, which gives 3 values. Step 2, inclusive-or rule: the overlap, the number 6 that satisfies both disjuncts, is counted only once. Step 3, combine: 5 + 3 - 1 = 7 integers satisfy the disjunction. The count is 7."
          - problem: "Treat the or as inclusive when you decide which numbers fail. How many of the integers from 1 to 12 make the statement 'n mod 2 = 0 or n mod 3 = 0' false?"
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1, inclusive-or rule: the disjunction is false only when both disjuncts fail, that is, when n is odd and not a multiple of 3. Step 2, list the odd numbers from 1 to 12: 1, 3, 5, 7, 9, 11. Step 3, remove the multiples of 3 among them, namely 3 and 9, leaving 1, 5, 7, 11. Counting these failing values gives 4. The count is 4."
        constraints: "emphasize that both disjuncts true still makes the disjunction true"
    diagnostic_exemplar:
      problem: 'Let $P$: "$6$ is even", $Q$: "$6$ is divisible by $3$", $R$: "$6$ is prime". Give the truth values of $P \land Q$, $P \lor Q$ and $\neg R$, and say whether the truth of $P \lor Q$ depends on reading "or" inclusively.'
      answer_contract: {kind: none}
      answer: '$P$ and $Q$ are true and $R$ is false, so $P \land Q$ is true, $P \lor Q$ is true and $\neg R$ is true. Both disjuncts of $P \lor Q$ happen to be true, and mathematical "or" is inclusive, so the disjunction counts as true; an exclusive reading of "or" would call it false.'
      solution_sketch: 'Evaluate the three statements about $6$, then note that a disjunction with both parts true is still true because mathematical "or" is inclusive.'
    anki_seeds:
      - front: 'Symbols for negation, conjunction, disjunction?'
        back: '$\neg$ (not), $\land$ (and), $\lor$ (or).'
        type: basic
      - front: 'Is mathematical "or" inclusive or exclusive?'
        back: 'Inclusive: $P \lor Q$ is true when at least one of $P, Q$ is true, including when both are.'
        type: basic

  - id: propositional-logic
    name: "Propositional Logic"
    core: true
    difficulty: 0.45
    drill: false
    answer_kind: numeric
    expected_time_secs: 120
    prerequisites:
      - id: logical-connectives
        weight: 0.6
        key: true
      - id: propositions-and-truth-values
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: "Conditional and biconditional"
        key_prerequisites: [logical-connectives]
        exemplars:
          - problem: "Let P be the statement 'n is divisible by 4' and Q be the statement 'n is divisible by 6'. Consider the conditional P -> Q. State the role of P in this conditional, and give how many of the values n = 4, 6, 8, 12 make the conditional true."
            answer: "role = hypothesis; count = 2"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["hypothesis"], ["conclusion"]]}, "name": "role"}, {"contract": {"kind": "exact"}, "name": "count"}]}
            solution_sketch: "The full object is the conditional P -> Q with P: n is divisible by 4 and Q: n is divisible by 6. Step 1: by the definition of the conditional, the part linked to 'if' is the hypothesis, so P has the role hypothesis; the option conclusion is wrong because it names the part linked to 'then'. Step 2: evaluate P -> Q for each n by the conditional truth table: n = 4 gives true implies false, so false; n = 6 gives false implies true, so true; n = 8 gives true implies false, so false; n = 12 gives true implies true, so true. Step 3: two of the four values make the conditional true. The answer is role = hypothesis; count = 2."
          - problem: "For the formula E <-> D, how many rows of its truth table have value true? Give the number."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full object is the biconditional E <-> D. Step 1: list the four truth assignments for E and D. Step 2: by the truth table for the biconditional, E <-> D is true when E and D have the same truth value. Step 3: the matching rows are TT and FF, so there are 2 true rows. The answer is 2."
          - problem: "Let P be the statement 'n is a multiple of 3' and Q be the statement 'n is a multiple of 6'. Consider the conditional P -> Q. State the role of Q in this conditional, and give how many of the values n = 6, 9, 12, 5 make the conditional true."
            answer: "role = conclusion; count = 3"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["hypothesis"], ["conclusion"]]}, "name": "role"}, {"contract": {"kind": "exact"}, "name": "count"}]}
            solution_sketch: "The full object is the conditional P -> Q with P: n is a multiple of 3 and Q: n is a multiple of 6. Step 1: by the definition of the conditional, the part linked to 'then' is the conclusion, so Q has the role conclusion; the option hypothesis is wrong because it names the part linked to 'if'. Step 2: evaluate P -> Q for each n by the conditional truth table: n = 6 gives true implies true, so true; n = 9 gives true implies false, so false; n = 12 gives true implies true, so true; n = 5 gives false implies false, so true. Step 3: three of the four values make the conditional true. The answer is role = conclusion; count = 3."
          - problem: "For the formula P -> Q, how many rows of its truth table have value true? Give the number."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full object is the conditional P -> Q. Step 1: list the four truth assignments for P and Q. Step 2: by the truth table for the conditional, P -> Q is false only on the row P true and Q false. Step 3: the other three rows are true. The answer is 3."
          - problem: "For the formula (P -> Q) <-> R, how many rows of its truth table have value true? Give the number."
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full object is (P -> Q) <-> R. Step 1: build the inner conditional P -> Q by its truth table. Step 2: combine that column with R by the biconditional truth table. Step 3: the true rows are PQR = 001, 011, 100, and 111, so the count is 4. The answer is 4."
          - problem: "For the formula P -> (Q <-> R), how many rows of its truth table have value true? Give the number."
            answer: "6"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full object is P -> (Q <-> R). Step 1: build the inner biconditional Q <-> R by its truth table. Step 2: use the conditional truth table for the outer arrow. Step 3: the only false rows are PQR = 101 and 110, so the count is 6. The answer is 6."
        constraints: "identify hypothesis and conclusion; distinguish $\\to$ from $\\leftrightarrow$"
      - id: kp2
        name: "Translating compound sentences into symbols"
        key_prerequisites: [logical-connectives]
        exemplars:
          - problem: 'With $R$: "it rains", $U$: "I have an umbrella", $W$: "I get wet", symbolize "if it rains and I have no umbrella, then I get wet".'
            answer_contract: {kind: none}
            answer: '$(R \land \neg U) \to W$'
            solution_sketch: 'The hypothesis is the conjunction $R \land \neg U$; the whole sentence is a conditional into $W$.'
          - problem: 'With $E$: "$n$ is even", $O$: "$n$ is odd", symbolize "$n$ is even or odd, but not both".'
            answer_contract: {kind: none}
            answer: '$(E \lor O) \land \neg(E \land O)$'
            solution_sketch: '"or" gives $E \lor O$; "but not both" adds the conjunct $\neg(E \land O)$ (an exclusive or built from the basic connectives).'
        constraints: "three atomic propositions max; mixed connectives with one level of grouping"
      - id: kp3
        name: "Reading symbolic formulas back into English"
        key_prerequisites: [logical-connectives]
        exemplars:
          - problem: 'With $P$: "it is sunny", $Q$: "it is windy", translate $\neg(P \land Q)$ into English.'
            answer_contract: {kind: none}
            answer: 'It is not the case that it is both sunny and windy.'
            solution_sketch: 'The negation applies to the whole conjunction, not to either part alone.'
          - problem: 'With $P$: "$n$ is prime", $Q$: "$n$ is odd", $R$: "$n > 2$", translate $(P \land R) \to Q$ into English.'
            answer_contract: {kind: none}
            answer: 'If $n$ is prime and $n > 2$, then $n$ is odd.'
            solution_sketch: 'The conditional has the conjunction $P \land R$ as hypothesis and $Q$ as conclusion.'
        constraints: "respect grouping; the English rendering must show what the negation or conditional applies to"
    diagnostic_exemplar:
      problem: 'With $S$: "it snows", $C$: "the road is closed", $L$: "I am late": symbolise "if it snows and the road is closed, then I am late", and translate $L \leftrightarrow (S \lor C)$ back into English.'
      answer_contract: {kind: none}
      answer: 'The first is $(S \land C) \to L$. The second reads: "I am late if and only if it snows or the road is closed."'
      solution_sketch: 'Put the conjunction in the antecedent of the conditional; then read $\leftrightarrow$ as "if and only if", keeping the disjunction intact.'
    anki_seeds:
      - front: 'Symbols for the conditional and the biconditional?'
        back: '$\to$ (if...then) and $\leftrightarrow$ (if and only if).'
        type: basic
      - front: 'In $P \to Q$, what are $P$ and $Q$ called?'
        back: '$P$ is the hypothesis (antecedent); $Q$ is the conclusion (consequent).'
        type: basic

  - id: truth-tables-basic-connectives
    name: "Truth Tables for Basic Connectives"
    core: true
    difficulty: 0.43
    drill: false               # L4 audit: multi-row evaluation, not a 6s recall skill
    answer_kind: numeric
    expected_time_secs: 60
    prerequisites:
      - id: logical-connectives
        weight: 0.6
        key: true
    knowledge_points:
      - id: kp1
        name: "Negation and conjunction tables"
        key_prerequisites: [logical-connectives]
        exemplars:
          - problem: 'Give the truth table of $\neg P$.'
            answer_contract: {kind: none}
            answer: 'T->F, F->T.'
            solution_sketch: 'Negation flips the truth value.'
          - problem: 'Give the truth values of $P \land Q$.'
            answer_contract: {kind: none}
            answer: 'TT->T, TF->F, FT->F, FF->F.'
            solution_sketch: 'A conjunction is true only when both conjuncts are true.'
        constraints: "single connective; enumerate every row"
      - id: kp2
        name: "Disjunction table"
        key_prerequisites: [logical-connectives]
        exemplars:
          - problem: "Encode true as 1 and false as 0. Give the values of P or Q for all four combinations of (P, Q), in the order (1,1), (1,0), (0,1), (0,0), as a comma-separated list."
            answer: "1, 1, 1, 0"
            answer_contract: {"kind": "list", "member": {"kind": "exact"}, "ordered": true}
            solution_sketch: "Step 1 uses the disjunction rule: P or Q is false only when both parts are false, and true otherwise. Step 2 evaluates the full table row by row: (1,1) gives 1, (1,0) gives 1, (0,1) gives 1, and (0,0) gives 0. The answer is 1, 1, 1, 0."
          - problem: "The truth table for P or Q has exactly one false row. Using 1 for true and 0 for false, give the combination of that row as (P, Q)."
            answer: "(0, 0)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "Step 1 writes the full table: (1,1) gives 1, (1,0) gives 1, (0,1) gives 1, (0,0) gives 0. Step 2 applies the disjunction rule: the value is 0 only when both inputs are 0. So the single false row is the pair (0, 0)."
          - problem: "How many of the four rows of the truth table for P or Q are true?"
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 builds the full table by the disjunction rule: (1,1) gives 1, (1,0) gives 1, (0,1) gives 1, (0,0) gives 0, since a disjunction fails only when both parts are false. Step 2 counts the rows with value 1: rows one, two and three. The answer is 3."
          - problem: "Using 1 for true and 0 for false, find the value of P or Q in the row where P is false and Q is false."
            answer: "0"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 writes the full disjunction table: (1,1) gives 1, (1,0) gives 1, (0,1) gives 1, and (0,0) gives 0. Step 2 selects the row with P false and Q false, which is the pair (0,0). Step 3 applies the disjunction rule: a disjunction is false only when both parts are false. The answer is 0."
          - problem: "Number the rows of the truth table for P or Q from 1 to 4 in the order (1,1), (1,0), (0,1), (0,0). Which row number is the only false row?"
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 evaluates all four numbered rows with the disjunction rule: row 1 gives 1, row 2 gives 1, row 3 gives 1, row 4 gives 0. Step 2 locates the single 0: it sits in the row where both inputs are 0, which is row 4. The answer is 4."
          - problem: "How many rows of the truth table for P or Q are true when Q is true?"
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 selects the rows with Q equal to 1: the rows (1,1) and (0,1). Step 2 applies the disjunction rule to each: (1,1) gives 1 and (0,1) gives 1, since one true part makes the disjunction true. The other two rows have Q equal to 0 and do not count. The answer is 2."
        constraints: "single connective; emphasize the one false row of $\\lor$"
      - id: kp3
        name: "Reading off individual rows"
        key_prerequisites: [logical-connectives]
        exemplars:
          - problem: "Work with truth values as numbers: true is 1 and false is 0. Define AND(a, b) = min(a, b) and OR(a, b) = max(a, b). For P = 0 and Q = 1, compute AND(P, Q) and OR(P, Q). Give the answer as a list of two numbers, 1 for true and 0 for false, in the order AND(P, Q), OR(P, Q)."
            answer: "0, 1"
            answer_contract: {"kind": "list", "member": {"kind": "exact"}, "ordered": true}
            solution_sketch: "Step 1 (conjunction rule): AND(P, Q) = min(P, Q); with P = 0 and Q = 1 this is min(0, 1) = 0. Step 2 (disjunction rule): OR(P, Q) = max(P, Q); with P = 0 and Q = 1 this is max(0, 1) = 1. Reading off the row gives the ordered list 0, 1."
          - problem: "Work with truth values as numbers: true is 1 and false is 0, with AND(a, b) = min(a, b) and OR(a, b) = max(a, b). There are four assignments of values to P and Q. For how many of these assignments do AND(P, Q) and OR(P, Q) take the same value? Give the answer as a single number."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (row enumeration): with AND(a, b) = min(a, b) and OR(a, b) = max(a, b), check each of the four assignments of values to P and Q. Step 2 (conjunction and disjunction rules): at (1, 1) both give 1, and at (0, 0) both give 0, so these two assignments agree. Step 3 (conjunction and disjunction rules): at (1, 0) the values are 0 and 1, and at (0, 1) the values are 0 and 1, so these two assignments differ. The number of assignments where AND(P, Q) and OR(P, Q) agree is 2."
          - problem: "Work with truth values as numbers: true is 1 and false is 0, and define NOT(a) = 1 - a. For P = 0, compute NOT(P). Give the answer as a number, using 1 for true and 0 for false."
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (negation rule): NOT(a) = 1 - a flips the truth value of a. Step 2 (evaluation): with P = 0, NOT(P) = 1 - 0 = 1. The value of NOT(P) is 1."
          - problem: "Work with truth values as numbers: true is 1 and false is 0, and define IMP(a, b) = max(1 - a, b). For P = 1 and Q = 0, compute IMP(P, Q). Give the answer as a number, using 1 for true and 0 for false."
            answer: "0"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (implication rule): IMP(a, b) = max(1 - a, b), which is 0 exactly when a = 1 and b = 0. Step 2 (evaluation): with P = 1 and Q = 0, IMP(P, Q) = max(1 - 1, 0) = max(0, 0) = 0. The value of IMP(P, Q) is 0."
          - problem: "Work with truth values as numbers: true is 1 and false is 0, and define BIC(a, b) = 1 - abs(a - b). For P = 1 and Q = 0, compute BIC(P, Q). Give the answer as a number, using 1 for true and 0 for false."
            answer: "0"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (biconditional rule): BIC(a, b) = 1 - abs(a - b), which is 1 exactly when a and b have the same value. Step 2 (evaluation): with P = 1 and Q = 0, BIC(P, Q) = 1 - abs(1 - 0) = 1 - 1 = 0. The value of BIC(P, Q) is 0."
          - problem: "Work with truth values as numbers: true is 1 and false is 0, with IMP(a, b) = max(1 - a, b). Which assignment of values to P and Q makes IMP(P, Q) equal to 0? Give the assignment as your choice."
            answer: "P=1,Q=0"
            answer_contract: {"kind": "label", "options": [["P=1,Q=1"], ["P=1,Q=0"], ["P=0,Q=1"], ["P=0,Q=0"]]}
            solution_sketch: "Step 1 (implication rule): IMP(P, Q) = max(1 - P, Q) equals 0 only when 1 - P = 0 and Q = 0, that is P = 1 and Q = 0. Step 2 (checking wrong options): P=1,Q=1 gives max(0, 1) = 1, the error of thinking a true antecedent alone forces a false result; P=0,Q=1 gives max(1, 1) = 1, the error of ignoring that a false antecedent makes the implication true; P=0,Q=0 gives max(1, 0) = 1, the error of thinking both false forces a false result. The assignment that makes IMP(P, Q) equal to 0 is P=1,Q=0."
        constraints: "evaluate specific rows without writing the whole table"
    diagnostic_exemplar:
      problem: 'For $P$ true and $Q$ false, give the values of $P \land Q$, $P \lor Q$, and $\neg P$.'
      answer_contract: {kind: none}
      answer: '$P \land Q$ is F, $P \lor Q$ is T, $\neg P$ is F.'
      solution_sketch: 'One false conjunct kills the conjunction; one true disjunct saves the disjunction; negation flips T to F.'
    anki_seeds:
      - front: 'When is $P \land Q$ true?'
        back: 'Only when both $P$ and $Q$ are true.'
        type: basic
      - front: 'When is $P \lor Q$ false?'
        back: 'Only when both $P$ and $Q$ are false.'
        type: basic

  - id: evaluating-compound-propositions
    name: "Evaluating Compound Propositions"
    core: true
    difficulty: 0.44
    drill: false               # L4 audit: multi-step evaluation, not a 6s recall skill
    answer_kind: numeric
    expected_time_secs: 90
    prerequisites:
      - id: truth-tables-basic-connectives
        weight: 0.5
        key: true
      - id: logical-connectives
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: "Operator precedence"
        key_prerequisites: [logical-connectives]
        exemplars:
          - problem: "In the formula $\\neg P \\lor Q \\land R$, the standard precedence is $\\neg$, then $\\land$, then $\\lor$. Count the connectives from the left starting at 1. Give the position number of the main connective."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full formula is $\\neg P \\lor Q \\land R$. Step 1: by precedence, $\\neg$ applies only to $P$, so it is not main. Step 2: $\\land$ binds tighter than $\\lor$, so $Q \\land R$ groups before the disjunction. Step 3: the main connective is the $\\lor$ between $\\neg P$ and $Q \\land R$. Counting from the left, $\\neg$ is position 1 and $\\lor$ is position 2. The answer is 2."
          - problem: "In the formula $\\neg P \\land Q \\lor R$, the standard precedence is $\\neg$, then $\\land$, then $\\lor$. Count the connectives from the left starting at 1. Give the position number of the main connective."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full formula is $\\neg P \\land Q \\lor R$. Step 1: by precedence, $\\neg$ applies first and is not main. Step 2: $\\land$ binds tighter than $\\lor$, so $\\neg P \\land Q$ groups before the disjunction. Step 3: the remaining main connective is the $\\lor$ after $Q$. Counting from the left, $\\neg$ is 1, $\\land$ is 2, and $\\lor$ is 3. The answer is 3."
          - problem: "In the formula $P \\lor Q \\land \\neg R$, the standard precedence is $\\neg$, then $\\land$, then $\\lor$. Count the connectives from the left starting at 1. Give the position number of the main connective."
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full formula is $P \\lor Q \\land \\neg R$. Step 1: by precedence, $\\neg$ applies first to $R$. Step 2: $\\land$ binds tighter than $\\lor$, so $Q \\land \\neg R$ groups. Step 3: the main connective is the $\\lor$ at the left. Counting from the left, $\\lor$ is position 1. The answer is 1."
          - problem: "In the formula $\\neg P \\land \\neg Q \\lor R$, the standard precedence is $\\neg$, then $\\land$, then $\\lor$. Count the connectives from the left starting at 1. Give the position number of the main connective."
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full formula is $\\neg P \\land \\neg Q \\lor R$. Step 1: both $\\neg$ connectives apply first. Step 2: $\\land$ binds tighter, so $\\neg P \\land \\neg Q$ groups. Step 3: the main connective is the $\\lor$ at the right. Counting from the left, the connectives are $\\neg$ at 1, $\\land$ at 2, $\\neg$ at 3, and $\\lor$ at 4. The answer is 4."
          - problem: "In the formula $P \\land Q \\lor \\neg R$, with standard precedence $\\neg$, then $\\land$, then $\\lor$, which connective is the main connective?"
            answer: "disjunction"
            answer_contract: {"kind": "label", "options": [["negation"], ["conjunction"], ["disjunction"], ["conditional"]]}
            solution_sketch: "The full formula is $P \\land Q \\lor \\neg R$. By precedence, $\\neg$ applies first, then $\\land$ groups $P \\land Q$, and the last connective is $\\lor$. The main connective is therefore disjunction. The option negation is wrong because negation is unary and applies only to $R$. The option conjunction is wrong because $\\land$ binds tighter and forms the left part. The option conditional is wrong because $\\lor$ is a disjunction, not a conditional. The main connective is disjunction."
          - problem: "In the formula $P \\land \\neg Q \\lor R \\land S$, with standard precedence $\\neg$, then $\\land$, then $\\lor$, which connective is applied first?"
            answer: "negation"
            answer_contract: {"kind": "label", "options": [["negation"], ["conjunction"], ["disjunction"], ["conditional"]]}
            solution_sketch: "The full formula is $P \\land \\neg Q \\lor R \\land S$. By precedence, $\\neg$ binds tightest, so the negation of $Q$ is applied first. The option conjunction is wrong because $\\land$ applies after all negations. The option disjunction is wrong because $\\lor$ applies last. The option conditional is wrong because the symbols are not a conditional. The first connective applied is negation."
        constraints: "precedence order $\\neg$, $\\land$, $\\lor$; identify the main connective"
      - id: kp2
        name: "Evaluating at given truth values"
        key_prerequisites: [truth-tables-basic-connectives]
        exemplars:
          - problem: 'Evaluate $\neg P \lor Q \land R$ at $P$ = T, $Q$ = F, $R$ = T.'
            answer: 'F.'
            solution_sketch: 'Group as $(\neg P) \lor (Q \land R)$. $\neg P$ = F and $Q \land R$ = F $\land$ T = F, so F $\lor$ F = F.'
          - problem: 'Evaluate $\neg P \land Q$ at $P$ = F, $Q$ = T.'
            answer: 'T.'
            solution_sketch: '$\neg P$ = T, so $\neg P \land Q$ = T $\land$ T = T.'
        constraints: "connectives limited to $\\neg, \\land, \\lor$; up to 3 variables; single assignment of truth values"
      - id: kp3
        name: "Parentheses change the value"
        key_prerequisites: [truth-tables-basic-connectives]
        exemplars:
          - problem: 'At $P$ = F, $Q$ = T, evaluate both $\neg(P \lor Q)$ and $\neg P \lor Q$. Do they agree?'
            answer_contract: {kind: none}
            answer: '$\neg(P \lor Q)$ = F but $\neg P \lor Q$ = T; they differ.'
            solution_sketch: '$P \lor Q$ = T so its negation is F; but $\neg P$ = T already makes $\neg P \lor Q$ true. Parentheses determine what the negation applies to.'
          - problem: 'At $P$ = T, $Q$ = F, $R$ = F, evaluate $P \land (\neg Q \lor R)$.'
            answer: 'T.'
            solution_sketch: '$\neg Q$ = T, so $\neg Q \lor R$ = T; then T $\land$ T = T.'
        constraints: "contrast a parenthesized and unparenthesized version at a distinguishing assignment"
    diagnostic_exemplar:
      problem: 'Evaluate $P \land \neg Q \lor R$ and $P \land (\neg Q \lor R)$ at $P$ = F, $Q$ = T, $R$ = T, and state whether the parentheses change the value.'
      answer_contract: {kind: none}
      answer: 'By the standard precedence ($\neg$, then $\land$, then $\lor$) the first formula is $(P \land \neg Q) \lor R = (\mathrm{F} \land \mathrm{F}) \lor \mathrm{T} = \mathrm{T}$. The second is $P \land (\neg Q \lor R) = \mathrm{F} \land (\mathrm{F} \lor \mathrm{T}) = \mathrm{F} \land \mathrm{T} = \mathrm{F}$. The values differ, so the parentheses do change the meaning.'
      solution_sketch: 'Group the unparenthesised formula by precedence before evaluating, then compare with the parenthesised version at the same assignment.'
    anki_seeds:
      - front: 'Standard precedence of $\neg$, $\land$, $\lor$?'
        back: '$\neg$ binds tightest, then $\land$, then $\lor$.'
        type: basic

  - id: truth-tables
    name: "Truth Tables"
    core: true
    difficulty: 0.46
    drill: false               # L4 audit: 3-8 row tables cannot fit the 6s drill countdown
    answer_kind: numeric
    expected_time_secs: 120
    prerequisites:
      - id: truth-tables-basic-connectives
        weight: 0.5
        key: true
      - id: evaluating-compound-propositions
        weight: 0.4
      - id: propositional-logic
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: "Conditional and biconditional tables"
        key_prerequisites: [propositional-logic]
        exemplars:
          - problem: "The four rows of a conditional table can be listed as TT, TF, FT and FF. Give the number of these rows in which P -> Q takes the value true."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: Write the full table for P -> Q: TT gives T, TF gives F, FT gives T, FF gives T. Step 2: Apply the conditional rule, which is false only for a true hypothesis with a false conclusion. Three of the rows give T, so the count is 3."
          - problem: "A biconditional P <-> Q is built from two statements and has four table rows. Give the number of rows of its truth table in which P <-> Q takes the value true."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: Write the full table for P <-> Q: TT gives T, TF gives F, FT gives F, FF gives T. Step 2: Apply the biconditional rule, which gives T exactly when the two sides agree. The agreeing rows are TT and FF, so the count is 2."
          - problem: "In the truth table for the conditional P -> Q, look only at the rows whose hypothesis P is false. Give the number of those rows in which P -> Q itself is false."
            answer: "0"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: Write the full table for P -> Q: TT gives T, TF gives F, FT gives T, FF gives T. Step 2: The rows with P false are FT and FF, and the conditional rule makes a false hypothesis give a true conditional in both. Neither of those rows is false, so the count is 0."
          - problem: "A truth table for the conditional P -> Q has one row for each pairing of the two letters. Give the number of rows of that table in which the conditional takes the value false."
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: Write the full table for P -> Q: TT gives T, TF gives F, FT gives T, FF gives T. Step 2: Apply the conditional rule, which is false only in the row with a true hypothesis and a false conclusion, namely TF. The count of false rows is 1."
          - problem: "The conditional P -> Q has four table rows. State the value it takes in the row where P is false and Q is also false, and give the number of rows in which P is false and P -> Q is true. Give the value as a letter, then the number."
            answer: "value = T; count = 2"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["T"], ["F"]]}, "name": "value"}, {"contract": {"kind": "exact"}, "name": "count"}]}
            solution_sketch: "Step 1: Write the full table for P -> Q: TT gives T, TF gives F, FT gives T, FF gives T. Step 2: In the row FF the hypothesis is false, and the conditional rule makes a false hypothesis give a true conditional, so the value is T; answering F is the error of forgetting that rule. Step 3: The rows with P false are FT and FF, and P -> Q is true in both of them, so that count is 2. The result is value = T; count = 2."
          - problem: "The biconditional P <-> Q compares the two letters in each table row. Give the number of rows of its truth table in which the biconditional takes the value false."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: Write the full table for P <-> Q: TT gives T, TF gives F, FT gives F, FF gives T. Step 2: Apply the biconditional rule, which is false exactly in the rows where the two sides disagree, namely TF and FT. There are two such rows, so the count is 2."
        constraints: "emphasize the two easily-forgotten rows: $T\\to F$ is false, $F\\to$ anything is true"
      - id: kp2
        name: "Tables for compound formulas"
        key_prerequisites: [evaluating-compound-propositions]
        exemplars:
          - problem: "Build the truth table, including intermediate columns, for $\\neg P \\lor Q$. Use row numbers 1 to 4 in the order TT, TF, FT, FF. Find the number of rows in which the formula is true."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The formula is $\\neg P \\lor Q$, and the two variables are $P$ and $Q$. Step 1 (negation rule): the intermediate column for $\\neg P$ over rows TT, TF, FT, FF is F, F, T, T. Step 2 (disjunction rule): evaluating $\\neg P \\lor Q$ row by row gives T, F, T, T. The number of true rows is 3."
          - problem: "Build the truth table, including intermediate columns, for $(P \\lor Q) \\land \\neg P$. Use row numbers 1 to 4 in the order TT, TF, FT, FF. Find the row number in which the formula is true."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The formula is $(P \\lor Q) \\land \\neg P$, with variables $P$ and $Q$. Step 1 (disjunction and negation rules): $P \\lor Q$ is T, T, T, F and $\\neg P$ is F, F, T, T over rows TT, TF, FT, FF. Step 2 (conjunction rule): the final column is F, F, T, F. The true row number is 3."
          - problem: "Build the truth table, including intermediate columns, for $P \\leftrightarrow \\neg Q$. Use row numbers 1 to 4 in the order TT, TF, FT, FF. Find the number of rows in which the formula is true."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The formula is $P \\leftrightarrow \\neg Q$, with variables $P$ and $Q$. Step 1 (negation rule): the intermediate column for $\\neg Q$ over rows TT, TF, FT, FF is F, T, F, T. Step 2 (biconditional rule): compare $P$ with $\\neg Q$ row by row to get F, T, T, F. The number of true rows is 2."
          - problem: "Build the truth table, including intermediate columns, for $(P \\land \\neg Q) \\lor (\\neg P \\land Q)$. Use row numbers 1 to 4 in the order TT, TF, FT, FF. Give the list of row numbers in which the formula is true."
            answer: "2, 3"
            answer_contract: {"kind": "list", "member": {"kind": "exact"}, "ordered": true}
            solution_sketch: "The formula is $(P \\land \\neg Q) \\lor (\\neg P \\land Q)$, with variables $P$ and $Q$. Step 1 (negation and conjunction rules): $P \\land \\neg Q$ is F, T, F, F and $\\neg P \\land Q$ is F, F, T, F over rows TT, TF, FT, FF. Step 2 (disjunction rule): the final column is F, T, T, F. The list of row numbers is 2, 3."
          - problem: "Build the truth table, including intermediate columns, for $\\neg(P \\lor Q)$. Use row numbers 1 to 4 in the order TT, TF, FT, FF. Find the row number in which the formula is true."
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The formula is $\\neg(P \\lor Q)$, with variables $P$ and $Q$. Step 1 (disjunction rule): the intermediate column for $P \\lor Q$ over rows TT, TF, FT, FF is T, T, T, F. Step 2 (negation rule): negating that column gives F, F, F, T. The true row number is 4."
          - problem: "Build the truth table, including intermediate columns, for $(P \\to Q) \\land P$. Use row numbers 1 to 4 in the order TT, TF, FT, FF. Give the list of row numbers in which the formula is true."
            answer: "1"
            answer_contract: {"kind": "list", "member": {"kind": "exact"}, "ordered": true}
            solution_sketch: "The formula is $(P \\to Q) \\land P$, with variables $P$ and $Q$. Step 1 (implication rule): the intermediate column for $P \\to Q$ over rows TT, TF, FT, FF is T, F, T, T. Step 2 (conjunction rule): combining with $P$ gives T, F, F, F. The list of row numbers is 1."
        constraints: "two variables; build intermediate columns before the final column"
      - id: kp3
        name: "Three-variable tables and tautology spotting"
        key_prerequisites: [evaluating-compound-propositions]
        exemplars:
          - problem: "A formula uses exactly 3 distinct variables. How many rows are in its truth table? Give the number."
            answer: "8"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: count the variables: 3. Step 2: use the row rule 2^n, so 2^3 = 8. The truth table has 8 rows."
          - problem: "For the formula (P or not P) or (Q and R), classify its final column and give how many of the 8 rows are T. State the classification and the count."
            answer: "verdict = tautology; T = 8"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["tautology"], ["contingent"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "T"}]}
            solution_sketch: "The formula is (P or not P) or (Q and R). Step 1: P or not P is true in every row, so the left disjunct is true in all 8 rows. Step 2: an OR with one true disjunct is true, so the final column is true in all 8 rows. The wrong option contingent would require at least one F row, but no row is F. The answer is verdict = tautology; T = 8."
          - problem: "For the formula P and (Q or R), how many rows make the formula true? Give the number."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The formula is P and (Q or R). Step 1: P must be true, which holds in 4 rows. Step 2: among those rows, Q or R is true in 3 of the 4 assignments to Q and R. Step 3: the rows with P true and Q or R true are 3. The number of true rows is 3."
          - problem: "For the formula (P or not P) and (Q or not Q) and (R or not R), determine the type of its final column. Select the type."
            answer: "allT"
            answer_contract: {"kind": "label", "options": [["allT"], ["allF"], ["mixed"], ["other"]]}
            solution_sketch: "The formula is (P or not P) and (Q or not Q) and (R or not R). Step 1: each disjunction P or not P, Q or not Q, and R or not R is true in every row. Step 2: an AND of true statements is true, so the final column is all T. The option allF is wrong because the column has no F row. The option mixed is wrong because there is no row with F. The option other is wrong because the column is exactly all T. The answer is allT."
          - problem: "For the formula (P and not P) or (Q and not Q) or (R and not R), classify its final column and give how many of the 8 rows are T. State the classification and the count."
            answer: "verdict = contradiction; T = 0"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["contradiction"], ["contingent"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "T"}]}
            solution_sketch: "The formula is (P and not P) or (Q and not Q) or (R and not R). Step 1: each conjunction P and not P, Q and not Q, and R and not R is false in every row. Step 2: an OR of false statements is false, so the final column has no T row. The wrong option contingent would require at least one T row. The answer is verdict = contradiction; T = 0."
          - problem: "For the formula (P or Q) and R, how many rows make the formula false? Give the number."
            answer: "5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The formula is (P or Q) and R. Step 1: P or Q is false only when P and Q are both false, which gives 2 rows, and in those rows the conjunction is false. Step 2: when P or Q is true, there are 3 choices for P and Q, and R is false in those 3 rows, making those rows false. Step 3: add the false rows: 2 + 3 = 5. The number of false rows is 5."
        constraints: "up to 3 variables; identify all-T (tautology) and all-F (contradiction) columns"
    diagnostic_exemplar:
      problem: 'Construct the truth table for $(P \land Q) \to P$ and state whether it is a tautology.'
      answer_contract: {kind: none}
      answer: 'All four rows are T, so it is a tautology.'
      solution_sketch: 'Whenever $P \land Q$ is true, $P$ is true, so the conditional is true; when the hypothesis is false it is vacuously true. Every row is T.'
    anki_seeds:
      - front: 'When is a conditional $P \to Q$ false?'
        back: 'Only when $P$ is true and $Q$ is false.'
        type: basic
      - front: 'How many rows does a truth table with $n$ variables have?'
        back: '$2^n$.'
        type: basic

  - id: tautologies-and-contradictions
    name: "Tautologies and Contradictions"
    core: false                # supplemental: classification exercise; truth-tables is the machinery
    difficulty: 0.50
    drill: false
    answer_kind: numeric
    expected_time_secs: 130
    prerequisites:
      - id: truth-tables
        weight: 0.6
        key: true
      - id: evaluating-compound-propositions
        weight: 0.2
    knowledge_points:
      - id: kp1
        name: "Classifying formulas"
        key_prerequisites: [truth-tables]
        exemplars:
          - problem: "Build the full truth table of the formula (P ∧ Q) → P. Give verdict, the one-word classification of the formula, and t, the number of rows in which the formula is true."
            answer: "verdict = tautology; t = 4"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["tautology"], ["contradiction"], ["contingency"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "t"}]}
            solution_sketch: "Truth-table rule: list the four rows for P and Q and evaluate (P ∧ Q) → P in each. The antecedent P ∧ Q is false in three rows, which makes the conditional true, and in the TT row the conditional is true because P is true. Classification rule: the formula is true in all 4 rows, so the verdict is tautology; contradiction is wrong because no row is false, and contingency is wrong because the rows do not mix. The answer is verdict = tautology; t = 4."
          - problem: "Construct the full truth table of (P → Q) → Q. Give verdict, the one-word classification of this formula, and t, the number of rows in which it is true."
            answer: "verdict = contingency; t = 3"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["tautology"], ["contradiction"], ["contingency"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "t"}]}
            solution_sketch: "Truth-table rule: evaluate the inner conditional P → Q in each of the four rows, then the outer conditional into Q. TT: true → true is true. TF: P → Q is false, and false → false is true. FT: true → true is true. FF: true → false is false. Classification rule: the formula is true in 3 rows and false in 1 row, a mix, so verdict = contingency; tautology is wrong because the FF row is false, and contradiction is wrong because three rows are true. The answer is verdict = contingency; t = 3."
          - problem: "Build the full truth table of the formula (P ∨ Q) ∧ ¬P ∧ ¬Q. How many rows of the table make the formula false?"
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Truth-table rule: ¬P ∧ ¬Q is true only in the FF row, and there P ∨ Q is false, so the conjunction is false; in the other three rows ¬P ∧ ¬Q is false, so the conjunction is false. Classification rule: the formula is false in every row, which is the all-false case. Count rule: the number of false rows is 4. The answer is 4."
          - problem: "Construct the full truth table of the formula (P → Q) → R. Give t, the number of rows in which the formula is true, and f, the number of rows in which it is false."
            answer: "t = 5; f = 3"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "t"}, {"contract": {"kind": "exact"}, "name": "f"}]}
            solution_sketch: "Truth-table rule: P → Q is false only when P is true and Q is false, and then the outer conditional into R is true whatever R is, so TFT and TFF are true rows. When P → Q is true, the formula has the value of R. Count rule: the true rows are TTT, TFT, TFF, FTT, FFT, and the false rows are TTF, FTF, FFF, so the row counts are 5 and 3. The answer is t = 5; f = 3."
          - problem: "Build the full truth table of the formula (P ∧ Q) → (P ∨ R). How many rows of the table make the formula true?"
            answer: "8"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Truth-table rule: the antecedent P ∧ Q is true only when P and Q are both true, and in those rows P ∨ R is true because P alone makes the disjunction true. When the antecedent is false, the conditional is true. Classification rule: the formula is true in all 8 rows, the all-true case. Count rule: the number of true rows is 8. The answer is 8."
          - problem: "Construct the full truth table of the formula (P ∨ Q) ∧ ¬(P ∧ Q). How many rows of the table make the formula true?"
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Truth-table rule: P ∨ Q is false only in the FF row, and ¬(P ∧ Q) is false only in the TT row, so the conjunction is true exactly when one of P, Q is true and the other false. Count rule: the true rows are TF and FT, so exactly 2 rows make the formula true, a mix of true and false rows. The answer is 2."
        constraints: "classify via a full truth table; tautology = all T, contradiction = all F, contingency = mixed"
      - id: kp2
        name: "Famous implication tautologies"
        key_prerequisites: [truth-tables]
        exemplars:
          - problem: "Use a truth table to verify that ((P -> Q) and P) -> Q is a tautology. Give the number of rows in which the hypothesis (P -> Q) and P is true."
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full formula is ((P -> Q) and P) -> Q. Step 1: list the four rows for P and Q and evaluate P -> Q by the truth table rule for implication. Step 2: evaluate the hypothesis (P -> Q) and P by the truth table rule for conjunction; it is true only in the row P = T, Q = T. Step 3: the main implication is true in all four rows, so the formula is a tautology. The number of rows in which the hypothesis is true is 1."
          - problem: "Use a truth table to verify that (P -> Q) or (Q -> P) is a tautology. Give the number of rows in which P -> Q is true."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full formula is (P -> Q) or (Q -> P). Step 1: list the four rows for P and Q. Step 2: evaluate P -> Q by the truth table rule for implication; it is false only in the row P = T, Q = F. Step 3: evaluate Q -> P by the same rule; it is true in that row, so the disjunction is true in all four rows. The number of rows in which P -> Q is true is 3."
          - problem: "Use a truth table to verify that ((P -> Q) and (Q -> R)) -> (P -> R) is a tautology. Give the number of rows in which the hypothesis (P -> Q) and (Q -> R) is true."
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full formula is ((P -> Q) and (Q -> R)) -> (P -> R). Step 1: list the eight rows for P, Q, R. Step 2: evaluate P -> Q and Q -> R by the truth table rule for implication. Step 3: evaluate their conjunction by the truth table rule for conjunction; it is true in exactly four rows. Step 4: the main implication is true in all eight rows, so the formula is a tautology. The number of rows in which the hypothesis is true is 4."
          - problem: "Use a truth table to verify that (P -> Q) -> ((not Q) -> (not P)) is a tautology. Give the number of rows in which P -> Q is true."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full formula is (P -> Q) -> ((not Q) -> (not P)). Step 1: list the four rows for P and Q. Step 2: evaluate P -> Q by the truth table rule for implication; it is false only in the row P = T, Q = F. Step 3: evaluate (not Q) -> (not P) by the same rule; it is true in that row, so the main implication is true in all four rows. The number of rows in which P -> Q is true is 3."
          - problem: "Use a truth table to verify that P -> (P or Q) is a tautology. Give the number of rows in which the hypothesis P is true."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full formula is P -> (P or Q). Step 1: list the four rows for P and Q. Step 2: evaluate the hypothesis P by the truth table rule for a propositional variable; it is true in two rows. Step 3: evaluate P or Q by the truth table rule for disjunction; it is true in every row where P is true. Step 4: the main implication is true in all four rows, so the formula is a tautology. The number of rows in which the hypothesis is true is 2."
          - problem: "Use a truth table to verify that ((P -> Q) and (R -> S) and (P or R)) -> (Q or S) is a tautology. Give the number of rows in which the hypothesis (P -> Q) and (R -> S) and (P or R) is true."
            answer: "5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full formula is ((P -> Q) and (R -> S) and (P or R)) -> (Q or S). Step 1: list the sixteen rows for P, Q, R, S. Step 2: evaluate P -> Q, R -> S, and P or R by the truth table rules for implication and disjunction. Step 3: evaluate their conjunction by the truth table rule for conjunction; it is true in exactly five rows. Step 4: the main implication is true in all sixteen rows, so the formula is a tautology. The number of rows in which the hypothesis is true is 5."
        constraints: "verify tautologyhood of classic conditional forms by table"
      - id: kp3
        name: "Contradictions and satisfiability"
        key_prerequisites: [truth-tables]
        exemplars:
          - problem: "Consider the formula (P or Q) and not P and not Q. How many rows of its truth table fail to satisfy it?"
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full formula is (P or Q) and not P and not Q. Step 1 (truth-table rule): list the four rows for P and Q. Step 2 (evaluation rule): in row P=true, Q=true, not P is false; in row P=true, Q=false, not Q is false; in row P=false, Q=true, not P is false; in row P=false, Q=false, P or Q is false. Every row makes the conjunction false, so no row satisfies it. The number of rows that fail to satisfy it is 4."
          - problem: "Consider the three formulas P -> Q, P, and not Q. How many rows of the truth table fail to satisfy all three at once?"
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full set is P -> Q, P, and not Q. Step 1 (truth-table rule): list the four rows for P and Q. Step 2 (evaluation rule): if P is true, not Q forces Q false, and then P -> Q is false; if P is false, P is false. So no row makes all three true. The number of rows that fail to satisfy all three at once is 4."
          - problem: "Consider the set of formulas: P and not P, Q. Find the smallest number of formulas from this set that are jointly unsatisfiable."
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full set is P and not P, and Q. Step 1 (contradiction test): the formula P and not P is false in every row, so it alone has no satisfying row. Step 2 (subset check): this single formula is a jointly unsatisfiable subset. The smallest number of formulas that are jointly unsatisfiable is 1."
          - problem: "Consider the set of formulas: P, not P, Q. Find the smallest number of formulas from this set that are jointly unsatisfiable."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full set is P, not P, and Q. Step 1 (subset check): each single formula P, not P, and Q is satisfiable. Step 2 (contradiction test): the pair P and not P has no satisfying row. Step 3 (minimality): no single formula is unsatisfiable. The smallest number of formulas that are jointly unsatisfiable is 2."
          - problem: "Consider the set of formulas: P -> Q, Q -> R, P, not R. Find the smallest number of formulas from this set that are jointly unsatisfiable."
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full set is P -> Q, Q -> R, P, and not R. Step 1 (subset check): removing P leaves a set satisfiable by P=false, Q=false, R=false. Step 2 (subset check): removing not R leaves a set satisfiable by P=true, Q=true, R=true. Step 3 (subset check): removing P -> Q leaves a set satisfiable by P=true, Q=false, R=false. Step 4 (subset check): removing Q -> R leaves a set satisfiable by P=true, Q=true, R=false. All four formulas are needed. The smallest number of formulas that are jointly unsatisfiable is 4."
          - problem: "Consider the set of formulas: P or Q, not P, not Q, R. Find the smallest number of formulas from this set that are jointly unsatisfiable."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full set is P or Q, not P, not Q, and R. Step 1 (contradiction test): the three formulas P or Q, not P, not Q force a contradiction. Step 2 (subset check): any two of these three are satisfiable. Step 3 (minimality): the extra formula R is not needed. The smallest number of formulas that are jointly unsatisfiable is 3."
        constraints: "show a formula (or set of formulas) has no satisfying row"
    diagnostic_exemplar:
      problem: 'Classify each as a tautology, a contradiction, or a contingency: (a) $((P \to Q) \land P) \land \neg Q$, (b) $P \to (P \lor Q)$.'
      answer_contract: {kind: none}
      answer: '(a) Contradiction: for it to be true we would need $P$ true and $P \to Q$ true, forcing $Q$ true, while $\neg Q$ demands $Q$ false — no row of the truth table makes it true. (b) Tautology: the only row that could falsify a conditional has a true antecedent and false consequent, but $P$ true makes $P \lor Q$ true; all four rows are T.'
      solution_sketch: '(a) asserts the premises of modus ponens together with the negated conclusion, so it is unsatisfiable; for (b) check the only dangerous row, $P$ true.'
    anki_seeds:
      - front: 'Definitions: tautology, contradiction, contingency?'
        back: 'Tautology: true in every row. Contradiction: false in every row. Contingency: true in some rows, false in others.'
        type: basic
      - front: 'A classic tautology expressing modus ponens?'
        back: '$((P \to Q) \land P) \to Q$.'
        type: basic

  - id: conditional-statements
    name: "Conditional Statements"
    core: true
    difficulty: 0.50
    drill: false
    answer_kind: numeric
    expected_time_secs: 130
    prerequisites:
      - id: propositional-logic
        weight: 0.4
        key: true
      - id: truth-tables
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: "Converse, inverse, contrapositive"
        key_prerequisites: [propositional-logic]
        exemplars:
          - problem: "Consider the conditional: If a number is divisible by 6, then it is divisible by 3. Four statements are numbered. 1. If a number is not divisible by 6, then it is not divisible by 3. 2. If a number is not divisible by 3, then it is not divisible by 6. 3. If a number is divisible by 3, then it is divisible by 6. 4. If a number is divisible by 6, then it is divisible by 3. Which numbered statement is the converse? Give the number."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The original conditional is P -> Q: if a number is divisible by 6, then it is divisible by 3. The converse rule says Q -> P, so swap the hypothesis and conclusion: if a number is divisible by 3, then it is divisible by 6. Statement 3 matches that converse. The answer is 3."
          - problem: "Consider the conditional: If x > 0 then x^2 > 0. Four statements are numbered. 1. If x^2 <= 0 then x <= 0. 2. If x > 0 then x^2 > 0. 3. If x^2 > 0 then x > 0. 4. If x <= 0 then x^2 <= 0. Which numbered statement is the contrapositive? Give the number."
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The original conditional is P -> Q: if x > 0 then x^2 > 0. The contrapositive rule says not Q -> not P, so negate both parts and swap: if x^2 <= 0 then x <= 0. Statement 1 matches that contrapositive. The answer is 1."
          - problem: "Consider the conditional: If a shape is a square, then it has four equal sides. Four statements are numbered. 1. If a shape has four equal sides, then it is a square. 2. If a shape does not have four equal sides, then it is not a square. 3. If a shape is a square, then it has four equal sides. 4. If a shape is not a square, then it does not have four equal sides. Which numbered statement is the inverse? Give the number."
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The original conditional is P -> Q: if a shape is a square, then it has four equal sides. The inverse rule says not P -> not Q, so negate both parts without swapping: if a shape is not a square, then it does not have four equal sides. Statement 4 matches that inverse. The answer is 4."
          - problem: "Consider the conditional: If it is raining and the temperature is below freezing, then the roads are icy. Four statements are numbered. 1. If it is not raining or the temperature is not below freezing, then the roads are not icy. 2. If the roads are icy, then it is raining and the temperature is below freezing. 3. If the roads are not icy, then it is not raining or the temperature is not below freezing. 4. If it is raining and the temperature is below freezing, then the roads are icy. Which numbered statement is the converse? Give the number."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The original conditional is P -> Q: if it is raining and the temperature is below freezing, then the roads are icy. The converse rule says Q -> P, so swap the hypothesis and conclusion: if the roads are icy, then it is raining and the temperature is below freezing. Statement 2 matches that converse. The answer is 2."
          - problem: "Consider the conditional: If a function is differentiable at x, then it is continuous at x. Four statements are numbered. 1. If a function is continuous at x, then it is differentiable at x. 2. If a function is not differentiable at x, then it is not continuous at x. 3. If a function is not continuous at x, then it is not differentiable at x. 4. If a function is differentiable at x, then it is continuous at x. Which numbered statement is the contrapositive? Give the number."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The original conditional is P -> Q: if a function is differentiable at x, then it is continuous at x. The contrapositive rule says not Q -> not P, so negate both parts and swap: if a function is not continuous at x, then it is not differentiable at x. Statement 3 matches that contrapositive. The answer is 3."
          - problem: "Consider the conditional: If a number is a multiple of 10, then it ends in 0. Four statements are numbered. 1. If a number is not a multiple of 10, then it does not end in 0. 2. If a number ends in 0, then it is a multiple of 10. 3. If a number does not end in 0, then it is not a multiple of 10. 4. If a number is a multiple of 10, then it ends in 0. Which numbered statement is the inverse? Give the number."
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The original conditional is P -> Q: if a number is a multiple of 10, then it ends in 0. The inverse rule says not P -> not Q, so negate both parts without swapping: if a number is not a multiple of 10, then it does not end in 0. Statement 1 matches that inverse. The answer is 1."
        constraints: "form converse $Q\\to P$, inverse $\\neg P\\to\\neg Q$, contrapositive $\\neg Q\\to\\neg P$"
      - id: kp2
        name: "Which forms are equivalent"
        key_prerequisites: [truth-tables]
        exemplars:
          - problem: "For propositions P and Q, consider the three forms Q -> P, ~P -> ~Q, and ~Q -> ~P. Using truth tables, how many of these three forms are logically equivalent to P -> Q?"
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: build the truth table of P -> Q; its values are T, F, T, T in the rows (T,T), (T,F), (F,T), (F,F). Step 2: build the truth tables of the three listed forms; Q -> P gives T, T, F, T and ~P -> ~Q gives T, T, F, T, so each differs from P -> Q in one row, while ~Q -> ~P gives T, F, T, T and matches every row. Step 3: only the contrapositive ~Q -> ~P is equivalent, so the count of equivalent forms is 1."
          - problem: "For real x, the statement 'if x = 2 then x^2 = 4' is true. Form its converse and check it over the three values x = -2, x = 0, and x = 2. In how many of these three cases is the converse true?"
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: the converse of 'if x = 2 then x^2 = 4' is 'if x^2 = 4 then x = 2'. Step 2: evaluate the converse at each value as a truth-table row: at x = -2 the antecedent x^2 = 4 is true and the consequent x = 2 is false, so the converse is false; at x = 0 the antecedent is false, so the implication is vacuously true; at x = 2 both parts are true, so it is true. Step 3: count the true cases among the three values. The converse is true in 2 of the 3 cases."
          - problem: "For propositions P and Q, build the truth table of the converse Q -> P of the conditional P -> Q. In how many of the four rows is Q -> P true?"
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: build the truth table of Q -> P over the rows (T,T), (T,F), (F,T), (F,F). Step 2: an implication is false only when its antecedent is true and its consequent is false, so Q -> P is false only in the row (F,T) and true in the other three rows. Step 3: count the true rows. Q -> P is true in 3 of the 4 rows."
          - problem: "For propositions P and Q, build the truth tables of the conditional P -> Q and of its inverse ~P -> ~Q. Using the tables, decide whether the two forms are logically equivalent and give the number of rows where their truth values differ."
            answer: "verdict = no; rows = 2"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["yes"], ["no"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "rows"}]}
            solution_sketch: "Step 1: build the truth table of P -> Q; its values are T, F, T, T in the rows (T,T), (T,F), (F,T), (F,F). Step 2: build the truth table of the inverse ~P -> ~Q; its values are T, T, F, T. Step 3: compare row by row: the forms differ in the rows (T,F) and (F,T), so they are not equivalent and they differ in 2 rows. The comparison gives verdict = no and rows = 2."
          - problem: "For propositions P and Q, build the truth tables of the four conditional forms P -> Q, Q -> P, ~P -> ~Q, and ~Q -> ~P. The form ~P -> ~Q is logically equivalent to which of the forms below?"
            answer: "converse"
            answer_contract: {"kind": "label", "options": [["converse"], ["original"], ["contrapositive"], ["negation"]]}
            solution_sketch: "Step 1: build the truth tables; the inverse ~P -> ~Q has values T, T, F, T in the rows (T,T), (T,F), (F,T), (F,F). Step 2: compare each form with the inverse: the converse Q -> P has the same values T, T, F, T, so it matches in every row. Step 3: the wrong options: original P -> Q differs in two rows, the error of confusing the inverse with the contrapositive; contrapositive ~Q -> ~P has values T, F, T, T, matching P -> Q and not the inverse, the same confusion; negation of the conditional has values F, T, F, F, the error of replacing the inverse with the negation. The matching form is the converse."
          - problem: "For propositions P and Q, build the truth tables of the four forms P -> Q, Q -> P, ~P -> ~Q, and ~Q -> ~P. Using truth tables, how many of the six pairs of these forms are logically equivalent?"
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: build the truth tables: P -> Q gives T, F, T, T; Q -> P gives T, T, F, T; ~P -> ~Q gives T, T, F, T; ~Q -> ~P gives T, F, T, T. Step 2: compare all six pairs row by row: the pair (P -> Q, ~Q -> ~P) matches in all rows and the pair (Q -> P, ~P -> ~Q) matches in all rows, while the other four pairs differ in at least one row. Step 3: count the equivalent pairs. The number of equivalent pairs is 2."
        constraints: "justify equivalence or non-equivalence via truth tables"
      - id: kp3
        name: "Biconditionals as two conditionals"
        key_prerequisites: [propositional-logic]
        exemplars:
          - problem: 'Write $P \leftrightarrow Q$ as a conjunction of two conditionals.'
            answer_contract: {kind: none}
            answer: '$(P \to Q) \land (Q \to P)$'
            solution_sketch: 'A biconditional asserts both the conditional and its converse.'
          - problem: 'Is the biconditional "$x = 1 \leftrightarrow x^2 = 1$" true for all real $x$?'
            answer_contract: {kind: none}
            answer: 'No; at $x = -1$ the direction $x^2 = 1 \to x = 1$ fails.'
            solution_sketch: 'The forward direction $x = 1 \to x^2 = 1$ always holds, but $x = -1$ satisfies $x^2 = 1$ with $x \ne 1$, so the converse direction fails and the biconditional is false there.'
        constraints: "split $\\leftrightarrow$ into a conditional and its converse; test both directions"
    diagnostic_exemplar:
      problem: 'For "if $x = 3$ then $x^2 = 9$" (real $x$): state the converse and the contrapositive, say which of the two is equivalent to the original, and decide whether the biconditional "$x = 3 \leftrightarrow x^2 = 9$" holds for every real $x$.'
      answer_contract: {kind: none}
      answer: 'Converse: "if $x^2 = 9$ then $x = 3$". Contrapositive: "if $x^2 \ne 9$ then $x \ne 3$". The contrapositive is equivalent to the original; the converse is not, since it fails at $x = -3$. The biconditional is the conjunction of the statement with its converse, so it also fails at $x = -3$: it does not hold for every real $x$.'
      solution_sketch: 'Swap for the converse; negate and swap for the contrapositive. Testing the converse at $x = -3$ settles both the equivalence question and the biconditional.'
    anki_seeds:
      - front: 'Converse, inverse, and contrapositive of $P \to Q$?'
        back: 'Converse $Q \to P$; inverse $\neg P \to \neg Q$; contrapositive $\neg Q \to \neg P$.'
        type: basic
      - front: 'Which of converse / inverse / contrapositive is equivalent to $P \to Q$?'
        back: 'The contrapositive $\neg Q \to \neg P$ (the inverse is equivalent to the converse).'
        type: basic
      - front: '$P \leftrightarrow Q$ written as two conditionals?'
        back: '$(P \to Q) \land (Q \to P)$.'
        type: basic

  - id: necessary-sufficient-conditions
    name: "Necessary and Sufficient Conditions"
    core: false                # supplemental: terminology gloss on conditional-statements
    difficulty: 0.52
    drill: false
    answer_kind: numeric
    expected_time_secs: 130
    prerequisites:
      - id: conditional-statements
        weight: 0.6
        key: true
    knowledge_points:
      - id: kp1
        name: "Sufficient conditions"
        key_prerequisites: [conditional-statements]
        exemplars:
          - problem: "The sentence to translate reads: divisibility of n by 12 is sufficient for divisibility of n by 4, for integers n. Select the conditional statement that this sentence expresses."
            answer: "if n is divisible by 12 then n is divisible by 4"
            answer_contract: {"kind": "label", "options": [["if n is divisible by 12 then n is divisible by 4"], ["if n is divisible by 4 then n is divisible by 12"], ["if n is divisible by 12 then n is divisible by 3"], ["if n is divisible by 8 then n is divisible by 4"]]}
            solution_sketch: "The object is the sentence divisibility of n by 12 is sufficient for divisibility of n by 4. Step 1, the translation rule: A is sufficient for B means if A then B, so A is divisibility by 12 and B is divisibility by 4. Step 2, read off the conditional and compare the options: the option if n is divisible by 4 then n is divisible by 12 makes the converse error of swapping A and B, the option if n is divisible by 12 then n is divisible by 3 keeps the antecedent but swaps in a different consequent, and the option if n is divisible by 8 then n is divisible by 4 keeps the consequent but swaps in a different antecedent. The requested conditional is if n is divisible by 12 then n is divisible by 4."
          - problem: "Consider the whole numbers x from 1 to 8. The claim is that x > 2 is a sufficient condition for x^2 > 16. Give the set of these values of x for which x > 2 holds but x^2 > 16 fails."
            answer: "{3, 4}"
            answer_contract: {"kind": "set"}
            solution_sketch: "The object is the conditional: if x > 2 then x^2 > 16, for whole numbers x from 1 to 8. Step 1, the translation rule: x > 2 is sufficient for x^2 > 16 means exactly that conditional. Step 2, the counterexample test: x = 3 gives 9 and x = 4 gives 16, and neither value is greater than 16, so both fail the consequent, while x = 5 through x = 8 all pass. So the set of counterexamples is {3, 4}."
          - problem: "Take the whole numbers n from 1 to 12. Decide whether divisibility of n by 4 is sufficient for divisibility of n by 6. Give the set of n in that range which are divisible by 4 but not divisible by 6."
            answer: "{4, 8}"
            answer_contract: {"kind": "set"}
            solution_sketch: "Step 1, the translation rule: divisibility of n by 4 is sufficient for divisibility of n by 6 means if 4 divides n then 6 divides n. Step 2, check the multiples of 4 from 1 to 12, which are 4, 8 and 12; the values 4 and 8 are not divisible by 6, while 12 is divisible by 6. So the set of counterexamples is {4, 8}."
          - problem: "Over the whole numbers n from 1 to 15, decide whether n being divisible by 3 is a sufficient condition for n being even. Give the number of n in this range that are divisible by 3 but odd."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1, the translation rule: n being divisible by 3 is sufficient for n being even means if 3 divides n then n is even. Step 2, list the multiples of 3 from 1 to 15, which are 3, 6, 9, 12 and 15, and keep the odd ones, namely 3, 9 and 15. So the number of counterexamples is 3."
          - problem: "For the whole numbers n from 1 to 12, decide whether n being even is sufficient for n being divisible by 4. Give the set of n in this range that are even but not divisible by 4."
            answer: "{2, 6, 10}"
            answer_contract: {"kind": "set"}
            solution_sketch: "Step 1, the translation rule: n being even is sufficient for n being divisible by 4 means if n is even then 4 divides n. Step 2, check the even numbers from 1 to 12, which are 2, 4, 6, 8, 10 and 12; the values 4, 8 and 12 are divisible by 4, while 2, 6 and 10 are not divisible by 4. So the set of counterexamples is {2, 6, 10}."
          - problem: "For the whole numbers n from 1 to 20, decide whether divisibility of n by 12 is sufficient for divisibility of n by 3. Give the number of n in this range that are divisible by 12 but not divisible by 3."
            answer: "0"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1, the translation rule: divisibility of n by 12 is sufficient for divisibility of n by 3 means if 12 divides n then 3 divides n. Step 2, find the multiples of 12 from 1 to 20, and the only one is 12, which is divisible by 3, so no value in the range fails the consequent. The number of counterexamples is 0."
        constraints: "translate sufficient-condition phrasing into $A \\to B$ and judge its truth"
      - id: kp2
        name: "Necessary conditions and only if"
        key_prerequisites: [conditional-statements]
        exemplars:
          - problem: 'Rewrite "$n$ even is necessary for $n$ divisible by $4$" as a conditional.'
            answer_contract: {kind: none}
            answer: 'If $n$ is divisible by $4$ then $n$ is even.'
            solution_sketch: '"$B$ is necessary for $A$" means $A \to B$. Here $A$ is "divisible by 4" and $B$ is "even".'
          - problem: 'Rewrite "$n$ is prime only if $n \ge 2$" as a conditional.'
            answer_contract: {kind: none}
            answer: 'If $n$ is prime then $n \ge 2$.'
            solution_sketch: '"$P$ only if $Q$" means $P \to Q$: primality can occur only when $n \ge 2$.'
        constraints: "necessary and only-if phrasing both translate to $A \\to B$ with the guaranteed part as conclusion"
      - id: kp3
        name: "Unless, and necessary-and-sufficient"
        key_prerequisites: [conditional-statements]
        exemplars:
          - problem: "Consider the statement: the picnic happens unless it rains. Which option gives the correct conditional translation? Select the correct translation."
            answer: "If it does not rain then the picnic happens."
            answer_contract: {"kind": "label", "options": [["If it does not rain then the picnic happens."], ["If it rains then the picnic happens."], ["If the picnic happens then it rains."], ["If it does not rain then the picnic does not happen."]]}
            solution_sketch: "Translate 'P unless Q' by the unless rule: it means not Q implies P. Here P is 'the picnic happens' and Q is 'it rains', so the full conditional is: If it does not rain then the picnic happens. The option 'If it rains then the picnic happens' uses Q as the antecedent instead of not Q. The option 'If the picnic happens then it rains' is the converse, not the unless translation. The option 'If it does not rain then the picnic does not happen' negates P instead of keeping it. Therefore the correct option is If it does not rain then the picnic happens."
          - problem: "Consider the statement: divisibility by 12 is necessary and sufficient for divisibility by both 3 and 4. Which option expresses it as a biconditional? Select the correct expression."
            answer: "12 | n <-> (3 | n and 4 | n)"
            answer_contract: {"kind": "label", "options": [["12 | n <-> (3 | n and 4 | n)"], ["12 | n -> (3 | n and 4 | n)"], ["(3 | n and 4 | n) -> 12 | n"], ["12 | n or (3 | n and 4 | n)"]]}
            solution_sketch: "Necessary and sufficient together assert both directions, so the full statement is the biconditional 12 | n <-> (3 | n and 4 | n). The option '12 | n -> (3 | n and 4 | n)' gives only the necessary direction. The option '(3 | n and 4 | n) -> 12 | n' gives only the sufficient direction. The option '12 | n or (3 | n and 4 | n)' uses disjunction instead of a biconditional. Therefore the correct option is 12 | n <-> (3 | n and 4 | n)."
          - problem: "For statements P and Q, the statement 'P unless Q' translates as not Q implies P. Encode true as 1 and false as 0. Find the truth values (P, Q) that make 'P unless Q' false. Give the answer as (x, y)."
            answer: "(0, 0)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "By the unless rule, 'P unless Q' means not Q implies P. A conditional is false only when its antecedent is true and its consequent is false, so not Q is true and P is false. Thus Q is false and P is false, which is (0, 0) with 1 for true and 0 for false. The answer is (0, 0)."
          - problem: "For statements P and Q, the statement 'P unless Q' translates as not Q implies P. How many of the four possible truth assignments make 'P unless Q' true? Give the answer as an integer."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Translate 'P unless Q' as not Q implies P. The conditional not Q implies P is false only when Q is false and P is false. The other three assignments (P,Q) = (1,1), (1,0), (0,1) make it true. Therefore the number of true assignments is 3."
          - problem: "For statements P and Q, 'P is necessary and sufficient for Q' is the biconditional P <-> Q. How many of the four possible truth assignments make this biconditional false? Give the answer as an integer."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "A biconditional P <-> Q is true when P and Q have the same truth value. It is false when they differ: (P,Q) = (1,0) and (0,1). That is two assignments. Therefore the number of false assignments is 2."
          - problem: "For statements P and Q, 'P is necessary for Q' translates as Q implies P. Encode true as 1 and false as 0. Find the truth values (P, Q) that make 'P is necessary for Q' false. Give the answer as (x, y)."
            answer: "(0, 1)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "By the necessary condition rule, 'P is necessary for Q' means Q implies P. A conditional is false only when its antecedent is true and its consequent is false, so Q is true and P is false. Thus the false assignment is (P,Q) = (0,1). The answer is (0, 1)."
        constraints: "translate unless as $\\neg Q \\to P$; necessary-and-sufficient as $\\leftrightarrow$"
    diagnostic_exemplar:
      problem: 'Express "divisibility by $10$ is necessary and sufficient for divisibility by both $2$ and $5$" as a symbolic biconditional, and rewrite "$n^2$ is odd unless $n$ is even" as a conditional.'
      answer_contract: {kind: none}
      answer: '$10 \mid n \leftrightarrow (2 \mid n \land 5 \mid n)$: "necessary" gives $(2 \mid n \land 5 \mid n) \to 10 \mid n$ read one way and "sufficient" the other, so the two conditionals combine into a biconditional. And "$A$ unless $B$" means "if not $B$ then $A$": "if $n$ is not even, then $n^2$ is odd".'
      solution_sketch: 'Necessary-and-sufficient means both directions, i.e. a biconditional; "unless" puts the negated condition in the antecedent.'
    anki_seeds:
      - front: '"$Q$ is necessary for $P$" and "$Q$ is sufficient for $P$" as conditionals?'
        back: 'Necessary: $P \to Q$. Sufficient: $Q \to P$.'
        type: basic
      - front: '"$P$ only if $Q$" as a conditional?'
        back: '$P \to Q$.'
        type: basic
      - front: '"$P$ unless $Q$" as a conditional?'
        back: '$\neg Q \to P$.'
        type: basic

  - id: de-morgan-double-negation
    name: "De Morgan's Laws and Double Negation"
    core: true
    difficulty: 0.50
    drill: false
    answer_kind: numeric
    expected_time_secs: 100
    prerequisites:
      - id: truth-tables
        weight: 0.5
        key: true
      - id: logical-connectives
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: "Double negation"
        key_prerequisites: [truth-tables]
        exemplars:
          - problem: 'Simplify $\neg(\neg P)$.'
            answer: '$P$'
            solution_sketch: 'Negating twice returns the original truth value in both rows.'
          - problem: 'Simplify $\neg\neg(P \lor Q)$.'
            answer_contract: {kind: none}
            answer: '$P \lor Q$'
            solution_sketch: 'Double negation cancels, leaving the disjunction unchanged.'
        constraints: "cancel paired negations"
      - id: kp2
        name: "De Morgan's laws"
        key_prerequisites: [truth-tables]
        exemplars:
          - problem: 'Use De Morgan to rewrite $\neg(P \land Q)$.'
            answer_contract: {kind: none}
            answer: '$\neg P \lor \neg Q$'
            solution_sketch: 'De Morgan: the negation of a conjunction is the disjunction of the negations.'
          - problem: 'Simplify $\neg(\neg P \lor Q)$.'
            answer_contract: {kind: none}
            answer: '$P \land \neg Q$'
            solution_sketch: 'De Morgan gives $\neg\neg P \land \neg Q$; double negation $\neg\neg P \equiv P$, so $P \land \neg Q$.'
        constraints: "apply De Morgan and double negation to simplify"
      - id: kp3
        name: "Nested applications"
        key_prerequisites: [truth-tables]
        exemplars:
          - problem: 'Push the negation inward: $\neg(P \land (Q \lor R))$.'
            answer_contract: {kind: none}
            answer: '$\neg P \lor (\neg Q \land \neg R)$'
            solution_sketch: 'De Morgan on the conjunction gives $\neg P \lor \neg(Q \lor R)$; De Morgan again on the inner disjunction gives $\neg Q \land \neg R$.'
          - problem: 'Push the negation inward: $\neg((P \lor Q) \land \neg R)$.'
            answer_contract: {kind: none}
            answer: '$(\neg P \land \neg Q) \lor R$'
            solution_sketch: 'De Morgan gives $\neg(P \lor Q) \lor \neg\neg R$; the first part becomes $\neg P \land \neg Q$ and double negation gives $R$.'
        constraints: "two nested De Morgan steps; all negations end on atomic variables"
    diagnostic_exemplar:
      problem: 'Push the negation all the way inward and simplify: $\neg(\neg P \land (Q \lor \neg R))$.'
      answer_contract: {kind: none}
      answer: '$P \lor (\neg Q \land R)$. Step by step: De Morgan on the outer conjunction gives $\neg\neg P \lor \neg(Q \lor \neg R)$; double negation gives $P \lor \neg(Q \lor \neg R)$; De Morgan on the disjunction gives $P \lor (\neg Q \land \neg\neg R)$; a final double negation gives $P \lor (\neg Q \land R)$.'
      solution_sketch: 'Apply De Morgan to the outer conjunction, then to the inner disjunction, cancelling double negations as they appear.'
    anki_seeds:
      - front: 'De Morgan''s laws for logic?'
        back: '$\neg(P \land Q) \equiv \neg P \lor \neg Q$ and $\neg(P \lor Q) \equiv \neg P \land \neg Q$.'
        type: basic
      - front: 'Double negation law?'
        back: '$\neg(\neg P) \equiv P$.'
        type: basic

  - id: logical-equivalence
    name: "Logical Equivalence"
    core: true
    difficulty: 0.55
    drill: false
    answer_kind: numeric
    expected_time_secs: 150
    prerequisites:
      - id: truth-tables
        weight: 0.5
        key: true
      - id: de-morgan-double-negation
        weight: 0.4
        key: true
      - id: conditional-statements
        weight: 0.0
    knowledge_points:
      - id: kp1
        name: "Verifying equivalence with truth tables"
        key_prerequisites: [truth-tables]
        exemplars:
          - problem: 'Show that $P \to Q$ and $\neg P \lor Q$ are logically equivalent.'
            answer_contract: {kind: none}
            answer: 'Equivalent; both are false only in the row $P$ true, $Q$ false.'
            solution_sketch: 'Build both tables: $P \to Q$ is false only at $(T,F)$; $\neg P \lor Q$ is false only when $\neg P$ is false and $Q$ is false, i.e. $(T,F)$. Columns match, so they are equivalent.'
          - problem: 'Are $P \land (P \lor Q)$ and $P$ logically equivalent?'
            answer_contract: {kind: none}
            answer: 'Yes (absorption).'
            solution_sketch: 'When $P$ is true, $P \lor Q$ is true so the conjunction is true; when $P$ is false the conjunction is false. The column equals that of $P$, so they are equivalent.'
        constraints: "prove equivalence by matching full truth-table columns"
      - id: kp2
        name: "Rewriting implications"
        key_prerequisites: [conditional-statements]
        exemplars:
          - problem: 'Rewrite the negation of $P \to Q$ without a conditional.'
            answer_contract: {kind: none}
            answer: '$P \land \neg Q$'
            solution_sketch: '$P \to Q \equiv \neg P \lor Q$; negating and applying De Morgan gives $\neg(\neg P \lor Q) \equiv P \land \neg Q$.'
          - problem: 'Simplify $\neg(P \to Q) \lor Q$.'
            answer_contract: {kind: none}
            answer: '$P \lor Q$'
            solution_sketch: '$\neg(P \to Q) \equiv P \land \neg Q$, so the expression is $(P \land \neg Q) \lor Q \equiv (P \lor Q) \land (\neg Q \lor Q) \equiv (P \lor Q) \land T \equiv P \lor Q$.'
        constraints: "use $P\\to Q \\equiv \\neg P \\lor Q$; negate implications"
      - id: kp3
        name: "Simplification chains with the laws"
        key_prerequisites: [de-morgan-double-negation]
        exemplars:
          - problem: 'Simplify $(P \land Q) \lor (P \land \neg Q)$ using the distributive law.'
            answer: '$P$'
            solution_sketch: 'Distribute: $(P \land Q) \lor (P \land \neg Q) \equiv P \land (Q \lor \neg Q) \equiv P \land T \equiv P$.'
          - problem: 'Simplify $(P \lor Q) \land (P \lor \neg Q)$.'
            answer: '$P$'
            solution_sketch: 'Distribute: $(P \lor Q) \land (P \lor \neg Q) \equiv P \lor (Q \land \neg Q) \equiv P \lor F \equiv P$.'
        constraints: "multi-step law chains: distributive, negation, identity laws; cite each law used"
    diagnostic_exemplar:
      problem: 'Simplify $\neg(P \to Q) \lor (P \land Q)$ to a formula in a single variable, naming the law used at each step.'
      answer_contract: {kind: none}
      answer: 'The result is $P$. Steps: $\neg(P \to Q) \equiv P \land \neg Q$ (negation of a conditional), so the formula is $(P \land \neg Q) \lor (P \land Q)$; the distributive law factors this as $P \land (\neg Q \lor Q)$; $\neg Q \lor Q$ is a tautology (excluded middle); and $P \land \mathrm{T} \equiv P$ (identity law).'
      solution_sketch: 'Rewrite the negated conditional first, then factor $P$ out with distributivity and collapse the tautology.'
    anki_seeds:
      - front: 'Rewrite $P \to Q$ using only $\lor$ and $\neg$.'
        back: '$\neg P \lor Q$.'
        type: basic
      - front: 'Negation of $P \to Q$?'
        back: '$P \land \neg Q$.'
        type: basic
      - front: 'Distributive laws of $\land$ over $\lor$ and $\lor$ over $\land$?'
        back: '$P \land (Q \lor R) \equiv (P \land Q) \lor (P \land R)$ and $P \lor (Q \land R) \equiv (P \lor Q) \land (P \lor R)$.'
        type: basic

  - id: predicates-and-domains
    name: "Predicates and Domains"
    core: true
    difficulty: 0.48
    drill: false
    answer_kind: numeric
    expected_time_secs: 100
    prerequisites:
      - id: propositional-logic
        weight: 0.5
        key: true
      - id: evaluating-expressions
        weight: 0.2
    knowledge_points:
      - id: kp1
        name: "Predicates and substitution"
        key_prerequisites: [propositional-logic]
        exemplars:
          - problem: 'Let $P(x)$: "$x^2 \le 9$" over $\mathbb{Z}$. Find the truth values of $P(2)$ and $P(5)$.'
            answer_contract: {kind: none}
            answer: '$P(2)$ is true; $P(5)$ is false.'
            solution_sketch: 'Substitute: $2^2 = 4 \le 9$ (true); $5^2 = 25 > 9$ (false). A predicate becomes a proposition once a domain element is plugged in.'
          - problem: 'Let $Q(n)$: "$n$ is prime". Find the truth values of $Q(7)$ and $Q(9)$.'
            answer_contract: {kind: none}
            answer: '$Q(7)$ is true; $Q(9)$ is false ($9 = 3 \cdot 3$).'
            solution_sketch: '$7$ has no nontrivial divisors; $9$ factors as $3^2$.'
        constraints: "one-variable predicates; substitute specific domain elements"
      - id: kp2
        name: "Truth sets"
        key_prerequisites: [propositional-logic]
        exemplars:
          - problem: 'Find the truth set of $P(x)$: "$x^2 \le 9$" over the domain $\mathbb{Z}$.'
            answer: '$\{-3, -2, -1, 0, 1, 2, 3\}$'
            solution_sketch: '$x^2 \le 9$ holds exactly for integers with $|x| \le 3$.'
          - problem: 'Find the truth set of $Q(n)$: "$n$ is odd and $n < 10$" over the positive integers.'
            answer: '$\{1, 3, 5, 7, 9\}$'
            solution_sketch: 'List the positive odd integers below $10$.'
        constraints: "finite truth sets the learner can list; the domain must be stated"
      - id: kp3
        name: "Predicates with several variables"
        key_prerequisites: [propositional-logic]
        exemplars:
          - problem: 'Let $R(x, y)$: "$x + y = 5$" over $\mathbb{Z}$. Find the truth values of $R(2, 3)$ and $R(4, 4)$.'
            answer_contract: {kind: none}
            answer: '$R(2, 3)$ is true; $R(4, 4)$ is false.'
            solution_sketch: '$2 + 3 = 5$ but $4 + 4 = 8 \ne 5$. A two-place predicate needs both arguments filled to become a proposition.'
          - problem: 'Let $S(m, n)$: "$m \mid n$". Find the truth values of $S(3, 12)$ and $S(5, 12)$.'
            answer_contract: {kind: none}
            answer: '$S(3, 12)$ is true; $S(5, 12)$ is false.'
            solution_sketch: '$12 = 3 \cdot 4$, so $3 \mid 12$; but $12/5$ is not an integer.'
        constraints: "two-variable predicates; evaluate at specific pairs"
    diagnostic_exemplar:
      problem: 'Let $P(x)$: "$x^2 - 5x + 6 = 0$" over $\mathbb{Z}$. Find the truth set of $P$.'
      answer: '$\{2, 3\}$'
      solution_sketch: 'Factor: $x^2 - 5x + 6 = (x - 2)(x - 3)$, which vanishes exactly at $x = 2$ and $x = 3$.'
    anki_seeds:
      - front: 'What is a predicate?'
        back: 'A statement containing variables that becomes a proposition when each variable is given a value from its domain.'
        type: basic
      - front: 'Truth set of a predicate $P(x)$ over a domain $D$?'
        back: 'The set of all $x \in D$ for which $P(x)$ is true.'
        type: basic

  - id: universal-existential-statements
    name: "Universal and Existential Statements"
    core: true
    difficulty: 0.50
    drill: false
    answer_kind: numeric
    expected_time_secs: 120
    prerequisites:
      - id: predicates-and-domains
        weight: 0.6
        key: true
      - id: propositional-logic
        weight: 0.2
    knowledge_points:
      - id: kp1
        name: "Universal statements"
        key_prerequisites: [predicates-and-domains]
        exemplars:
          - problem: 'Is $\forall x \in \mathbb{R},\ x^2 > 0$ true?'
            answer_contract: {kind: none}
            answer: 'No; $x = 0$ gives $x^2 = 0$, not $> 0$.'
            solution_sketch: 'The single value $x = 0$ has $x^2 = 0$, so the universal statement fails; one counterexample suffices to refute a $\forall$.'
          - problem: 'Is $\forall n \in \{1, 2, 3\},\ n^2 \le 9$ true?'
            answer_contract: {kind: none}
            answer: 'Yes; check all three: $1, 4, 9 \le 9$.'
            solution_sketch: 'Over a finite domain a universal statement is verified by checking every element.'
        constraints: "one quantifier; stated domain; finite domains checked exhaustively"
      - id: kp2
        name: "Existential statements"
        key_prerequisites: [predicates-and-domains]
        exemplars:
          - problem: 'Is $\forall x \in \mathbb{Z},\ x^2 \ge 0$ true? Is $\exists x \in \mathbb{Z},\ x^2 = 2$ true?'
            answer_contract: {kind: none}
            answer: 'The first is true; the second is false.'
            solution_sketch: 'Every integer squared is $\ge 0$, so the universal holds. No integer squares to $2$ ($1^2 = 1$, $2^2 = 4$), so the existential fails.'
          - problem: 'Is $\exists n \in \{1, 2, 3\},\ n^2 = 5$ true?'
            answer_contract: {kind: none}
            answer: 'No; the squares are $1, 4, 9$.'
            solution_sketch: 'An existential over a finite domain fails only when every element fails; none of $1, 4, 9$ equals $5$.'
        constraints: "determine the truth value of a singly-quantified statement over a stated domain"
      - id: kp3
        name: "Translating single-quantifier English"
        key_prerequisites: [predicates-and-domains]
        exemplars:
          - problem: 'Translate "every multiple of $4$ is even" using quantifiers.'
            answer_contract: {kind: none}
            answer: '$\forall n \in \mathbb{Z},\ (4 \mid n \to 2 \mid n)$'
            solution_sketch: 'A universal claim about multiples of $4$ becomes a $\forall$ guarded by the conditional "if $4 \mid n$ then ...".'
          - problem: 'Translate "some prime is even" using quantifiers, and give its truth value.'
            answer_contract: {kind: none}
            answer: '$\exists p\,(p \text{ prime} \land p \text{ even})$; true, witnessed by $p = 2$.'
            solution_sketch: 'Existence claims pair $\exists$ with a conjunction; $2$ is an even prime, so the statement is true.'
        constraints: "universal claims use $\\to$; existential claims use $\\land$"
    diagnostic_exemplar:
      problem: 'Translate "some perfect square is odd" using quantifiers and give its truth value; then decide whether "for every $n \in \{2, 4, 6\}$, $n^2 + 1$ is prime" is true.'
      answer_contract: {kind: none}
      answer: '$\exists n \in \mathbb{Z},\ (n \text{ is a perfect square} \land n \text{ is odd})$ — true, witnessed by $n = 9 = 3^2$. The universal statement is also true: $2^2 + 1 = 5$, $4^2 + 1 = 17$ and $6^2 + 1 = 37$ are all prime, and those are the only three cases.'
      solution_sketch: 'An existential statement needs a single witness; a universal statement over a finite domain needs every case checked.'
    anki_seeds:
      - front: 'Meaning of $\forall x\, P(x)$ and $\exists x\, P(x)$?'
        back: '$\forall$: $P(x)$ holds for every $x$ in the domain. $\exists$: $P(x)$ holds for at least one $x$.'
        type: basic
      - front: 'Translating "every $A$ is $B$" vs. "some $A$ is $B$"?'
        back: 'Every: $\forall x\,(A(x) \to B(x))$. Some: $\exists x\,(A(x) \land B(x))$.'
        type: basic

  - id: quantifiers
    name: "Quantifiers"
    core: true
    difficulty: 0.55
    drill: false
    answer_kind: numeric
    expected_time_secs: 150
    prerequisites:
      - id: universal-existential-statements
        weight: 0.6
        key: true
      - id: predicates-and-domains
        weight: 0.3
      - id: conditional-statements
        weight: 0.2
    knowledge_points:
      - id: kp1
        name: "Nested quantifiers and order"
        key_prerequisites: [universal-existential-statements]
        exemplars:
          - problem: 'Is $\forall x \in \mathbb{R}\ \exists y \in \mathbb{R},\ y > x$ true? Does swapping to $\exists y\ \forall x,\ y > x$ change its truth?'
            answer_contract: {kind: none}
            answer: 'The first is true; the swapped statement is false.'
            solution_sketch: 'For each $x$ take $y = x + 1$, so the first holds. But no single $y$ exceeds every $x$, so $\exists y\, \forall x$ is false. Quantifier order matters.'
          - problem: 'Is $\forall x \in \mathbb{Z}\ \exists y \in \mathbb{Z},\ x + y = 0$ true?'
            answer_contract: {kind: none}
            answer: 'Yes; take $y = -x$.'
            solution_sketch: 'For each integer $x$, choosing $y = -x$ gives $x + y = 0$, so the statement holds for every $x$.'
        constraints: "two nested quantifiers; show that order changes meaning"
      - id: kp2
        name: "Translating mathematical statements"
        key_prerequisites: [conditional-statements]
        exemplars:
          - problem: 'Translate "every even integer greater than $2$ is a sum of two primes" using quantifiers.'
            answer_contract: {kind: none}
            answer: '$\forall n\, ((n \text{ even} \land n > 2) \to \exists p, q \text{ prime},\ n = p + q)$.'
            solution_sketch: 'A universal over $n$ guarded by a conditional, then an existential over primes $p, q$.'
          - problem: 'Translate "every real number has an additive inverse" using quantifiers.'
            answer_contract: {kind: none}
            answer: '$\forall x \in \mathbb{R}\ \exists y \in \mathbb{R},\ x + y = 0$.'
            solution_sketch: 'A universal over $x$ followed by an existential asserting a $y$ that sums to $0$ with $x$.'
        constraints: "combine quantifiers with a guarding conditional"
      - id: kp3
        name: "Evaluating nested statements over given domains"
        key_prerequisites: [universal-existential-statements]
        exemplars:
          - problem: 'Over the domain $\{1, 2\}$ for both variables, is $\forall x\ \exists y,\ x + y = 3$ true? Is $\exists y\ \forall x,\ x + y = 3$ true?'
            answer_contract: {kind: none}
            answer: 'The first is true ($y = 3 - x$ works: $1 + 2 = 3$, $2 + 1 = 3$); the second is false.'
            solution_sketch: 'For each $x$ the other element works. But a single $y$ would need $1 + y = 3$ and $2 + y = 3$ simultaneously, forcing $y = 2$ and $y = 1$ — impossible.'
          - problem: 'Is $\forall x \in \mathbb{R}\ \exists y \in \mathbb{R},\ y^3 = x$ true? What about $\forall x \in \mathbb{R}\ \exists y \in \mathbb{R},\ y^2 = x$?'
            answer_contract: {kind: none}
            answer: 'The first is true (real cube roots always exist); the second is false ($x = -1$ has no real square root).'
            solution_sketch: 'Cubing is onto $\mathbb{R}$, so $y = \sqrt[3]{x}$ always works. Squares are never negative, so $x = -1$ is a counterexample to the second.'
        constraints: "nested quantifiers over small finite domains or $\\mathbb{R}$/$\\mathbb{Z}$; require a witness or counterexample"
    diagnostic_exemplar:
      problem: 'Is $\exists x \in \mathbb{N},\ \forall y \in \mathbb{N},\ x \le y$ true? Identify such an $x$ if so.'
      answer_contract: {kind: none}
      answer: 'True; the least natural number works ($0$, or $1$ under the convention $\mathbb{N} = \{1, 2, \dots\}$).'
      solution_sketch: '$\mathbb{N}$ has a least element $x$ with $x \le y$ for every $y$, so the statement holds.'
    anki_seeds:
      - front: 'Does the order of $\forall$ and $\exists$ matter?'
        back: 'Yes. $\forall x\, \exists y$ can be true while $\exists y\, \forall x$ is false.'
        type: basic
      - front: 'In $\forall x\, \exists y\, P(x, y)$, what may $y$ depend on?'
        back: 'On $x$: a different witness $y$ may be chosen for each $x$.'
        type: basic

  - id: negating-statements
    name: "Negating Statements"
    core: true
    difficulty: 0.60
    drill: false
    answer_kind: numeric
    expected_time_secs: 150
    prerequisites:
      - id: quantifiers
        weight: 0.5
        key: true
      - id: logical-equivalence
        weight: 0.4
        key: true
      - id: conditional-statements
        weight: 0.0
    knowledge_points:
      - id: kp1
        name: "Negating quantified statements"
        key_prerequisites: [quantifiers]
        exemplars:
          - problem: 'Negate $\forall x \in \mathbb{R},\ x^2 \ge 0$.'
            answer_contract: {kind: none}
            answer: '$\exists x \in \mathbb{R},\ x^2 < 0$.'
            solution_sketch: '$\neg\forall x\, P(x) \equiv \exists x\, \neg P(x)$; the negation of $x^2 \ge 0$ is $x^2 < 0$.'
          - problem: 'Negate $\exists n \in \mathbb{N},\ n^2 = 3$.'
            answer_contract: {kind: none}
            answer: '$\forall n \in \mathbb{N},\ n^2 \ne 3$.'
            solution_sketch: '$\neg\exists n\, P(n) \equiv \forall n\, \neg P(n)$; negate $n^2 = 3$ to $n^2 \ne 3$.'
        constraints: "push the negation inside a single quantifier and negate the predicate"
      - id: kp2
        name: "Negating conditionals and compounds"
        key_prerequisites: [logical-equivalence]
        exemplars:
          - problem: 'Negate "if $n$ is prime then $n$ is odd".'
            answer_contract: {kind: none}
            answer: '$n$ is prime and $n$ is not odd (there is an even prime).'
            solution_sketch: 'The negation of $P \to Q$ is $P \land \neg Q$.'
          - problem: 'Negate "$x > 0$ and $x < 1$".'
            answer_contract: {kind: none}
            answer: '$x \le 0$ or $x \ge 1$.'
            solution_sketch: 'By De Morgan, $\neg(P \land Q) \equiv \neg P \lor \neg Q$: negate each part and switch $\land$ to $\lor$.'
        constraints: "negate implications via $P \\land \\neg Q$; negate $\\land$ / $\\lor$ via De Morgan"
      - id: kp3
        name: "Negating nested quantifier statements"
        key_prerequisites: [quantifiers]
        exemplars:
          - problem: 'Negate $\forall \epsilon > 0\ \exists \delta > 0,\ (|x - a| < \delta \to |f(x) - L| < \epsilon)$.'
            answer_contract: {kind: none}
            answer: '$\exists \epsilon > 0\ \forall \delta > 0,\ (|x - a| < \delta \land |f(x) - L| \ge \epsilon)$.'
            solution_sketch: 'Flip each quantifier ($\forall \leftrightarrow \exists$) and negate the inner conditional $P \to Q$ to $P \land \neg Q$.'
          - problem: 'Negate "$\forall x \in \mathbb{R}\ \exists n \in \mathbb{N},\ n > x$" (the Archimedean property).'
            answer_contract: {kind: none}
            answer: '$\exists x \in \mathbb{R}\ \forall n \in \mathbb{N},\ n \le x$.'
            solution_sketch: 'Flip $\forall$ to $\exists$ and $\exists$ to $\forall$, and negate $n > x$ to $n \le x$.'
        constraints: "epsilon-delta style; flip every quantifier and negate the matrix"
    diagnostic_exemplar:
      problem: 'Negate, pushing the negation all the way in: "$\forall \epsilon > 0\ \exists n \in \mathbb{N}$, if $n > 10$ then $1/n < \epsilon$".'
      answer_contract: {kind: none}
      answer: '$\exists \epsilon > 0\ \forall n \in \mathbb{N},\ (n > 10 \ \land\ 1/n \ge \epsilon)$. Each quantifier flips as the negation passes it ($\forall$ to $\exists$, then $\exists$ to $\forall$), and the negation of the conditional "$n > 10 \to 1/n < \epsilon$" is the conjunction "$n > 10$ and $1/n \ge \epsilon$".'
      solution_sketch: 'Flip the quantifiers in order, then negate the conditional as antecedent-and-not-consequent.'
    anki_seeds:
      - front: 'Negation of $\forall x\, P(x)$ and of $\exists x\, P(x)$?'
        back: '$\neg\forall x\, P(x) \equiv \exists x\, \neg P(x)$ and $\neg\exists x\, P(x) \equiv \forall x\, \neg P(x)$.'
        type: basic
      - front: 'To negate a nested-quantifier statement with a conditional matrix...'
        back: 'Switch every $\forall \leftrightarrow \exists$ and replace the conditional $P \to Q$ by $P \land \neg Q$.'
        type: basic

  - id: counterexamples-and-disproof
    name: "Counterexamples and Disproof"
    core: true
    difficulty: 0.58
    drill: false
    answer_kind: numeric
    expected_time_secs: 150
    prerequisites:
      - id: quantifiers
        weight: 0.5
        key: true
      - id: negating-statements
        weight: 0.4
        key: true
    knowledge_points:
      - id: kp1
        name: "Refuting universal statements"
        key_prerequisites: [quantifiers]
        exemplars:
          - problem: 'Disprove: "every prime is odd".'
            answer_contract: {kind: none}
            answer: 'Counterexample: $2$ is prime and even.'
            solution_sketch: 'A universal statement is refuted by a single counterexample; $2$ is prime but not odd.'
          - problem: 'Disprove: "$\forall x \in \mathbb{R},\ x \le x^2$".'
            answer_contract: {kind: none}
            answer: 'Counterexample: $x = \tfrac{1}{2}$, since $\tfrac{1}{2} > \tfrac{1}{4}$.'
            solution_sketch: 'Any $x$ strictly between $0$ and $1$ has $x^2 < x$; exhibiting one such value refutes the claim.'
        constraints: "one explicit counterexample with verification that it violates the claim"
      - id: kp2
        name: "Testing conjectures"
        key_prerequisites: [quantifiers]
        exemplars:
          - problem: 'Disprove: "$n^2 + n + 41$ is prime for every natural number $n$".'
            answer_contract: {kind: none}
            answer: 'Counterexample: $n = 40$ gives $40^2 + 40 + 41 = 1681 = 41^2$.'
            solution_sketch: 'The polynomial is prime for $n = 0, \dots, 39$, but at $n = 40$ it equals $41^2$ — checking many cases is not a proof.'
          - problem: 'Disprove: "$2^p - 1$ is prime for every prime $p$".'
            answer_contract: {kind: none}
            answer: 'Counterexample: $p = 11$ gives $2^{11} - 1 = 2047 = 23 \cdot 89$.'
            solution_sketch: 'The claim survives $p = 2, 3, 5, 7$ but fails at $p = 11$; a promising pattern still needs proof.'
        constraints: "conjectures that hold for small cases; the counterexample must be verified by factoring or computation"
      - id: kp3
        name: "What disproves what"
        key_prerequisites: [negating-statements]
        exemplars:
          - problem: 'Disprove: "if $n$ is divisible by $3$ then $n$ is divisible by $6$".'
            answer_contract: {kind: none}
            answer: 'Counterexample: $n = 9$, divisible by $3$ but not by $6$.'
            solution_sketch: 'To refute $P \to Q$, exhibit a case with $P$ true and $Q$ false: $3 \mid 9$ but $6 \nmid 9$.'
          - problem: 'What would it take to disprove an existential statement like "$\exists n \in \mathbb{N},\ n^2 = 3$"?'
            answer_contract: {kind: none}
            answer: 'A proof that every $n$ fails, since the negation is the universal $\forall n,\ n^2 \ne 3$.'
            solution_sketch: 'Negating $\exists$ gives $\forall$; a single failed example is not enough — disproving an existential requires a (short) universal proof.'
        constraints: "match the disproof obligation to the negated form of the statement"
    diagnostic_exemplar:
      problem: 'Disprove: "for every positive integer $n$, $n^2 + n + 1$ is prime." Then state what would be needed to disprove the existential claim "$\exists n \in \mathbb{N},\ n^2 = 2$".'
      answer_contract: {kind: none}
      answer: 'Counterexample: $n = 4$ gives $16 + 4 + 1 = 21 = 3 \cdot 7$, which is composite, so the universal claim is false (it does hold for $n = 1, 2, 3$, which is exactly why checking a few cases proves nothing). To disprove the existential claim one must prove its negation, the universal "$\forall n \in \mathbb{N},\ n^2 \ne 2$": no single example helps, but $1^2 = 1 < 2 < 4 = 2^2$ and squaring is increasing on $\mathbb{N}$, so no natural number squares to $2$.'
      solution_sketch: 'A universal claim falls to one counterexample, found by testing small cases; an existential claim falls only to a proof of the corresponding universal.'
    anki_seeds:
      - front: 'What disproves a universal statement $\forall x\, P(x)$?'
        back: 'A single counterexample: one $x$ in the domain with $P(x)$ false.'
        type: basic
      - front: 'What disproves an existential statement $\exists x\, P(x)$?'
        back: 'A proof of the universal negation $\forall x\, \neg P(x)$ — one failed example is not enough.'
        type: basic
      - front: 'What disproves a conditional claim $P \to Q$?'
        back: 'An instance where $P$ is true and $Q$ is false.'
        type: basic

  - id: rules-of-inference
    name: "Rules of Inference"
    core: true
    difficulty: 0.60
    drill: false
    answer_kind: numeric
    expected_time_secs: 150
    prerequisites:
      - id: logical-equivalence
        weight: 0.4
        key: true
      - id: conditional-statements
        weight: 0.4
        key: true
      - id: truth-tables
        weight: 0.0
    knowledge_points:
      - id: kp1
        name: "Modus ponens and modus tollens"
        key_prerequisites: [conditional-statements]
        exemplars:
          - problem: 'From $P \to Q$ and $P$, what can you conclude?'
            answer_contract: {kind: none}
            answer: '$Q$ (modus ponens).'
            solution_sketch: 'Modus ponens: $P \to Q,\ P \vdash Q$.'
          - problem: 'From $P \to Q$ and $\neg Q$, what follows?'
            answer_contract: {kind: none}
            answer: '$\neg P$ (modus tollens).'
            solution_sketch: 'Modus tollens: $P \to Q,\ \neg Q \vdash \neg P$ (contrapositive reasoning).'
        constraints: "apply modus ponens and modus tollens"
      - id: kp2
        name: "Valid vs. invalid argument forms"
        key_prerequisites: [truth-tables]
        exemplars:
          - problem: 'From $P \to Q$ and $Q$, can you conclude $P$?'
            answer_contract: {kind: none}
            answer: 'No; that is the fallacy of affirming the consequent.'
            solution_sketch: '$P \to Q$ and $Q$ do not force $P$: the row $(F, T)$ has both premises true but $P$ false.'
          - problem: 'From $P \to Q$ and $\neg P$, can you conclude $\neg Q$?'
            answer_contract: {kind: none}
            answer: 'No; that is the fallacy of denying the antecedent.'
            solution_sketch: 'A false hypothesis says nothing about $Q$: the row $(F, T)$ has $P \to Q$ and $\neg P$ true but $Q$ true, so $\neg Q$ need not follow.'
        constraints: "identify affirming-the-consequent and denying-the-antecedent fallacies"
      - id: kp3
        name: "Chaining inferences"
        key_prerequisites: [logical-equivalence]
        exemplars:
          - problem: 'Given $P \to Q$, $Q \to R$, and $P$, derive $R$.'
            answer_contract: {kind: none}
            answer: '$R$.'
            solution_sketch: 'Hypothetical syllogism gives $P \to R$; modus ponens with $P$ yields $R$.'
          - problem: 'Given $P \lor Q$ and $\neg P$, derive $Q$.'
            answer_contract: {kind: none}
            answer: '$Q$ (disjunctive syllogism).'
            solution_sketch: 'Disjunctive syllogism: from $P \lor Q$ and $\neg P$, the remaining disjunct $Q$ must hold.'
        constraints: "combine hypothetical/disjunctive syllogism with modus ponens/tollens"
    diagnostic_exemplar:
      problem: 'From $A \to B$, $B \to C$ and $\neg C$, what can you conclude about $A$? And from $A \to B$ together with $B$, may you conclude $A$?'
      answer_contract: {kind: none}
      answer: 'From $A \to B$ and $B \to C$, hypothetical syllogism gives $A \to C$; combined with $\neg C$, modus tollens gives $\neg A$. From $A \to B$ and $B$, however, nothing about $A$ follows — that is the fallacy of affirming the consequent (take $A$: "$n = 2$", $B$: "$n$ is even", and $n = 4$).'
      solution_sketch: 'Chain the two conditionals and apply modus tollens; the second pattern is the classic invalid form.'
    anki_seeds:
      - front: 'Modus ponens?'
        back: 'From $P \to Q$ and $P$, conclude $Q$.'
        type: basic
      - front: 'Modus tollens?'
        back: 'From $P \to Q$ and $\neg Q$, conclude $\neg P$.'
        type: basic
      - front: 'Fallacy of affirming the consequent?'
        back: 'Invalidly concluding $P$ from $P \to Q$ and $Q$.'
        type: basic

  - id: arguments-with-quantifiers
    name: "Arguments with Quantifiers"
    core: false                # supplemental: validity-checking layer over rules-of-inference
    difficulty: 0.62
    drill: false
    answer_kind: numeric
    expected_time_secs: 150
    prerequisites:
      - id: rules-of-inference
        weight: 0.6
        key: true
      - id: quantifiers
        weight: 0.4
        key: true
    knowledge_points:
      - id: kp1
        name: "Universal instantiation and universal modus ponens"
        key_prerequisites: [rules-of-inference]
        exemplars:
          - problem: 'Premises: "every multiple of $4$ is even" and "$12$ is a multiple of $4$". What follows?'
            answer_contract: {kind: none}
            answer: '$12$ is even (universal instantiation, then modus ponens).'
            solution_sketch: 'Instantiate the universal at $n = 12$ to get "$12$ multiple of $4$ $\to$ $12$ even", then apply modus ponens.'
          - problem: 'Premises: "all humans are mortal" and "Socrates is human". Conclusion?'
            answer_contract: {kind: none}
            answer: 'Socrates is mortal.'
            solution_sketch: 'The classic universal-modus-ponens syllogism: instantiate the universal at Socrates, then detach.'
        constraints: "instantiate a universal premise at a named element, then apply a propositional rule"
      - id: kp2
        name: "Generalization rules"
        key_prerequisites: [quantifiers]
        exemplars:
          - problem: 'From the fact "$10$ is even and $10$ is composite", what existential statement follows?'
            answer_contract: {kind: none}
            answer: '$\exists n\,(n \text{ even} \land n \text{ composite})$.'
            solution_sketch: 'Existential generalization: a concrete witness justifies the $\exists$ claim.'
          - problem: 'To prove $\forall x \in \mathbb{R},\ (x + 1)^2 = x^2 + 2x + 1$, why is it enough to expand $(x + 1)^2$ for an arbitrary real $x$?'
            answer_contract: {kind: none}
            answer: 'Universal generalization: a proof for an arbitrary, unspecified $x$ establishes the claim for all $x$.'
            solution_sketch: 'Since the argument used no special property of $x$, the conclusion holds for every real number.'
        constraints: "existential generalization from a witness; universal generalization from an arbitrary element"
      - id: kp3
        name: "Valid and invalid quantified arguments"
        key_prerequisites: [rules-of-inference]
        exemplars:
          - problem: 'Premises: "every square is nonnegative" and "$5$ is nonnegative". Does it follow that $5$ is a perfect square?'
            answer_contract: {kind: none}
            answer: 'No; this is affirming the consequent applied to an instantiated universal.'
            solution_sketch: 'Instantiating gives "$5$ square $\to$ $5 \ge 0$"; knowing the conclusion $5 \ge 0$ does not give the hypothesis.'
          - problem: 'Premises: "every integer divisible by $6$ is divisible by $3$" and "$14$ is not divisible by $3$". What follows about $14$?'
            answer_contract: {kind: none}
            answer: '$14$ is not divisible by $6$ (universal modus tollens).'
            solution_sketch: 'Instantiate at $14$, then modus tollens: the conclusion fails, so the hypothesis fails.'
        constraints: "mix valid universal modus ponens/tollens with quantified versions of the classic fallacies"
    diagnostic_exemplar:
      problem: 'Premises: "every integer divisible by $6$ is even" and "$15$ is not even". What follows about $15$? And do the premises "every integer divisible by $6$ is even" and "$10$ is even" let you conclude that $10$ is divisible by $6$?'
      answer_contract: {kind: none}
      answer: 'Instantiating the universal at $15$ gives "if $6 \mid 15$ then $15$ is even"; with "$15$ is not even", modus tollens yields $6 \nmid 15$ (universal modus tollens). The second inference is invalid: it affirms the consequent of the instantiated conditional — and indeed $10$ is even while $6 \nmid 10$.'
      solution_sketch: 'Instantiate the universal at the named integer, then apply modus tollens; the second pattern affirms the consequent, and a counterexample refutes it.'
    anki_seeds:
      - front: 'Universal instantiation?'
        back: 'From $\forall x\, P(x)$, conclude $P(c)$ for any particular $c$ in the domain.'
        type: basic
      - front: 'Existential generalization?'
        back: 'From $P(c)$ for some particular $c$, conclude $\exists x\, P(x)$.'
        type: basic
