            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'For every $e$ we have $e * y = y$ by the definition of $*$, so all $3$ elements satisfy the condition. None of them is a two-sided identity, because $x * e = e \neq x$ when $x \neq e$.'
          - problem: 'The elements $e$ and $f$ of a monoid are both two-sided identities, and $e * f = 12$. What is the value of $e$?'
            answer: '12'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Because $f$ is an identity, $e * f = e$, so $e = 12$. Because $e$ is an identity, $e * f = f$, so $f = 12$ as well. The two identities are equal.'
          - problem: 'Hour shifts on a 12-hour clock are combined by adding them modulo $12$. Exactly one shift in $\{0, 1, \dots, 11\}$ leaves every time unchanged. Which one is it?'
            answer: '0'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A shift $e$ that changes nothing satisfies $a + e \equiv a \pmod{12}$ for every $a$, so $e = 0$. Only one shift can do this, because the identity of a monoid is unique.'
          - problem: 'On $\mathbb{Z}$ define $a * b = a + b + 6$. This operation is associative. Find its identity element.'
            answer: '-6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'An identity $e$ satisfies $a * e = a$, so $a + e + 6 = a$ and $e = -6$. The other side holds as well, since $(-6) * a = -6 + a + 6 = a$, so the identity is $-6$.'
          - problem: 'A class has $3$ students. Two groups of students are combined by taking all students who are in at least one of the two groups. A group $E$ leaves every group unchanged when it is combined with it, on either side. How many students does $E$ have?'
            answer: '0'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Combining $E$ with a group $A$ gives the students who are in $A$ or in $E$. This equals $A$ for every group $A$ only if $E$ adds nobody, so $E$ has no student. The number of students of $E$ is $0$.'
          - problem: 'Write the full proof that, in a monoid $(M, *)$, any two identity elements $e$ and $f$ of $M$ are equal.'
            answer: 'the identity of a monoid is unique'
            answer_contract: {"kind": "none"}
            solution_sketch: 'Let $e$ and $f$ be identity elements of the monoid $(M, *)$. Since $e$ is an identity, $e * y = y$ for every $y \in M$. Taking $y = f$ gives $e * f = f$. Since $f$ is an identity, $x * f = x$ for every $x \in M$. Taking $x = e$ gives $e * f = e$. Both computations evaluate the same element $e * f$, so $e = e * f = f$. Hence any two identity elements of $M$ are equal, and the identity element of a monoid is unique.'
        constraints: "play the two identities against each other Closed proof-audit items must require this knowledge point's method; verify every proposed inference for the stated arbitrary inputs. Do not supply the decisive result as an established fact."
      - id: kp3
        name: "Recognizing monoids and non-examples"
