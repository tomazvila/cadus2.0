    knowledge_points:
      - id: kp1
        name: 'Equinumerosity via bijection'
        key_prerequisites: [functions-injective-surjective]
        step_check:
          step: 'there is some $k \in \mathbb{N}$ with $m = 3k$'
          question: 'Why can we find such a $k$ for an arbitrary element $m$ of $M$?'
          options:
            - 'Because $f$ is injective, so each $m$ has exactly one partner $k$ in $\mathbb{N}$'
            - 'Because every natural number $m$ is divisible by $3$'
            - 'Each element of $M$ is some $3k$ with $k \in \mathbb{N}$, by definition'
            - 'Because $k$ was fixed before the element $m$ was chosen'
          answer: 'Each element of $M$ is some $3k$ with $k \in \mathbb{N}$, by definition'
          why: 'The set $M$ consists of the numbers $3k$ with $k \in \mathbb{N}$, so any $m \in M$ is $3k$ for some $k$, and then $f(k) = m$.'
        try_first:
          problem: 'Let $S = \{10, 20, 30, 40, \dots\}$ and $\mathbb{N} = \{0, 1, 2, \dots\}$. The map $f(n) = 10n + 10$ is a bijection from $\mathbb{N}$ onto $S$. Which element of $\mathbb{N}$ does $f$ send to $120$?'
          answer_contract: {"kind": "exact"}
          answer: '11'
          reveal: 'Solving $10n + 10 = 120$ gives $n = 11$. Because $f$ is a bijection, every element of $S$ comes from exactly one element of $\mathbb{N}$, so the infinite sets $\mathbb{N}$ and $S$ have the same cardinality.'
        exemplars:
          - problem: 'Let $E = \{0, 2, 4, 6, \dots\}$ and $\mathbb{N} = \{0, 1, 2, \dots\}$. Write the formula $f(n)$ of the increasing bijection $f$ from $\mathbb{N}$ onto $E$.'
            answer: '2n'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Each natural number $n$ is sent to the even number $2n$. It is injective because $2a = 2b$ gives $a = b$, and onto because every element of $E$ has the form $2k$ with $k \in \mathbb{N}$, so it equals $f(k)$.'
          - problem: 'Let $\mathbb{N} = \{0, 1, 2, \dots\}$ and $S = \{-1, 0, 1, 2, \dots\}$. Write the formula $f(n)$ of the increasing bijection $f$ from $\mathbb{N}$ onto $S$.'
            answer: 'n - 1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'We send $0$ to $-1$ and shift every number down by $1$, so $f(n) = n - 1$. It is injective because $a - 1 = b - 1$ gives $a = b$, and onto because each $s \in S$ equals $f(s + 1)$ with $s + 1 \in \mathbb{N}$.'
          - problem: 'The tickets of a lottery are numbered $0, 1, 2, 3, \dots$ without end. The tickets with odd numbers $1, 3, 5, \dots$ are VIP tickets. Ticket $n$ is paired with VIP ticket $2n + 1$, and this pairs every ticket with exactly one VIP ticket. Which VIP ticket is paired with ticket $50$?'
            answer: '101'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The pairing is $n \mapsto 2n + 1$, so ticket $50$ is paired with VIP ticket $2 \cdot 50 + 1 = 101$.'
          - problem: 'In the lottery where ticket $n$ is paired with VIP ticket $2n + 1$, VIP ticket $301$ is paired with which ticket?'
            answer: '150'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'We solve $2n + 1 = 301$, which needs the inverse of the pairing: subtract $1$, then divide by $2$. So $n = 300 / 2 = 150$. Check: $2 \cdot 150 + 1 = 301$.'
          - problem: 'Sam says that $f(n) = n$ is a bijection from $\mathbb{N} = \{0, 1, 2, \dots\}$ onto $\mathbb{Z}$ because $f$ is injective. What is the largest integer that is not a value of $f$?'
            answer: '-1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The values of $f$ are $0, 1, 2, \dots$, so no negative integer is a value. The largest integer missing is $-1$. A bijection must also be onto, so Sam is wrong.'
          - problem: 'Is $f(n) = n^2$ a bijection from $\mathbb{N} = \{0, 1, 2, \dots\}$ onto the set $S = \{0, 1, 4, 9, 16, \dots\}$ of squares?'
            answer: 'yes'
            answer_contract: {"kind": "label", "options": [["yes", "it is a bijection", "is a bijection", "bijection", "it is"], ["no", "it is not a bijection", "is not a bijection", "not a bijection", "it is not"]]}
            solution_sketch: 'The map lands in $S$ by the definition of $S$ and is onto $S$ for the same reason. It is injective because $a^2 = b^2$ with $a, b \geq 0$ gives $a = b$. So $f$ is a bijection.'
          - problem: 'Write the full proof that $\mathbb{N} = \{0, 1, 2, \dots\}$ and the set $S = \{n^2 : n \in \mathbb{N}\}$ of perfect squares have the same cardinality.'
            answer: 'f(n) = n^2: N -> squares bijection'
            answer_contract: {"kind": "none"}
            solution_sketch: 'Proof. Two sets have the same cardinality when there is a bijection between them. Define $f : \mathbb{N} \to S$ by $f(n) = n^2$. By the definition of $S$, $f(n) \in S$ for every $n \in \mathbb{N}$. Injective: suppose $f(a) = f(b)$ for some $a, b \in \mathbb{N}$, that is, $a^2 = b^2$. Then $(a - b)(a + b) = 0$, so $a = b$ or $a + b = 0$. If $a + b = 0$, then $a = b = 0$ because $a, b \geq 0$, so again $a = b$. Surjective: let $s \in S$. By the definition of $S$ there is $n \in \mathbb{N}$ with $s = n^2$, so $s = f(n)$. Hence $f$ is a bijection from $\mathbb{N}$ onto $S$, and $|\mathbb{N}| = |S|$. $\square$'
        constraints: 'Equinumerosity: explicit bijections between infinite sets, preimages, verdicts, one written proof; ticket contexts that need both the map and its inverse'
      - id: kp2
        name: 'Countable sets'
        key_prerequisites: [functions-injective-surjective]
        step_check:
          step: 'list the evens by alternating sign'
          question: 'Why does the listing of the even integers alternate between signs?'
          options:
            - 'A listing of the integers must give the numbers in increasing order'
            - 'Each even integer is then reached after finitely many steps'
            - 'Alternating signs makes $f$ equal to the identity on the evens'
            - 'Listing the negative evens first would reach $0$ too early'
          answer: 'Each even integer is then reached after finitely many steps'
          why: 'A list indexed by $\mathbb{N}$ must reach every element at a finite position; $0, -2, 2, -4, 4, \dots$ does, but "all negatives first" would never reach $0$.'
        exemplars:
          - problem: 'Write the formula $f(n)$ of the increasing enumeration $f : \mathbb{N} \to S$ of the set $S = \{1, 5, 9, 13, \dots\}$, where $\mathbb{N} = \{0, 1, 2, \dots\}$.'
            answer: '4n + 1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The first element is $1$ and each step adds $4$, so $f(n) = 4n + 1$. Every element of $S$ appears exactly once: $f(0) = 1$, $f(1) = 5$, $f(2) = 9$, and so on.'
          - problem: 'Write the formula $f(n)$ of the increasing enumeration $f : \mathbb{N} \to S$ of $S = \{7, 12, 17, 22, \dots\}$, where $\mathbb{N} = \{0, 1, 2, \dots\}$.'
            answer: '5n + 7'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The first element is $7$ and each step adds $5$, so $f(n) = 5n + 7$. Check: $f(0) = 7$, $f(1) = 12$, $f(2) = 17$, $f(3) = 22$.'
          - problem: 'The function $f : \mathbb{N} \to \mathbb{Z}$ is defined by $f(n) = n/2$ if $n$ is even and $f(n) = -(n+1)/2$ if $n$ is odd. What is $f(7)$?'
            answer: '-4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The number $7$ is odd, so $f(7) = -(7 + 1)/2 = -4$. The first values of the listing are $0, -1, 1, -2, 2, -3, 3, -4$.'
          - problem: 'The shelves of an endless library are numbered by all integers $\dots, -2, -1, 0, 1, 2, \dots$. A robot visits them in the order $0, -1, 1, -2, 2, -3, 3, \dots$. Which shelf does the robot visit as its $10$th?'
            answer: '-5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The visits come in pairs after the first: positions $2$ and $3$ are shelves $-1$ and $1$, positions $4$ and $5$ are $-2$ and $2$, and so on. Even positions $2t$ are shelf $-t$, so position $10$ is shelf $-5$.'
          - problem: 'In the visiting order $0, -1, 1, -2, 2, -3, 3, \dots$ of the shelves of the library, shelf $7$ is visited as which visit, counting the first shelf $0$ as visit number $1$?'
            answer: '15'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Positive shelf $t$ is visited at the odd position $2t + 1$, because shelf $1$ is the $3$rd visit and shelf $2$ the $5$th. For $t = 7$ we get $2 \cdot 7 + 1 = 15$. This is the inverse of the enumeration, which needs a formula, not a count.'
          - problem: 'Is $f(n) = n - 3$ a bijection from $\mathbb{N} = \{0, 1, 2, \dots\}$ onto $\mathbb{Z}$?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "it is a bijection", "is a bijection", "bijection", "it is"], ["no", "it is not a bijection", "is not a bijection", "not a bijection", "it is not"]]}
            solution_sketch: 'The values of $f$ are $-3, -2, -1, 0, 1, \dots$, so $-4$ and every smaller integer is missing. So $f$ is not onto $\mathbb{Z}$ and is not a bijection.'
          - problem: 'Sam lists the integers as $1, 2, 3, \dots$ and says that this list contains every integer, so $\mathbb{Z}$ is countable. What is the largest integer that is missing from Sam''s list?'
            answer: '0'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Sam''s list contains only the positive integers, so $0$ and all negative integers are missing. The largest missing integer is $0$. A correct listing must also reach $0$ and every negative integer.'
          - problem: 'Write the full proof that the set $\mathbb{Z}$ of integers is countable, by showing that $f : \mathbb{N} \to \mathbb{Z}$, with $\mathbb{N} = \{0, 1, 2, \dots\}$, defined by $f(n) = n/2$ for even $n$ and $f(n) = -(n+1)/2$ for odd $n$, is a bijection.'
            answer: 'f(n)=n/2, -(n+1)/2 enumerates Z'
            answer_contract: {"kind": "none"}
            solution_sketch: 'Proof. For even $n$ the number $n/2$ is an integer, and for odd $n$ the number $n + 1$ is even, so $-(n+1)/2$ is an integer; hence $f$ maps $\mathbb{N}$ into $\mathbb{Z}$. Injective: suppose $f(a) = f(b)$. If $a$ and $b$ are both even, then $a/2 = b/2$, so $a = b$. If both are odd, then $-(a+1)/2 = -(b+1)/2$, so $a = b$. If $a$ is even and $b$ is odd, then $f(a) = a/2 \geq 0$, while $f(b) = -(b+1)/2 \leq -1$ because $b \geq 1$, so $f(a) \neq f(b)$ and this case does not occur; the case of $a$ odd and $b$ even is the same with $a$ and $b$ exchanged. Surjective: let $m \in \mathbb{Z}$. If $m \geq 0$, put $n = 2m$, which is even, and $f(n) = m$. If $m < 0$, put $n = -2m - 1$, which is odd and at least $1$, and $f(n) = -(-2m - 1 + 1)/2 = m$. Hence $f$ is a bijection from $\mathbb{N}$ onto $\mathbb{Z}$, so $\mathbb{Z}$ is countable. $\square$'
        constraints: 'Countable sets: explicit enumerations of arithmetic progressions and of Z; values and positions in a listing, verdicts, one written proof; shelf and listing contexts'
      - id: kp3
        name: 'Countability of products and rationals'
        key_prerequisites: [function-composition-inverse]
        step_check:
          step: 'which is a finite list of exactly $k-1$ pairs'
          question: 'Why does it matter that every diagonal is a finite list?'
          options:
            - 'A finite diagonal cannot contain a pair twice, so the listing has no repeats'
            - 'A finite diagonal makes the whole grid of pairs finite'
            - 'Only finite lists of pairs can be written down in a proof'
            - 'Each pair is then reached after finitely many diagonals, so none is missed'
          answer: 'Each pair is then reached after finitely many diagonals, so none is missed'
          why: 'Finishing diagonal $k$ before diagonal $k+1$ is possible only because each diagonal ends; a pair on diagonal $k$ then appears after at most $k(k-1)/2$ earlier pairs.'
        exemplars:
          - problem: 'The pairs $(i, j)$ of positive integers are listed in this order: first by increasing $i + j$, and pairs with the same sum by increasing $i$. The list begins $(1, 1), (1, 2), (2, 1), (1, 3), (2, 2), (3, 1), \dots$. Which pair is the $8$th in the list?'
            answer: '(2, 3)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'The sums $2, 3, 4$ use $1 + 2 + 3 = 6$ pairs. The sum $5$ starts with $(1, 4)$ as the $7$th pair and continues with $(2, 3)$ as the $8$th pair.'
          - problem: 'In the list of pairs $(i, j)$ of positive integers ordered by increasing $i + j$, and by increasing $i$ for the same sum, which position does the pair $(1, 6)$ hold?'
            answer: '16'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The diagonals with sums $2, 3, 4, 5, 6$ have $1, 2, 3, 4, 5$ pairs, which is $15$ pairs. The pair $(1, 6)$ starts the diagonal with sum $7$, so it is the $16$th pair.'
          - problem: 'The fractions $p/q$ with positive integers $p$ and $q$ are listed along the diagonals $p + q = 2, 3, 4, \dots$. In the diagonals with $p + q \leq 6$, how many of the listed fractions are equal to $1/2$?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The fraction $1/2$ comes from $(p, q) = (1, 2)$ with sum $3$. The pair $(2, 4)$ with sum $6$ gives $2/4 = 1/2$ again, and $(3, 6)$ has sum $9$, which is too large. So $1/2$ is listed $2$ times.'
          - problem: 'The seats of an endless theatre are labelled $(i, j)$, with row $i$ and seat $j$ both positive integers. An usher visits the seats by increasing $i + j$, and seats with the same sum by increasing row. Which seat does the usher visit as the $20$th?'
            answer: '(5, 2)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'The sums $2$ to $6$ use $1 + 2 + 3 + 4 + 5 = 15$ seats, and sum $7$ has the seats $(1, 6), (2, 5), (3, 4), (4, 3), (5, 2), (6, 1)$ as visits $16$ to $21$. Visit $20$ is the fifth of these, $(5, 2)$.'
          - problem: 'Is the set of positive rational numbers countable?'
            answer: 'yes'
            answer_contract: {"kind": "label", "options": [["yes", "it is countable", "countable"], ["no", "it is not countable", "not countable", "uncountable"]]}
            solution_sketch: 'Every positive rational number is $p/q$ for positive integers $p, q$. List the pairs $(p, q)$ along the finite diagonals $p + q = 2, 3, \dots$ and skip fractions already listed. This reaches every positive rational number at a finite position, so the set is countable.'
          - problem: 'Sam lists all pairs of positive integers row by row: first all pairs $(1, j)$ for $j = 1, 2, 3, \dots$, and only then the pairs $(2, j)$, and so on. Is the pair $(2, 1)$ ever reached in Sam''s list?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "it is reached", "it is", "reached"], ["no", "it is never reached", "never", "it is not reached", "not reached", "never reached"]]}
            solution_sketch: 'Row $1$ has infinitely many pairs, so Sam never finishes it, and the pair $(2, 1)$ is never reached. The diagonals $i + j = k$ are finite, which is why they work and rows do not.'
          - problem: 'Sam lists the positive rational numbers by going along the diagonals $p + q = 2, 3, 4, \dots$ and skipping each fraction $p/q$ whose $p$ and $q$ have a common factor larger than $1$. How many fractions has Sam listed after finishing the diagonals with $p + q \leq 6$?'
            answer: '11'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The number of pairs $(p, q)$ with $p + q = 2, 3, 4, 5, 6$ and $\gcd(p, q) = 1$ is $1, 2, 2, 4, 2$. The sum of these counts is $1 + 2 + 2 + 4 + 2 = 11$ fractions.'
          - problem: 'Write the full proof that the set $\mathbb{N} \times \mathbb{N}$ of pairs of positive integers is countable, by showing that $f(m, n) = \frac{(m+n-1)(m+n-2)}{2} + m$ is a bijection from $\mathbb{N} \times \mathbb{N}$ onto $\mathbb{N} = \{1, 2, 3, \dots\}$.'
            answer: 'f(m,n) = (m+n-1)(m+n-2)/2 + m'
            answer_contract: {"kind": "none"}
            solution_sketch: 'Proof. For an integer $k \geq 2$ put $T_k = (k-1)(k-2)/2$, so that $T_2 = 0$ and $T_{k+1} - T_k = \frac{k(k-1) - (k-1)(k-2)}{2} = k - 1$. Hence $T_2 < T_3 < \cdots$, the sequence is unbounded, and the blocks $B_k = \{T_k + 1, \dots, T_{k+1}\}$, each with $k - 1$ elements, are disjoint and together cover $\mathbb{N}$: every positive integer $N$ lies in exactly one block $B_k$. Note that $f(m, n) = T_{m+n} + m$. For a pair $(m, n)$ with $m + n = k$ we have $1 \leq m \leq k - 1$, so $T_k + 1 \leq f(m, n) \leq T_k + k - 1 = T_{k+1}$, that is, $f(m, n) \in B_k$. Injective: suppose $f(m, n) = f(m'', n'') = N$. Then $N$ lies in exactly one block $B_k$, and by the previous sentence $m + n = k = m'' + n''$. So $T_k + m = T_k + m''$, giving $m = m''$ and then $n = n''$. Surjective: let $N \in \mathbb{N}$ and let $k$ be the index with $N \in B_k$. Put $m = N - T_k$, so $1 \leq m \leq k - 1$, and $n = k - m \geq 1$. Then $m + n = k$ and $f(m, n) = T_k + m = N$. So $f$ is a bijection from $\mathbb{N} \times \mathbb{N}$ onto $\mathbb{N}$, and $\mathbb{N} \times \mathbb{N}$ is countable. $\square$'
        constraints: 'Countability of products and rationals: diagonal listing of pairs, positions, repeated fractions, verdicts, one written proof; usher and grid contexts'
    diagnostic_exemplar:
      problem: 'Prove $\mathbb{N} \times \mathbb{N}$ is countable.'
      answer: 'The map $(m, n) \mapsto 2^{m} 3^{n}$ is injective into $\mathbb{N}$.'
      solution_sketch: 'The map $(m, n) \mapsto 2^{m} 3^{n}$ is injective by unique factorization, so $\mathbb{N} \times \mathbb{N}$ injects into $\mathbb{N}$; being infinite, it is countable. $\square$'
    anki_seeds:
      - front: 'When do two sets have the same cardinality?'
        back: 'When there is a bijection between them.'
        type: basic
      - front: 'Definition: a set is countable?'
        back: 'It is finite, or there is a bijection with $\mathbb{N}$ (equivalently, its elements can be listed as a sequence).'
        type: basic

  - id: interval-bijections
    name: "Bijections Between Intervals"
    core: false                # supplemental: cardinality branch
    difficulty: 0.68
    drill: false
    answer_kind: proof
    expected_time_secs: 200
    prerequisites:
      - id: function-composition-inverse
        weight: 0.5
        key: true
      - id: cardinality-countability
        weight: 0.4
        key: true
      - id: infinite-sets
        weight: 0.2
    knowledge_points:
      - id: kp1
        name: 'Linear bijections between bounded intervals'
        key_prerequisites: [function-composition-inverse]
        step_check:
          step: 'since $m = 3 > 0$, $f$ is strictly increasing, hence one-to-one'
          question: 'Why does a positive slope make $f$ one-to-one?'
          options:
            - 'A positive slope makes $f$ map onto the whole interval $(0, 9)$ at once'
            - 'The two numbers $f(1) = 0$ and $f(4) = 9$ are different'
            - 'If $a < b$, then $f(a) < f(b)$, so inputs give distinct outputs'
            - 'A positive slope makes $f$ equal to its own inverse'
          answer: 'If $a < b$, then $f(a) < f(b)$, so inputs give distinct outputs'
          why: 'With positive slope $m$, we have $f(b) - f(a) = m(b - a) > 0$ whenever $a < b$, so two different inputs never share an output.'
        try_first:
          problem: 'An affine map $f(x) = mx + c$ sends $0$ to $2$ and $1$ to $5$. What is $f(10)$?'
          answer_contract: {"kind": "exact"}
          answer: '32'
          reveal: 'The slope is $m = (5 - 2)/(1 - 0) = 3$ and $c = 2$, so $f(10) = 32$. The same two conditions, left end to left end and right end to right end, give an affine bijection between any two bounded intervals.'
        exemplars:
          - problem: 'Write the formula $f(x)$ of the increasing affine bijection $f$ from $(0, 1)$ onto $(2, 5)$.'
            answer: '3x + 2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'We need $f(0) = 2$ and $f(1) = 5$, so the slope is $(5 - 2)/(1 - 0) = 3$ and $f(x) = 3x + 2$. It is strictly increasing, so it is injective, and its image is exactly $(2, 5)$.'
          - problem: 'Water is liquid between $0$ and $100$ degrees Celsius, and this is the interval from $32$ to $212$ degrees Fahrenheit. The increasing affine bijection from $(0, 100)$ onto $(32, 212)$ converts Celsius to Fahrenheit. What Fahrenheit temperature corresponds to $35$ degrees Celsius?'
            answer: '95'
            answer_contract: {"kind": "unit", "quantity": "temperature", "unit": "°F", "allow_omitted": true}
            solution_sketch: 'The slope is $(212 - 32)/(100 - 0) = 9/5$, so the conversion is $F = \frac{9}{5} C + 32$. For $C = 35$ we get $\frac{9}{5} \cdot 35 + 32 = 63 + 32 = 95$ degrees Fahrenheit.'
          - problem: 'The function $f(x) = 2 + 3x$ is a bijection from $(0, 1)$ onto $(2, 5)$. Find its inverse $f^{-1}(y)$.'
            answer: '(y - 2)/3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Set $y = 2 + 3x$ and solve for $x$: subtract $2$, then divide by $3$, so $x = (y - 2)/3$. For $y \in (2, 5)$ this lies in $(0, 1)$, so $f^{-1}(y) = (y - 2)/3$.'
          - problem: 'Write the formula $f(x)$ of the increasing affine bijection $f$ from $(1, 4)$ onto $(3, 9)$.'
            answer: '2x + 1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'We need $f(1) = 3$ and $f(4) = 9$, so the slope is $(9 - 3)/(4 - 1) = 2$. Then $3 = 2 \cdot 1 + c$ gives $c = 1$, so $f(x) = 2x + 1$.'
          - problem: 'On the conversion from Celsius to Fahrenheit, $F = \frac{9}{5} C + 32$, what Celsius temperature corresponds to $77$ degrees Fahrenheit?'
            answer: '25'
            answer_contract: {"kind": "unit", "quantity": "temperature", "unit": "°C", "allow_omitted": true}
            solution_sketch: 'We solve $77 = \frac{9}{5} C + 32$. Subtract $32$ to get $45 = \frac{9}{5} C$, and multiply by $5/9$, the inverse of the slope: $C = 45 \cdot \frac{5}{9} = 25$.'
          - problem: 'Sam wants a bijection from $(0, 1)$ onto $(2, 6)$ and uses $f(x) = x + 2$. What is the smallest integer in $(2, 6)$ that is not a value of $f$?'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'For $x \in (0, 1)$ the values $x + 2$ fill only the interval $(2, 3)$. The integers $3, 4, 5$ of $(2, 6)$ are not values, and the smallest is $3$. The slope should be $(6 - 2)/(1 - 0) = 4$ instead.'
          - problem: 'Is $f(x) = 1 - x$ a bijection from $(0, 1)$ onto $(0, 1)$?'
            answer: 'yes'
            answer_contract: {"kind": "label", "options": [["yes", "it is a bijection", "is a bijection", "bijection", "it is"], ["no", "it is not a bijection", "is not a bijection", "not a bijection", "it is not"]]}
            solution_sketch: 'For $x \in (0, 1)$ we have $0 < 1 - x < 1$, so $f$ maps into $(0, 1)$. It is injective because $1 - a = 1 - b$ gives $a = b$, and onto because each $y \in (0, 1)$ equals $f(1 - y)$ with $1 - y \in (0, 1)$. It is a decreasing bijection.'
          - problem: 'Write the full proof that if $a < b$ and $c < d$ are real numbers, then $f(x) = c + \dfrac{(d - c)(x - a)}{b - a}$ is a bijection from $(a, b)$ onto $(c, d)$, and find its inverse.'
            answer: 'f(x)=c+(d-c)(x-a)/(b-a) is a bijection'
            answer_contract: {"kind": "none"}
            solution_sketch: 'Proof. Put $m = (d - c)/(b - a)$, so that $f(x) = c + m(x - a)$ and $m > 0$. Maps into $(c, d)$: if $a < x < b$, then $0 < x - a < b - a$, so $0 < (x - a)/(b - a) < 1$, and therefore $c < f(x) < d$. Injective: suppose $f(x_1) = f(x_2)$. Subtracting $c$ gives $m(x_1 - a) = m(x_2 - a)$, and dividing by $m \neq 0$ gives $x_1 = x_2$. Surjective: let $y \in (c, d)$ and put $x = a + \dfrac{(b - a)(y - c)}{d - c}$. Since $0 < (y - c)/(d - c) < 1$, we have $a < x < b$, so $x \in (a, b)$. Then $f(x) = c + \dfrac{(d - c)}{(b - a)} \cdot \dfrac{(b - a)(y - c)}{d - c} = c + (y - c) = y$. Hence $f$ is a bijection from $(a, b)$ onto $(c, d)$, and the computation of $x$ shows that $f^{-1}(y) = a + \dfrac{(b - a)(y - c)}{d - c}$. $\square$'
        constraints: 'Affine bijections between bounded intervals: formula, inverse, converting between scales, verdicts, one written proof; temperature-scale contexts'
      - id: kp2
        name: 'Reaching unbounded intervals'
        key_prerequisites: [function-composition-inverse]
        step_check:
          step: 'Since $0 < y < 1$, we get $1/y > 1$, so this $x$ really lies in $(1,\infty)$'
          question: 'Why must we check that the candidate $x = 1/y$ lies in the domain $(1, \infty)$?'
          options:
            - 'A preimage has to be an element of the domain, or $y$ is not hit by $f$'
            - 'The value $1/y$ is needed to show that $f$ is injective on $(1, \infty)$'
            - 'Without that check, the formula $f(1/y) = y$ would be false'
            - 'Every number $1/y$ lies in $(1, \infty)$, whatever the value of $y$ is'
          answer: 'A preimage has to be an element of the domain, or $y$ is not hit by $f$'
          why: 'To prove that $y$ is a value of $f$ we need an input in the domain $(1, \infty)$; the inequality $1/y > 1$ shows that $1/y$ is such an input.'
        exemplars:
          - problem: 'The function $f(x) = 1/x$ is a bijection from $(0, 1)$ onto $(1, \infty)$. Find its inverse $f^{-1}(y)$ for $y > 1$.'
            answer: '1/y'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Solving $y = 1/x$ for $x$ gives $x = 1/y$. For $y > 1$ we have $0 < 1/y < 1$, so $1/y$ lies in $(0, 1)$, and $f^{-1}(y) = 1/y$.'
          - problem: 'A bacterial culture has size $e^{t}$ units at time $t$ hours, where $t$ can be any real number, and negative times mean hours before the start. This is a bijection from $\mathbb{R}$ onto $(0, \infty)$. At what time does the culture have size $20$?'
            answer: 'ln(20)'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'We solve $e^t = 20$. Taking natural logarithms, the inverse of the exponential map, gives $t = \ln 20$ hours. So $\ln 20$ is the time, about $3$ hours.'
          - problem: 'Write a formula $h(x) = c/x$, with a constant $c$, for a bijection $h$ from $(0, 1)$ onto $(2, \infty)$.'
            answer: '2/x'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'For $x \in (0, 1)$ the number $1/x$ runs over $(1, \infty)$. To reach $(2, \infty)$ we need the factor $c = 2$, so $h(x) = 2/x$. Its inverse $y \mapsto 2/y$ sends $(2, \infty)$ back to $(0, 1)$.'
          - problem: 'A radioactive sample has mass $2^{-t}$ grams at time $t$ hours, where $t$ can be any real number and negative times mean hours before the start. At what time does the sample have mass $8$ grams?'
            answer: '-3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'We solve $2^{-t} = 8 = 2^3$, so $-t = 3$ and $t = -3$. The sample had a mass of $8$ grams $3$ hours before the start.'
          - problem: 'Is $f(x) = 1/x$ a bijection from $(0, 1)$ onto $(0, \infty)$?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "it is a bijection", "is a bijection", "bijection", "it is"], ["no", "it is not a bijection", "is not a bijection", "not a bijection", "it is not"]]}
            solution_sketch: 'For $x \in (0, 1)$ we have $1/x > 1$, so every value of $f$ is larger than $1$. A number such as $\frac{1}{2}$ in $(0, \infty)$ is not a value, so $f$ is not onto and not a bijection onto $(0, \infty)$.'
          - problem: 'Sam says that $f(x) = 1/x$ is a bijection from $(0, 1)$ onto $(0, \infty)$ because $1/x$ becomes arbitrarily large. What is the largest number in $(0, \infty)$ that is not a value of $f$?'
            answer: '1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The values of $f$ on $(0, 1)$ are exactly the numbers larger than $1$. So every number in $(0, 1]$ is missing, and the largest missing number is $1$. The correct target is $(1, \infty)$.'
          - problem: 'The function $g(x) = e^{-x}$ is a bijection from $\mathbb{R}$ onto $(0, \infty)$. Find its inverse $g^{-1}(y)$ for $y > 0$.'
            answer: '-ln(y)'
            answer_contract: {"kind": "function", "vars": ["y"]}
            solution_sketch: 'Solving $y = e^{-x}$ and taking natural logarithms gives $\ln y = -x$, so $x = -\ln y$. For every $y > 0$ this is a real number, so $g^{-1}(y) = -\ln y$.'
          - problem: 'The function $p(x) = 2^x$ is a bijection from $\mathbb{R}$ onto $(0, \infty)$. Find its inverse $p^{-1}(y)$ for $y > 0$.'
            answer: 'ln(y)/ln(2)'
            answer_contract: {"kind": "function", "vars": ["y"]}
            solution_sketch: 'Set $y = 2^x$ and take natural logarithms: $\ln y = x \ln 2$, so $x = \ln y / \ln 2$. For every $y > 0$ this is a real number, so $p^{-1}(y) = \ln y / \ln 2$, which is $\log_2 y$.'
          - problem: 'Write the full proof that $f(x) = \dfrac{x}{1 - x}$ is a bijection from $(0, 1)$ onto $(0, \infty)$, and find its inverse.'
            answer: 'x/(1-x): (0,1) -> (0,inf) bijection'
            answer_contract: {"kind": "none"}
            solution_sketch: 'Proof. Maps into $(0, \infty)$: if $0 < x < 1$, then $x > 0$ and $1 - x > 0$, so $f(x) > 0$. Injective: suppose $f(a) = f(b)$ for $a, b \in (0, 1)$, that is, $\dfrac{a}{1 - a} = \dfrac{b}{1 - b}$. Both denominators are positive, so cross-multiplying gives $a(1 - b) = b(1 - a)$, that is, $a - ab = b - ab$, so $a = b$. Surjective: let $y \in (0, \infty)$ and put $x = \dfrac{y}{1 + y}$. Since $y > 0$ we have $0 < y < 1 + y$, so $0 < x < 1$. Moreover $1 - x = \dfrac{1}{1 + y}$, so $f(x) = \dfrac{y/(1+y)}{1/(1+y)} = y$. Hence $f$ is a bijection from $(0, 1)$ onto $(0, \infty)$, and its inverse is $f^{-1}(y) = \dfrac{y}{1 + y}$. $\square$'
        constraints: 'Reaching unbounded intervals with reciprocal and exponential maps: inverses, preimages, verdicts, one written proof; growth and decay contexts'
      - id: kp3
        name: 'Composing bijections to reach R'
        key_prerequisites: [cardinality-countability]
        step_check:
          step: 'A composition of bijections is a bijection'
          question: 'Why is the composite $g \circ f$ a bijection from $(2, 5)$ onto $\mathbb{R}$?'
          options:
            - 'The map $g$ alone is a bijection, so the map $f$ is not needed'
            - 'Both maps are increasing, and every increasing map is a bijection onto $\mathbb{R}$'
            - 'The two maps have the same formula, so their composite is the identity'
            - 'The output set of $f$ is the input set of $g$, and both maps are bijections'
          answer: 'The output set of $f$ is the input set of $g$, and both maps are bijections'
          why: 'The output set of $f$ is the input set of $g$, and injectivity and surjectivity both survive composition, so $g \circ f$ is a bijection onto $\mathbb{R}$.'
        exemplars:
          - problem: 'The function $h(x) = \tan\left(\pi\left(x - \tfrac{1}{2}\right)\right)$ is a bijection from $(0, 1)$ onto $\mathbb{R}$. Find its inverse $h^{-1}(y)$.'
            answer: 'atan(y)/pi + 1/2'
            answer_contract: {"kind": "function", "vars": ["y"]}
            solution_sketch: 'Set $y = \tan(\pi(x - 1/2))$. Applying the inverse tangent gives $\arctan y = \pi(x - 1/2)$, so $x = \dfrac{\arctan y}{\pi} + \dfrac{1}{2}$. For every real $y$ the value $\arctan y$ lies in $(-\pi/2, \pi/2)$, so $x \in (0, 1)$.'
          - problem: 'The function $f(x) = \dfrac{x}{1-x}$ is a bijection from $(0, 1)$ onto $(0, \infty)$, and $g(t) = \ln t$ is a bijection from $(0, \infty)$ onto $\mathbb{R}$. The composite is $h(x) = \ln\dfrac{x}{1-x}$. Find the inverse $h^{-1}(y)$.'
            answer: 'e^y/(1+e^y)'
            answer_contract: {"kind": "function", "vars": ["y"]}
            solution_sketch: 'Solve $y = \ln\dfrac{x}{1-x}$. Exponentiating gives $e^y = \dfrac{x}{1-x}$, so $e^y(1 - x) = x$ and $x = \dfrac{e^y}{1 + e^y}$. This lies in $(0, 1)$ for every real $y$.'
          - problem: 'Write the formula $f(x)$ of the increasing affine bijection $f$ from $(2, 5)$ onto $(0, 1)$. It is the first step of a bijection from $(2, 5)$ onto $\mathbb{R}$.'
            answer: '(x - 2)/3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'We need $2 \mapsto 0$ and $5 \mapsto 1$, so the slope is $1/(5 - 2) = 1/3$ and the map is $(x - 2)/3$. It is strictly increasing, and its image is exactly $(0, 1)$.'
          - problem: 'Is $x \mapsto \ln\dfrac{x-2}{5-x}$ a bijection from $(2, 5)$ onto $\mathbb{R}$?'
            answer: 'yes'
            answer_contract: {"kind": "label", "options": [["yes", "it is a bijection", "is a bijection", "bijection", "it is"], ["no", "it is not a bijection", "is not a bijection", "not a bijection", "it is not"]]}
            solution_sketch: 'It is the composite of the affine bijection $x \mapsto (x-2)/3$ from $(2, 5)$ onto $(0, 1)$ and the bijection $u \mapsto \ln\frac{u}{1-u}$ from $(0, 1)$ onto $\mathbb{R}$, since $\frac{(x-2)/3}{1 - (x-2)/3} = \frac{x-2}{5-x}$. A composite of bijections is a bijection.'
          - problem: 'Statisticians turn a probability $p \in (0, 1)$ into the log-odds $\ln\dfrac{p}{1-p}$, which is a bijection from $(0, 1)$ onto $\mathbb{R}$. What are the log-odds of the probability $p = 0.8$, to two decimal places?'
            answer: '1.39'
            answer_contract: {"kind": "approx", "decimals": 2}
            solution_sketch: 'The odds are $p/(1-p) = 0.8/0.2 = 4$. The log-odds are $\ln 4 \approx 1.39$.'
          - problem: 'The log-odds of a probability $p \in (0, 1)$ are $\ln\dfrac{p}{1-p}$. A forecast has log-odds $-\ln 3$. What is the probability $p$?'
            answer: '1/4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'We use the inverse map $p = \dfrac{e^y}{1 + e^y}$ with $y = -\ln 3$. Then $e^y = 1/3$, so $p = \dfrac{1/3}{1 + 1/3} = \dfrac{1/3}{4/3} = \dfrac{1}{4}$.'
          - problem: 'Sam says that $h(x) = \tan(\pi x)$ is a bijection from $(0, 1)$ onto $\mathbb{R}$. For which $x \in (0, 1)$ is $h(x)$ undefined?'
            answer: '1/2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The tangent is undefined at odd multiples of $\pi/2$, so $\tan(\pi x)$ is undefined when $\pi x = \pi/2$, that is, at $x = 1/2$. So $h$ is not even a function on $(0, 1)$. The shift by $1/2$ in $\tan(\pi(x - 1/2))$ fixes this.'
          - problem: 'The function $h(x) = \ln\dfrac{x-2}{5-x}$ is a bijection from $(2, 5)$ onto $\mathbb{R}$. Find its inverse $h^{-1}(y)$.'
            answer: '(2 + 5e^y)/(1 + e^y)'
            answer_contract: {"kind": "function", "vars": ["y"]}
            solution_sketch: 'Set $y = \ln\dfrac{x-2}{5-x}$ and exponentiate: $e^y = \dfrac{x-2}{5-x}$. Then $e^y(5 - x) = x - 2$, so $x(1 + e^y) = 2 + 5e^y$ and $x = \dfrac{2 + 5e^y}{1 + e^y}$. This equals $2 + \dfrac{3e^y}{1 + e^y}$, which lies in $(2, 5)$ for every real $y$.'
          - problem: 'Write the full proof that $h(x) = \ln\dfrac{x}{1 - x}$ is a bijection from $(0, 1)$ onto $\mathbb{R}$, and find its inverse.'
            answer: 'ln(x/(1-x)): (0,1) -> R bijection'
            answer_contract: {"kind": "none"}
            solution_sketch: 'Proof. Maps into $\mathbb{R}$: for $x \in (0, 1)$ we have $x > 0$ and $1 - x > 0$, so $\dfrac{x}{1-x} > 0$ and its natural logarithm is a real number. Injective: suppose $h(a) = h(b)$. Since $\ln$ is injective on $(0, \infty)$, we get $\dfrac{a}{1 - a} = \dfrac{b}{1 - b}$. Cross-multiplying gives $a(1 - b) = b(1 - a)$, that is, $a - ab = b - ab$, so $a = b$. Surjective: let $y \in \mathbb{R}$ and put $x = \dfrac{e^y}{1 + e^y}$. Since $0 < e^y < 1 + e^y$, we have $0 < x < 1$. Also $1 - x = \dfrac{1}{1 + e^y}$, so $\dfrac{x}{1 - x} = e^y$ and $h(x) = \ln e^y = y$. Hence $h$ is a bijection from $(0, 1)$ onto $\mathbb{R}$, and its inverse is $h^{-1}(y) = \dfrac{e^y}{1 + e^y}$. $\square$'
        constraints: 'Composing bijections to reach R: inverses of composites, affine step onto (0,1), verdicts, one written proof; probability and log-odds contexts'
    diagnostic_exemplar:
      problem: 'Give a bijection $(0, 1) \to (3, \infty)$, prove that it is one, and state its inverse.'
      answer: 'Take $f(x) = \dfrac{1}{x} + 2$. For $x \in (0,1)$ we have $1/x \in (1, \infty)$, so $f(x) \in (3, \infty)$: the map lands in the target. Injective: $\dfrac1a + 2 = \dfrac1b + 2$ gives $\dfrac1a = \dfrac1b$, hence $a = b$. Surjective: given $y > 3$, set $x = \dfrac{1}{y - 2}$; since $y - 2 > 1$ we get $x \in (0,1)$, and $f(x) = (y-2) + 2 = y$. So $f$ is a bijection, with inverse $f^{-1}(y) = \dfrac{1}{y - 2}$.'
      solution_sketch: 'Compose the reciprocal bijection $(0,1) \to (1,\infty)$ with a shift by $2$; check the image, injectivity, and a formula for the preimage.'
    anki_seeds:
      - front: 'Why is "same cardinality" transitive?'
        back: 'Compositions of bijections are bijections.'
        type: basic
      - front: 'A standard bijection $(0, 1) \to \mathbb{R}$?'
        back: '$x \mapsto \tan\left(\pi\left(x - \tfrac{1}{2}\right)\right)$.'
        type: basic

  - id: uncountability-diagonalization
    name: "Uncountability and Diagonalization"
    core: false                # supplemental: terminal capstone of the cardinality branch
    difficulty: 0.70
    drill: false
    answer_kind: proof
    expected_time_secs: 260
    prerequisites:
      - id: cardinality-countability
        weight: 0.6
        key: true
      - id: interval-bijections
        weight: 0.3
      - id: negating-statements
        weight: 0.2
      - id: functions-injective-surjective
        weight: 0.0
    knowledge_points:
      - id: kp1
        name: 'The reals are uncountable'
        key_prerequisites: [cardinality-countability]
        step_check:
          step: 'therefore $t \ne s_n$ for every $n$'
          question: 'Why does $t \ne s_n$ hold for every $n$, and not just for some of them?'
          options:
            - 'The new sequence $t$ differs from each listed sequence in every position'
            - 'It differs from $s_n$ in position $n$, and $n$ can be any index on the list'
            - 'The list is finite, so each sequence on it can be compared with $t$ one by one'
            - 'The sequence $t$ is longer than every sequence that appears on the list'
          answer: 'It differs from $s_n$ in position $n$, and $n$ can be any index on the list'
          why: 'The rule $t_n \ne s_{nn}$ is built for every index $n$ at once, so $t$ misses the whole list.'
        try_first:
          problem: 'The three bit strings $110$, $011$ and $100$ are on a list. A new bit string of length $3$ must differ from the first string in its first bit, from the second string in its second bit, and from the third string in its third bit. How many such bit strings are there?'
          answer_contract: {"kind":"exact"}
          answer: '1'
          reveal: 'Each bit of the new string is forced: it is the opposite of the diagonal bit. The same rule gives a string that differs from every string on a list of any length, which is the diagonal idea.'
        exemplars:
          - problem: 'Four infinite 0-1 sequences begin $s_1 = (1, 0, 1, 1, \dots)$, $s_2 = (0, 0, 1, 0, \dots)$, $s_3 = (1, 1, 0, 1, \dots)$ and $s_4 = (0, 1, 1, 0, \dots)$. In Cantor''s diagonal construction the new sequence $t$ has $t_n = 1 - s_n(n)$, where $s_n(n)$ is the $n$th term of $s_n$. What are the first four terms of $t$?'
            answer: '0, 1, 1, 1'
            answer_contract: {"kind":"list","ordered":true,"member":{"kind":"exact"}}
            solution_sketch: 'The diagonal terms are $s_1(1) = 1$, $s_2(2) = 0$, $s_3(3) = 0$ and $s_4(4) = 0$. Flipping each one with $t_n = 1 - s_n(n)$ gives $0, 1, 1, 1$, so $t$ starts with $0, 1, 1, 1$.'
          - problem: 'A list $s_1, s_2, s_3, \dots$ of infinite 0-1 sequences is given, and $t$ is defined by $t_n = 1 - s_n(n)$ for every $n$. Is $t$ certain to be different from $s_{17}$?'
            answer: 'yes'
            answer_contract: {"kind":"label","options":[["yes","it is certain","yes, it is certain","t is different","certain","it is","t differs","yes, it is"],["no","it is not certain","no, it is not certain","not certain","it is not","no, it is not","not necessarily","t may equal it"]]}
            solution_sketch: 'By definition $t_{17} = 1 - s_{17}(17)$, which is the other bit than $s_{17}(17)$. So $t$ and $s_{17}$ disagree in position $17$, and $t \ne s_{17}$. The same argument works for every index.'
          - problem: 'Sam lists infinite 0-1 sequences as $s_1 = (1, 1, 1, 1, \dots)$ and, for $n \ge 2$, $s_n$ has a $1$ in position $n$ and a $0$ in every other position. Sam builds $t$ by copying the diagonal, $t_n = s_n(n)$, and claims that $t$ is missing from the list. Which index $k$ has $s_k = t$?'
            answer: '1'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Every diagonal term is $1$: $s_1(1) = 1$, and $s_n(n) = 1$ for $n \ge 2$ because $s_n$ has its $1$ in position $n$. So $t = (1, 1, 1, \dots) = s_1$ and $k = 1$. Copying the diagonal can hit the list; Cantor''s rule needs the flipped bit $1 - s_n(n)$.'
          - problem: 'A list of real numbers in $(0, 1)$ begins $x_1 = 0.5234\dots$, $x_2 = 0.2718\dots$, $x_3 = 0.5772\dots$ and $x_4 = 0.6022\dots$. Cantor''s construction for decimals picks the $n$th digit of a new number $y$ to be $5$ if the $n$th digit of $x_n$ is not $5$, and $4$ if it is $5$. What does $y$ look like up to its fourth decimal place?'
            answer: '0.4555'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The diagonal digits are $5$ from $x_1$, $7$ from $x_2$, $7$ from $x_3$ and $2$ from $x_4$. The first digit is $5$, so $y_1 = 4$; the other three are not $5$, so $y_2 = y_3 = y_4 = 5$. Hence $y = 0.4555\dots$.'
          - problem: 'The decimal expansion $0.4999\dots$ (the digit $9$ forever) and a second decimal expansion name the same real number. What is that number?'
            answer: '1/2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'We have $0.4999\dots = 0.4 + 0.0999\dots = 0.4 + 0.1 = 0.5$, because $0.0999\dots$ is a geometric series with sum $0.1$. So the number is $1/2$. This is why the diagonal digits are chosen away from $0$ and $9$: the new number then has only one expansion.'
          - problem: 'A lamp is switched on (1) or off (0) at each of the seconds $1, 2, 3, \dots$ forever, which gives an infinite on-off pattern. A technician claims that her list $p_1, p_2, p_3, \dots$ contains every possible pattern. She builds a pattern $q$ that is on at second $n$ exactly when $p_n$ is off at second $n$. The pattern $p_5$ is on at second $5$. What does $q$ do at second $5$?'
            answer: 'off'
            answer_contract: {"kind":"label","options":[["off","it is off","switched off","q is off","off at second 5","q is off at second 5","it is off at second 5","it is switched off"],["on","it is on","switched on","q is on","on at second 5","q is on at second 5","it is on at second 5","it is switched on"]]}
            solution_sketch: 'The pattern $q$ is on at second $5$ exactly when $p_5$ is off at second $5$. Since $p_5$ is on at second $5$, the pattern $q$ is off at second $5$. So $q \ne p_5$, and the same rule gives $q \ne p_n$ for every $n$.'
          - problem: 'Four students answer the same four yes-no questions, and each student''s answers form a string of four bits. The four strings are different. How many of the $16$ possible answer strings are not among the four?'
            answer: '12'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'There are $2^4 = 16$ possible strings and four of them are on the list. The other $16 - 4 = 12$ strings are missing. With only finitely many strings a list always misses some; the diagonal argument shows that even an infinite list of infinite sequences misses one.'
          - problem: 'Write the full proof that the set $B$ of all infinite sequences $(b_1, b_2, b_3, \dots)$ with every $b_i$ in $\{0, 1\}$ is uncountable. (A set is countable if it is finite or there is a bijection from $\mathbb{N} = \{1, 2, 3, \dots\}$ onto it.)'
            answer: 'binary sequences are uncountable'
            answer_contract: {"kind": "none"}
            solution_sketch: 'Let $f : \mathbb{N} \to B$ be any function, and write $f(n) = s_n = (s_{n1}, s_{n2}, s_{n3}, \dots)$ with every $s_{nj} \in \{0, 1\}$. We show that $f$ is not onto. Define $t = (t_1, t_2, t_3, \dots)$ by $t_n = 1 - s_{nn}$ for every $n$. Because $s_{nn}$ is $0$ or $1$, so is $t_n$, hence $t \in B$. Now let $n$ be any positive integer. Since $t_n = 1 - s_{nn} \neq s_{nn}$, the sequences $t$ and $s_n$ differ in position $n$, so $t \neq f(n)$. Therefore $t$ is not a value of $f$, and $f$ is not onto $B$. Because $f$ was arbitrary, no function from $\mathbb{N}$ onto $B$ exists; in particular there is no bijection between $\mathbb{N}$ and $B$. Finally, $B$ is infinite, because for each $n$ the sequence with a $1$ in position $n$ and a $0$ in every other position belongs to $B$, and these sequences are pairwise different. A set that is infinite and has no bijection with $\mathbb{N}$ is not countable, so $B$ is uncountable. $\square$'
        constraints: 'a diagonal table of infinite 0-1 sequences or decimals; flip the diagonal, a context where a list claims to be complete, and one finite contrast; the proof item is the diagonal proof for 0-1 sequences'
      - id: kp2
        name: 'Power sets and Cantor''s theorem'
        key_prerequisites: [cardinality-countability]
        step_check:
          step: 'there is some $m \in A$ with $f(m) = D$'
          question: 'Why is there an $m \in A$ with $f(m) = D$?'
          options:
            - 'Every function $f$ from $A$ to $\mathcal{P}(A)$ takes the value $D$ at some point $m$'
            - 'The definition of $D$ builds the set $D$ out of the one special point $m$ of $A$'
            - 'The set $D$ is a subset of $A$, so a surjective $f$ must take it as a value'
            - 'Because $f$ is injective, each subset of $A$ has exactly one preimage in $A$'
          answer: 'The set $D$ is a subset of $A$, so a surjective $f$ must take it as a value'
          why: 'The supposition that $f$ is onto $\mathcal{P}(A)$ means every subset, including $D$, equals $f(m)$ for some $m$.'
        exemplars:
          - problem: 'Let $A = \{1, 2, 3, 4\}$ with $f(1) = \{1, 2\}$, $f(2) = \{3\}$, $f(3) = \{1, 3, 4\}$ and $f(4) = \varnothing$. Find the diagonal set $D = \{a \in A : a \notin f(a)\}$.'
            answer: '2, 4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Check each element against its own image. We have $1 \in f(1)$ and $3 \in f(3)$, so $1$ and $3$ are not in $D$. But $2 \notin f(2) = \{3\}$ and $4 \notin f(4) = \varnothing$, so $D = \{2, 4\}$.'
          - problem: 'Let $f(n) = \{n, n+1, n+2, \dots\}$ for each $n$ in $\mathbb{N} = \{1, 2, 3, \dots\}$, and let $D = \{n \in \mathbb{N} : n \notin f(n)\}$. Is $D$ certain to be different from $f(m)$ for every $m$?'
            answer: 'yes'
            answer_contract: {"kind":"label","options":[["yes","it is certain","yes, it is certain","D is different","certain","it is","D differs","yes, it is"],["no","it is not certain","no, it is not certain","not certain","it is not","no, it is not","not necessarily","D may equal it"]]}
            solution_sketch: 'Here $n \in f(n)$ for every $n$, so $D = \varnothing$. Every $f(m)$ contains $m$, so no $f(m)$ is empty and $D \ne f(m)$ for every $m$. In general $D$ differs from $f(m)$ at the element $m$.'
          - problem: 'Let $A = \{1, 2, 3\}$ and $g(1) = \{1, 3\}$, $g(2) = \{1, 2\}$, $g(3) = \{2\}$. Sam defines $E = \{a \in A : a \in g(a)\}$ and claims that $E$ is never a value of $g$. Which $k$ satisfies $g(k) = E$?'
            answer: '2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'We have $1 \in g(1)$ and $2 \in g(2)$, but $3 \notin g(3)$, so $E = \{1, 2\}$. This equals $g(2) = \{1, 2\}$, so $k = 2$. Sam''s set $E$ keeps membership instead of reversing it, so nothing forces $E$ to differ from every $g(k)$.'
          - problem: 'Five club members are numbered $1$ to $5$. Each member writes a list of the members they trust: member $1$ trusts $\{2, 3\}$, member $2$ trusts $\{2\}$, member $3$ trusts $\{1, 4\}$, member $4$ trusts $\{4, 5\}$ and member $5$ trusts nobody. Which members do not appear on their own list?'
            answer: '1, 3, 5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Compare each member with his or her own list. Members $2$ and $4$ appear on their own lists. Member $1$ is not in $\{2, 3\}$, member $3$ is not in $\{1, 4\}$, and member $5$ has an empty list, so the members are $1, 3, 5$.'
          - problem: 'A shop sells $6$ spices. A blend is any set of spices, including the empty blend and the blend of all six. The shop gives each spice its own signature blend, and no blend is used twice. How many blends are left without a spice?'
            answer: '58'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'A blend is a subset of the $6$ spices, so there are $2^6 = 64$ blends. Six of them are signature blends, so $64 - 6 = 58$ blends are left over. The power set is always larger than the set itself.'
          - problem: 'For $n = 1, 2, 3, \dots$ let $f(n)$ be the set of prime numbers that divide $n$, so $f(1) = \varnothing$ and $f(12) = \{2, 3\}$. Let $D = \{n : n \notin f(n)\}$. What is the third smallest element of $D$?'
            answer: '6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The number $n$ is in $f(n)$ exactly when $n$ is itself a prime. So $D$ consists of the numbers that are not prime: $1, 4, 6, 8, 9, \dots$. The third smallest of them is $6$.'
          - problem: 'For each $n$ in $\mathbb{N} = \{1, 2, 3, \dots\}$ let $f(n) = \{k \in \mathbb{N} : k \ge n\}$, and let $E = \{n \in \mathbb{N} : n \in f(n)\}$. Is $E$ certain to be different from $f(m)$ for every $m$?'
            answer: 'no'
            answer_contract: {"kind":"label","options":[["yes","it is certain","yes, it is certain","E is different","certain","it is","E differs","yes, it is"],["no","it is not certain","no, it is not certain","not certain","it is not","no, it is not","not necessarily","E equals one"]]}
            solution_sketch: 'Every $n$ lies in $f(n) = \{n, n+1, \dots\}$, so $E = \mathbb{N}$. But $f(1) = \{1, 2, 3, \dots\} = \mathbb{N} = E$, so $E$ equals $f(1)$. Keeping membership, instead of reversing it as $D$ does, gives a set that can equal a value of $f$.'
          - problem: 'Write the full proof that the set $\mathcal{P}(\mathbb{N})$ of all subsets of $\mathbb{N} = \{1, 2, 3, \dots\}$ is uncountable. (A set is countable if it is finite or there is a bijection from $\mathbb{N}$ onto it.)'
            answer: 'P(N) is uncountable'
            answer_contract: {"kind": "none"}
            solution_sketch: 'First, $\mathcal{P}(\mathbb{N})$ is infinite, because the singletons $\{1\}, \{2\}, \{3\}, \dots$ are pairwise different elements of it. It remains to show that there is no bijection from $\mathbb{N}$ onto $\mathcal{P}(\mathbb{N})$; we show that no function $f : \mathbb{N} \to \mathcal{P}(\mathbb{N})$ is onto. Let $f$ be any such function and define $D = \{n \in \mathbb{N} : n \notin f(n)\}$. Then $D \subseteq \mathbb{N}$, so $D \in \mathcal{P}(\mathbb{N})$. Suppose, for contradiction, that $f$ is onto. Then $D = f(m)$ for some $m \in \mathbb{N}$. By the definition of $D$, $m \in D$ if and only if $m \notin f(m)$. Because $f(m) = D$, this says that $m \in D$ if and only if $m \notin D$, which is impossible. Hence $f$ is not onto. Since $f$ was arbitrary, there is no function from $\mathbb{N}$ onto $\mathcal{P}(\mathbb{N})$, so there is no bijection. Therefore $\mathcal{P}(\mathbb{N})$ is infinite and not in bijection with $\mathbb{N}$, that is, it is uncountable. $\square$'
        constraints: 'finite sets of at most five elements with explicit images, the diagonal set of a rule on the natural numbers, counting subsets in a context; the proof item is the diagonal proof for the power set of the natural numbers'
      - id: kp3
        name: 'Cantor''s theorem in general'
        key_prerequisites: [negating-statements]
        step_check:
          step: 'the condition $x_0 \notin f(x_0)$ is the same as $x_0 \notin D$'
          question: 'Why can $f(x_0)$ be replaced by $D$ in the condition $x_0 \notin f(x_0)$?'
          options:
            - 'The assumption $f(x_0) = D$ says that these two sets are the same set'
            - 'The set $D$ contains every element of $X$, so it also contains $f(x_0)$'
            - 'The definition of $D$ says that $f(x) = D$ holds for every $x$ in $X$'
            - 'Replacing a set by a set of equal size never changes membership'
          answer: 'The assumption $f(x_0) = D$ says that these two sets are the same set'
          why: 'Equal sets have the same elements, so $x_0 \notin f(x_0)$ and $x_0 \notin D$ say the same thing.'
        exemplars:
          - problem: 'Let $X = \{1, 2, 3\}$ with $f(1) = \{2, 3\}$, $f(2) = \{2\}$ and $f(3) = \varnothing$. Find the diagonal set $D = \{x \in X : x \notin f(x)\}$.'
            answer: '1, 3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'We have $1 \notin f(1) = \{2, 3\}$ and $3 \notin f(3) = \varnothing$, so $1$ and $3$ are in $D$. But $2 \in f(2) = \{2\}$, so $2$ is not in $D$. Hence $D = \{1, 3\}$.'
          - problem: 'For each real number $x$ let $f(x) = \{y \in \mathbb{R} : y^2 < x\}$, and let $D = \{x \in \mathbb{R} : x \notin f(x)\}$. What is the least positive real number in $D$?'
            answer: '1'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'A positive $x$ is in $f(x)$ exactly when $x^2 < x$, that is, when $x < 1$. So a positive $x$ is in $D$ exactly when $x \ge 1$, and the least positive element of $D$ is $1$.'
          - problem: 'Let $A$ be a set and $f : A \to \mathcal{P}(A)$ a function. Is it true that $f$ is not onto exactly when $f(a) = \varnothing$ for some $a \in A$?'
            answer: 'no'
            answer_contract: {"kind":"label","options":[["yes","it is true","yes, it is true","true","it is","yes, it is"],["no","it is not true","no, it is not true","false","it is not","no, it is not"]]}
            solution_sketch: 'The function $f$ is onto when every subset of $A$ is a value $f(a)$. So $f$ is not onto exactly when some subset of $A$ is not a value of $f$, and that subset need not be the empty set. For example, with $A = \{1, 2\}$ and $f(1) = f(2) = \{1\}$ no value is empty, yet $\{2\}$ is never a value, so $f$ is not onto. The statement is false.'
          - problem: 'A control panel has $8$ switches, and each switch is either on or off. A setting of the panel is a choice of on or off for every switch. How many different settings does the panel have?'
            answer: '256'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Each switch has $2$ states and the choices are independent, so the number of settings is $2^8 = 256$. Equivalently, a setting is the subset of switches that are on, so the settings correspond to the $256$ subsets of a set of $8$ switches.'
          - problem: 'A society has $10$ members. A committee is any set of members, from the empty committee up to all $10$ members. Each member chairs a different committee, so no committee has two chairs. How many committees are left without a chair?'
            answer: '1014'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The committees are the subsets of a set of $10$ members, so there are $2^{10} = 1024$ of them. Ten committees have a chair, so $1024 - 10 = 1014$ committees have none.'
          - problem: 'Sam says that a set with $5$ elements has $10$ subsets, because each element is either in a subset or not and $2 \cdot 5 = 10$. What is the correct number of subsets?'
            answer: '32'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Each of the $5$ elements is independently in or out of a subset, so the choices multiply: $2 \cdot 2 \cdot 2 \cdot 2 \cdot 2 = 2^5 = 32$. Sam added the $2$ choices instead of multiplying them.'
          - problem: 'Write the full proof that for every set $A$ there is an injection from $A$ into its power set $\mathcal{P}(A)$ but no surjection from $A$ onto $\mathcal{P}(A)$, so that $|A| < |\mathcal{P}(A)|$.'
            answer: '|A| < |P(A)| for every set A'
            answer_contract: {"kind": "none"}
            solution_sketch: 'Let $A$ be any set. Injection: define $i : A \to \mathcal{P}(A)$ by $i(a) = \{a\}$. If $i(a) = i(b)$, then $a \in \{a\} = \{b\}$, so $a = b$; hence $i$ is injective. No surjection: let $f : A \to \mathcal{P}(A)$ be any function and define $D = \{a \in A : a \notin f(a)\}$. Then $D \subseteq A$, so $D \in \mathcal{P}(A)$. Suppose, for contradiction, that $f$ is onto. Then there is $x \in A$ with $f(x) = D$. By the definition of $D$, $x \in D$ if and only if $x \notin f(x)$. Since $f(x) = D$, this gives $x \in D$ if and only if $x \notin D$, a contradiction. So $f$ is not onto. Because $f$ was arbitrary, no function from $A$ onto $\mathcal{P}(A)$ exists, and there is no bijection between $A$ and $\mathcal{P}(A)$. An injection exists and a bijection does not, so $|A| < |\mathcal{P}(A)|$. $\square$'
        constraints: 'an arbitrary set A with explicit finite images or a rule on the real numbers, subset counting with powers of two in contexts, and a negation of surjectivity; the proof item is Cantor''s theorem for an arbitrary set'
    diagnostic_exemplar:
      problem: 'Prove by a diagonal argument that the set $\{0,1\}^{\mathbb{N}}$ of infinite binary sequences is uncountable.'
      answer: 'Let $f : \mathbb{N} \to \{0,1\}^{\mathbb{N}}$ be any map, and write $f(n) = (f(n)_0, f(n)_1, f(n)_2, \dots)$. Define a sequence $s$ by $s_n = 1 - f(n)_n$; each $s_n$ is $0$ or $1$, so $s \in \{0,1\}^{\mathbb{N}}$. For every $n$, $s$ differs from $f(n)$ in position $n$, so $s \ne f(n)$; hence $s$ is not in the image and $f$ is not surjective. Since no map $\mathbb{N} \to \{0,1\}^{\mathbb{N}}$ is surjective, none is a bijection, so the set is uncountable.'
      solution_sketch: 'Take an arbitrary indexing, flip the $n$-th bit of the $n$-th sequence, and observe that the new sequence is missed by every index.'
    anki_seeds:
      - front: 'What does Cantor''s diagonal argument show?'
        back: 'That $(0, 1)$ (hence $\mathbb{R}$) is uncountable: any proposed list of reals misses a number built to differ on the diagonal.'
        type: basic
      - front: 'Cantor''s theorem?'
        back: 'For every set $A$, $|A| < |\mathcal{P}(A)|$; there is no surjection $A \to \mathcal{P}(A)$.'
        type: basic

