      - front: 'Definition: a set is countable?'
        back: 'It is finite, or there is a bijection with $\mathbb{N}$ (equivalently, its elements can be listed as a sequence).'
        type: basic

  - id: interval-bijections
    name: "Bijections Between Intervals"
    core: false                # supplemental: cardinality branch
    difficulty: 0.68
    drill: false
    answer_kind: proof
    expected_time_secs: 200
    prerequisites:
      - id: function-composition-inverse
        weight: 0.5
        key: true
      - id: cardinality-countability
        weight: 0.4
        key: true
      - id: infinite-sets
        weight: 0.2
    knowledge_points:
      - id: kp1
        name: "Linear bijections between bounded intervals"
        key_prerequisites: [function-composition-inverse]
        exemplars:
          - problem: "For the affine bijection f(x) = 2 + 3x from (0, 1) to (2, 5), find the inverse as a function of y."
            answer: "(y-2)/3"
            answer_contract: {"kind": "function", "vars": ["y"]}
            solution_sketch: "The affine bijection is f(x) = 2 + 3x. Step 1: solve y = 2 + 3x for x, which gives x = (y - 2)/3. Step 2: the inverse is x = (y - 2)/3, and it is defined for every y in (2, 5). The answer is (y-2)/3."
          - problem: "Find an affine bijection from [0, 1] to [3, 11] as a function of x."
            answer: "3+8x"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "The affine bijection is f(x) = 3 + 8x. Step 1: check the endpoints, f(0) = 3 and f(1) = 11, so the image is [3, 11]. Step 2: the slope 8 is positive, so the map is injective, and its inverse is x = (y - 3)/8. The answer is 3+8x."
          - problem: "A linear bijection from (1, 4) to (2, 7) has the form f(x) = m x + c. Find m."
            answer: "5/3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The affine map has the form f(x) = m x + c. Step 1: the target interval has length 5 and the source interval has length 3, so the slope is m = 5/3. Step 2: the value c is fixed by the requirement f(1) = 2. The answer is 5/3."
          - problem: "For the affine bijection f(x) = 5 + 2x from (0, 3) to (5, 11), find the value of the inverse at 8."
            answer: "3/2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The affine bijection is f(x) = 5 + 2x. Step 1: solve y = 5 + 2x for x, giving x = (y - 5)/2. Step 2: substitute y = 8 to get x = (8 - 5)/2 = 3/2. The answer is 3/2."
          - problem: "Claim: f(x) = 4 + 2x is a bijection from (0, 1) to (4, 6). Step 1: f is strictly increasing because the slope 2 is positive, so f is injective. Step 2: f(0) = 4 and f(1) = 6, so the image is [4, 6]. Step 3: the inverse is x = (y - 4)/2. Step 4: therefore f is a bijection from (0, 1) to (4, 6). Which step is the first step that is not valid?"
            answer: "Step 2"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "The claim is f(x) = 4 + 2x from (0, 1) to (4, 6). Step 1 is valid: the positive slope makes f injective. Step 2 is the first invalid step: the image of an open interval is open, so it is (4, 6), not [4, 6]. Step 3 is valid: solving y = 4 + 2x gives x = (y - 4)/2. Step 4 is valid as a conclusion. The answer is Step 2."
          - problem: "For the affine bijection f(x) = 1 + 2x from (1, 4) to (3, 9), find the value of the inverse at 8."
            answer: "7/2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The affine bijection is f(x) = 1 + 2x. Step 1: solve y = 1 + 2x for x, giving x = (y - 1)/2. Step 2: substitute y = 8 to get x = (8 - 1)/2 = 7/2. The answer is 7/2."
          - problem: "Write the full proof: the intervals (0, 1) and (4, 9) have the same cardinality. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "The claim is proved by an explicit affine bijection. Step 1: define f(x) = 4 + 5x for x in (0, 1). Step 2: f is strictly increasing because its slope 5 is positive, so f is injective. Step 3: if x is in (0, 1), then 4 + 5x lies between 4 and 9, and as x approaches 0 or 1 the value approaches 4 or 9, so the image is (4, 9). Step 4: solve y = 4 + 5x to get x = (y - 4)/5; this inverse is defined for every y in (4, 9), so f is surjective. Step 5: an injective and surjective map is a bijection, so the two intervals have the same cardinality."
        constraints: "affine maps between stated intervals; verify with the explicit inverse"
      - id: kp2
        name: "Reaching unbounded intervals"
        key_prerequisites: [function-composition-inverse]
        exemplars:
          - problem: "To prove that $f(x) = 1/x$ is a bijection from $(0, 1)$ onto $(1, \\infty)$, one identifies the inverse map explicitly. For a point $y$ with $y > 1$, give the unique $x$ in $(0, 1)$ satisfying $f(x) = y$, as a function of $y$."
            answer: "1/y"
            answer_contract: {"kind": "function", "vars": ["y"]}
            solution_sketch: "Full object: the map $f: (0, 1) \\to (1, \\infty)$ with $f(x) = 1/x$. Step 1 (image rule): for $0 < x < 1$ the quotient $1/x$ is larger than $1$, so every value lies in the target. Step 2 (injectivity rule): $1/a = 1/b$ forces $a = b$. Step 3 (surjectivity rule): given $y > 1$, the number $1/y$ lies in $(0, 1)$ and $f(1/y) = y$, so the inverse sends $y$ to $1/y$. The answer is 1/y."
          - problem: "To prove that $g(x) = e^x$ is a bijection from the reals onto $(0, \\infty)$, one exhibits the inverse map explicitly. For a point $y$ with $y > 0$, give the unique real number $x$ satisfying $g(x) = y$, as a function of $y$."
            answer: "ln(y)"
            answer_contract: {"kind": "function", "vars": ["y"]}
            solution_sketch: "Full object: the map $g$ from the reals onto $(0, \\infty)$ with $g(x) = e^x$. Step 1 (monotonicity rule): $e^x$ is strictly increasing, so $e^a = e^b$ forces $a = b$. Step 2 (surjectivity rule): for $y > 0$ the number $\\ln(y)$ is real and $e^{\\ln(y)} = y$. Step 3 (inverse check): $g(\\ln(y)) = y$ and $\\ln(g(x)) = x$, so the inverse sends $y$ to $\\ln(y)$. The answer is ln(y)."
          - problem: "The map $h(x) = 2/x$ is a strictly decreasing bijection from $(0, 1)$ onto $(2, \\infty)$, so each point of $(2, \\infty)$ has exactly one preimage in $(0, 1)$. For the point $y = 10$, give the unique $x$ in $(0, 1)$ with $h(x) = 10$, as a fraction."
            answer: "1/5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Full object: the map $h: (0, 1) \\to (2, \\infty)$ with $h(x) = 2/x$. Step 1 (inverse rule): solving $2/x = y$ gives $x = 2/y$, the explicit inverse. Step 2 (evaluate): at $y = 10$ this gives $x = 2/10 = 1/5$. Step 3 (check rule): $0 < 1/5 < 1$ and $h(1/5) = 2/(1/5) = 10$. The answer is 1/5."
          - problem: "The map $p(x) = 2^x$ is a strictly increasing exponential with base two, and it is a bijection from the reals onto the positive reals. Identify its inverse explicitly. For a positive number $y$, give the unique real $x$ with $p(x) = y$, as a function of $y$."
            answer: "ln(y)/ln(2)"
            answer_contract: {"kind": "function", "vars": ["y"]}
            solution_sketch: "Full object: the map $p$ from the reals to $(0, \\infty)$ with $p(x) = 2^x$. Step 1 (monotonicity rule): $2^x$ is strictly increasing, hence injective. Step 2 (solve rule): from $2^x = y$ take the natural logarithm to get $x \\ln(2) = \\ln(y)$, so $x = \\ln(y)/\\ln(2)$. Step 3 (check rule): $2^x = e^{x \\ln(2)} = e^{\\ln(y)} = y$ for every $y > 0$. The answer is ln(y)/ln(2)."
          - problem: "Claim: the map $f(x) = 1/x$ is a bijection from $(0, 1)$ onto $(0, \\infty)$. Step 1: if $f(a) = f(b)$ for inputs $a, b$ in $(0, 1)$, then $a = b$. Step 2: for $0 < x < 1$ the value $1/x$ is positive, so every value lies in $(0, \\infty)$. Step 3: every $y$ in $(0, \\infty)$ has the preimage $1/y$, which lies in $(0, 1)$. Step 4: therefore $f$ is onto $(0, \\infty)$ and is a bijection. Which step is the first step that is not valid?"
            answer: "Step 3"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "Full object: the claim that $f(x) = 1/x$ maps $(0, 1)$ onto $(0, \\infty)$, checked step by step. Step 1 is valid: equal quotients give equal inputs. Step 2 is valid: on $(0, 1)$ the reciprocal exceeds $1$, so it is positive. Step 3 is the first invalid step: for $y = 1/2$ the candidate preimage is $1/y = 2$, which is not in $(0, 1)$; the image of $(0, 1)$ is only $(1, \\infty)$. Step 4 cannot stand, because surjectivity was never established. The answer is Step 3."
          - problem: "A proof that the map $s(x) = e^{-x}$ is a bijection from the reals onto $(0, \\infty)$ reads: Step 1: the map is strictly decreasing, hence injective. Step 2: all of its values are positive. Step 3: given a positive point $y$, take $x$ equal to the missing expression; then $s(x) = y$. Step 4: therefore the map is onto and bijective. Select the expression that fills the gap."
            answer: "-ln(y)"
            answer_contract: {"kind": "label", "options": [["-ln(y)"], ["ln(y)"], ["1/y"], ["e^y"]]}
            solution_sketch: "Full object: the map $s$ from the reals to $(0, \\infty)$ with $s(x) = e^{-x}$. Step 1 (solve rule): from $e^{-x} = y$ take the natural logarithm to get $-x = \\ln(y)$, hence $x = -\\ln(y)$. Step 2 (check rule): $s(-\\ln(y)) = e^{\\ln(y)} = y$ for every $y > 0$. The option ln(y) forgets the minus sign, since $s(\\ln(y)) = 1/y$, not $y$. The option 1/y gives a value of the map instead of a preimage. The option e^y applies the increasing exponential to $y$ instead of inverting the map. The answer is -ln(y)."
          - problem: "Write the full proof: the map $f(x) = 1/x$ is a bijection from $(0, 1/2)$ onto $(2, \\infty)$, and state its inverse. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Full object: the map $f: (0, 1/2) \\to (2, \\infty)$ with $f(x) = 1/x$. Step 1 (image rule): if $0 < x < 1/2$ then $1/x > 2$, so $f(x)$ lies in $(2, \\infty)$. Step 2 (injectivity rule): $f$ is strictly decreasing on $(0, 1/2)$, and $1/a = 1/b$ forces $a = b$. Step 3 (surjectivity rule): given $y > 2$, set $x = 1/y$; then $0 < 1/y < 1/2$ because $y > 2$, and $f(1/y) = y$. Step 4 (inverse rule): the map sending $y$ to $1/y$ from $(2, \\infty)$ back to $(0, 1/2)$ satisfies both composition identities, so it is the explicit inverse. Conclusion: $f$ is a bijection from $(0, 1/2)$ onto $(2, \\infty)$ with inverse $y \\mapsto 1/y$."
        constraints: "one reciprocal or exponential map; identify the inverse explicitly"
      - id: kp3
        name: "Composing bijections to reach R"
        key_prerequisites: [cardinality-countability]
        exemplars:
          - problem: "The map $h(x) = \\tan\\left(\\pi\\left(x - \\frac{1}{2}\\right)\\right)$ is a bijection from $(0, 1)$ onto $\\mathbb{R}$. Give $h\\left(\\frac{3}{4}\\right)$."
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (substitute): $h(3/4) = \\tan(\\pi(3/4 - 1/2))$. Step 2 (inner arithmetic): $3/4 - 1/2 = 1/4$, so the argument is $\\pi/4$. Step 3 (evaluate the outer map): $\\tan(\\pi/4) = 1$. The answer is 1."
          - problem: "For $a < b$, the map $h(x) = \\tan\\left(\\pi\\left(\\frac{x - a}{b - a} - \\frac{1}{2}\\right)\\right)$ is a bijection $(a, b) \\to \\mathbb{R}$. Give $h\\left(\\frac{a+b}{2}\\right)$."
            answer: "0"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (inner affine map): the midpoint $x = (a+b)/2$ maps to $t = ((a+b)/2 - a)/(b - a) = 1/2$. Step 2 (outer map): $h((a+b)/2) = \\tan(\\pi(1/2 - 1/2)) = \\tan(0) = 0$. The answer is 0."
          - problem: "The map $h(x) = \\tan\\left(\\pi\\left(x - \\frac{1}{2}\\right)\\right)$ is a bijection $(0, 1) \\to \\mathbb{R}$. Give the formula for $h^{-1}(y)$ as a function of $y$."
            answer: "atan(y)/pi + 1/2"
            answer_contract: {"kind": "function", "vars": ["y"]}
            solution_sketch: "Step 1 (set up): write $y = \\tan(\\pi(x - 1/2))$ and solve for $x$. Step 2 (apply atan): since atan inverts tan on $(-\\pi/2, \\pi/2)$, we get $\\pi(x - 1/2) = \\atan(y)$. Step 3 (isolate $x$): $x = \\atan(y)/\\pi + 1/2$. The inverse is atan(y)/pi + 1/2."
          - problem: "Let $f(x) = \\frac{x}{1-x}$, a bijection $(0, 1) \\to (0, \\infty)$, and $g(t) = \\ln(t)$, a bijection $(0, \\infty) \\to \\mathbb{R}$, so $h(x) = \\ln\\left(\\frac{x}{1-x}\\right)$ is a bijection $(0, 1) \\to \\mathbb{R}$. Give the formula for $h^{-1}(y)$ as a function of $y$."
            answer: "e^(y)/(1+e^(y))"
            answer_contract: {"kind": "function", "vars": ["y"]}
            solution_sketch: "Step 1 (compose): $h(x) = \\ln(x/(1-x))$. Step 2 (invert the outer map): $y = \\ln(x/(1-x))$ gives $e^{y} = x/(1-x)$. Step 3 (solve for x): $x(1 + e^{y}) = e^{y}$, so $x = e^{y}/(1 + e^{y})$. The inverse is e^(y)/(1+e^(y))."
          - problem: "Claim: for $a < b$, the map $x \\mapsto \\tan\\left(\\pi\\left(\\frac{x-a}{b-a} - \\frac{1}{2}\\right)\\right)$ is a bijection $(a, b) \\to \\mathbb{R}$. Step 1: $x \\mapsto \\frac{x-a}{b-a}$ is a bijection $(a, b) \\to (0, 1)$. Step 2: $y \\mapsto \\tan\\left(\\pi\\left(y - \\frac{1}{2}\\right)\\right)$ is a bijection $(0, 1) \\to \\mathbb{R}$. Step 3: the composition sends $(a, b)$ onto $(0, 1)$, not onto $\\mathbb{R}$. Step 4: compositions of bijections are bijections, so the map is a bijection $(a, b) \\to \\mathbb{R}$. Which step is the first step that is not valid?"
            answer: "Step 3"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "Step 1 (check Step 1): the affine map is strictly increasing from $a$ to $b$, hence a bijection onto $(0, 1)$, so it is valid. Step 2 (check Step 2): the hypothesis is assumed for some $k$, and tan is strictly increasing on $(-\\pi/2, \\pi/2)$ with range $\\mathbb{R}$, so it is valid. Step 3 (find the error): Step 3 is false, because composing a map onto $(0, 1)$ with a map onto $\\mathbb{R}$ has range $\\mathbb{R}$, not $(0, 1)$. Step 4 (check the citation): Step 4 cites the composition rule correctly and follows once Step 3 is dropped, so it is not the first invalid step. The answer is Step 3."
          - problem: "A proof that $|(a, b)| = |\\mathbb{R}|$ for $a < b$ shows that $h(x) = \\tan\\left(\\pi\\left(\\frac{x - a}{b - a} - \\frac{1}{2}\\right)\\right)$ is a bijection $(a, b) \\to \\mathbb{R}$. To prove that $h$ is onto $\\mathbb{R}$, one line is missing: given $y \\in \\mathbb{R}$, choose $t \\in (0, 1)$ with $\\tan\\left(\\pi\\left(t - \\frac{1}{2}\\right)\\right) = y$, and then choose $x = \\;?$. Select the line that completes the proof."
            answer: "$a + (b - a)*(atan(y)/pi + 1/2)$"
            answer_contract: {"kind": "label", "options": [["$a + (b - a)*(atan(y)/pi + 1/2)$"], ["$atan(y)/pi + 1/2$"], ["$a + (b - a)*(atan(y)/pi - 1/2)$"], ["$a + (b - a)*atan(y)/pi$"]]}
            solution_sketch: "Step 1 (target): to hit $y$ we need $t$ with $\\tan(\\pi(t - 1/2)) = y$ and then $x = a + (b - a)t$. Step 2 (solve for t): $t = \\atan(y)/\\pi + 1/2$, so the missing line is $a + (b - a)*(atan(y)/pi + 1/2)$. Step 3 (wrong options): the wrong option $atan(y)/pi + 1/2$ forgets to undo the affine map and stays in $(0, 1)$; the wrong option $a + (b - a)*(atan(y)/pi - 1/2)$ has a sign error in the half-shift; the wrong option $a + (b - a)*atan(y)/pi$ omits the $1/2$ shift and in general lands outside $(0, 1)$. The answer is $a + (b - a)*(atan(y)/pi + 1/2)$."
          - problem: "Write the full proof: for any $a < b$, the intervals $(a, b)$ and $\\mathbb{R}$ satisfy $|(a, b)| = |\\mathbb{R}|$. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1 (affine bijection): for $a < b$, the map $f(x) = (x - a)/(b - a)$ sends $(a, b)$ strictly increasing onto $(0, 1)$, and its inverse is $x = a + (b - a)t$; hence $f$ is a bijection $(a, b) \\to (0, 1)$. Step 2 (tangent bijection): the map $g(t) = \\tan(\\pi(t - 1/2))$ is strictly increasing on $(0, 1)$ because its derivative is positive, and its limits at the endpoints are $-\\infty$ and $+\\infty$, so its range is $\\mathbb{R}$; hence $g$ is a bijection $(0, 1) \\to \\mathbb{R}$. Step 3 (composition rule): the composition $h = g \\circ f$ sends $x$ to $\\tan(\\pi((x - a)/(b - a) - 1/2))$; a composition of bijections is a bijection, because the composition of injective maps is injective and the composition of surjective maps is surjective. Step 4 (conclusion): $h$ is a bijection $(a, b) \\to \\mathbb{R}$, so $|(a, b)| = |\\mathbb{R}|$."
        constraints: "chain two verified bijections; cite that compositions of bijections are bijections"
    diagnostic_exemplar:
      problem: 'Give a bijection $(0, 1) \to (3, \infty)$, prove that it is one, and state its inverse.'
      answer: 'Take $f(x) = \dfrac{1}{x} + 2$. For $x \in (0,1)$ we have $1/x \in (1, \infty)$, so $f(x) \in (3, \infty)$: the map lands in the target. Injective: $\dfrac1a + 2 = \dfrac1b + 2$ gives $\dfrac1a = \dfrac1b$, hence $a = b$. Surjective: given $y > 3$, set $x = \dfrac{1}{y - 2}$; since $y - 2 > 1$ we get $x \in (0,1)$, and $f(x) = (y-2) + 2 = y$. So $f$ is a bijection, with inverse $f^{-1}(y) = \dfrac{1}{y - 2}$.'
      solution_sketch: 'Compose the reciprocal bijection $(0,1) \to (1,\infty)$ with a shift by $2$; check the image, injectivity, and a formula for the preimage.'
    anki_seeds:
      - front: 'Why is "same cardinality" transitive?'
        back: 'Compositions of bijections are bijections.'
        type: basic
      - front: 'A standard bijection $(0, 1) \to \mathbb{R}$?'
        back: '$x \mapsto \tan\left(\pi\left(x - \tfrac{1}{2}\right)\right)$.'
        type: basic

