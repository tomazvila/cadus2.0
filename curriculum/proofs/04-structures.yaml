        exemplars:
          - problem: "The map $\\varphi(x) = \\ln(|x|)$ goes from the multiplicative group $(\\mathbb{R}\\setminus\\{0\\}, \\cdot)$ of nonzero reals to the additive group $(\\mathbb{R}, +)$. Derive the homomorphism condition from the two named operations for arbitrary inputs, and justify whether it holds for every pair. Take $a = -e^2$ and $b = -e^3$. Return verdict = holds or fails, left = the image of the domain combination of these inputs, and right = the codomain combination of their separate images."
            answer: "verdict = holds; left = 5; right = 5"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["holds"], ["fails"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "left"}, {"contract": {"kind": "exact"}, "name": "right"}]}
            solution_sketch: "Full condition: for every pair, $\\ln(|ab|) = \\ln(|a|) + \\ln(|b|)$, with multiplication on the left side of the check and addition on the right. Rule 1: $|ab| = |a||b|$, so the absolute values combine multiplicatively. Rule 2: the log law $\\ln(uv) = \\ln(u) + \\ln(v)$ then gives equality for every pair. At $a = -e^2$, $b = -e^3$: left $= \\ln(e^5) = 5$ and right $= \\ln(e^2) + \\ln(e^3) = 2 + 3 = 5$. The wrong verdict fails would require a pair with unequal sides, but no such pair exists. The answer is verdict = holds; left = 5; right = 5."
          - problem: "The parity map $\\varphi(n) = n \\bmod 2$ goes from the additive group $(\\mathbb{Z}, +)$ to the group $(\\mathbb{Z}_2, +_2)$ of residues with addition mod $2$. Derive the homomorphism condition from the two named operations for arbitrary inputs, and justify whether it holds for every pair. Take $m = 9$ and $n = 6$. Return verdict = holds or fails, left = the image of the domain combination of these inputs, and right = the codomain combination of their separate images."
            answer: "verdict = holds; left = 1; right = 1"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["holds"], ["fails"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "left"}, {"contract": {"kind": "exact"}, "name": "right"}]}
            solution_sketch: "Full condition: for every pair, $(m + n) \\bmod 2 = (m \\bmod 2) +_2 (n \\bmod 2)$, with ordinary addition in the domain and mod-2 addition in the codomain. Rule: the parity of a sum is the mod-2 sum of the parities, since $(m + n) - (m \\bmod 2) - (n \\bmod 2)$ is even. So the condition is satisfied for every pair. At $m = 9$, $n = 6$: left $= 15 \\bmod 2 = 1$ and right $= 1 +_2 0 = 1$. The wrong verdict fails would require a pair with unequal sides, but all four parity combinations give equality. The answer is verdict = holds; left = 1; right = 1."
          - problem: "For phi(x)=e^x from (R,+) to (positive R,multiplication), form both sides of its homomorphism condition for arbitrary x,y. Give left, the image of the domain-operation result, and right, the codomain-operation result."
            answer: "left = e^(x+y); right = e^x*e^y"
            answer_contract: {"kind": "multipart", "parts": [{"name": "left", "contract": {"kind": "function", "vars": ["x", "y"]}}, {"name": "right", "contract": {"kind": "function", "vars": ["x", "y"]}}]}
            solution_sketch: "The domain combines x,y by addition; the codomain multiplies their images. Thus left = e^(x+y) and right = e^x*e^y."
          - problem: "The identity map $\\varphi(x) = x$ goes from the multiplicative group $(\\mathbb{R}^{>0}, \\cdot)$ of positive reals to the additive group $(\\mathbb{R}, +)$. Derive the homomorphism condition from the two named operations for arbitrary inputs, and justify whether it holds for every pair. Take $a = 3$ and $b = 5$. Return verdict = holds or fails, left = the image of the domain combination of these inputs, and right = the codomain combination of their separate images."
            answer: "verdict = fails; left = 15; right = 8"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["holds"], ["fails"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "left"}, {"contract": {"kind": "exact"}, "name": "right"}]}
            solution_sketch: "Full condition: for every pair of positive reals, $\\varphi(a \\cdot b) = ab$ must equal $\\varphi(a) + \\varphi(b) = a + b$, with multiplication in the domain and addition in the codomain. Check the pair $a = 3$, $b = 5$: left $= 15$ and right $= 3 + 5 = 8$. Rule: one pair with unequal sides shows the condition is not satisfied, so the map is not a homomorphism. The wrong verdict holds would need $ab = a + b$ for all positive reals, but 15 and 8 differ. The answer is verdict = fails; left = 15; right = 8."
          - problem: "A homomorphism phi from the additive group (R,+) to the multiplicative group (positive R,multiplication) satisfies phi(2)=9. Derive the operation-preservation rule from these two structures, use it repeatedly, and find phi(6)."
