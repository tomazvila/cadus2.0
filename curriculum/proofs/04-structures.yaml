        step_check:
          step: 'So $0$ is a two-sided identity'
          question: 'Why does the definition of an identity ask for both $a + 0 = a$ and $0 + a = a$?'
          options:
            - 'The two conditions together make the operation closed, and a monoid needs closure as well'
            - 'Addition always gives different results in the two orders, so each order must be checked'
            - 'The order of the operands can matter in a general operation, so the two conditions differ'
            - 'An identity must be larger than every element it combines with, and two checks confirm that'
          answer: 'The order of the operands can matter in a general operation, so the two conditions differ'
          why: 'For an operation that is not commutative, $a * e = a$ does not imply $e * a = a$. A two-sided identity must satisfy both conditions.'
        exemplars:
          - problem: 'What is the identity element of the monoid of real $2 \times 2$ matrices under matrix multiplication?'
            answer: '[[1,0],[0,1]]'
            answer_contract: {"kind": "matrix", "rows": 2, "cols": 2}
            solution_sketch: 'The identity $I$ satisfies $AI = A = IA$ for every matrix $A$. The matrix with rows $(1, 0)$ and $(0, 1)$ does this, since multiplying by it copies each row and each column unchanged.'
          - problem: 'Is the set $\mathbb{Z}$ with the operation $a * b = a + b + 1$ a monoid?'
            answer: 'yes'
            answer_contract: {"kind": "label", "options": [["yes", "yes, it is", "it is a monoid", "a monoid", "it has an identity", "has an identity"], ["no", "no, it is not", "it is not a monoid", "not a monoid", "it has no identity", "no identity"]]}
            solution_sketch: 'The operation is closed on $\mathbb{Z}$, and it is associative because both groupings equal $a + b + c + 2$. The integer $-1$ is an identity, since $a * (-1) = a - 1 + 1 = a$ and $(-1) * a = a$, so the answer is yes.'
          - problem: 'On the positive rationals define $a * b = ab/2$. Find the identity element of this monoid.'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'An identity $e$ satisfies $a * e = a$, so $ae/2 = a$ and $e = 2$. The other side holds too, since $2 * a = 2a/2 = a$, so the identity is $2$.'
          - problem: 'The words over the letters $a$ and $b$, including the empty word, form a monoid when two words are combined by writing one after the other. How many letters does the identity element have?'
            answer: '0'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Joining the empty word to a word $w$, on either side, gives $w$ again. So the identity is the empty word, which has $0$ letters.'
          - problem: 'Sam claims that $0$ is the identity element of the natural numbers $\{0, 1, 2, \dots\}$ under multiplication. What is the smallest natural number $a$ for which $a \cdot 0 \neq a$?'
            answer: '1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'An identity $e$ would need $a \cdot e = a$ for every $a$. With $e = 0$ we get $0 \cdot 0 = 0$, which is fine, but $1 \cdot 0 = 0 \neq 1$, so the smallest such $a$ is $1$. The identity of multiplication is $1$, not $0$.'
          - problem: 'Is the set of odd integers under addition a monoid?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "yes, it is", "it is a monoid", "a monoid", "it has an identity", "has an identity"], ["no", "no, it is not", "it is not a monoid", "not a monoid", "it has no identity", "no identity"]]}
            solution_sketch: 'The sum of two odd integers is even, for example $1 + 1 = 2$, so the set is not closed under addition. Without closure the operation is not an operation on the set, so the answer is no.'
          - problem: 'Hours on a 12-hour clock are combined by adding them modulo $12$, on the set $\{0, 1, \dots, 11\}$. Which hour $e$ leaves every hour unchanged when it is added to it?'
            answer: '0'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'We need $a + e \equiv a \pmod{12}$ for every $a$, which means $e \equiv 0$. The only number of $\{0, \dots, 11\}$ with this property is $0$, so the identity is $0$.'
          - problem: 'Write the full proof that, for every set $S$, the power set $\mathcal{P}(S)$ with the operation of union is a monoid whose identity element is the empty set.'
            answer: '(P(S), union, empty set) is a monoid'
            answer_contract: {"kind": "none"}
            solution_sketch: 'Let $S$ be a set, and let $A, B, C \in \mathcal{P}(S)$, that is, $A, B, C \subseteq S$. For closure, let $x \in A \cup B$. Then $x \in A$ or $x \in B$, and in both cases $x \in S$, so $A \cup B \subseteq S$ and $A \cup B \in \mathcal{P}(S)$. For associativity, an element $x$ lies in $(A \cup B) \cup C$ exactly when ($x \in A$ or $x \in B$) or $x \in C$. This holds exactly when $x \in A$ or ($x \in B$ or $x \in C$), that is, exactly when $x \in A \cup (B \cup C)$. So $(A \cup B) \cup C = A \cup (B \cup C)$. For the identity, $\emptyset \subseteq S$, so $\emptyset \in \mathcal{P}(S)$. An element $x$ lies in $A \cup \emptyset$ exactly when $x \in A$ or $x \in \emptyset$, and $x \in \emptyset$ is never true, so exactly when $x \in A$. Thus $A \cup \emptyset = A$, and the same argument gives $\emptyset \cup A = A$. Closure, associativity and the identity all hold, so $\mathcal{P}(S)$ with union is a monoid with identity $\emptyset$.'
        constraints: "verify closure, associativity, and a two-sided identity Closed proof-audit items must require this knowledge point's method; verify every proposed inference for the stated arbitrary inputs. Do not supply the decisive result as an established fact."
      - id: kp2
        name: "Uniqueness of the identity"
        key_prerequisites: [binary-operations]
        step_check:
          step: 'so $e_1 = e_1 \star e_2 = e_2$'
          question: 'Why does the chain $e_1 = e_1 \star e_2 = e_2$ follow from the two computations?'
          options:
            - 'Each identity is equal to every element, so any two identities are also equal to each other'
            - 'The operation $\star$ is commutative, and commutative operations have only one identity'
            - 'The product $e_1 \star e_2$ is larger than both $e_1$ and $e_2$, so they must coincide'
            - 'Both computations evaluate the one product $e_1 \star e_2$, so its two values are equal'
          answer: 'Both computations evaluate the one product $e_1 \star e_2$, so its two values are equal'
          why: 'Because $e_2$ is an identity, $e_1 \star e_2 = e_1$. Because $e_1$ is an identity, the same product equals $e_2$. One element cannot have two different values, so $e_1 = e_2$.'
        exemplars:
