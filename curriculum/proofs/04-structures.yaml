            answer: "5, 4, 5, 4"
            answer_contract: {"kind": "list", "member": {"kind": "exact"}, "ordered": true}
            solution_sketch: "The listed diagonal digits are d11 = 4, d22 = 5, d33 = 9, d44 = 5 from x1 through x4. Rule: e_n = 5 if d_nn is not 5, and e_n = 4 if d_nn is 5. Apply this to each diagonal digit: e1 = 5, e2 = 4, e3 = 5, e4 = 4. The answer is 5, 4, 5, 4."
          - problem: "A listing of infinite binary sequences begins s1 = 0, 1, 1, 0, ... ; s2 = 1, 0, 1, 1, ... ; s3 = 0, 0, 1, 0, ... . In the diagonal construction the new sequence t is defined by t_n = 1 - s_nn. Give the third bit t3."
            answer: "0"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The diagonal entry in row 3 is s33 = 1. Rule: the new bit is t_n = 1 - s_nn, which flips the diagonal bit. For n = 3, t3 = 1 - 1 = 0. The answer is 0."
          - problem: "A finite list of four binary sequences is s1 = 1, 0, 0, 1; s2 = 0, 0, 1, 1; s3 = 1, 1, 0, 0; s4 = 0, 1, 0, 1. Build the diagonal sequence t by t_n = 1 - s_nn. Give t1 t2 t3 t4 as a comma-separated list."
            answer: "0, 1, 1, 0"
            answer_contract: {"kind": "list", "member": {"kind": "exact"}, "ordered": true}
            solution_sketch: "The diagonal entries are s11 = 1, s22 = 0, s33 = 0, s44 = 1. Rule: flip each diagonal entry, t_n = 1 - s_nn. Apply: t1 = 0, t2 = 1, t3 = 1, t4 = 0. The answer is 0, 1, 1, 0."
          - problem: "A listing of three decimals begins 0.123..., 0.456..., 0.789... . Build y = 0.e1e2e3... by e_n = 5 when d_nn is not 5 and e_n = 4 when d_nn is 5. Give y as a decimal with three digits after the point."
            answer: "0.545"
            answer_contract: {"decimals": 3, "kind": "approx"}
            solution_sketch: "The diagonal digits are d11 = 1, d22 = 5, d33 = 9. Rule: e_n = 5 if d_nn is not 5, and e_n = 4 if d_nn is 5. Apply: e1 = 5, e2 = 4, e3 = 5, so y = 0.545. The answer is 0.545."
          - problem: "Claim: the interval (0, 1) is uncountable. Step 1: suppose all reals in (0, 1) are listed as x1, x2, ... . Step 2: write x_n = 0.d_{n1}d_{n2}... . Step 3: define y = 0.e1e2... by e_n = d_nn. Step 4: then y differs from every x_n, so y is not in the list. Which step is the first step that is not valid?"
            answer: "Step 3"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "Step 1 is a valid supposition for a proof by contradiction. Step 2 is valid notation for each listed decimal. Step 3 is invalid because setting e_n = d_nn copies the diagonal entry and does not make y different. Step 4 would be valid only after the rule flips the diagonal entry. The answer is Step 3."
          - problem: "In the binary diagonal construction, the definition of the new sequence t is missing. Select the missing rule for each position."
            answer: "flip the diagonal bit"
            answer_contract: {"kind": "label", "options": [["flip the diagonal bit"], ["copy the diagonal bit"], ["add one to the bit"], ["subtract one from the bit"]]}
            solution_sketch: "The construction must make t differ from every listed sequence at its diagonal position. The option copy the diagonal bit fails because it repeats the entry. The option add one to the bit may leave the binary alphabet and does not always differ. The option subtract one from the bit has the same alphabet problem. The option flip the diagonal bit gives t_n = 1 - s_nn. The answer is flip the diagonal bit."
          - problem: "Write the full proof: every listing of infinite binary sequences misses at least one infinite binary sequence, so the set of infinite binary sequences is uncountable. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Suppose for contradiction that all infinite binary sequences are listed as s1, s2, s3, ... . Write the nth sequence as s_n = (s_{n1}, s_{n2}, s_{n3}, ...). Construct a new sequence t by defining t_n = 1 - s_{nn} for each n. At position n, t has the bit opposite to the nth bit of s_n, so t differs from s_n. Therefore t is different from every sequence in the list, yet t is an infinite binary sequence. This contradicts the supposition that the list contains all such sequences. Hence no complete listing exists, so the set of infinite binary sequences is uncountable."
        constraints: "construct the diagonal object differing from each listed entry"
      - id: kp2
        name: "Power sets and Cantor''s theorem"
        key_prerequisites: [cardinality-countability]
        exemplars:
          - problem: "A function f sends each of 0, 1, 2, 3 to a subset of {0, 1, 2, 3}: f(0) = {0, 2}, f(1) = {2}, f(2) = {0, 1}, f(3) = {1, 3}. Build the diagonal set D = {n : n is not in f(n)}. Give the smallest element of D."
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The diagonal set is D = {n : n is not in f(n)}, taken over {0, 1, 2, 3}. Test 0: 0 is in f(0) = {0, 2}, so 0 is not in D. Test 1: 1 is not in f(1) = {2}, so 1 is in D. Test 2: 2 is not in f(2) = {0, 1}, so 2 is in D. Test 3: 3 is in f(3) = {1, 3}, so 3 is not in D. Hence D = {1, 2}, and its smallest element is 1."
          - problem: "Each of 0, 1 and 2 labels an infinite binary sequence: the sequence for 0 starts 0, 1, 1; the sequence for 1 starts 1, 1, 0; the sequence for 2 starts 0, 0, 1. Build the diagonal sequence t by flipping the n-th digit of the sequence labelled n. Give the first three digits of t, in order."
            answer: "1, 0, 0"
            answer_contract: {"kind": "list", "member": {"kind": "exact"}, "ordered": true}
            solution_sketch: "The rule is t_n = 1 - f(n)_n, where f(n)_n is the n-th digit of the sequence labelled n. At n = 0 the digit is 0, so t_0 = 1 - 0 = 1. At n = 1 the second digit of the sequence for 1 is 1, so t_1 = 1 - 1 = 0. At n = 2 the third digit of the sequence for 2 is 1, so t_2 = 1 - 1 = 0. The first three digits of t are 1, 0, 0."
          - problem: "On the set {0, 1, 2, 3, 4} a map f sends each number to a subset of that set. Here f(0) = {1}, f(1) = {0, 2}, f(2) = {2, 3}, f(3) = {0, 1, 2, 3} and f(4) = {4}. Form the set D of all numbers n for which n is not an element of f(n). How many elements does D have?"
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The diagonal set is D = {n : n is not an element of f(n)}. Check 0: 0 is not in f(0) = {1}, so 0 lies in D. Check 1: 1 is not in f(1) = {0, 2}, so 1 lies in D. Check 2: 2 is in f(2) = {2, 3}, so 2 is not in D. Check 3: 3 is in f(3), so 3 is not in D. Check 4: 4 is in f(4) = {4}, so 4 is not in D. Thus D = {0, 1}, which has 2 elements."
          - problem: "Let f send each natural number n to the subset {n + 1, n + 2} of the natural numbers. Build the diagonal set D = {n : n is not an element of f(n)}. State the least member of D."
            answer: "0"
            answer_contract: {"kind": "exact"}
            solution_sketch: "With f(n) = {n + 1, n + 2}, the diagonal set is D = {n : n is not an element of f(n)}. For any natural number n, n is different from n + 1 and from n + 2, so n is never an element of f(n). Therefore every natural number lies in D, and the least member of D is 0."
          - problem: "Claim: no function f from the natural numbers to the set of infinite binary sequences is onto. Step 1: suppose f is onto. Step 2: define a sequence t by flipping the n-th digit of the sequence f(n). Step 3: for every n, the sequences t and f(n) agree at position n. Step 4: hence t is not a value of f, so f is not onto. Which step is the first step that is not valid?"
            answer: "Step 3"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "Step 1 is a legal supposition for a proof by contradiction, and Step 2 legally defines the diagonal sequence by flipping digits. Step 3 is false: since t is built by flipping the n-th digit, t and f(n) differ at position n, they do not agree. Step 4 draws the right conclusion once Step 3 is corrected. The answer is Step 3."
          - problem: "In the proof that no function f from the natural numbers to the set of all subsets of the natural numbers is onto, one builds D as the set of numbers that are not members of their own image. Under the supposition D = f(m), the line that finishes the contradiction is missing. Select the missing line."
            answer: "m is in D exactly when m is not in D"
            answer_contract: {"kind": "label", "options": [["m is in D exactly when m is not in D"], ["m is in D exactly when m is in D"], ["D is empty, so m is not in D"], ["D is infinite, so m is in D"]]}
            solution_sketch: "The wrong option 'm is in D exactly when m is in D' drops the negation in the definition of D. The wrong option 'D is empty, so m is not in D' adds a claim about emptiness that the argument never establishes. The wrong option 'D is infinite, so m is in D' adds an unsupported claim about size. By the definition of D, m is in D exactly when m is not in f(m); with D = f(m) this becomes: m is in D exactly when m is not in D, a contradiction. The answer is m is in D exactly when m is not in D."
          - problem: "Write the full proof: every function from the natural numbers to the set of all subsets of the natural numbers fails to be onto. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Suppose, for contradiction, that f from the natural numbers to the set of all subsets of the natural numbers is onto. Define the diagonal set D = {n : n is not an element of f(n)}, which is a subset of the natural numbers. Because f is onto, some m satisfies f(m) = D. Now m is in D exactly when m is not in f(m), by the definition of D. Substituting f(m) = D turns this into m is in D exactly when m is not in D, a contradiction. Hence no such onto f exists, so the power set of the natural numbers is uncountable."
        constraints: "build the diagonal set $D = \\{a : a \\notin f(a)\\}$"
      - id: kp3
        name: "Cantor''s theorem in general"
        key_prerequisites: [negating-statements]
        exemplars:
          - problem: "Let $A$ be the set $\\{1, 2, 3, 4\\}$ and define $f$ by $f(1) = \\{2, 4\\}$, $f(2) = \\{1, 2\\}$, $f(3) = \\{1, 4\\}$, $f(4) = \\{4\\}$. The diagonal set $D$ collects every $a$ in $A$ with $a$ not in $f(a)$, and it witnesses that $f$ is not surjective onto the set of all subsets of $A$. Give the elements of $D$ in increasing order, separated by commas."
            answer: "1, 3"
            answer_contract: {"kind": "list", "member": {"kind": "exact"}, "ordered": true}
            solution_sketch: "By the diagonal definition, $D = \\{a \\in A : a \\notin f(a)\\}$. Test each element: $1$ is not in $f(1) = \\{2, 4\\}$, so $1$ lies in $D$; $2$ is in $f(2) = \\{1, 2\\}$, so $2$ does not; $3$ is not in $f(3) = \\{1, 4\\}$, so $3$ lies in $D$; $4$ is in $f(4) = \\{4\\}$, so $4$ does not. Thus $D = \\{1, 3\\}$. In increasing order, the answer is 1, 3."
          - problem: "Let $A$ be the set $\\{0, 1, 2, 3, 4\\}$ and define $f$ by $f(0) = \\{0, 1\\}$, $f(1) = \\{1, 2\\}$, $f(2) = \\{0, 2\\}$, $f(3) = \\{0, 1, 2\\}$, $f(4) = \\{3\\}$. The diagonal set $D$ collects every $a$ in $A$ with $a$ not in $f(a)$; it is a subset that no value of $f$ can equal. Find the smallest element of $D$."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "By the diagonal definition, $D = \\{a \\in A : a \\notin f(a)\\}$. Test from the bottom up: $0$ is in $f(0)$, $1$ is in $f(1)$, and $2$ is in $f(2)$, so none of them lies in $D$. Next, $3$ is not in $f(3) = \\{0, 1, 2\\}$, so $3$ lies in $D$. No smaller element qualifies, so the smallest element of $D$ is 3."
          - problem: "Let $A$ be the set $\\{1, 2, 3, 4, 5\\}$ and define $f$ by $f(1) = \\{2, 5\\}$, $f(2) = \\{2, 4\\}$, $f(3) = \\{3, 5\\}$, $f(4) = \\{1, 2, 3\\}$, $f(5) = \\{1, 4, 5\\}$. Let $D$ be the diagonal set, the set of every $a$ in $A$ with $a$ not in $f(a)$. Determine whether the element $4$ lies in $D$, and give the number of elements of $D$."
            answer: "verdict = yes; count = 2"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["yes"], ["no"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "count"}]}
            solution_sketch: "By the diagonal definition, $D = \\{a \\in A : a \\notin f(a)\\}$. Test the element $4$: $4$ is not in $f(4) = \\{1, 2, 3\\}$, so $4$ lies in $D$. Test the rest: $1$ is not in $f(1) = \\{2, 5\\}$, so $1$ lies in $D$, while $2$ is in $f(2)$, $3$ is in $f(3)$, and $5$ is in $f(5)$, so none of them lies in $D$. Hence $D = \\{1, 4\\}$. The answer is verdict = yes; count = 2."
          - problem: "A student tries to defend the claim that some function from $A$ to the set of all subsets of $A$ can be surjective. Step 1: Let $f$ be a function from $A$ to the set of all subsets of $A$, and define $D$ as the set of every $a$ in $A$ with $a$ not in $f(a)$. Step 2: Suppose, for contradiction, that $D$ equals $f(x)$ for some $x$ in $A$. Step 3: By the definition of $D$, the element $x$ lies in $D$ exactly when $x$ lies in $f(x)$. Step 4: Since $D$ equals $f(x)$, the previous line says that $x$ lies in $D$ exactly when $x$ lies in $D$, which is no contradiction. Step 5: The supposition stands, so $D$ is in the image of $f$. Which step is the first step that is not valid?"
            answer: "Step 3"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"], ["Step 5"]]}
            solution_sketch: "Step 1 states the correct diagonal definition. Step 2 is the legitimate supposition that the argument must refute. Step 3 misquotes the definition by dropping the negation: it should read that $x$ lies in $D$ exactly when $x$ does not lie in $f(x)$. Step 4 correctly unfolds the misquoted line into a tautology, and Step 5 draws the student's conclusion from it, but the defect enters at Step 3: with the correct line, Step 4 would read that $x$ lies in $D$ exactly when $x$ does not, the contradiction Cantor needs. The first invalid step is Step 3."
          - problem: "Let $A$ be the set $\\{0, 1, 2, 3\\}$ and define $f$ by $f(0) = \\emptyset$, $f(1) = \\{0, 1\\}$, $f(2) = \\{0, 2, 3\\}$, $f(3) = \\{1, 3\\}$. In the diagonal argument the set $D$ collects the elements $a$ with $a$ not in $f(a)$; its complement in $A$ collects the elements $a$ with $a$ in $f(a)$. Give, from smallest to largest and separated by commas, every $a$ in $A$ with $a$ in $f(a)$."
            answer: "1, 2, 3"
            answer_contract: {"kind": "list", "member": {"kind": "exact"}, "ordered": true}
            solution_sketch: "The complement collects the elements $a$ with $a$ in $f(a)$, the condition opposite to the diagonal one. Test each element: $0$ is not in $f(0) = \\emptyset$; $1$ is in $f(1) = \\{0, 1\\}$; $2$ is in $f(2) = \\{0, 2, 3\\}$; $3$ is in $f(3) = \\{1, 3\\}$. So the complement is $\\{1, 2, 3\\}$. From smallest to largest, the answer is 1, 2, 3."
          - problem: "In the proof of Cantor's theorem, let $A$ be a set, let $f$ be a function from $A$ to the set of all subsets of $A$, and let $D$ be the diagonal set of all $a$ in $A$ with $a$ not in $f(a)$. Suppose, for contradiction, that $f$ is surjective, so $D$ equals the value of $f$ at some element $x$ of $A$. One line of the argument is missing: the equivalence that the definition of $D$ yields at the element $x$. Select that line."
            answer: "x in D iff x not in f(x)"
            answer_contract: {"kind": "label", "options": [["x in D iff x not in f(x)"], ["x in D iff x in f(x)"], ["x in D and x not in f(x)"], ["x not in f(x) or x in D"]]}
            solution_sketch: "The definition of $D$ says that $a$ is in $D$ exactly when $a$ is not in $f(a)$; applied at $a = x$ it yields the missing line. The option 'x in D iff x in f(x)' drops the negation and reverses the meaning of the definition. The option 'x in D and x not in f(x)' asserts membership outright instead of stating the equivalence. The option 'x not in f(x) or x in D' keeps only one direction of the equivalence. The answer is x in D iff x not in f(x)."
          - problem: "Write the full proof: for every set $A$, no function from $A$ to the set of all subsets of $A$ is surjective. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Setup: let $A$ be any set and let $f$ be any function from $A$ to the power set of $A$. Diagonal step: define $D = \\{a \\in A : a \\notin f(a)\\}$; this is a subset of $A$, hence a possible value of $f$. Contradiction step: suppose $f$ were surjective; then $D = f(x)$ for some $x$ in $A$. By the definition of $D$, $x$ is in $D$ exactly when $x$ is not in $f(x)$; since $f(x) = D$, this says that $x$ is in $D$ exactly when $x$ is not in $D$, which is impossible. Conclusion: no such $x$ exists, so $f$ is not surjective; since $f$ was arbitrary, no function from $A$ to its power set is surjective, which is Cantor's theorem."
        constraints: "generalize the diagonal argument to an arbitrary set"
    diagnostic_exemplar:
      problem: 'Prove by a diagonal argument that the set $\{0,1\}^{\mathbb{N}}$ of infinite binary sequences is uncountable.'
      answer: 'Let $f : \mathbb{N} \to \{0,1\}^{\mathbb{N}}$ be any map, and write $f(n) = (f(n)_0, f(n)_1, f(n)_2, \dots)$. Define a sequence $s$ by $s_n = 1 - f(n)_n$; each $s_n$ is $0$ or $1$, so $s \in \{0,1\}^{\mathbb{N}}$. For every $n$, $s$ differs from $f(n)$ in position $n$, so $s \ne f(n)$; hence $s$ is not in the image and $f$ is not surjective. Since no map $\mathbb{N} \to \{0,1\}^{\mathbb{N}}$ is surjective, none is a bijection, so the set is uncountable.'
      solution_sketch: 'Take an arbitrary indexing, flip the $n$-th bit of the $n$-th sequence, and observe that the new sequence is missed by every index.'
    anki_seeds:
      - front: 'What does Cantor''s diagonal argument show?'
        back: 'That $(0, 1)$ (hence $\mathbb{R}$) is uncountable: any proposed list of reals misses a number built to differ on the diagonal.'
        type: basic
      - front: 'Cantor''s theorem?'
        back: 'For every set $A$, $|A| < |\mathcal{P}(A)|$; there is no surjection $A \to \mathcal{P}(A)$.'
        type: basic

  - id: schroder-bernstein
    name: "The Schröder–Bernstein Theorem"
    core: false                # supplemental: cardinality branch (all supplemental); consumed by nothing downstream — Phase C §7
    difficulty: 0.72
    drill: false
    answer_kind: proof
    expected_time_secs: 260
    prerequisites:
      - {id: prime-factorization, weight: 0.3, key: false}          # L1 #10: kp1's injectivity of (m,n)->2^m 3^n rests on unique factorization
      - id: cardinality-countability
        weight: 0.6
        key: true
      - id: functions-injective-surjective
        weight: 0.5
        key: true
      - id: interval-bijections
        weight: 0.3
      # L1 audit: was weight 0.0 (conceptual-only), but kp3 PROVES |P(N)| = |R| and
      # this is the only topic in closure that teaches power sets — the content is
      # exercised, not merely referenced.
      - id: uncountability-diagonalization
        weight: 0.5
    knowledge_points:
      - id: kp1
        name: "Comparing cardinalities with injections"
        key_prerequisites: [functions-injective-surjective]
        exemplars:
          - problem: "In the injection f(m,n)=2^m 3^n used to show |N x N| <= |N|, find f(2,1)."
            answer: "12"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: substitute m=2 and n=1 into the injection, giving f(2,1)=2^2 * 3^1. Step 2: compute the powers to get 4 * 3 = 12. Injectivity is justified by unique factorization. The answer is 12."
          - problem: "Let A = {1, 2, 3} and B = {1, 2, 3, 4}. The inclusion map i: A -> B sends each element to itself. If i(a) = i(2), give a."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: the inclusion map has i(2)=2. Step 2: if i(a)=i(2), then a=2 because the inclusion map sends each element to itself and is injective. The answer is 2."
          - problem: "For the injection f: N -> N x N with f(n) = (n, 0), give f(5) as (x, y)."
            answer: "(5, 0)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "Step 1: evaluate the map at 5, giving f(5)=(5, 0). Step 2: note the map is injective because (m,0)=(n,0) forces m=n. The answer is (5, 0)."
          - problem: "Give an injection from N to the set of even natural numbers as a function of n."
            answer: "2n"
            answer_contract: {"kind": "function", "vars": ["n"]}
            solution_sketch: "Step 1: exhibit the map f(n)=2n. Step 2: if 2m=2n, then m=n, so f is injective. Its image is the even natural numbers. The answer is 2n."
          - problem: "Claim: if f: A -> B is injective, then f is bijective. Step 1: f is injective by hypothesis. Step 2: every injective function is surjective. Step 3: hence f is bijective. Step 4: so |A| = |B|. Which step is the first step that is not valid?"
            answer: "Step 2"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "Step 1 is true because it restates the hypothesis. Step 2 is false: an injective function need not be surjective, for example x -> e^x from R to R. Step 3 depends on Step 2, and Step 4 would not follow without a bijection. The answer is Step 2."
          - problem: "In the proof that |N x N| <= |N| using the injection f(m,n) = 2^m 3^n, the injectivity step needs: if 2^m 3^n = 2^p 3^q, then which conclusion follows? Select the correct line."
            answer: "m = p and n = q"
            answer_contract: {"kind": "label", "options": [["m = p and n = q"], ["m = q and n = p"], ["m + n = p + q"], ["2m + 3n = 2p + 3q"]]}
            solution_sketch: "The equation 2^m 3^n = 2^p 3^q has equal prime factorizations. Unique factorization gives m = p and n = q. The option m = q and n = p swaps the exponents. The option m + n = p + q ignores the bases. The option 2m + 3n = 2p + 3q confuses exponents with coefficients. The answer is m = p and n = q."
          - problem: "Write the full proof: if there are injections f: A -> B and g: B -> A, then there is a bijection from A to B. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1 (setup): Let f: A -> B and g: B -> A be injections. For each a in A, form a chain by going backward: if a is in the image of g, take the unique b with g(b)=a; if that b is in the image of f, take the unique a' with f(a')=b, and continue. Step 2 (partition): Each chain is finite ending in A, finite ending in B, or infinite. Let A_A be the a whose chain ends in A, A_B those ending in B, and A_inf those infinite. Step 3 (map): Define h: A -> B by h(a)=f(a) for a in A_A or A_inf, and by h(a)=g^{-1}(a) for a in A_B. Step 4 (injectivity): If two elements of A map to the same b, tracing their chains backward shows they are the same position in the same chain, so they are equal. Step 5 (surjectivity): For b in B, if its chain ends in A or is infinite, the preceding element a in A has f(a)=b; if its chain ends in B, then a=g(b) is in A_B and h(a)=b. Therefore h is a bijection. The answer is See the solution."
        constraints: "state the theorem precisely; injections must be exhibited and their injectivity justified"
      - id: kp2
        name: "Interval sandwiches"
        key_prerequisites: [interval-bijections]
        exemplars:
          - problem: "To prove that the intervals [0,2] and (0,2) have the same cardinality with the Schroder-Bernstein theorem, one injection is the inclusion of (0,2) into [0,2]. The other is an affine map of the form g(x) = x/2 + c that must send [0,2] onto the closed interval [1/2, 3/2]. Find g(x)."
            answer: "x/2+1/2"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "Full object: g(x) = x/2 + c must carry [0,2] onto [1/2, 3/2]. By the affine image rule, x/2 sends [0,2] onto [0,1], so matching left endpoints gives c = 1/2. Check with the same rule: g(2) = 1 + 1/2 = 3/2, the required right endpoint, and [1/2, 3/2] lies inside (0,2), so the sandwich is valid. The answer is x/2+1/2."
          - problem: "To prove that the half-open interval [0,3) and the real line have the same cardinality with the Schroder-Bernstein theorem, one injection is the inclusion of [0,3) into the real line. The other uses the bijection g from (0,1) onto the real line with g(t) = tan(pi(t - 1/2)), cited from the interval-bijections result: its inverse lands in (0,1), and (0,1) is contained in [0,3). Give the resulting injection from the real line into [0,3) as a formula h(x)."
            answer: "atan(x)/pi+1/2"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "Full object: the cited bijection is g(t) = tan(pi(t - 1/2)) from (0,1) onto the real line. Inversion rule for a bijection: set x = tan(pi(t - 1/2)) and solve on the branch between -pi/2 and pi/2, which gives t = atan(x)/pi + 1/2. The inverse maps the real line into (0,1), and the inclusion of (0,1) into [0,3) keeps it injective, so Schroder-Bernstein applies to the two injections. The answer is atan(x)/pi+1/2."
          - problem: "A student tries to prove that [0,1] and (0,1) have the same cardinality with the Schroder-Bernstein theorem. The inclusion of (0,1) into [0,1] is one injection. For the other, the student proposes the affine map g(x) = 3x/4 + 1/2 from [0,1] toward (0,1). Determine whether the image of g stays within (0,1), and give the value g(1)."
            answer: "verdict = outside; value = 5/4"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["inside"], ["outside"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "value"}]}
            solution_sketch: "Full object: the proposed map is g(x) = 3x/4 + 1/2 on [0,1]. Affine image rule: the image is the interval from g(0) = 1/2 to g(1) = 3/4 + 1/2 = 5/4. Since 5/4 is greater than 1, the image [1/2, 5/4] is not contained in (0,1), so this g is not a valid second injection for the Schroder-Bernstein argument. The answer is verdict = outside; value = 5/4."
          - problem: "To show that the intervals [1,3] and (1,3) have the same size, the Schroder-Bernstein theorem asks for two injections. The inclusion of (1,3) into [1,3] is one. The other is an affine map with slope 1/4 that sends [1,3] onto the closed interval [7/4, 9/4]. Give g(x)."
            answer: "x/4+3/2"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "Full object: g(x) = x/4 + c must carry [1,3] onto [7/4, 9/4]. Affine image rule: x/4 sends [1,3] onto [1/4, 3/4], so matching left endpoints gives c = 7/4 - 1/4 = 3/2. Check: g(3) = 3/4 + 3/2 = 9/4, and [7/4, 9/4] lies inside (1,3), so the sandwich is valid. The answer is x/4+3/2."
          - problem: "Claim: the closed interval [0,1] and the open interval (0,1) have the same cardinality. Step 1: the inclusion of (0,1) into [0,1] is injective. Step 2: the affine map g(x) = 2x - 1 is injective. Step 3: g sends [0,1] into (0,1), since g(0) = -1 and g(1) = 1. Step 4: by the Schroder-Bernstein theorem, two injections in opposite directions give a bijection. Which step is the first step that is not valid?"
            answer: "Step 3"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "Step 1 is valid: an inclusion map is injective. Step 2 is valid: an affine map is injective. Step 3 is the first invalid step: it claims that g sends [0,1] into (0,1), but g(0) = -1 and g(1) = 1, and neither value lies in (0,1); the image is [-1, 1]. Step 4 only follows from Schroder-Bernstein once Step 3 is repaired, for instance with g(x) = x/3 + 1/3, whose image [1/3, 2/3] lies in (0,1). The answer is Step 3."
          - problem: "A proof that the intervals [0,3] and (0,3) are equinumerous uses the Schroder-Bernstein theorem with two injections: the inclusion of (0,3) into [0,3], and the affine map g(x) = x/3 + 1, whose image is a closed subinterval of (0,3). Find the largest value in the image of g."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Full object: the affine map g(x) = x/3 + 1 acts on the closed interval [0,3]. Affine image rule: the image of an affine map on a closed interval is the closed interval running from g(0) to g(3), here from 1 to 2. Sandwich check: the image [1,2] lies inside (0,3), so g is a valid second injection next to the inclusion. The largest value in the image of g is 2."
          - problem: "Write the full proof: the interval [-2,2] and the real line have the same cardinality. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1 (first injection): the inclusion map of [-2,2] into the real line is injective, since it is the identity on its domain. Step 2 (cited bijection): the map g from (0,1) onto the real line with g(t) = tan(pi(t - 1/2)) is a bijection, proven in the interval-bijections topic, and is cited here explicitly. Step 3 (second injection): the inverse of g maps the real line injectively onto (0,1), and (0,1) is contained in [-2,2], so the inclusion after that inverse is an injective map from the real line into [-2,2]. Step 4 (conclusion): with an injection in each direction, the Schroder-Bernstein theorem yields a bijection between [-2,2] and the real line, so the two sets have the same cardinality."
        constraints: "one direction an inclusion; the other affine or the inverse of a previously proven bijection, cited explicitly"
      - id: kp3
        name: "Binary sequences, power sets, and the reals"
        # L1 audit: kp3 proves |P(N)| = |R|; power sets are taught by
        # uncountability-diagonalization (Cantor), so that is the honest peel-back
        # target for a learner who fails this KP twice.
        key_prerequisites: [uncountability-diagonalization, cardinality-countability]
        exemplars:
          - problem: "Under the injection that codes bit 0 as decimal digit 4 and bit 1 as decimal digit 5, the bit sequence 0, 1, 0, 1 gives a decimal in (0, 1). Give that decimal to 4 decimals."
            answer: "0.4545"
            answer_contract: {"decimals": 4, "kind": "approx"}
            solution_sketch: "Step 1: read the bit sequence 0, 1, 0, 1 from left to right. Step 2: apply the digit coding, replacing 0 by 4 and 1 by 5. Step 3: place the resulting digits 4, 5, 4, 5 after the decimal point. The answer is 0.4545."
          - problem: "In the indicator-function bijection from P(N) to {0,1}^N, the set S = {0, 2, 4} maps to a binary sequence. Give the first five bits of that sequence as a comma-separated list, starting with the bit for index 0."
            answer: "1, 0, 1, 0, 1"
            answer_contract: {"kind": "list", "member": {"kind": "exact"}, "ordered": true}
            solution_sketch: "Step 1: use the indicator-function bijection. Step 2: index 0 is in S, so the first bit is 1. Step 3: index 1 is not in S, so the second bit is 0. Step 4: index 2 is in S, so the third bit is 1. Step 5: index 3 is not in S, so the fourth bit is 0. Step 6: index 4 is in S, so the fifth bit is 1. The answer is 1, 0, 1, 0, 1."
          - problem: "For the rule that always chooses the non-terminating binary expansion when a real has two, the real 1/2 has a chosen expansion. Give the first four bits after the binary point as a comma-separated list."
            answer: "0, 1, 1, 1"
            answer_contract: {"kind": "list", "member": {"kind": "exact"}, "ordered": true}
            solution_sketch: "Step 1: 1/2 has the binary expansion 0.1. Step 2: it also has the non-terminating expansion 0.01111... . Step 3: the rule chooses the non-terminating one, so read the first four bits after the point. The answer is 0, 1, 1, 1."
          - problem: "Claim: |P(N)| = |R|. Step 1: Indicator functions give a bijection P(N) -> {0,1}^N. Step 2: Code each bit as a decimal digit, 0 -> 4 and 1 -> 5, to map binary sequences into (0, 1). Step 3: This map is surjective onto (0, 1) because every real has a decimal expansion using only the digits 4 and 5. Step 4: With injections both ways, Schroder-Bernstein gives a bijection. Which step is the first step that is not valid?"
            answer: "Step 3"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "Step 1 is correct: indicator functions are a bijection. Step 2 is correct: the digit coding is injective. Step 3 is false: not every real in (0, 1) has a decimal expansion using only the digits 4 and 5, so the map is not surjective. Step 4 would follow only if Step 3 were true. The answer is Step 3."
          - problem: "In the chain P(N) -> {0,1}^N -> (0, 1) -> R, the link from (0, 1) to R is missing. Select the missing bijection."
            answer: "tan(pi(x-1/2))"
            answer_contract: {"kind": "label", "options": [["tan(pi(x-1/2))"], ["tan(pi x)"], ["sin(pi x)"], ["ln(x)"]]}
            solution_sketch: "The missing link is the tangent map. Step 1: as x approaches 0, pi(x - 1/2) approaches -pi/2, so the tangent function goes to -infinity. Step 2: as x approaches 1, pi(x - 1/2) approaches pi/2, so the tangent function goes to infinity. Step 3: this map is a bijection from (0, 1) to R. Option tan(pi x) misses negative values; option sin(pi x) is not injective; option ln(x) is not defined on all of (0, 1). The answer is tan(pi(x-1/2))."
          - problem: "In the proof that the map from (0, 1) to {0,1}^N is injective, a real with two binary expansions is assigned the non-terminating one. How many binary expansions does the real 1/2 have?"
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: 1/2 = 0.1 in binary. Step 2: 1/2 = 0.01111... in binary. Step 3: these are the only two binary expansions, so the count is 2. The answer is 2."
          - problem: "Write the full proof: |{0,1}^N| = |(0, 1)|. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1: define an injection from {0,1}^N to (0, 1) by coding bit 0 as decimal digit 4 and bit 1 as decimal digit 5, then reading the result as a decimal. This map is injective because different bit sequences give different decimal digit strings, and the digits 4 and 5 avoid the dual decimal representation problem. Step 2: define an injection from (0, 1) to {0,1}^N by sending each real to its binary expansion, always choosing the non-terminating expansion when the real has two. This choice makes the map well-defined and injective, since distinct reals have distinct chosen binary expansions. Step 3: apply the Schroder-Bernstein theorem to the two injections to obtain a bijection between {0,1}^N and (0, 1). Therefore the cardinalities are equal."
        constraints: "digit-coding injections must address dual decimal/binary representations explicitly; chains cite each link"
    diagnostic_exemplar:
      problem: 'Using injections in both directions and the Schröder–Bernstein theorem, prove $|(0, 1)| = |[0, 1]|$.'
      answer: 'Inclusion $(0,1) \to [0,1]$; $x \mapsto x/2 + 1/4$ from $[0,1]$ into $(0,1)$; the theorem gives a bijection.'
      solution_sketch: 'Both maps are injective (inclusion trivially; the affine map is strictly increasing and lands in $[\tfrac14, \tfrac34]$). Schröder–Bernstein turns the two injections into a bijection. $\square$'
    anki_seeds:
      - front: 'The Schröder–Bernstein theorem?'
        back: 'If injections $A \to B$ and $B \to A$ both exist, then a bijection $A \to B$ exists ($|A| \le |B|$ and $|B| \le |A|$ imply $|A| = |B|$).'
        type: basic
      - front: '$|A| \le |B|$ means...'
        back: 'there is an injection $A \to B$.'
        type: basic
      - front: 'Why is Schröder–Bernstein so useful in practice?'
        back: 'Two easy injections replace one hard explicit bijection (e.g. $|[0,1]| = |(0,1)|$ with no endpoint juggling).'
        type: basic
