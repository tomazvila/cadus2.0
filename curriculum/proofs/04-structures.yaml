      answer: 'The map $k \mapsto k + 9$ sends $\{1, \dots, 90\}$ into $A$; it is injective (adding $9$ is) and onto ($a \in A$ equals $(a-9) + 9$ with $1 \le a - 9 \le 90$), so it is a bijection and $|A| = 90$. Likewise $k \mapsto k + 199$ is a bijection $\{1, \dots, 10\} \to B$, so $|B| = 10$. The sets are disjoint, since every element of $A$ is at most $99$ and every element of $B$ is at least $200$. Concatenating the two counting bijections gives $h : \{1, \dots, 100\} \to A \cup B$ with $h(j) = j + 9$ for $1 \le j \le 90$ and $h(j) = j + 109$ for $91 \le j \le 100$ (so $h(91) = 200$ and $h(100) = 209$); $h$ is a bijection, hence $|A \cup B| = 100 = |A| + |B|$.'
