            answer_contract: {"kind": "exact"}
            solution_sketch: 'An identity $e$ satisfies $a \star e = a$, so $a + e - 9 = a$ and $e = 9$. The other side holds too, since $9 \star a = 9 + a - 9 = a$, so the identity is $9$.'
          - problem: 'Can a monoid have two different two-sided identity elements?'
