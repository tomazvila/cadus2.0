      - id: kp2
        name: "Identity elements"
        key_prerequisites: [operation-tables]
        exemplars:
          - problem: "On the integers define a * b = a + b - 5. Solve a * e = a for e. Give e."
            answer: "5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Rule: a right identity e must satisfy a * e = a. Substitute the operation: a + e - 5 = a. Subtract a from both sides to get e - 5 = 0, so e = 5. Check the left condition: 5 * a = 5 + a - 5 = a. Thus 5 is a two-sided identity. The answer is 5."
          - problem: "On Z define a*b=a-b. Determine all right identities and all left identities. Return two codes: the right identity element followed by the left identity element, using 99 when no such identity exists."
            answer: "0, 99"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "A right identity solves a-e=a for all a. A left identity would solve e-a=a for all a, which is impossible. The resulting answer is 0, 99."
          - problem: "The operation * on {0,1,2} is defined by this table: 0*0=1, 0*1=0, 0*2=2, 1*0=0, 1*1=1, 1*2=2, 2*0=2, 2*1=2, 2*2=0. Find the identity element e. Give e."
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Rule: e is the identity when row e and column e both repeat the input. Read row 1: 1*0=0, 1*1=1, 1*2=2. Read column 1: 0*1=0, 1*1=1, 2*1=2. Both conditions hold, so e = 1. The answer is 1."
          - problem: "On the integers define a * b = a + b + 2. Solve e * a = a for e. Give e."
            answer: "-2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Rule: a left identity e must satisfy e * a = a. Substitute: e + a + 2 = a. Subtract a: e + 2 = 0, so e = -2. Check the right condition: a * e = a - 2 + 2 = a. Thus -2 is a two-sided identity. The answer is -2."
          - problem: "Claim: the operation a * b = a + 2b on the integers has identity 0. Step 1: a * e = a gives a + 2e = a, so e = 0. Step 2: the left condition needs e * a = a. Step 3: 0 * a = 0 + 2a = a for every integer a. Step 4: therefore 0 is a two-sided identity. Which step is the first invalid step? Select."
            answer: "Step 3"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "Step 1 is correct: a + 2e = a gives e = 0. Step 2 is correct: a two-sided identity also needs e * a = a. Step 3 is false: 0 * a = 2a, and 2a = a only when a = 0. Step 4 uses the false Step 3. The answer is Step 3."
          - problem: "On Q define a*b=a+b-2ab. Determine whether a two-sided identity exists by solving both identity equations for arbitrary a. Give the identity, or 99 if none exists."
            answer: "0"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Both identity equations reduce to e*(1-2a)=0 for every rational a. Taking a=0 forces e=0, and substitution verifies both sides for every a. The encoded answer is 0."
          - problem: "Write the full proof: on the integers define a * b = a + b - 4. Show that 4 is a two-sided identity for *. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1: a right identity e must satisfy a * e = a for every integer a. Step 2: substitute the operation, a * e = a + e - 4 = a, so e - 4 = 0 and e = 4. Step 3: check the left condition, e * a = 4 + a - 4 = a for every integer a. Step 4: because a * 4 = a and 4 * a = a for every integer a, the element 4 is a two-sided identity. Conclusion: the operation has identity 4, as required."
        constraints: "solve $a * e = a$ and verify the two-sided condition"
      - id: kp3
        name: "Hunting for inverses"
        key_prerequisites: [operation-tables]
        exemplars:
          - problem: "For the operation a * b = a + b - 1 on the integers, the identity element is 1. Find the inverse of an element a as a formula in a."
            answer: "2-a"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Definition of inverse: x must satisfy a * x = 1, since 1 is the identity. Substitute the operation: a + x - 1 = 1. Solve the linear equation by algebra: x = 2 - a. Check a * (2 - a) = a + 2 - a - 1 = 1. The inverse of a is 2-a."
          - problem: "For the operation a * b = a + b + ab on the real numbers, the identity element is 0. Find the unique real number that has no inverse."
            answer: "-1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Definition of inverse: x must satisfy a * x = 0, since the identity is 0. Substitute: a + x + ax = 0. Factor by algebra: x(1 + a) = -a. If a is not -1, then x = -a/(1+a) exists, so a has an inverse. If a = -1, the equation reads -1 = 0, which no x satisfies. The unique non-invertible number is -1."
          - problem: "For the operation a * b = a + b - ab on the real numbers, the identity element is 0. Find the inverse of 3 as a fraction."
            answer: "3/2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Definition of inverse: x must satisfy 3 * x = 0, since the identity is 0. Substitute the operation: 3 + x - 3x = 0. Combine like terms: 3 - 2x = 0. Solve by algebra: x = 3/2. Check 3 * (3/2) = 3 + 3/2 - 9/2 = 0. The inverse of 3 is 3/2."
          - problem: "For the operation a * b = a + b - 3 on the integers, the identity element is 3. Find the inverse of 10."
            answer: "-4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Definition of inverse: x must satisfy 10 * x = 3, since the identity is 3. Substitute the operation: 10 + x - 3 = 3. Simplify: x + 7 = 3. Solve the linear equation: x = -4. Check 10 * (-4) = 10 - 4 - 3 = 3. The inverse of 10 is -4."
          - problem: "For the operation a * b = ab/2 on the real numbers, the identity element is 2. Find the inverse of 5 as a fraction."
            answer: "4/5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Definition of inverse: x must satisfy 5 * x = 2, since the identity is 2. Substitute the operation: 5x/2 = 2. Multiply both sides by 2: 5x = 4. Divide by 5: x = 4/5. Check 5 * (4/5) = (5 times 4/5)/2 = 4/2 = 2. The inverse of 5 is 4/5."
          - problem: "For the operation a * b = a + b + 4 on the integers, the identity element is -4. Find the inverse of 7."
            answer: "-15"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Definition of inverse: x must satisfy 7 * x = -4, since the identity is -4. Substitute the operation: 7 + x + 4 = -4. Simplify: x + 11 = -4. Solve the linear equation: x = -15. Check 7 * (-15) = 7 - 15 + 4 = -4. The inverse of 7 is -15."
          - problem: "Write the full proof: On the integers define a * b = a + b - 5. Prove that 5 is the identity element and determine the inverse of each element. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Identity step: for any integer a, a * e = a + e - 5; setting this equal to a gives e = 5, and indeed a * 5 = a + 5 - 5 = a and 5 * a = 5 + a - 5 = a, so 5 is the identity. Inverse step: fix an integer a and solve a * x = 5. The equation is a + x - 5 = 5, so x = 10 - a. Check: a * (10 - a) = a + 10 - a - 5 = 5 and (10 - a) * a = 10 - a + a - 5 = 5, both equal to the identity. Conclusion: every integer a has inverse 10 - a, so no element is non-invertible under this operation."
        constraints: "solve $a * x = e$ for $x$; identify any non-invertible elements"
    diagnostic_exemplar:
      problem: 'On $\mathbb{R}$ define $a * b = a + b + ab$. Show that $*$ is commutative, find its identity element, and determine exactly which elements have inverses.'
      answer: 'Commutative: $a * b = a + b + ab = b + a + ba = b * a$. Identity: $a * e = a + e + ae = a$ forces $e(1 + a) = 0$ for every $a$, so $e = 0$; and indeed $a * 0 = a = 0 * a$. Inverses: $a * x = 0$ means $a + x + ax = 0$, i.e. $x(1 + a) = -a$. If $a \ne -1$ this has the unique real solution $x = \dfrac{-a}{1 + a}$, so $a$ is invertible; if $a = -1$ the equation becomes $0 = 1$, so $-1$ has no inverse. Exactly the elements $a \ne -1$ are invertible.'
      solution_sketch: 'Symmetry of the formula gives commutativity; solve $a * e = a$ for the identity and $a * x = 0$ for inverses, watching the case $1 + a = 0$.'
    anki_seeds:
      - front: 'A binary operation on a set $S$ is...'
        back: 'a function $* : S \times S \to S$ (so $S$ is closed under $*$).'
        type: basic
      - front: 'Identity element $e$ for an operation $*$ on $S$?'
        back: 'An element with $a * e = e * a = a$ for every $a \in S$.'
        type: basic

