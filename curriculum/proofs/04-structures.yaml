            - 'Closure and associativity were checked first, so the last axiom is only a formality here'
          answer: 'A monoid must satisfy all three axioms, so breaking one axiom breaks the definition'
          why: 'The definition of a monoid asks for closure, associativity and an identity, all together. If one of them fails, the structure is not a monoid, whatever the other two do.'
        exemplars:
          - problem: 'Two elements of $\{0, 1, 2, 3\}$ are multiplied modulo $6$. What is the smallest result that is not in the set?'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The products modulo $6$ are $0$ and $1$ for the small pairs, $2 \cdot 2 = 4$, $2 \cdot 3 = 6 \equiv 0$ and $3 \cdot 3 = 9 \equiv 3$. The result $4$ is not in the set, and no smaller result is outside it, so the set is not closed and the answer is $4$.'
          - problem: 'Is the set of all real $2 \times 2$ matrices under multiplication a monoid?'
            answer: 'yes'
            answer_contract: {"kind": "label", "options": [["yes", "yes, it is", "it is a monoid", "a monoid", "it has an identity", "has an identity"], ["no", "no, it is not", "it is not a monoid", "not a monoid", "it has no identity", "no identity"]]}
            solution_sketch: 'The product of two $2 \times 2$ matrices is a $2 \times 2$ matrix, so the set is closed. Matrix multiplication is associative, and the identity matrix is an identity element. All three axioms hold, so the answer is yes.'
          - problem: 'On $\mathbb{Z}$ define $a * b = a - b$. Find $a * (b * c) - (a * b) * c$ for $a = 9$, $b = 5$, $c = 3$.'
            answer: '6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'We have $9 * (5 * 3) = 9 * 2 = 7$ and $(9 * 5) * 3 = 4 * 3 = 1$. The difference is $7 - 1 = 6$, so the operation is not associative and $\mathbb{Z}$ with subtraction is not a monoid.'
          - problem: 'On the positive integers define $a * b = a + b + 1$. Solve $a * e = a$ for $e$.'
            answer: '-1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The equation reads $a + e + 1 = a$, so $e = -1$. This number is not a positive integer, so the operation has no identity on the positive integers.'
          - problem: 'Is the set of positive integers with the operation $a * b = a + b + 1$ a monoid?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "yes, it is", "it is a monoid", "a monoid", "it has an identity", "has an identity"], ["no", "no, it is not", "it is not a monoid", "not a monoid", "it has no identity", "no identity"]]}
            solution_sketch: 'The operation is closed and associative. But an identity $e$ would satisfy $a + e + 1 = a$, so $e = -1$, which is not a positive integer. The identity axiom fails, so the answer is no.'
          - problem: 'The sweetness of a drink is a whole number from $1$ to $10$. Two ingredients are mixed, and the mixture has the greater of their two sweetness levels. Which sweetness level can be mixed with any ingredient without changing it?'
            answer: '1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The mixture of levels $a$ and $e$ has sweetness $\max(a, e)$, and we need $\max(a, e) = a$ for every $a$. This holds for $e = 1$, since no level is below $1$, so the identity is $1$ and the set is a monoid.'
          - problem: 'Sam says that the natural numbers with $a * b = |a - b|$ form a monoid with identity $0$, because $a * 0 = a$ and $0 * a = a$. Find $(1 * 2) * 3 - 1 * (2 * 3)$.'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'We have $(1 * 2) * 3 = 1 * 3 = 2$ and $1 * (2 * 3) = 1 * 1 = 0$. The difference is $2 - 0 = 2$, so the operation is not associative. Sam checked the identity but not associativity, so this is not a monoid.'
          - problem: 'A class has $3$ students. Two groups of students are combined by keeping the students who are in both groups. A group $E$ leaves every group unchanged when it is combined with it. How many students does $E$ have?'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Combining $E$ with a group $A$ gives the students who are in both. This equals $A$ for every group $A$ only if every student of the class is in $E$, so $E$ has all $3$ students. So the groups with this operation do have an identity.'
          - problem: 'Write the full proof that the integers under subtraction, $a * b = a - b$, do not form a monoid.'
            answer: '(Z, -) is not a monoid'
            answer_contract: {"kind": "none"}
            solution_sketch: 'A monoid needs an associative operation, so it is enough to show that subtraction on $\mathbb{Z}$ is not associative. Take $a = 3$, $b = 2$ and $c = 1$. Then $(3 * 2) * 1 = (3 - 2) - 1 = 1 - 1 = 0$. On the other side $3 * (2 * 1) = 3 - (2 - 1) = 3 - 1 = 2$. Since $0 \neq 2$, the two groupings differ, so $*$ is not associative. Hence $(\mathbb{Z}, *)$ is not a monoid. The identity axiom fails as well. If $e$ were a two-sided identity, then $0 * e = 0$ would give $0 - e = 0$, so $e = 0$. But $0 * 1 = 0 - 1 = -1 \neq 1$, so $0$ is not a left identity.'
        constraints: "check the axioms; a single failure rules out a monoid Closed proof-audit items must require this knowledge point's method; verify every proposed inference for the stated arbitrary inputs. Do not supply the decisive result as an established fact."
    diagnostic_exemplar:
      problem: 'Show that the set of functions $X \to X$ under composition, with $\mathrm{id}_X$, is a monoid, and prove that the identity element of any monoid is unique.'
      answer: 'Closure: the composite of two functions $X \to X$ is again a function $X \to X$. Associativity: for every $x$, $((f \circ g) \circ h)(x) = f(g(h(x))) = (f \circ (g \circ h))(x)$, so the two composites agree. Identity: $(\mathrm{id}_X \circ f)(x) = f(x) = (f \circ \mathrm{id}_X)(x)$ for all $x$, so $\mathrm{id}_X$ is a two-sided identity. Hence this is a monoid. Uniqueness in general: if $e_1$ and $e_2$ are both identities of a monoid, then $e_1 = e_1 * e_2 = e_2$ — the first equality because $e_2$ is an identity, the second because $e_1$ is.'
      solution_sketch: 'Check closure, associativity and neutrality for composition; the uniqueness argument multiplies the two candidate identities together.'
