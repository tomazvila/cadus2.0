          - problem: "Write the full proof: on Z define a*b = a + b + 2. Prove * is associative and commutative. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Commutativity step: for any integers a and b, a*b = a+b+2 by definition. Since integer addition is commutative, a+b+2 = b+a+2 = b*a, so * is commutative. Associativity step: compute the left grouping as (a*b)*c = (a+b+2)*c = (a+b+2)+c+2 = a+b+c+4. Compute the right grouping as a*(b*c) = a*(b+c+2) = a+(b+c+2)+2 = a+b+c+4. The two groupings give the same integer a+b+c+4, so (a*b)*c = a*(b*c) for all integers a, b, and c. Therefore the operation * is associative and commutative."
