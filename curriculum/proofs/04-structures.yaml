    knowledge_points:
      - id: kp1
        name: "Group axioms and examples"
        key_prerequisites: [monoids]
        step_check:
          step: 'Each result lies in $G$, so $G$ is closed under multiplication'
          question: 'Why must every product of two elements be listed to show that $G$ is closed?'
          options:
            - 'Each product must equal the identity element for closure to hold'
            - 'Closure means the product of two elements equals the product in the other order'
            - 'Closure holds only if every product of two elements of $G$ lies in $G$'
            - 'A single product that lies in $G$ already proves closure for the whole set'
          answer: 'Closure holds only if every product of two elements of $G$ lies in $G$'
          why: 'Closure is a statement about all pairs of elements. One product that lands outside $G$ breaks it, so every pair needs a check.'
        exemplars:
          - problem: 'In the group of nonzero rational numbers under multiplication, find the inverse of $\frac{3}{4}$.'
            answer: '4/3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The identity of this group is $1$, so the inverse $x$ of $\frac{3}{4}$ satisfies $\frac{3}{4} x = 1$. Hence $x = \frac{4}{3}$, which is a nonzero rational number, so it lies in the group.'
          - problem: 'The set $U(8) = \{1, 3, 5, 7\}$ with multiplication modulo $8$ is a group. Find the inverse of $3$.'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The identity is $1$. We need $x$ in $U(8)$ with $3x \equiv 1 \pmod 8$. Since $3 \cdot 3 = 9 \equiv 1$, the element $3$ is its own inverse.'
          - problem: 'The integers under multiplication do not form a group. Which of the four group axioms (closure, associativity, identity, inverses) fails?'
            answer: 'inverses'
            answer_contract: {"kind": "label", "options": [["inverses", "inverse", "the inverse axiom", "inverse axiom", "the inverses axiom", "existence of inverses", "inverse elements", "existence of inverse"], ["closure", "closed", "the closure axiom", "closure axiom"], ["associativity", "associative", "the associativity axiom", "associativity axiom"], ["identity", "the identity axiom", "identity axiom", "identity element", "existence of identity"]]}
            solution_sketch: 'Products of integers are integers, multiplication is associative, and $1$ is an identity. But $2$ has no integer inverse, because $2b = 1$ has no integer solution. So the axiom of inverses fails.'
          - problem: 'The turns of a dial with $12$ positions form the group $\mathbb{Z}_{12}$ under addition modulo $12$. A turn by $5$ positions is followed by a second turn that returns the dial to its start. How many positions is the second turn?'
            answer: '7'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The second turn is the inverse of $5$ in $\mathbb{Z}_{12}$. It satisfies $5 + x \equiv 0 \pmod{12}$, so $x = 12 - 5 = 7$.'
          - problem: 'Sam says that $S = \{0, 1, 2, 3\}$ with ordinary addition is a group. Find the smallest value of $a + b$, with $a, b \in S$, that does not lie in $S$.'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A group must be closed under its operation. The smallest sum that leaves $S$ is $4$, for example $1 + 3 = 4$ and $2 + 2 = 4$, and $4 \notin S$. So $S$ is not closed, and it is not a group.'
          - problem: 'A scrambler multiplies each number of $\{1, 2, 4, 5, 7, 8\}$ by $2$ modulo $9$. These numbers form a group under multiplication modulo $9$. By which number must a scrambled value be multiplied, modulo $9$, to restore the original?'
            answer: '5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Restoring the value means multiplying by the inverse of $2$ in this group, so $2u \equiv 1 \pmod 9$. Since $2 \cdot 5 = 10 \equiv 1$, we get $u = 5$.'
          - problem: 'Write the full proof that the set $G = \{x \in \mathbb{R} : x \ne -1\}$ with the operation $x * y = x + y + xy$ is a group.'
            answer: '(R minus {-1}, *) is a group'
            answer_contract: {"kind": "none"}
            solution_sketch: 'The key identity is $x * y + 1 = x + y + xy + 1 = (x + 1)(y + 1)$. Closure: let $x, y \in G$. Then $x + 1 \ne 0$ and $y + 1 \ne 0$, so $(x + 1)(y + 1) \ne 0$. Hence $x * y + 1 \ne 0$, that is $x * y \ne -1$, and $x * y \in G$. Associativity: by the key identity, $(x * y) * z + 1 = (x * y + 1)(z + 1) = (x + 1)(y + 1)(z + 1)$, and likewise $x * (y * z) + 1 = (x + 1)(y * z + 1) = (x + 1)(y + 1)(z + 1)$. So $(x * y) * z = x * (y * z)$. Identity: $0 \in G$, and $0 * x = 0 + x + 0 = x = x * 0$ for every $x \in G$. Inverses: let $x \in G$ and put $x'' = -\frac{x}{x + 1}$, which is defined since $x \ne -1$. Then $x'' + 1 = \frac{1}{x + 1} \ne 0$, so $x'' \in G$. By the key identity $x * x'' + 1 = (x + 1) \cdot \frac{1}{x + 1} = 1$, so $x * x'' = 0$. Also $x'' * x = x * x''$, because the formula for $*$ is symmetric in $x$ and $y$. All four axioms hold, so $(G, *)$ is a group.'
        constraints: 'group axioms and examples: inverses in concrete groups, which axiom fails, closure checks; contexts of dials and scramblers; one proof that a set with an operation is a group'
      - id: kp2
        name: "Uniqueness of inverses"
        key_prerequisites: [monoids]
        step_check:
          step: 'Replace the identity by $a^{-1}a$'
          question: 'Why may the identity $e$ be replaced by $a^{-1}a$ in the line $b = eb$?'
          options:
            - 'Because $a^{-1}a$ equals $a$ in every group, so the line keeps its value'
            - 'Because $a^{-1}a = e$ by the inverse law, so both are equal'
            - 'Because $b$ and $a^{-1}$ were assumed equal at the start of the proof'
            - 'Because multiplying $b$ by any other element of $G$ is always allowed'
          answer: 'Because $a^{-1}a = e$ by the inverse law, so both are equal'
          why: 'The inverse law gives $a^{-1}a = e$. Replacing $e$ by an equal expression keeps the equation true and creates the product $ab$ that the hypothesis names.'
        exemplars:
          - problem: 'In the group $U(16)$ of units modulo $16$, we have $5 \cdot 13 = 65 \equiv 1$. Find the inverse of $13$.'
            answer: '5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The equation $5 \cdot 13 \equiv 1 \pmod{16}$ says that $5$ is an inverse of $13$. An element of a group has only one inverse, so the inverse of $13$ is $5$ and no further search is needed.'
          - problem: 'Can an element of a group have two different inverses?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["no", "it cannot", "never", "an inverse is unique", "inverses are unique", "no, an inverse is unique", "it does not", "no it cannot"], ["yes", "it can", "sometimes", "yes, it can"]]}
            solution_sketch: 'Suppose $b$ and $c$ both invert $a$. Then $b = be = b(ac) = (ba)c = ec = c$. So the two inverses are equal, and the inverse of $a$ is unique.'
          - problem: 'A dial has $15$ positions, and turns combine by addition modulo $15$. A turn by $9$ positions is undone by exactly one turn. How many positions is that turn?'
            answer: '6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The undoing turn is the inverse of $9$ in $\mathbb{Z}_{15}$. It satisfies $9 + x \equiv 0 \pmod{15}$, so $x = 6$. Since inverses are unique, no other turn undoes the move.'
          - problem: 'In the monoid of all functions from $\mathbb{R}$ to $\mathbb{R}$ under composition, the function $f(x) = 2x + 1$ satisfies $f(s(x)) = x$ for $s(x) = \frac{x - 1}{2}$. A function $l$ satisfies $l(f(x)) = x$ for every $x$. Find $l(7)$.'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A left inverse and a right inverse of the same element are equal: $l = l \circ (f \circ s) = (l \circ f) \circ s = s$. So $l(7) = s(7) = \frac{7 - 1}{2} = 3$.'
          - problem: 'In the monoid of $2 \times 2$ real matrices, let $A = \begin{pmatrix}1&1\\0&1\end{pmatrix}$ and $B = \begin{pmatrix}1&-1\\0&1\end{pmatrix}$, so that $AB = I$. A matrix $C$ satisfies $CA = I$. Find $C$.'
            answer: '[[1,-1],[0,1]]'
            answer_contract: {"kind": "matrix", "rows": 2, "cols": 2}
            solution_sketch: 'A left inverse and a right inverse of $A$ are equal: $C = C(AB) = (CA)B = B$. So $C = B$, the matrix with rows $(1, -1)$ and $(0, 1)$. Check: $BA$ has rows $(1, 0)$ and $(0, 1)$.'
          - problem: 'Sam proves that the inverse of $a$ is unique by writing $b = be = b(ac) = (ba)c = ec = c$. Is this proof still valid in a monoid whose operation is not commutative?'
            answer: 'yes'
            answer_contract: {"kind": "label", "options": [["yes", "it is", "it does", "yes it is", "yes it does", "true", "it is true"], ["no", "it is not", "it does not", "no it is not", "no it does not", "false", "not true"]]}
            solution_sketch: 'Every step uses only the identity law, associativity and the equations $ac = e$ and $ba = e$. None of them needs $xy = yx$. So the proof is valid in every monoid, commutative or not.'
          - problem: 'Write the full proof that if $b$ and $c$ are elements of a monoid $(M, \cdot, e)$ with $ba = e$ and $ac = e$, then $b = c$. Conclude that an invertible element of a monoid has exactly one inverse.'
            answer: 'if ba = e and ac = e then b = c'
            answer_contract: {"kind": "none"}
            solution_sketch: 'Assume $ba = e$ and $ac = e$. Then $b = be$ by the identity law. Substituting $e = ac$ gives $b = b(ac)$. By associativity $b(ac) = (ba)c$. Substituting $ba = e$ gives $(ba)c = ec$, and $ec = c$ by the identity law. Chaining the equalities, $b = c$. For the conclusion, let $b$ and $c$ both be inverses of $a$, so $ab = ba = e$ and $ac = ca = e$. Then $ba = e$ and $ac = e$ both hold, so $b = c$ by the first part. Hence an invertible element has exactly one inverse.'
        constraints: 'uniqueness of inverses by inserting the identity and regrouping; concrete inverses, left and right inverses; one proof'
      - id: kp3
        name: "Cancellation"
        key_prerequisites: [binary-operations]
        step_check:
          step: 'Add $-9$ to both sides of $9 + x = 9 + y$'
          question: 'Why is $-9$ added to both sides of $9 + x = 9 + y$?'
          options:
            - 'Because $-9$ is the inverse of $9$, so it removes $9$ from each side'
            - 'Because the equation must be made negative before $x$ and $y$ are compared'
            - 'Because $-9$ is the identity of the group, so it leaves the equation unchanged'
            - 'Because adding a number to the left side alone keeps the equation true'
          answer: 'Because $-9$ is the inverse of $9$, so it removes $9$ from each side'
          why: 'Both sides must receive the same element to keep the equation true. The inverse $-9$ cancels the common summand $9$.'
        exemplars:
          - problem: 'In the group $U(11)$ of units modulo $11$, $4x \equiv 4 \cdot 7 \pmod{11}$ with $1 \le x \le 10$. Find $x$.'
            answer: '7'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The element $4$ has an inverse in the group, so we cancel the common factor $4$ by multiplying both sides by that inverse. This gives $x \equiv 7 \pmod{11}$. Check: with $x = 7$ both sides of the equation are the same product $4 \cdot 7$.'
          - problem: 'In the monoid $\{0, 1, 2, 3, 4, 5\}$ with multiplication modulo $6$, the cancellation law fails for some elements $a$. Find the smallest $a$ in $\{1, 2, 3, 4, 5\}$ for which $a x \equiv a y \pmod 6$ has a solution with $x \ne y$ in $\{0, \ldots, 5\}$.'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'For $a = 1$ the equation $x \equiv y$ forces $x = y$. For $a = 2$ we have $2 \cdot 0 = 0$ and $2 \cdot 3 = 6 \equiv 0$, so $x = 0$ and $y = 3$ are different solutions. Hence the smallest such $a$ is $2$.'
          - problem: 'A shift cipher adds a secret key $k$ to each letter number, modulo $26$. The letter number $8$ is encrypted to $3$. Which letter number is encrypted to $20$?'
            answer: '25'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'From $8 + k \equiv 3 \pmod{26}$ we get $k \equiv 3 - 8 \equiv 21$. Now $x + 21 \equiv 20$ gives $x \equiv 20 - 21 \equiv 25 \pmod{26}$. Check: $25 + 21 = 46 = 26 + 20$.'
          - problem: 'A scrambler multiplies each number of $\{1, \ldots, 10\}$ by a secret nonzero key $k$, modulo $11$. The number $3$ becomes $5$. Which number becomes $10$?'
            answer: '6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'From $3k \equiv 5 \pmod{11}$ and the inverse $4$ of $3$ we get $k \equiv 20 \equiv 9$. Then $9x \equiv 10$ and the inverse $5$ of $9$ give $x \equiv 50 \equiv 6 \pmod{11}$. Check: $9 \cdot 6 = 54 = 4 \cdot 11 + 10$.'
          - problem: 'Sam solves $3x \equiv 3 \cdot 5 \pmod{12}$ by cancelling the factor $3$ and writes $x = 5$. Find the smallest $x$ with $0 \le x \le 11$ that solves the equation.'
            answer: '1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The equation says $3x \equiv 3 \pmod{12}$, so $3(x - 1)$ is a multiple of $12$ and $x - 1$ is a multiple of $4$. The solutions are $x = 1, 5, 9$, and the smallest is $1$. Sam cannot cancel $3$, because $3$ has no inverse modulo $12$.'
          - problem: 'Let $a$, $b$ and $c$ be elements of a group. Does $ab = ac$ imply $b = c$ in every group?'
            answer: 'yes'
            answer_contract: {"kind": "label", "options": [["yes", "it is", "it does", "yes it is", "yes it does", "true", "it is true"], ["no", "it is not", "it does not", "no it is not", "no it does not", "false", "not true"]]}
            solution_sketch: 'Multiply both sides of $ab = ac$ on the left by $a^{-1}$. Associativity and the inverse law give $b = (a^{-1}a)b = (a^{-1}a)c = c$. This works in every group, because every element of a group has an inverse.'
          - problem: 'Does $ab = ac$ imply $b = c$ in every monoid?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "it is", "it does", "yes it is", "yes it does", "true", "it is true"], ["no", "it is not", "it does not", "no it is not", "no it does not", "false", "not true"]]}
            solution_sketch: 'In the monoid of residues modulo $6$ under multiplication, $2 \cdot 0 = 0 = 2 \cdot 3$, but $0 \ne 3$. So cancellation can fail in a monoid, because $2$ has no inverse there.'
          - problem: 'Write the full proof that if $a$, $b$ and $c$ are elements of a group $G$ and $ba = ca$, then $b = c$.'
            answer: 'in a group, ba = ca implies b = c'
            answer_contract: {"kind": "none"}
            solution_sketch: 'Let $G$ be a group with identity $e$ and suppose $ba = ca$. The element $a$ has an inverse $a^{-1}$ with $aa^{-1} = e$. Multiply both sides of $ba = ca$ on the right by $a^{-1}$ to get $(ba)a^{-1} = (ca)a^{-1}$. By associativity, $(ba)a^{-1} = b(aa^{-1}) = be = b$. In the same way $(ca)a^{-1} = c(aa^{-1}) = ce = c$. Hence $b = c$.'
        constraints: 'cancellation by multiplying both sides with an inverse; residues mod n, ciphers, and the failure in monoids; one proof'
    diagnostic_exemplar:
      problem: 'Prove that in any group, $(ab)^{-1} = b^{-1}a^{-1}$.'
      answer: 'Check $(ab)(b^{-1}a^{-1}) = e$.'
      solution_sketch: '$(ab)(b^{-1}a^{-1}) = a(bb^{-1})a^{-1} = aea^{-1} = aa^{-1} = e$, and similarly $(b^{-1}a^{-1})(ab) = e$. By uniqueness of inverses, $(ab)^{-1} = b^{-1}a^{-1}$. $\square$'
    anki_seeds:
      - front: 'The four group axioms?'
        back: 'Closure, associativity, an identity element, and an inverse for every element.'
        type: basic
      - front: 'Inverse of a product $(ab)^{-1}$ in a group?'
        back: '$b^{-1}a^{-1}$ (the order reverses).'
        type: basic

  - id: abelian-groups
    name: "Commutativity and Abelian Groups"
    core: true                 # machinery: "abelian" is used across proofs, abstract-algebra, and category-theory (31+ uses) and was defined nowhere before this topic
    difficulty: 0.66
    drill: false
    answer_kind: proof
    expected_time_secs: 200
    prerequisites:
      - id: groups-intro
        weight: 0.6
        key: true
      - id: binary-operations
        weight: 0.4
        key: true
      - id: function-composition-inverse
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: "The definition, and verifying abelian groups"
        key_prerequisites: [groups-intro, binary-operations]
        step_check:
          step: 'Ordinary addition of integers is commutative, so $a + b = b + a$'
          question: 'Why does the equality $a + b + 3 = b + a + 3$ show that $a * b = b * a$?'
          options:
            - 'The constant $3$ is the identity of this group, so it can be dropped'
            - 'The sides are $a * b$ and $b * a$, and addition commutes'
            - 'Adding $3$ makes every element of the group equal to its own inverse'
            - 'The equality has been checked for the single pair $a = b$ and no other'
          answer: 'The sides are $a * b$ and $b * a$, and addition commutes'
          why: 'By the definition of the operation, $a * b = a + b + 3$ and $b * a = b + a + 3$. Commutative addition makes these equal for every pair $a, b$.'
        exemplars:
          - problem: 'Is the group of nonzero rational numbers under multiplication abelian?'
            answer: 'yes'
            answer_contract: {"kind": "label", "options": [["yes", "it is abelian", "abelian", "it is commutative", "commutative", "yes it is", "the group is abelian", "it is"], ["no", "it is not abelian", "not abelian", "nonabelian", "non-abelian", "it is not commutative", "not commutative", "no it is not"]]}
            solution_sketch: 'For all nonzero rational numbers $a$ and $b$ we have $ab = ba$, because multiplication of rational numbers is commutative. So the group is abelian.'
          - problem: 'On $\mathbb{Z}$ define $a * b = a + b + 3$. This operation makes $\mathbb{Z}$ a group. Find its identity element.'
            answer: '-3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The identity $e$ satisfies $a * e = a$ for every $a$, so $a + e + 3 = a$ and $e = -3$. Check: $-3 * a = -3 + a + 3 = a$.'
          - problem: 'In the group $(\mathbb{Z}, *)$ with $a * b = a + b + 3$ and identity $-3$, find the inverse of $5$.'
            answer: '-11'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'We need $x$ with $5 * x = -3$, so $5 + x + 3 = -3$ and $x = -11$. Check: $5 * (-11) = 5 - 11 + 3 = -3$.'
          - problem: 'Three cards lie in positions $1, 2, 3$ and carry the numbers $1, 2, 3$. Move $A$ swaps the cards in positions $1$ and $2$. Move $B$ swaps the cards in positions $2$ and $3$. Alex performs $A$ and then $B$. In which position is the card numbered $1$ at the end?'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'After $A$ the cards read $2, 1, 3$ from position $1$ to $3$. After $B$ they read $2, 3, 1$, so the card numbered $1$ is in position $3$. Bea, who performs $B$ and then $A$, ends with the cards $3, 1, 2$, and the card numbered $1$ is in position $2$. The order of the moves matters, so this group is not abelian.'
          - problem: 'Is the group of invertible $2 \times 2$ real matrices under multiplication abelian?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "it is abelian", "abelian", "it is commutative", "commutative", "yes it is", "the group is abelian", "it is"], ["no", "it is not abelian", "not abelian", "nonabelian", "non-abelian", "it is not commutative", "not commutative", "no it is not"]]}
            solution_sketch: 'Take $A$ with rows $(1, 1)$ and $(0, 1)$, and $B$ with rows $(1, 0)$ and $(1, 1)$. Both are invertible. Then $AB$ has rows $(2, 1)$ and $(1, 1)$, while $BA$ has rows $(1, 1)$ and $(1, 2)$. Since $AB \ne BA$, the group is not abelian.'
          - problem: 'In the group $(\mathbb{Z}, *)$ with $a * b = a + b + 3$, the element $x$ satisfies $x * 4 = 12$. Find $x$.'
            answer: '5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'By the definition of the operation, $x * 4 = x + 4 + 3 = x + 7$. Setting $x + 7 = 12$ gives $x = 5$. Check: $5 * 4 = 5 + 4 + 3 = 12$.'
          - problem: 'A dial has $12$ positions numbered $0$ to $11$, and turns combine by addition modulo $12$. The dial starts at position $0$. A turn forward by $7$ positions and a turn forward by $9$ positions are made one after the other, the turn by $9$ first. At which position does the dial stand?'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The total turn is $9 + 7 = 16 \equiv 4 \pmod{12}$, so the dial stands at position $4$. The order of the turns does not matter, because addition modulo $12$ is commutative.'
          - problem: 'Write the full proof that the set $\mathbb{Z}$ with the operation $a * b = a + b + 3$ is an abelian group.'
            answer: 'Z with a*b = a+b+3 is abelian group'
            answer_contract: {"kind": "none"}
            solution_sketch: 'Closure: for integers $a$ and $b$, the number $a + b + 3$ is an integer. Associativity: $(a * b) * c = (a + b + 3) + c + 3 = a + b + c + 6$ and $a * (b * c) = a + (b + c + 3) + 3 = a + b + c + 6$, so the two are equal. Identity: put $e = -3$. Then $a * (-3) = a - 3 + 3 = a$ and $(-3) * a = -3 + a + 3 = a$. Inverses: for an integer $a$, put $c = -6 - a$. Then $a * c = a + (-6 - a) + 3 = -3 = e$ and $c * a = (-6 - a) + a + 3 = -3 = e$. So $(\mathbb{Z}, *)$ is a group. Commutativity: $a * b = a + b + 3 = b + a + 3 = b * a$, because addition of integers is commutative. Hence the group is abelian.'
        constraints: 'the definition of abelian and its verification: identities and inverses of a defined operation, abelian or not verdicts, orders of moves; one proof that a defined operation gives an abelian group'
      - id: kp2
        name: "Nonabelian groups"
        key_prerequisites: [function-composition-inverse]
        step_check:
          step: 'The outputs $5x + 3$ and $5x + 15$ differ for every $x$'
          question: 'Why does one pair with different compositions already show that the group is not abelian?'
          options:
            - 'Different outputs show that $f$ and $g$ are not bijections of $\mathbb{R}$'
            - 'Abelian means every composition has one output, and here there are two'
            - 'Abelian needs $fg = gf$ for every pair, so one failure breaks it'
            - 'Different outputs show that the identity function is missing from the group'
          answer: 'Abelian needs $fg = gf$ for every pair, so one failure breaks it'
          why: 'A group is abelian only if every pair of elements commutes. A single pair with $f \circ g \ne g \circ f$ is a complete proof that the group is not abelian.'
        try_first:
          problem: 'In the group of bijections from $\mathbb{R}$ to $\mathbb{R}$ under composition, let $f(x) = x + 2$ and $g(x) = 3x$. What is $(f \circ g)(1) - (g \circ f)(1)$?'
          answer_contract: {"kind": "exact"}
          answer: '-4'
          reveal: 'We get $(f \circ g)(1) = 5$ and $(g \circ f)(1) = 9$, so the difference is $-4$. The two orders give different values, so the pair does not commute, and one such pair is enough to show that a group is not abelian.'
        exemplars:
          - problem: 'In the group of bijections from $\mathbb{R}$ to $\mathbb{R}$ under composition, let $f(x) = x + 3$ and $g(x) = 5x$. Find $(g \circ f)(x)$.'
            answer: '5x + 15'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'By definition, $(g \circ f)(x) = g(f(x)) = g(x + 3) = 5(x + 3) = 5x + 15$. For comparison, $(f \circ g)(x) = f(5x) = 5x + 3$, so the two compositions differ.'
          - problem: 'A student finds that $f(x) = x + 1$ and $g(x) = x + 2$ commute in the group of all bijections of $\mathbb{R}$ under composition, and concludes that the group is abelian. Is the conclusion justified?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["no", "it is not justified", "not justified", "no, it is not justified", "one pair is not enough", "unjustified", "no it is not", "the conclusion is not justified"], ["yes", "it is justified", "justified", "yes it is", "yes, it is justified", "correct", "right", "the conclusion is justified"]]}
            solution_sketch: 'An abelian group needs $ab = ba$ for every pair of elements. Two translations commute, but the pair $x + 3$ and $5x$ does not, since $5x + 15 \ne 5x + 3$. So one commuting pair does not prove that the group is abelian.'
          - problem: 'In the group of permutations of $\{1, 2, 3\}$ under composition, let $f$ swap $1$ and $2$ and fix $3$, and let $g$ swap $2$ and $3$ and fix $1$. Find $(f \circ g)(1)$.'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'We have $(f \circ g)(1) = f(g(1)) = f(1) = 2$. For comparison $(g \circ f)(1) = g(f(1)) = g(2) = 3$, so $f \circ g \ne g \circ f$ and this group is not abelian.'
          - problem: 'In the group of invertible $2 \times 2$ real matrices under multiplication, let $A = \begin{pmatrix}1&1\\0&1\end{pmatrix}$ and $B = \begin{pmatrix}1&0\\1&1\end{pmatrix}$. Compute $AB$.'
            answer: '[[2,1],[1,1]]'
            answer_contract: {"kind": "matrix", "rows": 2, "cols": 2}
            solution_sketch: 'Multiply each row of $A$ by the columns of $B$. The row $(1, 1)$ gives $(2, 1)$ and the row $(0, 1)$ gives $(1, 1)$. So $AB$ has rows $(2, 1)$ and $(1, 1)$, while $BA$ has rows $(1, 1)$ and $(1, 2)$.'
          - problem: 'A robot starts at distance $2$ from a marker. Command $P$ moves it $3$ units farther away. Command $Q$ doubles its distance from the marker. How many units farther from the marker is the robot after doing $P$ and then $Q$ than after doing $Q$ and then $P$?'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'After $P$ and then $Q$ the distance is $(2 + 3) \cdot 2 = 10$. After $Q$ and then $P$ it is $2 \cdot 2 + 3 = 7$. The difference is $10 - 7 = 3$ units, so the order of the commands matters.'
          - problem: 'A shop offers a $10\%$ discount and a coupon worth $5$ dollars. The discount multiplies a price by $0.9$ and the coupon subtracts $5$. An item costs $50$ dollars. How many dollars less does the customer pay if the discount is applied first and the coupon second than if the coupon is applied first and the discount second?'
            answer: '0.5'
            answer_contract: {"kind": "unit", "quantity": "dollar", "unit": "dollar", "allow_omitted": true}
            solution_sketch: 'Discount first gives $50 \cdot 0.9 - 5 = 40$ dollars. Coupon first gives $(50 - 5) \cdot 0.9 = 40.5$ dollars. The difference is $0.5$ dollars, so the order of the two offers matters.'
          - problem: 'In the group of all bijections from $\mathbb{R}$ to $\mathbb{R}$ under composition, do $f(x) = 2x$ and $g(x) = 3x$ commute?'
            answer: 'yes'
            answer_contract: {"kind": "label", "options": [["yes", "they do", "they commute", "yes they do", "yes they commute", "it is", "true"], ["no", "they do not", "they do not commute", "no they do not", "no they do not commute", "it is not", "false"]]}
            solution_sketch: 'We have $(f \circ g)(x) = f(3x) = 6x$ and $(g \circ f)(x) = g(2x) = 6x$ for every real $x$, so $f \circ g = g \circ f$ and the two functions commute. This one pair does not make the group abelian, because the pair $x + 1$ and $2x$ does not commute.'
          - problem: 'Write the full proof that the group of all bijections from $\mathbb{R}$ to $\mathbb{R}$ under composition is not abelian.'
            answer: 'Bij(R) under composition is not abelian'
            answer_contract: {"kind": "none"}
            solution_sketch: 'Let $f(x) = x + 1$ and $g(x) = 2x$. Both are bijections of $\mathbb{R}$: $f$ has the inverse $x - 1$ and $g$ has the inverse $\frac{x}{2}$, so both belong to the group. Compute the two compositions at an arbitrary real $x$. We have $(f \circ g)(x) = f(g(x)) = f(2x) = 2x + 1$. We have $(g \circ f)(x) = g(f(x)) = g(x + 1) = 2(x + 1) = 2x + 2$. At $x = 0$ these give $1$ and $2$, so $f \circ g \ne g \circ f$. Hence two elements of the group do not commute, and the group is not abelian.'
        constraints: 'nonabelian groups: evaluate both orders of a composition or product, one noncommuting pair suffices; contexts of commands and offers; one proof'
      - id: kp3
        name: "Reasoning inside abelian groups"
        key_prerequisites: [groups-intro]
        step_check:
          step: 'Since the group is abelian, $ba = ab$'
          question: 'Why may $ba$ be replaced by $ab$ in the middle of $a(ba)b$?'
          options:
            - 'The abelian hypothesis gives $ba = ab$ for every pair'
            - 'Associativity lets any two neighboring factors trade places'
            - 'The inverse law makes $ba$ and $ab$ both equal to the identity'
            - 'Squaring always makes the order of the factors irrelevant'
          answer: 'The abelian hypothesis gives $ba = ab$ for every pair'
          why: 'Only commutativity swaps the two factors. Associativity moves brackets, but it never changes the order of the factors.'
        exemplars:
          - problem: 'In the abelian group $U(21)$ of units modulo $21$, we have $a^{2} \equiv 16$ and $b^{2} \equiv 4$. Find $(ab)^{2}$ modulo $21$.'
            answer: '1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'In an abelian group $(ab)^{2} = a^{2} b^{2}$. So $(ab)^{2} \equiv 16 \cdot 4 = 64 \equiv 1 \pmod{21}$, since $64 = 3 \cdot 21 + 1$.'
          - problem: 'Is $(ab)^{-1} = a^{-1} b^{-1}$ for all $a$ and $b$ in every abelian group?'
            answer: 'yes'
            answer_contract: {"kind": "label", "options": [["yes", "it is", "it does", "yes it is", "yes it does", "true", "it is true"], ["no", "it is not", "it does not", "no it is not", "no it does not", "false", "not true"]]}
            solution_sketch: 'In any group $(ab)^{-1} = b^{-1} a^{-1}$. In an abelian group $b^{-1} a^{-1} = a^{-1} b^{-1}$, because the two factors commute. So the formula $(ab)^{-1} = a^{-1} b^{-1}$ holds in every abelian group.'
          - problem: 'In the group of bijections of $\mathbb{R}$ under composition, let $f(x) = x + 1$ and $g(x) = 2x$. Sam claims that $(f \circ g)^{2} = f^{2} \circ g^{2}$ and notes that $(f^{2} \circ g^{2})(0) = 2$. What is $(f \circ g)^{2}(0)$?'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'We have $(f \circ g)(x) = f(2x) = 2x + 1$, so $(f \circ g)^{2}(x) = 2(2x + 1) + 1 = 4x + 3$ and $(f \circ g)^{2}(0) = 3$. Sam''s value is $2$, so the claim fails: this group is not abelian, and the law $(ab)^{2} = a^{2} b^{2}$ needs commutativity.'
          - problem: 'A cipher shifts each letter number forward by $5$ places and then by $9$ places, modulo $26$. This double shift is applied $3$ times to a letter. By how many places, from $0$ to $25$, is the letter shifted in total?'
            answer: '16'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The shifts form the abelian group $\mathbb{Z}_{26}$, so the order of the shifts does not matter and $3(5 + 9) = 3 \cdot 5 + 3 \cdot 9$. The total is $3 \cdot 14 = 42 \equiv 16 \pmod{26}$.'
          - problem: 'Sam finds elements $a$ and $b$ of a group $G$ with $(ab)^{2} = a^{2} b^{2}$ and says that $G$ is abelian. Is Sam''s conclusion justified?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["no", "it is not justified", "not justified", "no, it is not justified", "one pair is not enough", "unjustified", "no it is not", "the conclusion is not justified"], ["yes", "it is justified", "justified", "yes it is", "yes, it is justified", "correct", "right", "the conclusion is justified"]]}
            solution_sketch: 'The equation $(ab)^{2} = a^{2}b^{2}$ gives $abab = aabb$, and cancellation gives $ba = ab$. But this concerns the single pair $a, b$. Other pairs in $G$ do not have to commute, so $G$ is not forced to be abelian.'
          - problem: 'In the abelian group $U(11)$, $4^{-1} = 3$ and $5^{-1} = 9$. Find $(4 \cdot 5)^{-1}$ modulo $11$.'
            answer: '5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'In an abelian group $(ab)^{-1} = a^{-1} b^{-1}$. So $(4 \cdot 5)^{-1} = 3 \cdot 9 = 27 \equiv 5 \pmod{11}$. Check: $4 \cdot 5 = 20 \equiv 9$ and $9 \cdot 5 = 45 \equiv 1$.'
          - problem: 'A safe has two dials, with $10$ and $12$ positions. One move turns the first dial forward by $3$ positions and the second dial forward by $8$ positions. Both dials start at $0$, and the move is made $4$ times. Where do the dials stand?'
            answer: '(2, 8)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'The first dial turns by $4 \cdot 3 = 12 \equiv 2 \pmod{10}$ and the second by $4 \cdot 8 = 32 \equiv 8 \pmod{12}$. The group is $\mathbb{Z}_{10} \times \mathbb{Z}_{12}$, which is abelian, so the dials stand at $(2, 8)$.'
          - problem: 'Write the full proof that a group $G$ is abelian if and only if $(ab)^{2} = a^{2} b^{2}$ for all $a, b \in G$, where $x^{2}$ means $xx$.'
            answer: 'G abelian iff (ab)^2 = a^2 b^2 for all'
            answer_contract: {"kind": "none"}
            solution_sketch: '($\Rightarrow$) Suppose $G$ is abelian and let $a, b \in G$. Then $(ab)^{2} = abab = a(ba)b$. Since $ba = ab$, this equals $a(ab)b$. By associativity $a(ab)b = (aa)(bb) = a^{2} b^{2}$. So $(ab)^{2} = a^{2} b^{2}$. ($\Leftarrow$) Suppose $(ab)^{2} = a^{2} b^{2}$ for all $a, b \in G$, and let $a, b \in G$. Then $abab = aabb$. Multiply on the left by $a^{-1}$: $a^{-1}(abab) = a^{-1}(aabb)$. Associativity and $a^{-1}a = e$ give $bab = abb$. Multiply on the right by $b^{-1}$: $(bab)b^{-1} = (abb)b^{-1}$, which gives $ba = ab$. Since $a$ and $b$ were arbitrary, $G$ is abelian.'
        constraints: 'reasoning inside abelian groups: the laws $(ab)^{n} = a^{n} b^{n}$ and $(ab)^{-1} = a^{-1} b^{-1}$, what a single commuting pair does not prove; one iff proof'
    diagnostic_exemplar:
      problem: 'Prove that a group $G$ is abelian if and only if $(ab)^{-1} = a^{-1}b^{-1}$ for all $a, b \in G$.'
      answer: 'In any group $(ab)^{-1} = b^{-1}a^{-1}$, since $(ab)(b^{-1}a^{-1}) = a(bb^{-1})a^{-1} = aa^{-1} = e$ and inverses are unique. ($\Rightarrow$) If $G$ is abelian then $b^{-1}a^{-1} = a^{-1}b^{-1}$, so $(ab)^{-1} = a^{-1}b^{-1}$. ($\Leftarrow$) Suppose $(ab)^{-1} = a^{-1}b^{-1}$ for all $a, b$. Comparing with the general formula gives $b^{-1}a^{-1} = a^{-1}b^{-1}$ for all $a, b$. Given arbitrary $x, y \in G$, apply this with $a = x^{-1}$ and $b = y^{-1}$ (every element is the inverse of its own inverse): $yx = xy$. Hence $G$ is abelian.'
      solution_sketch: 'Start from the socks-shoes formula $(ab)^{-1} = b^{-1}a^{-1}$; the hypothesis then says inverses commute, and every element of a group is an inverse.'
    anki_seeds:
      - front: 'A group is abelian when...'
        back: '$ab = ba$ for all elements $a, b$ (the operation is commutative; named after Niels Henrik Abel).'
        type: basic
      - front: 'A standard example of a nonabelian group?'
        back: 'Bijections of a set with $\ge 3$ elements under composition (e.g. two overlapping swaps of $\{1,2,3\}$ do not commute).'
        type: basic
      - front: 'In an abelian group, $(ab)^{-1} = ?$'
        back: '$a^{-1}b^{-1}$ — the general rule $b^{-1}a^{-1}$, but the order no longer matters.'
        type: basic

  - id: checking-homomorphisms
    name: "Checking the Homomorphism Condition"
    core: true
    difficulty: 0.64
    drill: false
    answer_kind: numeric
    expected_time_secs: 160
    prerequisites:
      - id: groups-intro
        weight: 0.5
        key: true
      - id: functions-formal-definition
        weight: 0.2
      - id: exponential-functions
        weight: 0.2
        key: false
    knowledge_points:
      - id: kp1
        name: "Verifying the condition"
        key_prerequisites: [groups-intro]
        step_check:
          step: 'The exponent law says $5^{x+y} = 5^{x} \cdot 5^{y}$ for all real $x, y$'
          question: 'Why do the two sides $5^{x+y}$ and $5^{x} \cdot 5^{y}$ agree for all real $x, y$?'
          options:
            - 'Both sides are equal to $5^{xy}$ for every pair of real numbers'
            - 'The exponent law turns a sum in the exponent into a product of powers'
            - 'The two sides agree only for the pairs that were checked by hand'
            - 'The base $5$ is the identity element of the group $(\mathbb{R}^{>0}, \cdot)$'
          answer: 'The exponent law turns a sum in the exponent into a product of powers'
          why: 'The exponent law $b^{x+y} = b^{x} b^{y}$ holds for all real $x$ and $y$. It is exactly the condition that the sum $x + y$ in the source goes to a product in the target.'
        exemplars:
          - problem: 'Is $\varphi(x) = x^{2}$ a homomorphism from the group $(\mathbb{R} \setminus \{0\}, \cdot)$ of nonzero real numbers under multiplication to the group $(\mathbb{R}^{>0}, \cdot)$ of positive real numbers under multiplication?'
            answer: 'yes'
            answer_contract: {"kind": "label", "options": [["yes", "it is", "it does", "yes it is", "yes it does", "true", "it is true"], ["no", "it is not", "it does not", "no it is not", "no it does not", "false", "not true"]]}
            solution_sketch: 'We compare $\varphi(xy) = (xy)^{2} = x^{2} y^{2}$ with $\varphi(x)\varphi(y) = x^{2} y^{2}$. The two sides agree for all nonzero $x$ and $y$, and $x^{2} > 0$ lies in the target. So $\varphi$ is a homomorphism.'
          - problem: 'For which integer $c$ is the map $\varphi(n) = 4n + c$ a homomorphism from $(\mathbb{Z}, +)$ to $(\mathbb{Z}, +)$?'
            answer: '0'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A homomorphism of additive groups sends $0$ to $0$, so $\varphi(0) = c = 0$ is necessary. For $c = 0$ we have $\varphi(m + n) = 4m + 4n = \varphi(m) + \varphi(n)$. So $c = 0$ is the only value.'
          - problem: 'For which nonzero real number $k$ is $\varphi(x) = kx$ a homomorphism from $(\mathbb{R} \setminus \{0\}, \cdot)$ to itself?'
            answer: '1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The condition is $\varphi(xy) = \varphi(x)\varphi(y)$, that is $kxy = kx \cdot ky = k^{2}xy$. Dividing by $xy$ gives $k = k^{2}$, so $k = 1$ since $k \ne 0$. For $k = 1$ the map is the identity, which is a homomorphism.'
          - problem: 'A currency converter turns $x$ euros into $\psi(x) = 0.9x + 2$ dollars, where $2$ dollars is a fixed fee. A customer converts two bills of $10$ and $20$ euros separately and adds the results. The customer also converts the total of $30$ euros at once. By how many dollars do the two results differ?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Converting separately gives $\psi(10) + \psi(20) = 11 + 20 = 31$ dollars. Converting the total gives $\psi(30) = 0.9 \cdot 30 + 2 = 29$ dollars. The results differ by $2$ dollars, the fee that is paid twice in the first method. So $\psi$ does not preserve addition.'
          - problem: 'A bacteria colony triples every day. Its growth factor after $d$ days is $\varphi(d) = 3^{d}$, a map from the additive group $(\mathbb{Z}, +)$ of days to the multiplicative group $(\mathbb{R}^{>0}, \cdot)$. The colony grows for $2$ days and then for $5$ more days. By what total factor does it grow?'
            answer: '2187'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The factors multiply: $\varphi(2)\varphi(5) = 3^{2} \cdot 3^{5} = 3^{7} = 2187$. This equals $\varphi(2 + 5) = \varphi(7)$, which is the homomorphism condition for adding days.'
          - problem: 'A homomorphism $\varphi$ from $(\mathbb{Z}, +)$ to $(\mathbb{Z}, +)$ satisfies $\varphi(1) = 7$. Find the integer $n$ with $\varphi(n) = 63$.'
            answer: '9'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'By the homomorphism condition $\varphi(n) = \varphi(1 + 1 + \cdots + 1) = n\varphi(1) = 7n$. Setting $7n = 63$ gives $n = 9$.'
          - problem: 'Is $\varphi(x) = x^{2}$ a homomorphism from $(\mathbb{R}, +)$ to $(\mathbb{R}, +)$?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "it is", "it does", "yes it is", "yes it does", "true", "it is true"], ["no", "it is not", "it does not", "no it is not", "no it does not", "false", "not true"]]}
            solution_sketch: 'Here the condition is $\varphi(x + y) = \varphi(x) + \varphi(y)$. For $x = y = 1$ the left side is $\varphi(2) = 4$ and the right side is $1 + 1 = 2$. Since $4 \ne 2$, the map is not a homomorphism.'
        constraints: 'check $\varphi(x * y) = \varphi(x) \cdot \varphi(y)$ with the operation of each side named; verdicts, parameters that make a map a homomorphism, contexts of conversions and growth'
      - id: kp2
        name: "Refuting with a counterexample"
        key_prerequisites: [groups-intro]
        step_check:
          step: 'a homomorphism must map it to $0$'
          question: 'Why must a homomorphism from $(\mathbb{Z}, +)$ to itself send $0$ to $0$?'
          options:
            - 'Every map between two copies of $\mathbb{Z}$ fixes $0$, since $0$ is the smallest number'
            - 'Because adding $0$ to $\varphi(0)$ would otherwise change the value of $\varphi(1)$'
            - 'Because $0$ is the only integer whose image the formula of the map can compute'
            - 'Because $\varphi(0) = \varphi(0 + 0) = \varphi(0) + \varphi(0)$ forces $\varphi(0) = 0$'
          answer: 'Because $\varphi(0) = \varphi(0 + 0) = \varphi(0) + \varphi(0)$ forces $\varphi(0) = 0$'
          why: 'The condition applied to the pair $(0, 0)$ gives $\varphi(0) = \varphi(0) + \varphi(0)$. Subtracting $\varphi(0)$ from both sides leaves $\varphi(0) = 0$.'
        try_first:
          problem: 'Let $\varphi(n) = 2n + 5$ be a map from $(\mathbb{Z}, +)$ to $(\mathbb{Z}, +)$. What is $\varphi(0)$?'
          answer_contract: {"kind": "exact"}
          answer: '5'
          reveal: 'The value is $5$, not $0$. A homomorphism between additive groups must send $0$ to $0$, so this map is not a homomorphism, and no further test is needed.'
        exemplars:
          - problem: 'Is $\varphi(n) = 3n + 1$ a homomorphism from $(\mathbb{Z}, +)$ to $(\mathbb{Z}, +)$?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "it is", "it does", "yes it is", "yes it does", "true", "it is true"], ["no", "it is not", "it does not", "no it is not", "no it does not", "false", "not true"]]}
            solution_sketch: 'A homomorphism must send the identity $0$ to the identity $0$. But $\varphi(0) = 1 \ne 0$. For a concrete pair, $\varphi(2 + 3) = 16$ while $\varphi(2) + \varphi(3) = 7 + 10 = 17$.'
          - problem: 'The map $\varphi(x) = 2^{x}$ goes from $(\mathbb{R}, +)$ to $(\mathbb{R}, +)$. Find the smallest positive integer $m$ for which $\varphi(m + m) \ne \varphi(m) + \varphi(m)$.'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'We compare $\varphi(2m) = 2^{2m} = 4^{m}$ with $2\varphi(m) = 2 \cdot 2^{m} = 2^{m+1}$. For $m = 1$ both sides are $4$, so $m = 1$ is not a counterexample. For $m = 2$ the left side is $16$ and the right side is $8$. So the smallest value is $m = 2$.'
          - problem: 'Sam tests $\varphi(n) = n^{3}$ from $(\mathbb{Z}, +)$ to $(\mathbb{Z}, +)$ on the pair $(0, 2)$. Sam finds $\varphi(0 + 2) = 8 = \varphi(0) + \varphi(2)$ and says that $\varphi$ is a homomorphism. Ana tests the pair $(1, 2)$. By how much do $\varphi(1 + 2)$ and $\varphi(1) + \varphi(2)$ differ?'
            answer: '18'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'We have $\varphi(1 + 2) = 27$ and $\varphi(1) + \varphi(2) = 1 + 8 = 9$. The difference is $27 - 9 = 18$. Sam''s pair contains the identity $0$, where the condition always holds, so it proves nothing.'
          - problem: 'For $\varphi(n) = n^{2}$ from $(\mathbb{Z}, +)$ to $(\mathbb{Z}, +)$, find a positive integer $m$ for which $\varphi(m + 1) \ne \varphi(m) + \varphi(1)$.'
            answer: '3'
            answer_contract: {"kind": "property", "check": "integer_in_range", "args": {"min": 1}}
            solution_sketch: 'We have $\varphi(m + 1) = m^{2} + 2m + 1$ and $\varphi(m) + \varphi(1) = m^{2} + 1$. They differ by $2m$, which is not $0$ for any positive $m$. For $m = 3$ we get $16$ and $10$.'
          - problem: 'A courier charges $c(w) = 5 + 2w$ dollars to ship a parcel of $w$ kilograms. A parcel of $3$ kilograms and a parcel of $4$ kilograms are shipped separately, and then together as one parcel of $7$ kilograms. How many dollars does the customer save by shipping them together?'
            answer: '5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Separately the cost is $c(3) + c(4) = 11 + 13 = 24$ dollars. Together it is $c(7) = 5 + 14 = 19$ dollars. The saving is $24 - 19 = 5$ dollars, the fixed charge that is paid once instead of twice. So $c(3 + 4) \ne c(3) + c(4)$, and $c$ is not a homomorphism.'
          - problem: 'The area of a square with side $s$ is $A(s) = s^{2}$. Two ropes of lengths $3$ and $5$ meters are tied end to end into one rope. By how many square meters does the area of the square on the long rope exceed the total area of the squares on the two separate ropes?'
            answer: '30'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The long rope has length $3 + 5 = 8$, so its square has area $A(8) = 64$. The two separate squares have total area $A(3) + A(5) = 9 + 25 = 34$. The difference is $64 - 34 = 30$ square meters, so $A(3 + 5) \ne A(3) + A(5)$.'
          - problem: 'Is $\varphi(n) = -3n$ a homomorphism from $(\mathbb{Z}, +)$ to $(\mathbb{Z}, +)$?'
            answer: 'yes'
            answer_contract: {"kind": "label", "options": [["yes", "it is", "it does", "yes it is", "yes it does", "true", "it is true"], ["no", "it is not", "it does not", "no it is not", "no it does not", "false", "not true"]]}
            solution_sketch: 'The map sends $0$ to $0$, as a homomorphism of additive groups must. For all integers $m$ and $n$ we have $\varphi(m + n) = -3(m + n) = -3m - 3n = \varphi(m) + \varphi(n)$. So the condition holds for every pair, and $\varphi$ is a homomorphism.'
        constraints: 'refute with one concrete pair or the identity filter; find a counterexample value; contexts of costs and areas'
      - id: kp3
        name: "Between different structures"
        key_prerequisites: [groups-intro]
        step_check:
          step: 'Compute the left side using the source operation'
          question: 'Why is the left side $\varphi(m + n)$ formed with addition and the right side $\varphi(m) \cdot \varphi(n)$ with multiplication?'
          options:
            - 'Addition is used for integers, and multiplication is used for real numbers in general'
            - 'The left side belongs to the target group, and the right side to the source group'
            - 'The source group adds, and the target group $(\mathbb{R}^{>0}, \cdot)$ multiplies'
            - 'The map $2^{n}$ is defined through products, so both sides of the condition need one'
          answer: 'The source group adds, and the target group $(\mathbb{R}^{>0}, \cdot)$ multiplies'
          why: 'The inputs $m$ and $n$ are combined in the source group, which uses $+$. The outputs are combined in the target group, which uses $\cdot$.'
        exemplars:
          - problem: 'Is $\varphi(x) = \ln|x|$ a homomorphism from the group $(\mathbb{R} \setminus \{0\}, \cdot)$ of nonzero reals under multiplication to the group $(\mathbb{R}, +)$ of reals under addition?'
            answer: 'yes'
            answer_contract: {"kind": "label", "options": [["yes", "it is", "it does", "yes it is", "yes it does", "true", "it is true"], ["no", "it is not", "it does not", "no it is not", "no it does not", "false", "not true"]]}
            solution_sketch: 'The condition pairs the source operation, multiplication, with the target operation, addition: $\varphi(xy) = \ln|xy| = \ln|x| + \ln|y| = \varphi(x) + \varphi(y)$. This holds for all nonzero $x$ and $y$, so $\varphi$ is a homomorphism.'
          - problem: 'A homomorphism $\varphi$ from $(\mathbb{R}, +)$ to $(\mathbb{R}^{>0}, \cdot)$ satisfies $\varphi(2) = 9$. Find $\varphi(6)$.'
            answer: '729'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Since $6 = 2 + 2 + 2$, the condition gives $\varphi(6) = \varphi(2)\varphi(2)\varphi(2) = 9^{3} = 729$. A sum in the source becomes a product in the target.'
          - problem: 'Is the identity map $\varphi(x) = x$ a homomorphism from $(\mathbb{R}^{>0}, \cdot)$ to $(\mathbb{R}, +)$?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "it is", "it does", "yes it is", "yes it does", "true", "it is true"], ["no", "it is not", "it does not", "no it is not", "no it does not", "false", "not true"]]}
            solution_sketch: 'The condition is $\varphi(xy) = \varphi(x) + \varphi(y)$. For $x = 3$ and $y = 5$ the left side is $\varphi(15) = 15$ and the right side is $3 + 5 = 8$. Since $15 \ne 8$, the map is not a homomorphism.'
          - problem: 'The gain of an amplifier that multiplies signal power by a factor $r$ is $10 \log_{10} r$ decibels. Two amplifiers in series multiply the power by $10$ and by $100$. What is the total gain of the two amplifiers in decibels?'
            answer: '30'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The gains are $10 \log_{10} 10 = 10$ and $10 \log_{10} 100 = 20$ decibels. Gains add when factors multiply, because $\log_{10}(rs) = \log_{10} r + \log_{10} s$. The total is $10 + 20 = 30$ decibels, which matches the combined factor $1000$.'
          - problem: 'The gain of an amplifier that multiplies signal power by a factor $r$ is $10 \log_{10} r$ decibels. A chain of amplifiers has a total gain of $50$ decibels. One stage multiplies the power by $1000$. By what factor do the remaining stages together multiply the power?'
            answer: '100'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The stage with factor $1000$ has gain $10 \log_{10} 1000 = 30$ decibels. Gains add, so the other stages need $50 - 30 = 20$ decibels. A gain of $20$ decibels is the factor $10^{2} = 100$.'
          - problem: 'A homomorphism $\varphi$ from $(\mathbb{Z}, +)$ to $(\mathbb{R}^{>0}, \cdot)$ satisfies $\varphi(1) = 2$. Find $\varphi(-3)$.'
            answer: '1/8'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'First $\varphi(3) = \varphi(1)^{3} = 8$. A homomorphism sends inverses to inverses, so $\varphi(-3) = \varphi(3)^{-1} = \frac{1}{8}$. Check: $\varphi(3)\varphi(-3) = \varphi(0) = 1$.'
          - problem: 'Sam says that $\psi(x) = x^{2}$ is a homomorphism from $(\mathbb{R}, +)$ to $(\mathbb{R}^{>0}, \cdot)$, because $\psi(2 + 2) = 16 = \psi(2)\psi(2)$. By how much do $\psi(1 + 3)$ and $\psi(1)\psi(3)$ differ?'
            answer: '7'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'We have $\psi(1 + 3) = \psi(4) = 16$ and $\psi(1)\psi(3) = 1 \cdot 9 = 9$. The difference is $16 - 9 = 7$. Sam''s pair $(2, 2)$ is a coincidence: $(x + y)^{2} = x^{2}y^{2}$ holds only for special pairs.'
        constraints: 'the two operations differ between source and target; verdicts, values forced by the condition, contexts of decibels'
    diagnostic_exemplar:
      problem: 'Decide, with justification: (a) is $\varphi(n) = n \bmod 3$ a homomorphism $(\mathbb{Z}, +) \to (\mathbb{Z}_3, +)$? (b) is $\psi(x) = x^2$ a homomorphism $(\mathbb{R}, +) \to (\mathbb{R}, +)$?'
      answer_contract: {kind: none}
      answer: '(a) Yes: reduction mod $3$ satisfies $(m + n) \bmod 3 = (m \bmod 3) + (n \bmod 3)$ in $\mathbb{Z}_3$, which is exactly the homomorphism condition — note the operation is ordinary addition on the left and addition mod $3$ on the right. (b) No: the condition would read $(x + y)^2 = x^2 + y^2$, which fails at $x = y = 1$ ($4 \ne 2$); the cross term $2xy$ spoils it.'
      solution_sketch: 'Test $\varphi(x \ast y) = \varphi(x) \ast \varphi(y)$ with the correct operation on each side; one numerical counterexample refutes.'
    anki_seeds:
      - front: 'Fast first check when testing whether $\varphi$ is a group homomorphism?'
        back: 'Whether $\varphi(e_G) = e_H$ — if not, it cannot be a homomorphism.'
        type: basic
      - front: 'Is $x \mapsto x + c$ ($c \ne 0$) a homomorphism of $(\mathbb{R}, +)$?'
        back: 'No — it sends $0$ to $c \ne 0$.'
