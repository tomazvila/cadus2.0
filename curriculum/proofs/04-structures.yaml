    knowledge_points:
      - id: kp1
        name: 'The homomorphism condition'
        key_prerequisites: [groups-intro]
        step_check:
          step: 'Note the domain operation is $+$ and the codomain operation is $\cdot$'
          question: 'Why does the left side of the condition use $+$ and the right side use $\cdot$?'
          options:
            - 'Both sides of the condition always use the operation of the domain'
            - 'The sum is formed in the domain and the product of images in the codomain'
            - 'The operation changes from $+$ to $\cdot$ each time the map $\varphi$ is applied'
            - 'The symbol $\cdot$ is the usual sign on the right side of every equation'
          answer: 'The sum is formed in the domain and the product of images in the codomain'
          why: 'The inputs $x$ and $y$ live in the domain, so they are combined by the domain operation $+$; the outputs live in the codomain, so they are combined by $\cdot$.'
        try_first:
          problem: 'Let $\varphi : (\mathbb{R}, +) \to (\mathbb{R}, +)$ be given by $\varphi(x) = x^2$. What is the value of $\varphi(2+3) - (\varphi(2) + \varphi(3))$?'
          answer_contract: {"kind": "exact"}
          answer: '12'
          reveal: 'The difference is $12$, not $0$, so squaring does not preserve addition. A homomorphism must make $\varphi(x+y)$ and $\varphi(x)+\varphi(y)$ equal for every pair, so one failing pair is enough to refuse it.'
        exemplars:
          - problem: 'Let $\varphi : (\mathbb{R}, +) \to (\mathbb{R}^{>0}, \cdot)$ be defined by $\varphi(x) = 3^{x}$. Is $\varphi$ a homomorphism?'
            answer: 'yes'
            answer_contract: {"kind": "label", "options": [["yes", "it is a homomorphism", "is a homomorphism", "homomorphism"], ["no", "it is not a homomorphism", "is not a homomorphism", "not a homomorphism"]]}
            solution_sketch: 'The domain operation is addition and the codomain operation is multiplication, so we compare $\varphi(x+y)$ with $\varphi(x)\varphi(y)$. We have $\varphi(x+y) = 3^{x+y} = 3^x \cdot 3^y = \varphi(x)\varphi(y)$ for all real $x$ and $y$, so $\varphi$ is a homomorphism.'
          - problem: 'A clock face shows the hours $0, 1, \dots, 11$. After $n$ hours that start at $0$, the hour hand shows $\varphi(n) = n \bmod 12$. This defines a homomorphism $\varphi : (\mathbb{Z}, +) \to (\mathbb{Z}_{12}, +)$. If $\varphi(a) = 5$ and $\varphi(b) = 9$, what is $\varphi(a+b)$?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A homomorphism satisfies $\varphi(a+b) = \varphi(a) + \varphi(b)$, where the sum on the right is the sum in $\mathbb{Z}_{12}$. We get $5 + 9 = 14 = 12 + 2$, so $\varphi(a+b) = 2$.'
          - problem: 'An amplifier multiplies the strength of a signal by a factor $x > 0$. Its gain in bels is $\varphi(x) = \log_{10} x$, so $\varphi$ is a homomorphism from $(\mathbb{R}^{>0}, \cdot)$ to $(\mathbb{R}, +)$. A signal passes through one amplifier of gain $2$ bels and then through one of gain $3$ bels. By what factor is the signal strength multiplied in all?'
            answer: '100000'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Passing through two amplifiers in a row multiplies the factors, and the gains add: $\varphi(ab) = \varphi(a) + \varphi(b) = 2 + 3 = 5$ bels. A gain of $5$ bels means $\log_{10}$ of the factor is $5$, so the factor is $10^5 = 100000$.'
          - problem: 'Let $\varphi : (\mathbb{R}^{>0}, \cdot) \to (\mathbb{R}, +)$ be given by $\varphi(x) = \log_3 x$. What is $\varphi(9 \cdot 243)$?'
            answer: '7'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The map $\varphi$ turns a product into a sum, so $\varphi(9 \cdot 243) = \varphi(9) + \varphi(243)$. Since $9 = 3^2$ and $243 = 3^5$, this sum is $2 + 5 = 7$, which agrees with $9 \cdot 243 = 2187 = 3^7$.'
          - problem: 'Sam wants to show that $\varphi(x) = x^2$ is a homomorphism from $(\mathbb{R}, +)$ to $(\mathbb{R}, +)$. Sam tests only the pair $x = 0$, $y = 5$ and finds $\varphi(0 + 5) = \varphi(0) + \varphi(5)$. Sam concludes that $\varphi$ is a homomorphism. What is the value of $\varphi(1 + 2) - \varphi(1) - \varphi(2)$, which shows that Sam is wrong?'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'One pair that works proves nothing, because the condition must hold for all pairs. For the pair $1, 2$ we get $\varphi(3) - \varphi(1) - \varphi(2) = 9 - 1 - 4 = 4$, which is not $0$, so $\varphi$ is not a homomorphism.'
          - problem: 'Is the map $\varphi : (\mathbb{Z}, +) \to (\mathbb{Z}, +)$ defined by $\varphi(n) = 2n + 1$ a homomorphism?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "it is a homomorphism", "is a homomorphism", "homomorphism"], ["no", "it is not a homomorphism", "is not a homomorphism", "not a homomorphism"]]}
            solution_sketch: 'Both operations are addition, so the condition is $\varphi(a+b) = \varphi(a) + \varphi(b)$. For $a = b = 1$ we have $\varphi(2) = 5$, but $\varphi(1) + \varphi(1) = 3 + 3 = 6$. The two sides differ, so $\varphi$ is not a homomorphism.'
          - problem: 'Write the full proof that for every real number $c$ the function $\varphi_c : \mathbb{R} \to \mathbb{R}^{>0}$ defined by $\varphi_c(x) = e^{cx}$ is a homomorphism from $(\mathbb{R}, +)$ to $(\mathbb{R}^{>0}, \cdot)$, and that $\varphi_c$ is injective if and only if $c \neq 0$.'
            answer: 'e^(cx) is a hom; injective iff c != 0'
            answer_contract: {"kind": "none"}
            solution_sketch: 'Proof. Fix a real number $c$. The map lands in the target, because $e^{cx} > 0$ for every real $x$. The domain operation is addition and the codomain operation is multiplication, so we must show $\varphi_c(x+y) = \varphi_c(x)\,\varphi_c(y)$ for all real $x, y$. Let $x$ and $y$ be arbitrary real numbers. Then $\varphi_c(x+y) = e^{c(x+y)} = e^{cx + cy} = e^{cx} \cdot e^{cy} = \varphi_c(x)\,\varphi_c(y)$, where the third equality is the law $e^{s+t} = e^s e^t$. Hence $\varphi_c$ is a homomorphism. Now we prove the biconditional. ($\Rightarrow$) Suppose $\varphi_c$ is injective. If $c = 0$, then $\varphi_0(1) = e^0 = 1 = \varphi_0(0)$ although $1 \neq 0$, so $\varphi_0$ is not injective, a contradiction. Hence $c \neq 0$. ($\Leftarrow$) Suppose $c \neq 0$ and $\varphi_c(a) = \varphi_c(b)$. Then $e^{ca} = e^{cb}$. Taking natural logarithms gives $ca = cb$, and dividing by $c \neq 0$ gives $a = b$, so $\varphi_c$ is injective. Therefore $\varphi_c$ is a homomorphism for every real $c$, and it is injective exactly when $c \neq 0$. $\square$'
        constraints: 'Maps between different operations: the condition phi(x * y) = phi(x) . phi(y); verdict items, values from the condition, one written proof; contexts with clocks and amplifier gain'
      - id: kp2
        name: 'Homomorphisms preserve identity'
        key_prerequisites: [groups-intro]
        step_check:
          step: 'since $d \neq 0$, multiply both sides on the left by $d^{-1}$'
          question: 'Why can we cancel $d$ from the equation $d = d\,d$ in this step?'
          options:
            - 'Any element of a group can be cancelled from the left of an equation without a reason'
            - 'The element $d$ is a unit of $G$, so it has an inverse inside $G$'
            - 'The element $d$ lies in $H$, and every element of the group $H$ has an inverse'
            - 'The equation $d = d\,d$ already says that $d$ equals $1$ in the group $H$'
          answer: 'The element $d$ lies in $H$, and every element of the group $H$ has an inverse'
          why: 'The element $d$ belongs to the group $H$, where every element has an inverse $d^{-1}$, so multiplying $d = d\,d$ by $d^{-1}$ leaves the identity of $H$ equal to $d$.'
        exemplars:
          - problem: 'The map $\varphi : (\mathbb{R}, +) \to (\mathbb{R}^{>0}, \cdot)$ defined by $\varphi(x) = 7^{x}$ is a homomorphism. What is $\varphi(0)$, the image of the identity of $(\mathbb{R}, +)$?'
            answer: '1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The identity of $(\mathbb{R}, +)$ is $0$, and a homomorphism sends the identity to the identity of the codomain. The identity of $(\mathbb{R}^{>0}, \cdot)$ is $1$, and indeed $7^0 = 1$.'
          - problem: 'The gain of a device that multiplies the signal strength by a factor $x > 0$ is $\varphi(x) = \log_{10} x$ bels, and $\varphi$ is a homomorphism from $(\mathbb{R}^{>0}, \cdot)$ to $(\mathbb{R}, +)$. A plain wire leaves the signal strength unchanged. What is the gain of the wire?'
            answer: '0'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A wire multiplies the signal strength by $1$, which is the identity of $(\mathbb{R}^{>0}, \cdot)$. A homomorphism sends the identity to the identity of $(\mathbb{R}, +)$, which is $0$. Check: $\log_{10} 1 = 0$, so the gain is $0$ bels.'
          - problem: 'The map $\psi : (\mathbb{Z}, +) \to (U(7), \cdot)$ defined by $\psi(n) = 3^n \bmod 7$ is a homomorphism into the group of units modulo $7$. What is $\psi(0)$?'
            answer: '1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The identity of $(\mathbb{Z}, +)$ is $0$, so $\psi(0)$ is the identity of $U(7)$ under multiplication modulo $7$. That identity is $1$, which agrees with $3^0 = 1$.'
          - problem: 'The map $k : (\mathbb{R}, +) \to (\mathbb{R}, +)$ converts a temperature in degrees Celsius to kelvin by $k(x) = x + 273$. A homomorphism between these groups must send the identity $0$ to the identity $0$. What is $k(0)$?'
            answer: '273'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'We have $k(0) = 0 + 273 = 273$. This is not the identity $0$ of the codomain, so $k$ cannot be a homomorphism, even though $k$ is a bijection.'
          - problem: 'Let $\varphi$ be a homomorphism from a group $G$ to $(\mathbb{Z}_{10}, +)$, and let $d = \varphi(e_G)$. Applying $\varphi$ to $e_G e_G = e_G$ gives $d + d = d$ in $\mathbb{Z}_{10}$. What is $d$?'
            answer: '0'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Subtracting $d$ from both sides of $d + d = d$ in $\mathbb{Z}_{10}$ gives $d = 0$. We can test this by trying all of $0, 1, \dots, 9$: only $d = 0$ satisfies $2d \equiv d \pmod{10}$.'
          - problem: 'Sam says that the zero map $\varphi(n) = 0$ from $(\mathbb{Z}, +)$ to $(\mathbb{Z}, +)$ is not a homomorphism, because it sends $1$ to $0$ and not to $1$. Is the zero map a homomorphism?'
            answer: 'yes'
            answer_contract: {"kind": "label", "options": [["yes", "it is a homomorphism", "is a homomorphism", "homomorphism"], ["no", "it is not a homomorphism", "is not a homomorphism", "not a homomorphism"]]}
            solution_sketch: 'Both operations are addition, and $\varphi(a+b) = 0 = 0 + 0 = \varphi(a) + \varphi(b)$ for all integers $a, b$, so the zero map is a homomorphism. Sam mixed up the identities: the identity of $(\mathbb{Z}, +)$ is $0$, so sending $1$ to $0$ is no problem, and $\varphi(0) = 0$ holds.'
          - problem: 'Write the full proof that if $\varphi : G \to H$ is a homomorphism of groups with identities $e_G$ and $e_H$, then $\varphi(e_G) = e_H$, and use this to prove that no homomorphism $\psi : (\mathbb{Z}, +) \to (\mathbb{Z}, +)$ satisfies $\psi(n) = n + 1$ for all $n \in \mathbb{Z}$.'
            answer: 'phi(e_G) = e_H; n -> n+1 not a hom'
            answer_contract: {"kind": "none"}
            solution_sketch: 'Proof. Let $d = \varphi(e_G)$. Since $e_G$ is the identity of $G$, we have $e_G e_G = e_G$. Applying $\varphi$ and using that $\varphi$ preserves products gives $d = \varphi(e_G) = \varphi(e_G e_G) = \varphi(e_G)\varphi(e_G) = d\,d$. The element $d$ belongs to the group $H$, so it has an inverse $d^{-1}$ in $H$. Multiplying $d = d\,d$ on the left by $d^{-1}$ gives $d^{-1}d = d^{-1}(d\,d)$, that is $e_H = (d^{-1}d)\,d = e_H\,d = d$. Hence $\varphi(e_G) = e_H$. For the second claim, suppose, for contradiction, that $\psi : (\mathbb{Z}, +) \to (\mathbb{Z}, +)$ is a homomorphism with $\psi(n) = n + 1$ for all $n$. The identity of $(\mathbb{Z}, +)$ is $0$ in domain and codomain, so the first part gives $\psi(0) = 0$. But the formula gives $\psi(0) = 0 + 1 = 1 \neq 0$. This is a contradiction, so no such homomorphism exists. $\square$'
        constraints: 'Identity preservation: phi(e_G) = e_H from e_G e_G = e_G and cancellation; values, verdicts, one written proof; contexts with temperature scales and amplifier gain'
      - id: kp3
        name: 'Homomorphisms preserve inverses and powers'
        key_prerequisites: [function-composition-inverse]
        step_check:
          step: 'Both products equal $e_H$, and an inverse in a group is unique'
          question: 'Why do the two equations $\varphi(a)\varphi(a^{-1}) = e_H$ and $\varphi(a^{-1})\varphi(a) = e_H$ prove $\varphi(a^{-1}) = \varphi(a)^{-1}$?'
          options:
            - 'A product that equals $e_H$ forces both factors to equal $e_H$ as well'
            - 'The homomorphism condition says that $\varphi(a^{-1})$ equals $\varphi(a)$ itself'
            - 'The map $\varphi$ is defined to send every inverse to an inverse'
            - 'Only $\varphi(a)^{-1}$ multiplies with $\varphi(a)$ to give $e_H$ in a group'
          answer: 'Only $\varphi(a)^{-1}$ multiplies with $\varphi(a)$ to give $e_H$ in a group'
          why: 'In a group the inverse of an element is the only element that multiplies with it to give the identity, so $\varphi(a^{-1})$ must be $\varphi(a)^{-1}$.'
        exemplars:
          - problem: 'Let $\varphi : (\mathbb{R}^{>0}, \cdot) \to (\mathbb{R}, +)$ be a homomorphism, and let $a > 0$ with $\varphi(a) = 3$. What is $\varphi(1/a)$?'
            answer: '-3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A homomorphism preserves inverses. The inverse of $a$ in $(\mathbb{R}^{>0}, \cdot)$ is $1/a$, and the inverse of $3$ in $(\mathbb{R}, +)$ is $-3$, so $\varphi(1/a) = -3$. Check: $\varphi(a) + \varphi(1/a) = \varphi(1) = 0$.'
          - problem: 'Let $\varphi : (\mathbb{Z}, +) \to (\mathbb{Z}_{10}, +)$ be a homomorphism with $\varphi(1) = 3$. What is $\varphi(7)$ in $\mathbb{Z}_{10}$?'
            answer: '1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The integer $7$ is the power $1 + 1 + \cdots + 1$ with $7$ terms, so $\varphi(7) = 7\varphi(1) = 21$. In $\mathbb{Z}_{10}$ we have $21 = 20 + 1$, so $\varphi(7) = 1$.'
          - problem: 'An amplifier multiplies the strength of a signal by $100$, which is a gain of $2$ bels, where the gain of a factor $x$ is $\log_{10} x$. A second device divides the signal strength by $100$ and so undoes the amplifier. What is the gain of the second device in bels?'
            answer: '-2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The second device multiplies the strength by $1/100$, the inverse of $100$ in $(\mathbb{R}^{>0}, \cdot)$. A homomorphism sends an inverse to the inverse, so its gain is $-2$ bels. Check: $\log_{10}(1/100) = -2$, and $2 + (-2) = 0$ gives a total factor of $1$.'
          - problem: 'A cable weakens a signal and has a gain of $-0.3$ bels. A signal passes through $4$ identical cables in a row. What is the total gain in bels?'
            answer: '-1.2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Passing through $4$ cables multiplies the strength by the same factor $x$ four times, and the gain of $x^4$ is $4$ times the gain of $x$. The total gain is $4 \cdot (-0.3) = -1.2$ bels.'
          - problem: 'Let $\varphi : (\mathbb{Z}, +) \to (\mathbb{Z}_{12}, +)$ be a homomorphism with $\varphi(1) = 5$. What is $\varphi(-1)$ in $\mathbb{Z}_{12}$?'
            answer: '7'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A homomorphism sends the inverse of $1$ to the inverse of $\varphi(1)$, so $\varphi(-1) = -5$. In $\mathbb{Z}_{12}$ we have $-5 \equiv 7$, because $5 + 7 = 12$.'
          - problem: 'Sam claims that every homomorphism $\varphi$ satisfies $\varphi(x^{-1}) = \varphi(x)$. Test the map $\varphi(n) = 2n$ from $(\mathbb{Z}, +)$ to $(\mathbb{Z}, +)$ at $x = 3$. Is $\varphi(x^{-1}) = \varphi(x)$ true for this $x$?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "it is true", "true", "they are equal"], ["no", "it is not true", "not true", "false", "they are not equal"]]}
            solution_sketch: 'In $(\mathbb{Z}, +)$ the inverse of $3$ is $-3$. We have $\varphi(-3) = -6$ and $\varphi(3) = 6$, which differ, so the equation is false. The correct rule is $\varphi(x^{-1}) = \varphi(x)^{-1}$, here $-6$.'
          - problem: 'Write the full proof that if $\varphi : G \to H$ is a homomorphism of groups, then $\varphi(x^{-1}) = \varphi(x)^{-1}$ for every $x \in G$ and $\varphi(x^n) = \varphi(x)^n$ for every integer $n \geq 1$, and deduce that if $x^k = e_G$ for a positive integer $k$, then $\varphi(x)^k = e_H$.'
            answer: 'inverses and powers are preserved'
            answer_contract: {"kind": "none"}
            solution_sketch: 'Proof. First we recall that $\varphi(e_G) = e_H$. Put $d = \varphi(e_G)$. From $e_G e_G = e_G$ we get $d = \varphi(e_G e_G) = d\,d$, and multiplying on the left by $d^{-1}$ in $H$ gives $e_H = d$. Inverses. Let $x \in G$. Then $\varphi(x)\varphi(x^{-1}) = \varphi(x x^{-1}) = \varphi(e_G) = e_H$ and $\varphi(x^{-1})\varphi(x) = \varphi(x^{-1}x) = \varphi(e_G) = e_H$. So $\varphi(x^{-1})$ is an inverse of $\varphi(x)$ in $H$. An element of a group has only one inverse, so $\varphi(x^{-1}) = \varphi(x)^{-1}$. Powers. We prove $\varphi(x^n) = \varphi(x)^n$ by induction on $n \geq 1$. Base case $n = 1$: $\varphi(x^1) = \varphi(x) = \varphi(x)^1$. Inductive hypothesis: assume $\varphi(x^k) = \varphi(x)^k$ for some integer $k \geq 1$. Then $x^{k+1} = x^k x$, so $\varphi(x^{k+1}) = \varphi(x^k)\,\varphi(x) = \varphi(x)^k\,\varphi(x) = \varphi(x)^{k+1}$, where the middle step is the inductive hypothesis. By induction the formula holds for all $n \geq 1$. Consequence. If $x^k = e_G$, then $\varphi(x)^k = \varphi(x^k) = \varphi(e_G) = e_H$. $\square$'
        constraints: 'Inverses and powers: phi(x^-1) = phi(x)^-1 and phi(x^n) = phi(x)^n by induction; values, verdicts, one written proof; contexts with amplifier gains that need division and multiplication'
    diagnostic_exemplar:
      problem: 'Let $\varphi : (\mathbb{Z}, +) \to (\mathbb{Z}, +)$ be a homomorphism with $\varphi(1) = 3$. Prove $\varphi(n) = 3n$ for all $n \in \mathbb{Z}$.'
      answer: 'Additivity forces $\varphi(n) = n\varphi(1) = 3n$.'
      solution_sketch: 'For $n \ge 0$, $\varphi(n) = \varphi(1 + \cdots + 1) = n\varphi(1) = 3n$ by induction; $\varphi(0) = 0$ and $\varphi(-n) = -\varphi(n) = -3n$. So $\varphi(n) = 3n$ for all $n$. $\square$'
    anki_seeds:
      - front: 'Definition of a group homomorphism?'
        back: 'A map $\varphi : G \to H$ with $\varphi(xy) = \varphi(x)\varphi(y)$ for all $x, y \in G$.'
        type: basic
      - front: 'What do homomorphisms do to identity and inverses?'
        back: '$\varphi(e_G) = e_H$ and $\varphi(x^{-1}) = \varphi(x)^{-1}$.'
        type: basic
      - front: 'An isomorphism is...'
        back: 'a bijective homomorphism (its inverse map is then also a homomorphism).'
        type: basic

  - id: finite-cardinality-bijections
    name: "Finite Cardinality via Bijections"
    core: false                # supplemental: head of the terminal cardinality branch
    difficulty: 0.62
    drill: false
    answer_kind: proof
    expected_time_secs: 190
    prerequisites:
      - id: functions-injective-surjective
        weight: 0.5
        key: true
      - id: pigeonhole-principle
        weight: 0.4
        key: true
      - id: counting-functions
        weight: 0.2
    knowledge_points:
      - id: kp1
        name: 'Size as a bijection with {1, ..., n}'
        key_prerequisites: [functions-injective-surjective]
        step_check:
          step: 'suppose $f(a) = f(b)$, that is $2a - 1 = 2b - 1$'
          question: 'Why does the check of injectivity start from the assumption $f(a) = f(b)$?'
          options:
            - 'It shows that every element of the target set is an output of $f$'
            - 'It gives the formula of $f$ from two sample inputs $a$ and $b$'
            - 'Equal outputs can come only from equal inputs, so no output repeats'
            - 'It holds for every pair $a$ and $b$, so the check is already finished'
          answer: 'Equal outputs can come only from equal inputs, so no output repeats'
          why: 'Injective means that two inputs with the same output must be the same input, so we assume equal outputs and derive $a = b$.'
        try_first:
          problem: 'How many integers are there from $20$ to $60$, counting both $20$ and $60$?'
          answer_contract: {"kind": "exact"}
          answer: '41'
          reveal: 'The map $k \mapsto k + 19$ pairs $\{1, 2, \dots, 41\}$ with $\{20, 21, \dots, 60\}$, so there are $41$ integers, not $60 - 20 = 40$. A set has $n$ elements when a bijection from $\{1, \dots, n\}$ exists, and the formula of the bijection shows $n$.'
        exemplars:
          - problem: 'Write the formula $f(k)$ of the increasing bijection $f$ from $\{1, 2, \dots, 13\}$ onto $\{5, 6, 7, \dots, 17\}$.'
            answer: 'k + 4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The bijection must send $1$ to $5$, and each step in $k$ moves one step in the target, so $f(k) = k + 4$. Check: $f(1) = 5$ and $f(13) = 17$, and the values $5, 6, \dots, 17$ are all used once.'
          - problem: 'The seats of a theatre row are numbered $12, 13, 14, \dots, 47$. How many seats are in the row?'
            answer: '36'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The map $k \mapsto k + 11$ is a bijection from $\{1, 2, \dots, 36\}$ onto the seat numbers $12, \dots, 47$, because $1 \mapsto 12$ and $36 \mapsto 47$. So the row has $36$ seats.'
          - problem: 'A road has kilometre posts at $3, 7, 11, 15, \dots, 95$ kilometres, each $4$ kilometres after the previous post. How many posts does the road have?'
            answer: '24'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The $k$th post stands at $f(k) = 4k - 1$ kilometres, and $f$ is a bijection from the post numbers onto the positions. The last post is at $95 = 4k - 1$, so $k = 24$, and there are $24$ posts.'
          - problem: 'For a positive integer $n$ let $S = \{8, 11, 14, \dots, 3n + 5\}$, where each number is $3$ more than the one before it. Write the formula $f(k)$ of the increasing bijection $f$ from $\{1, 2, \dots, n\}$ onto $S$.'
            answer: '3k + 5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The first element of $S$ is $8$ and each step adds $3$, so $f(k) = 8 + 3(k - 1) = 3k + 5$. Check: $f(1) = 8$ and $f(n) = 3n + 5$, the last element of $S$.'
          - problem: 'Sam claims that $f(k) = k + 2$ is a bijection from $\{1, 2, 3\}$ onto $\{3, 4, 6\}$. Which element of $\{3, 4, 6\}$ is not equal to $f(k)$ for any $k$?'
            answer: '6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The values of $f$ are $f(1) = 3$, $f(2) = 4$ and $f(3) = 5$. The element $6$ is not among them, so $f$ is not onto $\{3, 4, 6\}$ and Sam is wrong.'
          - problem: 'Does the formula $f(k) = 3k - 1$ define a bijection from $\{1, 2, \dots, 10\}$ onto $\{2, 5, 8, \dots, 29\}$?'
            answer: 'yes'
            answer_contract: {"kind": "label", "options": [["yes", "it is a bijection", "is a bijection", "bijection", "it is"], ["no", "it is not a bijection", "is not a bijection", "not a bijection", "it is not"]]}
            solution_sketch: 'The formula gives $f(1) = 2$ and $f(10) = 29$, and each step in $k$ adds $3$, so the values are exactly $2, 5, 8, \dots, 29$ with no repeats. It is injective because $3a - 1 = 3b - 1$ forces $a = b$, so $f$ is a bijection.'
          - problem: 'Write the full proof that for every positive integer $n$ the set $S_n = \{5k + 2 : k \in \mathbb{Z},\ 1 \leq k \leq n\}$ has exactly $n$ elements.'
            answer: '|S_n| = n, via f(k) = 5k + 2'
            answer_contract: {"kind": "none"}
            solution_sketch: 'Proof. A set has exactly $n$ elements when there is a bijection from $\{1, 2, \dots, n\}$ onto it. Define $f : \{1, 2, \dots, n\} \to S_n$ by $f(k) = 5k + 2$. This is a function into $S_n$, because $f(k)$ has the form $5k + 2$ with $1 \leq k \leq n$, which is the defining property of $S_n$. Injective: suppose $f(a) = f(b)$ for some $a, b \in \{1, \dots, n\}$. Then $5a + 2 = 5b + 2$. Subtracting $2$ and dividing by $5$ gives $a = b$. Surjective: let $s \in S_n$. By the definition of $S_n$ there is an integer $k$ with $1 \leq k \leq n$ and $s = 5k + 2$, so $s = f(k)$. Hence $f$ is a bijection from $\{1, \dots, n\}$ onto $S_n$, and $S_n$ has exactly $n$ elements. $\square$'
        constraints: 'Size as a bijection with {1, ..., n}: explicit shift and arithmetic-progression bijections, counting contexts, verdicts, one written proof'
      - id: kp2
        name: 'Bijections and matching sizes'
        key_prerequisites: [pigeonhole-principle]
        step_check:
          step: 'A bijection between $\{1, \dots, m\}$ and $\{1, \dots, n\}$ pairs each of the $m$ inputs with a distinct one of the $n$ outputs, so $m = n$'
          question: 'Why does a bijection from $\{1, \dots, m\}$ onto $\{1, \dots, n\}$ force $m = n$?'
          options:
            - 'Every bijection of two sets of numbers is the identity map, so $m = n$'
            - 'One-to-one gives $m \le n$ and onto gives $n \le m$, so $m = n$'
            - 'The two sets are finite, and all finite sets have the same size'
            - 'A bijection adds one to each input, so the sizes differ by one'
          answer: 'One-to-one gives $m \le n$ and onto gives $n \le m$, so $m = n$'
          why: 'Distinct inputs need distinct outputs, so $m \le n$, and every output needs an input, so $n \le m$; together these give $m = n$.'
        exemplars:
          - problem: 'Forty-three passengers board a bus that has $40$ seats. Is it possible to give every passenger a different seat?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "it is possible", "possible"], ["no", "it is not possible", "not possible", "impossible"]]}
            solution_sketch: 'Giving each passenger a seat is a function from the $43$ passengers to the $40$ seats, and different seats means the function is injective. An injective function from a finite set into a smaller finite set does not exist, by the pigeonhole principle. So it is not possible.'
          - problem: 'How many injective functions are there from $\{1, 2, 3\}$ to $\{a, b, c, d, e\}$?'
            answer: '60'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The image of $1$ can be any of the $5$ elements, the image of $2$ any of the $4$ remaining elements, and the image of $3$ any of the $3$ remaining ones. The count is $5 \cdot 4 \cdot 3 = 60$.'
          - problem: 'Eight students are each given one of $10$ lockers, and no two students share a locker. In how many ways can the lockers be given out?'
            answer: '1814400'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Assigning lockers is an injective function from the $8$ students to the $10$ lockers. The first student has $10$ choices, the next $9$, and so on down to $3$ choices for the eighth, so the count is $10 \cdot 9 \cdots 3 = 1814400$.'
          - problem: 'Let $A$ and $B$ be finite sets that have the same number of elements, and let $f : A \to B$ be a surjective function. Is $f$ injective?'
            answer: 'yes'
            answer_contract: {"kind": "label", "options": [["yes", "it is injective", "is injective", "injective"], ["no", "it is not injective", "is not injective", "not injective"]]}
            solution_sketch: 'Suppose $f$ were not injective. Then two elements of $A$ share an image, so $f(A)$ has fewer than $|A|$ elements. Since $f$ is surjective, $f(A) = B$ has $|A|$ elements, so $|B| < |A|$, which contradicts $|A| = |B|$. So $f$ is injective.'
          - problem: 'Sam says that a function $g : \{1, 2, \dots, 6\} \to \{1, 2, \dots, 6\}$ with $g(1) = g(2)$ can still be onto. What is the largest possible number of elements of the image $g(\{1, 2, \dots, 6\})$ for such a $g$?'
            answer: '5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The six inputs give at most six values, but the inputs $1$ and $2$ give the same value, so there are at most $5$ different values. The image has at most $5$ elements, and $5 < 6$, so $g$ is not onto and Sam is wrong.'
          - problem: 'Let $A$ and $B$ be finite sets with an injective function from $A$ to $B$ and an injective function from $B$ to $A$. If $A$ has $8$ elements, how many elements does $B$ have?'
            answer: '8'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The first injection gives $|A| \le |B|$, so $|B| \ge 8$. The second gives $|B| \le |A| = 8$. Together $|B| = 8$.'
          - problem: 'Write the full proof that if $A$ and $B$ are finite sets with $|A| = |B| = n$ and $f : A \to B$ is injective, then $f$ is surjective.'
            answer: 'injective f: A -> B, |A|=|B| => onto'
            answer_contract: {"kind": "none"}
            solution_sketch: 'Proof. Let $f : A \to B$ be injective with $|A| = |B| = n$. Let $f(A) = \{f(a) : a \in A\}$ be the image. The function $a \mapsto f(a)$ from $A$ onto $f(A)$ is surjective by the definition of $f(A)$ and injective because $f$ is, so it is a bijection from $A$ onto $f(A)$. Hence $|f(A)| = |A| = n$. Suppose, for contradiction, that $f$ is not surjective. Then there is an element $b \in B$ with $b \notin f(A)$, so the set $B \setminus f(A)$ is nonempty and has at least $1$ element. The sets $f(A)$ and $B \setminus f(A)$ are disjoint and their union is $B$, so $|B| = |f(A)| + |B \setminus f(A)| \geq n + 1$. But $|B| = n$, a contradiction. Hence $f$ is surjective. $\square$'
        constraints: 'Injections, surjections and sizes of finite sets: pigeonhole verdicts, counting injective functions, one written proof; contexts with seats and lockers'
      - id: kp3
        name: 'Cardinality arithmetic'
        key_prerequisites: [functions-injective-surjective]
        step_check:
          step: 'no value of $f$ equals a value of $g$ because $A \cap B = \varnothing$'
          question: 'Why does the injectivity check of the combined map $h$ need $A \cap B = \varnothing$?'
          options:
            - 'Without it, $f$ and $g$ would not be functions on their own sets'
            - 'Without it, the index sets $\{1, 2, 3\}$ and $\{1, 2\}$ would overlap'
            - 'Without it, the map $h$ would not be defined on every element of $A \cup B$ at once'
            - 'Without it, some $f(i)$ could equal some $g(j)$, and $h$ would repeat'
          answer: 'Without it, some $f(i)$ could equal some $g(j)$, and $h$ would repeat'
          why: 'If $A$ and $B$ shared an element $c$, then $c = f(i) = g(j)$ for some $i, j$, and $h$ would send two different inputs to $c$.'
        exemplars:
          - problem: 'Let $A = \{3, 7, 11\}$ and $B = \{2, 5\}$. How many elements does $A \cup B$ have?'
            answer: '5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The sets $A$ and $B$ have no common element, so a bijection from $\{1, 2, 3, 4, 5\}$ lists the three elements of $A$ first and the two elements of $B$ next. So $|A \cup B| = 3 + 2 = 5$.'
          - problem: 'Let $A = \{1, 2, 3, 4, 5, 6\}$ and $B = \{4, 5, 6, 7, 8, 9\}$. How many elements does $A \cup B$ have?'
            answer: '9'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The sets overlap in the three elements $4, 5, 6$, so the sum $6 + 6 = 12$ counts them twice. The union is $\{1, \dots, 9\}$, which has $9$ elements, and $9 = 12 - 3$.'
          - problem: 'In a school, $18$ students are in the chess club and $14$ are in the choir. Exactly $6$ students are in both. How many students are in at least one of the two?'
            answer: '26'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Adding $18 + 14 = 32$ counts the $6$ students who are in both groups twice. Subtracting them once gives $32 - 6 = 26$ students.'
          - problem: 'A cafe menu has $4$ starters and $6$ main courses. A meal is one starter and one main course. How many different meals are possible?'
            answer: '24'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A meal is an ordered pair (starter, main course), so the set of meals is $A \times B$ with $|A| = 4$ and $|B| = 6$. Each of the $4$ starters pairs with $6$ mains, and $4 \cdot 6 = 24$.'
          - problem: 'Let $A = \{1, 2, 3\}$ and $B = \{3, 4\}$, with $f(i) = i$ for $i = 1, 2, 3$ and $g(j) = j + 2$ for $j = 1, 2$. Define $h : \{1, 2, 3, 4, 5\} \to A \cup B$ by listing the values of $f$ and then the values of $g$. Is $h$ injective?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "it is injective", "is injective", "injective"], ["no", "it is not injective", "is not injective", "not injective"]]}
            solution_sketch: 'The list of values is $h(1), \dots, h(5) = 1, 2, 3, 3, 4$. The value $3$ appears twice, at $h(3)$ and $h(4)$, so $h$ is not injective. The reason is that $A$ and $B$ share the element $3$.'
          - problem: 'Sam says that $|A \cup B| = |A| + |B|$ for $A = \{1, 2, 3\}$ and $B = \{3, 4\}$. Which element is counted twice in Sam''s sum?'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'We have $|A| + |B| = 3 + 2 = 5$, but $A \cup B = \{1, 2, 3, 4\}$ has only $4$ elements. The element $3$ lies in both sets, so Sam counts it twice.'
          - problem: 'A hall has $56$ seats in a rectangular grid of $8$ rows with the same number of seats in every row. How many seats are in each row?'
            answer: '7'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The seats form a product set (rows) $\times$ (seats per row), so $56 = 8 \cdot n$. We need division, not multiplication: $n = 56 / 8 = 7$ seats in each row.'
          - problem: 'Write the full proof that if $A$ and $B$ are finite sets with $A \cap B = \varnothing$, $|A| = m$ and $|B| = n$, then $|A \cup B| = m + n$.'
            answer: 'A, B disjoint => |A u B| = m + n'
            answer_contract: {"kind": "none"}
            solution_sketch: 'Proof. By the definition of size there are bijections $f : \{1, \dots, m\} \to A$ and $g : \{1, \dots, n\} \to B$. Define $h : \{1, \dots, m+n\} \to A \cup B$ by $h(i) = f(i)$ if $1 \leq i \leq m$, and $h(i) = g(i - m)$ if $m + 1 \leq i \leq m + n$. In the second case $1 \leq i - m \leq n$, so $g(i - m)$ is defined, and $h$ takes values in $A \cup B$. Injective: suppose $h(i) = h(j)$. If $i, j \leq m$, then $f(i) = f(j)$, so $i = j$ because $f$ is injective. If $i, j > m$, then $g(i - m) = g(j - m)$, so $i - m = j - m$ and $i = j$. If $i \leq m < j$, then $h(i) \in A$ and $h(j) \in B$, which cannot be equal because $A \cap B = \varnothing$; so this case does not occur, and the case $j \leq m < i$ is the same with $i$ and $j$ exchanged. Surjective: let $z \in A \cup B$. If $z \in A$, then $z = f(i)$ for some $i \leq m$, so $z = h(i)$. If $z \in B$, then $z = g(j)$ for some $1 \leq j \leq n$, and $m + 1 \leq m + j \leq m + n$ with $h(m + j) = g(j) = z$. Hence $h$ is a bijection, and $|A \cup B| = m + n$. $\square$'
        constraints: 'Cardinality of unions and products: build the new bijection from given ones; counts of unions, products and quotients, verdicts, one written proof; contexts with clubs, menus and seat grids'
    diagnostic_exemplar:
      problem: 'Let $A = \{10, 11, \dots, 99\}$ and $B = \{200, 201, \dots, 209\}$. Prove that $|A| = 90$ and that $|A \cup B| = 100$.'
      answer: 'The map $k \mapsto k + 9$ sends $\{1, \dots, 90\}$ into $A$; it is injective (adding $9$ is) and onto ($a \in A$ equals $(a-9) + 9$ with $1 \le a - 9 \le 90$), so it is a bijection and $|A| = 90$. Likewise $k \mapsto k + 199$ is a bijection $\{1, \dots, 10\} \to B$, so $|B| = 10$. The sets are disjoint, since every element of $A$ is at most $99$ and every element of $B$ is at least $200$. Concatenating the two counting bijections gives $h : \{1, \dots, 100\} \to A \cup B$ with $h(j) = j + 9$ for $1 \le j \le 90$ and $h(j) = j + 109$ for $91 \le j \le 100$ (so $h(91) = 200$ and $h(100) = 209$); $h$ is a bijection, hence $|A \cup B| = 100 = |A| + |B|$.'
      solution_sketch: 'Exhibit a shift bijection from an initial segment for each set, then glue the two bijections — legitimate because the sets are disjoint.'
    anki_seeds:
      - front: '"$A$ has $n$ elements" formally means...'
        back: 'there is a bijection $\{1, 2, \dots, n\} \to A$.'
        type: basic
      - front: 'For finite sets, an injection $A \to B$ exists iff...'
        back: '$|A| \le |B|$.'
        type: basic

  - id: infinite-sets
    name: "Infinite Sets"
    core: false                # supplemental: cardinality branch
    difficulty: 0.66
    drill: false
    answer_kind: proof
    expected_time_secs: 210
    prerequisites:
      - id: finite-cardinality-bijections
        weight: 0.5
        key: true
      - id: proof-by-contradiction
        weight: 0.4
        key: true
    knowledge_points:
      - id: kp1
        name: 'Finite vs infinite; subsets and supersets'
        key_prerequisites: [finite-cardinality-bijections]
        step_check:
          step: 'Since $B \subseteq C$ and $C$ is finite, $B$ is finite'
          question: 'Why does this step show that $B$ is finite?'
          options:
            - 'The set $B$ contains $C$, so $B$ has at least as many elements as $C$'
            - 'Every subset of a finite set is finite, and $B$ is a subset of $C$'
            - 'The hypothesis says that $A$ is infinite, so $B$ must be finite'
            - 'Finite sets stay finite when they are made larger by new elements'
          answer: 'Every subset of a finite set is finite, and $B$ is a subset of $C$'
          why: 'We use the fact that a subset of a finite set is finite: $B \subseteq C$ and $C$ is finite, so $B$ is finite.'
        try_first:
          problem: 'Let $A$ be a subset of the set $\{1, 2, \dots, 30\}$. What is the largest possible number of elements of $A$?'
          answer_contract: {"kind": "exact"}
          answer: '30'
          reveal: 'The set $A$ can be all of $\{1, \dots, 30\}$, so $30$ is the largest size. A subset of a finite set is always finite and never larger than the set, and this is the fact that the contrapositive uses.'
        exemplars:
          - problem: 'Let $B$ be a finite set and let $A$ be a subset of $B$. Is $A$ finite or infinite?'
            answer: 'finite'
            answer_contract: {"kind": "label", "options": [["finite", "it is finite", "a is finite", "is finite"], ["infinite", "it is infinite", "is infinite", "a is infinite"]]}
            solution_sketch: 'A subset of a finite set is finite: if $B$ has $n$ elements, then $A$ has at most $n$ elements. So $A$ is finite.'
          - problem: 'Sam claims that every subset of $\mathbb{N} = \{1, 2, 3, \dots\}$ is infinite. Sam is wrong, because some subsets are finite. How many elements does the smallest subset of $\mathbb{N}$ have?'
            answer: '0'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The empty set is a subset of $\mathbb{N}$ and has $0$ elements. It is finite, so the claim fails: a subset of an infinite set need not be infinite. The contrapositive rule goes the other way, because a superset of an infinite set is infinite.'
          - problem: 'A school has $12$ classrooms, and $9$ of them have both a projector and a whiteboard. Let $B$ be the set of classrooms that have a projector. What is the largest possible number of elements of $B$?'
            answer: '12'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The set $B$ is a subset of the set of all $12$ classrooms, so it has at most $12$ elements. It has at least $9$ elements, and $12$ is possible if every classroom has a projector. So the largest possible size is $12$.'
          - problem: 'The set of all prime numbers is infinite. Let $S$ be the set of all positive integers that are not perfect squares. Is $S$ finite or infinite?'
            answer: 'infinite'
            answer_contract: {"kind": "label", "options": [["finite", "it is finite", "s is finite", "is finite"], ["infinite", "it is infinite", "is infinite", "s is infinite"]]}
            solution_sketch: 'No prime number is a perfect square, so the set $P$ of primes is a subset of $S$. A set that contains an infinite set is infinite, for otherwise $P$ would be a subset of a finite set and so finite. Hence $S$ is infinite.'
          - problem: 'Let $A \subseteq B \subseteq C$, where $C$ has $20$ elements and $A$ has $14$ elements. What is the smallest possible number of elements of $B$?'
            answer: '14'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Since $A \subseteq B$, the set $B$ has at least as many elements as $A$, so at least $14$. The value $14$ occurs when $B = A$, and then $A \subseteq B \subseteq C$ still holds. So the smallest size is $14$.'
          - problem: 'Let $E = \{2, 4, 6, 8, \dots\}$ be the set of positive even numbers. What is the largest positive integer $m$ for which $E \subseteq \{m, m+1, m+2, \dots\}$?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Every element of $E$ is at least $2$, so $E \subseteq \{2, 3, 4, \dots\}$, and $m = 2$ works. For $m = 3$ the element $2$ of $E$ is missing from the superset, so $2$ is the largest value. Since $E$ is infinite, the superset $\{2, 3, 4, \dots\}$ is infinite as well.'
          - problem: 'Write the full proof that if $A$ and $B$ are sets and $A \cup B$ is infinite, then $A$ is infinite or $B$ is infinite. You may use that every subset of a finite set is finite, and that $|X \cup Y| = |X| + |Y|$ for disjoint finite sets $X$ and $Y$.'
            answer: 'A u B infinite => A or B infinite'
            answer_contract: {"kind": "none"}
            solution_sketch: 'Proof. We prove the contrapositive: if $A$ and $B$ are both finite, then $A \cup B$ is finite. Suppose $A$ and $B$ are finite, with $|A| = m$ and $|B| = n$. Every element of $A \cup B$ is either in $A$ or in $B \setminus A$, so $A \cup B = A \cup (B \setminus A)$, and the sets $A$ and $B \setminus A$ are disjoint. The set $B \setminus A$ is a subset of the finite set $B$, so it is finite, say with $r$ elements, and $r \leq n$. For disjoint finite sets the size of the union is the sum of the sizes, so $|A \cup B| = m + r \leq m + n$. Hence $A \cup B$ is finite. This proves the contrapositive, so if $A \cup B$ is infinite, then $A$ is infinite or $B$ is infinite. $\square$'
        constraints: 'Subsets and supersets of finite and infinite sets: subset-of-finite fact, contrapositive; counting bounds, verdicts, one written proof; contexts with classrooms and primes'
      - id: kp2
        name: 'N is infinite'
        key_prerequisites: [proof-by-contradiction]
        step_check:
          step: 'For every $i$ we have $f(i) \le M < M + 3$, so $M + 3 \neq f(i)$'
          question: 'Why is $M + 3$ different from every value $f(i)$?'
          options:
            - 'The value $M + 3$ is a multiple of $3$, but the values $f(i)$ are not'
            - 'The map $f$ is injective, so it cannot take the value $M + 3$'
            - 'All the values $f(i)$ are smaller than $M$, and $M + 3$ is larger'
            - 'The value $M$ is the largest on the list, and $M + 3$ is above it'
          answer: 'The value $M$ is the largest on the list, and $M + 3$ is above it'
          why: 'Each value $f(i)$ is at most $M$, and $M + 3 > M$, so $M + 3$ cannot equal any $f(i)$; it is an element of $S$ that the list misses.'
        exemplars:
          - problem: 'A raffle has sold the tickets numbered $7$, $19$, $4$ and $11$. The shop wants a ticket number that is certainly different from every sold number. What is the smallest number that is larger than all of them?'
            answer: '20'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The largest sold number is $M = 19$. Every sold number is at most $19$, so the number $M + 1 = 20$ is different from all of them. It is the smallest number larger than all the sold numbers.'
          - problem: 'Suppose the positive multiples of $5$ could be written as a finite list whose greatest member is $35$. Which multiple of $5$, the smallest one, would be missing from the list?'
            answer: '40'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The next multiple of $5$ after $35$ is $35 + 5 = 40$. It is a positive multiple of $5$, and it is larger than every member of the list, so the list misses it. That contradicts the assumption that the list is complete.'
          - problem: 'Is the set of positive multiples of $4$ finite or infinite?'
            answer: 'infinite'
            answer_contract: {"kind": "label", "options": [["finite", "it is finite", "s is finite", "is finite"], ["infinite", "it is infinite", "is infinite", "s is infinite"]]}
            solution_sketch: 'Suppose the set were finite, with greatest member $M$. Then $M + 4$ is also a positive multiple of $4$ and is larger than $M$, which contradicts the choice of $M$. So the set is infinite.'
          - problem: 'Sam argues that the natural numbers are infinite because the largest number $M$ in a finite list is a natural number that is missing from the list. Sam is wrong, since $M$ is on the list. For the list $2, 9, 5$, what is the smallest natural number larger than all its entries, which really is missing?'
            answer: '10'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The largest entry is $M = 9$, and $9$ is on the list. The number $M + 1 = 10$ is larger than every entry, so it cannot be on the list. This is the correct escape element, and it is the smallest natural number larger than all the entries.'
          - problem: 'A ticket machine prints tickets whose numbers are the positive multiples of $4$ in order: $4, 8, 12, \dots$. The machine stops after printing $25$ tickets. What is the smallest multiple of $4$ for which no ticket was printed?'
            answer: '104'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The $25$th ticket carries the number $4 \cdot 25 = 100$, which is the greatest printed number. The next multiple of $4$ is $100 + 4 = 104$, and no ticket carries it. So $104$ is the answer.'
          - problem: 'Can a function $f : \{1, 2, \dots, 50\} \to \mathbb{N}$ be onto $\mathbb{N} = \{1, 2, 3, \dots\}$?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "it can", "can be onto"], ["no", "it cannot", "it can not", "cannot", "not possible"]]}
            solution_sketch: 'The list $f(1), \dots, f(50)$ is finite, so it has a largest value $M$. The number $M + 1$ is a natural number, and it is larger than every $f(i)$, so $f$ does not take the value $M + 1$. So $f$ cannot be onto.'
          - problem: 'Write the full proof that if $d$ is a positive integer and $S$ is a nonempty set of integers such that $x + d \in S$ whenever $x \in S$, then $S$ is infinite. Deduce that the set of all positive multiples of $7$ is infinite.'
            answer: 'x in S => x+d in S makes S infinite'
            answer_contract: {"kind": "none"}
            solution_sketch: 'Proof. Suppose, for contradiction, that $S$ is finite. A finite nonempty set of integers has a largest element, so let $M$ be the largest element of $S$. Because $M \in S$, the hypothesis gives $M + d \in S$. But $d \geq 1$, so $M + d > M$, and this contradicts the choice of $M$ as the largest element of $S$. Hence $S$ is not finite, that is, $S$ is infinite. For the deduction, let $T = \{7k : k \text{ a positive integer}\}$. The set $T$ is nonempty, since $7 \in T$. If $x \in T$, then $x = 7k$ for some positive integer $k$, and $x + 7 = 7(k + 1)$ with $k + 1$ a positive integer, so $x + 7 \in T$. By the first part with $d = 7$, the set $T$ is infinite. $\square$'
        constraints: 'Natural numbers and their infinite subsets are infinite: the maximum-plus-one escape element; values of the escape element, verdicts, one written proof; contexts with raffles and tickets'
      - id: kp3
        name: 'Pairing an infinite set with a proper subset'
        key_prerequisites: [finite-cardinality-bijections]
        step_check:
          step: 'By definition of $E$, $m = 2k$ for some $k \in \mathbb{N}$'
          question: 'Why can we write $m = 2k$ with $k \in \mathbb{N}$ in the check of surjectivity?'
          options:
            - 'Each $m \in E$ has this form, by the definition of $E$'
            - 'We chose $k$ so that $f(k) = m$ before the check of injectivity'
            - 'Every natural number is a multiple of $2$, so $m = 2k$ always holds'
            - 'The injectivity of $f$ gives a natural number $k$ for each $m$'
          answer: 'Each $m \in E$ has this form, by the definition of $E$'
          why: 'The set $E$ consists of the numbers $2k$ with $k \in \mathbb{N}$, so an arbitrary $m \in E$ has this form, and then $f(k) = m$.'
        exemplars:
          - problem: 'Write the formula $f(n)$ of the increasing bijection $f$ from $\mathbb{N} = \{0, 1, 2, \dots\}$ onto its proper subset $\{4, 5, 6, \dots\}$.'
            answer: 'n + 4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Each natural number $n$ moves up by $4$, so $f(n) = n + 4$. It is injective because $n + 4 = m + 4$ forces $n = m$, and it is onto because every $t \geq 4$ equals $f(t - 4)$ with $t - 4 \in \mathbb{N}$.'
          - problem: 'A hotel has rooms numbered $1, 2, 3, \dots$ without end, and every room is occupied. One new guest arrives. The manager asks the guest in room $n$ to move to room $n + 1$, for every $n$. Which room is now free for the new guest?'
            answer: '1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Every old guest moves to a room number that is one larger, so no guest uses room $1$ any more. The map $n \mapsto n + 1$ is a bijection from all rooms onto the rooms $2, 3, 4, \dots$, so room $1$ is free.'
          - problem: 'Write the formula $f(n)$ of the increasing bijection $f$ from $\mathbb{N} = \{0, 1, 2, \dots\}$ onto its proper subset $\{3, 6, 9, \dots\}$.'
            answer: '3n + 3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The element $0$ must go to $3$ and each step must add $3$, so $f(n) = 3n + 3$. It is injective because $3a + 3 = 3b + 3$ forces $a = b$. It is onto because every $3k$ with $k \geq 1$ equals $f(k - 1)$.'
          - problem: 'In the hotel with rooms $1, 2, 3, \dots$, all rooms are occupied and $20$ new guests arrive. The guest in room $n$ moves to room $n + 20$ for every $n$. The guest who is now in room $57$ was in which room before?'
            answer: '37'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The move is $n \mapsto n + 20$, so a guest who is now in room $57$ was in room $n$ with $n + 20 = 57$. We need the inverse, subtraction, not another addition: $n = 57 - 20 = 37$.'
          - problem: 'Is $f(n) = 2n + 2$ a bijection from $\mathbb{N} = \{0, 1, 2, \dots\}$ onto $E = \{2, 4, 6, \dots\}$?'
            answer: 'yes'
            answer_contract: {"kind": "label", "options": [["yes", "it is a bijection", "is a bijection", "bijection", "it is"], ["no", "it is not a bijection", "is not a bijection", "not a bijection", "it is not"]]}
            solution_sketch: 'It is injective, because $2a + 2 = 2b + 2$ gives $a = b$. It is onto $E$, because each even $m \geq 2$ equals $f((m - 2)/2)$ and $(m - 2)/2 \in \mathbb{N}$. So $f$ is a bijection.'
          - problem: 'Sam claims that $f(n) = n + 1$ is a bijection from $\mathbb{N} = \{0, 1, 2, \dots\}$ onto $\mathbb{N}$. Which element of $\mathbb{N}$ is not equal to $f(n)$ for any $n$?'
            answer: '0'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The values of $f$ are $1, 2, 3, \dots$, so the element $0$ is never reached: $n + 1 = 0$ has no solution with $n \geq 0$. So $f$ is not onto $\mathbb{N}$, and Sam is wrong.'
          - problem: 'To show that $f(n) = n + 6$ maps $\mathbb{N} = \{0, 1, 2, \dots\}$ onto $\{6, 7, 8, \dots\}$, take any $m \geq 6$. Write the natural number $n$ with $f(n) = m$ in terms of $m$.'
            answer: 'm - 6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'We solve $n + 6 = m$ and get $n = m - 6$. Since $m \geq 6$, we have $n \geq 0$, so $n \in \mathbb{N}$ and $f(n) = m$. So every $m \geq 6$ is a value of $f$.'
          - problem: 'Write the full proof that if $E = \{2k : k \in \mathbb{Z}\}$ and $F = \{4k : k \in \mathbb{Z}\}$, then $F$ is a proper subset of $E$ and the function $f : E \to F$ defined by $f(x) = 2x$ is a bijection.'
            answer: 'x -> 2x: E onto proper subset F'
            answer_contract: {"kind": "none"}
            solution_sketch: 'Proof. First, $F \subseteq E$: an element $4k$ of $F$ equals $2(2k)$ and $2k \in \mathbb{Z}$, so $4k \in E$. The inclusion is proper: $2 = 2 \cdot 1$ is in $E$, but if $2 = 4k$ for an integer $k$, then $k = 1/2$, which is not an integer, so $2 \notin F$. Next, $f$ maps into $F$: if $x \in E$, then $x = 2k$ for some integer $k$, so $f(x) = 4k \in F$. Injective: if $f(x) = f(y)$, then $2x = 2y$, so $x = y$. Surjective: let $w \in F$, say $w = 4k$ with $k \in \mathbb{Z}$. Then $2k \in E$ and $f(2k) = 4k = w$. Hence $f$ is a bijection from $E$ onto its proper subset $F$. $\square$'
        constraints: 'Pairing an infinite set with a proper subset: shift and scaling bijections, preimages, Hilbert-hotel contexts, verdicts, one written proof'
    diagnostic_exemplar:
      problem: 'Prove that the set $E = \{2k : k \in \mathbb{Z}\}$ of even integers is infinite, and exhibit a bijection from $E$ onto its proper subset $\{4k : k \in \mathbb{Z}\}$.'
      answer: 'The map $k \mapsto 2k$ is a bijection $\mathbb{Z} \to E$ (injective since $2k = 2l$ forces $k = l$, onto by definition of $E$). Now $\mathbb{Z}$ is infinite: it contains $\mathbb{N}$, which is infinite, and subsets of finite sets are finite. If $E$ were finite, composing the bijection with a counting bijection would make $\mathbb{Z}$ finite too — so $E$ is infinite. For the second part, $f : E \to \{4k : k \in \mathbb{Z}\}$, $f(x) = 2x$, is injective ($2x = 2y \Rightarrow x = y$) and onto (any $4k$ is $2 \cdot 2k$ with $2k \in E$), and the containment is proper since $2 \in E$ but $2 \notin \{4k\}$.'
      solution_sketch: 'Transport infiniteness along a bijection with $\mathbb{Z}$, then double every even integer — pairing a set with a proper subset is the hallmark of infinity.'
    anki_seeds:
      - front: 'A set is infinite when...'
        back: 'it is not finite: no bijection with $\{1, \dots, n\}$ for any $n$.'
        type: basic
      - front: 'Hallmark of infinite sets impossible for finite ones?'
        back: 'A bijection with a proper subset of itself (e.g. $n \mapsto n + 1$ on $\mathbb{N}$).'
        type: basic

  - id: cardinality-countability
    name: "Cardinality and Countability"
    core: false                # supplemental: cardinality branch
