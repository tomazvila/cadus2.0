  - id: homomorphisms-intro
    name: "Introduction to Homomorphisms"
    core: true
    difficulty: 0.68
    drill: false
    answer_kind: proof
    expected_time_secs: 240
    prerequisites:
      - id: groups-intro
        weight: 0.5
        key: true
