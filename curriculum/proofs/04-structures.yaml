unit: structures
course: proofs
module: "Algebraic Structures"
topics:
  - id: checking-closure
    name: "Checking Closure"
    core: true
    difficulty: 0.50
    drill: false
    answer_kind: multi-step
    expected_time_secs: 110
    prerequisites:
      - id: functions-formal-definition
        weight: 0.5
        key: true
      - id: set-notation
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: "Closure in number systems"
        key_prerequisites: [functions-formal-definition]
        exemplars:
          - problem: 'Is $\mathbb{N} = \{0, 1, 2, \dots\}$ closed under subtraction? Is $\mathbb{Z}$?'
            answer: 'No ($1 - 2 = -1 \notin \mathbb{N}$); yes.'
            solution_sketch: 'Closure asks whether every output stays in the set: one escaping example refutes it, and differences of integers are always integers.'
          - problem: 'Is $\mathbb{R}$ closed under division? Is $\mathbb{R} \setminus \{0\}$?'
            answer: 'Division is not even defined at $0$ on $\mathbb{R}$; on $\mathbb{R} \setminus \{0\}$, yes.'
            solution_sketch: '$x / 0$ is undefined, so division is not an operation on all of $\mathbb{R}$. A quotient of nonzero reals is a nonzero real, so the punctured set works.'
        constraints: "test whether a familiar operation keeps its outputs inside a number system"
      - id: kp2
        name: "Closure of finite sets"
        key_prerequisites: [set-notation]
        exemplars:
          - problem: 'Is $\{-1, 0, 1\}$ closed under multiplication? Under addition?'
            answer: 'Yes under multiplication; no under addition ($1 + 1 = 2$).'
            solution_sketch: 'All nine products land in $\{-1, 0, 1\}$; but one sum escapes, which is enough to refute closure.'
          - problem: 'Is $\{0, 1\}$ closed under multiplication?'
            answer: 'Yes.'
            solution_sketch: '$0 \cdot 0 = 0$, $0 \cdot 1 = 0$, $1 \cdot 1 = 1$ — every product stays in the set.'
        constraints: "exhaustively check a set of size at most 3, or exhibit one escaping pair"
      - id: kp3
        name: "Closure of described sets"
        key_prerequisites: [set-notation]
        exemplars:
          - problem: 'Are the odd integers closed under multiplication? Under addition?'
            answer: 'Yes under multiplication; no under addition ($1 + 1 = 2$).'
            solution_sketch: '$(2j+1)(2k+1) = 2(2jk + j + k) + 1$ is odd; but the sum of two odds is even.'
          - problem: 'Is the set $\{2^k : k \in \mathbb{N}\}$ of powers of $2$ closed under multiplication?'
            answer: 'Yes: $2^a \cdot 2^b = 2^{a+b}$.'
            solution_sketch: 'The exponents add, and a sum of naturals is natural.'
        constraints: "closure arguments via a parametric form ($2k$, $2k+1$, $2^k$, $5k$)"
    diagnostic_exemplar:
      problem: 'Is the set $\{3k : k \in \mathbb{Z}\}$ of multiples of $3$ closed under addition? Under multiplication? And is $\mathbb{N} = \{0, 1, 2, \dots\}$ closed under subtraction?'
      answer: 'Multiples of $3$ are closed under addition: $3a + 3b = 3(a+b)$, again of that form. They are closed under multiplication too: $(3a)(3b) = 3(3ab)$. But $\mathbb{N}$ is not closed under subtraction: $1 - 2 = -1 \notin \mathbb{N}$.'
      solution_sketch: 'For a described set, substitute the general form and check the result still has that form; for a number system, a single counterexample settles failure.'
    anki_seeds:
      - front: 'To show $S$ is NOT closed under an operation...'
        back: 'exhibit $a, b \in S$ with $a * b \notin S$.'
        type: basic
      - front: 'Are the odd integers closed under $+$? Under $\cdot$?'
        back: 'Not under $+$ (odd + odd = even); closed under $\cdot$.'
        type: basic

  - id: operation-tables
    name: "Operation Tables"
    core: true
    difficulty: 0.52
    drill: false
    answer_kind: multi-step
    expected_time_secs: 120
    prerequisites:
      - id: checking-closure
        weight: 0.5
        key: true
      - id: cartesian-products
        weight: 0.2
    knowledge_points:
      - id: kp1
        name: "Filling in a table"
        key_prerequisites: [checking-closure]
        exemplars:
          - problem: 'In the addition-mod-$4$ table on $\{0, 1, 2, 3\}$, what are the entries for $2 + 3$ and $3 + 3$?'
            answer: '$1$ and $2$.'
            solution_sketch: '$2 + 3 = 5 \equiv 1$ and $3 + 3 = 6 \equiv 2 \pmod 4$.'
          - problem: 'In the multiplication-mod-$5$ table on $\{1, 2, 3, 4\}$, what are the entries for $2 \cdot 4$ and $3 \cdot 3$?'
            answer: '$3$ and $4$.'
            solution_sketch: '$8 \equiv 3$ and $9 \equiv 4 \pmod 5$.'
        constraints: "entries of mod-$n$ addition or multiplication tables, $n \\le 7$"
      - id: kp2
        name: "Reading properties from a table"
        key_prerequisites: [checking-closure]
        exemplars:
          - problem: 'How do you see from an operation table that the operation is commutative? Is addition mod $4$ commutative?'
            answer: 'The table is symmetric across its main diagonal; yes.'
            solution_sketch: 'Symmetry means the $(a, b)$ entry equals the $(b, a)$ entry — exactly commutativity. Mod-$n$ addition inherits commutativity from $\mathbb{Z}$.'
          - problem: 'Find the identity element in the addition-mod-$4$ table, and in the multiplication-mod-$5$ table on $\{1, 2, 3, 4\}$.'
            answer: '$0$; $1$.'
            solution_sketch: 'The identity''s row and column repeat the headers unchanged: row $0$ reads $0, 1, 2, 3$; row $1$ of the multiplication table reads $1, 2, 3, 4$.'
        constraints: "diagonal symmetry for commutativity; header-copy rows for identity"
      - id: kp3
        name: "Inverses from a table"
        key_prerequisites: [checking-closure]
        exemplars:
          - problem: 'In addition mod $4$, find the inverse of $3$.'
            answer: '$1$'
            solution_sketch: 'Scan row $3$ for the identity $0$: $3 + 1 = 4 \equiv 0$, so $1$ is the inverse.'
          - problem: 'In multiplication mod $5$ on $\{1, 2, 3, 4\}$, find the inverses of $2$ and $4$.'
            answer: '$3$ and $4$.'
            solution_sketch: '$2 \cdot 3 = 6 \equiv 1$ and $4 \cdot 4 = 16 \equiv 1 \pmod 5$; $4$ is its own inverse.'
        constraints: "locate the identity in each row; mod-$n$ tables only"
    diagnostic_exemplar:
      problem: 'In the addition-mod-$6$ table on $\{0, 1, \dots, 5\}$: give the entry for $4 + 5$, the identity element and the inverse of $2$, and say how the table shows the operation is commutative.'
      answer: 'The entry for $4 + 5$ is $9 \bmod 6 = 3$. The identity is $0$, since its row and column simply repeat the headings. The inverse of $2$ is $4$, because $2 + 4 = 6 \equiv 0$, the identity. Commutativity appears as symmetry of the table across its main diagonal: the entry in row $i$, column $j$ equals the entry in row $j$, column $i$.'
      solution_sketch: 'Reduce mod $6$ for the entry; find the identity as the row repeating the headings, the inverse as the entry giving $0$, and read commutativity off the diagonal symmetry.'
    anki_seeds:
      - front: 'Commutativity in an operation table looks like...'
        back: 'symmetry across the main diagonal.'
        type: basic
      - front: 'The identity element''s row and column in a table...'
        back: 'repeat the row/column headers unchanged.'
        type: basic

  - id: binary-operations
    name: "Binary Operations"
    core: true
    difficulty: 0.55
    drill: false
    answer_kind: proof
    expected_time_secs: 200
    prerequisites:
      - id: checking-closure
        weight: 0.5
        key: true
      - id: functions-formal-definition
        weight: 0.5
        key: true
      - id: cartesian-products
        weight: 0.4
        key: true
      - id: operation-tables
        weight: 0.3
      - id: set-operations
        weight: 0.0
    knowledge_points:
      - id: kp1
        name: "Associativity and commutativity"
        key_prerequisites: [functions-formal-definition]
        exemplars:
          - problem: 'On $\mathbb{Z}$ define $a * b = a + b - 1$. Prove $*$ is associative and commutative.'
            answer: 'Both associativity sides equal $a + b + c - 2$; commutativity is symmetric.'
            solution_sketch: 'Commutative: $a * b = a + b - 1 = b + a - 1 = b * a$. Associative: $(a * b) * c = (a + b - 1) + c - 1 = a + b + c - 2$ and $a * (b * c) = a + (b + c - 1) - 1 = a + b + c - 2$; equal. $\square$'
          - problem: 'On $\mathbb{Z}$ define $a * b = a + 2b$. Is $*$ commutative? Associative?'
            answer: 'Neither.'
            solution_sketch: 'Commutativity: $a * b = a + 2b$ vs $b * a = b + 2a$; unequal, e.g. $1 * 2 = 5 \ne 4 = 2 * 1$. Associativity: $(a * b) * c = a + 2b + 2c$ vs $a * (b * c) = a + 2b + 4c$; unequal. So neither holds. $\square$'
        constraints: "verify or refute the identities symbolically"
      - id: kp2
        name: "Identity elements"
        key_prerequisites: [operation-tables]
        exemplars:
          - problem: 'For $a * b = a + b - 1$ on $\mathbb{Z}$, find the identity element.'
            answer: '$e = 1$.'
            solution_sketch: 'Need $a * e = a$: $a + e - 1 = a \Rightarrow e = 1$. Check $1 * a = 1 + a - 1 = a$, so $e = 1$ is a two-sided identity. $\square$'
          - problem: 'Does the operation $a * b = a - b$ on $\mathbb{Z}$ have a two-sided identity?'
            answer: 'No.'
            solution_sketch: 'A right identity needs $a * e = a$: $a - e = a \Rightarrow e = 0$. But $e * a = 0 - a = -a \ne a$ in general, so $0$ is not a left identity. No two-sided identity exists. $\square$'
        constraints: "solve $a * e = a$ and verify the two-sided condition"
      - id: kp3
        name: "Hunting for inverses"
        key_prerequisites: [operation-tables]
        exemplars:
          - problem: 'For $a * b = a + b - 1$ on $\mathbb{Z}$ (identity $e = 1$), find the inverse of each element $a$.'
            answer: '$2 - a$.'
            solution_sketch: 'Solve $a * x = 1$: $a + x - 1 = 1 \Rightarrow x = 2 - a$; check $(2-a) * a = 2 - a + a - 1 = 1$. Every integer is invertible. $\square$'
          - problem: 'For $a * b = a + b + ab$ on $\mathbb{R}$ (identity $e = 0$), which elements have inverses?'
            answer: 'All $a \ne -1$, with inverse $-a/(1+a)$.'
            solution_sketch: 'Solve $a + x + ax = 0$: $x(1 + a) = -a$, so $x = -a/(1+a)$ when $a \ne -1$. For $a = -1$: $-1 + x - x = -1 \ne 0$ for every $x$, so $-1$ has no inverse. $\square$'
        constraints: "solve $a * x = e$ for $x$; identify any non-invertible elements"
    diagnostic_exemplar:
      problem: 'On $\mathbb{R}$ define $a * b = a + b + ab$. Show that $*$ is commutative, find its identity element, and determine exactly which elements have inverses.'
      answer: 'Commutative: $a * b = a + b + ab = b + a + ba = b * a$. Identity: $a * e = a + e + ae = a$ forces $e(1 + a) = 0$ for every $a$, so $e = 0$; and indeed $a * 0 = a = 0 * a$. Inverses: $a * x = 0$ means $a + x + ax = 0$, i.e. $x(1 + a) = -a$. If $a \ne -1$ this has the unique real solution $x = \dfrac{-a}{1 + a}$, so $a$ is invertible; if $a = -1$ the equation becomes $0 = 1$, so $-1$ has no inverse. Exactly the elements $a \ne -1$ are invertible.'
      solution_sketch: 'Symmetry of the formula gives commutativity; solve $a * e = a$ for the identity and $a * x = 0$ for inverses, watching the case $1 + a = 0$.'
    anki_seeds:
      - front: 'A binary operation on a set $S$ is...'
        back: 'a function $* : S \times S \to S$ (so $S$ is closed under $*$).'
        type: basic
      - front: 'Identity element $e$ for an operation $*$ on $S$?'
        back: 'An element with $a * e = e * a = a$ for every $a \in S$.'
        type: basic

  - id: semigroup-examples
    name: "Semigroups and Associativity Checks"
    core: true
    difficulty: 0.57
    drill: false
    answer_kind: proof
    expected_time_secs: 170
    prerequisites:
      - id: binary-operations
        weight: 0.6
        key: true
    knowledge_points:
      - id: kp1
        name: "Verifying associativity"
        key_prerequisites: [binary-operations]
        exemplars:
          - problem: 'Prove that $a * b = \max(a, b)$ on $\mathbb{Z}$ is associative.'
            answer: 'Both $(a*b)*c$ and $a*(b*c)$ equal $\max(a, b, c)$.'
            solution_sketch: '$\max(\max(a,b), c)$ and $\max(a, \max(b,c))$ each pick the largest of the three values, so they agree. $\square$'
          - problem: 'Prove that $a * b = a + b + ab$ on $\mathbb{R}$ is associative.'
            answer: 'Both sides expand to $a + b + c + ab + ac + bc + abc$.'
            solution_sketch: '$(a*b)*c = (a+b+ab) + c + (a+b+ab)c = a+b+c+ab+ac+bc+abc$; the same expansion works for $a*(b*c)$. $\square$'
        constraints: "expand both sides symbolically or argue from the meaning of the operation"
      - id: kp2
        name: "Refuting associativity"
        key_prerequisites: [binary-operations]
        exemplars:
          - problem: 'Show that division on $\mathbb{R}^{>0}$ is not associative.'
            answer: '$(8 / 4) / 2 = 1$ but $8 / (4 / 2) = 4$.'
            solution_sketch: 'One concrete triple with unequal groupings refutes associativity.'
          - problem: 'Show that the averaging operation $a * b = \tfrac{a + b}{2}$ on $\mathbb{Q}$ is not associative.'
            answer: '$(0 * 0) * 1 = \tfrac{1}{2}$ but $0 * (0 * 1) = \tfrac{1}{4}$.'
            solution_sketch: '$(0*0)*1 = 0*1 = \tfrac12$, while $0*(0*1) = 0*\tfrac12 = \tfrac14$. $\square$'
        constraints: "one explicit counterexample triple, both groupings evaluated"
      - id: kp3
        name: "Semigroups without an identity"
        key_prerequisites: [binary-operations]
        exemplars:
          - problem: 'Show that the even integers under multiplication form a semigroup but not a monoid.'
            answer: 'Closed and associative, but the only candidate identity $1$ is odd.'
            solution_sketch: 'Products of evens are even (closure) and multiplication is associative. An identity $e$ would need $e \cdot 2 = 2$, so $e = 1 \notin 2\mathbb{Z}$. $\square$'
          - problem: 'Show that $((0, 1), \cdot)$ is a semigroup but not a monoid.'
            answer: 'Products stay in $(0,1)$; an identity would have to be $1 \notin (0, 1)$.'
            solution_sketch: 'For $0 < a, b < 1$, $0 < ab < 1$ (closure); associativity is inherited from $\mathbb{R}$. $e \cdot a = a$ forces $e = 1$, which is excluded. $\square$'
        constraints: "verify closure and associativity, then show the forced identity lies outside the set"
    diagnostic_exemplar:
      problem: 'Is $a * b = \min(a, b)$ on $\mathbb{Z}$ associative? Commutative? Does it have an identity?'
      answer: 'Associative and commutative; no identity.'
      solution_sketch: 'Both groupings give the smallest of the three; symmetry gives commutativity. An identity would need $\min(a, e) = a$ for all $a$, i.e. $e$ above every integer — impossible. $\square$'
    anki_seeds:
      - front: 'Standard way to refute associativity?'
        back: 'One concrete triple where $(a * b) * c \ne a * (b * c)$.'
        type: basic
      - front: 'Is $(2\mathbb{Z}, \cdot)$ a monoid?'
        back: 'No — it is a semigroup; the would-be identity $1$ is not even.'
        type: basic

  - id: monoids
    name: "Monoids"
    core: true
    difficulty: 0.60
    drill: false
    answer_kind: proof
    expected_time_secs: 210
    prerequisites:
      - id: binary-operations
        weight: 0.6
        key: true
      - id: semigroup-examples
        weight: 0.4
        key: true
      - id: functions-formal-definition
        weight: 0.0
    knowledge_points:
      - id: kp1
        name: "Semigroups and monoids"
        key_prerequisites: [binary-operations]
        exemplars:
          - problem: 'Show $(\mathbb{N}, +, 0)$ is a monoid.'
            answer: 'Closed, associative, identity $0$.'
            solution_sketch: 'Addition on $\mathbb{N}$ is closed and associative, and $n + 0 = 0 + n = n$, so $0$ is an identity. Hence $(\mathbb{N}, +, 0)$ is a monoid. $\square$'
          - problem: 'Show $(\mathbb{Z}, \cdot, 1)$ is a monoid.'
            answer: 'Closed, associative, identity $1$.'
            solution_sketch: 'Integer multiplication is closed and associative, and $n \cdot 1 = 1 \cdot n = n$, so $1$ is an identity. Hence $(\mathbb{Z}, \cdot, 1)$ is a monoid. $\square$'
        constraints: "verify closure, associativity, and a two-sided identity"
      - id: kp2
        name: "Uniqueness of the identity"
        key_prerequisites: [binary-operations]
        exemplars:
          - problem: 'Prove: a monoid has a unique identity element.'
            answer: 'If $e_1, e_2$ are both identities, $e_1 = e_1 * e_2 = e_2$.'
            solution_sketch: 'Suppose $e_1$ and $e_2$ are both identities. Then $e_1 = e_1 * e_2$ (since $e_2$ is an identity) and $e_1 * e_2 = e_2$ (since $e_1$ is an identity). Hence $e_1 = e_2$. $\square$'
          - problem: 'Is the set of positive integers under addition a monoid?'
            answer: 'No; there is no identity element ($0$ is excluded).'
            solution_sketch: 'Addition on $\mathbb{Z}^{+}$ is closed and associative, but an identity $e$ would need $n + e = n$, i.e. $e = 0 \notin \mathbb{Z}^{+}$. With no identity it is a semigroup but not a monoid. $\square$'
        constraints: "play the two identities against each other"
      - id: kp3
        name: "Recognizing monoids and non-examples"
        key_prerequisites: [binary-operations]
        exemplars:
          - problem: 'Is $(\mathbb{Z}, -, 0)$ (integers under subtraction) a monoid? Justify.'
            answer: 'No; subtraction is not associative.'
            solution_sketch: '$(a - b) - c = a - b - c$ but $a - (b - c) = a - b + c$; e.g. $(1 - 1) - 1 = -1 \ne 1 = 1 - (1 - 1)$. Associativity fails, so it is not a monoid. $\square$'
          - problem: 'Is the set of $2 \times 2$ real matrices under multiplication, with the identity matrix, a monoid?'
            answer: 'Yes.'
            solution_sketch: 'Multiplication of $2 \times 2$ real matrices is closed and associative, and the identity matrix $I$ satisfies $AI = IA = A$. So it is a monoid (noncommutative). $\square$'
        constraints: "check the axioms; a single failure rules out a monoid"
    diagnostic_exemplar:
      problem: 'Show that the set of functions $X \to X$ under composition, with $\mathrm{id}_X$, is a monoid, and prove that the identity element of any monoid is unique.'
      answer: 'Closure: the composite of two functions $X \to X$ is again a function $X \to X$. Associativity: for every $x$, $((f \circ g) \circ h)(x) = f(g(h(x))) = (f \circ (g \circ h))(x)$, so the two composites agree. Identity: $(\mathrm{id}_X \circ f)(x) = f(x) = (f \circ \mathrm{id}_X)(x)$ for all $x$, so $\mathrm{id}_X$ is a two-sided identity. Hence this is a monoid. Uniqueness in general: if $e_1$ and $e_2$ are both identities of a monoid, then $e_1 = e_1 * e_2 = e_2$ — the first equality because $e_2$ is an identity, the second because $e_1$ is.'
      solution_sketch: 'Check closure, associativity and neutrality for composition; the uniqueness argument multiplies the two candidate identities together.'
    anki_seeds:
      - front: 'Definition of a monoid?'
        back: 'A set with an associative binary operation and a two-sided identity element.'
        type: basic
      - front: 'Semigroup vs. monoid?'
        back: 'A semigroup has an associative operation; a monoid additionally has an identity element.'
        type: basic

  - id: powers-in-monoids
    name: "Powers and Exponent Laws"
    core: true
    difficulty: 0.62
    drill: false
    answer_kind: proof
    expected_time_secs: 180
    prerequisites:
      - id: monoids
        weight: 0.5
        key: true
      - id: mathematical-induction
        weight: 0.5
        key: true
    knowledge_points:
      - id: kp1
        name: "Defining and computing powers"
        key_prerequisites: [monoids]
        exemplars:
          - problem: 'In the monoid of functions $\mathbb{R} \to \mathbb{R}$ under composition, let $f(x) = x + 2$. Compute $f^{3}$.'
            answer: '$f^{3}(x) = x + 6$'
            solution_sketch: 'Each application adds $2$; three applications add $6$.'
          - problem: 'In the multiplication-mod-$10$ monoid on $\{0, 1, \dots, 9\}$, compute $3^{4}$ and $7^{2}$.'
            answer: '$1$ and $9$.'
            solution_sketch: '$3^4 = 81 \equiv 1$ and $7^2 = 49 \equiv 9 \pmod{10}$.'
        constraints: "iterate a concrete monoid element; recursive definition $a^{n+1} = a^{n} a$, $a^{0} = e$"
      - id: kp2
        name: "The law $a^{m} a^{n} = a^{m+n}$"
        key_prerequisites: [mathematical-induction]
        exemplars:
          - problem: 'In any monoid, prove $a^{m} a^{n} = a^{m+n}$ for all $m, n \ge 0$ by induction on $n$.'
            answer: 'Base $n = 0$ uses $a^{0} = e$; the step peels one factor via $a^{n+1} = a^{n} a$.'
            solution_sketch: 'Fix $m$. For $n = 0$: $a^m e = a^m = a^{m+0}$. Assuming $a^m a^n = a^{m+n}$: $a^m a^{n+1} = a^m (a^n a) = (a^m a^n) a = a^{m+n} a = a^{m+n+1}$, using associativity. $\square$'
          - problem: 'Verify $a^{2} a^{3} = a^{5}$ concretely for $a = 2$ in $(\mathbb{Z}, \cdot)$.'
            answer: '$4 \cdot 8 = 32 = 2^{5}$.'
            solution_sketch: 'A sanity check of the general law on a concrete element.'
        constraints: "induction on one exponent with the other fixed; cite associativity where used"
      - id: kp3
        name: "The law $(a^{m})^{n} = a^{mn}$"
        key_prerequisites: [mathematical-induction]
        exemplars:
          - problem: 'In any monoid, prove $(a^{m})^{n} = a^{mn}$ for all $m, n \ge 0$ by induction on $n$.'
            answer: 'Base $n = 0$: both sides are $e$; the step uses $a^{mn} a^{m} = a^{mn + m}$.'
            solution_sketch: 'For $n = 0$: $(a^m)^0 = e = a^0$. Assuming $(a^m)^n = a^{mn}$: $(a^m)^{n+1} = (a^m)^n a^m = a^{mn} a^m = a^{mn+m} = a^{m(n+1)}$, using the addition law. $\square$'
          - problem: 'In a monoid where $a b = b a$, prove $(ab)^{n} = a^{n} b^{n}$ for all $n \ge 0$ by induction.'
            answer: 'The step commutes $b^{n}$ past $a$.'
            solution_sketch: 'Base: $(ab)^0 = e = e e$. Step: $(ab)^{n+1} = (ab)^n (ab) = a^n b^n a b = a^n a b^n b = a^{n+1} b^{n+1}$, using $b^n a = a b^n$ (which follows from $ab = ba$ by an inner induction or repeated swaps). $\square$'
        constraints: "induction proofs stacked on the previous law; note where commutativity is needed"
    diagnostic_exemplar:
      problem: 'In an arbitrary monoid, prove by induction on $n$ that $a^{m}a^{n} = a^{m+n}$ for all integers $m, n \ge 0$, and use it to show $(a^{2})^{3} = a^{6}$.'
      answer: 'Powers are defined by $a^{0} = e$ and $a^{k+1} = a^{k}a$. Fix $m \ge 0$ and induct on $n$. Base $n = 0$: $a^{m}a^{0} = a^{m}e = a^{m} = a^{m+0}$. Step: assume $a^{m}a^{n} = a^{m+n}$; then $a^{m}a^{n+1} = a^{m}(a^{n}a) = (a^{m}a^{n})a = a^{m+n}a = a^{m+n+1}$, using associativity and the definition. So the law holds for all $n \ge 0$, and $m$ was arbitrary. Consequently $(a^{2})^{3} = a^{2}a^{2}a^{2} = a^{4}a^{2} = a^{6}$.'
      solution_sketch: 'Induct on the second exponent, peeling one factor with $a^{n+1} = a^{n}a$ and re-associating; then apply the law twice.'
    anki_seeds:
      - front: '$a^{0}$ in a monoid?'
        back: 'The identity $e$ (by convention/recursive definition).'
        type: basic
      - front: 'When does $(ab)^{n} = a^{n} b^{n}$ hold in a monoid?'
        back: 'When $a$ and $b$ commute ($ab = ba$); not in general.'
        type: basic

