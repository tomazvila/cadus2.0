    knowledge_points:
      - id: kp1
        name: "Defining and computing powers"
        key_prerequisites: [monoids]
        step_check:
          step: 'Base step: $f^{1} = f^{0} \circ f = f$'
          question: 'Why does $f^{0} \circ f$ equal $f$?'
          options:
            - 'Because $f^{0}$ is the zero function, so the composite keeps only the factor $f$'
            - 'Because $f^{0}$ is the identity function, so composing with it changes nothing'
            - 'Because a power with exponent $0$ is defined to be the function $f$ itself'
            - 'Because a composite always returns the function that is written on its right'
          answer: 'Because $f^{0}$ is the identity function, so composing with it changes nothing'
          why: 'The recursion starts at $a^{0} = e$. In the composition monoid $e$ is the identity function, so $e \circ f = f$.'
        try_first:
          problem: 'In the monoid of nonnegative integers under addition, the identity is $0$ and powers are defined by $a^{0} = 0$ and $a^{n+1} = a^{n} + a$. What is $9^{2}$ in this monoid?'
          answer_contract: {"kind": "exact"}
          answer: '18'
          reveal: 'The power $9^{2}$ is $9 + 9 = 18$. In a monoid a power repeats the operation of that monoid, whatever the operation is.'
        exemplars:
          - problem: 'In the monoid of all functions from $\mathbb{R}$ to $\mathbb{R}$ under composition, the identity $e$ is the identity function, and powers are defined by $a^{0} = e$ and $a^{n+1} = a^{n} a$. Let $f(x) = x + 5$. Find $f^{4}$.'
            answer: 'x + 20'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'By the definition, $f^{1} = f^{0} f = f$, so $f^{1}(x) = x + 5$. Each further power composes one more copy of $f$, and each copy adds $5$. Hence $f^{2}(x) = x + 10$, $f^{3}(x) = x + 15$ and $f^{4}(x) = x + 20$.'
          - problem: 'In the monoid $\{0, 1, \ldots, 9\}$ with multiplication modulo $10$, the identity is $1$ and powers are defined by $a^{0} = 1$ and $a^{n+1} = a^{n} a$. Find $7^{3}$.'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'By the recursion, $7^{1} = 7$ and $7^{2} = 49$, which is $9$ modulo $10$. Then $7^{3} = 9 \cdot 7 = 63$, which is $3$ modulo $10$. So $7^{3} = 3$ in this monoid.'
          - problem: 'In the monoid of nonnegative integers under addition, the identity is $0$ and the definition of powers reads $a^{0} = 0$ and $a^{n+1} = a^{n} + a$, because the operation is addition. Find $6^{4}$.'
            answer: '24'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The operation is addition, so the power $6^{4}$ is $6 + 6 + 6 + 6$. The recursion gives $6^{1} = 6$, $6^{2} = 12$, $6^{3} = 18$ and $6^{4} = 24$. The product $6 \cdot 6 \cdot 6 \cdot 6 = 1296$ is the wrong answer, because multiplication is not the operation of this monoid.'
          - problem: 'A machine doubles every number put into it. In the monoid of functions under composition, running the machine $n$ times in a row is the power $d^{n}$ of the doubling function $d(x) = 2x$. A technician runs the machine $5$ times on the input $3$. What number comes out?'
            answer: '96'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Each run multiplies the number by $2$, so $d^{5}(x) = 2^{5} x = 32x$. For the input $3$ the output is $32 \cdot 3 = 96$. The machine multiplies at each run, so the answer is $96$.'
          - problem: 'A machine adds $7$ to every number put into it. In the monoid of functions under composition, running the machine $n$ times in a row is the power $f^{n}$ of $f(x) = x + 7$. The technician starts with the input $3$ and runs the machine until the output is $38$. How many runs are needed?'
            answer: '5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The power is $f^{n}(x) = x + 7n$. We need $3 + 7n = 38$, so $7n = 35$ and $n = 5$. Check: five runs give $10, 17, 24, 31, 38$, so the output $38$ appears after $5$ runs.'
          - problem: 'In the monoid of all functions from $\mathbb{R}$ to $\mathbb{R}$ under composition, with $a^{0} = e$ and $a^{n+1} = a^{n} a$, Sam computes $h^{3}$ for $h(x) = 2x$. Sam writes $h^{3}(x) = h^{2}(x) + h(x) = 4x + 2x = 6x$. What is the correct value of $h^{3}(x)$?'
            answer: '8x'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The operation of this monoid is composition, not addition. So $h^{3} = h^{2} h$ means $h^{3}(x) = h^{2}(h(x)) = h^{2}(2x) = 4 \cdot 2x = 8x$. Sam added the two functions instead of composing them.'
          - problem: 'In a monoid with identity $e$, powers are defined by $a^{0} = e$ and $a^{n+1} = a^{n} a$. Is $a^{1} = a$ for every element $a$ of the monoid?'
            answer: 'yes'
            answer_contract: {"kind": "label", "options": [["yes", "it is", "it does", "yes it is", "yes it does", "true", "it is true"], ["no", "it is not", "it does not", "no it is not", "no it does not", "false", "not true"]]}
            solution_sketch: 'By the definition, $a^{1} = a^{0} a = e a$. The identity law gives $e a = a$. So $a^{1} = a$ holds for every element $a$ of every monoid.'
          - problem: 'In the monoid of all functions from $\mathbb{R}$ to $\mathbb{R}$ under composition, let $f(x) = x + 1$. Is the power $f^{2}$ the function $x \mapsto (x + 1)^{2}$?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "it is", "it does", "yes it is", "yes it does", "true", "it is true"], ["no", "it is not", "it does not", "no it is not", "no it does not", "false", "not true"]]}
            solution_sketch: 'The power $f^{2} = f^{1} f$ is the composite $f \circ f$, so $f^{2}(x) = f(f(x)) = f(x + 1) = x + 2$. The function $x \mapsto (x + 1)^{2}$ takes the value $1$ at $x = 0$, but $f^{2}(0) = 2$. So the two functions differ, and $f^{2}$ is not the square of the value $f(x)$.'
          - problem: 'Write the full proof that in every monoid $(M, \cdot, e)$, with powers defined by $a^{0} = e$ and $a^{n+1} = a^{n} a$, the equality $a^{n} a = a a^{n}$ holds for every $a \in M$ and every integer $n \ge 0$.'
            answer: 'a^n a = a a^n for all n >= 0'
            answer_contract: {"kind": "none"}
            solution_sketch: 'We prove $a^{n} a = a a^{n}$ by induction on $n$. Base case $n = 0$: $a^{0} a = e a = a$ and $a a^{0} = a e = a$, so both sides equal $a$. Inductive hypothesis: assume $a^{k} a = a a^{k}$ for some integer $k \ge 0$. Inductive step: by the definition of powers $a^{k+1} = a^{k} a$, so $a^{k+1} a = (a^{k} a) a$. The hypothesis replaces $a^{k} a$ by $a a^{k}$, so $(a^{k} a) a = (a a^{k}) a$. Associativity gives $(a a^{k}) a = a (a^{k} a)$, and $a^{k} a = a^{k+1}$ by definition, so $a (a^{k} a) = a a^{k+1}$. Chaining these equalities, $a^{k+1} a = a a^{k+1}$, which is the claim for $k + 1$. By induction, $a^{n} a = a a^{n}$ for every $n \ge 0$. No commutativity of $M$ was used.'
        constraints: 'powers by the recursion $a^{0} = e$, $a^{n+1} = a^{n} a$ in concrete monoids (functions, residues, addition, matrices); contexts of repeated machines; one induction proof'
      - id: kp2
        name: "The law $a^{m} a^{n} = a^{m+n}$"
        key_prerequisites: [mathematical-induction]
        step_check:
          step: 'by associativity this is $(x^{m}x^{n})x$'
          question: 'Why does the proof need associativity to turn $x^{m}(x^{n}x)$ into $(x^{m}x^{n})x$?'
          options:
            - 'The factors $x^{m}$ and $x^{n}$ must trade places, and only associativity allows that'
            - 'The identity $e$ must be inserted between the factors before the hypothesis applies'
            - 'Only the brackets move, so the hypothesis applies to the product $x^{m}x^{n}$'
            - 'Associativity replaces $x^{n}$ by $x^{n-1}$ so that the exponents add up at once'
          answer: 'Only the brackets move, so the hypothesis applies to the product $x^{m}x^{n}$'
          why: 'The hypothesis speaks about the product $x^{m}x^{n}$ only. Associativity regroups the three factors without changing their order, and a monoid need not be commutative.'
        exemplars:
          - problem: 'In a monoid, $a^{7} a^{5} = a^{k}$. Find $k$.'
            answer: '12'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The law $a^{m} a^{n} = a^{m+n}$ adds the exponents. The product $a^{7} a^{5}$ is seven copies of $a$ followed by five copies of $a$, which is $7 + 5 = 12$ copies. So $k = 12$.'
          - problem: 'Sam writes $a^{3} a^{4} = a^{12}$ in a monoid. What is the correct exponent?'
            answer: '7'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The law adds the exponents: $a^{3} a^{4} = a^{3+4} = a^{7}$. Sam multiplied the exponents, but that rule belongs to $(a^{m})^{n} = a^{mn}$, which is a different situation.'
          - problem: 'A machine doubles every number put into it. In the monoid of functions under composition, running the machine $n$ times is the power $d^{n}$ of the doubling function $d(x) = 2x$. A technician has run the machine $6$ times and wants the total effect to equal $14$ runs. How many more runs does the technician make?'
            answer: '8'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'If the technician makes $k$ more runs, the total effect is $d^{6} d^{k} = d^{6+k}$ by the law of exponents. We need $6 + k = 14$, so $k = 8$.'
          - problem: 'In the monoid of functions under composition, let $d(x) = 2x$. Find the value of $(d^{3} d^{4})(1)$.'
            answer: '128'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'By the law, $d^{3} d^{4} = d^{7}$. Each factor $d$ doubles its input, so $d^{7}(x) = 2^{7} x = 128 x$. At $x = 1$ the value is $128$.'
          - problem: 'In the proof of $a^{m} a^{n} = a^{m+n}$ by induction on $n$, the inductive hypothesis is $a^{m} a^{k} = a^{m+k}$. The step rewrites $a^{m} a^{k+1} = (a^{m} a^{k}) a = a^{m+k} a$. The last expression is a single power $a^{j}$ of $a$. Find $j$.'
            answer: 'm + k + 1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'By the definition of powers, $a^{m+k} a = a^{(m+k)+1}$, since $x^{n+1} = x^{n} x$ with $n = m + k$. So $j = m + k + 1$. This is the claim $a^{m} a^{k+1} = a^{m+(k+1)}$ for $k + 1$.'
          - problem: 'In the induction step, the proof rewrites $a^{m}(a^{k} a)$ as $(a^{m} a^{k}) a$. Which property of the monoid allows moving the brackets: associativity or commutativity?'
            answer: 'associativity'
            answer_contract: {"kind": "label", "options": [["associativity", "associative", "the associative law", "associative law", "associativity of the operation"], ["commutativity", "commutative", "the commutative law", "commutative law", "commutativity of the operation"]]}
            solution_sketch: 'Only the brackets move; the order of the factors $a^{m}$, $a^{k}$, $a$ stays the same. That is exactly the content of associativity. Commutativity would change the order, and a monoid need not have it.'
          - problem: 'A cipher shifts every letter number forward by $3$ places, modulo $26$. Let $s$ be this shift in the monoid of shifts, so that $s^{n}$ shifts forward by $3n$ places. A message is shifted $20$ times and then $9$ more times. The same result comes from one shift forward by $m$ places, where $0 \le m \le 25$. Find $m$.'
            answer: '9'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'By the law, $s^{20} s^{9} = s^{29}$, which shifts forward by $3 \cdot 29 = 87$ places. Since $87 = 3 \cdot 26 + 9$, this equals a shift by $9$ places modulo $26$. So $m = 9$.'
          - problem: 'Write the full proof that in every monoid $(M, \cdot, e)$, with powers defined by $a^{0} = e$ and $a^{n+1} = a^{n} a$, the equality $a^{m} a^{n} = a^{m+n}$ holds for every $a \in M$ and all integers $m, n \ge 0$.'
            answer: 'a^m a^n = a^(m+n) for m, n >= 0'
            answer_contract: {"kind": "none"}
            solution_sketch: 'Fix $a \in M$ and an integer $m \ge 0$. We prove $a^{m} a^{n} = a^{m+n}$ by induction on $n$. Base case $n = 0$: $a^{0} = e$, so $a^{m} a^{0} = a^{m} e = a^{m} = a^{m+0}$ by the identity law. Inductive hypothesis: assume $a^{m} a^{k} = a^{m+k}$ for some integer $k \ge 0$. Inductive step: by the definition of powers $a^{k+1} = a^{k} a$, so $a^{m} a^{k+1} = a^{m} (a^{k} a)$. By associativity $a^{m} (a^{k} a) = (a^{m} a^{k}) a$. By the hypothesis $(a^{m} a^{k}) a = a^{m+k} a$, and by the definition of powers $a^{m+k} a = a^{m+k+1}$. Hence $a^{m} a^{k+1} = a^{m+(k+1)}$, the claim for $k + 1$. By induction the equality holds for every $n \ge 0$. Since $m$ was arbitrary, it holds for all $m, n \ge 0$.'
        constraints: 'the law $a^{m} a^{n} = a^{m+n}$ as exponent arithmetic, with the induction step and its justification; contexts of repeated machines and shifts; one induction proof'
      - id: kp3
        name: "The law $(a^{m})^{n} = a^{mn}$"
        key_prerequisites: [mathematical-induction]
        step_check:
          step: 'both factors are powers of the same element $a$'
          question: 'Why can the addition law be used to merge $a^{3n} \cdot a^{3}$ into one power?'
          options:
            - 'Both factors are powers of one element $a$, so their exponents add'
            - 'Every monoid is commutative, so any two factors can be merged into one'
            - 'The exponent $3n$ is always a multiple of $3$, so the two factors match'
            - 'The inductive hypothesis already states that the two factors are equal'
          answer: 'Both factors are powers of one element $a$, so their exponents add'
          why: 'The law $a^{p}a^{q} = a^{p+q}$ holds for powers of the same element, with no commutativity needed. Here $p = 3n$ and $q = 3$.'
        exemplars:
          - problem: 'In a monoid, $(a^{2})^{5} = a^{k}$. Find $k$.'
            answer: '10'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The power $(a^{2})^{5}$ is five copies of $a^{2}$, and each copy holds two copies of $a$. By the law $(a^{m})^{n} = a^{mn}$, the exponent is $2 \cdot 5 = 10$. So $k = 10$.'
          - problem: 'Sam writes $(a^{3})^{4} = a^{7}$ in a monoid. What is the correct exponent?'
            answer: '12'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The law is $(a^{m})^{n} = a^{mn}$, so the exponents multiply: $(a^{3})^{4} = a^{3 \cdot 4} = a^{12}$. Sam added the exponents, which is the rule for the product $a^{3} a^{4}$.'
          - problem: 'A cipher shifts every letter number forward by $5$ places, modulo $26$. Let $s$ be this shift, so that $s^{n}$ shifts forward by $5n$ places. One round of encryption applies $s$ three times, which is $s^{3}$. A message goes through $5$ rounds. The same result comes from one shift forward by $m$ places, where $0 \le m \le 25$. Find $m$.'
            answer: '23'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Five rounds give $(s^{3})^{5} = s^{15}$, which shifts forward by $5 \cdot 15 = 75$ places. Since $75 = 2 \cdot 26 + 23$, this equals a shift by $23$ places modulo $26$. So $m = 23$.'
          - problem: 'A machine doubles every number put into it. One cycle runs the machine $3$ times. After a whole number of cycles the machine has multiplied its input by $2^{24}$. How many cycles were run?'
            answer: '8'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'One cycle is $d^{3}$ for the doubling function $d$, so $n$ cycles are $(d^{3})^{n} = d^{3n}$. This multiplies the input by $2^{3n}$. We need $3n = 24$, so $n = 8$.'
          - problem: 'In the monoid of $2 \times 2$ real matrices under multiplication, let $A = \begin{pmatrix}1&1\\0&1\end{pmatrix}$ and $B = \begin{pmatrix}1&0\\1&1\end{pmatrix}$. Compute $(AB)^{2}$.'
            answer: '[[5,3],[3,2]]'
            answer_contract: {"kind": "matrix", "rows": 2, "cols": 2}
            solution_sketch: 'The product $AB$ has rows $(2, 1)$ and $(1, 1)$. Squaring gives the rows $(2 \cdot 2 + 1 \cdot 1, 2 \cdot 1 + 1 \cdot 1) = (5, 3)$ and $(1 \cdot 2 + 1 \cdot 1, 1 \cdot 1 + 1 \cdot 1) = (3, 2)$. The product $A^{2}B^{2}$ has rows $(5, 2)$ and $(2, 1)$, so $(AB)^{2} \neq A^{2}B^{2}$ when the factors do not commute.'
          - problem: 'In the inductive step for $(a^{m})^{n} = a^{mn}$, the hypothesis gives $(a^{m})^{k+1} = (a^{m})^{k} a^{m} = a^{mk} a^{m}$. The law $a^{p} a^{q} = a^{p+q}$ turns this into a single power $a^{j}$. Find $j$ in terms of $m$ and $k$.'
            answer: 'm*k + m'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The law adds the exponents $p = mk$ and $q = m$, so $j = mk + m$. This equals $m(k + 1)$, which is the exponent in the claim for $k + 1$.'
          - problem: 'In a monoid, is $(a^{2})^{3}$ always equal to $(a^{3})^{2}$?'
            answer: 'yes'
            answer_contract: {"kind": "label", "options": [["yes", "it is", "it does", "yes it is", "yes it does", "true", "it is true"], ["no", "it is not", "it does not", "no it is not", "no it does not", "false", "not true"]]}
            solution_sketch: 'By the law $(a^{m})^{n} = a^{mn}$, both powers equal $a^{6}$, because $2 \cdot 3 = 3 \cdot 2 = 6$. So the two powers are equal in every monoid, commutative or not.'
          - problem: 'In a monoid, is $(ab)^{2}$ always equal to $a^{2} b^{2}$?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "it is", "it does", "yes it is", "yes it does", "true", "it is true"], ["no", "it is not", "it does not", "no it is not", "no it does not", "false", "not true"]]}
            solution_sketch: 'We have $(ab)^{2} = abab$ and $a^{2} b^{2} = aabb$, so equality needs $ba = ab$, which a monoid need not satisfy. For the matrices $A$ with rows $(1, 1)$ and $(0, 1)$ and $B$ with rows $(1, 0)$ and $(1, 1)$ the square $(AB)^{2}$ has rows $(5, 3)$ and $(3, 2)$, while $A^{2} B^{2}$ has rows $(5, 2)$ and $(2, 1)$. So the law fails in some monoids.'
          - problem: 'Write the full proof that in every monoid $(M, \cdot, e)$, for every $a \in M$ and all integers $m, n \ge 0$, $(a^{m})^{n} = a^{mn}$. Use the law $a^{p} a^{q} = a^{p+q}$, which holds for all $p, q \ge 0$.'
            answer: '(a^m)^n = a^(mn) for m, n >= 0'
            answer_contract: {"kind": "none"}
            solution_sketch: 'Fix $a \in M$ and an integer $m \ge 0$. We prove $(a^{m})^{n} = a^{mn}$ by induction on $n$. Base case $n = 0$: by the definition of the zeroth power, $(a^{m})^{0} = e$, and $a^{m \cdot 0} = a^{0} = e$. So both sides equal $e$. Inductive hypothesis: assume $(a^{m})^{k} = a^{mk}$ for some integer $k \ge 0$. Inductive step: the definition of powers, applied to the element $a^{m}$, gives $(a^{m})^{k+1} = (a^{m})^{k} a^{m}$. The hypothesis replaces the first factor, so $(a^{m})^{k} a^{m} = a^{mk} a^{m}$. The law $a^{p} a^{q} = a^{p+q}$ with $p = mk$ and $q = m$ gives $a^{mk} a^{m} = a^{mk+m}$, and $mk + m = m(k + 1)$. Hence $(a^{m})^{k+1} = a^{m(k+1)}$, the claim for $k + 1$. By induction, $(a^{m})^{n} = a^{mn}$ for every $n \ge 0$, and $m$ was arbitrary.'
        constraints: 'the law $(a^{m})^{n} = a^{mn}$ as exponent arithmetic, the induction step, and the failure of $(ab)^{n} = a^{n} b^{n}$ without commutativity; one induction proof'
    diagnostic_exemplar:
      problem: 'In an arbitrary monoid, prove by induction on $n$ that $a^{m}a^{n} = a^{m+n}$ for all integers $m, n \ge 0$, and use it to show $(a^{2})^{3} = a^{6}$.'
      answer: 'Powers are defined by $a^{0} = e$ and $a^{k+1} = a^{k}a$. Fix $m \ge 0$ and induct on $n$. Base $n = 0$: $a^{m}a^{0} = a^{m}e = a^{m} = a^{m+0}$. Step: assume $a^{m}a^{n} = a^{m+n}$; then $a^{m}a^{n+1} = a^{m}(a^{n}a) = (a^{m}a^{n})a = a^{m+n}a = a^{m+n+1}$, using associativity and the definition. So the law holds for all $n \ge 0$, and $m$ was arbitrary. Consequently $(a^{2})^{3} = a^{2}a^{2}a^{2} = a^{4}a^{2} = a^{6}$.'
      solution_sketch: 'Induct on the second exponent, peeling one factor with $a^{n+1} = a^{n}a$ and re-associating; then apply the law twice.'
    anki_seeds:
      - front: '$a^{0}$ in a monoid?'
        back: 'The identity $e$ (by convention/recursive definition).'
        type: basic
      - front: 'When does $(ab)^{n} = a^{n} b^{n}$ hold in a monoid?'
        back: 'When $a$ and $b$ commute ($ab = ba$); not in general.'
        type: basic

  - id: inverse-elements
    name: "Invertible Elements"
    core: true
    difficulty: 0.62
    drill: false
    answer_kind: proof
    expected_time_secs: 170
    prerequisites:
      - id: monoids
        weight: 0.6
        key: true
      - id: function-composition-inverse
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: "Invertibility in number monoids"
        key_prerequisites: [monoids]
        step_check:
          step: 'the operation is $+$ and the identity is $0$'
          question: 'Why is the test for an inverse of $a$ in this monoid written $a + x = 0$ and not $a + x = 1$?'
          options:
            - 'The identity of a monoid is always $0$, whatever the operation is'
            - 'An inverse returns the identity, and the identity here is $0$'
            - 'The number $1$ is not an element of the set $\mathbb{N}_{0}$ at all'
            - 'Every element of the monoid must add up to the number $0$ with itself'
          answer: 'An inverse returns the identity, and the identity here is $0$'
          why: 'An inverse of $a$ combines with $a$ to give the identity element. For the operation $+$ the identity is $0$, so the test is $a + x = 0$.'
        exemplars:
          - problem: 'In the monoid $(\mathbb{Q}, \cdot, 1)$ of rational numbers under multiplication, find the inverse of $-\frac{4}{5}$.'
            answer: '-5/4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The identity of this monoid is $1$, so the inverse $x$ of $-\frac{4}{5}$ satisfies $-\frac{4}{5} \cdot x = 1$. Hence $x = -\frac{5}{4}$. The product in the other order is also $1$, so $x$ is a two-sided inverse.'
          - problem: 'In the monoid $(\mathbb{Z}, +, 0)$ of integers under addition, find the inverse of $13$.'
            answer: '-13'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The operation is addition and the identity is $0$. The inverse $y$ of $13$ satisfies $13 + y = 0$, so $y = -13$. The reciprocal $\frac{1}{13}$ is the wrong idea here, because the operation is not multiplication.'
          - problem: 'A dial has $12$ positions numbered $0$ to $11$. Moves of the dial combine by addition modulo $12$, in the monoid $(\mathbb{Z}_{12}, +, 0)$. The dial is turned forward by $5$ positions. By how many positions forward must it be turned next to return to its starting position?'
            answer: '7'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'We need $x$ with $5 + x \equiv 0 \pmod{12}$, which is the inverse of $5$ in $(\mathbb{Z}_{12}, +, 0)$. Since $5 + 7 = 12 \equiv 0$, we get $x = 7$.'
          - problem: 'A scrambler replaces each digit $d$ by $7d$ modulo $10$. By which number $u$, with $0 \le u \le 9$, must a scrambled digit be multiplied, modulo $10$, to restore the original digit?'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Restoring the digit means multiplying by the inverse of $7$ in the monoid of multiplication modulo $10$, so $7u \equiv 1 \pmod{10}$. Since $7 \cdot 3 = 21 \equiv 1$, we get $u = 3$.'
          - problem: 'Find the smallest integer greater than $1$ that has no inverse in the monoid $(\mathbb{Z}, \cdot, 1)$.'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'An inverse of $2$ would be an integer $b$ with $2b = 1$. This gives $b = \frac{1}{2}$, which is not an integer. So $2$ has no inverse, and it is the smallest integer greater than $1$.'
          - problem: 'Sam says that the inverse of $\frac{6}{11}$ in the monoid $(\mathbb{Q}, \cdot, 1)$ is $-\frac{6}{11}$. What is the correct inverse?'
            answer: '11/6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Sam found the additive inverse, which gives $0$ when added to $\frac{6}{11}$. The operation here is multiplication with identity $1$, so we need $x$ with $\frac{6}{11} \cdot x = 1$. Hence $x = \frac{11}{6}$.'
          - problem: 'Which integers have an inverse in the monoid $(\mathbb{Z}, \cdot, 1)$?'
            answer: '1 and -1'
            answer_contract: {"kind": "label", "options": [["1 and -1", "1, -1", "-1 and 1", "plus or minus 1", "only 1 and -1", "\u00b11", "x = 1 or x = -1", "the integers 1 and -1"], ["all integers", "every integer", "all of them"], ["nonzero integers", "all nonzero integers", "every nonzero integer", "all integers except 0"], ["0 and 1", "1 and 0"]]}
            solution_sketch: 'The integers $1$ and $-1$ have inverses, since $1 \cdot 1 = 1$ and $(-1)(-1) = 1$. For any other integer $a$, an inverse $b$ would need $|a||b| = 1$, which forces $|a| = 1$. So $2$ and $0$ and every other integer have no inverse.'
          - problem: 'Write the full proof that the invertible elements of the monoid $(\mathbb{Z}, \cdot, 1)$ are exactly $1$ and $-1$. An integer $a$ is invertible if $ab = 1$ for some integer $b$.'
            answer: 'units of (Z, *, 1) are exactly 1, -1'
            answer_contract: {"kind": "none"}
            solution_sketch: 'Suppose first that $a = 1$ or $a = -1$. Then $1 \cdot 1 = 1$ and $(-1)(-1) = 1$, so $a$ is invertible, with $b = a$. Conversely, suppose that $a$ is invertible, so $ab = 1$ for some integer $b$. Neither $a$ nor $b$ is $0$, because $0 \cdot b = 0 \ne 1$. Hence $|a|$ and $|b|$ are positive integers, so $|a| \ge 1$ and $|b| \ge 1$. Taking absolute values, $|a||b| = |ab| = 1$. If $|a| \ge 2$, then $|a||b| \ge 2 \cdot 1 = 2$, a contradiction. So $|a| = 1$, which means $a = 1$ or $a = -1$. Therefore the invertible elements are exactly $1$ and $-1$.'
        constraints: 'inverses in number monoids: Q under multiplication, Z under addition, Z under multiplication, residues mod n; contexts of dials and scramblers; one proof'
      - id: kp2
        name: "Invertibility in the function monoid"
        key_prerequisites: [function-composition-inverse]
        step_check:
          step: 'Compute $g(2) = 2$ and $g(-2) = 2$, so $g$ is not injective'
          question: 'Why does $g(2) = g(-2)$ show that $g$ has no inverse in this monoid?'
          options:
            - 'An inverse would have to send the output $2$ back to both $2$ and $-2$'
            - 'Two inputs with one output make $g \circ g$ equal to the identity function'
            - 'An inverse must send every positive number to a negative number, and $g$ does not'
            - 'A function that takes the value $2$ twice must take every value twice as well'
          answer: 'An inverse would have to send the output $2$ back to both $2$ and $-2$'
          why: 'An inverse $h$ gives $h(g(x)) = x$ for every $x$. With $g(2) = g(-2)$ this would force $h(2)$ to equal $2$ and $-2$ at once.'
        try_first:
          problem: 'In the monoid of all functions from $\mathbb{R}$ to $\mathbb{R}$ under composition, is $f(x) = 2^{x}$ invertible?'
          answer_contract: {"kind": "label", "options": [["yes", "it is", "it does", "yes it is", "yes it does", "true", "it is true"], ["no", "it is not", "it does not", "no it is not", "no it does not", "false", "not true"]]}
          answer: 'no'
          reveal: 'No. The value $2^{x}$ is always positive, so no input gives the output $-1$, and an inverse function would have no value to return there. An invertible function must be injective and surjective.'
        exemplars:
          - problem: 'In the monoid of all functions from $\mathbb{R}$ to $\mathbb{R}$ under composition, find the inverse of $f(x) = 3x + 2$.'
            answer: '(x - 2)/3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'An inverse $h$ satisfies $f(h(x)) = x$ and $h(f(x)) = x$. Solving $y = 3x + 2$ for $x$ gives $x = \frac{y - 2}{3}$, so $h(x) = \frac{x - 2}{3}$. Check: $f(h(x)) = 3 \cdot \frac{x - 2}{3} + 2 = x$, and $h(f(x)) = \frac{3x + 2 - 2}{3} = x$.'
          - problem: 'Is $f(x) = x^{2}$ invertible in the monoid of all functions from $\mathbb{R}$ to $\mathbb{R}$ under composition?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "it is", "it does", "yes it is", "yes it does", "true", "it is true"], ["no", "it is not", "it does not", "no it is not", "no it does not", "false", "not true"]]}
            solution_sketch: 'An invertible function must be injective. But $f(2) = 4 = f(-2)$, so $f$ is not injective. An inverse $h$ would need $h(4) = 2$ and $h(4) = -2$ at once, which is impossible for a function.'
          - problem: 'Find the inverse of $g(x) = \frac{x}{2} - 4$ in the monoid of all functions from $\mathbb{R}$ to $\mathbb{R}$ under composition.'
            answer: '2x + 8'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Solving $y = \frac{x}{2} - 4$ for $x$ gives $\frac{x}{2} = y + 4$, so $x = 2y + 8$. Hence $g^{-1}(x) = 2x + 8$. Check: $g(2x + 8) = \frac{2x + 8}{2} - 4 = x$.'
          - problem: 'Sam says that $h(x) = \sqrt{|x|}$ is the inverse of $f(x) = x^{2}$ in the monoid of all functions from $\mathbb{R}$ to $\mathbb{R}$ under composition. Find an integer $x$ for which $h(f(x)) \ne x$.'
            answer: '-3'
            answer_contract: {"kind": "property", "check": "integer_in_range", "args": {"max": -1}}
            solution_sketch: 'We have $h(f(x)) = \sqrt{|x^{2}|} = |x|$, which equals $x$ only when $x \ge 0$. For $x = -3$ we get $h(f(-3)) = h(9) = 3 \ne -3$, so $h$ is not an inverse of $f$. Every negative integer is such an example.'
          - problem: 'A cipher encrypts every number $x$ as $y = 5x - 2$. The encrypted value $33$ arrives. Which number $x$ was encrypted?'
            answer: '7'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Decrypting means applying the inverse function. Solving $y = 5x - 2$ for $x$ gives $x = \frac{y + 2}{5}$. For $y = 33$ we get $x = \frac{35}{5} = 7$. Check: $5 \cdot 7 - 2 = 33$.'
          - problem: 'The function $F(c) = \frac{9}{5}c + 32$ converts a temperature of $c$ degrees Celsius to degrees Fahrenheit. A thermometer shows $77$ degrees Fahrenheit. What is the temperature in degrees Celsius?'
            answer: '25'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Converting back means applying the inverse function. Solving $F = \frac{9}{5}c + 32$ for $c$ gives $c = \frac{5}{9}(F - 32)$. For $F = 77$ we get $c = \frac{5}{9} \cdot 45 = 25$.'
          - problem: 'Is $k(x) = x^{3}$ invertible in the monoid of all functions from $\mathbb{R}$ to $\mathbb{R}$ under composition?'
            answer: 'yes'
            answer_contract: {"kind": "label", "options": [["yes", "it is", "it does", "yes it is", "yes it does", "true", "it is true"], ["no", "it is not", "it does not", "no it is not", "no it does not", "false", "not true"]]}
            solution_sketch: 'Every real number has exactly one real cube root, so $h(x) = \sqrt[3]{x}$ is a function from $\mathbb{R}$ to $\mathbb{R}$. Then $k(h(x)) = x$ and $h(k(x)) = x$ for every real $x$. So $h$ is a two-sided inverse of $k$.'
          - problem: 'Write the full proof that in the monoid of all functions from $\mathbb{R}$ to $\mathbb{R}$ under composition, the function $f(x) = 4x - 1$ has an inverse, but the function $g(x) = x^{2} + 1$ does not. A function $h$ is an inverse of $f$ if $f \circ h = h \circ f = \mathrm{id}$, where $\mathrm{id}(x) = x$.'
            answer: 'f invertible; g is not'
            answer_contract: {"kind": "none"}
            solution_sketch: 'Invertibility of $f$. Define $h(x) = \frac{x + 1}{4}$, a function from $\mathbb{R}$ to $\mathbb{R}$. For every real $x$, $(f \circ h)(x) = 4 \cdot \frac{x + 1}{4} - 1 = (x + 1) - 1 = x$, and $(h \circ f)(x) = \frac{(4x - 1) + 1}{4} = x$. So $f \circ h = h \circ f = \mathrm{id}$, and $f$ is invertible. Non-invertibility of $g$. Suppose, for contradiction, that some function $h$ satisfies $h \circ g = \mathrm{id}$. Then $h(g(1)) = 1$ and $h(g(-1)) = -1$. But $g(1) = 2 = g(-1)$, so $h(2) = 1$ and $h(2) = -1$, which is impossible for a function. Hence $g$ has no inverse. The same conclusion follows from surjectivity: $g(x) = x^{2} + 1 \ge 1$ for every real $x$, so $g(h(0)) = 0$ is impossible for any function $h$, and no $h$ satisfies $g \circ h = \mathrm{id}$.'
        constraints: 'invertible iff bijective in the function monoid; find an inverse function, test invertibility, use the inverse in a context; one proof'
      - id: kp3
        name: "Solving equations with inverses"
        key_prerequisites: [monoids]
        step_check:
          step: 'right-multiply both sides by $a^{-1}$'
          question: 'Why is the multiplication by $a^{-1}$ done on the right in $x * a = b$?'
          options:
            - 'Because multiplying on the left would change the value of $b$ on one side only'
            - 'Because every product in a monoid must be formed from the right-hand side'
            - 'Because $a$ stands to the right of $x$, so $a * a^{-1} = e$ removes it'
            - 'Because the law $a * a^{-1} = e$ holds only for the factor on the right'
          answer: 'Because $a$ stands to the right of $x$, so $a * a^{-1} = e$ removes it'
          why: 'In $(x * a) * a^{-1}$ associativity gives $x * (a * a^{-1}) = x * e = x$. A monoid need not be commutative, so the side matters.'
        exemplars:
          - problem: 'In the monoid of integers modulo $11$ under multiplication, the element $5$ has inverse $9$, since $5 \cdot 9 = 45 \equiv 1$. Solve $5x \equiv 3 \pmod{11}$ for $x$ with $0 \le x \le 10$.'
            answer: '5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Multiply both sides by the inverse $9$: $x \equiv 9 \cdot 3 = 27 \equiv 5 \pmod{11}$. Check: $5 \cdot 5 = 25 = 2 \cdot 11 + 3$, so the solution works.'
          - problem: 'Solve $4x \equiv 7 \pmod 9$ for $x$ with $0 \le x \le 8$.'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The inverse of $4$ modulo $9$ is $7$, because $4 \cdot 7 = 28 = 3 \cdot 9 + 1$. Multiplying both sides by $7$ gives $x \equiv 7 \cdot 7 = 49 \equiv 4 \pmod 9$. Check: $4 \cdot 4 = 16 \equiv 7$.'
          - problem: 'A cipher adds $11$ to every letter number, modulo $26$. The ciphertext letter number is $4$. Which letter number was encrypted?'
            answer: '19'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'We need $11 + x \equiv 4 \pmod{26}$. Adding the inverse of $11$, which is $15$, to both sides gives $x \equiv 15 + 4 = 19 \pmod{26}$. Check: $11 + 19 = 30 = 26 + 4$.'
          - problem: 'A pointer on a dial with $12$ positions starts at $0$. Each press of a button moves it $7$ positions forward, modulo $12$. How many presses, from $1$ to $12$, put the pointer at position $5$?'
            answer: '11'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'After $n$ presses the pointer is at $7n \bmod 12$, so we solve $7n \equiv 5 \pmod{12}$. The inverse of $7$ is $7$, since $7 \cdot 7 = 49 \equiv 1$. Then $n \equiv 7 \cdot 5 = 35 \equiv 11 \pmod{12}$. Check: $7 \cdot 11 = 77 = 6 \cdot 12 + 5$.'
          - problem: 'Solve $7x \equiv 5 \pmod{13}$ for $x$ with $0 \le x \le 12$.'
            answer: '10'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The inverse of $7$ modulo $13$ is $2$, because $7 \cdot 2 = 14 \equiv 1$. Multiplying both sides by $2$ gives $x \equiv 2 \cdot 5 = 10 \pmod{13}$. Check: $7 \cdot 10 = 70 = 5 \cdot 13 + 5$.'
          - problem: 'In a monoid, the element $a$ is invertible and $a x = b$. Is the solution $x = a^{-1} b$ or $x = b a^{-1}$?'
            answer: 'a^-1 b'
            answer_contract: {"kind": "label", "options": [["a^-1 b", "a^-1*b", "a^(-1) b", "a^(-1)b", "a^{-1}b", "a^{-1} b", "x = a^-1 b", "a inverse times b"], ["b a^-1", "b*a^-1", "b a^(-1)", "ba^(-1)", "ba^{-1}", "b a^{-1}", "x = b a^-1", "b times a inverse"]]}
            solution_sketch: 'The element $a$ stands on the left of $x$, so multiply both sides on the left by $a^{-1}$: $a^{-1}(a x) = a^{-1} b$. Associativity gives $(a^{-1} a) x = x$, so $x = a^{-1} b$. The product $b a^{-1}$ solves $x a = b$ instead, and it differs when the monoid is not commutative.'
          - problem: 'Write the full proof that if $a$ is an invertible element of a monoid $(M, *, e)$ with inverse $a^{-1}$, that is $a * a^{-1} = a^{-1} * a = e$, then for every $b \in M$ the equation $a * x = b$ has exactly one solution $x \in M$, namely $x = a^{-1} * b$.'
            answer: 'a*x = b has unique solution a^-1 * b'
            answer_contract: {"kind": "none"}
            solution_sketch: 'Existence. Put $x = a^{-1} * b$. Then $a * x = a * (a^{-1} * b) = (a * a^{-1}) * b = e * b = b$, using associativity, the inverse law $a * a^{-1} = e$ and the identity law. So $x$ is a solution. Uniqueness. Let $x$ be any solution, so $a * x = b$. Multiply both sides on the left by $a^{-1}$ to get $a^{-1} * (a * x) = a^{-1} * b$. By associativity and the inverse law $a^{-1} * a = e$, the left side is $(a^{-1} * a) * x = e * x = x$. Hence $x = a^{-1} * b$, so every solution equals this one. Therefore the equation has exactly one solution.'
        constraints: 'solve $a x = b$ with the inverse of $a$ in residues mod n and in abstract monoids; contexts of ciphers and dials; one proof'
    diagnostic_exemplar:
      problem: 'Prove that if $a$ is invertible in a monoid $(M, *, e)$ then $a * x = b$ has the unique solution $x = a^{-1} * b$, and use this to solve $3x \equiv 5 \pmod 7$.'
      answer: 'Existence: $a * (a^{-1} * b) = (a * a^{-1}) * b = e * b = b$, so $x = a^{-1} * b$ solves the equation. Uniqueness: if $a * x = b$, multiply on the left by $a^{-1}$ and use associativity: $x = e * x = (a^{-1} * a) * x = a^{-1} * (a * x) = a^{-1} * b$. For $3x \equiv 5 \pmod 7$: in multiplication mod $7$ the element $3$ is invertible with $3^{-1} = 5$, since $3 \cdot 5 = 15 \equiv 1$; hence $x \equiv 5 \cdot 5 = 25 \equiv 4 \pmod 7$, and indeed $3 \cdot 4 = 12 \equiv 5$.'
      solution_sketch: 'Substitute for existence and left-multiply by the inverse for uniqueness; then find the inverse of $3$ mod $7$ and apply the formula.'
    anki_seeds:
      - front: 'Invertible elements of $(\mathbb{Z}, \cdot)$?'
        back: 'Only $\pm 1$.'
        type: basic
      - front: 'In the monoid of functions $X \to X$ under composition, $f$ is invertible iff...'
        back: '$f$ is a bijection.'
        type: basic

  - id: groups-intro
    name: "Introduction to Groups"
    core: true
    difficulty: 0.65
    drill: false
    answer_kind: proof
