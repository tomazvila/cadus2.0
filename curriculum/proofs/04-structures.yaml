            solution_sketch: "A monoid has a two-sided identity e with n + e = e + n = n for every natural number n. In ordinary addition, e = 0 satisfies n + 0 = 0 + n = n. The answer is 0."
          - problem: "Consider the monoid formed by the integers under multiplication with its usual two-sided identity. Give that identity element."
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "A monoid has a two-sided identity e with n * e = e * n = n for every integer n. In ordinary multiplication, e = 1 satisfies n * 1 = 1 * n = n. The answer is 1."
          - problem: "For the operation table of the numbers modulo 5 under addition, compute the entry for row 4 and column 3."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The table entry for row 4 and column 3 is the sum 4 + 3 reduced modulo 5. Since 4 + 3 = 7 and 7 - 5 = 2, the entry is 2. The answer is 2."
          - problem: "For the operation table of the numbers modulo 5 under addition, compute (2 * 4) * 3, where * is the table operation."
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "First compute 2 * 4 using addition modulo 5: 2 + 4 = 6, and 6 - 5 = 1. Then compute 1 * 3: 1 + 3 = 4, which is already less than 5. The answer is 4."
          - problem: "For the operation table of the numbers modulo 5 under addition, find the two-sided identity element. Give the identity element."
            answer: "0"
            answer_contract: {"kind": "exact"}
            solution_sketch: "An identity element e must satisfy x * e = e * x = x for every x. In addition modulo 5, the element 0 works because x + 0 = 0 + x = x. The answer is 0."
          - problem: "Claim: the natural numbers under multiplication with 0 form a monoid. Step 1: for natural numbers a and b, the product ab is a natural number, so the operation is closed. Step 2: multiplication of natural numbers is associative. Step 3: since a times 0 equals 0 for every natural number a, the element 0 is a two-sided identity. Step 4: therefore the natural numbers under multiplication with 0 form a monoid. Which step is the first step that is not valid?"
            answer: "Step 3"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "Step 1 is valid because the product of two natural numbers is a natural number. Step 2 is valid because multiplication of natural numbers is associative. Step 3 is false because a times 0 equals 0, not a; a two-sided identity must leave every element unchanged, and for multiplication the identity is 1. Step 4 is wrong because it depends on the false Step 3. The answer is Step 3."
          - problem: "Write the full proof: the set of even integers under addition, with 0, is a monoid. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1 Closure: let a and b be even integers. Then a = 2m and b = 2n for integers m and n, so a + b = 2(m + n), which is even. Step 2 Associativity: addition of even integers is inherited from addition of integers, and integer addition is associative. Step 3 Identity: the integer 0 is even, and for every even integer a, a + 0 = 0 + a = a, so 0 is a two-sided identity. Step 4 Conclusion: the set of even integers is closed under addition, addition is associative on this set, and 0 is a two-sided identity. Therefore the set of even integers under addition with 0 is a monoid. This completes the proof."
        constraints: "verify closure, associativity, and a two-sided identity"
      - id: kp2
        name: "Uniqueness of the identity"
        key_prerequisites: [binary-operations]
        exemplars:
          - problem: "Suppose a monoid has two identity elements a and b. The identity law for a says that for every x, a*x = x. Apply this law to x = b. Give the resulting expression for a*b."
            answer: "b"
            answer_contract: {"kind": "function", "vars": ["a", "b"]}
            solution_sketch: "Let a and b be identity elements. Step 1: the identity law for a gives a*x = x for every x. Step 2: put x = b, so a*b = b. The simplified product is b."
          - problem: "Suppose a monoid has two identity elements a and b. The identity law for b says that for every x, x*b = x. Apply this law to x = a. Give the resulting expression for a*b."
            answer: "a"
            answer_contract: {"kind": "function", "vars": ["a", "b"]}
            solution_sketch: "Let a and b be identity elements. Step 1: the identity law for b gives x*b = x for every x. Step 2: put x = a, so a*b = a. The simplified product is a."
          - problem: "The operation table of a monoid on elements 0,1,2 is: row 0 gives 0,1,2; row 1 gives 1,1,1; row 2 gives 2,2,2. Row 0 and column 0 show that 0 is the identity. A student claims that 1 is also an identity. If 1 were an identity, then 1*0 would have to equal 0. Use the table to compute 1*0. Give the value."
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Read the table: row 0 and column 0 make 0 the identity. Step 1: if 1 were also an identity, then 1*0 would equal 0. Step 2: the table gives 1*0 = 1. Since 1 is not 0, the claim fails. The computed value is 1."
          - problem: "In the monoid of integers modulo 6 under addition, let a and b be identity elements. The identity law for b gives a + b = a, and the identity law for a gives a + b = b. Subtract the first equation from the second to compute a - b modulo 6. Give the value."
            answer: "0"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Let a and b be identity elements in the integers modulo 6 under addition. Step 1: the identity law for b gives a + b = a. Step 2: the identity law for a gives a + b = b. Step 3: subtract the first equation from the second, so a - b = 0 modulo 6. The value of a - b modulo 6 is 0."
          - problem: "Proposed argument that a monoid has at most one identity element: Step 1: let a and b be identity elements of the monoid. Step 2: the identity law for b gives a*b = a. Step 3: the identity law for a gives b*a = a. Step 4: the two displayed products force a = b. Which step is the first step that is not valid?"
            answer: "Step 3"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "Step 1 sets up two candidate identity elements and is valid. Step 2 is valid: the identity law for b says x*b = x for every x, and with x = a it gives a*b = a. Step 3 is the first invalid step: the identity law for a says b*a = b, not b*a = a, so the step misapplies the law on the wrong product. Step 4 is also not valid, but it fails only after Step 3, because the corrected pair a*b = a and a*b = b would indeed force a = b. The answer is Step 3."
          - problem: "In the uniqueness proof, let a and b be identity elements. The line between 'a is an identity' and 'therefore a = b' is missing. Select the missing line that plays the two identities against each other."
            answer: "$a = a*b = b$"
            answer_contract: {"kind": "label", "options": [["$a = a*b = b$"], ["$a = b*a = b$"], ["$a*b = a = b$"], ["$a = a*b = a$"]]}
            solution_sketch: "Correct line: a is an identity, so a*b = b; b is an identity, so a*b = a; hence a = a*b = b. The option a = b*a = b reverses the product and does not use the identity law for a. The option a*b = a = b has the equalities in the wrong places. The option a = a*b = a drops the second identity and cannot give b. The answer is $a = a*b = b$."
          - problem: "Write the full proof: in any monoid, the identity element is unique. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Proof. Let (M, *) be a monoid and suppose a and b are both identity elements. Step 1: because b is an identity, a*b = a. Step 2: because a is an identity, a*b = b. Step 3: the left sides are the same, so a = b. Therefore any two identity elements of M are equal, and the identity element is unique. This proves the statement."
        constraints: "play the two identities against each other"
      - id: kp3
        name: "Recognizing monoids and non-examples"
        key_prerequisites: [binary-operations]
        exemplars:
          - problem: "The integers with the operation a*b = a - b and the element 0 are proposed as a monoid. Take a = 7, b = 4 and c = 2. Give the verdict on the bracketing axiom and the value of a*(b*c) - (a*b)*c."
            answer: "verdict = fails; diff = 4"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["holds"], ["fails"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "diff"}]}
            solution_sketch: "Test the bracketing axiom on the triple a = 7, b = 4, c = 2. The first bracketing is (a*b)*c = (7 - 4) - 2 = 3 - 2 = 1, by the definition of the operation. The second bracketing is a*(b*c) = 7 - (4 - 2) = 7 - 2 = 5, by the definition again. The difference is 5 - 1 = 4, and one triple with different bracketings means the axiom fails, so the structure is not a monoid. The answer is verdict = fails; diff = 4."
          - problem: "The two by two real matrices with the usual multiplication and the identity matrix I are proposed as a monoid. Take A = [[3,1],[2,5]]. Give the verdict on the neutral element axiom and the entry in row 1 column 1 of A*I."
            answer: "verdict = holds; entry = 3"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["holds"], ["fails"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "entry"}]}
            solution_sketch: "The neutral element axiom asks for I*A = A*I = A for every two by two real matrix A. Compute I*A for A = [[3,1],[2,5]]: multiplying by the identity leaves the matrix unchanged, so I*A = [[3,1],[2,5]]. Its entry in row 1 column 1 is 3. The axiom holds because I fixes every matrix, and matrix multiplication is closed and associative on this set. The answer is verdict = holds; entry = 3."
          - problem: "On the integers define a*b = a + b + 1. Give the integer k such that a*k = k*a = a for every integer a."
            answer: "-1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The neutral element k must satisfy a*k = a for every integer a. Substitute the operation: a*k = a + k + 1, so a + k + 1 = a forces k = -1. Check the other side: k*a = -1 + a + 1 = a, so the same value works on both sides. The operation is associative because (a*b)*c = a + b + c + 2 = a*(b*c), so the integers with this operation and k = -1 form a monoid. The answer is -1."
          - problem: "The integers modulo 7 under multiplication form a monoid with neutral element 1. Give the smallest positive exponent n such that 2^n is congruent to 1 modulo 7."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Compute the powers of 2 modulo 7 in order: 2^1 = 2, 2^2 = 4, and 2^3 = 8, which is 1 modulo 7. The smallest positive exponent that reaches the neutral element 1 is 3, and that exponent is the order of 2 in this monoid. The answer is 3."
          - problem: "The set {0, 1, 2, 3} with multiplication modulo 6 is proposed as a monoid with neutral element 1. Give the smallest product of two elements of the set, reduced modulo 6, that is not an element of the set."
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Check closure by looking at the products of pairs from {0, 1, 2, 3}. Any product with 0 or 1 stays in the set, and 3*3 = 9 reduces to 3 modulo 6, which also stays in the set. The product 2*2 = 4 is not in the set, and no smaller product leaves the set, so 4 is the smallest witness of a closure failure. The answer is 4."
          - problem: "On the set of positive rational numbers define a*b as the usual product of a and b, divided by 2. The structure with this operation is proposed as a monoid. Give the rational number k such that a*k = k*a = a for every positive rational a."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1, the neutral element axiom: k must satisfy a*k = k*a = a for every element of the set. Step 2, substitution into the definition: a*k is the usual product of a and k divided by 2, and setting this equal to a forces k = 2. Step 3, the other side: k*a is the usual product of 2 and a divided by 2, which is a, so k = 2 works on both sides. Step 4, associativity: (a*b)*c is the product abc divided by 4, which equals a*(b*c), so all axioms hold and the structure with k = 2 is a monoid. The answer is 2."
          - problem: "Write the full proof: for every set S, the power set of S under union with the empty set as neutral element is a monoid. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Let S be a set and let P(S) be its power set, with the operation of union and the empty set as the candidate neutral element. Closure: if A and B are subsets of S, then every element of A union B lies in S, so A union B is a subset of S and hence lies in P(S). Associativity: an element belongs to (A union B) union C exactly when it belongs to A or to B or to C, and the same description holds for A union (B union C), so the two sets are equal. Neutral element: the empty set is a subset of S, and A union empty = empty union A = A for every subset A of S. All three axioms hold, so the power set of S with union and the empty set is a monoid."
        constraints: "check the axioms; a single failure rules out a monoid"
    diagnostic_exemplar:
      problem: 'Show that the set of functions $X \to X$ under composition, with $\mathrm{id}_X$, is a monoid, and prove that the identity element of any monoid is unique.'
      answer: 'Closure: the composite of two functions $X \to X$ is again a function $X \to X$. Associativity: for every $x$, $((f \circ g) \circ h)(x) = f(g(h(x))) = (f \circ (g \circ h))(x)$, so the two composites agree. Identity: $(\mathrm{id}_X \circ f)(x) = f(x) = (f \circ \mathrm{id}_X)(x)$ for all $x$, so $\mathrm{id}_X$ is a two-sided identity. Hence this is a monoid. Uniqueness in general: if $e_1$ and $e_2$ are both identities of a monoid, then $e_1 = e_1 * e_2 = e_2$ — the first equality because $e_2$ is an identity, the second because $e_1$ is.'
      solution_sketch: 'Check closure, associativity and neutrality for composition; the uniqueness argument multiplies the two candidate identities together.'
    anki_seeds:
      - front: 'Definition of a monoid?'
        back: 'A set with an associative binary operation and a two-sided identity element.'
        type: basic
      - front: 'Semigroup vs. monoid?'
        back: 'A semigroup has an associative operation; a monoid additionally has an identity element.'
        type: basic

  - id: powers-in-monoids
    name: "Powers and Exponent Laws"
    core: true
    difficulty: 0.62
    drill: false
    answer_kind: proof
    expected_time_secs: 180
    prerequisites:
      - id: monoids
        weight: 0.5
        key: true
      - id: mathematical-induction
        weight: 0.5
        key: true
    knowledge_points:
      - id: kp1
        name: "Defining and computing powers"
        key_prerequisites: [monoids]
        exemplars:
          - problem: "In the monoid of all functions from $\\mathbb{R}$ to $\\mathbb{R}$ under composition, the identity $e$ is the identity function, and powers follow $a^{0} = e$ and $a^{n+1} = a^{n} a$. Let $f(x) = x + 5$. Give $f^{4}$ as a function of $x$."
            answer: "x+20"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "The full object is $f^{4} = f \\circ f \\circ f \\circ f$, four copies of $f$ under composition. Step 1 (recursive definition $a^{n+1} = a^{n} a$): $f^{1}(x) = f^{0}(f(x)) = f(x) = x + 5$. Step 2 (iterate the same rule): $f^{2}(x) = f^{1}(f(x)) = x + 10$, then $f^{3}(x) = x + 15$, then $f^{4}(x) = x + 20$. Each application of $f$ adds 5, so four applications add 20. The answer is x+20."
          - problem: "In the monoid on the set $\\{0, 1, \\ldots, 9\\}$ with operation multiplication modulo 10, the identity is 1 and powers follow $a^{0} = 1$ and $a^{n+1} = a^{n} a$. Compute $3^{3}$ as p3 and $9^{2}$ as q2."
            answer: "p3 = 7; q2 = 1"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "p3"}, {"contract": {"kind": "exact"}, "name": "q2"}]}
            solution_sketch: "The full objects are $3^{3} = 3 \\cdot 3 \\cdot 3$ and $9^{2} = 9 \\cdot 9$, each reduced modulo 10. Step 1 (recursive definition $a^{n+1} = a^{n} a$): $3^{1} = 3$, $3^{2} = 9$, $3^{3} = 27$, and 27 mod 10 is 7. Step 2 (the same rule for the element 9): $9^{1} = 9$, $9^{2} = 81$, and 81 mod 10 is 1. The answer is p3 = 7; q2 = 1."
          - problem: "In the monoid on the set $\\{1, 2, 3, 4, 5, 6\\}$ with operation multiplication modulo 7, the identity is 1 and powers follow $a^{0} = 1$ and $a^{n+1} = a^{n} a$. The order of an element $a$ is the smallest $n \\geq 1$ with $a^{n} = 1$. Find the order of $2$."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full iteration is $2^{1} = 2$, $2^{2} = 4$, $2^{3} = 8$, $2^{4} = 16$, all under multiplication modulo 7. Step 1 (recursive definition $a^{n+1} = a^{n} a$): $2^{2} = 2 \\cdot 2 = 4$, which is not the identity. Step 2 (the same rule): $2^{3} = 4 \\cdot 2 = 8$, and 8 mod 7 is 1, the identity. No smaller positive exponent works, since $2^{1} = 2$ and $2^{2} = 4$. The answer is 3."
          - problem: "In the monoid of nonnegative integers under addition, the identity is 0, and powers follow $a^{0} = 0$ and $a^{n+1} = a^{n} + a$, because the operation is addition. Compute $5^{3}$ in this monoid."
            answer: "15"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full object is $5^{3} = 5 + 5 + 5$, repeated addition, because the monoid operation is addition. Step 1 (recursive definition $a^{0} = e = 0$): $5^{0} = 0$. Step 2 (the rule $a^{n+1} = a^{n} + a$): $5^{1} = 0 + 5 = 5$, then $5^{2} = 5 + 5 = 10$, then $5^{3} = 10 + 5 = 15$. Reading the power as a product, $5 \\cdot 5 \\cdot 5 = 125$, applies the wrong operation. The answer is 15."
          - problem: "In the monoid of real functions under composition, powers follow $h^{0} = e$, where $e$ is the identity function, and $h^{n+1} = h^{n} h$. A student claims that for $h(x) = 2x$ the power $h^{3}$ satisfies $h^{3}(x) = 6x$, arguing: Step 1: $h^{0}$ is the identity function. Step 2: $h^{1} = h^{0} h$, so $h^{1}(x) = 2x$. Step 3: $h^{2}(x) = h^{1}(h(x)) = 4x$. Step 4: $h^{3}(x) = h^{2}(x) + h(x) = 4x + 2x = 6x$. Which step is the first invalid step?"
            answer: "Step 4"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "The full claim is $h^{3}(x) = 6x$ for $h(x) = 2x$, argued in four numbered steps. Step 1 is valid: $h^{0}$ is the identity by the definition $a^{0} = e$. Step 2 is valid: the recursion $h^{n+1} = h^{n} h$ gives $h^{1} = h$. Step 3 is valid: $h^{2}(x) = h^{1}(h(x)) = 2(2x) = 4x$. Step 4 is invalid: it adds the two functions, but the monoid operation is composition; the recursion gives $h^{3}(x) = h^{2}(h(x)) = 4(2x) = 8x$. Choosing Step 1, Step 2 or Step 3 mistakes a valid line for an invalid one. The answer is Step 4."
          - problem: "In the monoid of all words over the letters a and b, with operation concatenation and identity the empty word, take $w = ab$. Powers follow $w^{0} = e$, where $e$ is the empty word, and $w^{n+1} = w^{n} w$. A computation lists $w^{1} = ab$ and $w^{2} = w^{1} w$, and the line for $w^{3}$ is missing. Select the word that equals $w^{3}$."
            answer: "ababab"
            answer_contract: {"kind": "label", "options": [["ababab"], ["abababab"], ["ababa"], ["ababba"]]}
            solution_sketch: "The full object is $w^{3} = w^{2} w$, three copies of $w$ joined by the recursion. Step 1 (recursive definition $w^{n+1} = w^{n} w$): $w^{1} = ab$. Step 2 (the same rule): $w^{2} = (ab)(ab) = abab$. Step 3 (the same rule again): $w^{3} = (abab)(ab) = ababab$. The option abababab is the error of writing $w^{2} w^{2}$, four copies of $w$. The option ababa is the error of appending only the first letter of $w$. The option ababba is the error of appending the reversed word $ba$. The answer is ababab."
          - problem: "Write the full proof: in the monoid of all functions from $\\mathbb{R}$ to $\\mathbb{R}$ under composition, with $f(x) = x + 3$, prove by induction on $n$ that $f^{n}(x) = x + 3n$ for every $n \\geq 0$. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Base case, $n = 0$: by the definition $a^{0} = e$, the power $f^{0}$ is the identity function, so $f^{0}(x) = x = x + 3 \\cdot 0$, and the claim holds. Inductive hypothesis: assume $f^{k}(x) = x + 3k$ for one $k \\geq 0$ and every input $x$. Inductive step: by the recursive definition $f^{k+1} = f^{k} f$, so $f^{k+1}(x) = f^{k}(f(x)) = f^{k}(x + 3)$. The hypothesis at the input $x + 3$ gives $(x + 3) + 3k = x + 3(k + 1)$, which is the claim for $k + 1$. Conclusion: by induction, $f^{n}(x) = x + 3n$ for every $n \\geq 0$."
        constraints: "iterate a concrete monoid element; recursive definition $a^{n+1} = a^{n} a$, $a^{0} = e$"
      - id: kp2
        name: "The law $a^{m} a^{n} = a^{m+n}$"
        key_prerequisites: [mathematical-induction]
        exemplars:
          - problem: "In the inductive step for fixed m, the product a^m a^{n+1} is rewritten as a^m (a^n a), then by associativity as (a^m a^n) a. The induction hypothesis replaces a^m a^n. Give the exponent in the resulting power of a."
            answer: "m+n+1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Fix m and induct on n. In the step, a^{n+1} = a^n a, so a^m a^{n+1} = a^m (a^n a). Associativity regroups this as (a^m a^n) a. The induction hypothesis replaces a^m a^n by a^{m+n}. The resulting power is a^{m+n+1}, so the exponent is m+n+1."
          - problem: "In the monoid of integers under multiplication, let a = 3, m = 2 and n = 4. Use the law a^m a^n = a^{m+n} to compute a^m a^n. Give the value."
            answer: "729"
            answer_contract: {"kind": "exact"}
            solution_sketch: "In this monoid the operation is multiplication. The law gives a^2 a^4 = a^{2+4} = a^6. With a = 3 this is 3^6. Compute 3^6 = 729."
          - problem: "In the law a^m a^n = a^{m+n}, let m = 4 and n = 2. Give the exponent on the right side."
            answer: "6"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The law a^m a^n = a^{m+n} adds the exponents m and n. Here m = 4 and n = 2. The exponent on the right side is 4 + 2 = 6."
          - problem: "Claim: In a monoid, a^m a^{n+1} = a^{m+n+1}. Step 1: a^{n+1} = a^n a. Step 2: a^m a^{n+1} = a^m (a^n a). Step 3: a^m (a^n a) = (a^n a^m) a. Step 4: the induction hypothesis gives a^m a^n = a^{m+n}, so the exponent is m+n+1. Which step is the first step that is not valid?"
            answer: "Step 3"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "Step 1 is the definition of a^{n+1} and is valid. Step 2 substitutes that definition into a^m a^{n+1} and is valid. Step 3 is not valid: it swaps a^m and a^n, which uses commutativity, not associativity. Step 4 would be correct after the valid regrouping. The first invalid step is Step 3."
          - problem: "In the induction step with m fixed, the chain of equalities is: a^m a^(n+1) = a^m (a^n a) = (a^m a^n) a = [missing] = a^(m+n+1). The middle line of the chain has been erased. Select the missing line."
            answer: "a^(m+n) a"
            answer_contract: {"kind": "label", "options": [["a^(m+n) a"], ["a^(m+n+1) a"], ["a^(mn) a"], ["a^(m+n) a^(n)"]]}
            solution_sketch: "Associativity regroups a^m (a^n a) as (a^m a^n) a, and the hypothesis replaces a^m a^n by a^(m+n), leaving a^(m+n) a. The option a^(m+n+1) a adds one to the exponent too early, before the outer factor a is attached. The option a^(mn) a multiplies the exponents, confusing the product law with a power of a power. The option a^(m+n) a^(n) keeps an extra factor a^n instead of the single outer a. The answer is a^(m+n) a."
          - problem: "In a proof of the product law for powers in a monoid, one fixes the exponent m and inducts on the other exponent. In the step, the hypothesis is used to replace the product of two powers by a single power. Which statement is that induction hypothesis?"
            answer: "a^m a^n = a^(m+n)"
            answer_contract: {"kind": "label", "options": [["a^m a^n = a^(m+n)"], ["a^m a^(n+1) = a^(m+n+1)"], ["a^m a^0 = a^m"], ["a^m a = a^(m+1)"]]}
            solution_sketch: "The induction is on n with m fixed, so the hypothesis is the law for the pair (m, n), namely a^m a^n = a^(m+n). The option a^m a^(n+1) = a^(m+n+1) is the statement of the step to be proved, not the hypothesis. The option a^m a^0 = a^m is the base case. The option a^m a = a^(m+1) is only the special case n = 1. The answer is a^m a^n = a^(m+n)."
          - problem: "Write the full proof: fix an element a of a monoid and show that a^m a^n = a^{m+n} for every pair of nonnegative integers m and n, inducting on n with m fixed. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Fix an element a of a monoid and fix m >= 0. Induct on n. Base case n = 0: a^0 = e, so a^m a^0 = a^m e = a^m = a^{m+0}. Hypothesis: assume a^m a^n = a^{m+n} for some n. Step: a^m a^{n+1} = a^m (a^n a) by the definition of powers. By associativity, a^m (a^n a) = (a^m a^n) a. The hypothesis replaces a^m a^n by a^{m+n}, so the expression is a^{m+n} a = a^{m+n+1}. Thus the law holds for n+1, and by induction for all n >= 0. The proof is complete."
        constraints: "induction on one exponent with the other fixed; cite associativity where used"
      - id: kp3
        name: "The law $(a^{m})^{n} = a^{mn}$"
        key_prerequisites: [mathematical-induction]
        exemplars:
          - problem: "In a monoid the induction step for the law $(a^{m})^{n} = a^{mn}$ starts from $(a^{m})^{n+1} = (a^{m})^{n} a^{m}$. Replace the first factor by $a^{mn}$ with the hypothesis, and use the addition law $a^{p} a^{q} = a^{p+q}$ to write the whole product as one power $a^{r}$. Give the exponent $r$."
            answer: "mn+m"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The definition of powers gives $(a^{m})^{n+1} = (a^{m})^{n} a^{m}$. The induction hypothesis rewrites the first factor as $a^{mn}$, so the product is $a^{mn} a^{m}$. The addition law $a^{p} a^{q} = a^{p+q}$ merges the two factors into the single power $a^{mn+m}$. Therefore $r = mn+m$."
          - problem: "In the monoid of words over the two letters x and y under concatenation, a student claims that $(uv)^{n} = u^{n} v^{n}$ for all words $u$ and $v$ and all $n \\ge 1$. Give the smallest $n$ for which this claim fails when $u = x$ and $v = y$."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Test $n = 1$: $(xy)^{1} = xy$ and $x^{1} y^{1} = xy$, so the claim holds there. Test $n = 2$: $(xy)^{2} = xyxy$, while $x^{2} y^{2} = xxyy$, and concatenation never reorders letters, so the two words differ. The law fails because this monoid is not commutative, which is exactly the hypothesis the general proof needs. The smallest $n$ is 2."
          - problem: "In a monoid, the law $(a^{m})^{n} = a^{mn}$ gives $(a^{2})^{n} = a^{2n}$. Use the addition law $a^{p} a^{q} = a^{p+q}$ to write the product $(a^{2})^{n} (a^{2})^{n}$ as a single power $a^{r}$. Give the exponent $r$."
            answer: "4n"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The law $(a^{m})^{n} = a^{mn}$ with $m = 2$ turns each factor into $a^{2n}$, so the product is $a^{2n} a^{2n}$. The addition law $a^{p} a^{q} = a^{p+q}$ adds the two exponents: $2n + 2n = 4n$. Hence the product is the single power $a^{4n}$, so $r = 4n$."
          - problem: "In the multiplicative monoid of the nonzero residues modulo 7, powers repeat multiplication. Give the smallest $n \\ge 1$ for which $(2^{2})^{n}$ is the identity element."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Compute in the residues modulo 7: $2^{2} = 4$, so $(2^{2})^{n} = 4^{n}$. The powers of 4 are $4^{1} = 4$, $4^{2} = 16 = 2$ and $4^{3} = 8 = 1$ modulo 7. The first return to the identity is at $n = 3$, and indeed $2^{3} = 8 = 1$ as well, consistent with $(2^{2})^{3} = 2^{6}$. The smallest $n$ is 3."
          - problem: "Claim: in every monoid $(a^{m})^{n} = a^{mn}$ for all $m, n \\ge 0$. Step 1: for $n = 0$, $(a^{m})^{0} = e$ and $a^{m \\cdot 0} = a^{0} = e$. Step 2: assume $(a^{m})^{k} = a^{mk}$ for some $k \\ge 0$. Step 3: then $(a^{m})^{k+1} = (a^{m})^{k} a^{m}$. Step 4: the hypothesis gives $(a^{m})^{k} a^{m} = a^{mk} a^{m} = a^{mk \\cdot m}$. Step 5: since $mk \\cdot m = m(k+1)$, the claim holds for $k+1$. Which step is the first step that is not valid?"
            answer: "Step 4"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"], ["Step 5"]]}
            solution_sketch: "Step 1 is a correct base case: $(a^{m})^{0} = e$ and $a^{0} = e$. Step 2 is the induction hypothesis and is a legitimate assumption. Step 3 is valid, since the definition of powers splits off one factor $a^{m}$. Step 4 is the first invalid step: the addition law gives $a^{mk} a^{m} = a^{mk+m}$, not $a^{mk \\cdot m}$, so multiplying the exponents is the error. Step 5 inherits that error, so the first invalid step is Step 4."
          - problem: "In the induction step for $(a^{m})^{n+1} = a^{m(n+1)}$ in a monoid, the line $(a^{m})^{n} a^{m} = \\;?$ is missing. Select the line that replaces $(a^{m})^{n}$ by the hypothesis $(a^{m})^{n} = a^{mn}$ and leaves the second factor unchanged."
            answer: "a^(mn) a^m"
            answer_contract: {"kind": "label", "options": [["a^(mn) a^m"], ["a^(mn) a^(mn)"], ["a^(mn*m)"], ["a^(m+m)"]]}
            solution_sketch: "The hypothesis replaces the first factor $(a^{m})^{n}$ by $a^{mn}$, while the second factor $a^{m}$ is unchanged, so the missing line is $a^{mn} a^{m}$; the addition law then turns it into $a^{mn+m}$. The option $a^{mn} a^{mn}$ copies the hypothesis into both factors and so changes the second factor. The option $a^{mn*m}$ multiplies the exponents of the two factors instead of keeping them separate. The option $a^{m+m}$ drops $n$ and adds $m$ to itself. The missing line is a^(mn) a^m."
          - problem: "Write the full proof: in every monoid $(a^{m})^{n} = a^{mn}$ for all integers $m, n \\ge 0$; also prove $(ab)^{n} = a^{n} b^{n}$ for all $n \\ge 0$ in a commutative monoid and point out where commutativity is used. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Base case for the first law, $n = 0$: by definition $(a^{m})^{0} = e$ and $a^{m \\cdot 0} = a^{0} = e$, so the two sides agree. Inductive hypothesis: fix $n \\ge 0$ and assume $(a^{m})^{n} = a^{mn}$ for all $m \\ge 0$. Inductive step: the definition of powers gives $(a^{m})^{n+1} = (a^{m})^{n} a^{m}$; the hypothesis rewrites the first factor as $a^{mn}$; the earlier addition law $a^{p} a^{q} = a^{p+q}$, itself proved by induction, merges them into $a^{mn+m} = a^{m(n+1)}$. Conclusion: the law holds for $n+1$, so by induction it holds for all $n \\ge 0$. Base case for the second law: $(ab)^{0} = e = e e = a^{0} b^{0}$. Inductive step: $(ab)^{n+1} = (ab)^{n} a b = a^{n} b^{n} a b$, and moving $b^{n}$ past $a$ needs $b^{n} a = a b^{n}$, a stacked induction that uses only the commutativity hypothesis $ab = ba$; then $a^{n} a b^{n} b = a^{n+1} b^{n+1}$. Without commutativity the second law fails: in the free monoid on $x$ and $y$, $(xy)^{2} = xyxy$ differs from $x^{2} y^{2} = xxyy$."
        constraints: "induction proofs stacked on the previous law; note where commutativity is needed"
    diagnostic_exemplar:
      problem: 'In an arbitrary monoid, prove by induction on $n$ that $a^{m}a^{n} = a^{m+n}$ for all integers $m, n \ge 0$, and use it to show $(a^{2})^{3} = a^{6}$.'
      answer: 'Powers are defined by $a^{0} = e$ and $a^{k+1} = a^{k}a$. Fix $m \ge 0$ and induct on $n$. Base $n = 0$: $a^{m}a^{0} = a^{m}e = a^{m} = a^{m+0}$. Step: assume $a^{m}a^{n} = a^{m+n}$; then $a^{m}a^{n+1} = a^{m}(a^{n}a) = (a^{m}a^{n})a = a^{m+n}a = a^{m+n+1}$, using associativity and the definition. So the law holds for all $n \ge 0$, and $m$ was arbitrary. Consequently $(a^{2})^{3} = a^{2}a^{2}a^{2} = a^{4}a^{2} = a^{6}$.'
      solution_sketch: 'Induct on the second exponent, peeling one factor with $a^{n+1} = a^{n}a$ and re-associating; then apply the law twice.'
    anki_seeds:
      - front: '$a^{0}$ in a monoid?'
        back: 'The identity $e$ (by convention/recursive definition).'
        type: basic
      - front: 'When does $(ab)^{n} = a^{n} b^{n}$ hold in a monoid?'
        back: 'When $a$ and $b$ commute ($ab = ba$); not in general.'
        type: basic

  - id: inverse-elements
    name: "Invertible Elements"
    core: true
    difficulty: 0.62
    drill: false
    answer_kind: proof
    expected_time_secs: 170
    prerequisites:
      - id: monoids
        weight: 0.6
        key: true
      - id: function-composition-inverse
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: "Invertibility in number monoids"
        key_prerequisites: [monoids]
        exemplars:
          - problem: "In the monoid (Z, *, 1) of integers under multiplication, which set is exactly the invertible elements? Select the set."
            answer: "1 and -1"
            answer_contract: {"kind": "label", "options": [["1 and -1"], ["all integers"], ["nonzero integers"], ["0 and 1"]]}
            solution_sketch: "Step 1 (definition): a is invertible in (Z, *, 1) if a*b = 1 for some integer b. Step 2 (positive case): if a = 1, b = 1 works; if a = -1, b = -1 works. Step 3 (necessity): if a*b = 1, then |a|*|b| = 1, so |a| = 1 and a = 1 or a = -1. Option all integers is wrong because 2 has no integer inverse. Option nonzero integers is wrong because 2 is nonzero but not invertible. Option 0 and 1 is wrong because 0*x = 0, never 1. The answer is 1 and -1."
          - problem: "The monoid (Q, *, 1) is rational numbers under multiplication. The monoid (Z, +, 0) is integers under addition. Find qinv, the inverse of -4/5 in (Q, *, 1), and zinv, the inverse of 9 in (Z, +, 0). Give both answers."
            answer: "qinv = -5/4; zinv = -9"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "qinv"}, {"contract": {"kind": "exact"}, "name": "zinv"}]}
            solution_sketch: "Step 1 (identity): in (Q, *, 1) the identity is 1. Solve x*(-4/5) = 1, so x = -5/4. Step 2 (identity): in (Z, +, 0) the identity is 0. Solve 9 + y = 0, so y = -9. The answer is qinv = -5/4; zinv = -9."
          - problem: "The monoid is (Z, +, 0) of integers under addition. Give the inverse of 13."
            answer: "-13"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (identity): in (Z, +, 0) the identity is 0. Step 2 (inverse equation): the inverse of 13 is x with 13 + x = 0. Subtract 13 from both sides: x = -13. The inverse is -13."
          - problem: "The monoid is (Q, *, 1) of rational numbers under multiplication. Give the inverse of 6/11 as a fraction."
            answer: "11/6"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (identity): in (Q, *, 1) the identity is 1. Step 2 (inverse equation): solve x*(6/11) = 1. Multiply both sides by 11/6: x = 11/6. The inverse is 11/6."
          - problem: "The monoid is (Z, *, 1) of integers under multiplication. Give the smallest integer greater than 1 that has no inverse in this monoid."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (definition): n is invertible in (Z, *, 1) if n*m = 1 for some integer m. Step 2 (smallest failure): for n = 2, the equation 2m = 1 has no integer solution, so 2 is not invertible. Any integer greater than 1 has the same obstruction. The smallest integer greater than 1 with no inverse is 2."
          - problem: "The monoid is (Q, *, 1) of rational numbers under multiplication. Give the only rational number that fails to have an inverse."
            answer: "0"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (identity): in (Q, *, 1) the identity is 1. Step 2 (zero fails): for every rational x, x*0 = 0, which is not 1. Step 3 (nonzero works): if q is a nonzero rational, then 1/q is rational and q*(1/q) = 1. The only rational number that fails to have an inverse is 0."
          - problem: "Write the full proof: In the monoid (Z, *, 1), the invertible elements are exactly 1 and -1. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Claim: in the monoid (Z, *, 1), an integer a is invertible exactly when a = 1 or a = -1. Step 1 (definition): a is invertible if there is an integer b with a*b = 1. Step 2 (existence): if a = 1, take b = 1; if a = -1, take b = -1, so both are invertible. Step 3 (necessity): suppose a*b = 1 for integers a and b. Taking absolute values gives |a|*|b| = 1. Since |a| and |b| are nonnegative integers, both must equal 1. Thus |a| = 1, so a = 1 or a = -1. Step 4 (failure of the rest): if a is any other integer, then |a| is at least 2, and a*b = 1 would force |a|*|b| = 1, impossible. Therefore no other integer is invertible. The invertible elements are exactly 1 and -1."
        constraints: "classify the invertible elements and justify why the rest fail"
      - id: kp2
        name: "Invertibility in the function monoid"
        key_prerequisites: [function-composition-inverse]
        exemplars:
          - problem: 'In the monoid of functions $\mathbb{R} \to \mathbb{R}$ under composition, is $f(x) = x^3$ invertible? Is $g(x) = x^2$?'
            answer: '$f$ yes (inverse $\sqrt[3]{x}$); $g$ no.'
            solution_sketch: 'An element of this monoid is invertible iff it is a bijection. $x^3$ is bijective with inverse $x^{1/3}$; $x^2$ is not injective ($g(1) = g(-1)$), so no two-sided inverse exists. $\square$'
          - problem: 'In the same monoid, find the inverse of $h(x) = 2x + 3$ and verify one composition.'
            answer: '$h^{-1}(x) = (x - 3)/2$; $h(h^{-1}(x)) = x$.'
            solution_sketch: 'Solve $y = 2x + 3$: $x = (y-3)/2$. Then $h((x-3)/2) = 2 \cdot \tfrac{x-3}{2} + 3 = x$. $\square$'
        constraints: "invertible iff bijective; verify by composing"
      - id: kp3
        name: "Solving equations with inverses"
        key_prerequisites: [monoids]
        exemplars:
          - problem: "In a monoid, an element a is invertible and a * x = b. To verify that the candidate solution works, one simplifies the product of a with that candidate. Which line is the correct simplification?"
            answer: "$(a * a^(-1)) * b = e * b = b$"
            answer_contract: {"kind": "label", "options": [["$(a * a^(-1)) * b = e * b = b$"], ["$(a^(-1) * a) * b = a^(-1) * b$"], ["$a * (a^(-1) * b) = e$"], ["$a * (a^(-1) * b) = a * b$"]]}
            solution_sketch: "Associativity regroups the product as $(a * a^(-1)) * b$. The inverse rule gives $a * a^(-1) = e$, and the identity rule gives $e * b = b$. The option $(a^(-1) * a) * b = a^(-1) * b$ misplaces the inverse and does not cancel a. The option $a * (a^(-1) * b) = e$ drops b and claims the product is the identity. The option $a * (a^(-1) * b) = a * b$ fails to cancel a. The answer is $(a * a^(-1)) * b = e * b = b$."
          - problem: "In the multiplicative monoid modulo 11, the inverse of 5 is 9. Solve 5x = 3 (mod 11). Give the least nonnegative integer x."
            answer: "5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: use the given inverse of 5, which is 9. Step 2: multiply both sides by 9; x = 9 * 3 = 27, and 27 leaves remainder 5 mod 11. Check: 5 * 5 = 25 leaves remainder 3 mod 11. The answer is 5."
          - problem: "Solve the congruence 4x = 7 (mod 9) by multiplying both sides by the inverse of 4. Give x as an integer from 0 to 8."
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: find the inverse of 4 modulo 9; 4 * 7 = 28, and 28 leaves remainder 1 mod 9, so the inverse is 7. Step 2: multiply both sides by 7; x = 7 * 7 = 49, and 49 leaves remainder 4 mod 9. Check: 4 * 4 = 16 leaves remainder 7 mod 9. The answer is 4."
          - problem: "The number 7 has inverse 2 modulo 13. Use this inverse to solve 7x = 5 (mod 13). Give the least nonnegative integer x."
            answer: "10"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: use the given inverse of 7 modulo 13, which is 2. Step 2: multiply both sides by 2; x = 2 * 5 = 10. Check: 7 * 10 = 70, and 70 leaves remainder 5 mod 13. The answer is 10."
          - problem: "Use the inverse of 3 modulo 10. Find the least nonnegative solution x of 3x = 7 (mod 10)."
            answer: "9"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: find the inverse of 3 modulo 10; 3 * 7 = 21, and 21 leaves remainder 1 mod 10, so the inverse is 7. Step 2: multiply both sides by 7; x = 7 * 7 = 49, and 49 leaves remainder 9 mod 10. Check: 3 * 9 = 27 leaves remainder 7 mod 10. The answer is 9."
          - problem: "Claim: in a monoid, if a is invertible then a * x = b has the unique solution x = a^(-1) * b. Step 1: check that the candidate gives a * (a^(-1) * b) = (a * a^(-1)) * b = e * b = b. Step 2: suppose that a * x = b. Step 3: multiply only the left side by a^(-1) to get a^(-1) * a * x = b. Step 4: use a^(-1) * a = e to conclude x = b. Which step is the first step that is not valid?"
            answer: "Step 3"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "Step 1 is correct: associativity and the inverse and identity rules verify the candidate. Step 2 is the supposition. Step 3 is invalid because an equation must be multiplied on both sides by the same element; changing only one side does not preserve equality. Step 4 follows from the invalid line, so it is not a proof. The answer is Step 3."
          - problem: "Write the full proof: if a is invertible in a monoid (M, *, e), then the equation a * x = b has the unique solution x = a^(-1) * b. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1: state the claim. In a monoid, let a be invertible and let x = a^(-1) * b. Step 2: prove existence. Use associativity and the inverse: a * (a^(-1) * b) = (a * a^(-1)) * b = e * b = b, so the candidate is a solution. Step 3: prove uniqueness. Suppose a * y = b for some y. Left-multiply both sides by a^(-1): a^(-1) * (a * y) = a^(-1) * b. By associativity, (a^(-1) * a) * y = a^(-1) * b, and by the inverse rule e * y = a^(-1) * b, so y = a^(-1) * b. Step 4: conclude. The solution exists and any solution equals a^(-1) * b, so the solution is unique. The full proof is complete."
        constraints: "use associativity and the inverse; one abstract proof, one concrete solve"
    diagnostic_exemplar:
      problem: 'Prove that if $a$ is invertible in a monoid $(M, *, e)$ then $a * x = b$ has the unique solution $x = a^{-1} * b$, and use this to solve $3x \equiv 5 \pmod 7$.'
      answer: 'Existence: $a * (a^{-1} * b) = (a * a^{-1}) * b = e * b = b$, so $x = a^{-1} * b$ solves the equation. Uniqueness: if $a * x = b$, multiply on the left by $a^{-1}$ and use associativity: $x = e * x = (a^{-1} * a) * x = a^{-1} * (a * x) = a^{-1} * b$. For $3x \equiv 5 \pmod 7$: in multiplication mod $7$ the element $3$ is invertible with $3^{-1} = 5$, since $3 \cdot 5 = 15 \equiv 1$; hence $x \equiv 5 \cdot 5 = 25 \equiv 4 \pmod 7$, and indeed $3 \cdot 4 = 12 \equiv 5$.'
      solution_sketch: 'Substitute for existence and left-multiply by the inverse for uniqueness; then find the inverse of $3$ mod $7$ and apply the formula.'
    anki_seeds:
      - front: 'Invertible elements of $(\mathbb{Z}, \cdot)$?'
        back: 'Only $\pm 1$.'
        type: basic
      - front: 'In the monoid of functions $X \to X$ under composition, $f$ is invertible iff...'
        back: '$f$ is a bijection.'
        type: basic

  - id: groups-intro
    name: "Introduction to Groups"
    core: true
    difficulty: 0.65
    drill: false
    answer_kind: proof
    expected_time_secs: 230
    prerequisites:
      - id: monoids
        weight: 0.5
        key: true
      - id: binary-operations
        weight: 0.4
        key: true
      - id: inverse-elements
        weight: 0.4
        key: true
      - id: set-notation
        weight: 0.0
    knowledge_points:
      - id: kp1
        name: "Group axioms and examples"
        key_prerequisites: [monoids]
        exemplars:
          - problem: "In the group of integers under addition, find the additive inverse of 7. Give the number."
            answer: "-7"
            answer_contract: {"kind": "exact"}
            solution_sketch: "For the additive group of integers, the inverse of an element is its opposite. The opposite of 7 is -7. The additive inverse is -7."
          - problem: "In the nonzero rational numbers under multiplication, find the multiplicative inverse of 3/4. Give the answer as a fraction."
            answer: "4/3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "In the nonzero rationals under multiplication, the inverse of a fraction is its reciprocal. The reciprocal of 3/4 is 4/3. The multiplicative inverse is 4/3."
          - problem: "For the group Z_6 under addition modulo 6, compute 4 plus 5 modulo 6. Give the result as a number."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Closure checks that the sum of two elements is again in the set. Compute 4 plus 5 to get 9, then reduce modulo 6. The result is 3."
          - problem: "For the group Z_6 under addition modulo 6, use associativity to rewrite 2 plus (4 plus 5) as (2 plus 4) plus 5 modulo 6. Give the common value."
            answer: "5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Associativity allows grouping changes. Compute the inner sum first: 4 plus 5 modulo 6 is 3, then 2 plus 3 modulo 6 is 5. The common value is 5."
          - problem: "For the group Z_6 under addition modulo 6, find the identity element. Give the number."
            answer: "0"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The identity element leaves every element unchanged under the operation. In addition modulo 6, adding 0 leaves every residue unchanged. The identity element is 0."
          - problem: "Claim: (Z, ·) is a group. Step 1: multiplication is closed on Z. Step 2: multiplication is associative on Z. Step 3: the number 1 is an identity for multiplication on Z. Step 4: for every integer a there is an integer b with a·b = 1. Step 5: therefore (Z, ·) is a group. Which step is the first step that is not valid?"
            answer: "Step 4"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"], ["Step 5"]]}
            solution_sketch: "Step 1 is true because the product of integers is an integer. Step 2 is true by associativity of multiplication. Step 3 is true because 1 is a multiplicative identity. Step 4 is false: for a equal to 2 there is no integer b with 2b equal to 1. Step 5 is the conclusion and is false, but it is not the first invalid step. The first invalid step is Step 4."
          - problem: "Write the full proof: the integers under addition form a group. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Full proof: the integers under addition form a group. Closure: for integers a and b, a plus b is an integer, so the operation is closed. Associativity: for integers a, b, c, (a plus b) plus c equals a plus (b plus c). Identity: the integer 0 satisfies 0 plus a equals a plus 0 equals a for every integer a. Inverses: for each integer a, the integer -a satisfies a plus (-a) equals 0 and (-a) plus a equals 0. Since all four group axioms hold, the integers under addition form a group."
        constraints: "check closure, associativity, identity, and inverses"
      - id: kp2
        name: "Uniqueness of inverses"
        key_prerequisites: [monoids]
        exemplars:
          - problem: 'Prove: in a group, each element has a unique inverse.'
            answer: 'If $b, c$ both invert $a$, then $b = b(ac) = (ba)c = c$.'
            solution_sketch: 'Let $b, c$ be inverses of $a$, so $ab = ba = e$ and $ac = ca = e$. Then $b = be = b(ac) = (ba)c = ec = c$. $\square$'
          - problem: 'Prove: in a group, $(a^{-1})^{-1} = a$.'
            answer: 'Since $a a^{-1} = a^{-1} a = e$, $a$ inverts $a^{-1}$.'
            solution_sketch: 'We have $a^{-1} a = a a^{-1} = e$, which says $a$ is a two-sided inverse of $a^{-1}$. By uniqueness of inverses, $(a^{-1})^{-1} = a$. $\square$'
        constraints: "use associativity and the identity to collapse candidates"
      - id: kp3
        name: "Cancellation"
        key_prerequisites: [binary-operations]
        exemplars:
          - problem: "In the multiplicative group of nonzero rational numbers, solve the equation 3x = 5. Give x."
            answer: "5/3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The group is the nonzero rationals under multiplication. The inverse of 3 is 1/3. Multiply both sides of 3x = 5 by 1/3: (1/3)(3x) = (1/3)5. Associativity gives ((1/3)3)x = 5/3, so 1x = 5/3, hence x = 5/3. The answer is 5/3."
          - problem: "In the multiplicative group of nonzero rational numbers, solve the equation x*7 = 2. Give x."
            answer: "2/7"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The inverse of 7 is 1/7. Multiply both sides of x*7 = 2 on the right by 1/7: (x*7)*(1/7) = 2*(1/7). Associativity gives x*(7*1/7) = 2/7, so x*1 = 2/7. The answer is 2/7."
          - problem: "In the multiplicative group of nonzero rational numbers, solve the equation (-2)x = 6. Give x."
            answer: "-3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The inverse of -2 is -1/2. Multiply both sides of (-2)x = 6 by -1/2: (-1/2)(-2)x = (-1/2)6. The left side becomes 1x, and the right side is -3. The answer is -3."
          - problem: "Claim: in a group, if ab = ac then b = c. Step 1: assume ab = ac. Step 2: multiply both sides on the right by a^{-1}. Step 3: by associativity, a(ba^{-1}) = a(ca^{-1}). Step 4: cancel a on the left to get b = c. Which step is the first step that is not valid?"
            answer: "Step 4"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "Step 1 is the valid hypothesis. Step 2 is valid: multiplying both sides by a^{-1} on the right is allowed in a group. Step 3 is valid by associativity. Step 4 is invalid: left cancellation of a gives b a^{-1} = c a^{-1}, not b = c; a further right cancellation is needed. The answer is Step 4."
          - problem: "In a proof of right cancellation, from ba = ca multiply both sides on the right by a^{-1}. The line after multiplication is (ba)a^{-1} = (ca)a^{-1}. Select the next line that uses associativity and shows the inverse."
            answer: "b(a a^(-1)) = c(a a^(-1))"
            answer_contract: {"kind": "label", "options": [["b(a a^(-1)) = c(a a^(-1))"], ["b(a^(-1) a) = c(a^(-1) a)"], ["(b a^(-1)) a = (c a^(-1)) a"], ["b a = c a"]]}
            solution_sketch: "Start from the line (ba)a^(-1) = (ca)a^(-1) obtained by multiplying ba = ca on the right by a^(-1). Associativity regroups each side as b(a a^(-1)) = c(a a^(-1)), and then a a^(-1) = e gives b = c. Wrong option b(a^(-1) a) = c(a^(-1) a): it regroups with the inverse on the left of a, but the multiplication was done on the right, so the inverse pair a a^(-1) is never formed. Wrong option (b a^(-1)) a = (c a^(-1)) a: it moves a^(-1) next to b and c, an invalid regrouping that creates no inverse pair. Wrong option b a = c a: it deletes the factor a^(-1) and merely restates the hypothesis. The answer is b(a a^(-1)) = c(a a^(-1))."
          - problem: "In the proof of left cancellation, after a^{-1}(ab) = a^{-1}(ac), the left side is rewritten as (a^{-1}a)b. Which group property justifies that rewrite?"
            answer: "Associativity"
            answer_contract: {"kind": "label", "options": [["Associativity"], ["Inverse"], ["Identity"], ["Closure"]]}
            solution_sketch: "The rewrite is (a^{-1}a)b. The property Inverse would replace a^{-1}a by e, but that is the next step, not this grouping change. The property Identity would remove e, which is also later. The property Closure says the product of two elements is in the group, which does not justify changing parentheses. The grouping change is exactly the associative law. The answer is Associativity."
          - problem: "Write the full proof: in a group, if ab = ac then b = c. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Assume ab = ac. Step 1: multiply both sides on the left by a^{-1}: a^{-1}(ab) = a^{-1}(ac). Step 2: by associativity, (a^{-1}a)b = (a^{-1}a)c. Step 3: by the inverse axiom, a^{-1}a = e, so eb = ec. Step 4: by the identity axiom, b = c. Every step uses a group axiom: the operation is associative, a^{-1} exists, and e is the identity. This proves left cancellation. See the solution."
        constraints: "apply an inverse to both sides"
    diagnostic_exemplar:
      problem: 'Prove that in any group, $(ab)^{-1} = b^{-1}a^{-1}$.'
      answer: 'Check $(ab)(b^{-1}a^{-1}) = e$.'
      solution_sketch: '$(ab)(b^{-1}a^{-1}) = a(bb^{-1})a^{-1} = aea^{-1} = aa^{-1} = e$, and similarly $(b^{-1}a^{-1})(ab) = e$. By uniqueness of inverses, $(ab)^{-1} = b^{-1}a^{-1}$. $\square$'
    anki_seeds:
      - front: 'The four group axioms?'
        back: 'Closure, associativity, an identity element, and an inverse for every element.'
        type: basic
      - front: 'Inverse of a product $(ab)^{-1}$ in a group?'
        back: '$b^{-1}a^{-1}$ (the order reverses).'
        type: basic

  - id: abelian-groups
    name: "Commutativity and Abelian Groups"
    core: true                 # machinery: "abelian" is used across proofs, abstract-algebra, and category-theory (31+ uses) and was defined nowhere before this topic
    difficulty: 0.66
    drill: false
    answer_kind: proof
    expected_time_secs: 200
    prerequisites:
      - id: groups-intro
        weight: 0.6
        key: true
      - id: binary-operations
        weight: 0.4
        key: true
      - id: function-composition-inverse
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: "The definition, and verifying abelian groups"
        key_prerequisites: [groups-intro, binary-operations]
        exemplars:
          - problem: 'Define what it means for a group to be abelian, and show that $(\mathbb{Z}, +)$ and $(\mathbb{Q} \setminus \{0\}, \cdot)$ are abelian groups.'
            answer: 'A group is abelian when $ab = ba$ for all elements; both operations inherit commutativity from arithmetic.'
            solution_sketch: 'A group $G$ is abelian (commutative) when $a * b = b * a$ for all $a, b \in G$. Both are groups (shown previously), and $m + n = n + m$, $\tfrac{p}{q} \cdot \tfrac{r}{s} = \tfrac{r}{s} \cdot \tfrac{p}{q}$ hold for all numbers, so both groups are abelian. $\square$'
          - problem: 'The set $\mathbb{Z}$ with $a * b = a + b - 1$ is a group with identity $1$. Prove it is abelian.'
            answer: '$a * b = a + b - 1 = b + a - 1 = b * a$.'
            solution_sketch: 'For all $a, b \in \mathbb{Z}$: $a * b = a + b - 1 = b + a - 1 = b * a$, by commutativity of ordinary addition. So the group is abelian. $\square$'
        constraints: "verify $a * b = b * a$ symbolically for a group already known to be a group; state the definition when asked"
      - id: kp2
        name: "Nonabelian groups"
        key_prerequisites: [function-composition-inverse]
        exemplars:
          - problem: 'Let $f, g : \mathbb{R} \to \mathbb{R}$ be the bijections $f(x) = x + 1$ and $g(x) = 2x$. Show that the group of bijections $\mathbb{R} \to \mathbb{R}$ under composition is not abelian.'
            answer: '$(f \circ g)(x) = 2x + 1$ but $(g \circ f)(x) = 2x + 2$.'
            solution_sketch: '$(f \circ g)(x) = f(2x) = 2x + 1$ and $(g \circ f)(x) = g(x + 1) = 2x + 2$; these differ (e.g. at $x = 0$), so composition does not commute. One non-commuting pair refutes abelianness. $\square$'
          - problem: 'Let $f$ swap $1 \leftrightarrow 2$ and fix $3$, and let $g$ swap $2 \leftrightarrow 3$ and fix $1$, as bijections of $\{1, 2, 3\}$. Show $f \circ g \ne g \circ f$.'
            answer: '$(f \circ g)(1) = 2$ but $(g \circ f)(1) = 3$.'
            solution_sketch: 'Evaluate pointwise at $1$: $(f \circ g)(1) = f(g(1)) = f(1) = 2$, while $(g \circ f)(1) = g(f(1)) = g(2) = 3$. They disagree at one input, so the functions differ. $\square$'
        constraints: "one explicit non-commuting pair, both orders evaluated pointwise; composition examples only"
      - id: kp3
        name: "Reasoning inside abelian groups"
        key_prerequisites: [groups-intro]
        exemplars:
          - problem: "In an abelian group, the reversal rule gives (ab)^(-1) = b^(-1)*a^(-1). Use the abelian hypothesis once to rewrite the right side. Give the resulting expression in a and b."
            answer: "a^(-1)*b^(-1)"
            answer_contract: {"kind": "function", "vars": ["a", "b"]}
            solution_sketch: "In an abelian group, start with the reversal rule (ab)^(-1) = b^(-1)*a^(-1). By the abelian hypothesis, the factors b^(-1) and a^(-1) commute, so b^(-1)*a^(-1) = a^(-1)*b^(-1). The resulting expression is a^(-1)*b^(-1)."
          - problem: "Suppose every element x of a group satisfies x^2 = e, so x = x^(-1). Start from (ab)^(-1) = b^(-1)*a^(-1) and replace each inverse with its element. Give the resulting expression in a and b."
            answer: "b*a"
            answer_contract: {"kind": "function", "vars": ["a", "b"]}
            solution_sketch: "Assume every element x satisfies x^2 = e, so x = x^(-1). The reversal rule gives (ab)^(-1) = b^(-1)*a^(-1). Replace b^(-1) by b and a^(-1) by a to get b*a. The resulting expression is b*a."
          - problem: "In the abelian group of integers modulo 12 under addition, the inverse of the element 7 is the element x with 7 + x congruent to 0. Find x."
            answer: "5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The group is integers modulo 12 under addition. The inverse of 7 is the solution of 7 + x = 0 modulo 12. Subtract 7: x = -7 modulo 12 = 5. The answer is 5."
          - problem: "In the abelian group of integers modulo 8 under addition, determine the order of the element 6, that is the least positive integer k with 6k congruent to 0. Give the order."
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The order is the least positive k with 6k = 0 modulo 8. Compute multiples: 6, 12 = 4, 18 = 2, 24 = 0 modulo 8. The first return to 0 is at k = 4. The order is 4."
          - problem: "Claim: if every element x of a group satisfies x^2 = e, then the group is abelian. Step 1: Let a and b be elements; the hypothesis gives a^2 = e and b^2 = e. Step 2: From a^2 = e, a = a^(-1). Step 3: (ab)^(-1) = a^(-1)*b^(-1). Step 4: Therefore the group is abelian. Which step is the first step that is not valid?"
            answer: "Step 3"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "Step 1 correctly instantiates the hypothesis. Step 2 correctly uses x^2 = e to get x = x^(-1). Step 3 is invalid: in any group the reversal rule gives b^(-1)*a^(-1), not a^(-1)*b^(-1). Step 4 depends on the invalid Step 3. The first invalid step is Step 3."
          - problem: "In an abelian group, a proof of the square identity expands (ab)^2 = abab. Commutativity allows the middle factors to be swapped. Select the missing line after abab."
            answer: "a*a*b*b"
            answer_contract: {"kind": "label", "options": [["a*a*b*b"], ["a*b*a*b"], ["b*b*a*a"], ["a*b"]]}
            solution_sketch: "The full expression starts as (ab)^2 = abab. Commutativity lets a cross the middle b to get aabb, written a*a*b*b. The option a*b*a*b keeps the original order and uses no commutativity. The option b*b*a*a reverses both pairs incorrectly. The option a*b drops one a and one b. The missing line is a*a*b*b."
          - problem: "Write the full proof: in an abelian group, (ab)^2 = a^2 b^2 for all a and b. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Let G be abelian and let a and b be elements of G. Step 1: By definition of the square, (ab)^2 = (ab)(ab). Step 2: By associativity, (ab)(ab) = a(ba)b. Step 3: By the abelian hypothesis, ba = ab, so a(ba)b = a(ab)b. Step 4: By associativity again, a(ab)b = (aa)(bb). Step 5: By definition of powers, (aa)(bb) = a^2 b^2. Thus (ab)^2 = a^2 b^2 for all a and b in G. This completes the proof."
        constraints: "short axiom-pushing proofs; each step cites a group axiom, the abelian hypothesis, or a previously proven fact"
    diagnostic_exemplar:
      problem: 'Prove that a group $G$ is abelian if and only if $(ab)^{-1} = a^{-1}b^{-1}$ for all $a, b \in G$.'
      answer: 'In any group $(ab)^{-1} = b^{-1}a^{-1}$, since $(ab)(b^{-1}a^{-1}) = a(bb^{-1})a^{-1} = aa^{-1} = e$ and inverses are unique. ($\Rightarrow$) If $G$ is abelian then $b^{-1}a^{-1} = a^{-1}b^{-1}$, so $(ab)^{-1} = a^{-1}b^{-1}$. ($\Leftarrow$) Suppose $(ab)^{-1} = a^{-1}b^{-1}$ for all $a, b$. Comparing with the general formula gives $b^{-1}a^{-1} = a^{-1}b^{-1}$ for all $a, b$. Given arbitrary $x, y \in G$, apply this with $a = x^{-1}$ and $b = y^{-1}$ (every element is the inverse of its own inverse): $yx = xy$. Hence $G$ is abelian.'
      solution_sketch: 'Start from the socks-shoes formula $(ab)^{-1} = b^{-1}a^{-1}$; the hypothesis then says inverses commute, and every element of a group is an inverse.'
    anki_seeds:
      - front: 'A group is abelian when...'
        back: '$ab = ba$ for all elements $a, b$ (the operation is commutative; named after Niels Henrik Abel).'
        type: basic
      - front: 'A standard example of a nonabelian group?'
        back: 'Bijections of a set with $\ge 3$ elements under composition (e.g. two overlapping swaps of $\{1,2,3\}$ do not commute).'
        type: basic
      - front: 'In an abelian group, $(ab)^{-1} = ?$'
        back: '$a^{-1}b^{-1}$ — the general rule $b^{-1}a^{-1}$, but the order no longer matters.'
        type: basic

  - id: checking-homomorphisms
    name: "Checking the Homomorphism Condition"
    core: true
    difficulty: 0.64
    drill: false
    answer_kind: numeric
    expected_time_secs: 160
    prerequisites:
      - id: groups-intro
        weight: 0.5
        key: true
      - id: functions-formal-definition
        weight: 0.2
      - id: exponential-functions
        weight: 0.2
        key: false
    knowledge_points:
      - id: kp1
        name: "Verifying the condition"
        key_prerequisites: [groups-intro]
        exemplars:
          - problem: "Define $\\varphi : (\\mathbb{Z}, +) \\to (\\mathbb{Z}, +)$ by $\\varphi(n) = 5n$. Compute $\\varphi(m + n)$ and $\\varphi(m) + \\varphi(n)$. Find their common value as a function of $m$ and $n$."
            answer: "5m+5n"
            answer_contract: {"kind": "function", "vars": ["m", "n"]}
            solution_sketch: "Full condition: $\\varphi(m + n) = \\varphi(m) + \\varphi(n)$. Step 1: apply the definition, $\\varphi(m + n) = 5(m + n)$. Step 2: expand by the distributive law, $5m + 5n$. Step 3: apply the definition on the right, $\\varphi(m) + \\varphi(n) = 5m + 5n$. The two sides match for all integers $m$ and $n$, so the common value is 5m+5n."
          - problem: "Define $\\varphi : (\\mathbb{R}, +) \\to (\\mathbb{R}^{>0}, \\cdot)$ by $\\varphi(x) = e^{3x}$. Check $\\varphi(x + y) = \\varphi(x) \\varphi(y)$. State whether $\\varphi$ is a homomorphism and give the common value of both sides as a function of $x$ and $y$."
            answer: "verdict = yes; value = e^(3x+3y)"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["yes"], ["no"]]}, "name": "verdict"}, {"contract": {"kind": "function", "vars": ["x", "y"]}, "name": "value"}]}
            solution_sketch: "Full condition: $\\varphi(x + y) = \\varphi(x) \\varphi(y)$ with addition on the left and multiplication on the right. Step 1: apply the map, $\\varphi(x + y) = e^{3(x + y)}$. Step 2: simplify the exponent to $e^{3x + 3y}$. Step 3: apply the map on the right, $\\varphi(x) \\varphi(y) = e^{3x} e^{3y}$. Step 4: use the exponent law $e^a e^b = e^{a+b}$ to get $e^{3x + 3y}$. Both sides are equal for all real $x$ and $y$, so $\\varphi$ is a homomorphism. The answer is verdict = yes; value = e^(3x+3y)."
          - problem: "Define $\\varphi : (\\mathbb{R}, +) \\to (\\mathbb{R}, +)$ by $\\varphi(x) = x/5$. Compute $\\varphi(x + y)$ and $\\varphi(x) + \\varphi(y)$. Find their common value as a function of $x$ and $y$."
            answer: "(x+y)/5"
            answer_contract: {"kind": "function", "vars": ["x", "y"]}
            solution_sketch: "Full condition: $\\varphi(x + y) = \\varphi(x) + \\varphi(y)$. Step 1: apply the map, $\\varphi(x + y) = (x + y)/5$. Step 2: split the fraction, $x/5 + y/5$. Step 3: apply the map on the right, $\\varphi(x) + \\varphi(y) = x/5 + y/5$. Both sides match for all real $x$ and $y$, so the common value is (x+y)/5."
          - problem: "Define $\\varphi : (\\mathbb{Z}, +) \\to (\\mathbb{Z}, +)$ by $\\varphi(n) = -4n$. Compute $\\varphi(m + n)$ and $\\varphi(m) + \\varphi(n)$. Find their common value as a function of $m$ and $n$."
            answer: "-4m-4n"
            answer_contract: {"kind": "function", "vars": ["m", "n"]}
            solution_sketch: "Full condition: $\\varphi(m + n) = \\varphi(m) + \\varphi(n)$. Step 1: apply the map, $\\varphi(m + n) = -4(m + n)$. Step 2: expand by the distributive law, $-4m - 4n$. Step 3: apply the map on the right, $\\varphi(m) + \\varphi(n) = -4m - 4n$. The two sides match for all integers $m$ and $n$, so the common value is -4m-4n."
          - problem: "Define $\\varphi : (\\mathbb{R}, +) \\to (\\mathbb{R}, +)$ by $\\varphi(x) = -x/2$. Compute $\\varphi(x + y)$ and $\\varphi(x) + \\varphi(y)$. Find their common value as a function of $x$ and $y$."
            answer: "-(x+y)/2"
            answer_contract: {"kind": "function", "vars": ["x", "y"]}
            solution_sketch: "Full condition: $\\varphi(x + y) = \\varphi(x) + \\varphi(y)$. Step 1: apply the map, $\\varphi(x + y) = -(x + y)/2$. Step 2: rewrite as $-x/2 - y/2$. Step 3: apply the map on the right, $\\varphi(x) + \\varphi(y) = -x/2 - y/2$. Both sides match for all real $x$ and $y$, so the common value is -(x+y)/2."
          - problem: "Define $\\varphi : (\\mathbb{R}, +) \\to (\\mathbb{R}^{>0}, \\cdot)$ by $\\varphi(x) = e^{-5x}$. Check $\\varphi(x + y) = \\varphi(x) \\varphi(y)$. State whether $\\varphi$ is a homomorphism and give the common value of both sides as a function of $x$ and $y$."
            answer: "verdict = yes; value = e^(-5x-5y)"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["yes"], ["no"]]}, "name": "verdict"}, {"contract": {"kind": "function", "vars": ["x", "y"]}, "name": "value"}]}
            solution_sketch: "Full condition: $\\varphi(x + y) = \\varphi(x) \\varphi(y)$ with addition on the left and multiplication on the right. Step 1: apply the map, $\\varphi(x + y) = e^{-5(x + y)}$. Step 2: simplify the exponent to $e^{-5x - 5y}$. Step 3: apply the map on the right, $\\varphi(x) \\varphi(y) = e^{-5x} e^{-5y}$. Step 4: use the exponent law $e^a e^b = e^{a+b}$ to get $e^{-5x - 5y}$. Both sides are equal for all real $x$ and $y$, so $\\varphi$ is a homomorphism. The answer is verdict = yes; value = e^(-5x-5y)."
        constraints: "check $\\varphi(x * y) = \\varphi(x) \\cdot \\varphi(y)$ symbolically; note which operation lives on each side"
      - id: kp2
        name: "Refuting with a counterexample"
        key_prerequisites: [groups-intro]
        exemplars:
          - problem: "For the map φ on the integers with φ(n) = n + 4, state whether it is a homomorphism, and give φ(5 + 2) - (φ(5) + φ(2))."
            answer: "verdict = invalid; diff = -4"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["valid"], ["invalid"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "diff"}]}
            solution_sketch: "The full object is the map φ(n) = n + 4 from (Z, +) to (Z, +). Step 1: evaluate the left side using the map, φ(5 + 2) = φ(7) = 11. Step 2: evaluate the right side, φ(5) + φ(2) = 9 + 6 = 15. Step 3: subtract to test the homomorphism condition, 11 - 15 = -4. The option valid would come from ignoring the constant +4; the nonzero difference refutes additivity. Thus verdict = invalid; diff = -4."
          - problem: "For the map φ on the integers with φ(n) = 2n + 3, use the identity check to compute φ(0)."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full object is the map φ(n) = 2n + 3 from (Z, +) to (Z, +). Step 1: the identity of the domain is 0. Step 2: evaluate φ(0) = 2*0 + 3 = 3. Step 3: the identity of the codomain is also 0, and 3 is not 0, so the identity check refutes the homomorphism condition. The value is 3."
          - problem: "For the map φ on the integers with φ(n) = n^3, compute φ(2 + 1) - (φ(2) + φ(1))."
            answer: "18"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full object is the map φ(n) = n^3 from (Z, +) to (Z, +). Step 1: φ(2 + 1) = φ(3) = 27. Step 2: φ(2) + φ(1) = 8 + 1 = 9. Step 3: subtract, 27 - 9 = 18. The value 18 is nonzero, so additivity fails; the difference is 18."
          - problem: "For the map φ on the reals with φ(x) = x^2, state whether it is a homomorphism, and give φ(2 + 3) - (φ(2) + φ(3))."
            answer: "verdict = invalid; diff = 12"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["valid"], ["invalid"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "diff"}]}
            solution_sketch: "The full object is the map φ(x) = x^2 from (R, +) to (R, +). Step 1: φ(2 + 3) = φ(5) = 25. Step 2: φ(2) + φ(3) = 4 + 9 = 13. Step 3: subtract, 25 - 13 = 12. The option valid would come from treating (x + y)^2 as x^2 + y^2; the nonzero difference refutes additivity. Thus verdict = invalid; diff = 12."
          - problem: "For the map φ on the nonzero reals with φ(x) = 2x, compute φ(2*3) - φ(2)φ(3)."
            answer: "-12"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full object is the map φ(x) = 2x from (R*, *) to (R*, *). Step 1: φ(2*3) = φ(6) = 12. Step 2: φ(2)φ(3) = 4*6 = 24. Step 3: subtract, 12 - 24 = -12. The nonzero difference refutes multiplicative preservation; the difference is -12."
          - problem: "For the map φ on the integers with φ(n) = n^2 + 1, compute φ(5 + 1) - (φ(5) + φ(1))."
            answer: "9"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full object is the map φ(n) = n^2 + 1 from (Z, +) to (Z, +). Step 1: φ(5 + 1) = φ(6) = 37. Step 2: φ(5) + φ(1) = 26 + 2 = 28. Step 3: subtract, 37 - 28 = 9. The value 9 is nonzero, so additivity fails; the difference is 9."
        constraints: "one concrete pair where the two sides differ; the identity check is a fast filter"
      - id: kp3
        name: "Between different structures"
        key_prerequisites: [groups-intro]
        exemplars:
          - problem: 'Is $\varphi(x) = |x|$ a homomorphism $(\mathbb{R} \setminus \{0\}, \cdot) \to (\mathbb{R}^{>0}, \cdot)$?'
            answer_contract: {kind: none}
            answer: 'Yes: $|xy| = |x| \cdot |y|$.'
            solution_sketch: 'Absolute value is multiplicative, and outputs are positive as required.'
          - problem: 'Is the parity map $\varphi(n) = n \bmod 2$, from $(\mathbb{Z}, +)$ to $(\{0, 1\}, \oplus_2)$ (addition mod $2$), a homomorphism?'
            answer_contract: {kind: none}
            answer: 'Yes: $(m + n) \bmod 2 = (m \bmod 2) \oplus_2 (n \bmod 2)$.'
            solution_sketch: 'The parity of a sum depends only on the parities of the summands — the mod-$2$ addition table.'
        constraints: "the two operations differ; make explicit which is used where"
    diagnostic_exemplar:
      problem: 'Decide, with justification: (a) is $\varphi(n) = n \bmod 3$ a homomorphism $(\mathbb{Z}, +) \to (\mathbb{Z}_3, +)$? (b) is $\psi(x) = x^2$ a homomorphism $(\mathbb{R}, +) \to (\mathbb{R}, +)$?'
      answer_contract: {kind: none}
      answer: '(a) Yes: reduction mod $3$ satisfies $(m + n) \bmod 3 = (m \bmod 3) + (n \bmod 3)$ in $\mathbb{Z}_3$, which is exactly the homomorphism condition — note the operation is ordinary addition on the left and addition mod $3$ on the right. (b) No: the condition would read $(x + y)^2 = x^2 + y^2$, which fails at $x = y = 1$ ($4 \ne 2$); the cross term $2xy$ spoils it.'
      solution_sketch: 'Test $\varphi(x \ast y) = \varphi(x) \ast \varphi(y)$ with the correct operation on each side; one numerical counterexample refutes.'
    anki_seeds:
      - front: 'Fast first check when testing whether $\varphi$ is a group homomorphism?'
        back: 'Whether $\varphi(e_G) = e_H$ — if not, it cannot be a homomorphism.'
        type: basic
      - front: 'Is $x \mapsto x + c$ ($c \ne 0$) a homomorphism of $(\mathbb{R}, +)$?'
        back: 'No — it sends $0$ to $c \ne 0$.'
        type: basic

  - id: homomorphisms-intro
    name: "Introduction to Homomorphisms"
    core: true
    difficulty: 0.68
    drill: false
    answer_kind: proof
    expected_time_secs: 240
    prerequisites:
      - id: groups-intro
        weight: 0.5
        key: true
      - id: functions-injective-surjective
        weight: 0.4
        key: true
      - id: checking-homomorphisms
        weight: 0.4
        key: true
      - id: function-composition-inverse
        weight: 0.3
      - id: powers-in-monoids
        weight: 0.2
      - id: log-product-quotient-rules
        weight: 0.3
        key: false
      - id: common-natural-logarithms
        weight: 0.2
        key: false
      - id: monoids
        weight: 0.0
    knowledge_points:
      - id: kp1
        name: "The homomorphism condition"
        key_prerequisites: [groups-intro]
        exemplars:
          - problem: "To prove that the exponential map exp from (R, +) to (R>0, *) satisfies the homomorphism condition, one rewrites exp(x + y) as a product. Give that product form, using the exponent product law."
            answer: "e^(x)*e^(y)"
            answer_contract: {"kind": "function", "vars": ["x", "y"]}
            solution_sketch: "Full object: exp(x + y) = e^(x + y). Step 1: apply the exponent product law a^(m+n) = a^m a^n with base e to rewrite e^(x + y) as a product. Step 2: read off the factors e^(x) and e^(y). The answer is e^(x)*e^(y)."
          - problem: "To prove that the natural logarithm map ln from (R>0, *) to (R, +) satisfies the homomorphism condition, one rewrites ln(xy) as a sum. Give that sum form, using the logarithm product law."
            answer: "ln(x)+ln(y)"
            answer_contract: {"kind": "function", "vars": ["x", "y"]}
            solution_sketch: "Full object: ln(xy). Step 1: apply the logarithm product law ln(ab) = ln(a) + ln(b) with a = x and b = y. Step 2: this expresses the product as a sum, which is the homomorphism condition for this map. The answer is ln(x)+ln(y)."
          - problem: "Let phi(x) = e^(3x), a map from (R, +) to (R>0, *). To check the homomorphism condition phi(x + y) = phi(x) phi(y), rewrite phi(x + y) as a product of two exponential terms. Give the product."
            answer: "e^(3x)*e^(3y)"
            answer_contract: {"kind": "function", "vars": ["x", "y"]}
            solution_sketch: "Full object: phi(x + y) = e^(3(x + y)). Step 1: expand the exponent by the distributive law to get e^(3x + 3y). Step 2: apply the exponent product law to write e^(3x + 3y) as a product. The answer is e^(3x)*e^(3y)."
          - problem: "A student claims that phi(x) = x^2 is a homomorphism from (R, +) to (R, +), meaning phi(x + y) = phi(x) phi(y). Test the condition at x = 1 and y = 1, and give the value of phi(2) minus phi(1) phi(1)."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Full object: the condition phi(x + y) = phi(x) phi(y) at x = y = 1. Step 1: compute phi(2) = 2^2 = 4. Step 2: compute phi(1) phi(1) = 1 times 1 = 1. Step 3: the difference is 4 minus 1. The answer is 3."
          - problem: "Claim: phi(x) = x^2 is a homomorphism from (R, +) to (R, +), so phi(x + y) = phi(x) phi(y). Step 1: phi(x + y) = (x + y)^2. Step 2: (x + y)^2 = x^2 + y^2. Step 3: so phi(x + y) = phi(x) phi(y). Step 4: therefore phi is a homomorphism. Which step is the first step that is not valid?"
            answer: "Step 2"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "Full object: the four-step argument for phi(x) = x^2. Step 1 is a correct substitution. Step 2 is false: the square of a sum is x^2 + 2xy + y^2, not x^2 + y^2; the error is dropping the cross term. Step 3 and Step 4 merely build on the false identity. The answer is Step 2."
          - problem: "In the proof that phi(x) = e^(3x) from (R, +) to (R>0, *) satisfies phi(x + y) = phi(x) phi(y), the line e^(3x + 3y) = ? is missing. Select the line that is true and that completes the proof."
            answer: "e^(3x)*e^(3y)"
            answer_contract: {"kind": "label", "options": [["e^(3x)*e^(3y)"], ["e^(3x)+e^(3y)"], ["3*e^(x)*e^(y)"], ["e^(x)*e^(y)"]]}
            solution_sketch: "Full object: the missing line for e^(3x + 3y). Step 1: the exponent product law gives e^(3x + 3y) = e^(3x) e^(3y). The option e^(3x)+e^(3y) is the error of turning the operation into a sum. The option 3*e^(x)*e^(y) wrongly pulls the 3 out of the exponent. The option e^(x)*e^(y) drops the factor 3. The answer is e^(3x)*e^(3y)."
          - problem: "Write the full proof: the map phi from (R, +) to (R>0, *) given by phi(x) = e^(2x) satisfies phi(x + y) = phi(x) phi(y) for all real x and y. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Claim: for all real x, y, phi(x + y) = phi(x) phi(y), where phi(x) = e^(2x). Step 1 (definition): compute phi(x + y) = e^(2(x + y)) = e^(2x + 2y). Step 2 (exponent product law): rewrite e^(2x + 2y) = e^(2x) e^(2y). Step 3 (recognize the map): e^(2x) = phi(x) and e^(2y) = phi(y), so phi(x + y) = phi(x) phi(y). Step 4 (conclusion): the operation in the domain is addition and in the codomain is multiplication, so this equality is exactly the homomorphism condition phi(x * y) = phi(x) . phi(y) with * the addition and the dot the multiplication. Hence phi is a homomorphism from (R, +) to (R>0, *), which completes the proof."
        constraints: "prove $\\varphi(x * y) = \\varphi(x) \\cdot \\varphi(y)$ for a map between different operations"
      - id: kp2
        name: "Homomorphisms preserve identity"
        key_prerequisites: [groups-intro]
        exemplars:
          - problem: 'Prove: a group homomorphism $\varphi : G \to H$ satisfies $\varphi(e_G) = e_H$.'
            answer: '$\varphi(e_G) = \varphi(e_G)^2$; cancel.'
            solution_sketch: '$\varphi(e_G) = \varphi(e_G e_G) = \varphi(e_G)\varphi(e_G)$. Multiplying by $\varphi(e_G)^{-1}$ in $H$ gives $e_H = \varphi(e_G)$. $\square$'
          - problem: 'Prove: for a group homomorphism $\varphi$, $\varphi(e_G)$ is idempotent: $\varphi(e_G)\varphi(e_G) = \varphi(e_G)$.'
            answer: '$\varphi(e_G e_G) = \varphi(e_G)$.'
            solution_sketch: '$\varphi(e_G)\varphi(e_G) = \varphi(e_G e_G) = \varphi(e_G)$, using $e_G e_G = e_G$ and that $\varphi$ preserves products. (Cancelling then gives $\varphi(e_G) = e_H$.) $\square$'
        constraints: "use $e_G e_G = e_G$ and cancellation in $H$"
      - id: kp3
        name: "Homomorphisms preserve inverses and powers"
        key_prerequisites: [function-composition-inverse]
        exemplars:
          - problem: "Let φ be a group homomorphism from (Z,+) to (Z,+) with φ(1) = 7. Use the rule that homomorphisms preserve inverses to find φ(-4)."
            answer: "-28"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: the inverse-preservation rule gives φ(-4) = -φ(4). Step 2: the homomorphism property gives φ(4) = 4 φ(1) = 4 * 7 = 28. Step 3: therefore φ(-4) = -28. The value is -28."
          - problem: "Let φ be a group homomorphism from the positive reals under multiplication to itself. Suppose φ(3) = 9. Use the rule that homomorphisms preserve powers to find φ(27)."
            answer: "729"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: write 27 as 3^3. Step 2: the power-preservation rule gives φ(3^3) = φ(3)^3. Step 3: substitute φ(3) = 9, so φ(27) = 9^3 = 729. The value is 729."
          - problem: "In the induction proof that a group homomorphism φ satisfies φ(x^n) = φ(x)^n for every n ≥ 1, the base case is n = 1. Give the value of n used in the base case."
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: the induction proof of φ(x^n) = φ(x)^n starts with the base case n = 1. Step 2: at n = 1 both sides are φ(x), so the base case holds. Step 3: the base case uses n = 1. The value is 1."
          - problem: "Let φ be a group homomorphism from (Z,+) to (Z,+) with φ(1) = 4. Homomorphisms send the identity to the identity. Find φ(0)."
            answer: "0"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: a group homomorphism sends the identity to the identity, so φ(0) = 0 in the additive group (Z,+). Step 2: this follows because φ(0) = φ(0+0) = φ(0)+φ(0). Step 3: subtract φ(0) from both sides to get φ(0) = 0. The value is 0."
          - problem: "Let φ be a group homomorphism from the nonzero reals under multiplication to itself with φ(2) = 5. Use inverse preservation to find φ(2^{-1})."
            answer: "1/5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: the inverse-preservation rule gives φ(2^{-1}) = φ(2)^{-1}. Step 2: substitute φ(2) = 5, so φ(2^{-1}) = 5^{-1} = 1/5. The value is 1/5."
          - problem: "Let φ be a group homomorphism from the positive reals under multiplication to itself with φ(5) = 25. Use the rule that homomorphisms preserve powers to find φ(125)."
            answer: "15625"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: write 125 as 5^3. Step 2: the power-preservation rule gives φ(5^3) = φ(5)^3. Step 3: substitute φ(5) = 25, so φ(125) = 25^3 = 15625. The value is 15625."
          - problem: "Write the full proof: for a group homomorphism φ and any element x, prove φ(x^{-1}) = φ(x)^{-1} and φ(x^n) = φ(x)^n for every integer n ≥ 1. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Proof of inverses. Step 1: use identity preservation. φ(x) φ(x^{-1}) = φ(x x^{-1}) = φ(e_G) = e_H. Step 2: also φ(x^{-1}) φ(x) = φ(x^{-1} x) = φ(e_G) = e_H. Step 3: both products equal the identity, so φ(x^{-1}) is the inverse of φ(x), that is φ(x^{-1}) = φ(x)^{-1}. Proof of powers. Step 4: base case n = 1 gives φ(x^1) = φ(x) = φ(x)^1. Step 5: assume φ(x^k) = φ(x)^k. Then φ(x^{k+1}) = φ(x^k x) = φ(x^k) φ(x) = φ(x)^k φ(x) = φ(x)^{k+1}. Step 6: by induction, φ(x^n) = φ(x)^n for every n ≥ 1. This completes both proofs."
        constraints: "reduce to identity-preservation; use induction for powers"
    diagnostic_exemplar:
      problem: 'Let $\varphi : (\mathbb{Z}, +) \to (\mathbb{Z}, +)$ be a homomorphism with $\varphi(1) = 3$. Prove $\varphi(n) = 3n$ for all $n \in \mathbb{Z}$.'
      answer: 'Additivity forces $\varphi(n) = n\varphi(1) = 3n$.'
      solution_sketch: 'For $n \ge 0$, $\varphi(n) = \varphi(1 + \cdots + 1) = n\varphi(1) = 3n$ by induction; $\varphi(0) = 0$ and $\varphi(-n) = -\varphi(n) = -3n$. So $\varphi(n) = 3n$ for all $n$. $\square$'
    anki_seeds:
      - front: 'Definition of a group homomorphism?'
        back: 'A map $\varphi : G \to H$ with $\varphi(xy) = \varphi(x)\varphi(y)$ for all $x, y \in G$.'
        type: basic
      - front: 'What do homomorphisms do to identity and inverses?'
        back: '$\varphi(e_G) = e_H$ and $\varphi(x^{-1}) = \varphi(x)^{-1}$.'
        type: basic
      - front: 'An isomorphism is...'
        back: 'a bijective homomorphism (its inverse map is then also a homomorphism).'
        type: basic

  - id: finite-cardinality-bijections
    name: "Finite Cardinality via Bijections"
    core: false                # supplemental: head of the terminal cardinality branch
    difficulty: 0.62
    drill: false
    answer_kind: proof
    expected_time_secs: 190
    prerequisites:
      - id: functions-injective-surjective
        weight: 0.5
        key: true
      - id: pigeonhole-principle
        weight: 0.4
        key: true
      - id: counting-functions
        weight: 0.2
    knowledge_points:
      - id: kp1
        name: "Size as a bijection with {1, ..., n}"
        key_prerequisites: [functions-injective-surjective]
        exemplars:
          - problem: "For the set {2, 4, 6, ..., 2n}, a bijection from {1, 2, ..., n} has the form f(k) = c k. Give f(k)."
            answer: "2k"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Try the map f(k) = c k on {1, 2, ..., n}. The first target value is 2 = c*1, so c = 2 and f(k) = 2k. Check injectivity: 2a = 2b gives a = b. Check surjectivity: every value 2k in the list is hit by k. The answer is 2k."
          - problem: "For the set {5, 6, 7, ..., 17}, a bijection from {1, 2, ..., 13} has the form f(k) = k + c. Give f(k)."
            answer: "k+4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Try f(k) = k + c on {1, 2, ..., 13}. The first target value is 5, and f(1) = 1 + c = 5, so c = 4. By the injectivity check, a + 4 = b + 4 gives a = b. By the surjectivity check, each target value k + 4 is hit by k. The answer is k+4."
          - problem: "The map f(k) = k + 7 bijects {1, 2, ..., n} onto {8, 9, ..., 42}. Find n."
            answer: "35"
            answer_contract: {"kind": "exact"}
            solution_sketch: "By surjectivity, the largest target 42 must equal n + 7. Solve n + 7 = 42, so n = 35. The injectivity check holds for the same map, so the bijection condition is satisfied. The answer is 35."
          - problem: "The map f(k) = k + 5 bijects {1, 2, ..., n} onto {6, 7, ..., n+5}. Give the inverse f^(-1)(y)."
            answer: "y-5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Start with y = f(k) = k + 5. Solve for k by subtracting 5 from both sides: k = y - 5. This inverse formula undoes the shift and confirms the bijection. The answer is y-5."
          - problem: "Claim: the rule f(k) = 2k is a bijection from {1, 2, 3} onto the set {2, 4, 7}. Step 1: take f(k) = 2k when k is 1, 2 or 3. Step 2: if f(a) = f(b), then 2a = 2b, hence a = b, so f is injective. Step 3: the values f(1), f(2), f(3) are 2, 4 and 6, so every member of {2, 4, 7} is among them, so f is surjective. Step 4: f is therefore a bijection, and the two sets have the same size. Which step is the first step that is not valid?"
            answer: "Step 3"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "Step 1 is a sound rule for the three inputs of the domain. Step 2 is a sound injectivity argument, since doubling keeps unequal inputs unequal. Step 3 is false: the values are 2, 4 and 6, and the member 7 has no preimage in {1, 2, 3}. Step 4 leans on the false Step 3. Picking Step 1 is the error of rejecting a correct rule, picking Step 2 is the error of rejecting a correct injectivity argument, and picking Step 4 misses that the flaw lies earlier. The answer is Step 3."
          - problem: "Claim: f(k) = k + 2 is a bijection from {1, 2, 3} onto {3, 4, 6}. Give the element of the claimed codomain that has no preimage."
            answer: "6"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Compute the outputs of f(k) = k + 2 on {1, 2, 3}: f(1)=3, f(2)=4, f(3)=5. The claimed codomain {3, 4, 6} contains 6, but no input gives 6, so the surjectivity condition fails. The answer is 6."
          - problem: "Write the full proof: the set {4, 8, 12, ..., 4n} has exactly n elements. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1: Define f from {1, 2, ..., n} to {4, 8, 12, ..., 4n} by f(k) = 4k. Step 2: For injectivity, if f(a) = f(b), then 4a = 4b, so a = b. Step 3: For surjectivity, every element of the target set has the form 4k for an integer k with 1 <= k <= n, and f(k) = 4k. Step 4: Since f is injective and surjective, it is a bijection. A bijection with {1, 2, ..., n} proves that the target set has exactly n elements. The answer is See the solution."
        constraints: "exhibit an explicit bijection from $\\{1, \\dots, n\\}$ and verify both properties"
      - id: kp2
        name: "Bijections and matching sizes"
        key_prerequisites: [pigeonhole-principle]
        exemplars:
          - problem: "In the proof that a bijection between finite sets forces equal sizes, let A be a set with 8 elements and let f from A to B be a bijection. One step of the proof computes the number of elements of the image f(A). Give that number."
            answer: "8"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: recall the definition: a bijection is both injective and surjective. Step 2: injectivity sends the 8 elements of A to 8 distinct elements, so f(A) has 8 elements. Step 3: surjectivity gives f(A) = B, so B also has 8 elements. The answer is 8."
          - problem: "Let A have 9 elements and B have 4 elements. A function f from A to B sends each element of A to one element of B. Decide whether f can be injective, and give the largest N such that the pigeonhole principle guarantees that some element of B is the image of at least N elements of A. Give the verdict and the bound."
            answer: "verdict = No; bound = 3"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["Yes"], ["No"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "bound"}]}
            solution_sketch: "Step 1: apply the pigeonhole principle: 9 inputs distributed among 4 outputs force some output to receive at least ceiling(9/4) = 3 inputs. Step 2: an injective function would need 9 distinct images, but B has only 4 elements, so no injection exists; the option Yes is the error of ignoring this counting bound. Step 3: the largest N the principle guarantees is therefore 3. The answer is verdict = No; bound = 3."
          - problem: "A student claims: for every whole number n with n at least 1, there is an injective function from a set with n elements to a set with 4 elements. The student checks only n = 1 and n = 2. Give the smallest n for which the claim is false."
            answer: "5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: for n = 1, 2, 3, 4 an injection exists, for example sending each element to a distinct one of the 4 elements. Step 2: for n = 5, injectivity needs 5 distinct images in a 4-element set; by the pigeonhole principle two inputs must share an image. Step 3: so the first failing case is n = 5, and two true cases are not a proof. The answer is 5."
          - problem: "In the proof that an injective function between finite sets of equal size is a bijection, one first counts the injective functions from a 3-element set A to a 3-element set B. How many injective functions from A to B exist?"
            answer: "6"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: count the injections by choosing distinct images in order: 3 choices, then 2, then 1, giving 3 times 2 times 1 = 6. Step 2: every injective map from a 3-element set to a 3-element set uses all 3 elements of B, hence is surjective, hence a bijection. The answer is 6."
          - problem: "Claim: if there is an injective function from A to B, then A has at least as many elements as B. Step 1: let A have 3 elements and B have 5 elements. Step 2: suppose f from A to B is injective, so f sends the 3 elements of A to 3 distinct elements of B. Step 3: the image of f has 3 elements and is contained in B, so B has at least as many elements as A. Step 4: since B has at least as many elements as A, this proves that A has at least as many elements as B. Which step is the first step that is not valid?"
            answer: "Step 4"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "Step 1 is a valid setup with concrete sizes, and an injection from a 3-element set to a 5-element set does exist. Step 2 is valid: injectivity sends the 3 distinct inputs to 3 distinct outputs. Step 3 is valid: the image has 3 elements, is contained in B, so B has at least as many elements as A. Step 4 is the first invalid step: it reverses the inequality from Step 3, claiming that A has at least as many elements as B, which is false here since 3 is less than 5. The answer is Step 4."
          - problem: "In the pigeonhole argument that a function from a 10-element set A to a 3-element set B is not injective, one shows that some element of B is the image of at least N elements of A. Give the largest N that the pigeonhole principle guarantees."
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: distribute 10 inputs among 3 outputs; the pigeonhole principle forces some output to receive at least ceiling(10/3) = 4 inputs. Step 2: the value 3 is not guaranteed, since 3 outputs could receive 3 inputs each and 3 times 3 = 9 is less than 10, so 4 is the largest guaranteed value. The answer is 4."
          - problem: "Write the full proof: for finite sets A and B, an injective function from A to B exists if and only if A has at most as many elements as B. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1 (setup): let A have m elements and B have n elements; by finiteness, both sets admit listings of their elements. Step 2 (forward direction): let f from A to B be injective; then the image f(A) has exactly m elements, since injectivity sends distinct inputs to distinct outputs, and f(A) is contained in B, so m is at most n. Step 3 (pigeonhole obstruction): if m is greater than n, the pigeonhole principle forces two distinct elements of A to share an image, so no injective function can exist; this shows the bound m at most n is necessary. Step 4 (reverse direction): if m is at most n, list A as a1 up to am and B as b1 up to bn, and define f(ai) = bi for each i; distinct inputs receive distinct outputs, so f is injective. Step 5 (conclusion): an injective function from A to B exists exactly when m is at most n, which is the claim."
        constraints: "connect bijections/injections to size comparisons via pigeonhole"
      - id: kp3
        name: "Cardinality arithmetic"
        key_prerequisites: [functions-injective-surjective]
        exemplars:
          - problem: "Let A = {p, q, r} and B = {u, v}. Use counting bijections f(1) = p, f(2) = q, f(3) = r and g(1) = u, g(2) = v. Define h on {1, 2, 3, 4, 5} by h(i) = f(i) for i <= 3 and h(i) = g(i - 3) for i > 3. Give the index i with h(i) = u."
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Construction: the disjoint-union rule puts f on 1 through 3 and g shifted by 3 afterward. The full h is h(1)=p, h(2)=q, h(3)=r, h(4)=u, h(5)=v. The index with h(i)=u is i=4."
          - problem: "Let A be a finite set with counting bijection f from {1, 2, 3, 4} to A. Let a be an element with a not in A. Extend f to g on {1, 2, 3, 4, 5} by g(i) = f(i) for i = 1, 2, 3, 4 and g(5) = a. Give the cardinality of A union {a}."
            answer: "5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Extension rule: keep the old bijection f on 1 through 4 and use the new index 5 for a. The full domain has indices 1, 2, 3, 4, 5. The cardinality of A union {a} is 5."
          - problem: "Let A = {a1, a2, a3, a4} and B = {b1, b2, b3} with counting bijections f(1) = a1, f(2) = a2, f(3) = a3, f(4) = a4 and g(1) = b1, g(2) = b2, g(3) = b3. Define h on {1, ..., 12} by h((i - 1)3 + j) = (f(i), g(j)) for 1 <= i <= 4 and 1 <= j <= 3. Give the index k with h(k) = (a3, b2)."
            answer: "8"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Product bijection rule: index i,j by (i - 1)3 + j. The full h starts h(1)=(a1,b1), h(2)=(a1,b2), h(3)=(a1,b3), h(4)=(a2,b1), and continues. For (a3,b2), i=3 and j=2 give k=(3-1)3+2=8."
          - problem: "Let A = {2, 4, 6, 8, 10} and B = {4, 8}. Define a bijection h from {1, 2, 3} to A minus B by listing the elements of A minus B in increasing order. Give h(2)."
            answer: "6"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Difference listing rule: remove B from A and list the remaining elements in increasing order. The remaining set is {2, 6, 10}, so h(1)=2, h(2)=6, h(3)=10. The value h(2) is 6."
          - problem: "Claim: if A and B are finite and disjoint, then a bijection h from {1, ..., |A| + |B|} to A union B is built by h(i) = f(i) for i <= |A| and h(i) = g(i - |A|) for i > |A|. Step 1: f and g are counting bijections. Step 2: h is defined on all i from 1 to |A| + |B|. Step 3: h(i) = g(i - |A|) for i <= |A|. Step 4: disjointness makes h injective. Which step is the first step that is not valid?"
            answer: "Step 3"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "Step 1 is correct: f and g count A and B. Step 2 is correct: the two ranges cover all indices. Step 3 is false: for i <= |A| the rule must use f(i), not g. Step 4 is correct: disjointness separates the two image parts. The answer is Step 3."
          - problem: "Let A = {2, 4, 6, 8, 10, 12} and B = {6, 8, 10, 14, 16}. Define a bijection h from {1, ..., 8} to A union B by listing A minus B in increasing order first and then B in increasing order. Give the index i with h(i) = 14."
            answer: "7"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Difference-then-copy rule: list A minus B first, then all of B. The full h is h(1)=2, h(2)=4, h(3)=12, h(4)=6, h(5)=8, h(6)=10, h(7)=14, h(8)=16. The index with h(i)=14 is i=7."
          - problem: "Write the full proof: if A and B are finite, then |A × B| = |A| · |B|, by building an explicit bijection from {1, ..., |A||B|} to A × B. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Let m = |A| and n = |B|. Choose counting bijections f from {1, ..., m} to A and g from {1, ..., n} to B. Define h from {1, ..., mn} to A × B by h((i - 1)n + j) = (f(i), g(j)) for 1 <= i <= m and 1 <= j <= n. This is well-defined because every k in {1, ..., mn} has unique i = ceil(k/n) and j = k - (i - 1)n. Injectivity: if h(i, j) = h(i', j'), then f(i) = f(i') and g(j) = g(j'), so i = i' and j = j' because f and g are injective. Surjectivity: any (a, b) in A × B has a = f(i) and b = g(j) for unique i, j, so h((i - 1)n + j) = (a, b). Therefore h is a bijection, and |A × B| = m n = |A| times |B|."
        constraints: "build the new bijection explicitly from the given ones"
    diagnostic_exemplar:
      problem: 'Let $A = \{10, 11, \dots, 99\}$ and $B = \{200, 201, \dots, 209\}$. Prove that $|A| = 90$ and that $|A \cup B| = 100$.'
      answer: 'The map $k \mapsto k + 9$ sends $\{1, \dots, 90\}$ into $A$; it is injective (adding $9$ is) and onto ($a \in A$ equals $(a-9) + 9$ with $1 \le a - 9 \le 90$), so it is a bijection and $|A| = 90$. Likewise $k \mapsto k + 199$ is a bijection $\{1, \dots, 10\} \to B$, so $|B| = 10$. The sets are disjoint, since every element of $A$ is at most $99$ and every element of $B$ is at least $200$. Concatenating the two counting bijections gives $h : \{1, \dots, 100\} \to A \cup B$ with $h(j) = j + 9$ for $1 \le j \le 90$ and $h(j) = j + 109$ for $91 \le j \le 100$ (so $h(91) = 200$ and $h(100) = 209$); $h$ is a bijection, hence $|A \cup B| = 100 = |A| + |B|$.'
      solution_sketch: 'Exhibit a shift bijection from an initial segment for each set, then glue the two bijections — legitimate because the sets are disjoint.'
    anki_seeds:
      - front: '"$A$ has $n$ elements" formally means...'
        back: 'there is a bijection $\{1, 2, \dots, n\} \to A$.'
        type: basic
      - front: 'For finite sets, an injection $A \to B$ exists iff...'
        back: '$|A| \le |B|$.'
        type: basic

  - id: infinite-sets
    name: "Infinite Sets"
    core: false                # supplemental: cardinality branch
    difficulty: 0.66
    drill: false
    answer_kind: proof
    expected_time_secs: 210
    prerequisites:
      - id: finite-cardinality-bijections
        weight: 0.5
        key: true
      - id: proof-by-contradiction
        weight: 0.4
        key: true
    knowledge_points:
      - id: kp1
        name: "Finite vs infinite; subsets and supersets"
        key_prerequisites: [finite-cardinality-bijections]
        exemplars:
          - problem: "In the contrapositive proof that a set containing an infinite set must itself be infinite, suppose the larger set B is finite, with a bijection pairing the elements of B with the numbers 1 to 14, and A is a subset of B. The subset-of-finite fact then caps how many elements A can have. Give the largest possible number of elements of A."
            answer: "14"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Set up the contrapositive: to prove that a set containing an infinite set is infinite, suppose the larger set B is finite with exactly 14 elements. Apply the subset-of-finite fact: every subset of a finite set is finite, so the subset A is finite with at most 14 elements. Reach the contradiction: an infinite set cannot have 14 or fewer elements, so B cannot be finite. The largest possible number of elements of A is 14."
          - problem: "It is given that the set of natural numbers is infinite. A student claims that the set of all integers is finite with exactly 7 elements. Since every natural number is an integer, this cannot be. Give the smallest number of natural numbers that cannot all be distinct elements of a set with exactly 7 elements."
            answer: "8"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Superset fact: the set of all integers contains every natural number. Contrapositive: if the integers were finite with exactly 7 elements, the naturals would form a subset of a 7-element set. Subset-of-finite fact: such a subset has at most 7 elements, so at most 7 natural numbers could be distinct members. Contradiction: the naturals are given to be infinite, so the student's claim fails. The smallest number of natural numbers that cannot fit is 8."
          - problem: "A student claims: if A is a subset of B and A is finite, then B must also be finite. The claim fails for a suitable choice of A and B. Give the smallest number of elements that the finite set A can have while B is infinite."
            answer: "0"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Identify the direction error: the claim treats every superset of a finite set as finite, but only subsets of finite sets must be finite. Build a counterexample: take A to be the empty set, which has 0 elements and is finite, and take B to be the set of natural numbers, which is infinite. Verify: the empty set is a subset of every set, so A is a subset of B. No set has fewer than 0 elements, so the smallest number of elements of A is 0."
          - problem: "Claim: every subset of an infinite set is infinite. Step 1: Let B be an infinite set and let A be a subset of B. Step 2: Suppose, toward a contradiction, that A is finite. Step 3: Since A is finite and A is a subset of B, the subset-of-finite fact forces B to be finite. Step 4: This contradicts that B is infinite, so A is infinite. Which step is the first step that is not valid?"
            answer: "Step 3"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "Step 1 is valid: it names an infinite set B and a subset A of B. Step 2 is valid: it sets up a proof by contradiction. Step 3 is the first invalid step: the subset-of-finite fact says that a subset of a finite set is finite; it says nothing about a set that contains a finite set, so it cannot force B to be finite. Step 4 would be a valid deduction, but only if Step 3 were true. The answer is Step 3."
          - problem: "A student proves: if the infinite set S is contained in T, then T is infinite. Line 1: Take the contrapositive. Line 2: Suppose there is a bijection f from T onto 1, 2, ..., m. Line 3: (the line is missing). Line 4: This contradicts the fact that S is infinite. Line 5: Hence T is infinite. Select the line that is true and that fits as Line 3."
            answer: "Restricting f to S maps S into 1, 2, ..., m, which makes S finite."
            answer_contract: {"kind": "label", "options": [["Restricting f to T maps T into 1, 2, ..., m, which makes T finite."], ["Restricting f to S maps S into 2, 3, ..., m, which makes S finite."], ["Restricting f to S maps S into 1, 2, ..., m, which makes S finite."], ["Restricting f to S maps S onto 1, 2, ..., m, which makes S finite."]]}
            solution_sketch: "The missing line must use the hypothesis that S is contained in T: the restriction of f to S sends each element of S to a number from 1 to m, and distinct elements go to distinct numbers, so S is finite, which clashes with Line 4. The option that restricts f to T is f itself and never mentions S, so it cannot produce the clash. The option with the range 2, 3, ..., m drops the number 1, which is a possible value of f. The option with 'onto' claims too much, since the restriction need not hit every number. The answer is Restricting f to S maps S into 1, 2, ..., m, which makes S finite."
          - problem: "It is given that no bijection pairs the set P = {3, 9, 27, 81, ...} of all powers of 3 with the numbers 1 to m, for any whole number m. Let Q be the set P together with the number 2. Select the verdict about Q from the two choices, and give the smallest member of Q that is not a power of 3."
            answer: "verdict = infinite; smallest = 2"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["finite"], ["infinite"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "smallest"}]}
            solution_sketch: "Superset step: Q contains every element of P. Contrapositive: if some whole number m could count Q, then P, as a subset of Q, would also be counted by m by the subset-of-finite fact, contradicting what is given about P. So the verdict on Q is infinite. Membership check: Q adds only the number 2, which is not a power of 3, while every power of 3 is at least 3. The answer is verdict = infinite; smallest = 2."
          - problem: "Write the full proof: suppose A is an infinite set, A is contained in B, and B is contained in C. Prove that B and C are both infinite. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1 (contrapositive for B): to show B is infinite, suppose instead that B is finite. Step 2 (subset-of-finite fact): A is a subset of the finite set B, so A is finite. Step 3 (contradiction): this contradicts the hypothesis that A is infinite, so B is infinite. Step 4 (contrapositive for C): to show C is infinite, suppose instead that C is finite. Step 5 (subset-of-finite fact): B is a subset of the finite set C, so B is finite. Step 6 (contradiction): this contradicts Step 3, which established that B is infinite, so C is infinite. Conclusion: both B and C are infinite, and the proof is complete."
        constraints: "superset/contrapositive arguments; the subset-of-finite fact may be cited"
      - id: kp2
        name: "N is infinite"
        key_prerequisites: [proof-by-contradiction]
        exemplars:
          - problem: 'Prove that $\mathbb{N}$ is infinite: no bijection $\{1, \dots, n\} \to \mathbb{N}$ exists for any $n$.'
            answer: 'The image of any such map misses $\max(f(1), \dots, f(n)) + 1$.'
            solution_sketch: 'Suppose $f : \{1, \dots, n\} \to \mathbb{N}$ were a bijection. Let $M = \max(f(1), \dots, f(n))$. Then $M + 1 \in \mathbb{N}$ is not in the image, so $f$ is not surjective — contradiction. $\square$'
          - problem: 'Prove that the set $\{2^k : k \in \mathbb{N}\}$ of powers of $2$ is infinite.'
            answer: '$k \mapsto 2^k$ injects the infinite set $\mathbb{N}$ into it; or repeat the max-plus-one argument.'
            solution_sketch: 'Any finite list of powers of $2$ has a largest element $2^M$; then $2^{M+1}$ is a power of $2$ not on the list. So no finite enumeration captures the set. $\square$'
        constraints: "contradiction via a maximum-plus-one escape element"
      - id: kp3
        name: "Pairing an infinite set with a proper subset"
        key_prerequisites: [finite-cardinality-bijections]
        exemplars:
          - problem: "For the set N = {0,1,2,...}, consider its proper subset S = {4,5,6,...}. Give a formula for a bijection from N to S."
            answer: "n+4"
            answer_contract: {"kind": "function", "vars": ["n"]}
            solution_sketch: "Define f(n)=n+4 for every n in N. Injective: if a+4=b+4, then a=b. Surjective: for y in S, y-4 is in N and f(y-4)=y. Therefore f is a bijection, and the formula is n+4."
          - problem: "For the open interval (0,1), consider its proper subset (0,1/5). Give a formula for a bijection from (0,1) to (0,1/5)."
            answer: "x/5"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "Define f(x)=x/5 for x in (0,1). Injective: if x1/5=x2/5, then x1=x2. Surjective: for y in (0,1/5), x=5y lies in (0,1) and f(x)=y. Therefore f is a bijection, and the formula is x/5."
          - problem: "To show the map f(x)=x/4 from (0,1) onto (0,1/4) is surjective, take y in (0,1/4) and solve y=x/4 for x. Give x as a formula in y."
            answer: "4y"
            answer_contract: {"kind": "function", "vars": ["y"]}
            solution_sketch: "Start with y in (0,1/4) and the equation y=x/4. Multiply both sides by 4 to get x=4y. Since y is positive, 4y lies in (0,1), so this x is a valid preimage. The formula is 4y."
          - problem: "Claim: f(n)=2n+2 is a bijection from N = {0,1,2,...} to E = {2,4,6,...}. Step 1: define f(n)=2n+2. Step 2: if f(a)=f(b), then 2a+2=2b+2, so a=b; thus f is injective. Step 3: every m in E has preimage (m+2)/2 in N, so f is surjective. Step 4: therefore f is a bijection. Which step is the first step that is not valid?"
            answer: "Step 3"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "Step 1 defines f correctly. Step 2 correctly proves injectivity by cancellation. Step 3 is the first step that is not valid: a preimage n of m must satisfy 2n+2=m, so n=(m-2)/2, not (m+2)/2; with (m+2)/2 the image is m+4. Step 4 would follow only after Step 3 is repaired. The answer is Step 3."
          - problem: "In the surjectivity proof for f(n)=n+2 from N = {0,1,2,...} to {2,3,4,...}, a preimage of m is missing. Select the line that gives a valid preimage of m."
            answer: "(m-2) in N"
            answer_contract: {"kind": "label", "options": [["(m-2) in N"], ["(m+2) in N"], ["(m/2) in N"], ["(2m) in N"]]}
            solution_sketch: "For m in the codomain, a preimage n must satisfy n+2=m. Solving gives n=m-2, which is in N because m is at least 2. Option (m+2) in N adds instead of subtracting. Option (m/2) in N divides instead of subtracting. Option (2m) in N doubles instead of subtracting. The answer is (m-2) in N."
          - problem: "The map f(n)=2n+1 sends N = {0,1,2,...} onto the positive odd integers. Find the preimage of 15."
            answer: "7"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Use the formula f(n)=2n+1 and set f(n)=15. Then 2n+1=15, so 2n=14 and n=7. The preimage is 7."
          - problem: "Write the full proof: the map f(n)=n+6 is a bijection from N = {0,1,2,...} to its proper subset S = {6,7,8,...}. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Claim: f(n)=n+6 is a bijection from N = {0,1,2,...} to S = {6,7,8,...}. Step 1, definition: for each n in N, set f(n)=n+6. Step 2, injectivity: suppose f(a)=f(b). Then a+6=b+6, so a=b. Step 3, surjectivity: let y be in S. Then y is at least 6, so y-6 is in N. Also f(y-6)=(y-6)+6=y. Step 4, conclusion: f is both injective and surjective, hence a bijection. Since S is a proper subset of N, this pairs N with a proper subset."
        constraints: "explicit bijection with a proper subset; verify both directions"
    diagnostic_exemplar:
      problem: 'Prove that the set $E = \{2k : k \in \mathbb{Z}\}$ of even integers is infinite, and exhibit a bijection from $E$ onto its proper subset $\{4k : k \in \mathbb{Z}\}$.'
      answer: 'The map $k \mapsto 2k$ is a bijection $\mathbb{Z} \to E$ (injective since $2k = 2l$ forces $k = l$, onto by definition of $E$). Now $\mathbb{Z}$ is infinite: it contains $\mathbb{N}$, which is infinite, and subsets of finite sets are finite. If $E$ were finite, composing the bijection with a counting bijection would make $\mathbb{Z}$ finite too — so $E$ is infinite. For the second part, $f : E \to \{4k : k \in \mathbb{Z}\}$, $f(x) = 2x$, is injective ($2x = 2y \Rightarrow x = y$) and onto (any $4k$ is $2 \cdot 2k$ with $2k \in E$), and the containment is proper since $2 \in E$ but $2 \notin \{4k\}$.'
      solution_sketch: 'Transport infiniteness along a bijection with $\mathbb{Z}$, then double every even integer — pairing a set with a proper subset is the hallmark of infinity.'
    anki_seeds:
      - front: 'A set is infinite when...'
        back: 'it is not finite: no bijection with $\{1, \dots, n\}$ for any $n$.'
        type: basic
      - front: 'Hallmark of infinite sets impossible for finite ones?'
        back: 'A bijection with a proper subset of itself (e.g. $n \mapsto n + 1$ on $\mathbb{N}$).'
        type: basic

  - id: cardinality-countability
    name: "Cardinality and Countability"
    core: false                # supplemental: cardinality branch
    difficulty: 0.68
    drill: false
    answer_kind: proof
    expected_time_secs: 250
    prerequisites:
      - id: functions-injective-surjective
        weight: 0.5
        key: true
      - id: function-composition-inverse
        weight: 0.4
        key: true
      - id: finite-cardinality-bijections
        weight: 0.4
        key: true
      - id: infinite-sets
        weight: 0.3
      - id: pigeonhole-principle
        weight: 0.0
    knowledge_points:
      - id: kp1
        name: "Equinumerosity via bijection"
        key_prerequisites: [functions-injective-surjective]
        exemplars:
          - problem: "The even natural numbers are E = {0, 2, 4, ...}. Give the bijection f from N to E of the form f(n) = an that shows they have the same cardinality. Give f(n)."
            answer: "2n"
            answer_contract: {"kind": "function", "vars": ["n"]}
            solution_sketch: "Define f from N to E by f(n) = 2n. Injectivity: if 2a = 2b, then a = b by division. Surjectivity: every even m is 2k for k = m/2 in N, so m = f(k). The answer is 2n."
          - problem: "Let S = {-1, 0, 1, 2, ...}. Give the bijection f from N to S of the form f(n) = n + c that shows they have the same cardinality. State f(n)."
            answer: "n-1"
            answer_contract: {"kind": "function", "vars": ["n"]}
            solution_sketch: "Define f from N to S by f(n) = n - 1. Injectivity: if a - 1 = b - 1, then a = b by adding 1. Surjectivity: every m in S has m = f(m + 1) with m + 1 in N. The answer is n - 1."
          - problem: "Let f be the bijection from N to the even natural numbers with f(n) = 2n. Find n as a formula in m when m = f(n)."
            answer: "m/2"
            answer_contract: {"kind": "function", "vars": ["m"]}
            solution_sketch: "The forward map is f(n) = 2n. Set m = 2n. Solve by dividing both sides by 2 to get n = m/2. The answer is m/2."
          - problem: "Let f be the bijection from N to S = {-1, 0, 1, 2, ...} with f(n) = n - 1. Give n as a formula in m when m = f(n)."
            answer: "m+1"
            answer_contract: {"kind": "function", "vars": ["m"]}
            solution_sketch: "The forward map is f(n) = n - 1. Set m = n - 1. Solve by adding 1 to both sides to get n = m + 1. The answer is m + 1."
          - problem: "Let f(n) = 3n + 2. Give the natural number n with f(n) = 17."
            answer: "5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Set the formula equal to 17: 3n + 2 = 17. Subtract 2 from both sides to get 3n = 15. Divide by 3 to get n = 5. Check f(5) = 17. The answer is 5."
          - problem: "Claim: the map f from Z to Z with f(n) = 3n - 2 is a bijection. Step 1: if f(a) = f(b), then 3a - 2 = 3b - 2, so a = b, and f is injective. Step 2: every value 3n - 2 is an integer, so f maps Z into Z. Step 3: for surjectivity, solve 3n - 2 = m: adding 2 and dividing by 3 gives n = (m + 2)/3, which is an integer for every integer m. Step 4: so f is surjective. Step 5: hence f is a bijection. Which step is the first step that is not valid?"
            answer: "Step 3"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"], ["Step 5"]]}
            solution_sketch: "Step 1 is a correct injectivity check: 3a - 2 = 3b - 2 forces a = b. Step 2 is a correct closure check. Step 3 is false: (m + 2)/3 is not an integer for every integer m; for m = 0 it equals 2/3, and indeed 3n - 2 = 0 has no integer solution, so 0 is not in the image. Step 4 and Step 5 are consequences that fail after the correction in Step 3. Choosing Step 1 is the error of rejecting a valid injectivity argument, choosing Step 2 is the error of rejecting a valid closure statement, and choosing Step 4 or Step 5 misses that the first defect already occurs in Step 3. The answer is Step 3."
          - problem: "Write the full proof: the even natural numbers have the same cardinality as the natural numbers. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1: define the map f from N to E by f(n) = 2n. Step 2: check injectivity; if f(a) = f(b), then 2a = 2b, so a = b. Step 3: check surjectivity; if m is in E, then m = 2k for some natural k, so m = f(k). Step 4: both directions hold, so f is a bijection from N to E. Step 5: a bijection exists, so the even natural numbers have the same cardinality as the natural numbers."
        constraints: "exhibit an explicit bijection and verify both directions"
      - id: kp2
        name: "Countable sets"
        key_prerequisites: [functions-injective-surjective]
        exemplars:
          - problem: "The standard bijection from N to Z lists 0, -1, 1, -2, 2, ... . With index starting at 0, find the index paired with -5."
            answer: "9"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: list the standard enumeration: index 0 gives 0, index 1 gives -1, index 2 gives 1, index 3 gives -2, index 4 gives 2, index 5 gives -3, index 6 gives 3, index 7 gives -4, index 8 gives 4, index 9 gives -5. Step 2: read the index paired with -5 from the list. The index paired with -5 is 9."
          - problem: "The odd positive integers can be listed 1, 3, 5, ... . With position starting at 1, find the value in position 12."
            answer: "23"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: use the bijection f(n)=2n-1 from Z+ to the odd positive integers. Step 2: substitute n=12 into f(n)=2n-1. Step 3: compute 2*12-1=23. The value in position 12 is 23."
          - problem: "The even integers are countable. Give a bijection f from Z to the even integers as a formula in n."
            answer: "2n"
            answer_contract: {"kind": "function", "vars": ["n"]}
            solution_sketch: "Step 1: define the candidate f(n)=2n for n in Z. Step 2: check injective: if 2a=2b then a=b. Step 3: check surjective: every even integer has the form 2k for some integer k. The bijection is f(n)=2n."
          - problem: "The integers congruent to 1 modulo 3 are countable. They can be listed 1, 4, 7, ... . With position starting at 0, find the value in position 10."
            answer: "31"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: write the arithmetic progression as value = 1+3n for position n. Step 2: substitute n=10 into value = 1+3n. Step 3: compute 1+3*10=31. The value in position 10 is 31."
          - problem: "Claim: Z is countable. Step 1: define f from N to Z by f(n)=n. Step 2: f is injective because n=m whenever f(n)=f(m). Step 3: f is surjective because every integer appears as some n. Step 4: therefore f is a bijection and Z is countable. Which step is the first step that is not valid?"
            answer: "Step 3"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "Step 1 is valid because it defines a function from N to Z. Step 2 is valid because f(n)=n is injective. Step 3 is the first invalid step because f(n)=n only gives nonnegative integers, so it is not surjective. Step 4 would be valid only if Step 3 were valid. The answer is Step 3."
          - problem: "In the proof that the odd positive integers are countable, the line defining the bijection from Z+ is missing. Select the missing line."
            answer: "2n-1"
            answer_contract: {"kind": "label", "options": [["2n-1"], ["2n+1"], ["n+1"], ["2n"]]}
            solution_sketch: "Step 1: test f(n)=2n-1: f(1)=1, f(2)=3, f(3)=5, so it lists the odd positive integers. Step 2: check the other options. Option 2n+1 gives 3,5,... and misses 1. Option n+1 gives 2,3,... and is not always odd. Option 2n gives even numbers. The answer is 2n-1."
          - problem: "Write the full proof: the set of integers divisible by 3 is countable. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1: Define f from Z to the integers divisible by 3 by f(n)=3n. Step 2: Show f is injective. If f(a)=f(b), then 3a=3b, so a=b. Step 3: Show f is surjective. Every integer divisible by 3 has the form 3k for some integer k, and f(k)=3k. Step 4: Therefore f is a bijection from Z to the set of integers divisible by 3. Step 5: Since Z is countable, this set is countable."
        constraints: "give an explicit enumeration or bijection with $\\mathbb{N}$"
      - id: kp3
        name: "Countability of products and rationals"
        key_prerequisites: [function-composition-inverse]
        exemplars:
          - problem: "In the diagonal enumeration of positive rationals, write each rational as p/q with p, q >= 1. List fractions by increasing p+q, and within one diagonal by increasing p. Skip any fraction that is not in lowest terms and count only the first appearance of each rational. Give the fifth distinct rational in this list."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Diagonal p+q=2 gives 1/1, which is the first distinct rational. Diagonal p+q=3 gives 1/2 and 2/1, the second and third. Diagonal p+q=4 gives 1/3, skips 2/2 because it repeats 1, and gives 3/1, the fourth and fifth. The fifth distinct rational is 3."
          - problem: "In the diagonal enumeration of a countable union, put the element a(i,j) in row i >= 1 and column j >= 1. List elements by increasing i+j, and within one diagonal by increasing i. Skip no elements. Give the column index of the element in position 7."
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Positions with i+j=2 give (1,1) at position 1. Positions with i+j=3 give (1,2) at position 2 and (2,1) at position 3. Positions with i+j=4 give (1,3) at 4, (2,2) at 5, (3,1) at 6. The next position, 7, is (1,4), so its column index is 4."
          - problem: "For the diagonal enumeration of N x N, use the pairing f(i,j) = (i+j)(i+j+1)/2 + i, where N includes 0. Find f(3,2)."
            answer: "18"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Substitute i=3 and j=2 into the pairing. The sum i+j is 5. The triangular part is 5*6/2 = 15. Add i: 15 + 3 = 18. The value is 18."
          - problem: "For the diagonal pairing f(i,j) = (i+j)(i+j+1)/2 + i on N x N, find f(2,4)."
            answer: "23"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Substitute i=2 and j=4. The sum i+j is 6. The triangular part is 6*7/2 = 21. Add i: 21 + 2 = 23. The value is 23."
          - problem: "Claim: the set of pairs (i, j) of positive integers is countable. Step 1: for each n >= 2, the set D_n of pairs with i + j = n has exactly n - 1 pairs, so D_n is finite. Step 2: a union of finite sets is finite, so the union of all the sets D_n is finite. Step 3: the union of all the sets D_n is the set of all pairs (i, j) of positive integers. Step 4: therefore the set of pairs is finite. Which step is the first step that is not valid?"
            answer: "Step 2"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "Step 1 is correct: each diagonal is finite with a computed size. Step 2 is the first invalid step: a finite union of finite sets is finite, but an infinite union of finite sets need not be finite, and here the union is infinite. Step 3 is correct, since every pair lies on exactly one diagonal. Step 4 is false only because it inherits the error of Step 2. The answer is Step 2."
          - problem: "To prove Q is countable, enumerate N x N by diagonals and send pairs (p,q) with q >= 1 to p/q, skipping pairs with q = 0. Let f be the resulting map from N to Q. Select the line that completes the proof."
            answer: "$f$ is a surjection from N onto Q, so Q is countable."
            answer_contract: {"kind": "label", "options": [["$f$ is a surjection from N onto Q, so Q is countable."], ["$f$ is an injection from N onto Q, so Q is countable."], ["$f$ is a bijection from Q onto N, so Q is countable."], ["$f$ is a surjection from Q onto N, so Q is countable."]]}
            solution_sketch: "Wrong option: $f$ is an injection from N onto Q, so Q is countable; its error is that f is not injective, since (1,2) and (2,4) both give 1/2. Wrong option: $f$ is a bijection from Q onto N, so Q is countable; its error is the reversed domain and codomain, since f maps N to Q. Wrong option: $f$ is a surjection from Q onto N, so Q is countable; its error is again the wrong domain and codomain. The correct option is $f$ is a surjection from N onto Q, so Q is countable. The answer is $f$ is a surjection from N onto Q, so Q is countable."
          - problem: "Write the full proof: the set of positive rational numbers is countable. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1: write each positive rational as a fraction p/q with positive integers p and q. Step 2: place p/q in row p and column q of an infinite grid. Step 3: traverse the grid along diagonals where p+q is constant, and within each diagonal by increasing p; skip a fraction if it is not in lowest terms or if it has already appeared. Step 4: every positive rational has a reduced form p/q, so it lies in the grid and is reached at some finite diagonal. Step 5: the traversal gives a surjection from N onto the positive rationals; an infinite set with a surjection from N is countable. The proof is complete."
        constraints: "use a grid / diagonal enumeration for a product-like set"
    diagnostic_exemplar:
      problem: 'Prove $\mathbb{N} \times \mathbb{N}$ is countable.'
      answer: 'The map $(m, n) \mapsto 2^{m} 3^{n}$ is injective into $\mathbb{N}$.'
      solution_sketch: 'The map $(m, n) \mapsto 2^{m} 3^{n}$ is injective by unique factorization, so $\mathbb{N} \times \mathbb{N}$ injects into $\mathbb{N}$; being infinite, it is countable. $\square$'
