            answer_contract: {"kind": "exact"}
            solution_sketch: "Full condition: $\\varphi(a + b) = \\varphi(a) \\cdot \\varphi(b)$ for all $a, b$, with addition in the domain and multiplication in the codomain. Rule: split $6 = 2 + 2 + 2$ and apply the condition at each step, so $\\varphi(6) = \\varphi(2) \\cdot \\varphi(2) \\cdot \\varphi(2) = 9 \\cdot 9 \\cdot 9$. Compute the product: $9 \\cdot 9 \\cdot 9 = 729$. The answer is 729."
          - problem: "The map $\\varphi(x) = 2^x + 1$ goes from the additive group $(\\mathbb{R}, +)$ to the multiplicative group $(\\mathbb{R}^{>0}, \\cdot)$. Derive the homomorphism condition from the two named operations for arbitrary inputs, and justify whether it holds for every pair. Take $a = 1$ and $b = 2$. Return verdict = holds or fails, left = the image of the domain combination of these inputs, and right = the codomain combination of their separate images."
