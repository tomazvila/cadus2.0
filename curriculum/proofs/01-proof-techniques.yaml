            solution_sketch: 'We prove by induction on $n$ the statement $P(n)$: $2 + 5 + 8 + \cdots + (3n-1) = \frac{n(3n+1)}{2}$. Base case: for $n = 1$ the left side is $3 \cdot 1 - 1 = 2$ and the right side is $\frac{1 \cdot 4}{2} = 2$, so $P(1)$ holds. Inductive hypothesis: let $k \ge 1$ be an integer and assume $2 + 5 + \cdots + (3k-1) = \frac{k(3k+1)}{2}$. Inductive step: we must prove $P(k+1)$. The next term is $3(k+1) - 1 = 3k + 2$. Add it to both sides of the hypothesis. The right side becomes $\frac{k(3k+1)}{2} + (3k+2) = \frac{3k^2 + k + 6k + 4}{2} = \frac{3k^2 + 7k + 4}{2} = \frac{(k+1)(3k+4)}{2}$. Since $3(k+1) + 1 = 3k + 4$, this equals $\frac{(k+1)(3(k+1)+1)}{2}$, which is the right side of $P(k+1)$. So $P(k)$ implies $P(k+1)$ for every $k \ge 1$. By the principle of mathematical induction, $P(n)$ holds for every integer $n \ge 1$. $\square$'
