            solution_sketch: "Proof A: Existence is proved by substitution. The uniqueness argument then compares two arbitrary solutions and uses a nonzero coefficient to force their equality. The first unjustified step is 0; 0 means that all steps are justified. Proof B: The two-solutions method must force arbitrary solutions to be equal. Here u=4 and v=-4 are distinct solutions, so equality of squares cannot justify Step 3. The first unjustified step is 3; 0 means that all steps are justified. Proof C: The two-solutions method must force arbitrary solutions to be equal. Here u=6 and v=-6 are distinct solutions, so equality of squares cannot justify Step 3. The first unjustified step is 3; 0 means that all steps are justified. The ordered diagnoses are 0, 3, 3."
          - problem: "Audit these proposed arguments independently. Argument A: To prove that x^2=4 has exactly one real solution: Step 1: x=2 is a solution. Step 2: if u and v are solutions, then u^2=v^2. Step 3: therefore u=v. Step 4: the exhibited solution is unique. Argument B: To prove that 5x+1=26 has exactly one real solution: Step 1: x=5 is a solution. Step 2: if u and v are solutions, subtract their equations to get 5(u-v)=0. Step 3: since 5 is nonzero, u=v. Step 4: the exhibited solution is unique. Argument C: To prove that 7x+1=50 has exactly one real solution: Step 1: x=7 is a solution. Step 2: if u and v are solutions, subtract their equations to get 7(u-v)=0. Step 3: since 7 is nonzero, u=v. Step 4: the exhibited solution is unique. For each argument, check whether its numbered assertions follow from the stated data and previous justified assertions, supplying any needed algebra or logical deductions. Give an ordered list of the first assertion that does not follow in each argument; use 0 if all its assertions follow."
            answer: "3, 0, 0"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "Proof A: The two-solutions method must force arbitrary solutions to be equal. Here u=2 and v=-2 are distinct solutions, so equality of squares cannot justify Step 3. The first unjustified step is 3; 0 means that all steps are justified. Proof B: Existence is proved by substitution. The uniqueness argument then compares two arbitrary solutions and uses a nonzero coefficient to force their equality. The first unjustified step is 0; 0 means that all steps are justified. Proof C: Existence is proved by substitution. The uniqueness argument then compares two arbitrary solutions and uses a nonzero coefficient to force their equality. The first unjustified step is 0; 0 means that all steps are justified. The ordered diagnoses are 3, 0, 0."
          - problem: "Write the full proof: let m be a nonzero real number and let b,c be real numbers. If u and v both satisfy mx+b=c, prove that u=v. Explain why the equation has at most one solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Let u and v be any two real solutions of the given equation. Their defining equations are mu+b=c and mv+b=c. Subtracting the second equation from the first gives m(u-v)=0. The hypothesis m is nonzero permits division by m, so u-v=0 and u=v. Because the two solutions were arbitrary, every two solutions coincide. Therefore the equation has at most one solution; this proves uniqueness whenever a solution exists."
        constraints: "Distinguish exhibiting one solution from forcing two arbitrary solutions to be equal. Audit the first unjustified inference in the existence-and-uniqueness proof. The same mathematical method is practiced by constructing a full proof or by auditing a proposed proof; the unmarked item asks for the full proof. Candidate arguments contain claims for the learner to test; the stem must not endorse those claims or explain the decisive method."
      - id: kp2
        name: "Uniqueness in the division algorithm"
        key_prerequisites: [existence-proofs]
        exemplars:
          - problem: "In the uniqueness proof for the division algorithm, the two remainders satisfy 0 <= r, r' < b. Give the largest possible value of |r - r'| as an expression in b."
            answer: "b-1"
            answer_contract: {"kind": "function", "vars": ["b"]}
            solution_sketch: "Step 1: The two remainders satisfy 0 <= r < b and 0 <= r' < b, so the distance between them is at most the larger bound minus the smaller. Step 2: The largest possible difference occurs at r = b-1 and r' = 0, or at r = 0 and r' = b-1. Step 3: The bound is b-1. The answer is b-1."
          - problem: "In a uniqueness proof, two representations a = bq + r and a = bq' + r' give r - r' = b(q' - q). Let the remainders be x and y and the divisor be b. Give q' - q as an expression in x, y, and b."
            answer: "(x-y)/b"
            answer_contract: {"kind": "function", "vars": ["x", "y", "b"]}
            solution_sketch: "Step 1: Subtract the two representations a = bq + r and a = bq' + r' to get r - r' = bq' - bq. Step 2: Factor b on the right side to get r - r' = b(q' - q). Step 3: Divide by b to isolate q' - q = (r - r')/b, which is (x - y)/b with x = r and y = r'. The answer is (x-y)/b."
          - problem: "For b = 6, r = 5 and r' = 1, the uniqueness proof forms r - r' = b(q' - q). Compute r - r'."
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: The uniqueness proof starts from r - r' = b(q' - q). Step 2: Substitute b = 6, r = 5 and r' = 1 to get r - r' = 5 - 1 = 4. Step 3: The value 4 is not a multiple of 6, so no integer q' - q satisfies the equation, a contradiction. The answer is 4."
          - problem: "If b = 9 and q' - q = 1, give the value of r - r' from r - r' = b(q' - q)."
            answer: "9"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: The equation r - r' = b(q' - q) follows from subtracting the two representations. Step 2: Substitute b = 9 and q' - q = 1. Step 3: Multiply to get r - r' = 9(1) = 9. Since 0 <= r, r' < 9, this difference is too large, a contradiction. The answer is 9."
          - problem: "Claim: if a = bq + u = bp + v with 0 <= u, v < b, then p = q and u = v. Step 1: Suppose a = bq + u = bp + v with 0 <= u, v < b. Step 2: Subtract the two representations to get u - v = b(q - p). Step 3: Since 0 <= u, v < b, the absolute value of u - v is less than b. Step 4: The only multiple of b with absolute value less than b is 0, so u = v, and then p = q. Which step is the first step that is not valid?"
            answer: "Step 2"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "Step 1 is the correct setup with both representations and the bounds 0 <= u, v < b. Step 2 is invalid: subtracting a = bp + v from a = bq + u gives u - v = b(p - q), not b(q - p), because the sign is reversed. Step 3 correctly bounds the difference by b. Step 4 correctly uses the fact that the only multiple of b with absolute value less than b is 0. The answer is Step 2."
          - problem: "In the uniqueness proof, after r - r' = b(q' - q), the next line uses the bound 0 <= r, r' < b. Select the line that correctly completes the argument."
            answer: "|r - r'| < b, so r - r' = 0"
            answer_contract: {"kind": "label", "options": [["|r - r'| < b, so r - r' = 0"], ["|r - r'| > b, so r - r' = 0"], ["|r - r'| < b, so r - r' = b"], ["|r - r'| = b, so r - r' = 0"]]}
            solution_sketch: "The correct line must use the bound |r - r'| < b and the fact that r - r' is a multiple of b. The option with |r - r'| > b is wrong because the bound is strict less than b. The option with r - r' = b is wrong because a nonzero multiple of b has absolute value at least b. The option with |r - r'| = b is wrong because the remainders are strictly less than b. The answer is |r - r'| < b, so r - r' = 0."
          - problem: "Write the full proof: if a = bq + r = bq' + r' with 0 <= r, r' < b, then q = q' and r = r'. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1: Suppose a = bq + r = bq' + r' with 0 <= r, r' < b. Step 2: Subtract the two representations to get r - r' = b(q' - q). Step 3: Since 0 <= r < b and 0 <= r' < b, we have -b < r - r' < b, so |r - r'| < b. Step 4: The number r - r' is a multiple of b. The only multiple of b with absolute value less than b is 0, so r - r' = 0 and r = r'. Step 5: Then bq = bq', and since b != 0, q = q'. Therefore the quotient and remainder are unique. This completes the proof."
        constraints: "bound a difference to force it to zero, or derive a contradiction from two representations"
      - id: kp3
        name: "Existence and uniqueness together"
        key_prerequisites: [existence-proofs]
        exemplars:
          - problem: "Claim: there is exactly one real number $x$ with $x^3 = 8$. For the uniqueness part, suppose $x$ and $y$ are real numbers with $x^3 = 8$ and $y^3 = 8$, so $x^3 - y^3 = 0$. Write $x^3 - y^3 = (x - y)\\,q(x, y)$ with a polynomial $q$, and give $q(x, y)$."
            answer: "x^2+xy+y^2"
            answer_contract: {"kind": "function", "vars": ["x", "y"]}
            solution_sketch: "Full object: the two-candidate hypothesis of the uniqueness part, $x^3 = 8$ and $y^3 = 8$, giving $x^3 - y^3 = 0$. Rule: the difference of cubes factorization, which is the step where the uniqueness half of the existence-and-uniqueness method acts. Expanding, $(x - y)(x^2 + xy + y^2) = x^3 - y^3$, so the factor is $q(x, y) = x^2 + xy + y^2$. The answer is x^2+xy+y^2."
          - problem: "Claim: there is exactly one real number $x$ such that $x + a = a$ for every real number $a$. In the uniqueness part, suppose $x$ and $y$ are two real numbers each having this property. Substituting $a = y$ into the property of $x$ gives one equation in $x$ and $y$. Solve that equation for $x$ and give the value of $x$."
            answer: "0"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Full object: the property 'for every real $a$, $x + a = a$', held by both candidates $x$ and $y$ in the uniqueness part. Rule: the uniqueness half of the existence-and-uniqueness method substitutes each candidate's value into the other candidate's property. Substituting $a = y$ into $x + a = a$ gives $x + y = y$, and subtracting $y$ from both sides gives $x = 0$. The answer is 0."
          - problem: "A student claims that for every real number $c$, the equation $x^2 = c$ has exactly one real solution. The existence part holds for $c > 0$, but the uniqueness part fails for some $c$. Give the smallest positive integer $c$ for which the claim fails."
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Full object: the claim that $x^2 = c$ has exactly one real solution for every real $c$. Rule: split the claim into existence and uniqueness and test each part; this checks the uniqueness half of the existence-and-uniqueness method. For $c = 1$ the equation has the two distinct solutions $x = 1$ and $x = -1$, so uniqueness fails, and no smaller positive integer exists. The answer is 1."
          - problem: "Claim: there is exactly one real number $x$ with $4x + 8 = 0$. A student argues: Step 1: $x = -2$ satisfies the equation, so a solution exists. Step 2: suppose $4x + 8 = 0$ and $4y + 8 = 0$. Step 3: subtracting gives $4(x - y) = 8$, so $x - y = 2$ and the solution is not unique. Give a verdict on the student's uniqueness argument, and give the true value of $x - y$ under the two assumptions of Step 2."
            answer: "verdict = invalid; gap = 0"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["valid"], ["invalid"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "gap"}]}
            solution_sketch: "Full object: the student's three-step uniqueness argument for $4x + 8 = 0$. Rule: the uniqueness half of the existence-and-uniqueness method subtracts the two candidate equations. Subtracting $4y + 8 = 0$ from $4x + 8 = 0$ gives $4x - 4y = 0$, that is $4(x - y) = 0$, so the student's Step 3 is wrong and the verdict is invalid; the gap is $0$. The wrong option valid comes from accepting the flawed subtraction in Step 3. The answer is verdict = invalid; gap = 0."
          - problem: "Claim: there is exactly one real number $x$ with $2x + 6 = 0$. A student writes: Step 1: $x = -3$ satisfies $2(-3) + 6 = 0$, so a solution exists. Step 2: suppose $x$ and $y$ both satisfy $2x + 6 = 0$. Step 3: subtracting gives $2(x - y) = 0$. Step 4: since a product is zero only when both factors are zero, $x = 0$ and $y = 0$. Which step is the first step that is not valid?"
            answer: "Step 4"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "Full object: the student's four-step uniqueness argument for $2x + 6 = 0$. Step 1 is a valid existence check, Step 2 is the correct two-candidate hypothesis of the uniqueness half of the existence-and-uniqueness method, and Step 3 is a correct subtraction. Step 4 is the first invalid step: the zero product property says a product is zero when at least one factor is zero, and $2 \\ne 0$, so $2(x - y) = 0$ forces $x - y = 0$, not $x = 0$ and $y = 0$. Step 3 is not the answer because its subtraction is correct. The answer is Step 4."
          - problem: "Claim: there is exactly one real number $x$ with $3x - 9 = 0$. In the uniqueness part, suppose $3x - 9 = 0$ and $3y - 9 = 0$. One more line is needed before the conclusion $x = y$. Select the line that is true and that lets the proof conclude $x = y$."
            answer: "3(x - y) = 0"
            answer_contract: {"kind": "label", "options": [["3(x - y) = 0"], ["3(x - y) = 9"], ["x - y = 9"], ["3(x + y) = 0"]]}
            solution_sketch: "Full object: the two-candidate hypothesis $3x - 9 = 0$ and $3y - 9 = 0$ of the uniqueness half of the existence-and-uniqueness method. Rule: subtract the second equation from the first to get $3x - 3y = 0$, that is $3(x - y) = 0$, then divide by $3$ to conclude $x = y$. The option $3(x - y) = 9$ is the error of forgetting that the constants $-9$ cancel. The option $x - y = 9$ drops the factor $3$ and keeps the constant. The option $3(x + y) = 0$ is the error of adding the equations instead of subtracting. The answer is 3(x - y) = 0."
          - problem: "Write the full proof: for every real number $b$, there is exactly one real number $x$ with $5x + b = 0$. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1 (existence): let $x = -b/5$. Then $5x + b = 5(-b/5) + b = -b + b = 0$, so a solution exists for this $b$; this discharges the existence half of the existence-and-uniqueness claim. Step 2 (uniqueness setup): suppose $x$ and $y$ are two real numbers with $5x + b = 0$ and $5y + b = 0$; this two-candidate hypothesis is the uniqueness half of the method. Step 3 (subtract): subtracting the second equation from the first gives $5x - 5y = 0$, that is $5(x - y) = 0$. Step 4 (conclude): since $5 \\ne 0$, dividing gives $x - y = 0$, hence $x = y$. Therefore the solution is unique, and together with Step 1 there is exactly one real solution, $x = -b/5$, for every real number $b$."
        constraints: "state the $\\exists!$ claim as existence plus uniqueness and prove both parts"
    diagnostic_exemplar:
      problem: 'Prove that there is exactly one real number $x$ with $x^3 + x = 10$.'
      answer: 'Existence: $x = 2$ gives $8 + 2 = 10$. Uniqueness: suppose $a^3 + a = b^3 + b$. Then $(a^3 - b^3) + (a - b) = 0$, i.e. $(a-b)(a^2 + ab + b^2 + 1) = 0$. The second factor is positive for all real $a, b$, since $a^2 + ab + b^2 = \left(a + \tfrac{b}{2}\right)^2 + \tfrac{3b^2}{4} \ge 0$, making the factor at least $1$. Hence $a - b = 0$, so $a = b$. Therefore $x = 2$ is the unique solution.'
      solution_sketch: 'Exhibit a solution, then show any two solutions coincide: factor $a^3 + a - (b^3 + b)$ and check that the quadratic factor never vanishes.'
    anki_seeds:
      - front: 'Standard template for proving uniqueness?'
        back: 'Assume $x$ and $y$ both satisfy the property, then show $x = y$.'
        type: basic
      - front: 'What does $\exists!\, x\, P(x)$ require you to prove?'
        back: 'Existence (some $x$ satisfies $P$) and uniqueness (any two satisfying $P$ are equal).'
        type: basic

  - id: common-proof-errors
    name: "Common Proof Errors"
    core: false                # supplemental: proof-hygiene commentary leaf topic
    difficulty: 0.60
    drill: false
    answer_kind: numeric
    expected_time_secs: 150
    prerequisites:
      - id: rules-of-inference
        weight: 0.5
        key: true
      - id: direct-proof
        weight: 0.4
        key: true
    knowledge_points:
      - id: kp1
        name: "Proof by example"
        key_prerequisites: [direct-proof]
        exemplars:
          - problem: "Consider the claim that n^2 - n + 11 is prime for every positive integer n. The values n = 1, 2, 3, 4, 5 all give primes. Find the smallest positive integer n for which the claim fails."
            answer: "11"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The claim is that f(n) = n^2 - n + 11 is prime for every positive integer n. Step 1: test successive values using the definition of prime; f(6) = 41, f(7) = 53, f(8) = 67, f(9) = 83, f(10) = 101 are all prime. Step 2: test n = 11; f(11) = 121, and 121 = 11*11 is composite. The smallest positive integer that makes the claim fail is 11."
          - problem: "A proof that the sum of two even integers is even must use arbitrary even integers. If the two even integers are 2a and 2b, give their sum as an expanded expression in a and b."
            answer: "2a+2b"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The claim is that the sum of two even integers is even. Step 1: write arbitrary even integers as 2a and 2b, using the definition of even. Step 2: add them; 2a + 2b = 2(a+b), which is twice an integer, so it is even. The expanded sum is 2a+2b."
          - problem: "A student claims n^2 + n + 17 is prime for every positive integer n. The claim holds for n = 1 through 15. Find the smallest positive integer n for which the claim fails."
            answer: "16"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The claim is that g(n) = n^2 + n + 17 is prime for every positive integer n. Step 1: check the given range; the values from n = 1 to n = 15 are prime. Step 2: evaluate n = 16; g(16) = 256 + 16 + 17 = 289, and 289 = 17*17. The claim fails first at n = 16."
          - problem: "A student claims every prime number is odd. Which number is a counterexample?"
            answer: "2"
            answer_contract: {"kind": "label", "options": [["2"], ["3"], ["5"], ["7"]]}
            solution_sketch: "A counterexample to the claim that every prime number is odd must be a prime that is not odd. Step 1: check the options; 2 is prime and is even, so it is a counterexample. Step 2: the numbers 3, 5 and 7 are odd primes, so they do not show the claim false. The correct counterexample is 2."
          - problem: "A student argues that every odd number greater than 1 is prime, checking 3, 5 and 7. Find the smallest odd number greater than 1 that shows the argument is incomplete."
            answer: "9"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The claim is that every odd number greater than 1 is prime. Step 1: test the checked values 3, 5 and 7; they are prime. Step 2: test the next odd number 9; 9 = 3*3, so it is composite. The smallest odd number greater than 1 that shows the argument is incomplete is 9."
          - problem: "To prove that the product of two odd integers is odd, a student checks 3*5 = 15. The proof must use arbitrary odd integers 2a+1 and 2b+1. Give the product as an expanded expression in a and b."
            answer: "4ab+2a+2b+1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The claim is that the product of two odd integers is odd. Step 1: write arbitrary odd integers as 2a+1 and 2b+1. Step 2: multiply them; (2a+1)(2b+1) = 4ab+2a+2b+1 = 2(2ab+a+b)+1, which is odd. The expanded product is 4ab+2a+2b+1."
        constraints: "the flawed argument verifies instances; the fix is an arbitrary-element proof or a counterexample"
      - id: kp2
        name: "Circular reasoning and converse errors"
        key_prerequisites: [rules-of-inference]
        exemplars:
          - problem: "A flawed proof of the claim that if n squared is divisible by three then n is divisible by three has five steps. Step one supposes n squared is divisible by three. Step two writes n squared equals three m. Step three cites the implication 'if n is divisible by three then n squared is divisible by three' and calls the case consistent. Step four concludes that n is divisible by three. Step five states the claim. Give the number of the first step that argues from the conclusion of the claim rather than from its hypothesis."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Full object: the proof has step one supposing the hypothesis, step two writing n squared equals three m, step three citing the implication from n to n squared, step four concluding n is divisible by three. Rule for step one: check that it starts from the hypothesis, which it does. Rule for step two: check that it is valid algebra, which it is. Rule for step three: compare its direction with the claim; it runs from the conclusion back to the hypothesis, which is the converse error of arguing from the conclusion. The first step that argues from the conclusion of the claim is step three. The answer is 3."
          - problem: "A flawed proof of the claim that the arithmetic mean of two nonnegative numbers a and b is at least their geometric mean has four steps. In the first step it assumes the claim. In the second step it squares both sides. In the third step it rearranges to a perfect square inequality. In the fourth step it concludes the claim. Give the number of the first step that assumes what is to be proved."
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Full object: first step assumes the claim; second step squares both sides; third step rearranges to a perfect square; fourth step concludes. Rule for the first step: identify the assumption. Rule for the second step: check reversibility. The first step that assumes what is to be proved is the first step. The answer is 1."
          - problem: "A proof of the claim 'if n is prime then n is odd' says that every odd integer greater than two is prime. Find the smallest odd composite that shows this step is invalid."
            answer: "9"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Full object: the step claims every odd n greater than two is prime. Rule for testing the step: find an odd n that is not prime. Test three, five, seven, then nine equals three times three, composite. The smallest odd composite is nine. The answer is 9."
          - problem: "A flawed proof of 'if n is even then n squared is even' has four steps. In the first step it writes n = two k. In the second step it expands n squared to four k squared. In the third step it says 'since n squared is even, four k squared is even'. In the fourth step it concludes n squared is even. Give the number of the first step that assumes the conclusion."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Full object: first step sets n = two k; second step expands; third step uses the conclusion n squared is even; fourth step repeats the conclusion. Rule for the first step: set up the hypothesis. Rule for the second step: compute. Rule for the third step: check for circular reasoning. The first step that assumes the conclusion is the third step. The answer is 3."
          - problem: "A proof of 'if x squared equals four then x equals two' squares both sides and keeps only the positive root. Find the other real value of x that satisfies x squared equals four but not x equals two."
            answer: "-2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Full object: the equation x squared equals four has two real solutions. Rule for solving x squared equals four: take square roots, so x equals two or x equals negative two. Rule for the flaw: the step from x squared equals four to x equals two is not reversible. The other real value is negative two. The answer is -2."
          - problem: "A proof of 'if n is a multiple of nine then n is a multiple of six' uses the converse 'if n is a multiple of six then n is a multiple of nine'. Find the smallest positive multiple of six greater than six that is not a multiple of nine."
            answer: "12"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Full object: the converse claims every multiple of six is a multiple of nine. Rule for testing the converse: list positive multiples of six. Six is not a multiple of nine, twelve is not a multiple of nine, but the smallest greater than six is twelve. The answer is 12."
        constraints: "flag arguing-from-the-conclusion; require reversibility or a rewritten forward proof"
      - id: kp3
        name: "Illegal algebraic steps"
        key_prerequisites: [direct-proof]
        exemplars:
          - problem: "Consider this argument with c = 7 and d = 7. Step 1: c = d. Step 2: multiply both sides by c to get c^2 = cd. Step 3: subtract d^2 from both sides to get c^2 - d^2 = cd - d^2. Step 4: factor both sides. Step 5: cancel the common factor to get c + d = d. Step 6: conclude 14 = 7. Exactly one step performs an illegal algebraic move. Find the common factor that this step cancels, as a formula in c and d."
            answer: "c - d"
            answer_contract: {"kind": "function", "vars": ["c", "d"]}
            solution_sketch: "The full argument is: c = d, then multiply both sides by c to get c^2 = cd, then subtract d^2 from both sides to get c^2 - d^2 = cd - d^2, then factor both sides, then cancel the common factor to get c + d = d, then conclude 14 = 7. Check each step: multiplying and subtracting the same quantity on both sides is legal by the laws of equality, and after step 4 the difference-of-squares rule and the distributive law give (c + d)(c - d) = d(c - d). The illegal step is the cancellation, which divides by the common factor c - d; because c = d = 7, that factor equals 0, and the zero-divisor rule forbids dividing by 0. The common factor cancelled by the illegal step is c - d."
          - problem: "Consider this argument with z = -6. Step 1: z^2 = 6^2. Step 2: take the square root of both sides to get sqrt(z^2) = sqrt(6^2). Step 3: replace the left side by z to get z = 6, that is, -6 = 6. Step 3 performs the illegal root extraction, because the square root of z^2 is not always z. Find the expression that step 3 must write on the left side in place of z, as a formula in z."
            answer: "abs(z)"
            answer_contract: {"kind": "function", "vars": ["z"]}
            solution_sketch: "The full argument is: z^2 = 6^2, then take the square root of both sides to get sqrt(z^2) = sqrt(6^2), then replace the left side by z to get z = 6, that is, -6 = 6. Step 2 is legal by the definition of the square root, since z = -6 gives sqrt(z^2) = sqrt(36) = 6 and sqrt(6^2) = 6. Step 3 is the illegal root extraction: the identity sqrt(z^2) = z holds only for nonnegative z, and here z = -6. The identity that holds for every real z is sqrt(z^2) = abs(z), the absolute-value form. The expression that step 3 must write in place of z is abs(z)."
          - problem: "Consider this argument that solves (x - 8)(x + 3) = 0. Step 1: state the equation (x - 8)(x + 3) = 0. Step 2: divide both sides by the factor x - 8 to get x + 3 = 0. Step 3: conclude that x = -3 is the only solution. Exactly one step performs an illegal algebraic move, because it divides by a quantity that equals zero for one solution. Find the solution of the equation that this step loses."
            answer: "8"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full argument is: state (x - 8)(x + 3) = 0, divide both sides by the factor x - 8 to get x + 3 = 0, and conclude that x = -3 is the only solution. The zero-product rule says a product is 0 exactly when at least one factor is 0, so the equation has the two solutions x = 8 and x = -3. The illegal step is the division by x - 8: when x = 8 that divisor is 0, so the step is a hidden division by zero and it loses the solution x = 8. The solution lost by the illegal step is 8."
          - problem: "Consider this argument that solves (t - 2)^2 = 9. Step 1: state the equation (t - 2)^2 = 9. Step 2: take the square root of both sides and keep only the positive branch, t - 2 = 3. Step 3: conclude that t = 5 is the only solution. Step 2 performs the illegal root extraction by keeping only one branch. Find the other solution of the equation that step 2 drops."
            answer: "-1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full argument is: state (t - 2)^2 = 9, take the square root of both sides and keep only the positive branch t - 2 = 3, and conclude that t = 5 is the only solution. The square-root rule for equations gives two branches, t - 2 = sqrt(9) = 3 and t - 2 = -sqrt(9) = -3, so the solutions are t = 5 and t = -1. Step 2 keeps only the positive branch, which is the illegal root extraction, and the other solution is dropped. The solution dropped by the illegal step is -1."
          - problem: "Consider this argument that solves the inequality x^2 < 49. Step 1: state the inequality x^2 < 49. Step 2: take the square root of both sides and write x < 7. Step 3: conclude that every x < 7 solves the inequality. Step 2 performs the illegal root extraction by dropping the negative branch. Find the correct solution of the inequality, and give it as an inequality in x."
            answer: "-7 < x < 7"
            answer_contract: {"kind": "inequality_union"}
            solution_sketch: "The full argument is: state the inequality x^2 < 49, take the square root of both sides and write x < 7, and conclude that every x < 7 solves it. The square-root rule for inequalities gives abs(x) < 7, because the square root of x^2 is the absolute value of x, and abs(x) < 7 splits into the two branches x < 7 and x > -7. Step 2 keeps only one branch, which is the illegal root extraction, so its conclusion is incomplete. The correct solution of the inequality is -7 < x < 7."
          - problem: "Consider this argument that solves (y - 2)(y + 5) = 9(y - 2). Step 1: state the equation (y - 2)(y + 5) = 9(y - 2). Step 2: divide both sides by y - 2 to get y + 5 = 9. Step 3: conclude that y = 4 is the only solution. Step 2 performs the illegal move of dividing by a factor that can equal zero. Find the value of y for which this division is a division by zero."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full argument is: state (y - 2)(y + 5) = 9(y - 2), divide both sides by y - 2 to get y + 5 = 9, and conclude that y = 4 is the only solution. The division rule permits dividing by y - 2 only when y - 2 is not 0. Set the divisor to zero: y - 2 = 0 gives y = 2, and at y = 2 the original equation also holds, since both sides equal 0. The value of y for which the illegal step divides by zero is 2."
        constraints: "hidden division by zero or invalid root extraction; the learner names the exact illegal step"
    diagnostic_exemplar:
      problem: 'Identify the error in each argument: (a) "The sum of two even integers is even — indeed $4 + 6 = 10$." (b) "If $a = b$ then $a^2 = ab$, so $a^2 - b^2 = ab - b^2$, so $(a+b)(a-b) = b(a-b)$, hence $a + b = b$; taking $a = b = 1$ gives $2 = 1$."'
      answer_contract: {kind: none}
      answer: '(a) Proof by example: one instance cannot establish a universal claim. A proof must start from arbitrary even integers $2a$ and $2b$ and show $2a + 2b = 2(a+b)$. (b) An illegal cancellation: passing from $(a+b)(a-b) = b(a-b)$ to $a + b = b$ divides by $a - b$, which is $0$ because $a = b$. Division by zero is not a valid step, so the conclusion does not follow.'
      solution_sketch: 'Ask what each step actually licenses: one instance never proves "for all", and cancelling a factor requires it to be nonzero.'
    anki_seeds:
      - front: 'Why does deriving a true statement from a claim not prove the claim?'
        back: 'A false statement can imply a true one ($F \to T$ is true); the steps must be reversible or run forward from known truths.'
        type: basic
      - front: 'The "converse error" in a proof?'
        back: 'Proving $Q \to P$ (or assuming $Q$) when the goal is $P \to Q$.'
        type: basic
      - front: 'Classic hidden error in the "$2 = 1$" algebra fallacy?'
        back: 'Dividing by $a - b$, which is zero when $a = b$.'
        type: basic

  - id: induction-template
    name: "The Induction Template"
    core: true
    difficulty: 0.55
    drill: false
    answer_kind: proof
    expected_time_secs: 200
    prerequisites:
      - id: direct-proof
        weight: 0.5
        key: true
      - id: quantifiers
        weight: 0.2
      - id: factorial-notation
        weight: 0.2
        key: false
    knowledge_points:
      - id: kp1
        name: "The principle and its two parts"
        key_prerequisites: [quantifiers]
        exemplars:
          - problem: "An induction proof of the claim that for all $n \\ge 2$, $5 + 10 + \\cdots + 5n = \\tfrac{5n(n+1)}{2}$ checks the base case at the smallest allowed $n$. Give the common value of the two sides at the base case."
            answer: "15"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Base case identification: the claim ranges over $n \\ge 2$, so the base case is $n = 2$. Left side evaluation: the terms up to index 2 are $5 + 10 = 15$. Right side check: $\\tfrac{5 \\cdot 2 \\cdot 3}{2} = 15$, so the two sides agree at the base case. The value at the base case is 15."
          - problem: "For the induction setup of the claim that for all $n \\ge 1$, $2 + 7 + \\cdots + (5n-3) = \\tfrac{n(5n-1)}{2}$: the hypothesis assumes the formula at $k$, and the goal states it at $k + 1$. Give the right side of the goal as an expression in $k$."
            answer: "(k+1)(5k+4)/2"
            answer_contract: {"kind": "function", "vars": ["k"]}
            solution_sketch: "Inductive hypothesis: the formula at $k$ is $\\tfrac{k(5k-1)}{2}$. Goal formation: replace $k$ by $k + 1$ everywhere in the right side, giving $\\tfrac{(k+1)(5(k+1)-1)}{2}$. Simplify the second factor: $5(k+1) - 1 = 5k + 4$. The right side of the goal is (k+1)(5k+4)/2."
          - problem: "An induction proof of the claim that for all $n \\ge 5$, $2^n > n^2$ checks the base case at the smallest allowed $n$. Compute the value of $2^n - n^2$ at the base case."
            answer: "7"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Base case identification: the smallest allowed value is $n = 5$. Power evaluation: $2^5 = 32$ and $5^2 = 25$. Difference: $32 - 25 = 7$, and since the gap is positive the inequality holds strictly at the base case. The value of $2^n - n^2$ at the base case is 7."
          - problem: "A student claims that $n^2 - n + 17$ is prime for every $n \\ge 1$ and checks the values from $n = 1$ to $n = 4$. Find the smallest $n$ for which the claim is false."
            answer: "17"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Direct testing: $n^2 - n + 17$ takes the values 17, 19, 23, 29 at $n = 1$ to $4$, all prime, and the pattern of primes continues through $n = 16$, where the value is 257. Counterexample search: at $n = 17$ the value is $289 - 17 + 17 = 289$, which is $17^2$ and not prime. Early checks never establish a claim for all $n$. The smallest $n$ for which the claim is false is 17."
          - problem: "Claim: for all $n \\ge 1$, $3 + 6 + \\cdots + 3n = \\tfrac{3n(n+1)}{2}$. Step 1: the base case is $n = 1$, where both sides equal $3$. Step 2: assume $3 + 6 + \\cdots + 3k = \\tfrac{3k(k+1)}{2}$ for one $k \\ge 1$. Step 3: the goal of the step is to prove the formula at the same $k$. Step 4: add the term $3(k+1)$ to both sides and simplify to $\\tfrac{3(k+1)(k+2)}{2}$. Which step is the first step that is not valid?"
            answer: "Step 3"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "Step 1 is a correct base case, since both sides equal $3$ at $n = 1$, so Step 1 is not the failure. Step 2 is the standard inductive hypothesis, so Step 2 is valid. Step 4 is correct algebra, because adding $3(k+1)$ to $\\tfrac{3k(k+1)}{2}$ gives $\\tfrac{3(k+1)(k+2)}{2}$. Step 3 is the error: the goal of the inductive step must be the formula at $k + 1$, not at the same $k$. The first invalid step is Step 3."
          - problem: "For the induction setup of the claim that for all $n \\ge 1$, $5 + 8 + \\cdots + (3n+2) = \\tfrac{n(3n+7)}{2}$: the step adds the term with index $k+1$ to both sides of the hypothesis. Give that term as an expression in $k$."
            answer: "3k+5"
            answer_contract: {"kind": "function", "vars": ["k"]}
            solution_sketch: "Hypothesis: the sum runs up to the term $3k + 2$. Goal: the sum runs one term further, up to index $k + 1$. Term formula: the $j$-th term is $3j + 2$, so the new term is $3(k+1) + 2$. Simplify: $3(k+1) + 2 = 3k + 5$. The term is 3k+5."
          - problem: "Write the full proof: for all $n \\ge 1$, $\\tfrac{1}{1 \\cdot 2} + \\tfrac{1}{2 \\cdot 3} + \\cdots + \\tfrac{1}{n(n+1)} = \\tfrac{n}{n+1}$. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Proof by induction on $n$. Base case: at $n = 1$ the left side is $\\tfrac{1}{1 \\cdot 2} = \\tfrac{1}{2}$ and the right side is $\\tfrac{1}{1+1} = \\tfrac{1}{2}$, so the statement holds. Inductive hypothesis: assume $\\tfrac{1}{1 \\cdot 2} + \\tfrac{1}{2 \\cdot 3} + \\cdots + \\tfrac{1}{k(k+1)} = \\tfrac{k}{k+1}$ for one $k \\ge 1$. Goal of the step: show the same identity at $k + 1$. Step: add the next term $\\tfrac{1}{(k+1)(k+2)}$ to both sides of the hypothesis. The right side becomes $\\tfrac{k}{k+1} + \\tfrac{1}{(k+1)(k+2)} = \\tfrac{k(k+2) + 1}{(k+1)(k+2)} = \\tfrac{(k+1)^2}{(k+1)(k+2)} = \\tfrac{k+1}{k+2}$, which is exactly the formula at $k + 1$. Conclusion: the claim holds at $k + 1$, and by the principle of induction it holds for every $n \\ge 1$. See the solution."
        constraints: "setup only: identify base case, hypothesis, and goal of the step; no full proof required"
      - id: kp2
        name: "Choosing and checking the base case"
        key_prerequisites: [direct-proof]
        exemplars:
          - problem: "For the claim 2^n > 6n, find the smallest positive integer n for which the claim holds. Give n."
            answer: "5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Test n = 4: 2^4 = 16 and 6*4 = 24, so 16 > 24 is false. Test n = 5: 2^5 = 32 and 6*5 = 30, so 32 > 30 is true. Thus the first integer that works is 5."
          - problem: "For the claim n! >= 2^(n-1), verify the base case n = 1 by giving the common value of both sides. Give the value."
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Substitute n = 1: 1! = 1. The right side is 2^(1-1) = 2^0 = 1. The two sides are equal, so the base case holds. The common value is 1."
          - problem: "For the claim n! > 2^n, determine the smallest positive integer n at which the claim holds. Give n."
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Test n = 3: 3! = 6 and 2^3 = 8, so 6 > 8 is false. Test n = 4: 4! = 24 and 2^4 = 16, so 24 > 16 is true. For every later n the factorial keeps growing faster than the power, so the claim holds from this index onward. Thus the first integer that works is 4."
          - problem: "For the claim n! > 3^n, find the smallest positive integer n for which the claim holds. Give n."
            answer: "7"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Test n = 6: 6! = 720 and 3^6 = 729, so 720 > 729 is false. Test n = 7: 7! = 5040 and 3^7 = 2187, so 5040 > 2187 is true. Thus the first integer that works is 7."
          - problem: "In an induction proof of 1 + 3 + ... + (2n - 1) = n^2, the step from k to k + 1 adds one term. Give that added term as an expression in k."
            answer: "2k+1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The sum to k ends at the k-th odd positive integer, 2k - 1. The sum to k + 1 adds the next odd integer, 2(k + 1) - 1. Simplify: 2k + 2 - 1 = 2k + 1. The added term is 2k+1."
          - problem: "Claim: for all n >= 1, 1 + 2 + ... + n = n(n+1)/2. Step 1: for n = 1, the left side is 1 and the right side is 1. Step 2: assume 1 + 2 + ... + k = k(k+1)/2. Step 3: then 1 + 2 + ... + (k+1) = k(k+1)/2 + (k+1) = (k+1)(k+1)/2. Step 4: this is the formula for n = k+1, so the claim holds for all n. Which step is the first step that is not valid?"
            answer: "Step 3"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "Step 1 checks n = 1 correctly: 1 = 1. Step 2 states the hypothesis correctly. Step 3 is false: k(k+1)/2 + (k+1) simplifies to (k+1)(k+2)/2, not (k+1)(k+1)/2. Step 4 uses the false Step 3. The answer is Step 3."
          - problem: "Write the full proof: for all n >= 5, 2^n > n^2. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Base case: choose n = 5. Compute 2^5 = 32 and 5^2 = 25, so 32 > 25, and the base case holds. Inductive step: assume 2^k > k^2 for some k >= 5. Multiply by 2: 2^(k+1) = 2*2^k > 2k^2. For k >= 5, 2k^2 - (k+1)^2 = k^2 - 2k - 1 = (k-1)^2 - 2 > 0, so 2k^2 > (k+1)^2. Combine: 2^(k+1) > (k+1)^2. Conclusion: by induction, 2^n > n^2 for all n >= 5."
        constraints: "numeric base-case verification; find the first index where the claim holds"
      - id: kp3
        name: "A complete first induction"
        key_prerequisites: [direct-proof]
        exemplars:
          - problem: "The claim 1 + 3 + 5 + ... + (2n - 1) = n^2 is proved by induction. In the inductive step the next odd number is added to the hypothesis n^2. Give the simplified form of the result as an expression in n."
            answer: "(n+1)^2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The induction hypothesis gives that the first n odd numbers sum to n^2. The next odd number, the (n + 1)-th term of the list, is 2(n + 1) - 1 = 2n + 1. Add it to the hypothesis: n^2 + 2n + 1. Factor the trinomial by the square formula. The simplified form of the result is (n+1)^2."
          - problem: "The claim 2 + 4 + 6 + ... + 2n = n(n + 1) is proved by induction. In the inductive step the next even number is added to the hypothesis n(n + 1). Give the factored form of the result as an expression in n."
            answer: "(n+1)(n+2)"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The induction hypothesis gives that the first n even numbers sum to n(n + 1). The next even number, the (n + 1)-th term, is 2(n + 1) = 2n + 2. Add it to the hypothesis: n(n + 1) + 2n + 2 = n^2 + 3n + 2. Factor the trinomial. The factored form of the result is (n+1)(n+2)."
          - problem: "A proof by induction of the claim 4 + 7 + 10 + ... + (3n + 1) = n(3n + 5)/2 starts with the base case n = 1. Give the value of each side at n = 1."
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The base case of the induction template substitutes n = 1 into both sides. The left side is the single first term 3(1) + 1 = 4. The right side is 1(3(1) + 5)/2 = 8/2 = 4. Both sides match, so the base case holds. The value of each side is 4."
          - problem: "In the induction proof of the claim 5 + 9 + 13 + ... + (4n + 1) = n(2n + 3), the inductive step must finish with the formula at the next index. Give the formula's value at n + 1 as an expression in n."
            answer: "(n+1)(2n+5)"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The template requires the step to end at the claim's formula with n replaced by n + 1. Substitute n + 1 for n in n(2n + 3). This gives (n + 1)(2(n + 1) + 3). Simplify the second factor: 2n + 5. The target expression is (n+1)(2n+5)."
          - problem: "A student claims that 1 + 2 + 3 + ... + n = n^2 for all n >= 1 and checks only the case n = 1. Give the smallest n >= 1 for which the claim is false."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "One checked case never proves a claim about every n, so test further values. At n = 1 the claim reads 1 = 1, which holds. At n = 2 the left side is 1 + 2 = 3 while the right side is 2^2 = 4, so the claim is false. The smallest n >= 1 for which the claim is false is 2."
          - problem: "A proof by induction of the claim 7 + 11 + 15 + ... + (4n + 3) = n(2n + 5) is missing one line: after the hypothesis for k, the line that gives the sum through k + 1. Select the line that is true and that uses the hypothesis."
            answer: "k(2k+5) + 4k + 7"
            answer_contract: {"kind": "label", "options": [["k(2k+5) + 4k + 7"], ["k(2k+5) + 4k + 3"], ["k(2k+3) + 4k + 7"], ["k(2k+5) + 4(k+1)"]]}
            solution_sketch: "The induction hypothesis step of the template gives the sum through k as k(2k+5). The next term of the list is 4(k + 1) + 3 = 4k + 7, so the missing line adds it to the hypothesis: k(2k+5) + 4k + 7. The option k(2k+5) + 4k + 3 reuses the old last term 4k + 3 instead of the next term. The option k(2k+3) + 4k + 7 starts from a wrong hypothesis formula. The option k(2k+5) + 4(k+1) drops the constant 3 of the next term. The answer is k(2k+5) + 4k + 7."
          - problem: "Write the full proof: for all n >= 1, 2 + 7 + 12 + ... + (5n - 3) = n(5n - 1)/2. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Base case: for n = 1 the left side is the single term 5(1) - 3 = 2, and the right side is 1(5 - 1)/2 = 2, so the claim holds. Hypothesis: assume for some k >= 1 that 2 + 7 + 12 + ... + (5k - 3) = k(5k - 1)/2. Inductive step: the next term is 5(k + 1) - 3 = 5k + 2. Add it to the hypothesis: k(5k - 1)/2 + 5k + 2 = (5k^2 - k + 10k + 4)/2 = (5k^2 + 9k + 4)/2. Factor: (k + 1)(5k + 4)/2, which is exactly the formula at k + 1, since (k + 1)(5(k + 1) - 1)/2 = (k + 1)(5k + 4)/2. Conclusion: the statement holds for k + 1 whenever it holds for k, so by induction it holds for all n >= 1."
        constraints: "single-step sums with linear terms; write base, hypothesis, and step explicitly"
    diagnostic_exemplar:
      problem: 'Prove by induction: for all $n \ge 1$, $3 + 7 + 11 + \cdots + (4n - 1) = n(2n + 1)$.'
      answer: 'Base $n = 1$: $3 = 3$. Step: $n(2n+1) + (4n + 3) = 2n^2 + 5n + 3 = (n+1)(2n+3)$.'
      solution_sketch: 'Base: $n = 1$ gives $3 = 1 \cdot 3$. Step: assume the sum is $n(2n+1)$; adding the next term $4(n+1) - 1 = 4n + 3$ gives $2n^2 + 5n + 3 = (n + 1)(2(n+1) + 1)$. $\square$'
    anki_seeds:
      - front: 'The two parts of a proof by induction?'
        back: 'Base case (verify $P(n_0)$) and inductive step (assume $P(n)$, prove $P(n + 1)$).'
        type: basic
      - front: 'What is the inductive hypothesis?'
        back: 'The assumption that $P(n)$ holds, used to prove $P(n + 1)$.'
        type: basic

  - id: induction-summation-proofs
    name: "Summation Formulas by Induction"
    core: true
    difficulty: 0.58
    drill: false
    answer_kind: proof
    expected_time_secs: 220
    prerequisites:
      - id: induction-template
        weight: 0.6
        key: true
      - id: summation-notation
        weight: 0.3
        key: false
    knowledge_points:
      - id: kp1
        name: "Linear sums"
        key_prerequisites: [induction-template]
        exemplars:
          - problem: "To prove by induction that for all n >= 1, 1 + 2 + ... + n = n(n+1)/2, write the sum to n+1 as the sum to n plus one new term T. Give T."
            answer: "n+1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The sum to n+1 is 1 + 2 + ... + n + (n+1). Split off the last term by the definition of the summation. The part before the last term is the sum to n, so the new term is n+1."
          - problem: "To prove by induction that for all n >= 1, the sum of 3i - 2 from i = 1 to n equals n(3n - 1)/2, the inductive step adds the term with index n + 1 and computes n(3n - 1)/2 + (3n + 1). Written as one fraction with denominator 2, the numerator factors as (n + 1) times Q(n). Give Q(n)."
            answer: "3n+2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The term with index n + 1 is 3(n + 1) - 2 = 3n + 1, and the inductive step adds it to the closed form n(3n - 1)/2. Combine over the common denominator 2: the numerator is n(3n - 1) + 2(3n + 1) = 3n^2 + 5n + 2. Factor the numerator: 3n^2 + 5n + 2 = (n + 1)(3n + 2), which is exactly the formula at n + 1 divided by 2. The answer is Q(n) = 3n+2."
          - problem: "For the claim that for all n >= 1, the sum of 4i - 1 from i = 1 to n equals n(2n + 1), state the single term that the sum to n + 1 adds to the sum to n."
            answer: "4n+3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The sum to n+1 adds the term with index i = n+1. That term is 4(n+1) - 1 = 4n + 3 by substitution into the general term. Hence the sum to n+1 equals the sum to n plus 4n+3."
          - problem: "For the claim that for all n >= 1, the sum of 6i - 5 from i = 1 to n equals n(3n - 2), after adding the next term to the right side the result factors as (n+1)Q(n). Give Q(n)."
            answer: "3n+1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The next term is 6(n+1) - 5 = 6n + 1. Add it to the hypothesis: n(3n - 2) + (6n + 1) = 3n^2 - 2n + 6n + 1 = 3n^2 + 4n + 1. Factor: 3n^2 + 4n + 1 = (n + 1)(3n + 1). The quotient is 3n+1."
          - problem: "A student claims that for all n >= 1, 1 + 2 + ... + n = n(n+1)/2 + (n-1)(n-2)(n-3). The claim holds for the first few n. Give the smallest n >= 1 for which the claim is false."
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Test the claim in order. For n = 1 both sides give 1; for n = 2 both sides give 3; for n = 3 both sides give 6. At n = 4 the left side is 10 while the right side is 10 + 6 = 16, which is not equal. Checking a few cases is not a proof, and the induction breaks at this point. The claim first fails at n = 4."
          - problem: "Claim: for all n >= 1, the sum of 4i - 2 from i = 1 to n equals 2n^2. Step 1: for n = 1, the left side is 2 and the right side is 2. Step 2: assume the claim for n. Step 3: the sum to n + 1 equals 2n^2 + 4n + 4. Step 4: therefore the sum to n + 1 equals 2(n + 1)^2, which is the claim at n + 1. Which step is the first step that is not valid?"
            answer: "Step 3"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "Step 1 is valid: for n = 1 the left side is 4 - 2 = 2 and the right side is 2 times 1 squared, also 2. Step 2 is the induction hypothesis, which is a valid assumption. Step 3 is the first invalid step: the new term is 4(n + 1) - 2 = 4n + 2, so the sum to n + 1 is 2n^2 + 4n + 2, not 2n^2 + 4n + 4; the student added 4(n + 1) instead of the correct term. Step 4 states a true identity, since 2(n + 1)^2 = 2n^2 + 4n + 2 is the claim at n + 1. The first step that is not valid is Step 3."
          - problem: "Write the full proof: for all n >= 1, the sum of 7i - 4 from i = 1 to n equals n(7n - 1)/2. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Base case: for n = 1, the left side is 7*1 - 4 = 3 and the right side is 1*(7*1 - 1)/2 = 3, so the claim holds. Induction hypothesis: assume for some n >= 1 that the sum of 7i - 4 from i = 1 to n equals n(7n - 1)/2. Inductive step: add the next term 7(n+1)-4 = 7n+3. The left side becomes the sum to n+1. The right side becomes n(7n - 1)/2 + (7n+3) = (7n^2 - n + 14n + 6)/2 = (7n^2 + 13n + 6)/2 = (n+1)(7n+6)/2 = (n+1)(7(n+1)-1)/2, which is the formula at n+1. Conclusion: by induction the formula holds for all n >= 1."
        constraints: "arithmetic-progression sums; the step adds one term and refactors"
      - id: kp2
        name: "Square and cube sums"
        key_prerequisites: [induction-template]
        exemplars:
          - problem: "To prove $1^2 + 2^2 + \\cdots + n^2 = \\dfrac{n(n+1)(2n+1)}{6}$ by induction, write the sum to $n+1$ as $\\dfrac{n(n+1)(2n+1)}{6} + (n+1)^2$ and then as $\\dfrac{n+1}{6}\\,q(n)$. Give $q(n)$ expanded."
            answer: "2n^2+7n+6"
            answer_contract: {"kind": "function", "vars": ["n"]}
            solution_sketch: "Step 1 (summation notation): the sum to $n+1$ is the sum to $n$ plus the new term $(n+1)^2$, that is $\\dfrac{n(n+1)(2n+1)}{6} + (n+1)^2$. Step 2 (factoring): pull out the factor $\\dfrac{n+1}{6}$; the bracket is $\\dfrac{n(2n+1)}{6} + (n+1) = \\dfrac{2n^2 + n + 6n + 6}{6} = \\dfrac{2n^2+7n+6}{6}$. Step 3 (induction template): this is exactly the formula at $n+1$, since $\\dfrac{(n+1)(2n^2+7n+6)}{6} = \\dfrac{(n+1)(n+2)(2n+3)}{6}$. The answer is 2n^2+7n+6."
          - problem: "In the induction proof of $1^3 + 2^3 + \\cdots + n^3 = \\left(\\dfrac{n(n+1)}{2}\\right)^2$, the step must establish the formula at $n = k+1$, namely $\\left(\\dfrac{(k+1)(k+2)}{2}\\right)^2$. Written as $(k+1)^2\\,q(k)$, give $q(k)$."
            answer: "(k+2)^2/4"
            answer_contract: {"kind": "function", "vars": ["k"]}
            solution_sketch: "Step 1 (induction template): the target object is $\\left(\\dfrac{(k+1)(k+2)}{2}\\right)^2 = \\dfrac{(k+1)^2(k+2)^2}{4}$. Step 2 (factoring): take out the common factor $(k+1)^2$, leaving $\\dfrac{(k+2)^2}{4}$. Step 3 (check): $(k+1)^2 \\cdot \\dfrac{(k+2)^2}{4} = \\left(\\dfrac{(k+1)(k+2)}{2}\\right)^2$, the formula at $k+1$. The answer is (k+2)^2/4."
          - problem: "A student claims that $1^3 + 2^3 + \\cdots + n^3 = \\left(\\dfrac{n(n+1)}{2}\\right)^2 + \\dfrac{(n-1)(n-2)}{2}$ for all $n \\ge 1$, and checks only $n = 1$ and $n = 2$. Give the smallest $n \\ge 1$ for which the claim is false."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (base-case check): at $n = 1$ the right side is $1 + 0 = 1$, equal to the left side. Step 2 (base-case check): at $n = 2$ the right side is $9 + 0 = 9$, equal to the left side $1 + 8 = 9$. Step 3 (counterexample search): at $n = 3$ the right side is $36 + 1 = 37$, but the left side is $1 + 8 + 27 = 36$. Two passing checks are not a proof; the claim fails first at $n = 3$. The answer is 3."
          - problem: "Let $F(k) = \\left(\\dfrac{k(k+1)}{2}\\right)^2$, the cube-sum formula at $k$. In the induction step one studies the difference $F(k+1) - F(k)$, which factors as $(k+1)^2\\,q(k)$. Give $q(k)$."
            answer: "k+1"
            answer_contract: {"kind": "function", "vars": ["k"]}
            solution_sketch: "Step 1 (definition): $F(k+1) - F(k) = \\left(\\dfrac{(k+1)(k+2)}{2}\\right)^2 - \\left(\\dfrac{k(k+1)}{2}\\right)^2$. Step 2 (factoring): take out $\\dfrac{(k+1)^2}{4}$ from both terms; the bracket is $(k+2)^2 - k^2 = 4k + 4$ by difference of squares. Step 3 (simplification): the difference is $\\dfrac{(k+1)^2 (4k+4)}{4} = (k+1)^2 (k+1) = (k+1)^3$, which is exactly the new term added to the sum. The answer is k+1."
          - problem: "A study group claims that $1^2 + 2^2 + \\cdots + n^2 = \\dfrac{n(n+1)(2n+1)}{6} + (n-1)$ for all $n \\ge 1$, and checks only $n = 1$. Give the smallest $n \\ge 1$ for which the claim is false."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (summation notation): the claim adds the extra term $n - 1$ to the true square-sum formula $\\dfrac{n(n+1)(2n+1)}{6}$, so the two sides agree only where that term is 0. Step 2 (check at $n = 1$): the left side is $1$ and the right side is $\\dfrac{1 \\cdot 2 \\cdot 3}{6} + 0 = 1$, so the single check passes. Step 3 (check at $n = 2$): the left side is $1 + 4 = 5$, but the right side is $\\dfrac{2 \\cdot 3 \\cdot 5}{6} + 1 = 6$. One passing check is not a proof; the claim fails first at $n = 2$. The answer is 2."
          - problem: "To prove $1^2 + 2^2 + \\cdots + n^2 = \\dfrac{n(n+1)(2n+1)}{6}$ by induction, assume the formula at $n = k$. The next line of the proof must express the sum to $k+1$ using the hypothesis. Select the line that is correct."
            answer: "k(k+1)(2k+1)/6 + (k+1)^2"
            answer_contract: {"kind": "label", "options": [["k(k+1)(2k+1)/6 + (k+1)^2"], ["k(k+1)(2k+1)/6 + (k+1)^3"], ["(k+1)(k+2)(2k+3)/6 + (k+1)^2"], ["k(k+1)(2k+1)/6 + (k+1)/2"]]}
            solution_sketch: "Step 1 (summation notation): the sum to $k+1$ is the sum to $k$ plus the new term $(k+1)^2$. Step 2 (hypothesis): substitute the formula for the sum to $k$, giving $\\dfrac{k(k+1)(2k+1)}{6} + (k+1)^2$. The option with $(k+1)^3$ uses the cube term, the error of mixing the two power sums. The option that adds the finished formula $\\dfrac{(k+1)(k+2)(2k+3)}{6}$ assumes the target, a circular step. The option with $\\dfrac{k+1}{2}$ halves the new term. The answer is k(k+1)(2k+1)/6 + (k+1)^2."
          - problem: "Write the full proof: for all $n \\ge 1$, $1^3 + 2^3 + \\cdots + n^3 = \\left(\\dfrac{n(n+1)}{2}\\right)^2$. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Base case: for $n = 1$ the left side is $1$ and the right side is $\\left(\\dfrac{1 \\cdot 2}{2}\\right)^2 = 1$, so the formula holds. Hypothesis: assume for some $k \\ge 1$ that $1^3 + 2^3 + \\cdots + k^3 = \\left(\\dfrac{k(k+1)}{2}\\right)^2$. Step: by summation notation the sum to $k+1$ equals $\\left(\\dfrac{k(k+1)}{2}\\right)^2 + (k+1)^3$; factoring out $(k+1)^2$ gives $(k+1)^2\\left(\\dfrac{k^2}{4} + k + 1\\right)$. Completing the square in the bracket: $\\dfrac{k^2}{4} + k + 1 = \\dfrac{(k+2)^2}{4}$. Hence the sum to $k+1$ is $(k+1)^2 \\dfrac{(k+2)^2}{4} = \\left(\\dfrac{(k+1)(k+2)}{2}\\right)^2$, which is the formula at $k+1$. Conclusion: the base case and the step prove the formula for all $n \\ge 1$ by induction."
        constraints: "power sums; the algebraic factoring in the step is the heart of the proof"
      - id: kp3
        name: "Geometric-type sums"
        key_prerequisites: [induction-template]
        exemplars:
          - problem: "To prove $1 + 5 + 25 + \\cdots + 5^n = \\frac{5^{n+1}-1}{4}$ by induction, combine the hypothesis and the next term over the denominator: $\\frac{5^{n+1}-1}{4} + 5^{n+1} = \\frac{A\\cdot 5^{n+1}-1}{4}$. Give $A$."
            answer: "5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "First write the inductive step: add the next power $5^{n+1}$ to the hypothesis. Put both terms over the common denominator $4$: $\\frac{5^{n+1}-1}{4} + \\frac{4\\cdot 5^{n+1}}{4}$. Combine the numerators: $\\frac{5\\cdot 5^{n+1}-1}{4}$. The coefficient is 5."
          - problem: "For the geometric sum $1 + 7 + 49 + \\cdots + 7^n$, the closed form is $\\frac{7^{n+1}-1}{D}$. Give $D$."
            answer: "6"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The ratio is $7$. The geometric sum formula uses denominator $r-1$, so $D = 7 - 1$. The denominator is 6."
          - problem: "In the inductive step for $1 + 3 + 9 + \\cdots + 3^k = \\frac{3^{k+1}-1}{2}$, the next term added is $3^{k+1}$. Give its value when $k = 4$."
            answer: "243"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The next term is the power $3^{k+1}$. Substitute $k = 4$: $3^{5}$. Compute $3^{5} = 243$. The value is 243."
          - problem: "For the claim $1 + 6 + 36 + \\cdots + 6^n = \\frac{6^{n+1}-1}{5}$, evaluate the right side at $n = 1$."
            answer: "7"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The right side is $(6^{n+1}-1)/5$. Substitute $n=1$: $(6^2-1)/5$. Compute $(36-1)/5 = 35/5 = 7$. The value is 7."
          - problem: "In the inductive step of the proof that $1 + 7 + 49 + \\cdots + 7^k = \\frac{7^{k+1}-1}{6}$, take $k = 2$. The hypothesis gives $\\frac{7^{3}-1}{6}$ and the next term is $7^{3}$. Combining over the common denominator $6$ gives the numerator $7^{3} - 1 + 6\\cdot 7^{3}$. Give the value of this numerator."
            answer: "2400"
            answer_contract: {"kind": "exact"}
            solution_sketch: "First write the inductive step: the sum to $k+1$ equals the hypothesis $(7^{k+1}-1)/6$ plus the next term $7^{k+1}$. With $k = 2$ the hypothesis is $(7^3-1)/6 = 342/6$ and the next term is $7^3 = 343$. Combine the two terms over the common denominator $6$; this is the step where this KP's method is used. The numerator is $7^3 - 1 + 6\\cdot 7^3 = 342 + 2058$, and indeed $2400/6 = 400 = 1 + 7 + 49 + 343$. The value of the numerator is 2400."
          - problem: "In the inductive step for $1 + 5 + 25 + \\cdots + 5^k = \\frac{5^{k+1}-1}{4}$, the line for the sum to $k+1$ is missing. Select the line that is true and that shows the hypothesis."
            answer: "(5^(k+1)-1)/4 + 5^(k+1)"
            answer_contract: {"kind": "label", "options": [["(5^(k+1)-1)/4 + 5^(k+1)"], ["(5^(k+1)-1)/4 + 5^k"], ["(5^k-1)/4 + 5^(k+1)"], ["5*(5^(k+1)-1)/4"]]}
            solution_sketch: "The induction hypothesis is the sum up to $5^k$, which is $(5^{k+1}-1)/4$. The next term is $5^{k+1}$. Option B is wrong because it adds $5^k$, not the next term. Option C is wrong because it uses the numerator for the previous exponent. Option D is wrong because it multiplies the whole sum by $5$ instead of adding the next term. Option A is the hypothesis plus the next term. The answer is (5^(k+1)-1)/4 + 5^(k+1)."
          - problem: "Write the full proof: for all $n \\ge 0$, $1 + 6 + 36 + \\cdots + 6^n = \\frac{6^{n+1}-1}{5}$. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Base case: for $n=0$, the left side is $1$ and the right side is $(6^{1}-1)/5 = 5/5 = 1$. Induction hypothesis: assume for some $k \\ge 0$ that $1 + 6 + \\cdots + 6^k = (6^{k+1}-1)/5$. Inductive step: add the next term $6^{k+1}$ to both sides. The left side becomes the sum to $k+1$. The right side becomes $(6^{k+1}-1)/5 + 6^{k+1}$. Combine over the common denominator $5$: $(6^{k+1}-1 + 5\\cdot 6^{k+1})/5 = (6\\cdot 6^{k+1}-1)/5 = (6^{k+2}-1)/5$. This is the closed form for $n=k+1$. Conclusion: by induction the formula holds for all $n \\ge 0$."
        constraints: "geometric sums with integer ratio; combine over a common denominator in the step"
