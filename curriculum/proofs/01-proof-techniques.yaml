    knowledge_points:
      - id: kp1
        name: "Linear vs. exponential growth"
        key_prerequisites: [induction-template]
        try_first:
          problem: 'Find the smallest integer $n \ge 1$ with $2^n > 2n+3$.'
          answer_contract: {"kind": "exact"}
          answer: '4'
          reveal: 'The power $2^n$ first passes $2n+3$ at $n=4$ ($16>11$) and stays ahead, because each step doubles $2^n$ but adds only $2$ to $2n+3$. Induction turns this observation into a proof: check the base case, then show the added amount is absorbed by $2^n$.'
        exemplars:
          - problem: 'Find the smallest integer $n_0 \ge 1$ such that $2n+1 < 2^n$ for every integer $n \ge n_0$.'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Test small values. For $n=1$ we get $3<2$ and for $n=2$ we get $5<4$, and both are false. For $n=3$ we get $7<8$, which is true, and the inequality stays true from then on because each step adds only $2$ to the left side while the right side doubles. So the smallest value is $n_0=3$.'
          - problem: 'A club has $1$ member at the start. Plan A adds $5$ members every month, so it has $5n+1$ members after $n$ months. Plan B doubles the membership every month, so it has $2^n$ members after $n$ months. From which month $n_0$ on does plan B have more members than plan A in every month?'
            answer: '5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Compare the plans month by month. At $n=4$ plan A has $21$ members and plan B has $16$, so plan A is still ahead. At $n=5$ plan A has $26$ and plan B has $32$. From then on plan B gains $2^n \ge 32$ members each month while plan A gains only $5$, so plan B stays ahead and $n_0=5$.'
          - problem: 'In an induction proof of $9n+1 < 2^n$, the step from $k$ to $k+1$ adds $9$ to the left side and needs $9 \le 2^k$. What is the smallest integer $k \ge 1$ with $9 \le 2^k$?'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'We have $2^3 = 8$, which is less than $9$, and $2^4 = 16 \ge 9$. So the added $9$ is at most $2^k$ exactly when $k \ge 4$. The smallest such $k$ is $4$.'
          - problem: 'A proof shows correctly that if $2k+1<2^k$ for some $k \ge 1$, then $2(k+1)+1<2^{k+1}$. It does not check a base case and concludes that $2n+1<2^n$ for every positive integer $n$. For how many positive integers $n$ is $2n+1<2^n$ false?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The inequality fails at $n=1$, where $3<2$ is false, and at $n=2$, where $5<4$ is false. It holds at $n=3$, where $7<8$, and from then on. So it is false for exactly $2$ positive integers, and a base case at $n=3$ is what the proof needs.'
          - problem: 'Is it true that $4n < 2^n$ for every integer $n \ge 4$?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "it is true", "true", "it is", "yes it is true"], ["no", "it is not true", "not true", "false", "it is not", "it isn't", "no it is not true"]]}
            solution_sketch: 'At $n=4$ the left side is $16$ and the right side is $2^4=16$. The two sides are equal, so the strict inequality $16<16$ is false. The claim fails at $n=4$, so the answer is no.'
          - problem: 'A culture doubles in size every hour, so after $n$ hours it holds $2^n$ cells. A counter that adds $10$ cells per hour shows $10n$. From which hour $n_0$ on is the culture larger than the counter in every hour?'
            answer: '6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'At $n=5$ the culture has $32$ cells and the counter shows $50$, so the counter is ahead. At $n=6$ the culture has $64$ cells and the counter shows $60$. From then on the culture gains $2^n \ge 64$ cells per hour and the counter gains only $10$, so $n_0=6$.'
          - problem: 'Write the full proof that $2n+1 < 2^n$ for every integer $n \ge 3$, by induction on $n$.'
            answer: '2n + 1 < 2^n for all n >= 3'
            answer_contract: {"kind": "none"}
            solution_sketch: 'We prove by induction on $n$ that $2n+1 < 2^n$ for every integer $n \ge 3$. Base case: for $n=3$ the left side is $2\cdot 3+1=7$ and the right side is $2^3=8$, and $7<8$. Inductive hypothesis: let $k \ge 3$ be an integer and assume $2k+1 < 2^k$. We must show that $2(k+1)+1 < 2^{k+1}$. We compute $2(k+1)+1 = (2k+1)+2$. By the hypothesis, $(2k+1)+2 < 2^k+2$. Since $k \ge 3$ we have $2^k \ge 2^3 = 8 \ge 2$, so $2^k+2 \le 2^k+2^k = 2\cdot 2^k = 2^{k+1}$. Chaining these inequalities gives $2(k+1)+1 < 2^{k+1}$, which is the statement for $k+1$. By the principle of mathematical induction, $2n+1 < 2^n$ for every integer $n \ge 3$.'
        constraints: "bound the added amount by a copy of the exponential term Closed proof-audit items must require this knowledge point's method; verify every proposed inference for the stated arbitrary inputs. Do not supply the decisive result as an established fact."
      - id: kp2
        name: "Polynomial vs. exponential and factorial"
        key_prerequisites: [induction-template]
        exemplars:
          - problem: 'Find the smallest integer $n_0 \ge 1$ such that $2^n > n^2$ for every integer $n \ge n_0$.'
            answer: '5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Compare the two sides. For $n=2$ we get $4>4$, for $n=3$ we get $8>9$ and for $n=4$ we get $16>16$, and all three are false. For $n=5$ we get $32>25$, and the inequality then holds for every larger $n$ by the induction step. So $n_0=5$.'
          - problem: 'A lab culture holds $2^n$ cells after $n$ hours, and a rack of cubic sample wells holds $n^3$ wells at stage $n$. Find the smallest integer $n_0$ such that the culture has more cells than the rack has wells at every stage $n \ge n_0$.'
            answer: '10'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'At stage $9$ the culture has $512$ cells and the rack has $729$ wells, so the rack is still ahead. At stage $10$ the culture has $1024$ cells and the rack has $1000$ wells. For $n \ge 10$ the step works because $\left(1+\frac1n\right)^3 \le 1.1^3 < 2$, so $2n^3 \ge (n+1)^3$. Hence $n_0=10$.'
          - problem: 'In the induction step for $2^n>n^2$ the hypothesis gives $2^{k+1}>2k^2$, so the step needs $2k^2 \ge (k+1)^2$. What is the smallest integer $k \ge 1$ for which $2k^2 \ge (k+1)^2$?'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Rewrite the condition as $2k^2 \ge k^2+2k+1$, that is $k^2-2k-1 \ge 0$. For $k=2$ this reads $-1 \ge 0$, which is false, and for $k=3$ it reads $2 \ge 0$, which is true. So the smallest value is $k=3$.'
          - problem: 'A proof of $2^n>n^2$ for all $n \ge 1$ checks $n=1$, where $2>1$, and shows correctly that $2^k>k^2$ implies $2^{k+1}>(k+1)^2$ whenever $k \ge 3$. It concludes that $2^n>n^2$ for every $n \ge 1$. What is the smallest positive integer $n$ for which this conclusion is false?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The step covers only $k \ge 3$, so it never links $n=1$ to $n=2$. We check $n=2$ directly: $2^2=4$ and $2^2=4$, and $4>4$ is false. So $n=2$ is the smallest value for which the conclusion is false.'
          - problem: 'Is $n^2 < 3^n$ true for every positive integer $n$?'
            answer: 'yes'
            answer_contract: {"kind": "label", "options": [["yes", "it is true", "true", "it is", "yes it is true"], ["no", "it is not true", "not true", "false", "it is not", "it isn't", "no it is not true"]]}
            solution_sketch: 'Check the first cases: $1<3$ and $4<9$. For $k \ge 2$ the step gives $3^{k+1}=3\cdot 3^k>3k^2$, and $3k^2 \ge (k+1)^2$ because $2k^2-2k-1 \ge 0$ for $k \ge 2$. So the inequality holds for all $n \ge 1$, and the answer is yes.'
          - problem: 'Algorithm A needs $n!$ steps on an input of size $n$, and algorithm B needs $4^n$ steps. Find the smallest input size $n_0$ such that A needs more steps than B for every size $n \ge n_0$.'
            answer: '9'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'We have $8! = 40320$, which is less than $4^8 = 65536$, but $9! = 362880$ is more than $4^9 = 262144$. From $n=9$ on, each step multiplies $n!$ by $n+1 \ge 10$ but multiplies $4^n$ by only $4$, so A stays ahead. Hence $n_0=9$.'
          - problem: 'Write the full proof that $2^n > n^2$ for every integer $n \ge 5$, by induction on $n$.'
            answer: '2^n > n^2 for all n >= 5'
            answer_contract: {"kind": "none"}
            solution_sketch: 'We prove by induction on $n$ that $2^n > n^2$ for every integer $n \ge 5$. Base case: for $n=5$ we have $2^5=32$ and $5^2=25$, and $32>25$. Inductive hypothesis: let $k \ge 5$ be an integer and assume $2^k > k^2$. We must show that $2^{k+1} > (k+1)^2$. Multiplying the hypothesis by $2$ gives $2^{k+1} = 2\cdot 2^k > 2k^2 = k^2+k^2$. Since $k \ge 5$ we have $k^2 = k\cdot k \ge 5k = 2k+3k \ge 2k+1$. Hence $k^2+k^2 \ge k^2+2k+1 = (k+1)^2$. Therefore $2^{k+1} > 2k^2 \ge (k+1)^2$, which is the statement for $k+1$. By the principle of mathematical induction, $2^n > n^2$ for every integer $n \ge 5$.'
        constraints: "verify the base is large enough; bound the step algebraically Closed proof-audit items must require this knowledge point's method; verify every proposed inference for the stated arbitrary inputs. Do not supply the decisive result as an established fact."
      - id: kp3
        name: "Bernoulli and harmonic bounds"
        key_prerequisites: [induction-template]
        exemplars:
          - problem: 'In the induction step for Bernoulli''s inequality, the hypothesis $(1+x)^k \ge 1+kx$ is multiplied by $1+x$, which gives $(1+x)^{k+1} \ge (1+kx)(1+x)$. Multiply out $(1+kx)(1+x)$.'
            answer: '1 + (k+1)x + kx^2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Multiply each term of the first factor by each term of the second: $(1+kx)(1+x) = 1 + x + kx + kx^2$. Collecting the terms in $x$ gives $1 + (k+1)x + kx^2$. The last term $kx^2$ is nonnegative, which is what finishes the step.'
          - problem: 'Bernoulli''s inequality $(1+x)^n \ge 1+nx$ is stated for $x \ge -1$. What is the smallest positive integer $n$ for which the inequality is false when $x=-3$?'
            answer: '5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'For $x=-3$ we compare $(-2)^n$ with $1-3n$. We get $-2 \ge -2$ at $n=1$, $4 \ge -5$ at $n=2$, $-8 \ge -8$ at $n=3$ and $16 \ge -11$ at $n=4$, and all are true. At $n=5$ we get $-32 \ge -14$, which is false, so $n=5$ is the smallest failure.'
          - problem: 'In the induction proof that $\sum_{i=1}^{2^n} \frac1i \ge 1+\frac n2$, the step adds the block $\frac{1}{2^k+1}+\dots+\frac{1}{2^{k+1}}$, which has $2^k$ terms, each at least $\frac{1}{2^{k+1}}$. What lower bound for the whole block follows?'
            answer: '1/2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The block has $2^k$ terms and each is at least $\frac{1}{2^{k+1}}$. So the block is at least $2^k \cdot \frac{1}{2^{k+1}} = \frac12$. This is exactly the amount that the bound $1+\frac n2$ gains when $n$ goes up by $1$.'
          - problem: 'Give an integer $x$ for which $(1+x)^3 \ge 1+3x$ is false.'
            answer: '-4'
            answer_contract: {"kind": "property", "check": "integer_in_range", "args": {"max": -4}}
            solution_sketch: 'Subtract the two sides: $(1+x)^3-(1+3x) = x^3+3x^2 = x^2(x+3)$. This is negative exactly when $x<-3$ and $x \ne 0$, so every integer $x \le -4$ works. For $x=-4$ we get $-27 \ge -11$, which is false.'
          - problem: 'Is $\left(\frac32\right)^n \ge 1+\frac n2$ true for every positive integer $n$?'
            answer: 'yes'
            answer_contract: {"kind": "label", "options": [["yes", "it is true", "true", "it is", "yes it is true"], ["no", "it is not true", "not true", "false", "it is not", "it isn't", "no it is not true"]]}
            solution_sketch: 'Write $\frac32 = 1+\frac12$. Bernoulli''s inequality with $x=\frac12 \ge -1$ gives $\left(1+\frac12\right)^n \ge 1+\frac n2$ for every $n \ge 1$. So the statement is true, and the answer is yes.'
          - problem: 'A deposit of $\$1000$ earns $5\%$ interest each year, compounded, so after $n$ years it is worth $1000(1+0.05)^n$ dollars. Use Bernoulli''s inequality with $x=0.05$ to find the amount, in dollars, that the balance after $10$ years is guaranteed to reach.'
            answer: '1500'
            answer_contract: {"kind":"unit","quantity":"dollar","unit":"dollar","allow_omitted":true}
            solution_sketch: 'Bernoulli''s inequality gives $(1+0.05)^{10} \ge 1+10\cdot 0.05 = 1.5$. Multiplying by $1000$ shows that the balance is at least $1500$ dollars. The true balance is about $1628.89$ dollars, so the bound is safe but not tight.'
          - problem: 'The fractions $1, \frac12, \frac13, \dots$ are added one after another. The bound $\sum_{i=1}^{2^n} \frac1i \ge 1+\frac n2$ holds for every $n \ge 1$. What is the smallest $n$ for which the bound guarantees that the sum of the first $2^n$ fractions is at least $5$?'
            answer: '8'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'We need $1+\frac n2 \ge 5$, that is $\frac n2 \ge 4$, so $n \ge 8$. For $n=7$ the bound gives only $4.5$. So the smallest value is $n=8$, which uses the first $2^8=256$ fractions.'
          - problem: 'Write the full proof that $(1+x)^n \ge 1+nx$ for every real number $x \ge -1$ and every integer $n \ge 1$ (Bernoulli''s inequality).'
            answer: '(1+x)^n >= 1+nx for x >= -1, n >= 1'
            answer_contract: {"kind": "none"}
            solution_sketch: 'Fix a real number $x \ge -1$. We prove by induction on $n$ that $(1+x)^n \ge 1+nx$ for every integer $n \ge 1$. Base case: for $n=1$ both sides equal $1+x$, so the inequality holds. Inductive hypothesis: let $k \ge 1$ be an integer and assume $(1+x)^k \ge 1+kx$. Because $x \ge -1$, the factor $1+x$ is nonnegative, so multiplying both sides of the hypothesis by $1+x$ keeps the direction of the inequality: $(1+x)^{k+1} \ge (1+kx)(1+x)$. Expanding gives $(1+kx)(1+x) = 1+x+kx+kx^2 = 1+(k+1)x+kx^2$. Since $kx^2 \ge 0$, we have $1+(k+1)x+kx^2 \ge 1+(k+1)x$. Hence $(1+x)^{k+1} \ge 1+(k+1)x$, which is the statement for $k+1$. By the principle of mathematical induction, the inequality holds for every integer $n \ge 1$.'
        constraints: "multiplying inequalities requires a nonnegative factor; block-bounding for harmonic sums Closed proof-audit items must require this knowledge point's method; verify every proposed inference for the stated arbitrary inputs. Do not supply the decisive result as an established fact."
    diagnostic_exemplar:
      problem: 'Prove by induction: for all $n \ge 1$, $\displaystyle\sum_{i=1}^{n} \frac{1}{i^2} \le 2 - \frac{1}{n}$.'
      answer: 'Base $n = 1$: the sum is $1$ and $2 - \tfrac11 = 1$, so the inequality holds (with equality). Step: assume $\sum_{i=1}^{n} \frac{1}{i^2} \le 2 - \frac{1}{n}$. Then $\sum_{i=1}^{n+1} \frac{1}{i^2} \le 2 - \frac{1}{n} + \frac{1}{(n+1)^2}$, so it suffices that $\frac{1}{(n+1)^2} \le \frac{1}{n} - \frac{1}{n+1} = \frac{1}{n(n+1)}$ — true because $(n+1)^2 > n(n+1)$ for $n \ge 1$. Hence $\sum_{i=1}^{n+1} \frac{1}{i^2} \le 2 - \frac{1}{n+1}$, and the claim follows by induction.'
      solution_sketch: 'Add the new term to the inductive bound and check it fits inside the gap $\frac1n - \frac{1}{n+1}$.'
