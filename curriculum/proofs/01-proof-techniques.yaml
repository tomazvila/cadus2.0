  - id: induction-divisibility-proofs
    name: "Divisibility by Induction"
    core: true
    difficulty: 0.58
    drill: false
    answer_kind: proof
    expected_time_secs: 220
    prerequisites:
      - id: induction-template
        weight: 0.6
        key: true
      - id: divisibility-parity-proofs
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: "Polynomial divisibility"
        key_prerequisites: [induction-template]
        exemplars:
          - problem: "To prove $3 \\mid (n^3 + 2n)$ by induction, write $(n+1)^3 + 2(n+1) = (n^3 + 2n) + 3 q(n)$. Give $q(n)$."
            answer: "n^2+n+1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Expand the left side: $(n+1)^3 + 2(n+1) = n^3 + 3n^2 + 3n + 1 + 2n + 2$. Isolate the previous case: $(n^3 + 2n) + (3n^2 + 3n + 3)$. Factor $3$ from the remainder. The quotient is q(n) = n^2+n+1."
          - problem: "To prove $2 \\mid (n^2 + n)$ by induction, write $(n+1)^2 + (n+1) = (n^2 + n) + 2 q(n)$. Give $q(n)$."
            answer: "n+1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Expand: $(n+1)^2 + (n+1) = n^2 + 2n + 1 + n + 1$. Isolate the previous case: $(n^2 + n) + (2n + 2)$. Factor $2$ from the remainder. The quotient is q(n) = n+1."
          - problem: "To prove $5 \\mid (n^5 - n)$ by induction, write $(n+1)^5 - (n+1) = (n^5 - n) + 5 q(n)$. Give $q(n)$."
            answer: "n^4+2n^3+2n^2+n"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Expand: $(n+1)^5 = n^5 + 5n^4 + 10n^3 + 10n^2 + 5n + 1$. Subtract $n+1$: $n^5 + 5n^4 + 10n^3 + 10n^2 + 4n$. Isolate $(n^5 - n)$: remainder $5n^4 + 10n^3 + 10n^2 + 5n$. Factor $5$. The quotient is q(n) = n^4+2n^3+2n^2+n."
          - problem: "To prove $4 \\mid (2n^2 + 2n)$ by induction, write $2(n+1)^2 + 2(n+1) = (2n^2 + 2n) + c(n+1)$. Give the constant $c$."
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Expand: $2(n+1)^2 + 2(n+1) = 2n^2 + 6n + 4$. Subtract the previous case $2n^2 + 2n$: difference $4n + 4$. Factor as $4(n+1)$. The constant is c = 4."
          - problem: "Claim: $6 \\mid (n^2 + 5n)$ for $n \\ge 0$. Step 1: for $n = 0$, $0$ is divisible by $6$. Step 2: assume $6 \\mid (k^2 + 5k)$. Step 3: $(k+1)^2 + 5(k+1) = (k^2 + 5k) + 6(k+1)$. Step 4: the two terms are multiples of $6$, so $6 \\mid ((k+1)^2 + 5(k+1))$. Which step is the first step that is not valid?"
            answer: "Step 3"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "Step 1 is a correct base case because $0$ is divisible by $6$. Step 2 states the induction hypothesis. Step 3 is false: the expansion gives $(k^2 + 5k) + (2k + 6)$, not $6(k+1)$. Step 4 would follow only from a correct remainder. The first invalid step is Step 3."
          - problem: "In the inductive step for $3 \\mid (n^3 - n)$, the line $(k+1)^3 - (k+1) = \\;?$ is missing. Select the line that is true and that shows the hypothesis."
            answer: "(k^3 - k) + 3(k^2 + k)"
            answer_contract: {"kind": "label", "options": [["(k^3 - k) + 3(k^2 + k)"], ["(k^3 - k) + 3(k^2 + k) + 1"], ["(k^3 - k) + 3k^2 + 2k"], ["(k^3 - k) + 2(k^2 + k)"]]}
            solution_sketch: "Expand the left side: $(k+1)^3 - (k+1) = k^3 + 3k^2 + 2k$. Isolate the previous case: $(k^3 - k) + 3k^2 + 3k = (k^3 - k) + 3(k^2 + k)$. The option (k^3 - k) + 3(k^2 + k) + 1 adds an extra 1. The option (k^3 - k) + 3k^2 + 2k drops a k from the remainder. The option (k^3 - k) + 2(k^2 + k) uses the wrong factor 2. The correct line is (k^3 - k) + 3(k^2 + k)."
          - problem: "Write the full proof: for all $n \\ge 0$, $7 \\mid (n^7 - n)$. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Base case: $n = 0$ gives $0^7 - 0 = 0$, a multiple of $7$. Hypothesis: assume $7 \\mid (k^7 - k)$ for some $k \\ge 0$. Step: $(k+1)^7 - (k+1) = (k^7 - k) + 7(k^6 + 3k^5 + 5k^4 + 5k^3 + 3k^2 + k)$. The first term is a multiple of $7$ by the hypothesis, and the second is a multiple of $7$ by its factor $7$. Conclusion: the sum is a multiple of $7$, so the claim holds for $k+1$, and by induction for all $n \\ge 0$."
        constraints: "isolate the previous case plus a visibly-divisible remainder"
      - id: kp2
        name: "Exponential divisibility"
        key_prerequisites: [induction-template]
        exemplars:
          - problem: "To prove 6 | (7^n - 1) by induction, write 7^(n+1) - 1 = 7(7^n - 1) + c. Give c."
            answer: "6"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full rewrite is 7^(n+1) - 1 = 7(7^n - 1) + c. Expand the right side: 7(7^n - 1) + c = 7^(n+1) - 7 + c. Compare with 7^(n+1) - 1, so -7 + c = -1. Solve: c = 6. The constant is 6."
          - problem: "To prove 4 | (5^n - 1) by induction, write 5^(n+1) - 1 = 5(5^n - 1) + c. Give c."
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full rewrite is 5^(n+1) - 1 = 5(5^n - 1) + c. Expand the right side: 5(5^n - 1) + c = 5^(n+1) - 5 + c. Compare with 5^(n+1) - 1, so -5 + c = -1. Solve: c = 4. The constant is 4."
          - problem: "An induction proof shows that 11 | (12^n - 1) for every n >= 0. Give the value of the expression at n = 0."
            answer: "0"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Base case test: put n = 0 into 12^n - 1. This gives 12^0 - 1 = 1 - 1 = 0. Since 0 is a multiple of 11, the base case holds. The value is 0."
          - problem: "Claim: 7 | (8^n - 1) for n >= 1. Step 1: for n = 1, 8 - 1 = 7. Step 2: assume 7 | (8^k - 1). Step 3: 8^(k+1) - 1 = 8(8^k - 1) + 8. Step 4: both terms are multiples of 7, so 7 | (8^(k+1) - 1). Which step is the first step that is not valid?"
            answer: "Step 3"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "The full claim is 7 | (8^n - 1) for n >= 1. Step 1 is a correct base case: 8 - 1 = 7. Step 2 is the correct inductive hypothesis. Step 4 is not the first invalid step because it inherits the bad remainder from Step 3. Step 3 is false: 8^(k+1) - 1 = 8(8^k - 1) + 7, not + 8. The answer is Step 3."
          - problem: "In the inductive step for 9 | (10^n - 1), the line 10^(k+1) - 1 = ? is missing. Select the line that is true and that shows the hypothesis."
            answer: "10(10^k - 1) + 9"
            answer_contract: {"kind": "label", "options": [["10(10^k - 1) + 9"], ["10(10^k - 1) + 10"], ["10(10^k - 1) - 9"], ["(10^k - 1) + 9"]]}
            solution_sketch: "The full rewrite is 10^(k+1) - 1 = 10(10^k - 1) + 9. Multiply out: 10(10^k - 1) = 10^(k+1) - 10, so adding 9 gives 10^(k+1) - 1. The option + 10 forgets the -1. The option - 9 is a sign error. The option (10^k - 1) + 9 forgets the factor 10. The answer is 10(10^k - 1) + 9."
          - problem: "A claim states that 3 | (2^n - 1) for all n >= 1. Test the first few values. Give the smallest n >= 1 for which the claim is false."
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Test values: n = 1 gives 2^1 - 1 = 1, which is not a multiple of 3. n = 2 gives 2^2 - 1 = 3, a multiple of 3. So the first failure is n = 1. The smallest such n is 1."
          - problem: "Write the full proof: for all n >= 0, 8 | (9^n - 1). Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Base case: for n = 0, 9^0 - 1 = 0, and 0 is divisible by 8. Inductive hypothesis: assume 8 | (9^k - 1) for some k >= 0. Inductive step: rewrite 9^(k+1) - 1 = 9(9^k - 1) + 8. The first term is divisible by 8 by the hypothesis; the second term is 8 itself, visibly divisible. Therefore the sum is divisible by 8. Conclusion: the statement holds for k + 1, so by induction 8 | (9^n - 1) for all n >= 0."
        constraints: "rewrite $a^{n+1} - 1$ as $a(a^n - 1) + (a - 1)$; both pieces visibly divisible"
      - id: kp3
        name: "Mixed exponential-linear divisibility"
        key_prerequisites: [induction-template]
        exemplars:
          - problem: "To prove 3 | (4^n + 5) by induction, write 4^(n+1) + 5 = 4(4^n + 5) + r for a constant r. Give r."
