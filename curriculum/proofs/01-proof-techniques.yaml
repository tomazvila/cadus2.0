          - problem: "To prove 9 | (4^n + 6n - 1) by induction, write 4^(n+1) + 6(n+1) - 1 = 4(4^n + 6n - 1) + 9 q(n). Give q(n)."
            answer: "1-2n"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The target is 4^(n+1) + 6n + 5. The multiple of the hypothesis is 4(4^n + 6n - 1) = 4^(n+1) + 24n - 4. Subtract: (6n + 5) - (24n - 4) = -18n + 9 = 9(1 - 2n). Thus q(n) = 1 - 2n, and the remainder is a visible multiple of 9. The answer is 1-2n."
          - problem: "To prove 12 | (7^n + 6n + 11) by induction, write 7^(n+1) + 6(n+1) + 11 = 7(7^n + 6n + 11) + 12 q(n). Give q(n)."
            answer: "-3n-5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The target expands to 7^(n+1) + 6n + 17. The multiple of the hypothesis is 7(7^n + 6n + 11) = 7^(n+1) + 42n + 77. Subtract: (6n + 17) - (42n + 77) = -36n - 60 = 12(-3n - 5). Thus q(n) = -3n - 5, a visible multiple of 12. The answer is -3n-5."
          - problem: "A student claims that 5 | (3^n + 2n + 4) for every n >= 0. Test n = 0 and n = 1. Give the smallest n >= 0 for which the claim is false."
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Test the base case n = 0: 3^0 + 0 + 4 = 5, a multiple of 5. Test the next case n = 1: 3 + 2 + 4 = 9, not a multiple of 5. Therefore the first failure occurs at n = 1, and the induction hypothesis cannot be reached past this point. The answer is 1."
          - problem: "Claim: 8 | (5^n + 4n + 7) for n >= 0. Step 1: for n = 0, 5^0 + 0 + 7 = 8. Step 2: assume 8 | (5^k + 4k + 7). Step 3: 5^(k+1) + 4(k+1) + 7 = 5(5^k + 4k + 7) + 8(2k + 3). Step 4: both terms are multiples of 8, so 8 | (5^(k+1) + 4(k+1) + 7). Which step is the first step that is not valid?"
            answer: "Step 3"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "Step 1 is the correct base case because 8 is a multiple of 8. Step 2 is the induction hypothesis. Step 3 is invalid: the correct subtraction is 5(5^k + 4k + 7) - 8(2k + 3), since 5(5^k + 4k + 7) = 5^(k+1) + 20k + 35 and the target is 5^(k+1) + 4k + 11. Step 4 would follow only with the corrected sign. The answer is Step 3."
          - problem: "In the inductive step for 9 | (7^n + 3n + 8), the line 7^(k+1) + 3(k+1) + 8 = ? is missing. Select the line that is true and that shows the hypothesis."
            answer: "$7(7^k + 3k + 8) - 9(2k + 5)$"
            answer_contract: {"kind": "label", "options": [["$7(7^k + 3k + 8) - 9(2k + 5)$"], ["$7(7^k + 3k + 8) + 9(2k + 5)$"], ["$7(7^k + 3k + 8) - 9(2k - 5)$"], ["$7(7^k + 3k + 8) - 3(2k + 5)$"]]}
            solution_sketch: "Start from the target on the left: 7^(k+1) + 3k + 11. The multiple of the hypothesis is 7(7^k + 3k + 8) = 7^(k+1) + 21k + 56. The needed subtraction is (21k + 56) - (3k + 11) = 18k + 45 = 9(2k + 5), so the correct line subtracts 9(2k + 5). The option with +9 has a sign error. The option with -9(2k - 5) changes the constant. The option with -3(2k + 5) uses the wrong divisor factor. The answer is $7(7^k + 3k + 8) - 9(2k + 5)$."
          - problem: "Write the full proof: for all n >= 0, 9 | (7^n + 3n + 8). Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Base case: at n = 0, 7^0 + 0 + 8 = 9, and 9 is a multiple of 9. Induction hypothesis: assume 9 | (7^k + 3k + 8) for some k >= 0, so 7^k + 3k + 8 = 9m for an integer m. Induction step: compute 7^(k+1) + 3(k+1) + 8 = 7(7^k + 3k + 8) - 9(2k + 5). The first term is 7 times a multiple of 9, hence a multiple of 9; the second term is visibly 9 times an integer. Therefore their difference is a multiple of 9, so 9 | (7^(k+1) + 3(k+1) + 8). Conclusion: by induction the statement holds for every n >= 0. The full proof is complete."
        constraints: "express the next case as (multiple of the hypothesis) plus a visible multiple of the divisor"
    diagnostic_exemplar:
      problem: 'Prove by induction: for all $n \ge 0$, $9 \mid (10^{n} - 9n - 1)$.'
      answer: 'Base $n = 0$: $10^0 - 0 - 1 = 0$, which is divisible by $9$. Step: assume $9 \mid (10^{n} - 9n - 1)$. Then $10^{n+1} - 9(n+1) - 1 = 10(10^{n} - 9n - 1) + (90n + 10 - 9n - 10) = 10(10^{n} - 9n - 1) + 81n$. The first term is divisible by $9$ by the inductive hypothesis and the second because $81n = 9 \cdot 9n$, so the sum is divisible by $9$. By induction the claim holds for all $n \ge 0$.'
      solution_sketch: 'Peel one factor of $10$ off the exponential and repair the linear part; the correction term $81n$ is a multiple of $9$.'
    anki_seeds:
      - front: 'Key rewrite for proving $d \mid (a^n - 1)$ by induction (where $d = a - 1$)?'
        back: '$a^{n+1} - 1 = a(a^n - 1) + (a - 1)$.'
        type: basic
      - front: 'Shape of the inductive step in a divisibility proof?'
        back: 'Write the $(n+1)$-case as a combination of the $n$-case and an explicit multiple of the divisor.'
        type: basic

  - id: induction-inequality-proofs
    name: "Inequalities by Induction"
    core: true
    difficulty: 0.60
    drill: false
    answer_kind: proof
    expected_time_secs: 240
    prerequisites:
      - id: induction-template
        weight: 0.6
        key: true
      - id: summation-notation
        weight: 0.2
        key: false
    knowledge_points:
      - id: kp1
        name: "Linear vs. exponential growth"
        key_prerequisites: [induction-template]
        exemplars:
          - problem: "To prove the claim n < 2^n for all n >= 1 by induction, the inductive step must bound the new left side n + 1 by a multiple of n, using n >= 1. Give that bound as an expression in n."
            answer: "2n"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The hypothesis gives n < 2^n. Since n >= 1, we have 1 <= n, so adding n to both sides gives n + 1 <= n + n. The bound on the new left side is therefore 2n, which is then compared with 2 * 2^n = 2^(n+1). The answer is 2n."
          - problem: "To prove 2n + 1 <= 2^n for all n >= 3 by induction, write the new left side as 2(n+1) + 1 = (2n + 1) + c with a constant c. Give the constant c."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Expand the left side at n + 1: 2(n+1) + 1 = 2n + 3. Isolate the previous case: 2n + 3 = (2n + 1) + 2, so the added amount is c = 2. In the full step this amount is absorbed because 2 <= 2^n. The answer is 2."
          - problem: "The claim 3n + 1 <= 2^n holds for all n >= 4, and the base case is n = 4. The proof checks the gap 2^4 - (3*4 + 1). Give the value of that gap."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Evaluate the base case at n = 4: the left side is 3*4 + 1 = 13 and the right side is 2^4 = 16. Compute the gap: 16 - 13 = 3. A positive gap confirms the base case before the inductive step begins. The answer is 3."
          - problem: "A student wants to prove 5n + 1 <= 2^n by induction and must take the base case to be the smallest n >= 1 for which the claim is true. Give that smallest n."
            answer: "5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Test the claim from n = 1 upward: at n = 4 the left side is 21 and 2^4 = 16, so the claim fails; at n = 5 the left side is 26 and 2^5 = 32, so it holds. The base case is the smallest such n. The answer is 5."
          - problem: "Claim: n + 1 <= 2^n for all n >= 1. Step 1: for n = 1 the claim reads 2 <= 2. Step 2: assume k + 1 <= 2^k for some k >= 1. Step 3: adding 2 to both sides gives k + 2 <= 2^k + 2. Step 4: since 2 <= 2^k, we get 2^k + 2 <= 2^k + 2^k = 2^(k+1). Step 5: therefore k + 2 <= 2^(k+1), completing the step. Which step is the first step that is not valid?"
            answer: "Step 3"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"], ["Step 5"]]}
            solution_sketch: "Step 1 is a correct base case. Step 2 states the induction hypothesis. Step 3 is the error: the claim gains 1 on the left side, so one must add 1, not 2; adding 2 does not follow from the hypothesis. Step 4 is a valid estimate of 2^k + 2 but rests on the wrong line. Step 5 is a valid conclusion from the earlier steps. The first invalid step is Step 3."
          - problem: "In the inductive step for the claim 3n + 1 <= 2^n, the proof reaches (3n + 1) + 3 and needs the next line (3n + 1) + 3 <= ?. Select the line that follows from the hypothesis by adding 3 to both sides."
            answer: "$2^n + 3$"
            answer_contract: {"kind": "label", "options": [["$2^n + 3$"], ["$2^n + 1$"], ["$2^n - 3$"], ["$2^(n+1)$"]]}
            solution_sketch: "From the hypothesis 3n + 1 <= 2^n, add 3 to both sides: 3n + 4 <= 2^n + 3, and the left side is 3(n+1) + 1. The option 2^n + 1 adds only 1 instead of the added amount 3. The option 2^n - 3 has a sign error. The option 2^(n+1) uses the next power without the needed justification that 3 <= 2^n. The answer is $2^n + 3$."
          - problem: "Write the full proof: for all n >= 2, n + 1 < 2^n. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Base case: at n = 2 the left side is 3 and the right side is 4, so 3 < 4. Inductive hypothesis: assume k + 1 < 2^k for some k >= 2. Inductive step: add 1 to both sides to get k + 2 < 2^k + 1. Since k >= 2 we have 1 < 2^k, so 2^k + 1 < 2^k + 2^k = 2^(k+1). Chaining the two inequalities gives k + 2 < 2^(k+1), which is the claim for n = k + 1. Conclusion: by the induction template, n + 1 < 2^n holds for every n >= 2."
        constraints: "bound the added amount by a copy of the exponential term"
      - id: kp2
        name: "Polynomial vs. exponential and factorial"
        key_prerequisites: [induction-template]
        exemplars:
          - problem: "To prove 2^n > n^2 by induction, the base must be large enough for the step inequality 2n^2 >= (n+1)^2 to hold for every later n. Find the smallest integer N >= 1 such that 2^N > N^2 and 2n^2 >= (n+1)^2 holds for every n >= N."
            answer: "5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Full statement: 2^n > n^2 for every n >= 5. Step 1, base check by substitution: N = 4 gives 2^4 = 16 and 4^2 = 16, so the strict inequality fails, while N = 5 gives 32 > 25. Step 2, step bound by algebra: 2n^2 - (n+1)^2 = n^2 - 2n - 1, which is nonnegative for every n >= 3 and so for every n >= 5. The answer is 5."
          - problem: "For the induction that proves the factorial of n is at least 2^(n-1) for every n >= 1, the base value n = 1 gives two equal sides. Find the smallest integer n >= 1 for which the factorial of n is strictly larger than 2^(n-1)."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Full claim: the factorial of n is at least 2^(n-1) for every n >= 1. Step 1, base values by substitution: n = 1 gives 1 and 1, so the sides are equal and the strict inequality fails, and n = 2 gives 2 and 2, equal again. Step 2, next base value: n = 3 gives 6 and 4, so the strict inequality holds from there. The answer is 3."
          - problem: "In the step of the induction that proves 3^n > n^3 one needs 3n^3 >= (n+1)^3. Expand the difference 3n^3 - (n+1)^3. Give the resulting polynomial in n."
            answer: "2n^3-3n^2-3n-1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Full object: the difference 3n^3 - (n+1)^3, the quantity that decides the step for 3^n > n^3. Step 1, expand the cube by the binomial rule: (n+1)^3 = n^3 + 3n^2 + 3n + 1. Step 2, subtract this from 3n^3 and collect like terms: 3n^3 - (n+1)^3 = 2n^3 - 3n^2 - 3n - 1. The answer is 2n^3-3n^2-3n-1."
          - problem: "A student claims that 2^n > n^3 for every n >= 1 and checks only the first value. Find the smallest n >= 1 for which the claim is false."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Full claim: 2^n > n^3 for every n >= 1. Step 1, test the base value by substitution: n = 1 gives 2^1 = 2 and 1^3 = 1, so the claim holds there. Step 2, test the next value: n = 2 gives 2^2 = 4 and 2^3 = 8, so the claim fails from here. The answer is 2."
          - problem: "The claim is that 4^n > n^3 for every n >= 1. Step 1: for n = 1, 4 > 1. Step 2: suppose 4^k > k^3 for some k >= 1. Step 3: 4^(k+1) = 4 times 4^k > 4k^3 >= (k+1)^3. Step 4: hence 4^(k+1) > (k+1)^3. Which step is the first step that fails?"
            answer: "Step 3"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "Step 1 is a correct base check by substitution: at n = 1 the claim reads 4 > 1. Step 2 is the induction hypothesis, stated correctly. Step 3 is the first invalid step: the bound 4k^3 >= (k+1)^3 fails at k = 1, because 4 >= 8 is false, and the step must hold for every k >= 1. Step 4 would follow only from a corrected Step 3 with a larger base. The answer is Step 3."
          - problem: "The claim is that the factorial of n is greater than 2^n for every n >= N. Find the smallest integer N >= 1 such that the factorial of n is greater than 2^n for every n >= N."
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Full claim: the factorial of n is greater than 2^n for every n >= N. Step 1, base values by substitution: n = 3 gives 6 and 8, so the claim fails, while n = 4 gives 24 and 16, so it holds. Step 2, step bound by comparison: (n+1) times 2^n >= 2 times 2^n = 2^(n+1) for every n >= 1, because n + 1 >= 2. The answer is 4."
          - problem: "Write the full proof: for all n >= 6, the factorial of n is greater than n times 2^n. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Base case: at n = 6 the factorial of 6 is 720 and 6 times 2^6 is 384, so 720 > 384 and the base case holds. Induction hypothesis: assume the factorial of k is greater than k times 2^k for one integer k >= 6. Step: the factorial of k + 1 equals (k + 1) times the factorial of k, and by the hypothesis this is greater than (k + 1) times k times 2^k. Since k >= 6, the factor k is at least 2, so (k + 1) times k times 2^k is at least (k + 1) times 2 times 2^k, which equals (k + 1) times 2^(k+1). Combining the two bounds shows that the factorial of k + 1 is greater than (k + 1) times 2^(k+1). Conclusion: the base case holds and the step is valid, so by induction the factorial of n is greater than n times 2^n for every n >= 6."
        constraints: "verify the base is large enough; bound the step algebraically"
      - id: kp3
        name: "Bernoulli and harmonic bounds"
        key_prerequisites: [induction-template]
        exemplars:
          - problem: "In the inductive step for Bernoulli's inequality, expand the product (1 + kx)(1 + x). For k = 4 and x = 2, find the value of the extra term kx^2 that appears."
            answer: "16"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The product is (1 + kx)(1 + x) = 1 + (k+1)x + kx^2. Substitute k = 4 and x = 2: kx^2 = 4 * 2^2 = 16. The nonnegative extra term is 16."
          - problem: "In the harmonic block proof, the new terms from 2^k + 1 to 2^{k+1} are each at least 1/2^{k+1}. Give the least amount by which the sum increases."
            answer: "1/2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The block from 2^k + 1 to 2^{k+1} has 2^k new terms. Each new term is at least 1/2^{k+1}, so the total added amount is at least 2^k * 1/2^{k+1} = 1/2. The least increase is 1/2."
          - problem: "In Bernoulli's inequality proof, after using the hypothesis, the next line multiplies both sides by a factor. For x = 1/4, give the value of this factor as a fraction."
            answer: "5/4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The factor is 1 + x. For x = 1/4, the factor is 1 + 1/4 = 5/4. A nonnegative factor keeps the inequality direction. The value is 5/4."
          - problem: "A student claims that (1 + x)^n >= 1 + nx holds for every real x and every integer n >= 1, and tests the claim with x = -3. Give the smallest n >= 1 for which the claim is false."
            answer: "5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Test each case by direct computation: for x = -3 the left side is (-2)^n and the right side is 1 - 3n. Check n = 1: -2 >= -2 holds; n = 2: 4 >= -5 holds; n = 3: -8 >= -8 holds; n = 4: 16 >= -11 holds. Check n = 5: -32 >= -14 fails, so the claim breaks at n = 5. The step of the proof needs the factor 1 + x >= 0, and 1 + (-3) = -2 is negative, so the induction fails for this x. The smallest n for which the claim is false is 5."
          - problem: "Claim: for all n >= 0, sum_{i=1}^{2^n} 1/i >= 1 + n/2. Step 1: for n = 0, the sum is 1 and the bound is 1. Step 2: assume the claim holds for n. Step 3: the step from 2^n + 1 to 2^{n+1} adds 2^n terms, and each new term is at least 1/2^n. Step 4: the added amount is at least 2^n * 1/2^n = 1, so the bound holds for n + 1. Which step is the first invalid step?"
            answer: "Step 3"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "Step 1 is a valid base case, so it is not the first invalid step. Step 2 is the valid induction hypothesis, so it is not the answer. Step 3 is false: each new term is at least 1/2^{n+1}, not 1/2^n. Step 4 uses that false lower bound. The answer is Step 3."
          - problem: "In the inductive step for Bernoulli's inequality, the product (1 + kx)(1 + x) expands to which line? Select the missing line."
            answer: "1+(k+1)x+kx^2"
            answer_contract: {"kind": "label", "options": [["1+(k+1)x+kx^2"], ["1+(k+1)x-kx^2"], ["1+(k+1)x"], ["1+(k+1)x+x^2"]]}
            solution_sketch: "The product is (1 + kx)(1 + x) = 1 + (k+1)x + kx^2. The option 1+(k+1)x omits the nonnegative term kx^2. The option 1+(k+1)x-kx^2 has the wrong sign on that term. The option 1+(k+1)x+x^2 forgets the factor k. The answer is 1+(k+1)x+kx^2."
          - problem: "Write the full proof: for all n >= 1, sum_{i=1}^{2^n} 1/i >= 1 + n/2. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Base case: n = 1 gives sum from i=1 to 2 of 1/i = 1 + 1/2 = 3/2, and 1 + 1/2 = 3/2, so the inequality holds. Induction hypothesis: assume sum from i=1 to 2^k of 1/i >= 1 + k/2 for some k >= 1. Step: the sum to 2^{k+1} adds the terms from i = 2^k + 1 to 2^{k+1}. There are 2^k new terms, and each is at least 1/2^{k+1}. Therefore the added amount is at least 2^k * 1/2^{k+1} = 1/2. By the induction hypothesis, the new sum is at least 1 + k/2 + 1/2 = 1 + (k+1)/2. This is the desired bound for k+1. Conclusion: by induction, the inequality holds for all n >= 1."
        constraints: "multiplying inequalities requires a nonnegative factor; block-bounding for harmonic sums"
    diagnostic_exemplar:
      problem: 'Prove by induction: for all $n \ge 1$, $\displaystyle\sum_{i=1}^{n} \frac{1}{i^2} \le 2 - \frac{1}{n}$.'
      answer: 'Base $n = 1$: the sum is $1$ and $2 - \tfrac11 = 1$, so the inequality holds (with equality). Step: assume $\sum_{i=1}^{n} \frac{1}{i^2} \le 2 - \frac{1}{n}$. Then $\sum_{i=1}^{n+1} \frac{1}{i^2} \le 2 - \frac{1}{n} + \frac{1}{(n+1)^2}$, so it suffices that $\frac{1}{(n+1)^2} \le \frac{1}{n} - \frac{1}{n+1} = \frac{1}{n(n+1)}$ — true because $(n+1)^2 > n(n+1)$ for $n \ge 1$. Hence $\sum_{i=1}^{n+1} \frac{1}{i^2} \le 2 - \frac{1}{n+1}$, and the claim follows by induction.'
      solution_sketch: 'Add the new term to the inductive bound and check it fits inside the gap $\frac1n - \frac{1}{n+1}$.'
    anki_seeds:
      - front: 'Bernoulli''s inequality?'
        back: '$(1 + x)^n \ge 1 + nx$ for every real $x \ge -1$ and integer $n \ge 1$.'
        type: basic
      - front: 'Common trick in the step of an exponential inequality induction?'
        back: 'Write $2^{n+1} = 2 \cdot 2^n$ and absorb the added amount into the extra factor.'
        type: basic

  - id: mathematical-induction
    name: "Mathematical Induction"
    core: true
    difficulty: 0.62
    drill: false
    answer_kind: proof
    expected_time_secs: 240
    prerequisites:
      - id: induction-summation-proofs
        weight: 0.5
        key: true
      - id: induction-inequality-proofs
        weight: 0.4
        key: true
      - id: induction-divisibility-proofs
        weight: 0.4
      - id: quantifiers
        weight: 0.2
    knowledge_points:
      - id: kp1
        name: "Products and factorials"
        key_prerequisites: [induction-summation-proofs]
        exemplars:
          - problem: "For the identity sum from i=1 to n of i times i factorial = (n+1) factorial minus 1, assume it holds for n. In the induction step, add the next term (n+1)(n+1) factorial and factor (n+1) factorial out of the first two pieces. Give the factor that multiplies (n+1) factorial before the minus 1."
            answer: "n+2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Start with the hypothesis sum from i=1 to n of i times i factorial = (n+1) factorial minus 1. Add the next term: (n+1) factorial minus 1 plus (n+1)(n+1) factorial. Factor the common piece (n+1) factorial: (n+1) factorial times the bracket, then minus 1. The bracket is 1 plus (n+1), which simplifies to n+2. The factor is n+2."
          - problem: "For the product identity from k=2 to n of (1 - 1/k) = 1/n, assume it holds for n. Multiply the hypothesis by the next factor (1 - 1/(n+1)) and simplify. Give the resulting right side as a function of n."
            answer: "1/(n+1)"
            answer_contract: {"kind": "function", "vars": ["n"]}
            solution_sketch: "Start with the hypothesis product from k=2 to n of (1 - 1/k) = 1/n. The next factor is 1 - 1/(n+1) = n/(n+1). Multiply: (1/n) times n/(n+1). Cancel n to get 1/(n+1). The resulting right side is 1/(n+1)."
          - problem: "Use the identity that for every n at least 2, the product from k=2 to n of (1 - 1/k^2) equals (n+1)/(2n). Evaluate the base case n=2. Give the value as a fraction."
            answer: "3/4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "At n=2 the product has one factor: 1 - 1/2^2. Compute 1/4 and subtract from 1. The result is 3/4. The base value is 3/4."
          - problem: "For the identity that the product from k=2 to n of (1 - 1/k^2) equals (n+1)/(2n), assume it holds for n. Multiply by the next factor (1 - 1/(n+1)^2) and simplify. Give the simplified right side as a function of n."
            answer: "(n+2)/(2n+2)"
            answer_contract: {"kind": "function", "vars": ["n"]}
            solution_sketch: "Start with the hypothesis (n+1)/(2n). The next factor is 1 - 1/(n+1)^2 = (n(n+2))/(n+1)^2. Multiply: (n+1)/(2n) times n(n+2)/(n+1)^2. Cancel n+1 and n to get (n+2)/(2(n+1)), which is (n+2)/(2n+2). The simplified right side is (n+2)/(2n+2)."
          - problem: "Claim: for all n at least 1, the product from k=1 to n of (1 + 1/k) equals n+1. Step 1: for n=1, the product is 2. Step 2: assume the claim for n=m. Step 3: the product up to m+1 equals (m+1) plus (1 + 1/(m+1)). Step 4: the right side simplifies to m+2, so the claim holds for m+1. Which step is the first step that is not valid?"
            answer: "Step 3"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "Step 1 is a correct base case because 1 + 1/1 = 2. Step 2 is the legal hypothesis. Step 3 is invalid because the next product is obtained by multiplying by 1 + 1/(m+1), not by adding that factor. Step 4 uses the invalid Step 3, so it cannot repair the proof. The answer is Step 3."
          - problem: "In the proof that the product from k=1 to n of k/(k+1) equals 1/(n+1), the inductive-step line for n=k+1 is missing after applying the hypothesis and multiplying by the next factor. Select the missing right side."
            answer: "1/(k+2)"
            answer_contract: {"kind": "label", "options": [["1/(k+2)"], ["1/(k+1)"], ["(k+1)/(k+2)"], ["1/(k(k+2))"]]}
            solution_sketch: "The hypothesis gives the product up to k as 1/(k+1). The next factor is 1 - 1/(k+2) = (k+1)/(k+2). Multiply 1/(k+1) by (k+1)/(k+2), and cancel k+1. The missing right side is 1/(k+2). Option 1/(k+1) forgets the next factor. Option (k+1)/(k+2) is only the factor, not the product. Option 1/(k(k+2)) has an extra k in the denominator. The answer is 1/(k+2)."
          - problem: "Write the full proof: for all n at least 1, the product from k=1 to n of (k+2)/k equals (n+1)(n+2)/2. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Base case: for n=1 the left side is (1+2)/1 = 3, and the right side is (2 times 3)/2 = 3, so the identity holds. Hypothesis: assume for one n=m that the product from k=1 to m of (k+2)/k equals (m+1)(m+2)/2. Inductive step: multiply both sides by the next factor, (m+3)/(m+1). The right side becomes (m+1)(m+2)/2 times (m+3)/(m+1). Cancel m+1 to get (m+2)(m+3)/2. This is exactly the formula for n=m+1, since it equals ((m+1)+1)((m+1)+2)/2. Conclusion: by induction the product identity holds for all n at least 1."
        constraints: "factorial and telescoping-product identities; factor the common piece in the step"
      - id: kp2
        name: "Induction on counting and geometry"
        key_prerequisites: [induction-summation-proofs]
        exemplars:
          - problem: "An induction proof shows that a set with n elements has exactly 2^n subsets. In the inductive step, one new element x is added to a set with 7 elements, and every old subset is paired with a copy that contains x. How many subsets does the resulting set have?"
            answer: "256"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Full object: before the step, a set of 7 elements has 2^7 = 128 subsets by the hypothesis. Rule of the step: each old subset is paired with the same subset plus the new element x, a combinatorial doubling. Compute: 2 times 128 = 256. The answer is 256."
          - problem: "An induction proof shows that n lines in general position, with no two parallel and no three through one point, divide the plane into (n^2 + n + 2)/2 regions. How many regions do 8 such lines create?"
            answer: "37"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Full object: the region count is (n^2 + n + 2)/2 regions. Rule of the step: the 8th line meets the 7 earlier lines in 7 distinct points, is cut into 8 pieces, and each piece splits one region in two, so 8 regions are added. Compute: (49 + 7 + 2)/2 + 8 = 29 + 8 = 37. The answer is 37."
          - problem: "An induction proof counts handshakes: when each pair among n people shakes hands once, the k-th person to arrive adds one handshake with every person already there. At a gathering of 10 people, how many handshakes does the 10th arrival add?"
            answer: "9"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Full object: the total for 10 people is the sum 1 + 2 + ... + 9, built one arrival at a time. Rule of the step: the 10th person to arrive shakes hands once with each person already present, which adds one handshake per person already there. Count: 9 people are already present, so the arrival adds 9. The answer is 9."
          - problem: "An induction proof shows that a convex polygon with n sides can be divided into n - 2 triangles by diagonals from one fixed vertex. The step cuts off one triangle and leaves a polygon with one side fewer, starting from a single triangle. How many triangles does a convex 12-gon give?"
            answer: "10"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Full object: T(n) = n - 2 triangles, with base case T(3) = 1 for a triangle. Rule of the step: one diagonal from the fixed vertex of the 12-gon cuts off one triangle and leaves an 11-gon, so each new side adds exactly one triangle, a geometric splitting argument. Compute: T(12) = 12 - 2 = 10. The answer is 10."
          - problem: "Claim: a set with n elements has 2^n subsets. Step 1: the empty set has exactly one subset, itself. Step 2: assume a set with n elements has 2^n subsets. Step 3: for a set S with n + 1 elements, fix x in S; the subsets avoiding x are exactly the subsets of S without x, so there are 2^n of them. Step 4: each subset avoiding x gives one subset containing x, so S has 2^n subsets in total. Which step is the first step that is not valid?"
            answer: "Step 4"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "Read the full argument first: the claim is that a set with n elements has 2^n subsets. Step 1 is a valid base case. Step 2 is the standard induction hypothesis, valid. Step 3 is correct: the subsets avoiding x are exactly the subsets of S without x, and there are 2^n of them by the hypothesis. Step 4 is not valid: the subsets containing x add another 2^n, so the total is 2^n + 2^n = 2^(n+1), not 2^n. The answer is Step 4."
          - problem: "An induction proof counts all the subsets of a finite set. It fixes one element x and sorts them into two classes of the same size. Which sorting does the proof use?"
            answer: "those omitting x and those containing x"
            answer_contract: {"kind": "label", "options": [["those omitting x and those containing x"], ["the singletons and all the rest"], ["the empty one and the full one"], ["the even ones and the odd ones"]]}
            solution_sketch: "Full object: the subsets of a set of size n + 1, sorted by the element x. Rule of the step: pairing each subset without x against the same subset with x gives two classes of equal size 2^n, which is exactly the combinatorial doubling. The option 'the singletons and all the rest' is an error: it counts by size, and the two classes are not equal. The option 'the empty one and the full one' is an error: it names only two subsets, not a sorting of all of them. The option 'the even ones and the odd ones' is an error: parity of size is not the membership pairing that the doubling uses. The answer is those omitting x and those containing x."
          - problem: "Write the full proof: n lines in the plane in general position divide it into (n^2 + n + 2)/2 regions. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Base case: with n = 0 lines the plane is one region, and (0 + 0 + 2)/2 = 1, so the claim holds. Hypothesis: assume k lines in general position divide the plane into (k^2 + k + 2)/2 regions. Step: add the (k+1)-st line. It meets the k old lines in k distinct points, and these points cut the new line into k + 1 pieces; each piece lies inside one region and splits it into two, so exactly k + 1 new regions appear. This is the geometric counting core of the argument. Compute: (k^2 + k + 2)/2 + (k + 1) = (k^2 + 3k + 4)/2 = ((k+1)^2 + (k+1) + 2)/2. Conclusion: the claim holds for k + 1, so by induction it holds for all n >= 0."
        constraints: "the step must argue combinatorially or geometrically, not just algebraically"
      - id: kp3
        name: "Pitfalls and thresholds"
        key_prerequisites: [induction-inequality-proofs]
        exemplars:
          - problem: "In the usual induction that every group of horses has one color, the step from a group of size n to a group of size n+1 splits the larger group into two groups of size n. Give the least n for which those two groups can have an empty overlap."
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full object is the horses induction step. Step 1 (overlap test): with n = 1, the two groups of size 1 are singleton horses, so their overlap is empty. Step 2 (comparison): with n = 2, two pairs from three horses share the middle horse, so the overlap is nonempty. Therefore the first failure of the step is at n = 1. The least n is 1."
          - problem: "The inequality n! > 3^n is false for small n but true from some point on. Find the least integer n0 such that the inequality holds for every n >= n0."
            answer: "7"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full object is the threshold for n! > 3^n. Step 1 (base check): n = 6 gives 720 < 729, so the inequality fails. Step 2 (base check): n = 7 gives 5040 > 2187, so it holds. Step 3 (inductive step): for n >= 7, (n+1)! = (n+1)n! > 3*3^n = 3^(n+1) because n+1 > 3. The least threshold is 7."
          - problem: "A student claims that 3^n > n^3 for all n >= 1. Give the smallest n >= 1 for which the claim is false."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full object is the claim 3^n > n^3 for all n >= 1. Step 1 (test): n = 1 gives 3 > 1 and n = 2 gives 9 > 8. Step 2 (test): n = 3 gives 27 > 27, which is false. The first failure is at n = 3. The smallest counterexample is 3."
          - problem: "In the inductive step for proving 4 divides 5^n - 1, write 5^(n+1) - 1 = 5(5^n - 1) + r. Give the constant r."
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full object is the identity 5^(n+1) - 1 = 5(5^n - 1) + r. Step 1 (expand): 5(5^n - 1) = 5^(n+1) - 5. Step 2 (solve for r): compare 5^(n+1) - 5 + r with 5^(n+1) - 1, so r = 4. The constant is 4."
          - problem: "Claim: 3 divides n^2 + n + 1 for all n >= 1. Step 1: base n = 1 gives 3. Step 2: assume 3 divides k^2 + k + 1. Step 3: (k+1)^2 + (k+1) + 1 = (k^2 + k + 1) + (2k + 2). Step 4: since 3 divides both terms, 3 divides the sum. Which step is the first step that is not valid?"
            answer: "Step 4"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "The full object is the claimed induction for 3 divides n^2 + n + 1. Step 1 (base case): n = 1 gives 3, so Step 1 is correct. Step 2 (hypothesis): Step 2 states the assumption and is correct. Step 3 (algebra): the expansion to (k^2+k+1) + (2k+2) is correct. Step 4 (divisibility): Step 4 claims 3 divides 2k+2 for every k, which fails at k = 1 because 2k+2 = 4. The answer is Step 4."
          - problem: "For the induction that n! > 2^n for all n >= 4, evaluate n! - 2^n at the base n = 4. Give the value."
            answer: "8"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full object is the base case value 4! - 2^4. Step 1 (factorial): 4! = 24. Step 2 (power): 2^4 = 16. Step 3 (subtract): 24 - 16 = 8. The value is 8."
          - problem: "Write the full proof: for all integers n >= 5, 2^n > n^2. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "The full object is the statement: for all integers n >= 5, 2^n > n^2. Step 1 (base case): n = 5 gives 2^5 = 32 and 5^2 = 25, so 32 > 25. Step 2 (hypothesis): assume 2^k > k^2 for some k >= 5. Step 3 (inductive step): multiply the hypothesis by 2 to get 2^(k+1) > 2k^2. Since k >= 5, we have k^2 > 2k + 1, so 2k^2 > k^2 + 2k + 1 = (k+1)^2. Therefore 2^(k+1) > (k+1)^2. Step 4 (conclusion): by induction, 2^n > n^2 for every n >= 5."
        constraints: "diagnose a broken step or find the correct starting threshold before proving"
    diagnostic_exemplar:
      problem: 'Find the least integer $n_0$ such that $2^{n} > n^{3}$ holds for all $n \ge n_0$, and prove it by induction.'
      answer: '$n_0 = 10$: the inequality fails at $n = 9$ ($512 < 729$) and holds at $n = 10$ ($1024 > 1000$), which serves as the base case. Step: assume $2^{n} > n^{3}$ for some $n \ge 10$. Then $2^{n+1} = 2 \cdot 2^{n} > 2n^{3}$, and $2n^{3} \ge (n+1)^{3}$ because $(n+1)^{3} = n^{3}\left(1 + \tfrac1n\right)^{3} \le n^{3}(1.1)^{3} = 1.331\,n^{3} < 2n^{3}$ for $n \ge 10$. Hence $2^{n+1} > (n+1)^{3}$, and by induction the inequality holds for every $n \ge 10$.'
      solution_sketch: 'Test small values to locate the threshold (it fails at $9$, holds at $10$), then induct, bounding $(1 + 1/n)^3$ below $2$ for $n \ge 10$.'
    anki_seeds:
      - front: 'The two parts of a proof by induction?'
        back: 'Base case (verify $P(n_0)$) and inductive step (assume $P(n)$, prove $P(n + 1)$).'
        type: basic
      - front: 'The flaw in the "all horses are the same color" induction?'
        back: 'The inductive step needs the two overlapping groups to intersect, which fails going from $n = 1$ to $n = 2$.'
        type: basic

  - id: strong-induction
    name: "Strong Induction"
    core: true
    difficulty: 0.65
    drill: false
    answer_kind: proof
    expected_time_secs: 240
    prerequisites:
      - id: mathematical-induction
        weight: 0.7
        key: true
      - id: quantifiers
        weight: 0.2
      - id: prime-composite-numbers
        weight: 0.2
        key: false
    knowledge_points:
      - id: kp1
        name: "Recurrences needing earlier cases"
        key_prerequisites: [mathematical-induction]
        exemplars:
          - problem: "A sequence has a_1 = 1, a_2 = 5 and a_n = 5a_{n-1} - 6a_{n-2}. In the strong induction step, the hypothesis gives a_{n-1} = 3^{n-1} - 2^{n-1} and a_{n-2} = 3^{n-2} - 2^{n-2}, and the step rewrites 5a_{n-1} - 6a_{n-2} as 3^{n-2}A - 2^{n-2}B. Give A and B."
            answer: "A = 9; B = 4"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "A"}, {"contract": {"kind": "exact"}, "name": "B"}]}
            solution_sketch: "Full rewrite first: 5a_{n-1} - 6a_{n-2} = 9*3^{n-2} - 4*2^{n-2} = 3^n - 2^n. Expand each hypothesis term by the substitution rule: 5*3^{n-1} = 15*3^{n-2} and 5*2^{n-1} = 10*2^{n-2}. Collect like terms by the factoring rule: A = 15 - 6 = 9 and B = 10 - 6 = 4, which lands exactly on the claimed form 3^n - 2^n. The answer is A = 9; B = 4."
          - problem: "A sequence has b_1 = 2, b_2 = 4 and b_n = 2b_{n-1} - b_{n-2} for n ≥ 3, and a proof by strong induction claims that b_n = 2n. Each new term needs the two earlier cases. Compute b_5."
            answer: "10"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Work forward with the recurrence rule: b_3 = 2*4 - 2 = 6, then b_4 = 2*6 - 4 = 8, then b_5 = 2*8 - 6 = 10. The value matches the claimed formula 2n at n = 5, and each step invoked both earlier cases, as the strong hypothesis supplies them. The answer is 10."
          - problem: "A count of block designs satisfies c_1 = 1, c_2 = 3 and c_n = c_{n-1} + c_{n-2} for n ≥ 3. A strong induction proof of a formula for c_n must invoke the hypothesis at the two earlier cases. Find c_6."
            answer: "18"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Apply the recurrence rule at each new index: c_3 = 3 + 1 = 4, c_4 = 4 + 3 = 7, c_5 = 7 + 4 = 11, c_6 = 11 + 7 = 18. Every term needs both earlier cases, which is exactly why the proof uses two base cases and a hypothesis at n - 1 and n - 2. The answer is 18."
          - problem: "A student claims that the sequence with d_1 = 3, d_2 = 5 and d_n = d_{n-1} + d_{n-2} for n ≥ 3 satisfies d_n = 2n + 1 for all n ≥ 1, and verifies the two base cases. Give the smallest n ≥ 1 for which the claim fails."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Test the next case with the recurrence rule: d_3 = d_2 + d_1 = 5 + 3 = 8. The claimed formula gives 2*3 + 1 = 7 at n = 3, and 8 is not 7. Two true base cases never replace the inductive step, so the first failure is at n = 3. The answer is 3."
          - problem: "Claim: a sequence with a_1 = 2, a_2 = 8 and a_n = 4a_{n-1} - 4a_{n-2} satisfies a_n = n*2^n for all n ≥ 1. Step 1: base case n = 1, a_1 = 2 = 1*2. Step 2: base case n = 2, a_2 = 8 = 2*4. Step 3: assume a_k = k*2^k for every k < n, where n ≥ 3. Step 4: a_n = 4a_{n-1} - 4a_{n-2} = 4(n-1)2^{n-1} - (n-2)2^{n-2}. Step 5: this equals 2^{n-2}(8(n-1) - (n-2)), which is n*2^n. Which step is the first step that is not valid?"
            answer: "Step 4"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"], ["Step 5"]]}
            solution_sketch: "Step 1 and Step 2 are the two correct base cases at n = 1 and n = 2. Step 3 is a valid strong hypothesis, covering both n - 1 and n - 2. Step 4 drops the coefficient 4 from the second term; the correct line is 4(n-2)2^{n-2}. Step 5 is wrong only because it inherits the slip of Step 4. The answer is Step 4."
          - problem: "A proof by strong induction shows that a sequence with e_1 = 3, e_2 = 7 and e_n = 2e_{n-1} - e_{n-2} for n ≥ 3 satisfies e_n = 2n + 1 for all n ≥ 1. In the step, the hypothesis is applied to the second earlier case, giving a line of the form e_{n-2} = ?. Select the true line."
            answer: "2n - 3"
            answer_contract: {"kind": "label", "options": [["2n - 3"], ["2n - 2"], ["2n"], ["n - 2"]]}
            solution_sketch: "The claimed form is e_k = 2k + 1, so the hypothesis at the second earlier case gives e_{n-2} = 2(n - 2) + 1 = 2n - 4 + 1 = 2n - 3. The option 2n - 2 shifts the index by only 1 instead of 2; the option 2n forgets the shift to the earlier case; the option n - 2 drops the form 2k + 1 entirely. The answer is 2n - 3."
          - problem: "Write the full proof: for all n ≥ 1, the sequence with g_1 = 4, g_2 = 9 and g_n = 2g_{n-1} - g_{n-2} for n ≥ 3 satisfies g_n = 5n - 1. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Base cases: g_1 = 4 = 5*1 - 1 and g_2 = 9 = 5*2 - 1, so the formula holds at both starting points, and two base cases are required because the recurrence reaches back two steps. Hypothesis: assume g_k = 5k - 1 for every k < n, where n ≥ 3; this hypothesis covers the two earlier cases, n - 1 and n - 2, that the recurrence needs. Step: g_n = 2g_{n-1} - g_{n-2} = 2(5(n - 1) - 1) - (5(n - 2) - 1) = 10n - 12 - 5n + 11 = 5n - 1. The first substituted term uses the hypothesis at n - 1 and the second at n - 2, so the formula holds at n as well. Conclusion: by strong induction with two base cases, g_n = 5n - 1 for every n ≥ 1."
        constraints: "use two base cases; invoke the hypothesis at $n-1$ and $n-2$"
      - id: kp2
        name: "Existence of prime factorizations"
        key_prerequisites: [mathematical-induction]
        exemplars:
          - problem: "In the strong induction proof that every integer n >= 2 is a product of primes, the case n = 35 is composite. Write 35 = a b with 2 <= a <= b < 35 and a as small as possible. Give a."
            answer: "5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The number 35 factors as 5 times 7. The smaller factor a is 5, and the larger factor 7 is less than 35. The strong hypothesis applies to both 5 and 7. The answer is 5."
          - problem: "In the strong induction proof that every integer n >= 2 has a prime divisor, the case n = 91 is composite. Write 91 = a b with 2 <= a <= b < 91 and a as small as possible. Give a."
            answer: "7"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The number 91 factors as 7 times 13. The smaller factor a is 7, and the larger factor 13 is less than 91. The hypothesis then gives a prime divisor of 7, namely 7 itself. The answer is 7."
          - problem: "In the strong induction proof of prime factorization, the base case is the first integer in the range n >= 2. Give the value of that base case."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The claim starts at n = 2 because 0 and 1 are not products of one or more primes. The base case is n = 2, which is prime. The answer is 2."
          - problem: "In the strong induction step for n = 77, write 77 = a b with 2 <= a <= b < 77 and a as small as possible. Give b."
            answer: "11"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The number 77 factors as 7 times 11. The smaller factor a is 7, so the larger factor b is 11. Both factors are less than 77, so the strong hypothesis applies to each. The answer is 11."
          - problem: "Claim: every integer n >= 2 is a product of primes. Step 1: 2 is prime. Step 2: assume k >= 2 is a product of primes. Step 3: let n = k + 1; if n is prime, stop. Step 4: otherwise n = a b with 2 <= a, b < n. Step 5: by Step 2, a and b are products of primes. Which step is the first invalid step?"
            answer: "Step 5"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"], ["Step 5"]]}
            solution_sketch: "Step 1 is the correct base case. Step 2 states the weak hypothesis for one value k. Step 3 handles the prime case. Step 4 is the composite split. Step 5 is invalid because Step 2 applies only to k, not to a or b; strong induction needs all smaller values. The answer is Step 5."
          - problem: "In the strong induction step for prime factorization, one line states what may be assumed about smaller integers. Which line is the correct hypothesis?"
            answer: "all m from 2 to n-1 are prime products"
            answer_contract: {"kind": "label", "options": [["all m from 2 to n-1 are prime products"], ["all m from 2 to n are prime products"], ["some m from 2 to n-1 are prime products"], ["n itself is a prime product"]]}
            solution_sketch: "The correct hypothesis is all m from 2 to n-1 are prime products. The option all m from 2 to n are prime products wrongly includes n itself. The option some m from 2 to n-1 are prime products is too weak. The option n itself is a prime product is circular. The answer is all m from 2 to n-1 are prime products."
          - problem: "Write the full proof: every integer n >= 2 is a product of one or more primes. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Base case: n = 2 is prime, so it is a product of one prime. Strong hypothesis: assume every integer m with 2 <= m < n is a product of one or more primes. If n is prime, then n itself is a product of one prime. If n is composite, then n = a b for integers a and b with 2 <= a < n and 2 <= b < n. By the strong hypothesis, a is a product of primes and b is a product of primes. Their product n = a b is therefore a product of the primes from a followed by the primes from b. This proves the claim for n, and by strong induction every integer n >= 2 is a product of one or more primes."
        constraints: "split the number and apply the hypothesis to both smaller factors"
      - id: kp3
        name: "Bounding recursive sequences"
        key_prerequisites: [mathematical-induction]
        exemplars:
          - problem: "Let f_1 = f_2 = 1 and f_n = f_{n-1} + f_{n-2} for n >= 3. In a strong induction proof that f_n < 2^n, the step writes f_n < 2^{n-1} + 2^{n-2} = C * 2^{n-2}. Give C."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "First write the two powers with the common factor 2^{n-2}. Since 2^{n-1} = 2 * 2^{n-2}, the sum is 2 * 2^{n-2} + 1 * 2^{n-2}. Add the coefficients 2 + 1 to get C = 3."
          - problem: "A sequence has b_1 = 3, b_2 = 5, and b_n = 3b_{n-1} - 2b_{n-2} for n >= 3. A proof that b_n = 2^n + 1 uses strong induction. Give b_3."
            answer: "9"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Use the recurrence with n = 3: b_3 = 3b_2 - 2b_1. Substitute the given values: 3 * 5 - 2 * 3 = 15 - 6 = 9. The value is 9."
          - problem: "Let a_1 = 1, a_2 = 2, and a_n = 2a_{n-1} + a_{n-2} for n >= 3. In a strong induction proof that a_n < 3^n, the step writes a_n < 2 * 3^{n-1} + 3^{n-2} = C * 3^{n-2}. Give C."
            answer: "7"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Write both terms with the common factor 3^{n-2}. Since 2 * 3^{n-1} = 6 * 3^{n-2}, the sum is 6 * 3^{n-2} + 1 * 3^{n-2}. Add the coefficients 6 + 1 to get C = 7."
          - problem: "Claim: if f_1 = f_2 = 1 and f_n = f_{n-1} + f_{n-2}, then f_n < 2^n for all n >= 1. Step 1: for n = 1, f_1 = 1 < 2. Step 2: for n = 2, f_2 = 1 < 4. Step 3: assume f_{n-1} < 2^{n-1} and proceed. Step 4: f_n = f_{n-1} + f_{n-2} < 2^{n-1} + 2^{n-2} < 2^n. Which step is the first step that is not valid?"
            answer: "Step 3"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "Step 1 is a correct base case because 1 < 2. Step 2 is a correct base case because 1 < 4. Step 3 is the flaw: the recurrence uses both f_{n-1} and f_{n-2}, so the strong hypothesis must cover all smaller indices, not only f_{n-1}. Step 4 would be valid after that repair. The first invalid step is Step 3."
          - problem: "In the strong induction proof that b_n = 2^n + 1 for b_1 = 3, b_2 = 5, and b_n = 3b_{n-1} - 2b_{n-2}, the step reaches 3(2^{n-1} + 1) - 2(2^{n-2} + 1) = 2^n + C. Give C."
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Expand the step: 3 * 2^{n-1} + 3 - 2 * 2^{n-2} - 2. Since 3 * 2^{n-1} - 2 * 2^{n-2} = 2^n, the variable part is 2^n. The constants give 3 - 2 = 1, so C = 1."
          - problem: "Let a_1 = 1, a_2 = 2, and a_n = 2a_{n-1} + a_{n-2} for n >= 3. In a strong induction proof that a_n < 3^n, give the smallest n for which the inductive step is used."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The recurrence defines a_n from two earlier terms only for n >= 3. The base cases are n = 1 and n = 2. The inductive step therefore starts at n = 3. The smallest such n is 3."
          - problem: "Write the full proof: for the sequence a_1 = 1, a_2 = 2, and a_n = 2a_{n-1} + a_{n-2} for n >= 3, prove a_n < 3^n for all n >= 1. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Base cases: a_1 = 1 < 3^1 = 3 and a_2 = 2 < 3^2 = 9. Strong hypothesis: assume for some n >= 3 that a_k < 3^k for every k < n. Step: use the recurrence to write a_n = 2a_{n-1} + a_{n-2}. Apply the hypothesis to both terms: a_n < 2 * 3^{n-1} + 3^{n-2}. Factor 3^{n-2}: a_n < (6 + 1) * 3^{n-2} = 7 * 3^{n-2}. Since 7 < 9, this is less than 9 * 3^{n-2} = 3^n. Conclusion: the claim holds for n, so by strong induction a_n < 3^n for all n >= 1."
        constraints: "bound each recursive term using the strong hypothesis"
    diagnostic_exemplar:
      problem: 'Prove: every postage amount of $n \ge 12$ cents can be made using only $4$-cent and $5$-cent stamps.'
      answer: 'Base cases $12, 13, 14, 15$; step reduces $n$ to $n - 4 \ge 12$ plus one $4$-cent stamp.'
      solution_sketch: 'Base: $12 = 4+4+4$, $13 = 4+4+5$, $14 = 4+5+5$, $15 = 5+5+5$. Step: for $n \ge 16$, assume every value in $[12, n)$ is makeable; since $n - 4 \ge 12$ is makeable, add one $4$-cent stamp to form $n$. $\square$'
    anki_seeds:
      - front: 'Strong induction hypothesis vs. ordinary induction?'
        back: 'Strong induction assumes $P(k)$ for every $k$ from the base up to $n$, not just $P(n)$.'
        type: basic
      - front: 'When should you use strong induction?'
        back: 'When the next case depends on earlier cases beyond the immediate predecessor (recurrences, prime factorization).'
        type: basic

  - id: wop
    name: "The Well-Ordering Principle"
    core: false                # supplemental: alternative formulation of induction; nothing builds on it
    difficulty: 0.68
    drill: false
    answer_kind: proof
    expected_time_secs: 240
    prerequisites:
      - id: strong-induction
        weight: 0.4
        key: true
      - id: proof-by-contradiction
        weight: 0.4
        key: true
      - id: mathematical-induction
        weight: 0.3
      - id: quantifiers
        weight: 0.0
    knowledge_points:
      - id: kp1
        name: "The minimal-counterexample method"
        key_prerequisites: [proof-by-contradiction]
        exemplars:
          - problem: "Let S be the nonempty set of divisors d >= 2 of 91. By the well-ordering principle S has a least element p. Find p."
            answer: "7"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: form S = {d : d >= 2 and d divides 91}; it is nonempty because 91 is in S. Step 2: by the well-ordering principle, S has a least element p. Step 3: test divisors: 7 divides 91 and no smaller divisor >= 2 does, so p = 7. The least element is 7."
          - problem: "For the claim 1 + 2 + ... + n = n(n+1)/2, suppose it fails and let m be the least counterexample. Since it holds at n = 1, m >= 2. Add m to the formula at m - 1. Give the resulting expression in m as a single fraction."
            answer: "(m^2+m)/2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: by contradiction and the well-ordering principle, take the least counterexample m. Step 2: the claim holds at m - 1, so 1 + ... + (m - 1) = (m - 1)m/2. Step 3: add m: (m - 1)m/2 + m = (m^2 - m + 2m)/2 = (m^2 + m)/2. The resulting expression is (m^2+m)/2."
          - problem: "Let S be the nonempty set of integers n >= 0 for which n^2 + n + 41 is not prime. By the well-ordering principle S has a least element. Find that least element."
            answer: "40"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: form S as the set of n >= 0 where n^2 + n + 41 is composite. Step 2: by the well-ordering principle, S has a least element m. Step 3: check n = 40 gives 40^2 + 40 + 41 = 1681 = 41^2, and no smaller n gives a composite value. The least element is 40."
          - problem: "Claim: 2^n > n^2 for every n >= 1. Step 1: suppose the claim is false and let m be the least counterexample. Step 2: since n = 1 is true, m >= 2. Step 3: by minimality, 2^(m-1) > (m-1)^2. Step 4: multiplying by 2 gives 2^m > 2(m-1)^2, and since 2(m-1)^2 >= m^2 for all m >= 2, we get 2^m > m^2. Which step is the first step that is not valid?"
            answer: "Step 4"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "Step 1 is valid: it sets up the minimal counterexample. Step 2 is valid because n = 1 gives 2 > 1. Step 3 is valid by minimality of m. Step 4 is invalid: the claim 2(m-1)^2 >= m^2 is false for m = 2, since 2 >= 4 is false. The answer is Step 4."
          - problem: "Let S be the nonempty set of divisors d >= 2 of 121. By the well-ordering principle S has a least element p. Determine whether p has exactly two positive divisors and give p."
            answer: "verdict = prime; p = 11"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["prime"], ["composite"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "p"}]}
            solution_sketch: "Step 1: form S; it is nonempty because 121 is in S. Step 2: by the well-ordering principle, S has a least element p. Step 3: 11 divides 121 and no smaller divisor >= 2 does, so p = 11. Step 4: 11 has exactly two positive divisors, 1 and 11, so the verdict is prime. The answer is verdict = prime; p = 11."
          - problem: "For the claim 1^2 + 2^2 + ... + n^2 = n(n+1)(2n+1)/6, suppose it fails and let m be the least counterexample. Since it holds at n = 1, m >= 2. Add m^2 to the formula at m - 1. Give the resulting expression in m as a single fraction."
            answer: "(2m^3+3m^2+m)/6"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: by contradiction and the well-ordering principle, take the least counterexample m. Step 2: the claim holds at m - 1, so 1^2 + ... + (m - 1)^2 = (m - 1)m(2m - 1)/6. Step 3: add m^2: (m - 1)m(2m - 1)/6 + m^2 = (2m^3 - 3m^2 + m + 6m^2)/6 = (2m^3 + 3m^2 + m)/6. The resulting expression is (2m^3+3m^2+m)/6."
          - problem: "Write the full proof: every integer n >= 2 can be written as a product of primes, using the well-ordering principle. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1: Suppose, for contradiction, that some integer n >= 2 is not a product of primes. Let S be the nonempty set of such integers. By the well-ordering principle S has a least element m. Step 2: If m is prime, then m is a product of one prime, a contradiction, so m is composite. Step 3: Write m = ab with integers a and b satisfying 2 <= a < m and 2 <= b < m. Step 4: Since a and b are smaller than m, and m is the least counterexample, both a and b are products of primes. Step 5: Then m = ab is a product of primes, a contradiction. Therefore every integer n >= 2 is a product of primes."
        constraints: "form a nonempty set of naturals and use its least element"
      - id: kp2
        name: "Existence via least elements"
        key_prerequisites: [proof-by-contradiction]
        exemplars:
          - problem: "In the well-ordering proof of the division algorithm, take a = 38 and b = 7. Let S = {38 - 7q : q an integer and 38 - 7q >= 0}. The set S has a least element r. Give r."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "First write the full set S = {38 - 7q : q an integer and 38 - 7q >= 0}. Step 1: S is nonempty because q = 0 gives 38. Step 2: by the well-ordering principle S has a least element r. Step 3: test the nonnegative values: q = 0 gives 38, q = 1 gives 31, q = 2 gives 24, q = 3 gives 17, q = 4 gives 10, q = 5 gives 3, and q = 6 gives -4. The least nonnegative value is 3, so r = 3. The answer is 3."
          - problem: "In the minimal-counterexample proof that every integer at least 2 is a product of primes, the least counterexample m is composite, so m = ab with 2 <= a <= b < m. Give a for m = 91."
            answer: "7"
            answer_contract: {"kind": "exact"}
            solution_sketch: "First write the full object m = 91. Step 1: 91 is not prime because 7 times 13 equals 91. Step 2: the minimal-counterexample proof says the least counterexample, if it existed, must be composite. Step 3: factor 91 as 7 times 13, so a = 7 and b = 13. The answer is 7."
          - problem: "Consider the set S = {n in Z : n > 10 and n = 7k + 3 for some integer k}. The well-ordering principle gives S a least element. Give that least element."
            answer: "17"
            answer_contract: {"kind": "exact"}
            solution_sketch: "First write the full set S = {n in Z : n > 10 and n = 7k + 3 for some integer k}. Step 1: the values of 7k + 3 near 10 are 3, 10, and 17. Step 2: the condition n > 10 removes 3 and 10. Step 3: by the well-ordering principle the least element is 17. The answer is 17."
          - problem: "Let S = {14, 19, 25}. Put T = {s - 10 : s in S}. The well-ordering principle gives T a least element. Give that least element."
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "First write the full set T = {4, 9, 15}. Step 1: subtract 10 from each element of S = {14, 19, 25}. Step 2: the well-ordering principle says T has a least element. Step 3: compare 4, 9, and 15; the least is 4. The answer is 4."
          - problem: "Claim: every integer n at least 2 has a prime divisor. Proof attempt. Step 1: Let S = {m in N : m >= 2 and m has no prime divisor}. Step 2: If S is nonempty, by well-ordering it has a least element m. Step 3: Since m is not prime, m = ab with 2 <= a < b < m. Step 4: By minimality, a has a prime divisor p, and p divides m. Which step is the first invalid step?"
            answer: "Step 3"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "First write the full set S = {m in N : m >= 2 and m has no prime divisor}. Step 1: Step 1 correctly defines the set of possible least counterexamples. Step 2: Step 2 correctly applies the well-ordering principle. Step 3: Step 3 is invalid because a composite number can have equal factors, such as 4 = 2 times 2; the correct line is m = ab with 2 <= a <= b < m. Step 4: Step 4 would be valid after that correction. The answer is Step 3."
          - problem: "In a proof that a nonempty set S of integers bounded below has a least element, let L be a lower bound. Put T = {s - L + 1 : s in S}. By well-ordering T has a least element t. Which expression gives the least element of S?"
            answer: "t + L - 1"
            answer_contract: {"kind": "label", "options": [["t + L - 1"], ["t - L + 1"], ["L - t + 1"], ["t + L + 1"]]}
            solution_sketch: "First write the full set T = {s - L + 1 : s in S}. Step 1: T is nonempty and all its elements are positive. Step 2: by the well-ordering principle T has a least element t. Step 3: since t <= s - L + 1 for every s in S, we get t + L - 1 <= s. Step 4: also t = s0 - L + 1 for some s0 in S, so t + L - 1 = s0 is in S. Thus t + L - 1 is the least element of S. The wrong option t - L + 1 reverses the sign. The wrong option L - t + 1 uses the wrong order. The wrong option t + L + 1 adds one instead of subtracting one. The answer is t + L - 1."
          - problem: "Write the full proof: for integers a and b > 0, there are q, r with a = bq + r and 0 <= r < b. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "First write the theorem: for integers a and b > 0, there are q, r with a = bq + r and 0 <= r < b. Step 1: let S = {a - bq : q an integer and a - bq >= 0}. Step 2: S is nonempty because q = 0 gives a when a >= 0, and a large negative q gives a nonnegative value when a < 0. Step 3: by the well-ordering principle S has a least element r = a - bq. Step 4: if r >= b, then r - b = a - b(q + 1) is in S and is smaller than r, a contradiction. Step 5: therefore 0 <= r < b, and a = bq + r. Step 6: this proves the existence of q and r."
        constraints: "choose the set so its least element gives the desired object"
      - id: kp3
        name: "Well-ordering and induction"
        key_prerequisites: [mathematical-induction]
        exemplars:
          - problem: "An induction proof starts at n = 4: P(4) is true, and P(n) implies P(n+1) for every n >= 4. Let C be the set of integers n >= 4 with P(n) false, and suppose C is nonempty. By the well-ordering principle C has a least element m. Find the smallest value m can take."
            answer: "5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Full setup: C = {n >= 4 : P(n) is false} is nonempty, so the well-ordering principle gives a least element m. Since P(4) is true, 4 is not in C, so m > 4 by minimality. The least integer greater than 4 is 5, so the smallest value m can take is 5."
          - problem: "Let S = {7, 12, 30}. To prove that S has a least element by induction, let P(n) be the statement that no element of S is less than or equal to n. Find the least n for which P(n) is false."
            answer: "7"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Full statement: P(n) says that none of 7, 12, 30 is at most n. For every n from 0 up to 6, all elements of S are still greater than n, so P(n) holds. At n = 7 the element 7 of S is at most 7, so P(7) is false. The least n with P(n) false is 7."
          - problem: "The set S = {n >= 1 : n^2 > 30} is a nonempty set of natural numbers, so the well-ordering principle guarantees it has a least element. Find that least element."
            answer: "6"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The set S is nonempty because 6^2 = 36 > 30, so well-ordering applies. Test values upward from 1: for n = 5, n^2 = 25, which is not greater than 30, so 5 is not in S. For n = 6, n^2 = 36 > 30. The least element of S is 6."
          - problem: "A student claims that 3^n > n^3 for every n >= 1. A well-ordering refutation forms the set of counterexamples and takes its least element. Find the smallest n >= 1 for which the claim is false."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The set of counterexamples is the set of n >= 1 with 3^n not greater than n^3, and it is nonempty, so it has a least element by well-ordering. Check upward: n = 1 gives 3 > 1, true. n = 2 gives 9 > 8, true. n = 3 gives 27 > 27, which is false. The smallest counterexample is 3."
          - problem: "The set T = {n >= 0 : 2n^2 + 3 > 100} is a nonempty set of natural numbers, so the well-ordering principle gives it a least element. Find that least element."
            answer: "7"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: the full object is T = {n >= 0 : 2n^2 + 3 greater than 100}. Step 2: T is nonempty, since n = 7 gives 2 times 49 plus 3, which is 101, so the well-ordering principle guarantees that T has a least element. Step 3: test values upward: n = 5 gives 53 and n = 6 gives 75, both at most 100, so neither lies in T. The least element of T is 7."
          - problem: "To show that a nonempty set of integers with an integer upper bound has a greatest element, one applies the well-ordering principle to the set of negated elements. For S = {-3, 2, 8, 15}, let T = {-s : s is in S}. Find the least element of T."
            answer: "-15"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Form T by negating each element of S: T = {3, -2, -8, -15}. T is a nonempty set of integers, so by the well-ordering principle it has a least element. Compare the elements: 3 > -2 > -8 > -15. The least element of T is -15."
          - problem: "Write the full proof: the well-ordering principle implies mathematical induction. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Setup: assume P(1) holds and that P(n) implies P(n+1) for all n >= 1, and suppose, for contradiction, that P fails somewhere. Step 1: form the set C = {n >= 1 : P(n) is false}; by the supposition C is a nonempty set of natural numbers. Step 2: by the well-ordering principle, C has a least element m, the least failure point. Step 3: P(1) holds by the base case, so 1 is not in C, hence m > 1 and m - 1 >= 1. Step 4: by minimality of m, the integer m - 1 is not in C, so P(m-1) holds. Step 5: apply the inductive step to m - 1: P(m-1) implies P(m), so m is not in C, contradicting the choice of m. Conclusion: C is empty, so P(n) holds for every n >= 1, which is mathematical induction."
        constraints: "connect the two principles via a least failure point"
    diagnostic_exemplar:
      problem: 'Use the well-ordering principle to prove that every nonempty set $S$ of integers that is bounded above has a greatest element.'
      answer: 'Let $M$ be an upper bound for $S$, so $s \le M$ for every $s \in S$, and put $T = \{M - s : s \in S\}$. Every element of $T$ is a nonnegative integer, and $T$ is nonempty because $S$ is, so by the well-ordering principle $T$ has a least element, say $M - s_0$ with $s_0 \in S$. Then for every $s \in S$ we have $M - s_0 \le M - s$, i.e. $s \le s_0$. Hence $s_0$ is an element of $S$ greater than or equal to every element of $S$ — a greatest element.'
      solution_sketch: 'Reflect the set about the upper bound to land inside the nonnegative integers, apply well-ordering there, and translate the least element back.'
    anki_seeds:
      - front: 'The well-ordering principle?'
        back: 'Every nonempty set of natural numbers (or of integers bounded below) has a least element.'
        type: basic
      - front: 'The minimal-counterexample method?'
        back: 'Take the least $n$ for which the claim fails (well-ordering), then derive a contradiction from a smaller failure.'
        type: basic
