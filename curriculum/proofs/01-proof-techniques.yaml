        back: 'Addition, subtraction, multiplication, and division by a nonzero rational.'
        type: basic

  - id: divisibility-parity-proofs
    name: "Divisibility and Parity Proofs"
    core: true
    difficulty: 0.55
    drill: false
    answer_kind: proof
    expected_time_secs: 210
    prerequisites:
      - id: direct-proof
        weight: 0.5
        key: true
      - id: quantifiers
        weight: 0.2
      - id: divisibility-rules
        weight: 0.0
    knowledge_points:
      - id: kp1
        name: "Divisibility and linear combinations"
        key_prerequisites: [direct-proof]
        exemplars:
          - problem: "Suppose a | b and a | c, so b = a k and c = a l for integers k and l. Write 2b - c = a q. Give q as an expression in k and l."
            answer: "2k-l"
            answer_contract: {"kind": "function", "vars": ["k", "l"]}
            solution_sketch: "Start from b = a k and c = a l, which is the definition of divides. Substitute: 2b - c = 2ak - al (substitution). Factor a: 2b - c = a(2k - l) with 2k - l an integer (factoring and closure). The answer is 2k-l."
          - problem: "Suppose a | b, so b = a k for an integer k. Write b^2 = a q. Give q as a polynomial in a and k."
            answer: "ak^2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Write b = a k (definition of divides). Square: b^2 = a^2 k^2 (arithmetic). Factor a: b^2 = a(a k^2) with a k^2 an integer (factoring and closure). The answer is ak^2."
          - problem: "Suppose a | b and a | c, so b = a k and c = a l for integers k and l. Write b + c = a q. Give q as an expression in k and l."
            answer: "k+l"
            answer_contract: {"kind": "function", "vars": ["k", "l"]}
            solution_sketch: "Write b = a k and c = a l (definition of divides). Add: b + c = a k + a l (substitution). Factor a: b + c = a(k + l) with k + l an integer (factoring and closure). The answer is k+l."
          - problem: "Suppose a | b, so b = a k for an integer k. Write b^3 = a q. Give q as a polynomial in a and k."
            answer: "a^2k^3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Write b = a k (definition of divides). Cube: b^3 = a^3 k^3 (arithmetic). Factor a: b^3 = a(a^2 k^3) with a^2 k^3 an integer (factoring and closure). The answer is a^2k^3."
          - problem: "Claim: for all integers a, b, c, if a | b and a | c then a | (b + c + 1). Step 1: assume a | b and a | c, so b = a k and c = a l. Step 2: then b + c + 1 = a k + a l + 1 = a(k + l) + 1. Step 3: since a divides a(k + l), and a divides 1, a divides the sum. Step 4: therefore a | (b + c + 1). Which step is the first step that is not valid?"
            answer: "Step 3"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "Step 1 is the definition of divides and is correct. Step 2 substitutes and factors correctly. Step 3 is the first invalid step: a need not divide 1, for example a = 2 does not divide 1. Step 4 only restates Step 3, so its error is inherited. The answer is Step 3."
          - problem: "Consider the claim: for all integers a, b, c, if a divides b and a divides c then a divides b + c + 1. This claim is false. Give the smallest positive integer a for which integers b and c exist that make the claim false."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "For a = 1 the claim is true because 1 divides every integer (definition of divides). For a = 2, take b = 2 and c = 4: 2 divides 2 and 2 divides 4, but 2 does not divide 2 + 4 + 1 = 7 (counterexample). Thus the smallest is 2 (least counterexample). The answer is 2."
          - problem: "Write the full proof: for all integers a, b, c, x, y, if a | b and a | c then a | (b x + c y). Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1 (hypothesis): let a, b, c, x, y be integers with a | b and a | c. Step 2 (definition of divides): there are integers k and l with b = a k and c = a l. Step 3 (substitution): b x + c y = a k x + a l y. Step 4 (factoring): b x + c y = a(k x + l y). Step 5 (closure of integers): k x + l y is an integer, since products and sums of integers are integers. Step 6 (definition of divides): a | (b x + c y). Step 7 (conclusion): since the integers a, b, c, x, y were arbitrary, the statement holds for all integers. This completes the proof."
        constraints: "prove divisibility of linear combinations from the definition of divides"
      - id: kp2
        name: "Parity arguments"
        key_prerequisites: [direct-proof]
        exemplars:
          - problem: "For n = 2k + 1, write n + 1 in the form 2m with integer m. Give m as a formula in k."
            answer: "k+1"
            answer_contract: {"kind": "function", "vars": ["k"]}
            solution_sketch: "Start from n = 2k + 1, the odd parity form. Add 1: n + 1 = 2k + 2. Factor 2: n + 1 = 2(k + 1). Thus m = k + 1. The answer is k+1."
          - problem: "Let a = 2r be even and b = 2s + 1 be odd. Write a + b in the form 2t + 1. Give t."
            answer: "r+s"
            answer_contract: {"kind": "function", "vars": ["r", "s"]}
            solution_sketch: "Use the even parity form a = 2r and the odd parity form b = 2s + 1. Add: a + b = 2r + 2s + 1. Factor 2 from the even part: a + b = 2(r + s) + 1. Thus t = r + s. The answer is r+s."
          - problem: "For odd n = 2k + 1, write n + (n + 1) as 2m + 1. Give m."
            answer: "2k+1"
            answer_contract: {"kind": "function", "vars": ["k"]}
            solution_sketch: "Use n = 2k + 1, the odd parity form. The next integer is n + 1 = 2k + 2. Add them: n + (n + 1) = 4k + 3. Write 4k + 3 = 2(2k + 1) + 1. Thus m = 2k + 1. The answer is 2k+1."
          - problem: "Let a = 2r be even and b = 2s + 1 be odd. Write b - a as 2d + 1. Give d."
            answer: "s-r"
            answer_contract: {"kind": "function", "vars": ["r", "s"]}
            solution_sketch: "Use b = 2s + 1 for the odd integer and a = 2r for the even integer. Subtract: b - a = 2s + 1 - 2r. Group: b - a = 2(s - r) + 1. Thus d = s - r. The answer is s-r."
          - problem: "Claim: if n is odd, then n + 1 is even. Step 1: write n = 2k + 1 for an integer k. Step 2: then n + 1 = 2k + 2. Step 3: factor n + 1 = 2(k + 1). Step 4: since k + 1 can be odd, n + 1 is odd. Which step is the first step that is not valid?"
            answer: "Step 4"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "Step 1 uses the correct odd parity form n = 2k + 1. Step 2 adds 1 correctly to get n + 1 = 2k + 2. Step 3 factors out 2 correctly to get n + 1 = 2(k + 1). Step 4 is the first invalid step because k + 1 is an integer, so 2(k + 1) is even, not odd. The answer is Step 4."
          - problem: "In a proof that the sum of two odd integers is even, let n = 2a + 1 and m = 2b + 1. The line n + m = ___ is missing. Select the line that completes the proof."
            answer: "2(a+b+1)"
            answer_contract: {"kind": "label", "options": [["2(a+b)+1"], ["2(a+b+1)"], ["2(ab+1)"], ["2(a+b-1)"]]}
            solution_sketch: "Start with n = 2a + 1 and m = 2b + 1. Add: n + m = 2a + 2b + 2. Factor 2: n + m = 2(a + b + 1), so the sum is even. The option 2(a+b)+1 is odd and misses one +1; 2(ab+1) multiplies a and b instead of adding them; 2(a+b-1) subtracts 1 instead of adding 1. The answer is 2(a+b+1)."
          - problem: "Write the full proof: for all integers a and b, if a is even and b is odd, then a + b + 1 is even. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1: let a be even, so a = 2r for some integer r. Step 2: let b be odd, so b = 2s + 1 for some integer s. Step 3: add the expressions: a + b + 1 = 2r + (2s + 1) + 1. Step 4: simplify the right side: 2r + 2s + 2 = 2(r + s + 1). Step 5: r + s + 1 is an integer, so the result is 2 times an integer. Therefore a + b + 1 is even, completing the proof."
        constraints: "argue from the two parity forms of an integer"
      - id: kp3
        name: "Parity of squares and products"
        key_prerequisites: [direct-proof]
        exemplars:
          - problem: "For an odd integer n = 2k + 1, its square can be written n^2 = 2q + 1. Give q."
            answer: "2k^2+2k"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Expand the square: (2k + 1)^2 = 4k^2 + 4k + 1. Factor 2 from the first two terms: 2(2k^2 + 2k) + 1. The answer is 2k^2+2k."
          - problem: "For an even integer n = 2k, its square can be written n^2 = 2q. Give q."
            answer: "2k^2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Expand the square: (2k)^2 = 4k^2. Factor 2: 2(2k^2). The answer is 2k^2."
          - problem: "For odd integers m = 2a + 1 and n = 2b + 1, their product can be written mn = 2q + 1. Give q."
            answer: "2ab+a+b"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Expand the product: (2a + 1)(2b + 1) = 4ab + 2a + 2b + 1. Factor 2 from the first three terms: 2(2ab + a + b) + 1. The answer is 2ab+a+b."
          - problem: "Claim: for every integer n, n^2 is odd if and only if n is odd. Step 1: if n is odd, write n = 2k + 1. Step 2: then n^2 = 2(2k^2 + 2k) + 1, so n^2 is odd. Step 3: conversely, assume n^2 is odd and write n^2 = 2k + 1, so n = sqrt(2k + 1), which is odd. Step 4: therefore n is odd. Which step is the first step that is not valid?"
            answer: "Step 3"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "Step 1 is valid because an odd integer has the form 2k + 1. Step 2 is valid because squaring gives 2(2k^2 + 2k) + 1. Step 3 is invalid because n^2 = 2k + 1 does not imply n = sqrt(2k + 1) is an integer, let alone odd. Step 4 only follows from a correct converse. The answer is Step 3."
          - problem: "In a direct proof that the product of two odd integers is odd, the line after expanding (2a + 1)(2b + 1) is missing. Select the line that shows the product as twice an integer plus one."
            answer: "2(2ab+a+b)+1"
            answer_contract: {"kind": "label", "options": [["2(2ab+a+b)+1"], ["2(2ab+a+b)"], ["2(ab+a+b)+1"], ["4ab+2a+2b"]]}
            solution_sketch: "Expand: (2a + 1)(2b + 1) = 4ab + 2a + 2b + 1. Factor 2 from the first three terms: 2(2ab + a + b) + 1. The option 2(2ab+a+b) drops the final +1; 2(ab+a+b)+1 has a wrong expansion; 4ab+2a+2b drops the final +1. The answer is 2(2ab+a+b)+1."
          - problem: "For integers m and n with m = 2a, their product can be written mn = 2q. Give q in terms of a and n."
            answer: "an"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Let m = 2a. Multiply: mn = 2a n. Factor 2: the quotient is a n. The answer is an."
          - problem: "Write the full proof: for every integer n, n^2 is even if and only if n is even. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1 (forward): assume n is even, so n = 2k for an integer k. Then n^2 = 4k^2 = 2(2k^2), so n^2 is even. Step 2 (converse): prove the contrapositive; assume n is odd, so n = 2k + 1. Then n^2 = (2k + 1)^2 = 4k^2 + 4k + 1 = 2(2k^2 + 2k) + 1, which is odd. Thus if n^2 is even, n cannot be odd, so n is even. Step 3 (conclusion): both directions hold, so n^2 is even if and only if n is even."
        constraints: "iff proof; handle both directions"
    diagnostic_exemplar:
      problem: 'Prove: for all integers $m, n$, if $m$ and $n$ are both odd then $4 \mid (m^2 + n^2 - 2)$.'
      answer: 'Write $m = 2a + 1$ and $n = 2b + 1$ with $a, b$ integers. Then $m^2 + n^2 - 2 = (4a^2 + 4a + 1) + (4b^2 + 4b + 1) - 2 = 4(a^2 + a + b^2 + b)$. Since $a^2 + a + b^2 + b$ is an integer, $4 \mid (m^2 + n^2 - 2)$.'
      solution_sketch: 'Substitute the odd forms, expand both squares, and factor $4$ out of what remains.'
    anki_seeds:
      - front: 'Definition: $a \mid b$ ("$a$ divides $b$")?'
        back: 'There is an integer $k$ with $b = ak$ (with $a \ne 0$).'
        type: basic
      - front: 'To prove $a \mid (bx + cy)$ from $a \mid b$ and $a \mid c$...'
        back: 'Write $b = ak$, $c = al$, then factor: $bx + cy = a(kx + ly)$.'
        type: basic

