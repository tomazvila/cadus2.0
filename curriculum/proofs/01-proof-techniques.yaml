            answer: "6"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: square each residue from 0 to 9 modulo 10, giving 0, 1, 4, 9, 6, 5, 6, 9, 4, 1. Step 2: collect the distinct last digits 0, 1, 4, 5, 6, and 9. The answer is 6."
          - problem: "For every n in {1,2,3,4}, the inequality 2^n >= n + 1 holds. Check each case explicitly. Find the smallest value of 2^n - n - 1 over n = 1, 2, 3, 4."
            answer: "0"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: evaluate the finite list: n = 1 gives 0, n = 2 gives 1, n = 3 gives 4, and n = 4 gives 11. Step 2: compare the four values and select the smallest. The answer is 0."
          - problem: "To prove a claim by exhaustion, check the residues n = 0, 1, ..., 9 modulo 10. Find the smallest n in this list for which n^2 has last digit 1."
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: square each residue from 0 to 9 modulo 10, giving 0, 1, 4, 9, 6, 5, 6, 9, 4, 1. Step 2: the residues with last digit 1 are n = 1 and n = 9. The smallest is 1. The answer is 1."
          - problem: "Again check n = 0, 1, ..., 9 modulo 10. Find the largest n in this list for which n^2 has last digit 9."
            answer: "7"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: square each residue from 0 to 9 modulo 10, giving 0, 1, 4, 9, 6, 5, 6, 9, 4, 1. Step 2: the residues with last digit 9 are n = 3 and n = 7. The largest is 7. The answer is 7."
          - problem: "A student claims that n^2 + n + 1 is prime for every n in {1, 2, 3, 4, 5} and wants to settle it by exhaustion. Check all five cases one by one. Find the smallest n in this set for which the claim fails."
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: exhaust the finite set by evaluating n^2 + n + 1 for n = 1 to 5, which gives 3, 7, 13, 21, 31. Step 2: test each value for primality by the definition of prime: 3, 7, 13, and 31 are prime, but 21 = 3 times 7 is composite. Step 3: the earliest failing case is n = 4. The answer is 4."
          - problem: "Check n = 0, 1, ..., 9 modulo 10. How many of these n have n^2 ending in 6?"
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: square each residue from 0 to 9 modulo 10, giving 0, 1, 4, 9, 6, 5, 6, 9, 4, 1. Step 2: count the entries equal to 6, which occur for n = 4 and n = 6. The answer is 2."
          - problem: "Write the full proof: for every n in {0,1,...,9}, n^2 mod 10 is never 2, 3, 7, or 8. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1: state the finite domain. The last digit of n^2 depends only on n modulo 10, so it is enough to check n = 0, 1, ..., 9. Step 2: square each case. The squares are 0, 1, 4, 9, 16, 25, 36, 49, 64, 81, whose last digits are 0, 1, 4, 9, 6, 5, 6, 9, 4, 1. Step 3: collect the possible last digits. The set is 0, 1, 4, 5, 6, 9. Step 4: compare with the forbidden digits. None of 2, 3, 7, or 8 appears. Step 5: conclude. Since every residue class modulo 10 was checked explicitly, no perfect square ends in 2, 3, 7, or 8. This completes the proof by exhaustion."
