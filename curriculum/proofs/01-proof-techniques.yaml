unit: proof-techniques
course: proofs
module: "Proof Techniques"
topics:
  - id: direct-proof
    name: "Direct Proof"
    core: true
    difficulty: 0.50
    drill: false
    answer_kind: proof
    expected_time_secs: 200
    prerequisites:
      - id: quantifiers
        weight: 0.5
        key: true
      - id: conditional-statements
        weight: 0.4
        key: true
      - id: rules-of-inference
        weight: 0.3
      - id: evaluating-expressions
        weight: 0.0
    knowledge_points:
      - id: kp1
        name: "The direct-proof template on parity"
        key_prerequisites: [conditional-statements]
        exemplars:
          - problem: "Assume m and n are even integers, written as m = 2a and n = 2b. To prove m + n is even, write m + n = 2q. Find q."
            answer: "a+b"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (hypothesis): assume m and n are even, so m = 2a and n = 2b for integers a and b. Step 2 (algebra): add the expressions, m + n = 2a + 2b, and factor out 2 to get 2(a + b). The quotient is a+b."
          - problem: "Assume m and n are odd integers, written as m = 2a + 1 and n = 2b + 1. To prove mn is odd, write mn = 2q + 1. Find q."
            answer: "2ab+a+b"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (hypothesis): assume m and n are odd, so m = 2a + 1 and n = 2b + 1. Step 2 (algebra): multiply, mn = (2a + 1)(2b + 1) = 4ab + 2a + 2b + 1 = 2(2ab + a + b) + 1. The quotient is 2ab+a+b."
          - problem: "Assume n is an odd integer, written as n = 2k + 1. To prove n^2 is odd, write n^2 = 2q + 1. Find q."
            answer: "2k^2+2k"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (hypothesis): assume n is odd, so n = 2k + 1. Step 2 (algebra): square, n^2 = 4k^2 + 4k + 1 = 2(2k^2 + 2k) + 1. The quotient is 2k^2+2k."
          - problem: "A student claims that n^2 + 3n + 2 is odd for every integer n >= 2. Give the smallest n >= 2 for which the claim is false."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (evaluation): put n = 2 in the expression n^2 + 3n + 2, which gives 4 + 6 + 2 = 12. Step 2 (parity): 12 = 2*6 is even, so the claim that it is odd fails at n = 2. Since n >= 2, no smaller value is possible. The smallest n is 2."
          - problem: "Assume n is an odd integer, written as n = 2k + 1. To prove n^3 is odd, write n^3 = 2q + 1. Find q."
            answer: "4k^3+6k^2+3k"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (hypothesis): assume n is odd, so n = 2k + 1 for an integer k. Step 2 (algebra): cube the expression, n^3 = (2k + 1)^3 = 8k^3 + 12k^2 + 6k + 1. Step 3 (form): factor out 2, n^3 = 2(4k^3 + 6k^2 + 3k) + 1. The quotient is 4k^3+6k^2+3k."
          - problem: "In a direct proof that the sum of two odd integers is even, the line m + n = ? is missing. Select the line that is true and that shows the conclusion."
            answer: "$2(a + b + 1)$"
            answer_contract: {"kind": "label", "options": [["$2(a + b + 1)$"], ["$2(a + b)$"], ["$2(a + b) + 1$"], ["$2(a + b + 2)$"]]}
            solution_sketch: "Write m = 2a + 1 and n = 2b + 1. Then m + n = 2a + 1 + 2b + 1 = 2a + 2b + 2 = 2(a + b + 1), which is even. Option 2(a + b) drops the two 1s and gives too little. Option 2(a + b) + 1 has the wrong parity. Option 2(a + b + 2) adds two extra units. The answer is $2(a + b + 1)$."
          - problem: "Write the full proof: for all integers m and n, if m is even and n is odd then m + n is odd. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Proof. Step 1 (hypothesis): assume m is even and n is odd. Step 2 (definition): write m = 2a for some integer a and n = 2b + 1 for some integer b. Step 3 (algebra): add the expressions, m + n = 2a + (2b + 1) = 2a + 2b + 1 = 2(a + b) + 1. Step 4 (conclusion): since a + b is an integer, the last expression has the form 2q + 1 with q = a + b, so m + n is odd. Therefore the conditional statement holds for all integers m and n."
        constraints: "assume the hypothesis and derive the conclusion; use even = $2k$, odd = $2k+1$"
      - id: kp2
        name: "Direct proofs with algebra and inequalities"
        key_prerequisites: [evaluating-expressions]
        exemplars:
          - problem: "In a direct proof that $n^2 + n$ is even for every integer $n$, take the case $n = 2k$. Write $n^2 + n$ as 2 times an expression in $k$. Give the expression."
            answer: "2k^2+k"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Start with the full object $n^2 + n$. Substitute $n = 2k$: $(2k)^2 + 2k = 4k^2 + 2k$. Factor 2 by the distributive rule: $2(2k^2 + k)$. The last sentence gives the answer 2k^2+k."
          - problem: "In a direct proof that if $a \\le b$ and $c \\ge 0$ then $ac \\le bc$, the step from $b - a \\ge 0$ and $c \\ge 0$ to $ac \\le bc$ has one missing line. Select the missing line."
            answer: "$(b - a)c >= 0$"
            answer_contract: {"kind": "label", "options": [["$(b - a)c >= 0$"], ["$(b - a)c <= 0$"], ["$(a - b)c >= 0$"], ["$(b + a)c >= 0$"]]}
            solution_sketch: "Start from $b - a \\ge 0$ and $c \\ge 0$. The product rule for inequalities gives $(b - a)c \\ge 0$. Expanding, $bc - ac \\ge 0$, so $ac \\le bc$. The option $(b - a)c <= 0$ has the wrong inequality sign. The option $(a - b)c >= 0$ uses $b - a$ in the wrong order. The option $(b + a)c >= 0$ adds $a$ and $b$ instead of subtracting. The answer is $(b - a)c >= 0$."
          - problem: "A student claims that $2n + 1 > n^2$ for every integer $n \\ge 1$ and checks $n = 1$ and $n = 2$. Give the smallest integer $n \\ge 1$ for which the claim is false."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Test the claim at the checked values first. For $n = 1$, $3 > 1$ is true; for $n = 2$, $5 > 4$ is true. For $n = 3$, $7 > 9$ is false. The smallest counterexample is $n = 3$, so the answer is 3."
          - problem: "In a direct proof that $x^2 + 2x + 3 > 0$ for every real $x$, complete the square: $x^2 + 2x + 3 = (x + 1)^2 + c$. Give $c$."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Start with the full object $x^2 + 2x + 3$. Complete the square by adding and subtracting 1: $(x^2 + 2x + 1) + 2$. Use $(x + 1)^2 = x^2 + 2x + 1$ to write $(x + 1)^2 + 2$. Matching $(x + 1)^2 + c$ gives $c = 2$, so the answer is 2."
          - problem: "For real numbers $a$ and $b$, a direct proof of $a^2 + b^2 \\ge 2ab$ moves all terms to one side. Give the square that equals $a^2 + b^2 - 2ab$."
            answer: "(a-b)^2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Start with $a^2 + b^2 - 2ab$. Recognize the square of a difference: $(a - b)^2 = a^2 - 2ab + b^2$. Therefore $a^2 + b^2 - 2ab = (a - b)^2$. A square is nonnegative, so $a^2 + b^2 \\ge 2ab$. The answer is (a-b)^2."
          - problem: "Claim: for every real number $x$, $x^2 + 1 \\ge 2x$. Step 1: the claim is the same as $x^2 - 2x + 1 \\ge 0$. Step 2: $x^2 - 2x + 1 = (x - 1)^2$. Step 3: for every real number $x$, $x - 1 \\ge 0$, so $(x - 1)^2 \\ge 0$. Step 4: hence $x^2 + 1 \\ge 2x$ for every real $x$. Which step is the first step that is not valid?"
            answer: "Step 3"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "Start from the claim $x^2 + 1 \\ge 2x$ for every real number $x$. Step 1 subtracts $2x$ from both sides and is valid by the addition rule for inequalities. Step 2 uses the identity $x^2 - 2x + 1 = (x - 1)^2$ and is valid. Step 3 states $x - 1 \\ge 0$ for every real number $x$, which is false: at $x = 0$ the value $x - 1$ is $ -1$, and a square is still nonnegative only because of the square, not because of that sign claim. So Step 3 is the first invalid step. Step 4 rests on Step 3 and is not the first invalid step; Step 1 and Step 2 are both valid, so they are not the first invalid step either. The answer is Step 3."
          - problem: "Write the full proof: for every positive real number $x$, $x + 1/x \\ge 2$. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Proof. Step 1: start from $(x - 1)^2 \\ge 0$ for every real $x$, because a square is nonnegative. Step 2: expand the square: $x^2 - 2x + 1 \\ge 0$. Step 3: add $2x$ to both sides: $x^2 + 1 \\ge 2x$. Step 4: since $x > 0$, divide both sides by $x$; division by a positive number keeps the inequality direction, so $x + 1/x \\ge 2$. Step 5: the assumption $x > 0$ was used only at the division step, so the statement holds for every positive real $x$. This completes the direct proof."
        constraints: "algebraic manipulation; keep each step reversible-justified"
      - id: kp3
        name: "Direct proofs about divisibility"
        key_prerequisites: [quantifiers]
        exemplars:
          - problem: "Assume a | b and b | c for integers a, b, c, so b = ak and c = bm for integers k and m. A direct proof gives c = a q for some integer q. Give q."
            answer: "km"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Assume a | b and b | c, so b = ak and c = bm with k, m integers. Substitute: c = bm = (ak)m = a(km). The definition a | c needs c = a q, so q = km. The answer is km."
          - problem: "Assume 5 | n for an integer n, so n = 5k. A direct proof gives n^2 = 5 q for some integer q. Give q."
            answer: "5k^2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Assume 5 | n, so n = 5k for integer k. Square: n^2 = (5k)^2 = 25k^2 = 5(5k^2). The definition of divisibility needs n^2 = 5 q, so q = 5k^2. The answer is 5k^2."
          - problem: "Assume a | b and a | c for integers a, b, c, so b = ak and c = am for integers k and m. A direct proof gives b + c = a q. Give q."
            answer: "k+m"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Assume a | b and a | c, so b = ak and c = am. Add: b + c = ak + am = a(k + m). The definition of divisibility needs b + c = a q, so q = k + m. The answer is k+m."
          - problem: "A student claims that 3 | (n^2 + 2) for all integers n >= 1 and checks n = 1 and n = 2. Give the smallest n >= 1 for which the claim is false."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Test values: n = 1 gives 1 + 2 = 3, divisible by 3; n = 2 gives 4 + 2 = 6, divisible by 3; n = 3 gives 9 + 2 = 11, not divisible by 3. The first false case is n = 3, so the smallest counterexample is 3. The answer is 3."
          - problem: "Claim: for all integers a and b, if a | b then a | (b + 1). Step 1: assume a | b, so b = ak for some integer k. Step 2: then b + 1 = ak + 1. Step 3: factor a to get ak + 1 = a(k + 1). Step 4: so a | (b + 1). Which step is the first step that is not valid?"
            answer: "Step 3"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "Step 1 correctly uses the definition of divisibility. Step 2 is algebra. Step 3 is false: a(k + 1) = ak + a, not ak + 1. Step 4 depends on Step 3. The answer is Step 3."
          - problem: "Assume a | b and a | c for integers a, b, c, so b = ak and c = am for integers k and m. A direct proof gives b - c = a q. Give q."
            answer: "k-m"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Assume a | b and a | c, so b = ak and c = am. Subtract: b - c = ak - am = a(k - m). The definition of divisibility needs b - c = a q, so q = k - m. The answer is k-m."
          - problem: "Write the full proof: for all integers a, b, c, if a | b and b | c then a | c. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1 (hypothesis): assume a | b and b | c for integers a, b, c. Step 2 (definition): there are integers k and m with b = ak and c = bm. Step 3 (substitution): c = bm = (ak)m = a(km). Step 4 (closure): km is an integer. Step 5 (definition): c = a(km) means a | c. The proof uses only the definition of divisibility. This proves the statement for all integers a, b, c."
        constraints: "use the definition $a \\mid b$ means $b = ak$ for some integer $k$"
    diagnostic_exemplar:
      problem: 'Prove: for all integers $a, b$, if $a \mid b$ then $a \mid (3b^2 + b)$.'
      answer: 'Suppose $a \mid b$, so $b = ak$ for some integer $k$. Then $3b^2 + b = 3(ak)^2 + ak = a(3ak^2 + k)$, and $3ak^2 + k$ is an integer, so $a \mid (3b^2 + b)$ by the definition of divisibility.'
      solution_sketch: 'Unfold the divisibility hypothesis as $b = ak$, substitute, and factor $a$ out of the result.'
    anki_seeds:
      - front: 'Structure of a direct proof of $\forall x\, (P(x) \to Q(x))$?'
        back: 'Take an arbitrary $x$ for which $P(x)$ is true, then derive $Q(x)$ using definitions and known facts.'
        type: basic
      - front: 'Definitions of even and odd integers?'
        back: 'Even: $n = 2k$ for some integer $k$. Odd: $n = 2k + 1$ for some integer $k$.'
        type: basic

  - id: vacuous-trivial-proofs
    name: "Vacuous and Trivial Proofs"
    core: false                # supplemental: edge-case enrichment on the conditional
    difficulty: 0.52
    drill: false
    answer_kind: proof
    expected_time_secs: 150
    prerequisites:
      - id: direct-proof
        weight: 0.5
        key: true
      - id: truth-tables
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: "Vacuous proofs"
        key_prerequisites: [truth-tables]
        exemplars:
          - problem: "A proof of 'for every real x, if x^2+1=0 then x>10' begins by bounding the hypothesis. Find the least value of x^2+1 over all real x."
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: bound the square: for every real x, x^2 >= 0. Step 2: add 1: x^2+1 >= 1. The full object is the inequality x^2+1 >= 1. Hence the hypothesis x^2+1=0 can never be true, so the conditional is vacuous. The answer is 1."
          - problem: "A proof that no even prime exceeds 5 uses the only even prime. Determine the only even prime."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: an even integer greater than 2 has the factor 2 and a second factor greater than 1, so it is composite. Step 2: the only even integer that is prime is 2 itself. The full object is the set of even primes {2}. Since no even prime is greater than 5, the hypothesis is unsatisfiable and the conditional is vacuously true. The answer is 2."
          - problem: "For all real x, if x^2+x+1=0 then x>100. Complete the square for the hypothesis expression: x^2+x+1 = (x+1/2)^2 + k. Give k."
            answer: "3/4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: complete the square: x^2+x+1 = (x+1/2)^2 + 3/4. Step 2: use the square bound (x+1/2)^2 >= 0, so the expression is at least 3/4. The full object is the identity x^2+x+1 = (x+1/2)^2 + 3/4. Thus the hypothesis x^2+x+1=0 is impossible, and the conditional is vacuous. The answer is 3/4."
          - problem: "For all integers n, if n^2+1=0 then n=7. How many integer solutions does the hypothesis n^2+1=0 have?"
            answer: "0"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: use the square bound: for every integer n, n^2 >= 0, so n^2+1 >= 1. Step 2: compare with 0: the expression n^2+1 is never 0. The full object is the inequality n^2+1 >= 1. The hypothesis has no integer solutions, so the conditional is vacuously true. The answer is 0."
          - problem: "Claim: for every real x, if x^2+1=0 then x>10. Step 1: assume x^2+1=0 for a real x. Step 2: then x^2=-1. Step 3: but x^2>=0 and -1<0, a contradiction. Step 4: hence the hypothesis is true for some x. Step 5: therefore x>10. Which step is the first step that is not valid?"
            answer: "Step 4"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"], ["Step 5"]]}
            solution_sketch: "Step 1 is valid: it assumes the hypothesis for an arbitrary real x. Step 2 is valid: subtracting 1 gives x^2=-1. Step 3 is valid: squares are nonnegative and -1 is negative. Step 4 is the first invalid step: the contradiction shows the hypothesis is false for every real x, not true for some x. Step 5 does not follow from the contradiction. The answer is Step 4."
          - problem: "Claim: for every real x, if x^4 + 1 = 0 then x > 5. A vacuous proof needs the line that shows the hypothesis is unsatisfiable for every real x. Select that line."
            answer: "x^4+1 > 0"
            answer_contract: {"kind": "label", "options": [["x^4+1 > 0"], ["x^4+1 = 0"], ["x^4-1 > 0"], ["x^4+1 < 0"]]}
            solution_sketch: "Step 1: use the fourth-power bound: for every real x, x^4 >= 0. Step 2: add 1: x^4+1 >= 1, and in particular x^4+1 > 0. The full object is the inequality x^4+1 > 0, so the hypothesis x^4+1 = 0 is never true and the conditional is vacuously true. The option x^4+1 = 0 merely restates the hypothesis and proves nothing; the option x^4-1 > 0 fails at x = 0, so it does not hold for every x; the option x^4+1 < 0 is never true for any real x, so it cannot be the demonstrated line. The answer is x^4+1 > 0."
          - problem: "Write the full proof: for all real x, if x^2 + 2x + 5 = 0 then x < 0. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Claim: for all real x, if x^2+2x+5=0 then x<0. Step 1: complete the square: x^2+2x+5 = (x+1)^2+4. Step 2: for every real x, (x+1)^2 >= 0, so (x+1)^2+4 >= 4. Step 3: hence x^2+2x+5 >= 4 > 0 for every real x. The full object is the inequality x^2+2x+5 >= 4. Step 4: therefore the hypothesis x^2+2x+5=0 is false for every real x, so there is no real x to check against the conclusion x<0. Step 5: a conditional with an unsatisfiable hypothesis is vacuously true, so the claim holds."
        constraints: "the hypothesis must be shown unsatisfiable; conclusion may be absurd"
      - id: kp2
        name: "Trivial proofs"
        key_prerequisites: [direct-proof]
        exemplars:
          - problem: "A trivial proof of: for every real x, if x > 3 then x squared is nonnegative, proves the conclusion for all real x. Give the smallest real number m such that x^2 >= m for every real x."
            answer: "0"
            answer_contract: {"kind": "exact"}
            solution_sketch: "A square is never negative, so x^2 >= 0 for every real x. The value 0 is reached at x = 0, so no smaller number works. The answer is 0."
          - problem: "A trivial proof of: for every integer n, if n is prime then n^2 - n^2 = n - n, proves the conclusion for every integer. Give the integer c such that c*n = n - n for every integer n."
            answer: "0"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The right side n - n is zero for every integer n. So c*n = 0 for all n, which forces c = 0. The conclusion holds for all n without the hypothesis. The answer is 0."
          - problem: "A trivial proof of: for every real x, if x < 1 then the square of x-2 is nonnegative, proves the conclusion for all real x. Give the minimum value of the square of x-2 over all real x."
            answer: "0"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The expression is a square, so it is never negative. Its value is zero when x = 2, so the minimum is 0. The answer is 0."
          - problem: "A trivial proof of: for every real x, if x > 5 then x^2+2x+2 is positive, completes the square. Write x^2+2x+2 = (x+1)^2 + C. Give C."
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Expand the square: (x+1)^2 = x^2 + 2x + 1. The constant C makes x^2 + 2x + 2 equal to (x+1)^2 + C, so C = 1. Since the square is nonnegative, the expression is positive. The answer is 1."
          - problem: "Claim: for every real x, if x > 3 then x^2 is nonnegative. Step 1: assume x > 3. Step 2: x is a real number. Step 3: for every real number y, y^2 is positive. Step 4: therefore x^2 is nonnegative. Step 5: the claim holds for every real x. Which step is the first step that is not valid?"
            answer: "Step 3"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"], ["Step 5"]]}
            solution_sketch: "Step 1 is a valid assumption. Step 2 is true for any real number. Step 3 is false: at y = 0, y^2 = 0, not positive. Step 4 correctly uses the hypothesis x > 3 to get a nonnegative square. Step 5 is a true summary. The answer is Step 3."
          - problem: "A trivial proof of: for every real x, if x > 4 then the square of x-1 is nonnegative, needs the line that proves the conclusion without the hypothesis. Select the missing line."
            answer: "$(x-1)^2 >= 0$ for every real x"
            answer_contract: {"kind": "label", "options": [["$(x-1)^2 >= 0$ for every real x"], ["$(x-1)^2 > 0$ for every real x"], ["$x > 4$ so $(x-1)^2 > 9$"], ["$x^2 - 1 >= 0$"]]}
            solution_sketch: "The conclusion follows from the square: for every real x, (x-1)^2 >= 0. The option $(x-1)^2 > 0$ for every real x fails at x = 1, where the square is 0. The option $x > 4$ so $(x-1)^2 > 9$ uses the hypothesis and a strict inequality. The option $x^2 - 1 >= 0$ is a different expression. The answer is $(x-1)^2 >= 0$ for every real x."
          - problem: "Write the full proof: for every real x, if x > 2 then x^2 - 4x + 5 > 0. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1: the goal is to prove the conditional for every real x. Step 2: complete the square: x^2 - 4x + 5 = (x-2)^2 + 1. Step 3: a square is nonnegative, so (x-2)^2 >= 0 for every real x. Step 4: add 1 to get (x-2)^2 + 1 >= 1 > 0. Step 5: the conclusion holds for every real x without using the hypothesis x > 2, so this is a trivial proof. Step 6: therefore the statement is true for every real x."
        constraints: "prove the conclusion outright without touching the hypothesis"
      - id: kp3
        name: "Recognizing which template applies"
        key_prerequisites: [truth-tables]
        exemplars:
          - problem: "Consider the claim: if 4 + 1 = 6, then 13 is prime. Check the hypothesis and the conclusion of this claim, then decide which proof strategies are available. Which option is correct?"
            answer: "Two routes"
            answer_contract: {"kind": "label", "options": [["Only vacuous"], ["Only trivial"], ["Two routes"], ["Neither route"]]}
            solution_sketch: "Step 1: check the hypothesis: 4 + 1 = 6 is false, and a false hypothesis gives the vacuous route. Step 2: check the conclusion: 13 is prime is true, and a true conclusion gives the trivial route. Step 3: each observation alone is a complete proof, so both strategies work. The option Only vacuous ignores the true conclusion; the option Only trivial ignores the false hypothesis; the option Neither route is wrong because both routes work. The answer is Two routes."
          - problem: "Consider the claim: every real number x that satisfies x^2 = -4 and x > 10 is a prime number. Which proof strategy applies?"
            answer: "Only vacuous"
            answer_contract: {"kind": "label", "options": [["Only vacuous"], ["Only trivial"], ["Two routes"], ["Neither route"]]}
            solution_sketch: "Step 1: the full claim is: every real x with x^2 = -4 and x > 10 is prime. Step 2: the square rule: a square of a real number is at least 0, so x^2 = -4 has no real solution. Step 3: the hypothesis is unsatisfiable, so the claim is vacuously true. Step 4: the trivial route needs the conclusion true for every real x, and most reals are not prime, so it fails. The option Only trivial needs an always-true conclusion; the option Two routes adds the impossible trivial route; the option Neither route ignores the vacuous route. The answer is Only vacuous."
          - problem: "For the claim: for every integer n, if n is a multiple of 4, then n^2 + 7 > 0. To test the conclusion-always-true route, find the smallest value of n^2 + 7 over all integers n. Give that value."
            answer: "7"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: the full conclusion is n^2 + 7 > 0 for every integer n. Step 2: the bound rule: n^2 is at least 0 for every integer, with minimum 0 at n = 0. Step 3: adding 7 gives the smallest value 7, and 7 > 0. Step 4: the conclusion holds for all integers, so the trivial route applies and the hypothesis is never used. The answer is 7."
          - problem: "For the claim: for every real x, if x^2 = -9, then x = 5. The vacuous route starts by checking the hypothesis equation over the reals. Give the number of real solutions of x^2 = -9."
            answer: "0"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: the hypothesis equation is x^2 = -9. Step 2: the square rule: the square of a real number is at least 0, so no real x satisfies x^2 = -9. Step 3: counting real solutions gives the count 0. Step 4: an unsatisfiable hypothesis makes the conditional vacuously true. The answer is 0."
          - problem: "For the claim: for every real x, if x^2 + 2x + 5 = 0, then x > 100. One step of the hypothesis check computes the discriminant b^2 - 4ac of the quadratic. Give the discriminant of x^2 + 2x + 5."
            answer: "-16"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: the hypothesis quadratic is x^2 + 2x + 5 = 0 with a = 1, b = 2, c = 5. Step 2: the discriminant rule gives b^2 - 4ac = 4 - 20. Step 3: the discriminant is -16, which is negative, so the equation has no real solution. Step 4: the hypothesis is unsatisfiable, so the conditional is vacuously true. The answer is -16."
          - problem: "Consider the claim: for every real x, if x > 3, then x^2 + 1 > 0. Which proof strategy applies?"
            answer: "Only trivial"
            answer_contract: {"kind": "label", "options": [["Only vacuous"], ["Only trivial"], ["Two routes"], ["Neither route"]]}
            solution_sketch: "Step 1: the full conditional is: for every real x, if x > 3, then x^2 + 1 > 0. Step 2: the bound rule: x^2 is at least 0 for every real x, so x^2 + 1 is at least 1 > 0, and the conclusion is always true. Step 3: the hypothesis x > 3 is satisfiable, for example x = 4, so the vacuous route is not available. Step 4: the option Only vacuous needs an unsatisfiable hypothesis; the option Two routes adds the impossible vacuous route; the option Neither route ignores the trivial route. The answer is Only trivial."
          - problem: "Write the full proof: for every integer n, if n is even, then n^2 + 5 > 0. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1: Let n be an arbitrary integer. Step 2: The hypothesis that n is even will not be needed, so we test whether the conclusion holds for every integer; this is the trivial template. Step 3: Bound rule: for every integer n, n^2 is at least 0. Step 4: Adding 5 gives n^2 + 5, which is at least 5. Step 5: Since 5 > 0, the conclusion n^2 + 5 > 0 holds for every integer n, whatever the hypothesis says, so the conditional is true. Step 6: Template check: the hypothesis is satisfiable, for example n = 2, so the proof is not vacuous; it is a trivial proof. Step 7: Therefore, for every integer n, if n is even then n^2 + 5 > 0. The answer is See the solution."
        constraints: "decide vacuous vs trivial by checking hypothesis-unsatisfiable vs conclusion-always-true"
    diagnostic_exemplar:
      problem: 'Prove each, naming the template used (vacuous or trivial): (a) for every real $x$, if $x^2 < 0$ then $x = 7$; (b) for every integer $n$, if $n$ is prime then $n^2 \ge 0$.'
      answer: '(a) Vacuous: no real $x$ satisfies $x^2 < 0$, since squares of reals are nonnegative; the antecedent is never true, so the conditional holds for every $x$ with nothing further to check. (b) Trivial: $n^2 \ge 0$ holds for every integer $n$, so the consequent is always true and the conditional holds whether or not $n$ is prime.'
      solution_sketch: 'Decide in each case whether the hypothesis is unsatisfiable (vacuous proof) or the conclusion is always true (trivial proof), and say which.'
    anki_seeds:
      - front: 'Vacuous proof of $P \to Q$?'
        back: 'Show $P$ is never true; a conditional with a false hypothesis is automatically true.'
        type: basic
      - front: 'Trivial proof of $P \to Q$?'
        back: 'Show $Q$ is true outright, without using $P$.'
        type: basic

  - id: rational-number-proofs
    name: "Proofs About Rational Numbers"
    core: true
    difficulty: 0.56
    drill: false
    answer_kind: proof
    expected_time_secs: 200
    prerequisites:
      - id: direct-proof
        weight: 0.6
        key: true
      - id: adding-subtracting-fractions
        weight: 0.0
    knowledge_points:
      - id: kp1
        name: "Sums and products of rationals"
        key_prerequisites: [direct-proof]
        exemplars:
          - problem: "In a direct proof that the sum of two rational numbers is rational, the combining step takes r = 3/5 and s = 7/4, writes both fractions over the common denominator 20, and produces one single fraction N/20 after checking that 20 is not 0. Give the numerator N that this step produces."
            answer: "47"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The step uses the common-denominator rule of the sum proof: with r = a/b and s = c/d, write r + s = (ad + bc)/(bd) and verify that the denominator bd is not 0. Here the full object is 3/5 + 7/4 over the denominator 5*4 = 20, which is not 0. The numerator is 3*4 + 7*5 = 12 + 35 = 47, so the step produces the fraction 47/20. The numerator that the step produces is 47."
          - problem: "In a direct proof that the product of two rational numbers is rational, the key step takes r = 5/6 and s = 2/7 and produces the product as one single fraction with denominator 42, after checking that 42 is not 0. Give the numerator of the fraction that the step produces."
            answer: "10"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The step uses the product rule for fractions from the proof: rs = (a/b)(c/d) = ac/(bd), a quotient of integers. With r = 5/6 and s = 2/7 the full object is the fraction with denominator 6*7 = 42, which is not 0. The numerator is 5*2, so the step produces the fraction 10/42. The numerator that the step produces is 10."
          - problem: "A student claims that twice every rational number is an integer, and tests r = 1/n for positive integers n, finding the claim true for n = 1 and n = 2. Give the smallest counterexample n, that is, the smallest positive integer n for which the claim is false."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Use the definition of a rational number: r = 1/n is rational for every positive integer n. Test the claim that the double 2/n is an integer, case by case. For n = 1 the double is 2, an integer; for n = 2 the double is 1, an integer. For n = 3 the double is 2/3, which is not an integer, so the claim fails there. The smallest counterexample is n = 3."
          - problem: "A student claims that a/b times c/d equals (a + c)/(b + d), and checks the case a = 1, c = 1, b = 1, d = 1, where the claim happens to hold. Give the smallest counterexample b for which the claim is false, still with a = 1, c = 1, and d = 1."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Compare the student's claim (a + c)/(b + d) with the correct product rule ac/(bd) from the definition-based proof. With a = 1, c = 1, d = 1 the claim gives 2/(b + 1) while the true product is 1/b. For b = 1 both sides equal 1, so the claim holds there. For b = 2 the claim gives 2/3 but the true product is 1/2, so the claim fails. The smallest counterexample is b = 2."
          - problem: "Claim: the sum of two rational numbers is rational. Step 1: Let r = a/b and s = c/d with a, b, c, d integers and b, d not 0. Step 2: Then r + s = (ad + bc)/(bd). Step 3: Since ad + bc and bd are integers, r + s is rational. Step 4: Also bd is not 0 because b and d are not 0. Which step is the first step that is not valid?"
            answer: "Step 3"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "Step 1 is a valid setup: it writes both numbers as quotients of integers with nonzero denominators. Step 2 is valid: it adds the fractions over the common denominator bd. Step 3 is the first invalid step: it concludes that r + s is rational from integrality alone, before the check that bd is not 0, but the definition of rational needs a nonzero denominator. Step 4 performs the needed check, but only after the conclusion has already been drawn. The answer is Step 3."
          - problem: "In a direct proof that the product of two rational numbers is rational, the key step produces rs = ac/(bd), and one closing line is missing. Select the closing line that completes the proof by the definition of a rational number."
            answer: "ac is an integer and bd is a nonzero integer"
            answer_contract: {"kind": "label", "options": [["ac is an integer and bd is a nonzero integer"], ["ac is an integer and bd is an integer"], ["ac is not 0 and bd is not 0"], ["b + d is a nonzero integer"]]}
            solution_sketch: "By the definition of rational, the closing line must show that rs = ac/(bd) is a quotient of an integer by a nonzero integer. The correct missing line is: ac is an integer and bd is a nonzero integer. The option ac is an integer and bd is an integer forgets the nonzero requirement on the denominator. The option ac is not 0 and bd is not 0 wrongly also demands a nonzero numerator, which the definition does not need. The option b + d is a nonzero integer checks a sum instead of the denominator bd. The answer is: ac is an integer and bd is a nonzero integer."
          - problem: "Write the full proof: the sum of two rational numbers is rational. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1 (setup): Let r and s be rational numbers. By the definition of rational, r = a/b and s = c/d with a, b, c, d integers and b, d not 0. Step 2 (combine): Add the fractions over the common denominator bd using the fraction-addition rule: r + s = (ad + bc)/(bd). Step 3 (numerator): ad + bc is an integer, because products and sums of integers are integers. Step 4 (denominator check): bd is an integer, and bd is not 0, because a product of two nonzero integers is not 0; this verifies the nonzero denominator that the definition requires. Step 5 (conclusion): r + s is a quotient of an integer by a nonzero integer, so r + s is rational by the definition of rational. The sum of two rational numbers is rational, as claimed."
        constraints: "use the definition rational = integer/nonzero-integer; verify the denominator is nonzero"
      - id: kp2
        name: "Differences and quotients"
        key_prerequisites: [direct-proof]
        exemplars:
          - problem: "In the proof that if r and r + s are rational then s is rational, let r = a/b and r + s = c/b with the same nonzero denominator b. Give s as a single fraction in a, b, c."
            answer: "(c-a)/b"
            answer_contract: {"kind": "function", "vars": ["a", "b", "c"]}
            solution_sketch: "Step 1 (closure under subtraction): s = (r + s) - r. Step 2 (common denominator): write r = a/b and r + s = c/b with b nonzero. Step 3 (subtract fractions): s = c/b - a/b = (c-a)/b, a ratio of integers with nonzero denominator. The answer is (c-a)/b."
          - problem: "In the proof that if r is rational and s is a nonzero rational then r/s is rational, consider the case r = a/b with b nonzero and s = c a nonzero integer. Give r/s as a single fraction in a, b, c."
            answer: "a/(bc)"
            answer_contract: {"kind": "function", "vars": ["a", "b", "c"]}
            solution_sketch: "Step 1 (quotient): r/s = (a/b)/c. Step 2 (reciprocal): dividing by c multiplies the denominator, so r/s = a/(bc). Step 3 (nonzero tracking): bc is nonzero because b and c are nonzero, so the denominator is valid. The answer is a/(bc)."
          - problem: "Let r = 2/3 and r + s = 5/4. Find s as a fraction."
            answer: "7/12"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 writes both numbers with denominator 12: 5/4 = 15/12 and 2/3 = 8/12. Step 2 uses closure under subtraction: s = 15/12 - 8/12 = 7/12. The answer is 7/12."
          - problem: "Let r = 3/5 and s = 2/7. Find r/s as a fraction."
            answer: "21/10"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 uses closure under division: r/s = (3/5)/(2/7). Step 2 multiplies by the reciprocal: 3/5 * 7/2. Step 3 multiplies fractions: 21/10. The answer is 21/10."
          - problem: "Let r = 5/6 and r + s = 1/3. Find s as a fraction."
            answer: "-1/2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 writes both numbers with denominator 6: 1/3 = 2/6 and 5/6 = 5/6. Step 2 uses closure under subtraction: s = 2/6 - 5/6 = -3/6. Step 3 simplifies to -1/2. The answer is -1/2."
          - problem: "Claim: if r and r + s are rational, then s is rational. Step 1: write r = a/b and r + s = c/d with nonzero denominators. Step 2: subtract the given numbers, s = c/d - a/b. Step 3: subtract numerators and denominators, s = (c - a)/(d - b). Step 4: c - a and d - b are integers, so s is rational. Which step is the first step that is not valid?"
            answer: "Step 3"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "Step 1 is valid: every rational number is a ratio of integers with a nonzero denominator. Step 2 is valid: s = (r + s) - r. Step 3 is not valid: fractions are subtracted over a common denominator, c/d - a/b = (cb - ad)/(db), never (c - a)/(d - b). Step 4 only inherits the error of Step 3 and also never checks that d - b is nonzero. The answer is Step 3."
          - problem: "Write the full proof: if r is rational and s is a nonzero rational, then r/s is rational. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1 (hypothesis): assume r is rational and s is a nonzero rational. Write r = a/b and s = c/d with integers a, b, c, d and b, d nonzero. Step 2 (nonzero): since s is nonzero, c is nonzero. Step 3 (division): r/s = (a/b)/(c/d). Step 4 (reciprocal): multiply by d/c to get r/s = ad/(bc). Step 5 (closure): ad and bc are integers, and bc is nonzero because b, c, d are nonzero. Step 6 (conclusion): r/s is a ratio of integers with nonzero denominator, so r/s is rational. This proves the statement."
        constraints: "closure under subtraction and division by nonzero; track which quantities are nonzero"
      - id: kp3
        name: "Averages and density"
        key_prerequisites: [direct-proof]
        exemplars:
          - problem: "A proof that the average of two rationals is rational contains the step: form (r + s)/2 for the given rationals r = 2/3 and s = 3/4. Give the number this step produces, as a fraction."
            answer: "17/24"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: closure under addition gives r + s = 2/3 + 3/4 = 8/12 + 9/12 = 17/12, which is rational. Step 2: 2 is a nonzero rational, so closure under division by a nonzero rational gives (r + s)/2 = (17/12)/2 = 17/24. The average produced by the proof step is 17/24."
          - problem: "In a proof that between any two distinct rationals r < s there is another rational, a step forms the midpoint (r + s)/2 with r = -1/4 and s = 1/2. Give the number this step produces, as a fraction."
            answer: "1/8"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: closure under addition gives r + s = -1/4 + 1/2 = -1/4 + 2/4 = 1/4. Step 2: dividing by the nonzero rational 2 keeps the value rational, so the midpoint is (1/4)/2 = 1/8. Step 3: since r < s, adding r or s to both sides and halving justifies r < midpoint < s. The midpoint produced by the density step is 1/8."
          - problem: "A proof that r < (r + s)/2 for rationals r < s justifies the ordering by checking the difference (r + s)/2 - r. For r = 2/5 and s = 7/10, give this difference, as a fraction."
            answer: "3/20"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: the midpoint is rational by closure under addition and division by 2: (2/5 + 7/10)/2 = (11/10)/2 = 11/20. Step 2: to justify the lower inequality, form (r + s)/2 - r = (s - r)/2 = (7/10 - 2/5)/2 = (3/10)/2 = 3/20. A positive difference proves r < (r + s)/2. The step value is 3/20."
          - problem: "A proof that (2r + s)/3 < s for rationals r < s justifies the ordering by checking the difference s - (2r + s)/3. For r = 1/3 and s = 1, give this difference, as a fraction."
            answer: "4/9"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: (2r + s)/3 is rational by closure under multiplication, addition, and division by the nonzero rational 3: (2/3 + 1)/3 = (5/3)/3 = 5/9. Step 2: to justify the upper inequality, form s - (2r + s)/3 = (2s - 2r)/3 = 2(1 - 1/3)/3 = 4/9. A positive difference proves (2r + s)/3 < s. The step value is 4/9."
          - problem: "A student proves: if r and s are rational with r < s, then (2r + s)/3 lies strictly between r and s. Step 1: r and s are rational by hypothesis. Step 2: 2r is rational by closure under multiplication, 2r + s is rational by closure under addition, and division by the nonzero rational 3 keeps it rational. Step 3: adding 2r to both sides of r < s gives 2r + s < 3r, hence (2r + s)/3 < r. Step 4: adding 2s to both sides of r < s gives 2r + s < 3s, hence (2r + s)/3 < s, so the point lies between r and s. Which step is the first step that is not valid?"
            answer: "Step 3"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "Step 1 restates the hypothesis and is valid. Step 2 correctly applies closure under multiplication by the integer 2, addition, and division by the nonzero rational 3. Step 3 is invalid: adding 2r to both sides of r < s gives 3r < 2r + s, hence r < (2r + s)/3; the student reversed the inequality direction. Step 4 is valid arithmetic on its own but supports the full ordering only together with the corrected Step 3. The answer is Step 3."
          - problem: "In a proof that the number (r + 2s)/3 lies strictly between the distinct rationals r and s, one line of the ordering argument is missing. The line before it reads: start from r < s and add 2s to both sides. Select the line that completes the proof."
            answer: "r + 2s < 3s, so (r + 2s)/3 < s"
            answer_contract: {"kind": "label", "options": [["r + 2s < 3s, so (r + 2s)/3 < s"], ["r + 2s < 3s, so (r + 2s)/3 > s"], ["2r + s < 3r, so (2r + s)/3 < r"], ["r + 2s > 3s, so (r + 2s)/3 > s"]]}
            solution_sketch: "Adding 2s to both sides of r < s gives r + 2s < s + 2s = 3s, and dividing by the positive rational 3 gives (r + 2s)/3 < s, which is the needed upper bound. The option with > s divides correctly but reverses the inequality direction. The option with 2r + s < 3r adds 2r instead of 2s and bounds a different expression. The option r + 2s > 3s flips the inequality when adding 2s. The answer is r + 2s < 3s, so (r + 2s)/3 < s."
          - problem: "Write the full proof: for any two distinct rational numbers r < s, the number (r + 2s)/3 is rational and lies strictly between r and s. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1 (hypothesis): let r and s be rational numbers with r < s. Step 2 (closure under multiplication and addition): 2s is rational by closure under multiplication by the integer 2, and r + 2s is rational by closure under addition. Step 3 (closure under division): 3 is a nonzero rational, so (r + 2s)/3 is rational by closure under division by a nonzero rational; this combines the closure facts proved earlier. Step 4 (lower bound): add 2r to both sides of r < s to get 3r < r + 2s, hence r < (r + 2s)/3. Step 5 (upper bound): add 2s to both sides of r < s to get r + 2s < 3s, hence (r + 2s)/3 < s. Step 6 (conclusion): r < (r + 2s)/3 < s, so (r + 2s)/3 is a rational number strictly between r and s, which proves the claim."
        constraints: "combine closure facts already proved; justify the ordering inequalities"
    diagnostic_exemplar:
      problem: 'Prove: if $r$ is rational and $r < 5$, then there is a rational number $t$ with $r < t < 5$.'
      answer: 'Take $t = \frac{r+5}{2}$. Writing $r = p/q$ with $p, q$ integers and $q \ne 0$ gives $t = \frac{p + 5q}{2q}$, a ratio of integers with nonzero denominator, so $t$ is rational. From $r < 5$: adding $r$ to both sides gives $2r < r + 5$, hence $r < t$; adding $5$ to both sides gives $r + 5 < 10$, hence $t < 5$. So $r < t < 5$.'
      solution_sketch: 'Use the midpoint: show it is rational by writing it as a single fraction, then obtain both inequalities from $r < 5$.'
    anki_seeds:
      - front: 'Definition of a rational number?'
        back: 'A real number expressible as $p/q$ with $p, q$ integers and $q \ne 0$.'
        type: basic
      - front: 'Which operations is $\mathbb{Q}$ closed under?'
        back: 'Addition, subtraction, multiplication, and division by a nonzero rational.'
        type: basic

  - id: divisibility-parity-proofs
    name: "Divisibility and Parity Proofs"
    core: true
    difficulty: 0.55
    drill: false
    answer_kind: proof
    expected_time_secs: 210
    prerequisites:
      - id: direct-proof
        weight: 0.5
        key: true
      - id: quantifiers
        weight: 0.2
      - id: divisibility-rules
        weight: 0.0
    knowledge_points:
      - id: kp1
        name: "Divisibility and linear combinations"
        key_prerequisites: [direct-proof]
        exemplars:
          - problem: "Suppose a | b and a | c, so b = a k and c = a l for integers k and l. Write 2b - c = a q. Give q as an expression in k and l."
            answer: "2k-l"
            answer_contract: {"kind": "function", "vars": ["k", "l"]}
            solution_sketch: "Start from b = a k and c = a l, which is the definition of divides. Substitute: 2b - c = 2ak - al (substitution). Factor a: 2b - c = a(2k - l) with 2k - l an integer (factoring and closure). The answer is 2k-l."
          - problem: "Suppose a | b, so b = a k for an integer k. Write b^2 = a q. Give q as a polynomial in a and k."
            answer: "ak^2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Write b = a k (definition of divides). Square: b^2 = a^2 k^2 (arithmetic). Factor a: b^2 = a(a k^2) with a k^2 an integer (factoring and closure). The answer is ak^2."
          - problem: "Suppose a | b and a | c, so b = a k and c = a l for integers k and l. Write b + c = a q. Give q as an expression in k and l."
            answer: "k+l"
            answer_contract: {"kind": "function", "vars": ["k", "l"]}
            solution_sketch: "Write b = a k and c = a l (definition of divides). Add: b + c = a k + a l (substitution). Factor a: b + c = a(k + l) with k + l an integer (factoring and closure). The answer is k+l."
          - problem: "Suppose a | b, so b = a k for an integer k. Write b^3 = a q. Give q as a polynomial in a and k."
            answer: "a^2k^3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Write b = a k (definition of divides). Cube: b^3 = a^3 k^3 (arithmetic). Factor a: b^3 = a(a^2 k^3) with a^2 k^3 an integer (factoring and closure). The answer is a^2k^3."
          - problem: "Claim: for all integers a, b, c, if a | b and a | c then a | (b + c + 1). Step 1: assume a | b and a | c, so b = a k and c = a l. Step 2: then b + c + 1 = a k + a l + 1 = a(k + l) + 1. Step 3: since a divides a(k + l), and a divides 1, a divides the sum. Step 4: therefore a | (b + c + 1). Which step is the first step that is not valid?"
            answer: "Step 3"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "Step 1 is the definition of divides and is correct. Step 2 substitutes and factors correctly. Step 3 is the first invalid step: a need not divide 1, for example a = 2 does not divide 1. Step 4 only restates Step 3, so its error is inherited. The answer is Step 3."
          - problem: "Consider the claim: for all integers a, b, c, if a divides b and a divides c then a divides b + c + 1. This claim is false. Give the smallest positive integer a for which integers b and c exist that make the claim false."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "For a = 1 the claim is true because 1 divides every integer (definition of divides). For a = 2, take b = 2 and c = 4: 2 divides 2 and 2 divides 4, but 2 does not divide 2 + 4 + 1 = 7 (counterexample). Thus the smallest is 2 (least counterexample). The answer is 2."
          - problem: "Write the full proof: for all integers a, b, c, x, y, if a | b and a | c then a | (b x + c y). Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1 (hypothesis): let a, b, c, x, y be integers with a | b and a | c. Step 2 (definition of divides): there are integers k and l with b = a k and c = a l. Step 3 (substitution): b x + c y = a k x + a l y. Step 4 (factoring): b x + c y = a(k x + l y). Step 5 (closure of integers): k x + l y is an integer, since products and sums of integers are integers. Step 6 (definition of divides): a | (b x + c y). Step 7 (conclusion): since the integers a, b, c, x, y were arbitrary, the statement holds for all integers. This completes the proof."
        constraints: "prove divisibility of linear combinations from the definition of divides"
      - id: kp2
        name: "Parity arguments"
        key_prerequisites: [direct-proof]
        exemplars:
          - problem: "For n = 2k + 1, write n + 1 in the form 2m with integer m. Give m as a formula in k."
            answer: "k+1"
            answer_contract: {"kind": "function", "vars": ["k"]}
            solution_sketch: "Start from n = 2k + 1, the odd parity form. Add 1: n + 1 = 2k + 2. Factor 2: n + 1 = 2(k + 1). Thus m = k + 1. The answer is k+1."
          - problem: "Let a = 2r be even and b = 2s + 1 be odd. Write a + b in the form 2t + 1. Give t."
            answer: "r+s"
            answer_contract: {"kind": "function", "vars": ["r", "s"]}
            solution_sketch: "Use the even parity form a = 2r and the odd parity form b = 2s + 1. Add: a + b = 2r + 2s + 1. Factor 2 from the even part: a + b = 2(r + s) + 1. Thus t = r + s. The answer is r+s."
          - problem: "For odd n = 2k + 1, write n + (n + 1) as 2m + 1. Give m."
            answer: "2k+1"
            answer_contract: {"kind": "function", "vars": ["k"]}
            solution_sketch: "Use n = 2k + 1, the odd parity form. The next integer is n + 1 = 2k + 2. Add them: n + (n + 1) = 4k + 3. Write 4k + 3 = 2(2k + 1) + 1. Thus m = 2k + 1. The answer is 2k+1."
          - problem: "Let a = 2r be even and b = 2s + 1 be odd. Write b - a as 2d + 1. Give d."
            answer: "s-r"
            answer_contract: {"kind": "function", "vars": ["r", "s"]}
            solution_sketch: "Use b = 2s + 1 for the odd integer and a = 2r for the even integer. Subtract: b - a = 2s + 1 - 2r. Group: b - a = 2(s - r) + 1. Thus d = s - r. The answer is s-r."
          - problem: "Claim: if n is odd, then n + 1 is even. Step 1: write n = 2k + 1 for an integer k. Step 2: then n + 1 = 2k + 2. Step 3: factor n + 1 = 2(k + 1). Step 4: since k + 1 can be odd, n + 1 is odd. Which step is the first step that is not valid?"
            answer: "Step 4"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "Step 1 uses the correct odd parity form n = 2k + 1. Step 2 adds 1 correctly to get n + 1 = 2k + 2. Step 3 factors out 2 correctly to get n + 1 = 2(k + 1). Step 4 is the first invalid step because k + 1 is an integer, so 2(k + 1) is even, not odd. The answer is Step 4."
          - problem: "In a proof that the sum of two odd integers is even, let n = 2a + 1 and m = 2b + 1. The line n + m = ___ is missing. Select the line that completes the proof."
            answer: "2(a+b+1)"
            answer_contract: {"kind": "label", "options": [["2(a+b)+1"], ["2(a+b+1)"], ["2(ab+1)"], ["2(a+b-1)"]]}
            solution_sketch: "Start with n = 2a + 1 and m = 2b + 1. Add: n + m = 2a + 2b + 2. Factor 2: n + m = 2(a + b + 1), so the sum is even. The option 2(a+b)+1 is odd and misses one +1; 2(ab+1) multiplies a and b instead of adding them; 2(a+b-1) subtracts 1 instead of adding 1. The answer is 2(a+b+1)."
          - problem: "Write the full proof: for all integers a and b, if a is even and b is odd, then a + b + 1 is even. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1: let a be even, so a = 2r for some integer r. Step 2: let b be odd, so b = 2s + 1 for some integer s. Step 3: add the expressions: a + b + 1 = 2r + (2s + 1) + 1. Step 4: simplify the right side: 2r + 2s + 2 = 2(r + s + 1). Step 5: r + s + 1 is an integer, so the result is 2 times an integer. Therefore a + b + 1 is even, completing the proof."
        constraints: "argue from the two parity forms of an integer"
      - id: kp3
        name: "Parity of squares and products"
        key_prerequisites: [direct-proof]
        exemplars:
          - problem: "For an odd integer n = 2k + 1, its square can be written n^2 = 2q + 1. Give q."
            answer: "2k^2+2k"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Expand the square: (2k + 1)^2 = 4k^2 + 4k + 1. Factor 2 from the first two terms: 2(2k^2 + 2k) + 1. The answer is 2k^2+2k."
          - problem: "For an even integer n = 2k, its square can be written n^2 = 2q. Give q."
            answer: "2k^2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Expand the square: (2k)^2 = 4k^2. Factor 2: 2(2k^2). The answer is 2k^2."
          - problem: "For odd integers m = 2a + 1 and n = 2b + 1, their product can be written mn = 2q + 1. Give q."
            answer: "2ab+a+b"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Expand the product: (2a + 1)(2b + 1) = 4ab + 2a + 2b + 1. Factor 2 from the first three terms: 2(2ab + a + b) + 1. The answer is 2ab+a+b."
          - problem: "Claim: for every integer n, n^2 is odd if and only if n is odd. Step 1: if n is odd, write n = 2k + 1. Step 2: then n^2 = 2(2k^2 + 2k) + 1, so n^2 is odd. Step 3: conversely, assume n^2 is odd and write n^2 = 2k + 1, so n = sqrt(2k + 1), which is odd. Step 4: therefore n is odd. Which step is the first step that is not valid?"
            answer: "Step 3"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "Step 1 is valid because an odd integer has the form 2k + 1. Step 2 is valid because squaring gives 2(2k^2 + 2k) + 1. Step 3 is invalid because n^2 = 2k + 1 does not imply n = sqrt(2k + 1) is an integer, let alone odd. Step 4 only follows from a correct converse. The answer is Step 3."
          - problem: "In a direct proof that the product of two odd integers is odd, the line after expanding (2a + 1)(2b + 1) is missing. Select the line that shows the product as twice an integer plus one."
            answer: "2(2ab+a+b)+1"
            answer_contract: {"kind": "label", "options": [["2(2ab+a+b)+1"], ["2(2ab+a+b)"], ["2(ab+a+b)+1"], ["4ab+2a+2b"]]}
            solution_sketch: "Expand: (2a + 1)(2b + 1) = 4ab + 2a + 2b + 1. Factor 2 from the first three terms: 2(2ab + a + b) + 1. The option 2(2ab+a+b) drops the final +1; 2(ab+a+b)+1 has a wrong expansion; 4ab+2a+2b drops the final +1. The answer is 2(2ab+a+b)+1."
          - problem: "For integers m and n with m = 2a, their product can be written mn = 2q. Give q in terms of a and n."
            answer: "an"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Let m = 2a. Multiply: mn = 2a n. Factor 2: the quotient is a n. The answer is an."
          - problem: "Write the full proof: for every integer n, n^2 is even if and only if n is even. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1 (forward): assume n is even, so n = 2k for an integer k. Then n^2 = 4k^2 = 2(2k^2), so n^2 is even. Step 2 (converse): prove the contrapositive; assume n is odd, so n = 2k + 1. Then n^2 = (2k + 1)^2 = 4k^2 + 4k + 1 = 2(2k^2 + 2k) + 1, which is odd. Thus if n^2 is even, n cannot be odd, so n is even. Step 3 (conclusion): both directions hold, so n^2 is even if and only if n is even."
        constraints: "iff proof; handle both directions"
    diagnostic_exemplar:
      problem: 'Prove: for all integers $m, n$, if $m$ and $n$ are both odd then $4 \mid (m^2 + n^2 - 2)$.'
      answer: 'Write $m = 2a + 1$ and $n = 2b + 1$ with $a, b$ integers. Then $m^2 + n^2 - 2 = (4a^2 + 4a + 1) + (4b^2 + 4b + 1) - 2 = 4(a^2 + a + b^2 + b)$. Since $a^2 + a + b^2 + b$ is an integer, $4 \mid (m^2 + n^2 - 2)$.'
      solution_sketch: 'Substitute the odd forms, expand both squares, and factor $4$ out of what remains.'
    anki_seeds:
      - front: 'Definition: $a \mid b$ ("$a$ divides $b$")?'
        back: 'There is an integer $k$ with $b = ak$ (with $a \ne 0$).'
        type: basic
      - front: 'To prove $a \mid (bx + cy)$ from $a \mid b$ and $a \mid c$...'
        back: 'Write $b = ak$, $c = al$, then factor: $bx + cy = a(kx + ly)$.'
        type: basic

  - id: proof-by-cases
    name: "Proof by Cases"
    core: true
    difficulty: 0.55
    drill: false
    answer_kind: proof
    expected_time_secs: 200
    prerequisites:
      - id: direct-proof
        weight: 0.5
        key: true
      - id: divisibility-parity-proofs
        weight: 0.3
      - id: logical-equivalence
        weight: 0.2
      - id: quantifiers
        weight: 0.0
    knowledge_points:
      - id: kp1
        name: "Exhaustive cases on parity"
        key_prerequisites: [direct-proof]
        exemplars:
          - problem: "In the proof that $n^2 + n$ is even, the even case writes $n = 2k$, and then $n^2 + n = 2\\,q(k)$. Give $q(k)$."
            answer: "2k^2+k"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Substitute the even case $n = 2k$ (case hypothesis). Expand by the distributive law: $n^2 + n = 4k^2 + 2k$. Factor the common factor $2$ from both terms: $4k^2 + 2k = 2(2k^2 + k)$, so the even case concludes with an even value. The quotient is $q(k) = 2k^2+k$."
          - problem: "In the proof that $3n^2 + n$ is even, the odd case writes $n = 2k + 1$, and then $3n^2 + n = 2\\,q(k)$. Give $q(k)$."
            answer: "6k^2+7k+2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Substitute the odd case $n = 2k + 1$ (case hypothesis). Expand by the distributive law: $3(4k^2 + 4k + 1) + 2k + 1 = 12k^2 + 14k + 4$. Factor the common factor $2$: $2(6k^2 + 7k + 2)$, so the odd case concludes with an even value. The quotient is $q(k) = 6k^2+7k+2$."
          - problem: "In the proof that $n^2 + 5n$ is even, the even case writes $n = 2k$, and then $n^2 + 5n = 2\\,q(k)$. Give $q(k)$."
            answer: "2k^2+5k"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Substitute the even case $n = 2k$ (case hypothesis). Expand by the distributive law: $n^2 + 5n = 4k^2 + 10k$. Factor the common factor $2$ from both terms: $4k^2 + 10k = 2(2k^2 + 5k)$, so the even case concludes with an even value. The quotient is $q(k) = 2k^2+5k$."
          - problem: "A student claims that $4$ divides $n^2 + n + 2$ for every integer $n$ at least $1$ and checks only $n = 1$. Give the smallest $n$ at least $1$ for which the claim is false."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Test the claim in order of $n$ (direct check of each case). At $n = 1$ the value $n^2 + n + 2$ is $4$, a multiple of $4$. At $n = 2$ the value is $8$, a multiple of $4$. At $n = 3$ the value is $14$, which leaves remainder $2$ on division by $4$. The smallest counterexample is $n = 3$."
          - problem: "Claim: $n^2 + n + 1$ is even for every integer $n$. Step 1: if $n$ is even, write $n = 2k$; then $n^2 + n + 1 = 4k^2 + 2k + 1 = 2(2k^2 + k) + 1$, an odd number. Step 2: if $n$ is odd, write $n = 2k + 1$; then $n^2 + n + 1 = 4k^2 + 6k + 3 = 2(2k^2 + 3k) + 3$. Step 3: the number $2(2k^2 + 3k)$ is even, so the number $2(2k^2 + 3k) + 3$ is even. Step 4: both cases give an even value, so $n^2 + n + 1$ is even for every integer $n$. Which step is the first step that is not valid?"
            answer: "Step 3"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "Step 1 is valid: with $n = 2k$ the value is $2(2k^2 + k) + 1$, and the step correctly finds it odd. Step 2 is valid: with $n = 2k + 1$ the value is $(2k+1)^2 + (2k+1) + 1 = 4k^2 + 6k + 3 = 2(2k^2 + 3k) + 3$. Step 3 is false: an even number plus $3$, an odd number, is odd, not even. Step 4 would follow from Steps 1 to 3, but it carries the error of Step 3 and ignores the odd result of Step 1. The answer is Step 3."
          - problem: "In the odd case of a proof that $n^2 + 3n$ is even, the line after the substitution $n = 2k + 1$ is missing. Select the completed line that is equal to $n^2 + 3n$."
            answer: "2(2k^2+5k+2)"
            answer_contract: {"kind": "label", "options": [["2(2k^2+5k+2)"], ["2(2k^2+5k+3)"], ["2(2k^2+3k+2)"], ["(2k^2+5k+2)"]]}
            solution_sketch: "With $n = 2k + 1$ the substitution rule gives $(2k+1)^2 + 3(2k+1) = 4k^2 + 4k + 1 + 6k + 3 = 4k^2 + 10k + 4$. Factoring the common $2$ gives $2(2k^2 + 5k + 2)$. The option $2(2k^2+5k+3)$ comes from an arithmetic slip in the constant term, since $1 + 3 = 4$ and $4/2 = 2$. The option $2(2k^2+3k+2)$ miscollects the linear terms, dropping the contribution of $3n$. The option $(2k^2+5k+2)$ drops the factor $2$ and is not equal to the original value. The answer is 2(2k^2+5k+2)."
          - problem: "Write the full proof: for every integer $n$, $n^3 + 5n$ is even. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1 (case split): every integer $n$ is even or odd, so the two cases $n = 2k$ and $n = 2k + 1$ are exhaustive. Step 2 (even case): write $n = 2k$. Then $n^3 + 5n = 8k^3 + 10k = 2(4k^3 + 5k)$, a multiple of $2$, so it is even; the even case concludes. Step 3 (odd case): write $n = 2k + 1$. Then $n^3 + 5n = (8k^3 + 12k^2 + 6k + 1) + (10k + 5) = 8k^3 + 12k^2 + 16k + 6 = 2(4k^3 + 6k^2 + 8k + 3)$, a multiple of $2$, so it is even; the odd case concludes. Step 4 (conclusion): both exhaustive cases give an even value, so $n^3 + 5n$ is even for every integer $n$."
        constraints: "cases must be exhaustive; conclude in each case"
      - id: kp2
        name: "Cases from sign or absolute value"
        key_prerequisites: [direct-proof]
        exemplars:
          - problem: "To prove by cases on the sign that for all real $x$, $|x| \\ge x$, in the case $x < 0$ write $|x|$ as an expression in $x$. Give the expression."
            answer: "-x"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Split on the sign of x. In the case x < 0, the definition of absolute value gives |x| = -x. This expression is a polynomial in x. The answer is -x."
          - problem: "To prove by cases on the sign that for all real $x$, $x \\le |x|$, in the case $x < 0$ write $|x| - x$ as a single expression in $x$. Give the expression."
            answer: "-2x"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Split on the sign of x. In the case x < 0, |x| = -x, so |x| - x = -x - x. Combining like terms gives -2x, which is positive in this case. The answer is -2x."
          - problem: "The claim 'for every integer $n$, $|n| = n$' is false. Find the smallest integer $n$ for which it fails."
            answer: "-1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Test integers from 0 downward. n = 0 gives |0| = 0, so the claim holds there. n = -1 gives |-1| = 1, which is not -1, so the claim fails. The answer is -1."
          - problem: "To prove by cases on the sign that for all real $x$, $|x| - x$ is never negative, in the case $x \\ge 0$ write $|x| - x$ as a single simplified expression in $x$. Give the expression."
            answer: "0"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Split on the sign of x. In the case x >= 0, the definition of absolute value gives |x| = x. Substitute: |x| - x = x - x. Combine like terms to get the constant 0, which is never negative, so the claim holds in this case. The answer is 0."
          - problem: "In the proof by cases of $|x| \\ge x$ for the nonnegative case, the line after $x \\ge 0$ is missing. Select the missing line."
            answer: "|x| = x"
            answer_contract: {"kind": "label", "options": [["|x| = x"], ["|x| = -x"], ["|x| > x"], ["|x| < x"]]}
            solution_sketch: "In the nonnegative case, the definition of absolute value gives |x| = x, so the claim holds with equality. Option |x| = -x belongs to the negative case. Option |x| > x adds a strict inequality that fails at zero. Option |x| < x contradicts the claim. The answer is |x| = x."
          - problem: "In the proof by cases that $|x| + x$ is never negative, the negative case uses $|x| = -x$. Which case assumption does the step $|x| + x = -x + x$ use?"
            answer: "x < 0"
            answer_contract: {"kind": "label", "options": [["x < 0"], ["x >= 0"], ["x = 0"], ["x > 0"]]}
            solution_sketch: "The step replaces |x| by -x, which is the definition of absolute value only when x < 0. Option x >= 0 and option x > 0 give |x| = x, not -x. Option x = 0 also gives |x| = x, so the step is not justified there either. The answer is x < 0."
          - problem: "Write the full proof: for all real $x$, $|x| + x \\ge 0$. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1: split on the sign of x. Step 2: if x >= 0, then |x| = x, so |x| + x = 2x, and 2x >= 0. Step 3: if x < 0, then |x| = -x, so |x| + x = -x + x = 0, and 0 >= 0. Step 4: the two cases cover every real x, so in every case |x| + x >= 0. This completes the proof."
        constraints: "split on the sign; cover $x \\ge 0$ and $x < 0$"
      - id: kp3
        name: "Cases modulo n"
        key_prerequisites: [divisibility-parity-proofs]
        exemplars:
          - problem: "In the case $n = 4q + 2$ of the proof that $4$ divides $n^2$, expand $n^2$ and write it as $4s$. Give $s$ as a polynomial in $q$."
            answer: "4q^2+4q+1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Expand the case with the binomial expansion: $n = 4q + 2$ gives $n^2 = 16q^2 + 16q + 4$. Factor out $4$ by the distributive rule: $n^2 = 4(4q^2 + 4q + 1)$, a multiple of $4$, so $n^2 \\equiv 0 \\pmod 4$ in this case. The value of $s$ is 4q^2+4q+1."
          - problem: "In the odd case $n = 2k + 1$ of the proof that $n^2 + n + 1$ is odd, write $n^2 + n + 1 = 2m + 1$. Give $m$ as a polynomial in $k$."
            answer: "2k^2+3k+1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Substitute the odd case $n = 2k + 1$ into $n^2 + n + 1$ and collect terms: $4k^2 + 6k + 3$. Factor out $2$: $2(2k^2 + 3k + 1) + 1$, which is odd. Thus $m$ = 2k^2+3k+1."
          - problem: "In the case $n = 3q + 1$ of the proof that $n^2$ leaves remainder $1$ upon division by $3$, write $n^2 = 3s + 1$. Give $s$ as a polynomial in $q$."
            answer: "3q^2+2q"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Expand the case with the binomial expansion: $n = 3q + 1$ gives $n^2 = 9q^2 + 6q + 1$. Split off the remainder by factoring $3$ from the first terms: $n^2 = 3(3q^2 + 2q) + 1$. The value of $s$ is 3q^2+2q."
          - problem: "In the case $n = 5q + 4$ of the proof that $5$ divides $n^2 - 1$, write $n^2 - 1 = 5s$. Give $s$ as a polynomial in $q$."
            answer: "5q^2+8q+3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Expand with the binomial expansion: $n = 5q + 4$ gives $n^2 = 25q^2 + 40q + 16$, so $n^2 - 1 = 25q^2 + 40q + 15$. Factor out $5$: $n^2 - 1 = 5(5q^2 + 8q + 3)$, so $5$ divides $n^2 - 1$ in this case. The value of $s$ is 5q^2+8q+3."
          - problem: "Claim: for every integer $n$, $n^2 \\equiv 0$ or $1 \\pmod 4$. Step 1: every integer is even or odd. Step 2: if $n = 2k$, then $n^2 = 4k^2$, so $n^2 \\equiv 0 \\pmod 4$. Step 3: if $n = 2k + 1$, then $n^2 = 2k^2 + 2k + 1$, so $n^2 \\equiv 1 \\pmod 4$. Step 4: both cases give $0$ or $1$, so the claim holds. Which step is the first step that is not valid?"
            answer: "Step 3"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "Step 1 correctly splits the integers into the even and odd cases. Step 2 is correct: even $n = 2k$ gives $n^2 = 4k^2$, a multiple of $4$. Step 3 is false: odd $n = 2k + 1$ gives $n^2 = 4k^2 + 4k + 1$, not $2k^2 + 2k + 1$; the error is dropping the cross term $4k$. Step 4 would follow from the corrected cases. The answer is Step 3."
          - problem: "In the proof by cases for $n = 3q + 2$, the line $n^2 = \\;?$ is missing. Select the line that shows $n^2$ as a multiple of $3$ plus $1$."
            answer: "3(3q^2+4q+1)+1"
            answer_contract: {"kind": "label", "options": [["3(3q^2+4q+1)+1"], ["3(3q^2+4q)+4"], ["3(3q^2+2q+1)+1"], ["3(3q^2+4q+1)+2"]]}
            solution_sketch: "Expand $n = 3q + 2$ with the binomial expansion: $n^2 = 9q^2 + 12q + 4$. Write this as $3(3q^2 + 4q + 1) + 1$, a multiple of $3$ plus $1$. The option $3(3q^2 + 4q) + 4$ is the error of not folding the $4$ into the multiple of $3$. The option $3(3q^2 + 2q + 1) + 1$ is the error of a wrong middle coefficient. The option $3(3q^2 + 4q + 1) + 2$ is the error of a wrong remainder. The missing line is 3(3q^2+4q+1)+1."
          - problem: "Write the full proof: for every integer $n$, $n^2 \\equiv 0$ or $1 \\pmod 4$. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Proof by cases on the remainder of $n$ modulo $4$. Case 1: $n = 4q$. Then $n^2 = 16q^2 = 4(4q^2)$, so $n^2 \\equiv 0 \\pmod 4$. Case 2: $n = 4q + 1$. Then $n^2 = 16q^2 + 8q + 1 = 4(4q^2 + 2q) + 1$, so $n^2 \\equiv 1 \\pmod 4$. Case 3: $n = 4q + 2$. Then $n^2 = 16q^2 + 16q + 4 = 4(4q^2 + 4q + 1)$, so $n^2 \\equiv 0 \\pmod 4$. Case 4: $n = 4q + 3$. Then $n^2 = 16q^2 + 24q + 9 = 4(4q^2 + 6q + 2) + 1$, so $n^2 \\equiv 1 \\pmod 4$. Every integer falls into exactly one of these four residue cases, and each case gives $n^2 \\equiv 0$ or $1 \\pmod 4$. Combining the cases, the claim holds for every integer $n$."
        constraints: "cases determined by residue; combine into the claim"
    diagnostic_exemplar:
      problem: 'Prove by cases on the remainder of $n$ modulo $3$: for every integer $n$, $n^2 \equiv 0$ or $1 \pmod 3$.'
      answer: 'Every integer has the form $3k$, $3k+1$ or $3k+2$. If $n = 3k$ then $n^2 = 9k^2 = 3(3k^2) \equiv 0$. If $n = 3k+1$ then $n^2 = 9k^2 + 6k + 1 = 3(3k^2 + 2k) + 1 \equiv 1$. If $n = 3k+2$ then $n^2 = 9k^2 + 12k + 4 = 3(3k^2 + 4k + 1) + 1 \equiv 1$. The three cases are exhaustive, so $n^2 \equiv 0$ or $1 \pmod 3$ for every integer $n$.'
      solution_sketch: 'Split on the three possible remainders, square each form, and read off the remainder; note that the cases cover every integer.'
    anki_seeds:
      - front: 'When is a proof by cases valid?'
        back: 'When the cases are exhaustive (cover every possibility) and each case yields the conclusion.'
        type: basic

