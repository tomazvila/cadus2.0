        key_prerequisites: [direct-proof]
        exemplars:
          - problem: "The equation 3x + 5y = 1 has integer solutions. Give the solution with the smallest positive x as (x, y)."
            answer: "(2, -1)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "The claim to witness is that integers x, y with 3x + 5y = 1 exist. Step 1, witness search: 3x = 1 - 5y, so try y = -1, giving 3x = 6 and x = 2. Step 2, verification: 3(2) + 5(-1) = 6 - 5 = 1, and x = 2 is the smallest positive value that works. The witness is (2, -1)."
          - problem: "There are positive integers a, b, c with a^2 = b^2 + c^2 and a = 13. Give the triple with b < c as (a, b, c)."
            answer: "(13, 5, 12)"
            answer_contract: {"arity": 3, "kind": "coordinates"}
            solution_sketch: "The claim to witness is that 13^2 is a sum of two squares. Step 1, witness choice: take b = 5 and c = 12, which satisfies b < c. Step 2, verification: 5^2 + 12^2 = 25 + 144 = 169 = 13^2. The witness triple is (13, 5, 12)."
          - problem: "Construct a witness to the claim that some positive integer n satisfies n^2>10n+1. Give the smallest such positive n."
            answer: "11"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Apply the definition to arbitrary elements and derive the required expression. The resulting answer is 11."
          - problem: "Find the smallest positive integer n such that n^2 + n + 1 is divisible by 7."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The property is that 7 divides n^2 + n + 1. Step 1, witness search: n = 1 gives 3, which is not divisible by 7. Step 2, verification: n = 2 gives 4 + 2 + 1 = 7, and 7 divides 7, so the witness is confirmed. The smallest positive integer is 2."
          - problem: "A witness is needed to prove that some positive rational number q satisfies q^2 = 25/16. Give that rational q as a fraction."
            answer: "5/4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The property is q^2 = 25/16 for a positive rational q. Step 1, witness choice: take q = 5/4, since 5^2 = 25 and 4^2 = 16. Step 2, verification: (5/4)^2 = 25/16, so the witness satisfies the property. The positive rational witness is 5/4."
          - problem: "Construct an integer witness n to n^3-4n=15. Give the smallest integer witness, and verify it by substitution."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The polynomial factors as (n-3)(n^2+3n+5), whose quadratic factor has negative discriminant. Thus n=3 is the only real root and is an integer witness, verified by 27-12=15. The encoded answer is 3."
