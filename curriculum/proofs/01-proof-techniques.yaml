            answer: 'Witness: $x = 2$, $y = -1$, since $6 - 5 = 1$.'
            solution_sketch: 'An existence claim is proved by a single verified witness: $3(2) + 5(-1) = 1$. $\square$'
          - problem: 'Prove: some perfect square is the sum of two other perfect squares.'
            answer: 'Witness: $25 = 9 + 16$.'
            solution_sketch: '$5^2 = 3^2 + 4^2$; exhibiting and checking the witness completes the proof. $\square$'
        constraints: "name an explicit witness and verify it satisfies the property"
      - id: kp2
        name: "Constructive families"
        key_prerequisites: [direct-proof]
        exemplars:
          - problem: "Find the smallest three consecutive composite integers greater than 20. Give the three numbers in increasing order."
            answer: "24, 25, 26"
            answer_contract: {"kind": "list", "member": {"kind": "exact"}, "ordered": true}
            solution_sketch: "Check runs greater than 20: 21, 22, 23 include the prime 23; 22, 23, 24 include 23; 23, 24, 25 include 23; 24, 25, 26 have 24 = 2^3 * 3, 25 = 5^2, and 26 = 2 * 13, so all three are composite. The answer is 24, 25, 26."
          - problem: "For n = 5, the construction gives (n+1)! + 2 as the first of five consecutive composite numbers. Compute this first number."
            answer: "722"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Use the construction (n+1)! + 2. For n = 5, compute 6! + 2. Since 6! = 720, the first number is 720 + 2 = 722. The answer is 722."
          - problem: "For n = 4, the construction gives a block of four consecutive composite numbers ending at (n+1)! + (n+1). Find the last number in this block."
            answer: "125"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Use the construction (n+1)! + (n+1). For n = 4, compute 5! + 5. Since 5! = 120, the last number is 120 + 5 = 125. The answer is 125."
          - problem: "For n = 6, the construction gives seven consecutive composite numbers from (n+1)! + 2 through (n+1)! + (n+1). Compute the last number in this block."
            answer: "5047"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Use the construction (n+1)! + (n+1). For n = 6, compute 7! + 7. Since 7! = 5040, the last number is 5040 + 7 = 5047. The answer is 5047."
          - problem: "Claim: for every n >= 1, the numbers (n+1)!+2 through (n+1)!+(n+1) are composite. Step 1: Let n >= 1. Step 2: For each k with 2 <= k <= n+1, k is a factor of (n+1)!. Step 3: Therefore (n+1)!+k = k((n+1)!/k), so k divides (n+1)!+k. Step 4: Since (n+1)!+k > k, each number is composite, so the claim holds. Which step is the first step that is not valid?"
            answer: "Step 3"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "Step 1 is valid because it fixes an arbitrary n. Step 2 is valid because every k from 2 to n+1 is a factor of (n+1)!. Step 3 is false because (n+1)!+k = k((n+1)!/k + 1), not k((n+1)!/k). Step 4 would follow only after the corrected Step 3. The answer is Step 3."
          - problem: "In the verification that (n+1)!+k is composite, one algebraic line is missing: (n+1)!+k = ?. Select the line that shows k as a factor of (n+1)!+k."
            answer: "k((n+1)!/k + 1)"
            answer_contract: {"kind": "label", "options": [["k((n+1)!/k + 1)"], ["k((n+1)!/k)"], ["(k+1)((n+1)!/k)"], ["k((n+1)! + 1)"]]}
            solution_sketch: "Option k((n+1)!/k) is the error of forgetting the added k. Option (k+1)((n+1)!/k) is the error of using k+1 as the factor. Option k((n+1)! + 1) is the error of not adding 1 inside the parentheses. The correct line is k((n+1)!/k + 1) because (n+1)! = k((n+1)!/k), so adding k gives k((n+1)!/k + 1). The answer is k((n+1)!/k + 1)."
          - problem: "Write the full proof: for every n >= 1 there exist n consecutive composite numbers. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Claim: for every n >= 1 there are n consecutive composite numbers. Step 1: fix an arbitrary n >= 1. Step 2: consider the n numbers (n+1)!+2, (n+1)!+3, ..., (n+1)!+(n+1). Step 3: for each k with 2 <= k <= n+1, k is a factor of (n+1)!, so (n+1)! = k q for some integer q. Step 4: then (n+1)!+k = k(q+1), and since q+1 >= 2, this number is composite. Step 5: the n numbers are consecutive because each is the previous one plus one. Since n was arbitrary, the construction works for every n >= 1."
        constraints: "the construction must come with a verification that it works for every parameter value"
      - id: kp3
        name: "Nonconstructive existence"
        key_prerequisites: [proof-by-contradiction]
        exemplars:
          - problem: "In the case-split proof that some irrational numbers a and b have a rational value of a^b, let t = sqrt(2)^sqrt(2) and suppose t is irrational. The proof then takes a = t and b = sqrt(2), so a^b = (sqrt(2)^sqrt(2))^sqrt(2). Find the value of a^b."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Case check: the hypothesis of the second case says t = sqrt(2)^sqrt(2) is irrational, so a = t and b = sqrt(2) are both irrational. Power rule for exponents, (x^m)^n = x^(mn): the full object a^b = (sqrt(2)^sqrt(2))^sqrt(2) = sqrt(2)^(sqrt(2) * sqrt(2)). Exponent product: sqrt(2) * sqrt(2) = 2, so a^b = sqrt(2)^2. The value of a^b is 2."
          - problem: "To prove that among any three integers there are two whose sum is even, the argument places each integer into one of two parity classes. Give the smallest number of integers that guarantees two of them share a class."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Full object: the two parity classes, even and odd, hold the integers (sorting step). Pigeonhole principle: k objects in 2 classes force a shared class exactly when k is larger than the number of classes. Two integers can be one even and one odd, so two do not force a pair; a third must land in an occupied class. The smallest number of integers is 3."
          - problem: "In the proof that among any 25 integers there are two whose difference is divisible by 8, the integers are placed into the 8 remainder classes modulo 8. The counting step writes 25 = 8*3 + 1 and concludes that some class holds at least 3 + 1 integers. Find the value of 3 + 1."
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Full object: the 25 integers are distributed over the 8 remainder classes modulo 8. Counting step: 25 = 8*3 + 1, so if every class held at most 3 integers the total would be at most 24, one short of 25, a contradiction. Hence some class holds at least 3 + 1 integers, and two integers of that class differ by a multiple of 8. The value of 3 + 1, and so the guaranteed class size, is 4."
          - problem: "In a case split for irrational numbers a and b with a^b rational, set a = sqrt(2)^sqrt(2) and b = sqrt(18) = 3sqrt(2), both irrational. The check that a^b is rational needs the exponent product sqrt(2)*sqrt(18). Find the value of sqrt(2)*sqrt(18)."
            answer: "6"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Case check: a = sqrt(2)^sqrt(2) is the assumed irrational base and b = sqrt(18) = 3sqrt(2) is irrational, so the pair is admissible. Product rule for radicals: sqrt(2)*sqrt(18) = sqrt(36). Value: sqrt(36) = 6, and then a^b = sqrt(2)^6 = 8 by the power rule, which is rational. The value of sqrt(2)*sqrt(18) is 6."
          - problem: "Claim: there exist irrational numbers a and b such that a^b is rational. Step 1: let t = sqrt(2)^sqrt(2). Step 2: if t is rational, take a = sqrt(2) and b = sqrt(2), and then a^b = t is rational. Step 3: if t is irrational, take a = t and b = 2, and both a and b are irrational. Step 4: in the second case a^b = t^2, which is rational, so the claim holds. Which step is the first step that is not valid?"
            answer: "Step 3"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "Step 1 only defines t = sqrt(2)^sqrt(2) and is valid. Step 2 is a valid case: sqrt(2) is irrational and a^b = t is rational by the case assumption. Step 3 is the first invalid step: it asserts that b = 2 is irrational, but 2 is rational, so the pair fails the requirement that both numbers be irrational; a correct choice is b = sqrt(2). Step 4 inherits the error of Step 3 and additionally asserts the rationality of t^2 without proof, so it is not the first invalid step. The first step that is not valid is Step 3."
          - problem: "In the proof that for some n, any collection of n integers includes two whose difference is divisible by 9, the integers are placed into the nine remainder classes modulo 9. Give the smallest value of n that guarantees two integers share a class."
            answer: "10"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Full object: the nine remainder classes modulo 9 hold the integers (sorting step). Pigeonhole principle: n objects in 9 classes force a shared class exactly when n is larger than 9. Nine integers can carry the nine different remainders, so 9 does not force a pair, and 8 is even smaller; 11 is larger than the guarantee needs. The smallest value of n is 10."
          - problem: "Write the full proof: for any 7 integers, there are two whose difference is divisible by 6. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Claim: among any 7 integers there are two whose difference is divisible by 6. Step 1 (explicit counting): place each of the 7 integers into one of the six remainder classes modulo 6, according to its remainder on division by 6. Step 2 (counting): if every class contained at most one integer, the total number of integers would be at most 6, contradicting the 7 integers given. Step 3 (pigeonhole conclusion): therefore some one class contains at least two of the integers; call them x and y. Step 4 (divisibility): since x and y lie in the same class, x = 6q + r and y = 6s + r for the same remainder r, so x - y = 6(q - s), which is divisible by 6. Step 5 (nonconstructive character): the argument proves that such a pair exists among any 7 integers without identifying which two integers form the pair, exactly the case-split and counting existence the KP requires. The proof is complete."
        constraints: "the argument may not identify the witness; make the case split or counting explicit"
    diagnostic_exemplar:
      problem: 'Prove: among any five integers, there are two whose difference is divisible by $4$.'
      answer: 'Every integer leaves one of the four remainders $0, 1, 2, 3$ on division by $4$. Given five integers, two of them must leave the same remainder, since there are only four remainders available. If $a = 4s + r$ and $b = 4t + r$ share the remainder $r$, then $a - b = 4(s - t)$, so $4 \mid (a - b)$. This proves existence without exhibiting the pair — a nonconstructive existence proof.'
      solution_sketch: 'Classify the integers by remainder mod $4$; with five integers and four classes two must share a class, and equal remainders make the difference a multiple of $4$.'
    anki_seeds:
      - front: 'Constructive vs. nonconstructive existence proof?'
        back: 'Constructive: exhibit and verify an explicit witness. Nonconstructive: show a witness must exist without identifying it.'
        type: basic
      - front: 'What suffices to prove $\exists x\, P(x)$?'
        back: 'One witness $c$ together with a verification that $P(c)$ holds.'
        type: basic

  - id: uniqueness-proofs
    name: "Uniqueness Proofs"
    core: true
    difficulty: 0.62
    drill: false
    answer_kind: proof
    expected_time_secs: 220
    prerequisites:
      - id: existence-proofs
        weight: 0.5
        key: true
      - id: contradiction-template
        weight: 0.3
      - id: direct-proof
        weight: 0.2
    knowledge_points:
      - id: kp1
        name: "The two-solutions template"
        key_prerequisites: [direct-proof]
        exemplars:
          - problem: "A uniqueness proof for the equation 6x + 5 = 29 begins by finding one solution. Assume y is a second solution of 6y + 5 = 29. Give y."
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Existence step: x = 4 solves 6x + 5 = 29 because 6(4) + 5 = 29. Uniqueness step: if 6y + 5 = 29, subtract 5 to get 6y = 24, then divide by 6 to get y = 4. Any two solutions are equal. The answer is 4."
          - problem: "To prove that a positive real number with square 25 is unique, suppose x > 0 and y > 0 both satisfy x^2 = 25 and y^2 = 25. Subtracting gives x^2 - y^2 = 0. Give the factored form of x^2 - y^2 as a function of x and y."
            answer: "(x-y)(x+y)"
            answer_contract: {"kind": "function", "vars": ["x", "y"]}
            solution_sketch: "Difference of squares step: x^2 - y^2 factors as (x - y)(x + y). Uniqueness step: since x and y are positive, x + y > 0, so the factor x - y must be 0, giving x = y. The answer is (x-y)(x+y)."
          - problem: "For a uniqueness proof that the positive solution of x^2 = 36 is unique, suppose x and y are positive solutions. Then x^2 = y^2, so (x - y)(x + y) = 0. Give the value of x - y."
            answer: "0"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The factored equation is (x - y)(x + y) = 0. Since x and y are positive, x + y is positive and cannot be zero, so the product is zero only when x - y = 0. The answer is 0."
          - problem: "In a uniqueness proof for the intersection of y = 4x - 1 and y = -2x + 11, subtracting the equations gives 6x - 12 = 0. Give the value of x that this equation forces."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Intersection step: set 4x - 1 = -2x + 11. Add 2x and 1 to both sides to get 6x = 12. Uniqueness step: divide by 6 to get x = 2, and this value is forced. The answer is 2."
          - problem: "Claim: the equation x^2 = 4 has exactly one real solution. Step 1: x = 2 is a solution since 2^2 = 4. Step 2: suppose y is another real solution, so y^2 = 4. Step 3: then y^2 - 4 = 0, so (y - 2)(y + 2) = 0. Step 4: therefore y - 2 = 0, so y = 2 and the solution is unique. Which step is the first step that is not valid?"
            answer: "Step 4"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "Step 1 is not the first invalid step; it correctly checks 2^2 = 4. Step 2 is not invalid; it correctly assumes a second solution. Step 3 is not invalid; it correctly factors y^2 - 4. Step 4 is the first invalid step because the zero product rule also allows y + 2 = 0, so y = -2 is another solution. The answer is Step 4."
          - problem: "In a uniqueness proof for 3x + 7 = 22, existence gives x = 5. Assume y also solves 3y + 7 = 22. The next line is 3y = ? Select the number that completes the line."
            answer: "15"
            answer_contract: {"kind": "label", "options": [["15"], ["22"], ["7"], ["29"]]}
            solution_sketch: "Option 22 is wrong because it repeats the right side without subtracting 7. Option 7 is wrong because it subtracts 7 but leaves 3y undivided. Option 29 is wrong because it adds 7 instead of subtracting. The correct line is 3y = 15. The answer is 15."
          - problem: "Write the full proof: the equation 8x - 3 = 21 has a unique real solution. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Existence step: take x = 3. Then 8x - 3 = 8(3) - 3 = 24 - 3 = 21, so 3 is a solution. Uniqueness step: suppose y is any real number with 8y - 3 = 21. Add 3 to both sides to get 8y = 24. Divide both sides by 8 to get y = 3. Thus every solution equals 3. Since 3 is a solution, the equation has exactly one real solution. This completes the proof."
        constraints: "prove existence, then assume two solutions and show they are equal"
      - id: kp2
        name: "Uniqueness in the division algorithm"
        key_prerequisites: [existence-proofs]
        exemplars:
          - problem: 'Prove the uniqueness part of the division algorithm: if $a = bq + r = bq'' + r''$ with $0 \le r, r'' < b$, then $q = q''$ and $r = r''$.'
            answer: '$r - r'' = b(q'' - q)$ is a multiple of $b$ with $|r - r''| < b$, so it is $0$.'
            solution_sketch: 'Subtracting gives $r - r'' = b(q'' - q)$, a multiple of $b$. But $0 \le r, r'' < b$ forces $|r - r''| < b$, and the only multiple of $b$ with absolute value below $b$ is $0$. Hence $r = r''$ and then $q = q''$ (as $b \ne 0$). $\square$'
          - problem: 'Prove: every integer $n$ has a unique parity (it cannot be both even and odd).'
            answer: 'If $n = 2a = 2b + 1$ then $2(a - b) = 1$, so $2 \mid 1$ — contradiction.'
            solution_sketch: 'Suppose $n$ were both even and odd: $n = 2a$ and $n = 2b + 1$. Subtracting, $2(a - b) = 1$, making $1$ even — a contradiction. $\square$'
        constraints: "bound a difference to force it to zero, or derive a contradiction from two representations"
      - id: kp3
        name: "Existence and uniqueness together"
        key_prerequisites: [existence-proofs]
        exemplars:
          - problem: 'Prove: there is exactly one real number $x$ with $x^3 = 8$.'
            answer: 'Existence: $x = 2$. Uniqueness: $x^3 = y^3$ gives $(x - y)(x^2 + xy + y^2) = 0$, and the quadratic factor is positive unless $x = y = 0$.'
            solution_sketch: 'Existence: $2^3 = 8$. Uniqueness: if $x^3 = y^3 = 8$ then $x^3 - y^3 = (x - y)(x^2 + xy + y^2) = 0$. For $x, y$ not both $0$, $x^2 + xy + y^2 = (x + \tfrac{y}{2})^2 + \tfrac{3y^2}{4} > 0$, so $x = y$. $\square$'
          - problem: 'Prove: there is a unique real number $x$ such that $x + a = a$ for every real $a$.'
            answer: 'Existence: $x = 0$. Uniqueness: if $x$ and $x''$ both work, $x = x + x'' = x''$.'
            solution_sketch: 'Existence: $0 + a = a$ always. Uniqueness: suppose $x$ and $x''$ both satisfy the property. Then $x'' = x'' + x$ (using the property of $x$ at $a = x''$) and $x = x + x'' = x''$ by commutativity and the property of $x''$ at $a = x$. Hence $x = x''$. $\square$'
        constraints: "state the $\\exists!$ claim as existence plus uniqueness and prove both parts"
    diagnostic_exemplar:
      problem: 'Prove that there is exactly one real number $x$ with $x^3 + x = 10$.'
      answer: 'Existence: $x = 2$ gives $8 + 2 = 10$. Uniqueness: suppose $a^3 + a = b^3 + b$. Then $(a^3 - b^3) + (a - b) = 0$, i.e. $(a-b)(a^2 + ab + b^2 + 1) = 0$. The second factor is positive for all real $a, b$, since $a^2 + ab + b^2 = \left(a + \tfrac{b}{2}\right)^2 + \tfrac{3b^2}{4} \ge 0$, making the factor at least $1$. Hence $a - b = 0$, so $a = b$. Therefore $x = 2$ is the unique solution.'
      solution_sketch: 'Exhibit a solution, then show any two solutions coincide: factor $a^3 + a - (b^3 + b)$ and check that the quadratic factor never vanishes.'
    anki_seeds:
      - front: 'Standard template for proving uniqueness?'
        back: 'Assume $x$ and $y$ both satisfy the property, then show $x = y$.'
        type: basic
      - front: 'What does $\exists!\, x\, P(x)$ require you to prove?'
        back: 'Existence (some $x$ satisfies $P$) and uniqueness (any two satisfying $P$ are equal).'
        type: basic

  - id: common-proof-errors
    name: "Common Proof Errors"
    core: false                # supplemental: proof-hygiene commentary leaf topic
    difficulty: 0.60
    drill: false
    answer_kind: numeric
    expected_time_secs: 150
    prerequisites:
      - id: rules-of-inference
        weight: 0.5
        key: true
      - id: direct-proof
        weight: 0.4
        key: true
    knowledge_points:
      - id: kp1
        name: "Proof by example"
        key_prerequisites: [direct-proof]
        exemplars:
          - problem: "Consider the claim that n^2 - n + 11 is prime for every positive integer n. The values n = 1, 2, 3, 4, 5 all give primes. Find the smallest positive integer n for which the claim fails."
            answer: "11"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The claim is that f(n) = n^2 - n + 11 is prime for every positive integer n. Step 1: test successive values using the definition of prime; f(6) = 41, f(7) = 53, f(8) = 67, f(9) = 83, f(10) = 101 are all prime. Step 2: test n = 11; f(11) = 121, and 121 = 11*11 is composite. The smallest positive integer that makes the claim fail is 11."
          - problem: "A proof that the sum of two even integers is even must use arbitrary even integers. If the two even integers are 2a and 2b, give their sum as an expanded expression in a and b."
            answer: "2a+2b"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The claim is that the sum of two even integers is even. Step 1: write arbitrary even integers as 2a and 2b, using the definition of even. Step 2: add them; 2a + 2b = 2(a+b), which is twice an integer, so it is even. The expanded sum is 2a+2b."
          - problem: "A student claims n^2 + n + 17 is prime for every positive integer n. The claim holds for n = 1 through 15. Find the smallest positive integer n for which the claim fails."
            answer: "16"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The claim is that g(n) = n^2 + n + 17 is prime for every positive integer n. Step 1: check the given range; the values from n = 1 to n = 15 are prime. Step 2: evaluate n = 16; g(16) = 256 + 16 + 17 = 289, and 289 = 17*17. The claim fails first at n = 16."
          - problem: "A student claims every prime number is odd. Which number is a counterexample?"
            answer: "2"
            answer_contract: {"kind": "label", "options": [["2"], ["3"], ["5"], ["7"]]}
            solution_sketch: "A counterexample to the claim that every prime number is odd must be a prime that is not odd. Step 1: check the options; 2 is prime and is even, so it is a counterexample. Step 2: the numbers 3, 5 and 7 are odd primes, so they do not show the claim false. The correct counterexample is 2."
          - problem: "A student argues that every odd number greater than 1 is prime, checking 3, 5 and 7. Find the smallest odd number greater than 1 that shows the argument is incomplete."
            answer: "9"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The claim is that every odd number greater than 1 is prime. Step 1: test the checked values 3, 5 and 7; they are prime. Step 2: test the next odd number 9; 9 = 3*3, so it is composite. The smallest odd number greater than 1 that shows the argument is incomplete is 9."
          - problem: "To prove that the product of two odd integers is odd, a student checks 3*5 = 15. The proof must use arbitrary odd integers 2a+1 and 2b+1. Give the product as an expanded expression in a and b."
            answer: "4ab+2a+2b+1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The claim is that the product of two odd integers is odd. Step 1: write arbitrary odd integers as 2a+1 and 2b+1. Step 2: multiply them; (2a+1)(2b+1) = 4ab+2a+2b+1 = 2(2ab+a+b)+1, which is odd. The expanded product is 4ab+2a+2b+1."
        constraints: "the flawed argument verifies instances; the fix is an arbitrary-element proof or a counterexample"
      - id: kp2
        name: "Circular reasoning and converse errors"
        key_prerequisites: [rules-of-inference]
        exemplars:
          - problem: "A flawed proof of the claim that if n squared is divisible by three then n is divisible by three has five steps. Step one supposes n squared is divisible by three. Step two writes n squared equals three m. Step three cites the implication 'if n is divisible by three then n squared is divisible by three' and calls the case consistent. Step four concludes that n is divisible by three. Step five states the claim. Give the number of the first step that argues from the conclusion of the claim rather than from its hypothesis."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Full object: the proof has step one supposing the hypothesis, step two writing n squared equals three m, step three citing the implication from n to n squared, step four concluding n is divisible by three. Rule for step one: check that it starts from the hypothesis, which it does. Rule for step two: check that it is valid algebra, which it is. Rule for step three: compare its direction with the claim; it runs from the conclusion back to the hypothesis, which is the converse error of arguing from the conclusion. The first step that argues from the conclusion of the claim is step three. The answer is 3."
          - problem: "A flawed proof of the claim that the arithmetic mean of two nonnegative numbers a and b is at least their geometric mean has four steps. In the first step it assumes the claim. In the second step it squares both sides. In the third step it rearranges to a perfect square inequality. In the fourth step it concludes the claim. Give the number of the first step that assumes what is to be proved."
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Full object: first step assumes the claim; second step squares both sides; third step rearranges to a perfect square; fourth step concludes. Rule for the first step: identify the assumption. Rule for the second step: check reversibility. The first step that assumes what is to be proved is the first step. The answer is 1."
          - problem: "A proof of the claim 'if n is prime then n is odd' says that every odd integer greater than two is prime. Find the smallest odd composite that shows this step is invalid."
            answer: "9"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Full object: the step claims every odd n greater than two is prime. Rule for testing the step: find an odd n that is not prime. Test three, five, seven, then nine equals three times three, composite. The smallest odd composite is nine. The answer is 9."
          - problem: "A flawed proof of 'if n is even then n squared is even' has four steps. In the first step it writes n = two k. In the second step it expands n squared to four k squared. In the third step it says 'since n squared is even, four k squared is even'. In the fourth step it concludes n squared is even. Give the number of the first step that assumes the conclusion."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Full object: first step sets n = two k; second step expands; third step uses the conclusion n squared is even; fourth step repeats the conclusion. Rule for the first step: set up the hypothesis. Rule for the second step: compute. Rule for the third step: check for circular reasoning. The first step that assumes the conclusion is the third step. The answer is 3."
          - problem: "A proof of 'if x squared equals four then x equals two' squares both sides and keeps only the positive root. Find the other real value of x that satisfies x squared equals four but not x equals two."
            answer: "-2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Full object: the equation x squared equals four has two real solutions. Rule for solving x squared equals four: take square roots, so x equals two or x equals negative two. Rule for the flaw: the step from x squared equals four to x equals two is not reversible. The other real value is negative two. The answer is -2."
          - problem: "A proof of 'if n is a multiple of nine then n is a multiple of six' uses the converse 'if n is a multiple of six then n is a multiple of nine'. Find the smallest positive multiple of six greater than six that is not a multiple of nine."
            answer: "12"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Full object: the converse claims every multiple of six is a multiple of nine. Rule for testing the converse: list positive multiples of six. Six is not a multiple of nine, twelve is not a multiple of nine, but the smallest greater than six is twelve. The answer is 12."
        constraints: "flag arguing-from-the-conclusion; require reversibility or a rewritten forward proof"
      - id: kp3
        name: "Illegal algebraic steps"
        key_prerequisites: [direct-proof]
        exemplars:
          - problem: "Consider this argument with c = 7 and d = 7. Step 1: c = d. Step 2: multiply both sides by c to get c^2 = cd. Step 3: subtract d^2 from both sides to get c^2 - d^2 = cd - d^2. Step 4: factor both sides. Step 5: cancel the common factor to get c + d = d. Step 6: conclude 14 = 7. Exactly one step performs an illegal algebraic move. Find the common factor that this step cancels, as a formula in c and d."
            answer: "c - d"
            answer_contract: {"kind": "function", "vars": ["c", "d"]}
            solution_sketch: "The full argument is: c = d, then multiply both sides by c to get c^2 = cd, then subtract d^2 from both sides to get c^2 - d^2 = cd - d^2, then factor both sides, then cancel the common factor to get c + d = d, then conclude 14 = 7. Check each step: multiplying and subtracting the same quantity on both sides is legal by the laws of equality, and after step 4 the difference-of-squares rule and the distributive law give (c + d)(c - d) = d(c - d). The illegal step is the cancellation, which divides by the common factor c - d; because c = d = 7, that factor equals 0, and the zero-divisor rule forbids dividing by 0. The common factor cancelled by the illegal step is c - d."
          - problem: "Consider this argument with z = -6. Step 1: z^2 = 6^2. Step 2: take the square root of both sides to get sqrt(z^2) = sqrt(6^2). Step 3: replace the left side by z to get z = 6, that is, -6 = 6. Step 3 performs the illegal root extraction, because the square root of z^2 is not always z. Find the expression that step 3 must write on the left side in place of z, as a formula in z."
            answer: "abs(z)"
            answer_contract: {"kind": "function", "vars": ["z"]}
            solution_sketch: "The full argument is: z^2 = 6^2, then take the square root of both sides to get sqrt(z^2) = sqrt(6^2), then replace the left side by z to get z = 6, that is, -6 = 6. Step 2 is legal by the definition of the square root, since z = -6 gives sqrt(z^2) = sqrt(36) = 6 and sqrt(6^2) = 6. Step 3 is the illegal root extraction: the identity sqrt(z^2) = z holds only for nonnegative z, and here z = -6. The identity that holds for every real z is sqrt(z^2) = abs(z), the absolute-value form. The expression that step 3 must write in place of z is abs(z)."
          - problem: "Consider this argument that solves (x - 8)(x + 3) = 0. Step 1: state the equation (x - 8)(x + 3) = 0. Step 2: divide both sides by the factor x - 8 to get x + 3 = 0. Step 3: conclude that x = -3 is the only solution. Exactly one step performs an illegal algebraic move, because it divides by a quantity that equals zero for one solution. Find the solution of the equation that this step loses."
            answer: "8"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full argument is: state (x - 8)(x + 3) = 0, divide both sides by the factor x - 8 to get x + 3 = 0, and conclude that x = -3 is the only solution. The zero-product rule says a product is 0 exactly when at least one factor is 0, so the equation has the two solutions x = 8 and x = -3. The illegal step is the division by x - 8: when x = 8 that divisor is 0, so the step is a hidden division by zero and it loses the solution x = 8. The solution lost by the illegal step is 8."
          - problem: "Consider this argument that solves (t - 2)^2 = 9. Step 1: state the equation (t - 2)^2 = 9. Step 2: take the square root of both sides and keep only the positive branch, t - 2 = 3. Step 3: conclude that t = 5 is the only solution. Step 2 performs the illegal root extraction by keeping only one branch. Find the other solution of the equation that step 2 drops."
            answer: "-1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full argument is: state (t - 2)^2 = 9, take the square root of both sides and keep only the positive branch t - 2 = 3, and conclude that t = 5 is the only solution. The square-root rule for equations gives two branches, t - 2 = sqrt(9) = 3 and t - 2 = -sqrt(9) = -3, so the solutions are t = 5 and t = -1. Step 2 keeps only the positive branch, which is the illegal root extraction, and the other solution is dropped. The solution dropped by the illegal step is -1."
          - problem: "Consider this argument that solves the inequality x^2 < 49. Step 1: state the inequality x^2 < 49. Step 2: take the square root of both sides and write x < 7. Step 3: conclude that every x < 7 solves the inequality. Step 2 performs the illegal root extraction by dropping the negative branch. Find the correct solution of the inequality, and give it as an inequality in x."
            answer: "-7 < x < 7"
            answer_contract: {"kind": "inequality_union"}
            solution_sketch: "The full argument is: state the inequality x^2 < 49, take the square root of both sides and write x < 7, and conclude that every x < 7 solves it. The square-root rule for inequalities gives abs(x) < 7, because the square root of x^2 is the absolute value of x, and abs(x) < 7 splits into the two branches x < 7 and x > -7. Step 2 keeps only one branch, which is the illegal root extraction, so its conclusion is incomplete. The correct solution of the inequality is -7 < x < 7."
          - problem: "Consider this argument that solves (y - 2)(y + 5) = 9(y - 2). Step 1: state the equation (y - 2)(y + 5) = 9(y - 2). Step 2: divide both sides by y - 2 to get y + 5 = 9. Step 3: conclude that y = 4 is the only solution. Step 2 performs the illegal move of dividing by a factor that can equal zero. Find the value of y for which this division is a division by zero."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full argument is: state (y - 2)(y + 5) = 9(y - 2), divide both sides by y - 2 to get y + 5 = 9, and conclude that y = 4 is the only solution. The division rule permits dividing by y - 2 only when y - 2 is not 0. Set the divisor to zero: y - 2 = 0 gives y = 2, and at y = 2 the original equation also holds, since both sides equal 0. The value of y for which the illegal step divides by zero is 2."
        constraints: "hidden division by zero or invalid root extraction; the learner names the exact illegal step"
    diagnostic_exemplar:
      problem: 'Identify the error in each argument: (a) "The sum of two even integers is even — indeed $4 + 6 = 10$." (b) "If $a = b$ then $a^2 = ab$, so $a^2 - b^2 = ab - b^2$, so $(a+b)(a-b) = b(a-b)$, hence $a + b = b$; taking $a = b = 1$ gives $2 = 1$."'
      answer_contract: {kind: none}
      answer: '(a) Proof by example: one instance cannot establish a universal claim. A proof must start from arbitrary even integers $2a$ and $2b$ and show $2a + 2b = 2(a+b)$. (b) An illegal cancellation: passing from $(a+b)(a-b) = b(a-b)$ to $a + b = b$ divides by $a - b$, which is $0$ because $a = b$. Division by zero is not a valid step, so the conclusion does not follow.'
      solution_sketch: 'Ask what each step actually licenses: one instance never proves "for all", and cancelling a factor requires it to be nonzero.'
    anki_seeds:
      - front: 'Why does deriving a true statement from a claim not prove the claim?'
        back: 'A false statement can imply a true one ($F \to T$ is true); the steps must be reversible or run forward from known truths.'
        type: basic
      - front: 'The "converse error" in a proof?'
        back: 'Proving $Q \to P$ (or assuming $Q$) when the goal is $P \to Q$.'
        type: basic
      - front: 'Classic hidden error in the "$2 = 1$" algebra fallacy?'
        back: 'Dividing by $a - b$, which is zero when $a = b$.'
        type: basic

  - id: induction-template
    name: "The Induction Template"
    core: true
    difficulty: 0.55
    drill: false
    answer_kind: proof
    expected_time_secs: 200
    prerequisites:
      - id: direct-proof
        weight: 0.5
        key: true
      - id: quantifiers
        weight: 0.2
      - id: factorial-notation
        weight: 0.2
        key: false
    knowledge_points:
      - id: kp1
        name: "The principle and its two parts"
        key_prerequisites: [quantifiers]
        exemplars:
          - problem: 'For the claim "for all $n \ge 1$, $1 + 2 + \cdots + n = \tfrac{n(n+1)}{2}$", state the base case to verify and the inductive hypothesis.'
            answer: 'Base: $n = 1$, i.e. $1 = \tfrac{1 \cdot 2}{2}$. Hypothesis: assume $1 + \cdots + n = \tfrac{n(n+1)}{2}$ for some $n \ge 1$; then show the formula at $n + 1$.'
            solution_sketch: 'Induction on a claim $P(n)$ for $n \ge n_0$ requires verifying $P(n_0)$ and proving $P(n) \to P(n+1)$; the assumption $P(n)$ is the inductive hypothesis.'
          - problem: 'Why do the base case $P(1)$ and the step $P(n) \to P(n+1)$ together prove $P(n)$ for every $n \ge 1$?'
            answer: 'The step transmits truth from each $n$ to $n + 1$; starting the chain at $P(1)$ reaches every positive integer, like a row of falling dominoes.'
            solution_sketch: '$P(1)$ holds; the step gives $P(2)$, then $P(3)$, and so on — every $n$ is reached after finitely many applications of the step.'
        constraints: "setup only: identify base case, hypothesis, and goal of the step; no full proof required"
      - id: kp2
        name: "Choosing and checking the base case"
        key_prerequisites: [direct-proof]
        exemplars:
          - problem: "For the claim 2^n > 6n, find the smallest positive integer n for which the claim holds. Give n."
            answer: "5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Test n = 4: 2^4 = 16 and 6*4 = 24, so 16 > 24 is false. Test n = 5: 2^5 = 32 and 6*5 = 30, so 32 > 30 is true. Thus the first integer that works is 5."
          - problem: "For the claim n! >= 2^(n-1), verify the base case n = 1 by giving the common value of both sides. Give the value."
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Substitute n = 1: 1! = 1. The right side is 2^(1-1) = 2^0 = 1. The two sides are equal, so the base case holds. The common value is 1."
          - problem: "For the claim n! > 2^n, determine the smallest positive integer n at which the claim holds. Give n."
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Test n = 3: 3! = 6 and 2^3 = 8, so 6 > 8 is false. Test n = 4: 4! = 24 and 2^4 = 16, so 24 > 16 is true. For every later n the factorial keeps growing faster than the power, so the claim holds from this index onward. Thus the first integer that works is 4."
          - problem: "For the claim n! > 3^n, find the smallest positive integer n for which the claim holds. Give n."
            answer: "7"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Test n = 6: 6! = 720 and 3^6 = 729, so 720 > 729 is false. Test n = 7: 7! = 5040 and 3^7 = 2187, so 5040 > 2187 is true. Thus the first integer that works is 7."
          - problem: "In an induction proof of 1 + 3 + ... + (2n - 1) = n^2, the step from k to k + 1 adds one term. Give that added term as an expression in k."
            answer: "2k+1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The sum to k ends at the k-th odd positive integer, 2k - 1. The sum to k + 1 adds the next odd integer, 2(k + 1) - 1. Simplify: 2k + 2 - 1 = 2k + 1. The added term is 2k+1."
          - problem: "Claim: for all n >= 1, 1 + 2 + ... + n = n(n+1)/2. Step 1: for n = 1, the left side is 1 and the right side is 1. Step 2: assume 1 + 2 + ... + k = k(k+1)/2. Step 3: then 1 + 2 + ... + (k+1) = k(k+1)/2 + (k+1) = (k+1)(k+1)/2. Step 4: this is the formula for n = k+1, so the claim holds for all n. Which step is the first step that is not valid?"
            answer: "Step 3"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "Step 1 checks n = 1 correctly: 1 = 1. Step 2 states the hypothesis correctly. Step 3 is false: k(k+1)/2 + (k+1) simplifies to (k+1)(k+2)/2, not (k+1)(k+1)/2. Step 4 uses the false Step 3. The answer is Step 3."
          - problem: "Write the full proof: for all n >= 5, 2^n > n^2. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Base case: choose n = 5. Compute 2^5 = 32 and 5^2 = 25, so 32 > 25, and the base case holds. Inductive step: assume 2^k > k^2 for some k >= 5. Multiply by 2: 2^(k+1) = 2*2^k > 2k^2. For k >= 5, 2k^2 - (k+1)^2 = k^2 - 2k - 1 = (k-1)^2 - 2 > 0, so 2k^2 > (k+1)^2. Combine: 2^(k+1) > (k+1)^2. Conclusion: by induction, 2^n > n^2 for all n >= 5."
        constraints: "numeric base-case verification; find the first index where the claim holds"
      - id: kp3
        name: "A complete first induction"
        key_prerequisites: [direct-proof]
        exemplars:
          - problem: 'Prove by induction: for all $n \ge 1$, $1 + 3 + 5 + \cdots + (2n - 1) = n^2$.'
            answer: 'Base $n = 1$: $1 = 1$. Step: add $2n + 1$ to $n^2$ to get $(n + 1)^2$.'
            solution_sketch: 'Base: $n = 1$, $1 = 1^2$. Step: assume the sum of the first $n$ odd numbers is $n^2$. Adding the next odd number $2(n+1) - 1 = 2n + 1$ gives $n^2 + 2n + 1 = (n + 1)^2$. $\square$'
          - problem: 'Prove by induction: for all $n \ge 1$, $2 + 4 + 6 + \cdots + 2n = n(n + 1)$.'
            answer: 'Base $n = 1$: $2 = 2$. Step: $n(n+1) + 2(n+1) = (n+1)(n+2)$.'
            solution_sketch: 'Base: $n = 1$ gives $2 = 1 \cdot 2$. Step: assume the sum to $2n$ is $n(n+1)$; adding $2(n+1)$ gives $n(n+1) + 2(n+1) = (n+1)(n+2)$, the formula at $n + 1$. $\square$'
        constraints: "single-step sums with linear terms; write base, hypothesis, and step explicitly"
    diagnostic_exemplar:
      problem: 'Prove by induction: for all $n \ge 1$, $3 + 7 + 11 + \cdots + (4n - 1) = n(2n + 1)$.'
      answer: 'Base $n = 1$: $3 = 3$. Step: $n(2n+1) + (4n + 3) = 2n^2 + 5n + 3 = (n+1)(2n+3)$.'
      solution_sketch: 'Base: $n = 1$ gives $3 = 1 \cdot 3$. Step: assume the sum is $n(2n+1)$; adding the next term $4(n+1) - 1 = 4n + 3$ gives $2n^2 + 5n + 3 = (n + 1)(2(n+1) + 1)$. $\square$'
    anki_seeds:
      - front: 'The two parts of a proof by induction?'
        back: 'Base case (verify $P(n_0)$) and inductive step (assume $P(n)$, prove $P(n + 1)$).'
        type: basic
      - front: 'What is the inductive hypothesis?'
        back: 'The assumption that $P(n)$ holds, used to prove $P(n + 1)$.'
        type: basic

  - id: induction-summation-proofs
    name: "Summation Formulas by Induction"
    core: true
    difficulty: 0.58
    drill: false
    answer_kind: proof
    expected_time_secs: 220
    prerequisites:
      - id: induction-template
        weight: 0.6
        key: true
      - id: summation-notation
        weight: 0.3
        key: false
    knowledge_points:
      - id: kp1
        name: "Linear sums"
        key_prerequisites: [induction-template]
        exemplars:
          - problem: 'Prove: for all $n \ge 1$, $1 + 2 + \cdots + n = \dfrac{n(n+1)}{2}$.'
            answer: 'Base $n = 1$: $1 = 1$. Step: add $(n + 1)$ to both sides.'
            solution_sketch: 'Base: $n = 1$ gives $1 = \frac{1 \cdot 2}{2}$. Step: assume $\sum_{i=1}^{n} i = \frac{n(n+1)}{2}$. Then $\sum_{i=1}^{n+1} i = \frac{n(n+1)}{2} + (n + 1) = \frac{(n+1)(n+2)}{2}$, the formula at $n + 1$. $\square$'
          - problem: 'Prove: for all $n \ge 1$, $\displaystyle\sum_{i=1}^{n} (3i - 2) = \frac{n(3n - 1)}{2}$.'
            answer: 'Base $n = 1$: $1 = 1$. Step: $\frac{n(3n-1)}{2} + (3n + 1) = \frac{3n^2 + 5n + 2}{2} = \frac{(n+1)(3n+2)}{2}$.'
            solution_sketch: 'Base: $n = 1$ gives $1 = \frac{1 \cdot 2}{2}$. Step: add the next term $3(n+1) - 2 = 3n + 1$ to the hypothesis and factor: $\frac{3n^2 - n + 6n + 2}{2} = \frac{(n+1)(3(n+1) - 1)}{2}$. $\square$'
        constraints: "arithmetic-progression sums; the step adds one term and refactors"
      - id: kp2
        name: "Square and cube sums"
        key_prerequisites: [induction-template]
        exemplars:
          - problem: 'Prove: for all $n \ge 1$, $1^2 + 2^2 + \cdots + n^2 = \dfrac{n(n+1)(2n+1)}{6}$.'
            answer: 'Base $n = 1$: $1 = 1$. Step: add $(n+1)^2$ and factor.'
            solution_sketch: 'Base: $n = 1$ gives $1 = \frac{1 \cdot 2 \cdot 3}{6}$. Step: assume the formula at $n$; adding $(n+1)^2$ yields $\frac{n(n+1)(2n+1)}{6} + (n+1)^2 = \frac{(n+1)(n+2)(2n+3)}{6}$, the formula at $n + 1$. $\square$'
          - problem: 'Prove: for all $n \ge 1$, $1^3 + 2^3 + \cdots + n^3 = \left(\dfrac{n(n+1)}{2}\right)^2$.'
            answer: 'Base $n = 1$: $1 = 1$. Step: $\left(\frac{n(n+1)}{2}\right)^2 + (n+1)^3 = \left(\frac{(n+1)(n+2)}{2}\right)^2$.'
            solution_sketch: 'Step: factor $(n+1)^2$ from $\frac{n^2(n+1)^2}{4} + (n+1)^3 = (n+1)^2\left(\frac{n^2}{4} + n + 1\right) = (n+1)^2 \cdot \frac{(n+2)^2}{4}$. $\square$'
        constraints: "power sums; the algebraic factoring in the step is the heart of the proof"
      - id: kp3
        name: "Geometric-type sums"
        key_prerequisites: [induction-template]
        exemplars:
          - problem: 'Prove: for all $n \ge 0$, $1 + 2 + 4 + \cdots + 2^n = 2^{n+1} - 1$.'
            answer: 'Base $n = 0$: $1 = 1$. Step: $(2^{n+1} - 1) + 2^{n+1} = 2^{n+2} - 1$.'
            solution_sketch: 'Base: $n = 0$ gives $1 = 2 - 1$. Step: assume the sum to $2^n$ is $2^{n+1} - 1$; adding $2^{n+1}$ gives $2 \cdot 2^{n+1} - 1 = 2^{n+2} - 1$. $\square$'
          - problem: 'Prove: for all $n \ge 0$, $1 + 3 + 9 + \cdots + 3^n = \dfrac{3^{n+1} - 1}{2}$.'
            answer: 'Base $n = 0$: $1 = 1$. Step: $\frac{3^{n+1} - 1}{2} + 3^{n+1} = \frac{3 \cdot 3^{n+1} - 1}{2} = \frac{3^{n+2} - 1}{2}$.'
            solution_sketch: 'Base: $n = 0$ gives $1 = \frac{3 - 1}{2}$. Step: add the next power $3^{n+1}$ to the hypothesis and combine over the common denominator. $\square$'
        constraints: "geometric sums with integer ratio; combine over a common denominator in the step"
    diagnostic_exemplar:
      problem: 'Prove: for all $n \ge 1$, $\displaystyle\sum_{i=1}^{n} \frac{1}{i(i+1)} = \frac{n}{n+1}$.'
      answer: 'Base $n = 1$: $\tfrac{1}{2} = \tfrac{1}{2}$. Step: $\frac{n}{n+1} + \frac{1}{(n+1)(n+2)} = \frac{n(n+2) + 1}{(n+1)(n+2)} = \frac{n+1}{n+2}$.'
      solution_sketch: 'Base: $\frac{1}{1 \cdot 2} = \frac{1}{2}$. Step: $\frac{n(n+2) + 1}{(n+1)(n+2)} = \frac{(n+1)^2}{(n+1)(n+2)} = \frac{n+1}{n+2}$, the formula at $n + 1$. $\square$'
    anki_seeds:
      - front: 'The inductive step for a summation formula $\sum_{i=1}^n a_i = F(n)$?'
        back: 'Add the next term: show $F(n) + a_{n+1} = F(n+1)$.'
        type: basic
      - front: 'Formulas: $\sum_{i=1}^n i$, $\sum_{i=1}^n i^2$, $\sum_{i=1}^n i^3$?'
        back: '$\frac{n(n+1)}{2}$, $\frac{n(n+1)(2n+1)}{6}$, $\left(\frac{n(n+1)}{2}\right)^2$.'
        type: basic

  - id: induction-divisibility-proofs
    name: "Divisibility by Induction"
    core: true
    difficulty: 0.58
    drill: false
    answer_kind: proof
    expected_time_secs: 220
    prerequisites:
      - id: induction-template
        weight: 0.6
        key: true
      - id: divisibility-parity-proofs
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: "Polynomial divisibility"
        key_prerequisites: [induction-template]
        exemplars:
          - problem: "To prove $3 \\mid (n^3 + 2n)$ by induction, write $(n+1)^3 + 2(n+1) = (n^3 + 2n) + 3 q(n)$. Give $q(n)$."
            answer: "n^2+n+1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Expand the left side: $(n+1)^3 + 2(n+1) = n^3 + 3n^2 + 3n + 1 + 2n + 2$. Isolate the previous case: $(n^3 + 2n) + (3n^2 + 3n + 3)$. Factor $3$ from the remainder. The quotient is q(n) = n^2+n+1."
          - problem: "To prove $2 \\mid (n^2 + n)$ by induction, write $(n+1)^2 + (n+1) = (n^2 + n) + 2 q(n)$. Give $q(n)$."
            answer: "n+1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Expand: $(n+1)^2 + (n+1) = n^2 + 2n + 1 + n + 1$. Isolate the previous case: $(n^2 + n) + (2n + 2)$. Factor $2$ from the remainder. The quotient is q(n) = n+1."
          - problem: "To prove $5 \\mid (n^5 - n)$ by induction, write $(n+1)^5 - (n+1) = (n^5 - n) + 5 q(n)$. Give $q(n)$."
            answer: "n^4+2n^3+2n^2+n"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Expand: $(n+1)^5 = n^5 + 5n^4 + 10n^3 + 10n^2 + 5n + 1$. Subtract $n+1$: $n^5 + 5n^4 + 10n^3 + 10n^2 + 4n$. Isolate $(n^5 - n)$: remainder $5n^4 + 10n^3 + 10n^2 + 5n$. Factor $5$. The quotient is q(n) = n^4+2n^3+2n^2+n."
          - problem: "To prove $4 \\mid (2n^2 + 2n)$ by induction, write $2(n+1)^2 + 2(n+1) = (2n^2 + 2n) + c(n+1)$. Give the constant $c$."
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Expand: $2(n+1)^2 + 2(n+1) = 2n^2 + 6n + 4$. Subtract the previous case $2n^2 + 2n$: difference $4n + 4$. Factor as $4(n+1)$. The constant is c = 4."
          - problem: "Claim: $6 \\mid (n^2 + 5n)$ for $n \\ge 0$. Step 1: for $n = 0$, $0$ is divisible by $6$. Step 2: assume $6 \\mid (k^2 + 5k)$. Step 3: $(k+1)^2 + 5(k+1) = (k^2 + 5k) + 6(k+1)$. Step 4: the two terms are multiples of $6$, so $6 \\mid ((k+1)^2 + 5(k+1))$. Which step is the first step that is not valid?"
            answer: "Step 3"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "Step 1 is a correct base case because $0$ is divisible by $6$. Step 2 states the induction hypothesis. Step 3 is false: the expansion gives $(k^2 + 5k) + (2k + 6)$, not $6(k+1)$. Step 4 would follow only from a correct remainder. The first invalid step is Step 3."
          - problem: "In the inductive step for $3 \\mid (n^3 - n)$, the line $(k+1)^3 - (k+1) = \\;?$ is missing. Select the line that is true and that shows the hypothesis."
            answer: "(k^3 - k) + 3(k^2 + k)"
            answer_contract: {"kind": "label", "options": [["(k^3 - k) + 3(k^2 + k)"], ["(k^3 - k) + 3(k^2 + k) + 1"], ["(k^3 - k) + 3k^2 + 2k"], ["(k^3 - k) + 2(k^2 + k)"]]}
            solution_sketch: "Expand the left side: $(k+1)^3 - (k+1) = k^3 + 3k^2 + 2k$. Isolate the previous case: $(k^3 - k) + 3k^2 + 3k = (k^3 - k) + 3(k^2 + k)$. The option (k^3 - k) + 3(k^2 + k) + 1 adds an extra 1. The option (k^3 - k) + 3k^2 + 2k drops a k from the remainder. The option (k^3 - k) + 2(k^2 + k) uses the wrong factor 2. The correct line is (k^3 - k) + 3(k^2 + k)."
          - problem: "Write the full proof: for all $n \\ge 0$, $7 \\mid (n^7 - n)$. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Base case: $n = 0$ gives $0^7 - 0 = 0$, a multiple of $7$. Hypothesis: assume $7 \\mid (k^7 - k)$ for some $k \\ge 0$. Step: $(k+1)^7 - (k+1) = (k^7 - k) + 7(k^6 + 3k^5 + 5k^4 + 5k^3 + 3k^2 + k)$. The first term is a multiple of $7$ by the hypothesis, and the second is a multiple of $7$ by its factor $7$. Conclusion: the sum is a multiple of $7$, so the claim holds for $k+1$, and by induction for all $n \\ge 0$."
        constraints: "isolate the previous case plus a visibly-divisible remainder"
      - id: kp2
        name: "Exponential divisibility"
        key_prerequisites: [induction-template]
        exemplars:
          - problem: 'Prove: for all $n \ge 0$, $6 \mid (7^n - 1)$.'
            answer: 'Base $n = 0$: $0$. Step: $7^{n+1} - 1 = 7(7^n - 1) + 6$.'
            solution_sketch: 'Base: $7^0 - 1 = 0$, divisible by $6$. Step: assume $6 \mid (7^n - 1)$. Then $7^{n+1} - 1 = 7 \cdot 7^n - 1 = 7(7^n - 1) + 6$; both terms are divisible by $6$. $\square$'
          - problem: 'Prove: for all $n \ge 0$, $4 \mid (5^n - 1)$.'
            answer: 'Base $n = 0$: $0$. Step: $5^{n+1} - 1 = 5(5^n - 1) + 4$.'
            solution_sketch: 'Base: $5^0 - 1 = 0$. Step: $5^{n+1} - 1 = 5(5^n - 1) + 4$; the first term is divisible by $4$ by hypothesis and so is $4$. $\square$'
        constraints: "rewrite $a^{n+1} - 1$ as $a(a^n - 1) + (a - 1)$; both pieces visibly divisible"
      - id: kp3
        name: "Mixed exponential-linear divisibility"
        key_prerequisites: [induction-template]
        exemplars:
          - problem: "To prove 3 | (4^n + 5) by induction, write 4^(n+1) + 5 = 4(4^n + 5) + r for a constant r. Give r."
            answer: "-15"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The induction step starts from the target 4^(n+1) + 5. Expand the multiple of the hypothesis: 4(4^n + 5) = 4^(n+1) + 20. The difference between the target and this expression is 5 - 20 = -15, so the remainder is constant. Since -15 is a multiple of 3, the induction step closes. The answer is -15."
          - problem: "To prove 9 | (4^n + 6n - 1) by induction, write 4^(n+1) + 6(n+1) - 1 = 4(4^n + 6n - 1) + 9 q(n). Give q(n)."
            answer: "1-2n"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The target is 4^(n+1) + 6n + 5. The multiple of the hypothesis is 4(4^n + 6n - 1) = 4^(n+1) + 24n - 4. Subtract: (6n + 5) - (24n - 4) = -18n + 9 = 9(1 - 2n). Thus q(n) = 1 - 2n, and the remainder is a visible multiple of 9. The answer is 1-2n."
          - problem: "To prove 12 | (7^n + 6n + 11) by induction, write 7^(n+1) + 6(n+1) + 11 = 7(7^n + 6n + 11) + 12 q(n). Give q(n)."
            answer: "-3n-5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The target expands to 7^(n+1) + 6n + 17. The multiple of the hypothesis is 7(7^n + 6n + 11) = 7^(n+1) + 42n + 77. Subtract: (6n + 17) - (42n + 77) = -36n - 60 = 12(-3n - 5). Thus q(n) = -3n - 5, a visible multiple of 12. The answer is -3n-5."
          - problem: "A student claims that 5 | (3^n + 2n + 4) for every n >= 0. Test n = 0 and n = 1. Give the smallest n >= 0 for which the claim is false."
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Test the base case n = 0: 3^0 + 0 + 4 = 5, a multiple of 5. Test the next case n = 1: 3 + 2 + 4 = 9, not a multiple of 5. Therefore the first failure occurs at n = 1, and the induction hypothesis cannot be reached past this point. The answer is 1."
          - problem: "Claim: 8 | (5^n + 4n + 7) for n >= 0. Step 1: for n = 0, 5^0 + 0 + 7 = 8. Step 2: assume 8 | (5^k + 4k + 7). Step 3: 5^(k+1) + 4(k+1) + 7 = 5(5^k + 4k + 7) + 8(2k + 3). Step 4: both terms are multiples of 8, so 8 | (5^(k+1) + 4(k+1) + 7). Which step is the first step that is not valid?"
            answer: "Step 3"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "Step 1 is the correct base case because 8 is a multiple of 8. Step 2 is the induction hypothesis. Step 3 is invalid: the correct subtraction is 5(5^k + 4k + 7) - 8(2k + 3), since 5(5^k + 4k + 7) = 5^(k+1) + 20k + 35 and the target is 5^(k+1) + 4k + 11. Step 4 would follow only with the corrected sign. The answer is Step 3."
          - problem: "In the inductive step for 9 | (7^n + 3n + 8), the line 7^(k+1) + 3(k+1) + 8 = ? is missing. Select the line that is true and that shows the hypothesis."
            answer: "$7(7^k + 3k + 8) - 9(2k + 5)$"
            answer_contract: {"kind": "label", "options": [["$7(7^k + 3k + 8) - 9(2k + 5)$"], ["$7(7^k + 3k + 8) + 9(2k + 5)$"], ["$7(7^k + 3k + 8) - 9(2k - 5)$"], ["$7(7^k + 3k + 8) - 3(2k + 5)$"]]}
            solution_sketch: "Start from the target on the left: 7^(k+1) + 3k + 11. The multiple of the hypothesis is 7(7^k + 3k + 8) = 7^(k+1) + 21k + 56. The needed subtraction is (21k + 56) - (3k + 11) = 18k + 45 = 9(2k + 5), so the correct line subtracts 9(2k + 5). The option with +9 has a sign error. The option with -9(2k - 5) changes the constant. The option with -3(2k + 5) uses the wrong divisor factor. The answer is $7(7^k + 3k + 8) - 9(2k + 5)$."
          - problem: "Write the full proof: for all n >= 0, 9 | (7^n + 3n + 8). Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Base case: at n = 0, 7^0 + 0 + 8 = 9, and 9 is a multiple of 9. Induction hypothesis: assume 9 | (7^k + 3k + 8) for some k >= 0, so 7^k + 3k + 8 = 9m for an integer m. Induction step: compute 7^(k+1) + 3(k+1) + 8 = 7(7^k + 3k + 8) - 9(2k + 5). The first term is 7 times a multiple of 9, hence a multiple of 9; the second term is visibly 9 times an integer. Therefore their difference is a multiple of 9, so 9 | (7^(k+1) + 3(k+1) + 8). Conclusion: by induction the statement holds for every n >= 0. The full proof is complete."
        constraints: "express the next case as (multiple of the hypothesis) plus a visible multiple of the divisor"
    diagnostic_exemplar:
      problem: 'Prove by induction: for all $n \ge 0$, $9 \mid (10^{n} - 9n - 1)$.'
      answer: 'Base $n = 0$: $10^0 - 0 - 1 = 0$, which is divisible by $9$. Step: assume $9 \mid (10^{n} - 9n - 1)$. Then $10^{n+1} - 9(n+1) - 1 = 10(10^{n} - 9n - 1) + (90n + 10 - 9n - 10) = 10(10^{n} - 9n - 1) + 81n$. The first term is divisible by $9$ by the inductive hypothesis and the second because $81n = 9 \cdot 9n$, so the sum is divisible by $9$. By induction the claim holds for all $n \ge 0$.'
      solution_sketch: 'Peel one factor of $10$ off the exponential and repair the linear part; the correction term $81n$ is a multiple of $9$.'
    anki_seeds:
      - front: 'Key rewrite for proving $d \mid (a^n - 1)$ by induction (where $d = a - 1$)?'
        back: '$a^{n+1} - 1 = a(a^n - 1) + (a - 1)$.'
        type: basic
      - front: 'Shape of the inductive step in a divisibility proof?'
        back: 'Write the $(n+1)$-case as a combination of the $n$-case and an explicit multiple of the divisor.'
        type: basic

  - id: induction-inequality-proofs
    name: "Inequalities by Induction"
    core: true
    difficulty: 0.60
    drill: false
    answer_kind: proof
    expected_time_secs: 240
    prerequisites:
      - id: induction-template
        weight: 0.6
        key: true
      - id: summation-notation
        weight: 0.2
        key: false
    knowledge_points:
      - id: kp1
        name: "Linear vs. exponential growth"
        key_prerequisites: [induction-template]
        exemplars:
          - problem: "To prove the claim n < 2^n for all n >= 1 by induction, the inductive step must bound the new left side n + 1 by a multiple of n, using n >= 1. Give that bound as an expression in n."
            answer: "2n"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The hypothesis gives n < 2^n. Since n >= 1, we have 1 <= n, so adding n to both sides gives n + 1 <= n + n. The bound on the new left side is therefore 2n, which is then compared with 2 * 2^n = 2^(n+1). The answer is 2n."
          - problem: "To prove 2n + 1 <= 2^n for all n >= 3 by induction, write the new left side as 2(n+1) + 1 = (2n + 1) + c with a constant c. Give the constant c."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Expand the left side at n + 1: 2(n+1) + 1 = 2n + 3. Isolate the previous case: 2n + 3 = (2n + 1) + 2, so the added amount is c = 2. In the full step this amount is absorbed because 2 <= 2^n. The answer is 2."
          - problem: "The claim 3n + 1 <= 2^n holds for all n >= 4, and the base case is n = 4. The proof checks the gap 2^4 - (3*4 + 1). Give the value of that gap."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Evaluate the base case at n = 4: the left side is 3*4 + 1 = 13 and the right side is 2^4 = 16. Compute the gap: 16 - 13 = 3. A positive gap confirms the base case before the inductive step begins. The answer is 3."
          - problem: "A student wants to prove 5n + 1 <= 2^n by induction and must take the base case to be the smallest n >= 1 for which the claim is true. Give that smallest n."
            answer: "5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Test the claim from n = 1 upward: at n = 4 the left side is 21 and 2^4 = 16, so the claim fails; at n = 5 the left side is 26 and 2^5 = 32, so it holds. The base case is the smallest such n. The answer is 5."
          - problem: "Claim: n + 1 <= 2^n for all n >= 1. Step 1: for n = 1 the claim reads 2 <= 2. Step 2: assume k + 1 <= 2^k for some k >= 1. Step 3: adding 2 to both sides gives k + 2 <= 2^k + 2. Step 4: since 2 <= 2^k, we get 2^k + 2 <= 2^k + 2^k = 2^(k+1). Step 5: therefore k + 2 <= 2^(k+1), completing the step. Which step is the first step that is not valid?"
            answer: "Step 3"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"], ["Step 5"]]}
            solution_sketch: "Step 1 is a correct base case. Step 2 states the induction hypothesis. Step 3 is the error: the claim gains 1 on the left side, so one must add 1, not 2; adding 2 does not follow from the hypothesis. Step 4 is a valid estimate of 2^k + 2 but rests on the wrong line. Step 5 is a valid conclusion from the earlier steps. The first invalid step is Step 3."
          - problem: "In the inductive step for the claim 3n + 1 <= 2^n, the proof reaches (3n + 1) + 3 and needs the next line (3n + 1) + 3 <= ?. Select the line that follows from the hypothesis by adding 3 to both sides."
            answer: "$2^n + 3$"
            answer_contract: {"kind": "label", "options": [["$2^n + 3$"], ["$2^n + 1$"], ["$2^n - 3$"], ["$2^(n+1)$"]]}
            solution_sketch: "From the hypothesis 3n + 1 <= 2^n, add 3 to both sides: 3n + 4 <= 2^n + 3, and the left side is 3(n+1) + 1. The option 2^n + 1 adds only 1 instead of the added amount 3. The option 2^n - 3 has a sign error. The option 2^(n+1) uses the next power without the needed justification that 3 <= 2^n. The answer is $2^n + 3$."
          - problem: "Write the full proof: for all n >= 2, n + 1 < 2^n. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Base case: at n = 2 the left side is 3 and the right side is 4, so 3 < 4. Inductive hypothesis: assume k + 1 < 2^k for some k >= 2. Inductive step: add 1 to both sides to get k + 2 < 2^k + 1. Since k >= 2 we have 1 < 2^k, so 2^k + 1 < 2^k + 2^k = 2^(k+1). Chaining the two inequalities gives k + 2 < 2^(k+1), which is the claim for n = k + 1. Conclusion: by the induction template, n + 1 < 2^n holds for every n >= 2."
        constraints: "bound the added amount by a copy of the exponential term"
      - id: kp2
        name: "Polynomial vs. exponential and factorial"
        key_prerequisites: [induction-template]
        exemplars:
          - problem: 'Prove: for all $n \ge 5$, $2^n > n^2$.'
            answer: 'Base $n = 5$: $32 > 25$. Step: $2^{n+1} = 2 \cdot 2^n > 2n^2 \ge (n+1)^2$ for $n \ge 5$.'
            solution_sketch: 'Base: $n = 5$, $32 > 25$. Step: assume $2^n > n^2$ for some $n \ge 5$. Then $2^{n+1} = 2 \cdot 2^n > 2n^2$. Since $n \ge 5$, $n^2 - 2n - 1 \ge 0$, so $2n^2 \ge n^2 + 2n + 1 = (n+1)^2$. Hence $2^{n+1} > (n+1)^2$. $\square$'
          - problem: 'Prove: for all $n \ge 1$, $n! \ge 2^{n-1}$.'
            answer: 'Base $n = 1$: $1 \ge 1$. Step: $(n+1)! = (n+1) \cdot n! \ge 2 \cdot 2^{n-1} = 2^n$ since $n + 1 \ge 2$.'
            solution_sketch: 'Base: $1! = 1 = 2^0$. Step: assume $n! \ge 2^{n-1}$; multiply by $n + 1 \ge 2$ to get $(n+1)! \ge 2 \cdot 2^{n-1} = 2^n$. $\square$'
        constraints: "verify the base is large enough; bound the step algebraically"
      - id: kp3
        name: "Bernoulli and harmonic bounds"
        key_prerequisites: [induction-template]
        exemplars:
          - problem: "In the inductive step for Bernoulli's inequality, expand the product (1 + kx)(1 + x). For k = 4 and x = 2, find the value of the extra term kx^2 that appears."
            answer: "16"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The product is (1 + kx)(1 + x) = 1 + (k+1)x + kx^2. Substitute k = 4 and x = 2: kx^2 = 4 * 2^2 = 16. The nonnegative extra term is 16."
          - problem: "In the harmonic block proof, the new terms from 2^k + 1 to 2^{k+1} are each at least 1/2^{k+1}. Give the least amount by which the sum increases."
            answer: "1/2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The block from 2^k + 1 to 2^{k+1} has 2^k new terms. Each new term is at least 1/2^{k+1}, so the total added amount is at least 2^k * 1/2^{k+1} = 1/2. The least increase is 1/2."
          - problem: "In Bernoulli's inequality proof, after using the hypothesis, the next line multiplies both sides by a factor. For x = 1/4, give the value of this factor as a fraction."
            answer: "5/4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The factor is 1 + x. For x = 1/4, the factor is 1 + 1/4 = 5/4. A nonnegative factor keeps the inequality direction. The value is 5/4."
          - problem: "A student claims that (1 + x)^n >= 1 + nx holds for every real x and every integer n >= 1, and tests the claim with x = -3. Give the smallest n >= 1 for which the claim is false."
            answer: "5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Test each case by direct computation: for x = -3 the left side is (-2)^n and the right side is 1 - 3n. Check n = 1: -2 >= -2 holds; n = 2: 4 >= -5 holds; n = 3: -8 >= -8 holds; n = 4: 16 >= -11 holds. Check n = 5: -32 >= -14 fails, so the claim breaks at n = 5. The step of the proof needs the factor 1 + x >= 0, and 1 + (-3) = -2 is negative, so the induction fails for this x. The smallest n for which the claim is false is 5."
          - problem: "Claim: for all n >= 0, sum_{i=1}^{2^n} 1/i >= 1 + n/2. Step 1: for n = 0, the sum is 1 and the bound is 1. Step 2: assume the claim holds for n. Step 3: the step from 2^n + 1 to 2^{n+1} adds 2^n terms, and each new term is at least 1/2^n. Step 4: the added amount is at least 2^n * 1/2^n = 1, so the bound holds for n + 1. Which step is the first invalid step?"
            answer: "Step 3"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "Step 1 is a valid base case, so it is not the first invalid step. Step 2 is the valid induction hypothesis, so it is not the answer. Step 3 is false: each new term is at least 1/2^{n+1}, not 1/2^n. Step 4 uses that false lower bound. The answer is Step 3."
          - problem: "In the inductive step for Bernoulli's inequality, the product (1 + kx)(1 + x) expands to which line? Select the missing line."
            answer: "1+(k+1)x+kx^2"
            answer_contract: {"kind": "label", "options": [["1+(k+1)x+kx^2"], ["1+(k+1)x-kx^2"], ["1+(k+1)x"], ["1+(k+1)x+x^2"]]}
            solution_sketch: "The product is (1 + kx)(1 + x) = 1 + (k+1)x + kx^2. The option 1+(k+1)x omits the nonnegative term kx^2. The option 1+(k+1)x-kx^2 has the wrong sign on that term. The option 1+(k+1)x+x^2 forgets the factor k. The answer is 1+(k+1)x+kx^2."
          - problem: "Write the full proof: for all n >= 1, sum_{i=1}^{2^n} 1/i >= 1 + n/2. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Base case: n = 1 gives sum from i=1 to 2 of 1/i = 1 + 1/2 = 3/2, and 1 + 1/2 = 3/2, so the inequality holds. Induction hypothesis: assume sum from i=1 to 2^k of 1/i >= 1 + k/2 for some k >= 1. Step: the sum to 2^{k+1} adds the terms from i = 2^k + 1 to 2^{k+1}. There are 2^k new terms, and each is at least 1/2^{k+1}. Therefore the added amount is at least 2^k * 1/2^{k+1} = 1/2. By the induction hypothesis, the new sum is at least 1 + k/2 + 1/2 = 1 + (k+1)/2. This is the desired bound for k+1. Conclusion: by induction, the inequality holds for all n >= 1."
        constraints: "multiplying inequalities requires a nonnegative factor; block-bounding for harmonic sums"
    diagnostic_exemplar:
      problem: 'Prove by induction: for all $n \ge 1$, $\displaystyle\sum_{i=1}^{n} \frac{1}{i^2} \le 2 - \frac{1}{n}$.'
      answer: 'Base $n = 1$: the sum is $1$ and $2 - \tfrac11 = 1$, so the inequality holds (with equality). Step: assume $\sum_{i=1}^{n} \frac{1}{i^2} \le 2 - \frac{1}{n}$. Then $\sum_{i=1}^{n+1} \frac{1}{i^2} \le 2 - \frac{1}{n} + \frac{1}{(n+1)^2}$, so it suffices that $\frac{1}{(n+1)^2} \le \frac{1}{n} - \frac{1}{n+1} = \frac{1}{n(n+1)}$ — true because $(n+1)^2 > n(n+1)$ for $n \ge 1$. Hence $\sum_{i=1}^{n+1} \frac{1}{i^2} \le 2 - \frac{1}{n+1}$, and the claim follows by induction.'
      solution_sketch: 'Add the new term to the inductive bound and check it fits inside the gap $\frac1n - \frac{1}{n+1}$.'
    anki_seeds:
      - front: 'Bernoulli''s inequality?'
        back: '$(1 + x)^n \ge 1 + nx$ for every real $x \ge -1$ and integer $n \ge 1$.'
        type: basic
      - front: 'Common trick in the step of an exponential inequality induction?'
        back: 'Write $2^{n+1} = 2 \cdot 2^n$ and absorb the added amount into the extra factor.'
        type: basic

  - id: mathematical-induction
    name: "Mathematical Induction"
    core: true
    difficulty: 0.62
    drill: false
    answer_kind: proof
    expected_time_secs: 240
    prerequisites:
      - id: induction-summation-proofs
        weight: 0.5
        key: true
      - id: induction-inequality-proofs
        weight: 0.4
        key: true
      - id: induction-divisibility-proofs
        weight: 0.4
      - id: quantifiers
        weight: 0.2
    knowledge_points:
      - id: kp1
        name: "Products and factorials"
        key_prerequisites: [induction-summation-proofs]
        exemplars:
          - problem: 'Prove: for all $n \ge 1$, $\displaystyle\sum_{i=1}^{n} i \cdot i! = (n+1)! - 1$.'
            answer: 'Base $n = 1$: $1 = 2! - 1$. Step: $(n+1)! - 1 + (n+1)(n+1)! = (n+2)! - 1$.'
            solution_sketch: 'Base: $1 \cdot 1! = 1 = 2 - 1$. Step: add $(n+1)(n+1)!$ to the hypothesis: $(n+1)! - 1 + (n+1)(n+1)! = (n+1)!(1 + n + 1) - 1 = (n+2)! - 1$. $\square$'
          - problem: 'Prove: for all $n \ge 2$, $\displaystyle\prod_{k=2}^{n} \left(1 - \frac{1}{k}\right) = \frac{1}{n}$.'
            answer: 'Base $n = 2$: $\tfrac{1}{2}$. Step: $\frac{1}{n} \cdot \left(1 - \frac{1}{n+1}\right) = \frac{1}{n} \cdot \frac{n}{n+1} = \frac{1}{n+1}$.'
            solution_sketch: 'Base: $1 - \frac{1}{2} = \frac{1}{2}$. Step: multiply the hypothesis by the next factor $\frac{n}{n+1}$ and cancel. $\square$'
        constraints: "factorial and telescoping-product identities; factor the common piece in the step"
      - id: kp2
        name: "Induction on counting and geometry"
        key_prerequisites: [induction-summation-proofs]
        exemplars:
          - problem: 'Prove: a set with $n$ elements has exactly $2^n$ subsets.'
            answer: 'Base $n = 0$: $\varnothing$ has one subset. Step: adding a new element pairs each old subset with itself-plus-the-new-element, doubling the count.'
            solution_sketch: 'Base: the empty set has exactly one subset. Step: let $|S| = n + 1$ and fix $x \in S$. Subsets of $S$ split into those avoiding $x$ (subsets of $S \setminus \{x\}$: $2^n$ of them) and those containing $x$ (each is one of the former plus $x$: another $2^n$). Total $2 \cdot 2^n = 2^{n+1}$. $\square$'
          - problem: 'Prove: $n$ lines in the plane in general position (no two parallel, no three concurrent) divide it into $\dfrac{n^2 + n + 2}{2}$ regions.'
            answer: 'Base $n = 0$: $1$ region. Step: the $(n+1)$-st line meets $n$ lines in $n$ points, crossing $n + 1$ regions and adding $n + 1$.'
            solution_sketch: 'Base: no lines, one region, and $\frac{0 + 0 + 2}{2} = 1$. Step: a new line meets the $n$ existing lines in $n$ distinct points, splitting the new line into $n + 1$ pieces, each cutting one region in two. So $R(n+1) = \frac{n^2 + n + 2}{2} + (n + 1) = \frac{(n+1)^2 + (n+1) + 2}{2}$. $\square$'
        constraints: "the step must argue combinatorially or geometrically, not just algebraically"
      - id: kp3
        name: "Pitfalls and thresholds"
        key_prerequisites: [induction-inequality-proofs]
        exemplars:
          - problem: "In the usual induction that every group of horses has one color, the step from a group of size n to a group of size n+1 splits the larger group into two groups of size n. Give the least n for which those two groups can have an empty overlap."
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full object is the horses induction step. Step 1 (overlap test): with n = 1, the two groups of size 1 are singleton horses, so their overlap is empty. Step 2 (comparison): with n = 2, two pairs from three horses share the middle horse, so the overlap is nonempty. Therefore the first failure of the step is at n = 1. The least n is 1."
          - problem: "The inequality n! > 3^n is false for small n but true from some point on. Find the least integer n0 such that the inequality holds for every n >= n0."
            answer: "7"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full object is the threshold for n! > 3^n. Step 1 (base check): n = 6 gives 720 < 729, so the inequality fails. Step 2 (base check): n = 7 gives 5040 > 2187, so it holds. Step 3 (inductive step): for n >= 7, (n+1)! = (n+1)n! > 3*3^n = 3^(n+1) because n+1 > 3. The least threshold is 7."
          - problem: "A student claims that 3^n > n^3 for all n >= 1. Give the smallest n >= 1 for which the claim is false."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full object is the claim 3^n > n^3 for all n >= 1. Step 1 (test): n = 1 gives 3 > 1 and n = 2 gives 9 > 8. Step 2 (test): n = 3 gives 27 > 27, which is false. The first failure is at n = 3. The smallest counterexample is 3."
          - problem: "In the inductive step for proving 4 divides 5^n - 1, write 5^(n+1) - 1 = 5(5^n - 1) + r. Give the constant r."
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full object is the identity 5^(n+1) - 1 = 5(5^n - 1) + r. Step 1 (expand): 5(5^n - 1) = 5^(n+1) - 5. Step 2 (solve for r): compare 5^(n+1) - 5 + r with 5^(n+1) - 1, so r = 4. The constant is 4."
          - problem: "Claim: 3 divides n^2 + n + 1 for all n >= 1. Step 1: base n = 1 gives 3. Step 2: assume 3 divides k^2 + k + 1. Step 3: (k+1)^2 + (k+1) + 1 = (k^2 + k + 1) + (2k + 2). Step 4: since 3 divides both terms, 3 divides the sum. Which step is the first step that is not valid?"
            answer: "Step 4"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "The full object is the claimed induction for 3 divides n^2 + n + 1. Step 1 (base case): n = 1 gives 3, so Step 1 is correct. Step 2 (hypothesis): Step 2 states the assumption and is correct. Step 3 (algebra): the expansion to (k^2+k+1) + (2k+2) is correct. Step 4 (divisibility): Step 4 claims 3 divides 2k+2 for every k, which fails at k = 1 because 2k+2 = 4. The answer is Step 4."
          - problem: "For the induction that n! > 2^n for all n >= 4, evaluate n! - 2^n at the base n = 4. Give the value."
            answer: "8"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full object is the base case value 4! - 2^4. Step 1 (factorial): 4! = 24. Step 2 (power): 2^4 = 16. Step 3 (subtract): 24 - 16 = 8. The value is 8."
          - problem: "Write the full proof: for all integers n >= 5, 2^n > n^2. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "The full object is the statement: for all integers n >= 5, 2^n > n^2. Step 1 (base case): n = 5 gives 2^5 = 32 and 5^2 = 25, so 32 > 25. Step 2 (hypothesis): assume 2^k > k^2 for some k >= 5. Step 3 (inductive step): multiply the hypothesis by 2 to get 2^(k+1) > 2k^2. Since k >= 5, we have k^2 > 2k + 1, so 2k^2 > k^2 + 2k + 1 = (k+1)^2. Therefore 2^(k+1) > (k+1)^2. Step 4 (conclusion): by induction, 2^n > n^2 for every n >= 5."
        constraints: "diagnose a broken step or find the correct starting threshold before proving"
    diagnostic_exemplar:
      problem: 'Find the least integer $n_0$ such that $2^{n} > n^{3}$ holds for all $n \ge n_0$, and prove it by induction.'
      answer: '$n_0 = 10$: the inequality fails at $n = 9$ ($512 < 729$) and holds at $n = 10$ ($1024 > 1000$), which serves as the base case. Step: assume $2^{n} > n^{3}$ for some $n \ge 10$. Then $2^{n+1} = 2 \cdot 2^{n} > 2n^{3}$, and $2n^{3} \ge (n+1)^{3}$ because $(n+1)^{3} = n^{3}\left(1 + \tfrac1n\right)^{3} \le n^{3}(1.1)^{3} = 1.331\,n^{3} < 2n^{3}$ for $n \ge 10$. Hence $2^{n+1} > (n+1)^{3}$, and by induction the inequality holds for every $n \ge 10$.'
      solution_sketch: 'Test small values to locate the threshold (it fails at $9$, holds at $10$), then induct, bounding $(1 + 1/n)^3$ below $2$ for $n \ge 10$.'
    anki_seeds:
      - front: 'The two parts of a proof by induction?'
        back: 'Base case (verify $P(n_0)$) and inductive step (assume $P(n)$, prove $P(n + 1)$).'
        type: basic
      - front: 'The flaw in the "all horses are the same color" induction?'
        back: 'The inductive step needs the two overlapping groups to intersect, which fails going from $n = 1$ to $n = 2$.'
        type: basic

  - id: strong-induction
    name: "Strong Induction"
    core: true
    difficulty: 0.65
    drill: false
    answer_kind: proof
    expected_time_secs: 240
    prerequisites:
      - id: mathematical-induction
        weight: 0.7
        key: true
      - id: quantifiers
        weight: 0.2
      - id: prime-composite-numbers
        weight: 0.2
        key: false
    knowledge_points:
      - id: kp1
        name: "Recurrences needing earlier cases"
        key_prerequisites: [mathematical-induction]
        exemplars:
          - problem: 'Let $a_1 = 1$, $a_2 = 5$, and $a_n = 5a_{n-1} - 6a_{n-2}$ for $n \ge 3$. Prove $a_n = 3^n - 2^n$ for all $n \ge 1$.'
            answer: 'Two base cases $n = 1, 2$; step uses both $a_{n-1}$ and $a_{n-2}$.'
            solution_sketch: 'Base: $a_1 = 3 - 2 = 1$ and $a_2 = 9 - 4 = 5$. Step: for $n \ge 3$, assume the formula for all $k < n$. Then $a_n = 5(3^{n-1} - 2^{n-1}) - 6(3^{n-2} - 2^{n-2}) = 3^{n-2}(15 - 6) - 2^{n-2}(10 - 6) = 3^n - 2^n$. $\square$'
          - problem: 'Let $a_1 = 2$, $a_2 = 4$, and $a_n = 2a_{n-1} - a_{n-2}$ for $n \ge 3$. Prove $a_n = 2n$ for all $n \ge 1$.'
            answer: 'Two base cases; step uses $a_{n-1}, a_{n-2}$.'
            solution_sketch: 'Base: $a_1 = 2$, $a_2 = 4$. Step: for $n \ge 3$, assume $a_k = 2k$ for $k < n$. Then $a_n = 2a_{n-1} - a_{n-2} = 2 \cdot 2(n-1) - 2(n-2) = 4n - 4 - 2n + 4 = 2n$. $\square$'
        constraints: "use two base cases; invoke the hypothesis at $n-1$ and $n-2$"
      - id: kp2
        name: "Existence of prime factorizations"
        key_prerequisites: [mathematical-induction]
        exemplars:
          - problem: "In the strong induction proof that every integer n >= 2 is a product of primes, the case n = 35 is composite. Write 35 = a b with 2 <= a <= b < 35 and a as small as possible. Give a."
            answer: "5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The number 35 factors as 5 times 7. The smaller factor a is 5, and the larger factor 7 is less than 35. The strong hypothesis applies to both 5 and 7. The answer is 5."
          - problem: "In the strong induction proof that every integer n >= 2 has a prime divisor, the case n = 91 is composite. Write 91 = a b with 2 <= a <= b < 91 and a as small as possible. Give a."
            answer: "7"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The number 91 factors as 7 times 13. The smaller factor a is 7, and the larger factor 13 is less than 91. The hypothesis then gives a prime divisor of 7, namely 7 itself. The answer is 7."
          - problem: "In the strong induction proof of prime factorization, the base case is the first integer in the range n >= 2. Give the value of that base case."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The claim starts at n = 2 because 0 and 1 are not products of one or more primes. The base case is n = 2, which is prime. The answer is 2."
          - problem: "In the strong induction step for n = 77, write 77 = a b with 2 <= a <= b < 77 and a as small as possible. Give b."
            answer: "11"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The number 77 factors as 7 times 11. The smaller factor a is 7, so the larger factor b is 11. Both factors are less than 77, so the strong hypothesis applies to each. The answer is 11."
          - problem: "Claim: every integer n >= 2 is a product of primes. Step 1: 2 is prime. Step 2: assume k >= 2 is a product of primes. Step 3: let n = k + 1; if n is prime, stop. Step 4: otherwise n = a b with 2 <= a, b < n. Step 5: by Step 2, a and b are products of primes. Which step is the first invalid step?"
            answer: "Step 5"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"], ["Step 5"]]}
            solution_sketch: "Step 1 is the correct base case. Step 2 states the weak hypothesis for one value k. Step 3 handles the prime case. Step 4 is the composite split. Step 5 is invalid because Step 2 applies only to k, not to a or b; strong induction needs all smaller values. The answer is Step 5."
          - problem: "In the strong induction step for prime factorization, one line states what may be assumed about smaller integers. Which line is the correct hypothesis?"
            answer: "all m from 2 to n-1 are prime products"
            answer_contract: {"kind": "label", "options": [["all m from 2 to n-1 are prime products"], ["all m from 2 to n are prime products"], ["some m from 2 to n-1 are prime products"], ["n itself is a prime product"]]}
            solution_sketch: "The correct hypothesis is all m from 2 to n-1 are prime products. The option all m from 2 to n are prime products wrongly includes n itself. The option some m from 2 to n-1 are prime products is too weak. The option n itself is a prime product is circular. The answer is all m from 2 to n-1 are prime products."
          - problem: "Write the full proof: every integer n >= 2 is a product of one or more primes. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Base case: n = 2 is prime, so it is a product of one prime. Strong hypothesis: assume every integer m with 2 <= m < n is a product of one or more primes. If n is prime, then n itself is a product of one prime. If n is composite, then n = a b for integers a and b with 2 <= a < n and 2 <= b < n. By the strong hypothesis, a is a product of primes and b is a product of primes. Their product n = a b is therefore a product of the primes from a followed by the primes from b. This proves the claim for n, and by strong induction every integer n >= 2 is a product of one or more primes."
        constraints: "split the number and apply the hypothesis to both smaller factors"
      - id: kp3
        name: "Bounding recursive sequences"
        key_prerequisites: [mathematical-induction]
        exemplars:
          - problem: "Let f_1 = f_2 = 1 and f_n = f_{n-1} + f_{n-2} for n >= 3. In a strong induction proof that f_n < 2^n, the step writes f_n < 2^{n-1} + 2^{n-2} = C * 2^{n-2}. Give C."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "First write the two powers with the common factor 2^{n-2}. Since 2^{n-1} = 2 * 2^{n-2}, the sum is 2 * 2^{n-2} + 1 * 2^{n-2}. Add the coefficients 2 + 1 to get C = 3."
          - problem: "A sequence has b_1 = 3, b_2 = 5, and b_n = 3b_{n-1} - 2b_{n-2} for n >= 3. A proof that b_n = 2^n + 1 uses strong induction. Give b_3."
            answer: "9"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Use the recurrence with n = 3: b_3 = 3b_2 - 2b_1. Substitute the given values: 3 * 5 - 2 * 3 = 15 - 6 = 9. The value is 9."
          - problem: "Let a_1 = 1, a_2 = 2, and a_n = 2a_{n-1} + a_{n-2} for n >= 3. In a strong induction proof that a_n < 3^n, the step writes a_n < 2 * 3^{n-1} + 3^{n-2} = C * 3^{n-2}. Give C."
            answer: "7"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Write both terms with the common factor 3^{n-2}. Since 2 * 3^{n-1} = 6 * 3^{n-2}, the sum is 6 * 3^{n-2} + 1 * 3^{n-2}. Add the coefficients 6 + 1 to get C = 7."
          - problem: "Claim: if f_1 = f_2 = 1 and f_n = f_{n-1} + f_{n-2}, then f_n < 2^n for all n >= 1. Step 1: for n = 1, f_1 = 1 < 2. Step 2: for n = 2, f_2 = 1 < 4. Step 3: assume f_{n-1} < 2^{n-1} and proceed. Step 4: f_n = f_{n-1} + f_{n-2} < 2^{n-1} + 2^{n-2} < 2^n. Which step is the first step that is not valid?"
            answer: "Step 3"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "Step 1 is a correct base case because 1 < 2. Step 2 is a correct base case because 1 < 4. Step 3 is the flaw: the recurrence uses both f_{n-1} and f_{n-2}, so the strong hypothesis must cover all smaller indices, not only f_{n-1}. Step 4 would be valid after that repair. The first invalid step is Step 3."
          - problem: "In the strong induction proof that b_n = 2^n + 1 for b_1 = 3, b_2 = 5, and b_n = 3b_{n-1} - 2b_{n-2}, the step reaches 3(2^{n-1} + 1) - 2(2^{n-2} + 1) = 2^n + C. Give C."
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Expand the step: 3 * 2^{n-1} + 3 - 2 * 2^{n-2} - 2. Since 3 * 2^{n-1} - 2 * 2^{n-2} = 2^n, the variable part is 2^n. The constants give 3 - 2 = 1, so C = 1."
          - problem: "Let a_1 = 1, a_2 = 2, and a_n = 2a_{n-1} + a_{n-2} for n >= 3. In a strong induction proof that a_n < 3^n, give the smallest n for which the inductive step is used."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The recurrence defines a_n from two earlier terms only for n >= 3. The base cases are n = 1 and n = 2. The inductive step therefore starts at n = 3. The smallest such n is 3."
          - problem: "Write the full proof: for the sequence a_1 = 1, a_2 = 2, and a_n = 2a_{n-1} + a_{n-2} for n >= 3, prove a_n < 3^n for all n >= 1. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Base cases: a_1 = 1 < 3^1 = 3 and a_2 = 2 < 3^2 = 9. Strong hypothesis: assume for some n >= 3 that a_k < 3^k for every k < n. Step: use the recurrence to write a_n = 2a_{n-1} + a_{n-2}. Apply the hypothesis to both terms: a_n < 2 * 3^{n-1} + 3^{n-2}. Factor 3^{n-2}: a_n < (6 + 1) * 3^{n-2} = 7 * 3^{n-2}. Since 7 < 9, this is less than 9 * 3^{n-2} = 3^n. Conclusion: the claim holds for n, so by strong induction a_n < 3^n for all n >= 1."
        constraints: "bound each recursive term using the strong hypothesis"
    diagnostic_exemplar:
      problem: 'Prove: every postage amount of $n \ge 12$ cents can be made using only $4$-cent and $5$-cent stamps.'
      answer: 'Base cases $12, 13, 14, 15$; step reduces $n$ to $n - 4 \ge 12$ plus one $4$-cent stamp.'
      solution_sketch: 'Base: $12 = 4+4+4$, $13 = 4+4+5$, $14 = 4+5+5$, $15 = 5+5+5$. Step: for $n \ge 16$, assume every value in $[12, n)$ is makeable; since $n - 4 \ge 12$ is makeable, add one $4$-cent stamp to form $n$. $\square$'
    anki_seeds:
      - front: 'Strong induction hypothesis vs. ordinary induction?'
        back: 'Strong induction assumes $P(k)$ for every $k$ from the base up to $n$, not just $P(n)$.'
        type: basic
      - front: 'When should you use strong induction?'
        back: 'When the next case depends on earlier cases beyond the immediate predecessor (recurrences, prime factorization).'
        type: basic

  - id: wop
    name: "The Well-Ordering Principle"
    core: false                # supplemental: alternative formulation of induction; nothing builds on it
    difficulty: 0.68
    drill: false
    answer_kind: proof
    expected_time_secs: 240
    prerequisites:
      - id: strong-induction
        weight: 0.4
        key: true
      - id: proof-by-contradiction
        weight: 0.4
        key: true
      - id: mathematical-induction
        weight: 0.3
      - id: quantifiers
        weight: 0.0
    knowledge_points:
      - id: kp1
        name: "The minimal-counterexample method"
        key_prerequisites: [proof-by-contradiction]
        exemplars:
          - problem: "Let S be the nonempty set of divisors d >= 2 of 91. By the well-ordering principle S has a least element p. Find p."
            answer: "7"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: form S = {d : d >= 2 and d divides 91}; it is nonempty because 91 is in S. Step 2: by the well-ordering principle, S has a least element p. Step 3: test divisors: 7 divides 91 and no smaller divisor >= 2 does, so p = 7. The least element is 7."
          - problem: "For the claim 1 + 2 + ... + n = n(n+1)/2, suppose it fails and let m be the least counterexample. Since it holds at n = 1, m >= 2. Add m to the formula at m - 1. Give the resulting expression in m as a single fraction."
            answer: "(m^2+m)/2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: by contradiction and the well-ordering principle, take the least counterexample m. Step 2: the claim holds at m - 1, so 1 + ... + (m - 1) = (m - 1)m/2. Step 3: add m: (m - 1)m/2 + m = (m^2 - m + 2m)/2 = (m^2 + m)/2. The resulting expression is (m^2+m)/2."
          - problem: "Let S be the nonempty set of integers n >= 0 for which n^2 + n + 41 is not prime. By the well-ordering principle S has a least element. Find that least element."
            answer: "40"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: form S as the set of n >= 0 where n^2 + n + 41 is composite. Step 2: by the well-ordering principle, S has a least element m. Step 3: check n = 40 gives 40^2 + 40 + 41 = 1681 = 41^2, and no smaller n gives a composite value. The least element is 40."
          - problem: "Claim: 2^n > n^2 for every n >= 1. Step 1: suppose the claim is false and let m be the least counterexample. Step 2: since n = 1 is true, m >= 2. Step 3: by minimality, 2^(m-1) > (m-1)^2. Step 4: multiplying by 2 gives 2^m > 2(m-1)^2, and since 2(m-1)^2 >= m^2 for all m >= 2, we get 2^m > m^2. Which step is the first step that is not valid?"
            answer: "Step 4"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "Step 1 is valid: it sets up the minimal counterexample. Step 2 is valid because n = 1 gives 2 > 1. Step 3 is valid by minimality of m. Step 4 is invalid: the claim 2(m-1)^2 >= m^2 is false for m = 2, since 2 >= 4 is false. The answer is Step 4."
          - problem: "Let S be the nonempty set of divisors d >= 2 of 121. By the well-ordering principle S has a least element p. Determine whether p has exactly two positive divisors and give p."
            answer: "verdict = prime; p = 11"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["prime"], ["composite"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "p"}]}
            solution_sketch: "Step 1: form S; it is nonempty because 121 is in S. Step 2: by the well-ordering principle, S has a least element p. Step 3: 11 divides 121 and no smaller divisor >= 2 does, so p = 11. Step 4: 11 has exactly two positive divisors, 1 and 11, so the verdict is prime. The answer is verdict = prime; p = 11."
          - problem: "For the claim 1^2 + 2^2 + ... + n^2 = n(n+1)(2n+1)/6, suppose it fails and let m be the least counterexample. Since it holds at n = 1, m >= 2. Add m^2 to the formula at m - 1. Give the resulting expression in m as a single fraction."
            answer: "(2m^3+3m^2+m)/6"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: by contradiction and the well-ordering principle, take the least counterexample m. Step 2: the claim holds at m - 1, so 1^2 + ... + (m - 1)^2 = (m - 1)m(2m - 1)/6. Step 3: add m^2: (m - 1)m(2m - 1)/6 + m^2 = (2m^3 - 3m^2 + m + 6m^2)/6 = (2m^3 + 3m^2 + m)/6. The resulting expression is (2m^3+3m^2+m)/6."
          - problem: "Write the full proof: every integer n >= 2 can be written as a product of primes, using the well-ordering principle. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1: Suppose, for contradiction, that some integer n >= 2 is not a product of primes. Let S be the nonempty set of such integers. By the well-ordering principle S has a least element m. Step 2: If m is prime, then m is a product of one prime, a contradiction, so m is composite. Step 3: Write m = ab with integers a and b satisfying 2 <= a < m and 2 <= b < m. Step 4: Since a and b are smaller than m, and m is the least counterexample, both a and b are products of primes. Step 5: Then m = ab is a product of primes, a contradiction. Therefore every integer n >= 2 is a product of primes."
        constraints: "form a nonempty set of naturals and use its least element"
      - id: kp2
        name: "Existence via least elements"
        key_prerequisites: [proof-by-contradiction]
        exemplars:
          - problem: "In the well-ordering proof of the division algorithm, take a = 38 and b = 7. Let S = {38 - 7q : q an integer and 38 - 7q >= 0}. The set S has a least element r. Give r."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "First write the full set S = {38 - 7q : q an integer and 38 - 7q >= 0}. Step 1: S is nonempty because q = 0 gives 38. Step 2: by the well-ordering principle S has a least element r. Step 3: test the nonnegative values: q = 0 gives 38, q = 1 gives 31, q = 2 gives 24, q = 3 gives 17, q = 4 gives 10, q = 5 gives 3, and q = 6 gives -4. The least nonnegative value is 3, so r = 3. The answer is 3."
          - problem: "In the minimal-counterexample proof that every integer at least 2 is a product of primes, the least counterexample m is composite, so m = ab with 2 <= a <= b < m. Give a for m = 91."
            answer: "7"
            answer_contract: {"kind": "exact"}
            solution_sketch: "First write the full object m = 91. Step 1: 91 is not prime because 7 times 13 equals 91. Step 2: the minimal-counterexample proof says the least counterexample, if it existed, must be composite. Step 3: factor 91 as 7 times 13, so a = 7 and b = 13. The answer is 7."
          - problem: "Consider the set S = {n in Z : n > 10 and n = 7k + 3 for some integer k}. The well-ordering principle gives S a least element. Give that least element."
            answer: "17"
            answer_contract: {"kind": "exact"}
            solution_sketch: "First write the full set S = {n in Z : n > 10 and n = 7k + 3 for some integer k}. Step 1: the values of 7k + 3 near 10 are 3, 10, and 17. Step 2: the condition n > 10 removes 3 and 10. Step 3: by the well-ordering principle the least element is 17. The answer is 17."
          - problem: "Let S = {14, 19, 25}. Put T = {s - 10 : s in S}. The well-ordering principle gives T a least element. Give that least element."
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "First write the full set T = {4, 9, 15}. Step 1: subtract 10 from each element of S = {14, 19, 25}. Step 2: the well-ordering principle says T has a least element. Step 3: compare 4, 9, and 15; the least is 4. The answer is 4."
          - problem: "Claim: every integer n at least 2 has a prime divisor. Proof attempt. Step 1: Let S = {m in N : m >= 2 and m has no prime divisor}. Step 2: If S is nonempty, by well-ordering it has a least element m. Step 3: Since m is not prime, m = ab with 2 <= a < b < m. Step 4: By minimality, a has a prime divisor p, and p divides m. Which step is the first invalid step?"
            answer: "Step 3"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "First write the full set S = {m in N : m >= 2 and m has no prime divisor}. Step 1: Step 1 correctly defines the set of possible least counterexamples. Step 2: Step 2 correctly applies the well-ordering principle. Step 3: Step 3 is invalid because a composite number can have equal factors, such as 4 = 2 times 2; the correct line is m = ab with 2 <= a <= b < m. Step 4: Step 4 would be valid after that correction. The answer is Step 3."
          - problem: "In a proof that a nonempty set S of integers bounded below has a least element, let L be a lower bound. Put T = {s - L + 1 : s in S}. By well-ordering T has a least element t. Which expression gives the least element of S?"
            answer: "t + L - 1"
            answer_contract: {"kind": "label", "options": [["t + L - 1"], ["t - L + 1"], ["L - t + 1"], ["t + L + 1"]]}
            solution_sketch: "First write the full set T = {s - L + 1 : s in S}. Step 1: T is nonempty and all its elements are positive. Step 2: by the well-ordering principle T has a least element t. Step 3: since t <= s - L + 1 for every s in S, we get t + L - 1 <= s. Step 4: also t = s0 - L + 1 for some s0 in S, so t + L - 1 = s0 is in S. Thus t + L - 1 is the least element of S. The wrong option t - L + 1 reverses the sign. The wrong option L - t + 1 uses the wrong order. The wrong option t + L + 1 adds one instead of subtracting one. The answer is t + L - 1."
          - problem: "Write the full proof: for integers a and b > 0, there are q, r with a = bq + r and 0 <= r < b. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "First write the theorem: for integers a and b > 0, there are q, r with a = bq + r and 0 <= r < b. Step 1: let S = {a - bq : q an integer and a - bq >= 0}. Step 2: S is nonempty because q = 0 gives a when a >= 0, and a large negative q gives a nonnegative value when a < 0. Step 3: by the well-ordering principle S has a least element r = a - bq. Step 4: if r >= b, then r - b = a - b(q + 1) is in S and is smaller than r, a contradiction. Step 5: therefore 0 <= r < b, and a = bq + r. Step 6: this proves the existence of q and r."
        constraints: "choose the set so its least element gives the desired object"
      - id: kp3
        name: "Well-ordering and induction"
        key_prerequisites: [mathematical-induction]
        exemplars:
          - problem: 'Prove that the well-ordering principle implies mathematical induction.'
            answer: 'A least counterexample would contradict the base case or the inductive step.'
            solution_sketch: 'Assume $P(1)$ and $P(n) \to P(n+1)$ but $P$ fails somewhere. Let $C = \{n \ge 1 : \neg P(n)\}$, nonempty, so it has a least element $m$ by well-ordering. Since $P(1)$ holds, $m > 1$, so $P(m - 1)$ holds by minimality; the step gives $P(m)$, a contradiction. Hence $P(n)$ holds for all $n$. $\square$'
          - problem: 'Prove that mathematical induction implies the well-ordering principle: any nonempty $S \subseteq \mathbb{N}$ has a least element.'
            answer: 'If $S$ had no least element, induction shows its complement is all of $\mathbb{N}$.'
            solution_sketch: 'Suppose $S \subseteq \mathbb{N}$ has no least element. Let $P(n)$ be "no $k \le n$ lies in $S$". $P(0)$ holds (else $0$ is least in $S$). If $P(n)$ holds and $n + 1 \in S$, then $n+1$ would be least, contradiction; so $P(n+1)$ holds. By induction $P(n)$ for all $n$, so $S = \varnothing$. Contrapositively, a nonempty $S$ has a least element. $\square$'
        constraints: "connect the two principles via a least failure point"
    diagnostic_exemplar:
      problem: 'Use the well-ordering principle to prove that every nonempty set $S$ of integers that is bounded above has a greatest element.'
      answer: 'Let $M$ be an upper bound for $S$, so $s \le M$ for every $s \in S$, and put $T = \{M - s : s \in S\}$. Every element of $T$ is a nonnegative integer, and $T$ is nonempty because $S$ is, so by the well-ordering principle $T$ has a least element, say $M - s_0$ with $s_0 \in S$. Then for every $s \in S$ we have $M - s_0 \le M - s$, i.e. $s \le s_0$. Hence $s_0$ is an element of $S$ greater than or equal to every element of $S$ — a greatest element.'
      solution_sketch: 'Reflect the set about the upper bound to land inside the nonnegative integers, apply well-ordering there, and translate the least element back.'
