            answer: '2^n > n^2 for all integers n >= 5'
            answer_contract: {"kind": "none"}
            solution_sketch: 'We prove by induction on $n \ge 5$ the statement $P(n)$: $2^n > n^2$. Base case: for $n = 5$ we have $2^5 = 32$ and $5^2 = 25$, and $32 > 25$, so $P(5)$ holds. Inductive hypothesis: let $k \ge 5$ be an integer and assume $2^k > k^2$. Inductive step: we must prove $2^{k+1} > (k+1)^2$. Multiplying the hypothesis by $2$ gives $2^{k+1} = 2 \cdot 2^k > 2k^2$. Next we show $2k^2 \ge (k+1)^2$. This inequality is equivalent to $2k^2 - k^2 - 2k - 1 \ge 0$, that is, $k^2 - 2k - 1 \ge 0$, that is, $(k-1)^2 \ge 2$. Since $k \ge 5$, we have $(k-1)^2 \ge 16 \ge 2$, so the inequality holds. Therefore $2^{k+1} > 2k^2 \ge (k+1)^2$, which is $P(k+1)$. So $P(k)$ implies $P(k+1)$ for every $k \ge 5$. By the principle of mathematical induction, $2^n > n^2$ for every integer $n \ge 5$. $\square$'
