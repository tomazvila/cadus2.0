            solution_sketch: 'The term with index $k + 1$ is $3(k+1) - 1 = 3k + 2$, but the step adds $3k - 1$, which is the term with index $k$. So the step starts from a wrong sum and is not correct. The correct step adds $3k + 2$ to $\dfrac{k(3k+1)}{2}$.'
          - problem: 'Write the full proof that for every integer $n \ge 1$, $2 + 5 + 8 + \cdots + (3n-1) = \dfrac{n(3n+1)}{2}$.'
            answer: '2+5+...+(3n-1) = n(3n+1)/2'
