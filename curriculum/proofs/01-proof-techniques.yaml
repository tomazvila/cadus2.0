          - problem: 'In the induction step for $1+2+\dots+n=\frac{n(n+1)}{2}$, the hypothesis is the formula at $n=k$. Adding $k+1$ to both sides turns the right side into $\frac{k(k+1)}{2}+(k+1)$. Simplify this expression to the right side of the formula at $n=k+1$.'
            answer: '(k+1)(k+2)/2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Factor the common piece $k+1$: $\frac{k(k+1)}{2}+(k+1) = (k+1)\left(\frac k2+1\right) = (k+1)\cdot\frac{k+2}{2}$. This is $\frac{(k+1)(k+2)}{2}$, which is exactly $\frac{n(n+1)}{2}$ with $n=k+1$.'
          - problem: 'The identity $\prod_{i=1}^{n}\frac{i}{i+1}=\frac{1}{n+1}$ is proved by induction. In the step, the hypothesis shows that the product up to $k+1$ equals $\frac{1}{k+1}\cdot\frac{k+1}{k+2}$. Simplify this product.'
            answer: '1/(k+2)'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The factor $k+1$ appears in the numerator of the second fraction and in the denominator of the first, so it cancels. What remains is $\frac{1}{k+2}$, which is the right side of the identity at $n=k+1$.'
          - problem: 'The identity $\prod_{i=2}^{n}\left(1-\frac{1}{i^2}\right)=\frac{n+1}{2n}$ is claimed for every integer $n \ge 2$. What is the common value of the two sides at the first value $n=2$?'
            answer: '3/4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'At $n=2$ the product has the single factor $1-\frac14=\frac34$. The right side is $\frac{2+1}{2\cdot 2}=\frac34$. Both sides equal $\frac34$, so the base case holds.'
          - problem: 'The formula $1^2+2^2+\dots+n^2=\frac{n^2(n+1)}{2}$ is true for $n=1$. What is the smallest $n$ for which it is false?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'At $n=1$ both sides equal $1$. At $n=2$ the left side is $1+4=5$, while the formula gives $\frac{4\cdot 3}{2}=6$. So $n=2$ is the smallest value for which it is false; one true base case does not prove a formula.'
          - problem: 'Oranges are stacked in a triangular pyramid. Layer $i$ from the top is a triangle of $\frac{i(i+1)}{2}$ oranges. By induction, $\sum_{i=1}^{n}\frac{i(i+1)}{2}=\frac{n(n+1)(n+2)}{6}$. How many oranges are in a pyramid with $12$ layers?'
            answer: '364'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Use the formula with $n=12$: $\frac{12\cdot 13\cdot 14}{6}=\frac{2184}{6}=364$. So the pyramid holds $364$ oranges.'
          - problem: 'In a game a player earns $i\cdot i!$ points on level $i$. By induction, $\sum_{i=1}^{n} i\cdot i! = (n+1)!-1$. How many points has a player earned after level $6$?'
            answer: '5039'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Use the formula with $n=6$: the total is $7!-1$. Since $7!=5040$, the total is $5040-1=5039$ points.'
          - problem: 'Write the full proof that $1^3+2^3+\dots+n^3=\left(\frac{n(n+1)}{2}\right)^2$ for every integer $n \ge 1$, by induction on $n$.'
            answer: '1^3+...+n^3 = (n(n+1)/2)^2'
            answer_contract: {"kind": "none"}
            solution_sketch: 'We prove by induction on $n$ that $1^3+2^3+\dots+n^3=\left(\frac{n(n+1)}{2}\right)^2$ for every integer $n \ge 1$. Base case: for $n=1$ the left side is $1^3=1$ and the right side is $\left(\frac{1\cdot 2}{2}\right)^2=1$. Inductive hypothesis: let $k \ge 1$ be an integer and assume $1^3+\dots+k^3=\left(\frac{k(k+1)}{2}\right)^2 = \frac{k^2(k+1)^2}{4}$. Adding $(k+1)^3$ to both sides gives $1^3+\dots+k^3+(k+1)^3=\frac{k^2(k+1)^2}{4}+(k+1)^3$. Factor out $(k+1)^2$: the right side equals $(k+1)^2\left(\frac{k^2}{4}+k+1\right)=(k+1)^2\cdot\frac{k^2+4k+4}{4}=\frac{(k+1)^2(k+2)^2}{4}$. This is $\left(\frac{(k+1)(k+2)}{2}\right)^2$, which is the formula for $k+1$. By the principle of mathematical induction, the formula holds for every integer $n \ge 1$.'
        constraints: "factorial and telescoping-product identities; factor the common piece in the step Closed proof-audit items must require this knowledge point's method; verify every proposed inference for the stated arbitrary inputs. Do not supply the decisive result as an established fact."
      - id: kp2
        name: "Induction on counting and geometry"
        key_prerequisites: [induction-summation-proofs]
        exemplars:
          - problem: 'Four lines are drawn in the plane so that no two are parallel and no three pass through one point. Into how many regions do they divide the plane?'
            answer: '11'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'With $0, 1, 2, 3$ lines the plane has $1, 2, 4, 7$ regions. The $k$th line crosses the $k-1$ earlier lines in $k-1$ points, which cut it into $k$ pieces, and each piece splits one region in two, so it adds $k$ regions. For four lines this gives $7+4=11$ regions.'
          - problem: 'A convex polygon with $n$ sides has $\frac{n(n-3)}{2}$ diagonals. How many sides does a convex polygon with $54$ diagonals have?'
            answer: '12'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'We need $\frac{n(n-3)}{2}=54$, so $n(n-3)=108$. Since $12\cdot 9=108$, we get $n=12$. The expression grows with $n$, so no other positive $n$ works.'
          - problem: 'At a party of $10$ people everyone shakes hands exactly once with everyone else. Then an $11$th person arrives and shakes hands with each of the $10$ people already there. How many handshakes have taken place in total?'
            answer: '55'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Among the first $10$ people there are $\frac{10\cdot 9}{2}=45$ handshakes. The new person adds $10$ more, so the total is $45+10=55$. This agrees with the formula $\frac{11\cdot 10}{2}=55$.'
          - problem: 'A pizza shop offers $5$ toppings, one of which is pepperoni. A pizza has any combination of the toppings, including none. How many different pizzas include pepperoni?'
            answer: '16'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A pizza with pepperoni is decided by the other $4$ toppings, and each of them is either on the pizza or off it. That gives $2^4=16$ choices. So $16$ pizzas include pepperoni, and the other $16$ do not, which makes $32=2^5$ in all.'
          - problem: 'A new line crosses $3$ lines already drawn in general position. How many new regions does it add?'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The new line meets the $3$ old lines in $3$ different points, and these cut it into $4$ pieces. Each piece splits one old region in two, so the new line adds $4$ regions, not $3$.'
          - problem: 'Is there a convex polygon with exactly $35$ diagonals?'
            answer: 'yes'
            answer_contract: {"kind": "label", "options": [["yes", "there is", "yes there is", "it does", "yes there is one"], ["no", "there is not", "no there is not", "there is none", "none", "there isn't"]]}
            solution_sketch: 'A convex polygon with $n$ sides has $\frac{n(n-3)}{2}$ diagonals, so we would need $n(n-3)=70$. For $n=10$ the product is $10\cdot 7=70$. So a convex polygon with $10$ sides has exactly $35$ diagonals, and the answer is yes.'
          - problem: 'Write the full proof that a set with $n$ elements has exactly $2^n$ subsets, for every integer $n \ge 0$, by induction on $n$.'
            answer: 'n-element set has 2^n subsets'
            answer_contract: {"kind": "none"}
            solution_sketch: 'We prove by induction on $n \ge 0$ that every set with $n$ elements has exactly $2^n$ subsets. Base case: the only set with $0$ elements is $\varnothing$, and its only subset is $\varnothing$, so it has $1=2^0$ subsets. Inductive hypothesis: let $k \ge 0$ be an integer and assume that every set with $k$ elements has $2^k$ subsets. Let $S$ be a set with $k+1$ elements. Pick an element $x \in S$ and let $T=S\setminus\{x\}$, which has $k$ elements. Each subset $A$ of $S$ satisfies exactly one of $x \notin A$ and $x \in A$. The subsets with $x \notin A$ are exactly the subsets of $T$, and there are $2^k$ of them by the hypothesis. The subsets with $x \in A$ correspond one to one to the subsets of $T$ by $A \mapsto A\setminus\{x\}$, with inverse $B \mapsto B \cup \{x\}$, so there are also $2^k$ of them. Hence $S$ has $2^k+2^k=2^{k+1}$ subsets. By the principle of mathematical induction, every set with $n$ elements has $2^n$ subsets.'
        constraints: "the step must argue combinatorially or geometrically, not just algebraically Closed proof-audit items must require this knowledge point's method; verify every proposed inference for the stated arbitrary inputs. Do not supply the decisive result as an established fact."
      - id: kp3
        name: "Pitfalls and thresholds"
        key_prerequisites: [induction-inequality-proofs]
        exemplars:
          - problem: 'Find the least integer $n_0$ such that $n! > 3^n$ for every integer $n \ge n_0$.'
            answer: '7'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'We have $6!=720$ and $3^6=729$, so $6!>3^6$ is false, and the same holds for smaller $n$. For $n=7$ we get $7!=5040$ and $3^7=2187$, so the inequality is true. From then on each step multiplies $n!$ by $n+1 \ge 8$ and $3^n$ by only $3$, so $n_0=7$.'
          - problem: 'What is the smallest $n \ge 1$ for which $3^n>n^3$ is false?'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'We have $3^1=3>1$ and $3^2=9>8$. At $n=3$ both sides equal $27$, and $27>27$ is false. So the claim first fails at $n=3$.'
          - problem: 'In the faulty induction that all horses have the same color, the step goes from a group of $k+1$ horses to two groups of $k$ horses, by removing one horse and then a different one. The argument needs the two smaller groups to share at least one horse. What is the smallest $k \ge 1$ for which they do?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The two groups of $k$ horses together make up the $k+1$ horses, and they overlap in $k-1$ horses. For $k=1$ the overlap has $0$ horses, so the argument breaks. For $k=2$ the groups share $1$ horse, so $k=2$ is the smallest value that works.'
          - problem: 'A chain letter doubles its readers every day, so $2^n$ people have read it after $n$ days. A newspaper gains $100$ new readers per day, so it has $100n$ readers after $n$ days. From which day $n_0$ on does the chain letter have more readers than the newspaper on every day?'
            answer: '10'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'On day $9$ the chain letter has $512$ readers and the newspaper has $900$. On day $10$ the chain letter has $1024$ and the newspaper has $1000$. After that the letter gains $2^n \ge 1024$ readers a day against $100$ for the newspaper, so $n_0=10$.'
          - problem: 'The value of $n^2+n+41$ is prime for $n=1,2,\dots,10$. Give a positive integer $n$ for which $n^2+n+41$ is not prime.'
            answer: '40'
            answer_contract: {"kind": "property", "check": "prime_counterexample", "args": {"expr": "n^2+n+41", "var": "n", "min": 1}}
            solution_sketch: 'For $n=40$ we get $40^2+40+41=1681=41^2$, which is not prime. Checking many cases does not prove a statement for all $n$. A proof by induction needs a step that works for every $k$.'
          - problem: 'A proof shows that $P(1)$ is true and that $P(k)$ implies $P(k+1)$ for every $k \ge 2$. Does this prove $P(n)$ for every positive integer $n$?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "it does", "yes it does", "it proves it"], ["no", "it does not", "no it does not", "it doesn't", "not proved", "it does not prove it"]]}
            solution_sketch: 'The step is never shown for $k=1$, so nothing connects $P(1)$ to $P(2)$. The chain of implications starts at $P(2)$, which is not known to be true. So the proof is incomplete, and the answer is no.'
          - problem: 'A search method A tries all $n!$ orderings of $n$ items, and a method B tries $5^n$ codes. Find the smallest $n_0$ such that A tries more cases than B for every $n \ge n_0$.'
            answer: '12'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'We have $11!=39916800$, which is less than $5^{11}=48828125$, but $12!=479001600$ is more than $5^{12}=244140625$. From $n=12$ on, each step multiplies $n!$ by $n+1 \ge 13$ and $5^n$ by only $5$, so A stays ahead and $n_0=12$.'
          - problem: 'Write the full proof that $n! > 2^n$ for every integer $n \ge 4$, by induction on $n$.'
            answer: 'n! > 2^n for all n >= 4'
            answer_contract: {"kind": "none"}
            solution_sketch: 'We prove by induction on $n$ that $n! > 2^n$ for every integer $n \ge 4$. The base case must be $n=4$, because the claim fails for $n=1,2,3$, where $1<2$, $2<4$ and $6<8$. Base case: $4!=24$ and $2^4=16$, and $24>16$. Inductive hypothesis: let $k \ge 4$ be an integer and assume $k! > 2^k$. Then $(k+1)!=(k+1)\cdot k!$. Multiplying the strict inequality $k!>2^k$ by the positive number $k+1$ gives $(k+1)\cdot k! > (k+1)\cdot 2^k$. Since $k \ge 4$ we have $k+1 \ge 5 > 2$, so $(k+1)\cdot 2^k > 2\cdot 2^k = 2^{k+1}$. Chaining the inequalities gives $(k+1)! > 2^{k+1}$, which is the statement for $k+1$. By the principle of mathematical induction, $n! > 2^n$ for every integer $n \ge 4$.'
        constraints: "diagnose a broken step or find the correct starting threshold before proving Closed proof-audit items must require this knowledge point's method; verify every proposed inference for the stated arbitrary inputs. Do not supply the decisive result as an established fact."
