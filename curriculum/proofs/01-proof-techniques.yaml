      problem: 'Prove: if $r$ is rational and $r < 5$, then there is a rational number $t$ with $r < t < 5$.'
      answer: 'Take $t = \frac{r+5}{2}$. Writing $r = p/q$ with $p, q$ integers and $q \ne 0$ gives $t = \frac{p + 5q}{2q}$, a ratio of integers with nonzero denominator, so $t$ is rational. From $r < 5$: adding $r$ to both sides gives $2r < r + 5$, hence $r < t$; adding $5$ to both sides gives $r + 5 < 10$, hence $t < 5$. So $r < t < 5$.'
      solution_sketch: 'Use the midpoint: show it is rational by writing it as a single fraction, then obtain both inequalities from $r < 5$.'
