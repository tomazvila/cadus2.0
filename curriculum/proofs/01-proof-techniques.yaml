    diagnostic_exemplar:
      problem: 'Prove by contradiction that $\sqrt{6}$ is irrational.'
      answer: 'Suppose $\sqrt6$ were rational, say $\sqrt6 = p/q$ with $p, q$ integers, $q \ne 0$, and the fraction in lowest terms, so $\gcd(p, q) = 1$. Squaring gives $p^2 = 6q^2$, so $p^2$ is even; an odd $p$ would have odd square, so $p$ is even, say $p = 2k$. Substituting, $4k^2 = 6q^2$, i.e. $2k^2 = 3q^2$. The left side is even, so $3q^2$ is even, and since $3$ is odd this forces $q^2$ even and hence $q$ even. But then $2$ divides both $p$ and $q$, contradicting $\gcd(p,q) = 1$. Therefore $\sqrt6$ is irrational.'
      solution_sketch: 'Assume a lowest-terms representation, square it, and derive that numerator and denominator are both even — the contradiction with lowest terms.'
    anki_seeds:
      - front: 'Key idea in proving $\sqrt{2}$ irrational by contradiction?'
        back: 'Assume $\sqrt 2 = p/q$ in lowest terms; derive that $p$ and $q$ are both even, contradicting lowest terms.'
        type: basic
      - front: 'Key idea in Euclid''s proof that there are infinitely many primes?'
        back: 'If $p_1, \dots, p_k$ were all the primes, $p_1 \cdots p_k + 1$ would need a prime factor not in the list.'
        type: basic

