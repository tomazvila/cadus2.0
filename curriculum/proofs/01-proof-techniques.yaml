        key_prerequisites: [proof-by-cases]
        exemplars:
          - problem: "For real numbers x and y, the identity (larger of x and y) + (smaller of x and y) = x + y is unchanged when x and y are swapped. After assuming WLOG x <= y, give the value of (larger of x and y) - (smaller of x and y) as an expression in x and y."
            answer: "y - x"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (symmetry): swapping x and y does not change the claim, because the larger and the smaller exchange roles and addition is commutative, so the assumption WLOG x <= y is licensed. Step 2 (case): under x <= y, the smaller of x and y is x and the larger of x and y is y. Step 3 (subtract): the difference of the larger and the smaller is y minus x. The answer is y - x."
          - problem: "For integers m and n with different parities, the claim that m + n is odd is unchanged when m and n are swapped. After assuming WLOG m is even and n is odd, give m + n in terms of witnesses a and b with m = 2a and n = 2b + 1."
            answer: "2a + 2b + 1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (symmetry): swapping m and n leaves the claim that the sum is odd unchanged, since addition is commutative, so the WLOG assumption that m is even and n is odd is legitimate. Step 2 (definitions): evenness and oddness give witnesses, m = 2a and n = 2b + 1 for integers a and b. Step 3 (add): m + n = 2a + 2b + 1. The answer is 2a + 2b + 1."
          - problem: "For real numbers a and b, the identity abs(a - b) = abs(b - a) is unchanged when a and b are swapped. After assuming WLOG a >= b, give abs(a - b) as an expression in a and b."
            answer: "a - b"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (symmetry): swapping a and b replaces a - b by b - a, and the absolute value makes the two sides agree, so the identity is unchanged and WLOG a >= b is licensed. Step 2 (sign): under a >= b, the difference a - b is nonnegative. Step 3 (simplify): the absolute value of a nonnegative number is the number itself, so abs(a - b) = a - b. The answer is a - b."
          - problem: "For real numbers x and y, the expression (x + y + abs(x - y))/2 always gives the larger of x and y, and the claim is unchanged when x and y are swapped. Assume WLOG x <= y. Give the amount by which the larger of x and y exceeds the average (x + y)/2, as an expression in x and y."
            answer: "(y - x)/2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (symmetry): swapping x and y leaves the claim unchanged because the larger value and the absolute value term are unaffected in form, so WLOG x <= y is justified. Step 2 (case): under x <= y, abs(x - y) = y - x, so the expression becomes (x + y + y - x)/2, which is y. Step 3 (compare): the larger of x and y is y, and the average of x and y is (x + y)/2. Step 4 (subtract): y - (x + y)/2 = (2y - x - y)/2. The answer is (y - x)/2."
          - problem: "In the proof that the larger of x and y plus the smaller of x and y equals x + y, one writes WLOG x <= y. Which symmetry of the statement licenses this WLOG assumption?"
            answer: "Swap x and y"
            answer_contract: {"kind": "label", "options": [["Swap x and y"], ["Negate x"], ["Square x"], ["Translate x"]]}
            solution_sketch: "Step 1 (test the correct symmetry): the statement mentions the larger and the smaller of two numbers and their sum, so interchanging the two numbers exchanges the two roles and keeps the sum the same; the symmetry is Swap x and y. Step 2 (wrong option Negate x): negating one variable changes the two real numbers themselves, so the pair and its sum change and the statement is not preserved. Step 3 (wrong option Square x): squaring is not a reversible operation and does not act on the pair symmetrically, so it is not a symmetry of the statement. Step 4 (wrong option Translate x): shifting only one of the two numbers breaks the identity between the pair and the sum. The answer is Swap x and y."
          - problem: "In a WLOG proof that if integers m and n have different parities then m - n is odd, one first justifies that the claim is unchanged when m and n are swapped, then assumes WLOG that m is even and n is odd, with m = 2a and n = 2b + 1 for integers a and b. The line that computes m - n is missing. Select the line that follows from the WLOG assumption."
            answer: "2a - 2b - 1"
            answer_contract: {"kind": "label", "options": [["2a - 2b - 1"], ["2a - 2b"], ["(2a + 1) - 2b"], ["2a + 2b"]]}
            solution_sketch: "Step 1 (substitute the WLOG forms): with m = 2a and n = 2b + 1, the difference m - n is 2a - (2b + 1), which expands to 2a - 2b - 1, an odd integer. Step 2 (wrong option 2a - 2b): this drops the odd part, forgetting the extra 1 in n = 2b + 1, and gives an even value. Step 3 (wrong option (2a + 1) - 2b): this assigns the odd form to m instead of n, swapping the parities that the WLOG assumption fixed. Step 4 (wrong option 2a + 2b): this adds the two forms instead of subtracting, so it computes m + n rather than m - n. The answer is 2a - 2b - 1."
          - problem: "Write the full proof: for all real numbers x and y, the larger of x and y plus the smaller of x and y equals x + y. Use WLOG and justify the symmetry. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1 (symmetry): the statement involves the larger of x and y, the smaller of x and y, and the sum x + y. Swapping x and y exchanges the roles of larger and smaller, and since addition is commutative the sum is unchanged, so the statement is invariant under the swap of x and y. Step 2 (WLOG): this symmetry licenses the assumption without loss of generality that x <= y, because any pair violating it is handled by the swapped pair. Step 3 (definitions): under x <= y, the smaller of x and y is x and the larger of x and y is y. Step 4 (substitution): the larger plus the smaller is y + x. Step 5 (commutativity): y + x = x + y, which is the claimed right side. Step 6 (conclusion): the case x <= y together with its symmetric image covers every ordered pair of real numbers, so the identity holds for all real x and y. This is the full solution."
        constraints: "justify the symmetry that licenses the WLOG assumption before using it"
      - id: kp3
        name: "When WLOG is legitimate"
        key_prerequisites: [proof-by-cases]
        exemplars:
          - problem: "For all reals x, y, the statement x^2 + y^2 >= 2xy is unchanged by swapping x and y. A proof uses WLOG x >= y. How many of the two possible order cases remain to be proved?"
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Write the WLOG criterion: the statement must be unchanged by swapping x and y. The expression x^2 + y^2 >= 2xy is symmetric, so the case x < y follows from the proved case x >= y by relabeling. Thus one order case remains. The answer is 1."
          - problem: "A proof of 'if m is even and n is odd then m+n is odd' begins: Step 1: let m be even and n be odd. Step 2: WLOG m is even. Which statement explains why Step 2 is not a legitimate WLOG step?"
            answer: "The hypothesis is not symmetric in m and n."
            answer_contract: {"kind": "label", "options": [["The hypothesis is not symmetric in m and n."], ["The conclusion is not symmetric in m and n."], ["The integers m and n are not distinct."], ["The sum m + n is not symmetric."]]}
            solution_sketch: "WLOG is legitimate only when the whole statement is invariant under the swap m<->n. Here the hypothesis 'm even and n odd' changes roles, while the conclusion 'm+n odd' is symmetric. Option B is wrong because the conclusion is symmetric; option C is wrong because distinctness is irrelevant; option D is wrong because m+n is symmetric. The answer is The hypothesis is not symmetric in m and n."
          - problem: "For integers a, b with a+b odd, the swap a<->b leaves 'a+b is odd' unchanged, so WLOG assume a is odd. Under that assumption, what is the parity of b? Give 0 for even and 1 for odd."
            answer: "0"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The WLOG step is valid because a+b odd is symmetric under a<->b. Assume a is odd. Since an odd plus b is odd, b must be even. The parity of b is 0. The answer is 0."
          - problem: "Consider all ordered pairs (x,y) with x and y in the set {1,2,3}. For x^2 + y^2 >= 2xy, the swap x<->y leaves both sides unchanged, so WLOG assume x <= y. How many pairs (x,y) must be checked under this WLOG assumption?"
            answer: "6"
            answer_contract: {"kind": "exact"}
            solution_sketch: "List pairs with x <= y: (1,1), (1,2), (1,3), (2,2), (2,3), (3,3). The expression is symmetric under x<->y, so WLOG x <= y covers all ordered pairs. There are six unordered pairs with repetition. The answer is 6."
          - problem: "In a proof by exhaustion of 'if m and n have different parities then m times n is even', each assignment of parities to m and n that satisfies the hypothesis must be checked. How many such assignments are there?"
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Enumerate the case space of the exhaustion: the four assignments (even, even), (even, odd), (odd, even), (odd, odd). Filter by the hypothesis: different parities keeps (even, odd) and (odd, even). Both kept assignments are covered because the hypothesis and the conclusion are symmetric under swapping m and n, so a WLOG step m even is legitimate here. The answer is 2."
          - problem: "In a proof of 'for all reals x, y: |x-y| = |y-x|', the line that justifies 'WLOG assume x >= y' is missing. Select the missing line."
            answer: "Swapping x and y leaves |x-y| unchanged."
            answer_contract: {"kind": "label", "options": [["Swapping x and y leaves |x-y| unchanged."], ["Replacing x by -x leaves |x-y| unchanged."], ["Replacing y by y+1 leaves |x-y| unchanged."], ["Replacing x by 2x leaves |x-y| unchanged."]]}
            solution_sketch: "WLOG x >= y is legitimate only if the statement is invariant under the swap x<->y. The absolute difference satisfies |x-y| = |y-x| for all reals, so the swap changes nothing. Option B is wrong because replacing x by -x changes |x-y| in general; option C is wrong because y+1 changes the difference; option D is wrong because 2x changes the difference. The answer is Swapping x and y leaves |x-y| unchanged."
          - problem: "Write the full proof: for all reals x and y, x^2 + y^2 >= 2xy, with a legitimate WLOG step. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1: note the statement is symmetric under the swap x<->y, since x^2+y^2 and 2xy are unchanged. Step 2: therefore WLOG assume x >= y. Step 3: under this assumption, x-y >= 0. Step 4: compute x^2+y^2-2xy = (x-y)^2 >= 0. Step 5: hence x^2+y^2 >= 2xy. Step 6: by the symmetry in Step 1, the case x < y follows by swapping the names, so the WLOG step is legitimate and the claim holds for all reals. The answer is See the solution."
        constraints: "one valid and one invalid WLOG usage; the learner must articulate the symmetry criterion"
    diagnostic_exemplar:
      problem: 'Prove: for all integers $m, n$, if $m$ and $n$ have different parities then $mn$ is even. Use "without loss of generality", and justify in one sentence why the WLOG step is legitimate here.'
      answer: 'Both the hypothesis ("different parities") and the conclusion ($mn$ even) are unchanged when $m$ and $n$ are swapped, so a proof of one case covers the other by relabelling: WLOG $m$ is even and $n$ is odd. Then $m = 2a$ for an integer $a$, so $mn = 2(an)$ with $an$ an integer, i.e. $mn$ is even.'
      solution_sketch: 'State the symmetry that licenses WLOG, take the even factor to be $m$, and factor $2$ out of the product.'
    anki_seeds:
      - front: 'What justifies a "without loss of generality" assumption?'
        back: 'A symmetry of the statement: relabeling the variables maps the remaining cases onto the assumed one.'
        type: basic
      - front: 'What is a proof by exhaustion?'
        back: 'Checking every element of a finite set of cases individually; valid only when the cases provably cover everything.'
        type: basic

  - id: proof-by-contrapositive
    name: "Proof by Contrapositive"
    core: true
    difficulty: 0.60
    drill: false
    answer_kind: proof
    expected_time_secs: 210
    prerequisites:
      - id: conditional-statements
        weight: 0.5
        key: true
      - id: direct-proof
        weight: 0.5
        key: true
      - id: negating-statements
        weight: 0.4
      - id: logical-equivalence
        weight: 0.0
    knowledge_points:
      - id: kp1
        name: "When the contrapositive is easier"
        key_prerequisites: [conditional-statements]
        exemplars:
          - problem: "To prove by contrapositive that if n^2 is even then n is even, assume n is odd and write n = 2k + 1. Then n^2 = 2q + 1 for some integer q. Give q."
            answer: "2k^2+2k"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The contrapositive of 'if n^2 is even then n is even' is 'if n is odd then n^2 is odd'. Assume n = 2k + 1. Expand: n^2 = (2k + 1)^2 = 4k^2 + 4k + 1. Factor the even part: 4k^2 + 4k + 1 = 2(2k^2 + 2k) + 1. Thus q = 2k^2 + 2k. The expression is 2k^2+2k."
          - problem: "To prove by contrapositive that if n^2 is odd then n is odd, assume n is even and write n = 2k. Then n^2 = 2q for some integer q. Give q."
            answer: "2k^2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The contrapositive of 'if n^2 is odd then n is odd' is 'if n is even then n^2 is even'. Assume n = 2k. Square: n^2 = (2k)^2 = 4k^2. Write as 2(2k^2). Thus q = 2k^2. The expression is 2k^2."
          - problem: "For the statement 'if n^2 is even then n is even', which statement is its contrapositive?"
            answer: "if n is odd then n^2 is odd"
            answer_contract: {"kind": "label", "options": [["if n is odd then n^2 is odd"], ["if n is even then n^2 is even"], ["if n^2 is odd then n is odd"], ["if n is even then n^2 is odd"]]}
            solution_sketch: "The contrapositive of P -> Q is not Q -> not P. Here P is 'n^2 is even' and Q is 'n is even'. The negation of Q is 'n is odd'. The negation of P is 'n^2 is odd'. So the contrapositive is 'if n is odd then n^2 is odd'. Option 'if n is even then n^2 is even' is the converse. Option 'if n^2 is odd then n is odd' is the inverse. Option 'if n is even then n^2 is odd' swaps without negating correctly. The contrapositive is if n is odd then n^2 is odd."
          - problem: "To prove by contrapositive that if 3n + 2 is odd then n is odd, assume n is even and write n = 2k. Then 3n + 2 = 2p for some integer p. Give p."
            answer: "3k+1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The contrapositive of 'if 3n + 2 is odd then n is odd' is 'if n is even then 3n + 2 is even'. Assume n = 2k. Substitute: 3n + 2 = 6k + 2. Factor 2: 6k + 2 = 2(3k + 1). Thus p = 3k + 1. The expression is 3k+1."
          - problem: "Claim: if 3n + 2 is odd then n is odd. A proof by contrapositive has these steps. Step 1: The contrapositive is: if n is even then 3n + 2 is even. Step 2: Assume n is even and write n = 2k for an integer k. Step 3: Then 3n + 2 = 6k + 5. Step 4: So 3n + 2 = 2(3k + 2) + 1, which is odd. Step 5: So the contrapositive holds, and the claim follows. Which step is the first step that is not valid?"
            answer: "Step 3"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"], ["Step 5"]]}
            solution_sketch: "Step 1 states the contrapositive correctly, so it is valid. Step 2 sets up the assumption of the contrapositive, so it is valid. Step 3 is false: with n = 2k we get 3n + 2 = 6k + 2, not 6k + 5. Step 4 is correct arithmetic only after the wrong Step 3. Step 5 draws the conclusion from the faulty line. The first invalid step is Step 3."
          - problem: "In the contrapositive proof of 'if n^2 is even then n is even', after assuming n is odd and writing n = 2k + 1, the line n^2 = ? is missing. Select the line that shows n^2 is odd."
            answer: "2(2k^2+2k)+1"
            answer_contract: {"kind": "label", "options": [["2(2k^2+2k)+1"], ["2(2k^2+2k)"], ["2k^2+2k+1"], ["4k^2+1"]]}
            solution_sketch: "Expand (2k + 1)^2 = 4k^2 + 4k + 1. Factor the even part as 2(2k^2 + 2k) and add 1, so n^2 is odd. Option 2(2k^2+2k) omits the +1. Option 2k^2+2k+1 is missing a factor 2. Option 4k^2+1 drops the middle term 4k. The correct line is 2(2k^2+2k)+1."
          - problem: "Write the full proof: for all integers n, if n^2 is even then n is even. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "State the contrapositive. The contrapositive of 'if n^2 is even then n is even' is 'if n is odd then n^2 is odd'. Prove the contrapositive directly. Assume n is odd, so n = 2k + 1 for some integer k. Square n: n^2 = (2k + 1)^2 = 4k^2 + 4k + 1. Factor the even part: 4k^2 + 4k + 1 = 2(2k^2 + 2k) + 1. This has the form 2q + 1 with q = 2k^2 + 2k, so n^2 is odd. Therefore n^2 is not even. Since the contrapositive is true, the original implication is true: if n^2 is even then n is even."
        constraints: "state the contrapositive $\\neg Q \\to \\neg P$, then prove it directly"
      - id: kp2
        name: "Contrapositive proofs about integers"
        key_prerequisites: [direct-proof]
        exemplars:
          - problem: "To prove: for integers a and b, if ab is odd, then a is odd and b is odd, use the contrapositive: if a is even or b is even, then ab is even. In the case a is even, take a = 6 and b = 7. Give q so that ab = 2q."
            answer: "21"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The contrapositive negates the conjunction conclusion: if a is even or b is even, then ab is even. Case a is even: write a = 2k, so ab = (2k)b = 2(kb), which is even for every b. With a = 6 and b = 7: ab = 42 = 2(21). The answer is 21."
          - problem: "To prove: for integers n, if n^2 - 6n + 5 is even, then n is odd, use the contrapositive: if n is even, then n^2 - 6n + 5 is odd. Take the even value n = 8. Give m so that n^2 - 6n + 5 = 2m + 1."
            answer: "10"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The contrapositive is: if n is even, then n^2 - 6n + 5 is odd. Take n = 8, which is n = 2k with k = 4. Then n^2 - 6n + 5 = 64 - 48 + 5 = 21 = 2(10) + 1, an odd number, as the contrapositive requires. The answer is 10."
          - problem: "To prove: for integers a and b, if a^2 b is odd, then a is odd and b is odd, use the contrapositive: if a is even or b is even, then a^2 b is even. In the case b is even, take b = 4 and a = 5. Give q so that a^2 b = 2q."
            answer: "50"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The contrapositive is: if a is even or b is even, then a^2 b is even. Case b is even: write b = 2m, so a^2 b = 2(a^2 m), which is even. With b = 4 and a = 5: a^2 b = 25 * 4 = 100 = 2(50). The answer is 50."
          - problem: "To prove: for integers a and b, if a + b is odd, then a is odd and b is even or a is even and b is odd, use the contrapositive: if a and b have the same parity, then a + b is even. In the case both are odd, take a = 7 and b = 3. Give q so that a + b = 2q."
            answer: "5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The contrapositive assumes the negation of the disjunction conclusion: a and b have the same parity. Case both odd: write a = 2k + 1 and b = 2m + 1, so a + b = 2k + 2m + 2 = 2(k + m + 1), even. With a = 7 and b = 3: a + b = 10 = 2(5). The answer is 5."
          - problem: "Claim: for integers a and b, if ab is odd, then a is odd and b is odd. A student offers a proof. Step 1: the contrapositive is: if a is odd or b is odd, then ab is odd. Step 2: in the case a is odd, write a = 2k + 1. Step 3: then ab = (2k + 1)b = 2kb + b. Step 4: this is odd in every case, so the claim holds. Which step is the first step that is not valid?"
            answer: "Step 1"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "Step 1 is the first invalid step: it states the inverse instead of the contrapositive, because the negation of the conclusion a is odd and b is odd is a is even or b is even. Step 2 is a correct write of the case a is odd as a = 2k + 1, valid algebra under the wrong Step 1. Step 3 expands correctly: (2k + 1)b = 2kb + b. Step 4 fails since 2kb + b need not be odd, but its failure goes back to Step 1. The answer is Step 1."
          - problem: "Claim: for integers a and b, if ab is odd, then a is odd and b is odd. In the contrapositive proof, the case a is even begins with a = 2k. The line that shows ab is even is missing. Select the line that is true and completes this case."
            answer: "ab = 2(kb)"
            answer_contract: {"kind": "label", "options": [["ab = 2(kb)"], ["ab = 2(k + b)"], ["ab = 2k + b"], ["ab = kb"]]}
            solution_sketch: "The contrapositive is: if a is even or b is even, then ab is even. Case a is even: write a = 2k, so ab = (2k)b = 2(kb). The option ab = 2(k + b) is the error of distributing the factor 2 over a sum. The option ab = 2k + b leaves b outside the factor 2. The option ab = kb drops the factor 2 entirely. The answer is ab = 2(kb)."
          - problem: "Write the full proof: for integers a and b, if ab is odd, then a is odd and b is odd. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Claim: for integers a and b, if ab is odd, then a is odd and b is odd. Step 1: state the contrapositive: if a is even or b is even, then ab is even; this negates the conjunction a is odd and b is odd by De Morgan. Step 2: case one, a is even: write a = 2k for some integer k, so ab = (2k)b = 2(kb), which is even. Step 3: case two, b is even: write b = 2m for some integer m, so ab = a(2m) = 2(am), which is even. Step 4: both cases of the disjunction give ab even, so the contrapositive holds in every case. Step 5: a statement and its contrapositive are logically equivalent, so the original claim holds for all integers a and b. The proof is complete."
        constraints: "negate a conjunction conclusion; handle the resulting disjunction"
      - id: kp3
        name: "Contrapositive with real numbers"
        key_prerequisites: [negating-statements]
        exemplars:
          - problem: "To prove: for real x, if x^2 is irrational then x is irrational. For the contrapositive, assume x = p/q is rational. With p = 3 and q = 4, compute x^2 as a fraction."
            answer: "9/16"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (contrapositive equivalence): the claim is equivalent to: if x is rational then x^2 is rational. Step 2 (definition of rational): write x = p/q; with p = 3 and q = 4 this gives x = 3/4. Step 3 (algebra): x^2 = 3^2/4^2 = 9/16, a quotient of integers, hence rational. The value is 9/16."
          - problem: "Claim: for real x, if x^3 + 1 is irrational then x is irrational. The proof is by contrapositive, so take x = p/q to be rational. With p = 2 and q = 3, compute x^3 + 1 as a fraction."
            answer: "35/27"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (contrapositive equivalence): the claim is equivalent to: if x is rational then x^3 + 1 is rational. Step 2 (definition of rational): write x = p/q; with p = 2 and q = 3 this gives x = 2/3. Step 3 (algebra): x^3 + 1 = 8/27 + 27/27 = 35/27, a quotient of integers, hence rational. The value is 35/27."
          - problem: "Claim: for real x, if 4x - 3 is irrational then x is irrational. Its contrapositive says: if x is rational then 4x - 3 is rational. Take the rational value x = 1/6. Compute 4x - 3 as a fraction."
            answer: "-7/3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (contrapositive equivalence): prove instead that x rational forces 4x - 3 rational. Step 2 (definition of rational): x = 1/6 is a quotient of integers. Step 3 (algebra): 4x - 3 = 4/6 - 3 = 2/3 - 9/3 = -7/3, a quotient of integers with nonzero denominator, hence rational. The value is -7/3."
          - problem: "Claim: for real x, if x^2 + 1 is irrational then x is irrational. Step 1: prove the contrapositive: if x is rational then x^2 + 1 is rational. Step 2: write x = p/q with integers p and q and q not 0. Step 3: x^2 + 1 = p^2/q^2 + q^2/q^2 = (p^2 + q^2)/q^2. Step 4: this is a quotient of two integers, so it is an integer; hence x^2 + 1 is rational. Which step is the first step that is not valid?"
            answer: "Step 4"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "Step 1 states the contrapositive correctly, so it is valid. Step 2 applies the definition of rational, so it is valid. Step 3 is correct algebra because 1 is written as q^2/q^2. Step 4 is the first invalid step: a quotient of two integers is rational but need not be an integer, for example 1/2, so the conclusion is drawn from a false assertion. The first invalid step is Step 4."
          - problem: "In the contrapositive proof of: for real x, if 3x + 2 is irrational then x is irrational, assume x = p/q is rational. The line that rewrites 3x + 2 in terms of p and q is missing. Select the line that follows from x = p/q."
            answer: "(3p+2q)/q"
            answer_contract: {"kind": "label", "options": [["(3p+2q)/q"], ["(3p+2)/q"], ["(3p-2q)/q"], ["3(p+2)/q"]]}
            solution_sketch: "Step 1 (definition of rational): x = p/q with integers p and q and q not 0. Step 2 (algebra): 3x + 2 = 3p/q + 2 = 3p/q + 2q/q = (3p+2q)/q. The option (3p+2)/q forgets to write 2 over the denominator q. The option (3p-2q)/q has a sign error on the term 2q. The option 3(p+2)/q wrongly factors 3x + 2 as 3(x + 2). The correct line is (3p+2q)/q."
