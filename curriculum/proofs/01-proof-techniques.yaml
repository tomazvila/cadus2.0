        type: basic
      - front: 'To prove $a \mid (bx + cy)$ from $a \mid b$ and $a \mid c$...'
        back: 'Write $b = ak$, $c = al$, then factor: $bx + cy = a(kx + ly)$.'
        type: basic

  - id: proof-by-cases
    name: "Proof by Cases"
    core: true
    difficulty: 0.55
    drill: false
    answer_kind: proof
    expected_time_secs: 200
    prerequisites:
      - id: direct-proof
        weight: 0.5
        key: true
