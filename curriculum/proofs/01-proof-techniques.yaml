unit: proof-techniques
course: proofs
module: "Proof Techniques"
topics:
  - id: direct-proof
    name: "Direct Proof"
    core: true
    difficulty: 0.50
    drill: false
    answer_kind: proof
    expected_time_secs: 200
    prerequisites:
      - id: quantifiers
        weight: 0.5
        key: true
      - id: conditional-statements
        weight: 0.4
        key: true
      - id: rules-of-inference
        weight: 0.3
      - id: evaluating-expressions
        weight: 0.0
    knowledge_points:
      - id: kp1
        name: "The direct-proof template on parity"
        key_prerequisites: [conditional-statements]
        exemplars:
          - problem: 'In a direct proof that the sum of an even integer $m$ and an odd integer $n$ is odd, we write $m = 2a$ and $n = 2b + 1$ for integers $a$ and $b$, and then $m + n = 2c + 1$. Which expression in $a$ and $b$ is $c$?'
            answer: 'a+b'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Adding the two expressions gives $m + n = 2a + 2b + 1 = 2(a + b) + 1$. So $c = a + b$, which is an integer because $a$ and $b$ are integers, and $m + n$ has the form $2c + 1$ of an odd integer.'
          - problem: 'Let $x$ be an odd integer, so $x = 2k + 1$ for an integer $k$. In a direct proof that $x^3$ is odd, we show that $x^3 = 2m + 1$ for an integer $m$. Write $m$ in terms of $k$.'
            answer: '4k^3+6k^2+3k'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Expanding gives $x^3 = (2k + 1)^3 = 8k^3 + 12k^2 + 6k + 1$. The first three terms are $2(4k^3 + 6k^2 + 3k)$, so $x^3 = 2m + 1$ with $m = 4k^3 + 6k^2 + 3k$.'
          - problem: 'Two groups of hikers walk together. The first group has $11$ hikers and the second group has $15$ hikers, so each group has an odd number of members. Writing $11 = 2a + 1$ and $15 = 2b + 1$, the total number of hikers is $2(a + b + 1)$. How many pairs can the whole party form if everyone has a partner?'
            answer: '13'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'We have $11 = 2 \cdot 5 + 1$ and $15 = 2 \cdot 7 + 1$, so $a = 5$ and $b = 7$. The total is $2(5 + 7 + 1) = 26$ hikers, which form $13$ pairs.'
          - problem: 'A proof that the sum of two odd integers is even writes $m = 2k + 1$ and $n = 2k + 1$, then $m + n = 4k + 2 = 2(2k + 1)$, so $m + n$ is even. Is this a correct proof for all odd integers $m$ and $n$?'
            answer: 'no'
            answer_contract: {"kind":"label","options":[["yes","the proof is correct","a correct proof","true","it is true","correct","it is correct","yes it is"],["no","not a correct proof","the proof is wrong","wrong","false","it is false","not true","incorrect"]]}
            solution_sketch: 'Using the same letter $k$ for both numbers forces $m = n$. The argument covers only equal odd integers such as $3 + 3$, and it says nothing about $3 + 5$. A correct proof writes $m = 2k + 1$ and $n = 2l + 1$ with two integers $k$ and $l$.'
          - problem: 'The odd integers $m = 7$ and $n = 9$ are written $m = 2a + 1$ and $n = 2b + 1$. A direct proof that $mn$ is odd shows that $mn = 2c + 1$, where $c = 2ab + a + b$. Find $c$.'
            answer: '31'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Here $a = 3$ and $b = 4$, so $c = 2 \cdot 3 \cdot 4 + 3 + 4 = 31$. As a check, $mn = 63 = 2 \cdot 31 + 1$, which is odd.'
          - problem: 'A teacher puts the $35$ students of a class into pairs and one student is left over, because $35$ is odd. A direct proof writes $35 = 2k + 1$ for an integer $k$. How many pairs of students are formed?'
            answer: '17'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'We solve $35 = 2k + 1$ and get $k = 17$. So the class forms $17$ pairs, and one student is left over.'
          - problem: 'Write the full proof that for every integer $x$, if $x$ is odd then $x^3$ is odd.'
            answer: 'x odd => x^3 odd'
            answer_contract: {"kind":"none"}
            solution_sketch: 'Let $x$ be an odd integer. By the definition of an odd integer, $x = 2k + 1$ for some integer $k$. Then $x^3 = (2k + 1)^3 = 8k^3 + 12k^2 + 6k + 1$. Group the terms: $x^3 = 2(4k^3 + 6k^2 + 3k) + 1$. Put $m = 4k^3 + 6k^2 + 3k$. The integers are closed under addition and multiplication, and $k$ is an integer, so $m$ is an integer. Therefore $x^3 = 2m + 1$ with $m$ an integer, and by the definition of an odd integer, $x^3$ is odd. Since $x$ was an arbitrary odd integer, this proves that the cube of every odd integer is odd.'
        constraints: 'assume the hypothesis and derive the conclusion; unpack even as $2k$ and odd as $2k+1$ with a separate integer for each number; error analysis, word contexts and a textbook proof'
      - id: kp2
        name: "Direct proofs with algebra and inequalities"
        key_prerequisites: [evaluating-expressions]
        exemplars:
          - problem: 'In a direct proof that $x + \frac{1}{x} \ge 2$ for every real $x > 0$, we start from $(x - 1)^2 \ge 0$ and divide both sides by $x$. Expand $\frac{(x - 1)^2}{x}$.'
            answer: 'x-2+1/x'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Expanding the numerator gives $(x - 1)^2 = x^2 - 2x + 1$. Dividing each term by $x$ gives $x - 2 + \frac{1}{x}$. Since this is at least $0$, adding $2$ gives $x + \frac{1}{x} \ge 2$.'
          - problem: 'In a proof that $a < b < 0$ implies $a^2 > b^2$, we show that $(b - a)(a + b) < 0$. Evaluate $(b - a)(a + b)$ for $a = -5$ and $b = -2$.'
            answer: '-21'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'We have $b - a = 3$ and $a + b = -7$, so the product is $3 \cdot (-7) = -21$. This equals $b^2 - a^2 = 4 - 25 = -21$, which is negative, as the proof requires.'
          - problem: 'Is the statement "for all real numbers $a$, $b$ and $c$, if $a \le b$ and $c \le 0$, then $ac \ge bc$" true?'
            answer: 'yes'
            answer_contract: {"kind":"label","options":[["yes","it is true","true","the statement is true","correct","it is correct","yes it is"],["no","it is false","false","the statement is false","not true","incorrect","it is not correct"]]}
            solution_sketch: 'The statement is true. Since $c \le 0$, the number $-c$ is at least $0$, and multiplying $a \le b$ by $-c \ge 0$ keeps the direction, so $-ac \le -bc$. Multiplying by $-1$ reverses the inequality again and gives $ac \ge bc$.'
          - problem: 'Take $b = 2$. Which integer $a$ makes the statement "$a < b$ implies $a^2 < b^2$" false?'
            answer: '-3'
            answer_contract: {"kind":"property","check":"integer_in_range","args":{"max":-2}}
            solution_sketch: 'We need $a < 2$ and $a^2 \ge 4$. For $a = -3$ we have $-3 < 2$, but $a^2 = 9$ and $b^2 = 4$, so $a^2 < b^2$ is false. Every integer $a \le -2$ works, and $a = -3$ is one of them.'
          - problem: 'A farmer has $40$ metres of fence for a rectangular pen with sides $x$ and $y$ metres, so $x + y = 20$. A direct proof shows that $xy \le \left(\frac{x + y}{2}\right)^2$ by starting from $(x - y)^2 \ge 0$. What is the largest area the pen can have?'
            answer: '100'
            answer_contract: {"kind":"unit","quantity":"area","unit":"m^2","allow_omitted":true}
            solution_sketch: 'From $(x - y)^2 \ge 0$ we get $x^2 + y^2 \ge 2xy$, so $(x + y)^2 \ge 4xy$ and $xy \le \left(\frac{x + y}{2}\right)^2 = 10^2 = 100$. The bound is reached at $x = y = 10$, so the largest area is $100$ square metres.'
          - problem: 'A shop raises a price by $20\%$ and then lowers the new price by $20\%$. A direct proof writes the final price as $P(1 + 0.2)(1 - 0.2) = P(1 - 0.04)$ and sees that it is less than $P$. What percent of the original price $P$ is the final price?'
            answer: '96%'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'We have $(1 + 0.2)(1 - 0.2) = 1 - 0.04 = 0.96$. So the final price is $0.96P$, which is $96\%$ of the original price and less than $P$.'
          - problem: 'Write the full proof that for all real numbers $a$ and $b$, if $a < b < 0$ then $a^2 > b^2$.'
            answer: 'a < b < 0 => a^2 > b^2'
            answer_contract: {"kind":"none"}
            solution_sketch: 'Suppose $a$ and $b$ are real numbers with $a < b < 0$. Since $a < b$, the number $b - a$ is positive. Since $a < 0$ and $b < 0$, the sum $a + b$ is negative. A positive number times a negative number is negative, so $(b - a)(a + b) < 0$. Expanding the product gives $(b - a)(a + b) = ab + b^2 - a^2 - ab = b^2 - a^2$. Hence $b^2 - a^2 < 0$, that is, $b^2 < a^2$, and so $a^2 > b^2$. Since $a$ and $b$ were arbitrary real numbers with $a < b < 0$, the statement is proved.'
        constraints: 'algebra and sign rules with a named reason for each step; expand a given square; error analysis on multiplying an inequality; word problems with bounds; a textbook inequality proof'
      - id: kp3
        name: "Direct proofs about divisibility"
        key_prerequisites: [quantifiers]
        exemplars:
          - problem: 'Suppose $5 \mid n$, so $n = 5k$ for an integer $k$. In a direct proof that $5 \mid (n^2 + 10n)$, we write $n^2 + 10n = 5m$. Write $m$ in terms of $k$.'
            answer: '5k^2+10k'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Substituting $n = 5k$ gives $n^2 + 10n = 25k^2 + 50k = 5(5k^2 + 10k)$. So $m = 5k^2 + 10k$, which is an integer because $k$ is an integer.'
          - problem: 'Let $b = 28$ and $d = 27$, so $4 \mid b$ and $9 \mid d$. A direct proof writes $b = 4k$ and $d = 9l$ and concludes that $bd = 36m$ with $m = kl$. Find $m$.'
            answer: '21'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'We have $28 = 4 \cdot 7$ and $27 = 9 \cdot 3$, so $k = 7$ and $l = 3$. Then $m = kl = 21$, and indeed $bd = 756 = 36 \cdot 21$.'
          - problem: 'In a proof that $a \mid b$ and $b \mid c$ imply $a \mid c$, we write $b = ak$ and $c = bl$ and obtain $c = a(kl)$. Find $kl$ when $a = 4$, $b = 12$ and $c = 60$.'
            answer: '15'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'We have $12 = 4 \cdot 3$, so $k = 3$, and $60 = 12 \cdot 5$, so $l = 5$. Then $kl = 15$, and indeed $c = 60 = 4 \cdot 15$.'
          - problem: 'Is it true that if $a \mid bc$ then $a \mid b$ or $a \mid c$, for all positive integers $a$, $b$ and $c$?'
            answer: 'no'
            answer_contract: {"kind":"label","options":[["yes","the claim is true","true","it is true","correct","it is correct","yes it is"],["no","the claim is false","not true for all","false","it is false","not true","incorrect","it is not correct"]]}
            solution_sketch: 'The claim fails for $a = 6$, $b = 2$ and $c = 3$. Here $6 \mid bc = 6$, but $6 \nmid 2$ and $6 \nmid 3$.'
          - problem: 'Eggs are packed $12$ to a box and boxes are packed $5$ to a crate, so $12$ divides the $60$ eggs of a crate. Crates are packed $5$ to a pallet, so $60$ divides the $300$ eggs of a pallet. A direct proof concludes that $12$ divides $300$. How many boxes of eggs are on one pallet?'
            answer: '25'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'By the proof, $300 = 12 \cdot (5 \cdot 5)$, because a crate holds $5$ boxes and a pallet holds $5$ crates. So a pallet holds $25$ boxes, and $300 \div 12 = 25$.'
          - problem: 'A baker packs $8$ rolls to a tray. On Monday the baker bakes $b = 40$ rolls and on Tuesday $c = 56$ rolls, and both numbers are multiples of $8$. A direct proof shows that $8 \mid (b + c)$. How many full trays do the two days give together?'
            answer: '12'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Write $40 = 8 \cdot 5$ and $56 = 8 \cdot 7$. Then $b + c = 8(5 + 7) = 96$, so the two days fill $12$ trays and no rolls are left over.'
          - problem: 'Write the full proof that for all integers $a$, $b$, $c$ and $d$, if $a \mid b$ and $c \mid d$ then $ac \mid bd$. Here $x \mid y$ means that $y = xt$ for some integer $t$.'
            answer: 'a|b and c|d => ac|bd'
            answer_contract: {"kind":"none"}
            solution_sketch: 'Let $a$, $b$, $c$ and $d$ be integers with $a \mid b$ and $c \mid d$. By the definition of divisibility, there is an integer $k$ with $b = ak$, and there is an integer $l$ with $d = cl$. Multiplying the two equations gives $bd = (ak)(cl) = (ac)(kl)$. Since $k$ and $l$ are integers and the integers are closed under multiplication, $kl$ is an integer. So $bd = (ac)(kl)$ with $kl$ an integer, and by the definition of divisibility, $ac \mid bd$. Since $a$, $b$, $c$ and $d$ were arbitrary, the statement is proved.'
        constraints: 'unpack each divisibility hypothesis as an equation with an integer multiplier and factor the divisor out of the target; error analysis, packing and splitting contexts, and a textbook divisibility proof'
    diagnostic_exemplar:
      problem: 'Prove: for all integers $a, b$, if $a \mid b$ then $a \mid (3b^2 + b)$.'
      answer: 'Suppose $a \mid b$, so $b = ak$ for some integer $k$. Then $3b^2 + b = 3(ak)^2 + ak = a(3ak^2 + k)$, and $3ak^2 + k$ is an integer, so $a \mid (3b^2 + b)$ by the definition of divisibility.'
      solution_sketch: 'Unfold the divisibility hypothesis as $b = ak$, substitute, and factor $a$ out of the result.'
    anki_seeds:
      - front: 'Structure of a direct proof of $\forall x\, (P(x) \to Q(x))$?'
        back: 'Take an arbitrary $x$ for which $P(x)$ is true, then derive $Q(x)$ using definitions and known facts.'
        type: basic
      - front: 'Definitions of even and odd integers?'
        back: 'Even: $n = 2k$ for some integer $k$. Odd: $n = 2k + 1$ for some integer $k$.'
        type: basic

  - id: vacuous-trivial-proofs
    name: "Vacuous and Trivial Proofs"
    core: false                # supplemental: edge-case enrichment on the conditional
    difficulty: 0.52
    drill: false
    answer_kind: proof
    expected_time_secs: 150
    prerequisites:
      - id: direct-proof
        weight: 0.5
        key: true
      - id: truth-tables
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: "Vacuous proofs"
        key_prerequisites: [truth-tables]
        try_first:
          problem: 'Is the statement "for every real number $x$, if $x^2 = -9$ then $x > 100$" true?'
          answer_contract: {"kind":"label","options":[["yes","it is true","vacuously true","true","correct","it is correct","yes it is"],["no","false","it is false","not true","incorrect","it is not correct","no it is not"]]}
          answer: 'yes'
          reveal: 'No real number has square $-9$, so there is no $x$ for which the statement could fail. A statement whose hypothesis is never true holds vacuously, whatever its conclusion says.'
        exemplars:
          - problem: 'Is the statement "for every real number $x$, if $x^2 + 4 = 0$ then $x < -7$" true or false?'
            answer: 'true'
            answer_contract: {"kind":"label","options":[["true","it is vacuously true","vacuously true","it is true","the statement is true","yes"],["false","it is false","the statement is false","no"]]}
            solution_sketch: 'No real number satisfies $x^2 + 4 = 0$, because $x^2 + 4 \ge 4$ for every real $x$. So the hypothesis is never true, and the implication is true for every $x$, whatever the conclusion says.'
          - problem: 'To show that $x^2 - 4x + 5 = 0$ has no real solution, we write $x^2 - 4x + 5 = (x - 2)^2 + c$. Find $c$.'
            answer: '1'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Since $(x - 2)^2 = x^2 - 4x + 4$, we need $c = 1$. Then $x^2 - 4x + 5 = (x - 2)^2 + 1 \ge 1$, so the expression is never $0$ for a real $x$.'
          - problem: 'To show that $x^2 - 6x + 10 = 0$ has no real solution, we compute the discriminant $b^2 - 4ac$. What is its value?'
            answer: '-4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Here $a = 1$, $b = -6$ and $c = 10$, so $b^2 - 4ac = 36 - 40 = -4$. The discriminant is negative, so the equation has no real solution and the hypothesis is never true.'
          - problem: 'Is the statement "for every integer $n$, if $2n = 1$ then $n > 10$" true?'
            answer: 'yes'
            answer_contract: {"kind": "label", "options": [["yes", "it is", "true", "yes it is"], ["no", "it is not", "false", "no it is not"]]}
            solution_sketch: 'No integer $n$ satisfies $2n = 1$, since $2n$ is even and $1$ is odd. So the hypothesis is never true, and the statement is true vacuously.'
          - problem: 'A quiz has $40$ questions. The rule says: if a student answers more than $40$ questions correctly, then the student wins a car. The quiz is taken by $25$ students. How many students can win a car by this rule?'
            answer: '0'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'A student can answer at most $40$ questions correctly, so no student answers more than $40$ correctly. The hypothesis is never true, so no student wins a car by the rule. The rule is true vacuously, and the answer is $0$.'
          - problem: 'A hotel has $12$ rooms numbered $1$ to $12$. The manager promises a free breakfast to every guest in a room whose number is greater than $12$. How many of the $12$ rooms are covered by the promise?'
            answer: '0'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'No room number from $1$ to $12$ is greater than $12$. So the condition of the promise is never met, and the promise covers $0$ rooms. The promise is true vacuously.'
          - problem: 'Write the full proof that for every set $A$, the empty set is a subset of $A$, that is, $\emptyset \subseteq A$.'
            answer: 'empty set is a subset of every set'
            answer_contract: {"kind":"none"}
            solution_sketch: 'Let $A$ be any set. By the definition of subset, $\emptyset \subseteq A$ means that for every object $x$, if $x \in \emptyset$ then $x \in A$. By the definition of the empty set, no object $x$ satisfies $x \in \emptyset$. So for every $x$ the hypothesis $x \in \emptyset$ is false, and an implication with a false hypothesis is true. Thus the statement "if $x \in \emptyset$ then $x \in A$" holds for every $x$, whether or not $x \in A$. This proves that $\emptyset \subseteq A$. The proof is vacuous: it never uses any fact about $A$.'
        constraints: 'show the hypothesis is never true by completing the square, a discriminant or parity; the conclusion may be absurd; word contexts with an impossible condition; a textbook vacuous proof about sets'
      - id: kp2
        name: "Trivial proofs"
        key_prerequisites: [direct-proof]
        exemplars:
          - problem: 'To show that "if $x > 7$ then $(x - 3)^2 + 1 > 0$" holds for every real $x$ without using $x > 7$, we find the least value of $(x - 3)^2 + 1$. What is it?'
            answer: '1'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Since $(x - 3)^2 \ge 0$ for every real $x$, we get $(x - 3)^2 + 1 \ge 1 > 0$. The least value is $1$, reached at $x = 3$. The conclusion holds without the hypothesis.'
          - problem: 'Is the statement "for every integer $n$, if $n$ is prime then $n^2 \ge 0$" true?'
            answer: 'yes'
            answer_contract: {"kind":"label","options":[["yes","it is trivially true","trivially true","true","it is true","correct","it is correct","yes it is"],["no","false","it is false","not true","incorrect","it is not correct","no it is not"]]}
            solution_sketch: 'The square of every integer is at least $0$, so the conclusion $n^2 \ge 0$ is true for every integer $n$. The hypothesis is not needed. So the implication is true for every $n$, prime or not.'
          - problem: 'The expression $(x + 2)^2 + 1$ is positive for every real $x$. At which value of $x$ does it take its least value?'
            answer: '-2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The square $(x + 2)^2$ is least, namely $0$, when $x + 2 = 0$, that is, at $x = -2$. There the expression equals $1$, and it is larger for every other $x$.'
          - problem: 'What is the largest positive integer $x$ for which $x^2 > 40$ is false?'
            answer: '6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'We have $6^2 = 36 \le 40$, but $7^2 = 49 > 40$ and larger integers give larger squares. So the conclusion is false for $x = 6$, and it is not true for every real $x$. A proof of the statement "for every real $x$, if $x > 7$ then $x^2 > 40$" must use the hypothesis $x > 7$.'
          - problem: 'A shop gives every customer a receipt. The rule "if a customer spends more than $50$ euros, then the customer gets a receipt" is therefore true by a trivial proof. On a day with $120$ customers, of whom $45$ spend more than $50$ euros, how many customers get a receipt?'
            answer: '120'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The conclusion "the customer gets a receipt" is true for every customer, whatever the customer spends. So all $120$ customers get a receipt. The $45$ customers who spend more than $50$ euros are not special.'
          - problem: 'The two facing pages of a book have page numbers $n$ and $n + 1$. The product $n(n + 1)$ is always even, so the rule "if $n$ is divisible by $7$ then $n(n + 1)$ is even" holds trivially. What is the product for $n = 21$?'
            answer: '462'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'For $n = 21$ the facing pages are $21$ and $22$, and the product is $21 \cdot 22 = 462$. This number is even, as the rule says, because one of two consecutive integers is always even.'
          - problem: 'Write the full proof that for every integer $n$, if $7 \mid n$ then $n(n + 1)$ is even. Here $7 \mid n$ means that $n = 7t$ for some integer $t$.'
            answer: '7|n => n(n+1) even'
            answer_contract: {"kind":"none"}
            solution_sketch: 'Let $n$ be an integer. We prove that $n(n + 1)$ is even without using the hypothesis $7 \mid n$. Every integer is either even or odd. Case 1: $n$ is even. Then $n = 2k$ for some integer $k$, and $n(n + 1) = 2k(2k + 1) = 2(k(2k + 1))$. Since $k(2k + 1)$ is an integer, $n(n + 1)$ is even. Case 2: $n$ is odd. Then $n = 2k + 1$ for some integer $k$, and $n(n + 1) = (2k + 1)(2k + 2) = 2((2k + 1)(k + 1))$. Since $(2k + 1)(k + 1)$ is an integer, $n(n + 1)$ is even. In both cases $n(n + 1)$ is even, for every integer $n$. So the conclusion is true whether or not $7 \mid n$, and the implication is true. This is a trivial proof.'
        constraints: 'show the conclusion is true for every value of the variable: a square is nonnegative, a minimum value, consecutive integers; the hypothesis is not used; word contexts; error analysis for a conclusion that is not always true; a textbook trivial proof'
      - id: kp3
        name: "Recognizing which template applies"
        key_prerequisites: [truth-tables]
        exemplars:
          - problem: 'Which template proves "for every real number $x$, if $x^2 + 1 = 0$ then $x > 5$": a vacuous proof, a trivial proof, both, or neither?'
            answer: 'vacuous'
            answer_contract: {"kind":"label","options":[["vacuous","a vacuous proof","vacuous proof","vacuous only","only vacuous","the vacuous template"],["trivial","a trivial proof","trivial proof","trivial only","only trivial","the trivial template"],["both","both templates","either","vacuous and trivial","both work","both of them","both vacuous and trivial","both vacuous and trivial proofs"],["neither","none","no template","neither template","neither works","none of them"]]}
            solution_sketch: 'The hypothesis $x^2 + 1 = 0$ is never true for a real $x$, because $x^2 + 1 \ge 1$. So a vacuous proof works. The conclusion $x > 5$ is false for most $x$, so a trivial proof does not work.'
          - problem: 'To decide whether the hypothesis of "if $x^2 - 2x + 3 = 0$ then $x > 5$" can ever be true, we compute the discriminant $b^2 - 4ac$. What is its value?'
            answer: '-8'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Here $a = 1$, $b = -2$ and $c = 3$, so $b^2 - 4ac = 4 - 12 = -8$. The discriminant is negative, so no real $x$ satisfies the hypothesis.'
          - problem: 'In the statement "for every integer $n$, if $n$ is even then $n^2 + 1$ is odd", which integer $n$ from $2$ to $9$ makes the conclusion "$n^2 + 1$ is odd" false?'
            answer: '3'
            answer_contract: {"kind":"property","check":"integer_in_range","args":{"min":2,"max":9,"not_multiple_of":2}}
            solution_sketch: 'For $n = 3$ we get $n^2 + 1 = 10$, which is even. The conclusion is false for every odd $n$, so it is not true for every integer. The proof must use the hypothesis that $n$ is even.'
          - problem: 'An exam is marked out of $100$ points. The teacher announces: "If a student scores $120$ points, then the student gets an A." The class has $28$ students. How many students get an A because of this announcement?'
            answer: '0'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'No student can score $120$ points on an exam out of $100$, so the hypothesis is never true. The announcement is true vacuously, and it gives an A to $0$ students.'
          - problem: 'Raffle tickets are numbered $1$ to $500$. For the rule "if the number on a ticket is a multiple of $7$, then the number is at most $500$", the conclusion is true for every ticket, so a trivial proof works. For how many tickets is the hypothesis true?'
            answer: '71'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'We count the multiples of $7$ from $1$ to $500$. Since $7 \cdot 71 = 497$ and $7 \cdot 72 = 504 > 500$, there are $71$ of them. The rule is kept for all of them, and for the other tickets as well.'
          - problem: 'Which template proves "if $1 + 1 = 3$ then $7$ is prime": a vacuous proof, a trivial proof, both, or neither?'
            answer: 'both'
            answer_contract: {"kind":"label","options":[["vacuous","a vacuous proof","vacuous proof","vacuous only","only vacuous","the vacuous template"],["trivial","a trivial proof","trivial proof","trivial only","only trivial","the trivial template"],["both","both templates","either","vacuous and trivial","both work","both of them","both vacuous and trivial","both vacuous and trivial proofs"],["neither","none","no template","neither template","neither works","none of them"]]}
            solution_sketch: 'The hypothesis $1 + 1 = 3$ is false, so a vacuous proof works. The conclusion "$7$ is prime" is true, because $7$ has no divisor except $1$ and $7$, so a trivial proof works too. Either one alone proves the statement.'
          - problem: 'Write the full proof that for every real number $x$, if $x^2 + 1 = 0$ then $(x - 1)^2 \ge 0$. Give one vacuous proof and one trivial proof.'
            answer: 'vacuous and trivial proofs of it'
            answer_contract: {"kind":"none"}
            solution_sketch: 'Vacuous proof. Let $x$ be a real number. Since $x^2 \ge 0$, we have $x^2 + 1 \ge 1 > 0$, so $x^2 + 1 = 0$ is false for every real $x$. An implication with a false hypothesis is true, so the statement holds. Trivial proof. Let $x$ be a real number. The square of a real number is never negative, so $(x - 1)^2 \ge 0$ for every real $x$, whether or not $x^2 + 1 = 0$. An implication with a true conclusion is true, so the statement holds. Each argument alone proves the statement for every real $x$. The first one never uses the conclusion, and the second one never uses the hypothesis.'
        constraints: 'decide between a vacuous and a trivial proof by testing the hypothesis and the conclusion separately; classification items with natural words, counting contexts, error analysis, and a textbook claim that has both proofs'
    diagnostic_exemplar:
      problem: 'Prove each, naming the template used (vacuous or trivial): (a) for every real $x$, if $x^2 < 0$ then $x = 7$; (b) for every integer $n$, if $n$ is prime then $n^2 \ge 0$.'
      answer: '(a) Vacuous: no real $x$ satisfies $x^2 < 0$, since squares of reals are nonnegative; the antecedent is never true, so the conditional holds for every $x$ with nothing further to check. (b) Trivial: $n^2 \ge 0$ holds for every integer $n$, so the consequent is always true and the conditional holds whether or not $n$ is prime.'
      solution_sketch: 'Decide in each case whether the hypothesis is unsatisfiable (vacuous proof) or the conclusion is always true (trivial proof), and say which.'
    anki_seeds:
      - front: 'Vacuous proof of $P \to Q$?'
        back: 'Show $P$ is never true; a conditional with a false hypothesis is automatically true.'
        type: basic
      - front: 'Trivial proof of $P \to Q$?'
        back: 'Show $Q$ is true outright, without using $P$.'
        type: basic

  - id: rational-number-proofs
    name: "Proofs About Rational Numbers"
    core: true
    difficulty: 0.56
    drill: false
    answer_kind: proof
    expected_time_secs: 200
    prerequisites:
      - id: direct-proof
        weight: 0.6
        key: true
      - id: adding-subtracting-fractions
        weight: 0.0
    knowledge_points:
      - id: kp1
        name: "Sums and products of rationals"
        key_prerequisites: [direct-proof]
        exemplars:
          - problem: 'The proof that the sum of two rational numbers is rational writes $r = \frac{a}{b}$ and $s = \frac{c}{d}$ with $b, d \ne 0$, and then $r + s = \frac{ad + bc}{bd}$. Find the numerator $ad + bc$ for $r = \frac{3}{4}$ and $s = \frac{5}{6}$.'
            answer: '38'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Here $a = 3$, $b = 4$, $c = 5$ and $d = 6$, so $ad + bc = 3 \cdot 6 + 4 \cdot 5 = 18 + 20 = 38$. The sum is $\frac{38}{24} = \frac{19}{12}$, a quotient of integers with a nonzero denominator.'
          - problem: 'For $r = \frac{2}{9}$ and $s = \frac{3}{10}$, the proof that the product of two rational numbers is rational writes $rs = \frac{ac}{bd}$. Find $rs$.'
            answer: '1/15'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'We get $rs = \frac{2 \cdot 3}{9 \cdot 10} = \frac{6}{90}$. Dividing numerator and denominator by $6$ gives $rs = \frac{1}{15}$.'
          - problem: 'Is the product of two rational numbers always a rational number?'
            answer: 'yes'
            answer_contract: {"kind":"label","options":[["yes","always rational","it is always rational","true","it is true","correct","it is correct","yes it is"],["no","not always","sometimes not rational","false","it is false","not true","incorrect","it is not correct"]]}
            solution_sketch: 'The product of $\frac{a}{b}$ and $\frac{c}{d}$ is $\frac{ac}{bd}$. Here $ac$ and $bd$ are integers, and $bd \ne 0$ because $b \ne 0$ and $d \ne 0$. So the product is a quotient of integers with a nonzero denominator, and it is rational.'
          - problem: 'The formula $\frac{a}{b} + \frac{c}{d} = \frac{a + c}{b + d}$ is wrong. What value does its right side give for $\frac{1}{2} + \frac{1}{3}$?'
            answer: '2/5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The right side gives $\frac{1 + 1}{2 + 3} = \frac{2}{5}$. The true sum is $\frac{5}{6}$, and $\frac{2}{5} \ne \frac{5}{6}$, so the formula is wrong.'
          - problem: 'A recipe uses $\frac{2}{3}$ cup of flour for the dough and $\frac{3}{4}$ cup for the topping. How many cups of flour does it use in all?'
            answer: '17/12'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'We add over the common denominator $12$: $\frac{2}{3} + \frac{3}{4} = \frac{8}{12} + \frac{9}{12} = \frac{17}{12}$. So the recipe uses $\frac{17}{12}$ cups, which is $1\frac{5}{12}$ cups.'
          - problem: 'A garden bed is $\frac{3}{4}$ m wide and $\frac{5}{6}$ m long. What is its area?'
            answer: '5/8'
            answer_contract: {"kind":"unit","quantity":"area","unit":"m^2","allow_omitted":true}
            solution_sketch: 'The area is the product of the sides: $\frac{3}{4} \cdot \frac{5}{6} = \frac{15}{24} = \frac{5}{8}$. So the area is $\frac{5}{8}$ square metres.'
          - problem: 'Write the full proof that for all rational numbers $r$ and $s$, the sum $r + s$ is rational. Here a number is rational if it can be written as $\frac{p}{q}$ with $p$ and $q$ integers and $q \ne 0$.'
            answer: 'r, s rational => r + s rational'
            answer_contract: {"kind":"none"}
            solution_sketch: 'Let $r$ and $s$ be rational numbers. By the definition of a rational number, $r = \frac{a}{b}$ and $s = \frac{c}{d}$ for integers $a$, $b$, $c$, $d$ with $b \ne 0$ and $d \ne 0$. Adding fractions over the common denominator $bd$ gives $r + s = \frac{a}{b} + \frac{c}{d} = \frac{ad}{bd} + \frac{bc}{bd} = \frac{ad + bc}{bd}$. The integers are closed under multiplication and addition, so $ad + bc$ and $bd$ are integers. Since $b \ne 0$ and $d \ne 0$, the product $bd$ is not $0$. So $r + s$ is a quotient of two integers with a nonzero denominator, and by the definition, $r + s$ is rational. Since $r$ and $s$ were arbitrary rational numbers, the statement is proved.'
        constraints: 'write each rational as an integer over a nonzero integer, combine, and check the new denominator; error analysis on a wrong formula, recipe and area contexts, and a textbook closure proof'
      - id: kp2
        name: "Differences and quotients"
        key_prerequisites: [direct-proof]
        exemplars:
          - problem: 'The proof that the quotient of two rational numbers is rational uses $\frac{r}{s} = \frac{a}{b} \cdot \frac{d}{c}$ for $r = \frac{a}{b}$ and $s = \frac{c}{d}$ with $c \ne 0$. Find $\frac{r}{s}$ for $r = \frac{3}{4}$ and $s = \frac{5}{6}$.'
            answer: '9/10'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Here $\frac{r}{s} = \frac{3}{4} \cdot \frac{6}{5} = \frac{18}{20}$. Dividing numerator and denominator by $2$ gives $\frac{9}{10}$.'
          - problem: 'The proof that the difference of two rational numbers is rational uses $\frac{a}{b} - \frac{c}{d} = \frac{ad - bc}{bd}$. Find $r - s$ for $r = \frac{3}{4}$ and $s = \frac{5}{6}$.'
            answer: '-1/12'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'We have $r - s = \frac{3 \cdot 6 - 4 \cdot 5}{4 \cdot 6} = \frac{18 - 20}{24} = \frac{-2}{24} = -\frac{1}{12}$. The numerator $-2$ is an integer and the denominator $24$ is not $0$.'
          - problem: 'What denominator does the right side of $\frac{a}{b} - \frac{c}{d} = \frac{a - c}{b - d}$ have for $\frac{3}{5} - \frac{1}{5}$?'
            answer: '0'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The right side gives the denominator $b - d = 5 - 5 = 0$, so the formula breaks down for these fractions. The true difference is $\frac{2}{5}$. The correct formula has the denominator $bd$, which is never $0$.'
          - problem: 'Is the quotient $\frac{r}{s}$ of two rational numbers $r$ and $s$ always a rational number?'
            answer: 'no'
            answer_contract: {"kind":"label","options":[["yes","always rational","true","it is true","correct","it is correct","yes it is"],["no","not always","only if s is not zero","only when s is nonzero","false","it is false","not true","incorrect"]]}
            solution_sketch: 'If $s = 0$, the quotient $\frac{r}{s}$ is not defined, so it is not a number at all. The quotient is rational whenever $s \ne 0$.'
          - problem: 'A ribbon $\frac{9}{2}$ m long is cut into pieces that are each $\frac{3}{4}$ m long. How many pieces are there?'
            answer: '6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The number of pieces is the quotient $\frac{9}{2} \div \frac{3}{4} = \frac{9}{2} \cdot \frac{4}{3} = \frac{36}{6} = 6$. So there are $6$ pieces, and the quotient is a rational number.'
          - problem: 'A car travels $\frac{5}{2}$ km in $\frac{1}{4}$ hour. What is its average speed?'
            answer: '10'
            answer_contract: {"kind":"unit","quantity":"speed","unit":"km/h","allow_omitted":true}
            solution_sketch: 'The speed is distance divided by time: $\frac{5}{2} \div \frac{1}{4} = \frac{5}{2} \cdot 4 = 10$. So the average speed is $10$ kilometres per hour.'
          - problem: 'Write the full proof that for all rational numbers $r$ and $s$ with $r \ne s$, the number $\frac{r + s}{r - s}$ is rational. Here a number is rational if it can be written as $\frac{p}{q}$ with $p$ and $q$ integers and $q \ne 0$.'
            answer: 'r != s => (r+s)/(r-s) rational'
            answer_contract: {"kind":"none"}
            solution_sketch: 'Let $r$ and $s$ be rational numbers with $r \ne s$. Write $r = \frac{a}{b}$ and $s = \frac{c}{d}$ with integers $a$, $b$, $c$, $d$ and $b \ne 0$, $d \ne 0$. Then $r + s = \frac{ad + bc}{bd}$ and $r - s = \frac{ad - bc}{bd}$. Since $r \ne s$, we have $r - s \ne 0$. If $ad - bc$ were $0$, then $r - s = \frac{0}{bd} = 0$, which is false. So the numerator $ad - bc$ is not $0$. Dividing, and cancelling the nonzero factor $\frac{1}{bd}$, gives $\frac{r + s}{r - s} = \frac{(ad + bc)/(bd)}{(ad - bc)/(bd)} = \frac{ad + bc}{ad - bc}$. The integers are closed under multiplication, addition and subtraction, so $ad + bc$ and $ad - bc$ are integers. The denominator $ad - bc$ is not $0$. So $\frac{r + s}{r - s}$ is a quotient of integers with a nonzero denominator, and it is rational. Since $r$ and $s$ were arbitrary, the statement is proved.'
        constraints: 'difference and quotient formulas with a nonzero denominator check; quotient of rationals needs a nonzero divisor; error analysis on a wrong formula; ribbon and speed contexts that need division; a textbook closure proof'
      - id: kp3
        name: "Averages and density"
        key_prerequisites: [direct-proof]
        exemplars:
          - problem: 'Find the average of $\frac{1}{3}$ and $\frac{1}{2}$.'
            answer: '5/12'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The average is $\frac{1}{2}\left(\frac{1}{3} + \frac{1}{2}\right) = \frac{1}{2} \cdot \frac{5}{6} = \frac{5}{12}$. It lies between $\frac{1}{3} = \frac{4}{12}$ and $\frac{1}{2} = \frac{6}{12}$.'
          - problem: 'Give a rational number strictly between $\frac{2}{5}$ and $\frac{3}{7}$.'
            answer: '29/70'
            answer_contract: {"kind":"property","check":"between","args":{"low":"2/5","high":"3/7"}}
            solution_sketch: 'The average of the two numbers works: $\frac{1}{2}\left(\frac{2}{5} + \frac{3}{7}\right) = \frac{1}{2} \cdot \frac{29}{35} = \frac{29}{70}$. Over the denominator $70$ we have $\frac{2}{5} = \frac{28}{70}$ and $\frac{3}{7} = \frac{30}{70}$, so $\frac{28}{70} < \frac{29}{70} < \frac{30}{70}$.'
          - problem: 'Let $r < s$ be rational numbers and $t = \frac{2r + s}{3}$. To show that $r < t$, the proof simplifies $t - r$. Write $t - r$ in terms of $r$ and $s$.'
            answer: '(s-r)/3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'We compute $t - r = \frac{2r + s}{3} - r = \frac{2r + s - 3r}{3} = \frac{s - r}{3}$. Since $s - r > 0$, this is positive, so $r < t$.'
          - problem: 'Give a rational number that lies strictly between $\frac{1}{1000}$ and $\frac{1}{1001}$.'
            answer: '2001/2002000'
            answer_contract: {"kind": "property", "check": "between", "args": {"low": "1/1001", "high": "1/1000"}}
            solution_sketch: 'The average $\frac{1}{2}\left(\frac{1}{1000} + \frac{1}{1001}\right) = \frac{2001}{2002000}$ is rational, and it lies strictly between the two numbers. Between any two distinct rationals there is another rational.'
          - problem: 'Two runners finish a race in $12.4$ seconds and $12.5$ seconds. A judge records a time exactly halfway between the two times. What time does the judge record?'
            answer: '12.45'
            answer_contract: {"kind":"unit","quantity":"time","unit":"s","allow_omitted":true}
            solution_sketch: 'The halfway time is the average $\frac{12.4 + 12.5}{2} = \frac{24.9}{2} = 12.45$ seconds. It is rational and lies strictly between $12.4$ and $12.5$.'
          - problem: 'A dough needs between $\frac{2}{3}$ litre and $\frac{3}{4}$ litre of water. How many litres is the middle of this range?'
            answer: '17/24'
            answer_contract: {"kind":"unit","quantity":"volume","unit":"L","allow_omitted":true}
            solution_sketch: 'The middle is the average $\frac{1}{2}\left(\frac{2}{3} + \frac{3}{4}\right) = \frac{1}{2} \cdot \frac{17}{12} = \frac{17}{24}$ litre. Over the denominator $24$ we have $\frac{16}{24} < \frac{17}{24} < \frac{18}{24}$.'
          - problem: 'Write the full proof that for all rational numbers $r$ and $s$ with $r < s$, the number $t = \frac{r + s}{2}$ is rational and $r < t < s$.'
            answer: 'r<s => (r+s)/2 rational, between'
            answer_contract: {"kind":"none"}
            solution_sketch: 'Let $r$ and $s$ be rational numbers with $r < s$, and let $t = \frac{r + s}{2}$. Write $r = \frac{a}{b}$ and $s = \frac{c}{d}$ with integers $a$, $b$, $c$, $d$ and $b \ne 0$, $d \ne 0$. Then $t = \frac{1}{2}\left(\frac{ad + bc}{bd}\right) = \frac{ad + bc}{2bd}$. The numerator $ad + bc$ and the denominator $2bd$ are integers, and $2bd \ne 0$ because $2$, $b$ and $d$ are nonzero. So $t$ is rational. Next, $t - r = \frac{r + s}{2} - r = \frac{s - r}{2}$. Since $r < s$, we have $s - r > 0$, so $t - r > 0$ and $r < t$. Also $s - t = s - \frac{r + s}{2} = \frac{s - r}{2} > 0$, so $t < s$. Hence $r < t < s$, and $t$ is a rational number strictly between $r$ and $s$.'
        constraints: 'the average of two rationals is rational and lies strictly between them; justify both strict inequalities; error analysis on very close rationals; measurement contexts with a midpoint; a textbook density proof'
    diagnostic_exemplar:
      problem: 'Prove: if $r$ is rational and $r < 5$, then there is a rational number $t$ with $r < t < 5$.'
      answer: 'Take $t = \frac{r+5}{2}$. Writing $r = p/q$ with $p, q$ integers and $q \ne 0$ gives $t = \frac{p + 5q}{2q}$, a ratio of integers with nonzero denominator, so $t$ is rational. From $r < 5$: adding $r$ to both sides gives $2r < r + 5$, hence $r < t$; adding $5$ to both sides gives $r + 5 < 10$, hence $t < 5$. So $r < t < 5$.'
      solution_sketch: 'Use the midpoint: show it is rational by writing it as a single fraction, then obtain both inequalities from $r < 5$.'
    anki_seeds:
      - front: 'Definition of a rational number?'
        back: 'A real number expressible as $p/q$ with $p, q$ integers and $q \ne 0$.'
        type: basic
      - front: 'Which operations is $\mathbb{Q}$ closed under?'
        back: 'Addition, subtraction, multiplication, and division by a nonzero rational.'
        type: basic

  - id: divisibility-parity-proofs
    name: "Divisibility and Parity Proofs"
    core: true
    difficulty: 0.55
    drill: false
    answer_kind: proof
    expected_time_secs: 210
    prerequisites:
      - id: direct-proof
        weight: 0.5
        key: true
      - id: quantifiers
        weight: 0.2
      - id: divisibility-rules
        weight: 0.0
    knowledge_points:
      - id: kp1
        name: "Divisibility and linear combinations"
        key_prerequisites: [direct-proof]
        exemplars:
          - problem: 'Suppose $a \mid b$ and $a \mid c$, so $b = ak$ and $c = al$ for integers $k$ and $l$. In a direct proof that $a \mid (5b + 3c)$, we write $5b + 3c = am$. Write $m$ in terms of $k$ and $l$.'
            answer: '5k+3l'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Substituting gives $5b + 3c = 5(ak) + 3(al) = a(5k + 3l)$. So $m = 5k + 3l$, which is an integer because $k$ and $l$ are integers.'
          - problem: 'Suppose $a \mid b$ and $a \mid (b + c)$, so $b = ak$ and $b + c = al$ for integers $k$ and $l$. In a direct proof that $a \mid c$, we write $c = am$. Write $m$ in terms of $k$ and $l$.'
            answer: 'l-k'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'We have $c = (b + c) - b = al - ak = a(l - k)$. So $m = l - k$, which is an integer because $k$ and $l$ are integers.'
          - problem: 'Is it true that if $a \mid (b + c)$ then $a \mid b$ and $a \mid c$, for all integers $a$, $b$ and $c$?'
            answer: 'no'
            answer_contract: {"kind":"label","options":[["yes","the claim is true","true","it is true","correct","it is correct","yes it is"],["no","the claim is false","not true for all","false","it is false","not true","incorrect","it is not correct"]]}
            solution_sketch: 'The claim fails for $a = 5$, $b = 1$ and $c = 4$. Here $5 \mid (1 + 4) = 5$, but $5 \nmid 1$ and $5 \nmid 4$. The true statement runs the other way: if $a$ divides $b$ and $c$, then $a$ divides $b + c$.'
          - problem: 'Consider the statement "if $a \mid (b + c)$ then $a \mid b$ and $a \mid c$". Take $a = 5$ and $b = 1$. What is the least positive integer $c$ for which the hypothesis is true and the conclusion is false?'
            answer: '4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The hypothesis $5 \mid (1 + c)$ holds for $c = 4, 9, 14, \dots$. For $c = 4$ we have $5 \mid 5$, but $5 \nmid 1$, so the conclusion is false. So the least value is $c = 4$.'
          - problem: 'A baker packs $12$ rolls to a bag. The morning batch has $b = 48$ rolls and the afternoon batch has $c = 84$ rolls, and both numbers are multiples of $12$. A direct proof shows that $12 \mid (b + c)$. How many full bags do the two batches give?'
            answer: '11'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Write $48 = 12 \cdot 4$ and $84 = 12 \cdot 7$. Then $b + c = 12(4 + 7) = 132$, so the two batches fill $11$ bags.'
          - problem: 'A tailor cuts ribbons into pieces of $7$ cm with nothing left over. One ribbon is $b = 56$ cm long and another is $c = 35$ cm long. A third ribbon is made by joining $2$ copies of the first and $3$ copies of the second. A direct proof shows that $7 \mid (2b + 3c)$. How many pieces of $7$ cm does the third ribbon give?'
            answer: '31'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'We have $56 = 7 \cdot 8$ and $35 = 7 \cdot 5$, so $2b + 3c = 7(2 \cdot 8 + 3 \cdot 5) = 7 \cdot 31$. The third ribbon is $217$ cm long and gives $31$ pieces.'
          - problem: 'Write the full proof that for all integers $a$, $b$ and $c$, if $a \mid b$ and $a \mid (b + c)$ then $a \mid c$. Here $x \mid y$ means that $y = xt$ for some integer $t$.'
            answer: 'a|b, a|(b+c) => a|c'
            answer_contract: {"kind":"none"}
            solution_sketch: 'Let $a$, $b$ and $c$ be integers with $a \mid b$ and $a \mid (b + c)$. By the definition of divisibility, there is an integer $k$ with $b = ak$, and there is an integer $l$ with $b + c = al$. Then $c = (b + c) - b = al - ak = a(l - k)$. Since $k$ and $l$ are integers and the integers are closed under subtraction, $l - k$ is an integer. So $c = a(l - k)$ with $l - k$ an integer, and by the definition of divisibility, $a \mid c$. Since $a$, $b$ and $c$ were arbitrary, the statement is proved.'
        constraints: 'unpack each hypothesis $a \mid b$ as $b = ak$ and factor $a$ out of a linear combination; read off the integer multiplier; error analysis on a false converse; packing contexts; a textbook divisibility proof'
      - id: kp2
        name: "Parity arguments"
        key_prerequisites: [direct-proof]
        exemplars:
          - problem: 'To prove that $n^2 + 3n + 4$ is even for every integer $n$, we split into cases by the parity of $n$. How many cases do we need?'
            answer: '2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Every integer is either even or odd, so two cases cover all integers: $n = 2k$ and $n = 2k + 1$. In each case we show that $n^2 + 3n + 4$ is $2$ times an integer.'
          - problem: 'In a proof that $n^2 + 3n + 4$ is even for every integer $n$, the case of an odd $n = 2k + 1$ gives $n^2 + 3n + 4 = 2m$. Write $m$ in terms of $k$.'
            answer: '2k^2+5k+4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Substituting $n = 2k + 1$ gives $n^2 + 3n + 4 = 4k^2 + 4k + 1 + 6k + 3 + 4 = 4k^2 + 10k + 8 = 2(2k^2 + 5k + 4)$. So $m = 2k^2 + 5k + 4$.'
          - problem: 'Is $n^2 + n + 1$ odd for every integer $n$?'
            answer: 'yes'
            answer_contract: {"kind":"label","options":[["yes","it is odd for every integer","true","it is true","correct","it is correct","yes it is"],["no","not always odd","it is even for some integers","false","it is false","not true","incorrect","it is not correct"]]}
            solution_sketch: 'We have $n^2 + n + 1 = n(n + 1) + 1$. The product $n(n + 1)$ of two consecutive integers is even, because one of them is even. So $n(n + 1) + 1$ is odd for every integer $n$.'
          - problem: 'What is the least integer $n$ greater than $1$ for which $n^2 + 3$ is not odd?'
            answer: '3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'For $n = 2$ we get $n^2 + 3 = 7$, which is odd. For $n = 3$ we get $n^2 + 3 = 12$, which is even. So the least such value is $n = 3$.'
          - problem: 'At a party, each of $15$ guests shakes hands once with each of the other guests. A direct proof shows that $n(n - 1)$ is even for every integer $n$. How many handshakes take place?'
            answer: '105'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Each of the $15$ guests shakes hands with $14$ others, which counts every handshake twice. So the number of handshakes is $\frac{15 \cdot 14}{2} = 105$, and the product $15 \cdot 14 = 210$ is even, as the proof says.'
          - problem: 'The sum of the page numbers on two facing pages of a book is $157$. Facing pages have numbers $k$ and $k + 1$, so the sum is $2k + 1$, which is odd for every integer $k$. What is the number of the left-hand page?'
            answer: '78'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'We solve $2k + 1 = 157$ and get $2k = 156$, so $k = 78$. The left-hand page is page $78$, and the right-hand page is page $79$.'
          - problem: 'Write the full proof that for every integer $n$, the number $n^2 + 3n + 4$ is even.'
            answer: 'n^2 + 3n + 4 is even'
            answer_contract: {"kind":"none"}
            solution_sketch: 'Let $n$ be an integer. Every integer is either even or odd, so we consider two cases. Case 1: $n$ is even. Then $n = 2k$ for some integer $k$, and $n^2 + 3n + 4 = 4k^2 + 6k + 4 = 2(2k^2 + 3k + 2)$. Since $2k^2 + 3k + 2$ is an integer, $n^2 + 3n + 4$ is even. Case 2: $n$ is odd. Then $n = 2k + 1$ for some integer $k$, and $n^2 + 3n + 4 = (4k^2 + 4k + 1) + (6k + 3) + 4 = 4k^2 + 10k + 8 = 2(2k^2 + 5k + 4)$. Since $2k^2 + 5k + 4$ is an integer, $n^2 + 3n + 4$ is even. In both cases $n^2 + 3n + 4$ is even. Since $n$ was an arbitrary integer, the statement is proved.'
        constraints: 'split into the cases $n = 2k$ and $n = 2k + 1$ and substitute; the witness of the odd case; error analysis with a counterexample; handshake and page-number contexts; a textbook case-split proof'
      - id: kp3
        name: "Parity of squares and products"
        key_prerequisites: [direct-proof]
        exemplars:
          - problem: 'Let $a = 2k + 1$ and $b = 2l + 1$ be odd integers. For $k = 2$ and $l = 5$, the product $ab$ equals $2m + 1$. Find $m$.'
            answer: '27'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Here $a = 5$ and $b = 11$, so $ab = 55 = 2 \cdot 27 + 1$ and $m = 27$. In general $ab = 4kl + 2k + 2l + 1 = 2(2kl + k + l) + 1$, and $2 \cdot 2 \cdot 5 + 2 + 5 = 27$.'
          - problem: 'Which statement is the contrapositive of "if $ab$ is odd, then $a$ and $b$ are both odd"?'
            answer: 'if a or b is even then ab is even'
            answer_contract: {"kind":"label","options":[["if a or b is even then ab is even","a or b even implies ab even","if a or b is even, then ab is even","if one of a and b is even then ab is even","if either a or b is even then ab is even","if a is even or b is even then ab is even","if either a or b is even, then ab is even","if at least one of a and b is even then ab is even"],["if a and b are both odd then ab is odd","a and b both odd implies ab odd","if a and b are odd then ab is odd"],["if ab is even then a and b are both even","ab even implies a and b both even","if ab is even, then a and b are even"],["if ab is odd then a or b is even","ab odd implies a or b even","if ab is odd, then a or b is even"]]}
            solution_sketch: 'The contrapositive of "if $P$ then $Q$" is "if not $Q$ then not $P$". Here $P$ is "$ab$ is odd" and $Q$ is "$a$ and $b$ are both odd". Not $Q$ is "$a$ or $b$ is even", and not $P$ is "$ab$ is even". So the contrapositive is "if $a$ or $b$ is even, then $ab$ is even".'
          - problem: 'A proof that $n^2$ is even if and only if $n$ is even shows, for an odd $n = 2k + 1$, that $n^2 = 2m + 1$ with $m = 2k^2 + 2k$. Find $m$ for $n = 9$.'
            answer: '40'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'For $n = 9$ we have $k = 4$, so $m = 2 \cdot 16 + 2 \cdot 4 = 40$. Indeed $n^2 = 81 = 2 \cdot 40 + 1$, which is odd.'
          - problem: 'A proof that $n$ is even if and only if $n^2$ is even shows that if $n$ is even then $n^2$ is even. Which statement must still be proved?'
            answer: 'if n^2 is even then n is even'
            answer_contract: {"kind":"label","options":[["if n^2 is even then n is even","n^2 even implies n even","if the square is even then n is even","if n squared is even then n is even","if n squared is even, then n is even","if n^2 is even, then n is even","if n² is even then n is even"],["if n is even then n^2 is odd","n even implies n^2 odd","if n is even then the square is odd"],["if n is odd then n^2 is even","n odd implies n^2 even","if n is odd then the square is even"],["if n^2 is odd then n is even","n^2 odd implies n even","if the square is odd then n is even"]]}
            solution_sketch: 'An "if and only if" statement needs both directions. The proof so far covers "if $n$ is even then $n^2$ is even". The other direction is "if $n^2$ is even then $n$ is even". The other three statements are false: $n = 2$ is even and $n^2 = 4$ is even, not odd, and $n = 1$ is odd and $n^2 = 1$ is odd, which breaks both of the other two statements.'
          - problem: 'Consider the statement "$ab$ is even if and only if $a$ and $b$ are both even". Take $a = 4$. What is the least integer $b$ greater than $2$ that shows the statement is false?'
            answer: '3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'For $a = 4$ and $b = 3$ the product $ab = 12$ is even, but $b = 3$ is not even. So the direction "if $ab$ is even then both are even" fails. The least integer $b > 2$ is $3$.'
          - problem: 'Two fair dice are rolled. A proof shows that the product of the two numbers shown is odd if and only if both numbers are odd. In how many of the $36$ equally likely outcomes is the product odd?'
            answer: '9'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Each die shows an odd number in $3$ of its $6$ faces, namely $1$, $3$ and $5$. By the proof, the product is odd exactly when both dice are odd, which gives $3 \cdot 3 = 9$ outcomes.'
          - problem: 'A rectangular hall is covered by $105$ square tiles laid in $7$ equal rows. The product of the number of rows and the number of tiles in each row is odd, so both numbers are odd. How many tiles are in each row?'
            answer: '15'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Each row has $105 \div 7 = 15$ tiles. Both $7$ and $15$ are odd, as the proof says.'
          - problem: 'Write the full proof that for all integers $a$ and $b$, the product $ab$ is odd if and only if $a$ and $b$ are both odd.'
            answer: 'ab odd <=> a, b both odd'
            answer_contract: {"kind":"none"}
            solution_sketch: 'Let $a$ and $b$ be integers. We prove both directions. ($\Leftarrow$) Suppose $a$ and $b$ are both odd. Then $a = 2k + 1$ and $b = 2l + 1$ for some integers $k$ and $l$. So $ab = (2k + 1)(2l + 1) = 4kl + 2k + 2l + 1 = 2(2kl + k + l) + 1$. Since $2kl + k + l$ is an integer, $ab$ is odd. ($\Rightarrow$) We prove the contrapositive: if $a$ and $b$ are not both odd, then $ab$ is not odd. Suppose $a$ and $b$ are not both odd. Every integer is even or odd, so one of them is even. Say $a$ is even, so $a = 2k$ for some integer $k$; the case that $b$ is even is the same with $a$ and $b$ exchanged. Then $ab = 2(kb)$, and $kb$ is an integer, so $ab$ is even. An integer is not both even and odd, so $ab$ is not odd. This proves the contrapositive, so if $ab$ is odd then $a$ and $b$ are both odd. Both directions hold, so $ab$ is odd if and only if $a$ and $b$ are both odd.'
        constraints: 'prove both directions of an if and only if statement; name the contrapositive and the converse correctly; witnesses for odd products; error analysis; dice and tiling contexts; a textbook biconditional proof'
    diagnostic_exemplar:
      problem: 'Prove: for all integers $m, n$, if $m$ and $n$ are both odd then $4 \mid (m^2 + n^2 - 2)$.'
      answer: 'Write $m = 2a + 1$ and $n = 2b + 1$ with $a, b$ integers. Then $m^2 + n^2 - 2 = (4a^2 + 4a + 1) + (4b^2 + 4b + 1) - 2 = 4(a^2 + a + b^2 + b)$. Since $a^2 + a + b^2 + b$ is an integer, $4 \mid (m^2 + n^2 - 2)$.'
      solution_sketch: 'Substitute the odd forms, expand both squares, and factor $4$ out of what remains.'
    anki_seeds:
