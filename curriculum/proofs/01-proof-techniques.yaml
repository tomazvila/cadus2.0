        weight: 0.0
    knowledge_points:
      - id: kp1
        name: "Exhaustive cases on parity"
        key_prerequisites: [direct-proof]
        exemplars:
          - problem: 'To prove that $n^2 + n$ is even for every integer $n$, split into the cases $n = 2k$ and $n = 2k + 1$. In the second case, write $n^2 + n$ in the form $2m$. Find $m$ in terms of $k$.'
            answer: '2k^2+3k+1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'For $n = 2k + 1$ we have $n^2 + n = n(n + 1) = (2k + 1)(2k + 2)$. Taking the factor $2$ out of the second factor gives $2(2k + 1)(k + 1) = 2(2k^2 + 3k + 1)$, so $m = 2k^2 + 3k + 1$.'
          - problem: 'A board has $7$ rows and $8$ columns of squares, and each domino covers exactly two squares. How many dominoes are needed to cover the whole board with no gaps and no overlaps?'
            answer: '28'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The board has $7 \cdot 8 = 56$ squares, and each domino covers $2$ of them, so $56 / 2 = 28$ dominoes are needed. The number of squares $n(n + 1)$ of an $n$ by $n + 1$ board is always even, so the squares can always be paired.'
          - problem: 'Ana has $n$ bags with $n + 5$ marbles in each bag, where $n$ is a positive integer. She wants to share all the marbles equally between two friends. For $n = 9$, how many marbles does each friend get?'
            answer: '63'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The total is $9 \cdot 14 = 126$ marbles. Sharing between two friends means dividing by $2$, so each friend gets $126 / 2 = 63$ marbles. The share is always a whole number, because $n$ and $n + 5$ have different parity, so $n(n + 5)$ is even.'
          - problem: 'Is $n^2 + n + 1$ odd for every integer $n$?'
            answer: 'yes'
            answer_contract: {"kind": "label", "options": [["yes", "it is odd", "always odd", "true"], ["no", "it is not always odd", "not always", "false"]]}
            solution_sketch: 'If $n = 2k$, then $n^2 + n + 1 = 4k^2 + 2k + 1 = 2(2k^2 + k) + 1$, which is odd. If $n = 2k + 1$, then $n^2 + n + 1 = 4k^2 + 6k + 3 = 2(2k^2 + 3k + 1) + 1$, which is odd. The two cases cover every integer, so the answer is yes.'
          - problem: 'The claim "$n^2 + 2n$ is even for every integer $n$" is proved only for the case $n = 2k$. Find an integer $n$ for which the claim is false.'
            answer: '1'
            answer_contract: {"kind": "property", "check": "integer_in_range", "args": {"min": -1000, "max": 1000, "not_multiple_of": 2}}
            solution_sketch: 'For $n = 2k$ we get $n^2 + 2n = 4k^2 + 4k = 2(2k^2 + 2k)$, which is even, but this is only one of the two cases. For an odd $n$ such as $1$ we get $1 + 2 = 3$, which is odd, so every odd integer is a counterexample.'
          - problem: 'Whatever integer $n$ is chosen, the number $n^2 + n + 3$ leaves the same remainder when it is divided by $2$. What is that remainder?'
            answer: '1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The number $n^2 + n = n(n + 1)$ is even, as the cases $n = 2k$ and $n = 2k + 1$ show, so $n^2 + n = 2m$ for some integer $m$. Then $n^2 + n + 3 = 2m + 3 = 2(m + 1) + 1$, which leaves remainder $1$ for every $n$.'
          - problem: 'Write the full proof that $n^2 + 3n + 4$ is even for every integer $n$.'
            answer: 'n^2+3n+4 is even for every integer n'
            answer_contract: {"kind": "none"}
            solution_sketch: 'Let $n$ be an arbitrary integer. Every integer is even or odd, so we consider these two cases. Case 1: $n$ is even. Then $n = 2k$ for some integer $k$, and $n^2 + 3n + 4 = 4k^2 + 6k + 4 = 2(2k^2 + 3k + 2)$. Since $2k^2 + 3k + 2$ is an integer, $n^2 + 3n + 4$ is even. Case 2: $n$ is odd. Then $n = 2k + 1$ for some integer $k$, and $n^2 + 3n + 4 = (4k^2 + 4k + 1) + (6k + 3) + 4 = 4k^2 + 10k + 8 = 2(2k^2 + 5k + 4)$. Since $2k^2 + 5k + 4$ is an integer, $n^2 + 3n + 4$ is even. The two cases cover every integer $n$, and the number $n^2 + 3n + 4$ is even in each of them. Therefore $n^2 + 3n + 4$ is even for every integer $n$. $\square$'
        constraints: 'Cases on the parity of an integer: the witness of the odd case, counts and contexts that need a division by 2, a verdict, a counterexample for a missing case. The last item is a full textbook proof.'
      - id: kp2
        name: "Cases from sign or absolute value"
        key_prerequisites: [direct-proof]
        try_first:
          problem: 'Solve $|x| = 2x - 3$.'
          answer_contract: {"kind": "exact"}
          answer: '3'
          reveal: 'For $x \ge 0$ the equation is $x = 2x - 3$, so $x = 3$. For $x < 0$ it is $-x = 2x - 3$, so $x = 1$, which is not negative and is rejected. The absolute value has a different formula on each side of $0$, so each side needs its own case.'
        exemplars:
          - problem: 'A proof by cases on the sign of $x - 2$ treats $x \ge 2$ and $x < 2$ separately. Simplify $|x - 2| + 2x$ in the case $x < 2$.'
            answer: 'x+2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'If $x < 2$, then $x - 2$ is negative, so $|x - 2| = -(x - 2) = 2 - x$. Therefore $|x - 2| + 2x = 2 - x + 2x = x + 2$.'
          - problem: 'Solve $|x - 3| = 2x$.'
            answer: '1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'If $x \ge 3$, the equation reads $x - 3 = 2x$, which gives $x = -3$; this contradicts $x \ge 3$, so there is no solution in this case. If $x < 3$, the equation reads $3 - x = 2x$, so $x = 1$, and $1 < 3$ is consistent. The only solution is $x = 1$; check: $|1 - 3| = 2 = 2 \cdot 1$.'
          - problem: 'A straight road has two villages, at the $3$ km mark and at the $11$ km mark. A shop is built at the $x$ km mark. The total distance from the shop to the two villages is $|x - 3| + |x - 11|$ kilometres. What is the least possible total distance?'
            answer: '8'
            answer_contract: {"kind": "unit", "quantity": "length", "unit": "km", "allow_omitted": true}
            solution_sketch: 'Split into three cases by the signs of $x - 3$ and $x - 11$. For $x < 3$ the total is $(3 - x) + (11 - x) = 14 - 2x > 8$. For $3 \le x \le 11$ it is $(x - 3) + (11 - x) = 8$, and for $x > 11$ it is $2x - 14 > 8$. So the least total distance is $8$ km, reached anywhere between the two villages.'
          - problem: 'Is $|x| > x$ true for every real number $x$?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "it is true", "always", "true"], ["no", "it is not true", "not always", "false"]]}
            solution_sketch: 'If $x < 0$, then $|x| = -x > 0 > x$, so the inequality holds. If $x \ge 0$, then $|x| = x$, so $|x| > x$ is false; for example $x = 0$ gives $0 > 0$. So the statement is not true for every real number.'
          - problem: 'Find an integer $x$ for which $|x| + |x - 2| > 2$ is false.'
            answer: '1'
            answer_contract: {"kind": "property", "check": "integer_in_range", "args": {"min": 0, "max": 2}}
            solution_sketch: 'For $0 \le x \le 2$ we have $|x| = x$ and $|x - 2| = 2 - x$, so $|x| + |x - 2| = 2$, which is not greater than $2$. The integers $0$, $1$ and $2$ all lie in this range, so $x = 1$ is a counterexample.'
          - problem: 'Solve $|2x + 1| = x + 4$.'
            answer: '-5/3, 3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'If $2x + 1 \ge 0$, the equation is $2x + 1 = x + 4$, so $x = 3$, and $3 \ge -1/2$ holds. If $2x + 1 < 0$, the equation is $-(2x + 1) = x + 4$, so $-2x - 1 = x + 4$ and $x = -5/3$, which satisfies $2x + 1 = -7/3 < 0$. Check: $|-7/3| = 7/3 = -5/3 + 4$ and $|7| = 7 = 3 + 4$.'
          - problem: 'A machine cuts rods whose length $L$ in centimetres must satisfy $|L - 50| = 0.4$ at the two rejection limits. Find both values of $L$.'
            answer: '49.6, 50.4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'If $L \ge 50$, then $L - 50 = 0.4$ and $L = 50.4$. If $L < 50$, then $50 - L = 0.4$ and $L = 49.6$. Both values lie in the case that produced them, so the rejection limits are $49.6$ cm and $50.4$ cm.'
          - problem: 'Write the full proof that $|x + y| \le |x| + |y|$ for all real numbers $x$ and $y$.'
            answer: '|x+y| <= |x|+|y| for all real x, y'
            answer_contract: {"kind": "none"}
            solution_sketch: 'Let $x$ and $y$ be real numbers. Recall that $|t| = t$ if $t \ge 0$ and $|t| = -t$ if $t < 0$. We consider four cases according to the signs of $x$ and $y$. Case 1: $x \ge 0$ and $y \ge 0$. Then $x + y \ge 0$, so $|x + y| = x + y = |x| + |y|$. Case 2: $x < 0$ and $y < 0$. Then $x + y < 0$, so $|x + y| = -(x + y) = (-x) + (-y) = |x| + |y|$. Case 3: $x \ge 0$ and $y < 0$. Then $|x| + |y| = x - y$. Because $y < 0$ we have $x + y \le x - y$, and because $x \ge 0$ we have $-(x + y) = -x - y \le x - y$. The number $|x + y|$ equals $x + y$ or $-(x + y)$, so in either event $|x + y| \le x - y = |x| + |y|$. Case 4: $x < 0$ and $y \ge 0$. Then $|x| + |y| = -x + y$. Because $x < 0$ we have $x + y \le -x + y$, and because $y \ge 0$ we have $-(x + y) = -x - y \le -x + y$. Hence $|x + y| \le -x + y = |x| + |y|$. The four cases cover every pair of real numbers, and the inequality holds in each of them. Therefore $|x + y| \le |x| + |y|$ for all real numbers $x$ and $y$. $\square$'
        constraints: 'Cases on the sign of an expression inside an absolute value: simplification in one case, equations, a context with two kinds of distance, a verdict and a counterexample. The last item is a full textbook proof.'
      - id: kp3
        name: "Cases modulo n"
        key_prerequisites: [divisibility-parity-proofs]
        exemplars:
          - problem: 'A proof that $n^3 + 2n$ is divisible by $3$ for every integer $n$ splits into the cases $n = 3k$, $n = 3k + 1$ and $n = 3k + 2$. In the case $n = 3k + 1$, write $n^3 + 2n$ as $3m$. Find $m$ in terms of $k$.'
            answer: '9k^3+9k^2+5k+1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'For $n = 3k + 1$ we expand $(3k + 1)^3 = 27k^3 + 27k^2 + 9k + 1$ and $2n = 6k + 2$. The sum is $27k^3 + 27k^2 + 15k + 3 = 3(9k^3 + 9k^2 + 5k + 1)$, so $m = 9k^3 + 9k^2 + 5k + 1$.'
          - problem: 'A square tray holds $n$ rows of $n$ chocolates, where $n$ is not a multiple of $3$. The chocolates are shared equally among $3$ children, and the chocolates that cannot be shared evenly are put aside. How many chocolates are put aside?'
            answer: '1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'If $n = 3k + 1$, then $n^2 = 9k^2 + 6k + 1 = 3(3k^2 + 2k) + 1$. If $n = 3k + 2$, then $n^2 = 9k^2 + 12k + 4 = 3(3k^2 + 4k + 1) + 1$. In both cases $n^2$ leaves remainder $1$ on division by $3$, so exactly $1$ chocolate is put aside.'
          - problem: 'A square patio is tiled with $n \times n$ square slabs, where $n$ leaves remainder $3$ when it is divided by $5$. The slabs are loaded onto pallets that hold $5$ slabs each. How many slabs are on the last pallet, which is not full?'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Write $n = 5k + 3$. Then $n^2 = 25k^2 + 30k + 9 = 5(5k^2 + 6k + 1) + 4$, so $n^2$ leaves remainder $4$ on division by $5$. Loading the slabs onto pallets of $5$ therefore leaves $4$ slabs on the last pallet.'
          - problem: 'Can $n^2 + 1$ be divisible by $3$ for an integer $n$?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "it can", "it can be divisible", "possible"], ["no", "it cannot", "cannot", "not possible", "impossible", "never", "it is never divisible"]]}
            solution_sketch: 'By cases, $n^2$ leaves remainder $0$ if $3$ divides $n$ and remainder $1$ otherwise. Then $n^2 + 1$ leaves remainder $1$ or $2$, never $0$. So $n^2 + 1$ is never divisible by $3$.'
          - problem: 'The claim "$n^2 - 1$ is divisible by $3$ for every integer $n$" holds in the cases $n = 3k + 1$ and $n = 3k + 2$. Find an integer $n$ for which the claim is false.'
            answer: '3'
            answer_contract: {"kind": "property", "check": "multiple_of", "args": {"k": 3}}
            solution_sketch: 'Consider the case $n = 3k$. Then $n^2 - 1 = 9k^2 - 1 = 3(3k^2 - 1) + 2$ leaves remainder $2$ on division by $3$. For example $n = 3$ gives $8$, which is not divisible by $3$.'
          - problem: 'A proof of a statement about every integer $n$ splits into cases according to the remainder of $n$ on division by $6$. How many cases does it need?'
            answer: '6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The possible remainders on division by $6$ are $0, 1, 2, 3, 4, 5$, and each integer has exactly one of them. So the proof needs $6$ cases, and fewer cases would leave some integers uncovered.'
          - problem: 'Write the full proof that $n^3 - n$ is divisible by $3$ for every integer $n$.'
            answer: '3 divides n^3 - n for every integer n'
            answer_contract: {"kind": "none"}
            solution_sketch: 'Let $n$ be an arbitrary integer. By the division algorithm $n$ has exactly one of the forms $3k$, $3k + 1$ or $3k + 2$ with $k$ an integer, so we consider three cases. Case 1: $n = 3k$. Then $n^3 - n = 27k^3 - 3k = 3(9k^3 - k)$. Case 2: $n = 3k + 1$. Then $n^3 - n = (27k^3 + 27k^2 + 9k + 1) - (3k + 1) = 27k^3 + 27k^2 + 6k = 3(9k^3 + 9k^2 + 2k)$. Case 3: $n = 3k + 2$. Then $n^3 - n = (27k^3 + 54k^2 + 36k + 8) - (3k + 2) = 27k^3 + 54k^2 + 33k + 6 = 3(9k^3 + 18k^2 + 11k + 2)$. In each case the expression in brackets is an integer, so $n^3 - n$ is a multiple of $3$. The three cases cover every integer. Therefore $3$ divides $n^3 - n$ for every integer $n$. $\square$'
        constraints: 'Cases on the remainder modulo m: the quotient witness of one case, remainders of squares in contexts with sharing, a verdict, a counterexample from a missing case and the number of cases. The last item is a full textbook proof.'
    diagnostic_exemplar:
      problem: 'Prove by cases on the remainder of $n$ modulo $3$: for every integer $n$, $n^2 \equiv 0$ or $1 \pmod 3$.'
      answer: 'Every integer has the form $3k$, $3k+1$ or $3k+2$. If $n = 3k$ then $n^2 = 9k^2 = 3(3k^2) \equiv 0$. If $n = 3k+1$ then $n^2 = 9k^2 + 6k + 1 = 3(3k^2 + 2k) + 1 \equiv 1$. If $n = 3k+2$ then $n^2 = 9k^2 + 12k + 4 = 3(3k^2 + 4k + 1) + 1 \equiv 1$. The three cases are exhaustive, so $n^2 \equiv 0$ or $1 \pmod 3$ for every integer $n$.'
      solution_sketch: 'Split on the three possible remainders, square each form, and read off the remainder; note that the cases cover every integer.'
    anki_seeds:
      - front: 'When is a proof by cases valid?'
        back: 'When the cases are exhaustive (cover every possibility) and each case yields the conclusion.'
        type: basic

  - id: proof-by-exhaustion-wlog
    name: "Proof by Exhaustion and WLOG"
    core: false                # supplemental: refinement of proof-by-cases; terminal
    difficulty: 0.57
    drill: false
    answer_kind: proof
    expected_time_secs: 200
    prerequisites:
      - id: proof-by-cases
        weight: 0.6
        key: true
      - id: direct-proof
        weight: 0.2
    knowledge_points:
      - id: kp1
        name: "Exhaustion over a finite set"
        key_prerequisites: [proof-by-cases]
        exemplars:
          - problem: 'A perfect square leaves one of finitely many remainders on division by $10$, so its last digit can be found by squaring the digits $0, 1, \ldots, 9$. How many different last digits can a perfect square have?'
            answer: '6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The squares of $0, 1, \ldots, 9$ are $0, 1, 4, 9, 16, 25, 36, 49, 64, 81$, with last digits $0, 1, 4, 9, 6, 5, 6, 9, 4, 1$. The different last digits are $0, 1, 4, 5, 6, 9$, which is $6$ digits.'
          - problem: 'Two ordinary dice are rolled, so there are $36$ equally likely outcomes. By checking every outcome, find in how many of them the sum of the two numbers is a prime number.'
            answer: '15'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The prime sums are $2, 3, 5, 7, 11$. A sum of $2$ occurs in $1$ outcome, a sum of $3$ in $2$, a sum of $5$ in $4$, a sum of $7$ in $6$ and a sum of $11$ in $2$ outcomes. The total is $1 + 2 + 4 + 6 + 2 = 15$ outcomes.'
          - problem: 'The value of $n^2 + n + 41$ is prime for each of $n = 1, 2, \ldots, 10$. Find a positive integer $n$ for which $n^2 + n + 41$ is not prime.'
            answer: '40'
            answer_contract: {"kind": "property", "check": "prime_counterexample", "args": {"expr": "n^2+n+41", "var": "n", "min": 1}}
            solution_sketch: 'For $n = 40$ we get $40^2 + 40 + 41 = 1681 = 41 \cdot 41$, which is not prime. Checking ten cases cannot prove a claim for all positive integers, and this claim fails at $n = 40$.'
          - problem: 'Is $2^n \ge n^2$ true for every $n \in \{1, 2, 3, 4, 5, 6\}$?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "it is true", "true", "always"], ["no", "it is not true", "false", "not always", "not true", "it is not"]]}
            solution_sketch: 'Check the cases one at a time. For $n = 1$ we get $2 \ge 1$ and for $n = 2$ we get $4 \ge 4$. For $n = 3$ we get $8 \ge 9$, which is false, so the statement is not true for every $n$ in the set.'
          - problem: 'Every integer leaves one of the remainders $0, 1, \ldots, 6$ on division by $7$. Checking each remainder, find how many different remainders $n^3$ can leave on division by $7$.'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The cubes of $0, 1, \ldots, 6$ are $0, 1, 8, 27, 64, 125, 216$, and their remainders on division by $7$ are $0, 1, 1, 6, 1, 6, 6$. The different remainders are $0, 1, 6$, which is $3$ remainders.'
          - problem: 'Check $n = 1, 2, 3, 4, 5$. What is the smallest $n$ in this list for which $n^2 + n + 1$ is not prime?'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'For $n = 1, 2, 3$ the values are $3, 7, 13$, which are prime. For $n = 4$ the value is $21 = 3 \cdot 7$, which is not prime. So the smallest such $n$ is $4$.'
          - problem: 'A double-six domino set has one tile for every pair of numbers from $0$ to $6$, and the order of the two numbers does not matter. By listing the tiles, find how many tiles have exactly $6$ spots in total.'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The tiles with total $6$ are $(0, 6)$, $(1, 5)$, $(2, 4)$ and $(3, 3)$. The pairs $(4, 2)$, $(5, 1)$ and $(6, 0)$ are the same tiles in the other order. So $4$ tiles have exactly $6$ spots.'
          - problem: 'Write the full proof that for every integer $n$ the number $n^3$ leaves remainder $0$, $1$ or $8$ on division by $9$.'
            answer: 'n^3 mod 9 is 0, 1 or 8 for integers n'
            answer_contract: {"kind": "none"}
            solution_sketch: 'Let $n$ be an integer. By the division algorithm $n = 9q + r$ with $q$ an integer and $r \in \{0, 1, \ldots, 8\}$. Expanding, $n^3 = 729q^3 + 243q^2 r + 27 q r^2 + r^3 = 9(81q^3 + 27q^2 r + 3 q r^2) + r^3$. So $n^3$ and $r^3$ differ by a multiple of $9$ and leave the same remainder on division by $9$. It remains to check the nine possible values of $r$. For $r = 0, 1, 2$ the cubes are $0, 1, 8$, with remainders $0, 1, 8$. For $r = 3$ the cube is $27 = 9 \cdot 3$, with remainder $0$. For $r = 4$ it is $64 = 9 \cdot 7 + 1$, with remainder $1$. For $r = 5$ it is $125 = 9 \cdot 13 + 8$, with remainder $8$. For $r = 6$ it is $216 = 9 \cdot 24$, with remainder $0$. For $r = 7$ it is $343 = 9 \cdot 38 + 1$, with remainder $1$. For $r = 8$ it is $512 = 9 \cdot 56 + 8$, with remainder $8$. Every one of the nine cases gives remainder $0$, $1$ or $8$. Therefore $n^3$ leaves remainder $0$, $1$ or $8$ on division by $9$ for every integer $n$. $\square$'
        constraints: 'Exhaustion over a finite set or over the residues modulo m: counts of possible values, a context with dice or tiles, a counterexample to a claim that was checked only for small cases, a verdict. The last item is a full textbook proof.'
      - id: kp2
        name: "Without loss of generality"
        key_prerequisites: [proof-by-cases]
        try_first:
          problem: 'Five marbles are split between a red box and a blue box. A rule is unchanged when the two boxes are exchanged. How many splits remain if only splits with at least as many marbles in the red box as in the blue box are considered?'
          answer_contract: {"kind": "exact"}
          answer: '3'
          reveal: 'The six ordered splits come in exchanged pairs, and no pair has equal numbers because $5$ is odd, so three splits remain. This is the idea of "without loss of generality": when two roles are exchangeable, one case of each exchanged pair is enough.'
        exemplars:
          - problem: 'Let $m$ and $n$ be integers of different parity. Without loss of generality $m$ is even and $n$ is odd, so $m = 2a$ and $n = 2b + 1$ for integers $a$ and $b$. Write $mn$ in the form $2k$ and find $k$ in terms of $a$ and $b$.'
            answer: '2ab+a'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Multiplying gives $mn = 2a(2b + 1) = 4ab + 2a = 2(2ab + a)$, so $k = 2ab + a$. The assumption that $m$ is the even one loses nothing, because the hypothesis "different parity" and the product $mn = nm$ are the same when the names $m$ and $n$ are exchanged.'
          - problem: 'Let $x$ and $y$ be real numbers. Assume without loss of generality that $x \le y$. Simplify $|x - y| + \max(x, y) - \min(x, y)$.'
            answer: '2y-2x'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Since $x \le y$ we have $|x - y| = y - x$, $\max(x, y) = y$ and $\min(x, y) = x$. So the expression equals $(y - x) + y - x = 2y - 2x$. The expression is unchanged when $x$ and $y$ are exchanged, which is why the assumption $x \le y$ loses nothing.'
          - problem: 'Ana has $17$ euros and Ben has $45$ euros. The richer of the two gives the other some money so that both end with the same amount. How many euros does the richer one give?'
            answer: '14'
            answer_contract: {"kind": "unit", "quantity": "euro", "unit": "euro", "allow_omitted": true}
            solution_sketch: 'Together they have $62$ euros, so each should end with $62 / 2 = 31$ euros. The richer one has $45$ and must give $45 - 31 = 14$ euros. The answer is the same if the names are exchanged, because only the difference $45 - 17 = 28$ matters, and half of it is $14$.'
          - problem: 'Two ordinary dice, one red and one blue, are rolled. How many of the $36$ outcomes give an odd sum?'
            answer: '18'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The sum is odd exactly when the two numbers have different parity. If the red die is odd and the blue die is even, there are $3 \cdot 3 = 9$ outcomes. If the red die is even and the blue die is odd, there are another $9$. The two cases are exchanges of each other, so there are $18$ outcomes.'
          - problem: 'Let $x$ and $y$ be integers such that $x + y$ is odd. Assume without loss of generality that $x$ is even, so $x = 2a$ and $y = 2b + 1$. Write $x + y = 2k + 1$ and find $k$ in terms of $a$ and $b$.'
            answer: 'a+b'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Adding gives $x + y = 2a + 2b + 1 = 2(a + b) + 1$, so $k = a + b$. Exchanging $x$ and $y$ changes neither the hypothesis that $x + y$ is odd nor the sum, so assuming that $x$ is the even one loses nothing.'
          - problem: 'A proof that $xy$ is even whenever $x + y$ is odd, for integers $x$ and $y$, assumes without loss of generality that $x$ is even and proves the claim for that case only. Is the proof complete?'
            answer: 'yes'
            answer_contract: {"kind": "label", "options": [["yes", "it is complete", "complete", "her proof is complete"], ["no", "it is not complete", "incomplete", "not complete"]]}
            solution_sketch: 'The hypothesis "$x + y$ is odd" and the conclusion "$xy$ is even" do not change when $x$ and $y$ are exchanged. So the case with $y$ even is the same proof with the names exchanged, and the proof is complete.'
          - problem: 'Write the full proof that $\max(x, y) = \dfrac{x + y + |x - y|}{2}$ for all real numbers $x$ and $y$, using the assumption $x \le y$ without loss of generality.'
            answer: 'max(x,y) = (x+y+|x-y|)/2 for real x, y'
            answer_contract: {"kind": "none"}
            solution_sketch: 'Let $x$ and $y$ be real numbers. First we justify the symmetry. Exchanging $x$ and $y$ turns the left side $\max(x, y)$ into $\max(y, x)$, which is the same number. It turns the right side into $(y + x + |y - x|)/2$, which is the same number as well, because $y + x = x + y$ and $|y - x| = |x - y|$. So the statement does not change when $x$ and $y$ are exchanged. If $y < x$, we apply the case $x \le y$ to the pair $(y, x)$; therefore we may assume without loss of generality that $x \le y$. Then $\max(x, y) = y$. Also $y - x \ge 0$, so $|x - y| = |y - x| = y - x$. Hence $\dfrac{x + y + |x - y|}{2} = \dfrac{x + y + y - x}{2} = \dfrac{2y}{2} = y = \max(x, y)$. This proves the identity when $x \le y$, and by the symmetry it holds when $y \le x$ too. Therefore $\max(x, y) = \dfrac{x + y + |x - y|}{2}$ for all real numbers $x$ and $y$. $\square$'
        constraints: 'Using WLOG after the symmetry is stated: witnesses after the assumption, simplification under x <= y, contexts where the two roles are exchangeable, and a verdict on a complete proof. The last item is a full textbook proof.'
      - id: kp3
        name: "When WLOG is legitimate"
        key_prerequisites: [proof-by-cases]
        exemplars:
          - problem: 'In proving that $a^2 + b^2 \ge 2ab$ for all real numbers $a$ and $b$, may we assume without loss of generality that $a \le b$?'
            answer: 'yes'
            answer_contract: {"kind": "label", "options": [["yes", "we may", "it is legitimate", "legitimate"], ["no", "we may not", "it is not legitimate", "not legitimate", "illegitimate"]]}
            solution_sketch: 'Exchanging $a$ and $b$ turns $a^2 + b^2 \ge 2ab$ into $b^2 + a^2 \ge 2ba$, which is the same statement. So a proof for $a \le b$ also covers $b < a$ after the names are exchanged, and the assumption is legitimate.'
          - problem: 'A proof of "if $m$ is even and $n$ is odd, then $mn$ is even" for integers $m$ and $n$ assumes without loss of generality that $m \le n$. Is this assumption legitimate?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "we may", "it is legitimate", "legitimate"], ["no", "we may not", "it is not legitimate", "not legitimate", "illegitimate"]]}
            solution_sketch: 'The hypothesis gives $m$ and $n$ different roles: $m$ is even and $n$ is odd. Exchanging the names gives "$m$ is odd and $n$ is even", which is a different hypothesis. So the case $n < m$ is not the case $m \le n$ with new names, and the assumption discards cases instead of reducing them.'
          - problem: 'A statement about three distinct real numbers $a$, $b$ and $c$ is unchanged when any two of the numbers are exchanged. How many of the possible orders of $a$, $b$, $c$ on the number line does the assumption $a < b < c$ cover, once the symmetry is used?'
            answer: '6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Three distinct numbers can be arranged in $3 \cdot 2 \cdot 1 = 6$ orders on the number line. Each order becomes $a < b < c$ after the names are exchanged in a suitable way, and the symmetry says the statement does not change. So the one assumption covers all $6$ orders.'
          - problem: 'A statement about two numbers $a$ and $b$ chosen from $\{1, 2, 3, 4\}$ is unchanged when $a$ and $b$ are exchanged, and $a$ and $b$ may be equal. After assuming without loss of generality that $a \le b$, how many ordered pairs $(a, b)$ remain to be checked?'
            answer: '10'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The pairs with $a \le b$ are $(1,1)$, $(1,2)$, $(1,3)$, $(1,4)$, $(2,2)$, $(2,3)$, $(2,4)$, $(3,3)$, $(3,4)$, $(4,4)$. That is $4 + 3 + 2 + 1 = 10$ pairs. The other $6$ of the $16$ ordered pairs are exchanges of these.'
          - problem: 'A proof that $a - b \ge 0$ for all $a, b \in \{1, 2, 3\}$ assumes without loss of generality that $a \ge b$ and proves the claim for that case. For how many of the nine ordered pairs $(a, b)$ is the claim false?'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The statement is not unchanged when $a$ and $b$ are exchanged, because $a - b$ becomes $b - a$. So the assumption $a \ge b$ discards the pairs with $a < b$ instead of reducing them. The pairs $(1, 2)$, $(1, 3)$ and $(2, 3)$ have $a - b < 0$, so the claim is false for $3$ of the nine pairs.'
          - problem: 'In a league of $6$ teams every pair of teams plays one match. A rule about a match reads the same whichever team is named first. By this symmetry, how many different pairings must be checked?'
            answer: '15'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A pairing is an unordered pair of teams, because naming team $X$ before team $Y$ or after it gives the same pairing. The number of pairings is $6 \cdot 5 / 2 = 15$. The ordered pairs, $30$ of them, count each pairing twice.'
          - problem: 'Two dice, one red and one blue, are rolled. A claim about the two numbers is unchanged when the dice are exchanged. After assuming without loss of generality that the red number is at least the blue number, how many of the $36$ ordered outcomes remain?'
            answer: '21'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'If the red number is $r$, there are $r$ choices of the blue number that are at most $r$. The total is $1 + 2 + 3 + 4 + 5 + 6 = 21$ outcomes. Every other outcome is an exchange of one of these.'
          - problem: 'Write the full proof that $(a - b)(b - c)(c - a)$ is even for all integers $a$, $b$ and $c$.'
            answer: '(a-b)(b-c)(c-a) is even for integers'
            answer_contract: {"kind": "none"}
            solution_sketch: 'Let $a$, $b$ and $c$ be integers and put $P = (a - b)(b - c)(c - a)$. Each of the three numbers is even or odd, and there are only two parities, so two of the three numbers have the same parity. We justify a relabeling. Exchanging two of the names changes $P$ only by a factor $-1$: for example exchanging $a$ and $b$ gives $(b - a)(a - c)(c - b) = -P$, and the same holds for the other exchanges. Whether $P$ is even does not depend on its sign, so the statement is unchanged by every relabeling of $a$, $b$, $c$. Therefore we may assume without loss of generality that $a$ and $b$ have the same parity. If $a$ and $b$ are both even, then $a = 2s$ and $b = 2t$ for integers $s$ and $t$, and $a - b = 2(s - t)$. If $a$ and $b$ are both odd, then $a = 2s + 1$ and $b = 2t + 1$, and $a - b = 2(s - t)$. In both cases $a - b = 2m$ with $m = s - t$ an integer. Then $P = 2m(b - c)(c - a) = 2[m(b - c)(c - a)]$, and the bracket is an integer, so $P$ is even. Therefore $(a - b)(b - c)(c - a)$ is even for all integers $a$, $b$ and $c$. $\square$'
        constraints: 'When WLOG is legitimate: verdicts on given assumptions, the number of cases that remain after a legitimate symmetry, counts in contexts, and one asymmetric statement where the assumption removes cases. The last item is a full textbook proof.'
    diagnostic_exemplar:
      problem: 'Prove: for all integers $m, n$, if $m$ and $n$ have different parities then $mn$ is even. Use "without loss of generality", and justify in one sentence why the WLOG step is legitimate here.'
      answer: 'Both the hypothesis ("different parities") and the conclusion ($mn$ even) are unchanged when $m$ and $n$ are swapped, so a proof of one case covers the other by relabelling: WLOG $m$ is even and $n$ is odd. Then $m = 2a$ for an integer $a$, so $mn = 2(an)$ with $an$ an integer, i.e. $mn$ is even.'
      solution_sketch: 'State the symmetry that licenses WLOG, take the even factor to be $m$, and factor $2$ out of the product.'
    anki_seeds:
      - front: 'What justifies a "without loss of generality" assumption?'
        back: 'A symmetry of the statement: relabeling the variables maps the remaining cases onto the assumed one.'
        type: basic
      - front: 'What is a proof by exhaustion?'
        back: 'Checking every element of a finite set of cases individually; valid only when the cases provably cover everything.'
        type: basic

  - id: proof-by-contrapositive
    name: "Proof by Contrapositive"
    core: true
    difficulty: 0.60
    drill: false
    answer_kind: proof
    expected_time_secs: 210
    prerequisites:
      - id: conditional-statements
        weight: 0.5
        key: true
      - id: direct-proof
        weight: 0.5
        key: true
      - id: negating-statements
        weight: 0.4
      - id: logical-equivalence
        weight: 0.0
    knowledge_points:
      - id: kp1
        name: "When the contrapositive is easier"
        key_prerequisites: [conditional-statements]
        exemplars:
          - problem: 'To prove "if $n^3$ is even, then $n$ is even" by contraposition, the hypothesis of the contrapositive is written as $n = 2k + 1$. Write $n^3$ in the form $2m + 1$ and find $m$ in terms of $k$.'
            answer: '4k^3+6k^2+3k'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The contrapositive is "if $n$ is odd, then $n^3$ is odd". Expanding gives $(2k+1)^3 = 8k^3 + 12k^2 + 6k + 1 = 2(4k^3 + 6k^2 + 3k) + 1$. So $m = 4k^3 + 6k^2 + 3k$.'
          - problem: 'A proof of "if $5n + 4$ is odd, then $n$ is odd" by contraposition assumes that $n$ is even, so $n = 2k$. Write $5n + 4$ in the form $2m$ and find $m$ in terms of $k$.'
            answer: '5k+2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'We have $5n + 4 = 5(2k) + 4 = 10k + 4 = 2(5k + 2)$, so $m = 5k + 2$ and $5n + 4$ is even. This proves the contrapositive "if $n$ is even, then $5n + 4$ is even".'
          - problem: 'A box holds $3n + 2$ sweets, where $n$ is a whole number, and the sweets are shared equally between two children. A proof that if no sweet is left over, then $n$ is even, shows that an odd $n$ always leaves a sweet over. How many sweets are left over when $n$ is odd?'
            answer: '1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'For an odd $n = 2k + 1$ we get $3n + 2 = 6k + 5 = 2(3k + 2) + 1$. Dividing by $2$ leaves remainder $1$, so $1$ sweet is left over. This proves the contrapositive: if $n$ is odd, the sweets cannot be shared equally.'
          - problem: 'What is the smallest positive integer $n$ for which "if $n^2$ is divisible by $4$, then $n$ is divisible by $4$" is false?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'For $n = 2$ the square $4$ is divisible by $4$, but $2$ is not divisible by $4$, so the claim fails. For $n = 1$ the hypothesis is false, so $1$ is not a counterexample. Hence the smallest counterexample is $n = 2$.'
          - problem: 'Is the following true for every integer $n$: if $n^2 - 2n$ is odd, then $n$ is odd?'
            answer: 'yes'
            answer_contract: {"kind": "label", "options": [["yes", "it is true", "true", "always"], ["no", "it is not true", "false", "not always", "not true", "it is not"]]}
            solution_sketch: 'The contrapositive is "if $n$ is even, then $n^2 - 2n$ is even". For $n = 2k$ we get $n^2 - 2n = 4k^2 - 4k = 2(2k^2 - 2k)$, which is even. So the contrapositive holds, and the statement is true.'
          - problem: 'A rectangular floor is $5$ tiles long and $11$ tiles wide. Dominoes cover two tiles each, and as many dominoes as possible are laid. How many dominoes are laid?'
            answer: '27'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The floor has $5 \cdot 11 = 55$ tiles and $55 = 2 \cdot 27 + 1$, so $27$ dominoes cover $54$ tiles and one tile is left. The product $ab$ is odd because $a$ and $b$ are both odd. By contraposition, if one of $a$ and $b$ were even, then $ab$ would be even and no tile would be left.'
          - problem: 'Write the full proof that for every integer $n$, if $n^2$ is even, then $n$ is even.'
            answer: 'n^2 even => n even, for integers n'
            answer_contract: {"kind": "none"}
            solution_sketch: 'Let $n$ be an integer. We prove the contrapositive: if $n$ is odd, then $n^2$ is odd. This is logically equivalent to the original statement. Suppose that $n$ is odd. Then $n = 2k + 1$ for some integer $k$. Squaring gives $n^2 = 4k^2 + 4k + 1 = 2(2k^2 + 2k) + 1$. Since $2k^2 + 2k$ is an integer, $n^2$ has the form $2m + 1$ with $m$ an integer, so $n^2$ is odd. This proves the contrapositive. Therefore, if $n^2$ is even, then $n$ is even. $\square$'
        constraints: 'When the contrapositive is easier: naming the contrapositive among four statements, the witness of the odd case, sharing contexts, a counterexample to a plausible converse, a verdict. The last item is a full textbook proof.'
      - id: kp2
        name: "Contrapositive proofs about integers"
        key_prerequisites: [direct-proof]
        exemplars:
          - problem: 'Take $b = 2$. Give a positive integer $a$ for which the contrapositive of "if $ab + a$ is odd, then $a$ is odd and $b$ is even" tells you that $ab + a$ is even.'
            answer: '2'
            answer_contract: {"kind": "property", "check": "multiple_of", "args": {"k": 2, "min": 1}}
            solution_sketch: 'The contrapositive is "if $a$ is even or $b$ is odd, then $ab + a$ is even". With $b = 2$ the number $b$ is even, so the hypothesis holds exactly when $a$ is even. For $a = 2$ we get $ab + a = 6$, which is even.'
          - problem: 'In a proof by contraposition of "if $ab + a$ is odd, then $a$ is odd and $b$ is even", one case assumes that $b$ is odd, so $b = 2k + 1$. Write $ab + a$ as $2m$ and find $m$ in terms of $a$ and $k$.'
            answer: 'a(k+1)'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'We have $ab + a = a(b + 1) = a(2k + 2) = 2a(k + 1)$, so $m = a(k + 1)$ and $ab + a$ is even. The other case, $a$ even, is handled separately; both cases are needed because the negated conclusion is an "or".'
          - problem: 'To prove "if $ab$ is odd, then $a$ and $b$ are both odd" by contraposition one assumes "$a$ is even or $b$ is even". Each of $a$ and $b$ is even or odd, which gives four parity patterns for $(a, b)$. In how many of the four patterns is "$a$ is even or $b$ is even" true?'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The four patterns are (even, even), (even, odd), (odd, even) and (odd, odd). The statement "$a$ is even or $b$ is even" is true in the first three and false only in (odd, odd). So it is true in $3$ patterns, and the proof must treat each of them.'
          - problem: 'What is the smallest positive integer $b$ for which "if $6$ divides $9b$, then $6$ divides $9$ or $6$ divides $b$" is false?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'For $b = 2$ we get $9b = 18 = 6 \cdot 3$, so $6$ divides $9b$. But $6$ does not divide $9$ and $6$ does not divide $2$, so the claim is false. For $b = 1$ we get $9$, which $6$ does not divide, so $1$ is not a counterexample.'
          - problem: 'An auditorium has $r$ rows with $s$ seats in each row, and the total number of seats $rs$ is $221$, an odd number. By contraposition, if $rs$ is odd, then $r$ and $s$ are both odd. If there are $13$ rows, how many seats are in each row?'
            answer: '17'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Each row has $s = 221 / 13 = 17$ seats. Both $13$ and $17$ are odd, as the contrapositive requires: if one of them were even, the product $221$ would be even.'
          - problem: 'Ten cards are numbered $1$ to $10$. A pair of different cards is chosen. In how many different pairs is the sum of the two numbers odd?'
            answer: '25'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'If the two numbers have the same parity, the sum is even; by contraposition, an odd sum forces different parities. The cards have $5$ odd and $5$ even numbers. Each pair with an odd sum has one odd and one even card, so there are $5 \cdot 5 = 25$ pairs.'
          - problem: 'Is it true that for all integers $a$ and $b$, if $ab$ is even, then $a$ is even or $b$ is even?'
            answer: 'yes'
            answer_contract: {"kind": "label", "options": [["yes", "it is true", "true", "always"], ["no", "it is not true", "false", "not always", "not true", "it is not"]]}
            solution_sketch: 'The contrapositive is "if $a$ and $b$ are both odd, then $ab$ is odd". With $a = 2s + 1$ and $b = 2t + 1$ we get $ab = 4st + 2s + 2t + 1 = 2(2st + s + t) + 1$, which is odd. So the contrapositive holds, and the statement is true.'
          - problem: 'Write the full proof that for all integers $a$ and $b$, if $a^2(b^2 - 2b)$ is odd, then $a$ and $b$ are both odd.'
            answer: 'a^2(b^2-2b) odd => a, b both odd'
            answer_contract: {"kind": "none"}
            solution_sketch: 'Let $a$ and $b$ be integers. We prove the contrapositive: if $a$ is even or $b$ is even, then $a^2(b^2 - 2b)$ is even. The negation of "$a$ and $b$ are both odd" is "$a$ is even or $b$ is even", so we treat these two cases. Case 1: $a$ is even. Then $a = 2k$ for some integer $k$, and $a^2(b^2 - 2b) = 4k^2(b^2 - 2b) = 2[2k^2(b^2 - 2b)]$. The bracket is an integer, so the product is even. Case 2: $b$ is even. Then $b = 2k$ for some integer $k$, and $b^2 - 2b = 4k^2 - 4k = 2(2k^2 - 2k)$. So $a^2(b^2 - 2b) = 2[a^2(2k^2 - 2k)]$, and the bracket is an integer, so the product is even. In both cases $a^2(b^2 - 2b)$ is even, which proves the contrapositive. Since a statement and its contrapositive are equivalent, if $a^2(b^2 - 2b)$ is odd, then $a$ and $b$ are both odd. $\square$'
        constraints: 'Contrapositive proofs about integers with a conjunction or disjunction: naming the contrapositive, the witness of one case, the number of parity patterns, a counterexample to a divisibility claim, counts in contexts, a verdict. The last item is a full textbook proof.'
      - id: kp3
        name: "Contrapositive with real numbers"
        key_prerequisites: [negating-statements]
        exemplars:
          - problem: 'A proof of "if $3x + 4$ is irrational, then $x$ is irrational" by contraposition assumes that $x$ is rational, so $x = p/q$ with integers $p$ and $q$ and $q \ne 0$. Write $3x + 4$ as a single fraction.'
            answer: '(3p+4q)/q'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'With $x = p/q$ we get $3x + 4 = 3p/q + 4q/q = (3p + 4q)/q$. The numerator $3p + 4q$ is an integer and $q \ne 0$, so $3x + 4$ is rational, which proves the contrapositive.'
          - problem: 'A proof of "if $x + y$ is irrational, then $x$ is irrational or $y$ is irrational" by contraposition assumes that $x$ and $y$ are both rational, so $x = p/q$ and $y = r/s$ with integers $p, q, r, s$ and $q, s \ne 0$. Write $x + y$ as a single fraction.'
            answer: '(ps+qr)/(qs)'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Put both fractions over the common denominator $qs$. Then $\dfrac{p}{q} + \dfrac{r}{s} = \dfrac{ps}{qs} + \dfrac{qr}{qs} = \dfrac{ps + qr}{qs}$. This is a quotient of integers with $qs \ne 0$, so $x + y$ is rational.'
          - problem: 'Is it true that for every real number $x$, if $x^2$ is rational, then $x$ is rational?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "it is true", "true", "always"], ["no", "it is not true", "false", "not always", "not true", "it is not"]]}
            solution_sketch: 'The number $x = \sqrt{2}$ is irrational, but $x^2 = 2$ is rational, so the statement is false. Its contrapositive "if $x$ is irrational, then $x^2$ is irrational" is false for the same reason.'
          - problem: 'A proof that if $x^2 + 2x$ is irrational, then $x$ is irrational, assumes that $x = p/q$ is rational. For $p = 2$ and $q = 3$, what is the value of $x^2 + 2x$?'
            answer: '16/9'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'With $x = 2/3$ we get $x^2 + 2x = 4/9 + 4/3 = 4/9 + 12/9 = 16/9$. In general $x^2 + 2x = (p^2 + 2pq)/q^2$, which is $(4 + 12)/9 = 16/9$ here.'
          - problem: 'The perimeter of a square is $4s$ if its side has length $s$. A proof shows that if the perimeter is irrational, then the side is irrational. A square has perimeter $18$ m. How long is its side?'
            answer: '4.5'
            answer_contract: {"kind": "unit", "quantity": "length", "unit": "m", "allow_omitted": true}
            solution_sketch: 'The side is the perimeter divided by $4$, so $s = 18 / 4 = 4.5$ m. The claim holds because a rational side $s = p/q$ gives the rational perimeter $4p/q$.'
          - problem: 'Two friends are $1.64$ m and $1.72$ m tall. The mean of two numbers $x$ and $y$ is $(x + y)/2$, and the statement "if the mean is irrational, then $x$ or $y$ is irrational" is proved by contraposition. What is the mean height of the two friends?'
            answer: '1.68'
            answer_contract: {"kind": "unit", "quantity": "length", "unit": "m", "allow_omitted": true}
            solution_sketch: 'The mean is $(1.64 + 1.72)/2 = 3.36/2 = 1.68$ m. Both heights are rational, so the mean is rational, which is the contrapositive of the statement.'
          - problem: 'How many of the numbers $\sqrt{2}$, $\sqrt{4}$, $\sqrt{8}$, $\sqrt{9}$, $\sqrt{12}$ are irrational?'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'We have $\sqrt{4} = 2$ and $\sqrt{9} = 3$, which are rational. The numbers $2$, $8$ and $12$ are not perfect squares, so $\sqrt{2}$, $\sqrt{8}$ and $\sqrt{12}$ are irrational. That is $3$ irrational numbers.'
          - problem: 'Write the full proof that for every real number $x$, if $x^3 + 4x$ is irrational, then $x$ is irrational.'
            answer: 'x^3+4x irrational => x irrational'
            answer_contract: {"kind": "none"}
            solution_sketch: 'Let $x$ be a real number. We prove the contrapositive: if $x$ is rational, then $x^3 + 4x$ is rational. Suppose that $x$ is rational. By the definition of rational numbers, $x = p/q$ for some integers $p$ and $q$ with $q \ne 0$. Then $x^3 + 4x = \dfrac{p^3}{q^3} + \dfrac{4p}{q} = \dfrac{p^3 + 4pq^2}{q^3}$. The numerator $p^3 + 4pq^2$ is an integer, and the denominator $q^3$ is a nonzero integer because $q \ne 0$. So $x^3 + 4x$ is a quotient of integers with a nonzero denominator, which means it is rational. This proves the contrapositive. Since a statement and its contrapositive are equivalent, if $x^3 + 4x$ is irrational, then $x$ is irrational. $\square$'
        constraints: 'Contrapositive with real numbers and the definition of rational: the fraction produced by the proof, naming the contrapositive, a value check, measured contexts that need a division, a verdict, a count of irrational numbers. The last item is a full textbook proof.'
    diagnostic_exemplar:
      problem: 'Prove: for every real $x$, if $x^2 + 2x$ is irrational then $x$ is irrational.'
      answer: 'Prove the contrapositive: if $x$ is rational then $x^2 + 2x$ is rational. Let $x = p/q$ with $p, q$ integers and $q \ne 0$. Then $x^2 + 2x = \frac{p^2}{q^2} + \frac{2p}{q} = \frac{p^2 + 2pq}{q^2}$, a ratio of integers with nonzero denominator, hence rational. The contrapositive is logically equivalent to the original statement, so the claim follows.'
      solution_sketch: 'The direct statement is awkward; its contrapositive needs only closure of the rationals under products and sums.'
    anki_seeds:
      - front: 'To prove $P \to Q$ by contrapositive, you instead prove...'
        back: 'The logically equivalent contrapositive $\neg Q \to \neg P$.'
        type: basic

  - id: biconditional-proofs
    name: "Biconditional Proofs"
    core: true
    difficulty: 0.58
    drill: false
    answer_kind: proof
    expected_time_secs: 220
    prerequisites:
      - id: direct-proof
        weight: 0.5
        key: true
      - id: conditional-statements
        weight: 0.4
        key: true
      - id: proof-by-contrapositive
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: "The two-direction template"
        key_prerequisites: [conditional-statements]
        exemplars:
          - problem: 'A proof of "$n$ is even if and only if $n + 3$ is odd" treats the direction "if $n + 3$ is odd, then $n$ is even" by writing $n + 3 = 2m + 1$ for an integer $m$. Express $n$ in terms of $m$.'
            answer: '2m-2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Subtracting $3$ from both sides gives $n = 2m + 1 - 3 = 2m - 2 = 2(m - 1)$. Since $m - 1$ is an integer, $n$ is even, which proves this direction.'
          - problem: 'A proof shows that if $n$ is odd, then $n^2$ is odd, and concludes that "$n$ is odd if and only if $n^2$ is odd". Is the proof complete?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "it is complete", "complete", "her proof is complete"], ["no", "it is not complete", "incomplete", "not complete"]]}
            solution_sketch: 'A biconditional "$P$ if and only if $Q$" says both "$P$ implies $Q$" and "$Q$ implies $P$". The proof covers only the first implication. The proof also needs "if $n^2$ is odd, then $n$ is odd", so the proof is not complete.'
          - problem: 'Four statements $P$, $Q$, $R$ and $S$ are to be shown equivalent by proving the cycle $P \Rightarrow Q$, $Q \Rightarrow R$, $R \Rightarrow S$ and $S \Rightarrow P$. How many implications does this cycle contain?'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The cycle has one implication for each statement, which is $4$ implications. Following the cycle, each statement implies every other, so all four are equivalent. Proving every pair in both directions would need $12$ implications instead.'
          - problem: 'A positive integer is divisible by $9$ if and only if the sum of its digits is divisible by $9$. Is $7254018$ divisible by $9$?'
            answer: 'yes'
            answer_contract: {"kind": "label", "options": [["yes", "it is divisible", "divisible", "it is"], ["no", "it is not divisible", "not divisible", "it is not"]]}
            solution_sketch: 'The digit sum is $7 + 2 + 5 + 4 + 0 + 1 + 8 = 27$, which is divisible by $9$. The test is an if and only if, so $7254018$ is divisible by $9$. Check: $7254018 = 9 \cdot 806002$.'
          - problem: 'A rectangular courtyard has whole-number side lengths $a$ and $b$ metres, and its area is odd if and only if $a$ and $b$ are both odd. The area is $143$ square metres and $a = 11$. How long is the side $b$?'
            answer: '13'
            answer_contract: {"kind": "unit", "quantity": "length", "unit": "m", "allow_omitted": true}
            solution_sketch: 'Since $ab = 143$, we get $b = 143 / 11 = 13$ m. The area is odd, so both $11$ and $13$ are odd, as the biconditional says.'
          - problem: 'A box with $5k + 3$ chocolates, where $k$ is a positive whole number, can be shared equally between two children if and only if the number of chocolates is even. What is the smallest $k$ for which the box can be shared equally?'
            answer: '1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The number $5k + 3$ is even exactly when $5k$ is odd, which happens exactly when $k$ is odd. For $k = 1$ the box has $8$ chocolates, which can be shared with $4$ each. So the smallest $k$ is $1$.'
          - problem: 'Write the full proof that for all integers $a$ and $b$, $a \equiv b \pmod{10}$ if and only if $a \equiv b \pmod 2$ and $a \equiv b \pmod 5$. (For a positive integer $m$, $a \equiv b \pmod m$ means that $m$ divides $a - b$.)'
            answer: 'a=b mod 10 iff a=b mod 2 and mod 5'
            answer_contract: {"kind": "none"}
            solution_sketch: 'Let $a$ and $b$ be integers. We prove both directions. ($\Rightarrow$) Suppose $a \equiv b \pmod{10}$. Then $a - b = 10k$ for some integer $k$. Now $a - b = 2(5k)$, so $2$ divides $a - b$, and $a - b = 5(2k)$, so $5$ divides $a - b$. Hence $a \equiv b \pmod 2$ and $a \equiv b \pmod 5$. ($\Leftarrow$) Suppose $a \equiv b \pmod 2$ and $a \equiv b \pmod 5$. Then $a - b = 2m$ and $a - b = 5k$ for some integers $m$ and $k$, so $2m = 5k$. Therefore $k = 5k - 4k = 2m - 4k = 2(m - 2k)$. So $k = 2j$ with $j = m - 2k$ an integer. Then $a - b = 5k = 10j$, which means $a \equiv b \pmod{10}$. Both directions are proved. Therefore $a \equiv b \pmod{10}$ if and only if $a \equiv b \pmod 2$ and $a \equiv b \pmod 5$. $\square$'
        constraints: 'The two-direction template: the algebra of one direction, a verdict on a one-direction proof, the number of implications in a cycle, a digit-sum test, contexts with a division. The last item is a full textbook proof.'
      - id: kp2
        name: "Contrapositive in one direction"
        key_prerequisites: [proof-by-contrapositive]
        exemplars:
          - problem: 'To prove "$x$ is even if and only if $3x + 5$ is odd", the direction "if $x$ is even, then $3x + 5$ is odd" is proved directly with $x = 2a$. Write $3x + 5$ in the form $2k + 1$ and find $k$ in terms of $a$.'
            answer: '3a+2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'We have $3x + 5 = 3(2a) + 5 = 6a + 5 = 2(3a + 2) + 1$, so $k = 3a + 2$ and $3x + 5$ is odd. This proves one direction of the biconditional.'
          - problem: 'For the other direction, "if $3x + 5$ is odd, then $x$ is even", prove the contrapositive and write its hypothesis as $x = 2m + 1$. Write $3x + 5$ in the form $2k$ and find $k$ in terms of $m$.'
            answer: '3m+4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The contrapositive is "if $x$ is odd, then $3x + 5$ is even". With $x = 2m + 1$ we get $3x + 5 = 6m + 3 + 5 = 6m + 8 = 2(3m + 4)$. So $k = 3m + 4$.'
          - problem: 'A teacher with $x$ students prepares $3x + 5$ stickers and splits them equally between two boxes. The stickers can be split with none left over if and only if $x$ is odd. For $x = 27$ students, how many stickers go in each box?'
            answer: '43'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'For $x = 27$ the teacher has $3 \cdot 27 + 5 = 86$ stickers, and $27$ is odd, so the split works. Each box gets $86 / 2 = 43$ stickers.'
          - problem: 'What is the smallest non-negative integer $x$ for which "$x$ is even if and only if $x^2 + 1$ is even" is false?'
            answer: '0'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'For $x = 0$ the statement "$x$ is even" is true, but $x^2 + 1 = 1$ is odd, so "$x^2 + 1$ is even" is false. The two statements have different truth values at $x = 0$, so the biconditional fails there. In fact "$x$ is even" is equivalent to "$x^2 + 1$ is odd".'
          - problem: 'Is it true that for every integer $n$, $n$ is odd if and only if $n^2 + 2n$ is odd?'
            answer: 'yes'
            answer_contract: {"kind": "label", "options": [["yes", "it is true", "true", "always"], ["no", "it is not true", "false", "not always", "not true", "it is not"]]}
            solution_sketch: 'If $n$ is odd, then $n + 2$ is odd and $n^2 + 2n = n(n + 2)$ is a product of odd numbers, so it is odd. If $n$ is even, then $n(n + 2)$ is even, which is the contrapositive of the other direction. Both directions hold, so the statement is true.'
          - problem: 'For how many of the integers $x$ from $1$ to $20$ is $3x + 5$ odd?'
            answer: '10'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The number $3x + 5$ is odd if and only if $x$ is even, so we count the even integers from $1$ to $20$. They are $2, 4, \ldots, 20$, which is $10$ integers.'
          - problem: 'A lamp starts off, and every press of its button switches it between off and on. After $n$ presses the lamp is on if and only if $n$ is odd. Each of six runs starts with the lamp off. In run $x$, for $x = 1, 2, \ldots, 6$, the button is pressed $3x + 5$ times. In how many of the six runs does the lamp end on?'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The lamp is on after $3x + 5$ presses if and only if $3x + 5$ is odd, which holds if and only if $x$ is even. The even values of $x$ from $1$ to $6$ are $2$, $4$ and $6$, so the lamp ends on in $3$ runs.'
          - problem: 'Write the full proof that for every integer $x$, $x$ is even if and only if $3x + 5$ is odd. Prove one direction directly and the other by contrapositive.'
            answer: 'x even iff 3x+5 odd, for integers x'
            answer_contract: {"kind": "none"}
            solution_sketch: 'Let $x$ be an integer. We prove both directions. ($\Rightarrow$) Suppose $x$ is even. Then $x = 2a$ for some integer $a$, and $3x + 5 = 6a + 5 = 2(3a + 2) + 1$. Since $3a + 2$ is an integer, $3x + 5$ is odd. ($\Leftarrow$) We prove the contrapositive: if $x$ is odd, then $3x + 5$ is even. Suppose $x$ is odd. Then $x = 2a + 1$ for some integer $a$, and $3x + 5 = 6a + 3 + 5 = 6a + 8 = 2(3a + 4)$. Since $3a + 4$ is an integer, $3x + 5$ is even. By contraposition, if $3x + 5$ is odd, then $x$ is even. Both directions are proved. Therefore $x$ is even if and only if $3x + 5$ is odd. $\square$'
        constraints: 'One direction direct and one by contrapositive: the witness of the direct direction, naming the contrapositive of the other direction, a context, a counterexample to a false biconditional, a verdict, a count. The last item is a full textbook proof.'
      - id: kp3
        name: "Equivalence chains"
        key_prerequisites: [direct-proof]
        try_first:
          problem: 'How many real solutions does $x^2 = 4x$ have?'
          answer_contract: {"kind": "exact"}
          answer: '2'
          reveal: 'Dividing both sides by $x$ gives $x = 4$ and loses the solution $x = 0$. The chain $x^2 - 4x = 0 \iff x(x - 4) = 0$ keeps both solutions, because each link can be run backwards.'
        exemplars:
          - problem: 'Squaring both sides of $\sqrt{x + 6} = x$ gives $x + 6 = x^2$, so $(x - 3)(x + 2) = 0$ and $x = 3$ or $x = -2$. Which of the two values is not a solution of the original equation?'
            answer: '-2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Check $x = 3$: $\sqrt{3 + 6} = 3$, so it works. For $x = -2$ we get $\sqrt{4} = 2$, which is not $-2$, so $-2$ is not a solution. Squaring is only an implication, not an equivalence, because $x + 6 = x^2$ also holds when $\sqrt{x + 6} = -x$.'
          - problem: 'Is "$x^2 = 3x$ if and only if $x = 3$" true for every real number $x$?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "it is true", "true", "always"], ["no", "it is not true", "false", "not always", "not true", "it is not"]]}
            solution_sketch: 'If $x = 3$, then $x^2 = 9 = 3x$, so one direction holds. But $x = 0$ gives $0 = 0$, so $x^2 = 3x$ is true while $x = 3$ is false. The other direction fails, so the biconditional is false.'
          - problem: 'Dividing both sides of $(x - 2)(x + 1) = 4(x - 2)$ by $x - 2$ gives $x + 1 = 4$, so $x = 3$. Which solution is lost by the division?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Dividing by $x - 2$ is only allowed when $x - 2 \ne 0$. For $x = 2$ both sides equal $0$, so $x = 2$ is a solution that the division removed. The correct chain is $(x - 2)(x + 1) - 4(x - 2) = 0 \iff (x - 2)(x - 3) = 0$, which gives $x = 2$ or $x = 3$.'
          - problem: 'A rectangular garden is $x$ metres wide and $x + 4$ metres long, and its area is $45$ square metres. Solving $x(x + 4) = 45 \iff x^2 + 4x - 45 = 0 \iff (x + 9)(x - 5) = 0$ gives $x = -9$ or $x = 5$. How wide is the garden?'
            answer: '5'
            answer_contract: {"kind": "unit", "quantity": "length", "unit": "m", "allow_omitted": true}
            solution_sketch: 'Every link is an equivalence, so both $-9$ and $5$ satisfy the equation $x(x + 4) = 45$. A width cannot be negative, so the garden is $5$ m wide. Check: $5 \cdot 9 = 45$.'
          - problem: 'A positive number $x$ plus its reciprocal is $5/2$. Which numbers can $x$ be?'
            answer: '1/2, 2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Since $x \ne 0$, multiplying by $2x$ is reversible: $x + 1/x = 5/2 \iff 2x^2 + 2 = 5x \iff 2x^2 - 5x + 2 = 0 \iff (2x - 1)(x - 2) = 0$. So $x = 1/2$ or $x = 2$, and both are positive. Check: $1/2 + 2 = 5/2$ and $2 + 1/2 = 5/2$.'
          - problem: 'How many real solutions does $\dfrac{x^2 - 1}{x - 1} = 2$ have?'
            answer: '0'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The equation needs $x \ne 1$. For $x \ne 1$ we have $\frac{x^2 - 1}{x - 1} = x + 1$, so the equation says $x + 1 = 2$, that is $x = 1$, which is excluded. Multiplying by $x - 1$ would give $x^2 - 1 = 2(x - 1)$ with solution $x = 1$, but that step cannot be run backwards at $x = 1$. So the equation has no solution, and the count is $0$.'
          - problem: 'Write the full proof that for all positive real numbers $a$ and $b$, $a < b$ if and only if $a^2 < b^2$, using a chain of equivalences.'
            answer: 'a, b > 0: a < b iff a^2 < b^2'
            answer_contract: {"kind": "none"}
            solution_sketch: 'Let $a$ and $b$ be positive real numbers. Then $a + b > 0$. We give a chain of equivalences and justify each link. $a < b$ if and only if $0 < b - a$, because adding $a$ to both sides, or subtracting $a$, can be undone. $0 < b - a$ if and only if $0 < (b - a)(a + b)$: multiplying both sides by the positive number $a + b$ keeps the inequality, and dividing by it restores the inequality. $0 < (b - a)(a + b)$ if and only if $0 < b^2 - a^2$, because $(b - a)(a + b) = b^2 - a^2$ is an identity. Finally $0 < b^2 - a^2$ if and only if $a^2 < b^2$, because adding $a^2$ to both sides can be undone. Every link is an equivalence, and equivalence is transitive. Therefore $a < b$ if and only if $a^2 < b^2$ for all positive real numbers $a$ and $b$. $\square$'
        constraints: 'Equivalence chains: the extraneous or lost solution of a chain with a link that is not reversible, a verdict, contexts with a division, the number of solutions of a rational equation. The last item is a full textbook proof.'
    diagnostic_exemplar:
      problem: 'Prove: an integer $n$ is odd if and only if $n^2 + 2n$ is odd.'
      answer: '($\Rightarrow$) $n$ odd: $n^2$ odd and $2n$ even, so the sum is odd. ($\Leftarrow$) contrapositive: $n$ even makes $n^2 + 2n = n(n+2)$ even.'
      solution_sketch: 'Forward: odd plus even is odd. Backward via contrapositive: $n = 2k$ gives $n^2 + 2n = 4k^2 + 4k = 2(2k^2 + 2k)$, even. $\square$'
    anki_seeds:
      - front: 'To prove "$P$ if and only if $Q$"?'
        back: 'Prove both directions: $P \to Q$ and $Q \to P$ (each may be direct or contrapositive).'
        type: basic
      - front: 'When is a chain of $\Leftrightarrow$ steps a valid iff proof?'
        back: 'When every single step is itself an equivalence (reversible), not just a one-way implication.'
        type: basic

  - id: contradiction-template
    name: "The Contradiction Template"
    core: true
    difficulty: 0.58
    drill: false
    answer_kind: proof
    expected_time_secs: 200
    prerequisites:
      - id: negating-statements
        weight: 0.5
        key: true
      - id: direct-proof
        weight: 0.4
        key: true
    knowledge_points:
      - id: kp1
        name: "Setting up the assumption"
        key_prerequisites: [negating-statements]
        try_first:
          problem: 'A statement says: "Every even integer greater than $2$ is composite." Suppose this statement were false. Would there be an even integer greater than $2$ that is prime?'
          answer_contract: {"kind": "label", "options": [["yes", "yes it is", "it is", "yes it does", "it does", "yes it can", "correct", "true"], ["no", "no it is not", "it is not", "no it does not", "it does not", "no it cannot", "incorrect", "false"]]}
          answer: 'yes'
          reveal: 'Yes: one object that breaks a "for every" claim is enough to make it false. So a proof by contradiction of such a claim starts by assuming that one such object exists.'
        exemplars:
          - problem: 'To prove "for every real number $x$, $x^2 \ge 0$" by contradiction, is it correct to begin with "Suppose there is a real number $x$ with $x^2 < 0$"?'
            answer: 'yes'
            answer_contract: {"kind": "label", "options": [["yes", "yes it is", "it is", "yes it does", "it does", "yes it can", "correct", "true"], ["no", "no it is not", "it is not", "no it does not", "it does not", "no it cannot", "incorrect", "false"]]}
            solution_sketch: 'The negation of "for every $x$, $x^2 \ge 0$" is "there is an $x$ with $x^2 < 0$". A proof by contradiction assumes exactly this negation, so the opening is correct.'
          - problem: 'A box holds ten cards numbered $1$ to $10$. The cards $2, 4, 5, 6, 8$ have a red back and the other five cards have a blue back. The statement "Every card with an even number has a red back" is false. Its negation says that some card has an even number and a blue back. Which card is that?'
            answer: '10'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The even cards are $2, 4, 6, 8, 10$ and the blue cards are $1, 3, 7, 9, 10$. Only card $10$ is both even and blue, so card $10$ is the card that the negation describes.'
          - problem: 'You prove by contradiction that for every integer $n$, if $3 \mid n^2$ then $3 \mid n$. The assumption is that some integer $n$ has $3 \mid n^2$ and $3 \nmid n$. You sort this $n$ by its remainder on division by $3$. How many cases do you need?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'An integer that is not divisible by $3$ leaves remainder $1$ or remainder $2$. So the assumption splits into exactly $2$ cases, and each case must reach a contradiction.'
          - problem: 'In the proof of the previous kind, take the case $n = 3k + 2$ for an integer $k$. What remainder does $n^2$ leave on division by $3$?'
            answer: '1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'We expand $n^2 = 9k^2 + 12k + 4 = 3(3k^2 + 4k + 1) + 1$. So $n^2$ leaves remainder $1$ on division by $3$, which contradicts $3 \mid n^2$.'
          - problem: 'To prove by contradiction that no integer $k$ satisfies $5k = 12$, begin with: "Suppose $k$ is an integer with $5k = 12$." What value would $k$ then have?'
            answer: '12/5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Dividing both sides of $5k = 12$ by $5$ gives $k = 12/5$. This number is not an integer, so the assumption leads to a contradiction.'
          - problem: 'To prove "for every integer $n$, if $n^2$ is even then $n$ is even" by contradiction, a proof begins: "Suppose $n^2$ is even or $n$ is odd." Is this the correct assumption?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "yes it is", "it is", "yes it does", "it does", "yes it can", "correct", "true"], ["no", "no it is not", "it is not", "no it does not", "it does not", "no it cannot", "incorrect", "false"]]}
            solution_sketch: 'The negation of "if $P$ then $Q$" is "$P$ and not $Q$". The correct assumption is that $n^2$ is even and $n$ is odd, so the "or" is wrong.'
          - problem: 'Write the full proof that for all integers $a$ and $b$, $a^2 - 4b \neq 2$.'
            answer: 'a^2 - 4b != 2 for all integers'
            answer_contract: {"kind": "none"}
            solution_sketch: 'Suppose, for contradiction, that there are integers $a$ and $b$ with $a^2 - 4b = 2$. Then $a^2 = 4b + 2 = 2(2b + 1)$, so $a^2$ is even. If $a$ were odd, say $a = 2m + 1$ for an integer $m$, then $a^2 = 4m^2 + 4m + 1 = 2(2m^2 + 2m) + 1$ would be odd. So $a$ is even, and $a = 2c$ for some integer $c$. Substituting gives $4c^2 = 4b + 2$, and dividing by $2$ gives $2c^2 = 2b + 1$. The left side $2c^2$ is even, while the right side $2b + 1$ is odd, and no integer is both even and odd. This contradicts the assumption. Therefore $a^2 - 4b \neq 2$ for all integers $a$ and $b$.'
        constraints: "produce the correctly negated assumption before any deduction"
      - id: kp2
        name: "No-largest and no-smallest arguments"
        key_prerequisites: [direct-proof]
        exemplars:
          - problem: 'Which even integer, built from $98$ by adding $2$, shows that $98$ is not the largest even integer?'
            answer: '100'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'If $98$ were the largest even integer, then $98 + 2 = 100$ would be an even integer larger than $98$. This is a contradiction, so $98$ is not the largest even integer.'
          - problem: 'Does the set of positive real numbers have a smallest element?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "yes it is", "it is", "yes it does", "it does", "yes it can", "correct", "true"], ["no", "no it is not", "it is not", "no it does not", "it does not", "no it cannot", "incorrect", "false"]]}
            solution_sketch: 'Suppose $s$ were the smallest positive real number. Then $s/2$ is a positive real number smaller than $s$, a contradiction. So the set has no smallest element.'
          - problem: 'A piece of string $0.3$ m long is cut into a new piece that is half as long. How long is the new piece?'
            answer: '0.15'
            answer_contract: {"kind": "unit", "quantity": "length", "unit": "m", "allow_omitted": true}
            solution_sketch: 'Half of $0.3$ m is $0.3 / 2 = 0.15$ m. This piece has positive length and is shorter than $0.3$ m, so $0.3$ m is not the shortest positive length.'
          - problem: 'Which positive real number, half as large as $\frac{1}{8}$, shows that $\frac{1}{8}$ is not the smallest positive real number?'
            answer: '1/16'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Half of $\frac{1}{8}$ is $\frac{1}{16}$. The number $\frac{1}{16}$ is positive and smaller than $\frac{1}{8}$, so $\frac{1}{8}$ is not the smallest.'
          - problem: 'The argument "If $m$ were the smallest positive integer, then $m/2$ would be a smaller positive integer" is meant to show that there is no smallest positive integer. What is the smallest positive integer $m$ for which $m/2$ is not an integer?'
            answer: '1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'For $m = 1$ the number $m/2 = 1/2$ is not an integer, so the construction fails at once. In fact $1$ is the smallest positive integer, so there is a smallest positive integer.'
          - problem: 'A measuring cup holds $6$ ml. A new cup holds one third as much as the old one. How much water does it hold?'
            answer: '2'
            answer_contract: {"kind": "unit", "quantity": "volume", "unit": "ml", "allow_omitted": true}
            solution_sketch: 'One third of $6$ ml is $6 / 3 = 2$ ml. This is a positive amount smaller than $6$ ml, so $6$ ml is not the smallest positive amount that can be measured.'
          - problem: 'Write the full proof that there is no smallest positive real number.'
            answer: 'No smallest positive real exists'
            answer_contract: {"kind": "none"}
            solution_sketch: 'Suppose, for contradiction, that there is a smallest positive real number, and call it $s$. Then $s > 0$. Consider the real number $t = s/2$. Since $s > 0$, we have $t = s/2 > 0$, so $t$ is a positive real number. Also $s - t = s/2 > 0$, so $t < s$. Thus $t$ is a positive real number smaller than $s$, which contradicts the choice of $s$ as the smallest positive real number. Therefore there is no smallest positive real number.'
        constraints: "assume the negation and construct a witness that beats the assumed extremum. Items are computed steps of the method, verdict labels with balanced keys, and one written proof. The stem must not state the decisive result or the direction of a verdict."
      - id: kp3
        name: "Simple impossibility arguments"
        key_prerequisites: [direct-proof]
        exemplars:
          - problem: 'No integers $m$ and $n$ satisfy $6m + 10n = 21$. What is the largest positive integer that divides $6m + 10n$ for all integers $m$ and $n$?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'We have $6m + 10n = 2(3m + 5n)$, so $2$ always divides the left side. No larger integer works for all $m$ and $n$, because $m = 1$, $n = 0$ gives $6$ and $m = 0$, $n = 1$ gives $10$, and $\gcd(6, 10) = 2$.'
          - problem: 'A bakery sells rolls only in bags of $6$ and bags of $10$. Can a customer buy exactly $35$ rolls?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "yes it is", "it is", "yes it does", "it does", "yes it can", "correct", "true"], ["no", "no it is not", "it is not", "no it does not", "it does not", "no it cannot", "incorrect", "false"]]}
            solution_sketch: 'Suppose $6m + 10n = 35$ for non-negative integers $m$ and $n$. The left side equals $2(3m + 5n)$, which is even, but $35$ is odd. This is a contradiction, so the customer cannot buy exactly $35$ rolls.'
          - problem: 'At a party of $7$ people, suppose that each person shakes hands with exactly $3$ others, and let $h$ be the number of handshakes. Adding up the handshakes of all $7$ people counts every handshake twice. What value would $h$ then have?'
            answer: '21/2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The sum of the handshake counts is $7 \cdot 3 = 21$, and it equals $2h$. So $h = 21/2 = 10.5$. This is not a whole number, so the situation is impossible.'
          - problem: 'Suppose that $s$ is an irrational number and that $\frac{3}{4} + s = \frac{5}{2}$. What value would $s$ then have?'
            answer: '7/4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The equation gives $s = \frac{5}{2} - \frac{3}{4} = \frac{10}{4} - \frac{3}{4} = \frac{7}{4}$. This is rational, which contradicts the assumption that $s$ is irrational. So a sum of a rational number and an irrational number cannot be rational.'
          - problem: 'A proof by contradiction that $6m + 10n = 8$ has no integer solutions cannot be finished, because the equation does have integer solutions. Find $n$ when $m = 3$.'
            answer: '-1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'With $m = 3$ the equation becomes $18 + 10n = 8$, so $10n = -10$ and $n = -1$. The pair $m = 3$, $n = -1$ is a solution, so no contradiction can exist.'
          - problem: 'Does the equation $9m + 12n = 105$ have a solution in integers $m$ and $n$?'
            answer: 'yes'
            answer_contract: {"kind": "label", "options": [["yes", "yes it is", "it is", "yes it does", "it does", "yes it can", "correct", "true"], ["no", "no it is not", "it is not", "no it does not", "it does not", "no it cannot", "incorrect", "false"]]}
            solution_sketch: 'Dividing by $3$ gives $3m + 4n = 35$, and $m = 1$, $n = 8$ satisfies it because $3 + 32 = 35$. Check in the original equation: $9 + 96 = 105$. So a solution exists, and a proof by contradiction cannot work.'
          - problem: 'Write the full proof that if $r$ is a rational number and $s$ is an irrational number, then $r + s$ is irrational.'
            answer: 'rational + irrational is irrational'
            answer_contract: {"kind": "none"}
            solution_sketch: 'Suppose, for contradiction, that $r$ is rational, $s$ is irrational, and $r + s$ is rational. Write $r = a/b$ and $r + s = c/d$ with integers $a, b, c, d$ and $b \neq 0$, $d \neq 0$. Then $s = (r + s) - r = \frac{c}{d} - \frac{a}{b} = \frac{cb - ad}{bd}$. The numerator $cb - ad$ is an integer, and the denominator $bd$ is a nonzero integer. So $s$ is a quotient of two integers with nonzero denominator, which means that $s$ is rational. This contradicts the assumption that $s$ is irrational. Therefore $r + s$ is irrational.'
        constraints: "reach an explicit contradiction (odd = even, rational = irrational, etc.) and say what it contradicts. Items are computed steps of the method, verdict labels with balanced keys, and one written proof. The stem must not state the decisive result or the direction of a verdict."
    diagnostic_exemplar:
      problem: 'Prove by contradiction: there is no smallest integer.'
      answer: 'Assume a smallest integer $m$; then $m - 1 < m$ is a smaller integer, a contradiction.'
      solution_sketch: 'Suppose $m$ were the smallest integer. Then $m - 1$ is an integer smaller than $m$, contradicting minimality. Hence no smallest integer exists. $\square$'
    anki_seeds:
      - front: 'Structure of a proof by contradiction of a statement $S$?'
        back: 'Assume $\neg S$, derive a contradiction (a false statement), and conclude that $S$ must hold.'
        type: basic
      - front: 'First step of a contradiction proof of $\forall x\,(P(x) \to Q(x))$?'
        back: 'Assume the negation: some $x$ has $P(x)$ true and $Q(x)$ false.'
        type: basic

  - id: proof-by-contradiction
    name: "Proof by Contradiction"
    core: true
    difficulty: 0.62
    drill: false
    answer_kind: proof
    expected_time_secs: 220
    prerequisites:
      - id: contradiction-template
        weight: 0.6
        key: true
      - id: rational-number-proofs
        weight: 0.3
      - id: proof-by-contrapositive
        weight: 0.3
      - id: negating-statements
        weight: 0.2
      - id: prime-composite-numbers
        weight: 0.2
        key: false
    knowledge_points:
      - id: kp1
        name: "Parity and divisibility contradictions"
        key_prerequisites: [contradiction-template]
        exemplars:
          - problem: 'How many different remainders can the square of an integer leave on division by $8$?'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'An even integer $2k$ has square $4k^2$, which leaves remainder $0$ or $4$. An odd integer has square $4k(k+1) + 1$, which leaves remainder $1$. So the remainders are $0, 1, 4$, which makes $3$ different values.'
          - problem: 'Are there integers $a$ and $b$ with $a^2 - 8b = 3$?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "yes it is", "it is", "yes it does", "it does", "yes it can", "correct", "true"], ["no", "no it is not", "it is not", "no it does not", "it does not", "no it cannot", "incorrect", "false"]]}
            solution_sketch: 'The equation says $a^2 \equiv 3 \pmod 8$. Squares leave remainder $0$, $1$ or $4$ on division by $8$, never $3$. So no such integers exist.'
          - problem: 'A school wants to seat $1234$ chairs in a square formation with the same number of rows and columns. If $n^2 = 1234$ for an integer $n$, what remainder does $1234$ leave on division by $4$?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'We have $1234 = 4 \cdot 308 + 2$, so the remainder is $2$. A square leaves remainder $0$ or $1$ on division by $4$, so $1234$ is not a square and the formation is impossible.'
          - problem: 'A farm sells apples in crates of $12$ and crates of $18$. A buyer asks for exactly $100$ apples, which would mean $12a + 18b = 100$ for non-negative integers $a$ and $b$. Dividing this equation by $6$ gives $2a + 3b = c$. What is $c$?'
            answer: '50/3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Dividing by $6$ gives $2a + 3b = 100/6 = 50/3$. The left side is an integer, while $50/3$ is not an integer. This contradiction shows that the order cannot be filled.'
          - problem: 'Suppose that $a^2 + b^2 = 4c + 3$ for integers $a$, $b$ and $c$, with $a$ odd and $b$ even. What remainder does $a^2 + b^2$ leave on division by $4$?'
            answer: '1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'An odd $a$ has $a^2 \equiv 1 \pmod 4$ and an even $b$ has $b^2 \equiv 0 \pmod 4$. So $a^2 + b^2 \equiv 1 \pmod 4$. But $4c + 3$ leaves remainder $3$, so this is a contradiction.'
          - problem: 'Does the equation $6x + 9y = 12$ have a solution in integers $x$ and $y$?'
            answer: 'yes'
            answer_contract: {"kind": "label", "options": [["yes", "yes it is", "it is", "yes it does", "it does", "yes it can", "correct", "true"], ["no", "no it is not", "it is not", "no it does not", "it does not", "no it cannot", "incorrect", "false"]]}
            solution_sketch: 'We can take $x = 2$ and $y = 0$, since $6 \cdot 2 + 9 \cdot 0 = 12$. The left side is always a multiple of $3$, and $12$ is a multiple of $3$, so there is no clash and no contradiction.'
          - problem: 'Write the full proof that for all integers $a$, $b$ and $c$, if $a^2 + b^2 = c^2$, then $a$ is even or $b$ is even.'
            answer: 'a^2 + b^2 = c^2 => a or b even'
            answer_contract: {"kind": "none"}
            solution_sketch: 'Suppose, for contradiction, that $a^2 + b^2 = c^2$ for integers $a, b, c$, and that $a$ and $b$ are both odd. Write $a = 2m + 1$ and $b = 2n + 1$ with integers $m$ and $n$. Then $a^2 + b^2 = 4m^2 + 4m + 1 + 4n^2 + 4n + 1 = 4(m^2 + m + n^2 + n) + 2$, so $a^2 + b^2$ leaves remainder $2$ on division by $4$. Now look at $c$. If $c = 2k$ is even, then $c^2 = 4k^2$ leaves remainder $0$. If $c = 2k + 1$ is odd, then $c^2 = 4(k^2 + k) + 1$ leaves remainder $1$. So $c^2$ never leaves remainder $2$ on division by $4$. But $c^2 = a^2 + b^2$ leaves remainder $2$. This is a contradiction. Hence $a$ is even or $b$ is even.'
        constraints: "derive a divisibility or residue clash from the assumed solution. Items are computed steps of the method, verdict labels with balanced keys, and one written proof. The stem must not state the decisive result or the direction of a verdict."
      - id: kp2
        name: "Irrationality proofs"
        key_prerequisites: [rational-number-proofs]
        try_first:
          problem: 'Write the fraction $\frac{6}{8}$ in lowest terms. What is its denominator?'
          answer_contract: {"kind": "exact"}
          answer: '4'
          reveal: 'The denominator is $4$, because $\frac{6}{8} = \frac{3}{4}$ and $3$ and $4$ share no factor. Every fraction can be reduced like this, which is why the proof may assume that $\gcd(p, q) = 1$.'
        exemplars:
          - problem: 'Suppose $\sqrt{7} = p/q$ for integers $p$ and $q$ with $q \neq 0$. Squaring and clearing the denominator gives $p^2 = c\,q^2$. What is $c$?'
            answer: '7'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Squaring gives $7 = p^2/q^2$, and multiplying by $q^2$ gives $p^2 = 7q^2$. So $c = 7$.'
          - problem: 'Suppose $\sqrt{10} = p/q$ in lowest terms, so $p^2 = 10q^2$. Then $10$ divides $p$, and we write $p = 10k$. Substituting gives $q^2 = c\,k^2$. What is $c$?'
            answer: '10'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Substituting $p = 10k$ gives $100k^2 = 10q^2$, so $q^2 = 10k^2$. Hence $c = 10$, and $10$ divides $q^2$.'
          - problem: 'Is the number $\sqrt{16}$ irrational?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "yes it is", "it is", "yes it does", "it does", "yes it can", "correct", "true"], ["no", "no it is not", "it is not", "no it does not", "it does not", "no it cannot", "incorrect", "false"]]}
            solution_sketch: 'We have $\sqrt{16} = 4 = 4/1$, which is a quotient of two integers. So $\sqrt{16}$ is rational. The argument for irrationality fails because $16$ is a perfect square.'
          - problem: 'A square floor has an area of $3$ m$^2$. Suppose that its side length is $p/q$ metres, with $p$ and $q$ positive integers. Then $p^2$ is how many times as large as $q^2$?'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The area is $(p/q)^2 = 3$, so $p^2 = 3q^2$. Hence $p^2$ is $3$ times as large as $q^2$.'
          - problem: 'A square has sides of length $1$ m. Suppose that its diagonal has length $p/q$ metres in lowest terms. By the theorem of Pythagoras, $p^2 = c\,q^2$. What is $c$?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The diagonal $d$ satisfies $d^2 = 1^2 + 1^2 = 2$. So $(p/q)^2 = 2$ and $p^2 = 2q^2$, which gives $c = 2$.'
          - problem: 'The proof for $\sqrt{3}$ is copied to prove that $\sqrt{9}$ is irrational. From $p^2 = 9q^2$ it writes $p = 3k$ and gets $9k^2 = 9q^2$. Dividing by $9$ gives $q^2 = c\,k^2$. What is $c$?'
            answer: '1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Dividing $9k^2 = 9q^2$ by $9$ gives $q^2 = k^2$, so $c = 1$. No contradiction follows, and indeed $\sqrt{9} = 3$ is rational.'
          - problem: 'What is the smallest positive integer $p$ for which $p^2$ is divisible by $12$?'
            answer: '6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'We need $4 \mid p^2$ and $3 \mid p^2$. The second condition forces $3 \mid p$ and the first forces $2 \mid p$, so $6 \mid p$. The smallest choice is $p = 6$, and $6^2 = 36 = 3 \cdot 12$.'
          - problem: 'Write the full proof that $\sqrt[3]{2}$ is irrational.'
            answer: 'cube root of 2 is irrational'
            answer_contract: {"kind": "none"}
            solution_sketch: 'Suppose, for contradiction, that $\sqrt[3]{2}$ is rational. Then $\sqrt[3]{2} = p/q$ for integers $p$ and $q$ with $q \neq 0$, and we may choose $p/q$ in lowest terms, so $\gcd(p, q) = 1$. Cubing both sides gives $2 = p^3/q^3$, so $p^3 = 2q^3$. Thus $p^3$ is even. If $p$ were odd, say $p = 2m + 1$, then $p^3 = 8m^3 + 12m^2 + 6m + 1 = 2(4m^3 + 6m^2 + 3m) + 1$ would be odd. So $p$ is even, and $p = 2k$ for an integer $k$. Then $8k^3 = 2q^3$, so $q^3 = 4k^3 = 2(2k^3)$, and $q^3$ is even. If $q$ were odd, say $q = 2j + 1$, then $q^3 = 2(4j^3 + 6j^2 + 3j) + 1$ would be odd, so $q$ is even. Now $2$ divides both $p$ and $q$, which contradicts $\gcd(p, q) = 1$. Therefore $\sqrt[3]{2}$ is irrational.'
        constraints: "use a lowest-terms assumption to force a contradiction. Items are computed steps of the method, verdict labels with balanced keys, and one written proof. The stem must not state the decisive result or the direction of a verdict."
      - id: kp3
        name: "Nonexistence and infinitude arguments"
        key_prerequisites: [negating-statements]
        exemplars:
          - problem: 'The primes $2, 3, 5$ are multiplied and $1$ is added. What number is obtained?'
            answer: '31'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'We have $2 \cdot 3 \cdot 5 + 1 = 30 + 1 = 31$. The number $31$ leaves remainder $1$ on division by each of $2$, $3$ and $5$, so a prime factor of $31$ is outside the list.'
          - problem: 'What is the smallest prime factor of $2 \cdot 3 \cdot 5 \cdot 7 \cdot 11 \cdot 13 + 1 = 30031$?'
            answer: '59'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'We find $30031 = 59 \cdot 509$, and no smaller prime divides it. So $30031$ is not prime. Euclid''s argument only needs a prime factor outside the list, and $59$ is one.'
          - problem: 'Is the number $2 \cdot 3 \cdot 5 \cdot 7 + 1$ prime?'
            answer: 'yes'
            answer_contract: {"kind": "label", "options": [["yes", "yes it is", "it is", "yes it does", "it does", "yes it can", "correct", "true"], ["no", "no it is not", "it is not", "no it does not", "it does not", "no it cannot", "incorrect", "false"]]}
            solution_sketch: 'The number is $211$. It has no prime divisor up to $\sqrt{211} < 15$, because $211$ is not divisible by $2, 3, 5, 7, 11$ or $13$. So $211$ is prime.'
          - problem: 'Suppose that positive integers $p$ and $q$ satisfy $2^p = 3^q$. What remainder does $3^q$ leave on division by $2$?'
            answer: '1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Every power of $3$ is odd, so $3^q$ leaves remainder $1$ on division by $2$. But $2^p$ is even and leaves remainder $0$, so the equation is impossible.'
          - problem: 'Which positive rational number, half as large as $\frac{1}{100}$, shows that $\frac{1}{100}$ is not the smallest positive rational number?'
            answer: '1/200'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Half of $\frac{1}{100}$ is $\frac{1}{200}$. This is a ratio of integers, it is positive, and it is smaller than $\frac{1}{100}$. So $\frac{1}{100}$ is not the smallest.'
          - problem: 'Let $N = 2 \cdot 3 \cdot 5 \cdot 7 + 1 = 211$. How many of the four primes $2, 3, 5, 7$ divide $211$?'
            answer: '0'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The number $211$ leaves remainder $1$ on division by each of $2, 3, 5, 7$. So none of them divides it, and the count is $0$. A prime divisor of $211$ is therefore outside the list.'
          - problem: 'Write the full proof that there are infinitely many prime numbers.'
            answer: 'There are infinitely many primes'
            answer_contract: {"kind": "none"}
            solution_sketch: 'Suppose, for contradiction, that there are only finitely many primes, and list all of them as $p_1, p_2, \dots, p_k$. This list is not empty, since $2$ is prime. Let $N = p_1 p_2 \cdots p_k + 1$. Then $N > 1$, so $N$ has a prime divisor $q$, because every integer greater than $1$ has a prime divisor. Since $p_1, \dots, p_k$ are all the primes, $q = p_i$ for some $i$. Then $q$ divides $p_1 p_2 \cdots p_k$, and $q$ divides $N$, so $q$ divides the difference $N - p_1 p_2 \cdots p_k = 1$. But a prime is at least $2$ and cannot divide $1$. This is a contradiction. Hence there are infinitely many primes.'
        constraints: "construct an object that contradicts the finiteness/nonexistence assumption. Items are computed steps of the method, verdict labels with balanced keys, and one written proof. The stem must not state the decisive result or the direction of a verdict."
    diagnostic_exemplar:
      problem: 'Prove by contradiction that $\sqrt{6}$ is irrational.'
      answer: 'Suppose $\sqrt6$ were rational, say $\sqrt6 = p/q$ with $p, q$ integers, $q \ne 0$, and the fraction in lowest terms, so $\gcd(p, q) = 1$. Squaring gives $p^2 = 6q^2$, so $p^2$ is even; an odd $p$ would have odd square, so $p$ is even, say $p = 2k$. Substituting, $4k^2 = 6q^2$, i.e. $2k^2 = 3q^2$. The left side is even, so $3q^2$ is even, and since $3$ is odd this forces $q^2$ even and hence $q$ even. But then $2$ divides both $p$ and $q$, contradicting $\gcd(p,q) = 1$. Therefore $\sqrt6$ is irrational.'
      solution_sketch: 'Assume a lowest-terms representation, square it, and derive that numerator and denominator are both even — the contradiction with lowest terms.'
    anki_seeds:
      - front: 'Key idea in proving $\sqrt{2}$ irrational by contradiction?'
        back: 'Assume $\sqrt 2 = p/q$ in lowest terms; derive that $p$ and $q$ are both even, contradicting lowest terms.'
        type: basic
      - front: 'Key idea in Euclid''s proof that there are infinitely many primes?'
        back: 'If $p_1, \dots, p_k$ were all the primes, $p_1 \cdots p_k + 1$ would need a prime factor not in the list.'
        type: basic

  - id: existence-proofs
    name: "Existence Proofs"
    core: true
    difficulty: 0.60
    drill: false
    answer_kind: proof
    expected_time_secs: 200
    prerequisites:
      - id: direct-proof
        weight: 0.4
        key: true
      - id: proof-by-contradiction
        weight: 0.4
        key: true
      - id: quantifiers
        weight: 0.2
      - id: factorial-notation
        weight: 0.2
        key: false
    knowledge_points:
      - id: kp1
        name: "Constructive proofs by exhibiting a witness"
        key_prerequisites: [direct-proof]
        exemplars:
          - problem: 'A post office has only $4$-cent stamps and $7$-cent stamps. How many $7$-cent stamps are needed to make exactly $31$ cents?'
            answer: '1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'We need $7a + 4b = 31$ with non-negative integers. The choice $a = 1$ gives $4b = 24$ and $b = 6$. The choice $a = 0$ gives $4b = 31$, and $a \ge 5$ is too large, so the other values $a = 2, 3, 4$ leave $17, 10, 3$ which are not multiples of $4$. So exactly $1$ stamp of $7$ cents is needed.'
          - problem: 'Find integers $x$ and $y$ with $3x + 5y = 1$ and $0 < x < 5$.'
            answer: '(2, -1)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'Try $x = 1, 2, 3, 4$. Then $5y = 1 - 3x$ equals $-2, -5, -8, -11$, and only $-5$ is a multiple of $5$, for $x = 2$ and $y = -1$. Check: $3 \cdot 2 + 5 \cdot (-1) = 6 - 5 = 1$.'
          - problem: 'Find the smallest positive integer $n$ with $n^2 > 10n + 1$.'
            answer: '11'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'For $n = 10$ we get $100 > 101$, which is false, and for smaller $n$ the left side is even smaller compared with the right side. For $n = 11$ we get $121 > 111$, which is true. So $n = 11$ is the smallest witness.'
          - problem: 'Find a positive integer $n$ such that $2n^2 + 29$ is not prime.'
            answer: '29'
            answer_contract: {"kind": "property", "check": "prime_counterexample", "args": {"expr": "2*n^2 + 29", "min": 1}}
            solution_sketch: 'Take $n = 29$. Then $2 \cdot 29^2 + 29 = 29(2 \cdot 29 + 1) = 29 \cdot 59 = 1711$. This is a product of two integers greater than $1$, so it is not prime.'
          - problem: 'A rectangle with integer side lengths has area $91$ and perimeter $40$. What is the length of its shorter side?'
            answer: '7'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The two side lengths $a$ and $b$ satisfy $a + b = 20$ and $ab = 91$. The pair $7$ and $13$ works, because $7 + 13 = 20$ and $7 \cdot 13 = 91$. So the shorter side is $7$.'
          - problem: 'Find a rational number between $\frac{1}{3}$ and $\frac{1}{2}$.'
            answer: '2/5'
            answer_contract: {"kind": "property", "check": "between", "args": {"low": "1/3", "high": "1/2"}}
            solution_sketch: 'The number $\frac{2}{5} = 0.4$ is larger than $\frac{1}{3} = 0.333\ldots$ and smaller than $\frac{1}{2} = 0.5$. One such number is enough to prove that a rational number between them exists.'
          - problem: 'Write the full proof that there is a positive integer $n$ such that $n^2 + n + 41$ is not prime.'
            answer: 'n = 41 gives a composite number'
            answer_contract: {"kind": "none"}
            solution_sketch: 'We must exhibit one such integer, so we choose $n = 41$. Then $n^2 + n + 41 = 41^2 + 41 + 41 = 41(41 + 1 + 1) = 41 \cdot 43 = 1763$. The number $1763$ is a product of the two integers $41$ and $43$, and both are greater than $1$ and smaller than $1763$. So $1763$ has a divisor other than $1$ and itself, and it is not prime. Hence $n = 41$ is a positive integer for which $n^2 + n + 41$ is not prime.'
        constraints: "name an explicit witness and verify it satisfies the property"
      - id: kp2
        name: "Constructive families"
        key_prerequisites: [direct-proof]
        exemplars:
          - problem: 'The numbers $(n+1)! + 2, (n+1)! + 3, \dots, (n+1)! + (n+1)$ are consecutive and composite. For $n = 4$, what is the smallest of them?'
            answer: '122'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'For $n = 4$ we have $(n+1)! = 5! = 120$. The smallest number is $5! + 2 = 122$, and the list is $122, 123, 124, 125$. They are divisible by $2, 3, 4, 5$ in this order, so all four are composite.'
          - problem: 'For $n = 6$ the number $7! + 5 = 5045$ is composite. Which integer between $2$ and $7$ divides it?'
            answer: '5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The number $5$ divides $7!$ and also divides $5$, so it divides $7! + 5$. Indeed $5045 = 5 \cdot 1009$. No other integer between $2$ and $7$ divides $5045$.'
          - problem: 'A prime-hunting program prints the prime $89$ and then the next prime $97$. How many composite numbers lie between them?'
            answer: '7'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The numbers $90, 91, \dots, 96$ lie between $89$ and $97$, and none of them is prime. There are $96 - 90 + 1 = 7$ of them.'
          - problem: 'For $n = 6$ the numbers $n^2 + 1, n^2 + 2, \dots, n^2 + n$ are consecutive and none is a perfect square. What is the largest of them?'
            answer: '42'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'We have $n^2 + n = 36 + 6 = 42$. This number lies between $6^2 = 36$ and $7^2 = 49$, so it is not a perfect square.'
          - problem: 'Are the numbers $5! + 2, 5! + 3, 5! + 4, 5! + 5$ all composite?'
            answer: 'yes'
            answer_contract: {"kind": "label", "options": [["yes", "yes it is", "it is", "yes it does", "it does", "yes it can", "correct", "true"], ["no", "no it is not", "it is not", "no it does not", "it does not", "no it cannot", "incorrect", "false"]]}
            solution_sketch: 'We have $5! = 120$, so the numbers are $122, 123, 124, 125$. They are divisible by $2, 3, 4, 5$ respectively, so each is composite.'
          - problem: 'What is the smallest $n \ge 2$ for which $n! + 1$ is not prime?'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'We have $2! + 1 = 3$ and $3! + 1 = 7$, which are prime. But $4! + 1 = 25 = 5 \cdot 5$ is not prime. So the smallest $n$ with a failure is $4$.'
          - problem: 'The numbers $11! + 2, 11! + 3, \dots, 11! + 11$ form a run of $10$ consecutive composite numbers. What is the largest number in the run? (Use $11! = 39916800$.)'
            answer: '39916811'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The last number is $11! + 11 = 39916800 + 11 = 39916811$. It is divisible by $11$, because $11$ divides both $11!$ and $11$, and it is larger than $11$, so it is composite.'
          - problem: 'Write the full proof that for every positive integer $n$ there exist $n$ consecutive composite positive integers.'
            answer: 'n consecutive composites exist'
            answer_contract: {"kind": "none"}
            solution_sketch: 'Fix a positive integer $n$ and consider the $n$ integers $(n+1)! + 2, (n+1)! + 3, \dots, (n+1)! + (n+1)$. They are consecutive, since each one is $1$ larger than the one before. Let $k$ be an integer with $2 \le k \le n + 1$. Then $k$ divides $(n+1)!$, because $k$ is one of the factors of $(n+1)!$, and $k$ divides $k$. So $k$ divides $(n+1)! + k$. Also $(n+1)! + k > k \ge 2$, so $(n+1)! + k$ has the divisor $k$ with $1 < k < (n+1)! + k$. Hence $(n+1)! + k$ is composite. This holds for each $k$ from $2$ to $n + 1$, so the $n$ consecutive integers are all composite.'
        constraints: "the construction must come with a verification that it works for every parameter value. Items are computed steps of the method, verdict labels with balanced keys, and one written proof. The stem must not state the decisive result or the direction of a verdict."
      - id: kp3
        name: "Nonconstructive existence"
        key_prerequisites: [proof-by-contradiction]
        try_first:
          problem: 'Is it certain that among any $13$ people, two were born in the same calendar month?'
          answer_contract: {"kind": "label", "options": [["yes", "yes it is", "it is", "yes it does", "it does", "yes it can", "correct", "true"], ["no", "no it is not", "it is not", "no it does not", "it does not", "no it cannot", "incorrect", "false"]]}
          answer: 'yes'
          reveal: 'Yes: there are only $12$ months, and $13$ people cannot all have different months. The proof shows that a pair exists without saying which two people it is.'
        exemplars:
          - problem: 'What is the smallest number of integers that you must choose to be sure that two of them have a difference divisible by $7$?'
            answer: '8'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'There are $7$ remainders on division by $7$. With $7$ integers all remainders could differ, for example $1, 2, \dots, 7$. With $8$ integers two share a remainder, so their difference is divisible by $7$. The answer is $8$.'
          - problem: 'A drawer holds socks of $4$ colours. In the dark you take socks out one at a time. How many socks must you take to be sure of two of the same colour?'
            answer: '5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Four socks could all have different colours. The fifth sock must repeat one of the $4$ colours, by the pigeonhole principle. So $5$ socks are enough and $4$ are not.'
          - problem: 'A class has $40$ students. At least how many of them must have their birthday in the same month?'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'If every month had at most $3$ birthdays, there would be at most $12 \cdot 3 = 36$ students. Since there are $40$ students, some month has at least $4$ of them.'
          - problem: 'Let $t = \sqrt{2}^{\sqrt{2}}$. If $t$ is irrational, take $a = t$ and $b = \sqrt{2}$. What is $a^b$?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'We compute $a^b = (\sqrt{2}^{\sqrt{2}})^{\sqrt{2}} = \sqrt{2}^{\sqrt{2} \cdot \sqrt{2}} = \sqrt{2}^{2} = 2$. This is rational, so the pair works in this case.'
          - problem: 'The proof that irrational numbers $a$ and $b$ exist with $a^b$ rational splits into two cases, according to whether $t = \sqrt{2}^{\sqrt{2}}$ is rational. Does the proof tell us which of the two cases actually holds?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "yes it is", "it is", "yes it does", "it does", "yes it can", "correct", "true"], ["no", "no it is not", "it is not", "no it does not", "it does not", "no it cannot", "incorrect", "false"]]}
            solution_sketch: 'The proof only shows that in each case a suitable pair exists. It never decides whether $t$ is rational, so it does not tell us which pair works. This is why the proof is nonconstructive.'
          - problem: 'The integers $1, 2, 3, 4, 5, 6$ have different remainders on division by $7$. What is the smallest positive integer that can be added to them so that no two of the seven integers have a difference divisible by $7$?'
            answer: '7'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The remainder of $7$ on division by $7$ is $0$, and the integers $1, \dots, 6$ have remainders $1, \dots, 6$. So the seven integers $1, \dots, 7$ have seven different remainders and no difference is divisible by $7$. The smaller candidates $1$ to $6$ repeat a remainder, so $7$ is the smallest.'
          - problem: 'Write the full proof that there exist irrational numbers $a$ and $b$ such that $a^b$ is rational. You may use that $\sqrt{2}$ is irrational.'
            answer: 'irrational^irrational can be rational'
            answer_contract: {"kind": "none"}
            solution_sketch: 'Consider the number $t = \sqrt{2}^{\sqrt{2}}$. Either $t$ is rational or $t$ is irrational. Case 1: $t$ is rational. Take $a = b = \sqrt{2}$. Both are irrational, and $a^b = t$ is rational. Case 2: $t$ is irrational. Take $a = t$ and $b = \sqrt{2}$. Both are irrational. Then, by the law $(x^y)^z = x^{yz}$ for positive $x$, $a^b = (\sqrt{2}^{\sqrt{2}})^{\sqrt{2}} = \sqrt{2}^{\sqrt{2} \cdot \sqrt{2}} = \sqrt{2}^{2} = 2$, which is rational. In both cases there exist irrational numbers $a$ and $b$ with $a^b$ rational. The proof does not tell us which case holds.'
        constraints: "the argument may not identify the witness; make the case split or counting explicit. Items are computed steps of the method, verdict labels with balanced keys, and one written proof. The stem must not state the decisive result or the direction of a verdict."
    diagnostic_exemplar:
      problem: 'Prove: among any five integers, there are two whose difference is divisible by $4$.'
      answer: 'Every integer leaves one of the four remainders $0, 1, 2, 3$ on division by $4$. Given five integers, two of them must leave the same remainder, since there are only four remainders available. If $a = 4s + r$ and $b = 4t + r$ share the remainder $r$, then $a - b = 4(s - t)$, so $4 \mid (a - b)$. This proves existence without exhibiting the pair — a nonconstructive existence proof.'
      solution_sketch: 'Classify the integers by remainder mod $4$; with five integers and four classes two must share a class, and equal remainders make the difference a multiple of $4$.'
    anki_seeds:
      - front: 'Constructive vs. nonconstructive existence proof?'
        back: 'Constructive: exhibit and verify an explicit witness. Nonconstructive: show a witness must exist without identifying it.'
        type: basic
      - front: 'What suffices to prove $\exists x\, P(x)$?'
        back: 'One witness $c$ together with a verification that $P(c)$ holds.'
        type: basic

  - id: uniqueness-proofs
    name: "Uniqueness Proofs"
    core: true
    difficulty: 0.62
    drill: false
    answer_kind: proof
    expected_time_secs: 220
    prerequisites:
      - id: existence-proofs
        weight: 0.5
        key: true
      - id: contradiction-template
        weight: 0.3
      - id: direct-proof
        weight: 0.2
    knowledge_points:
      - id: kp1
        name: "The two-solutions template"
        key_prerequisites: [direct-proof]
        exemplars:
          - problem: 'Suppose $u$ and $v$ both solve $4x + 9 = 25$. Subtracting the equation for $v$ from the equation for $u$ gives $4(u - v) = c$. What is $c$?'
            answer: '0'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Subtracting $4v + 9 = 25$ from $4u + 9 = 25$ gives $4u - 4v = 0$, so $c = 0$. Dividing by $4$ gives $u = v$.'
          - problem: 'Does the equation $x^2 = 4$ have exactly one real solution?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "yes it is", "it is", "yes it does", "it does", "yes it can", "correct", "true"], ["no", "no it is not", "it is not", "no it does not", "it does not", "no it cannot", "incorrect", "false"]]}
            solution_sketch: 'Both $x = 2$ and $x = -2$ satisfy $x^2 = 4$. From $u^2 = v^2$ we cannot conclude $u = v$, because $u = -v$ is also possible. So the solution is not unique.'
          - problem: 'A taxi charges a fixed fee of $3$ pounds plus $2$ pounds per kilometre. A ride costs $15$ pounds. How long is the ride in kilometres?'
            answer: '6'
            answer_contract: {"kind": "unit", "quantity": "length", "unit": "km", "allow_omitted": true}
            solution_sketch: 'The distance $d$ satisfies $3 + 2d = 15$, so $2d = 12$ and $d = 6$. If two distances $d$ and $e$ both give $15$ pounds, then $2d = 2e$ and $d = e$, so the distance is unique.'
          - problem: 'A rope is stretched between posts at the $3$ m mark and the $11$ m mark of a fence. Exactly one point on the fence is equally far from both posts. At which mark is it?'
            answer: '7'
            answer_contract: {"kind": "unit", "quantity": "length", "unit": "m", "allow_omitted": true}
            solution_sketch: 'The point $x$ satisfies $x - 3 = 11 - x$, so $2x = 14$ and $x = 7$. Any two such points $x$ and $y$ satisfy $2x = 14 = 2y$, so $x = y$. The mark is $7$ m.'
          - problem: 'The equation $x^2 = x$ has the solution $x = 0$. What is the other real solution?'
            answer: '1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'We have $1^2 = 1$, so $x = 1$ is a second solution. The solution $x = 0$ alone does not show that the solution is unique.'
          - problem: 'The equation $(x - 2)(x^2 + 1) = 0$ has exactly one real solution. What is it?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A product is zero only if a factor is zero. The factor $x^2 + 1$ is at least $1$ for every real $x$, so $x - 2 = 0$ and $x = 2$ is the only real solution.'
          - problem: 'Write the full proof that for all real numbers $a < b$ there is exactly one real number $x$ with $x - a = b - x$.'
            answer: 'a < b has exactly one midpoint x'
            answer_contract: {"kind": "none"}
            solution_sketch: 'Let $a$ and $b$ be real numbers with $a < b$. Existence: put $x = (a + b)/2$. Then $x - a = (a + b)/2 - a = (b - a)/2$ and $b - x = b - (a + b)/2 = (b - a)/2$. So $x - a = b - x$, and a solution exists. Uniqueness: suppose $x$ and $y$ both satisfy the equation, so $x - a = b - x$ and $y - a = b - y$. The first equation gives $2x = a + b$ and the second gives $2y = a + b$. Hence $2x = 2y$, and dividing by $2$ gives $x = y$. So there is exactly one real number $x$ with $x - a = b - x$.'
        constraints: "Distinguish exhibiting one solution from forcing two arbitrary solutions to be equal. Items are computed steps of the method, verdict labels with balanced keys, and one written proof. The stem must not state the decisive result or the direction of a verdict."
      - id: kp2
        name: "Uniqueness in the division algorithm"
        key_prerequisites: [existence-proofs]
        exemplars:
          - problem: 'In the uniqueness proof for division by $7$, the two remainders satisfy $0 \le r < 7$ and $0 \le r'' < 7$. What is the largest possible value of $|r - r''|$?'
            answer: '6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The remainders are integers from $0$ to $6$. The difference is largest for $r = 6$ and $r'' = 0$ (or the reverse), and then $|r - r''| = 6$. This is less than $7$.'
          - problem: 'Let $b$ be a positive integer. Two remainders satisfy $0 \le r < b$ and $0 \le r'' < b$. What is the largest possible value of $|r - r''|$?'
            answer: 'b - 1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The remainders are integers from $0$ to $b - 1$. The difference is largest for $r = b - 1$ and $r'' = 0$ (or the reverse), and then $|r - r''| = b - 1$. This is less than $b$, which is the bound that the uniqueness proof uses.'
          - problem: 'Find integers $q$ and $r$ with $-17 = 5q + r$ and $0 \le r < 5$.'
            answer: '(-4, 3)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'We need $5q \le -17$ with the remainder between $0$ and $4$. The choice $q = -4$ gives $5q = -20$ and $r = -17 + 20 = 3$. Check: $5 \cdot (-4) + 3 = -17$, and $0 \le 3 < 5$.'
          - problem: 'Does $-17 = 5 \cdot (-3) + (-2)$ satisfy the conditions of the division algorithm, with $0 \le r < 5$ for the remainder $r$?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "yes it is", "it is", "yes it does", "it does", "yes it can", "correct", "true"], ["no", "no it is not", "it is not", "no it does not", "it does not", "no it cannot", "incorrect", "false"]]}
            solution_sketch: 'The equation is true, since $-15 - 2 = -17$, but the remainder is $-2$, which is not between $0$ and $4$. So it is not the division-algorithm representation of $-17$ by $5$.'
          - problem: 'A baker packs $100$ rolls into boxes of $7$ and sells only full boxes. How many rolls are left over?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'We have $100 = 7 \cdot 14 + 2$ with $0 \le 2 < 7$. So $14$ boxes are full and $2$ rolls are left over. By uniqueness no other leftover is possible.'
          - problem: 'Suppose $0 \le r < 7$, $0 \le r'' < 7$, and $r - r''$ is a multiple of $7$. What is the only possible value of $r - r''$?'
            answer: '0'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'We have $-7 < r - r'' < 7$. The only multiple of $7$ in this range is $0$, so $r - r'' = 0$.'
          - problem: 'Allow the remainder to satisfy $0 \le r \le 5$ instead of $0 \le r < 5$. Then $10 = 5q + r$ has two representations. One has $q = 2$. What is $q$ in the other?'
            answer: '1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The choice $q = 2$ gives $r = 0$. The choice $q = 1$ gives $r = 5$, and $0 \le 5 \le 5$ is allowed by this rule. So the other representation has $q = 1$, and uniqueness fails.'
          - problem: 'A teacher has $250$ sheets of paper. Each notebook uses $40$ sheets. After making as many full notebooks as possible, how many sheets are left?'
            answer: '10'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'We have $250 = 40 \cdot 6 + 10$ with $0 \le 10 < 40$. So $6$ notebooks are made and $10$ sheets are left over.'
          - problem: 'Write the full proof that if $a$ and $b$ are integers with $b > 0$, and $a = bq + r = bq'' + r''$ with integers $q, q'', r, r''$ satisfying $0 \le r < b$ and $0 \le r'' < b$, then $q = q''$ and $r = r''$.'
            answer: 'division algorithm: q and r are unique'
            answer_contract: {"kind": "none"}
            solution_sketch: 'Subtracting the two expressions for $a$ gives $bq + r = bq'' + r''$, so $r - r'' = b(q'' - q)$. Since $0 \le r < b$ and $0 \le r'' < b$, we have $r - r'' \le r < b$ and $r - r'' \ge -r'' > -b$. So $-b < b(q'' - q) < b$. Dividing by $b > 0$ gives $-1 < q'' - q < 1$. The number $q'' - q$ is an integer, and the only integer strictly between $-1$ and $1$ is $0$. So $q'' = q$. Then $r - r'' = b \cdot 0 = 0$, so $r = r''$. Hence the quotient and the remainder are unique.'
        constraints: "bound a difference to force it to zero, or derive a contradiction from two representations. Items are computed steps of the method, verdict labels with balanced keys, and one written proof. The stem must not state the decisive result or the direction of a verdict."
      - id: kp3
        name: "Existence and uniqueness together"
        key_prerequisites: [existence-proofs]
        try_first:
          problem: 'The equation $x^2 = 9$ has the solution $x = 3$. Is that enough to prove that it has exactly one real solution?'
          answer_contract: {"kind": "label", "options": [["yes", "yes it is", "it is", "yes it does", "it does", "yes it can", "correct", "true"], ["no", "no it is not", "it is not", "no it does not", "it does not", "no it cannot", "incorrect", "false"]]}
          answer: 'no'
          reveal: 'No: finding one solution proves only existence. For uniqueness you must show that any two solutions are equal, and here $x = -3$ is a second solution.'
        exemplars:
          - problem: 'Exactly one real number $x$ satisfies $2x - 5 = x + 7$. What is it?'
            answer: '12'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Subtracting $x$ from both sides gives $x - 5 = 7$, so $x = 12$. Check: $2 \cdot 12 - 5 = 19$ and $12 + 7 = 19$. Two solutions $u$ and $v$ would both equal $12$, so the solution is unique.'
          - problem: 'Does the equation $x^3 = -8$ have exactly one real solution?'
            answer: 'yes'
            answer_contract: {"kind": "label", "options": [["yes", "yes it is", "it is", "yes it does", "it does", "yes it can", "correct", "true"], ["no", "no it is not", "it is not", "no it does not", "it does not", "no it cannot", "incorrect", "false"]]}
            solution_sketch: 'The number $x = -2$ is a solution. If $u^3 = v^3$, then $(u - v)(u^2 + uv + v^2) = 0$, and the second factor is positive unless $u = v = 0$. So $u = v$ and the solution is unique.'
          - problem: 'How many real numbers $x$ satisfy $x^3 - x = 0$?'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'We factor $x^3 - x = x(x - 1)(x + 1)$, which is zero for $x = 0, 1, -1$. So there are $3$ solutions, and there is no unique one.'
          - problem: 'A phone plan costs $10$ pounds per month plus $0.05$ pounds per minute of calls. One bill is $16$ pounds. Exactly one number of minutes gives this bill. What is it?'
            answer: '120'
            answer_contract: {"kind": "unit", "quantity": "time", "unit": "min", "allow_omitted": true}
            solution_sketch: 'The number of minutes $m$ satisfies $10 + 0.05m = 16$, so $0.05m = 6$ and $m = 6 / 0.05 = 120$. Two solutions $m$ and $n$ would satisfy $0.05m = 0.05n$, so $m = n$.'
          - problem: 'The sum of two real numbers is $20$ and their difference is $6$. There is exactly one such pair of numbers. What is the larger number?'
            answer: '13'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Adding the equations $x + y = 20$ and $x - y = 6$ gives $2x = 26$, so $x = 13$ and $y = 7$. The pair is determined by the equations, so it is unique.'
          - problem: 'The equation $x^2 = 2x$ has the solution $x = 0$. What is the other real solution?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'We have $2^2 = 4 = 2 \cdot 2$, so $x = 2$ is a second solution. The solution $x = 0$ alone does not show that the solution is unique.'
          - problem: 'Does the equation $x^2 + 1 = 0$ have exactly one real solution?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "yes it is", "it is", "yes it does", "it does", "yes it can", "correct", "true"], ["no", "no it is not", "it is not", "no it does not", "it does not", "no it cannot", "incorrect", "false"]]}
            solution_sketch: 'We have $x^2 + 1 \ge 1$ for every real $x$, so the equation has no real solution at all. Existence fails, so there is not exactly one solution.'
          - problem: 'Write the full proof that for every real number $x$ with $x \neq 0$ and $x \neq 1$, there is exactly one real number $y$ with $y/x = y - x$.'
            answer: 'y/x = y - x has exactly one solution y'
            answer_contract: {"kind": "none"}
            solution_sketch: 'Let $x$ be a real number with $x \neq 0$ and $x \neq 1$. Existence: put $y = x^2/(x - 1)$, which is defined since $x \neq 1$. Then $y/x = x/(x - 1)$ and $y - x = \frac{x^2 - x(x - 1)}{x - 1} = \frac{x}{x - 1}$. So $y/x = y - x$, and a solution exists. Uniqueness: suppose $y$ is any real number with $y/x = y - x$. Multiplying by $x$ gives $y = xy - x^2$. Then $x^2 = xy - y = y(x - 1)$, and dividing by $x - 1 \neq 0$ gives $y = x^2/(x - 1)$. So every solution equals $x^2/(x - 1)$, and the solution is unique.'
        constraints: "state the $\\exists!$ claim as existence plus uniqueness and prove both parts. Items are computed steps of the method, verdict labels with balanced keys, and one written proof. The stem must not state the decisive result or the direction of a verdict."
    diagnostic_exemplar:
      problem: 'Prove that there is exactly one real number $x$ with $x^3 + x = 10$.'
      answer: 'Existence: $x = 2$ gives $8 + 2 = 10$. Uniqueness: suppose $a^3 + a = b^3 + b$. Then $(a^3 - b^3) + (a - b) = 0$, i.e. $(a-b)(a^2 + ab + b^2 + 1) = 0$. The second factor is positive for all real $a, b$, since $a^2 + ab + b^2 = \left(a + \tfrac{b}{2}\right)^2 + \tfrac{3b^2}{4} \ge 0$, making the factor at least $1$. Hence $a - b = 0$, so $a = b$. Therefore $x = 2$ is the unique solution.'
      solution_sketch: 'Exhibit a solution, then show any two solutions coincide: factor $a^3 + a - (b^3 + b)$ and check that the quadratic factor never vanishes.'
    anki_seeds:
      - front: 'Standard template for proving uniqueness?'
        back: 'Assume $x$ and $y$ both satisfy the property, then show $x = y$.'
        type: basic
      - front: 'What does $\exists!\, x\, P(x)$ require you to prove?'
        back: 'Existence (some $x$ satisfies $P$) and uniqueness (any two satisfying $P$ are equal).'
        type: basic

  - id: common-proof-errors
    name: "Common Proof Errors"
    core: false                # supplemental: proof-hygiene commentary leaf topic
    difficulty: 0.60
    drill: false
    answer_kind: numeric
    expected_time_secs: 150
    prerequisites:
      - id: rules-of-inference
        weight: 0.5
        key: true
      - id: direct-proof
        weight: 0.4
        key: true
    knowledge_points:
      - id: kp1
        name: "Proof by example"
        key_prerequisites: [direct-proof]
        try_first:
          problem: 'The numbers $2^n - 1$ are prime for $n = 2, 3, 5, 7$: the values are $3, 7, 31, 127$. What is the smallest $n \ge 2$ for which $2^n - 1$ is not prime?'
          answer_contract: {"kind": "exact"}
          answer: '4'
          reveal: 'The value $2^4 - 1 = 15 = 3 \cdot 5$ is composite, so one case refutes the claim. No number of successful cases could have proved it.'
        exemplars:
          - problem: 'Consider the claim that $n^2 - n + 11$ is prime for every positive integer $n$. The values $n = 1, 2, 3, 4, 5$ all give primes. What is the smallest positive integer $n$ for which the claim fails?'
            answer: '11'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The next values $n = 6, 7, 8, 9, 10$ give $41, 53, 67, 83, 101$, and all of them are prime. For $n = 11$ we get $11^2 - 11 + 11 = 121 = 11 \cdot 11$, which is composite. So the claim fails first at $n = 11$. A single counterexample refutes a claim about all positive integers.'
          - problem: 'The checks $3 + 5 = 8$, $7 + 9 = 16$ and $11 + 13 = 24$ are followed by the statement that the sum is even for every pair of odd integers. Does this argument prove the claim that the sum of two odd integers is even?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "it does", "it proves the claim", "it does prove it"], ["no", "it does not", "it does not prove", "not a proof"]]}
            solution_sketch: 'Three checks cover three pairs out of infinitely many pairs, so they cannot prove a statement about every pair. A proof must take arbitrary odd integers $2j + 1$ and $2k + 1$ and show that the sum $2(j + k + 1)$ is even. The argument is therefore not a proof, although the claim itself is true.'
          - problem: 'A program creates identification numbers with the formula $n^2 + n + 41$ and is expected to produce a prime for every positive integer $n$. The tests pass for $n = 1, 2, \dots, 39$. For which positive integer $n$ does the first bad number appear?'
            answer: '40'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The tests cover only $n = 1$ to $n = 39$. For $n = 40$ the formula gives $40^2 + 40 + 41 = 1681 = 41 \cdot 41$, which is composite. So the first bad number appears at $n = 40$, and passing tests did not prove the formula.'
          - problem: 'Consider the claim that $n$ points on a circle, joined by all chords, always cut the disc into $2^{n-1}$ regions. For $n = 1, \dots, 5$ the counts are $1, 2, 4, 8, 16$. For $n = 6$ points in general position the correct count is $31$. By how many regions does the formula $2^{n-1}$ overshoot the correct count at $n = 6$?'
            answer: '1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'For $n = 6$ the formula gives $2^5 = 32$ regions. The correct count is $31$, so the formula overshoots by $32 - 31 = 1$ region. Five matching cases did not prove the pattern, and this one failure disproves it.'
          - problem: 'The claim that every odd integer greater than $1$ is prime holds for $3$, $5$ and $7$. What is the smallest odd integer greater than $1$ for which the claim fails?'
            answer: '9'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The next odd integer is $9$, and $9 = 3 \cdot 3$ is composite. So $9$ is the smallest counterexample. The three successful checks of $3$, $5$ and $7$ do not prove the claim.'
          - problem: 'An argument for the claim that the sum of two odd integers is even runs as follows. Let $a = 2j + 1$ and $b = 2k + 1$ be odd integers, where $j$ and $k$ are integers. Then $a + b = 2j + 2k + 2 = 2(j + k + 1)$, which is even. Does this argument prove the claim?'
            answer: 'yes'
            answer_contract: {"kind": "label", "options": [["yes", "it does", "it proves the claim", "it does prove it"], ["no", "it does not", "it does not prove", "not a proof"]]}
            solution_sketch: 'The integers $a$ and $b$ are arbitrary odd integers, because $j$ and $k$ can be any integers. The sum equals $2(j + k + 1)$ with $j + k + 1$ an integer, so it is even by the definition of even. The argument covers every pair, so it is a proof.'
          - problem: 'The inequality $3^n > n^3$ is true for $n = 1$ and $n = 2$. Find the smallest positive integer $n$ for which it is false.'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'For $n = 3$ we get $3^3 = 27$ and $3^3 = 27$, so the two sides are equal and the strict inequality is false. So $n = 3$ is the smallest positive integer for which the inequality fails.'
          - problem: 'The value of $n^2 + n + 17$ is prime for $n = 1, 2, \dots, 15$. Give a positive integer $n$ for which it is not prime.'
            answer: '16'
            answer_contract: {"kind": "property", "check": "prime_counterexample", "args": {"expr": "n^2+n+17", "var": "n", "min": 1}}
            solution_sketch: 'For $n = 16$ we get $16^2 + 16 + 17 = 289 = 17 \cdot 17$, which is composite. The value $n = 17$ also works, because $17^2 + 17 + 17 = 323 = 17 \cdot 19$. One such value refutes the conclusion.'
        constraints: "the flawed argument verifies instances; the fix is an arbitrary-element proof or a counterexample Closed proof-audit items must require this knowledge point's method; verify every proposed inference for the stated arbitrary inputs. Do not supply the decisive result as an established fact."
      - id: kp2
        name: "Circular reasoning and converse errors"
        key_prerequisites: [rules-of-inference]
        exemplars:
          - problem: 'To prove that $x^2 + 1 \ge 2x$ for all real $x$, an argument starts from the inequality $x^2 + 1 \ge 2x$, subtracts $2x$ from both sides to get $x^2 - 2x + 1 \ge 0$, notes that this is $(x-1)^2 \ge 0$, which is true, and concludes that the claim holds. Is this a valid proof?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "it is valid", "valid", "it is correct", "correct", "it is a valid proof"], ["no", "it is not valid", "not valid", "invalid", "it is incorrect", "incorrect", "not a valid proof", "wrong"]]}
            solution_sketch: 'The argument starts by assuming the statement that it must prove, and then reads a true statement off the assumption. A true consequence does not prove the assumption, because a false statement can also imply a true one. A valid proof starts from $(x-1)^2 \ge 0$ and adds $2x$ to both sides.'
          - problem: 'The statement ''if $n$ is divisible by $6$, then $n$ is divisible by $3$'' is true. Its converse is false. What is the smallest positive integer $n$ that is a counterexample to the converse?'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The converse says that every multiple of $3$ is a multiple of $6$. The integer $3$ is a multiple of $3$, but $3$ is not divisible by $6$. So $3$ is the smallest counterexample, and proving the converse would not prove the original statement.'
          - problem: 'Every player on the football team has a signed permission form. In a class of $30$ students, all $11$ team members hold a form, and $18$ students hold a form in total. How many students hold a form and are not on the team?'
            answer: '7'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The students with a form who are not on the team number $18 - 11 = 7$. Each of these $7$ students holds a form and is not on the team. The rule ''team member implies form'' does not give the converse ''form implies team member''.'
          - problem: 'Squaring both sides of an equation is not a reversible step. Square both sides of the false equation $-3 = 3$. What is the common value of both sides of the resulting equation?'
            answer: '9'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'We get $(-3)^2 = 9$ and $3^2 = 9$, so the new equation $9 = 9$ is true. A false equation produced a true one. So reaching a true equation by squaring does not show that the starting equation is true.'
          - problem: 'The statement ''if $n$ is divisible by $4$, then $n^2$ is divisible by $4$'' is true, but its converse is false. Give a positive integer $n$ below $20$ whose square is divisible by $4$ but which is not divisible by $4$.'
            answer: '2'
            answer_contract: {"kind": "property", "check": "multiple_of", "args": {"k": 2, "min": 1, "max": 19, "not_multiple_of": 4}}
            solution_sketch: 'Take $n = 2$. Then $n^2 = 4$ is divisible by $4$, but $2$ is not divisible by $4$. The values $6, 10, 14, 18$ also work. So the converse fails, and a proof of the converse would not prove the original statement.'
          - problem: 'A proof of the statement ''if $n$ is odd, then $n^2$ is odd'' proves the statement ''if $n^2$ is even, then $n$ is even''. Is this a valid way to prove the original statement?'
            answer: 'yes'
            answer_contract: {"kind": "label", "options": [["yes", "it is valid", "valid", "it is correct", "correct", "it is a valid proof"], ["no", "it is not valid", "not valid", "invalid", "it is incorrect", "incorrect", "not a valid proof", "wrong"]]}
            solution_sketch: 'The statement ''if $n^2$ is even, then $n$ is even'' is the contrapositive of the original statement. A statement and its contrapositive are equivalent, so a proof of one is a proof of the other. The converse would not work, but the contrapositive does.'
          - problem: 'At a pool, the rule is that every child under $8$ wears a wristband. A lifeguard sees $25$ children with wristbands, and exactly $17$ of them are under $8$. How many children with wristbands show that the statement ''every child with a wristband is under $8$'' is false?'
            answer: '8'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The children with wristbands who are not under $8$ number $25 - 17 = 8$. Each of these $8$ children is a counterexample to the converse of the rule. The rule does not imply its converse.'
        constraints: "flag arguing-from-the-conclusion; require reversibility or a rewritten forward proof Closed proof-audit items must require this knowledge point's method; verify every proposed inference for the stated arbitrary inputs. Do not supply the decisive result as an established fact."
      - id: kp3
        name: "Illegal algebraic steps"
        key_prerequisites: [direct-proof]
        exemplars:
          - problem: 'Consider this ''proof'' that $2 = 1$. Let $a = b$. Then $a^2 = ab$, so $a^2 - b^2 = ab - b^2$, so $(a+b)(a-b) = b(a-b)$, so $a + b = b$. With $a = b = 1$ this reads $2 = 1$. By which expression does the argument divide both sides in the last step?'
            answer: 'a - b'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The step from $(a+b)(a-b) = b(a-b)$ to $a + b = b$ cancels the common factor $a - b$. This is a division of both sides by $a - b$. Since $a = b$, the factor $a - b$ equals $0$, and division by $0$ is not allowed.'
          - problem: 'A solution of $(x-8)(x+3) = 0$ is lost when both sides are divided by $x - 8$ to obtain $x + 3 = 0$. Which solution is lost?'
            answer: '8'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'By the zero-product rule the equation has the solutions $x = 8$ and $x = -3$. For $x = 8$ the divisor $x - 8$ is $0$, so the division is illegal there, and the solution $8$ is lost.'
          - problem: 'Taking the square root of both sides of $(t-2)^2 = 9$ and writing $t - 2 = 3$ finds only one of the two solutions. What is the other solution?'
            answer: '-1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The square root of $9$ gives two branches, $t - 2 = 3$ and $t - 2 = -3$. The first branch gives $t = 5$ and the second gives $t = -1$. The other solution is $-1$.'
          - problem: 'Solving $x^2 < 49$ by taking the square root of both sides gives $x < 7$. Give an integer $x$ with $x < 7$ that is not a solution of $x^2 < 49$.'
            answer: '-10'
            answer_contract: {"kind": "property", "check": "integer_in_range", "args": {"max": -7}}
            solution_sketch: 'The square root of $x^2$ is $|x|$, so the inequality means $|x| < 7$ and its solutions are $-7 < x < 7$. The value $x = -10$ has $x < 7$, but $(-10)^2 = 100$ is not less than $49$. Every integer $x \le -7$ works in the same way, including $x = -7$, because $(-7)^2 = 49$ is not less than $49$.'
          - problem: 'Solve the equation $(y-2)(y+5) = 9(y-2)$.'
            answer: '2, 4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Do not divide by $y - 2$, because it can be $0$. Move all terms to one side to get $(y-2)(y+5) - 9(y-2) = (y-2)(y-4) = 0$. So $y = 2$ or $y = 4$, and the division by $y - 2$ would lose the solution $y = 2$.'
          - problem: 'The ''proof'' that $-6 = 6$ starts from $(-6)^2 = 6^2$, takes the square root of both sides and writes $-6 = 6$. What is the value of $\sqrt{(-6)^2}$?'
            answer: '6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'We have $(-6)^2 = 36$, and $\sqrt{36} = 6$. So $\sqrt{(-6)^2} = |-6| = 6$ and not $-6$. The illegal step wrote $\sqrt{z^2} = z$, which holds only for $z \ge 0$.'
          - problem: 'A rectangular garden is $w$ metres wide and $w + 4$ metres long. Its area, in square metres, is $5w$. Find the width of the garden.'
            answer: '1'
            answer_contract: {"kind": "unit", "quantity": "length", "unit": "m", "allow_omitted": true}
            solution_sketch: 'The area gives $w(w + 4) = 5w$, so $w^2 - w = w(w - 1) = 0$ and $w = 0$ or $w = 1$. A width of $0$ is impossible, so the width is $1$ metre. Here we may divide by $w$, because $w > 0$ in the context.'
          - problem: 'The number $x$ times $x - 7$ equals $4$ times $x - 7$. Which numbers can $x$ be?'
            answer: '4, 7'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The statement is $x(x-7) = 4(x-7)$. Move all terms to one side: $(x-7)(x-4) = 0$. So $x = 7$ or $x = 4$, and dividing by $x - 7$ would lose the solution $7$.'
          - problem: 'To solve $x^2 = 5x$, a student divides both sides by $x$ and obtains $x = 5$. Is this a valid way to find every solution of the equation?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "it is valid", "valid", "it is correct", "correct", "it is a valid proof"], ["no", "it is not valid", "not valid", "invalid", "it is incorrect", "incorrect", "not a valid proof", "wrong"]]}
            solution_sketch: 'Division by $x$ is illegal when $x = 0$, and $x = 0$ is a solution of $x^2 = 5x$. The correct way is $x(x - 5) = 0$, which gives $x = 0$ or $x = 5$. The student lost the solution $0$.'
          - problem: 'The equation $(m-3)^2 = 16$ is solved by writing $m - 3 = 4$ or $m - 3 = -4$, so $m = 7$ or $m = -1$. Is this a valid way to find every solution of the equation?'
            answer: 'yes'
            answer_contract: {"kind": "label", "options": [["yes", "it is valid", "valid", "it is correct", "correct", "it is a valid proof"], ["no", "it is not valid", "not valid", "invalid", "it is incorrect", "incorrect", "not a valid proof", "wrong"]]}
            solution_sketch: 'The square root of $16$ has two branches, $4$ and $-4$, and both are kept. Each branch gives one solution, $m = 7$ and $m = -1$, and no solution is lost. So the method is valid.'
        constraints: "hidden division by zero or invalid root extraction; the learner names the exact illegal step"
    diagnostic_exemplar:
      problem: 'Identify the error in each argument: (a) "The sum of two even integers is even — indeed $4 + 6 = 10$." (b) "If $a = b$ then $a^2 = ab$, so $a^2 - b^2 = ab - b^2$, so $(a+b)(a-b) = b(a-b)$, hence $a + b = b$; taking $a = b = 1$ gives $2 = 1$."'
      answer_contract: {kind: none}
      answer: '(a) Proof by example: one instance cannot establish a universal claim. A proof must start from arbitrary even integers $2a$ and $2b$ and show $2a + 2b = 2(a+b)$. (b) An illegal cancellation: passing from $(a+b)(a-b) = b(a-b)$ to $a + b = b$ divides by $a - b$, which is $0$ because $a = b$. Division by zero is not a valid step, so the conclusion does not follow.'
      solution_sketch: 'Ask what each step actually licenses: one instance never proves "for all", and cancelling a factor requires it to be nonzero.'
    anki_seeds:
      - front: 'Why does deriving a true statement from a claim not prove the claim?'
        back: 'A false statement can imply a true one ($F \to T$ is true); the steps must be reversible or run forward from known truths.'
        type: basic
      - front: 'The "converse error" in a proof?'
        back: 'Proving $Q \to P$ (or assuming $Q$) when the goal is $P \to Q$.'
        type: basic
      - front: 'Classic hidden error in the "$2 = 1$" algebra fallacy?'
        back: 'Dividing by $a - b$, which is zero when $a = b$.'
        type: basic

  - id: induction-template
    name: "The Induction Template"
    core: true
    difficulty: 0.55
    drill: false
    answer_kind: proof
    expected_time_secs: 200
    prerequisites:
      - id: direct-proof
        weight: 0.5
        key: true
      - id: quantifiers
        weight: 0.2
      - id: factorial-notation
        weight: 0.2
        key: false
    knowledge_points:
      - id: kp1
        name: "The principle and its two parts"
        key_prerequisites: [quantifiers]
        try_first:
          problem: 'Dominoes are numbered $1, 2, 3, \dots$ and set up so that, whenever domino $k$ falls, domino $k + 1$ falls too. Domino $5$ is pushed over by hand and no other domino is touched. Does domino $3$ fall?'
          answer_contract: {"kind": "label", "options": [["yes", "it falls", "domino 3 falls"], ["no", "it does not fall", "domino 3 does not fall", "it stays"]]}
          answer: 'no'
          reveal: 'Falling dominoes only knock over later dominoes, so the chain starts at $5$ and reaches $5, 6, 7, \dots$. The base case fixes the place where the chain starts.'
        exemplars:
