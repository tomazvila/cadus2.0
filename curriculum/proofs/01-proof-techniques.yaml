    answer_kind: proof
    expected_time_secs: 240
    prerequisites:
      - id: induction-template
        weight: 0.6
        key: true
      - id: summation-notation
        weight: 0.2
        key: false
    knowledge_points:
      - id: kp1
        name: "Linear vs. exponential growth"
        key_prerequisites: [induction-template]
        exemplars:
          - problem: 'Prove: for all $n \ge 1$, $n < 2^n$.'
            answer: 'Base $n = 1$: $1 < 2$. Step: $n + 1 \le 2n < 2 \cdot 2^n = 2^{n+1}$.'
            solution_sketch: 'Base: $n = 1$, $1 < 2$. Step: assume $n < 2^n$. Since $n \ge 1$, $n + 1 \le n + n = 2n < 2 \cdot 2^n = 2^{n+1}$. Hence $n + 1 < 2^{n+1}$. $\square$'
          - problem: 'Prove: for all $n \ge 3$, $2n + 1 \le 2^n$.'
            answer: 'Base $n = 3$: $7 \le 8$. Step: $2(n+1) + 1 = (2n + 1) + 2 \le 2^n + 2 \le 2^n + 2^n = 2^{n+1}$.'
            solution_sketch: 'Base: $n = 3$ gives $7 \le 8$. Step: add $2$ to the hypothesis and use $2 \le 2^n$ (true for $n \ge 1$) to absorb it: $2^n + 2 \le 2 \cdot 2^n$. $\square$'
        constraints: "bound the added amount by a copy of the exponential term"
      - id: kp2
        name: "Polynomial vs. exponential and factorial"
        key_prerequisites: [induction-template]
        exemplars:
          - problem: 'Prove: for all $n \ge 5$, $2^n > n^2$.'
            answer: 'Base $n = 5$: $32 > 25$. Step: $2^{n+1} = 2 \cdot 2^n > 2n^2 \ge (n+1)^2$ for $n \ge 5$.'
            solution_sketch: 'Base: $n = 5$, $32 > 25$. Step: assume $2^n > n^2$ for some $n \ge 5$. Then $2^{n+1} = 2 \cdot 2^n > 2n^2$. Since $n \ge 5$, $n^2 - 2n - 1 \ge 0$, so $2n^2 \ge n^2 + 2n + 1 = (n+1)^2$. Hence $2^{n+1} > (n+1)^2$. $\square$'
          - problem: 'Prove: for all $n \ge 1$, $n! \ge 2^{n-1}$.'
            answer: 'Base $n = 1$: $1 \ge 1$. Step: $(n+1)! = (n+1) \cdot n! \ge 2 \cdot 2^{n-1} = 2^n$ since $n + 1 \ge 2$.'
            solution_sketch: 'Base: $1! = 1 = 2^0$. Step: assume $n! \ge 2^{n-1}$; multiply by $n + 1 \ge 2$ to get $(n+1)! \ge 2 \cdot 2^{n-1} = 2^n$. $\square$'
        constraints: "verify the base is large enough; bound the step algebraically"
      - id: kp3
        name: "Bernoulli and harmonic bounds"
        key_prerequisites: [induction-template]
        exemplars:
          - problem: 'Prove Bernoulli''s inequality: for every real $x \ge -1$ and every integer $n \ge 1$, $(1 + x)^n \ge 1 + nx$.'
            answer: 'Base $n = 1$: equality. Step: $(1+x)^{n+1} \ge (1 + nx)(1 + x) = 1 + (n+1)x + nx^2 \ge 1 + (n+1)x$.'
            solution_sketch: 'Base: $(1+x)^1 = 1 + x$. Step: multiply the hypothesis by $1 + x \ge 0$: $(1+x)^{n+1} \ge (1 + nx)(1 + x) = 1 + (n+1)x + nx^2$, and $nx^2 \ge 0$. $\square$'
          - problem: 'Prove: for all $n \ge 0$, $\displaystyle\sum_{i=1}^{2^n} \frac{1}{i} \ge 1 + \frac{n}{2}$.'
            answer: 'Base $n = 0$: $1 \ge 1$. Step: the $2^n$ new terms are each at least $\frac{1}{2^{n+1}}$, contributing at least $\frac{1}{2}$.'
            solution_sketch: 'Base: $n = 0$ gives $1 \ge 1$. Step: from $2^n + 1$ to $2^{n+1}$ there are $2^n$ terms, each $\ge \frac{1}{2^{n+1}}$, so the sum grows by at least $2^n \cdot \frac{1}{2^{n+1}} = \frac{1}{2}$, giving $1 + \frac{n}{2} + \frac{1}{2} = 1 + \frac{n+1}{2}$. $\square$'
        constraints: "multiplying inequalities requires a nonnegative factor; block-bounding for harmonic sums"
    diagnostic_exemplar:
      problem: 'Prove by induction: for all $n \ge 1$, $\displaystyle\sum_{i=1}^{n} \frac{1}{i^2} \le 2 - \frac{1}{n}$.'
      answer: 'Base $n = 1$: the sum is $1$ and $2 - \tfrac11 = 1$, so the inequality holds (with equality). Step: assume $\sum_{i=1}^{n} \frac{1}{i^2} \le 2 - \frac{1}{n}$. Then $\sum_{i=1}^{n+1} \frac{1}{i^2} \le 2 - \frac{1}{n} + \frac{1}{(n+1)^2}$, so it suffices that $\frac{1}{(n+1)^2} \le \frac{1}{n} - \frac{1}{n+1} = \frac{1}{n(n+1)}$ — true because $(n+1)^2 > n(n+1)$ for $n \ge 1$. Hence $\sum_{i=1}^{n+1} \frac{1}{i^2} \le 2 - \frac{1}{n+1}$, and the claim follows by induction.'
      solution_sketch: 'Add the new term to the inductive bound and check it fits inside the gap $\frac1n - \frac{1}{n+1}$.'
    anki_seeds:
      - front: 'Bernoulli''s inequality?'
        back: '$(1 + x)^n \ge 1 + nx$ for every real $x \ge -1$ and integer $n \ge 1$.'
        type: basic
      - front: 'Common trick in the step of an exponential inequality induction?'
        back: 'Write $2^{n+1} = 2 \cdot 2^n$ and absorb the added amount into the extra factor.'
        type: basic

  - id: mathematical-induction
    name: "Mathematical Induction"
    core: true
    difficulty: 0.62
    drill: false
    answer_kind: proof
    expected_time_secs: 240
    prerequisites:
      - id: induction-summation-proofs
        weight: 0.5
        key: true
      - id: induction-inequality-proofs
        weight: 0.4
        key: true
      - id: induction-divisibility-proofs
        weight: 0.4
      - id: quantifiers
        weight: 0.2
    knowledge_points:
      - id: kp1
        name: "Products and factorials"
        key_prerequisites: [induction-summation-proofs]
        exemplars:
          - problem: 'Prove: for all $n \ge 1$, $\displaystyle\sum_{i=1}^{n} i \cdot i! = (n+1)! - 1$.'
            answer: 'Base $n = 1$: $1 = 2! - 1$. Step: $(n+1)! - 1 + (n+1)(n+1)! = (n+2)! - 1$.'
            solution_sketch: 'Base: $1 \cdot 1! = 1 = 2 - 1$. Step: add $(n+1)(n+1)!$ to the hypothesis: $(n+1)! - 1 + (n+1)(n+1)! = (n+1)!(1 + n + 1) - 1 = (n+2)! - 1$. $\square$'
          - problem: 'Prove: for all $n \ge 2$, $\displaystyle\prod_{k=2}^{n} \left(1 - \frac{1}{k}\right) = \frac{1}{n}$.'
            answer: 'Base $n = 2$: $\tfrac{1}{2}$. Step: $\frac{1}{n} \cdot \left(1 - \frac{1}{n+1}\right) = \frac{1}{n} \cdot \frac{n}{n+1} = \frac{1}{n+1}$.'
            solution_sketch: 'Base: $1 - \frac{1}{2} = \frac{1}{2}$. Step: multiply the hypothesis by the next factor $\frac{n}{n+1}$ and cancel. $\square$'
        constraints: "factorial and telescoping-product identities; factor the common piece in the step"
      - id: kp2
        name: "Induction on counting and geometry"
        key_prerequisites: [induction-summation-proofs]
        exemplars:
          - problem: 'Prove: a set with $n$ elements has exactly $2^n$ subsets.'
            answer: 'Base $n = 0$: $\varnothing$ has one subset. Step: adding a new element pairs each old subset with itself-plus-the-new-element, doubling the count.'
            solution_sketch: 'Base: the empty set has exactly one subset. Step: let $|S| = n + 1$ and fix $x \in S$. Subsets of $S$ split into those avoiding $x$ (subsets of $S \setminus \{x\}$: $2^n$ of them) and those containing $x$ (each is one of the former plus $x$: another $2^n$). Total $2 \cdot 2^n = 2^{n+1}$. $\square$'
          - problem: 'Prove: $n$ lines in the plane in general position (no two parallel, no three concurrent) divide it into $\dfrac{n^2 + n + 2}{2}$ regions.'
            answer: 'Base $n = 0$: $1$ region. Step: the $(n+1)$-st line meets $n$ lines in $n$ points, crossing $n + 1$ regions and adding $n + 1$.'
            solution_sketch: 'Base: no lines, one region, and $\frac{0 + 0 + 2}{2} = 1$. Step: a new line meets the $n$ existing lines in $n$ distinct points, splitting the new line into $n + 1$ pieces, each cutting one region in two. So $R(n+1) = \frac{n^2 + n + 2}{2} + (n + 1) = \frac{(n+1)^2 + (n+1) + 2}{2}$. $\square$'
        constraints: "the step must argue combinatorially or geometrically, not just algebraically"
      - id: kp3
        name: "Pitfalls and thresholds"
        key_prerequisites: [induction-inequality-proofs]
        exemplars:
          - problem: 'Find the flaw in the classic "all horses are the same color" induction.'
            answer: 'The step "overlap the two $n$-horse groups" fails at $n = 1$: two horses split into singleton groups with empty overlap.'
            solution_sketch: 'The inductive step assumes the two size-$n$ subsets of a size-$(n+1)$ set overlap, which is true only for $n \ge 2$. Since the step from $P(1)$ to $P(2)$ fails, the chain never starts, and the "theorem" is false. $\square$'
          - problem: 'Find the least $n_0$ with $n! > 3^n$ for all $n \ge n_0$, and prove it by induction.'
            answer: '$n_0 = 7$: $5040 > 2187$ ($n = 6$ fails: $720 < 729$). Step: $(n+1)! = (n+1) \cdot n! > 3 \cdot 3^n$ since $n + 1 \ge 8 > 3$.'
            solution_sketch: 'Check $n = 6$: $720 < 729$ fails; $n = 7$: $5040 > 2187$ holds. Step for $n \ge 7$: $(n+1)! = (n+1)n! > (n+1)3^n \ge 3 \cdot 3^n = 3^{n+1}$. $\square$'
        constraints: "diagnose a broken step or find the correct starting threshold before proving"
    diagnostic_exemplar:
      problem: 'Find the least integer $n_0$ such that $2^{n} > n^{3}$ holds for all $n \ge n_0$, and prove it by induction.'
      answer: '$n_0 = 10$: the inequality fails at $n = 9$ ($512 < 729$) and holds at $n = 10$ ($1024 > 1000$), which serves as the base case. Step: assume $2^{n} > n^{3}$ for some $n \ge 10$. Then $2^{n+1} = 2 \cdot 2^{n} > 2n^{3}$, and $2n^{3} \ge (n+1)^{3}$ because $(n+1)^{3} = n^{3}\left(1 + \tfrac1n\right)^{3} \le n^{3}(1.1)^{3} = 1.331\,n^{3} < 2n^{3}$ for $n \ge 10$. Hence $2^{n+1} > (n+1)^{3}$, and by induction the inequality holds for every $n \ge 10$.'
      solution_sketch: 'Test small values to locate the threshold (it fails at $9$, holds at $10$), then induct, bounding $(1 + 1/n)^3$ below $2$ for $n \ge 10$.'
    anki_seeds:
      - front: 'The two parts of a proof by induction?'
        back: 'Base case (verify $P(n_0)$) and inductive step (assume $P(n)$, prove $P(n + 1)$).'
        type: basic
      - front: 'The flaw in the "all horses are the same color" induction?'
        back: 'The inductive step needs the two overlapping groups to intersect, which fails going from $n = 1$ to $n = 2$.'
        type: basic

  - id: strong-induction
    name: "Strong Induction"
    core: true
    difficulty: 0.65
    drill: false
    answer_kind: proof
    expected_time_secs: 240
    prerequisites:
      - id: mathematical-induction
        weight: 0.7
        key: true
      - id: quantifiers
        weight: 0.2
      - id: prime-composite-numbers
        weight: 0.2
        key: false
    knowledge_points:
      - id: kp1
        name: "Recurrences needing earlier cases"
        key_prerequisites: [mathematical-induction]
        exemplars:
          - problem: 'Let $a_1 = 1$, $a_2 = 5$, and $a_n = 5a_{n-1} - 6a_{n-2}$ for $n \ge 3$. Prove $a_n = 3^n - 2^n$ for all $n \ge 1$.'
            answer: 'Two base cases $n = 1, 2$; step uses both $a_{n-1}$ and $a_{n-2}$.'
            solution_sketch: 'Base: $a_1 = 3 - 2 = 1$ and $a_2 = 9 - 4 = 5$. Step: for $n \ge 3$, assume the formula for all $k < n$. Then $a_n = 5(3^{n-1} - 2^{n-1}) - 6(3^{n-2} - 2^{n-2}) = 3^{n-2}(15 - 6) - 2^{n-2}(10 - 6) = 3^n - 2^n$. $\square$'
          - problem: 'Let $a_1 = 2$, $a_2 = 4$, and $a_n = 2a_{n-1} - a_{n-2}$ for $n \ge 3$. Prove $a_n = 2n$ for all $n \ge 1$.'
            answer: 'Two base cases; step uses $a_{n-1}, a_{n-2}$.'
            solution_sketch: 'Base: $a_1 = 2$, $a_2 = 4$. Step: for $n \ge 3$, assume $a_k = 2k$ for $k < n$. Then $a_n = 2a_{n-1} - a_{n-2} = 2 \cdot 2(n-1) - 2(n-2) = 4n - 4 - 2n + 4 = 2n$. $\square$'
        constraints: "use two base cases; invoke the hypothesis at $n-1$ and $n-2$"
      - id: kp2
        name: "Existence of prime factorizations"
        key_prerequisites: [mathematical-induction]
        exemplars:
          - problem: 'Prove: every integer $n \ge 2$ is a product of one or more primes.'
            answer: 'If $n$ is prime, done; else $n = ab$ with $2 \le a, b < n$, apply the hypothesis to $a, b$.'
            solution_sketch: 'Base: $2$ is prime. Step: assume every integer in $[2, n)$ is a product of primes. If $n$ is prime, done. Otherwise $n = ab$ with $2 \le a, b < n$; by the strong hypothesis $a$ and $b$ are products of primes, so $n = ab$ is too. $\square$'
          - problem: 'Prove: every integer $n \ge 2$ has a prime divisor.'
            answer: 'If $n$ is prime, itself; else a proper factor $a < n$ has a prime divisor by the hypothesis.'
            solution_sketch: 'Base: $2$ is prime and divides itself. Step: assume every integer in $[2, n)$ has a prime divisor. If $n$ is prime, done. Otherwise $n = ab$ with $2 \le a < n$; by hypothesis $a$ has a prime divisor $p$, and $p \mid a \mid n$. $\square$'
        constraints: "split the number and apply the hypothesis to both smaller factors"
      - id: kp3
        name: "Bounding recursive sequences"
        key_prerequisites: [mathematical-induction]
        exemplars:
          - problem: 'Let $f_1 = f_2 = 1$ and $f_n = f_{n-1} + f_{n-2}$. Prove $f_n < 2^n$ for all $n \ge 1$.'
            answer: 'Base $n = 1, 2$; step: $f_n = f_{n-1} + f_{n-2} < 2^{n-1} + 2^{n-2} < 2^n$.'
            solution_sketch: 'Base: $f_1 = 1 < 2$ and $f_2 = 1 < 4$. Step: for $n \ge 3$ assume $f_k < 2^k$ for all $k < n$. Then $f_n = f_{n-1} + f_{n-2} < 2^{n-1} + 2^{n-2} = 3 \cdot 2^{n-2} < 4 \cdot 2^{n-2} = 2^n$. $\square$'
          - problem: 'A sequence has $b_1 = 3$, $b_2 = 5$, and $b_n = 3b_{n-1} - 2b_{n-2}$ for $n \ge 3$. Prove $b_n = 2^n + 1$ for all $n \ge 1$.'
            answer: 'Two base cases; step uses the recurrence.'
            solution_sketch: 'Base: $b_1 = 3 = 2^1 + 1$, $b_2 = 5 = 2^2 + 1$. Step: for $n \ge 3$ assume the formula for all $k < n$. Then $b_n = 3(2^{n-1} + 1) - 2(2^{n-2} + 1) = 3 \cdot 2^{n-1} - 2^{n-1} + 1 = 2^n + 1$. $\square$'
        constraints: "bound each recursive term using the strong hypothesis"
    diagnostic_exemplar:
      problem: 'Prove: every postage amount of $n \ge 12$ cents can be made using only $4$-cent and $5$-cent stamps.'
      answer: 'Base cases $12, 13, 14, 15$; step reduces $n$ to $n - 4 \ge 12$ plus one $4$-cent stamp.'
      solution_sketch: 'Base: $12 = 4+4+4$, $13 = 4+4+5$, $14 = 4+5+5$, $15 = 5+5+5$. Step: for $n \ge 16$, assume every value in $[12, n)$ is makeable; since $n - 4 \ge 12$ is makeable, add one $4$-cent stamp to form $n$. $\square$'
    anki_seeds:
      - front: 'Strong induction hypothesis vs. ordinary induction?'
        back: 'Strong induction assumes $P(k)$ for every $k$ from the base up to $n$, not just $P(n)$.'
        type: basic
      - front: 'When should you use strong induction?'
        back: 'When the next case depends on earlier cases beyond the immediate predecessor (recurrences, prime factorization).'
        type: basic

  - id: wop
    name: "The Well-Ordering Principle"
    core: false                # supplemental: alternative formulation of induction; nothing builds on it
    difficulty: 0.68
    drill: false
    answer_kind: proof
    expected_time_secs: 240
    prerequisites:
      - id: strong-induction
        weight: 0.4
        key: true
      - id: proof-by-contradiction
        weight: 0.4
        key: true
      - id: mathematical-induction
        weight: 0.3
      - id: quantifiers
        weight: 0.0
    knowledge_points:
      - id: kp1
        name: "The minimal-counterexample method"
        key_prerequisites: [proof-by-contradiction]
        exemplars:
          - problem: 'Using the well-ordering principle, prove every integer $n \ge 2$ has a prime divisor.'
            answer: 'The least element of the set of divisors $\ge 2$ is prime.'
            solution_sketch: 'Let $S = \{d \in \mathbb{Z} : d \ge 2 \text{ and } d \mid n\}$. It is nonempty ($n \in S$), so by well-ordering it has a least element $p$. If $p$ were composite, a divisor $d$ with $2 \le d < p$ would divide $n$, contradicting minimality. So $p$ is prime. $\square$'
          - problem: 'Using well-ordering, prove that $1 + 2 + \cdots + n = \tfrac{n(n+1)}{2}$ for every $n \ge 1$ (minimal-counterexample form).'
            answer: 'A least counterexample $m$ would force the formula to hold at $m$ too.'
            solution_sketch: 'Suppose the formula fails somewhere; let $m$ be the least such $n$ (well-ordering). Since it holds at $n = 1$, $m \ge 2$, so it holds at $m - 1$: $1 + \cdots + (m-1) = \frac{(m-1)m}{2}$. Adding $m$ gives $\frac{(m-1)m}{2} + m = \frac{m(m+1)}{2}$, so it holds at $m$ — contradiction. $\square$'
        constraints: "form a nonempty set of naturals and use its least element"
      - id: kp2
        name: "Existence via least elements"
        key_prerequisites: [proof-by-contradiction]
        exemplars:
          - problem: 'Prove the existence part of the division algorithm: for integers $a$ and $b > 0$, there are $q, r$ with $a = bq + r$ and $0 \le r < b$.'
            answer: 'The least nonnegative $r = a - bq$ satisfies $0 \le r < b$.'
            solution_sketch: 'Let $S = \{a - bq : q \in \mathbb{Z},\ a - bq \ge 0\}$, a nonempty subset of $\mathbb{N}$. By well-ordering it has a least element $r = a - bq$. If $r \ge b$, then $r - b = a - b(q + 1) \ge 0$ lies in $S$ and is smaller, a contradiction. So $0 \le r < b$. $\square$'
          - problem: 'Prove: every integer $n \ge 2$ is a product of primes, using the minimal-counterexample method.'
            answer: 'A least non-factorable $m$ splits as $ab$ with $a, b < m$ both factorable.'
            solution_sketch: 'Suppose some integer $\ge 2$ is not a product of primes; let $m$ be the least (well-ordering). $m$ is not prime (else it is its own product), so $m = ab$ with $2 \le a, b < m$; by minimality $a$ and $b$ are products of primes, so $m = ab$ is too — contradiction. $\square$'
        constraints: "choose the set so its least element gives the desired object"
      - id: kp3
        name: "Well-ordering and induction"
        key_prerequisites: [mathematical-induction]
        exemplars:
          - problem: 'Prove that the well-ordering principle implies mathematical induction.'
            answer: 'A least counterexample would contradict the base case or the inductive step.'
            solution_sketch: 'Assume $P(1)$ and $P(n) \to P(n+1)$ but $P$ fails somewhere. Let $C = \{n \ge 1 : \neg P(n)\}$, nonempty, so it has a least element $m$ by well-ordering. Since $P(1)$ holds, $m > 1$, so $P(m - 1)$ holds by minimality; the step gives $P(m)$, a contradiction. Hence $P(n)$ holds for all $n$. $\square$'
          - problem: 'Prove that mathematical induction implies the well-ordering principle: any nonempty $S \subseteq \mathbb{N}$ has a least element.'
            answer: 'If $S$ had no least element, induction shows its complement is all of $\mathbb{N}$.'
            solution_sketch: 'Suppose $S \subseteq \mathbb{N}$ has no least element. Let $P(n)$ be "no $k \le n$ lies in $S$". $P(0)$ holds (else $0$ is least in $S$). If $P(n)$ holds and $n + 1 \in S$, then $n+1$ would be least, contradiction; so $P(n+1)$ holds. By induction $P(n)$ for all $n$, so $S = \varnothing$. Contrapositively, a nonempty $S$ has a least element. $\square$'
        constraints: "connect the two principles via a least failure point"
    diagnostic_exemplar:
      problem: 'Use the well-ordering principle to prove that every nonempty set $S$ of integers that is bounded above has a greatest element.'
      answer: 'Let $M$ be an upper bound for $S$, so $s \le M$ for every $s \in S$, and put $T = \{M - s : s \in S\}$. Every element of $T$ is a nonnegative integer, and $T$ is nonempty because $S$ is, so by the well-ordering principle $T$ has a least element, say $M - s_0$ with $s_0 \in S$. Then for every $s \in S$ we have $M - s_0 \le M - s$, i.e. $s \le s_0$. Hence $s_0$ is an element of $S$ greater than or equal to every element of $S$ — a greatest element.'
      solution_sketch: 'Reflect the set about the upper bound to land inside the nonnegative integers, apply well-ordering there, and translate the least element back.'
    anki_seeds:
      - front: 'The well-ordering principle?'
        back: 'Every nonempty set of natural numbers (or of integers bounded below) has a least element.'
        type: basic
      - front: 'The minimal-counterexample method?'
        back: 'Take the least $n$ for which the claim fails (well-ordering), then derive a contradiction from a smaller failure.'
        type: basic
