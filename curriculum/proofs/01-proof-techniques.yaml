        name: "Mixed exponential-linear divisibility"
        key_prerequisites: [induction-template]
        exemplars:
          - problem: 'Let $F(n) = 7^n + 3n + 8$. Find the polynomial $r(k)$ for which $F(k+1) = 7F(k) + r(k)$.'
            answer: '-18k-45'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'We have $F(k+1) = 7^{k+1} + 3k + 11$ and $7F(k) = 7^{k+1} + 21k + 56$. So $r(k) = 3k + 11 - 21k - 56 = -18k - 45 = -9(2k+5)$, which is a multiple of $9$.'
          - problem: 'Suppose $5^k + 4k + 7 = 8t$ for some integer $t$. Write $5^{k+1} + 4(k+1) + 7$ as $8$ times an expression in $t$ and $k$.'
            answer: '5t-2k-3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'We have $5^{k+1} + 4k + 11 = 5(5^k + 4k + 7) - 16k - 24 = 40t - 16k - 24 = 8(5t - 2k - 3)$. So the expression is $5t - 2k - 3$.'
          - problem: 'Is $5$ a divisor of $3^n + 2n + 4$ for every integer $n \ge 0$?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "it is a divisor", "divisor", "it is"], ["no", "it is not a divisor", "not a divisor", "does not divide", "it is not"]]}
            solution_sketch: 'At $n = 0$ the value is $1 + 0 + 4 = 5$, which is divisible by $5$. At $n = 1$ the value is $3 + 2 + 4 = 9$, which is not. So the statement is false, and no induction step can prove it.'
          - problem: 'A bakery bakes $7^n + 3n + 8$ cookies on day $n$ and packs them in boxes of $9$. On day $3$, how many boxes are filled?'
            answer: '40'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'On day $3$ the bakery bakes $7^3 + 9 + 8 = 343 + 17 = 360$ cookies. Since $9$ divides $7^n + 3n + 8$, every box is full. The number of boxes is $360 \div 9 = 40$.'
          - problem: 'A printer produces $5^n + 4n + 7$ pages in job $n$, and the pages are bound into booklets of $8$ pages. How many booklets does job $4$ make?'
            answer: '81'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Job $4$ produces $5^4 + 16 + 7 = 625 + 23 = 648$ pages. Since $8$ divides $5^n + 4n + 7$, every booklet is full. The number of booklets is $648 \div 8 = 81$.'
          - problem: 'Is $9$ a divisor of $10^n + 3 \cdot 4^{n+2} + 5$ for every integer $n \ge 0$?'
            answer: 'yes'
            answer_contract: {"kind": "label", "options": [["yes", "it is a divisor", "divisor", "it is"], ["no", "it is not a divisor", "not a divisor", "does not divide", "it is not"]]}
            solution_sketch: 'At $n = 0$ the value is $1 + 48 + 5 = 54 = 9 \cdot 6$. Writing $F(n) = 10^n + 3 \cdot 4^{n+2} + 5$ gives $F(k+1) = 10F(k) - 18 \cdot 4^{k+2} - 45$, and $18 \cdot 4^{k+2} + 45$ is a multiple of $9$. So the induction step works, and $9$ divides $F(n)$ for every $n$.'
          - problem: 'Write the full proof that for every integer $n \ge 0$, $4^n + 6n - 1$ is divisible by $9$.'
            answer: '9 divides 4^n + 6n - 1 for n >= 0'
            answer_contract: {"kind": "none"}
            solution_sketch: 'We prove by induction on $n \ge 0$ the statement $P(n)$: $9 \mid 4^n + 6n - 1$. Base case: for $n = 0$ we have $4^0 + 0 - 1 = 0 = 9 \cdot 0$, so $P(0)$ holds. Inductive hypothesis: let $k \ge 0$ be an integer and assume $9 \mid 4^k + 6k - 1$, that is, $4^k + 6k - 1 = 9m$ for some integer $m$. Inductive step: we must prove $9 \mid 4^{k+1} + 6(k+1) - 1$. Write $4^{k+1} + 6(k+1) - 1 = 4 \cdot 4^k + 6k + 5$. Subtract and add $4(4^k + 6k - 1) = 4 \cdot 4^k + 24k - 4$ to get $4^{k+1} + 6(k+1) - 1 = 4(4^k + 6k - 1) + (6k + 5 - 24k + 4) = 4(4^k + 6k - 1) + (9 - 18k)$. By the hypothesis $4(4^k + 6k - 1) = 36m$, and $9 - 18k = 9(1 - 2k)$. Therefore $4^{k+1} + 6(k+1) - 1 = 36m + 9(1 - 2k) = 9(4m + 1 - 2k)$, and $4m + 1 - 2k$ is an integer. So $9 \mid 4^{k+1} + 6(k+1) - 1$, and $P(k)$ implies $P(k+1)$ for every $k \ge 0$. By the principle of mathematical induction, $P(n)$ holds for every integer $n \ge 0$. $\square$'
        constraints: "express the next case as (multiple of the hypothesis) plus a visible multiple of the divisor Closed proof-audit items must require this knowledge point's method; verify every proposed inference for the stated arbitrary inputs. Do not supply the decisive result as an established fact."
    diagnostic_exemplar:
