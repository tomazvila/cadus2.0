            solution_sketch: 'We prove by induction on $n$ the statement $P(n)$: $\frac{1}{1 \cdot 2} + \cdots + \frac{1}{n(n+1)} = \frac{n}{n+1}$. Base case: for $n = 1$ the left side is $\frac{1}{1 \cdot 2} = \frac{1}{2}$ and the right side is $\frac{1}{1+1} = \frac{1}{2}$, so $P(1)$ holds. Inductive hypothesis: let $k \ge 1$ be an integer and assume $P(k)$, that is, $\frac{1}{1 \cdot 2} + \cdots + \frac{1}{k(k+1)} = \frac{k}{k+1}$. Inductive step: we must prove $P(k+1)$. Add the next term $\frac{1}{(k+1)(k+2)}$ to both sides of the hypothesis. The left side becomes the sum of the first $k + 1$ terms. By the hypothesis the sum is $\frac{k}{k+1} + \frac{1}{(k+1)(k+2)} = \frac{k(k+2) + 1}{(k+1)(k+2)} = \frac{k^2 + 2k + 1}{(k+1)(k+2)} = \frac{(k+1)^2}{(k+1)(k+2)} = \frac{k+1}{k+2}$. Since $\frac{k+1}{(k+1)+1} = \frac{k+1}{k+2}$, this is the right side of $P(k+1)$. So $P(k)$ implies $P(k+1)$ for every $k \ge 1$. By the principle of mathematical induction, $P(n)$ holds for every integer $n \ge 1$. $\square$'
