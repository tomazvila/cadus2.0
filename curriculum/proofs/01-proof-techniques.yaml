          - problem: 'Write the full proof that for every integer $n \ge 1$, $\dfrac{1}{1 \cdot 2} + \dfrac{1}{2 \cdot 3} + \cdots + \dfrac{1}{n(n+1)} = \dfrac{n}{n+1}$.'
            answer: '1/(1*2)+...+1/(n(n+1)) = n/(n+1)'
