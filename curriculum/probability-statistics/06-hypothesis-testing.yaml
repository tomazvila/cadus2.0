unit: hypothesis-testing
course: probability-statistics
module: "Hypothesis Testing"
topics:
  - id: hypothesis-tests-logic
    name: "The Logic of Significance Tests"
    core: true                 # the decision framework every test topic (z, t, chi-square, slope) builds on
    difficulty: 0.55
    drill: false
    answer_kind: multi-step
    expected_time_secs: 180
    prerequisites:
      - id: sampling-distributions
        weight: 0.8
        key: true
      - id: normal-distribution
        weight: 0.4
        key: false
      - id: populations-samples
        weight: 0.3
        key: false
    knowledge_points:
      - id: kp1
        name: 'Null and alternative hypotheses'
        key_prerequisites: [populations-samples]
        step_check:
          step: 'one-sided, since only shorter lifetimes are suspected'
          question: 'Why is the test about the light bulbs one-sided?'
          options:
            - 'The null hypothesis has an equals sign, which allows one side only'
            - 'The sample is small, so the test can look at one tail only'
            - 'The group suspects one direction only: shorter bulb life'
            - 'A claim of 1000 hours always leads to a test in one direction'
          answer: 'The group suspects one direction only: shorter bulb life'
          why: 'The alternative hypothesis follows the suspicion. The group suspects shorter lifetimes only, so $H_1$ has one direction.'
        exemplars:
          - problem: 'A juice plant claims that its bottles hold a mean of 330 mL. An inspector suspects that the plant underfills them. What is the alternative hypothesis about the mean $\mu$?'
            answer: 'mu < 330'
            answer_contract: {"kind": "label", "options": [["mu < 330", "mu<330", "μ < 330", "the mean is less than 330", "less than 330", "below 330"], ["mu > 330", "mu>330", "μ > 330", "the mean is greater than 330", "greater than 330", "above 330"], ["mu != 330", "mu ≠ 330", "μ ≠ 330", "not equal to 330", "the mean is not 330", "differs from 330"]]}
            solution_sketch: 'The null hypothesis is the claim, $\mu = 330$. The inspector suspects a lower mean, so the alternative points in one direction: $\mu < 330$.'
          - problem: 'A coach says that a player makes 7 of every 10 free throws. After extra practice an analyst suspects that the player is now better. Let $p$ be the probability of a made throw. What is the null hypothesis?'
            answer: 'p = 7/10'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The null hypothesis is the claim that is tested, with no change. Here that is $p = 7/10$, and the suspicion of improvement goes into the alternative $p > 7/10$.'
          - problem: 'An app team says that 3 of every 25 users subscribe to the premium plan. The growth lead suspects that the true proportion $p$ is now higher. What is the alternative hypothesis?'
            answer: 'p > 3/25'
            answer_contract: {"kind": "inequality_union"}
            solution_sketch: 'The suspicion is a higher proportion, so the alternative is one-sided: $p > 3/25$. The null hypothesis is $p = 3/25$.'
          - problem: 'A bus company says that 4 of every 5 of its buses arrive on time. A rider suspects that the true proportion $p$ of on-time buses is lower. What is the null hypothesis?'
            answer: 'p = 4/5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The null hypothesis is the claim with no change, $p = 4/5$. The suspicion of a lower proportion goes into the alternative hypothesis, $p < 4/5$.'
          - problem: 'A transit authority reports that 1/4 of its buses run late. A daily rider has seen few late buses and suspects that the true proportion $p$ is now lower. What is the alternative hypothesis?'
            answer: 'p < 1/4'
            answer_contract: {"kind": "inequality_union"}
            solution_sketch: 'The rider suspects a lower proportion, so the alternative is $p < 1/4$. The null hypothesis keeps the reported value $p = 1/4$.'
          - problem: 'A pollster reports that 2/5 of voters back a measure. A rival suspects that the support is different from this value. Let $p$ be the true proportion of supporters. What is the null hypothesis?'
            answer: 'p = 2/5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The null hypothesis states the reported value without any difference: $p = 2/5$. The rival suspicion of a difference in either direction is the alternative hypothesis.'
          - problem: 'A quality engineer says that exactly half of the chips on a line pass a screen. A spot check suggests that the pass probability $p$ is not exactly one half. What is the alternative hypothesis?'
            answer: 'p != 1/2'
            answer_contract: {"kind": "label", "options": [["p != 1/2", "p ≠ 1/2", "p ≠ 0.5", "p != 0.5", "p < 1/2 or p > 1/2", "p<1/2 or p>1/2", "not equal to 1/2", "p < 0.5 or p > 0.5"], ["p < 1/2", "p<1/2", "p < 0.5", "p is less than 1/2", "below 1/2"], ["p > 1/2", "p>1/2", "p > 0.5", "p is greater than 1/2", "above 1/2"]]}
            solution_sketch: 'A difference in either direction gives two parts: the rate is below 1/2 or the rate is above 1/2. So the alternative is $p \ne 1/2$, which means $p < 1/2$ or $p > 1/2$.'
        constraints: 'concrete scenarios naming a parameter; the answer is the null hypothesis, the alternative hypothesis or its direction; hypotheses are about parameters (mu, p), never about x-bar'
      - id: kp2
        name: 'The p-value'
        key_prerequisites: [sampling-distributions, normal-distribution]
        step_check:
          step: 'The p-value is the chance of data at least as extreme as the sample, found by assuming that $H_0$ is true.'
          question: 'Why is the p-value found by assuming that $H_0$ is true?'
          options:
            - 'The p-value is the chance that $H_0$ itself is true'
            - 'The null value fixes how unusual the sample would be'
            - 'The sample is no longer needed once $H_0$ is assumed true'
            - 'The assumption holds in every test, so it costs nothing'
          answer: 'The null value fixes how unusual the sample would be'
          why: 'To say how rare a sample is, we need a fixed value of the parameter. The null hypothesis gives it, so we compute the chance of the data under $H_0$.'
        exemplars:
          - problem: 'A significance test reports $p = 0.03$. Which statement is correct: (a) there is a 3% chance that $H_0$ is true; (b) if $H_0$ is true, there is a 3% chance of data at least as extreme as the sample; (c) there is a 3% chance that $H_1$ is true?'
            answer: '(b)'
            answer_contract: {"kind": "label", "options": [["(b)", "b", "if h0 is true there is a 3% chance of data at least this extreme", "the chance of data given h0"], ["(a)", "a", "a 3% chance that h0 is true"], ["(c)", "c", "a 3% chance that h1 is true"]]}
            solution_sketch: 'The p-value is found by assuming that $H_0$ is true. It is the chance of data at least as extreme as the sample, so the correct statement is (b).'
          - problem: 'A two-sided test checks the mean mass of packets. The sample mean lies 1 standard error from the null mean. Use the empirical rule to estimate the p-value to two decimal places.'
            answer: '0.32'
            answer_contract: {"kind": "approx", "decimals": 2}
            solution_sketch: 'About 68% of sample means lie within 1 standard error of the null mean. The two tails together hold the other 32%, so $p \approx 0.32$.'
          - problem: 'In a two-sided test of a drug dose the p-value is about 0.003. About how many standard errors from the null mean is the sample mean?'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The empirical rule says that about 99.7% of sample means lie within 3 standard errors. The two tails hold about 0.003, so the sample mean is 3 standard errors away.'
          - problem: 'A lab runs a two-sided test, and the sample mean lies 2 standard errors from the null mean. Use the empirical rule to estimate the p-value to two decimal places.'
            answer: '0.05'
            answer_contract: {"kind": "approx", "decimals": 2}
            solution_sketch: 'About 95% of sample means lie within 2 standard errors of the null mean. The two tails together hold about 5%, so $p \approx 0.05$.'
          - problem: 'A one-sided test of a new fertilizer has a sample mean that lies 2 standard errors from the null mean, on the side that $H_1$ predicts. Use the empirical rule to estimate the p-value to three decimal places.'
            answer: '0.025'
            answer_contract: {"kind": "approx", "decimals": 3}
            solution_sketch: 'Two tails together hold about 5%, and each tail holds half of it. The test is one-sided, so only one tail counts and $p \approx 0.025$.'
          - problem: 'In a two-sided test of the mean battery life the p-value is about 0.32. About how many standard errors from the null mean is the sample mean?'
            answer: '1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The empirical rule says that about 68% of sample means lie within 1 standard error. The two tails hold about 0.32, so the sample mean is 1 standard error away.'
          - problem: 'A two-sided test of the mean fill of tins has a sample mean 3 standard errors from the null mean. Use the empirical rule to estimate the p-value to three decimal places.'
            answer: '0.003'
            answer_contract: {"kind": "approx", "decimals": 3}
            solution_sketch: 'About 99.7% of sample means lie within 3 standard errors of the null mean. The two tails together hold about 0.3%, so $p \approx 0.003$.'
          - problem: 'A researcher says that a result of $p = 0.03$ means that the null hypothesis has a 3% chance of being true. Is she right?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["no", "she is not right", "it does not", "wrong", "no she is not"], ["yes", "she is right", "it does", "right", "yes she is"]]}
            solution_sketch: 'No. The p-value is computed by assuming that $H_0$ is true, so it cannot be the chance that $H_0$ is true. It is the chance of data at least as extreme as the sample, given $H_0$.'
        constraints: 'p-values only at empirical-rule distances (1, 2, or 3 SEs, giving 0.32, 0.05, 0.003; one-sided at 2 SEs gives 0.025); interpretation items include the assuming-H0 clause'
      - id: kp3
        name: 'The decision rule'
        key_prerequisites: [sampling-distributions]
        step_check:
          step: 'Reject $H_0$ when $p$ is at most $\alpha$; otherwise fail to reject $H_0$.'
          question: 'Why does a small p-value lead to the rejection of $H_0$?'
          options:
            - 'A small p-value shows that $H_0$ has only a small chance of being true'
            - 'A small p-value proves that the alternative hypothesis is true'
            - 'A small p-value tells us that the sample was large enough'
            - 'A small p-value means that the data would be rare if $H_0$ were true'
          answer: 'A small p-value means that the data would be rare if $H_0$ were true'
          why: 'A small p-value says that data like these almost never occur when $H_0$ is true. That is evidence against $H_0$, though it does not give the chance that $H_0$ is true.'
        exemplars:
          - problem: 'A drug trial tests $H_0$ at the significance level $\alpha = 0.10$ and returns $p = 0.03$. What is the decision about $H_0$?'
            answer: 'reject'
            answer_contract: {"kind": "label", "options": [["reject", "reject h0", "rejects h0", "reject the null hypothesis", "reject the null", "we reject h0", "we reject the null hypothesis", "the test rejects h0"], ["fail to reject", "fail to reject h0", "do not reject", "do not reject h0", "cannot reject", "fail to reject the null hypothesis", "do not reject the null hypothesis", "we fail to reject h0"]]}
            solution_sketch: 'The rule is to reject $H_0$ when $p \le \alpha$. Here $0.03 \le 0.10$, so the test rejects $H_0$.'
          - problem: 'A coin-flip experiment tests $H_0$ at $\alpha = 0.01$ and gets $p = 0.07$. What is the decision about $H_0$?'
            answer: 'fail to reject'
            answer_contract: {"kind": "label", "options": [["reject", "reject h0", "rejects h0", "reject the null hypothesis", "reject the null", "we reject h0", "we reject the null hypothesis", "the test rejects h0"], ["fail to reject", "fail to reject h0", "do not reject", "do not reject h0", "cannot reject", "fail to reject the null hypothesis", "do not reject the null hypothesis", "we fail to reject h0"]]}
            solution_sketch: 'The p-value 0.07 is larger than $\alpha = 0.01$. The data are not rare enough, so the test fails to reject $H_0$. This does not prove that $H_0$ is true.'
          - problem: 'Five clinics test the mean waiting time at the level $\alpha = 0.05$, and the p-values are 0.011, 0.049, 0.062, 0.073 and 0.19. Which p-values lead to the rejection of the null hypothesis?'
            answer: '0.011, 0.049'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A test rejects $H_0$ when its p-value is at most 0.05. Only 0.011 and 0.049 are at most 0.05, while 0.062, 0.073 and 0.19 are larger.'
          - problem: 'A significance test at the level $\alpha = 0.05$ ended with the decision to fail to reject $H_0$. What must be true of its p-value?'
            answer: 'p > 0.05'
            answer_contract: {"kind": "inequality_union"}
            solution_sketch: 'The test rejects $H_0$ when $p \le 0.05$. It failed to reject, so the p-value must be larger than 0.05, which is $p > 0.05$.'
          - problem: 'A battery-life study runs four tests of $H_0$ at the level $\alpha = 0.01$, and the p-values are 0.004, 0.012, 0.031 and 0.10. Which p-values lead to a failure to reject the null hypothesis?'
            answer: '0.012, 0.031, 0.10'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A test rejects $H_0$ only when its p-value is at most 0.01. Only 0.004 passes this rule, so the tests with 0.012, 0.031 and 0.10 fail to reject $H_0$.'
          - problem: 'A test of a new fertilizer gives $p = 0.048$. At which of the levels 0.01, 0.05 and 0.10 does the test reject $H_0$?'
            answer: '0.05, 0.10'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The test rejects $H_0$ at every level $\alpha$ with $0.048 \le \alpha$. This holds for 0.05 and 0.10, but not for 0.01.'
          - problem: 'A reading programme is tested and the p-value is $0.031$. What is the smallest of the levels 0.01, 0.025, 0.05 and 0.10 at which the test rejects $H_0$?'
            answer: '0.05'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The test rejects $H_0$ when $0.031 \le \alpha$. The levels 0.01 and 0.025 are below 0.031, so the smallest level that rejects is 0.05.'
        constraints: 'explicit p and alpha; answers use reject / fail to reject, never accept H0'
    diagnostic_exemplar:
      problem: 'Packets should average $\mu = 250$ g. A sample of $n = 36$ packets gives a mean $2.5$ SEs below $250$. For a two-sided test at $\alpha = 0.05$: state the hypotheses, approximate the p-value with the empirical rule, and give the decision.'
      answer: '$H_0: \mu = 250$ vs $H_1: \mu \ne 250$; a mean at least $2.5$ SEs out is rarer than the $5\%$ chance of $2$ SEs, so $p < 0.05$ — reject $H_0$.'
      solution_sketch: 'State $H_0$ (the no-effect claim) against a two-sided $H_1$, then judge the observed distance against the empirical rule''s benchmark: $2$ SEs out already leaves only $5\%$, so $2.5$ SEs is rarer still and $p < \alpha$.'
    anki_seeds:
      - front: 'p-value?'
        back: 'The probability, assuming $H_0$, of data at least as extreme as what was observed.'
        type: basic
      - front: 'Decision rule at significance level $\alpha$?'
        back: 'Reject $H_0$ when $p \le \alpha$; otherwise fail to reject.'
        type: basic
      - front: 'Why say "fail to reject $H_0$" instead of "accept $H_0$"?'
        back: 'A large p-value shows the data are consistent with $H_0$, not that $H_0$ is true.'
        type: basic

  - id: type-i-ii-errors
    name: "Type I & II Errors"
    core: true                 # alpha and the error trade-off are machinery every downstream test topic uses
    difficulty: 0.55
    drill: false
    answer_kind: multi-step
    expected_time_secs: 150
    prerequisites:
      - id: hypothesis-tests-logic
        weight: 0.8
        key: true
      - id: conditional-probability
        weight: 0.4
        key: false
    knowledge_points:
      - id: kp1
        name: 'Naming the two errors'
        key_prerequisites: [hypothesis-tests-logic]
        step_check:
          step: 'A Type I error is the rejection of an $H_0$ that is true.'
          question: 'Why is a ringing alarm with no fire a Type I error?'
          options:
            - 'The alarm keeps "no fire" although a fire is burning'
            - 'The alarm rings less often than a real fire would need'
            - 'The alarm rejects "no fire" while "no fire" is true'
            - 'Every false alarm is a Type II error by definition'
          answer: 'The alarm rejects "no fire" while "no fire" is true'
          why: 'The null hypothesis says that there is no fire. The alarm acts against it while it is true, and that is the Type I error.'
        exemplars:
          - problem: 'A smoke alarm rings although there is no fire. Take $H_0$ to be "there is no fire". What kind of outcome is this?'
            answer: 'Type I'
            answer_contract: {"kind": "label", "options": [["Type I", "type 1", "type i error", "a type i error", "type one", "type 1 error", "a type 1 error", "type one error"], ["Type II", "type 2", "type ii error", "a type ii error", "type two", "type 2 error", "a type 2 error", "type two error"], ["no error", "correct decision", "a correct decision", "not an error"]]}
            solution_sketch: 'The ringing alarm acts as a rejection of $H_0$. There is no fire, so $H_0$ is true, and the rejection of a true $H_0$ is a Type I error.'
          - problem: 'A lab screening returns a negative result for a patient who has the illness. The screening uses $H_0$: "the patient is free of the illness". What kind of outcome is this?'
            answer: 'Type II'
            answer_contract: {"kind": "label", "options": [["Type I", "type 1", "type i error", "a type i error", "type one", "type 1 error", "a type 1 error", "type one error"], ["Type II", "type 2", "type ii error", "a type ii error", "type two", "type 2 error", "a type 2 error", "type two error"], ["no error", "correct decision", "a correct decision", "not an error"]]}
            solution_sketch: 'The negative result keeps $H_0$. The patient has the illness, so $H_0$ is false, and keeping a false $H_0$ is a Type II error.'
          - problem: 'A factory checks each batch with $H_0$: "the batch meets the specification". The outcomes are: (1) the batch is cleared and it meets the specification; (2) the batch is cleared but it falls short; (3) the batch is scrapped and it falls short; (4) the batch is scrapped though it meets the specification. Which outcome is a Type I error?'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A Type I error rejects an $H_0$ that is true. In (4) the batch is scrapped, which rejects $H_0$, although it meets the specification, so $H_0$ is true.'
          - problem: 'A spam filter examines each message with $H_0$: "the message is legitimate". The outcomes are: (1) delivered and legitimate; (2) delivered but spam; (3) blocked and spam; (4) blocked though legitimate; (5) delivered although it is a scam. Which outcomes are Type II errors?'
            answer: '2, 5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A Type II error keeps an $H_0$ that is false. Delivered spam keeps $H_0$ although the message is not legitimate, which gives (2) and (5). Outcome (1) keeps a true $H_0$, so it is correct.'
          - problem: 'A scanner at an airport checks bags with $H_0$: "the bag holds no banned item". The outcomes are: (1) the bag passes and holds no banned item; (2) the bag passes but holds a banned item; (3) the bag is searched and holds a banned item; (4) the bag is searched though it holds no banned item; (5) the bag passes although it hides a knife. Which outcomes are errors of either type?'
            answer: '2, 4, 5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Outcomes (2) and (5) keep a false $H_0$, which is a Type II error. Outcome (4) rejects a true $H_0$, which is a Type I error. Outcomes (1) and (3) are correct decisions.'
          - problem: 'A casino tests its dice with $H_0$: "the die is fair". The outcomes are: (1) the die is declared fair and it is fair; (2) the die is declared fair but it is loaded; (3) the die is declared loaded and it is loaded; (4) the die is declared loaded though it is fair; (5) the die is declared crooked although it is fair. Which outcomes are Type I errors?'
            answer: '4, 5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A Type I error rejects an $H_0$ that is true. In (4) and (5) the die is declared against $H_0$ although it is fair, so both outcomes are Type I errors.'
        constraints: 'H0 is always stated explicitly in the scenario; answers name the type or list the lettered outcomes'
      - id: kp2
        name: 'The significance level is P(Type I)'
        key_prerequisites: [hypothesis-tests-logic, conditional-probability]
        step_check:
          step: 'The significance level $\alpha$ is the probability of rejecting $H_0$ when $H_0$ is true.'
          question: 'Why does $\alpha$ equal the probability of a Type I error?'
          options:
            - 'Both are the chance of rejecting a true $H_0$ outright'
            - 'Both are the chance of keeping $H_0$ while $H_0$ is false'
            - 'Both are computed on the assumption that $H_1$ is true'
            - 'Both are always equal to the power of the test'
          answer: 'Both are the chance of rejecting a true $H_0$ outright'
          why: 'A Type I error is the rejection of a true $H_0$, and $\alpha$ is the chance that the test rejects when $H_0$ is true. These are one event.'
        exemplars:
          - problem: 'Under $H_0$ a test statistic $X$ takes the values 1, 2 and 3 with probabilities 0.90, 0.05 and 0.05. The test rejects $H_0$ when $X$ is 2 or 3. If $H_0$ is true, what is the probability of a Type I error?'
            answer: '0.10'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A Type I error is a rejection while $H_0$ is true. Under $H_0$ the rejection region has probability $0.05 + 0.05 = 0.10$.'
          - problem: 'A researcher lowers the significance level of a test and keeps the sample size, so that the test rejects $H_0$ less often. What happens to the chance of a Type II error?'
            answer: 'increases'
            answer_contract: {"kind": "label", "options": [["increases", "it increases", "goes up", "rises", "larger", "it gets larger"], ["decreases", "it decreases", "goes down", "falls", "smaller", "it gets smaller"], ["stays the same", "no change", "it stays the same", "unchanged"]]}
            solution_sketch: 'A test that rejects less often also misses more false null hypotheses. So the chance of a Type II error increases.'
          - problem: 'Under $H_0$ a sensor statistic $Y$ takes the values 0, 1 and 2 with probabilities 0.99, 0.005 and 0.005. The test rejects $H_0$ when $Y$ is 1 or 2. If $H_0$ is true, what is the probability of a Type I error?'
            answer: '0.01'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A Type I error is a rejection while $H_0$ is true. Here the probability is $0.005 + 0.005 = 0.01$, so the significance level is 0.01.'
          - problem: 'A factory runs a test with $\alpha = 0.05$ on 200 batches that all meet the specification. On average, how many of these batches does the test wrongly reject?'
            answer: '10'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Each good batch is rejected with probability $\alpha = 0.05$. For 200 batches the average count is $200 \cdot 0.05 = 10$.'
          - problem: 'Under $H_0$ a test statistic $Z$ takes the values 0, 1, 2 and 3 with probabilities 0.85, 0.10, 0.03 and 0.02. The test rejects $H_0$ when $Z$ is 2 or 3. What is the significance level of this test?'
            answer: '0.05'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The significance level is the probability of rejecting $H_0$ while $H_0$ is true. It is $0.03 + 0.02 = 0.05$.'
          - problem: 'A test with $\alpha = 0.01$ is run on many batches that all meet the specification. How many batches must be tested to expect 6 wrong rejections?'
            answer: '600'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Each batch is wrongly rejected with probability 0.01. To expect 6 wrong rejections divide: $6 \div 0.01 = 600$ batches.'
          - problem: 'A researcher raises $\alpha$ from 0.05 to 0.10 to make Type II errors less likely. Among 300 tests where $H_0$ is true, how many more wrong rejections are expected?'
            answer: '15'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The expected count of wrong rejections is $300 \cdot 0.10 = 30$ now, against $300 \cdot 0.05 = 15$ before. That is 15 more wrong rejections.'
          - problem: 'A test uses $\alpha = 0.10$. The researcher halves $\alpha$. What is the new probability of a Type I error?'
            answer: '0.05'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The significance level is the probability of a Type I error. Half of 0.10 is 0.05, so the new probability is 0.05.'
        constraints: 'alpha in {0.01, 0.05, 0.10}; trade-off items state the effect on the other error type; expected-count items multiply or divide by alpha'
      - id: kp3
        name: 'Power and the cost of each error'
        key_prerequisites: [hypothesis-tests-logic]
        step_check:
          step: 'The power is the probability of rejecting $H_0$ when it is false, which is $1 - \beta$.'
          question: 'Why does the power of a test equal $1 - \beta$?'
          options:
            - 'Power and $\beta$ are two names for the same probability'
            - 'Power is the share of tests that reject a true $H_0$'
            - 'Power is the probability of a Type I error, and $\beta$ is $1 - \alpha$'
            - 'With $H_0$ false the test rejects it (power) or keeps it ($\beta$)'
          answer: 'With $H_0$ false the test rejects it (power) or keeps it ($\beta$)'
          why: 'If $H_0$ is false, the test has two outcomes only: reject it or keep it. Their probabilities add to 1, so the power is $1 - \beta$.'
        exemplars:
          - problem: 'In a test of a new battery the probability of a Type II error is $\beta = 0.16$. What is the power of the test?'
            answer: '0.84'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The power is the probability of rejecting a false $H_0$, which is $1 - \beta$. So the power is $1 - 0.16 = 0.84$.'
          - problem: 'A city tests $H_0$: "the water supply is safe". A Type I error closes a safe supply. A Type II error lets unsafe water pass. Which error is more costly?'
            answer: 'Type II'
            answer_contract: {"kind": "label", "options": [["Type II", "type 2", "type ii error", "the type ii error", "type two", "type 2 error", "a type ii error", "a type 2 error"], ["Type I", "type 1", "type i error", "the type i error", "type one", "type 1 error", "a type i error", "a type 1 error"]]}
            solution_sketch: 'A Type II error lets unsafe water pass and may harm people. A Type I error only closes a safe supply for a while. So the Type II error is the more costly one.'
          - problem: 'A test of the water supply has $\beta = 0.20$. What is the power of the test?'
            answer: '0.8'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The power is $1 - \beta = 1 - 0.20 = 0.80$. So the test detects an unsafe supply with probability 0.8.'
          - problem: 'A researcher wants more power but does not want to change the significance level. Which change helps: a larger sample, a smaller sample, a higher significance level only, or a smaller effect?'
            answer: 'a larger sample'
            answer_contract: {"kind": "label", "options": [["a larger sample", "larger sample", "use a larger sample", "increase the sample size", "more data", "larger sample size", "a bigger sample", "bigger sample"], ["a smaller sample", "smaller sample", "use a smaller sample", "decrease the sample size"], ["a higher significance level only", "raise alpha", "raise the significance level"], ["a smaller effect", "reduce the effect size", "smaller effect size"]]}
            solution_sketch: 'A larger sample reduces the standard error, so a false $H_0$ is rejected more often. The other three changes lower the power or change the level.'
          - problem: 'The power of a test is 0.93. What is $\beta$, the probability of a Type II error?'
            answer: '0.07'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The power of a test is $1 - \beta$ by definition. So the Type II error probability is $\beta = 1 - 0.93 = 0.07$.'
          - problem: 'A court tests $H_0$: "the defendant is innocent" at $\alpha = 0.05$, and the test has power 0.90. What is the probability that the test frees a guilty person?'
            answer: '0.1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Freeing a guilty person keeps a false $H_0$, which is a Type II error. Its probability is $\beta = 1 - 0.90 = 0.10$.'
          - problem: 'A test has $\beta = 0.25$. What is the power of the test?'
            answer: '3/4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The power is $1 - \beta = 1 - 1/4 = 3/4$. This is the same as 0.75.'
          - problem: 'A screening test has power 0.85. Of 200 patients who have the illness, how many does the test detect on average?'
            answer: '170'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Each patient with the illness is detected with probability 0.85. For 200 patients the average is $200 \cdot 0.85 = 170$.'
          - problem: 'A test has power 0.8 and detects 48 real effects on average. How many real effects were there in all?'
            answer: '60'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The test detects 0.8 of the real effects. So the number of real effects is $48 \div 0.8 = 60$.'
        constraints: 'power computed only via 1 - beta; context items weigh the real-world cost of each error or use the power as a rate'
    diagnostic_exemplar:
      problem: 'A factory tests each batch with $H_0$: "the batch meets the specification", at $\alpha = 0.01$, and the test has Type II error probability $\beta = 0.15$. Describe a Type I and a Type II error in context, give the probability of a Type I error when $H_0$ is true, and give the power of the test.'
      answer: 'Type I: rejecting a good batch — probability 0.01 (the significance level); Type II: passing a batch that violates the specification; power = 1 - β = 0.85'
      solution_sketch: '$\alpha$ is exactly $P(\text{reject } H_0 \mid H_0 \text{ true})$, and power $= 1 - \beta$.'
    anki_seeds:
      - front: 'Type I vs Type II error?'
        back: 'Type I: reject a true $H_0$. Type II: fail to reject a false $H_0$.'
        type: basic
      - front: '$\alpha$ is the probability of which error?'
        back: 'Type I (computed assuming $H_0$ is true).'
        type: basic
      - front: 'Power of a test?'
        back: '$1 - \beta$: the probability of rejecting $H_0$ when it is false.'
        type: basic

  - id: one-sample-z-test
    name: "One-Sample z-Test for a Mean"
    core: true                 # the template the t-test (and slope inference) instantiates
    difficulty: 0.6
    drill: false
    answer_kind: multi-step
    expected_time_secs: 240
    prerequisites:
      - id: hypothesis-tests-logic
        weight: 0.8
        key: true
      - id: standard-error
        weight: 0.6
        key: true
      - id: type-i-ii-errors
        weight: 0.4
        key: false
      - id: normal-distribution
        weight: 0.4
        key: false
    knowledge_points:
      - id: kp1
        name: 'Computing the z statistic'
        key_prerequisites: [standard-error, hypothesis-tests-logic]
        step_check:
          step: 'Divide the difference $\bar{x} - \mu_0$ by the standard error $\sigma / \sqrt{n}$ to get $z$.'
          question: 'Why do we divide $\bar{x} - \mu_0$ by the standard error?'
          options:
            - 'It turns the difference into a probability between 0 and 1'
            - 'It makes the sample mean equal to the null mean'
            - 'It removes the units, because only $\sigma$ has units'
            - 'It counts the distance in standard errors of the mean'
          answer: 'It counts the distance in standard errors of the mean'
          why: 'A sample mean varies by about one standard error. Dividing by it tells us how many standard errors the sample mean is from $\mu_0$.'
        exemplars:
          - problem: 'A machine is set to fill tins with a mean of 40 g, and the known population standard deviation is 15 g. A sample of $n = 25$ tins has mean 46 g. What is the z statistic for the test of $H_0: \mu = 40$?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The standard error is $15 / \sqrt{25} = 3$. So $z = (46 - 40) / 3 = 2$.'
          - problem: 'A quality check tests the null mean 120 with known population standard deviation 18. A sample of $n = 36$ has mean 111. What is the z statistic?'
            answer: '-3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The standard error is $18 / \sqrt{36} = 3$. So $z = (111 - 120) / 3 = -3$, and the sample mean is below the null mean.'
          - problem: 'A bottling plant tests the null mean 250 mL with known population standard deviation 20 mL. A sample of $n = 100$ bottles has mean 252 mL. What is the z statistic?'
            answer: '1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The standard error is $20 / \sqrt{100} = 2$. So $z = (252 - 250) / 2 = 1$.'
          - problem: 'A cereal box check tests the null mean 64 g with known population standard deviation 21 g. A sample of $n = 49$ boxes has mean 58 g. What is the z statistic?'
            answer: '-2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The standard error is $21 / \sqrt{49} = 3$. So $z = (58 - 64) / 3 = -2$.'
          - problem: 'A lab tests the null mean 300 units with known population standard deviation 25 units. A sample of $n = 25$ has mean 315 units. What is the z statistic?'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The standard error is $25 / \sqrt{25} = 5$. So $z = (315 - 300) / 5 = 3$.'
          - problem: 'A reaction-time study tests the null mean 45 ms with known population standard deviation 16 ms. A sample of $n = 64$ has mean 43 ms. What is the z statistic?'
            answer: '-1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The standard error is $16 / \sqrt{64} = 2$. So $z = (43 - 45) / 2 = -1$.'
          - problem: 'A filling line has known population standard deviation 12 mL. The mean of a sample of $n = 36$ bottles is 3 mL above the null mean. What is the z statistic?'
            answer: '3/2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The standard error is $12 / \sqrt{36} = 2$. So $z = 3 / 2$, which is 1.5 standard errors above the null mean.'
        constraints: 'sigma known and stated; n a perfect square; z comes out to halves or whole numbers'
      - id: kp2
        name: 'Decision by critical value'
        key_prerequisites: [hypothesis-tests-logic, normal-distribution]
        step_check:
          step: 'Reject $H_0$ because $z$ is in the direction $H_1$ predicts and $|z| > |z^*|$'
          question: 'Why does the test reject $H_0$ when $z = -1.7$ and $z^* = -1.645$?'
          options:
            - 'Any negative value of $z$ leads to the rejection of $H_0$'
            - 'A one-sided test rejects $H_0$ only when $z$ is positive'
            - 'The statistic is beyond $z^*$ on the side $H_1$ predicts'
            - 'The size of $-1.7$ is smaller than the size of $1.645$'
          answer: 'The statistic is beyond $z^*$ on the side $H_1$ predicts'
          why: 'Both conditions hold: $z$ is on the low side that $H_1$ predicts, and it lies beyond the critical value $-1.645$.'
        exemplars:
          - problem: 'A two-sided z-test of $H_0: \mu = 45$ against $H_1: \mu \ne 45$ runs at $\alpha = 0.05$ with the critical value $z^* = 2$. A sample of $n = 36$ batteries has mean life 46.5 hours, and the population standard deviation is 3 hours. Does the test reject $H_0$?'
            answer: 'reject'
            answer_contract: {"kind": "label", "options": [["reject", "reject h0", "rejects h0", "reject the null hypothesis", "reject the null", "we reject h0", "we reject the null hypothesis", "the test rejects h0"], ["fail to reject", "fail to reject h0", "do not reject", "do not reject h0", "cannot reject", "fail to reject the null hypothesis", "do not reject the null hypothesis", "we fail to reject h0"]]}
            solution_sketch: 'The standard error is $3 / \sqrt{36} = 0.5$. So $z = (46.5 - 45) / 0.5 = 3$, which is larger than the critical value 2, and the test rejects $H_0$.'
          - problem: 'A two-sided z-test of $H_0: \mu = 405$ g runs at $\alpha = 0.05$ with the critical value $z^* = 2$. A sample of $n = 25$ cereal boxes has mean mass 404 g, and the population standard deviation is 5 g. Does the test reject $H_0$?'
            answer: 'fail to reject'
            answer_contract: {"kind": "label", "options": [["reject", "reject h0", "rejects h0", "reject the null hypothesis", "reject the null", "we reject h0", "we reject the null hypothesis", "the test rejects h0"], ["fail to reject", "fail to reject h0", "do not reject", "do not reject h0", "cannot reject", "fail to reject the null hypothesis", "do not reject the null hypothesis", "we fail to reject h0"]]}
            solution_sketch: 'The standard error is $5 / \sqrt{25} = 1$, so $z = (404 - 405) / 1 = -1$. Since $|z| = 1$ is not larger than 2, the test fails to reject $H_0$.'
          - problem: 'An upper-tailed z-test of $H_0: \mu = 12$ against $H_1: \mu > 12$ runs at $\alpha = 0.10$ with the critical value $z^* = 1.28$. For which values of the test statistic $z$ does the test reject $H_0$?'
            answer: 'z > 1.28'
            answer_contract: {"kind": "inequality_union"}
            solution_sketch: 'The test is upper-tailed, so it rejects $H_0$ when $z$ lies beyond the critical value on the upper side. That is $z > 1.28$.'
          - problem: 'A two-sided z-test of $H_0: \mu = 100$ runs at $\alpha = 0.05$ with the critical value $z^* = 2$. The sample size is $n = 36$ and the population standard deviation is 12. For which values of the sample mean $x$ does the test reject $H_0$?'
            answer: 'x < 96 or x > 104'
            answer_contract: {"kind": "inequality_union"}
            solution_sketch: 'The standard error is $12 / \sqrt{36} = 2$. The test rejects when $x$ is more than $2 \cdot 2 = 4$ from 100, so $x < 96$ or $x > 104$.'
          - problem: 'A supplier claims that its delivery time has the mean 40 minutes. An upper-tailed z-test of $H_0: \mu = 40$ against $H_1: \mu > 40$ runs at $\alpha = 0.01$ with the critical value $z^* = 2.33$. The sample size is $n = 64$ and the population standard deviation is 8 minutes. For which sample mean is the test statistic exactly equal to the critical value, to two decimal places?'
            answer: '42.33'
            answer_contract: {"kind": "approx", "decimals": 2}
            solution_sketch: 'The standard error is $8 / \sqrt{64} = 1$. Solve $(\bar{x} - 40) / 1 = 2.33$, so $\bar{x} = 40 + 2.33 = 42.33$.'
          - problem: 'A freezer thermostat is set to $-5$ degrees Celsius. A lower-tailed z-test of $H_0: \mu = -5$ against $H_1: \mu < -5$ runs at $\alpha = 0.05$ with the critical value $z^* = -1.645$. The sample size is $n = 100$ and the population standard deviation is 10. For which sample mean is the test statistic exactly equal to the critical value, to three decimal places?'
            answer: '-6.645'
            answer_contract: {"kind": "approx", "decimals": 3}
            solution_sketch: 'The standard error is $10 / \sqrt{100} = 1$. Solve $(\bar{x} + 5) / 1 = -1.645$, so $\bar{x} = -5 - 1.645 = -6.645$.'
          - problem: 'A lower-tailed z-test of $H_1: \mu < \mu_0$ runs at $\alpha = 0.05$ with the critical value $z^* = -1.645$. Which of the test statistics $-1.2$, $-1.6$, $-1.7$ and $-2.3$ lead to the rejection of $H_0$?'
            answer: '-1.7, -2.3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The test rejects $H_0$ when $z$ lies below $-1.645$. Only $-1.7$ and $-2.3$ lie below this value, while $-1.2$ and $-1.6$ do not.'
        constraints: 'two-sided tests use z* = 2 (empirical-rule value); any one-sided or exact critical value is supplied in the problem'
      - id: kp3
        name: 'The full test with conclusion in context'
        key_prerequisites: [hypothesis-tests-logic, standard-error, type-i-ii-errors]
        step_check:
          step: 'The standard error is $8 / \sqrt{64} = 1$, so $z = (498 - 500) / 1 = -2$.'
          question: 'Why is the standard error of the mean of 64 boxes only 1 g, while one box varies by 8 g?'
          options:
            - 'A mean of 64 boxes varies less than one box does'
            - 'The standard error is always one-eighth of the sample size'
            - 'The standard deviation is divided by the sample size $64$ itself'
            - 'A sample of 64 boxes removes all variation in the filling line'
          answer: 'A mean of 64 boxes varies less than one box does'
          why: 'Highs and lows in a sample partly cancel in the mean. Its spread is $\sigma / \sqrt{n} = 8/8 = 1$ g.'
        exemplars:
          - problem: 'Concrete blocks are moulded to a target mass of 20 kg, and the process has $\sigma = 0.5$ kg. A sample of $n = 25$ blocks has mean mass 20.3 kg. A two-sided test of $H_0: \mu = 20$ at $\alpha = 0.05$ uses $z^* = 2$. Is there enough evidence that the mean mass differs from 20 kg?'
            answer: 'yes'
            answer_contract: {"kind": "label", "options": [["yes", "yes there is", "there is enough evidence", "enough", "reject"], ["no", "no there is not", "not enough evidence", "not enough", "fail to reject"]]}
            solution_sketch: 'The standard error is $0.5 / \sqrt{25} = 0.1$, so $z = (20.3 - 20) / 0.1 = 3$. Since $3 > 2$, the test rejects $H_0$ and there is enough evidence.'
          - problem: 'Boxes of cereal are labelled 500 g, and the filling line has $\sigma = 8$ g. A sample of $n = 64$ boxes has mean fill 498 g. What is the z statistic for the test of $H_0: \mu = 500$ against $H_1: \mu < 500$?'
            answer: '-2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The standard error is $8 / \sqrt{64} = 1$. So $z = (498 - 500) / 1 = -2$.'
          - problem: 'Batteries are advertised to run for 40 hours, and the production line has $\sigma = 6$ hours. A sample of $n = 36$ batteries runs for a mean of 41 hours. Test $H_0: \mu = 40$ against $H_1: \mu > 40$ at $\alpha = 0.05$ with $z^* = 1.645$. Is there enough evidence that the batteries last longer than advertised?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "yes there is", "there is enough evidence", "enough", "reject"], ["no", "no there is not", "not enough evidence", "not enough", "fail to reject"]]}
            solution_sketch: 'The standard error is $6 / \sqrt{36} = 1$, so $z = (41 - 40) / 1 = 1$. Since $1 < 1.645$, the test fails to reject $H_0$, so there is not enough evidence.'
          - problem: 'A bottling plant claims that each bottle holds 750 mL, and the filler has $\sigma = 5$ mL. For a sample of $n = 100$ bottles, the test of $H_0: \mu = 750$ against $H_1: \mu < 750$ gives $z = -2$. What is the sample mean?'
            answer: '749'
            answer_contract: {"kind": "unit", "quantity": "volume", "unit": "ml", "allow_omitted": true}
            solution_sketch: 'The standard error is $5 / \sqrt{100} = 0.5$. Then $\bar{x} = 750 + (-2)(0.5) = 749$ mL.'
          - problem: 'A two-sided z-test of $H_0: \mu = 250$ g at $\alpha = 0.05$ uses $z^* = 2$, with $\sigma = 6$ g and $n = 36$. What sample mean lies exactly on the upper boundary of the rejection region?'
            answer: '252'
            answer_contract: {"kind": "unit", "quantity": "mass", "unit": "g", "allow_omitted": true}
            solution_sketch: 'The standard error is $6 / \sqrt{36} = 1$. The upper boundary is where $z = 2$, so $\bar{x} = 250 + 2 \cdot 1 = 252$ g.'
          - problem: 'A sample of $n = 25$ rods has mean length 74.3 cm. The two-sided test of $H_0: \mu = 75$ with $z^* = 2$ gives $z = -1$. What is the population standard deviation $\sigma$?'
            answer: '7/2'
            answer_contract: {"kind": "unit", "quantity": "length", "unit": "cm", "allow_omitted": true}
            solution_sketch: 'We have $-1 = (74.3 - 75) / (\sigma / 5)$, so $\sigma / 5 = 0.7$. Then $\sigma = 3.5 = 7/2$ cm.'
          - problem: 'Cement sacks are labelled 25 kg, and the process has $\sigma = 0.4$ kg. A sample of $n = 16$ sacks has mean 24.7 kg. Use the empirical rule to estimate the p-value of the two-sided test of $H_0: \mu = 25$, to three decimal places.'
            answer: '0.003'
            answer_contract: {"kind": "approx", "decimals": 3}
            solution_sketch: 'The standard error is $0.4 / \sqrt{16} = 0.1$, so $z = (24.7 - 25) / 0.1 = -3$. A value 3 standard errors away has a two-sided p-value of about 0.003.'
          - problem: 'A population has $\sigma = 6$ g. What sample size $n$ gives a standard error of 1.5 g?'
            answer: '16'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The standard error is $\sigma / \sqrt{n}$, so $6 / \sqrt{n} = 1.5$. Then $\sqrt{n} = 4$ and $n = 16$.'
        constraints: 'metric contexts; conclusions restate the decision in the scenario; empirical-rule p-values (0.32, 0.05, 0.003) quoted when |z| lands on 1, 2, or 3'
    diagnostic_exemplar:
      problem: 'Cement sacks are labelled $25$ kg and the process has $\sigma = 0.4$ kg. A sample of $n = 16$ sacks has $\bar{x} = 24.7$ kg. Test $H_0: \mu = 25$ against $H_1: \mu \ne 25$ at $\alpha = 0.05$ ($z^* = 2$). Give $z$, the decision, and a conclusion in context.'
      answer: '$\operatorname{SE} = 0.4/4 = 0.1$; $z = -3$; $|-3| > 2$, so reject $H_0$ — strong evidence the sacks are underfilled ($p \approx 0.003$).'
      solution_sketch: 'The $\sigma$-known case: $\operatorname{SE} = \sigma/\sqrt{n}$, $z = (\bar x - \mu_0)/\operatorname{SE}$, and reject when $|z|$ exceeds the supplied $z^* = 2$. Finish in context — say what it means for the sacks, not merely that $H_0$ is rejected.'
    anki_seeds:
      - front: 'One-sample z statistic?'
        back: '$z = \dfrac{\bar{x} - \mu_0}{\sigma/\sqrt{n}}$.'
        type: basic
      - front: 'Two-sided rejection rule at $\alpha = 0.05$ (empirical rule)?'
        back: 'Reject when $|z| > 2$ (exact value: $1.96$).'
        type: basic

  - id: one-proportion-z-test
    name: "One-Proportion z-Test"
    core: false                # terminal inference destination, like chi-square-goodness-of-fit; nothing downstream builds on it
    difficulty: 0.65
    drill: false
    answer_kind: multi-step
    expected_time_secs: 240
    prerequisites:
      - id: sample-proportions
        weight: 0.7
        key: true
      - id: one-sample-z-test
        weight: 0.7
        key: true
      - id: hypothesis-tests-logic
        weight: 0.4
        key: false
      - id: confidence-intervals
        weight: 0.4
        key: false
    knowledge_points:
      - id: kp1
        name: 'Hypotheses about p and the normal-approximation conditions'
        key_prerequisites: [hypothesis-tests-logic, sample-proportions]
        step_check:
          step: 'Both $np_0$ and $n(1 - p_0)$ must be at least 10 so that $\hat{p}$ is close to normal.'
          question: 'Why do the conditions use $p_0$ and not $\hat{p}$?'
          options:
            - 'The sample proportion $\hat{p}$ is always equal to $p_0$'
            - 'Under $H_0$ the proportion is $p_0$, so $p_0$ is used'
            - 'Using $\hat{p}$ would change the sample size $n$'
            - 'The value $p_0$ is the only one that is at least 10'
          answer: 'Under $H_0$ the proportion is $p_0$, so $p_0$ is used'
          why: 'The test works under the assumption that $H_0$ is true. Under $H_0$ the success proportion is $p_0$, so $p_0$ decides how spread out $\hat{p}$ is.'
        exemplars:
          - problem: 'A die is suspected of being biased. It will be rolled 120 times, and $p$ is the probability of a six. If $H_0: p = 1/6$ holds, how many sixes are expected in 120 rolls?'
            answer: '20'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The expected count under $H_0$ is $np_0 = 120 \cdot 1/6 = 20$. This is one of the two numbers used to check the normal approximation.'
          - problem: 'A supplier claims that at most 10% of its parts are defective, but an inspector suspects that the defect rate is higher. The inspector will examine $n = 250$ parts. To check the normal approximation, what is the smaller of $np_0$ and $n(1 - p_0)$?'
            answer: '25'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The null value is $p_0 = 0.1$. So $np_0 = 250 \cdot 0.1 = 25$ and $n(1 - p_0) = 250 \cdot 0.9 = 225$. The smaller number is 25, which is at least 10.'
          - problem: 'A package insert says that a mild side effect occurs with probability 0.02. A researcher will observe $n = 400$ patients to test $H_0: p = 0.02$. The normal approximation needs $np_0 \ge 10$ and $n(1 - p_0) \ge 10$. Are both conditions met?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "yes they are met", "both are met", "met"], ["no", "no they are not met", "not met", "one fails"]]}
            solution_sketch: 'We have $np_0 = 400 \cdot 0.02 = 8$, which is below 10. So one condition fails and the answer is no.'
          - problem: 'A candidate claims that 40% of voters support her, but an opponent suspects that the support is lower. Let $p$ be the true proportion of supporters. What is the alternative hypothesis?'
            answer: 'p < 0.4'
            answer_contract: {"kind": "inequality_union"}
            solution_sketch: 'The suspicion is a lower proportion. So the alternative hypothesis is $p < 0.4$, and the null hypothesis is $p = 0.4$.'
          - problem: 'A spinner is claimed to land on red with probability 1/4. It will be spun $n = 80$ times. To check the normal approximation, what is $n(1 - p_0)$?'
            answer: '60'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The null value is $p_0 = 1/4$. So $n(1 - p_0) = 80 \cdot 3/4 = 60$. This is at least 10, and so is $np_0 = 80 \cdot 1/4 = 20$.'
          - problem: 'A restaurant claims that 75% of its customers prefer a new menu, but a manager suspects that the proportion is lower. She will ask $n = 40$ customers. The normal approximation needs $np_0 \ge 10$ and $n(1 - p_0) \ge 10$. Are both conditions met?'
            answer: 'yes'
            answer_contract: {"kind": "label", "options": [["yes", "yes they are met", "both are met", "met"], ["no", "no they are not met", "not met", "one fails"]]}
            solution_sketch: 'We have $np_0 = 40 \cdot 0.75 = 30$ and $n(1 - p_0) = 40 \cdot 0.25 = 10$. Both are at least 10, so the answer is yes.'
          - problem: 'A school says that at most 8% of its pupils arrive late, but the head suspects that more arrive late. Let $p$ be the true proportion of late pupils. What is the alternative hypothesis?'
            answer: 'p > 0.08'
            answer_contract: {"kind": "inequality_union"}
            solution_sketch: 'The suspicion is a higher proportion. So the alternative hypothesis is $p > 0.08$, and the null hypothesis is $p = 0.08$.'
          - problem: 'A factory claims that 2% of its items are faulty. What is the smallest sample size $n$ for which $np_0$ reaches 10 when $H_0: p = 0.02$?'
            answer: '500'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'We need $n \cdot 0.02 \ge 10$. Divide both sides by 0.02: $n \ge 10 / 0.02 = 500$. The smallest sample size is 500.'
        constraints: 'hypotheses are about p, never about p-hat; np0 and n(1 - p0) computed explicitly against the >= 10 bar; one- vs two-sided read from the scenario'
      - id: kp2
        name: 'The z statistic for a proportion'
        key_prerequisites: [sample-proportions, one-sample-z-test]
        step_check:
          step: 'Use $p_0$ in the standard error, and divide the difference $\hat{p} - p_0$ by it.'
          question: 'Why does the standard error of the test use $p_0$ and not $\hat{p}$?'
          options:
            - 'The test compares the sample with what $H_0$ expects'
            - 'The value $\hat{p}$ can be zero, and then the formula gives 0'
            - 'The value $p_0$ is the proportion seen in the sample'
            - 'The standard error must not depend on the sample size'
          answer: 'The test compares the sample with what $H_0$ expects'
          why: 'The test asks how unusual the sample is if $H_0$ is true. So the spread of $\hat{p}$ is worked out with the null value $p_0$.'
        exemplars:
          - problem: 'A factory claims that one fifth of its parts are defective. In a sample of 100 parts, 28 are defective. What is the z statistic for the test of $H_0: p = 1/5$?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The sample proportion is $\hat{p} = 28/100 = 0.28$. The standard error is $\sqrt{0.2 \cdot 0.8 / 100} = 0.04$, so $z = (0.28 - 0.2) / 0.04 = 2$.'
          - problem: 'A coin is suspected of bias. In 64 flips, 42 land heads. What is the z statistic for the test of $H_0: p = 1/2$?'
            answer: '5/2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The sample proportion is $\hat{p} = 42/64 = 21/32$. The standard error is $\sqrt{(1/4) / 64} = 1/16$, so $z = (21/32 - 1/2) / (1/16) = 5/2$.'
          - problem: 'For $H_0: p = 1/3$ with $n = 50$, the test statistic is $z = -2$. How many successes were in the sample?'
            answer: '10'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The standard error is $\sqrt{(1/3)(2/3) / 50} = 1/15$. So $\hat{p} = 1/3 - 2 \cdot 1/15 = 1/5$, and the number of successes is $50 \cdot 1/5 = 10$.'
          - problem: 'A survey tests $H_0: p = 2/5$ with $n = 150$ people. The sample proportion is 0.34. What is the z statistic?'
            answer: '-3/2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The standard error is $\sqrt{0.4 \cdot 0.6 / 150} = 0.04$. So $z = (0.34 - 0.4) / 0.04 = -3/2$.'
          - problem: 'A die is suspected of bias toward six. In 80 rolls a six appears 30 times. What is the z statistic for the test of $H_0: p = 1/6$?'
            answer: '5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The sample proportion is $30/80 = 3/8$. The standard error is $\sqrt{(1/6)(5/6) / 80} = 1/24$, so $z = (3/8 - 1/6) \cdot 24 = 5$.'
          - problem: 'A seed company claims that three quarters of its seeds germinate. In a sample of 48 seeds, 30 germinate. What is the z statistic for the test of $H_0: p = 3/4$?'
            answer: '-2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The sample proportion is $30/48 = 5/8$. The standard error is $\sqrt{(3/4)(1/4) / 48} = 1/16$, so $z = (5/8 - 3/4) \cdot 16 = -2$.'
          - problem: 'A web shop claims that one fifth of its visitors buy something. In a sample of 100 visitors, how many buyers give a z statistic of 3 for the test of $H_0: p = 1/5$?'
            answer: '32'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The standard error is $\sqrt{0.2 \cdot 0.8 / 100} = 0.04$. So $\hat{p} = 0.2 + 3 \cdot 0.04 = 0.32$, and the number of buyers is $100 \cdot 0.32 = 32$.'
        constraints: 'p0 a simple fraction with p0(1-p0)/n a perfect square of a fraction, so the SE is exact; the SE under H0 uses p0, never p-hat; z comes out to tenths, halves, or whole numbers; n is large enough that np0 and n(1 - p0) are at least 10'
      - id: kp3
        name: 'The full test, and the z-interval for p'
        key_prerequisites: [one-sample-z-test, confidence-intervals]
        step_check:
          step: 'The interval uses $\hat{p}$ in its standard error, but the test uses $p_0$.'
          question: 'Why does the interval use $\hat{p}$ in its standard error?'
          options:
            - 'The interval assumes a null value $p_0$ and then tests it'
            - 'The value $\hat{p}$ is always larger than the value $p_0$'
            - 'An interval needs a larger sample size than a test needs'
            - 'The interval has no claim $p_0$, so it uses the sample'
          answer: 'The interval has no claim $p_0$, so it uses the sample'
          why: 'A confidence interval estimates $p$ and tests no claim, so there is no null value. The sample proportion is the best guide to the spread.'
        exemplars:
          - problem: 'A spinner is claimed to land on red half of the time. In $n = 100$ spins, 58 land on red. A two-sided test of $H_0: p = 1/2$ at $\alpha = 0.05$ uses $z^* = 2$. Is there enough evidence that the spinner is not fair?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "yes there is", "there is enough evidence", "enough", "reject"], ["no", "no there is not", "not enough evidence", "not enough", "fail to reject"]]}
            solution_sketch: 'The standard error is $\sqrt{0.25 / 100} = 0.05$, so $z = (0.58 - 0.5) / 0.05 = 1.6$. Since $1.6 < 2$, the test fails to reject $H_0$ and the evidence is not enough.'
          - problem: 'A coin is checked for bias. In $n = 400$ flips it lands heads 230 times. What is the z statistic for the test of $H_0: p = 1/2$ against $H_1: p \ne 1/2$?'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The sample proportion is $230/400 = 0.575$. The standard error is $\sqrt{0.25 / 400} = 0.025$, so $z = (0.575 - 0.5) / 0.025 = 3$.'
          - problem: 'In a survey of $n = 100$ customers, 80 say that they are satisfied. Using $z^* = 2$, find the 95% confidence interval for the true proportion $p$ of satisfied customers.'
            answer: '0.72, 0.88'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The sample proportion is $\hat{p} = 0.8$. The standard error is $\sqrt{0.8 \cdot 0.2 / 100} = 0.04$, so the interval is $0.8 \pm 2 \cdot 0.04$, which is 0.72 to 0.88.'
          - problem: 'A seed company claims that 80% of its seeds germinate. In a test of $n = 200$ seeds, 150 germinate. What is the z statistic for the test of $H_0: p = 0.8$ against $H_1: p < 0.8$, to two decimal places?'
            answer: '-1.77'
            answer_contract: {"kind": "approx", "decimals": 2}
            solution_sketch: 'The sample proportion is $150/200 = 0.75$. The standard error under $H_0$ is $\sqrt{0.8 \cdot 0.2 / 200} \approx 0.0283$, so $z = (0.75 - 0.8) / 0.0283 \approx -1.77$.'
          - problem: 'A poll tests $H_0: p = 0.4$ against $H_1: p \ne 0.4$. In $n = 400$ responses, 184 are yes. What is the z statistic, to two decimal places?'
            answer: '2.45'
            answer_contract: {"kind": "approx", "decimals": 2}
            solution_sketch: 'The sample proportion is $184/400 = 0.46$. The standard error under $H_0$ is $\sqrt{0.4 \cdot 0.6 / 400} \approx 0.0245$, so $z = 0.06 / 0.0245 \approx 2.45$.'
          - problem: 'A website counts clicks on an ad. Of $n = 400$ visitors, 80 click it. Using $z^* = 2$, find the 95% confidence interval for the true click proportion $p$.'
            answer: '0.16, 0.24'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The sample proportion is $\hat{p} = 80/400 = 0.2$. The standard error is $\sqrt{0.2 \cdot 0.8 / 400} = 0.02$, so the interval is $0.2 \pm 2 \cdot 0.02$, which is 0.16 to 0.24.'
          - problem: 'A seed company claims that 80% of its seeds germinate. In a test of $n = 200$ seeds, 140 germinate. The test of $H_0: p = 0.8$ against $H_1: p < 0.8$ at $\alpha = 0.05$ uses $z^* = -1.645$. Is there enough evidence that fewer than 80% of the seeds germinate?'
            answer: 'yes'
            answer_contract: {"kind": "label", "options": [["yes", "yes there is", "there is enough evidence", "enough", "reject"], ["no", "no there is not", "not enough evidence", "not enough", "fail to reject"]]}
            solution_sketch: 'The sample proportion is $140/200 = 0.7$ and the standard error under $H_0$ is about 0.0283. So $z = -0.1 / 0.0283 \approx -3.54$, which is below $-1.645$, and the test rejects $H_0$.'
        constraints: 'two-sided tests use z* = 2 (empirical-rule value); any one-sided or exact critical value is supplied in the problem; the interval SE uses p-hat, the test SE uses p0; conclusions restate the decision in the scenario terms'
    diagnostic_exemplar:
      problem: 'A coin is suspected of being unfair. In $n = 100$ flips it lands heads $65$ times. Test $H_0: p = \frac{1}{2}$ against $H_1: p \ne \frac{1}{2}$ at $\alpha = 0.05$ ($z^* = 2$). Give the conditions check, $z$, and the decision in context.'
      answer: '$np_0 = n(1-p_0) = 50 \ge 10$; $\operatorname{SE} = \sqrt{\frac{1/4}{100}} = \frac{1}{20} = 0.05$; $z = \dfrac{0.65 - 0.5}{0.05} = 3$; $|3| > 2$, so reject $H_0$ — strong evidence the coin is unfair ($p \approx 0.003$).'
      solution_sketch: 'Check $np_0 \geq 10$ and $n(1-p_0) \geq 10$ first, then build the SE from the null value $p_0$ (not from $\hat p$), form $z = (\hat p - p_0)/\operatorname{SE}$, and compare with the supplied $z^* = 2$.'
    anki_seeds:
      - front: 'One-proportion z statistic?'
        back: '$z = \dfrac{\hat{p} - p_0}{\sqrt{p_0(1-p_0)/n}}$ — the SE under $H_0$ uses $p_0$, not $\hat{p}$.'
        type: basic
      - front: 'Conditions for the one-proportion z-test?'
        back: '$np_0 \ge 10$ and $n(1-p_0) \ge 10$, so $\hat{p}$ is approximately normal.'
        type: basic
      - front: '$95\%$ z-interval for a proportion?'
        back: '$\hat{p} \pm z^* \sqrt{\dfrac{\hat{p}(1-\hat{p})}{n}}$ (the interval''s SE uses $\hat{p}$).'
        type: basic

  - id: t-distribution
    name: "The t-Distribution"
    core: true                 # machinery for the one-sample t-test and slope inference downstream
    difficulty: 0.55
    drill: false
    answer_kind: numeric
    expected_time_secs: 120
    prerequisites:
      - id: sampling-distributions
        weight: 0.6
        key: true
      - id: variance-standard-deviation
        weight: 0.5
        key: false
      - id: normal-distribution
        weight: 0.4
        key: false
    knowledge_points:
      - id: kp1
        name: "Estimated standard error and degrees of freedom"
        key_prerequisites: [variance-standard-deviation, sampling-distributions]
        step_check:
          step: 'The estimated standard error is $s/\sqrt{n}=12/3=4$'
          question: 'Why is $s$ divided by $\sqrt{n}$ and not by $n$?'
          options:
            - 'Because $s$ is a variance, a square root turns it into a deviation'
            - 'A sample mean has a spread that falls with $\sqrt{n}$, not $n$'
            - 'Because $n$ counts degrees of freedom, so it must be rooted first'
            - 'Dividing by $n$ would give the variance of the sample instead'
          answer: 'A sample mean has a spread that falls with $\sqrt{n}$, not $n$'
          why: 'Averaging more observations reduces the spread of the mean, but only by the factor $\sqrt{n}$. Quadrupling the sample halves the standard error.'
        exemplars:
          - problem: 'A baker weighs $9$ loaves and finds a sample standard deviation of $12$ g. Find the estimated standard error of the mean weight.'
            answer: '4'
            answer_contract: {"kind": "unit", "quantity": "mass", "unit": "g", "allow_omitted": true}
            solution_sketch: 'The population standard deviation is unknown, so the standard error is estimated by $s/\sqrt{n}$. Here it is $12/\sqrt9=12/3=4$ g.'
          - problem: 'A researcher measures the resting heart rate of $15$ volunteers and analyzes the mean with a one-sample t procedure. How many degrees of freedom does the procedure have?'
            answer: '14'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The degrees of freedom of a one-sample t procedure are $n-1$. With $n=15$ this is $15-1=14$.'
          - problem: 'The reaction times of $16$ drivers have a sample standard deviation of $0.2$ seconds. Find the estimated standard error of the mean reaction time.'
            answer: '0.05'
            answer_contract: {"kind": "unit", "quantity": "time", "unit": "s", "allow_omitted": true}
            solution_sketch: 'The standard error is estimated by $s/\sqrt{n}=0.2/\sqrt{16}=0.2/4=0.05$ seconds.'
          - problem: 'A sample has standard deviation $s=18$, and the estimated standard error of its mean is $3$. Find the sample size $n$.'
            answer: '36'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The standard error is $s/\sqrt{n}$, so $3=18/\sqrt{n}$. Then $\sqrt{n}=18/3=6$, and $n=6^2=36$.'
          - problem: 'A study applies a one-sample t procedure and reports $22$ degrees of freedom. How many observations does the study have?'
            answer: '23'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The degrees of freedom are $n-1$. So $n=22+1=23$ observations.'
          - problem: 'A sample of $25$ bottles has an estimated standard error of $1.2$ ml for the mean fill. Find the sample standard deviation $s$.'
            answer: '6'
            answer_contract: {"kind": "unit", "quantity": "volume", "unit": "ml", "allow_omitted": true}
            solution_sketch: 'The standard error is $s/\sqrt{n}$ with $\sqrt{25}=5$. So $s=1.2\cdot5=6$ ml.'
          - problem: 'Sam estimates the standard error of the mean for a sample with $n=25$ and $s=10$ as $10/25=0.4$. What is the correct value?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Sam divided by $n$. The standard error divides by $\sqrt{n}$, so it is $10/\sqrt{25}=10/5=2$.'
          - problem: 'Two samples both have standard deviation $s=20$. The first has $n=16$ and the second has $n=100$. How many times as large as the standard error of the second sample is the standard error of the first?'
            answer: '5/2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The first standard error is $20/4=5$ and the second is $20/10=2$. The ratio is $5/2=2.5$.'
        constraints: 'n a perfect square when the SE is computed; df = n - 1 asked directly and in reverse; reverse items find n or s'
      - id: kp2
        name: "Heavier tails, approaching the normal"
        key_prerequisites: [normal-distribution]
        step_check:
          step: 'As the degrees of freedom grow, the t critical value moves down toward the normal value $1.960$'
          question: 'Why do the t critical values shrink toward $1.960$ as the degrees of freedom grow?'
          options:
            - 'A bigger sample makes the population itself closer to normal'
            - 'The table rows with more degrees of freedom are rounded much more heavily'
            - 'A bigger sample pins down $\sigma$, so the extra doubt about $s$ fades'
            - 'A bigger sample has a larger mean, so its critical value falls'
          answer: 'A bigger sample pins down $\sigma$, so the extra doubt about $s$ fades'
          why: 'The t distribution is wider than the normal because $\sigma$ is estimated by $s$. With more degrees of freedom $s$ is more reliable, and the two distributions nearly agree.'
        exemplars:
          - problem: 'The two-sided $95\%$ critical values of the t distribution are $2.776$ for $4$ degrees of freedom, $2.228$ for $10$, $2.042$ for $30$ and $2.009$ for $50$. As the degrees of freedom grow without bound, which number do these critical values approach?'
            answer: '1.960'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'With more data the sample standard deviation $s$ estimates $\sigma$ better, and the t distribution gets closer to the standard normal. Its $95\%$ value is $1.960$.'
          - problem: 'A lab builds a $95\%$ interval from $5$ measurements, so the t critical value has $4$ degrees of freedom and equals $2.776$. The standard normal value is $1.960$. By how much is the t critical value larger?'
            answer: '0.816'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The difference is $2.776-1.960=0.816$. Small samples pay this extra amount for having to estimate $\sigma$.'
          - problem: 'For two-sided $90\%$ intervals, the t critical value with $5$ degrees of freedom is $2.015$ and the standard normal value is $1.645$. How much larger is the t value?'
            answer: '0.37'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The difference is $2.015-1.645=0.370$, because the t distribution has heavier tails at small degrees of freedom.'
          - problem: 'The two-sided $95\%$ critical values are $2.228$ for $10$ degrees of freedom and $2.009$ for $50$ degrees of freedom. How much larger is the value for $10$ degrees of freedom?'
            answer: '0.219'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The difference is $2.228-2.009=0.219$. The smaller sample has the heavier tails, so its critical value is larger.'
          - problem: 'A sample of $5$ measurements has an estimated standard error of $2$. The $95\%$ margin of error is the critical value times the standard error. By how much is the margin of error wider with the t critical value $2.776$ than with the normal value $1.960$?'
            answer: '1.632'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The two margins of error are $2.776\cdot2=5.552$ and $1.960\cdot2=3.920$. The difference is $5.552-3.920=1.632$.'
          - problem: 'A $95\%$ interval uses the t critical value $2.045$. The t table lists $2.045$ for $29$ degrees of freedom and $2.042$ for $30$ degrees of freedom. How many observations does the sample have?'
            answer: '30'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The value $2.045$ belongs to $29$ degrees of freedom. Since the degrees of freedom are $n-1$, the sample has $n=29+1=30$ observations.'
          - problem: 'For two-sided $99\%$ intervals, the t critical value with $6$ degrees of freedom is $3.707$ and the standard normal value is $2.576$. How much larger is the t value?'
            answer: '1.131'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The difference is $3.707-2.576=1.131$. At the $99\%$ level the small-sample penalty is large.'
          - problem: 'Which distribution has more probability beyond $\pm3$: the t distribution with $3$ degrees of freedom or the t distribution with $30$ degrees of freedom?'
            answer: 'df 3'
            answer_contract: {"kind": "label", "options": [["3 degrees of freedom", "df 3", "3 df", "df = 3", "t with 3 df", "the t distribution with 3 degrees of freedom", "3", "the smaller one"], ["30 degrees of freedom", "df 30", "30 df", "df = 30", "t with 30 df", "the t distribution with 30 degrees of freedom", "30", "the larger one"]]}
            solution_sketch: 'The t distribution has heavier tails when the degrees of freedom are small. With $3$ degrees of freedom there is more probability beyond $\pm3$ than with $30$.'
        constraints: 'table excerpts always printed in the problem; comparisons quantitative (differences) except one verdict item on tail weight'
      - id: kp3
        name: "Reading critical values"
        key_prerequisites: [sampling-distributions, normal-distribution]
        step_check:
          step: 'The degrees of freedom are $10-1=9$, so the row for $9$ is used'
          question: 'Why is the row for $9$ degrees of freedom used for a sample of $10$?'
          options:
            - 'The table starts counting rows at zero, so every row label is one lower'
            - 'The first observation is always discarded from t procedures'
            - 'Row labels in a t table are one less than the confidence level'
            - 'A sample mean uses up one degree of freedom, so the count is $n-1$'
          answer: 'A sample mean uses up one degree of freedom, so the count is $n-1$'
          why: 'Once the sample mean is known, only $n-1$ of the observations can vary freely. This number $n-1$ is the degrees of freedom.'
        exemplars:
          - problem: 'Part of a t table gives, for $9$ degrees of freedom, the critical values $2.262$ for $95\%$ and $3.250$ for $99\%$. A $95\%$ interval is built from $10$ measurements. Which critical value $t^*$ is used?'
            answer: '2.262'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The degrees of freedom are $10-1=9$, so the row for $9$ is used. In the $95\%$ column it gives $t^*=2.262$.'
          - problem: 'A nutritionist builds a $99\%$ interval from $10$ measurements. A t table gives, for $9$ degrees of freedom, $2.262$ for $95\%$ and $3.250$ for $99\%$. Which critical value $t^*$ is used?'
            answer: '3.25'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The degrees of freedom are $10-1=9$. The $99\%$ column of that row gives $t^*=3.250$.'
          - problem: 'A t table gives, for $15$ degrees of freedom, $2.131$ for $95\%$ and $2.947$ for $99\%$. A $99\%$ interval is built from a sample of $16$. Which critical value $t^*$ is used?'
            answer: '2.947'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The degrees of freedom are $16-1=15$. The $99\%$ column of that row gives $t^*=2.947$.'
          - problem: 'A t table gives $2.093$ for $19$ degrees of freedom and $2.086$ for $20$ degrees of freedom, both at the $95\%$ level. A $95\%$ interval is built from $21$ observations. Which critical value $t^*$ is used?'
            answer: '2.086'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The degrees of freedom are $21-1=20$, not $19$. The row for $20$ gives $t^*=2.086$.'
          - problem: 'A t table gives, for $24$ degrees of freedom, $2.064$ for $95\%$ and $2.797$ for $99\%$. A $99\%$ interval used $t^*=2.797$. How many observations did the sample have?'
            answer: '25'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The value $2.797$ is in the row for $24$ degrees of freedom. Since the degrees of freedom are $n-1$, the sample had $n=24+1=25$ observations.'
          - problem: 'For $9$ degrees of freedom a t table gives $2.262$ at the $95\%$ level and $3.250$ at the $99\%$ level. How much larger is the $99\%$ critical value than the $95\%$ critical value?'
            answer: '0.988'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The difference is $3.250-2.262=0.988$. A higher confidence level needs a wider interval.'
          - problem: 'A sample of $16$ fish has $s=8$ cm. With $15$ degrees of freedom the $95\%$ critical value is $t^*=2.131$. Find the $95\%$ margin of error $t^*\cdot s/\sqrt{n}$ for the mean length, in centimeters.'
            answer: '4.262'
            answer_contract: {"kind": "unit", "quantity": "length", "unit": "cm", "allow_omitted": true}
            solution_sketch: 'The standard error is $8/\sqrt{16}=2$. The margin of error is $2.131\cdot2=4.262$ cm.'
          - problem: 'A $95\%$ margin of error is $4.262$ with $t^*=2.131$, and the sample standard deviation is $s=8$. How many observations does the sample have?'
            answer: '16'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The standard error is the margin of error divided by $t^*$, so it is $4.262/2.131=2$. Then $\sqrt{n}=s/2=4$, and $n=16$.'
        constraints: 'the needed t-table row is supplied in the problem; the learner selects df = n - 1 and the confidence level; later items use the critical value in a margin of error and in reverse'
    diagnostic_exemplar:
      problem: 'A sample of $n = 9$ has $s = 6$. The table row for df $8$ gives $t^* = 2.306$ ($95\%$) and $t^* = 3.355$ ($99\%$). Find the margin of error $t^* \cdot s/\sqrt{n}$ of a $95\%$ interval for the mean.'
      answer: '4.612'
      solution_sketch: 'The standard error is $s/\sqrt{n} = 6/3 = 2$. The degrees of freedom are $n - 1 = 8$, so $t^* = 2.306$, and the margin of error is $2.306 \cdot 2 = 4.612$.'
    anki_seeds:
      - front: 'When t instead of z?'
        back: 'When $\sigma$ is unknown and estimated by the sample standard deviation $s$.'
        type: basic
      - front: 'Degrees of freedom for a one-sample t procedure?'
        back: '$n - 1$.'
        type: basic
      - front: 'Shape of the t-distribution versus the normal?'
        back: 'Heavier tails; it approaches the standard normal as the degrees of freedom grow.'
        type: basic

  - id: one-sample-t-test
    name: "One-Sample t-Test"
    core: true                 # the workhorse test when sigma is unknown; slope inference instantiates it
    difficulty: 0.65
    drill: false
    answer_kind: multi-step
    expected_time_secs: 240
    prerequisites:
      - id: one-sample-z-test
        weight: 0.8
        key: true
      - id: t-distribution
        weight: 0.7
        key: true
    knowledge_points:
      - id: kp1
        name: "The t statistic"
        key_prerequisites: [one-sample-z-test, t-distribution]
        step_check:
          step: 'The t statistic divides the difference $\bar{x}-\mu_0$ by the standard error'
          question: 'Why is the difference $\bar{x}-\mu_0$ divided by the standard error?'
          options:
            - 'It counts how many standard errors the sample mean lies from $\mu_0$'
            - 'It converts the difference into a probability between $0$ and $1$'
            - 'It removes the units, so that a negative difference turns into a positive one'
            - 'It gives the average of the sample mean and the null mean'
          answer: 'It counts how many standard errors the sample mean lies from $\mu_0$'
          why: 'A difference of $3$ g means little if the standard error is $10$ g and a lot if it is $0.5$ g. Dividing by the standard error puts every test on the same scale.'
        exemplars:
          - problem: 'A cereal box is labeled $500$ g. A sample of $36$ boxes has a mean of $503$ g and a standard deviation of $12$ g. Test $H_0: \mu=500$. Find the t statistic.'
            answer: '1.5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The standard error is $s/\sqrt{n}=12/6=2$. Then $t=\frac{\bar{x}-\mu_0}{\text{SE}}=\frac{503-500}{2}=1.5$.'
          - problem: 'A lab tests $H_0: \mu=200$ for the concentration of a solution. A sample of $49$ measurements has $\bar{x}=193$ and $s=14$. Find the t statistic.'
            answer: '-3.5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The standard error is $14/\sqrt{49}=14/7=2$. Then $t=\frac{193-200}{2}=-3.5$.'
          - problem: 'A quality check tests $H_0: \mu=12$ for the mass of a part. A sample of $25$ items has $\bar{x}=15$ and $s=5$. Find the t statistic.'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The standard error is $5/\sqrt{25}=5/5=1$. Then $t=\frac{15-12}{1}=3$.'
          - problem: 'A study tests $H_0: \mu=80$ with a sample of $64$ people and uses a t statistic. How many degrees of freedom does the statistic have?'
            answer: '63'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The degrees of freedom of a one-sample t statistic are $n-1=64-1=63$.'
          - problem: 'A study tests $H_0: \mu=80$ with a sample of $n=64$ and $s=16$. The t statistic is $-2$. Find the sample mean $\bar{x}$.'
            answer: '76'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The standard error is $16/\sqrt{64}=2$. Since $t=\frac{\bar{x}-80}{2}=-2$, we get $\bar{x}-80=-4$, so $\bar{x}=76$.'
          - problem: 'A lab tests $H_0: \mu=5$ with a sample of $n=9$ and $\bar{x}=8$. The t statistic is $3$. Find the sample standard deviation $s$.'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Since $t=\frac{8-5}{\text{SE}}=3$, the standard error is $1$. Then $s/\sqrt{9}=1$, so $s=3$.'
          - problem: 'A survey tests $H_0: \mu=100$ with $n=100$, $\bar{x}=97$ and $s=20$. Sam divides $\bar{x}-\mu_0$ by $s$ and gets $t=-0.15$. What is the correct t statistic?'
            answer: '-1.5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Sam used $s$ instead of the standard error. The standard error is $20/\sqrt{100}=2$, so $t=\frac{97-100}{2}=-1.5$.'
          - problem: 'A claim says that the mean is $100$. A sample has $\bar{x}=104$ and $s=10$. How large must the sample be for the t statistic to equal $4$?'
            answer: '100'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The difference is $4$, so we need a standard error of $1$. Then $10/\sqrt{n}=1$, so $\sqrt{n}=10$ and $n=100$.'
        constraints: 'sigma never given, only s; s and n give SEs that are integers or exact decimals; t comes out to halves or whole numbers; reverse items find the mean, s or n'
      - id: kp2
        name: "Decision with a t critical value"
        key_prerequisites: [t-distribution, one-sample-z-test]
        step_check:
          step: 'Compare $|t|$ to $t^*$'
          question: 'Why is $|t|$ compared with $t^*$, and not $t$ itself, in a two-sided test?'
          options:
            - 'The critical value $t^*$ is always positive, so the signs must match'
            - 'A negative $t$ would mean that the data were collected wrongly or recorded twice'
            - 'A sample mean far below $\mu_0$ is as strong evidence as one far above it'
            - 'Taking the absolute value halves the significance level'
          answer: 'A sample mean far below $\mu_0$ is as strong evidence as one far above it'
          why: 'A two-sided test looks for a difference in either direction. So only the size of $t$ matters, and the sign does not.'
        exemplars:
          - problem: 'A two-sided t-test at significance level $\alpha=0.05$ has $t=2.05$ with $15$ degrees of freedom. The table gives $t^*=2.131$. What is the decision?'
            answer: 'fail to reject'
            answer_contract: {"kind": "label", "options": [["fail to reject", "do not reject", "fail to reject h0", "do not reject h0", "fail to reject the null hypothesis", "do not reject the null hypothesis", "fail to reject the null", "retain"], ["reject", "reject h0", "reject the null hypothesis", "reject the null", "reject null"]]}
            solution_sketch: 'The null hypothesis is rejected only when $|t|>t^*$. Here $|2.05|<2.131$, so we fail to reject $H_0$.'
          - problem: 'A two-sided t-test at $\alpha=0.05$ has $t=-2.4$ with $15$ degrees of freedom. The table gives $t^*=2.131$. What is the decision?'
            answer: 'reject'
            answer_contract: {"kind": "label", "options": [["reject", "reject h0", "reject the null hypothesis", "reject the null", "reject null"], ["fail to reject", "do not reject", "fail to reject h0", "do not reject h0", "fail to reject the null hypothesis", "do not reject the null hypothesis", "fail to reject the null", "retain"]]}
            solution_sketch: 'The absolute value is $|-2.4|=2.4$. Since $2.4>2.131$, we reject $H_0$.'
          - problem: 'A lab tests $H_0: \mu=60$ with a two-sided t-test at $\alpha=0.05$. The sample has $n=20$ and $s=10$, and the table gives $t^*=2.093$ for $19$ degrees of freedom. Find the sample mean, to two decimal places, below which $H_0$ is rejected.'
            answer: '55.32'
            answer_contract: {"kind": "approx", "decimals": 2}
            solution_sketch: 'The standard error is $10/\sqrt{20}=2.2361$. The test rejects when $\bar{x}$ is more than $t^*\cdot\text{SE}=2.093\cdot2.2361=4.6801$ below $60$. The boundary is $60-4.6801=55.32$.'
          - problem: 'A tester checks whether the mean of a process exceeds $40$, using an upper-tail t-test at $\alpha=0.05$ with $n=9$ and $s=2$. The table gives $t^*=1.860$ for $8$ degrees of freedom. Above which sample mean is $H_0: \mu=40$ rejected?'
            answer: '41.24'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The standard error is $2/\sqrt{9}=\frac23$. The test rejects when $\bar{x}>\mu_0+t^*\cdot\text{SE}$, so the boundary is $40+1.860\cdot\frac23=40+1.24=41.24$.'
          - problem: 'A lower-tail t-test of $H_0: \mu=50$ at $\alpha=0.05$ uses a sample with $n=12$ and $s=3$. The critical value for $11$ degrees of freedom is $t^*=-1.796$. Find the sample mean, to three decimal places, below which $H_0$ is rejected.'
            answer: '48.445'
            answer_contract: {"kind": "approx", "decimals": 3}
            solution_sketch: 'The standard error is $3/\sqrt{12}=0.8660$. The test rejects when $\bar{x}<\mu_0-1.796\cdot\text{SE}$. The boundary is $50-1.796\cdot0.8660=50-1.5554=48.445$.'
          - problem: 'A two-sided t-test of $H_0: \mu=500$ at $\alpha=0.05$ uses a sample of $n=25$ with $\bar{x}=508$, and the table gives $t^*=2.064$ for $24$ degrees of freedom. Find the value of $s$, to three decimal places, below which $H_0$ is rejected.'
            answer: '19.38'
            answer_contract: {"kind": "approx", "decimals": 3}
            solution_sketch: 'The test rejects when $\frac{|\bar{x}-\mu_0|}{s/\sqrt{n}}>t^*$. At the boundary $s=\frac{8\cdot5}{2.064}=19.380$, and any smaller $s$ gives a larger $t$.'
          - problem: 'Ana tests $H_0: \mu=\mu_0$ two-sided at $\alpha=0.05$ and gets $t=2.05$ with $15$ degrees of freedom. She rejects $H_0$ because $2.05$ is above $2$. The table cutoff for $15$ degrees of freedom is $2.131$. By how much does $|t|$ fall short of the correct cutoff?'
            answer: '0.081'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The cutoff $2$ is for a normal distribution, but $\sigma$ is estimated, so the t cutoff $2.131$ is needed. The shortfall is $2.131-2.05=0.081$, so $H_0$ is not rejected.'
        constraints: 't* always supplied together with its df; two decision items with different answers; boundary items for the sample mean and for s; one item contrasts the t cutoff with the cutoff 2'
      - id: kp3
        name: "The full t-test in context"
        key_prerequisites: [one-sample-z-test, t-distribution]
        step_check:
          step: 'Since $|t|=1.5$ is smaller than $t^*=2.131$, the null hypothesis is not rejected'
          question: 'Why does a small $|t|$ leave $H_0$ standing?'
          options:
            - 'A small $|t|$ proves that $\mu$ equals $\mu_0$ exactly'
            - 'A sample mean this close to $\mu_0$ is common when $H_0$ is true'
            - 'The critical value $t^*$ is the probability that $H_0$ is true'
            - 'A small $|t|$ means that the sample mean and $\mu_0$ must be exactly equal'
          answer: 'A sample mean this close to $\mu_0$ is common when $H_0$ is true'
          why: 'When $|t|$ is small, the data are what chance alone would often produce if $H_0$ were true. So the data give no strong evidence against $H_0$.'
        exemplars:
          - problem: 'A juice bottler aims for a mean fill of $500$ ml. A sample of $16$ bottles has $\bar{x}=497$ ml and $s=8$ ml. Test $H_0: \mu=500$ against $H_1: \mu \neq 500$. Find the t statistic.'
            answer: '-1.5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The standard error is $8/\sqrt{16}=2$. Then $t=\frac{497-500}{2}=-1.5$.'
          - problem: 'A sleep aid claims a mean of $30$ minutes of extra sleep. A sample of $9$ people has $\bar{x}=27$ minutes and $s=3.6$ minutes. Test $H_0: \mu=30$ against $H_1: \mu<30$ at $\alpha=0.05$, using $t^*=-1.860$ for $8$ degrees of freedom. What is the decision?'
            answer: 'reject'
            answer_contract: {"kind": "label", "options": [["reject", "reject h0", "reject the null hypothesis", "reject the null", "reject null"], ["fail to reject", "do not reject", "fail to reject h0", "do not reject h0", "fail to reject the null hypothesis", "do not reject the null hypothesis", "fail to reject the null", "retain"]]}
            solution_sketch: 'The standard error is $3.6/3=1.2$, so $t=\frac{27-30}{1.2}=-2.5$. For a lower-tail test we reject when $t<t^*$, and $-2.5<-1.860$, so we reject $H_0$.'
          - problem: 'A machine cuts rods to a target length of $40$ cm. A sample of $16$ rods has $\bar{x}=39.5$ cm and $s=1.6$ cm. Test $H_0: \mu=40$ against $H_1: \mu<40$. Find the t statistic.'
            answer: '-1.25'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The standard error is $1.6/\sqrt{16}=0.4$. Then $t=\frac{39.5-40}{0.4}=-1.25$.'
          - problem: 'A fertilizer maker claims a mean yield of $50$ kg per plot. A sample of $25$ plots has $\bar{x}=53$ kg and $s=10$ kg. The test of $H_0: \mu=50$ against $H_1: \mu>50$ at $\alpha=0.05$ uses $t^*=1.711$ for $24$ degrees of freedom. What is the conclusion?'
            answer: 'no evidence that the mean yield exceeds 50 kg'
            answer_contract: {"kind": "label", "options": [["no evidence that the mean yield exceeds 50 kg", "fail to reject", "fail to reject h0", "do not reject h0", "do not reject", "fail to reject the null hypothesis", "retain h0"], ["evidence that the mean yield exceeds 50 kg", "reject", "reject h0", "reject the null hypothesis"], ["evidence that the mean yield is below 50 kg"], ["the mean yield is exactly 50 kg"]]}
            solution_sketch: 'The standard error is $10/5=2$, so $t=\frac{53-50}{2}=1.5$. Since $1.5<1.711$, we fail to reject $H_0$. The sample gives no evidence that the mean yield exceeds $50$ kg, but it does not prove that the mean equals $50$ kg.'
          - problem: 'A bulb maker claims a mean life of $1000$ hours. A sample of $9$ bulbs has $\bar{x}=980$ hours and $s=30$ hours. Test $H_0: \mu=1000$ against $H_1: \mu<1000$. Find the t statistic.'
            answer: '-2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The standard error is $30/\sqrt{9}=10$. Then $t=\frac{980-1000}{10}=-2$.'
          - problem: 'A coffee shop aims for a mean of $250$ ml per espresso. A sample of $25$ shots has $\bar{x}=249$ ml and $s=5$ ml. Test $H_0: \mu=250$ against $H_1: \mu \neq 250$. Find the t statistic.'
            answer: '-1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The standard error is $5/\sqrt{25}=1$. Then $t=\frac{249-250}{1}=-1$.'
          - problem: 'A school claims that its students sleep $8$ hours on average. A sample of students has $\bar{x}=7.5$ hours and $s=2$ hours. How many students are needed for the t statistic of $H_0: \mu=8$ to equal $-2.5$?'
            answer: '100'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The difference is $-0.5$, so the standard error must be $0.2$. Then $2/\sqrt{n}=0.2$, so $\sqrt{n}=10$ and $n=100$.'
        constraints: 'metric contexts; one-sided and two-sided cases; the t statistic is asked in most items; two label items (a decision and a four-way conclusion) with different answers; one item finds n'
    diagnostic_exemplar:
      problem: 'A bakery''s loaves should weigh $800$ g on average. A sample of $n = 16$ loaves has $\bar{x} = 806$ g and $s = 8$ g. Test $H_0: \mu = 800$ against $H_1: \mu \ne 800$ at $\alpha = 0.05$ ($t^* = 2.131$, df $15$). Give $t$, the decision, and a conclusion in context.'
      answer: '$\operatorname{SE} = 2$; $t = 3$; $|3| > 2.131$, so reject $H_0$ — evidence the loaves are heavier than $800$ g on average.'
      solution_sketch: 'Same shape as the z-test with $s$ in place of an unknown $\sigma$: $\operatorname{SE} = s/\sqrt{n}$ and $t = (\bar x - \mu_0)/\operatorname{SE}$, compared with the supplied $t^* = 2.131$ on $n - 1 = 15$ df.'
    anki_seeds:
      - front: 'One-sample t statistic?'
        back: '$t = \dfrac{\bar{x} - \mu_0}{s/\sqrt{n}}$, with $n - 1$ degrees of freedom.'
        type: basic
      - front: 'What changes from the z-test to the t-test?'
        back: '$s$ replaces $\sigma$, and critical values come from the t-distribution with $n - 1$ df.'
        type: basic

  - id: two-sample-t-test
    name: "Two-Sample t-Test"
    core: false                # terminal inference destination, like inference-for-slope; nothing downstream builds on it
    difficulty: 0.7
    drill: false
    answer_kind: multi-step
    expected_time_secs: 240
    prerequisites:
      - id: one-sample-t-test
        weight: 0.8
        key: true
      - id: sums-of-random-variables
        weight: 0.6
        key: true
      - id: experimental-design-basics
        weight: 0.0            # conceptual only: treatment/control designs are what the test analyzes
        key: false
    knowledge_points:
      - id: kp1
        name: "Hypotheses and the standard error of a difference"
        key_prerequisites: [sums-of-random-variables, one-sample-t-test]
        step_check:
          step: 'Variances add when two independent sample means are subtracted'
          question: 'Why are the variances added, and not subtracted, in $\sqrt{s_1^2/n_1+s_2^2/n_2}$?'
          options:
            - 'A subtraction of two means has a smaller spread than either mean has'
            - 'The standard deviations cancel unless the two sample sizes are equal'
            - 'Variances are subtracted only when the difference of the means is negative'
            - 'Each independent mean has its own uncertainty, however they are combined'
          answer: 'Each independent mean has its own uncertainty, however they are combined'
          why: 'The difference of two independent sample means is uncertain because both means are uncertain. So the variances add, even though the means are subtracted.'
        exemplars:
          - problem: 'A company runs two assembly lines whose mean outputs per shift are $\mu_1$ and $\mu_2$. The quality team wants to detect a difference between the lines in either direction. Is the alternative hypothesis one-sided or two-sided?'
            answer: 'two-sided'
            answer_contract: {"kind": "label", "options": [["two-sided", "two sided", "two-tailed", "two tailed"], ["one-sided", "one sided", "one-tailed", "one tailed"]]}
            solution_sketch: 'The team wants to detect a difference in either direction, so the alternative is $H_1:\mu_1-\mu_2\neq0$. An alternative that allows both directions is two-sided.'
          - problem: 'Independent samples from two populations give $s_1=4$ with $n_1=8$ and $s_2=14$ with $n_2=28$. Find the standard error of the difference of the sample means.'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'For independent samples the variances of the means add. So $\text{SE}=\sqrt{\frac{16}{8}+\frac{196}{28}}=\sqrt{2+7}=3$.'
          - problem: 'A drug is tried at two independent clinic sites. Site A has $s_1=2.4$ with $n_1=4$, and site B has $s_2=3.2$ with $n_2=4$. Find the standard error of the difference of the two sample means.'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The variances of the two means add. So $\text{SE}=\sqrt{\frac{2.4^2}{4}+\frac{3.2^2}{4}}=\sqrt{1.44+2.56}=\sqrt{4}=2$.'
          - problem: 'Two battery brands are tested independently. Brand A has $s_1=8$ hours with $n_1=16$, and brand B has $n_2=8$. The standard error of the difference in mean lifetimes is $6$ hours. Find the sample standard deviation $s_2$ of brand B.'
            answer: '16'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The variance of the difference is $6^2=36$. Brand A contributes $\frac{64}{16}=4$, so brand B contributes $32=\frac{s_2^2}{8}$. Then $s_2^2=256$ and $s_2=16$.'
          - problem: 'Two independent filling machines are sampled. Machine 1 has $s_1=8$ with $n_1=8$, and machine 2 has $s_2=17$ with $n_2=17$. Find the variance of $\bar{X}_1-\bar{X}_2$.'
            answer: '25'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The variance of a difference of independent means is the sum of the two variances. So it is $\frac{8^2}{8}+\frac{17^2}{17}=8+17=25$.'
          - problem: 'A planner will draw two independent samples of the same size $n$ from populations with $s_1=6$ and $s_2=8$. The standard error of $\bar{X}_1-\bar{X}_2$ should be at most $1$. What is the smallest sample size $n$ for each group?'
            answer: '100'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The variance of the difference is $\frac{36}{n}+\frac{64}{n}=\frac{100}{n}$. We need $\frac{100}{n}\le1$, so $n\ge100$ and the smallest value is $100$.'
          - problem: 'A school wants to show that a new teaching method gives a higher mean score $\mu_1$ than the old method $\mu_2$. Is the alternative hypothesis one-sided or two-sided?'
            answer: 'one-sided'
            answer_contract: {"kind": "label", "options": [["one-sided", "one sided", "one-tailed", "one tailed"], ["two-sided", "two sided", "two-tailed", "two tailed"]]}
            solution_sketch: 'The school only cares about one direction, $\mu_1>\mu_2$. So the alternative is $H_1:\mu_1-\mu_2>0$, which is one-sided.'
          - problem: 'Two independent samples have $s_1=6$ with $n_1=4$ and $s_2=8$ with $n_2=4$. Sam finds the standard error of the difference by adding the two standard errors, which gives $3+4=7$. What is the correct standard error?'
            answer: '5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Sam added standard errors, but the variances add. So $\text{SE}=\sqrt{\frac{36}{4}+\frac{64}{4}}=\sqrt{9+16}=5$.'
        constraints: 'hypotheses about mu1 - mu2 (or mu1 = mu2), never about x-bars; two label items (two-sided and one-sided) with different answers; s_i^2/n_i come out to integers or exact decimals whose sum is a perfect square, so the SE is exact'
      - id: kp2
        name: "The two-sample t statistic and conservative df"
        key_prerequisites: [one-sample-t-test, sums-of-random-variables]
        step_check:
          step: 'The conservative degrees of freedom come from the smaller sample, $\min(n_1,n_2)-1$'
          question: 'Why does the smaller sample set the conservative degrees of freedom?'
          options:
            - 'The smaller sample is the only one whose standard deviation is estimated from data'
            - 'The less precise sample limits the comparison, so its df is the safe choice'
            - 'The two samples must share one size, so the smaller size is kept'
            - 'Larger degrees of freedom would make the critical value too large'
          answer: 'The less precise sample limits the comparison, so its df is the safe choice'
          why: 'A smaller df gives a larger critical value, so the test rejects less easily. Using the smaller sample therefore never overstates the evidence.'
        exemplars:
          - problem: 'Two independent samples give $\bar{x}_1=30$, $s_1=4$, $n_1=4$ and $\bar{x}_2=25$, $s_2=3$, $n_2=4$. Find the two-sample t statistic for the difference of the means.'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The standard error is $\sqrt{\frac{16}{4}+\frac{9}{4}}=\sqrt{6.25}=2.5$. Then $t=\frac{30-25}{2.5}=2$.'
          - problem: 'In a teaching study, class A has $25$ students with a mean score of $72$ and a standard deviation of $10$. Class B has $12$ students with a mean score of $78$ and a standard deviation of $12$. Find the two-sample t statistic for the difference of the means.'
            answer: '-1.5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The standard error is $\sqrt{\frac{100}{25}+\frac{144}{12}}=\sqrt{4+12}=4$. Then $t=\frac{72-78}{4}=-1.5$.'
          - problem: 'Two independent samples have sizes $n_1=12$ and $n_2=16$. What are the conservative degrees of freedom of the two-sample t-test?'
            answer: '11'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The conservative degrees of freedom are $\min(n_1,n_2)-1=\min(12,16)-1=11$.'
          - problem: 'Battery life is compared for two brands. Brand A has $8$ batteries with a mean of $50$ hours and $s_1=4$. Brand B has $18$ batteries with a mean of $45$ hours and $s_2=6$. Find the two-sample t statistic.'
            answer: '2.5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The standard error is $\sqrt{\frac{16}{8}+\frac{36}{18}}=\sqrt{2+2}=2$. Then $t=\frac{50-45}{2}=2.5$.'
          - problem: 'Group $1$ has $9$ people with a mean score of $85$ and $s_1=9$. Group $2$ has $16$ people with a mean score of $100$ and $s_2=16$. Find the two-sample t statistic.'
            answer: '-3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The standard error is $\sqrt{\frac{81}{9}+\frac{256}{16}}=\sqrt{9+16}=5$. Then $t=\frac{85-100}{5}=-3$.'
          - problem: 'Waiting times at two cashiers are compared. Cashier 1 serves $8$ sampled customers with a mean wait of $64$ s and $s_1=8$. Cashier 2 serves $25$ sampled customers with a mean wait of $55$ s and $s_2=5$. Find the two-sample t statistic.'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The standard error is $\sqrt{\frac{64}{8}+\frac{25}{25}}=\sqrt{8+1}=3$. Then $t=\frac{64-55}{3}=3$.'
          - problem: 'Two samples of sizes $8$ and $25$ are compared with a two-sample t-test. What are the conservative degrees of freedom?'
            answer: '7'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The conservative degrees of freedom come from the smaller sample: $\min(8,25)-1=7$.'
          - problem: 'A two-sample t statistic is $2.5$ and the standard error of the difference is $2$. By how much do the two sample means differ?'
            answer: '5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The statistic is the difference divided by the standard error. So the difference is $t\cdot\text{SE}=2.5\cdot2=5$.'
        constraints: 'SE comes out whole or half; t to halves or whole numbers; the conservative df = min(n1, n2) - 1 is asked in its own items; one reverse item finds the difference of the means'
      - id: kp3
        name: "Analyzing a treatment/control experiment end-to-end"
        key_prerequisites: [one-sample-t-test, experimental-design-basics]
        step_check:
          step: 'Random assignment makes the two groups alike apart from the treatment'
          question: 'Why does random assignment allow a difference in means to be attributed to the treatment?'
          options:
            - 'Chance balances other influences across the groups, so only the treatment differs'
            - 'It makes the two sample standard deviations equal, which the test requires'
            - 'It guarantees that the t statistic is larger than the critical value $t^*$'
            - 'It doubles the sample size of each group, which makes the standard error much smaller'
          answer: 'Chance balances other influences across the groups, so only the treatment differs'
          why: 'Without random assignment, the groups may differ in other ways, such as age or habits. Random assignment balances these on average, so a real difference points to the treatment.'
        exemplars:
          - problem: 'A randomized trial gives a new feed to $16$ chickens and a standard feed to $16$ others. The weight gain in grams has a mean of $420$ and a standard deviation of $12$ for the new feed, and a mean of $400$ and a standard deviation of $16$ for the standard feed. Test $H_0: \mu_1=\mu_2$ against $H_1: \mu_1\neq\mu_2$. Find the t statistic.'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The standard error is $\sqrt{\frac{144}{16}+\frac{256}{16}}=\sqrt{9+16}=5$. Then $t=\frac{420-400}{5}=4$.'
          - problem: 'Two filling machines are compared. Machine A fills $36$ bottles with a mean of $505$ ml and a standard deviation of $18$ ml. Machine B fills $25$ bottles with a mean of $500$ ml and a standard deviation of $20$ ml. A two-sided test of $H_0: \mu_1=\mu_2$ at $\alpha=0.05$ uses $t^*=2.064$ (conservative degrees of freedom $24$). What is the decision?'
            answer: 'fail to reject'
            answer_contract: {"kind": "label", "options": [["fail to reject", "do not reject", "fail to reject h0", "do not reject h0", "fail to reject the null hypothesis", "do not reject the null hypothesis", "fail to reject the null", "retain"], ["reject", "reject h0", "reject the null hypothesis", "reject the null", "reject null"]]}
            solution_sketch: 'The standard error is $\sqrt{\frac{324}{36}+\frac{400}{25}}=\sqrt{9+16}=5$, so $t=\frac{505-500}{5}=1$. Since $|1|<2.064$, we fail to reject $H_0$.'
          - problem: 'An observational study records daily step counts, in hundreds, for $49$ coffee drinkers and $36$ non-drinkers. Coffee drinkers have a mean of $112$ and a standard deviation of $21$. Non-drinkers have a mean of $100$ and a standard deviation of $24$. Test $H_0: \mu_1=\mu_2$ against $H_1: \mu_1\neq\mu_2$. Find the t statistic.'
            answer: '2.4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The standard error is $\sqrt{\frac{441}{49}+\frac{576}{36}}=\sqrt{9+16}=5$. Then $t=\frac{112-100}{5}=2.4$.'
          - problem: 'A randomized experiment assigns $25$ stores to a new layout and $25$ stores to the standard layout. Weekly sales, in hundreds of dollars, have a mean of $510$ and a standard deviation of $15$ for the new layout, and a mean of $500$ and a standard deviation of $20$ for the standard layout. A test of $H_0: \mu_1=\mu_2$ against $H_1: \mu_1>\mu_2$ at $\alpha=0.05$ uses $t^*=1.711$ (conservative degrees of freedom $24$). What is the decision?'
            answer: 'reject'
            answer_contract: {"kind": "label", "options": [["reject", "reject h0", "reject the null hypothesis", "reject the null", "reject null"], ["fail to reject", "do not reject", "fail to reject h0", "do not reject h0", "fail to reject the null hypothesis", "do not reject the null hypothesis", "fail to reject the null", "retain"]]}
            solution_sketch: 'The standard error is $\sqrt{\frac{225}{25}+\frac{400}{25}}=\sqrt{9+16}=5$, so $t=\frac{510-500}{5}=2$. Since $2>1.711$, we reject $H_0$.'
          - problem: 'A study compares two teaching methods. Method A has $25$ students with a mean score of $80$ points and a standard deviation of $12$ points. Method B has $25$ students with a mean score of $70$ points and a standard deviation of $16$ points. Test $H_0: \mu_1=\mu_2$ against $H_1: \mu_1\neq\mu_2$. Find the t statistic.'
            answer: '2.5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The standard error is $\sqrt{\frac{144}{25}+\frac{256}{25}}=\sqrt{16}=4$. Then $t=\frac{80-70}{4}=2.5$.'
          - problem: 'A randomized trial compares a supplement with a placebo. The supplement group has $25$ subjects with a mean of $45$ points and a standard deviation of $9$ points. The placebo group has $25$ subjects with a mean of $33$ points and a standard deviation of $12$ points. Test $H_0: \mu_1=\mu_2$ against $H_1: \mu_1\neq\mu_2$. Find the t statistic.'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The standard error is $\sqrt{\frac{81}{25}+\frac{144}{25}}=\sqrt{9}=3$. Then $t=\frac{45-33}{3}=4$.'
          - problem: 'In the chicken trial, the new-feed group of $16$ has a mean weight gain of $420$ g and a standard deviation of $12$ g. The standard-feed group of $16$ has a mean of $400$ g and a standard deviation of $16$ g. The conservative degrees of freedom are $15$ and $t^*=2.131$. Find the endpoints of the $95\%$ confidence interval for $\mu_1-\mu_2$.'
            answer: '9.345, 30.655'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The standard error is $5$, so the margin of error is $2.131\cdot5=10.655$. The difference of means is $420-400=20$. The endpoints are $20-10.655=9.345$ and $20+10.655=30.655$.'
          - problem: 'Two groups of the same size $n$ have standard deviations $12$ and $16$, and their sample means differ by $10$. What value of $n$ gives a t statistic of $5$?'
            answer: '100'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The standard error must be $10/5=2$, so its variance is $4$. Then $\frac{144}{n}+\frac{256}{n}=\frac{400}{n}=4$, so $n=100$.'
        constraints: 'metric contexts; t* always supplied with its (conservative) df when a decision or interval is asked; two decision items with different answers; one confidence-interval item; causal language only when the scenario states random assignment, never for observational comparisons'
    diagnostic_exemplar:
      problem: '$32$ students are randomly split: $16$ revise with a study app, $16$ without, and all sit the same exam marked out of $10$. App group: $\bar{x}_1 = 8.0$, $s_1 = 1.2$; control: $\bar{x}_2 = 6.5$, $s_2 = 1.6$. Test $H_0: \mu_1 = \mu_2$ against $H_1: \mu_1 \ne \mu_2$ at $\alpha = 0.05$ with $t^* = 2.131$ (conservative df $15$). Give $t$, the decision, and a conclusion in context.'
      answer: '$\operatorname{SE} = \sqrt{0.09 + 0.16} = 0.5$; $t = \dfrac{8.0 - 6.5}{0.5} = 3$; $|3| > 2.131$, so reject $H_0$ — evidence the app improves marks, and random assignment lets the difference be attributed to the app.'
      solution_sketch: 'Two independent samples, so the standard errors combine in quadrature: $\operatorname{SE} = \sqrt{s_1^2/n_1 + s_2^2/n_2}$ and $t = (\bar x_1 - \bar x_2)/\operatorname{SE}$ against the supplied $t^* = 2.131$. Random assignment is what upgrades the conclusion from association to cause.'
    anki_seeds:
      - front: 'Two-sample t statistic?'
        back: '$t = \dfrac{\bar{x}_1 - \bar{x}_2}{\sqrt{s_1^2/n_1 + s_2^2/n_2}}$.'
        type: basic
      - front: 'Why do the variances add in the two-sample SE when the means are subtracted?'
        back: 'For independent samples, $\operatorname{Var}(\bar{X}_1 - \bar{X}_2) = \operatorname{Var}(\bar{X}_1) + \operatorname{Var}(\bar{X}_2)$.'
        type: basic
      - front: 'Conservative degrees of freedom for a two-sample t-test?'
        back: '$\min(n_1, n_2) - 1$.'
        type: basic

  - id: chi-square-goodness-of-fit
    name: "Chi-Square Goodness-of-Fit"
    core: false                # terminal test destination; the independence variant is deliberately omitted — one variant teaches the chi-square reasoning (requirements section 7)
    difficulty: 0.65
    drill: false
    answer_kind: multi-step
    expected_time_secs: 240
    prerequisites:
      - id: hypothesis-tests-logic
        weight: 0.7
        key: true
      - id: discrete-probability-distributions
        weight: 0.5
        key: false
      - id: summation-notation
        weight: 0.3
        key: false
    knowledge_points:
      - id: kp1
        name: "Expected counts under H0"
        key_prerequisites: [discrete-probability-distributions]
        step_check:
          step: 'The expected count in each category is $n$ times its probability under $H_0$'
          question: 'Why are the expected counts found from $n \cdot p_i$ and not from the observed counts?'
          options:
            - 'The observed counts are only known after the test is finished'
            - 'Expected counts describe a world where $H_0$ is true, so only $H_0$ gives them'
            - 'Using observed counts would make $\chi^2$ too large to judge'
            - 'Observed counts always equal $n \cdot p_i$ exactly, so nothing else would be needed'
          answer: 'Expected counts describe a world where $H_0$ is true, so only $H_0$ gives them'
          why: 'The test asks how far the data are from what $H_0$ predicts. The prediction is $n\cdot p_i$, so it cannot be built from the data themselves.'
        exemplars:
          - problem: 'A fair six-sided die is rolled $90$ times. How many times is each face expected to appear?'
            answer: '15'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'If the die is fair, each face has probability $\frac16$. So each face is expected $90\cdot\frac16=15$ times.'
          - problem: 'A website claims that visitors choose page A with probability $40\%$, page B with $35\%$ and page C with $25\%$. Out of $300$ visits, how many visits to page B are expected if the claim is true?'
            answer: '105'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The expected count is the sample size times the probability. For page B it is $300\cdot0.35=105$.'
          - problem: 'A candy maker claims that $18\%$ of the candies in a bag are orange. In a sample of $500$ candies, how many orange candies are expected if the claim is true?'
            answer: '90'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The expected count is $n\cdot p=500\cdot0.18=90$ orange candies.'
          - problem: 'A model says that a sample falls in the third of four categories with probability $0.30$, and the expected count for that category is $45$. What is the sample size?'
            answer: '150'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The expected count is $n\cdot p$, so $45=n\cdot0.30$. Dividing by $0.30$ gives $n=150$.'
          - problem: 'A survey of $200$ people is sorted into four categories. The expected counts are $40$, $60$, $70$ and $x$. Find $x$.'
            answer: '30'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Expected counts add up to the sample size, $200$. So $x=200-(40+60+70)=30$.'
          - problem: 'A spinner has three regions with probabilities $\frac14$, $\frac12$ and $\frac14$ under the null hypothesis. It is spun $64$ times. Find the expected count for each region, in the order of the regions.'
            answer: '16, 32, 16'
            answer_contract: {"kind": "list", "member": {"kind": "exact"}, "ordered": true}
            solution_sketch: 'Each expected count is $64$ times the probability of the region. So the counts are $64\cdot\frac14=16$, $64\cdot\frac12=32$ and $64\cdot\frac14=16$.'
          - problem: 'A genetics model says that plants fall into four types in the ratio $9:3:3:1$. Among $160$ plants, how many are expected in the second type?'
            answer: '30'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The ratio has $9+3+3+1=16$ parts, so one part is $160\div16=10$ plants. The second type has $3$ parts, so $3\cdot10=30$ plants are expected.'
        constraints: 'n times p_i is always a whole number; at most 6 categories; one item gives a ratio, one finds the sample size from an expected count, one finds a missing expected count'
      - id: kp2
        name: "The chi-square statistic"
        key_prerequisites: [summation-notation, discrete-probability-distributions]
        step_check:
          step: 'Each category adds $(O-E)^2/E$'
          question: 'Why are the differences $O-E$ squared before they are divided by $E$?'
          options:
            - 'Squaring turns each count into a probability that sums to $1$'
            - 'Squaring makes small differences count for more than large ones'
            - 'Squaring is needed because expected counts are almost never whole numbers'
            - 'Squaring stops positive and negative differences from cancelling to zero'
          answer: 'Squaring stops positive and negative differences from cancelling to zero'
          why: 'The differences $O-E$ add to zero over all categories. Squaring makes every difference positive, so each one adds to the statistic.'
        exemplars:
          - problem: 'A cafe manager claims that customers choose equally among three pastries. Of $30$ customers, $14$, $6$ and $10$ chose them. Find the chi-square statistic.'
            answer: '3.2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Under the claim each pastry is expected $30/3=10$ times. So $\chi^2=\frac{(14-10)^2}{10}+\frac{(6-10)^2}{10}+\frac{(10-10)^2}{10}=1.6+1.6+0=3.2$.'
          - problem: 'A coin is tossed $40$ times and shows $24$ heads and $16$ tails. Find the chi-square statistic for the claim that the coin is fair.'
            answer: '1.6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A fair coin is expected to show $20$ heads and $20$ tails. So $\chi^2=\frac{(24-20)^2}{20}+\frac{(16-20)^2}{20}=0.8+0.8=1.6$.'
          - problem: 'A survey asks $100$ people to choose among four brands, and the claim is that all brands are equally popular. The observed counts are $40$, $20$, $15$ and $25$. Find the chi-square statistic.'
            answer: '14'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Each brand is expected $100/4=25$ times. So $\chi^2=\frac{15^2}{25}+\frac{5^2}{25}+\frac{10^2}{25}+\frac{0^2}{25}=9+1+4+0=14$.'
          - problem: 'A teacher expects $10$, $20$ and $20$ students in three groups. The observed counts are $12$, $18$ and $20$. Find the chi-square statistic.'
            answer: '0.6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The terms are $\frac{(12-10)^2}{10}=0.4$, $\frac{(18-20)^2}{20}=0.2$ and $\frac{(20-20)^2}{20}=0$. Their sum is $0.6$.'
          - problem: 'A sample of $300$ plants is expected to fall into four types in the ratio $1:1:2:2$. The observed counts are $45$, $55$, $105$ and $95$. Find the chi-square statistic.'
            answer: '1.5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'One part is $300/6=50$, so the expected counts are $50$, $50$, $100$ and $100$. Then $\chi^2=\frac{25}{50}+\frac{25}{50}+\frac{25}{100}+\frac{25}{100}=1.5$.'
          - problem: 'A six-sided die is rolled $120$ times, and each face is expected $20$ times. The observed counts are $18$, $22$, $25$, $15$, $20$ and $20$. Find the chi-square statistic.'
            answer: '2.9'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The squared differences are $4$, $4$, $25$, $25$, $0$ and $0$, which add up to $58$. Dividing by $20$ gives $\chi^2=58/20=2.9$.'
          - problem: 'A coin is tossed $40$ times and shows $30$ heads and $10$ tails. Mia adds only the squared differences, $(30-20)^2+(10-20)^2=200$. What is the correct chi-square statistic for a fair coin?'
            answer: '10'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Mia left out the division by the expected count $20$. Each term is $\frac{(O-E)^2}{E}=\frac{100}{20}=5$, so $\chi^2=5+5=10$.'
          - problem: 'A lab sorts $50$ seeds into three classes, which under its model have probabilities $0.32$, $0.32$ and $0.36$. The observed counts are $18$, $22$ and $10$. Find the chi-square statistic to two decimal places.'
            answer: '6.06'
            answer_contract: {"kind": "approx", "decimals": 2}
            solution_sketch: 'The expected counts are $16$, $16$ and $18$. Then $\chi^2=\frac{4}{16}+\frac{36}{16}+\frac{64}{18}=0.25+2.25+3.5556=6.0556$, which is $6.06$ to two decimal places.'
        constraints: '(O - E)^2 values divide cleanly by E except one item that asks for two decimals; observed and expected totals match; one item corrects a missing division by E'
      - id: kp3
        name: "Decision and degrees of freedom"
        key_prerequisites: [hypothesis-tests-logic]
        step_check:
          step: 'so reject $H_0$ when $\chi^2$ exceeds the critical value $9.488$'
          question: 'Why is $H_0$ rejected only when $\chi^2$ is large, and never when it is small?'
          options:
            - 'A small $\chi^2$ means the counts match $H_0$, so no evidence against it exists'
            - 'A small $\chi^2$ means that the sample was too small to be used in the test'
            - 'Only the right tail of the chi-square curve contains any probability'
            - 'A small $\chi^2$ proves that the observed counts were copied from the expected ones'
          answer: 'A small $\chi^2$ means the counts match $H_0$, so no evidence against it exists'
          why: 'A large $\chi^2$ means the observed counts are far from the expected counts. A small value means a good fit, which gives no reason to doubt $H_0$.'
        exemplars:
          - problem: 'A goodness-of-fit test with $4$ categories gives $\chi^2=7.9$. At $\alpha=0.05$ the critical value with $3$ degrees of freedom is $7.815$. What is the decision?'
            answer: 'reject'
            answer_contract: {"kind": "label", "options": [["reject", "reject h0", "reject the null hypothesis", "reject the null", "reject null"], ["fail to reject", "do not reject", "fail to reject h0", "do not reject h0", "fail to reject the null hypothesis", "do not reject the null hypothesis", "fail to reject the null", "retain"]]}
            solution_sketch: 'The test is right-tailed, so we reject when $\chi^2$ exceeds the critical value. Here $7.9>7.815$, so we reject $H_0$.'
          - problem: 'A goodness-of-fit test with $2$ categories gives $\chi^2=2.5$. At $\alpha=0.05$ the critical value with $1$ degree of freedom is $3.841$. What is the decision?'
            answer: 'fail to reject'
            answer_contract: {"kind": "label", "options": [["fail to reject", "do not reject", "fail to reject h0", "do not reject h0", "fail to reject the null hypothesis", "do not reject the null hypothesis", "fail to reject the null", "retain"], ["reject", "reject h0", "reject the null hypothesis", "reject the null", "reject null"]]}
            solution_sketch: 'The statistic is $2.5$, which does not exceed the critical value $3.841$. So we fail to reject $H_0$.'
          - problem: 'A genetics class tests Mendel''s claim that seed shape and color fall into four categories in the ratio $9:3:3:1$. How many degrees of freedom does the goodness-of-fit test have?'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The degrees of freedom are the number of categories minus one. With $4$ categories this is $4-1=3$.'
          - problem: 'A goodness-of-fit test over $5$ categories runs at $\alpha=0.05$, and the critical value with $4$ degrees of freedom is $9.488$. Only large values of the statistic signal a poor fit. For which values $x$ of the statistic is $H_0$ rejected?'
            answer: 'x > 9.488'
            answer_contract: {"kind": "inequality_union"}
            solution_sketch: 'The test is right-tailed, so $H_0$ is rejected when the statistic is above the critical value. The rejection region is $x>9.488$.'
          - problem: 'A goodness-of-fit test is reported with $5$ degrees of freedom. How many categories does the test compare?'
            answer: '6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The degrees of freedom are the number of categories minus one. So the number of categories is $5+1=6$.'
          - problem: 'A four-sided die is rolled $100$ times and the counts are $30$, $30$, $22$ and $18$. Find the chi-square statistic for the claim that the die is fair.'
            answer: '4.32'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A fair die is expected $25$ times for each face. Then $\chi^2=\frac{25+25+9+49}{25}=\frac{108}{25}=4.32$.'
          - problem: 'A candy maker claims that the colors red, green and blue occur in the ratio $1:1:2$. A sample of $200$ sweets has $60$ red, $45$ green and $95$ blue. Find the chi-square statistic.'
            answer: '2.75'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The expected counts are $50$, $50$ and $100$. Then $\chi^2=\frac{100}{50}+\frac{25}{50}+\frac{25}{100}=2+0.5+0.25=2.75$.'
          - problem: 'A goodness-of-fit test over $6$ categories runs at $\alpha=0.01$, and the critical value with $5$ degrees of freedom is $15.086$. For which values $x$ of the statistic is $H_0$ not rejected?'
            answer: 'x <= 15.086'
            answer_contract: {"kind": "inequality_union"}
            solution_sketch: 'The test rejects only when the statistic is strictly above $15.086$. So $H_0$ is kept when $x\le15.086$.'
        constraints: 'critical values always supplied with their df; df = k - 1 in both directions; rejection is right-tail only; two label items with different answers; the rejection region is written as an inequality in x'
    diagnostic_exemplar:
      problem: 'A four-sided die is rolled $100$ times: observed counts $(30, 30, 22, 18)$. Test $H_0$: "the die is fair" at $\alpha = 0.05$; the critical value with df $= 3$ is $7.815$ (given). Compute $\chi^2$ and decide.'
      answer: 'Expected $25$ each; $\chi^2 = \dfrac{25 + 25 + 9 + 49}{25} = 4.32 < 7.815$: fail to reject $H_0$ — the counts are consistent with a fair die.'
      solution_sketch: 'A fair die makes every expected count $100/4 = 25$; sum $\frac{(O - E)^2}{E}$ over the four cells and compare with the supplied critical value $7.815$ — falling below it means the discrepancies are within chance variation.'
    anki_seeds:
      - front: 'Chi-square statistic?'
        back: '$\chi^2 = \sum \dfrac{(O - E)^2}{E}$ over all categories.'
        type: basic
      - front: 'Degrees of freedom for goodness-of-fit with $k$ categories?'
        back: '$k - 1$.'
        type: basic
      - front: 'Chi-square rejection region?'
        back: 'Right tail only — large values signal misfit between observed and expected counts.'
        type: basic

  - id: inference-for-slope
    name: "Inference for the Regression Slope"
    core: false                # caps the supplemental regression branch; nothing downstream — kept supplemental rather than flipping least-squares-line back to core (R-2)
    difficulty: 0.7
    drill: false
    answer_kind: multi-step
    expected_time_secs: 240
    prerequisites:
      - id: least-squares-line
        weight: 0.7
        key: true
      - id: one-sample-t-test
        weight: 0.7
        key: true
      - id: correlation-regression
        weight: 0.4
        key: false
    knowledge_points:
      - id: kp1
        name: "The slope varies from sample to sample"
        key_prerequisites: [least-squares-line, one-sample-t-test]
        step_check:
          step: 'The standard error $0.7$ is the standard deviation of the fitted slopes over many samples'
          question: 'Why does the standard error $\operatorname{SE}_b$ tell us how much the fitted slope varies?'
          options:
            - 'It measures how far each point lies from the fitted line in one sample'
            - 'It is the average of the slopes of all lines through the data points'
            - 'Samples give different lines; $\operatorname{SE}_b$ is their spread'
            - 'It shows how many points are needed before the slope stops changing'
          answer: 'Samples give different lines; $\operatorname{SE}_b$ is their spread'
          why: 'A fitted slope is a statistic: it changes from sample to sample, and its standard deviation across samples is the standard error.'
        exemplars:
          - problem: 'A teacher fits a line to the exam scores of $25$ students against their hours of revision. The slope is $b=2.1$ points per hour, with standard error $\operatorname{SE}_b=0.7$. What is the variance of the sampling distribution of $b$?'
            answer: '0.49'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The standard error is the standard deviation of the sampling distribution of $b$. The variance is the square of the standard deviation. So the variance is $0.7^2=0.49$.'
          - problem: 'A shop regresses weekly sales on the price of a product. The fitted slope is $b=-1.5$ and its standard error is $\operatorname{SE}_b=0.4$. What is the variance of the sampling distribution of the slope?'
            answer: '0.16'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The standard error $0.4$ is the standard deviation of the sampling distribution of the slope. The variance is its square. So the variance is $0.4^2=0.16$.'
          - problem: 'A school fits a line to many random samples of students, with exam score as $y$ and revision hours as $x$. Suppose the population slope is $\beta=0$. What is the mean of the sampling distribution of the fitted slope $b$?'
            answer: '0'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The sampling distribution of $b$ is centered at the population slope $\beta$. In this case the population slope is $0$. So the mean of the fitted slopes over many samples is $0$.'
          - problem: 'A census shows that the true slope of height against age for the children of a town is $\beta=1.4$ cm per month. A random sample of children gives a fitted slope $b=0.9$ cm per month. What is the error $b-\beta$ of the sample slope?'
            answer: '-0.5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The error of the estimate is the fitted slope minus the population slope. Here $b-\beta=0.9-1.4=-0.5$. The sample slope is $0.5$ below the true slope, so the sign of the error is negative.'
          - problem: 'A researcher fits a line to the weights of $30$ apples against their diameters, to test whether the weight depends linearly on the diameter. What does the null hypothesis $H_0$ state about the population slope $\beta$?'
            answer: 'zero'
            answer_contract: {"kind": "label", "options": [["zero", "β = 0", "beta = 0", "beta equals 0", "the slope is zero", "it is zero", "no linear relationship"], ["not zero", "β ≠ 0", "beta != 0", "nonzero", "it is not zero", "the slope is not zero"], ["positive", "β > 0", "beta > 0", "the slope is positive", "it is positive"]]}
            solution_sketch: 'The null hypothesis says that there is no linear relationship between the two variables. In terms of the population slope this means that $\beta$ is zero. The claim that $\beta$ is not zero belongs to the alternative hypothesis, and the hypotheses are about $\beta$, never about the sample slope $b$.'
          - problem: 'A farmer regresses the yield of a field on the amount of fertilizer. Over many samples the fitted slopes have a sampling distribution with variance $0.25$. What is the standard error $\operatorname{SE}_b$ of the slope?'
            answer: '0.5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The standard error is the standard deviation of the sampling distribution. The variance is $0.25$, so the standard deviation is its square root. Since $0.5^2=0.25$, the standard error is $0.5$.'
          - problem: 'In a regression of plant height on hours of sunlight, the fitted slope is $b=3.2$ and its standard error is $\operatorname{SE}_b=0.8$. If the true slope were $0$, how many standard errors above $0$ would the fitted slope lie?'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The fitted slope is $3.2$ above $0$. One standard error is $0.8$. So the slope lies $3.2\div0.8=4$ standard errors above $0$.'
        constraints: 'hypotheses are about beta, never about b; SE_b is always supplied, never computed from raw data; every item has a context in which a line is fitted to a sample'
      - id: kp2
        name: "The t statistic for the slope"
        key_prerequisites: [one-sample-t-test, least-squares-line]
        step_check:
          step: 'The degrees of freedom are $n-2$, because the line has two estimated values, the intercept and the slope'
          question: 'Why does the slope test use $n-2$ degrees of freedom and not $n-1$?'
          options:
            - 'The line has two estimated values: intercept and slope'
            - 'The slope test compares two groups, so two is subtracted from $n$'
            - 'Two of the $n$ points always lie exactly on the fitted line'
            - 'The slope and the standard error each cost one degree of freedom'
          answer: 'The line has two estimated values: intercept and slope'
          why: 'The line uses up two estimated values from the data, so only $n-2$ values are free to vary, unlike $n-1$ for a single mean.'
        exemplars:
          - problem: 'A study of $18$ plants regresses height on the hours of sunlight. The estimated slope is $b=2.4$ cm per hour, with $\operatorname{SE}_b=0.6$. What is the $t$ statistic for the slope?'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The $t$ statistic is the slope divided by its standard error. Substitute the values: $t=2.4\div0.6=4$. The slope is $4$ standard errors from zero.'
          - problem: 'A regression of height on sunlight is fitted to $n=18$ plants. How many degrees of freedom does the $t$ test for the slope have?'
            answer: '16'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The slope test has $n-2$ degrees of freedom, because two values, the intercept and the slope, are estimated. For $n=18$ this gives $18-2=16$ degrees of freedom.'
          - problem: 'A regression of the sale price of $15$ flats on their distance from the centre gives $b=-1.2$ with $\operatorname{SE}_b=0.8$. What is the $t$ statistic for the slope?'
            answer: '-3/2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Divide the slope by its standard error: $t=-1.2\div0.8=-1.5=-\frac{3}{2}$. The negative sign shows that the price falls as the distance grows.'
          - problem: 'A gardener regresses the height of $26$ plants on the daily hours of sunlight. The estimated slope is $b=0.75$ cm per hour, with $\operatorname{SE}_b=0.25$. What is the $t$ statistic for the slope?'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The $t$ statistic is $b$ divided by $\operatorname{SE}_b$. So $t=0.75\div0.25=3$. There are $26-2=24$ degrees of freedom for this test.'
          - problem: 'A regression on $n=14$ points gives a $t$ statistic of $2.5$ for the slope, and the standard error of the slope is $\operatorname{SE}_b=0.6$. What is the estimated slope $b$?'
            answer: '1.5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Since $t=b\div\operatorname{SE}_b$, the slope is $b=t\cdot\operatorname{SE}_b$. Multiply: $b=2.5\cdot0.6=1.5$. The estimated slope is $1.5$.'
          - problem: 'A regression on $n=20$ points gives a slope $b=2$ and a $t$ statistic of $4$ for the slope. What is the standard error of the slope?'
            answer: '1/2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Since $t=b\div\operatorname{SE}_b$, the standard error is $\operatorname{SE}_b=b\div t$. Divide: $\operatorname{SE}_b=2\div4=\frac{1}{2}$. The standard error is $0.5$.'
          - problem: 'An experiment with $n=11$ data points estimates a slope of $b=-0.6$ with standard error $\operatorname{SE}_b=1.2$. What is the $t$ statistic for the slope?'
            answer: '-1/2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Divide the slope by its standard error: $t=-0.6\div1.2=-0.5=-\frac{1}{2}$. The slope is only half a standard error below zero.'
          - problem: 'A critical value for a slope test is read from the table with $12$ degrees of freedom. How many data points $n$ were in the regression?'
            answer: '14'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The degrees of freedom of the slope test are $n-2$. So $n-2=12$, which gives $n=12+2=14$. The regression used $14$ data points.'
          - problem: 'A regression on $n=18$ points gives $b=2.4$ and $\operatorname{SE}_b=0.6$. Ana computes the $t$ statistic as $0.6\div2.4=0.25$. What is the correct $t$ statistic?'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Ana divided the standard error by the slope, but the $t$ statistic is the slope divided by its standard error. The correct value is $t=2.4\div0.6=4$. The slope lies far from zero, so $0.25$ could not be right.'
        constraints: 'b / SE_b comes out to halves or whole numbers; one item asks for the degrees of freedom df = n - 2 on its own, one asks for n from df'
      - id: kp3
        name: "Test and confidence interval for the slope"
        key_prerequisites: [one-sample-t-test, least-squares-line]
        step_check:
          step: 'The interval is $b\pm t^*\operatorname{SE}_b$, and it does not contain $0$, so we reject $H_0:\beta=0$'
          question: 'Why does a $95\%$ interval that does not contain $0$ lead us to reject $H_0:\beta=0$ at $\alpha=0.05$?'
          options:
            - 'The interval has width $2t^*\operatorname{SE}_b$, which must exceed $0$'
            - 'Slopes outside the interval are rejected, and $0$ is outside'
            - 'A $95\%$ interval always contains the fitted slope $b$, never $0$'
            - 'The $t$ statistic equals the width of the interval, and it is large'
          answer: 'Slopes outside the interval are rejected, and $0$ is outside'
          why: 'The interval holds exactly the slopes that a test at $\alpha=0.05$ would not reject, so a value outside it, such as $0$, is rejected.'
        exemplars:
          - problem: 'A study of weekly exercise hours ($x$) and resting heart rate ($y$) uses $n=17$ people. The fitted slope is $b=2.4$ with $\operatorname{SE}_b=0.8$. Find the $t$ statistic for testing $H_0:\beta=0$.'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The $t$ statistic is $t=b\div\operatorname{SE}_b$. So $t=2.4\div0.8=3$. This test has $17-2=15$ degrees of freedom.'
          - problem: 'In the study of weekly exercise hours and resting heart rate with $n=17$ people, the slope is $b=2.4$ and $\operatorname{SE}_b=0.8$. The critical value is $t^*=2.131$ for $15$ degrees of freedom at $\alpha=0.05$. Do we reject $H_0:\beta=0$ or fail to reject it?'
            answer: 'reject'
            answer_contract: {"kind": "label", "options": [["reject", "reject H0", "reject the null hypothesis", "we reject H0", "reject the null", "rejected"], ["fail to reject", "do not reject", "do not reject H0", "fail to reject H0", "fail to reject the null hypothesis", "retain H0", "cannot reject H0"]]}
            solution_sketch: 'The $t$ statistic is $2.4\div0.8=3$. Since $3>2.131$, the statistic lies beyond the critical value. So we reject $H_0$, which means there is evidence of a linear relationship.'
          - problem: 'A plant biologist regresses growth on light exposure for $n=17$ plants and finds $b=3.2$ with $\operatorname{SE}_b=1.0$. For $15$ degrees of freedom the table gives $t^*=2.131$. Find the $95\%$ confidence interval for the slope.'
            answer: '1.069, 5.331'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The margin of error is $t^*\operatorname{SE}_b=2.131\cdot1.0=2.131$. The interval is $3.2\pm2.131$, so the lower endpoint is $1.069$ and the upper endpoint is $5.331$. The interval does not contain $0$.'
          - problem: 'A meteorologist regresses the daily temperature on the altitude of $n=12$ stations. The slope is $b=-1.8$ with $\operatorname{SE}_b=0.6$. Find the $t$ statistic for testing $H_0:\beta=0$.'
            answer: '-3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The $t$ statistic is $t=b\div\operatorname{SE}_b$. Substitute: $t=-1.8\div0.6=-3$. The negative sign shows that the temperature falls as the altitude rises.'
          - problem: 'A teacher regresses test score on weekly study time for $n=14$ students and finds $b=0.9$ with $\operatorname{SE}_b=0.6$. The critical value is $t^*=2.179$ for $12$ degrees of freedom at $\alpha=0.05$. Do we reject $H_0:\beta=0$ or fail to reject it?'
            answer: 'fail to reject'
            answer_contract: {"kind": "label", "options": [["reject", "reject H0", "reject the null hypothesis", "we reject H0", "reject the null", "rejected"], ["fail to reject", "do not reject", "do not reject H0", "fail to reject H0", "fail to reject the null hypothesis", "retain H0", "cannot reject H0"]]}
            solution_sketch: 'The $t$ statistic is $0.9\div0.6=1.5$. Since $1.5<2.179$, the statistic does not reach the critical value. So we fail to reject $H_0$, because the data do not show a linear relationship at this level.'
          - problem: 'In a regression with $n=27$ observations, the slope is $b=0.75$ and $\operatorname{SE}_b=0.2$. For $25$ degrees of freedom the table gives $t^*=2.060$. Find the $95\%$ confidence interval for the slope.'
            answer: '0.338, 1.162'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The margin of error is $t^*\operatorname{SE}_b=2.060\cdot0.2=0.412$. The interval is $0.75\pm0.412$. Its endpoints are $0.338$ and $1.162$, and the interval does not contain $0$.'
          - problem: 'A shop regresses sales on price over $n=10$ stores and finds $b=-1.4$ with $\operatorname{SE}_b=0.5$. What is the $t$ statistic for testing $H_0:\beta=0$?'
            answer: '-2.8'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The $t$ statistic is $t=-1.4\div0.5=-2.8$. The negative sign shows that sales fall as the price rises, and the test has $10-2=8$ degrees of freedom.'
          - problem: 'A regression of test score on study time has $n=14$ students and $t^*=2.2$ for $12$ degrees of freedom. The standard error of the slope is $\operatorname{SE}_b=0.25$. Find the margin of error $t^*\operatorname{SE}_b$ of the confidence interval for the slope.'
            answer: '0.55'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The margin of error is the critical value times the standard error. So $t^*\operatorname{SE}_b=2.2\cdot0.25=0.55$. The interval extends $0.55$ on each side of $b$.'
          - problem: 'A confidence interval for a slope has margin of error $0.55$, and the critical value is $t^*=2.2$. What is the standard error of the slope?'
            answer: '0.25'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The margin of error is $t^*\operatorname{SE}_b$, so $\operatorname{SE}_b$ is the margin divided by $t^*$. Divide: $0.55\div2.2=0.25$. The standard error of the slope is $0.25$.'
        constraints: 't* supplied with df = n - 2; confidence interval endpoints are exact decimals of at most three places; the decision is a separate item from the t statistic; when both test and interval appear, their agreement is stated'
    diagnostic_exemplar:
      problem: 'A regression of daily heating cost in EUR ($y$) on outdoor temperature in °C ($x$) over $n = 22$ days gives $b = -2.5$ with $\operatorname{SE}_b = 1.0$; $t^* = 2.086$ (df $20$, $\alpha = 0.05$). Test $H_0: \beta = 0$ and conclude in context.'
      answer: '$t = -2.5$ and $|-2.5| > 2.086$: reject $H_0$ — evidence of a real linear relationship, with cost falling by about $2.5$ EUR per additional degree.'
      solution_sketch: 'The slope test is an ordinary t-test: $t = (b - 0)/\operatorname{SE}_b$ against the supplied $t^* = 2.086$ on $n - 2 = 20$ df. Rejecting says the slope is distinguishable from zero; state it in EUR per degree.'
