unit: hypothesis-testing
course: probability-statistics
module: "Hypothesis Testing"
topics:
  - id: hypothesis-tests-logic
    name: "The Logic of Significance Tests"
    core: true                 # the decision framework every test topic (z, t, chi-square, slope) builds on
    difficulty: 0.55
    drill: false
    answer_kind: multi-step
    expected_time_secs: 180
    prerequisites:
      - id: sampling-distributions
        weight: 0.8
        key: true
      - id: normal-distribution
        weight: 0.4
        key: false
      - id: populations-samples
        weight: 0.3
        key: false
    knowledge_points:
      - id: kp1
        name: "Null and alternative hypotheses"
        key_prerequisites: [populations-samples]
        exemplars:
          - problem: "A juice plant is set to fill bottles with a claimed mean of 330 mL, and an inspector suspects the plant is underfilling. Select the correct null and alternative hypotheses."
            answer: "H0: mu = 330; H1: mu < 330"
            answer_contract: {"kind": "label", "options": [["H0: mu = 330; H1: mu < 330"], ["H0: mu = 330; H1: mu > 330"], ["H0: mu < 330; H1: mu = 330"], ["H0: xbar = 330; H1: xbar < 330"]]}
            solution_sketch: "The full result is H0: mu = 330; H1: mu < 330. Step 1 (null hypothesis rule): the null states the claimed parameter value, so H0: mu = 330. Step 2 (alternative hypothesis rule): underfilling is a one-sided suspicion in the low direction, so H1: mu < 330. The wrong option H0: mu = 330; H1: mu > 330 reverses the suspected direction. The wrong option H0: mu < 330; H1: mu = 330 swaps the claim into the alternative and puts the inequality in the null. The wrong option H0: xbar = 330; H1: xbar < 330 uses the sample mean xbar rather than the parameter mu. The answer is H0: mu = 330; H1: mu < 330."
          - problem: "A quality engineer claims that exactly half of the chips on a line pass a quick screen, so the pass probability is p = 1/2, but a spot check suggests the rate is not exactly one half. State the null hypothesis value for p and the alternative hypothesis as an inequality in p."
            answer: "H0 = 1/2; H1 = p < 1/2 or p > 1/2"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "H0"}, {"contract": {"kind": "inequality_union"}, "name": "H1"}]}
            solution_sketch: "The full result is H0 = 1/2; H1 = p < 1/2 or p > 1/2. Step 1 (null hypothesis rule): the claimed pass probability is the null value, so H0: p = 1/2. Step 2 (alternative rule): a deviation possible in either direction gives the two-sided alternative, so H1: p < 1/2 or p > 1/2. The answer is H0 = 1/2; H1 = p < 1/2 or p > 1/2."
          - problem: "A coach claims a player makes 7 of every 10 free throws, so the make probability is p = 7/10. After extra practice the analyst suspects the true make rate is now higher. State the null hypothesis value for p and the alternative hypothesis as an inequality in p."
            answer: "H0 = 7/10; H1 = p > 7/10"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "H0"}, {"contract": {"kind": "inequality_union"}, "name": "H1"}]}
            solution_sketch: "The full result is H0 = 7/10; H1 = p > 7/10. Step 1 (null hypothesis rule): the claimed make probability is the null value, so H0: p = 7/10. Step 2 (alternative rule): suspecting a higher rate is a one-sided suspicion in the high direction, so H1: p > 7/10. The answer is H0 = 7/10; H1 = p > 7/10."
          - problem: "A coffee machine is specified to dispense a mean of 240 mL per cup, and the quality team wants to know whether the true mean differs from 240 in either direction. Select the correct null and alternative hypotheses."
            answer: "H0: mu = 240; H1: mu < 240 or mu > 240"
            answer_contract: {"kind": "label", "options": [["H0: mu = 240; H1: mu < 240 or mu > 240"], ["H0: mu = 240; H1: mu < 240"], ["H0: mu = 240; H1: mu > 240"], ["H0: xbar = 240; H1: xbar < 240 or xbar > 240"]]}
            solution_sketch: "The full result is H0: mu = 240; H1: mu < 240 or mu > 240. Step 1 (null hypothesis rule): the null states the specified parameter mean, so H0: mu = 240. Step 2 (alternative hypothesis rule): a difference possible in either direction makes the test two-sided, so H1: mu < 240 or mu > 240. The wrong option H0: mu = 240; H1: mu < 240 drops the upper side and is one-sided. The wrong option H0: mu = 240; H1: mu > 240 tests only the high direction. The wrong option H0: xbar = 240; H1: xbar < 240 or xbar > 240 states hypotheses about the sample mean xbar instead of the parameter mu. The answer is H0: mu = 240; H1: mu < 240 or mu > 240."
          - problem: "A transit authority reports that 1/4 of its buses run late. A daily rider, who has seen few late buses recently, suspects the true late proportion is now lower. State the null hypothesis value for p and the alternative hypothesis as an inequality in p."
            answer: "H0 = 1/4; H1 = p < 1/4"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "H0"}, {"contract": {"kind": "inequality_union"}, "name": "H1"}]}
            solution_sketch: "The full result is H0 = 1/4; H1 = p < 1/4. Step 1 (null hypothesis rule): the reported late proportion is the null value, so H0: p = 1/4. Step 2 (alternative rule): suspecting a smaller proportion is a one-sided suspicion in the low direction, so H1: p < 1/4. The answer is H0 = 1/4; H1 = p < 1/4."
          - problem: "An app team claims that 3 of every 25 users subscribe to the premium plan, so the subscription probability is p = 3/25. The growth lead suspects the true subscription proportion is now higher. State the null hypothesis value for p and the alternative hypothesis as an inequality in p."
            answer: "H0 = 3/25; H1 = p > 3/25"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "H0"}, {"contract": {"kind": "inequality_union"}, "name": "H1"}]}
            solution_sketch: "The full result is H0 = 3/25; H1 = p > 3/25. Step 1 (null hypothesis rule): the claimed subscription probability is the null value, so H0: p = 3/25. Step 2 (alternative rule): suspecting a higher proportion is a one-sided suspicion in the high direction, so H1: p > 3/25. The answer is H0 = 3/25; H1 = p > 3/25."
        constraints: "concrete scenarios naming a parameter; the answer states both hypotheses and whether the test is one- or two-sided; hypotheses are about parameters (mu, p), never about x-bar"
      - id: kp2
        name: "The p-value"
        key_prerequisites: [sampling-distributions, normal-distribution]
        exemplars:
          - problem: "A significance test reports a small tail probability. Select the statement that correctly describes what this probability measures."
            answer: "chance of data if H0 holds"
            answer_contract: {"kind": "label", "options": [["chance of data if H0 holds"], ["chance that H0 holds"], ["chance of data if H1 holds"], ["chance that H1 holds true"]]}
            solution_sketch: "Step 1 (definition of a p-value): the p-value is the chance of data at least as extreme as observed, computed assuming H0 is true. Step 2 (check options): the option 'chance that H0 holds' treats the p-value as the probability of H0; 'chance of data if H1 holds' and 'chance that H1 holds true' use the wrong hypothesis. The correct choice is chance of data if H0 holds."
          - problem: "In a two-sided test, a sample mean lies 1 standard error from the null mean. Use the empirical rule to approximate the p-value. Give the answer to 2 decimals."
            answer: "0.32"
            answer_contract: {"decimals": 2, "kind": "approx"}
            solution_sketch: "Step 1 (empirical rule): for a two-sided test, 1 standard error from the null mean leaves about 0.32 in the two tails combined. Step 2 (report p-value): the p-value is that tail probability. The p-value is 0.32."
          - problem: "In a two-sided test, the p-value is about 0.003. How many standard errors from the null mean is the sample mean? Give the answer as a whole number."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (empirical rule): a two-sided p-value of 0.003 matches about 3 standard errors from the null mean. Step 2 (reverse reading): read the empirical rule backward to recover the distance. The answer is 3."
          - problem: "In a two-sided test, a sample mean lies 2 standard errors from the null mean. Use the empirical rule. Give the p-value to 2 decimals."
            answer: "0.05"
            answer_contract: {"decimals": 2, "kind": "approx"}
            solution_sketch: "Step 1 (empirical rule): for a two-sided test, 2 standard errors from the null mean leaves about 0.05 in the two tails combined. Step 2 (p-value): the p-value is that combined tail area. The p-value is 0.05."
          - problem: "In a two-sided test, the p-value is about 0.32. How many standard errors from the null mean is the sample mean? Give the answer as a whole number."
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (empirical rule): a two-sided p-value of 0.32 matches about 1 standard error from the null mean. Step 2 (reverse reading): read the empirical rule backward to recover the distance. The answer is 1."
          - problem: "In a two-sided test, a sample mean lies 3 standard errors from the null mean. Use the empirical rule. Give the p-value to 3 decimals."
            answer: "0.003"
            answer_contract: {"decimals": 3, "kind": "approx"}
            solution_sketch: "Step 1 (empirical rule): for a two-sided test, 3 standard errors from the null mean leaves about 0.003 in the two tails combined. Step 2 (p-value): the p-value is that combined tail area. The p-value is 0.003."
        constraints: "p-values only at empirical-rule distances (1, 2, or 3 SEs, giving 0.32, 0.05, 0.003); interpretation items must include the assuming-H0 clause"
      - id: kp3
        name: "The decision rule"
        key_prerequisites: [sampling-distributions]
        exemplars:
          - problem: "A significance test runs at level alpha = 0.10 and returns p = 0.03. State the decision for H0, and give the ratio p/alpha as a fraction."
            answer: "decision = reject; ratio = 3/10"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["reject"], ["fail-to-reject"]]}, "name": "decision"}, {"contract": {"kind": "exact"}, "name": "ratio"}]}
            solution_sketch: "Decision rule: reject H0 when p is at most alpha, and fail to reject otherwise. Compare: p = 0.03 and alpha = 0.10, and 0.03 is below 0.10, so the test rejects H0. Ratio step: p/alpha = 0.03/0.10 = 3/10, which is less than 1, agreeing with the rejection. The answer is decision = reject; ratio = 3/10."
          - problem: "A coin-flip experiment tests H0 at level alpha = 0.01 and gets p = 0.07. State the decision for H0, and give the ratio p/alpha as a whole number."
            answer: "decision = fail-to-reject; ratio = 7"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["reject"], ["fail-to-reject"]]}, "name": "decision"}, {"contract": {"kind": "exact"}, "name": "ratio"}]}
            solution_sketch: "Decision rule: reject H0 only when p is at most alpha. Compare: p = 0.07 and alpha = 0.01, and 0.07 is above 0.01, so the test fails to reject H0; this is consistency with H0, not proof of it. Ratio step: p/alpha = 0.07/0.01 = 7, which is greater than 1, agreeing with the failure to reject. The answer is decision = fail-to-reject; ratio = 7."
          - problem: "A significance test at level alpha = 0.05 gives p = 0.31, so the analyst fails to reject H0. Which statement best describes what this outcome means for H0?"
            answer: "The data fit H0 but do not prove it"
            answer_contract: {"kind": "label", "options": [["The data fit H0 but do not prove it"], ["H0 is proven true by the observed data"], ["H0 has been accepted as the correct model"], ["H0 is certainly false given these data"]]}
            solution_sketch: "Rule: a p-value of 0.31 lies far above alpha = 0.05, so the data are not surprising under H0 and the test fails to reject; failing to reject only means consistency with H0, never proof. The option 'H0 is proven true by the observed data' errs by treating a failure to reject as proof. The option 'H0 has been accepted as the correct model' errs by using the language of accepting H0, which a test never does. The option 'H0 is certainly false given these data' errs in the opposite direction, since a large p-value gives no evidence against H0. The answer is The data fit H0 but do not prove it."
          - problem: "Five separate significance tests run at level alpha = 0.05. Their p-values are 0.011, 0.049, 0.062, 0.073 and 0.19. How many of the five tests reject H0?"
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Decision rule: a test rejects H0 exactly when its p-value is at most alpha = 0.05. Compare each p-value: 0.011 and 0.049 are at most 0.05, while 0.062, 0.073 and 0.19 all lie above 0.05. Count the rejections: 2 of the 5 tests reject H0. The answer is 2."
          - problem: "A significance test at level alpha = 0.05 ended with the decision to fail to reject H0. What must be true about its p-value? Give the answer as an inequality in p."
            answer: "p > 0.05"
            answer_contract: {"kind": "inequality_union"}
            solution_sketch: "Decision rule: a test rejects H0 when p is at most alpha, and it fails to reject only when p is greater than alpha. This test failed to reject at alpha = 0.05, so its p-value must lie strictly above 0.05. Writing the conclusion as an inequality in the variable p gives p > 0.05. The answer is p > 0.05."
          - problem: "A battery-life study runs four tests of H0 at level alpha = 0.01. The p-values are 0.004, 0.012, 0.031 and 0.10. How many of the four tests fail to reject H0?"
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Decision rule: a test rejects H0 only when its p-value is at most alpha = 0.01. Compare each p-value: 0.004 is at most 0.01, but 0.012, 0.031 and 0.10 each lie above 0.01, so those three tests fail to reject H0. Count: 3 of the 4 tests fail to reject H0. The answer is 3."
        constraints: "explicit p and alpha; answers use reject / fail to reject, never accept H0; one item per set probes the fail-to-reject-is-not-proof distinction"
    diagnostic_exemplar:
      problem: 'Packets should average $\mu = 250$ g. A sample of $n = 36$ packets gives a mean $2.5$ SEs below $250$. For a two-sided test at $\alpha = 0.05$: state the hypotheses, approximate the p-value with the empirical rule, and give the decision.'
      answer: '$H_0: \mu = 250$ vs $H_1: \mu \ne 250$; a mean at least $2.5$ SEs out is rarer than the $5\%$ chance of $2$ SEs, so $p < 0.05$ — reject $H_0$.'
      solution_sketch: 'State $H_0$ (the no-effect claim) against a two-sided $H_1$, then judge the observed distance against the empirical rule''s benchmark: $2$ SEs out already leaves only $5\%$, so $2.5$ SEs is rarer still and $p < \alpha$.'
    anki_seeds:
      - front: 'p-value?'
        back: 'The probability, assuming $H_0$, of data at least as extreme as what was observed.'
        type: basic
      - front: 'Decision rule at significance level $\alpha$?'
        back: 'Reject $H_0$ when $p \le \alpha$; otherwise fail to reject.'
        type: basic
      - front: 'Why say "fail to reject $H_0$" instead of "accept $H_0$"?'
        back: 'A large p-value shows the data are consistent with $H_0$, not that $H_0$ is true.'
        type: basic

  - id: type-i-ii-errors
    name: "Type I & II Errors"
    core: true                 # alpha and the error trade-off are machinery every downstream test topic uses
    difficulty: 0.55
    drill: false
    answer_kind: multi-step
    expected_time_secs: 150
    prerequisites:
      - id: hypothesis-tests-logic
        weight: 0.8
        key: true
      - id: conditional-probability
        weight: 0.4
        key: false
    knowledge_points:
      - id: kp1
        name: "Naming the two errors"
        key_prerequisites: [hypothesis-tests-logic]
        exemplars:
          - problem: "A smoke alarm rings even though there is no fire. The alarm runs a test with H0: \"there is no fire\". What kind of outcome is this?"
            answer: "Type I (rejecting an H0 that holds)"
            answer_contract: {"kind": "label", "options": [["Type I (rejecting an H0 that holds)"], ["Type II (keeping an H0 that is wrong)"], ["correct call (rejecting an H0 that is wrong)"], ["correct call (keeping an H0 that holds)"]]}
            solution_sketch: "Step 1 (definition of Type I): rejecting an H0 that holds is a Type I error. Step 2: the ringing alarm discards H0, and since there is no fire, H0 holds, so a true H0 was rejected. The wrong option \"Type II (keeping an H0 that is wrong)\" swaps the two errors, since H0 is not wrong here; \"correct call (rejecting an H0 that is wrong)\" fails because H0 holds; \"correct call (keeping an H0 that holds)\" fails because the alarm did not keep H0. The answer is Type I (rejecting an H0 that holds)."
          - problem: "A lab screening returns a negative result for a patient who in fact has the illness. The screening uses H0: \"the patient is free of the illness\". What kind of outcome is this?"
            answer: "Type II (keeping an H0 that is wrong)"
            answer_contract: {"kind": "label", "options": [["Type I (rejecting an H0 that holds)"], ["Type II (keeping an H0 that is wrong)"], ["correct call (rejecting an H0 that is wrong)"], ["correct call (keeping an H0 that holds)"]]}
            solution_sketch: "Step 1 (definition of Type II): keeping an H0 that is wrong is a Type II error. Step 2: the negative result keeps H0, and since the patient has the illness, H0 is wrong, so a false H0 was kept. The wrong option \"Type I (rejecting an H0 that holds)\" swaps the two errors, since H0 was not rejected; \"correct call (rejecting an H0 that is wrong)\" fails because nothing was rejected; \"correct call (keeping an H0 that holds)\" fails because H0 does not hold. The answer is Type II (keeping an H0 that is wrong)."
          - problem: "A factory checks each batch with H0: \"the batch meets the specification\". Four outcomes: (a) the batch is cleared and it meets the specification; (b) the batch is cleared but it falls short; (c) the batch is scrapped and it falls short; (d) the batch is scrapped though it meets the specification. A Type I error rejects an H0 that is in fact true. How many of the four outcomes are Type I errors?"
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Rule: a Type I error rejects an H0 that is in fact true. Step 1: outcomes (a) and (b) keep H0, so they cannot be Type I errors. Step 2: outcome (c) rejects H0 while H0 is false, which is a correct call. Step 3: outcome (d) rejects H0 while H0 is true. Only (d) is a Type I error. The answer is 1."
          - problem: "A spam filter examines every message with H0: \"the message is legitimate\". Five outcomes: (a) the message is delivered and it is legitimate; (b) the message is delivered but it is spam; (c) the message is blocked and it is spam; (d) the message is blocked though it is legitimate; (e) the message is delivered even though it is spam. A Type II error fails to reject an H0 that is in fact false. How many of the five outcomes are Type II errors?"
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Rule: a Type II error fails to reject an H0 that is in fact false. Step 1: outcomes (a) and (d) involve a legitimate message, so H0 is true there; (a) keeps H0 and (d) rejects it, so neither is Type II. Step 2: outcome (c) rejects a false H0, which is a correct call. Step 3: outcomes (b) and (e) keep a false H0, since spam was delivered. The answer is 2."
          - problem: "A scanner at an airport checkpoint screens bags with H0: \"the bag contains no banned item\". Five outcomes: (a) the bag passes and it contains no banned item; (b) the bag passes but it contains a banned item; (c) the bag is searched and it contains a banned item; (d) the bag is searched though it contains no banned item; (e) the bag passes although it hides a banned knife. A Type I error rejects an H0 that is in fact true, and a Type II error fails to reject an H0 that is in fact false. How many of the five outcomes are errors?"
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Rule: an error is any mismatch between the decision and the facts; Type I rejects a true H0 and Type II keeps a false H0. Step 1: outcome (a) keeps a true H0, so it is correct. Step 2: outcome (b) keeps a false H0, a Type II error, and outcome (e) also keeps a false H0, a Type II error. Step 3: outcome (c) rejects a false H0, which is correct, while outcome (d) rejects a true H0, a Type I error. The errors are (b), (d) and (e). The answer is 3."
          - problem: "A casino tests its dice with H0: \"the die is fair\". Five outcomes: (a) the die is declared fair and it is fair; (b) the die is declared fair but it is loaded; (c) the die is declared loaded and it is loaded; (d) the die is declared loaded though it is fair; (e) the die is declared crooked although it is fair. A Type I error rejects an H0 that is in fact true. How many of the five outcomes are Type I errors?"
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Rule: a Type I error rejects an H0 that is in fact true. Step 1: outcomes (a) and (b) keep H0, so they cannot be Type I errors. Step 2: outcome (c) rejects H0 while H0 is false, which is a correct call. Step 3: outcomes (d) and (e) each reject H0 while the die is fair, so both are Type I errors. The answer is 2."
        constraints: "H0 is always stated explicitly in the scenario; answers name the type and phrase it as reject-true or fail-to-reject-false"
      - id: kp2
        name: "The significance level is P(Type I)"
        key_prerequisites: [hypothesis-tests-logic, conditional-probability]
        exemplars:
          - problem: "Under $H_0$, a test statistic $X$ takes values 1, 2, 3 with probabilities 0.90, 0.05, 0.05. The test rejects $H_0$ when $X$ is 2 or 3. If $H_0$ is true, find the probability of a Type I error."
            answer: "0.10"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: A Type I error is rejecting $H_0$ when $H_0$ is true. Step 2: The rejection region is $X = 2$ or $X = 3$. Step 3: Under $H_0$, $P(X=2) + P(X=3) = 0.05 + 0.05 = 0.10$. The probability of a Type I error is 0.10."
          - problem: "A test currently uses $\\alpha = 0.10$. To reduce the chance of a Type I error, the researcher halves $\\alpha$. State the effect on the chance of a Type II error, and give the new probability of a Type I error."
            answer: "effect = larger; alpha = 0.05"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["larger"], ["smaller"]]}, "name": "effect"}, {"contract": {"kind": "exact"}, "name": "alpha"}]}
            solution_sketch: "Step 1: The significance level is the Type I error probability, initially 0.10. Step 2: Halving alpha makes the new Type I error probability 0.05. Step 3: A smaller alpha means the test rejects less often, so it misses true effects more often; the Type II error probability becomes larger. Thus effect = larger; alpha = 0.05."
          - problem: "Under $H_0$, a test statistic $Y$ takes values 0, 1, 2 with probabilities 0.99, 0.005, 0.005. The test rejects $H_0$ when $Y$ is 1 or 2. If $H_0$ is true, find the probability of a Type I error."
            answer: "0.01"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: A Type I error is rejecting $H_0$ when $H_0$ is true. Step 2: The rejection region is $Y = 1$ or $Y = 2$. Step 3: Under $H_0$, $P(Y=1) + P(Y=2) = 0.005 + 0.005 = 0.01$. The probability of a Type I error is 0.01."
          - problem: "A test has a 5% chance of rejecting $H_0$ when $H_0$ is true. Give the significance level as a decimal."
            answer: "0.05"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: The significance level equals the probability of a Type I error, which is rejecting $H_0$ when $H_0$ is true. Step 2: That probability is given as 5%. Step 3: Convert 5% to a decimal, which is 0.05. So the significance level is 0.05."
          - problem: "Under $H_0$, a test statistic $Z$ takes values 0, 1, 2, 3 with probabilities 0.85, 0.10, 0.03, 0.02. The test rejects $H_0$ when $Z$ is 2 or 3. If $H_0$ is true and the test rejects, state the error type and give its probability."
            answer: "error = I; probability = 0.05"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["I"], ["II"]]}, "name": "error"}, {"contract": {"kind": "exact"}, "name": "probability"}]}
            solution_sketch: "Step 1: Rejecting a true $H_0$ is a Type I error. Step 2: The rejection region is $Z = 2$ or $Z = 3$. Step 3: Under $H_0$, $P(Z=2) + P(Z=3) = 0.03 + 0.02 = 0.05$. Thus error = I; probability = 0.05."
          - problem: "A test uses $\\alpha = 0.05$. To make Type II errors less likely, the researcher increases $\\alpha$ by $0.05$. State the effect on the Type I error probability, and give the new probability."
            answer: "effect = larger; alpha = 0.10"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["larger"], ["smaller"]]}, "name": "effect"}, {"contract": {"kind": "exact"}, "name": "alpha"}]}
            solution_sketch: "Step 1: Raising alpha makes the test reject more often, which increases the Type I error probability. Step 2: The new significance level is $0.05 + 0.05 = 0.10$. Step 3: Thus the effect on the Type I error probability is larger, and the new probability is 0.10. So effect = larger; alpha = 0.10."
        constraints: "alpha in {0.01, 0.05, 0.10}; trade-off items must state the effect on the other error type"
      - id: kp3
        name: "Power and the cost of each error"
        key_prerequisites: [hypothesis-tests-logic]
        exemplars:
          - problem: "In a test of a new battery, the probability of a Type II error is 0.16. The power of the test is computed only as 1 minus beta. Give the power as a decimal."
            answer: "0.84"
            answer_contract: {"decimals": 2, "kind": "approx"}
            solution_sketch: "Step 1: Identify beta, the Type II error probability, as 0.16. Step 2: Use the power rule power = 1 - beta. Step 3: Compute 1 - 0.16 = 0.84. The power is 0.84."
          - problem: "A city tests H0: the water supply is safe, with alpha = 0.05. The test has beta = 0.20. A Type I error closes a safe supply; a Type II error lets unsafe water pass. State the more costly error as I or II, and give the power as a decimal."
            answer: "error = II; power = 0.80"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["I"], ["II"]]}, "name": "error"}, {"contract": {"decimals": 2, "kind": "approx"}, "name": "power"}]}
            solution_sketch: "Step 1: Under H0 the water is safe; a Type II error means failing to detect unsafe water, so it is more costly here. Step 2: The power rule is power = 1 - beta, with beta = 0.20. Step 3: Compute 1 - 0.20 = 0.80. Step 4: Choosing I would name the Type I error, closing a safe supply, which is less costly in this setting. The answer is error = II; power = 0.80."
          - problem: "A researcher wants greater power but will not change the significance level. Select the change that best increases power."
            answer: "use a larger sample"
            answer_contract: {"kind": "label", "options": [["use a larger sample"], ["use a smaller sample"], ["raise the significance level"], ["reduce the effect size"]]}
            solution_sketch: "Step 1: Power rises when the standard error falls or when alpha rises; alpha is fixed here. Step 2: A larger sample reduces the standard error and increases power. Step 3: The option use a smaller sample is wrong because a smaller sample lowers power. Step 4: The option raise the significance level is wrong because the researcher will not change alpha. Step 5: The option reduce the effect size is wrong because a smaller real effect is harder to detect. The correct choice is use a larger sample."
          - problem: "The power of a test, computed only as 1 minus beta, is 0.93. Give beta as a decimal."
            answer: "0.07"
            answer_contract: {"decimals": 2, "kind": "approx"}
            solution_sketch: "Step 1: Write the power rule power = 1 - beta. Step 2: Substitute 0.93 = 1 - beta. Step 3: Solve beta = 1 - 0.93 = 0.07. Beta is 0.07."
          - problem: "A court tests H0: the defendant is innocent, with alpha = 0.05. The test has power 0.90. A Type I error convicts an innocent person; a Type II error frees a guilty person. State the more costly error as I or II, and give beta as a decimal."
            answer: "error = I; beta = 0.10"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["I"], ["II"]]}, "name": "error"}, {"contract": {"decimals": 2, "kind": "approx"}, "name": "beta"}]}
            solution_sketch: "Step 1: Under H0 the defendant is innocent; a Type I error convicts an innocent person, which is the more serious cost here. Step 2: The power rule is power = 1 - beta, with power = 0.90. Step 3: Solve 0.90 = 1 - beta, so beta = 0.10. Step 4: Choosing II would name the Type II error, freeing a guilty person, which is less costly in this context. The answer is error = I; beta = 0.10."
          - problem: "A test has probability of Type II error 0.25. Its power is computed only as 1 minus beta. Give the power as a fraction."
            answer: "3/4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: Identify beta, the Type II error probability, as 0.25. Step 2: Use the power rule power = 1 - beta. Step 3: Compute 1 - 0.25 = 0.75, which is 3/4. The power is 3/4."
        constraints: "power computed only via 1 - beta; context items weigh the real-world cost of each error"
    diagnostic_exemplar:
      problem: 'A factory tests each batch with $H_0$: "the batch meets the specification", at $\alpha = 0.01$, and the test has Type II error probability $\beta = 0.15$. Describe a Type I and a Type II error in context, give the probability of a Type I error when $H_0$ is true, and give the power of the test.'
      answer: 'Type I: rejecting a good batch — probability 0.01 (the significance level); Type II: passing a batch that violates the specification; power = 1 - β = 0.85'
      solution_sketch: '$\alpha$ is exactly $P(\text{reject } H_0 \mid H_0 \text{ true})$, and power $= 1 - \beta$.'
    anki_seeds:
      - front: 'Type I vs Type II error?'
        back: 'Type I: reject a true $H_0$. Type II: fail to reject a false $H_0$.'
        type: basic
      - front: '$\alpha$ is the probability of which error?'
        back: 'Type I (computed assuming $H_0$ is true).'
        type: basic
      - front: 'Power of a test?'
        back: '$1 - \beta$: the probability of rejecting $H_0$ when it is false.'
        type: basic

  - id: one-sample-z-test
    name: "One-Sample z-Test for a Mean"
    core: true                 # the template the t-test (and slope inference) instantiates
    difficulty: 0.6
    drill: false
    answer_kind: multi-step
    expected_time_secs: 240
    prerequisites:
      - id: hypothesis-tests-logic
        weight: 0.8
        key: true
      - id: standard-error
        weight: 0.6
        key: true
      - id: type-i-ii-errors
        weight: 0.4
        key: false
      - id: normal-distribution
        weight: 0.4
        key: false
    knowledge_points:
      - id: kp1
        name: "Computing the z statistic"
        key_prerequisites: [standard-error, hypothesis-tests-logic]
        exemplars:
          - problem: "A test has null mean 40 and known population standard deviation 15. A sample of n = 25 has mean 46. Compute the z statistic for the test."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Use the one-sample z formula: z = (sample mean - null mean) / standard error. The standard error is 15 / sqrt(25) = 3. Substitute: z = (46 - 40) / 3 = 2. The z statistic is 2."
          - problem: "A quality check tests null mean 120 with known population standard deviation 18. A sample of n = 36 has mean 111. Compute the test statistic z."
            answer: "-3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Use the one-sample z formula: z = (sample mean - null mean) / standard error. The standard error is 18 / sqrt(36) = 3. Substitute: z = (111 - 120) / 3 = -3. The test statistic is -3."
          - problem: "A bottling plant tests null mean 250 mL with known population standard deviation 20 mL. A sample of n = 100 bottles has mean 252 mL. Compute the z statistic."
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Use the one-sample z formula: z = (sample mean - null mean) / standard error. The standard error is 20 / sqrt(100) = 2. Substitute: z = (252 - 250) / 2 = 1. The z statistic is 1."
          - problem: "A cereal box check tests null mean 64 g and known population standard deviation 21 g. A sample of n = 49 boxes has mean 58 g. Compute the z statistic."
            answer: "-2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Use the one-sample z formula: z = (sample mean - null mean) / standard error. The standard error is 21 / sqrt(49) = 3. Substitute: z = (58 - 64) / 3 = -2. The z statistic is -2."
          - problem: "A lab tests null mean 300 units with known population standard deviation 25 units. A sample of n = 25 has mean 315 units. Compute the z statistic."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Use the one-sample z formula: z = (sample mean - null mean) / standard error. The standard error is 25 / sqrt(25) = 5. Substitute: z = (315 - 300) / 5 = 3. The z statistic is 3."
          - problem: "A reaction-time study tests null mean 45 ms with known population standard deviation 16 ms. A sample of n = 64 has mean 43 ms. Compute the z statistic."
            answer: "-1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Use the one-sample z formula: z = (sample mean - null mean) / standard error. The standard error is 16 / sqrt(64) = 2. Substitute: z = (43 - 45) / 2 = -1. The z statistic is -1."
        constraints: "sigma known and stated; n a perfect square; z comes out to halves or whole numbers"
      - id: kp2
        name: "Decision by critical value"
        key_prerequisites: [hypothesis-tests-logic, normal-distribution]
        exemplars:
          - problem: "A two-sided z-test of $H_0: \\mu = 45$ against $H_1: \\mu \\ne 45$ runs at $\\alpha = 0.05$, and it uses the critical value $z^* = 2$. A sample of $n = 36$ batteries has mean lifetime $\\bar{x} = 46.5$ hours; the population standard deviation is $\\sigma = 3$ hours. Find the test statistic $z$ and give the decision."
            answer: "z = 3; verdict = reject"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "z"}, {"contract": {"kind": "label", "options": [["reject"], ["retain"]]}, "name": "verdict"}]}
            solution_sketch: "Standard error rule: SE = sigma/sqrt(n) = 3/6 = 0.5. Test statistic rule: z = (46.5 - 45)/0.5 = 3. Decision rule: a two-sided test with critical value 2 rejects H0 when the absolute value of z exceeds 2, and 3 > 2, so the data are significant. The wrong option retain would ignore that the statistic lies beyond the cutoff. The answer is z = 3; verdict = reject."
          - problem: "A two-sided z-test of $H_0: \\mu = 405$ grams against $H_1: \\mu \\ne 405$ runs at $\\alpha = 0.05$, and it uses the critical value $z^* = 2$. A random sample of $n = 25$ cereal boxes has mean mass $\\bar{x} = 404$ grams; the population standard deviation is $\\sigma = 5$ grams. Find the test statistic $z$ and give the decision."
            answer: "z = -1; verdict = retain"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "z"}, {"contract": {"kind": "label", "options": [["reject"], ["retain"]]}, "name": "verdict"}]}
            solution_sketch: "Standard error rule: SE = 5/sqrt(25) = 1. Test statistic rule: z = (404 - 405)/1 = -1. Decision rule: a two-sided test with critical value 2 keeps H0 when the absolute value of z stays below 2, and |-1| = 1 < 2, so the result is ordinary sampling variability. The wrong option reject would treat a one-standard-error gap as beyond the cutoff. The answer is z = -1; verdict = retain."
          - problem: "An upper-tailed z-test of $H_0: \\mu = 12$ against $H_1: \\mu > 12$ runs at $\\alpha = 0.10$, and the critical value $z^* = 1.28$ is supplied. Find the values of the test statistic $z$ for which the data are significant at this level. Give the answer as an inequality in $z$."
            answer: "z > 1.28"
            answer_contract: {"kind": "inequality_union"}
            solution_sketch: "Decision rule for an upper-tailed z-test: the data are significant when the test statistic falls beyond the supplied critical value, so z must be larger than 1.28. Boundary check: z = 1.28 sits exactly on the cutoff, which is not beyond it, so the strict inequality holds. The answer is z > 1.28."
          - problem: "A two-sided z-test of $H_0: \\mu = 100$ runs at $\\alpha = 0.05$, and it uses the critical value $z^* = 2$. The sample size is $n = 36$ and the population standard deviation is $\\sigma = 12$. Find the values of the sample mean $x$ for which the data are significant at this level. Give the answer as an inequality in $x$."
            answer: "x < 96 or x > 104"
            answer_contract: {"kind": "inequality_union"}
            solution_sketch: "Standard error rule: SE = 12/sqrt(36) = 2. Decision rule: a two-sided test with critical value 2 is significant when the absolute value of z exceeds 2, and here z = (x - 100)/2. Solve both sides of the rule: (x - 100)/2 < -2 gives x < 96, and (x - 100)/2 > 2 gives x > 104. The answer is x < 96 or x > 104."
          - problem: "An upper-tailed z-test of $H_0: \\mu = 40$ against $H_1: \\mu > 40$ runs at $\\alpha = 0.01$, and the critical value $z^* = 2.33$ is supplied. The sample size is $n = 64$ and the population standard deviation is $\\sigma = 8$. Find the sample mean for which the test statistic exactly equals the critical value. Give the answer to two decimals."
            answer: "42.33"
            answer_contract: {"decimals": 2, "kind": "approx"}
            solution_sketch: "Standard error rule: SE = 8/sqrt(64) = 1. Decision rule: the significance boundary sits where the test statistic equals the supplied critical value, so (x - 40)/1 = 2.33. Solve the equation: x = 40 + 2.33 = 42.33, the cutoff mean separating significant from non-significant data. The answer is 42.33."
          - problem: "A lower-tailed z-test of $H_0: \\mu = -5$ against $H_1: \\mu < -5$ runs at $\\alpha = 0.05$, and the critical value $z^* = -1.645$ is supplied. The sample size is $n = 100$ and the population standard deviation is $\\sigma = 10$. Find the sample mean for which the test statistic exactly equals the critical value. Give the answer to three decimals."
            answer: "-6.645"
            answer_contract: {"decimals": 3, "kind": "approx"}
            solution_sketch: "Standard error rule: SE = 10/sqrt(100) = 1. Decision rule: the significance boundary sits where the test statistic equals the supplied critical value, so (x + 5)/1 = -1.645. Solve the equation: x = -5 - 1.645 = -6.645, the mean below which data become significant in the direction of H1. The answer is -6.645."
        constraints: "two-sided tests use z* = 2 (empirical-rule value); any one-sided or exact critical value is supplied in the problem"
      - id: kp3
        name: "The full test with conclusion in context"
        key_prerequisites: [hypothesis-tests-logic, standard-error, type-i-ii-errors]
        exemplars:
          - problem: "Boxes of cereal are labelled $500$ g and the filling line has $\\sigma = 8$ g. A sample of $n = 64$ boxes has mean fill $\\bar{x} = 498$ g. Test $H_0: \\mu = 500$ against $H_1: \\mu < 500$ at $\\alpha = 0.05$ with the given critical value $z^* = -1.645$. Give the value of $z$ and the decision."
            answer: "verdict = reject; z = -2"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["reject"], ["retain"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "z"}]}
            solution_sketch: "Step 1 (standard error rule): $\\sigma/\\sqrt{n} = 8/\\sqrt{64} = 1$ g. Step 2 (z statistic rule): $z = (498 - 500)/1 = -2$. Step 3 (decision rule with the given $z^* = -1.645$): $-2 < -1.645$, so reject $H_0$. Step 4 (empirical-rule p and context): at $|z| = 2$ the two-sided empirical p is about 0.05, so the one-sided p is about 0.025, well under $\\alpha = 0.05$; the boxes are being underfilled. A learner who answers retain has compared the statistic with the wrong tail or ignored the given critical value. The decision is verdict = reject; z = -2."
          - problem: "Concrete blocks are moulded to a target mass of $20$ kg and the process has $\\sigma = 0.5$ kg. A sample of $n = 25$ blocks has mean mass $\\bar{x} = 20.3$ kg. Carry out a two-sided test of $H_0: \\mu = 20$ at $\\alpha = 0.05$ using $z^* = 2$. Find $z$ and state the decision."
            answer: "verdict = reject; z = 3"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["reject"], ["retain"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "z"}]}
            solution_sketch: "Step 1 (standard error rule): $0.5/\\sqrt{25} = 0.1$ kg. Step 2 (z rule): $z = (20.3 - 20)/0.1 = 3$. Step 3 (decision rule with $z^* = 2$): $|3| > 2$, so reject $H_0$. Step 4 (empirical-rule p and context): at $|z| = 3$ the two-sided empirical p is about 0.003, far below $\\alpha = 0.05$, so the mean block mass is not the target 20 kg. Answering retain is the error of comparing the statistic with a critical value of 3 instead of the given 2. The decision is verdict = reject; z = 3."
          - problem: "Batteries are advertised to run for $40$ hours and the production line has $\\sigma = 6$ hours. A sample of $n = 36$ batteries runs for a mean of $\\bar{x} = 41$ hours. Test $H_0: \\mu = 40$ against $H_1: \\mu > 40$ at $\\alpha = 0.05$ with $z^* = 1.645$. Give $z$ and the decision."
            answer: "verdict = retain; z = 1"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["reject"], ["retain"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "z"}]}
            solution_sketch: "Step 1 (standard error rule): $6/\\sqrt{36} = 1$ hour. Step 2 (z statistic rule): $z = (41 - 40)/1 = 1$. Step 3 (decision rule with $z^* = 1.645$): $1 < 1.645$, so retain $H_0$. Step 4 (empirical-rule p and context): at $|z| = 1$ the two-sided empirical p is about 0.32, so the one-sided p is about 0.16, above $\\alpha = 0.05$; the sample does not show that the batteries run longer than advertised. Answering reject is the error of using the two-sided cut of 2 on a one-sided test. The decision is verdict = retain; z = 1."
          - problem: "A bottling plant claims each bottle holds $750$ ml and the filler has $\\sigma = 5$ ml. A sample of $n = 100$ bottles is tested, and the one-sample z statistic for $H_0: \\mu = 750$ against $H_1: \\mu < 750$ is $z = -2$. Using the critical value $z^* = -1.645$ at $\\alpha = 0.05$, find the sample mean and state the decision."
            answer: "verdict = reject; xbar = 749"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["reject"], ["retain"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "xbar"}]}
            solution_sketch: "Step 1 (standard error rule): $5/\\sqrt{100} = 0.5$ ml. Step 2 (invert the z rule): $z = (\\bar{x} - 750)/0.5 = -2$, so $\\bar{x} = 750 - 1 = 749$ ml. Step 3 (decision rule with $z^* = -1.645$): $-2 < -1.645$, so reject $H_0$. Step 4 (empirical-rule p and context): at $|z| = 2$ the two-sided empirical p is about 0.05, so the one-sided p is about 0.025; the bottles are underfilled. Answering retain is the error of reading the sign of z as support for the claim. The result is verdict = reject; xbar = 749."
          - problem: "A two-sided z-test of $H_0: \\mu = 250$ g at $\\alpha = 0.05$ uses $z^* = 2$, with $\\sigma = 6$ g and $n = 36$. Find the sample mean that lies exactly on the upper boundary of the decision, where $z = 2$."
            answer: "252"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (standard error rule): $\\sigma/\\sqrt{n} = 6/\\sqrt{36} = 1$ g. Step 2 (z rule at the boundary): $2 = (\\bar{x} - 250)/1$, so $\\bar{x} = 252$ g. Step 3 (decision rule check): at $|z| = 2$ the two-sided empirical p is about 0.05, exactly the $\\alpha = 0.05$ cut, so a mean of 252 g sits on the edge of the rejection region. A mean of 248 g would be the lower boundary, the error of using the wrong sign. The upper boundary sample mean is 252."
          - problem: "A sample of $n = 25$ rods has mean length $\\bar{x} = 74.3$ cm, and the two-sided test of $H_0: \\mu = 75$ at $\\alpha = 0.05$ with $z^* = 2$ gives $z = -1$. Find the population standard deviation $\\sigma$ as a fraction."
            answer: "7/2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (z rule): $z = (74.3 - 75)/(\\sigma/\\sqrt{25}) = -0.7/(\\sigma/5) = -3.5/\\sigma$. Step 2 (solve for sigma): $-3.5/\\sigma = -1$, so $\\sigma = 3.5$, that is 7/2 cm. Step 3 (decision check): $|z| = 1 < 2$, so the test retains $H_0$, and the two-sided empirical p at $|z| = 1$ is about 0.32, above $\\alpha = 0.05$. The population standard deviation is 7/2."
        constraints: "metric contexts; conclusions restate the decision in the scenario's units; empirical-rule p-values (0.32, 0.05, 0.003) quoted when |z| lands on 1, 2, or 3"
    diagnostic_exemplar:
      problem: 'Cement sacks are labelled $25$ kg and the process has $\sigma = 0.4$ kg. A sample of $n = 16$ sacks has $\bar{x} = 24.7$ kg. Test $H_0: \mu = 25$ against $H_1: \mu \ne 25$ at $\alpha = 0.05$ ($z^* = 2$). Give $z$, the decision, and a conclusion in context.'
      answer: '$\operatorname{SE} = 0.4/4 = 0.1$; $z = -3$; $|-3| > 2$, so reject $H_0$ — strong evidence the sacks are underfilled ($p \approx 0.003$).'
      solution_sketch: 'The $\sigma$-known case: $\operatorname{SE} = \sigma/\sqrt{n}$, $z = (\bar x - \mu_0)/\operatorname{SE}$, and reject when $|z|$ exceeds the supplied $z^* = 2$. Finish in context — say what it means for the sacks, not merely that $H_0$ is rejected.'
    anki_seeds:
      - front: 'One-sample z statistic?'
        back: '$z = \dfrac{\bar{x} - \mu_0}{\sigma/\sqrt{n}}$.'
        type: basic
      - front: 'Two-sided rejection rule at $\alpha = 0.05$ (empirical rule)?'
        back: 'Reject when $|z| > 2$ (exact value: $1.96$).'
        type: basic

  - id: one-proportion-z-test
    name: "One-Proportion z-Test"
    core: false                # terminal inference destination, like chi-square-goodness-of-fit; nothing downstream builds on it
    difficulty: 0.65
    drill: false
    answer_kind: multi-step
    expected_time_secs: 240
    prerequisites:
      - id: sample-proportions
        weight: 0.7
        key: true
      - id: one-sample-z-test
        weight: 0.7
        key: true
      - id: hypothesis-tests-logic
        weight: 0.4
        key: false
      - id: confidence-intervals
        weight: 0.4
        key: false
    knowledge_points:
      - id: kp1
        name: "Hypotheses about p and the normal-approximation conditions"
        key_prerequisites: [hypothesis-tests-logic, sample-proportions]
        exemplars:
          - problem: "A die is suspected of being biased in either direction. It will be rolled n = 120 times, and p is the probability that a roll is a six. The normal approximation for the sample proportion needs np0 and n(1 - p0) both at least 10. Find p0, np0, n(1 - p0), and the tail code, using code 1 for left-sided, 2 for right-sided, and 3 for two-sided."
            answer: "p0 = 1/6; np0 = 20; nq0 = 100; tail = 3"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "p0"}, {"contract": {"kind": "exact"}, "name": "np0"}, {"contract": {"kind": "exact"}, "name": "nq0"}, {"contract": {"kind": "exact"}, "name": "tail"}]}
            solution_sketch: "Step 1 (hypotheses): the hypotheses are about p, so H0: p = 1/6. The scenario says biased in either direction, so H1: p not equal 1/6 and the test is two-sided, tail code 3. Step 2 (conditions): compute np0 = 120 * (1/6) = 20 and n(1 - p0) = 120 * (5/6) = 100. Step 3 (comparison): both 20 and 100 are at least 10, so the normal approximation is justified. The answer is p0 = 1/6; np0 = 20; nq0 = 100; tail = 3."
          - problem: "A supplier claims that at most 10% of parts are defective, but an inspector suspects the defect rate is higher and will inspect n = 250 parts. Let p be the true defect proportion. Check the normal-approximation conditions by computing np0 and n(1 - p0). Find p0, np0, n(1 - p0), and the tail code, where 1 is left-sided, 2 is right-sided, and 3 is two-sided."
            answer: "p0 = 0.1; np0 = 25; nq0 = 225; tail = 2"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "p0"}, {"contract": {"kind": "exact"}, "name": "np0"}, {"contract": {"kind": "exact"}, "name": "nq0"}, {"contract": {"kind": "exact"}, "name": "tail"}]}
            solution_sketch: "Step 1 (hypotheses): H0: p = 0.1. The inspector suspects the rate is higher, so H1: p > 0.1 and the test is right-sided, tail code 2. Step 2 (conditions): np0 = 250 * 0.1 = 25 and n(1 - p0) = 250 * 0.9 = 225. Step 3 (comparison): both 25 and 225 are at least 10, so the normal approximation is justified. The answer is p0 = 0.1; np0 = 25; nq0 = 225; tail = 2."
          - problem: "A candidate claims that 40% of voters support her, but an opponent suspects the support is lower and plans a poll of n = 150 voters. Let p be the true support proportion. Check the normal-approximation conditions by computing np0 and n(1 - p0). Find p0, np0, n(1 - p0), and the tail code, where 1 is left-sided, 2 is right-sided, and 3 is two-sided."
            answer: "p0 = 0.4; np0 = 60; nq0 = 90; tail = 1"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "p0"}, {"contract": {"kind": "exact"}, "name": "np0"}, {"contract": {"kind": "exact"}, "name": "nq0"}, {"contract": {"kind": "exact"}, "name": "tail"}]}
            solution_sketch: "Step 1 (hypotheses): H0: p = 0.4. The opponent suspects support is lower, so H1: p < 0.4 and the test is left-sided, tail code 1. Step 2 (conditions): np0 = 150 * 0.4 = 60 and n(1 - p0) = 150 * 0.6 = 90. Step 3 (comparison): both 60 and 90 are at least 10, so the normal approximation is justified. The answer is p0 = 0.4; np0 = 60; nq0 = 90; tail = 1."
          - problem: "A spinner is suspected of not landing on red with probability 1/4, in either direction. It will be spun n = 80 times, and p is the probability of red. Check the normal-approximation conditions by computing np0 and n(1 - p0). Find p0, np0, n(1 - p0), and the tail code, where 1 is left-sided, 2 is right-sided, and 3 is two-sided."
            answer: "p0 = 1/4; np0 = 20; nq0 = 60; tail = 3"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "p0"}, {"contract": {"kind": "exact"}, "name": "np0"}, {"contract": {"kind": "exact"}, "name": "nq0"}, {"contract": {"kind": "exact"}, "name": "tail"}]}
            solution_sketch: "Step 1 (hypotheses): H0: p = 1/4. The spinner is suspected of being off in either direction, so H1: p not equal 1/4 and the test is two-sided, tail code 3. Step 2 (conditions): np0 = 80 * (1/4) = 20 and n(1 - p0) = 80 * (3/4) = 60. Step 3 (comparison): both 20 and 60 are at least 10, so the normal approximation is justified. The answer is p0 = 1/4; np0 = 20; nq0 = 60; tail = 3."
          - problem: "A package insert states that a mild side effect occurs with probability 0.02. A researcher suspects the true rate is higher and will observe n = 400 patients, testing H0: p = 0.02 against H1: p > 0.02. The normal approximation for the sample proportion requires np0 >= 10 and n(1 - p0) >= 10. Compute np0 and n(1 - p0), and decide whether both conditions hold. Give np0, n(1 - p0), and the code met, where met = 1 if both conditions hold and met = 0 if at least one condition fails."
            answer: "np0 = 8; nq0 = 392; met = 0"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "np0"}, {"contract": {"kind": "exact"}, "name": "nq0"}, {"contract": {"kind": "exact"}, "name": "met"}]}
            solution_sketch: "Step 1 (hypotheses): the null value is p0 = 0.02, and the researcher suspects a higher rate, so the test is right-sided. Step 2 (conditions): compute np0 = 400 * 0.02 = 8 and n(1 - p0) = 400 * 0.98 = 392. Step 3 (comparison): np0 = 8 is below the bar of 10, so one condition fails even though 392 is at least 10; at least one condition fails, so met = 0 and the normal approximation is not justified. The answer is np0 = 8; nq0 = 392; met = 0."
          - problem: "A restaurant claims that 75% of customers prefer a new menu, but a manager suspects the true proportion is lower and samples n = 40 customers. Let p be the true preference proportion. Check the normal-approximation conditions by computing np0 and n(1 - p0). Find p0, np0, n(1 - p0), and the tail code, where 1 is left-sided, 2 is right-sided, and 3 is two-sided."
            answer: "p0 = 0.75; np0 = 30; nq0 = 10; tail = 1"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "p0"}, {"contract": {"kind": "exact"}, "name": "np0"}, {"contract": {"kind": "exact"}, "name": "nq0"}, {"contract": {"kind": "exact"}, "name": "tail"}]}
            solution_sketch: "Step 1 (hypotheses): H0: p = 0.75. The manager suspects the true proportion is lower, so H1: p < 0.75 and the test is left-sided, tail code 1. Step 2 (conditions): np0 = 40 * 0.75 = 30 and n(1 - p0) = 40 * 0.25 = 10. Step 3 (comparison): both 30 and 10 are at least 10, so the normal approximation is justified. The answer is p0 = 0.75; np0 = 30; nq0 = 10; tail = 1."
        constraints: "hypotheses are about p, never about p-hat; both np0 and n(1 - p0) computed explicitly against the >= 10 bar; one- vs two-sided justified from the scenario"
      - id: kp2
        name: "The z statistic for a proportion"
        key_prerequisites: [sample-proportions, one-sample-z-test]
        exemplars:
          - problem: "A factory claims that one fifth of its parts are defective. In a sample of 25 parts, 12 are defective. Test H0: p = 1/5. Compute the test statistic z as a fraction."
            answer: "7/2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Under H0 the standard error uses p0 = 1/5, so SE = sqrt((1/5)(4/5)/25) = 2/25. The sample proportion is p-hat = 12/25. The z statistic formula gives z = (12/25 - 1/5)/(2/25) = (7/25)/(2/25) = 7/2. So the test statistic is z = 7/2."
          - problem: "A coin is suspected of bias. In 16 flips, 13 are heads. Test H0: p = 1/2. Compute the test statistic z as a fraction."
            answer: "5/2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Under H0 the standard error is SE = sqrt((1/2)(1/2)/16) = 1/8. The sample proportion is p-hat = 13/16. The z statistic formula gives z = (13/16 - 1/2)/(1/8) = (5/16)/(1/8) = 5/2. So the test statistic is z = 5/2."
          - problem: "For H0: p = 1/3 with n = 18, the test statistic is z = 2. Find the number of successes in the sample."
            answer: "10"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Under H0 the standard error is SE = sqrt((1/3)(2/3)/18) = 1/9. The z statistic formula gives p-hat = p0 + z*SE = 1/3 + 2*(1/9) = 5/9. Then the number of successes is n*p-hat = 18*(5/9) = 10. So the number of successes is 10."
          - problem: "A survey tests H0: p = 2/5 with n = 24. The sample proportion is 0.25. Compute the test statistic z as a fraction."
            answer: "-3/2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Under H0 the standard error is SE = sqrt((2/5)(3/5)/24) = 1/10. The sample proportion is p-hat = 0.25 = 1/4. The z statistic formula gives z = (1/4 - 2/5)/(1/10) = (-3/20)/(1/10) = -3/2. So the test statistic is z = -3/2."
          - problem: "A die is suspected of bias toward six. In 20 rolls, a six appears 10 times. Test H0: p = 1/6. Compute the test statistic z."
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Under H0 the standard error is SE = sqrt((1/6)(5/6)/20) = 1/12. The sample proportion is p-hat = 10/20 = 1/2. The z statistic formula gives z = (1/2 - 1/6)/(1/12) = (1/3)/(1/12) = 4. So the test statistic is z = 4."
          - problem: "A seed company claims that three quarters of its seeds germinate. In a sample of 12 seeds, 6 germinate. Test H0: p = 3/4. Compute the test statistic z."
            answer: "-2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Under H0 the standard error is SE = sqrt((3/4)(1/4)/12) = 1/8. The sample proportion is p-hat = 6/12 = 1/2. The z statistic formula gives z = (1/2 - 3/4)/(1/8) = (-1/4)/(1/8) = -2. So the test statistic is z = -2."
        constraints: "p0 a simple fraction with p0(1-p0)/n a perfect square of a fraction, so the SE is exact; the SE under H0 uses p0, never p-hat; z comes out to tenths, halves, or whole numbers"
      - id: kp3
        name: "The full test, and the z-interval for p"
        key_prerequisites: [one-sample-z-test, confidence-intervals]
        exemplars:
          - problem: "A coin is checked for bias. In n = 400 flips it lands heads 230 times. Test H0: p = 1/2 against H1: p != 1/2 at alpha = 0.05 using z* = 2. State the conclusion about the coin and give the z statistic."
            answer: "conclusion = unfair; z = 3"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["unfair"], ["insufficient"]]}, "name": "conclusion"}, {"contract": {"kind": "exact"}, "name": "z"}]}
            solution_sketch: "Step 1: the sample proportion is p-hat = 230/400 = 0.575. Step 2: under H0 the standard error is sqrt(0.5*0.5/400) = 0.025. Step 3: z = (0.575 - 0.5)/0.025 = 3. Since 3 > 2, reject H0 and conclude the coin is unfair. The option insufficient is the error of failing to reject when |z| exceeds the critical value. Final result: conclusion = unfair; z = 3."
          - problem: "In a survey of n = 100 customers, 80 say they are satisfied. Use z* = 2. Give the 95% confidence interval for the true satisfaction proportion p, as (low, high)."
            answer: "(0.72, 0.88)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "Step 1: the sample proportion is p-hat = 80/100 = 0.8. Step 2: the interval's standard error uses p-hat: sqrt(0.8*0.2/100) = 0.04. Step 3: the margin is z* times the standard error, 2*0.04 = 0.08. Step 4: the interval is 0.8 plus or minus 0.08, which is (0.72, 0.88). The final answer is (0.72, 0.88)."
          - problem: "A seed company claims that 80% of its seeds germinate. In a test of n = 200 seeds, 150 germinate. Test H0: p = 0.8 against H1: p < 0.8 at alpha = 0.05, with z* = -1.645 supplied. State the decision and give z to 2 decimals."
            answer: "decision = reject; z = -1.77"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["reject"], ["retain"]]}, "name": "decision"}, {"contract": {"decimals": 2, "kind": "approx"}, "name": "z"}]}
            solution_sketch: "Step 1: the sample proportion is p-hat = 150/200 = 0.75. Step 2: under H0 the standard error is sqrt(0.8*0.2/200) = 0.028284. Step 3: z = (0.75 - 0.8)/0.028284 = -1.77 to 2 decimals. Since -1.77 < -1.645, reject H0. The option retain is the error of not rejecting when z lies in the critical region. Final result: decision = reject; z = -1.77."
          - problem: "A website counts clicks on an ad. Of n = 400 visitors, 80 click it. Use z* = 2. Give the 95% confidence interval for the true click proportion p as (low, high)."
            answer: "(0.16, 0.24)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "Step 1: the sample proportion is p-hat = 80/400 = 0.2. Step 2: the interval's standard error uses p-hat: sqrt(0.2 times 0.8 divided by 400) equals 0.02. Step 3: the margin is z* times the standard error, 2 times 0.02 = 0.04. Step 4: the interval is 0.2 plus or minus 0.04, which is (0.16, 0.24). The final answer is (0.16, 0.24)."
          - problem: "A poll tests H0: p = 0.4 against H1: p != 0.4. In n = 400 responses, 184 are yes. Use z* = 2. State the conclusion about p and give z to 2 decimals."
            answer: "conclusion = differs; z = 2.45"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["differs"], ["consistent"]]}, "name": "conclusion"}, {"contract": {"decimals": 2, "kind": "approx"}, "name": "z"}]}
            solution_sketch: "Step 1: the sample proportion is p-hat = 184/400 = 0.46. Step 2: under H0 the standard error is sqrt(0.4*0.6/400) = 0.024495. Step 3: z = (0.46 - 0.4)/0.024495 = 2.45 to 2 decimals. Since 2.45 > 2, reject H0 and conclude the proportion differs from 0.4. The option consistent is the error of not rejecting when z exceeds the critical value. Final result: conclusion = differs; z = 2.45."
          - problem: "A spinner is tested for a 1/2 red proportion. In n = 100 spins, 58 land red. Test H0: p = 1/2 against H1: p != 1/2 with z* = 2. State the decision and give the z statistic."
            answer: "decision = retain; z = 1.6"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["reject"], ["retain"]]}, "name": "decision"}, {"contract": {"kind": "exact"}, "name": "z"}]}
            solution_sketch: "Step 1: the sample proportion is p-hat = 58/100 = 0.58. Step 2: under H0 the standard error is sqrt(0.5*0.5/100) = 0.05. Step 3: z = (0.58 - 0.5)/0.05 = 1.6. Since 1.6 is not greater than 2, retain H0. The option reject is the error of rejecting when |z| does not exceed the critical value. Final result: decision = retain; z = 1.6."
        constraints: "two-sided tests use z* = 2 (empirical-rule value); any one-sided or exact critical value is supplied in the problem; the interval's SE uses p-hat (contrast with the test's p0 stated when both appear); conclusions restate the decision in the scenario's terms"
    diagnostic_exemplar:
      problem: 'A coin is suspected of being unfair. In $n = 100$ flips it lands heads $65$ times. Test $H_0: p = \frac{1}{2}$ against $H_1: p \ne \frac{1}{2}$ at $\alpha = 0.05$ ($z^* = 2$). Give the conditions check, $z$, and the decision in context.'
      answer: '$np_0 = n(1-p_0) = 50 \ge 10$; $\operatorname{SE} = \sqrt{\frac{1/4}{100}} = \frac{1}{20} = 0.05$; $z = \dfrac{0.65 - 0.5}{0.05} = 3$; $|3| > 2$, so reject $H_0$ — strong evidence the coin is unfair ($p \approx 0.003$).'
      solution_sketch: 'Check $np_0 \geq 10$ and $n(1-p_0) \geq 10$ first, then build the SE from the null value $p_0$ (not from $\hat p$), form $z = (\hat p - p_0)/\operatorname{SE}$, and compare with the supplied $z^* = 2$.'
    anki_seeds:
      - front: 'One-proportion z statistic?'
        back: '$z = \dfrac{\hat{p} - p_0}{\sqrt{p_0(1-p_0)/n}}$ — the SE under $H_0$ uses $p_0$, not $\hat{p}$.'
        type: basic
      - front: 'Conditions for the one-proportion z-test?'
        back: '$np_0 \ge 10$ and $n(1-p_0) \ge 10$, so $\hat{p}$ is approximately normal.'
        type: basic
      - front: '$95\%$ z-interval for a proportion?'
        back: '$\hat{p} \pm z^* \sqrt{\dfrac{\hat{p}(1-\hat{p})}{n}}$ (the interval''s SE uses $\hat{p}$).'
        type: basic

  - id: t-distribution
    name: "The t-Distribution"
    core: true                 # machinery for the one-sample t-test and slope inference downstream
    difficulty: 0.55
    drill: false
    answer_kind: numeric
    expected_time_secs: 120
    prerequisites:
      - id: sampling-distributions
        weight: 0.6
        key: true
      - id: variance-standard-deviation
        weight: 0.5
        key: false
      - id: normal-distribution
        weight: 0.4
        key: false
    knowledge_points:
      - id: kp1
        name: "Estimated standard error and degrees of freedom"
        key_prerequisites: [variance-standard-deviation, sampling-distributions]
        exemplars:
          - problem: 'When $\sigma$ is unknown, the SE of $\bar{x}$ is estimated by $s/\sqrt{n}$. A sample of $n = 9$ has $s = 12$; compute the estimated standard error.'
            answer: "4"
            solution_sketch: '$s/\sqrt{n} = 12/3 = 4$; using $s$ in place of $\sigma$ is what brings in the t-distribution.'
          - problem: 'A one-sample t procedure uses a sample of $n = 15$. Give the degrees of freedom.'
            answer: "14"
            solution_sketch: '$\text{df} = n - 1 = 14$.'
          - problem: "When the population standard deviation is unknown, the standard error of the sample mean is estimated by s/sqrt(n). A sample of n = 16 has s = 20. Compute the estimated standard error."
            answer: "5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Use the estimated standard error rule SE = s/sqrt(n). Substitute s = 20 and n = 16, so sqrt(n) = 4. The computation is 20/4 = 5, so the estimated standard error is 5."
          - problem: "A one-sample t procedure uses a sample of n = 31 observations. Give the degrees of freedom."
            answer: "30"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Use the degrees of freedom rule df = n - 1 for a one-sample t procedure. Substitute n = 31 into df = n - 1. The computation is 31 - 1 = 30, so the degrees of freedom are 30."
          - problem: "A sample has sample standard deviation s = 18. Its estimated standard error is 3. Find the sample size n."
            answer: "36"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Use the estimated standard error rule SE = s/sqrt(n). Substitute SE = 3 and s = 18, giving 3 = 18/sqrt(n). Then sqrt(n) = 18/3 = 6, so n = 6^2 = 36. The sample size is 36."
          - problem: "A study runs a one-sample t procedure with 23 observations. State the degrees of freedom."
            answer: "22"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Use the degrees of freedom rule df = n - 1 for a one-sample t procedure. Substitute n = 23 into df = n - 1. The computation is 23 - 1 = 22, so the degrees of freedom are 22."
        constraints: "n a perfect square when the SE is computed; df = n - 1 asked directly"
      - id: kp2
        name: "Heavier tails, approaching the normal"
        key_prerequisites: [normal-distribution]
        exemplars:
          - problem: 'Excerpt of two-sided $95\%$ critical values — df $4$: $2.776$; df $30$: $2.042$; normal: $1.960$. As the degrees of freedom grow, the t critical value approaches which number?'
            answer: "1.960"
            solution_sketch: 'With more data, $s$ pins down $\sigma$ and the t-distribution converges to the standard normal, whose $95\%$ value is $1.960$.'
          - problem: 'Using the same excerpt: how much larger is the df-$4$ critical value than the normal value $1.960$?'
            answer: "0.816"
            solution_sketch: '$2.776 - 1.960 = 0.816$ — small samples pay a premium for estimating $\sigma$.'
          - problem: "Excerpt of two-sided 90% critical values: df 5 gives 2.015; the normal value is 1.645. How much larger is the df-5 critical value than the normal value? Give the difference to 3 decimals."
            answer: "0.370"
            answer_contract: {"decimals": 3, "kind": "approx"}
            solution_sketch: "Table step: the df-5 two-sided 90% critical value is 2.015, and the normal 90% value is 1.645. Difference step: subtract the normal value from the df-5 value, 2.015 - 1.645 = 0.370. The t-distribution has heavier tails at small df, so the difference is 0.370."
          - problem: "Excerpt of two-sided 95% critical values: df 10 gives 2.228; df 50 gives 2.009. How much larger is the df-10 critical value than the df-50 critical value? Give the difference to 3 decimals."
            answer: "0.219"
            answer_contract: {"decimals": 3, "kind": "approx"}
            solution_sketch: "Table step: the df-10 two-sided 95% critical value is 2.228, and the df-50 value is 2.009. Difference step: 2.228 - 2.009 = 0.219. As df grows the t critical value moves toward the normal value, so the difference is 0.219."
          - problem: "Excerpt of two-sided 99% critical values: df 6 gives 3.707; the normal value is 2.576. How much larger is the df-6 critical value than the normal value? Give the difference to 3 decimals."
            answer: "1.131"
            answer_contract: {"decimals": 3, "kind": "approx"}
            solution_sketch: "Table step: the df-6 two-sided 99% critical value is 3.707, and the normal 99% value is 2.576. Difference step: 3.707 - 2.576 = 1.131. At 99% confidence the small-sample t value is far above the normal value, so the difference is 1.131."
          - problem: "Excerpt of two-sided 95% critical values: df 15 gives 2.131; df 25 gives 2.060. How much larger is the df-15 critical value than the df-25 critical value? Give the difference to 3 decimals."
            answer: "0.071"
            answer_contract: {"decimals": 3, "kind": "approx"}
            solution_sketch: "Table step: the df-15 two-sided 95% critical value is 2.131, and the df-25 value is 2.060. Difference step: 2.131 - 2.060 = 0.071. The smaller sample has the heavier tail, so the difference is 0.071."
        constraints: "table excerpts always printed in the problem; comparisons quantitative (differences), not verbal"
      - id: kp3
        name: "Reading critical values"
        key_prerequisites: [sampling-distributions, normal-distribution]
        exemplars:
          - problem: 'Table row for df $9$: $t^* = 2.262$ ($95\%$), $3.250$ ($99\%$). For a procedure with $n = 10$ at the $95\%$ level, give $t^*$.'
            answer: "2.262"
            solution_sketch: '$\text{df} = 10 - 1 = 9$; read the $95\%$ column.'
          - problem: 'Same row. At the $99\%$ level, give $t^*$.'
            answer: "3.250"
            solution_sketch: 'Higher confidence demands a wider reach: $3.250 > 2.262$.'
          - problem: "A table row for df 15 gives t* = 2.131 (95%) and t* = 2.947 (99%). For a procedure with n = 16 at the 99% level, give t* to 3 decimals."
            answer: "2.947"
            answer_contract: {"decimals": 3, "kind": "approx"}
            solution_sketch: "The sample size is n = 16, so the degrees of freedom are df = 16 - 1 = 15. The 99% confidence level selects the 99% column of the supplied row. That row gives t* = 2.947. The answer is 2.947."
          - problem: "Table rows: df 19 gives t* = 2.093 (95%) and t* = 2.861 (99%); df 20 gives t* = 2.086 (95%) and t* = 2.845 (99%). A sample has n = 21 and uses the 95% level. Give t* to 3 decimals."
            answer: "2.086"
            answer_contract: {"decimals": 3, "kind": "approx"}
            solution_sketch: "First find the degrees of freedom: df = n - 1 = 21 - 1 = 20. Select the row for df 20, not the row for df 19. At the 95% level that row gives t* = 2.086. The answer is 2.086."
          - problem: "A table row for df 24 gives t* = 2.064 (95%) and t* = 2.797 (99%). A sample uses the 99% level and has t* = 2.797. Find the sample size n."
            answer: "25"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The table shows that t* = 2.797 matches the 99% column for df 24. Since df = n - 1, we solve n - 1 = 24. Thus n = 25. The answer is 25."
          - problem: "For a sample of n = 10, a table row for df 9 gives t* = 2.262 (95%) and t* = 3.250 (99%). Find how much larger the 99% critical value is than the 95% critical value. Give the answer to 3 decimals."
            answer: "0.988"
            answer_contract: {"decimals": 3, "kind": "approx"}
            solution_sketch: "The sample size n = 10 gives df = 10 - 1 = 9. The 99% critical value is 3.250 and the 95% critical value is 2.262. Subtract: 3.250 - 2.262 = 0.988. The answer is 0.988."
        constraints: "the needed t-table row is supplied in the problem; the learner selects df = n - 1 and the confidence level"
    diagnostic_exemplar:
      problem: 'A sample of $n = 9$ has $s = 6$. The table row for df $8$ gives $t^* = 2.306$ ($95\%$) and $t^* = 3.355$ ($99\%$). Give (the estimated standard error of $\bar{x}$, the $95\%$ two-sided critical value for this sample) as an ordered pair.'
      answer: '$(2, 2.306)$'
      solution_sketch: '$s/\sqrt{n} = 6/3 = 2$; the degrees of freedom are $n - 1 = 8$, so the $95\%$ row entry $2.306$ is the critical value.'
    anki_seeds:
      - front: 'When t instead of z?'
        back: 'When $\sigma$ is unknown and estimated by the sample standard deviation $s$.'
        type: basic
      - front: 'Degrees of freedom for a one-sample t procedure?'
        back: '$n - 1$.'
        type: basic
      - front: 'Shape of the t-distribution versus the normal?'
        back: 'Heavier tails; it approaches the standard normal as the degrees of freedom grow.'
        type: basic

  - id: one-sample-t-test
    name: "One-Sample t-Test"
    core: true                 # the workhorse test when sigma is unknown; slope inference instantiates it
    difficulty: 0.65
    drill: false
    answer_kind: multi-step
    expected_time_secs: 240
    prerequisites:
      - id: one-sample-z-test
        weight: 0.8
        key: true
      - id: t-distribution
        weight: 0.7
        key: true
    knowledge_points:
      - id: kp1
        name: "The t statistic"
        key_prerequisites: [one-sample-z-test, t-distribution]
        exemplars:
          - problem: "Test H0: mu = 50. A sample of n = 36 has xbar = 53 and s = 12. Compute the t statistic and the degrees of freedom, and give the answer as (t, df)."
            answer: "(1.5, 35)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "Compute the standard error with SE = s/sqrt(n): 12/sqrt(36) = 12/6 = 2. Compute the t statistic with t = (xbar - mu0)/SE: (53 - 50)/2 = 1.5. Compute the degrees of freedom with df = n - 1: 36 - 1 = 35. So the answer is (1.5, 35)."
          - problem: "A test uses H0: mu = 200. The sample has n = 49, xbar = 193, and s = 14. Compute the t statistic and the degrees of freedom, and give the answer as (t, df)."
            answer: "(-3.5, 48)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "Compute the standard error with SE = s/sqrt(n): 14/sqrt(49) = 14/7 = 2. Compute the t statistic with t = (xbar - mu0)/SE: (193 - 200)/2 = -3.5. Compute the degrees of freedom with df = n - 1: 49 - 1 = 48. So the answer is (-3.5, 48)."
          - problem: "A quality check tests H0: mu = 12. A sample of n = 25 items has xbar = 15 and s = 5. Compute the t statistic and the degrees of freedom, and give the answer as (t, df)."
            answer: "(3, 24)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "Use the standard error formula SE = s/sqrt(n): 5/sqrt(25) = 5/5 = 1. Use the t statistic formula t = (xbar - mu0)/SE: (15 - 12)/1 = 3. Use the degrees of freedom formula df = n - 1: 25 - 1 = 24. So the answer is (3, 24)."
          - problem: "A study tests H0: mu = 80. The sample size is n = 64, the sample mean is xbar = 76, and the sample standard deviation is s = 16. Compute the t statistic and the degrees of freedom, and give the answer as (t, df)."
            answer: "(-2, 63)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "Find the standard error using SE = s/sqrt(n): 16/sqrt(64) = 16/8 = 2. Find the t statistic using t = (xbar - mu0)/SE: (76 - 80)/2 = -2. Find the degrees of freedom using df = n - 1: 64 - 1 = 63. So the answer is (-2, 63)."
          - problem: "A lab tests H0: mu = 5. It records n = 9, xbar = 8, and s = 3. Compute the t statistic and the degrees of freedom, and give the answer as (t, df)."
            answer: "(3, 8)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "Compute the standard error via SE = s/sqrt(n): 3/sqrt(9) = 3/3 = 1. Compute the t statistic via t = (xbar - mu0)/SE: (8 - 5)/1 = 3. Compute the degrees of freedom via df = n - 1: 9 - 1 = 8. So the answer is (3, 8)."
          - problem: "A survey tests H0: mu = 100. The sample has n = 100, xbar = 97, and s = 20. Compute the t statistic and the degrees of freedom, and give the answer as (t, df)."
            answer: "(-1.5, 99)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "Determine the standard error from SE = s/sqrt(n): 20/sqrt(100) = 20/10 = 2. Determine the t statistic from t = (xbar - mu0)/SE: (97 - 100)/2 = -1.5. Determine the degrees of freedom from df = n - 1: 100 - 1 = 99. So the answer is (-1.5, 99)."
        constraints: "sigma never given — only s; s and n give integer SEs; t comes out to halves or whole numbers"
      - id: kp2
        name: "Decision with a t critical value"
        key_prerequisites: [t-distribution, one-sample-z-test]
        exemplars:
          - problem: 'A two-sided t-test at $\alpha = 0.05$ has $t = 2.0$ with df $= 15$; the table gives $t^* = 2.131$. State the decision, and contrast it with what the z-value $z^* = 2$ would have said.'
            answer: 'Fail to reject $H_0$: $|2.0| < 2.131$. A z-test would (wrongly) have rejected — the wider t critical value is the price of estimating $\sigma$ from $16$ observations.'
          - problem: 'Same table value $t^* = 2.131$ (df $15$), but the data give $t = -2.5$. Decision?'
            answer: 'Reject $H_0$: $|-2.5| > 2.131$.'
        constraints: "t* always supplied together with its df; include one case whose decision differs from the naive z* = 2 rule"
      - id: kp3
        name: "The full t-test in context"
        key_prerequisites: [one-sample-z-test, t-distribution]
        exemplars:
          - problem: "A juice bottler aims for a mean fill of 500 ml. A sample of n = 16 bottles has xbar = 497 ml and s = 8 ml. Test H0: mu = 500 against H1: mu != 500 at alpha = 0.05, using t* = 2.131 (df = 15). State the decision and give the t statistic."
            answer: "decision = retain; t = -3/2"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["retain"], ["reject"]]}, "name": "decision"}, {"contract": {"kind": "exact"}, "name": "t"}]}
            solution_sketch: "Full object: n = 16, xbar = 497, s = 8, mu0 = 500, t* = 2.131. Step 1: use the standard error formula SE = s/sqrt(n) = 8/4 = 2. Step 2: use the t statistic formula t = (xbar - mu0)/SE = (497 - 500)/2 = -3/2. Step 3: compare |t| = 1.5 with t* = 2.131; since 1.5 < 2.131, retain H0. The answer is decision = retain; t = -3/2."
          - problem: "A sleep aid claims a mean increase of 30 minutes in sleep time. A sample of n = 9 people has xbar = 27 minutes and s = 3.6 minutes. Test H0: mu = 30 against H1: mu < 30 at alpha = 0.05, using t* = -1.860 (df = 8). State the decision and give the t statistic."
            answer: "decision = reject; t = -5/2"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["reject"], ["retain"]]}, "name": "decision"}, {"contract": {"kind": "exact"}, "name": "t"}]}
            solution_sketch: "Full object: n = 9, xbar = 27, s = 3.6, mu0 = 30, t* = -1.860. Step 1: use the standard error formula SE = s/sqrt(n) = 3.6/3 = 1.2. Step 2: use the t statistic formula t = (xbar - mu0)/SE = (27 - 30)/1.2 = -5/2. Step 3: compare t = -2.5 with t* = -1.860; since -2.5 < -1.860, reject H0. The answer is decision = reject; t = -5/2."
          - problem: "A fertilizer claims a mean yield increase of 50 kg. A sample of n = 25 plots has xbar = 53 kg and s = 10 kg. Test H0: mu = 50 against H1: mu > 50 at alpha = 0.05, using t* = 1.711 (df = 24). Which conclusion is correct?"
            answer: "retain H0: no evidence mean yield exceeds 50 kg"
            answer_contract: {"kind": "label", "options": [["retain H0: no evidence mean yield exceeds 50 kg"], ["reject H0: evidence mean yield exceeds 50 kg"], ["reject H0: evidence mean yield below 50 kg"], ["retain H0: no evidence mean yield differs from 50 kg"]]}
            solution_sketch: "Full object: n = 25, xbar = 53, s = 10, mu0 = 50, t* = 1.711. Step 1: use the standard error formula SE = s/sqrt(n) = 10/5 = 2. Step 2: use the t statistic formula t = (xbar - mu0)/SE = (53 - 50)/2 = 3/2. Step 3: compare t = 1.5 with t* = 1.711; since 1.5 < 1.711, fail to reject H0. The correct conclusion is retain H0: no evidence mean yield exceeds 50 kg. The option reject H0: evidence mean yield exceeds 50 kg is wrong because it rejects when t is below the critical value. The option reject H0: evidence mean yield below 50 kg is wrong because it uses the opposite direction. The option retain H0: no evidence mean yield differs from 50 kg is wrong because it states a two-sided conclusion. The answer is retain H0: no evidence mean yield exceeds 50 kg."
          - problem: "A machine cuts rods to a target length of 40 cm. A sample of n = 16 rods has xbar = 39.5 cm and s = 1.2 cm. Test H0: mu = 40 against H1: mu < 40. Find the t statistic."
            answer: "-5/3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Full object: n = 16, xbar = 39.5, s = 1.2, mu0 = 40. Step 1: use the standard error formula SE = s/sqrt(n) = 1.2/4 = 0.3. Step 2: use the t statistic formula t = (xbar - mu0)/SE = (39.5 - 40)/0.3 = -5/3. The answer is -5/3."
          - problem: "A light bulb brand claims a mean life of 1000 hours. A sample of n = 9 bulbs has xbar = 980 hours and s = 30 hours. Test H0: mu = 1000 against H1: mu < 1000. Find the t statistic."
            answer: "-2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Full object: n = 9, xbar = 980, s = 30, mu0 = 1000. Step 1: use the standard error formula SE = s/sqrt(n) = 30/3 = 10. Step 2: use the t statistic formula t = (xbar - mu0)/SE = (980 - 1000)/10 = -2. The answer is -2."
          - problem: "A coffee shop aims for a mean espresso volume of 250 ml. A sample of n = 25 shots has xbar = 249 ml and s = 5 ml. Test H0: mu = 250 against H1: mu != 250. Find the t statistic."
            answer: "-1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Full object: n = 25, xbar = 249, s = 5, mu0 = 250. Step 1: use the standard error formula SE = s/sqrt(n) = 5/5 = 1. Step 2: use the t statistic formula t = (xbar - mu0)/SE = (249 - 250)/1 = -1. The answer is -1."
        constraints: "metric contexts; conclusions in the scenario's units; both one- and two-sided cases appear across a set"
    diagnostic_exemplar:
      problem: 'A bakery''s loaves should weigh $800$ g on average. A sample of $n = 16$ loaves has $\bar{x} = 806$ g and $s = 8$ g. Test $H_0: \mu = 800$ against $H_1: \mu \ne 800$ at $\alpha = 0.05$ ($t^* = 2.131$, df $15$). Give $t$, the decision, and a conclusion in context.'
      answer: '$\operatorname{SE} = 2$; $t = 3$; $|3| > 2.131$, so reject $H_0$ — evidence the loaves are heavier than $800$ g on average.'
      solution_sketch: 'Same shape as the z-test with $s$ in place of an unknown $\sigma$: $\operatorname{SE} = s/\sqrt{n}$ and $t = (\bar x - \mu_0)/\operatorname{SE}$, compared with the supplied $t^* = 2.131$ on $n - 1 = 15$ df.'
    anki_seeds:
      - front: 'One-sample t statistic?'
        back: '$t = \dfrac{\bar{x} - \mu_0}{s/\sqrt{n}}$, with $n - 1$ degrees of freedom.'
        type: basic
      - front: 'What changes from the z-test to the t-test?'
        back: '$s$ replaces $\sigma$, and critical values come from the t-distribution with $n - 1$ df.'
        type: basic

  - id: two-sample-t-test
    name: "Two-Sample t-Test"
    core: false                # terminal inference destination, like inference-for-slope; nothing downstream builds on it
    difficulty: 0.7
    drill: false
    answer_kind: multi-step
    expected_time_secs: 240
    prerequisites:
      - id: one-sample-t-test
        weight: 0.8
        key: true
      - id: sums-of-random-variables
        weight: 0.6
        key: true
      - id: experimental-design-basics
        weight: 0.0            # conceptual only: treatment/control designs are what the test analyzes
        key: false
    knowledge_points:
      - id: kp1
        name: "Hypotheses and the standard error of a difference"
        key_prerequisites: [sums-of-random-variables, one-sample-t-test]
        exemplars:
          - problem: "A company runs two assembly lines whose population mean outputs per shift are mu1 and mu2. The quality team wants to detect any change in the difference between the lines, in either direction. Which alternative hypothesis fits this goal?"
            answer: "H1: mu1 - mu2 != 0"
            answer_contract: {"kind": "label", "options": [["H1: mu1 - mu2 != 0"], ["H0: mu1 - mu2 = 0"], ["H1: xbar1 - xbar2 != 0"], ["H1: mu1 - mu2 > 0"]]}
            solution_sketch: "Step 1 (hypothesis framing): hypotheses concern population means, here the difference mu1 - mu2, and a difference in either direction is two-sided. Step 2 (error check): the option H0: mu1 - mu2 = 0 wrongly restates the null hypothesis as the alternative; the option H1: xbar1 - xbar2 != 0 wrongly uses the sample means, which are already known; the option H1: mu1 - mu2 > 0 wrongly assumes the difference has one direction. The correct choice is H1: mu1 - mu2 != 0."
          - problem: "Independent samples from two populations give $s_1 = 4$ with $n_1 = 8$, and $s_2 = 14$ with $n_2 = 28$. Compute $\\operatorname{SE} = \\sqrt{s_1^2/n_1 + s_2^2/n_2}$ for the difference of the sample means. Find the standard error of the difference."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (variance of a sample mean): $s_1^2/n_1 = 16/8 = 2$ and $s_2^2/n_2 = 196/28 = 7$. Step 2 (independence, sums of random variables): for independent samples the variances add even though the means are subtracted, so $\\operatorname{Var}(\\bar{X}_1 - \\bar{X}_2) = 2 + 7 = 9$. Step 3 (square root): $\\operatorname{SE} = \\sqrt{9} = 3$. The standard error of the difference is 3."
          - problem: "A drug is tried at two clinic sites. Site A has $s_1 = 2.4$, $n_1 = 4$; site B has $s_2 = 3.2$, $n_2 = 4$, and the sites are independent. Find the standard error of the difference of the two sample means."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (variance of a sample mean): $s_1^2/n_1 = 5.76/4 = 1.44$ and $s_2^2/n_2 = 10.24/4 = 2.56$. Step 2 (independence): the variances add, $1.44 + 2.56 = 4$. Step 3 (square root): $\\operatorname{SE} = \\sqrt{4} = 2$. The standard error of the difference is 2."
          - problem: "Two battery brands are tested independently. Brand A has $s_1 = 8$ hours with $n_1 = 16$; brand B has $n_2 = 8$. The standard error of the difference in mean lifetimes is $6$ hours. Find the sample standard deviation $s_2$ of brand B."
            answer: "16"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (known term): $s_1^2/n_1 = 64/16 = 4$. Step 2 (square the SE): $\\operatorname{SE}^2 = 36$, so the brand-B term is $36 - 4 = 32$. Step 3 (solve for the standard deviation): $s_2^2 = 32 \\cdot 8 = 256$, so $s_2 = \\sqrt{256} = 16$. The sample standard deviation of brand B is 16."
          - problem: "Two independent filling machines are sampled: machine 1 has $s_1 = 8$ with $n_1 = 8$, and machine 2 has $s_2 = 17$ with $n_2 = 17$. Give the variance of $\\bar{X}_1 - \\bar{X}_2$ and its standard error."
            answer: "var = 25; se = 5"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "var"}, {"contract": {"kind": "exact"}, "name": "se"}]}
            solution_sketch: "Step 1 (variance of a sample mean): $s_1^2/n_1 = 64/8 = 8$ and $s_2^2/n_2 = 289/17 = 17$. Step 2 (independence, sums of random variables): $\\operatorname{Var}(\\bar{X}_1 - \\bar{X}_2) = 8 + 17 = 25$. Step 3 (square root): the standard error is $\\sqrt{25} = 5$. Thus var = 25 and se = 5."
          - problem: "A planner will draw two independent samples of the same size $n$ from populations with $s_1 = 6$ and $s_2 = 8$, and wants the standard error of $\\bar{X}_1 - \\bar{X}_2$ to be at most $1$. Find the smallest sample size $n$ that each group needs."
            answer: "100"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (square the target): $\\operatorname{SE}^2 = s_1^2/n + s_2^2/n = (36 + 64)/n = 100/n$. Step 2 (inequality): requiring $\\operatorname{SE} \\le 1$ gives $100/n \\le 1$, so $n \\ge 100$. Step 3 (conclusion): the smallest integer meeting this is $n = 100$. Each group needs a sample size of 100."
        constraints: "hypotheses about mu1 - mu2 (or mu1 = mu2), never about x-bars; s_i^2/n_i come out to integers or exact decimals whose sum is a perfect square, so the SE is exact"
      - id: kp2
        name: "The two-sample t statistic and conservative df"
        key_prerequisites: [one-sample-t-test, sums-of-random-variables]
        exemplars:
          - problem: "Independent samples give $\\bar{x}_1 = 30$, $s_1 = 4$, $n_1 = 4$ and $\\bar{x}_2 = 25$, $s_2 = 3$, $n_2 = 4$. The two-sample statistic is $t = \\frac{\\bar{x}_1 - \\bar{x}_2}{\\sqrt{s_1^2/n_1 + s_2^2/n_2}}$, and the conservative degrees of freedom are $\\min(n_1, n_2) - 1$. Compute $t$ and the conservative degrees of freedom."
            answer: "t = 2; df = 3"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "t"}, {"contract": {"kind": "exact"}, "name": "df"}]}
            solution_sketch: "Step 1 (pooled-free standard error): $\\operatorname{SE} = \\sqrt{s_1^2/n_1 + s_2^2/n_2} = \\sqrt{16/4 + 9/4} = \\sqrt{6.25} = 2.5$. Step 2 (two-sample t statistic): $t = (\\bar{x}_1 - \\bar{x}_2)/\\operatorname{SE} = (30 - 25)/2.5 = 2$. Step 3 (conservative df): $\\min(n_1, n_2) - 1 = \\min(4, 4) - 1 = 3$. The answer is t = 2; df = 3."
          - problem: "Two independent samples have sizes $n_1 = 12$ and $n_2 = 16$, with $\\bar{x}_1 = 60$, $s_1 = 12$ and $\\bar{x}_2 = 48$, $s_2 = 8$. Use $t = \\frac{\\bar{x}_1 - \\bar{x}_2}{\\sqrt{s_1^2/n_1 + s_2^2/n_2}}$ and the conservative degrees of freedom $\\min(n_1, n_2) - 1$. Find $t$ and the conservative degrees of freedom."
            answer: "t = 3; df = 11"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "t"}, {"contract": {"kind": "exact"}, "name": "df"}]}
            solution_sketch: "Step 1 (standard error): $s_1^2/n_1 = 144/12 = 12$ and $s_2^2/n_2 = 64/16 = 4$, so $\\operatorname{SE} = \\sqrt{12 + 4} = 4$. Step 2 (t statistic): $t = (60 - 48)/4 = 3$. Step 3 (conservative df): $\\min(12, 16) - 1 = 11$. The answer is t = 3; df = 11."
          - problem: "In a teaching study, class A ($n_1 = 25$ students) scores a mean of $72$ with standard deviation $10$; class B ($n_2 = 12$ students) scores a mean of $78$ with standard deviation $12$. With $t = \\frac{\\bar{x}_1 - \\bar{x}_2}{\\sqrt{s_1^2/n_1 + s_2^2/n_2}}$ and conservative degrees of freedom $\\min(n_1, n_2) - 1$, give $t$ and the conservative degrees of freedom."
            answer: "t = -1.5; df = 11"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "t"}, {"contract": {"kind": "exact"}, "name": "df"}]}
            solution_sketch: "Step 1 (standard error): $100/25 = 4$ and $144/12 = 12$, so $\\operatorname{SE} = \\sqrt{4 + 12} = 4$. Step 2 (t statistic): $t = (72 - 78)/4 = -1.5$; the negative sign shows class B scored higher. Step 3 (conservative df): $\\min(25, 12) - 1 = 11$. The answer is t = -1.5; df = 11."
          - problem: "Battery life is compared for two brands: brand A has $n_1 = 8$ batteries with mean $50$ hours and $s_1 = 4$; brand B has $n_2 = 18$ batteries with mean $45$ hours and $s_2 = 6$. The conservative degrees of freedom are $\\min(n_1, n_2) - 1$, and $t = \\frac{\\bar{x}_1 - \\bar{x}_2}{\\sqrt{s_1^2/n_1 + s_2^2/n_2}}$. Compute $t$ and the conservative degrees of freedom."
            answer: "t = 2.5; df = 7"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "t"}, {"contract": {"kind": "exact"}, "name": "df"}]}
            solution_sketch: "Step 1 (standard error): $16/8 = 2$ and $36/18 = 2$, so $\\operatorname{SE} = \\sqrt{2 + 2} = 2$. Step 2 (t statistic): $t = (50 - 45)/2 = 2.5$. Step 3 (conservative df): the smaller sample has $n_1 = 8$, so $\\min(8, 18) - 1 = 7$. The answer is t = 2.5; df = 7."
          - problem: "Group 1 has $n_1 = 9$ people with mean score $85$ and $s_1 = 9$; group 2 has $n_2 = 16$ people with mean score $100$ and $s_2 = 16$. Use $t = \\frac{\\bar{x}_1 - \\bar{x}_2}{\\sqrt{s_1^2/n_1 + s_2^2/n_2}}$ and the conservative degrees of freedom $\\min(n_1, n_2) - 1$. Determine $t$ and the conservative degrees of freedom."
            answer: "t = -3; df = 8"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "t"}, {"contract": {"kind": "exact"}, "name": "df"}]}
            solution_sketch: "Step 1 (standard error): $81/9 = 9$ and $256/16 = 16$, so $\\operatorname{SE} = \\sqrt{9 + 16} = 5$. Step 2 (t statistic): $t = (85 - 100)/5 = -3$; the negative value reflects the higher mean of group 2. Step 3 (conservative df): $\\min(9, 16) - 1 = 8$. The answer is t = -3; df = 8."
          - problem: "Wait times at two cashiers are compared: cashier 1 serves $n_1 = 8$ sampled customers with mean wait $64$ s and $s_1 = 8$; cashier 2 serves $n_2 = 25$ sampled customers with mean wait $55$ s and $s_2 = 5$. With $\\operatorname{SE} = \\sqrt{s_1^2/n_1 + s_2^2/n_2}$, $t = \\frac{\\bar{x}_1 - \\bar{x}_2}{\\operatorname{SE}}$ and conservative degrees of freedom $\\min(n_1, n_2) - 1$, state the standard error, $t$, and the conservative degrees of freedom."
            answer: "se = 3; t = 3; df = 7"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "se"}, {"contract": {"kind": "exact"}, "name": "t"}, {"contract": {"kind": "exact"}, "name": "df"}]}
            solution_sketch: "Step 1 (standard error): $64/8 = 8$ and $25/25 = 1$, so $\\operatorname{SE} = \\sqrt{8 + 1} = 3$. Step 2 (t statistic): $t = (64 - 55)/3 = 3$. Step 3 (conservative df): the smaller group has $n_1 = 8$, so $\\min(8, 25) - 1 = 7$. The answer is se = 3; t = 3; df = 7."
        constraints: "SE comes out whole or half; t to halves or whole numbers; the conservative df = min(n1, n2) - 1 convention is stated in the problem and asked explicitly"
      - id: kp3
        name: "Analyzing a treatment/control experiment end-to-end"
        key_prerequisites: [one-sample-t-test, experimental-design-basics]
        exemplars:
          - problem: "A randomised trial gives a new feed to 16 chickens and a standard feed to 16 others. Weight gain in grams: new-feed group has mean 420 g and standard deviation 12 g; standard-feed group has mean 400 g and standard deviation 16 g. Test H0: mu1 = mu2 against H1: mu1 not equal mu2 at alpha = 0.05 with t* = 2.131 (conservative df 15, given). Give the t statistic and the decision."
            answer: "verdict = reject; t = 4"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["reject"], ["retain"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "t"}]}
            solution_sketch: "Step 1 standard error: sqrt(12^2/16 + 16^2/16) = sqrt(9 + 16) = 5. Step 2 t statistic: (420 - 400) / 5 = 4. Step 3 decision: the given t* is 2.131, and 4 > 2.131, so the null hypothesis is rejected. Because the chickens were randomly assigned, the conclusion is causal: the new feed increases weight gain. Choosing retain would be the error of treating a t statistic larger than t* as non-significant. The answer is verdict = reject; t = 4."
          - problem: "Two filling machines are compared. Machine A fills 36 bottles with mean 505 ml and standard deviation 18 ml; machine B fills 25 bottles with mean 500 ml and standard deviation 20 ml. Test H0: mu1 = mu2 against H1: mu1 not equal mu2 at alpha = 0.05 with t* = 2.064 (conservative df 24, given). Give the t statistic and the decision."
            answer: "verdict = retain; t = 1"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["reject"], ["retain"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "t"}]}
            solution_sketch: "Step 1 standard error: sqrt(18^2/36 + 20^2/25) = sqrt(9 + 16) = 5. Step 2 t statistic: (505 - 500) / 5 = 1. Step 3 decision: the given t* is 2.064, and |1| < 2.064, so the null hypothesis is retained. No random assignment is stated, so the conclusion is only that there is no convincing evidence the machines fill differently. Choosing reject would be the error of treating a small t statistic as significant. The answer is verdict = retain; t = 1."
          - problem: "An observational study records daily step counts in hundreds for 49 coffee drinkers and 36 non-drinkers. Coffee group: mean 112 and standard deviation 21; non-coffee group: mean 100 and standard deviation 24. Test H0: mu1 = mu2 against H1: mu1 not equal mu2 at alpha = 0.05 with t* = 2.030 (conservative df 35, given). Give the t statistic and the decision."
            answer: "verdict = reject; t = 12/5"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["reject"], ["retain"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "t"}]}
            solution_sketch: "Step 1 standard error: sqrt(21^2/49 + 24^2/36) = sqrt(9 + 16) = 5. Step 2 t statistic: (112 - 100) / 5 = 12/5 = 2.4. Step 3 decision: the given t* is 2.030, and 2.4 > 2.030, so the null hypothesis is rejected. The study is observational, so the conclusion is an association between coffee drinking and step count, not a causal effect. Choosing retain would be the error of missing a t statistic beyond t*. The answer is verdict = reject; t = 12/5."
          - problem: "A randomised experiment assigns 25 stores to a new layout and 25 stores to the standard layout. Weekly sales in hundreds of dollars: new layout has mean 510 and standard deviation 15; standard layout has mean 500 and standard deviation 20. Test H0: mu1 = mu2 against H1: mu1 greater than mu2 at alpha = 0.05 with t* = 1.711 (conservative df 24, given). Give the t statistic and the decision."
            answer: "verdict = reject; t = 2"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["reject"], ["retain"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "t"}]}
            solution_sketch: "Step 1 standard error: sqrt(15^2/25 + 20^2/25) = sqrt(9 + 16) = 5. Step 2 t statistic: (510 - 500) / 5 = 2. Step 3 decision: the given one-sided t* is 1.711, and 2 > 1.711, so the null hypothesis is rejected in favor of mu1 greater than mu2. Random assignment supports a causal conclusion: the new layout increases weekly sales. Choosing retain would be the error of missing a t statistic beyond the one-sided t*. The answer is verdict = reject; t = 2."
          - problem: "A study compares two teaching methods. Method A: 25 students, mean score 80 points, standard deviation 12 points. Method B: 25 students, mean score 70 points, standard deviation 16 points. A two-sided test at alpha = 0.05 would use t* = 2.064 (conservative df 24, given). Find the standard error and the t statistic."
            answer: "se = 4; t = 5/2"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "se"}, {"contract": {"kind": "exact"}, "name": "t"}]}
            solution_sketch: "Step 1 standard error: sqrt(12^2/25 + 16^2/25) = sqrt(144/25 + 256/25) = sqrt(400/25) = sqrt(16) = 4. Step 2 t statistic: (80 - 70) / 4 = 10/4 = 5/2. The answer is se = 4; t = 5/2."
          - problem: "A randomised trial compares a new supplement with a placebo. Supplement group: 25 subjects, mean 45 points, standard deviation 9 points. Placebo group: 25 subjects, mean 33 points, standard deviation 12 points. A two-sided test at alpha = 0.05 would use t* = 2.064 (conservative df 24, given). Find the standard error and the t statistic."
            answer: "se = 3; t = 4"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "se"}, {"contract": {"kind": "exact"}, "name": "t"}]}
            solution_sketch: "Step 1 standard error: sqrt(9^2/25 + 12^2/25) = sqrt(81/25 + 144/25) = sqrt(225/25) = sqrt(9) = 3. Step 2 t statistic: (45 - 33) / 3 = 12/3 = 4. The answer is se = 3; t = 4."
        constraints: "metric contexts; t* always supplied with its (conservative) df; conclusions in the scenario's units; causal language only when the scenario states random assignment, never for observational comparisons"
    diagnostic_exemplar:
      problem: '$32$ students are randomly split: $16$ revise with a study app, $16$ without, and all sit the same exam marked out of $10$. App group: $\bar{x}_1 = 8.0$, $s_1 = 1.2$; control: $\bar{x}_2 = 6.5$, $s_2 = 1.6$. Test $H_0: \mu_1 = \mu_2$ against $H_1: \mu_1 \ne \mu_2$ at $\alpha = 0.05$ with $t^* = 2.131$ (conservative df $15$). Give $t$, the decision, and a conclusion in context.'
      answer: '$\operatorname{SE} = \sqrt{0.09 + 0.16} = 0.5$; $t = \dfrac{8.0 - 6.5}{0.5} = 3$; $|3| > 2.131$, so reject $H_0$ — evidence the app improves marks, and random assignment lets the difference be attributed to the app.'
      solution_sketch: 'Two independent samples, so the standard errors combine in quadrature: $\operatorname{SE} = \sqrt{s_1^2/n_1 + s_2^2/n_2}$ and $t = (\bar x_1 - \bar x_2)/\operatorname{SE}$ against the supplied $t^* = 2.131$. Random assignment is what upgrades the conclusion from association to cause.'
    anki_seeds:
      - front: 'Two-sample t statistic?'
        back: '$t = \dfrac{\bar{x}_1 - \bar{x}_2}{\sqrt{s_1^2/n_1 + s_2^2/n_2}}$.'
        type: basic
      - front: 'Why do the variances add in the two-sample SE when the means are subtracted?'
        back: 'For independent samples, $\operatorname{Var}(\bar{X}_1 - \bar{X}_2) = \operatorname{Var}(\bar{X}_1) + \operatorname{Var}(\bar{X}_2)$.'
        type: basic
      - front: 'Conservative degrees of freedom for a two-sample t-test?'
        back: '$\min(n_1, n_2) - 1$.'
        type: basic

  - id: chi-square-goodness-of-fit
    name: "Chi-Square Goodness-of-Fit"
    core: false                # terminal test destination; the independence variant is deliberately omitted — one variant teaches the chi-square reasoning (requirements section 7)
    difficulty: 0.65
    drill: false
    answer_kind: multi-step
    expected_time_secs: 240
    prerequisites:
      - id: hypothesis-tests-logic
        weight: 0.7
        key: true
      - id: discrete-probability-distributions
        weight: 0.5
        key: false
      - id: summation-notation
        weight: 0.3
        key: false
    knowledge_points:
      - id: kp1
        name: "Expected counts under H0"
        key_prerequisites: [discrete-probability-distributions]
        exemplars:
          - problem: "A fair six-sided die is rolled 90 times. Assume the die is fair. Give the expected count for each face as a comma-separated list."
            answer: "15, 15, 15, 15, 15, 15"
            answer_contract: {"kind": "list", "member": {"kind": "exact"}, "ordered": true}
            solution_sketch: "Expected count rule: each expected count is n times its category probability. The die is fair, so each face has probability 1/6, and n = 90. Multiply: 90 times 1/6 = 15 for each of the six faces. The expected counts in face order are 15, 15, 15, 15, 15, 15."
          - problem: "A website claims visitors choose page A 40%, page B 35%, and page C 25%. There are 300 visits. Give the expected counts in the order A, B, C as a comma-separated list."
            answer: "120, 105, 75"
            answer_contract: {"kind": "list", "member": {"kind": "exact"}, "ordered": true}
            solution_sketch: "Expected count rule: for each category, expected count is n times p. With n = 300, the counts are 300(0.40) = 120, 300(0.35) = 105, and 300(0.25) = 75. In the order A, B, C the list is 120, 105, 75."
          - problem: "A four-category model has probabilities 0.10, 0.20, 0.30, and 0.40. The expected count for the third category is 45. Find the total sample size n."
            answer: "150"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Expected count rule: the expected count for a category equals n times its probability. For the third category, 45 = n(0.30). Divide each side by 0.30: n = 150. The total sample size is 150."
          - problem: "A sample of 200 observations is classified into four categories with expected counts 40, 60, 70, and x. Find x."
            answer: "30"
            answer_contract: {"kind": "exact"}
            solution_sketch: "In a goodness-of-fit table, the expected counts must sum to the total sample size. The three given counts sum to 40 + 60 + 70 = 170. Subtract from 200: x = 200 - 170 = 30. The missing expected count is 30."
          - problem: "In a sample of 500, the null hypothesis gives category A probability 0.18. Find the expected count for category A."
            answer: "90"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Expected count rule: the expected count is the sample size times the null probability. Multiply 500 by 0.18: 500(0.18) = 90. The expected count for category A is 90."
          - problem: "A spinner has three regions with null probabilities 1/4, 1/2, and 1/4. It is spun 64 times. Give the expected counts in region order as a comma-separated list."
            answer: "16, 32, 16"
            answer_contract: {"kind": "list", "member": {"kind": "exact"}, "ordered": true}
            solution_sketch: "Expected count rule: each expected count equals n times the null probability for its region. With n = 64, the counts are 64(1/4) = 16, 64(1/2) = 32, and 64(1/4) = 16. In region order the expected counts are 16, 32, 16."
        constraints: "n times p_i is always a whole number; at most 6 categories"
      - id: kp2
        name: "The chi-square statistic"
        key_prerequisites: [summation-notation, discrete-probability-distributions]
        exemplars:
          - problem: "Observed counts (14, 6, 10) against expected counts (10, 10, 10). Compute the chi-square statistic and give the answer to 2 decimals."
            answer: "3.20"
            answer_contract: {"decimals": 2, "kind": "approx"}
            solution_sketch: "Apply the chi-square formula. Compute each term: (14-10)^2/10 = 16/10 = 1.6, (6-10)^2/10 = 16/10 = 1.6, and (10-10)^2/10 = 0. Sum the terms: 1.6 + 1.6 + 0 = 3.2. The chi-square statistic is 3.20."
          - problem: "Observed counts (24, 16) against expected counts (20, 20). Compute the chi-square statistic and give the answer to 2 decimals."
            answer: "1.60"
            answer_contract: {"decimals": 2, "kind": "approx"}
            solution_sketch: "Apply the chi-square formula. Compute each term: (24-20)^2/20 = 16/20 = 0.8, and (16-20)^2/20 = 16/20 = 0.8. Sum the terms: 0.8 + 0.8 = 1.6. The chi-square statistic is 1.60."
          - problem: "A survey has observed counts (40, 20, 15, 25) and expected counts (25, 25, 25, 25). Compute the chi-square statistic."
            answer: "14"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Apply the chi-square formula. Find each squared difference: (40-25)^2 = 225, (20-25)^2 = 25, (15-25)^2 = 100, (25-25)^2 = 0. Divide each by its expected count: 225/25 = 9, 25/25 = 1, 100/25 = 4, 0/25 = 0. Sum the contributions: 9 + 1 + 4 + 0 = 14. The chi-square statistic is 14."
          - problem: "Observed counts (12, 18, 20) against expected counts (10, 20, 20). Compute the chi-square statistic and give the answer to 2 decimals."
            answer: "0.60"
            answer_contract: {"decimals": 2, "kind": "approx"}
            solution_sketch: "Apply the chi-square formula. Compute each term: (12-10)^2/10 = 4/10 = 0.4, (18-20)^2/20 = 4/20 = 0.2, and (20-20)^2/20 = 0. Sum the terms: 0.4 + 0.2 + 0 = 0.6. The chi-square statistic is 0.60."
          - problem: "A sample of 300 plants has expected ratios 1:1:2:2, so expected counts are (50, 50, 100, 100). The observed counts are (45, 55, 105, 95). Compute the chi-square statistic and give the answer to 2 decimals."
            answer: "1.50"
            answer_contract: {"decimals": 2, "kind": "approx"}
            solution_sketch: "Apply the chi-square formula. Compute each term: (45-50)^2/50 = 25/50 = 0.5, (55-50)^2/50 = 25/50 = 0.5, (105-100)^2/100 = 25/100 = 0.25, and (95-100)^2/100 = 25/100 = 0.25. Sum the terms: 0.5 + 0.5 + 0.25 + 0.25 = 1.5. The chi-square statistic is 1.50."
          - problem: "A six-sided die is rolled 120 times. Expected counts are 20 for each face. Observed counts are (18, 22, 25, 15, 20, 20). Compute the chi-square statistic and give the answer to 2 decimals."
            answer: "2.90"
            answer_contract: {"decimals": 2, "kind": "approx"}
            solution_sketch: "Apply the chi-square formula. Compute each term: (18-20)^2/20 = 4/20 = 0.2, (22-20)^2/20 = 4/20 = 0.2, (25-20)^2/20 = 25/20 = 1.25, (15-20)^2/20 = 25/20 = 1.25, (20-20)^2/20 = 0, and (20-20)^2/20 = 0. Sum the terms: 0.2 + 0.2 + 1.25 + 1.25 + 0 + 0 = 2.9. The chi-square statistic is 2.90."
        constraints: "(O - E)^2 values divide cleanly by E; observed and expected totals match; chi-square to at most 2 decimals"
      - id: kp3
        name: "Decision and degrees of freedom"
        key_prerequisites: [hypothesis-tests-logic]
        exemplars:
          - problem: 'A goodness-of-fit test over $k = 4$ categories gives $\chi^2 = 7.9$; the critical value at $\alpha = 0.05$ with df $= 3$ is $7.815$ (given). State the df rule and the decision.'
            answer: 'df $= k - 1 = 3$; $7.9 > 7.815$: reject $H_0$ — the claimed distribution does not fit the data.'
          - problem: '$\chi^2 = 2.5$ over $k = 2$ categories; critical value $3.841$ (df $1$, $\alpha = 0.05$). Decision — and why is the test right-tailed only?'
            answer: 'Fail to reject: $2.5 < 3.841$. Only large $\chi^2$ signals disagreement between observed and expected; small values mean good fit, which is no evidence against $H_0$.'
        constraints: "critical values always supplied with their df; df = k - 1; rejection is right-tail only"
    diagnostic_exemplar:
      problem: 'A four-sided die is rolled $100$ times: observed counts $(30, 30, 22, 18)$. Test $H_0$: "the die is fair" at $\alpha = 0.05$; the critical value with df $= 3$ is $7.815$ (given). Compute $\chi^2$ and decide.'
      answer: 'Expected $25$ each; $\chi^2 = \dfrac{25 + 25 + 9 + 49}{25} = 4.32 < 7.815$: fail to reject $H_0$ — the counts are consistent with a fair die.'
      solution_sketch: 'A fair die makes every expected count $100/4 = 25$; sum $\frac{(O - E)^2}{E}$ over the four cells and compare with the supplied critical value $7.815$ — falling below it means the discrepancies are within chance variation.'
    anki_seeds:
      - front: 'Chi-square statistic?'
        back: '$\chi^2 = \sum \dfrac{(O - E)^2}{E}$ over all categories.'
        type: basic
      - front: 'Degrees of freedom for goodness-of-fit with $k$ categories?'
        back: '$k - 1$.'
        type: basic
      - front: 'Chi-square rejection region?'
        back: 'Right tail only — large values signal misfit between observed and expected counts.'
        type: basic

  - id: inference-for-slope
    name: "Inference for the Regression Slope"
    core: false                # caps the supplemental regression branch; nothing downstream — kept supplemental rather than flipping least-squares-line back to core (R-2)
    difficulty: 0.7
    drill: false
    answer_kind: multi-step
    expected_time_secs: 240
    prerequisites:
      - id: least-squares-line
        weight: 0.7
        key: true
      - id: one-sample-t-test
        weight: 0.7
        key: true
      - id: correlation-regression
        weight: 0.4
        key: false
    knowledge_points:
      - id: kp1
        name: "The slope varies from sample to sample"
        key_prerequisites: [least-squares-line, one-sample-t-test]
        exemplars:
          - problem: "A regression line is fitted to a sample of points. To test whether the population slope is zero, four students write null and alternative pairs. Select the pair that states the hypotheses correctly."
            answer: "H0: beta = 0; H1: beta != 0"
            answer_contract: {"kind": "label", "options": [["H0: beta = 0; H1: beta != 0"], ["H0: beta = 0; H1: beta > 0"], ["H0: beta = 0; H1: beta = 0"], ["H0: beta != 0; H1: beta = 0"]]}
            solution_sketch: "The null hypothesis says there is no linear relationship, so the population slope beta is 0. The alternative says there is a linear relationship, so beta is not 0. The wrong option H0: beta = 0; H1: beta > 0 uses a one-sided alternative. The wrong option H0: beta = 0; H1: beta = 0 repeats the null. The wrong option H0: beta != 0; H1: beta = 0 reverses the hypotheses. The correct pair is H0: beta = 0; H1: beta != 0."
          - problem: "A regression gives fitted slope b = 2.1 and standard error SE_b = 0.7. Find the variance of the sampling distribution of b."
            answer: "0.49"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The sampling distribution of the fitted slope b has standard deviation equal to the standard error SE_b. With SE_b = 0.7, the variance is the square of the standard error. Compute 0.7 squared = 0.49. The variance of the sampling distribution is 0.49."
          - problem: "For a regression, the fitted slope is b = -1.5 and the standard error is SE_b = 0.4. Compute the variance of the sampling distribution of b."
            answer: "0.16"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The standard error SE_b is the standard deviation of the sampling distribution of b. With SE_b = 0.4, the variance is SE_b squared. Compute 0.4 squared = 0.16. The variance is 0.16."
          - problem: "A regression gives fitted slope b = 3.2 and standard error SE_b = 0.8. Under the null hypothesis that the population slope is zero, state the mean of the sampling distribution of b."
            answer: "0"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Under the null hypothesis that the population slope is zero, the sampling distribution of b is centered at the population slope. That center is zero. The mean of the sampling distribution of b is 0."
          - problem: "A regression gives fitted slope b = 1.8 and standard error SE_b = 0.5. The population slope is beta = 0.5. Find the difference b minus beta."
            answer: "1.3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The fitted slope b estimates the population slope beta. The difference is b minus beta. Substitute b = 1.8 and beta = 0.5: 1.8 - 0.5 = 1.3. The difference is 1.3."
          - problem: "A regression gives fitted slope b = 2.4 and standard error SE_b = 0.6. The population slope is beta = 1.1. Find the difference beta minus b."
            answer: "-1.3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The fitted slope b estimates the population slope beta. The requested difference is beta minus b. Substitute beta = 1.1 and b = 2.4: 1.1 - 2.4 = -1.3. The difference is -1.3."
        constraints: "hypotheses are about beta, never about b; SE_b is always supplied, never computed from raw data"
      - id: kp2
        name: "The t statistic for the slope"
        key_prerequisites: [one-sample-t-test, least-squares-line]
        exemplars:
          - problem: "A regression on $n = 18$ points gives $b = 2.4$ with $\\operatorname{SE}_b = 0.6$. Compute the $t$ statistic and the degrees of freedom."
            answer: "t = 4; df = 16"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "t"}, {"contract": {"kind": "exact"}, "name": "df"}]}
            solution_sketch: "Step 1: Use the slope $t$ statistic $t = b / \\operatorname{SE}_b$. Step 2: Substitute $b = 2.4$ and $\\operatorname{SE}_b = 0.6$: $t = 2.4 / 0.6 = 4$. Step 3: Use $df = n - 2$; with $n = 18$, $df = 16$. Thus t = 4; df = 16."
          - problem: "A regression on $n = 15$ points gives $b = -1.2$ with $\\operatorname{SE}_b = 0.8$. Compute the $t$ statistic and the degrees of freedom."
            answer: "t = -3/2; df = 13"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "t"}, {"contract": {"kind": "exact"}, "name": "df"}]}
            solution_sketch: "Step 1: Use the slope $t$ statistic $t = b / \\operatorname{SE}_b$. Step 2: Substitute $b = -1.2$ and $\\operatorname{SE}_b = 0.8$: $t = -1.2 / 0.8 = -1.5 = -3/2$. Step 3: Use $df = n - 2$; with $n = 15$, $df = 13$. Thus t = -3/2; df = 13."
          - problem: "A study of plant growth regresses height in cm on daily sunlight hours for $n = 26$ plants. The estimated slope is $b = 0.75$ with $\\operatorname{SE}_b = 0.25$. Compute the $t$ statistic for the slope and the degrees of freedom."
            answer: "t = 3; df = 24"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "t"}, {"contract": {"kind": "exact"}, "name": "df"}]}
            solution_sketch: "Step 1: Use the slope $t$ statistic $t = b / \\operatorname{SE}_b$. Step 2: Substitute $b = 0.75$ and $\\operatorname{SE}_b = 0.25$: $t = 0.75 / 0.25 = 3$. Step 3: The degrees of freedom are $df = n - 2 = 26 - 2 = 24$. Thus t = 3; df = 24."
          - problem: "A regression on $n = 14$ points has $t = 2.5$ for the slope and $\\operatorname{SE}_b = 0.6$. Find the estimated slope $b$ as a fraction and the degrees of freedom."
            answer: "b = 3/2; df = 12"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "b"}, {"contract": {"kind": "exact"}, "name": "df"}]}
            solution_sketch: "Step 1: Rearrange the slope $t$ statistic to $b = t \\cdot \\operatorname{SE}_b$. Step 2: Substitute $t = 2.5$ and $\\operatorname{SE}_b = 0.6$: $b = 2.5 \\cdot 0.6 = 1.5 = 3/2$. Step 3: The degrees of freedom are $df = n - 2 = 14 - 2 = 12$. Thus b = 3/2; df = 12."
          - problem: "A regression on $n = 20$ points gives $b = 2$ and $t = 4$ for the slope. Find the standard error of the slope as a fraction and the degrees of freedom."
            answer: "seb = 1/2; df = 18"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "seb"}, {"contract": {"kind": "exact"}, "name": "df"}]}
            solution_sketch: "Step 1: Rearrange the slope $t$ statistic to $\\operatorname{SE}_b = b / t$. Step 2: Substitute $b = 2$ and $t = 4$: $\\operatorname{SE}_b = 2 / 4 = 1/2$. Step 3: The degrees of freedom are $df = n - 2 = 20 - 2 = 18$. Thus seb = 1/2; df = 18."
          - problem: "An experiment with $n = 11$ data points estimates a slope $b = -0.6$ with standard error $\\operatorname{SE}_b = 1.2$. Compute the $t$ statistic for the slope and the degrees of freedom."
            answer: "t = -1/2; df = 9"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "t"}, {"contract": {"kind": "exact"}, "name": "df"}]}
            solution_sketch: "Step 1: Use the slope $t$ statistic $t = b / \\operatorname{SE}_b$. Step 2: Substitute $b = -0.6$ and $\\operatorname{SE}_b = 1.2$: $t = -0.6 / 1.2 = -0.5 = -1/2$. Step 3: The degrees of freedom are $df = n - 2 = 11 - 2 = 9$. Thus t = -1/2; df = 9."
        constraints: "b / SE_b comes out to halves or whole numbers; df = n - 2 asked explicitly"
      - id: kp3
        name: "Test and confidence interval for the slope"
        key_prerequisites: [one-sample-t-test, least-squares-line]
        exemplars:
          - problem: "A study of weekly exercise hours (x) and resting heart rate (y) uses n = 17 observations. The fitted slope is b = 2.4 with SE_b = 0.8; t* = 2.131 for df = 15 at alpha = 0.05. Test H0: beta = 0 and state the verdict and the t statistic."
            answer: "verdict = reject; t = 3"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["reject"], ["retain"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "t"}]}
            solution_sketch: "Step 1: compute the slope t statistic with t = b / SE_b = 2.4 / 0.8 = 3. Step 2: compare with the supplied critical value t* = 2.131; since 3 > 2.131, reject H0. The option retain is wrong because it fails to reject despite |t| exceeding t*. So verdict = reject; t = 3."
          - problem: "For a regression of plant growth (y) on light exposure (x), n = 17, b = 2.4, SE_b = 0.8, and t* = 2.131 for df = 15. Give the 95% confidence interval for the slope as (low, high), with endpoints to 3 decimals."
            answer: "(0.695, 4.105)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "Step 1: margin of error = t* SE_b = 2.131 * 0.8 = 1.7048. Step 2: interval = b plus or minus margin = 2.4 plus or minus 1.7048, giving lower 0.6952 and upper 4.1048. Step 3: round each endpoint to 3 decimals, so the interval is (0.695, 4.105)."
          - problem: "A regression of daily temperature (y) on altitude (x) uses n = 12 observations. The slope is b = -1.8 with SE_b = 0.6; t* = 2.228 for df = 10. Test H0: beta = 0. Find the t statistic."
            answer: "-3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: use the slope t statistic t = b / SE_b. Step 2: substitute b = -1.8 and SE_b = 0.6, so t = -1.8 / 0.6 = -3. The t statistic is -3."
          - problem: "In a regression with n = 27, the slope estimate is b = 0.75 and SE_b = 0.2; t* = 2.060 for df = 25. Give the 95% confidence interval for the slope as (low, high), with endpoints to 3 decimals."
            answer: "(0.338, 1.162)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "Step 1: margin = t* SE_b = 2.060 * 0.2 = 0.412. Step 2: interval = 0.75 plus or minus 0.412 = (0.338, 1.162). Step 3: the endpoints already show 3 decimals, so the interval is (0.338, 1.162)."
          - problem: "A regression of sales (y) on price (x) over n = 10 stores gives b = -1.4 and SE_b = 0.5; t* = 2.306 for df = 8 at alpha = 0.05. Test H0: beta = 0. State the verdict and the t statistic."
            answer: "verdict = reject; t = -2.8"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["reject"], ["retain"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "t"}]}
            solution_sketch: "Step 1: t = b / SE_b = -1.4 / 0.5 = -2.8. Step 2: compare |t| = 2.8 with t* = 2.306; since 2.8 > 2.306, reject H0. The option retain is wrong because it would ignore that the absolute t statistic exceeds the critical value. So verdict = reject; t = -2.8."
          - problem: "A regression of test score (y) on study time (x) has n = 14 observations, SE_b = 0.25, and t* = 2.2 for df = 12. Find the margin of error t* SE_b."
            answer: "0.55"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: the margin of error for the slope interval is t* SE_b. Step 2: multiply 2.2 by 0.25 to get 0.55. The margin of error is 0.55."
        constraints: "t* supplied with df = n - 2; CI endpoints to 3 decimals; when both test and CI appear, their agreement is stated"
    diagnostic_exemplar:
      problem: 'A regression of daily heating cost in EUR ($y$) on outdoor temperature in °C ($x$) over $n = 22$ days gives $b = -2.5$ with $\operatorname{SE}_b = 1.0$; $t^* = 2.086$ (df $20$, $\alpha = 0.05$). Test $H_0: \beta = 0$ and conclude in context.'
      answer: '$t = -2.5$ and $|-2.5| > 2.086$: reject $H_0$ — evidence of a real linear relationship, with cost falling by about $2.5$ EUR per additional degree.'
      solution_sketch: 'The slope test is an ordinary t-test: $t = (b - 0)/\operatorname{SE}_b$ against the supplied $t^* = 2.086$ on $n - 2 = 20$ df. Rejecting says the slope is distinguishable from zero; state it in EUR per degree.'
    anki_seeds:
      - front: '"No linear relationship" as a hypothesis?'
        back: '$H_0: \beta = 0$, about the population slope.'
        type: basic
      - front: 't statistic for a regression slope?'
        back: '$t = b / \operatorname{SE}_b$ with $n - 2$ degrees of freedom.'
        type: basic
      - front: '$95\%$ confidence interval for the slope?'
        back: '$b \pm t^* \operatorname{SE}_b$ (df $= n - 2$).'
        type: basic
