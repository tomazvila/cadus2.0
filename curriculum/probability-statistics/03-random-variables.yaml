          - problem: 'Lena says that for a spinner with red probability $1/5$, the probability that the first red comes on the second spin is $4/5 + 1/5 = 1$. What is the correct probability?'
            answer: '4/25'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Both events must happen in order, so the probabilities are multiplied and not added. The first spin must not be red, with probability $4/5$. The second must be red, with probability $1/5$, so the answer is $4/25$.'
