unit: random-variables
course: probability-statistics
module: "Random Variables & Distributions"
topics:
  - id: discrete-probability-distributions
    name: "Discrete Probability Distributions"
    core: true
    difficulty: 0.4
    drill: false
    answer_kind: numeric
    expected_time_secs: 120
    prerequisites:
      - id: basic-probability
        weight: 0.7
        key: true
      - id: decimal-operations
        weight: 0.3
        key: false
    knowledge_points:
      - id: kp1
        name: "Random variables and their tables"
        key_prerequisites: [basic-probability]
        exemplars:
          - problem: 'Let $X$ be the number of heads in two flips of a fair coin. Give the probability distribution of $X$ as the ordered triple $(P(X=0), P(X=1), P(X=2))$, using exact fractions.'
            answer: '$(1/4, 1/2, 1/4)$'
            solution_sketch: 'Outcomes $TT, TH, HT, HH$ are equally likely; count heads in each.'
          - problem: '$X$ is the value of one roll of a fair die. Find $P(X = 3)$.'
            answer: "1/6"
            solution_sketch: 'Each face is equally likely: $1/6$.'
          - problem: '$X$ is the number of heads in two flips of a fair coin. Find $P(X = 1)$.'
            answer: "1/2"
            solution_sketch: 'Outcomes $TH, HT$ give one head: $2/4 = 1/2$.'
          - problem: '$X$ is the number of tails in three flips of a fair coin. Find $P(X = 2)$.'
            answer: "3/8"
            solution_sketch: 'Outcomes $TTH, THT, HTT$ give two tails: $3/8$.'
          - problem: '$X$ is the number of heads in four flips of a fair coin. Find $P(X = 4)$.'
            answer: "1/16"
            solution_sketch: 'Only $HHHH$ gives four heads: $1/16$.'
          - problem: "X is the number of sixes in three rolls of a fair six-sided die. Find P(X = 1) as an exact fraction."
            answer: "25/72"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full distribution of X has values 0, 1, 2, 3 with probabilities 125/216, 75/216, 15/216, and 1/216. Step 1 uses the multiplication rule for independent rolls: one specified roll is a six and the other two are not sixes, giving (1/6)(5/6)^2 = 25/216. Step 2 uses counting the three possible positions of the six: multiply by 3 to get 3(25/216) = 75/216. Simplified, P(X = 1) = 25/72."
        constraints: "random variables built from coins, dice, or draws; 3-4 values; exact fractions"
      - id: kp2
        name: "Validity and missing probabilities"
        key_prerequisites: [decimal-operations]
        exemplars:
          - problem: '$X$ takes values $1, 2, 3$ with $P(X=1) = 0.2$ and $P(X=2) = 0.5$. Find $P(X=3)$.'
            answer: "0.3"
            solution_sketch: 'Probabilities sum to $1$: $1 - 0.2 - 0.5 = 0.3$.'
          - problem: 'A proposed distribution has $P(X=0) = 1/2$, $P(X=1) = 1/3$, $P(X=2) = 1/4$. Find the total of these three probabilities (a valid distribution totals exactly $1$).'
            answer: "13/12"
            solution_sketch: '$\frac{1}{2} + \frac{1}{3} + \frac{1}{4} = \frac{6+4+3}{12} = \frac{13}{12} \neq 1$, so the proposed distribution is not valid.'
          - problem: '$X$ takes values $0, 1, 2$ with $P(X=0) = 0.25$ and $P(X=2) = 0.5$. Find $P(X=1)$.'
            answer: "0.25"
            solution_sketch: 'Probabilities sum to $1$: $1 - 0.25 - 0.5 = 0.25$.'
          - problem: 'A proposed distribution has $P(X=0) = 1/6$, $P(X=1) = 1/3$, $P(X=2) = 1/2$. Find the total of these probabilities (a valid distribution totals exactly $1$).'
            answer: "1"
            solution_sketch: '$\frac{1}{6} + \frac{1}{3} + \frac{1}{2} = \frac{1+2+3}{6} = 1$, so the distribution is valid.'
          - problem: "A random variable X takes the four values 1, 2, 3 and 4. A table gives P(X = 1) = 0.2, P(X = 2) = 0.3 and P(X = 3) = 0.1. Find P(X = 4)."
            answer: "0.4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Rule: the probabilities of a discrete distribution must sum to exactly 1. The three given probabilities add up: 0.2 + 0.3 + 0.1 = 0.6. Subtract this from 1 to get the missing probability: 1 - 0.6 = 0.4. So P(X = 4) = 0.4."
          - problem: "A student proposes a distribution with P(X = 0) = 0.2, P(X = 1) = 0.5 and P(X = 2) = 0.4. Determine whether this is a probability distribution, and give the total of the three probabilities."
            answer: "verdict = invalid; total = 1.1"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["valid"], ["invalid"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "total"}]}
            solution_sketch: "Rule: a discrete probability distribution must have its probabilities sum to exactly 1. Add the three proposed values: 0.2 + 0.5 + 0.4 = 1.1. Since 1.1 is not 1, the proposed table is not a distribution, so a solver who answers valid has made a slip in the addition. The verdict is invalid and the total is 1.1, that is, verdict = invalid; total = 1.1."
        constraints: "3-4 values; one missing probability or a validity check; probabilities as fractions or one-decimal values"
      - id: kp3
        name: "Event probabilities from a table"
        key_prerequisites: [basic-probability]
        exemplars:
          - problem: '$X$ takes values $1, 2, 3$ with probabilities $1/6, 1/3, 1/2$. Find $P(X \ge 2)$.'
            answer: "5/6"
            solution_sketch: '$P(X=2) + P(X=3) = \frac{1}{3} + \frac{1}{2} = \frac{5}{6}$.'
          - problem: '$X$ is the number of heads in two flips of a fair coin. Find $P(X \le 1)$.'
            answer: "3/4"
            solution_sketch: '$\frac{1}{4} + \frac{1}{2} = \frac{3}{4}$, or $1 - P(X=2) = 1 - \frac{1}{4}$.'
          - problem: '$X$ takes values $1, 2, 3$ with probabilities $1/4, 1/2, 1/4$. Find $P(X \ge 2)$.'
            answer: "3/4"
            solution_sketch: '$P(X=2) + P(X=3) = \frac{1}{2} + \frac{1}{4} = \frac{3}{4}$.'
          - problem: '$X$ takes values $0, 1, 2, 3$ with probabilities $1/8, 3/8, 3/8, 1/8$. Find $P(X \le 2)$.'
            answer: "7/8"
            solution_sketch: '$\frac{1}{8} + \frac{3}{8} + \frac{3}{8} = \frac{7}{8}$, or $1 - \frac{1}{8}$.'
          - problem: "A random variable X takes values -1, 0, 1 and 2, with probabilities 1/10, 3/10, 2/5 and 1/5. Find P(-1 <= X <= 1) as a fraction."
            answer: "4/5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The distribution is P(X=-1)=1/10, P(X=0)=3/10, P(X=1)=2/5 and P(X=2)=1/5. By the addition rule for disjoint values, add the probabilities of the listed values in the event. The event -1 <= X <= 1 covers the values -1, 0 and 1, so add 1/10 + 3/10 + 2/5 = 1/10 + 3/10 + 4/10 = 8/10. Reduce 8/10 = 4/5. The final probability is 4/5."
          - problem: "A spinner can land on values 1, 2, 3 and 4, with probabilities 1/12, 1/4, 1/3 and 1/3. Find P(X <= 2) as a fraction."
            answer: "1/3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The distribution is P(X=1)=1/12, P(X=2)=1/4, P(X=3)=1/3 and P(X=4)=1/3. By the addition rule for disjoint values, add the probabilities of the listed values in the event. The event X <= 2 covers the values 1 and 2, so add 1/12 + 1/4 = 1/12 + 3/12 = 4/12. Reduce 4/12 = 1/3. The final probability is 1/3."
        constraints: "inequalities over 3-4 listed values; sums of at most 3 fractions"
    diagnostic_exemplar:
      problem: '$X$ takes values $1, 2, 3$ with $P(X=1) = 1/4$ and $P(X=2) = 2/5$. Give $(P(X=3), P(X \ge 2))$ as an ordered pair.'
      answer: '$(7/20, 3/4)$'
      solution_sketch: '$P(X=3) = 1 - 1/4 - 2/5 = 7/20$; $P(X \ge 2) = 2/5 + 7/20 = 3/4$.'
    anki_seeds:
      - front: 'The probabilities in a valid distribution must each be in $[0,1]$ and must sum to {{c1::1}}.'
        back: '1'
        type: cloze
      - front: 'A random variable is...'
        back: 'A numerical quantity whose value depends on the outcome of a random experiment.'
        type: basic

  - id: discrete-random-variables
    name: "Discrete Random Variables & Expected Value"
    core: true
    difficulty: 0.45
    drill: false
    answer_kind: numeric
    expected_time_secs: 150
    prerequisites:
      - id: discrete-probability-distributions
        weight: 0.8
        key: true
      - id: summation-notation
        weight: 0.5
        key: true
      - id: decimal-operations
        weight: 0.3
        key: false
    knowledge_points:
      - id: kp1
        name: "Expected value"
        key_prerequisites: [discrete-probability-distributions, summation-notation]
        exemplars:
          - problem: '$X$ takes values $0, 1, 2$ with probabilities $1/4, 1/2, 1/4$. Find $E[X]$.'
            answer: "1"
            solution_sketch: '$0 \cdot \frac{1}{4} + 1 \cdot \frac{1}{2} + 2 \cdot \frac{1}{4} = 0 + \frac{1}{2} + \frac{1}{2} = 1$.'
          - problem: 'Find the expected value of one roll of a fair six-sided die.'
            answer: "3.5"
            solution_sketch: '$\frac{1+2+3+4+5+6}{6} = \frac{21}{6} = 3.5$.'
          - problem: 'A game pays €10 with probability $1/5$ and nothing otherwise. Find the expected payout, in euros.'
            answer: "2"
            solution_sketch: '$10 \cdot \frac{1}{5} + 0 \cdot \frac{4}{5} = 2$.'
          - problem: "$X$ takes values $1, 2, 3, 4$ with probabilities $1/10, 2/10, 3/10, 4/10$. Find $E[X]$."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The distribution lists 1 with probability 1/10, 2 with probability 2/10, 3 with probability 3/10, and 4 with probability 4/10. Use the expected-value rule E[X] = sum of x times P(x). Compute 1(1/10) + 2(2/10) + 3(3/10) + 4(4/10) = 30/10 = 3. So E[X] = 3."
          - problem: "A fair four-sided die has faces numbered $1$ through $4$. Find the expected value of one roll as a fraction."
            answer: "5/2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Each face has probability 1/4 because the die is fair. Use the expected-value rule E[X] = sum of x times P(x). The sum is (1 + 2 + 3 + 4)/4 = 10/4 = 5/2. So the expected value is 5/2."
          - problem: "A game pays $5$ euros with probability $1/4$, $10$ euros with probability $1/4$, and nothing otherwise. Find the expected payout in euros as a fraction."
            answer: "15/4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The payout values are 5, 10, and 0 with probabilities 1/4, 1/4, and 1/2. Use the expected-value rule E[X] = sum of x times P(x). Compute 5(1/4) + 10(1/4) + 0(1/2) = 15/4. So the expected payout is 15/4."
        constraints: "3-6 values; E[X] a clean fraction or ends in .5; payouts in whole euros"
      - id: kp2
        name: "Expected value as a long-run average"
        key_prerequisites: [discrete-probability-distributions]
        exemplars:
          - problem: 'A game pays €5 with probability $1/4$ and €1 with probability $3/4$. Over many plays, what is the average payout per play, in euros?'
            answer: "2"
            solution_sketch: '$5 \cdot \frac{1}{4} + 1 \cdot \frac{3}{4} = \frac{5}{4} + \frac{3}{4} = 2$ — the long-run average is $E[X]$.'
          - problem: 'A fair coin is flipped once; let $X = 1$ for heads and $X = 0$ for tails. Find $E[X]$ — a value $X$ itself never takes.'
            answer: "1/2"
            solution_sketch: '$1 \cdot \frac{1}{2} + 0 \cdot \frac{1}{2} = \frac{1}{2}$; the long-run average need not be an attainable value.'
          - problem: "A fair six-sided die is rolled many times, and X is the number on the top face. Find the long-run average value of X as a fraction."
            answer: "7/2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The distribution puts probability 1/6 on each value 1, 2, 3, 4, 5, 6. Step 1, expected value rule: multiply each value by its probability, giving 1/6, 2/6, 3/6, 4/6, 5/6, 6/6. Step 2, add the products to get 21/6. Simplify 21/6 to 7/2, the long-run average. The answer is 7/2."
          - problem: "A fair coin is flipped three times, and X counts the number of heads. Find the average number of heads over many such three-flip trials as a fraction."
            answer: "3/2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The possible counts are 0, 1, 2, 3 heads with probabilities 1/8, 3/8, 3/8, 1/8. Step 1, expected value rule: multiply each count by its probability, giving 0, 3/8, 6/8, 3/8. Step 2, add the products to get 12/8. Simplify 12/8 to 3/2, the long-run average. The answer is 3/2."
          - problem: "A carnival wheel pays 0 euros with probability 0.5, 5 euros with probability 0.3 and 20 euros with probability 0.2. Give the average payout over many spins in euros to 1 decimal."
            answer: "5.5"
            answer_contract: {"decimals": 1, "kind": "approx"}
            solution_sketch: "The payout distribution is 0 with probability 0.5, 5 with probability 0.3 and 20 with probability 0.2. Step 1, expected value rule: multiply each payout by its probability, giving 0, 1.5 and 4. Step 2, add the products to get 5.5. The answer is 5.5."
          - problem: "A raffle sells 200 tickets; one ticket wins a prize of 80 dollars and all other tickets win nothing. Find the average winnings per ticket over many raffles as a fraction."
            answer: "2/5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The prize is 80 dollars with probability 1/200 and 0 dollars with probability 199/200. Step 1, expected value rule: multiply each amount by its probability, giving 80/200 and 0. Step 2, add the products to get 80/200. Simplify 80/200 to 2/5, the long-run average. The answer is 2/5."
        constraints: "one computation phrased as a long-run average, one where E[X] is not an attainable value"
      - id: kp3
        name: "Linearity: E[aX + b]"
        key_prerequisites: [summation-notation]
        exemplars:
          - problem: 'Given $E[X] = 4$, find $E[3X - 2]$.'
            answer: "10"
            solution_sketch: '$E[aX+b] = aE[X] + b = 3 \cdot 4 - 2 = 10$.'
          - problem: 'A raffle ticket costs €2 and its prize $W$ (in euros) has $E[W] = 0.50$. Find the expected net gain from buying one ticket, in euros.'
            answer: "-1.50"
            solution_sketch: 'Net $= W - 2$, so $E[W - 2] = 0.5 - 2 = -1.5$ euros.'
          - problem: "Given E[X] = 6, find E[4X - 5]."
            answer: "19"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The linearity rule is E[aX + b] = a E[X] + b. Substitute a = 4, b = -5, and E[X] = 6: E[4X - 5] = 4(6) - 5 = 24 - 5 = 19. The answer is 19."
          - problem: "A game costs 3 dollars to play. The winnings W, in dollars, have E[W] = 1.25. Find the expected net gain in dollars. Give the answer as a decimal to 2 decimal places."
            answer: "-1.75"
            answer_contract: {"decimals": 2, "kind": "approx"}
            solution_sketch: "Net gain is W - 3, so use E[aX + b] with a = 1 and b = -3. Then E[W - 3] = E[W] - 3 = 1.25 - 3 = -1.75. The expected net gain is -1.75 dollars."
          - problem: "Suppose E[5X + 1] = 26. Find E[X]."
            answer: "5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "By linearity E[5X + 1] = 5 E[X] + 1. Set this equal to 26: 5 E[X] + 1 = 26, so 5 E[X] = 25 and E[X] = 5. The value of E[X] is 5."
          - problem: "The number of customers X at a shop has E[X] = 2.1. The daily revenue in dollars is 10X + 7. Find the expected daily revenue in dollars. Give the answer as a decimal to 2 decimal places."
            answer: "28.00"
            answer_contract: {"decimals": 2, "kind": "approx"}
            solution_sketch: "The revenue is a linear function of X, so use E[aX + b] = a E[X] + b. Substitute a = 10, b = 7, and E[X] = 2.1: E[10X + 7] = 10(2.1) + 7 = 21 + 7 = 28. The expected daily revenue is 28.00 dollars."
        constraints: "a, b small integers; money answers to the cent"
    diagnostic_exemplar:
      problem: '$X$ takes values $0, 1, 2$ with probabilities $1/6, 1/2, 1/3$. Find $E[3X + 2]$.'
      answer: '11/2'
      solution_sketch: '$E[X] = 0 + 1/2 + 2/3 = 7/6$; $E[3X + 2] = 3 \cdot 7/6 + 2 = 11/2$.'
    anki_seeds:
      - front: 'Expected value of a discrete random variable?'
        back: '$E[X] = \sum x_i \, p_i$ — each value weighted by its probability.'
        type: basic
      - front: 'Linearity of expectation: $E[aX + b] =$ ?'
        back: '$aE[X] + b$.'
        type: basic

  - id: expected-value-applications
    name: "Expected Value Applications"
    core: false                # applications leaf topic
    difficulty: 0.5
    drill: false
    answer_kind: numeric
    expected_time_secs: 180
    prerequisites:
      - id: discrete-random-variables
        weight: 0.8
        key: true
    knowledge_points:
      - id: kp1
        name: "Fair games and fair prices"
        key_prerequisites: [discrete-random-variables]
        exemplars:
          - problem: 'A game costs €2 to play and pays €10 with probability $1/5$. Find the expected net gain, in euros (a value of $0$ means the game is fair).'
            answer: "0"
            solution_sketch: '$10 \cdot \frac{1}{5} - 2 = 2 - 2 = 0$; a fair game has expected net gain $0$.'
          - problem: 'You roll a fair die and win that many euros. What entry price, in euros, makes the game fair?'
            answer: "3.50"
            solution_sketch: 'Fair price $= E[\text{payout}] = 3.5$.'
          - problem: "A raffle ticket pays EUR 6 with probability 0.2 and EUR 3 with probability 0.4, and nothing with probability 0.4. Find the fair price of the ticket in euros, and give the answer to 2 decimals."
            answer: "2.40"
            answer_contract: {"decimals": 2, "kind": "approx"}
            solution_sketch: "List the full payout table: EUR 6 at probability 0.2, EUR 3 at probability 0.4, and EUR 0 at probability 0.4. Apply the expected value rule and multiply each payout by its probability: 6 * 0.2 = 1.2 and 3 * 0.4 = 1.2. Add the products, since the fair price equals the expected payout: the fair price is 2.40."
          - problem: "A game costs EUR 5 to play and pays EUR 20 with probability 1/2, and nothing otherwise. Find the expected net gain in euros."
            answer: "5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Write the payout table: EUR 20 with probability 1/2 and EUR 0 with probability 1/2. The expected value rule gives the expected payout 20 * (1/2) = 10. Subtract the EUR 5 entry cost from the expected payout, so the expected net gain is 5."
          - problem: "A game pays EUR y with probability 1/5 and EUR 6 with probability 1/2, and nothing otherwise. Its fair price is EUR 5. Find y in euros."
            answer: "10"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The fair price rule sets the price equal to the expected payout: 5 = y * (1/5) + 6 * (1/2). Compute the known term by the expected value rule: 6 * (1/2) = 3, so 5 = y/5 + 3. Solve the linear equation: y/5 = 2, and the unknown payout is 10."
          - problem: "A lottery ticket pays EUR 15 with probability 1/6 and EUR 6 with probability 1/3, and nothing otherwise. Find the fair price of the ticket in euros, and give the answer to 2 decimals."
            answer: "4.50"
            answer_contract: {"decimals": 2, "kind": "approx"}
            solution_sketch: "List the payout table: EUR 15 at probability 1/6, EUR 6 at probability 1/3, and EUR 0 at probability 1/2. Use the expected value rule and add the products: 15 * (1/6) = 2.5 and 6 * (1/3) = 2, giving an expected payout of 4.5. By the fair price rule the ticket price is the expected payout, so the fair price is 4.50."
        constraints: "payouts in whole euros; fair price is E[payout]; answers are bare euro amounts, to the cent"
      - id: kp2
        name: "Insurance and warranties"
        key_prerequisites: [discrete-random-variables]
        exemplars:
          - problem: 'An insurer charges €50 for a policy that pays €1000 with probability $1/25$. Find the insurer''s expected profit per policy, in euros.'
            answer: "10"
            solution_sketch: '$50 - 1000 \cdot \frac{1}{25} = 50 - 40 = 10$.'
          - problem: 'A €20 warranty pays for a €300 replacement with probability $1/20$. Find the seller''s expected profit per warranty, in euros.'
            answer: "5"
            solution_sketch: '$20 - 300 \cdot \frac{1}{20} = 20 - 15 = 5$.'
        constraints: "claim probabilities are unit fractions; expected payouts come out to whole euros; answers are bare euro amounts"
      - id: kp3
        name: "Comparing options by expected value"
        key_prerequisites: [discrete-random-variables]
        exemplars:
          - problem: 'Option A: a sure €4. Option B: €12 with probability $2/5$, else nothing. Find the expected value of the better option, in euros.'
            answer: "4.80"
            solution_sketch: 'Compare $4$ with $12 \cdot \frac{2}{5} = \frac{24}{5} = 4.8$; option B is better.'
          - problem: 'A raffle sells $200$ tickets at €1 each for one €150 prize. Find the expected net gain per ticket, in euros.'
            answer: "-0.25"
            solution_sketch: '$\frac{150}{200} - 1 = \frac{3}{4} - 1 = -\frac{1}{4}$ euros.'
          - problem: "Option A pays a sure 7 euros. Option B pays 20 euros with probability 2/5, and pays nothing otherwise. Find the expected value of the better option, in euros."
            answer: "8"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Rule: the expected value of an option is the sum of each payout times its probability. Option A has EV = 7. Option B has EV = 20 * (2/5) = 8. Option B is better, so the expected value of the better option is 8."
          - problem: "A raffle sells 500 tickets at 2 euros each for one 400 euro prize. Find the expected net gain per ticket, in euros. Give the answer to 1 decimal."
            answer: "-1.2"
            answer_contract: {"decimals": 1, "kind": "approx"}
            solution_sketch: "Rule: expected net gain per ticket = expected prize minus ticket cost. Expected prize = 400/500 = 0.8 euros. Net gain = 0.8 - 2 = -1.2 euros. The expected net gain per ticket is -1.2."
          - problem: "A game costs 5 euros to play. You win X euros with probability 1/4, and win nothing otherwise. The expected net gain is 1 euro. Find the value of X."
            answer: "24"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Rule: expected net gain = (X * 1/4) - 5. Set the net gain equal to 1: X/4 - 5 = 1. Add 5: X/4 = 6. Multiply by 4: X = 24. The value of X is 24."
          - problem: "Option A pays 11 euros with probability 1/2, and pays 2 euros otherwise. Option B pays a sure 6 euros. Find the expected value of the better option, in euros. Give the answer to 1 decimal."
            answer: "6.5"
            answer_contract: {"decimals": 1, "kind": "approx"}
            solution_sketch: "Rule: expected value = sum of each payout times its probability. Option A EV = 11*(1/2) + 2*(1/2) = 5.5 + 1 = 6.5. Option B EV = 6. Option A is better, so the better expected value is 6.5."
        constraints: "two options or one net-gain computation; expected values differ or land on clean cents"
    diagnostic_exemplar:
      problem: 'A game costs €3 to play; you win €12 with probability $1/6$ and nothing otherwise. Find the expected net gain, in euros.'
      answer: "-1"
      solution_sketch: '$12 \cdot \frac{1}{6} - 3 = 2 - 3 = -1$ euro.'
    anki_seeds:
      - front: 'A game is fair when...'
        back: 'The expected net gain is $0$.'
        type: basic
      - front: 'Insurer''s expected profit per policy $=$ ?'
        back: 'Premium $-$ expected payout.'
        type: basic

  - id: law-of-large-numbers
    name: "The Law of Large Numbers"
    core: false                # stated theorem; nothing builds on it
    difficulty: 0.45
    drill: false
    answer_kind: numeric
    expected_time_secs: 120
    prerequisites:
      - id: discrete-random-variables
        weight: 0.7
        key: true
      - id: experimental-theoretical-probability
        weight: 0.4
        key: false
    knowledge_points:
      - id: kp1
        name: "What the law says"
        key_prerequisites: [discrete-random-variables, experimental-theoretical-probability]
        exemplars:
          - problem: 'As the number of flips of a fair coin grows very large, what value does the proportion of heads approach?'
            answer: "1/2"
            solution_sketch: 'The law of large numbers: relative frequency approaches the true probability.'
          - problem: 'As the number of rolls of a fair die grows very large, what value does the average of the rolls approach?'
            answer: "3.5"
            solution_sketch: 'The sample mean approaches $E[X] = 3.5$.'
          - problem: "A biased coin lands heads with probability 0.6. As the number of tosses grows very large, what value does the proportion of heads approach? Give the answer as a fraction."
            answer: "3/5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: The law of large numbers says the long-run proportion of heads equals the probability of heads on one toss. Step 2: The given probability is 0.6, and 0.6 equals the fraction 3/5. Step 3: Therefore the limiting proportion is 3/5."
          - problem: "A spinner has four equally likely outcomes: 1, 3, 5, 7. As the number of spins grows very large, what value does the average of the outcomes approach? Give the answer as an integer."
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: The law of large numbers says the long-run average of outcomes equals the expected value of one spin. Step 2: The expected value is (1 + 3 + 5 + 7)/4 = 16/4 = 4. Step 3: Therefore the limiting average is 4."
          - problem: "An urn contains 3 red balls and 7 blue balls. Balls are drawn with replacement. As the number of draws grows very large, what value does the proportion of red draws approach? Give the answer as a fraction."
            answer: "3/10"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: The law of large numbers says the long-run proportion of red draws equals the probability of red on one draw. Step 2: The probability is 3 red balls out of 10 balls, so it is 3/10. Step 3: Therefore the limiting proportion is 3/10."
          - problem: "A game pays 12 dollars with probability 1/4 and 0 dollars otherwise. As the number of plays grows very large, what value does the average payout per play approach? Give the answer as an integer."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: The law of large numbers says the long-run average payout per play equals the expected payout of one play. Step 2: The expected payout is 12*(1/4) + 0*(3/4) = 3. Step 3: Therefore the limiting average payout is 3."
        constraints: "long-run limits equal the probability or the expected value; exact answers"
      - id: kp2
        name: "What the law does not say"
        key_prerequisites: [discrete-random-variables]
        exemplars:
          - problem: 'A fair coin lands heads $5$ times in a row. Find $P(\text{heads on the next flip})$.'
            answer: "1/2"
            solution_sketch: 'Flips are independent; past results do not change the next flip.'
          - problem: 'A game is won with probability $1/3$ on each independent play. After four straight losses, find the probability of winning the next play.'
            answer: "1/3"
            solution_sketch: 'Independent trials have no memory; a win is never "due" — that is the gambler''s fallacy.'
          - problem: "A fair six-sided die is rolled ten times and no 3 appears. Give the probability that the next roll is a 3 as a fraction."
            answer: "1/6"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Use independence: a fair die has six equally likely outcomes on every roll, and past rolls do not affect the next one. The streak of ten rolls without a 3 does not change the next roll. The probability is 1/6."
          - problem: "A biased coin has probability 0.7 of landing heads. It lands tails six times in a row. Give the probability of heads on the next flip as a fraction."
            answer: "7/10"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Use independence: the coin has no memory, so six tails in a row do not change its chance of heads. The given probability 0.7 is the same on the next flip, and 0.7 equals 7/10. The answer is 7/10."
          - problem: "A spinner has four equal sectors: red, blue, green, and yellow. It lands on red seven times in a row. Give the probability that the next spin lands on blue as a fraction."
            answer: "1/4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Use independence: each spin has the same four equal sectors, and a streak of red does not make blue more likely. One of the four equal sectors is blue, so the probability is 1/4. The answer is 1/4."
          - problem: "A bag contains 5 red marbles and 3 blue marbles. A marble is drawn, its color is noted, and it is put back. Seven draws in a row are red. Give the probability that the next draw is blue as a fraction."
            answer: "3/8"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Use independence: the marble is put back after each draw, so the bag is unchanged and the draws do not affect each other. There are 3 blue marbles out of 5 + 3 = 8 marbles, so the probability is 3/8. The answer is 3/8."
        constraints: "streak setups; the correct answer ignores the streak"
      - id: kp3
        name: "Long-run predictions"
        key_prerequisites: [discrete-random-variables]
        exemplars:
          - problem: 'A fair die is rolled $600$ times. About how many $6$s should be expected?'
            answer: "100"
            solution_sketch: '$600 \cdot \frac{1}{6} = 100$; the actual count will be near, not exactly, $100$.'
          - problem: 'A casino game has an expected player loss of €0.50 per play. About how much, in euros, does the casino expect to gain over $1000$ plays?'
            answer: "500"
            solution_sketch: '$1000 \cdot 0.50 = 500$ euros — reliable because of the law of large numbers.'
          - problem: "A biased coin lands heads with probability 0.35 on each flip. About how many heads should be expected in 400 independent flips?"
            answer: "140"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full object is 400 flips with heads probability 0.35. The long-run prediction multiplies trials by probability: 400 * 0.35 = 140. By the law of large numbers, the expected number of heads is 140."
          - problem: "A spinner lands on red with probability 0.375 on each spin. About how many red results should be expected in 240 independent spins?"
            answer: "90"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full object is 240 spins with red probability 3/8. Multiply the number of spins by the probability: 240 * 0.375 = 90. The law of large numbers gives the long-run expected count, so the answer is 90."
          - problem: "A raffle ticket has an expected payout of 2.50 dollars per ticket. About how many dollars should 480 tickets pay out in total?"
            answer: "1200"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full object is 480 tickets with expected payout 2.50 dollars per ticket. The expected total is 480 * 2.50 = 1200 dollars. The law of large numbers supports this long-run prediction, so the answer is 1200."
          - problem: "In 900 independent plays of a game, about 270 wins are expected. Find the probability of a win on one play as a fraction."
            answer: "3/10"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full object is 900 plays with an expected total of 270 wins. The long-run prediction sets 900 * p = 270. Divide: p = 270/900 = 3/10, so the probability of a win on one play is 3/10."
        constraints: "n times the probability or expected value is a whole number of units"
    diagnostic_exemplar:
      problem: 'A game is won with probability $\frac{1}{3}$ on each independent play. After four straight losses, about how many wins should be expected in the next $600$ plays?'
      answer: '200'
      solution_sketch: 'The plays are independent, so the losing streak changes nothing: the long-run rate is still $\frac{1}{3}$, and $600 \cdot \frac{1}{3} = 200$.'
    anki_seeds:
      - front: 'Law of large numbers (informal)?'
        back: 'As the number of independent trials grows, the sample proportion (and sample mean) approaches the true probability (expected value).'
        type: basic
      - front: 'Does a streak of heads make tails more likely next flip?'
        back: 'No — trials are independent; expecting a correction is the gambler''s fallacy.'
        type: basic

  - id: variance-random-variables
    name: "Variance of Random Variables"
    core: true
    difficulty: 0.5
    drill: false
    answer_kind: numeric
    expected_time_secs: 180
    prerequisites:
      - id: discrete-random-variables
        weight: 0.8
        key: true
      - id: variance-standard-deviation
        weight: 0.5
        key: false
    knowledge_points:
      - id: kp1
        name: "Variance from the definition"
        key_prerequisites: [discrete-random-variables, variance-standard-deviation]
        exemplars:
          - problem: '$X$ is $+1$ or $-1$, each with probability $1/2$. Find $\operatorname{Var}(X)$.'
            answer: "1"
            solution_sketch: '$\mu = 0$; $(X - \mu)^2 = 1$ always, so $\operatorname{Var}(X) = 1$.'
          - problem: '$X$ is $0$ or $2$, each with probability $1/2$. Find $\operatorname{Var}(X)$.'
            answer: "1"
            solution_sketch: '$\mu = 1$; squared deviations are both $1$, so the variance is $1$.'
          - problem: "$X$ takes the values $0$, $1$, $2$ with probabilities $1/6$, $2/3$, $1/6$. Give the variance of $X$ as a fraction."
            answer: "1/3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "First compute the mean by the expected-value rule: E(X) = 0*(1/6) + 1*(2/3) + 2*(1/6) = 1. Then use the definition of variance. The squared deviations from this mean are (0-1)^2 = 1, (1-1)^2 = 0, and (2-1)^2 = 1. Weight them by their probabilities: 1*(1/6) + 0*(2/3) + 1*(1/6) = 1/3. The variance is 1/3."
          - problem: "$X$ takes the values $-2$, $0$, $2$ each with probability $1/3$. Give the variance of $X$ as a fraction."
            answer: "8/3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "First find the mean by the expected-value rule: E(X) = (-2)*(1/3) + 0*(1/3) + 2*(1/3) = 0. Then apply the definition of variance. The squared deviations from 0 are (-2-0)^2 = 4, 0^2 = 0, and 2^2 = 4. The weighted average is 4*(1/3) + 0*(1/3) + 4*(1/3) = 8/3. The variance is 8/3."
          - problem: "$X$ takes the values $1$, $2$, $3$ each with probability $1/3$. Give the variance of $X$ as a fraction."
            answer: "2/3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "First compute the mean by the expected-value rule: E(X) = (1 + 2 + 3)/3 = 2. Then use the definition of variance. The squared deviations from 2 are (1-2)^2 = 1, (2-2)^2 = 0, and (3-2)^2 = 1. Their weighted average is (1 + 0 + 1)/3 = 2/3. The variance is 2/3."
          - problem: "A game pays $-1$ with probability $2/5$ and $4$ with probability $3/5$. Find the variance of the payout."
            answer: "6"
            answer_contract: {"kind": "exact"}
            solution_sketch: "First compute the mean payout by the expected-value rule: E(X) = (-1)*(2/5) + 4*(3/5) = 2. Then apply the definition of variance. The squared deviations from 2 are (-1-2)^2 = 9 and (4-2)^2 = 4. Weighted by the probabilities: 9*(2/5) + 4*(3/5) = 18/5 + 12/5 = 6. The variance of the payout is 6."
        constraints: "2-3 values with an easy mean; squared deviations are small integers"
      - id: kp2
        name: "Shortcut: Var(X) = E[X^2] - (E[X])^2"
        key_prerequisites: [discrete-random-variables]
        exemplars:
          - problem: '$X$ is $1$ or $3$, each with probability $1/2$. Compute $\operatorname{Var}(X)$ via $E[X^2] - (E[X])^2$.'
            answer: "1"
            solution_sketch: '$E[X] = 2$, $E[X^2] = \frac{1 + 9}{2} = 5$; $\operatorname{Var}(X) = 5 - 4 = 1$.'
          - problem: 'Find the variance of one roll of a fair six-sided die.'
            answer: "35/12"
            solution_sketch: '$E[X] = \frac{7}{2}$, $E[X^2] = \frac{1+4+9+16+25+36}{6} = \frac{91}{6}$; $\operatorname{Var} = \frac{91}{6} - \frac{49}{4} = \frac{182 - 147}{12} = \frac{35}{12}$.'
          - problem: "$X$ takes the values $0$ and $4$, each with probability $1/2$. Compute $\\operatorname{Var}(X)$ using the shortcut $E[X^2] - (E[X])^2$."
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "First compute the mean by the expected-value formula: $E[X] = (0 + 4)/2 = 2$. Then compute the second moment: $E[X^2] = (0^2 + 4^2)/2 = 8$. The shortcut formula gives $\\operatorname{Var}(X) = 8 - 2^2 = 4$."
          - problem: "$X$ is equally likely to take each of the values $1$, $2$, and $3$. Find $\\operatorname{Var}(X)$ by the shortcut $E[X^2] - (E[X])^2$."
            answer: "2/3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "First compute the mean by the expected-value formula: $E[X] = (1 + 2 + 3)/3 = 2$. Then compute the second moment: $E[X^2] = (1 + 4 + 9)/3 = 14/3$. The shortcut formula gives $\\operatorname{Var}(X) = 14/3 - 4 = 2/3$."
          - problem: "$X$ has distribution $P(X = 1) = 1/4$, $P(X = 2) = 1/2$, and $P(X = 4) = 1/4$. Find $\\operatorname{Var}(X)$ using the shortcut $E[X^2] - (E[X])^2$."
            answer: "19/16"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Compute the mean by the expected-value formula: $E[X] = 1 \\cdot 1/4 + 2 \\cdot 1/2 + 4 \\cdot 1/4 = 9/4$. Compute the second moment: $E[X^2] = 1 \\cdot 1/4 + 4 \\cdot 1/2 + 16 \\cdot 1/4 = 25/4$. Then the shortcut formula gives $\\operatorname{Var}(X) = 25/4 - 81/16 = 19/16$."
          - problem: "$X$ takes value $2$ with probability $1/2$, value $4$ with probability $1/3$, and value $6$ with probability $1/6$. Find $\\operatorname{Var}(X)$ using the shortcut $E[X^2] - (E[X])^2$."
            answer: "20/9"
            answer_contract: {"kind": "exact"}
            solution_sketch: "First compute the mean by the expected-value formula: $E[X] = 2 \\cdot 1/2 + 4 \\cdot 1/3 + 6 \\cdot 1/6 = 10/3$. Then compute the second moment: $E[X^2] = 4 \\cdot 1/2 + 16 \\cdot 1/3 + 36 \\cdot 1/6 = 40/3$. The shortcut formula gives $\\operatorname{Var}(X) = 40/3 - 100/9 = 20/9$."
        constraints: "values <= 6; answers exact fractions; require the shortcut formula"
      - id: kp3
        name: "Standard deviation of a random variable"
        key_prerequisites: [discrete-random-variables, variance-standard-deviation]
        exemplars:
          - problem: '$X$ is $1$ or $5$, each with probability $1/2$. Find $\operatorname{SD}(X)$.'
            answer: "2"
            solution_sketch: '$\mu = 3$; deviations $\pm 2$, so $\operatorname{Var}(X) = 4$ and $\operatorname{SD}(X) = 2$.'
          - problem: '$X$ takes values $0, 1, 2$ with probabilities $1/4, 1/2, 1/4$; $\operatorname{Var}(X) = 1/2$. Find $\operatorname{SD}(X)$, exactly.'
            answer: "sqrt(2)/2"
            solution_sketch: '$\operatorname{SD}(X) = \sqrt{1/2} = \frac{1}{\sqrt{2}} = \frac{\sqrt{2}}{2}$.'
          - problem: "A random variable X takes the values 0 and 6, each with probability 1/2. Find SD(X)."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 uses the mean definition: E(X) = 0(1/2) + 6(1/2) = 3. Step 2 uses the variance formula E(X^2) - (E(X))^2: E(X^2) = 0(1/2) + 36(1/2) = 18, so Var(X) = 18 - 9 = 9. Step 3 uses the rule that standard deviation is the positive square root of variance: SD(X) = sqrt(9) = 3."
          - problem: "A random variable X takes values 0, 2 and 4 with probabilities 1/4, 1/2 and 1/4. Find SD(X) exactly."
            answer: "sqrt(2)"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 uses the mean definition: E(X) = 0(1/4) + 2(1/2) + 4(1/4) = 2. Step 2 uses the variance formula: E(X^2) = 0(1/4) + 4(1/2) + 16(1/4) = 6, so Var(X) = 6 - 4 = 2. Step 3 takes the positive square root: SD(X) = sqrt(2)."
          - problem: "A random variable X has variance Var(X) = 25/4. Find SD(X) exactly as a fraction."
            answer: "5/2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 uses the definition of standard deviation as the positive square root of variance. Var(X) = 25/4, so SD(X) = sqrt(25/4). Step 2 simplifies the radical: sqrt(25)/sqrt(4) = 5/2. The exact standard deviation is 5/2."
          - problem: "A random variable X takes values 0, 3 and 6 with equal probability 1/3. Find SD(X) exactly."
            answer: "sqrt(6)"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 uses the mean definition: E(X) = 0(1/3) + 3(1/3) + 6(1/3) = 3. Step 2 uses the variance formula: E(X^2) = 0(1/3) + 9(1/3) + 36(1/3) = 15, so Var(X) = 15 - 9 = 6. Step 3 takes the positive square root: SD(X) = sqrt(6)."
        constraints: "variances are perfect squares or simple fractions; exact radicals allowed, written as sqrt(...)"
    diagnostic_exemplar:
      problem: '$X$ is $1$ or $4$, each with probability $1/2$. Find $\operatorname{SD}(X)$.'
      answer: '3/2'
      solution_sketch: '$E[X] = 5/2$, $E[X^2] = 17/2$; $\operatorname{Var}(X) = 17/2 - 25/4 = 9/4$; $\operatorname{SD}(X) = 3/2$.'
    anki_seeds:
      - front: 'Variance shortcut formula?'
        back: '$\operatorname{Var}(X) = E[X^2] - (E[X])^2$.'
        type: basic
      - front: '$\operatorname{SD}(X) =$ ? (in terms of variance)'
        back: '$\sqrt{\operatorname{Var}(X)}$.'
        type: basic

  - id: linear-transformations-random-variables
    name: "Linear Transformations of Random Variables"
    core: true
    difficulty: 0.5
    drill: false
    answer_kind: numeric
    expected_time_secs: 120
    prerequisites:
      - id: variance-random-variables
        weight: 0.8
        key: true
    knowledge_points:
      - id: kp1
        name: "Shifts: adding a constant"
        key_prerequisites: [variance-random-variables]
        exemplars:
          - problem: 'Marks $X$ (out of $10$) have mean $7$ and SD $0.8$. Every mark is raised by $1$. Give the new mean and SD as the ordered pair (mean, SD).'
            answer: '$(8, 0.8)$'
            solution_sketch: 'A shift moves the mean by $b$ and leaves the spread unchanged.'
          - problem: 'Given $\operatorname{Var}(X) = 7$, find $\operatorname{Var}(X + 10)$.'
            answer: "7"
          - problem: "A quiz score X has mean 12 and SD 2.5. Every score is increased by 4. Give the new mean and SD as (mean, SD)."
            answer: "(16, 2.5)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "The transformation is X + 4. Rule: a shift adds 4 to the mean, so new mean = 12 + 4 = 16. Rule: a shift leaves the SD unchanged, so new SD = 2.5. The ordered pair is (16, 2.5)."
          - problem: "A random variable X has variance 9. It is shifted down by 6. Find the new variance."
            answer: "9"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The transformation is X - 6. Rule: a shift leaves the variance unchanged. The old variance is 9, so the new variance is 9. The answer is 9."
          - problem: "A shift of -5 is applied to X. The new mean is 10. If Var(X)=3, find the old mean and the new variance as (mean, variance)."
            answer: "(15, 3)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "The transformation is X - 5. Rule: the new mean equals old mean minus 5, so old mean = 10 + 5 = 15. Rule: a shift leaves the variance unchanged, so new variance = 3. The ordered pair is (15, 3)."
          - problem: "X has mean 20 and SD 4. After adding b, the mean becomes 13. Find b and the new SD as (b, SD)."
            answer: "(-7, 4)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "The transformation is X + b. Rule: the new mean is old mean plus b, so 13 = 20 + b, giving b = -7. Rule: a shift leaves the SD unchanged, so new SD = 4. The ordered pair is (-7, 4)."
        constraints: "b in {-10..10}; emphasize that SD and variance are unchanged by shifts"
      - id: kp2
        name: "Scaling: multiplying by a constant"
        key_prerequisites: [variance-random-variables]
        exemplars:
          - problem: 'Given $\operatorname{SD}(X) = 2$, find $\operatorname{SD}(3X)$.'
            answer: "6"
            solution_sketch: 'Standard deviation scales by $|a|$: $3 \cdot 2 = 6$.'
          - problem: 'Given $\operatorname{Var}(X) = 3$, find $\operatorname{Var}(2X)$.'
            answer: "12"
            solution_sketch: 'Variance scales by $a^2$: $4 \cdot 3 = 12$.'
          - problem: "Given SD(X) = 5, find SD(-2X)."
            answer: "10"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The object is SD(-2X). Standard deviation scales by the absolute value of the multiplier, so SD(-2X) = |-2| SD(X) = 2 * 5 = 10. The standard deviation is 10."
          - problem: "Given Var(X) = 4, find Var(-3X)."
            answer: "36"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The object is Var(-3X). Variance scales by the square of the multiplier, so Var(-3X) = (-3)^2 Var(X) = 9 * 4 = 36. The variance is 36."
          - problem: "Given Var(X) = 16, find SD(-2X)."
            answer: "8"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The object is SD(-2X). First convert variance to standard deviation: SD(X) = sqrt(16) = 4. Then standard deviation scales by |-2| = 2, so SD(-2X) = 2 * 4 = 8. The standard deviation is 8."
          - problem: "A random variable X has SD(X) = 5. Let Y = -3X. Find Var(Y)."
            answer: "225"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The object is Var(Y) with Y = -3X. First convert standard deviation to variance: Var(X) = 5^2 = 25. Then variance scales by (-3)^2 = 9, so Var(Y) = 9 * 25 = 225. The variance is 225."
        constraints: "a in {-3..3}; distinguish SD scaling (|a|) from variance scaling (a^2)"
      - id: kp3
        name: "Combined transformations aX + b"
        key_prerequisites: [variance-random-variables]
        exemplars:
          - problem: 'Given $\operatorname{Var}(X) = 3$, find $\operatorname{Var}(2X + 5)$.'
            answer: "12"
            solution_sketch: 'The shift does not change variance; scaling multiplies it by $a^2$: $4 \cdot 3 = 12$.'
          - problem: 'Taxi journeys have length $X$ km with mean $6$ and SD $2$. The fare in euros is $Y = 1.5X + 4$. Give the mean and SD of $Y$ as the ordered pair (mean, SD).'
            answer: '$(13, 3)$'
            solution_sketch: 'Mean: $1.5 \cdot 6 + 4 = 13$; SD: $1.5 \cdot 2 = 3$ (the $+4$ does not affect spread).'
        constraints: "a, b small constants (integers or one-decimal rates); answers whole numbers"
    diagnostic_exemplar:
      problem: 'Given $E[X] = 10$ and $\operatorname{SD}(X) = 4$, let $Y = 2X + 3$. Give $(E[Y], \operatorname{SD}(Y))$ as an ordered pair.'
      answer: '$(23, 8)$'
      solution_sketch: '$E[Y] = 2 \cdot 10 + 3 = 23$; $\operatorname{SD}(Y) = 2 \cdot 4 = 8$.'
    anki_seeds:
      - front: '$\operatorname{Var}(aX + b) =$ ?'
        back: '$a^2 \operatorname{Var}(X)$ — the shift $b$ has no effect.'
        type: basic
      - front: 'Adding a constant to a random variable changes its mean but not its...'
        back: 'Spread (SD and variance are unchanged).'
        type: basic

  - id: sums-of-random-variables
    name: "Sums of Random Variables"
    core: false                # terminal random-variable result
    difficulty: 0.55
    drill: false
    answer_kind: numeric
    expected_time_secs: 150
    prerequisites:
      - id: variance-random-variables
        weight: 0.7
        key: true
      - id: linear-transformations-random-variables
        weight: 0.4
        key: false
      - id: independent-events
        weight: 0.4
        key: false
    knowledge_points:
      - id: kp1
        name: "Means add"
        key_prerequisites: [variance-random-variables]
        exemplars:
          - problem: 'Given $E[X] = 3$ and $E[Y] = 5$, find $E[X + Y]$.'
            answer: "8"
            solution_sketch: 'Expectations always add: $3 + 5 = 8$.'
          - problem: 'Two fair dice are rolled. Find the expected value of their sum.'
            answer: "7"
            solution_sketch: '$E[X_1 + X_2] = 3.5 + 3.5 = 7$.'
          - problem: "The random variables X, Y and Z have E[X] = 4, E[Y] = 9 and E[Z] = 2. Find E[X + Y + Z]."
            answer: "15"
            answer_contract: {"kind": "exact"}
            solution_sketch: "By the addition rule for expectations, E[X + Y + Z] = E[X] + E[Y] + E[Z]. Substitute the given values: 4 + 9 + 2 = 15. The answer is 15."
          - problem: "A courier makes two deliveries. The first has expected travel time 2.5 hours, and the second has expected travel time 4 hours. Find the expected total travel time in hours as a fraction."
            answer: "13/2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Let X be the first travel time and Y the second. The expected total is E[X + Y] = E[X] + E[Y]. Thus 2.5 + 4 = 6.5, which is 13/2. The expected total travel time is 13/2 hours."
          - problem: "Three games give expected winnings 6, 7.5 and 3 points. Find the expected total winnings in points as a fraction."
            answer: "33/2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Let the three winnings be A, B and C. Expectations add: E[A + B + C] = E[A] + E[B] + E[C]. So 6 + 7.5 + 3 = 16.5, which is 33/2. The expected total is 33/2 points."
          - problem: "For random variables X and Y, E[X] = 4 and E[X + Y] = 11.5. Find E[Y] as a fraction."
            answer: "15/2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Expectations add, so E[X + Y] = E[X] + E[Y]. Substitute: 11.5 = 4 + E[Y]. Solve: E[Y] = 7.5, which is 15/2. The answer is 15/2."
        constraints: "2-3 variables; means are integers or half-integers"
      - id: kp2
        name: "Variances add for independent variables"
        key_prerequisites: [variance-random-variables, independent-events]
        exemplars:
          - problem: '$X$ and $Y$ are independent with $\operatorname{Var}(X) = 9$ and $\operatorname{Var}(Y) = 16$. Give $(\operatorname{Var}(X + Y), \operatorname{SD}(X + Y))$ as an ordered pair.'
            answer: '$(25, 5)$'
            solution_sketch: '$9 + 16 = 25$; $\sqrt{25} = 5$. SDs do not add — variances do.'
          - problem: 'Two fair dice are rolled independently; each roll has variance $35/12$. Find the variance of the sum.'
            answer: "35/6"
            solution_sketch: '$\frac{35}{12} + \frac{35}{12} = \frac{35}{6}$.'
          - problem: "$X$ and $Y$ are independent random variables with $\\operatorname{Var}(X) = 6$ and $\\operatorname{Var}(Y) = 10$. Give the answer as (Var(X + Y), SD(X + Y))."
            answer: "(16, 4)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "Var(X + Y) = Var(X) + Var(Y) = 6 + 10 = 16 by the variance addition rule, since X and Y are independent. The standard deviation is the square root of the variance, so SD(X + Y) = 4. The answer is (16, 4)."
          - problem: "$X$ and $Y$ are independent random variables with $\\operatorname{Var}(X) = 2$ and $\\operatorname{Var}(Y) = 3$. Find $\\operatorname{Var}(2X + 3Y)$."
            answer: "35"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Var(2X + 3Y) = 2^2 Var(X) + 3^2 Var(Y) by the linear-combination variance rule plus independence. Numerically, 4(2) + 9(3) = 8 + 27 = 35. The answer is 35."
          - problem: "$X$, $Y$ and $Z$ are independent random variables with $\\operatorname{Var}(X) = 3$, $\\operatorname{Var}(Y) = 8$ and $\\operatorname{Var}(Z) = 14$. Find $\\operatorname{SD}(X + Y + Z)$."
            answer: "5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Var(X + Y + Z) = 3 + 8 + 14 = 25 by the variance addition rule for independent variables. The standard deviation is the positive square root, so SD(X + Y + Z) = 5. The answer is 5."
          - problem: "$X$ and $Y$ are independent random variables with $\\operatorname{Var}(X + Y) = 25$ and $\\operatorname{Var}(X) = 6$. Find $\\operatorname{Var}(Y)$."
            answer: "19"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Var(X + Y) = Var(X) + Var(Y) by the variance addition rule, because X and Y are independent. Substitute the known values: 25 = 6 + Var(Y). Subtract 6 from both sides to get Var(Y) = 19. The answer is 19."
        constraints: "independence stated explicitly; variances sum to a perfect square when SD is requested"
      - id: kp3
        name: "Differences of independent variables"
        key_prerequisites: [variance-random-variables, independent-events]
        exemplars:
          - problem: '$X$ and $Y$ are independent with $E[X] = 30$, $E[Y] = 25$, $\operatorname{Var}(X) = 16$, $\operatorname{Var}(Y) = 9$. Give $(E[X - Y], \operatorname{Var}(X - Y))$ as an ordered pair.'
            answer: '$(5, 25)$'
            solution_sketch: 'Means subtract: $30 - 25 = 5$. Variances still add: $16 + 9 = 25$.'
          - problem: '$X$ and $Y$ are independent with $\operatorname{Var}(X) = 9$ and $\operatorname{Var}(Y) = 4$. Find $\operatorname{Var}(X - Y)$.'
            answer: "13"
            solution_sketch: '$\operatorname{Var}(-Y) = \operatorname{Var}(Y)$, so variances still add: $9 + 4 = 13$ — subtracting an independent variable adds just as much spread as adding it.'
          - problem: "X is the time in minutes for the morning crew and Y is the time in minutes for the evening crew at a warehouse; X and Y are independent. The means are E[X] = 42 and E[Y] = 18. The variances are Var(X) = 25 and Var(Y) = 36. Give (E[X - Y], Var(X - Y)) as (mean, variance)."
            answer: "(24, 61)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "The ordered pair (E[X - Y], Var(X - Y)) needs two computations. First, the mean subtracts: E[X - Y] = 42 - 18 = 24. Second, the variance of a difference of independent variables adds: Var(X - Y) = 25 + 36 = 61. The ordered pair is (24, 61)."
          - problem: "Let X be the error in a sensor reading and Y be the error in a second independent sensor. E[X] = 120, E[Y] = 45, Var(X) = 64, and Var(Y) = 100. Give (E[Y - X], Var(Y - X)) as (mean, variance)."
            answer: "(-75, 164)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "The ordered pair (E[Y - X], Var(Y - X)) needs two computations. First, the mean subtracts: E[Y - X] = 45 - 120 = -75. Second, the variance of a difference of independent variables adds: Var(Y - X) = 100 + 64 = 164. The ordered pair is (-75, 164)."
          - problem: "X and Y are independent random variables with Var(X) = 49 and Var(Y) = 16. Find the standard deviation of X - Y."
            answer: "sqrt(65)"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The target is the standard deviation of X - Y, which needs two computations. First, the variance of the difference of independent variables adds: Var(X - Y) = 49 + 16 = 65. Second, the standard deviation is the square root of the variance, sqrt(65). The standard deviation is sqrt(65)."
          - problem: "Let X and Y be independent with Var(X) = 12 and Var(Y) = 8. Find Var(3X - 2Y)."
            answer: "140"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The target is Var(3X - 2Y), which uses two variance computations. Use Var(aX + bY) = a^2 Var(X) + b^2 Var(Y) for independent X and Y. For a = 3 and b = -2, Var(3X - 2Y) = 9*12 + 4*8 = 108 + 32 = 140. The value is 140."
        constraints: "two computations; variances add for both sums and differences"
    diagnostic_exemplar:
      problem: '$X$ and $Y$ are independent with $E[X] = 8$, $E[Y] = 5$, $\operatorname{Var}(X) = 6$, $\operatorname{Var}(Y) = 3$. Give $(E[X - Y], \operatorname{Var}(X - Y))$ as an ordered pair.'
      answer: '$(3, 9)$'
      solution_sketch: 'Means subtract: $8 - 5 = 3$; variances of independent variables add even for differences: $6 + 3 = 9$.'
    anki_seeds:
      - front: '$E[X + Y] =$ ? (any $X, Y$)'
        back: '$E[X] + E[Y]$ — expectations always add.'
        type: basic
      - front: '$\operatorname{Var}(X + Y) = \operatorname{Var}(X) + \operatorname{Var}(Y)$ requires...'
        back: '$X$ and $Y$ independent (uncorrelated).'
        type: basic
      - front: 'For independent $X, Y$: $\operatorname{Var}(X - Y) =$ ?'
        back: '$\operatorname{Var}(X) + \operatorname{Var}(Y)$ — variances add even for differences.'
        type: basic

  - id: binomial-probability
    name: "Binomial Probabilities"
    core: true
    difficulty: 0.5
    drill: false
    answer_kind: numeric
    expected_time_secs: 180
    prerequisites:
      - id: combinations
        weight: 0.7
        key: true
      - id: independent-events
        weight: 0.6
        key: true
      - id: discrete-probability-distributions
        weight: 0.4
        key: false
    knowledge_points:
      - id: kp1
        name: "Recognizing the binomial setting"
        key_prerequisites: [independent-events]
        exemplars:
          - problem: 'Which is binomial: (a) the number of heads in $10$ flips of a fair coin; (b) the number of rolls of a die until the first $6$?'
            answer: '(a)'
            solution_sketch: 'Binomial needs a fixed $n$, two outcomes, constant $p$, independent trials; (b) has no fixed number of trials.'
          - problem: 'Five cards are drawn without replacement and the number of hearts is counted. Is this binomial: (a) yes; (b) no?'
            answer: '(b)'
            solution_sketch: 'Without replacement the trials are not independent and $p$ changes from draw to draw.'
        constraints: "one valid and one invalid setting per set; the answer labels the option, the reasoning names the failed condition"
      - id: kp2
        name: "P(X = k) with p = 1/2"
        key_prerequisites: [combinations, independent-events]
        exemplars:
          - problem: 'A fair coin is flipped $4$ times. Find $P(\text{exactly } 2 \text{ heads})$.'
            answer: "3/8"
            solution_sketch: '$\binom{4}{2} \left(\frac{1}{2}\right)^4 = \frac{6}{16} = \frac{3}{8}$.'
          - problem: 'A fair coin is flipped $5$ times. Find $P(\text{exactly } 3 \text{ heads})$.'
            answer: "5/16"
            solution_sketch: '$\binom{5}{3} \left(\frac{1}{2}\right)^5 = \frac{10}{32} = \frac{5}{16}$.'
          - problem: "A fair six-sided die is rolled 5 times. A success is a roll that shows an even number. Find the probability of exactly 1 success."
            answer: "5/32"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Let X be the number of even rolls in 5 rolls. The binomial model with n = 5 and p = 1/2 gives P(X = 1) = C(5,1) (1/2)^5. The combinations rule gives C(5,1) = 5. Multiply by (1/2)^5 = 1/32 to get 5/32. The answer is 5/32."
          - problem: "A student randomly guesses on 4 two-choice questions, each with one correct choice. Find the probability of exactly 1 correct guess."
            answer: "1/4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Let X be the number of correct guesses in 4 guesses. The binomial model with n = 4 and p = 1/2 gives P(X = 1) = C(4,1) (1/2)^4. The combinations rule gives C(4,1) = 4. Multiply by (1/2)^4 = 1/16 to get 4/16 = 1/4. The answer is 1/4."
          - problem: "A bag contains equal numbers of red and blue marbles. A marble is drawn and replaced 6 times. Find the probability of exactly 1 red marble."
            answer: "3/32"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Let X be the number of red marbles in 6 draws with replacement. The binomial model with n = 6 and p = 1/2 gives P(X = 1) = C(6,1) (1/2)^6. The combinations rule gives C(6,1) = 6. Multiply by (1/2)^6 = 1/64 to get 6/64 = 3/32. The answer is 3/32."
          - problem: "A random number generator produces 0 or 1 with equal probability. It produces 6 numbers. Find the probability of exactly 2 ones."
            answer: "15/64"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Let X be the number of ones in 6 generated numbers. The binomial model with n = 6 and p = 1/2 gives P(X = 2) = C(6,2) (1/2)^6. The combinations rule gives C(6,2) = 15. Multiply by (1/2)^6 = 1/64 to get 15/64. The answer is 15/64."
        constraints: "n <= 6; p = 1/2; answers exact fractions"
      - id: kp3
        name: "P(X = k) with general p"
        key_prerequisites: [combinations, independent-events]
        exemplars:
          - problem: 'Each trial succeeds with probability $1/3$; there are $3$ independent trials. Find $P(\text{exactly } 2 \text{ successes})$.'
            answer: "2/9"
            solution_sketch: '$\binom{3}{2} \left(\frac{1}{3}\right)^2 \left(\frac{2}{3}\right)^1 = 3 \cdot \frac{1}{9} \cdot \frac{2}{3} = \frac{6}{27} = \frac{2}{9}$.'
          - problem: 'A fair die is rolled $4$ times. Find $P(\text{exactly one } 6)$.'
            answer: "125/324"
            solution_sketch: '$\binom{4}{1} \cdot \frac{1}{6} \cdot \left(\frac{5}{6}\right)^3 = 4 \cdot \frac{125}{1296} = \frac{500}{1296} = \frac{125}{324}$.'
          - problem: "A biased coin lands heads with probability $1/3$. The coin is tossed $5$ independent times. Find the probability of exactly $4$ heads."
            answer: "10/243"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Use the binomial probability rule: P(X = 4) = C(5,4) * (1/3)^4 * (2/3)^1. The combination C(5,4) equals 5. Multiply the factors: 5 * (1/81) * (2/3) = 10/243. The probability is 10/243."
          - problem: "A spinner lands on red with probability $1/4$. It is spun $4$ independent times. Find the probability of exactly $2$ red results."
            answer: "27/128"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Use the binomial probability rule: P(X = 2) = C(4,2) * (1/4)^2 * (3/4)^2. The combination C(4,2) equals 6. Multiply: 6 * (1/16) * (9/16) = 54/256 = 27/128. The probability is 27/128."
          - problem: "A standard die is rolled $6$ independent times. Find the probability that exactly two rolls show a six."
            answer: "3125/15552"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Use the binomial probability rule: P(X = 2) = C(6,2) * (1/6)^2 * (5/6)^4. The combination C(6,2) equals 15. Multiply: 15 * (1/36) * (625/1296) = 9375/46656 = 3125/15552. The probability is 3125/15552."
          - problem: "In a quality-control test, each item fails with probability $1/3$, and $6$ items are tested independently. Find the probability that exactly $2$ items fail."
            answer: "80/243"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Use the binomial probability rule: P(X = 2) = C(6,2) * (1/3)^2 * (2/3)^4. The combination C(6,2) equals 15. Multiply: 15 * (1/9) * (16/81) = 240/729 = 80/243. The probability is 80/243."
        constraints: "n <= 6; p in {1/3, 1/4, 1/6}; answers exact fractions"
    diagnostic_exemplar:
      problem: 'Each trial succeeds with probability $1/4$; there are $3$ independent trials. Find $P(\text{exactly } 2 \text{ successes})$.'
      answer: "9/64"
      solution_sketch: '$\binom{3}{2} \left(\frac{1}{4}\right)^2 \left(\frac{3}{4}\right) = 3 \cdot \frac{1}{16} \cdot \frac{3}{4} = \frac{9}{64}$.'
    anki_seeds:
      - front: 'Binomial probability formula?'
        back: '$P(X = k) = \binom{n}{k} p^k (1-p)^{n-k}$.'
        type: basic
      - front: 'The four binomial conditions: fixed $n$, two outcomes per trial, constant $p$, and {{c1::independent}} trials.'
        back: 'independent'
        type: cloze

  - id: binomial-distribution
    name: "Binomial Distribution"
    core: false                # named distribution; terminal
    difficulty: 0.55
    drill: false
    answer_kind: multi-step
    expected_time_secs: 240
    prerequisites:
      - id: binomial-probability
        weight: 0.8
        key: true
      - id: discrete-random-variables
        weight: 0.5
        key: false
    knowledge_points:
      - id: kp1
        name: "At-least and at-most probabilities"
        key_prerequisites: [binomial-probability]
        exemplars:
          - problem: "A biased coin lands heads with probability $1/3$. It is flipped $3$ times. Find $P(\\text{at least one head})$ as a fraction."
            answer: "19/27"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Use the complement rule for at least one head. The complement event has zero heads, with probability $(2/3)^3 = 8/27$. Subtract from $1$: $1 - 8/27 = 19/27$."
          - problem: "A fair die is rolled $3$ times. Let $X$ be the number of sixes. Find $P(X \\le 1)$ as a fraction."
            answer: "25/27"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Use the binomial sum for at most one six. The term for zero sixes is $(5/6)^3 = 125/216$. The term for one six is $3 \\cdot (1/6) \\cdot (5/6)^2 = 75/216$. Sum the terms: $125/216 + 75/216 = 25/27$."
          - problem: "A fair die is rolled $4$ times. Let $X$ be the number of sixes. Find $P(X \\ge 2)$ as a fraction."
            answer: "19/144"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Use the complement rule for at least two sixes. The complement has zero or one six. Compute $P(0) = (5/6)^4 = 625/1296$ and $P(1) = 4 \\cdot (1/6) \\cdot (5/6)^3 = 500/1296$. Subtract: $1 - 625/1296 - 500/1296 = 171/1296 = 19/144$."
          - problem: "A basketball player makes a free throw with probability $3/4$. She shoots $3$ times. Find $P(\\text{at most two makes})$ as a fraction."
            answer: "37/64"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Use the complement rule for at most two makes. The complement event is three makes. Compute $P(3) = (3/4)^3 = 27/64$. Subtract: $1 - 27/64 = 37/64$."
          - problem: "A spinner lands on red with probability $1/4$. It is spun $4$ times. Find $P(\\text{at least one red})$ as a fraction."
            answer: "175/256"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Use the complement rule for at least one red. The complement is no red in four spins, $(3/4)^4 = 81/256$. Subtract: $1 - 81/256 = 175/256$."
          - problem: "A spinner lands on red with probability $1/3$. It is spun $4$ times. Let $X$ be the number of reds. Find $P(X \\le 2)$ as a fraction."
            answer: "8/9"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Use the binomial sum for at most two reds. The zero-red term is $(2/3)^4 = 16/81$. The one-red term is $4 \\cdot (1/3) \\cdot (2/3)^3 = 32/81$. The two-red term is $6 \\cdot (1/3)^2 \\cdot (2/3)^2 = 24/81$. Sum: $16/81 + 32/81 + 24/81 = 72/81 = 8/9$."
        constraints: "n <= 4; require the complement for at-least-one; at-most sums over <= 3 terms"
      - id: kp2
        name: "Mean and variance: np and np(1-p)"
        key_prerequisites: [binomial-probability, discrete-random-variables]
        exemplars:
          - problem: '$X$ is binomial with $n = 20$, $p = 1/4$. Find $E[X]$ and $\operatorname{Var}(X)$.'
            answer: '$E[X] = 5$, $\operatorname{Var}(X) = 15/4$'
            solution_sketch: '$E[X] = np = 5$; $\operatorname{Var}(X) = np(1-p) = 20 \cdot \frac{1}{4} \cdot \frac{3}{4} = \frac{15}{4}$.'
          - problem: '$X$ is binomial with $n = 10$, $p = 1/2$. Find $E[X]$ and $\operatorname{Var}(X)$.'
            answer: '$E[X] = 5$, $\operatorname{Var}(X) = 5/2$'
            solution_sketch: '$np = 5$; $np(1-p) = 10 \cdot \frac{1}{2} \cdot \frac{1}{2} = \frac{5}{2}$.'
        constraints: "np an integer or half-integer; p a simple fraction"
      - id: kp3
        name: "Building the full distribution"
        key_prerequisites: [binomial-probability]
        exemplars:
          - problem: 'A fair coin is flipped $4$ times; $X$ counts heads. Find $P(X \ge 3)$.'
            answer: "5/16"
            solution_sketch: '$P(X=3) + P(X=4) = \frac{4}{16} + \frac{1}{16} = \frac{5}{16}$.'
          - problem: '$X$ is binomial with $n = 3$, $p = 1/3$. Give the full distribution of $X$.'
            answer: '$P(X=0) = 8/27$, $P(X=1) = 4/9$, $P(X=2) = 2/9$, $P(X=3) = 1/27$.'
            solution_sketch: '$\left(\frac{2}{3}\right)^3 = \frac{8}{27}$; $3 \cdot \frac{1}{3} \cdot \frac{4}{9} = \frac{12}{27}$; $3 \cdot \frac{1}{9} \cdot \frac{2}{3} = \frac{6}{27}$; $\frac{1}{27}$ — and they sum to $1$.'
        constraints: "n <= 4; sums of two binomial terms or full 4-row tables; verify the table sums to 1"
    diagnostic_exemplar:
      problem: 'A fair coin is flipped $4$ times; $X$ counts heads. Find $P(X \ge 3)$ and $E[X]$.'
      answer: '$P(X \ge 3) = 5/16$; $E[X] = 2$'
      solution_sketch: '$\frac{4}{16} + \frac{1}{16} = \frac{5}{16}$; $E[X] = np = 4 \cdot \frac{1}{2} = 2$.'
    anki_seeds:
      - front: 'Mean and variance of a binomial random variable?'
        back: '$E[X] = np$, $\operatorname{Var}(X) = np(1-p)$.'
        type: basic
      - front: 'For a binomial variable, $P(X \ge 1) =$ ?'
        back: '$1 - (1-p)^n$ — the complement of zero successes.'
        type: basic

  - id: first-success-probabilities
    name: "First-Success Probabilities"
    core: false                # terminal geometric-distribution branch
    difficulty: 0.5
    drill: false
    answer_kind: numeric
    expected_time_secs: 120
    prerequisites:
      - id: independent-events
        weight: 0.7
        key: true
      - id: multiplying-fractions
        weight: 0.4
        key: false
    knowledge_points:
      - id: kp1
        name: "Failure-then-success chains"
        key_prerequisites: [independent-events, multiplying-fractions]
        exemplars:
          - problem: 'A fair coin is flipped until heads. Find $P(\text{first head on flip } 2)$.'
            answer: "1/4"
            solution_sketch: 'Tail then head: $\frac{1}{2} \cdot \frac{1}{2} = \frac{1}{4}$.'
          - problem: 'A fair die is rolled until a $6$ appears. Find $P(\text{first } 6 \text{ on roll } 2)$.'
            answer: "5/36"
            solution_sketch: 'One failure then a success: $\frac{5}{6} \cdot \frac{1}{6} = \frac{5}{36}$.'
          - problem: "A soccer player scores a penalty kick with probability 1/2, independently on each attempt. Find the probability that the first goal comes on the second attempt."
            answer: "1/4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: the first attempt must fail; the failure probability is 1 - 1/2 = 1/2. Step 2 (multiplication rule for independent events): multiply the failure probability by the success probability, (1/2)(1/2) = 1/4. The probability is 1/4."
          - problem: "A spinner lands on red with probability 1/4. Find the probability that the first red comes on the second spin."
            answer: "3/16"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: the first spin must not land on red; the failure probability is 1 - 1/4 = 3/4. Step 2 (multiplication rule for independent spins): (3/4)(1/4) = 3/16. The probability is 3/16."
          - problem: "A biased coin lands heads with probability 1/3. Find the probability that the first head comes on the second flip."
            answer: "2/9"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: the first flip must land tails; the failure probability is 1 - 1/3 = 2/3. Step 2 (multiplication rule for independent flips): (2/3)(1/3) = 2/9. The probability is 2/9."
          - problem: "A thumbtack lands point up with probability 1/6. Find the probability that the first point-up landing comes on the second toss."
            answer: "5/36"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: the first toss must land point down; the failure probability is 1 - 1/6 = 5/6. Step 2 (multiplication rule for independent tosses): (5/6)(1/6) = 5/36. The probability is 5/36."
        constraints: "exactly one failure before the success; p in {1/2, 1/3, 1/4, 1/6}"
      - id: kp2
        name: "First success on trial k"
        key_prerequisites: [independent-events, multiplying-fractions]
        exemplars:
          - problem: 'A fair die is rolled until a $6$ appears. Find $P(\text{first } 6 \text{ on roll } 3)$.'
            answer: "25/216"
            solution_sketch: 'Two failures then a success: $\left(\frac{5}{6}\right)^2 \cdot \frac{1}{6} = \frac{25}{216}$.'
          - problem: 'A fair coin is flipped until heads. Find $P(\text{first head on flip } 4)$.'
            answer: "1/16"
            solution_sketch: '$\left(\frac{1}{2}\right)^3 \cdot \frac{1}{2} = \frac{1}{16}$.'
          - problem: "A spinner lands on red with probability 1/3 on each spin, independently. Find the probability that the first red lands on the third spin."
            answer: "4/27"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The first-success rule gives P(first success on trial k) = (1-p)^(k-1) p. Here p = 1/3 and k = 3, so the probability is (2/3)^2 * 1/3 = 4/27. The probability is 4/27."
          - problem: "A machine makes a defective part with probability 1/4, independently. Find the probability that the first defective part is the fourth part made."
            answer: "27/256"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The first-success rule gives P(first success on trial k) = (1-p)^(k-1) p. With p = 1/4 and k = 4, compute (3/4)^3 * 1/4 = 27/256. The probability is 27/256."
          - problem: "A basketball player makes a free throw with probability 1/2, independently. Find the probability that the first made free throw is on the third attempt."
            answer: "1/8"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The first-success rule gives P(first success on trial k) = (1-p)^(k-1) p. Here p = 1/2 and k = 3, so the probability is (1/2)^2 * 1/2 = 1/8. The probability is 1/8."
          - problem: "In a card game, a draw is a heart with probability 1/4, independently. Find the probability that the first heart is on the second draw."
            answer: "3/16"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The first-success rule gives P(first success on trial k) = (1-p)^(k-1) p. Here p = 1/4 and k = 2, so the probability is (3/4)^1 * 1/4 = 3/16. The probability is 3/16."
        constraints: "k <= 4; p in {1/2, 1/3, 1/4, 1/6}; answers exact fractions"
      - id: kp3
        name: "First success within k trials"
        key_prerequisites: [independent-events]
        exemplars:
          - problem: 'A fair coin is flipped until heads. Find $P(\text{first head within } 2 \text{ flips})$.'
            answer: "3/4"
            solution_sketch: '$\frac{1}{2} + \frac{1}{4} = \frac{3}{4}$, or $1 - P(\text{both tails}) = 1 - \frac{1}{4}$.'
          - problem: 'Trials succeed with probability $1/3$. Find the probability the first success comes within two trials.'
            answer: "5/9"
            solution_sketch: '$1 - \left(\frac{2}{3}\right)^2 = 1 - \frac{4}{9} = \frac{5}{9}$.'
          - problem: "A fair six-sided die is rolled until a 6 appears. Find the probability that the first 6 comes within 3 rolls."
            answer: "91/216"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The complement event is that all three rolls fail to show a 6. Its probability is (5/6)^3 = 125/216. Subtract this from 1: 1 - 125/216 = 91/216. The probability is 91/216."
          - problem: "A game has independent rounds, each won with probability 2/5. Find the probability that the first win happens within the first 2 rounds."
            answer: "16/25"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The complement event is that both rounds are losses. Its probability is (3/5)^2 = 9/25. Subtract this from 1: 1 - 9/25 = 16/25. The probability is 16/25."
          - problem: "In a sequence of independent trials, the probability that the first success comes within 2 trials is 9/25. Find the success probability p of one trial."
            answer: "1/5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The complement event is that neither of the two trials succeeds. Its probability is (1 - p)^2, and it equals 1 - 9/25 = 16/25. Thus (1 - p)^2 = 16/25, so 1 - p = 4/5 because a probability is positive. Therefore p = 1/5. The value of p is 1/5."
          - problem: "A basketball player makes each free throw independently with probability 3/5. Find the probability that the first made free throw comes within 3 attempts."
            answer: "117/125"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The complement event is that all three free throws miss. Its probability is (2/5)^3 = 8/125. Subtract this from 1: 1 - 8/125 = 117/125. The probability is 117/125."
        constraints: "k <= 3; allow either summing cases or the all-failures complement"
    diagnostic_exemplar:
      problem: 'Trials succeed independently with probability $1/4$. Find the probability that the first success comes within $2$ trials.'
      answer: '7/16'
      solution_sketch: 'Complement of two straight failures: $1 - (3/4)^2 = 7/16$.'
    anki_seeds:
      - front: 'P(first success on trial $k$) is built by multiplying...'
        back: '$k-1$ failure probabilities, then one success probability.'
        type: basic
      - front: 'P(first success within $k$ trials) $=$ ?'
        back: '$1 - (1-p)^k$ — the complement of $k$ straight failures.'
        type: basic

  - id: geometric-distribution
    name: "Geometric Distribution"
    core: false                # terminal geometric-distribution branch
    difficulty: 0.55
    drill: false
    answer_kind: numeric
    expected_time_secs: 180
    prerequisites:
      - id: first-success-probabilities
        weight: 0.8
        key: true
      - id: discrete-random-variables
        weight: 0.5
        key: false
    knowledge_points:
      - id: kp1
        name: "The formula P(X = k) = (1-p)^(k-1) p"
        key_prerequisites: [first-success-probabilities]
        exemplars:
          - problem: 'Trials succeed with probability $1/5$. Use the geometric formula to find $P(X = 3)$.'
            answer: "16/125"
            solution_sketch: '$\left(\frac{4}{5}\right)^2 \cdot \frac{1}{5} = \frac{16}{25} \cdot \frac{1}{5} = \frac{16}{125}$.'
          - problem: '$X$ is geometric with $p = 1/2$. Find $P(X = 5)$.'
            answer: "1/32"
            solution_sketch: '$\left(\frac{1}{2}\right)^4 \cdot \frac{1}{2} = \frac{1}{32}$.'
          - problem: "A spinner lands on red with probability $1/3$. Let $X$ be the number of spins until the first red. Find $P(X = 2)$."
            answer: "2/9"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The geometric formula gives $P(X = k) = (1-p)^{k-1} p$. With $p = 1/3$ and $k = 2$, $P(X = 2) = (2/3)^1 \\cdot (1/3) = 2/9$. The answer is 2/9."
          - problem: "A basketball player makes each free throw with probability $1/4$. Let $X$ be the number of throws until the first make. Find $P(X = 4)$."
            answer: "27/256"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The geometric formula gives $P(X = k) = (1-p)^{k-1} p$. With $p = 1/4$ and $k = 4$, $P(X = 4) = (3/4)^3 \\cdot (1/4) = (27/64) \\cdot (1/4) = 27/256$. The answer is 27/256."
          - problem: "A fair die is rolled until a 6 appears. Let $X$ be the number of rolls. Find $P(X = 3)$."
            answer: "25/216"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The geometric formula gives $P(X = k) = (1-p)^{k-1} p$. With $p = 1/6$ and $k = 3$, $P(X = 3) = (5/6)^2 \\cdot (1/6) = (25/36) \\cdot (1/6) = 25/216$. The answer is 25/216."
          - problem: "A fair coin is tossed until the first head appears. Let $X$ be the number of tosses. Find $P(X = 2)$."
            answer: "1/4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The geometric formula gives $P(X = k) = (1-p)^{k-1} p$. With $p = 1/2$ and $k = 2$, $P(X = 2) = (1/2)^1 \\cdot (1/2) = 1/4$. The answer is 1/4."
        constraints: "k <= 5; p in {1/2, 1/3, 1/4, 1/5, 1/6}; answers exact fractions"
      - id: kp2
        name: "Tail and cumulative probabilities"
        key_prerequisites: [first-success-probabilities]
        exemplars:
          - problem: 'A fair die is rolled until a $6$ appears. Find $P(\text{no } 6 \text{ in the first two rolls})$, i.e. $P(X > 2)$.'
            answer: "25/36"
            solution_sketch: '$P(X > k) = (1-p)^k = \left(\frac{5}{6}\right)^2 = \frac{25}{36}$.'
          - problem: '$X$ is geometric with $p = 1/4$. Find $P(X > 3)$.'
            answer: "27/64"
            solution_sketch: 'Three straight failures: $\left(\frac{3}{4}\right)^3 = \frac{27}{64}$.'
        constraints: "k <= 3; use P(X > k) = (1-p)^k; answers exact fractions"
      - id: kp3
        name: "Expected number of trials: 1/p"
        key_prerequisites: [first-success-probabilities]
        exemplars:
          - problem: 'A fair die is rolled until a $6$ appears. Find the expected number of rolls.'
            answer: "6"
            solution_sketch: '$E[X] = 1/p = 1/(1/6) = 6$.'
          - problem: 'Trials succeed with probability $2/5$. Find the expected number of trials until the first success.'
            answer: "5/2"
            solution_sketch: '$E[X] = \frac{1}{2/5} = \frac{5}{2}$.'
          - problem: "A spinner succeeds on each independent spin with probability 3/7. Spins continue until the first success. Find the expected number of spins until the first success as a fraction."
            answer: "7/3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Let X be the number of spins until the first success. X is geometric with success probability p = 3/7. The geometric mean rule says E[X] = 1/p. Substitute: E[X] = 1/(3/7) = 7/3. The expected number of spins is 7/3."
          - problem: "In a free-throw drill, each shot succeeds independently with probability 5/11. The drill stops at the first made shot. Find the expected number of shots until the first success as a fraction."
            answer: "11/5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Let X be the number of shots until the first made shot. X is geometric with p = 5/11. By the geometric mean rule, E[X] = 1/p. Compute 1/(5/11) = 11/5. The expected number of shots is 11/5."
          - problem: "During a quality check, each item passes inspection with probability 4/9. Items are inspected one after another until the first pass. Find the expected number of items inspected as a fraction."
            answer: "9/4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Let X be the number of items inspected until the first pass. X is geometric with p = 4/9. The geometric mean rule gives E[X] = 1/p. Compute 1/(4/9) = 9/4. The expected number of items inspected is 9/4."
          - problem: "A raffle ticket wins with probability 2/13. Tickets are drawn one at a time with replacement until the first win. Find the expected number of tickets drawn until the first success as a fraction."
            answer: "13/2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Let X be the number of tickets drawn until the first win. X is geometric with p = 2/13. The geometric mean rule states E[X] = 1/p. Compute 1/(2/13) = 13/2. The expected number of tickets drawn is 13/2."
        constraints: "p a simple fraction; answer 1/p exactly"
    diagnostic_exemplar:
      problem: '$X$ is geometric with $p = \frac{1}{3}$. Give $(P(X = 2),\ P(X > 2),\ E[X])$ as an ordered triple, using exact fractions.'
      answer: '$(2/9, 4/9, 3)$'
      solution_sketch: '$P(X=2) = \frac{2}{3}\cdot\frac{1}{3} = \frac{2}{9}$; $P(X > 2) = \left(\frac{2}{3}\right)^2 = \frac{4}{9}$; $E[X] = 1/p = 3$.'
    anki_seeds:
      - front: 'Geometric probability formula (first success on trial $k$)?'
        back: '$P(X = k) = (1-p)^{k-1} p$.'
        type: basic
      - front: 'Mean of a geometric random variable?'
        back: '$E[X] = \frac{1}{p}$.'
        type: basic
      - front: 'Geometric tail: $P(X > k) =$ ?'
        back: '$(1-p)^k$ — the first $k$ trials all fail.'
        type: basic

  - id: uniform-distribution
    name: "Uniform Distributions"
    core: false                # terminal probability-model branch
    difficulty: 0.45
    drill: false
    answer_kind: numeric
    expected_time_secs: 120
    prerequisites:
      - id: discrete-random-variables
        weight: 0.6
        key: true
      - id: geometric-probability-models
        weight: 0.5
        key: false
    knowledge_points:
      - id: kp1
        name: "Discrete uniform distributions"
        key_prerequisites: [discrete-random-variables]
        exemplars:
          - problem: '$X$ is a random integer from $1$ to $10$, all equally likely. Give $(P(X = 7), P(X \le 3))$ as an ordered pair, using exact fractions.'
            answer: '$(1/10, 3/10)$'
            solution_sketch: 'Each of the $10$ values has probability $1/10$; three favorable values give $3/10$.'
          - problem: '$X$ is a random integer from $1$ to $9$, all equally likely. Find $E[X]$.'
            answer: "5"
            solution_sketch: 'By symmetry the mean is the middle value: $\frac{1+9}{2} = 5$.'
          - problem: "X is a random integer from 1 to 20, all equally likely. Find P(X <= 7). Give the answer as a fraction."
            answer: "7/20"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The equally likely rule gives probability as favorable count over total count. The integers 1 through 20 give total count 20. The integers 1 through 7 give favorable count 7. The probability is 7/20."
          - problem: "X is a random integer from 2 to 19, all equally likely. Find P(X >= 12). Give the answer as a fraction."
            answer: "4/9"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The equally likely rule uses favorable count over total count. The integers 2 through 19 give total count 18. The integers 12 through 19 give favorable count 8. Simplify 8/18 to get 4/9. The probability is 4/9."
          - problem: "X is a random integer from 1 to 16, all equally likely. Find P(4 <= X <= 11). Give the answer as a fraction."
            answer: "1/2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The equally likely rule sets probability to favorable count over total count. The integers 1 through 16 give total count 16. The integers 4 through 11 give favorable count 8. Simplify 8/16 to get 1/2. The probability is 1/2."
          - problem: "X is a random integer from 3 to 20, all equally likely. Find E[X]. Give the answer as a fraction."
            answer: "23/2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "For a discrete uniform distribution the expected value is the average of the smallest and largest values. The smallest value is 3 and the largest value is 20. Their sum is 23, and half of 23 is 23/2. The expected value is 23/2."
        constraints: "n <= 20 equally likely integers; means are integers or half-integers"
      - id: kp2
        name: "Continuous uniform as length"
        key_prerequisites: [geometric-probability-models]
        exemplars:
          - problem: '$X$ is uniform on $[0, 10]$. Find $P(2 \le X \le 5)$.'
            answer: "3/10"
            solution_sketch: 'Probability is length over total length: $\frac{5-2}{10} = \frac{3}{10}$.'
          - problem: 'A bus arrives at a uniformly random time in a $20$-minute window, and you arrive exactly at the start of the window. Find $P(\text{you wait more than } 15 \text{ minutes})$.'
            answer: "1/4"
            solution_sketch: '$\frac{20 - 15}{20} = \frac{1}{4}$.'
          - problem: "X is uniform on the interval [2, 14]. Give the probability that X lies between 5 and 11 as a fraction in lowest terms."
            answer: "1/2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: The total length of [2, 14] is 14 - 2 = 12. Step 2: The favorable length of [5, 11] is 11 - 5 = 6. Step 3: Apply the uniform length rule: probability = favorable length / total length = 6/12 = 1/2. The answer is 1/2."
          - problem: "A train arrives at a uniformly random time during a 40-minute period. Give the probability that it arrives during the last 15 minutes as a fraction in lowest terms."
            answer: "3/8"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: The total length of the 40-minute period is 40. Step 2: The favorable last 15 minutes have length 15. Step 3: Apply the uniform length rule: probability = 15/40 = 3/8. The answer is 3/8."
          - problem: "X is uniform on [0, 9]. Give the probability that X is less than 2 or greater than 7 as a fraction in lowest terms."
            answer: "4/9"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: The total length of [0, 9] is 9. Step 2: The favorable parts have lengths 2 and 2, so their total is 4. Step 3: Apply the uniform length rule: probability = 4/9. The answer is 4/9."
          - problem: "X is uniform on [0, 15]. Give the probability that X is less than 5 or greater than 8 as a fraction in lowest terms."
            answer: "4/5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: The total length of [0, 15] is 15. Step 2: The favorable parts have lengths 5 and 7, so their total is 12. Step 3: Apply the uniform length rule: probability = 12/15 = 4/5. The answer is 4/5."
        constraints: "intervals with integer endpoints; answers exact fractions in lowest terms"
      - id: kp3
        name: "Midpoints and percent points"
        key_prerequisites: [discrete-random-variables, geometric-probability-models]
        exemplars:
          - problem: '$X$ is uniform on $[4, 10]$. Find $E[X]$.'
            answer: "7"
            solution_sketch: 'The mean of a uniform distribution is the midpoint: $\frac{4+10}{2} = 7$.'
          - problem: '$X$ is uniform on $[0, 8]$. Find the value $c$ with $P(X \le c) = 3/4$.'
            answer: "6"
            solution_sketch: '$\frac{c}{8} = \frac{3}{4}$ gives $c = 6$.'
          - problem: "The waiting time X in minutes is uniform on [12, 30]. Find its expected value."
            answer: "21"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full object is X uniform on [12, 30]. Step 1 uses the midpoint rule for a uniform distribution: E[X] = (12 + 30)/2. Step 2 computes (12 + 30)/2 = 42/2 = 21. The mean is 21."
          - problem: "The daily demand X in litres is uniform on [5, 25]. Find the value c with P(X <= c) = 0.6."
            answer: "17"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full object is X uniform on [5, 25] with P(X <= c) = 0.6. Step 1 uses the percentile formula for a uniform distribution: c = 5 + 0.6(25 - 5). Step 2 computes c = 5 + 12 = 17. The value is 17."
          - problem: "A uniform random variable X on [a, 20] has mean 14. Find a."
            answer: "8"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full object is X uniform on [a, 20] with mean 14. Step 1 uses the midpoint rule: (a + 20)/2 = 14. Step 2 solves a + 20 = 28, so a = 8. The missing endpoint is 8."
          - problem: "The error X in millimetres is uniform on [10, 30]. Find the value c with P(X >= c) = 0.25."
            answer: "25"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full object is X uniform on [10, 30] with P(X >= c) = 0.25. Step 1 uses the upper-tail percent point rule: P(X >= c) = (30 - c)/20 = 0.25. Step 2 solves 30 - c = 5, so c = 25. The value is 25."
        constraints: "endpoints and target probabilities chosen so answers are integers"
    diagnostic_exemplar:
      problem: '$X$ is uniform on $[2, 10]$. Give $(P(3 \le X \le 7),\ \text{the value } c \text{ with } P(X \le c) = 3/4)$ as an ordered pair.'
      answer: '$(1/2, 8)$'
      solution_sketch: 'Length $4$ of $8$: $1/2$; $c = 2 + \frac{3}{4} \cdot 8 = 8$.'
    anki_seeds:
      - front: 'Discrete uniform on $n$ values: each value has probability...'
        back: '$\frac{1}{n}$.'
        type: basic
      - front: 'For a continuous uniform distribution, $P(a \le X \le b) =$ ?'
        back: '$\frac{b - a}{\text{total length}}$ — probability is proportional to length.'
        type: basic
      - front: 'Mean of a uniform distribution on $[a, b]$?'
        back: 'The midpoint $\frac{a+b}{2}$.'
        type: basic
