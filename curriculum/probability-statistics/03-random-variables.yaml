          - problem: 'A board game player must roll a $6$ to start. What is the probability that she starts within her first $4$ rolls of a fair die?'
            answer: '671/1296'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Four rolls without a six have probability $(5/6)^4 = 625/1296$. So the probability is $1 - 625/1296 = 671/1296$.'
        constraints: "k <= 4; allow either summing cases or the all-failures complement; includes finding p"
    diagnostic_exemplar:
