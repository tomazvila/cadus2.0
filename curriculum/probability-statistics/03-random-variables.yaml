      - id: kp2
        name: "First success on trial k"
        key_prerequisites: [independent-events, multiplying-fractions]
        exemplars:
          - problem: 'A fair die is rolled until a $6$ appears. What is the probability that the first $6$ comes on the third roll?'
            answer: '25/216'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The first two rolls must not be sixes, each with probability $5/6$. The third roll must be a six, with probability $1/6$. The product is $(5/6)^2 \cdot 1/6 = 25/216$.'
          - problem: 'A fair coin is flipped until it shows heads. What is the probability that the first head comes on the fourth flip?'
            answer: '1/16'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The first three flips must be tails, and the fourth must be heads. The probability is $(1/2)^3 \cdot 1/2 = 1/16$.'
          - problem: 'A spinner lands on red with probability $1/3$ on each spin, independently. What is the probability that the first red comes on the third spin?'
            answer: '4/27'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The first two spins must not be red, each with probability $2/3$. The third must be red, with probability $1/3$. The product is $(2/3)^2 \cdot 1/3 = 4/27$.'
          - problem: 'A machine makes a defective part with probability $1/4$, independently for each part. What is the probability that the fourth part made is the first defective one?'
            answer: '27/256'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The first three parts must be good, each with probability $3/4$. The fourth must be defective, with probability $1/4$. The product is $(3/4)^3 \cdot 1/4 = 27/256$.'
          - problem: 'A basketball player makes a free throw with probability $1/2$, independently on each attempt. What is the probability that her first made free throw is on the third attempt?'
            answer: '1/8'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'She must miss the first two attempts and make the third. The probability is $(1/2)^2 \cdot 1/2 = 1/8$.'
          - problem: 'A card is drawn from a full deck, looked at, put back and the deck is shuffled. This is repeated until a heart is drawn. What is the probability that the first heart comes on the third draw?'
            answer: '9/64'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A heart has probability $1/4$ on each draw. The first two draws must not be hearts, each with probability $3/4$. The product is $(3/4)^2 \cdot 1/4 = 9/64$.'
          - problem: 'A fair coin is flipped until it shows heads. The probability that the first head comes on flip $n$ is $1/64$. What is $n$?'
            answer: '6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The probability of the first head on flip $n$ is $(1/2)^{n-1} \cdot 1/2 = (1/2)^n$. Since $1/64 = (1/2)^6$, the number is $n = 6$.'
          - problem: 'A shooter hits a target with probability $0.8$ on each shot, independently. What is the probability that her first hit comes on the third shot?'
            answer: '4/125'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'She must miss twice, each with probability $0.2$, and then hit with probability $0.8$. The product is $0.2^2 \cdot 0.8 = 0.032 = 4/125$.'
        constraints: "k <= 4; p a simple fraction, a decimal or a percent; includes finding k from the probability"
      - id: kp3
        name: "First success within k trials"
        key_prerequisites: [independent-events]
        exemplars:
          - problem: 'A fair coin is flipped until it shows heads. What is the probability that the first head comes within $2$ flips?'
            answer: '3/4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The only way to have no head within two flips is tails twice, with probability $(1/2)^2 = 1/4$. So the probability is $1 - 1/4 = 3/4$.'
          - problem: 'A machine part works on each trial with probability $1/3$, independently. What is the probability that the first success comes within two trials?'
            answer: '5/9'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Two failures in a row have probability $(2/3)^2 = 4/9$. So the first success comes within two trials with probability $1 - 4/9 = 5/9$.'
          - problem: 'A fair die is rolled until a $6$ appears. What is the probability that the first $6$ comes within $3$ rolls?'
            answer: '91/216'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Three rolls without a six have probability $(5/6)^3 = 125/216$. So the probability is $1 - 125/216 = 91/216$.'
          - problem: 'A game has independent rounds, and each round is won with probability $2/5$. What is the probability that the first win happens within the first $2$ rounds?'
            answer: '16/25'
            answer_contract: {"kind": "exact"}
