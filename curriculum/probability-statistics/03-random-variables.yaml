          - problem: 'In a sequence of independent trials, the probability that the first success comes within $2$ trials is $9/25$. What is the success probability $p$ of one trial?'
            answer: '1/5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Two failures have probability $1 - 9/25 = 16/25$. So $(1-p)^2 = 16/25$ and $1 - p = 4/5$, which gives $p = 1/5$.'
          - problem: 'Each day has a $0.3$ chance of rain, independently of the other days. What is the probability that it rains on at least one of the next $3$ days?'
            answer: '657/1000'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Three dry days in a row have probability $0.7^3 = 0.343$. So at least one rainy day has probability $1 - 0.343 = 0.657 = 657/1000$.'
          - problem: 'An archer hits the target with probability $1/4$ on each shot, independently. What is the probability that she needs more than $3$ shots to score the first hit?'
            answer: '27/64'
            answer_contract: {"kind": "exact"}
