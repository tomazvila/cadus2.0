            answer_contract: {"kind": "exact"}
            solution_sketch: 'The inspection stops at the first pass, so the number of items is geometric with $p = 4/9$. The expected number of items is $1/p = 9/4$.'
          - problem: 'A sales agent needs $8$ calls on average to make a sale, and every call has the same chance of success. What is the probability that a single call ends in a sale?'
            answer: '1/8'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The average number of calls is $1/p = 8$. Dividing gives $p = 1/8$.'
          - problem: 'A raffle ticket wins with probability $2/13$. Tickets are drawn one at a time, with replacement, until the first win. What is the expected number of tickets drawn?'
            answer: '13/2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The number of tickets until the first win is geometric with $p = 2/13$. The expected number of tickets is $1/p = 13/2$.'
          - problem: 'Trials succeed with probability $2/5$. What is the expected number of trials until the first success?'
            answer: '5/2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The number of trials until the first success is geometric with $p = 2/5$. The expected number of trials is $1/p = 5/2$.'
          - problem: '$X$ is geometric with $p = 3/8$. What is $E[X]$?'
            answer: '8/3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The mean of a geometric variable is $1/p$. So $E[X] = 1/(3/8) = 8/3$.'
          - problem: 'Marta rolls a fair die until she gets a number divisible by $3$. What is the expected number of rolls?'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The numbers $3$ and $6$ are divisible by $3$, so the success probability is $2/6 = 1/3$. The expected number of rolls is $1/p = 3$.'
          - problem: 'A fair coin is flipped until it shows heads, and each flip takes $3$ seconds. What is the expected total time for the flips?'
            answer: '6'
            answer_contract: {"kind": "unit", "quantity": "time", "unit": "s", "allow_omitted": true}
            solution_sketch: 'The expected number of flips is $1/(1/2) = 2$. Each flip takes $3$ seconds, so the expected time is $2 \cdot 3 = 6$ seconds.'
        constraints: "p a simple fraction, a decimal or an average count; answer 1/p exactly"
    diagnostic_exemplar:
      problem: '$X$ is geometric with $p = \frac{1}{3}$. Find $P(X = 2)$, $P(X > 2)$ and $E[X]$.'
      answer: '$(2/9, 4/9, 3)$'
      solution_sketch: '$P(X=2) = \frac{2}{3}\cdot\frac{1}{3} = \frac{2}{9}$; $P(X > 2) = \left(\frac{2}{3}\right)^2 = \frac{4}{9}$; $E[X] = 1/p = 3$.'
    anki_seeds:
      - front: 'Geometric probability formula (first success on trial $k$)?'
        back: '$P(X = k) = (1-p)^{k-1} p$.'
        type: basic
      - front: 'Mean of a geometric random variable?'
        back: '$E[X] = \frac{1}{p}$.'
        type: basic
      - front: 'Geometric tail: $P(X > k) =$ ?'
        back: '$(1-p)^k$ — the first $k$ trials all fail.'
        type: basic

  - id: uniform-distribution
    name: "Uniform Distributions"
    core: false                # terminal probability-model branch
    difficulty: 0.45
    drill: false
    answer_kind: numeric
    expected_time_secs: 120
    prerequisites:
      - id: discrete-random-variables
        weight: 0.6
        key: true
      - id: geometric-probability-models
        weight: 0.5
        key: false
    knowledge_points:
      - id: kp1
        name: "Discrete uniform distributions"
        key_prerequisites: [discrete-random-variables]
        exemplars:
          - problem: '$X$ is a random integer from $1$ to $10$, all equally likely. Find $P(X \le 3)$.'
            answer: '3/10'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'There are $10$ equally likely values, and $3$ of them are at most $3$. So $P(X \le 3) = 3/10$.'
          - problem: '$X$ is a random integer from $1$ to $9$, all equally likely. What is $E[X]$?'
            answer: '5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The mean of equally likely integers is halfway between the smallest and the largest. So $E[X] = (1 + 9)/2 = 5$.'
          - problem: '$X$ is a random integer from $1$ to $20$, all equally likely. Find $P(X \le 7)$.'
            answer: '7/20'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'There are $20$ equally likely values, and $7$ of them are at most $7$. So $P(X \le 7) = 7/20$.'
          - problem: '$X$ is a random integer from $2$ to $19$, all equally likely. Find $P(X \ge 12)$.'
            answer: '4/9'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'There are $19 - 2 + 1 = 18$ values, and $8$ of them are at least $12$, namely $12$ to $19$. So the probability is $8/18 = 4/9$.'
          - problem: 'A raffle ticket is drawn at random from tickets numbered $1$ to $200$. What is the probability that the number on it is a multiple of $5$?'
            answer: '1/5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Every $5$th number is a multiple of $5$, so $200/5 = 40$ tickets qualify. The probability is $40/200 = 1/5$.'
          - problem: '$X$ is a random integer from $1$ to $16$, all equally likely. Find $P(4 \le X \le 11)$.'
            answer: '1/2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The values $4$ to $11$ number $11 - 4 + 1 = 8$. So the probability is $8/16 = 1/2$.'
          - problem: '$X$ is a random integer from $3$ to $20$, all equally likely. What is $E[X]$?'
            answer: '23/2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The mean is halfway between the smallest and the largest value. So $E[X] = (3 + 20)/2 = 23/2$.'
          - problem: 'A ticket is drawn at random from $25$ tickets numbered $1$ to $25$. What is the probability that its number is prime?'
            answer: '9/25'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The primes up to $25$ are $2, 3, 5, 7, 11, 13, 17, 19, 23$, which is $9$ numbers. So the probability is $9/25$.'
          - problem: 'Ravi says that for a random integer $X$ from $2$ to $19$, the probability of $X = 5$ is $1/19$. What is the correct probability?'
            answer: '1/18'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The values $2$ to $19$ number $19 - 2 + 1 = 18$, and not $19$. So each value has probability $1/18$.'
        constraints: "n <= 200 equally likely integers; means are integers or half-integers"
      - id: kp2
        name: "Continuous uniform as length"
        key_prerequisites: [geometric-probability-models]
        try_first:
          problem: 'A rope $10$ metres long is cut at a point chosen at random along it. What is the probability that the cut is within the first $4$ metres from the left end?'
          answer_contract: {"kind": "exact"}
          answer: '2/5'
          reveal: 'There is no list of equally likely outcomes, but every metre of the rope is equally likely to hold the cut. So the probability is the length $4$ divided by the total length $10$.'
        exemplars:
          - problem: '$X$ is uniform on $[0, 10]$. Find $P(2 \le X \le 5)$.'
            answer: '3/10'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The event has length $5 - 2 = 3$, and the whole interval has length $10$. So the probability is $3/10$.'
          - problem: 'You arrive at a bus stop, and the bus comes at a uniformly random time within the next $20$ minutes. What is the probability that you wait more than $15$ minutes?'
            answer: '1/4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'You wait more than $15$ minutes if the bus comes in the last $5$ minutes of the $20$. So the probability is $5/20 = 1/4$.'
          - problem: '$X$ is uniform on $[2, 14]$. What is the probability that $X$ lies between $5$ and $11$?'
            answer: '1/2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The event has length $11 - 5 = 6$, and the interval has length $14 - 2 = 12$. So the probability is $6/12 = 1/2$.'
          - problem: 'A train arrives at a uniformly random time during a $40$-minute period. What is the probability that it arrives in the last $15$ minutes?'
            answer: '3/8'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The last $15$ minutes are $15$ of the $40$ minutes. So the probability is $15/40 = 3/8$.'
          - problem: '$X$ is uniform on $[0, 9]$. What is the probability that $X$ is less than $2$ or greater than $7$?'
            answer: '4/9'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The two parts, $[0,2)$ and $(7,9]$, have total length $2 + 2 = 4$. The interval has length $9$, so the probability is $4/9$.'
          - problem: 'A wire $12$ metres long is cut at a random point. What is the probability that both pieces are at least $2$ metres long?'
            answer: '2/3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Both pieces are at least $2$ metres when the cut is between $2$ and $10$ metres from one end. That is a length of $8$ out of $12$, so the probability is $8/12 = 2/3$.'
          - problem: 'A delivery arrives at a uniformly random time between $1{:}00$ and $1{:}45$ in the afternoon. What is the probability that it arrives between $1{:}10$ and $1{:}25$?'
            answer: '1/3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The window from $1{:}10$ to $1{:}25$ lasts $15$ minutes, and the whole period lasts $45$ minutes. So the probability is $15/45 = 1/3$.'
          - problem: '$X$ is uniform on $[0, 15]$. What is the probability that $X$ is less than $5$ or greater than $8$?'
            answer: '4/5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The two parts have lengths $5$ and $7$, so the total length is $12$. The interval has length $15$, so the probability is $12/15 = 4/5$.'
          - problem: '$X$ is uniform on $[0, L]$, and $P(X \le 6) = 3/10$. What is $L$?'
            answer: '20'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The probability $P(X \le 6)$ is $6/L$, so $6/L = 3/10$. Then $L = 6 \cdot 10/3 = 20$.'
        constraints: "intervals with integer endpoints, or a real situation with a random time or position; includes finding the interval length from a probability"
      - id: kp3
        name: "Midpoints and percent points"
        key_prerequisites: [discrete-random-variables, geometric-probability-models]
        exemplars:
          - problem: '$X$ is uniform on $[4, 10]$. What is $E[X]$?'
            answer: '7'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The mean is the midpoint of the interval. So $E[X] = (4 + 10)/2 = 7$.'
          - problem: '$X$ is uniform on $[0, 8]$. Find the value $c$ with $P(X \le c) = 3/4$.'
            answer: '6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The probability $P(X \le c)$ is $c/8$, so $c/8 = 3/4$. Then $c = 6$.'
          - problem: 'The waiting time of a customer is uniform between $12$ and $30$ minutes. What is the expected waiting time?'
            answer: '21'
            answer_contract: {"kind": "unit", "quantity": "time", "unit": "min", "allow_omitted": true}
            solution_sketch: 'The expected value is the midpoint. So the expected waiting time is $(12 + 30)/2 = 21$ minutes.'
          - problem: 'The daily demand for a product is uniform between $5$ and $25$ litres. What demand $c$ is not exceeded on $60\%$ of the days?'
            answer: '17'
            answer_contract: {"kind": "unit", "quantity": "volume", "unit": "L", "allow_omitted": true}
            solution_sketch: 'The demand is at most $c$ on $60\%$ of the days, so $P(X \le c) = 0.6$. Then $c = 5 + 0.6 \cdot 20 = 17$ litres.'
          - problem: '$X$ is uniform on $[a, 20]$, and its mean is $14$. What is $a$?'
            answer: '8'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The mean is the midpoint, so $(a + 20)/2 = 14$. Then $a + 20 = 28$ and $a = 8$.'
          - problem: 'The error of a measuring device is uniform between $10$ and $30$ millimetres. What error $c$ is exceeded in only $25\%$ of the measurements?'
            answer: '25'
            answer_contract: {"kind": "unit", "quantity": "length", "unit": "mm", "allow_omitted": true}
            solution_sketch: 'The error is at least $c$ in $25\%$ of the cases, so the top quarter of the interval starts at $c$. The interval has length $20$, so $c = 30 - 0.25 \cdot 20 = 25$ millimetres.'
          - problem: 'A bus comes every $20$ minutes, and a passenger arrives at a random moment, so the waiting time is uniform between $0$ and $20$ minutes. What is the average waiting time?'
            answer: '10'
            answer_contract: {"kind": "unit", "quantity": "time", "unit": "min", "allow_omitted": true}
            solution_sketch: 'The average is the midpoint of $0$ and $20$. So the average waiting time is $10$ minutes.'
          - problem: 'A bus comes every $20$ minutes, and a passenger arrives at a random moment, so the waiting time is uniform between $0$ and $20$ minutes. Only $10\%$ of the passengers wait longer than a time $c$. What is $c$?'
            answer: '18'
            answer_contract: {"kind": "unit", "quantity": "time", "unit": "min", "allow_omitted": true}
            solution_sketch: 'The top tenth of the interval from $0$ to $20$ has length $2$. So $c = 20 - 2 = 18$ minutes.'
          - problem: 'A random number generator picks a number uniformly between $-3$ and $9$. What is the mean of the numbers it picks?'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The mean of a uniform variable is the midpoint of its interval. So the mean is $(-3 + 9)/2 = 3$.'
        constraints: "endpoints and target probabilities chosen so answers are integers; includes a missing endpoint and measured quantities"
    diagnostic_exemplar:
      problem: '$X$ is uniform on $[2, 10]$. Find $P(3 \le X \le 7)$ and the value $c$ with $P(X \le c) = 3/4$.'
      answer: '$(1/2, 8)$'
      solution_sketch: 'Length $4$ of $8$: $1/2$; $c = 2 + \frac{3}{4} \cdot 8 = 8$.'
    anki_seeds:
      - front: 'Discrete uniform on $n$ values: each value has probability...'
        back: '$\frac{1}{n}$.'
        type: basic
      - front: 'For a continuous uniform distribution, $P(a \le X \le b) =$ ?'
        back: '$\frac{b - a}{\text{total length}}$ — probability is proportional to length.'
        type: basic
      - front: 'Mean of a uniform distribution on $[a, b]$?'
        back: 'The midpoint $\frac{a+b}{2}$.'
        type: basic
