unit: random-variables
course: probability-statistics
module: "Random Variables & Distributions"
topics:
  - id: discrete-probability-distributions
    name: "Discrete Probability Distributions"
    core: true
    difficulty: 0.4
    drill: false
    answer_kind: numeric
    expected_time_secs: 120
    prerequisites:
      - id: basic-probability
        weight: 0.7
        key: true
      - id: decimal-operations
        weight: 0.3
        key: false
    knowledge_points:
      - id: kp1
        name: 'Random variables and their tables'
        key_prerequisites: [basic-probability]
        constraints: 'random variables built from coins, dice, children, or draws with replacement; one probability per question; exact fractions'
        try_first:
          problem: 'A fair coin is flipped three times, and $X$ is the number of heads. Find $P(X=2)$.'
          answer_contract: {"kind": "exact"}
          answer: '3/8'
          reveal: 'The outcomes with two heads are $HHT$, $HTH$ and $THH$, which is $3$ of the $8$ equally likely outcomes. So $P(X=2)=3/8$, and every entry of a distribution is built this way.'
        exemplars:
          - problem: 'Let $X$ be the number of heads in two flips of a fair coin. Find $P(X=1)$.'
            answer: '1/2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Two flips have four equally likely outcomes: $HH$, $HT$, $TH$ and $TT$. Exactly one head appears in $HT$ and $TH$, so $P(X=1)=2/4=1/2$.'
          - problem: 'Two fair six-sided dice are rolled, and $X$ is the sum of the two numbers. Find $P(X=7)$.'
            answer: '1/6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Two dice give $6\cdot6=36$ equally likely pairs. Six of them add to $7$: $(1,6)$, $(2,5)$, $(3,4)$, $(4,3)$, $(5,2)$ and $(6,1)$. So $P(X=7)=6/36=1/6$.'
          - problem: 'Let $X$ be the number of heads in four flips of a fair coin. Find $P(X=3)$.'
            answer: '1/4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Four flips have $2^4=16$ equally likely outcomes. Exactly three heads occur when the single tail is in one of $4$ positions, so $P(X=3)=4/16=1/4$.'
          - problem: 'A family has three children, and each child is equally likely to be a girl or a boy, independently of the others. Let $X$ be the number of girls. Find $P(X=1)$.'
            answer: '3/8'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'There are $2^3=8$ equally likely birth orders. Exactly one girl occurs in $GBB$, $BGB$ and $BBG$, which is $3$ orders. So $P(X=1)=3/8$.'
          - problem: 'Let $X$ be the number of sixes in three rolls of a fair die. Find $P(X=1)$.'
            answer: '25/72'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'One chosen roll is a six and the other two are not, which has probability $(1/6)(5/6)^2=25/216$. The six can fall on any of $3$ rolls, so $P(X=1)=3\cdot25/216=25/72$.'
          - problem: 'A bag holds $4$ red marbles and $6$ blue marbles. A marble is drawn, its color is noted, and it is put back. Then a second marble is drawn. Let $X$ be the number of red marbles drawn. Find $P(X=1)$.'
            answer: '12/25'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Red then blue has probability $(4/10)(6/10)=6/25$, and blue then red has the same probability. Exactly one red marble can come in either order, so $P(X=1)=2\cdot6/25=12/25$.'
          - problem: 'Two fair six-sided dice are rolled, and $X$ is the smaller of the two numbers. Find $P(X=6)$.'
            answer: '1/36'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The smaller number is $6$ only when both dice show $6$. That is $1$ of the $36$ equally likely pairs, so $P(X=6)=1/36$.'
          - problem: 'Sam says that $X$, the number of heads in two flips of a fair coin, has $P(X=1)=1/3$ because $X$ can be $0$, $1$ or $2$. What is the correct value of $P(X=1)$?'
            answer: '1/2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The values $0$, $1$ and $2$ are not equally likely, because the four outcomes $HH$, $HT$, $TH$ and $TT$ are. Two of those outcomes give one head, so $P(X=1)=2/4=1/2$.'
          - problem: 'Let $X$ be the number of tails in three flips of a fair coin. Find $P(X=0)$, $P(X=1)$, $P(X=2)$ and $P(X=3)$.'
            answer: '1/8, 3/8, 3/8, 1/8'
            answer_contract: {"kind": "list", "member": {"kind": "exact"}, "ordered": true}
            solution_sketch: 'Three flips have $2^3=8$ equally likely outcomes. The tail counts are $0$ for $1$ outcome, $1$ for $3$ outcomes, $2$ for $3$ outcomes and $3$ for $1$ outcome. So the probabilities are $1/8$, $3/8$, $3/8$ and $1/8$, and they add up to $1$.'
      - id: kp2
        name: 'Validity and missing probabilities'
        key_prerequisites: [decimal-operations]
        constraints: '3-4 values; one missing probability, an unknown multiple k, or a validity verdict; probabilities as fractions or decimals'
        exemplars:
          - problem: '$X$ takes the values $1$, $2$ and $3$, with $P(X=1)=0.2$ and $P(X=2)=0.5$. Find $P(X=3)$.'
            answer: '0.3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The three probabilities must add up to $1$. The two known ones total $0.2+0.5=0.7$, so $P(X=3)=1-0.7=0.3$.'
          - problem: 'A batch of parts contains $0$, $1$, $2$ or $3$ faulty parts. The probabilities are $0.55$ for none, $0.30$ for one and $0.10$ for two. Find the probability that the batch contains three faulty parts.'
            answer: '0.05'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The four probabilities must add up to $1$. The known ones total $0.55+0.30+0.10=0.95$, so the probability of three faulty parts is $1-0.95=0.05$.'
          - problem: 'A table gives $P(X=0)=1/2$, $P(X=1)=1/3$ and $P(X=2)=1/4$ for a random variable $X$. Is this a probability distribution?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "it is a probability distribution", "valid", "it is valid", "it is", "a valid distribution", "it is a valid distribution", "a probability distribution"], ["no", "it is not a probability distribution", "not a distribution", "invalid", "not valid", "it is not valid", "it is not a valid distribution", "not a valid distribution"]]}
            solution_sketch: 'The probabilities of a distribution must add up to $1$. Here $1/2+1/3+1/4=6/12+4/12+3/12=13/12$, which is more than $1$. So the answer is no.'
          - problem: '$X$ takes the values $0$, $1$ and $2$, with $P(X=0)=1/2$ and $P(X=1)=1/3$. Find $P(X=2)$.'
            answer: '1/6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The probabilities must add up to $1$. The known ones total $1/2+1/3=3/6+2/6=5/6$, so $P(X=2)=1-5/6=1/6$.'
          - problem: '$X$ takes the values $1$, $2$, $3$ and $4$ with probabilities $k$, $2k$, $3k$ and $4k$. Find $k$.'
            answer: '1/10'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The probabilities must add up to $1$, so $k+2k+3k+4k=10k=1$. Therefore $k=1/10$. Each of the four probabilities, such as $4k=4/10$, then lies between $0$ and $1$.'
          - problem: 'Sam proposes the probabilities $P(X=0)=0.2$, $P(X=1)=0.5$ and $P(X=2)=0.4$. Find the total of Sam''s three probabilities.'
            answer: '1.1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The sum is $0.2+0.5+0.4=1.1$. A distribution must total exactly $1$, so Sam''s table is not a valid distribution.'
          - problem: 'A table gives $P(X=0)=1/6$, $P(X=1)=1/3$ and $P(X=2)=1/2$ for a random variable $X$. Is this a probability distribution?'
            answer: 'yes'
            answer_contract: {"kind": "label", "options": [["yes", "it is a probability distribution", "valid", "it is valid", "it is", "a valid distribution", "it is a valid distribution", "a probability distribution"], ["no", "it is not a probability distribution", "not a distribution", "invalid", "not valid", "it is not valid", "it is not a valid distribution", "not a valid distribution"]]}
            solution_sketch: 'Each probability lies between $0$ and $1$. The total is $1/6+2/6+3/6=6/6=1$, so the table is a valid probability distribution. The answer is yes.'
          - problem: 'A game awards $0$, $5$ or $10$ points. The probability of $0$ points is $0.45$ and the probability of $10$ points is $0.15$. Find the probability of winning $5$ points.'
            answer: '0.4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The three probabilities must add up to $1$. The two known ones total $0.45+0.15=0.60$, so the probability of $5$ points is $1-0.60=0.4$.'
      - id: kp3
        name: 'Event probabilities from a table'
        key_prerequisites: [basic-probability]
        constraints: 'events such as X >= 2, X < 2 or a range over 3-5 listed values; sums of at most 3 probabilities; one error-analysis item'
        exemplars:
          - problem: '$X$ takes the values $1$, $2$ and $3$ with probabilities $1/6$, $1/3$ and $1/2$. Find $P(X\ge2)$.'
            answer: '5/6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The event $X\ge2$ means $X=2$ or $X=3$. Add the probabilities: $1/3+1/2=2/6+3/6=5/6$. The complement $1-P(X=1)=1-1/6$ gives the same value.'
          - problem: 'Let $X$ be the number of heads in two flips of a fair coin. Find $P(X\le1)$.'
            answer: '3/4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The event $X\le1$ means $X=0$ or $X=1$. Add the probabilities: $1/4+1/2=3/4$. The complement $1-P(X=2)=1-1/4$ gives the same value.'
          - problem: 'The number of cars $X$ waiting at a traffic light has $P(X=0)=0.20$, $P(X=1)=0.35$, $P(X=2)=0.25$, $P(X=3)=0.15$ and $P(X=4)=0.05$. Find the probability that more than $2$ cars are waiting.'
            answer: '0.2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'More than $2$ cars means $X=3$ or $X=4$. Add the probabilities: $0.15+0.05=0.2$.'
          - problem: '$X$ takes the values $0$, $1$, $2$ and $3$ with probabilities $1/8$, $3/8$, $3/8$ and $1/8$. Find $P(X\le2)$.'
            answer: '7/8'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The event $X\le2$ covers the values $0$, $1$ and $2$, so $P(X\le2)=1/8+3/8+3/8=7/8$. The complement gives the same value: $1-P(X=3)=1-1/8=7/8$.'
          - problem: '$X$ takes the values $-1$, $0$, $1$ and $2$ with probabilities $1/10$, $3/10$, $2/5$ and $1/5$. Find $P(-1\le X\le1)$.'
            answer: '4/5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The event covers the values $-1$, $0$ and $1$. Write every probability in tenths: $1/10+3/10+4/10=8/10=4/5$.'
          - problem: 'A spinner lands on the values $1$, $2$, $3$ and $4$ with probabilities $1/12$, $1/4$, $1/3$ and $1/3$. Find $P(X\le2)$.'
            answer: '1/3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The event $X\le2$ covers the values $1$ and $2$. Add the probabilities: $1/12+3/12=4/12=1/3$.'
          - problem: 'A quiz is marked from $0$ to $4$. The probabilities of the marks are $0.10$ for $0$, $0.10$ for $1$, $0.25$ for $2$, $0.35$ for $3$ and $0.20$ for $4$. A student passes with a mark of at least $3$. Find the probability that a student passes.'
            answer: '0.55'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A pass means a mark of $3$ or $4$. Add the probabilities: $0.35+0.20=0.55$.'
          - problem: '$X$ takes the values $0$, $1$, $2$ and $3$ with probabilities $0.1$, $0.3$, $0.4$ and $0.2$. Find $P(X<2)$.'
            answer: '0.4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The event $X<2$ covers only the values $0$ and $1$, because $2$ itself is not less than $2$. Add the probabilities: $0.1+0.3=0.4$.'
          - problem: '$X$ takes the values $1$, $2$, $3$ and $4$ with probabilities $0.1$, $0.2$, $0.3$ and $0.4$. Sam finds $P(X>2)$ by adding the probabilities of $2$, $3$ and $4$, and gets $0.9$. What is the correct value of $P(X>2)$?'
            answer: '0.7'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The event $X>2$ does not include the value $2$ itself. It covers $3$ and $4$ only, so $P(X>2)=0.3+0.4=0.7$.'
    diagnostic_exemplar:
      problem: '$X$ takes the values $1$, $2$ and $3$ with $P(X=1)=1/4$ and $P(X=2)=2/5$. Find $P(X \ge 2)$.'
      answer: '3/4'
      solution_sketch: '$P(X=3) = 1 - 1/4 - 2/5 = 7/20$, so $P(X \ge 2) = 2/5 + 7/20 = 3/4$.'
    anki_seeds:
      - front: 'The probabilities in a valid distribution must each be in $[0,1]$ and must sum to {{c1::1}}.'
        back: '1'
        type: cloze
      - front: 'A random variable is...'
        back: 'A numerical quantity whose value depends on the outcome of a random experiment.'
        type: basic

  - id: discrete-random-variables
    name: "Discrete Random Variables & Expected Value"
    core: true
    difficulty: 0.45
    drill: false
    answer_kind: numeric
    expected_time_secs: 150
    prerequisites:
      - id: discrete-probability-distributions
        weight: 0.8
        key: true
      - id: summation-notation
        weight: 0.5
        key: true
      - id: decimal-operations
        weight: 0.3
        key: false
    knowledge_points:
      - id: kp1
        name: 'Expected value'
        key_prerequisites: [discrete-probability-distributions, summation-notation]
        constraints: '3-4 values; E[X] a fraction or a short decimal; payouts in whole euros; one missing probability to find first'
        exemplars:
          - problem: '$X$ takes the values $0$, $1$ and $2$ with probabilities $1/4$, $1/2$ and $1/4$. Find $E[X]$.'
            answer: '1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Multiply each value by its probability and add: $0\cdot\frac14+1\cdot\frac12+2\cdot\frac14=0+\frac12+\frac12=1$. So $E[X]=1$, the weighted total of the values.'
          - problem: 'A fair six-sided die is rolled once. Find the expected value of the number shown.'
            answer: '7/2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Each face has probability $1/6$, so $E[X]=(1+2+3+4+5+6)/6=21/6=7/2$. The expected value $3.5$ is not a face of the die.'
          - problem: 'A game pays €10 with probability $1/5$ and nothing otherwise. Find the expected payout.'
            answer: '2'
            answer_contract: {"kind": "unit", "quantity": "euro", "unit": "euro", "allow_omitted": true}
            solution_sketch: 'The payout is €10 with probability $1/5$ and €0 with probability $4/5$. So $E=10\cdot\frac15+0\cdot\frac45=2$ euros.'
          - problem: '$X$ takes the values $1$, $2$, $3$ and $4$ with probabilities $1/10$, $2/10$, $3/10$ and $4/10$. Find $E[X]$.'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Multiply each value by its probability: $1/10+4/10+9/10+16/10=30/10$. So $E[X]=3$, the weighted total of the values.'
          - problem: 'A fair four-sided die has faces numbered $1$ to $4$. Find the expected value of one roll.'
            answer: '5/2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Each face has probability $1/4$, so $E=(1+2+3+4)/4=10/4=5/2$. The expected value $2.5$ is not a face of the die.'
          - problem: 'A game pays €5 with probability $1/4$, €10 with probability $1/4$ and nothing otherwise. Find the expected payout.'
            answer: '3.75'
            answer_contract: {"kind": "unit", "quantity": "euro", "unit": "euro", "allow_omitted": true}
            solution_sketch: 'The payouts €5, €10 and €0 have probabilities $1/4$, $1/4$ and $1/2$. So $E=5\cdot\frac14+10\cdot\frac14+0=\frac{15}{4}=3.75$ euros.'
          - problem: 'In a survey of households, the number of pets $X$ has $P(X=0)=0.3$, $P(X=1)=0.4$, $P(X=2)=0.2$ and $P(X=3)=0.1$. Find the expected number of pets per household.'
            answer: '1.1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Multiply each value by its probability: $0\cdot0.3+1\cdot0.4+2\cdot0.2+3\cdot0.1=0.4+0.4+0.3=1.1$. So $E[X]=1.1$ pets per household, although no household has $1.1$ pets.'
          - problem: 'A shop sells $2$ phones in a day with probability $0.5$, $3$ phones with probability $0.3$ and $5$ phones with probability $0.2$. Find the expected number of phones sold in a day.'
            answer: '2.9'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Multiply each value by its probability: $2\cdot0.5+3\cdot0.3+5\cdot0.2=1+0.9+1=2.9$. So the expected number of phones is $2.9$.'
          - problem: '$X$ takes the values $1$, $2$ and $3$ with $P(X=1)=0.2$ and $P(X=2)=0.5$. Find $E[X]$.'
            answer: '2.1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The missing probability is $P(X=3)=1-0.2-0.5=0.3$. Then $E[X]=1\cdot0.2+2\cdot0.5+3\cdot0.3=0.2+1+0.9=2.1$. So the expected value is $2.1$.'
      - id: kp2
        name: 'Expected value as a long-run average'
        key_prerequisites: [discrete-probability-distributions]
        constraints: 'one computation phrased as a long-run average, one where E[X] is not an attainable value, one total divided by plays'
        exemplars:
          - problem: 'A game pays €5 with probability $1/4$ and €1 with probability $3/4$. Over many plays, what is the average payout per play?'
            answer: '2'
            answer_contract: {"kind": "unit", "quantity": "euro", "unit": "euro", "allow_omitted": true}
            solution_sketch: 'The long-run average is the expected value: $5\cdot\frac14+1\cdot\frac34=\frac54+\frac34=2$ euros per play. This is also the value the average payout settles near after very many plays.'
          - problem: 'A fair coin is flipped once. Let $X=1$ for heads and $X=0$ for tails. Find $E[X]$.'
            answer: '1/2'
            answer_contract: {"kind": "exact"}
            solution_sketch: '$E[X]=1\cdot\frac12+0\cdot\frac12=\frac12$. The long-run average $1/2$ is not a value that $X$ itself ever takes.'
          - problem: 'A fair six-sided die is rolled many times. What does the average of the numbers shown settle near?'
            answer: '7/2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Each of the values $1$ to $6$ has probability $1/6$. The long-run average is $E[X]=21/6=7/2$.'
          - problem: 'A fair coin is flipped three times, and $X$ is the number of heads. Over many sets of three flips, what is the average value of $X$?'
            answer: '3/2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The values $0$, $1$, $2$, $3$ have probabilities $1/8$, $3/8$, $3/8$, $1/8$. Then $E[X]=(0+3+6+3)/8=12/8=3/2$.'
          - problem: 'A carnival wheel pays €0 with probability $0.5$, €5 with probability $0.3$ and €20 with probability $0.2$. Find the average payout over many spins.'
            answer: '5.5'
            answer_contract: {"kind": "unit", "quantity": "euro", "unit": "euro", "allow_omitted": true}
            solution_sketch: 'Multiply each payout by its probability: $0+1.5+4=5.5$. The average payout is $5.5$ euros per spin.'
          - problem: 'A raffle sells $200$ tickets, and one ticket wins a prize of $80$ dollars. Find the average winnings per ticket over many raffles.'
            answer: '0.4'
            answer_contract: {"kind": "unit", "quantity": "dollar", "unit": "dollar", "allow_omitted": true}
            solution_sketch: 'The prize has probability $1/200$, so $E=80\cdot\frac1{200}=\frac{2}{5}=0.4$ dollars. This is the same as the prize divided by the number of tickets.'
          - problem: 'Anna plays a game that pays €0 or €9 on each play, with an expected payout of €4.50 per play. Can she win exactly €4.50 on one play?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "she can", "it is possible", "she can win"], ["no", "she cannot", "she cant", "she can not", "it is not possible", "impossible", "not possible", "no she cannot"]]}
            solution_sketch: 'Each single play pays €0 or €9, never €4.50. The expected payout is a long-run average over many plays, so it need not be a payout that one play can give. The answer is no.'
          - problem: 'Over $400$ plays of a game, a player wins a total of €300. What is the average winnings per play?'
            answer: '0.75'
            answer_contract: {"kind": "unit", "quantity": "euro", "unit": "euro", "allow_omitted": true}
            solution_sketch: 'The average per play is the total divided by the number of plays: $300/400=3/4=0.75$ euros. Multiplying the two numbers would not give a per-play value.'
      - id: kp3
        name: 'Linearity: E[aX + b]'
        key_prerequisites: [summation-notation]
        constraints: 'a, b small integers; money answers; one item that solves for E[X] or E[H] from a given E[aX + b]'
        exemplars:
          - problem: 'Given $E[X]=4$, find $E[3X-2]$.'
            answer: '10'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Use $E[aX+b]=aE[X]+b$ with $a=3$ and $b=-2$. Then $E[3X-2]=3\cdot4-2=10$. The constant $-2$ is added once, after the scaling.'
          - problem: 'A raffle ticket costs €2, and its prize $W$ in euros has $E[W]=0.50$. Find the expected net gain from buying one ticket.'
            answer: '-1.5'
            answer_contract: {"kind": "unit", "quantity": "euro", "unit": "euro", "allow_omitted": true}
            solution_sketch: 'The net gain is $W-2$, so $E[W-2]=0.5-2=-1.5$. The buyer expects to lose €1.50 per ticket.'
          - problem: 'Given $E[X]=6$, find $E[4X-5]$.'
            answer: '19'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Use $E[aX+b]=aE[X]+b$ with $a=4$ and $b=-5$. Then $E[4X-5]=4\cdot6-5=24-5=19$. The constant $-5$ is added once, after the scaling.'
          - problem: 'A game costs $3$ dollars to play. The winnings $W$ in dollars have $E[W]=1.25$. Find the expected net gain.'
            answer: '-1.75'
            answer_contract: {"kind": "unit", "quantity": "dollar", "unit": "dollar", "allow_omitted": true}
            solution_sketch: 'The net gain is $W-3$, so $E[W-3]=E[W]-3=1.25-3=-1.75$ dollars. The player expects to lose $1.75$ dollars per game.'
          - problem: 'Suppose $E[5X+1]=26$. Find $E[X]$.'
            answer: '5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'By linearity $E[5X+1]=5E[X]+1$. Set this equal to $26$: $5E[X]=25$, so $E[X]=5$. As a check, $5\cdot5+1=26$.'
          - problem: 'The number of customers $X$ at a shop has $E[X]=2.1$, and the daily revenue in dollars is $10X+7$. Find the expected daily revenue.'
            answer: '28'
            answer_contract: {"kind": "unit", "quantity": "dollar", "unit": "dollar", "allow_omitted": true}
            solution_sketch: 'The revenue is linear in $X$, so $E[10X+7]=10\cdot2.1+7=21+7=28$ dollars. The customers contribute $21$ dollars and the fixed amount adds $7$.'
          - problem: 'A taxi fare in dollars is $4+2D$, where $D$ is the distance in kilometers and $E[D]=7.5$. Find the expected fare.'
            answer: '19'
            answer_contract: {"kind": "unit", "quantity": "dollar", "unit": "dollar", "allow_omitted": true}
            solution_sketch: 'Use linearity: $E[4+2D]=4+2E[D]=4+2\cdot7.5=19$ dollars. The fixed charge $4$ is added once, and only the distance term is scaled.'
          - problem: 'A worker earns €15 per hour plus a €20 bonus, so the pay is $15H+20$, where $H$ is the hours worked. The expected pay is €110. Find $E[H]$.'
            answer: '6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'By linearity $15E[H]+20=110$. Subtract $20$ to get $15E[H]=90$, then divide by $15$: $E[H]=6$ hours.'
          - problem: 'Given $E[X]=5$, Sam computes $E[2X+3]$ as $2(5+3)=16$. What is the correct value of $E[2X+3]$?'
            answer: '13'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The $3$ is added after the $2$ scales the average, not before. So $E[2X+3]=2\cdot5+3=13$.'
    diagnostic_exemplar:
      problem: '$X$ takes values $0, 1, 2$ with probabilities $1/6, 1/2, 1/3$. Find $E[3X + 2]$.'
      answer: '11/2'
      solution_sketch: '$E[X] = 0 + 1/2 + 2/3 = 7/6$; $E[3X + 2] = 3 \cdot 7/6 + 2 = 11/2$.'
    anki_seeds:
      - front: 'Expected value of a discrete random variable?'
        back: '$E[X] = \sum x_i \, p_i$ — each value weighted by its probability.'
        type: basic
      - front: 'Linearity of expectation: $E[aX + b] =$ ?'
        back: '$aE[X] + b$.'
        type: basic

  - id: expected-value-applications
    name: "Expected Value Applications"
    core: false                # applications leaf topic
    difficulty: 0.5
    drill: false
    answer_kind: numeric
    expected_time_secs: 180
    prerequisites:
      - id: discrete-random-variables
        weight: 0.8
        key: true
    knowledge_points:
      - id: kp1
        name: 'Fair games and fair prices'
        key_prerequisites: [discrete-random-variables]
        constraints: 'payouts in whole euros; fair price is E[payout]; one fair-or-not verdict; one price from tickets sold'
        exemplars:
          - problem: 'A game costs €2 to play. It pays €10 with probability $1/5$ and nothing otherwise. Find the expected net gain.'
            answer: '0'
            answer_contract: {"kind": "unit", "quantity": "euro", "unit": "euro", "allow_omitted": true}
            solution_sketch: 'The expected payout is $10\cdot\frac15=2$ euros. The net gain is the payout minus the €2 price, so the expected net gain is $2-2=0$.'
          - problem: 'You roll a fair die and win as many euros as the number shown. What entry price makes the game fair?'
            answer: '3.5'
            answer_contract: {"kind": "unit", "quantity": "euro", "unit": "euro", "allow_omitted": true}
            solution_sketch: 'A game is fair when the entry price equals the expected payout. The expected payout is $(1+2+3+4+5+6)/6=3.5$ euros.'
          - problem: 'A raffle ticket pays €6 with probability $0.2$, €3 with probability $0.4$ and nothing with probability $0.4$. Find the fair price of the ticket.'
            answer: '2.4'
            answer_contract: {"kind": "unit", "quantity": "euro", "unit": "euro", "allow_omitted": true}
            solution_sketch: 'The fair price equals the expected payout: $6\cdot0.2+3\cdot0.4+0\cdot0.4=1.2+1.2=2.4$ euros. A player who pays $2.4$ euros neither gains nor loses on average.'
          - problem: 'A game costs €5 to play. It pays €20 with probability $1/2$ and nothing otherwise. Find the expected net gain.'
            answer: '5'
            answer_contract: {"kind": "unit", "quantity": "euro", "unit": "euro", "allow_omitted": true}
            solution_sketch: 'The expected payout is $20\cdot\frac12=10$ euros. Subtract the €5 price: the expected net gain is $10-5=5$ euros.'
          - problem: 'A game pays €$y$ with probability $1/5$, €6 with probability $1/2$ and nothing otherwise. Its fair price is €5. Find $y$.'
            answer: '10'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The fair price equals the expected payout, so $5=y/5+6\cdot\frac12=y/5+3$. Then $y/5=2$, so $y=10$.'
          - problem: 'A lottery ticket pays €15 with probability $1/6$, €6 with probability $1/3$ and nothing otherwise. Find the fair price of the ticket.'
            answer: '4.5'
            answer_contract: {"kind": "unit", "quantity": "euro", "unit": "euro", "allow_omitted": true}
            solution_sketch: 'The fair price equals the expected payout: $15\cdot\frac16+6\cdot\frac13=2.5+2=4.5$ euros. A player who pays $4.5$ euros neither gains nor loses on average.'
          - problem: 'A game costs €5 to play and pays €15 with probability $1/3$ and nothing otherwise. Is the game fair?'
            answer: 'yes'
            answer_contract: {"kind": "label", "options": [["yes", "it is fair", "fair", "the game is fair", "it is a fair game", "a fair game"], ["no", "it is not fair", "not fair", "unfair", "the game is not fair", "it is unfair", "the game is unfair", "not a fair game"]]}
            solution_sketch: 'The expected payout is $15\cdot\frac13=5$ euros, which equals the €5 price. The expected net gain is $0$, so the game is fair. The answer is yes.'
          - problem: 'A charity sells $500$ raffle tickets and awards one prize of €400. What ticket price makes the raffle fair?'
            answer: '0.8'
            answer_contract: {"kind": "unit", "quantity": "euro", "unit": "euro", "allow_omitted": true}
            solution_sketch: 'Each ticket has probability $1/500$ of winning, so the expected payout per ticket is $400/500=0.8$ euros. The fair price equals this value.'
      - id: kp2
        name: 'Insurance and warranties'
        key_prerequisites: [discrete-random-variables]
        constraints: 'claim probabilities are unit fractions; expected payouts come out to whole euros; includes a premium, a payout, a claim probability and a total over many policies'
        exemplars:
          - problem: 'An insurer charges €50 for a policy that pays €1000 with probability $1/25$. Find the insurer''s expected profit per policy.'
            answer: '10'
            answer_contract: {"kind": "unit", "quantity": "euro", "unit": "euro", "allow_omitted": true}
            solution_sketch: 'The expected payout is $1000\cdot\frac1{25}=40$ euros. The expected profit is the price minus this: $50-40=10$ euros.'
          - problem: 'A €20 warranty pays for a €300 replacement with probability $1/20$. Find the seller''s expected profit per warranty.'
            answer: '5'
            answer_contract: {"kind": "unit", "quantity": "euro", "unit": "euro", "allow_omitted": true}
            solution_sketch: 'The expected payout is $300\cdot\frac1{20}=15$ euros. The expected profit is $20-15=5$ euros.'
          - problem: 'An insurer charges €72 for a policy that pays €1440 with probability $1/24$. Find the insurer''s expected profit per policy.'
            answer: '12'
            answer_contract: {"kind": "unit", "quantity": "euro", "unit": "euro", "allow_omitted": true}
            solution_sketch: 'The expected payout is $1440\cdot\frac1{24}=60$ euros. The expected profit is $72-60=12$ euros.'
          - problem: 'A warranty costs the buyer €18 and pays for a €900 replacement with probability $1/50$. Find the seller''s expected profit per warranty.'
            answer: '0'
            answer_contract: {"kind": "unit", "quantity": "euro", "unit": "euro", "allow_omitted": true}
            solution_sketch: 'The expected payout is $900\cdot\frac1{50}=18$ euros, which equals the price. So the expected profit is $18-18=0$, and the seller just breaks even.'
          - problem: 'An insurer wants an expected profit of €15 per policy. A policy pays €2400 with probability $1/30$. What premium should the insurer charge?'
            answer: '95'
            answer_contract: {"kind": "unit", "quantity": "euro", "unit": "euro", "allow_omitted": true}
            solution_sketch: 'The expected payout is $2400\cdot\frac1{30}=80$ euros. The premium must cover this and the profit: $80+15=95$ euros.'
          - problem: 'A policy costs €45, and the insurer earns an expected profit of €25 per policy. The policy pays a claim with probability $1/35$. Find the claim payout.'
            answer: '700'
            answer_contract: {"kind": "unit", "quantity": "euro", "unit": "euro", "allow_omitted": true}
            solution_sketch: 'The expected payout is the price minus the profit: $45-25=20$ euros. Since $\text{payout}\cdot\frac1{35}=20$, the payout is $20\cdot35=700$ euros.'
          - problem: 'An insurer sells $2000$ policies at €30 each. Each policy pays €600 with probability $1/25$. Find the insurer''s expected total profit.'
            answer: '12000'
            answer_contract: {"kind": "unit", "quantity": "euro", "unit": "euro", "allow_omitted": true}
            solution_sketch: 'The expected payout per policy is $600\cdot\frac1{25}=24$ euros, so the expected profit per policy is $30-24=6$ euros. For $2000$ policies the total is $2000\cdot6=12000$ euros.'
          - problem: 'A policy pays €900 if a claim occurs, and the insurer charges €36. The insurer expects exactly zero profit. Find the probability of a claim.'
            answer: '1/25'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Zero profit means the price equals the expected payout, so $900p=36$. Divide: $p=36/900=1/25$.'
          - problem: 'Sam says that on a €40 policy that pays €800 with probability $1/50$, the insurer''s expected profit is $40-800=-760$ euros. What is the correct expected profit?'
            answer: '24'
            answer_contract: {"kind": "unit", "quantity": "euro", "unit": "euro", "allow_omitted": true}
            solution_sketch: 'The claim of €800 is paid only with probability $1/50$, so the expected payout is $800\cdot\frac1{50}=16$ euros. The expected profit is $40-16=24$ euros.'
      - id: kp3
        name: 'Comparing options by expected value'
        key_prerequisites: [discrete-random-variables]
        constraints: 'two options or one net-gain computation; one three-way verdict; one number of tickets from the fair-raffle condition'
        exemplars:
          - problem: 'Option A pays a sure €4. Option B pays €12 with probability $2/5$ and nothing otherwise. Find the expected value of the better option.'
            answer: '4.8'
            answer_contract: {"kind": "unit", "quantity": "euro", "unit": "euro", "allow_omitted": true}
            solution_sketch: 'Option A is worth $4$. Option B is worth $12\cdot\frac25=\frac{24}{5}=4.8$ euros. Option B is better, so the answer is $4.8$.'
          - problem: 'A raffle sells $200$ tickets at €1 each, with one prize of €150. Find the expected net gain per ticket.'
            answer: '-0.25'
            answer_contract: {"kind": "unit", "quantity": "euro", "unit": "euro", "allow_omitted": true}
            solution_sketch: 'The expected prize per ticket is $150/200=0.75$ euros. The net gain is $0.75-1=-0.25$, an expected loss of $0.25$ euros per ticket.'
          - problem: 'Option A pays a sure €7. Option B pays €20 with probability $2/5$ and nothing otherwise. Find the expected value of the better option.'
            answer: '8'
            answer_contract: {"kind": "unit", "quantity": "euro", "unit": "euro", "allow_omitted": true}
            solution_sketch: 'Option A is worth $7$. Option B is worth $20\cdot\frac25=8$ euros. Option B is better, so the answer is $8$.'
          - problem: 'A raffle sells $500$ tickets at €2 each, with one prize of €400. Find the expected net gain per ticket.'
            answer: '-1.2'
            answer_contract: {"kind": "unit", "quantity": "euro", "unit": "euro", "allow_omitted": true}
            solution_sketch: 'The expected prize per ticket is $400/500=0.8$ euros. The net gain is $0.8-2=-1.2$ euros per ticket.'
          - problem: 'A game costs €5 to play. You win €$X$ with probability $1/4$ and nothing otherwise. The expected net gain is €1. Find $X$.'
            answer: '24'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The expected net gain is $X/4-5=1$. Add $5$ to get $X/4=6$, then multiply by $4$: $X=24$.'
          - problem: 'Option A pays €11 with probability $1/2$ and €2 otherwise. Option B pays a sure €6. Find the expected value of the better option.'
            answer: '6.5'
            answer_contract: {"kind": "unit", "quantity": "euro", "unit": "euro", "allow_omitted": true}
            solution_sketch: 'Option A is worth $11\cdot\frac12+2\cdot\frac12=6.5$ euros. Option B is worth $6$. Option A is better, so the answer is $6.5$.'
          - problem: 'Option A pays a sure €8. Option B pays €30 with probability $1/4$ and nothing otherwise. By how many euros is the expected value of option A greater than that of option B?'
            answer: '0.5'
            answer_contract: {"kind": "unit", "quantity": "euro", "unit": "euro", "allow_omitted": true}
            solution_sketch: 'Option A is worth $8$ euros. Option B is worth $30\cdot\frac14=7.5$ euros. The difference is $8-7.5=0.5$ euros, so option A is worth $0.5$ euros more.'
          - problem: 'A raffle ticket costs €3 and there is one prize of €600. How many tickets must be sold for the raffle to be fair?'
            answer: '200'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'With $n$ tickets the expected prize per ticket is $600/n$. The raffle is fair when this equals the €3 price, so $600/n=3$ and $n=600/3=200$.'
    diagnostic_exemplar:
      problem: 'A game costs €3 to play; you win €12 with probability $1/6$ and nothing otherwise. Find the expected net gain, in euros.'
      answer: "-1"
      solution_sketch: '$12 \cdot \frac{1}{6} - 3 = 2 - 3 = -1$ euro.'
    anki_seeds:
      - front: 'A game is fair when...'
        back: 'The expected net gain is $0$.'
        type: basic
      - front: 'Insurer''s expected profit per policy $=$ ?'
        back: 'Premium $-$ expected payout.'
        type: basic

  - id: law-of-large-numbers
    name: "The Law of Large Numbers"
    core: false                # stated theorem; nothing builds on it
    difficulty: 0.45
    drill: false
    answer_kind: numeric
    expected_time_secs: 120
    prerequisites:
      - id: discrete-random-variables
        weight: 0.7
        key: true
      - id: experimental-theoretical-probability
        weight: 0.4
        key: false
    knowledge_points:
      - id: kp1
        name: 'What the law says'
        key_prerequisites: [discrete-random-variables, experimental-theoretical-probability]
        constraints: 'long-run limits equal the probability or the expected value; one longer-run verdict'
        exemplars:
          - problem: 'A fair coin is flipped again and again. As the number of flips grows very large, what value does the proportion of heads approach?'
            answer: '1/2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'By the law of large numbers, the proportion of heads approaches the probability of heads on one flip. That probability is $1/2$.'
          - problem: 'A fair die is rolled again and again. As the number of rolls grows very large, what value does the average of the rolls approach?'
            answer: '7/2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The average of many rolls approaches the expected value of one roll. That value is $(1+2+3+4+5+6)/6=7/2$.'
          - problem: 'A biased coin lands heads with probability $0.6$. As the number of tosses grows very large, what value does the proportion of heads approach?'
            answer: '3/5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The long-run proportion of heads equals the probability of heads on one toss, which is $0.6=3/5$.'
          - problem: 'A spinner has four equally likely outcomes: $1$, $3$, $5$ and $7$. As the number of spins grows very large, what value does the average of the outcomes approach?'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The long-run average equals the expected value of one spin: $(1+3+5+7)/4=16/4=4$. This value is not a face of the spinner.'
          - problem: 'An urn holds $3$ red balls and $7$ blue balls. Balls are drawn with replacement. As the number of draws grows very large, what value does the proportion of red draws approach?'
            answer: '3/10'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The long-run proportion of red draws equals the probability of red on one draw. That probability is $3/(3+7)=3/10$.'
          - problem: 'A game pays $12$ dollars with probability $1/4$ and nothing otherwise. As the number of plays grows very large, what value does the average payout per play approach?'
            answer: '3'
            answer_contract: {"kind": "unit", "quantity": "dollar", "unit": "dollar", "allow_omitted": true}
            solution_sketch: 'The long-run average payout equals the expected payout of one play: $12\cdot\frac14+0\cdot\frac34=3$ dollars.'
          - problem: 'A spinner shows $2$ with probability $1/2$, $4$ with probability $1/4$ and $10$ with probability $1/4$. As the number of spins grows very large, what value does the average of the results approach?'
            answer: '4.5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The long-run average equals the expected value of one spin: $2\cdot\frac12+4\cdot\frac14+10\cdot\frac14=1+1+2.5=4.5$. This value is not a result the spinner can show.'
          - problem: 'A fair coin is flipped $20$ times and then $20000$ times. After which number of flips is the proportion of heads more likely to be close to $1/2$?'
            answer: '20000 flips'
            answer_contract: {"kind": "label", "options": [["20 flips", "20", "after 20 flips", "the shorter run"], ["20000 flips", "20000", "20,000", "20,000 flips", "after 20000 flips", "after 20,000 flips", "the longer run", "the 20000 flips"]]}
            solution_sketch: 'The law of large numbers says the proportion of heads gets closer to $1/2$ as the number of flips grows. So $20000$ flips is more likely to give a proportion close to $1/2$ than $20$ flips.'
      - id: kp2
        name: 'What the law does not say'
        key_prerequisites: [discrete-random-variables]
        constraints: 'streak setups; the correct answer ignores the streak; one verdict about a named person'
        exemplars:
          - problem: 'A fair coin lands heads $5$ times in a row. Find the probability that the next flip is heads.'
            answer: '1/2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Flips are independent, so earlier results do not change the next flip. The probability of heads is still $1/2$.'
          - problem: 'A game is won with probability $1/3$ on each independent play. After four straight losses, find the probability of winning the next play.'
            answer: '1/3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Independent plays have no memory, so a win is never due after a losing streak. The probability stays $1/3$.'
          - problem: 'A fair six-sided die is rolled ten times and no $3$ appears. Find the probability that the next roll is a $3$.'
            answer: '1/6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A fair die has six equally likely outcomes on every roll, and past rolls do not affect the next one. The probability is $1/6$.'
          - problem: 'A biased coin has probability $0.7$ of landing heads. It lands tails six times in a row. Find the probability of heads on the next flip.'
            answer: '7/10'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The coin has no memory, so six tails do not change the chance of heads. It stays $0.7=7/10$.'
          - problem: 'A spinner has four equal sectors: red, blue, green and yellow. It lands on red seven times in a row. Find the probability that the next spin lands on blue.'
            answer: '1/4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Each spin has the same four equal sectors, and a streak of red does not make blue more likely. One sector in four is blue, so the probability is $1/4$.'
          - problem: 'A bag contains $5$ red marbles and $3$ blue marbles. A marble is drawn, its color is noted, and it is put back. Seven draws in a row are red. Find the probability that the next draw is blue.'
            answer: '3/8'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The marble is put back each time, so the bag is unchanged and the draws do not affect each other. There are $3$ blue marbles among $5+3=8$, so the probability is $3/8$.'
          - problem: 'Max flips a fair coin and gets tails $6$ times in a row. He says that heads is now more likely on the next flip. Is Max right?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "he is right", "heads is more likely", "max is right"], ["no", "he is not right", "he is wrong", "wrong", "not right", "heads is not more likely", "he isnt right", "no he is not right"]]}
            solution_sketch: 'Flips are independent, so six tails do not change the next flip. The probability of heads stays $1/2$, and the belief that heads is due is the gambler''s fallacy. Max is not right.'
          - problem: 'A lottery draws one of $49$ equally likely numbers each week. The number $17$ has not been drawn for $30$ weeks. Find the probability that it is drawn next week.'
            answer: '1/49'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Each weekly draw is independent of the earlier ones, so every number has probability $1/49$ whatever happened before.'
          - problem: 'A fair coin lands heads $5$ times in a row. Find the probability that the next two flips are both heads.'
            answer: '1/4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The earlier streak has no effect, and the next two flips are independent. So the probability is $\frac12\cdot\frac12=\frac14$.'
      - id: kp3
        name: 'Long-run predictions'
        key_prerequisites: [discrete-random-variables]
        constraints: 'n times the probability or expected value is a whole number of units; includes finding p or n from the expected count'
        exemplars:
          - problem: 'A fair die is rolled $600$ times. About how many sixes should be expected?'
            answer: '100'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The expected count is the number of rolls times the probability: $600\cdot\frac16=100$. The actual count will be near $100$, not exactly $100$.'
          - problem: 'A casino game has an expected player loss of €0.50 per play. About how much does the casino expect to gain over $1000$ plays?'
            answer: '500'
            answer_contract: {"kind": "unit", "quantity": "euro", "unit": "euro", "allow_omitted": true}
            solution_sketch: 'Multiply the expected gain per play by the number of plays: $1000\cdot0.50=500$ euros. The law of large numbers makes this reliable over many plays.'
          - problem: 'A biased coin lands heads with probability $0.35$ on each flip. About how many heads should be expected in $400$ independent flips?'
            answer: '140'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Multiply the number of flips by the probability: $400\cdot0.35=140$. The real count will be near $140$, not exactly $140$.'
          - problem: 'A spinner lands on red with probability $0.375$ on each spin. About how many red results should be expected in $240$ independent spins?'
            answer: '90'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Multiply the number of spins by the probability: $240\cdot0.375=90$. The real count will be near $90$, not exactly $90$.'
          - problem: 'A raffle ticket has an expected payout of $2.50$ dollars. About how many dollars should $480$ tickets pay out in total?'
            answer: '1200'
            answer_contract: {"kind": "unit", "quantity": "dollar", "unit": "dollar", "allow_omitted": true}
            solution_sketch: 'The expected total is the number of tickets times the expected payout per ticket: $480\cdot2.50=1200$ dollars.'
          - problem: 'In $900$ independent plays of a game, about $270$ wins are expected. Find the probability of a win on one play.'
            answer: '3/10'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The expected number of wins is $900p=270$. Divide to find $p=270/900=3/10$. As a check, $900\cdot3/10=270$.'
          - problem: 'A factory finds that $2\%$ of its bulbs are faulty. A batch should contain about $30$ faulty bulbs. How many bulbs are in the batch?'
            answer: '1500'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The expected number of faulty bulbs is $0.02n=30$, where $n$ is the batch size. Divide: $n=30/0.02=1500$.'
          - problem: 'A game has an expected net loss of €0.20 per play for the player. After how many plays should the player expect to have lost a total of €80?'
            answer: '400'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The expected total loss is the loss per play times the number of plays, so $0.20n=80$. Divide: $n=80/0.20=400$ plays.'
    diagnostic_exemplar:
      problem: 'A game is won with probability $\frac{1}{3}$ on each independent play. After four straight losses, about how many wins should be expected in the next $600$ plays?'
      answer: '200'
      solution_sketch: 'The plays are independent, so the losing streak changes nothing: the long-run rate is still $\frac{1}{3}$, and $600 \cdot \frac{1}{3} = 200$.'
    anki_seeds:
      - front: 'Law of large numbers (informal)?'
        back: 'As the number of independent trials grows, the sample proportion (and sample mean) approaches the true probability (expected value).'
        type: basic
      - front: 'Does a streak of heads make tails more likely next flip?'
        back: 'No — trials are independent; expecting a correction is the gambler''s fallacy.'
        type: basic

  - id: variance-random-variables
    name: "Variance of Random Variables"
    core: true
    difficulty: 0.5
    drill: false
    answer_kind: numeric
    expected_time_secs: 180
    prerequisites:
