        weight: 0.8
        key: true
      - id: variance-standard-deviation
        weight: 0.5
        key: false
    knowledge_points:
      - id: kp1
        name: "Variance from the definition"
        key_prerequisites: [discrete-random-variables, variance-standard-deviation]
        exemplars:
          - problem: '$X$ takes the values $0$, $1$ and $2$ with probabilities $1/6$, $2/3$ and $1/6$. Find $\operatorname{Var}(X)$.'
            answer: '1/3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The mean is $0\cdot\frac16+1\cdot\frac23+2\cdot\frac16=1$. The squared deviations from $1$ are $1$, $0$ and $1$. Weighting them by their probabilities gives $\operatorname{Var}(X)=\frac16+0+\frac16=\frac13$.'
          - problem: '$X$ takes the values $-2$, $0$ and $2$, each with probability $1/3$. Find $\operatorname{Var}(X)$.'
            answer: '8/3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The mean is $\frac{-2+0+2}{3}=0$. The squared deviations from $0$ are $4$, $0$ and $4$. Their average is $\frac{4+0+4}{3}=\frac83$.'
          - problem: 'A game pays $-1$ euro with probability $2/5$ and $4$ euros with probability $3/5$. Find the variance of the payout.'
            answer: '6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The mean payout is $-1\cdot\frac25+4\cdot\frac35=2$. The squared deviations from $2$ are $9$ and $4$. Weighting them gives $9\cdot\frac25+4\cdot\frac35=\frac{18}{5}+\frac{12}{5}=6$.'
          - problem: 'A shop records the number $X$ of items in a basket: $1$ item with probability $0.5$, $2$ items with probability $0.3$ and $5$ items with probability $0.2$. Find $\operatorname{Var}(X)$.'
            answer: '2.29'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The mean is $1\cdot0.5+2\cdot0.3+5\cdot0.2=2.1$. The squared deviations are $1.21$, $0.01$ and $8.41$. Weighting them gives $0.605+0.003+1.682=2.29$.'
          - problem: 'Sam has $X=0$ or $X=6$, each with probability $1/2$. He finds the mean $3$ and the deviations $-3$ and $3$, averages them and says the variance is $0$. What is the correct variance of $X$?'
            answer: '9'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Sam averaged the deviations, so they cancelled. The deviations must be squared first: $(-3)^2=9$ and $3^2=9$. Their average is $9$, so the variance is $9$.'
          - problem: 'A raffle ticket wins $10$ euros with probability $1/10$ and wins nothing otherwise. Find the variance of the winnings.'
            answer: '9'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The mean winnings are $10\cdot\frac1{10}=1$. The squared deviations from $1$ are $81$ for a win and $1$ for no win. Weighting them gives $81\cdot\frac1{10}+1\cdot\frac9{10}=\frac{90}{10}=9$.'
          - problem: '$X$ takes the values $2$ and $b$, each with probability $1/2$, where $b>2$. The variance of $X$ is $9$. Find $b$.'
            answer: '8'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The mean is $\frac{2+b}{2}$, so each value lies $\frac{b-2}{2}$ from it. The variance is $\left(\frac{b-2}{2}\right)^2=9$, so $\frac{b-2}{2}=3$. Then $b-2=6$, so $b=8$.'
        constraints: "2-3 values, or a short context, with an easy mean; squared deviations are small integers or one-decimal values"
      - id: kp2
        name: "Shortcut: Var(X) = E[X^2] - (E[X])^2"
        key_prerequisites: [discrete-random-variables]
        exemplars:
          - problem: '$X$ takes the values $0$, $1$ and $2$ with probabilities $1/2$, $1/4$ and $1/4$. Use $E[X^2]-(E[X])^2$ to find $\operatorname{Var}(X)$.'
            answer: '11/16'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The mean is $E[X]=0+\frac14+\frac24=\frac34$. The mean of the squares is $E[X^2]=0+\frac14+\frac44=\frac54$. So $\operatorname{Var}(X)=\frac54-\frac9{16}=\frac{11}{16}$.'
          - problem: 'Find the variance of the score on one roll of a fair six-sided die.'
            answer: '35/12'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The mean is $E[X]=\frac72$. The mean of the squares is $E[X^2]=\frac{1+4+9+16+25+36}{6}=\frac{91}{6}$. So the variance is $\frac{91}{6}-\frac{49}{4}=\frac{182-147}{12}=\frac{35}{12}$.'
          - problem: '$X$ has the distribution $P(X=1)=1/4$, $P(X=2)=1/2$ and $P(X=4)=1/4$. Find $\operatorname{Var}(X)$.'
            answer: '19/16'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The mean is $E[X]=\frac14+1+1=\frac94$. The mean of the squares is $E[X^2]=\frac14+2+4=\frac{25}{4}$. So $\operatorname{Var}(X)=\frac{25}{4}-\frac{81}{16}=\frac{19}{16}$.'
          - problem: 'A machine has $0$ breakdowns in a week with probability $0.5$, $1$ breakdown with probability $0.3$ and $2$ breakdowns with probability $0.2$. Find the variance of the number of breakdowns.'
            answer: '0.61'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The mean is $E[X]=0.3+0.4=0.7$. The mean of the squares is $E[X^2]=0.3+0.8=1.1$. So the variance is $1.1-0.49=0.61$.'
          - problem: 'Sam knows that $E[X]=3$ and $E[X^2]=13$. He writes $\operatorname{Var}(X)=13-3=10$. What is the correct variance?'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Sam subtracted the mean, but the formula subtracts the square of the mean. The correct value is $13-3^2=13-9=4$.'
          - problem: 'A prize $X$ in euros is $0$ with probability $0.9$, $10$ with probability $0.08$ and $50$ with probability $0.02$. Find $\operatorname{Var}(X)$.'
            answer: '54.76'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The mean is $E[X]=0.8+1=1.8$. The mean of the squares is $E[X^2]=8+50=58$. So the variance is $58-1.8^2=58-3.24=54.76$.'
          - problem: 'A random variable $X$ has $E[X^2]=34$ and $\operatorname{Var}(X)=9$, and its mean is positive. Find $E[X]$.'
            answer: '5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The shortcut gives $9=34-(E[X])^2$, so $(E[X])^2=25$. The mean is positive, so $E[X]=5$.'
        constraints: "values <= 6 or one-decimal probabilities; answers exact; the formula E[X^2]-(E[X])^2 is the method"
      - id: kp3
        name: "Standard deviation of a random variable"
        key_prerequisites: [discrete-random-variables, variance-standard-deviation]
        exemplars:
          - problem: '$X$ is $1$ or $5$, each with probability $1/2$. Find $\operatorname{SD}(X)$.'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The mean is $3$. Both deviations are $2$ away, so the variance is $4$. The standard deviation is $\sqrt4=2$.'
          - problem: '$X$ takes the values $0$, $2$ and $4$ with probabilities $1/4$, $1/2$ and $1/4$. Find $\operatorname{SD}(X)$ to two decimal places.'
            answer: '1.41'
            answer_contract: {"kind": "approx", "decimals": 2}
            solution_sketch: 'The mean is $2$. The variance is $4\cdot\frac14+0+4\cdot\frac14=2$. The standard deviation is $\sqrt2\approx1.41$.'
          - problem: 'The variance of $X$ is $25/4$. Find $\operatorname{SD}(X)$.'
            answer: '5/2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The standard deviation is the positive square root of the variance. So $\operatorname{SD}(X)=\sqrt{25/4}=\frac52$.'
          - problem: 'A game pays $9$ euros with probability $1/10$ and $-1$ euro with probability $9/10$. Find the standard deviation of the payout.'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The mean is $9\cdot\frac1{10}-1\cdot\frac9{10}=0$. The variance is $81\cdot\frac1{10}+1\cdot\frac9{10}=9$. The standard deviation is $\sqrt9=3$.'
          - problem: 'The delay $X$ of a train in minutes is $0$ with probability $0.6$, $5$ with probability $0.3$ and $10$ with probability $0.1$. Find the standard deviation of the delay to two decimal places.'
            answer: '3.35'
            answer_contract: {"kind": "approx", "decimals": 2}
            solution_sketch: 'The mean is $1.5+1=2.5$. The mean of the squares is $7.5+10=17.5$, so the variance is $17.5-6.25=11.25$. The standard deviation is $\sqrt{11.25}\approx3.35$ minutes.'
          - problem: 'Mia finds $\operatorname{Var}(X)=36$ and says that $\operatorname{SD}(X)=36/2=18$. What is the correct standard deviation?'
            answer: '6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The standard deviation is the square root of the variance, not half of it. So $\operatorname{SD}(X)=\sqrt{36}=6$.'
          - problem: '$X$ takes the values $0$, $3$ and $6$, each with probability $1/3$. Find $\operatorname{SD}(X)$ to two decimal places.'
            answer: '2.45'
            answer_contract: {"kind": "approx", "decimals": 2}
            solution_sketch: 'The mean is $3$. The squared deviations are $9$, $0$ and $9$, so the variance is $\frac{18}{3}=6$. The standard deviation is $\sqrt6\approx2.45$.'
        constraints: "variances are perfect squares or simple fractions, or the SD is rounded to two decimal places"
    diagnostic_exemplar:
      problem: '$X$ is $1$ or $4$, each with probability $1/2$. Find $\operatorname{SD}(X)$.'
      answer: '3/2'
      solution_sketch: '$E[X] = 5/2$, $E[X^2] = 17/2$; $\operatorname{Var}(X) = 17/2 - 25/4 = 9/4$; $\operatorname{SD}(X) = 3/2$.'
    anki_seeds:
      - front: 'Variance shortcut formula?'
        back: '$\operatorname{Var}(X) = E[X^2] - (E[X])^2$.'
        type: basic
      - front: '$\operatorname{SD}(X) =$ ? (in terms of variance)'
        back: '$\sqrt{\operatorname{Var}(X)}$.'
        type: basic

  - id: linear-transformations-random-variables
    name: "Linear Transformations of Random Variables"
    core: true
    difficulty: 0.5
    drill: false
    answer_kind: numeric
    expected_time_secs: 120
    prerequisites:
      - id: variance-random-variables
        weight: 0.8
        key: true
    knowledge_points:
      - id: kp1
        name: "Shifts: adding a constant"
        key_prerequisites: [variance-random-variables]
        exemplars:
          - problem: 'Marks $X$ on a test (out of $10$) have mean $7$ and standard deviation $0.8$. The teacher raises every mark by $1$. What is the new mean?'
            answer: '8'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Every mark rises by $1$, so the mean rises by $1$ as well. The new mean is $7+1=8$.'
          - problem: 'A quiz score $X$ has mean $12$ and standard deviation $2.5$. Every score is increased by $4$. What is the new standard deviation?'
            answer: '2.5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Adding $4$ to every score moves the whole set but does not change the gaps between the scores. So the standard deviation stays $2.5$.'
          - problem: 'Given $\operatorname{Var}(X)=7$, find $\operatorname{Var}(X+10)$.'
            answer: '7'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A shift does not change the spread of a random variable. So $\operatorname{Var}(X+10)=\operatorname{Var}(X)=7$.'
          - problem: 'A faulty thermometer reads $3$ degrees too low. Its readings $X$ over a month have mean $18$ and standard deviation $1.2$. The true temperature is $X+3$. What is the mean of the true temperatures?'
            answer: '21'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Adding $3$ to every reading adds $3$ to the mean. So the mean of the true temperatures is $18+3=21$.'
          - problem: 'Every score on a test is lowered by $5$ points. The new mean is $10$. What was the mean before the change?'
            answer: '15'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The new mean equals the old mean minus $5$. So the old mean is $10+5=15$.'
          - problem: 'The salaries of a firm have mean $2400$ euros and standard deviation $300$ euros. Every employee receives a bonus of $150$ euros. What is the standard deviation of the new salaries?'
            answer: '300'
            answer_contract: {"kind": "unit", "quantity": "euro", "unit": "euro", "allow_omitted": true}
            solution_sketch: 'The bonus is the same for everyone, so the gaps between salaries do not change. The standard deviation stays $300$ euros.'
          - problem: '$X$ has mean $20$ and standard deviation $4$. A constant $b$ is added to $X$, and the new mean is $13$. Find $b$.'
            answer: '-7'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The new mean is the old mean plus $b$, so $13=20+b$. Then $b=13-20=-7$.'
          - problem: 'After a year every student in a class has grown by exactly $5$ cm. What happens to the standard deviation of the heights?'
            answer: 'stay the same'
            answer_contract: {"kind": "label", "options": [["stay the same", "stays the same", "it stays the same", "unchanged", "no change", "it does not change", "remains the same", "stays constant"], ["increase", "increases", "it increases", "go up", "goes up", "get bigger", "it goes up"], ["decrease", "decreases", "it decreases", "go down", "goes down", "get smaller", "it goes down"]]}
            solution_sketch: 'Every height grows by the same amount, so the gaps between the heights stay as they were. The standard deviation stays the same, although the mean height goes up by $5$ cm.'
        constraints: "b in {-10..10} or a context shift; SD and variance are unchanged by shifts"
      - id: kp2
        name: "Scaling: multiplying by a constant"
        key_prerequisites: [variance-random-variables]
        exemplars:
          - problem: 'Given $\operatorname{SD}(X)=2$, find $\operatorname{SD}(3X)$.'
            answer: '6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The standard deviation is multiplied by $|3|=3$. So $\operatorname{SD}(3X)=3\cdot2=6$.'
          - problem: 'Given $\operatorname{Var}(X)=3$, find $\operatorname{Var}(2X)$.'
            answer: '12'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The variance is multiplied by $2^2=4$. So $\operatorname{Var}(2X)=4\cdot3=12$.'
          - problem: 'Given $\operatorname{SD}(X)=5$, find $\operatorname{SD}(-2X)$.'
            answer: '10'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The standard deviation is multiplied by $|-2|=2$. So $\operatorname{SD}(-2X)=2\cdot5=10$.'
          - problem: 'Given $\operatorname{Var}(X)=4$, find $\operatorname{Var}(-3X)$.'
            answer: '36'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The variance is multiplied by $(-3)^2=9$. So $\operatorname{Var}(-3X)=9\cdot4=36$.'
          - problem: 'Given $\operatorname{Var}(X)=16$, find $\operatorname{SD}(-2X)$.'
            answer: '8'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'First $\operatorname{SD}(X)=\sqrt{16}=4$. Then the standard deviation is multiplied by $|-2|=2$, so $\operatorname{SD}(-2X)=2\cdot4=8$.'
          - problem: 'A random variable $X$ has $\operatorname{SD}(X)=5$. Let $Y=-3X$. Find $\operatorname{Var}(Y)$.'
            answer: '225'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'First $\operatorname{Var}(X)=5^2=25$. Then the variance is multiplied by $(-3)^2=9$, so $\operatorname{Var}(Y)=9\cdot25=225$.'
          - problem: 'The lengths $X$ of rods in centimetres have standard deviation $0.4$ cm. The lengths are converted to millimetres by $Y=10X$. What is the standard deviation of $Y$?'
            answer: '4'
            answer_contract: {"kind": "unit", "quantity": "length", "unit": "mm", "allow_omitted": true}
            solution_sketch: 'The standard deviation is multiplied by $10$. So $\operatorname{SD}(Y)=10\cdot0.4=4$ mm.'
          - problem: 'The weights of parcels in grams have standard deviation $500$ g. What is the standard deviation of the weights in kilograms?'
            answer: '0.5'
            answer_contract: {"kind": "unit", "quantity": "mass", "unit": "kg", "allow_omitted": true}
            solution_sketch: 'Kilograms are grams divided by $1000$, so the standard deviation is divided by $1000$ as well. It is $500/1000=0.5$ kg.'
          - problem: 'A price in euros is $Y=2X$, where $X$ is the cost of the contents of a box. The variance of $Y$ is $36$. Find $\operatorname{Var}(X)$.'
            answer: '9'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The variance of $Y$ is $2^2=4$ times the variance of $X$, so $36=4\operatorname{Var}(X)$. Then $\operatorname{Var}(X)=36/4=9$.'
        constraints: "a in {-3..3} or a unit conversion; distinguish SD scaling (|a|) from variance scaling (a^2)"
      - id: kp3
        name: "Combined transformations aX + b"
        key_prerequisites: [variance-random-variables]
        exemplars:
          - problem: 'Given $\operatorname{Var}(X)=3$, find $\operatorname{Var}(2X+5)$.'
            answer: '12'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The shift $+5$ does not change the variance. The factor $2$ multiplies it by $2^2=4$, so $\operatorname{Var}(2X+5)=4\cdot3=12$.'
          - problem: 'Taxi journeys have length $X$ km with mean $6$ and standard deviation $2$. The fare in euros is $Y=1.5X+4$. What is the mean fare?'
            answer: '13'
            answer_contract: {"kind": "unit", "quantity": "euro", "unit": "euro", "allow_omitted": true}
            solution_sketch: 'The mean follows the whole rule: $1.5\cdot6+4=9+4=13$. The mean fare is $13$ euros.'
          - problem: 'Given $\operatorname{Var}(X)=5$, find $\operatorname{Var}(4X+1)$.'
            answer: '80'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Adding $1$ does not change the variance. Multiplying by $4$ multiplies it by $4^2=16$, so $\operatorname{Var}(4X+1)=16\cdot5=80$.'
          - problem: 'A workshop cuts wire into pieces of length $X$ cm with mean $5$ and standard deviation $2$. The price in euros of one piece is $Y=3X+1$. What is the standard deviation of the price?'
            answer: '6'
            answer_contract: {"kind": "unit", "quantity": "euro", "unit": "euro", "allow_omitted": true}
            solution_sketch: 'The $+1$ does not change the spread. The factor $3$ multiplies the standard deviation, so $\operatorname{SD}(Y)=3\cdot2=6$ euros.'
          - problem: 'Given $\operatorname{Var}(5X+8)=75$, find $\operatorname{Var}(X)$.'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The shift $+8$ does not matter, and the factor $5$ gives $\operatorname{Var}(5X+8)=25\operatorname{Var}(X)$. So $25\operatorname{Var}(X)=75$ and $\operatorname{Var}(X)=3$.'
          - problem: 'A shop sells gift boxes at the price $Y=2X+6$ euros, where $X$ is the cost of the contents. The mean price is $E[Y]=20$ euros. What is the mean cost $E[X]$ of the contents?'
            answer: '7'
            answer_contract: {"kind": "unit", "quantity": "euro", "unit": "euro", "allow_omitted": true}
            solution_sketch: 'The mean price follows $E[Y]=2E[X]+6=20$. So $2E[X]=14$ and $E[X]=7$ euros.'
          - problem: 'For the same boxes $Y=2X+6$, the standard deviation of the price is $\operatorname{SD}(Y)=8$ euros. What is the standard deviation of the cost $X$ of the contents?'
            answer: '4'
            answer_contract: {"kind": "unit", "quantity": "euro", "unit": "euro", "allow_omitted": true}
            solution_sketch: 'The shift $+6$ does not matter, and the factor $2$ gives $\operatorname{SD}(Y)=2\operatorname{SD}(X)=8$. So $\operatorname{SD}(X)=4$ euros.'
          - problem: 'The daily temperature in a town, in degrees Celsius, has mean $20$ and standard deviation $5$. A temperature $C$ in Celsius is $F=1.8C+32$ in Fahrenheit. What is the standard deviation of the Fahrenheit temperatures?'
            answer: '9'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The $+32$ does not change the spread. The factor $1.8$ multiplies the standard deviation, so $\operatorname{SD}(F)=1.8\cdot5=9$.'
          - problem: 'Leo says that if $\operatorname{Var}(X)=5$, then $\operatorname{Var}(2X+3)=2^2\cdot5+3=23$. What is the correct variance?'
            answer: '20'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Leo added the shift $3$ to the variance, but a shift does not change the spread. The correct value is $2^2\cdot5=20$.'
        constraints: "a, b small constants (integers or one-decimal rates); answers whole numbers or one-decimal values"
    diagnostic_exemplar:
      problem: 'Given $E[X] = 10$ and $\operatorname{SD}(X) = 4$, let $Y = 2X + 3$. Find $\operatorname{SD}(Y)$.'
      answer: '8'
      solution_sketch: '$\operatorname{SD}(Y) = 2 \cdot 4 = 8$; the shift $+3$ does not affect spread.'
    anki_seeds:
      - front: '$\operatorname{Var}(aX + b) =$ ?'
        back: '$a^2 \operatorname{Var}(X)$ — the shift $b$ has no effect.'
        type: basic
      - front: 'Adding a constant to a random variable changes its mean but not its...'
        back: 'Spread (SD and variance are unchanged).'
        type: basic

  - id: sums-of-random-variables
    name: "Sums of Random Variables"
    core: false                # terminal random-variable result
    difficulty: 0.55
    drill: false
    answer_kind: numeric
    expected_time_secs: 150
    prerequisites:
      - id: variance-random-variables
        weight: 0.7
        key: true
      - id: linear-transformations-random-variables
        weight: 0.4
        key: false
      - id: independent-events
        weight: 0.4
        key: false
    knowledge_points:
      - id: kp1
        name: "Means add"
        key_prerequisites: [variance-random-variables]
        exemplars:
          - problem: 'Given $E[X]=3$ and $E[Y]=5$, find $E[X+Y]$.'
            answer: '8'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Expected values add, so $E[X+Y]=E[X]+E[Y]=3+5=8$.'
          - problem: 'Two fair dice are rolled. What is the expected value of their sum?'
            answer: '7'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Each die has expected value $3.5$. The expected sum is $3.5+3.5=7$.'
          - problem: 'The random variables $X$, $Y$ and $Z$ have $E[X]=4$, $E[Y]=9$ and $E[Z]=2$. Find $E[X+Y+Z]$.'
            answer: '15'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Expected values add for any number of variables. So $E[X+Y+Z]=4+9+2=15$.'
          - problem: 'A courier makes two deliveries. The first has an expected travel time of $2.5$ hours and the second has an expected travel time of $4$ hours. What is the expected total travel time?'
            answer: '6.5'
            answer_contract: {"kind": "unit", "quantity": "time", "unit": "hour", "allow_omitted": true}
            solution_sketch: 'The expected total is the sum of the two expected times. So it is $2.5+4=6.5$ hours.'
          - problem: 'Three games give expected winnings of $6$, $7.5$ and $3$ points. What are the expected total winnings?'
            answer: '16.5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The expected total is the sum of the three expected winnings. So it is $6+7.5+3=16.5$ points.'
          - problem: 'For random variables $X$ and $Y$, $E[X]=4$ and $E[X+Y]=11.5$. Find $E[Y]$.'
            answer: '7.5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Expected values add, so $11.5=4+E[Y]$. Then $E[Y]=11.5-4=7.5$.'
          - problem: 'A cashier serves a customer in $3.5$ minutes on average. What is the expected total time to serve $12$ customers one after another?'
            answer: '42'
            answer_contract: {"kind": "unit", "quantity": "time", "unit": "minute", "allow_omitted": true}
            solution_sketch: 'The total is the sum of $12$ service times, each with expected value $3.5$ minutes. So the expected total is $12\cdot3.5=42$ minutes.'
          - problem: 'A technician repairs five machines, and each repair takes the same expected time. The expected total time for all five repairs is $45$ minutes. What is the expected time for one repair?'
            answer: '9'
            answer_contract: {"kind": "unit", "quantity": "time", "unit": "minute", "allow_omitted": true}
            solution_sketch: 'The expected total is five times the expected time of one repair. So one repair takes $45/5=9$ minutes on average.'
        constraints: "2-5 variables; means are integers, half-integers or one-decimal values"
      - id: kp2
        name: "Variances add for independent variables"
        key_prerequisites: [variance-random-variables, independent-events]
        exemplars:
          - problem: '$X$ and $Y$ are independent with $\operatorname{Var}(X)=9$ and $\operatorname{Var}(Y)=16$. Find $\operatorname{Var}(X+Y)$.'
            answer: '25'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'For independent variables the variances add. So $\operatorname{Var}(X+Y)=9+16=25$.'
          - problem: '$X$ and $Y$ are independent with $\operatorname{Var}(X)=6$ and $\operatorname{Var}(Y)=10$. Find $\operatorname{SD}(X+Y)$.'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The variances add: $\operatorname{Var}(X+Y)=6+10=16$. The standard deviation is the square root of that, $\sqrt{16}=4$.'
          - problem: 'Two fair dice are rolled independently. One roll has variance $35/12$. Find the variance of the sum of the two rolls.'
            answer: '35/6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The rolls are independent, so the variances add. The variance of the sum is $\frac{35}{12}+\frac{35}{12}=\frac{35}{6}$.'
          - problem: '$X$ and $Y$ are independent with $\operatorname{Var}(X)=2$ and $\operatorname{Var}(Y)=3$. Find $\operatorname{Var}(2X+3Y)$.'
            answer: '35'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Each variable is scaled first, so its variance is multiplied by the square of the factor. Then the variances add: $2^2\cdot2+3^2\cdot3=8+27=35$.'
          - problem: '$X$, $Y$ and $Z$ are independent with $\operatorname{Var}(X)=3$, $\operatorname{Var}(Y)=8$ and $\operatorname{Var}(Z)=14$. Find $\operatorname{SD}(X+Y+Z)$.'
            answer: '5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The variances add: $3+8+14=25$. The standard deviation is $\sqrt{25}=5$.'
          - problem: '$X$ and $Y$ are independent with $\operatorname{Var}(X+Y)=25$ and $\operatorname{Var}(X)=6$. Find $\operatorname{Var}(Y)$.'
            answer: '19'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The variances add, so $25=6+\operatorname{Var}(Y)$. Then $\operatorname{Var}(Y)=25-6=19$.'
          - problem: 'The waiting time for a bus has standard deviation $2$ minutes, and the independent ride time has standard deviation $3$ minutes. What is the standard deviation of the total journey time, to two decimal places?'
            answer: '3.61'
            answer_contract: {"kind": "approx", "decimals": 2}
            solution_sketch: 'The standard deviations do not add, but the variances do: $4+9=13$. The standard deviation of the total is $\sqrt{13}\approx3.61$ minutes.'
          - problem: 'Two independent machines fill a box. The mass of the first load has standard deviation $3$ g and the mass of the second load has standard deviation $4$ g. What is the standard deviation of the total mass?'
            answer: '5'
            answer_contract: {"kind": "unit", "quantity": "mass", "unit": "g", "allow_omitted": true}
            solution_sketch: 'The variances are $9$ and $16$, and they add to $25$. The standard deviation of the total is $\sqrt{25}=5$ g.'
          - problem: 'Two independent quantities are added. The total has standard deviation $13$ and one of them has standard deviation $5$. What is the standard deviation of the other?'
            answer: '12'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The total has variance $13^2=169$ and one part has variance $5^2=25$. The other variance is $169-25=144$, so its standard deviation is $12$.'
        constraints: "independence stated explicitly; variances sum to a perfect square when SD is requested, or the SD is rounded"
      - id: kp3
        name: "Differences of independent variables"
        key_prerequisites: [variance-random-variables, independent-events]
        exemplars:
          - problem: '$X$ and $Y$ are independent with $\operatorname{Var}(X)=9$ and $\operatorname{Var}(Y)=4$. Find $\operatorname{Var}(X-Y)$.'
            answer: '13'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Subtracting $Y$ has the same effect on the spread as adding it, because $\operatorname{Var}(-Y)=\operatorname{Var}(Y)$. So the variances add: $9+4=13$.'
          - problem: 'The morning crew of a warehouse takes $X$ minutes on a job and the evening crew takes $Y$ minutes, independently. The means are $E[X]=42$ and $E[Y]=18$. What is the expected difference $E[X-Y]$?'
            answer: '24'
            answer_contract: {"kind": "unit", "quantity": "time", "unit": "minute", "allow_omitted": true}
            solution_sketch: 'Expected values subtract for a difference. So $E[X-Y]=42-18=24$ minutes.'
          - problem: 'The morning crew time $X$ and the evening crew time $Y$ are independent, with $\operatorname{Var}(X)=25$ and $\operatorname{Var}(Y)=36$. Find $\operatorname{Var}(X-Y)$.'
            answer: '61'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The variance of a difference of independent variables is the sum of the variances. So $\operatorname{Var}(X-Y)=25+36=61$.'
          - problem: 'The errors of two independent sensors are $X$ and $Y$, with $E[X]=120$ and $E[Y]=45$. Find $E[Y-X]$.'
            answer: '-75'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The expected value of a difference is the difference of the expected values. So $E[Y-X]=45-120=-75$.'
          - problem: '$X$ and $Y$ are independent with $\operatorname{Var}(X)=49$ and $\operatorname{Var}(Y)=16$. Find $\operatorname{SD}(X-Y)$ to two decimal places.'
            answer: '8.06'
            answer_contract: {"kind": "approx", "decimals": 2}
            solution_sketch: 'The variance of the difference is $49+16=65$. The standard deviation is $\sqrt{65}\approx8.06$.'
          - problem: '$X$ and $Y$ are independent with $\operatorname{Var}(X)=12$ and $\operatorname{Var}(Y)=8$. Find $\operatorname{Var}(3X-2Y)$.'
            answer: '140'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Each term is scaled by the square of its factor, and the variances add: $3^2\cdot12+(-2)^2\cdot8=108+32=140$.'
          - problem: 'Rods from machine A and machine B are made independently. The lengths have standard deviations $0.3$ cm and $0.4$ cm. What is the standard deviation of the difference in length between a rod from A and a rod from B?'
            answer: '0.5'
            answer_contract: {"kind": "unit", "quantity": "length", "unit": "cm", "allow_omitted": true}
            solution_sketch: 'The variances add, even for a difference: $0.09+0.16=0.25$. The standard deviation is $\sqrt{0.25}=0.5$ cm.'
          - problem: 'A firm has revenue $R$ with mean $80$ and variance $25$, and cost $C$ with mean $55$ and variance $16$, both in thousands of euros and independent. The profit is $R-C$. What is the expected profit?'
            answer: '25'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The expected profit is the difference of the means: $80-55=25$ thousand euros.'
          - problem: 'For the same firm, with independent revenue $R$ of variance $25$ and cost $C$ of variance $16$, what is the standard deviation of the profit $R-C$, to two decimal places?'
            answer: '6.40'
            answer_contract: {"kind": "approx", "decimals": 2}
            solution_sketch: 'The variance of the profit is $25+16=41$, because the variances add for a difference. The standard deviation is $\sqrt{41}\approx6.40$.'
        constraints: "two computations at most per item; variances add for both sums and differences"
    diagnostic_exemplar:
      problem: '$X$ and $Y$ are independent with $\operatorname{Var}(X) = 6$ and $\operatorname{Var}(Y) = 3$. Find $\operatorname{Var}(X - Y)$.'
      answer: '9'
      solution_sketch: 'Variances of independent variables add even for differences: $6 + 3 = 9$.'
    anki_seeds:
      - front: '$E[X + Y] =$ ? (any $X, Y$)'
        back: '$E[X] + E[Y]$ — expectations always add.'
        type: basic
      - front: '$\operatorname{Var}(X + Y) = \operatorname{Var}(X) + \operatorname{Var}(Y)$ requires...'
        back: '$X$ and $Y$ independent (uncorrelated).'
        type: basic
      - front: 'For independent $X, Y$: $\operatorname{Var}(X - Y) =$ ?'
        back: '$\operatorname{Var}(X) + \operatorname{Var}(Y)$ — variances add even for differences.'
        type: basic

  - id: binomial-probability
    name: "Binomial Probabilities"
    core: true
    difficulty: 0.5
    drill: false
    answer_kind: numeric
    expected_time_secs: 180
    prerequisites:
      - id: combinations
        weight: 0.7
        key: true
      - id: independent-events
        weight: 0.6
        key: true
      - id: discrete-probability-distributions
        weight: 0.4
        key: false
    knowledge_points:
      - id: kp1
        name: "Recognizing the binomial setting"
        key_prerequisites: [independent-events]
        exemplars:
          - problem: 'Ana rolls a fair die $8$ times, and $X$ counts the rolls that show a $6$. Is $X$ binomial?'
            answer: 'yes'
            answer_contract: {"kind": "label", "options": [["yes", "it is", "it is binomial", "binomial", "yes, it is", "yes it is", "true"], ["no", "it is not", "it is not binomial", "not binomial", "no, it is not", "no it is not", "false"]]}
            solution_sketch: 'There are $8$ fixed trials, each a $6$ or not a $6$, with the same chance $1/6$ every time, and the rolls are independent. So $X$ is binomial and the answer is yes.'
          - problem: 'Five cards are drawn without replacement from a standard deck, and the number of hearts is counted. Is this number binomial?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "it is", "it is binomial", "binomial"], ["no", "it is not", "it is not binomial", "not binomial", "no, it is not", "no it is not", "it isn''t", "it is not a binomial"]]}
            solution_sketch: 'Without replacement the draws are not independent. The chance of a heart changes after each card is removed, so the count is not binomial.'
          - problem: 'A fair coin is flipped $10$ times and $X$ counts the heads. How many different values can $X$ take?'
            answer: '11'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'With $n=10$ trials the number of successes can be any of $0,1,\dots,10$. That is $10+1=11$ values.'
          - problem: 'A bag holds $3$ red and $7$ blue marbles. A marble is drawn, its colour is noted and it is put back. This is done $5$ times, and $X$ counts the red draws. What is the probability of a red marble on each draw?'
            answer: '3/10'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The marble is put back, so every draw is made from the same $10$ marbles. Red has probability $\frac{3}{10}$ on each draw.'
          - problem: 'The same bag holds $3$ red and $7$ blue marbles, but now two marbles are drawn without putting the first back. The first marble is red. What is the probability that the second marble is red?'
            answer: '2/9'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'After a red marble is taken out, $9$ marbles are left and $2$ of them are red. So the probability is $\frac29$, which differs from $\frac3{10}$, and the trials are not binomial.'
          - problem: 'A student guesses the answer to each of $12$ multiple-choice questions, and each question has $4$ choices with exactly one correct. What is the probability that a single guess is correct?'
            answer: '1/4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'One of the $4$ equally likely choices is correct. So each guess succeeds with probability $\frac14$, on every one of the $12$ questions.'
          - problem: 'A die is rolled $7$ times and $X$ counts the rolls that show an even number. What is the probability of success on each roll?'
            answer: '1/2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Three of the six faces, $2$, $4$ and $6$, are even. So each roll succeeds with probability $\frac36=\frac12$.'
          - problem: 'A factory tests $20$ items drawn from a very large batch in which $10\%$ of the items are defective, and $X$ counts the defective items in the sample. What is the probability that one chosen item is defective?'
            answer: '1/10'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The batch is very large, so taking out a few items hardly changes the share of defective ones. Each of the $20$ chosen items is defective with probability $\frac1{10}$, and the trials are treated as independent.'
        constraints: "one valid and one invalid setting per verdict item; at most two verdict items; the other items find p or the range of X"
      - id: kp2
        name: "P(X = k) with p = 1/2"
        key_prerequisites: [combinations, independent-events]
        exemplars:
          - problem: 'A fair coin is flipped $4$ times. Find $P(\text{exactly }2\text{ heads})$.'
            answer: '3/8'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'There are $\binom42=6$ orders with $2$ heads, and each has probability $\left(\frac12\right)^4=\frac1{16}$. So the probability is $\frac6{16}=\frac38$.'
          - problem: 'A fair coin is flipped $5$ times. Find $P(\text{exactly }3\text{ heads})$.'
            answer: '5/16'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'There are $\binom53=10$ orders with $3$ heads, and each has probability $\frac1{32}$. So the probability is $\frac{10}{32}=\frac5{16}$.'
          - problem: 'A fair six-sided die is rolled $5$ times. What is the probability that exactly one roll shows an even number?'
            answer: '5/32'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'An even roll has probability $\frac12$, so $n=5$ and $p=\frac12$. Then $P(X=1)=\binom51\left(\frac12\right)^5=\frac5{32}$.'
          - problem: 'A student guesses on $4$ two-choice questions, and exactly one choice is correct on each. What is the probability that exactly $1$ guess is correct?'
            answer: '1/4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Each guess is correct with probability $\frac12$. So $P(X=1)=\binom41\left(\frac12\right)^4=\frac4{16}=\frac14$.'
          - problem: 'A bag contains equal numbers of red and blue marbles. A marble is drawn and put back, $6$ times. What is the probability of exactly one red marble?'
            answer: '3/32'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Each draw is red with probability $\frac12$. So $P(X=1)=\binom61\left(\frac12\right)^6=\frac6{64}=\frac3{32}$.'
          - problem: 'A random number generator produces $0$ or $1$ with equal probability, and it produces $6$ numbers independently. What is the probability of exactly two ones?'
            answer: '15/64'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Here $n=6$ and $p=\frac12$. So $P(X=2)=\binom62\left(\frac12\right)^6=\frac{15}{64}$.'
          - problem: 'A fair coin is flipped $5$ times. What is the probability of at least $4$ heads?'
            answer: '3/16'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'At least $4$ heads means exactly $4$ or exactly $5$. Those have probabilities $\frac5{32}$ and $\frac1{32}$, and they add to $\frac6{32}=\frac3{16}$.'
          - problem: 'A true-or-false test has $8$ questions, and a student guesses every one. What is the probability of exactly $6$ correct answers?'
            answer: '7/64'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Each guess is correct with probability $\frac12$. So $P(X=6)=\binom86\left(\frac12\right)^8=\frac{28}{256}=\frac7{64}$.'
        constraints: "n <= 8; p = 1/2; answers exact fractions"
      - id: kp3
        name: "P(X = k) with general p"
        key_prerequisites: [combinations, independent-events]
        exemplars:
          - problem: 'Each of $3$ independent trials succeeds with probability $1/3$. Find $P(\text{exactly }2\text{ successes})$.'
            answer: '2/9'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'There are $\binom32=3$ orders. Each has probability $\left(\frac13\right)^2\cdot\frac23=\frac2{27}$. So the probability is $3\cdot\frac2{27}=\frac29$.'
          - problem: 'A fair die is rolled $4$ times. Find the probability of exactly one six.'
            answer: '125/324'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Here $n=4$ and $p=\frac16$. So $P(X=1)=\binom41\cdot\frac16\cdot\left(\frac56\right)^3=4\cdot\frac{125}{1296}=\frac{125}{324}$.'
          - problem: 'A biased coin lands heads with probability $1/3$ and is tossed $5$ times. Find the probability of exactly $4$ heads.'
            answer: '10/243'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'There are $\binom54=5$ orders. Each has probability $\left(\frac13\right)^4\cdot\frac23=\frac2{243}$. So the probability is $5\cdot\frac2{243}=\frac{10}{243}$.'
          - problem: 'A spinner lands on red with probability $1/4$ and is spun $4$ times. Find the probability of exactly $2$ red results.'
            answer: '27/128'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Here $P(X=2)=\binom42\left(\frac14\right)^2\left(\frac34\right)^2=6\cdot\frac{9}{256}=\frac{54}{256}=\frac{27}{128}$.'
          - problem: 'A standard die is rolled $6$ times. Find the probability that exactly two rolls show a six.'
            answer: '3125/15552'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Here $P(X=2)=\binom62\left(\frac16\right)^2\left(\frac56\right)^4=15\cdot\frac{625}{46656}=\frac{9375}{46656}=\frac{3125}{15552}$.'
          - problem: 'In a quality-control test each item fails with probability $1/3$, and $6$ items are tested independently. Find the probability that exactly $2$ items fail.'
            answer: '80/243'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Here $P(X=2)=\binom62\left(\frac13\right)^2\left(\frac23\right)^4=15\cdot\frac{16}{729}=\frac{240}{729}=\frac{80}{243}$.'
          - problem: 'Ava finds the probability of exactly two sixes in $3$ rolls of a die as $\binom32\left(\frac16\right)^2=\frac1{12}$. What is the correct probability?'
            answer: '5/72'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Ava left out the third roll, which is not a six and has probability $\frac56$. The correct value is $\binom32\left(\frac16\right)^2\cdot\frac56=3\cdot\frac1{36}\cdot\frac56=\frac5{72}$.'
          - problem: 'A basketball player makes each free throw with probability $0.7$, independently. In $5$ attempts, what is the probability of exactly $4$ made throws, to two decimal places?'
            answer: '0.36'
            answer_contract: {"kind": "approx", "decimals": 2}
            solution_sketch: 'Here $P(X=4)=\binom54\cdot0.7^4\cdot0.3=5\cdot0.2401\cdot0.3=0.36015$. To two decimal places that is $0.36$.'
          - problem: 'A machine makes a defective part with probability $0.1$, independently. Ten parts are made. What is the probability that none is defective, to two decimal places?'
            answer: '0.35'
            answer_contract: {"kind": "approx", "decimals": 2}
            solution_sketch: 'None defective means $10$ successes with probability $0.9$ each. So $P=0.9^{10}\approx0.3487$, which is $0.35$ to two decimal places.'
        constraints: "n <= 10; p in {1/3, 1/4, 1/6, 0.7, 0.1}; exact fractions or two-decimal approximations"
    diagnostic_exemplar:
      problem: 'Each trial succeeds with probability $1/4$; there are $3$ independent trials. Find $P(\text{exactly } 2 \text{ successes})$.'
      answer: "9/64"
      solution_sketch: '$\binom{3}{2} \left(\frac{1}{4}\right)^2 \left(\frac{3}{4}\right) = 3 \cdot \frac{1}{16} \cdot \frac{3}{4} = \frac{9}{64}$.'
    anki_seeds:
      - front: 'Binomial probability formula?'
        back: '$P(X = k) = \binom{n}{k} p^k (1-p)^{n-k}$.'
        type: basic
      - front: 'The four binomial conditions: fixed $n$, two outcomes per trial, constant $p$, and {{c1::independent}} trials.'
        back: 'independent'
        type: cloze

  - id: binomial-distribution
    name: "Binomial Distribution"
    core: false                # named distribution; terminal
    difficulty: 0.55
    drill: false
    answer_kind: multi-step
    expected_time_secs: 240
    prerequisites:
      - id: binomial-probability
        weight: 0.8
        key: true
      - id: discrete-random-variables
        weight: 0.5
        key: false
    knowledge_points:
      - id: kp1
        name: "At-least and at-most probabilities"
        key_prerequisites: [binomial-probability]
        try_first:
          problem: 'A fair coin is flipped $5$ times. What is the probability of at least one head?'
          answer_contract: {"kind": "exact"}
          answer: '31/32'
          reveal: 'Listing every outcome with a head is long. The only outcome without a head is five tails, so subtract its probability $1/32$ from $1$.'
        exemplars:
          - problem: 'A biased coin lands heads with probability $1/3$. It is flipped $3$ times. What is the probability of at least one head?'
            answer: '19/27'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The only outcome without a head is three tails, with probability $(2/3)^3 = 8/27$. So the probability of at least one head is $1 - 8/27 = 19/27$.'
          - problem: 'A fair die is rolled $3$ times, and $X$ is the number of sixes. Find $P(X \le 1)$.'
            answer: '25/27'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'At most one six means zero sixes or one six. Zero sixes has probability $(5/6)^3 = 125/216$, and one six has probability $3 \cdot (1/6) \cdot (5/6)^2 = 75/216$. The sum is $200/216 = 25/27$.'
          - problem: 'A basketball player makes a free throw with probability $3/4$. She shoots $3$ times. What is the probability that she makes at most two of them?'
            answer: '37/64'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The only way to make more than two is to make all three, with probability $(3/4)^3 = 27/64$. So the probability of at most two makes is $1 - 27/64 = 37/64$.'
          - problem: 'A spinner lands on red with probability $1/4$. It is spun $4$ times. What is the probability that red comes up at least once?'
            answer: '175/256'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The only outcome without red is four non-red spins, with probability $(3/4)^4 = 81/256$. So the probability of at least one red is $1 - 81/256 = 175/256$.'
          - problem: 'A fair die is rolled $4$ times, and $X$ is the number of sixes. Find $P(X \ge 2)$.'
            answer: '19/144'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'At least two sixes is the complement of zero or one six. Here $P(0) = (5/6)^4 = 625/1296$ and $P(1) = 4 \cdot (1/6) \cdot (5/6)^3 = 500/1296$. So the answer is $1 - 1125/1296 = 171/1296 = 19/144$.'
          - problem: 'Sam says that when a fair coin is flipped $3$ times, the probability of at least one head is $3 \cdot 1/2 = 3/2$. What is the correct probability?'
            answer: '7/8'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A probability is never above $1$, so adding the three chances of a head is wrong. The only outcome without a head is three tails, with probability $1/8$, so the answer is $1 - 1/8 = 7/8$.'
          - problem: 'A factory makes chips that are defective with probability $1/5$. An inspector tests $4$ chips. What is the probability that at most one of them is defective?'
            answer: '512/625'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Zero defective chips has probability $(4/5)^4 = 256/625$. Exactly one defective chip has probability $4 \cdot (1/5) \cdot (4/5)^3 = 256/625$. Their sum is $512/625$.'
          - problem: 'A quiz has $5$ multiple-choice questions with $4$ options each, and a student guesses every answer. What is the probability, to two decimal places, that at least one answer is right?'
            answer: '0.76'
            answer_contract: {"kind": "approx", "decimals": 2}
            solution_sketch: 'A guess is right with probability $1/4$ and wrong with probability $3/4$. All five wrong has probability $(3/4)^5 = 243/1024$, so at least one right has probability $1 - 243/1024 = 781/1024 \approx 0.76$.'
        constraints: "n <= 5; the complement for at-least-one; at-most sums over <= 3 terms"
      - id: kp2
        name: "Mean and variance: np and np(1-p)"
        key_prerequisites: [binomial-probability, discrete-random-variables]
        exemplars:
          - problem: '$X$ is binomial with $n = 12$ trials and success probability $p = 1/3$. What is $E[X]$?'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The mean of a binomial variable is $np$. So $E[X] = 12 \cdot 1/3 = 4$.'
          - problem: '$X$ is binomial with $n = 16$ and $p = 3/4$. What is $\operatorname{Var}(X)$?'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The variance of a binomial variable is $np(1-p)$. So $\operatorname{Var}(X) = 16 \cdot 3/4 \cdot 1/4 = 3$.'
          - problem: 'A basketball player makes each free throw with probability $2/5$ and shoots $15$ times. How many of the throws does she make on average?'
            answer: '6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The average number of makes is the mean $np$. So she makes $15 \cdot 2/5 = 6$ throws on average.'
          - problem: 'Each chip from a factory is defective with probability $1/5$, independently of the others. A box holds $30$ chips. What is the variance of the number of defective chips in a box?'
            answer: '24/5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The number of defective chips is binomial with $n = 30$ and $p = 1/5$. So the variance is $np(1-p) = 30 \cdot 1/5 \cdot 4/5 = 24/5$.'
          - problem: '$X$ is binomial with $n = 25$ and $p = 1/5$. What is the standard deviation of $X$?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The variance is $np(1-p) = 25 \cdot 1/5 \cdot 4/5 = 4$. The standard deviation is the square root of the variance, which is $2$.'
          - problem: 'A test has $60$ multiple-choice questions, and a student who guesses every answer expects to get $15$ right. What is the probability that a single guess is right?'
            answer: '1/4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The expected number of right answers is $np$, so $60p = 15$. Dividing by $60$ gives $p = 15/60 = 1/4$.'
          - problem: '$X$ is binomial with $n = 14$, $E[X] = 7$ and $\operatorname{Var}(X) = 7/2$. What is the success probability $p$?'
            answer: '1/2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The variance equals the mean times $1-p$. So $1 - p = (7/2)/7 = 1/2$, and $p = 1/2$.'
          - problem: '$X$ is binomial with $E[X] = 12$ and $\operatorname{Var}(X) = 4$. How many trials does the experiment have?'
            answer: '18'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The variance divided by the mean is $1 - p = 4/12 = 1/3$, so $p = 2/3$. Then $np = 12$ gives $n = 12 / (2/3) = 18$.'
          - problem: 'Tia says that the variance of a binomial variable with $n = 20$ and $p = 1/4$ is $20 \cdot 1/4 = 5$. What is the correct variance?'
            answer: '15/4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Tia found the mean $np = 5$, not the variance. The variance is $np(1-p) = 20 \cdot 1/4 \cdot 3/4 = 15/4$.'
        constraints: "np an integer or half-integer; p a simple fraction; includes finding p or n from the mean and variance"
      - id: kp3
        name: "Building the full distribution"
        key_prerequisites: [binomial-probability]
        exemplars:
          - problem: 'A biased coin lands heads with probability $1/4$. It is flipped $3$ times, and $X$ counts the heads. Find $P(X = 2)$.'
            answer: '9/64'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'There are $\binom{3}{2} = 3$ ways to place two heads among three flips. Each way has probability $(1/4)^2 \cdot 3/4 = 3/64$, so $P(X = 2) = 3 \cdot 3/64 = 9/64$.'
          - problem: 'A biased coin lands heads with probability $1/4$. It is flipped $4$ times, and $X$ counts the heads. Find $P(X \ge 3)$.'
            answer: '13/256'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Three heads has probability $4 \cdot (1/4)^3 \cdot 3/4 = 12/256$. Four heads has probability $(1/4)^4 = 1/256$. The sum is $13/256$.'
          - problem: 'A basketball player makes each free throw with probability $2/3$. She shoots $3$ free throws, and $X$ counts the makes. Find $P(X \le 1)$.'
            answer: '7/27'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Zero makes has probability $(1/3)^3 = 1/27$. One make has probability $3 \cdot 2/3 \cdot (1/3)^2 = 6/27$. The sum is $7/27$.'
          - problem: '$X$ is binomial with $n = 3$ and $p = 2/5$. Its table of probabilities lists $P(X=0) = 27/125$, $P(X=1) = 54/125$ and $P(X=2) = 36/125$. What is $P(X=3)$?'
            answer: '8/125'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The four probabilities in the table add up to $1$. The three known ones add up to $117/125$, so $P(X=3) = 1 - 117/125 = 8/125$. This agrees with $(2/5)^3 = 8/125$.'
          - problem: 'A production line makes defective chips with probability $1/5$. An inspector checks $4$ chips, and $X$ counts the defective ones. What is $P(X \ge 3)$?'
            answer: '17/625'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Three defective chips has probability $4 \cdot (1/5)^3 \cdot 4/5 = 16/625$. Four defective chips has probability $(1/5)^4 = 1/625$. The sum is $17/625$.'
          - problem: 'A quiz has $4$ true/false questions, and a student guesses every one, so each answer is right with probability $1/2$. What is the probability that the student gets one or two answers right?'
            answer: '5/8'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Exactly one right has probability $4/16$ and exactly two right has probability $6/16$. The sum is $10/16 = 5/8$.'
          - problem: '$X$ is binomial with $n = 3$ and $p = 1/4$. What is the probability that $X$ is even?'
            answer: '9/16'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The even values are $0$ and $2$. Here $P(X=0) = 27/64$ and $P(X=2) = 9/64$. The sum is $36/64 = 9/16$.'
          - problem: 'A seed germinates with probability $0.6$. A gardener plants $4$ seeds. What is the probability, to two decimal places, that exactly $3$ of them germinate?'
            answer: '0.35'
            answer_contract: {"kind": "approx", "decimals": 2}
            solution_sketch: 'There are $\binom{4}{3} = 4$ ways to choose the three seeds that germinate. Each way has probability $0.6^3 \cdot 0.4 = 0.0864$, so the answer is $4 \cdot 0.0864 = 0.3456 \approx 0.35$.'
          - problem: 'A fair coin is flipped $4$ times. What is the probability of exactly two heads?'
            answer: '3/8'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Two heads can be placed among four flips in $\binom{4}{2} = 6$ ways. Each way has probability $(1/2)^4 = 1/16$, so the answer is $6/16 = 3/8$.'
          - problem: 'A biased coin lands heads with probability $1/4$. It is flipped $3$ times, and $X$ counts the heads. What is the probability distribution of $X$, that is $P(X=0)$, $P(X=1)$, $P(X=2)$ and $P(X=3)$?'
            answer: '27/64, 27/64, 9/64, 1/64'
            answer_contract: {"kind": "list", "member": {"kind": "exact"}, "ordered": true}
            solution_sketch: 'Each outcome with $k$ heads has probability $(1/4)^k (3/4)^{3-k}$, and there are $\binom{3}{k}$ such outcomes. This gives $27/64$, $3 \cdot 9/64 = 27/64$, $3 \cdot 3/64 = 9/64$ and $1/64$, and these add to $1$.'
        constraints: "n <= 4; sums of two binomial terms or one missing table entry"
    diagnostic_exemplar:
      problem: 'A fair coin is flipped $4$ times; $X$ counts heads. Find $P(X \ge 3)$ and $E[X]$.'
      answer: '$P(X \ge 3) = 5/16$; $E[X] = 2$'
      solution_sketch: '$\frac{4}{16} + \frac{1}{16} = \frac{5}{16}$; $E[X] = np = 4 \cdot \frac{1}{2} = 2$.'
