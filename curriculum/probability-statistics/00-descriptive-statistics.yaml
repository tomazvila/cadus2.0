unit: descriptive-statistics
course: probability-statistics
module: "Descriptive Statistics"
topics:
  - id: summation-notation
    name: "Summation Notation"
    core: true
    difficulty: 0.25
    drill: false
    answer_kind: numeric
    expected_time_secs: 90
    prerequisites:
      - id: evaluating-expressions
        weight: 0.8
        key: true
      - id: order-of-operations
        weight: 0.5
        key: false
    knowledge_points:
      - id: kp1
        name: "Evaluating sigma notation"
        key_prerequisites: [evaluating-expressions]
        exemplars:
          - problem: 'Compute $\sum_{k=1}^{4} k$.'
            answer: "10"
            solution_sketch: 'Expand: $1 + 2 + 3 + 4 = 10$.'
          - problem: 'Compute $\sum_{i=1}^{3} 2i$.'
            answer: "12"
            solution_sketch: '$2 + 4 + 6 = 12$.'
          - problem: 'Compute $\sum_{k=2}^{5} (k+1)$.'
            answer: "18"
            solution_sketch: 'Terms for $k = 2, 3, 4, 5$: $3 + 4 + 5 + 6 = 18$.'
          - problem: 'Compute $\sum_{k=1}^{5} (2k - 1)$.'
            answer: "25"
            solution_sketch: 'Terms for $k = 1, 2, 3, 4, 5$: $1 + 3 + 5 + 7 + 9 = 25$.'
          - problem: "Compute $\\sum_{k=3}^{6} (3k - 2)$."
            answer: "46"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Expansion step: for k = 3, 4, 5, 6 the terms are 7, 10, 13, 16. Addition step: add the terms using order of operations, 7 + 10 + 13 + 16 = 46. So the sum is 46."
          - problem: "Compute $\\sum_{j=2}^{5} (12 - 2j)$."
            answer: "20"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Expansion step: for j = 2, 3, 4, 5 the terms are 8, 6, 4, 2. Addition step: use order of operations to add, 8 + 6 + 4 + 2 = 20. So the sum is 20."
        constraints: "index runs over at most 6 integers; summand linear in the index; start index may be > 1"
      - id: kp2
        name: "Sums over data lists"
        key_prerequisites: [evaluating-expressions]
        exemplars:
          - problem: 'For the data $x_1 = 2$, $x_2 = 5$, $x_3 = 7$, $x_4 = 10$, compute $\sum_{i=1}^{4} x_i$.'
            answer: "24"
            solution_sketch: 'Add the values: $2 + 5 + 7 + 10 = 24$.'
          - problem: 'For the data $x_1 = 1$, $x_2 = 3$, $x_3 = 4$, compute $\sum_{i=1}^{3} x_i^2$.'
            answer: "26"
            solution_sketch: '$1 + 9 + 16 = 26$; square each value first, then add.'
          - problem: 'For the data $x_1 = 2$, $x_2 = 3$, $x_3 = 4$, compute $\sum_{i=1}^{3} x_i^2$.'
            answer: "29"
            solution_sketch: '$4 + 9 + 16 = 29$.'
          - problem: 'For the data $x_1 = 3$, $x_2 = 1$, $x_3 = 2$, $x_4 = 4$, $x_5 = 5$, compute $\sum_{i=1}^{5} x_i$.'
            answer: "15"
            solution_sketch: '$3 + 1 + 2 + 4 + 5 = 15$.'
        constraints: "3-5 data values, all small integers; sums of x_i or x_i^2 only"
      - id: kp3
        name: "Linearity of sums"
        key_prerequisites: [evaluating-expressions]
        exemplars:
          - problem: 'Given $\sum_{i=1}^{5} x_i = 20$, compute $\sum_{i=1}^{5} 2x_i$.'
            answer: "40"
            solution_sketch: 'Constants factor out: $\sum 2x_i = 2 \sum x_i = 2 \cdot 20 = 40$.'
          - problem: 'Given $\sum_{i=1}^{5} x_i = 20$, compute $\sum_{i=1}^{5} (x_i + 3)$.'
            answer: "35"
            solution_sketch: 'Adding $3$ to each of the $5$ terms adds $15$: $20 + 15 = 35$.'
          - problem: 'Given $\sum_{i=1}^{6} x_i = 30$, compute $\sum_{i=1}^{6} 3x_i$.'
            answer: "90"
            solution_sketch: 'Constants factor out: $\sum 3x_i = 3 \sum x_i = 3 \cdot 30 = 90$.'
          - problem: 'Given $\sum_{i=1}^{4} x_i = 12$, compute $\sum_{i=1}^{4} (x_i + 5)$.'
            answer: "32"
            solution_sketch: 'Adding $5$ to each of the $4$ terms adds $20$: $12 + 20 = 32$.'
        constraints: "given sum is a small integer; n between 4 and 10; one operation (scale or shift) per problem"
    diagnostic_exemplar:
      problem: 'Given $\sum_{i=1}^{4} x_i = 10$, compute $\sum_{i=1}^{4} (2x_i + 3)$.'
      answer: '32'
      solution_sketch: 'Linearity: $2 \cdot 10 + 3 \cdot 4 = 20 + 12 = 32$.'
    anki_seeds:
      - front: '$\sum_{i=1}^{n} x_i$ means...'
        back: '$x_1 + x_2 + \cdots + x_n$ — add the terms as the index $i$ runs from $1$ to $n$.'
        type: basic
      - front: 'What is $\sum_{i=1}^{n} c$ for a constant $c$?'
        back: '$nc$ — the constant is added $n$ times.'
        type: basic

  - id: frequency-tables-histograms
    name: "Frequency Tables and Histograms"
    core: true
    difficulty: 0.2
    drill: false
    answer_kind: numeric
    expected_time_secs: 90
    prerequisites:
      - id: comparing-ordering-whole-numbers
        weight: 0.6
        key: true
      - id: multi-digit-addition-subtraction
        weight: 0.4
        key: false
      - id: percentages
        weight: 0.4
        key: false
    knowledge_points:
      - id: kp1
        name: "Tallying a frequency table"
        key_prerequisites: [comparing-ordering-whole-numbers]
        exemplars:
          - problem: 'The data $2, 3, 3, 5, 3, 2, 5, 3$ is tallied into a frequency table. What is the frequency of the value $3$?'
            answer: "4"
            solution_sketch: 'Count the occurrences of $3$ in the list: it appears $4$ times.'
          - problem: 'A frequency table lists values $1, 2, 3$ with frequencies $4, 7, 9$. How many data values are there in total?'
            answer: "20"
            solution_sketch: 'The total count is the sum of the frequencies: $4 + 7 + 9 = 20$.'
          - problem: 'The data $1, 4, 2, 4, 4, 1, 2, 4, 5, 4$ is tallied into a frequency table. What is the frequency of the value $4$?'
            answer: "5"
            solution_sketch: 'Count the occurrences of $4$ in the list: it appears $5$ times.'
          - problem: 'A frequency table lists values $2, 4, 6, 8$ with frequencies $3, 5, 1, 6$. How many data values are there in total?'
            answer: "15"
            solution_sketch: 'Add the frequencies: $3 + 5 + 1 + 6 = 15$.'
          - problem: "The data 3, 5, 3, 1, 5, 5, 3, 1 is tallied into a frequency table. What is the frequency of the value 5?"
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Tally the list by counting occurrences of each value: 3 appears 3 times, 5 appears 3 times, and 1 appears 2 times. Checking the value 5 specifically, it occurs at three positions in the list. The frequency of the value 5 is 3."
          - problem: "A frequency table lists the values 1, 2, 3, 4 with frequencies 3, ?, 4, 6, and the total number of data values is 20. Find the missing frequency."
            answer: "7"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Use the sum rule for a frequency table: the total equals the sum of all row frequencies, so 3 + 4 + 6 = 13 for the known rows. Subtract this sum from the given total of 20 to get the missing frequency: 20 - 13 = 7. The missing frequency is 7."
        constraints: "raw lists of 6-12 small integers, or tables with 3-5 rows; frequencies are single digits"
      - id: kp2
        name: "Relative frequency"
        key_prerequisites: [percentages]
        exemplars:
          - problem: 'A frequency table has frequencies $6, 9, 5$ for three categories. What is the relative frequency of the second category, as a fraction?'
            answer: "9/20"
            solution_sketch: 'Total $= 6 + 9 + 5 = 20$; relative frequency $= 9/20$.'
          - problem: 'In a class of $25$ students, $10$ walk to school. What is the relative frequency of walking, as a decimal?'
            answer: "0.4"
            solution_sketch: '$10/25 = 2/5 = 0.4$, i.e. $40\%$.'
          - problem: 'A frequency table has frequencies $8, 7, 10$ for three categories. What is the relative frequency of the third category, as a fraction?'
            answer: "2/5"
            solution_sketch: 'Total $= 8 + 7 + 10 = 25$; relative frequency $= 10/25 = 2/5$.'
          - problem: 'Out of $50$ coin flips, $30$ land heads. What is the relative frequency of heads, as a decimal?'
            answer: "0.6"
            solution_sketch: '$30/50 = 3/5 = 0.6$, i.e. $60\%$.'
        constraints: "totals of 20, 25, or 50 so fractions and percents come out clean"
      - id: kp3
        name: "Reading histograms"
        key_prerequisites: [comparing-ordering-whole-numbers]
        exemplars:
          - problem: 'A histogram has bars over the intervals $0$-$9$, $10$-$19$, $20$-$29$ with heights $5$, $8$, $3$. How many data values are at least $10$?'
            answer: "11"
            solution_sketch: 'Add the heights of the bars from $10$ up: $8 + 3 = 11$.'
          - problem: 'The same histogram has bar heights $5$, $8$, $3$. How many data values are there in total?'
            answer: "16"
            solution_sketch: '$5 + 8 + 3 = 16$.'
          - problem: 'A histogram has bars over the intervals $0$-$9$, $10$-$19$, $20$-$29$, $30$-$39$ with heights $6, 2, 7, 4$. How many data values are below $20$?'
            answer: "8"
            solution_sketch: 'Add the heights of the bars below $20$: $6 + 2 = 8$.'
          - problem: 'A histogram has bars over the intervals $0$-$9$, $10$-$19$, $20$-$29$ with heights $7, 1, 5$. How many data values are at least $10$?'
            answer: "6"
            solution_sketch: 'Add the heights of the bars from $10$ up: $1 + 5 = 6$.'
        constraints: "3-5 equal-width intervals; bar heights are single-digit integers; describe the histogram in words"
    diagnostic_exemplar:
      problem: 'For the data $4, 1, 4, 2, 4, 1, 2, 4$: give (frequency of $4$, relative frequency of $4$) as an ordered pair, with the relative frequency as a fraction.'
      answer: '$(4, 1/2)$'
      solution_sketch: 'The value $4$ appears $4$ times out of $8$ data values: $4/8 = 1/2$.'
    anki_seeds:
      - front: 'The frequency of a value is...'
        back: 'The number of times it occurs in the data set.'
        type: basic
      - front: 'Relative frequency $=$ ?'
        back: 'frequency $\div$ total number of data values.'
        type: basic

  - id: dot-plots-stem-leaf
    name: "Dot Plots and Stem-and-Leaf Plots"
    core: false                # data-display branch; terminal
    difficulty: 0.2
    drill: false
    answer_kind: numeric
    expected_time_secs: 90
    prerequisites:
      - id: place-value
        weight: 0.6
        key: true
      - id: comparing-ordering-whole-numbers
        weight: 0.4
        key: false
    knowledge_points:
      - id: kp1
        name: "Reading dot plots"
        key_prerequisites: [comparing-ordering-whole-numbers]
        exemplars:
          - problem: 'A dot plot over the values $1, 2, 3, 4, 5$ has $2, 4, 3, 0, 1$ dots respectively. How many data values are there?'
            answer: "10"
            solution_sketch: 'Each dot is one data value: $2 + 4 + 3 + 0 + 1 = 10$.'
          - problem: 'In the same dot plot ($2, 4, 3, 0, 1$ dots over $1$-$5$), how many data values are greater than $2$?'
            answer: "4"
            solution_sketch: 'Count dots over $3, 4, 5$: $3 + 0 + 1 = 4$.'
          - problem: 'A dot plot over the values $1, 2, 3, 4, 5, 6$ has $3, 0, 5, 2, 4, 1$ dots respectively. How many data values are there?'
            answer: "15"
            solution_sketch: 'Each dot is one data value: $3 + 0 + 5 + 2 + 4 + 1 = 15$.'
          - problem: 'In the dot plot with $3, 0, 5, 2, 4, 1$ dots over $1$-$6$, how many data values are less than $4$?'
            answer: "8"
            solution_sketch: 'Count dots over $1, 2, 3$: $3 + 0 + 5 = 8$.'
          - problem: "A dot plot over the values 2, 3, 4, 5, 6, 7 has 1, 5, 2, 4, 0, 3 dots respectively. What fraction of the data values are greater than 4? Give the answer as a fraction in lowest terms."
            answer: "7/15"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (dot-plot reading): the full plot has dots 1, 5, 2, 4, 0, 3 over the positions 2 through 7, so the total number of data values is 1+5+2+4+0+3 = 15. Step 2 (comparing and ordering whole numbers): the values greater than 4 are 5, 6, 7, and their dots give 4+0+3 = 7 data values. Step 3 (part over whole): the fraction of data values greater than 4 is 7/15, and gcd(7, 15) = 1 so it is in lowest terms. The answer is 7/15."
          - problem: "A dot plot over the values 1 through 7 has 2, 0, 3, 1, 4, 5, 2 dots at the values 1, 2, 3, 4, 5, 6, 7 respectively. What fraction of the data values are at least 5? Give the answer as a fraction in lowest terms."
            answer: "11/17"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (dot-plot reading): the full plot has dots 2, 0, 3, 1, 4, 5, 2 over the positions 1 through 7, so the total number of data values is 2+0+3+1+4+5+2 = 17. Step 2 (comparing and ordering whole numbers): the values at least 5 are 5, 6, 7, and their dots give 4+5+2 = 11 data values. Step 3 (part over whole): the fraction of data values at least 5 is 11/17, and gcd(11, 17) = 1 so it is in lowest terms. The answer is 11/17."
        constraints: "5-7 positions with 0-5 dots each; describe the plot in words"
      - id: kp2
        name: "Reading stem-and-leaf plots"
        key_prerequisites: [place-value]
        exemplars:
          - problem: 'In a stem-and-leaf plot with stems in tens, the row $4 \mid 0\ 2\ 2\ 8$ represents which data values?'
            answer: '$40, 42, 42, 48$'
            solution_sketch: 'Each leaf attaches to the stem: $40, 42, 42, 48$.'
          - problem: 'A stem-and-leaf plot has rows $1 \mid 5\ 8$, $2 \mid 0\ 3\ 3\ 9$, $3 \mid 1$. What is the largest data value?'
            answer: "31"
            solution_sketch: 'The last leaf of the last stem: stem $3$, leaf $1$, so $31$.'
          - problem: 'A stem-and-leaf plot has rows $2 \mid 1\ 4\ 7$, $3 \mid 0\ 2\ 8$, $4 \mid 5$. What is the smallest data value?'
            answer: "21"
            solution_sketch: 'The first leaf of the first stem: stem $2$, leaf $1$, so $21$.'
          - problem: 'A stem-and-leaf plot has rows $1 \mid 2\ 9$, $2 \mid 3\ 5$, $3 \mid 0\ 6$. What is the largest data value?'
            answer: "36"
            solution_sketch: 'The last leaf of the last stem: stem $3$, leaf $6$, so $36$.'
          - problem: 'A stem-and-leaf plot with stems in tens has rows $3 \mid 1\ 4\ 8$, $4 \mid 2$. How many data values does it represent?'
            answer: "4"
            solution_sketch: 'Each leaf is one data value: $3 + 1 = 4$ leaves in total.'
          - problem: "A stem-and-leaf plot with stems in tens has rows 2 | 0 5, 3 | 1 4 4 8, 4 | 2 7. How many data values are greater than 30?"
            answer: "6"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Using place value, stem 3 gives 31, 34, 34, 38 and stem 4 gives 42, 47, all of which exceed 30. Stem 2 gives 20 and 25, which do not exceed 30. Counting the values above 30 gives 31, 34, 34, 38, 42, 47, which is 6 values. So the answer is 6."
        constraints: "stems are tens digits; 2-4 rows with 1-5 leaves each; leaves listed in increasing order"
      - id: kp3
        name: "Extracting features from a plot"
        key_prerequisites: [place-value]
        exemplars:
          - problem: 'A stem-and-leaf plot has rows $1 \mid 5\ 8$, $2 \mid 0\ 3\ 3\ 9$, $3 \mid 1$. What is the mode of the data?'
            answer: "23"
            solution_sketch: 'The repeated leaf $3$ on stem $2$ gives $23$ twice; every other value appears once.'
          - problem: 'In the same plot, how many data values lie between $20$ and $29$ inclusive?'
            answer: "4"
            solution_sketch: 'That is the number of leaves on stem $2$: $0, 3, 3, 9$ — four leaves.'
          - problem: 'A stem-and-leaf plot has rows $1 \mid 2\ 2\ 7$, $2 \mid 0\ 4$, $3 \mid 5$. What is the mode of the data?'
            answer: "12"
            solution_sketch: 'The repeated leaf $2$ on stem $1$ gives $12$ twice; every other value appears once.'
          - problem: 'In the same plot ($1 \mid 2\ 2\ 7$, $2 \mid 0\ 4$, $3 \mid 5$), how many data values lie between $10$ and $19$ inclusive?'
            answer: "3"
            solution_sketch: 'That is the number of leaves on stem $1$: $2, 2, 7$ — three leaves.'
          - problem: "A stem-and-leaf plot has rows $1 \\mid 3\\ 5\\ 8$, $2 \\mid 0\\ 4$, $3 \\mid 2$. Find the minimum data value."
            answer: "13"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Reading each stem-leaf pair gives the full data list 13, 15, 18, 20, 24, 32. The smallest stem is 1, and its smallest leaf is 3, so the smallest value is 13. The minimum data value is 13."
          - problem: "A dot plot shows one dot per value: 5, 7, 7, 9, 10. Find the maximum value."
            answer: "10"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The dot plot corresponds to the data list 5, 7, 7, 9, 10. The rightmost dot on the number line is at 10, which is larger than every other listed value. The maximum value is 10."
        constraints: "questions ask for a count, the min/max, or the most frequent value; exactly one value repeats when the mode is asked"
    diagnostic_exemplar:
      problem: 'A stem-and-leaf plot (stems in tens) has rows $2 \mid 1\ 4$, $3 \mid 0\ 0\ 7$. List the data values in increasing order.'
      answer: '$21, 24, 30, 30, 37$'
      solution_sketch: 'Attach each leaf to its stem; the final leaf of the bottom row gives the largest value, $37$.'
    anki_seeds:
      - front: 'In a stem-and-leaf plot with stems in tens, the row $5 \mid 2\ 6$ means...'
        back: 'The data values $52$ and $56$.'
        type: basic
      - front: 'In a dot plot, each dot represents...'
        back: 'One data value at that position.'
        type: basic

  - id: reading-statistical-graphs
    name: "Reading and Critiquing Statistical Graphs"
    core: false                # data-display branch; terminal
    difficulty: 0.3
    drill: false
    answer_kind: numeric
    expected_time_secs: 120
    prerequisites:
      - id: frequency-tables-histograms
        weight: 0.7
        key: true
      - id: dot-plots-stem-leaf
        weight: 0.4
        key: false
      - id: percentages
        weight: 0.3
        key: false
    knowledge_points:
      - id: kp1
        name: "Comparisons from bar graphs"
        key_prerequisites: [frequency-tables-histograms]
        exemplars:
          - problem: 'A bar graph shows club membership: Art $12$, Band $18$, Chess $6$. How many more students are in Band than in Chess?'
            answer: "12"
            solution_sketch: '$18 - 6 = 12$.'
          - problem: 'With bars Art $12$, Band $18$, Chess $6$, what fraction of all members are in Art?'
            answer: '$\frac{1}{3}$'
            solution_sketch: 'Total $= 36$; $12/36 = 1/3$.'
          - problem: 'A bar graph shows pet counts: dogs $9$, cats $6$, fish $5$. What fraction of all the pets are cats? Give a fraction in lowest terms.'
            answer: "3/10"
            solution_sketch: 'Total $= 9 + 6 + 5 = 20$; $6/20 = 3/10$.'
          - problem: 'A bar graph shows book sales: Fiction $14$, Nonfiction $8$, Poetry $3$. How many more Fiction books were sold than Nonfiction?'
            answer: "6"
            solution_sketch: '$14 - 8 = 6$.'
        constraints: "3-4 categories, single- or double-digit bar heights; totals divide cleanly for fraction questions"
      - id: kp2
        name: "Shape of a distribution"
        key_prerequisites: [frequency-tables-histograms]
        exemplars:
          - problem: 'A histogram has a tall peak on the left and a long tail stretching to the right. How is the distribution skewed?'
            answer: 'Right-skewed'
            answer_contract: {kind: label, options: [[Symmetric], [Uniform], [Left-skewed], [Right-skewed]]}
            solution_sketch: 'Skew direction follows the long tail, not the peak.'
          - problem: 'A histogram of bar heights $2, 5, 8, 5, 2$ over equal intervals has what shape?'
            answer: 'Symmetric'
            answer_contract: {kind: label, options: [[Symmetric], [Uniform], [Left-skewed], [Right-skewed]]}
            solution_sketch: 'The heights rise to a single middle peak and fall symmetrically.'
          - problem: 'A histogram has bars of equal height over equal intervals. What shape is the distribution?'
            answer: 'Uniform'
            answer_contract: {kind: label, options: [[Symmetric], [Uniform], [Left-skewed], [Right-skewed]]}
            solution_sketch: 'Equal heights mean no peak: every interval is about equally common.'
          - problem: 'A histogram has a tall peak on the right and a long tail stretching to the left. How is the distribution skewed?'
            answer: 'Left-skewed'
            answer_contract: {kind: label, options: [[Symmetric], [Uniform], [Left-skewed], [Right-skewed]]}
            solution_sketch: 'The long tail points left, so the distribution is left-skewed (negatively skewed).'
        constraints: "shapes limited to symmetric, uniform, left-skewed, right-skewed; describe histograms in words"
      - id: kp3
        name: "Spotting misleading graphs"
        key_prerequisites: [frequency-tables-histograms]
        exemplars:
          - problem: 'A bar chart''s vertical axis starts at $50$ instead of $0$. What effect does this have on the bars?'
            answer: 'It exaggerates the differences between the bars'
            answer_contract: {kind: label, options: [[It exaggerates the differences between the bars], [It makes the bars look more equal], [It reverses the order of the bars], [It has no effect on the bars]]}
            solution_sketch: 'Truncating the axis removes the common base, so small differences look large.'
          - problem: 'A bar chart''s vertical axis starts at $40$ instead of $0$. A bar represents a value of $52$. How many units tall is the drawn bar?'
            answer: "12"
            solution_sketch: 'The drawn height is the value above the cut axis: $52 - 40 = 12$ units.'
          - problem: 'Two bars represent values $60$ and $63$ on an axis that starts at $0$. What is the true ratio of the second bar''s height to the first, as a decimal?'
            answer: "1.05"
            solution_sketch: '$63/60 = 1.05$ — the bars differ by only $5\%$ when the axis starts at $0$.'
          - problem: "A bar chart's vertical axis starts at 60 instead of 0. Two bars represent values 64 and 70. How many times taller does the 70 bar look than the 64 bar? Give the answer as a fraction."
            answer: "5/2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The truncated axis starts at 60, and the bars represent 64 and 70. Step 1: subtract the axis start to get drawn heights: 70 minus 60 = 10 and 64 minus 60 = 4. Step 2: divide the drawn heights to get the apparent ratio: 10/4 = 5/2. The apparent ratio is 5/2."
          - problem: "A histogram uses intervals 0-10, 10-20, and 20-50. The bar heights are 4, 5, and 5 observations per unit. How many times as many observations are in the 20-50 interval as in the 0-10 interval? Give the answer as a fraction."
            answer: "15/4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "A histogram with intervals 0-10, 10-20, and 20-50 has heights 4, 5, and 5 observations per unit. Step 1: for 20-50 the width is 30, so its count is 5 times 30 = 150. Step 2: for 0-10 the width is 10, so its count is 4 times 10 = 40. Step 3: the ratio is 150/40 = 15/4. The ratio is 15/4."
          - problem: "A bar chart shows revenue for four regions, but the scale has no numbers and no unit. Which flaw does this chart have?"
            answer: "Missing axis labels"
            answer_contract: {"kind": "label", "options": [["Missing axis labels"], ["Truncated vertical axis"], ["Unequal intervals"], ["Reversed order of bars"]]}
            solution_sketch: "A bar chart has no numbers and no unit on its scale, so the values cannot be read. Step 1: check for a scale; a missing scale is the flaw class missing labels, so the correct option is Missing axis labels. Step 2: the wrong option Truncated vertical axis describes an axis that starts above zero, but here nothing is cut off. Step 3: the wrong option Unequal intervals needs bars of different widths, while all bars here span the same kind of category. Step 4: the wrong option Reversed order of bars needs bars out of order, but the order of the regions is not the issue. The flaw is Missing axis labels."
        constraints: "flaws limited to truncated axes, unequal intervals, or missing labels; one flaw per problem"
    diagnostic_exemplar:
      problem: 'A histogram of commute times has bar heights $9, 6, 3, 1$ over $0$-$14$, $15$-$29$, $30$-$44$, $45$-$59$ minutes. How many commutes are $30$ minutes or longer, and what is the shape of the distribution?'
      answer: '$4$ commutes; right-skewed.'
      answer_contract: {kind: none}
      solution_sketch: '$3 + 1 = 4$; frequencies fall off in a long right tail.'
    anki_seeds:
      - front: 'A distribution with a long tail to the right is called...'
        back: 'Right-skewed (positively skewed) — the skew names the tail side.'
        type: basic
      - front: 'A bar chart whose vertical axis does not start at 0...'
        back: 'Exaggerates the differences between bars (a truncated axis).'
        type: basic

  - id: mean-of-a-data-set
    name: "The Mean of a Data Set"
    core: true
    difficulty: 0.2
    drill: false
    answer_kind: numeric
    expected_time_secs: 90
    prerequisites:
      - id: decimal-operations
        weight: 0.6
        key: true
      - id: long-division
        weight: 0.4
        key: false
    knowledge_points:
      - id: kp1
        name: "Computing the mean"
        key_prerequisites: [decimal-operations, long-division]
        exemplars:
          - problem: 'Find the mean of $4, 7, 9, 12$.'
            answer: "8"
            solution_sketch: 'Sum $= 32$; mean $= 32/4 = 8$.'
          - problem: 'Find the mean of $3, 5, 5, 8, 9$.'
            answer: "6"
            solution_sketch: 'Sum $= 30$; mean $= 30/5 = 6$.'
          - problem: 'Find the mean of $6, 8, 10, 14, 12$.'
            answer: "10"
            solution_sketch: 'Sum $= 50$; mean $= 50/5 = 10$.'
          - problem: 'Find the mean of $2, 7, 11, 12$.'
            answer: "8"
            solution_sketch: 'Sum $= 32$; mean $= 32/4 = 8$.'
          - problem: "A student scores 5, 7, 8, 10, and 5 on five quizzes. Find the mean quiz score."
            answer: "7"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (addition): the five quiz scores are 5, 7, 8, 10, and 5; their sum is 5 + 7 + 8 + 10 + 5 = 35. Step 2 (division): divide the sum by the number of scores, 35/5 = 7. The mean quiz score is 7."
          - problem: "A delivery driver records 5, 8, 9, 11, and 12 stops on five days. Find the mean number of stops."
            answer: "9"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (addition): the five daily stop counts are 5, 8, 9, 11, and 12; their sum is 5 + 8 + 9 + 11 + 12 = 45. Step 2 (division): divide the sum by 5, 45/5 = 9. The mean number of stops is 9."
        constraints: "4-6 small positive integers; sum divides evenly by n"
      - id: kp2
        name: "Means with decimal results"
        key_prerequisites: [decimal-operations]
        exemplars:
          - problem: 'Find the mean of $3, 4, 6, 8$.'
            answer: "5.25"
            solution_sketch: 'Sum $= 21$; mean $= 21/4 = 5.25$.'
          - problem: 'Find the mean of $1, 2, 2, 5$.'
            answer: "2.5"
            solution_sketch: 'Sum $= 10$; mean $= 10/4 = 2.5$.'
          - problem: 'Find the mean of $2, 3, 5, 8$.'
            answer: "4.5"
            solution_sketch: 'Sum $= 18$; mean $= 18/4 = 4.5$.'
          - problem: 'Find the mean of $4, 6, 7, 10$.'
            answer: "6.75"
            solution_sketch: 'Sum $= 27$; mean $= 27/4 = 6.75$.'
        constraints: "4 or 5 values; mean terminates after at most two decimal places"
      - id: kp3
        name: "Using the mean to find a total or missing value"
        key_prerequisites: [decimal-operations]
        exemplars:
          - problem: 'The mean of $5$ numbers is $12$. What is their sum?'
            answer: "60"
            solution_sketch: 'sum $=$ mean $\times$ count $= 12 \cdot 5 = 60$.'
          - problem: 'Four test marks (out of $10$) have mean $7$. Three of them are $6, 9, 5$. Find the fourth mark.'
            answer: "8"
            solution_sketch: 'Total needed $= 4 \cdot 7 = 28$; known marks sum to $20$; fourth $= 28 - 20 = 8$.'
          - problem: 'The mean of $6$ numbers is $9$. What is their sum?'
            answer: "54"
            solution_sketch: 'sum $=$ mean $\times$ count $= 9 \cdot 6 = 54$.'
          - problem: 'Five test marks (out of $10$) have mean $8$. Four of them are $7, 9, 6, 10$. Find the fifth mark.'
            answer: "8"
            solution_sketch: 'Total needed $= 5 \cdot 8 = 40$; known marks sum to $32$; fifth $= 40 - 32 = 8$.'
          - problem: "A basketball player scores a mean of 14 points in 5 games. How many points did the player score in total?"
            answer: "70"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: Use the total rule: total = mean * count. Step 2: Substitute mean = 14 and count = 5, so total = 14 * 5 = 70. The total is 70."
          - problem: "The mean number of stamps in 4 boxes is 25. Three boxes contain 20, 30, and 22 stamps. Find the number in the fourth box."
            answer: "28"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: Required total = mean * count = 25 * 4 = 100. Step 2: Known sum = 20 + 30 + 22 = 72. Step 3: Fourth value = 100 - 72 = 28. The number in the fourth box is 28."
        constraints: "counts of 4-6; all totals and missing values are whole numbers"
    diagnostic_exemplar:
      problem: 'Four test marks (out of $10$) have mean $8$. Three of them are $9, 6, 10$. Find the fourth mark.'
      answer: '7'
      solution_sketch: 'Total $= 4 \cdot 8 = 32$; $32 - (9 + 6 + 10) = 7$.'
    anki_seeds:
      - front: 'Mean of a data set $=$ ?'
        back: '$\frac{\text{sum of the values}}{\text{number of values}}$.'
        type: basic
      - front: 'If a data set of $n$ values has mean $\bar{x}$, its sum is...'
        back: '$n \bar{x}$ — mean times count.'
        type: basic

  - id: median-and-mode
    name: "Median and Mode"
    core: true
    difficulty: 0.2
    drill: false
    answer_kind: numeric
    expected_time_secs: 90
    prerequisites:
      - id: comparing-ordering-whole-numbers
        weight: 0.6
        key: true
      - id: decimal-operations
        weight: 0.4
        key: false
    knowledge_points:
      - id: kp1
        name: "Median of an odd-count list"
        key_prerequisites: [comparing-ordering-whole-numbers]
        exemplars:
          - problem: 'Find the median of $12, 3, 7, 9, 5$.'
            answer: "7"
            solution_sketch: 'Sort: $3, 5, 7, 9, 12$; the middle value is $7$.'
          - problem: 'Find the median of $8, 1, 4$.'
            answer: "4"
            solution_sketch: 'Sorted: $1, 4, 8$; the middle value is $4$.'
          - problem: 'Find the median of $9, 2, 14, 6, 11$.'
            answer: "9"
            solution_sketch: 'Sorted: $2, 6, 9, 11, 14$; the middle value is $9$.'
          - problem: 'Find the median of $15, 3, 8$.'
            answer: "8"
            solution_sketch: 'Sorted: $3, 8, 15$; the middle value is $8$.'
          - problem: "Find the median of $14, 3, 9, 21, 6, 12, 17$."
            answer: "12"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Sorting rule: the values in order are 3, 6, 9, 12, 14, 17, 21. Median definition: with seven values, an odd count, the median is the fourth value. The median is 12."
          - problem: "On five quizzes a student scored $18, 7, 15, 11, 13$. Find the median quiz score."
            answer: "13"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Sorting rule: the scores in order are 7, 11, 13, 15, 18. Median definition: with five scores, an odd count, the third score is the median. The median quiz score is 13."
        constraints: "3-7 values given unsorted, odd count"
      - id: kp2
        name: "Median of an even-count list"
        key_prerequisites: [comparing-ordering-whole-numbers, decimal-operations]
        exemplars:
          - problem: 'Find the median of $4, 6, 8, 10$.'
            answer: "7"
            solution_sketch: 'Even count: average the two middle values, $(6 + 8)/2 = 7$.'
          - problem: 'Find the median of $3, 9, 5, 7, 2, 8$.'
            answer: "6"
            solution_sketch: 'Sorted: $2, 3, 5, 7, 8, 9$; median $= (5 + 7)/2 = 6$.'
          - problem: 'Find the median of $7, 2, 10, 5$.'
            answer: "6"
            solution_sketch: 'Sorted: $2, 5, 7, 10$; median $= (5 + 7)/2 = 6$.'
          - problem: 'Find the median of $12, 4, 9, 1, 6, 8$.'
            answer: "7"
            solution_sketch: 'Sorted: $1, 4, 6, 8, 9, 12$; median $= (6 + 8)/2 = 7$.'
          - problem: "The data set is 11, 5, 9, 7. Find the median."
            answer: "8"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: sort the values: 5, 7, 9, 11. Step 2: use the even-count median rule and average the two middle values: (7 + 9)/2 = 8. The median is 8."
          - problem: "The data set is 10, 2, 17, 8, 13, 5. Find the median."
            answer: "9"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: sort the values: 2, 5, 8, 10, 13, 17. Step 2: use the even-count median rule; the middle positions are 3 and 4, so average 8 and 10: (8 + 10)/2 = 9. The median is 9."
        constraints: "4-8 values given unsorted, even count; the two middle values average to an integer or a .5 value"
      - id: kp3
        name: "Mode (including no mode and two modes)"
        key_prerequisites: [comparing-ordering-whole-numbers]
        exemplars:
          - problem: 'Find the mode of $2, 4, 4, 7, 9$.'
            answer: "4"
            solution_sketch: 'The value $4$ appears twice; every other value appears once.'
          - problem: 'Find the mode(s) of $1, 2, 2, 5, 5, 9$, and give them as a set.'
            answer: '$\{2, 5\}$'
            solution_sketch: 'Both $2$ and $5$ appear twice, more than any other value — the data is bimodal.'
          - problem: 'How many modes does the data $3, 6, 8, 11$ have?'
            answer: "0"
            solution_sketch: 'No value repeats, so there is no mode.'
          - problem: 'Find the mode of $5, 3, 7, 3, 8, 3$.'
            answer: "3"
            solution_sketch: 'The value $3$ appears three times; no other value appears more than once.'
          - problem: 'How many modes does the data $6, 2, 6, 8, 2, 5$ have?'
            answer: "2"
            solution_sketch: 'Both $6$ and $2$ appear twice, more than any other value — the data is bimodal, so it has $2$ modes.'
          - problem: "A quality check records these seven counts: 8, 1, 8, 3, 5, 8, 2. Find the mode."
            answer: "8"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The data are 8, 1, 8, 3, 5, 8, 2. Step 1: count frequencies; 8 appears three times, while 1, 3, 5, and 2 appear once. Step 2: apply the mode rule, choosing the value with the greatest frequency, which gives 8. The mode is 8."
        constraints: "5-8 values; at most two modes; modes given as a set, or a count of 0 when nothing repeats"
    diagnostic_exemplar:
      problem: 'For the data $8, 3, 5, 3, 9, 2$: give (median, mode) as an ordered pair.'
      answer: '$(4, 3)$'
      solution_sketch: 'Sorted: $2, 3, 3, 5, 8, 9$; even count, so the median is $(3+5)/2 = 4$; the only repeated value is $3$.'
    anki_seeds:
      - front: 'For an even number of sorted values, the median is...'
        back: 'The average of the two middle values.'
        type: basic
      - front: 'The mode of a data set is...'
        back: 'The most frequent value (there may be several modes, or none if nothing repeats).'
        type: basic

  - id: weighted-averages
    name: "Weighted Averages"
    core: true
    difficulty: 0.3
    drill: false
    answer_kind: numeric
    expected_time_secs: 120
    prerequisites:
      - id: mean-of-a-data-set
        weight: 0.8
        key: true
      - id: decimal-operations
        weight: 0.4
        key: false
      - id: percentages
        weight: 0.4
        key: false
    knowledge_points:
      - id: kp1
        name: "Weighted mean with counts"
        key_prerequisites: [mean-of-a-data-set]
        exemplars:
          - problem: 'Three tests score $9$ each (out of $10$) and two tests score $4$ each. What is the mean of the five marks?'
            answer: "7"
            solution_sketch: '$(3 \cdot 9 + 2 \cdot 4)/5 = (27 + 8)/5 = 35/5 = 7$.'
          - problem: 'A class of $10$ students averages $6$ (out of $10$) and a class of $20$ students averages $9$. What is the combined mean?'
            answer: "8"
            solution_sketch: 'Total $= 10 \cdot 6 + 20 \cdot 9 = 60 + 180 = 240$; mean $= 240/30 = 8$.'
          - problem: 'One group of $15$ students averages $8$ (out of $10$) and another group of $5$ students averages $4$. What is the combined mean?'
            answer: "7"
            solution_sketch: 'Total $= 15 \cdot 8 + 5 \cdot 4 = 120 + 20 = 140$; mean $= 140/20 = 7$.'
          - problem: 'Two tests score $5$ each and three tests score $10$ each (out of $10$). What is the mean of the five marks?'
            answer: "8"
            solution_sketch: '$(2 \cdot 5 + 3 \cdot 10)/5 = (10 + 30)/5 = 40/5 = 8$.'
          - problem: "A class has 5 students averaging 4, 5 students averaging 6, and 10 students averaging 5 (out of 10). Find the combined mean."
            answer: "5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: use the weighted mean formula to total the weighted marks: 5 times 4 plus 5 times 6 plus 10 times 5 equals 20 + 30 + 50 = 100. Step 2: use the count sum for the denominator: 5 + 5 + 10 = 20. Step 3: finish the weighted mean formula by dividing total marks by total count: 100/20 = 5. The combined mean is 5."
          - problem: "A quiz has 8 students averaging 1 (out of 10) and 12 students averaging 6. Find the combined mean."
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: apply the weighted mean formula: 8 times 1 plus 12 times 6 equals 8 + 72 = 80. Step 2: use the count sum for the denominator: 8 + 12 = 20. Step 3: finish the weighted mean formula by dividing: 80/20 = 4. The combined mean is 4."
        constraints: "2-3 groups; group sizes and means are integers; the combined mean is an integer; marks on the 0-10 scale"
      - id: kp2
        name: "Weighted mean with percent weights"
        key_prerequisites: [mean-of-a-data-set, percentages]
        exemplars:
          - problem: 'Homework counts $20\%$ and the exam counts $80\%$. With homework $10$ and exam $7.5$ (out of $10$), what is the course mark?'
            answer: "8"
            solution_sketch: '$0.2 \cdot 10 + 0.8 \cdot 7.5 = 2 + 6 = 8$.'
          - problem: 'Marks $7, 9, 4$ (out of $10$) carry weights $0.5, 0.3, 0.2$. Compute the weighted average.'
            answer: "7"
            solution_sketch: '$0.5 \cdot 7 + 0.3 \cdot 9 + 0.2 \cdot 4 = 3.5 + 2.7 + 0.8 = 7$.'
          - problem: 'Midterm and final each count $50\%$. With midterm $8$ and final $7$ (out of $10$), what is the course mark?'
            answer: "7.5"
            solution_sketch: '$0.5 \cdot 8 + 0.5 \cdot 7 = 4 + 3.5 = 7.5$.'
          - problem: 'Marks $6, 10, 8$ (out of $10$) carry weights $0.4, 0.4, 0.2$. Compute the weighted average.'
            answer: "8"
            solution_sketch: '$0.4 \cdot 6 + 0.4 \cdot 10 + 0.2 \cdot 8 = 2.4 + 4 + 1.6 = 8$.'
          - problem: "A project grade has three parts: planning counts 30%, build counts 50%, and report counts 20%. The marks out of 10 are planning 8, build 10, report 8. Find the weighted mean mark."
            answer: "9"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Use the weighted mean rule: 0.3 times 8 plus 0.5 times 10 plus 0.2 times 8. Multiply each mark by its weight: 2.4 + 5 + 1.6. Add the products: 9. The weighted mean mark is 9."
          - problem: "A course mark uses coursework 70% and final exam 30%. The coursework mark is 10 and the final exam mark is 5 (out of 10). Determine the weighted mean mark to 1 decimal."
            answer: "8.5"
            answer_contract: {"decimals": 1, "kind": "approx"}
            solution_sketch: "Use the weighted mean rule: 0.7 times 10 plus 0.3 times 5. Multiply each mark by its weight: 7 + 1.5. Add the products: 8.5. The weighted mean mark is 8.5."
        constraints: "2-3 weights summing to 1 (or 100%); weights in steps of 0.1; marks on the 0-10 scale; results integers or ending in .5"
      - id: kp3
        name: "Solving for an unknown score"
        key_prerequisites: [mean-of-a-data-set]
        exemplars:
          - problem: 'The final exam counts $40\%$ and the current average of $7$ (out of $10$) counts $60\%$. What final-exam mark gives an overall mark of $7.8$?'
            answer: "9"
            solution_sketch: '$0.6 \cdot 7 + 0.4x = 7.8$, so $0.4x = 7.8 - 4.2 = 3.6$ and $x = 9$.'
          - problem: 'Two quizzes weighted equally with a project that counts double: quiz marks are $6$ and $8$ (out of $10$). What project mark makes the weighted average (weights $1, 1, 2$) equal to $8$?'
            answer: "9"
            solution_sketch: '$(6 + 8 + 2p)/4 = 8$, so $14 + 2p = 32$ and $p = 9$.'
          - problem: 'Homework counts $50\%$ with average $6$ (out of $10$), and the exam counts the other $50\%$. What exam mark gives an overall mark of $8$?'
            answer: "10"
            solution_sketch: '$0.5 \cdot 6 + 0.5x = 8$, so $0.5x = 5$ and $x = 10$.'
          - problem: 'Three quizzes count equally and the project counts double (weights $1, 1, 2$). Quiz marks are $7, 9, 6$ (out of $10$). What project mark makes the weighted average $8$?'
            answer: "5"
            solution_sketch: '$(7 + 9 + 6 + 2p)/4 = 8$, so $22 + 2p = 32$ and $p = 5$.'
          - problem: "Coursework counts 40% of the final mark and the exam counts 60%. The coursework mark is 5 out of 10. What exam mark gives an overall mark of 6.8?"
            answer: "8"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Weighted-average rule: 0.4(5) + 0.6x = 6.8. Simplify: 2.0 + 0.6x = 6.8, so 0.6x = 4.8. Divide both sides by 0.6 to get x = 8."
          - problem: "A course mark combines a quiz worth 1, a project worth 2, and an exam worth 3. The quiz mark is 6 and the project mark is 9 out of 10. What exam mark gives an overall weighted average of 7?"
            answer: "6"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Weighted-average rule: (1(6) + 2(9) + 3x)/(1 + 2 + 3) = 7. Simplify the numerator and denominator: (6 + 18 + 3x)/6 = 7, so 24 + 3x = 42. Subtract 24 and divide by 3 to get x = 6."
        constraints: "one unknown; weights given as percents or small integer multiples; marks on the 0-10 scale; unknown comes out a whole number <= 10"
    diagnostic_exemplar:
      problem: 'A course mark is $20\%$ homework and $80\%$ exam. The homework average is $9$ (out of $10$). What exam mark gives an overall mark of $8.2$?'
      answer: '8'
      solution_sketch: '$0.2 \cdot 9 = 1.8$; $(8.2 - 1.8)/0.8 = 8$.'
    anki_seeds:
      - front: 'Weighted average formula (weights $w_i$ summing to 1)?'
        back: '$\sum w_i x_i$ — multiply each value by its weight and add.'
        type: basic
      - front: 'Combined mean of groups of sizes $m$ and $n$ with means $\bar{x}$ and $\bar{y}$?'
        back: '$\frac{m\bar{x} + n\bar{y}}{m + n}$ — total of all values over total count (NOT the average of the two means unless $m = n$).'
        type: basic

  - id: mean-from-frequency-table
    name: "The Mean from a Frequency Table"
    core: false                # data-display branch; terminal
    difficulty: 0.3
    drill: false
    answer_kind: numeric
    expected_time_secs: 120
    prerequisites:
      - id: mean-of-a-data-set
        weight: 0.7
        key: true
      - id: frequency-tables-histograms
        weight: 0.6
        key: true
      - id: summation-notation
        weight: 0.3
        key: false
    knowledge_points:
      - id: kp1
        name: "Totals from a frequency table"
        key_prerequisites: [frequency-tables-histograms, mean-of-a-data-set]
        exemplars:
          - problem: 'A frequency table lists values $1, 2, 3$ with frequencies $2, 3, 5$. What is the sum of all the data values?'
            answer: "23"
            solution_sketch: '$1 \cdot 2 + 2 \cdot 3 + 3 \cdot 5 = 2 + 6 + 15 = 23$.'
          - problem: 'Values $0, 1, 2$ occur with frequencies $4, 9, 7$. Give (number of data values, their sum) as an ordered pair.'
            answer: '$(20, 23)$'
            solution_sketch: 'Count $= 4 + 9 + 7 = 20$; sum $= 0 \cdot 4 + 1 \cdot 9 + 2 \cdot 7 = 23$.'
          - problem: 'A frequency table lists values $2, 5, 7$ with frequencies $4, 1, 5$. What is the sum of all the data values?'
            answer: "48"
            solution_sketch: '$2 \cdot 4 + 5 \cdot 1 + 7 \cdot 5 = 8 + 5 + 35 = 48$.'
          - problem: 'Values $1, 3, 6$ occur with frequencies $5, 2, 3$. How many data values are there in total?'
            answer: "10"
            solution_sketch: 'The total count is the sum of the frequencies: $5 + 2 + 3 = 10$.'
          - problem: 'Values $0, 4, 8$ occur with frequencies $6, 2, 2$. What is the sum of all the data values?'
            answer: "24"
            solution_sketch: '$0 \cdot 6 + 4 \cdot 2 + 8 \cdot 2 = 0 + 8 + 16 = 24$.'
          - problem: "A frequency table lists values 2, 4, 6, 8 with frequencies 3, 1, 4, 2. What is the sum of all the data values?"
            answer: "50"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1, weighted-sum rule: multiply each value by its frequency to get 2*3 = 6, 4*1 = 4, 6*4 = 24, and 8*2 = 16. Step 2, sum rule: add those products to get 6 + 4 + 24 + 16 = 50. The sum of all the data values is 50."
        constraints: "3-4 rows; values 0-9, frequencies 1-9"
      - id: kp2
        name: "Mean from a frequency table"
        key_prerequisites: [mean-of-a-data-set, frequency-tables-histograms]
        exemplars:
          - problem: 'Values $2, 4, 6$ occur with frequencies $3, 5, 2$. Find the mean.'
            answer: "3.8"
            solution_sketch: 'Sum $= 6 + 20 + 12 = 38$; count $= 10$; mean $= 38/10 = 3.8$.'
          - problem: 'Values $1, 2, 3, 4$ occur with frequencies $4, 3, 2, 1$. Find the mean.'
            answer: "2"
            solution_sketch: 'Sum $= 4 + 6 + 6 + 4 = 20$; count $= 10$; mean $= 20/10 = 2$.'
          - problem: 'Values $1, 3, 5$ occur with frequencies $2, 5, 3$. Find the mean.'
            answer: "3.2"
            solution_sketch: 'Sum $= 2 + 15 + 15 = 32$; count $= 10$; mean $= 32/10 = 3.2$.'
          - problem: 'Values $0, 2, 5$ occur with frequencies $4, 4, 2$. Find the mean.'
            answer: "1.8"
            solution_sketch: 'Sum $= 0 + 8 + 10 = 18$; count $= 10$; mean $= 18/10 = 1.8$.'
        constraints: "total frequency 10, 20, or 25 so the mean has at most one decimal place"
      - id: kp3
        name: "Missing frequency from a given mean"
        key_prerequisites: [mean-of-a-data-set, frequency-tables-histograms]
        exemplars:
          - problem: 'The value $5$ occurs $6$ times and the value $10$ occurs $f$ times. The mean is $7$. Find $f$.'
            answer: "4"
            solution_sketch: '$(30 + 10f)/(6 + f) = 7 \Rightarrow 30 + 10f = 42 + 7f \Rightarrow 3f = 12 \Rightarrow f = 4$.'
          - problem: 'The value $2$ occurs $9$ times and the value $8$ occurs $f$ times. The mean is $3.5$. Find $f$.'
            answer: "3"
            solution_sketch: '$(18 + 8f)/(9 + f) = 3.5 \Rightarrow 18 + 8f = 31.5 + 3.5f \Rightarrow 4.5f = 13.5 \Rightarrow f = 3$.'
          - problem: 'The value $3$ occurs $4$ times and the value $8$ occurs $f$ times. The mean is $6$. Find $f$.'
            answer: "6"
            solution_sketch: '$(12 + 8f)/(4 + f) = 6 \Rightarrow 12 + 8f = 24 + 6f \Rightarrow 2f = 12 \Rightarrow f = 6$.'
          - problem: 'The value $10$ occurs $2$ times and the value $4$ occurs $f$ times. The mean is $6$. Find $f$.'
            answer: "4"
            solution_sketch: '$(20 + 4f)/(2 + f) = 6 \Rightarrow 20 + 4f = 12 + 6f \Rightarrow 2f = 8 \Rightarrow f = 4$.'
        constraints: "two rows, one unknown frequency; choose numbers so the unknown frequency is a whole number"
    diagnostic_exemplar:
      problem: 'The value $3$ occurs $6$ times and the value $8$ occurs $f$ times. The mean is $5$. Find $f$.'
      answer: '4'
      solution_sketch: '$18 + 8f = 5(6 + f)$ gives $3f = 12$, so $f = 4$.'
    anki_seeds:
      - front: 'Mean from a frequency table $=$ ?'
        back: '$\frac{\sum f_i x_i}{\sum f_i}$ — each value times its frequency, over the total frequency.'
        type: basic
      - front: 'In a frequency table, the number of data values equals...'
        back: 'The sum of the frequencies.'
        type: basic

  - id: mean-median-mode
