      - id: kp1
        name: "All three measures for one data set"
        key_prerequisites: [mean-of-a-data-set, median-and-mode]
        exemplars:
          - problem: 'For the data $1, 3, 3, 7, 6$: give the ordered triple (mean, median, mode).'
            answer: '$(4, 3, 3)$'
            solution_sketch: 'Sum $= 20$, mean $= 20/5 = 4$. Sorted: $1, 3, 3, 6, 7$; median $= 3$; mode $= 3$. Triple: $(4, 3, 3)$.'
          - problem: 'For the data $5, 9, 2, 9, 5, 9$: give the ordered triple (mean, median, mode).'
            answer: '$(6.5, 7, 9)$'
            solution_sketch: 'Sum $= 39$, so mean $= 39/6 = 6.5$. Sorted: $2, 5, 5, 9, 9, 9$; median $= (5+9)/2 = 7$; the value $9$ appears most often. Triple: $(6.5, 7, 9)$.'
          - problem: 'For the data $1, 2, 2, 6, 9$: give the ordered triple (mean, median, mode).'
            answer: '$(4, 2, 2)$'
            solution_sketch: 'Sum $= 20$, mean $= 20/5 = 4$. Sorted: $1, 2, 2, 6, 9$; median $= 2$; mode $= 2$. Triple: $(4, 2, 2)$.'
          - problem: 'For the data $2, 3, 3, 6, 7, 9$: give the ordered triple (mean, median, mode).'
            answer: '$(5, 4.5, 3)$'
            solution_sketch: 'Sum $= 30$, mean $= 30/6 = 5$. Sorted: $2, 3, 3, 6, 7, 9$; median $= (3+6)/2 = 4.5$; mode $= 3$. Triple: $(5, 4.5, 3)$.'
          - problem: "The daily rainfall in millimeters for six days is 2, 3, 3, 7, 8, 10. Give the ordered triple (mean, median, mode) as (mean, median, mode)."
            answer: "(5.5, 5, 3)"
            answer_contract: {"arity": 3, "kind": "coordinates"}
            solution_sketch: "The data set is 2, 3, 3, 7, 8, 10. Mean rule: the sum is 33, and 33 divided by 6 gives 5.5. Median rule: the sorted list is 2, 3, 3, 7, 8, 10, so the middle pair is 3 and 7, and their average is 5. Mode rule: the value 3 appears twice and all other values appear once, so the mode is 3. The ordered triple (mean, median, mode) is (5.5, 5, 3)."
          - problem: "The quiz scores of six students are 3, 5, 5, 6, 8, 9. Give the ordered triple (mean, median, mode) as (mean, median, mode)."
            answer: "(6, 5.5, 5)"
            answer_contract: {"arity": 3, "kind": "coordinates"}
            solution_sketch: "The data set is 3, 5, 5, 6, 8, 9. Mean rule: the sum is 36, and 36 divided by 6 gives 6. Median rule: the sorted list is 3, 5, 5, 6, 8, 9, so the middle pair is 5 and 6, and their average is 5.5. Mode rule: the value 5 appears twice and all other values appear once, so the mode is 5. The ordered triple (mean, median, mode) is (6, 5.5, 5)."
        constraints: "5-7 values with exactly one mode; mean an integer or ending in .5; answer is the ordered triple (mean, median, mode)"
      - id: kp2
        name: "Comparing mean and median"
        key_prerequisites: [mean-of-a-data-set, median-and-mode]
        exemplars:
          - problem: "For the data 20, 22, 23, 25, 90, find the mean minus the median. Give the answer as an integer."
            answer: "13"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The data set is 20, 22, 23, 25, 90. First compute the mean: (20+22+23+25+90)/5 = 36. The median is the middle value 23. The mean minus the median is 36 - 23 = 13."
          - problem: "Salaries in a shop are 30, 32, 35, 38, 200 thousand. Find the mean minus the median in thousands. Give the answer as an integer."
            answer: "32"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The data set in thousands is 30, 32, 35, 38, 200. The mean is (30+32+35+38+200)/5 = 335/5 = 67. The median is the middle value 35. The difference is 67 - 35 = 32."
          - problem: "For the data 2, 4, 5, 6, 40, find the median minus the mean. Give the answer as a fraction."
            answer: "-32/5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The data set is 2, 4, 5, 6, 40. The median is the middle value 5. The mean is (2+4+5+6+40)/5 = 57/5. The median minus the mean is 5 - 57/5 = 25/5 - 57/5 = -32/5."
          - problem: "For the data 8, 9, 10, 11, 12, find the mean minus the median. Give the answer as an integer."
            answer: "0"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The data set is 8, 9, 10, 11, 12. The mean is (8+9+10+11+12)/5 = 50/5 = 10. The median is the middle value 10. The mean minus the median is 10 - 10 = 0."
          - problem: "For the data 5, 7, 8, 9, 10, 100, find the mean minus the median. Give the answer as a fraction."
            answer: "44/3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The data set is 5, 7, 8, 9, 10, 100. The mean is (5+7+8+9+10+100)/6 = 139/6. The median is the average of the two middle values: (8+9)/2 = 17/2. The mean minus the median is 139/6 - 17/2 = 139/6 - 51/6 = 88/6 = 44/3."
          - problem: "The data 10, 12, 13, 14, 90 contains one extreme value. Which measure of center is largest?"
            answer: "the mean"
            answer_contract: {"kind": "label", "options": [["the mean"], ["the median"], ["the mode"], ["they are equal"]]}
            solution_sketch: "The data set is 10, 12, 13, 14, 90. The mean is (10+12+13+14+90)/5 = 139/5 = 27.8. The median is the middle value 13. The extreme value 90 pulls the mean upward, so the mean is largest. Choosing the median ignores the pull of the outlier. Choosing the mode mistakes the mode for a measure of center. Choosing they are equal assumes a symmetry that the data does not have. The answer is the mean."
        constraints: "one extreme value in a set of 5-6 (or a symmetric set for the equal case); the direction of the pull must be computable by inspection; comparison answers use the label contract (the mean / the median / they are equal)"
      - id: kp3
        name: "Updating the mean"
        key_prerequisites: [mean-of-a-data-set, weighted-averages]
        exemplars:
          - problem: 'The data $4, 6, 8, 10$ has mean $7$. A fifth value $12$ is added. What is the new mean?'
            answer: "8"
            solution_sketch: 'New sum $= 28 + 12 = 40$; new mean $= 40/5 = 8$.'
          - problem: 'After $4$ quizzes a student averages $6.5$ (out of $10$). She scores $9$ on the fifth quiz. What is her new average?'
            answer: "7"
            solution_sketch: 'Total $= 4 \cdot 6.5 + 9 = 35$; new mean $= 35/5 = 7$.'
          - problem: 'The mean of $4$ values is $9$. A fifth value $14$ is added. What is the new mean?'
            answer: "10"
            solution_sketch: 'Total $= 4 \cdot 9 = 36$; new sum $= 36 + 14 = 50$; new mean $= 50/5 = 10$.'
          - problem: 'The data $10, 20, 30, 40$ has mean $25$. The value $10$ is removed. What is the new mean?'
            answer: "30"
            solution_sketch: 'Total $= 4 \cdot 25 = 100$; new sum $= 100 - 10 = 90$; new mean $= 90/3 = 30$.'
          - problem: "A basketball player scores a mean of 14 points over 5 games. She scores 20 points in the sixth game. What is her new mean score?"
            answer: "15"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The stated mean is 14 over 5 games, so the total points are 5*14 = 70. Step 1: use total = mean * count. Step 2: add the new score, 70 + 20 = 90. Step 3: divide by the new count, 90/6 = 15. The new mean score is 15."
          - problem: "The mean of 6 values is 12. One value 2 is removed. What is the new mean?"
            answer: "14"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The stated mean is 12 over 6 values, so the total is 6*12 = 72. Step 1: use total = mean * count. Step 2: remove the value 2, so the new total is 72 - 2 = 70. Step 3: divide by the new count 5, so 70/5 = 14. The new mean is 14."
        constraints: "start from a stated mean over 3-6 values; one value added or removed; new mean is an integer"
    diagnostic_exemplar:
      problem: 'For the data $4, 8, 3, 8, 7$: find the mean, the median, and the mode. A sixth value $12$ is then added — find the new mean.'
      answer: 'Mean $6$, median $7$, mode $8$; new mean $7$.'
      answer_contract: {kind: none}
      solution_sketch: 'Sum $30/5 = 6$; sorted $3, 4, 7, 8, 8$ gives median $7$ and mode $8$; new total $42/6 = 7$.'
    anki_seeds:
      - front: 'Which measure of center resists outliers: mean or median?'
        back: 'The median.'
        type: basic

  - id: outliers-effect-on-center
    name: "Outliers and Their Effect on Center"
    core: false                # descriptive-summary branch; terminal
    difficulty: 0.35
    drill: false
    answer_kind: numeric
    expected_time_secs: 150
    prerequisites:
      - id: mean-median-mode
        weight: 0.8
        key: true
    knowledge_points:
      - id: kp1
        name: "Direction of an outlier's pull"
        key_prerequisites: [mean-median-mode]
        exemplars:
          - problem: 'The mean of $4, 6, 8$ is $6$. The value $30$ is added. By how much does the mean increase?'
            answer: "4"
            solution_sketch: 'New mean $= (18 + 30)/4 = 12$, an increase of $12 - 6 = 4$.'
          - problem: 'The median of $1, 3, 5, 7$ is $4$. The value $3$ is added. What is the new median?'
            answer: "3"
            solution_sketch: 'Sorted: $1, 3, 3, 5, 7$; the middle value is $3$. The median barely moves.'
          - problem: "A data set of clustered values gains one very large outlier. Which measure of center is pulled most strongly toward that outlier?"
            answer: "mean"
            answer_contract: {"kind": "label", "options": [["mean"], ["median"], ["mode"], ["neither"]]}
            solution_sketch: "Rule (sum dependence): every value enters the sum, so a far value moves the average strongly, while the middle position shifts at most to a neighboring value. Step 1: the outlier lies far from the cluster, so it drags the average toward itself. Step 2: the middle value changes by at most one data position, so it barely moves. Wrong option median: the error of thinking the middle position tracks every value. Wrong option mode: the error of confusing the most frequent value with the center. Wrong option neither: the error of assuming no measure reacts to a far value. The answer is mean."
          - problem: "The data 2, 4, 6, 8 gains the value 50. Does the mean rise or fall? Select the correct option."
            answer: "increase"
            answer_contract: {"kind": "label", "options": [["increase"], ["decrease"], ["unchanged"], ["cannot tell"]]}
            solution_sketch: "Comparison rule: a new value above the old mean pulls the mean up. Step 1: the old mean of 2, 4, 6, 8 is 20/4 = 5. Step 2: the new value 50 lies far above 5, so the new mean is 54/5 = 10.8, well above the old mean. Wrong option decrease: the error of treating a high outlier like a low one. Wrong option unchanged: the error of forgetting that the new value enters the sum. Wrong option cannot tell: the error of not comparing the new value with the old mean. The answer is increase."
          - problem: "The data 10, 11, 12, 13 gains the value 2. Find the new mean as a fraction."
            answer: "48/5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Sum rule: the old sum is 10 + 11 + 12 + 13 = 46. Mean formula: with the outlier 2 added, the new sum is 48 over five values, so the new mean is 48/5. Direction check: 48/5 = 9.6 is below the old mean 11.5, so the low outlier pulls the mean down. The answer is 48/5."
          - problem: "A data set of five values has mean 12. The outlier 60 is added. By how many units does the mean change? Give the change as a positive number if the mean moves up."
            answer: "8"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Sum rule: the old sum is 5 times 12 = 60. Mean formula: with the outlier 60 added, the new mean is (60 + 60)/6 = 20. Change rule: 20 - 12 = 8, so the high outlier pulls the mean up by 8 units. The answer is 8."
        constraints: "one outlier added to 4-6 clustered values; ask for direction, not exact size, unless values are given"
      - id: kp2
        name: "Mean and median with and without the outlier"
        key_prerequisites: [mean-median-mode]
        exemplars:
          - problem: 'For the data $4, 5, 6, 7, 48$, compute the mean with the outlier included.'
            answer: "14"
            solution_sketch: '$(4+5+6+7+48)/5 = 70/5 = 14$.'
          - problem: 'From the same data $4, 5, 6, 7, 48$, compute the mean after removing the outlier $48$.'
            answer: "5.5"
            solution_sketch: '$(4+5+6+7)/4 = 22/4 = 5.5$. Removing $48$ drops the mean from $14$ to $5.5$.'
          - problem: 'For the sorted data $10, 12, 14, 16, 60$, find the median with the outlier included.'
            answer: "14"
            solution_sketch: 'The middle of five sorted values is the third: $14$.'
          - problem: 'From the same data $10, 12, 14, 16, 60$, find the median after removing the outlier $60$.'
            answer: "13"
            solution_sketch: 'Median $= (12+14)/2 = 13$. The median moves only slightly when an outlier is removed.'
          - problem: "For the data $2, 4, 6, 8, 40$, find how much the mean decreases when the outlier $40$ is removed."
            answer: "7"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Write the full data set: 2, 4, 6, 8, 40. The mean rule is sum divided by count: with the outlier, (2+4+6+8+40)/5 = 60/5 = 12. Remove the outlier 40 and apply the mean rule again: (2+4+6+8)/4 = 20/4 = 5. The decrease is 12 - 5 = 7."
          - problem: "For the data $3, 5, 9, 11, 47$, find how much the median decreases when the outlier $47$ is removed."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Write the sorted data set: 3, 5, 9, 11, 47. The median rule is the middle value of sorted data, so with the outlier the median is 9. Remove the outlier 47, leaving 3, 5, 9, 11; the median rule gives (5+9)/2 = 7. The decrease is 9 - 7 = 2."
        constraints: "4-6 clustered values plus one outlier; both means come out as integers or .5 values"
      - id: kp3
        name: "Recomputing a mean after removing a value"
        key_prerequisites: [mean-median-mode]
        exemplars:
          - problem: 'The mean of $6$ values is $10$. The value $40$ is removed. What is the new mean?'
            answer: "4"
            solution_sketch: 'Sum $= 60$; new sum $= 60 - 40 = 20$; new mean $= 20/5 = 4$.'
          - problem: 'The mean of $5$ values is $20$. The value $60$ is removed. What is the new mean?'
            answer: "10"
            solution_sketch: 'Sum $= 100$; new sum $= 40$; new mean $= 40/4 = 10$.'
          - problem: 'The mean of $4$ values is $15$. The value $36$ is removed. What is the new mean?'
            answer: "8"
            solution_sketch: 'Sum $= 60$; new sum $= 60 - 36 = 24$; new mean $= 24/3 = 8$.'
          - problem: 'The mean of $10$ values is $7$. The value $25$ is removed. What is the new mean?'
            answer: "5"
            solution_sketch: 'Sum $= 70$; new sum $= 70 - 25 = 45$; new mean $= 45/9 = 5$.'
        constraints: "work from the stated mean and count, not a full list; new mean is a whole number"
    diagnostic_exemplar:
      problem: 'The mean of $6$ marks is $9$. The outlier $24$ is removed. Find the new mean of the remaining marks, and state whether the outlier had inflated or deflated the original mean.'
      answer: 'New mean $6$; the outlier had inflated the mean.'
      answer_contract: {kind: none}
      solution_sketch: 'Total $6 \cdot 9 = 54$; $(54 - 24)/5 = 6 < 9$, so $24$ was pulling the mean up.'
    anki_seeds:
      - front: 'Adding one extreme high value to a data set does what to the mean and median?'
        back: 'Pulls the mean up substantially; the median moves little or not at all.'
        type: basic
      - front: 'The mean is {{c1::sensitive}} to outliers; the median is {{c2::resistant}}.'
        back: 'sensitive; resistant'
        type: cloze

  - id: percentiles
    name: "Percentiles"
    # core despite zero descendants: `normal-distribution` (core) computes percentiles in
    # kp2 "Combining regions and percentiles" without an edge declaring it. Undrawn
    # dependence, so the descendant count understates the leverage (W8 review, AC-12).
    core: true
    difficulty: 0.35
    drill: false
    answer_kind: numeric
    expected_time_secs: 120
    prerequisites:
      - id: median-and-mode
        weight: 0.6
        key: true
      - id: percentages
        weight: 0.5
        key: false
    knowledge_points:
      - id: kp1
        name: "Percentile rank of a value"
        key_prerequisites: [median-and-mode, percentages]
        exemplars:
          - problem: 'In a group of $20$ scores, $13$ are below Ana''s score. What is her percentile rank, as a number?'
            answer: "65"
            solution_sketch: '$13/20 = 65\%$ of the scores lie below hers.'
          - problem: 'On a standardized test taken by $400$ students, $340$ scored below Leo. What is his percentile rank, as a number?'
            answer: "85"
            solution_sketch: '$340/400 = 85\%$ of the scores lie below his.'
          - problem: 'In a class of $20$ students, $15$ scored below Priya. What is her percentile rank, as a number?'
            answer: "75"
            solution_sketch: '$15/20 = 75\%$ of the scores lie below hers, so she is at the 75th percentile.'
          - problem: 'Out of $50$ runners, $40$ finished behind Sam. What is Sam''s percentile rank, as a number?'
            answer: "80"
            solution_sketch: '$40/50 = 80\%$, so Sam is at the 80th percentile.'
          - problem: 'A score is at the 70th percentile among $40$ scores. About how many scores does it exceed?'
            answer: "28"
            solution_sketch: '$70\%$ of $40$ is $0.7 \cdot 40 = 28$.'
          - problem: 'In a group of $25$, Maya''s mark is at the 60th percentile. How many marks are below hers?'
            answer: "15"
            solution_sketch: '$60\%$ of $25$ is $0.6 \cdot 25 = 15$.'
        constraints: "totals of 20, 25, 40, or 50; number below is a clean percent of the total"
      - id: kp2
        name: "Interpreting a percentile"
        key_prerequisites: [percentages]
        exemplars:
          - problem: 'A test mark is at the 90th percentile. Does that mean (a) the student answered $90\%$ of the questions correctly, or (b) the mark is higher than $90\%$ of all marks?'
            answer: '(b)'
            answer_contract: {kind: label, options: [[(a)], [(b)]]}
            solution_sketch: 'A percentile ranks the mark against other marks; it says nothing about percent correct.'
          - problem: 'A baby''s weight is at the 30th percentile. What fraction of babies weigh less? Give a fraction in lowest terms.'
            answer: "3/10"
            solution_sketch: '$30\%$ of babies weigh less, i.e. $\frac{3}{10}$.'
          - problem: 'A value is at the 40th percentile. What fraction of the values lie below it? Give a fraction in lowest terms.'
            answer: "2/5"
            solution_sketch: '$40\% = \frac{40}{100} = \frac{2}{5}$ of the values lie below it.'
          - problem: 'A puppy''s weight is at the 80th percentile. What fraction of puppies weigh less? Give a fraction in lowest terms.'
            answer: "4/5"
            solution_sketch: '$80\% = \frac{80}{100} = \frac{4}{5}$ of the puppies weigh less.'
          - problem: 'A mark is at the 25th percentile. Does that mean (a) the student got $25\%$ of the questions right, or (b) the mark is higher than $25\%$ of all marks?'
            answer: '(b)'
            answer_contract: {kind: label, options: [[(a)], [(b)]]}
            solution_sketch: 'A percentile compares the mark to other marks, not to the total possible points.'
        constraints: "interpretation only; contrast percentile with percent-correct explicitly; answers are an option label or an exact fraction"
      - id: kp3
        name: "Quartiles as percentiles"
        key_prerequisites: [median-and-mode]
        exemplars:
          - problem: 'The median is which percentile?'
            answer: '50th'
            answer_contract: {kind: label, options: [[25th], [50th], [75th], [100th]]}
            solution_sketch: 'The median has $50\%$ of the values below it.'
          - problem: 'Give the percentile numbers of $Q_1$ and $Q_3$ as the ordered pair $(Q_1, Q_3)$.'
            answer: '$(25, 75)$'
          - problem: 'A value at the 75th percentile of $80$ data values exceeds about how many of them?'
            answer: "60"
            solution_sketch: '$0.75 \cdot 80 = 60$.'
          - problem: 'A value at the 25th percentile of $40$ data values exceeds about how many of them?'
            answer: "10"
            solution_sketch: '$0.25 \cdot 40 = 10$.'
          - problem: 'A value at the 75th percentile of $60$ data values exceeds about how many of them?'
            answer: "45"
            solution_sketch: '$0.75 \cdot 60 = 45$.'
          - problem: '$Q_1$ of a data set of $80$ values exceeds about how many of them?'
            answer: "20"
            solution_sketch: '$Q_1$ is the 25th percentile: $0.25 \cdot 80 = 20$.'
        constraints: "counts divisible by 4; stick to the 25/50/75 anchors"
    diagnostic_exemplar:
      problem: 'In a class of $40$ students, Maya\''s mark sits exactly at the third quartile $Q_3$. How many of the $40$ students scored below her?'
      answer: '30'
      solution_sketch: '$Q_3$ is the 75th percentile, so $75\%$ of the marks lie below hers: $0.75 \cdot 40 = 30$.'
    anki_seeds:
      - front: 'A value at the $p$th percentile...'
        back: 'Exceeds about $p\%$ of the data values (it is NOT a score of $p\%$).'
        type: basic
      - front: 'Median, $Q_1$, $Q_3$ as percentiles?'
        back: '50th, 25th, and 75th percentiles.'
        type: basic

  - id: range-iqr-boxplots
    name: "Range, IQR, and Boxplots"
    core: false                # descriptive-summary branch; terminal
    difficulty: 0.3
    drill: false
    answer_kind: numeric
    expected_time_secs: 150
    prerequisites:
      - id: mean-median-mode
        weight: 0.7
        key: true
    knowledge_points:
      - id: kp1
        name: "Range"
        key_prerequisites: [mean-median-mode]
        exemplars:
          - problem: 'Find the range of $3, 8, 12, 5$.'
            answer: "9"
            solution_sketch: 'Range $=$ max $-$ min $= 12 - 3 = 9$.'
          - problem: 'Find the range of $15, 9, 21, 14, 11$.'
            answer: "12"
            solution_sketch: 'Range $=$ max $-$ min $= 21 - 9 = 12$.'
          - problem: 'Find the range of $7, 2, 9, 4, 6$.'
            answer: "7"
            solution_sketch: 'Range $= 9 - 2 = 7$.'
          - problem: 'A data set has minimum $12$ and maximum $30$. Find its range.'
            answer: "18"
            solution_sketch: 'Range $= 30 - 12 = 18$.'
          - problem: "A data set has range 18 and minimum 12. Find its maximum."
            answer: "30"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The range rule says range equals maximum minus minimum. Substitute the known values into this rule: 18 = maximum - 12. Add 12 to both sides to get maximum = 30."
          - problem: "A data set has range 24 and maximum 40. Find its minimum."
            answer: "16"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The range rule says range equals maximum minus minimum. Substitute the known values into this rule: 24 = 40 - minimum. Solve for the minimum by subtracting 40 and changing signs, so minimum = 16."
        constraints: "4-6 small positive integers, unsorted"
      - id: kp2
        name: "Quartiles and IQR"
        key_prerequisites: [mean-median-mode]
        exemplars:
          - problem: 'For the sorted data $2, 4, 5, 7, 9, 10, 12$, give $(Q_1, Q_3, \text{IQR})$ as an ordered triple (exclude the median from each half).'
            answer: '$(4, 10, 6)$'
            solution_sketch: 'Median $= 7$. Lower half $2, 4, 5$ gives $Q_1 = 4$; upper half $9, 10, 12$ gives $Q_3 = 10$; IQR $= 10 - 4 = 6$.'
          - problem: 'For the sorted data $1, 3, 5, 7, 9, 11, 13, 15$, find the IQR.'
            answer: "8"
            solution_sketch: 'Lower half $1, 3, 5, 7$: $Q_1 = 4$. Upper half $9, 11, 13, 15$: $Q_3 = 12$. IQR $= 8$.'
          - problem: 'For the sorted data $3, 6, 8, 10, 12, 15, 18$ (exclude the median from each half), find $Q_1$ as a single number.'
            answer: "6"
            solution_sketch: 'Median $= 10$; the lower half $3, 6, 8$ has middle value $6$.'
          - problem: 'For the sorted data $1, 2, 4, 6, 8, 9, 11$ (exclude the median from each half), find $Q_3$ as a single number.'
            answer: "9"
            solution_sketch: 'Median $= 6$; the upper half $8, 9, 11$ has middle value $9$.'
          - problem: 'For the sorted data $2, 3, 5, 8, 10, 13, 14$ (exclude the median from each half), find the IQR.'
            answer: "10"
            solution_sketch: 'Lower half $2, 3, 5$ gives $Q_1 = 3$; upper half $10, 13, 14$ gives $Q_3 = 13$; IQR $= 13 - 3 = 10$.'
          - problem: "For the sorted data 3, 6, 7, 9, 12, 15, 18, 21 (exclude the median from each half), find Q1 as a fraction."
            answer: "13/2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The data has 8 values, so the median is the average of the 4th and 5th values: (9 + 12)/2 = 10.5. Excluding that median, the lower half is 3, 6, 7, 9. The middle of the lower half is the average of 6 and 7, which is 13/2. The answer is 13/2."
        constraints: "7-9 sorted values; use the median-exclusion convention for quartiles; quartiles land on values or clean halves"
      - id: kp3
        name: "Five-number summary and the 1.5-IQR outlier fence"
        key_prerequisites: [mean-median-mode]
        exemplars:
          - problem: 'A boxplot has $Q_1 = 10$ and $Q_3 = 18$. Compute the upper outlier fence $Q_3 + 1.5 \cdot \text{IQR}$.'
            answer: "30"
            solution_sketch: 'IQR $= 8$; fence $= 18 + 1.5 \cdot 8 = 18 + 12 = 30$.'
          - problem: 'With $Q_1 = 10$, $Q_3 = 18$, is the data value $32$ an outlier by the $1.5 \cdot \text{IQR}$ rule: (a) yes; (b) no?'
            answer: '(a)'
            solution_sketch: 'The upper fence is $18 + 1.5 \cdot 8 = 30$, and $32 > 30$.'
          - problem: 'For the sorted data $3, 5, 8, 9, 12, 15, 20$, give the five-number summary as the ordered quintuple (minimum, $Q_1$, median, $Q_3$, maximum), excluding the median from each half.'
            answer: '$(3, 5, 9, 15, 20)$'
            solution_sketch: 'Median $= 9$; lower half $3, 5, 8$ gives $Q_1 = 5$; upper half $12, 15, 20$ gives $Q_3 = 15$.'
          - problem: 'A boxplot has $Q_1 = 12$ and $Q_3 = 20$. Compute the lower outlier fence $Q_1 - 1.5 \cdot \text{IQR}$.'
            answer: "0"
            solution_sketch: 'IQR $= 8$; fence $= 12 - 1.5 \cdot 8 = 12 - 12 = 0$.'
          - problem: 'A boxplot has $Q_1 = 20$ and $Q_3 = 30$. Compute the upper outlier fence.'
            answer: "45"
            solution_sketch: 'IQR $= 10$; fence $= 30 + 1.5 \cdot 10 = 30 + 15 = 45$.'
          - problem: "For the sorted data -12, 3, 5, 7, 9, 11, 13, 15, 40 (exclude the median from each half when finding the quartiles), determine how many of the values are outliers by the 1.5*IQR rule."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1, median rule: the 5th of the 9 sorted values gives median 9; excluding it, the halves are -12, 3, 5, 7 and 11, 13, 15, 40. Step 2, quartile rule: Q1 = (3+5)/2 = 4 and Q3 = (13+15)/2 = 14, so IQR = 14 - 4 = 10. Step 3, fence rule: 1.5*IQR = 15, so the lower fence is 4 - 15 = -11 and the upper fence is 14 + 15 = 29. Step 4, outlier rule: -12 < -11 and 40 > 29, while all other values lie between the fences, so exactly 2 values are outliers. The number of outliers is 2."
        constraints: "IQR a small even integer so 1.5*IQR is an integer; fences and candidate outliers are integers; five-number summaries given as an ordered quintuple"
    diagnostic_exemplar:
      problem: 'For the sorted data $2, 4, 6, 10, 12, 14, 18$ (exclude the median from each half), compute the upper outlier fence $Q_3 + 1.5 \cdot \text{IQR}$.'
      answer: '29'
      solution_sketch: '$Q_1 = 4$, $Q_3 = 14$, IQR $= 10$; fence $= 14 + 15 = 29$.'
    anki_seeds:
      - front: 'IQR $=$ ?'
        back: '$Q_3 - Q_1$, the spread of the middle 50% of the data.'
        type: basic
      - front: 'The 1.5-IQR outlier fences are...'
        back: '$Q_1 - 1.5 \cdot \text{IQR}$ and $Q_3 + 1.5 \cdot \text{IQR}$; values outside them are flagged as outliers.'
        type: basic

  - id: deviations-and-variance
    name: "Deviations and Variance"
    core: true
    difficulty: 0.35
    drill: false
    answer_kind: numeric
    expected_time_secs: 150
    prerequisites:
      - id: mean-of-a-data-set
        weight: 0.7
        key: true
      - id: summation-notation
        weight: 0.5
        key: true
      - id: integer-multiplication-division
        weight: 0.3
        key: false
    knowledge_points:
      - id: kp1
        name: "Deviations from the mean"
        key_prerequisites: [mean-of-a-data-set]
        exemplars:
          - problem: 'The data $2, 4, 9$ has mean $5$. List the deviations $x_i - \bar{x}$.'
            answer: '$-3, -1, 4$'
            solution_sketch: '$2-5 = -3$, $4-5 = -1$, $9-5 = 4$.'
          - problem: 'What do the deviations from the mean always sum to?'
            answer: "0"
            solution_sketch: '$\sum (x_i - \bar{x}) = \sum x_i - n\bar{x} = 0$ by the definition of the mean.'
          - problem: 'The data $3, 7, 8$ has mean $6$. What is the deviation of the value $8$?'
            answer: "2"
            solution_sketch: 'Deviation $= x - \bar{x} = 8 - 6 = 2$.'
          - problem: 'A data set has mean $10$. What is the deviation of the value $7$?'
            answer: "-3"
            solution_sketch: 'Deviation $= 7 - 10 = -3$.'
          - problem: 'The data $1, 5, 9$ has mean $5$. How many of the deviations are negative?'
            answer: "2"
            solution_sketch: 'Deviations are $-4, 0, 4$; two of them are negative.'
          - problem: "The data is 3, 5, 8, 12. Give the deviations from the mean, x_i - xbar, in the order of the data."
            answer: "-4, -2, 1, 5"
            answer_contract: {"kind": "list", "member": {"kind": "exact"}, "ordered": true}
            solution_sketch: "First find the mean of 3, 5, 8, 12 by the mean formula: (3+5+8+12)/4 = 28/4 = 7. Then apply the definition of a deviation and subtract the mean from each value: 3-7 = -4, 5-7 = -2, 8-7 = 1, 12-7 = 5. The deviations are -4, -2, 1, 5."
        constraints: "3-5 values with an integer mean; deviations are single-digit integers"
      - id: kp2
        name: "Squared deviations"
        key_prerequisites: [mean-of-a-data-set, summation-notation]
        exemplars:
          - problem: 'The data $2, 4, 9$ has mean $5$. Compute the sum of squared deviations $\sum (x_i - \bar{x})^2$.'
            answer: "26"
            solution_sketch: '$(-3)^2 + (-1)^2 + 4^2 = 9 + 1 + 16 = 26$.'
          - problem: 'The data $1, 3, 5, 7$ has mean $4$. Compute $\sum (x_i - \bar{x})^2$.'
            answer: "20"
            solution_sketch: '$9 + 1 + 1 + 9 = 20$.'
          - problem: 'The data $3, 3, 6, 12$ has mean $6$. Compute the sum of squared deviations $\sum (x_i - \bar{x})^2$.'
            answer: "54"
            solution_sketch: 'Deviations $-3, -3, 0, 6$; squares $9 + 9 + 0 + 36 = 54$.'
          - problem: 'The data $2, 2, 2, 10$ has mean $4$. Compute $\sum (x_i - \bar{x})^2$.'
            answer: "48"
            solution_sketch: 'Deviations $-2, -2, -2, 6$; squares $4 + 4 + 4 + 36 = 48$.'
          - problem: "The data 0, 4, 8 has mean 4. Compute the sum of squared deviations."
            answer: "32"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full data set is 0, 4, 8 with mean 4. Step 1: the deviation rule subtracts the mean, giving -4, 0, 4. Step 2: the squaring rule gives 16, 0, 16. Step 3: the sum rule gives 16 + 0 + 16 = 32. The sum of squared deviations is 32."
          - problem: "The data 1, 9, 4, x has mean 5. Compute the sum of squared deviations."
            answer: "34"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full data set is 1, 9, 4, x with mean 5. Step 1: the mean formula gives (1 + 9 + 4 + x)/4 = 5, so x = 6. Step 2: the deviation rule subtracts the mean, giving -4, 4, -1, 1. Step 3: the squaring rule gives 16, 16, 1, 1. Step 4: the sum rule gives 16 + 16 + 1 + 1 = 34. The sum of squared deviations is 34."
        constraints: "3-5 values, integer mean; squared deviations sum below 100"
      - id: kp3
        name: "Population variance"
        key_prerequisites: [mean-of-a-data-set, summation-notation]
        exemplars:
          - problem: 'Find the population variance $\sigma^2$ of $1, 2, 3, 4, 5$.'
            answer: "2"
            solution_sketch: 'Mean $= 3$; squared deviations $4, 1, 0, 1, 4$ sum to $10$; $\sigma^2 = 10/5 = 2$.'
          - problem: 'Find the population variance $\sigma^2$ of $2, 4, 6, 8$.'
            answer: "5"
            solution_sketch: 'Mean $= 5$; squared deviations $9, 1, 1, 9$ sum to $20$; $\sigma^2 = 20/4 = 5$.'
          - problem: 'Find the population variance $\sigma^2$ of $4, 4, 4, 12$.'
            answer: "12"
            solution_sketch: 'Mean $= 6$; squared deviations $4, 4, 4, 36$ sum to $48$; $\sigma^2 = 48/4 = 12$.'
          - problem: 'Find the population variance $\sigma^2$ of $0, 4, 6, 10$.'
            answer: "13"
            solution_sketch: 'Mean $= 5$; squared deviations $25, 1, 1, 25$ sum to $52$; $\sigma^2 = 52/4 = 13$.'
        constraints: "4-5 values with an integer mean; squared deviations sum to a multiple of n"
    diagnostic_exemplar:
      problem: 'Find the population variance $\sigma^2$ of $1, 3, 5, 7$.'
      answer: "5"
      solution_sketch: 'Mean $= 4$; squared deviations $9, 1, 1, 9$ sum to $20$; $\sigma^2 = 20/4 = 5$.'
    anki_seeds:
      - front: 'The deviations $x_i - \bar{x}$ always sum to...'
        back: '$0$ — that is why we square them before averaging.'
        type: basic
      - front: 'Population variance formula?'
        back: '$\sigma^2 = \frac{1}{n} \sum (x_i - \mu)^2$ — the mean squared deviation from the mean.'
        type: basic

  - id: variance-standard-deviation
    name: "Variance and Standard Deviation"
    core: true
    difficulty: 0.4
    drill: false
    answer_kind: numeric
    expected_time_secs: 180
    prerequisites:
      - id: deviations-and-variance
        weight: 0.8
        key: true
      - id: square-roots
        weight: 0.5
        key: true
      - id: simplifying-radicals
        weight: 0.3
        key: false
    knowledge_points:
      - id: kp1
        name: "Population standard deviation"
        key_prerequisites: [deviations-and-variance, square-roots]
        exemplars:
          - problem: 'Find the population standard deviation $\sigma$ of $5, 5, 9, 9$.'
            answer: "2"
            solution_sketch: 'Mean $= 7$; each deviation is $\pm 2$, so $\sigma^2 = 16/4 = 4$ and $\sigma = 2$.'
          - problem: 'Find the population standard deviation $\sigma$ of $1, 3, 5, 7, 9$.'
            answer: "2*sqrt(2)"
            solution_sketch: 'Mean $= 5$; squared deviations $16, 4, 0, 4, 16$ sum to $40$; $\sigma^2 = 8$, so $\sigma = \sqrt{8} = 2\sqrt{2}$.'
          - problem: 'Find the population standard deviation $\sigma$ of $10, 10, 14, 14$.'
            answer: "2"
            solution_sketch: 'Mean $= 12$; each deviation is $\pm 2$, so $\sigma^2 = 16/4 = 4$ and $\sigma = 2$.'
          - problem: 'Find the population standard deviation $\sigma$ of $2, 4, 6, 8$.'
            answer: "sqrt(5)"
            solution_sketch: 'Mean $= 5$; squared deviations $9, 1, 1, 9$ sum to $20$; $\sigma^2 = 20/4 = 5$, so $\sigma = \sqrt{5}$.'
        constraints: "variance a perfect square or of the form k^2 * m with small m; answer exact, radicals written as sqrt(...)"
      - id: kp2
        name: "Sample variance and standard deviation (divide by n-1)"
        key_prerequisites: [deviations-and-variance, square-roots]
        exemplars:
          - problem: 'Find the sample variance $s^2$ of $6, 8, 10, 12, 14$.'
            answer: "10"
            solution_sketch: 'Mean $= 10$; squared deviations $16, 4, 0, 4, 16$ sum to $40$; $s^2 = 40/(5-1) = 10$.'
          - problem: 'A sample of $4$ values has squared deviations summing to $27$. Find $s^2$.'
            answer: "9"
            solution_sketch: '$s^2 = 27/(4-1) = 9$.'
          - problem: 'Find the sample standard deviation $s$ of $6, 8, 10, 12, 14$.'
            answer: "sqrt(10)"
            solution_sketch: '$s^2 = 40/4 = 10$, so $s = \sqrt{10}$.'
          - problem: 'Find the sample standard deviation $s$ of $1, 3, 5, 7, 9$.'
            answer: "sqrt(10)"
            solution_sketch: 'Mean $= 5$; squared deviations $16, 4, 0, 4, 16$ sum to $40$; $s^2 = 40/(5-1) = 10$, so $s = \sqrt{10}$.'
          - problem: "Find the sample variance $s^2$ of $2, 4, 5, 6, 8$."
            answer: "5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full data set is 2, 4, 5, 6, 8. The mean is (2+4+5+6+8)/5 = 5. The squared deviations are 9, 1, 0, 1, 9 and their sum is 20. The sample variance divides by n - 1 = 4, so s^2 = 20/4 = 5. The sample variance is 5."
          - problem: "A sample of 5 values has squared deviations summing to 16. Find the sample standard deviation $s$."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full summary is n = 5 and sum of squared deviations = 16. The sample variance divides by n - 1 = 4, so s^2 = 16/4 = 4. The sample standard deviation is the square root of the variance: s = sqrt(4) = 2. The sample standard deviation is 2."
        constraints: "sum of squared deviations divisible by n-1; always say sample vs population explicitly"
      - id: kp3
        name: "Interpreting and transforming the standard deviation"
        key_prerequisites: [deviations-and-variance]
        exemplars:
          - problem: 'What is the standard deviation of the data $10, 10, 10, 10$?'
            answer: "0"
            solution_sketch: 'No value deviates from the mean, so the spread is $0$.'
          - problem: 'A data set has $\sigma = 4$. Every value is increased by $10$. What is the new $\sigma$?'
            answer: "4"
            solution_sketch: 'Shifting all values shifts the mean equally, so deviations — and $\sigma$ — are unchanged.'
          - problem: 'A data set has $\sigma = 3$. Every value is doubled. What is the new $\sigma$?'
            answer: "6"
            solution_sketch: 'Scaling by $c$ scales deviations by $c$: $\sigma \to |c| \sigma = 2 \cdot 3 = 6$.'
          - problem: 'A data set has $\sigma = 5$. Every value is tripled. What is the new $\sigma$?'
            answer: "15"
            solution_sketch: 'Scaling by $c$ scales deviations by $c$: $\sigma \to |c| \sigma = 3 \cdot 5 = 15$.'
          - problem: "In a study, a variable has standard deviation 9. Every value is increased by 20. Find the new standard deviation."
            answer: "9"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Original standard deviation = 9. Rule: shifting every value by a constant shifts the mean by the same constant, so each deviation is unchanged. Thus new standard deviation = 9, and the answer is 9."
          - problem: "A data set has standard deviation 7. Every value is multiplied by 5. Find the new standard deviation."
            answer: "35"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Original standard deviation = 7. Rule: multiplying every value by a positive constant c multiplies each deviation by c, so the standard deviation is multiplied by c. With c = 5, new standard deviation = 5 * 7 = 35, so the answer is 35."
        constraints: "one transformation per problem (shift by a constant or scale by a positive integer); original sigma given or trivially 0"
    diagnostic_exemplar:
      problem: 'Find the sample standard deviation $s$ of $5, 7, 9, 11, 13$.'
      answer: 'sqrt(10)'
      solution_sketch: 'Mean $9$; squared deviations sum to $16 + 4 + 0 + 4 + 16 = 40$; $s^2 = 40/4 = 10$, so $s = \sqrt{10}$.'
    anki_seeds:
      - front: 'Sample variance divides the sum of squared deviations by...'
        back: '$n - 1$ (not $n$).'
        type: basic
      - front: 'Standard deviation is the {{c1::square root}} of the variance.'
        back: 'square root'
        type: cloze
      - front: 'Adding a constant to every data value changes the SD how? Multiplying by $c$?'
        back: 'Adding a constant: SD unchanged. Multiplying by $c$: SD multiplied by $|c|$.'
        type: basic

  - id: choosing-summary-statistics
    name: "Choosing an Appropriate Summary Statistic"
    core: false                # descriptive-summary branch; terminal
    difficulty: 0.4
    drill: false
    answer_kind: numeric
    expected_time_secs: 120
    prerequisites:
      - id: outliers-effect-on-center
        weight: 0.7
        key: true
      - id: range-iqr-boxplots
        weight: 0.5
        key: false
      - id: variance-standard-deviation
        weight: 0.5
        key: false
    knowledge_points:
      - id: kp1
        name: "Choosing a measure of center"
        key_prerequisites: [outliers-effect-on-center]
        exemplars:
          - problem: "A street has 20 houses. Nineteen sell for values near 300000, and one sells for 3000000. A report should summarize a typical price. Which measure of center is appropriate?"
            answer: "median"
            answer_contract: {"kind": "label", "options": [["mean"], ["median"], ["mode"], ["midrange"]]}
            solution_sketch: "Full data: nineteen prices near 300000 and one price 3000000. Step 1 (rule: outlier -> median): a single extreme value strongly pulls the mean, so mean is not typical. Step 2 (rule: categorical only -> mode): prices are numeric and not categorical, so mode is not the right center. Step 3 (rule: spread-sensitive midrange): the midrange uses the extreme maximum and is even more affected by the outlier. The median resists the outlier, so the appropriate measure is median."
          - problem: "A survey records each student's favorite color: red, blue, red, green. The report needs a single typical value. Which measure of center applies?"
            answer: "mode"
            answer_contract: {"kind": "label", "options": [["mean"], ["median"], ["mode"], ["midrange"]]}
            solution_sketch: "Full data: favorite colors are red, blue, red, green. Step 1 (rule: categorical -> mode): colors cannot be added or ordered, so mean and median have no meaning. Step 2 (rule: mean needs numeric values): the mean fails because arithmetic on color labels is invalid. Step 3 (rule: median needs ordered values): the median fails because colors have no natural order. Step 4 (rule: midrange needs numeric extremes): the midrange fails because there is no smallest or largest color. The mode is the only valid measure, so the appropriate measure is mode."
          - problem: "Quiz scores are 2, 4, 5, 5, 6, 60. One score is much larger than the rest. Using the appropriate measure of center for these data, find its value."
            answer: "5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Full data: quiz scores 2, 4, 5, 5, 6, 60. Step 1 (rule: outlier/skew -> median): the score 60 is far from the rest, so the median is the appropriate center. Step 2 (rule: median of even list): sort the values and average the two middle entries. The two middle entries are 5 and 5, so the median is (5 + 5)/2 = 5. The answer is 5."
          - problem: "Customers choose a genre: 1 for mystery, 2 for fantasy, 1 for mystery, 3 for romance, 1 for mystery. The store codes the choices as numbers. Using the appropriate measure of center, find its value."
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Full data: genre codes 1, 2, 1, 3, 1. Step 1 (rule: categorical -> mode): the numbers are labels for genres, so mean and median are meaningless. Step 2 (rule: mode is most frequent): count each code; code 1 appears three times, code 2 once, code 3 once. The most frequent code is 1, so the mode is 1. The answer is 1."
          - problem: "Monthly rainfall totals in inches are 4, 6, 8, 10. The data are roughly symmetric with no outliers. Using the appropriate measure of center, find its value."
            answer: "7"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Full data: rainfall totals 4, 6, 8, 10. Step 1 (rule: symmetric numeric -> mean): the values are roughly symmetric with no outlier. Step 2 (rule: mean of a list): add the values and divide by the count. The sum is 4 + 6 + 8 + 10 = 28, and 28/4 = 7. The answer is 7."
          - problem: "Household incomes in thousands are 20, 22, 24, 26, 28, 200. One value is far larger than the others. Using the appropriate measure of center, find its value."
            answer: "25"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Full data: incomes 20, 22, 24, 26, 28, 200 (thousands). Step 1 (rule: outlier/skew -> median): the value 200 is far larger than the rest, so the median is the appropriate center. Step 2 (rule: median of even list): sort the values and average the two middle entries. The two middle entries are 24 and 26, so the median is (24 + 26)/2 = 25. The answer is 25."
        constraints: "one clear driver per problem: outlier/skew -> median, symmetric numeric -> mean, categorical -> mode"
      - id: kp2
        name: "Choosing a measure of spread"
        key_prerequisites: [outliers-effect-on-center, range-iqr-boxplots]
        exemplars:
          - problem: 'A data set is reported with its median. Which measure of spread pairs with it, and why?'
            answer: 'the IQR'
            answer_contract: {kind: label, options: [[the range], [the IQR], [the standard deviation]]}
            solution_sketch: 'Like the median, the IQR resists outliers, so they pair naturally.'
          - problem: 'A symmetric, outlier-free data set is summarized by its mean. Which spread measure pairs naturally with the mean?'
            answer: 'the standard deviation'
            answer_contract: {kind: label, options: [[the range], [the IQR], [the standard deviation]]}
            solution_sketch: 'The standard deviation uses every value, matching the mean.'
          - problem: 'A data set with one extreme high value is summarized by its median. Which measure of spread pairs with it?'
            answer: 'the IQR'
            answer_contract: {kind: label, options: [[the range], [the IQR], [the standard deviation]]}
            solution_sketch: 'Like the median, the IQR resists outliers, so they pair naturally.'
          - problem: 'A symmetric, outlier-free data set is summarized by its mean. Which spread measure pairs with it?'
            answer: 'the standard deviation'
            answer_contract: {kind: label, options: [[the range], [the IQR], [the standard deviation]]}
            solution_sketch: 'The standard deviation uses every value, matching the mean.'
          - problem: 'Which measure of spread is computed using only the maximum and the minimum of a data set?'
            answer: 'the range'
            answer_contract: {kind: label, options: [[the range], [the IQR], [the standard deviation]]}
            solution_sketch: 'Range $=$ maximum $-$ minimum; the IQR uses quartiles and the SD uses deviations from the mean.'
          - problem: 'A report on home prices with one extreme mansion uses a resistant pair of summaries. Which spread measure did it most likely report?'
            answer: 'the IQR'
            answer_contract: {kind: label, options: [[the range], [the IQR], [the standard deviation]]}
            solution_sketch: 'Resistant summaries are the median with the IQR; the mansion would inflate the range and the standard deviation.'
        constraints: "pairings only: median with IQR, mean with SD; ask for a one-line justification"
      - id: kp3
        name: "Inferring shape from mean vs median"
        key_prerequisites: [outliers-effect-on-center]
        exemplars:
          - problem: "Salaries at a firm have mean 58000 and median 49000. Give 1 if right-skewed, -1 if left-skewed, and 0 if symmetric."
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The salaries have mean 58000 and median 49000. Rule: a mean greater than the median means right-skew. The code for right-skewed is 1. The answer is 1."
          - problem: "Test scores in a class have mean 40 and median 55. Give 1 if right-skewed, -1 if left-skewed, and 0 if symmetric."
            answer: "-1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The test scores have mean 40 and median 55. Rule: a mean less than the median means left-skew. The code for left-skewed is -1. The answer is -1."
          - problem: "A distribution has mean 58 and median 45. Give the shape and the difference mean minus median."
            answer: "shape = right-skew; diff = 13"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["left-skew"], ["right-skew"], ["symmetric"]]}, "name": "shape"}, {"contract": {"kind": "exact"}, "name": "diff"}]}
            solution_sketch: "The distribution has mean 58 and median 45. Rule: when the mean is greater than the median, the distribution is right-skewed. The difference mean minus median is 58 - 45 = 13. The answer is shape = right-skew; diff = 13."
          - problem: "A sample has mean 70 and median 70. State the shape and the value of mean minus median."
            answer: "shape = symmetric; diff = 0"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["left-skew"], ["right-skew"], ["symmetric"]]}, "name": "shape"}, {"contract": {"kind": "exact"}, "name": "diff"}]}
            solution_sketch: "The sample has mean 70 and median 70. Rule: when the mean and median are equal, the distribution is symmetric. The difference mean minus median is 70 - 70 = 0. The answer is shape = symmetric; diff = 0."
          - problem: "For a data set, the mean is 30 and the median is 45. Determine the shape and the difference mean minus median."
            answer: "shape = left-skew; diff = -15"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["left-skew"], ["right-skew"], ["symmetric"]]}, "name": "shape"}, {"contract": {"kind": "exact"}, "name": "diff"}]}
            solution_sketch: "The data set has mean 30 and median 45. Rule: when the mean is less than the median, the distribution is left-skewed. The difference mean minus median is 30 - 45 = -15. The answer is shape = left-skew; diff = -15."
          - problem: "Household incomes have mean 80 and median 60. Find the shape and the value of mean minus median."
            answer: "shape = right-skew; diff = 20"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["left-skew"], ["right-skew"], ["symmetric"]]}, "name": "shape"}, {"contract": {"kind": "exact"}, "name": "diff"}]}
            solution_sketch: "Household incomes have mean 80 and median 60. Rule: a mean above the median indicates right-skew. The difference mean minus median is 80 - 60 = 20. The answer is shape = right-skew; diff = 20."
        constraints: "give mean and median (or a shape description); ask for the skew direction or the comparison"
    diagnostic_exemplar:
      problem: 'Household incomes in a city include a small number of extremely high earners. Which center-and-spread pair should a summary report, and why?'
      answer: 'Median and IQR; both resist the extreme high incomes that would inflate the mean and standard deviation.'
      answer_contract: {kind: none}
      solution_sketch: 'Ask which summaries are resistant: the mean and standard deviation are dragged upward by the few extreme incomes, while the median and IQR depend only on position in the ordered data.'
    anki_seeds:
      - front: 'Skewed data or outliers: report which center-spread pair?'
        back: 'Median with IQR (both are resistant).'
        type: basic
      - front: 'Right-skewed distribution: mean vs median?'
        back: 'Mean $>$ median (the tail pulls the mean).'
        type: basic

  - id: z-scores
    name: "Z-Scores"
    core: true
    difficulty: 0.4
    drill: false
    answer_kind: numeric
    expected_time_secs: 90
    prerequisites:
      - id: variance-standard-deviation
        weight: 0.8
        key: true
      - id: decimal-operations
        weight: 0.4
        key: false
    knowledge_points:
      - id: kp1
        name: "Computing a z-score"
        key_prerequisites: [variance-standard-deviation]
        exemplars:
          - problem: 'A mark of $8.5$ (out of $10$) comes from a distribution with mean $7$ and standard deviation $0.5$. Find its z-score.'
            answer: "3"
            solution_sketch: '$z = (8.5 - 7)/0.5 = 1.5/0.5 = 3$.'
          - problem: 'Find the z-score of $62$ if the mean is $70$ and the standard deviation is $4$.'
            answer: "-2"
            solution_sketch: '$z = (62 - 70)/4 = -8/4 = -2$.'
          - problem: 'A value of $130$ comes from a distribution with mean $100$ and standard deviation $15$. Find its z-score.'
            answer: "2"
            solution_sketch: '$z = (130 - 100)/15 = 30/15 = 2$.'
          - problem: 'A temperature of $17$ degrees sits in a distribution with mean $20$ and standard deviation $4$. Find its z-score.'
            answer: "-0.75"
            solution_sketch: '$z = (17 - 20)/4 = -3/4 = -0.75$.'
          - problem: "A runner's time of 75 seconds comes from a distribution with mean 70 seconds and standard deviation 10 seconds. Find the z-score."
            answer: "0.5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Write the z-score rule: z = (x - mu)/sigma. Substitute x = 75, mu = 70, sigma = 10: z = (75 - 70)/10 = 5/10 = 0.5. The z-score is 0.5."
          - problem: "A package weighs 23 grams; in this population the mean weight is 26 grams and the standard deviation is 2 grams. Find the z-score."
            answer: "-1.5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Write the z-score rule: z = (x - mu)/sigma. Substitute x = 23, mu = 26, sigma = 2: z = (23 - 26)/2 = -3/2 = -1.5. The z-score is -1.5."
        constraints: "x - mu divisible by sigma or ending in .5; include negative z-scores"
      - id: kp2
        name: "Solving for x, mu, or sigma"
        key_prerequisites: [variance-standard-deviation]
        exemplars:
          - problem: 'A value has $z = 1.5$ in a distribution with mean $100$ and standard deviation $10$. Find the value.'
            answer: "115"
            solution_sketch: '$x = \mu + z\sigma = 100 + 1.5 \cdot 10 = 115$.'
          - problem: 'A value of $40$ has $z = -2$ with standard deviation $5$. Find the mean.'
            answer: "50"
            solution_sketch: '$-2 = (40 - \mu)/5$, so $40 - \mu = -10$ and $\mu = 50$.'
          - problem: 'A value has $z = -3$ in a distribution with mean $80$ and standard deviation $6$. Find the value.'
            answer: "62"
            solution_sketch: '$x = \mu + z\sigma = 80 + (-3) \cdot 6 = 62$.'
          - problem: 'A value of $19$ has $z = 2$ in a distribution with mean $15$. Find the standard deviation.'
            answer: "2"
            solution_sketch: '$2 = (19 - 15)/\sigma = 4/\sigma$, so $\sigma = 4/2 = 2$.'
          - problem: "A value of 72 has z = 1.5 in a distribution with mean 60. Find the standard deviation."
            answer: "8"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Use the z-score formula z = (x - mu)/sigma. Substitute the known numbers: 1.5 = (72 - 60)/sigma, so 1.5 = 12/sigma. Solve for sigma: sigma = 12/1.5 = 8. The standard deviation is 8."
          - problem: "A value of 23 has z = 1.5 in a distribution with standard deviation 4. Find the mean."
            answer: "17"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Use the z-score formula z = (x - mu)/sigma. Substitute the known numbers: 1.5 = (23 - mu)/4, so 6 = 23 - mu. Solve for mu: mu = 23 - 6 = 17. The mean is 17."
        constraints: "one unknown among x, mu, sigma; all quantities integers or ending in .5"
      - id: kp3
        name: "Comparing values across distributions"
        key_prerequisites: [variance-standard-deviation]
        exemplars:
          - problem: 'Test A (marked out of $10$) has mean $6$, SD $1$; test B has mean $7$, SD $1.5$. Which is relatively better: an $8$ on test A or an $8.5$ on test B? Give the z-score of the better one.'
            answer: "2"
            solution_sketch: 'Test A: $z = (8-6)/1 = 2$. Test B: $z = (8.5-7)/1.5 = 1$. Higher z-score means further above its own mean.'
          - problem: 'Which is more unusual: $z = -2.5$ or $z = 1.8$? Give that z-score.'
            answer: "-2.5"
            solution_sketch: 'Unusualness is measured by $|z|$, and $|-2.5| > |1.8|$.'
          - problem: 'Machine A fills bottles with mean $500$ g and SD $5$ g; machine B has mean $500$ g and SD $10$ g. One bottle from A weighs $508$ g and one from B weighs $512$ g. Which is relatively more unusual? Give its z-score.'
            answer: "1.6"
            solution_sketch: 'Machine A: $z = (508-500)/5 = 1.6$; machine B: $z = (512-500)/10 = 1.2$. The A bottle sits further above its own mean.'
          - problem: 'Which is more unusual: $z = 0.5$ or $z = -1.8$? Give that z-score.'
            answer: "-1.8"
            solution_sketch: 'Unusualness is measured by $|z|$, and $|-1.8| > |0.5|$.'
          - problem: "Class 1 has mean 70 and standard deviation 8. Class 2 has mean 60 and standard deviation 10. A score of 82 in class 1 and a score of 74 in class 2. Which score is relatively higher within its own class? Give its z-score."
            answer: "1.5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (z-score rule): class 1 z = (82 - 70)/8 = 12/8 = 1.5. Step 2 (z-score rule): class 2 z = (74 - 60)/10 = 14/10 = 1.4. Step 3 (comparison rule): 1.5 > 1.4, so the class 1 score is relatively higher. Its z-score is 1.5."
          - problem: "Runner A has mean finish time 40 minutes and standard deviation 5 minutes. Runner B has mean finish time 50 minutes and standard deviation 4 minutes. One run by A took 35 minutes and one run by B took 44 minutes. Which run is relatively more unusual within its own distribution? Give its z-score."
            answer: "-1.5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (z-score rule): runner A z = (35 - 40)/5 = -5/5 = -1. Step 2 (z-score rule): runner B z = (44 - 50)/4 = -6/4 = -1.5. Step 3 (unusualness rule): the absolute values are 1 and 1.5, and 1.5 is larger, so runner B's run is relatively more unusual. Its z-score is -1.5."
        constraints: "two distributions with different means and SDs; z-scores come out to clean values like 1, 1.5, 2"
    diagnostic_exemplar:
      problem: 'A mark of $84$ comes from a distribution with mean $72$ and standard deviation $6$; a mark of $55$ comes from a distribution with mean $40$ and standard deviation $10$. Which is relatively better? Give the z-score of the better one.'
      answer: '2'
      solution_sketch: '$z_1 = (84 - 72)/6 = 2$ and $z_2 = (55 - 40)/10 = 1.5$; the first mark stands further above its own mean, so its z-score $2$ is the answer.'
    anki_seeds:
      - front: 'Z-score formula?'
        back: '$z = \frac{x - \mu}{\sigma}$ — how many standard deviations $x$ lies from the mean.'
        type: basic
      - front: 'A negative z-score means the value is...'
        back: 'Below the mean.'
        type: basic
