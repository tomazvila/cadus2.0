unit: descriptive-statistics
course: probability-statistics
module: "Descriptive Statistics"
topics:
  - id: summation-notation
    name: "Summation Notation"
    core: true
    difficulty: 0.25
    drill: false
    answer_kind: numeric
    expected_time_secs: 90
    prerequisites:
      - id: evaluating-expressions
        weight: 0.8
        key: true
      - id: order-of-operations
        weight: 0.5
        key: false
    knowledge_points:
      - id: kp1
        name: "Evaluating sigma notation"
        key_prerequisites: [evaluating-expressions]
        step_check:
          step: 'Substitute each value of $j$ from 3 to 6 into the summand $2j - 1$'
          question: 'In $\sum_{j=3}^{6} (2j-1)$, why is $j$ replaced by $3$, $4$, $5$ and $6$, and not only by $3$ and $6$?'
          options:
            - 'The sum starts and stops at the limits, so only those two values are used'
            - 'The index takes every whole number from the lower limit to the upper limit'
            - 'The index starts at $1$ whatever the lower limit says, so $j$ runs from $1$ to $6$'
            - 'The lower limit tells how many terms there are, so three terms are added in all'
          answer: 'The index takes every whole number from the lower limit to the upper limit'
          why: 'The sigma adds one term for each whole-number value of the index between the limits, so $j=3,4,5,6$ each give one term.'
        exemplars:
          - problem: 'Evaluate $\sum_{k=1}^{5} (2k-1)$.'
            answer: '25'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Substitute $k=1,2,3,4,5$ into $2k-1$ to get the terms $1, 3, 5, 7, 9$. Their sum is $25$.'
          - problem: 'Evaluate $\sum_{k=1}^{4} k^2$.'
            answer: '30'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The terms are $1^2, 2^2, 3^2, 4^2$, which are $1, 4, 9, 16$. Adding them gives $30$.'
          - problem: 'Row $k$ of a theatre has $2k+8$ seats, for the rows $k=1$ to $k=6$. How many seats are there in these six rows altogether?'
            answer: '90'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The seat count is the sum $\sum_{k=1}^{6} (2k+8)$. The rows have $10, 12, 14, 16, 18, 20$ seats, and these add up to $90$.'
          - problem: 'Evaluate $\sum_{k=3}^{6} (3k-2)$.'
            answer: '46'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The index starts at $3$, so the terms are $7, 10, 13, 16$. Their sum is $46$.'
          - problem: 'A runner trains $5k$ minutes on day $k$, for the days $k=1$ to $k=4$. The total training time is $\sum_{k=1}^{4} 5k$. How long is that?'
            answer: '50'
            answer_contract: {"kind": "unit", "quantity": "time", "unit": "minute", "allow_omitted": true}
            solution_sketch: 'The daily times are $5, 10, 15, 20$ minutes. Adding them gives a total of $50$ minutes.'
          - problem: 'Evaluate $\sum_{n=0}^{4} 2^n$.'
            answer: '31'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The index starts at $0$, so there are five terms: $1, 2, 4, 8, 16$. Their sum is $31$.'
          - problem: 'Evaluate $\sum_{j=2}^{5} (12-2j)$.'
            answer: '20'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'For $j=2,3,4,5$ the terms are $8, 6, 4, 2$. Their sum is $20$.'
          - problem: 'Sam evaluates $\sum_{k=2}^{4} (k+3)$ and gets $2+3+4+3=12$. What is the correct value?'
            answer: '18'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Sam added $3$ only once. The term $k+3$ is needed for each of $k=2,3,4$, so the sum is $5+6+7=18$.'
        constraints: "index runs over at most 7 integers (it may start at 0 or above 1); summand is linear in the index, or k^2 or 2^n; some items are small contexts where the sum has to be set up"
      - id: kp2
        name: "Sums over data lists"
        key_prerequisites: [evaluating-expressions]
        step_check:
          step: 'Square each value first'
          question: 'Why is each value squared before the values are added in $\sum x_i^2$?'
          options:
            - 'Squaring the data first makes the numbers easier to add in the end'
            - 'The sigma squares the total of the data, so squaring comes after adding'
            - 'The square applies to each $x_i$ separately, then the squares are added'
            - 'The order does not matter, since squaring after adding gives the same total'
          answer: 'The square applies to each $x_i$ separately, then the squares are added'
          why: 'In $\sum x_i^2$ the exponent belongs to $x_i$, so each value is squared on its own; $(x_1+x_2+x_3)^2$ is a different number.'
        exemplars:
          - problem: 'For the data $x_1 = 2$, $x_2 = 5$, $x_3 = 7$, $x_4 = 10$, evaluate $\sum_{i=1}^{4} x_i$.'
            answer: '24'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The sigma tells us to add all four data values, from $x_1$ up to $x_4$. We get $2+5+7+10=24$.'
          - problem: 'A bakery sold $x_1=12$, $x_2=9$, $x_3=15$, $x_4=11$ and $x_5=13$ loaves on five days. How many loaves did it sell in total, that is, what is $\sum_{i=1}^{5} x_i$?'
            answer: '60'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The total is the sum of the five daily counts. We get $12+9+15+11+13=60$ loaves.'
          - problem: 'For the data $x_1 = 1$, $x_2 = 3$, $x_3 = 4$, evaluate $\sum_{i=1}^{3} x_i^2$.'
            answer: '26'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Square each value first, because the exponent belongs to each $x_i$, and then add. We get $1+9+16=26$.'
          - problem: 'For the data $x_1 = 4$, $x_2 = 7$, $x_3 = 1$, $x_4 = 6$, $x_5 = 9$, evaluate $\sum_{i=2}^{4} x_i$.'
            answer: '14'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The index runs only from $2$ to $4$, so $x_1$ and $x_5$ are left out. The sum is $7+1+6=14$.'
          - problem: 'Three square tiles have sides $x_1=2$ cm, $x_2=3$ cm and $x_3=5$ cm. The total area of the tiles is $\sum_{i=1}^{3} x_i^2$. What is it?'
            answer: '38'
            answer_contract: {"kind": "unit", "quantity": "area", "unit": "cm^2", "allow_omitted": true}
            solution_sketch: 'Each tile has area equal to its side squared: $4, 9, 25$ square centimetres. The total area is $38$ square centimetres.'
          - problem: 'The highest temperatures on four days were $x_1=21$, $x_2=23$, $x_3=20$ and $x_4=24$ degrees, and their mean is $22$. Evaluate $\sum_{i=1}^{4} (x_i-22)$.'
            answer: '0'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The terms are $-1, 1, -2, 2$. The deviations from the mean cancel, so the sum is $0$.'
          - problem: 'For the data $x_1 = 2$, $x_2 = 3$, $x_3 = 4$, $x_4 = 5$, evaluate $\sum_{i=1}^{4} x_i^2$.'
            answer: '54'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The squares of the four values are $4, 9, 16, 25$. Their sum is $54$.'
          - problem: 'For the data $x_1=1$, $x_2=3$, $x_3=6$, evaluate $\sum_{i=1}^{3} (x_i-3)^2$.'
            answer: '13'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Subtract $3$ from each value and then square: $4, 0, 9$. The sum is $13$.'
          - problem: 'Mia has the data $x_1=3$, $x_2=4$, $x_3=5$. She evaluates $\sum_{i=1}^{3} x_i^2$ as $(3+4+5)^2=144$. What is the correct value?'
            answer: '50'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Mia squared the total, but the sigma squares each value before the addition. The correct sum is $9+16+25=50$.'
        constraints: "3-5 data values, small integers; sums of x_i, x_i^2 or (x_i - c)^2; a partial range of the index is allowed; contexts give the data as a list"
      - id: kp3
        name: "Linearity of sums"
        key_prerequisites: [evaluating-expressions]
        try_first:
          problem: 'Four numbers add up to $10$. Each of the four numbers is increased by $1$. What is the new total?'
          answer_contract: {"kind": "exact"}
          answer: '14'
          reveal: 'Each of the four numbers gains $1$, so the total gains $4$. In sigma notation, adding a constant $c$ to every one of $n$ terms adds $nc$ to the sum.'
        step_check:
          step: 'Adding $3$ to each of the $5$ terms adds $3 \cdot 5 = 15$ to the total'
          question: 'Why does adding $3$ to each of the $5$ terms add $15$ to the total, and not just $3$?'
          options:
            - 'Only the first term gets the $3$, and the other four terms are left as they were'
            - 'The total is multiplied by $3$, and then $5$ is added to that result'
            - 'The $3$ is added once, and then five copies of the whole sum are taken'
            - 'Each of the $5$ terms grows by $3$, so the total grows by five lots of $3$'
          answer: 'Each of the $5$ terms grows by $3$, so the total grows by five lots of $3$'
          why: 'The sum has $5$ terms, each increased by $3$, so the total rises by $3+3+3+3+3=15$. In general the rise is $n$ times the shift.'
        exemplars:
          - problem: 'Given $\sum_{i=1}^{5} x_i = 20$, evaluate $\sum_{i=1}^{5} 2x_i$.'
            answer: '40'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A constant factor comes out of the sum: $\sum 2x_i = 2\sum x_i$. So the value is $2 \cdot 20 = 40$.'
          - problem: 'Given $\sum_{i=1}^{5} x_i = 20$, evaluate $\sum_{i=1}^{5} (x_i + 3)$.'
            answer: '35'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Adding $3$ to each of the $5$ terms adds $15$ to the total. The new sum is $20+15=35$.'
          - problem: 'Five employees earn $x_i$ dollars a week, and $\sum_{i=1}^{5} x_i = 3000$. Each employee gets a raise of $40$ dollars a week. What is the new weekly total?'
            answer: '3200'
            answer_contract: {"kind": "unit", "quantity": "dollar", "unit": "dollar", "allow_omitted": true}
            solution_sketch: 'The new total is $\sum (x_i+40)$. The raise adds $5 \cdot 40 = 200$ dollars, so the total is $3000+200=3200$ dollars.'
          - problem: 'Given $\sum_{i=1}^{6} x_i = 30$, evaluate $\sum_{i=1}^{6} 3x_i$.'
            answer: '90'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Pull the constant out of the sum: $3 \cdot 30 = 90$. The number of terms does not change the result here.'
          - problem: 'Six boards have lengths $x_i$ metres, and $\sum_{i=1}^{6} x_i = 21$. A carpenter cuts $0.5$ m off each board. What is the total length left?'
            answer: '18'
            answer_contract: {"kind": "unit", "quantity": "length", "unit": "m", "allow_omitted": true}
            solution_sketch: 'The cuts remove $6 \cdot 0.5 = 3$ metres in all. The length left is $21-3=18$ metres.'
          - problem: 'Given $\sum_{i=1}^{4} (x_i + 5) = 32$, evaluate $\sum_{i=1}^{4} x_i$.'
            answer: '12'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The shift added $5$ to each of $4$ terms, which is $20$ in all. So $\sum x_i = 32-20 = 12$.'
          - problem: 'Given $\sum_{i=1}^{8} x_i = 24$, evaluate $\sum_{i=1}^{8} (x_i - 5)$.'
            answer: '-16'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Subtracting $5$ from each of $8$ terms removes $40$ from the total. The new sum is $24-40=-16$.'
          - problem: 'Five employees earn $x_i$ dollars a week, and $\sum_{i=1}^{5} x_i = 3000$. Each employee gets a raise of $10\%$. What is the new weekly total?'
            answer: '3300'
            answer_contract: {"kind": "unit", "quantity": "dollar", "unit": "dollar", "allow_omitted": true}
            solution_sketch: 'A raise of $10\%$ turns each $x_i$ into $1.1x_i$, so the factor $1.1$ comes out of the sum. The new total is $1.1 \cdot 3000 = 3300$ dollars.'
          - problem: 'Given $\sum_{i=1}^{6} 4x_i = 48$, evaluate $\sum_{i=1}^{6} x_i$.'
            answer: '12'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The constant $4$ comes out: $4\sum x_i = 48$. Dividing by $4$ gives $\sum x_i = 12$.'
          - problem: 'Given $\sum_{i=1}^{5} x_i = 18$, evaluate $\sum_{i=1}^{5} (3x_i - 2)$.'
            answer: '44'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Scale first: $3 \cdot 18 = 54$. Then subtract $2$ for each of the $5$ terms, which is $10$, to get $44$.'
          - problem: 'Tom says that if $\sum_{i=1}^{4} x_i = 12$, then $\sum_{i=1}^{4} (x_i + 5) = 17$. What is the correct value?'
            answer: '32'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Tom added $5$ only once, but each of the $4$ terms gains $5$. The correct value is $12 + 4 \cdot 5 = 32$.'
        constraints: "given sum is a small integer; n between 4 and 10; one or two operations (scale, shift) per problem; contexts: pay raises, cut lengths; a missing sum can be asked from a given shifted or scaled sum"
    diagnostic_exemplar:
      problem: 'Given $\sum_{i=1}^{4} x_i = 10$, compute $\sum_{i=1}^{4} (2x_i + 3)$.'
      answer: '32'
      solution_sketch: 'Linearity: $2 \cdot 10 + 3 \cdot 4 = 20 + 12 = 32$.'
    anki_seeds:
      - front: '$\sum_{i=1}^{n} x_i$ means...'
        back: '$x_1 + x_2 + \cdots + x_n$ — add the terms as the index $i$ runs from $1$ to $n$.'
        type: basic
      - front: 'What is $\sum_{i=1}^{n} c$ for a constant $c$?'
        back: '$nc$ — the constant is added $n$ times.'
        type: basic

  - id: frequency-tables-histograms
    name: "Frequency Tables and Histograms"
    core: true
    difficulty: 0.2
    drill: false
    answer_kind: numeric
    expected_time_secs: 90
    prerequisites:
      - id: comparing-ordering-whole-numbers
        weight: 0.6
        key: true
      - id: multi-digit-addition-subtraction
        weight: 0.4
        key: false
      - id: percentages
        weight: 0.4
        key: false
    knowledge_points:
      - id: kp1
        name: "Tallying a frequency table"
        key_prerequisites: [comparing-ordering-whole-numbers]
        step_check:
          step: 'Total data values $=$ sum of frequencies'
          question: 'Why is the total number of data values the sum of the frequencies?'
          options:
            - 'The frequencies are listed in order, so the last frequency shown is the total'
            - 'Adding the frequencies counts how many different values appear in the list'
            - 'The largest frequency is the total, and the others split it into parts'
            - 'Each data value is in one frequency, so adding counts each value once'
          answer: 'Each data value is in one frequency, so adding counts each value once'
          why: 'Every data value lands in one row of the table, so the row counts together make up the whole data set.'
        exemplars:
          - problem: 'Ten students counted their pets: $1, 4, 2, 4, 4, 1, 2, 4, 5, 4$. The counts are tallied into a frequency table. What is the frequency of $4$ pets?'
            answer: '5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The value $4$ appears at five places in the list. So the frequency of $4$ is $5$.'
          - problem: 'In a survey, $4$ students have $1$ sibling, $7$ students have $2$ siblings and $9$ students have $3$ siblings. How many students were surveyed?'
            answer: '20'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Every student appears in exactly one row of the table, so the frequencies add up to the number of students. We get $4+7+9=20$.'
          - problem: 'The data $3, 5, 3, 1, 5, 5, 3, 1$ are tallied into a frequency table. What is the frequency of the value $5$?'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Tally each value: $1$ appears twice, $3$ appears three times and $5$ appears three times. So the frequency of $5$ is $3$.'
          - problem: 'A frequency table lists the values $1, 2, 3, 4$ with frequencies $3, ?, 4, 6$, and there are $20$ data values in all. What is the missing frequency?'
            answer: '7'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The known frequencies add up to $3+4+6=13$. The missing frequency is the rest of the total, $20-13=7$.'
          - problem: 'A die was rolled $30$ times. The faces $1$ to $5$ came up $4$, $5$, $6$, $3$ and $4$ times. How many times did the face $6$ come up?'
            answer: '8'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The faces $1$ to $5$ account for $4+5+6+3+4=22$ rolls. The other rolls were sixes, so there were $30-22=8$ of them.'
          - problem: 'The shoe sizes of nine pupils are $7, 8, 8, 9, 7, 8, 10, 8, 9$. Which size has the greatest frequency?'
            answer: '8'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Tally the sizes: $7$ appears twice, $8$ four times, $9$ twice and $10$ once. Size $8$ has the greatest frequency.'
          - problem: 'A frequency table lists the values $2, 4, 6, 8$ with frequencies $3, 5, 1, 6$. How many data values are greater than $4$?'
            answer: '7'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The values greater than $4$ are $6$ and $8$. Their frequencies add up to $1+6=7$.'
          - problem: 'Lena tallies the data $6, 2, 6, 3, 6, 2, 3, 6, 6$ and says the frequency of $6$ is $4$. What is the correct frequency of $6$?'
            answer: '5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Count the sixes one by one: they are in positions $1, 3, 5, 8$ and $9$. So the correct frequency is $5$.'
        constraints: "raw lists of 6-12 small integers, or tables with 3-5 rows; frequencies are single digits; missing-frequency and context items are allowed"
      - id: kp2
        name: "Relative frequency"
        key_prerequisites: [percentages]
        try_first:
          problem: 'In a class of $20$ students, $5$ are left-handed. What fraction of the class is left-handed?'
          answer_contract: {"kind": "exact"}
          answer: '1/4'
          reveal: 'The left-handed students are $5$ out of $20$, which is $5/20=1/4$. Relative frequency is always the part divided by the whole.'
        step_check:
          step: 'Find the total: $6 + 9 + 5 = 20$ data values'
          question: 'A frequency table has frequencies $6, 9, 5$ for three categories. Why is the total of all three frequencies found first and used as the denominator of the relative frequency of the second category?'
          options:
            - 'The second frequency is compared with the first, as the next category in the table'
            - 'A share compares a part with the whole, so the denominator is the full total'
            - 'Dividing by the largest frequency shows how far the category is from the most common one'
            - 'The total is the only number that may serve as a denominator, whatever the question asks'
          answer: 'A share compares a part with the whole, so the denominator is the full total'
          why: 'Relative frequency answers what share of all the data falls in one category, so the count of that category is divided by the count of everything.'
        exemplars:
          - problem: 'A frequency table has frequencies $6, 9, 5$ for three categories. What is the relative frequency of the second category?'
            answer: '9/20'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The total is $6+9+5=20$. The second category has frequency $9$, so its relative frequency is $9/20$.'
          - problem: 'In a class of $25$ students, $10$ walk to school. What is the relative frequency of walking?'
            answer: '2/5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The relative frequency is the part divided by the whole, $10/25$. This is $2/5$, which is $0.4$ or $40\%$.'
          - problem: 'A frequency table has frequencies $5, 6, 7, 7$ for four categories. What is the relative frequency of the first category?'
            answer: '1/5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Add the four frequencies to get the total, $5+6+7+7=25$. The first category has relative frequency $5/25=1/5$.'
          - problem: 'A coin was flipped $50$ times and landed heads $30$ times. What fraction of the flips were heads?'
            answer: '3/5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The fraction is the number of heads divided by the number of flips, $30/50$. This equals $3/5$.'
          - problem: 'In a survey of $30$ students, $17$ prefer tea. What is the relative frequency of preferring tea, to two decimal places?'
            answer: '0.57'
            answer_contract: {"kind": "approx", "decimals": 2}
            solution_sketch: 'Divide the tea count by the number of students: $17/30 = 0.5666\ldots$. To two decimal places this is $0.57$.'
          - problem: 'The relative frequency of red cars in a car park is $0.35$, and there are $200$ cars. How many cars are red?'
            answer: '70'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The relative frequency is the red count divided by the $200$ cars. So the red count is $0.35 \cdot 200 = 70$.'
          - problem: 'In a car park, $12$ cars are blue, and this is a relative frequency of $0.06$. How many cars are in the car park?'
            answer: '200'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The relative frequency is the blue count divided by the total, so $12/\text{total}=0.06$. The total is $12/0.06=200$ cars.'
          - problem: 'Of $40$ students, $18$ own a bike. What percent of the students own a bike?'
            answer: '45%'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The relative frequency is $18/40=0.45$. Written as a percent, this is $45\%$.'
          - problem: 'A table has frequencies $6$, $4$ and $8$. Raj says the relative frequency of the first category is $\frac{6}{12}$. What is the correct relative frequency?'
            answer: '1/3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Raj divided by $4+8=12$ and left out the first category. The total is $6+4+8=18$, so the correct value is $6/18=1/3$.'
        constraints: "totals of 20, 25, 30, 40 or 50; fractions, decimals and percents may be asked in context; a count can be asked from a relative frequency"
      - id: kp3
        name: "Reading histograms"
        key_prerequisites: [comparing-ordering-whole-numbers]
        step_check:
          step: 'sum the heights of the bars from $5$ up'
          question: 'A histogram has bars over $0$-$4$, $5$-$9$ and $10$-$14$. Why are only the bars from $5$ up added to count the values that are at least $5$?'
          options:
            - 'Only bars that are taller than $5$ can hold values of at least $5$'
            - 'The $5$-$9$ bar alone holds every value from $5$ up, so the $10$-$14$ bar is extra'
            - 'Every value in those bars is $5$ or more, and no other bar has such values'
            - 'Each bar shows the sum of its end values, so the bars with large ends are chosen'
          answer: 'Every value in those bars is $5$ or more, and no other bar has such values'
          why: 'The intervals partition the values, so the values that are at least $5$ are exactly those in the bars from $5$ upward.'
        exemplars:
          - problem: 'A histogram shows the time, in minutes, that students took to walk to school. The bars cover $0$-$9$, $10$-$19$, $20$-$29$ and $30$-$39$ minutes and have heights $6, 2, 7, 4$. How many students took less than $20$ minutes?'
            answer: '8'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A bar height is the number of students in its interval. The intervals below $20$ minutes have heights $6$ and $2$, so $6+2=8$ students.'
          - problem: 'A histogram of test scores has bars over $0$-$9$, $10$-$19$ and $20$-$29$ with heights $5, 8, 3$. How many scores are there altogether?'
            answer: '16'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Each score lies in exactly one interval, so the bar heights add up to the number of scores. We get $5+8+3=16$.'
          - problem: 'A histogram of the ages of $22$ visitors has bars over $0$-$9$, $10$-$19$, $20$-$29$, $30$-$39$ and $40$-$49$ with heights $2, 7, 4, 6, 3$. How many more visitors are in the $10$-$19$ interval than in the $40$-$49$ interval?'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The $10$-$19$ bar has height $7$ and the $40$-$49$ bar has height $3$. The difference is $7-3=4$ visitors.'
          - problem: 'In the histogram of the $22$ visitors (heights $2, 7, 4, 6, 3$ over $0$-$9$ up to $40$-$49$), how many visitors are at least $30$ years old?'
            answer: '9'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The bars at or above $30$ are $30$-$39$ and $40$-$49$. Their heights add up to $6+3=9$ visitors.'
          - problem: 'A histogram of $20$ delivery times has bars over $0$-$9$, $10$-$19$, $20$-$29$ and $30$-$39$ minutes with heights $4, 7, 6, 3$. What fraction of the deliveries took $20$ to $29$ minutes?'
            answer: '3/10'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The $20$-$29$ bar has height $6$, and the bars add up to $4+7+6+3=20$ deliveries. The fraction is $6/20=3/10$.'
          - problem: 'A histogram of $25$ values has four bars. The first three bars have heights $6$, $9$ and $4$. What is the height of the fourth bar?'
            answer: '6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The first three bars hold $6+9+4=19$ values. The fourth bar holds the rest, $25-19=6$ values.'
          - problem: 'A histogram of $20$ values has bars over $0$-$9$, $10$-$19$, $20$-$29$ and $30$-$39$ with heights $5, 8, 3, 4$. What percent of the values are below $10$?'
            answer: '25%'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Only the $0$-$9$ bar lies below $10$, and its height is $5$. The share is $5/20=0.25$, which is $25\%$.'
          - problem: 'A histogram has bars over $0$-$4$, $5$-$9$ and $10$-$14$ with heights $3, 7, 5$. Ben says $7$ values are at least $5$, the height of the tallest bar. What is the correct number?'
            answer: '12'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Values of at least $5$ lie in two bars, $5$-$9$ and $10$-$14$. Ben used only one of them; the correct count is $7+5=12$.'
        constraints: "3-5 equal-width intervals; bar heights are single-digit integers; describe the histogram in words; counts, fractions, percents and a missing bar height may be asked"
    diagnostic_exemplar:
      problem: 'For the data $4, 1, 4, 2, 4, 1, 2, 4$, what is the relative frequency of the value $4$?'
      answer: '1/2'
      solution_sketch: 'The value $4$ appears $4$ times out of $8$ data values: $4/8 = 1/2$.'
    anki_seeds:
      - front: 'The frequency of a value is...'
        back: 'The number of times it occurs in the data set.'
        type: basic
      - front: 'Relative frequency $=$ ?'
        back: 'frequency $\div$ total number of data values.'
        type: basic

  - id: dot-plots-stem-leaf
    name: "Dot Plots and Stem-and-Leaf Plots"
    core: false                # data-display branch; terminal
    difficulty: 0.2
    drill: false
    answer_kind: numeric
    expected_time_secs: 90
    prerequisites:
      - id: place-value
        weight: 0.6
        key: true
      - id: comparing-ordering-whole-numbers
        weight: 0.4
        key: false
    knowledge_points:
      - id: kp1
        name: "Reading dot plots"
        key_prerequisites: [comparing-ordering-whole-numbers]
        step_check:
          step: 'Sum the number of dots'
          question: 'Why does adding the numbers of dots at all positions give the number of data values?'
          options:
            - 'The number under each dot shows how many data values that dot stands for'
            - 'Dots in one stack count as a single value, so every stack counts once'
            - 'Only the tallest stack counts, since the other stacks only repeat the same data'
            - 'Each data value has its own dot, so no dot stands for more than one value'
          answer: 'Each data value has its own dot, so no dot stands for more than one value'
          why: 'A dot plot draws one dot per observation, so the dots over all the positions together count every observation exactly once.'
        exemplars:
          - problem: 'A dot plot shows the number of goals a team scored in each of its games. There are $2$ dots over $1$ goal, $4$ dots over $2$ goals, $3$ dots over $3$ goals, no dots over $4$ goals and $1$ dot over $5$ goals. How many games did the team play?'
            answer: '10'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Each dot is one game, so the number of games is the number of dots. We get $2+4+3+0+1=10$ games.'
          - problem: 'In the dot plot of the team''s goals ($2, 4, 3, 0, 1$ dots over $1$ to $5$ goals), in how many games did the team score more than $2$ goals?'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The values above $2$ are $3, 4$ and $5$ goals. Their dots add up to $3+0+1=4$ games.'
          - problem: 'A dot plot over the values $1, 2, 3, 4, 5, 6$ has $3, 0, 5, 2, 4, 1$ dots. How many of the data values are less than $4$?'
            answer: '8'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The values less than $4$ are $1, 2$ and $3$. Their dots add up to $3+0+5=8$.'
          - problem: 'A dot plot over the values $2, 3, 4, 5, 6, 7$ has $1, 5, 2, 4, 0, 3$ dots. What fraction of the data values are greater than $4$?'
            answer: '7/15'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The plot has $1+5+2+4+0+3=15$ dots in all. The values $5, 6, 7$ have $4+0+3=7$ dots, so the fraction is $7/15$.'
          - problem: 'A dot plot shows the shoe sizes of $16$ pupils: $1$ dot over size $5$, $3$ dots over size $6$, $6$ dots over size $7$, $4$ dots over size $8$ and $2$ dots over size $9$. Which size is the most common?'
            answer: '7'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The tallest stack of dots is the most common value. It has $6$ dots and lies over size $7$.'
          - problem: 'How many goals did the team score in all its games in the dot plot of $2, 4, 3, 0, 1$ dots over $1$ to $5$ goals?'
            answer: '24'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Each stack stands for several games with the same number of goals: $2\cdot1+4\cdot2+3\cdot3+0\cdot4+1\cdot5$. The total is $2+8+9+0+5=24$ goals.'
          - problem: 'A dot plot over the values $1$ through $7$ has $2, 0, 3, 1, 4, 5, 2$ dots. What fraction of the data values are at least $5$?'
            answer: '11/17'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The plot has $2+0+3+1+4+5+2=17$ dots. The values $5, 6, 7$ have $4+5+2=11$ dots, so the fraction is $11/17$.'
          - problem: 'What is the mean number of goals per game for the team in the dot plot of $2, 4, 3, 0, 1$ dots over $1$ to $5$ goals, to one decimal place?'
            answer: '2.4'
            answer_contract: {"kind": "approx", "decimals": 1}
            solution_sketch: 'The team scored $24$ goals in $10$ games. The mean is $24/10=2.4$ goals per game.'
          - problem: 'A dot plot has $3, 1, 0, 2$ dots over the values $1, 2, 3, 4$. Ken says there are $4$ data values because the plot has four positions. How many data values are there?'
            answer: '6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Ken counted the positions, but each dot is one data value. The number of values is $3+1+0+2=6$.'
        constraints: "5-7 positions with 0-5 dots each; describe the plot in words; counts, fractions, the most common value, the total of the values and a mean may be asked"
      - id: kp2
        name: "Reading stem-and-leaf plots"
        key_prerequisites: [place-value]
        step_check:
          step: 'stem $3$ with leaves $0$ and $5$ gives $30$ and $35$'
          question: 'Why do stem $3$ with leaves $0$ and $5$ stand for $30$ and $35$?'
          options:
            - 'The stem and the leaf are added to each other, so they give $3+0$ and $3+5$'
            - 'The stem is the tens digit and each leaf is a ones digit: $30$ and $35$'
            - 'Each leaf is a decimal part of the stem, so the pair would mean $3.0$ and $3.5$'
            - 'The leaves are written second, which makes them the tens digits of the values'
          answer: 'The stem is the tens digit and each leaf is a ones digit: $30$ and $35$'
          why: 'In a plot with stems in tens, each value is split into its tens digit (the stem) and its ones digit (a leaf), so joining them gives $30$ and $35$.'
        exemplars:
          - problem: 'In a stem-and-leaf plot where the stem is the tens digit, the row $4 \mid 0\ 2\ 2\ 8$ stands for which data values?'
            answer: '40, 42, 42, 48'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Each leaf is attached to the stem as a ones digit. The row stands for $40, 42, 42, 48$.'
          - problem: 'A stem-and-leaf plot of quiz scores has the rows $1 \mid 5\ 8$, $2 \mid 0\ 3\ 3\ 9$ and $3 \mid 1$, with stems in tens. What is the highest score?'
            answer: '31'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The highest score has the largest stem and the last leaf in that row. Stem $3$ with leaf $1$ gives $31$.'
          - problem: 'A stem-and-leaf plot of ages has the rows $2 \mid 1\ 4\ 7$, $3 \mid 0\ 2\ 8$ and $4 \mid 5$, with stems in tens. How old is the youngest person?'
            answer: '21'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The smallest value has the smallest stem and the first leaf in that row. Stem $2$ with leaf $1$ gives $21$.'
          - problem: 'A stem-and-leaf plot has the rows $3 \mid 1\ 4\ 8$ and $4 \mid 2$, with stems in tens. How many data values does it show?'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Each leaf is one data value. The rows have $3+1=4$ leaves, so there are $4$ values.'
          - problem: 'The ages of people in a choir are shown in a stem-and-leaf plot with the rows $2 \mid 0\ 5$, $3 \mid 1\ 4\ 4\ 8$ and $4 \mid 2\ 7$, stems in tens. How many people are older than $30$?'
            answer: '6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Stem $2$ gives $20$ and $25$, which are not older than $30$. Stem $3$ gives $31, 34, 34, 38$ and stem $4$ gives $42, 47$, so $6$ people are older than $30$.'
          - problem: 'A stem-and-leaf plot of plant heights has the rows $1 \mid 2\ 5\ 8$ and $2 \mid 0\ 4$, where $1 \mid 2$ means $1.2$ m. How tall is the tallest plant?'
            answer: '2.4'
            answer_contract: {"kind": "unit", "quantity": "length", "unit": "m", "allow_omitted": true}
            solution_sketch: 'Here the stem is whole metres and the leaf is tenths of a metre. The tallest plant is stem $2$ with leaf $4$, which is $2.4$ metres.'
          - problem: 'The race times, in seconds, are shown in a stem-and-leaf plot with the rows $5 \mid 1\ 4\ 8$, $6 \mid 0\ 3$ and $7 \mid 2$, stems in tens. By how many seconds is the slowest time longer than the fastest?'
            answer: '21'
            answer_contract: {"kind": "unit", "quantity": "time", "unit": "second", "allow_omitted": true}
            solution_sketch: 'The fastest time is $51$ seconds and the slowest is $72$ seconds. The difference is $72-51=21$ seconds.'
          - problem: 'Ana reads the row $5 \mid 2\ 6$ of a plot with stems in tens as the values $5.2$ and $5.6$. What values does the row stand for?'
            answer: '52, 56'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Ana treated the leaf as a tenth, but here the stem is the tens digit. The row stands for $52$ and $56$.'
        constraints: "stems are tens digits (one item uses whole units and tenths, stated in the problem); 2-4 rows with 1-5 leaves each; leaves listed in increasing order"
      - id: kp3
        name: "Extracting features from a plot"
        key_prerequisites: [place-value]
        step_check:
          step: 'The value $23$ appears twice'
          question: 'A stem-and-leaf plot has the rows $1 \mid 5\ 8$, $2 \mid 0\ 3\ 3\ 9$ and $3 \mid 1$. Why is $23$ the mode of the data?'
          options:
            - 'It is the first value in the row with the most leaves in the plot'
            - 'It is the largest leaf, and the largest leaf names the most common value'
            - 'It appears twice, which is more often than any other value in the list'
            - 'It lies on the biggest stem, so its row holds the most data values'
          answer: 'It appears twice, which is more often than any other value in the list'
          why: 'The mode is the value that occurs most often. Here $23$ occurs twice and every other value occurs once.'
        exemplars:
          - problem: 'The ages of the players of a team are shown in a stem-and-leaf plot with the rows $1 \mid 2\ 2\ 7$, $2 \mid 0\ 4$ and $3 \mid 5$, stems in tens. What is the most common age?'
            answer: '12'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The age $12$ appears twice, and every other age appears once. So the most common age, the mode, is $12$.'
          - problem: 'In the same plot ($1 \mid 2\ 2\ 7$, $2 \mid 0\ 4$, $3 \mid 5$), how many players are in their teens, that is, aged $10$ to $19$?'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The ages from $10$ to $19$ are the leaves on stem $1$. There are $3$ of them: $2, 2, 7$.'
          - problem: 'A stem-and-leaf plot has the rows $1 \mid 3\ 5\ 8$, $2 \mid 0\ 4$ and $3 \mid 2$, stems in tens. What is the smallest data value?'
            answer: '13'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The data list is $13, 15, 18, 20, 24, 32$. The smallest stem is $1$ and its first leaf is $3$, so the smallest value is $13$.'
          - problem: 'A dot plot has $1$ dot over $5$, $2$ dots over $7$, $1$ dot over $9$ and $1$ dot over $10$. What is the range of the data?'
            answer: '5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The smallest value is $5$ and the largest is $10$. The range is $10-5=5$.'
          - problem: 'A stem-and-leaf plot has the rows $2 \mid 1\ 4\ 7$, $3 \mid 0\ 2\ 8$ and $4 \mid 5$, stems in tens. What is the median of the data?'
            answer: '30'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The data list is $21, 24, 27, 30, 32, 38, 45$. There are $7$ values, so the median is the fourth value, $30$.'
          - problem: 'A stem-and-leaf plot has the rows $1 \mid 5\ 8$, $2 \mid 0\ 3\ 3\ 9$ and $3 \mid 1$, stems in tens. What is the range of the data?'
            answer: '16'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The smallest value is $15$ and the largest is $31$. The range is $31-15=16$.'
          - problem: 'The test scores of a class are shown in a stem-and-leaf plot with the rows $6 \mid 2\ 5\ 5\ 8$, $7 \mid 0\ 4\ 4\ 4\ 9$ and $8 \mid 1\ 3$, stems in tens. What is the most common score?'
            answer: '74'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The score $74$ appears three times and the score $65$ appears twice. So the mode is $74$.'
          - problem: 'In the same plot of test scores ($6 \mid 2\ 5\ 5\ 8$, $7 \mid 0\ 4\ 4\ 4\ 9$, $8 \mid 1\ 3$), what fraction of the scores are above $70$?'
            answer: '6/11'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'There are $4+5+2=11$ scores in all. The scores above $70$ are $74, 74, 74, 79, 81, 83$, which is $6$ scores, so the fraction is $6/11$.'
        constraints: "questions ask for a count, the minimum, the maximum, the range, the median, the most frequent value or a fraction; exactly one value repeats most when the mode is asked"
    diagnostic_exemplar:
      problem: 'A stem-and-leaf plot (stems in tens) has rows $2 \mid 1\ 4$, $3 \mid 0\ 0\ 7$. List the data values in increasing order.'
      answer: '$21, 24, 30, 30, 37$'
      solution_sketch: 'Attach each leaf to its stem; the final leaf of the bottom row gives the largest value, $37$.'
    anki_seeds:
      - front: 'In a stem-and-leaf plot with stems in tens, the row $5 \mid 2\ 6$ means...'
        back: 'The data values $52$ and $56$.'
        type: basic
      - front: 'In a dot plot, each dot represents...'
        back: 'One data value at that position.'
        type: basic

  - id: reading-statistical-graphs
    name: "Reading and Critiquing Statistical Graphs"
    core: false                # data-display branch; terminal
    difficulty: 0.3
    drill: false
    answer_kind: numeric
    expected_time_secs: 120
    prerequisites:
      - id: frequency-tables-histograms
        weight: 0.7
        key: true
      - id: dot-plots-stem-leaf
        weight: 0.4
        key: false
      - id: percentages
        weight: 0.3
        key: false
    knowledge_points:
      - id: kp1
        name: "Comparisons from bar graphs"
        key_prerequisites: [frequency-tables-histograms]
        step_check:
          step: 'Subtract the height of the Fantasy bar from the Science Fiction bar'
          question: 'A bar graph shows books read in three genres: Mystery $15$, Science Fiction $25$, Fantasy $10$. Why are two bar heights subtracted to find how many more books were read in Science Fiction than in Fantasy?'
          options:
            - 'The difference of two heights shows how much taller one bar is than the other'
            - 'Subtracting shows how many times as many books the taller bar stands for'
            - 'The two heights are added first, and subtracting is only a check of that added sum'
            - 'The shorter bar is taken out of the graph, and what is left is then the answer'
          answer: 'The difference of two heights shows how much taller one bar is than the other'
          why: 'How many more means by how much one count exceeds the other, and that is the difference of the two bar heights, $25-10=15$.'
        exemplars:
          - problem: 'A bar graph shows the number of members of three school clubs: Art $12$, Band $18$ and Chess $6$. How many more students are in Band than in Chess?'
            answer: '12'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Read the two bar heights, $18$ for Band and $6$ for Chess. The difference is $18-6=12$ students.'
          - problem: 'In the bar graph of club members (Art $12$, Band $18$, Chess $6$), what fraction of all the members are in Art?'
            answer: '1/3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The bars add up to $12+18+6=36$ members. Art has $12$ of them, so the fraction is $12/36=1/3$.'
          - problem: 'A bar graph shows pet counts: dogs $9$, cats $6$ and fish $5$. What fraction of all the pets are cats?'
            answer: '3/10'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The total number of pets is $9+6+5=20$. Cats are $6$ of them, so the fraction is $6/20=3/10$.'
          - problem: 'A bar graph shows the books sold by a shop: Fiction $14$, Nonfiction $8$ and Poetry $3$. How many books were sold altogether?'
            answer: '25'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The whole is the sum of all the bar heights. We get $14+8+3=25$ books.'
          - problem: 'A bar graph of garden plants shows roses $8$, tulips $7$ and daisies $5$. What part of all the plants are roses?'
            answer: '2/5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The plants total $8+7+5=20$. Roses are $8$ of them, so the part that is roses is $8/20$. This reduces to $2/5$.'
          - problem: 'A bar graph shows visitors at four exhibits: fossils $14$, gems $9$, space $7$ and ocean $5$. How many more visitors went to fossils than to space and ocean together?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Space and ocean together have $7+5=12$ visitors. Fossils have $14$, which is $14-12=2$ more.'
          - problem: 'A bar graph shows the apples picked on two days: Monday $30$ and Tuesday $6$. How many times as many apples were picked on Monday as on Tuesday?'
            answer: '5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'To compare the two bars as a multiple, divide one height by the other. We get $30 \div 6 = 5$ times as many.'
          - problem: 'In the bar graph of pets (dogs $9$, cats $6$, fish $5$), what percent of the pets are dogs?'
            answer: '45%'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The total is $9+6+5=20$ pets. Dogs are $9/20=0.45$ of them, which is $45\%$.'
          - problem: 'In the bar graph of club members (Art $12$, Band $18$, Chess $6$), Dev says Band has $12$ times as many members as Chess. How many times as many members does Band have?'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Dev subtracted the bar heights, but the question asks for a multiple, which needs a division. We get $18 \div 6 = 3$ times as many.'
        constraints: "3-4 categories, single- or double-digit bar heights; totals divide cleanly for fraction questions; differences, multiples, fractions and percents may be asked"
      - id: kp2
        name: "Shape of a distribution"
        key_prerequisites: [frequency-tables-histograms]
        try_first:
          problem: 'A histogram has bar heights $3, 6, 9, 4, 2$ over five equal intervals. Is the histogram symmetric?'
          answer_contract: {"kind": "label", "options": [["yes", "it is", "it is symmetric", "symmetric"], ["no", "it is not", "not symmetric", "it is not symmetric"]]}
          answer: 'no'
          reveal: 'No: for a symmetric histogram the first bar would match the last and the second would match the fourth, but $3 \ne 2$ and $6 \ne 4$. The shape of a distribution is read from where the bars are tall and where the tail runs.'
        step_check:
          step: 'The long tail points to the right, so the distribution is right-skewed.'
          question: 'Why is a histogram with a long right tail called right-skewed?'
          options:
            - 'The skew is named after the side where the tallest bar is drawn'
            - 'The skew is named after the side where the vertical axis starts'
            - 'The skew is named after the side that holds the larger number of bars'
            - 'The skew is named after the side where the longer tail stretches out'
          answer: 'The skew is named after the side where the longer tail stretches out'
          why: 'The tail is the thin, stretched-out end of the histogram, and the skew takes its name from the direction of that end.'
        exemplars:
          - problem: 'A histogram has a tall peak on the left and a long tail stretching to the right. How is the distribution skewed?'
            answer: 'right-skewed'
            answer_contract: {"kind": "label", "options": [["symmetric", "it is symmetric", "symmetrical", "bell-shaped"], ["uniform", "it is uniform", "flat", "evenly spread"], ["left-skewed", "left skewed", "skewed left", "negatively skewed", "skewed to the left", "it is left-skewed", "left", "it is skewed left"], ["right-skewed", "right skewed", "skewed right", "positively skewed", "skewed to the right", "it is right-skewed", "right", "it is skewed right"]]}
            solution_sketch: 'The skew is named after the side of the long tail, not after the peak. The tail stretches to the right, so the distribution is right-skewed.'
          - problem: 'The marks of a class on a quiz are shown in a histogram with five equal intervals. The histogram is symmetric about its middle bar. The first two bars have heights $3$ and $6$, and the middle bar has height $10$. How many students took the quiz?'
            answer: '28'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'By symmetry the last two bars have heights $6$ and $3$. The total is $3+6+10+6+3=28$ students.'
          - problem: 'A fair die is rolled $48$ times, and the results are spread evenly over the six faces, so the histogram is uniform. How many times does each face come up?'
            answer: '8'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'In a uniform histogram all six bars have the same height. Each face comes up $48 \div 6 = 8$ times.'
          - problem: 'The marks on an easy test are shown in a histogram with five equal intervals from the lowest marks to the highest. The bar heights are $1, 2, 4, 9, 14$. How is the distribution skewed?'
            answer: 'left-skewed'
            answer_contract: {"kind": "label", "options": [["symmetric", "it is symmetric", "symmetrical", "bell-shaped"], ["uniform", "it is uniform", "flat", "evenly spread"], ["left-skewed", "left skewed", "skewed left", "negatively skewed", "skewed to the left", "it is left-skewed", "left", "it is skewed left"], ["right-skewed", "right skewed", "skewed right", "positively skewed", "skewed to the right", "it is right-skewed", "right", "it is skewed right"]]}
            solution_sketch: 'The tallest bars are at the high marks, and the tail of short bars stretches to the low marks on the left. So the distribution is left-skewed.'
          - problem: 'A histogram of the waiting times of $31$ customers has five equal intervals with bar heights $14, 9, 5, 2, 1$. What fraction of the customers are in the first two intervals?'
            answer: '23/31'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The first two bars hold $14+9=23$ customers. The bars add up to $14+9+5+2+1=31$, so the fraction is $23/31$.'
          - problem: 'A histogram of $100$ shoppers'' ages has nine equal intervals and is symmetric about its tallest bar, the fifth one, which holds $20$ shoppers. How many shoppers are in the first four intervals together?'
            answer: '40'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The fifth bar holds $20$, so the other eight bars hold $100-20=80$ shoppers. By symmetry the first four bars hold half of these, $80 \div 2 = 40$.'
        constraints: "shapes limited to symmetric, uniform, left-skewed, right-skewed; describe histograms in words; shape items may be verdicts or counts that use the shape"
      - id: kp3
        name: "Spotting misleading graphs"
        key_prerequisites: [frequency-tables-histograms]
        step_check:
          step: 'the drawn height is the value minus the axis start'
          question: 'Why is the drawn height of a bar for $52$ equal to $52-40$ when the axis starts at $40$?'
          options:
            - 'The axis start is always added to the value, so $40$ is taken as one unit'
            - 'The bar is drawn from the axis start up, so the part below $40$ is cut off'
            - 'The drawn bar must be shorter than the value, so $40$ is taken away from it'
            - 'The bar height is the value divided by the axis start, that is, $52 \div 40$'
          answer: 'The bar is drawn from the axis start up, so the part below $40$ is cut off'
          why: 'A bar starts at the bottom of the axis. If the axis begins at $40$, only the part of the value above $40$ is drawn.'
        exemplars:
          - problem: 'A bar chart''s vertical axis starts at $50$ instead of $0$. What effect does this have on how the bars look?'
            answer: 'exaggerates the differences'
            answer_contract: {"kind": "label", "options": [["exaggerates the differences", "it exaggerates the differences between the bars", "it exaggerates differences", "exaggerates", "it makes the differences look bigger", "makes differences look bigger", "the differences look larger", "differences appear larger"], ["makes the bars look more equal", "it makes the bars look more equal", "makes differences look smaller", "it makes differences look smaller", "differences look smaller"], ["reverses the order of the bars", "it reverses the order of the bars", "reverses the order"], ["has no effect on the bars", "it has no effect on the bars", "no effect", "it has no effect", "has no effect", "nothing"]]}
            solution_sketch: 'A truncated axis removes the common base of the bars. Small differences between the values then look large.'
          - problem: 'A bar chart''s vertical axis starts at $40$ instead of $0$. A bar represents the value $52$. How many units tall is the drawn bar?'
            answer: '12'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The bar is drawn only from the start of the axis upward. Its drawn height is $52-40=12$ units.'
          - problem: 'A company''s sales were $60$ thousand in one year and $63$ thousand in the next. On a bar chart whose axis starts at $0$, how many times as tall as the first bar is the second bar?'
            answer: '21/20'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'On an axis that starts at $0$, the bar heights are in the same ratio as the values. So the ratio is $63/60=21/20=1.05$.'
          - problem: 'A bar chart''s vertical axis starts at $60$ instead of $0$. Two bars represent the values $64$ and $70$. How many times as tall as the $64$ bar does the $70$ bar look?'
            answer: '5/2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The drawn heights are $70-60=10$ and $64-60=4$. The ratio of the drawn heights is $10/4=5/2$.'
          - problem: 'A histogram uses the intervals $0$-$10$, $10$-$20$ and $20$-$50$, and the bar heights are $4$, $5$ and $5$ observations per unit. How many times as many observations are in the $20$-$50$ interval as in the $0$-$10$ interval?'
            answer: '15/4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The count is height times width. The interval $20$-$50$ holds $5 \cdot 30 = 150$ and the interval $0$-$10$ holds $4 \cdot 10 = 40$, so the ratio is $150/40=15/4$.'
          - problem: 'A bar chart shows the revenue of four regions, but its scale has no numbers and no unit. What is wrong with the chart?'
            answer: 'missing axis labels'
            answer_contract: {"kind": "label", "options": [["missing axis labels", "no axis labels", "the scale has no labels", "missing labels", "no labels", "no numbers or units", "it has no axis labels", "the axis has no labels"], ["truncated vertical axis", "the axis is truncated", "axis does not start at zero", "truncated axis", "the vertical axis is truncated"], ["unequal intervals", "the intervals are unequal"], ["reversed order of bars", "the bars are in reverse order"]]}
            solution_sketch: 'A scale with no numbers and no unit gives no values to read. The flaw is the missing axis labels, since nothing is cut off and the bars are in order.'
          - problem: 'On a bar chart the vertical axis starts at $70$. A company''s profit is $80$ one year and $88$ the next. By what percent taller than the first bar is the second bar drawn?'
            answer: '80%'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The drawn heights are $80-70=10$ and $88-70=18$. The second bar is $8/10=0.8$ taller, which is $80\%$, although the real profit rose only $10\%$.'
          - problem: 'On a bar chart whose axis starts at $40$, the bars represent $52$ and $64$. Priya says the second bar is drawn $64/52$ times as tall as the first. How many times as tall is it drawn?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Priya forgot to subtract the start of the axis. The drawn heights are $52-40=12$ and $64-40=24$, so the ratio is $2$.'
        constraints: "flaws limited to truncated axes, unequal intervals, or missing labels; one flaw per problem; ratios of drawn heights, percents and flaw verdicts may be asked"
    diagnostic_exemplar:
      problem: 'A histogram of commute times has bar heights $9, 6, 3, 1$ over $0$-$14$, $15$-$29$, $30$-$44$, $45$-$59$ minutes. How many commutes are $30$ minutes or longer?'
      answer: '4'
      solution_sketch: 'The bars from $30$ minutes up have heights $3$ and $1$: $3 + 1 = 4$.'
    anki_seeds:
      - front: 'A distribution with a long tail to the right is called...'
        back: 'Right-skewed (positively skewed) — the skew names the tail side.'
        type: basic
      - front: 'A bar chart whose vertical axis does not start at 0...'
        back: 'Exaggerates the differences between bars (a truncated axis).'
        type: basic

  - id: mean-of-a-data-set
    name: "The Mean of a Data Set"
    core: true
    difficulty: 0.2
    drill: false
    answer_kind: numeric
    expected_time_secs: 90
    prerequisites:
      - id: decimal-operations
        weight: 0.6
        key: true
      - id: long-division
        weight: 0.4
        key: false
    knowledge_points:
      - id: kp1
        name: "Computing the mean"
        key_prerequisites: [decimal-operations, long-division]
        step_check:
          step: 'Divide: $32 \div 4 = 8$'
          question: 'Why is the sum $32$ divided by $4$ to find the mean?'
          options:
            - 'Dividing by $4$ finds the middle value of the list'
            - 'The total is shared equally among the $4$ values'
            - 'Four is the largest whole number that divides $32$'
            - 'Dividing by $4$ gives the most common value'
          answer: 'The total is shared equally among the $4$ values'
          why: 'The mean is the fair-share value: the total $32$ spread equally over $4$ values gives $8$ each; the middle value is the median and the most common value is the mode.'
        exemplars:
          - problem: 'Find the mean of $4, 7, 9, 12$.'
            answer: '8'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The sum is $4 + 7 + 9 + 12 = 32$. There are $4$ values, so the mean is $32 \div 4 = 8$.'
          - problem: 'Maya''s quiz scores this term were $5, 7, 8, 10$ and $5$. What was her mean quiz score?'
            answer: '7'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The five scores add up to $5 + 7 + 8 + 10 + 5 = 35$. Dividing by the $5$ scores gives a mean of $7$.'
          - problem: 'A delivery driver made $5, 8, 9, 11$ and $12$ stops on five days. What was the mean number of stops per day?'
            answer: '9'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The stops add up to $5 + 8 + 9 + 11 + 12 = 45$ over $5$ days. Sharing them equally gives $45 \div 5 = 9$ stops per day.'
          - problem: 'Five friends pool their stickers: they have $8, 12, 15, 9$ and $11$. If they share all the stickers equally, how many does each friend get?'
            answer: '11'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Together they have $8 + 12 + 15 + 9 + 11 = 55$ stickers. Sharing among $5$ friends gives $55 \div 5 = 11$ stickers each.'
          - problem: 'Find the mean of $6, 8, 10, 14, 12$.'
            answer: '10'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The sum is $6 + 8 + 10 + 14 + 12 = 50$. Dividing by the $5$ values gives a mean of $10$.'
          - problem: 'The noon temperatures on four days were $12, 18, 9$ and $17$ degrees Celsius. What was the mean noon temperature?'
            answer: '14'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The temperatures add up to $12 + 18 + 9 + 17 = 56$. Dividing by the $4$ days gives a mean of $14$ degrees.'
          - problem: 'Sam finds the mean of $3, 5, 5, 8, 9$ by picking the middle value, $5$. What is the correct mean?'
            answer: '6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The middle value is the median, not the mean. The mean is the sum $3 + 5 + 5 + 8 + 9 = 30$ divided by $5$, which is $6$.'
        constraints: "4-6 small positive integers; sum divides evenly by n"
      - id: kp2
        name: "Means with decimal results"
        key_prerequisites: [decimal-operations]
        step_check:
          step: 'Divide: $21 \div 4 = 5.25$'
          question: 'Why is the mean $5.25$ and not a whole number?'
          options:
            - 'A mean must always be larger than every data value'
            - 'The decimal appears because one value was counted twice'
            - 'A mean is rounded up whenever the count is even'
            - 'The sum $21$ does not split into $4$ equal whole parts'
          answer: 'The sum $21$ does not split into $4$ equal whole parts'
          why: 'A mean is a fair share, and $21$ shared among $4$ gives $5.25$ each; it does not have to be one of the data values or a whole number.'
        exemplars:
          - problem: 'Find the mean of $3, 4, 6, 8$.'
            answer: '5.25'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The sum is $3 + 4 + 6 + 8 = 21$. Dividing by $4$ gives $21 \div 4 = 5.25$.'
          - problem: 'A runner records the times $12.5, 13.2, 12.8, 13.5$ and $12.0$ seconds in five races. What is her mean time?'
            answer: '12.8'
            answer_contract: {"kind": "unit", "quantity": "time", "unit": "s", "allow_omitted": true}
            solution_sketch: 'The times add up to $12.5 + 13.2 + 12.8 + 13.5 + 12.0 = 64$ seconds. Dividing by the $5$ races gives a mean of $12.8$ seconds.'
          - problem: 'A shop takes $105, 98, 112$ and $90$ dollars on four days. What are its mean daily takings?'
            answer: '101.25'
            answer_contract: {"kind": "unit", "quantity": "dollar", "unit": "dollar", "allow_omitted": true}
            solution_sketch: 'The takings add up to $105 + 98 + 112 + 90 = 405$ dollars. Dividing by the $4$ days gives $405 \div 4 = 101.25$ dollars.'
          - problem: 'Find the mean of $1, 2, 2, 5$.'
            answer: '2.5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The sum is $1 + 2 + 2 + 5 = 10$. Dividing by $4$ gives $10 \div 4 = 2.5$.'
          - problem: 'Four friends spent $23, 14, 20$ and $9$ dollars on a day out. If they had split the total cost equally, how much would each have paid?'
            answer: '16.5'
            answer_contract: {"kind": "unit", "quantity": "dollar", "unit": "dollar", "allow_omitted": true}
            solution_sketch: 'The total cost is $23 + 14 + 20 + 9 = 66$ dollars. Splitting it among $4$ friends gives $66 \div 4 = 16.5$ dollars each.'
          - problem: 'Five cyclists rode $12.4, 15.1, 9.8, 14.3$ and $11.2$ kilometres. Find their mean distance to one decimal place.'
            answer: '12.6'
            answer_contract: {"kind": "approx", "decimals": 1}
            solution_sketch: 'The distances add up to $12.4 + 15.1 + 9.8 + 14.3 + 11.2 = 62.8$. Dividing by $5$ gives $12.56$, which is $12.6$ to one decimal place.'
          - problem: 'Find the mean of $4, 6, 7, 10$.'
            answer: '6.75'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The sum is $4 + 6 + 7 + 10 = 27$. Dividing by $4$ gives $27 \div 4 = 6.75$.'
          - problem: 'A baker sold $14, 9, 17, 12, 11$ and $13$ loaves on six mornings. Find the mean number of loaves sold to one decimal place.'
            answer: '12.7'
            answer_contract: {"kind": "approx", "decimals": 1}
            solution_sketch: 'The sales add up to $14 + 9 + 17 + 12 + 11 + 13 = 76$. Dividing by $6$ gives $12.666\ldots$, which is $12.7$ to one decimal place.'
        constraints: "4 or 5 values; mean terminates after at most two decimal places"
      - id: kp3
        name: "Using the mean to find a total or missing value"
        key_prerequisites: [decimal-operations]
        step_check:
          step: 'Total needed: mean $\times$ count $= 7 \times 4 = 28$'
          question: 'Why is the total of all four marks $7 \times 4$?'
          options:
            - 'Multiplying the mean by the count undoes the division'
            - 'Each of the four marks must be multiplied by the mean of seven'
            - 'Seven and four are added to show how many marks are missing'
            - 'The total of the marks is always the mean times ten'
          answer: 'Multiplying the mean by the count undoes the division'
          why: 'The mean is the total divided by the count, so the total is the mean times the count: $4$ marks with mean $7$ must add up to $28$.'
        try_first:
          problem: 'The mean of four numbers is $10$. Three of them are $8, 12$ and $11$. What is the fourth number?'
          answer_contract: {"kind": "exact"}
          answer: '9'
          reveal: 'Four numbers with mean $10$ add up to $40$, and the three known numbers add up to $31$, so the fourth is $9$. A mean fixes the total, and the total tells what is missing.'
        exemplars:
          - problem: 'The mean of $5$ numbers is $12$. What is their sum?'
            answer: '60'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The mean is the sum divided by the count, so the sum is the mean times the count. Here $12 \times 5 = 60$.'
          - problem: 'A basketball player averaged $14$ points over $5$ games. How many points did she score in total?'
            answer: '70'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The mean is the total divided by the number of games. So the total is $14 \times 5 = 70$ points.'
          - problem: 'Four test marks (out of $10$) have mean $7$. Three of them are $6, 9$ and $5$. What is the fourth mark?'
            answer: '8'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Four marks with mean $7$ add up to $4 \times 7 = 28$. The known marks add up to $20$, so the fourth mark is $28 - 20 = 8$.'
          - problem: 'The mean number of stamps in $4$ boxes is $25$. Three boxes hold $20, 30$ and $22$ stamps. How many stamps are in the fourth box?'
            answer: '28'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Four boxes with mean $25$ hold $4 \times 25 = 100$ stamps in all. The three known boxes hold $72$, so the fourth holds $100 - 72 = 28$.'
          - problem: 'The $8$ backpacks on a school trip weigh $96$ kg in total. What is the mean weight of a backpack?'
            answer: '12'
            answer_contract: {"kind": "unit", "quantity": "mass", "unit": "kg", "allow_omitted": true}
            solution_sketch: 'The mean is the total shared among the backpacks. Here $96 \div 8 = 12$ kg.'
          - problem: 'Ana has scored $6, 8, 7$ and $9$ (out of $10$) on four tests. What mark on a fifth test gives her a mean of $8$?'
            answer: '10'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Five tests with mean $8$ need a total of $5 \times 8 = 40$. Her four marks add up to $30$, so she needs $40 - 30 = 10$ on the fifth test.'
          - problem: 'Lena says that if the mean of $6$ numbers is $9$, then their sum is $15$ because $6 + 9 = 15$. What is the correct sum?'
            answer: '54'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The sum is the mean times the count, not the mean plus the count. So the sum is $6 \times 9 = 54$.'
        constraints: "counts of 4-6; all totals and missing values are whole numbers"
    diagnostic_exemplar:
      problem: 'Four test marks (out of $10$) have mean $8$. Three of them are $9, 6, 10$. Find the fourth mark.'
      answer: '7'
      solution_sketch: 'Total $= 4 \cdot 8 = 32$; $32 - (9 + 6 + 10) = 7$.'
    anki_seeds:
      - front: 'Mean of a data set $=$ ?'
        back: '$\frac{\text{sum of the values}}{\text{number of values}}$.'
        type: basic
      - front: 'If a data set of $n$ values has mean $\bar{x}$, its sum is...'
        back: '$n \bar{x}$ — mean times count.'
        type: basic

  - id: median-and-mode
    name: "Median and Mode"
    core: true
    difficulty: 0.2
    drill: false
    answer_kind: numeric
    expected_time_secs: 90
    prerequisites:
      - id: comparing-ordering-whole-numbers
        weight: 0.6
        key: true
      - id: decimal-operations
        weight: 0.4
        key: false
    knowledge_points:
      - id: kp1
        name: "Median of an odd-count list"
        key_prerequisites: [comparing-ordering-whole-numbers]
        step_check:
          step: 'There are $5$ values, so the median is the $3$rd (middle) one'
          question: 'Why must the values be sorted before the middle one is picked?'
          options:
            - 'Sorting makes the middle value larger than the mean'
            - 'The middle of the list as written is always the mode'
            - 'The median is defined by position in the ordered list'
            - 'The median is the value halfway between the largest and the smallest'
          answer: 'The median is defined by position in the ordered list'
          why: 'The median is the value with as many data values below it as above it; that is only true once the list is in order, and it is not the same as the midrange or the mode.'
        exemplars:
          - problem: 'Find the median of $12, 3, 7, 9, 5$.'
            answer: '7'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Sorted, the values are $3, 5, 7, 9, 12$. There are five of them, so the median is the middle one, $7$.'
          - problem: 'On five quizzes a student scored $18, 7, 15, 11$ and $13$. What was her median score?'
            answer: '13'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'In order the scores are $7, 11, 13, 15, 18$. The third of the five scores is the median, which is $13$.'
          - problem: 'Find the median of $14, 3, 9, 21, 6, 12, 17$.'
            answer: '12'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'In order the values are $3, 6, 9, 12, 14, 17, 21$. There are seven values, so the median is the fourth one, $12$.'
          - problem: 'The sale prices of seven houses on a street, in thousands of dollars, were $210, 185, 240, 198, 1200, 205$ and $220$. What was the median price?'
            answer: '210'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'In order the prices are $185, 198, 205, 210, 220, 240, 1200$. The fourth of the seven is the median, $210$, and the very large price does not move it.'
          - problem: 'A list of $11$ values is written in order from smallest to largest. In which position is the median?'
            answer: '6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The median has the same number of values on each side. With $11$ values, five lie below and five lie above, so the median is in position $6$.'
          - problem: 'Sam finds the median of $7, 1, 9, 4, 2$ by taking the middle number as written, $9$. What is the correct median?'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The list must be sorted first: $1, 2, 4, 7, 9$. The middle value of the sorted list is $4$.'
          - problem: 'The heights of five seedlings are $14, 9, 11, 16$ and $12$ cm. What is the median height?'
            answer: '12'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'In order the heights are $9, 11, 12, 14, 16$. The middle one is $12$ cm.'
        constraints: "3-7 values given unsorted, odd count"
      - id: kp2
        name: "Median of an even-count list"
        key_prerequisites: [comparing-ordering-whole-numbers, decimal-operations]
        step_check:
          step: 'Average them: $(7 + 9)/2 = 16/2 = 8$'
          question: 'Why are the two middle values $7$ and $9$ averaged?'
          options:
            - 'Averaging the middle pair gives the mean of all six values'
            - 'A median must be a number that is not in the data'
            - 'Averaging drops the smallest and largest value first'
            - 'The $6$ values have no single middle one to pick'
          answer: 'The $6$ values have no single middle one to pick'
          why: 'With an even count the middle falls between two values, so the median is halfway between them; this is not the mean of the whole list.'
        try_first:
          problem: 'Find the median of $2, 6, 8, 12$.'
          answer_contract: {"kind": "exact"}
          answer: '7'
          reveal: 'With four values, the middle falls between $6$ and $8$. The number halfway between them, $7$, has two values on each side.'
        exemplars:
          - problem: 'Find the median of $3, 9, 5, 7, 2, 8$.'
            answer: '6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'In order the values are $2, 3, 5, 7, 8, 9$. The middle pair is $5$ and $7$, and the number halfway between them is $6$.'
          - problem: 'The waiting times of six customers were $12, 4, 9, 1, 6$ and $8$ minutes. What was the median waiting time?'
            answer: '7'
            answer_contract: {"kind": "unit", "quantity": "time", "unit": "min", "allow_omitted": true}
            solution_sketch: 'In order the times are $1, 4, 6, 8, 9, 12$. The middle pair is $6$ and $8$, so the median is $7$ minutes.'
          - problem: 'Find the median of $4, 6, 9, 10$.'
            answer: '7.5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The values are already in order. The middle pair is $6$ and $9$, and $(6 + 9) \div 2 = 7.5$.'
          - problem: 'Six players scored $10, 2, 17, 8, 13$ and $5$ points in a game. What is the median score?'
            answer: '9'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'In order the scores are $2, 5, 8, 10, 13, 17$. The middle pair is $8$ and $10$, so the median is $9$.'
          - problem: 'Five students scored $14, 18, 12, 16$ and $15$ on a test. A sixth student then scored $20$. What is the median of all six scores?'
            answer: '15.5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'In order the six scores are $12, 14, 15, 16, 18, 20$. The middle pair is $15$ and $16$, so the median is $15.5$.'
          - problem: 'Tom says the median of $2, 4, 7, 10$ is $7$ because it is the third value. What is the correct median?'
            answer: '5.5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'With four values the median lies between the second and third values. So it is $(4 + 7) \div 2 = 5.5$.'
          - problem: 'Find the median of $7, 2, 10, 5$.'
            answer: '6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'In order the values are $2, 5, 7, 10$. The middle pair is $5$ and $7$, so the median is $6$.'
        constraints: "4-8 values given unsorted, even count; the two middle values average to an integer or a .5 value"
      - id: kp3
        name: "Mode (including no mode and two modes)"
        key_prerequisites: [comparing-ordering-whole-numbers]
        step_check:
          step: 'Identify the values with the highest frequency: $5$ and $7$'
          question: 'Why are both $5$ and $7$ modes of $3, 5, 5, 7, 7, 9$?'
          options:
            - 'Each appears twice and no value appears more often'
            - 'Any value that appears more than once is a mode'
            - 'They are the two values nearest the middle of the list'
            - 'A data set always has two modes when its count is even'
          answer: 'Each appears twice and no value appears more often'
          why: 'The mode is whichever value has the highest frequency, and a tie for the highest frequency gives two modes; a value that repeats but is beaten by another is not a mode.'
        exemplars:
          - problem: 'Find the mode of $2, 4, 4, 7, 9$.'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The value $4$ appears twice and every other value appears once. So the mode is $4$.'
          - problem: 'The shoe sizes of nine pupils are $6, 7, 5, 7, 8, 7, 6, 9$ and $5$. Which size is the mode?'
            answer: '7'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Size $7$ appears three times, sizes $5$ and $6$ appear twice and the others once. The mode is size $7$.'
          - problem: 'Find the mode, or modes, of $1, 2, 2, 5, 5, 9$.'
            answer: '2, 5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The values $2$ and $5$ each appear twice, more often than any other value. So the data has two modes, $2$ and $5$.'
          - problem: 'Does the data $3, 6, 8, 11$ have a mode?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "yes, it does", "it does", "there is a mode", "it has a mode"], ["no", "no, it does not", "it does not", "there is no mode", "no mode", "it has no mode", "none"]]}
            solution_sketch: 'Every value appears exactly once, so no value is more frequent than the others. The data has no mode.'
          - problem: 'A cafe counts its customers each hour: $14, 9, 14, 12, 9, 14$ and $11$. What is the mode?'
            answer: '14'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The value $14$ appears three times, $9$ appears twice and the others once. So the mode is $14$.'
          - problem: 'Find the mode of $5, 3, 7, 3, 8, 3$.'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The value $3$ appears three times and no other value appears more than once. So the mode is $3$.'
          - problem: 'A team scored $2, 0, 1, 2, 3, 2, 0$ and $1$ goals in eight matches. What is the mode?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The value $2$ appears three times, while $0$ and $1$ appear twice. So the mode is $2$ goals.'
          - problem: 'What are the modes of $6, 2, 6, 8, 2, 5$?'
            answer: '2, 6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The values $6$ and $2$ each appear twice, while $8$ and $5$ appear once. So the modes are $2$ and $6$.'
        constraints: "5-8 values; at most two modes; modes given as a set, or a count of 0 when nothing repeats"
    diagnostic_exemplar:
      problem: 'Find the median of $8, 3, 5, 3, 9, 2$.'
      answer: '4'
      solution_sketch: 'Sorted: $2, 3, 3, 5, 8, 9$. There are six values, so the median is the average of the middle pair: $(3+5)/2 = 4$.'
    anki_seeds:
      - front: 'For an even number of sorted values, the median is...'
        back: 'The average of the two middle values.'
        type: basic
      - front: 'The mode of a data set is...'
        back: 'The most frequent value (there may be several modes, or none if nothing repeats).'
        type: basic

  - id: weighted-averages
    name: "Weighted Averages"
    core: true
    difficulty: 0.3
    drill: false
    answer_kind: numeric
    expected_time_secs: 120
    prerequisites:
      - id: mean-of-a-data-set
        weight: 0.8
        key: true
      - id: decimal-operations
        weight: 0.4
        key: false
      - id: percentages
        weight: 0.4
        key: false
    knowledge_points:
      - id: kp1
        name: "Weighted mean with counts"
        key_prerequisites: [mean-of-a-data-set]
        step_check:
          step: 'Grand total: $120 + 20 = 140$ over $15 + 5 = 20$ students'
          question: 'Why is the combined mean $140 \div 20$ and not $(8 + 4) \div 2$?'
          options:
            - 'The marks of the smaller group are left out of the sum'
            - 'The two means must be added before they are shared'
            - 'Each student counts once, so the larger group weighs more'
            - 'Dividing by $2$ is only allowed when the means are whole numbers'
          answer: 'Each student counts once, so the larger group weighs more'
          why: 'The combined mean is the total of all marks over the total number of students; averaging $8$ and $4$ would treat the group of $15$ and the group of $5$ as equal in size.'
        exemplars:
          - problem: 'Three tests score $9$ each and two tests score $4$ each (out of $10$). What is the mean of the five marks?'
            answer: '7'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The marks add up to $3 \times 9 + 2 \times 4 = 35$. Dividing by $5$ marks gives a mean of $7$.'
          - problem: 'A class of $10$ students averaged $6$ (out of $10$) on a quiz and a class of $20$ students averaged $9$. What is the mean mark of all $30$ students?'
            answer: '8'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The first class earned $10 \times 6 = 60$ marks and the second earned $20 \times 9 = 180$. Together that is $240$ marks for $30$ students, a mean of $8$.'
          - problem: 'One group of $15$ students averages $8$ and another group of $5$ students averages $4$ (out of $10$). What is the combined mean?'
            answer: '7'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The totals are $15 \times 8 = 120$ and $5 \times 4 = 20$, which add to $140$. Dividing by $20$ students gives $7$.'
          - problem: 'A shop sells $3$ kg of apples at $2$ dollars per kg and $2$ kg of pears at $4$ dollars per kg. What is the mean price per kilogram of the $5$ kg of fruit?'
            answer: '2.8'
            answer_contract: {"kind": "unit", "quantity": "dollar", "unit": "dollar", "allow_omitted": true}
            solution_sketch: 'The apples cost $3 \times 2 = 6$ dollars and the pears cost $2 \times 4 = 8$ dollars. Together $14$ dollars buys $5$ kg, so the mean price is $14 \div 5 = 2.8$ dollars per kilogram.'
          - problem: 'Sam says that when $10$ students average $6$ and $30$ students average $10$, the combined mean is $(6 + 10) \div 2 = 8$. What is the correct combined mean?'
            answer: '9'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The groups differ in size, so the larger group counts more. The totals are $60$ and $300$, giving $360$ marks for $40$ students, a mean of $9$.'
          - problem: 'A class has $5$ students averaging $4$, $5$ students averaging $6$ and $10$ students averaging $5$ (out of $10$). What is the mean mark of the whole class?'
            answer: '5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The totals are $20, 30$ and $50$, which add to $100$ marks. Dividing by the $20$ students gives a mean of $5$.'
          - problem: 'A farmer picks $4$ crates with a mean weight of $18$ kg and $6$ crates with a mean weight of $13$ kg. What is the mean weight of all $10$ crates?'
            answer: '15'
            answer_contract: {"kind": "unit", "quantity": "mass", "unit": "kg", "allow_omitted": true}
            solution_sketch: 'The first crates weigh $4 \times 18 = 72$ kg and the others $6 \times 13 = 78$ kg. Together that is $150$ kg for $10$ crates, a mean of $15$ kg.'
          - problem: 'A quiz has $8$ students averaging $3$ (out of $10$) and $12$ students averaging $8$. What is the combined mean?'
            answer: '6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The totals are $8 \times 3 = 24$ and $12 \times 8 = 96$, which add to $120$. Dividing by $20$ students gives $6$.'
        constraints: "2-3 groups; group sizes and means are integers; the combined mean is an integer; marks on the 0-10 scale"
      - id: kp2
        name: "Weighted mean with percent weights"
        key_prerequisites: [mean-of-a-data-set, percentages]
        step_check:
          step: 'Convert the percents to decimals: $30\% = 0.3$ and $70\% = 0.7$'
          question: 'Why are the percents turned into $0.3$ and $0.7$ before they multiply the marks?'
          options:
            - 'Decimals are needed because the marks are out of $10$'
            - 'A percent is a hundredth part, so $30\%$ is $0.3$'
            - 'Multiplying by $30$ and $70$ would give the same mark'
            - 'The weights must be smaller than every mark'
          answer: 'A percent is a hundredth part, so $30\%$ is $0.3$'
          why: 'Weights of $30\%$ and $70\%$ are the shares $0.3$ and $0.7$ of the whole; shares that add to $1$ keep the result on the same scale as the marks.'
        exemplars:
          - problem: 'Homework counts $20\%$ and the exam counts $80\%$ of a course mark. The homework mark is $10$ and the exam mark is $7.5$ (out of $10$). What is the course mark?'
            answer: '8'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The homework adds $0.2 \times 10 = 2$ and the exam adds $0.8 \times 7.5 = 6$. The course mark is $2 + 6 = 8$.'
          - problem: 'A course mark has a project worth $30\%$ and a final worth $70\%$. The project mark is $6$ and the final mark is $9$ (out of $10$). What is the course mark?'
            answer: '8.1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The project adds $0.3 \times 6 = 1.8$ and the final adds $0.7 \times 9 = 6.3$. The course mark is $1.8 + 6.3 = 8.1$.'
          - problem: 'Marks of $7, 9$ and $4$ (out of $10$) carry the weights $0.5, 0.3$ and $0.2$. What is the weighted average?'
            answer: '7'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The weighted contributions are $3.5, 2.7$ and $0.8$. They add up to $7$.'
          - problem: 'The midterm and the final each count $50\%$ of a course mark. The midterm mark is $8$ and the final mark is $7$ (out of $10$). What is the course mark?'
            answer: '7.5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Each exam contributes half of its mark, $4$ and $3.5$. The course mark is $4 + 3.5 = 7.5$.'
          - problem: 'A project grade has three parts: planning counts $30\%$, building $50\%$ and the write-up $20\%$. The marks out of $10$ are $8$ for planning, $10$ for building and $8$ for the write-up. What is the project grade?'
            answer: '9'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Planning adds $0.3 \times 8 = 2.4$, building adds $0.5 \times 10 = 5$ and the write-up adds $0.2 \times 8 = 1.6$. The project grade is $2.4 + 5 + 1.6 = 9$.'
          - problem: 'A course mark uses coursework for $70\%$ and a final exam for $30\%$. The coursework mark is $10$ and the exam mark is $5$ (out of $10$). What is the course mark?'
            answer: '8.5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Coursework adds $0.7 \times 10 = 7$ and the exam adds $0.3 \times 5 = 1.5$. The course mark is $7 + 1.5 = 8.5$.'
          - problem: 'Ben scored $10$ for homework, which counts $20\%$, and $5$ for the exam, which counts $80\%$. He says his course mark is the mean of $10$ and $5$, which is $7.5$. What is the correct course mark?'
            answer: '6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The weights differ, so the marks cannot be averaged equally. The course mark is $0.2 \times 10 + 0.8 \times 5 = 2 + 4 = 6$.'
          - problem: 'A juice blend is $60\%$ apple juice at $2$ dollars per litre and $40\%$ mango juice at $5$ dollars per litre. What does a litre of the blend cost?'
            answer: '3.2'
            answer_contract: {"kind": "unit", "quantity": "dollar", "unit": "dollar", "allow_omitted": true}
            solution_sketch: 'Apple contributes $0.6 \times 2 = 1.2$ dollars and mango contributes $0.4 \times 5 = 2$ dollars. A litre of the blend costs $1.2 + 2 = 3.2$ dollars.'
        constraints: "2-3 weights summing to 1 (or 100%); weights in steps of 0.1; marks on the 0-10 scale; results integers or ending in .5"
      - id: kp3
        name: "Solving for an unknown score"
        key_prerequisites: [mean-of-a-data-set]
        step_check:
          step: 'Set up the equation: $0.7 \cdot 8 + 0.3x = 8.4$'
          question: 'Why is the unknown midterm mark $x$ multiplied by $0.3$ in this equation?'
          options:
            - 'The midterm mark is always out of $3$'
            - 'The target of $8.4$ must be split into tenths'
            - 'The average of $8$ is made smaller by $0.3$'
            - 'The midterm is worth $30\%$ of the mark'
          answer: 'The midterm is worth $30\%$ of the mark'
          why: 'Every mark enters the overall mark multiplied by its weight, so the midterm, worth $30\%$, enters as $0.3x$ beside the current average $0.7 \cdot 8$.'
        try_first:
          problem: 'A course mark is half homework and half exam. The homework mark is $6$ (out of $10$). What exam mark gives an overall mark of $7$?'
          answer_contract: {"kind": "exact"}
          answer: '8'
          reveal: 'Half of $6$ is $3$, so the exam must add $4$, which is half of $8$. The unknown mark is found by writing the weighted average as an equation and solving it.'
        exemplars:
          - problem: 'The final exam counts $40\%$ of a course mark and the current average of $7$ (out of $10$) counts $60\%$. What exam mark gives an overall mark of $7.8$?'
            answer: '9'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Write $0.6 \times 7 + 0.4x = 7.8$. Then $0.4x = 7.8 - 4.2 = 3.6$, so $x = 9$.'
          - problem: 'Coursework counts $40\%$ of a final mark and the exam counts $60\%$. The coursework mark is $5$ out of $10$. What exam mark gives an overall mark of $6.8$?'
            answer: '8'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Write $0.4 \times 5 + 0.6x = 6.8$. Then $0.6x = 6.8 - 2 = 4.8$, so $x = 8$.'
          - problem: 'Homework counts $50\%$ of a course mark with an average of $6$ (out of $10$), and the exam counts the other $50\%$. What exam mark gives an overall mark of $8$?'
            answer: '10'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Write $0.5 \times 6 + 0.5x = 8$. Then $0.5x = 8 - 3 = 5$, so $x = 10$.'
          - problem: 'Two quizzes and a project count in the ratio $1:1:2$. The quiz marks are $6$ and $8$ (out of $10$). What project mark gives a weighted average of $8$?'
            answer: '9'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Write $(6 + 8 + 2p) \div 4 = 8$. Then $14 + 2p = 32$, so $2p = 18$ and $p = 9$.'
          - problem: 'Three quizzes and a project count in the ratio $1:1:1:2$. The quiz marks are $7, 9$ and $8$ (out of $10$). What project mark gives a weighted average of $8$?'
            answer: '8'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Write $(7 + 9 + 8 + 2p) \div 5 = 8$. Then $24 + 2p = 40$, so $2p = 16$ and $p = 8$.'
          - problem: 'A course mark combines a quiz worth $1$ part, a project worth $2$ parts and an exam worth $3$ parts. The quiz mark is $6$ and the project mark is $9$ (out of $10$). What exam mark gives an overall mark of $7$?'
            answer: '6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Write $(6 + 18 + 3x) \div 6 = 7$. Then $24 + 3x = 42$, so $3x = 18$ and $x = 6$.'
          - problem: 'The midterm counts $25\%$ of a course mark and the rest of the course, with an average of $6$ (out of $10$), counts $75\%$. What midterm mark gives an overall mark of $6.5$?'
            answer: '8'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Write $0.75 \times 6 + 0.25x = 6.5$. Then $0.25x = 6.5 - 4.5 = 2$, so $x = 8$.'
        constraints: "one unknown; weights given as percents or small integer multiples; marks on the 0-10 scale; unknown comes out a whole number <= 10"
    diagnostic_exemplar:
      problem: 'A course mark is $20\%$ homework and $80\%$ exam. The homework average is $9$ (out of $10$). What exam mark gives an overall mark of $8.2$?'
      answer: '8'
      solution_sketch: '$0.2 \cdot 9 = 1.8$; $(8.2 - 1.8)/0.8 = 8$.'
    anki_seeds:
      - front: 'Weighted average formula (weights $w_i$ summing to 1)?'
        back: '$\sum w_i x_i$ — multiply each value by its weight and add.'
        type: basic
      - front: 'Combined mean of groups of sizes $m$ and $n$ with means $\bar{x}$ and $\bar{y}$?'
        back: '$\frac{m\bar{x} + n\bar{y}}{m + n}$ — total of all values over total count (NOT the average of the two means unless $m = n$).'
        type: basic

  - id: mean-from-frequency-table
    name: "The Mean from a Frequency Table"
    core: false                # data-display branch; terminal
    difficulty: 0.3
    drill: false
    answer_kind: numeric
    expected_time_secs: 120
    prerequisites:
      - id: mean-of-a-data-set
        weight: 0.7
        key: true
      - id: frequency-tables-histograms
        weight: 0.6
        key: true
      - id: summation-notation
        weight: 0.3
        key: false
    knowledge_points:
      - id: kp1
        name: "Totals from a frequency table"
        key_prerequisites: [frequency-tables-histograms, mean-of-a-data-set]
        step_check:
          step: 'Multiply each value by its frequency: $2 \cdot 4 = 8$, $5 \cdot 1 = 5$, $7 \cdot 5 = 35$'
          question: 'Why is each value multiplied by its frequency?'
          options:
            - 'The product is the mean of that row of the table'
            - 'A value occurring $4$ times is added $4$ times'
            - 'Multiplying removes the repeated values from the table'
            - 'The frequency shows how much the value should be rounded'
          answer: 'A value occurring $4$ times is added $4$ times'
          why: 'The frequency counts how many copies of a value are in the data, so the value contributes frequency times value to the sum.'
        exemplars:
          - problem: 'A frequency table lists the values $1, 2$ and $3$ with the frequencies $2, 3$ and $5$. What is the sum of all the data values?'
            answer: '23'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The products are $1 \times 2 = 2$, $2 \times 3 = 6$ and $3 \times 5 = 15$. Their sum is $2 + 6 + 15 = 23$.'
          - problem: 'The values $0, 1$ and $2$ occur with the frequencies $4, 9$ and $7$. How many data values are there altogether?'
            answer: '20'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The number of data values is the sum of the frequencies. Here $4 + 9 + 7 = 20$.'
          - problem: 'A class of $20$ students is asked how many siblings each has: $4$ have none, $10$ have one and $6$ have two. How many siblings do the students have altogether?'
            answer: '22'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The students with none contribute $0$, those with one contribute $10 \times 1 = 10$ and those with two contribute $6 \times 2 = 12$. In all that is $0 + 10 + 12 = 22$ siblings.'
          - problem: 'A frequency table lists the values $2, 5$ and $7$ with the frequencies $4, 1$ and $5$. What is the sum of all the data values?'
            answer: '48'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The products are $2 \times 4 = 8$, $5 \times 1 = 5$ and $7 \times 5 = 35$. Their sum is $8 + 5 + 35 = 48$.'
          - problem: 'A cafe sells coffees at $2, 3$ and $4$ dollars. It sold $6$ at $2$ dollars, $5$ at $3$ dollars and $4$ at $4$ dollars. How many dollars did it take for coffees in total?'
            answer: '43'
            answer_contract: {"kind": "unit", "quantity": "dollar", "unit": "dollar", "allow_omitted": true}
            solution_sketch: 'The takings are $6 \times 2 = 12$, $5 \times 3 = 15$ and $4 \times 4 = 16$ dollars. Together that is $12 + 15 + 16 = 43$ dollars.'
          - problem: 'The values $2, 4, 6$ and $8$ occur with the frequencies $3, 1, 4$ and $2$. What is the sum of all the data values?'
            answer: '50'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The products are $6, 4, 24$ and $16$. Their sum is $6 + 4 + 24 + 16 = 50$.'
          - problem: 'Sam thinks the values $1, 3$ and $6$ with the frequencies $5, 2$ and $3$ make only $3$ data values, because the table has $3$ rows. How many data values are there?'
            answer: '10'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Each frequency counts data values, not the rows. So the number of data values is $5 + 2 + 3 = 10$.'
        constraints: "3-4 rows; values 0-9, frequencies 1-9"
      - id: kp2
        name: "Mean from a frequency table"
        key_prerequisites: [mean-of-a-data-set, frequency-tables-histograms]
        step_check:
          step: 'Divide the sum by the total frequency: $\text{mean} = 104 / 20 = 5.2$'
          question: 'Why is the total $104$ divided by $20$ and not by the $4$ rows?'
          options:
            - 'The number of rows is only used when the mean is a decimal'
            - 'Twenty is the largest frequency in the table'
            - 'The $104$ is the total of twenty data values'
            - 'Dividing by the rows would give the middle value'
          answer: 'The $104$ is the total of twenty data values'
          why: 'The mean is the sum of all the data values over how many data values there are, and that count is the sum of the frequencies, here $6 + 8 + 4 + 2 = 20$.'
        exemplars:
          - problem: 'The values $2, 4$ and $6$ occur with the frequencies $3, 5$ and $2$. Find the mean.'
            answer: '3.8'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The sum of the values is $2 \times 3 + 4 \times 5 + 6 \times 2 = 38$. There are $3 + 5 + 2 = 10$ values, so the mean is $38 \div 10 = 3.8$.'
          - problem: 'In a small class the scores $4, 5, 6$ and $7$ occur with the frequencies $3, 2, 4$ and $1$. What is the mean score?'
            answer: '5.3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The scores add up to $12 + 10 + 24 + 7 = 53$. There are $3 + 2 + 4 + 1 = 10$ students, so the mean is $53 \div 10 = 5.3$.'
          - problem: 'A basketball team plays $20$ games. It scores $10$ points in $5$ games, $12$ points in $8$ games and $14$ points in $7$ games. What is its mean score per game?'
            answer: '12.2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The points add up to $50 + 96 + 98 = 244$. Dividing by the $20$ games gives $244 \div 20 = 12.2$ points.'
          - problem: 'The values $1, 2, 3$ and $4$ occur with the frequencies $4, 3, 2$ and $1$. Find the mean.'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The sum of the values is $4 + 6 + 6 + 4 = 20$. There are $10$ values, so the mean is $20 \div 10 = 2$.'
          - problem: 'A survey of $25$ households asks how many cars each owns: $5$ own none, $10$ own one, $8$ own two and $2$ own three. Find the mean number of cars per household.'
            answer: '1.28'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The households own $0 + 10 + 16 + 6 = 32$ cars in all. Dividing by $25$ households gives $1.28$ cars.'
          - problem: 'The values $0, 2$ and $5$ occur with the frequencies $4, 4$ and $2$. Find the mean.'
            answer: '1.8'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The sum of the values is $0 + 8 + 10 = 18$. There are $10$ values, so the mean is $18 \div 10 = 1.8$.'
          - problem: 'Twelve pupils have shoe sizes as follows: size $5$ for $3$ pupils, size $6$ for $5$ pupils and size $7$ for $4$ pupils. Find the mean shoe size to two decimal places.'
            answer: '6.08'
            answer_contract: {"kind": "approx", "decimals": 2}
            solution_sketch: 'The sizes add up to $15 + 30 + 28 = 73$. Dividing by $12$ pupils gives $6.0833\ldots$, which is $6.08$ to two decimal places.'
          - problem: 'Sam finds the mean of the values $1, 3$ and $5$ with the frequencies $2, 5$ and $3$ as $(1 + 3 + 5) \div 3 = 3$. What is the correct mean?'
            answer: '3.2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The frequencies must be used. The sum is $2 + 15 + 15 = 32$ over $10$ values, so the mean is $3.2$.'
        constraints: "total frequency 10, 20, or 25 so the mean has at most one decimal place"
      - id: kp3
        name: "Missing frequency from a given mean"
        key_prerequisites: [mean-of-a-data-set, frequency-tables-histograms]
        step_check:
          step: 'Multiply both sides by $(5 + f)$ to eliminate the denominator'
          question: 'Why are both sides of the equation multiplied by $5 + f$?'
          options:
            - 'It removes the fraction from the equation'
            - 'It makes the frequency $f$ equal to the mean'
            - 'It adds the unknown frequency to the total'
            - 'It turns the mean into the median of the table'
          answer: 'It removes the fraction from the equation'
          why: 'The unknown frequency sits in the denominator of the mean, so multiplying both sides by the count clears the fraction and leaves an equation that is linear in $f$.'
        try_first:
          problem: 'The value $2$ occurs $3$ times and the value $6$ occurs $f$ times. The mean is $5$. What is $f$?'
          answer_contract: {"kind": "exact"}
          answer: '9'
          reveal: 'The total is $6 + 6f$ and there are $3 + f$ values, so $6 + 6f = 5(3 + f)$ gives $f = 9$. An unknown frequency goes into both the total and the count.'
        exemplars:
          - problem: 'In a game a player scores $5$ points in $6$ rounds and $10$ points in the remaining rounds. Her mean score is $7$ points per round. In how many rounds does she score $10$ points?'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Let $f$ be the number of $10$-point rounds. Then $(30 + 10f) \div (6 + f) = 7$, so $30 + 10f = 42 + 7f$ and $3f = 12$, which gives $f = 4$.'
          - problem: 'A bag holds counters numbered $2$ or $8$. Nine counters carry the number $2$ and the mean of all the counters is $3.5$. How many counters carry the number $8$?'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Let $f$ be that number. Then $(18 + 8f) \div (9 + f) = 3.5$, so $18 + 8f = 31.5 + 3.5f$ and $4.5f = 13.5$, which gives $f = 3$.'
          - problem: 'The value $3$ occurs $4$ times and the value $8$ occurs $f$ times. The mean is $6$. Find $f$.'
            answer: '6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The total is $12 + 8f$ and there are $4 + f$ values. So $12 + 8f = 24 + 6f$, which gives $2f = 12$ and $f = 6$.'
          - problem: 'The value $10$ occurs $5$ times and the value $4$ occurs $f$ times. The mean is $7$. Find $f$.'
            answer: '5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The total is $50 + 4f$ and there are $5 + f$ values. So $50 + 4f = 35 + 7f$, which gives $3f = 15$ and $f = 5$.'
          - problem: 'On a quiz out of $10$, four students scored $6$ and the others scored $9$. The class mean was $8$. How many students scored $9$?'
            answer: '8'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Let $f$ be the number who scored $9$. Then $(24 + 9f) \div (4 + f) = 8$, so $24 + 9f = 32 + 8f$ and $f = 8$.'
          - problem: 'A taxi makes trips of $3$ km and $7$ km. Six trips are of $3$ km and the mean trip length is $5$ km. How many trips are of $7$ km?'
            answer: '6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Let $f$ be the number of $7$ km trips. Then $(18 + 7f) \div (6 + f) = 5$, so $18 + 7f = 30 + 5f$ and $2f = 12$, which gives $f = 6$.'
          - problem: 'The value $10$ occurs $2$ times and the value $4$ occurs $f$ times. The mean is $6$. Find $f$.'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The total is $20 + 4f$ and there are $2 + f$ values. So $20 + 4f = 12 + 6f$, which gives $2f = 8$ and $f = 4$.'
        constraints: "two rows, one unknown frequency; choose numbers so the unknown frequency is a whole number"
    diagnostic_exemplar:
      problem: 'The value $3$ occurs $6$ times and the value $8$ occurs $f$ times. The mean is $5$. Find $f$.'
      answer: '4'
      solution_sketch: '$18 + 8f = 5(6 + f)$ gives $3f = 12$, so $f = 4$.'
    anki_seeds:
      - front: 'Mean from a frequency table $=$ ?'
        back: '$\frac{\sum f_i x_i}{\sum f_i}$ — each value times its frequency, over the total frequency.'
        type: basic
      - front: 'In a frequency table, the number of data values equals...'
        back: 'The sum of the frequencies.'
        type: basic

  - id: mean-median-mode
    name: "Mean, Median, and Mode"
    core: true
    difficulty: 0.3
    drill: false
    answer_kind: numeric
    expected_time_secs: 120
    prerequisites:
      - id: mean-of-a-data-set
        weight: 0.8
        key: true
      - id: median-and-mode
        weight: 0.8
        key: true
      - id: weighted-averages
        weight: 0.4
        key: false
    knowledge_points:
      - id: kp1
        name: "All three measures for one data set"
        key_prerequisites: [mean-of-a-data-set, median-and-mode]
        step_check:
          step: 'Sort the values from least to greatest before reading the middle one'
          question: 'Why must the values be sorted before the median is found?'
          options:
            - 'The median is the middle of the ordered list, not the given one'
            - 'Sorting changes the total of the values, so the mean needs it too'
            - 'The mode is always the first value of the sorted list of values'
            - 'Sorting removes the repeated values, and the median ignores them'
          answer: 'The median is the middle of the ordered list, not the given one'
          why: 'The median is the value in the middle position of the ordered data, so the data must be in order before the middle is found.'
        exemplars:
          - problem: 'Find the mean, the median and the mode of the data $1, 3, 3, 7, 6$.'
            answer: '4, 3, 3'
            answer_contract: {"kind": "coordinates", "arity": 3}
            solution_sketch: 'The sum is $1+3+3+7+6=20$, so the mean is $20/5=4$. Sorted, the data is $1, 3, 3, 6, 7$, so the median is the middle value $3$. The value $3$ occurs twice and every other value once, so the mode is $3$.'
          - problem: 'Find the mean, the median and the mode of the data $5, 9, 2, 9, 5, 9$.'
            answer: '6.5, 7, 9'
            answer_contract: {"kind": "coordinates", "arity": 3}
            solution_sketch: 'The sum is $39$, so the mean is $39/6=6.5$. Sorted, the data is $2, 5, 5, 9, 9, 9$. The median is the mean of the two middle values, $(5+9)/2=7$, and the mode is $9$, which occurs three times.'
          - problem: 'The rainfall on six days was $2$, $3$, $3$, $7$, $8$ and $10$ millimeters. Find the mean, the median and the mode of the rainfall.'
            answer: '5.5, 5, 3'
            answer_contract: {"kind": "coordinates", "arity": 3}
            solution_sketch: 'The sum is $33$, so the mean is $33/6=5.5$. The two middle values are $3$ and $7$, so the median is $(3+7)/2=5$. The value $3$ occurs most often, so the mode is $3$.'
          - problem: 'A café counts $14, 9, 11, 14, 16$ and $14$ customers in six consecutive hours. What is the mean number of customers per hour?'
            answer: '13'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The total is $14+9+11+14+16+14=78$ customers. The mean shares this total over $6$ hours, so it is $78/6=13$ customers per hour.'
          - problem: 'Seven seedlings have heights of $12, 15, 9, 18, 15, 11$ and $20$ centimeters. What is the median height?'
            answer: '15'
            answer_contract: {"kind": "unit", "quantity": "length", "unit": "cm", "allow_omitted": true}
            solution_sketch: 'Sort the heights: $9, 11, 12, 15, 15, 18, 20$. With seven values the median is the fourth one, which is $15$ centimeters.'
          - problem: 'A club buys boots for its ten players, whose shoe sizes are $8, 9, 7, 9, 10, 8, 9, 11, 7, 9$. Which size does the club need the most pairs of?'
            answer: '9'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The size $9$ occurs four times, more often than any other size, since $8$ and $7$ occur twice each. The mode is $9$, so the club needs the most pairs of size $9$.'
          - problem: 'A student''s marks on seven tests were $70, 85, 90, 85, 65, 85$ and $80$. Find the mean, the median and the mode of the marks.'
            answer: '80, 85, 85'
            answer_contract: {"kind": "coordinates", "arity": 3}
            solution_sketch: 'The sum is $560$, so the mean is $560/7=80$. Sorted, the marks are $65, 70, 80, 85, 85, 85, 90$, so the median is the fourth mark, $85$. The mark $85$ occurs three times, so the mode is $85$.'
          - problem: 'Sam says the median of $3, 9, 4, 7, 5$ is $4$, because $4$ is the middle number in the list. What is the correct median?'
            answer: '5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The median is the middle value of the sorted data, not of the list as written. Sorted, the data is $3, 4, 5, 7, 9$, so the median is $5$.'
        constraints: "5-7 values given in the question and not sorted; either all three measures of one data set (in the order mean, median, mode) or one measure chosen in a context; exactly one mode; mean an integer or ending in .5"
      - id: kp2
        name: "Comparing mean and median"
        key_prerequisites: [mean-of-a-data-set, median-and-mode]
        step_check:
          step: 'the outlier $60$ has pulled the mean above the median'
          question: 'Why does the outlier $60$ pull the mean above the median?'
          options:
            - 'The mean divides by the count, and adding $60$ raises the count'
            - 'The median counts how often $60$ occurs, and it occurs once'
            - 'The mean uses the size of $60$; the median uses only its place'
          answer: 'The mean uses the size of $60$; the median uses only its place'
          why: 'Every value enters the sum, so the large value $60$ raises the mean, while the median only depends on which value sits in the middle.'
        exemplars:
          - problem: 'The data $10, 12, 13, 14, 90$ contains one extreme value. Which is larger, the mean or the median?'
            answer: 'the mean'
            answer_contract: {"kind": "label", "options": [["the mean", "mean", "the mean is larger", "mean is larger", "the mean is greater", "the mean is bigger", "the mean is larger than the median", "the mean is greater than the median"], ["the median", "median", "the median is larger", "median is larger", "the median is greater", "the median is bigger", "the median is larger than the mean", "the median is greater than the mean"], ["they are equal", "equal", "the same", "they are the same", "neither", "the mean and the median are equal", "both are equal", "same"]]}
            solution_sketch: 'The mean is $(10+12+13+14+90)/5=139/5=27.8$. The median is the middle value, $13$. The extreme value $90$ pulls the mean far above the median, so the mean is larger.'
          - problem: 'The data $20, 22, 23, 25, 90$ contains one extreme value. By how much is the mean larger than the median?'
            answer: '13'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The mean is $(20+22+23+25+90)/5=180/5=36$. The median is the middle value, $23$. So the mean is larger by $36-23=13$.'
          - problem: 'The yearly salaries in a shop are $30, 32, 35, 38$ and $200$ thousand euros. By how many thousand euros is the mean salary above the median salary?'
            answer: '32'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The mean is $(30+32+35+38+200)/5=335/5=67$ thousand euros. The median is the middle salary, $35$ thousand euros. The mean is above the median by $67-35=32$ thousand euros.'
          - problem: 'The data $2, 4, 5, 6, 40$ contains one extreme value. Find the median minus the mean.'
            answer: '-32/5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The median is the middle value, $5$. The mean is $(2+4+5+6+40)/5=57/5$. So the median minus the mean is $5-57/5=25/5-57/5=-32/5$.'
          - problem: 'Five friends get $6, 7, 8, 9$ and $45$ euros of pocket money in a week. How many euros larger is the mean than the median?'
            answer: '7'
            answer_contract: {"kind": "unit", "quantity": "euro", "unit": "euro", "allow_omitted": true}
            solution_sketch: 'The mean is $(6+7+8+9+45)/5=75/5=15$ euros. The median is the middle amount, $8$ euros. The mean is larger by $15-8=7$ euros.'
          - problem: 'Which is larger, the mean or the median of $8, 9, 10, 11, 12$?'
            answer: 'they are equal'
            answer_contract: {"kind": "label", "options": [["the mean", "mean", "the mean is larger", "mean is larger", "the mean is greater", "the mean is bigger", "the mean is larger than the median", "the mean is greater than the median"], ["the median", "median", "the median is larger", "median is larger", "the median is greater", "the median is bigger", "the median is larger than the mean", "the median is greater than the mean"], ["they are equal", "equal", "the same", "they are the same", "neither", "the mean and the median are equal", "both are equal", "same"]]}
            solution_sketch: 'The mean is $(8+9+10+11+12)/5=50/5=10$. The median is the middle value, $10$. The data is symmetric about $10$, so the mean and the median are equal.'
          - problem: 'For the data $5, 7, 8, 9, 10, 99$, find the mean minus the median.'
            answer: '29/2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The mean is $(5+7+8+9+10+99)/6=138/6=23$. The median is the mean of the two middle values, $(8+9)/2=17/2$. So the difference is $23-17/2=29/2$.'
          - problem: 'A student''s marks on five tests were $5, 64, 66, 68$ and $72$; the $5$ is a test she missed. How many marks is the median above the mean?'
            answer: '11'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The mean is $(5+64+66+68+72)/5=275/5=55$. The median is the middle mark, $66$. The median is above the mean by $66-55=11$ marks.'
        constraints: "5-6 values with one extreme value, or a symmetric set; the question asks which measure is larger (label: the mean, the median, they are equal) or for the difference of the mean and the median in either order"
      - id: kp3
        name: "Updating the mean"
        key_prerequisites: [mean-of-a-data-set, weighted-averages]
        step_check:
          step: 'Recover the old total: $6 \cdot 8 = 48$'
          question: 'Why is the old mean $8$ multiplied by the old count $6$?'
          options:
            - 'It gives the mean of all the values once the new value joins them'
            - 'The mean is the total over the count, so this restores it'
            - 'It gives the number of values that lie below the old mean'
          answer: 'The mean is the total over the count, so this restores it'
          why: 'The mean is the total divided by the count, so the mean times the count is the total of the old values.'
        try_first:
          problem: 'The mean amount of pocket money of $5$ friends is $12$ euros. How many euros do the $5$ friends have together?'
          answer_contract: {"kind": "exact"}
          answer: '60'
          reveal: 'The total is the mean times the count, $5\cdot 12=60$ euros. Recovering the total from a mean and a count is the first move whenever a value is added to a data set or removed from it.'
        exemplars:
          - problem: 'The data $4, 6, 8, 10$ has mean $7$. A fifth value, $12$, is added. What is the new mean?'
            answer: '8'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The old total is $4\cdot 7=28$. Adding $12$ gives $40$, and with $5$ values the new mean is $40/5=8$.'
          - problem: 'After $4$ quizzes a student has a mean of $6.5$ out of $10$. She scores $9$ on the fifth quiz. What is her new mean?'
            answer: '7'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The old total is $4\cdot 6.5=26$ points. The fifth quiz makes it $26+9=35$, and with $5$ quizzes the new mean is $35/5=7$.'
          - problem: 'The mean mass of $8$ parcels is $5$ kg. A parcel of $14$ kg is added. What is the new mean mass?'
            answer: '6'
            answer_contract: {"kind": "unit", "quantity": "mass", "unit": "kg", "allow_omitted": true}
            solution_sketch: 'The old total mass is $8\cdot 5=40$ kg. Adding the new parcel gives $54$ kg, and with $9$ parcels the new mean is $54/9=6$ kg.'
          - problem: 'The data $10, 20, 30, 40$ has mean $25$. The value $10$ is removed. What is the new mean?'
            answer: '30'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The old total is $4\cdot 25=100$. Removing $10$ leaves $90$, and with $3$ values left the new mean is $90/3=30$.'
          - problem: 'A basketball player has a mean of $14$ points over $5$ games. She scores $20$ points in the sixth game. What is her new mean?'
            answer: '15'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The total so far is $5\cdot 14=70$ points. The sixth game makes it $70+20=90$, and the new mean is $90/6=15$ points.'
          - problem: 'The mean score of $6$ essays is $12$ points. The essay that scored $2$ points is removed from the pile. What is the mean score of the other essays?'
            answer: '14'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The old total is $6\cdot 12=72$ points. Removing $2$ leaves $70$, and with $5$ essays left the new mean is $70/5=14$ points.'
          - problem: 'After $4$ tests a student has a mean mark of $72$. What mark on the fifth test gives her a mean of $75$?'
            answer: '87'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The total needed for a mean of $75$ over $5$ tests is $5\cdot 75=375$. The first four tests give $4\cdot 72=288$. So the fifth mark must be $375-288=87$.'
          - problem: 'The mean age of $5$ players is $24$ years. A player aged $34$ leaves. What is the mean age of the other players?'
            answer: '21.5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The old total is $5\cdot 24=120$ years. Removing $34$ leaves $86$, and with $4$ players left the new mean is $86/4=21.5$ years.'
          - problem: 'Four values have mean $10$. Sam adds the value $20$ and says the new mean is $(10+20)/2=15$. What is the correct new mean?'
            answer: '12'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The old total is $4\cdot 10=40$. Adding $20$ gives $60$, and the count is now $5$, so the new mean is $60/5=12$. Sam averaged the mean with the new value, which ignores that four values stand behind the old mean.'
          - problem: 'A class of $20$ students has a mean mark of $60$. A new student who scored $81$ joins the class. What is the mean mark of the $21$ students?'
            answer: '61'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The old total is $20\cdot 60=1200$. The new student makes it $1200+81=1281$. With $21$ students the new mean is $1281/21=61$.'
        constraints: "start from a stated mean over 3-20 values; one value is added or removed, or the value needed for a target mean is found; the new mean is an integer or ends in .5"
    diagnostic_exemplar:
      problem: 'For the data $4, 8, 3, 8, 7$: find the mean, the median, and the mode. A sixth value $12$ is then added — find the new mean.'
      answer: 'Mean $6$, median $7$, mode $8$; new mean $7$.'
      answer_contract: {kind: none}
      solution_sketch: 'Sum $30/5 = 6$; sorted $3, 4, 7, 8, 8$ gives median $7$ and mode $8$; new total $42/6 = 7$.'
    anki_seeds:
      - front: 'Which measure of center resists outliers: mean or median?'
        back: 'The median.'
        type: basic

  - id: outliers-effect-on-center
    name: "Outliers and Their Effect on Center"
    core: false                # descriptive-summary branch; terminal
    difficulty: 0.35
    drill: false
    answer_kind: numeric
    expected_time_secs: 150
    prerequisites:
      - id: mean-median-mode
        weight: 0.8
        key: true
    knowledge_points:
      - id: kp1
        name: "Direction of an outlier's pull"
        key_prerequisites: [mean-median-mode]
        step_check:
          step: 'The high outlier drags the mean much more than the median'
          question: 'Why does the outlier $50$ move the mean far more than the median?'
          options:
            - 'The mean divides by the count, and adding $50$ raises the count'
            - 'The median is rounded to a whole number, which hides the change'
            - 'Outliers are left out whenever the median is worked out, so it stays'
            - 'The mean uses the size of $50$; the median uses its place in order'
          answer: 'The mean uses the size of $50$; the median uses its place in order'
          why: 'Every value enters the sum for the mean, so one far value moves it a lot, while the median only moves to a neighboring value.'
        exemplars:
          - problem: 'The mean of $4, 6, 8$ is $6$. The value $30$ is added. By how much does the mean increase?'
            answer: '6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The old total is $4+6+8=18$, so the new total is $18+30=48$ and the new mean is $48/4=12$. The mean increases by $12-6=6$.'
          - problem: 'A set of clustered values gains one very large outlier. Which measure of center is pulled most strongly toward the outlier: the mean, the median or the mode?'
            answer: 'the mean'
            answer_contract: {"kind": "label", "options": [["the mean", "mean", "it is the mean", "the mean is pulled most", "the mean is pulled the most", "the mean is pulled most strongly", "the mean is affected most", "the mean is the most affected"], ["the median", "median", "it is the median", "the median is pulled most", "the median is pulled the most", "the median is affected most"], ["the mode", "mode", "it is the mode", "the mode is pulled most", "the mode is pulled the most", "the mode is affected most"], ["neither", "none", "no measure"]]}
            solution_sketch: 'Every value enters the sum, so a value far from the cluster drags the mean toward itself. The median moves at most to a neighboring value, and the mode does not move at all. So the mean is pulled most.'
          - problem: 'The median of $1, 3, 5, 7$ is $4$. The value $3$ is added. What is the new median?'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The new sorted data is $1, 3, 3, 5, 7$. With five values the median is the third one, $3$, so it falls from $4$ to $3$.'
          - problem: 'The data $10, 11, 12, 13$ gains the value $2$. What is the new mean?'
            answer: '48/5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The old total is $10+11+12+13=46$. With the value $2$ the total is $48$ over $5$ values, so the new mean is $48/5=9.6$. This is below the old mean, $11.5$.'
          - problem: 'Five values have a mean of $12$. The outlier $60$ is added. By how much does the mean increase?'
            answer: '8'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The old total is $5\cdot 12=60$. The new total is $60+60=120$ over $6$ values, so the new mean is $20$. The mean increases by $20-12=8$.'
          - problem: 'A class scores $14, 15, 16, 17$ and $18$ out of $20$ on a quiz. A new student scores $2$. Does the mean score rise or fall?'
            answer: 'fall'
            answer_contract: {"kind": "label", "options": [["rise", "rises", "it rises", "the mean rises", "increase", "increases", "it increases", "the mean increases"], ["fall", "falls", "it falls", "the mean falls", "decrease", "decreases", "it decreases", "the mean decreases"], ["no change", "it stays the same", "stay the same", "unchanged", "it does not change", "the mean does not change", "the mean stays the same", "same"]]}
            solution_sketch: 'The old mean is $80/5=16$. The score $2$ is far below $16$, so the new total is $82$ over $6$ students. The new mean is about $13.7$, which is lower, so the mean falls.'
          - problem: 'Five houses on a street sold for $200, 210, 220, 230$ and $240$ thousand euros. A mansion then sells for $1330$ thousand euros. By how many thousand euros does the mean sale price rise?'
            answer: '185'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The old total is $1100$, so the old mean is $1100/5=220$. With the mansion the total is $2430$ over $6$ houses, so the new mean is $405$. The mean rises by $405-220=185$ thousand euros.'
          - problem: 'Sam says that adding the value $100$ to the data $5, 6, 7, 8, 9$ leaves the median at $7$, because the median ignores large numbers. What is the new median?'
            answer: '7.5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The new sorted data is $5, 6, 7, 8, 9, 100$. With six values the median is the mean of the third and fourth, $(7+8)/2=7.5$. The median moves, but only a little.'
        constraints: "one outlier added to 4-6 clustered values; the question asks for the direction of the change, the new mean or median, or the size of the change when the values are given or a mean and a count are stated"
      - id: kp2
        name: "Mean and median with and without the outlier"
        key_prerequisites: [mean-median-mode]
        step_check:
          step: 'The median barely moves'
          question: 'Why does the median barely move when the outlier $38$ is removed?'
          options:
            - 'It depends on the middle position, not on how large $38$ is'
            - 'It is found by adding all values, so one value matters little'
            - 'Removing one value always leaves the median unchanged'
          answer: 'It depends on the middle position, not on how large $38$ is'
          why: 'The median is the middle of the ordered data, so removing an end value only shifts the middle by half a place.'
        exemplars:
          - problem: 'The data $4, 5, 6, 7, 48$ contains the outlier $48$. What is its mean?'
            answer: '14'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The total is $4+5+6+7+48=70$. The mean is $70/5=14$. The outlier $48$ makes the mean much larger than the other four values.'
          - problem: 'The outlier $48$ is removed from the data $4, 5, 6, 7, 48$. What is the mean of the remaining values?'
            answer: '5.5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The remaining values are $4, 5, 6, 7$, with total $22$. The mean is $22/4=5.5$, much lower than the mean $14$ with the outlier.'
          - problem: 'The data $10, 12, 14, 16, 60$ contains the outlier $60$. What is its median?'
            answer: '14'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The data is already sorted and has five values. The median is the third value, $14$. The outlier $60$ sits at the end and does not change which value is in the middle.'
          - problem: 'The outlier $60$ is removed from the data $10, 12, 14, 16, 60$. What is the median of the remaining values?'
            answer: '13'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The remaining data $10, 12, 14, 16$ has four values. The median is the mean of the two middle values, $(12+14)/2=13$. It moved only from $14$ to $13$.'
          - problem: 'The outlier $40$ is removed from the data $2, 4, 6, 8, 40$. By how much does the mean decrease?'
            answer: '7'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'With the outlier the mean is $60/5=12$. Without it the mean is $20/4=5$. The mean decreases by $12-5=7$.'
          - problem: 'The outlier $47$ is removed from the data $3, 5, 9, 11, 47$. By how much does the median decrease?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'With the outlier the median is the middle value, $9$. Without it the data is $3, 5, 9, 11$ and the median is $(5+9)/2=7$. The median decreases by $9-7=2$.'
          - problem: 'A small firm pays its five employees $28, 30, 31, 33$ and $34$ thousand euros a year, and its owner $240$ thousand euros. By how many thousand euros does the mean pay fall when the owner is left out?'
            answer: '34.8'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'With the owner the total is $156+240=396$ over $6$ people, so the mean is $66$. Without the owner the mean is $156/5=31.2$. The mean falls by $66-31.2=34.8$ thousand euros.'
          - problem: 'The commute times of five workers are $12, 15, 14, 13$ and $96$ minutes. A reporter says the typical commute is the mean. How many minutes longer is the mean than the median?'
            answer: '16'
            answer_contract: {"kind": "unit", "quantity": "time", "unit": "min", "allow_omitted": true}
            solution_sketch: 'The mean is $(12+15+14+13+96)/5=150/5=30$ minutes. Sorted, the times are $12, 13, 14, 15, 96$, so the median is $14$ minutes. The mean is longer by $30-14=16$ minutes.'
        constraints: "4-6 clustered values plus one outlier; the mean and the median are worked out with the outlier, without it, or as the change between the two; means come out as integers or .5 values unless a context needs a decimal"
      - id: kp3
        name: "Recomputing a mean after removing a value"
        key_prerequisites: [mean-median-mode]
        step_check:
          step: 'There are now 5 values'
          question: 'Why is the new total divided by $5$ and not by $6$?'
          options:
            - 'The mean is always found by dividing by the smaller of two counts'
            - 'The old mean was found from $5$ values, and the new one from $6$'
            - 'The removed value leaves one fewer value to share the total'
          answer: 'The removed value leaves one fewer value to share the total'
          why: 'Removing a value takes it out of both the total and the count, so $6-1=5$ values share the new total.'
        exemplars:
          - problem: 'The mean of $6$ values is $10$. The value $40$ is removed. What is the new mean?'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The old total is $6\cdot 10=60$. Removing $40$ leaves $20$, and with $5$ values left the new mean is $20/5=4$.'
          - problem: 'The mean of $5$ values is $20$. The value $60$ is removed. What is the new mean?'
            answer: '10'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The old total is $5\cdot 20=100$. Removing $60$ leaves $40$, and with $4$ values left the new mean is $40/4=10$.'
          - problem: 'The mean mass of $4$ parcels is $15$ kg. The parcel of $36$ kg is taken out. What is the mean mass of the other $3$ parcels?'
            answer: '8'
            answer_contract: {"kind": "unit", "quantity": "mass", "unit": "kg", "allow_omitted": true}
            solution_sketch: 'The old total mass is $4\cdot 15=60$ kg. Taking out $36$ kg leaves $24$ kg, and the other $3$ parcels have mean mass $24/3=8$ kg.'
          - problem: 'Over $10$ days a bakery sold a mean of $7$ cakes a day. On one day a party order made it sell $25$ cakes. What was the mean number of cakes a day on the other $9$ days?'
            answer: '5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The total over $10$ days is $10\cdot 7=70$ cakes. Without the party day the total is $70-25=45$ cakes, and the mean over $9$ days is $45/9=5$ cakes.'
          - problem: 'The mean of $8$ marks is $74$. The lowest mark, $46$, is removed. What is the new mean?'
            answer: '78'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The old total is $8\cdot 74=592$. Removing $46$ leaves $546$, and with $7$ marks left the new mean is $546/7=78$.'
          - problem: 'A team of $6$ people earns a mean of $3000$ euros a month. One of the six is the owner, who earns $9000$ euros a month. What is the mean monthly pay of the other $5$ people?'
            answer: '1800'
            answer_contract: {"kind": "unit", "quantity": "euro", "unit": "euro", "allow_omitted": true}
            solution_sketch: 'The total monthly pay is $6\cdot 3000=18000$ euros. Without the owner it is $18000-9000=9000$ euros, so the mean for $5$ people is $9000/5=1800$ euros.'
          - problem: 'The mean of $5$ values is $20$. Sam removes the value $12$ and says the new mean is $20-12=8$. What is the correct new mean?'
            answer: '22'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The old total is $5\cdot 20=100$. Removing $12$ leaves $88$ over $4$ values, so the new mean is $88/4=22$. Sam subtracted the value from the mean, but a value must be taken from the total.'
          - problem: 'The mean of $6$ values is $10$. One value is removed, and the mean of the other $5$ values is $8$. Which value was removed?'
            answer: '20'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The old total is $6\cdot 10=60$ and the new total is $5\cdot 8=40$. The removed value is the difference, $60-40=20$.'
        constraints: "work from the stated mean and count, not from a full list; one value is removed; the new mean is a whole number, or the removed value is asked for"
    diagnostic_exemplar:
      problem: 'The mean of $6$ marks is $9$. The outlier $24$ is removed. Find the new mean of the remaining marks, and state whether the outlier had inflated or deflated the original mean.'
      answer: 'New mean $6$; the outlier had inflated the mean.'
      answer_contract: {kind: none}
      solution_sketch: 'Total $6 \cdot 9 = 54$; $(54 - 24)/5 = 6 < 9$, so $24$ was pulling the mean up.'
    anki_seeds:
      - front: 'Adding one extreme high value to a data set does what to the mean and median?'
        back: 'Pulls the mean up substantially; the median moves little or not at all.'
        type: basic
      - front: 'The mean is {{c1::sensitive}} to outliers; the median is {{c2::resistant}}.'
        back: 'sensitive; resistant'
        type: cloze

  - id: percentiles
    name: "Percentiles"
    # core despite zero descendants: `normal-distribution` (core) computes percentiles in
    # kp2 "Combining regions and percentiles" without an edge declaring it. Undrawn
    # dependence, so the descendant count understates the leverage (W8 review, AC-12).
    core: true
    difficulty: 0.35
    drill: false
    answer_kind: numeric
    expected_time_secs: 120
    prerequisites:
      - id: median-and-mode
        weight: 0.6
        key: true
      - id: percentages
        weight: 0.5
        key: false
    knowledge_points:
      - id: kp1
        name: "Percentile rank of a value"
        key_prerequisites: [median-and-mode, percentages]
        step_check:
          step: '$(18 / 25) \times 100$'
          question: 'Why is the number of scores below Maria''s divided by $25$ and then multiplied by $100$?'
          options:
            - 'It writes the share of lower scores as a percent of all scores'
            - 'It turns the number of scores below into a mark out of $100$'
            - 'It finds the percent of the questions that Maria answered correctly'
            - 'It gives the number of scores that lie above hers'
          answer: 'It writes the share of lower scores as a percent of all scores'
          why: 'The fraction $18/25$ is the share of the scores below hers, and multiplying by $100$ writes that share as a percent.'
        exemplars:
          - problem: 'In a group of $20$ scores, $13$ are below Ana''s score. What is her percentile rank?'
            answer: '65%'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The share of scores below hers is $13/20=0.65$. As a percent this is $65\%$, so Ana is at the 65th percentile.'
          - problem: 'A standardized test is taken by $400$ students, and $340$ of them score below Leo. What is his percentile rank?'
            answer: '85%'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The share of scores below his is $340/400=0.85$. As a percent this is $85\%$, so Leo is at the 85th percentile.'
          - problem: 'Out of $50$ runners, $40$ finished behind Sam. What is Sam''s percentile rank?'
            answer: '80%'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The share of runners behind Sam is $40/50=0.8$. As a percent this is $80\%$, so Sam is at the 80th percentile.'
          - problem: 'A score is at the 70th percentile among $40$ scores. How many of the scores are below it?'
            answer: '28'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'At the 70th percentile, $70\%$ of the scores are below the score. So the number below is $0.7\cdot 40=28$.'
          - problem: 'In a group of $25$ marks, Maya''s mark is at the 60th percentile. How many marks are below hers?'
            answer: '15'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'At the 60th percentile, $60\%$ of the marks are below hers. So the number below is $0.6\cdot 25=15$.'
          - problem: 'A girl is taller than $36$ of the $48$ children in her class. What is the percentile rank of her height?'
            answer: '75%'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The share of children shorter than she is is $36/48=0.75$. As a percent this is $75\%$, so her height is at the 75th percentile.'
          - problem: 'In a class of $20$ students, $5$ students scored higher than Jo, and no two students have the same score. What is Jo''s percentile rank?'
            answer: '70%'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Jo and the $5$ students above her take $6$ places, so $20-6=14$ students scored below her. The share below is $14/20=0.7$, so her percentile rank is $70\%$.'
          - problem: 'An exam is taken by $120$ students, and $54$ score below Kim. What is her percentile rank?'
            answer: '45%'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The share of scores below hers is $54/120=0.45$. As a percent this is $45\%$, so Kim is at the 45th percentile.'
        constraints: "totals that make the share below a whole percent; the question gives the number below, or the number above with no ties, and asks for the percentile rank, or gives the rank and asks how many are below"
      - id: kp2
        name: "Interpreting a percentile"
        key_prerequisites: [percentages]
        step_check:
          step: 'The 40th percentile means $40\%$ of the values lie below it'
          question: 'Why does a value at the 40th percentile have $40\%$ of the values below it?'
          options:
            - 'The percentile number is the percent of the data below the value'
            - 'The value itself equals $40\%$ of the largest value in the data set'
            - 'It means $40\%$ of the questions were answered correctly'
            - 'The percentile number is the percent of the data above the value'
          answer: 'The percentile number is the percent of the data below the value'
          why: 'A percentile is a rank: the $p$th percentile has about $p\%$ of the data below it.'
        try_first:
          problem: 'A student answers $90\%$ of the questions on a test correctly. Is her mark necessarily at the 90th percentile?'
          answer_contract: {"kind": "label", "options": [["yes", "yes, it must", "it must", "necessarily"], ["no", "no, not necessarily", "not necessarily", "it does not have to be"]]}
          answer: 'no'
          reveal: 'Her $90\%$ only says how many questions she got right. A percentile compares her mark with the other marks, so a score of $90\%$ has no fixed percentile.'
        exemplars:
          - problem: 'A baby''s weight is at the 30th percentile. What fraction of babies weigh less?'
            answer: '3/10'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'At the 30th percentile, $30\%$ of the babies weigh less. As a fraction, $30\%=30/100=3/10$.'
          - problem: 'A mark is at the 90th percentile. A classmate says the student answered $90\%$ of the questions correctly. What does the 90th percentile say about the mark?'
            answer: 'higher than 90% of the marks'
            answer_contract: {"kind": "label", "options": [["90% of the answers correct", "90% correct", "90 percent correct", "a score of 90%", "the student answered 90% correctly"], ["lower than 90% of the marks", "lower than 90% of all marks", "it is lower than 90% of the marks"], ["higher than 90% of the marks", "higher than 90% of all marks", "higher than 90 percent of the marks", "it is higher than 90% of the marks", "higher than 90% of marks", "above 90% of the marks", "better than 90% of the marks", "90% of the marks are lower"], ["higher than 9% of the marks", "higher than 9 percent of the marks"]]}
            solution_sketch: 'A percentile compares a mark with the other marks. The 90th percentile means the mark is higher than $90\%$ of all marks. It does not say that $90\%$ of the answers were correct.'
          - problem: 'A puppy''s weight is at the 80th percentile. What fraction of puppies weigh less?'
            answer: '4/5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'At the 80th percentile, $80\%$ of the puppies weigh less. As a fraction, $80\%=80/100=4/5$.'
          - problem: 'A hospital records the weights of $2000$ newborn babies in a year. One baby''s weight is at the 35th percentile. How many of the babies weigh less than this baby?'
            answer: '700'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'At the 35th percentile, $35\%$ of the babies weigh less. So the number of babies is $0.35\cdot 2000=700$.'
          - problem: 'A student''s score is at the 95th percentile. What fraction of the scores lie below it?'
            answer: '19/20'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'At the 95th percentile, $95\%$ of the scores lie below it. As a fraction, $95\%=95/100=19/20$.'
          - problem: 'A mark is at the 25th percentile. A teacher says this means the student got $25\%$ of the questions right. What does the 25th percentile say about the mark?'
            answer: 'higher than 25% of the marks'
            answer_contract: {"kind": "label", "options": [["higher than 25% of the marks", "higher than 25% of all marks", "higher than 25 percent of the marks", "it is higher than 25% of the marks", "higher than 25% of marks", "above 25% of the marks", "better than 25% of the marks", "25% of the marks are lower"], ["25% of the answers correct", "25% correct", "25 percent correct", "a score of 25%", "the student answered 25% correctly"], ["lower than 25% of the marks", "lower than 25% of all marks", "it is lower than 25% of the marks"], ["higher than 2.5% of the marks", "higher than 2.5 percent of the marks"]]}
            solution_sketch: 'The 25th percentile compares the mark with the other marks. It means the mark is higher than $25\%$ of all marks, so $75\%$ of the marks are higher. It says nothing about the share of questions answered correctly.'
          - problem: 'A baby''s weight is at the 75th percentile, and $600$ babies were weighed. How many of the babies are heavier than this baby?'
            answer: '150'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'At the 75th percentile, $75\%$ of the babies are lighter, so $25\%$ are heavier. The number heavier is $0.25\cdot 600=150$.'
          - problem: 'Among $40$ students, Noah''s mark is at the 65th percentile and Mia''s mark is at the 80th percentile. How many more students are below Mia''s mark than below Noah''s mark?'
            answer: '6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Below Mia''s mark are $0.8\cdot 40=32$ students, and below Noah''s mark are $0.65\cdot 40=26$ students. So $32-26=6$ more students are below Mia''s mark.'
        constraints: "interpretation of the percentile number as the share of the data below a value, contrasted with a percent score; answers are a fraction, a count or one of four statements"
      - id: kp3
        name: "Quartiles as percentiles"
        key_prerequisites: [median-and-mode]
        step_check:
          step: 'The first quartile has $25\%$ of the values below it'
          question: 'Why is the first quartile the 25th percentile?'
          options:
            - 'It sits one quarter of the way up from the minimum to the maximum'
            - 'It is the average of the smallest $25$ values in the whole data set'
            - 'A quarter of the ordered values lie below it, which is $25\%$'
          answer: 'A quarter of the ordered values lie below it, which is $25\%$'
          why: 'The quartiles cut the ordered data into four equal parts, so $Q_1$ has one quarter, $25\%$, of the values below it.'
        exemplars:
          - problem: 'The median is at which percentile?'
            answer: '50th'
            answer_contract: {"kind": "label", "options": [["25th", "25th percentile", "the 25th percentile", "25"], ["50th", "50th percentile", "the 50th percentile", "50"], ["75th", "75th percentile", "the 75th percentile", "75"], ["100th", "100th percentile", "the 100th percentile", "100"]]}
            solution_sketch: 'The median is the middle value of the ordered data. Half of the values lie below it, which is $50\%$, so the median is the 50th percentile.'
          - problem: 'At which percentiles are the first quartile $Q_1$ and the third quartile $Q_3$?'
            answer: '25, 75'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'The quartiles cut the ordered data into four equal parts. So $Q_1$ has $25\%$ of the values below it and $Q_3$ has $75\%$ below it. They are the 25th and the 75th percentile.'
          - problem: 'A value at the 75th percentile of $80$ data values has how many of them below it?'
            answer: '60'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The 75th percentile has $75\%$ of the values below it. So the number below is $0.75\cdot 80=60$.'
          - problem: 'A value at the 25th percentile of $40$ data values has how many of them below it?'
            answer: '10'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The 25th percentile has $25\%$ of the values below it. So the number below is $0.25\cdot 40=10$.'
          - problem: 'A school has $60$ pupils. Ben''s mark is at the third quartile. How many pupils have a higher mark than Ben?'
            answer: '15'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The third quartile is the 75th percentile, so $75\%$ of the marks are below Ben''s. Then $25\%$ are above it, and $0.25\cdot 60=15$ pupils have a higher mark.'
          - problem: 'The first quartile $Q_1$ of $80$ data values has how many of them below it?'
            answer: '20'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The first quartile is the 25th percentile, so $25\%$ of the values are below it. The number below is $0.25\cdot 80=20$.'
          - problem: 'A race has $120$ runners, and one runner''s time is exactly the median time. How many runners had a shorter time?'
            answer: '60'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The median is the 50th percentile, so half of the times are below it. Half of $120$ runners is $60$ runners with a shorter time.'
          - problem: 'How many of $48$ data values lie between $Q_1$ and $Q_3$?'
            answer: '24'
            answer_contract: {"kind": "exact"}
            solution_sketch: '$Q_1$ is the 25th percentile and $Q_3$ is the 75th percentile, so $75\%-25\%=50\%$ of the values lie between them. Half of $48$ is $24$.'
          - problem: 'Exactly $15$ values lie above the third quartile of a data set. How many values does the data set have?'
            answer: '60'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The third quartile is the 75th percentile, so $25\%$ of the values lie above it. Then $15$ is a quarter of the data, and the data set has $15\cdot 4=60$ values.'
        constraints: "counts divisible by 4; stay with the 25th, 50th and 75th percentile anchors; the question asks for the percentile of a quartile, the number of values below or above it, or the size of the data set"
    diagnostic_exemplar:
      problem: 'In a class of $40$ students, Maya\''s mark sits exactly at the third quartile $Q_3$. How many of the $40$ students scored below her?'
      answer: '30'
      solution_sketch: '$Q_3$ is the 75th percentile, so $75\%$ of the marks lie below hers: $0.75 \cdot 40 = 30$.'
    anki_seeds:
      - front: 'A value at the $p$th percentile...'
        back: 'Exceeds about $p\%$ of the data values (it is NOT a score of $p\%$).'
        type: basic
      - front: 'Median, $Q_1$, $Q_3$ as percentiles?'
        back: '50th, 25th, and 75th percentiles.'
        type: basic

  - id: range-iqr-boxplots
    name: "Range, IQR, and Boxplots"
    core: false                # descriptive-summary branch; terminal
    difficulty: 0.3
    drill: false
    answer_kind: numeric
    expected_time_secs: 150
    prerequisites:
      - id: mean-median-mode
        weight: 0.7
        key: true
    knowledge_points:
      - id: kp1
        name: "Range"
        key_prerequisites: [mean-median-mode]
        step_check:
          step: 'Range $=$ max $-$ min $= 10 - 4 = 6$'
          question: 'Why is the minimum subtracted from the maximum to get the range?'
          options:
            - 'The two extremes are added, and the sum shows how far the data reaches'
            - 'Subtracting the minimum moves the smallest value to zero and drops it'
            - 'The extremes'' difference is the width of the stretch the data covers'
            - 'The result is the number of values lying between the minimum and maximum'
          answer: 'The extremes'' difference is the width of the stretch the data covers'
          why: 'The data lies between the minimum and the maximum, so $\text{max}-\text{min}$ is the width of the stretch it covers.'
        exemplars:
          - problem: 'Find the range of $3, 8, 12, 5$.'
            answer: '9'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The largest value is $12$ and the smallest is $3$. The range is the difference of these two, $12-3=9$.'
          - problem: 'Find the range of $15, 9, 21, 14, 11$.'
            answer: '12'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The largest value is $21$ and the smallest is $9$. The range is the difference of these two, $21-9=12$.'
          - problem: 'The noon temperatures on five days were $7, 2, 9, 4$ and $6$ °C. What is the range of the temperatures?'
            answer: '7'
            answer_contract: {"kind": "unit", "quantity": "temperature", "unit": "°C", "allow_omitted": true}
            solution_sketch: 'The highest temperature is $9$ °C and the lowest is $2$ °C. The range is $9-2=7$ °C.'
          - problem: 'The shortest song at a concert lasts $9$ minutes and the longest lasts $31$ minutes. What is the range of the song lengths?'
            answer: '22'
            answer_contract: {"kind": "unit", "quantity": "time", "unit": "min", "allow_omitted": true}
            solution_sketch: 'The range is the longest length minus the shortest length. So the range of the song lengths is $31-9=22$ minutes.'
          - problem: 'The lightest of some parcels has a mass of $12$ kg, and the masses have a range of $18$ kg. What is the mass of the heaviest parcel?'
            answer: '30'
            answer_contract: {"kind": "unit", "quantity": "mass", "unit": "kg", "allow_omitted": true}
            solution_sketch: 'The range is the largest mass minus the smallest, so $18=\text{max}-12$. Adding $12$ to both sides gives the heaviest mass, $30$ kg.'
          - problem: 'The prices of some books have a range of $24$ euros, and the dearest book costs $40$ euros. What is the price of the cheapest book?'
            answer: '16'
            answer_contract: {"kind": "unit", "quantity": "euro", "unit": "euro", "allow_omitted": true}
            solution_sketch: 'The range is the largest price minus the smallest, so $24=40-\text{min}$. Then the cheapest price is $40-24=16$ euros.'
          - problem: 'The temperatures during a week were $-5, 3, 0, -2, 8$ and $4$ °C. What is the range?'
            answer: '13'
            answer_contract: {"kind": "unit", "quantity": "temperature", "unit": "°C", "allow_omitted": true}
            solution_sketch: 'The highest temperature is $8$ °C and the lowest is $-5$ °C. The range is $8-(-5)=13$ °C.'
          - problem: 'Sam says the range of $8, 3, 11, 6$ is $11-8=3$, the largest value minus the first value in the list. What is the correct range?'
            answer: '8'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The range is the largest value minus the smallest value, not minus the first value in the list. Here that is $11-3=8$.'
        constraints: "4-6 small integers, unsorted, or a minimum, a maximum and a range with one of them missing; some values are negative"
      - id: kp2
        name: "Quartiles and IQR"
        key_prerequisites: [mean-median-mode]
        step_check:
          step: 'the median of the lower half is the average of $6$ and $7$'
          question: 'Why is $Q_1$ the average of $6$ and $7$?'
          options:
            - 'The two values nearest the median of all the data are averaged'
            - '$Q_1$ is always the mean of the second and third values of the data'
            - 'Averaging the smallest values gives the lowest quarter of the data'
            - 'The lower half has four values, so the middle two are averaged'
          answer: 'The lower half has four values, so the middle two are averaged'
          why: '$Q_1$ is the median of the lower half, and a half with four values has its median between the second and the third value.'
        exemplars:
          - problem: 'Find the interquartile range of $2, 4, 5, 7, 9, 10, 12$. (Leave the median out of both halves.)'
            answer: '6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The median is $7$. The lower half $2, 4, 5$ has median $4$, so $Q_1=4$. The upper half $9, 10, 12$ has median $10$, so $Q_3=10$, and the interquartile range is $10-4=6$.'
          - problem: 'Find the interquartile range of $1, 3, 5, 7, 9, 11, 13, 15$.'
            answer: '8'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The lower half is $1, 3, 5, 7$, so $Q_1=(3+5)/2=4$. The upper half is $9, 11, 13, 15$, so $Q_3=(11+13)/2=12$. The interquartile range is $12-4=8$.'
          - problem: 'Find the first quartile $Q_1$ of $3, 6, 8, 10, 12, 15, 18$. (Leave the median out of both halves.)'
            answer: '6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The median is $10$. The lower half is $3, 6, 8$, and its middle value is $6$, so $Q_1=6$.'
          - problem: 'Find the third quartile $Q_3$ of $1, 2, 4, 6, 8, 9, 11$. (Leave the median out of both halves.)'
            answer: '9'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The median is $6$. The upper half is $8, 9, 11$, and its middle value is $9$, so $Q_3=9$.'
          - problem: 'Seven runners finish a race in $2, 3, 5, 8, 10, 13$ and $14$ minutes. Leaving the median out of both halves, find the interquartile range of the times.'
            answer: '10'
            answer_contract: {"kind": "unit", "quantity": "time", "unit": "min", "allow_omitted": true}
            solution_sketch: 'The median time is $8$ minutes. The lower half $2, 3, 5$ gives $Q_1=3$, and the upper half $10, 13, 14$ gives $Q_3=13$. The interquartile range is $13-3=10$ minutes.'
          - problem: 'Find the first quartile $Q_1$ of $3, 6, 7, 9, 12, 15, 18, 21$.'
            answer: '13/2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'There are $8$ values, so the lower half is $3, 6, 7, 9$. Its median is the mean of the middle two values, so $Q_1=(6+7)/2=13/2$.'
          - problem: 'A team scored $4, 0, 2, 5, 1, 3, 2, 6$ and $3$ goals in nine matches. Leaving the median out of both halves, find the interquartile range of the goals.'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Sorted, the goals are $0, 1, 2, 2, 3, 3, 4, 5, 6$, and the median is $3$. The lower half $0, 1, 2, 2$ gives $Q_1=1.5$, and the upper half $3, 4, 5, 6$ gives $Q_3=4.5$. The interquartile range is $4.5-1.5=3$.'
          - problem: 'A data set has $Q_1=12$ and an interquartile range of $9$. What is $Q_3$?'
            answer: '21'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The interquartile range is $Q_3-Q_1$, so $9=Q_3-12$. Adding $12$ to both sides gives $Q_3=21$.'
          - problem: 'Sam says the interquartile range of $6, 8, 9, 12, 13, 15, 20$ is $20-6=14$. Leaving the median out of both halves, what is the correct interquartile range?'
            answer: '7'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Sam found the range, not the interquartile range. The median is $12$, the lower half $6, 8, 9$ gives $Q_1=8$, and the upper half $13, 15, 20$ gives $Q_3=15$. So the interquartile range is $15-8=7$.'
        constraints: "7-9 values; the median is left out of both halves when the count is odd; quartiles land on a value or on a half; the data is sorted or unsorted; the question asks for Q1, Q3 or the IQR, or gives two of the three"
      - id: kp3
        name: "Five-number summary and the 1.5-IQR outlier fence"
        key_prerequisites: [mean-median-mode]
        step_check:
          step: 'Upper fence = Q3 + 12'
          question: 'Why is $12$ added to $Q_3$ to get the upper fence?'
          options:
            - 'It is the widest gap above $Q_3$ that still counts as ordinary'
            - 'Adding $12$ finds the largest value that the whole data set has'
            - 'The fence is the median plus $12$, and $12$ is $1.5$ times the IQR'
          answer: 'It is the widest gap above $Q_3$ that still counts as ordinary'
          why: 'The $1.5\cdot\text{IQR}=12$ is the widest ordinary stretch beyond $Q_3$, so values past $Q_3+12$ are flagged.'
        exemplars:
          - problem: 'A boxplot has $Q_1=10$ and $Q_3=18$. What is the upper outlier fence $Q_3+1.5\cdot\text{IQR}$?'
            answer: '30'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The IQR is the difference of the quartiles, $18-10=8$. The upper fence adds $1.5$ times the IQR to $Q_3$, so it is $18+1.5\cdot 8=18+12=30$.'
          - problem: 'A data set has $Q_1=10$ and $Q_3=18$. Is the value $28$ an outlier by the $1.5\cdot\text{IQR}$ rule?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "yes, it is", "it is an outlier", "it is", "outlier", "an outlier"], ["no", "no, it is not", "it is not an outlier", "it is not", "not an outlier", "no outlier"]]}
            solution_sketch: 'The IQR is $8$, so $1.5\cdot 8=12$ and the upper fence is $18+12=30$. The value $28$ is below $30$, and it is also above the lower fence $10-12=-2$, so it is not an outlier.'
          - problem: 'Find the five-number summary (minimum, $Q_1$, median, $Q_3$, maximum) of $3, 5, 8, 9, 12, 15, 20$. (Leave the median out of both halves.)'
            answer: '3, 5, 9, 15, 20'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The minimum is $3$ and the maximum is $20$. The median is $9$. The lower half $3, 5, 8$ gives $Q_1=5$, and the upper half $12, 15, 20$ gives $Q_3=15$.'
          - problem: 'A data set has $Q_1=12$ and $Q_3=20$. What is the lower outlier fence $Q_1-1.5\cdot\text{IQR}$?'
            answer: '0'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The IQR is the difference of the quartiles, $20-12=8$. The lower fence subtracts $1.5$ times the IQR from $Q_1$, so it is $12-1.5\cdot 8=12-12=0$.'
          - problem: 'The marks in a class have $Q_1=20$ and $Q_3=30$. Marks above which value count as outliers by the $1.5\cdot\text{IQR}$ rule?'
            answer: '45'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The IQR is the difference of the quartiles, $30-20=10$. The upper fence is $30+1.5\cdot 10=30+15=45$, so marks above $45$ are outliers.'
          - problem: 'For the data $-12, 3, 5, 7, 9, 11, 13, 15, 40$, how many values are outliers by the $1.5\cdot\text{IQR}$ rule? (Leave the median out of both halves.)'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The median is $9$, so $Q_1=(3+5)/2=4$ and $Q_3=(13+15)/2=14$, and the IQR is $10$. The fences are $4-15=-11$ and $14+15=29$. Only $-12$ and $40$ lie outside them, so $2$ values are outliers.'
          - problem: 'The prices of the houses in a town have $Q_1=210$ and $Q_3=250$ thousand euros. A house costs $330$ thousand euros. Is its price an outlier by the $1.5\cdot\text{IQR}$ rule?'
            answer: 'yes'
            answer_contract: {"kind": "label", "options": [["yes", "yes, it is", "it is an outlier", "it is", "outlier", "an outlier"], ["no", "no, it is not", "it is not an outlier", "it is not", "not an outlier", "no outlier"]]}
            solution_sketch: 'The IQR is $250-210=40$, so $1.5\cdot 40=60$ and the upper fence is $250+60=310$. The price $330$ is above $310$, so it is an outlier.'
          - problem: 'A data set has $Q_1=40$ and an interquartile range of $16$. What is the upper outlier fence?'
            answer: '80'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Since the IQR is $Q_3-Q_1$, we get $Q_3=40+16=56$. The upper fence is $56+1.5\cdot 16=56+24=80$.'
        constraints: "IQR a small even integer so that 1.5*IQR is an integer; fences and candidate outliers are integers; the question asks for a fence, a verdict on one value, a count of outliers or the five-number summary of a data set of 7-9 values"
    diagnostic_exemplar:
      problem: 'For the sorted data $2, 4, 6, 10, 12, 14, 18$ (exclude the median from each half), compute the upper outlier fence $Q_3 + 1.5 \cdot \text{IQR}$.'
      answer: '29'
      solution_sketch: '$Q_1 = 4$, $Q_3 = 14$, IQR $= 10$; fence $= 14 + 15 = 29$.'
    anki_seeds:
      - front: 'IQR $=$ ?'
        back: '$Q_3 - Q_1$, the spread of the middle 50% of the data.'
        type: basic
      - front: 'The 1.5-IQR outlier fences are...'
        back: '$Q_1 - 1.5 \cdot \text{IQR}$ and $Q_3 + 1.5 \cdot \text{IQR}$; values outside them are flagged as outliers.'
        type: basic

  - id: deviations-and-variance
    name: "Deviations and Variance"
    core: true
    difficulty: 0.35
    drill: false
    answer_kind: numeric
    expected_time_secs: 150
    prerequisites:
      - id: mean-of-a-data-set
        weight: 0.7
        key: true
      - id: summation-notation
        weight: 0.5
        key: true
      - id: integer-multiplication-division
        weight: 0.3
        key: false
    knowledge_points:
      - id: kp1
        name: "Deviations from the mean"
        key_prerequisites: [mean-of-a-data-set]
        step_check:
          step: 'Deviations from the mean always sum to $0$'
          question: 'Why must the deviations from the mean always add up to $0$?'
          options:
            - 'Each deviation is divided by the number of values, giving zero'
            - 'Values above the mean exactly balance values below it'
            - 'The median is subtracted too, which cancels the positive ones'
            - 'Pairs of equal data values always cancel each other out'
          answer: 'Values above the mean exactly balance values below it'
          why: 'The mean is the balance point of the data, so the total distance above it equals the total distance below it and the signed deviations add to $0$.'
        try_first:
          problem: 'The values $1, 6, 8$ have mean $5$, and their deviations from the mean are $-4$, $1$ and $3$. What is the sum of the three deviations?'
          answer_contract: {"kind":"exact"}
          answer: '0'
          reveal: 'The sum is $0$: $-4 + 1 + 3 = 0$. The mean is the balance point of the data, so the distances above it always cancel the distances below it.'
        exemplars:
          - problem: 'The data $2, 4, 9$ has mean $5$. Find the deviation $x_i-\bar{x}$ of each value.'
            answer: '-3, -1, 4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The mean is 5. Subtract it from each value: 2 - 5 = -3, 4 - 5 = -1, 9 - 5 = 4. The deviations are -3, -1, 4.'
          - problem: 'The data $3, 7, 8$ has mean $6$. What is the deviation of the value $8$?'
            answer: '2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The deviation is the value minus the mean. So $8 - 6 = 2$, and the value $8$ lies $2$ above the mean.'
          - problem: 'A gardener measures her seedlings. The mean height is $14$ cm and one seedling is $9$ cm tall. What is the deviation of that seedling from the mean?'
            answer: '-5'
            answer_contract: {"kind":"unit","quantity":"length","unit":"cm","allow_omitted":true}
            solution_sketch: 'The deviation is the value minus the mean. So $9 - 14 = -5$ cm, which is negative because the seedling is below the mean.'
          - problem: 'The deviations of four values from their mean are $-4$, $-2$, $1$ and $x$. Find $x$.'
            answer: '5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The deviations from the mean always sum to $0$. So $-4 - 2 + 1 + x = 0$, which gives $-5 + x = 0$ and $x = 5$.'
          - problem: 'A bakery sold $18, 25, 21, 16$ and $30$ loaves on five days. Find the deviation of each day''s sales from the mean.'
            answer: '-4, 3, -1, -6, 8'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The mean is 22. Subtract it from each value: 18 - 22 = -4, 25 - 22 = 3, 21 - 22 = -1, 16 - 22 = -6, 30 - 22 = 8. The deviations are -4, 3, -1, -6, 8.'
          - problem: 'The data is $3, 5, 8, 12$. Find the deviations from the mean.'
            answer: '-4, -2, 1, 5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The mean is 7. Subtract it from each value: 3 - 7 = -4, 5 - 7 = -2, 8 - 7 = 1, 12 - 7 = 5. The deviations are -4, -2, 1, 5.'
          - problem: 'Sam works out the deviations of $1, 5, 9$ from their mean $5$ as $4, 0, 4$. What are the correct deviations?'
            answer: '-4, 0, 4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The deviation is the value minus the mean, so a value below the mean has a negative deviation. The correct deviations are $1 - 5 = -4$, $5 - 5 = 0$ and $9 - 5 = 4$.'
          - problem: 'A student''s score is $6$ points above the class mean of $40$. What was the score?'
            answer: '46'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'A deviation of $+6$ means the score minus the mean equals $6$. So the score is $40 + 6 = 46$.'
        constraints: "3-5 values with an integer mean; deviations are single-digit integers"
      - id: kp2
        name: "Squared deviations"
        key_prerequisites: [mean-of-a-data-set, summation-notation]
        step_check:
          step: 'Square each deviation'
          question: 'Why do we square each deviation before adding them?'
          options:
            - 'Squaring turns every deviation into a whole number'
            - 'Squaring lowers large deviations so that outliers matter less'
            - 'Squaring stops negative deviations cancelling positive ones'
            - 'Squaring makes the mean of the data equal to zero'
          answer: 'Squaring stops negative deviations cancelling positive ones'
          why: 'The deviations sum to $0$, so adding them tells nothing; squares are never negative, so the sum of squares grows as the data spreads out.'
        exemplars:
          - problem: 'The data $2, 4, 9$ has mean $5$. Find the sum of the squared deviations $\sum (x_i - \bar{x})^2$.'
            answer: '26'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The mean is 5, so the deviations are -3, -1, 4. Their squares are 9, 1, 16, and the sum is 26.'
          - problem: 'The data $1, 3, 5, 7$ has mean $4$. Find the sum of the squared deviations $\sum (x_i - \bar{x})^2$.'
            answer: '20'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The mean is 4, so the deviations are -3, -1, 1, 3. Their squares are 9, 1, 1, 9, and the sum is 20.'
          - problem: 'Five plants in a greenhouse are $5, 9, 10, 12$ and $14$ cm tall. Find the sum of the squared deviations of the heights from the mean.'
            answer: '46'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The mean is 10, so the deviations are -5, -1, 0, 2, 4. Their squares are 25, 1, 0, 4, 16, and the sum is 46.'
          - problem: 'Data set A is $4, 5, 6$ and data set B is $1, 5, 9$. Both have mean $5$. Which data set has the larger sum of squared deviations?'
            answer: 'B'
            answer_contract: {"kind": "label", "options": [["B", "data set B", "set B"], ["A", "data set A", "set A"]]}
            solution_sketch: 'Set A has squared deviations 1, 0, 1, which sum to 2. Set B has 16, 0, 16, which sum to 32, so set B is more spread out.'
          - problem: 'The data $1, 9, 4, x$ has mean $5$. Find the sum of the squared deviations.'
            answer: '34'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The four values add to $4 \times 5 = 20$, so $1 + 9 + 4 + x = 20$ and $x = 6$. The deviations are $-4, 4, -1, 1$, their squares are $16, 16, 1, 1$, and the sum is $34$.'
          - problem: 'A shop counted $3, 6, 8, 10$ and $13$ customers in its first hour on five days. Find the sum of the squared deviations from the mean number of customers.'
            answer: '58'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The mean is 8, so the deviations are -5, -2, 0, 2, 5. Their squares are 25, 4, 0, 4, 25, and the sum is 58.'
          - problem: 'Lena adds the deviations of $1, 2, 9$ from their mean $4$ and gets $0$, so she says the data has no spread. What is the sum of the squared deviations?'
            answer: '38'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Deviations always add to $0$, so the sum says nothing about spread. The deviations are $-3, -2, 5$, their squares are $9, 4, 25$, and the sum is $38$.'
        constraints: "3-5 values, integer mean; squared deviations sum below 100"
      - id: kp3
        name: "Population variance"
        key_prerequisites: [mean-of-a-data-set, summation-notation]
        step_check:
          step: 'Divide by the count: $\sigma^2 = 48/4 = 12$'
          question: 'Why do we divide the sum of squared deviations by the number of values $n$?'
          options:
            - 'The variance is the average of the squared deviations'
            - 'Dividing by $n$ turns the sum back into the original units'
            - 'The sum is always too large by a factor of $n$'
            - 'Dividing by $n$ makes the mean of the data equal to $0$'
          answer: 'The variance is the average of the squared deviations'
          why: 'Variance is defined as the mean squared deviation: the sum of squares is divided by $n$ so that data sets of different sizes can be compared.'
        exemplars:
          - problem: 'Find the population variance $\sigma^2$ of $1, 2, 3, 4, 5$.'
            answer: '2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The mean is 3. The squared deviations are 4, 1, 0, 1, 4, and they sum to 10. Dividing by the 5 values gives a variance of 2.'
          - problem: 'Find the population variance $\sigma^2$ of $2, 4, 6, 8$.'
            answer: '5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The mean is 5. The squared deviations are 9, 1, 1, 9, and they sum to 20. Dividing by the 4 values gives a variance of 5.'
          - problem: 'A coach records the number of laps completed by the five runners in her squad: $3, 5, 7, 9, 11$. Find the population variance of the laps.'
            answer: '8'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The mean is 7. The squared deviations are 16, 4, 0, 4, 16, and they sum to 40. Dividing by the 5 values gives a variance of 8.'
          - problem: 'The four people in a flat are $20, 24, 24$ and $32$ years old. Find the population variance of their ages.'
            answer: '19'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The mean is 25. The squared deviations are 25, 1, 1, 49, and they sum to 76. Dividing by the 4 values gives a variance of 19.'
          - problem: 'Find the population variance $\sigma^2$ of $0, 4, 6, 10$.'
            answer: '13'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The mean is 5. The squared deviations are 25, 1, 1, 25, and they sum to 52. Dividing by the 4 values gives a variance of 13.'
          - problem: 'A population of $8$ values has a sum of squared deviations of $56$. Find its variance.'
            answer: '7'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The population variance is the sum of squared deviations divided by the number of values. So $56 \div 8 = 7$.'
          - problem: 'A population of $10$ values has variance $6$. What is its sum of squared deviations?'
            answer: '60'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The variance is the sum of squared deviations divided by $10$. So the sum is the variance times $10$, which is $6 \times 10 = 60$.'
          - problem: 'A team scored $1, 2$ and $4$ goals in three matches. Find the population variance of the goals to two decimal places.'
            answer: '1.56'
            answer_contract: {"kind":"approx","decimals":2}
            solution_sketch: 'The mean is $7/3$. The squared deviations sum to $14/3$, and dividing by $3$ gives $14/9$, which is about $1.56$.'
          - problem: 'The population variance of five numbers is $2$. Four of the numbers are $4, 5, 7$ and $8$. Find the fifth number.'
            answer: '6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Write the fifth number as $x$. The five values add to $24 + x$, and the variance condition leaves $(x - 6)^2 = 0$, so $x = 6$. The numbers $4, 5, 6, 7, 8$ have mean $6$ and variance $(4 + 1 + 0 + 1 + 4)/5 = 2$.'
        constraints: "4-5 values with an integer mean; squared deviations sum to a multiple of n"
    diagnostic_exemplar:
      problem: 'Find the population variance $\sigma^2$ of $1, 3, 5, 7$.'
      answer: "5"
      solution_sketch: 'Mean $= 4$; squared deviations $9, 1, 1, 9$ sum to $20$; $\sigma^2 = 20/4 = 5$.'
    anki_seeds:
      - front: 'The deviations $x_i - \bar{x}$ always sum to...'
        back: '$0$ — that is why we square them before averaging.'
        type: basic
      - front: 'Population variance formula?'
        back: '$\sigma^2 = \frac{1}{n} \sum (x_i - \mu)^2$ — the mean squared deviation from the mean.'
        type: basic

  - id: variance-standard-deviation
    name: "Variance and Standard Deviation"
    core: true
    difficulty: 0.4
    drill: false
    answer_kind: numeric
    expected_time_secs: 180
    prerequisites:
      - id: deviations-and-variance
        weight: 0.8
        key: true
      - id: square-roots
        weight: 0.5
        key: true
      - id: simplifying-radicals
        weight: 0.3
        key: false
    knowledge_points:
      - id: kp1
        name: "Population standard deviation"
        key_prerequisites: [deviations-and-variance, square-roots]
        step_check:
          step: 'Take the square root'
          question: 'Why do we take the square root of the variance at the end?'
          options:
            - 'The variance can be negative, and the root makes it positive'
            - 'The variance is in squared units, and the root undoes that'
            - 'The square root makes the variance smaller than the range'
            - 'The root averages the squared deviations a second time'
          answer: 'The variance is in squared units, and the root undoes that'
          why: 'Squaring the deviations also squares their units, so the square root returns a spread measured in the same units as the data.'
        exemplars:
          - problem: 'Find the population standard deviation $\sigma$ of $5, 5, 9, 9$.'
            answer: '2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The mean is $7$ and every deviation is $2$ or $-2$. The variance is $16/4 = 4$, so $\sigma = \sqrt{4} = 2$.'
          - problem: 'Find the population standard deviation $\sigma$ of $1, 3, 5, 7, 9$.'
            answer: '2sqrt(2)'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The mean is $5$ and the squared deviations $16, 4, 0, 4, 16$ sum to $40$. The variance is $40/5 = 8$, so $\sigma = \sqrt{8} = 2\sqrt{2}$.'
          - problem: 'Find the population standard deviation $\sigma$ of $2, 4, 6, 8$.'
            answer: 'sqrt(5)'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The mean is $5$ and the squared deviations $9, 1, 1, 9$ sum to $20$. The variance is $20/4 = 5$, so $\sigma = \sqrt{5}$.'
          - problem: 'The four puppies in a litter weigh $2, 2, 8$ and $8$ kg. The puppies are the whole litter. Find the standard deviation of their weights.'
            answer: '3'
            answer_contract: {"kind":"unit","quantity":"mass","unit":"kg","allow_omitted":true}
            solution_sketch: 'The mean is $5$ kg and every squared deviation is $9$. The variance is $36/4 = 9$, so the standard deviation is $\sqrt{9} = 3$ kg.'
          - problem: 'A population has variance $18$. Find its standard deviation.'
            answer: '3sqrt(2)'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The standard deviation is the square root of the variance. So $\sigma = \sqrt{18} = \sqrt{9 \cdot 2} = 3\sqrt{2}$.'
          - problem: 'A machine filled all five cartons of a batch with $48, 49, 50, 51$ and $52$ ml of juice. Find the population standard deviation of the volumes to one decimal place.'
            answer: '1.4'
            answer_contract: {"kind":"approx","decimals":1}
            solution_sketch: 'The mean is $50$ ml and the squared deviations $4, 1, 0, 1, 4$ sum to $10$. The variance is $10/5 = 2$, so $\sigma = \sqrt{2}$, which is about $1.4$ ml.'
          - problem: 'A population of $9$ values has standard deviation $4$. What is its sum of squared deviations?'
            answer: '144'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The variance is $\sigma^2 = 16$. The variance is the sum of squared deviations divided by $9$, so the sum is $16 \times 9 = 144$.'
          - problem: 'Tom says that a population with variance $36$ has standard deviation $18$, because he halves $36$. What is the correct standard deviation?'
            answer: '6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The standard deviation is the square root of the variance, not half of it. So $\sigma = \sqrt{36} = 6$.'
        constraints: "variance a perfect square or of the form k^2 * m with small m; answer exact, radicals written as sqrt(...)"
      - id: kp2
        name: "Sample variance and standard deviation (divide by n-1)"
        key_prerequisites: [deviations-and-variance, square-roots]
        step_check:
          step: 'this is a sample, so we divide by $n-1$'
          question: 'Why does a sample use $n-1$ rather than $n$ in the denominator?'
          options:
            - 'One value is always thrown away because it is the largest'
            - 'A sample has one fewer value than its population has'
            - 'Deviations from the sample mean run small, so $n-1$ corrects for it'
            - 'Dividing by $n-1$ makes the sample variance equal the population variance'
          answer: 'Deviations from the sample mean run small, so $n-1$ corrects for it'
          why: 'The sample mean sits closer to the sample values than the true mean does, so squared deviations come out too small and dividing by $n-1$ makes up for that.'
        exemplars:
          - problem: 'Find the sample variance $s^2$ of the sample $6, 8, 10, 12, 14$.'
            answer: '10'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The mean is $10$ and the squared deviations $16, 4, 0, 4, 16$ sum to $40$. A sample divides by $n - 1 = 4$, so $s^2 = 40/4 = 10$.'
          - problem: 'A sample of $4$ values has squared deviations that sum to $27$. Find the sample variance $s^2$.'
            answer: '9'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'A sample divides the sum of squared deviations by $n - 1$. Here $n - 1 = 3$, so $s^2 = 27/3 = 9$.'
          - problem: 'Find the sample standard deviation $s$ of $6, 8, 10, 12, 14$ to one decimal place.'
            answer: '3.2'
            answer_contract: {"kind":"approx","decimals":1}
            solution_sketch: 'The sample variance is $40/4 = 10$. So $s = \sqrt{10}$, which is about $3.2$.'
          - problem: 'A nurse measures the resting pulse of a random sample of five patients: $62, 66, 70, 72$ and $80$ beats per minute. Find the sample variance of the pulse rates.'
            answer: '46'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The mean is $70$ and the squared deviations $64, 16, 0, 4, 100$ sum to $184$. A sample divides by $n - 1 = 4$, so $s^2 = 184/4 = 46$.'
          - problem: 'The numbers $3, 5, 7, 9$ are a random sample from a larger population. Find the sample variance to two decimal places.'
            answer: '6.67'
            answer_contract: {"kind":"approx","decimals":2}
            solution_sketch: 'The mean is $6$ and the squared deviations $9, 1, 1, 9$ sum to $20$. A sample divides by $n - 1 = 3$, so $s^2 = 20/3$, which is about $6.67$.'
          - problem: 'Treating $3, 5, 7, 9$ as a whole population gives a variance of $5$. Is the sample variance of the same four numbers larger or smaller than $5$?'
            answer: 'larger'
            answer_contract: {"kind": "label", "options": [["larger", "larger than 5", "bigger", "greater", "higher"], ["smaller", "smaller than 5", "less", "lower"]]}
            solution_sketch: 'The sum of squared deviations is $20$ in both cases. The sample variance divides by $3$ instead of $4$, so it is $20/3$, which is larger than $5$.'
          - problem: 'A sample of $5$ values has squared deviations that sum to $16$. Find the sample standard deviation $s$.'
            answer: '2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The sample variance divides by $n - 1 = 4$, so $s^2 = 16/4 = 4$. The standard deviation is $s = \sqrt{4} = 2$.'
          - problem: 'A sample of four swimmers has times of $30, 32, 33$ and $37$ seconds over $50$ m. Find the sample standard deviation of the times to one decimal place.'
            answer: '2.9'
            answer_contract: {"kind":"approx","decimals":1}
            solution_sketch: 'The mean is $33$ and the squared deviations $9, 1, 0, 16$ sum to $26$. The sample variance is $26/3$, so $s = \sqrt{26/3}$, which is about $2.9$ seconds.'
        constraints: "sum of squared deviations divisible by n-1; always say sample vs population explicitly"
      - id: kp3
        name: "Interpreting and transforming the standard deviation"
        key_prerequisites: [deviations-and-variance]
        step_check:
          step: 'Apply the scaling rule: $\sigma_{\text{new}} = |c| \sigma$'
          question: 'Why does tripling every value multiply the standard deviation by $3$?'
          options:
            - 'The variance is tripled, so the standard deviation is too'
            - 'The mean is tripled, so the spread must triple as well'
            - 'Each value moves by $3$, so the deviations grow by $3$'
            - 'Every deviation from the mean is also tripled'
          answer: 'Every deviation from the mean is also tripled'
          why: 'The mean triples along with the values, so each deviation $x - \bar{x}$ triples; the variance is multiplied by $9$ and the standard deviation by $3$.'
        try_first:
          problem: 'The data $1, 3$ has population standard deviation $1$. Every value is increased by $5$, giving $6, 8$. What is the population standard deviation of the new data?'
          answer_contract: {"kind":"exact"}
          answer: '1'
          reveal: 'It is still $1$. Both values moved by the same amount as the mean, so each is still $1$ away from the mean; shifting does not change the spread.'
        exemplars:
          - problem: 'A data set has standard deviation $4$. Every value is increased by $10$. What is the new standard deviation?'
            answer: '4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Adding $10$ to every value moves the mean by $10$ as well. So every deviation stays the same, and the standard deviation is still $4$.'
          - problem: 'A data set has standard deviation $3$. Every value is doubled. What is the new standard deviation?'
            answer: '6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Doubling every value doubles every deviation from the mean. So the standard deviation doubles to $2 \times 3 = 6$.'
          - problem: 'The heights of the pupils in a class have a standard deviation of $8$ cm. What is the standard deviation when the heights are written in millimetres?'
            answer: '80'
            answer_contract: {"kind":"unit","quantity":"length","unit":"mm","allow_omitted":true}
            solution_sketch: 'One centimetre is $10$ millimetres, so every height is multiplied by $10$. The standard deviation is multiplied by $10$ too, giving $80$ mm.'
          - problem: 'The marks in a test out of $100$ have a standard deviation of $12$ points. The teacher divides every mark by $10$ to give marks out of $10$. What is the new standard deviation?'
            answer: '1.2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Dividing every mark by $10$ divides every deviation by $10$. So the standard deviation is $12 \div 10 = 1.2$.'
          - problem: 'What is the standard deviation of the data $10, 10, 10, 10$?'
            answer: '0'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Every value equals the mean, so every deviation is $0$. The variance is $0$ and the standard deviation is $0$.'
          - problem: 'The daily temperatures in a city have a standard deviation of $5$ degrees Celsius. A weather site converts each temperature with $F = 1.8C + 32$. What is the standard deviation in degrees Fahrenheit?'
            answer: '9'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Adding $32$ does not change the spread. Multiplying by $1.8$ multiplies the standard deviation by $1.8$, so the new value is $1.8 \times 5 = 9$.'
          - problem: 'A data set has standard deviation $5$. Every value is tripled. What is the new standard deviation?'
            answer: '15'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Tripling every value triples every deviation from the mean. So the standard deviation is $3 \times 5 = 15$.'
          - problem: 'Every value in a data set is increased by $10$. Does the standard deviation increase, decrease or stay the same?'
            answer: 'stays the same'
            answer_contract: {"kind": "label", "options": [["stays the same", "stay the same", "the same", "unchanged", "no change", "does not change"], ["increases", "increase", "goes up", "gets larger"], ["decreases", "decrease", "goes down", "gets smaller"]]}
            solution_sketch: 'Adding $10$ to every value moves the mean up by $10$ too. Each value keeps the same distance from the mean, so the standard deviation stays the same.'
        constraints: "one transformation per problem (shift by a constant, or scale by a positive constant such as 2, 10 or 1/10); original sigma given or trivially 0"
    diagnostic_exemplar:
      problem: 'Find the sample standard deviation $s$ of $5, 7, 9, 11, 13$.'
      answer: 'sqrt(10)'
      solution_sketch: 'Mean $9$; squared deviations sum to $16 + 4 + 0 + 4 + 16 = 40$; $s^2 = 40/4 = 10$, so $s = \sqrt{10}$.'
    anki_seeds:
      - front: 'Sample variance divides the sum of squared deviations by...'
        back: '$n - 1$ (not $n$).'
        type: basic
      - front: 'Standard deviation is the {{c1::square root}} of the variance.'
        back: 'square root'
        type: cloze
      - front: 'Adding a constant to every data value changes the SD how? Multiplying by $c$?'
        back: 'Adding a constant: SD unchanged. Multiplying by $c$: SD multiplied by $|c|$.'
        type: basic

  - id: choosing-summary-statistics
    name: "Choosing an Appropriate Summary Statistic"
    core: false                # descriptive-summary branch; terminal
    difficulty: 0.4
    drill: false
    answer_kind: numeric
    expected_time_secs: 120
    prerequisites:
      - id: outliers-effect-on-center
        weight: 0.7
        key: true
      - id: range-iqr-boxplots
        weight: 0.5
        key: false
      - id: variance-standard-deviation
        weight: 0.5
        key: false
    knowledge_points:
      - id: kp1
        name: "Choosing a measure of center"
        key_prerequisites: [outliers-effect-on-center]
        step_check:
          step: 'Since there is an outlier, the median is the appropriate measure of center'
          question: 'Why does the outlier $80$ make the median a better choice than the mean?'
          options:
            - 'The median is always closer to the mean than any other value'
            - 'The mean cannot be found when a value is so large'
            - 'The median ignores how large $80$ is, but the mean rises'
            - 'The median uses every value, so $80$ is counted twice'
          answer: 'The median ignores how large $80$ is, but the mean rises'
          why: 'The median depends only on the middle of the ordered list, so $80$ could be $800$ without changing it; the mean uses the size of every value and is pulled up.'
        exemplars:
          - problem: 'A street has $20$ houses. Nineteen sold for about $300000$ dollars each and one sold for $3000000$ dollars. A newspaper wants to describe a typical sale price. Which measure of center suits the data best: the mean, the median or the mode?'
            answer: 'the median'
            answer_contract: {"kind": "label", "options": [["the median", "median"], ["the mean", "mean", "average"], ["the mode", "mode"]]}
            solution_sketch: 'One sale of $3000000$ dollars is far above the other nineteen, so it pulls the mean up. The median stays near $300000$ dollars, so it describes a typical sale.'
          - problem: 'Quiz scores were $2, 4, 5, 5, 6$ and $60$. The teacher wants the measure of center that best represents a typical score. What is its value?'
            answer: '5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The score $60$ is far above the rest, so the median suits better than the mean. The two middle scores are $5$ and $5$, so the median is $5$.'
          - problem: 'A store codes its book genres as $1$ for mystery, $2$ for fantasy and $3$ for romance. Five customers buy genres coded $1, 2, 1, 3, 1$. What code best represents a typical purchase?'
            answer: '1'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The numbers are labels for genres, so adding or ordering them means nothing. The most frequent code is $1$, which appears three times, so the mode is $1$.'
          - problem: 'Rainfall over four months was $4, 6, 8$ and $10$ inches, with no unusual months. What value best represents a typical month?'
            answer: '7'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The data is symmetric with no outlier, so the mean uses every value well. The mean is $(4 + 6 + 8 + 10)/4 = 28/4 = 7$ inches, and the median is also $7$.'
          - problem: 'A survey records each student''s favorite color: red, blue, red, green, red, blue. Which measure of center applies to this data: the mean, the median or the mode?'
            answer: 'the mode'
            answer_contract: {"kind": "label", "options": [["the mode", "mode"], ["the mean", "mean", "average"], ["the median", "median"]]}
            solution_sketch: 'Colors cannot be added or put in order, so the mean and the median have no meaning. Only the mode, the most frequent color, applies, and here it is red.'
          - problem: 'Household incomes, in thousands of dollars, were $20, 22, 24, 26, 28$ and $200$. What value best describes a typical household?'
            answer: '25'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The income $200$ is far above the rest, so the median suits better than the mean. The two middle incomes are $24$ and $26$, so the median is $25$ thousand dollars.'
          - problem: 'For the quiz scores $2, 4, 5, 5, 6$ and $60$, how much larger is the mean than the median, to two decimal places?'
            answer: '8.67'
            answer_contract: {"kind":"approx","decimals":2}
            solution_sketch: 'The mean is $82/6$, which is about $13.67$, and the median is $5$. The difference is about $8.67$, which shows how far the score $60$ pulls the mean.'
        constraints: "one clear driver per problem: outlier or skew -> median, symmetric numeric -> mean, categorical or coded labels -> mode; the choice is not named in the question"
      - id: kp2
        name: "Choosing a measure of spread"
        key_prerequisites: [outliers-effect-on-center, range-iqr-boxplots]
        step_check:
          step: 'The IQR describes the middle 50% and ignores the extremes'
          question: 'Why does the IQR go with the median rather than the range?'
          options:
            - 'The range is always smaller than the IQR'
            - 'Both the IQR and median ignore extreme values'
            - 'The IQR is found from the mean, like the median'
            - 'The range needs more than two numbers to calculate'
          answer: 'Both the IQR and median ignore extreme values'
          why: 'The median and the IQR depend only on the middle of the ordered data, while the range uses only the two extremes and jumps when one outlier appears.'
        exemplars:
          - problem: 'A data set is summarized by its median. Which measure of spread goes with the median: the range, the IQR or the standard deviation?'
            answer: 'the IQR'
            answer_contract: {"kind": "label", "options": [["the IQR", "IQR", "interquartile range"], ["the range", "range"], ["the SD", "SD", "the standard deviation", "standard deviation"]]}
            solution_sketch: 'The median resists outliers, so it needs a spread measure that resists them too. The IQR depends only on the quartiles, so it goes with the median.'
          - problem: 'A shop''s takings, in hundreds of dollars, on eight days were $10, 12, 13, 15, 16, 18, 19$ and $90$. What is the interquartile range of the takings?'
            answer: '6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The lower half is $10, 12, 13, 15$ with median $12.5$, and the upper half is $16, 18, 19, 90$ with median $18.5$. So the IQR is $18.5 - 12.5 = 6$.'
          - problem: 'A shop''s takings, in hundreds of dollars, on eight days were $10, 12, 13, 15, 16, 18, 19$ and $90$. How much larger is the range than the interquartile range?'
            answer: '74'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The range is $90 - 10 = 80$. The quartiles are $12.5$ and $18.5$, so the IQR is $6$, and $80 - 6 = 74$ shows how much the one extreme day inflates the range.'
          - problem: 'A symmetric data set with no outliers is summarized by its mean. Which measure of spread goes with the mean: the range, the IQR or the standard deviation?'
            answer: 'the SD'
            answer_contract: {"kind": "label", "options": [["the SD", "SD", "the standard deviation", "standard deviation"], ["the IQR", "IQR", "interquartile range"], ["the range", "range"]]}
            solution_sketch: 'The mean uses every value, and so does the standard deviation, which measures distances from the mean. They suit symmetric data with no outliers.'
          - problem: 'The salaries at a small firm, in thousands of dollars, are $30, 32, 34, 36$ and $38$. The manager''s salary of $200$ is added. By how much does the range grow?'
            answer: '162'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Before, the range is $38 - 30 = 8$. After, it is $200 - 30 = 170$, so the range grows by $170 - 8 = 162$ thousand dollars.'
          - problem: 'Two classes both have a median of $70$. The IQR of class A is $8$ and the IQR of class B is $20$. How many times as large is the spread of class B as that of class A, measured by the IQR?'
            answer: '2.5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Compare the IQRs by dividing: $20 \div 8 = 2.5$. So the middle half of class B is $2.5$ times as wide as that of class A.'
        constraints: "pairings (median with IQR, mean with SD, range uses only the extremes) and spread computed from a list of 5-8 values with unambiguous quartiles"
      - id: kp3
        name: "Inferring shape from mean vs median"
        key_prerequisites: [outliers-effect-on-center]
        step_check:
          step: 'The mean is $58$ and the median is $45$, so the mean sits above the median.'
          question: 'Why does a mean above the median point to a right-skewed distribution?'
          options:
            - 'The median is pulled toward the tail more than the mean is'
            - 'Skewed data always has its mean exactly halfway to the mode'
            - 'The mean is larger whenever the data has more than $50$ values'
            - 'High tail values pull the mean up more than the median'
          answer: 'High tail values pull the mean up more than the median'
          why: 'A few large values in the right tail raise the mean a lot but move the median only a little, so the mean ends up above the median.'
        exemplars:
          - problem: 'Salaries at a firm have mean $58000$ and median $49000$ dollars. Is the distribution of salaries left-skewed, right-skewed or roughly symmetric?'
            answer: 'right-skewed'
            answer_contract: {"kind": "label", "options": [["right-skewed", "right skewed", "skewed right", "skewed to the right", "positively skewed", "right-skew", "right"], ["left-skewed", "left skewed", "skewed left", "skewed to the left", "negatively skewed", "left-skew", "left"], ["symmetric", "roughly symmetric", "symmetrical"]]}
            solution_sketch: 'The mean is above the median, so a tail of high salaries pulls the mean up. A mean above the median means the distribution is right-skewed.'
          - problem: 'Test scores in a class have mean $40$ and median $55$. Is the distribution of scores left-skewed, right-skewed or roughly symmetric?'
            answer: 'left-skewed'
            answer_contract: {"kind": "label", "options": [["left-skewed", "left skewed", "skewed left", "skewed to the left", "negatively skewed", "left-skew", "left"], ["right-skewed", "right skewed", "skewed right", "skewed to the right", "positively skewed", "right-skew", "right"], ["symmetric", "roughly symmetric", "symmetrical"]]}
            solution_sketch: 'The mean is below the median, so a tail of low scores pulls the mean down. A mean below the median means the distribution is left-skewed.'
          - problem: 'A distribution has mean $58$ and median $45$. What is the mean minus the median?'
            answer: '13'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Subtract the median from the mean: $58 - 45 = 13$. The positive difference shows the mean is above the median.'
          - problem: 'Household incomes have mean $90$ and median $60$ thousand dollars. How many times as large as the median is the mean?'
            answer: '1.5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Compare the two by dividing the mean by the median: $90 \div 60 = 1.5$. So the mean is $1.5$ times the median, a sign of right skew.'
          - problem: 'Five deliveries took $40, 42, 45, 48$ and $100$ minutes. Find the mean minus the median of the delivery times.'
            answer: '10'
            answer_contract: {"kind":"unit","quantity":"time","unit":"min","allow_omitted":true}
            solution_sketch: 'The mean is $275/5 = 55$ minutes and the median is $45$ minutes. So the mean minus the median is $55 - 45 = 10$ minutes, because the slow delivery pulls the mean up.'
          - problem: 'For a data set the mean is $30$ and the median is $45$. What is the mean minus the median?'
            answer: '-15'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Subtract the median from the mean: $30 - 45 = -15$. The negative difference shows the mean is below the median.'
          - problem: 'A distribution is symmetric and has median $70$. What is its mean?'
            answer: '70'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'A symmetric distribution balances around its center. So the mean and the median are equal, and the mean is $70$.'
        constraints: "give mean and median (or a shape description); ask for the skew direction or for a comparison of the mean and median (difference or ratio)"
    diagnostic_exemplar:
      problem: 'Household incomes in a city include a small number of extremely high earners. Which center-and-spread pair should a summary report, and why?'
      answer: 'Median and IQR; both resist the extreme high incomes that would inflate the mean and standard deviation.'
      answer_contract: {kind: none}
      solution_sketch: 'Ask which summaries are resistant: the mean and standard deviation are dragged upward by the few extreme incomes, while the median and IQR depend only on position in the ordered data.'
    anki_seeds:
      - front: 'Skewed data or outliers: report which center-spread pair?'
        back: 'Median with IQR (both are resistant).'
        type: basic
      - front: 'Right-skewed distribution: mean vs median?'
        back: 'Mean $>$ median (the tail pulls the mean).'
        type: basic

  - id: z-scores
    name: "Z-Scores"
    core: true
    difficulty: 0.4
    drill: false
    answer_kind: numeric
    expected_time_secs: 90
    prerequisites:
      - id: variance-standard-deviation
        weight: 0.8
        key: true
      - id: decimal-operations
        weight: 0.4
        key: false
    knowledge_points:
      - id: kp1
        name: "Computing a z-score"
        key_prerequisites: [variance-standard-deviation]
        step_check:
          step: 'Plug the values into the z-score formula'
          question: 'Why do we divide the difference $x-\mu$ by the standard deviation?'
          options:
            - 'It converts the difference into a percent of the mean'
            - 'It makes every z-score a positive number'
            - 'It measures the distance in units of standard deviation'
            - 'It removes the effect of the outliers in the whole data set'
          answer: 'It measures the distance in units of standard deviation'
          why: 'The difference $x-\mu$ is a distance in the units of the data; dividing by $\sigma$ counts how many standard deviations fit in that distance.'
        try_first:
          problem: 'A test has mean $80$ and standard deviation $5$. Ana scores $90$. How many standard deviations above the mean is her score?'
          answer_contract: {"kind":"exact"}
          answer: '2'
          reveal: 'It is $2$ standard deviations above the mean, because $(90 - 80)/5 = 2$. That count of standard deviations is the z-score.'
        exemplars:
          - problem: 'An exam has mean $70$ and standard deviation $4$. Find the z-score of a mark of $62$.'
            answer: '-2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The z-score is z = (x - mean)/standard deviation. So z = (62 - 70)/4 = -8/4 = -2.'
          - problem: 'A value of $130$ comes from a distribution with mean $100$ and standard deviation $15$. Find its z-score.'
            answer: '2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The z-score is z = (x - mean)/standard deviation. So z = (130 - 100)/15 = 30/15 = 2.'
          - problem: 'A runner finishes a race in $75$ seconds. The mean time is $70$ seconds and the standard deviation is $10$ seconds. Find the runner''s z-score.'
            answer: '0.5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The z-score is z = (x - mean)/standard deviation. So z = (75 - 70)/10 = 5/10 = 0.5.'
          - problem: 'A package weighs $23$ g. In its population the mean weight is $26$ g and the standard deviation is $2$ g. Find its z-score.'
            answer: '-1.5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The z-score is z = (x - mean)/standard deviation. So z = (23 - 26)/2 = -3/2 = -1.5.'
          - problem: 'A temperature of $17$ degrees is in a distribution with mean $20$ and standard deviation $4$. Find its z-score.'
            answer: '-0.75'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The z-score is z = (x - mean)/standard deviation. So z = (17 - 20)/4 = -3/4 = -0.75.'
          - problem: 'A mark of $8.5$ out of $10$ comes from a distribution with mean $7$ and standard deviation $0.5$. Find its z-score.'
            answer: '3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The z-score is z = (x - mean)/standard deviation. So z = (8.5 - 7)/0.5 = 1.5/0.5 = 3.'
          - problem: 'A girl is $158$ cm tall. Girls of her age have mean height $150$ cm and standard deviation $6$ cm. Find her z-score to two decimal places.'
            answer: '1.33'
            answer_contract: {"kind":"approx","decimals":2}
            solution_sketch: 'Use z = (x - mean)/standard deviation. So z = $(158 - 150)/6 = 8/6$, which is about $1.33$.'
          - problem: 'Find the z-score of the value $9$ in the population $5, 5, 9, 9$.'
            answer: '1'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The mean is $7$ and the variance is $16/4 = 4$, so the standard deviation is $2$. Then $z = (9 - 7)/2 = 1$.'
        constraints: "x - mu divisible by sigma or ending in .5; include negative z-scores"
      - id: kp2
        name: "Solving for x, mu, or sigma"
        key_prerequisites: [variance-standard-deviation]
        step_check:
          step: 'Rearrange: x = μ + z·σ'
          question: 'Why is the value $x$ equal to $\mu + z\sigma$?'
          options:
            - 'The value lies $z$ standard deviations from the mean'
            - 'The z-score is added to the mean to shift all values'
            - 'Multiplying $\sigma$ by $z$ gives the mean directly'
            - 'A z-score is measured from zero, not from the mean'
          answer: 'The value lies $z$ standard deviations from the mean'
          why: 'Each standard deviation is $\sigma$ long, so $z$ of them make a distance $z\sigma$ from the mean; adding it to $\mu$ lands on $x$.'
        exemplars:
          - problem: 'A value has $z = 1.5$ in a distribution with mean $100$ and standard deviation $10$. Find the value.'
            answer: '115'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Rearrange the z-score formula to $x = \mu + z\sigma$. So $x = 100 + 1.5 \times 10 = 115$.'
          - problem: 'A value of $40$ has $z = -2$ in a distribution with standard deviation $5$. Find the mean.'
            answer: '50'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The z-score gives $-2 = (40 - \mu)/5$, so $40 - \mu = -10$. Then $\mu = 50$.'
          - problem: 'A value of $19$ has $z = 2$ in a distribution with mean $15$. Find the standard deviation.'
            answer: '2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The z-score gives $2 = (19 - 15)/\sigma = 4/\sigma$. So $\sigma = 4 \div 2 = 2$.'
          - problem: 'A newborn weighs $2.2$ kg, which gives a z-score of $-1.5$. The mean newborn weight is $3.4$ kg. Find the standard deviation of newborn weights.'
            answer: '0.8'
            answer_contract: {"kind":"unit","quantity":"mass","unit":"kg","allow_omitted":true}
            solution_sketch: 'The z-score gives $-1.5 = (2.2 - 3.4)/\sigma = -1.2/\sigma$. So $\sigma = 1.2 \div 1.5 = 0.8$ kg.'
          - problem: 'On a test with mean $60$, a score of $72$ has $z = 1.5$. Find the standard deviation of the scores.'
            answer: '8'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The z-score gives $1.5 = (72 - 60)/\sigma = 12/\sigma$. So $\sigma = 12 \div 1.5 = 8$.'
          - problem: 'A student scores $23$, which has $z = 1.5$, on a test with standard deviation $4$. Find the mean score.'
            answer: '17'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The z-score gives $1.5 = (23 - \mu)/4$, so $23 - \mu = 6$. Then $\mu = 23 - 6 = 17$.'
          - problem: 'A value has $z = -3$ in a distribution with mean $80$ and standard deviation $6$. Find the value.'
            answer: '62'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Use $x = \mu + z\sigma$. So $x = 80 + (-3) \times 6 = 80 - 18 = 62$.'
          - problem: 'A battery lasts $17$ hours, which is $2.5$ standard deviations above the mean of $14$ hours. Find the standard deviation.'
            answer: '1.2'
            answer_contract: {"kind":"unit","quantity":"time","unit":"hour","allow_omitted":true}
            solution_sketch: 'The z-score is $2.5 = (17 - 14)/\sigma = 3/\sigma$. So $\sigma = 3 \div 2.5 = 1.2$ hours.'
        constraints: "one unknown among x, mu, sigma; all quantities integers or ending in .5"
      - id: kp3
        name: "Comparing values across distributions"
        key_prerequisites: [variance-standard-deviation]
        step_check:
          step: 'Compare the z-scores: $2 > 1$'
          question: 'Why compare z-scores instead of the raw scores?'
          options:
            - 'Raw scores from different tests can never be compared fairly'
            - 'The larger raw score always has the larger z-score'
            - 'A z-score is the percent of students scoring below the value'
            - 'Each score is measured against its own mean and spread'
          answer: 'Each score is measured against its own mean and spread'
          why: 'A raw score means little without its test''s mean and spread; the z-score counts how many standard deviations the score is above its own mean, so tests on different scales compare fairly.'
        exemplars:
          - problem: 'Test A has mean $6$ and standard deviation $1$. Test B has mean $7$ and standard deviation $1.5$. Both are marked out of $10$. Anna scores $8$ on test A and Ben scores $8.5$ on test B. Who did relatively better?'
            answer: 'Anna'
            answer_contract: {"kind": "label", "options": [["Anna", "Anna did", "test A", "A"], ["Ben", "Ben did", "test B", "B"]]}
            solution_sketch: 'Anna''s z-score is $(8 - 6)/1 = 2$ and Ben''s is $(8.5 - 7)/1.5 = 1$. Anna is further above her own test mean, so she did relatively better.'
          - problem: 'Class 1 has mean $70$ and standard deviation $8$. Class 2 has mean $60$ and standard deviation $10$. A student scores $82$ in class 1 and another scores $74$ in class 2. What is the larger of the two z-scores?'
            answer: '1.5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'In class 1, $z = (82 - 70)/8 = 1.5$. In class 2, $z = (74 - 60)/10 = 1.4$, so the larger z-score is $1.5$.'
          - problem: 'Machine A fills bottles with mean mass $500$ g and standard deviation $5$ g. Machine B has mean $500$ g and standard deviation $10$ g. A bottle from A weighs $508$ g and a bottle from B weighs $512$ g. Which bottle is more unusual for its own machine?'
            answer: 'the bottle from A'
            answer_contract: {"kind": "label", "options": [["the bottle from A", "bottle from A", "from A", "machine A", "A"], ["the bottle from B", "bottle from B", "from B", "machine B", "B"]]}
            solution_sketch: 'The bottle from A has $z = 8/5 = 1.6$ and the bottle from B has $z = 12/10 = 1.2$. The A bottle lies further from its own mean in standard deviations, so it is more unusual.'
          - problem: 'Runner A has mean finish time $40$ minutes and standard deviation $5$ minutes. Runner B has mean $50$ minutes and standard deviation $4$ minutes. A run by A took $35$ minutes and a run by B took $44$ minutes. Find the z-score of the run that is more unusual for its runner.'
            answer: '-1.5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The z-score of the run by A is $(35 - 40)/5 = -1$ and that of the run by B is $(44 - 50)/4 = -1.5$. The size $1.5$ is larger, so the run by B is more unusual and its z-score is $-1.5$.'
          - problem: 'Mia scores $90$ in French, where the mean is $78$ and the standard deviation is $4$. She scores $48$ in art, where the mean is $40$ and the standard deviation is $5$. By how much does her z-score in French exceed her z-score in art?'
            answer: '1.4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Her French z-score is $(90 - 78)/4 = 3$ and her art z-score is $(48 - 40)/5 = 1.6$. The difference is $3 - 1.6 = 1.4$.'
          - problem: 'Leo scores $80$ on a maths test with mean $65$ and standard deviation $10$. The science test has mean $70$ and standard deviation $5$. What score on the science test would give Leo the same z-score as his maths score?'
            answer: '77.5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'His maths z-score is $(80 - 65)/10 = 1.5$. On the science test he needs $x = 70 + 1.5 \times 5 = 77.5$.'
        constraints: "two distributions with different means and SDs; z-scores come out to clean values like 1, 1.5, 2"
