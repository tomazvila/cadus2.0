        back: 'Divide the $A$-and-$B$ cell by the total for $B$ (restrict to $B$''s row or column).'
        type: basic
      - front: 'Is $P(A \mid B)$ the same as $P(B \mid A)$?'
        back: 'No — they condition on different groups (different denominators).'
        type: basic

  - id: conditional-probability
    name: "Conditional Probability & the Multiplication Rule"
    core: true
    difficulty: 0.45
    drill: false
    answer_kind: numeric
    expected_time_secs: 150
    prerequisites:
      - id: conditional-probability-from-tables
        weight: 0.7
        key: true
      - id: multiplying-fractions
        weight: 0.5
        key: false
      - id: addition-rule-complements
        weight: 0.3
        key: false
    knowledge_points:
      - id: kp1
        name: "Conditional probability from the definition"
        key_prerequisites: [conditional-probability-from-tables]
        step_check:
          step: 'Apply the conditional probability formula'
          question: 'Why does $P(B)$ stand in the denominator of the formula for $P(A\mid B)$?'
          options:
            - 'The event $B$ is the less likely event, so it must be the denominator here'
            - 'The given event $B$ is the new whole, so the overlap is compared with it'
            - 'Denominators in probability formulas always hold the event named second'
            - 'Dividing by $P(B)$ always makes the answer larger than $P(A\cap B)$'
          answer: 'The given event $B$ is the new whole, so the overlap is compared with it'
          why: 'Once $B$ is known to have happened, only outcomes in $B$ remain, so the share of them that also lie in $A$ is $P(A\cap B)/P(B)$.'
        exemplars:
          - problem: 'A fair die is rolled. Find $P(\text{the roll is }2\mid\text{the roll is even})$.'
            answer: '1/3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The condition restricts the outcomes to $\{2,4,6\}$. One of these three outcomes is a $2$, so the probability is $1/3$.'
          - problem: 'Given $P(A\cap B)=3/10$ and $P(B)=3/5$, find $P(A\mid B)$.'
            answer: '1/2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Use the definition $P(A\mid B)=P(A\cap B)/P(B)$ here. Dividing by $3/5$ means multiplying by $5/3$, so $(3/10)(5/3)=15/30=1/2$.'
          - problem: 'A fair six-sided die is rolled. Find the probability that the roll is even given that the roll is greater than $3$.'
            answer: '2/3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The condition leaves the rolls $4$, $5$ and $6$. Two of these, $4$ and $6$, are even, so the probability is $2/3$.'
          - problem: 'In a school, $3/10$ of the students are in the choir and play a sport, and $2/5$ of all students are in the choir. What fraction of the choir students play a sport?'
            answer: '3/4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The fraction asked for is $P(\text{sport}\mid\text{choir})=P(\text{both})/P(\text{choir})$. Dividing by $2/5$ means multiplying by $5/2$, so $(3/10)(5/2)=15/20=3/4$.'
          - problem: 'A single card is drawn from a standard $52$-card deck. Find the probability that it is a face card given that it is a heart.'
            answer: '3/13'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The condition restricts the deck to the $13$ hearts. Three of them are face cards: the jack, the queen and the king. So the probability is $3/13$.'
          - problem: 'The probability that it rains on both Saturday and Sunday is $1/5$, and the probability that it rains on Sunday is $4/5$. Given that it rains on Sunday, what is the probability that it rained on Saturday?'
            answer: '1/4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Use $P(\text{Saturday}\mid\text{Sunday})=P(\text{both})/P(\text{Sunday})$. Dividing by $4/5$ means multiplying by $5/4$, so the probability is $(1/5)(5/4)=5/20=1/4$.'
          - problem: 'Two fair dice are rolled and the sum is $8$. Given this, what is the probability that both dice show the same number?'
            answer: '1/5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The sum $8$ occurs in five ways: $(2,6)$, $(3,5)$, $(4,4)$, $(5,3)$ and $(6,2)$. Only $(4,4)$ has equal dice, so the probability is $1/5$.'
        constraints: "small restricted sample spaces or given fraction pairs; exact fractions that divide cleanly"
      - id: kp2
        name: "The multiplication rule"
        key_prerequisites: [multiplying-fractions, conditional-probability-from-tables]
        step_check:
          step: 'The probability that both events happen is the probability of the first times the probability of the second given the first.'
          question: 'Why is the second factor $P(B\mid A)$ and not simply $P(B)$?'
          options:
            - 'Once $A$ has happened, the chance of $B$ may change, so the new chance is used'
            - 'The second factor is always smaller than the first, and $P(B\mid A)$ guarantees that'
            - 'The notation $P(B)$ is used only when $B$ happens before $A$'
            - 'Both factors must come from the same row of a table, as $P(B\mid A)$ does'
          answer: 'Once $A$ has happened, the chance of $B$ may change, so the new chance is used'
          why: 'The chance of $B$ can depend on whether $A$ happened, so the chain needs the chance of $B$ in the world where $A$ has happened.'
        exemplars:
          - problem: 'A student passes quiz 1 with probability $4/5$. Given that she passes quiz 1, she passes quiz 2 with probability $3/4$. Find the probability that she passes both quizzes.'
            answer: '3/5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Multiply the chance of the first pass by the chance of the second pass given the first. So $(4/5)(3/4)=12/20=3/5$.'
          - problem: 'Given $P(A)=1/2$ and $P(B\mid A)=1/3$, find $P(A\cap B)$.'
            answer: '1/6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'By the multiplication rule $P(A\cap B)=P(A)\,P(B\mid A)$, the two given values are multiplied. This gives $(1/2)(1/3)=1/6$.'
          - problem: 'A part passes inspection with probability $7/8$. Given that it passes, it is shipped with probability $4/7$. Find the probability that a part passes inspection and is shipped.'
            answer: '1/2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Multiply the pass probability by the shipping probability given a pass. This gives $(7/8)(4/7)=28/56=1/2$.'
          - problem: 'For events $A$ and $B$, $P(A)=3/4$ and $P(A\cap B)=1/2$. Find $P(B\mid A)$.'
            answer: '2/3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The rule $P(A\cap B)=P(A)\,P(B\mid A)$ gives $P(B\mid A)=P(A\cap B)/P(A)$. So $P(B\mid A)=(1/2)(4/3)=4/6=2/3$ for these two events.'
          - problem: 'For events $A$ and $B$, $P(B\mid A)=1/2$ and $P(A\cap B)=3/8$. Find $P(A)$.'
            answer: '3/4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'From $P(A\cap B)=P(A)\,P(B\mid A)$ we get $P(A)=P(A\cap B)/P(B\mid A)$. So $P(A)=(3/8)(2)=3/4$ for these two events.'
          - problem: 'One quarter of all households in a town own both a car and a bike, and $2/3$ of all households own a car. What fraction of the households that own a car also own a bike?'
            answer: '3/8'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The question asks for $P(\text{bike}\mid\text{car})$, which is the overlap divided by $P(\text{car})$. So $(1/4)\div(2/3)=(1/4)(3/2)=3/8$.'
          - problem: 'Of the emails that arrive, $3/5$ are spam, and $1/4$ of the spam emails contain a link. What fraction of all emails are spam emails with a link?'
            answer: '3/20'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The fraction of spam emails with a link is the product of two parts. It is $P(\text{spam})\,P(\text{link}\mid\text{spam})=(3/5)(1/4)=3/20$.'
        constraints: "two events; given probabilities are simple fractions; products reduce cleanly"
      - id: kp3
        name: "Multiplication rule without replacement"
        key_prerequisites: [multiplying-fractions]
        step_check:
          step: 'find the probability of drawing a green marble on the second draw'
          question: 'Why is the second probability $\frac{3}{6}$ and not $\frac{4}{7}$?'
          options:
            - 'The first draw removed a yellow marble, so $6$ marbles remain'
            - 'The second draw is less likely than the first, so its fraction is smaller'
            - 'One green marble has left the bag, so $3$ green marbles remain among $6$'
            - 'Both fractions describe the same bag, so they are equal after reducing'
          answer: 'One green marble has left the bag, so $3$ green marbles remain among $6$'
          why: 'The marble drawn first is not replaced, so the bag now holds $3$ green marbles among $6$, and the second probability is $3/6$.'
        exemplars:
          - problem: 'A bag holds $5$ red marbles and $3$ blue marbles. Two marbles are drawn without replacement. Find the probability that both marbles are red.'
            answer: '5/14'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The first marble is red with probability $5/8$. Then $4$ red marbles remain among $7$, so the second is red with probability $4/7$. The product is $20/56=5/14$.'
          - problem: 'Two cards are drawn without replacement from a standard $52$-card deck. Find the probability that both cards are hearts.'
            answer: '1/17'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The first card is a heart with probability $13/52=1/4$. Then $12$ hearts remain among $51$ cards. So the probability is $(1/4)(12/51)=12/204=1/17$.'
          - problem: 'A bag holds $3$ red marbles and $2$ blue marbles. Two marbles are drawn without replacement. Find the probability that both marbles are red.'
            answer: '3/10'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The first marble is red with probability $3/5$. Then $2$ red marbles remain among $4$, so the second is red with probability $2/4$. The product is $6/20=3/10$.'
          - problem: 'A bag holds $4$ red marbles and $5$ blue marbles. Two marbles are drawn without replacement. Find the probability that the first marble is red and the second marble is blue.'
            answer: '5/18'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The first marble is red with probability $4/9$. The red marble stays out, so $5$ blue marbles remain among $8$. The product is $20/72=5/18$.'
          - problem: 'A box holds $8$ batteries, and $3$ of them are dead. Two batteries are picked without replacement. Find the probability that both are dead.'
            answer: '3/28'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The first battery is dead with probability $3/8$. Then $2$ dead batteries remain among $7$. The product is $6/56=3/28$.'
          - problem: 'A class has $12$ students, and $5$ of them are left-handed. Two students are chosen at random, one after the other, without replacement. Find the probability that neither student is left-handed.'
            answer: '7/22'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'There are $7$ right-handed students among $12$, so the first is right-handed with probability $7/12$. Then $6$ right-handed students remain among $11$. The product is $42/132=7/22$.'
          - problem: 'A bag holds $3$ red marbles and $2$ blue marbles. Two marbles are drawn, and the first marble is put back before the second is drawn. Find the probability that both marbles are red.'
            answer: '9/25'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The first marble is returned, so the bag is the same for the second draw. Both draws are red with probability $3/5$, and the product is $9/25$.'
          - problem: 'A bag holds $6$ green marbles and $4$ yellow marbles. Two marbles are drawn without replacement. Find the probability that both marbles are green.'
            answer: '1/3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The first marble is green with probability $6/10=3/5$. Then $5$ green marbles remain among $9$. The product is $(3/5)(5/9)=15/45=1/3$.'
        constraints: 'at most 2 draws; bag sizes <= 12 except the deck; fractions reduce cleanly; one item replaces the marble to contrast'
    diagnostic_exemplar:
      problem: 'A bag holds $4$ red marbles and $2$ blue marbles. Two marbles are drawn without replacement. Find the probability that both marbles are red.'
      answer: '2/5'
      solution_sketch: 'The first marble is red with probability $4/6$. Then $3$ red marbles remain among $5$, so the product is $12/30=2/5$.'
    anki_seeds:
      - front: 'Definition of conditional probability?'
        back: '$P(A \mid B) = \frac{P(A \cap B)}{P(B)}$, for $P(B) > 0$.'
        type: basic
      - front: 'Multiplication rule?'
        back: '$P(A \cap B) = P(A) \cdot P(B \mid A)$.'
        type: basic

  - id: independent-events
    name: "Independence"
    core: true
    difficulty: 0.45
    drill: false
    answer_kind: numeric
    expected_time_secs: 120
    prerequisites:
      - id: conditional-probability
        weight: 0.8
        key: true
    knowledge_points:
      - id: kp1
        name: "Testing for independence"
        key_prerequisites: [conditional-probability]
        step_check:
          step: 'Two events are independent when the probability of both equals the product of their separate probabilities.'
          question: 'Why does a match with the product $P(A)P(B)$ show that the events are independent?'
          options:
            - 'It shows that the events can never happen together, so neither can affect the other'
            - 'It shows that the two probabilities are equal, so the events are alike'
            - 'It shows that learning of one event leaves the chance of the other unchanged'
            - 'It shows that the sum of the two probabilities is exactly one'
          answer: 'It shows that learning of one event leaves the chance of the other unchanged'
          why: 'If $P(A\cap B)=P(A)P(B)$, then $P(B\mid A)=P(B)$, so knowing that $A$ happened does not change the chance of $B$.'
        exemplars:
          - problem: 'In a class, the probability that a student plays an instrument is $1/2$, and the probability that a student walks to school is $1/3$. The probability that a student does both is $1/4$. Are playing an instrument and walking to school independent?'
            answer: 'not independent'
            answer_contract: {"kind": "label", "options": [["independent", "they are independent", "yes", "independent events", "the events are independent", "are independent"], ["not independent", "dependent", "no", "they are dependent", "not independent events", "the events are dependent", "are not independent", "they are not independent"]]}
            solution_sketch: 'Independent events satisfy $P(A\cap B)=P(A)P(B)$. Here $(1/2)(1/3)=1/6$, which is not $1/4$, so the events are not independent.'
          - problem: 'Events $A$ and $B$ have $P(A)=2/5$ and $P(B)=3/7$. If $A$ and $B$ are independent, find $P(A\cap B)$.'
            answer: '6/35'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'For independent events the probability of both is the product. So $(2/5)(3/7)=6/35$.'
          - problem: 'In a class of $40$ students, $22$ take Spanish and $15$ are in the band. If taking Spanish and being in the band were independent, what would be the probability that a randomly chosen student does both?'
            answer: '33/160'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Under independence the probability of both is the product $P(\text{Spanish})P(\text{band})$. This is $(22/40)(15/40)=330/1600=33/160$.'
          - problem: 'Events $A$ and $B$ have $P(A)=3/4$ and $P(B)=2/3$. What must $P(A\cap B)$ equal for $A$ and $B$ to be independent?'
            answer: '1/2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Independence means that $P(A\cap B)=P(A)P(B)$ holds exactly. So the value needed is $(3/4)(2/3)=6/12=1/2$.'
          - problem: 'A card is drawn from a standard $52$-card deck. Let $H$ be the event that it is a heart and $F$ the event that it is a face card. Then $P(H\cap F)=3/52$. Are $H$ and $F$ independent?'
            answer: 'independent'
            answer_contract: {"kind": "label", "options": [["independent", "they are independent", "yes", "independent events", "the events are independent", "are independent"], ["not independent", "dependent", "no", "they are dependent", "not independent events", "the events are dependent", "are not independent", "they are not independent"]]}
            solution_sketch: 'We have $P(H)=13/52=1/4$ and $P(F)=12/52=3/13$. The product is $(1/4)(3/13)=3/52$, which equals $P(H\cap F)$, so the events are independent.'
          - problem: 'Ana says that $A$ and $B$ with $P(A)=1/4$ and $P(B)=1/5$ are independent when $P(A\cap B)=1/4+1/5$. What must $P(A\cap B)$ be for $A$ and $B$ to be independent?'
            answer: '1/20'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Ana adds the probabilities, but independence needs the product. So $P(A\cap B)=(1/4)(1/5)=1/20$.'
          - problem: 'For events $A$ and $B$, $P(A)=1/2$ and $P(A\cap B)=1/6$. If $A$ and $B$ are independent, find $P(B)$.'
            answer: '1/3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'For independent events $P(A\cap B)=P(A)P(B)$, so $P(B)$ is the overlap divided by $P(A)$. Thus $P(B)=(1/6)(2)=1/3$.'
        constraints: 'probabilities given as fractions; the product either matches P(A and B) or clearly fails; at most 2 verdict items with different answers'
      - id: kp2
        name: "Computing with independent events"
        key_prerequisites: [conditional-probability]
        step_check:
          step: 'Multiply the probabilities since the events are independent.'
          question: 'Why can the two probabilities be multiplied in this problem?'
          options:
            - 'The spinner result does not change the chance of heads, so they multiply'
            - 'The two probabilities are added when the events happen together, and multiplied otherwise'
            - 'Every pair of events has a probability of both that equals the product'
            - 'The spinner has $4$ sections and the coin has $2$ sides, so the answer is a product'
          answer: 'The spinner result does not change the chance of heads, so they multiply'
          why: 'For independent events the chance of the second is the same whatever happens first, so $P(\text{both})=P(A)\,P(B)$.'
        try_first:
          problem: 'A fair coin is flipped and a fair four-sided die is rolled. How many equally likely outcomes are there?'
          answer_contract: {"kind": "exact"}
          answer: '8'
          reveal: 'Each of the $2$ coin results pairs with each of the $4$ die results, so there are $2\cdot4=8$ outcomes. One of them is heads and $3$, so the probability is $1/8=(1/2)(1/4)$, the product of the separate probabilities.'
        exemplars:
          - problem: 'A fair coin is flipped and a fair die is rolled. Find the probability of heads and a $6$.'
            answer: '1/12'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The coin and the die do not affect each other, so the two chances multiply. The result is $(1/2)(1/6)=1/12$.'
          - problem: 'A player makes each free throw with probability $3/5$, independently. Find the probability that she makes both of two free throws.'
            answer: '9/25'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The throws are independent, so the two chances multiply. The result is $(3/5)(3/5)=9/25$.'
          - problem: 'Two switches operate independently. Switch A is closed with probability $3/4$ and switch B is closed with probability $2/3$. Find the probability that both switches are closed.'
            answer: '1/2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The switches are independent, so the chances multiply. Thus the probability that both are closed is $P(\text{both})=(3/4)(2/3)=6/12=1/2$.'
          - problem: 'A system has three independent components. Component 1 works with probability $2/3$, component 2 with probability $3/4$, and component 3 with probability $1/5$. Find the probability that all three components work.'
            answer: '1/10'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The components are independent, so the three probabilities multiply. The result is $(2/3)(3/4)(1/5)=6/60=1/10$.'
          - problem: 'Two machines work independently. The probability that both work on a given day is $1/2$, and machine 1 works with probability $2/3$. What is the probability that machine 2 works?'
            answer: '3/4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'For independent events $P(\text{both})=P(1)\,P(2)$. So $P(2)$ is $1/2$ divided by $2/3$, which is $(1/2)(3/2)=3/4$.'
          - problem: 'A basketball player makes each free throw with probability $4/5$, independently. Find the probability that she makes the first throw and misses the second.'
            answer: '4/25'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A miss has probability $1-4/5=1/5$. The throws are independent, so the probability is $(4/5)(1/5)=4/25$.'
          - problem: 'A spinner has $4$ equal sections numbered $1$ to $4$, and a fair coin is flipped. Find the probability that the spinner lands on $3$ and the coin shows heads.'
            answer: '1/8'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The spinner and the coin are independent, so the two chances multiply. The result is $(1/4)(1/2)=1/8$.'
        constraints: "2-3 independent events; success probabilities are simple fractions"
      - id: kp3
        name: "At least one: complement of none"
        key_prerequisites: [conditional-probability]
        step_check:
          step: 'Subtract this from 1 to get the probability of at least one head.'
          question: 'Why is the probability of no head subtracted from $1$?'
          options:
            - 'The probability of no head is the smaller one, so it comes off the larger one'
            - 'Every outcome has no head or some head, so the two chances add to $1$'
            - 'Subtracting turns the chance of one head into the chance of every head'
            - 'The probability $1$ stands for the number of heads wanted'
          answer: 'Every outcome has no head or some head, so the two chances add to $1$'
          why: 'The events "no head" and "at least one head" cover all outcomes without overlap, so their probabilities total $1$.'
        try_first:
          problem: 'A fair coin is flipped $3$ times. How many of the $8$ equally likely outcomes show no head at all?'
          answer_contract: {"kind": "exact"}
          answer: '1'
          reveal: 'Only tails, tails, tails shows no head, so $1$ of the $8$ outcomes has no head. Every other outcome has at least one head, so the probability of at least one head is $1-1/8=7/8$.'
        exemplars:
          - problem: 'Two fair dice are rolled. Find the probability that at least one die shows a $6$.'
            answer: '11/36'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The probability that no die shows a $6$ is $(5/6)^2=25/36$. So the probability of at least one $6$ is $1-25/36=11/36$.'
          - problem: 'A spinner lands on red with probability $1/4$ on each spin, independently. Find the probability that it lands on red at least once in $3$ spins.'
            answer: '37/64'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'No red in three spins has probability $(3/4)^3=27/64$. So at least one red has probability $1-27/64=37/64$.'
          - problem: 'Three fair coins are flipped. Find the probability that at least one coin shows heads.'
            answer: '7/8'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'No heads has probability $(1/2)^3=1/8$. So at least one head has probability $1-1/8=7/8$.'
          - problem: 'Each part from a factory is defective with probability $1/5$, independently. A sample of four parts is checked. Find the probability that at least one part is defective.'
            answer: '369/625'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'No defective part has probability $(4/5)^4=256/625$. So at least one defective part has probability $1-256/625=369/625$.'
          - problem: 'A basketball player makes each free throw with probability $3/4$, independently. Find the probability that she makes at least one of four free throws.'
            answer: '255/256'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'She misses all four with probability $(1/4)^4=1/256$. So she makes at least one with probability $1-1/256=255/256$.'
          - problem: 'A biased coin lands heads with probability $1/6$ on each flip, independently. It is flipped three times. Find the probability that at least one flip shows heads.'
            answer: '91/216'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'No heads has probability $(5/6)^3=125/216$. So at least one head has probability $1-125/216=91/216$.'
          - problem: 'What is the smallest number of flips of a fair coin for which the probability of at least one head is greater than $0.99$?'
            answer: '7'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The probability of no head in $n$ flips is $(1/2)^n$, and we need $1-(1/2)^n>0.99$, that is $2^n>100$. Since $2^6=64$ and $2^7=128$, the smallest number is $7$.'
          - problem: 'Each of three independent tests detects a fault with the same probability $p$, and the probability that at least one test detects it is $19/27$. What is $p$?'
            answer: '1/3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The probability that no test detects the fault is $1-19/27=8/27$, which equals $(1-p)^3$. So $1-p=2/3$ and $p=1/3$.'
        constraints: "2-4 independent trials; force the complement route (direct enumeration would be tedious)"
    diagnostic_exemplar:
      problem: 'A spinner lands on red with probability $1/3$ on each spin, independently. Find the probability that it lands on red at least once in $3$ spins.'
      answer: '19/27'
      solution_sketch: 'No red in three spins has probability $(2/3)^3=8/27$. So at least one red has probability $1-8/27=19/27$.'
    anki_seeds:
      - front: '$A$ and $B$ are independent exactly when...'
        back: '$P(A \cap B) = P(A) \cdot P(B)$ (equivalently $P(A \mid B) = P(A)$).'
        type: basic
      - front: '"At least one" trick?'
        back: '$P(\text{at least one}) = 1 - P(\text{none})$.'
        type: basic

  - id: probability-tree-diagrams
    name: "Probability Tree Diagrams"
    core: false                # terminal; feeds only Bayes' theorem
    difficulty: 0.5
    drill: false
    answer_kind: numeric
    expected_time_secs: 180
    prerequisites:
      - id: conditional-probability
        weight: 0.8
        key: true
    knowledge_points:
      - id: kp1
        name: "Multiplying along branches"
        key_prerequisites: [conditional-probability]
        step_check:
          step: 'since the first ball drawn was green, there are now $3$ green and $3$ yellow balls left'
          question: 'Why is the second branch $\frac{3}{6}$ and not $\frac{3}{7}$?'
          options:
            - 'Drawing yellow second always has a smaller chance than drawing it first'
            - 'The first ball is not put back, so only $6$ balls remain'
            - 'The $3$ yellow balls are shared between the two draws, so each draw gets half'
            - 'A green first draw doubles the number of yellow balls in the bag'
          answer: 'The first ball is not put back, so only $6$ balls remain'
          why: 'Without replacement the bag changes: after one green ball leaves, $3$ yellow balls are among $6$ balls, so the branch is $\frac{3}{6}$.'
        exemplars:
          - problem: 'A bag holds $3$ red and $2$ blue marbles. Two marbles are drawn one after the other, without replacement. What is the probability that the first is red and the second is blue?'
            answer: '3/10'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The first marble is red with probability $\frac{3}{5}$. One red marble is gone, so $4$ marbles remain and $2$ of them are blue, which gives $\frac{2}{4}$ for the second branch. Multiply along the branches: $\frac{3}{5}\cdot\frac{2}{4}=\frac{3}{10}$.'
          - problem: 'A spinner lands on A with probability $\frac13$. It is spun twice. What is the probability that it lands on A both times?'
            answer: '1/9'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The spins do not affect each other, so the second branch is also $\frac{1}{3}$. Multiply along the branches: $\frac{1}{3}\cdot\frac{1}{3}=\frac{1}{9}$.'
          - problem: 'A jar holds $5$ green tokens and $4$ yellow tokens. Two tokens are drawn one after the other, without replacement. What is the probability that the first is green and the second is yellow?'
            answer: '5/18'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The first token is green with probability $\frac{5}{9}$. After a green token leaves, $8$ tokens remain and $4$ are yellow, so the second branch is $\frac{4}{8}$. Multiply: $\frac{5}{9}\cdot\frac{4}{8}=\frac{20}{72}=\frac{5}{18}$.'
          - problem: 'A machine makes a part that passes inspection with probability $\frac45$. Two parts are made and inspected independently. What is the probability that both pass?'
            answer: '16/25'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The two inspections are independent, so each pass branch has probability $\frac{4}{5}$. Multiply along the two branches: $\frac{4}{5}\cdot\frac{4}{5}=\frac{16}{25}$.'
          - problem: 'Two cards are dealt one after the other from a standard deck of $52$ cards, which has $4$ aces. What is the probability that the first card is an ace and the second card is not an ace?'
            answer: '16/221'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The first card is an ace with probability $\frac{4}{52}=\frac{1}{13}$. After one ace is dealt, $51$ cards remain and $48$ are not aces, so the second branch is $\frac{48}{51}=\frac{16}{17}$. Multiply: $\frac{1}{13}\cdot\frac{16}{17}=\frac{16}{221}$.'
          - problem: 'A seed germinates with probability $\frac37$. If it germinates, the seedling survives its first winter with probability $\frac25$. What is the probability that a seed germinates and its seedling survives the winter?'
            answer: '6/35'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The first branch is germination, with probability $\frac{3}{7}$. The second branch is survival given germination, with probability $\frac{2}{5}$. Multiply along the path: $\frac{3}{7}\cdot\frac{2}{5}=\frac{6}{35}$.'
          - problem: 'A cyclist meets two traffic lights that work independently of each other. The first is red with probability $\frac35$. The probability that both lights are red is $\frac{6}{25}$. What is the probability that the second light is red?'
            answer: '2/5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Both lights are red with probability $\frac{3}{5}\cdot p$, where $p$ is the probability that the second light is red. So $\frac{3}{5}\cdot p=\frac{6}{25}$. Divide by $\frac{3}{5}$: $p=\frac{6}{25}\cdot\frac{5}{3}=\frac{2}{5}$.'
          - problem: 'A bag holds $4$ red and $3$ blue marbles. Two marbles are drawn without replacement. Sam finds the probability of red first and blue second and writes $\frac47\cdot\frac37=\frac{12}{49}$. What is the correct probability?'
            answer: '2/7'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Sam used $\frac{3}{7}$ for the second branch, but the first marble is not put back. Only $6$ marbles remain, and $3$ of them are blue, so the second branch is $\frac{3}{6}$. The correct value is $\frac{4}{7}\cdot\frac{3}{6}=\frac{2}{7}$.'
        constraints: 'two-stage experiments, with or without replacement, or with independent stages; the question may also give the whole path and ask for one branch'
      - id: kp2
        name: "Adding across branches"
        key_prerequisites: [conditional-probability]
        step_check:
          step: 'Add the probabilities of the two paths'
          question: 'Why do we add the probabilities of the paths GY and YG instead of multiplying them?'
          options:
            - 'Both paths happen in the same experiment, so their chances combine by addition'
            - 'Each path is a separate branch of the tree, so the branches all add to $1$'
            - 'The two paths cannot both happen, and each gives exactly one green ball'
            - 'Multiplying would give a probability smaller than each path, which is not allowed'
          answer: 'The two paths cannot both happen, and each gives exactly one green ball'
          why: 'A draw follows GY or YG, never both. For events that exclude each other, the chance that one of them happens is the sum of their chances.'
        try_first:
          problem: 'Two fair coins are tossed. What is the probability that exactly one shows heads?'
          answer_contract: {"kind": "exact"}
          answer: '1/2'
          reveal: 'Heads then tails and tails then heads both give exactly one head. Each path has probability $\frac14$, and you add the two paths because only one of them can happen.'
        exemplars:
          - problem: 'A bag holds $3$ red and $2$ blue marbles. Two marbles are drawn without replacement. What is the probability that exactly one of them is red?'
            answer: '3/5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'There are two paths: red then blue, and blue then red. Red then blue has probability $\frac{3}{5}\cdot\frac{2}{4}=\frac{3}{10}$, and blue then red has probability $\frac{2}{5}\cdot\frac{3}{4}=\frac{3}{10}$. Add the paths: $\frac{3}{10}+\frac{3}{10}=\frac{3}{5}$.'
          - problem: 'On a given day it rains with probability $\frac13$. If it rains, the school bus is late with probability $\frac12$. If it does not rain, the bus is late with probability $\frac14$. What is the probability that the bus is late?'
            answer: '1/3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The bus is late on a rainy day or on a dry day. Rain then late has probability $\frac{1}{3}\cdot\frac{1}{2}=\frac{1}{6}$, and no rain then late has probability $\frac{2}{3}\cdot\frac{1}{4}=\frac{1}{6}$. Add the two paths: $\frac{1}{6}+\frac{1}{6}=\frac{1}{3}$.'
          - problem: 'A bag holds $5$ red and $4$ blue marbles. Two marbles are drawn without replacement. What is the probability that the two marbles have different colors?'
            answer: '5/9'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Different colors means red then blue, or blue then red. Red then blue has probability $\frac{5}{9}\cdot\frac{4}{8}=\frac{5}{18}$, and blue then red has probability $\frac{4}{9}\cdot\frac{5}{8}=\frac{5}{18}$. Add: $\frac{5}{18}+\frac{5}{18}=\frac{10}{18}=\frac{5}{9}$.'
          - problem: 'A delivery robot uses dock A with probability $\frac25$ and dock B with probability $\frac35$. At dock A it is on time with probability $\frac12$, and at dock B it is on time with probability $\frac34$. What is the probability that the robot is on time?'
            answer: '13/20'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The robot is on time through dock A or through dock B. Dock A gives $\frac{2}{5}\cdot\frac{1}{2}=\frac{4}{20}$ and dock B gives $\frac{3}{5}\cdot\frac{3}{4}=\frac{9}{20}$. Add the two paths: $\frac{4}{20}+\frac{9}{20}=\frac{13}{20}$.'
          - problem: 'A box holds $5$ good parts and $3$ defective parts. Two parts are taken out without replacement. What is the probability that exactly one of them is defective?'
            answer: '15/28'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Good then defective has probability $\frac{5}{8}\cdot\frac{3}{7}=\frac{15}{56}$. Defective then good has probability $\frac{3}{8}\cdot\frac{5}{7}=\frac{15}{56}$. Add the two paths: $\frac{15}{56}+\frac{15}{56}=\frac{30}{56}=\frac{15}{28}$.'
          - problem: 'A student passes mathematics with probability $\frac34$. If the student passes mathematics, the probability of passing physics is $\frac23$. If the student fails mathematics, the probability of passing physics is $\frac13$. What is the probability that the student passes physics?'
            answer: '7/12'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Passing physics happens after a pass or after a fail in mathematics. Pass then pass has probability $\frac{3}{4}\cdot\frac{2}{3}=\frac{6}{12}$, and fail then pass has probability $\frac{1}{4}\cdot\frac{1}{3}=\frac{1}{12}$. Add: $\frac{6}{12}+\frac{1}{12}=\frac{7}{12}$.'
          - problem: 'It rains on $\frac15$ of the days in a town. If it rains, the bus is late with probability $\frac12$. Over all days the bus is late with probability $\frac14$. What is the probability that the bus is late on a day without rain?'
            answer: '3/16'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Rain then late has probability $\frac{1}{5}\cdot\frac{1}{2}=\frac{1}{10}$. The rest of the total $\frac{1}{4}$ comes from dry days, so $\frac{4}{5}\cdot p=\frac{1}{4}-\frac{1}{10}=\frac{3}{20}$. Divide by $\frac{4}{5}$: $p=\frac{3}{20}\cdot\frac{5}{4}=\frac{3}{16}$.'
          - problem: 'A bag holds $4$ red and $3$ blue marbles. Two marbles are drawn without replacement. Mia finds the probability that exactly one is red and writes $\frac47\cdot\frac36=\frac27$. What is the correct probability?'
            answer: '4/7'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Mia found only the path red then blue. Exactly one red can also happen as blue then red, with probability $\frac{3}{7}\cdot\frac{4}{6}=\frac{2}{7}$. Add both paths: $\frac{2}{7}+\frac{2}{7}=\frac{4}{7}$.'
        constraints: 'exactly two disjoint paths to the target event; branch probabilities simple fractions; one item gives the total and asks for a missing branch'
      - id: kp3
        name: "Whole-tree reasoning"
        key_prerequisites: [conditional-probability]
        step_check:
          step: 'calculate the probability of the complement event, which is drawing no blue marbles'
          question: 'Why is it easier to find $P(\text{no blue})$ first when we want $P(\text{at least one blue})$?'
          options:
            - 'Only one path, red then red, has no blue; several paths have a blue'
            - 'Drawing no blue marbles is always the more likely event, so it is found first'
            - 'The probabilities along the paths with no blue marbles add up to $1$'
            - 'Paths that contain a blue marble cannot be multiplied along their branches'
          answer: 'Only one path, red then red, has no blue; several paths have a blue'
          why: 'The event "at least one blue" covers three paths, but its complement is the single path red then red, so one product and a subtraction from $1$ finish the job.'
        exemplars:
          - problem: 'A bag holds $4$ red and $2$ blue marbles. Two marbles are drawn without replacement. What is the probability that at least one of them is blue?'
            answer: '3/5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'No blue means red then red, with probability $\frac{4}{6}\cdot\frac{3}{5}=\frac{2}{5}$. The event "at least one blue" is the complement. So the probability is $1-\frac{2}{5}=\frac{3}{5}$.'
          - problem: 'A bag holds $3$ red and $2$ blue marbles. Two marbles are drawn without replacement. What is the probability that the second marble is red?'
            answer: '3/5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The second marble is red after a red first draw or after a blue first draw. Red then red has probability $\frac{3}{5}\cdot\frac{2}{4}=\frac{6}{20}$, and blue then red has probability $\frac{2}{5}\cdot\frac{3}{4}=\frac{6}{20}$. Add: $\frac{6}{20}+\frac{6}{20}=\frac{3}{5}$.'
          - problem: 'A jar holds $5$ red and $3$ blue marbles. Two marbles are drawn without replacement. What is the probability that at least one of them is blue?'
            answer: '9/14'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'No blue means red then red, with probability $\frac{5}{8}\cdot\frac{4}{7}=\frac{20}{56}=\frac{5}{14}$. Take the complement: $1-\frac{5}{14}=\frac{9}{14}$.'
          - problem: 'A box holds $4$ red and $3$ blue balls. Two balls are drawn without replacement. What is the probability that the second ball is blue?'
            answer: '3/7'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The second ball is blue after red then blue or after blue then blue. These paths have probabilities $\frac{4}{7}\cdot\frac{3}{6}=\frac{12}{42}$ and $\frac{3}{7}\cdot\frac{2}{6}=\frac{6}{42}$. Add: $\frac{18}{42}=\frac{3}{7}$.'
          - problem: 'A bag holds $5$ red and $2$ blue counters. Two counters are drawn without replacement. What is the probability that exactly one of them is blue?'
            answer: '10/21'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Exactly one blue means red then blue, or blue then red. Red then blue has probability $\frac{5}{7}\cdot\frac{2}{6}=\frac{10}{42}$, and blue then red has probability $\frac{2}{7}\cdot\frac{5}{6}=\frac{10}{42}$. Add: $\frac{20}{42}=\frac{10}{21}$.'
          - problem: 'A sack holds $6$ red and $2$ blue tokens. Two tokens are drawn without replacement. What is the probability that at least one of them is red?'
            answer: '27/28'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'No red means blue then blue, with probability $\frac{2}{8}\cdot\frac{1}{7}=\frac{2}{56}=\frac{1}{28}$. Take the complement: $1-\frac{1}{28}=\frac{27}{28}$.'
          - problem: 'A gardener plants three seeds. Each seed germinates with probability $\frac34$, independently of the others. What is the probability that at least one seed germinates?'
            answer: '63/64'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'No seed germinating has probability $\frac{1}{4}\cdot\frac{1}{4}\cdot\frac{1}{4}=\frac{1}{64}$. The event "at least one germinates" is the complement, so the probability is $1-\frac{1}{64}=\frac{63}{64}$.'
          - problem: 'Two cards are dealt one after the other from a standard deck of $52$ cards, which has $4$ aces. Tom says that the second card is an ace with probability $\frac{3}{51}$, because one card is already gone. What is the correct probability that the second card is an ace?'
            answer: '1/13'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The first card is unknown, so both cases count. Ace then ace has probability $\frac{4}{52}\cdot\frac{3}{51}$, and a non-ace then an ace has probability $\frac{48}{52}\cdot\frac{4}{51}$. The sum is $\frac{12+192}{2652}=\frac{204}{2652}=\frac{1}{13}$.'
        constraints: 'combine complements or sum 2-3 paths over a full two-stage tree, or use a three-stage independent tree; bag sizes <= 8'
    diagnostic_exemplar:
      problem: 'A bag holds $2$ red and $3$ blue marbles. Two are drawn without replacement. Find $P(\text{the second marble drawn is red})$.'
      answer: '2/5'
      solution_sketch: 'Sum the two paths that end in red: $\frac{2}{5}\cdot\frac{1}{4} + \frac{3}{5}\cdot\frac{2}{4} = \frac{2}{20} + \frac{6}{20} = \frac{2}{5}$.'
    anki_seeds:
      - front: 'In a tree diagram, the probability of one complete path is found by...'
        back: 'Multiplying the probabilities along its branches.'
        type: basic
      - front: 'In a tree diagram, the probability of an event covered by several paths is found by...'
        back: 'Adding the (disjoint) path probabilities.'
        type: basic

  - id: bayes-theorem
    name: "Bayes' Theorem"
    core: false                # terminal; the rules it uses stay core
    difficulty: 0.55
    drill: false
    answer_kind: numeric
    expected_time_secs: 240
    prerequisites:
      - id: conditional-probability
        weight: 0.8
        key: true
      - id: addition-rule-complements
        weight: 0.4
        key: false
      - id: probability-tree-diagrams
        weight: 0.4
        key: false
    knowledge_points:
      - id: kp1
        name: "Law of total probability"
        key_prerequisites: [conditional-probability, addition-rule-complements]
        step_check:
          step: 'Identify the probabilities of choosing each box'
          question: 'Why does the example use $P(B_1)=\frac13$ and $P(B_2)=\frac23$ rather than a plain average of the two boxes?'
          options:
            - 'The two boxes hold different numbers of marbles, so their weights differ'
            - 'Probabilities for the two boxes must always be one third and two thirds'
            - 'Box 2 is chosen twice as often, so it supplies more of the draws'
            - 'The smaller probability belongs to the box with more green marbles'
          answer: 'Box 2 is chosen twice as often, so it supplies more of the draws'
          why: 'The die picks Box 2 on $4$ of its $6$ faces, so Box 2 deserves weight $\frac23$ when the two cases are combined.'
        exemplars:
          - problem: 'Urn 1 holds $2$ red and $3$ blue marbles. Urn 2 holds $4$ red and $1$ blue marble. A fair coin decides which urn is used, and one marble is drawn at random from that urn. What is the probability that the marble is red?'
            answer: '3/5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The marble is red from urn 1 or from urn 2. Urn 1 contributes $\frac{1}{2}\cdot\frac{2}{5}=\frac{1}{5}$ and urn 2 contributes $\frac{1}{2}\cdot\frac{4}{5}=\frac{2}{5}$. Add the two cases: $\frac{1}{5}+\frac{2}{5}=\frac{3}{5}$.'
          - problem: 'A factory has two machines. Machine A makes $\frac14$ of the parts, and $\frac{1}{10}$ of its parts are defective. Machine B makes the other $\frac34$ of the parts, and $\frac{1}{20}$ of its parts are defective. What is the probability that a part chosen at random is defective?'
            answer: '1/16'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A defective part comes from machine A or from machine B. Machine A contributes $\frac{1}{4}\cdot\frac{1}{10}=\frac{1}{40}=\frac{2}{80}$ and machine B contributes $\frac{3}{4}\cdot\frac{1}{20}=\frac{3}{80}$. Add: $\frac{5}{80}=\frac{1}{16}$.'
          - problem: 'Bag A holds $3$ red and $1$ green marble. Bag B holds $1$ red and $3$ green marbles. A fair coin decides which bag is used, and one marble is drawn from it. What is the probability that the marble is red?'
            answer: '1/2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Bag A gives red with probability $\frac{1}{2}\cdot\frac{3}{4}=\frac{3}{8}$, and bag B gives red with probability $\frac{1}{2}\cdot\frac{1}{4}=\frac{1}{8}$. Add the two cases: $\frac{3}{8}+\frac{1}{8}=\frac{1}{2}$.'
          - problem: 'A factory gets $\frac13$ of its components from supplier X and $\frac23$ from supplier Y. A component from X fails with probability $\frac14$, and a component from Y fails with probability $\frac{1}{10}$. What is the probability that a component chosen at random fails?'
            answer: '3/20'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A failing component comes from X or from Y. Supplier X contributes $\frac{1}{3}\cdot\frac{1}{4}=\frac{1}{12}=\frac{5}{60}$ and supplier Y contributes $\frac{2}{3}\cdot\frac{1}{10}=\frac{1}{15}=\frac{4}{60}$. Add: $\frac{9}{60}=\frac{3}{20}$.'
          - problem: 'For two events $A$ and $B$, $P(A)=\frac15$, $P(B\mid A)=\frac34$ and $P(B\mid A^c)=\frac12$. What is $P(B)$?'
            answer: '11/20'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Event $B$ happens together with $A$ or together with $A^c$. The first case gives $\frac{1}{5}\cdot\frac{3}{4}=\frac{3}{20}$ and the second gives $\frac{4}{5}\cdot\frac{1}{2}=\frac{8}{20}$. Add: $\frac{3}{20}+\frac{8}{20}=\frac{11}{20}$.'
          - problem: 'A bakery buys $\frac25$ of its eggs from farm A and $\frac35$ from farm B. An egg from farm A is cracked with probability $\frac18$, and an egg from farm B is cracked with probability $\frac14$. What is the probability that an egg chosen at random is not cracked?'
            answer: '4/5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'First find the probability of a cracked egg: $\frac{2}{5}\cdot\frac{1}{8}+\frac{3}{5}\cdot\frac{1}{4}=\frac{1}{20}+\frac{3}{20}=\frac{1}{5}$. An egg that is not cracked is the complement, so the probability is $1-\frac{1}{5}=\frac{4}{5}$.'
          - problem: 'Half of the light bulbs a shop sells come from plant X and half from plant Y. A fraction $\frac{1}{10}$ of the bulbs from plant X are faulty. Overall, $\frac{3}{20}$ of all the bulbs sold are faulty. What fraction of the bulbs from plant Y are faulty?'
            answer: '1/5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Plant X contributes $\frac{1}{2}\cdot\frac{1}{10}=\frac{1}{20}$ to the faulty bulbs. The total is $\frac{3}{20}$, so plant Y contributes $\frac{3}{20}-\frac{1}{20}=\frac{1}{10}$. This equals $\frac{1}{2}\cdot q$, so $q=\frac{1}{10}\div\frac{1}{2}=\frac{1}{5}$.'
          - problem: 'Ana picks bag A with probability $\frac13$ or bag B with probability $\frac23$ and draws a marble from it. Half of the marbles in bag A are red, and a quarter of the marbles in bag B are red. Ana says the probability of a red marble is $\frac12\left(\frac12+\frac14\right)=\frac38$. What is the correct probability?'
            answer: '1/3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Ana ignored that the bags are not equally likely. Bag A contributes $\frac{1}{3}\cdot\frac{1}{2}=\frac{1}{6}$ and bag B contributes $\frac{2}{3}\cdot\frac{1}{4}=\frac{1}{6}$. Add: $\frac{1}{6}+\frac{1}{6}=\frac{1}{3}$.'
        constraints: 'exactly two branches; all inputs simple fractions; answer reduces cleanly; one item gives the total and asks for a missing branch'
      - id: kp2
        name: "Bayes with two hypotheses"
        key_prerequisites: [conditional-probability, addition-rule-complements]
        step_check:
          step: 'Compute the denominator using total probability'
          question: 'Why does the denominator of Bayes'' theorem use the total probability of green, and not just the Box A term?'
          options:
            - 'Box B is the more likely box, so its term must also be included'
            - 'It must count every way green can arise, from Box A and Box B'
            - 'The prior of $\frac12$ for each box already covers the whole green probability'
            - 'The two box terms are added because the boxes are chosen one after the other'
          answer: 'It must count every way green can arise, from Box A and Box B'
          why: 'The answer is the share of Box A among all green draws, so the denominator is the whole green probability, $\frac15+\frac25=\frac35$.'
        try_first:
          problem: 'Box 1 holds $1$ red and $1$ blue marble. Box 2 holds $3$ red and $1$ blue marble. A fair coin picks the box, and the marble drawn is red. What is the probability that the box was box 2?'
          answer_contract: {"kind": "exact"}
          answer: '3/5'
          reveal: 'Box 2 holds more red marbles, so a red marble points to it more strongly than the coin alone does. The answer is the share of box 2 among all the ways to draw red: $\frac{3/8}{5/8}$.'
        exemplars:
          - problem: 'Urn 1 holds $2$ red and $3$ blue marbles. Urn 2 holds $4$ red and $1$ blue marble. A fair coin decides which urn is used, and one marble is drawn from it. The marble is red. What is the probability that it came from urn 1?'
            answer: '1/3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Red from urn 1 has probability $\frac{1}{2}\cdot\frac{2}{5}=\frac{1}{5}$. Red from either urn has probability $\frac{1}{5}+\frac{2}{5}=\frac{3}{5}$. The share that comes from urn 1 is $\frac{1/5}{3/5}=\frac{1}{3}$.'
          - problem: 'Bag X holds $3$ red and $1$ blue marble. Bag Y holds $1$ red and $3$ blue marbles. A fair coin decides which bag is used, and one marble is drawn from it. The marble is red. What is the probability that it came from bag X?'
            answer: '3/4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Red from bag X has probability $\frac{1}{2}\cdot\frac{3}{4}=\frac{3}{8}$. Red from either bag has probability $\frac{3}{8}+\frac{1}{8}=\frac{1}{2}$. The share from bag X is $\frac{3/8}{1/2}=\frac{3}{4}$.'
          - problem: 'Urn A holds $4$ red and $1$ blue marble. Urn B holds $2$ red and $3$ blue marbles. A fair coin decides which urn is used, and one marble is drawn from it. The marble is red. What is the probability that it came from urn A?'
            answer: '2/3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Red from urn A has probability $\frac{1}{2}\cdot\frac{4}{5}=\frac{2}{5}$. Red from either urn has probability $\frac{2}{5}+\frac{1}{5}=\frac{3}{5}$. The share from urn A is $\frac{2/5}{3/5}=\frac{2}{3}$.'
          - problem: 'Bag P holds $5$ red and $3$ blue marbles. Bag Q holds $1$ red and $7$ blue marbles. A fair coin decides which bag is used, and one marble is drawn from it. The marble is red. What is the probability that it came from bag P?'
            answer: '5/6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Red from bag P has probability $\frac{1}{2}\cdot\frac{5}{8}=\frac{5}{16}$. Red from either bag has probability $\frac{5}{16}+\frac{1}{16}=\frac{6}{16}$. The share from bag P is $\frac{5/16}{6/16}=\frac{5}{6}$.'
          - problem: 'Box A is chosen with probability $\frac13$ and box B with probability $\frac23$. Box A holds $2$ red and $4$ blue balls. Box B holds $3$ red and $1$ blue ball. A ball is drawn from the chosen box and it is red. What is the probability that it came from box A?'
            answer: '2/11'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Red from box A has probability $\frac{1}{3}\cdot\frac{1}{3}=\frac{1}{9}$. Red from box B has probability $\frac{2}{3}\cdot\frac{3}{4}=\frac{1}{2}$, so red overall has probability $\frac{1}{9}+\frac{1}{2}=\frac{11}{18}$. The share from box A is $\frac{1/9}{11/18}=\frac{2}{11}$.'
          - problem: 'Jar 1 is chosen with probability $\frac14$ and jar 2 with probability $\frac34$. Jar 1 holds $1$ red and $3$ blue beads. Jar 2 holds $2$ red and $2$ blue beads. A bead is drawn from the chosen jar and it is red. What is the probability that it came from jar 2?'
            answer: '6/7'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Red from jar 2 has probability $\frac{3}{4}\cdot\frac{1}{2}=\frac{3}{8}$. Red from jar 1 has probability $\frac{1}{4}\cdot\frac{1}{4}=\frac{1}{16}$, so red overall has probability $\frac{7}{16}$. The share from jar 2 is $\frac{3/8}{7/16}=\frac{6}{7}$.'
          - problem: 'One in $5$ of the emails a company receives is spam. A filter flags $\frac{9}{10}$ of the spam emails and $\frac{1}{20}$ of the other emails. An email is flagged. What is the probability that it is spam?'
            answer: '9/11'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Spam that is flagged has probability $\frac{1}{5}\cdot\frac{9}{10}=\frac{18}{100}$. Other email that is flagged has probability $\frac{4}{5}\cdot\frac{1}{20}=\frac{4}{100}$. The share that is spam is $\frac{18}{18+4}=\frac{9}{11}$.'
          - problem: 'Machine A makes $\frac15$ of the parts in a plant, and $\frac14$ of its parts are defective. Machine B makes the other $\frac45$, and $\frac{1}{10}$ of its parts are defective. A part is found to be defective. Which machine most likely made it?'
            answer: 'machine B'
            answer_contract: {"kind": "label", "options": [["machine A", "A", "it was machine A", "from machine A", "the first machine", "machine A made it", "it was A"], ["machine B", "B", "it was machine B", "from machine B", "the second machine", "machine B made it", "it was B"]]}
            solution_sketch: 'Defective from machine A has probability $\frac{1}{5}\cdot\frac{1}{4}=\frac{5}{100}$. Defective from machine B has probability $\frac{4}{5}\cdot\frac{1}{10}=\frac{8}{100}$. Machine B made the part with probability $\frac{8}{13}$, although its defect rate is lower, because it makes most of the parts.'
          - problem: 'Urn 1 holds $1$ red and $4$ blue marbles. Urn 2 holds $3$ red and $2$ blue marbles. A fair coin decides which urn is used, and the marble drawn is red. Leo says the probability that it came from urn 1 is $\frac15$, because urn 1 is $\frac15$ red. What is the correct probability?'
            answer: '1/4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Leo used only the chance of red within urn 1. Red from urn 1 has probability $\frac{1}{2}\cdot\frac{1}{5}=\frac{1}{10}$, and red from urn 2 has probability $\frac{1}{2}\cdot\frac{3}{5}=\frac{3}{10}$. The share from urn 1 is $\frac{1/10}{4/10}=\frac{1}{4}$.'
        constraints: 'two hypotheses chosen by fair coin or simple prior; denominator computed via total probability; at most one item asks which hypothesis is more likely'
      - id: kp3
        name: "Base rates: test-and-condition problems"
        key_prerequisites: [conditional-probability, addition-rule-complements]
        step_check:
          step: 'Calculate the denominator, the total probability of testing positive'
          question: 'Why does the denominator also include the term for people who do not have the disease?'
          options:
            - 'The healthy group is larger, so it always decides the final probability'
            - 'Adding the healthy term makes the fractions share a common denominator'
            - 'Every person must be counted once, whether or not the test is positive'
            - 'Healthy people with a false positive also test positive, so they count'
          answer: 'Healthy people with a false positive also test positive, so they count'
          why: 'The denominator is the probability of a positive result, and a positive result comes from sick people and from healthy people with a false positive.'
        exemplars:
          - problem: 'One person in $100$ has a certain disease. A test is positive for $9$ in $10$ people who have the disease and for $1$ in $10$ people who do not. A person tests positive. What is the probability that the person has the disease?'
            answer: '1/12'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A positive result from a person with the disease has probability $\frac{1}{100}\cdot\frac{9}{10}=\frac{9}{1000}$. A positive result from a healthy person has probability $\frac{99}{100}\cdot\frac{1}{10}=\frac{99}{1000}$. The share with the disease is $\frac{9}{108}=\frac{1}{12}$.'
          - problem: 'In a group of $2000$ people, $20$ carry a virus. A test is positive for $18$ of the $20$ carriers and for $99$ of the $1980$ people who do not carry the virus. Of all the people who test positive, what fraction carry the virus?'
            answer: '2/13'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The number of positive tests is $18+99=117$. Of these, $18$ come from carriers. The fraction is $\frac{18}{117}=\frac{2}{13}$.'
          - problem: 'In a clinic, $1$ person in $51$ has an infection. The test is positive for $5$ in $10$ infected people and for $2$ in $10$ people without the infection. A person tests positive. What is the probability that the person is infected?'
            answer: '1/21'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A positive result from an infected person has probability $\frac{1}{51}\cdot\frac{5}{10}=\frac{5}{510}$. A positive result from an uninfected person has probability $\frac{50}{51}\cdot\frac{2}{10}=\frac{100}{510}$. The share infected is $\frac{5}{105}=\frac{1}{21}$.'
          - problem: 'In a region, $1$ person in $101$ carries a virus. A test is positive for $2$ in $10$ carriers and for $3$ in $10$ non-carriers. What is the probability that a person with a positive result carries the virus?'
            answer: '1/151'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A positive result from a carrier has probability $\frac{1}{101}\cdot\frac{2}{10}=\frac{2}{1010}$. A positive result from a non-carrier has probability $\frac{100}{101}\cdot\frac{3}{10}=\frac{300}{1010}$. The share of carriers is $\frac{2}{302}=\frac{1}{151}$.'
          - problem: 'In a town, $1$ adult in $61$ has a condition. A screening test flags $3$ in $10$ adults with the condition and $4$ in $10$ adults without it. What is the probability that a flagged adult has the condition?'
            answer: '1/81'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A flag on an adult with the condition has probability $\frac{1}{61}\cdot\frac{3}{10}=\frac{3}{610}$. A flag on an adult without it has probability $\frac{60}{61}\cdot\frac{4}{10}=\frac{240}{610}$. The share with the condition is $\frac{3}{243}=\frac{1}{81}$.'
          - problem: 'A rare allergy affects $1$ person in $401$. A skin test is positive for $4$ in $10$ allergic people and for $5$ in $10$ people who are not allergic. What is the probability that a person with a positive test is not allergic?'
            answer: '500/501'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A positive result from an allergic person has probability $\frac{1}{401}\cdot\frac{4}{10}=\frac{4}{4010}$, and from a person who is not allergic it has probability $\frac{400}{401}\cdot\frac{5}{10}=\frac{2000}{4010}$. The share allergic is $\frac{4}{2004}=\frac{1}{501}$. So the probability of no allergy is $1-\frac{1}{501}=\frac{500}{501}$.'
          - problem: 'A rare disease affects $1$ person in $1000$. A test is positive for $99$ of every $100$ people with the disease and for $1$ of every $100$ people without it. Anna tests positive. Is it more likely that Anna has the disease or that she does not?'
            answer: 'does not have the disease'
            answer_contract: {"kind": "label", "options": [["has the disease", "she has the disease", "she has it", "has it", "she is ill"], ["does not have the disease", "she does not have the disease", "she does not have it", "does not have it", "she does not", "does not", "she doesn't have it", "she most likely does not have it"]]}
            solution_sketch: 'Out of $1000$ people, about $1$ has the disease and tests positive with probability $\frac{99}{100}$. About $999$ do not have it, and each tests positive with probability $\frac{1}{100}$. The probability of the disease given a positive test is $\frac{99}{1098}=\frac{11}{122}$, which is below one half. So Anna most likely does not have the disease.'
          - problem: 'One person in $20$ has a certain illness. A test is positive for $\frac45$ of the people who have the illness and for $\frac{1}{10}$ of the people who do not. Dev says a positive result means a $\frac45$ probability of illness. What is the correct probability?'
            answer: '8/27'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Dev used only the share of sick people who test positive. A positive result from a sick person has probability $\frac{1}{20}\cdot\frac{4}{5}=\frac{8}{200}$, and from a healthy person it has probability $\frac{19}{20}\cdot\frac{1}{10}=\frac{19}{200}$. The share with the illness is $\frac{8}{27}$.'
        constraints: 'prevalence 1/20 to 1/1000; sensitivity and false-positive rate are simple fractions; posterior reduces to a clean fraction; counts of people may replace probabilities'
    diagnostic_exemplar:
      problem: 'A disease affects $1/50$ of a population. A test detects it with probability $9/10$ and gives a false positive with probability $1/10$. Find $P(\text{disease} \mid \text{positive})$.'
      answer: '9/58'
      solution_sketch: 'Total probability: $\frac{1}{50}\cdot\frac{9}{10} + \frac{49}{50}\cdot\frac{1}{10} = \frac{9 + 49}{500}$; posterior $= \frac{9/500}{58/500} = 9/58$.'
    anki_seeds:
      - front: 'Bayes'' theorem (two hypotheses)?'
        back: '$P(H \mid E) = \frac{P(H) P(E \mid H)}{P(H) P(E \mid H) + P(H^c) P(E \mid H^c)}$.'
        type: basic
      - front: 'Law of total probability (two cases)?'
        back: '$P(E) = P(H)P(E \mid H) + P(H^c)P(E \mid H^c)$.'
        type: basic
      - front: 'Why can a positive result from an accurate test still mean the condition is unlikely?'
        back: 'A low base rate: the many false positives from the large healthy group can outnumber the true positives.'
        type: basic
