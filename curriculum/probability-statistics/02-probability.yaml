          - problem: 'A fair die is rolled. Are the events "the number is prime" and "the number is even" mutually exclusive?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "yes, they are", "yes they are", "they are", "yes, they are mutually exclusive", "they are mutually exclusive", "mutually exclusive", "yes, mutually exclusive"], ["no", "no, they are not", "no they are not", "they are not", "no, they are not mutually exclusive", "they are not mutually exclusive", "not mutually exclusive", "no, not mutually exclusive"]]}
            solution_sketch: 'The number $2$ is both prime and even, so the events share an outcome. They can occur together, so they are not mutually exclusive.'
