            - 'Kings and queens are different ranks, so their probabilities cancel to $0$'
            - 'No card belongs to both events, so no outcome counts for king and queen'
          answer: 'No card belongs to both events, so no outcome counts for king and queen'
          why: 'An event with no outcomes has probability $0$, and events with $P(A \cap B)=0$ are mutually exclusive.'
        exemplars:
