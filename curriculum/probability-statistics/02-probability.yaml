          - problem: 'A fair die is rolled. What is the probability that the number is even or greater than $4$?'
            answer: '2/3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The even numbers are $2$, $4$ and $6$, and the numbers above $4$ are $5$ and $6$, so $6$ is in both. The probability is $3/6 + 2/6 - 1/6 = 4/6 = 2/3$.'
          - problem: 'A fair $8$-sided die is rolled once. What is the probability that the result is odd or greater than $5$?'
            answer: '3/4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The odd results are $1, 3, 5, 7$ and the results above $5$ are $6, 7, 8$, so $7$ is in both. The probability is $4/8 + 3/8 - 1/8 = 6/8 = 3/4$.'
          - problem: 'In a class of $30$ students, $18$ play football, $12$ play basketball and $7$ play both. One student is chosen at random. What is the probability that the student plays football or basketball?'
            answer: '23/30'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Adding $18 + 12$ counts the $7$ students who play both twice. So $18 + 12 - 7 = 23$ students play at least one sport, and the probability is $23/30$.'
          - problem: 'A spinner has $10$ equal sectors numbered $1$ through $10$. What is the probability that it lands on a multiple of $3$ or on a number greater than $6$?'
            answer: '3/5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The multiples of $3$ are $3, 6, 9$ and the numbers above $6$ are $7, 8, 9, 10$, so $9$ is in both. The probability is $3/10 + 4/10 - 1/10 = 6/10 = 3/5$.'
          - problem: 'Tom finds the probability that a card drawn from a standard deck is a heart or a red card by adding $13/52$ and $26/52$. He gets $3/4$. What is the correct probability?'
            answer: '1/2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Every heart is red, so "heart or red" is the same as "red". The correct probability is $26/52 = 1/2$, which is $13/52 + 26/52 - 13/52$.'
          - problem: 'Of $60$ diners at a restaurant, $36$ ordered soup, $27$ ordered dessert and $15$ ordered both. One diner is chosen at random. What is the probability that the diner ordered soup or dessert?'
            answer: '4/5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The count who ordered soup or dessert is $36 + 27 - 15 = 48$, because the $15$ who ordered both are counted twice in the sum. The probability is $48/60 = 4/5$.'
          - problem: 'A bag contains $20$ marbles numbered $1$ through $20$. What is the probability that a marble drawn at random is a multiple of $4$ or greater than $15$?'
            answer: '2/5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The multiples of $4$ are $4, 8, 12, 16, 20$ and the numbers above $15$ are $16$ through $20$, so $16$ and $20$ are in both. The probability is $5/20 + 5/20 - 2/20 = 8/20 = 2/5$.'
          - problem: 'One card is drawn from a standard deck of $52$ cards. What is the probability that it is a spade or a face card?'
            answer: '11/26'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'There are $13$ spades and $12$ face cards, and $3$ cards are both a spade and a face card. The probability is $13/52 + 12/52 - 3/52 = 22/52 = 11/26$.'
        constraints: 'overlap must be nonempty and computable by listing or by given counts; at most one error-analysis item'
      - id: kp2
        name: 'General addition rule from given probabilities'
        key_prerequisites: [mutually-exclusive-events, adding-subtracting-fractions]
        step_check:
          step: 'Apply the General Addition Rule'
          question: 'Why is $P(A \cap B)$ subtracted in the General Addition Rule?'
          options:
            - 'The overlap is counted once in $P(A)$ and once in $P(B)$, so one count is removed'
            - 'The overlap is the part of A that is impossible, so it is taken away from the total'
            - 'Subtracting keeps the answer below $1$, which every union of events must be'
          answer: 'The overlap is counted once in $P(A)$ and once in $P(B)$, so one count is removed'
          why: 'In $\frac34+\frac13$ the overlap $\frac14$ is counted twice, so removing it once leaves $\frac56$.'
        try_first:
          problem: 'In a group, $\frac12$ of the people have a dog and $\frac13$ have a cat, and $\frac16$ have both. What fraction of the group have a dog or a cat?'
          answer_contract: {"kind": "exact"}
          answer: '2/3'
          reveal: 'Adding $\frac12+\frac13$ counts the people with both pets twice. Subtracting the overlap once gives $\frac56-\frac16=\frac23$.'
        exemplars:
          - problem: 'Given $P(A) = 2/5$, $P(B) = 1/2$ and $P(A \cap B) = 1/5$, find $P(A \cup B)$.'
            answer: '7/10'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The General Addition Rule gives $P(A \cup B) = P(A) + P(B) - P(A \cap B)$. So $2/5 + 1/2 - 1/5 = 4/10 + 5/10 - 2/10 = 7/10$.'
          - problem: 'Given $P(A) = 1/3$, $P(B) = 1/2$ and $P(A \cup B) = 2/3$, find $P(A \cap B)$.'
            answer: '1/6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Rearrange the General Addition Rule to $P(A \cap B) = P(A) + P(B) - P(A \cup B)$. So $1/3 + 1/2 - 2/3 = 1/6$.'
          - problem: 'Given $P(A) = 3/4$, $P(B) = 1/2$ and $P(A \text{ or } B) = 7/8$, find $P(A \text{ and } B)$.'
            answer: '3/8'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The General Addition Rule gives $P(A \text{ and } B) = P(A) + P(B) - P(A \text{ or } B)$. So $3/4 + 1/2 - 7/8 = 6/8 + 4/8 - 7/8 = 3/8$.'
          - problem: 'The probability that Maya''s train is late is $1/3$, the probability that it is crowded is $1/4$, and the probability that it is both late and crowded is $1/12$. What is the probability that the train is late or crowded?'
            answer: '1/2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The General Addition Rule gives $1/3 + 1/4 - 1/12$. That is $4/12 + 3/12 - 1/12 = 6/12 = 1/2$.'
          - problem: 'The probability that a resident has a library card is $3/5$ and the probability that a resident has a bike is $2/5$. The probability that a resident has at least one of the two is $4/5$. What is the probability that a resident has both?'
            answer: '1/5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Rearrange the General Addition Rule to $P(\text{both}) = P(\text{card}) + P(\text{bike}) - P(\text{at least one})$. So $3/5 + 2/5 - 4/5 = 1/5$.'
          - problem: 'Given $P(A) = 0.45$, $P(A \cup B) = 0.8$ and $P(A \cap B) = 0.15$, find $P(B)$.'
            answer: '0.5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The General Addition Rule gives $0.8 = 0.45 + P(B) - 0.15$. So $P(B) = 0.8 - 0.45 + 0.15 = 0.5$.'
          - problem: 'Priya has $P(A) = 0.5$, $P(B) = 0.4$ and $P(A \cap B) = 0.2$. She finds $P(A \cup B)$ as $0.5 + 0.4 + 0.2 = 1.1$. What is the correct value of $P(A \cup B)$?'
            answer: '0.7'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The overlap must be subtracted, not added. So $P(A \cup B) = 0.5 + 0.4 - 0.2 = 0.7$, and a probability can never be $1.1$.'
          - problem: 'Can events $A$ and $B$ have $P(A) = 0.7$, $P(B) = 0.6$ and $P(A \cap B) = 0.2$?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "yes, they can", "yes they can", "they can", "possible", "yes, it is possible", "yes, possible", "yes it is possible"], ["no", "no, they cannot", "no they cannot", "no, they can't", "no they can't", "they cannot", "not possible", "no, not possible"]]}
            solution_sketch: 'The General Addition Rule gives $P(A \cup B) = 0.7 + 0.6 - 0.2 = 1.1$. A probability cannot be above $1$, so these values are not possible.'
        constraints: 'solve for the union, the intersection or a single event; all probabilities consistent and in [0, 1]; at most one error-analysis item'
      - id: kp3
        name: 'Unions with complements'
        key_prerequisites: [complement-rule, mutually-exclusive-events]
        step_check:
          step: 'apply the complement rule to find $P(\text{neither } A \text{ nor } B)$'
          question: 'Why is $1 - P(A \cup B)$ the probability that neither event occurs?'
          options:
            - 'The overlap $P(A \cap B)$ is removed from $1$, and what remains is neither'
            - 'Neither happens exactly when the union does not, so the two cover all'
            - 'Neither means both events fail, so the two failure chances are added together'
          answer: 'Neither happens exactly when the union does not, so the two cover all'
          why: 'Every outcome is either in $A \cup B$ or outside it, so the outside part has probability $1-\frac12=\frac12$.'
        exemplars:
          - problem: 'Given $P(A \cup B) = 5/6$, find the probability that neither $A$ nor $B$ occurs.'
            answer: '1/6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Neither event occurs exactly when $A \cup B$ does not occur. So the probability is $1 - 5/6 = 1/6$.'
          - problem: 'Given $P(A) = 1/2$, $P(B) = 2/5$ and $P(A \cap B) = 1/5$, find the probability that neither $A$ nor $B$ occurs.'
            answer: '3/10'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The General Addition Rule gives $P(A \cup B) = 1/2 + 2/5 - 1/5 = 7/10$. Neither occurs with probability $1 - 7/10 = 3/10$.'
          - problem: 'For two events $A$ and $B$, $P(A) = 1/3$, $P(B) = 1/6$ and $P(A \text{ and } B) = 1/9$. What is the probability that neither $A$ nor $B$ occurs?'
            answer: '11/18'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'First $P(A \text{ or } B) = 1/3 + 1/6 - 1/9 = 6/18 + 3/18 - 2/18 = 7/18$. Then neither occurs with probability $1 - 7/18 = 11/18$.'
          - problem: 'In a survey, the probability that a person has property $A$ is $3/5$, the probability of property $B$ is $1/6$, and the probability of both is $1/30$. What is the probability that a person has neither property?'
            answer: '4/15'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'First $P(A \text{ or } B) = 3/5 + 1/6 - 1/30 = 18/30 + 5/30 - 1/30 = 22/30 = 11/15$. Then neither has probability $1 - 11/15 = 4/15$.'
          - problem: 'Of $40$ people at a party, $25$ like tea, $18$ like coffee and $8$ like both. One person is chosen at random. What is the probability that the person likes neither tea nor coffee?'
            answer: '1/8'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The number who like tea or coffee is $25 + 18 - 8 = 35$. So $40 - 35 = 5$ people like neither, and the probability is $5/40 = 1/8$.'
          - problem: 'At a school, the probability that a pupil plays chess is $0.3$ and the probability that a pupil plays football is $0.45$. The probability that a pupil plays both is $0.1$. What is the probability that a pupil plays neither?'
            answer: '0.35'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'First $P(\text{chess or football}) = 0.3 + 0.45 - 0.1 = 0.65$. A pupil plays neither with probability $1 - 0.65 = 0.35$.'
          - problem: 'For two events $A$ and $B$, $P(A) = 1/3$, $P(B) = 1/7$ and $P(A \text{ and } B) = 1/21$. What is the probability that $A$ and $B$ do not both occur?'
            answer: '20/21'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The events both occur with probability $1/21$. They do not both occur with probability $1 - 1/21 = 20/21$, and the values of $P(A)$ and $P(B)$ are not needed.'
          - problem: 'An experiment has two events $A$ and $B$. The chance of $A$ is $3/4$, the chance of $B$ is $1/7$ and the chance of both is $1/14$. What is the probability that neither event occurs?'
            answer: '5/28'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'First $P(A \text{ or } B) = 3/4 + 1/7 - 1/14 = 21/28 + 4/28 - 2/28 = 23/28$. Neither occurs with probability $1 - 23/28 = 5/28$.'
        constraints: 'combine the general addition rule with the complement rule; probabilities as fractions, decimals or counts; at most one item about the complement of an intersection'
    diagnostic_exemplar:
      problem: 'Given $P(A) = 2/5$, $P(B) = 1/4$, and $P(A \cap B) = 1/10$, find $P(\text{neither } A \text{ nor } B)$.'
      answer: '9/20'
      solution_sketch: '$P(A \cup B) = 8/20 + 5/20 - 2/20 = 11/20$; complement $= 9/20$.'
    anki_seeds:
      - front: 'General addition rule?'
        back: '$P(A \cup B) = P(A) + P(B) - P(A \cap B)$.'
        type: basic
      - front: '$P(\text{neither } A \text{ nor } B) =$ ?'
        back: '$1 - P(A \cup B)$.'
        type: basic

  - id: two-way-frequency-tables
    name: "Two-Way Frequency Tables"
    core: true
    difficulty: 0.3
    drill: false
    answer_kind: numeric
    expected_time_secs: 120
    prerequisites:
      - id: basic-probability
        weight: 0.5
        key: true
      - id: percentages
        weight: 0.4
        key: false
    knowledge_points:
      - id: kp1
        name: "Completing a table from totals"
        key_prerequisites: []
        step_check:
          step: 'Total students who play soccer'
          question: 'Why are the $12$ girls and the $15$ boys who play soccer added together?'
          options:
            - 'The girls group and the boys group overlap, so the sum $12+15$ counts shared players twice'
            - 'No student is both a girl and a boy, so the two counts together are all the players'
            - 'The sum $12+15$ is needed to check that the row totals reach $50$'
          answer: 'No student is both a girl and a boy, so the two counts together are all the players'
          why: 'Every player is a girl or a boy and none is both, so the soccer column total is the sum $12+15$.'
        exemplars:
          - problem: 'A survey of $60$ people asks about pets. $35$ own a dog. Of the dog owners, $14$ also own a cat, and of the people who do not own a dog, $9$ own a cat. How many of the $60$ people own a cat?'
            answer: '23'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Cat owners are of two kinds: dog owners with a cat and non-owners of a dog with a cat. Add the two cells: $14+9=23$, so $23$ people own a cat.'
          - problem: 'Of $40$ students, $25$ play a sport. Of the players, $18$ are in their final year, and of the non-players, $10$ are in their final year. How many students are neither final-year students nor players?'
            answer: '5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The non-players number $40-25=15$. Of these, $10$ are in their final year, so $15-10=5$ students are neither.'
          - problem: 'A school has $90$ students in two grades. There are $52$ students in grade 9 and the rest are in grade 10. Of the grade 10 students, $21$ take the bus. How many grade 10 students do not take the bus?'
            answer: '17'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The grade 10 total is $90-52=38$. Of these, $21$ take the bus, so $38-21=17$ do not.'
          - problem: 'A club has $50$ members: $30$ girls and $20$ boys. On the trip, $19$ girls and $12$ boys came along. How many members did not go on the trip?'
            answer: '19'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The trip had $19+12=31$ members. The other members stayed home, so $50-31=19$ members did not go.'
          - problem: 'A gym has $75$ members. Of these, $30$ are students and the rest are adults. Of the adults, $18$ use the pool. How many adults do not use the pool?'
            answer: '27'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The adults number $75-30=45$. Of them, $18$ use the pool, so $45-18=27$ adults do not.'
          - problem: 'At a concert of $80$ people, $48$ bought a programme. Of the programme buyers, $30$ are over $40$ years old. How many programme buyers are $40$ years old or younger?'
            answer: '18'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The group asked about is the programme buyers only, which is $48$ people. Remove the $30$ who are over $40$: $48-30=18$ buyers are $40$ or younger.'
          - problem: 'Of $120$ voters, $70$ are women. A total of $38$ women and $45$ men voted yes, and every other voter voted no. How many voters voted no?'
            answer: '37'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The yes votes are $38+45=83$. All other voters voted no, so $120-83=37$ voters voted no.'
        constraints: "totals <= 100; exactly one cell requires two subtraction steps"
      - id: kp2
        name: "Joint and marginal relative frequencies"
        key_prerequisites: [basic-probability]
        step_check:
          step: 'Divide the joint frequency by the grand total'
          question: 'Why is the joint frequency $15$ divided by the grand total $60$?'
          options:
            - 'The cell is one part of everyone in the survey, so all $60$ students are the whole'
            - 'The cell $15$ is divided by the row total $40$, because that row holds its own group'
            - 'A joint frequency is always divided by the number of students in the larger grade'
          answer: 'The cell is one part of everyone in the survey, so all $60$ students are the whole'
          why: 'A joint relative frequency answers "what part of everyone is in this cell", so the divisor is the grand total of $60$.'
        exemplars:
          - problem: 'A class of $50$ students has $30$ in year 9 and $20$ in year 10. Of the year 9 students, $12$ play an instrument, and of the year 10 students, $6$ play an instrument. A student is chosen at random. What is the probability that the student is in year 9 and plays an instrument?'
            answer: '6/25'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Only the cell for year 9 players counts, and it holds $12$ students. The class has $50$ students, so the probability is $12/50=6/25$.'
          - problem: 'In a class of $50$ students, $30$ are in year 9 and $20$ are in year 10. Of the year 9 students, $12$ play an instrument, and of the year 10 students, $6$ play an instrument. What is the probability that a randomly chosen student plays an instrument?'
            answer: '9/25'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Players come from both years: $12+6=18$ students. The probability is $18/50=9/25$, using the whole class of $50$ as the total.'
          - problem: 'In a survey of $96$ gym members, $54$ use the pool and $18$ of those also use the sauna. A member is chosen at random. What is the probability that the member uses both the pool and the sauna?'
            answer: '3/16'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The cell for both facilities holds $18$ members, and the survey has $96$ members. The probability is $18/96=3/16$.'
          - problem: 'In a survey of $120$ customers, $72$ bought a drink and $30$ of those also bought a snack. Of the $48$ customers who did not buy a drink, $24$ bought a snack. What is the probability that a randomly chosen customer bought a snack?'
            answer: '9/20'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Snack buyers are $30+24=54$ customers. They are a part of all $120$ customers, so the probability is $54/120=9/20$.'
          - problem: 'A class of $40$ students has $22$ who take Spanish. Of these, $9$ are in the band. Of the $18$ students who do not take Spanish, $6$ are in the band. What is the probability that a randomly chosen student takes neither Spanish nor band?'
            answer: '3/10'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Students outside Spanish number $18$, and $6$ of them are in the band. So $18-6=12$ students take neither, and the probability is $12/40=3/10$.'
          - problem: 'In a class of $40$ students, $14$ play an instrument. Sam divides $14$ by the $22$ students in year 9 and says the probability that a randomly chosen student plays an instrument is $7/11$. What is the correct probability?'
            answer: '7/20'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The question asks about the whole class, so the total is all $40$ students and not the $22$ in year 9. The probability is $14/40=7/20$.'
          - problem: 'In a survey of $200$ people, $80$ are under $30$. Of the people under $30$, $50$ prefer streaming, and of the other people, $40$ prefer streaming. What is the probability that a randomly chosen person is under $30$ and does not prefer streaming?'
            answer: '3/20'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The under-$30$ people who do not prefer streaming number $80-50=30$. Out of all $200$ people the probability is $30/200=3/20$.'
        constraints: "divide a cell or a margin by the grand total; fractions in lowest terms"
      - id: kp3
        name: "Row and column relative frequencies"
        key_prerequisites: [basic-probability, percentages]
        step_check:
          step: 'The question asks about year-10 students only, so use the row total 20'
          question: 'Why is the $6$ divided by $20$ and not by the grand total $50$?'
          options:
            - 'The grand total $50$ is used only for joint and marginal frequencies'
            - 'Dividing by $50$ would count the year 9 players twice in the answer'
            - 'The question is about year 10 only, so that group is the whole'
            - 'The row total is chosen because it is always the smallest total'
          answer: 'The question is about year 10 only, so that group is the whole'
          why: 'A row relative frequency asks "of the students in this group", so the divisor is the total of that group, here $20$.'
        exemplars:
          - problem: 'In a class of $50$ students, $20$ are in year 10, and $6$ of those year 10 students play an instrument. What proportion of the year 10 students play an instrument?'
            answer: '3/10'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Only the year 10 students count, so the total is $20$ and not $50$. The proportion is $6/20=3/10$.'
          - problem: 'Of $30$ students, $18$ walk to school. Of the walkers, $6$ own a bike, and of the $12$ students who do not walk, $9$ own a bike. What proportion of the bike owners walk to school?'
            answer: '2/5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Bike owners number $6+9=15$, and the walkers among them are $6$. The proportion is $6/15=2/5$.'
          - problem: 'A club has $40$ members. Of the $25$ beginners, $10$ play chess, and of the $15$ advanced members, $9$ play chess. What proportion of the chess players are beginners, to two decimal places?'
            answer: '0.53'
            answer_contract: {"kind": "approx", "decimals": 2}
            solution_sketch: 'The chess players number $10+9=19$. Of these, $10$ are beginners, so the proportion is $10/19=0.526\ldots$, which is $0.53$ to two decimal places.'
          - problem: 'A school has $200$ students. The art class has $32$ students, and $12$ of the art students are in grade 11. What fraction of the art students are in grade 11?'
            answer: '3/8'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The group is the art students, who number $32$, not the whole school. The fraction is $12/32=3/8$.'
          - problem: 'A cafe sold $150$ drinks: $90$ hot and $60$ cold. Of the hot drinks, $36$ were bought with a pastry, and of the cold drinks, $45$ were bought with a pastry. What fraction of the drinks bought with a pastry were hot?'
            answer: '4/9'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Drinks bought with a pastry number $36+45=81$. Of these, $36$ were hot, so the fraction is $36/81=4/9$.'
          - problem: 'In a survey of $80$ voters, $50$ are women and $30$ are men. Of the women, $35$ support a new park, and of the men, $12$ support it. What percent of the men support the park?'
            answer: '40%'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The group is the men, who number $30$. Of them, $12$ support the park, so $12/30=0.4$, which is $40\%$.'
          - problem: 'A school has $400$ students. The band has $120$ members, and $30$ of the band members are left-handed. Another $30$ students outside the band are left-handed. Is a band member or a student outside the band more likely to be left-handed?'
            answer: 'band member'
            answer_contract: {"kind": "label", "options": [["band member", "a band member", "band members", "the band member", "member of the band", "in the band", "band"], ["non-band student", "non band student", "a non-band student", "student outside the band", "outside the band", "not in the band", "other students"]]}
            solution_sketch: 'Among the $120$ band members the proportion is $30/120=1/4$. Among the $280$ other students it is $30/280=3/28$, which is smaller, so a band member is more likely.'
        constraints: 'divide a cell by its row or column total, not the grand total; the group named in the question sets the total'
    diagnostic_exemplar:
      problem: 'Of $60$ customers, $24$ bought coffee, and $15$ of the coffee buyers also bought food. What fraction of the coffee buyers bought food?'
      answer: '5/8'
      solution_sketch: 'Of the coffee buyers, $15$ of the $24$ bought food. The reference group is the coffee buyers, so the fraction is $15/24=5/8$.'
    anki_seeds:
      - front: 'Joint relative frequency $=$ ?'
        back: 'A table cell divided by the grand total.'
        type: basic
      - front: 'Marginal relative frequency $=$ ?'
        back: 'A row or column total divided by the grand total.'
        type: basic

  - id: conditional-probability-from-tables
    name: "Conditional Probability from Tables"
    core: true
    difficulty: 0.4
    drill: false
    answer_kind: numeric
    expected_time_secs: 120
    prerequisites:
      - id: two-way-frequency-tables
        weight: 0.7
        key: true
      - id: basic-probability
        weight: 0.4
        key: false
    knowledge_points:
      - id: kp1
        name: "Conditioning restricts to a row or column"
        key_prerequisites: [two-way-frequency-tables]
        step_check:
          step: 'Restrict to the $25$ people who own a car'
          question: 'Why does the solution use the $25$ car owners as the group and not all $40$ people?'
          options:
            - 'Restricting always means dividing by the smaller of the two groups in the problem'
            - 'The condition says the person owns a car, so only car owners can be chosen'
            - 'Using $40$ would be correct, but $25$ gives a simpler fraction to reduce'
            - 'The bike owners are removed so that the fraction is smaller than one'
          answer: 'The condition says the person owns a car, so only car owners can be chosen'
          why: 'After the condition "given car", the chosen person is certainly a car owner, so the $25$ car owners form the whole group.'
        try_first:
          problem: 'In a group of $20$ people, $8$ wear glasses and $2$ of those $8$ are children. One person is chosen at random from the group, and you are told that the person wears glasses. Among how many people is the choice now made?'
          answer_contract: {"kind": "exact"}
          answer: '8'
          reveal: 'The information that the person wears glasses removes everyone else from the group, so only the $8$ glasses wearers are left. The probability that the person is a child is then $2/8$, not $2/20$.'
        exemplars:
          - problem: 'In a year group of $30$ students, $18$ study French and $12$ of those $18$ also study Spanish. Find $P(\text{Spanish}\mid\text{French})$.'
            answer: '2/3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The condition restricts the group to the $18$ French students. Of these, $12$ study Spanish, so the probability is $12/18=2/3$.'
          - problem: 'In a class of $50$ students, $30$ are in year 9, and $12$ of the year 9 students play an instrument. A year 9 student is chosen at random. What is the probability that the student plays an instrument?'
            answer: '2/5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Only year 9 students can be chosen, so the group has $30$ students. Of them, $12$ play, and $12/30=2/5$.'
          - problem: 'In a survey of $40$ commuters, $24$ ride the bus, and $15$ of those bus riders also carry a book. Find the probability that a commuter carries a book given that the commuter rides the bus.'
            answer: '5/8'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The given group is the $24$ bus riders. Among them $15$ carry a book, so the probability is $15/24=5/8$.'
          - problem: 'A clinic has $80$ patients. Of these, $50$ have a fever, and $15$ of the patients with a fever also have a cough. Find $P(\text{cough}\mid\text{fever})$.'
            answer: '3/10'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The given group is the $50$ patients with a fever, not all $80$. Of these $15$ have a cough, so the probability is $15/50=3/10$.'
          - problem: 'In a library survey of $60$ people, $25$ read novels and $36$ read history. Of the history readers, $12$ also read novels. A history reader is chosen at random. What is the probability that this person reads novels?'
            answer: '1/3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The choice is made among the $36$ history readers. Of them $12$ read novels, so the probability is $12/36=1/3$. The $25$ novel readers are not the group here.'
          - problem: 'A poll of $100$ voters finds that $45$ are under $30$, and $27$ of the voters under $30$ support a bond. Find $P(\text{supports the bond}\mid\text{under }30)$.'
            answer: '3/5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The condition limits the group to the $45$ voters under $30$. Of them $27$ support the bond, so the probability is $27/45=3/5$.'
          - problem: 'In a survey of $120$ people, $48$ own a bike. Of the bike owners, $18$ also own a car, and $30$ people own a car in all. A bike owner is chosen at random. What is the probability that this person owns a car?'
            answer: '3/8'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The group is the $48$ bike owners. Among them $18$ own a car, and the total of $30$ car owners is not needed. The probability is $18/48=3/8$.'
          - problem: 'Of $80$ patients, $50$ had a vaccine and $30$ did not. Among the vaccinated, $5$ became ill, and among the unvaccinated, $15$ became ill. A patient who did not have the vaccine is chosen at random. What is the probability that this patient became ill?'
            answer: '1/2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Only the $30$ unvaccinated patients can be chosen. Of them $15$ became ill, so the probability is $15/30=1/2$.'
        constraints: "two-way counts <= 100; the conditioning group is a row or column total"
      - id: kp2
        name: "P(A given B) versus P(B given A)"
        key_prerequisites: [two-way-frequency-tables]
        step_check:
          step: 'restrict to the walkers, so the denominator is $20$'
          question: 'Why is the denominator $20$ for $P(\text{chess club}\mid\text{walks})$?'
          options:
            - 'The smaller group is always the denominator, and $20$ is smaller than $24$'
            - 'The chess club is the event, so its total must sit in the denominator'
            - 'The given event, walking, fixes the group, so its total is below'
            - 'The overlap of $8$ is divided by the total of all $45$ students'
          answer: 'The given event, walking, fixes the group, so its total is below'
          why: 'The event after the bar is the given one; its group of $20$ walkers is the whole in which the chess club members are counted.'
        exemplars:
          - problem: 'In a survey of $45$ students, $20$ walk to school and $8$ of the walkers are in the chess club. In all, $24$ students are in the chess club. A chess club member is chosen at random. What is the probability that this student walks to school?'
            answer: '1/3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The group is the $24$ chess club members. Of them $8$ walk, so the probability is $8/24=1/3$. The $20$ walkers are not the group here.'
          - problem: 'In a survey of $45$ students, $20$ walk to school and $8$ of the walkers are in the chess club. In all, $24$ students are in the chess club. A student who walks to school is chosen at random. What is the probability that this student is in the chess club?'
            answer: '2/5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The group is the $20$ walkers. Of them $8$ are in the chess club, so the probability is $8/20=2/5$. The same $8$ students now sit over a different total.'
          - problem: 'Of $40$ pets, $25$ are dogs and $10$ of the dogs are trained. In all, $16$ pets are trained. A trained pet is chosen at random. What is the probability that it is a dog?'
            answer: '5/8'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The group is the $16$ trained pets. Of them $10$ are dogs, so the probability is $10/16=5/8$.'
          - problem: 'In a survey of $60$ students, $24$ own a bicycle, $18$ walk to school, and $9$ do both. Find $P(\text{owns a bicycle}\mid\text{walks to school})$ and $P(\text{walks to school}\mid\text{owns a bicycle})$.'
            answer: '(1/2, 3/8)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'Given walking, the group is the $18$ walkers, so the first probability is $9/18=1/2$. Given owning a bicycle, the group is the $24$ owners, so the second is $9/24=3/8$.'
          - problem: 'In a cafe, $80$ customers are surveyed: $32$ order coffee, $20$ order dessert, and $8$ order both. Find $P(\text{coffee}\mid\text{dessert})$ and $P(\text{dessert}\mid\text{coffee})$.'
            answer: '(2/5, 1/4)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'Given dessert, the group is the $20$ dessert customers, and $8$ of them ordered coffee, so the first probability is $8/20=2/5$. Given coffee, the group is the $32$ coffee customers, so the second is $8/32=1/4$.'
          - problem: 'In a library, $90$ books are checked: $36$ are fiction, $30$ have maps, and $12$ are fiction with maps. Tom finds the probability that a book with maps is fiction as $12/36$. What is the correct value?'
            answer: '2/5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The given group is the books with maps, which number $30$, and not the $36$ fiction books. The correct probability is $12/30=2/5$.'
          - problem: 'At a club, $100$ members are surveyed: $45$ play tennis, $30$ play golf, and $15$ play both. A member who plays golf is chosen at random. What is the probability that this member plays tennis?'
            answer: '1/2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The group is the $30$ golfers. Of them $15$ also play tennis, so the probability is $15/30=1/2$.'
        constraints: 'both directions from the same counts; numbers chosen so the two answers differ; at most two items ask for both'
      - id: kp3
        name: "Comparing conditional proportions"
        key_prerequisites: [two-way-frequency-tables]
        step_check:
          step: 'Express each proportion as a fraction'
          question: 'Why is each count divided by the size of its own group before the groups are compared?'
          options:
            - 'The groups differ in size, so only the rates can be compared'
            - 'Dividing by the group size always keeps the larger count the larger rate'
            - 'Counts can be compared only after they are written as decimals'
            - 'The group sizes are divided out so that both rates equal one half'
          answer: 'The groups differ in size, so only the rates can be compared'
          why: 'A group with more people can have more successes without a higher rate, so each count is turned into a proportion of its own group.'
        exemplars:
          - problem: 'In year 9, $12$ of $30$ students play an instrument. In year 10, $6$ of $20$ students play an instrument. Which year has the higher proportion of students who play?'
            answer: 'year 9'
            answer_contract: {"kind": "label", "options": [["year 9", "year nine", "9", "year 9 students", "the year 9 students", "grade 9"], ["year 10", "year ten", "10", "year 10 students", "the year 10 students", "grade 10"]]}
            solution_sketch: 'Year 9 has $12/30=2/5=4/10$ players. Year 10 has $6/20=3/10$. Since $4/10>3/10$, year 9 has the higher proportion.'
          - problem: 'Treatment A helped $18$ of $24$ patients, and treatment B helped $21$ of $30$ patients. By how much do the improvement rates of the two treatments differ?'
            answer: '1/20'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The rate for A is $18/24=3/4=15/20$. The rate for B is $21/30=7/10=14/20$. The difference is $15/20-14/20=1/20$.'
          - problem: 'In class A, $15$ of $25$ students passed a test. In class B, $16$ of $40$ students passed. How many times as large as the pass rate of class B is the pass rate of class A?'
            answer: '3/2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Class A has the rate $15/25=3/5$ and class B has $16/40=2/5$. Dividing the first rate by the second gives $(3/5)\div(2/5)=3/2$, so the pass rate of A is $3/2$ times that of B.'
          - problem: 'Store A delivered $12$ of $20$ orders on time. Store B delivered $14$ of $21$ orders on time. Which store delivers on time more often?'
            answer: 'store B'
            answer_contract: {"kind": "label", "options": [["store A", "a", "the first store", "the first"], ["store B", "b", "the second store", "the second"]]}
            solution_sketch: 'Store A has the rate $12/20=3/5=9/15$. Store B has $14/21=2/3=10/15$. Since $10/15>9/15$, store B is on time more often.'
          - problem: 'A store compares coupon use by buyer type. Of $40$ online buyers, $28$ used a coupon, and of $50$ in-store buyers, $30$ used a coupon. By how many percentage points do the coupon rates of online and in-store buyers differ?'
            answer: '10%'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Online buyers used coupons at the rate $28/40=70\%$. In-store buyers used them at $30/50=60\%$. The two rates differ by $70-60=10$ percentage points, with the online rate higher.'
          - problem: 'Hospital A treated $200$ patients and $180$ recovered. Hospital B treated $50$ patients and $47$ recovered. Dev says that A does better because $180$ is far more than $47$. By how many percentage points do the recovery rates of the two hospitals differ?'
            answer: '4%'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Dev compares counts, but the groups have different sizes. The rates are $180/200=90\%$ for A and $47/50=94\%$ for B, so they differ by $94-90=4$ percentage points, with B higher.'
        constraints: 'rates come from counts out of group sizes; the comparison is by a verdict, a difference or a ratio of the two rates'
    diagnostic_exemplar:
      problem: 'Of $40$ pet owners, $25$ own dogs and $16$ own cats, and $10$ own both. A cat owner is chosen at random. What is the probability that this person owns a dog?'
      answer: '5/8'
      solution_sketch: 'The group is the $16$ cat owners. Of them $10$ also own a dog, so the probability is $10/16=5/8$.'
    anki_seeds:
