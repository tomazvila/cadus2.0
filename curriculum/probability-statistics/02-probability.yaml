unit: probability
course: probability-statistics
module: "Probability"
topics:
  - id: listing-sample-spaces
    name: "Listing Sample Spaces"
    core: true
    difficulty: 0.25
    drill: false
    answer_kind: expression
    expected_time_secs: 90
    prerequisites:
      - id: multiplication-principle
        weight: 0.6
        key: true
    knowledge_points:
      - id: kp1
        name: 'Outcomes of one-stage experiments'
        key_prerequisites: []
        step_check:
          step: 'Identify all possible outcomes'
          question: 'Why must the list name all the possible outcomes, each one exactly once?'
          options:
            - 'Only the most likely results belong in a sample space, so rare ones are left out'
            - 'A result that is listed twice has twice the chance, so repeats are not allowed'
            - 'It is the set of all possible outcomes, so none is missing and none repeated'
            - 'The list must have one result for every object in the bag, whatever the labels'
          answer: 'It is the set of all possible outcomes, so none is missing and none repeated'
          why: 'A sample space is a set: it holds every possible outcome once, so a missing result or a repeated result makes the list wrong.'
        exemplars:
          - problem: 'List the sample space for rolling one six-sided die.'
            answer: '1, 2, 3, 4, 5, 6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'A die has six faces, and one roll shows exactly one of them. The sample space lists each result once: 1, 2, 3, 4, 5, 6.'
          - problem: 'A coin is flipped once. List the sample space.'
            answer: 'H, T'
            answer_contract: {"kind":"list","ordered":false,"member":{"kind":"exact"}}
            solution_sketch: 'A coin lands heads or tails, and no other result is possible. The sample space is H, T.'
          - problem: 'A bag holds cards numbered $3$, $5$, $8$ and $9$. One card is drawn. List the sample space.'
            answer: '3, 5, 8, 9'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The card drawn can show any one of the four numbers on the cards. The sample space is 3, 5, 8, 9.'
          - problem: 'One number is chosen at random from the prime numbers less than $10$. List the sample space.'
            answer: '2, 3, 5, 7'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The primes less than 10 are the only numbers that can be chosen. They are 2, 3, 5 and 7, and the number 1 is not prime, so the sample space is 2, 3, 5, 7.'
          - problem: 'A fair die is rolled and Ben records the remainder when the result is divided by $3$. List the sample space of what Ben records.'
            answer: '0, 1, 2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The results 1 to 6 leave the remainders 1, 2, 0, 1, 2, 0 when divided by 3. Each remainder is listed once, so the sample space is 0, 1, 2.'
          - problem: 'A team has four players wearing the shirt numbers $4$, $7$, $9$ and $11$. One of them is chosen at random to be captain. List the sample space for the number on the captain''s shirt.'
            answer: '4, 7, 9, 11'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The captain is exactly one of the four players, and each player has a different shirt number. The sample space is 4, 7, 9, 11.'
          - problem: 'A spinner has five equal sectors numbered $1$ to $5$. List the sample space for one spin.'
            answer: '1, 2, 3, 4, 5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'One spin stops on exactly one sector. The sectors are numbered 1 to 5, so the sample space is 1, 2, 3, 4, 5.'
          - problem: 'A raffle drum holds tickets numbered $21$ to $26$. One ticket is drawn. List the sample space.'
            answer: '21, 22, 23, 24, 25, 26'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The ticket numbers run from 21 to 26 without a gap. The draw gives one of them, so the sample space is 21, 22, 23, 24, 25, 26.'
          - problem: 'A spinner has three equal sectors labeled A, B and C. List the sample space for one spin.'
            answer: 'A, B, C'
            answer_contract: {"kind":"list","ordered":false,"member":{"kind":"exact"}}
            solution_sketch: 'One spin stops on exactly one of the three sectors. The sample space is A, B, C.'
          - problem: 'A drum contains seven tickets labeled P, Q, R, S, T, U and V. List the sample space for drawing one ticket.'
            answer: 'P, Q, R, S, T, U, V'
            answer_contract: {"kind":"list","ordered":false,"member":{"kind":"exact"}}
            solution_sketch: 'The ticket drawn is exactly one of the seven labeled tickets. The sample space is P, Q, R, S, T, U, V.'
        constraints: 'one-stage experiments with <= 8 outcomes (die, coin, spinner, labeled cards, a quantity recorded from one trial)'
      - id: kp2
        name: 'Outcomes of two-stage experiments'
        key_prerequisites: [multiplication-principle]
        step_check:
          step: 'Hold the first result fixed'
          question: 'A spinner with sectors A, B, C, D is spun and then a coin is flipped. Why does the list hold the first result fixed and run through all the second results before it moves on?'
          options:
            - 'Every first result gets paired with every second result, so no pair is missed'
            - 'Pairs that share a first result are equal, so each first result is listed only once'
            - 'Only the first stage changes the probability, so the second stage is listed once'
            - 'The order of the two results does not matter, so (A, H) and (H, A) count as one pair'
          answer: 'Every first result gets paired with every second result, so no pair is missed'
          why: 'Working through the second results for one fixed first result, and then for the next, is a systematic list: every combination appears once.'
        exemplars:
          - problem: 'A coin is flipped twice. List the sample space, writing each outcome as a pair (first flip, second flip).'
            answer: '(H,H),(H,T),(T,H),(T,T)'
            answer_contract: {"kind":"list","ordered":false,"member":{"kind":"exact"}}
            solution_sketch: 'Each flip has 2 results, so the sample space has 2 · 2 = 4 outcomes. Pairing each first flip with each second flip gives (H,H), (H,T), (T,H), (T,T).'
          - problem: 'A coin is flipped and then a spinner with sectors $1$, $2$ and $3$ is spun. List the sample space, writing each outcome as a pair (coin, spinner).'
            answer: '(H,1),(H,2),(H,3),(T,1),(T,2),(T,3)'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The coin has 2 results and the spinner has 3, so expect 2 · 3 = 6 pairs. Pair heads with 1, 2, 3 and then tails with 1, 2, 3.'
          - problem: 'A restaurant offers $2$ starters, numbered $1$ and $2$ on the menu, and $3$ mains, numbered $1$, $2$ and $3$. A set menu is one starter with one main. List every possible set menu as a pair (starter number, main number).'
            answer: '(1,1),(1,2),(1,3),(2,1),(2,2),(2,3)'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'There are 2 starters and 3 mains, so there are 2 · 3 = 6 set menus. Keep starter 1 and run through the three mains, then do the same for starter 2.'
          - problem: 'Two four-sided dice, each numbered $1$ to $4$, are rolled and the two numbers are added. List the sample space for the sum.'
            answer: '2, 3, 4, 5, 6, 7, 8'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The smallest sum is 1 + 1 = 2 and the largest is 4 + 4 = 8. Every whole number from 2 to 8 can occur, so the sample space is 2, 3, 4, 5, 6, 7, 8.'
          - problem: 'Two cards are drawn one after the other, without putting the first card back, from cards numbered $1$, $2$ and $3$. List the sample space as pairs (first card, second card).'
            answer: '(1,2),(1,3),(2,1),(2,3),(3,1),(3,2)'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The second card must differ from the first, so (1,1), (2,2) and (3,3) are impossible. That leaves 3 · 2 = 6 pairs: (1,2), (1,3), (2,1), (2,3), (3,1), (3,2).'
          - problem: 'Sam lists the sample space for spinning a spinner with sectors $1$, $2$ and $3$ and then a spinner with sectors $1$ and $2$ as (1,1), (1,2), (2,1), (2,2), (3,1). Which outcome is missing?'
            answer: '(3,2)'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The experiment has 3 · 2 = 6 outcomes, and Sam wrote only 5. The first result 3 must pair with both 1 and 2, so the missing pair is (3,2).'
          - problem: 'A spinner with sectors $1$ and $2$ is spun, and then a spinner with sectors $1$, $2$ and $3$ is spun. List the sample space.'
            answer: '(1,1),(1,2),(1,3),(2,1),(2,2),(2,3)'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The first spinner has 2 results and the second has 3, so there are 2 · 3 = 6 pairs. Pair the first result 1 with 1, 2, 3 and then the first result 2 with 1, 2, 3.'
          - problem: 'A lock code has two digits. The first digit is $1$ or $2$ and the second digit is $3$ or $4$. List all the possible codes as pairs (first digit, second digit).'
            answer: '(1,3),(1,4),(2,3),(2,4)'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The first digit has 2 choices and the second digit has 2 choices, so there are 2 · 2 = 4 codes. Pairing each first digit with each second digit gives (1,3), (1,4), (2,3), (2,4).'
          - problem: 'Two spinners are spun. The first has sectors A, B and C, and the second has sectors X and Y. List the sample space, writing each outcome as a pair (first spinner, second spinner).'
            answer: '(A,X),(A,Y),(B,X),(B,Y),(C,X),(C,Y)'
            answer_contract: {"kind":"list","ordered":false,"member":{"kind":"exact"}}
            solution_sketch: 'The first spinner has 3 results and the second has 2, so there are 3 · 2 = 6 pairs. Keep A and pair it with X and Y, then do the same for B and for C.'
        constraints: 'two stages; at most 7 outcomes in the answer; outcomes written as ordered pairs (single letters and digits are decidable; string outcomes like HH are not), or a quantity recorded from the two stages'
      - id: kp3
        name: 'Counting outcomes without listing'
        key_prerequisites: [multiplication-principle]
        step_check:
          step: 'Multiply: $2 \cdot 6 = 12$'
          question: 'Why do we multiply the $2$ coin results by the $6$ die results instead of adding them?'
          options:
            - 'Adding $2+6=8$ counts the coin results and the die results, but it makes no pairs'
            - 'Two stages need two operations, so the counts are first added and then doubled'
            - 'Multiplying always gives the bigger number, which is safer when counting outcomes'
            - 'Each coin result occurs with every die result, giving 2 groups of 6 pairs'
          answer: 'Each coin result occurs with every die result, giving 2 groups of 6 pairs'
          why: 'Each of the 6 die results can follow heads and can follow tails, so the pairs form 2 groups of 6; the sum 8 would only count the single results of each stage.'
        try_first:
          problem: 'A menu has $3$ starters and $4$ mains. A meal is one starter and one main. How many different meals are there?'
          answer_contract: {"kind":"exact"}
          answer: '12'
          reveal: 'Each of the 3 starters pairs with each of the 4 mains, so there are 3 · 4 = 12 meals. Multiplying the stage counts gives the size of the sample space without listing it.'
        exemplars:
          - problem: 'How many outcomes are in the sample space of flipping a coin $3$ times?'
            answer: '8'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Each flip has 2 results, and there are three flips. By the multiplication principle the sample space has 2 · 2 · 2 = 8 outcomes.'
          - problem: 'How many outcomes are in the sample space of rolling two six-sided dice?'
            answer: '36'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Each die has 6 faces, and every face of one die can occur with every face of the other. The sample space has 6 · 6 = 36 ordered pairs.'
          - problem: 'A cafe offers $5$ sandwich types, $3$ drink sizes and $2$ bread choices. A meal deal is one sandwich, one drink size and one bread. How many different meal deals are possible?'
            answer: '30'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'One choice is made in each of three stages, so the multiplication principle applies. The number of meal deals is 5 · 3 · 2 = 30.'
          - problem: 'An experiment has three stages. Stage one has $7$ outcomes and stage two has $8$ outcomes. The whole experiment has $112$ outcomes. How many outcomes does stage three have?'
            answer: '2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The first two stages give 7 · 8 = 56 outcomes. The total is 112, so stage three has 112 / 56 = 2 outcomes.'
          - problem: 'A pizza shop offers $4$ crusts. A pizza is one crust with one topping, and the shop can make $36$ different pizzas. How many toppings does it offer?'
            answer: '9'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The number of pizzas is the number of crusts times the number of toppings, so 4 · t = 36. Dividing gives t = 36 / 4 = 9 toppings.'
          - problem: 'A lock code has $3$ digits, and each digit is any of $0$ to $9$. How many different codes are there?'
            answer: '1000'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Each of the 3 digits has 10 choices, and the choices are independent. The number of codes is 10 · 10 · 10 = 1000.'
          - problem: 'Sam says that flipping a coin $4$ times has $4 \cdot 2 = 8$ outcomes. What is the correct number of outcomes?'
            answer: '16'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Sam added the stages up as 4 groups of 2, but every flip doubles the count. The correct number is 2 · 2 · 2 · 2 = 16.'
          - problem: 'Lena can pick any of $7$ mains and any of $5$ desserts, but she has ruled out $3$ of the mains. How many different pairs of a main and a dessert can she still pick?'
            answer: '20'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Lena has 7 - 3 = 4 mains left. Each main pairs with each of the 5 desserts, so there are 4 · 5 = 20 pairs.'
          - problem: 'A coin is flipped several times and the sample space has $64$ outcomes. How many times was the coin flipped?'
            answer: '6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Each flip doubles the number of outcomes, so n flips give 2 to the power n outcomes. Since 64 = 2 · 2 · 2 · 2 · 2 · 2, the coin was flipped 6 times.'
        constraints: '2-3 stages, or a missing stage count worked back from a total; counts <= 1000; require the multiplication principle, not listing'
    diagnostic_exemplar:
      problem: 'A coin is flipped and a four-sided die is rolled. List the sample space.'
      answer: '(H,1),(H,2),(H,3),(H,4),(T,1),(T,2),(T,3),(T,4)'
      answer_contract: {"kind":"exact"}
      solution_sketch: 'Pair each coin result with each die result: 2 · 4 = 8 ordered outcomes.'
    anki_seeds:
      - front: 'The sample space of an experiment is...'
        back: 'The set of all possible outcomes.'
        type: basic
      - front: 'A two-stage experiment with $m$ outcomes then $n$ outcomes has how many outcomes total?'
        back: '$m \cdot n$ (multiplication principle).'
        type: basic

  - id: basic-probability
    name: "Basic Probability"
    core: true
    difficulty: 0.3
    drill: false
    answer_kind: numeric
    expected_time_secs: 90
    prerequisites:
      - id: listing-sample-spaces
        weight: 0.6
        key: true
      - id: equivalent-fractions
        weight: 0.6
        key: true
    knowledge_points:
      - id: kp1
        name: 'Probability as favorable over total'
        key_prerequisites: [equivalent-fractions]
        step_check:
          step: 'Count total outcomes: 3 + 5 = 8 marbles'
          question: 'A bag holds $3$ red and $5$ blue marbles, and a red one is wanted. Why is the total $8$ marbles and not $5$, the number of blue ones?'
          options:
            - 'Probability compares red with blue, so the divisor is the blue count'
            - 'The total counts every marble that could be drawn, red and blue together'
            - 'The total is the larger of the two color counts, because it must be the bigger one'
            - 'Only the color asked about can be drawn, so the total is the red count'
          answer: 'The total counts every marble that could be drawn, red and blue together'
          why: 'Every marble in the bag could be drawn, so the total is red plus blue; counting only the blue ones would give the odds 3 to 5, not the probability.'
        try_first:
          problem: 'A bag holds $1$ green marble and $9$ yellow marbles. One marble is drawn at random. What is the probability that it is green?'
          answer_contract: {"kind":"exact"}
          answer: '1/10'
          reveal: 'There is 1 green marble among 1 + 9 = 10 marbles, and every marble is equally likely to be drawn, so the probability is 1/10. Favorable outcomes over total outcomes is the rule for this lesson.'
        exemplars:
          - problem: 'A bag holds $3$ red and $5$ blue marbles. One marble is drawn at random. What is the probability that it is red?'
            answer: '3/8'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The bag holds 3 + 5 = 8 marbles, and 3 of them are red. The probability is the favorable count over the total count, 3/8.'
          - problem: 'A fair die is rolled. What is the probability of rolling an even number?'
            answer: '1/2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The even faces are 2, 4 and 6, so 3 of the 6 equally likely faces are favorable. The probability is 3/6 = 1/2.'
          - problem: 'A class has $12$ boys and $18$ girls. One student is chosen at random. What is the probability that the student is a girl?'
            answer: '3/5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The class has 12 + 18 = 30 students, and 18 of them are girls. The probability is 18/30, which reduces to 3/5.'
          - problem: 'A spinner has $10$ equal sectors, and $4$ of them are green. What is the probability that one spin lands on green?'
            answer: '2/5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Each of the 10 sectors is equally likely, and 4 of them are green. The probability is 4/10 = 2/5.'
          - problem: 'A raffle sells $200$ tickets, and Maya bought $5$ of them. One ticket is drawn at random. What is the probability that Maya wins?'
            answer: '1/40'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Maya holds 5 of the 200 equally likely tickets. The probability is 5/200, which reduces to 1/40.'
          - problem: 'A bag holds $4$ red marbles and some blue marbles. The probability of drawing a red marble is $1/4$. How many blue marbles are in the bag?'
            answer: '12'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Red is 1/4 of the marbles, so the total is 4 · 4 = 16 marbles. The blue marbles are the rest, 16 - 4 = 12.'
          - problem: 'Ali says the probability of drawing a red marble from a bag of $2$ red and $7$ green marbles is $2/7$. What is the correct probability?'
            answer: '2/9'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Ali divided by the 7 green marbles, but the total is every marble: 2 + 7 = 9. The correct probability is 2/9.'
          - problem: 'A jar contains $14$ yellow candies and $10$ purple candies. One candy is drawn at random. What is the probability that it is yellow?'
            answer: '7/12'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The jar holds 14 + 10 = 24 candies, and 14 are yellow. The probability is 14/24, which reduces to 7/12.'
        constraints: 'equally likely outcomes; totals <= 200; answers are fractions; includes one item worked back from a probability to a count'
      - id: kp2
        name: 'Probability via counting the sample space'
        key_prerequisites: [equivalent-fractions, listing-sample-spaces]
        step_check:
          step: 'the sample space has $6 \times 6 = 36$ equally likely ordered pairs'
          question: 'Two fair dice are rolled. Why is the total number of outcomes $36$ and not $12$, the number of faces on the two dice together?'
          options:
            - 'The 36 counts only the pairs with a sum of 7, since that is the event asked about'
            - 'The faces of the two dice are added to give the sum, so the total is 6 + 6 = 12'
            - 'A total of outcomes must be a square number, so 36 replaces the 12 faces'
            - 'Every face of one die pairs with every face of the other, giving 6 groups of 6'
          answer: 'Every face of one die pairs with every face of the other, giving 6 groups of 6'
          why: 'The sample space is the set of ordered pairs, and the multiplication principle gives 6 · 6 = 36 of them; 12 would count single faces, not outcomes.'
        exemplars:
          - problem: 'Two fair coins are flipped. What is the probability that both show heads?'
            answer: '1/4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The sample space is HH, HT, TH, TT, which has 4 equally likely outcomes. Only HH is favorable, so the probability is 1/4.'
          - problem: 'Two fair dice are rolled. What is the probability that the sum is $7$?'
            answer: '1/6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'There are 36 equally likely pairs, and the pairs (1,6), (2,5), (3,4), (4,3), (5,2), (6,1) add to 7. That is 6 of 36, so the probability is 1/6.'
          - problem: 'Two fair dice are rolled. What is the probability that the sum is $5$?'
            answer: '1/9'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The 36 pairs are equally likely, and the pairs that add to 5 are (1,4), (2,3), (3,2), (4,1). That is 4 of 36, so the probability is 4/36 = 1/9.'
          - problem: 'A fair coin is flipped three times. What is the probability of exactly two heads?'
            answer: '3/8'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Three flips give 2 · 2 · 2 = 8 equally likely outcomes. Exactly two heads happens in HHT, HTH and THH, so the probability is 3/8.'
          - problem: 'A spinner with sectors numbered $1$ to $4$ is spun twice. What is the probability that the two numbers add to $6$?'
            answer: '3/16'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Two spins give 4 · 4 = 16 equally likely pairs. The pairs (2,4), (3,3) and (4,2) add to 6, so the probability is 3/16.'
          - problem: 'A cafe lunch is one starter, soup or salad, and one drink, tea, juice, milk or water, all chosen at random. What is the probability that the lunch is salad with juice?'
            answer: '1/8'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'There are 2 starters and 4 drinks, so 2 · 4 = 8 equally likely lunches. Only one of them is salad with juice, so the probability is 1/8.'
          - problem: 'Two cards are drawn one after the other, without putting the first back, from cards numbered $1$, $2$, $3$ and $4$. What is the probability that the two numbers add to $5$?'
            answer: '1/3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The ordered pairs of different cards number 4 · 3 = 12. The pairs (1,4), (4,1), (2,3), (3,2) add to 5, so the probability is 4/12 = 1/3.'
          - problem: 'Sam says that when two fair coins are flipped, the probability of one head and one tail is $1/3$, because the outcomes are two heads, two tails, or one of each. What is the correct probability?'
            answer: '1/2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The three cases that Sam names are not equally likely. The 4 equally likely outcomes are HH, HT, TH, TT, and 2 of them have one head and one tail, so the probability is 2/4 = 1/2.'
          - problem: 'Two fair dice are rolled. What is the probability that the two numbers differ by $2$?'
            answer: '2/9'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Of the 36 equally likely pairs, 8 have a difference of 2: (1,3), (2,4), (3,5), (4,6) and the same four reversed. The probability is 8/36 = 2/9.'
        constraints: 'sample space of at most 36 equally likely outcomes; the favorable outcomes must be counted, not guessed'
      - id: kp3
        name: 'Events described by conditions'
        key_prerequisites: [listing-sample-spaces]
        step_check:
          step: 'List the favorable outcomes'
          question: 'A fair coin is flipped three times. Why is HHH among the favorable outcomes for at least two heads?'
          options:
            - 'At least two means two or more heads, so HHH meets the condition'
            - 'At least two means exactly two, and HHH is added to make the total even'
            - 'HHH has the most heads, so it is the only outcome that meets the condition'
            - 'The outcome HHH is a repeat of HHT, so it is counted a second time'
          answer: 'At least two means two or more heads, so HHH meets the condition'
          why: 'The words at least two mean two or more heads, so HHH with three heads meets the condition just as HHT, HTH and THH with two heads do.'
        exemplars:
          - problem: 'A fair die is rolled. What is the probability of rolling a prime number?'
            answer: '1/2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The primes on a die are 2, 3 and 5, so 3 of the 6 faces are favorable. The probability is 3/6 = 1/2.'
          - problem: 'One card is drawn from a standard deck of $52$ cards. What is the probability that it is a face card, that is a jack, a queen or a king?'
            answer: '3/13'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'There are 3 face ranks with 4 suits each, so 12 face cards among the 52 cards. The probability is 12/52 = 3/13.'
          - problem: 'Two fair dice are rolled. What is the probability that the sum is at least $10$?'
            answer: '1/6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The favorable sums are 10, 11 and 12, which come from the pairs (4,6), (5,5), (6,4), (5,6), (6,5) and (6,6). That is 6 of the 36 pairs, so the probability is 1/6.'
          - problem: 'A bag contains $5$ red marbles and $7$ blue marbles. One marble is drawn at random. What is the probability that it is not red?'
            answer: '7/12'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The condition not red is met by the 7 blue marbles. The bag holds 5 + 7 = 12 marbles, so the probability is 7/12.'
          - problem: 'A fair coin is flipped three times. What is the probability of at least one head?'
            answer: '7/8'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The 8 equally likely outcomes include one with no head, TTT. The other 7 have at least one head, so the probability is 7/8.'
          - problem: 'A number from $1$ to $20$ is chosen at random. What is the probability that it is a multiple of $3$?'
            answer: '3/10'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The multiples of 3 up to 20 are 3, 6, 9, 12, 15 and 18, which is 6 numbers. The probability is 6/20 = 3/10.'
          - problem: 'One card is drawn from a standard deck of $52$ cards. What is the probability that it is neither a heart nor a king?'
            answer: '9/13'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'There are 13 hearts and 4 kings, and the king of hearts is in both groups, so 13 + 4 - 1 = 16 cards are a heart or a king. The other 52 - 16 = 36 cards are favorable, so the probability is 36/52 = 9/13.'
          - problem: 'Two fair dice are rolled. What is the probability that the product of the two numbers is even?'
            answer: '3/4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The product is odd only when both numbers are odd, which happens in 3 · 3 = 9 of the 36 pairs. So 36 - 9 = 27 pairs give an even product, and the probability is 27/36 = 3/4.'
          - problem: 'Ana says the probability of rolling at most $2$ on a fair die is $1/6$, because only the face $2$ counts. What is the correct probability?'
            answer: '1/3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'At most 2 means the faces 1 and 2, so 2 of the 6 faces are favorable. The correct probability is 2/6 = 1/3.'
        constraints: 'event given as a verbal condition the solver must translate into outcomes; answers are fractions'
    diagnostic_exemplar:
      problem: 'Two fair dice are rolled. What is the probability that the sum is at least $9$?'
      answer: '5/18'
      answer_contract: {"kind":"exact"}
      solution_sketch: 'Sums 9, 10, 11 and 12 have 4 + 3 + 2 + 1 = 10 of the 36 outcomes. The probability is 10/36 = 5/18.'
    anki_seeds:
      - front: 'For equally likely outcomes, $P(A) =$ ?'
        back: '$\frac{\text{favorable outcomes}}{\text{total outcomes}}$.'
        type: basic
      - front: 'Every probability lies between... (inclusive)'
        back: '$0$ and $1$.'
        type: basic

  - id: experimental-theoretical-probability
    name: "Experimental vs Theoretical Probability"
    core: true
    difficulty: 0.3
    drill: false
    answer_kind: numeric
    expected_time_secs: 90
    prerequisites:
      - id: basic-probability
        weight: 0.7
        key: true
      - id: fraction-decimal-conversion
        weight: 0.3
        key: false
    knowledge_points:
      - id: kp1
        name: 'Theoretical vs experimental'
        key_prerequisites: [basic-probability]
        step_check:
          step: 'Identify the total number of trials'
          question: 'A spinner with $8$ equal sections is spun $100$ times. Why does the experimental probability of one section divide by $100$ and not by $8$?'
          options:
            - 'The divisor is the number of sections, and $100$ is just a round number'
            - 'It is based on what happened, so the divisor is the number of spins made'
            - 'The $100$ counts the spins that missed section $3$, so the divisor is the misses'
            - 'Dividing by $100$ turns the count into a percent, and $8$ would give a decimal'
          answer: 'It is based on what happened, so the divisor is the number of spins made'
          why: 'Experimental probability counts the event in the trials that were really done, so the trials are the total; the sections of the spinner belong to the theoretical model.'
        exemplars:
          - problem: 'What is the theoretical probability of rolling a $4$ with a fair six-sided die?'
            answer: '1/6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The theory uses the equally likely model and needs no data. One of the 6 faces is a 4, so the probability is 1/6.'
          - problem: 'A coin is flipped $50$ times and lands heads $23$ times. What is the experimental probability of heads?'
            answer: '23/50'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The experimental probability is the number of heads divided by the number of flips. There were 23 heads in 50 flips, so it is 23/50.'
          - problem: 'A number cube is rolled $60$ times and lands on $5$ a total of $9$ times. What is the experimental probability of rolling a $5$?'
            answer: '3/20'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The event occurred 9 times in 60 trials. The experimental probability is 9/60, which reduces to 3/20.'
          - problem: 'A standard deck has $4$ aces among $52$ cards. What is the theoretical probability that a randomly drawn card is an ace?'
            answer: '1/13'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The theory uses the equally likely model: 4 favorable cards among 52 cards. The probability is 4/52, which reduces to 1/13.'
          - problem: 'A basketball player takes $25$ free throws and makes $17$ of them. What is the experimental probability that a free throw is made?'
            answer: '17/25'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The experimental probability is the number of made throws over the number of attempts. That is 17 out of 25, so 17/25, which is already reduced.'
          - problem: 'Liam rolls a fair die $30$ times and gets four sixes. He says the probability of a six is $4/30$. Is that a theoretical or an experimental probability?'
            answer: 'experimental'
            answer_contract: {"kind":"label","options":[["experimental","an experimental probability","experimental probability"],["theoretical","a theoretical probability","theoretical probability"]]}
            solution_sketch: 'The fraction 4/30 comes from the 4 sixes Liam really rolled in 30 trials. A number taken from data is an experimental probability.'
          - problem: 'A bag holds $3$ red and $7$ blue marbles, so Nia says the probability of drawing red is $3/10$. Is that a theoretical or an experimental probability?'
            answer: 'theoretical'
            answer_contract: {"kind":"label","options":[["experimental","an experimental probability","experimental probability"],["theoretical","a theoretical probability","theoretical probability"]]}
            solution_sketch: 'The fraction 3/10 comes from counting the 3 red marbles among the 10 in the bag, without any draws. A number from the equally likely model is a theoretical probability.'
          - problem: 'A fair coin is flipped $40$ times and shows heads $26$ times. How many more heads is that than the theoretical probability predicts?'
            answer: '6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Theory predicts 40 · 1/2 = 20 heads. The coin showed 26 heads, which is 26 - 20 = 6 more.'
          - problem: 'Dee flips a coin $80$ times, and her experimental probability of heads is $0.45$. How many heads did she get?'
            answer: '36'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The experimental probability is heads divided by flips, so heads = 0.45 · 80. That gives 36 heads.'
        constraints: 'one item names the model, the other uses trial data; at most two items ask which kind of probability is meant; includes comparing a trial result with the prediction'
      - id: kp2
        name: 'Relative frequency from data'
        key_prerequisites: [basic-probability, fraction-decimal-conversion]
        step_check:
          step: 'Divide top and bottom by 2'
          question: 'A spinner lands on A $14$ times in $40$ spins, so the experimental probability of A is $14/40$. Why can the top and bottom both be divided by $2$?'
          options:
            - 'Dividing by $2$ halves the probability, which corrects for the two spinner results'
            - 'The $2$ stands for the two outcomes, A and B, so it is divided out of every count'
            - 'Only the denominator must be reduced, and the numerator is changed to match it'
            - 'Dividing both by one number gives an equal fraction, so the value stays'
          answer: 'Dividing both by one number gives an equal fraction, so the value stays'
          why: 'Dividing numerator and denominator by the same number gives an equal fraction, so 14/40 and 7/20 are the same experimental probability.'
        exemplars:
          - problem: 'A spinner is spun $40$ times. A comes up $14$ times and B comes up $26$ times. What is the experimental probability of A?'
            answer: '7/20'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'A occurred 14 times in 40 spins, so the experimental probability is 14/40. Dividing top and bottom by 2 gives 7/20.'
          - problem: 'A player makes $19$ of $25$ free throws. What is the experimental probability of a make?'
            answer: '19/25'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The player made 19 throws out of 25 attempts. The experimental probability is 19/25, which is 0.76.'
          - problem: 'A batter collects $12$ hits in $48$ at-bats. What is the experimental probability of a hit?'
            answer: '1/4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The relative frequency of a hit is 12 out of 48. Dividing top and bottom by 12 gives 1/4.'
          - problem: 'A quality inspector tests $80$ parts and finds $12$ defective. What is the experimental probability that a part is defective?'
            answer: '3/20'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The relative frequency is defective parts over parts tested, 12/80. Dividing top and bottom by 4 gives 3/20.'
          - problem: 'A soccer player takes $75$ penalty kicks and scores $39$. What is the experimental probability that a kick is a miss?'
            answer: '12/25'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The number of misses is 75 - 39 = 36. The relative frequency of a miss is 36/75, which reduces to 12/25.'
          - problem: 'A factory tests $130$ bulbs and finds $17$ faulty. What is the experimental probability that a bulb is faulty, to two decimal places?'
            answer: '0.13'
            answer_contract: {"kind":"approx","decimals":2}
            solution_sketch: 'The relative frequency is 17/130, which is about 0.1308. Rounded to two decimal places the experimental probability is 0.13.'
          - problem: 'In a survey of $120$ students, $45$ walk to school, $30$ cycle and the rest take the bus. What is the experimental probability that a student takes the bus?'
            answer: '3/8'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The students who take the bus are 120 - 45 - 30 = 45. The relative frequency is 45/120, which reduces to 3/8.'
          - problem: 'A goalkeeper saved $18$ of the penalties she faced, so her experimental probability of a save is $3/5$. How many penalties did she face?'
            answer: '30'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The saves are 3/5 of the penalties faced, so 18 = 3/5 of n. Then n = 18 / (3/5) = 18 · 5/3 = 30 penalties.'
          - problem: 'A bag is sampled with replacement $200$ times and red comes up $58$ times. What is the experimental probability of drawing a color other than red?'
            answer: '71/100'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The draws that were not red number 200 - 58 = 142. The relative frequency is 142/200, which reduces to 71/100.'
        constraints: 'trial counts <= 200; fractions reduce cleanly or convert to exact decimals; one rounded item; includes working back from a probability to a count'
      - id: kp3
        name: 'Expected counts'
        key_prerequisites: [basic-probability]
        step_check:
          step: 'Apply the rule: expected count $= n \cdot p = 300 \cdot \frac{2}{25}$'
          question: 'Why does the rule multiply the $300$ spins by the probability $2/25$?'
          options:
            - 'The probability is the share of trials with the event, so take that share of $n$'
            - 'The probability is a count of trials, so it is added to $n$ and then reduced'
            - 'Multiplying by a probability under $1$ always gives the exact count of the event'
            - 'The number $n$ is the total of all probabilities, so the product splits it evenly'
          answer: 'The probability is the share of trials with the event, so take that share of $n$'
          why: 'A probability of 1/6 means the event happens in about 1 of every 6 trials, so over n trials it is about n/6 times; this is an expected value, not a promise.'
        try_first:
          problem: 'A fair die is rolled $60$ times. How many fives are expected?'
          answer_contract: {"kind":"exact"}
          answer: '10'
          reveal: 'A five has probability 1/6 on each roll, so over 60 rolls it is expected 60 · 1/6 = 10 times. The expected count is the number of trials times the probability.'
        exemplars:
          - problem: 'A fair die is rolled $120$ times. How many sixes are expected?'
            answer: '20'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The probability of a six is 1/6. The expected count is 120 · 1/6 = 20.'
          - problem: 'A machine makes a defective part with probability $3/50$. In a batch of $200$ parts, how many defective parts are expected?'
            answer: '12'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The expected count is the number of parts times the probability of a defect. That is 200 · 3/50 = 12.'
          - problem: 'A bag holds $5$ red and $3$ blue marbles. A marble is drawn, recorded and put back, and this is done $64$ times. How many red draws are expected?'
            answer: '40'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The probability of red is 5/8 on every draw, because the marble is put back. The expected count is 64 · 5/8 = 40.'
          - problem: 'A biased coin lands heads with probability $3/10$. The coin is flipped $80$ times. How many heads are expected?'
            answer: '24'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The expected count is the number of flips times the probability of heads. That is 80 · 3/10 = 24.'
          - problem: 'A spinner lands on red with probability $2/9$. How many spins are needed to expect $100$ red results?'
            answer: '450'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The expected number of reds is n · 2/9, and it must equal 100. So n = 100 / (2/9) = 100 · 9/2 = 450 spins.'
          - problem: 'Each seed of a plant germinates with probability $0.8$. A farmer plants $250$ seeds. How many seeds are expected to germinate?'
            answer: '200'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The expected count is the number of seeds times the probability of germination. That is 250 · 0.8 = 200 seeds.'
          - problem: 'In a test, $9$ of $40$ batteries failed early. At this rate, how many of $1000$ batteries are expected to fail early?'
            answer: '225'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The experimental probability of an early failure is 9/40. The expected count for 1000 batteries is 1000 · 9/40 = 225.'
          - problem: 'Zoe says that when a fair coin is flipped $90$ times, the expected number of heads is $90 \cdot 2 = 180$. What is the correct expected number of heads?'
            answer: '45'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Zoe multiplied by 2, but the probability of heads is 1/2, so the expected count cannot exceed the 90 flips. The correct value is 90 · 1/2 = 45.'
        constraints: 'n times p is a whole number; n <= 1000; includes working back from an expected count to the number of trials'
    diagnostic_exemplar:
      problem: 'A spinner lands on red $18$ times in $45$ spins. Based on this experimental probability, about how many reds should be expected in $200$ further spins?'
      answer: '80'
      solution_sketch: '$18/45 = 2/5$; $200 \cdot 2/5 = 80$.'
    anki_seeds:
      - front: 'Experimental probability of an event $=$ ?'
        back: '$\frac{\text{times the event occurred}}{\text{number of trials}}$.'
        type: basic
      - front: 'Expected count of an event in $n$ trials?'
        back: '$n \cdot P(\text{event})$.'
        type: basic

  - id: simulating-probability
    name: "Simulating Probability"
    core: false                # applications leaf topic
    difficulty: 0.35
    drill: false
    answer_kind: multi-step
    expected_time_secs: 120
    prerequisites:
      - id: experimental-theoretical-probability
        weight: 0.7
        key: true
    knowledge_points:
      - id: kp1
        name: 'Designing digit assignments'
        key_prerequisites: [experimental-theoretical-probability]
        step_check:
          step: 'Calculate the number of digits to assign'
          question: 'Why does a probability of $7/10$ call for exactly $7$ of the $10$ digits?'
          options:
            - 'Each digit stands for $1/7$ of the chance, so $7$ digits make a whole'
            - 'The $7$ is the number of spins to be simulated, so $7$ digits are needed'
            - 'Equally likely digits: $7$ of them give a chance of $7$ in $10$'
            - 'Any $7$ digits work only if they are the smallest ones, $0$ to $6$'
          answer: 'Equally likely digits: $7$ of them give a chance of $7$ in $10$'
          why: 'With ten equally likely digits, k digits give the probability k/10, so 7/10 needs 7 digits; any 7 different digits work, not only the smallest.'
        try_first:
          problem: 'A fair coin lands heads with probability $1/2$. One random digit from $0$ to $9$ simulates one flip. How many of the ten digits should stand for heads?'
          answer_contract: {"kind":"exact"}
          answer: '5'
          reveal: 'Every digit is equally likely, so the digits that stand for heads must be 1/2 of the ten, which is 5 digits. The share of digits assigned to an event must equal its probability.'
        exemplars:
          - problem: 'Rain falls on a given day with probability $6/10$. One random digit from $0$ to $9$ simulates one day, and the smallest digits stand for rain. Which digits stand for rain?'
            answer: '0, 1, 2, 3, 4, 5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The probability 6/10 means 6 of the 10 equally likely digits must stand for rain. The 6 smallest digits are 0, 1, 2, 3, 4, 5, and 6, 7, 8, 9 stand for no rain.'
          - problem: 'A basketball player makes a free throw with probability $2/5$. One random digit from $0$ to $9$ simulates one shot, and the smallest digits stand for a make. Which digits stand for a make?'
            answer: '0, 1, 2, 3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Write 2/5 in tenths: 2/5 = 4/10, so 4 of the 10 digits must stand for a make. The 4 smallest digits are 0, 1, 2, 3.'
          - problem: 'A machine works correctly with probability $7/10$. One random digit from $0$ to $9$ simulates one check, and the smallest digits stand for a failure. Which digits stand for a failure?'
            answer: '0, 1, 2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The probability of a failure is 1 - 7/10 = 3/10, so 3 of the 10 digits must stand for a failure. The 3 smallest digits are 0, 1, 2.'
          - problem: 'A bus arrives on time with probability $3/10$. One random digit from $0$ to $9$ simulates one arrival, and the largest digits stand for on time. Which digits stand for on time?'
            answer: '7, 8, 9'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The probability 3/10 means 3 of the 10 equally likely digits must stand for on time. The 3 largest digits are 7, 8, 9, and 0 to 6 stand for late.'
          - problem: 'A spinner lands on green with probability $0.25$. A random two-digit number from $00$ to $99$ simulates one spin. How many of the $100$ two-digit numbers should stand for green?'
            answer: '25'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The 100 two-digit numbers are equally likely, so the share that stands for green must be 0.25. That is 0.25 · 100 = 25 numbers.'
          - problem: 'A student simulates a hockey goalie saving a shot with one random digit from $0$ to $9$. The digits $0$, $1$, $2$, $3$, $4$, $5$ and $6$ stand for a save, and the other digits stand for a goal. What probability of a save does this simulate?'
            answer: '7/10'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Seven digits, 0 to 6, stand for a save, and all 10 digits are equally likely. The simulated probability of a save is 7/10.'
          - problem: 'A player scores with probability $0.35$. A random two-digit number from $00$ to $99$ simulates one attempt, and the numbers from $00$ upward stand for a score. What is the largest number that stands for a score?'
            answer: '34'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The share of scoring numbers is 0.35 · 100 = 35 numbers. Counting from 00, those numbers are 00 to 34, so the largest is 34.'
          - problem: 'A bag holds $3$ red, $2$ blue and $5$ green marbles. One random digit from $0$ to $9$ simulates one draw. The smallest digits stand for red, the next digits for blue and the rest for green. Which digits stand for blue?'
            answer: '3, 4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'There are 10 marbles, so each digit stands for one marble. Red takes the digits 0, 1, 2, so the 2 blue marbles take the next digits, 3 and 4.'
        constraints: 'probabilities with denominator dividing 10 (or 100 for digit pairs); the assignment must match the probability exactly; the digits that stand for the event are fixed by a rule such as the smallest or the largest digits'
      - id: kp2
        name: 'Reading simulation results'
        key_prerequisites: [experimental-theoretical-probability]
        step_check:
          step: 'there are $12$ digits'
          question: 'Why is the estimate found by dividing the hits by the number of digits in the run?'
          options:
            - 'The number of digits must match the denominator of the true probability'
            - 'Dividing by the number of digits turns the count into the true probability'
            - 'The digits are the successes, so every digit in the run counts as a hit'
            - 'Each digit is one trial, so hits over digits is hits over trials'
          answer: 'Each digit is one trial, so hits over digits is hits over trials'
          why: 'One random digit simulates one trial, so the length of the run is the number of trials; the estimate is hits over trials, and only a long run brings it close to the true probability.'
        exemplars:
          - problem: 'A weather simulation uses the digits $0$ to $4$ for a rainy day. The run $3 7 0 9 4 1 6 2 8 5 0 3$ covers $12$ days. What is the estimated probability of rain?'
            answer: '7/12'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The rainy digits are 0, 1, 2, 3, 4, and the run contains 7 of them. The estimate is hits over trials, 7/12.'
          - problem: 'A game uses the digits $0$ to $9$, and the digits $7$, $8$ and $9$ count as a win. The run $4 8 7 1 9 2 6 9 8 0 5 9 7 4 1 8 2 6 9 3$ covers $20$ rounds. What is the estimated probability of a win?'
            answer: '9/20'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The winning digits are 7, 8 and 9, and the run contains 9 of them. The estimate is 9 hits in 20 rounds, 9/20.'
          - problem: 'A spinner has $10$ equal sectors, and the digits $0$, $1$ and $2$ stand for red. The run $4 0 2 7 1 9 5 2 0 8 3 1 6 2 4$ covers $15$ spins. What is the estimated probability of red?'
            answer: '7/15'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The red digits are 0, 1 and 2, and the run contains 7 of them. The estimate is 7 hits in 15 spins, 7/15.'
          - problem: 'A factory marks a part defective when its digit is $0$ or $1$. The run $5 0 3 1 8 2 2 1 7 4 0 6 9 1 2 4 5 3$ covers $18$ parts. What is the estimated probability that a part is defective?'
            answer: '5/18'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'A defective part has the digit 0 or 1, and the run contains 5 of them. The estimate is 5 hits in 18 parts, 5/18.'
          - problem: 'A simulation uses the digits $0$ to $3$ for a made shot. The run $7 2 0 5 3 1 9 0 4 3 6 1 8 0 2 5 3 7 1 4 9 0$ covers $22$ shots. How many shots were made in the simulation?'
            answer: '12'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The made shots have the digits 0, 1, 2 or 3. Counting them in the run gives 12 made shots.'
          - problem: 'A coin simulation uses the digits $0$ to $4$ for heads. The run $6 1 8 4 0 9 2 7 3 5 8 1 9 4 6 0 2 7 5 3$ covers $20$ tosses. What is the estimated probability of heads?'
            answer: '1/2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The heads digits are 0, 1, 2, 3, 4, and the run contains 10 of them. The estimate is 10/20, which reduces to 1/2.'
          - problem: 'A shooter hits the target with probability $3/10$, simulated with the digits $0$, $1$ and $2$ for a hit. The run $5 0 8 2 7 1 9 4 0 6 3 2 8 1 5 7 0 9 2 4$ covers $20$ shots. How many more hits does the run show than the probability $3/10$ predicts?'
            answer: '2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The probability 3/10 predicts 20 · 3/10 = 6 hits. The run contains 8 digits from 0, 1, 2, so it shows 8 - 6 = 2 more hits.'
          - problem: 'A simulation of $40$ trials gives an estimated probability of $0.35$. How many of the trials were hits?'
            answer: '14'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The estimate is hits divided by trials, so hits = 0.35 · 40. That gives 14 hits.'
        constraints: '10-25 listed trials; estimates as exact fractions; includes counting hits only, comparing the estimate with the model, and working back from an estimate to a count'
      - id: kp3
        name: 'Reliability of estimates'
        key_prerequisites: [experimental-theoretical-probability]
        step_check:
          step: 'Recall that more trials lead to a more reliable estimate'
          question: 'Why does a larger number of trials make an estimate more reliable?'
          options:
            - 'Each extra trial pulls the true probability a little closer to the estimate'
            - 'Random highs and lows in single trials offset each other over many trials'
            - 'A longer run always lands exactly on the true probability of the event'
            - 'The random digits become more random as the run gets longer'
          answer: 'Random highs and lows in single trials offset each other over many trials'
          why: 'A short run can be far off by luck. In a long run the lucky highs and lows offset each other, so the relative frequency tends to settle near the true probability, though not exactly on it.'
        exemplars:
          - problem: 'Simulation A runs $90$ trials and simulation B runs $9000$ trials of the same experiment. Which simulation is more likely to give an estimate close to the true probability?'
            answer: 'B'
            answer_contract: {"kind":"label","options":[["B","simulation B","B is more reliable","simulation B is more reliable"],["A","simulation A","A is more reliable","simulation A is more reliable"]]}
            solution_sketch: 'More trials let the random highs and lows cancel out, so the estimate is steadier. Simulation B has 9000 trials, far more than the 90 of simulation A, so B is more reliable.'
          - problem: 'A simulation of $240$ trials estimates a probability whose true value is $0.3$. How many successes are expected?'
            answer: '72'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The expected count is the number of trials times the true probability. That is 240 · 0.3 = 72 successes.'
          - problem: 'Rosa ran a simulation of $70$ trials and estimated the probability as $0.4$. She repeats it with $8$ times as many trials and again estimates $0.4$. How many successes does the second run have?'
            answer: '224'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The second run has 8 times as many trials as the first, which is 70 · 8 = 560 trials. An estimate of 0.4 means 0.4 · 560 = 224 successes.'
          - problem: 'Lena ran three simulations of the same event: $12$ successes in $30$ trials, $96$ successes in $300$ trials and $960$ successes in $3000$ trials. What is the estimated probability from all three runs pooled together, to two decimal places?'
            answer: '0.32'
            answer_contract: {"kind":"approx","decimals":2}
            solution_sketch: 'Pooling adds the successes and the trials: 12 + 96 + 960 = 1068 successes in 30 + 300 + 3000 = 3330 trials. The estimate is 1068/3330, which is 0.32 to two decimal places.'
          - problem: 'One simulation of an event had $14$ successes in $40$ trials. Another run of the same simulation had $56$ successes in $160$ trials. What is the estimated probability from the two runs combined?'
            answer: '7/20'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Combining the runs gives 14 + 56 = 70 successes in 40 + 160 = 200 trials. The estimate is 70/200, which reduces to 7/20.'
          - problem: 'A fair coin is tossed $400$ times and lands heads $220$ times. How many more heads is that than expected?'
            answer: '20'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'A fair coin is expected to give 400 · 1/2 = 200 heads. The coin gave 220 heads, which is 220 - 200 = 20 more.'
          - problem: 'A spinner lands on red with true probability $0.2$. In $600$ spins it lands on red $180$ times. By how much does the relative frequency of red differ from $0.2$?'
            answer: '0.1'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The relative frequency of red is 180/600 = 0.3. This differs from the true probability 0.2 by 0.3 - 0.2 = 0.1.'
          - problem: 'Ben simulates a fair coin $20$ times and estimates the probability of heads as $0.7$. Sara simulates it $2000$ times and gets $0.51$. Whose estimate is more reliable?'
            answer: 'Sara'
            answer_contract: {"kind":"label","options":[["Sara","Sara's estimate","Sara is more reliable","Sara's estimate is more reliable"],["Ben","Ben's estimate","Ben is more reliable","Ben's estimate is more reliable"]]}
            solution_sketch: 'Sara used 2000 trials against the 20 trials of Ben, and more trials give a steadier estimate. Her value 0.51 is also close to the true probability 0.5, so her estimate is more reliable.'
        constraints: 'items about the number of trials and natural variability, with numeric answers (expected counts, pooled estimates) and at most two choices between two runs'
    diagnostic_exemplar:
      problem: 'A free throw succeeds with probability $3/10$. Give a digit assignment (digits $0$-$9$) that simulates one shot, then use it with the simulated digits $7\ 2\ 9\ 0\ 5\ 3\ 8\ 1\ 6\ 4$ to estimate the success probability.'
      answer: 'E.g. let $\{0, 1, 2\}$ mean a make ($3$ of $10$ digits); the list contains each digit once, so $3$ of the $10$ trials succeed: estimate $3/10$.'
      solution_sketch: 'The ten simulated digits are a permutation of $0$-$9$, so any valid $3$-digit assignment yields exactly $3$ hits.'
    anki_seeds:
      - front: 'In a digit simulation, the fraction of digits assigned to the event must equal...'
        back: 'The event''s probability.'
        type: basic
      - front: 'More simulation trials make the estimated probability...'
        back: 'Closer (on average) to the true probability.'
        type: basic

  - id: geometric-probability-models
    name: "Geometric Probability Models"
    core: false                # terminal probability-model branch
    difficulty: 0.35
    drill: false
    answer_kind: numeric
    expected_time_secs: 120
    prerequisites:
      - id: basic-probability
        weight: 0.7
        key: true
      - id: area-triangles-quadrilaterals
        weight: 0.4
        key: false
    knowledge_points:
      - id: kp1
        name: 'Length models'
        key_prerequisites: [basic-probability]
        step_check:
          step: 'Calculate the probability as the ratio of the marked length to the total length'
          question: 'Why is the probability the marked length divided by the total length?'
          options:
            - 'A point is equally likely anywhere, so its chance is the share of the length'
            - 'The marked piece is the shorter piece, so it must go over the longer one'
            - 'The lengths of the pieces add to $1$, so each length is already a probability'
          answer: 'A point is equally likely anywhere, so its chance is the share of the length'
          why: 'A point chosen at random has no favorite spot, so a piece with $\frac13$ of the length gets $\frac13$ of the probability.'
        exemplars:
          - problem: 'A point is chosen at random on a segment of length $12$. A marked piece of the segment has length $4$. What is the probability that the point lands in the marked piece?'
            answer: '1/3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The point is equally likely to land anywhere on the segment, so the chance is the marked length over the whole length. That gives $4/12$, which is $1/3$.'
          - problem: 'A point is chosen at random on a road from kilometer $2$ to kilometer $17$. A construction zone covers the part of the road from kilometer $5$ to kilometer $11$. What is the probability that the point lies in the construction zone?'
            answer: '2/5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The road has length $17-2=15$ and the construction zone has length $11-5=6$. The probability is the ratio of the two lengths, $6/15$, which is $2/5$.'
          - problem: 'A bus arrives at a random moment between 8:00 and 8:30. What is the probability that it arrives between 8:10 and 8:25?'
            answer: '1/2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The whole window lasts $30$ minutes and the stretch from 8:10 to 8:25 lasts $15$ minutes. Each moment is equally likely, so the probability is $15/30 = 1/2$.'
          - problem: 'A rope is $20$ m long. A point is chosen at random on the rope, and the probability that it lies in the red section is $3/5$. How long is the red section?'
            answer: '12'
            answer_contract: {"kind": "unit", "quantity": "length", "unit": "m", "allow_omitted": true}
            solution_sketch: 'The chance of landing in a section equals its length divided by $20$. So the red length is $3/5$ of $20$, which is $12$ m.'
          - problem: 'A number is chosen at random from the interval from $0$ to $10$. What is the probability that it is greater than $7$?'
            answer: '3/10'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Numbers greater than $7$ fill the part of the interval from $7$ to $10$, which has length $3$. The whole interval has length $10$, so the probability is $3/10$.'
          - problem: 'A cut is made at a random point along a strip of tape $25$ cm long. What is the probability that the cut is at least $5$ cm from both ends?'
            answer: '3/5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A cut at least $5$ cm from both ends must fall between the $5$ cm mark and the $20$ cm mark, a stretch of $15$ cm. The tape is $25$ cm long, so the probability is $15/25 = 3/5$.'
          - problem: 'A point is chosen at random on a footpath of length $18$. A closed section of the footpath has length $7$. What is the probability that the point lies in the closed section?'
            answer: '7/18'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The closed section has length $7$ and the whole footpath has length $18$. The probability is the ratio of these two lengths, so it is $7/18$.'
          - problem: 'A point is chosen at random on a segment of length $12$. Which piece is the point more likely to land in: the piece from $1$ to $4$ or the piece from $7$ to $11$?'
            answer: 'from 7 to 11'
            answer_contract: {"kind": "label", "options": [["from 7 to 11", "7 to 11", "the piece from 7 to 11", "the one from 7 to 11", "the second piece", "the second one", "the second", "second"], ["from 1 to 4", "1 to 4", "the piece from 1 to 4", "the one from 1 to 4", "the first piece", "the first one", "the first", "first"]]}
            solution_sketch: 'The piece from $1$ to $4$ has length $3$ and the piece from $7$ to $11$ has length $4$. The point is more likely to land in the longer piece, the one from $7$ to $11$.'
        constraints: 'segment lengths <= 30; answers exact fractions; a length asked for from a given probability uses a unit contract'
      - id: kp2
        name: 'Area models'
        key_prerequisites: [basic-probability, area-triangles-quadrilaterals]
        step_check:
          step: 'Divide the area of the shaded rectangle by the area of the large rectangle'
          question: 'Why is the area of the shaded rectangle divided by the area of the large rectangle?'
          options:
            - 'The shaded rectangle is smaller, so the larger area must always go on the bottom'
            - 'Area is length times width, so dividing undoes the multiplying in the first step'
            - 'Every part is equally likely, so the chance is the shaded share of the area'
          answer: 'Every part is equally likely, so the chance is the shaded share of the area'
          why: 'Every part of the large rectangle is equally likely, so a shaded region with $\frac16$ of the area gets probability $\frac16$.'
        exemplars:
          - problem: 'A $10 \times 8$ rectangle contains a shaded $4 \times 5$ rectangle. A point is chosen at random in the large rectangle. What is the probability that the point lies in the shaded rectangle?'
            answer: '1/4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The shaded area is $4\cdot 5 = 20$ and the large area is $10\cdot 8 = 80$. The probability is $20/80 = 1/4$.'
          - problem: 'A square dartboard has side $6$ and its square bullseye has side $2$. A dart lands at a random point of the board. What is the probability that it hits the bullseye?'
            answer: '1/9'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The board has area $6^2 = 36$ and the bullseye has area $2^2 = 4$. The probability is $4/36 = 1/9$.'
          - problem: 'A rectangular garden is $12$ m by $9$ m. A pond fills a $3$ m by $6$ m rectangle of the garden. A seed lands at a random point of the garden. What is the probability that it lands in the pond?'
            answer: '1/6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The garden has area $12\cdot 9 = 108$ square meters and the pond has area $3\cdot 6 = 18$ square meters. The probability is $18/108 = 1/6$.'
          - problem: 'A $6 \times 8$ rectangle contains a right triangle with legs $3$ and $4$. A point is chosen at random in the rectangle. What is the probability that it lies in the triangle?'
            answer: '1/8'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The triangle has area $\frac12\cdot 3\cdot 4 = 6$ and the rectangle has area $6\cdot 8 = 48$. The probability is $6/48 = 1/8$.'
          - problem: 'A rectangle is $8$ by $6$. A triangle inside it has base $6$ and height $6$. A point is chosen at random in the rectangle. What is the probability that the point lies in the triangle?'
            answer: '3/8'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The rectangle has area $8\cdot 6 = 48$ and the triangle has area $\frac12\cdot 6\cdot 6 = 18$. The probability is $18/48 = 3/8$.'
          - problem: 'A rectangular poster is $10$ cm by $6$ cm. A point chosen at random on the poster lies in the square logo with probability $3/20$. What is the side length of the logo?'
            answer: '3'
            answer_contract: {"kind": "unit", "quantity": "length", "unit": "cm", "allow_omitted": true}
            solution_sketch: 'The poster has area $10\cdot 6 = 60$ square centimeters, so the logo has area $3/20$ of $60$, which is $9$. A square of area $9$ has side $3$ cm.'
          - problem: 'A floor is $9$ m by $7$ m. A square rug with side $3$ m lies on the floor. A coin dropped at random on the floor can land anywhere on it. What is the probability that the coin does not land on the rug?'
            answer: '6/7'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The floor has area $9\cdot 7 = 63$ and the rug has area $3^2 = 9$, so the coin misses the rug on $63-9=54$ of the $63$ square meters. The probability is $54/63 = 6/7$.'
          - problem: 'A rectangle is $10$ by $5$. A triangle inside it has base $8$ and height $5$. A point is chosen at random in the rectangle. What is the probability that the point lies in the triangle?'
            answer: '2/5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The rectangle has area $10\cdot 5 = 50$ and the triangle has area $\frac12\cdot 8\cdot 5 = 20$. The probability is $20/50 = 2/5$.'
        constraints: 'rectangles, triangles, or squares with integer dimensions; area ratios reduce to clean fractions; a side length asked for from a given probability uses a unit contract'
      - id: kp3
        name: 'Spinners and circular targets'
        key_prerequisites: [basic-probability]
        step_check:
          step: 'Total angle around the center'
          question: 'Why is $360$ degrees the denominator when a spinner sector has angle $90$ degrees?'
          options:
            - 'Every spinner has $360$ equal sectors, and this sector counts as one of them'
            - 'The whole turn is $360$ degrees, and the sector is a share of that turn'
            - 'Degrees must be turned into a fraction by dividing by the largest angle given'
          answer: 'The whole turn is $360$ degrees, and the sector is a share of that turn'
          why: 'The pointer stops somewhere in a full turn of $360$ degrees, so a sector of $90$ degrees gets $\frac{90}{360}=\frac14$ of the chance.'
        try_first:
          problem: 'A spinner has a sector with central angle $45^\circ$. What is the probability that the pointer stops in that sector?'
          answer_contract: {"kind": "exact"}
          answer: '1/8'
          reveal: 'The pointer is equally likely to stop at any angle, so the chance is the sector angle over the full turn, $45/360 = 1/8$.'
        exemplars:
          - problem: 'A spinner has a sector with central angle $90^\circ$. What is the probability that the spinner lands in that sector?'
            answer: '1/4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The full turn is $360^\circ$ and the sector takes $90^\circ$ of it. The probability is $90/360 = 1/4$.'
          - problem: 'A circular target has radius $6$ and its inner circle has radius $2$. What is the probability that a random point of the target lies in the inner circle?'
            answer: '1/9'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The areas are $\pi\cdot 2^2 = 4\pi$ and $\pi\cdot 6^2 = 36\pi$. The $\pi$ cancels, so the probability is $4/36 = 1/9$.'
          - problem: 'A spinner is fair, and the probability of landing in the shaded sector is $1/5$. What is the central angle of the shaded sector?'
            answer: '72'
            answer_contract: {"kind": "unit", "quantity": "angle", "unit": "degree", "allow_omitted": true}
            solution_sketch: 'The probability equals the central angle divided by $360$. So the angle is $\frac15$ of $360$, which is $72$ degrees.'
          - problem: 'A dartboard has radius $10$ cm and its bullseye has radius $2$ cm. A dart hits the board at a random point. What is the probability that the dart misses the bullseye?'
            answer: '24/25'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The board has area $100\pi$ and the bullseye has area $4\pi$, so the dart hits the bullseye with probability $4/100 = 1/25$. It misses with probability $1 - 1/25 = 24/25$.'
          - problem: 'A spinner is split into three sectors. The red sector has central angle $150^\circ$ and the blue sector has central angle $120^\circ$. The rest of the spinner is green. What is the probability that the spinner lands on green?'
            answer: '1/4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The green sector has central angle $360 - 150 - 120 = 90$ degrees. The probability is $90/360 = 1/4$.'
          - problem: 'Ana says that a dart landing at a random point of a target of radius $8$ hits the inner circle of radius $4$ with probability $1/2$, because $4$ is half of $8$. What is the correct probability?'
            answer: '1/4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The chance depends on areas, not on radii. The areas are $16\pi$ and $64\pi$, so the correct probability is $16/64 = 1/4$.'
          - problem: 'A circular target has radius $10$ cm. A random point of the target lies in the inner circle with probability $9/100$. What is the radius of the inner circle?'
            answer: '3'
            answer_contract: {"kind": "unit", "quantity": "length", "unit": "cm", "allow_omitted": true}
            solution_sketch: 'The target has area $100\pi$, so the inner circle has area $\frac{9}{100}\cdot 100\pi = 9\pi$. Then $r^2 = 9$ and the radius is $3$ cm.'
          - problem: 'A circular target has radius $5$ and its inner circle has radius $2$. What is the probability that a random point of the target lies in the inner circle?'
            answer: '4/25'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The areas are $\pi\cdot 2^2 = 4\pi$ and $\pi\cdot 5^2 = 25\pi$. The $\pi$ cancels, so the probability is $4/25$.'
        constraints: 'angles divide 360 evenly; radii chosen so the ratio of squares reduces cleanly; an angle or radius asked for uses a unit contract'
    diagnostic_exemplar:
      problem: 'A $12 \times 5$ rectangle contains a right triangle with legs $6$ and $5$. A point is chosen at random in the rectangle. Find the probability it lies in the triangle.'
      answer: "1/4"
      solution_sketch: 'Triangle area $\frac{1}{2} \cdot 6 \cdot 5 = 15$; rectangle area $60$; $15/60 = 1/4$.'
    anki_seeds:
      - front: 'Geometric probability $=$ ?'
        back: '$\frac{\text{size of favorable region}}{\text{size of total region}}$ (length, area, or angle).'
        type: basic
      - front: 'Probability a spinner lands in a sector with central angle $\theta$?'
        back: '$\frac{\theta}{360^\circ}$.'
        type: basic

  - id: complement-rule
    name: "The Complement Rule"
    core: true
    difficulty: 0.3
    drill: false
    answer_kind: numeric
    expected_time_secs: 60
    prerequisites:
      - id: basic-probability
        weight: 0.7
        key: true
      - id: adding-subtracting-fractions
        weight: 0.4
        key: false
    knowledge_points:
      - id: kp1
        name: 'Complement from a given probability'
        key_prerequisites: [adding-subtracting-fractions]
        step_check:
          step: 'Subtract the given probability from 1'
          question: 'Why do we subtract the given probability from $1$ to find $P(\text{not } B)$?'
          options:
            - 'Subtraction is the usual way to compare two fractions that share a denominator'
            - 'B and not B together cover every outcome, so their probabilities add to $1$'
            - 'The probabilities of B and not B multiply to give $1$, so we divide to undo that'
          answer: 'B and not B together cover every outcome, so their probabilities add to $1$'
          why: 'Either B happens or it does not, so $P(B)+P(\text{not } B)=1$ and $P(\text{not } B)=1-\frac59=\frac49$.'
        try_first:
          problem: 'The probability of rain tomorrow is $0.8$. What is the probability that it does not rain tomorrow?'
          answer_contract: {"kind": "exact"}
          answer: '0.2'
          reveal: 'It either rains or it does not, so the two chances add to $1$. That gives $1 - 0.8 = 0.2$.'
        exemplars:
          - problem: 'If $P(A) = 3/7$, what is $P(\text{not } A)$?'
            answer: '4/7'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Either A happens or it does not, so the two probabilities add to $1$. Then $P(\text{not } A) = 1 - 3/7 = 4/7$.'
          - problem: 'The chance of rain on Saturday is $0.3$. What is the chance that it does not rain on Saturday?'
            answer: '0.7'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Rain happens or it does not, so the two chances add to $1$. The chance of no rain is $1 - 0.3 = 0.7$.'
          - problem: 'The probability that a flight departs on time is $11/12$. What is the probability that the flight departs late?'
            answer: '1/12'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A flight is either on time or late, so the probabilities add to $1$. The chance of a late flight is $1 - 11/12 = 1/12$.'
          - problem: 'There is a $35\%$ chance that a train is delayed. What is the chance that it is not delayed?'
            answer: '65%'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The train is delayed or not delayed, so the chances add to $100\%$. The chance of no delay is $100\% - 35\% = 65\%$.'
          - problem: 'The probability that Sam does not win a game is $5/8$. What is the probability that Sam wins?'
            answer: '3/8'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Winning and not winning together cover every case, so their probabilities add to $1$. Then $P(\text{win}) = 1 - 5/8 = 3/8$.'
          - problem: 'A machine works correctly with probability $8/11$. What is the probability that it does not work correctly?'
            answer: '3/11'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The machine works correctly or it does not, so the probabilities add to $1$. The chance of a fault is $1 - 8/11 = 3/11$.'
          - problem: 'Can an event $E$ and its complement $\text{not } E$ have probabilities $0.4$ and $0.5$?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "yes, they can", "yes they can", "they can", "possible", "yes, it is possible", "yes, possible", "yes it is possible"], ["no", "no, they cannot", "no they cannot", "no, they can't", "no they can't", "they cannot", "not possible", "no, not possible"]]}
            solution_sketch: 'An event and its complement together cover every outcome, so their probabilities must add to $1$. Here $0.4 + 0.5 = 0.9$, which is not $1$, so it is not possible.'
          - problem: 'The probability that a bus is late is $0.25$. What is the probability that it is on time?'
            answer: '0.75'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The bus is late or on time, so the probabilities add to $1$. The chance of arriving on time is $1 - 0.25 = 0.75$.'
        constraints: 'P(A) given as a fraction with denominator <= 12, a decimal or a percent; the reverse direction (from P(not A) to P(A)) is allowed'
      - id: kp2
        name: 'Complement by counting'
        key_prerequisites: [basic-probability]
        step_check:
          step: 'The complement rule: P(not red) = 1 - P(red)'
          question: 'Why does $1 - P(\text{red})$ give $P(\text{not red})$?'
          options:
            - 'The red marbles leave the bag when drawn, so a smaller bag is left'
            - 'The two chances must be equal, so each one is half of $1$'
            - 'Every marble is red or not red, so the two chances cover the bag'
          answer: 'Every marble is red or not red, so the two chances cover the bag'
          why: 'A drawn marble is red or it is not, so $P(\text{red}) + P(\text{not red}) = 1$, which gives $1 - \frac25 = \frac35$.'
        exemplars:
          - problem: 'A fair die is rolled. What is the probability that the result is not a $6$?'
            answer: '5/6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Only one of the six faces shows a $6$, so $P(6) = 1/6$. The complement gives $1 - 1/6 = 5/6$.'
          - problem: 'One card is drawn from a standard deck of $52$ cards. What is the probability that it is not a heart?'
            answer: '3/4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'There are $13$ hearts in $52$ cards, so $P(\text{heart}) = 13/52 = 1/4$. Then $P(\text{not a heart}) = 1 - 1/4 = 3/4$.'
          - problem: 'A bag holds $4$ red marbles and $6$ blue marbles. One marble is drawn at random. What is the probability that it is not red?'
            answer: '3/5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The bag holds $10$ marbles and $4$ are red, so $P(\text{red}) = 4/10$. Then $P(\text{not red}) = 1 - 4/10 = 6/10 = 3/5$.'
          - problem: 'A fair die is rolled. What is the probability that the result is not an even number?'
            answer: '1/2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Three of the six faces are even, so $P(\text{even}) = 3/6 = 1/2$. Then $P(\text{not even}) = 1 - 1/2 = 1/2$.'
          - problem: 'One card is drawn from a standard deck of $52$ cards. What is the probability that it is not a face card?'
            answer: '10/13'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A deck has $12$ face cards, so $P(\text{face card}) = 12/52$. Then $P(\text{not a face card}) = 40/52 = 10/13$.'
          - problem: 'A bag holds $5$ green marbles, $7$ yellow marbles and $3$ white marbles. One marble is drawn at random. What is the probability that it is not green?'
            answer: '2/3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The bag holds $5 + 7 + 3 = 15$ marbles and $5$ are green. Then $P(\text{not green}) = 1 - 5/15 = 10/15 = 2/3$.'
          - problem: 'In a class of $28$ students, $9$ walk to school. One student is chosen at random. What is the probability that the student does not walk to school?'
            answer: '19/28'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The number who do not walk is $28 - 9 = 19$. The probability is $19/28$, which is also $1 - 9/28$.'
          - problem: 'A bag holds $20$ marbles. The probability that a marble drawn at random is not blue is $3/4$. How many blue marbles are in the bag?'
            answer: '5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The probability of a blue marble is $1 - 3/4 = 1/4$. Then $\frac14$ of the $20$ marbles are blue, which is $5$ marbles.'
        constraints: 'dice, cards, marbles, class counts; the reverse direction (from P(not A) to a count) is allowed'
      - id: kp3
        name: 'Choosing the complement route'
        key_prerequisites: [basic-probability, adding-subtracting-fractions]
        step_check:
          step: '''no heads'', which is only TTT'
          question: 'Why is it easier to count the outcomes with no heads than those with at least one head?'
          options:
            - 'Only one of the $8$ outcomes has no heads, while seven have a head'
            - 'Outcomes with no heads are the most likely ones, so they are listed first'
            - 'The outcome TTT can occur in $3$ different orders, which makes it easy to track'
          answer: 'Only one of the $8$ outcomes has no heads, while seven have a head'
          why: 'Listing the seven outcomes with a head is long, but only TTT has none, so $1 - \frac18 = \frac78$ is quick.'
        exemplars:
          - problem: 'Two fair dice are rolled. What is the probability that the sum is not $12$?'
            answer: '35/36'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Only the outcome $(6,6)$ gives a sum of $12$, so that sum has probability $1/36$. The complement gives $1 - 1/36 = 35/36$.'
          - problem: 'A raffle has $10$ tickets and $3$ of them win a prize. You hold one ticket. What is the probability that you do not win?'
            answer: '7/10'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'You win with probability $3/10$. You do not win with probability $1 - 3/10 = 7/10$.'
          - problem: 'Two fair dice are rolled. What is the probability that the sum is not $7$?'
            answer: '5/6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Six of the $36$ outcomes give a sum of $7$, so $P(\text{sum is } 7) = 6/36 = 1/6$. The complement gives $1 - 1/6 = 5/6$.'
