            solution_sketch: 'No card is both a king and a queen, so the two events share no outcome. Events with no shared outcome are mutually exclusive.'
          - problem: 'A fair die is rolled. What is the probability that the number is even and greater than $3$?'
            answer: '1/3'
            answer_contract: {"kind": "exact"}
