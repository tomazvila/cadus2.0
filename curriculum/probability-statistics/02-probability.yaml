      - id: kp2
        name: 'Adding probabilities of disjoint events'
        key_prerequisites: [basic-probability, adding-subtracting-fractions]
        step_check:
          step: 'A marble cannot be both blue and green, so the events are disjoint'
          question: 'Why is it fine to add $3/10$ and $2/10$ here?'
          options:
            - 'No marble is in both events, so the sum counts every marble once'
            - 'The two fractions share a denominator, so adding them always works'
            - 'Adding is always right for the word or, whatever the events are'
          answer: 'No marble is in both events, so the sum counts every marble once'
          why: 'Blue and green marbles are different marbles, so $3+2=5$ out of $10$ marbles are blue or green, which is $\frac12$.'
        exemplars:
          - problem: 'A fair die is rolled. What is the probability of rolling a $1$ or a $6$?'
            answer: '1/3'
            answer_contract: {"kind": "exact"}
