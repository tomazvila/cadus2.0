          - problem: 'A bag holds $5$ red, $3$ blue and $2$ green marbles. One marble is drawn at random. What is the probability that it is blue or green?'
            answer: '1/2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A marble cannot be both blue and green, so the events are disjoint. The probability is $3/10 + 2/10 = 5/10 = 1/2$.'
          - problem: 'One card is drawn from a standard deck of $52$ cards. What is the probability that it is a face card or an ace?'
            answer: '4/13'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A face card is never an ace, so the events are disjoint. There are $12$ face cards and $4$ aces, so the probability is $12/52 + 4/52 = 16/52 = 4/13$.'
          - problem: 'A box contains $7$ white balls, $5$ black balls and $8$ gray balls. One ball is drawn at random. What is the probability that it is white or gray?'
            answer: '3/4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The box holds $7 + 5 + 8 = 20$ balls, and no ball is both white and gray. The probability is $7/20 + 8/20 = 15/20 = 3/4$.'
          - problem: 'On a morning commute, a bus is early with probability $0.15$, on time with probability $0.6$, and otherwise late. What is the probability that the bus is not late?'
            answer: '0.75'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The bus cannot be both early and on time, so the probabilities add. The chance of not being late is $0.15 + 0.6 = 0.75$.'
          - problem: 'A bag holds $25$ marbles. The probability of drawing a red marble is $2/5$ and the probability of drawing a blue marble is $1/5$. All other marbles are green. How many green marbles are in the bag?'
            answer: '10'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Red or blue has probability $2/5 + 1/5 = 3/5$, so green has probability $1 - 3/5 = 2/5$. Then $\frac25$ of the $25$ marbles are green, which is $10$ marbles.'
          - problem: 'One card is drawn from a standard deck. Can $P(\text{heart or king})$ be found by adding $P(\text{heart})$ and $P(\text{king})$?'
