      - id: kp3
        name: 'Disjoint events and the total of 1'
        key_prerequisites: [basic-probability, adding-subtracting-fractions]
        step_check:
          step: '''Neither'' is the complement of ''A or B'''
          question: 'Why is $P(\text{neither})$ equal to $1 - P(A \text{ or } B)$?'
          options:
            - 'Neither means both events fail, so we multiply the chances that each one fails'
            - 'Either A or B happens or neither does, and these cover everything'
            - 'The word neither flips the sign of each probability before the two are added'
          answer: 'Either A or B happens or neither does, and these cover everything'
          why: 'Every outcome is in "A or B" or in "neither", so $P(\text{neither}) = 1 - \frac12 = \frac12$ once $P(A \text{ or } B)=\frac12$.'
        exemplars:
          - problem: 'Events $A$ and $B$ are mutually exclusive with $P(A) = 1/2$ and $P(B) = 1/3$. What is the probability that neither $A$ nor $B$ occurs?'
