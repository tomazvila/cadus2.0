unit: inference
course: probability-statistics
module: "Statistical Inference & Regression"
topics:
  - id: populations-samples
    name: "Populations & Samples"
    core: true
    difficulty: 0.3
    drill: false
    answer_kind: numeric
    expected_time_secs: 90
    prerequisites:
      - id: mean-median-mode
        weight: 0.6
        key: true
    knowledge_points:
      - id: kp1
        name: "Population versus sample"
        key_prerequisites: []
        exemplars:
          - problem: 'A researcher surveys $200$ of a city''s $40{,}000$ residents. Identify the population and the sample.'
            answer: 'Population: all $40{,}000$ residents; sample: the $200$ surveyed.'
            answer_contract: {kind: none}
            solution_sketch: 'The population is the entire group of $40{,}000$ residents about whom conclusions are drawn; the sample is the $200$ actually surveyed.'
          - problem: 'What is the difference between a census and a sample?'
            answer: 'A census measures every member of the population; a sample measures only part of it.'
            answer_contract: {kind: none}
            solution_sketch: 'A census covers the whole population; a sample covers only the part actually measured.'
          - problem: 'A researcher surveys $25$ of the $120$ teachers at a school. How many teachers are not in the sample?'
            answer: "95"
            solution_sketch: '$120 - 25 = 95$ teachers are left out of the sample.'
          - problem: 'A town conducts a census of its $4000$ residents. How many residents are measured?'
            answer: "4000"
            solution_sketch: 'A census measures every member of the population, so all $4000$.'
          - problem: 'A quality inspector tests $40$ of the $1000$ bulbs produced today. Which group is the population?'
            answer: 'all 1000 bulbs'
            answer_contract: {kind: label, options: [[all 1000 bulbs], [the 40 tested bulbs]]}
            solution_sketch: 'The population is the whole group about which conclusions are drawn; the $40$ tested are the sample.'
          - problem: 'A marine biologist measures the length of $30$ of the $2000$ fish in a lake. Which is larger, the population or the sample?'
            answer: 'the population'
            answer_contract: {kind: label, options: [[the population], [the sample]]}
            solution_sketch: 'The population (all $2000$ fish) contains the sample (the $30$ measured), so it is larger.'
        constraints: "concrete scenarios; the answer names both groups explicitly"
      - id: kp2
        name: "Parameter versus statistic"
        key_prerequisites: [mean-median-mode]
        exemplars:
          - problem: "A sample of 4 students has heights 150, 154, 158, 162 cm. Find the sample mean and state whether it is a parameter or a statistic."
            answer: "verdict = statistic; mean = 156"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["parameter"], ["statistic"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "mean"}]}
            solution_sketch: "The sample data are 150, 154, 158, 162. Step 1: sum the values: 150+154+158+162 = 624. Step 2: divide by the sample size 4: 624/4 = 156, so the sample mean is 156. Step 3: a mean computed from a sample is a statistic. The answer is verdict = statistic; mean = 156."
          - problem: "The symbol xbar denotes the sample mean. For the sample 5, 7, 9, find xbar and state whether xbar is a parameter or a statistic."
            answer: "verdict = statistic; mean = 7"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["parameter"], ["statistic"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "mean"}]}
            solution_sketch: "The sample data are 5, 7, 9. Step 1: sum: 5+7+9 = 21. Step 2: divide by 3: 21/3 = 7, so xbar = 7. Step 3: xbar is computed from a sample, so it is a statistic. The answer is verdict = statistic; mean = 7."
          - problem: "The population salaries 4, 6, 8, 10 have mean mu. Find mu and state whether it is a parameter or a statistic."
            answer: "verdict = parameter; mean = 7"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["parameter"], ["statistic"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "mean"}]}
            solution_sketch: "The population data are 4, 6, 8, 10. Step 1: sum: 4+6+8+10 = 28. Step 2: divide by 4: 28/4 = 7, so mu = 7. Step 3: mu describes the whole population, so it is a parameter. The answer is verdict = parameter; mean = 7."
          - problem: "A sample of 5 bolts has diameters 7, 8, 9, 8, 8 mm. Find the sample mean and state whether it is a parameter or a statistic."
            answer: "verdict = statistic; mean = 8"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["parameter"], ["statistic"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "mean"}]}
            solution_sketch: "The sample data are 7, 8, 9, 8, 8. Step 1: sum: 7+8+9+8+8 = 40. Step 2: divide by 5: 40/5 = 8, so the sample mean is 8. Step 3: the mean is from a sample, so it is a statistic. The answer is verdict = statistic; mean = 8."
          - problem: 'The population $2, 4, 6$ has mean $\mu$. Compute $\mu$.'
            answer: "4"
            solution_sketch: '$\mu = (2+4+6)/3 = 12/3 = 4$ — a parameter, since it describes the whole population.'
          - problem: 'The sample $3, 5, 7, 9$ has mean $\bar{x}$. Compute $\bar{x}$.'
            answer: "6"
            solution_sketch: '$\bar{x} = 24/4 = 6$ — a statistic, since it describes only the sample.'
        constraints: "one classification item and one notation item per set"
      - id: kp3
        name: "Why sample at all"
        key_prerequisites: []
        exemplars:
          - problem: "A city plans a census of 4000 households, and each interview costs 12 dollars. A sample of 400 households is interviewed at the same cost per household. Find the number of dollars the sample saves."
            answer: "43200"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1, census cost: 4000 times 12 equals 48000 dollars. Step 2, sample cost: 400 times 12 equals 4800 dollars. Step 3, subtraction: 48000 minus 4800 gives 43200 dollars. The sample saves 43200 dollars."
          - problem: "A team tests the breaking strength of 25 concrete beams taken from a batch of 500, loading each beam until it fails. State whether this testing ruins the tested beams, and give the number of beams in the batch that stay unbroken."
            answer: "verdict = destructive; intact = 475"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["destructive"], ["non-destructive"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "intact"}]}
            solution_sketch: "The full result has two parts: verdict = destructive and intact = 475. Step 1, classification: loading a beam until it fails leaves that unit broken, so the test is destructive and a census of all 500 would ruin the whole batch. Step 2, subtraction: only the 25 tested beams are ruined, so 500 minus 25 gives 475. The answer is verdict = destructive; intact = 475."
          - problem: 'A factory tests the lifetime of $50$ of the $5000$ bulbs it produced. How many bulbs escape destruction?'
            answer: "4950"
            solution_sketch: '$5000 - 50 = 4950$ bulbs are never tested — sampling spares the rest of the production run.'
          - problem: "A city wants the mean commute of all 50000 downtown workers, but the report is due tomorrow and only 200 interviews can be finished before then. Which single reason forces the use of a sample?"
            answer: "time"
            answer_contract: {"kind": "label", "options": [["time"], ["cost"], ["destruction"], ["precision"]]}
            solution_sketch: "The full scenario is a deadline: only 200 of the 50000 interviews fit before the report is due. Step 1, identify the binding limit: the deadline is what stops the census, so the class is time. Step 2, test each other option against the scenario. The option cost is wrong because no budget limit is given. The option destruction is wrong because an interview does not ruin the person interviewed. The option precision is wrong because a deadline does not control how exact one answer is. The answer is time."
          - problem: 'A fishery has $10000$ cod and a team can measure $100$ of them. The sample is what fraction of the population? Give a fraction in lowest terms.'
            answer: "1/100"
            solution_sketch: '$100/10000 = 1/100$ — a tiny sample suffices to estimate the population mean.'
          - problem: "Checking every one of 3000 households takes 8 minutes per household, while checking a sample of 300 takes the same 8 minutes each. Find the number of hours saved by using the sample."
            answer: "360"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1, census time: 3000 times 8 equals 24000 minutes. Step 2, sample time: 300 times 8 equals 2400 minutes. Step 3, difference and unit change: 24000 minus 2400 equals 21600 minutes, and 21600 divided by 60 gives 360 hours. The number of hours saved is 360."
        constraints: "scenarios where cost, time, or destructive testing forces sampling"
    diagnostic_exemplar:
      problem: 'An inspector tests $50$ of the $5000$ batteries produced in a day; the mean life of the $50$ is $21$ hours. Identify the population, the sample, and whether $21$ hours is a parameter or a statistic.'
      answer: 'Population: all $5000$ batteries; sample: the $50$ tested; $21$ hours is a statistic.'
      answer_contract: {kind: none}
      solution_sketch: 'The population is the whole group under study, the sample the part actually measured; a number computed from the sample is a statistic, one describing the population a parameter.'
    anki_seeds:
      - front: 'Parameter vs statistic?'
        back: 'A parameter describes the population; a statistic describes a sample.'
        type: basic
      - front: 'Which symbols go with the population, and which with the sample?'
        back: 'Population: $\mu, \sigma$. Sample: $\bar{x}, s$.'
        type: basic

  - id: sampling-methods-bias
    name: "Sampling Methods & Bias"
    core: false                # study-design branch; terminal
    difficulty: 0.35
    drill: false
    answer_kind: multi-step
    expected_time_secs: 120
    prerequisites:
      - id: populations-samples
        weight: 0.8
        key: true
    knowledge_points:
      - id: kp1
        name: "Simple random samples"
        key_prerequisites: [populations-samples]
        exemplars:
          - problem: 'What makes a sample of size $n$ a simple random sample?'
            answer: 'Every group of $n$ members of the population is equally likely to be chosen.'
          - problem: 'All $30$ class names go in a hat and $5$ are drawn. Is this an SRS?'
            answer: 'Yes; every set of $5$ names is equally likely.'
        constraints: "definitions and yes/no judgments with a stated reason"
      - id: kp2
        name: "Identifying sampling methods"
        key_prerequisites: [populations-samples]
        exemplars:
          - problem: 'A store surveys every $20$th customer. Name the sampling method.'
            answer: 'Systematic sampling.'
          - problem: 'A school randomly selects $10$ students from each year group. Name the method.'
            answer: 'Stratified sampling (the year groups are strata).'
          - problem: 'A district randomly picks $3$ classrooms and surveys everyone in them. Name the method.'
            answer: 'Cluster sampling.'
        constraints: "one scenario per method; the scenario names the selection mechanism precisely"
      - id: kp3
        name: "Recognizing bias"
        key_prerequisites: [populations-samples]
        exemplars:
          - problem: 'A website posts a poll that visitors choose to answer. What kind of bias does this invite?'
            answer: 'Voluntary response bias; people with strong opinions are overrepresented.'
          - problem: 'To estimate how much the city exercises, a researcher surveys people at a gym. What is wrong?'
            answer: 'Convenience sampling that undercovers non-gym-goers; the estimate will be too high.'
        constraints: "each scenario exhibits exactly one named bias; answer states the direction of the distortion when asked"
    diagnostic_exemplar:
      problem: 'A radio host asks listeners to call in and vote on a tax proposal. Will the results represent the city? Name the problem.'
      answer: 'No; voluntary response bias — only listeners with strong opinions call in.'
      solution_sketch: 'The sample selects itself: who chooses to call in is not a random draw from the city, and the people with strong views are the ones who bother — voluntary response bias.'
    anki_seeds:
      - front: 'Simple random sample (SRS) of size $n$?'
        back: 'Every group of $n$ population members has the same chance of selection.'
        type: basic
      - front: 'Voluntary response and convenience samples are usually...'
        back: 'Biased — they overrepresent strong opinions or easy-to-reach people.'
        type: basic

  - id: experimental-design-basics
    name: "Experimental Design Basics"
    core: false                # study-design branch; terminal
    difficulty: 0.4
    drill: false
    answer_kind: multi-step
    expected_time_secs: 150
    prerequisites:
      - id: sampling-methods-bias
        weight: 0.7
        key: true
    knowledge_points:
      - id: kp1
        name: "Observational study versus experiment"
        key_prerequisites: [sampling-methods-bias]
        exemplars:
          - problem: 'Researchers track the health of people who already chose their own diets. Observational study or experiment?'
            answer: 'Observational study; no treatment is imposed.'
          - problem: 'Researchers randomly assign volunteers to a supplement or a placebo. Observational study or experiment?'
            answer: 'Experiment; the researchers impose the treatment.'
        constraints: "the deciding question is always whether a treatment is imposed"
      - id: kp2
        name: "Treatments, control, and random assignment"
        key_prerequisites: [sampling-methods-bias]
        exemplars:
          - problem: 'Sixty plants are randomly split: half get a new fertilizer, half get none. Identify the treatment group and the control group.'
            answer: 'Treatment: the fertilized half; control: the unfertilized half.'
          - problem: 'What is the purpose of giving the control group a placebo?'
            answer: 'To keep the groups'' expectations equal, so any difference is due to the treatment itself.'
        constraints: "two-group designs; identify roles or justify a design element"
      - id: kp3
        name: "Confounding and causation"
        key_prerequisites: [sampling-methods-bias]
        exemplars:
          - problem: "A gym chain reports that branches with more personal trainers also sell more protein shakes. Candidates: (1) branch size, (2) trainer salary, (3) local interest in fitness, (4) shake flavor. Give the numbers of the candidates that plausibly drive both the trainer count and the shake sales, in increasing order."
            answer: "1, 3"
            answer_contract: {"kind": "list", "member": {"kind": "exact"}, "ordered": true}
            solution_sketch: "The candidates are branch size, trainer salary, local interest in fitness, and shake flavor. A confounder rule: the variable must plausibly drive both the trainer count and the shake sales. Branch size drives both counts, and local fitness interest drives both; trainer salary and shake flavor each drive only one side. The answer is 1, 3."
          - problem: "A company wants to claim that a new safety training reduces workplace injuries. Which design can support that claim?"
            answer: "Randomized"
            answer_contract: {"kind": "label", "options": [["Randomized"], ["Observational"], ["Before-and-after"], ["Case study"]]}
            solution_sketch: "The four designs are Randomized, Observational, Before-and-after, and Case study. Causation rule: only random assignment balances lurking variables, so a causal claim needs a Randomized design. Observational is wrong because workers who choose the training may already be safer (selection bias); Before-and-after is wrong because injury rates can shift with season or reporting rules and there is no control group; Case study is wrong because one workplace cannot support a general claim. The answer is Randomized."
          - problem: "A hospital compares patients who chose a new drug with patients who chose the usual care and finds faster recovery in the drug group. Candidates: (a) illness severity, (b) age, (c) room number, (d) curtain color. State whether a causal claim is supported, and give the number of candidates that are plausible confounders."
            answer: "verdict = unsupported; n = 2"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["supported"], ["unsupported"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "n"}]}
            solution_sketch: "The candidates are illness severity, age, room number, and curtain color. A confounder must plausibly drive both which drug a patient chose and how fast that patient recovered. Illness severity and age drive both, while room number and curtain color drive neither. With no random assignment, the causal claim is not supported, so the answer is verdict = unsupported; n = 2."
          - problem: "A health study reports that adults who drink diet soda weigh more. Candidates: (1) soda brand logo, (2) age, (3) bottle size, (4) amount of other sugary food eaten. Give the numbers of the candidates that plausibly drive both diet-soda drinking and body weight, in increasing order."
            answer: "2, 4"
            answer_contract: {"kind": "list", "member": {"kind": "exact"}, "ordered": true}
            solution_sketch: "The candidates are soda brand logo, age, bottle size, and amount of other sugary food eaten. A confounder must plausibly drive both diet-soda drinking and body weight. Age drives both, and eating more other sugary food raises weight while going with diet-soda drinking; the logo and bottle size drive neither. The answer is 2, 4."
          - problem: "A store finds that shoppers who carry a loyalty card spend more. The store randomly assigns 240 new shoppers in equal groups; half receive a card and half do not. State whether a causal claim is warranted, and give the number of shoppers who do not receive a card."
            answer: "claim = warranted; n = 120"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["warranted"], ["unwarranted"]]}, "name": "claim"}, {"contract": {"kind": "exact"}, "name": "n"}]}
            solution_sketch: "The store randomly assigns 240 shoppers in equal groups, half to the loyalty card and half to no card. Random assignment balances lurking variables in expectation, so a causal claim is warranted, unlike a comparison of shoppers who chose cards themselves. Half of 240 is 120, so the answer is claim = warranted; n = 120."
          - problem: "A grocery chain tests a new store layout. It randomly assigns 60 stores, with twice as many stores keeping the current layout as switching to the new one. Give the numbers of stores in each group as (new layout, current layout)."
            answer: "(20, 40)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "The object asked for is the pair of store counts written as (new layout, current layout). Let the number of new-layout stores be t, so the current-layout stores number 2t, and 3t = 60 gives t = 20. The answer is (20, 40)."
        constraints: "confounders must plausibly drive both variables; causation claims only from randomized experiments"
    diagnostic_exemplar:
      problem: 'To test a study app, $100$ volunteers are randomly split: $50$ use the app, $50$ do not, and exam scores are compared. Identify the treatment and control groups, and state why random assignment matters.'
      answer: 'Treatment: the $50$ app users; control: the $50$ non-users; random assignment balances lurking variables so score differences can be attributed to the app.'
      solution_sketch: 'The treatment group receives the intervention and the control group supplies the comparison; randomising the split is what balances the lurking variables, which is what licenses reading the difference as caused by the app.'
    anki_seeds:
      - front: 'Only which study design supports cause-and-effect conclusions?'
        back: 'A randomized experiment.'
        type: basic
      - front: 'A confounding variable is...'
        back: 'A third variable that influences both the explanatory and response variables, mixing up their apparent relationship.'
        type: basic

  - id: empirical-rule
    name: "The Empirical Rule"
    core: true
    difficulty: 0.45
    drill: false
    answer_kind: numeric
    expected_time_secs: 90
    prerequisites:
      - id: z-scores
        weight: 0.7
        key: true
      - id: percentages
        weight: 0.4
        key: false
    knowledge_points:
      - id: kp1
        name: "The 68-95-99.7 percentages"
        key_prerequisites: [z-scores, percentages]
        exemplars:
          - problem: 'Heights are normal with mean $170$ cm and SD $6$ cm. What proportion of heights lie between $164$ and $176$ cm? Give a decimal.'
            answer: "0.68"
            solution_sketch: 'That interval is $\mu \pm 1\sigma$, which holds about $68\%$ — a proportion of $0.68$.'
          - problem: 'For a normal distribution, what proportion of values lie within $2$ standard deviations of the mean? Give a decimal.'
            answer: "0.95"
            solution_sketch: 'The empirical rule gives about $95\%$, i.e. $0.95$.'
          - problem: 'Scores are normal with mean $100$ and SD $15$. What proportion of scores lie between $85$ and $115$? Give a decimal.'
            answer: "0.68"
            solution_sketch: 'That interval is $\mu \pm 1\sigma$: about $68\%$, i.e. $0.68$.'
          - problem: 'For a normal distribution, what proportion of values lie within $3$ standard deviations of the mean? Give a decimal.'
            answer: "0.997"
            solution_sketch: 'The empirical rule gives about $99.7\%$, i.e. $0.997$.'
          - problem: "A normal distribution has mean 50. The middle 95% of its values lie between 30 and 70. Find the standard deviation."
            answer: "10"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Empirical rule: the middle 95% of a normal distribution spans mean minus 2 standard deviations to mean plus 2 standard deviations. The given interval 30 to 70 has half-width (70 - 30)/2 = 20. So 2 standard deviations = 20 and the standard deviation is 10."
          - problem: "A normal distribution has standard deviation 4. The middle 99.7% of its values lie between 38 and 62. Find the mean."
            answer: "50"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Empirical rule: the middle 99.7% of a normal distribution spans mean minus 3 standard deviations to mean plus 3 standard deviations. Here 3 standard deviations = 3 times 4 = 12, so the interval is mean minus 12 to mean plus 12. The midpoint of 38 and 62 is (38 + 62)/2 = 50, so the mean is 50."
        constraints: "intervals land exactly on mu +/- 1, 2, or 3 sigma; area answers are decimal proportions"
      - id: kp2
        name: "Translating to raw intervals"
        key_prerequisites: [z-scores]
        exemplars:
          - problem: 'Marks (out of $10$) are normal with mean $6$ and SD $1$. Give the interval that holds the middle $95\%$ of marks.'
            answer: '$(4, 8)$'
            solution_sketch: '$\mu \pm 2\sigma = 6 \pm 2$.'
          - problem: 'Times are normal with mean $60$ and SD $5$. Give the interval that holds the middle $99.7\%$.'
            answer: '$(45, 75)$'
            solution_sketch: '$\mu \pm 3\sigma = 60 \pm 15$.'
          - problem: 'Marks are normal with mean $70$ and SD $5$. What is the lower endpoint of the interval holding the middle $95\%$ of marks?'
            answer: "60"
            solution_sketch: 'The middle $95\%$ is $\mu \pm 2\sigma$; the lower endpoint is $70 - 2 \cdot 5 = 60$.'
          - problem: 'Times are normal with mean $50$ and SD $4$. What is the upper endpoint of the interval holding the middle $99.7\%$ of times?'
            answer: "62"
            solution_sketch: 'The middle $99.7\%$ is $\mu \pm 3\sigma$; the upper endpoint is $50 + 3 \cdot 4 = 62$.'
          - problem: 'Heights are normal with mean $160$ and SD $8$. What is the upper endpoint of the interval holding the middle $68\%$ of heights?'
            answer: "168"
            solution_sketch: 'The middle $68\%$ is $\mu \pm 1\sigma$; the upper endpoint is $160 + 8 = 168$.'
          - problem: 'Marks are normal with mean $40$ and SD $6$. What is the lower endpoint of the interval holding the middle $99.7\%$ of marks?'
            answer: "22"
            solution_sketch: 'The middle $99.7\%$ is $\mu \pm 3\sigma$; the lower endpoint is $40 - 3 \cdot 6 = 22$.'
        constraints: "mean and SD are whole numbers; endpoints come out to integers"
      - id: kp3
        name: "Percent outside an interval"
        key_prerequisites: [z-scores, percentages]
        exemplars:
          - problem: 'For a normal distribution, what proportion of values lie more than $2$ standard deviations from the mean? Give a decimal.'
            answer: "0.05"
            solution_sketch: '$1 - 0.95 = 0.05$, split between the two tails.'
          - problem: 'Heights are normal with mean $170$ and SD $6$. What proportion of heights lie outside $(158, 182)$? Give a decimal.'
            answer: "0.05"
            solution_sketch: '$158$ and $182$ are $\mu \pm 2\sigma$; the area outside is $1 - 0.95 = 0.05$.'
          - problem: 'For a normal distribution, what proportion of values lie more than $1$ standard deviation from the mean? Give a decimal.'
            answer: "0.32"
            solution_sketch: '$1 - 0.68 = 0.32$.'
          - problem: 'For a normal distribution, what proportion of values lie more than $3$ standard deviations from the mean? Give a decimal.'
            answer: "0.003"
            solution_sketch: '$1 - 0.997 = 0.003$.'
          - problem: "For a normal distribution, a symmetric interval about the mean leaves proportion 0.05 of the values outside it. How many standard deviations from the mean does this interval extend?"
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Complement rule: the area inside the interval is 1 - 0.05 = 0.95. Empirical rule: the interval that holds 0.95 of the values extends 2 standard deviations from the mean. The interval extends 2 standard deviations from the mean, so the answer is 2."
          - problem: "Battery lifetimes are normal with mean 250 hours and standard deviation 4 hours. A symmetric interval about the mean leaves proportion 0.003 of lifetimes outside it. Give this interval as (low, high)."
            answer: "(238, 262)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "Complement rule: the area inside is 1 - 0.003 = 0.997, so the interval is the 99.7 percent interval of the empirical rule, which extends 3 standard deviations each way. Empirical rule applied to the mean and SD: 250 - 3*4 = 238 and 250 + 3*4 = 262. The interval is (238, 262)."
        constraints: "complements of the 68/95/99.7 intervals only; no tail-splitting yet; area answers are decimal proportions"
    diagnostic_exemplar:
      problem: 'Times are normal with mean $60$ and SD $5$. What proportion of times lie outside the interval $(50, 70)$? Give a decimal.'
      answer: '0.05'
      solution_sketch: '$(50, 70) = \mu \pm 2\sigma$ holds $95\%$; outside: $1 - 0.95 = 0.05$.'
    anki_seeds:
      - front: 'Empirical rule percentages for $\pm 1\sigma$, $\pm 2\sigma$, $\pm 3\sigma$?'
        back: 'About $68\%$, $95\%$, and $99.7\%$.'
        type: basic
      - front: 'Percent of a normal distribution more than $2\sigma$ from the mean?'
        back: 'About $5\%$ ($2.5\%$ in each tail).'
        type: basic

  - id: normal-distribution
    name: "Normal Distribution Reasoning"
    core: true
    difficulty: 0.5
    drill: false
    answer_kind: numeric
    expected_time_secs: 150
    prerequisites:
      - id: empirical-rule
        weight: 0.8
        key: true
      - id: z-scores
        weight: 0.4
        key: false
    knowledge_points:
      - id: kp1
        name: "One-sided areas from symmetry"
        key_prerequisites: [empirical-rule]
        exemplars:
          - problem: 'Marks (out of $10$) are normal with mean $6.5$ and SD $1$. What proportion of marks exceed $8.5$? Give a decimal.'
            answer: "0.025"
            solution_sketch: '$8.5 = \mu + 2\sigma$; the area outside $\pm 2\sigma$ is $0.05$, split evenly, so $0.025$ above.'
          - problem: 'Marks (out of $10$) are normal with mean $6.5$ and SD $1$. What proportion fall below $5.5$? Give a decimal.'
            answer: "0.16"
            solution_sketch: '$5.5 = \mu - 1\sigma$; the area outside $\pm 1\sigma$ is $0.32$, so $0.16$ in the lower tail.'
        constraints: "cut points at whole-sigma marks; use symmetry to halve tail areas; area answers are decimal proportions"
      - id: kp2
        name: "Combining regions and percentiles"
        key_prerequisites: [empirical-rule]
        exemplars:
          - problem: 'For a normal distribution, what proportion of values lie between $\mu - 2\sigma$ and $\mu + \sigma$? Give a decimal.'
            answer: "0.815"
            solution_sketch: 'Half of $0.95$ below the mean plus half of $0.68$ above it: $0.475 + 0.34 = 0.815$.'
          - problem: 'Approximately what percentile is a value at $\mu + \sigma$? Give the percentile number.'
            answer: "84"
            solution_sketch: '$50\%$ below the mean plus $34\%$ between $\mu$ and $\mu + \sigma$ gives $84\%$ below.'
        constraints: "asymmetric intervals with whole-sigma endpoints; answers from 68/95/99.7 arithmetic only, as a decimal proportion or a percentile number"
      - id: kp3
        name: "Comparing values across distributions"
        key_prerequisites: [z-scores, empirical-rule]
        exemplars:
          - problem: 'Test A (out of $10$) is normal with mean $7$, SD $0.5$; test B with mean $6$, SD $1$. Which is relatively better: $8$ on A or $7.5$ on B? Give the z-score of the better one.'
            answer: "2"
            solution_sketch: '$z_A = \frac{8-7}{0.5} = 2$, $z_B = \frac{7.5-6}{1} = 1.5$; the higher $z$ is more exceptional.'
          - problem: 'A value sits at $\mu + 2\sigma$ in a normal distribution. Approximately what percentile is it? Give the percentile number.'
            answer: "97.5"
            solution_sketch: '$50\% + 47.5\% = 97.5\%$ of values lie below $\mu + 2\sigma$.'
          - problem: "Distribution A has mean 20 and standard deviation 4. Distribution B has mean 50 and standard deviation 8. The value 28 comes from A and the value 74 comes from B. Which value is more exceptional relative to its own distribution? Give the z-score of the more exceptional value."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: Convert the first value with the z-score rule: z = (28 - 20)/4 = 2. Step 2: Convert the second value: z = (74 - 50)/8 = 3. Step 3: Compare absolute z-scores; 3 is larger, so the value from B is more exceptional. The answer is 3."
          - problem: "A value of 84 belongs to a normal distribution with mean 75 and standard deviation 6. A value of 60 belongs to a normal distribution with mean 50 and standard deviation 5. Which value has the larger absolute z-score? Give that absolute z-score."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: Use the z-score rule for the first value: z = (84 - 75)/6 = 1.5. Step 2: Use the z-score rule for the second value: z = (60 - 50)/5 = 2. Step 3: The absolute z-scores are 1.5 and 2; the larger is 2. The answer is 2."
          - problem: "In distribution A the mean is 40 and the standard deviation is 8. A value of 52 in A has z-score 1.5. In distribution B the mean is 70 and the standard deviation is 6. What value in B has the same z-score as 52 in A? Give the value."
            answer: "79"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: Check the z-score of 52 in A: z = (52 - 40)/8 = 1.5. Step 2: Use the same z-score in B: value = mean + z * SD = 70 + 1.5 * 6. Step 3: Compute 70 + 9 = 79. The answer is 79."
          - problem: "A value has z-score 2 in distribution A. Another value has z-score 3 in distribution B. Using the empirical rule, find the percentile of the value with the higher z-score. Give the answer to 2 decimals."
            answer: "99.85"
            answer_contract: {"decimals": 2, "kind": "approx"}
            solution_sketch: "Step 1: Apply the empirical rule: z = 2 gives about 97.5% below. Step 2: Apply the empirical rule: z = 3 gives about 99.85% below. Step 3: The value with z = 3 has the higher percentile. The answer is 99.85."
        constraints: "z-scores are halves or whole numbers; comparisons decided by the larger |z|"
    diagnostic_exemplar:
      problem: 'Marks (out of $10$) are normal with mean $6.5$ and SD $1$. What proportion of marks fall between $4.5$ and $7.5$? Give a decimal.'
      answer: '0.815'
      solution_sketch: '$\mu - 2\sigma$ to $\mu + \sigma$: $0.95/2 + 0.68/2 = 0.475 + 0.34 = 0.815$.'
    anki_seeds:
      - front: 'What fraction of a normal distribution lies above $\mu + 2\sigma$?'
        back: 'About $2.5\%$.'
        type: basic
      - front: 'A value at $\mu + \sigma$ sits at approximately which percentile?'
        back: 'The 84th ($50\% + 34\%$ below it).'
        type: basic

  - id: standard-error
    name: "Standard Error of the Sample Mean"
    core: true
    difficulty: 0.5
    drill: false
    answer_kind: numeric
    expected_time_secs: 120
    prerequisites:
      - id: variance-standard-deviation
        weight: 0.7
        key: true
      - id: square-roots
        weight: 0.4
        key: false
    knowledge_points:
      - id: kp1
        name: "Computing SE = sigma over root n"
        key_prerequisites: [variance-standard-deviation, square-roots]
        exemplars:
          - problem: 'A population has $\sigma = 12$. For samples of size $n = 9$, find the standard error of the sample mean.'
            answer: "4"
            solution_sketch: '$\operatorname{SE} = \sigma/\sqrt{n} = 12/3 = 4$.'
          - problem: 'A population has $\mu = 40$, $\sigma = 10$. For $n = 25$, give (mean of $\bar{x}$, SE of $\bar{x}$) as an ordered pair.'
            answer: '$(40, 2)$'
            solution_sketch: '$E[\bar{x}] = \mu = 40$; $\operatorname{SE} = 10/\sqrt{25} = 2$.'
          - problem: 'A population has $\sigma = 15$. For samples of size $n = 25$, find the standard error of the sample mean.'
            answer: "3"
            solution_sketch: '$\operatorname{SE} = 15/\sqrt{25} = 15/5 = 3$.'
          - problem: 'A population has $\sigma = 14$. For samples of size $n = 49$, find the standard error of the sample mean.'
            answer: "2"
            solution_sketch: '$\operatorname{SE} = 14/\sqrt{49} = 14/7 = 2$.'
          - problem: 'A population has $\mu = 60$ and $\sigma = 8$. For $n = 16$, find the standard error of the sample mean as a single number.'
            answer: "2"
            solution_sketch: '$\operatorname{SE} = 8/\sqrt{16} = 8/4 = 2$ (the mean of $\bar{x}$ is $\mu = 60$).'
        constraints: "n a perfect square (4, 9, 16, 25, 36, 100); sigma divisible by sqrt(n)"
      - id: kp2
        name: "Averages vary less than individuals"
        key_prerequisites: [variance-standard-deviation]
        exemplars:
          - problem: 'A population has $\sigma = 18$. Give (SD of a single observation, SE of the mean of $36$ observations) as an ordered pair.'
            answer: '$(18, 3)$'
            solution_sketch: '$18/\sqrt{36} = 3$ — averages cluster far more tightly than single values.'
          - problem: 'One die roll has SD $\sigma$. By what factor is the SD of the average of $100$ rolls smaller?'
            answer: "10"
            solution_sketch: 'Averaging $n$ values shrinks the spread by $\sqrt{n}$: $\sqrt{100} = 10$, so a single roll varies far more.'
          - problem: 'A population has $\sigma = 20$. Find the standard error of the mean of $100$ observations.'
            answer: "2"
            solution_sketch: '$\operatorname{SE} = 20/\sqrt{100} = 20/10 = 2$ — far tighter than the SD $20$ of single values.'
          - problem: 'A single observation of a population has SD $24$. By what factor is the SD of the mean of $36$ observations smaller?'
            answer: "6"
            solution_sketch: 'Averaging $n$ values shrinks the spread by $\sqrt{n} = \sqrt{36} = 6$.'
          - problem: 'A population has $\sigma = 9$. Find the standard error of the mean of $81$ observations.'
            answer: "1"
            solution_sketch: '$\operatorname{SE} = 9/\sqrt{81} = 9/9 = 1$.'
          - problem: "A machine produces parts with a standard deviation of $30$ grams. For a sample of $25$ parts, find the standard error of the sample mean in grams."
            answer: "6"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: Use the standard error formula $\\operatorname{SE} = \\sigma/\\sqrt{n}$. Step 2: Substitute the values, so $\\operatorname{SE} = 30/\\sqrt{25}$. Step 3: Since $\\sqrt{25} = 5$, this gives $30/5 = 6$. The standard error is 6."
        constraints: "one computation and one shrink-factor item; n a perfect square"
      - id: kp3
        name: "How sample size changes the SE"
        key_prerequisites: [variance-standard-deviation, square-roots]
        exemplars:
          - problem: 'The standard error of $\bar{x}$ at sample size $n$ is $6$. What is it at sample size $4n$?'
            answer: "3"
            solution_sketch: '$\operatorname{SE} \propto 1/\sqrt{n}$; quadrupling $n$ halves the SE.'
          - problem: 'A population has $\sigma = 20$. What sample size makes the standard error equal to $5$?'
            answer: "16"
            solution_sketch: '$20/\sqrt{n} = 5$ gives $\sqrt{n} = 4$, so $n = 16$.'
          - problem: 'A population has $\sigma = 12$. What sample size makes the standard error of the sample mean equal to $2$?'
            answer: "36"
            solution_sketch: '$12/\sqrt{n} = 2$ gives $\sqrt{n} = 6$, so $n = 36$.'
          - problem: 'The standard error of $\bar{x}$ at sample size $n$ is $2$. By what factor must the sample size be multiplied to make the standard error equal to $1$?'
            answer: "4"
            solution_sketch: 'Halving the SE requires $\sqrt{n}$ to double, so $n$ is multiplied by $2^2 = 4$.'
          - problem: "The standard error of the sample mean at sample size n is 8. What is the standard error at sample size 16n?"
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Use the rule SE = sigma/sqrt(n). The full object at sample size n is SE = sigma/sqrt(n). At sample size 16n it is sigma/sqrt(16n) = sigma/(4 sqrt(n)) = SE/4. With SE = 8, the new standard error is 8/4 = 2."
          - problem: "For a population with standard deviation 45, what sample size gives a standard error of 5?"
            answer: "81"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Use the standard error formula SE = sigma/sqrt(n). The full object is SE = 45/sqrt(n). Set this equal to 5: 45/sqrt(n) = 5. Then sqrt(n) = 45/5 = 9, so n = 81."
        constraints: "n and target SE chosen so sqrt(n) is a whole number"
    diagnostic_exemplar:
      problem: 'A population has $\sigma = 18$. What sample size makes the standard error of the sample mean equal to $3$?'
      answer: '36'
      solution_sketch: '$18/\sqrt{n} = 3$ gives $\sqrt{n} = 6$, so $n = 36$.'
    anki_seeds:
      - front: 'Standard error of the sample mean?'
        back: '$\operatorname{SE} = \dfrac{\sigma}{\sqrt{n}}$.'
        type: basic
      - front: 'To cut the standard error in half, multiply the sample size by {{c1::4}}.'
        back: '4'
        type: cloze

  - id: sampling-distributions
    name: "Sampling Distributions & the CLT"
    core: true
    difficulty: 0.55
    drill: false
    answer_kind: multi-step
    expected_time_secs: 180
    prerequisites:
      - id: standard-error
        weight: 0.7
        key: true
      - id: normal-distribution
        weight: 0.7
        key: true
    knowledge_points:
      - id: kp1
        name: "The Central Limit Theorem"
        key_prerequisites: [normal-distribution]
        exemplars:
          - problem: 'A population is skewed. What does the CLT say about the shape of the distribution of $\bar{x}$ for large $n$?'
            answer: 'It is approximately normal.'
          - problem: 'When can the distribution of $\bar{x}$ be treated as normal?'
            answer: 'When the population itself is normal, or when $n$ is large (roughly $n \ge 30$).'
        constraints: "conceptual items; answers name the shape and the conditions"
      - id: kp2
        name: "Probabilities for the sample mean"
        key_prerequisites: [normal-distribution, standard-error]
        exemplars:
          - problem: 'A population has $\mu = 50$, $\sigma = 8$. For $n = 16$, find $P(48 \le \bar{x} \le 52)$ using the empirical rule.'
            answer: "68%"
            solution_sketch: '$\operatorname{SE} = 8/4 = 2$, so $48$ to $52$ is $\mu \pm 1$ SE: about $68\%$.'
          - problem: 'Same population, $n = 16$. Find $P(\bar{x} > 54)$.'
            answer: "2.5%"
            solution_sketch: '$54 = \mu + 2 \cdot \operatorname{SE}$; the area above $+2$ SE is about $2.5\%$.'
        constraints: "cut points at whole multiples of the SE; empirical-rule answers only"
      - id: kp3
        name: "Is a sample mean surprising?"
        key_prerequisites: [normal-distribution, standard-error]
        exemplars:
          - problem: 'A population has $\mu = 50$, $\sigma = 8$; $n = 16$, so $\operatorname{SE} = 2$. A sample gives $\bar{x} = 57$. Is this surprising?'
            answer: 'Yes; $\bar{x}$ is $3.5$ SEs above $\mu$, beyond the $99.7\%$ range.'
            solution_sketch: '$(57 - 50)/2 = 3.5$; values beyond $3$ SEs occur less than $0.3\%$ of the time.'
          - problem: 'Same setup, but $\bar{x} = 51$. Surprising?'
            answer: 'No; $0.5$ SE above the mean is entirely ordinary.'
        constraints: "judgments quoted in SEs from the mean; thresholds at 2 and 3 SEs"
    diagnostic_exemplar:
      problem: 'A population has $\mu = 80$, $\sigma = 12$. A sample of $n = 9$ gives $\bar{x} = 89$. Compute the SE, state how many SEs above $\mu$ this is, and say whether the result is surprising.'
      answer: '$\operatorname{SE} = 4$; $\bar{x}$ is $2.25$ SEs above $\mu$ — surprising: beyond $2$ SEs, outside the middle $95\%$.'
      solution_sketch: '$\operatorname{SE} = 12/\sqrt{9} = 4$; $(89 - 80)/4 = 2.25 > 2$.'
    anki_seeds:
      - front: 'Central Limit Theorem (informal)?'
        back: 'For large $n$, the sampling distribution of $\bar{x}$ is approximately normal, whatever the population''s shape.'
        type: basic
      - front: 'A sample mean more than $2$ SEs from $\mu$ happens about how often?'
        back: 'About $5\%$ of the time — conventionally "surprising".'
        type: basic

  - id: sample-proportions
    name: "Sampling Distribution of a Proportion"
    core: false                # feeds only the supplemental one-proportion-z-test (re-audit R-24); no core material builds on it
    difficulty: 0.55
    drill: false
    answer_kind: numeric
    expected_time_secs: 150
    prerequisites:
      - id: sampling-distributions
        weight: 0.7
        key: true
      - id: binomial-distribution
        weight: 0.4
        key: false
    knowledge_points:
      - id: kp1
        name: "The sample proportion and its mean"
        key_prerequisites: [sampling-distributions]
        exemplars:
          - problem: 'In a poll of $90$ voters, $54$ support a measure. Compute the sample proportion $\hat{p}$.'
            answer: "3/5"
            solution_sketch: '$\hat{p} = 54/90 = 3/5$.'
          - problem: 'If the true support level is $p = 3/5$, what is the mean of the sampling distribution of $\hat{p}$?'
            answer: "3/5"
            solution_sketch: '$E[\hat{p}] = p$ — the sample proportion is unbiased.'
          - problem: "In a survey of 80 customers, 20 prefer a new design. Compute the sample proportion p-hat as a fraction."
            answer: "1/4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The sample proportion is p-hat = successes / n. Rule: divide the number of successes by the sample size. With 20 successes in 80 customers, p-hat = 20/80 = 1/4."
          - problem: "The true proportion of left-handed people in a population is p = 2/5. Find the mean of the sampling distribution of the sample proportion as a fraction."
            answer: "2/5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The mean of the sampling distribution is E[p-hat] = p. Rule: the sample proportion is unbiased, so its mean equals the population proportion. Since p = 2/5, the mean is 2/5."
          - problem: "A sample has 120 observations and sample proportion p-hat = 5/6. How many successes were observed in the sample?"
            answer: "100"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The number of successes is n times p-hat. Rule: p-hat = successes / n, so successes = n p-hat. With n = 120 and p-hat = 5/6, successes = 120 * 5/6 = 100."
          - problem: "In a sample of 200 registered voters, the sample proportion supporting a proposal is 3/20. How many supporters are in the sample?"
            answer: "30"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The number of supporters is n times p-hat. Rule: p-hat = supporters / n, so supporters = n p-hat. With n = 200 and p-hat = 3/20, supporters = 200 * 3/20 = 30."
        constraints: "counts divide evenly; p a simple fraction"
      - id: kp2
        name: "Standard error of p-hat"
        key_prerequisites: [sampling-distributions]
        exemplars:
          - problem: 'With $p = 1/2$ and $n = 25$, find the standard error of $\hat{p}$.'
            answer: "1/10"
            solution_sketch: '$\operatorname{SE} = \sqrt{\frac{p(1-p)}{n}} = \sqrt{\frac{1/4}{25}} = \sqrt{\frac{1}{100}} = \frac{1}{10}$.'
          - problem: 'With $p = 1/5$ and $n = 100$, find the standard error of $\hat{p}$.'
            answer: "1/25"
            solution_sketch: '$\sqrt{\frac{(1/5)(4/5)}{100}} = \sqrt{\frac{4/25}{100}} = \frac{2/5}{10} = \frac{1}{25}$.'
        constraints: "p(1-p)/n is a perfect square of a fraction; answers exact fractions"
      - id: kp3
        name: "Empirical rule for p-hat"
        key_prerequisites: [sampling-distributions]
        exemplars:
          - problem: 'With $p = 1/2$ and $n = 100$, $\operatorname{SE} = 1/20$. Find $P(0.45 \le \hat{p} \le 0.55)$ as a decimal.'
            answer: "0.68"
            solution_sketch: 'That interval is $p \pm 1$ SE, so about $0.68$.'
          - problem: 'With $p = 1/2$ and $n = 25$, $\operatorname{SE} = 1/10$: how many SEs above $p$ is $\hat{p} = 0.8$?'
            answer: "3"
            solution_sketch: '$(0.8 - 0.5)/0.1 = 3$ — beyond the $99.7\%$ range, so $\hat{p} = 0.8$ would be surprising.'
        constraints: "cut points at whole multiples of the SE; answers are decimal proportions or a count of SEs"
    diagnostic_exemplar:
      problem: 'With $p = 1/2$ and $n = 100$, use the empirical rule to find $P(0.40 \le \hat{p} \le 0.60)$ as a decimal.'
      answer: '0.95'
      solution_sketch: '$\operatorname{SE} = \sqrt{(1/4)/100} = 1/20$; $0.40$-$0.60$ is $p \pm 2$ SEs: $0.95$.'
    anki_seeds:
      - front: 'Standard error of a sample proportion?'
        back: '$\operatorname{SE}(\hat{p}) = \sqrt{\dfrac{p(1-p)}{n}}$.'
        type: basic
      - front: 'Mean of the sampling distribution of $\hat{p}$?'
        back: '$p$ — the sample proportion is an unbiased estimator.'
        type: basic

  - id: margin-of-error
    name: "Margin of Error"
    core: false                # terminal inference destination
    difficulty: 0.5
    drill: false
    answer_kind: numeric
    expected_time_secs: 120
    prerequisites:
      - id: standard-error
        weight: 0.7
        key: true
      - id: empirical-rule
        weight: 0.4
        key: false
    knowledge_points:
      - id: kp1
        name: "Estimate plus-or-minus ME as an interval"
        key_prerequisites: [standard-error]
        exemplars:
          - problem: 'An interval is reported as $\bar{x} \pm \text{ME}$ with $\bar{x} = 62$ and ME $= 5$. State the interval.'
            answer: '$(57, 67)$'
          - problem: 'A poll reports $46\%$ support with a margin of error of $3$ percentage points. State the interval as an ordered pair of percentage-point values.'
            answer: '$(43, 49)$'
          - problem: "A health survey reports a mean wait of 34 minutes, with a margin of error of 6 minutes. State the interval for the mean wait as (low, high)."
            answer: "(28, 40)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "The rule is that the interval runs from the estimate minus the margin of error to the estimate plus the margin of error. The estimate is 34 and the margin of error is 6. Lower endpoint: 34 - 6 = 28. Upper endpoint: 34 + 6 = 40. The interval is (28, 40)."
          - problem: "A sample mean is 250, and the reported interval is (238, 262). Find the margin of error."
            answer: "12"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The rule is that the margin of error is half the width of the interval. The interval width is 262 - 238 = 24. Half of 24 is 12. The margin of error is 12."
          - problem: "A quality check gives an interval of (96, 112) for the mean fill. The margin of error is 8. Find the sample mean."
            answer: "104"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The rule is that the sample mean is the center of the interval. The center is (96 + 112) / 2 = 104. The sample mean is 104."
          - problem: "An estimate is 210 and the margin of error is 15. Find the width of the interval."
            answer: "30"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The rule is that the interval width is twice the margin of error. The margin of error is 15, so twice it is 30. The width of the interval is 30."
        constraints: "integer estimates and MEs; interval endpoints computed exactly"
      - id: kp2
        name: "ME = 2 SE for 95% confidence"
        key_prerequisites: [standard-error, empirical-rule]
        exemplars:
          - problem: 'A population has $\sigma = 10$; a sample of $n = 25$ is taken. Using $z^* = 2$, find the margin of error for estimating $\mu$.'
            answer: "4"
            solution_sketch: '$\operatorname{SE} = 10/5 = 2$; $\text{ME} = 2 \cdot 2 = 4$.'
          - problem: 'A population has $\sigma = 12$; $n = 16$. Using $z^* = 2$, find the margin of error.'
            answer: "6"
            solution_sketch: '$\operatorname{SE} = 12/4 = 3$; $\text{ME} = 2 \cdot 3 = 6$.'
          - problem: "A clinic measures a biomarker. The population standard deviation is 10 units. A sample of 16 patients is taken. Using z* = 2, find the margin of error for estimating the population mean."
            answer: "5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Standard error rule: SE = sigma/sqrt(n) = 10/sqrt(16) = 2.5. Margin of error rule: ME = 2*SE = 2*2.5 = 5. The margin of error is 5."
          - problem: "A factory ships bolts. The population standard deviation of lengths is 20 mm. A sample of 25 bolts is taken. Using z* = 2, find the margin of error for estimating the mean length."
            answer: "8"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Standard error rule: SE = 20/sqrt(25) = 20/5 = 4. Margin of error rule: ME = 2*SE = 2*4 = 8. The margin of error is 8."
          - problem: "A study uses a sample of size 4 and z* = 2. The margin of error is 3. Find the population standard deviation."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Margin of error rule: ME = 2*sigma/sqrt(n). Substitute the known values: 3 = 2*sigma/sqrt(4) = 2*sigma/2 = sigma. The population standard deviation is 3."
          - problem: "A population has standard deviation 15. A sample of size 9 is taken. Using z* = 2, find the margin of error."
            answer: "10"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Standard error rule: SE = 15/sqrt(9) = 15/3 = 5. Margin of error rule: ME = 2*SE = 2*5 = 10. The margin of error is 10."
        constraints: "use z* = 2 (empirical-rule value); n a perfect square; ME an integer"
      - id: kp3
        name: "What the ME does and does not cover"
        key_prerequisites: [standard-error]
        exemplars:
          - problem: 'A poll of $n = 400$ reports a margin of error of $3$ percentage points, but the sample was voluntary-response. By how many percentage points does the reported ME correct for that bias?'
            answer: "0"
            solution_sketch: 'The ME covers sampling variability only; a biased sample stays biased no matter how large $n$ is.'
          - problem: 'A margin of error is $6$ at sample size $n$. What is it at sample size $9n$ (same $\sigma$ and $z^*$)?'
            answer: "2"
            solution_sketch: 'ME $\propto 1/\sqrt{n}$; multiplying $n$ by $9$ divides the ME by $3$.'
          - problem: "A poll at sample size 300 has a margin of error of 8 points. The same population and the same confidence level are used at sample size 1200. Find the new margin of error in points."
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The margin of error scales as 1/sqrt(n). Step 1: the sample size is multiplied by 4. Step 2: sqrt(4) = 2, so the margin is divided by 2. The new margin of error is 8/2 = 4."
          - problem: "A population has standard deviation 20. Use z* = 2. A sample of size 64 is drawn from this population. Find the margin of error. Give the answer to 2 decimals."
            answer: "5.00"
            answer_contract: {"decimals": 2, "kind": "approx"}
            solution_sketch: "Standard error = 20/sqrt(64) = 20/8 = 2.5. Margin of error = z* times the standard error = 2 * 2.5 = 5. The margin of error is 5.00."
          - problem: "A website invites readers to rate a service, and 5000 readers respond on their own. The reported margin of error is 1.5 points. How many points of that margin correct for the self-selection bias?"
            answer: "0"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The margin of error covers only random sampling variability. Self-selection is a bias, and a larger sample does not remove it. The margin of error corrects for that bias by 0 points."
          - problem: "A researcher wants to shrink a margin of error to one third of its current size, keeping the same population and the same confidence level. Find the factor by which the sample size must be multiplied."
            answer: "9"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The margin of error is proportional to 1/sqrt(n). To divide the margin by 3, sqrt(n) must grow by a factor of 3. So sqrt(k) = 3 and k = 9. The sample size must be multiplied by 9."
        constraints: "quantitative items: the ME's zero correction for bias, and its 1/sqrt(n) scaling"
    diagnostic_exemplar:
      problem: 'A population has $\sigma = 10$; use $z^* = 2$. Give (the margin of error at $n = 25$, the margin of error at $n = 100$) as an ordered pair.'
      answer: '$(4, 2)$'
      solution_sketch: '$2 \cdot 10/5 = 4$; quadrupling $n$ halves the ME: $2 \cdot 10/10 = 2$.'
    anki_seeds:
      - front: 'Margin of error (for a mean, known $\sigma$)?'
        back: '$\text{ME} = z^* \cdot \dfrac{\sigma}{\sqrt{n}}$.'
        type: basic
      - front: 'The margin of error accounts for sampling variability but not...'
        back: 'Bias in how the sample was collected.'
        type: basic

  - id: confidence-intervals
    name: "Confidence Interval Basics"
    core: false                # terminal inference destination
    difficulty: 0.6
    drill: false
    answer_kind: numeric
    expected_time_secs: 240
    prerequisites:
      - id: margin-of-error
        weight: 0.7
        key: true
      - id: sampling-distributions
        weight: 0.6
        key: true
      - id: z-scores
        weight: 0.3
        key: false
    knowledge_points:
      - id: kp1
        name: "Building a 95% interval"
        key_prerequisites: [margin-of-error, sampling-distributions]
        exemplars:
          - problem: 'A sample of $n = 25$ has $\bar{x} = 50$; the population has $\sigma = 10$. Using $z^* = 2$, give the 95% confidence interval for $\mu$.'
            answer: '$(46, 54)$'
            solution_sketch: '$\operatorname{SE} = 10/5 = 2$; margin $= 2 \cdot 2 = 4$; interval $50 \pm 4$.'
          - problem: 'A sample of $n = 16$ has $\bar{x} = 80$; $\sigma = 12$. Using $z^* = 2$, give the 95% confidence interval.'
            answer: '$(74, 86)$'
            solution_sketch: '$\operatorname{SE} = 12/4 = 3$; margin $= 6$; interval $80 \pm 6$.'
          - problem: "A sample of n = 49 has xbar = 200; sigma = 21. Use z* = 2. Give the 95% confidence interval for mu as (low, high)."
            answer: "(194, 206)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "The full result is the 95% confidence interval for mu. Standard error formula: sigma/sqrt(n) = 21/sqrt(49) = 21/7 = 3. Margin of error formula: z* times SE = 2 * 3 = 6. Confidence interval formula: 200 plus or minus 6, which is (194, 206). The 95% confidence interval is (194, 206)."
          - problem: "A machine fills boxes. A sample of n = 100 boxes has mean mass 75 g; sigma = 20 g. Use z* = 2. Give the 95% confidence interval for the mean mass in grams as (low, high)."
            answer: "(71, 79)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "The full result is the 95% confidence interval for the mean mass. Standard error formula: sigma/sqrt(n) = 20/sqrt(100) = 20/10 = 2. Margin of error formula: z* times SE = 2 * 2 = 4. Confidence interval formula: 75 plus or minus 4, which is (71, 79). The 95% confidence interval is (71, 79)."
          - problem: "A 95% confidence interval from a sample of n = 36, built with z* = 2, is (158, 170). Find the population standard deviation sigma."
            answer: "18"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full result is the population standard deviation sigma. Margin of error formula: half of (170 - 158) = 6. Standard error formula: margin / z* = 6 / 2 = 3. Since n = 36, sqrt(n) = 6, so sigma = 3 * 6 = 18. The population standard deviation is 18."
          - problem: "A sample of n = 81 has xbar = 42; sigma = 27. Use z* = 2. Find the width of the 95% confidence interval for mu."
            answer: "12"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full result is the width of the 95% confidence interval. Standard error formula: sigma/sqrt(n) = 27/sqrt(81) = 27/9 = 3. Margin of error formula: z* times SE = 2 * 3 = 6. Confidence interval formula: 42 plus or minus 6, which is (36, 48). The width is 12."
        constraints: "use z* = 2 for 95% (empirical-rule value); n a perfect square; endpoints integers"
      - id: kp2
        name: "Interpreting the confidence level"
        key_prerequisites: [sampling-distributions]
        exemplars:
          - problem: 'Which is the correct reading of a 95% confidence interval $(46, 54)$ for $\mu$: (a) $95\%$ of the data lie in $(46, 54)$; (b) the method captures $\mu$ in about $95\%$ of samples?'
            answer: '(b)'
            solution_sketch: 'The confidence level describes the long-run capture rate of the method, not where individual data values fall.'
          - problem: 'A 95% confidence interval for $\mu$ is $(12, 18)$. Which changes from sample to sample: (a) $\mu$; (b) the interval?'
            answer: '(b)'
            solution_sketch: '$\mu$ is a fixed parameter; different samples produce different intervals.'
        constraints: "interpretation items; distractors misread the level as a data proportion or treat mu as random"
      - id: kp3
        name: "Choosing the sample size"
        key_prerequisites: [margin-of-error, sampling-distributions]
        exemplars:
          - problem: 'With $\sigma = 12$ and $z^* = 2$, what sample size gives a margin of error of $4$?'
            answer: "36"
            solution_sketch: '$n = \left(\frac{z^* \sigma}{\text{ME}}\right)^2 = \left(\frac{2 \cdot 12}{4}\right)^2 = 6^2 = 36$.'
          - problem: 'To cut a margin of error from $8$ to $4$ (same $\sigma$ and $z^*$), multiply the sample size by what factor?'
            answer: "4"
            solution_sketch: 'ME $\propto 1/\sqrt{n}$; halving the ME requires $4$ times the sample size.'
          - problem: "A health survey plans a 95% confidence interval for a mean. The population standard deviation is 18 and z* = 2. The target margin of error is 4. Find the required sample size."
            answer: "81"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Use the sample-size formula n = (z* sigma / ME)^2. Substitute z* = 2, sigma = 18, and ME = 4 to get n = (2 * 18 / 4)^2. The inner quotient is 9, so n = 9^2 = 81. The required sample size is 81."
          - problem: "A factory measures bolt lengths and plans a 95% confidence interval for the mean. The population standard deviation is 20 and z* = 2. The team wants a margin of error of 5. Find the sample size needed."
            answer: "64"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Use the sample-size formula n = (z* sigma / ME)^2. Insert z* = 2, sigma = 20, and ME = 5, giving n = (2 * 20 / 5)^2. The quotient is 8, so n = 8^2 = 64. The sample size needed is 64."
          - problem: "A study wants a 95% confidence interval for a mean with total width 10. Past data give a population standard deviation of 25, and z* = 2. Find the sample size needed."
            answer: "100"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Use the sample-size formula n = (z* sigma / ME)^2 after finding the margin of error. The total interval width is 10, so the margin is 10/2 = 5. With z* = 2 and sigma = 25, n = (2 * 25 / 5)^2 = 10^2 = 100. The sample size needed is 100."
          - problem: "A polling organization plans a 95% confidence interval for the mean voter age. The population standard deviation is 18 and z* = 2. The allowed margin of error is 3. Find the required sample size."
            answer: "144"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Use the sample-size formula n = (z* sigma / ME)^2. Put z* = 2, sigma = 18, and ME = 3 to obtain n = (2 * 18 / 3)^2. The quotient is 12, so n = 12^2 = 144. The required sample size is 144."
        constraints: "z* sigma / ME a whole number so n is a perfect square"
    diagnostic_exemplar:
      problem: 'With $\sigma = 15$ and $z^* = 2$, what sample size is needed for a 95% confidence interval with margin of error $3$?'
      answer: '100'
      solution_sketch: '$2 \cdot 15/\sqrt{n} = 3$ gives $\sqrt{n} = 10$, so $n = 100$.'
    anki_seeds:
      - front: 'Confidence interval for $\mu$ (known $\sigma$)?'
        back: '$\bar{x} \pm z^* \dfrac{\sigma}{\sqrt{n}}$.'
        type: basic
      - front: 'Exact $z^*$ for a 95% confidence interval?'
        back: '$1.96$ (the empirical rule rounds it to $2$).'
        type: basic
      - front: '"95% confident" refers to the {{c1::method''s long-run capture rate}}, not to any one interval.'
        back: 'method''s long-run capture rate'
        type: cloze

  - id: scatterplots-correlation
    name: "Scatterplots & Correlation"
    core: false                # terminal regression branch
    difficulty: 0.4
    drill: false
    answer_kind: numeric
    expected_time_secs: 120
    prerequisites:
      - id: plotting-points
        weight: 0.6
        key: true
      - id: mean-median-mode
        weight: 0.3
        key: false
    knowledge_points:
      - id: kp1
        name: "Describing scatterplots"
        key_prerequisites: [plotting-points]
        exemplars:
          - problem: 'In a scatterplot, $y$ decreases roughly linearly as $x$ increases. Describe the direction and form of the relationship.'
            answer: 'Negative direction, linear form.'
            answer_contract: {kind: none}
            solution_sketch: 'The direction is negative (one variable falls as the other rises) and the form is linear.'
          - problem: 'Two scatterplots show the same downward trend; in one the points hug a line, in the other they form a loose cloud. Which shows the stronger relationship?'
            answer: 'the one hugging a line'
            answer_contract: {kind: label, options: [[the one hugging a line], [the loose cloud]]}
          - problem: 'In a scatterplot, $y$ increases roughly along a straight line as $x$ increases. What is the direction of the relationship?'
            answer: 'positive'
            answer_contract: {kind: label, options: [[positive], [negative]]}
            solution_sketch: 'Both variables rise together, so the direction is positive.'
          - problem: 'Points in a scatterplot trace a curved U-shape. What is the form of the relationship?'
            answer: 'curved'
            answer_contract: {kind: label, options: [[linear], [curved]]}
            solution_sketch: 'A U-shape is not well described by a straight line, so the form is curved.'
          - problem: 'Two scatterplots show the same upward trend; in one the points hug a line, in the other they form a loose cloud. Which shows the stronger relationship?'
            answer: 'the one hugging a line'
            answer_contract: {kind: label, options: [[the one hugging a line], [the loose cloud]]}
            solution_sketch: 'Tighter clustering around a line means a stronger relationship.'
          - problem: 'Hours of TV watched and test scores fall together roughly along a line that slopes down. What is the direction of the relationship?'
            answer: 'negative'
            answer_contract: {kind: label, options: [[positive], [negative]]}
            solution_sketch: 'One variable rises while the other falls, so the direction is negative.'
        constraints: "verbal descriptions covering direction, form, and strength"
      - id: kp2
        name: "Interpreting the correlation coefficient"
        key_prerequisites: [plotting-points]
        exemplars:
          - problem: 'Which indicates a stronger linear relationship: $r = 0.4$ or $r = -0.7$?'
            answer: 'r = -0.7'
            answer_contract: {kind: label, options: [[r = 0.4], [r = -0.7]]}
            solution_sketch: 'Sign gives direction, magnitude gives strength: $0.7 > 0.4$.'
          - problem: 'What are the possible values of the correlation coefficient $r$?'
            answer: '$-1 \le r \le 1$'
            answer_contract: {kind: none}
            solution_sketch: '$r$ always lies between $-1$ and $1$ inclusive.'
          - problem: 'Describe the relationship when $r = -0.9$.'
            answer: 'A strong negative linear relationship.'
            answer_contract: {kind: none}
            solution_sketch: '$|r| = 0.9$ is close to $1$ and the sign is negative: strong, negative, and linear.'
          - problem: 'Which indicates a stronger linear relationship: $r = 0.3$ or $r = -0.8$? Give $|r|$ of the stronger one.'
            answer: "0.8"
            solution_sketch: 'Strength is $|r|$: $0.8 > 0.3$, so $r = -0.8$ (negative direction) is stronger.'
          - problem: 'Which indicates a stronger linear relationship: $r = -0.9$ or $r = 0.5$? Give the $r$ value of the stronger one.'
            answer: "-0.9"
            solution_sketch: '$|-0.9| = 0.9 > 0.5$, so $r = -0.9$ is the stronger association.'
          - problem: 'Give the largest possible value of the correlation coefficient $r$ as a number.'
            answer: "1"
            solution_sketch: '$r$ always lies between $-1$ and $1$; the maximum $r = 1$ is a perfect positive line.'
          - problem: 'Two variables have $r = -0.6$. As $x$ increases, does $y$ tend to increase or decrease?'
            answer: 'decrease'
            answer_contract: {kind: label, options: [[increase], [decrease]]}
            solution_sketch: 'A negative $r$ means $y$ tends to fall as $x$ rises.'
        constraints: "r values given to one decimal; comparisons hinge on |r| vs sign"
      - id: kp3
        name: "Facts and cautions about r"
        key_prerequisites: [plotting-points]
        exemplars:
          - problem: 'Does swapping the roles of $x$ and $y$ change the value of $r$?'
            answer: 'No'
            answer_contract: {kind: label, options: [[Yes], [No]]}
            solution_sketch: '$r$ is symmetric in $x$ and $y$ (and has no units).'
          - problem: 'A scatterplot shows a perfect parabola opening upward. Must $|r|$ be close to $1$?'
            answer: 'No'
            answer_contract: {kind: label, options: [[Yes], [No]]}
            solution_sketch: '$r$ measures only linear association, and a symmetric curve can give $r$ near $0$.'
          - problem: 'Does swapping the roles of $x$ and $y$ change the value of $r$? Answer (a) yes or (b) no.'
            answer: '(b)'
            answer_contract: {kind: label, options: [[(a)], [(b)]]}
            solution_sketch: '$r$ is symmetric in $x$ and $y$ (and has no units).'
          - problem: 'A scatterplot shows a perfect symmetric parabola opening upward. Is $|r|$ close to $1$ or close to $0$?'
            answer: 'close to 0'
            answer_contract: {kind: label, options: [[close to 1], [close to 0]]}
            solution_sketch: '$r$ measures only linear association; the two symmetric halves of the parabola cancel.'
          - problem: 'Does the correlation coefficient $r$ carry units? Answer (a) yes or (b) no.'
            answer: '(b)'
            answer_contract: {kind: label, options: [[(a)], [(b)]]}
            solution_sketch: '$r$ is built from standardized quantities, so it is unitless.'
          - problem: 'If every $y$ value is doubled (and $x$ is unchanged), what happens to $r$?'
            answer: 'it is unchanged'
            answer_contract: {kind: label, options: [[it doubles], [it is unchanged], [its sign flips]]}
            solution_sketch: '$r$ is unchanged by positive rescaling of either variable — it is scale-invariant and unitless.'
        constraints: "conceptual items on unitlessness, symmetry, and linearity-only"
    diagnostic_exemplar:
      problem: 'A scatterplot of $y$ against $x$ shows points lying exactly on a symmetric parabola opening upward. Is $r$ close to $-1$, $0$, or $+1$ — and why?'
      answer: 'Close to $0$; $r$ measures only linear association, and the two symmetric halves cancel.'
      answer_contract: {kind: none}
      solution_sketch: 'Perfect curved association can still give $r \approx 0$ — $r$ is blind to nonlinear form.'
    anki_seeds:
      - front: 'In the correlation coefficient $r$, what do the sign and the magnitude tell you?'
        back: 'Sign: direction of the linear relationship; magnitude $|r|$: its strength.'
        type: basic
      - front: '$r$ always lies in the interval...'
        back: '$[-1, 1]$.'
        type: basic

  - id: least-squares-line
    name: "The Least-Squares Line"
    core: false                # terminal regression branch
    difficulty: 0.5
    drill: false
    answer_kind: numeric
    expected_time_secs: 180
    prerequisites:
      - id: scatterplots-correlation
        weight: 0.6
        key: true
      - id: slope-intercept-form
        weight: 0.6
        key: true
      - id: variance-standard-deviation
        weight: 0.4
        key: false
    knowledge_points:
      - id: kp1
        name: "Slope from summary statistics"
        key_prerequisites: [scatterplots-correlation, slope-intercept-form]
        exemplars:
          - problem: 'Given $r = 0.8$, $s_x = 2$, $s_y = 5$, find the least-squares slope $b = r \, s_y / s_x$.'
            answer: "2"
            solution_sketch: '$b = 0.8 \cdot \frac{5}{2} = 0.8 \cdot 2.5 = 2$.'
          - problem: 'Given $r = 0.5$, $s_x = 4$, $s_y = 8$, find the least-squares slope.'
            answer: "1"
            solution_sketch: '$b = 0.5 \cdot \frac{8}{4} = 1$.'
          - problem: 'Given $r = 0.6$, $s_x = 3$, $s_y = 10$, find the least-squares slope.'
            answer: "2"
            solution_sketch: '$b = 0.6 \cdot \frac{10}{3} = 2$.'
          - problem: 'Given $r = -0.4$, $s_x = 5$, $s_y = 10$, find the least-squares slope.'
            answer: "-0.8"
            solution_sketch: '$b = -0.4 \cdot \frac{10}{5} = -0.8$.'
        constraints: "r, s_x, s_y chosen so b is an integer or half-integer"
      - id: kp2
        name: "Intercept and the point (x-bar, y-bar)"
        key_prerequisites: [slope-intercept-form]
        exemplars:
          - problem: 'With slope $b = 2$, $\bar{x} = 4$, $\bar{y} = 10$, find the intercept $a$ and write the regression line; give $\hat{y}$ as an expression in $x$.'
            answer: '$2 + 2x$'
            solution_sketch: 'The line passes through $(\bar{x}, \bar{y})$: $a = \bar{y} - b\bar{x} = 10 - 8 = 2$.'
          - problem: 'With slope $b = 3$, $\bar{x} = 2$, $\bar{y} = 10$, find the intercept.'
            answer: "4"
            solution_sketch: '$a = 10 - 3 \cdot 2 = 4$.'
          - problem: 'With slope $b = 2$, $\bar{x} = 3$, $\bar{y} = 9$, find the intercept.'
            answer: "3"
            solution_sketch: '$a = \bar{y} - b\bar{x} = 9 - 2 \cdot 3 = 3$.'
          - problem: 'With slope $b = -1$, $\bar{x} = 5$, $\bar{y} = 7$, find the intercept.'
            answer: "12"
            solution_sketch: '$a = 7 - (-1) \cdot 5 = 12$.'
          - problem: 'With slope $b = 0.5$, $\bar{x} = 10$, $\bar{y} = 9$, find the intercept.'
            answer: "4"
            solution_sketch: '$a = 9 - 0.5 \cdot 10 = 4$.'
          - problem: "For a least-squares line, the sample means are xbar = 2 and ybar = 3. The slope is b = 4. Find the y-intercept a."
            answer: "-5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The line has slope b = 4 and passes through the point (xbar, ybar) = (2, 3). The intercept formula is a = ybar - b xbar. Substitute the values: a = 3 - 4*2 = 3 - 8 = -5. The y-intercept is -5."
        constraints: "means small integers; a comes out to an integer"
      - id: kp3
        name: "Assembling the full equation"
        key_prerequisites: [scatterplots-correlation, slope-intercept-form]
        exemplars:
          - problem: 'Given $\bar{x} = 4$, $\bar{y} = 11$, $s_x = 3$, $s_y = 6$, $r = 1/2$, find the least-squares line; give $\hat{y}$ as an expression in $x$.'
            answer: '$7 + x$'
            solution_sketch: '$b = \frac{1}{2} \cdot \frac{6}{3} = 1$; $a = 11 - 1 \cdot 4 = 7$.'
          - problem: 'Given $\bar{x} = 5$, $\bar{y} = 20$, $s_x = 3$, $s_y = 10$, $r = -0.6$, find the least-squares line; give $\hat{y}$ as an expression in $x$.'
            answer: '$30 - 2x$'
            solution_sketch: '$b = -0.6 \cdot \frac{10}{3} = -2$; $a = 20 - (-2) \cdot 5 = 30$.'
          - problem: 'Given $\bar{x} = 3$, $\bar{y} = 10$, $s_x = 2$, $s_y = 4$, $r = 0.5$, find the intercept of the least-squares line.'
            answer: "7"
            solution_sketch: '$b = 0.5 \cdot \frac{4}{2} = 1$; $a = 10 - 1 \cdot 3 = 7$.'
          - problem: 'Given $\bar{x} = 2$, $\bar{y} = 14$, $s_x = 4$, $s_y = 8$, $r = -0.5$, find the slope of the least-squares line.'
            answer: "-1"
            solution_sketch: '$b = -0.5 \cdot \frac{8}{4} = -1$.'
          - problem: 'Given $\bar{x} = 5$, $\bar{y} = 30$, $s_x = 2$, $s_y = 3$, $r = 2/3$, find the slope of the least-squares line.'
            answer: "1"
            solution_sketch: '$b = \frac{2}{3} \cdot \frac{3}{2} = 1$.'
          - problem: 'Given $\bar{x} = 6$, $\bar{y} = 20$, $s_x = 5$, $s_y = 10$, $r = 0.5$, find the intercept of the least-squares line.'
            answer: "14"
            solution_sketch: '$b = 0.5 \cdot \frac{10}{5} = 1$; $a = 20 - 1 \cdot 6 = 14$.'
        constraints: "slopes integers or halves; include at least one negative-r case"
    diagnostic_exemplar:
      problem: 'Given $r = 0.9$, $s_x = 3$, $s_y = 6$, $\bar{x} = 10$, $\bar{y} = 25$, find the least-squares line; give $\hat{y}$ as an expression in $x$.'
      answer: '$7 + 1.8x$'
      solution_sketch: '$b = 0.9 \cdot \frac{6}{3} = 1.8$; $a = 25 - 1.8 \cdot 10 = 7$.'
    anki_seeds:
      - front: 'Least-squares slope from summary statistics?'
        back: '$b = r \dfrac{s_y}{s_x}$.'
        type: basic
      - front: 'The least-squares line always passes through the point...'
        back: '$(\bar{x}, \bar{y})$.'
        type: basic

  - id: regression-predictions
    name: "Predictions & Residuals"
    core: false                # terminal regression branch
    difficulty: 0.5
    drill: false
    answer_kind: numeric
    expected_time_secs: 120
    prerequisites:
      - id: least-squares-line
        weight: 0.8
        key: true
    knowledge_points:
      - id: kp1
        name: "Predicting with the line"
        key_prerequisites: [least-squares-line]
        exemplars:
          - problem: 'The regression line is $\hat{y} = 3 + 2x$. Predict $y$ at $x = 5$.'
            answer: "13"
            solution_sketch: '$\hat{y} = 3 + 2 \cdot 5 = 13$.'
          - problem: 'The regression line is $\hat{y} = 30 - 2x$. Predict $y$ at $x = 8$.'
            answer: "14"
            solution_sketch: '$30 - 16 = 14$.'
          - problem: "The regression line is $\\hat{y} = 7 - 4x$. Find the predicted value at $x = 3$."
            answer: "-5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full line is $\\hat{y} = 7 - 4x$. Substitute $x = 3$: $\\hat{y} = 7 - 4(3) = 7 - 12 = -5$. The predicted value is -5."
          - problem: "The regression line is $\\hat{y} = 12 + 5x$. Find the x-value for which the predicted value is $47$."
            answer: "7"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Start with the full line $\\hat{y} = 12 + 5x$. Set $\\hat{y} = 47$ and solve: $47 = 12 + 5x$, so $5x = 35$, giving $x = 7$. The x-value is 7."
          - problem: "A least-squares line for test score $y$ on study hours $x$ is $\\hat{y} = 62 + 4x$. Find the predicted score for 7 study hours."
            answer: "90"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full line is $\\hat{y} = 62 + 4x$. Substitute $x = 7$: $\\hat{y} = 62 + 4(7) = 62 + 28 = 90$. The predicted score is 90."
          - problem: "A regression line has slope $6$ and passes through the point $(2, 20)$. Find the predicted value at $x = 9$."
            answer: "62"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Use the point to find the intercept: $20 = 6(2) + b$, so $b = 8$. The full line is $\\hat{y} = 6x + 8$. At $x = 9$, $\\hat{y} = 6(9) + 8 = 62$. The predicted value is 62."
        constraints: "integer coefficients and x-values; predictions integers"
      - id: kp2
        name: "Residuals"
        key_prerequisites: [least-squares-line]
        exemplars:
          - problem: 'At $x = 5$ the observed value is $y = 11$ and the line $\hat{y} = 3 + 2x$ predicts $13$. Find the residual.'
            answer: "-2"
            solution_sketch: 'Residual $= y - \hat{y} = 11 - 13 = -2$.'
          - problem: 'A point has observed $y = 25$ and predicted $\hat{y} = 22$. Find the residual.'
            answer: "3"
            solution_sketch: 'Residual $= 25 - 22 = 3 > 0$, so the point sits above the line.'
          - problem: "At x = 4 the observed value is y = 23 and the line yhat = 3 + 4x predicts 19. Find the residual."
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The line gives yhat = 3 + 4(4) = 19. The residual rule is residual = observed - predicted, so r = 23 - 19 = 4. The answer is 4."
          - problem: "At x = 6 the observed value is y = 20 and the line yhat = 50 - 4x predicts 26. Find the residual."
            answer: "-6"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The line gives yhat = 50 - 4(6) = 26. The residual rule is r = observed - predicted, so r = 20 - 26 = -6. The answer is -6."
          - problem: "A least-squares line is yhat = 6 + 4x. At x = 3 the observed value is y = 27. Find the residual."
            answer: "9"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The line gives yhat = 6 + 4(3) = 18. The residual rule is r = observed - predicted, so r = 27 - 18 = 9. The answer is 9."
          - problem: "A point has observed y = 10; the line yhat = 1 + 3x predicts 7 at x = 2. State the sign of the residual and give its value."
            answer: "sign = positive; r = 3"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["positive"], ["negative"]]}, "name": "sign"}, {"contract": {"kind": "exact"}, "name": "r"}]}
            solution_sketch: "The line gives yhat = 1 + 3(2) = 7. The residual rule is r = observed - predicted, so r = 10 - 7 = 3. Since 3 is greater than 0, the sign is positive; the label negative would come from reversing the subtraction as predicted minus observed. The answer is sign = positive; r = 3."
        constraints: "residual = observed minus predicted; a positive residual means the point lies above the line"
      - id: kp3
        name: "Extrapolation caution"
        key_prerequisites: [least-squares-line]
        exemplars:
          - problem: 'A line was fit to data with $x$ between $2$ and $10$. Predicting at $x = 40$ is an example of what? Answer with one word.'
            answer: 'Extrapolation'
            answer_contract: {kind: label, options: [[Extrapolation], [Interpolation]]}
            solution_sketch: '$x = 40$ lies far outside the observed range $[2, 10]$, so the prediction is unreliable.'
          - problem: 'A line was fit to data with $x$ between $2$ and $10$. Predicting at $x = 6$ is an example of what? Answer with one word.'
            answer: 'Interpolation'
            answer_contract: {kind: label, options: [[Extrapolation], [Interpolation]]}
            solution_sketch: '$x = 6$ lies inside the observed range $[2, 10]$, where the fitted pattern is supported by data.'
        constraints: "x-ranges stated explicitly; ask for the one-word classification (interpolation or extrapolation)"
    diagnostic_exemplar:
      problem: 'The regression line is $\hat{y} = 5 + 3x$; at $x = 4$ the observed value is $y = 15$. Give (predicted value, residual) as an ordered pair.'
      answer: '$(17, -2)$'
      solution_sketch: '$5 + 12 = 17$; $15 - 17 = -2$.'
    anki_seeds:
      - front: 'Residual $=$ ?'
        back: 'Observed $-$ predicted: $y - \hat{y}$.'
        type: basic
      - front: 'Why distrust regression predictions far outside the observed $x$-range?'
        back: 'Extrapolation — the linear pattern may not continue beyond the data.'
        type: basic

  - id: correlation-regression
    name: "Interpreting Regression Models"
    core: false                # terminal regression branch
    difficulty: 0.55
    drill: false
    answer_kind: numeric
    expected_time_secs: 240
    prerequisites:
      - id: least-squares-line
        weight: 0.7
        key: true
      - id: regression-predictions
        weight: 0.6
        key: true
      - id: scatterplots-correlation
        weight: 0.4
        key: false
    knowledge_points:
      - id: kp1
        name: "Interpreting slope and intercept in context"
        key_prerequisites: [least-squares-line]
        exemplars:
          - problem: 'For plant height $\hat{y} = 12 + 3x$ ($y$ in cm, $x$ in weeks), by how many cm does each additional week raise the predicted height?'
            answer: "3"
            solution_sketch: 'The slope is the predicted change in $y$ per one-unit change in $x$ — an association, not a cause.'
          - problem: 'Same model. What height, in cm, does it predict at $x = 0$ weeks?'
            answer: "12"
            solution_sketch: 'The intercept is the predicted $y$ at $x = 0$.'
          - problem: "A service plan has a fixed monthly fee and a charge for each device. The least-squares model predicted cost = 30 + 4x gives predicted monthly cost in dollars from x devices. By how many dollars does each additional device raise the predicted cost?"
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: identify the slope in predicted cost = 30 + 4x; it is 4. Step 2: use the rule that the slope is the predicted change in y per one-unit increase in x, an association not a cause. So each additional device raises predicted cost by 4 dollars, and the per-unit change is 4."
          - problem: "A repair shop estimates wait time from the number of jobs in the queue. The model predicted wait = 18 - 5x gives predicted wait in minutes when x jobs are in the queue. What wait time, in minutes, does the model predict when x = 0?"
            answer: "18"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: the model is predicted wait = 18 - 5x. Step 2: the intercept 18 is the predicted y when x = 0 by the intercept rule, an association not a cause. So the predicted wait at x = 0 is 18 minutes, and the value is 18."
          - problem: "A company models the resale value of a machine. The least-squares line predicted value = 20000 - 1500x gives predicted resale value in dollars after x years. Find the predicted change in resale value, in dollars, for each additional year."
            answer: "-1500"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: the model is predicted value = 20000 - 1500x, so the slope is -1500. Step 2: the slope rule says the slope is the predicted change in y per one-unit increase in x, an association not a cause. So the predicted change in resale value is -1500 dollars per year, and the per-unit change is -1500."
          - problem: "A taxi fare has a base charge and a charge per mile. The model predicted fare = 2 + (3/4)x gives predicted fare in dollars for x miles. Find the predicted change in fare in dollars for each additional mile, as a fraction."
            answer: "3/4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: the model predicted fare = 2 + (3/4)x has slope 3/4. Step 2: the slope rule says the slope is the predicted change in y for one more mile, an association not a cause. So the predicted change in fare is 3/4 dollar per mile, and the per-unit change is 3/4."
        constraints: "contexts with stated units; ask for the per-unit change or the value at x = 0; the reasoning must say predicted/associated, not caused"
      - id: kp2
        name: "r-squared and causation cautions"
        key_prerequisites: [scatterplots-correlation]
        exemplars:
          - problem: 'A regression has $r = 0.8$. What fraction of the variation in $y$ is explained by the line?'
            answer: "16/25"
            solution_sketch: '$r^2 = 0.64 = 16/25$.'
          - problem: 'A fit has $r^2 = 0.49$ and a negative slope. Find $r$.'
            answer: "-0.7"
            solution_sketch: '$\sqrt{0.49} = 0.7$; the sign matches the slope.'
          - problem: 'Children''s shoe size and reading level correlate strongly. Which explains this: (a) a bigger shoe size causes better reading; (b) age is a lurking variable driving both?'
            answer: '(b)'
            solution_sketch: 'Older children have both a bigger shoe size and stronger reading; correlation does not establish causation.'
          - problem: "In a study of plant height and daily sunlight, the correlation is r = 0.9. Find the coefficient of determination as a fraction."
            answer: "81/100"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The coefficient of determination rule is r^2. The full object is r^2 = (0.9)^2. Step 1: square the correlation: 0.9 times 0.9 = 0.81. Step 2: write 0.81 as the fraction 81/100. The fraction is 81/100."
          - problem: "A regression line for study hours and test score has r^2 = 0.36 and a positive slope. Find the correlation coefficient r as a fraction."
            answer: "3/5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The coefficient of determination rule is r^2 = 0.36. Step 1: take the square root: sqrt(0.36) = 0.6. Step 2: the slope is positive, so r has the positive sign; 0.6 = 3/5. The correlation coefficient is 3/5."
          - problem: "For a regression of gas mileage on car weight, r = -0.8. Find the fraction of the variation in gas mileage that the line does not explain."
            answer: "9/25"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The rule is that the line explains r^2 of the variation. Step 1: square the correlation: (-0.8)^2 = 0.64. Step 2: subtract from 1: 1 - 0.64 = 0.36 = 9/25. The unexplained fraction is 9/25."
        constraints: "r values with exact squares; one causation-caution item per set"
      - id: kp3
        name: "From summary statistics to prediction"
        key_prerequisites: [least-squares-line, regression-predictions]
        exemplars:
          - problem: 'Given $\bar{x} = 5$, $\bar{y} = 30$, $s_x = 2$, $s_y = 10$, $r = 0.8$: find the least-squares line, then give the prediction at $x = 8$.'
            answer: "42"
            solution_sketch: '$b = 0.8 \cdot 5 = 4$; $a = 30 - 20 = 10$; $\hat{y}(8) = 42$.'
          - problem: 'Continuing: the observed value at $x = 8$ is $y = 40$. Find the residual.'
            answer: "-2"
            solution_sketch: '$40 - 42 = -2$.'
          - problem: "A sample gives xbar = 10, ybar = 50, sx = 3, sy = 12, and r = 0.75. Find the least-squares prediction at x = 14."
            answer: "62"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The least-squares line is yhat = 20 + 3x. Slope rule: b = r*sy/sx = 0.75*12/3 = 3. Intercept rule: a = ybar - b*xbar = 50 - 3*10 = 20. Prediction rule: yhat = 20 + 3*14 = 62. The predicted value is 62."
          - problem: "For a data set, the summary values are xbar = 7, ybar = 41, sx = 2, sy = 5, r = 0.8. Give the fitted value when x = 10."
            answer: "47"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The least-squares line is yhat = 27 + 2x. Slope rule: b = r*sy/sx = 0.8*5/2 = 2. Intercept rule: a = ybar - b*xbar = 41 - 2*7 = 27. Prediction rule: yhat = 27 + 2*10 = 47. The fitted value is 47."
          - problem: "The summary statistics are xbar = 4, ybar = 20, sx = 2, sy = 5, r = 0.4. At x = 7 the observed y is 26. Find the residual."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The least-squares line is yhat = 16 + x. Slope rule: b = r*sy/sx = 0.4*5/2 = 1. Intercept rule: a = ybar - b*xbar = 20 - 1*4 = 16. Prediction rule: predicted y at x = 7 is 16 + 7 = 23. Residual rule: 26 - 23 = 3. The residual is 3."
          - problem: "A study has xbar = 12, ybar = 60, sx = 4, sy = 10, r = 0.8. Compute the predicted y at x = 15."
            answer: "66"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The least-squares line is yhat = 36 + 2x. Slope rule: b = r*sy/sx = 0.8*10/4 = 2. Intercept rule: a = ybar - b*xbar = 60 - 2*12 = 36. Prediction rule: yhat = 36 + 2*15 = 66. The predicted y is 66."
        constraints: "summary stats give integer slopes and intercepts; finish with a prediction or residual"
    diagnostic_exemplar:
      problem: 'Summary statistics: $\bar{x} = 6$, $\bar{y} = 20$, $s_x = 2$, $s_y = 8$, $r = 0.5$. Give (the least-squares prediction at $x = 10$, the fraction of the variation in $y$ explained by the line) as an ordered pair.'
      answer: '$(28, 1/4)$'
      solution_sketch: '$b = r s_y/s_x = 0.5 \cdot 4 = 2$ and $a = 20 - 2 \cdot 6 = 8$, so $\hat{y} = 8 + 2(10) = 28$; the explained fraction is $r^2 = 0.25 = \frac{1}{4}$.'
    anki_seeds:
      - front: '$r^2$ measures...'
        back: 'The fraction of the variation in $y$ explained by the least-squares line.'
        type: basic
      - front: 'Does a strong correlation establish causation?'
        back: 'No — lurking variables or coincidence can produce strong correlation without cause.'
        type: basic
