unit: inference
course: probability-statistics
module: "Statistical Inference & Regression"
topics:
  - id: populations-samples
    name: "Populations & Samples"
    core: true
    difficulty: 0.3
    drill: false
    answer_kind: numeric
    expected_time_secs: 90
    prerequisites:
      - id: mean-median-mode
        weight: 0.6
        key: true
    knowledge_points:
      - id: kp1
        name: "Population versus sample"
        key_prerequisites: []
        exemplars:
          - problem: 'A health team surveys 150 of a city''s 25,000 adults about their sleep habits. Which group is the population: the adults surveyed or all the adults of the city?'
            answer: 'all the adults of the city'
            answer_contract: {"kind": "label", "options": [["all the adults of the city", "the adults of the city", "the city's adults", "all 25,000 adults", "all adults", "all the adults", "all of the city's adults", "all adults in the city"], ["the adults surveyed", "the adults who were surveyed", "the 150 adults", "the 150 adults surveyed", "the 150 surveyed", "the surveyed adults", "the sample"]]}
            solution_sketch: 'The health team wants to draw conclusions about the whole city, so the population is all 25000 adults of the city. The 150 adults who answer the survey are only a part of that group, so they form the sample.'
          - problem: 'A researcher surveys 25 of the 120 teachers at a school. How many teachers are not in the sample?'
            answer: '95'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The population is all 120 teachers and the sample is the 25 who are surveyed. The teachers who are not in the sample are the rest, so 120 - 25 = 95 teachers.'
          - problem: 'A quality inspector tests 40 of the 1000 bulbs produced today to see how long they last. Sam says that the 40 bulbs tested are the population. Is Sam right?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["no", "no, he is not right", "he is not right", "sam is not right", "sam is wrong", "wrong", "not right", "incorrect"], ["yes", "yes, he is right", "he is right", "sam is right", "right", "correct"]]}
            solution_sketch: 'The inspector wants to know about all 1000 bulbs made today, so those 1000 bulbs are the population. The 40 bulbs that are tested are only a part of it, so they are the sample and Sam is not right.'
          - problem: 'A town conducts a census of its 4000 residents. How many residents are measured?'
            answer: '4000'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A census measures every member of the population, not only a part of it. The town has 4000 residents, so all 4000 of them are measured.'
          - problem: 'A marine biologist catches 30 of the 2000 fish in a lake and measures their lengths. What percent of the fish in the lake are in the sample?'
            answer: '1.5%'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The population is the 2000 fish in the lake and the sample is the 30 fish that are caught. The share of the population in the sample is 30/2000 = 0.015, which is 1.5%.'
          - problem: 'A school has 1200 students. For a survey about lunch, the school asks a sample of 5% of its students. How many students are in the sample?'
            answer: '60'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The population is all 1200 students. The sample is 5% of them, so it has 0.05 * 1200 = 60 students.'
          - problem: 'A survey of 90 students is a sample of 7.5% of the students at a college. How many students does the college have?'
            answer: '1200'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The sample of 90 students is 7.5% of the population, so 0.075 times the population equals 90. The population is 90 / 0.075 = 1200 students.'
        constraints: "concrete scenarios; the learner names a group or finds a group size or a share of the population"
      - id: kp2
        name: "Parameter versus statistic"
        key_prerequisites: [mean-median-mode]
        exemplars:
          - problem: 'A teacher measures a sample of 4 students and gets the heights 150, 154, 158 and 162 cm. Is the mean of these four heights a parameter or a statistic?'
            answer: 'statistic'
            answer_contract: {"kind": "label", "options": [["statistic", "a statistic", "it is a statistic", "sample statistic"], ["parameter", "a parameter", "it is a parameter", "population parameter"]]}
            solution_sketch: 'The four heights come from a sample, not from the whole population of students. A number computed from a sample is a statistic, so the mean of these four heights is a statistic.'
          - problem: 'A teacher measures a sample of 4 students and gets the heights 150, 154, 158 and 162 cm. Find the mean height of the sample.'
            answer: '156'
            answer_contract: {"kind": "unit", "quantity": "length", "unit": "cm", "allow_omitted": true}
            solution_sketch: 'The four heights add up to 150 + 154 + 158 + 162 = 624. Divide by the sample size 4 to get the sample mean 624 / 4 = 156 cm.'
          - problem: 'The four employees of a small firm earn 4000, 6000, 8000 and 10000 dollars a year. These are all the employees of the firm. Find the mean yearly earnings of the firm''s employees.'
            answer: '7000'
            answer_contract: {"kind": "unit", "quantity": "dollar", "unit": "dollar", "allow_omitted": true}
            solution_sketch: 'The four earnings add up to 4000 + 6000 + 8000 + 10000 = 28000 dollars. Divide by 4 to get 28000 / 4 = 7000 dollars. This mean describes the whole population, so it is a parameter.'
          - problem: 'A school nurse measures the height of every one of the 500 students in her school and finds that the mean is 162 cm. Is 162 a parameter or a statistic?'
            answer: 'parameter'
            answer_contract: {"kind": "label", "options": [["parameter", "a parameter", "it is a parameter", "population parameter"], ["statistic", "a statistic", "it is a statistic", "sample statistic"]]}
            solution_sketch: 'The nurse measures every student of the school, so the 500 students are the whole population. A number that describes the whole population is a parameter, so 162 is a parameter.'
          - problem: 'A sample of 5 bolts has the diameters 7, 8, 9, 8 and 8 mm. Find the sample mean.'
            answer: '8'
            answer_contract: {"kind": "unit", "quantity": "length", "unit": "mm", "allow_omitted": true}
            solution_sketch: 'The five diameters add up to 7 + 8 + 9 + 8 + 8 = 40 mm. Divide by the sample size 5 to get the sample mean 40 / 5 = 8 mm.'
          - problem: 'A sample of 6 households spends 1260 dollars a month on food in total. Find the mean monthly food spending of the sample.'
            answer: '210'
            answer_contract: {"kind": "unit", "quantity": "dollar", "unit": "dollar", "allow_omitted": true}
            solution_sketch: 'The total spending of the 6 households is 1260 dollars. Divide the total by the sample size to get 1260 / 6 = 210 dollars per household.'
          - problem: 'The mean lifetime of a sample of 8 batteries is 21 hours. What is the total of the 8 lifetimes?'
            answer: '168'
            answer_contract: {"kind": "unit", "quantity": "time", "unit": "hour", "allow_omitted": true}
            solution_sketch: 'The sample mean is the total divided by the sample size 8. So the total is the mean times the sample size, 21 * 8 = 168 hours.'
          - problem: 'The population of three values 2, 4 and 6 has mean $\mu$. Find $\mu$.'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Add the three values to get 2 + 4 + 6 = 12. Divide by 3 to get $\mu$ = 12 / 3 = 4. This is a parameter, since the three values are the whole population.'
        constraints: "mean computations from stated data, and sample-or-population classification of a stated number"
      - id: kp3
        name: "Why sample at all"
        key_prerequisites: []
        exemplars:
          - problem: 'A city wants the mean commute time of all 50000 downtown workers. The deadline is tomorrow, and only 200 interviews can be finished before then. Which limit forces the city to use a sample: time, cost or destruction of the units?'
            answer: 'time'
            answer_contract: {"kind": "label", "options": [["time", "the time", "not enough time", "too slow", "the deadline", "time limit"], ["cost", "the cost", "too expensive", "money", "too costly"], ["destruction", "destructive", "destruction of the units", "the testing destroys them", "destructive testing"]]}
            solution_sketch: 'Only 200 of the 50000 interviews fit before the deadline, so the lack of time stops a census. No budget is mentioned, and an interview does not destroy the person who is interviewed.'
          - problem: 'A city plans a census of its 4000 households, and each interview costs 12 dollars. How many dollars does the city save by interviewing a sample of 400 households instead?'
            answer: '43200'
            answer_contract: {"kind": "unit", "quantity": "dollar", "unit": "dollar", "allow_omitted": true}
            solution_sketch: 'The census costs 4000 * 12 = 48000 dollars and the sample costs 400 * 12 = 4800 dollars. The saving is 48000 - 4800 = 43200 dollars.'
          - problem: 'A team tests the breaking strength of 25 concrete beams from a batch by loading each beam until it fails. Which limit forces the team to test only a sample: time, cost or destruction of the units?'
            answer: 'destruction'
            answer_contract: {"kind": "label", "options": [["destruction", "destructive", "destruction of the units", "the testing destroys them", "destructive testing", "it destroys the beams"], ["time", "the time", "not enough time", "too slow", "time limit"], ["cost", "the cost", "too expensive", "money", "too costly"]]}
            solution_sketch: 'A beam that is loaded until it fails is broken after the test. A census of the batch would break every beam, so the destruction of the units forces the use of a sample.'
          - problem: 'A factory tests the lifetime of 50 of the 5000 bulbs it produced by running each of them until it burns out. How many bulbs escape destruction?'
            answer: '4950'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Only the 50 tested bulbs are used up. The other bulbs are never tested, so 5000 - 50 = 4950 bulbs escape destruction.'
          - problem: 'A fishery has 10000 cod, and a team measures 100 of them. What fraction of the cod is in the sample?'
            answer: '1/100'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The sample has 100 cod out of a population of 10000. The fraction is 100/10000 = 1/100.'
          - problem: 'Checking one household takes 8 minutes. How many hours does a team save by checking a sample of 300 of 3000 households instead of every household?'
            answer: '360'
            answer_contract: {"kind": "unit", "quantity": "time", "unit": "hour", "allow_omitted": true}
            solution_sketch: 'The census takes 3000 * 8 = 24000 minutes and the sample takes 300 * 8 = 2400 minutes. The difference is 21600 minutes, and 21600 / 60 = 360 hours.'
          - problem: 'A survey team has 6000 dollars for interviews, and each interview costs 12 dollars. How many households can the team interview?'
            answer: '500'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Each household costs 12 dollars, so the number of households is the budget divided by the cost of one. That is 6000 / 12 = 500 households.'
          - problem: 'A survey team plans a census of 4000 households at 12 dollars per interview, but its budget is 6000 dollars. How many more dollars does the team need?'
            answer: '42000'
            answer_contract: {"kind": "unit", "quantity": "dollar", "unit": "dollar", "allow_omitted": true}
            solution_sketch: 'The census costs 4000 * 12 = 48000 dollars. The team has 6000 dollars, so it needs 48000 - 6000 = 42000 dollars more.'
          - problem: 'A team tests the breaking strength of 25 concrete beams from a batch of 500 beams by loading each beam until it fails. How many beams of the batch are still unbroken?'
            answer: '475'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Only the 25 tested beams are broken. The other beams are untouched, so 500 - 25 = 475 beams are still unbroken.'
        constraints: "scenarios where cost, time, or destructive testing forces sampling; the learner names the limit or computes the saving"
    diagnostic_exemplar:
      problem: 'An inspector tests $50$ of the $5000$ batteries produced in a day; the mean life of the $50$ is $21$ hours. Identify the population, the sample, and whether $21$ hours is a parameter or a statistic.'
      answer: 'Population: all $5000$ batteries; sample: the $50$ tested; $21$ hours is a statistic.'
      answer_contract: {kind: none}
      solution_sketch: 'The population is the whole group under study, the sample the part actually measured; a number computed from the sample is a statistic, one describing the population a parameter.'
    anki_seeds:
      - front: 'Parameter vs statistic?'
        back: 'A parameter describes the population; a statistic describes a sample.'
        type: basic
      - front: 'Which symbols go with the population, and which with the sample?'
        back: 'Population: $\mu, \sigma$. Sample: $\bar{x}, s$.'
        type: basic

  - id: sampling-methods-bias
    name: "Sampling Methods & Bias"
    core: false                # study-design branch; terminal
    difficulty: 0.35
    drill: false
    answer_kind: multi-step
    expected_time_secs: 120
    prerequisites:
      - id: populations-samples
        weight: 0.8
        key: true
    knowledge_points:
      - id: kp1
        name: "Simple random samples"
        key_prerequisites: [populations-samples]
        exemplars:
          - problem: 'A school club writes the names of its 18 members on identical slips, mixes the slips well in a bowl and draws 3 slips without replacement. Does every group of 3 members have the same chance of being the sample?'
            answer: 'yes'
            answer_contract: {"kind": "label", "options": [["yes", "yes, it does", "it does", "they do", "every group has the same chance", "the same", "yes, every group of 3 has the same chance", "yes every group has the same chance"], ["no", "no, it does not", "it does not", "they do not", "not the same"]]}
            solution_sketch: 'Identical slips that are mixed well and drawn without replacement give no group a better chance than another. So every group of 3 of the 18 members has the same chance, and the sample is a simple random sample.'
          - problem: 'A school club writes the names of its 18 members on identical slips, mixes the slips well in a bowl and draws 3 slips without replacement. What is the chance that one named member is in the sample?'
            answer: '1/6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The sample has 3 places for 18 equally likely members. The chance for one named member is 3/18 = 1/6.'
          - problem: 'A teacher lists the 26 students of a class in alphabetical order and takes the first 6 names as the sample. Is this a simple random sample of 6 students?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["no", "no, it is not", "it is not", "it is not a simple random sample", "no it is not", "not random", "no, it is not random", "no it isn't"], ["yes", "yes, it is", "it is", "it is a simple random sample"]]}
            solution_sketch: 'A simple random sample needs a chance mechanism that gives every group of 6 students the same chance. The first 6 names are fixed by the alphabet, so only one group of 6 is possible and the sample is not a simple random sample.'
          - problem: 'A coach writes the 12 player names on slips, draws a slip, records the name and puts the slip back, then repeats this until 4 names are recorded. What is the chance that the second name recorded is the same as the first?'
            answer: '1/12'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The slip goes back after every draw, so the second draw is made from all 12 slips again. The chance that it is the same slip as the first is 1/12, and so the list need not hold 4 different players.'
          - problem: 'A town has 6000 households. To pick a simple random sample, each household is numbered from 0000 to 5999, and the planner reads four-digit strings from a random number table. Any string from 6000 to 9999 is thrown away and the next string is read. How many of the 10000 possible four-digit strings are thrown away?'
            answer: '4000'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The four-digit strings run from 0000 to 9999, so there are 10000 of them. Only the 6000 strings from 0000 to 5999 match a household, so 10000 - 6000 = 4000 strings are thrown away.'
          - problem: 'A simple random sample of 60 members is drawn from the 480 members of a gym. What is the chance that one named member of the gym is not in the sample?'
            answer: '7/8'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Each member has chance 60/480 = 1/8 of being in the sample. The chance of not being in the sample is 1 - 1/8 = 7/8.'
          - problem: 'A simple random sample is drawn so that every member of a population has chance 1/12 of being included. The sample has 35 members. How many members does the population have?'
            answer: '420'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The chance of inclusion is the sample size divided by the population size, so 35 divided by the population size equals 1/12. The population has 35 * 12 = 420 members.'
          - problem: 'A simple random sample of 2 members is drawn from a team of 5 members. What is the chance that one given pair of members is the sample?'
            answer: '1/10'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'There are C(5,2) = 10 different pairs of members, and each pair has the same chance. So the chance of one given pair is 1/10.'
        constraints: "definitions and yes/no judgments about equal chances, and chance or size computations for simple random samples"
      - id: kp2
        name: "Identifying sampling methods"
        key_prerequisites: [populations-samples]
        exemplars:
          - problem: 'A grocery store numbers its loyalty cards from 1 to 900. The manager draws one random number between 1 and 30, surveys that card holder, and then surveys every 30th card holder after that. Which sampling method is this?'
            answer: 'systematic'
            answer_contract: {"kind": "label", "options": [["systematic", "systematic sampling", "it is systematic", "a systematic sample"], ["stratified", "stratified sampling", "it is stratified", "a stratified sample"], ["cluster", "cluster sampling", "it is cluster", "a cluster sample"], ["convenience", "convenience sampling", "it is convenience", "a convenience sample"]]}
            solution_sketch: 'The manager uses one random start and then a fixed step of 30 along the ordered list of cards. A random start with a fixed step is the mark of systematic sampling.'
          - problem: 'A school splits its 800 students into four year groups of 200 students each. It picks 25 students at random from every year group for a survey about lunch. How many students are surveyed?'
            answer: '100'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The school draws a sample from every one of the 4 year groups, which is stratified sampling. Each group gives 25 students, so 4 * 25 = 100 students are surveyed.'
          - problem: 'A town has 40 apartment blocks. A planner picks 5 blocks at random and interviews every household in those blocks. Which sampling method is this?'
            answer: 'cluster'
            answer_contract: {"kind": "label", "options": [["cluster", "cluster sampling", "it is cluster", "a cluster sample"], ["stratified", "stratified sampling", "it is stratified", "a stratified sample"], ["systematic", "systematic sampling", "it is systematic", "a systematic sample"], ["convenience", "convenience sampling", "it is convenience", "a convenience sample"]]}
            solution_sketch: 'The planner picks whole blocks at random and surveys everyone inside them. Whole groups that are chosen and fully surveyed are the mark of cluster sampling.'
          - problem: 'A district has 50 classrooms with 22 students each. An inspector picks 7 classrooms at random and surveys every student in those classrooms. How many students are surveyed?'
            answer: '154'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The inspector surveys all the students of 7 whole classrooms. With 22 students in each classroom, 7 * 22 = 154 students are surveyed.'
          - problem: 'A clinic lists its 616 patients of the day in the order of arrival. The staff draw a random number from 1 to 11, survey that patient, and then survey every 11th patient after that one. How many patients are surveyed?'
            answer: '56'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'One patient is surveyed from each block of 11 patients along the list. The list has 616 / 11 = 56 complete blocks, so 56 patients are surveyed whichever start is drawn.'
          - problem: 'A firm has 240 junior staff, 160 senior staff and 80 managers. It draws a random sample of 60 employees, with the number from each group proportional to the size of the group. How many senior staff are in the sample?'
            answer: '20'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The firm has 240 + 160 + 80 = 480 employees. The senior staff are 160/480 = 1/3 of them, so the sample has 60 / 3 = 20 senior staff.'
          - problem: 'A valley has 16 sheep farms with exactly 37 sheep each. A researcher picks 6 of the farms at random and weighs every sheep on those farms. How many sheep are weighed?'
            answer: '222'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The researcher weighs every sheep on 6 whole farms. Each farm has 37 sheep, so 6 * 37 = 222 sheep are weighed.'
          - problem: 'A list holds 1200 names. A researcher wants a systematic sample of 40 names, taking every kth name after a random start. What is k?'
            answer: '30'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A systematic sample takes one name from each block of k names along the list. For 40 names from 1200, each block has 1200 / 40 = 30 names, so k = 30.'
          - problem: 'A college has 900 day students and 600 evening students. It draws a random sample of 80 students, with the number from each group proportional to the size of the group. How many evening students are in the sample?'
            answer: '32'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The college has 900 + 600 = 1500 students. The evening students are 600/1500 = 2/5 of them, so the sample has 80 * 2/5 = 32 evening students.'
        constraints: "one scenario per method; the scenario names the selection mechanism precisely; the learner names the method or counts the members surveyed"
      - id: kp3
        name: "Recognizing bias"
        key_prerequisites: [populations-samples]
        exemplars:
          - problem: 'A website posts a poll that visitors choose to answer. What kind of bias does this poll invite: voluntary response, convenience or undercoverage?'
            answer: 'voluntary response'
            answer_contract: {"kind": "label", "options": [["voluntary response", "voluntary response bias", "voluntary", "self-selection", "people choose to answer", "voluntary-response bias", "self-selection bias", "self selection"], ["convenience", "convenience bias", "convenience sampling"], ["undercoverage", "undercoverage bias", "under-coverage"]]}
            solution_sketch: 'The visitors decide for themselves whether to answer, so the sample selects itself. People with strong opinions answer most often, and this is voluntary response bias.'
          - problem: 'To estimate how many hours a week the adults of a city exercise, a researcher surveys people at a gym. Is the estimate likely to be too high or too low?'
            answer: 'too high'
            answer_contract: {"kind": "label", "options": [["too high", "high", "it is too high", "an overestimate", "overestimate", "it will be too high", "will be too high", "a higher estimate"], ["too low", "low", "it is too low", "too small", "an underestimate", "underestimate", "it will be too low", "will be too low"]]}
            solution_sketch: 'People at a gym exercise more than most adults of the city. The sample leaves out the adults who do not exercise, so the estimate is likely to be too high.'
          - problem: 'A radio host asks listeners to call in about a tax proposal. Of the 250 callers, 210 are in favor, while a random sample of 400 residents has 160 in favor. If the callers matched the share of the random sample, how many of the 250 callers would be in favor?'
            answer: '100'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'In the random sample 160/400 = 0.4 of the residents are in favor. Among 250 callers that share would give 0.4 * 250 = 100 callers, which is far below the 210 callers in favor.'
          - problem: 'A magazine mails a survey to its 5000 readers and 400 readers reply. The magazine reports the answers as the opinion of its readers. What percent of the readers did not reply at all?'
            answer: '92%'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The readers who did not reply are 5000 - 400 = 4600 of the 5000. That is 4600/5000 = 0.92, which is 92%, so most readers are missing from the data.'
          - problem: 'A phone survey calls only landline numbers. In a town of 8000 households, 30% of the households have no landline. How many households can the survey never reach?'
            answer: '2400'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The households with no landline are 30% of the 8000 households. That is 0.3 * 8000 = 2400 households that the survey can never reach.'
          - problem: 'In a survey at a gym, 150 of 200 people say that they exercise at least three times a week, while in a random sample of 400 residents of the city only 100 say so. How many times as large as the share in the random sample is the share in the gym survey?'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The share in the gym survey is 150/200 = 3/4 and the share in the random sample is 100/400 = 1/4. The ratio is (3/4) / (1/4) = 3, which shows how strongly the gym sample is tilted.'
        constraints: "each scenario exhibits one named bias or measures how a self-chosen sample differs from the population; the direction of the distortion is asked as too high or too low"
    diagnostic_exemplar:
      problem: 'A radio host asks listeners to call in and vote on a tax proposal. Will the results represent the city? Name the problem.'
      answer: 'No; voluntary response bias — only listeners with strong opinions call in.'
      solution_sketch: 'The sample selects itself: who chooses to call in is not a random draw from the city, and the people with strong views are the ones who bother — voluntary response bias.'
    anki_seeds:
      - front: 'Simple random sample (SRS) of size $n$?'
        back: 'Every group of $n$ population members has the same chance of selection.'
        type: basic
      - front: 'Voluntary response and convenience samples are usually...'
        back: 'Biased — they overrepresent strong opinions or easy-to-reach people.'
        type: basic

  - id: experimental-design-basics
    name: "Experimental Design Basics"
    core: false                # study-design branch; terminal
    difficulty: 0.4
    drill: false
    answer_kind: multi-step
    expected_time_secs: 150
    prerequisites:
      - id: sampling-methods-bias
        weight: 0.7
        key: true
    knowledge_points:
      - id: kp1
        name: "Observational study versus experiment"
        key_prerequisites: [sampling-methods-bias]
        exemplars:
          - problem: 'Researchers track the health of people who already chose their own diets over ten years. Is this an observational study or an experiment?'
            answer: 'observational'
            answer_contract: {"kind": "label", "options": [["observational", "an observational study", "observational study", "it is observational"], ["experiment", "an experiment", "it is an experiment", "experimental"]]}
            solution_sketch: 'The people chose their own diets, so the researchers imposed no treatment. A study without an imposed treatment is an observational study.'
          - problem: 'Researchers randomly assign volunteers to one of three different sleep programs for a month and then compare their health. Is this an observational study or an experiment?'
            answer: 'experiment'
            answer_contract: {"kind": "label", "options": [["experiment", "an experiment", "it is an experiment", "experimental"], ["observational", "an observational study", "observational study", "it is observational"]]}
            solution_sketch: 'The researchers assign each volunteer a sleep program, so a treatment is imposed. A study with an imposed treatment is an experiment.'
          - problem: 'A researcher randomly assigns 45 of 180 volunteers to a new training program and the other volunteers to the usual program. How many volunteers does the researcher assign to the usual program?'
            answer: '135'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The researcher assigns the programs, so the study is an experiment. The 45 volunteers of the new program leave 180 - 45 = 135 volunteers for the usual program.'
          - problem: 'A farmer tests 3 fertilizers on 60 plots, with each fertilizer on the same number of plots. How many plots get each fertilizer?'
            answer: '20'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The farmer assigns the fertilizers, so the study is an experiment. The 60 plots are split equally among 3 fertilizers, so each fertilizer gets 60 / 3 = 20 plots.'
          - problem: 'A drug company randomly assigns 240 patients in equal groups to three doses of a drug and a placebo. How many patients are in each group?'
            answer: '60'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The company assigns the treatments, so the study is an experiment. There are 3 doses and a placebo, which makes 4 groups, so each group has 240 / 4 = 60 patients.'
          - problem: 'An online shop randomly assigns its 600 customers in equal groups to receive one of four versions of an email. How many customers receive each version?'
            answer: '150'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The shop assigns the email versions, so the study is an experiment. The 600 customers are split equally among 4 versions, so each version goes to 600 / 4 = 150 customers.'
        constraints: "the deciding question is always whether the researchers impose a treatment; the learner names the study type or computes the sizes of assigned groups"
      - id: kp2
        name: "Treatments, control, and random assignment"
        key_prerequisites: [sampling-methods-bias]
        try_first:
          problem: 'A farmer tests a new feed on 30 of her 60 cows. The other 30 cows get the usual feed. How many cows are in the control group?'
          answer_contract: {"kind": "exact"}
          answer: '30'
          reveal: 'The control group is the group that does not get the new treatment and serves as the comparison. Here that is the 30 cows on the usual feed.'
        exemplars:
          - problem: 'A pharmacy trial tests a new migraine tablet. Eighty volunteers are randomly split into two groups. One group takes the new tablet, and the other takes an identical-looking sugar tablet with no medicine. Is the group with the sugar tablet the treatment group or the control group?'
            answer: 'control group'
            answer_contract: {"kind": "label", "options": [["control group", "control", "the control group", "the control", "it is the control group"], ["treatment group", "treatment", "the treatment group", "the treatment", "it is the treatment group"]]}
            solution_sketch: 'The group with the sugar tablet does not get the new medicine. It gives the comparison for the new tablet, so it is the control group.'
          - problem: 'A gardener tests a new liquid plant food on pepper seedlings. Forty seedlings are split by a coin flip into two groups of equal size. Group A gets the plant food, and Group B gets water only. How many seedlings are in the control group?'
            answer: '20'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Group B gets water only, so it is the control group. The coin flip splits the 40 seedlings into two equal groups, so Group B has 40 / 2 = 20 seedlings.'
          - problem: 'A soccer coach tests a new warm-up routine. Thirty players volunteer, and the coach lets each player choose: 14 players pick the new routine and 16 stay with the usual routine. Were the players assigned to the two groups at random?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["no", "no, they were not", "not random", "the players chose", "no they were not", "no it was not", "no, it was not", "no they chose"], ["yes", "yes, they were", "they were", "at random", "random"]]}
            solution_sketch: 'Each player chose a routine freely, so no chance mechanism formed the groups. Random assignment needs a coin flip or a lottery, so the answer is no.'
          - problem: 'A swim coach tests a new recovery drink with her 20 swimmers. She puts her 12 favorite swimmers on the new drink, and the rest drink plain water. How many swimmers are in the control group?'
            answer: '8'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The swimmers on plain water do not get the new drink, so they are the control group. There are 20 - 12 = 8 of them.'
          - problem: 'A trial randomly assigns 100 volunteers so that the group with the new tablet is three times as large as the placebo group. How many volunteers get the placebo?'
            answer: '25'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Let the placebo group have p volunteers, so the new-tablet group has 3p. Then p + 3p = 100, so 4p = 100 and p = 25 volunteers get the placebo.'
          - problem: 'In a supplement trial, 60 mice are split at random: 30 get the new supplement and 30 get standard feed. After four weeks the mice on the supplement have gained 42 g on average, and the mice on standard feed have gained 35 g on average. How many grams more does the average mouse of the treatment group gain than the average mouse of the control group?'
            answer: '7'
            answer_contract: {"kind": "unit", "quantity": "mass", "unit": "g", "allow_omitted": true}
            solution_sketch: 'The mice on standard feed are the control group and give the comparison. The difference between the two group averages is 42 - 35 = 7 g.'
          - problem: 'A hospital randomly assigns 240 patients to a new drug or a placebo, and 25% of the patients get the placebo. How many patients get the new drug?'
            answer: '180'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The placebo group has 25% of 240 patients, which is 0.25 * 240 = 60 patients. The other patients get the new drug, so 240 - 60 = 180 patients.'
        constraints: "two-group designs; the learner names a group role, judges how groups were formed, or computes group sizes and differences"
      - id: kp3
        name: "Confounding and causation"
        key_prerequisites: [sampling-methods-bias]
        exemplars:
          - problem: 'A gym chain reports that branches with more personal trainers also sell more protein shakes. Name a likely confounder and say why.'
            answer: 'The size of the branch: a larger branch can hire more trainers and also sell more shakes.'
            answer_contract: {"kind": "written"}
            solution_sketch: 'A confounder must plausibly drive both variables. A larger branch can hire more trainers and also sell more shakes. So the link between trainers and shakes may come from branch size and not from the trainers.'
          - problem: 'A company wants to claim that a new safety training reduces workplace injuries. Which design can support that claim: an observational study, a randomized experiment or a before-and-after comparison?'
            answer: 'randomized experiment'
            answer_contract: {"kind": "label", "options": [["randomized experiment", "a randomized experiment", "experiment", "an experiment", "randomised experiment", "randomized controlled experiment", "randomized controlled trial", "a randomised experiment"], ["observational study", "an observational study", "observational"], ["before-and-after comparison", "a before-and-after comparison", "before and after", "before-and-after"]]}
            solution_sketch: 'Only random assignment balances the lurking variables between the groups. So a claim of cause needs a randomized experiment. In an observational study, workers who choose the training may already be safer.'
          - problem: 'A grocery chain tests a new store layout. It randomly assigns 60 stores, and twice as many stores keep the current layout as switch to the new one. How many stores switch to the new layout?'
            answer: '20'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Let t stores switch, so 2t stores keep the current layout. Then t + 2t = 60, so 3t = 60 and t = 20 stores switch.'
          - problem: 'A store randomly assigns 240 new shoppers in equal groups: half receive a loyalty card and half do not. The shoppers with a card spend 62 dollars per visit on average, and the others spend 50 dollars. By how many dollars per visit does the card raise the average spending?'
            answer: '12'
            answer_contract: {"kind": "unit", "quantity": "dollar", "unit": "dollar", "allow_omitted": true}
            solution_sketch: 'The assignment is random, so the two groups are alike apart from the card, and the difference can be put down to the card. It is 62 - 50 = 12 dollars per visit.'
          - problem: 'A hospital compares 300 patients who chose a new drug with 500 patients who chose the usual care. In the drug group 240 patients had a mild illness, and in the usual-care group 150 patients had a mild illness. How many of the 500 usual-care patients would have a mild illness if their share matched the share in the drug group?'
            answer: '400'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The share of mild illness in the drug group is 240/300 = 0.8. If the 500 usual-care patients had the same share, 0.8 * 500 = 400 of them would be mild cases, not the 150 observed. The groups differ in illness severity, which is a confounder.'
          - problem: 'A trial randomly assigns 150 patients to a drug, a half dose and a placebo in the ratio 2 : 2 : 1. How many patients get the placebo?'
            answer: '30'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The ratio 2 : 2 : 1 has 2 + 2 + 1 = 5 parts. One part is 150 / 5 = 30 patients, and the placebo group is one part, so 30 patients get the placebo.'
          - problem: 'Sam sees that cities with more ice-cream sales also have more drownings, and he concludes that ice cream causes drownings. Hot weather drives both. The drownings in his cities average 15 per month in summer and 3 per month in winter. How many times as many drownings per month happen in summer as in winter?'
            answer: '5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Summer weather is the lurking variable that raises both ice-cream sales and swimming. The ratio of drownings in summer to winter is 15 / 3 = 5, so summer has 5 times as many.'
        constraints: "confounders must plausibly drive both variables; causal claims only from randomized experiments; the learner picks a confounder or design, or computes group sizes and differences"
    diagnostic_exemplar:
      problem: 'To test a study app, $100$ volunteers are randomly split: $50$ use the app, $50$ do not, and exam scores are compared. Identify the treatment and control groups, and state why random assignment matters.'
      answer: 'Treatment: the $50$ app users; control: the $50$ non-users; random assignment balances lurking variables so score differences can be attributed to the app.'
      solution_sketch: 'The treatment group receives the intervention and the control group supplies the comparison; randomising the split is what balances the lurking variables, which is what licenses reading the difference as caused by the app.'
    anki_seeds:
      - front: 'Only which study design supports cause-and-effect conclusions?'
        back: 'A randomized experiment.'
        type: basic
      - front: 'A confounding variable is...'
        back: 'A third variable that influences both the explanatory and response variables, mixing up their apparent relationship.'
        type: basic

  - id: empirical-rule
    name: "The Empirical Rule"
    core: true
    difficulty: 0.45
    drill: false
    answer_kind: numeric
    expected_time_secs: 90
    prerequisites:
      - id: z-scores
        weight: 0.7
        key: true
      - id: percentages
        weight: 0.4
        key: false
    knowledge_points:
      - id: kp1
        name: "The 68-95-99.7 percentages"
        key_prerequisites: [z-scores, percentages]
        try_first:
          problem: 'A bell-shaped distribution has mean 100 and standard deviation 10. How many standard deviations above the mean is the value 120?'
          answer_contract: {"kind": "exact"}
          answer: '2'
          reveal: 'The value 120 is 20 above the mean, and one standard deviation is 10, so it lies 2 standard deviations above the mean. The empirical rule gives a percentage for such distances.'
        exemplars:
          - problem: 'The heights of adult men are normally distributed with mean 170 cm and standard deviation 6 cm. What proportion of the heights lie between 164 cm and 176 cm?'
            answer: '0.68'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The endpoints are 170 - 6 = 164 and 170 + 6 = 176, so the interval is the mean plus or minus 1 standard deviation. The empirical rule gives about 68% for it, which is a proportion of 0.68.'
          - problem: 'For a normal distribution, what proportion of the values lie within 2 standard deviations of the mean?'
            answer: '0.95'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The empirical rule says that about 95% of the values of a normal distribution lie within 2 standard deviations of the mean. As a proportion, this is 0.95.'
          - problem: 'Exam scores are normally distributed with mean 100 and standard deviation 15. About how many of 2000 students score between 85 and 115?'
            answer: '1360'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The scores 85 and 115 are 100 - 15 and 100 + 15, so the interval is the mean plus or minus 1 standard deviation, which holds about 68%. Of 2000 students, 0.68 * 2000 = 1360 score in it.'
          - problem: 'A normal distribution has mean 50. The middle 95% of its values lie between 30 and 70. What is the standard deviation?'
            answer: '10'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The middle 95% of a normal distribution lies within 2 standard deviations of the mean. The interval from 30 to 70 has half-width (70 - 30)/2 = 20, so 2 standard deviations equal 20 and the standard deviation is 10.'
          - problem: 'A normal distribution has standard deviation 4. The middle 99.7% of its values lie between 38 and 62. What is the mean?'
            answer: '50'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The middle 99.7% of a normal distribution lies within 3 standard deviations of the mean. The interval is symmetric about the mean, so the mean is the midpoint (38 + 62)/2 = 50.'
          - problem: 'The lengths of bolts are normally distributed with mean 80 mm and standard deviation 0.5 mm. What proportion of the bolts have a length between 78.5 mm and 81.5 mm?'
            answer: '0.997'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The endpoints are 80 - 3 * 0.5 = 78.5 and 80 + 3 * 0.5 = 81.5, so the interval is the mean plus or minus 3 standard deviations. The empirical rule gives about 99.7%, which is a proportion of 0.997.'
          - problem: 'The heights of adult men are normally distributed with mean 170 cm and standard deviation 6 cm. What proportion of the heights lie between 170 cm and 176 cm?'
            answer: '0.34'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The interval from 170 to 176 is the right half of the interval from 164 to 176, which holds about 68%. A normal distribution is symmetric, so half of 0.68 is 0.34.'
          - problem: 'The volume of a bottle from a filling machine is normally distributed with mean 500 ml and standard deviation 4 ml. About what percent of the bottles hold between 492 ml and 508 ml?'
            answer: '95%'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The endpoints are 500 - 2 * 4 = 492 and 500 + 2 * 4 = 508, so the interval is the mean plus or minus 2 standard deviations. The empirical rule gives about 95% of the bottles.'
        constraints: "intervals land exactly on mu +/- 1, 2, or 3 sigma, or on half of such an interval; proportions and percents are asked in natural words; the learner may also find the standard deviation or the mean"
      - id: kp2
        name: "Translating to raw intervals"
        key_prerequisites: [z-scores]
        exemplars:
          - problem: 'Marks out of 10 are normally distributed with mean 6 and standard deviation 1. Between which two marks do the middle 95% of the marks lie?'
            answer: '4, 8'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The middle 95% is the mean plus or minus 2 standard deviations. That gives 6 - 2 * 1 = 4 and 6 + 2 * 1 = 8, so the marks lie between 4 and 8.'
          - problem: 'Race times are normally distributed with mean 60 seconds and standard deviation 5 seconds. Between which two times, in seconds, do the middle 99.7% of the times lie?'
            answer: '45, 75'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The middle 99.7% is the mean plus or minus 3 standard deviations. That gives 60 - 3 * 5 = 45 and 60 + 3 * 5 = 75, so the times lie between 45 and 75 seconds.'
          - problem: 'Marks are normally distributed with mean 70 and standard deviation 5. What is the lowest mark in the middle 95% of the marks?'
            answer: '60'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The middle 95% is the mean plus or minus 2 standard deviations. The lower endpoint is 70 - 2 * 5 = 60.'
          - problem: 'The loaves of a bakery have a normally distributed mass with mean 800 g and standard deviation 20 g. The middle 95% of the loaves have a mass between which two values, in grams?'
            answer: '760, 840'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The middle 95% is the mean plus or minus 2 standard deviations, and 2 * 20 = 40 g. So the masses lie between 800 - 40 = 760 g and 800 + 40 = 840 g.'
          - problem: 'Commute times are normally distributed with mean 50 minutes. The middle 68% of the commute times lie between 44 and 56 minutes. What is the standard deviation?'
            answer: '6'
            answer_contract: {"kind": "unit", "quantity": "time", "unit": "minute", "allow_omitted": true}
            solution_sketch: 'The middle 68% is the mean plus or minus 1 standard deviation. The interval from 44 to 56 has half-width (56 - 44)/2 = 6, so the standard deviation is 6 minutes.'
          - problem: 'The heights of 1000 plants are normally distributed with mean 160 cm and standard deviation 8 cm. Between which two heights, in centimeters, do the middle 68% of the heights lie?'
            answer: '152, 168'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The middle 68% is the mean plus or minus 1 standard deviation. That gives 160 - 8 = 152 and 160 + 8 = 168, so the heights lie between 152 and 168 cm.'
          - problem: 'Times are normally distributed with mean 50 and standard deviation 4. What is the highest time in the middle 99.7% of the times?'
            answer: '62'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The middle 99.7% is the mean plus or minus 3 standard deviations. The upper endpoint is 50 + 3 * 4 = 62.'
          - problem: 'Commute times are normally distributed with mean 35 minutes and standard deviation 6 minutes. What is the shortest commute time that is within 3 standard deviations of the mean?'
            answer: '17'
            answer_contract: {"kind": "unit", "quantity": "time", "unit": "minute", "allow_omitted": true}
            solution_sketch: 'The middle 99.7% is the mean plus or minus 3 standard deviations. The lower endpoint is 35 - 3 * 6 = 17 minutes, so the shortest commute time within 3 standard deviations of the mean is 17 minutes.'
        constraints: "mean and SD are whole numbers; endpoints come out to whole numbers; the learner gives both endpoints, one endpoint or the standard deviation"
      - id: kp3
        name: "Percent outside an interval"
        key_prerequisites: [z-scores, percentages]
        exemplars:
          - problem: 'For a normal distribution, what proportion of the values lie more than 2 standard deviations from the mean?'
            answer: '0.05'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The empirical rule says that 0.95 of the values lie within 2 standard deviations of the mean. The rest lie outside, so the proportion is 1 - 0.95 = 0.05, split between the two tails.'
          - problem: 'The heights of adult men are normally distributed with mean 170 cm and standard deviation 6 cm. What proportion of the heights lie outside the interval from 164 cm to 176 cm?'
            answer: '0.32'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The endpoints 164 and 176 are 170 - 6 and 170 + 6, so the interval holds about 0.68. The proportion outside is 1 - 0.68 = 0.32.'
          - problem: 'The lengths of bolts are normally distributed with mean 80 mm and standard deviation 0.5 mm. A bolt is rejected if it is shorter than 78.5 mm or longer than 81.5 mm. What proportion of the bolts are rejected?'
            answer: '0.003'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The endpoints 78.5 and 81.5 are 3 standard deviations from the mean, so the interval holds about 0.997. The rejected proportion is 1 - 0.997 = 0.003.'
          - problem: 'A factory makes 20000 bulbs. Their lifetimes are normally distributed with mean 1000 hours and standard deviation 50 hours. About how many bulbs last less than 900 hours or more than 1100 hours?'
            answer: '1000'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The lifetimes 900 and 1100 are 1000 - 2 * 50 and 1000 + 2 * 50, so the interval holds about 0.95. The proportion outside is 0.05, and 0.05 * 20000 = 1000 bulbs.'
          - problem: 'For a normal distribution, a symmetric interval about the mean leaves a proportion of 0.05 of the values outside it. How many standard deviations from the mean does this interval extend?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The proportion inside the interval is 1 - 0.05 = 0.95. The empirical rule says that the interval holding 0.95 extends 2 standard deviations from the mean.'
          - problem: 'Battery lifetimes are normally distributed with mean 250 hours and standard deviation 4 hours. A symmetric interval about the mean leaves a proportion of 0.003 of the lifetimes outside it. Between which two lifetimes, in hours, does the interval lie?'
            answer: '238, 262'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The proportion inside is 1 - 0.003 = 0.997, so the interval extends 3 standard deviations each way. That gives 250 - 3 * 4 = 238 and 250 + 3 * 4 = 262.'
          - problem: 'Scores are normally distributed with mean 70. About 32% of the scores lie outside the interval from 55 to 85. What is the standard deviation?'
            answer: '15'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The proportion inside is 1 - 0.32 = 0.68, so the interval is the mean plus or minus 1 standard deviation. The half-width is (85 - 55)/2 = 15, so the standard deviation is 15.'
        constraints: "complements of the 68/95/99.7 intervals only; no tail-splitting yet; proportions and percents are asked in natural words; the learner may also find the number of values, the interval or the standard deviation"
    diagnostic_exemplar:
      problem: 'Times are normal with mean $60$ and SD $5$. What proportion of times lie outside the interval $(50, 70)$?'
      answer: '0.05'
      solution_sketch: '$(50, 70) = \mu \pm 2\sigma$ holds $95\%$; outside: $1 - 0.95 = 0.05$.'
    anki_seeds:
      - front: 'Empirical rule percentages for $\pm 1\sigma$, $\pm 2\sigma$, $\pm 3\sigma$?'
        back: 'About $68\%$, $95\%$, and $99.7\%$.'
        type: basic
      - front: 'Percent of a normal distribution more than $2\sigma$ from the mean?'
        back: 'About $5\%$ ($2.5\%$ in each tail).'
        type: basic

  - id: normal-distribution
    name: "Normal Distribution Reasoning"
    core: true
    difficulty: 0.5
    drill: false
    answer_kind: numeric
    expected_time_secs: 150
    prerequisites:
      - id: empirical-rule
        weight: 0.8
        key: true
      - id: z-scores
        weight: 0.4
        key: false
    knowledge_points:
      - id: kp1
        name: "One-sided areas from symmetry"
        key_prerequisites: [empirical-rule]
        exemplars:
          - problem: 'The heights of adult women in a town are normal with mean $165$ cm and standard deviation $6$ cm. Use the 68-95-99.7 rule to find the proportion of these women who are taller than $177$ cm.'
            answer: '0.025'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The height $177$ is $165+2\cdot 6$, so it lies $2$ standard deviations above the mean. The rule puts $0.05$ outside $\pm 2\sigma$, and symmetry puts half of that, $0.025$, above $177$.'
          - problem: 'Marks on a test (out of $10$) are normal with mean $6.5$ and standard deviation $1$. Use the 68-95-99.7 rule to find the proportion of the marks that are below $5.5$.'
            answer: '0.16'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The mark $5.5$ is $6.5-1$, so it lies one standard deviation below the mean. The rule puts $0.32$ outside $\pm 1\sigma$, and symmetry puts half of that, $0.16$, in the lower tail.'
          - problem: 'Daily high temperatures in a town in July are normal with mean $28$ degrees and standard deviation $2$ degrees. Use the 68-95-99.7 rule to find the proportion of the days that have a high below $30$ degrees.'
            answer: '0.84'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The value $30$ is $28+2$, one standard deviation above the mean. The upper tail beyond it is $0.16$, so the area below it is $1-0.16=0.84$.'
          - problem: 'A rice company fills bags so that the weights are normal with mean $1000$ g and standard deviation $25$ g. Use the 68-95-99.7 rule to find the proportion of the bags that weigh more than $950$ g.'
            answer: '0.975'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The weight $950$ is $1000-2\cdot 25$, two standard deviations below the mean. The lower tail below it is $0.05/2=0.025$, so the proportion above $950$ g is $1-0.025=0.975$.'
          - problem: 'The number of charge cycles of a phone battery is normal with mean $500$ cycles and standard deviation $20$ cycles. Use the 68-95-99.7 rule to find the proportion of the batteries that last more than $440$ cycles.'
            answer: '0.9985'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The value $440$ is $500-3\cdot 20$, three standard deviations below the mean. The rule puts $0.003$ outside $\pm 3\sigma$, so the lower tail is $0.0015$ and the answer is $1-0.0015=0.9985$.'
          - problem: 'The rice company fills a batch of $2000$ bags with weights normal with mean $1000$ g and standard deviation $25$ g. Use the 68-95-99.7 rule to find about how many bags in the batch weigh less than $950$ g.'
            answer: '50'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The weight $950$ is two standard deviations below the mean, so $0.025$ of the bags are lighter. Of $2000$ bags, $0.025\cdot 2000=50$ bags weigh less than $950$ g.'
          - problem: 'Bags of rice are filled with weights normal with mean $1000$ g and standard deviation $25$ g. In one batch, $12$ bags weigh less than $950$ g. Use the 68-95-99.7 rule to find about how many bags are in the batch.'
            answer: '480'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A weight of $950$ g is two standard deviations below the mean, so $0.025$ of the bags are lighter. The $12$ light bags are $0.025$ of the batch, so the batch holds $12/0.025=480$ bags.'
          - problem: 'The waiting time at a walk-in clinic is normal with mean $40$ minutes and standard deviation $6$ minutes. Use the 68-95-99.7 rule to find the proportion of the patients who wait more than $46$ minutes.'
            answer: '0.16'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The time $46$ is $40+6$, one standard deviation above the mean. The area outside $\pm 1\sigma$ is $0.32$, and half of it, $0.16$, lies above $46$ minutes.'
        constraints: "cut points at whole-sigma marks; symmetry halves the tail areas; proportion answers are decimals, counts come from a proportion times a batch size or the reverse"
      - id: kp2
        name: "Combining regions and percentiles"
        key_prerequisites: [empirical-rule]
        exemplars:
          - problem: 'For a normal distribution, use the 68-95-99.7 rule to find the proportion of the values that lie between $\mu - 2\sigma$ and $\mu + \sigma$.'
            answer: '0.815'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Split at the mean. The part from $\mu-2\sigma$ to $\mu$ is half of $0.95$, which is $0.475$, and the part from $\mu$ to $\mu+\sigma$ is half of $0.68$, which is $0.34$. The total is $0.475+0.34=0.815$.'
          - problem: 'A value lies one standard deviation above the mean of a normal distribution. Use the 68-95-99.7 rule to find about what percent of the values are below it.'
            answer: '84%'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Half of the values, $50\%$, are below the mean. Another $34\%$ lie between the mean and one standard deviation above it, so $50+34=84$ percent are below the value.'
          - problem: 'Scores on an aptitude test are normal with mean $100$ and standard deviation $15$. Use the 68-95-99.7 rule to find the proportion of the people who score between $115$ and $145$.'
            answer: '0.1585'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The score $115$ is one standard deviation above the mean and $145$ is three above. From the mean to $145$ lies $0.997/2=0.4985$ and from the mean to $115$ lies $0.34$, so the band holds $0.4985-0.34=0.1585$.'
          - problem: 'Scores on an exam are normal with mean $500$ and standard deviation $100$. A student scores $700$. Use the 68-95-99.7 rule to find what percent of the students score lower.'
            answer: '97.5%'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The score $700$ is two standard deviations above the mean. The rule puts $5\%$ outside $\pm 2\sigma$, so $2.5\%$ lie above $700$, and $100-2.5=97.5$ percent score lower.'
          - problem: 'For a normal distribution, use the 68-95-99.7 rule to find the proportion of the values that lie between $\mu + 2\sigma$ and $\mu + 3\sigma$.'
            answer: '0.0235'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'From the mean to $\mu+3\sigma$ lies $0.997/2=0.4985$ and from the mean to $\mu+2\sigma$ lies $0.95/2=0.475$. The band between them holds $0.4985-0.475=0.0235$.'
          - problem: 'A value of a normal variable lies three standard deviations below the mean. Use the 68-95-99.7 rule to find about what percent of the values are below it.'
            answer: '0.15%'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The rule puts $99.7\%$ within $3$ standard deviations, so $0.3\%$ lie outside. Half of that, $0.15\%$, lies below the value.'
          - problem: 'The lengths of bolts from a machine are normal with mean $80$ mm and standard deviation $0.5$ mm. Use the 68-95-99.7 rule to find the proportion of the bolts that are between $79.5$ mm and $81.5$ mm long.'
            answer: '0.8385'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The length $79.5$ is one standard deviation below the mean and $81.5$ is three above. The part below the mean is $0.34$ and the part above it is $0.4985$, so the total is $0.34+0.4985=0.8385$.'
          - problem: 'Reaction times in a large group are normal with mean $250$ ms and standard deviation $20$ ms. In the group, $34$ people have a reaction time between $250$ ms and $270$ ms. Use the 68-95-99.7 rule to find about how many people are in the group.'
            answer: '100'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The time $270$ is one standard deviation above the mean, so the band from $250$ to $270$ holds $0.34$ of the group. Then $34$ people are $0.34$ of the group, and the group has $34/0.34=100$ people.'
        constraints: "asymmetric intervals with whole-sigma endpoints; answers come from 68/95/99.7 arithmetic; proportions are decimals and percentiles are percent numbers"
      - id: kp3
        name: "Comparing values across distributions"
        key_prerequisites: [z-scores, empirical-rule]
        exemplars:
          - problem: 'Test A (out of $10$) is normal with mean $7$ and standard deviation $0.5$. Test B is normal with mean $6$ and standard deviation $1$. Kim scored $8$ on test A and $7.5$ on test B. On which test did Kim do relatively better?'
            answer: 'test A'
            answer_contract: {"kind": "label", "options": [["test A", "A", "on test A", "Kim did better on test A"], ["test B", "B", "on test B", "Kim did better on test B"]]}
            solution_sketch: 'On test A the z-score is $(8-7)/0.5=2$. On test B the z-score is $(7.5-6)/1=1.5$. The larger z-score is on test A, so Kim did relatively better on test A.'
          - problem: 'A mark of $84$ comes from a normal distribution with mean $75$ and standard deviation $6$. A mark of $60$ comes from a normal distribution with mean $50$ and standard deviation $5$. How many standard deviations from its own mean is the more unusual of the two marks?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The mark $84$ has z-score $(84-75)/6=1.5$. The mark $60$ has z-score $(60-50)/5=2$. The larger distance is $2$ standard deviations.'
          - problem: 'In science, scores are normal with mean $40$ and standard deviation $8$. In history, scores are normal with mean $70$ and standard deviation $6$. Ana scored $52$ in science. What score in history stands equally far above the mean?'
            answer: '79'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The science score $52$ has z-score $(52-40)/8=1.5$. The equal standing in history is $70+1.5\cdot 6=79$.'
          - problem: 'A value lies $3$ standard deviations above the mean of a normal distribution. Use the 68-95-99.7 rule to find what percent of the values are below it.'
            answer: '99.85%'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The rule puts $0.3\%$ outside $\pm 3\sigma$, so $0.15\%$ lie above the value. Then $100-0.15=99.85$ percent are below it.'
          - problem: 'Jo jumps $5.2$ m in the long jump, where jumps are normal with mean $4.6$ m and standard deviation $0.3$ m. Lee jumps $1.85$ m in the high jump, where jumps are normal with mean $1.60$ m and standard deviation $0.10$ m. Which athlete has the more outstanding result for their event?'
            answer: 'Lee'
            answer_contract: {"kind": "label", "options": [["Lee", "Lee did", "Lee has the more outstanding result", "Lee is more outstanding"], ["Jo", "Jo did", "Jo has the more outstanding result", "Jo is more outstanding"]]}
            solution_sketch: 'Jo has z-score $(5.2-4.6)/0.3=2$. Lee has z-score $(1.85-1.60)/0.10=2.5$. The larger z-score is Lee''s, so Lee has the more outstanding result.'
          - problem: 'Test X has scores that are normal with mean $60$ and standard deviation $8$. Nia scored $76$ on test X. Test Y has scores that are normal with mean $70$ and standard deviation $5$. What score on test Y gives Nia the same standing?'
            answer: '80'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Nia''s z-score on test X is $(76-60)/8=2$. The same z-score on test Y is a score of $70+2\cdot 5=80$.'
          - problem: 'Scores on a test are normal with mean $500$ and standard deviation $50$. How many standard deviations below the mean is a score of $410$?'
            answer: '1.8'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The score is $500-410=90$ below the mean. Divide by the standard deviation: $90/50=1.8$ standard deviations.'
        constraints: "z-scores are halves, tenths or whole numbers; comparisons are decided by the larger |z|; at most two verdict items"
    diagnostic_exemplar:
      problem: 'Marks (out of $10$) are normal with mean $6.5$ and SD $1$. Use the 68-95-99.7 rule to find the proportion of marks that fall between $4.5$ and $7.5$.'
      answer: '0.815'
      solution_sketch: '$\mu - 2\sigma$ to $\mu + \sigma$: $0.95/2 + 0.68/2 = 0.475 + 0.34 = 0.815$.'
    anki_seeds:
      - front: 'What fraction of a normal distribution lies above $\mu + 2\sigma$?'
        back: 'About $2.5\%$.'
        type: basic
      - front: 'A value at $\mu + \sigma$ sits at approximately which percentile?'
        back: 'The 84th ($50\% + 34\%$ below it).'
        type: basic

  - id: standard-error
    name: "Standard Error of the Sample Mean"
    core: true
    difficulty: 0.5
    drill: false
    answer_kind: numeric
    expected_time_secs: 120
    prerequisites:
      - id: variance-standard-deviation
        weight: 0.7
        key: true
      - id: square-roots
        weight: 0.4
        key: false
    knowledge_points:
      - id: kp1
        name: "Computing SE = sigma over root n"
        key_prerequisites: [variance-standard-deviation, square-roots]
        exemplars:
          - problem: 'A population has standard deviation $\sigma = 12$. For samples of size $n = 9$, what is the standard error of the sample mean?'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The standard error is $\sigma/\sqrt{n}$. Here $\sqrt{9}=3$, so the standard error is $12/3=4$.'
          - problem: 'The masses of eggs from a farm have standard deviation $6$ g. A carton holds $16$ eggs. What is the standard error of the mean mass of the eggs in a carton?'
            answer: '1.5'
            answer_contract: {"kind": "unit", "quantity": "mass", "unit": "g", "allow_omitted": true}
            solution_sketch: 'The standard error is $\sigma/\sqrt{n}$ with $\sqrt{16}=4$. So the standard error is $6/4=1.5$ g.'
          - problem: 'A population has standard deviation $\sigma = 15$. Find the standard error of the sample mean for samples of size $n = 25$.'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The standard error of a sample mean is $\sigma/\sqrt{n}=15/\sqrt{25}$. Since $\sqrt{25}=5$, the result is $15/5=3$.'
          - problem: 'A population has variance $49$. What is the standard error of the sample mean for samples of size $4$?'
            answer: '3.5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The standard deviation is the square root of the variance, $\sqrt{49}=7$. Then the standard error is $7/\sqrt{4}=7/2=3.5$.'
          - problem: 'A delivery firm has delivery times with standard deviation $14$ minutes. The firm looks at the mean time of $49$ deliveries. What is the standard error of that mean?'
            answer: '2'
            answer_contract: {"kind": "unit", "quantity": "time", "unit": "min", "allow_omitted": true}
            solution_sketch: 'The standard error of the mean time is $14/\sqrt{49}$. Since $\sqrt{49}=7$, it is $14/7=2$ minutes.'
          - problem: 'A population has mean $40$ and standard deviation $10$. What is the standard error of the sample mean for samples of size $25$?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Only the standard deviation and the sample size enter the formula. The standard error is $10/\sqrt{25}=10/5=2$, and the mean $40$ does not change it.'
          - problem: 'A population has variance $144$. Find the standard error of the sample mean for samples of size $36$.'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The standard deviation is the square root of the variance, $\sqrt{144}=12$. The standard error is $12/\sqrt{36}=12/6=2$.'
        constraints: "n a perfect square; sigma given directly or as a variance with a perfect-square value; one measured context with units"
      - id: kp2
        name: "Averages vary less than individuals"
        key_prerequisites: [variance-standard-deviation]
        exemplars:
          - problem: 'A single observation from a population has standard deviation $18$. What is the standard deviation of the mean of $36$ observations?'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The mean of $36$ observations has standard deviation $18/\sqrt{36}=18/6=3$. This is much smaller than the $18$ of a single observation.'
          - problem: 'One roll of a die has standard deviation $\sigma$. The average of $100$ rolls has a standard deviation how many times smaller than $\sigma$?'
            answer: '10'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Averaging $n$ values divides the spread by $\sqrt{n}$. Here $\sqrt{100}=10$, so the average of $100$ rolls is $10$ times less spread out.'
          - problem: 'A population has standard deviation $20$. What is the standard error of the mean of $100$ observations?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The standard error is $20/\sqrt{100}=20/10=2$. It is far tighter than the $20$ of single observations.'
          - problem: 'A single observation has standard deviation $24$. The standard deviation of the mean of $36$ observations is how many times smaller than $24$?'
            answer: '6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The mean of $36$ observations has standard deviation $24/\sqrt{36}=24/6=4$. That is $24/4=6$ times smaller.'
          - problem: 'A machine produces parts with standard deviation $40$ g. What is the standard error of the mean mass of a sample of $64$ parts?'
            answer: '5'
            answer_contract: {"kind": "unit", "quantity": "mass", "unit": "g", "allow_omitted": true}
            solution_sketch: 'The standard error is $40/\sqrt{64}=40/8=5$ g. This is much smaller than the $40$ g of a single part.'
          - problem: 'A bakery sells loaves whose masses have standard deviation $12$ g. Which varies more: the mass of one loaf, or the mean mass of $9$ loaves?'
            answer: 'one loaf'
            answer_contract: {"kind": "label", "options": [["one loaf", "a single loaf", "single loaf", "the mass of one loaf", "one loaf varies more", "the mass of one loaf varies more"], ["the mean", "mean of 9 loaves", "the mean mass of 9 loaves", "the average"]]}
            solution_sketch: 'A single loaf varies with standard deviation $12$ g. The mean of $9$ loaves varies with standard deviation $12/\sqrt{9}=4$ g, so the mass of one loaf varies more.'
          - problem: 'A population has standard deviation $9$. What is the standard error of the mean of $81$ observations?'
            answer: '1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The standard error is $9/\sqrt{81}=9/9=1$. The mean of $81$ values is nine times less spread out than one value.'
        constraints: "n a perfect square; one shrink-factor item and one single-versus-mean verdict"
      - id: kp3
        name: "How sample size changes the SE"
        key_prerequisites: [variance-standard-deviation, square-roots]
        exemplars:
          - problem: 'The standard error of a sample mean is $6$ when the sample size is $n$. What is the standard error when the sample size is $4n$?'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The standard error is proportional to $1/\sqrt{n}$. Quadrupling $n$ divides it by $\sqrt{4}=2$, so the new standard error is $6/2=3$.'
          - problem: 'A population has standard deviation $20$. What sample size makes the standard error of the sample mean equal to $5$?'
            answer: '16'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The standard error formula gives $20/\sqrt{n}=5$. Then $\sqrt{n}=20/5=4$, so the sample size is $n=16$.'
          - problem: 'A laboratory instrument gives readings with standard deviation $12$ mg. How many readings must be averaged so that the standard error of the mean is $2$ mg?'
            answer: '36'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The standard error formula gives $12/\sqrt{n}=2$. Then $\sqrt{n}=12/2=6$, so the instrument needs $n=36$ readings.'
          - problem: 'The standard error of a sample mean is $2$. By what factor must the sample size be multiplied to make the standard error $1$?'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Halving the standard error needs $\sqrt{n}$ to double. So $n$ must be multiplied by $2^2=4$.'
          - problem: 'The standard error of a sample mean is $8$ when the sample size is $n$. What is it when the sample size is $16n$?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The standard error is proportional to $1/\sqrt{n}$. With $16n$ it is divided by $\sqrt{16}=4$, so it becomes $8/4=2$.'
          - problem: 'A population has standard deviation $45$. What sample size gives a standard error of $5$?'
            answer: '81'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The standard error formula gives $45/\sqrt{n}=5$. Then $\sqrt{n}=45/5=9$, so the sample size is $n=81$.'
          - problem: 'A survey of $100$ people has a standard error of $3$ points for its mean score. How many people must be surveyed to make the standard error $1$ point?'
            answer: '900'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The standard error must fall by the factor $3$. This needs $\sqrt{n}$ to grow by the factor $3$, so $n$ grows by $3^2=9$ and the survey needs $9\cdot 100=900$ people.'
          - problem: 'Maria measures a quantity with standard deviation $30$. Her sample of $36$ measurements gives a mean with some standard error. She adds measurements until the standard error is $3$. How many measurements does she have in total?'
            answer: '100'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The standard error formula gives $30/\sqrt{n}=3$. Then $\sqrt{n}=30/3=10$, so she needs $n=100$ measurements in total.'
        constraints: "n and the target SE chosen so that sqrt(n) is a whole number; items multiply a sample size by a square or solve for n"
    diagnostic_exemplar:
      problem: 'A population has $\sigma = 18$. What sample size makes the standard error of the sample mean equal to $3$?'
      answer: '36'
      solution_sketch: '$18/\sqrt{n} = 3$ gives $\sqrt{n} = 6$, so $n = 36$.'
    anki_seeds:
      - front: 'Standard error of the sample mean?'
        back: '$\operatorname{SE} = \dfrac{\sigma}{\sqrt{n}}$.'
        type: basic
      - front: 'To cut the standard error in half, multiply the sample size by {{c1::4}}.'
        back: '4'
        type: cloze

  - id: sampling-distributions
    name: "Sampling Distributions & the CLT"
    core: true
    difficulty: 0.55
    drill: false
    answer_kind: multi-step
    expected_time_secs: 180
    prerequisites:
      - id: standard-error
        weight: 0.7
        key: true
      - id: normal-distribution
        weight: 0.7
        key: true
    knowledge_points:
      - id: kp1
        name: "The Central Limit Theorem"
        key_prerequisites: [normal-distribution]
        exemplars:
          - problem: 'The weights of parcels handled by a depot have a skewed distribution with a long right tail. A clerk takes many random samples of $100$ parcels and finds the mean weight of each sample. Is the distribution of these sample means approximately normal?'
            answer: 'yes'
            answer_contract: {"kind": "label", "options": [["yes", "it is approximately normal", "approximately normal", "normal"], ["no", "it is not normal", "not normal", "skewed"]]}
            solution_sketch: 'The sample size $100$ is above the usual threshold of $30$. By the central limit theorem the sample means are then approximately normal, even though the parcel weights are skewed.'
          - problem: 'Daily sales of a shop have a right-skewed distribution with standard deviation $40$. Samples of $64$ days are taken at random. What is the standard deviation of the distribution of the sample mean?'
            answer: '5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Since $64$ is above $30$, the sample mean is approximately normal. Its standard deviation is the standard error $40/\sqrt{64}=40/8=5$.'
          - problem: 'A population has a skewed distribution with mean $80$ and standard deviation $24$. Samples of $36$ are taken at random. Between which two values do about $95\%$ of the sample means lie?'
            answer: '72, 88'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The sample means are approximately normal with mean $80$ and standard error $24/\sqrt{36}=4$. About $95\%$ lie within $2$ standard errors, so between $80-8=72$ and $80+8=88$.'
          - problem: 'A population has a skewed distribution with standard deviation $40$. A researcher wants the standard deviation of the sample mean to be $5$. How many observations must each sample contain?'
            answer: '64'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Set $40/\sqrt{n}=5$. Then $\sqrt{n}=40/5=8$, so $n=64$, which is also large enough for the central limit theorem.'
          - problem: 'Many textbooks say that the sample mean of a skewed population is approximately normal once the sample size reaches a certain number of observations. What is that number?'
            answer: '30'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The usual rule of thumb for the central limit theorem is a sample size of $30$ or more. Below $30$, a skewed population can leave the distribution of the sample mean skewed.'
          - problem: 'A researcher draws samples of only $3$ observations from a strongly skewed population. Is it safe to treat the distribution of the sample mean as approximately normal?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["no", "it is not safe", "not safe", "not normal"], ["yes", "it is safe", "safe", "normal"]]}
            solution_sketch: 'The sample size $3$ is far below the usual threshold of $30$. The central limit theorem does not apply at this size, so the sample mean can stay skewed.'
          - problem: 'The commute distances of workers in a city have a long right tail with mean $45$ km and standard deviation $27$ km. Samples of $81$ workers are taken. What is the standard error of the sample mean, in km?'
            answer: '3'
            answer_contract: {"kind": "unit", "quantity": "length", "unit": "km", "allow_omitted": true}
            solution_sketch: 'The sample size $81$ is above $30$, so the sample mean is approximately normal around $45$ km. Its standard error is $27/\sqrt{81}=27/9=3$ km.'
        constraints: "skewed or unknown populations with n above or below 30; conceptual verdicts and one-number results about the sample mean; at most two verdict items"
      - id: kp2
        name: "Probabilities for the sample mean"
        key_prerequisites: [normal-distribution, standard-error]
        exemplars:
          - problem: 'Scores on a test have mean $100$ and standard deviation $15$. A random sample of $25$ students is taken. Use the 68-95-99.7 rule to find the probability that the mean score of the sample is between $97$ and $103$.'
            answer: '0.68'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The standard error is $15/\sqrt{25}=3$. The interval $97$ to $103$ is the mean plus or minus one standard error, so the probability is $0.68$.'
          - problem: 'A dairy fills bottles with mean volume $250$ mL and standard deviation $20$ mL. A random sample of $25$ bottles is taken. Use the 68-95-99.7 rule to find the probability that the mean volume of the sample is less than $258$ mL.'
            answer: '0.975'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The standard error is $20/\sqrt{25}=4$, and $258=250+2\cdot 4$. The area below two standard errors above the mean is $0.5+0.475=0.975$.'
          - problem: 'A population has mean $150$ and standard deviation $10$. For random samples of size $25$, use the 68-95-99.7 rule to find the probability that the sample mean is less than $148$.'
            answer: '0.16'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The standard error is $10/\sqrt{25}=2$, and $148=150-2$ is one standard error below the mean. The lower tail beyond it is $0.16$.'
          - problem: 'The daily usage of a machine has mean $400$ and standard deviation $30$ units. A random sample of $100$ days is taken. Use the 68-95-99.7 rule to find the probability that the mean usage of the sample is between $394$ and $406$ units.'
            answer: '0.95'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The standard error is $30/\sqrt{100}=3$. The interval $394$ to $406$ is the mean plus or minus $2$ standard errors, so the probability is $0.95$.'
          - problem: 'A population has mean $75$ and standard deviation $27$. For random samples of size $81$, use the 68-95-99.7 rule to find the probability that the sample mean is either less than $66$ or greater than $84$.'
            answer: '0.003'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The standard error is $27/\sqrt{81}=3$. The values $66$ and $84$ are $3$ standard errors from the mean, and the two tails together hold $0.003$.'
          - problem: 'A population has mean $120$ and standard deviation $18$. For random samples of size $9$, use the 68-95-99.7 rule to find the probability that the sample mean is less than $126$.'
            answer: '0.84'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The standard error is $18/\sqrt{9}=6$, and $126$ is one standard error above the mean. The area below it is $0.5+0.34=0.84$.'
          - problem: 'Bags of flour have mean mass $1000$ g and standard deviation $25$ g. Samples of $25$ bags are taken on $400$ different days. Use the 68-95-99.7 rule to find on about how many of those days the mean mass of the sample is above $1010$ g.'
            answer: '10'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The standard error is $25/\sqrt{25}=5$, and $1010$ is $2$ standard errors above the mean. The upper tail is $0.025$, so about $0.025\cdot 400=10$ days.'
        constraints: "cut points at whole multiples of the standard error; answers use the 68-95-99.7 rule only; one count-from-a-probability item"
      - id: kp3
        name: "Is a sample mean surprising?"
        key_prerequisites: [normal-distribution, standard-error]
        exemplars:
          - problem: 'The lengths of bolts from a factory have mean $200$ mm and standard deviation $30$ mm. A sample of $36$ bolts has mean length $212$ mm. How many standard errors above the population mean is the sample mean?'
            answer: '12/5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The standard error is $30/\sqrt{36}=5$. The sample mean is $212-200=12$ above the mean, which is $12/5=2.4$ standard errors.'
          - problem: 'A population has mean $150$ and standard deviation $20$. A sample of $25$ has mean $142$. A sample mean is called unusual when it lies more than $2$ standard errors from the population mean. Is this sample mean unusual?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["no", "it is not unusual", "not unusual", "usual"], ["yes", "it is unusual", "unusual"]]}
            solution_sketch: 'The standard error is $20/\sqrt{25}=4$. The sample mean is $(142-150)/4=-2$, exactly $2$ standard errors away, which is not more than $2$, so it is not unusual.'
          - problem: 'A factory fills bottles with mean volume $400$ mL and standard deviation $16$ mL. A sample of $100$ bottles has mean volume $406$ mL. The plant flags a sample mean only when it lies more than $3$ standard errors from $400$ mL. Does the plant flag this sample?'
            answer: 'yes'
            answer_contract: {"kind": "label", "options": [["yes", "it is flagged", "flagged"], ["no", "it is not flagged", "not flagged"]]}
            solution_sketch: 'The standard error is $16/\sqrt{100}=1.6$. The sample mean is $(406-400)/1.6=3.75$ standard errors from $400$ mL, which is more than $3$, so the plant flags it.'
          - problem: 'An exam has mean score $72$ and standard deviation $9$. A random sample of $36$ students has mean score $70.2$. How many standard errors below the population mean is the sample mean?'
            answer: '6/5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The standard error is $9/\sqrt{36}=1.5$. The sample mean is $72-70.2=1.8$ below the mean, which is $1.8/1.5=6/5=1.2$ standard errors.'
          - problem: 'A population has mean $120$ and standard deviation $18$. A sample of $36$ is taken. What sample mean lies exactly $2$ standard errors above the population mean?'
            answer: '126'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The standard error is $18/\sqrt{36}=3$. Two standard errors are $6$, so the value is $120+6=126$.'
          - problem: 'A population has mean $64$ and standard deviation $10$. A sample of $25$ is taken. What sample mean lies exactly $2.5$ standard errors below the population mean?'
            answer: '59'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The standard error is $10/\sqrt{25}=2$. Then $2.5$ standard errors are $5$, so the sample mean is $64-5=59$.'
          - problem: 'A population has mean $60$ and standard deviation $20$. A sample mean of $64$ lies exactly $2$ standard errors above the population mean. How large is the sample?'
            answer: '100'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The gap $64-60=4$ equals $2$ standard errors, so the standard error is $2$. Then $20/\sqrt{n}=2$ gives $\sqrt{n}=10$ and $n=100$.'
        constraints: "judgments quoted in standard errors from the mean; thresholds at 2 and 3 standard errors; at most two verdict items with different correct options"
    diagnostic_exemplar:
      problem: 'A population has $\mu = 80$, $\sigma = 12$. A sample of $n = 9$ gives $\bar{x} = 89$. Compute the SE, state how many SEs above $\mu$ this is, and say whether the result is surprising.'
      answer: '$\operatorname{SE} = 4$; $\bar{x}$ is $2.25$ SEs above $\mu$ — surprising: beyond $2$ SEs, outside the middle $95\%$.'
      solution_sketch: '$\operatorname{SE} = 12/\sqrt{9} = 4$; $(89 - 80)/4 = 2.25 > 2$.'
    anki_seeds:
      - front: 'Central Limit Theorem (informal)?'
        back: 'For large $n$, the sampling distribution of $\bar{x}$ is approximately normal, whatever the population''s shape.'
        type: basic
      - front: 'A sample mean more than $2$ SEs from $\mu$ happens about how often?'
        back: 'About $5\%$ of the time — conventionally "surprising".'
        type: basic

  - id: sample-proportions
    name: "Sampling Distribution of a Proportion"
    core: false                # feeds only the supplemental one-proportion-z-test (re-audit R-24); no core material builds on it
    difficulty: 0.55
    drill: false
    answer_kind: numeric
    expected_time_secs: 150
    prerequisites:
      - id: sampling-distributions
        weight: 0.7
        key: true
      - id: binomial-distribution
        weight: 0.4
        key: false
    knowledge_points:
      - id: kp1
        name: "The sample proportion and its mean"
        key_prerequisites: [sampling-distributions]
        exemplars:
          - problem: 'In a poll of $90$ voters, $54$ support a measure. What is the sample proportion $\hat{p}$ of supporters?'
            answer: '3/5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The sample proportion is the number of supporters divided by the sample size. So $\hat{p}=54/90=3/5$.'
          - problem: 'In a city, $3/5$ of the voters support a measure. Many random samples of $90$ voters are taken, and $\hat{p}$ is found for each sample. What is the mean of these values of $\hat{p}$?'
            answer: '3/5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The sample proportion is an unbiased estimate, so the mean of $\hat{p}$ equals the population proportion $p$. Here that mean is $3/5$.'
          - problem: 'In a survey of $80$ customers, $20$ prefer a new design. What is the sample proportion of customers who prefer it?'
            answer: '1/4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The sample proportion is the successes divided by $n$. With $20$ of $80$ customers, $\hat{p}=20/80=1/4$.'
          - problem: 'A coin is tossed $50$ times and lands heads $31$ times. What is the sample proportion of heads?'
            answer: '31/50'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The sample proportion of heads is the count of heads divided by the number of tosses. So $\hat{p}=31/50=0.62$.'
          - problem: 'A sample has $120$ observations and the sample proportion is $\hat{p}=5/6$. How many successes were in the sample?'
            answer: '100'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Since $\hat{p}$ is successes divided by $n$, the number of successes is $n\hat{p}$. Here $120\cdot 5/6=100$.'
          - problem: 'In a sample of $200$ registered voters, the proportion who support a proposal is $3/20$. How many supporters are in the sample?'
            answer: '30'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The number of supporters is the sample size times the sample proportion. So $200\cdot 3/20=30$ supporters.'
          - problem: 'In a sample, $45$ people are left-handed, and the sample proportion of left-handed people is $0.15$. How many people are in the sample?'
            answer: '300'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The sample proportion is the count divided by the sample size, so $n=45/0.15$. This gives $n=300$ people.'
          - problem: 'In a country, $12\%$ of the people are left-handed. About how many left-handed people do you expect in a random sample of $250$ people?'
            answer: '30'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The mean of the sample proportion is $p=0.12$. So the expected count is $0.12\cdot 250=30$ left-handed people.'
        constraints: "counts divide evenly; p a simple fraction or a whole percent; items find a proportion, a count, or a sample size"
      - id: kp2
        name: "Standard error of p-hat"
        key_prerequisites: [sampling-distributions]
        exemplars:
          - problem: 'A fair coin is tossed $25$ times, and the proportion of heads is recorded. The proportion varies from one set of $25$ tosses to another. What is the standard error of the sample proportion?'
            answer: '1/10'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'For a fair coin $p=1/2$, so $p(1-p)=1/4$. The standard error is $\sqrt{(1/4)/25}=\sqrt{1/100}=1/10$.'
          - problem: 'In a town, $1/5$ of the households own a boat. A survey asks $100$ households at random. What is the standard error of the sample proportion of boat owners?'
            answer: '1/25'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Here $p(1-p)=(1/5)(4/5)=4/25$, so the variance of the sample proportion is $(4/25)/100$. The standard error is $\sqrt{(4/25)/100}=(2/5)/10=1/25$.'
          - problem: 'A factory produces light bulbs, and $3/4$ of them pass inspection. An inspector tests $12$ bulbs and records the proportion that pass. What is the standard error of the sample proportion?'
            answer: '1/8'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Here $p(1-p)=(3/4)(1/4)=3/16$, and $(3/16)/12=1/64$ is the variance of the sample proportion. The standard error is $\sqrt{1/64}=1/8$.'
          - problem: 'A fair coin is tossed $36$ times, and the proportion of heads is recorded. What is the standard error of the sample proportion?'
            answer: '1/12'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'For a fair coin $p(1-p)=1/4$, and $(1/4)/36=1/144$. The standard error is $\sqrt{1/144}=1/12$.'
          - problem: 'A pollster studies a population with proportion $p = 1/3$ and wants the sample proportion to have a standard error of $1/18$. What sample size does the pollster need?'
            answer: '72'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Here $p(1-p)=(1/3)(2/3)=2/9$. Squaring both sides of $\sqrt{(2/9)/n}=1/18$ gives $(2/9)/n=1/324$, so the sample size is $n=2\cdot 324/9=72$.'
          - problem: 'A sample of $18$ draws from a population with unknown proportion $p$ has a standard error of $1/9$ for the sample proportion, and $p$ is greater than $1/2$. What is $p$?'
            answer: '2/3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Squaring $\sqrt{p(1-p)/18}=1/9$ gives $p(1-p)=18/81=2/9$. Then $9p^2-9p+2=0$ factors as $(3p-1)(3p-2)=0$, so $p=1/3$ or $p=2/3$, and $p>1/2$ gives $2/3$.'
          - problem: 'In a poll, half of a large population favors a plan. The pollster asks $400$ people at random. What is the standard error of the sample proportion?'
            answer: '1/40'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'With $p=1/2$ we get $p(1-p)=1/4$ for the sample of $400$ people. The standard error is $\sqrt{(1/4)/400}=\sqrt{1/1600}=1/40$.'
        constraints: "p(1-p)/n is a perfect square of a fraction; answers are exact fractions; items find the standard error, n or p"
      - id: kp3
        name: "Empirical rule for p-hat"
        key_prerequisites: [sampling-distributions]
        exemplars:
          - problem: 'A fair coin is tossed $100$ times. Use the 68-95-99.7 rule to find the probability that the proportion of heads is between $0.45$ and $0.55$.'
            answer: '0.68'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The standard error is $\sqrt{0.5\cdot 0.5/100}=0.05$. The interval $0.45$ to $0.55$ is $p$ plus or minus one standard error, so the probability is $0.68$.'
          - problem: 'In a large population the proportion is $p = 0.2$. A sample of $n = 100$ is taken. Use the 68-95-99.7 rule to find the probability that the sample proportion lies between $0.12$ and $0.28$.'
            answer: '0.95'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The standard error is $\sqrt{0.2\cdot 0.8/100}=0.04$. The interval $0.12$ to $0.28$ is $p$ plus or minus $2$ standard errors, so the probability is $0.95$.'
          - problem: 'A machine produces parts, $90\%$ of which are good. A sample of $100$ parts is checked. Use the 68-95-99.7 rule to find the probability that the proportion of good parts in the sample lies between $0.81$ and $0.99$.'
            answer: '0.997'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The standard error is $\sqrt{0.9\cdot 0.1/100}=0.03$. The interval $0.81$ to $0.99$ is $p$ plus or minus $3$ standard errors, so the probability is $0.997$.'
          - problem: 'A machine produces parts, $90\%$ of which are good. A sample of $100$ parts is checked. Use the 68-95-99.7 rule to find the probability that more than $96\%$ of the parts in the sample are good.'
            answer: '0.025'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The standard error is $0.03$, and $0.96=0.90+2\cdot 0.03$. About $95\%$ lie within $2$ standard errors, so $0.025$ lies in the upper tail.'
          - problem: 'In a large population the proportion is $p = 0.2$. A sample of $n = 25$ has sample proportion $\hat{p}=0.36$. How many standard errors above $p$ is $\hat{p}$?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The standard error is $\sqrt{0.2\cdot 0.8/25}=0.08$. The distance from $p$ is $0.36-0.20=0.16$, and $0.16/0.08=2$ standard errors.'
          - problem: 'A fair coin is tossed $25$ times and lands heads $20$ times. How many standard errors above the expected proportion of heads is the observed proportion?'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The standard error is $\sqrt{0.5\cdot 0.5/25}=0.1$. The observed proportion is $20/25=0.8$, which is $0.3$ above $0.5$, so $0.3/0.1=3$ standard errors.'
          - problem: 'A factory makes parts, $90\%$ of which are good. A sample of $100$ parts is checked on each of $1000$ days. Use the 68-95-99.7 rule to find on about how many of those days the sample has fewer than $84\%$ good parts.'
            answer: '25'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The standard error is $0.03$, and $0.84=0.90-2\cdot 0.03$. The lower tail beyond $2$ standard errors is $0.025$, so about $0.025\cdot 1000=25$ days.'
          - problem: 'Half of a large population favors a plan. A pollster wants a $95\%$ chance that the sample proportion lies within $0.05$ of the true proportion. Use the 68-95-99.7 rule to find how large the sample must be.'
            answer: '400'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A $95\%$ chance means $2$ standard errors, so $2\cdot\text{SE}=0.05$ and the standard error is $0.025$. Then $\sqrt{0.25/n}=0.025$ gives $n=0.25/0.000625=400$.'
        constraints: "cut points at whole multiples of the standard error; answers are probabilities from the 68-95-99.7 rule, counts of standard errors, expected counts, or a sample size"
    diagnostic_exemplar:
      problem: 'With $p = 1/2$ and $n = 100$, use the empirical rule to find $P(0.40 \le \hat{p} \le 0.60)$.'
      answer: '0.95'
      solution_sketch: '$\operatorname{SE} = \sqrt{(1/4)/100} = 1/20$; $0.40$-$0.60$ is $p \pm 2$ SEs: $0.95$.'
    anki_seeds:
      - front: 'Standard error of a sample proportion?'
        back: '$\operatorname{SE}(\hat{p}) = \sqrt{\dfrac{p(1-p)}{n}}$.'
        type: basic
      - front: 'Mean of the sampling distribution of $\hat{p}$?'
        back: '$p$ — the sample proportion is an unbiased estimator.'
        type: basic

  - id: margin-of-error
    name: "Margin of Error"
    core: false                # terminal inference destination
    difficulty: 0.5
    drill: false
    answer_kind: numeric
    expected_time_secs: 120
    prerequisites:
      - id: standard-error
        weight: 0.7
        key: true
      - id: empirical-rule
        weight: 0.4
        key: false
    knowledge_points:
      - id: kp1
        name: "Estimate plus-or-minus ME as an interval"
        key_prerequisites: [standard-error]
        exemplars:
          - problem: 'A survey reports a mean commute time of $41$ minutes with a margin of error of $5$ minutes. Between which two times does the survey place the true mean commute time?'
            answer: '36, 46'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The estimate is the middle of the interval, and the margin of error is the distance from the middle to each end. The lower end is $41 - 5 = 36$ and the upper end is $41 + 5 = 46$. The interval runs from 36 to 46 minutes.'
          - problem: 'A poll reports that $46\%$ of voters support a new bus route, with a margin of error of $3$ percentage points. What is the highest level of support that the poll allows for?'
            answer: '49%'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The upper end of the interval is the estimate plus the margin of error. Here $46 + 3 = 49$, so support could be as high as 49%.'
          - problem: 'A sample of $80$ repair jobs gives an interval from $238$ to $262$ minutes for the mean repair time. What margin of error was reported?'
            answer: '12'
            answer_contract: {"kind": "unit", "quantity": "time", "unit": "min", "allow_omitted": true}
            solution_sketch: 'The margin of error is the distance from the middle of the interval to either end, so it is half the width. The width is $262 - 238 = 24$, and half of 24 is 12. The margin of error is 12 minutes.'
          - problem: 'The interval $\bar{x} \pm \text{ME}$ has $\bar{x} = 62$ and $\text{ME} = 5$. Write the interval from its lower endpoint to its upper endpoint.'
            answer: '57, 67'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The lower endpoint is $62 - 5 = 57$ and the upper endpoint is $62 + 5 = 67$. The interval runs from 57 to 67.'
          - problem: 'A quality check gives the interval $96$ to $112$ milliliters for the mean fill of juice cartons. What sample mean gave this interval?'
            answer: '104'
            answer_contract: {"kind": "unit", "quantity": "volume", "unit": "ml", "allow_omitted": true}
            solution_sketch: 'The sample mean is the middle of the interval, halfway between its two ends. The middle is $(96 + 112)/2 = 104$. The sample mean is 104 milliliters.'
          - problem: 'Sam says that an estimate of $72$ with a margin of error of $4$ gives the interval from $68$ to $72$. What is the correct interval?'
            answer: '68, 76'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The margin of error is added on one side and taken away on the other, because the estimate sits in the middle. So the lower end is $72 - 4 = 68$ and the upper end is $72 + 4 = 76$. Sam forgot to add the margin for the upper end.'
          - problem: 'A shop estimates that it serves $210$ customers on an average day, with a margin of error of $15$ customers. How wide is the interval of plausible averages?'
            answer: '30'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The interval goes $15$ below the estimate and $15$ above it, so its width is twice the margin of error. The width is $2 \times 15 = 30$ customers.'
          - problem: 'A sleep study finds a mean sleep time of $7.4$ hours with a margin of error of $0.6$ hours. Between which two numbers of hours does the mean lie?'
            answer: '6.8, 8'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The lower end is $7.4 - 0.6 = 6.8$ and the upper end is $7.4 + 0.6 = 8.0$. The mean lies between 6.8 and 8 hours.'
        constraints: "integer or one-decimal estimates and margins; endpoints, width, margin and estimate in turn; polls and measured means"
      - id: kp2
        name: "ME = 2 SE for 95% confidence"
        key_prerequisites: [standard-error, empirical-rule]
        exemplars:
          - problem: 'The lengths of bolts from a factory have a standard deviation of $20$ mm. A sample of $25$ bolts is measured. Using $z^* = 2$ for $95\%$ confidence, find the margin of error for the mean bolt length.'
            answer: '8'
            answer_contract: {"kind": "unit", "quantity": "length", "unit": "mm", "allow_omitted": true}
            solution_sketch: 'First find the standard error: $20/\sqrt{25} = 20/5 = 4$. The margin of error is $z^*$ times the standard error, $2 \times 4 = 8$. The margin of error is 8 mm.'
          - problem: 'A population has $\sigma = 12$ and a sample of $n = 16$ is taken. Using $z^* = 2$ for $95\%$ confidence, find the margin of error for estimating $\mu$.'
            answer: '6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The standard error is $12/\sqrt{16} = 12/4 = 3$. Doubling it gives the margin of error $2 \times 3 = 6$.'
          - problem: 'A clinic measures a biomarker whose population standard deviation is $10$ units. It samples $16$ patients. Using $z^* = 2$ for $95\%$ confidence, find the margin of error for the mean level.'
            answer: '5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The standard error is $10/\sqrt{16} = 10/4 = 2.5$. The margin of error is $2 \times 2.5 = 5$ units.'
          - problem: 'A study of $36$ workers estimates the mean time to finish a task, with a margin of error of $4$ minutes. The study uses $z^* = 2$ for $95\%$ confidence. What is the population standard deviation of the finishing time?'
            answer: '12'
            answer_contract: {"kind": "unit", "quantity": "time", "unit": "min", "allow_omitted": true}
            solution_sketch: 'The margin of error is $2 \sigma/\sqrt{n}$, so $\sigma = \text{ME} \cdot \sqrt{n} / 2$. Here $\sqrt{36} = 6$, so $\sigma = 4 \times 6 / 2 = 12$. The population standard deviation is 12 minutes.'
          - problem: 'Delivery times have a standard deviation of $30$ minutes. A company times $100$ deliveries. Using $z^* = 2$ for $95\%$ confidence, find the margin of error for the mean delivery time.'
            answer: '6'
            answer_contract: {"kind": "unit", "quantity": "time", "unit": "min", "allow_omitted": true}
            solution_sketch: 'The standard error is $30/\sqrt{100} = 30/10 = 3$ minutes. The margin of error is $2 \times 3 = 6$ minutes.'
          - problem: 'Mia has $\sigma = 15$ and $n = 9$. She finds the margin of error for $95\%$ confidence, with $z^* = 2$, as $2 \cdot 15/9$. What is the correct margin of error?'
            answer: '10'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Mia divided by $n$, but the standard error divides by $\sqrt{n}$. The standard error is $15/\sqrt{9} = 15/3 = 5$, so the margin of error is $2 \times 5 = 10$.'
          - problem: 'The weights of apples have a population standard deviation of $30$ g. A grocer weighs $36$ apples. Using $z^* = 2$ for $95\%$ confidence, find the margin of error for the mean weight.'
            answer: '10'
            answer_contract: {"kind": "unit", "quantity": "mass", "unit": "g", "allow_omitted": true}
            solution_sketch: 'The standard error is $30/\sqrt{36} = 30/6 = 5$ g. The margin of error is $2 \times 5 = 10$ g.'
        constraints: "use z* = 2; n a perfect square; margins whole or half numbers; forward and reverse (find sigma) items; contexts"
      - id: kp3
        name: "What the ME does and does not cover"
        key_prerequisites: [standard-error]
        try_first:
          problem: 'A poll of $100$ people has a margin of error of $10$ points. A second poll asks $400$ people from the same population by the same method. What is its margin of error in points?'
          answer_contract: {"kind": "exact"}
          answer: '5'
          reveal: 'Four times as many people did not cut the margin to a quarter, only to a half. The margin of error shrinks with the square root of the sample size.'
        exemplars:
          - problem: 'A poll of $300$ voters has a margin of error of $8$ points. The same method is used on $1200$ voters from the same population. Find the new margin of error in points.'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The sample size is multiplied by $4$, and the margin of error is proportional to $1/\sqrt{n}$. Since $\sqrt{4} = 2$, the margin is divided by 2. The new margin of error is $8/2 = 4$ points.'
          - problem: 'A website invites readers to rate a service, and $5000$ readers respond on their own. The site reports a margin of error of $1.5$ points. Does the margin of error account for the bias of self-selection?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["no", "no it does not", "no, it does not", "no it doesn''t", "no, it doesn''t", "it does not", "not at all", "false"], ["yes", "yes it does", "yes, it does", "it does", "true"]]}
            solution_sketch: 'The margin of error covers only random sampling variability. Readers who choose to respond are not a random sample, and that bias stays however many of them reply. So the answer is no.'
          - problem: 'A survey of $200$ customers has a margin of error of $6$ points. A survey of $1800$ customers by the same method is made. Find the margin of error of the larger survey in points.'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The sample size is multiplied by $1800/200 = 9$. The margin of error is divided by $\sqrt{9} = 3$. The new margin of error is $6/3 = 2$ points.'
          - problem: 'A population has a standard deviation of $20$. Using $z^* = 2$ for $95\%$ confidence, find the margin of error for a sample of $50$ to two decimal places.'
            answer: '5.66'
            answer_contract: {"kind": "approx", "decimals": 2}
            solution_sketch: 'The standard error is $20/\sqrt{50} \approx 2.828$. The margin of error is $2 \times 2.828 \approx 5.657$, which is 5.66 to two decimal places.'
          - problem: 'A researcher wants the margin of error of a study to fall to one third of its current size, with the same population and the same confidence level. By what factor must the sample size be multiplied?'
            answer: '9'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The margin of error is proportional to $1/\sqrt{n}$. To divide it by 3, $\sqrt{n}$ must be multiplied by 3, so $n$ is multiplied by $3^2 = 9$.'
          - problem: 'A poll of $625$ voters has a margin of error of $4$ points. How many voters must be polled by the same method for a margin of error of $2$ points?'
            answer: '2500'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Halving the margin of error needs $\sqrt{n}$ to double. So the sample size is multiplied by 4, and $4 \times 625 = 2500$ voters are needed.'
          - problem: 'A pollster interviews $900$ people and finds a margin of error of $3.2$ points. A cheaper poll interviews only $100$ people by the same method. Find its margin of error in points.'
            answer: '9.6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The sample size is divided by $900/100 = 9$, so the margin of error is multiplied by $\sqrt{9} = 3$. The cheaper poll has a margin of error of $3.2 \times 3 = 9.6$ points.'
        constraints: "quantitative items: the ME's zero correction for bias, and its 1/sqrt(n) scaling in both directions; one label item"
    diagnostic_exemplar:
      problem: 'A population has $\sigma = 10$. Using $z^* = 2$ for $95\%$ confidence, how much smaller is the margin of error for a sample of $100$ than for a sample of $25$?'
      answer: '2'
      answer_contract: {"kind": "exact"}
      solution_sketch: 'At $n = 25$ the margin is $2 \cdot 10/5 = 4$, and at $n = 100$ it is $2 \cdot 10/10 = 2$. The difference is $4 - 2 = 2$.'
    anki_seeds:
      - front: 'Margin of error (for a mean, known $\sigma$)?'
        back: '$\text{ME} = z^* \cdot \dfrac{\sigma}{\sqrt{n}}$.'
        type: basic
      - front: 'The margin of error accounts for sampling variability but not...'
        back: 'Bias in how the sample was collected.'
        type: basic

  - id: confidence-intervals
    name: "Confidence Interval Basics"
    core: false                # terminal inference destination
    difficulty: 0.6
    drill: false
    answer_kind: numeric
    expected_time_secs: 240
    prerequisites:
      - id: margin-of-error
        weight: 0.7
        key: true
      - id: sampling-distributions
        weight: 0.6
        key: true
      - id: z-scores
        weight: 0.3
        key: false
    knowledge_points:
      - id: kp1
        name: "Building a 95% interval"
        key_prerequisites: [margin-of-error, sampling-distributions]
        exemplars:
          - problem: 'A machine fills boxes. A sample of $100$ boxes has a mean mass of $75$ g, and the population standard deviation is $20$ g. Using $z^* = 2$, find the $95\%$ confidence interval for the mean mass.'
            answer: '71, 79'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The standard error is $20/\sqrt{100} = 2$ g, and the margin of error is $2 \times 2 = 4$ g. The interval is $75 \pm 4$, from 71 to 79 g.'
          - problem: 'A sample of $16$ test scores has a mean of $80$, and the population standard deviation is $12$. Using $z^* = 2$, find the $95\%$ confidence interval for the mean score.'
            answer: '74, 86'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The standard error is $12/\sqrt{16} = 3$ and the margin of error is $2 \times 3 = 6$. The interval is $80 \pm 6$, from 74 to 86.'
          - problem: 'A sample of $49$ commuters has a mean journey of $200$ seconds, and the population standard deviation is $21$ seconds. Using $z^* = 2$, find the $95\%$ confidence interval for the mean journey time.'
            answer: '194, 206'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The standard error is $21/\sqrt{49} = 21/7 = 3$ and the margin of error is $2 \times 3 = 6$. The interval is $200 \pm 6$, from 194 to 206 seconds.'
          - problem: 'A $95\%$ confidence interval for a mean, built with $z^* = 2$ from a sample of $36$ values, runs from $158$ to $170$. Find the population standard deviation.'
            answer: '18'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The margin of error is half the width: $(170 - 158)/2 = 6$. Then the standard error is $6/2 = 3$. Since $\text{SE} = \sigma/\sqrt{n}$ and $\sqrt{36} = 6$, we get $\sigma = 3 \times 6 = 18$.'
          - problem: 'A sample of $81$ plants has a mean height of $42$ cm, and the population standard deviation is $27$ cm. Using $z^* = 2$, how wide is the $95\%$ confidence interval for the mean height?'
            answer: '12'
            answer_contract: {"kind": "unit", "quantity": "length", "unit": "cm", "allow_omitted": true}
            solution_sketch: 'The standard error is $27/\sqrt{81} = 27/9 = 3$ cm, and the margin of error is $2 \times 3 = 6$ cm. The interval is from 36 to 48 cm, so its width is 12 cm.'
          - problem: 'Mia has $\bar{x} = 30$, $\sigma = 8$ and $n = 16$. She writes the $95\%$ confidence interval, with $z^* = 2$, as $30 \pm 2 \cdot 8$, which is $14$ to $46$. What is the correct interval?'
            answer: '26, 34'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Mia used $\sigma$ as the standard error, but the standard error is $8/\sqrt{16} = 2$. The margin of error is $2 \times 2 = 4$, so the interval is $30 \pm 4$, from 26 to 34.'
          - problem: 'A sample of $64$ batteries has a mean life of $12.5$ hours, and the population standard deviation is $10$ hours. Using $z^* = 2$, find the $95\%$ confidence interval for the mean life.'
            answer: '10, 15'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The standard error is $10/\sqrt{64} = 10/8 = 1.25$ and the margin of error is $2 \times 1.25 = 2.5$. The interval is $12.5 \pm 2.5$, from 10 to 15 hours.'
        constraints: "use z* = 2 for 95%; n a perfect square; interval endpoints as a comma pair; reverse items for sigma and width; contexts"
      - id: kp2
        name: "Interpreting the confidence level"
        key_prerequisites: [sampling-distributions]
        exemplars:
          - problem: 'A $95\%$ confidence interval for the mean height of adults is $160$ to $170$ cm. A statistician says: if we repeat the study many times, about $95\%$ of the intervals will contain the true mean. Is this statement correct?'
            answer: 'yes'
            answer_contract: {"kind": "label", "options": [["yes", "yes it is correct", "yes, it is correct", "it is correct", "correct", "true"], ["no", "no it is not correct", "no, it is not correct", "it is not correct", "not correct", "incorrect", "false"]]}
            solution_sketch: 'The confidence level is the long-run capture rate of the method. About 95 out of 100 repeated intervals contain the true mean, so the statement is correct.'
          - problem: 'A polling firm builds a $95\%$ confidence interval from each of $200$ independent random samples. About how many of the $200$ intervals are expected to contain the true value?'
            answer: '190'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The method captures the true value in $95\%$ of samples. Of 200 intervals, $0.95 \times 200 = 190$ are expected to contain it.'
          - problem: 'A $90\%$ confidence interval for a mean is $20$ to $30$. A researcher says: there is a $90\%$ chance that the true mean lies between $20$ and $30$. Is this statement correct?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["no", "no it is not correct", "no, it is not correct", "it is not correct", "not correct", "incorrect", "false"], ["yes", "yes it is correct", "yes, it is correct", "it is correct", "correct", "true"]]}
            solution_sketch: 'The true mean is a fixed number, so it is either inside the interval or not. The 90% describes how often the method captures the mean, not a chance for this one interval. The statement is not correct.'
          - problem: 'A lab builds a $99\%$ confidence interval from each of $500$ independent random samples. About how many of the $500$ intervals are expected to miss the true mean?'
            answer: '5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The method misses in $1\%$ of samples. Of 500 intervals, $0.01 \times 500 = 5$ are expected to miss the true mean.'
          - problem: 'Forty students each draw their own random sample and build a $90\%$ confidence interval for the same mean. About how many of the $40$ intervals are expected to contain that mean?'
            answer: '36'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The method captures the mean in $90\%$ of samples. Of 40 intervals, $0.9 \times 40 = 36$ are expected to contain it.'
          - problem: 'A class of $25$ students each builds a $95\%$ confidence interval for the same true mean from a separate random sample. Exactly $23$ of the intervals contain the true mean. What percent of the intervals contain it?'
            answer: '92%'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The share of intervals that contain the mean is $23/25 = 0.92$, which is 92%. This is close to the 95% capture rate that the method promises.'
          - problem: 'A survey firm builds an $80\%$ confidence interval from each of $150$ independent random samples. About how many of the intervals are expected to miss the true value?'
            answer: '30'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The method misses in $20\%$ of samples, since $100 - 80 = 20$. Of 150 intervals, $0.2 \times 150 = 30$ are expected to miss.'
        constraints: "interpretation items; two label items (one yes, one no); long-run capture counts and shares"
      - id: kp3
        name: "Choosing the sample size"
        key_prerequisites: [margin-of-error, sampling-distributions]
        exemplars:
          - problem: 'A health survey plans a $95\%$ confidence interval for a mean. The population standard deviation is $18$ and $z^* = 2$. The target margin of error is $4$. How large a sample is needed?'
            answer: '81'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Solve $\text{ME} = z^* \sigma/\sqrt{n}$ for $n$ to get $n = (z^* \sigma/\text{ME})^2$. Here $n = (2 \times 18/4)^2 = 9^2 = 81$.'
          - problem: 'A factory measures bolt lengths with a population standard deviation of $20$ mm. Using $z^* = 2$, how many bolts must be measured for a $95\%$ interval with a margin of error of $5$ mm?'
            answer: '64'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The sample size is $n = (z^* \sigma/\text{ME})^2 = (2 \times 20/5)^2 = 8^2 = 64$ bolts. Solving the margin formula for $n$ gives this rule.'
          - problem: 'A study wants a $95\%$ confidence interval for a mean with a total width of $10$. Past data give a population standard deviation of $25$ and $z^* = 2$. How large a sample is needed?'
            answer: '100'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The width is twice the margin of error, so the margin is $10/2 = 5$. Then $n = (2 \times 25/5)^2 = 10^2 = 100$.'
          - problem: 'A polling organization plans a $95\%$ confidence interval for the mean age of voters. The population standard deviation is $18$ years and $z^* = 2$. The margin of error must be at most $3$ years. How many voters must be sampled?'
            answer: '144'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The sample size is $n = (2 \times 18/3)^2 = 12^2 = 144$ voters. A smaller sample would leave the margin above 3 years.'
          - problem: 'The population standard deviation of a test score is $12$. Using $z^* = 1.96$ for $95\%$ confidence, how many students must be sampled to estimate the mean score with a margin of error of $2.5$?'
            answer: '89'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'First $n = (1.96 \times 12/2.5)^2 = 9.408^2 \approx 88.51$. A sample cannot have a fraction of a student, and 88 would leave the margin above 2.5. So 89 students are needed.'
          - problem: 'A pollster currently has a margin of error of $8$ points and wants $4$ points, with the same population and confidence level. By what factor must the sample size be multiplied?'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The margin of error is proportional to $1/\sqrt{n}$. To halve it, $\sqrt{n}$ must double, so $n$ is multiplied by $2^2 = 4$.'
          - problem: 'A study of $400$ people has a margin of error of $5$ points. How many people are needed for a margin of error of $2$ points, with the same population and confidence level?'
            answer: '2500'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The margin falls by the factor $5/2 = 2.5$, so the sample size is multiplied by $2.5^2 = 6.25$. Then $400 \times 6.25 = 2500$ people are needed.'
          - problem: 'A hospital estimates the mean waiting time for a $95\%$ confidence interval. The population standard deviation is $15$ minutes and $z^* = 1.96$. The margin of error must be at most $3$ minutes. How many patients must be sampled?'
            answer: '97'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The sample size is $n = (1.96 \times 15/3)^2 = 9.8^2 = 96.04$. A sample of 96 would leave the margin above 3 minutes, so the size is rounded up to 97 patients.'
          - problem: 'Tom wants a margin of error of $4$ for a $95\%$ interval, with $\sigma = 12$ and $z^* = 2$. He finds $n = 2 \cdot 12/4 = 6$. What sample size is really needed?'
            answer: '36'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Tom forgot to square. The formula is $n = (z^* \sigma/\text{ME})^2 = (2 \times 12/4)^2 = 6^2 = 36$.'
        constraints: "z* sigma / ME a whole number for most items; one item with z* = 1.96 that rounds up; reverse scaling items"
    diagnostic_exemplar:
      problem: 'With $\sigma = 15$ and $z^* = 2$, what sample size is needed for a 95% confidence interval with margin of error $3$?'
      answer: '100'
      solution_sketch: '$2 \cdot 15/\sqrt{n} = 3$ gives $\sqrt{n} = 10$, so $n = 100$.'
    anki_seeds:
      - front: 'Confidence interval for $\mu$ (known $\sigma$)?'
        back: '$\bar{x} \pm z^* \dfrac{\sigma}{\sqrt{n}}$.'
        type: basic
      - front: 'Exact $z^*$ for a 95% confidence interval?'
        back: '$1.96$ (the empirical rule rounds it to $2$).'
        type: basic
      - front: '"95% confident" refers to the {{c1::method''s long-run capture rate}}, not to any one interval.'
        back: 'method''s long-run capture rate'
        type: cloze

  - id: scatterplots-correlation
    name: "Scatterplots & Correlation"
    core: false                # terminal regression branch
    difficulty: 0.4
    drill: false
    answer_kind: numeric
    expected_time_secs: 120
    prerequisites:
      - id: plotting-points
        weight: 0.6
        key: true
      - id: mean-median-mode
        weight: 0.3
        key: false
    knowledge_points:
      - id: kp1
        name: "Describing scatterplots"
        key_prerequisites: [plotting-points]
        exemplars:
          - problem: 'A dealer records the age of six used cars in years and their resale value in thousands of dollars: $(1, 45)$, $(3, 41)$, $(5, 43)$, $(7, 30)$, $(9, 27)$ and $(11, 33)$. Is the relationship between age and value positive or negative?'
            answer: 'negative'
            answer_contract: {"kind": "label", "options": [["negative", "negative relationship", "negative association", "negative correlation", "a negative relationship", "a negative association", "a negative correlation", "it is negative"], ["positive", "positive relationship", "positive association", "positive correlation", "a positive relationship", "a positive association", "a positive correlation", "it is positive"]]}
            solution_sketch: 'The values on the left, for the newest cars, are around 41 to 45. The values on the right, for the oldest cars, are around 27 to 33. The value falls as age rises, so the relationship is negative.'
          - problem: 'Students record their weekly TV hours and their last test score, giving the points $(4, 89)$, $(7, 84)$, $(10, 85)$, $(13, 79)$, $(16, 77)$ and $(19, 75)$. By how much does the mean score change from the three lightest viewers to the three heaviest viewers?'
            answer: '-9'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The three lightest viewers have a mean score of $(89 + 84 + 85)/3 = 86$. The three heaviest have a mean of $(79 + 77 + 75)/3 = 77$. The change is $77 - 86 = -9$, so scores fall as TV hours rise.'
          - problem: 'A tank is drained and then refilled. Its water depth in centimeters at times $1$ to $5$ minutes gives the points $(1, 40)$, $(2, 31)$, $(3, 26)$, $(4, 31)$ and $(5, 40)$. Is the relationship between time and depth linear or curved?'
            answer: 'curved'
            answer_contract: {"kind": "label", "options": [["curved", "curved relationship", "nonlinear", "non-linear", "a curve", "not linear", "it is curved", "a curved relationship"], ["linear", "linear relationship", "a straight line", "straight", "it is linear"]]}
            solution_sketch: 'Depth falls from 40 to 26 and then rises back to 40. A straight line cannot do this, because the middle point sits 14 below the average of the two end values, so the points form a curve.'
          - problem: 'A study records hours of study $x$ and quiz score $y$ for eight students: $(1, 58)$, $(2, 62)$, $(3, 60)$, $(4, 64)$, $(5, 66)$, $(6, 65)$, $(7, 69)$ and $(8, 72)$. By how much does the mean score change from the four students who studied least to the four who studied most?'
            answer: '7'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The four who studied least have a mean score of $244/4 = 61$. The four who studied most have a mean of $272/4 = 68$. The change is $68 - 61 = 7$ points, so scores rise with study time.'
          - problem: 'A gardener plots fertilizer in scoops against plant height in centimeters and draws the trend line $y = 30 + 2x$. The recorded points are $(1, 33)$, $(2, 37)$, $(3, 38)$, $(4, 42)$ and $(5, 47)$. How far from the line, measured vertically, is the point that lies farthest from it?'
            answer: '7'
            answer_contract: {"kind": "unit", "quantity": "length", "unit": "cm", "allow_omitted": true}
            solution_sketch: 'The line gives 32, 34, 36, 38 and 40 at the five scoop amounts. The gaps are 1, 3, 2, 4 and 7, so the largest gap is 7 cm at $(5, 47)$. A small gap means a point follows the line closely.'
          - problem: 'A candle burns steadily. A student plots hours burned against remaining length in centimeters and draws the trend line $y = 60 - 2x$. The measured points are $(5, 50)$, $(10, 39)$, $(15, 31)$, $(20, 21)$ and $(25, 11)$. What is the largest vertical distance from a point to the line?'
            answer: '1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The line gives 50, 40, 30, 20 and 10 at these distances. The gaps are 0, 1, 1, 1 and 1, so the largest gap is 1. All points hug the line, so the relationship is strong.'
          - problem: 'Five points $(2, 6)$, $(4, 10)$, $(6, 14)$, $(8, 18)$ and $(10, 22)$ lie exactly on one straight line. What is the slope of that line?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Every step of 2 in $x$ raises $y$ by 4, so the slope is $4/2 = 2$. Points on an exact line show the strongest possible linear relationship.'
        constraints: "direction and form as natural verdicts (two label items), trend-line distances and group-mean changes for strength; data listed in the question"
      - id: kp2
        name: "Interpreting the correlation coefficient"
        key_prerequisites: [plotting-points]
        exemplars:
          - problem: 'Which shows the stronger linear relationship: $r = 0.3$ or $r = -0.8$?'
            answer: '-0.8'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Strength is the size $|r|$, not the sign. Here $|0.3| = 0.3$ and $|-0.8| = 0.8$, and $0.8$ is larger. So $r = -0.8$ is stronger, with a negative direction.'
          - problem: 'Three studies find $r = 0.58$, $r = -0.81$ and $r = 0.12$ between pairs of variables. Which value of $r$ shows the strongest linear relationship?'
            answer: '-0.81'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Compare the sizes $0.58$, $0.81$ and $0.12$. The largest is $0.81$, which belongs to $r = -0.81$. The strongest relationship is negative.'
          - problem: 'What is the largest value that a correlation coefficient can take?'
            answer: '1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A correlation coefficient always lies between $-1$ and $1$. The value 1 is a perfect positive straight line, so the largest value is 1.'
          - problem: 'In a study, the correlation between hours of practice and performance score is $r = 0.8$. Which description of the linear relationship fits best?'
            answer: 'strong positive'
            answer_contract: {"kind": "label", "options": [["strong positive", "strongly positive", "a strong positive relationship", "strong positive correlation", "a strong positive correlation", "strong positive association", "positive and strong"], ["weak positive", "weakly positive", "a weak positive relationship", "weak positive correlation", "a weak positive correlation", "positive and weak"], ["strong negative", "strongly negative", "a strong negative relationship", "strong negative correlation", "a strong negative correlation", "negative and strong"], ["no linear pattern", "no relationship", "none", "no correlation", "no linear relationship", "no linear correlation", "no association"]]}
            solution_sketch: 'The size $|r| = 0.8$ is close to 1, so the linear relationship is strong. The sign is positive, so more practice goes with a higher score. The description is strong positive.'
          - problem: 'Sam calculates a correlation coefficient of $1.4$ for two variables. Between which two numbers must every correlation coefficient lie?'
            answer: '-1, 1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A correlation coefficient never leaves the range from $-1$ to $1$, so the value 1.4 must be a mistake. Every correlation lies between -1 and 1.'
          - problem: 'A study of $40$ students finds $r = -0.04$ between shoe size and math score. Which description of the linear relationship fits best?'
            answer: 'no linear pattern'
            answer_contract: {"kind": "label", "options": [["strong positive", "strongly positive", "a strong positive relationship", "strong positive correlation", "a strong positive correlation", "strong positive association", "positive and strong"], ["weak positive", "weakly positive", "a weak positive relationship", "weak positive correlation", "a weak positive correlation", "positive and weak"], ["strong negative", "strongly negative", "a strong negative relationship", "strong negative correlation", "a strong negative correlation", "negative and strong"], ["no linear pattern", "no relationship", "none", "no correlation", "no linear relationship", "no linear correlation", "no association"]]}
            solution_sketch: 'The size $|r| = 0.04$ is very close to 0, so the points show no linear pattern at all. A tiny negative sign does not make the relationship a real negative one.'
        constraints: "r values given to one or two decimals; strength compares |r|; range of r; two label items with different answers"
      - id: kp3
        name: "Facts and cautions about r"
        key_prerequisites: [plotting-points]
        exemplars:
          - problem: 'A data set of daily temperatures and pressure readings has correlation $r = -0.8$. An analyst swaps the variables, using pressure as $x$ and temperature as $y$. What is the correlation of the swapped data set?'
            answer: '-0.8'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The correlation is symmetric in $x$ and $y$, so swapping the two variables does not change it. The swapped data set still has $r = -0.8$.'
          - problem: 'A scatterplot shows the six points $(-3, 81)$, $(-2, 16)$, $(-1, 1)$, $(1, 1)$, $(2, 16)$ and $(3, 81)$, which lie on a smooth symmetric curve. What is the correlation coefficient $r$?'
            answer: '0'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The mean of the $x$ values is 0, so the top of the formula for $r$ is the sum of $x \cdot y$. That sum is $-243 - 32 - 1 + 1 + 32 + 243 = 0$, so $r = 0$. The points follow a strong curve, but $r$ only measures straight-line patterns.'
          - problem: 'The correlation between rod lengths in meters and rod masses in kilograms is $r = 0.6$. Every length is converted to centimeters by multiplying by $100$. What is the new correlation?'
            answer: '0.6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The correlation has no units and does not change when a variable is multiplied by a positive number. Multiplying every length by 100 rescales $x$, so $r$ stays 0.6.'
          - problem: 'A study reports a correlation of $r = 0.70$ between hours of practice and race time. A second scatterplot puts race time on the horizontal axis. What correlation does the second plot show?'
            answer: '0.7'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The correlation is the same whichever variable goes on which axis. The second plot still shows $r = 0.70$, which is 0.7.'
          - problem: 'A town finds a correlation of $r = 0.85$ between monthly ice cream sales and monthly drownings. Does this show that ice cream sales cause drownings?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["no", "no it does not", "no, it does not", "no it doesn''t", "no, it doesn''t", "it does not", "not necessarily", "false"], ["yes", "yes it does", "yes, it does", "it does", "true"]]}
            solution_sketch: 'A strong correlation shows that two variables move together, not that one causes the other. Hot weather raises both ice cream sales and swimming, so the answer is no.'
          - problem: 'The points lie exactly on the V-shaped graph $y = |x|$ at the $x$ values $-3$, $-2$, $-1$, $1$, $2$ and $3$. What is the correlation coefficient $r$?'
            answer: '0'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The mean of the $x$ values is 0, so the top of the formula for $r$ is the sum of $x \cdot y$. That sum is $-9 - 4 - 1 + 1 + 4 + 9 = 0$, so $r = 0$. The two halves of the V cancel each other.'
          - problem: 'The correlation between hours of study and exam score is $r = 0.6$. The teacher replaces each score $y$ by $100 - y$, the number of marks lost. What is the correlation between hours of study and marks lost?'
            answer: '-0.6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Replacing $y$ by $100 - y$ flips the direction of the data, because high scores become low marks lost. The strength stays the same, so $r$ changes sign to $-0.6$.'
          - problem: 'A data set has correlation $r = 0.25$ between age and reaction time. Every reaction time is multiplied by $2$ and age is unchanged. What is the new correlation?'
            answer: '0.25'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The correlation is unchanged when one variable is multiplied by a positive number. Doubling every reaction time rescales $y$, so $r$ stays 0.25.'
        constraints: "conceptual items: symmetry, unit changes, linear-only, sign flip, and association versus cause (one label item)"
    diagnostic_exemplar:
      problem: 'A scatterplot of $y$ against $x$ shows points lying exactly on a symmetric parabola opening upward. Is $r$ close to $-1$, $0$, or $+1$ — and why?'
      answer: 'Close to $0$; $r$ measures only linear association, and the two symmetric halves cancel.'
      answer_contract: {kind: none}
      solution_sketch: 'Perfect curved association can still give $r \approx 0$ — $r$ is blind to nonlinear form.'
    anki_seeds:
      - front: 'In the correlation coefficient $r$, what do the sign and the magnitude tell you?'
        back: 'Sign: direction of the linear relationship; magnitude $|r|$: its strength.'
        type: basic
      - front: '$r$ always lies in the interval...'
        back: '$[-1, 1]$.'
        type: basic

  - id: least-squares-line
    name: "The Least-Squares Line"
    core: false                # terminal regression branch
    difficulty: 0.5
    drill: false
    answer_kind: numeric
    expected_time_secs: 180
    prerequisites:
      - id: scatterplots-correlation
        weight: 0.6
        key: true
      - id: slope-intercept-form
        weight: 0.6
        key: true
      - id: variance-standard-deviation
        weight: 0.4
        key: false
    knowledge_points:
      - id: kp1
        name: "Slope from summary statistics"
        key_prerequisites: [scatterplots-correlation, slope-intercept-form]
        exemplars:
          - problem: 'In a study of revision time and exam score, the correlation is $r = 0.8$, the standard deviation of revision time is $2$ hours and the standard deviation of scores is $5$ points. Find the slope of the least-squares line for predicting the score from the revision time.'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The slope is $b = r \cdot s_y/s_x$. Here $b = 0.8 \times 5/2 = 0.8 \times 2.5 = 2$. The predicted score rises by 2 points for each extra hour.'
          - problem: 'Given $r = 0.5$, $s_x = 4$ and $s_y = 8$, find the slope of the least-squares line.'
            answer: '1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The slope is $b = r \cdot s_y/s_x = 0.5 \times 8/4 = 0.5 \times 2 = 1$. The predicted $y$ rises by 1 for each rise of 1 in $x$.'
          - problem: 'A shop tries different prices, with a standard deviation of $5$ dollars, and records the number of units sold, with a standard deviation of $10$. The correlation is $r = -0.4$. Find the slope of the least-squares line for predicting units sold from price.'
            answer: '-0.8'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The slope is $b = r \cdot s_y/s_x = -0.4 \times 10/5 = -0.4 \times 2 = -0.8$. The sign matches the sign of $r$, so sales fall as the price rises.'
          - problem: 'Given $r = 0.6$, $s_x = 3$ and $s_y = 10$, find the slope of the least-squares line.'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The slope is $b = r \cdot s_y/s_x = 0.6 \times 10/3 = 6/3 = 2$. The slope has the sign of $r$, which is positive here.'
          - problem: 'A least-squares line has slope $1.5$. The $x$ values have standard deviation $4$ and the $y$ values have standard deviation $10$. Find the correlation $r$.'
            answer: '0.6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The slope is $b = r \cdot s_y/s_x$, so $r = b \cdot s_x/s_y$. Here $r = 1.5 \times 4/10 = 6/10 = 0.6$.'
          - problem: 'For two variables the least-squares slope is $3$ and the correlation is $r = 0.75$. The $x$ values have standard deviation $2$. Find the standard deviation $s_y$ of the $y$ values.'
            answer: '8'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'From $b = r \cdot s_y/s_x$ we get $s_y = b \cdot s_x/r$. Here $s_y = 3 \times 2/0.75 = 6/0.75 = 8$.'
          - problem: 'Ana has $r = 0.5$, $s_x = 10$ and $s_y = 4$. She finds the slope as $0.5 \cdot 10/4 = 1.25$. What is the correct slope?'
            answer: '0.2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Ana put the standard deviations the wrong way round. The slope is $r \cdot s_y/s_x = 0.5 \times 4/10 = 2/10 = 0.2$.'
        constraints: "r, s_x, s_y chosen so b is exact; forward items and reverse items for r and s_y; contexts"
      - id: kp2
        name: "Intercept and the point (x-bar, y-bar)"
        key_prerequisites: [slope-intercept-form]
        exemplars:
          - problem: 'In a fertilizer study the mean amount is $2$ scoops, the mean plant height is $10$ cm and the least-squares slope is $3$ cm per scoop. Find the intercept $a$ of the least-squares line.'
            answer: '4'
            answer_contract: {"kind": "unit", "quantity": "length", "unit": "cm", "allow_omitted": true}
            solution_sketch: 'The line passes through the point of means $(2, 10)$, so $10 = a + 3 \times 2$. Then $a = 10 - 6 = 4$.'
          - problem: 'A least-squares line has slope $b = 2$, and the means are $\bar{x} = 4$ and $\bar{y} = 10$. Write the equation of the line.'
            answer: 'y = 2x + 2'
            answer_contract: {"kind": "polynomial_relation"}
            solution_sketch: 'The intercept is $a = \bar{y} - b\bar{x} = 10 - 2 \times 4 = 2$. With slope 2 the line is $y = 2x + 2$.'
          - problem: 'With slope $b = -1$, $\bar{x} = 5$ and $\bar{y} = 7$, find the intercept of the least-squares line.'
            answer: '12'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The intercept is $a = \bar{y} - b\bar{x} = 7 - (-1) \times 5 = 7 + 5 = 12$. Subtracting a negative term adds it.'
          - problem: 'For used cars the mean age is $6$ years and the mean price is $18$ thousand dollars. The least-squares slope is $-2$ thousand dollars per year. Find the intercept of the least-squares line.'
            answer: '30'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The intercept is $a = \bar{y} - b\bar{x} = 18 - (-2) \times 6 = 18 + 12 = 30$. A new car is predicted at 30 thousand dollars.'
          - problem: 'With slope $b = 0.5$, $\bar{x} = 10$ and $\bar{y} = 9$, find the intercept of the least-squares line.'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The intercept is $a = \bar{y} - b\bar{x} = 9 - 0.5 \times 10 = 9 - 5 = 4$. The line then passes through the point of means.'
          - problem: 'A least-squares line is $y = 3 + 2x$ and the mean of the $y$ values is $15$. Find the mean of the $x$ values.'
            answer: '6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The line passes through the point of means, so $15 = 3 + 2\bar{x}$. Then $2\bar{x} = 12$ and $\bar{x} = 6$.'
          - problem: 'A study has sample means $\bar{x} = 2$ and $\bar{y} = 3$, and the least-squares slope is $b = 4$. Write the equation of the least-squares line.'
            answer: 'y = 4x - 5'
            answer_contract: {"kind": "polynomial_relation"}
            solution_sketch: 'The intercept is $a = \bar{y} - b\bar{x} = 3 - 4 \times 2 = -5$. The line is $y = 4x - 5$.'
        constraints: "means small integers; intercepts exact; two items ask for the full equation; one reverse item for the mean"
      - id: kp3
        name: "Assembling the full equation"
        key_prerequisites: [scatterplots-correlation, slope-intercept-form]
        exemplars:
          - problem: 'A teacher studies revision hours $x$ and exam score $y$. The means are $\bar{x} = 4$ and $\bar{y} = 61$, the standard deviations are $s_x = 3$ and $s_y = 6$, and $r = 1/2$. Find the equation of the least-squares line.'
            answer: 'y = x + 57'
            answer_contract: {"kind": "polynomial_relation"}
            solution_sketch: 'The slope is $b = r \cdot s_y/s_x = \tfrac{1}{2} \times 6/3 = 1$. The intercept is $a = 61 - 1 \times 4 = 57$. The line is $y = x + 57$.'
          - problem: 'A study of TV hours $x$ and test score $y$ has $\bar{x} = 5$, $\bar{y} = 80$, $s_x = 3$, $s_y = 10$ and $r = -0.6$. Find the equation of the least-squares line.'
            answer: 'y = 90 - 2x'
            answer_contract: {"kind": "polynomial_relation"}
            solution_sketch: 'The slope is $b = -0.6 \times 10/3 = -2$. The intercept is $a = 80 - (-2) \times 5 = 90$. The line is $y = 90 - 2x$.'
          - problem: 'Given $\bar{x} = 3$, $\bar{y} = 10$, $s_x = 2$, $s_y = 4$ and $r = 0.5$, find the intercept of the least-squares line.'
            answer: '7'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The slope is $b = 0.5 \times 4/2 = 1$. The intercept is $a = 10 - 1 \times 3 = 7$.'
          - problem: 'Given $\bar{x} = 2$, $\bar{y} = 14$, $s_x = 4$, $s_y = 8$ and $r = -0.5$, find the slope of the least-squares line.'
            answer: '-1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The slope is $b = r \cdot s_y/s_x = -0.5 \times 8/4 = -0.5 \times 2 = -1$. The means are not needed for the slope.'
          - problem: 'A cafe records the daily temperature $x$ in degrees and cups of coffee sold $y$. The means are $\bar{x} = 20$ and $\bar{y} = 150$, the standard deviations are $s_x = 4$ and $s_y = 10$, and $r = 0.8$. Find the intercept of the least-squares line.'
            answer: '110'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The slope is $b = 0.8 \times 10/4 = 2$. The intercept is $a = 150 - 2 \times 20 = 110$ cups.'
          - problem: 'Leo has $\bar{x} = 6$, $\bar{y} = 20$, $s_x = 5$, $s_y = 10$ and $r = 0.5$. He writes the least-squares line as $y = 20 + x$. What is the correct equation?'
            answer: 'y = x + 14'
            answer_contract: {"kind": "polynomial_relation"}
            solution_sketch: 'The slope is $b = 0.5 \times 10/5 = 1$. The intercept is $a = \bar{y} - b\bar{x} = 20 - 6 = 14$, not 20. Leo used $\bar{y}$ as the intercept, and the line is $y = x + 14$.'
          - problem: 'A seller records the age $x$ of a machine in years and its value $y$ in thousand dollars. The means are $\bar{x} = 8$ and $\bar{y} = 42$, the standard deviations are $s_x = 2$ and $s_y = 3$, and $r = -2/3$. Find the equation of the least-squares line.'
            answer: 'y = 50 - x'
            answer_contract: {"kind": "polynomial_relation"}
            solution_sketch: 'The slope is $b = -\tfrac{2}{3} \times 3/2 = -1$. The intercept is $a = 42 - (-1) \times 8 = 50$. The line is $y = 50 - x$.'
        constraints: "slopes whole or decimal; include negative-r cases; equations, intercepts and slopes in turn; contexts"
    diagnostic_exemplar:
      problem: 'Given $r = 0.9$, $s_x = 3$, $s_y = 6$, $\bar{x} = 10$ and $\bar{y} = 25$, find the equation of the least-squares line.'
      answer: 'y = 1.8x + 7'
      answer_contract: {"kind": "polynomial_relation"}
      solution_sketch: '$b = 0.9 \cdot \frac{6}{3} = 1.8$; $a = 25 - 1.8 \cdot 10 = 7$.'
    anki_seeds:
      - front: 'Least-squares slope from summary statistics?'
        back: '$b = r \dfrac{s_y}{s_x}$.'
        type: basic
      - front: 'The least-squares line always passes through the point...'
        back: '$(\bar{x}, \bar{y})$.'
        type: basic

  - id: regression-predictions
    name: "Predictions & Residuals"
    core: false                # terminal regression branch
    difficulty: 0.5
    drill: false
    answer_kind: numeric
    expected_time_secs: 120
    prerequisites:
      - id: least-squares-line
        weight: 0.8
        key: true
    knowledge_points:
      - id: kp1
        name: 'Predicting with the line'
        key_prerequisites: [least-squares-line]
        exemplars:
          - problem: 'The regression line is $\hat{y} = 3 + 2x$. What value of $y$ does the line predict at $x = 5$?'
            answer: '13'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Substitute $x = 5$ into the line. Then $\hat{y} = 3 + 2 \cdot 5 = 3 + 10 = 13$, so the line predicts $y = 13$.'
          - problem: 'A least-squares line for the test score $y$ on the study time $x$ in hours is $\hat{y} = 62 + 4x$. What score does the line predict for a student who studies for 7 hours?'
            answer: '90'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The study time is $x = 7$, so the prediction is $\hat{y} = 62 + 4 \cdot 7 = 62 + 28 = 90$. The line predicts a score of 90.'
          - problem: 'The regression line is $\hat{y} = 7 - 4x$. What value does it predict at $x = 3$?'
            answer: '-5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Substitute $x = 3$: $\hat{y} = 7 - 4 \cdot 3 = 7 - 12 = -5$. The prediction can be negative because the slope is negative.'
          - problem: 'A tutor''s fee in dollars is modelled by the regression line $\hat{y} = 12 + 5x$, where $x$ is the number of hours. For how many hours does the line predict a fee of 47 dollars?'
            answer: '7'
            answer_contract: {"kind": "unit", "quantity": "time", "unit": "hour", "allow_omitted": true}
            solution_sketch: 'Here $\hat{y}$ is known and $x$ is unknown, so set $47 = 12 + 5x$. Subtract 12 to get $5x = 35$, then divide by 5 to get $x = 7$ hours.'
          - problem: 'A regression line has slope $6$ and passes through the point $(2, 20)$. What does the line predict at $x = 9$?'
            answer: '62'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The line is $\hat{y} = 6x + b$. The point $(2, 20)$ gives $20 = 12 + b$, so $b = 8$. At $x = 9$ the prediction is $6 \cdot 9 + 8 = 62$.'
          - problem: 'A used-car regression line is $\hat{y} = 24 - 1.5x$, where $y$ is the price in thousands of dollars and $x$ is the age of the car in years. What price does the line predict for a car aged 6 years?'
            answer: '15'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The age is $x = 6$, so $\hat{y} = 24 - 1.5 \cdot 6 = 24 - 9 = 15$. The line predicts a price of 15 thousand dollars.'
          - problem: 'A seedling''s height in centimetres is modelled by $\hat{y} = 5 + 2.5x$, where $x$ is its age in weeks. At what age does the line predict a height of 40 cm?'
            answer: '14'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Set $40 = 5 + 2.5x$. Subtract 5 to get $2.5x = 35$, then divide by 2.5 to get $x = 14$ weeks.'
        constraints: 'integer or simple decimal coefficients; some items give the predicted value and ask for x, which needs division'
      - id: kp2
        name: 'Residuals'
        key_prerequisites: [least-squares-line]
        exemplars:
          - problem: 'At $x = 5$ the observed value is $y = 11$, and the line $\hat{y} = 3 + 2x$ predicts $13$. What is the residual?'
            answer: '-2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The residual is the observed value minus the predicted value. So the residual is $11 - 13 = -2$.'
          - problem: 'The least-squares line for the score on the study time $x$ in hours is $\hat{y} = 50 + 4x$. Maya studied for 6 hours and scored 79. What is her residual?'
            answer: '5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The line predicts $50 + 4 \cdot 6 = 74$ for 6 hours. Her residual is observed minus predicted, which is $79 - 74 = 5$.'
          - problem: 'Sam finds the residual at $x = 6$, where the observed value is $y = 20$ and the line is $\hat{y} = 50 - 4x$. He writes $\hat{y} - y = 6$. What is the correct residual?'
            answer: '-6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Sam subtracted in the wrong order. The line predicts $50 - 24 = 26$, so the residual is observed minus predicted: $20 - 26 = -6$.'
          - problem: 'A regression line is $\hat{y} = 1 + 3x$. At $x = 2$ the observed value is $y = 10$. Does the point lie above or below the line?'
            answer: 'above'
            answer_contract: {"kind": "label", "options": [["above", "above the line", "it lies above", "it is above", "over the line"], ["below", "below the line", "it lies below", "it is below", "under the line"]]}
            solution_sketch: 'The line predicts $1 + 3 \cdot 2 = 7$ at $x = 2$. The observed value 10 is larger than 7, so the residual is $+3$ and the point lies above the line.'
          - problem: 'A taxi company models the fare in dollars by $\hat{y} = 8 + 1.5x$, where $x$ is the distance in kilometres. A ride of 12 km costs 29 dollars. What is the residual for this ride?'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'For 12 km the line predicts $8 + 1.5 \cdot 12 = 26$ dollars. The residual is $29 - 26 = 3$ dollars.'
          - problem: 'A least-squares line is $\hat{y} = 6 + 4x$. At $x = 3$ the residual is $9$. What is the observed value of $y$ there?'
            answer: '27'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The line predicts $6 + 4 \cdot 3 = 18$. Since residual = observed - predicted, the observed value is $18 + 9 = 27$.'
          - problem: 'The line $\hat{y} = 5 + 2.5x$ models the height in centimetres of a seedling after $x$ weeks. A seedling measures 22 cm at 8 weeks. What is its residual?'
            answer: '-3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'At 8 weeks the line predicts $5 + 2.5 \cdot 8 = 25$ cm. The residual is $22 - 25 = -3$, so the seedling is 3 cm below the line.'
        constraints: 'residual = observed minus predicted; a positive residual means the point lies above the line'
      - id: kp3
        name: 'Extrapolation caution'
        key_prerequisites: [least-squares-line]
        exemplars:
          - problem: 'A least-squares line $\hat{y} = 20 + 2x$ was fitted to data whose $x$-values run from 3 to 12. Is a prediction at $x = 45$ an interpolation or an extrapolation?'
            answer: 'extrapolation'
            answer_contract: {"kind": "label", "options": [["extrapolation", "it is extrapolation", "extrapolating", "an extrapolation"], ["interpolation", "it is interpolation", "interpolating", "an interpolation"]]}
            solution_sketch: 'The value $x = 45$ lies beyond the largest observed value 12. A prediction outside the range of the data is an extrapolation, and it is much less reliable.'
          - problem: 'Data with $x$-values between 2 and 14 gave the least-squares line $\hat{y} = 5 + 4x$. What does the line predict for a new case with $x = 8$?'
            answer: '37'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The value $x = 8$ lies inside the range 2 to 14, so the prediction is supported by data. It is $\hat{y} = 5 + 4 \cdot 8 = 37$.'
          - problem: 'A line $\hat{y} = 8 + 3x$ predicts the loaves a bakery sells from the number of hours $x$ that it is open. It was fitted to data with $x$ from 4 to 12 hours. Is a prediction at 9 hours an interpolation or an extrapolation?'
            answer: 'interpolation'
            answer_contract: {"kind": "label", "options": [["extrapolation", "it is extrapolation", "extrapolating", "an extrapolation"], ["interpolation", "it is interpolation", "interpolating", "an interpolation"]]}
            solution_sketch: 'The value 9 lies between 4 and 12, so it is inside the range of the data. A prediction inside the range is an interpolation.'
          - problem: 'A plant study fits $\hat{y} = 40 + 3x$, where $y$ is the height in cm and $x$ is the fertilizer in grams, to data with $x$ from 6 to 24. What height does the line give at $x = 2$?'
            answer: '46'
            answer_contract: {"kind": "unit", "quantity": "length", "unit": "cm", "allow_omitted": true}
            solution_sketch: 'Substitute $x = 2$: $\hat{y} = 40 + 3 \cdot 2 = 46$ cm. This value is an extrapolation below the lowest observed amount 6, so it is less reliable.'
          - problem: 'The heights of children aged 5 to 12 are modelled by $\hat{y} = 80 + 6x$, where $y$ is the height in cm and $x$ is the age in years. What height does the line give for a man aged 40?'
            answer: '320'
            answer_contract: {"kind": "unit", "quantity": "length", "unit": "cm", "allow_omitted": true}
            solution_sketch: 'Substitute $x = 40$: $\hat{y} = 80 + 6 \cdot 40 = 320$ cm. This is more than three metres, which shows that the line fails far outside the ages 5 to 12.'
          - problem: 'The line $\hat{y} = 90 - 2x$ gives the fuel use in litres per 100 km at a speed of $x$ km/h. It was fitted for speeds from 10 to 40 km/h. At what speed does the line predict a fuel use of 0?'
            answer: '45'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Set $90 - 2x = 0$, so $x = 45$ km/h. A car cannot run on no fuel, and 45 lies outside the range 10 to 40, so the line is not reliable there.'
          - problem: 'Monthly sales in thousands are modelled by $\hat{y} = 100 - 5x$, where $x$ is the price in dollars. The data used prices from 4 to 10 dollars. The line is only a model, so it can give a value below zero. What sales does the line predict at a price of 25 dollars?'
            answer: '-25'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Substitute $x = 25$: $\hat{y} = 100 - 5 \cdot 25 = -25$. Sales cannot be negative, so the line should not be trusted at a price far above 10.'
        constraints: 'x-ranges stated explicitly; items ask for the classification (interpolation or extrapolation) or for a prediction outside the range'
    diagnostic_exemplar:
      problem: 'The regression line is $\hat{y} = 5 + 3x$; at $x = 4$ the observed value is $y = 15$. Find the predicted value of $y$ at $x = 4$ and the residual there.'
      answer: '$(17, -2)$'
      solution_sketch: '$5 + 12 = 17$; $15 - 17 = -2$.'
    anki_seeds:
      - front: 'Residual $=$ ?'
        back: 'Observed $-$ predicted: $y - \hat{y}$.'
        type: basic
      - front: 'Why distrust regression predictions far outside the observed $x$-range?'
        back: 'Extrapolation — the linear pattern may not continue beyond the data.'
        type: basic

  - id: correlation-regression
    name: "Interpreting Regression Models"
    core: false                # terminal regression branch
    difficulty: 0.55
    drill: false
    answer_kind: numeric
    expected_time_secs: 240
    prerequisites:
      - id: least-squares-line
        weight: 0.7
        key: true
      - id: regression-predictions
        weight: 0.6
        key: true
      - id: scatterplots-correlation
        weight: 0.4
        key: false
    knowledge_points:
      - id: kp1
        name: 'Interpreting slope and intercept in context'
        key_prerequisites: [least-squares-line]
        exemplars:
          - problem: 'For the height of a plant, the model is $\hat{y} = 12 + 3x$, where $y$ is the height in cm and $x$ is the age in weeks. By how many centimetres does the model predict the height to rise with each extra week?'
            answer: '3'
            answer_contract: {"kind": "unit", "quantity": "length", "unit": "cm", "allow_omitted": true}
            solution_sketch: 'The slope is the predicted change in $y$ for one more unit of $x$. Here the slope is 3, so each extra week goes with a predicted rise of 3 cm.'
          - problem: 'The model $\hat{y} = 12 + 3x$ predicts the height $y$ in cm of a seedling that is $x$ weeks old. What height does it predict at $x = 0$?'
            answer: '12'
            answer_contract: {"kind": "unit", "quantity": "length", "unit": "cm", "allow_omitted": true}
            solution_sketch: 'The intercept is the predicted $y$ when $x = 0$. Putting $x = 0$ gives $\hat{y} = 12 + 3 \cdot 0 = 12$, so the model predicts 12 cm.'
          - problem: 'A service plan has a monthly fee and a charge for each device. The least-squares model $\hat{y} = 30 + 4x$ gives the predicted monthly cost in dollars for $x$ devices. By how many dollars does each additional device raise the predicted cost?'
            answer: '4'
            answer_contract: {"kind": "unit", "quantity": "dollar", "unit": "dollar", "allow_omitted": true}
            solution_sketch: 'The slope of the model is 4. The slope is the predicted change in cost for one more device, so each device goes with 4 more dollars. This is an association, not a proof of cause.'
          - problem: 'A repair shop predicts the wait in minutes from the number $x$ of jobs in the queue with $\hat{y} = 18 - 5x$. What wait does the model predict when no job is in the queue?'
            answer: '18'
            answer_contract: {"kind": "unit", "quantity": "time", "unit": "minute", "allow_omitted": true}
            solution_sketch: 'No job in the queue means $x = 0$. At $x = 0$ the prediction is the intercept, so the model predicts a wait of 18 minutes.'
          - problem: 'A company models the resale value of a machine in dollars by $\hat{y} = 20000 - 1500x$, where $x$ is the age in years. By how many dollars does the predicted value change for each additional year?'
            answer: '-1500'
            answer_contract: {"kind": "unit", "quantity": "dollar", "unit": "dollar", "allow_omitted": true}
            solution_sketch: 'The slope is the predicted change in $y$ for each extra unit of $x$. Here the slope is -1500, so the predicted value falls by 1500 dollars each year.'
          - problem: 'The model $\hat{y} = 2 + \tfrac{3}{4}x$ gives the predicted fare in dollars for a taxi ride of $x$ miles. By how many dollars does the predicted fare rise for each additional mile?'
            answer: '3/4'
            answer_contract: {"kind": "unit", "quantity": "dollar", "unit": "dollar", "allow_omitted": true}
            solution_sketch: 'The slope is the predicted change in the fare for one more mile. The slope is 3/4, so each mile adds 3/4 of a dollar to the predicted fare.'
          - problem: 'A gym models its monthly cost in dollars by $\hat{y} = 25 + 4x$, where $x$ is the number of classes attended. How many extra classes go with a predicted rise of 20 dollars in the cost?'
            answer: '5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Each extra class raises the predicted cost by the slope 4 dollars. To get a rise of 20 dollars divide: $20 \div 4 = 5$ extra classes.'
          - problem: 'Two seedlings of the same kind are 4 weeks apart in age. The model $\hat{y} = 12 + 3x$ gives the height in cm at $x$ weeks. How much taller does the model predict the older seedling to be?'
            answer: '12'
            answer_contract: {"kind": "unit", "quantity": "length", "unit": "cm", "allow_omitted": true}
            solution_sketch: 'Each week of age adds the slope 3 cm to the predicted height. Four weeks add $4 \cdot 3 = 12$ cm, so the older seedling is predicted to be 12 cm taller.'
        constraints: 'contexts with stated units; ask for the per-unit change, the value at x = 0, or how many units of x go with a stated change; the reasoning says predicted or associated, never caused'
      - id: kp2
        name: 'r-squared and causation cautions'
        key_prerequisites: [scatterplots-correlation]
        exemplars:
          - problem: 'A regression has $r = 0.8$. What fraction of the variation in $y$ does the line explain?'
            answer: '16/25'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The fraction explained is $r^2 = 0.8^2 = 0.64$. As a fraction $0.64 = 16/25$.'
          - problem: 'A fit has $r^2 = 0.49$ and a negative slope. What is $r$?'
            answer: '-0.7'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Take the square root: $\sqrt{0.49} = 0.7$. The slope is negative, so $r$ has the same sign and $r = -0.7$.'
          - problem: 'A study of children finds a strong positive correlation between shoe size and reading level. Name the lurking variable behind both and explain it.'
            answer: 'Age: older children have bigger feet and also read better, so shoe size does not cause reading skill.'
            answer_contract: {"kind": "written"}
            solution_sketch: 'Older children have bigger feet and also read better. Age is a lurking variable that drives both, so the correlation does not show that shoe size causes reading skill.'
          - problem: 'In a study of plant height and daily sunlight the correlation is $r = 0.9$. What is the coefficient of determination?'
            answer: '81/100'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The coefficient of determination is $r^2 = 0.9^2 = 0.81$. As a fraction $0.81 = 81/100$.'
          - problem: 'A regression line for the test score on the study time has $r^2 = 0.36$ and a positive slope. What is the correlation $r$?'
            answer: '3/5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Take the square root: $\sqrt{0.36} = 0.6$. The slope is positive, so $r = 0.6 = 3/5$.'
          - problem: 'For a regression of gas mileage on the weight of a car, $r = -0.8$. What fraction of the variation in gas mileage does the line not explain?'
            answer: '9/25'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The line explains $r^2 = (-0.8)^2 = 0.64$ of the variation. The rest is $1 - 0.64 = 0.36 = 9/25$.'
          - problem: 'A model of exam scores on the hours of revision has $r = 0.6$. What percent of the variation in the scores does the line explain?'
            answer: '36%'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The share explained is $r^2 = 0.6^2 = 0.36$. That is 36 percent of the variation in the scores.'
          - problem: 'A town finds a correlation of $r = 0.85$ between the monthly ice-cream sales and the monthly number of swimming accidents. Does this show that ice-cream sales cause the accidents?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["no", "it does not", "no it does not", "not necessarily", "correlation is not causation"], ["yes", "it does", "yes it does"]]}
            solution_sketch: 'A strong correlation does not prove cause. Hot weather is a lurking variable: it raises both the ice-cream sales and the number of swimmers, so the answer is no.'
        constraints: 'r values with exact squares; at most two causation-caution items per set'
      - id: kp3
        name: 'From summary statistics to prediction'
        key_prerequisites: [least-squares-line, regression-predictions]
        exemplars:
          - problem: 'A sample gives $\bar{x} = 5$, $\bar{y} = 30$, $s_x = 2$, $s_y = 10$ and $r = 0.8$. Find the least-squares line and use it to predict $y$ at $x = 8$.'
            answer: '42'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The slope is $b = r s_y / s_x = 0.8 \cdot 10 / 2 = 4$. The intercept is $a = 30 - 4 \cdot 5 = 10$, so $\hat{y} = 10 + 4x$ and $\hat{y}(8) = 42$.'
          - problem: 'A sample gives $\bar{x} = 5$, $\bar{y} = 30$, $s_x = 2$, $s_y = 10$ and $r = 0.8$. At $x = 8$ the observed value is $y = 40$. What is the residual?'
            answer: '-2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The line is $\hat{y} = 10 + 4x$, so the prediction at $x = 8$ is 42. The residual is observed minus predicted: $40 - 42 = -2$.'
          - problem: 'The ages $x$ and the heights $y$ of a sample of trees have $\bar{x} = 10$, $\bar{y} = 50$, $s_x = 3$, $s_y = 12$ and $r = 0.75$. Find the equation of the least-squares line.'
            answer: 'y = 20 + 3x'
            answer_contract: {"kind": "polynomial_relation"}
            solution_sketch: 'The slope is $b = 0.75 \cdot 12 / 3 = 3$. The intercept is $a = 50 - 3 \cdot 10 = 20$, so the line is $\hat{y} = 20 + 3x$.'
          - problem: 'A kiosk records the temperature $x$ in degrees Celsius and its sales $y$ in dollars on summer days: $\bar{x} = 20$, $s_x = 5$, $\bar{y} = 300$, $s_y = 60$ and $r = 0.5$. What sales does the least-squares line predict on a day of 28 degrees?'
            answer: '348'
            answer_contract: {"kind": "unit", "quantity": "dollar", "unit": "dollar", "allow_omitted": true}
            solution_sketch: 'The slope is $b = 0.5 \cdot 60 / 5 = 6$ and the intercept is $a = 300 - 6 \cdot 20 = 180$. At $x = 28$ the prediction is $180 + 6 \cdot 28 = 348$ dollars.'
          - problem: 'For a study, $\bar{x} = 12$, $\bar{y} = 60$, $s_x = 4$, $s_y = 10$ and $r = 0.8$. At what value of $x$ does the least-squares line predict $y = 66$?'
            answer: '15'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The slope is $b = 0.8 \cdot 10 / 4 = 2$ and the intercept is $a = 60 - 2 \cdot 12 = 36$. Solve $66 = 36 + 2x$: $x = 30 / 2 = 15$.'
          - problem: 'The weekly study time $x$ in hours and the score $y$ of a class have $\bar{x} = 4$, $\bar{y} = 20$, $s_x = 2$, $s_y = 5$ and $r = 0.4$. A student who studied for 7 hours scored 26. What is her residual?'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The slope is $b = 0.4 \cdot 5 / 2 = 1$ and the intercept is $a = 20 - 1 \cdot 4 = 16$. The line predicts $16 + 7 = 23$, so the residual is $26 - 23 = 3$.'
          - problem: 'A farm records the rainfall $x$ in cm and the crop yield $y$ in tonnes: $\bar{x} = 7$, $\bar{y} = 41$, $s_x = 2$, $s_y = 5$ and $r = 0.8$. What yield does the least-squares line predict for a rainfall of 10 cm?'
            answer: '47'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The slope is $b = 0.8 \cdot 5 / 2 = 2$ and the intercept is $a = 41 - 2 \cdot 7 = 27$. At $x = 10$ the prediction is $27 + 2 \cdot 10 = 47$ tonnes.'
          - problem: 'A least-squares line has slope 2, and the sample means are $\bar{x} = 7$ and $\bar{y} = 41$. What value of $y$ does the line predict at $x = 7$?'
            answer: '41'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The intercept is $a = 41 - 2 \cdot 7 = 27$, so the prediction at $x = 7$ is $27 + 2 \cdot 7 = 41$. The least-squares line always passes through the point $(\bar{x}, \bar{y})$.'
        constraints: 'summary statistics give integer slopes and intercepts; finish with a prediction, a residual, the line itself or the x for a given prediction'
    diagnostic_exemplar:
      problem: 'Summary statistics: $\bar{x} = 6$, $\bar{y} = 20$, $s_x = 2$, $s_y = 8$, $r = 0.5$. Find the least-squares prediction at $x = 10$ and the fraction of the variation in $y$ that the line explains.'
      answer: '$(28, 1/4)$'
      solution_sketch: '$b = r s_y/s_x = 0.5 \cdot 4 = 2$ and $a = 20 - 2 \cdot 6 = 8$, so $\hat{y} = 8 + 2(10) = 28$; the explained fraction is $r^2 = 0.25 = \frac{1}{4}$.'
