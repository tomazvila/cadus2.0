unit: inference
course: probability-statistics
module: "Statistical Inference & Regression"
topics:
  - id: populations-samples
    name: "Populations & Samples"
    core: true
    difficulty: 0.3
    drill: false
    answer_kind: numeric
    expected_time_secs: 90
    prerequisites:
      - id: mean-median-mode
        weight: 0.6
        key: true
    knowledge_points:
      - id: kp1
        name: "Population versus sample"
        key_prerequisites: []
        exemplars:
          - problem: "A health team surveys 150 of a city's 25,000 adults about sleep habits. Which statement correctly names the population and the sample?"
            answer: "population: all 25,000 adults; sample: the 150 surveyed"
            answer_contract: {"kind": "label", "options": [["population: all 25,000 adults; sample: the 150 surveyed"], ["population: the 150 surveyed; sample: all 25,000 adults"], ["population: all adults in the country; sample: the 150 surveyed"], ["population: all 25,000 adults; sample: all 25,000 adults"]]}
            solution_sketch: "Step 1 (population rule): the population is the whole group of interest, all 25,000 adults in the city. Step 2 (sample rule): the sample is the part actually surveyed, the 150 adults. Step 3 (option check): 'population: the 150 surveyed; sample: all 25,000 adults' swaps the groups; 'population: all adults in the country; sample: the 150 surveyed' makes the population too broad; 'population: all 25,000 adults; sample: all 25,000 adults' wrongly makes the sample the whole population. population: all 25,000 adults; sample: the 150 surveyed"
          - problem: "A factory produces 8000 parts each day. An inspector checks 80 of them. Give the population size and the sample size."
            answer: "population = 8000; sample = 80"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "population"}, {"contract": {"kind": "exact"}, "name": "sample"}]}
            solution_sketch: "Step 1 (population rule): the population is the full set of interest, the 8000 parts produced that day. Step 2 (sample rule): the sample is the subset inspected, the 80 parts checked. Step 3 (count rule): write the two counts with the group names. population = 8000; sample = 80"
          - problem: 'A researcher surveys $25$ of the $120$ teachers at a school. How many teachers are not in the sample?'
            answer: "95"
            solution_sketch: '$120 - 25 = 95$ teachers are left out of the sample.'
          - problem: 'A town conducts a census of its $4000$ residents. How many residents are measured?'
            answer: "4000"
            solution_sketch: 'A census measures every member of the population, so all $4000$.'
          - problem: "A quality inspector tests 40 of the 1000 bulbs produced today. Which statement correctly names the population and the sample?"
            answer: "population: all 1000 bulbs made today; sample: the 40 tested"
            answer_contract: {"kind": "label", "options": [["population: all 1000 bulbs made today; sample: the 40 tested"], ["population: the 40 tested bulbs; sample: all 1000 bulbs made today"], ["population: all bulbs made this year; sample: the 40 tested"], ["population: all 1000 bulbs made today; sample: all 1000 bulbs made today"]]}
            solution_sketch: "Step 1 (population rule): the population is all 1000 bulbs produced today, the whole group of interest. Step 2 (sample rule): the sample is the 40 bulbs actually tested. Step 3 (option check): 'population: the 40 tested bulbs; sample: all 1000 bulbs made today' swaps the groups; 'population: all bulbs made this year; sample: the 40 tested' widens the population wrongly; 'population: all 1000 bulbs made today; sample: all 1000 bulbs made today' treats the sample as the whole population. population: all 1000 bulbs made today; sample: the 40 tested"
          - problem: "A marine biologist measures the length of 30 of the 2000 fish in a lake. Give the population size and the sample size."
            answer: "population = 2000; sample = 30"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "population"}, {"contract": {"kind": "exact"}, "name": "sample"}]}
            solution_sketch: "Step 1 (population rule): the population is all 2000 fish in the lake, the whole group of interest. Step 2 (sample rule): the sample is the 30 fish whose lengths are measured. Step 3 (count rule): write the two counts with the group names. population = 2000; sample = 30"
        constraints: "concrete scenarios; the answer names both groups explicitly"
      - id: kp2
        name: "Parameter versus statistic"
        key_prerequisites: [mean-median-mode]
        exemplars:
          - problem: "A sample of 4 students has heights 150, 154, 158, 162 cm. Find the sample mean and state whether it is a parameter or a statistic."
            answer: "verdict = statistic; mean = 156"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["parameter"], ["statistic"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "mean"}]}
            solution_sketch: "The sample data are 150, 154, 158, 162. Step 1: sum the values: 150+154+158+162 = 624. Step 2: divide by the sample size 4: 624/4 = 156, so the sample mean is 156. Step 3: a mean computed from a sample is a statistic. The answer is verdict = statistic; mean = 156."
          - problem: "The symbol xbar denotes the sample mean. For the sample 5, 7, 9, find xbar and state whether xbar is a parameter or a statistic."
            answer: "verdict = statistic; mean = 7"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["parameter"], ["statistic"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "mean"}]}
            solution_sketch: "The sample data are 5, 7, 9. Step 1: sum: 5+7+9 = 21. Step 2: divide by 3: 21/3 = 7, so xbar = 7. Step 3: xbar is computed from a sample, so it is a statistic. The answer is verdict = statistic; mean = 7."
          - problem: "The population salaries 4, 6, 8, 10 have mean mu. Find mu and state whether it is a parameter or a statistic."
            answer: "verdict = parameter; mean = 7"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["parameter"], ["statistic"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "mean"}]}
            solution_sketch: "The population data are 4, 6, 8, 10. Step 1: sum: 4+6+8+10 = 28. Step 2: divide by 4: 28/4 = 7, so mu = 7. Step 3: mu describes the whole population, so it is a parameter. The answer is verdict = parameter; mean = 7."
          - problem: "A sample of 5 bolts has diameters 7, 8, 9, 8, 8 mm. Find the sample mean and state whether it is a parameter or a statistic."
            answer: "verdict = statistic; mean = 8"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["parameter"], ["statistic"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "mean"}]}
            solution_sketch: "The sample data are 7, 8, 9, 8, 8. Step 1: sum: 7+8+9+8+8 = 40. Step 2: divide by 5: 40/5 = 8, so the sample mean is 8. Step 3: the mean is from a sample, so it is a statistic. The answer is verdict = statistic; mean = 8."
          - problem: 'The population $2, 4, 6$ has mean $\mu$. Compute $\mu$.'
            answer: "4"
            solution_sketch: '$\mu = (2+4+6)/3 = 12/3 = 4$ — a parameter, since it describes the whole population.'
          - problem: 'The sample $3, 5, 7, 9$ has mean $\bar{x}$. Compute $\bar{x}$.'
            answer: "6"
            solution_sketch: '$\bar{x} = 24/4 = 6$ — a statistic, since it describes only the sample.'
        constraints: "one classification item and one notation item per set"
      - id: kp3
        name: "Why sample at all"
        key_prerequisites: []
        exemplars:
          - problem: "A city plans a census of 4000 households, and each interview costs 12 dollars. A sample of 400 households is interviewed at the same cost per household. Find the number of dollars the sample saves."
            answer: "43200"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1, census cost: 4000 times 12 equals 48000 dollars. Step 2, sample cost: 400 times 12 equals 4800 dollars. Step 3, subtraction: 48000 minus 4800 gives 43200 dollars. The sample saves 43200 dollars."
          - problem: "A team tests the breaking strength of 25 concrete beams taken from a batch of 500, loading each beam until it fails. State whether this testing ruins the tested beams, and give the number of beams in the batch that stay unbroken."
            answer: "verdict = destructive; intact = 475"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["destructive"], ["non-destructive"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "intact"}]}
            solution_sketch: "The full result has two parts: verdict = destructive and intact = 475. Step 1, classification: loading a beam until it fails leaves that unit broken, so the test is destructive and a census of all 500 would ruin the whole batch. Step 2, subtraction: only the 25 tested beams are ruined, so 500 minus 25 gives 475. The answer is verdict = destructive; intact = 475."
          - problem: 'A factory tests the lifetime of $50$ of the $5000$ bulbs it produced. How many bulbs escape destruction?'
            answer: "4950"
            solution_sketch: '$5000 - 50 = 4950$ bulbs are never tested — sampling spares the rest of the production run.'
          - problem: "A city wants the mean commute of all 50000 downtown workers, but the report is due tomorrow and only 200 interviews can be finished before then. Which single reason forces the use of a sample?"
            answer: "time"
            answer_contract: {"kind": "label", "options": [["time"], ["cost"], ["destruction"], ["precision"]]}
            solution_sketch: "The full scenario is a deadline: only 200 of the 50000 interviews fit before the report is due. Step 1, identify the binding limit: the deadline is what stops the census, so the class is time. Step 2, test each other option against the scenario. The option cost is wrong because no budget limit is given. The option destruction is wrong because an interview does not ruin the person interviewed. The option precision is wrong because a deadline does not control how exact one answer is. The answer is time."
          - problem: 'A fishery has $10000$ cod and a team can measure $100$ of them. The sample is what fraction of the population? Give a fraction in lowest terms.'
            answer: "1/100"
            solution_sketch: '$100/10000 = 1/100$ — a tiny sample suffices to estimate the population mean.'
          - problem: "Checking every one of 3000 households takes 8 minutes per household, while checking a sample of 300 takes the same 8 minutes each. Find the number of hours saved by using the sample."
            answer: "360"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1, census time: 3000 times 8 equals 24000 minutes. Step 2, sample time: 300 times 8 equals 2400 minutes. Step 3, difference and unit change: 24000 minus 2400 equals 21600 minutes, and 21600 divided by 60 gives 360 hours. The number of hours saved is 360."
        constraints: "scenarios where cost, time, or destructive testing forces sampling"
    diagnostic_exemplar:
      problem: 'An inspector tests $50$ of the $5000$ batteries produced in a day; the mean life of the $50$ is $21$ hours. Identify the population, the sample, and whether $21$ hours is a parameter or a statistic.'
      answer: 'Population: all $5000$ batteries; sample: the $50$ tested; $21$ hours is a statistic.'
      answer_contract: {kind: none}
      solution_sketch: 'The population is the whole group under study, the sample the part actually measured; a number computed from the sample is a statistic, one describing the population a parameter.'
    anki_seeds:
      - front: 'Parameter vs statistic?'
        back: 'A parameter describes the population; a statistic describes a sample.'
        type: basic
      - front: 'Which symbols go with the population, and which with the sample?'
        back: 'Population: $\mu, \sigma$. Sample: $\bar{x}, s$.'
        type: basic

  - id: sampling-methods-bias
    name: "Sampling Methods & Bias"
    core: false                # study-design branch; terminal
    difficulty: 0.35
    drill: false
    answer_kind: multi-step
    expected_time_secs: 120
    prerequisites:
      - id: populations-samples
        weight: 0.8
        key: true
    knowledge_points:
      - id: kp1
        name: "Simple random samples"
        key_prerequisites: [populations-samples]
        exemplars:
          - problem: "A student says that a sample of 4 members from a population of 40 is a simple random sample as long as every single member has the same chance of being included. State whether this condition alone is enough for a simple random sample, and give the chance that one named member is included when 4 of the 40 members are drawn. Give the chance as a fraction."
            answer: "verdict = no; chance = 1/10"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["no"], ["yes"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "chance"}]}
            solution_sketch: "A simple random sample of size 4 needs every group of 4 members to have the same chance; the weaker rule of equal chance for each single member is not enough, and choosing yes would ignore that some procedures give each member the same chance without giving every group the same chance. Inclusion chance rule: when 4 of 40 members are drawn, each member has chance 4/40 = 1/10. The answer is verdict = no; chance = 1/10."
          - problem: "A school club places the names of all 18 of its members on identical slips in a bowl, mixes the slips well, and draws 3 slips without replacement to form the sample. State whether this procedure gives every group of 3 members the same chance of being the sample, and give the chance that one named member is among the 3 drawn. Give the chance as a fraction."
            answer: "verdict = yes; chance = 1/6"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["yes"], ["no"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "chance"}]}
            solution_sketch: "Rule of the hat draw: identical slips that are mixed well and drawn without replacement give every group of 3 of the 18 members the same chance, which is the defining property of a simple random sample; saying no would wrongly treat a fair physical draw as unfair. Inclusion chance rule: one named member has chance 3/18 = 1/6. The answer is verdict = yes; chance = 1/6."
          - problem: "A teacher lists the 26 students in a class in alphabetical order and takes the first 6 names on the list as the sample. State whether this gives a simple random sample of 6 students, and give the number of students who were not chosen."
            answer: "verdict = no; notchosen = 20"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["no"], ["yes"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "notchosen"}]}
            solution_sketch: "Rule of a simple random sample: a random mechanism must give every group of 6 students the same chance. Taking the first 6 names in alphabetical order involves no chance at all, so exactly one group is possible and the equal-chance rule fails; saying yes would ignore that a fixed position on a list is not a random draw. Count of students not chosen: 26 - 6 = 20. The answer is verdict = no; notchosen = 20."
          - problem: "A coach draws a slip bearing one of the 12 player names from a box, records the name, puts the slip back, mixes the slips, and repeats this until 4 names are recorded. State whether the recorded list is a simple random sample of 4 different players, and give the greatest number of times the same name could be recorded."
            answer: "verdict = no; repeats = 4"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["no"], ["yes"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "repeats"}]}
            solution_sketch: "Rule of a simple random sample: it is drawn without replacement, so each group of 4 different players has the same chance; drawing with replacement lets one name appear twice, and saying yes would ignore that a repeated name makes some groups of 4 different players impossible to record. Worst case: the same slip can come up on all 4 draws, so the greatest number of recordings of one name is 4. The answer is verdict = no; repeats = 4."
          - problem: "A town has 6000 households. To select a simple random sample, each household is numbered from 0000 to 5999, and the planner reads four-digit strings from a random number table; any string from 6000 to 9999 is thrown away and the next string is read. Find how many of the 10000 possible four-digit strings are thrown away."
            answer: "4000"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Rule of the random number table: four-digit strings run from 0000 to 9999, so there are 10000 possible strings. Counting rule: only the 6000 strings from 0000 to 5999 match a household, so the strings thrown away number 10000 - 6000 = 4000, which keeps every household equally likely to be picked. The answer is 4000."
          - problem: "A simple random sample of 60 members is drawn without replacement from the 480 members of a gym. Find the chance that one named member of the gym is not in the sample. Give the answer as a fraction."
            answer: "7/8"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Rule of equal inclusion chances: in a simple random sample of 60 from 480, each member has chance 60/480 = 1/8 of being in the sample. Complement rule: the chance of not being in the sample is 1 - 1/8 = 7/8. The answer is 7/8."
        constraints: "definitions and yes/no judgments with a stated reason"
      - id: kp2
        name: "Identifying sampling methods"
        key_prerequisites: [populations-samples]
        exemplars:
          - problem: "A grocery store numbers its loyalty cards from 1 to 900. The manager draws one random number between 1 and 30, surveys that card holder, and then surveys every 30th card holder after that. Which sampling method is this?"
            answer: "systematic"
            answer_contract: {"kind": "label", "options": [["systematic"], ["stratified"], ["cluster"], ["convenience"]]}
            solution_sketch: "The full design: 900 numbered cards, one random start between 1 and 30, then a fixed step of 30 along the ordered list. Step 1 (random-start-and-fixed-step rule): a random start plus a fixed step selects every 30th card holder in order, the defining mechanism of this method. Step 2 (wrong options): stratified fails because the list was never split into groups with a draw from each group; cluster fails because no whole groups were chosen and fully surveyed; convenience fails because the start is random, not whoever is easiest to reach. The answer is systematic."
          - problem: "A school splits its 800 students into four year groups of 200 each. It randomly picks 25 students from every year group for a survey about lunch options. State the sampling method used, and give the number of students surveyed."
            answer: "method = stratified; count = 100"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["stratified"], ["cluster"]]}, "name": "method"}, {"contract": {"kind": "exact"}, "name": "count"}]}
            solution_sketch: "The full design: 800 students in four year groups of 200, with 25 students drawn at random from every group. Step 1 (identify the design): members are sampled from every group rather than whole groups being taken, which is the rule of stratified sampling; the wrong option cluster would instead select entire year groups and survey all 200 students in each. Step 2 (multiplication rule): 4 groups times 25 students per group gives 100. The answer is method = stratified; count = 100."
          - problem: "A district has 50 classrooms with 22 students each. An inspector randomly picks 7 classrooms and surveys every student in those classrooms. State the sampling method used, and find how many students are surveyed."
            answer: "method = cluster; count = 154"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["cluster"], ["stratified"]]}, "name": "method"}, {"contract": {"kind": "exact"}, "name": "count"}]}
            solution_sketch: "The full design: 50 classrooms of 22 students, with 7 classrooms drawn at random and every student inside them surveyed. Step 1 (identify the design): whole groups are chosen and fully surveyed, the rule of cluster sampling; the wrong option stratified would instead draw a few students from every one of the 50 classrooms. Step 2 (multiplication rule): 7 classrooms times 22 students each gives 154. The answer is method = cluster; count = 154."
          - problem: "A clinic lists its 616 patients of the day in arrival order. The staff draw a random number from 1 to 11, survey that patient, and then survey every 11th patient after that one. How many patients are surveyed in total?"
            answer: "56"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full design: 616 patients in arrival order, a random start between 1 and 11, then a fixed step of 11. Step 1 (random-start-and-fixed-step rule): one surveyed patient falls in each block of 11 patients along the list. Step 2 (division rule): 616 divided by 11 is exactly 56 complete blocks, so 56 patients are surveyed no matter which of the first 11 starts is drawn. The answer is 56."
          - problem: "A firm has 240 junior staff members, 160 senior staff members and 80 managers. The firm draws a random sample of 60 employees, with the number drawn from each group proportional to the size of the group. How many senior staff members are in the sample?"
            answer: "20"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full design: 480 employees in three groups (240 junior, 160 senior, 80 managers) with a sample of 60 split by group size. Step 1 (proportional-allocation rule): each group contributes its share of the total, since the draw happens within every group. Step 2 (share rule): senior staff are 160 of 480 employees, which is one third. Step 3 (multiply): one third of 60 is 20. The answer is 20."
          - problem: "A valley has 16 sheep farms. A researcher randomly picks 6 of the farms and weighs every sheep on each picked farm. Each farm has exactly 37 sheep. How many sheep are weighed?"
            answer: "222"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full design: 16 farms, 6 drawn at random, and every animal on each selected farm is measured. Step 1 (whole-group rule): the selection picks entire farms and measures everything inside them, so the total is the number of picked farms times the farm size. Step 2 (multiplication rule): 6 farms times 37 sheep gives 222. The answer is 222."
        constraints: "one scenario per method; the scenario names the selection mechanism precisely"
      - id: kp3
        name: "Recognizing bias"
        key_prerequisites: [populations-samples]
        exemplars:
          - problem: 'A website posts a poll that visitors choose to answer. What kind of bias does this invite?'
            answer: 'Voluntary response bias; people with strong opinions are overrepresented.'
          - problem: 'To estimate how much the city exercises, a researcher surveys people at a gym. What is wrong?'
            answer: 'Convenience sampling that undercovers non-gym-goers; the estimate will be too high.'
        constraints: "each scenario exhibits exactly one named bias; answer states the direction of the distortion when asked"
    diagnostic_exemplar:
      problem: 'A radio host asks listeners to call in and vote on a tax proposal. Will the results represent the city? Name the problem.'
      answer: 'No; voluntary response bias — only listeners with strong opinions call in.'
      solution_sketch: 'The sample selects itself: who chooses to call in is not a random draw from the city, and the people with strong views are the ones who bother — voluntary response bias.'
    anki_seeds:
      - front: 'Simple random sample (SRS) of size $n$?'
        back: 'Every group of $n$ population members has the same chance of selection.'
        type: basic
      - front: 'Voluntary response and convenience samples are usually...'
        back: 'Biased — they overrepresent strong opinions or easy-to-reach people.'
        type: basic

  - id: experimental-design-basics
    name: "Experimental Design Basics"
    core: false                # study-design branch; terminal
    difficulty: 0.4
    drill: false
    answer_kind: multi-step
    expected_time_secs: 150
    prerequisites:
      - id: sampling-methods-bias
        weight: 0.7
        key: true
    knowledge_points:
      - id: kp1
        name: "Observational study versus experiment"
        key_prerequisites: [sampling-methods-bias]
        exemplars:
          - problem: "Researchers track the health of people who already chose their own diets over ten years. State the study type and the number of treatments imposed by the researchers."
            answer: "verdict = observational; treatments = 0"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["experiment"], ["observational"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "treatments"}]}
            solution_sketch: "Step 1: apply the deciding question: a treatment is imposed only when the researchers assign it. Step 2: people chose their own diets, so no treatment is imposed, which makes the study observational. Step 3: the number of imposed treatments is 0. The wrong option experiment would mean the researchers assigned the diets, which they did not do. Final answer: verdict = observational; treatments = 0."
          - problem: "Researchers randomly assign volunteers to one of three different sleep programs for a month. State the study type and the number of treatments imposed by the researchers."
            answer: "verdict = experiment; treatments = 3"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["experiment"], ["observational"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "treatments"}]}
            solution_sketch: "Step 1: apply the deciding question: an imposed treatment makes the study an experiment. Step 2: the researchers assign each volunteer a sleep program, so a treatment is imposed and the study is an experiment. Step 3: the three sleep programs are three imposed treatments, so the count is 3. The wrong option observational would mean the volunteers chose their own programs, which the random assignment rules out. Final answer: verdict = experiment; treatments = 3."
          - problem: "For each description, decide if it is an experiment. (1) A company randomly assigns employees to one of three training programs. (2) A manager records the productivity of employees who chose their own break times. (3) A researcher randomly assigns patients to a new drug or a placebo. (4) A pollster questions people who call in to a radio show. How many of the four descriptions are experiments?"
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: apply the deciding question: a description is an experiment only if a treatment is imposed by the researchers. Step 2: description (1) imposes a training program and description (3) imposes a drug, so both are experiments; descriptions (2) and (4) involve no imposed treatment and are observational. Step 3: count the experiments, which gives 2. The answer is 2."
          - problem: "For each description, decide if it is an observational study. (1) A scientist records the growth of plants that were randomly assigned to different fertilizers. (2) A doctor reviews records of patients who chose their own exercise routines. (3) A researcher measures the heart rates of volunteers who selected their own meditation times. (4) A team randomly assigns plots of land to a new seed or an old seed. (5) A pollster questions people who respond to an online ad. How many of the five descriptions are observational studies?"
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: use the deciding question: an observational study has no treatment imposed by the researchers. Step 2: descriptions (2), (3), and (5) have no imposed treatment, so they are observational; descriptions (1) and (4) use random assignment of a treatment and are experiments. Step 3: count the observational studies, which gives 3. The answer is 3."
          - problem: "For each description, decide if it is an experiment. (1) A farmer randomly assigns fields to two irrigation methods. (2) A researcher observes shoppers who choose their own brands. (3) A teacher randomly assigns students to a new app or no app. (4) A company randomly assigns customers to three prices. (5) A scientist randomly assigns mice to a high-fat or low-fat diet. How many of the five descriptions are experiments?"
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: apply the deciding question: a description is an experiment only if a treatment is imposed by the researchers. Step 2: descriptions (1), (3), (4), and (5) involve random assignment of a treatment, so they are experiments; description (2) has no imposed treatment and is observational. Step 3: count the experiments, which gives 4. The answer is 4."
          - problem: "For each description, decide if it is an observational study. (1) A researcher surveys people who chose their own diets. (2) A doctor reviews records of patients who selected their own medications. (3) A scientist measures the heights of volunteers who picked their own exercise. (4) A pollster questions people who call in to a show. (5) A team observes workers who chose their own shifts. How many of the five descriptions are observational studies?"
            answer: "5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: apply the deciding question: an observational study has no treatment imposed by the researchers. Step 2: all five descriptions involve people or sites that were not assigned a treatment by the researchers, so each is observational. Step 3: count the observational studies, which gives 5. The answer is 5."
        constraints: "the deciding question is always whether a treatment is imposed"
      - id: kp2
        name: "Treatments, control, and random assignment"
        key_prerequisites: [sampling-methods-bias]
        exemplars:
          - problem: 'Sixty plants are randomly split: half get a new fertilizer, half get none. Identify the treatment group and the control group.'
            answer: 'Treatment: the fertilized half; control: the unfertilized half.'
          - problem: 'What is the purpose of giving the control group a placebo?'
            answer: 'To keep the groups'' expectations equal, so any difference is due to the treatment itself.'
        constraints: "two-group designs; identify roles or justify a design element"
      - id: kp3
        name: "Confounding and causation"
        key_prerequisites: [sampling-methods-bias]
        exemplars:
          - problem: "A gym chain reports that branches with more personal trainers also sell more protein shakes. Candidates: (1) branch size, (2) trainer salary, (3) local interest in fitness, (4) shake flavor. Give the numbers of the candidates that plausibly drive both the trainer count and the shake sales, in increasing order."
            answer: "1, 3"
            answer_contract: {"kind": "list", "member": {"kind": "exact"}, "ordered": true}
            solution_sketch: "The candidates are branch size, trainer salary, local interest in fitness, and shake flavor. A confounder rule: the variable must plausibly drive both the trainer count and the shake sales. Branch size drives both counts, and local fitness interest drives both; trainer salary and shake flavor each drive only one side. The answer is 1, 3."
          - problem: "A company wants to claim that a new safety training reduces workplace injuries. Which design can support that claim?"
            answer: "Randomized"
            answer_contract: {"kind": "label", "options": [["Randomized"], ["Observational"], ["Before-and-after"], ["Case study"]]}
            solution_sketch: "The four designs are Randomized, Observational, Before-and-after, and Case study. Causation rule: only random assignment balances lurking variables, so a causal claim needs a Randomized design. Observational is wrong because workers who choose the training may already be safer (selection bias); Before-and-after is wrong because injury rates can shift with season or reporting rules and there is no control group; Case study is wrong because one workplace cannot support a general claim. The answer is Randomized."
          - problem: "A hospital compares patients who chose a new drug with patients who chose the usual care and finds faster recovery in the drug group. Candidates: (a) illness severity, (b) age, (c) room number, (d) curtain color. State whether a causal claim is supported, and give the number of candidates that are plausible confounders."
            answer: "verdict = unsupported; n = 2"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["supported"], ["unsupported"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "n"}]}
            solution_sketch: "The candidates are illness severity, age, room number, and curtain color. A confounder must plausibly drive both which drug a patient chose and how fast that patient recovered. Illness severity and age drive both, while room number and curtain color drive neither. With no random assignment, the causal claim is not supported, so the answer is verdict = unsupported; n = 2."
          - problem: "A health study reports that adults who drink diet soda weigh more. Candidates: (1) soda brand logo, (2) age, (3) bottle size, (4) amount of other sugary food eaten. Give the numbers of the candidates that plausibly drive both diet-soda drinking and body weight, in increasing order."
            answer: "2, 4"
            answer_contract: {"kind": "list", "member": {"kind": "exact"}, "ordered": true}
            solution_sketch: "The candidates are soda brand logo, age, bottle size, and amount of other sugary food eaten. A confounder must plausibly drive both diet-soda drinking and body weight. Age drives both, and eating more other sugary food raises weight while going with diet-soda drinking; the logo and bottle size drive neither. The answer is 2, 4."
          - problem: "A store finds that shoppers who carry a loyalty card spend more. The store randomly assigns 240 new shoppers in equal groups; half receive a card and half do not. State whether a causal claim is warranted, and give the number of shoppers who do not receive a card."
            answer: "claim = warranted; n = 120"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["warranted"], ["unwarranted"]]}, "name": "claim"}, {"contract": {"kind": "exact"}, "name": "n"}]}
            solution_sketch: "The store randomly assigns 240 shoppers in equal groups, half to the loyalty card and half to no card. Random assignment balances lurking variables in expectation, so a causal claim is warranted, unlike a comparison of shoppers who chose cards themselves. Half of 240 is 120, so the answer is claim = warranted; n = 120."
          - problem: "A grocery chain tests a new store layout. It randomly assigns 60 stores, with twice as many stores keeping the current layout as switching to the new one. Give the numbers of stores in each group as (new layout, current layout)."
            answer: "(20, 40)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "The object asked for is the pair of store counts written as (new layout, current layout). Let the number of new-layout stores be t, so the current-layout stores number 2t, and 3t = 60 gives t = 20. The answer is (20, 40)."
        constraints: "confounders must plausibly drive both variables; causation claims only from randomized experiments"
    diagnostic_exemplar:
      problem: 'To test a study app, $100$ volunteers are randomly split: $50$ use the app, $50$ do not, and exam scores are compared. Identify the treatment and control groups, and state why random assignment matters.'
      answer: 'Treatment: the $50$ app users; control: the $50$ non-users; random assignment balances lurking variables so score differences can be attributed to the app.'
      solution_sketch: 'The treatment group receives the intervention and the control group supplies the comparison; randomising the split is what balances the lurking variables, which is what licenses reading the difference as caused by the app.'
    anki_seeds:
      - front: 'Only which study design supports cause-and-effect conclusions?'
        back: 'A randomized experiment.'
        type: basic
      - front: 'A confounding variable is...'
        back: 'A third variable that influences both the explanatory and response variables, mixing up their apparent relationship.'
        type: basic

  - id: empirical-rule
    name: "The Empirical Rule"
    core: true
    difficulty: 0.45
    drill: false
    answer_kind: numeric
    expected_time_secs: 90
    prerequisites:
      - id: z-scores
        weight: 0.7
        key: true
      - id: percentages
        weight: 0.4
        key: false
    knowledge_points:
      - id: kp1
        name: "The 68-95-99.7 percentages"
        key_prerequisites: [z-scores, percentages]
        exemplars:
          - problem: 'Heights are normal with mean $170$ cm and SD $6$ cm. What proportion of heights lie between $164$ and $176$ cm? Give a decimal.'
            answer: "0.68"
            solution_sketch: 'That interval is $\mu \pm 1\sigma$, which holds about $68\%$ — a proportion of $0.68$.'
          - problem: 'For a normal distribution, what proportion of values lie within $2$ standard deviations of the mean? Give a decimal.'
            answer: "0.95"
            solution_sketch: 'The empirical rule gives about $95\%$, i.e. $0.95$.'
          - problem: 'Scores are normal with mean $100$ and SD $15$. What proportion of scores lie between $85$ and $115$? Give a decimal.'
            answer: "0.68"
            solution_sketch: 'That interval is $\mu \pm 1\sigma$: about $68\%$, i.e. $0.68$.'
          - problem: 'For a normal distribution, what proportion of values lie within $3$ standard deviations of the mean? Give a decimal.'
            answer: "0.997"
            solution_sketch: 'The empirical rule gives about $99.7\%$, i.e. $0.997$.'
          - problem: "A normal distribution has mean 50. The middle 95% of its values lie between 30 and 70. Find the standard deviation."
            answer: "10"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Empirical rule: the middle 95% of a normal distribution spans mean minus 2 standard deviations to mean plus 2 standard deviations. The given interval 30 to 70 has half-width (70 - 30)/2 = 20. So 2 standard deviations = 20 and the standard deviation is 10."
          - problem: "A normal distribution has standard deviation 4. The middle 99.7% of its values lie between 38 and 62. Find the mean."
            answer: "50"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Empirical rule: the middle 99.7% of a normal distribution spans mean minus 3 standard deviations to mean plus 3 standard deviations. Here 3 standard deviations = 3 times 4 = 12, so the interval is mean minus 12 to mean plus 12. The midpoint of 38 and 62 is (38 + 62)/2 = 50, so the mean is 50."
        constraints: "intervals land exactly on mu +/- 1, 2, or 3 sigma; area answers are decimal proportions"
      - id: kp2
        name: "Translating to raw intervals"
        key_prerequisites: [z-scores]
        exemplars:
          - problem: 'Marks (out of $10$) are normal with mean $6$ and SD $1$. Give the interval that holds the middle $95\%$ of marks.'
            answer: '$(4, 8)$'
            solution_sketch: '$\mu \pm 2\sigma = 6 \pm 2$.'
          - problem: 'Times are normal with mean $60$ and SD $5$. Give the interval that holds the middle $99.7\%$.'
            answer: '$(45, 75)$'
            solution_sketch: '$\mu \pm 3\sigma = 60 \pm 15$.'
          - problem: 'Marks are normal with mean $70$ and SD $5$. What is the lower endpoint of the interval holding the middle $95\%$ of marks?'
            answer: "60"
            solution_sketch: 'The middle $95\%$ is $\mu \pm 2\sigma$; the lower endpoint is $70 - 2 \cdot 5 = 60$.'
          - problem: 'Times are normal with mean $50$ and SD $4$. What is the upper endpoint of the interval holding the middle $99.7\%$ of times?'
            answer: "62"
            solution_sketch: 'The middle $99.7\%$ is $\mu \pm 3\sigma$; the upper endpoint is $50 + 3 \cdot 4 = 62$.'
          - problem: 'Heights are normal with mean $160$ and SD $8$. What is the upper endpoint of the interval holding the middle $68\%$ of heights?'
            answer: "168"
            solution_sketch: 'The middle $68\%$ is $\mu \pm 1\sigma$; the upper endpoint is $160 + 8 = 168$.'
          - problem: 'Marks are normal with mean $40$ and SD $6$. What is the lower endpoint of the interval holding the middle $99.7\%$ of marks?'
            answer: "22"
            solution_sketch: 'The middle $99.7\%$ is $\mu \pm 3\sigma$; the lower endpoint is $40 - 3 \cdot 6 = 22$.'
        constraints: "mean and SD are whole numbers; endpoints come out to integers"
      - id: kp3
        name: "Percent outside an interval"
        key_prerequisites: [z-scores, percentages]
        exemplars:
          - problem: 'For a normal distribution, what proportion of values lie more than $2$ standard deviations from the mean? Give a decimal.'
            answer: "0.05"
            solution_sketch: '$1 - 0.95 = 0.05$, split between the two tails.'
          - problem: 'Heights are normal with mean $170$ and SD $6$. What proportion of heights lie outside $(158, 182)$? Give a decimal.'
            answer: "0.05"
            solution_sketch: '$158$ and $182$ are $\mu \pm 2\sigma$; the area outside is $1 - 0.95 = 0.05$.'
          - problem: 'For a normal distribution, what proportion of values lie more than $1$ standard deviation from the mean? Give a decimal.'
            answer: "0.32"
            solution_sketch: '$1 - 0.68 = 0.32$.'
          - problem: 'For a normal distribution, what proportion of values lie more than $3$ standard deviations from the mean? Give a decimal.'
            answer: "0.003"
            solution_sketch: '$1 - 0.997 = 0.003$.'
          - problem: "For a normal distribution, a symmetric interval about the mean leaves proportion 0.05 of the values outside it. How many standard deviations from the mean does this interval extend?"
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Complement rule: the area inside the interval is 1 - 0.05 = 0.95. Empirical rule: the interval that holds 0.95 of the values extends 2 standard deviations from the mean. The interval extends 2 standard deviations from the mean, so the answer is 2."
          - problem: "Battery lifetimes are normal with mean 250 hours and standard deviation 4 hours. A symmetric interval about the mean leaves proportion 0.003 of lifetimes outside it. Give this interval as (low, high)."
            answer: "(238, 262)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "Complement rule: the area inside is 1 - 0.003 = 0.997, so the interval is the 99.7 percent interval of the empirical rule, which extends 3 standard deviations each way. Empirical rule applied to the mean and SD: 250 - 3*4 = 238 and 250 + 3*4 = 262. The interval is (238, 262)."
        constraints: "complements of the 68/95/99.7 intervals only; no tail-splitting yet; area answers are decimal proportions"
    diagnostic_exemplar:
      problem: 'Times are normal with mean $60$ and SD $5$. What proportion of times lie outside the interval $(50, 70)$? Give a decimal.'
      answer: '0.05'
      solution_sketch: '$(50, 70) = \mu \pm 2\sigma$ holds $95\%$; outside: $1 - 0.95 = 0.05$.'
    anki_seeds:
      - front: 'Empirical rule percentages for $\pm 1\sigma$, $\pm 2\sigma$, $\pm 3\sigma$?'
        back: 'About $68\%$, $95\%$, and $99.7\%$.'
        type: basic
      - front: 'Percent of a normal distribution more than $2\sigma$ from the mean?'
        back: 'About $5\%$ ($2.5\%$ in each tail).'
        type: basic

  - id: normal-distribution
    name: "Normal Distribution Reasoning"
    core: true
    difficulty: 0.5
    drill: false
    answer_kind: numeric
    expected_time_secs: 150
    prerequisites:
      - id: empirical-rule
        weight: 0.8
        key: true
      - id: z-scores
        weight: 0.4
        key: false
    knowledge_points:
      - id: kp1
        name: "One-sided areas from symmetry"
        key_prerequisites: [empirical-rule]
        exemplars:
          - problem: 'Marks (out of $10$) are normal with mean $6.5$ and SD $1$. What proportion of marks exceed $8.5$? Give a decimal.'
            answer: "0.025"
            solution_sketch: '$8.5 = \mu + 2\sigma$; the area outside $\pm 2\sigma$ is $0.05$, split evenly, so $0.025$ above.'
          - problem: 'Marks (out of $10$) are normal with mean $6.5$ and SD $1$. What proportion fall below $5.5$? Give a decimal.'
            answer: "0.16"
            solution_sketch: '$5.5 = \mu - 1\sigma$; the area outside $\pm 1\sigma$ is $0.32$, so $0.16$ in the lower tail.'
        constraints: "cut points at whole-sigma marks; use symmetry to halve tail areas; area answers are decimal proportions"
      - id: kp2
        name: "Combining regions and percentiles"
        key_prerequisites: [empirical-rule]
        exemplars:
          - problem: 'For a normal distribution, what proportion of values lie between $\mu - 2\sigma$ and $\mu + \sigma$? Give a decimal.'
            answer: "0.815"
            solution_sketch: 'Half of $0.95$ below the mean plus half of $0.68$ above it: $0.475 + 0.34 = 0.815$.'
          - problem: 'Approximately what percentile is a value at $\mu + \sigma$? Give the percentile number.'
            answer: "84"
            solution_sketch: '$50\%$ below the mean plus $34\%$ between $\mu$ and $\mu + \sigma$ gives $84\%$ below.'
          - problem: "A variable follows a normal distribution with mean $\\mu$ and standard deviation $\\sigma$. What proportion of its values lie between $\\mu - 3\\sigma$ and $\\mu + \\sigma$? Give the answer to 4 decimals."
            answer: "0.8385"
            answer_contract: {"decimals": 4, "kind": "approx"}
            solution_sketch: "The region from three standard deviations below the mean to one standard deviation beyond it splits into the lower half out to three standard deviations and the upper half out to one standard deviation. Step 1 (empirical rule): 0.997 within three standard deviations gives a lower half of 0.4985. Step 2 (empirical rule): 0.68 within one standard deviation gives an upper half of 0.34. Step 3 (add the halves): 0.4985 + 0.34 = 0.8385. The answer is 0.8385."
          - problem: "In a normal distribution, a value sits at $\\mu + 2\\sigma$. What percentile corresponds to that value? Give the percentile number."
            answer: "97.5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The value at two standard deviations beyond the mean is the upper edge of the middle 95 percent region. Step 1 (empirical rule): 95 percent lie within two standard deviations, so 5 percent lie outside. Step 2 (symmetry): half of the 5 percent, that is 2.5 percent, lies beyond the upper edge. Step 3 (percentile): 100 - 2.5 = 97.5. The percentile is 97.5."
          - problem: "For a normal distribution with mean $\\mu$ and standard deviation $\\sigma$, what proportion of values fall between $\\mu + 2\\sigma$ and $\\mu + 3\\sigma$? Give the answer to 4 decimals."
            answer: "0.0235"
            answer_contract: {"decimals": 4, "kind": "approx"}
            solution_sketch: "The band from two to three standard deviations beyond the mean is the part of the middle 99.7 percent that lies outside the middle 95 percent, in one tail. Step 1 (empirical rule): 0.997 - 0.95 = 0.047 lies in the two outer tails together. Step 2 (symmetry): one tail holds 0.047 / 2 = 0.0235. The answer is 0.0235."
          - problem: "A value of a normal variable is located at $\\mu - 3\\sigma$. What percentile does that value have? Give the percentile number."
            answer: "0.15"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The value at three standard deviations below the mean is the lower edge of the middle 99.7 percent region. Step 1 (empirical rule): 99.7 percent lie within three standard deviations, so 0.3 percent lie outside. Step 2 (symmetry): half of 0.3 percent, that is 0.15 percent, lies below the lower edge. The percentile is 0.15."
        constraints: "asymmetric intervals with whole-sigma endpoints; answers from 68/95/99.7 arithmetic only, as a decimal proportion or a percentile number"
      - id: kp3
        name: "Comparing values across distributions"
        key_prerequisites: [z-scores, empirical-rule]
        exemplars:
          - problem: 'Test A (out of $10$) is normal with mean $7$, SD $0.5$; test B with mean $6$, SD $1$. Which is relatively better: $8$ on A or $7.5$ on B? Give the z-score of the better one.'
            answer: "2"
            solution_sketch: '$z_A = \frac{8-7}{0.5} = 2$, $z_B = \frac{7.5-6}{1} = 1.5$; the higher $z$ is more exceptional.'
          - problem: 'A value sits at $\mu + 2\sigma$ in a normal distribution. Approximately what percentile is it? Give the percentile number.'
            answer: "97.5"
            solution_sketch: '$50\% + 47.5\% = 97.5\%$ of values lie below $\mu + 2\sigma$.'
          - problem: "Distribution A has mean 20 and standard deviation 4. Distribution B has mean 50 and standard deviation 8. The value 28 comes from A and the value 74 comes from B. Which value is more exceptional relative to its own distribution? Give the z-score of the more exceptional value."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: Convert the first value with the z-score rule: z = (28 - 20)/4 = 2. Step 2: Convert the second value: z = (74 - 50)/8 = 3. Step 3: Compare absolute z-scores; 3 is larger, so the value from B is more exceptional. The answer is 3."
          - problem: "A value of 84 belongs to a normal distribution with mean 75 and standard deviation 6. A value of 60 belongs to a normal distribution with mean 50 and standard deviation 5. Which value has the larger absolute z-score? Give that absolute z-score."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: Use the z-score rule for the first value: z = (84 - 75)/6 = 1.5. Step 2: Use the z-score rule for the second value: z = (60 - 50)/5 = 2. Step 3: The absolute z-scores are 1.5 and 2; the larger is 2. The answer is 2."
          - problem: "In distribution A the mean is 40 and the standard deviation is 8. A value of 52 in A has z-score 1.5. In distribution B the mean is 70 and the standard deviation is 6. What value in B has the same z-score as 52 in A? Give the value."
            answer: "79"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: Check the z-score of 52 in A: z = (52 - 40)/8 = 1.5. Step 2: Use the same z-score in B: value = mean + z * SD = 70 + 1.5 * 6. Step 3: Compute 70 + 9 = 79. The answer is 79."
          - problem: "A value has z-score 2 in distribution A. Another value has z-score 3 in distribution B. Using the empirical rule, find the percentile of the value with the higher z-score. Give the answer to 2 decimals."
            answer: "99.85"
            answer_contract: {"decimals": 2, "kind": "approx"}
            solution_sketch: "Step 1: Apply the empirical rule: z = 2 gives about 97.5% below. Step 2: Apply the empirical rule: z = 3 gives about 99.85% below. Step 3: The value with z = 3 has the higher percentile. The answer is 99.85."
        constraints: "z-scores are halves or whole numbers; comparisons decided by the larger |z|"
    diagnostic_exemplar:
      problem: 'Marks (out of $10$) are normal with mean $6.5$ and SD $1$. What proportion of marks fall between $4.5$ and $7.5$? Give a decimal.'
      answer: '0.815'
      solution_sketch: '$\mu - 2\sigma$ to $\mu + \sigma$: $0.95/2 + 0.68/2 = 0.475 + 0.34 = 0.815$.'
    anki_seeds:
      - front: 'What fraction of a normal distribution lies above $\mu + 2\sigma$?'
        back: 'About $2.5\%$.'
        type: basic
      - front: 'A value at $\mu + \sigma$ sits at approximately which percentile?'
        back: 'The 84th ($50\% + 34\%$ below it).'
        type: basic

  - id: standard-error
    name: "Standard Error of the Sample Mean"
    core: true
    difficulty: 0.5
    drill: false
    answer_kind: numeric
    expected_time_secs: 120
    prerequisites:
      - id: variance-standard-deviation
        weight: 0.7
        key: true
      - id: square-roots
        weight: 0.4
        key: false
    knowledge_points:
      - id: kp1
        name: "Computing SE = sigma over root n"
        key_prerequisites: [variance-standard-deviation, square-roots]
        exemplars:
          - problem: 'A population has $\sigma = 12$. For samples of size $n = 9$, find the standard error of the sample mean.'
            answer: "4"
            solution_sketch: '$\operatorname{SE} = \sigma/\sqrt{n} = 12/3 = 4$.'
          - problem: 'A population has $\mu = 40$, $\sigma = 10$. For $n = 25$, give (mean of $\bar{x}$, SE of $\bar{x}$) as an ordered pair.'
            answer: '$(40, 2)$'
            solution_sketch: '$E[\bar{x}] = \mu = 40$; $\operatorname{SE} = 10/\sqrt{25} = 2$.'
          - problem: 'A population has $\sigma = 15$. For samples of size $n = 25$, find the standard error of the sample mean.'
            answer: "3"
            solution_sketch: '$\operatorname{SE} = 15/\sqrt{25} = 15/5 = 3$.'
          - problem: 'A population has $\sigma = 14$. For samples of size $n = 49$, find the standard error of the sample mean.'
            answer: "2"
            solution_sketch: '$\operatorname{SE} = 14/\sqrt{49} = 14/7 = 2$.'
          - problem: 'A population has $\mu = 60$ and $\sigma = 8$. For $n = 16$, find the standard error of the sample mean as a single number.'
            answer: "2"
            solution_sketch: '$\operatorname{SE} = 8/\sqrt{16} = 8/4 = 2$ (the mean of $\bar{x}$ is $\mu = 60$).'
        constraints: "n a perfect square (4, 9, 16, 25, 36, 100); sigma divisible by sqrt(n)"
      - id: kp2
        name: "Averages vary less than individuals"
        key_prerequisites: [variance-standard-deviation]
        exemplars:
          - problem: 'A population has $\sigma = 18$. Give (SD of a single observation, SE of the mean of $36$ observations) as an ordered pair.'
            answer: '$(18, 3)$'
            solution_sketch: '$18/\sqrt{36} = 3$ — averages cluster far more tightly than single values.'
          - problem: 'One die roll has SD $\sigma$. By what factor is the SD of the average of $100$ rolls smaller?'
            answer: "10"
            solution_sketch: 'Averaging $n$ values shrinks the spread by $\sqrt{n}$: $\sqrt{100} = 10$, so a single roll varies far more.'
          - problem: 'A population has $\sigma = 20$. Find the standard error of the mean of $100$ observations.'
            answer: "2"
            solution_sketch: '$\operatorname{SE} = 20/\sqrt{100} = 20/10 = 2$ — far tighter than the SD $20$ of single values.'
          - problem: 'A single observation of a population has SD $24$. By what factor is the SD of the mean of $36$ observations smaller?'
            answer: "6"
            solution_sketch: 'Averaging $n$ values shrinks the spread by $\sqrt{n} = \sqrt{36} = 6$.'
          - problem: 'A population has $\sigma = 9$. Find the standard error of the mean of $81$ observations.'
            answer: "1"
            solution_sketch: '$\operatorname{SE} = 9/\sqrt{81} = 9/9 = 1$.'
          - problem: "A machine produces parts with a standard deviation of $30$ grams. For a sample of $25$ parts, find the standard error of the sample mean in grams."
            answer: "6"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: Use the standard error formula $\\operatorname{SE} = \\sigma/\\sqrt{n}$. Step 2: Substitute the values, so $\\operatorname{SE} = 30/\\sqrt{25}$. Step 3: Since $\\sqrt{25} = 5$, this gives $30/5 = 6$. The standard error is 6."
        constraints: "one computation and one shrink-factor item; n a perfect square"
      - id: kp3
        name: "How sample size changes the SE"
        key_prerequisites: [variance-standard-deviation, square-roots]
        exemplars:
          - problem: 'The standard error of $\bar{x}$ at sample size $n$ is $6$. What is it at sample size $4n$?'
            answer: "3"
            solution_sketch: '$\operatorname{SE} \propto 1/\sqrt{n}$; quadrupling $n$ halves the SE.'
          - problem: 'A population has $\sigma = 20$. What sample size makes the standard error equal to $5$?'
            answer: "16"
            solution_sketch: '$20/\sqrt{n} = 5$ gives $\sqrt{n} = 4$, so $n = 16$.'
          - problem: 'A population has $\sigma = 12$. What sample size makes the standard error of the sample mean equal to $2$?'
            answer: "36"
            solution_sketch: '$12/\sqrt{n} = 2$ gives $\sqrt{n} = 6$, so $n = 36$.'
          - problem: 'The standard error of $\bar{x}$ at sample size $n$ is $2$. By what factor must the sample size be multiplied to make the standard error equal to $1$?'
            answer: "4"
            solution_sketch: 'Halving the SE requires $\sqrt{n}$ to double, so $n$ is multiplied by $2^2 = 4$.'
          - problem: "The standard error of the sample mean at sample size n is 8. What is the standard error at sample size 16n?"
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Use the rule SE = sigma/sqrt(n). The full object at sample size n is SE = sigma/sqrt(n). At sample size 16n it is sigma/sqrt(16n) = sigma/(4 sqrt(n)) = SE/4. With SE = 8, the new standard error is 8/4 = 2."
          - problem: "For a population with standard deviation 45, what sample size gives a standard error of 5?"
            answer: "81"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Use the standard error formula SE = sigma/sqrt(n). The full object is SE = 45/sqrt(n). Set this equal to 5: 45/sqrt(n) = 5. Then sqrt(n) = 45/5 = 9, so n = 81."
        constraints: "n and target SE chosen so sqrt(n) is a whole number"
    diagnostic_exemplar:
      problem: 'A population has $\sigma = 18$. What sample size makes the standard error of the sample mean equal to $3$?'
      answer: '36'
      solution_sketch: '$18/\sqrt{n} = 3$ gives $\sqrt{n} = 6$, so $n = 36$.'
    anki_seeds:
      - front: 'Standard error of the sample mean?'
        back: '$\operatorname{SE} = \dfrac{\sigma}{\sqrt{n}}$.'
        type: basic
      - front: 'To cut the standard error in half, multiply the sample size by {{c1::4}}.'
        back: '4'
        type: cloze

