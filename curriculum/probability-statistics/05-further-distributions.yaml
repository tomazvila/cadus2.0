unit: further-distributions
course: probability-statistics
module: "Further Probability Distributions"
topics:
  - id: poisson-distribution
    name: "Poisson Distributions"
    core: false                # terminal named-distribution destination, like binomial/geometric/uniform
    difficulty: 0.55
    drill: false
    answer_kind: numeric
    expected_time_secs: 150
    prerequisites:
      - {id: natural-exponential-function, weight: 0, key: false}    # conceptual: e^-lambda is supplied, never computed
      - id: binomial-probability
        weight: 0.6
        key: true
      - id: discrete-random-variables
        weight: 0.5
        key: true
      - id: common-natural-logarithms
        weight: 0.3
        key: false
    knowledge_points:
      - id: kp1
        name: "The Poisson probability formula"
        key_prerequisites: [discrete-random-variables, natural-exponential-function]   # L1: no logarithm appears in this topic; e^-lambda is the real dependency
        step_check:
          step: 'Multiply by $e^{-3}$'
          question: 'Why does the calculation end by multiplying the fraction by $e^{-3}$?'
          options:
            - 'It is the probability that exactly one croissant is sold during that hour'
            - 'It is the same factor for all counts, so the probabilities add to $1$'
            - 'It turns the rate per hour into a probability for a single hour'
            - 'It cancels the factorial in the denominator, so only $3^2$ remains'
          answer: 'It is the same factor for all counts, so the probabilities add to $1$'
          why: 'The factor $e^{-\lambda}$ does not depend on $k$. Multiplying every term $\lambda^k/k!$ by it makes the probabilities of all counts add to $1$.'
        exemplars:
          - problem: 'A bakery sells on average $3$ croissants per hour, and the number sold in an hour follows a Poisson distribution. Using $e^{-3} \approx 0.0498$, find the probability that exactly $2$ croissants are sold in an hour, to three decimal places.'
            answer: '0.224'
            answer_contract: {"kind": "approx", "decimals": 3}
            solution_sketch: 'The formula is $P(X=k)=e^{-\lambda}\lambda^k/k!$. With $\lambda=3$ and $k=2$ the fraction is $3^2/2!=9/2=4.5$. Multiply by $e^{-3}\approx0.0498$ to get $0.2241$, which is $0.224$ to three decimal places.'
          - problem: 'A radio station receives $120$ calls in $40$ minutes, at a steady average rate, and the number of calls in a minute follows a Poisson distribution. Using $e^{-3} \approx 0.0498$, find the probability that exactly $1$ call arrives in a given minute, to four decimal places.'
            answer: '0.1494'
            answer_contract: {"kind": "approx", "decimals": 4}
            solution_sketch: 'The average rate is $120/40=3$ calls per minute, so $\lambda=3$. Then $P(X=1)=e^{-3}\cdot3^1/1!=3\cdot0.0498=0.1494$.'
          - problem: '$X$ is a Poisson variable with mean $2$. Using $e^{-2} \approx 0.1353$, find $P(X=3)$ to four decimal places.'
            answer: '0.1804'
            answer_contract: {"kind": "approx", "decimals": 4}
            solution_sketch: 'With $\lambda=2$ and $k=3$ the fraction is $2^3/3!=8/6$. Multiply by $e^{-2}\approx0.1353$ to get $0.1353\cdot8/6=0.1804$.'
          - problem: 'A switchboard receives on average $1.5$ calls per minute, and the number of calls in a minute follows a Poisson distribution. Using $e^{-1.5} \approx 0.2231$, find the probability of exactly $2$ calls in a given minute, to four decimal places.'
            answer: '0.2510'
            answer_contract: {"kind": "approx", "decimals": 4}
            solution_sketch: 'With $\lambda=1.5$ and $k=2$ the fraction is $1.5^2/2!=2.25/2=1.125$. Multiply by $e^{-1.5}\approx0.2231$ to get $0.2231\cdot1.125=0.2510$.'
          - problem: 'For a Poisson variable $X$ with mean $2$, write $P(X=2)$ exactly, in terms of $e$.'
            answer: '2e^(-2)'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Put $\lambda=2$ and $k=2$ into $e^{-\lambda}\lambda^k/k!$. The fraction is $2^2/2!=2$, so $P(X=2)=2e^{-2}$.'
          - problem: 'A website receives $12$ sign-ups in $4$ hours at a steady average rate, and the number of sign-ups in an hour follows a Poisson distribution. Using $e^{-3} \approx 0.0498$, find the probability of exactly $5$ sign-ups in an hour, to four decimal places.'
            answer: '0.1008'
            answer_contract: {"kind": "approx", "decimals": 4}
            solution_sketch: 'The average rate is $12/4=3$ sign-ups per hour, so $\lambda=3$. The fraction is $3^5/5!=243/120=2.025$, and $0.0498\cdot2.025=0.1008$.'
          - problem: 'For a Poisson variable with mean $4$, how many times as likely is exactly $3$ events as exactly $2$ events?'
            answer: '4/3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The ratio is $P(X=3)/P(X=2)=\dfrac{4^3/3!}{4^2/2!}=\dfrac{4}{3}$. The factor $e^{-4}$ is the same in both and cancels, so the ratio is $\lambda/k=4/3$ for $k=3$.'
          - problem: 'Sam says that for a Poisson variable with mean $1.5$, $P(X=2)=e^{-1.5}\cdot1.5^2=0.5020$ when $e^{-1.5} \approx 0.2231$. What is the correct value, to four decimal places?'
            answer: '0.2510'
            answer_contract: {"kind": "approx", "decimals": 4}
            solution_sketch: 'Sam left out the factor $1/k!$. The correct value is $e^{-1.5}\cdot1.5^2/2!=0.2231\cdot2.25/2=0.2510$.'
        constraints: 'lambda in {1, 1.5, 2, 3}; k <= 5; the needed value of e^{-lambda} is always supplied in the problem and the answer agrees with the unrounded value at the stated number of decimals; includes rates found by dividing a count by a time and one exact-form item'
      - id: kp2
        name: "Mean and variance are both lambda"
        key_prerequisites: [discrete-random-variables]
        step_check:
          step: 'For a Poisson variable the variance equals the mean, so $\operatorname{Var}(X)=\lambda$'
          question: 'Why can the variance of a Poisson variable be read straight from its mean?'
          options:
            - 'Every random variable has a variance that is equal to its own mean, whatever its type'
            - 'Rare events show almost no spread, so the variance is the same as the mean'
            - 'The variance of any count of events is the square of its mean'
            - 'A Poisson variable has one parameter, $\lambda$, equal to its mean and variance'
          answer: 'A Poisson variable has one parameter, $\lambda$, equal to its mean and variance'
          why: 'The Poisson distribution has a single parameter $\lambda$, and both its mean and its variance equal $\lambda$. This is special to Poisson variables.'
        exemplars:
          - problem: 'The number of typing errors on a page follows a Poisson distribution with mean $4$. Find the variance of the number of errors.'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'For a Poisson variable the variance equals the mean. The mean is $4$, so the variance is $4$.'
          - problem: 'A Poisson variable has variance $25$. Find its standard deviation.'
            answer: '5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The standard deviation is the square root of the variance. So it is $\sqrt{25}=5$, and the mean is also $25$.'
          - problem: 'The number of calls to a help line in an hour follows a Poisson distribution with standard deviation $3$. How many calls per hour does the line receive on average?'
            answer: '9'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The variance is $3^2=9$. For a Poisson variable the mean equals the variance, so the average is $9$ calls per hour.'
          - problem: 'The number of defects on a metal sheet is Poisson with mean $36$. Find the standard deviation of the number of defects.'
            answer: '6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The variance equals the mean, which is $36$. The standard deviation is $\sqrt{36}=6$.'
          - problem: 'Requests to a server in one minute follow a Poisson distribution with mean $5$. Find the variance of the number of requests in $10$ minutes.'
            answer: '50'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Over $10$ minutes the mean number of requests is $10\cdot5=50$. The count is still Poisson, and the variance equals the mean, so it is $50$.'
          - problem: 'A Poisson count over $4$ hours has variance $20$. How many events occur per hour on average?'
            answer: '5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The mean over $4$ hours equals the variance, so it is $20$. Dividing by the $4$ hours gives an average of $20/4=5$ events per hour.'
          - problem: 'A count has sample mean $6$ and sample variance $15$ over a long record. Is a Poisson model consistent with these figures?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["no", "it is not consistent", "not consistent", "inconsistent", "not poisson", "it is not poisson", "no it is not"], ["yes", "it is consistent", "consistent", "poisson", "it is poisson", "yes it is"]]}
            solution_sketch: 'For a Poisson variable the mean and the variance are equal. Here the mean is $6$ but the variance is $15$, so the figures do not fit a Poisson model.'
          - problem: 'A Poisson variable has mean $9$. Find its standard deviation.'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The variance equals the mean, $9$. The standard deviation is $\sqrt{9}=3$.'
        constraints: 'lambda a perfect square whenever the standard deviation is asked for; answers integers; window rescaling and one verdict item on mean versus variance'
      - id: kp3
        name: "Complements and changing the window"
        key_prerequisites: [natural-exponential-function]                              # L1: kp3 is window-rescaling/complements — nothing binomial, no logs
        step_check:
          step: 'Take the complement'
          question: 'Why is $P(X \ge 1)$ found as $1-P(X=0)$ instead of adding the probabilities of $1, 2, 3, \dots$ events?'
          options:
            - 'Because the formula only gives probabilities for one value of $k$ at a time'
            - 'Because the complement changes the mean from $\lambda$ to $1-\lambda$'
            - 'Because all outcomes add to $1$, so "at least one" is all except "none"'
            - 'Because adding endlessly many terms never gives a finite answer'
          answer: 'Because all outcomes add to $1$, so "at least one" is all except "none"'
          why: 'The events "none" and "at least one" cover every outcome once, so their probabilities add to $1$. One term replaces an endless sum.'
        try_first:
          problem: 'A manuscript has on average $0.5$ typos per page, in a Poisson process. How many pages make the mean number of typos equal to $3$?'
          answer_contract: {"kind": "exact"}
          answer: '6'
          reveal: 'The mean over a window is the rate times the length of the window. Here $0.5\cdot n=3$, so $n=6$ pages. Every Poisson question over a longer window starts by rescaling $\lambda$.'
        exemplars:
          - problem: 'Typos in a manuscript occur as a Poisson process with mean $0.4$ per page. For a $5$-page chapter, using $e^{-2} \approx 0.1353$, find the probability of at least one typo, to four decimal places.'
            answer: '0.8647'
            answer_contract: {"kind": "approx", "decimals": 4}
            solution_sketch: 'Over $5$ pages the mean is $5\cdot0.4=2$. Then $P(X\ge1)=1-P(X=0)=1-e^{-2}=1-0.1353=0.8647$.'
          - problem: 'Flaws in a fiber cable occur as a Poisson process with mean $1$ per kilometer. For a $4$-kilometer stretch, using $e^{-4} \approx 0.0183$, find the probability of no flaws, to four decimal places.'
            answer: '0.0183'
            answer_contract: {"kind": "approx", "decimals": 4}
            solution_sketch: 'Over $4$ kilometers the mean is $4\cdot1=4$. Then $P(X=0)=e^{-4}\approx0.0183$.'
          - problem: 'A shop has $24$ customers in $8$ hours at a steady average rate, and the arrivals form a Poisson process. Using $e^{-1} \approx 0.3679$, find the probability that no customer arrives in a given $20$-minute period, to four decimal places.'
            answer: '0.3679'
            answer_contract: {"kind": "approx", "decimals": 4}
            solution_sketch: 'The rate is $24/8=3$ customers per hour. A $20$-minute period is $1/3$ of an hour, so the mean is $3\cdot\frac13=1$. Then $P(X=0)=e^{-1}\approx0.3679$.'
          - problem: 'A server logs errors as a Poisson process with mean $2$ per hour. The probability of no errors in a $t$-hour interval is $e^{-6}$. Find $t$, in hours.'
            answer: '3'
            answer_contract: {"kind": "unit", "quantity": "time", "unit": "h", "allow_omitted": true}
            solution_sketch: 'In $t$ hours the mean is $2t$, so $P(X=0)=e^{-2t}$. Setting $e^{-2t}=e^{-6}$ gives $2t=6$, so $t=3$.'
          - problem: 'A machine breaks down as a Poisson process at an unknown rate of $r$ breakdowns per year. The probability of at least one breakdown in a $2$-year period is $1-e^{-8}$. Find $r$.'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'In $2$ years the mean is $2r$, and $P(X\ge1)=1-e^{-2r}$. Matching $1-e^{-2r}=1-e^{-8}$ gives $2r=8$, so $r=4$.'
          - problem: 'Buses arrive at a stop as a Poisson process with mean $0.5$ per hour. Over a $10$-hour service day, using $e^{-5} \approx 0.0067$, find the probability of at least one bus, to four decimal places.'
            answer: '0.9933'
            answer_contract: {"kind": "approx", "decimals": 4}
            solution_sketch: 'Over $10$ hours the mean is $10\cdot0.5=5$. Then $P(X\ge1)=1-e^{-5}=1-0.0067=0.9933$.'
          - problem: 'Mia says that a Poisson count with mean $0.5$ per page has $P(\text{no typos})=e^{-0.5}$ on a $6$-page chapter. Using $e^{-3} \approx 0.0498$, what is the correct probability of no typos, to four decimal places?'
            answer: '0.0498'
            answer_contract: {"kind": "approx", "decimals": 4}
            solution_sketch: 'Mia used the mean for one page. Over $6$ pages the mean is $6\cdot0.5=3$, so $P(X=0)=e^{-3}\approx0.0498$.'
          - problem: 'Cars pass a checkpoint as a Poisson process with an average of $1.5$ per minute. Using $e^{-3} \approx 0.0498$, find the probability that exactly $3$ cars pass in $2$ minutes, to three decimal places.'
            answer: '0.224'
            answer_contract: {"kind": "approx", "decimals": 3}
            solution_sketch: 'Over $2$ minutes the mean is $2\cdot1.5=3$. Then $P(X=3)=e^{-3}\cdot3^3/3!=0.0498\cdot4.5=0.2241$, which is $0.224$ to three decimal places.'
        constraints: 'window rescaling multiplies or divides lambda; at-least-one questions go through the complement of P(X = 0); e^{-lambda} supplied or kept exact'
    diagnostic_exemplar:
      problem: 'Typos in a manuscript occur as a Poisson process with mean $0.75$ per page. For a $4$-page chapter, using $e^{-3} \approx 0.0498$, find the probability of at least one typo, to four decimal places.'
      answer: '0.9502'
      solution_sketch: '$\lambda = 4 \cdot 0.75 = 3$; $P(X \ge 1) = 1 - e^{-3} \approx 1 - 0.0498 = 0.9502$.'
    anki_seeds:
      - front: 'Poisson probability formula?'
        back: '$P(X = k) = e^{-\lambda} \dfrac{\lambda^k}{k!}$.'
        type: basic
      - front: 'Mean and variance of a Poisson($\lambda$) variable?'
        back: 'Both equal $\lambda$.'
        type: basic
      - front: 'When is a count well modelled as Poisson?'
        back: 'Rare, independent events occurring at a constant average rate over a fixed window.'
        type: basic

  - id: continuous-random-variables
    name: "Continuous Random Variables & Density"
    core: false                # sits on the supplemental uniform-distribution branch; consumed only by the (supplemental) exponential topic — kept supplemental rather than flipping uniform-distribution back to core (R-2)
    difficulty: 0.5
    drill: false
    answer_kind: numeric
    expected_time_secs: 150
    prerequisites:
      - id: uniform-distribution
        weight: 0.7
        key: true
      - id: geometric-probability-models
        weight: 0.4
        key: false
      - id: area-triangles-quadrilaterals
        weight: 0.4
        key: false
    knowledge_points:
      - id: kp1
        name: "Probability as area under a density"
        key_prerequisites: [uniform-distribution]
        step_check:
          step: 'Multiply the width by the height (density) to find the area'
          question: 'Why does multiplying the width of the interval by the density give the probability?'
          options:
            - 'The density is itself the probability of each single point in the interval'
            - 'Probabilities are always found by multiplying two numbers from the problem'
            - 'The probability is the area of a rectangle whose sides are width and height'
            - 'Multiplying width by height makes the answer smaller than $1$ in every problem'
          answer: 'The probability is the area of a rectangle whose sides are width and height'
          why: 'Probability is area under the density curve. When the density is constant, the region is a rectangle, and its area is width times height.'
        exemplars:
          - problem: 'A continuous random variable $X$ has constant density $f(x)=\frac{1}{8}$ on $[0,8]$ and $0$ elsewhere. Find $P(3 \le X \le 7)$.'
            answer: '1/2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Because the density is constant, the probability is a rectangle area. The width is $7-3=4$ and the height is $\frac18$, so $P=4\cdot\frac18=\frac12$.'
          - problem: 'A random variable $X$ is spread evenly over the interval $[0,4]$, so its density has a constant height $h$ there and is $0$ elsewhere. Find $h$.'
            answer: '1/4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The total area under a density is $1$. The rectangle has width $4$ and height $h$, so $4h=1$ and $h=\frac14$.'
          - problem: 'The delay of a train is spread evenly over $0$ to $15$ minutes, so its density is constant on $[0,15]$. Find the probability that the delay is more than $12$ minutes.'
            answer: '1/5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The density has height $\frac1{15}$, since the width $15$ must give area $1$. The interval from $12$ to $15$ has width $3$, so the probability is $3\cdot\frac1{15}=\frac15$.'
          - problem: 'The length of a metal rod, in centimeters, is spread evenly between $40$ and $60$, so its density is constant on $[40,60]$ and $0$ elsewhere. Find the probability that a rod is between $45$ and $52$ centimeters long.'
            answer: '7/20'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The interval $[40,60]$ has width $20$, so the density has height $\frac1{20}$. The part from $45$ to $52$ has width $7$, so the probability is $7\cdot\frac1{20}=\frac7{20}$.'
          - problem: '$X$ is a continuous random variable with a constant density on $[0,8]$ and $0$ elsewhere. Find $P(X=5)$.'
            answer: '0'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A single point has zero width, so it covers zero area under the density. For any continuous random variable $P(X=c)=0$, so $P(X=5)=0$.'
          - problem: 'A density has the constant height $0.05$ on an interval $[0,b]$ and is $0$ elsewhere. Find $b$.'
            answer: '20'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The rectangle with width $b$ and height $0.05$ must have area $1$. So $0.05\,b=1$, and $b=1/0.05=20$.'
          - problem: 'A number $X$ is chosen at random so that every value in the interval $[2,10]$ is equally likely. Find the probability that $X$ lies between $4$ and $5.5$.'
            answer: '3/16'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The interval $[2,10]$ has width $8$, so the density has height $\frac18$. The part from $4$ to $5.5$ has width $1.5$, so the probability is $1.5\cdot\frac18=\frac{3}{16}$.'
          - problem: '$X$ is uniform on $[0,10]$, so its density is constant there. Find the probability that $X<2$ or $X>8$.'
            answer: '2/5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The density has height $\frac1{10}$. The two end pieces have widths $2$ and $2$, so together the width is $4$ and the probability is $4\cdot\frac1{10}=\frac25$.'
        constraints: 'constant densities on intervals with integer or half-integer end points; total-area-1, single-point and complement items; answers exact fractions, decimals or 0; includes items that need a division'
      - id: kp2
        name: "Triangular densities"
        key_prerequisites: [area-triangles-quadrilaterals, geometric-probability-models]
        step_check:
          step: 'Find the height at $x = 3$'
          question: 'Why must the height of the triangle be found at $x = 3$?'
          options:
            - 'The right edge of the triangle is at $x = 3$, and its height there is $f(3)$'
            - 'The density is largest at $x = 3$ in every problem of this kind'
            - 'Heights of triangles are always measured at the middle of the interval, not at an end'
            - 'The value $f(3)$ is the probability $P(X=3)$ of that single point'
          answer: 'The right edge of the triangle is at $x = 3$, and its height there is $f(3)$'
          why: 'The event $X \le 3$ is the region under the line from $0$ to $3$. Its right edge is at $x=3$, and the line has height $f(3)$ there.'
        exemplars:
          - problem: '$X$ has density $f(x)=\frac{x}{8}$ on $[0,4]$ and $0$ elsewhere. Find $P(X \le 2)$.'
            answer: '1/4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The region under the line from $0$ to $2$ is a triangle with base $2$ and height $f(2)=\frac14$. Its area is $\frac12\cdot2\cdot\frac14=\frac14$.'
          - problem: '$X$ has density $f(x)=\frac{x}{2}$ on $[0,2]$ and $0$ elsewhere. Find $P(X \ge 1)$.'
            answer: '3/4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The left part is a triangle with base $1$ and height $f(1)=\frac12$, so $P(X\le1)=\frac12\cdot1\cdot\frac12=\frac14$. By the complement, $P(X\ge1)=1-\frac14=\frac34$.'
          - problem: 'The time in minutes that a customer spends at a self-checkout has density $f(x)=\frac{x}{50}$ on $[0,10]$ and $0$ elsewhere. Find the probability that a customer spends at least $6$ minutes.'
            answer: '16/25'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The part up to $6$ minutes is a triangle with base $6$ and height $f(6)=\frac{6}{50}=\frac{3}{25}$. Its area is $\frac12\cdot6\cdot\frac3{25}=\frac9{25}$, so the probability of at least $6$ minutes is $1-\frac9{25}=\frac{16}{25}$.'
          - problem: 'The function $f(x)=kx$ on $[0,6]$, with $f(x)=0$ elsewhere, is a density. Find $k$.'
            answer: '1/18'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The total area is a triangle with base $6$ and height $6k$, so $\frac12\cdot6\cdot6k=18k$. Setting $18k=1$ gives $k=\frac1{18}$.'
          - problem: '$X$ has density $f(x)=\frac{x}{72}$ on $[0,12]$ and $0$ elsewhere. Find $P(6 \le X \le 9)$.'
            answer: '5/16'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The area up to $9$ is a triangle with base $9$ and height $\frac9{72}=\frac18$, which is $\frac12\cdot9\cdot\frac18=\frac9{16}$. The area up to $6$ is $\frac12\cdot6\cdot\frac1{12}=\frac14$. The difference is $\frac9{16}-\frac14=\frac5{16}$.'
          - problem: 'The time in hours until a sensor first fires has density $f(x)=\frac{x}{32}$ on $[0,8]$ and $0$ elsewhere. Find the probability that it fires at $5$ hours or later.'
            answer: '39/64'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The area up to $5$ is a triangle with base $5$ and height $\frac5{32}$, so $\frac12\cdot5\cdot\frac5{32}=\frac{25}{64}$. The probability of $5$ hours or later is $1-\frac{25}{64}=\frac{39}{64}$.'
          - problem: '$X$ has density $f(x)=\frac{x}{8}$ on $[0,4]$ and $0$ elsewhere. Find the value $t$ with $P(X \le t)=\frac14$.'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The area up to $t$ is a triangle with base $t$ and height $\frac t8$, so $P(X\le t)=\frac12\cdot t\cdot\frac t8=\frac{t^2}{16}$. Setting $\frac{t^2}{16}=\frac14$ gives $t^2=4$, so $t=2$.'
        constraints: 'linear densities f(x) = x/c on [0, b] with c = b^2/2 so the total area is 1; probabilities are triangle, complement or difference areas; one item finds the constant k and one finds a boundary t; exact fractions'
      - id: kp3
        name: "The cumulative distribution function"
        key_prerequisites: [uniform-distribution]
        step_check:
          step: 'The probability between two values is the difference of the cdf values, $P(2<X\le5)=F(5)-F(2)$'
          question: 'Why is $F(2)$ subtracted from $F(5)$?'
          options:
            - 'The smaller value is always subtracted so that the answer is positive'
            - '$F(2)$ is the probability of the single value $2$, which must be removed'
            - 'Subtracting turns a cumulative value into a density value, as in calculus'
            - '$F(5)$ holds all probability up to $5$; removing $F(2)$ leaves the rest'
          answer: '$F(5)$ holds all probability up to $5$; removing $F(2)$ leaves the rest'
          why: '$F(5)=P(X\le5)$ includes everything up to $2$ as well. Removing $F(2)=P(X\le2)$ leaves exactly $P(2<X\le5)$.'
        exemplars:
          - problem: '$X$ is uniform on $[0,10]$ with cumulative distribution function $F(x)=\frac{x}{10}$ for $0 \le x \le 10$. Find $F(4)$.'
            answer: '2/5'
            answer_contract: {"kind": "exact"}
            solution_sketch: '$F(4)=P(X\le4)$, and for this $X$ it equals $\frac{4}{10}=\frac25$.'
          - problem: 'The cumulative distribution function of $X$ is $F(x)=\frac{x}{10}$ for $0 \le x \le 10$. Find the median of $X$, the value $m$ with $F(m)=\frac12$.'
            answer: '5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The median satisfies $\frac{m}{10}=\frac12$. Multiplying both sides by $10$ gives $m=5$.'
          - problem: 'The waiting time $T$ in minutes at a clinic has cumulative distribution function values $F(2)=0.3$ and $F(5)=0.8$. Find $P(2 < T \le 5)$.'
            answer: '0.5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The probability between the two values is the difference of the cumulative values. So $P(2<T\le5)=F(5)-F(2)=0.8-0.3=0.5$.'
          - problem: '$X$ has cumulative distribution function $F(x)=\frac{x^2}{25}$ for $0 \le x \le 5$. Find $F(3)$.'
            answer: '9/25'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Substitute $x=3$ into the formula. Then $F(3)=\frac{3^2}{25}=\frac{9}{25}$.'
          - problem: 'A delivery takes between $4$ and $16$ days, equally likely at any time in that range, so $F(x)=\frac{x-4}{12}$ for $4 \le x \le 16$. By which day have $\frac34$ of all deliveries arrived?'
            answer: '13'
            answer_contract: {"kind": "unit", "quantity": "time", "unit": "day", "allow_omitted": true}
            solution_sketch: 'We need the value $c$ with $F(c)=\frac34$. So $\frac{c-4}{12}=\frac34$, which gives $c-4=9$ and $c=13$.'
          - problem: 'The cumulative distribution function of a component lifetime, in years, has $F(3)=0.35$. Find the probability that the component lasts longer than $3$ years.'
            answer: '0.65'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The cumulative value $F(3)=0.35$ is the probability of lasting at most $3$ years. The probability of lasting longer is $1-0.35=0.65$.'
          - problem: '$X$ has cumulative distribution function $F(x)=\frac{x^2}{16}$ for $0 \le x \le 4$. Find the value $c$ with $P(X>c)=0.19$.'
            answer: '3.6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Since $P(X>c)=1-F(c)=0.19$, we need $F(c)=0.81$. Then $\frac{c^2}{16}=0.81$, so $c^2=12.96$ and $c=3.6$.'
        constraints: "cdf given explicitly or by two table values; probabilities as F-differences; medians and percent points from F(c) = target with integer solutions"
    diagnostic_exemplar:
      problem: '$X$ has density $f(x) = \frac{x}{8}$ on $[0, 4]$ and $0$ elsewhere, with cumulative distribution function $F(x) = \frac{x^2}{16}$ on $[0, 4]$. Use the cdf to find $P(1 < X \le 3)$ as a fraction.'
      answer: '1/2'
      solution_sketch: '$F(3) - F(1) = \frac{9}{16} - \frac{1}{16} = \frac{8}{16} = \frac{1}{2}$ (the same as the area of the density strip between $1$ and $3$).'
    anki_seeds:
      - front: 'For a continuous random variable, $P(a \le X \le b)$ equals...'
        back: 'The area under the density curve between $a$ and $b$ (total area $= 1$).'
        type: basic
      - front: '$P(X = c)$ for a continuous random variable?'
        back: '$0$ — a single point carries no area.'
        type: basic
      - front: 'The cumulative distribution function $F(x)$ is defined as...'
        back: '$F(x) = P(X \le x)$.'
        type: basic

  - id: exponential-distribution
    name: "The Exponential Distribution"
    core: false                # terminal named-distribution destination
    difficulty: 0.6
    drill: false
    answer_kind: numeric
    expected_time_secs: 150
    prerequisites:
      - {id: natural-exponential-function, weight: 0.3, key: false}  # reasons about e^(-lambda t) as a function of t
      - id: continuous-random-variables
        weight: 0.7
        key: true
      - id: common-natural-logarithms
        weight: 0.4
        key: false
      - id: poisson-distribution
        weight: 0.3
        key: false
    knowledge_points:
      - id: kp1
        name: "Survival probabilities and the cdf"
        key_prerequisites: [continuous-random-variables, common-natural-logarithms]
        step_check:
          step: 'The probability of surviving beyond time $t$ is $P(X>t)=e^{-\lambda t}$'
          question: 'Why does the exponent contain the product $\lambda t$ and not the rate $\lambda$ alone?'
          options:
            - 'The product $\lambda t$ converts the rate into a percentage'
            - 'Time $t$ is multiplied in only to make the exponent negative'
            - 'Survival depends on the rate alone, and $t$ only fixes the units'
            - 'Survival gets less likely with a higher rate and with more time'
          answer: 'Survival gets less likely with a higher rate and with more time'
          why: 'A higher rate $\lambda$ means events come sooner, and a longer time $t$ gives more chance for the first event. Both make survival less likely, so both appear in the exponent.'
        exemplars:
          - problem: 'The lifetime $X$ of a bulb, in hours, is exponential with rate $\lambda=0.5$ per hour. Using $e^{-1} \approx 0.3679$, find the probability that the bulb lasts more than $2$ hours, to four decimal places.'
            answer: '0.3679'
            answer_contract: {"kind": "approx", "decimals": 4}
            solution_sketch: 'The survival probability is $P(X>t)=e^{-\lambda t}$. Here $\lambda t=0.5\cdot2=1$, so $P(X>2)=e^{-1}\approx0.3679$.'
          - problem: 'The lifetime $X$ of a lamp, in hours, is exponential with rate $\lambda=0.5$ per hour. Using $e^{-1} \approx 0.3679$, find the probability that the lamp fails within $2$ hours, to four decimal places.'
            answer: '0.6321'
            answer_contract: {"kind": "approx", "decimals": 4}
            solution_sketch: 'Failing within $2$ hours is the complement of lasting more than $2$ hours. So $P(X\le2)=1-e^{-1}=1-0.3679=0.6321$.'
          - problem: 'The lifetime $X$ of a battery, in days, is exponential with rate $\lambda=0.35$ per day. Using $e^{-2.1} \approx 0.1225$, find the probability that the battery lasts more than $6$ days, to four decimal places.'
            answer: '0.1225'
            answer_contract: {"kind": "approx", "decimals": 4}
            solution_sketch: 'The product is $\lambda t=0.35\cdot6=2.1$. So $P(X>6)=e^{-2.1}\approx0.1225$.'
          - problem: 'The waiting time $X$ at a service desk, in hours, is exponential with rate $\lambda=0.6$ per hour. Using $e^{-0.9} \approx 0.4066$, find the probability of waiting at most $1.5$ hours, to four decimal places.'
            answer: '0.5934'
            answer_contract: {"kind": "approx", "decimals": 4}
            solution_sketch: 'The product is $\lambda t=0.6\cdot1.5=0.9$. So $P(X\le1.5)=1-e^{-0.9}=1-0.4066=0.5934$.'
          - problem: 'The lifetime $X$ of a device, in years, is exponential with rate $\lambda=0.4$ per year. Using $e^{-0.4} \approx 0.6703$ and $e^{-1.6} \approx 0.2019$, find $P(1 < X \le 4)$ to four decimal places.'
            answer: '0.4684'
            answer_contract: {"kind": "approx", "decimals": 4}
            solution_sketch: 'The probability is $P(X>1)-P(X>4)=e^{-0.4}-e^{-1.6}$, because $\lambda\cdot1=0.4$ and $\lambda\cdot4=1.6$. This is $0.6703-0.2019=0.4684$.'
          - problem: 'The lifetime of a lamp, in hours, is exponential with an unknown rate $\lambda$ per hour. The probability that the lamp lasts longer than $5$ hours is $e^{-1.5}$. Find $\lambda$.'
            answer: '0.3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The survival probability is $e^{-5\lambda}$. Setting $e^{-5\lambda}=e^{-1.5}$ gives $5\lambda=1.5$, so $\lambda=1.5/5=0.3$.'
          - problem: 'A phone call lasts on average $4$ minutes, and its duration is exponential. Using $e^{-1.5} \approx 0.2231$, find the probability that a call lasts more than $6$ minutes, to four decimal places.'
            answer: '0.2231'
            answer_contract: {"kind": "approx", "decimals": 4}
            solution_sketch: 'The mean is $4$ minutes, so the rate is $\lambda=1/4=0.25$ per minute. Then $\lambda t=0.25\cdot6=1.5$, and $P(X>6)=e^{-1.5}\approx0.2231$.'
          - problem: 'The lifetime $X$ of a part, in hours, is exponential with rate $0.2$ per hour. Write $P(X>3)$ exactly, in terms of $e$.'
            answer: 'e^(-0.6)'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The survival probability is $e^{-\lambda t}$. With $\lambda=0.2$ and $t=3$ the exponent is $-0.2\cdot3=-0.6$, so $P(X>3)=e^{-0.6}$.'
        constraints: 'lambda t comes out to a value whose e^{-lambda t} is supplied in the problem and agrees with the unrounded value at four decimals; some rates come from a mean (a division); one item is exact in terms of e'
      - id: kp2
        name: "Mean and median"
        key_prerequisites: [continuous-random-variables, common-natural-logarithms]
        step_check:
          step: 'The mean of an exponential variable is $E[X]=\frac{1}{\lambda}$'
          question: 'Why does a larger rate $\lambda$ give a smaller mean waiting time?'
          options:
            - 'A higher rate means events come more often, so the typical wait is shorter'
            - 'A larger rate spreads the density over a longer range of times'
            - 'The mean is the rate multiplied by a fixed number, so it grows with $\lambda$'
            - 'The density at zero is $\lambda$, so a larger $\lambda$ moves the mean to the right'
          answer: 'A higher rate means events come more often, so the typical wait is shorter'
          why: 'If events arrive more often, the time to the next one is shorter on average. This is why the mean is $1/\lambda$ and falls as $\lambda$ rises.'
        exemplars:
          - problem: 'The time between arrivals at a bank is exponential with rate $0.25$ per minute. Find the mean time between arrivals.'
            answer: '4'
            answer_contract: {"kind": "unit", "quantity": "time", "unit": "min", "allow_omitted": true}
            solution_sketch: 'The mean of an exponential variable is the reciprocal of its rate. So the mean is $\frac{1}{0.25}=4$ minutes.'
          - problem: 'The lifetime of a machine part is exponential and averages $10$ years. Find its failure rate per year.'
            answer: '0.1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The rate is the reciprocal of the mean. So $\lambda=\frac{1}{10}=0.1$ per year.'
          - problem: '$X$ is exponential with rate $\lambda=0.5$. Using $\ln 2 \approx 0.6931$, find the median of $X$ to three decimal places.'
            answer: '1.386'
            answer_contract: {"kind": "approx", "decimals": 3}
            solution_sketch: 'The median $m$ solves $e^{-\lambda m}=\frac12$, so $m=\frac{\ln2}{\lambda}=\frac{0.6931}{0.5}=1.3862$. To three decimal places this is $1.386$.'
          - problem: 'The time between faults of a machine is exponential with rate $\lambda=0.125$ per hour. Find the mean time between faults.'
            answer: '8'
            answer_contract: {"kind": "unit", "quantity": "time", "unit": "h", "allow_omitted": true}
            solution_sketch: 'The mean is the reciprocal of the rate. So the mean is $\frac{1}{0.125}=8$ hours.'
          - problem: 'The service time at a counter is exponential with mean $2.5$ minutes. Find the rate $\lambda$ per minute.'
            answer: '0.4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The rate is the reciprocal of the mean. So $\lambda=\frac{1}{2.5}=0.4$ per minute.'
          - problem: 'The waiting time at a help desk is exponential with rate $\lambda=0.1$ per minute. Using $\ln 2 \approx 0.6931$, find the median waiting time to three decimal places.'
            answer: '6.931'
            answer_contract: {"kind": "approx", "decimals": 3}
            solution_sketch: 'The median $m$ solves $e^{-0.1m}=\frac12$, so $m=\frac{\ln2}{0.1}=\frac{0.6931}{0.1}=6.931$ minutes.'
          - problem: 'The lifetime of a component is exponential with some rate $\lambda$. Using $e^{-1} \approx 0.3679$, find the probability that the component lasts longer than its own mean lifetime, to four decimal places.'
            answer: '0.3679'
            answer_contract: {"kind": "approx", "decimals": 4}
            solution_sketch: 'The mean is $1/\lambda$, so at the mean $\lambda t=\lambda\cdot\frac1\lambda=1$. Then $P(X>\text{mean})=e^{-1}\approx0.3679$, whatever the rate.'
        constraints: 'rates are reciprocals of integers or nice decimals; median items supply ln 2 and ask for three decimals; the mean is asked with a time unit'
      - id: kp3
        name: "Memorylessness and the Poisson connection"
        key_prerequisites: [continuous-random-variables, poisson-distribution]
        step_check:
          step: 'by memorylessness those $8$ hours are irrelevant'
          question: 'Why do the hours already survived not change the probability of lasting longer?'
          options:
            - 'The machine is replaced after the $8$ hours, so a brand new one starts again'
            - 'Survival probabilities always ignore the first hours of any lifetime'
            - 'An exponential lifetime has no memory, so a used part is as good as new'
            - 'The rate $\lambda$ falls to zero once the machine has run for a while'
          answer: 'An exponential lifetime has no memory, so a used part is as good as new'
          why: 'For an exponential variable $P(X>s+t\mid X>s)=P(X>t)$. The chance of lasting $t$ more hours is the same at every age.'
        exemplars:
          - problem: 'A component''s lifetime is exponential with rate $0.5$ per hour, and it has already survived $5$ hours. Using $e^{-1.5} \approx 0.2231$, find the probability that it survives at least $3$ more hours, to four decimal places.'
            answer: '0.2231'
            answer_contract: {"kind": "approx", "decimals": 4}
            solution_sketch: 'By memorylessness the $5$ hours already survived do not matter. The probability is $P(X>3)=e^{-0.5\cdot3}=e^{-1.5}\approx0.2231$.'
          - problem: 'Buses arrive at a stop as a Poisson process at an average rate of $3$ per hour, so the waiting time between buses is exponential. Find the mean waiting time between buses.'
            answer: '20'
            answer_contract: {"kind": "unit", "quantity": "time", "unit": "min", "allow_omitted": true}
            solution_sketch: 'The mean waiting time is $\frac1\lambda=\frac13$ hour. Since an hour has $60$ minutes, this is $\frac13\cdot60=20$ minutes.'
          - problem: 'A machine part has an exponential lifetime with rate $0.8$ per year, and it has already lasted $2$ years. Using $e^{-0.8} \approx 0.4493$, find the probability that it lasts at least $1$ more year, to four decimal places.'
            answer: '0.4493'
            answer_contract: {"kind": "approx", "decimals": 4}
            solution_sketch: 'The $2$ years already survived are discarded, so the probability is $P(X>1)=e^{-0.8\cdot1}=e^{-0.8}\approx0.4493$.'
          - problem: 'A server''s time until failure is exponential with rate $0.6$ per month, and it has already run for $7$ months. Using $e^{-0.9} \approx 0.4066$, find the probability that it runs at least $1.5$ more months, to four decimal places.'
            answer: '0.4066'
            answer_contract: {"kind": "approx", "decimals": 4}
            solution_sketch: 'Memorylessness discards the $7$ months, so the probability is $P(X>1.5)=e^{-0.6\cdot1.5}=e^{-0.9}\approx0.4066$.'
          - problem: 'Emails arrive as a Poisson process at an average rate of $4$ per hour. Find the mean waiting time between two emails.'
            answer: '15'
            answer_contract: {"kind": "unit", "quantity": "time", "unit": "min", "allow_omitted": true}
            solution_sketch: 'The waiting time is exponential with mean $\frac14$ hour. In minutes this is $\frac14\cdot60=15$.'
          - problem: 'Calls arrive as a Poisson process, on average one call every $12$ minutes. What is the rate of calls per hour?'
            answer: '5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'An hour has $60$ minutes, and one call comes every $12$ minutes. The rate is $60\div12=5$ calls per hour.'
          - problem: 'A lamp has an exponential lifetime and has already burned for $100$ hours. Compared with a new lamp, is it more likely, less likely or equally likely to last another $10$ hours?'
            answer: 'equally likely'
            answer_contract: {"kind": "label", "options": [["equally likely", "equal", "the same", "just as likely", "same", "same chance", "the same chance", "equal chance"], ["more likely", "more", "higher"], ["less likely", "less", "lower"]]}
            solution_sketch: 'An exponential lifetime is memoryless. The chance of lasting another $10$ hours does not depend on the $100$ hours already burned, so it is equal to that of a new lamp.'
          - problem: 'Dan says that a component with an exponential lifetime of rate $0.2$ per hour, which has already survived $6$ hours, survives at least $5$ more hours with probability $e^{-0.2\cdot11}$. Using $e^{-1} \approx 0.3679$, what is the correct probability, to four decimal places?'
            answer: '0.3679'
            answer_contract: {"kind": "approx", "decimals": 4}
            solution_sketch: 'Dan added the $6$ hours already survived to the $5$ more hours. By memorylessness only the $5$ more hours count, so $P=e^{-0.2\cdot5}=e^{-1}\approx0.3679$.'
        constraints: 'memoryless items state the past survival explicitly and expect it to be discarded; Poisson-connection items convert between a rate per hour and a mean wait in minutes, in both directions; one verdict item'
    diagnostic_exemplar:
      problem: 'A component''s lifetime is exponential with rate $\lambda = 0.25$ per hour, and it has already survived $6$ hours. Using $e^{-1} \approx 0.3679$, find the probability it survives at least $4$ more hours, to four decimal places.'
      answer: '0.3679'
      solution_sketch: 'Memorylessness discards the $6$ hours: $P = e^{-0.25 \cdot 4} = e^{-1} \approx 0.3679$.'
    anki_seeds:
      - front: 'Exponential survival probability?'
        back: '$P(X > t) = e^{-\lambda t}$.'
        type: basic
      - front: 'Mean of an exponential variable with rate $\lambda$?'
        back: '$\dfrac{1}{\lambda}$.'
        type: basic
      - front: 'Memoryless property of the exponential distribution?'
        back: '$P(X > s + t \mid X > s) = P(X > t)$ — past survival does not change the future.'
        type: basic

  - id: joint-distributions
    name: "Joint Distributions & Marginals"
    core: false                # feeds only the supplemental covariance topic; joint/covariance is a terminal enrichment branch here
    difficulty: 0.5
    drill: false
    answer_kind: numeric
    expected_time_secs: 150
    prerequisites:
      - id: discrete-random-variables
        weight: 0.6
        key: true
      - id: two-way-frequency-tables
        weight: 0.5
        key: true
      - id: independent-events
        weight: 0.4
        key: false
    knowledge_points:
      - id: kp1
        name: "Reading a joint probability table"
        key_prerequisites: [discrete-random-variables, two-way-frequency-tables]
        step_check:
          step: 'Subtract the sum from 1 to find $d$'
          question: 'Why is the sum of the known cells subtracted from $1$?'
          options:
            - 'All four cells together cover every outcome, so they must add to $1$'
            - 'The missing cell is always the complement of the largest cell that is known'
            - 'Subtracting from $1$ turns the sum of the cells into a percentage'
            - 'Each cell of a joint table must be smaller than the cell above it, in every table'
          answer: 'All four cells together cover every outcome, so they must add to $1$'
          why: 'Every outcome of $(X,Y)$ falls in exactly one cell, so all cells add to $1$. The missing cell is what is left after the known ones.'
        exemplars:
          - problem: 'The random variables $X$ and $Y$ each take the values $0$ and $1$. Their joint probabilities are $P(0,0)=0.1$, $P(0,1)=0.4$, $P(1,0)=0.2$ and $P(1,1)=d$. Find $d$.'
            answer: '0.3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The four cells together cover every possible outcome, so they add to $1$. Then $d=1-(0.1+0.4+0.2)=1-0.7=0.3$.'
          - problem: 'For $X$ and $Y$, the joint probabilities are $P(0,0)=0.2$, $P(0,1)=0.3$, $P(1,0)=0.1$ and $P(1,1)=0.4$. Find $P(X=Y)$.'
            answer: '0.6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The event $X=Y$ consists of the cells $(0,0)$ and $(1,1)$. Adding them gives $0.2+0.4=0.6$.'
          - problem: 'A cafe records, for each customer, $X=1$ if the customer buys a drink and $Y=1$ if the customer buys a cake, and $0$ otherwise. The joint probabilities are $P(0,0)=0.15$, $P(0,1)=0.25$, $P(1,0)=0.35$ and $P(1,1)=0.25$. What is the probability that a customer buys a drink or a cake, or both?'
            answer: '0.85'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The event is every cell except $(0,0)$. So the probability is $0.25+0.35+0.25=0.85$, which is also $1-0.15$.'
          - problem: 'The joint probabilities of $X$ and $Y$ are $P(0,0)=0.40$, $P(0,1)=0.15$, $P(1,0)=0.20$ and $P(1,1)=0.25$. Find $P(X+Y=1)$.'
            answer: '0.35'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The sum $X+Y=1$ happens in the cells $(0,1)$ and $(1,0)$. Adding them gives $0.15+0.20=0.35$.'
          - problem: 'A shop records whether a day is a weekday ($X=0$) or weekend ($X=1$) and the number of promotions $Y\in\{0,1,2\}$ it runs. The joint probabilities are $P(0,0)=0.12$, $P(0,1)=0.08$, $P(0,2)=0.10$, $P(1,0)=0.18$, $P(1,1)=0.22$ and $P(1,2)=0.30$. Find $P(X=0 \text{ or } Y=1)$.'
            answer: '0.52'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The event contains the cells $(0,0)$, $(0,1)$, $(0,2)$ and $(1,1)$. Adding them gives $0.12+0.08+0.10+0.22=0.52$.'
          - problem: 'The joint probabilities of $X$ and $Y$ are $P(0,0)=0.22$, $P(0,1)=0.28$, $P(1,0)=0.18$ and $P(1,1)=0.32$. Find $P(X+Y \le 1)$.'
            answer: '0.68'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The event $X+Y\le1$ contains the cells $(0,0)$, $(0,1)$ and $(1,0)$. Adding them gives $0.22+0.28+0.18=0.68$.'
          - problem: 'A clinic records $X=1$ if a patient is over $60$ ($0$ otherwise) and $Y=1$ if the patient needs a follow-up visit ($0$ otherwise). The probabilities are $P(0,0)=0.3$, $P(0,1)=0.2$ and $P(1,0)=0.1$, and every other patient is over $60$ and needs a follow-up. Of $500$ patients, how many are expected to be over $60$ and need a follow-up?'
            answer: '200'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The missing cell is $P(1,1)=1-(0.3+0.2+0.1)=0.4$. The expected number is the probability times the number of patients, so it is $0.4\cdot500=200$.'
        constraints: '2x2 or 2x3 tables; entries in hundredths summing to 1; one missing-entry item per set; events described as unions of cells; one expected-count item'
      - id: kp2
        name: "Marginal distributions"
        key_prerequisites: [discrete-random-variables, two-way-frequency-tables]
        step_check:
          step: 'The marginal probability $P(X=0)$ is the sum of the row for $X=0$ over every value of $Y$'
          question: 'Why are the cells added across all values of $Y$ to get $P(X=0)$?'
          options:
            - 'Marginals are averages of the cells, so the cells are added and divided by their number'
            - 'Only the largest cell in the row counts as a case of $X=0$, the rest are ignored'
            - 'Adding the cells makes the whole table add to $1$, as every table must'
            - 'The event $X=0$ happens with each value of $Y$, and these cases do not overlap'
          answer: 'The event $X=0$ happens with each value of $Y$, and these cases do not overlap'
          why: 'The event $X=0$ is split into the cases $Y=0$, $Y=1$, and so on. The cases cannot happen together, so their probabilities add.'
        exemplars:
          - problem: 'The joint probabilities of $X$ and $Y$ are $P(0,0)=0.2$, $P(0,1)=0.3$, $P(1,0)=0.1$ and $P(1,1)=0.4$. Find the marginal probability $P(X=0)$.'
            answer: '0.5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The event $X=0$ happens with $Y=0$ or $Y=1$. Adding those cells gives $P(X=0)=0.2+0.3=0.5$.'
          - problem: 'The joint probabilities of $X$ and $Y$, which each take the values $0$ and $1$, are $P(0,0)=0.2$, $P(0,1)=0.3$, $P(1,0)=0.1$ and $P(1,1)=0.4$. Find $E[Y]$.'
            answer: '0.7'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The marginal is $P(Y=1)=0.3+0.4=0.7$ and $P(Y=0)=0.3$. So $E[Y]=0\cdot0.3+1\cdot0.7=0.7$.'
          - problem: 'A survey of households records $X=1$ if the household owns a car ($0$ otherwise) and $Y$, the number of bicycles it owns. The joint probabilities are $P(0,0)=0.1$, $P(0,1)=0.2$, $P(0,2)=0.1$, $P(1,0)=0.2$, $P(1,1)=0.3$ and $P(1,2)=0.1$. Find the marginal probability $P(Y=2)$.'
            answer: '0.2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The event $Y=2$ happens with $X=0$ or $X=1$. Adding those cells gives $P(Y=2)=0.1+0.1=0.2$.'
          - problem: 'A family survey records $X$, the number of pets ($0$, $1$ or $2$), and $Y=1$ if the family has a garden ($0$ otherwise). The joint probabilities are $P(0,0)=0.2$, $P(0,1)=0.1$, $P(1,0)=0.1$, $P(1,1)=0.2$, $P(2,0)=0.2$ and $P(2,1)=0.2$. Find the expected number of pets $E[X]$.'
            answer: '1.1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Add each row to get the marginal of $X$: $P(X=0)=0.3$, $P(X=1)=0.3$ and $P(X=2)=0.4$. Then $E[X]=0\cdot0.3+1\cdot0.3+2\cdot0.4=1.1$.'
          - problem: '$X$ and $Y$ each take the values $0$ and $1$. The joint probabilities are $P(0,1)=0.3$, $P(1,0)=0.15$ and $P(1,1)=0.25$, and $P(0,0)$ is not given. Find $P(X=0)$.'
            answer: '0.6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The missing cell is $P(0,0)=1-(0.3+0.15+0.25)=0.3$. Then $P(X=0)=P(0,0)+P(0,1)=0.3+0.3=0.6$.'
          - problem: '$X$ takes the values $0$ and $1$ and $Y$ takes the values $0$ to $3$. The joint probabilities are $P(0,0)=0.05$, $P(0,1)=0.15$, $P(0,2)=0.2$, $P(0,3)=0.1$, $P(1,0)=0.05$, $P(1,1)=0.1$, $P(1,2)=0.1$ and $P(1,3)=0.25$. Find the marginal probability $P(Y=3)$.'
            answer: '0.35'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The event $Y=3$ happens with $X=0$ or $X=1$. Adding those cells gives $P(Y=3)=0.1+0.25=0.35$.'
          - problem: '$X$ takes the values $0$, $1$ and $2$ and $Y$ takes the values $0$ and $1$. The joint probabilities are $P(0,0)=0.1$, $P(0,1)=0.2$, $P(1,0)=0.2$, $P(1,1)=0.1$, $P(2,0)=0.1$ and $P(2,1)=0.3$. Find $E[Y]$.'
            answer: '0.6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The marginal of $Y$ is found by adding the cells with $Y=1$: $0.2+0.1+0.3=0.6$. Since $Y$ is $0$ or $1$, $E[Y]=P(Y=1)=0.6$.'
        constraints: 'marginals are row or column sums; expected values from marginals with values 0..3; one item first finds a missing cell; answers exact decimals'
      - id: kp3
        name: "Independence and conditionals in joint form"
        key_prerequisites: [independent-events, two-way-frequency-tables]
        step_check:
          step: 'Independence means every joint cell is the product of its marginals'
          question: 'Why is $0.3 \cdot 0.5$ the probability of both events when $X$ and $Y$ are independent?'
          options:
            - 'Independent events cannot happen together, so the product is the smallest possible value'
            - 'Knowing $X=1$ leaves the chance of $Y=2$ unchanged, so the chances multiply'
            - 'The product of two probabilities is always their average'
            - 'Probabilities of two events are always multiplied, independent or not'
          answer: 'Knowing $X=1$ leaves the chance of $Y=2$ unchanged, so the chances multiply'
          why: 'If $X$ tells nothing about $Y$, then $P(Y=2\mid X=1)=P(Y=2)$. So $P(X=1,Y=2)=P(X=1)\,P(Y=2)$.'
        exemplars:
          - problem: '$X$ and $Y$ are independent, with $P(X=1)=0.3$ and $P(Y=2)=0.5$. Find $P(X=1 \text{ and } Y=2)$.'
            answer: '0.15'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'For independent variables every joint cell is the product of its marginals. So the probability is $0.3\cdot0.5=0.15$.'
          - problem: 'The joint probabilities of $X$ and $Y$ are $P(0,0)=0.2$, $P(0,1)=0.3$, $P(1,0)=0.1$ and $P(1,1)=0.4$. Find $P(Y=1 \mid X=0)$.'
            answer: '3/5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The conditional probability is the joint cell divided by the marginal: $P(Y=1\mid X=0)=\frac{P(0,1)}{P(X=0)}=\frac{0.3}{0.5}=\frac35$.'
          - problem: 'A cafe records whether a customer buys a drink ($X$) and whether the customer buys a cake ($Y$). The joint probabilities are $P(0,0)=0.2$, $P(0,1)=0.3$, $P(1,0)=0.1$ and $P(1,1)=0.4$. Are $X$ and $Y$ independent?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["no", "not independent", "they are not independent", "dependent", "they are dependent"], ["yes", "independent", "they are independent"]]}
            solution_sketch: 'Independence needs every cell to equal the product of its marginals. Here $P(X=1)=0.5$ and $P(Y=1)=0.7$, so the product is $0.35$, but $P(1,1)=0.4$. The variables are dependent.'
          - problem: '$X$ and $Y$ are independent with $P(X=2, Y=4)=0.2$ and $P(X=2)=0.5$. Find $P(Y=4)$.'
            answer: '0.4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Independence gives $P(X=2,Y=4)=P(X=2)\,P(Y=4)$. So $0.2=0.5\cdot P(Y=4)$, and dividing by $0.5$ gives $P(Y=4)=0.4$.'
          - problem: 'The joint probabilities of $X$ and $Y$ are $P(0,0)=0.05$, $P(0,1)=0.25$, $P(1,0)=0.15$ and $P(1,1)=0.55$. Find $P(X=0 \mid Y=1)$.'
            answer: '5/16'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The marginal is $P(Y=1)=0.25+0.55=0.80$. So $P(X=0\mid Y=1)=\frac{0.25}{0.80}=\frac{5}{16}$.'
          - problem: 'The joint probabilities of $X$ and $Y$ are $P(0,0)=0.12$, $P(0,1)=0.18$, $P(1,0)=0.28$ and $P(1,1)=0.42$. Are $X$ and $Y$ independent?'
            answer: 'yes'
            answer_contract: {"kind": "label", "options": [["yes", "independent", "they are independent"], ["no", "not independent", "they are not independent", "dependent", "they are dependent"]]}
            solution_sketch: 'The marginals are $P(X=1)=0.28+0.42=0.70$ and $P(Y=1)=0.18+0.42=0.60$. The product is $0.42$, which equals $P(1,1)$, and the other cells match in the same way. The variables are independent.'
          - problem: 'At a cafe, $X=1$ means a customer buys a drink and $Y=1$ means a customer buys a cake. The probability that a customer buys a drink but no cake is $0.35$, and the probability that a customer buys both is $0.25$. Given that a customer buys a drink, find the probability that the customer also buys a cake.'
            answer: '5/12'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The probability of a drink is $0.35+0.25=0.60$. The conditional probability is $\frac{0.25}{0.60}=\frac{5}{12}$.'
          - problem: '$X$ and $Y$ each take the values $0$ and $1$ and are independent, with $P(X=1)=0.4$ and $P(Y=1)=0.5$. Find $P(X=0 \text{ and } Y=0)$.'
            answer: '0.3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Here $P(X=0)=1-0.4=0.6$ and $P(Y=0)=1-0.5=0.5$. By independence the cell is $0.6\cdot0.5=0.3$.'
        constraints: 'independence used to build joint cells or checked cellwise via the product of marginals; two verdict items with different answers; conditionals as joint over marginal; exact decimals or fractions'
    diagnostic_exemplar:
      problem: 'Joint table: $P(0,0) = 0.1$, $P(0,1) = 0.3$, $P(1,0) = 0.2$, $P(1,1) = 0.4$. Find $P(Y = 1 \mid X = 0)$.'
      answer: '3/4'
      solution_sketch: '$P(X = 0) = 0.1 + 0.3 = 0.4$, so $P(Y = 1 \mid X = 0) = \frac{0.3}{0.4} = \frac{3}{4}$.'
    anki_seeds:
      - front: 'Marginal probability from a joint table?'
        back: 'Sum the row (or column): $P(X = x) = \sum_y P(X = x, Y = y)$.'
        type: basic
      - front: 'Independence in terms of a joint distribution?'
        back: '$P(X = x, Y = y) = P(X = x)\,P(Y = y)$ for every cell.'
        type: basic

  - id: covariance-random-variables
    name: "Covariance & Correlation of Random Variables"
    core: false                # terminal enrichment; nothing downstream consumes it
    difficulty: 0.6
    drill: false
    answer_kind: numeric
    expected_time_secs: 180
    prerequisites:
      - id: joint-distributions
        weight: 0.7
        key: true
      - id: variance-random-variables
        weight: 0.6
        key: true
      - id: sums-of-random-variables
        weight: 0.4
        key: false
    knowledge_points:
      - id: kp1
        name: "The covariance identity"
        key_prerequisites: [variance-random-variables]
        step_check:
          step: 'Subtract the product of the means from the mean of the product: $E[XY]-E[X]E[Y]=7-2\cdot3=1$'
          question: 'Why does the covariance subtract $E[X]E[Y]$ from $E[XY]$?'
          options:
            - 'It removes the mean of each variable so only the spread is left'
            - 'It is what $E[XY]$ would be if $X$ and $Y$ were unrelated'
            - 'It makes sure the covariance is never larger than $E[XY]$'
            - 'It converts the product of the variables back to their own units'
          answer: 'It is what $E[XY]$ would be if $X$ and $Y$ were unrelated'
          why: 'If $X$ and $Y$ had no link, $E[XY]$ would equal $E[X]E[Y]$, so the difference measures how the variables move together.'
        exemplars:
          - problem: 'The random variables $X$ and $Y$ have $E[XY]=7$, $E[X]=2$ and $E[Y]=3$. Find $\operatorname{Cov}(X,Y)$.'
            answer: '1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Use the identity $\operatorname{Cov}(X,Y)=E[XY]-E[X]E[Y]$. The product of the means is $2\cdot3=6$. So the covariance is $7-6=1$.'
          - problem: 'A random variable $X$ has $\operatorname{Var}(X)=9$. What is $\operatorname{Cov}(X,X)$?'
            answer: '9'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Put $Y=X$ in the identity: $\operatorname{Cov}(X,X)=E[X^2]-E[X]^2$. This is the formula for the variance. So $\operatorname{Cov}(X,X)=\operatorname{Var}(X)=9$.'
          - problem: 'A student studies for $X$ hours and then scores $Y$ points on a quiz. On average $E[X]=3$ and $E[Y]=2$, and the average product is $E[XY]=10$. What is $\operatorname{Cov}(X,Y)$?'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The product of the means is $3\cdot2=6$. The average product is $10$. So $\operatorname{Cov}(X,Y)=10-6=4$.'
          - problem: 'Let $X$ be the daily temperature and $Y$ the number of ice creams sold. Their covariance is $\operatorname{Cov}(X,Y)=5$, and the means are $E[X]=4$ and $E[Y]=2$. What is $E[XY]$?'
            answer: '13'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Rearrange the identity as $E[XY]=\operatorname{Cov}(X,Y)+E[X]E[Y]$. The product of the means is $4\cdot2=8$. So $E[XY]=5+8=13$.'
          - problem: 'The moments of $X$ and $Y$ are $E[XY]=12.5$, $E[X]=2$ and $E[Y]=5$. Find $\operatorname{Cov}(X,Y)$.'
            answer: '2.5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The product of the means is $2\cdot5=10$. Subtract it from $E[XY]$: $12.5-10=2.5$. So the covariance is $2.5$.'
          - problem: 'A call centre records $X$, the calls an agent makes in an hour, and $Y$, the orders that result. Then $\operatorname{Cov}(X,Y)=3$, $E[XY]=15$ and $E[X]=4$. What is $E[Y]$?'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'From $\operatorname{Cov}(X,Y)=E[XY]-E[X]E[Y]$ we get $E[X]E[Y]=15-3=12$. Now divide this product by the known mean $E[X]=4$. So the mean of the orders is $E[Y]=12\div4=3$.'
          - problem: 'For two random variables, $E[XY]=20$, $E[X]=5$ and $E[Y]=3$. Mia computes $\operatorname{Cov}(X,Y)=20-5-3=12$. What is the correct covariance?'
            answer: '5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Mia subtracted the two means one after the other, but the identity needs their product. The product is $5\cdot3=15$. So $\operatorname{Cov}(X,Y)=20-15=5$.'
        constraints: 'moments given directly or hidden in a short context; the question asks for the covariance, for a missing moment, or for a mean; one Cov(X, X) = Var(X) item per set'
      - id: kp2
        name: "Covariance from a joint table"
        key_prerequisites: [joint-distributions, variance-random-variables]
        step_check:
          step: 'Only the outcome $(1,1)$ adds to $E[XY]$, because every other pair has a product of $0$'
          question: 'Why do the outcomes $(0,0)$, $(0,1)$ and $(1,0)$ add nothing to $E[XY]$?'
          options:
            - 'In each of them $x=0$ or $y=0$, so the product $xy$ is $0$'
            - 'Their probabilities are smaller than the probability of $(1,1)$'
            - 'The covariance only counts outcomes where $X$ equals $Y$'
            - 'Outcomes with a zero already enter through $E[X]$ and $E[Y]$'
          answer: 'In each of them $x=0$ or $y=0$, so the product $xy$ is $0$'
          why: 'Each term of $E[XY]$ is $xy\cdot P(x,y)$. When $x$ or $y$ is $0$ that term vanishes, so only $(1,1)$ remains.'
        try_first:
          problem: '$X$ and $Y$ each take only the values $0$ and $1$. The outcome $(X,Y)=(1,1)$ has probability $0.3$. What is $E[XY]$?'
          answer_contract: {"kind": "exact"}
          answer: '0.3'
          reveal: 'The product $xy$ is $0$ unless both values are $1$, so $E[XY]$ is just $P(X=1,Y=1)$. For $0/1$ variables this makes $E[XY]$ quick to find.'
        exemplars:
          - problem: '$X$ and $Y$ each take the values $0$ and $1$, with $P(0,0)=0.4$, $P(0,1)=0.1$, $P(1,0)=0.1$ and $P(1,1)=0.4$. Find $\operatorname{Cov}(X,Y)$.'
            answer: '0.15'
            answer_contract: {"kind": "exact"}
            solution_sketch: '$P(X=1)=0.1+0.4=0.5$ and $P(Y=1)=0.1+0.4=0.5$, so $E[X]=E[Y]=0.5$. Only $(1,1)$ adds to $E[XY]$, so $E[XY]=0.4$. Then $\operatorname{Cov}(X,Y)=0.4-0.25=0.15$.'
          - problem: '$X$ and $Y$ are independent with $E[X]=2$ and $E[Y]=3$. What is $\operatorname{Cov}(X,Y)$?'
            answer: '0'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'For independent variables the mean of the product equals the product of the means, so $E[XY]=E[X]E[Y]=2\cdot3=6$. Then $\operatorname{Cov}(X,Y)=6-6=0$.'
          - problem: '$X$ and $Y$ each take the values $0$ and $1$, with $P(0,0)=0.1$, $P(0,1)=0.2$, $P(1,0)=0.3$ and $P(1,1)=0.4$. Find $\operatorname{Cov}(X,Y)$.'
            answer: '-0.02'
            answer_contract: {"kind": "exact"}
            solution_sketch: '$E[X]=0.3+0.4=0.7$ and $E[Y]=0.2+0.4=0.6$. Only $(1,1)$ adds to $E[XY]$, so $E[XY]=0.4$. Then $\operatorname{Cov}(X,Y)=0.4-0.7\cdot0.6=0.4-0.42=-0.02$.'
          - problem: '$X$ takes the values $0$ and $1$, and $Y$ takes the values $0$, $1$ and $2$. The joint probabilities are $P(0,0)=0.2$, $P(0,1)=0.1$, $P(0,2)=0.1$, $P(1,0)=0.1$, $P(1,1)=0.2$ and $P(1,2)=0.3$. Find $\operatorname{Cov}(X,Y)$.'
            answer: '0.14'
            answer_contract: {"kind": "exact"}
            solution_sketch: '$E[X]=0.1+0.2+0.3=0.6$. For $Y$: $P(Y=1)=0.3$ and $P(Y=2)=0.4$, so $E[Y]=0.3+0.8=1.1$. Then $E[XY]=1\cdot0.2+2\cdot0.3=0.8$, and $\operatorname{Cov}(X,Y)=0.8-0.6\cdot1.1=0.14$.'
          - problem: 'A lamp in the hall works with probability $0.25$, and a lamp in the kitchen works with probability $0.8$. Let $X=1$ if the hall lamp works and $Y=1$ if the kitchen lamp works, otherwise $0$. The lamps work independently. What is $\operatorname{Cov}(X,Y)$?'
            answer: '0'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Independent variables satisfy $E[XY]=E[X]E[Y]=0.25\cdot0.8=0.20$. Then $\operatorname{Cov}(X,Y)=0.20-0.20=0$. So independent variables always have zero covariance.'
          - problem: 'Let $X=1$ if it rains today and $Y=1$ if it rains tomorrow, otherwise $0$. Rain falls on each day with probability $0.5$, and it rains on both days with probability $0.49$. Find $\operatorname{Cov}(X,Y)$.'
            answer: '0.24'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Here $E[X]=E[Y]=0.5$ and $E[XY]=P(1,1)=0.49$. So $\operatorname{Cov}(X,Y)=0.49-0.25=0.24$. The covariance is large and positive, because wet days come in pairs.'
          - problem: 'A fair die is rolled. Let $X$ be the number on the top face and $Y$ the number on the bottom face, so $X+Y=7$. Find $\operatorname{Cov}(X,Y)$ to two decimal places.'
            answer: '-2.92'
            answer_contract: {"kind": "approx", "decimals": 2}
            solution_sketch: '$E[X]=E[Y]=\frac{7}{2}$. The products $xy$ are $6,10,12,12,10,6$, which have mean $\frac{56}{6}=\frac{28}{3}$. So $\operatorname{Cov}(X,Y)=\frac{28}{3}-\frac{49}{4}=-\frac{35}{12}=-2.92$ to two decimal places.'
          - problem: 'Students sit a maths test and a physics test. Let $X=1$ if a student passes maths and $Y=1$ if the student passes physics, otherwise $0$. Here $P(X=1)=0.6$, $P(Y=1)=0.5$ and $\operatorname{Cov}(X,Y)=0.1$. What is the probability that a student passes both tests?'
            answer: '0.4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'For $0/1$ variables $E[XY]$ is the probability of passing both. From the identity, $E[XY]=\operatorname{Cov}(X,Y)+E[X]E[Y]=0.1+0.6\cdot0.5=0.4$. So $0.4$ of the students pass both tests.'
          - problem: '$X$ takes the values $-1$, $0$ and $1$, each with probability $\frac13$, and $Y=X^2$. Tom finds $\operatorname{Cov}(X,Y)=0$ and concludes that $X$ and $Y$ are independent. Is Tom right?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "Tom is right", "he is right", "right", "correct"], ["no", "Tom is wrong", "he is wrong", "not right", "incorrect", "wrong", "no, they are dependent"]]}
            solution_sketch: 'Tom''s covariance is right: $E[X]=0$ and $E[XY]=E[X^3]=0$, so $\operatorname{Cov}(X,Y)=0$. But $Y$ is fixed once $X$ is known, so the variables are dependent. Zero covariance does not imply independence, so Tom is wrong.'
        constraints: 'joint probabilities written out in the question; values 0/1 or 0..2 so E[XY] is a short sum; covariances in hundredths; include one independent-hence-zero case and one zero-covariance-but-dependent case'
      - id: kp3
        name: "Variance of a sum and correlation"
        key_prerequisites: [variance-random-variables, joint-distributions]
        step_check:
          step: 'Add twice the covariance: $\operatorname{Var}(X+Y)=4+9+2\cdot3=19$'
          question: 'Why is the covariance counted twice in $\operatorname{Var}(X+Y)$?'
          options:
            - 'The covariance is added once for $X$ and once for $Y$ as a variance'
            - 'Doubling is a convention that keeps the variance of a sum from being negative'
            - 'Expanding $(X+Y)^2$ gives the cross term $XY$ twice'
            - 'The sum $X+Y$ has twice the spread of either variable'
          answer: 'Expanding $(X+Y)^2$ gives the cross term $XY$ twice'
          why: 'In $(X+Y)^2=X^2+2XY+Y^2$ the cross term has the factor $2$, so the covariance enters as $2\operatorname{Cov}(X,Y)$.'
        exemplars:
          - problem: '$\operatorname{Var}(X)=4$, $\operatorname{Var}(Y)=9$ and $\operatorname{Cov}(X,Y)=3$. Find $\operatorname{Var}(X+Y)$.'
            answer: '19'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Use the rule $\operatorname{Var}(X+Y)=\operatorname{Var}(X)+\operatorname{Var}(Y)+2\operatorname{Cov}(X,Y)$. Substitute the given variances and the given covariance into the rule. So $\operatorname{Var}(X+Y)=4+9+2\cdot3=19$.'
          - problem: '$\operatorname{Var}(X)=9$, $\operatorname{Var}(Y)=4$ and $\operatorname{Cov}(X,Y)=-2$. Find $\operatorname{Var}(X+Y)$.'
            answer: '9'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Use the rule for the variance of a sum: $\operatorname{Var}(X+Y)=9+4+2\cdot(-2)=9$. The negative covariance makes the sum steadier than independent variables would.'
          - problem: '$\operatorname{Var}(X)=4$, $\operatorname{Var}(Y)=9$ and $\operatorname{Cov}(X,Y)=3$. Find the correlation coefficient $\rho$ of $X$ and $Y$.'
            answer: '1/2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The standard deviations are the square roots of the variances, $\sigma_X=2$ and $\sigma_Y=3$. The correlation is $\rho=\frac{\operatorname{Cov}(X,Y)}{\sigma_X\sigma_Y}=\frac{3}{6}=\frac{1}{2}$.'
          - problem: 'The daily returns of two shares, in percent, are $X$ and $Y$, with $\operatorname{Var}(X)=25$, $\operatorname{Var}(Y)=16$ and $\operatorname{Cov}(X,Y)=6$. What is the variance of the combined return $X+Y$?'
            answer: '53'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Use $\operatorname{Var}(X+Y)=\operatorname{Var}(X)+\operatorname{Var}(Y)+2\operatorname{Cov}(X,Y)$. Here $25+16+2\cdot6=53$. The variance of the combined return is $53$.'
          - problem: 'A student''s maths score is $X$ and the physics score is $Y$, with $\operatorname{Var}(X)=81$, $\operatorname{Var}(Y)=16$ and $\operatorname{Cov}(X,Y)=-18$. What is the variance of the total score $X+Y$?'
            answer: '61'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Use the rule for the variance of a sum: $\operatorname{Var}(X+Y)=81+16+2\cdot(-18)=97-36=61$. The negative covariance lowers the variance of the total score.'
          - problem: '$\operatorname{Var}(X)=16$, $\operatorname{Var}(Y)=81$ and $\operatorname{Cov}(X,Y)=24$. What is the correlation coefficient of $X$ and $Y$?'
            answer: '2/3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The standard deviations are $4$ and $9$, the square roots of the variances. So $\rho=\frac{24}{4\cdot9}=\frac{24}{36}=\frac{2}{3}$.'
          - problem: 'Two machines each add a small error to the same bottle. The errors $X$ and $Y$ in millilitres have $\operatorname{Var}(X)=16$ and $\operatorname{Var}(Y)=9$, and the total error $X+Y$ has variance $37$. What is $\operatorname{Cov}(X,Y)$?'
            answer: '6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The variance of a sum gives $16+9+2\operatorname{Cov}(X,Y)=37$, so $2\operatorname{Cov}(X,Y)=12$. Now divide both sides by $2$. So $\operatorname{Cov}(X,Y)=6$.'
          - problem: 'Two runners have finishing times $X$ and $Y$ in seconds, with $\operatorname{Var}(X)=9$, $\operatorname{Var}(Y)=4$ and $\operatorname{Cov}(X,Y)=-2$. What is the variance of the difference $X-Y$?'
            answer: '17'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'For a difference the covariance term changes sign: $\operatorname{Var}(X-Y)=\operatorname{Var}(X)+\operatorname{Var}(Y)-2\operatorname{Cov}(X,Y)$. So the variance is $9+4-2\cdot(-2)=17$.'
          - problem: '$\operatorname{Var}(X)=4$, $\operatorname{Var}(Y)=9$ and $\operatorname{Cov}(X,Y)=-6$. What is the correlation coefficient of $X$ and $Y$?'
            answer: '-1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The standard deviations are $2$ and $3$. So $\rho=\frac{-6}{2\cdot3}=-1$. A correlation of $-1$ means $Y$ is a decreasing linear function of $X$.'
          - problem: 'For the hours of sleep $X$ and the number of mistakes $Y$ in a test, a teacher finds $\operatorname{Cov}(X,Y)=-3.2$. Do $X$ and $Y$ have a positive correlation, a negative correlation or no correlation?'
            answer: 'negative'
            answer_contract: {"kind": "label", "options": [["positive", "positive correlation", "a positive correlation", "positively correlated", "they are positively correlated"], ["negative", "negative correlation", "a negative correlation", "negatively correlated", "they are negatively correlated"], ["no correlation", "none", "zero", "uncorrelated", "not correlated", "they are uncorrelated"]]}
            solution_sketch: 'The correlation has the same sign as the covariance, because the standard deviations are positive. The covariance $-3.2$ is negative, so the correlation is negative. More sleep goes with fewer mistakes.'
        constraints: 'variances perfect squares; correlation denominators divide evenly; include one negative-covariance case, one variance of a difference and one item that asks for the covariance from the variance of a sum'
    diagnostic_exemplar:
      problem: '$X$ and $Y$ each take the values $0$ and $1$, with $P(0,0) = 0.4$, $P(0,1) = 0.1$, $P(1,0) = 0.1$, $P(1,1) = 0.4$, and $\operatorname{Var}(X) = \operatorname{Var}(Y) = 0.25$. Find $\operatorname{Var}(X + Y)$.'
      answer: '0.8'
      solution_sketch: '$E[XY] = 0.4$ and $E[X] = E[Y] = 0.5$, so $\operatorname{Cov} = 0.4 - 0.25 = 0.15$; then $\operatorname{Var}(X+Y) = 0.25 + 0.25 + 2(0.15) = 0.8$.'
    anki_seeds:
      - front: 'Covariance formula?'
        back: '$\operatorname{Cov}(X, Y) = E[XY] - E[X]E[Y]$.'
        type: basic
      - front: '$\operatorname{Var}(X + Y)$ in general?'
        back: '$\operatorname{Var}(X) + \operatorname{Var}(Y) + 2\operatorname{Cov}(X, Y)$.'
        type: basic
      - front: 'Independent $\Rightarrow \operatorname{Cov} = 0$. Converse?'
        back: 'False — zero covariance does not imply independence.'
        type: basic
