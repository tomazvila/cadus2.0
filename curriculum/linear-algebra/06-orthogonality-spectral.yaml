unit: orthogonality-spectral
course: linear-algebra
module: "Orthogonal Matrices & Spectral Theory"
topics:
  - id: orthogonal-matrices
    name: Orthogonal Matrices
    core: false                # spectral branch sits below the supplemental orthogonality run (orthogonal-orthonormal-sets); nothing in a higher-ordered course consumes it, so the branch deliberately stays supplemental (R-2)
    difficulty: 0.7
    drill: false
    answer_kind: numeric
    expected_time_secs: 210
    prerequisites:
      - id: orthogonal-orthonormal-sets
        weight: 0.7
        key: true
      - id: transpose-symmetric-matrices
        weight: 0.6
        key: true
      - id: matrix-inverses
        weight: 0.4
      - id: linear-transformations
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: Recognizing orthogonal matrices
        key_prerequisites: [orthogonal-orthonormal-sets, transpose-symmetric-matrices]
        exemplars:
          - problem: 'Is $Q=\frac{1}{5}\begin{pmatrix}3&-4\\4&3\end{pmatrix}$ an orthogonal matrix?'
            answer: 'yes'
            answer_contract: {"kind": "label", "options": [["yes", "it is", "it is orthogonal"], ["no", "it is not", "it is not orthogonal"]]}
            solution_sketch: 'The columns of $Q$ are $(3/5,4/5)$ and $(-4/5,3/5)$. Each has norm $\sqrt{9/25+16/25}=1$, and their dot product is $-12/25+12/25=0$. The columns are orthonormal, so $Q^TQ=I$ and $Q$ is orthogonal.'
          - problem: 'Compute $A^TA$ for $A=\begin{pmatrix}1&1\\0&1\end{pmatrix}$.'
            answer: '[[1,1],[1,2]]'
            answer_contract: {"kind": "matrix", "rows": 2, "cols": 2}
            solution_sketch: 'The transpose is $A^T=\begin{pmatrix}1&0\\1&1\end{pmatrix}$. Multiplying row by column gives the entries $1,1,1,2$, so $A^TA=\begin{pmatrix}1&1\\1&2\end{pmatrix}$. The off-diagonal entry $1$ is not $0$, so the columns of $A$ are not perpendicular and $A$ is not orthogonal.'
          - problem: 'Is $Q=\frac{1}{5}\begin{pmatrix}3&4\\4&3\end{pmatrix}$ an orthogonal matrix?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "it is", "it is orthogonal"], ["no", "it is not", "it is not orthogonal"]]}
            solution_sketch: 'Each column has norm $\sqrt{9/25+16/25}=1$, so the norms alone do not decide the question. The dot product of the columns is $(3/5)(4/5)+(4/5)(3/5)=24/25$, which is not $0$. The columns are not perpendicular, so $Q$ is not orthogonal.'
          - problem: 'The matrix $Q=\frac{1}{5}\begin{pmatrix}4&a\\3&-4\end{pmatrix}$ is orthogonal. Find $a$.'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The columns $(4/5,3/5)$ and $(a/5,-4/5)$ must be perpendicular, so $(4/5)(a/5)+(3/5)(-4/5)=0$. This gives $4a-12=0$, so $a=3$. The norm of the second column is then $\sqrt{9+16}/5=1$, so the condition on the norms holds as well.'
          - problem: 'A program stretches the plane horizontally by the factor $2$ and shrinks it vertically by the factor $\frac12$, using the matrix $S=\begin{pmatrix}2&0\\0&\frac12\end{pmatrix}$. What is the length of the image of the vector $(1,0)$?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The image of $(1,0)$ is the first column of $S$, which is $(2,0)$. Its length is $2$. An orthogonal matrix keeps every length, so this length of $2$ shows that $S$ is not orthogonal.'
          - problem: 'The matrix $R=\begin{pmatrix}0&-1\\1&0\end{pmatrix}$ turns every point of the plane through $90^\circ$ counterclockwise. Find the dot product of the two columns of $R$.'
            answer: '0'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The columns of $R$ are $(0,1)$ and $(-1,0)$. Their dot product is $0\cdot(-1)+1\cdot 0=0$. The columns are perpendicular, and both have norm $1$, so $R$ is orthogonal.'
          - problem: 'Find the norm of the second column of $Q=\frac{1}{\sqrt{2}}\begin{pmatrix}1&1\\1&-1\end{pmatrix}$.'
            answer: '1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The second column is $(1/\sqrt2,-1/\sqrt2)$. Its norm is $\sqrt{1/2+1/2}=\sqrt1=1$. The column is a unit vector, which is one of the two conditions for $Q$ to be orthogonal.'
          - problem: 'The matrix $Q=\frac13\begin{pmatrix}1&2&2\\2&1&b\\2&-2&1\end{pmatrix}$ is orthogonal. Find $b$.'
            answer: '-2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The third column $(2,b,1)/3$ must be perpendicular to the first column $(1,2,2)/3$. This gives $2+2b+2=0$, so $b=-2$. The second column $(2,1,-2)/3$ is also perpendicular to the first, since $2+2-4=0$.'
        constraints: '2x2 candidates built from 3-4-5 columns, rotations by multiples of 90 degrees or 1/sqrt(2) entries; one 3x3 candidate with columns (1,2,2)/3, (2,1,-2)/3, (2,-2,1)/3; verdicts only yes or no'
      - id: kp2
        name: The inverse is the transpose
        key_prerequisites: [transpose-symmetric-matrices, matrix-inverses]
        exemplars:
          - problem: 'The matrix $Q=\frac15\begin{pmatrix}3&-4\\4&3\end{pmatrix}$ is orthogonal. Find $Q^{-1}$.'
            answer: '[[3/5,4/5],[-4/5,3/5]]'
            answer_contract: {"kind": "matrix", "rows": 2, "cols": 2}
            solution_sketch: 'For an orthogonal matrix the inverse is the transpose, $Q^{-1}=Q^T$. Swap the rows and columns and keep the factor $\frac15$. This gives $Q^{-1}=\frac15\begin{pmatrix}3&4\\-4&3\end{pmatrix}$.'
          - problem: 'A sensor reports the position $\mathbf b=(1,2)$ after the coordinates were turned by $Q=\frac15\begin{pmatrix}4&-3\\3&4\end{pmatrix}$, so that $Q\mathbf x=\mathbf b$. Find the original position $\mathbf x$.'
            answer: '(2, 1)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'The matrix $Q$ is orthogonal, so $\mathbf x=Q^{-1}\mathbf b=Q^T\mathbf b$. With $Q^T=\frac15\begin{pmatrix}4&3\\-3&4\end{pmatrix}$ we get $\mathbf x=\frac15(4\cdot1+3\cdot2,\,-3\cdot1+4\cdot2)=\frac15(10,5)=(2,1)$.'
          - problem: 'A drawing program turns the plane through $90^\circ$ counterclockwise with the matrix $Q=\begin{pmatrix}0&-1\\1&0\end{pmatrix}$. Which matrix undoes this turn?'
            answer: '[[0,1],[-1,0]]'
            answer_contract: {"kind": "matrix", "rows": 2, "cols": 2}
            solution_sketch: 'Undoing the turn means applying $Q^{-1}$. The matrix $Q$ is orthogonal, so $Q^{-1}=Q^T$. Swapping rows and columns gives $\begin{pmatrix}0&1\\-1&0\end{pmatrix}$, which is the turn through $90^\circ$ clockwise.'
          - problem: 'Let $Q=\begin{pmatrix}0&1\\-1&0\end{pmatrix}$. Solve $Q\mathbf x=(5,-2)$ for $\mathbf x$.'
            answer: '(2, 5)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'The matrix $Q$ is orthogonal, so $\mathbf x=Q^T\mathbf b$ with $Q^T=\begin{pmatrix}0&-1\\1&0\end{pmatrix}$. Then $\mathbf x=(0\cdot5+(-1)(-2),\,1\cdot5+0\cdot(-2))=(2,5)$. Check: $Q(2,5)=(5,-2)$.'
          - problem: 'The matrix $Q=\frac15\begin{pmatrix}-3&4\\4&3\end{pmatrix}$ is orthogonal. Find $Q^{-1}$.'
            answer: '[[-3/5,4/5],[4/5,3/5]]'
            answer_contract: {"kind": "matrix", "rows": 2, "cols": 2}
            solution_sketch: 'The inverse of an orthogonal matrix is its transpose. This $Q$ is symmetric, so its transpose is $Q$ itself. Hence $Q^{-1}=Q=\frac15\begin{pmatrix}-3&4\\4&3\end{pmatrix}$.'
          - problem: 'A ship''s position is turned about the origin by $Q=\frac1{13}\begin{pmatrix}5&-12\\12&5\end{pmatrix}$. After the turn the ship is at $(13,0)$. Where was it before the turn?'
            answer: '(5, -12)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'If $\mathbf x$ is the old position, then $Q\mathbf x=(13,0)$, so $\mathbf x=Q^T(13,0)$ because $Q$ is orthogonal. With $Q^T=\frac1{13}\begin{pmatrix}5&12\\-12&5\end{pmatrix}$ this gives $\mathbf x=\frac1{13}(65,-156)=(5,-12)$.'
          - problem: 'The matrix $Q=\frac13\begin{pmatrix}1&2&2\\2&1&-2\\2&-2&1\end{pmatrix}$ is orthogonal. Find the entry in row $1$, column $3$ of $Q^{-1}$.'
            answer: '2/3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The inverse of an orthogonal matrix is its transpose, so the entry of $Q^{-1}$ in row $1$, column $3$ is the entry of $Q$ in row $3$, column $1$. That entry is $2/3$.'
          - problem: 'Let $Q=\frac15\begin{pmatrix}3&4\\-4&3\end{pmatrix}$. Solve $Q\mathbf x=(3,1)$ for $\mathbf x$.'
            answer: '(1, 3)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'This $Q$ is orthogonal, so $\mathbf x=Q^T\mathbf b$ with $Q^T=\frac15\begin{pmatrix}3&-4\\4&3\end{pmatrix}$. Then $\mathbf x=\frac15(3\cdot3-4\cdot1,\,4\cdot3+3\cdot1)=\frac15(5,15)=(1,3)$.'
        constraints: 'orthogonal Q with 3-4-5, 5-12-13 or 90-degree-rotation columns, plus one 3x3 case; right-hand sides chosen so Q^T b has integer entries'
      - id: kp3
        name: Orthogonal matrices preserve geometry
        key_prerequisites: [orthogonal-orthonormal-sets, linear-transformations]
        try_first:
          problem: 'A rod runs from the origin to the point $(5,12)$. It is turned about the origin through $30^\circ$. How long is the rod after the turn?'
          answer_contract: {"kind": "exact"}
          answer: '13'
          reveal: 'A turn keeps lengths, because the matrix of a rotation is orthogonal and $\|Q\mathbf x\|=\|\mathbf x\|$. The rod keeps its length $\sqrt{5^2+12^2}=13$.'
        exemplars:
          - problem: 'The point $(3,4)$ is turned about the origin by $Q=\frac15\begin{pmatrix}3&-4\\4&3\end{pmatrix}$. How far from the origin is the image of the point?'
            answer: '5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The image is $Q(3,4)=\frac15(9-16,\,12+12)=(-7/5,\,24/5)$. Its distance from the origin is $\sqrt{49/25+576/25}=\sqrt{25}=5$. This equals the distance $\sqrt{3^2+4^2}=5$ of the original point, as it must for an orthogonal matrix.'
          - problem: 'The reflection $Q=\begin{pmatrix}1&0\\0&-1\end{pmatrix}$ is applied to $\mathbf x=(2,1)$ and $\mathbf y=(-3,2)$. Find $(Q\mathbf x)\cdot(Q\mathbf y)$.'
            answer: '-4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The images are $Q\mathbf x=(2,-1)$ and $Q\mathbf y=(-3,-2)$. Their dot product is $2(-3)+(-1)(-2)=-4$. An orthogonal matrix keeps dot products, and indeed $\mathbf x\cdot\mathbf y=2(-3)+1\cdot2=-4$.'
          - problem: 'Find $\det Q$ for the reflection $Q=\begin{pmatrix}0&-1\\-1&0\end{pmatrix}$.'
            answer: '-1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'By the $2\times2$ formula, $\det Q=0\cdot0-(-1)(-1)=-1$. The determinant of an orthogonal matrix is $1$ or $-1$, and a reflection has determinant $-1$.'
          - problem: 'Can a $3\times3$ orthogonal matrix have determinant $2$?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "it can", "can"], ["no", "it cannot", "cannot", "it can not"]]}
            solution_sketch: 'From $Q^TQ=I$ we get $(\det Q)^2=\det Q^T\det Q=\det I=1$. So $\det Q$ is $1$ or $-1$. A determinant of $2$ gives $2^2=4\ne1$, so no orthogonal matrix has determinant $2$.'
          - problem: 'A metal rod runs from the origin to the point $(6,8)$. The rod is turned about the origin by an orthogonal matrix $Q$. How long is the rod after the turn?'
            answer: '10'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'An orthogonal matrix keeps lengths, so the length of the rod does not change. The rod had length $\sqrt{6^2+8^2}=\sqrt{100}=10$, so it still has length $10$.'
          - problem: 'On a map, two roads have direction vectors $\mathbf u=(1,2)$ and $\mathbf w=(3,-1)$. The map is turned by an orthogonal matrix $Q$. Find the dot product $(Q\mathbf u)\cdot(Q\mathbf w)$ of the new direction vectors.'
            answer: '1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'An orthogonal matrix keeps dot products, so $(Q\mathbf u)\cdot(Q\mathbf w)=\mathbf u\cdot\mathbf w$. Then $\mathbf u\cdot\mathbf w=1\cdot3+2\cdot(-1)=1$. The two roads have the same dot product of $1$ after the turn.'
          - problem: 'Let $Q=\begin{pmatrix}0&-1\\1&0\end{pmatrix}$ and $\mathbf v=(3,-2)$. Find $Q\mathbf v$.'
            answer: '(2, 3)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'Multiply the rows of $Q$ by $\mathbf v$: the first entry is $0\cdot3+(-1)(-2)=2$ and the second is $1\cdot3+0\cdot(-2)=3$. So $Q\mathbf v=(2,3)$, and its length $\sqrt{13}$ equals the length of $\mathbf v$.'
          - problem: 'The reflection $Q=\begin{pmatrix}0&1\\1&0\end{pmatrix}$ swaps the coordinates of a point. Find $\|Q\mathbf v\|^2$ for $\mathbf v=(-1,3)$.'
            answer: '10'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The image is $Q\mathbf v=(3,-1)$, so $\|Q\mathbf v\|^2=3^2+(-1)^2=10$. The same value comes from $\|\mathbf v\|^2=(-1)^2+3^2=10$, because $Q$ is orthogonal.'
        constraints: 'lengths, dot products and determinants of 2x2 rotations/reflections with integer test vectors, plus lengths and dot products under an unnamed orthogonal matrix'
    diagnostic_exemplar:
      problem: 'For $Q = \frac{1}{\sqrt{2}}\begin{pmatrix}1&-1\\1&1\end{pmatrix}$, verify that $Q$ is orthogonal, give $Q^{-1}$, and compute $\|Q\mathbf{x}\|$ for $\mathbf{x} = (3, 4)$.'
      answer: '$Q$ is orthogonal (its columns are orthonormal, so $Q^TQ = I$); $Q^{-1} = Q^T = \frac{1}{\sqrt{2}}\begin{pmatrix}1&1\\-1&1\end{pmatrix}$; $\|Q\mathbf{x}\| = \|\mathbf{x}\| = 5$'
      answer_contract: {kind: none}
      solution_sketch: 'Each column has norm $1$ and their dot product is $(1)(-1) + (1)(1) = 0$ before scaling; orthogonal matrices preserve norms, so $\|Q\mathbf{x}\| = \|(3,4)\| = 5$.'
    anki_seeds:
      - front: 'A square matrix $Q$ is orthogonal when $Q^TQ = $ ?'
        back: '$I$ — equivalently, its columns form an orthonormal set.'
        type: basic
      - front: 'The inverse of an orthogonal matrix is...'
        back: 'its transpose: $Q^{-1} = Q^T$.'
        type: basic
      - front: 'Orthogonal matrices preserve which two geometric quantities?'
        back: 'Norms and dot products (hence lengths and angles); $\det Q = \pm 1$.'
        type: basic

  - id: spectral-theorem-symmetric-matrices
    name: The Spectral Theorem for Symmetric Matrices
    core: false                # terminal theorem topic on the supplemental spectral branch; no higher-ordered course builds on it (R-2: kept supplemental rather than flipping the W8 orthogonality flags)
    difficulty: 0.8
    drill: false
    answer_kind: numeric
    expected_time_secs: 300
    prerequisites:
      # L1 flagged this edge as superfluous (constraints rig eigenvectors so
      # Gram-Schmidt never runs), but dropping it removed orthogonality-gram-schmidt
      # from the closure ENTIRELY — orthonormalising an eigenbasis is the theorem's
      # own construction, so the edge is kept deliberately.
      - id: orthogonality-gram-schmidt
        weight: 0.3
        key: false
      - id: orthogonal-matrices
        weight: 0.7
        key: true
      - id: diagonalization
        weight: 0.7
        key: true
      - id: eigenvalues-eigenvectors
        weight: 0.5
    knowledge_points:
      - id: kp1
        name: What the spectral theorem says
        key_prerequisites: [eigenvalues-eigenvectors, orthogonal-matrices]
        exemplars:
          - problem: 'Find the eigenvalues of the symmetric matrix $A=\begin{pmatrix}4&2\\2&4\end{pmatrix}$.'
            answer: '2, 6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The characteristic equation is $(4-\lambda)^2-4=0$, so $4-\lambda=\pm2$. The eigenvalues are $\lambda=2$ and $\lambda=6$. Both are real, as the spectral theorem promises for a symmetric matrix.'
          - problem: 'For $A=\begin{pmatrix}6&4\\4&6\end{pmatrix}$, the eigenvectors for the two eigenvalues are $\mathbf u=(1,-1)$ and $\mathbf v=(1,1)$. Find $\mathbf u\cdot\mathbf v$.'
            answer: '0'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The dot product is $1\cdot1+(-1)\cdot1=0$. The eigenvectors belong to the eigenvalues $2$ and $10$, which are different. For a symmetric matrix, eigenvectors for different eigenvalues are always perpendicular.'
          - problem: 'Which kind of real square matrix is guaranteed to have an orthonormal basis of eigenvectors: all square matrices, invertible matrices, triangular matrices or symmetric matrices?'
            answer: 'symmetric matrices'
            answer_contract: {"kind": "label", "options": [["symmetric matrices", "symmetric", "symmetric matrix", "the symmetric matrices"], ["all square matrices", "square matrices", "all matrices"], ["invertible matrices", "invertible"], ["triangular matrices", "triangular"]]}
            solution_sketch: 'The spectral theorem says that a real matrix has an orthonormal basis of eigenvectors exactly when it is symmetric. A triangular matrix such as $\begin{pmatrix}1&1\\0&2\end{pmatrix}$ has no perpendicular eigenvectors, and it is invertible, so invertible and triangular matrices are not guaranteed. Only symmetric matrices are.'
          - problem: 'Find the eigenvector of $A=\begin{pmatrix}2&3\\3&2\end{pmatrix}$ for the eigenvalue $5$ whose first entry is $1$.'
            answer: '(1, 1)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'Solve $(A-5I)\mathbf v=\mathbf 0$. The first row gives $-3x+3y=0$, so $x=y$. Taking $x=1$ gives the eigenvector $(1,1)$.'
          - problem: 'The matrix $B=\begin{pmatrix}1&2\\0&3\end{pmatrix}$ is not symmetric. Its eigenvector for the eigenvalue $1$ is $(1,0)$ and its eigenvector for the eigenvalue $3$ is $(1,1)$. Are these two eigenvectors perpendicular?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "they are", "they are perpendicular"], ["no", "they are not", "they are not perpendicular", "not perpendicular"]]}
            solution_sketch: 'The dot product is $1\cdot1+0\cdot1=1$, which is not $0$. So the eigenvectors are not perpendicular. This does not contradict the spectral theorem, which applies only to symmetric matrices.'
          - problem: 'The stress in a thin steel plate is described by the symmetric matrix $S=\begin{pmatrix}7&2\\2&4\end{pmatrix}$ (in MPa). The principal stresses are the eigenvalues of $S$. Find them.'
            answer: '3, 8'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The characteristic equation is $(7-\lambda)(4-\lambda)-4=\lambda^2-11\lambda+24=0$. It factors as $(\lambda-3)(\lambda-8)=0$. The principal stresses are $3$ MPa and $8$ MPa.'
          - problem: 'Two equal masses are joined by springs so that the stiffness matrix of the system is $K=\begin{pmatrix}3&-1\\-1&3\end{pmatrix}$. The two vibration modes are along perpendicular eigenvectors of $K$, and the stiffness of each mode is its eigenvalue. Find the two stiffnesses.'
            answer: '2, 4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The characteristic equation is $(3-\lambda)^2-1=0$, so $3-\lambda=\pm1$. The eigenvalues are $\lambda=2$ and $\lambda=4$. These are the stiffnesses of the two modes.'
        constraints: '2x2 symmetric matrices with integer eigenvalues; orthogonality verified by an explicit dot product; one non-symmetric counterexample; one multi-way classification of matrix types'
      - id: kp2
        name: Orthogonal diagonalization of a 2x2 symmetric matrix
        key_prerequisites: [diagonalization, orthogonal-matrices]
        exemplars:
          - problem: 'Orthogonally diagonalize $A=\begin{pmatrix}7&2\\2&7\end{pmatrix}$, that is, write $A=QDQ^T$ with $Q$ orthogonal and $D$ diagonal with the eigenvalues in increasing order. Find $D$.'
            answer: '[[5,0],[0,9]]'
            answer_contract: {"kind": "matrix", "rows": 2, "cols": 2}
            solution_sketch: 'The matrix has the form $\begin{pmatrix}a&b\\b&a\end{pmatrix}$, so its eigenvalues are $a-b=5$ and $a+b=9$. The diagonal matrix $D$ holds the eigenvalues, smaller one first. Hence $D=\begin{pmatrix}5&0\\0&9\end{pmatrix}$.'
          - problem: 'The symmetric matrix $A=\begin{pmatrix}10&3\\3&10\end{pmatrix}$ has the eigenvalues $7$ and $13$. Find the unit eigenvector for $13$ whose entries are positive.'
            answer: '(sqrt(2)/2, sqrt(2)/2)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'Solve $(A-13I)\mathbf v=\mathbf 0$: the first row gives $-3x+3y=0$, so $\mathbf v=(1,1)$. Its length is $\sqrt2$. Dividing by $\sqrt2$ gives the unit eigenvector $(\sqrt2/2,\sqrt2/2)$.'
          - problem: 'Find the unit eigenvector of $A=\begin{pmatrix}9&4\\4&9\end{pmatrix}$ for its smaller eigenvalue, choosing the one with a positive first entry.'
            answer: '(sqrt(2)/2, -sqrt(2)/2)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'The eigenvalues are $9-4=5$ and $9+4=13$, so the smaller one is $5$. Solving $(A-5I)\mathbf v=\mathbf 0$ gives $x+y=0$, so $\mathbf v=(1,-1)$. Dividing by its length $\sqrt2$ gives $(\sqrt2/2,-\sqrt2/2)$.'
          - problem: 'Find the eigenvalues of $A=\begin{pmatrix}8&5\\5&8\end{pmatrix}$.'
            answer: '3, 13'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'For a matrix $\begin{pmatrix}a&b\\b&a\end{pmatrix}$ the eigenvalues are $a-b$ and $a+b$. Here they are $8-5=3$ and $8+5=13$. These are the entries of $D$ in $A=QDQ^T$.'
          - problem: 'A flat plate has the inertia matrix $J=\begin{pmatrix}6&2\\2&6\end{pmatrix}$ (in kg m$^2$). Its principal moments are the diagonal entries of $D$ when $J=QDQ^T$ is an orthogonal diagonalization. Find the principal moments.'
            answer: '4, 8'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The principal moments are the eigenvalues of the symmetric matrix $J$. For $\begin{pmatrix}a&b\\b&a\end{pmatrix}$ they are $a-b=4$ and $a+b=8$. The principal moments are $4$ and $8$.'
          - problem: 'The strain in a thin film is described by the symmetric matrix $E=\begin{pmatrix}5&-3\\-3&5\end{pmatrix}$. The film stretches most along the unit eigenvector of the larger eigenvalue. Find this unit eigenvector, choosing the one with a positive second entry.'
            answer: '(-sqrt(2)/2, sqrt(2)/2)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'The eigenvalues are $5-3=2$ and $5+3=8$, so the larger one is $8$. Solving $(E-8I)\mathbf v=\mathbf 0$ gives $x+y=0$, so $\mathbf v=(-1,1)$ up to sign. Dividing by $\sqrt2$ gives $(-\sqrt2/2,\sqrt2/2)$.'
          - problem: 'Let $A=\begin{pmatrix}4&1\\1&4\end{pmatrix}$ and $Q=\frac{1}{\sqrt2}\begin{pmatrix}1&1\\-1&1\end{pmatrix}$. Find $Q^TAQ$.'
            answer: '[[3,0],[0,5]]'
            answer_contract: {"kind": "matrix", "rows": 2, "cols": 2}
            solution_sketch: 'The columns of $Q$ are unit eigenvectors of $A$ for the eigenvalues $3$ and $5$. So $Q^TAQ=D$ is the diagonal matrix of eigenvalues in that order. Direct multiplication confirms $Q^TAQ=\begin{pmatrix}3&0\\0&5\end{pmatrix}$.'
          - problem: 'The work below orthogonally diagonalizes $A=\begin{pmatrix}6&2\\2&6\end{pmatrix}$ and gives $D=\begin{pmatrix}6&0\\0&2\end{pmatrix}$. What is the correct $D$, with the eigenvalues in increasing order?'
            answer: '[[4,0],[0,8]]'
            answer_contract: {"kind": "matrix", "rows": 2, "cols": 2}
            solution_sketch: 'The diagonal entries of $D$ must be the eigenvalues of $A$, not the entries of $A$. The eigenvalues are $6-2=4$ and $6+2=8$. So $D=\begin{pmatrix}4&0\\0&8\end{pmatrix}$.'
        constraints: '2x2 symmetric matrices of the form [[a, b], [b, a]] so eigenvectors are (1, 1) and (1, -1); eigenvalues integers; answers are D, Q^T A Q, a unit eigenvector or the eigenvalues'
      - id: kp3
        name: Using the factorization A = QDQ^T
        key_prerequisites: [diagonalization, orthogonal-matrices]
        exemplars:
          - problem: 'Let $A=QDQ^T$, where $Q$ is orthogonal and $D=\begin{pmatrix}2&0\\0&5\end{pmatrix}$. Find $\det A$.'
            answer: '10'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The determinant of a product is the product of the determinants, so $\det A=\det Q\cdot\det D\cdot\det Q^T=(\det Q)^2\det D$. For an orthogonal matrix $(\det Q)^2=1$. So $\det A=\det D=2\cdot5=10$.'
          - problem: 'Let $A=QDQ^T$, where $Q$ is orthogonal and $D=\begin{pmatrix}2&0\\0&3\end{pmatrix}$. Find the eigenvalues of $A^3$.'
            answer: '8, 27'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Since $Q^TQ=I$, we have $A^3=QD^3Q^T$. So the eigenvalues of $A^3$ are the cubes of the diagonal entries of $D$. They are $2^3=8$ and $3^3=27$.'
          - problem: 'Let $A=QDQ^T$, where $Q$ is orthogonal and $D=\begin{pmatrix}1&0\\0&4\end{pmatrix}$. Find $\det(A^2)$.'
            answer: '16'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The determinant of $A$ equals $\det D=1\cdot4=4$. Then the determinant of the square is the square of the determinant, so $\det(A^2)=(\det A)^2=4^2=16$.'
          - problem: 'Let $A=QDQ^T$, where $Q$ is orthogonal and $D=\begin{pmatrix}3&0\\0&4\end{pmatrix}$. Find the eigenvalues of $A^{-1}$.'
            answer: '1/4, 1/3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The inverse is $A^{-1}=QD^{-1}Q^T$. So the eigenvalues of $A^{-1}$ are the reciprocals of the diagonal entries of $D$. They are $1/3$ and $1/4$.'
          - problem: 'A symmetric matrix $A=QDQ^T$ with $D=\begin{pmatrix}2&0\\0&3\end{pmatrix}$ and $Q$ orthogonal changes the area of every region of the plane by the same factor. After the transformation $A$, a region has area $90\ \mathrm{m}^2$. What area did it have before?'
            answer: '15'
            answer_contract: {"kind": "unit", "quantity": "area", "unit": "m^2", "allow_omitted": true}
            solution_sketch: 'The area is multiplied by $|\det A|=\det D=2\cdot3=6$. The area after the transformation is $90$, so the area before is $90\div6=15$ square metres.'
          - problem: 'The transformation $A=QDQ^T$ with $D=\begin{pmatrix}2&0\\0&3\end{pmatrix}$ and $Q$ orthogonal is applied twice to a region of area $5\ \mathrm{cm}^2$. What is the area of the region at the end?'
            answer: '180'
            answer_contract: {"kind": "unit", "quantity": "area", "unit": "cm^2", "allow_omitted": true}
            solution_sketch: 'One application multiplies areas by $\det A=\det D=6$. Two applications multiply by $6^2=36$. The final area is $36\cdot5=180$ square centimetres.'
          - problem: 'Let $A=QDQ^T$, where $Q$ is orthogonal and $D=\begin{pmatrix}1&0\\0&5\end{pmatrix}$. Find the trace of $A^3$.'
            answer: '126'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Since $A^3=QD^3Q^T$, the eigenvalues of $A^3$ are $1^3=1$ and $5^3=125$. The trace is the sum of the eigenvalues, so $\operatorname{tr}(A^3)=1+125=126$.'
          - problem: 'Let $A=QDQ^T$, where $Q$ is orthogonal and $D=\begin{pmatrix}2&0\\0&4\end{pmatrix}$. Find $\det(A^{-1})$.'
            answer: '1/8'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The determinant of $A$ is $\det D=2\cdot4=8$. For an invertible matrix $\det(A^{-1})=1/\det A$, so $\det(A^{-1})=1/8$.'
        constraints: 'D diagonal with small integer entries; answers obtained without multiplying out Q; determinants also read as area factors'
    diagnostic_exemplar:
      problem: 'Orthogonally diagonalize $A = \begin{pmatrix}3&1\\1&3\end{pmatrix}$ as $A = QDQ^T$, then use the factorization to give $\det A$ and the eigenvalues of $A^2$.'
      answer: '$Q = \frac{1}{\sqrt{2}}\begin{pmatrix}1&1\\-1&1\end{pmatrix}$, $D = \begin{pmatrix}2&0\\0&4\end{pmatrix}$; $\det A = 8$; $A^2$ has eigenvalues $4$ and $16$'
      answer_contract: {kind: none}
      solution_sketch: 'The eigenpairs are $2$ with $(1, -1)$ and $4$ with $(1, 1)$; normalizing gives the columns of $Q$, and $\det A = \det D = 8$ while $A^2 = QD^2Q^T$.'
    anki_seeds:
      - front: 'Spectral theorem: every real symmetric matrix can be written as...'
        back: '$A = QDQ^T$ with $Q$ orthogonal and $D$ diagonal (real eigenvalues on the diagonal).'
        type: basic
      - front: 'For a symmetric matrix, eigenvectors belonging to different eigenvalues are...'
        back: 'orthogonal.'
        type: basic
      - front: 'The matrices that are orthogonally diagonalizable are exactly...'
        back: 'the symmetric matrices.'
        type: basic

  - id: quadratic-forms
    name: Quadratic Forms and Principal Axes
    core: false                # terminal application of the spectral theorem; requirements list quadratic forms beyond this application as cut-first, so it stays one supplemental capstone
    difficulty: 0.8
    drill: false
    answer_kind: numeric
    expected_time_secs: 300
    prerequisites:
      - id: spectral-theorem-symmetric-matrices
        weight: 0.7
        key: true
      - id: transpose-symmetric-matrices
        weight: 0.4
      - id: classifying-conics-completing-square
        weight: 0
    knowledge_points:
      - id: kp1
        name: The matrix of a quadratic form
        key_prerequisites: [transpose-symmetric-matrices]
        exemplars:
          - problem: 'Find the symmetric matrix $A$ for which $q(x,y)=4x^2+10xy+7y^2$ equals $\mathbf x^TA\mathbf x$.'
            answer: '[[4,5],[5,7]]'
            answer_contract: {"kind": "matrix", "rows": 2, "cols": 2}
            solution_sketch: 'The diagonal entries of $A$ are the coefficients of $x^2$ and $y^2$, so $A_{11}=4$ and $A_{22}=7$. The cross term $10xy$ comes from two equal entries $A_{12}=A_{21}$, so each is $10/2=5$. Hence $A=\begin{pmatrix}4&5\\5&7\end{pmatrix}$.'
          - problem: 'Let $A=\begin{pmatrix}1&2\\2&3\end{pmatrix}$. Find $\mathbf x^TA\mathbf x$ for $\mathbf x=(1,1)$.'
            answer: '8'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'First $A\mathbf x=(1+2,\,2+3)=(3,5)$. Then $\mathbf x^TA\mathbf x=1\cdot3+1\cdot5=8$. This agrees with the polynomial $x^2+4xy+3y^2$ at $(1,1)$, which is $1+4+3=8$.'
          - problem: 'For the symmetric matrix $A=\begin{pmatrix}5&2\\2&-1\end{pmatrix}$, write $\mathbf x^TA\mathbf x$ as a polynomial in $x$ and $y$.'
            answer: '5x^2+4xy-y^2'
            answer_contract: {"kind": "required_form", "form": "expanded_polynomial"}
            solution_sketch: 'The squared terms have the diagonal entries as coefficients: $5x^2$ and $-y^2$. The cross term is $2A_{12}xy=2\cdot2\,xy=4xy$. So $\mathbf x^TA\mathbf x=5x^2+4xy-y^2$.'
          - problem: 'The symmetric matrix $A$ satisfies $\mathbf x^TA\mathbf x=x^2+12xy+3y^2$. Find the entry $A_{12}$ in row $1$, column $2$.'
            answer: '6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The cross term $12xy$ is the sum of the two equal contributions $A_{12}xy$ and $A_{21}xy$. So $2A_{12}=12$ and $A_{12}=6$.'
          - problem: 'Find the symmetric matrix $A$ for which $q(x,y)=3x^2-4xy+2y^2$ equals $\mathbf x^TA\mathbf x$.'
            answer: '[[3,-2],[-2,2]]'
            answer_contract: {"kind": "matrix", "rows": 2, "cols": 2}
            solution_sketch: 'The diagonal entries are the coefficients $3$ and $2$ of $x^2$ and $y^2$. The cross term $-4xy$ is split evenly, so $A_{12}=A_{21}=-4/2=-2$. Hence $A=\begin{pmatrix}3&-2\\-2&2\end{pmatrix}$.'
          - problem: 'The potential energy of two coupled springs is $E(x,y)=2x^2-2xy+3y^2$ joules for the displacements $x$ and $y$. Find the symmetric matrix $A$ with $E=\mathbf x^TA\mathbf x$.'
            answer: '[[2,-1],[-1,3]]'
            answer_contract: {"kind": "matrix", "rows": 2, "cols": 2}
            solution_sketch: 'The squared terms give the diagonal entries $2$ and $3$. The cross term $-2xy$ is shared by two equal entries, so each is $-2/2=-1$. Hence $A=\begin{pmatrix}2&-1\\-1&3\end{pmatrix}$.'
          - problem: 'The elastic energy of a system is $E=\mathbf x^TK\mathbf x$ with $K=\begin{pmatrix}3&-1\\-1&3\end{pmatrix}$, where $\mathbf x=(x,y)$ is the displacement. Find $E$ when the displacement is $(2,1)$.'
            answer: '11'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'First $K\mathbf x=(3\cdot2-1,\,-2+3\cdot1)=(5,1)$. Then $E=\mathbf x^TK\mathbf x=2\cdot5+1\cdot1=11$. Equivalently, the energy is the polynomial $E=3x^2-2xy+3y^2$, which equals $12-4+3=11$ at this displacement.'
          - problem: 'The symmetric matrix $A$ of the quadratic form $q(x,y,z)=x^2+4y^2+9z^2+2xy-6xz+8yz$ is a $3\times3$ matrix. Find the entry $A_{23}$ in row $2$, column $3$.'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The cross term $8yz$ comes from the two equal entries $A_{23}$ and $A_{32}$. So $2A_{23}=8$ and $A_{23}=4$.'
          - problem: 'Let $A=\begin{pmatrix}0&5\\5&0\end{pmatrix}$. Find the coefficient of $xy$ in the polynomial $\mathbf x^TA\mathbf x$.'
            answer: '10'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The product $\mathbf x^TA\mathbf x$ is $5xy+5yx=10xy$, because both off-diagonal entries are $5$. The coefficient of $xy$ is $2\cdot5=10$.'
        constraints: '2 variables (one 3-variable case); integer coefficients with the xy coefficient even so A has integer entries'
      - id: kp2
        name: Classifying definiteness by eigenvalues
        key_prerequisites: [spectral-theorem-symmetric-matrices]
        try_first:
          problem: 'Is $x^2+4xy+y^2$ positive at every point $(x,y)$ other than $(0,0)$?'
          answer_contract: {"kind": "label", "options": [["yes", "it is positive", "positive"], ["no", "it is not", "not positive"]]}
          answer: 'no'
          reveal: 'At $(1,-1)$ the value is $1-4+1=-2$, which is negative, so the form takes both signs. The signs of the eigenvalues of its matrix decide this in general.'
        exemplars:
          - problem: 'Is the quadratic form $q(x,y)=3x^2+2xy+3y^2$ positive definite, negative definite or indefinite?'
            answer: 'positive definite'
            answer_contract: {"kind": "label", "options": [["positive definite", "positive", "it is positive definite", "positive-definite"], ["negative definite", "negative", "it is negative definite", "negative-definite"], ["indefinite", "it is indefinite"]]}
            solution_sketch: 'The matrix of $q$ is $\begin{pmatrix}3&1\\1&3\end{pmatrix}$ with trace $6$ and determinant $8$. Its eigenvalues solve $\lambda^2-6\lambda+8=0$, so they are $2$ and $4$. Both are positive, so $q$ is positive definite.'
          - problem: 'The form $q(x,y)=2x^2+6xy+2y^2$ has the symmetric matrix $A=\begin{pmatrix}2&3\\3&2\end{pmatrix}$. Find the eigenvalues of $A$.'
            answer: '5, -1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The trace is $4$ and the determinant is $4-9=-5$, so $\lambda^2-4\lambda-5=0$. This factors as $(\lambda-5)(\lambda+1)=0$. The eigenvalues are $5$ and $-1$, which have opposite signs, so $q$ is indefinite.'
          - problem: 'Find $q(1,-1)$ for the form $q(x,y)=2x^2+6xy+2y^2$.'
            answer: '-2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Substitute $x=1$ and $y=-1$: $q(1,-1)=2\cdot1+6\cdot(1)(-1)+2\cdot1=2-6+2=-2$. The value is negative, and $q(1,1)=10$ is positive, so $q$ takes both signs.'
          - problem: 'What is the product of the two eigenvalues of $A=\begin{pmatrix}5&2\\2&2\end{pmatrix}$?'
            answer: '6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The product of the eigenvalues of a $2\times2$ matrix is its determinant, which is $5\cdot2-2\cdot2=6$. The trace is $7$, so the eigenvalues are $1$ and $6$. Both are positive, so the form $5x^2+4xy+2y^2$ is positive definite.'
          - problem: 'The Hessian of a function $f$ at a critical point is $H=\begin{pmatrix}-2&1\\1&-2\end{pmatrix}$. Is the critical point a local maximum, a local minimum or a saddle point?'
            answer: 'local maximum'
            answer_contract: {"kind": "label", "options": [["local maximum", "maximum", "a local maximum", "max"], ["local minimum", "minimum", "a local minimum", "min"], ["saddle point", "saddle", "a saddle point"]]}
            solution_sketch: 'The behavior of $f$ near the point is governed by the quadratic form $\mathbf x^TH\mathbf x$. The eigenvalues of $H$ solve $(-2-\lambda)^2-1=0$, so they are $-1$ and $-3$. Both are negative, so the form is negative definite and the critical point is a local maximum.'
          - problem: 'Find the largest integer $k$ for which $q(x,y)=x^2+kxy+4y^2$ is positive definite.'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The matrix is $\begin{pmatrix}1&k/2\\k/2&4\end{pmatrix}$. The form is positive definite when the trace is positive and the determinant $4-k^2/4$ is positive. This gives $k^2<16$, so $-4<k<4$, and the largest integer is $3$.'
          - problem: 'The energy of a vibrating system is $E(x,y)=ax^2+4xy+5y^2$. The equilibrium is stable when $E>0$ for every displacement $(x,y)\neq(0,0)$. Find the smallest integer $a$ for which the equilibrium is stable.'
            answer: '1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The energy is positive for every nonzero displacement exactly when its matrix $\begin{pmatrix}a&2\\2&5\end{pmatrix}$ is positive definite. The determinant $5a-4$ must be positive, so $a>4/5$, and then the trace is positive too. The smallest integer is $1$.'
        constraints: '2x2 symmetric matrices with integer eigenvalues given or easily computed; classes limited to positive definite, negative definite, indefinite; one Hessian item and two parameter items decided by trace and determinant'
      - id: kp3
        name: Principal axes remove the cross term
        key_prerequisites: [spectral-theorem-symmetric-matrices]
        exemplars:
          - problem: 'Rotate the axes to remove the cross term of $q(x,y)=2x^2+4xy+5y^2$. Write $q$ in the new coordinates $u$ and $v$, with $u$ along the eigenvector for the smaller eigenvalue.'
            answer: 'u^2+6v^2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The matrix of $q$ is $\begin{pmatrix}2&2\\2&5\end{pmatrix}$ with trace $7$ and determinant $6$. Its eigenvalues solve $\lambda^2-7\lambda+6=0$, so they are $1$ and $6$. In principal-axis coordinates $q=u^2+6v^2$.'
          - problem: 'The matrix of the quadratic form $q(x,y)=x^2+3xy+y^2$ is $A=\begin{pmatrix}1&3/2\\3/2&1\end{pmatrix}$. In principal-axis coordinates the form has a diagonal matrix $D$. Find $D$ with the eigenvalues in increasing order.'
            answer: '[[-1/2,0],[0,5/2]]'
            answer_contract: {"kind": "matrix", "rows": 2, "cols": 2}
            solution_sketch: 'The eigenvalues solve $(1-\lambda)^2-9/4=0$, so $1-\lambda=\pm3/2$. They are $\lambda=-1/2$ and $\lambda=5/2$. In increasing order, $D=\begin{pmatrix}-1/2&0\\0&5/2\end{pmatrix}$.'
          - problem: 'The energy of a particle in a crystal is $E(x,y)=3x^2+2xy+3y^2$. Write $E$ in principal-axis coordinates $u$ and $v$, with $u$ along the eigenvector for the smaller eigenvalue.'
            answer: '2u^2+4v^2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The matrix is $\begin{pmatrix}3&1\\1&3\end{pmatrix}$, and $(3-\lambda)^2-1=0$ gives $\lambda=2$ and $\lambda=4$. The cross term vanishes in principal-axis coordinates. So $E=2u^2+4v^2$.'
          - problem: 'Find the eigenvalues of the matrix of the quadratic form $q(x,y)=4x^2+4xy+7y^2$.'
            answer: '3, 8'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The matrix is $\begin{pmatrix}4&2\\2&7\end{pmatrix}$ with trace $11$ and determinant $24$. So $\lambda^2-11\lambda+24=(\lambda-3)(\lambda-8)=0$, and the eigenvalues are $3$ and $8$.'
          - problem: 'Is the curve $x^2+4xy+y^2=1$ an ellipse or a hyperbola?'
            answer: 'hyperbola'
            answer_contract: {"kind": "label", "options": [["ellipse", "an ellipse"], ["hyperbola", "a hyperbola"]]}
            solution_sketch: 'The matrix $\begin{pmatrix}1&2\\2&1\end{pmatrix}$ has eigenvalues $1+2=3$ and $1-2=-1$. In principal-axis coordinates the curve is $3u^2-v^2=1$. The coefficients have opposite signs, so the curve is a hyperbola.'
          - problem: 'What is the largest value of $q(x,y)=5x^2+8xy+5y^2$ on the circle $x^2+y^2=1$?'
            answer: '9'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'In principal-axis coordinates $q=\lambda_1u^2+\lambda_2v^2$ and the circle is $u^2+v^2=1$. The largest value on the circle is the largest eigenvalue. The matrix $\begin{pmatrix}5&4\\4&5\end{pmatrix}$ has eigenvalues $1$ and $9$, so the largest value is $9$.'
          - problem: 'The energy of a plate under a displacement $(x,y)$ is $E=3x^2+2xy+3y^2$ in joules. Among all displacements of length $1$ (so $x^2+y^2=1$), what is the smallest possible energy?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'On the circle $u^2+v^2=1$ the energy $\lambda_1u^2+\lambda_2v^2$ is smallest at the smallest eigenvalue. The eigenvalues of $\begin{pmatrix}3&1\\1&3\end{pmatrix}$ are $2$ and $4$. The smallest energy is $2$ joules.'
          - problem: 'The curve $3x^2+2xy+3y^2=1$ is an ellipse. Find the length of its longer semi-axis.'
            answer: '1/sqrt(2)'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'In principal-axis coordinates the curve is $2u^2+4v^2=1$. The semi-axes are $1/\sqrt2$ along the $u$ axis and $1/\sqrt4=1/2$ along the $v$ axis. The longer one is $1/\sqrt2$.'
        constraints: '2x2 forms whose eigenvalues are integers or halves; conclusions stated in principal-axis coordinates, extreme values on the unit circle and semi-axes, no explicit angle computations'
    diagnostic_exemplar:
      problem: 'Write $q(x, y) = x^2 + 4xy + y^2$ as $\mathbf{x}^TA\mathbf{x}$ with $A$ symmetric, classify its definiteness, and give its cross-term-free form in principal-axis coordinates.'
      answer: '$A = \begin{pmatrix}1&2\\2&1\end{pmatrix}$; eigenvalues $3$ and $-1$, so $q$ is indefinite; in principal-axis coordinates $q = 3u^2 - v^2$'
      answer_contract: {kind: none}
      solution_sketch: 'Split the $4xy$ evenly off the diagonal; the eigenvalues of $A$ are $1 \pm 2$, and the principal-axis form has those eigenvalues as coefficients.'
    anki_seeds:
      - front: 'In the symmetric matrix of a quadratic form, the coefficient of $xy$ is...'
        back: 'split in half across the two off-diagonal entries.'
        type: basic
      - front: 'A quadratic form is positive definite iff the eigenvalues of its matrix are...'
        back: 'all positive (negative definite: all negative; indefinite: both signs).'
        type: basic
      - front: 'The principal-axes theorem: substituting $\mathbf{x} = Q\mathbf{u}$ turns $\mathbf{x}^TA\mathbf{x}$ into...'
        back: '$\lambda_1 u_1^2 + \cdots + \lambda_n u_n^2$ — the cross terms disappear along the eigenvector axes.'
        type: basic

  - id: singular-value-decomposition
    name: The Singular Value Decomposition
    core: false                # re-audit R-40: terminal capstone of the supplemental spectral branch; nothing in the tree builds on it
    difficulty: 0.85
    drill: false
    answer_kind: numeric
    expected_time_secs: 300
    prerequisites:
      - id: spectral-theorem-symmetric-matrices
        weight: 0.7
        key: true
      - id: transpose-symmetric-matrices
        weight: 0.5
        key: true
      - id: null-column-space-rank
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: Singular values from A^T A
        key_prerequisites: [transpose-symmetric-matrices, spectral-theorem-symmetric-matrices]
        exemplars:
          - problem: 'Find the singular values of $A=\begin{pmatrix}0&7\\3&0\end{pmatrix}$.'
            answer: '7, 3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'First $A^TA=\begin{pmatrix}9&0\\0&49\end{pmatrix}$, which is diagonal, so its eigenvalues are $49$ and $9$. The singular values are the square roots of these eigenvalues. They are $\sqrt{49}=7$ and $\sqrt9=3$.'
          - problem: 'The matrix $A=\begin{pmatrix}3&3\\3&3\end{pmatrix}$ has two identical columns. Find its singular values.'
            answer: '6, 0'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'First $A^TA=\begin{pmatrix}18&18\\18&18\end{pmatrix}$. Its characteristic equation is $\lambda^2-36\lambda=0$, so the eigenvalues are $36$ and $0$. The singular values are $\sqrt{36}=6$ and $\sqrt0=0$.'
          - problem: 'Find the singular values of the $3\times2$ matrix $A=\begin{pmatrix}1&1\\1&1\\1&-1\end{pmatrix}$.'
            answer: '2, sqrt(2)'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'First $A^TA=\begin{pmatrix}3&1\\1&3\end{pmatrix}$. A matrix of the form $\begin{pmatrix}a&b\\b&a\end{pmatrix}$ has eigenvalues $a+b=4$ and $a-b=2$. The singular values are $\sqrt4=2$ and $\sqrt2$.'
          - problem: 'Find the singular values of $A=\begin{pmatrix}1&3\\3&1\end{pmatrix}$.'
            answer: '4, 2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'First $A^TA=\begin{pmatrix}10&6\\6&10\end{pmatrix}$, with eigenvalues $10+6=16$ and $10-6=4$. The singular values are $\sqrt{16}=4$ and $\sqrt4=2$.'
          - problem: 'The matrix $A=\begin{pmatrix}2&4\\4&2\end{pmatrix}$ transforms vectors of the plane. By what largest factor can $A$ multiply the length of a vector?'
            answer: '6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The largest stretching factor of $A$ is its largest singular value. Here $A^TA=\begin{pmatrix}20&16\\16&20\end{pmatrix}$ has eigenvalues $36$ and $4$. The largest factor is $\sqrt{36}=6$.'
          - problem: 'The matrix $A=\begin{pmatrix}2&1\\1&2\end{pmatrix}$ transforms vectors of the plane. What is the smallest factor by which $A$ multiplies the length of a nonzero vector?'
            answer: '1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The smallest stretching factor of this invertible $2\times2$ matrix is its smallest singular value. Here $A^TA=\begin{pmatrix}5&4\\4&5\end{pmatrix}$ has eigenvalues $9$ and $1$. The smallest factor is $\sqrt1=1$.'
          - problem: 'The matrix $A=\begin{pmatrix}3&0\\4&5\end{pmatrix}$ sends the unit circle to an ellipse. Find the lengths of the two semi-axes of this ellipse.'
            answer: '3*sqrt(5), sqrt(5)'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The semi-axes of the ellipse are the singular values of $A$. First $A^TA=\begin{pmatrix}25&20\\20&25\end{pmatrix}$, with eigenvalues $45$ and $5$. The semi-axes are $\sqrt{45}=3\sqrt5$ and $\sqrt5$.'
        constraints: 'A is 2x2 or 3x2 rigged so A^T A is diagonal or of the form [[a,b],[b,a]] with integer eigenvalues, plus one A with A^T A = [[25,20],[20,25]]; singular values are integers or single square roots; stretch factors and semi-axes of an ellipse read as singular values'
      - id: kp2
        name: Assembling A = U Sigma V^T
        key_prerequisites: [spectral-theorem-symmetric-matrices]
        exemplars:
          - problem: 'The matrix $A=\begin{pmatrix}0&2\\1&0\end{pmatrix}$ has an SVD $A=U\Sigma V^T$ with $V=\begin{pmatrix}0&1\\1&0\end{pmatrix}$ and $\Sigma=\begin{pmatrix}2&0\\0&1\end{pmatrix}$. Find $U$.'
            answer: '[[1,0],[0,1]]'
            answer_contract: {"kind": "matrix", "rows": 2, "cols": 2}
            solution_sketch: 'From $A=U\Sigma V^T$ we get $U=AV\Sigma^{-1}$. First $AV=\begin{pmatrix}2&0\\0&1\end{pmatrix}$, and $\Sigma^{-1}=\begin{pmatrix}1/2&0\\0&1\end{pmatrix}$. So $U=\begin{pmatrix}1&0\\0&1\end{pmatrix}$.'
          - problem: 'The matrix $A=\begin{pmatrix}0&3\\4&0\end{pmatrix}$ has an SVD $A=U\Sigma V^T$ with $U=\begin{pmatrix}0&1\\1&0\end{pmatrix}$ and $V=I$. Find $\Sigma$.'
            answer: '[[4,0],[0,3]]'
            answer_contract: {"kind": "matrix", "rows": 2, "cols": 2}
            solution_sketch: 'Multiply $A=U\Sigma V^T$ by $U^T$ on the left and by $V$ on the right to get $\Sigma=U^TAV$. Here $U^TA=\begin{pmatrix}4&0\\0&3\end{pmatrix}$ and $V=I$ leaves it unchanged. So $\Sigma=\begin{pmatrix}4&0\\0&3\end{pmatrix}$.'
          - problem: 'A matrix has the SVD $A=U\Sigma V^T$ with $U=\begin{pmatrix}0&1\\1&0\end{pmatrix}$, $\Sigma=\begin{pmatrix}3&0\\0&2\end{pmatrix}$ and $V=I$. Find $A$.'
            answer: '[[0,2],[3,0]]'
            answer_contract: {"kind": "matrix", "rows": 2, "cols": 2}
            solution_sketch: 'First $U\Sigma=\begin{pmatrix}0&2\\3&0\end{pmatrix}$, since $U$ swaps the rows of $\Sigma$. Then $V^T=I$ leaves the product unchanged. So $A=\begin{pmatrix}0&2\\3&0\end{pmatrix}$.'
          - problem: 'A rubber sheet is deformed by $\mathbf x\mapsto A\mathbf x$, where $A=U\Sigma V^T$ with $U=I$, $\Sigma=\begin{pmatrix}2&0\\0&1\end{pmatrix}$ and $V^T=\begin{pmatrix}0&1\\1&0\end{pmatrix}$. Where does the point $(3,1)$ go?'
            answer: '(2, 3)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'Apply the factors from right to left. First $V^T(3,1)=(1,3)$. Then $\Sigma$ doubles the first coordinate to give $(2,3)$, and $U=I$ changes nothing. So the point goes to $(2,3)$.'
          - problem: 'The matrix $A=\begin{pmatrix}3&4\\4&-3\end{pmatrix}$ has an SVD $A=U\Sigma V^T$ with $V=I$ and $\Sigma=\begin{pmatrix}5&0\\0&5\end{pmatrix}$. Find $U$.'
            answer: '[[3/5,4/5],[4/5,-3/5]]'
            answer_contract: {"kind": "matrix", "rows": 2, "cols": 2}
            solution_sketch: 'Since $A=U\Sigma V^T$ with $V=I$ and $\Sigma=5I$, we get $U=A\Sigma^{-1}=A/5$. Dividing every entry of $A$ by $5$ gives $U=\begin{pmatrix}3/5&4/5\\4/5&-3/5\end{pmatrix}$. Its columns are orthonormal, as they must be.'
          - problem: 'The matrix $A=U\Sigma V^T$ has $\Sigma=\begin{pmatrix}4&0\\0&2\end{pmatrix}$. It maps the unit disk, which has area $\pi$, onto an ellipse. What is the area of the ellipse?'
            answer: '8*pi'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The factors $V^T$ and $U$ are orthogonal, so they only turn the disk. The factor $\Sigma$ stretches it into an ellipse with semi-axes $4$ and $2$. The area of this ellipse is $\pi\cdot4\cdot2=8\pi$.'
          - problem: 'A matrix $A=U\Sigma V^T$ has $\sigma_1=6$. It maps the unit disk, which has area $\pi$, onto an ellipse of area $24\pi$. Find $\sigma_2$.'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The ellipse has semi-axes $\sigma_1$ and $\sigma_2$, so its area is $\pi\sigma_1\sigma_2$. Then $\pi\cdot6\sigma_2=24\pi$. Dividing by $6\pi$ gives $\sigma_2=4$.'
          - problem: 'The matrix $A=\begin{pmatrix}3&0\\0&-2\end{pmatrix}$ has an SVD $A=U\Sigma V^T$ with $U=\begin{pmatrix}1&0\\0&-1\end{pmatrix}$ and $V=I$. Find $\Sigma$.'
            answer: '[[3,0],[0,2]]'
            answer_contract: {"kind": "matrix", "rows": 2, "cols": 2}
            solution_sketch: 'Use $\Sigma=U^TAV$. First $U^TA=\begin{pmatrix}3&0\\0&2\end{pmatrix}$, since $U^T$ changes the sign of the second row. Then $V=I$ changes nothing. The singular values are never negative, and here they are $3$ and $2$.'
        constraints: '2x2 matrices rigged so A^T A is diagonal or 2I, so all matrix entries stay rational; U, Sigma, V or A is asked from the other factors; areas of ellipses as pi times sigma1 times sigma2; always verify U Sigma V^T = A'
      - id: kp3
        name: Reading rank and best rank-1 approximation off the SVD
        key_prerequisites: [null-column-space-rank, spectral-theorem-symmetric-matrices]
        exemplars:
          - problem: 'A $3\times3$ matrix has the singular values $3$, $1$ and $0$. What is its rank?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The rank of a matrix equals the number of its nonzero singular values. The list $3,1,0$ has two nonzero values. So the rank is $2$.'
          - problem: 'A $2\times2$ matrix has the singular value $\sigma_1=2$ with $\mathbf u_1=\frac1{\sqrt2}(1,-1)$ and $\mathbf v_1=\frac1{\sqrt2}(1,1)$. Find its best rank-$1$ approximation $\sigma_1\mathbf u_1\mathbf v_1^T$.'
            answer: '[[1,1],[-1,-1]]'
            answer_contract: {"kind": "matrix", "rows": 2, "cols": 2}
            solution_sketch: 'The outer product is $\mathbf u_1\mathbf v_1^T=\frac12\begin{pmatrix}1&1\\-1&-1\end{pmatrix}$. Multiplying by $\sigma_1=2$ gives $\begin{pmatrix}1&1\\-1&-1\end{pmatrix}$. This is the best rank-$1$ approximation.'
          - problem: 'A grayscale picture of $100\times100$ pixels is stored as a matrix with $10000$ entries. Its rank-$3$ approximation $\sigma_1\mathbf u_1\mathbf v_1^T+\sigma_2\mathbf u_2\mathbf v_2^T+\sigma_3\mathbf u_3\mathbf v_3^T$ is stored as the three numbers $\sigma_i$ and the three pairs of vectors $\mathbf u_i,\mathbf v_i$, each with $100$ entries. How many numbers must be stored?'
            answer: '603'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Each of the three terms needs one number $\sigma_i$ and two vectors of $100$ entries, which is $1+100+100=201$ numbers. Three terms need $3\cdot201=603$ numbers. This is far fewer than the $10000$ entries of the full picture.'
          - problem: 'A $6\times6$ matrix has the singular values $7$, $4$, $2$, $0$, $0$ and $0$. What is the dimension of its null space?'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The rank is the number of nonzero singular values, which is $3$. By the rank-nullity theorem the null space has dimension $6-3=3$.'
          - problem: 'A $2\times2$ matrix has the singular value $\sigma_1=3$ with $\mathbf u_1=(0,1)$ and $\mathbf v_1=(1,0)$. Find its best rank-$1$ approximation $\sigma_1\mathbf u_1\mathbf v_1^T$.'
            answer: '[[0,0],[3,0]]'
            answer_contract: {"kind": "matrix", "rows": 2, "cols": 2}
            solution_sketch: 'The outer product is $\mathbf u_1\mathbf v_1^T=\begin{pmatrix}0\\1\end{pmatrix}\begin{pmatrix}1&0\end{pmatrix}=\begin{pmatrix}0&0\\1&0\end{pmatrix}$. Multiplying by $\sigma_1=3$ gives $\begin{pmatrix}0&0\\3&0\end{pmatrix}$.'
          - problem: 'A $2\times2$ matrix $A$ has the singular values $5$ and $4$, and $A_1$ is its best rank-$1$ approximation. By what largest factor can $A-A_1$ multiply the length of a vector?'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The difference $A-A_1$ keeps only the second singular piece $\sigma_2\mathbf u_2\mathbf v_2^T$. Its largest stretching factor is the remaining singular value $\sigma_2=4$.'
          - problem: 'A $5\times5$ data matrix has the singular values $6$, $5$, $2$, $0$ and $0$. Find its rank.'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The rank equals the number of nonzero singular values. The values $6$, $5$ and $2$ are nonzero, and the other two are $0$. So the rank is $3$.'
          - problem: 'A $2\times2$ matrix has the singular value $\sigma_1=2$ and $\sigma_2=0$, with $\mathbf u_1=\mathbf v_1=\frac1{\sqrt2}(1,1)$. Find its best rank-$1$ approximation $\sigma_1\mathbf u_1\mathbf v_1^T$.'
            answer: '[[1,1],[1,1]]'
            answer_contract: {"kind": "matrix", "rows": 2, "cols": 2}
            solution_sketch: 'The outer product is $\mathbf u_1\mathbf v_1^T=\frac12\begin{pmatrix}1&1\\1&1\end{pmatrix}$. Multiplying by $\sigma_1=2$ gives $\begin{pmatrix}1&1\\1&1\end{pmatrix}$. Since $\sigma_2=0$, this approximation equals the matrix itself.'
        constraints: 'SVD data given or carried over from kp2-scale computations; rank and null-space dimension read off the sigma list; rank-1 term computed as an explicit outer product with entries in -3..3; storage count for a rank-k picture'
    diagnostic_exemplar:
      problem: 'For $A = \begin{pmatrix}0&4\\2&0\end{pmatrix}$, find the singular values, an SVD $A = U\Sigma V^T$, and the rank of $A$.'
      answer: '$\sigma_1 = 4$, $\sigma_2 = 2$; $U = I_2$, $\Sigma = \begin{pmatrix}4&0\\0&2\end{pmatrix}$, $V^T = \begin{pmatrix}0&1\\1&0\end{pmatrix}$; rank $2$'
      answer_contract: {kind: none}
      solution_sketch: '$A^TA = \mathrm{diag}(4, 16)$, so the singular values are $4$ and $2$ with $\mathbf{v}_1 = (0,1)$, $\mathbf{v}_2 = (1,0)$; then $\mathbf{u}_i = A\mathbf{v}_i/\sigma_i$ gives $U = I$, and both singular values are nonzero.'
    anki_seeds:
      - front: 'The singular values of $A$ are...'
        back: 'the square roots of the eigenvalues of $A^TA$, listed in decreasing order.'
        type: basic
