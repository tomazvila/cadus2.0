unit: orthogonality-spectral
course: linear-algebra
module: "Orthogonal Matrices & Spectral Theory"
topics:
  - id: orthogonal-matrices
    name: Orthogonal Matrices
    core: false                # spectral branch sits below the supplemental orthogonality run (orthogonal-orthonormal-sets); nothing in a higher-ordered course consumes it, so the branch deliberately stays supplemental (R-2)
    difficulty: 0.7
    drill: false
    answer_kind: numeric
    expected_time_secs: 210
    prerequisites:
      - id: orthogonal-orthonormal-sets
        weight: 0.7
        key: true
      - id: transpose-symmetric-matrices
        weight: 0.6
        key: true
      - id: matrix-inverses
        weight: 0.4
      - id: linear-transformations
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: Recognizing orthogonal matrices
        key_prerequisites: [orthogonal-orthonormal-sets, transpose-symmetric-matrices]
        exemplars:
          - problem: 'Is $Q = \frac{1}{5}\begin{pmatrix}3&-4\\4&3\end{pmatrix}$ an orthogonal matrix?'
            answer: "Yes: its columns (3/5, 4/5) and (-4/5, 3/5) are orthonormal, so Q^T Q = I"
            answer_contract: {kind: none}
            solution_sketch: 'Each column has norm $\frac{1}{5}\sqrt{9 + 16} = 1$ and their dot product is $\frac{1}{25}(-12 + 12) = 0$.'
          - problem: 'Is $A = \begin{pmatrix}1&1\\0&1\end{pmatrix}$ orthogonal?'
            answer: "No"
            answer_contract: {"kind":"label","options":[["yes"],["no"]]}
            solution_sketch: 'The columns are not orthonormal: $(1, 0) \cdot (1, 1) = 1 \neq 0$ (and the second column has norm $\sqrt{2}$).'
          - problem: 'Is the rotation matrix $\begin{pmatrix}0&-1\\1&0\end{pmatrix}$ orthogonal?'
            answer: "Yes"
            answer_contract: {"kind":"label","options":[["yes"],["no"]]}
            solution_sketch: 'Columns $(0, 1)$ and $(-1, 0)$ are unit vectors with dot product $0$; equivalently $Q^TQ = I$.'
        constraints: "2x2 candidates; orthogonal cases built from 3-4-5 columns, rotations by multiples of 90 degrees, or 1/sqrt(2) entries"
      - id: kp2
        name: The inverse is the transpose
        key_prerequisites: [transpose-symmetric-matrices, matrix-inverses]
        exemplars:
          - problem: '$Q = \frac{1}{5}\begin{pmatrix}3&-4\\4&3\end{pmatrix}$ is orthogonal. Find $Q^{-1}$ without row reduction.'
            answer: '$Q^{-1} = Q^T = \frac{1}{5}\begin{pmatrix}3&4\\-4&3\end{pmatrix}$'
            answer_contract: {kind: none}
            solution_sketch: 'For orthogonal matrices $Q^TQ = I$, so the inverse is simply the transpose.'
          - problem: 'Solve $Q\mathbf{x} = \mathbf{b}$ for $Q = \frac{1}{5}\begin{pmatrix}3&-4\\4&3\end{pmatrix}$ and $\mathbf{b} = (3, 4)$, using the transpose.'
            answer: "x = Q^T b = (5, 0)"
            answer_contract: {kind: none}
            solution_sketch: '$\mathbf{x} = Q^T\mathbf{b} = \frac{1}{5}(9 + 16, -12 + 12) = (5, 0)$. Check: $Q(5, 0) = (3, 4)$.'
        constraints: "orthogonal Q with 3-4-5 or 90-degree-rotation columns; right-hand sides chosen so Q^T b has integer entries"
      - id: kp3
        name: Orthogonal matrices preserve geometry
        key_prerequisites: [orthogonal-orthonormal-sets, linear-transformations]
        exemplars:
          - problem: '$Q$ is orthogonal. How does $\|Q\mathbf{x}\|$ compare to $\|\mathbf{x}\|$?'
            answer: "They are equal: orthogonal matrices preserve norms"
            answer_contract: {kind: none}
            solution_sketch: '$\|Q\mathbf{x}\|^2 = (Q\mathbf{x}) \cdot (Q\mathbf{x}) = \mathbf{x}^TQ^TQ\mathbf{x} = \mathbf{x} \cdot \mathbf{x}$.'
          - problem: 'Verify that $Q = \begin{pmatrix}0&-1\\1&0\end{pmatrix}$ preserves dot products for $\mathbf{x} = (1, 2)$ and $\mathbf{y} = (3, 1)$.'
            answer: "Qx = (-2, 1), Qy = (-1, 3); both dot products equal 5"
            answer_contract: {kind: none}
            solution_sketch: '$\mathbf{x} \cdot \mathbf{y} = 3 + 2 = 5$ and $Q\mathbf{x} \cdot Q\mathbf{y} = 2 + 3 = 5$.'
          - problem: 'What values can $\det Q$ take when $Q$ is orthogonal?'
            answer: "Only 1 or -1"
            answer_contract: {kind: none}
            solution_sketch: '$Q^TQ = I$ gives $(\det Q)^2 = 1$; rotations have $\det = 1$, reflections $\det = -1$.'
        constraints: "verifications on 2x2 rotations/reflections with integer test vectors in -3..3"
    diagnostic_exemplar:
      problem: 'For $Q = \frac{1}{\sqrt{2}}\begin{pmatrix}1&-1\\1&1\end{pmatrix}$, verify that $Q$ is orthogonal, give $Q^{-1}$, and compute $\|Q\mathbf{x}\|$ for $\mathbf{x} = (3, 4)$.'
      answer: '$Q$ is orthogonal (its columns are orthonormal, so $Q^TQ = I$); $Q^{-1} = Q^T = \frac{1}{\sqrt{2}}\begin{pmatrix}1&1\\-1&1\end{pmatrix}$; $\|Q\mathbf{x}\| = \|\mathbf{x}\| = 5$'
      answer_contract: {kind: none}
      solution_sketch: 'Each column has norm $1$ and their dot product is $(1)(-1) + (1)(1) = 0$ before scaling; orthogonal matrices preserve norms, so $\|Q\mathbf{x}\| = \|(3,4)\| = 5$.'
    anki_seeds:
      - front: 'A square matrix $Q$ is orthogonal when $Q^TQ = $ ?'
        back: '$I$ — equivalently, its columns form an orthonormal set.'
        type: basic
      - front: 'The inverse of an orthogonal matrix is...'
        back: 'its transpose: $Q^{-1} = Q^T$.'
        type: basic
      - front: 'Orthogonal matrices preserve which two geometric quantities?'
        back: 'Norms and dot products (hence lengths and angles); $\det Q = \pm 1$.'
        type: basic

  - id: spectral-theorem-symmetric-matrices
    name: The Spectral Theorem for Symmetric Matrices
    core: false                # terminal theorem topic on the supplemental spectral branch; no higher-ordered course builds on it (R-2: kept supplemental rather than flipping the W8 orthogonality flags)
    difficulty: 0.8
    drill: false
    answer_kind: numeric
    expected_time_secs: 300
    prerequisites:
      # L1 flagged this edge as superfluous (constraints rig eigenvectors so
      # Gram-Schmidt never runs), but dropping it removed orthogonality-gram-schmidt
      # from the closure ENTIRELY — orthonormalising an eigenbasis is the theorem's
      # own construction, so the edge is kept deliberately.
      - id: orthogonality-gram-schmidt
        weight: 0.3
        key: false
      - id: orthogonal-matrices
        weight: 0.7
        key: true
      - id: diagonalization
        weight: 0.7
        key: true
      - id: eigenvalues-eigenvectors
        weight: 0.5
    knowledge_points:
      - id: kp1
        name: What the spectral theorem says
        key_prerequisites: [eigenvalues-eigenvectors, orthogonal-matrices]
        exemplars:
          - problem: 'State what the spectral theorem guarantees about the eigenvalues and eigenvectors of a real symmetric matrix.'
            answer: "All eigenvalues are real, eigenvectors from different eigenvalues are orthogonal, and the matrix is orthogonally diagonalizable: A = QDQ^T"
            answer_contract: {kind: none}
            solution_sketch: 'Symmetric matrices are exactly the matrices admitting an orthonormal basis of eigenvectors.'
          - problem: 'Find the eigenvalues of $A = \begin{pmatrix}2&1\\1&2\end{pmatrix}$ and verify that its eigenvectors are orthogonal.'
            answer: "Eigenvalues 1 and 3, with eigenvectors (1, -1) and (1, 1); (1, -1) . (1, 1) = 0"
            answer_contract: {kind: none}
            solution_sketch: '$\det(A - \lambda I) = (2 - \lambda)^2 - 1 = 0$ gives $\lambda = 1, 3$; solve $(A - \lambda I)\mathbf{v} = \mathbf{0}$ for each and take the dot product.'
          - problem: 'Which matrices are orthogonally diagonalizable?'
            answer: "Exactly the symmetric matrices"
            answer_contract: {kind: none}
            solution_sketch: 'If $A = QDQ^T$ then $A^T = QD^TQ^T = A$; the spectral theorem gives the converse.'
        constraints: "2x2 symmetric matrices with integer eigenvalues; orthogonality verified by an explicit dot product"
      - id: kp2
        name: Orthogonal diagonalization of a 2x2 symmetric matrix
        key_prerequisites: [diagonalization, orthogonal-matrices]
        exemplars:
          - problem: "Orthogonally diagonalize A = [[4,3],[3,4]]. Let Q have unit eigenvectors as columns, the first column for the smaller eigenvalue with positive top-left entry, and let D have the smaller eigenvalue first. Give the six entries as a, b, c, d, e, f, where Q = [[a,b],[c,d]] and D = [[e,0],[0,f]]."
            answer: "a = sqrt(2)/2; b = sqrt(2)/2; c = -sqrt(2)/2; d = sqrt(2)/2; e = 1; f = 7"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "a"}, {"contract": {"kind": "exact"}, "name": "b"}, {"contract": {"kind": "exact"}, "name": "c"}, {"contract": {"kind": "exact"}, "name": "d"}, {"contract": {"kind": "exact"}, "name": "e"}, {"contract": {"kind": "exact"}, "name": "f"}]}
            solution_sketch: "The matrix A = [[4,3],[3,4]] is symmetric, so the spectral theorem gives an orthogonal diagonalization. The eigenvalues are a-b = 1 and a+b = 7, so D = [[1,0],[0,7]]. The eigenvectors are (1,-1) for 1 and (1,1) for 7; normalizing by sqrt(2) gives Q = [[sqrt(2)/2, sqrt(2)/2],[-sqrt(2)/2, sqrt(2)/2]]. The answer is a = sqrt(2)/2; b = sqrt(2)/2; c = -sqrt(2)/2; d = sqrt(2)/2; e = 1; f = 7."
          - problem: "Orthogonally diagonalize A = [[6,2],[2,6]]. Let Q have unit eigenvectors as columns, the first column for the smaller eigenvalue with positive top-left entry, and let D have the smaller eigenvalue first. Give the six entries as a, b, c, d, e, f, where Q = [[a,b],[c,d]] and D = [[e,0],[0,f]]."
            answer: "a = sqrt(2)/2; b = sqrt(2)/2; c = -sqrt(2)/2; d = sqrt(2)/2; e = 4; f = 8"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "a"}, {"contract": {"kind": "exact"}, "name": "b"}, {"contract": {"kind": "exact"}, "name": "c"}, {"contract": {"kind": "exact"}, "name": "d"}, {"contract": {"kind": "exact"}, "name": "e"}, {"contract": {"kind": "exact"}, "name": "f"}]}
            solution_sketch: "The matrix A = [[6,2],[2,6]] is symmetric, so the spectral theorem gives an orthogonal diagonalization. The eigenvalues are a-b = 4 and a+b = 8, so D = [[4,0],[0,8]]. The eigenvectors are (1,-1) for 4 and (1,1) for 8; normalizing by sqrt(2) gives Q = [[sqrt(2)/2, sqrt(2)/2],[-sqrt(2)/2, sqrt(2)/2]]. The answer is a = sqrt(2)/2; b = sqrt(2)/2; c = -sqrt(2)/2; d = sqrt(2)/2; e = 4; f = 8."
          - problem: "Orthogonally diagonalize A = [[7,2],[2,7]]. Give the diagonal matrix D in A = Q D Q^T with the smaller eigenvalue first, as [a,b;c,d]."
            answer: "[5,0;0,9]"
            answer_contract: {"cols": 2, "kind": "matrix", "rows": 2}
            solution_sketch: "The symmetric matrix A = [[7,2],[2,7]] has eigenvalues 7-2=5 and 7+2=9. The spectral theorem gives an orthogonal diagonalization with D containing the eigenvalues on its diagonal. Ordering the smaller eigenvalue first gives D = [[5,0],[0,9]]. The answer is [5,0;0,9]."
          - problem: "Orthogonally diagonalize A = [[8,5],[5,8]]. Give the two eigenvalues of A in increasing order as a list."
            answer: "3, 13"
            answer_contract: {"kind": "list", "member": {"kind": "exact"}, "ordered": true}
            solution_sketch: "The matrix A = [[8,5],[5,8]] is symmetric. For a matrix [[a,b],[b,a]], the eigenvalues are a-b and a+b, so here they are 8-5=3 and 8+5=13. These eigenvalues form the diagonal of D in the orthogonal diagonalization. The answer is 3, 13."
          - problem: "Orthogonally diagonalize A = [[9,4],[4,9]]. Give the four entries of the orthogonal matrix Q whose first column is the unit eigenvector for the smaller eigenvalue, with positive first entry, as q11, q12, q21, q22, where Q = [[q11,q12],[q21,q22]]."
            answer: "q11 = sqrt(2)/2; q12 = sqrt(2)/2; q21 = -sqrt(2)/2; q22 = sqrt(2)/2"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "q11"}, {"contract": {"kind": "exact"}, "name": "q12"}, {"contract": {"kind": "exact"}, "name": "q21"}, {"contract": {"kind": "exact"}, "name": "q22"}]}
            solution_sketch: "The symmetric matrix A = [[9,4],[4,9]] has eigenvalues 9-4=5 and 9+4=13. The unit eigenvector for the smaller eigenvalue 5 is (1,-1)/sqrt(2) = (sqrt(2)/2, -sqrt(2)/2), and for 13 it is (1,1)/sqrt(2) = (sqrt(2)/2, sqrt(2)/2). Thus Q = [[sqrt(2)/2, sqrt(2)/2],[-sqrt(2)/2, sqrt(2)/2]]. The answer is q11 = sqrt(2)/2; q12 = sqrt(2)/2; q21 = -sqrt(2)/2; q22 = sqrt(2)/2."
          - problem: "For the symmetric matrix A = [[10,3],[3,10]], find the larger eigenvalue and its unit eigenvector with positive first entry. Give the eigenvalue and the vector as (x, y), using lam for the eigenvalue and v for the vector."
            answer: "lam = 13; v = (sqrt(2)/2, sqrt(2)/2)"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "lam"}, {"contract": {"arity": 2, "kind": "coordinates"}, "name": "v"}]}
            solution_sketch: "The symmetric matrix A = [[10,3],[3,10]] has eigenvalues 10-3=7 and 10+3=13. The larger eigenvalue is 13, and its eigenvector is (1,1). Normalizing gives (1,1)/sqrt(2) = (sqrt(2)/2, sqrt(2)/2). The answer is lam = 13; v = (sqrt(2)/2, sqrt(2)/2)."
        constraints: "2x2 symmetric matrices of the form [[a, b], [b, a]] so eigenvectors are (1, 1) and (1, -1); eigenvalues integers"
      - id: kp3
        name: Using the factorization A = QDQ^T
        key_prerequisites: [diagonalization, orthogonal-matrices]
        exemplars:
          - problem: '$A = QDQ^T$ with $D = \begin{pmatrix}1&0\\0&9\end{pmatrix}$. Find $\det A$ and the eigenvalues of $A^2$.'
            answer: "det A = 9; eigenvalues of A^2 are 1 and 81"
            answer_contract: {kind: none}
            solution_sketch: '$\det A = \det D$ since $\det Q \det Q^T = 1$; $A^2 = QD^2Q^T$ squares the eigenvalues.'
          - problem: 'Express $A^3$ in terms of $Q$ and $D$ when $A = QDQ^T$ with $D = \begin{pmatrix}1&0\\0&2\end{pmatrix}$.'
            answer: 'A^3 = Q D^3 Q^T with D^3 = diag(1, 8)'
            answer_contract: {kind: none}
            solution_sketch: '$A^3 = QDQ^TQDQ^TQDQ^T = QD^3Q^T$: the inner $Q^TQ$ factors cancel to $I$.'
        constraints: "D diagonal with small integer entries; answers obtained without multiplying out Q"
    diagnostic_exemplar:
      problem: 'Orthogonally diagonalize $A = \begin{pmatrix}3&1\\1&3\end{pmatrix}$ as $A = QDQ^T$, then use the factorization to give $\det A$ and the eigenvalues of $A^2$.'
      answer: '$Q = \frac{1}{\sqrt{2}}\begin{pmatrix}1&1\\-1&1\end{pmatrix}$, $D = \begin{pmatrix}2&0\\0&4\end{pmatrix}$; $\det A = 8$; $A^2$ has eigenvalues $4$ and $16$'
      answer_contract: {kind: none}
      solution_sketch: 'The eigenpairs are $2$ with $(1, -1)$ and $4$ with $(1, 1)$; normalizing gives the columns of $Q$, and $\det A = \det D = 8$ while $A^2 = QD^2Q^T$.'
    anki_seeds:
      - front: 'Spectral theorem: every real symmetric matrix can be written as...'
        back: '$A = QDQ^T$ with $Q$ orthogonal and $D$ diagonal (real eigenvalues on the diagonal).'
        type: basic
      - front: 'For a symmetric matrix, eigenvectors belonging to different eigenvalues are...'
        back: 'orthogonal.'
        type: basic
      - front: 'The matrices that are orthogonally diagonalizable are exactly...'
        back: 'the symmetric matrices.'
        type: basic

  - id: quadratic-forms
    name: Quadratic Forms and Principal Axes
    core: false                # terminal application of the spectral theorem; requirements list quadratic forms beyond this application as cut-first, so it stays one supplemental capstone
    difficulty: 0.8
    drill: false
    answer_kind: numeric
    expected_time_secs: 300
    prerequisites:
      - id: spectral-theorem-symmetric-matrices
        weight: 0.7
        key: true
      - id: transpose-symmetric-matrices
        weight: 0.4
      - id: classifying-conics-completing-square
        weight: 0
    knowledge_points:
      - id: kp1
        name: The matrix of a quadratic form
        key_prerequisites: [transpose-symmetric-matrices]
        exemplars:
          - problem: 'Evaluate the quadratic form of $A = \begin{pmatrix}1&2\\2&3\end{pmatrix}$ at $\mathbf{x} = (1, 1)$.'
            answer: "8"
            solution_sketch: '$q(1, 1) = 1 + 2(2) + 3 = 8$ (the form is $x^2 + 4xy + 3y^2$).'
          - problem: "Let q(x, y) = 4x^2 + 10xy + 7y^2. Find the symmetric matrix A with q(x, y) = x^T A x. Give A as [a,b;c,d]."
            answer: "[4,5;5,7]"
            answer_contract: {"cols": 2, "kind": "matrix", "rows": 2}
            solution_sketch: "Step 1: The full object is q(x, y) = 4x^2 + 10xy + 7y^2 and its symmetric matrix A. Step 2: The diagonal entries equal the x^2 and y^2 coefficients, so A_11 = 4 and A_22 = 7. Step 3: The xy coefficient is 2A_12, so A_12 = 10/2 = 5 and symmetry gives A_21 = 5. The symmetric matrix is [4,5;5,7]."
          - problem: "For the symmetric matrix A = [5,2;2,-1], find the quadratic form q(x, y) = x^T A x. Give it as an expression in x and y."
            answer: "5x^2+4xy-y^2"
            answer_contract: {"kind": "function", "vars": ["x", "y"]}
            solution_sketch: "Step 1: The full object is A = [5,2;2,-1] and its quadratic form q(x, y) = x^T A x. Step 2: For a symmetric 2 by 2 matrix, q(x, y) = A_11 x^2 + 2A_12 xy + A_22 y^2. Step 3: Substitute A_11 = 5, A_12 = 2, and A_22 = -1 to get q(x, y) = 5x^2 + 4xy - y^2. The quadratic form is 5x^2+4xy-y^2."
          - problem: "Let q(x, y) = x^2 + 12xy + 3y^2. Find the (1,2)-entry of the symmetric matrix A with q(x, y) = x^T A x."
            answer: "6"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: The full object is q(x, y) = x^2 + 12xy + 3y^2 and its symmetric matrix A. Step 2: The xy coefficient is 2A_12, so A_12 = 12/2 = 6. That places 6 in the (1,2) position. The (1,2)-entry is 6."
          - problem: "Let q(x, y) = 3x^2 - 4xy + 2y^2. Determine the symmetric matrix A such that q(x, y) = x^T A x. Give A as [a,b;c,d]."
            answer: "[3,-2;-2,2]"
            answer_contract: {"cols": 2, "kind": "matrix", "rows": 2}
            solution_sketch: "Step 1: The full object is q(x, y) = 3x^2 - 4xy + 2y^2 and its symmetric matrix A. Step 2: The diagonal entries are the coefficients of x^2 and y^2, so A_11 = 3 and A_22 = 2. Step 3: The xy coefficient is 2A_12, so A_12 = -4/2 = -2 and A_21 = -2. The symmetric matrix is [3,-2;-2,2]."
          - problem: "Let A = [0,5;5,0]. Find the coefficient of xy in the quadratic form q(x, y) = x^T A x."
            answer: "10"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: The full object is A = [0,5;5,0] and q(x, y) = x^T A x. Step 2: The xy coefficient is 2A_12. Step 3: With A_12 = 5, the coefficient is 2(5) = 10. The coefficient of xy is 10."
        constraints: "2 variables; integer coefficients with the xy coefficient even so A has integer entries"
      - id: kp2
        name: Classifying definiteness by eigenvalues
        key_prerequisites: [spectral-theorem-symmetric-matrices]
        exemplars:
          - problem: '$A = \begin{pmatrix}2&1\\1&2\end{pmatrix}$ has eigenvalues $1$ and $3$. Classify its quadratic form.'
            answer: "Positive definite: both eigenvalues are positive, so q(x) > 0 for all nonzero x"
            answer_contract: {kind: none}
            solution_sketch: 'In principal-axis coordinates $q = 1u^2 + 3v^2$, a sum of positive multiples of squares.'
          - problem: '$A = \begin{pmatrix}1&2\\2&1\end{pmatrix}$ has eigenvalues $3$ and $-1$. Classify its quadratic form.'
            answer: "Indefinite: eigenvalues of both signs, so q takes both positive and negative values"
            answer_contract: {kind: none}
            solution_sketch: 'Along the $\lambda = 3$ eigenvector $q > 0$; along the $\lambda = -1$ eigenvector $q < 0$.'
          - problem: 'Classify the quadratic form of $A = \begin{pmatrix}-1&0\\0&-4\end{pmatrix}$.'
            answer: "Negative definite"
            answer_contract: {kind: none}
            solution_sketch: 'Both eigenvalues $-1, -4$ are negative: $q(x, y) = -x^2 - 4y^2 < 0$ for nonzero inputs.'
        constraints: "2x2 symmetric matrices with integer eigenvalues given or easily computed; classes limited to positive definite, negative definite, indefinite"
      - id: kp3
        name: Principal axes remove the cross term
        key_prerequisites: [spectral-theorem-symmetric-matrices]
        exemplars:
          - problem: 'Use the eigenvalues of $A = \begin{pmatrix}2&1\\1&2\end{pmatrix}$ to write $q(x, y) = 2x^2 + 2xy + 2y^2$ without a cross term.'
            answer: "q = u^2 + 3v^2 in coordinates u, v along the unit eigenvectors of A"
            answer_contract: {kind: none}
            solution_sketch: 'Substituting $\mathbf{x} = Q\mathbf{u}$ with $A = QDQ^T$ gives $q = \mathbf{u}^TD\mathbf{u} = \lambda_1 u^2 + \lambda_2 v^2$ with $\lambda = 1, 3$.'
          - problem: 'What kind of curve is $x^2 + xy + y^2 = 1$?'
            answer: "An ellipse"
            answer_contract: {kind: none}
            solution_sketch: 'The form has matrix $\begin{pmatrix}1&1/2\\1/2&1\end{pmatrix}$ with eigenvalues $\frac{1}{2}$ and $\frac{3}{2}$, both positive: in principal axes the equation is $\frac{1}{2}u^2 + \frac{3}{2}v^2 = 1$.'
        constraints: "2x2 forms whose eigenvalues are integers or halves; conclusions stated in principal-axis coordinates, no explicit angle computations"
    diagnostic_exemplar:
      problem: 'Write $q(x, y) = x^2 + 4xy + y^2$ as $\mathbf{x}^TA\mathbf{x}$ with $A$ symmetric, classify its definiteness, and give its cross-term-free form in principal-axis coordinates.'
      answer: '$A = \begin{pmatrix}1&2\\2&1\end{pmatrix}$; eigenvalues $3$ and $-1$, so $q$ is indefinite; in principal-axis coordinates $q = 3u^2 - v^2$'
      answer_contract: {kind: none}
      solution_sketch: 'Split the $4xy$ evenly off the diagonal; the eigenvalues of $A$ are $1 \pm 2$, and the principal-axis form has those eigenvalues as coefficients.'
    anki_seeds:
      - front: 'In the symmetric matrix of a quadratic form, the coefficient of $xy$ is...'
        back: 'split in half across the two off-diagonal entries.'
        type: basic
      - front: 'A quadratic form is positive definite iff the eigenvalues of its matrix are...'
        back: 'all positive (negative definite: all negative; indefinite: both signs).'
        type: basic
      - front: 'The principal-axes theorem: substituting $\mathbf{x} = Q\mathbf{u}$ turns $\mathbf{x}^TA\mathbf{x}$ into...'
        back: '$\lambda_1 u_1^2 + \cdots + \lambda_n u_n^2$ — the cross terms disappear along the eigenvector axes.'
        type: basic

  - id: singular-value-decomposition
    name: The Singular Value Decomposition
    core: false                # re-audit R-40: terminal capstone of the supplemental spectral branch; nothing in the tree builds on it
    difficulty: 0.85
    drill: false
    answer_kind: numeric
    expected_time_secs: 300
    prerequisites:
      - id: spectral-theorem-symmetric-matrices
        weight: 0.7
        key: true
      - id: transpose-symmetric-matrices
        weight: 0.5
        key: true
      - id: null-column-space-rank
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: Singular values from A^T A
        key_prerequisites: [transpose-symmetric-matrices, spectral-theorem-symmetric-matrices]
        exemplars:
          - problem: 'Find the singular values of $A = \begin{pmatrix}0&2\\1&0\end{pmatrix}$.'
            answer: "sigma_1 = 2, sigma_2 = 1"
            answer_contract: {kind: none}
            solution_sketch: '$A^TA = \begin{pmatrix}1&0\\0&4\end{pmatrix}$ has eigenvalues $4$ and $1$ (it is symmetric, so they are real and nonnegative here); the singular values are their square roots, listed in decreasing order.'
          - problem: 'Find the singular values of $A = \begin{pmatrix}1&1\\1&1\end{pmatrix}$.'
            answer: "sigma_1 = 2, sigma_2 = 0"
            answer_contract: {kind: none}
            solution_sketch: '$A^TA = \begin{pmatrix}2&2\\2&2\end{pmatrix}$ has eigenvalues $4$ and $0$: $\sigma_1 = 2$, $\sigma_2 = 0$. A zero singular value signals a rank-deficient matrix.'
          - problem: 'Find the singular values of the $3 \times 2$ matrix $A = \begin{pmatrix}1&0\\1&1\\0&1\end{pmatrix}$.'
            answer: '$\sigma_1 = \sqrt{3}$, $\sigma_2 = 1$'
            answer_contract: {kind: none}
            solution_sketch: '$A^TA = \begin{pmatrix}2&1\\1&2\end{pmatrix}$ has eigenvalues $3$ and $1$; singular values are defined for any rectangular matrix via the square $A^TA$.'
        constraints: "A is 2x2 or 3x2 rigged so A^T A is diagonal or of the form [[a,b],[b,a]] with integer eigenvalues; singular values are integers or single square roots"
      - id: kp2
        name: Assembling A = U Sigma V^T
        key_prerequisites: [spectral-theorem-symmetric-matrices]
        exemplars:
          - problem: 'Compute an SVD $A = U\Sigma V^T$ of $A = \begin{pmatrix}0&2\\1&0\end{pmatrix}$.'
            answer: '$U = \begin{pmatrix}1&0\\0&1\end{pmatrix}$, $\Sigma = \begin{pmatrix}2&0\\0&1\end{pmatrix}$, $V = \begin{pmatrix}0&1\\1&0\end{pmatrix}$'
            answer_contract: {kind: none}
            solution_sketch: '$A^TA = \mathrm{diag}(1, 4)$: eigenpairs $\lambda_1 = 4$, $\mathbf{v}_1 = (0, 1)$ and $\lambda_2 = 1$, $\mathbf{v}_2 = (1, 0)$, so $\sigma_1 = 2$, $\sigma_2 = 1$. Then $\mathbf{u}_i = A\mathbf{v}_i/\sigma_i$: $\mathbf{u}_1 = (1, 0)$, $\mathbf{u}_2 = (0, 1)$. Check: $U\Sigma V^T = A$.'
          - problem: 'Compute an SVD of $A = \begin{pmatrix}1&1\\-1&1\end{pmatrix}$.'
            answer: '$U = \frac{1}{\sqrt{2}}\begin{pmatrix}1&1\\-1&1\end{pmatrix}$, $\Sigma = \begin{pmatrix}\sqrt{2}&0\\0&\sqrt{2}\end{pmatrix}$, $V = \begin{pmatrix}1&0\\0&1\end{pmatrix}$'
            answer_contract: {kind: none}
            solution_sketch: '$A^TA = 2I$, so both singular values are $\sqrt{2}$ and $V = I$ works; $\mathbf{u}_i = A\mathbf{v}_i/\sqrt{2}$ gives the columns of $U$. Check: $U\Sigma V^T = \frac{\sqrt{2}}{\sqrt{2}}A = A$.'
        constraints: "2x2 matrices rigged so A^T A is diagonal or 2I; eigenvector normalizations limited to 1/sqrt(2); always verify U Sigma V^T = A"
      - id: kp3
        name: Reading rank and best rank-1 approximation off the SVD
        key_prerequisites: [null-column-space-rank, spectral-theorem-symmetric-matrices]
        exemplars:
          - problem: 'A $3 \times 3$ matrix has singular values $3, 1, 0$. What is its rank?'
            answer: "2"
            solution_sketch: 'The rank equals the number of nonzero singular values.'
          - problem: "A 2 x 2 matrix has first singular triple sigma1 = 2, u1 = (1, -1)/sqrt(2), v1 = (1, 1)/sqrt(2). Find its best rank-1 approximation sigma1 u1 v1^T. Give the matrix as [a,b;c,d]."
            answer: "[1,1;-1,-1]"
            answer_contract: {"cols": 2, "kind": "matrix", "rows": 2}
            solution_sketch: "Step 1, outer product rule: u1 v1^T = [[1/2, 1/2],[-1/2, -1/2]]. Step 2, multiply by sigma1 = 2 to get A1 = [[1, 1],[-1, -1]]. So the best rank-1 approximation is [1,1;-1,-1]."
          - problem: "A 2 x 2 matrix has sigma1 = 2 and sigma2 = 0, with u1 = (1, 1)/sqrt(2) and v1 = (1, 1)/sqrt(2). Compute its best rank-1 approximation sigma1 u1 v1^T. Give the matrix as [a,b;c,d]."
            answer: "[1,1;1,1]"
            answer_contract: {"cols": 2, "kind": "matrix", "rows": 2}
            solution_sketch: "Step 1, outer product rule: u1 v1^T = [[1/2, 1/2],[1/2, 1/2]]. Step 2, multiply by sigma1 = 2 to get A1 = [[1, 1],[1, 1]]. Because sigma2 = 0 this approximation is exact, so the best rank-1 approximation is [1,1;1,1]."
          - problem: "A 4 x 4 matrix has singular values 5, 3, 0, 0 in decreasing order. Determine the rank of the matrix."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1, rank rule: the rank equals the number of singular values that are not zero. Step 2, inspect the list 5, 3, 0, 0 and count the nonzero values 5 and 3. So the rank is 2."
          - problem: "A 5 x 5 data matrix has singular values 6, 5, 2, 0, 0. The number of nonzero singular values equals the rank. Compute the rank of the matrix."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1, rank rule: for an SVD the rank is the number of nonzero singular values. Step 2, count the nonzero values in 6, 5, 2, 0, 0, which are 6, 5 and 2. So the rank is 3."
          - problem: "A 2 x 2 matrix has sigma1 = 3 with u1 = (0, 1) and v1 = (1, 0). Find its best rank-1 approximation sigma1 u1 v1^T. Give the matrix as [a,b;c,d]."
            answer: "[0,0;3,0]"
            answer_contract: {"cols": 2, "kind": "matrix", "rows": 2}
            solution_sketch: "Step 1, outer product rule: u1 v1^T = [[0, 0],[1, 0]]. Step 2, multiply by sigma1 = 3 to get the best rank-1 approximation [[0, 0],[3, 0]]. So the best rank-1 approximation is [0,0;3,0]."
        constraints: "SVD data given or carried over from kp2-scale computations; rank read off the sigma list; rank-1 term computed as an explicit outer product with entries in -3..3"
    diagnostic_exemplar:
      problem: 'For $A = \begin{pmatrix}0&4\\2&0\end{pmatrix}$, find the singular values, an SVD $A = U\Sigma V^T$, and the rank of $A$.'
      answer: '$\sigma_1 = 4$, $\sigma_2 = 2$; $U = I_2$, $\Sigma = \begin{pmatrix}4&0\\0&2\end{pmatrix}$, $V^T = \begin{pmatrix}0&1\\1&0\end{pmatrix}$; rank $2$'
      answer_contract: {kind: none}
      solution_sketch: '$A^TA = \mathrm{diag}(4, 16)$, so the singular values are $4$ and $2$ with $\mathbf{v}_1 = (0,1)$, $\mathbf{v}_2 = (1,0)$; then $\mathbf{u}_i = A\mathbf{v}_i/\sigma_i$ gives $U = I$, and both singular values are nonzero.'
