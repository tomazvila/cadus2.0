unit: determinants-eigen
course: linear-algebra
module: "Determinants & Eigentheory"
topics:
  - id: determinants-2x2
    name: 2x2 Determinants
    core: true
    difficulty: 0.5
    drill: false
    answer_kind: numeric
    expected_time_secs: 90
    prerequisites:
      - id: matrix-operations
        weight: 0.7
        key: true
    knowledge_points:
      - id: kp1
        name: The ad - bc formula
        key_prerequisites: [matrix-operations]
        exemplars:
          - problem: 'Compute $\det\begin{pmatrix}5&3\\2&4\end{pmatrix}$.'
            answer: '14'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Multiply the main diagonal, then subtract the product of the other diagonal. This gives $5\cdot4-3\cdot2=20-6=14$.'
          - problem: 'Compute $\det\begin{pmatrix}-2&5\\3&1\end{pmatrix}$.'
            answer: '-17'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Take $a=-2$, $b=5$, $c=3$ and $d=1$. Then $ad-bc=(-2)(1)-(5)(3)=-2-15=-17$.'
          - problem: 'Compute $\det\begin{pmatrix}4&-5\\3&2\end{pmatrix}$.'
            answer: '23'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Take $a=4$, $b=-5$, $c=3$ and $d=2$. Then $ad-bc=4\cdot2-(-5)\cdot3=8+15=23$.'
          - problem: 'Sam computes $\det\begin{pmatrix}-3&6\\5&-2\end{pmatrix}$ as $(-3)(-2)+(6)(5)=36$. What is the correct value of the determinant?'
            answer: '-24'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Sam added the two products, but the formula subtracts them. The correct value is $ad-bc=(-3)(-2)-(6)(5)=6-30=-24$.'
          - problem: 'A garden bed is shaped like a parallelogram. Two of its sides are given by the vectors $(5,2)$ and $(3,-4)$, with lengths in metres. Find the area of the bed.'
            answer: '26'
            answer_contract: {"kind": "unit", "quantity": "area", "unit": "m^2", "allow_omitted": true}
            solution_sketch: 'The area is the absolute value of the determinant of the matrix whose columns are the two side vectors. Here $\det\begin{pmatrix}5&3\\2&-4\end{pmatrix}=5(-4)-3(2)=-26$, so the area is $26$ square metres.'
          - problem: 'A triangular plot has corners at $(0,0)$, $(4,1)$ and $(2,5)$, with lengths in metres. Find its area.'
            answer: '9'
            answer_contract: {"kind": "unit", "quantity": "area", "unit": "m^2", "allow_omitted": true}
            solution_sketch: 'The two edges from the origin are the vectors $(4,1)$ and $(2,5)$. The parallelogram they span has area $|4\cdot5-2\cdot1|=18$, and the triangle is half of it, so its area is $9$ square metres.'
          - problem: 'The linear map with matrix $\begin{pmatrix}2&1\\1&3\end{pmatrix}$ multiplies every area by the absolute value of the determinant. After the map is applied, a region has area $35$ square centimetres. What was its area before?'
            answer: '7'
            answer_contract: {"kind": "unit", "quantity": "area", "unit": "cm^2", "allow_omitted": true}
            solution_sketch: 'The determinant is $2\cdot3-1\cdot1=5$, so the map multiplies every area by $5$. The image area is $5$ times the original area, so the original area is $35\div5=7$ square centimetres.'
          - problem: 'Compute $\det\begin{pmatrix}\frac12&3\\4&8\end{pmatrix}$.'
            answer: '-8'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Take $a=\frac12$, $b=3$, $c=4$ and $d=8$. Then $ad-bc=\frac12\cdot8-3\cdot4=4-12=-8$.'
        constraints: 'integer entries in -9..9, some negative; areas as parallelogram, triangle and image-area contexts; one error-analysis item'
      - id: kp2
        name: Zero determinants and invertibility
        key_prerequisites: [matrix-operations]
        try_first:
          problem: 'Is the matrix $\begin{pmatrix}4&6\\2&3\end{pmatrix}$ invertible?'
          answer_contract: {"kind": "label", "options": [["yes", "it is invertible", "invertible", "it has an inverse"], ["no", "it is not invertible", "not invertible", "singular", "it has no inverse"]]}
          answer: 'no'
          reveal: 'Its determinant is $4\cdot3-6\cdot2=0$: row 1 is twice row 2, so the rows are proportional. A zero determinant is the test for a matrix that has no inverse.'
        exemplars:
          - problem: 'Is the matrix $\begin{pmatrix}3&1\\5&2\end{pmatrix}$ invertible?'
            answer: 'yes'
            answer_contract: {"kind": "label", "options": [["yes", "it is invertible", "invertible", "it has an inverse"], ["no", "it is not invertible", "not invertible", "singular", "it has no inverse"]]}
            solution_sketch: 'A $2\times2$ matrix is invertible exactly when its determinant is not zero. Here $\det=3\cdot2-1\cdot5=6-5=1$, which is not zero, so the matrix is invertible.'
          - problem: 'Compute $\det\begin{pmatrix}2&6\\1&3\end{pmatrix}$.'
            answer: '0'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Here $ad-bc=2\cdot3-6\cdot1=6-6=0$. Row 1 is twice row 2, so the rows are proportional and the determinant is $0$.'
          - problem: 'Compute $\det\begin{pmatrix}1&4\\2&3\end{pmatrix}$.'
            answer: '-5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Here $ad-bc=1\cdot3-4\cdot2=3-8=-5$. The determinant is not zero, so the matrix is invertible.'
          - problem: 'Does the matrix $\begin{pmatrix}2&4\\3&6\end{pmatrix}$ have an inverse?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "it is invertible", "invertible", "it has an inverse"], ["no", "it is not invertible", "not invertible", "singular", "it has no inverse"]]}
            solution_sketch: 'Compute $\det=2\cdot6-4\cdot3=12-12=0$. A zero determinant means the matrix is singular, so it has no inverse.'
          - problem: 'The linear map with matrix $\begin{pmatrix}2&-1\\3&4\end{pmatrix}$ multiplies every area by the absolute value of its determinant. What is the area of the image of a region of area $3$ square centimetres?'
            answer: '33'
            answer_contract: {"kind": "unit", "quantity": "area", "unit": "cm^2", "allow_omitted": true}
            solution_sketch: 'The determinant is $2\cdot4-(-1)\cdot3=8+3=11$, so every area is multiplied by $11$. The image has area $3\cdot11=33$ square centimetres.'
          - problem: 'The linear map with matrix $\begin{pmatrix}6&9\\4&6\end{pmatrix}$ multiplies every area by the absolute value of its determinant. What is the area of the image of a square with side $1$ centimetre?'
            answer: '0'
            answer_contract: {"kind": "unit", "quantity": "area", "unit": "cm^2", "allow_omitted": true}
            solution_sketch: 'The determinant is $6\cdot6-9\cdot4=36-36=0$. Every area is multiplied by $0$, so the image has area $0$: the whole square is flattened onto a line.'
          - problem: 'Compute $\det\begin{pmatrix}7&2\\9&3\end{pmatrix}$.'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Here $ad-bc=7\cdot3-2\cdot9=21-18=3$. The determinant is not zero, so the matrix is invertible.'
          - problem: 'Compute $\det\begin{pmatrix}4&-2\\-6&3\end{pmatrix}$.'
            answer: '0'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Here $ad-bc=4\cdot3-(-2)(-6)=12-12=0$. Row 2 is $-\frac32$ times row 1, so the matrix is singular.'
        constraints: 'singular cases have proportional rows with small ratios; invertibility decided by the determinant; at most two yes/no items with different answers'
      - id: kp3
        name: Solving for an unknown entry
        key_prerequisites: [matrix-operations]
        exemplars:
          - problem: 'Find $x$ so that $\det\begin{pmatrix}x&2\\3&4\end{pmatrix}=6$.'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The determinant is $4x-2\cdot3=4x-6$. Setting $4x-6=6$ gives $4x=12$, so $x=3$.'
          - problem: 'For what value of $k$ does $\begin{pmatrix}2&k\\4&10\end{pmatrix}$ have no inverse?'
            answer: '5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A matrix has no inverse exactly when its determinant is zero. Here $\det=20-4k$, and $20-4k=0$ gives $k=5$.'
          - problem: 'Find $x$ so that $\det\begin{pmatrix}4&x\\6&9\end{pmatrix}=48$.'
            answer: '-2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The determinant is $4\cdot9-6x=36-6x$. Setting $36-6x=48$ gives $-6x=12$, so $x=-2$.'
          - problem: 'Find $x$ so that $\det\begin{pmatrix}3&5\\x&-2\end{pmatrix}=14$.'
            answer: '-4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The determinant is $3(-2)-5x=-6-5x$. Setting $-6-5x=14$ gives $-5x=20$, so $x=-4$.'
          - problem: 'For what value of $k$ are the lines $3x+2y=5$ and $kx+4y=11$ parallel?'
            answer: '6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Two lines are parallel when the coefficient matrix $\begin{pmatrix}3&2\\k&4\end{pmatrix}$ is singular, that is, when its determinant is zero. Here $\det=12-2k$, and $12-2k=0$ gives $k=6$.'
          - problem: 'The linear map with matrix $\begin{pmatrix}x&3\\2&4\end{pmatrix}$ multiplies every area by $10$ and keeps orientation, so its determinant is positive. Find $x$.'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The area factor is the determinant, so $4x-6=10$. Then $4x=16$ and $x=4$.'
          - problem: 'Find $x$ so that $\det\begin{pmatrix}5&-2\\1&x\end{pmatrix}=7$.'
            answer: '1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The determinant is $5x-(-2)(1)=5x+2$. Setting $5x+2=7$ gives $5x=5$, so $x=1$.'
          - problem: 'For which values of $x$ is $\begin{pmatrix}x&4\\1&x\end{pmatrix}$ not invertible?'
            answer: '-2, 2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The matrix is not invertible when its determinant is zero. Here $\det=x^2-4$, and $x^2-4=0$ gives $x=2$ or $x=-2$.'
        constraints: 'the resulting equation has an integer solution in -6..6; one item may give two roots; area-factor and parallel-line contexts'
    diagnostic_exemplar:
      problem: 'Find $k$ so that $\det\begin{pmatrix}6&2\\7&k\end{pmatrix} = 4$.'
      answer: '3'
      solution_sketch: '$6k - 14 = 4$ gives $k = 3$.'
    anki_seeds:
      - front: '$\det\begin{pmatrix}a&b\\c&d\end{pmatrix} = $ ?'
        back: '$ad - bc$.'
        type: basic
      - front: 'A square matrix is invertible iff its determinant is...'
        back: 'nonzero.'
        type: basic

  - id: determinants
    name: Determinants
    core: true
    difficulty: 0.6
    drill: false
    answer_kind: numeric
    expected_time_secs: 150
    prerequisites:
      - id: determinants-2x2
        weight: 0.8
        key: true
      - id: matrix-operations
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: Minors and cofactors
        key_prerequisites: [determinants-2x2]
        exemplars:
          - problem: 'For $A=\begin{pmatrix}1&2&0\\3&1&2\\0&4&1\end{pmatrix}$, find the minor $M_{11}$.'
            answer: '-7'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Delete row 1 and column 1 to leave $\begin{pmatrix}1&2\\4&1\end{pmatrix}$. Then $M_{11}=1\cdot1-2\cdot4=1-8=-7$.'
          - problem: 'For $A=\begin{pmatrix}2&0&1\\1&3&0\\0&1&4\end{pmatrix}$, find the cofactor $C_{12}$.'
            answer: '-4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Delete row 1 and column 2 to leave $\begin{pmatrix}1&0\\0&4\end{pmatrix}$, whose determinant is $4$. The sign is $(-1)^{1+2}=-1$, so $C_{12}=-4$.'
          - problem: 'For $A=\begin{pmatrix}3&-1&2\\0&4&1\\2&0&-3\end{pmatrix}$, find the cofactor $C_{23}$.'
            answer: '-2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Delete row 2 and column 3 to leave $\begin{pmatrix}3&-1\\2&0\end{pmatrix}$, so $M_{23}=3\cdot0-(-1)\cdot2=2$. The sign is $(-1)^{2+3}=-1$, so $C_{23}=-2$.'
          - problem: 'Sam writes $C_{32}=-1$ for the cofactor of $A=\begin{pmatrix}1&4&2\\0&3&-1\\2&5&1\end{pmatrix}$ in row 3 and column 2. What is the correct value of $C_{32}$?'
            answer: '1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Delete row 3 and column 2 to leave $\begin{pmatrix}1&2\\0&-1\end{pmatrix}$, so $M_{32}=-1$. Sam stopped at the minor, but the sign $(-1)^{3+2}=-1$ is still needed, so $C_{32}=1$.'
          - problem: 'Let $A=\begin{pmatrix}2&-3&1\\4&1&-2\\-1&3&0\end{pmatrix}$. Find the cofactor $C_{31}$.'
            answer: '5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Delete row 3 and column 1 to leave $\begin{pmatrix}-3&1\\1&-2\end{pmatrix}$, so $M_{31}=(-3)(-2)-1\cdot1=5$. The sign is $(-1)^{3+1}=+1$, so $C_{31}=5$.'
          - problem: 'Let $A=\begin{pmatrix}1&2&0\\x&3&1\\2&-1&4\end{pmatrix}$. The cofactor $C_{12}$ of $A$ equals $6$. Find $x$.'
            answer: '-1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Delete row 1 and column 2 to leave $\begin{pmatrix}x&1\\2&4\end{pmatrix}$, so $M_{12}=4x-2$. The sign is $(-1)^{1+2}=-1$, so $C_{12}=2-4x$. Setting $2-4x=6$ gives $x=-1$.'
          - problem: 'Let $A=\begin{pmatrix}-2&1&3\\4&0&-1\\1&2&-4\end{pmatrix}$. Find the minor $M_{32}$.'
            answer: '-10'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Delete row 3 and column 2 to leave $\begin{pmatrix}-2&3\\4&-1\end{pmatrix}$. Then $M_{32}=(-2)(-1)-3\cdot4=2-12=-10$. A minor carries no sign, so the answer is $-10$.'
        constraints: '3x3 matrices with entries in -4..4; one minor or cofactor at a time; one error-analysis item; pure notation, so no context items'
      - id: kp2
        name: Triangular matrices and smart expansion
        key_prerequisites: [determinants-2x2]
        exemplars:
          - problem: 'Compute $\det\begin{pmatrix}3&0&0\\5&2&0\\1&4&6\end{pmatrix}$.'
            answer: '36'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Every entry above the diagonal is zero, so the matrix is triangular. Its determinant is the product of the diagonal entries, $3\cdot2\cdot6=36$.'
          - problem: 'Compute $\det\begin{pmatrix}1&5&2\\0&3&0\\2&1&4\end{pmatrix}$ by expanding along the row or column with the most zeros.'
            answer: '0'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Row 2 has two zeros, so only the entry $3$ contributes, with sign $(-1)^{2+2}=+1$. The minor is $\det\begin{pmatrix}1&2\\2&4\end{pmatrix}=4-4=0$, so the determinant is $3\cdot0=0$.'
          - problem: 'Compute $\det\begin{pmatrix}4&2&7\\0&5&1\\0&0&3\end{pmatrix}$.'
            answer: '60'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Every entry below the diagonal is zero, so the matrix is upper triangular. Its determinant is the product of the diagonal entries, $4\cdot5\cdot3=60$.'
          - problem: 'Compute $\det\begin{pmatrix}2&4&0\\1&3&0\\5&7&8\end{pmatrix}$ by expanding along the row or column with the most zeros.'
            answer: '16'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Column 3 has two zeros, so only the entry $a_{33}=8$ contributes, with sign $(-1)^{3+3}=+1$. The minor is $\det\begin{pmatrix}2&4\\1&3\end{pmatrix}=6-4=2$, so the determinant is $8\cdot2=16$.'
          - problem: 'A linear map has the upper triangular matrix $\begin{pmatrix}2&1&4\\0&x&5\\0&0&7\end{pmatrix}$ and multiplies every volume by $42$, so its determinant is positive. Find $x$.'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The determinant of a triangular matrix is the product of its diagonal entries, here $2\cdot x\cdot7=14x$. Setting $14x=42$ gives $x=3$.'
          - problem: 'A diagonal matrix has diagonal entries $2$, $3$ and $5$, so it stretches the three coordinate directions by those factors. By what factor does it multiply every volume?'
            answer: '30'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A diagonal matrix is triangular, so its determinant is $2\cdot3\cdot5=30$. Volumes are multiplied by the determinant, so the factor is $30$.'
          - problem: 'Compute $\det\begin{pmatrix}0&4&0\\2&1&5\\3&6&7\end{pmatrix}$ by expanding along the row or column with the most zeros.'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Row 1 has two zeros, so only the entry $a_{12}=4$ contributes, with sign $(-1)^{1+2}=-1$. The minor is $\det\begin{pmatrix}2&5\\3&7\end{pmatrix}=14-15=-1$, so the determinant is $-4\cdot(-1)=4$.'
          - problem: 'The linear map with matrix $\begin{pmatrix}3&1&2\\0&2&5\\0&0&4\end{pmatrix}$ multiplies every volume by its determinant. The image of a solid has volume $168$ cubic centimetres. What was the volume of the solid?'
            answer: '7'
            answer_contract: {"kind": "unit", "quantity": "cubic_volume", "unit": "cm^3", "allow_omitted": true}
            solution_sketch: 'The matrix is upper triangular, so its determinant is $3\cdot2\cdot4=24$. The image volume is $24$ times the original volume, so the original volume is $168\div24=7$ cubic centimetres.'
        constraints: 'one triangular matrix and one matrix with a zero-rich row or column per problem set; volume-factor contexts'
      - id: kp3
        name: 3x3 determinants by cofactor expansion
        key_prerequisites: [determinants-2x2]
        try_first:
          problem: 'Compute $\det\begin{pmatrix}3&1&0\\1&2&1\\0&1&4\end{pmatrix}$.'
          answer_contract: {"kind": "exact"}
          answer: '17'
          reveal: 'Expand along row 1: $3\cdot(2\cdot4-1\cdot1)-1\cdot(1\cdot4-1\cdot0)+0=21-4=17$. Each entry of the row is multiplied by its minor with alternating signs $+,-,+$.'
        exemplars:
          - problem: 'Compute $\det\begin{pmatrix}1&2&0\\3&1&2\\0&4&1\end{pmatrix}$ by expanding along the first row.'
            answer: '-13'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Expand along row 1: $1\cdot M_{11}-2\cdot M_{12}+0\cdot M_{13}$ with $M_{11}=1\cdot1-2\cdot4=-7$ and $M_{12}=3\cdot1-2\cdot0=3$. So $\det=-7-2\cdot3=-13$.'
          - problem: 'Compute $\det\begin{pmatrix}2&0&1\\1&3&0\\0&1&4\end{pmatrix}$.'
            answer: '25'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Expand along row 1: $2(3\cdot4-0\cdot1)-0+1(1\cdot1-3\cdot0)=24+1=25$. The middle term vanishes because its entry is $0$.'
          - problem: 'Compute $\det\begin{pmatrix}3&1&0\\2&-1&4\\0&2&-2\end{pmatrix}$ by expanding along the first row.'
            answer: '-14'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Expand along row 1: $3((-1)(-2)-4\cdot2)-1(2(-2)-4\cdot0)+0$. The first minor is $2-8=-6$ and the second is $-4-0=-4$, so $\det=3(-6)-1(-4)=-18+4=-14$.'
          - problem: 'Compute $\det\begin{pmatrix}1&-2&3\\0&2&1\\2&0&-1\end{pmatrix}$.'
            answer: '-18'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Expand along row 1 with signs $+,-,+$. The minors are $M_{11}=-2$, $M_{12}=-2$ and $M_{13}=-4$, so $\det=1(-2)-(-2)(-2)+3(-4)=-2-4-12=-18$.'
          - problem: 'The matrix $\begin{pmatrix}2&0&1\\1&x&3\\0&4&-1\end{pmatrix}$ has determinant $-26$. Find $x$.'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Expand along row 1, which has a zero in the middle: $2(-x-12)-0+1(4-0)=-2x-20$. Setting $-2x-20=-26$ gives $-2x=-6$, so $x=3$.'
          - problem: 'Compute $\det\begin{pmatrix}1&3&-2\\0&-1&4\\2&1&0\end{pmatrix}$ by expanding along column 3.'
            answer: '16'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The signs down column 3 are $+,-,+$, so $\det=-2\cdot M_{13}-4\cdot M_{23}+0$. The minors are $M_{13}=0\cdot1-(-1)\cdot2=2$ and $M_{23}=1\cdot1-3\cdot2=-5$, so $\det=-4+20=16$.'
          - problem: 'A solid is the parallelepiped with edge vectors $(1,1,0)$, $(0,2,1)$ and $(3,0,1)$, with lengths in centimetres. Find its volume.'
            answer: '5'
            answer_contract: {"kind": "unit", "quantity": "cubic_volume", "unit": "cm^3", "allow_omitted": true}
            solution_sketch: 'The volume is the absolute value of the determinant of the matrix with the three edge vectors as rows. Expanding along row 1 gives $1(2-0)-1(0-3)+0=5$, so the volume is $5$ cubic centimetres.'
          - problem: 'A solid is the parallelepiped with edge vectors $(2,1,0)$, $(0,3,1)$ and $(1,0,2)$, with lengths in centimetres. Find its volume.'
            answer: '13'
            answer_contract: {"kind": "unit", "quantity": "cubic_volume", "unit": "cm^3", "allow_omitted": true}
            solution_sketch: 'The volume is the absolute value of the determinant of the matrix with the three edge vectors as rows. Expanding along row 1 gives $2(6-0)-1(0-1)+0=12+1=13$, so the volume is $13$ cubic centimetres.'
          - problem: 'For what value of $k$ is $\begin{pmatrix}k&1&0\\2&1&3\\0&1&1\end{pmatrix}$ not invertible?'
            answer: '-1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The matrix is not invertible when its determinant is zero. Expanding along row 1 gives $k(1-3)-1(2-0)+0=-2k-2$, and $-2k-2=0$ gives $k=-1$.'
        constraints: 'entries in -4..4 with at least one zero per matrix; determinant in -30..30; edge-vector volume contexts'
    diagnostic_exemplar:
      problem: 'Compute $\det\begin{pmatrix}1&0&2\\2&1&3\\0&1&1\end{pmatrix}$.'
      answer: "2"
      solution_sketch: 'Expand along row 1: $1(1 - 3) - 0 + 2(2 - 0) = -2 + 4 = 2$.'
    anki_seeds:
      - front: 'Determinant of a triangular matrix?'
        back: 'The product of the diagonal entries.'
        type: basic
      - front: 'In cofactor expansion, the sign attached to entry $(i, j)$ is...'
        back: '$(-1)^{i+j}$ (checkerboard pattern).'
        type: basic
      - front: 'The cofactor $C_{ij}$ equals the minor $M_{ij}$ times...'
        back: '$(-1)^{i+j}$.'
        type: basic

  - id: determinant-properties-cramers-rule
    name: Determinant Properties and Cramer's Rule
    core: true
    difficulty: 0.65
    drill: false
    answer_kind: numeric
    expected_time_secs: 180
    prerequisites:
      - id: determinants
        weight: 0.8
        key: true
      - id: matrix-inverses
        weight: 0.4
      - id: row-reduction-echelon-forms
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: Multiplicativity and scaling
        key_prerequisites: [determinants]
        try_first:
          problem: 'A $2\times2$ matrix $A$ has determinant $5$. Every entry of $A$ is tripled. By what factor does the determinant change?'
          answer_contract: {"kind": "exact"}
          answer: '9'
          reveal: 'Tripling every entry triples each of the two rows, and each tripled row multiplies the determinant by $3$. The factor is $3\cdot3=9$, not $3$.'
        exemplars:
          - problem: 'Let $A$ and $B$ be $2\times2$ matrices with $\det A=3$ and $\det B=2$. Find $\det(AB)$.'
            answer: '6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The determinant of a product is the product of the determinants. So $\det(AB)=\det A\cdot\det B=3\cdot2=6$.'
          - problem: 'Let $A$ be a $2\times2$ matrix with $\det A=3$. Find $\det(2A)$.'
            answer: '12'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Multiplying a $2\times2$ matrix by $2$ multiplies each of its two rows by $2$. So $\det(2A)=2^2\det A=4\cdot3=12$.'
          - problem: 'Let $A$ be an invertible matrix with $\det A=3$. Find $\det(A^{-1})$.'
            answer: '1/3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Since $AA^{-1}=I$ and $\det I=1$, we get $\det A\cdot\det(A^{-1})=1$. So $\det(A^{-1})=\frac13$.'
          - problem: 'Let $A$ and $B$ be $3\times3$ matrices with $\det A=-2$ and $\det B=5$. Find $\det(AB)$.'
            answer: '-10'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The determinant of a product is the product of the determinants, so $\det(AB)=(-2)\cdot5=-10$.'
          - problem: 'Let $A$ be a $3\times3$ matrix with $\det A=2$. Find $\det(-3A)$.'
            answer: '-54'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The matrix has three rows, and each is multiplied by $-3$. So $\det(-3A)=(-3)^3\det A=-27\cdot2=-54$.'
          - problem: 'Let $A$ be an invertible $2\times2$ matrix with $\det A=4$. Find $\det(3A^{-1})$.'
            answer: '9/4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'First $\det(A^{-1})=\frac14$. Multiplying a $2\times2$ matrix by $3$ multiplies its determinant by $3^2=9$, so $\det(3A^{-1})=9\cdot\frac14=\frac94$.'
          - problem: 'A map $S$ of the plane multiplies every area by $3$, and a second map $T$ multiplies every area by $5$. By what factor does doing $T$ and then $S$ multiply every area?'
            answer: '15'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Doing $T$ and then $S$ is the product of the two matrices, and the determinant of a product is the product of the determinants. So the factor is $3\cdot5=15$.'
          - problem: 'Two maps $S$ and $T$ of the plane are applied one after the other, and together they multiply every area by $12$. The map $S$ alone multiplies every area by $3$. By what factor does $T$ alone multiply every area?'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Areas are multiplied by $\det(ST)=\det S\cdot\det T$. So $12=3\cdot\det T$, and $\det T=12\div3=4$.'
          - problem: 'Sam says that $\det(2A)=2\det A$ for every matrix, and so gets $\det(2A)=-6$ for a $3\times3$ matrix $A$ with $\det A=-3$. What is the correct value of $\det(2A)$?'
            answer: '-24'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A $3\times3$ matrix has three rows, and doubling every entry doubles each of them. So $\det(2A)=2^3\det A=8\cdot(-3)=-24$, and Sam used the factor $2$ instead of $2^3$.'
        constraints: 'sizes 2x2 or 3x3 stated; given determinants are small integers; area-factor contexts and one error-analysis item'
      - id: kp2
        name: Row operations and zero determinants
        key_prerequisites: [determinants]
        exemplars:
          - problem: 'Matrix $B$ is obtained from $A$ by swapping two rows, and $\det A=5$. Find $\det B$.'
            answer: '-5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A row swap changes the sign of the determinant. So $\det B=-\det A=-5$.'
          - problem: 'Matrix $B$ is obtained from $A$ by the row operation $R_2\to R_2+4R_1$, and $\det A=7$. Find $\det B$.'
            answer: '7'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Adding a multiple of one row to another row leaves the determinant unchanged. So $\det B=\det A=7$.'
          - problem: 'Find $\det A$ for $A=\begin{pmatrix}2&5&1\\3&1&4\\2&5&1\end{pmatrix}$.'
            answer: '0'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Rows 1 and 3 are equal. Swapping them leaves the matrix unchanged but changes the sign of the determinant, so $\det A=-\det A$ and $\det A=0$.'
          - problem: 'Matrix $B$ is obtained from $A$ by the row operation $R_1\to3R_1$, and $\det A=4$. Find $\det B$.'
            answer: '12'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Multiplying one row by $3$ multiplies the determinant by $3$. So $\det B=3\cdot4=12$.'
          - problem: 'Swapping two rows of a matrix $A$ gives the matrix $B$, and $\det B=-8$. Find $\det A$.'
            answer: '8'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A row swap changes the sign of the determinant, so $\det B=-\det A$. Then $-8=-\det A$ and $\det A=8$.'
          - problem: 'Matrix $B$ is obtained from $A$ by the row operation $R_3\to\frac12R_3$, and $\det A=10$. Find $\det B$.'
            answer: '5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Multiplying one row by $\frac12$ multiplies the determinant by $\frac12$. So $\det B=\frac12\cdot10=5$.'
          - problem: 'The map with matrix $M$ multiplies every area by $8$ and keeps orientation, so $\det M=8$. Swapping the two rows of $M$ gives the matrix $N$. Find $\det N$.'
            answer: '-8'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A row swap changes the sign of the determinant. So $\det N=-\det M=-8$, and the map $N$ reverses orientation.'
          - problem: 'Is the matrix $\begin{pmatrix}1&2&3\\4&5&6\\7&8&9\end{pmatrix}$ invertible?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "it is invertible", "invertible", "it has an inverse"], ["no", "it is not invertible", "not invertible", "singular", "it has no inverse"]]}
            solution_sketch: 'Replace $R_3$ by $R_3-R_2$ and then $R_2$ by $R_2-R_1$. Both new rows are $(3,3,3)$, and row replacements do not change the determinant, so $\det=0$ and the matrix is not invertible.'
          - problem: 'The map with matrix $M$ has $\det M=5$. The matrix $N$ is obtained from $M$ by $R_2\to R_2+4R_1$, and $P$ is obtained from $N$ by $R_1\to3R_1$. By what factor does the map $P$ multiply every area?'
            answer: '15'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The replacement leaves the determinant at $5$. The scaling multiplies it by $3$, so $\det P=15$ and the map multiplies every area by $15$.'
        constraints: 'one row operation per problem, or two in a context; determinants stay small integers; at most one yes/no item'
      - id: kp3
        name: "Cramer's rule for 2x2 systems"
        key_prerequisites: [determinants, row-reduction-echelon-forms]
        exemplars:
          - problem: 'Use Cramer''s rule to solve $2x+y=7$, $x+3y=6$.'
            answer: '(3, 1)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'The coefficient determinant is $D=2\cdot3-1\cdot1=5$. Replacing the $x$-column by the constants gives $D_x=7\cdot3-1\cdot6=15$, and replacing the $y$-column gives $D_y=2\cdot6-7\cdot1=5$. So $x=15/5=3$ and $y=5/5=1$.'
          - problem: 'Use Cramer''s rule to solve $x+2y=4$, $3x+y=7$.'
            answer: '(2, 1)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'The coefficient determinant is $D=1\cdot1-2\cdot3=-5$. Then $D_x=4\cdot1-2\cdot7=-10$ and $D_y=1\cdot7-4\cdot3=-5$. So $x=-10/(-5)=2$ and $y=-5/(-5)=1$.'
          - problem: 'Use Cramer''s rule to solve $4x-y=9$, $2x+3y=1$.'
            answer: '(2, -1)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'The coefficient determinant is $D=4\cdot3-(-1)\cdot2=14$. Then $D_x=9\cdot3-(-1)\cdot1=28$ and $D_y=4\cdot1-9\cdot2=-14$. So $x=28/14=2$ and $y=-14/14=-1$.'
          - problem: 'A cafe sells coffees and muffins. Two coffees and three muffins cost $17$ dollars, and four coffees and one muffin cost $19$ dollars. Use Cramer''s rule to find the price of one muffin.'
            answer: '3'
            answer_contract: {"kind": "unit", "quantity": "dollar", "unit": "dollar", "allow_omitted": true}
            solution_sketch: 'Let $x$ be the price of a coffee and $y$ the price of a muffin, so $2x+3y=17$ and $4x+y=19$. Then $D=2\cdot1-3\cdot4=-10$ and $D_y=2\cdot19-17\cdot4=-30$, so $y=-30/(-10)=3$ dollars.'
          - problem: 'A farm has $30$ animals, all chickens and cows, and they have $84$ legs in all. Use Cramer''s rule to find the number of cows.'
            answer: '12'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Let $x$ be the number of chickens and $y$ the number of cows, so $x+y=30$ and $2x+4y=84$. Then $D=1\cdot4-1\cdot2=2$ and $D_y=1\cdot84-30\cdot2=24$, so $y=24/2=12$.'
          - problem: 'Use Cramer''s rule to solve $5x+2y=3$, $3x+4y=1$.'
            answer: '(5/7, -2/7)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'The coefficient determinant is $D=5\cdot4-2\cdot3=14$. Then $D_x=3\cdot4-2\cdot1=10$ and $D_y=5\cdot1-3\cdot3=-4$. So $x=10/14=5/7$ and $y=-4/14=-2/7$.'
          - problem: 'Can Cramer''s rule be used to solve $2x+4y=6$, $x+2y=5$?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "it can", "it can be used", "can be used"], ["no", "it cannot", "it cannot be used", "cannot be used"]]}
            solution_sketch: 'Cramer''s rule divides by the coefficient determinant $D$. Here $D=2\cdot2-4\cdot1=0$, so the rule cannot be used; doubling the second equation gives $2x+4y=10$, which contradicts the first equation.'
          - problem: 'For what value of $k$ does the system $x+ky=3$, $4x+8y=9$ have no unique solution?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A system has no unique solution when the coefficient determinant is zero. Here $D=1\cdot8-k\cdot4=8-4k$, and $8-4k=0$ gives $k=2$.'
        constraints: 'D must be nonzero except in the one yes/no item and the parameter item; solutions are integers or simple fractions; purchase and counting contexts'
