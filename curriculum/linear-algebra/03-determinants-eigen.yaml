        weight: 0.3
    knowledge_points:
      - id: kp1
        name: 'Building P and D'
        key_prerequisites: [finding-eigenvectors, matrix-inverses]
        exemplars:
          - problem: 'Diagonalize $A = \begin{pmatrix} 3 & 1 \\ 1 & 3 \end{pmatrix}$ as $A = PDP^{-1}$, with the larger eigenvalue first in $D$. What is $D$?'
            answer: '[[4,0],[0,2]]'
            answer_contract: {"kind": "matrix", "rows": 2, "cols": 2}
            solution_sketch: 'The characteristic polynomial is $(3 - \lambda)^2 - 1 = (\lambda - 4)(\lambda - 2)$, so the eigenvalues are $4$ and $2$. The matrix $D$ has them on the diagonal, the larger one first, so $D = \begin{pmatrix} 4 & 0 \\ 0 & 2 \end{pmatrix}$.'
          - problem: 'The matrix $A = \begin{pmatrix} 2 & 0 \\ 1 & 3 \end{pmatrix}$ has the eigenvalues $2$ and $3$. In $A = PDP^{-1}$ with $D = \begin{pmatrix} 2 & 0 \\ 0 & 3 \end{pmatrix}$, the first column of $P$ is an eigenvector for $\lambda = 2$. Find this column in the form $(1, y)$.'
            answer: '(1, -1)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'The matrix $A - 2I = \begin{pmatrix} 0 & 0 \\ 1 & 1 \end{pmatrix}$ gives the equation $x + y = 0$. With $x = 1$ we get $y = -1$, and $A(1, -1) = (2, -2) = 2(1, -1)$ confirms the column $(1, -1)$.'
          - problem: 'The columns of $P = \begin{pmatrix} 1 & 1 \\ 1 & -2 \end{pmatrix}$ are eigenvectors of $A = \begin{pmatrix} 4 & 1 \\ 2 & 3 \end{pmatrix}$ for the eigenvalues $5$ and $2$, in this order. Find the matrix $D$ in $A = PDP^{-1}$.'
            answer: '[[5,0],[0,2]]'
            answer_contract: {"kind": "matrix", "rows": 2, "cols": 2}
            solution_sketch: 'The first column $(1, 1)$ belongs to $\lambda = 5$ because $A(1, 1) = (5, 5)$, and the second column $(1, -2)$ belongs to $\lambda = 2$ because $A(1, -2) = (2, -4)$. So $D = \begin{pmatrix} 5 & 0 \\ 0 & 2 \end{pmatrix}$, with the eigenvalues in the order of the columns.'
          - problem: 'The matrix $A = \begin{pmatrix} 5 & 3 \\ 3 & 5 \end{pmatrix}$ has the eigenvalues $8$ and $2$. In $A = PDP^{-1}$ with $D = \begin{pmatrix} 8 & 0 \\ 0 & 2 \end{pmatrix}$, the first column of $P$ is an eigenvector for $\lambda = 8$. Find this column in the form $(1, y)$.'
            answer: '(1, 1)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'The matrix $A - 8I = \begin{pmatrix} -3 & 3 \\ 3 & -3 \end{pmatrix}$ gives the equation $-3x + 3y = 0$, so $y = x$. With $x = 1$ the column is $(1, 1)$, and $A(1, 1) = (8, 8)$ confirms it.'
          - problem: 'Diagonalize $A = \begin{pmatrix} -1 & 2 \\ 2 & -1 \end{pmatrix}$ as $A = PDP^{-1}$, with the smaller eigenvalue first in $D$. What is $D$?'
            answer: '[[-3,0],[0,1]]'
            answer_contract: {"kind": "matrix", "rows": 2, "cols": 2}
            solution_sketch: 'The trace is $-2$ and the determinant is $1 - 4 = -3$, so $\lambda^2 + 2\lambda - 3 = (\lambda + 3)(\lambda - 1) = 0$. The eigenvalues are $-3$ and $1$, and with the smaller one first $D = \begin{pmatrix} -3 & 0 \\ 0 & 1 \end{pmatrix}$.'
          - problem: 'The matrix $A = \begin{pmatrix} 0 & 4 \\ 1 & 0 \end{pmatrix}$ has the eigenvalues $-2$ and $2$. In $A = PDP^{-1}$ with $D = \begin{pmatrix} -2 & 0 \\ 0 & 2 \end{pmatrix}$, the second column of $P$ is an eigenvector for $\lambda = 2$. Find this column in the form $(x, 1)$.'
            answer: '(2, 1)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'The matrix $A - 2I = \begin{pmatrix} -2 & 4 \\ 1 & -2 \end{pmatrix}$ gives the equation $x - 2y = 0$. With $y = 1$ we get $x = 2$, and $A(2, 1) = (4, 2) = 2(2, 1)$ confirms the column $(2, 1)$.'
          - problem: 'Two quantities $x$ and $y$ change in each step by $x'' = 2x + y$ and $y'' = 3x + 4y$, which is multiplication by a matrix $A$. Diagonalize $A$ as $A = PDP^{-1}$, with the larger growth factor first in $D$. What is $D$?'
            answer: '[[5,0],[0,1]]'
            answer_contract: {"kind": "matrix", "rows": 2, "cols": 2}
            solution_sketch: 'The step is multiplication by $A = \begin{pmatrix} 2 & 1 \\ 3 & 4 \end{pmatrix}$. The trace is $6$ and the determinant is $8 - 3 = 5$, so $\lambda^2 - 6\lambda + 5 = (\lambda - 5)(\lambda - 1) = 0$. The larger factor $5$ comes first, so $D = \begin{pmatrix} 5 & 0 \\ 0 & 1 \end{pmatrix}$.'
          - problem: 'Each year $10\%$ of the residents of city P move to city Q and $20\%$ of the residents of city Q move to city P. The pair of the two populations is multiplied each year by the matrix $M = \begin{pmatrix} 0.9 & 0.2 \\ 0.1 & 0.8 \end{pmatrix}$. Diagonalize $M$ as $M = PDP^{-1}$, with the larger eigenvalue first in $D$. What is $D$?'
            answer: '[[1,0],[0,0.7]]'
            answer_contract: {"kind": "matrix", "rows": 2, "cols": 2}
            solution_sketch: 'The trace is $1.7$ and the determinant is $0.72 - 0.02 = 0.7$, so $\lambda^2 - 1.7\lambda + 0.7 = (\lambda - 1)(\lambda - 0.7) = 0$. The eigenvalues are $1$ and $0.7$, so $D = \begin{pmatrix} 1 & 0 \\ 0 & 0.7 \end{pmatrix}$.'
          - problem: 'The matrix $A = \begin{pmatrix} 0 & 1 \\ 2 & 1 \end{pmatrix}$ has the eigenvalues $2$ and $-1$. Find the matrix $P$ whose columns are eigenvectors of $A$ for the eigenvalues $2$ and $-1$, in this order, and whose first row is $(1, 1)$.'
            answer: '[[1,1],[2,-1]]'
            answer_contract: {"kind": "matrix", "rows": 2, "cols": 2}
            solution_sketch: 'The matrix $A - 2I = \begin{pmatrix} -2 & 1 \\ 2 & -1 \end{pmatrix}$ gives $y = 2x$, so the first column is $(1, 2)$. The matrix $A + I = \begin{pmatrix} 1 & 1 \\ 2 & 2 \end{pmatrix}$ gives $y = -x$, so the second column is $(1, -1)$ and $P = \begin{pmatrix} 1 & 1 \\ 2 & -1 \end{pmatrix}$.'
        constraints: '2x2 with two distinct integer eigenvalues (one with decimal eigenvalues from a migration matrix); D, one eigenvector column of the stated shape (1, y) or (x, 1), or P with a stated first row is asked; eigenvector entries in -2..2'
      - id: kp2
        name: 'Verifying by reassembly'
        key_prerequisites: [matrix-inverses, similar-matrices]
        exemplars:
          - problem: 'Let $P = \begin{pmatrix} 1 & 1 \\ 1 & -1 \end{pmatrix}$ and $D = \begin{pmatrix} 3 & 0 \\ 0 & 1 \end{pmatrix}$. Compute $PDP^{-1}$.'
            answer: '[[2,1],[1,2]]'
            answer_contract: {"kind": "matrix", "rows": 2, "cols": 2}
            solution_sketch: 'The determinant of $P$ is $-2$, so $P^{-1} = \frac{1}{2}\begin{pmatrix} 1 & 1 \\ 1 & -1 \end{pmatrix}$, and $PD = \begin{pmatrix} 3 & 1 \\ 3 & -1 \end{pmatrix}$. Then $PDP^{-1} = \frac{1}{2}\begin{pmatrix} 4 & 2 \\ 2 & 4 \end{pmatrix} = \begin{pmatrix} 2 & 1 \\ 1 & 2 \end{pmatrix}$.'
          - problem: 'Let $P = \begin{pmatrix} 3 & 1 \\ 2 & 1 \end{pmatrix}$ and $D = \begin{pmatrix} 5 & 0 \\ 0 & 2 \end{pmatrix}$. Compute $PDP^{-1}$.'
            answer: '[[11,-9],[6,-4]]'
            answer_contract: {"kind": "matrix", "rows": 2, "cols": 2}
            solution_sketch: 'The determinant of $P$ is $3 - 2 = 1$, so $P^{-1} = \begin{pmatrix} 1 & -1 \\ -2 & 3 \end{pmatrix}$, and $PD = \begin{pmatrix} 15 & 2 \\ 10 & 2 \end{pmatrix}$. Then $PDP^{-1} = \begin{pmatrix} 11 & -9 \\ 6 & -4 \end{pmatrix}$.'
          - problem: 'Let $P = \begin{pmatrix} 1 & 2 \\ 0 & 1 \end{pmatrix}$ and $D = \begin{pmatrix} 5 & 0 \\ 0 & 2 \end{pmatrix}$. Compute $PDP^{-1}$.'
            answer: '[[5,-6],[0,2]]'
            answer_contract: {"kind": "matrix", "rows": 2, "cols": 2}
            solution_sketch: 'The inverse is $P^{-1} = \begin{pmatrix} 1 & -2 \\ 0 & 1 \end{pmatrix}$, and $PD = \begin{pmatrix} 5 & 4 \\ 0 & 2 \end{pmatrix}$. Then $PDP^{-1} = \begin{pmatrix} 5 & -6 \\ 0 & 2 \end{pmatrix}$.'
          - problem: 'Ana claims that $A = PDP^{-1}$ for $A = \begin{pmatrix} 1 & 2 \\ 3 & 2 \end{pmatrix}$, $P = \begin{pmatrix} 2 & 1 \\ 3 & -1 \end{pmatrix}$ and $D = \begin{pmatrix} 4 & 0 \\ 0 & -1 \end{pmatrix}$. She checks the claim by comparing $AP$ with $PD$. Is Ana right?'
            answer: 'yes'
            answer_contract: {"kind": "label", "options": [["yes", "she is right", "right"], ["no", "she is wrong", "she is not right", "wrong", "not right"]]}
            solution_sketch: 'We compute $AP = \begin{pmatrix} 8 & -1 \\ 12 & 1 \end{pmatrix}$ and $PD = \begin{pmatrix} 8 & -1 \\ 12 & 1 \end{pmatrix}$, so $AP = PD$. The matrix $P$ has determinant $-5$, so it is invertible, and multiplying by $P^{-1}$ on the right gives $A = PDP^{-1}$.'
          - problem: 'Let $P = \begin{pmatrix} 3 & 1 \\ 1 & 1 \end{pmatrix}$ and $D = \begin{pmatrix} 4 & 0 \\ 0 & 2 \end{pmatrix}$. Compute $PDP^{-1}$.'
            answer: '[[5,-3],[1,1]]'
            answer_contract: {"kind": "matrix", "rows": 2, "cols": 2}
            solution_sketch: 'The determinant of $P$ is $3 - 1 = 2$, so $P^{-1} = \frac{1}{2}\begin{pmatrix} 1 & -1 \\ -1 & 3 \end{pmatrix}$, and $PD = \begin{pmatrix} 12 & 2 \\ 4 & 2 \end{pmatrix}$. Then $PDP^{-1} = \frac{1}{2}\begin{pmatrix} 10 & -6 \\ 2 & 2 \end{pmatrix} = \begin{pmatrix} 5 & -3 \\ 1 & 1 \end{pmatrix}$.'
          - problem: 'Let $P = \begin{pmatrix} 1 & 1 \\ 2 & 1 \end{pmatrix}$ and $D = \begin{pmatrix} 6 & 0 \\ 0 & 3 \end{pmatrix}$. What is the entry in row 1, column 2 of $PDP^{-1}$?'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The determinant of $P$ is $1 - 2 = -1$, so $P^{-1} = \begin{pmatrix} -1 & 1 \\ 2 & -1 \end{pmatrix}$, and $PD = \begin{pmatrix} 6 & 3 \\ 12 & 3 \end{pmatrix}$. The entry in row 1, column 2 of the product is $6 \cdot 1 + 3 \cdot (-1) = 3$.'
          - problem: 'Ben keeps $A = \begin{pmatrix} 1 & 2 \\ 3 & 2 \end{pmatrix}$ and $D = \begin{pmatrix} 4 & 0 \\ 0 & -1 \end{pmatrix}$, but he writes the same two eigenvectors of $A$ in the other order and claims that $A = PDP^{-1}$ for $P = \begin{pmatrix} 1 & 2 \\ -1 & 3 \end{pmatrix}$. Is Ben right?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "he is right", "right"], ["no", "he is wrong", "he is not right", "wrong", "not right"]]}
            solution_sketch: 'We compute $AP = \begin{pmatrix} -1 & 8 \\ 1 & 12 \end{pmatrix}$, but $PD = \begin{pmatrix} 4 & -2 \\ -4 & -3 \end{pmatrix}$. The two matrices differ, because the first column of $P$ is an eigenvector for $-1$ while the first entry of $D$ is $4$, so Ben is wrong.'
          - problem: 'A model of two populations has a direction $(1, 1)$ along which the populations grow by the factor $6$ each year, and a direction $(1, -1)$ along which they grow by the factor $2$ each year. Find the matrix $A$ that describes one year.'
            answer: '[[4,2],[2,4]]'
            answer_contract: {"kind": "matrix", "rows": 2, "cols": 2}
            solution_sketch: 'We want $A(1, 1) = 6(1, 1)$ and $A(1, -1) = 2(1, -1)$, so $A = PDP^{-1}$ with $P = \begin{pmatrix} 1 & 1 \\ 1 & -1 \end{pmatrix}$ and $D = \begin{pmatrix} 6 & 0 \\ 0 & 2 \end{pmatrix}$. Then $PD = \begin{pmatrix} 6 & 2 \\ 6 & -2 \end{pmatrix}$ and $PDP^{-1} = \frac{1}{2}\begin{pmatrix} 8 & 4 \\ 4 & 8 \end{pmatrix} = \begin{pmatrix} 4 & 2 \\ 2 & 4 \end{pmatrix}$.'
          - problem: 'Residents move between two cities P and Q. The distribution $(2, 1)$ of the population does not change from year to year, and the distribution $(1, -1)$ is multiplied by the factor $0.7$ each year. Find the matrix $M$ that describes one year.'
            answer: '[[0.9,0.2],[0.1,0.8]]'
            answer_contract: {"kind": "matrix", "rows": 2, "cols": 2}
            solution_sketch: 'We want $M(2, 1) = 1 \cdot (2, 1)$ and $M(1, -1) = 0.7(1, -1)$, so $M = PDP^{-1}$ with $P = \begin{pmatrix} 2 & 1 \\ 1 & -1 \end{pmatrix}$ and $D = \begin{pmatrix} 1 & 0 \\ 0 & 0.7 \end{pmatrix}$. Here $P^{-1} = \frac{1}{3}\begin{pmatrix} 1 & 1 \\ 1 & -2 \end{pmatrix}$, and the product is $\begin{pmatrix} 0.9 & 0.2 \\ 0.1 & 0.8 \end{pmatrix}$.'
        constraints: '2x2 with det P = +-2 or +-1 so P^{-1} is quick; always land back on A exactly'
      - id: kp3
        name: 'Powers via diagonalization'
        key_prerequisites: [matrix-inverses, diagonalizability-check, matrix-powers]
        try_first:
          problem: 'Let $A = PDP^{-1}$ with $P = \begin{pmatrix} 1 & 1 \\ 0 & 1 \end{pmatrix}$ and $D = \begin{pmatrix} 3 & 0 \\ 0 & 1 \end{pmatrix}$. What is the entry in row 1, column 1 of $A^{10}$?'
          answer_contract: {"kind": "exact"}
          answer: '59049'
          reveal: 'Only $D$ has to be raised to the tenth power, so $D^{10} = \mathrm{diag}(3^{10}, 1)$. The matrix $P D^{10} P^{-1}$ then has the entry $3^{10} = 59049$ in row 1, column 1.'
        exemplars:
          - problem: 'Let $A = PDP^{-1}$ with $P = \begin{pmatrix} 1 & 1 \\ 0 & 1 \end{pmatrix}$ and $D = \begin{pmatrix} 1 & 0 \\ 0 & 2 \end{pmatrix}$. Compute $A^3$.'
            answer: '[[1,7],[0,8]]'
            answer_contract: {"kind": "matrix", "rows": 2, "cols": 2}
            solution_sketch: 'We use $A^3 = PD^3P^{-1}$ with $D^3 = \begin{pmatrix} 1 & 0 \\ 0 & 8 \end{pmatrix}$ and $P^{-1} = \begin{pmatrix} 1 & -1 \\ 0 & 1 \end{pmatrix}$. Then $PD^3 = \begin{pmatrix} 1 & 8 \\ 0 & 8 \end{pmatrix}$ and $PD^3P^{-1} = \begin{pmatrix} 1 & 7 \\ 0 & 8 \end{pmatrix}$.'
          - problem: 'Let $A = PDP^{-1}$ with $D = \begin{pmatrix} 2 & 0 \\ 0 & 3 \end{pmatrix}$. What is $D^4$?'
            answer: '[[16,0],[0,81]]'
            answer_contract: {"kind": "matrix", "rows": 2, "cols": 2}
            solution_sketch: 'The power of a diagonal matrix is found entry by entry on the diagonal. So $D^4 = \begin{pmatrix} 2^4 & 0 \\ 0 & 3^4 \end{pmatrix} = \begin{pmatrix} 16 & 0 \\ 0 & 81 \end{pmatrix}$.'
          - problem: 'Let $A = PDP^{-1}$ with $P = \begin{pmatrix} 1 & 2 \\ 0 & 1 \end{pmatrix}$ and $D = \begin{pmatrix} 2 & 0 \\ 0 & -1 \end{pmatrix}$. Compute $A^3$.'
            answer: '[[8,-18],[0,-1]]'
            answer_contract: {"kind": "matrix", "rows": 2, "cols": 2}
            solution_sketch: 'We use $A^3 = PD^3P^{-1}$ with $D^3 = \begin{pmatrix} 8 & 0 \\ 0 & -1 \end{pmatrix}$ and $P^{-1} = \begin{pmatrix} 1 & -2 \\ 0 & 1 \end{pmatrix}$. Then $PD^3 = \begin{pmatrix} 8 & -2 \\ 0 & -1 \end{pmatrix}$ and $PD^3P^{-1} = \begin{pmatrix} 8 & -18 \\ 0 & -1 \end{pmatrix}$.'
          - problem: 'Let $A = PDP^{-1}$ with $P = \begin{pmatrix} 1 & 0 \\ 3 & 1 \end{pmatrix}$ and $D = \begin{pmatrix} 3 & 0 \\ 0 & 2 \end{pmatrix}$. Compute $A^4$.'
            answer: '[[81,0],[195,16]]'
            answer_contract: {"kind": "matrix", "rows": 2, "cols": 2}
            solution_sketch: 'We use $A^4 = PD^4P^{-1}$ with $D^4 = \begin{pmatrix} 81 & 0 \\ 0 & 16 \end{pmatrix}$ and $P^{-1} = \begin{pmatrix} 1 & 0 \\ -3 & 1 \end{pmatrix}$. Then $PD^4 = \begin{pmatrix} 81 & 0 \\ 243 & 16 \end{pmatrix}$ and $PD^4P^{-1} = \begin{pmatrix} 81 & 0 \\ 195 & 16 \end{pmatrix}$.'
          - problem: 'The matrix $A = \begin{pmatrix} 3 & 1 \\ -2 & 0 \end{pmatrix}$ has the eigenvector $(1, -1)$ for the eigenvalue $2$ and the eigenvector $(1, -2)$ for the eigenvalue $1$. Use the diagonalization $A = PDP^{-1}$ to compute $A^3$.'
            answer: '[[15,7],[-14,-6]]'
            answer_contract: {"kind": "matrix", "rows": 2, "cols": 2}
            solution_sketch: 'Take $P = \begin{pmatrix} 1 & 1 \\ -1 & -2 \end{pmatrix}$ and $D = \begin{pmatrix} 2 & 0 \\ 0 & 1 \end{pmatrix}$, so $A^3 = PD^3P^{-1}$ with $D^3 = \begin{pmatrix} 8 & 0 \\ 0 & 1 \end{pmatrix}$. Here $P^{-1} = \begin{pmatrix} 2 & 1 \\ -1 & -1 \end{pmatrix}$ and $PD^3 = \begin{pmatrix} 8 & 1 \\ -8 & -2 \end{pmatrix}$, so $A^3 = \begin{pmatrix} 15 & 7 \\ -14 & -6 \end{pmatrix}$.'
          - problem: 'Let $A = PDP^{-1}$ with $P = \begin{pmatrix} 1 & 0 \\ 2 & 1 \end{pmatrix}$ and $D = \begin{pmatrix} -1 & 0 \\ 0 & 2 \end{pmatrix}$. What is the entry in row 2, column 1 of $A^4$?'
            answer: '-30'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'We have $A^4 = PD^4P^{-1}$ with $D^4 = \begin{pmatrix} 1 & 0 \\ 0 & 16 \end{pmatrix}$ and $P^{-1} = \begin{pmatrix} 1 & 0 \\ -2 & 1 \end{pmatrix}$. Then $PD^4 = \begin{pmatrix} 1 & 0 \\ 2 & 16 \end{pmatrix}$, and row 2 times column 1 of $P^{-1}$ gives $2 \cdot 1 + 16 \cdot (-2) = -30$.'
          - problem: 'Each year $10\%$ of the residents of city P move to city Q and $20\%$ of the residents of city Q move to city P. The yearly matrix is $M = PDP^{-1}$ with $P = \begin{pmatrix} 2 & 1 \\ 1 & -1 \end{pmatrix}$ and $D = \begin{pmatrix} 1 & 0 \\ 0 & 0.7 \end{pmatrix}$. After many years $D^n$ is close to $\begin{pmatrix} 1 & 0 \\ 0 & 0 \end{pmatrix}$. In the long run, what fraction of all the residents lives in city P, whatever the starting populations are?'
            answer: '2/3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'For large $n$ the matrix $M^n = PD^nP^{-1}$ is close to $P\begin{pmatrix} 1 & 0 \\ 0 & 0 \end{pmatrix}P^{-1} = \begin{pmatrix} 2/3 & 2/3 \\ 1/3 & 1/3 \end{pmatrix}$. So a population $(p, q)$ becomes $\frac{p + q}{3}(2, 1)$, which means $\frac{2}{3}$ of the total lives in city P and $\frac{1}{3}$ in city Q.'
          - problem: 'A two-species population is multiplied each step by $A = \begin{pmatrix} 4 & 2 \\ 2 & 4 \end{pmatrix}$, which has the eigenvector $(1, 1)$ for the eigenvalue $6$ and the eigenvector $(1, -1)$ for the eigenvalue $2$. The starting population is $(1, 0)$. What is the population after $3$ steps?'
            answer: '(112, 104)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'We write $(1, 0) = \frac{1}{2}(1, 1) + \frac{1}{2}(1, -1)$. After $3$ steps the first part is multiplied by $6^3 = 216$ and the second by $2^3 = 8$, so the population is $\frac{1}{2} \cdot 216(1, 1) + \frac{1}{2} \cdot 8(1, -1) = (108 + 4, 108 - 4) = (112, 104)$.'
        constraints: 'exponents 3-5; diagonal entries in -2..3 so powers stay small'
    diagnostic_exemplar:
      problem: 'Diagonalize $A = \begin{pmatrix}2&1\\1&2\end{pmatrix}$ as $A = PDP^{-1}$, then use the factorization to compute $A^3$.'
      answer: '$P = \begin{pmatrix}1&1\\1&-1\end{pmatrix}$, $D = \begin{pmatrix}3&0\\0&1\end{pmatrix}$ (columns of $P$ may be scaled; their order must match $D$); $A^3 = PD^3P^{-1} = \begin{pmatrix}14&13\\13&14\end{pmatrix}$'
      answer_contract: {kind: none}
      solution_sketch: 'The eigenpairs are $3$ with $(1, 1)$ and $1$ with $(1, -1)$; $D^3 = \mathrm{diag}(27, 1)$, and reassembling gives $\begin{pmatrix}14&13\\13&14\end{pmatrix}$.'
    anki_seeds:
      - front: 'In $A = PDP^{-1}$, what are the columns of $P$ and the entries of $D$?'
        back: 'Columns of $P$: independent eigenvectors; diagonal of $D$: the matching eigenvalues, in the same order.'
        type: basic
      - front: 'Cheap check of a diagonalization without inverting $P$?'
        back: 'Verify $AP = PD$ and that $P$ is invertible ($AP = PD$ alone is not enough — $P = 0$ satisfies it).'
        type: basic
      - front: 'Why diagonalize to compute powers? Because $A^k = $ ...'
        back: '$PD^kP^{-1}$, and $D^k$ is just entrywise powers.'
        type: basic
