unit: determinants-eigen
course: linear-algebra
module: "Determinants & Eigentheory"
topics:
  - id: determinants-2x2
    name: 2x2 Determinants
    core: true
    difficulty: 0.5
    drill: false
    answer_kind: numeric
    expected_time_secs: 90
    prerequisites:
      - id: matrix-operations
        weight: 0.7
        key: true
    knowledge_points:
      - id: kp1
        name: The ad - bc formula
        key_prerequisites: [matrix-operations]
        exemplars:
          - problem: 'Compute $\det\begin{pmatrix}5&3\\2&4\end{pmatrix}$.'
            answer: "14"
            solution_sketch: '$ad - bc = 20 - 6$.'
          - problem: 'Compute $\det\begin{pmatrix}7&2\\9&3\end{pmatrix}$.'
            answer: "3"
            solution_sketch: '$21 - 18 = 3$.'
          - problem: 'Compute $\det\begin{pmatrix}-2&5\\3&1\end{pmatrix}$.'
            answer: "-17"
            solution_sketch: '$(-2)(1) - (5)(3) = -2 - 15$.'
          - problem: "Compute $\\det\\begin{pmatrix}4&-5\\\\3&2\\end{pmatrix}$."
            answer: "23"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Apply the ad - bc formula to the matrix [[4,-5],[3,2]]. Here a = 4, b = -5, c = 3, d = 2, so ad - bc = 4*2 - (-5)*3 = 8 + 15. The sum is 23, so the determinant equals 23."
          - problem: "Find the determinant of $\\begin{pmatrix}-3&6\\\\5&-2\\end{pmatrix}$."
            answer: "-24"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Use the ad - bc formula on the matrix [[-3,6],[5],[-2]] with a = -3, b = 6, c = 5, d = -2. Then ad - bc = (-3)(-2) - (6)(5) = 6 - 30. This gives -24 as the determinant."
          - problem: "A parallelogram is spanned by the vectors $(5,2)$ and $(3,-4)$. Its area is the absolute value of the determinant $\\det\\begin{pmatrix}5&3\\\\2&-4\\end{pmatrix}$. Give the number only, in square units."
            answer: "26"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Set up the determinant with the vectors as columns: [[5,3],[2,-4]]. Apply ad - bc: 5*(-4) - 3*2 = -20 - 6 = -26. The area is the absolute value, so the area is 26."
        constraints: "integer entries in -9..9; answers in -30..30; include some negative entries"
      - id: kp2
        name: Zero determinants and invertibility
        key_prerequisites: [matrix-operations]
        exemplars:
          - problem: 'Compute $\det\begin{pmatrix}2&6\\1&3\end{pmatrix}$, and note how the rows are related.'
            answer: "0"
            solution_sketch: '$6 - 6 = 0$: row 1 is twice row 2.'
          - problem: 'Compute $\det\begin{pmatrix}4&-2\\-6&3\end{pmatrix}$.'
            answer: "0"
            solution_sketch: '$12 - 12 = 0$; row 2 is $-\frac{3}{2}$ times row 1.'
          - problem: "Consider the matrix $\\begin{pmatrix}3&1\\\\5&2\\end{pmatrix}$. State whether the matrix is invertible, and give its determinant."
            answer: "verdict = invertible; det = 1"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["invertible"], ["singular"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "det"}]}
            solution_sketch: "Compute the determinant of the full matrix: $\\det = 3 \\cdot 2 - 1 \\cdot 5 = 6 - 5 = 1$. A $2 \\times 2$ matrix is invertible exactly when its determinant is nonzero. Since $1 \\neq 0$, the rows are not proportional and the matrix is invertible. The answer is verdict = invertible; det = 1."
          - problem: "Consider the matrix $\\begin{pmatrix}2&4\\\\3&6\\end{pmatrix}$. Determine whether the matrix is invertible, and give its determinant."
            answer: "verdict = singular; det = 0"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["invertible"], ["singular"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "det"}]}
            solution_sketch: "Compute the determinant of the full matrix: $\\det = 2 \\cdot 6 - 4 \\cdot 3 = 12 - 12 = 0$. Row 2 is $\\frac{3}{2}$ times row 1, so the rows are proportional and the determinant vanishes. A zero determinant means the matrix is not invertible. The answer is verdict = singular; det = 0."
          - problem: "Find the determinant of the matrix $\\begin{pmatrix}3&4\\\\2&5\\end{pmatrix}$."
            answer: "7"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Apply the $2 \\times 2$ determinant rule to the full matrix: $\\det = 3 \\cdot 5 - 4 \\cdot 2$. This gives $15 - 8 = 7$. Since $7 \\neq 0$, the rows are not proportional and the matrix is invertible. The determinant is 7."
          - problem: "Give the value of $\\det\\begin{pmatrix}1&4\\\\2&3\\end{pmatrix}$."
            answer: "-5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Apply the $2 \\times 2$ determinant rule to the full matrix: $\\det = 1 \\cdot 3 - 4 \\cdot 2$. This gives $3 - 8 = -5$. The negative sign records the row order and does not affect the invertibility test, since $-5 \\neq 0$. The determinant is -5."
        constraints: "singular cases have proportional rows with small ratios; invertibility questions decided purely by the determinant"
      - id: kp3
        name: Solving for an unknown entry
        key_prerequisites: [matrix-operations]
        exemplars:
          - problem: 'Find $x$ so that $\det\begin{pmatrix}x&2\\3&4\end{pmatrix} = 6$.'
            answer: "3"
            solution_sketch: '$4x - 6 = 6$, so $x = 3$.'
          - problem: 'Find $k$ so that $\begin{pmatrix}2&k\\4&10\end{pmatrix}$ is NOT invertible.'
            answer: "5"
            solution_sketch: 'Set $\det = 20 - 4k = 0$.'
          - problem: "Find $x$ so that $\\det\\begin{pmatrix}4&x\\\\6&9\\end{pmatrix} = 48$."
            answer: "-2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Expand the determinant of the full matrix: $\\det = 4 \\cdot 9 - 6 \\cdot x = 36 - 6x$. Set the determinant equal to the target: $36 - 6x = 48$. Solve the linear equation: $-6x = 12$, so $x = -2$. The answer is $x = -2$."
          - problem: "Find $k$ so that $\\begin{pmatrix}4&6\\\\k&3\\end{pmatrix}$ is NOT invertible."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "A matrix is not invertible exactly when its determinant is zero. Expand: $\\det = 4 \\cdot 3 - 6 \\cdot k = 12 - 6k$. Set $12 - 6k = 0$ and solve: $6k = 12$, so $k = 2$. The answer is $k = 2$."
          - problem: "Find $x$ so that $\\det\\begin{pmatrix}3&5\\\\x&-2\\end{pmatrix} = 14$."
            answer: "-4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The unknown sits in the lower-left entry. Expand the determinant: $\\det = 3 \\cdot (-2) - 5 \\cdot x = -6 - 5x$. Set $-6 - 5x = 14$. Solve: $-5x = 20$, so $x = -4$. The answer is $x = -4$."
          - problem: "Find $x$ so that $\\det\\begin{pmatrix}5&-2\\\\1&x\\end{pmatrix} = 7$."
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The unknown sits in the lower-right entry. Expand: $\\det = 5 \\cdot x - (-2) \\cdot 1 = 5x + 2$. Set $5x + 2 = 7$. Solve the linear equation: $5x = 5$, so $x = 1$. The answer is $x = 1$."
        constraints: "resulting linear equation has an integer solution in -6..6"
    diagnostic_exemplar:
      problem: 'Find $k$ so that $\det\begin{pmatrix}6&2\\7&k\end{pmatrix} = 4$.'
      answer: '3'
      solution_sketch: '$6k - 14 = 4$ gives $k = 3$.'
    anki_seeds:
      - front: '$\det\begin{pmatrix}a&b\\c&d\end{pmatrix} = $ ?'
        back: '$ad - bc$.'
        type: basic
      - front: 'A square matrix is invertible iff its determinant is...'
        back: 'nonzero.'
        type: basic

  - id: determinants
    name: Determinants
    core: true
    difficulty: 0.6
    drill: false
    answer_kind: numeric
    expected_time_secs: 150
    prerequisites:
      - id: determinants-2x2
        weight: 0.8
        key: true
      - id: matrix-operations
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: Minors and cofactors
        key_prerequisites: [determinants-2x2]
        exemplars:
          - problem: 'For $A = \begin{pmatrix}1&2&0\\3&1&2\\0&4&1\end{pmatrix}$, compute the minor $M_{11}$ and the cofactor $C_{11}$; state the pair $(M_{11}, C_{11})$.'
            answer: "(-7, -7)"
            solution_sketch: 'Delete row 1 and column 1: $\det\begin{pmatrix}1&2\\4&1\end{pmatrix} = 1 - 8 = -7$; the sign is $(-1)^{1+1} = +$.'
          - problem: 'For $A = \begin{pmatrix}2&0&1\\1&3&0\\0&1&4\end{pmatrix}$, compute the cofactor $C_{12}$.'
            answer: "-4"
            solution_sketch: 'Minor: $\det\begin{pmatrix}1&0\\0&4\end{pmatrix} = 4$; sign $(-1)^{1+2} = -$, so $C_{12} = -4$.'
          - problem: "For $A = \\begin{pmatrix}3&-1&2\\\\0&4&1\\\\2&0&-3\\end{pmatrix}$, compute the minor $M_{23}$ and the cofactor $C_{23}$; state the pair as (M23, C23)."
            answer: "(2, -2)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "Delete row 2 and column 3 of $A$; the submatrix is $\\begin{pmatrix}3&-1\\\\2&0\\end{pmatrix}$. By the 2x2 determinant rule, $M_{23} = 3 \\cdot 0 - (-1) \\cdot 2 = 2$. The sign is $(-1)^{2+3} = -1$, so $C_{23} = -2$. The pair is (2, -2)."
          - problem: "Let $A = \\begin{pmatrix}2&-3&1\\\\4&1&-2\\\\-1&3&0\\end{pmatrix}$. Compute the cofactor $C_{31}$."
            answer: "5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Delete row 3 and column 1; the submatrix is $\\begin{pmatrix}-3&1\\\\1&-2\\end{pmatrix}$. By the 2x2 determinant rule, $M_{31} = (-3)(-2) - 1 \\cdot 1 = 5$. The sign is $(-1)^{3+1} = +1$, so $C_{31} = 5$."
          - problem: "Let $A = \\begin{pmatrix}1&2&0\\\\x&3&1\\\\2&-1&4\\end{pmatrix}$, where $x$ is a number, and suppose the cofactor $C_{12}$ of $A$ equals $10$. Find $x$."
            answer: "-2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Delete row 1 and column 2 of $A$; the minor is $\\det\\begin{pmatrix}x&1\\\\2&4\\end{pmatrix} = 4x - 2$ by the 2x2 determinant rule. The sign is $(-1)^{1+2} = -1$, so $C_{12} = 2 - 4x$. Solve $2 - 4x = 10$, which gives $x = -2$."
          - problem: "Let $A = \\begin{pmatrix}-2&1&3\\\\4&0&-1\\\\1&2&-4\\end{pmatrix}$. Compute the minor $M_{32}$ (do not apply any sign)."
            answer: "-10"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Delete row 3 and column 2 of $A$; the submatrix is $\\begin{pmatrix}-2&3\\\\4&-1\\end{pmatrix}$. By the 2x2 determinant rule, $M_{32} = (-2)(-1) - 3 \\cdot 4 = 2 - 12 = -10$. A minor carries no sign, so the answer is -10."
        constraints: "3x3 matrices with entries in -4..4; ask for one minor and/or cofactor at a time"
      - id: kp2
        name: Triangular matrices and smart expansion
        key_prerequisites: [determinants-2x2]
        exemplars:
          - problem: 'Compute $\det\begin{pmatrix}3&0&0\\5&2&0\\1&4&6\end{pmatrix}$.'
            answer: "36"
            solution_sketch: 'Triangular: the determinant is the product of the diagonal, $3 \cdot 2 \cdot 6$.'
          - problem: 'Compute $\det\begin{pmatrix}1&5&2\\0&3&0\\2&1&4\end{pmatrix}$ by expanding along the row or column with the most zeros.'
            answer: "0"
            solution_sketch: 'Expand along row 2: $3 \cdot \det\begin{pmatrix}1&2\\2&4\end{pmatrix} = 3(4 - 4) = 0$.'
          - problem: "Compute $\\det\\begin{pmatrix}4&2&7\\\\0&5&1\\\\0&0&3\\end{pmatrix}$."
            answer: "60"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full matrix is upper triangular, since every entry below the diagonal is zero. For a triangular matrix the determinant is the product of the diagonal entries. Multiply the diagonal: $4 \\cdot 5 \\cdot 3 = 60$, so the answer is 60."
          - problem: "Compute $\\det\\begin{pmatrix}2&4&0\\\\1&3&0\\\\5&7&8\\end{pmatrix}$ by expanding along the column with the most zeros."
            answer: "16"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Expand along column 3, which has two zeros. Only the entry $a_{33} = 8$ contributes, with sign $(-1)^{3+3} = +1$. The minor is $\\det\\begin{pmatrix}2&4\\\\1&3\\end{pmatrix} = 6 - 4 = 2$. So the determinant is $8 \\cdot 2 = 16$."
          - problem: "The matrix $\\begin{pmatrix}2&1&4\\\\0&x&5\\\\0&0&7\\end{pmatrix}$ is upper triangular and has determinant $42$. Find $x$."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "For an upper triangular matrix the determinant is the product of the diagonal entries. Here that product is $2 \\cdot x \\cdot 7 = 14x$. Solve $14x = 42$, which gives $x = 3$."
          - problem: "Compute $\\det\\begin{pmatrix}0&4&0\\\\2&1&5\\\\3&6&7\\end{pmatrix}$ by expanding along the row with the most zeros."
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Expand along row 1, which has two zeros. Only $a_{12} = 4$ contributes, with sign $(-1)^{1+2} = -1$. The minor is $\\det\\begin{pmatrix}2&5\\\\3&7\\end{pmatrix} = 14 - 15 = -1$. So the determinant is $-4 \\cdot (-1) = 4$."
        constraints: "one triangular matrix and one matrix with a zero-rich row/column per problem set"
      - id: kp3
        name: 3x3 determinants by cofactor expansion
        key_prerequisites: [determinants-2x2]
        exemplars:
          - problem: 'Compute $\det\begin{pmatrix}1&2&0\\3&1&2\\0&4&1\end{pmatrix}$ by expanding along the first row.'
            answer: "-13"
            solution_sketch: '$1(1 - 8) - 2(3 - 0) + 0 = -7 - 6 = -13$.'
          - problem: 'Compute $\det\begin{pmatrix}2&0&1\\1&3&0\\0&1&4\end{pmatrix}$.'
            answer: "25"
            solution_sketch: 'Expand along row 1: $2(12 - 0) - 0 + 1(1 - 0) = 24 + 1$.'
          - problem: "Compute $\\det\\begin{pmatrix}3&1&0\\\\2&-1&4\\\\0&2&-2\\end{pmatrix}$ by expanding along the first row."
            answer: "-14"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Cofactor expansion along row 1: $3((-1)(-2)-4\\cdot2) - 1(2(-2)-4\\cdot0) + 0$. The first minor is $2-8=-6$, the second minor is $-4-0=-4$. So the determinant is $3(-6) - 1(-4) + 0 = -18 + 4 = -14$."
          - problem: "Compute $\\det\\begin{pmatrix}1&-2&3\\\\0&2&1\\\\2&0&-1\\end{pmatrix}$."
            answer: "-18"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Expand along the first row: $1(2(-1)-1\\cdot0) - (-2)(0(-1)-1\\cdot2) + 3(0\\cdot0-2\\cdot2)$. The minors are $-2$, $-2$ and $-8$. So the determinant is $1(-2) + 2(-2) + 3(-8) = -2 - 4 - 24 = -18$."
          - problem: "The matrix $\\begin{pmatrix}2&0&1\\\\1&x&3\\\\0&4&-1\\end{pmatrix}$ has determinant $-26$. Find the value of $x$."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Expand along the first row, which has a zero in the middle: $2(x(-1)-3\\cdot4) - 0 + 1(1\\cdot4-3\\cdot0)$. This gives $2(-x-12) + 4 = -2x - 20$. Set $-2x - 20 = -26$ and solve: $-2x = -6$, so $x = 3$."
          - problem: "Compute $\\det\\begin{pmatrix}1&3&-2\\\\0&-1&4\\\\2&1&0\\end{pmatrix}$ by expanding along the third column."
            answer: "16"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Cofactor expansion along column 3 with signs $-,+,-$: $-2(0\\cdot1-(-1)\\cdot2) - 4(1\\cdot1-3\\cdot2) + 0(1\\cdot1-3\\cdot0)$. The first minor is $0+2=2$, the second is $1-6=-5$. So the determinant is $-2(2) - 4(-5) + 0 = -4 + 20 = 16$."
        constraints: "entries in -4..4 with at least one zero per matrix; determinant in -30..30"
    diagnostic_exemplar:
      problem: 'Compute $\det\begin{pmatrix}1&0&2\\2&1&3\\0&1&1\end{pmatrix}$.'
      answer: "2"
      solution_sketch: 'Expand along row 1: $1(1 - 3) - 0 + 2(2 - 0) = -2 + 4 = 2$.'
    anki_seeds:
      - front: 'Determinant of a triangular matrix?'
        back: 'The product of the diagonal entries.'
        type: basic
      - front: 'In cofactor expansion, the sign attached to entry $(i, j)$ is...'
        back: '$(-1)^{i+j}$ (checkerboard pattern).'
        type: basic
      - front: 'The cofactor $C_{ij}$ equals the minor $M_{ij}$ times...'
        back: '$(-1)^{i+j}$.'
        type: basic

  - id: determinant-properties-cramers-rule
    name: Determinant Properties and Cramer's Rule
    core: true
    difficulty: 0.65
    drill: false
    answer_kind: numeric
    expected_time_secs: 180
    prerequisites:
      - id: determinants
        weight: 0.8
        key: true
      - id: matrix-inverses
        weight: 0.4
      - id: row-reduction-echelon-forms
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: Multiplicativity and scaling
        key_prerequisites: [determinants]
        exemplars:
          - problem: 'If $A$ and $B$ are $2 \times 2$ with $\det A = 3$ and $\det B = 2$, find $\det(AB)$.'
            answer: "6"
            solution_sketch: '$\det(AB) = \det A \cdot \det B$.'
          - problem: 'If $A$ is $2 \times 2$ with $\det A = 3$, find $\det(2A)$.'
            answer: "12"
            solution_sketch: '$\det(kA) = k^n \det A$ for $n \times n$; here $2^2 \cdot 3$.'
          - problem: 'If $\det A = 3$, find $\det(A^{-1})$.'
            answer: "1/3"
            solution_sketch: '$\det(A)\det(A^{-1}) = \det I = 1$.'
          - problem: "If $A$ and $B$ are $3 \\times 3$ matrices with $\\det A = -2$ and $\\det B = 5$, compute $\\det(AB)$."
            answer: "-10"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: the multiplicativity rule says $\\det(AB) = \\det A \\cdot \\det B$ for square matrices of the same size. Step 2: with $A$ and $B$ of size $3 \\times 3$, the full object is $\\det(AB) = (-2) \\cdot 5$. Step 3: the product is $-10$, so the answer is -10."
          - problem: "If $A$ is a $3 \\times 3$ matrix with $\\det A = 2$, find $\\det(-3A)$."
            answer: "-54"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: the scaling rule says $\\det(kA) = k^n \\det A$ for an $n \\times n$ matrix. Step 2: here $n = 3$ and $k = -3$, so $\\det(-3A) = (-3)^3 \\cdot 2$. Step 3: $(-3)^3 = -27$, hence $-27 \\cdot 2 = -54$, and the answer is -54."
          - problem: "If $A$ is a $2 \\times 2$ matrix with $\\det A = 4$, determine $\\det(3A^{-1})$."
            answer: "9/4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: the inverse rule gives $\\det(A^{-1}) = 1/\\det A = 1/4$. Step 2: the scaling rule with $n = 2$ and $k = 3$ gives $\\det(3A^{-1}) = 3^2 \\cdot (1/4) = 9/4$. Step 3: the answer is 9/4."
        constraints: "given determinants are small integers; sizes 2x2 or 3x3 (state the size)"
      - id: kp2
        name: Row operations and zero determinants
        key_prerequisites: [determinants]
        exemplars:
          - problem: 'Matrix $B$ is obtained from $A$ by swapping two rows, and $\det A = 5$. Find $\det B$.'
            answer: "-5"
            solution_sketch: 'A row swap flips the sign of the determinant.'
          - problem: '$B$ is obtained from $A$ by $R_2 \to R_2 + 4R_1$, and $\det A = 7$. Find $\det B$.'
            answer: "7"
            solution_sketch: 'Adding a multiple of one row to another leaves the determinant unchanged.'
          - problem: "Let $A = \\begin{pmatrix}2&5&1\\\\3&1&4\\\\2&5&1\\end{pmatrix}$. Compute $\\det A$ using the special row properties instead of full expansion."
            answer: "0"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: inspect the rows of $A$; row 1 is $(2,5,1)$ and row 3 is $(2,5,1)$, so two rows are identical. Step 2: apply the equal-rows property, which says a matrix with two equal rows has determinant $0$. Therefore $\\det A = 0$, so the answer is $0$."
          - problem: "Matrix $B$ is obtained from $A$ by the row operation $R_1 \\to 3R_1$, and $\\det A = 4$. Find $\\det B$."
            answer: "12"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: the operation $R_1 \\to 3R_1$ scales one row of $A$ by $3$; by the row-scaling rule this multiplies the determinant by $3$. Step 2: compute $\\det B = 3 \\cdot \\det A = 3 \\cdot 4 = 12$. The answer is $12$."
          - problem: "Swapping two rows of matrix $A$ gives matrix $B$, and $\\det B = -8$. Find $\\det A$."
            answer: "8"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: a row swap flips the sign of the determinant, so $\\det B = -\\det A$. Step 2: substitute $-8 = -\\det A$ and solve, giving $\\det A = 8$. The answer is $8$."
          - problem: "Matrix $B$ is obtained from $A$ by the row operation $R_3 \\to \\frac{1}{2}R_3$, and $\\det A = 10$. Find $\\det B$."
            answer: "5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: the operation $R_3 \\to \\frac{1}{2}R_3$ scales one row of $A$ by $\\frac{1}{2}$; by the row-scaling rule the determinant is multiplied by $\\frac{1}{2}$. Step 2: compute $\\det B = \\frac{1}{2} \\cdot \\det A = \\frac{1}{2} \\cdot 10 = 5$. The answer is $5$."
        constraints: "one row operation per problem; determinants stay small integers"
      - id: kp3
        name: "Cramer's rule for 2x2 systems"
        key_prerequisites: [determinants, row-reduction-echelon-forms]
        exemplars:
          - problem: 'Solve by Cramer''s rule: $2x + y = 7$, $x + 3y = 6$.'
            answer: "x = 3, y = 1"
            answer_contract: {"kind":"list","member":{"kind":"exact"},"ordered":false}
            solution_sketch: '$D = 6 - 1 = 5$; $D_x = 21 - 6 = 15$; $D_y = 12 - 7 = 5$; $x = 15/5$, $y = 5/5$.'
          - problem: 'Solve by Cramer''s rule: $x + 2y = 4$, $3x + y = 7$.'
            answer: "x = 2, y = 1"
            answer_contract: {"kind":"list","member":{"kind":"exact"},"ordered":false}
            solution_sketch: '$D = 1 - 6 = -5$; $D_x = 4 - 14 = -10$; $D_y = 7 - 12 = -5$.'
        constraints: "D must be nonzero; integer solutions in -4..4"
    diagnostic_exemplar:
      problem: 'Solve by Cramer''s rule: $3x + y = 9$, $x + 2y = 8$; then state $\det(2A)$ for the coefficient matrix $A$.'
      answer: 'x = 2, y = 3; det(2A) = 20'
      answer_contract: {kind: none}
      solution_sketch: '$\det A = 5$, $\det A_1 = 18 - 8 = 10$, $\det A_2 = 24 - 9 = 15$, so $x = 2$, $y = 3$; and $\det(2A) = 2^2\det A = 20$.'
    anki_seeds:
      - front: '$\det(AB) = $ ?'
        back: '$\det A \cdot \det B$.'
        type: basic
      - front: 'For an $n \times n$ matrix, $\det(kA) = $ ?'
        back: '$k^n \det A$.'
        type: basic
      - front: 'Effect of the three row operations on the determinant?'
        back: 'Swap: sign flips; scale a row by $k$: determinant scales by $k$; add a multiple of another row: unchanged.'
        type: basic

  - id: determinants-row-reduction
    name: Determinants via Row Reduction
    core: false                # alternative computation of an already-taught determinant; terminal
    difficulty: 0.65
    drill: false
    answer_kind: numeric
    expected_time_secs: 180
    prerequisites:
      - id: determinant-properties-cramers-rule
        weight: 0.7
        key: true
      - id: row-reduction-echelon-forms
        weight: 0.5
    knowledge_points:
      - id: kp1
        name: Tracking row operations
        key_prerequisites: [determinant-properties-cramers-rule]
        exemplars:
          - problem: '$B$ is obtained from $A$ by $R_1 \to 3R_1$, and $\det A = 2$. Find $\det B$.'
            answer: "6"
            solution_sketch: 'Scaling a row by $3$ scales the determinant by $3$.'
          - problem: '$B$ is obtained from $A$ by one row swap followed by $R_3 \to R_3 - 2R_1$, and $\det A = 4$. Find $\det B$.'
            answer: "-4"
            solution_sketch: 'The swap flips the sign; the replacement changes nothing.'
          - problem: "$B$ is obtained from $A$ by $R_2 \\to 5R_2$, and $\\det A = 3$. Find $\\det B$."
            answer: "15"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The single operation is $R_2 \\to 5R_2$, a scaling of row 2 by the factor 5. Scaling rule: multiplying one row by $c$ multiplies the determinant by $c$. Thus $\\det B = 5 \\cdot 3 = 15$."
          - problem: "$B$ is obtained from $A$ by a swap of rows 2 and 3 followed by $R_1 \\to 2R_1$, and $\\det A = 7$. Find $\\det B$."
            answer: "-14"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The operations are a row swap and the scaling $R_1 \\to 2R_1$ applied to a matrix with $\\det A = 7$. Swap rule: a swap of two rows multiplies the determinant by $-1$, giving $-7$. Scaling rule: the factor 2 doubles the determinant, so $\\det B = -14$."
          - problem: "$B$ is obtained from $A$ by $R_1 \\to -3R_1$, and $\\det B = -12$. Find $\\det A$."
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The operation $R_1 \\to -3R_1$ scales row 1 by $-3$, so the scaling rule gives $\\det B = -3 \\det A$. Reverse the relation: $\\det A = \\det B / (-3) = -12 / (-3)$. Therefore $\\det A = 4$."
          - problem: "$B$ is obtained from $A$ by $R_2 \\to -2R_2$ followed by $R_3 \\to R_3 - 5R_1$, and $\\det A = 5$. Find $\\det B$."
            answer: "-10"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The operations are the scaling $R_2 \\to -2R_2$ and the replacement $R_3 \\to R_3 - 5R_1$ on a matrix with $\\det A = 5$. Scaling rule: the factor $-2$ turns $\\det A = 5$ into $-10$. Replacement rule: adding a multiple of another row changes nothing, so $\\det B = -10$."
        constraints: "at most two operations per problem; starting determinants are small integers"
      - id: kp2
        name: Computing determinants by elimination
        key_prerequisites: [determinant-properties-cramers-rule, row-reduction-echelon-forms]
        exemplars:
          - problem: 'Compute $\det\begin{pmatrix}1&2&1\\2&5&3\\1&3&4\end{pmatrix}$ by row reduction.'
            answer: "2"
            solution_sketch: '$R_2 - 2R_1$ and $R_3 - R_1$ give rows $(0,1,1)$ and $(0,1,3)$; then $R_3 - R_2$ gives $(0,0,2)$. Replacements do not change the determinant, so it is $1 \cdot 1 \cdot 2 = 2$.'
          - problem: 'Compute $\det\begin{pmatrix}1&1&1\\1&2&2\\1&2&3\end{pmatrix}$ by row reduction.'
            answer: "1"
            solution_sketch: 'Subtracting $R_1$ from the others, then $R_2$ from $R_3$, leaves a triangular matrix with diagonal $1, 1, 1$.'
          - problem: "Use elimination to find $\\det\\begin{pmatrix}1&2&4\\\\2&3&7\\\\1&4&9\\end{pmatrix}$."
            answer: "-3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The matrix is [[1,2,4],[2,3,7],[1,4,9]]. Step 1 (row replacement rule): $R_2 - 2R_1$ gives $(0,-1,-1)$ and $R_3 - R_1$ gives $(0,2,5)$. Step 2 (row replacement rule): $R_3 + 2R_2$ gives $(0,0,3)$. Replacements do not change the determinant, so the determinant is $1 \\cdot (-1) \\cdot 3 = -3$."
          - problem: "Find $\\det\\begin{pmatrix}1&2&1\\\\3&5&4\\\\2&3&5\\end{pmatrix}$ using only row replacements."
            answer: "-2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The matrix is [[1,2,1],[3,5,4],[2,3,5]]. Step 1 (row replacement rule): $R_2 - 3R_1$ gives $(0,-1,1)$ and $R_3 - 2R_1$ gives $(0,-1,3)$. Step 2 (row replacement rule): $R_3 - R_2$ gives $(0,0,2)$. Since replacements preserve the determinant, the determinant is $1 \\cdot (-1) \\cdot 2 = -2$."
          - problem: "The determinant of $\\begin{pmatrix}1&2&3\\\\2&5&a\\\\1&3&5\\end{pmatrix}$ is $0$. Find the value of $a$."
            answer: "8"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The matrix is [[1,2,3],[2,5,a],[1,3,5]]. Step 1 (row replacement rule): $R_2 - 2R_1$ gives $(0,1,a-6)$ and $R_3 - R_1$ gives $(0,1,2)$. Step 2 (row replacement rule): $R_3 - R_2$ gives $(0,0,8-a)$. The determinant is $1 \\cdot 1 \\cdot (8-a)$, so $8-a=0$ and $a=8$."
          - problem: "Use row replacements to compute $\\det\\begin{pmatrix}1&2&3\\\\2&4&6\\\\3&7&10\\end{pmatrix}$."
            answer: "0"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The matrix is [[1,2,3],[2,4,6],[3,7,10]]. Step 1 (row replacement rule): $R_2 - 2R_1$ gives $(0,0,0)$ and $R_3 - 3R_1$ gives $(0,1,1)$. A zero row appears, so the matrix is singular. Replacements do not change the determinant, so the determinant is $0$."
        constraints: "3x3 with a 1 in the top-left; elimination uses only replacements so the determinant is the diagonal product"
      - id: kp3
        name: Factoring out common row factors
        key_prerequisites: [determinant-properties-cramers-rule]
        exemplars:
          - problem: 'Compute $\det\begin{pmatrix}2&4\\1&3\end{pmatrix}$ by first factoring $2$ out of row 1.'
            answer: "2"
            solution_sketch: '$2 \det\begin{pmatrix}1&2\\1&3\end{pmatrix} = 2(3 - 2) = 2$.'
          - problem: 'Row 1 of $\begin{pmatrix}3&6&9\\1&0&2\\2&1&1\end{pmatrix}$ has a common factor. Factoring it out writes the determinant as $c\det M$ with $M$ integer-entried and first row $(1, 2, 3)$; state $c$.'
            answer: "3"
            solution_sketch: 'Row 1 is $3(1, 2, 3)$; pulling the $3$ out of that row scales the determinant by $3$, so $c = 3$ and $M = \begin{pmatrix}1&2&3\\1&0&2\\2&1&1\end{pmatrix}$.'
          - problem: "Compute $\\det\\begin{pmatrix}3&9\\\\2&5\\end{pmatrix}$ by first factoring $3$ out of row 1."
            answer: "-3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Row 1 is $3(1, 3)$. By the row-factor property, factoring $3$ from one row scales the determinant by $3$, so the determinant is $3\\det\\begin{pmatrix}1&3\\\\2&5\\end{pmatrix}$. The $2\\times 2$ determinant is $5 - 6 = -1$. The determinant equals $3 \\cdot (-1) = -3$."
          - problem: "Compute $\\det\\begin{pmatrix}3&6&12\\\\2&1&4\\\\1&0&3\\end{pmatrix}$ by first factoring the common factor out of row 1."
            answer: "-15"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Row 1 is $3(1, 2, 4)$. Factoring $3$ out of row 1 gives $\\det = 3\\det\\begin{pmatrix}1&2&4\\\\2&1&4\\\\1&0&3\\end{pmatrix}$. Cofactor expansion along row 1: $1(3 - 0) - 2(6 - 4) + 4(0 - 1) = 3 - 4 - 4 = -5$. The determinant is $3 \\cdot (-5) = -15$."
          - problem: "Let $M = \\begin{pmatrix}1&5\\\\2&3\\end{pmatrix}$ with $\\det M = -7$, and let $A = \\begin{pmatrix}2&10\\\\2&3\\end{pmatrix}$. Use the row-factor property to find $\\det A$."
            answer: "-14"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Compare the two matrices: row 1 of $A$ is $2$ times row 1 of $M$, and the other rows match. The row-factor property gives $\\det A = 2 \\det M$. With $\\det M = -7$, the determinant is $2 \\cdot (-7) = -14$."
          - problem: "Compute $\\det\\begin{pmatrix}1&2&1\\\\0&1&3\\\\6&3&3\\end{pmatrix}$ by first factoring $3$ out of row 3."
            answer: "24"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Row 3 is $3(2, 1, 1)$. Factoring $3$ out of row 3 gives $\\det = 3\\det\\begin{pmatrix}1&2&1\\\\0&1&3\\\\2&1&1\\end{pmatrix}$. Cofactor expansion along row 1: $1(1 - 3) - 2(0 - 6) + 1(0 - 2) = -2 + 12 - 2 = 8$. The determinant is $3 \\cdot 8 = 24$."
        constraints: "one row with an obvious common factor of 2 or 3"
    diagnostic_exemplar:
      problem: 'Compute $\det\begin{pmatrix}2&4&6\\1&3&2\\0&1&4\end{pmatrix}$ by first factoring $2$ out of row $1$ and then eliminating.'
      answer: '10'
      solution_sketch: 'Factoring gives $2\det\begin{pmatrix}1&2&3\\1&3&2\\0&1&4\end{pmatrix}$; $R_2 \to R_2 - R_1$ makes it triangular-ish with determinant $5$, so the answer is $10$.'
    anki_seeds:
      - front: 'Row-reduction recipe for determinants: reduce to triangular form, then the determinant equals...'
        back: 'the diagonal product, corrected by $(-1)$ per swap and by any factors pulled out of rows.'
        type: basic
      - front: 'Which row operation leaves the determinant unchanged?'
        back: 'Adding a multiple of one row to another (replacement).'
        type: basic

  - id: determinants-area-volume
    name: Determinants as Area and Volume
    core: false                # geometric interpretation leaf; terminal
    difficulty: 0.6
    drill: false
    answer_kind: numeric
    expected_time_secs: 150
    prerequisites:
      - id: determinants-2x2
        weight: 0.7
        key: true
      - id: determinants
        weight: 0.5
    knowledge_points:
      - id: kp1
        name: Area of a parallelogram
        key_prerequisites: [determinants-2x2]
        exemplars:
          - problem: 'Find the area of the parallelogram spanned by $(3, 1)$ and $(1, 2)$.'
            answer: "5"
            solution_sketch: '$|\det| = |6 - 1| = 5$.'
          - problem: 'Find the area of the parallelogram spanned by $(2, 0)$ and $(1, 3)$.'
            answer: "6"
            solution_sketch: '$|6 - 0| = 6$.'
          - problem: 'Find the area of the triangle with vertices $(0,0)$, $(4,1)$, $(2,3)$.'
            answer: "5"
            solution_sketch: 'Half the parallelogram area: $\frac{1}{2}|\det\begin{pmatrix}4&1\\2&3\end{pmatrix}| = \frac{1}{2}|12 - 2| = 5$.'
          - problem: "Find the area of the triangle with vertices $(0,0)$, $(1,4)$, $(3,1)$."
            answer: "11/2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Put the two edge vectors $(1,4)$ and $(3,1)$ into a 2x2 matrix. Its determinant is $1 \\cdot 1 - 4 \\cdot 3 = -11$. A triangle has half the parallelogram area, so take half of $|-11|$. The area is 11/2."
          - problem: "A triangle has vertices $(2,1)$, $(4,3)$, $(3,5)$. Find its area."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Subtract the vertex $(2,1)$ from the other two to get edge vectors $(2,2)$ and $(1,4)$. The 2x2 determinant is $2 \\cdot 4 - 2 \\cdot 1 = 6$. The triangle area is half the parallelogram area, so $6/2 = 3$. The area is 3."
          - problem: "The parallelogram spanned by $(3,1)$ and $(1,y)$ has area $10$, where $y$ is an integer with $-5 \\le y \\le 5$. Find the integer value of $y$."
            answer: "-3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The area is the absolute value of the 2x2 determinant with columns $(3,1)$ and $(1,y)$, namely $|3y - 1|$. Set $|3y - 1| = 10$, so $3y = 11$ or $3y = -9$. Only $y = -3$ is an integer in the allowed range. The answer is -3."
        constraints: "integer vectors with entries in -5..5; areas are integers or half-integers"
      - id: kp2
        name: Volume of a parallelepiped
        key_prerequisites: [determinants]
        exemplars:
          - problem: 'Find the volume of the parallelepiped spanned by $(1, 0, 1)$, $(0, 2, 0)$, $(1, 1, 3)$.'
            answer: "4"
            solution_sketch: '$\det\begin{pmatrix}1&0&1\\0&2&0\\1&1&3\end{pmatrix} = 1(6 - 0) + 1(0 - 2) = 4$; the volume is $|4| = 4$.'
          - problem: 'Find the volume of the box spanned by $(2, 0, 0)$, $(0, 3, 0)$, $(0, 0, 4)$.'
            answer: "24"
            solution_sketch: 'Diagonal matrix: $|2 \cdot 3 \cdot 4| = 24$.'
          - problem: "Find the volume of the parallelepiped spanned by $(1, 2, 0)$, $(0, 1, 3)$, $(2, 0, 1)$."
            answer: "13"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Set up the 3x3 matrix with the three spanning vectors as rows: [[1,2,0],[0,1,3],[2,0,1]]. Cofactor expansion along the first row gives det = 1*(1*1 - 0*3) - 2*(0*1 - 3*2) + 0 = 1 + 12 = 13. The volume is the absolute value of the determinant. The volume is 13."
          - problem: "Find the volume of the parallelepiped spanned by $(3, 0, -1)$, $(0, 2, 0)$, $(-1, 0, 3)$."
            answer: "16"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Set up the 3x3 matrix with the three spanning vectors as rows: [[3,0,-1],[0,2,0],[-1,0,3]]. Expanding along the second row gives det = 2 * (3*3 - (-1)*(-1)) = 2 * (9 - 1) = 16. The volume is the absolute value of the determinant. The volume is 16."
          - problem: "A crystal cell is spanned by the edge vectors $(2, 1, 0)$, $(0, 1, 2)$, $(1, 0, 3)$. Find the volume of the cell."
            answer: "8"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Set up the 3x3 matrix with the three edge vectors as rows: [[2,1,0],[0,1,2],[1,0,3]]. Expanding along the first row gives det = 2*(1*3 - 2*0) - 1*(0*3 - 2*1) + 0 = 6 + 2 = 8. The volume is the absolute value of the determinant. The volume is 8."
          - problem: "The parallelepiped spanned by $(2, 0, 1)$, $(0, 1, 0)$, $(a, 0, 3)$ has volume $9$, where $a$ is an integer with $-3 \\le a \\le 4$. Find the value of $a$."
            answer: "-3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Set up the 3x3 matrix: [[2,0,1],[0,1,0],[a,0,3]]. Expanding along the second row gives det = 1*(2*3 - 1*a) = 6 - a. The volume condition is abs(6 - a) = 9, so a = -3 or a = 15. Only a = -3 lies in the allowed range. The value of a is -3."
        constraints: "3x3 with entries in -3..4 and several zeros; volumes in 1..30"
      - id: kp3
        name: How linear maps scale area
        key_prerequisites: [determinants-2x2]
        exemplars:
          - problem: '$T$ has matrix $\begin{pmatrix}2&1\\0&3\end{pmatrix}$. A region has area $5$; what is the area of its image under $T$?'
            answer: "30"
            solution_sketch: 'Areas scale by $|\det| = |6| = 6$, so $6 \cdot 5 = 30$.'
          - problem: '$T$ has matrix $\begin{pmatrix}0&1\\1&0\end{pmatrix}$. Compute $\det T$, then say whether $T$ preserves area and whether it preserves orientation.'
            answer: "-1"
            solution_sketch: '$\det = -1$: the area scale factor is $|-1| = 1$, so area is preserved, but the negative sign means orientation is reversed.'
          - problem: "A linear map $T$ has matrix $\\begin{pmatrix}3&-1\\\\1&2\\end{pmatrix}$. A triangle has area $4$. Find the area of the image of the triangle under $T$."
            answer: "28"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Compute the determinant of the matrix by the 2x2 rule: $\\det T = 3 \\cdot 2 - (-1) \\cdot 1 = 7$. Areas scale by the absolute value of the determinant, so the scale factor is $|7| = 7$. The image area is $4 \\cdot 7$, which is 28."
          - problem: "A linear map has matrix $\\begin{pmatrix}2&0\\\\0&3\\end{pmatrix}$. The image of a certain region under the map has area $24$. Find the area of the original region."
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Compute the determinant of the diagonal matrix: $\\det = 2 \\cdot 3 - 0 \\cdot 0 = 6$. Areas scale by $|\\det| = 6$, so the image area is 6 times the original area. Solve $6 \\cdot A = 24$: the original area is 4."
          - problem: "A linear map has matrix $\\begin{pmatrix}-1&0\\\\0&2\\end{pmatrix}$. Give the area scale factor of the map, and state whether the map preserves or reverses orientation."
            answer: "verdict = reversed; scale = 2"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["preserved"], ["reversed"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "scale"}]}
            solution_sketch: "Compute the determinant by the 2x2 rule: $\\det = (-1) \\cdot 2 - 0 \\cdot 0 = -2$. The area scale factor is the absolute value $|{-2}| = 2$; choosing $-2$ confuses scale with determinant. The negative sign means orientation is reversed, not preserved. The verdict is reversed and the scale is 2."
          - problem: "A linear map has matrix $\\begin{pmatrix}1&0&1\\\\0&2&0\\\\1&0&3\\end{pmatrix}$. A parallelepiped has volume $5$. Find the volume of its image under the map."
            answer: "20"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Compute the 3x3 determinant by expanding along the second row: $\\det = 2 \\cdot (1 \\cdot 3 - 1 \\cdot 1) = 2 \\cdot 2 = 4$. Volumes scale by $|\\det| = 4$. The image volume is $5 \\cdot 4$, which is 20."
        constraints: "matrices with small integer determinants; ask for image area or orientation"
    diagnostic_exemplar:
      problem: 'A parallelepiped is spanned by $(2, 0, 1)$, $(1, 3, 0)$, and $(0, 1, 2)$. Find the volume of its image under the linear map with matrix $\begin{pmatrix}2&0&0\\0&1&0\\0&0&3\end{pmatrix}$.'
      answer: '78'
      solution_sketch: 'The parallelepiped has volume $|\det| = 13$; the map multiplies volumes by $|\det| = 6$, giving $13 \cdot 6 = 78$.'
    anki_seeds:
      - front: 'Geometric meaning of $|\det|$ for a $2 \times 2$ matrix?'
        back: 'The area of the parallelogram spanned by its columns (and the factor by which the map scales areas).'
        type: basic
      - front: 'What does a negative determinant mean geometrically?'
        back: 'The map reverses orientation.'
        type: basic

  - id: characteristic-polynomial
    name: The Characteristic Polynomial
    core: true
    difficulty: 0.65
    drill: false
    answer_kind: numeric
    expected_time_secs: 180
    prerequisites:
      - id: determinants-2x2
        weight: 0.7
        key: true
      - id: quadratic-formula
        weight: 0.5
        key: true
      - id: polynomial-multiplication
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: Setting up det(A - lambda I)
        key_prerequisites: [determinants-2x2, polynomial-multiplication]
        exemplars:
          - problem: "Let A = [[2,5],[1,3]]. Find the characteristic polynomial det(A - xI) as a polynomial in x."
            answer: "x^2 - 5x + 1"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "Step 1: form A - xI = [[2-x,5],[1,3-x]]. Step 2: expand the 2x2 determinant: (2-x)(3-x) - 5. Step 3: multiply polynomials: 6 - 5x + x^2 - 5 = x^2 - 5x + 1. The characteristic polynomial is x^2 - 5x + 1."
          - problem: "Let A = [[4,1],[3,2]]. Find the characteristic polynomial det(A - xI) as a polynomial in x."
            answer: "x^2 - 6x + 5"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "Step 1: form A - xI = [[4-x,1],[3,2-x]]. Step 2: expand the determinant: (4-x)(2-x) - 3. Step 3: multiply: 8 - 6x + x^2 - 3 = x^2 - 6x + 5. The characteristic polynomial is x^2 - 6x + 5."
          - problem: "Let A = [[-1,2],[4,3]]. Find the characteristic polynomial det(A - tI) as a polynomial in t."
            answer: "t^2 - 2t - 11"
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: "Step 1: form A - tI = [[-1-t,2],[4,3-t]]. Step 2: expand the determinant: (-1-t)(3-t) - 8. Step 3: multiply: -3 - 2t + t^2 - 8 = t^2 - 2t - 11. The characteristic polynomial is t^2 - 2t - 11."
          - problem: "For the matrix B = [[0,3],[2,1]], compute the characteristic polynomial det(B - xI) as a polynomial in x."
            answer: "x^2 - x - 6"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "Step 1: form B - xI = [[-x,3],[2,1-x]]. Step 2: expand the determinant: (-x)(1-x) - 6. Step 3: multiply: -x + x^2 - 6 = x^2 - x - 6. The characteristic polynomial is x^2 - x - 6."
          - problem: "A 2x2 matrix A = [[a,1],[1,2]] has characteristic polynomial det(A - xI) = x^2 - 5x + 5. Find the value of a."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: form det(A - xI) = (a-x)(2-x) - 1. Step 2: expand by polynomial multiplication: x^2 - (a+2)x + (2a - 1). Step 3: match the constant and x terms to x^2 - 5x + 5: a+2=5 and 2a-1=5. Both equations give a=3. The value is 3."
          - problem: "A 2x2 matrix A = [[4,b],[2,1]] has characteristic polynomial det(A - xI) = x^2 - 5x + 6. Find the value of b."
            answer: "-1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: form det(A - xI) = (4-x)(1-x) - 2b. Step 2: expand: x^2 - 5x + (4 - 2b). Step 3: match the constant term to x^2 - 5x + 6: 4 - 2b = 6. Solve: -2b = 2, so b = -1. The value is -1."
        constraints: "2x2 integer matrices; polynomial coefficients in -12..12"
      - id: kp2
        name: Eigenvalues as roots
        key_prerequisites: [determinants-2x2, quadratic-formula]
        exemplars:
          - problem: 'Find the eigenvalues of $A = \begin{pmatrix}3&2\\1&4\end{pmatrix}$.'
            answer: "2 and 5"
            answer_contract: {"kind":"list","member":{"kind":"exact"},"ordered":false}
            solution_sketch: '$\lambda^2 - 7\lambda + 10 = (\lambda - 2)(\lambda - 5)$.'
          - problem: 'Find the eigenvalues of $A = \begin{pmatrix}1&3\\2&2\end{pmatrix}$.'
            answer: "4 and -1"
            answer_contract: {"kind":"list","member":{"kind":"exact"},"ordered":false}
            solution_sketch: '$\lambda^2 - 3\lambda - 4 = (\lambda - 4)(\lambda + 1)$.'
          - problem: 'Find the eigenvalues of $A = \begin{pmatrix}2&3\\4&1\end{pmatrix}$.'
            answer: "5 and -2"
            answer_contract: {"kind":"list","member":{"kind":"exact"},"ordered":false}
            solution_sketch: '$\lambda^2 - 3\lambda - 10 = (\lambda - 5)(\lambda + 2)$.'
        constraints: "2x2 with integer spectra in -4..6; characteristic polynomial factors over the integers"
      - id: kp3
        name: Trace, determinant, and triangular shortcuts
        key_prerequisites: [determinants-2x2]
        exemplars:
          - problem: 'Find the eigenvalues of the triangular matrix $\begin{pmatrix}4&7\\0&-2\end{pmatrix}$.'
            answer: "4 and -2"
            answer_contract: {"kind":"list","member":{"kind":"exact"},"ordered":false}
            solution_sketch: 'For a triangular matrix, the eigenvalues are the diagonal entries.'
          - problem: 'For a $2 \times 2$ matrix, the characteristic polynomial is $\lambda^2 - (\mathrm{tr}\,A)\lambda + \det A$. Use this to find the eigenvalues of $A = \begin{pmatrix}6&2\\2&3\end{pmatrix}$.'
            answer: "2 and 7"
            answer_contract: {"kind":"list","member":{"kind":"exact"},"ordered":false}
            solution_sketch: 'Trace $9$, determinant $18 - 4 = 14$: $\lambda^2 - 9\lambda + 14 = (\lambda - 2)(\lambda - 7)$.'
        constraints: "triangular matrices or trace/det setups; integer eigenvalues"
    diagnostic_exemplar:
      problem: 'Find the eigenvalues of $A = \begin{pmatrix}5&4\\2&3\end{pmatrix}$.'
      answer: "1 and 7"
      answer_contract: {"kind":"list","member":{"kind":"exact"},"ordered":false}
      solution_sketch: 'Trace $8$, determinant $15 - 8 = 7$: $\lambda^2 - 8\lambda + 7 = (\lambda - 1)(\lambda - 7)$.'
    anki_seeds:
      - front: 'The eigenvalues of $A$ are the roots of which equation?'
        back: 'The characteristic equation $\det(A - \lambda I) = 0$.'
        type: basic
      - front: 'For a $2 \times 2$ matrix, the characteristic polynomial is $\lambda^2 - (\mathrm{tr}\,A)\lambda + {{c1::\det A}}$.'
        back: '$\det A$'
        type: cloze
      - front: 'Eigenvalues of a triangular matrix?'
        back: 'Its diagonal entries.'
        type: basic

  - id: finding-eigenvectors
    name: Finding Eigenvectors
    core: true
    difficulty: 0.65
    drill: false
    answer_kind: numeric
    expected_time_secs: 180
    prerequisites:
      - id: characteristic-polynomial
        weight: 0.7
        key: true
      - id: solution-sets-free-variables
        weight: 0.6
        key: true
    knowledge_points:
      - id: kp1
        name: Verifying eigenvectors
        key_prerequisites: [characteristic-polynomial]
        exemplars:
          - problem: "Verify that $\\mathbf{v} = (2, 1)$ is an eigenvector of $A = \\begin{pmatrix}-1&-2\\\\0&-2\\end{pmatrix}$ and find its eigenvalue."
            answer: "-2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (definition of eigenvector): compute the full product for $A = \\begin{pmatrix}-1&-2\\\\0&-2\\end{pmatrix}$ and $\\mathbf{v} = (2, 1)$: $A\\mathbf{v} = (-1\\cdot2 + (-2)\\cdot1,\\; 0\\cdot2 + (-2)\\cdot1) = (-4, -2)$. Step 2 (scalar-multiple test): $(-4, -2) = -2\\,(2, 1)$, so $\\mathbf{v}$ is an eigenvector and the scalar is the eigenvalue. The eigenvalue is -2."
          - problem: "Verify that $\\mathbf{v} = (1, -1)$ is an eigenvector of $A = \\begin{pmatrix}1&2\\\\2&1\\end{pmatrix}$ and find its eigenvalue."
            answer: "-1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (matrix-vector product): for $A = \\begin{pmatrix}1&2\\\\2&1\\end{pmatrix}$ and $\\mathbf{v} = (1, -1)$, $A\\mathbf{v} = (1\\cdot1 + 2\\cdot(-1),\\; 2\\cdot1 + 1\\cdot(-1)) = (-1, 1)$. Step 2 (scalar-multiple test): $(-1, 1) = -1\\,(1, -1)$, so $\\mathbf{v}$ is an eigenvector and the scalar is the eigenvalue. The eigenvalue is -1."
          - problem: "Let $A = \\begin{pmatrix}3&1\\\\1&3\\end{pmatrix}$ and $\\mathbf{v} = (1, 0)$. Compute $A\\mathbf{v}$ and use the test $A\\mathbf{v} = \\lambda\\mathbf{v}$ to decide whether $\\mathbf{v}$ is an eigenvector of $A$. State the verdict and the second entry of $A\\mathbf{v}$, in that order."
            answer: "verdict = no; b = 1"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["yes"], ["no"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "b"}]}
            solution_sketch: "Step 1 (matrix-vector product): $A\\mathbf{v} = (3\\cdot1 + 1\\cdot0,\\; 1\\cdot1 + 3\\cdot0) = (3, 1)$. Step 2 (eigenvector test): an eigenvector $(1, 0)$ would need $A\\mathbf{v} = \\lambda(1, 0) = (\\lambda, 0)$, but the second entry of $A\\mathbf{v}$ is $1$, not $0$, so the scalar-multiple test fails; the option yes ignores this failed test. Step 3 (read off the entry): the second entry of $A\\mathbf{v}$ is $1$. Answer: verdict = no; b = 1."
          - problem: "Let $A = \\begin{pmatrix}2&a\\\\1&3\\end{pmatrix}$, where $a$ is a real number. The vector $\\mathbf{v} = (1, 1)$ is an eigenvector of $A$. Find the value of $a$."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (eigenvector equation, second row): the second entry of $A(1, 1)$ is $1\\cdot1 + 3\\cdot1 = 4$, so the eigenvalue must be $\\lambda = 4$. Step 2 (eigenvector equation, first row): the first entry is $2\\cdot1 + a\\cdot1 = 2 + a$, and the condition $A\\mathbf{v} = \\lambda\\mathbf{v}$ forces $2 + a = 4$. Step 3 (solve the linear equation): $a = 2$, so the answer is 2."
          - problem: "The matrix $A = \\begin{pmatrix}1&4\\\\2&3\\end{pmatrix}$ has eigenvalues $5$ and $-1$. Which of the four candidate vectors is an eigenvector of $A$ for the eigenvalue $5$?"
            answer: "(1, 1)"
            answer_contract: {"kind": "label", "options": [["(1, 1)"], ["(1, -1)"], ["(2, 1)"], ["(1, 2)"]]}
            solution_sketch: "Step 1 (definition): an eigenvector for the eigenvalue 5 satisfies $A\\mathbf{v} = 5\\mathbf{v}$. Step 2 (test the candidate $(1, 1)$): $A(1,1) = (1 + 4,\\; 2 + 3) = (5, 5) = 5(1, 1)$, so $(1, 1)$ works. Step 3 (errors of the wrong options): $A(1,-1) = (1 - 4,\\; 2 - 3) = (-3, -1)$, not a multiple of $(1, -1)$, so the option $(1, -1)$ fails the scalar-multiple test; $A(2,1) = (6, 7)$ while $5(2,1) = (10, 5)$, so $(2, 1)$ comes from scaling only the first entry; $A(1,2) = (9, 8)$ while $5(1,2) = (5, 10)$, so $(1, 2)$ comes from confusing rows and columns. The eigenvector of $A$ for the eigenvalue 5 is (1, 1)."
          - problem: "The matrix $A = \\begin{pmatrix}2&1\\\\2&3\\end{pmatrix}$ has eigenvalues $1$ and $4$. Compute $A(1, 2)$ and determine which eigenvalue the vector $(1, 2)$ belongs to. Give the eigenvalue $\\lambda$ such that $A(1, 2) = \\lambda(1, 2)$."
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (matrix-vector product): $A(1, 2) = (2\\cdot1 + 1\\cdot2,\\; 2\\cdot1 + 3\\cdot2) = (4, 8)$. Step 2 (scalar-multiple test against the given eigenvalues): $(4, 8) = 4\\,(1, 2)$, a scalar multiple of the vector, and the scalar $4$ is one of the eigenvalues of $A$, while $\\lambda = 1$ would require $A(1, 2) = (1, 2)$. Step 3 (conclusion): the vector belongs to the scalar found in the test. The eigenvalue is 4."
        constraints: "2x2 integer matrices; eigenvalues are integers in -3..5"
      - id: kp2
        name: Solving (A - lambda I)v = 0
        key_prerequisites: [characteristic-polynomial, solution-sets-free-variables]
        exemplars:
          - problem: "Let $A = \\begin{pmatrix}4&1\\\\2&5\\end{pmatrix}$, and $\\lambda = 6$ is an eigenvalue of $A$. Solve $(A - 6I)\\mathbf{v} = \\mathbf{0}$ for an eigenvector, and give the eigenvector with whole-number entries, no common factor, and positive first entry, as (x, y)."
            answer: "(1, 2)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "Full object: $A - 6I = \\begin{pmatrix}-2&1\\\\2&-1\\end{pmatrix}$. Row reduction (solution sets and free variables) gives the single equation $-2x + y = 0$, so $y = 2x$ with $x$ free. Verify by computing $A\\mathbf{v}$: $A(1,2) = (6,12) = 6(1,2)$. The answer is (1, 2)."
          - problem: "The matrix $A = \\begin{pmatrix}2&-1\\\\1&4\\end{pmatrix}$ has the repeated eigenvalue $\\lambda = 3$. Solve $(A - 3I)\\mathbf{v} = \\mathbf{0}$ and give an eigenvector with whole-number entries, no common factor, and positive first entry, as (x, y)."
            answer: "(1, -1)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "Full object: $A - 3I = \\begin{pmatrix}-1&-1\\\\1&1\\end{pmatrix}$ (form the shifted matrix). Row reduction (solution sets and free variables) leaves one free variable, and the equation $x + y = 0$ gives $x = -y$. Verify: $A(1,-1) = (3,-3) = 3(1,-1)$, so $\\mathbf{v}$ satisfies $A\\mathbf{v} = \\lambda\\mathbf{v}$. The answer is (1, -1)."
          - problem: "For $A = \\begin{pmatrix}1&4\\\\2&3\\end{pmatrix}$, $\\lambda = -1$ is an eigenvalue. Find a nonzero solution of $(A + I)\\mathbf{v} = \\mathbf{0}$ and give it with whole-number entries, no common factor, and positive first entry, as (x, y)."
            answer: "(2, -1)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "Full object: $A - (-1)I = A + I = \\begin{pmatrix}2&4\\\\2&4\\end{pmatrix}$ (form the shifted matrix). Row reduction (solution sets and free variables) gives $2x + 4y = 0$, so $x = -2y$; taking $y = -1$ makes the first entry positive. Verify: $A(2,-1) = (-2,1) = -1(2,-1)$. The answer is (2, -1)."
          - problem: "Let $A = \\begin{pmatrix}6&2\\\\3&7\\end{pmatrix}$, for which $\\lambda = 9$ is an eigenvalue. Determine an eigenvector by solving $(A - 9I)\\mathbf{v} = \\mathbf{0}$, and give it with whole-number entries, no common factor, and positive first entry, as (x, y)."
            answer: "(2, 3)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "Full object: $A - 9I = \\begin{pmatrix}-3&2\\\\3&-2\\end{pmatrix}$ (form the shifted matrix). Row reduction (solution sets and free variables) gives $-3x + 2y = 0$, so $y = \\frac{3x}{2}$; taking $x = 2$ gives whole-number entries with no common factor. Verify: $A(2,3) = (18,27) = 9(2,3)$. The answer is (2, 3)."
          - problem: "The upper triangular matrix $A = \\begin{pmatrix}1&2&3\\\\0&2&0\\\\0&0&1\\end{pmatrix}$ has $\\lambda = 2$ as an eigenvalue. Solve $(A - 2I)\\mathbf{v} = \\mathbf{0}$ for $\\mathbf{v} = (x, y, z)$ and give the eigenvector with whole-number entries, no common factor, and positive first entry, as (x, y, z)."
            answer: "(2, 1, 0)"
            answer_contract: {"arity": 3, "kind": "coordinates"}
            solution_sketch: "Full object: $A - 2I = \\begin{pmatrix}-1&2&3\\\\0&0&0\\\\0&0&-1\\end{pmatrix}$ (form the shifted matrix). Row reduction (solution sets and free variables): the third row forces $z = 0$, and the first row gives $-x + 2y = 0$, so $x = 2y$ with $y$ free. Verify: $A(2,1,0) = (4,2,0) = 2(2,1,0)$. The answer is (2, 1, 0)."
          - problem: "Let $A = \\begin{pmatrix}2&0&1\\\\0&2&0\\\\1&0&2\\end{pmatrix}$, which has the eigenvalue $\\lambda = 3$. Compute an eigenvector from $(A - 3I)\\mathbf{v} = \\mathbf{0}$ and give it with whole-number entries, no common factor, and positive first entry, as (x, y, z)."
            answer: "(1, 0, 1)"
            answer_contract: {"arity": 3, "kind": "coordinates"}
            solution_sketch: "Full object: $A - 3I = \\begin{pmatrix}-1&0&1\\\\0&-1&0\\\\1&0&-1\\end{pmatrix}$ (form the shifted matrix). Row reduction (solution sets and free variables) gives $y = 0$ and $x = z$, with $x$ free. Verify: $A(1,0,1) = (3,0,3) = 3(1,0,1)$. The answer is (1, 0, 1)."
        constraints: "eigenvector entries small integers; always verify by computing Av"
      - id: kp3
        name: Eigenpairs one eigenvalue at a time
        key_prerequisites: [characteristic-polynomial, solution-sets-free-variables]
        exemplars:
          - problem: "Let $A = \\begin{pmatrix}2&2\\\\1&3\\end{pmatrix}$ have eigenvalue $\\lambda = 1$. Find an eigenvector whose second entry is 1, and give the answer as (a, b)."
            answer: "(-2, 1)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "Step 1: form the shifted matrix A - 1I = [1,2;1,2] and set (A - I)v = 0. Step 2: solve the homogeneous system by a free variable: both rows say x + 2y = 0, so x = -2y with y free. Step 3: fix the scale by the second entry y = 1, giving x = -2. Check with A(-2, 1) = (-4+2, -2+3) = (-2, 1) = 1 * (-2, 1), so the eigenvector is (-2, 1)."
          - problem: "$\\lambda = 2$ is an eigenvalue of $A = \\begin{pmatrix}4&1\\\\2&3\\end{pmatrix}$. Find an eigenvector whose first entry is 1, and give the answer as (a, b)."
            answer: "(1, -2)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "Step 1: form A - 2I = [2,1;2,1] and set (A - 2I)v = 0. Step 2: solve the homogeneous system: both rows give 2x + y = 0, so y = -2x with x free. Step 3: fix the scale by the first entry x = 1, so y = -2. Verify with A(1, -2) = (4-2, 2-6) = (2, -4) = 2(1, -2), so the eigenvector is (1, -2)."
          - problem: "$A = \\begin{pmatrix}2&0&0\\\\0&3&1\\\\0&1&3\\end{pmatrix}$ has eigenvalues $2$ and $4$. Find an eigenvector for $\\lambda = 4$ whose second entry is 1, and give the answer as (a, b, c)."
            answer: "(0, 1, 1)"
            answer_contract: {"arity": 3, "kind": "coordinates"}
            solution_sketch: "Step 1: form A - 4I = [-2,0,0;0,-1,1;0,1,-1] and set (A - 4I)v = 0. Step 2: solve the homogeneous system: the first row gives x = 0, and the second row gives y = z, so z is the free variable. Step 3: fix the scale by the second entry y = 1, giving z = 1. Verify: A(0, 1, 1) = (0, 3+1, 1+3) = (0, 4, 4) = 4(0, 1, 1), so the eigenvector is (0, 1, 1)."
          - problem: "$A = \\begin{pmatrix}3&1\\\\0&2\\end{pmatrix}$ is upper triangular, so its eigenvalues are the diagonal entries $3$ and $2$. Find an eigenvector for $\\lambda = 3$ whose first entry is 1, and give the answer as (a, b)."
            answer: "(1, 0)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "Step 1: read the eigenvalues from the diagonal of the triangular matrix, 3 and 2, and take lambda = 3. Step 2: form A - 3I = [0,1;0,-1] and solve (A - 3I)v = 0: both rows give y = 0, so x is the free variable. Step 3: fix the scale by the first entry x = 1, giving y = 0. Check A(1, 0) = (3, 0) = 3(1, 0), so the eigenvector is (1, 0)."
          - problem: "A Markov matrix $A = \\begin{pmatrix}1/2&1/4\\\\1/2&3/4\\end{pmatrix}$ has eigenvalue $1$, and its eigenvector is the steady state of the chain. Find the steady-state eigenvector whose first entry is 1, and give the answer as (a, b)."
            answer: "(1, 2)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "Step 1: use the eigenvalue 1 of the Markov matrix and form A - I = [-1/2,1/4;1/2,-1/4]. Step 2: solve the homogeneous system: each row gives -2x + y = 0, so y = 2x with x free. Step 3: fix the scale by the first entry x = 1, giving y = 2. Verify: A(1, 2) = (1/2 + 1/2, 1/2 + 3/2) = (1, 2) = 1(1, 2), so the steady-state eigenvector is (1, 2)."
          - problem: "$\\lambda = 4$ is an eigenvalue of the symmetric matrix $A = \\begin{pmatrix}3&-1\\\\-1&3\\end{pmatrix}$. Find an eigenvector whose second entry is 1, and give the answer as (a, b)."
            answer: "(-1, 1)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "Step 1: form A - 4I = [-1,-1;-1,-1] and set (A - 4I)v = 0. Step 2: solve the homogeneous system: the row gives x + y = 0, so x = -y with y free. Step 3: fix the scale by the second entry y = 1, giving x = -1. Check A(-1, 1) = (-3-1, 1+3) = (-4, 4) = 4(-1, 1), so the eigenvector is (-1, 1)."
        constraints: "eigenvalues given or trivially found; eigenvector entries in -3..3"
    diagnostic_exemplar:
      problem: '$A = \begin{pmatrix}4&2\\1&3\end{pmatrix}$ has eigenvalues $2$ and $5$. Find an eigenvector for each, and verify one of them with $A\mathbf{v} = \lambda\mathbf{v}$.'
      answer: 'lambda = 2: (1, -1); lambda = 5: (2, 1) (each any nonzero multiple); check A(1, -1) = (2, -2) = 2(1, -1)'
      answer_contract: {kind: none}
      solution_sketch: '$(A - 2I)\mathbf{v} = \mathbf{0}$ gives $2x + 2y = 0$, so $(1, -1)$; $(A - 5I)\mathbf{v} = \mathbf{0}$ gives $-x + 2y = 0$, so $(2, 1)$.'
    anki_seeds:
      - front: 'Defining equation of an eigenvalue/eigenvector pair?'
        back: '$A\mathbf{v} = \lambda\mathbf{v}$ with $\mathbf{v} \neq \mathbf{0}$.'
        type: basic
      - front: 'To find the eigenvectors for a known eigenvalue $\lambda$, solve...'
        back: '$(A - \lambda I)\mathbf{v} = \mathbf{0}$.'
        type: basic

  - id: eigenvalues-eigenvectors
    name: Eigenvalues and Eigenvectors
    core: true
    difficulty: 0.7
    drill: false
    answer_kind: numeric
    expected_time_secs: 240
    prerequisites:
      - id: characteristic-polynomial
        weight: 0.7
        key: true
      - id: finding-eigenvectors
        weight: 0.7
        key: true
      - id: determinants
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: Complete 2x2 eigenanalysis
        key_prerequisites: [characteristic-polynomial, finding-eigenvectors]
        exemplars:
          - problem: "Let $A = \\begin{pmatrix}1&2\\\\2&1\\end{pmatrix}$. Find the eigenvalues of $A$ and an eigenvector for each eigenvalue. Give lam1 and lam2 as the larger and the smaller eigenvalue, and v1 and v2 as the matching eigenvectors, each as (x, y) with integer entries between -2 and 2 and first nonzero entry equal to 1."
            answer: "lam1 = 3; lam2 = -1; v1 = (1, 1); v2 = (1, -1)"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "lam1"}, {"contract": {"kind": "exact"}, "name": "lam2"}, {"contract": {"arity": 2, "kind": "coordinates"}, "name": "v1"}, {"contract": {"arity": 2, "kind": "coordinates"}, "name": "v2"}]}
            solution_sketch: "Step 1 (characteristic polynomial): det(A - lambda I) = (1 - lambda)^2 - 4 = lambda^2 - 2lambda - 3 = (lambda - 3)(lambda + 1), so the eigenvalues are 3 and -1. Step 2 (solve (A - lambda I)v = 0): for lambda = 3 the system is -2x + 2y = 0, giving v1 = (1, 1). Step 3 (solve (A - lambda I)v = 0): for lambda = -1 the system is 2x + 2y = 0, giving v2 = (1, -1). The answer is lam1 = 3; lam2 = -1; v1 = (1, 1); v2 = (1, -1)."
          - problem: "Let $A = \\begin{pmatrix}3&2\\\\2&3\\end{pmatrix}$. Find the eigenvalues of $A$ and an eigenvector for each eigenvalue. Give lam1 and lam2 as the larger and the smaller eigenvalue, and v1 and v2 as the matching eigenvectors, each as (x, y) with integer entries between -2 and 2 and first nonzero entry equal to 1."
            answer: "lam1 = 5; lam2 = 1; v1 = (1, 1); v2 = (1, -1)"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "lam1"}, {"contract": {"kind": "exact"}, "name": "lam2"}, {"contract": {"arity": 2, "kind": "coordinates"}, "name": "v1"}, {"contract": {"arity": 2, "kind": "coordinates"}, "name": "v2"}]}
            solution_sketch: "Step 1 (characteristic polynomial): det(A - lambda I) = (3 - lambda)^2 - 4 = lambda^2 - 6lambda + 5 = (lambda - 5)(lambda - 1), so the eigenvalues are 5 and 1. Step 2 (solve (A - lambda I)v = 0): for lambda = 5 the system is -2x + 2y = 0, giving v1 = (1, 1). Step 3 (solve (A - lambda I)v = 0): for lambda = 1 the system is 2x + 2y = 0, giving v2 = (1, -1). The answer is lam1 = 5; lam2 = 1; v1 = (1, 1); v2 = (1, -1)."
          - problem: "Let $A = \\begin{pmatrix}0&1\\\\2&1\\end{pmatrix}$. Find an eigenvector for the larger eigenvalue of $A$. Give the answer as (x, y) with integer entries between -2 and 2 and first nonzero entry equal to 1."
            answer: "(1, 2)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "Step 1 (characteristic polynomial): det(A - lambda I) = (0 - lambda)(1 - lambda) - 2 = lambda^2 - lambda - 2 = (lambda - 2)(lambda + 1), so the larger eigenvalue is 2. Step 2 (solve (A - lambda I)v = 0): A - 2I gives -2x + y = 0, so y = 2x. The primitive vector with first entry 1 is (1, 2). The answer is (1, 2)."
          - problem: "A linear map $T$ takes each point $(x, y)$ to $(4x + y,\\ x + 4y)$. Find the eigenvalues of $T$ and an eigenvector for each eigenvalue. Give lam1 and lam2 as the larger and the smaller eigenvalue, and v1 and v2 as the matching eigenvectors, each as (x, y) with integer entries between -2 and 2 and first nonzero entry equal to 1."
            answer: "lam1 = 5; lam2 = 3; v1 = (1, 1); v2 = (1, -1)"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "lam1"}, {"contract": {"kind": "exact"}, "name": "lam2"}, {"contract": {"arity": 2, "kind": "coordinates"}, "name": "v1"}, {"contract": {"arity": 2, "kind": "coordinates"}, "name": "v2"}]}
            solution_sketch: "Step 1 (matrix form): T has matrix [[4, 1], [1, 4]]. Step 2 (characteristic polynomial): (4 - lambda)^2 - 1 = lambda^2 - 8lambda + 15 = (lambda - 5)(lambda - 3), so the eigenvalues are 5 and 3. Step 3 (solve (A - lambda I)v = 0): for lambda = 5, -x + y = 0 gives v1 = (1, 1); for lambda = 3, x + y = 0 gives v2 = (1, -1). The answer is lam1 = 5; lam2 = 3; v1 = (1, 1); v2 = (1, -1)."
          - problem: "The matrix $A = \\begin{pmatrix}0&1\\\\4&0\\end{pmatrix}$ has two eigenvalues of opposite sign. Find both eigenvalues and an eigenvector for each. Give lam1 for the positive eigenvalue, lam2 for the negative eigenvalue, and v1, v2 for the matching eigenvectors, each as (x, y) with integer entries between -2 and 2 and first nonzero entry equal to 1."
            answer: "lam1 = 2; lam2 = -2; v1 = (1, 2); v2 = (1, -2)"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "lam1"}, {"contract": {"kind": "exact"}, "name": "lam2"}, {"contract": {"arity": 2, "kind": "coordinates"}, "name": "v1"}, {"contract": {"arity": 2, "kind": "coordinates"}, "name": "v2"}]}
            solution_sketch: "Step 1 (characteristic polynomial): det(A - lambda I) = lambda^2 - 4 = (lambda - 2)(lambda + 2), so the eigenvalues are 2 and -2, of opposite sign. Step 2 (solve (A - lambda I)v = 0): for lambda = 2, -2x + y = 0 gives v1 = (1, 2). Step 3 (solve (A - lambda I)v = 0): for lambda = -2, 2x + y = 0 gives v2 = (1, -2). The answer is lam1 = 2; lam2 = -2; v1 = (1, 2); v2 = (1, -2)."
          - problem: "The matrix $A = \\begin{pmatrix}1&1\\\\2&b\\end{pmatrix}$ has $v = (1, 2)$ as an eigenvector. Find the value of $b$ and the eigenvalue that matches $v$. Give b and the matching eigenvalue lambda."
            answer: "b = 2; lambda = 3"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "b"}, {"contract": {"kind": "exact"}, "name": "lambda"}]}
            solution_sketch: "Step 1 (eigenvector definition Av = lambda v): Av = (1 + 2, 2 + 2b) = (3, 2 + 2b). Step 2 (match components): lambda times (1, 2) is (lambda, 2lambda), so lambda = 3 and 2 + 2b = 6, giving b = 2. The answer is b = 2; lambda = 3."
        constraints: "2x2 with two distinct integer eigenvalues in -3..5; eigenvector entries in -2..2"
      - id: kp2
        name: Eigenanalysis of easy 3x3 matrices
        key_prerequisites: [characteristic-polynomial, finding-eigenvectors, determinants]
        exemplars:
          - problem: "Find the eigenvalues of $A = \\begin{pmatrix}4&2&0\\\\0&-1&5\\\\0&0&3\\end{pmatrix}$. Give the answer as a set in braces."
            answer: "{-1, 3, 4}"
            answer_contract: {"kind": "set"}
            solution_sketch: "The matrix A = [[4,2,0],[0,-1,5],[0,0,3]] is upper triangular. By the triangular-matrix rule, the eigenvalues of a triangular matrix are exactly its diagonal entries. Reading the diagonal gives 4, -1 and 3, so the eigenvalues are {-1, 3, 4}."
          - problem: "Let $A = \\begin{pmatrix}4&1&0\\\\1&4&0\\\\0&0&3\\end{pmatrix}$. Find the eigenvalues of $A$ and an eigenvector for the largest eigenvalue, scaled so its first nonzero entry is 1. Give spectrum, the eigenvalues as a set, and $v$, the eigenvector, as (x, y, z)."
            answer: "spectrum = {3, 5}; v = (1, 1, 0)"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "set"}, "name": "spectrum"}, {"contract": {"arity": 3, "kind": "coordinates"}, "name": "v"}]}
            solution_sketch: "The 2x2 block [[4,1],[1,4]] has characteristic polynomial (4-lambda)^2 - 1, so by the 2x2 eigenvalue rule it contributes 3 and 5. The isolated diagonal entry 3 contributes 3 again, so spectrum = {3, 5}. For lambda = 5, row reduction of A - 5I gives x = y and z = 0, so the eigenvector scaled with first entry 1 is v = (1, 1, 0). The answer is spectrum = {3, 5}; v = (1, 1, 0)."
          - problem: "A lower triangular $3 \\times 3$ matrix $A$ has diagonal entries $7$, $-2$ and $5$, and its only other nonzero entry is the $(3,2)$ entry, which equals $-4$. What are the eigenvalues of $A$? Give the answer as a set in braces."
            answer: "{-2, 5, 7}"
            answer_contract: {"kind": "set"}
            solution_sketch: "The matrix A is lower triangular with diagonal 7, -2, 5. By the triangular-matrix rule, the eigenvalues of a triangular matrix are its diagonal entries, and the single off-diagonal entry -4 changes nothing. Hence the eigenvalues are {-2, 5, 7}."
          - problem: "Let $A = \\begin{pmatrix}4&6&2\\\\0&7&5\\\\0&0&3\\end{pmatrix}$, and you may take $7$ as an eigenvalue. Find an eigenvector of $A$ for the eigenvalue $7$ whose second entry is $1$, and give it as (x, y, z)."
            answer: "(2, 1, 0)"
            answer_contract: {"arity": 3, "kind": "coordinates"}
            solution_sketch: "An eigenvector for lambda = 7 is a nonzero solution of (A - 7I)v = 0, found by row reduction. Row reducing A - 7I gives z = 0 from the second row and -3x + 6y = 0 from the first, so back-substitution gives x = 2y. Taking y = 1, the eigenvector for lambda = 7 is (2, 1, 0)."
          - problem: "Find the eigenvalues of $A = \\begin{pmatrix}3&1&2\\\\0&3&4\\\\0&0&-2\\end{pmatrix}$ with repetition, in the order of the diagonal, as a comma-separated list."
            answer: "3, 3, -2"
            answer_contract: {"kind": "list", "member": {"kind": "exact"}, "ordered": true}
            solution_sketch: "The matrix A = [[3,1,2],[0,3,4],[0,0,-2]] is upper triangular. By the triangular-matrix rule its characteristic polynomial is (3-lambda)(3-lambda)(-2-lambda). The eigenvalue 3 appears twice and -2 appears once, so the list with repetition in diagonal order is 3, 3, -2."
          - problem: "Let $A = \\begin{pmatrix}5&2&0\\\\2&2&0\\\\0&0&4\\end{pmatrix}$. Determine the largest eigenvalue of $A$."
            answer: "6"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The 2x2 block [[5,2],[2,2]] has characteristic polynomial lambda^2 - 7lambda + 6 = (lambda-1)(lambda-6), so by the 2x2 eigenvalue rule it contributes 1 and 6. The isolated diagonal entry 4 contributes 4. Comparing 1, 4 and 6, the largest eigenvalue is 6."
        constraints: "3x3 triangular or block-diagonal so no cubic solving is needed; integer spectra"
      - id: kp3
        name: Checking spectra with trace and determinant
        key_prerequisites: [characteristic-polynomial, determinants]
        exemplars:
          - problem: 'A $2 \times 2$ matrix has trace $6$ and determinant $8$. Find its eigenvalues.'
            answer: "2 and 4"
            answer_contract: {"kind":"list","member":{"kind":"exact"},"ordered":false}
            solution_sketch: 'Need $\lambda_1 + \lambda_2 = 6$ and $\lambda_1\lambda_2 = 8$: the pair $2, 4$.'
          - problem: 'A student claims the eigenvalues of $A = \begin{pmatrix}3&2\\2&3\end{pmatrix}$ are $1$ and $5$. Check the claim using trace and determinant.'
            answer: "Correct: 1 + 5 = 6 = trace, 1 * 5 = 5 = det"
            answer_contract: {kind: none}
            solution_sketch: 'Sum of eigenvalues $=$ trace, product $=$ determinant; both match, and indeed $\lambda^2 - 6\lambda + 5 = (\lambda - 1)(\lambda - 5)$.'
        constraints: "integer trace/det pairs with integer eigenvalue solutions"
    diagnostic_exemplar:
      problem: 'Find the eigenvalues of $A = \begin{pmatrix}3&1&0\\0&2&0\\0&4&5\end{pmatrix}$, and an eigenvector for $\lambda = 5$.'
      answer: 'Eigenvalues 2, 3, and 5; for lambda = 5: (0, 0, 1) (any nonzero multiple)'
      answer_contract: {kind: none}
      solution_sketch: 'Expanding along the third column gives $(5 - \lambda)(3 - \lambda)(2 - \lambda)$. For $\lambda = 5$, the rows force $y = 0$ and then $x = 0$, leaving $(0, 0, 1)$.'
    anki_seeds:
      - front: 'Sum and product of the eigenvalues of a matrix?'
        back: 'Sum $=$ trace; product $=$ determinant.'
        type: basic
      - front: '$0$ is an eigenvalue of $A$ iff...'
        back: '$A$ is not invertible ($\det A = 0$).'
        type: basic

  - id: eigenspaces-multiplicities
    name: Eigenspaces and Multiplicities
    core: true
    difficulty: 0.7
    drill: false
    answer_kind: numeric
    expected_time_secs: 210
    prerequisites:
      - id: eigenvalues-eigenvectors
        weight: 0.8
        key: true
      - id: null-column-space-rank
        weight: 0.6
        key: true
      - id: basis-dimension
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: Eigenspaces as null spaces
        key_prerequisites: [eigenvalues-eigenvectors, basis-dimension, null-column-space-rank]
        exemplars:
          - problem: "For the matrix $A = \\begin{pmatrix}5&1\\\\2&4\\end{pmatrix}$, one eigenvalue is $\\lambda = 3$. The eigenspace of $\\lambda = 3$ is the null space of $A - 3I$. Find a basis vector of this eigenspace as (x, y) with integer entries and positive first entry."
            answer: "(1, -2)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "Step 1 (eigenspace as null space): form $A - 3I = \\begin{pmatrix}2&1\\\\2&1\\end{pmatrix}$. Step 2 (solve the homogeneous system): $2x + y = 0$ gives $y = -2x$, so a null vector is $(1, -2)$. Step 3 (check): $A(1,-2) = (3,-6) = 3(1,-2)$. The basis vector is (1, -2)."
          - problem: "For the matrix $A = \\begin{pmatrix}2&0\\\\0&2\\end{pmatrix}$ with eigenvalue $\\lambda = 2$, the eigenspace is all of $\\mathbb{R}^2$. Find a basis of this eigenspace. Give the two basis vectors v1 and v2 as (x, y)."
            answer: "v1 = (1, 0); v2 = (0, 1)"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"arity": 2, "kind": "coordinates"}, "name": "v1"}, {"contract": {"arity": 2, "kind": "coordinates"}, "name": "v2"}]}
            solution_sketch: "Step 1 (eigenspace as null space): $A - 2I = \\begin{pmatrix}0&0\\\\0&0\\end{pmatrix}$, the zero matrix. Step 2 (dimension): every nonzero vector of $\\mathbb{R}^2$ lies in the null space, so the eigenspace has dimension 2. Step 3 (basis): the standard basis vectors $(1,0)$ and $(0,1)$ span it. A basis is v1 = (1, 0) and v2 = (0, 1)."
          - problem: "The matrix $A = \\begin{pmatrix}3&1\\\\-1&1\\end{pmatrix}$ has the single eigenvalue $\\lambda = 2$ of algebraic multiplicity 2. Find a basis vector of the eigenspace for $\\lambda = 2$ as (x, y) with integer entries and positive first entry."
            answer: "(1, -1)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "Step 1 (eigenspace as null space): $A - 2I = \\begin{pmatrix}1&1\\\\-1&-1\\end{pmatrix}$. Step 2 (solve): both rows give $x + y = 0$, so the null space is one-dimensional with null vector $(1, -1)$. Step 3 (check): $A(1,-1) = (2,-2) = 2(1,-1)$. The basis vector is (1, -1)."
          - problem: "For $A = \\begin{pmatrix}5&0\\\\0&3\\end{pmatrix}$, the eigenvalues are $5$ and $3$. Find a basis vector of the eigenspace for $\\lambda = 3$ as (x, y) with integer entries."
            answer: "(0, 1)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "Step 1 (eigenspace as null space): $A - 3I = \\begin{pmatrix}2&0\\\\0&0\\end{pmatrix}$. Step 2 (solve the homogeneous system): $2x = 0$ forces $x = 0$ and $y$ is free, so a null vector is $(0, 1)$. Step 3 (check): $A(0,1) = (0,3) = 3(0,1)$. The basis vector is (0, 1)."
          - problem: "The matrix $A = \\begin{pmatrix}1&2\\\\2&4\\end{pmatrix}$ has eigenvalues $0$ and $5$. The eigenspace of $\\lambda = 0$ is the null space of $A$. Find a basis vector of this eigenspace as (x, y) with integer entries and positive first entry."
            answer: "(2, -1)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "Step 1 (eigenspace as null space): for $\\lambda = 0$ we need $Nul(A)$, so solve $x + 2y = 0$ and $2x + 4y = 0$. Step 2 (solve): both rows give $x = -2y$, so a null vector is $(2, -1)$. Step 3 (check): $A(2,-1) = (0,0)$, confirming $\\lambda = 0$. The basis vector is (2, -1)."
          - problem: "The matrix $A = \\begin{pmatrix}5&2\\\\2&5\\end{pmatrix}$ has eigenvalue $\\lambda = 7$. Its eigenspace for $\\lambda = 7$ is the null space of $A - 7I$. Find a basis vector of this eigenspace as (x, y) with integer entries and first entry 1."
            answer: "(1, 1)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "Step 1 (eigenspace as null space): form $A - 7I = \\begin{pmatrix}-2&2\\\\2&-2\\end{pmatrix}$. Step 2 (solve the homogeneous system): $-2x + 2y = 0$ gives $x = y$, so the null vector with first entry 1 is $(1, 1)$. Step 3 (check): $A(1, 1) = (7, 7) = 7(1, 1)$, so the basis vector is (1, 1)."
        constraints: "2x2 matrices; eigenspaces of dimension 1 or 2 with integer basis vectors"
      - id: kp2
        name: Algebraic vs geometric multiplicity
        key_prerequisites: [eigenvalues-eigenvectors]
        exemplars:
          - problem: "For A = [[2,1],[0,2]], the only eigenvalue is repeated. Find the eigenvalue lambda and its algebraic multiplicity alg and geometric multiplicity geo."
            answer: "lambda = 2; alg = 2; geo = 1"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "lambda"}, {"contract": {"kind": "exact"}, "name": "alg"}, {"contract": {"kind": "exact"}, "name": "geo"}]}
            solution_sketch: "Step 1 (triangular-matrix property): A = [[2,1],[0,2]] is upper triangular, so its diagonal entries give the only eigenvalue, lambda = 2. Step 2 (characteristic polynomial): (lambda - 2)^2 has degree 2, so the algebraic multiplicity is alg = 2. Step 3 (rank-nullity): A - 2I = [[0,1],[0,0]] has rank 1, so its null space has dimension 2 - 1 = 1, which is the geometric multiplicity. The multiplicities are lambda = 2; alg = 2; geo = 1."
          - problem: "For A = [[5,0],[0,5]], find the eigenvalue lambda and its algebraic multiplicity alg and geometric multiplicity geo."
            answer: "lambda = 5; alg = 2; geo = 2"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "lambda"}, {"contract": {"kind": "exact"}, "name": "alg"}, {"contract": {"kind": "exact"}, "name": "geo"}]}
            solution_sketch: "Step 1 (diagonal-matrix property): A = [[5,0],[0,5]] is diagonal, so lambda = 5 is the only eigenvalue, read from the diagonal. Step 2 (characteristic polynomial): (lambda - 5)^2 has degree 2, so the algebraic multiplicity is alg = 2. Step 3 (rank-nullity): A - 5I = [[0,0],[0,0]] has rank 0, so the eigenspace has dimension 2, giving geo = 2. The multiplicities are lambda = 5; alg = 2; geo = 2."
          - problem: "For A = [[4,1],[-1,2]], find the eigenvalue lambda of A and its algebraic multiplicity alg and geometric multiplicity geo."
            answer: "lambda = 3; alg = 2; geo = 1"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "lambda"}, {"contract": {"kind": "exact"}, "name": "alg"}, {"contract": {"kind": "exact"}, "name": "geo"}]}
            solution_sketch: "Step 1 (characteristic polynomial): for A = [[4,1],[-1,2]] the trace is 6 and the determinant is 9, so char A = lambda^2 - 6 lambda + 9 = (lambda - 3)^2; the only eigenvalue is lambda = 3 with algebraic multiplicity alg = 2. Step 2 (rank-nullity): A - 3I = [[1,1],[-1,-1]] has rank 1, so its null space has dimension 2 - 1 = 1. The multiplicities are lambda = 3; alg = 2; geo = 1."
          - problem: "For A = [[6,0],[5,6]], the eigenvalue lambda = 6 is repeated. Find geo, the geometric multiplicity of lambda = 6, and give one eigenvector v as (a, b) with b = 1."
            answer: "geo = 1; v = (0, 1)"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "geo"}, {"contract": {"arity": 2, "kind": "coordinates"}, "name": "v"}]}
            solution_sketch: "Step 1 (triangular-matrix property): A = [[6,0],[5,6]] is lower triangular, so lambda = 6 is the only eigenvalue, with algebraic multiplicity 2. Step 2 (rank-nullity): A - 6I = [[0,0],[5,0]] has rank 1, so the eigenspace has dimension 2 - 1 = 1, giving geo = 1. Step 3 (null-space computation): (A - 6I)v = 0 gives the equation 5v1 = 0, so v1 = 0, and with b = 1 the eigenvector is (0, 1). The answer is geo = 1; v = (0, 1)."
          - problem: "A 2x2 matrix A has characteristic polynomial (lambda - 4)^2, and the eigenspace for lambda = 4 has dimension 1. Determine geo, the geometric multiplicity of lambda = 4, and select the word that best describes A."
            answer: "verdict = defective; geo = 1"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["defective"], ["scalar"], ["diagonalizable"], ["orthogonal"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "geo"}]}
            solution_sketch: "Step 1 (characteristic polynomial): (lambda - 4)^2 shows the only eigenvalue is lambda = 4 with algebraic multiplicity 2. Step 2 (geometric multiplicity): the eigenspace has dimension 1, so geo = 1 < alg = 2. Step 3 (classification): geo < alg means A is not diagonalizable, which is exactly the word defective; scalar would require A = 4I and an eigenspace of dimension 2, diagonalizable contradicts geo < alg, and orthogonal is a metric property that this data does not determine. The answer is verdict = defective; geo = 1."
          - problem: "The matrix A = [[a,1],[0,3]] has a repeated eigenvalue. Find the value of a, and the algebraic multiplicity alg and geometric multiplicity geo of that eigenvalue."
            answer: "a = 3; alg = 2; geo = 1"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "a"}, {"contract": {"kind": "exact"}, "name": "alg"}, {"contract": {"kind": "exact"}, "name": "geo"}]}
            solution_sketch: "Step 1 (characteristic polynomial): A = [[a,1],[0,3]] is upper triangular with eigenvalues a and 3; the eigenvalue is repeated only when a = 3. Step 2 (algebraic multiplicity): with a = 3 the characteristic polynomial is (lambda - 3)^2, so alg = 2. Step 3 (rank-nullity): A - 3I = [[0,1],[0,0]] has rank 1, so the eigenspace has dimension 2 - 1 = 1, giving geo = 1. The values are a = 3; alg = 2; geo = 1."
        constraints: "repeated-eigenvalue 2x2 examples: shear-type (geo < alg) vs scalar matrices (geo = alg)"
      - id: kp3
        name: Multiplicities in 3x3 matrices
        key_prerequisites: [eigenvalues-eigenvectors, basis-dimension, null-column-space-rank]
        exemplars:
          - problem: "Let A = [4,0,0;0,4,2;0,0,6]. Find the algebraic multiplicity of each eigenvalue and the geometric multiplicity of the repeated eigenvalue 4. Give alg4, alg6 and geo4."
            answer: "alg4 = 2; alg6 = 1; geo4 = 2"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "alg4"}, {"contract": {"kind": "exact"}, "name": "alg6"}, {"contract": {"kind": "exact"}, "name": "geo4"}]}
            solution_sketch: "Step 1: A is triangular, so its eigenvalues are the diagonal entries 4, 4 and 6; the algebraic multiplicity of 4 is 2 and of 6 is 1. Step 2: form A - 4I = [0,0,0;0,0,2;0,0,2] and row reduce; the two nonzero rows are proportional, so the rank is 1. Step 3: by the rank-nullity theorem the nullity is 3 - 1 = 2, which is the geometric multiplicity. The answer is alg4 = 2; alg6 = 1; geo4 = 2."
          - problem: "Let A = [5,0,0;0,5,3;0,0,2]. Find an eigenvector of A for the eigenvalue 2 and give it as (x, y, z) with y = 1."
            answer: "(0,1,-1)"
            answer_contract: {"arity": 3, "kind": "coordinates"}
            solution_sketch: "Step 1: form A - 2I = [3,0,0;0,3,3;0,0,0]. Step 2: row reduction forces x = 0 from the first row and y + z = 0 from the second row. Step 3: choose y = 1, so z = -1, and check A(0,1,-1) = (0,2,-2) = 2(0,1,-1). The eigenvector is (0,1,-1)."
          - problem: "Let A = [6,0,0;0,6,2;0,0,9]. Find the rank of A - 6I and the geometric multiplicity of the eigenvalue 6. Give rank and geo."
            answer: "rank = 1; geo = 2"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "rank"}, {"contract": {"kind": "exact"}, "name": "geo"}]}
            solution_sketch: "Step 1: form the full object A - 6I = [0,0,0;0,0,2;0,0,3]. Step 2: the nonzero rows (0,0,2) and (0,0,3) are proportional, so row reduction leaves one independent row and the rank is 1. Step 3: by rank-nullity the nullity is 3 - 1 = 2, which is the geometric multiplicity of the eigenvalue 6. The answer is rank = 1; geo = 2."
          - problem: "Let A = [9,0,0;0,9,3;0,0,4]. Find the geometric multiplicity of the eigenvalue 9."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: the diagonal shows the eigenvalue 9 twice, so its algebraic multiplicity is 2. Step 2: form A - 9I = [0,0,0;0,0,3;0,0,-5]; the two nonzero rows are proportional, so the rank is 1. Step 3: rank-nullity gives nullity 3 - 1 = 2. The geometric multiplicity of the eigenvalue 9 is 2."
          - problem: "Let A = [2,1,0;0,2,0;0,0,5]. Determine the geometric multiplicity of the repeated eigenvalue 2."
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: the diagonal gives the eigenvalue 2 twice, so its algebraic multiplicity is 2. Step 2: form A - 2I = [0,1,0;0,0,0;0,0,3]; the rows (0,1,0) and (0,0,3) are independent, so the rank is 2. Step 3: rank-nullity gives nullity 3 - 2 = 1. The geometric multiplicity of the repeated eigenvalue 2 is 1."
          - problem: "Let A = [1,c,0;0,1,0;0,0,4], where c is a real number. Find the value of c for which the geometric multiplicity of the eigenvalue 1 equals 2."
            answer: "0"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: form A - 1I = [0,c,0;0,0,0;0,0,3]. Step 2: the third row is nonzero, so the rank is at least 1; if c is nonzero the first row is independent of it and the rank is 2, so rank 1 happens only for c = 0. Step 3: rank 1 gives nullity 3 - 1 = 2 by rank-nullity, the required geometric multiplicity. The required value is c = 0."
        constraints: "3x3 triangular with one repeated diagonal entry; geometric multiplicity computed by rank"
    diagnostic_exemplar:
      problem: 'For $A = \begin{pmatrix}3&0&0\\0&3&1\\0&0&5\end{pmatrix}$, find the eigenvalues with their algebraic multiplicities, and a basis for the eigenspace of $\lambda = 3$.'
      answer: 'lambda = 3 (algebraic 2) and lambda = 5 (algebraic 1); eigenspace basis {(1, 0, 0), (0, 1, 0)} (any valid basis), so the geometric multiplicity of 3 is 2'
      answer_contract: {kind: none}
      solution_sketch: 'The matrix is triangular, so the eigenvalues are its diagonal entries. $A - 3I$ has rows $(0,0,0)$, $(0,0,1)$, $(0,0,2)$, forcing $z = 0$ with $x, y$ free.'
    anki_seeds:
      - front: 'The eigenspace of $A$ for $\lambda$ is which null space?'
        back: '$\mathrm{Nul}(A - \lambda I)$.'
        type: basic
      - front: 'Geometric multiplicity of $\lambda$ compared to its algebraic multiplicity?'
        back: '$1 \leq \text{geometric} \leq \text{algebraic}$.'
        type: basic

  - id: complex-eigenvalues-2x2
    name: Complex Eigenvalues of 2x2 Matrices
    core: false                # special case at the tip of the eigen branch
    difficulty: 0.75
    drill: false
    answer_kind: numeric
    expected_time_secs: 210
    prerequisites:
      - id: characteristic-polynomial
        weight: 0.7
        key: true
      - id: complex-numbers
        weight: 0.6
        key: true
      - id: complex-plane-modulus-conjugate
        weight: 0.5
      - id: eigenvalues-eigenvectors
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: Conjugate eigenvalue pairs
        key_prerequisites: [characteristic-polynomial, complex-numbers]
        exemplars:
          - problem: 'Find the eigenvalues of the rotation matrix $A = \begin{pmatrix}0&-1\\1&0\end{pmatrix}$.'
            answer: '$i$ and $-i$'
            answer_contract: {"kind":"list","member":{"kind":"exact"},"ordered":false}
            solution_sketch: '$\lambda^2 + 1 = 0$: no real roots; the eigenvalues are $\pm i$.'
          - problem: 'Find the eigenvalues of $A = \begin{pmatrix}1&-2\\1&3\end{pmatrix}$.'
            answer: '$2 + i$ and $2 - i$'
            answer_contract: {"kind":"list","member":{"kind":"exact"},"ordered":false}
            solution_sketch: '$\lambda^2 - 4\lambda + 5 = 0$; $\lambda = \frac{4 \pm \sqrt{-4}}{2} = 2 \pm i$.'
          - problem: 'Find the eigenvalues of $A = \begin{pmatrix}3&-5\\1&-1\end{pmatrix}$.'
            answer: '$1 + i$ and $1 - i$'
            answer_contract: {"kind":"list","member":{"kind":"exact"},"ordered":false}
            solution_sketch: 'Trace $2$, determinant $-3 + 5 = 2$: $\lambda^2 - 2\lambda + 2 = 0$, so $\lambda = 1 \pm i$.'
        constraints: "real 2x2 matrices with negative discriminant; eigenvalues a +- bi with integer a, b"
      - id: kp2
        name: Rotation-scaling interpretation
        key_prerequisites: [characteristic-polynomial, complex-numbers, complex-plane-modulus-conjugate]
        exemplars:
          - problem: 'The rotation-scaling matrix $A = \begin{pmatrix}1&-1\\1&1\end{pmatrix}$ has eigenvalues $1 \pm i$. By what factor does $A$ scale lengths?'
            answer: '$\sqrt{2}$'
            solution_sketch: '$A$ has the form $\begin{pmatrix}a&-b\\b&a\end{pmatrix}$, so it is exactly a rotation by $45^\circ$ followed by scaling by $|\lambda| = \sqrt{1^2 + 1^2} = \sqrt{2}$.'
          - problem: "A real $2 \\times 2$ matrix has eigenvalue $3 + 4i$, and the eigenvalues of a real matrix form a conjugate pair. Find the other eigenvalue and the modulus of the eigenvalues."
            answer: "conjugate = 3-4i; modulus = 5"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "conjugate"}, {"contract": {"kind": "exact"}, "name": "modulus"}]}
            solution_sketch: "Step 1 (conjugate-pair rule): complex eigenvalues of a real matrix come in conjugate pairs, so the partner of $3 + 4i$ is $3 - 4i$. Step 2 (modulus formula): $|3 + 4i| = \\sqrt{3^2 + 4^2} = \\sqrt{25} = 5$. Step 3 (conclusion): conjugate = 3-4i; modulus = 5."
          - problem: "The matrix $A = \\begin{pmatrix}0 & -2\\\\ 2 & 0\\end{pmatrix}$ has the rotation-scaling form $\\begin{pmatrix}a & -b\\\\ b & a\\end{pmatrix}$, so its eigenvalues are the conjugate pair $a \\pm bi$. By what factor does $A$ scale lengths?"
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (rotation-scaling form): $a = 0$ and $b = 2$, so the eigenvalues are the conjugate pair $\\pm 2i$. Step 2 (modulus formula): $|\\lambda| = \\sqrt{0^2 + 2^2} = 2$. Step 3 (scaling interpretation): since $A$ is literally of the form $\\begin{pmatrix}a & -b\\\\ b & a\\end{pmatrix}$, it scales lengths by $|\\lambda|$. The factor is 2."
          - problem: "A real $2 \\times 2$ matrix has characteristic polynomial $\\lambda^2 + 6\\lambda + 25$, and its eigenvalues are a conjugate pair. Find the eigenvalue with negative imaginary part and the modulus of the eigenvalues."
            answer: "eig = -3-4i; modulus = 5"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "eig"}, {"contract": {"kind": "exact"}, "name": "modulus"}]}
            solution_sketch: "Step 1 (quadratic formula): solve $\\lambda^2 + 6\\lambda + 25 = 0$, so $\\lambda = (-6 \\pm \\sqrt{36 - 100})/2 = -3 \\pm 4i$. Step 2 (conjugate-pair rule): the eigenvalues are the conjugate pair $-3 + 4i$ and $-3 - 4i$; the one with negative imaginary part is $-3 - 4i$. Step 3 (modulus formula): $|-3 - 4i| = \\sqrt{9 + 16} = 5$. So eig = -3-4i; modulus = 5."
          - problem: "The matrix $A = \\begin{pmatrix}4 & -b\\\\ b & 4\\end{pmatrix}$ has the rotation-scaling form, so its eigenvalues are a conjugate pair and $A$ scales every length by the factor $5$. Find $|b|$."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (rotation-scaling form): with $a = 4$, the length scaling factor is $|\\lambda| = \\sqrt{4^2 + b^2}$. Step 2 (equation): set $\\sqrt{16 + b^2} = 5$ and square both sides: $16 + b^2 = 25$. Step 3 (solve): $b^2 = 9$, so $|b| = 3$. The value of $|b|$ is 3."
          - problem: "The matrix $A = \\begin{pmatrix}1 & -2\\\\ 2 & 1\\end{pmatrix}$ has the rotation-scaling form and its eigenvalues are the conjugate pair $1 \\pm 2i$, so each length is scaled by $|\\lambda| = \\sqrt{5}$. By what factor does $A$ scale areas?"
            answer: "5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (length scaling): since $A$ is literally of the rotation-scaling form, it scales every length by $|\\lambda| = \\sqrt{1^2 + 2^2} = \\sqrt{5}$. Step 2 (area rule): a region of area $S$ is sent to a region of area $|\\lambda|^2 S$, because area scales by the square of the length factor. Step 3 (compute): $(\\sqrt{5})^2 = 5$. The area factor is 5."
        constraints: "scaling-factor questions ONLY for matrices literally of the form [[a,-b],[b,a]] (a general real matrix with eigenvalues a +- bi is merely SIMILAR to that map, so it need not scale lengths by |lambda|); moduli are clean: sqrt(2), 2, 5, sqrt(5); always note the conjugate pair"
      - id: kp3
        name: Complex eigenvectors
        key_prerequisites: [characteristic-polynomial, complex-numbers]
        exemplars:
          - problem: "Let $A = \\begin{pmatrix}0&1\\\\-1&0\\end{pmatrix}$ and $\\lambda = i$. Find an eigenvector of $A$ for $\\lambda = i$ whose first coordinate is 1, and give its second coordinate in the form a + bi."
            answer: "i"
            answer_contract: {"kind": "exact"}
            solution_sketch: "For $A = [0,1;-1,0]$ and $\\lambda = i$, solve $(A - iI)\\mathbf{v} = \\mathbf{0}$. The first row gives $-ix + y = 0$, so $y = ix$; with first coordinate $x = 1$, $y = i$. Verify by multiplying out: $A(1, i) = (i, -1) = i(1, i)$. The second coordinate is i."
          - problem: "A real $2\\times 2$ matrix $A$ has eigenvector $(1, 1+i)$ for the eigenvalue $\\lambda = 2+i$. Find an eigenvector of $A$ for the eigenvalue $2-i$ whose first coordinate is 1, and give its second coordinate in the form a + bi."
            answer: "1-i"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Conjugation rule: since $A$ is real, conjugating $A\\mathbf{v} = \\lambda\\mathbf{v}$ gives $A\\overline{\\mathbf{v}} = \\overline{\\lambda}\\,\\overline{\\mathbf{v}}$. So the eigenvector for $\\lambda = 2-i$ is the conjugate of $(1, 1+i)$, which is $(1, 1-i)$, already with first coordinate 1. Verify: $A(1, 1-i)$ must equal $(2-i)(1, 1-i)$. The second coordinate is 1-i."
          - problem: "Let $A = \\begin{pmatrix}2&3\\\\-3&2\\end{pmatrix}$ and $\\lambda = 2+3i$. Find an eigenvector of $A$ for $\\lambda = 2+3i$ whose second coordinate is 1, and give its first coordinate in the form a + bi."
            answer: "-i"
            answer_contract: {"kind": "exact"}
            solution_sketch: "For $A = [2,3;-3,2]$ and $\\lambda = 2+3i$, write $(A - (2+3i)I)\\mathbf{v} = \\mathbf{0}$. The first row gives $-3ix + 3y = 0$, so $x = y/i$; with second coordinate $y = 1$, $x = -i$. Verify by multiplying out: $A(-i, 1) = (3-2i, 2+3i) = (2+3i)(-i, 1)$. The first coordinate is -i."
          - problem: "Let $A = \\begin{pmatrix}1&2\\\\-2&1\\end{pmatrix}$ and $\\lambda = 1-2i$. Find an eigenvector of $A$ for $\\lambda = 1-2i$ whose first coordinate is 1, and give its second coordinate in the form a + bi."
            answer: "-i"
            answer_contract: {"kind": "exact"}
            solution_sketch: "For $A = [1,2;-2,1]$ and $\\lambda = 1-2i$, solve $(A - (1-2i)I)\\mathbf{v} = \\mathbf{0}$. The first row gives $2ix + 2y = 0$, so $y = -ix$; with first coordinate $x = 1$, $y = -i$. Verify by multiplying out: $A(1, -i) = (1-2i, -2-i) = (1-2i)(1, -i)$. The second coordinate is -i."
          - problem: "Let $A = \\begin{pmatrix}0&1\\\\-2&2\\end{pmatrix}$ and $\\lambda = 1+i$. Find an eigenvector of $A$ for $\\lambda = 1+i$ whose first coordinate is 1, and give its second coordinate in the form a + bi."
            answer: "1+i"
            answer_contract: {"kind": "exact"}
            solution_sketch: "For $A = [0,1;-2,2]$ and $\\lambda = 1+i$, the first row of $(A - (1+i)I)\\mathbf{v} = \\mathbf{0}$ gives $-(1+i)x + y = 0$, so $y = (1+i)x$; with $x = 1$, $y = 1+i$. Verify by multiplying out: $A(1, 1+i) = (1+i, 2i) = (1+i)(1, 1+i)$. The second coordinate is 1+i."
          - problem: "Let $A = \\begin{pmatrix}0&4\\\\-2&4\\end{pmatrix}$ and $\\lambda = 2+2i$. Find an eigenvector of $A$ for $\\lambda = 2+2i$ whose second coordinate is 1, and give its first coordinate in the form a + bi."
            answer: "1-i"
            answer_contract: {"kind": "exact"}
            solution_sketch: "For $A = [0,4;-2,4]$ and $\\lambda = 2+2i$, the first row of $(A - (2+2i)I)\\mathbf{v} = \\mathbf{0}$ gives $-(2+2i)x + 4y = 0$, so $x = 4y/(2+2i)$; with $y = 1$, $x = 2/(1+i) = 1-i$. Verify by multiplying out: $A(1-i, 1) = (4, 2+2i) = (2+2i)(1-i, 1)$. The first coordinate is 1-i."
        constraints: "entries among 1, i, -i, 1 +- i; verify by multiplying out"
    diagnostic_exemplar:
      problem: 'Find the eigenvalues of $A = \begin{pmatrix}2&-1\\1&2\end{pmatrix}$, an eigenvector for the eigenvalue with positive imaginary part, and the factor by which $A$ scales lengths.'
      answer: '$2 + i$ and $2 - i$; eigenvector $(1, -i)$ for $2 + i$ (any nonzero multiple); lengths scale by $|\lambda| = \sqrt{5}$'
      answer_contract: {kind: none}
      solution_sketch: '$\lambda^2 - 4\lambda + 5 = 0$ gives $2 \pm i$. For $2 + i$, the first row reads $-ix - y = 0$, so $(1, -i)$. The scaling factor is $|2 + i| = \sqrt5$.'
    anki_seeds:
      - front: 'Complex eigenvalues of a REAL matrix always come in...'
        back: 'conjugate pairs $a \pm bi$.'
        type: basic
      - front: 'A real $2 \times 2$ matrix with eigenvalues $a \pm bi$ ($b \neq 0$) is similar to...'
        back: 'a rotation combined with scaling by $|\lambda| = \sqrt{a^2 + b^2}$ — i.e. in a suitable basis it acts that way (in the standard basis it generally does not scale lengths by $|\lambda|$).'
        type: basic

  - id: similar-matrices
    name: Similar Matrices
    core: true
    difficulty: 0.7
    drill: false
    answer_kind: numeric
    expected_time_secs: 180
    prerequisites:
      - id: matrix-inverses
        weight: 0.6
        key: true
      - id: eigenvalues-eigenvectors
        weight: 0.5
      - id: determinant-properties-cramers-rule
        weight: 0.3
      - id: matrix-representation-in-basis   # re-audit R-38: similarity is "the same map in two bases" — the representation fact now taught below
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: The similarity relation
        key_prerequisites: [matrix-inverses]
        exemplars:
          - problem: 'With $P = \begin{pmatrix}1&1\\0&1\end{pmatrix}$ and $A = \begin{pmatrix}2&1\\0&3\end{pmatrix}$, compute $P^{-1}AP$.'
            answer: "[2,0;0,3]"
            answer_contract: {"cols":2,"kind":"matrix","rows":2}
            solution_sketch: '$P^{-1} = \begin{pmatrix}1&-1\\0&1\end{pmatrix}$; $AP = \begin{pmatrix}2&3\\0&3\end{pmatrix}$, then $P^{-1}(AP) = \begin{pmatrix}2&0\\0&3\end{pmatrix}$. So $A$ is similar to a diagonal matrix.'
          - problem: "Let $P = \\begin{pmatrix}1&2\\\\0&1\\end{pmatrix}$ and $A = \\begin{pmatrix}4&1\\\\0&2\\end{pmatrix}$. Compute $P^{-1}AP$. Give the matrix as [a,b;c,d]."
            answer: "[4,5;0,2]"
            answer_contract: {"cols": 2, "kind": "matrix", "rows": 2}
            solution_sketch: "Step 1 (inverse of a unit upper triangular matrix): with $P = \\begin{pmatrix}1&2\\\\0&1\\end{pmatrix}$, $P^{-1} = \\begin{pmatrix}1&-2\\\\0&1\\end{pmatrix}$ since the determinant is 1. Step 2 (matrix multiplication): $AP = \\begin{pmatrix}4&1\\\\0&2\\end{pmatrix}\\begin{pmatrix}1&2\\\\0&1\\end{pmatrix} = \\begin{pmatrix}4&9\\\\0&2\\end{pmatrix}$. Step 3 (matrix multiplication): $P^{-1}(AP) = \\begin{pmatrix}1&-2\\\\0&1\\end{pmatrix}\\begin{pmatrix}4&9\\\\0&2\\end{pmatrix} = \\begin{pmatrix}4&5\\\\0&2\\end{pmatrix}$. The answer is [4,5;0,2]."
          - problem: "Let $P = \\begin{pmatrix}1&0\\\\3&1\\end{pmatrix}$ and $A = \\begin{pmatrix}3&2\\\\0&4\\end{pmatrix}$. Compute $P^{-1}AP$. Give the matrix as [a,b;c,d]."
            answer: "[9,2;-15,-2]"
            answer_contract: {"cols": 2, "kind": "matrix", "rows": 2}
            solution_sketch: "Step 1 (inverse of a unit lower triangular matrix): with $P = \\begin{pmatrix}1&0\\\\3&1\\end{pmatrix}$, $P^{-1} = \\begin{pmatrix}1&0\\\\-3&1\\end{pmatrix}$ since the determinant is 1. Step 2 (matrix multiplication): $AP = \\begin{pmatrix}3&2\\\\0&4\\end{pmatrix}\\begin{pmatrix}1&0\\\\3&1\\end{pmatrix} = \\begin{pmatrix}9&2\\\\12&4\\end{pmatrix}$. Step 3 (matrix multiplication): $P^{-1}(AP) = \\begin{pmatrix}1&0\\\\-3&1\\end{pmatrix}\\begin{pmatrix}9&2\\\\12&4\\end{pmatrix} = \\begin{pmatrix}9&2\\\\-15&-2\\end{pmatrix}$. The answer is [9,2;-15,-2]."
          - problem: "Let $P = \\begin{pmatrix}1&-1\\\\0&1\\end{pmatrix}$ and $A = \\begin{pmatrix}2&3\\\\1&4\\end{pmatrix}$. Compute $P^{-1}AP$. Give the matrix as [a,b;c,d]."
            answer: "[3,4;1,3]"
            answer_contract: {"cols": 2, "kind": "matrix", "rows": 2}
            solution_sketch: "Step 1 (inverse of a unit upper triangular matrix): with $P = \\begin{pmatrix}1&-1\\\\0&1\\end{pmatrix}$, $P^{-1} = \\begin{pmatrix}1&1\\\\0&1\\end{pmatrix}$ since the determinant is 1. Step 2 (matrix multiplication): $AP = \\begin{pmatrix}2&3\\\\1&4\\end{pmatrix}\\begin{pmatrix}1&-1\\\\0&1\\end{pmatrix} = \\begin{pmatrix}2&1\\\\1&3\\end{pmatrix}$. Step 3 (matrix multiplication): $P^{-1}(AP) = \\begin{pmatrix}1&1\\\\0&1\\end{pmatrix}\\begin{pmatrix}2&1\\\\1&3\\end{pmatrix} = \\begin{pmatrix}3&4\\\\1&3\\end{pmatrix}$. Note the conjugate of a dense matrix stays dense. The answer is [3,4;1,3]."
          - problem: "The matrix $B = \\begin{pmatrix}2&0\\\\0&7\\end{pmatrix}$ satisfies $B = P^{-1}AP$ with $P = \\begin{pmatrix}1&3\\\\0&1\\end{pmatrix}$. Find $A$. Give the matrix as [a,b;c,d]."
            answer: "[2,15;0,7]"
            answer_contract: {"cols": 2, "kind": "matrix", "rows": 2}
            solution_sketch: "Step 1 (rearrange the similarity relation): $B = P^{-1}AP$ gives $A = PBP^{-1}$; with $P = \\begin{pmatrix}1&3\\\\0&1\\end{pmatrix}$, $P^{-1} = \\begin{pmatrix}1&-3\\\\0&1\\end{pmatrix}$. Step 2 (matrix multiplication): $BP^{-1} = \\begin{pmatrix}2&0\\\\0&7\\end{pmatrix}\\begin{pmatrix}1&-3\\\\0&1\\end{pmatrix} = \\begin{pmatrix}2&-6\\\\0&7\\end{pmatrix}$. Step 3 (matrix multiplication): $A = P(BP^{-1}) = \\begin{pmatrix}1&3\\\\0&1\\end{pmatrix}\\begin{pmatrix}2&-6\\\\0&7\\end{pmatrix} = \\begin{pmatrix}2&15\\\\0&7\\end{pmatrix}$. The answer is [2,15;0,7]."
          - problem: "Which condition on a matrix $P$ makes $B$ similar to $A$? Select the correct relation."
            answer: "B = P^(-1)AP for some invertible P"
            answer_contract: {"kind": "label", "options": [["B = P^(-1)AP for some invertible P"], ["B = AP^(-1) for some invertible P"], ["B = PAP for some invertible P"], ["B = PA for some invertible P"]]}
            solution_sketch: "Step 1 (definition recall): $B$ is similar to $A$ exactly when $B = P^{-1}AP$ for some invertible matrix $P$, the defining relation of this KP. Step 2 (distractor check): the option B = AP^(-1) for some invertible P reverses the order of the three factors; the option B = PAP for some invertible P drops the inverse on the conjugating factor; the option B = PA for some invertible P multiplies on the left only and omits the right factor. The answer is B = P^(-1)AP for some invertible P."
        constraints: "2x2 with P triangular with determinant 1 so the inverse is immediate"
      - id: kp2
        name: Similarity invariants
        key_prerequisites: [eigenvalues-eigenvectors, determinant-properties-cramers-rule]
        exemplars:
          - problem: "Suppose $B$ is similar to $A$, with $\\det A = 12$ and $\\operatorname{tr} A = 1$. Give $\\det B$ and $\\operatorname{tr} B$."
            answer: "detB = 12; trB = 1"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "detB"}, {"contract": {"kind": "exact"}, "name": "trB"}]}
            solution_sketch: "Step 1 (similarity invariants): if $B = P^{-1}AP$ then $\\det B = \\det(P^{-1})\\det(A)\\det(P) = \\det A$, and trace satisfies $\\operatorname{tr}(P^{-1}AP) = \\operatorname{tr}(A P P^{-1}) = \\operatorname{tr} A$. Step 2 (read off): $\\det B = 12$ and $\\operatorname{tr} B = 1$. The answer is detB = 12; trB = 1."
          - problem: "Let $B$ be similar to $A$, and the eigenvalues of $A$ are $2$ and $7$. State whether $2$ must be an eigenvalue of $B$, and give $\\det B$."
            answer: "verdict = yes; detB = 14"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["yes"], ["no"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "detB"}]}
            solution_sketch: "Step 1 (eigenvalue invariance): similar matrices have the same eigenvalues, since $Av = \\lambda v$ gives $B(P^{-1}v) = \\lambda(P^{-1}v)$; so 2 is an eigenvalue of $B$, and the option no would be the error of forgetting the eigenvalues transfer. Step 2 (determinant invariance): $\\det B = \\det A = 2 \\cdot 7 = 14$. The answer is verdict = yes; detB = 14."
          - problem: "Let $A = \\begin{pmatrix}4&1\\\\0&3\\end{pmatrix}$ and $P = \\begin{pmatrix}1&2\\\\0&1\\end{pmatrix}$, and set $B = P^{-1}AP$. Compute $B$ and give the matrix as [a,b;c,d]."
            answer: "[4,3;0,3]"
            answer_contract: {"cols": 2, "kind": "matrix", "rows": 2}
            solution_sketch: "Step 1 (matrix inverse): $\\det P = 1$, so $P^{-1} = \\begin{pmatrix}1&-2\\\\0&1\\end{pmatrix}$. Step 2 (matrix multiplication): $AP = \\begin{pmatrix}4&9\\\\0&3\\end{pmatrix}$, then $P^{-1}AP = \\begin{pmatrix}4&3\\\\0&3\\end{pmatrix}$. The answer is [4,3;0,3]."
          - problem: "Matrices $A$ and $B$ are similar, with $\\operatorname{tr} A = 5$ and $\\det A = 6$. Find the larger eigenvalue of $B$."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (invariance of eigenvalues): $B$ has the same eigenvalues as $A$, so work with $A$. Step 2 (characteristic polynomial): $t^2 - 5t + 6 = (t-2)(t-3)$, so the eigenvalues are 2 and 3. The larger eigenvalue of $B$ is 3."
          - problem: "A square matrix $B$ is similar to a square matrix $A$, so $B = P^{-1}AP$ for some invertible matrix $P$. Some features of $A$ carry over to $B$ exactly, while others can change. Select the feature that is guaranteed to carry over unchanged."
            answer: "eigenvalues"
            answer_contract: {"kind": "label", "options": [["eigenvalues"], ["eigenvectors"], ["diagonal entries"], ["row space"]]}
            solution_sketch: "Step 1 (similarity invariants): under the full relation $B = P^{-1}AP$, the eigenvalues are preserved, because an equation $Av = cv$ for $A$ gives $B(P^{-1}v) = c(P^{-1}v)$ for $B$. Step 2 (what changes): the option eigenvectors names the error of forgetting that the eigenvector becomes $P^{-1}v$, usually a different vector; the option diagonal entries names the error of assuming conjugation keeps the main diagonal fixed, which changes of basis disprove; the option row space names the error of confusing the preserved rank with the row space itself, which can rotate under a change of basis. The feature guaranteed to carry over unchanged is eigenvalues."
          - problem: "Let $A = \\begin{pmatrix}5&2\\\\0&3\\end{pmatrix}$ and let $B$ be similar to $A$. Find the characteristic polynomial of $B$ in the variable $t$."
            answer: "t^2-8t+15"
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: "Step 1 (invariance of the characteristic polynomial): similar matrices have equal characteristic polynomials, so compute it for $A$. Step 2 (determinant of $tI - A$): $\\det\\begin{pmatrix}t-5&-2\\\\0&t-3\\end{pmatrix} = (t-5)(t-3) = t^2 - 8t + 15$. The characteristic polynomial of $B$ is t^2-8t+15."
        constraints: "given data are small integers; ask which quantities transfer"
      - id: kp3
        name: Ruling out similarity
        key_prerequisites: [eigenvalues-eigenvectors, determinant-properties-cramers-rule]
        exemplars:
          - problem: "Let A = [2,0;0,3] and B = [1,0;0,6]. A nonzero gap in any similarity invariant rules out similarity. Answer yes or no: state whether the matrices can be similar, and give the absolute difference of their traces."
            answer: "verdict = no; tracegap = 2"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["yes"], ["no"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "tracegap"}]}
            solution_sketch: "Step 1: the trace of A = [2,0;0,3] is 2 + 3 = 5. Step 2: the trace of B = [1,0;0,6] is 1 + 6 = 7. Step 3: the trace is unchanged under similarity, so the gap 7 - 5 = 2 rules out similarity; the option yes is wrong because it ignores the trace mismatch. The answer is verdict = no; tracegap = 2."
          - problem: "Two 2x2 matrices have the same trace 4, but their determinants are 3 and 4. The trace alone cannot decide here. Answer yes or no: state whether the matrices can be similar, and give the absolute difference of their determinants."
            answer: "verdict = no; detgap = 1"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["yes"], ["no"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "detgap"}]}
            solution_sketch: "Step 1: the traces agree, both equal to 4, so the trace gives no verdict. Step 2: the determinants are 3 and 4. Step 3: the determinant is a similarity invariant, so the gap 4 - 3 = 1 rules out similarity; the option yes is wrong because it checks only the matching trace. The answer is verdict = no; detgap = 1."
          - problem: "Let A = [2,1;1,3] and B = [2,0;0,4]. Similar matrices must share every similarity invariant. Answer yes or no: state whether the matrices can be similar, and give the absolute difference of their determinants."
            answer: "verdict = no; detgap = 3"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["yes"], ["no"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "detgap"}]}
            solution_sketch: "Step 1: det(A) = 2*3 - 1*1 = 5. Step 2: det(B) = 2*4 - 0*0 = 8. Step 3: the determinant is unchanged under similarity, so the gap 8 - 5 = 3 rules out similarity; the option yes is wrong because it ignores the determinant mismatch. The answer is verdict = no; detgap = 3."
          - problem: "Let A = [4,1;2,3] and B = [6,0;0,k]. If A and B were similar, their traces would agree. Find the value of k that the traces require, answer yes or no whether the matrices can then be similar, and give the absolute difference of their determinants."
            answer: "k = 1; verdict = no; detgap = 4"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "k"}, {"contract": {"kind": "label", "options": [["yes"], ["no"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "detgap"}]}
            solution_sketch: "Step 1: trace(A) = 4 + 3 = 7, and the trace condition on B = [6,0;0,k] gives 6 + k = 7, so k = 1. Step 2: with k = 1, det(B) = 6, while det(A) = 4*3 - 1*2 = 10. Step 3: the determinant is a similarity invariant, so the gap 10 - 6 = 4 rules out similarity; the option yes is wrong because a matching trace alone does not force similarity. The answer is k = 1; verdict = no; detgap = 4."
          - problem: "Let A = [2,1;0,6] and B = [3,1;0,4]; the eigenvalues of each upper triangular matrix are its diagonal entries. A mismatch between eigenvalue sets rules out similarity. Find the absolute difference of the larger eigenvalues of A and B."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: A is upper triangular, so its eigenvalues are 2 and 6, and its larger eigenvalue is 6. Step 2: B is upper triangular, so its eigenvalues are 3 and 4, and its larger eigenvalue is 4. Step 3: eigenvalues are similarity invariants, and the gap 6 - 4 = 2 rules out similarity. The answer is 2."
          - problem: "Matrix A has eigenvalues 2 and 5, and matrix B has eigenvalues 1 and 9. The determinant of a matrix equals the product of its eigenvalues and is a similarity invariant. Find the absolute difference of the determinants of A and B."
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: the determinant of A is the product of its eigenvalues, 2 * 5 = 10. Step 2: the determinant of B is the product of its eigenvalues, 1 * 9 = 9. Step 3: the determinant is a similarity invariant, and the gap 10 - 9 = 1 rules out similarity. The answer is 1."
        constraints: "decide via a mismatched invariant (trace, determinant, or eigenvalues)"
    diagnostic_exemplar:
      problem: 'With $P = \begin{pmatrix}1&1\\0&1\end{pmatrix}$ and $A = \begin{pmatrix}3&1\\0&5\end{pmatrix}$, compute $B = P^{-1}AP$. Can $B$ be similar to $\begin{pmatrix}2&0\\0&6\end{pmatrix}$?'
      answer: '$B = \begin{pmatrix}3&-1\\0&5\end{pmatrix}$; no, since $\det B = 15$ while the other matrix has determinant $12$, and similar matrices share trace and determinant'
      answer_contract: {kind: none}
      solution_sketch: '$P^{-1} = \begin{pmatrix}1&-1\\0&1\end{pmatrix}$ and $AP = \begin{pmatrix}3&4\\0&5\end{pmatrix}$, so $B = \begin{pmatrix}3&-1\\0&5\end{pmatrix}$; both matrices have trace $8$, but the determinants $15$ and $12$ differ.'
    anki_seeds:
      - front: '$B$ is similar to $A$ means...'
        back: '$B = P^{-1}AP$ for some invertible $P$.'
        type: basic
      - front: 'Four quantities shared by similar matrices?'
        back: 'Determinant, trace, characteristic polynomial, eigenvalues.'
        type: basic

  - id: diagonalizability-check
    name: Checking Diagonalizability
    core: true
    difficulty: 0.7
    drill: false
    answer_kind: numeric
    expected_time_secs: 180
    prerequisites:
      - id: eigenspaces-multiplicities
        weight: 0.7
        key: true
      - id: eigenvalues-eigenvectors
        weight: 0.5
    knowledge_points:
      - id: kp1
        name: The distinct-eigenvalue guarantee
        key_prerequisites: [eigenvalues-eigenvectors]
        exemplars:
          - problem: "A $2 \\times 2$ matrix has eigenvalues $-2$ and $7$. The distinct-eigenvalue guarantee says that $n$ distinct eigenvalues give $n$ independent eigenvectors. State the verdict on diagonalizability and the number of independent eigenvectors that the guarantee provides."
            answer: "verdict = yes; eigenvectors = 2"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["yes"], ["no"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "eigenvectors"}]}
            solution_sketch: "Step 1 (spectrum check): the full spectrum is {-2, 7}, which gives 2 distinct eigenvalues for a matrix of size 2. Step 2 (distinct-eigenvalue guarantee): 2 distinct eigenvalues give 2 independent eigenvectors, so the verdict is yes; the option no ignores the guarantee for distinct eigenvalues. Step 3 (count): the guarantee provides 2 independent eigenvectors. The answer is verdict = yes; eigenvectors = 2."
          - problem: "Let $A = \\begin{pmatrix}1&4\\\\0&3\\end{pmatrix}$. A triangular matrix has its diagonal entries as eigenvalues. Give the verdict on diagonalizability together with the smaller and the larger eigenvalue of $A$."
            answer: "verdict = yes; low = 1; high = 3"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["yes"], ["no"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "low"}, {"contract": {"kind": "exact"}, "name": "high"}]}
            solution_sketch: "Step 1 (triangular spectrum): A = [[1,4],[0,3]] is upper triangular, so its eigenvalues are the diagonal entries 1 and 3. Step 2 (distinct-eigenvalue guarantee): 1 and 3 are distinct, so A is diagonalizable; the option no would forget that distinct diagonal entries are distinct eigenvalues. Step 3 (order): the smaller eigenvalue is 1 and the larger is 3. The answer is verdict = yes; low = 1; high = 3."
          - problem: "Let $B = \\begin{pmatrix}2&1&5\\\\0&-3&4\\\\0&0&6\\end{pmatrix}$. The eigenvalues of a triangular matrix are its diagonal entries. How many independent eigenvectors does the distinct-eigenvalue guarantee provide for $B$?"
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (triangular spectrum): B = [[2,1,5],[0,-3,4],[0,0,6]] is upper triangular, so its eigenvalues are the diagonal entries 2, -3 and 6. Step 2 (distinct count): all three eigenvalues are distinct. Step 3 (distinct-eigenvalue guarantee): a 3x3 matrix with 3 distinct eigenvalues has 3 independent eigenvectors. The answer is 3."
          - problem: "A $2 \\times 2$ matrix has eigenvalues $5$ and $k$, and its trace is $3$. The distinct-eigenvalue guarantee applies to this matrix. Find $k$."
            answer: "-2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (trace property): the trace equals the sum of the eigenvalues, so 5 + k = 3. Step 2 (solve): k = -2. Step 3 (guarantee check): the eigenvalues 5 and -2 are distinct, which is consistent with the guarantee applying. The answer is -2."
          - problem: "A matrix of size $n$ with $n$ distinct eigenvalues has $n$ independent eigenvectors, which is exactly what diagonalizability needs. Give the smallest number of distinct eigenvalues that guarantees a $3 \\times 3$ matrix is diagonalizable."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (guarantee form): n distinct eigenvalues give n independent eigenvectors, and n independent eigenvectors in a space of dimension n span it. Step 2 (apply to n = 3): 3 distinct eigenvalues give 3 independent eigenvectors, so the matrix is diagonalizable, while 2 distinct eigenvalues do not reach 3. The answer is 3."
          - problem: "A $4 \\times 4$ matrix has eigenvalues $-4$, $0$, $6$ and $11$. How many independent eigenvectors does the distinct-eigenvalue guarantee provide?"
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (spectrum check): the full spectrum is {-4, 0, 6, 11}, so the matrix of size 4 has 4 distinct eigenvalues. Step 2 (distinct-eigenvalue guarantee): 4 distinct eigenvalues give 4 independent eigenvectors, one for each eigenvalue. The answer is 4."
        constraints: "distinct integer spectra read off from triangular matrices or given directly"
      - id: kp2
        name: Repeated eigenvalues need enough eigenvectors
        key_prerequisites: [eigenspaces-multiplicities]
        exemplars:
          - problem: "Let $A = \\begin{pmatrix}2&1\\\\0&2\\end{pmatrix}$. Determine whether $A$ is diagonalizable, and give the number of its independent eigenvectors."
            answer: "verdict = no; eigcount = 1"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["yes"], ["no"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "eigcount"}]}
            solution_sketch: "Step 1 (characteristic polynomial of a triangular matrix): for $A = \\begin{pmatrix}2&1\\\\0&2\\end{pmatrix}$ the only eigenvalue is $\\lambda = 2$, with algebraic multiplicity $2$. Step 2 (nullity of $A - 2I$): $A - 2I = \\begin{pmatrix}0&1\\\\0&0\\end{pmatrix}$ has rank $1$, so its null space has dimension $1$, spanned by $(1, 0)$. Step 3 (compare multiplicities): geometric multiplicity $1$ is less than algebraic multiplicity $2$, so $A$ is not diagonalizable; the verdict yes would need two independent eigenvectors, and there is only one. verdict = no; eigcount = 1."
          - problem: "Let $A = \\begin{pmatrix}6&0\\\\0&6\\end{pmatrix}$. Determine whether $A$ is diagonalizable, and give the number of its independent eigenvectors."
            answer: "verdict = yes; eigcount = 2"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["yes"], ["no"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "eigcount"}]}
            solution_sketch: "Step 1 (eigenvalues of a scalar matrix): for $A = \\begin{pmatrix}6&0\\\\0&6\\end{pmatrix}$ the only eigenvalue is $\\lambda = 6$, with algebraic multiplicity $2$. Step 2 (nullity of $A - 6I$): $A - 6I$ is the zero matrix, so its null space is all of $\\mathbb{R}^2$ and the geometric multiplicity is $2$. Step 3 (compare multiplicities): geometric multiplicity $2$ equals algebraic multiplicity $2$, so $A$ is diagonalizable; the verdict no would come from forgetting that a scalar matrix has a full two-dimensional eigenspace. verdict = yes; eigcount = 2."
          - problem: "Let $A = \\begin{pmatrix}1&-1\\\\1&3\\end{pmatrix}$. Determine whether $A$ is diagonalizable, and give the number of its independent eigenvectors."
            answer: "verdict = no; eigcount = 1"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["yes"], ["no"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "eigcount"}]}
            solution_sketch: "Step 1 (characteristic polynomial): for $A = \\begin{pmatrix}1&-1\\\\1&3\\end{pmatrix}$, $\\det(A - \\lambda I) = \\lambda^2 - 4\\lambda + 4 = (\\lambda - 2)^2$, so $\\lambda = 2$ has algebraic multiplicity $2$. Step 2 (nullity of $A - 2I$): $A - 2I = \\begin{pmatrix}-1&-1\\\\1&1\\end{pmatrix}$ has rank $1$, so the eigenspace has dimension $1$. Step 3 (compare multiplicities): geometric multiplicity $1$ is less than algebraic multiplicity $2$, so $A$ is not diagonalizable; the verdict yes would need nullity $2$, which fails here. verdict = no; eigcount = 1."
          - problem: "Let $A = \\begin{pmatrix}4&1\\\\c&4\\end{pmatrix}$, where $c$ is a real number. For every value of $c$ except one, $A$ is diagonalizable. Find the value of $c$ for which $A$ is not diagonalizable."
            answer: "0"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (distinct eigenvalues case): for $c \\neq 0$ the characteristic polynomial $\\lambda^2 - 8\\lambda + (16 - c)$ has discriminant $4c$, so $A$ has two distinct eigenvalues and is diagonalizable. Step 2 (repeated case): for $c = 0$ the only eigenvalue is $\\lambda = 4$ with algebraic multiplicity $2$. Step 3 (compare multiplicities): $A - 4I = \\begin{pmatrix}0&1\\\\0&0\\end{pmatrix}$ has rank $1$, so the geometric multiplicity is $1$, less than the algebraic multiplicity $2$, and $A$ fails to be diagonalizable only at this value. So $c = 0$."
          - problem: "Let $A = \\begin{pmatrix}7&0\\\\-2&7\\end{pmatrix}$. Determine whether $A$ is diagonalizable, and give the number of its independent eigenvectors."
            answer: "verdict = no; eigcount = 1"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["yes"], ["no"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "eigcount"}]}
            solution_sketch: "Step 1 (eigenvalues of a triangular matrix): $A = \\begin{pmatrix}7&0\\\\-2&7\\end{pmatrix}$ is lower triangular, so its only eigenvalue is $\\lambda = 7$ with algebraic multiplicity $2$. Step 2 (nullity of $A - 7I$): $A - 7I = \\begin{pmatrix}0&0\\\\-2&0\\end{pmatrix}$ has rank $1$, so the eigenspace is one-dimensional, spanned by $(0, 1)$. Step 3 (compare multiplicities): geometric multiplicity $1$ is less than algebraic multiplicity $2$, so $A$ is not diagonalizable; the verdict yes would need two independent eigenvectors, and there is only one. verdict = no; eigcount = 1."
          - problem: "Let $A = \\begin{pmatrix}-1&3\\\\0&-1\\end{pmatrix}$. The matrix has one repeated eigenvalue. Find the geometric multiplicity of this eigenvalue."
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (eigenvalues of a triangular matrix): $A = \\begin{pmatrix}-1&3\\\\0&-1\\end{pmatrix}$ has the single eigenvalue $\\lambda = -1$ with algebraic multiplicity $2$. Step 2 (nullity of $A - \\lambda I$): $A - (-1)I = A + I = \\begin{pmatrix}0&3\\\\0&0\\end{pmatrix}$ has rank $1$, so its null space has dimension $1$. Step 3 (geometric multiplicity): the geometric multiplicity is the nullity of $A - \\lambda I$. The geometric multiplicity is 1."
        constraints: "repeated-eigenvalue 2x2 cases; decide by comparing geometric and algebraic multiplicity"
      - id: kp3
        name: Counting eigenvectors in 3x3 matrices
        key_prerequisites: [eigenspaces-multiplicities]
        exemplars:
          - problem: 'Is $A = \begin{pmatrix}2&0&0\\0&2&1\\0&0&3\end{pmatrix}$ diagonalizable?'
            answer: "Yes"
            answer_contract: {"kind":"label","options":[["yes"],["no"]]}
            solution_sketch: '$\lambda = 2$ has geometric multiplicity $2$ (null space of $A - 2I$ is $\{(x, y, 0)\}$) and $\lambda = 3$ contributes one more: $2 + 1 = 3$ independent eigenvectors.'
          - problem: 'Is $A = \begin{pmatrix}2&1&0\\0&2&0\\0&0&3\end{pmatrix}$ diagonalizable?'
            answer: "No"
            answer_contract: {"kind":"label","options":[["yes"],["no"]]}
            solution_sketch: '$\lambda = 2$ has algebraic multiplicity $2$ but $A - 2I$ has rank $2$, so its eigenspace is $1$-dimensional: only $1 + 1 = 2$ independent eigenvectors in $\mathbb{R}^3$.'
        constraints: "3x3 triangular with one repeated eigenvalue; the answer hinges on one geometric multiplicity"
    diagnostic_exemplar:
      problem: 'Is $A = \begin{pmatrix}4&1&0\\0&4&0\\0&0&7\end{pmatrix}$ diagonalizable? Justify by counting independent eigenvectors.'
      answer: 'No: lambda = 4 has algebraic multiplicity 2 but only a one-dimensional eigenspace, so A has just 2 independent eigenvectors instead of 3'
      answer_contract: {kind: none}
      solution_sketch: 'The eigenvalues are $4, 4, 7$. $A - 4I$ has rows $(0,1,0)$, $(0,0,0)$, $(0,0,3)$, forcing $y = z = 0$, so the $\lambda = 4$ eigenspace is only $\mathrm{span}\{(1,0,0)\}$.'
    anki_seeds:
      - front: 'An $n \times n$ matrix with $n$ distinct eigenvalues is...'
        back: 'always diagonalizable.'
        type: basic
      - front: 'An $n \times n$ matrix is diagonalizable iff its geometric multiplicities...'
        back: 'sum to $n$ (each equals its algebraic multiplicity).'
        type: basic

  - id: diagonalization
    name: Diagonalization
    core: true
    difficulty: 0.75
    drill: false
    answer_kind: numeric
    expected_time_secs: 300
    prerequisites:
      - id: diagonalizability-check
        weight: 0.6
        key: true
      - id: finding-eigenvectors
        weight: 0.6
        key: true
      - id: matrix-inverses
        weight: 0.5
        key: true
      - id: matrix-powers
        weight: 0.3
      - id: similar-matrices
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: Building P and D
        key_prerequisites: [finding-eigenvectors, matrix-inverses]
        exemplars:
          - problem: "Diagonalize the matrix A = [3,1;1,3]: find its two eigenvalues and give the diagonal matrix D whose diagonal lists them in decreasing order. Give the matrix as [a,b;c,d]."
            answer: "[4,0;0,2]"
            answer_contract: {"cols": 2, "kind": "matrix", "rows": 2}
            solution_sketch: "Characteristic polynomial rule: det(A - λI) = (3-λ)^2 - 1 = λ^2 - 6λ + 8 = (λ-4)(λ-2), so the eigenvalues are 4 and 2. The diagonal of D carries the eigenvalues in the stated order. In decreasing order the diagonal is 4 then 2, so D = [4,0;0,2]."
          - problem: "Diagonalize the matrix A = [2,0;1,3]: give the matrix P whose first column is an eigenvector for the smaller eigenvalue and whose second column is an eigenvector for the larger eigenvalue, scaling each column so its first nonzero entry is positive. Give the matrix as [a,b;c,d]."
            answer: "[1,0;-1,1]"
            answer_contract: {"cols": 2, "kind": "matrix", "rows": 2}
            solution_sketch: "The matrix is triangular, so the eigenvalues are the diagonal entries 2 and 3 (eigenvalue rule). For λ = 2, solve (A - 2I)v = 0: the equation x + y = 0 gives v = (1,-1). For λ = 3, solve (A - 3I)v = 0: the equation -x = 0 gives v = (0,1). Both columns already have positive first nonzero entry, so P = [1,0;-1,1]."
          - problem: "Diagonalize the matrix A = [4,1;2,3]: give the matrix P whose columns are the eigenvectors for the eigenvalues in decreasing order, scaling each column so its first nonzero entry is positive. Give the matrix as [a,b;c,d]."
            answer: "[1,1;1,-2]"
            answer_contract: {"cols": 2, "kind": "matrix", "rows": 2}
            solution_sketch: "Characteristic polynomial rule: det(A - λI) = λ^2 - 7λ + 10 = (λ-5)(λ-2), so the eigenvalues are 5 and 2. For λ = 5, (A - 5I)v = 0 gives -x + y = 0, so v = (1,1). For λ = 2, (A - 2I)v = 0 gives 2x + y = 0, so v = (1,-2). Columns in decreasing eigenvalue order give P = [1,1;1,-2]."
          - problem: "Diagonalize the matrix A = [5,3;3,5] and give the two diagonal entries of D in decreasing order as (d1, d2)."
            answer: "(8,2)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "Characteristic polynomial rule: det(A - λI) = (5-λ)^2 - 9 = λ^2 - 10λ + 22... recompute as (5-λ)^2 - 9 = λ^2 - 10λ + 16 = (λ-8)(λ-2), so the eigenvalues are 8 and 2. Decreasing order puts 8 first, then 2. The diagonal entries of D in decreasing order are (8,2)."
          - problem: "Diagonalize the matrix A = [-1,2;2,-1]: find its two eigenvalues and give the diagonal matrix D whose diagonal lists them in increasing order. Give the matrix as [a,b;c,d]."
            answer: "[-3,0;0,1]"
            answer_contract: {"cols": 2, "kind": "matrix", "rows": 2}
            solution_sketch: "Characteristic polynomial rule: det(A - λI) = (-1-λ)^2 - 4 = λ^2 + 2λ - 3 = (λ+3)(λ-1), so the eigenvalues are -3 and 1. Increasing order lists -3 first, then 1. The diagonal matrix with these entries is D = [-3,0;0,1]."
          - problem: "Diagonalize the matrix A = [0,4;1,0]. If the columns of P are ordered by increasing eigenvalue, give the eigenvector that forms the second column of P, scaled so its first nonzero entry is positive, as (x, y)."
            answer: "(2,1)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "Characteristic polynomial rule: det(A - λI) = λ^2 - 4 = 0, so the eigenvalues are -2 and 2. Increasing order is -2 then 2, so the second column of P is the eigenvector for λ = 2. Solving (A - 2I)v = 0 gives -2x + 4y = 0, so x = 2y and a positive-scaling eigenvector is (2,1). The second column of P is (2,1)."
        constraints: "2x2 with two distinct integer eigenvalues; eigenvector entries in -2..2"
      - id: kp2
        name: Verifying by reassembly
        key_prerequisites: [matrix-inverses, similar-matrices]
        exemplars:
          - problem: 'Check the diagonalization $P = \begin{pmatrix}1&1\\1&-1\end{pmatrix}$, $D = \begin{pmatrix}3&0\\0&1\end{pmatrix}$ by computing $PDP^{-1}$.'
            answer: "[2,1;1,2]"
            answer_contract: {"cols":2,"kind":"matrix","rows":2}
            solution_sketch: '$P^{-1} = \frac{1}{2}\begin{pmatrix}1&1\\1&-1\end{pmatrix}$; $PD = \begin{pmatrix}3&1\\3&-1\end{pmatrix}$, and $PDP^{-1} = \begin{pmatrix}2&1\\1&2\end{pmatrix}$.'
          - problem: "Check the diagonalization P = [2,1;1,1], D = [4,0;0,1] by computing P D P^{-1}. Give the matrix as [a,b;c,d]."
            answer: "[7,-6;3,-2]"
            answer_contract: {"cols": 2, "kind": "matrix", "rows": 2}
            solution_sketch: "Compute the inverse of P first: det(P) = 1, so P^{-1} = [1,-1;-1,2]. Multiply P by D to get [8,1;4,1]. Then multiply by P^{-1}: [8,1;4,1] [1,-1;-1,2] = [7,-6;3,-2]. The reassembled matrix is [7,-6;3,-2]."
          - problem: "Check the diagonalization P = [1,2;0,1], D = [5,0;0,2] by computing P D P^{-1}. Give the matrix as [a,b;c,d]."
            answer: "[5,-6;0,2]"
            answer_contract: {"cols": 2, "kind": "matrix", "rows": 2}
            solution_sketch: "Since P is triangular, det(P) = 1 and P^{-1} = [1,-2;0,1]. Multiply P by D to get [5,4;0,2]. Then multiply by P^{-1}: [5,4;0,2] [1,-2;0,1] = [5,-6;0,2]. The reassembled matrix is [5,-6;0,2]."
          - problem: "A diagonalization A = P D P^{-1} can be checked without computing P^{-1}. Which condition is equivalent to A = P D P^{-1} and also rules out P = 0? Select the correct condition."
            answer: "AP = PD and P invertible"
            answer_contract: {"kind": "label", "options": [["AP = PD and P invertible"], ["AP = PD and P has a zero column"], ["PA = DP and P is invertible"], ["PDP = A and P has no inverse"]]}
            solution_sketch: "Multiply A = P D P^{-1} on the right by P to get A P = P D. This is the reassembly check. The option AP = PD and P has a zero column is wrong because a zero column would make P singular, and the condition needed is that P is invertible. The option PA = DP and P is invertible reverses the order of the factors and is false in general. The option PDP = A and P has no inverse places the factors on the wrong sides and concedes that P is not invertible. The correct condition is AP = PD and P invertible."
          - problem: "Reassemble the matrix from P = [3,1;1,1] and D = [4,0;0,2] by computing P D P^{-1}. Give the matrix as [a,b;c,d]."
            answer: "[5,-3;1,1]"
            answer_contract: {"cols": 2, "kind": "matrix", "rows": 2}
            solution_sketch: "Compute P^{-1}: det(P) = 2, so P^{-1} = [1/2,-1/2;-1/2,3/2]. Multiply P by D to get [12,2;4,2]. Then multiply by P^{-1}: [12,2;4,2] [1/2,-1/2;-1/2,3/2] = [5,-3;1,1]. The reassembled matrix is [5,-3;1,1]."
          - problem: "Let P = [1,1;2,1] and D = [6,0;0,3]. Find the entry in row 1, column 2 of P D P^{-1}."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Compute the inverse of P: det(P) = -1, so P^{-1} = [-1,1;2,-1]. Multiply P by D to get [6,3;12,3]. Then multiply by P^{-1}: [6,3;12,3] [-1,1;2,-1] = [0,3;-6,9]. The entry in row 1, column 2 is 3."
        constraints: "2x2 with det P = +-2 or +-1 so P^{-1} is quick; always land back on A exactly"
      - id: kp3
        name: Powers via diagonalization
        key_prerequisites: [matrix-inverses, diagonalizability-check, matrix-powers]
        exemplars:
          - problem: 'Using $A = PDP^{-1}$ with $P = \begin{pmatrix}1&1\\0&1\end{pmatrix}$, $D = \begin{pmatrix}1&0\\0&2\end{pmatrix}$, compute $A^3$.'
            answer: "[1,7;0,8]"
            answer_contract: {"cols":2,"kind":"matrix","rows":2}
            solution_sketch: '$A^3 = PD^3P^{-1}$ with $D^3 = \mathrm{diag}(1, 8)$ and $P^{-1} = \begin{pmatrix}1&-1\\0&1\end{pmatrix}$; multiply out.'
          - problem: "If $A = PDP^{-1}$ with $D = \\begin{pmatrix}2&0\\\\0&3\\end{pmatrix}$, what is $D^4$? Give the matrix as [a,b;c,d]."
            answer: "[16,0;0,81]"
            answer_contract: {"cols": 2, "kind": "matrix", "rows": 2}
            solution_sketch: "Full object: $D = \\begin{pmatrix}2&0\\\\0&3\\end{pmatrix}$. Step 1 (power of a diagonal matrix): raise each diagonal entry to the 4th power, $2^4 = 16$ and $3^4 = 81$; the off-diagonal zeros stay zero. Step 2: collect the entries, $D^4 = \\begin{pmatrix}16&0\\\\0&81\\end{pmatrix}$. The key is [16,0;0,81]."
          - problem: "Using $A = PDP^{-1}$ with $P = \\begin{pmatrix}1&2\\\\0&1\\end{pmatrix}$, $D = \\begin{pmatrix}2&0\\\\0&-1\\end{pmatrix}$, compute $A^3$. Give the matrix as [a,b;c,d]."
            answer: "[8,-18;0,-1]"
            answer_contract: {"cols": 2, "kind": "matrix", "rows": 2}
            solution_sketch: "Full factorization: $A^3 = PD^3P^{-1}$ with $P = \\begin{pmatrix}1&2\\\\0&1\\end{pmatrix}$ and $D = \\begin{pmatrix}2&0\\\\0&-1\\end{pmatrix}$. Step 1 (power of a diagonal matrix): $D^3 = \\begin{pmatrix}8&0\\\\0&-1\\end{pmatrix}$. Step 2 (2x2 inverse formula): $P^{-1} = \\begin{pmatrix}1&-2\\\\0&1\\end{pmatrix}$. Step 3 (matrix multiplication): $PD^3 = \\begin{pmatrix}8&-2\\\\0&-1\\end{pmatrix}$, then $\\begin{pmatrix}8&-2\\\\0&-1\\end{pmatrix}\\begin{pmatrix}1&-2\\\\0&1\\end{pmatrix} = \\begin{pmatrix}8&-18\\\\0&-1\\end{pmatrix}$. The key is [8,-18;0,-1]."
          - problem: "Using $A = PDP^{-1}$ with $P = \\begin{pmatrix}1&0\\\\3&1\\end{pmatrix}$, $D = \\begin{pmatrix}3&0\\\\0&2\\end{pmatrix}$, compute $A^4$. Give the matrix as [a,b;c,d]."
            answer: "[81,0;195,16]"
            answer_contract: {"cols": 2, "kind": "matrix", "rows": 2}
            solution_sketch: "Full factorization: $A^4 = PD^4P^{-1}$ with $P = \\begin{pmatrix}1&0\\\\3&1\\end{pmatrix}$, $D = \\begin{pmatrix}3&0\\\\0&2\\end{pmatrix}$. Step 1 (power of a diagonal matrix): $D^4 = \\mathrm{diag}(81,16)$. Step 2 (2x2 inverse formula): $P^{-1} = \\begin{pmatrix}1&0\\\\-3&1\\end{pmatrix}$. Step 3 (matrix multiplication): $PD^4 = \\begin{pmatrix}81&0\\\\243&16\\end{pmatrix}$, so $PD^4P^{-1} = \\begin{pmatrix}81&0\\\\243-48&16\\end{pmatrix} = \\begin{pmatrix}81&0\\\\195&16\\end{pmatrix}$. The key is [81,0;195,16]."
          - problem: "The matrix $A = \\begin{pmatrix}3&1\\\\-2&0\\end{pmatrix}$ has eigenvector $(1,-1)$ for eigenvalue $2$ and eigenvector $(1,-2)$ for eigenvalue $1$. Use the diagonalization $A = PDP^{-1}$ to compute $A^3$. Give the matrix as [a,b;c,d]."
            answer: "[15,7;-14,-6]"
            answer_contract: {"cols": 2, "kind": "matrix", "rows": 2}
            solution_sketch: "Full object: $A = \\begin{pmatrix}3&1\\\\-2&0\\end{pmatrix}$ with eigenvalues $2, 1$ and eigenvectors $(1,-1), (1,-2)$. Step 1 (diagonalization): $P = \\begin{pmatrix}1&1\\\\-1&-2\\end{pmatrix}$, $D = \\mathrm{diag}(2,1)$, and since $\\det P = -1$, $P^{-1} = \\begin{pmatrix}2&1\\\\-1&-1\\end{pmatrix}$. Step 2 (power of a diagonal matrix): $D^3 = \\mathrm{diag}(8,1)$. Step 3 (matrix multiplication): $PD^3 = \\begin{pmatrix}8&1\\\\-8&-2\\end{pmatrix}$, so $PD^3P^{-1} = \\begin{pmatrix}16-1&8-1\\\\-16+2&-8+2\\end{pmatrix} = \\begin{pmatrix}15&7\\\\-14&-6\\end{pmatrix}$. The key is [15,7;-14,-6]."
          - problem: "Using $A = PDP^{-1}$ with $P = \\begin{pmatrix}1&0\\\\2&1\\end{pmatrix}$ and $D = \\begin{pmatrix}-1&0\\\\0&2\\end{pmatrix}$, find the entry in row 2, column 1 of $A^4$."
            answer: "-30"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Full factorization: $A^4 = PD^4P^{-1}$ with $P = \\begin{pmatrix}1&0\\\\2&1\\end{pmatrix}$, $D = \\begin{pmatrix}-1&0\\\\0&2\\end{pmatrix}$. Step 1 (power of a diagonal matrix): $D^4 = \\mathrm{diag}(1,16)$. Step 2 (2x2 inverse formula): $P^{-1} = \\begin{pmatrix}1&0\\\\-2&1\\end{pmatrix}$. Step 3 (matrix multiplication): $PD^4 = \\begin{pmatrix}1&0\\\\2&16\\end{pmatrix}$, so $PD^4P^{-1} = \\begin{pmatrix}1&0\\\\2-32&16\\end{pmatrix} = \\begin{pmatrix}1&0\\\\-30&16\\end{pmatrix}$. The row 2, column 1 entry is $-30$, so the key is -30."
        constraints: "exponents 3-5; diagonal entries in -2..3 so powers stay small"
    diagnostic_exemplar:
      problem: 'Diagonalize $A = \begin{pmatrix}2&1\\1&2\end{pmatrix}$ as $A = PDP^{-1}$, then use the factorization to compute $A^3$.'
      answer: '$P = \begin{pmatrix}1&1\\1&-1\end{pmatrix}$, $D = \begin{pmatrix}3&0\\0&1\end{pmatrix}$ (columns of $P$ may be scaled; their order must match $D$); $A^3 = PD^3P^{-1} = \begin{pmatrix}14&13\\13&14\end{pmatrix}$'
      answer_contract: {kind: none}
      solution_sketch: 'The eigenpairs are $3$ with $(1, 1)$ and $1$ with $(1, -1)$; $D^3 = \mathrm{diag}(27, 1)$, and reassembling gives $\begin{pmatrix}14&13\\13&14\end{pmatrix}$.'
    anki_seeds:
      - front: 'In $A = PDP^{-1}$, what are the columns of $P$ and the entries of $D$?'
        back: 'Columns of $P$: independent eigenvectors; diagonal of $D$: the matching eigenvalues, in the same order.'
        type: basic
      - front: 'Cheap check of a diagonalization without inverting $P$?'
        back: 'Verify $AP = PD$ and that $P$ is invertible ($AP = PD$ alone is not enough — $P = 0$ satisfies it).'
        type: basic
      - front: 'Why diagonalize to compute powers? Because $A^k = $ ...'
        back: '$PD^kP^{-1}$, and $D^k$ is just entrywise powers.'
        type: basic
