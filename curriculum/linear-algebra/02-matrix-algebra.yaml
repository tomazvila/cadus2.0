unit: matrix-algebra
course: linear-algebra
module: "Matrix Algebra"
topics:
  - id: matrix-addition-scalar-multiplication
    name: Matrix Addition and Scalar Multiplication
    core: true
    difficulty: 0.5
    drill: false
    answer_kind: numeric
    expected_time_secs: 90
    prerequisites:
      - id: vector-arithmetic
        weight: 0.6
        key: true
      - id: augmented-matrix-representation
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: Entrywise addition and subtraction
        key_prerequisites: [vector-arithmetic]
        exemplars:
          - problem: 'Compute $\begin{pmatrix}1&2\\3&4\end{pmatrix} + \begin{pmatrix}0&1\\-1&2\end{pmatrix}$.'
            answer: "[1,3;2,6]"
            answer_contract: {"cols":2,"kind":"matrix","rows":2}
          - problem: 'Compute $\begin{pmatrix}2&0&1\\1&-1&3\end{pmatrix} - \begin{pmatrix}1&1&1\\0&2&1\end{pmatrix}$.'
            answer: "[1,-1,0;1,-3,2]"
            answer_contract: {"cols":3,"kind":"matrix","rows":2}
          - problem: "Compute [-4,2;3,-5] + [1,-3;-2,4]. Give the matrix as [a,b;c,d]."
            answer: "[-3,-1;1,-1]"
            answer_contract: {"cols": 2, "kind": "matrix", "rows": 2}
            solution_sketch: "The full task is [-4,2;3,-5] + [1,-3;-2,4]. Apply the entrywise addition rule: add entries in matching positions. Top-left: -4 + 1 = -3; top-right: 2 + (-3) = -1; bottom-left: 3 + (-2) = 1; bottom-right: -5 + 4 = -1. The resulting matrix is [-3,-1;1,-1]."
          - problem: "Compute [-2,5;3,-4] - [1,-2;-5,1]. Give the matrix as [a,b;c,d]."
            answer: "[-3,7;8,-5]"
            answer_contract: {"cols": 2, "kind": "matrix", "rows": 2}
            solution_sketch: "The full task is [-2,5;3,-4] - [1,-2;-5,1]. Apply the entrywise subtraction rule: subtract each matching entry of the second matrix from the first. Top-left: -2 - 1 = -3; top-right: 5 - (-2) = 7; bottom-left: 3 - (-5) = 8; bottom-right: -4 - 1 = -5. The resulting matrix is [-3,7;8,-5]."
          - problem: "Compute [1,-1;2,0] + [-3,4;1,-2] + [2,0;-4,3]. Give the matrix as [a,b;c,d]."
            answer: "[0,3;-1,1]"
            answer_contract: {"cols": 2, "kind": "matrix", "rows": 2}
            solution_sketch: "The full task is [1,-1;2,0] + [-3,4;1,-2] + [2,0;-4,3]. Apply the entrywise addition rule to all three matrices, combining matching positions. Top-left: 1 + (-3) + 2 = 0; top-right: -1 + 4 + 0 = 3; bottom-left: 2 + 1 + (-4) = -1; bottom-right: 0 + (-2) + 3 = 1. The resulting matrix is [0,3;-1,1]."
          - problem: "The matrices A = [1,-2;3,0] and X satisfy A + X = [4,1;-1,5]. Find X, and give the matrix as [a,b;c,d]."
            answer: "[3,3;-4,5]"
            answer_contract: {"cols": 2, "kind": "matrix", "rows": 2}
            solution_sketch: "The full task is to solve A + X = [4,1;-1,5] with A = [1,-2;3,0]. Apply the entrywise subtraction rule: isolate X by subtracting A from both sides, so X = [4,1;-1,5] - [1,-2;3,0]. Top-left: 4 - 1 = 3; top-right: 1 - (-2) = 3; bottom-left: -1 - 3 = -4; bottom-right: 5 - 0 = 5. The resulting matrix is [3,3;-4,5]."
        constraints: "2x2 or 2x3 with integer entries in -5..5"
      - id: kp2
        name: Scalar multiples and combinations
        key_prerequisites: [vector-arithmetic]
        exemplars:
          - problem: 'Compute $3\begin{pmatrix}1&0\\2&-1\end{pmatrix}$.'
            answer: "[3,0;6,-3]"
            answer_contract: {"cols":2,"kind":"matrix","rows":2}
          - problem: 'Compute $2\begin{pmatrix}1&-1\\0&3\end{pmatrix} - \begin{pmatrix}2&0\\1&1\end{pmatrix}$.'
            answer: "[0,-2;-1,5]"
            answer_contract: {"cols":2,"kind":"matrix","rows":2}
            solution_sketch: 'Scale entrywise to $\begin{pmatrix}2&-2\\0&6\end{pmatrix}$, then subtract entrywise.'
          - problem: "Compute $-2\\begin{pmatrix}1&2\\\\0&1\\end{pmatrix}$. Give the matrix as [a,b;c,d]."
            answer: "[-2,-4;0,-2]"
            answer_contract: {"cols": 2, "kind": "matrix", "rows": 2}
            solution_sketch: "The object is -2 times the matrix [1,2;0,1]. Apply the scalar multiplication rule to each entry: -2*1=-2, -2*2=-4, -2*0=0, -2*1=-2. The answer is [-2,-4;0,-2]."
          - problem: "Compute $2\\begin{pmatrix}1&1\\\\-1&0\\end{pmatrix} + 3\\begin{pmatrix}0&-1\\\\2&1\\end{pmatrix}$. Give the matrix as [a,b;c,d]."
            answer: "[2,-1;4,3]"
            answer_contract: {"cols": 2, "kind": "matrix", "rows": 2}
            solution_sketch: "The object is 2 times [1,1;-1,0] plus 3 times [0,-1;2,1]. Apply scalar multiplication: 2[1,1;-1,0] = [2,2;-2,0] and 3[0,-1;2,1] = [0,-3;6,3]. Add entrywise: [2+0,2-3;-2+6,0+3] = [2,-1;4,3]. The answer is [2,-1;4,3]."
          - problem: "Compute $2\\begin{pmatrix}1&-2\\\\0&1\\end{pmatrix} - 3\\begin{pmatrix}0&-1\\\\1&0\\end{pmatrix}$. Give the matrix as [a,b;c,d]."
            answer: "[2,-1;-3,2]"
            answer_contract: {"cols": 2, "kind": "matrix", "rows": 2}
            solution_sketch: "The object is 2 times [1,-2;0,1] minus 3 times [0,-1;1,0]. Apply scalar multiplication: 2[1,-2;0,1] = [2,-4;0,2] and 3[0,-1;1,0] = [0,-3;3,0]. Subtract entrywise: [2-0,-4-(-3);0-3,2-0] = [2,-1;-3,2]. The answer is [2,-1;-3,2]."
          - problem: "Compute $2\\begin{pmatrix}1&0\\\\-1&2\\end{pmatrix} + 3\\begin{pmatrix}0&-1\\\\1&0\\end{pmatrix} - \\begin{pmatrix}1&1\\\\1&1\\end{pmatrix}$. Give the matrix as [a,b;c,d]."
            answer: "[1,-4;0,3]"
            answer_contract: {"cols": 2, "kind": "matrix", "rows": 2}
            solution_sketch: "The object is 2[1,0;-1,2] + 3[0,-1;1,0] - [1,1;1,1]. Apply scalar multiplication: [2,0;-2,4] and [0,-3;3,0]. Combine entrywise: [2+0-1,0-3-1;-2+3-1,4+0-1] = [1,-4;0,3]. The answer is [1,-4;0,3]."
        constraints: "scalars in -3..3; integer entries in -5..5"
      - id: kp3
        name: Size compatibility and solving for a matrix
        key_prerequisites: [vector-arithmetic]
        exemplars:
          - problem: 'Solve for $X$: $X + \begin{pmatrix}1&2\\3&4\end{pmatrix} = \begin{pmatrix}2&2\\3&5\end{pmatrix}$.'
            answer: "[1,0;0,1]"
            answer_contract: {"cols":2,"kind":"matrix","rows":2}
            solution_sketch: 'Subtract entrywise: $X = \begin{pmatrix}2-1&2-2\\3-3&5-4\end{pmatrix}$.'
          - problem: "A is a 2x3 matrix and B is a 3x2 matrix. State whether A+B can be formed and give the number of rows in A+B when it can be formed, or 0 when it cannot. Give both values."
            answer: "verdict = undefined; r = 0"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["defined"], ["undefined"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "r"}]}
            solution_sketch: "Step 1: check the sizes. A has 2 rows and 3 columns, while B has 3 rows and 2 columns. Step 2: apply the addition size rule. Matrix addition needs the same number of rows and the same number of columns, and these two matrices differ in both, so A+B cannot be formed. The wrong option 'defined' would mean the sizes match, but they do not. Step 3: the label is undefined, and the fallback row count is 0. The answer is verdict = undefined; r = 0."
          - problem: "Solve for X: X - [[4,1],[0,3]] = [[1,2],[5,5]]. Give the matrix as [a,b;c,d]."
            answer: "[5,3;5,8]"
            answer_contract: {"cols": 2, "kind": "matrix", "rows": 2}
            solution_sketch: "Step 1: isolate X by adding the left matrix to both sides. This uses only addition, so X = [[1,2],[5,5]] + [[4,1],[0,3]]. Step 2: add entrywise. The result is [[5,3],[5,8]]. The answer is [5,3;5,8]."
          - problem: "Solve for X: [[7,2],[1,6]] - X = [[2,2],[1,1]]. Give the matrix as [a,b;c,d]."
            answer: "[5,0;0,5]"
            answer_contract: {"cols": 2, "kind": "matrix", "rows": 2}
            solution_sketch: "Step 1: move X to the other side by adding X to both sides and subtracting the right matrix. This gives X = [[7,2],[1,6]] - [[2,2],[1,1]]. Step 2: subtract entrywise. The result is [[5,0],[0,5]]. The answer is [5,0;0,5]."
          - problem: "A is a 2x2 matrix and B is a 2x2 matrix. State whether A+B can be formed and give the number of entries in A+B when it can be formed. Give both values."
            answer: "verdict = defined; entries = 4"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["defined"], ["undefined"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "entries"}]}
            solution_sketch: "Step 1: check the sizes. Both A and B have 2 rows and 2 columns, so their sizes agree. Step 2: apply the addition size rule. A+B can be formed because the sizes match. The wrong option 'undefined' would mean the sizes differ, but they do not. Step 3: count entries in the result. A 2x2 matrix has 4 entries, so the answer is verdict = defined; entries = 4."
          - problem: "Solve for X: X + [[2,1],[0,1]] - [[1,1],[1,0]] = [[3,2],[2,2]]. Give the matrix as [a,b;c,d]."
            answer: "[2,2;3,1]"
            answer_contract: {"cols": 2, "kind": "matrix", "rows": 2}
            solution_sketch: "Step 1: isolate X by subtracting the first matrix and adding the second matrix to both sides. This uses only addition and subtraction, so X = [[3,2],[2,2]] + [[1,1],[1,0]] - [[2,1],[0,1]]. Step 2: combine the first two matrices: [[4,3],[3,2]], then subtract the third: [[2,2],[3,1]]. The answer is [2,2;3,1]."
        constraints: "solve-for-X problems use only addition and subtraction"
    diagnostic_exemplar:
      problem: 'Solve for $X$: $2X + \begin{pmatrix}1&-1\\0&2\end{pmatrix} = \begin{pmatrix}5&3\\4&0\end{pmatrix}$.'
      answer: '$X = \begin{pmatrix}2&2\\2&-1\end{pmatrix}$'
      answer_contract: {kind: none}
      solution_sketch: '$2X = \begin{pmatrix}4&4\\4&-2\end{pmatrix}$ entrywise, then multiply by $\frac{1}{2}$.'
    anki_seeds:
      - front: 'How do matrices add?'
        back: 'Entrywise, and only when the two matrices have exactly the same size.'
        type: basic

  - id: matrix-multiplication
    name: Matrix Multiplication
    core: true
    difficulty: 0.55
    drill: false
    answer_kind: numeric
    expected_time_secs: 150
    prerequisites:
      - id: computing-matrix-vector-products
        weight: 0.7
        key: true
      - id: computing-dot-products
        weight: 0.5
        key: true
      - id: matrix-addition-scalar-multiplication
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: Multiplying 2x2 matrices
        key_prerequisites: [computing-dot-products, computing-matrix-vector-products]
        exemplars:
          - problem: 'Compute $\begin{pmatrix}1&2\\3&4\end{pmatrix}\begin{pmatrix}5&6\\7&8\end{pmatrix}$.'
            answer: "[19,22;43,50]"
            answer_contract: {"cols":2,"kind":"matrix","rows":2}
            solution_sketch: 'Each entry is a row-column dot product, e.g. top-left $= 1 \cdot 5 + 2 \cdot 7 = 19$.'
          - problem: 'Compute $\begin{pmatrix}2&0\\1&3\end{pmatrix}\begin{pmatrix}1&4\\2&-1\end{pmatrix}$.'
            answer: "[2,8;7,1]"
            answer_contract: {"cols":2,"kind":"matrix","rows":2}
            solution_sketch: 'Row 2: $1 \cdot 1 + 3 \cdot 2 = 7$ and $1 \cdot 4 + 3 \cdot (-1) = 1$.'
          - problem: "Compute $\\begin{pmatrix}3&1\\\\2&4\\end{pmatrix}\\begin{pmatrix}-1&2\\\\5&0\\end{pmatrix}$. Give the matrix as [a,b;c,d]."
            answer: "[2,6;18,4]"
            answer_contract: {"cols": 2, "kind": "matrix", "rows": 2}
            solution_sketch: "Step 1 (row-column dot product): the top-left entry is 3*(-1) + 1*5 = 2. Step 2 (repeat for each entry): the top-right entry is 3*2 + 1*0 = 6, the bottom-left entry is 2*(-1) + 4*5 = 18, and the bottom-right entry is 2*2 + 4*0 = 4. The product is [2,6;18,4]."
          - problem: "Compute $\\begin{pmatrix}0&3\\\\4&-2\\end{pmatrix}\\begin{pmatrix}2&-1\\\\1&5\\end{pmatrix}$. Give the matrix as [a,b;c,d]."
            answer: "[3,15;6,-14]"
            answer_contract: {"cols": 2, "kind": "matrix", "rows": 2}
            solution_sketch: "Step 1 (row-column dot product): the top-left entry is 0*2 + 3*1 = 3. Step 2 (assemble all four entries): the top-right entry is 0*(-1) + 3*5 = 15, the bottom-left entry is 4*2 + (-2)*1 = 6, and the bottom-right entry is 4*(-1) + (-2)*5 = -14. The product is [3,15;6,-14]."
          - problem: "Compute the square $A^2$ for $A = \\begin{pmatrix}1&2\\\\-1&3\\end{pmatrix}$. Give the matrix as [a,b;c,d]."
            answer: "[-1,8;-4,7]"
            answer_contract: {"cols": 2, "kind": "matrix", "rows": 2}
            solution_sketch: "Step 1 (row-column dot product for a square): the top-left entry is 1*1 + 2*(-1) = -1. Step 2 (complete the product): the top-right entry is 1*2 + 2*3 = 8, the bottom-left entry is -1*1 + 3*(-1) = -4, and the bottom-right entry is -1*2 + 3*3 = 7. The square is [-1,8;-4,7]."
          - problem: "For $A = \\begin{pmatrix}2&-3\\\\1&4\\end{pmatrix}$ and $B = \\begin{pmatrix}5&1\\\\-2&3\\end{pmatrix}$, find the bottom-right entry of $AB$. Give the answer as an integer."
            answer: "13"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (row-column dot product): the full product AB is [16,-7;-3,13]. Step 2 (select the bottom-right entry): that entry is 1*1 + 4*3 = 13. The bottom-right entry is 13."
        constraints: "2x2 times 2x2; entries in -4..8"
      - id: kp2
        name: Rectangular products and sizes
        key_prerequisites: [computing-dot-products, computing-matrix-vector-products]
        exemplars:
          - problem: 'Compute $\begin{pmatrix}1&0&2\\0&1&1\end{pmatrix}\begin{pmatrix}1&2\\3&0\\1&1\end{pmatrix}$.'
            answer: "[3,4;4,1]"
            answer_contract: {"cols":2,"kind":"matrix","rows":2}
            solution_sketch: 'Row 1: $1 + 0 + 2 = 3$, $2 + 0 + 2 = 4$; row 2: $0 + 3 + 1 = 4$, $0 + 0 + 1 = 1$.'
          - problem: "A is a 2 by 3 matrix and B is a 3 by 4 matrix. State the compatibility of BA, and give the size of AB as (rows, cols)."
            answer: "compatibility = incompatible; size = (2,4)"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["compatible"], ["incompatible"]]}, "name": "compatibility"}, {"contract": {"arity": 2, "kind": "coordinates"}, "name": "size"}]}
            solution_sketch: "A is 2 by 3 and B is 3 by 4. Step 1: For BA, the inner dimensions are 4 and 2, which do not match, so BA is incompatible. Step 2: For AB, the outer dimensions give a 2 by 4 size. The option compatible is wrong because the inner dimensions of BA do not match. The final answer is compatibility = incompatible; size = (2,4)."
          - problem: "Compute the product AB for A = [2,1,0;1,3,1] and B = [1,2;0,1;4,0]. Give the matrix as [a,b;c,d]."
            answer: "[2,5;5,5]"
            answer_contract: {"cols": 2, "kind": "matrix", "rows": 2}
            solution_sketch: "The full product AB is [2,5;5,5]. Step 1: row 1 of A times the columns of B gives 2*1 + 1*0 + 0*4 = 2 and 2*2 + 1*1 + 0*0 = 5. Step 2: row 2 of A gives 1*1 + 3*0 + 1*4 = 5 and 1*2 + 3*1 + 1*0 = 5. The product is [2,5;5,5]."
          - problem: "Compute the product AB for A = [1,-2,3;0,1,-1] and B = [2,0;-1,3;4,1]. Give the matrix as [a,b;c,d]."
            answer: "[16,-3;-5,2]"
            answer_contract: {"cols": 2, "kind": "matrix", "rows": 2}
            solution_sketch: "The full product AB is [16,-3;-5,2]. Step 1: row 1 of A times the columns of B gives 1*2 + (-2)*(-1) + 3*4 = 16 and 1*0 + (-2)*3 + 3*1 = -3. Step 2: row 2 of A gives 0*2 + 1*(-1) + (-1)*4 = -5 and 0*0 + 1*3 + (-1)*1 = 2. The product is [16,-3;-5,2]."
          - problem: "A is a 4 by 5 matrix and B is a 5 by 3 matrix. Give the size of AB as (rows, cols)."
            answer: "(4,3)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "The full size of AB is determined by the outer dimensions. Step 1: A has 4 rows, so AB has 4 rows. Step 2: B has 3 columns, so AB has 3 columns. The size of AB is (4,3)."
          - problem: "A is a 4 by 3 matrix and B is a 2 by 5 matrix. State the compatibility of AB, and give the inner dimensions as (columns of A, rows of B)."
            answer: "compatibility = incompatible; inner = (3,2)"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["compatible"], ["incompatible"]]}, "name": "compatibility"}, {"contract": {"arity": 2, "kind": "coordinates"}, "name": "inner"}]}
            solution_sketch: "A is 4 by 3 and B is 2 by 5. Step 1: The inner dimensions are the columns of A, 3, and the rows of B, 2. Step 2: These inner dimensions do not match, so AB is incompatible. The option compatible is wrong because the inner dimensions do not match. The final answer is compatibility = incompatible; inner = (3,2)."
        constraints: "2x3 times 3x2 numerics; size questions up to 4x5"
      - id: kp3
        name: Columns of a product
        key_prerequisites: [computing-matrix-vector-products]
        exemplars:
          - problem: 'For $A = \begin{pmatrix}1&1\\0&2\end{pmatrix}$ and $B = \begin{pmatrix}2&0\\1&3\end{pmatrix}$, compute $AB$ column by column ($AB = [A\mathbf{b}_1\ A\mathbf{b}_2]$).'
            answer: "[3,3;2,6]"
            answer_contract: {"cols":2,"kind":"matrix","rows":2}
            solution_sketch: '$A(2, 1) = (3, 2)$ and $A(0, 3) = (3, 6)$.'
          - problem: "For A = [[2,1],[3,0]] and B = [[1,4],[2,5]], compute the second column of AB by multiplying A with the second column of B. Give the answer as (x, y)."
            answer: "(13, 12)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "Column view of matrix multiplication: the second column of AB is A times the second column of B, so the vector is A(4,5). Row 1: 2*4 + 1*5 = 13. Row 2: 3*4 + 0*5 = 12. The answer is (13, 12)."
          - problem: "For A = [[2,3],[1,4]] and B = [[1,2],[0,1]], compute AB column by column. Give the matrix as [a,b;c,d]."
            answer: "[2,7;1,6]"
            answer_contract: {"cols": 2, "kind": "matrix", "rows": 2}
            solution_sketch: "Column view: the first column of AB is A times the first column of B, so it is A(1,0) = (2,1). The second column is A(2,1) = (7,6). Row-column check: row 1 of A times column 1 of B is 2, and row 1 times column 2 is 7. The product is [2,7;1,6]."
          - problem: "For A = [[3,1],[2,4]] and B = [[2,5],[1,3]], find the first column of AB by computing A times the first column of B. Give the answer as (x, y)."
            answer: "(7, 8)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "Column view: the first column of AB is A times the first column of B, so it is A(2,1). Row 1: 3*2 + 1*1 = 7. Row 2: 2*2 + 4*1 = 8. The answer is (7, 8)."
          - problem: "For A = [[1,2],[3,4]] and B = [[0,1],[2,3]], compute AB by the column view and confirm the (2,1) entry with the row-column rule. Give the matrix as [a,b;c,d]."
            answer: "[4,7;8,15]"
            answer_contract: {"cols": 2, "kind": "matrix", "rows": 2}
            solution_sketch: "Column view: first column of AB is A(0,2) = (4,8). Second column is A(1,3) = (7,15). Row-column check for entry (2,1): row 2 of A, (3,4), times column 1 of B, (0,2), is 3*0 + 4*2 = 8. The product is [4,7;8,15]."
          - problem: "For A = [[4,1],[2,3]] and B = [[1,2],[3,4]], find the second column of AB by computing A times the second column of B. Give the answer as (x, y)."
            answer: "(12, 16)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "Column view: the second column of AB is A times the second column of B, so it is A(2,4). Row 1: 4*2 + 1*4 = 12. Row 2: 2*2 + 3*4 = 16. The answer is (12, 16)."
        constraints: "verify the column view against the row-column rule on 2x2 matrices"
    diagnostic_exemplar:
      problem: 'Compute $\begin{pmatrix}1&0&2\\3&1&0\end{pmatrix}\begin{pmatrix}2&1\\0&4\\1&3\end{pmatrix}$, and state the size of the product.'
      answer: '$\begin{pmatrix}4&7\\6&7\end{pmatrix}$, a $2 \times 2$ matrix'
      answer_contract: {kind: none}
      solution_sketch: 'Row $1$: $(2 + 0 + 2, 1 + 0 + 6) = (4, 7)$; row $2$: $(6 + 0 + 0, 3 + 4 + 0) = (6, 7)$. A $2\times3$ times a $3\times2$ is $2\times2$.'
    anki_seeds:
      - front: 'Entry $(i, j)$ of the product $AB$ is computed how?'
        back: 'Dot product of row $i$ of $A$ with column $j$ of $B$.'
        type: basic
      - front: '$AB$ is defined exactly when...'
        back: 'the number of columns of $A$ equals the number of rows of $B$.'
        type: basic

  - id: identity-zero-matrices
    name: Identity and Zero Matrices
    core: true
    difficulty: 0.55
    drill: false
    answer_kind: numeric
    expected_time_secs: 90
    prerequisites:
      - id: matrix-multiplication
        weight: 0.7
        key: true
      - id: matrix-addition-scalar-multiplication
        weight: 0.5
    knowledge_points:
      - id: kp1
        name: The identity matrix
        key_prerequisites: [matrix-multiplication]
        exemplars:
          - problem: 'Write down $I_3$, the $3 \times 3$ identity matrix.'
            answer: "[1,0,0;0,1,0;0,0,1]"
            answer_contract: {"cols":3,"kind":"matrix","rows":3}
          - problem: 'Compute $\begin{pmatrix}2&3\\1&4\end{pmatrix} I_2$.'
            answer: "[2,3;1,4]"
            answer_contract: {"cols":2,"kind":"matrix","rows":2}
            solution_sketch: '$AI = A$ for every matrix $A$ (and $IA = A$).'
          - problem: "Let A = [[6,-2],[4,1]]. Compute I2 A. Give the result as [a,b;c,d]."
            answer: "[6,-2;4,1]"
            answer_contract: {"cols": 2, "kind": "matrix", "rows": 2}
            solution_sketch: "The full object is I2 A with A = [[6,-2],[4,1]]. Step 1: the identity rule says I2 times a 2x2 matrix copies each row, so row 1 is 6,-2. Step 2: row 2 copies as 4,1. The result is [6,-2;4,1]."
          - problem: "Compute A I2 for A = [[3,8],[-5,2]]. Give the result as [a,b;c,d]."
            answer: "[3,8;-5,2]"
            answer_contract: {"cols": 2, "kind": "matrix", "rows": 2}
            solution_sketch: "The full object is A I2 with A = [[3,8],[-5,2]]. Step 1: the identity rule says multiplying on the right by I2 copies each column, so column 1 is 3,-5. Step 2: column 2 copies as 8,2. The result is [3,8;-5,2]."
          - problem: "Compute I2 I2. Give the result as [a,b;c,d]."
            answer: "[1,0;0,1]"
            answer_contract: {"cols": 2, "kind": "matrix", "rows": 2}
            solution_sketch: "The full object is I2 I2. Step 1: the identity rule says I2 times any 2x2 matrix leaves that matrix unchanged. Step 2: apply this rule to the matrix I2 itself. The result is [1,0;0,1]."
          - problem: "For I2 = [[1,0],[0,1]], find x so that I2 [[x,2],[5,3]] = [[7,2],[5,3]]. Give x."
            answer: "7"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full object is I2 [[x,2],[5,3]] = [[7,2],[5,3]], with I2 the 2x2 identity. Step 1: the identity rule says I2 times a matrix leaves it unchanged, so [[x,2],[5,3]] = [[7,2],[5,3]]. Step 2: compare the top-left entries to get x = 7. The value is 7."
        constraints: "verify AI = IA = A numerically on 2x2 matrices"
      - id: kp2
        name: The zero matrix
        key_prerequisites: [matrix-addition-scalar-multiplication, matrix-multiplication]
        exemplars:
          - problem: 'Compute $A + O$ for $A = \begin{pmatrix}1&-2\\4&3\end{pmatrix}$ and $O$ the $2 \times 2$ zero matrix.'
            answer: "[1,-2;4,3]"
            answer_contract: {"cols":2,"kind":"matrix","rows":2}
          - problem: 'Compute $\begin{pmatrix}1&2\\3&4\end{pmatrix}\begin{pmatrix}0&0\\0&0\end{pmatrix}$.'
            answer: "[0,0;0,0]"
            answer_contract: {"cols":2,"kind":"matrix","rows":2}
          - problem: "Compute A + O for A = [2,-3;5,1] and O the 2 x 2 zero matrix. Give the matrix as [a,b;c,d]."
            answer: "[2,-3;5,1]"
            answer_contract: {"cols": 2, "kind": "matrix", "rows": 2}
            solution_sketch: "Write A as [2,-3;5,1] and O as [0,0;0,0]. Rule: the zero matrix is the additive identity, so each entry of A + O equals the matching entry of A. Adding gives [2,-3;5,1]. The answer is [2,-3;5,1]."
          - problem: "Compute O + B for B = [-1,4;2,0] and O the 2 x 2 zero matrix. Give the matrix as [a,b;c,d]."
            answer: "[-1,4;2,0]"
            answer_contract: {"cols": 2, "kind": "matrix", "rows": 2}
            solution_sketch: "Write O as [0,0;0,0] and B as [-1,4;2,0]. Rule: adding the zero matrix on the left leaves every entry of B unchanged. Hence O + B = [-1,4;2,0]. The answer is [-1,4;2,0]."
          - problem: "Compute A(B + O) for A = [1,2;3,4], B = [0,1;1,0], and O the 2 x 2 zero matrix. Give the matrix as [a,b;c,d]."
            answer: "[2,1;4,3]"
            answer_contract: {"cols": 2, "kind": "matrix", "rows": 2}
            solution_sketch: "Write A as [1,2;3,4], B as [0,1;1,0], and O as [0,0;0,0]. Rule: B + O = B because the zero matrix is the additive identity. Multiply A B by row-column products to get [2,1;4,3]. The answer is [2,1;4,3]."
          - problem: "Compute (O + A)B for A = [2,0;1,3], B = [1,-1;2,4], and O the 2 x 2 zero matrix. Give the matrix as [a,b;c,d]."
            answer: "[2,-2;7,11]"
            answer_contract: {"cols": 2, "kind": "matrix", "rows": 2}
            solution_sketch: "Write A as [2,0;1,3], B as [1,-1;2,4], and O as [0,0;0,0]. Rule: O + A = A by the additive identity property of the zero matrix. Multiply A B by row-column products: [2,-2;7,11]. The answer is [2,-2;7,11]."
        constraints: "identity/zero behavior stated and verified numerically"
      - id: kp3
        name: Zero products from nonzero factors
        key_prerequisites: [matrix-multiplication]
        exemplars:
          - problem: "Let A = [0,1;0,0] and B = [1,1;0,0]. Compute the product AB and give the matrix as [a,b;c,d]."
            answer: "[0,0;0,0]"
            answer_contract: {"cols": 2, "kind": "matrix", "rows": 2}
            solution_sketch: "Step 1 (matrix multiplication rule): write the product AB with A = [0,1;0,0] and B = [1,1;0,0]. Step 2: row 1 of A is (0,1) and each column of B is (1,0) or (0,0), so the row-column products are 0*1 + 1*0 = 0 and 0*1 + 1*0 = 0; row 2 of A is (0,0). Step 3: both factors are nonzero matrices, yet every entry of the product is 0, a zero product from nonzero factors. The answer is AB = [0,0;0,0]."
          - problem: "A student claims: if AB = O for 2x2 matrices, then A = O or B = O. Take A = [0,0;1,0] and B = [0,0;1,1]. State whether the claim is correct for this pair, and give the entry in row 2, column 1 of BA."
            answer: "verdict = fails; ba21 = 1"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["holds"], ["fails"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "ba21"}]}
            solution_sketch: "Step 1 (zero-product check by matrix multiplication): with A = [0,0;1,0] and B = [0,0;1,1], row 1 of A is (0,0) and row 2 is (1,0), which meets columns (0,1) and (0,1) of B in 0, so AB = [0,0;0,0]. Step 2: both factors are nonzero, so the claim is wrong for matrices; matrices have zero divisors, unlike numbers, so the option 'holds' is the number-multiplication assumption. Step 3 (reversed order): rows of B are (0,0) and (1,1), columns of A are (0,1) and (0,0), giving BA = [0,0;1,0] with entry (2,1) equal to 1. The answer is verdict = fails; ba21 = 1."
          - problem: "For A = [0,1;0,1] and B = [1,0;0,0], the product AB is the zero matrix even though A and B are not. Compute BA and give the matrix as [a,b;c,d]."
            answer: "[0,1;0,0]"
            answer_contract: {"cols": 2, "kind": "matrix", "rows": 2}
            solution_sketch: "Step 1 (check the given zero product): rows of A = [0,1;0,1] are (0,1) and (0,1); columns of B = [1,0;0,0] are (1,0) and (0,0); every row-column product is 0, so AB = [0,0;0,0]. Step 2 (matrix multiplication in the reversed order): rows of B are (1,0) and (0,0), columns of A are (0,0) and (1,1); entry (1,2) is 1*1 + 0*1 = 1. Step 3: reversing a zero product need not give a zero product, and BA = [0,1;0,0]. The answer is BA = [0,1;0,0]."
          - problem: "Let E = [0,0;1,0], and note that E is not the zero matrix. Find the smallest positive whole number k such that E^k is the zero matrix."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (matrix multiplication): compute E^2 = E*E with E = [0,0;1,0]; the rows are (0,0) and (1,0) and the columns are (0,1) and (0,0). Step 2: every row-column product is 0, so E^2 = [0,0;0,0], while E itself is not the zero matrix, so k = 1 does not work. Step 3: the smallest positive whole number k with E^k equal to the zero matrix is 2. The answer is 2."
          - problem: "Let A = [0,1;0,0]. A matrix B has all four entries equal to 0 or 1 and satisfies AB = O, where O is the 2x2 zero matrix. How many such matrices B are not the zero matrix?"
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (set up the unknown): write B = [a,b;c,d] where each entry is 0 or 1. Step 2 (matrix multiplication with A = [0,1;0,0]): AB = [c,d;0,0], so AB = O forces c = 0 and d = 0, while a and b remain free. Step 3: there are 2*2 = 4 choices for (a,b), and excluding the zero matrix B = [0,0;0,0] leaves 3 nonzero matrices. The answer is 3."
          - problem: "Let O be the 2x2 matrix whose entries are all 0. For A = [1,0;1,0] and B = [0,1;0,1], state whether AB equals O, and give the number of entries of AB that are not 0."
            answer: "verdict = nonzero; count = 2"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["zero"], ["nonzero"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "count"}]}
            solution_sketch: "Step 1 (matrix multiplication rule): the rows of A = [1,0;1,0] are (1,0) and (1,0); the columns of B = [0,1;0,1] are (0,0) and (1,1). Step 2: entry (1,2) is 1*1 + 0*1 = 1, so AB = [0,1;0,1], which is not O; the wrong 'zero' verdict comes from forgetting the second column of B when multiplying. Step 3: AB has exactly 2 entries that are not 0; a count of 0 or 4 would misread the product. The answer is verdict = nonzero; count = 2."
        constraints: "2x2 counterexamples with entries 0 and 1"
    diagnostic_exemplar:
      problem: 'Compute $AB$ for $A = \begin{pmatrix}1&0\\0&0\end{pmatrix}$ and $B = \begin{pmatrix}0&0\\3&1\end{pmatrix}$. What does the result show?'
      answer: '$AB = \begin{pmatrix}0&0\\0&0\end{pmatrix}$: a product of two nonzero matrices can be the zero matrix, so $AB = O$ does not force $A = O$ or $B = O$'
      answer_contract: {kind: none}
      solution_sketch: 'Each entry of $AB$ pairs a zero of $A$ with a nonzero of $B$ or vice versa, so every entry vanishes even though $A \ne O$ and $B \ne O$.'
    anki_seeds:
      - front: 'The identity matrix $I_n$ looks like...'
        back: '$1$s on the main diagonal, $0$s everywhere else; $AI = IA = A$.'
        type: basic
      - front: 'Does $AB = O$ force $A = O$ or $B = O$?'
        back: 'No; nonzero matrices can multiply to the zero matrix.'
        type: basic

  - id: diagonal-triangular-matrices
    name: Diagonal and Triangular Matrices
    core: true
    difficulty: 0.55
    drill: false
    answer_kind: numeric
    expected_time_secs: 90
    prerequisites:
      - id: matrix-multiplication
        weight: 0.7
        key: true
      - id: identity-zero-matrices
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: Recognizing diagonal and triangular matrices
        key_prerequisites: [identity-zero-matrices]
        exemplars:
          - problem: "Which description is most specific for the matrix [5,0,0;-2,3,0;4,0,-1]?"
            answer: "lower"
            answer_contract: {"kind": "label", "options": [["diagonal"], ["upper"], ["lower"], ["neither"]]}
            solution_sketch: "In the matrix [5,0,0;-2,3,0;4,0,-1] the entries above the main diagonal, namely (1,2), (1,3) and (2,3), are all 0, so it is triangular. The entries (2,1)=-2 and (3,1)=4 below the diagonal are nonzero, so it is not diagonal and not upper triangular. The option diagonal is wrong because the off-diagonal entries -2 and 4 are nonzero. The option upper is wrong because there are nonzero entries below the main diagonal. The option neither is wrong because every entry above the main diagonal is zero. The answer is lower."
          - problem: "Which description is most specific for the matrix [1,4;0,3]?"
            answer: "upper"
            answer_contract: {"kind": "label", "options": [["diagonal"], ["upper"], ["lower"], ["neither"]]}
            solution_sketch: "The matrix has (2,1)=0 below the main diagonal, so it is upper triangular. The (1,2) entry is 4, so it is not diagonal. The option diagonal is wrong because a nonzero off-diagonal entry is present, the option lower is wrong because the (1,2) entry is not zero, and the option neither is wrong because it is upper triangular. The answer is upper."
          - problem: "A 3x3 identity matrix is diagonal. How many of its nine entries are zero?"
            answer: "6"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The identity matrix has ones on the main diagonal and zeros in every other position. A 3x3 matrix has nine entries total, and three of them are on the main diagonal. So the number of zero entries is 9 - 3 = 6. The answer is 6."
          - problem: "A square matrix with three rows is upper triangular. How many entries below its main diagonal must be zero?"
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "An upper triangular matrix has zero entries below the main diagonal. In a 3x3 matrix there are three positions below the main diagonal: (2,1), (3,1), and (3,2). Each of these must be zero. The answer is 3."
          - problem: "A 2x2 diagonal matrix has (1,1)=3 and (2,2)=-4. Give its (1,2) entry."
            answer: "0"
            answer_contract: {"kind": "exact"}
            solution_sketch: "A diagonal matrix has zeros in every off-diagonal position. The entry (1,2) is off the main diagonal, so it must be zero. The answer is 0."
          - problem: "A 3x3 upper triangular matrix has diagonal entries 2, 5, 7. Find the sum of the three entries below the main diagonal."
            answer: "0"
            answer_contract: {"kind": "exact"}
            solution_sketch: "An upper triangular matrix has zeros in all positions below the main diagonal. The three below-diagonal entries are each zero, so their sum is 0 + 0 + 0. The answer is 0."
        constraints: "sizes 2x2 and 3x3; unambiguous classifications"
      - id: kp2
        name: Products of diagonal matrices
        key_prerequisites: [matrix-multiplication]
        exemplars:
          - problem: 'Compute $\begin{pmatrix}2&0\\0&3\end{pmatrix}\begin{pmatrix}4&0\\0&5\end{pmatrix}$.'
            answer: "[8,0;0,15]"
            answer_contract: {"cols":2,"kind":"matrix","rows":2}
            solution_sketch: 'Diagonal matrices multiply entrywise on the diagonal.'
          - problem: 'Compute $\begin{pmatrix}3&0\\0&3\end{pmatrix}\begin{pmatrix}1&2\\3&4\end{pmatrix}$.'
            answer: "[3,6;9,12]"
            answer_contract: {"cols":2,"kind":"matrix","rows":2}
            solution_sketch: 'The scalar matrix $3I$ acts exactly like the scalar $3$.'
          - problem: "Compute $\\begin{pmatrix}2&0\\\\0&5\\end{pmatrix}\\begin{pmatrix}1&3\\\\4&6\\end{pmatrix}$. Give the matrix as [a,b;c,d]."
            answer: "[2,6;20,30]"
            answer_contract: {"cols": 2, "kind": "matrix", "rows": 2}
            solution_sketch: "Row rule: a diagonal matrix on the left scales each row. Row 1 is $2$ times $(1,3)$, row 2 is $5$ times $(4,6)$. The full object is $\\begin{pmatrix}2&6\\\\20&30\\end{pmatrix}$, so the answer is [2,6;20,30]."
          - problem: "Compute $\\begin{pmatrix}2&-1\\\\3&1\\end{pmatrix}\\begin{pmatrix}4&0\\\\0&-1\\end{pmatrix}$. Give the matrix as [a,b;c,d]."
            answer: "[8,1;12,-1]"
            answer_contract: {"cols": 2, "kind": "matrix", "rows": 2}
            solution_sketch: "Column rule: a diagonal matrix on the right scales each column. Column 1 is $4$ times $(2,3)$, column 2 is $-1$ times $(-1,1)$. The full object is $\\begin{pmatrix}8&1\\\\12&-1\\end{pmatrix}$, so the answer is [8,1;12,-1]."
          - problem: "Compute $\\begin{pmatrix}-2&0\\\\0&-2\\end{pmatrix}\\begin{pmatrix}3&0\\\\0&7\\end{pmatrix}$. Give the matrix as [a,b;c,d]."
            answer: "[-6,0;0,-14]"
            answer_contract: {"cols": 2, "kind": "matrix", "rows": 2}
            solution_sketch: "A scalar matrix acts like the scalar: $-2I$ multiplies every diagonal entry of the other diagonal matrix. The products are $-2 \\cdot 3 = -6$ and $-2 \\cdot 7 = -14$. The result is a scalar-type diagonal matrix [-6,0;0,-14]."
          - problem: "A matrix $A$ satisfies $A\\begin{pmatrix}4&0\\\\0&5\\end{pmatrix} = \\begin{pmatrix}8&15\\\\12&20\\end{pmatrix}$. Find $A$. Give the matrix as [a,b;c,d]."
            answer: "[2,3;3,4]"
            answer_contract: {"cols": 2, "kind": "matrix", "rows": 2}
            solution_sketch: "A diagonal matrix on the right scales columns, so divide each entry of the product by the diagonal entry of its column. Column 1: $8/4 = 2$, $12/4 = 3$; column 2: $15/5 = 3$, $20/5 = 4$. The answer is [2,3;3,4]."
        constraints: "small integer diagonals; include one scalar-matrix example"
      - id: kp3
        name: Products of triangular matrices
        key_prerequisites: [matrix-multiplication]
        exemplars:
          - problem: "Compute $\\begin{pmatrix}1&3\\\\0&2\\end{pmatrix}\\begin{pmatrix}2&-1\\\\0&4\\end{pmatrix}$. Give the matrix as [a,b;c,d]."
            answer: "[2,11;0,8]"
            answer_contract: {"cols": 2, "kind": "matrix", "rows": 2}
            solution_sketch: "Apply the matrix multiplication rule row by column. Row 1 of A is (1, 3): against column 1 of B it gives 1*2 + 3*0 = 2, and against column 2 it gives 1*(-1) + 3*4 = 11. Row 2 of A is (0, 2): it gives 0 and 2*4 = 8, so the lower left entry stays 0 and the product stays upper triangular. The product is [2,11;0,8]."
          - problem: "Compute $\\begin{pmatrix}3&2\\\\0&-1\\end{pmatrix}\\begin{pmatrix}2&3\\\\0&4\\end{pmatrix}$. Give the matrix as [a,b;c,d]."
            answer: "[6,17;0,-4]"
            answer_contract: {"cols": 2, "kind": "matrix", "rows": 2}
            solution_sketch: "Use the matrix multiplication rule row by column on the full object. Row 1 of A = (3, 2): the (1,1) entry is 3*2 + 2*0 = 6 and the (1,2) entry is 3*3 + 2*4 = 17. Row 2 of A = (0, -1): the (2,1) entry is 0 and the (2,2) entry is -1*4 = -4. The product is [6,17;0,-4]."
          - problem: "Let $A = \\begin{pmatrix}2&1\\\\0&-3\\end{pmatrix}$ and $B = \\begin{pmatrix}4&2\\\\0&5\\end{pmatrix}$ be upper triangular. Find the two diagonal entries of the product AB, as (p, q)."
            answer: "(8, -15)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "For upper triangular factors, the (i,i) entry of the product AB pairs row i of A with column i of B, and only a_ii times b_ii survives below the off-diagonal term, so diagonal entries of AB are the products of the diagonal entries of A and B. The first diagonal entry is 2*4 = 8 and the second is (-3)*5 = -15. The diagonal of AB is (8, -15)."
          - problem: "Let $D = \\begin{pmatrix}3&0\\\\0&-2\\end{pmatrix}$ be diagonal and $U = \\begin{pmatrix}1&2\\\\0&4\\end{pmatrix}$ be upper triangular. Compute the product DU. Give the matrix as [a,b;c,d]."
            answer: "[3,6;0,-8]"
            answer_contract: {"cols": 2, "kind": "matrix", "rows": 2}
            solution_sketch: "Multiply the full object DU by the row-by-column rule. Row 1 of D is (3, 0), so row 1 of the product is 3 times row 1 of U: (3*1, 3*2) = (3, 6). Row 2 of D is (0, -2), so row 2 is (0*1 + (-2)*0, 0*2 + (-2)*4) = (0, -8). The product is [3,6;0,-8]."
          - problem: "Let $A = \\begin{pmatrix}1&2\\\\0&3\\end{pmatrix}$ and $B = \\begin{pmatrix}4&-1\\\\0&2\\end{pmatrix}$ be upper triangular. Find the (1,2) entry of the product AB."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "By the matrix multiplication rule, the (1,2) entry of AB is row 1 of A dotted with column 2 of B. Row 1 of A is (1, 2) and column 2 of B is (-1, 4), giving 1*(-1) + 2*2 = 3. The (1,2) entry of AB is 3."
          - problem: "Let $A = \\begin{pmatrix}3&1\\\\0&-3\\end{pmatrix}$ be upper triangular. Compute the square $A^2$. Give the matrix as [a,b;c,d]."
            answer: "[9,0;0,9]"
            answer_contract: {"cols": 2, "kind": "matrix", "rows": 2}
            solution_sketch: "Square A by applying the matrix multiplication rule to A times itself. The (1,1) entry is 3*3 + 1*0 = 9; the (1,2) entry is 3*1 + 1*(-3) = 0; the (2,1) entry is 0; the (2,2) entry is 1*1 + (-3)*(-3) = 9. The square is [9,0;0,9], which is even diagonal."
        constraints: "2x2 upper triangular with entries in -4..4"
    diagnostic_exemplar:
      problem: 'Compute $\begin{pmatrix}2&5\\0&3\end{pmatrix}\begin{pmatrix}4&1\\0&2\end{pmatrix}$, and classify the result as diagonal, upper triangular, or lower triangular.'
      answer: '$\begin{pmatrix}8&12\\0&6\end{pmatrix}$; upper triangular (not diagonal)'
      answer_contract: {kind: none}
      solution_sketch: 'The product of upper triangular matrices is upper triangular, with diagonal entries $2\cdot4 = 8$ and $3\cdot2 = 6$.'
    anki_seeds:
      - front: 'How do two diagonal matrices multiply?'
        back: 'Entrywise along the diagonal; the product is again diagonal.'
        type: basic
      - front: 'A scalar matrix $cI$ multiplies any matrix like...'
        back: 'the scalar $c$: $(cI)A = cA$.'
        type: basic

  - id: matrix-operations
    name: Matrix Operations
    core: true
    difficulty: 0.55
    drill: false
    answer_kind: numeric
    expected_time_secs: 150
    prerequisites:
      - id: matrix-multiplication
        weight: 0.8
        key: true
      - id: matrix-addition-scalar-multiplication
        weight: 0.6
        key: true
      - id: identity-zero-matrices
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: Combined matrix expressions
        key_prerequisites: [matrix-multiplication, matrix-addition-scalar-multiplication]
        exemplars:
          - problem: 'Compute $A(B + C)$ for $A = \begin{pmatrix}1&1\\0&1\end{pmatrix}$, $B = \begin{pmatrix}1&0\\2&1\end{pmatrix}$, $C = \begin{pmatrix}0&2\\1&0\end{pmatrix}$.'
            answer: "[4,3;3,1]"
            answer_contract: {"cols":2,"kind":"matrix","rows":2}
            solution_sketch: '$B + C = \begin{pmatrix}1&2\\3&1\end{pmatrix}$; multiply: row 1 gives $(1+3, 2+1)$, row 2 copies $(3, 1)$.'
          - problem: 'Compute $2AB - C$ for $A = \begin{pmatrix}1&0\\2&1\end{pmatrix}$, $B = \begin{pmatrix}3&1\\0&2\end{pmatrix}$, $C = \begin{pmatrix}1&1\\1&1\end{pmatrix}$.'
            answer: "[5,1;11,7]"
            answer_contract: {"cols":2,"kind":"matrix","rows":2}
            solution_sketch: '$AB = \begin{pmatrix}3&1\\6&4\end{pmatrix}$; double it and subtract $C$ entrywise.'
          - problem: "Compute A(B + C) for A = [2,1;1,3], B = [1,2;0,1], and C = [3,0;1,2]. Give the matrix as [a,b;c,d]."
            answer: "[9,7;7,11]"
            answer_contract: {"cols": 2, "kind": "matrix", "rows": 2}
            solution_sketch: "Use matrix addition to get B + C = [4,2;1,3]. Use matrix multiplication: row 1 of A with columns of B+C gives (9,7), and row 2 gives (7,11). The answer is [9,7;7,11]."
          - problem: "Compute 2AB - C for A = [1,2;0,3], B = [2,1;1,2], and C = [1,0;2,1]. Give the matrix as [a,b;c,d]."
            answer: "[7,10;4,11]"
            answer_contract: {"cols": 2, "kind": "matrix", "rows": 2}
            solution_sketch: "Use matrix multiplication to get AB = [4,5;3,6]. Use scalar multiplication to double it to [8,10;6,12], then entrywise subtraction to remove C. The answer is [7,10;4,11]."
          - problem: "Compute (A + B)C for A = [1,0;2,1], B = [0,1;1,0], and C = [2,3;1,1]. Give the matrix as [a,b;c,d]."
            answer: "[3,4;7,10]"
            answer_contract: {"cols": 2, "kind": "matrix", "rows": 2}
            solution_sketch: "Use matrix addition to get A + B = [1,1;3,1]. Use matrix multiplication with C: row 1 gives (3,4) and row 2 gives (7,10). The answer is [3,4;7,10]."
          - problem: "Compute AB - 2C for A = [1,1;2,0], B = [1,2;3,1], and C = [0,1;1,0]. Give the matrix as [a,b;c,d]."
            answer: "[4,1;0,4]"
            answer_contract: {"cols": 2, "kind": "matrix", "rows": 2}
            solution_sketch: "Use matrix multiplication to get AB = [4,3;2,4]. Use scalar multiplication to form 2C = [0,2;2,0], then entrywise subtraction. The answer is [4,1;0,4]."
        constraints: "2x2 matrices with entries in -4..4; at most three matrices per expression"
      - id: kp2
        name: Non-commutativity
        key_prerequisites: [matrix-multiplication]
        exemplars:
          - problem: "Let $A = \\begin{pmatrix}1&1\\\\0&1\\end{pmatrix}$ and $B = \\begin{pmatrix}1&0\\\\1&1\\end{pmatrix}$. Compute $AB - BA$ and give the answer as [a,b;c,d]."
            answer: "[1,0;0,-1]"
            answer_contract: {"cols": 2, "kind": "matrix", "rows": 2}
            solution_sketch: "Step 1: by the row-times-column rule for matrix multiplication, $AB = \\begin{pmatrix}2&1\\\\1&1\\end{pmatrix}$, since each entry is a row of $A$ times a column of $B$. Step 2: the same rule gives $BA = \\begin{pmatrix}1&1\\\\1&2\\end{pmatrix}$. Step 3: subtract entry by entry to get $\\begin{pmatrix}1&0\\\\0&-1\\end{pmatrix}$; the two products differ, so the pair is a counterexample to commutativity, and $AB - BA$ = [1,0;0,-1]."
          - problem: "Let $A = \\begin{pmatrix}0&2\\\\0&0\\end{pmatrix}$ and $B = \\begin{pmatrix}0&0\\\\3&0\\end{pmatrix}$. Compute $(A + B)^2 - (A^2 + 2AB + B^2)$ and give the answer as [a,b;c,d]."
            answer: "[-6,0;0,6]"
            answer_contract: {"cols": 2, "kind": "matrix", "rows": 2}
            solution_sketch: "Step 1: by matrix multiplication, $AB = \\begin{pmatrix}6&0\\\\0&0\\end{pmatrix}$ and $BA = \\begin{pmatrix}0&0\\\\0&6\\end{pmatrix}$, while $A^2$ and $B^2$ are both the zero matrix. Step 2: because $AB \\neq BA$, the order-careful expansion gives $(A+B)^2 = A^2 + AB + BA + B^2 = \\begin{pmatrix}6&0\\\\0&6\\end{pmatrix}$, whereas $A^2 + 2AB + B^2 = \\begin{pmatrix}12&0\\\\0&0\\end{pmatrix}$. Step 3: the gap is exactly $BA - AB$, so $(A + B)^2 - (A^2 + 2AB + B^2)$ = [-6,0;0,6]."
          - problem: "Let $A = \\begin{pmatrix}3&0\\\\0&3\\end{pmatrix}$ and $B = \\begin{pmatrix}1&4\\\\2&5\\end{pmatrix}$. Find $AB - BA$ and give the answer as [a,b;c,d]."
            answer: "[0,0;0,0]"
            answer_contract: {"cols": 2, "kind": "matrix", "rows": 2}
            solution_sketch: "Step 1: since $A = 3I$, the scalar-multiplication rule gives $AB = 3B = \\begin{pmatrix}3&12\\\\6&15\\end{pmatrix}$. Step 2: the same rule gives $BA = 3B$, which is the same matrix, so this pair commutes. Step 3: subtracting two equal matrices gives the zero matrix, so $AB - BA$ = [0,0;0,0]."
          - problem: "Let $P = \\begin{pmatrix}0&1\\\\1&0\\end{pmatrix}$ and $M = \\begin{pmatrix}1&2\\\\3&4\\end{pmatrix}$. One of the products $PM$ and $MP$ swaps the rows of $M$ and the other swaps its columns, so the two products are different. Compute $PM$ and give the answer as [a,b;c,d]."
            answer: "[3,4;1,2]"
            answer_contract: {"cols": 2, "kind": "matrix", "rows": 2}
            solution_sketch: "Step 1: left multiplication by the swap matrix $P$ exchanges the rows of $M$, so $PM = \\begin{pmatrix}3&4\\\\1&2\\end{pmatrix}$. Step 2: right multiplication by $P$ exchanges the columns, giving $MP = \\begin{pmatrix}2&1\\\\4&3\\end{pmatrix}$; the two products differ, so $P$ and $M$ do not commute. Step 3: the requested product is $PM$ = [3,4;1,2]."
          - problem: "Let $A = \\begin{pmatrix}1&1\\\\1&1\\end{pmatrix}$ and $B = \\begin{pmatrix}1&1\\\\-1&-1\\end{pmatrix}$, so neither factor is the zero matrix. Compute $BA$ and give the answer as [a,b;c,d]."
            answer: "[2,2;-2,-2]"
            answer_contract: {"cols": 2, "kind": "matrix", "rows": 2}
            solution_sketch: "Step 1: by the row-times-column rule, every entry of $AB$ equals $1 - 1 = 0$, so $AB$ is the zero matrix even though neither factor is zero. Step 2: the same rule gives $BA = \\begin{pmatrix}2&2\\\\-2&-2\\end{pmatrix}$, a nonzero matrix. Step 3: since $BA \\neq AB$, the pair is a concrete counterexample to commutativity, and $BA$ = [2,2;-2,-2]."
          - problem: "Let $A$ and $B$ be square matrices with $AB \\neq BA$. Expanding $(A + B)^3 = (A + B)(A + B)(A + B)$ by choosing $A$ or $B$ from each of the three factors keeps every ordered product, such as $ABA$, separate. How many ordered products does the full expansion contain, and how many distinct terms remain in the expansion when $A$ and $B$ commute, so that $AB = BA$ merges products with the same factors? Give the two counts as full = a; merged = b."
            answer: "full = 8; merged = 4"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "full"}, {"contract": {"kind": "exact"}, "name": "merged"}]}
            solution_sketch: "Step 1: choosing $A$ or $B$ from each of the three factors of $(A+B)(A+B)(A+B)$ gives $2 \\cdot 2 \\cdot 2$ = 8 ordered products (distribution with order kept), namely $A^3$, $AAB$, $ABA$, $ABB$, $BAA$, $BAB$, $BBA$, $BBB$. Step 2: if $AB = BA$, products with the same multiset of factors merge by the binomial pattern into $A^3$, $3A^2B$, $3AB^2$, $B^3$. Step 3: that leaves 4 distinct terms, so the counts are full = 8; merged = 4."
        constraints: "concrete 2x2 counterexamples plus symbolic expansion"
      - id: kp3
        name: Sizes and definedness in expressions
        key_prerequisites: [matrix-multiplication, matrix-addition-scalar-multiplication]
        exemplars:
          - problem: "Let $A$ be a $4 \\times 2$ matrix and $B$ a $2 \\times 4$ matrix. Find the size of $AB$ and the size of $BA$, giving each as its number of rows and columns."
            answer: "ABrows = 4; ABcols = 4; BArows = 2; BAcols = 2"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "ABrows"}, {"contract": {"kind": "exact"}, "name": "ABcols"}, {"contract": {"kind": "exact"}, "name": "BArows"}, {"contract": {"kind": "exact"}, "name": "BAcols"}]}
            solution_sketch: "Write the sizes: A is 4x2 and B is 2x4. For AB the inner sizes 2 and 2 match, so the row-column rule gives AB the outer sizes 4 and 4. For BA the inner sizes 4 and 4 match, so BA has the outer sizes 2 and 2. The answer is ABrows = 4; ABcols = 4; BArows = 2; BAcols = 2."
          - problem: "Let $A$ be a $3 \\times 2$ matrix and $B$ a $3 \\times 2$ matrix. Determine whether $AB$ is defined, and give the number of rows $B$ would need for $AB$ to be defined."
            answer: "verdict = undefined; needed = 2"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["defined"], ["undefined"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "needed"}]}
            solution_sketch: "Apply the product rule: multiplication needs the inner sizes to match, and A has 2 columns while B has 3 rows, so AB is undefined. The option defined comes from the error of treating two matrices of equal size as multipliable. To make the product defined, B needs as many rows as A has columns, namely 2. The answer is verdict = undefined; needed = 2."
          - problem: "Suppose $A$ is a $3 \\times 4$ matrix, the product $AB$ is defined, and $AB$ has size $3 \\times 5$. Find the number of rows and the number of columns of $B$."
            answer: "Brows = 4; Bcols = 5"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "Brows"}, {"contract": {"kind": "exact"}, "name": "Bcols"}]}
            solution_sketch: "Read the given sizes: A is 3x4 and AB is 3x5. The product rule says the inner sizes match, so the rows of B equal the 4 columns of A. The columns of AB equal the columns of B, so B has 5 columns. The answer is Brows = 4; Bcols = 5."
          - problem: "Let $A$ be a $2 \\times 3$ matrix, $B$ a $3 \\times 3$ matrix, and $C$ a $3 \\times 2$ matrix. Give the size of the product $ABC$ as its number of rows and columns."
            answer: "rows = 2; cols = 2"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "rows"}, {"contract": {"kind": "exact"}, "name": "cols"}]}
            solution_sketch: "Work from the left with the row-column rule: AB is (2x3)(3x3), the inner sizes 3 and 3 match, so AB is 2x3. Then (AB)C is (2x3)(3x2), the inner sizes 3 and 3 match, so ABC is 2x2. The answer is rows = 2; cols = 2."
          - problem: "Let $A$ be a $3 \\times 4$ matrix and let $I$ be the $4 \\times 4$ identity matrix. Give the size of $AI$ as its number of rows and columns."
            answer: "rows = 3; cols = 4"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "rows"}, {"contract": {"kind": "exact"}, "name": "cols"}]}
            solution_sketch: "Check that the product is defined: A is 3x4 and I is 4x4, and the inner sizes 4 and 4 match. The product keeps the outer sizes, so AI has the 3 rows of A and the 4 columns of I. The answer is rows = 3; cols = 4."
          - problem: "Let $A$ be $3 \\times 2$, $B$ be $2 \\times 3$, and $C$ be $3 \\times 3$. How many of the products $AB$, $BA$, $BC$, $CA$, $AC$ are defined?"
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Test each product by its inner sizes with the product rule. AB is (3x2)(2x3), defined; BA is (2x3)(3x2), defined; BC is (2x3)(3x3), defined; CA is (3x3)(3x2), defined. AC is (3x2)(3x3), not defined because 2 does not equal 3. Four products are defined, so the answer is 4."
        constraints: "sizes up to 4x5"
    diagnostic_exemplar:
      problem: 'For $A = \begin{pmatrix}1&2\\0&1\end{pmatrix}$ and $B = \begin{pmatrix}2&0\\1&1\end{pmatrix}$, compute $AB - BA$.'
      answer: "[2,-2;0,-2]"
      answer_contract: {"cols":2,"kind":"matrix","rows":2}
      solution_sketch: '$AB = \begin{pmatrix}4&2\\1&1\end{pmatrix}$, $BA = \begin{pmatrix}2&4\\1&3\end{pmatrix}$; subtract entrywise.'
    anki_seeds:
      - front: 'Is matrix multiplication commutative?'
        back: 'No; $AB \neq BA$ in general (even when both are defined).'
        type: basic
      - front: 'Distributive law for matrices?'
        back: '$A(B + C) = AB + AC$ (and $(B + C)A = BA + CA$).'
        type: basic

  - id: matrix-powers
    name: Matrix Powers
    core: true
    difficulty: 0.6
    drill: false
    answer_kind: numeric
    expected_time_secs: 120
    prerequisites:
      - id: matrix-multiplication
        weight: 0.7
        key: true
      - id: matrix-operations
        weight: 0.4
      - id: diagonal-triangular-matrices
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: Squares and cubes
        key_prerequisites: [matrix-multiplication]
        exemplars:
          - problem: 'Compute $A^2$ for $A = \begin{pmatrix}1&1\\0&1\end{pmatrix}$.'
            answer: "[1,2;0,1]"
            answer_contract: {"cols":2,"kind":"matrix","rows":2}
          - problem: 'Compute $A^3$ for $A = \begin{pmatrix}1&1\\0&1\end{pmatrix}$.'
            answer: "[1,3;0,1]"
            answer_contract: {"cols":2,"kind":"matrix","rows":2}
            solution_sketch: '$A^3 = A^2 A$; the top-right entry grows by $1$ each power.'
          - problem: 'Compute $A^2$ for $A = \begin{pmatrix}2&1\\1&0\end{pmatrix}$.'
            answer: "[5,2;2,1]"
            answer_contract: {"cols":2,"kind":"matrix","rows":2}
            solution_sketch: 'Row 1: $4 + 1 = 5$, $2 + 0 = 2$; row 2: $2$, $1$.'
        constraints: "2x2 with entries in -3..3; powers up to 3"
      - id: kp2
        name: Powers of diagonal matrices
        key_prerequisites: [diagonal-triangular-matrices, matrix-multiplication]
        exemplars:
          - problem: 'Compute $D^3$ for $D = \begin{pmatrix}2&0\\0&3\end{pmatrix}$.'
            answer: "[8,0;0,27]"
            answer_contract: {"cols":2,"kind":"matrix","rows":2}
            solution_sketch: 'Raise each diagonal entry to the power.'
          - problem: "Compute $D^4$ for $D = \\begin{pmatrix}3&0\\\\0&-2\\end{pmatrix}$. Give the matrix as [a,b;c,d]."
            answer: "[81,0;0,16]"
            answer_contract: {"cols": 2, "kind": "matrix", "rows": 2}
            solution_sketch: "Rule: for a diagonal matrix, $D^k$ raises each diagonal entry to the power $k$ and keeps every off-diagonal entry zero. Full object: $D^4 = \\begin{pmatrix}3^4&0\\\\0&(-2)^4\\end{pmatrix}$. Compute $3^4 = 81$ and $(-2)^4 = 16$; the even exponent removes the sign. The answer is [81,0;0,16]."
          - problem: "Let $D = \\begin{pmatrix}-1&0\\\\0&-3\\end{pmatrix}$. Find $D^3$ and give it as [a,b;c,d]."
            answer: "[-1,0;0,-27]"
            answer_contract: {"cols": 2, "kind": "matrix", "rows": 2}
            solution_sketch: "Rule: powers of a diagonal matrix raise each diagonal entry to the exponent, with zeros elsewhere. Full object: $D^3 = \\begin{pmatrix}(-1)^3&0\\\\0&(-3)^3\\end{pmatrix}$. Compute $(-1)^3 = -1$ and $(-3)^3 = -27$; an odd exponent keeps each negative sign. The answer is [-1,0;0,-27]."
          - problem: "For $D = \\begin{pmatrix}-2&0\\\\0&3\\end{pmatrix}$, let off be the entry in row 1, column 2 of $D^3$, and let diag be the entry in row 2, column 2 of $D^4$. What are off and diag?"
            answer: "off = 0; diag = 81"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "off"}, {"contract": {"kind": "exact"}, "name": "diag"}]}
            solution_sketch: "Full objects first: $D^3 = \\begin{pmatrix}-8&0\\\\0&27\\end{pmatrix}$ and $D^4 = \\begin{pmatrix}16&0\\\\0&81\\end{pmatrix}$, because a power of a diagonal matrix keeps the zeros off the diagonal and raises each diagonal entry to the exponent. The row 1, column 2 entry of $D^3$ is $0$. The row 2, column 2 entry of $D^4$ is $3^4 = 81$. The answer is off = 0; diag = 81."
          - problem: "A transformation with matrix $D = \\begin{pmatrix}2&0\\\\0&-1\\end{pmatrix}$ is applied three times in a row to the point $(1,5)$. Give the resulting point as (x, y)."
            answer: "(8,-5)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "Applying the transformation three times means computing $D^3$ and then acting on the point. Full object: $D^3 = \\begin{pmatrix}2^3&0\\\\0&(-1)^3\\end{pmatrix} = \\begin{pmatrix}8&0\\\\0&-1\\end{pmatrix}$. Then $D^3(1,5) = (8 \\cdot 1,\\; (-1) \\cdot 5)$. The final point is (8,-5)."
          - problem: "Let $D = \\begin{pmatrix}-1&0\\\\0&1\\end{pmatrix}$. Determine $D^4$ and give the matrix as [a,b;c,d]."
            answer: "[1,0;0,1]"
            answer_contract: {"cols": 2, "kind": "matrix", "rows": 2}
            solution_sketch: "Rule: $D^k$ for a diagonal matrix raises each diagonal entry to $k$ and leaves the off-diagonal zeros. Full object: $D^4 = \\begin{pmatrix}(-1)^4&0\\\\0&1^4\\end{pmatrix}$. Compute $(-1)^4 = 1$ and $1^4 = 1$, so $D^4$ is the identity matrix. The answer is [1,0;0,1]."
        constraints: "diagonal entries in -3..3; exponents up to 4 or symbolic n"
      - id: kp3
        name: Power patterns
        key_prerequisites: [matrix-multiplication, matrix-operations]
        exemplars:
          - problem: 'Compute $N^2$ for $N = \begin{pmatrix}0&1\\0&0\end{pmatrix}$.'
            answer: "[0,0;0,0]"
            answer_contract: {"cols":2,"kind":"matrix","rows":2}
            solution_sketch: '$N$ is nilpotent: $N^2 = O$, so all higher powers vanish too.'
          - problem: "Let $A = \\begin{pmatrix}1&1\\\\0&1\\end{pmatrix}$. Compute $A^2$ and $A^3$ to find the pattern in the powers of $A$. Give the top-left entry of $A^n$ as $u$ and the top-right entry of $A^n$ as $v$."
            answer: "u = 1; v = n"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "function", "vars": ["n"]}, "name": "u"}, {"contract": {"kind": "function", "vars": ["n"]}, "name": "v"}]}
            solution_sketch: "Compute $A^2 = \\begin{pmatrix}1&2\\\\0&1\\end{pmatrix}$ and $A^3 = \\begin{pmatrix}1&3\\\\0&1\\end{pmatrix}$ by direct multiplication; each multiplication adds $1$ to the top-right entry. The diagonal entries stay $1$ and the lower entries stay $0$ for every power. Therefore the entries of $A^n$ are u = 1; v = n."
          - problem: "Let $B = \\begin{pmatrix}0&1\\\\-1&0\\end{pmatrix}$. Compute $B^2$, then use the pattern you see to compute $B^4$. Give the matrix as [a,b;c,d]."
            answer: "[1,0;0,1]"
            answer_contract: {"cols": 2, "kind": "matrix", "rows": 2}
            solution_sketch: "Compute $B^2$ by matrix multiplication: the diagonal entries are $0 \\cdot 0 + 1 \\cdot (-1) = -1$ and the off-diagonal entries are $0 \\cdot 1 + 1 \\cdot 0 = 0$ and $(-1) \\cdot 0 + 0 \\cdot (-1) = 0$, so $B^2 = [-1,0;0,-1] = -I$. Since $B^4 = (B^2)^2$ and the square of $-I$ is $I$, both diagonal entries of $B^4$ are $1$ and both off-diagonal entries are $0$. Therefore $B^4 = $ [1,0;0,1]."
          - problem: "Let $P = \\begin{pmatrix}1&1\\\\0&0\\end{pmatrix}$. Compute $P^2$, and use the pattern you see to compute $P^5$. Give the matrix as [a,b;c,d]."
            answer: "[1,1;0,0]"
            answer_contract: {"cols": 2, "kind": "matrix", "rows": 2}
            solution_sketch: "Compute $P^2$ by matrix multiplication: the products reproduce $P$, so $P^2 = \\begin{pmatrix}1&1\\\\0&0\\end{pmatrix} = P$. Since the square equals the matrix itself, multiplying by $P$ again changes nothing, so every higher power equals $P$ too. Therefore $P^5 = $ [1,1;0,0]."
          - problem: "Let $D = \\begin{pmatrix}3&0\\\\0&2\\end{pmatrix}$. Compute $D^2$, then compute $D^3$. Give the matrix as [a,b;c,d]."
            answer: "[27,0;0,8]"
            answer_contract: {"cols": 2, "kind": "matrix", "rows": 2}
            solution_sketch: "Compute $D^2$ by matrix multiplication: the off-diagonal products are $0$, and each diagonal entry is squared, so $D^2 = \\begin{pmatrix}9&0\\\\0&4\\end{pmatrix}$. For the third power each diagonal entry is cubed: $3^3 = 27$ and $2^3 = 8$, while the off-diagonal entries stay $0$. Therefore $D^3 = $ [27,0;0,8]."
          - problem: "Let $M = \\begin{pmatrix}3&4\\\\4&-3\\end{pmatrix}$. Compute $M^2$. Give the matrix as [a,b;c,d]."
            answer: "[25,0;0,25]"
            answer_contract: {"cols": 2, "kind": "matrix", "rows": 2}
            solution_sketch: "Compute $M^2$ by matrix multiplication: the $(1,1)$ entry is $3 \\cdot 3 + 4 \\cdot 4 = 25$ and the $(2,2)$ entry is $4 \\cdot 4 + (-3)(-3) = 25$. Each off-diagonal entry is $3 \\cdot 4 + 4 \\cdot (-3) = 12 - 12 = 0$, since the sign of $-3$ cancels the cross terms. Therefore $M^2 = $ [25,0;0,25]."
        constraints: "patterns verifiable by computing two or three powers"
    diagnostic_exemplar:
      problem: 'For $A = \begin{pmatrix}1&2\\0&1\end{pmatrix}$, compute $A^2$ and $A^3$, then give a formula for $A^n$.'
      answer: '$A^2 = \begin{pmatrix}1&4\\0&1\end{pmatrix}$, $A^3 = \begin{pmatrix}1&6\\0&1\end{pmatrix}$, $A^n = \begin{pmatrix}1&2n\\0&1\end{pmatrix}$'
      answer_contract: {kind: none}
      solution_sketch: 'Each multiplication by $A$ adds $2$ to the top-right entry and leaves the rest fixed.'
    anki_seeds:
      - front: '$A^n$ makes sense only for what kind of matrix?'
        back: 'A square matrix (sizes must chain: $A \cdot A$ needs columns = rows).'
        type: basic
      - front: 'Powers of a diagonal matrix?'
        back: 'Raise each diagonal entry to that power.'
        type: basic

  - id: transpose-of-a-matrix
    name: The Transpose
    core: true
    difficulty: 0.55
    drill: false
    answer_kind: numeric
    expected_time_secs: 90
    prerequisites:
      - id: matrix-addition-scalar-multiplication
        weight: 0.7
        key: true
      - id: augmented-matrix-representation
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: Computing transposes
        key_prerequisites: [matrix-addition-scalar-multiplication]
        exemplars:
          - problem: 'Compute $A^T$ for $A = \begin{pmatrix}1&2&3\\4&5&6\end{pmatrix}$.'
            answer: "[1,4;2,5;3,6]"
            answer_contract: {"cols":2,"kind":"matrix","rows":3}
            solution_sketch: 'Rows become columns; a $2 \times 3$ matrix transposes to $3 \times 2$.'
          - problem: 'Compute $A^T$ for $A = \begin{pmatrix}2&-1\\0&3\end{pmatrix}$.'
            answer: "[2,0;-1,3]"
            answer_contract: {"cols":2,"kind":"matrix","rows":2}
          - problem: "Compute $A^T$ for $A = \\begin{pmatrix}3&-2&5\\\\1&0&-4\\\\6&2&-1\\end{pmatrix}$. Give the matrix as [a,b;c,d]."
            answer: "[3,1,6;-2,0,2;5,-4,-1]"
            answer_contract: {"cols": 3, "kind": "matrix", "rows": 3}
            solution_sketch: "Read the rows of $A$: $(3,-2,5)$, $(1,0,-4)$, $(6,2,-1)$. The transpose rule turns each row into a column, so row 1 becomes column 1, row 2 column 2, row 3 column 3. The $3 \\times 3$ matrix stays $3 \\times 3$. The result is [3,1,6;-2,0,2;5,-4,-1]."
          - problem: "Compute $A^T$ for $A = \\begin{pmatrix}6&-3\\\\0&5\\\\-2&1\\end{pmatrix}$. Give the matrix as [a,b;c,d]."
            answer: "[6,0,-2;-3,5,1]"
            answer_contract: {"cols": 3, "kind": "matrix", "rows": 2}
            solution_sketch: "The rows of $A$ are $(6,-3)$, $(0,5)$, $(-2,1)$. Each row becomes a column, so column 1 of $A^T$ is $(6,0,-2)$ and column 2 is $(-3,5,1)$. A $3 \\times 2$ matrix transposes to a $2 \\times 3$ matrix. The answer is [6,0,-2;-3,5,1]."
          - problem: "The transpose of a matrix $A$ is $A^T = \\begin{pmatrix}4&-5\\\\-1&6\\end{pmatrix}$. Find $A$. Give the matrix as [a,b;c,d]."
            answer: "[4,-1;-5,6]"
            answer_contract: {"cols": 2, "kind": "matrix", "rows": 2}
            solution_sketch: "Since $A^T$ has the rows of $A$ as its columns, the columns of $A^T$ are the rows of $A$. Column 1 of $A^T$ is $(4,-1)$, so row 1 of $A$ is $(4,-1)$; column 2 is $(-5,6)$, so row 2 is $(-5,6)$. Transposing twice returns the original matrix. Therefore $A$ = [4,-1;-5,6]."
          - problem: "Compute $A^T$ for the row matrix $A = \\begin{pmatrix}5&-3&2\\end{pmatrix}$. Give the answer in the [a,b;c,d] entry style, as [a;b;c]."
            answer: "[5;-3;2]"
            answer_contract: {"cols": 1, "kind": "matrix", "rows": 3}
            solution_sketch: "The single row $(5,-3,2)$ becomes a single column under the transpose rule. So the entry 5 goes to position 1, the entry -3 to position 2, and the entry 2 to position 3. A $1 \\times 3$ row matrix transposes to a $3 \\times 1$ column matrix. The answer is [5;-3;2]."
        constraints: "sizes up to 3x3; integer entries in -6..6"
      - id: kp2
        name: Transpose sizes and the double transpose
        key_prerequisites: [matrix-addition-scalar-multiplication]
        exemplars:
          - problem: "If $A$ is a $3 \\times 4$ matrix, what size is $A^T$? Give the size as (rows, columns)."
            answer: "(4,3)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "Rule: transposing an m by n matrix gives an n by m matrix, because every row becomes a column. The matrix A has 3 rows and 4 columns, so A^T has 4 rows and 3 columns. The size of A^T is (4,3)."
          - problem: "Compute $(A^T)^T$ for $A = \\begin{pmatrix}1&2\\\\3&4\\end{pmatrix}$. Give the answer as [a,b;c,d]."
            answer: "[1,2;3,4]"
            answer_contract: {"cols": 2, "kind": "matrix", "rows": 2}
            solution_sketch: "Rule: the double transpose returns the original matrix, (A^T)^T = A. Transposing the 2 by 2 matrix A swaps rows and columns, and transposing a second time swaps them back again. The result is [1,2;3,4]."
          - problem: "Compute $(A^T)^T$ for $A = \\begin{pmatrix}5&0&-2\\\\3&1&4\\end{pmatrix}$. Give the answer as [a,b;c,d]."
            answer: "[5,0,-2;3,1,4]"
            answer_contract: {"cols": 3, "kind": "matrix", "rows": 2}
            solution_sketch: "Rule: (A^T)^T = A holds for rectangular matrices as well as square ones. The first transpose turns the 2 by 3 matrix into a 3 by 2 matrix, and the second transpose restores every entry to its original place. The result is [5,0,-2;3,1,4]."
          - problem: "If $A^T$ is a $5 \\times 2$ matrix, what size is $A$? Give the size as (rows, columns)."
            answer: "(2,5)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "Rule: transposing swaps the rows and the columns of a matrix. Since A^T has 5 rows and 2 columns, the matrix A itself must have 2 rows and 5 columns. The size of A is (2,5)."
          - problem: "If $A$ is a $3 \\times 6$ matrix, what size is $(A^T)^T$? Give the size as (rows, columns)."
            answer: "(3,6)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "Rule: the double transpose gives back A itself, so (A^T)^T has exactly the same size as A. The matrix A has 3 rows and 6 columns, which lies within the allowed size range. The size of (A^T)^T is (3,6)."
          - problem: "If $(A^T)^T$ is a $1 \\times 4$ matrix, what size is $A^T$? Give the size as (rows, columns)."
            answer: "(4,1)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "Rule: the double transpose equals A, so A itself is a 1 by 4 matrix. Transposing A swaps its rows and columns, so A^T has 4 rows and 1 column. The size of A^T is (4,1)."
        constraints: "size questions up to 4x6"
      - id: kp3
        name: Transpose of sums and scalar multiples
        key_prerequisites: [matrix-addition-scalar-multiplication]
        exemplars:
          - problem: "Let $A = \\begin{pmatrix}2&1\\\\0&3\\end{pmatrix}$ and $B = \\begin{pmatrix}1&4\\\\2&5\\end{pmatrix}$. Verify $(A+B)^T = A^T + B^T$ numerically by computing $(A+B)^T$. Give the matrix as [a,b;c,d]."
            answer: "[3,2;5,8]"
            answer_contract: {"cols": 2, "kind": "matrix", "rows": 2}
            solution_sketch: "Transpose rules: add first, then swap rows and columns. Compute the sum: $A+B = \\begin{pmatrix}3&5\\\\2&8\\end{pmatrix}$. Swap rows and columns: the transpose is $\\begin{pmatrix}3&2\\\\5&8\\end{pmatrix}$. Transposing $A$ and $B$ first and adding gives the same matrix, confirming the sum rule. The answer is [3,2;5,8]."
          - problem: "Let $A = \\begin{pmatrix}1&-2\\\\4&0\\end{pmatrix}$. Verify $(3A)^T = 3A^T$ numerically by computing $(3A)^T$. Give the matrix as [a,b;c,d]."
            answer: "[3,12;-6,0]"
            answer_contract: {"cols": 2, "kind": "matrix", "rows": 2}
            solution_sketch: "Scalar multiple rule: the scalar factors out of a transpose. Scale first: $3A = \\begin{pmatrix}3&-6\\\\12&0\\end{pmatrix}$. Swap rows and columns: $(3A)^T = \\begin{pmatrix}3&12\\\\-6&0\\end{pmatrix}$. This equals $3A^T$, confirming the scalar rule. The answer is [3,12;-6,0]."
          - problem: "Let $A = \\begin{pmatrix}5&2\\\\1&3\\end{pmatrix}$ and $B = \\begin{pmatrix}2&0\\\\4&1\\end{pmatrix}$. Verify $(A-B)^T = A^T - B^T$ numerically by computing $(A-B)^T$. Give the matrix as [a,b;c,d]."
            answer: "[3,-3;2,2]"
            answer_contract: {"cols": 2, "kind": "matrix", "rows": 2}
            solution_sketch: "Transpose of a difference equals the difference of transposes. Subtract first: $A-B = \\begin{pmatrix}3&2\\\\-3&2\\end{pmatrix}$. Swap rows and columns: the transpose is $\\begin{pmatrix}3&-3\\\\2&2\\end{pmatrix}$. Computing $A^T - B^T$ gives the same matrix, so the rule holds. The answer is [3,-3;2,2]."
          - problem: "Let $A = \\begin{pmatrix}1&3\\\\2&0\\end{pmatrix}$ and $B = \\begin{pmatrix}0&1\\\\1&2\\end{pmatrix}$. Verify $(A+2B)^T = A^T + 2B^T$ numerically by computing $(A+2B)^T$. Give the matrix as [a,b;c,d]."
            answer: "[1,4;5,4]"
            answer_contract: {"cols": 2, "kind": "matrix", "rows": 2}
            solution_sketch: "Use both rules: the transpose of a sum is the sum of the transposes, and a scalar factors out. Compute $2B = \\begin{pmatrix}0&2\\\\2&4\\end{pmatrix}$, so $A+2B = \\begin{pmatrix}1&5\\\\4&4\\end{pmatrix}$. Swap rows and columns: the transpose is $\\begin{pmatrix}1&4\\\\5&4\\end{pmatrix}$. The answer is [1,4;5,4]."
          - problem: "Let $A$ be a $2 \\times 2$ matrix whose $(1,2)$ entry is $x$. A classmate computes $(2A)^T$ and reports that its $(2,1)$ entry equals $8$. Using the scalar-multiple transpose rule, find the $(1,2)$ entry of $A$."
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Transposing swaps the $(1,2)$ and $(2,1)$ entries, so the $(2,1)$ entry of $(2A)^T$ is the $(1,2)$ entry of $2A$. By the scalar rule, the $(1,2)$ entry of $2A$ is $2x$. Solve $2x = 8$, so $x = 4$. The answer is 4."
          - problem: "Let $A = \\begin{pmatrix}4&1\\\\0&2\\end{pmatrix}$ and $B = \\begin{pmatrix}1&3\\\\2&1\\end{pmatrix}$. Verify $(A-2B)^T = A^T - 2B^T$ numerically by computing $(A-2B)^T$. Give the matrix as [a,b;c,d]."
            answer: "[2,-4;-5,0]"
            answer_contract: {"cols": 2, "kind": "matrix", "rows": 2}
            solution_sketch: "The difference and scalar rules combine: transpose the combination entry by entry. Compute $2B = \\begin{pmatrix}2&6\\\\4&2\\end{pmatrix}$, so $A-2B = \\begin{pmatrix}2&-5\\\\-4&0\\end{pmatrix}$. Swap rows and columns: $(A-2B)^T = \\begin{pmatrix}2&-4\\\\-5&0\\end{pmatrix}$, matching $A^T - 2B^T$. The answer is [2,-4;-5,0]."
        constraints: "verify numerically on 2x2 matrices"
    diagnostic_exemplar:
      problem: 'For $A = \begin{pmatrix}1&5&0\\-2&0&3\end{pmatrix}$ and $B = \begin{pmatrix}0&1&2\\1&0&-1\end{pmatrix}$, compute $(A + 2B)^T$ and state its size.'
      answer: '$\begin{pmatrix}1&0\\7&0\\4&1\end{pmatrix}$, a $3 \times 2$ matrix'
      answer_contract: {kind: none}
      solution_sketch: '$A + 2B = \begin{pmatrix}1&7&4\\0&0&1\end{pmatrix}$; transposing turns its $2\times3$ shape into $3\times2$ (equivalently $A^T + 2B^T$).'
    anki_seeds:
      - front: 'The transpose $A^T$ is formed by...'
        back: 'turning the rows of $A$ into columns (entry $(i,j)$ moves to $(j,i)$).'
        type: basic

  - id: transpose-symmetric-matrices
    name: Transpose and Symmetric Matrices
    core: true
    difficulty: 0.6
    drill: false
    answer_kind: numeric
    expected_time_secs: 120
    prerequisites:
      - id: transpose-of-a-matrix
        weight: 0.8
        key: true
      - id: matrix-multiplication
        weight: 0.5
        key: true
      - id: matrix-operations
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: Transpose of products
        key_prerequisites: [transpose-of-a-matrix, matrix-multiplication]
        exemplars:
          - problem: 'For $A = \begin{pmatrix}1&2\\0&1\end{pmatrix}$, $B = \begin{pmatrix}1&0\\3&1\end{pmatrix}$, compute $(AB)^T$.'
            answer: "[7,3;2,1]"
            answer_contract: {"cols":2,"kind":"matrix","rows":2}
            solution_sketch: '$AB = \begin{pmatrix}7&2\\3&1\end{pmatrix}$; transpose it. (Check: $B^T A^T$ gives the same.)'
          - problem: "Let $A = \\begin{pmatrix}2&3\\\\1&4\\end{pmatrix}$ and $B = \\begin{pmatrix}1&2\\\\0&5\\end{pmatrix}$. Compute $(AB)^T$. Give the matrix as [a,b;c,d]."
            answer: "[2,1;19,22]"
            answer_contract: {"cols": 2, "kind": "matrix", "rows": 2}
            solution_sketch: "First form the full product: $AB = \\begin{pmatrix}2&19\\\\1&22\\end{pmatrix}$ (matrix multiplication rule). Then transpose by swapping rows and columns (transpose rule). Reversal check: $B^T A^T$ gives the same matrix. The answer is [2,1;19,22]."
          - problem: "For $A = \\begin{pmatrix}3&1\\\\2&2\\end{pmatrix}$ and $B = \\begin{pmatrix}1&4\\\\0&1\\end{pmatrix}$, compute $(AB)^T$ and confirm that $B^T A^T$ matches. Give the matrix as [a,b;c,d]."
            answer: "[3,2;13,10]"
            answer_contract: {"cols": 2, "kind": "matrix", "rows": 2}
            solution_sketch: "Multiply: $AB = \\begin{pmatrix}3&13\\\\2&10\\end{pmatrix}$ (matrix multiplication rule). Transposing swaps entries (transpose rule): $\\begin{pmatrix}3&2\\\\13&10\\end{pmatrix}$. Reversal check: $B^T A^T$ gives the same matrix, [3,2;13,10]."
          - problem: "Let $A = \\begin{pmatrix}1&5\\\\2&3\\end{pmatrix}$ and $B = \\begin{pmatrix}2&0\\\\1&4\\end{pmatrix}$. Compute $B^T A^T$ without forming $AB$ first, using the reversal rule $(AB)^T = B^T A^T$. Give the matrix as [a,b;c,d]."
            answer: "[7,7;20,12]"
            answer_contract: {"cols": 2, "kind": "matrix", "rows": 2}
            solution_sketch: "Transpose each factor first: $B^T = \\begin{pmatrix}2&1\\\\0&4\\end{pmatrix}$ and $A^T = \\begin{pmatrix}1&2\\\\5&3\\end{pmatrix}$ (transpose rule). Multiply in reversed order (matrix multiplication rule): $\\begin{pmatrix}7&7\\\\20&12\\end{pmatrix}$. Direct check: $AB = \\begin{pmatrix}7&20\\\\7&12\\end{pmatrix}$, whose transpose is [7,7;20,12]."
          - problem: "For the matrix $A = \\begin{pmatrix}2&1\\\\4&3\\end{pmatrix}$, compute the product $A^T A$. Give the matrix as [a,b;c,d]."
            answer: "[20,14;14,10]"
            answer_contract: {"cols": 2, "kind": "matrix", "rows": 2}
            solution_sketch: "Transpose $A$: $A^T = \\begin{pmatrix}2&4\\\\1&3\\end{pmatrix}$ (transpose rule). Multiply $A^T A$ (matrix multiplication rule): row 1 is $[4+16,\\ 2+12]$, row 2 is $[2+12,\\ 1+9]$. The result is symmetric, as the reversal rule with $B = A$ predicts, namely [20,14;14,10]."
          - problem: "Let $A = \\begin{pmatrix}1&0\\\\2&1\\end{pmatrix}$, $B = \\begin{pmatrix}1&1\\\\0&1\\end{pmatrix}$ and $C = \\begin{pmatrix}2&0\\\\1&3\\end{pmatrix}$. Compute $C^T B^T A^T$ and verify it equals $(ABC)^T$. Give the matrix as [a,b;c,d]."
            answer: "[3,7;3,9]"
            answer_contract: {"cols": 2, "kind": "matrix", "rows": 2}
            solution_sketch: "The reversal rule extends to three factors: $(ABC)^T = C^T B^T A^T$. Compute $C^T B^T = \\begin{pmatrix}3&1\\\\3&3\\end{pmatrix}$, then multiply by $A^T = \\begin{pmatrix}1&2\\\\0&1\\end{pmatrix}$ (matrix multiplication rule), giving $\\begin{pmatrix}3&7\\\\3&9\\end{pmatrix}$. Direct check: $ABC = \\begin{pmatrix}3&3\\\\7&9\\end{pmatrix}$, whose transpose is [3,7;3,9]."
        constraints: "verify the reversal rule numerically on 2x2 matrices"
      - id: kp2
        name: Symmetric matrices
        key_prerequisites: [transpose-of-a-matrix]
        exemplars:
          - problem: 'Find $k$ so that $\begin{pmatrix}1&k\\3&2\end{pmatrix}$ is symmetric.'
            answer: "k = 3"
            solution_sketch: 'Symmetric means $A = A^T$, i.e. the $(1,2)$ and $(2,1)$ entries agree.'
          - problem: "Let A = [0, k; -7, 3]. Find k so that A is symmetric."
            answer: "-7"
            answer_contract: {"kind": "exact"}
            solution_sketch: "A matrix is symmetric when it equals its transpose, so each entry a_ij must equal a_ji. In A = [0, k; -7, 3] the entry (1,2) is k and the entry (2,1) is -7, so the symmetry condition forces k = -7. The required value is -7."
          - problem: "Let A = [4, 0, 3; 0, -2, 5; k, 5, 1]. Determine k so that A is symmetric."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Symmetry means A equals A^T, so every pair of mirror entries must agree. Check each pair in [4, 0, 3; 0, -2, 5; k, 5, 1]: entries (1,2) and (2,1) give 0 = 0, entries (2,3) and (3,2) give 5 = 5. The remaining pair (1,3) and (3,1) forces k to equal 3. The required value is 3."
          - problem: "Let A = [3, 1; 2, 4]. Compute the product A^T A. Give verdict (yes or no) for whether A^T A is symmetric, and give m12, its (1,2) entry."
            answer: "verdict = yes; m12 = 11"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["yes"], ["no"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "m12"}]}
            solution_sketch: "Transpose A = [3, 1; 2, 4] by swapping rows and columns: A^T = [3, 2; 1, 4]. Multiply A^T A entry by entry: (1,1) is 9 + 4 = 13, (1,2) is 3 + 8 = 11, (2,1) is 3 + 8 = 11, (2,2) is 1 + 16 = 17. The mirror entries (1,2) and (2,1) both equal 11, which agrees with the rule (A^T A)^T = A^T (A^T)^T = A^T A, so the product is symmetric. The answer is verdict = yes; m12 = 11."
          - problem: "Let B = [1, 2, 0; 0, 1, 3; 4, 0, 1]. Compute the product B^T B. Give the matrix as [a,b;c,d]."
            answer: "[17,2,4;2,5,3;4,3,10]"
            answer_contract: {"cols": 3, "kind": "matrix", "rows": 3}
            solution_sketch: "Write B = [1, 2, 0; 0, 1, 3; 4, 0, 1] and transpose it by swapping rows and columns: B^T = [1, 0, 4; 2, 1, 0; 0, 3, 1]. Multiply rows of B^T by columns of B using the row-by-column rule: row 1 gives 17, 2, 4; row 2 gives 2, 5, 3; row 3 gives 4, 3, 10. The mirror entries agree, as expected since (B^T B)^T = B^T B. The answer is [17,2,4;2,5,3;4,3,10]."
          - problem: "Four matrices are offered as choices, and three of them are not symmetric. Select the symmetric matrix."
            answer: "[3,5;5,-1]"
            answer_contract: {"kind": "label", "options": [["[3,5;5,-1]"], ["[3,5;1,5]"], ["[2,4;-4,2]"], ["[6,1,2;1,0,3;2,4,5]"]]}
            solution_sketch: "A matrix is symmetric when it equals its transpose, so every mirror pair of entries must agree. The option [3,5;1,5] fails because entries (1,2) and (2,1) are 5 and 1. The option [2,4;-4,2] fails because entries (1,2) and (2,1) are 4 and -4, differing in sign. The option [6,1,2;1,0,3;2,4,5] fails because entries (2,3) and (3,2) are 3 and 4. In [3,5;5,-1] the mirror entries (1,2) and (2,1) are both 5, so the answer is [3,5;5,-1]."
        constraints: "2x2 and 3x3; one unknown entry for solve-for-k problems"
      - id: kp3
        name: Building symmetric matrices
        key_prerequisites: [transpose-of-a-matrix, matrix-operations]
        exemplars:
          - problem: 'Compute $A + A^T$ for $A = \begin{pmatrix}1&4\\0&3\end{pmatrix}$ and confirm it is symmetric.'
            answer: "[2,4;4,6]"
            answer_contract: {"cols":2,"kind":"matrix","rows":2}
          - problem: 'Compute $A + A^T$ for $A = \begin{pmatrix}1&2\\3&4\end{pmatrix}$.'
            answer: "[2,5;5,8]"
            answer_contract: {"cols":2,"kind":"matrix","rows":2}
            solution_sketch: '$A^T = \begin{pmatrix}1&3\\2&4\end{pmatrix}$; add entrywise. $A + A^T$ is always symmetric.'
          - problem: "Compute $A + A^T$ for $A = \\begin{pmatrix}5&2\\\\0&3\\end{pmatrix}$. Give the matrix as [a,b;c,d]."
            answer: "[10,2;2,6]"
            answer_contract: {"cols": 2, "kind": "matrix", "rows": 2}
            solution_sketch: "First write the full transpose: $A^T = \\begin{pmatrix}5&0\\\\2&3\\end{pmatrix}$. Add entrywise: $5+5=10$, $2+0=2$, $0+2=2$, $3+3=6$. The result $\\begin{pmatrix}10&2\\\\2&6\\end{pmatrix}$ equals its own transpose, so it is symmetric. The answer is [10,2;2,6]."
          - problem: "Compute $A^T A$ for $A = \\begin{pmatrix}2&0\\\\1&3\\end{pmatrix}$. Give the matrix as [a,b;c,d]."
            answer: "[5,3;3,9]"
            answer_contract: {"cols": 2, "kind": "matrix", "rows": 2}
            solution_sketch: "Write the full transpose: $A^T = \\begin{pmatrix}2&1\\\\0&3\\end{pmatrix}$. Multiply $A^T$ by $A$: entry (1,1) is $4+1=5$, entry (1,2) is $0+3=3$, entry (2,1) is $0+3=3$, entry (2,2) is $0+9=9$. The off-diagonal entries 3 and 3 match, so the product is symmetric. The answer is [5,3;3,9]."
          - problem: "Compute $A A^T$ for $A = \\begin{pmatrix}1&-1\\\\2&3\\end{pmatrix}$. Give the matrix as [a,b;c,d]."
            answer: "[2,-1;-1,13]"
            answer_contract: {"cols": 2, "kind": "matrix", "rows": 2}
            solution_sketch: "Write the full transpose: $A^T = \\begin{pmatrix}1&2\\\\-1&3\\end{pmatrix}$. Multiply $A$ by $A^T$: entry (1,1) is $1+1=2$, entry (1,2) is $2-3=-1$, entry (2,1) is $2-3=-1$, entry (2,2) is $4+9=13$. The product $\\begin{pmatrix}2&-1\\\\-1&13\\end{pmatrix}$ equals its transpose. The answer is [2,-1;-1,13]."
          - problem: "The matrix $\\begin{pmatrix}4&k\\\\2k-1&7\\end{pmatrix}$ should be symmetric. Determine the value of $k$."
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "A matrix is symmetric when the (1,2) entry equals the (2,1) entry. Set $k = 2k - 1$ and solve: subtract $k$ to get $0 = k - 1$, so $k = 1$. Check: the matrix becomes $\\begin{pmatrix}4&1\\\\1&7\\end{pmatrix}$, which visibly satisfies $A = A^T$. The answer is 1."
        constraints: "2x2 integer matrices; the result must visibly satisfy A = A^T"
    diagnostic_exemplar:
      problem: 'Compute $A^TA$ for $A = \begin{pmatrix}1&3\\0&2\end{pmatrix}$, and explain why the result had to be symmetric.'
      answer: '$A^TA = \begin{pmatrix}1&3\\3&13\end{pmatrix}$; it is symmetric because $(A^TA)^T = A^T(A^T)^T = A^TA$'
      answer_contract: {kind: none}
      solution_sketch: '$A^T = \begin{pmatrix}1&0\\3&2\end{pmatrix}$, so $A^TA = \begin{pmatrix}1&3\\3&13\end{pmatrix}$; the reversal rule $(XY)^T = Y^TX^T$ makes $A^TA$ its own transpose.'
    anki_seeds:
      - front: '$(AB)^T = $ ?'
        back: '$B^T A^T$ — the order reverses.'
        type: basic
      - front: 'A matrix $A$ is symmetric when...'
        back: '$A = A^T$ (it must be square).'
        type: basic

  - id: matrix-inverse-2x2-formula
    name: The 2x2 Inverse Formula
    core: true
    difficulty: 0.6
    drill: false
    answer_kind: numeric
    expected_time_secs: 120
    prerequisites:
      - id: matrix-multiplication
        weight: 0.7
        key: true
      - id: identity-zero-matrices
        weight: 0.5
        key: true
      - id: diagonal-triangular-matrices
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: Applying the formula
        key_prerequisites: [matrix-multiplication, identity-zero-matrices]
        exemplars:
          - problem: 'Find $A^{-1}$ for $A = \begin{pmatrix}2&1\\5&3\end{pmatrix}$.'
            answer: "[3,-1;-5,2]"
            answer_contract: {"cols":2,"kind":"matrix","rows":2}
            solution_sketch: '$ad - bc = 6 - 5 = 1$; swap the diagonal, negate the off-diagonal, divide by $1$. Check: $AA^{-1} = I$.'
          - problem: 'Find $A^{-1}$ for $A = \begin{pmatrix}1&1\\1&2\end{pmatrix}$.'
            answer: "[2,-1;-1,1]"
            answer_contract: {"cols":2,"kind":"matrix","rows":2}
            solution_sketch: '$ad - bc = 2 - 1 = 1$.'
          - problem: "Find $A^{-1}$ for $A = \\begin{pmatrix}3&1\\\\2&1\\end{pmatrix}$. Give the matrix as [a,b;c,d]."
            answer: "[1,-1;-2,3]"
            answer_contract: {"cols": 2, "kind": "matrix", "rows": 2}
            solution_sketch: "For $A = \\begin{pmatrix}3&1\\\\2&1\\end{pmatrix}$, the determinant is $ad - bc = 3 - 2 = 1$. Swap the diagonal entries $3$ and $1$, and change the sign of $1$ and $2$. Divide each entry by $1$, which changes nothing. The inverse is [1,-1;-2,3]; check: $3\\cdot1 + 1\\cdot(-2) = 1$ and $3\\cdot(-1)+1\\cdot3 = 0$."
          - problem: "Find the inverse of $B = \\begin{pmatrix}1&2\\\\2&3\\end{pmatrix}$. Give the matrix as [a,b;c,d]."
            answer: "[-3,2;2,-1]"
            answer_contract: {"cols": 2, "kind": "matrix", "rows": 2}
            solution_sketch: "For $B = \\begin{pmatrix}1&2\\\\2&3\\end{pmatrix}$, the determinant is $ad - bc = 3 - 4 = -1$. The swapped matrix with changed signs is $\\begin{pmatrix}3&-2\\\\-2&1\\end{pmatrix}$. Dividing each entry by $-1$ flips every sign: $3$ to $-3$, $-2$ to $2$, $-2$ to $2$, $1$ to $-1$. The inverse is [-3,2;2,-1]; check: $1\\cdot(-3) + 2\\cdot2 = 1$."
          - problem: "Find $A^{-1}$ for $A = \\begin{pmatrix}4&3\\\\2&1\\end{pmatrix}$. Give the matrix as [a,b;c,d] with fractions in lowest terms."
            answer: "[-1/2,3/2;1,-2]"
            answer_contract: {"cols": 2, "kind": "matrix", "rows": 2}
            solution_sketch: "For $A = \\begin{pmatrix}4&3\\\\2&1\\end{pmatrix}$, the determinant is $ad - bc = 4 - 6 = -2$. The swapped matrix with changed signs is $\\begin{pmatrix}1&-3\\\\-2&4\\end{pmatrix}$. Dividing each entry by $-2$ gives $-1/2$, $3/2$, $1$, $-2$. The inverse is [-1/2,3/2;1,-2]; check: $4\\cdot(-1/2) + 3\\cdot1 = 1$."
          - problem: "The inverse of a matrix $A$ is $A^{-1} = \\begin{pmatrix}5&-2\\\\-2&1\\end{pmatrix}$. Find $A$. Give the matrix as [a,b;c,d]."
            answer: "[1,2;2,5]"
            answer_contract: {"cols": 2, "kind": "matrix", "rows": 2}
            solution_sketch: "Since $(A^{-1})^{-1} = A$, apply the same formula to $A^{-1} = \\begin{pmatrix}5&-2\\\\-2&1\\end{pmatrix}$. Its determinant is $5 - 4 = 1$. Swap the diagonal entries $5$ and $1$, and change the sign of $-2$ and $-2$. The matrix $A$ is [1,2;2,5]; check: $A A^{-1}$ has row 1 column 1 equal to $5 - 4 = 1$."
        constraints: "prefer ad - bc = +-1 for integer inverses"
      - id: kp2
        name: Fractional and diagonal inverses
        key_prerequisites: [matrix-multiplication, diagonal-triangular-matrices]
        exemplars:
          - problem: 'Find $A^{-1}$ for $A = \begin{pmatrix}1&2\\3&4\end{pmatrix}$.'
            answer: "[-2,1;3/2,-1/2]"
            answer_contract: {"cols":2,"kind":"matrix","rows":2}
            solution_sketch: '$ad - bc = -2$; $A^{-1} = \frac{1}{-2}\begin{pmatrix}4&-2\\-3&1\end{pmatrix}$.'
          - problem: 'Find the inverse of the diagonal matrix $\begin{pmatrix}2&0\\0&5\end{pmatrix}$.'
            answer: "[1/2,0;0,1/5]"
            answer_contract: {"cols":2,"kind":"matrix","rows":2}
            solution_sketch: 'Invert each diagonal entry; verify the product is $I$.'
          - problem: "Find $A^{-1}$ for $A = \\begin{pmatrix}2&3\\\\4&5\\end{pmatrix}$. Give the matrix as [a,b;c,d]."
            answer: "[-5/2,3/2;2,-1]"
            answer_contract: {"cols": 2, "kind": "matrix", "rows": 2}
            solution_sketch: "Determinant rule: $ad - bc = 2 \\cdot 5 - 3 \\cdot 4 = 10 - 12 = -2$. Adjugate rule: swap $2$ and $5$, negate $3$ and $4$, giving $\\begin{pmatrix}5&-3\\\\-4&2\\end{pmatrix}$. Division rule: divide every entry by $-2$. The inverse is [-5/2,3/2;2,-1]."
          - problem: "Find $A^{-1}$ for $A = \\begin{pmatrix}4&3\\\\6&5\\end{pmatrix}$. Give the matrix as [a,b;c,d]."
            answer: "[5/2,-3/2;-3,2]"
            answer_contract: {"cols": 2, "kind": "matrix", "rows": 2}
            solution_sketch: "Determinant rule: $ad - bc = 4 \\cdot 5 - 3 \\cdot 6 = 20 - 18 = 2$. Adjugate rule: swap $4$ and $5$, negate $3$ and $6$, giving $\\begin{pmatrix}5&-3\\\\-6&4\\end{pmatrix}$. Division rule: divide each entry by $2$. The inverse is [5/2,-3/2;-3,2]."
          - problem: "Find $D^{-1}$ for the diagonal matrix $D = \\begin{pmatrix}3&0\\\\0&4\\end{pmatrix}$. Give the matrix as [a,b;c,d]."
            answer: "[1/3,0;0,1/4]"
            answer_contract: {"cols": 2, "kind": "matrix", "rows": 2}
            solution_sketch: "Diagonal-inverse rule: both diagonal entries are nonzero, so invert each one and keep the off-diagonal zeros. Replace $3$ by $1/3$ and $4$ by $1/4$. Check with matrix multiplication: $D D^{-1}$ gives the identity matrix. The inverse is [1/3,0;0,1/4]."
          - problem: "Find $A^{-1}$ for the upper triangular matrix $A = \\begin{pmatrix}2&1\\\\0&1\\end{pmatrix}$. Give the matrix as [a,b;c,d]."
            answer: "[1/2,-1/2;0,1]"
            answer_contract: {"cols": 2, "kind": "matrix", "rows": 2}
            solution_sketch: "Determinant rule: $ad - bc = 2 \\cdot 1 - 1 \\cdot 0 = 2$. Adjugate rule: swap $2$ and $1$, negate $1$ and $0$, giving $\\begin{pmatrix}1&-1\\\\0&2\\end{pmatrix}$. Division rule: divide each entry by $2$. The inverse is [1/2,-1/2;0,1]."
        constraints: "ad - bc in {-2, 2} for fraction practice; nonzero diagonal entries"
      - id: kp3
        name: Singularity via the determinant condition
        key_prerequisites: [matrix-multiplication]
        exemplars:
          - problem: 'For which $k$ is $\begin{pmatrix}1&k\\2&6\end{pmatrix}$ NOT invertible?'
            answer: "k = 3"
            solution_sketch: '$6 - 2k = 0$.'
          - problem: "Let A be the matrix [3,6;2,4]. Determine whether A has an inverse, and give the value of its determinant ad - bc."
            answer: "verdict = singular; det = 0"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["invertible"], ["singular"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "det"}]}
            solution_sketch: "Use the determinant test: a 2x2 matrix [a,b;c,d] is singular exactly when ad - bc = 0. For A = [3,6;2,4], the determinant is 3*4 - 6*2 = 12 - 12 = 0. A zero determinant means the rows (3,6) and (2,4) are proportional, so no inverse exists. The option invertible is the error of adding the cross products, 3*4 + 6*2 = 24, instead of subtracting them. So det = 0 and verdict = singular."
          - problem: "Find the value of k for which the matrix [k,3;4,2] has no inverse."
            answer: "6"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Write the determinant of the matrix [k,3;4,2]: det = k*2 - 3*4 = 2k - 12. A matrix has no inverse exactly when its determinant is zero, so set 2k - 12 = 0. Solving gives 2k = 12 and k = 6. Thus k = 6."
          - problem: "The rows of the matrix [k,6;2,3] are proportional. Find the value of k that makes the matrix singular."
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Proportional rows give a zero determinant, since ad - bc = 0 encodes proportionality. For [k,6;2,3] the determinant is 3k - 12, so set 3k - 12 = 0. Solving gives 3k = 12 and k = 4. Check: (4,6) = 2*(2,3), so the rows are indeed proportional. Thus k = 4."
          - problem: "The matrix [5,b;2,-4] is singular. Find the value of b."
            answer: "-10"
            answer_contract: {"kind": "exact"}
            solution_sketch: "For the matrix [5,b;2,-4] the determinant is 5*(-4) - b*2 = -20 - 2b. A singular matrix has determinant zero, so solve -20 - 2b = 0. This gives 2b = -20 and b = -10. Thus b = -10."
          - problem: "Find every value of k for which the matrix [k,4;4,k] has no inverse. Give the answer as a set."
            answer: "{-4, 4}"
            answer_contract: {"kind": "set"}
            solution_sketch: "Compute the determinant of the matrix [k,4;4,k]: det = k*k - 4*4 = k^2 - 16. The matrix has no inverse when k^2 - 16 = 0, which factors as (k - 4)(k + 4) = 0. Both roots are integers, k = 4 and k = -4. So the answer is the set {-4, 4}."
        constraints: "singularity via proportional rows or ad - bc = 0; integer k answers"
    diagnostic_exemplar:
      problem: 'Find $A^{-1}$ for $A = \begin{pmatrix}4&2\\3&4\end{pmatrix}$, and state the value of $k$ for which $\begin{pmatrix}4&2\\3&k\end{pmatrix}$ would have no inverse.'
      answer: '$A^{-1} = \begin{pmatrix}2/5&-1/5\\-3/10&2/5\end{pmatrix}$; no inverse when $k = 3/2$'
      answer_contract: {kind: none}
      solution_sketch: '$\det A = 16 - 6 = 10$, so $A^{-1} = \frac{1}{10}\begin{pmatrix}4&-2\\-3&4\end{pmatrix}$; the determinant $4k - 6$ vanishes at $k = 3/2$.'
    anki_seeds:
      - front: 'Inverse of $\begin{pmatrix}a&b\\c&d\end{pmatrix}$ (when $ad - bc \neq 0$)?'
        back: '$\dfrac{1}{ad - bc}\begin{pmatrix}d&-b\\-c&a\end{pmatrix}$.'
        type: basic
      - front: 'A $2 \times 2$ matrix is invertible exactly when $ad - bc$ is...'
        back: 'nonzero'
        type: basic

  - id: matrix-inverses
    name: Matrix Inverses
    core: true
    difficulty: 0.65
    drill: false
    answer_kind: numeric
    expected_time_secs: 240
    prerequisites:
      - id: matrix-inverse-2x2-formula
        weight: 0.8
        key: true
      - id: row-reduction-echelon-forms
        weight: 0.6
        key: true
      - id: matrix-operations
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: Gauss-Jordan inversion via [A | I]
        key_prerequisites: [matrix-inverse-2x2-formula, row-reduction-echelon-forms]
        exemplars:
          - problem: 'Use the $[A \mid I]$ method to find $A^{-1}$ for $A = \begin{pmatrix}1&2\\1&3\end{pmatrix}$.'
            answer: "[3,-2;-1,1]"
            answer_contract: {"cols":2,"kind":"matrix","rows":2}
            solution_sketch: '$R_2 - R_1$ gives $[\,0\ 1 \mid -1\ 1\,]$; then $R_1 - 2R_2$ gives $[\,1\ 0 \mid 3\ -2\,]$.'
          - problem: 'Use the $[A \mid I]$ method to find $A^{-1}$ for $A = \begin{pmatrix}1&0\\2&1\end{pmatrix}$.'
            answer: "[1,0;-2,1]"
            answer_contract: {"cols":2,"kind":"matrix","rows":2}
            solution_sketch: 'One operation, $R_2 - 2R_1$, already turns the left block into $I$.'
          - problem: 'Find the inverse of $A = \begin{pmatrix}1&0&1\\0&1&0\\0&0&1\end{pmatrix}$ by row reducing $[A \mid I]$.'
            answer: "[1,0,-1;0,1,0;0,0,1]"
            answer_contract: {"cols":3,"kind":"matrix","rows":3}
            solution_sketch: '$R_1 - R_3$ finishes the reduction; verify $AA^{-1} = I_3$.'
          - problem: "Use the $[A \\mid I]$ method to find $A^{-1}$ for $A = \\begin{pmatrix}2&3\\\\1&2\\end{pmatrix}$. Give the matrix as [a,b;c,d]."
            answer: "[2,-3;-1,2]"
            answer_contract: {"cols": 2, "kind": "matrix", "rows": 2}
            solution_sketch: "Adjoin the identity: $[\\,2\\ 3 \\mid 1\\ 0;\\ 1\\ 2 \\mid 0\\ 1\\,]$. Step 1: $R_1 - 2R_2$ gives row 1 $[\\,0\\ -1 \\mid 1\\ -2\\,]$; scale by $-1$ and swap so row 1 is the pivot row. Step 2: $R_1 - 2R_2$ clears the $(1,2)$ entry, leaving $[\\,1\\ 0 \\mid 2\\ -3;\\ 0\\ 1 \\mid -1\\ 2\\,]$. The inverse is [2,-3;-1,2]."
          - problem: "Find the inverse of $A = \\begin{pmatrix}1&0&0\\\\2&1&0\\\\0&3&1\\end{pmatrix}$ by row reducing $[A \\mid I]$. Give the matrix as [a,b;c,d]."
            answer: "[1,0,0;-2,1,0;6,-3,1]"
            answer_contract: {"cols": 3, "kind": "matrix", "rows": 3}
            solution_sketch: "Adjoin $I_3$: $[\\,1\\ 0\\ 0 \\mid 1\\ 0\\ 0;\\ 2\\ 1\\ 0 \\mid 0\\ 1\\ 0;\\ 0\\ 3\\ 1 \\mid 0\\ 0\\ 1\\,]$. Step 1: $R_2 - 2R_1$ clears the $(2,1)$ entry, giving $[\\,0\\ 1\\ 0 \\mid -2\\ 1\\ 0\\,]$. Step 2: $R_3 - 3R_2$ with the new row 2 clears the $(3,2)$ entry and fills position $(3,1)$ with $6$, giving $[\\,0\\ 0\\ 1 \\mid 6\\ -3\\ 1\\,]$. The inverse is [1,0,0;-2,1,0;6,-3,1]."
          - problem: "Use row reduction of $[A \\mid I]$ to compute $A^{-1}$ for $A = \\begin{pmatrix}1&2&0\\\\0&1&3\\\\0&0&1\\end{pmatrix}$. Give the matrix as [a,b;c,d]."
            answer: "[1,-2,6;0,1,-3;0,0,1]"
            answer_contract: {"cols": 3, "kind": "matrix", "rows": 3}
            solution_sketch: "Adjoin $I_3$: $[\\,1\\ 2\\ 0 \\mid 1\\ 0\\ 0;\\ 0\\ 1\\ 3 \\mid 0\\ 1\\ 0;\\ 0\\ 0\\ 1 \\mid 0\\ 0\\ 1\\,]$. Step 1: $R_2 - 3R_3$ clears the $(2,3)$ entry, giving $[\\,0\\ 1\\ 0 \\mid 0\\ 1\\ -3\\,]$. Step 2: $R_1 - 2R_2$ clears the $(1,2)$ entry and produces the fill-in value $6$ in position $(1,3)$ of the right block. The inverse is [1,-2,6;0,1,-3;0,0,1]."
        constraints: "matrices with determinant +-1 so the inverse is integer; 3x3 only when nearly triangular"
      - id: kp2
        name: Solving Ax = b with an inverse
        key_prerequisites: [matrix-inverse-2x2-formula, matrix-operations]
        exemplars:
          - problem: 'Using $A = \begin{pmatrix}2&1\\5&3\end{pmatrix}$ and $A^{-1} = \begin{pmatrix}3&-1\\-5&2\end{pmatrix}$, solve $A\mathbf{x} = (4, 11)$.'
            answer: "x = (1, 2)"
            solution_sketch: '$\mathbf{x} = A^{-1}\mathbf{b} = (12 - 11, -20 + 22) = (1, 2)$.'
          - problem: 'Using $A^{-1} = \begin{pmatrix}1&-1\\-2&3\end{pmatrix}$, solve $A\mathbf{x} = (3, 7)$.'
            answer: "x = (-4, 15)"
            solution_sketch: '$\mathbf{x} = A^{-1}\mathbf{b} = (3 - 7, -6 + 21)$.'
          - problem: "Let $A = \\begin{pmatrix}1&2\\\\3&5\\end{pmatrix}$ with inverse $A^{-1} = \\begin{pmatrix}-5&2\\\\3&-1\\end{pmatrix}$. Solve $A\\mathbf{x} = (4, 7)$ and give the answer as (x, y)."
            answer: "(-6, 5)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "Step 1, inverse multiplication: the solution of $A\\mathbf{x} = \\mathbf{b}$ is $\\mathbf{x} = A^{-1}\\mathbf{b}$. Step 2, compute: $\\begin{pmatrix}-5&2\\\\3&-1\\end{pmatrix}\\begin{pmatrix}4\\\\7\\end{pmatrix} = (-5\\cdot 4 + 2\\cdot 7,\\; 3\\cdot 4 - 1\\cdot 7) = (-6, 5)$. Step 3, check: $A(-6,5) = (-6+10, -18+25) = (4,7)$. The solution is (-6, 5)."
          - problem: "A shop sells two items: 2 of the first and 1 of the second cost 5 dollars, while 7 of the first and 4 of the second cost 19 dollars. The system is $A\\mathbf{x} = (5, 19)$ with $A = \\begin{pmatrix}2&1\\\\7&4\\end{pmatrix}$ and $A^{-1} = \\begin{pmatrix}4&-1\\\\-7&2\\end{pmatrix}$. Find how many of each item were bought, and give the answer as (first, second)."
            answer: "(1, 3)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "Step 1, form: the unknown vector holds the counts, so $\\mathbf{x} = A^{-1}\\mathbf{b}$ with $\\mathbf{b} = (5, 19)$. Step 2, inverse multiplication: $\\begin{pmatrix}4&-1\\\\-7&2\\end{pmatrix}\\begin{pmatrix}5\\\\19\\end{pmatrix} = (4\\cdot 5 - 19,\\; -7\\cdot 5 + 2\\cdot 19) = (1, 3)$. Step 3, check: $2\\cdot 1 + 1\\cdot 3 = 5$ and $7\\cdot 1 + 4\\cdot 3 = 19$. The counts are (1, 3)."
          - problem: "For $A = \\begin{pmatrix}3&4\\\\5&7\\end{pmatrix}$, first use the 2x2 inverse formula to build $A^{-1}$, then solve $A\\mathbf{x} = (10, 17)$. Give the solution as (x, y)."
            answer: "(2, 1)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "Step 1, 2x2 inverse formula: $\\det A = 3\\cdot 7 - 4\\cdot 5 = 1$, so $A^{-1} = \\begin{pmatrix}7&-4\\\\-5&3\\end{pmatrix}$. Step 2, inverse multiplication: $\\mathbf{x} = A^{-1}\\mathbf{b} = (7\\cdot 10 - 4\\cdot 17,\\; -5\\cdot 10 + 3\\cdot 17) = (2, 1)$. Step 3, check: $3\\cdot 2 + 4\\cdot 1 = 10$ and $5\\cdot 2 + 7\\cdot 1 = 17$. The solution is (2, 1)."
          - problem: "Let $A = \\begin{pmatrix}1&1\\\\3&4\\end{pmatrix}$ with $A^{-1} = \\begin{pmatrix}4&-1\\\\-3&1\\end{pmatrix}$. Solve both $A\\mathbf{x} = (5, 16)$ and $A\\mathbf{x} = (9, 28)$ with this one inverse. Give x1 for the first system and x2 for the second, each as (x, y)."
            answer: "x1 = (4, 1); x2 = (8, 1)"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"arity": 2, "kind": "coordinates"}, "name": "x1"}, {"contract": {"arity": 2, "kind": "coordinates"}, "name": "x2"}]}
            solution_sketch: "Step 1, one inverse serves both systems since $A$ is fixed. Step 2, first system by inverse multiplication: $\\mathbf{x_1} = \\begin{pmatrix}4&-1\\\\-3&1\\end{pmatrix}\\begin{pmatrix}5\\\\16\\end{pmatrix} = (20 - 16,\\; -15 + 16) = (4, 1)$. Step 3, second system: $\\mathbf{x_2} = \\begin{pmatrix}4&-1\\\\-3&1\\end{pmatrix}\\begin{pmatrix}9\\\\28\\end{pmatrix} = (36 - 28,\\; -27 + 28) = (8, 1)$. Step 4, check: $A(4,1) = (5,16)$ and $A(8,1) = (9,28)$. So x1 = (4, 1) and x2 = (8, 1)."
        constraints: "give the inverse or make it integer; solutions with integer coordinates"
      - id: kp3
        name: Non-invertibility and recovering A from its inverse
        key_prerequisites: [matrix-inverse-2x2-formula, row-reduction-echelon-forms]
        exemplars:
          - problem: 'If $A^{-1} = \begin{pmatrix}2&1\\1&1\end{pmatrix}$, find $A$.'
            answer: "[1,-1;-1,2]"
            answer_contract: {"cols":2,"kind":"matrix","rows":2}
            solution_sketch: '$A = (A^{-1})^{-1}$; determinant $2 - 1 = 1$, so apply the formula to $A^{-1}$.'
          - problem: "Row reduce $[A \\mid I]$ for $A = \\begin{pmatrix}2&6\\\\1&3\\end{pmatrix}$. State whether $A$ is invertible or singular, and give the value of $ad - bc$."
            answer: "verdict = singular; det = 0"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["invertible"], ["singular"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "det"}]}
            solution_sketch: "Form the augmented matrix $[A \\mid I]$ with $A = \\begin{pmatrix}2&6\\\\1&3\\end{pmatrix}$. The rows $(2,6)$ and $(1,3)$ are visibly proportional (row 2 is half of row 1), so the row operation $R2 - \\frac{1}{2}R1$ zeroes out the whole left half of row 2. A zero row in the $A$-block can never become a row of $I$, so the reduction fails and $ad - bc = 6 - 6 = 0$. The answer is verdict = singular; det = 0."
          - problem: "Row reduce the augmented matrix $[A \\mid I]$ for $A = \\begin{pmatrix}3&5\\\\2&4\\end{pmatrix}$. Determine whether $A$ is invertible or singular, and give the value of $ad - bc$."
            answer: "verdict = invertible; det = 2"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["invertible"], ["singular"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "det"}]}
            solution_sketch: "Start from $[A \\mid I]$ with $A = \\begin{pmatrix}3&5\\\\2&4\\end{pmatrix}$. The rows $(3,5)$ and $(2,4)$ are not proportional, so the pivot in the $(2,1)$ position survives: $R2 - \\frac{2}{3}R1$ clears the left block to $I$ without producing a zero row. The left half reduces to the identity, so $A$ is invertible and $ad - bc = 12 - 10 = 2$. The answer is verdict = invertible; det = 2."
          - problem: "Find the value of $k$ for which $A = \\begin{pmatrix}3&k\\\\6&4\\end{pmatrix}$ has no inverse."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "A has no inverse exactly when its rows are proportional, i.e. when $ad - bc = 0$. Compute $ad - bc = 3 \\cdot 4 - 6k = 12 - 6k$. Setting $12 - 6k = 0$ gives $k = 2$; then the rows $(3,2)$ and $(6,4)$ are visibly proportional (row 2 is twice row 1), so $[A \\mid I]$ yields a zero row. The value is $k = 2$."
          - problem: "The inverse of a matrix $A$ is $A^{-1} = \\begin{pmatrix}2&4\\\\1&3\\end{pmatrix}$. Find $A$. Give the matrix as [a,b;c,d]."
            answer: "[3/2,-2;-1/2,1]"
            answer_contract: {"cols": 2, "kind": "matrix", "rows": 2}
            solution_sketch: "Recover $A$ by applying the 2 by 2 inverse formula to $A^{-1} = \\begin{pmatrix}2&4\\\\1&3\\end{pmatrix}$, since $A = (A^{-1})^{-1}$. Determinant: $2 \\cdot 3 - 4 \\cdot 1 = 2$. Swap the diagonal entries $2$ and $3$, change the sign of $4$ and $1$ to get $\\begin{pmatrix}3&-4\\\\-1&2\\end{pmatrix}$, then divide each entry by $2$: $\\begin{pmatrix}3/2&-2\\\\-1/2&1\\end{pmatrix}$. Check: $A A^{-1} = I$. The answer is [3/2,-2;-1/2,1]."
          - problem: "A matrix $A$ has $A^{-1} = \\begin{pmatrix}1&3\\\\2&5\\end{pmatrix}$. Find $A$, giving the matrix as [a,b;c,d]."
            answer: "[-5,3;2,-1]"
            answer_contract: {"cols": 2, "kind": "matrix", "rows": 2}
            solution_sketch: "Apply the 2 by 2 inverse formula to $A^{-1} = \\begin{pmatrix}1&3\\\\2&5\\end{pmatrix}$ to recover $A = (A^{-1})^{-1}$. Determinant: $1 \\cdot 5 - 3 \\cdot 2 = -1$. Swap the diagonal entries $1$ and $5$, change the sign of $3$ and $2$: $\\begin{pmatrix}5&-3\\\\-2&1\\end{pmatrix}$. Divide each entry by $-1$ to flip every sign: $\\begin{pmatrix}-5&3\\\\2&-1\\end{pmatrix}$. Check: $A A^{-1} = I$. The answer is [-5,3;2,-1]."
        constraints: "singular examples have visibly proportional rows"
    diagnostic_exemplar:
      problem: 'Use the $[A \mid I]$ method to find $A^{-1}$ for $A = \begin{pmatrix}1&3\\2&7\end{pmatrix}$, then use it to solve $A\mathbf{x} = (4, 9)$.'
      answer: '$A^{-1} = \begin{pmatrix}7&-3\\-2&1\end{pmatrix}$; $\mathbf{x} = (1, 1)$'
      answer_contract: {kind: none}
      solution_sketch: 'Row reducing $[A \mid I]$ gives $A^{-1} = \begin{pmatrix}7&-3\\-2&1\end{pmatrix}$; then $\mathbf{x} = A^{-1}(4, 9) = (28 - 27, -8 + 9) = (1, 1)$.'
    anki_seeds:
      - front: 'How does the $[A \mid I]$ method compute $A^{-1}$?'
        back: 'Row reduce $[A \mid I]$ until the left block is $I$; the right block is then $A^{-1}$.'
        type: basic
      - front: 'During $[A \mid I]$ reduction a zero row appears in the $A$-block. Conclusion?'
        back: '$A$ is not invertible.'
        type: basic

  - id: matrix-equations
    name: Matrix Equations
    core: false                # application of the matrix inverse; terminal
    difficulty: 0.65
    drill: false
    answer_kind: numeric
    expected_time_secs: 180
    prerequisites:
      - id: matrix-inverses
        weight: 0.7
        key: true
      - id: matrix-operations
        weight: 0.5
        key: true
    knowledge_points:
      - id: kp1
        name: Linear matrix equations with addition and scalars
        key_prerequisites: [matrix-operations]
        exemplars:
          - problem: "Solve X + 2A = B for X, given A = [2,1;0,3] and B = [7,5;4,9]. Give X as [a,b;c,d]."
            answer: "[3,3;4,3]"
            answer_contract: {"cols": 2, "kind": "matrix", "rows": 2}
            solution_sketch: "Step 1: Isolate X by subtracting 2A from both sides, using the matrix addition property. Step 2: Compute the scalar multiple 2A = [4,2;0,6] entrywise. Step 3: Subtract entrywise: [7-4,5-2;4-0,9-6] = [3,3;4,3]. Therefore X = [3,3;4,3]."
          - problem: "Solve 2X = [8,6;4,10] for X. Give X as [a,b;c,d]."
            answer: "[4,3;2,5]"
            answer_contract: {"cols": 2, "kind": "matrix", "rows": 2}
            solution_sketch: "Step 1: Divide both sides by the scalar 2, which acts entrywise. Step 2: Halve each entry of [8,6;4,10] to get [4,3;2,5]. Therefore X = [4,3;2,5]."
          - problem: "Solve 3X + A = B for X, given A = [1,1;2,0] and B = [7,4;5,3]. Give X as [a,b;c,d]."
            answer: "[2,1;1,1]"
            answer_contract: {"cols": 2, "kind": "matrix", "rows": 2}
            solution_sketch: "Step 1: Isolate 3X by subtracting A from both sides: 3X = B - A. Step 2: Compute B - A entrywise: [7-1,4-1;5-2,3-0] = [6,3;3,3]. Step 3: Divide each entry by 3: [2,1;1,1]. Therefore X = [2,1;1,1]."
          - problem: "Solve 2X + A = B for X, given A = [1,3;5,7] and B = [9,7;11,13]. Give X as [a,b;c,d]."
            answer: "[4,2;3,3]"
            answer_contract: {"cols": 2, "kind": "matrix", "rows": 2}
            solution_sketch: "Step 1: Subtract A from both sides: 2X = B - A. Step 2: Compute B - A entrywise: [9-1,7-3;11-5,13-7] = [8,4;6,6]. Step 3: Halve each even entry: [4,2;3,3]. Therefore X = [4,2;3,3]."
          - problem: "The equation X + cA = B holds with X = [2,1;0,4], A = [1,2;3,1] and B = [5,7;9,7]. Find the scalar c."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: Subtract X from both sides: cA = B - X. Step 2: Compute B - X entrywise: [5-2,7-1;9-0,7-4] = [3,6;9,3]. Step 3: Compare with A = [1,2;3,1]; each entry is multiplied by 3, so c = 3. Therefore the scalar is 3."
          - problem: "Solve A + X = 2B for X, given A = [3,1;0,2] and B = [4,5;1,3]. Give X as [a,b;c,d]."
            answer: "[5,9;2,4]"
            answer_contract: {"cols": 2, "kind": "matrix", "rows": 2}
            solution_sketch: "Step 1: Compute the scalar multiple 2B entrywise: [8,10;2,6]. Step 2: Subtract A from both sides: X = 2B - A. Step 3: Entrywise subtraction: [8-3,10-1;2-0,6-2] = [5,9;2,4]. Therefore X = [5,9;2,4]."
        constraints: "entrywise algebra only; even entries where halving occurs"
      - id: kp2
        name: Solving AX = B with an inverse
        key_prerequisites: [matrix-inverses]
        exemplars:
          - problem: 'Solve $AX = B$ symbolically for invertible $A$.'
            answer: '$X = A^{-1}B$'
            solution_sketch: 'Left-multiply both sides by $A^{-1}$.'
          - problem: "Let $A = \\begin{pmatrix}2&1\\\\3&2\\end{pmatrix}$ with $A^{-1} = \\begin{pmatrix}2&-1\\\\-3&2\\end{pmatrix}$. Solve $AX = \\begin{pmatrix}4&1\\\\2&0\\end{pmatrix}$ for $X$. Find $X$ and give the matrix as [a,b;c,d]."
            answer: "[6,2;-8,-3]"
            answer_contract: {"cols": 2, "kind": "matrix", "rows": 2}
            solution_sketch: "Step 1 (solve the matrix equation): left-multiply both sides of $AX = B$ by $A^{-1}$, so $X = A^{-1}B$. Step 2 (matrix multiplication): $A^{-1}B = \\begin{pmatrix}2&-1\\\\-3&2\\end{pmatrix}\\begin{pmatrix}4&1\\\\2&0\\end{pmatrix}$; row 1 is $(2\\cdot4-1\\cdot2,\\ 2\\cdot1-1\\cdot0) = (6,2)$ and row 2 is $(-3\\cdot4+2\\cdot2, -3\\cdot1+2\\cdot0) = (-8,-3)$. Step 3 (check): $A X = B$ holds. The answer is X = [6,2;-8,-3]."
          - problem: "Suppose $A = \\begin{pmatrix}3&1\\\\5&2\\end{pmatrix}$ and its inverse is $A^{-1} = \\begin{pmatrix}2&-1\\\\-5&3\\end{pmatrix}$. If $AX = \\begin{pmatrix}1&1\\\\2&0\\end{pmatrix}$, what is $X$? Give the matrix as [a,b;c,d]."
            answer: "[0,2;1,-5]"
            answer_contract: {"cols": 2, "kind": "matrix", "rows": 2}
            solution_sketch: "Step 1 (isolate the unknown): left-multiply by $A^{-1}$ to get $X = A^{-1}B$. Step 2 (matrix multiplication): $\\begin{pmatrix}2&-1\\\\-5&3\\end{pmatrix}\\begin{pmatrix}1&1\\\\2&0\\end{pmatrix}$ has row 1 $(2\\cdot1-1\\cdot2,\\ 2\\cdot1-1\\cdot0) = (0,2)$ and row 2 $(-5\\cdot1+3\\cdot2,\\ -5\\cdot1+3\\cdot0) = (1,-5)$. Step 3 (verification): $AX$ returns $B$. The key is X = [0,2;1,-5]."
          - problem: "Let $A = \\begin{pmatrix}1&1\\\\3&4\\end{pmatrix}$ with $A^{-1} = \\begin{pmatrix}4&-1\\\\-3&1\\end{pmatrix}$. Solve $AX = \\begin{pmatrix}3\\\\7\\end{pmatrix}$ for the column vector $X$. Give the answer as (x, y)."
            answer: "(5,-2)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "Step 1 (matrix equation rule): $X = A^{-1}B$. Step 2 (matrix-vector product): $\\begin{pmatrix}4&-1\\\\-3&1\\end{pmatrix}\\begin{pmatrix}3\\\\7\\end{pmatrix} = \\begin{pmatrix}12-7\\\\-9+7\\end{pmatrix} = \\begin{pmatrix}5\\\\-2\\end{pmatrix}$. Step 3 (check): $A(5,-2)^T = (5-2, 15-8)^T = (3,7)^T$. The answer is X = (5,-2)."
          - problem: "Let $A = \\begin{pmatrix}1&0&0\\\\-2&1&0\\\\0&-3&1\\end{pmatrix}$ with $A^{-1} = \\begin{pmatrix}1&0&0\\\\2&1&0\\\\6&3&1\\end{pmatrix}$. Solve $AX = \\begin{pmatrix}2\\\\-1\\\\-8\\end{pmatrix}$ for the column vector $X$. Give the answer as (x, y, z)."
            answer: "(2,3,1)"
            answer_contract: {"arity": 3, "kind": "coordinates"}
            solution_sketch: "Step 1 (matrix equation rule): left-multiply by $A^{-1}$, so $X = A^{-1}B$. Step 2 (matrix-vector product): the entries are $1\\cdot2 = 2$, then $2\\cdot2 + 1\\cdot(-1) = 3$, then $6\\cdot2 + 3\\cdot(-1) + 1\\cdot(-8) = 12-3-8 = 1$? Recompute the last row: it is $6\\cdot2 + 3\\cdot(-1) + 1\\cdot(-8)$, which gives $1$ only if the product were different; in fact $A(2,3,1)^T = (2, -4+3, -9+1)^T = (2,-1,-8)^T = B$, confirming $X = (2,3,1)$. The answer is X = (2,3,1)."
          - problem: "Let $A = \\begin{pmatrix}1&1\\\\2&3\\end{pmatrix}$ with $A^{-1} = \\begin{pmatrix}3&-1\\\\-2&1\\end{pmatrix}$. Consider $AX + \\begin{pmatrix}2&0\\\\0&1\\end{pmatrix} = \\begin{pmatrix}5&2\\\\4&3\\end{pmatrix}$. Find $X$ and give the matrix as [a,b;c,d]."
            answer: "[5,4;-2,-2]"
            answer_contract: {"cols": 2, "kind": "matrix", "rows": 2}
            solution_sketch: "Step 1 (matrix operations): subtract the constant matrix from both sides: $AX = \\begin{pmatrix}5&2\\\\4&3\\end{pmatrix} - \\begin{pmatrix}2&0\\\\0&1\\end{pmatrix} = \\begin{pmatrix}3&2\\\\4&2\\end{pmatrix}$. Step 2 (matrix equation rule): $X = A^{-1}(B - C) = \\begin{pmatrix}3&-1\\\\-2&1\\end{pmatrix}\\begin{pmatrix}3&2\\\\4&2\\end{pmatrix}$. Step 3 (matrix multiplication): row 1 is $(9-4, 6-2) = (5,4)$ and row 2 is $(-6+4, -4+2) = (-2,-2)$. Step 4 (check): $AX + C = B$ holds. The answer is X = [5,4;-2,-2]."
        constraints: "provide the inverse; integer entries throughout"
      - id: kp3
        name: Order matters when isolating X
        key_prerequisites: [matrix-inverses, matrix-operations]
        exemplars:
          - problem: 'Solve $ABX = C$ symbolically for invertible $A, B$.'
            answer: '$X = B^{-1}A^{-1}C$'
            solution_sketch: 'Peel off from the left: first $A^{-1}$, then $B^{-1}$.'
          - problem: "Solve $XA = B$ for $A = \\begin{pmatrix}1&3\\\\0&1\\end{pmatrix}$, $A^{-1} = \\begin{pmatrix}1&-3\\\\0&1\\end{pmatrix}$ and $B = \\begin{pmatrix}2&5\\\\1&2\\end{pmatrix}$. The unknown stands to the left of $A$, so $A^{-1}$ multiplies on the right of $B$. Give $X$ as [a,b;c,d]."
            answer: "[2,-1;1,-1]"
            answer_contract: {"cols": 2, "kind": "matrix", "rows": 2}
            solution_sketch: "The unknown $X$ stands to the left of $A$, so by the inverse-side rule $X = BA^{-1}$ (the inverse acts on the right). Matrix multiplication: $\\begin{pmatrix}2&5\\\\1&2\\end{pmatrix}\\begin{pmatrix}1&-3\\\\0&1\\end{pmatrix}$ has row 1 $(2, -6+5) = (2,-1)$ and row 2 $(1, -3+2) = (1,-1)$. Check: $XA = B$ holds. The solution is $X = [2,-1;1,-1]$."
          - problem: "Solve $AX = B$ for $A = \\begin{pmatrix}1&0\\\\2&1\\end{pmatrix}$, $A^{-1} = \\begin{pmatrix}1&0\\\\-2&1\\end{pmatrix}$ and $B = \\begin{pmatrix}4&3\\\\6&5\\end{pmatrix}$. The unknown stands to the right of $A$, so $A^{-1}$ multiplies on the left of $B$. Give $X$ as [a,b;c,d]."
            answer: "[4,3;-2,-1]"
            answer_contract: {"cols": 2, "kind": "matrix", "rows": 2}
            solution_sketch: "In $AX = B$ the unknown sits to the right of $A$, so the inverse acts on the left: $X = A^{-1}B$. Multiply: $\\begin{pmatrix}1&0\\\\-2&1\\end{pmatrix}\\begin{pmatrix}4&3\\\\6&5\\end{pmatrix}$ has row 1 $(4,3)$ and row 2 $(-8+6, -6+5) = (-2,-1)$. Check: $AX = B$ holds. The solution is $X = [4,3;-2,-1]$."
          - problem: "Solve $AXB = C$ for $A = \\begin{pmatrix}1&1\\\\0&1\\end{pmatrix}$, $A^{-1} = \\begin{pmatrix}1&-1\\\\0&1\\end{pmatrix}$, $B = \\begin{pmatrix}2&0\\\\0&3\\end{pmatrix}$ with $B^{-1} = \\begin{pmatrix}1/2&0\\\\0&1/3\\end{pmatrix}$, and $C = \\begin{pmatrix}8&9\\\\6&3\\end{pmatrix}$. Here $A^{-1}$ multiplies on the left and $B^{-1}$ on the right. Give $X$ as [a,b;c,d]."
            answer: "[1,2;3,1]"
            answer_contract: {"cols": 2, "kind": "matrix", "rows": 2}
            solution_sketch: "Peel off one factor at a time, each inverse on its own side: $X = A^{-1}CB^{-1}$. First $A^{-1}C = \\begin{pmatrix}1&-1\\\\0&1\\end{pmatrix}\\begin{pmatrix}8&9\\\\6&3\\end{pmatrix} = \\begin{pmatrix}2&6\\\\6&3\\end{pmatrix}$. Then $\\begin{pmatrix}2&6\\\\6&3\\end{pmatrix}\\begin{pmatrix}1/2&0\\\\0&1/3\\end{pmatrix} = \\begin{pmatrix}1&2\\\\3&1\\end{pmatrix}$. Check: $AXB = C$ holds. The solution is $X = [1,2;3,1]$."
          - problem: "Solve $AX = B$ for $A = \\begin{pmatrix}2&1\\\\1&1\\end{pmatrix}$ and $B = \\begin{pmatrix}1&4\\\\2&5\\end{pmatrix}$. No inverse is given: find $A^{-1}$ yourself, decide on which side it must multiply, then solve. Give $X$ as [a,b;c;d] in the form [a,b;c,d]."
            answer: "[-1,-1;3,6]"
            answer_contract: {"cols": 2, "kind": "matrix", "rows": 2}
            solution_sketch: "Inverse formula: $\\det A = 2\\cdot1 - 1\\cdot1 = 1$, so $A^{-1} = \\begin{pmatrix}1&-1\\\\-1&2\\end{pmatrix}$. Since $X$ stands to the right of $A$, the inverse multiplies on the left: $X = A^{-1}B$. Multiply: $\\begin{pmatrix}1&-1\\\\-1&2\\end{pmatrix}\\begin{pmatrix}1&4\\\\2&5\\end{pmatrix} = \\begin{pmatrix}-1&-1\\\\3&6\\end{pmatrix}$. Check: $AX = B$ holds. The solution is $X = [-1,-1;3,6]$."
          - problem: "Solve $XA = B$ for the right factor $A$, given $X = \\begin{pmatrix}1&-1\\\\0&1\\end{pmatrix}$, $X^{-1} = \\begin{pmatrix}1&1\\\\0&1\\end{pmatrix}$ and $B = \\begin{pmatrix}-1&0\\\\3&1\\end{pmatrix}$. The unknown is on the right of $X$, so $X^{-1}$ multiplies on the left of $B$. Give $A$ as [a,b;c,d]."
            answer: "[2,1;3,1]"
            answer_contract: {"cols": 2, "kind": "matrix", "rows": 2}
            solution_sketch: "The unknown $A$ sits to the right of $X$, so peel it off by multiplying $X^{-1}$ on the left: $A = X^{-1}B$. Multiply: $\\begin{pmatrix}1&1\\\\0&1\\end{pmatrix}\\begin{pmatrix}-1&0\\\\3&1\\end{pmatrix}$ has row 1 $(-1+3, 0+1) = (2,1)$ and row 2 $(3,1)$. Check: $XA = B$ holds. The solution is $A = [2,1;3,1]$."
        constraints: "always state which side the inverse multiplies on"
    diagnostic_exemplar:
      problem: 'Given $A^{-1} = \begin{pmatrix}1&-2\\0&1\end{pmatrix}$, solve $XA = \begin{pmatrix}2&4\\1&3\end{pmatrix}$.'
      answer: '$X = \begin{pmatrix}2&0\\1&1\end{pmatrix}$'
      answer_contract: {kind: none}
      solution_sketch: '$A$ multiplies on the right, so multiply on the right: $X = BA^{-1} = \begin{pmatrix}2&4\\1&3\end{pmatrix}\begin{pmatrix}1&-2\\0&1\end{pmatrix} = \begin{pmatrix}2&0\\1&1\end{pmatrix}$.'
    anki_seeds:
      - front: 'Solution of $AX = B$ versus $XA = B$ (invertible $A$)?'
        back: '$X = A^{-1}B$ for $AX = B$; $X = BA^{-1}$ for $XA = B$ — the side matters.'
        type: basic

  - id: elementary-matrices-invertibility
    name: Elementary Matrices and Invertibility Criteria
    core: false                # characterisation theorem; nothing builds on it
    difficulty: 0.7
    drill: false
    answer_kind: numeric
    expected_time_secs: 180
    prerequisites:
      - id: matrix-inverses
        weight: 0.7
        key: true
      - id: row-reduction-echelon-forms
        weight: 0.6
        key: true
      - id: matrix-operations
        weight: 0.5
    knowledge_points:
      - id: kp1
        name: Elementary matrices as row operations
        key_prerequisites: [row-reduction-echelon-forms, matrix-operations]
        exemplars:
          - problem: 'Write the $2 \times 2$ elementary matrix $E$ that performs $R_2 \to R_2 + 3R_1$.'
            answer: "[1,0;3,1]"
            answer_contract: {"cols":2,"kind":"matrix","rows":2}
            solution_sketch: 'Apply the operation to $I$; left-multiplying by $E$ then performs it on any matrix.'
          - problem: 'Write the elementary matrix for swapping the two rows of a $2 \times 2$ matrix, and give its inverse.'
            answer: '$\begin{pmatrix}0&1\\1&0\end{pmatrix}$; it is its own inverse'
            answer_contract: {kind: none}
            solution_sketch: 'The swap matrix is the identity with its two rows exchanged; applying the swap twice returns the identity, so $E = E^{-1} = \begin{pmatrix}0&1\\1&0\end{pmatrix}$.'
        constraints: "2x2 or 3x3; one operation per matrix"
      - id: kp2
        name: Invertibility criteria
        key_prerequisites: [matrix-inverses, row-reduction-echelon-forms]
        exemplars:
          - problem: 'For which $h$ does $\begin{pmatrix}1&3\\2&h\end{pmatrix}$ fail to be invertible?'
            answer: "h = 6"
            solution_sketch: '$R_2 - 2R_1$ leaves $(0,\ h - 6)$; no second pivot exactly when $h = 6$.'
          - problem: "Reduce $A = \\begin{pmatrix}2&5\\\\4&10\\end{pmatrix}$ to its RREF using row operations. State whether $A$ is invertible, and give the number of pivots in its RREF."
            answer: "verdict = no; pivots = 1"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["yes"], ["no"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "pivots"}]}
            solution_sketch: "Apply the row operation R2 -> R2 - 2R1 to the full matrix [[2,5],[4,10]]: the second row becomes (0,0). The RREF is [[1,5/2],[0,0]], which is not the identity, so there is only one pivot and A is singular. The answer is verdict = no; pivots = 1."
          - problem: "Let $A$ be a $3 \\times 3$ matrix for which $A\\mathbf{x} = \\mathbf{0}$ has a nonzero solution. State whether $A$ is invertible, and give the largest possible number of pivots in the RREF of $A$."
            answer: "verdict = no; pivots = 2"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["yes"], ["no"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "pivots"}]}
            solution_sketch: "By the invertibility criterion, an invertible matrix has only the trivial solution of Ax = 0. A nonzero solution means the null space is nontrivial, so A is not invertible. In a 3x3 matrix each pivot removes one free variable, so with nullity at least 1 the RREF has at most 2 pivots. The answer is verdict = no; pivots = 2."
          - problem: "Let $A = \\begin{pmatrix}1&4\\\\2&h\\end{pmatrix}$. Determine the value of $h$ for which $A$ has no second pivot and is not invertible."
            answer: "8"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Row reduce [[1,4],[2,h]]: the operation R2 -> R2 - 2R1 makes the second row (0, h - 8). A second pivot exists exactly when h - 8 is nonzero, so the matrix fails to be invertible precisely when h - 8 = 0. Solving gives h = 8."
          - problem: "Reduce $A = \\begin{pmatrix}1&2&0\\\\2&5&1\\\\0&1&2\\end{pmatrix}$ to its RREF using row operations. State whether $A$ is invertible, and give the number of pivots in its RREF."
            answer: "verdict = yes; pivots = 3"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["yes"], ["no"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "pivots"}]}
            solution_sketch: "Row reduce the full matrix [[1,2,0],[2,5,1],[0,1,2]]: R2 -> R2 - 2R1 gives (0,1,1), and R3 stays (0,1,2); then R3 -> R3 - R2 gives (0,0,1). Three pivots appear in the three diagonal positions, so the RREF is the identity and A is invertible. The answer is verdict = yes; pivots = 3."
          - problem: "Consider $A = \\begin{pmatrix}1&2&1\\\\2&4&h\\\\0&1&3\\end{pmatrix}$. Find the value of $h$ for which $A\\mathbf{x} = \\mathbf{0}$ has a nonzero solution."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Row reduce the full matrix [[1,2,1],[2,4,h],[0,1,3]]: R2 -> R2 - 2R1 gives (0,0,h-2), while row 3 (0,1,3) is independent of row 1. A nontrivial null vector exists exactly when the second row vanishes, that is when h - 2 = 0. Therefore h = 2."
        constraints: "criteria: RREF = I, n pivots, only trivial null vector; keep matrices 2x2 or 3x3"
      - id: kp3
        name: Inverses of products and of elementary matrices
        key_prerequisites: [matrix-inverses]
        exemplars:
          - problem: 'Give the inverse of the elementary matrix $\begin{pmatrix}1&0\\-2&1\end{pmatrix}$.'
            answer: "[1,0;2,1]"
            answer_contract: {"cols":2,"kind":"matrix","rows":2}
            solution_sketch: 'Undo $R_2 \to R_2 - 2R_1$ by adding $2R_1$ back.'
          - problem: 'Simplify $(A^{-1})^{-1}$ for an invertible matrix $A$.'
            answer: "A"
          - problem: "The elementary matrix $E = \\begin{pmatrix}1&0\\\\0&5\\end{pmatrix}$ scales a row by $5$. Find $E^{-1}$. Give the matrix as [a,b;c,d]."
            answer: "[1,0;0,1/5]"
            answer_contract: {"cols": 2, "kind": "matrix", "rows": 2}
            solution_sketch: "The elementary matrix $E$ performs the row operation scale row 2 by $5$. Its inverse must undo that operation, so it scales row 2 by $1/5$, giving diagonal entries $1$ and $1/5$. Check: multiplying $E$ by the candidate gives the identity matrix. The inverse is [1,0;0,1/5]."
          - problem: "Give the inverse of the elementary matrix $E = \\begin{pmatrix}1&-4\\\\0&1\\end{pmatrix}$. Give the matrix as [a,b;c,d]."
            answer: "[1,4;0,1]"
            answer_contract: {"cols": 2, "kind": "matrix", "rows": 2}
            solution_sketch: "The matrix $E$ performs $R_1 \\to R_1 - 4R_2$. The inverse must undo this with $R_1 \\to R_1 + 4R_2$, whose matrix changes the sign of the off-diagonal entry. Check: the product of the two matrices is the identity. The inverse is [1,4;0,1]."
          - problem: "Let $A = \\begin{pmatrix}1&1\\\\2&1\\end{pmatrix}$ and $B = \\begin{pmatrix}2&1\\\\1&1\\end{pmatrix}$, both invertible. Compute $(AB)^{-1}$ using the inverses of $A$ and $B$, without first forming $AB$. Give the matrix as [a,b;c,d]."
            answer: "[-3,2;5,-3]"
            answer_contract: {"cols": 2, "kind": "matrix", "rows": 2}
            solution_sketch: "Compute each inverse: $\\det A = 1 - 2 = -1$, so $A^{-1} = [-1,1;2,-1]$; $\\det B = 2 - 1 = 1$, so $B^{-1} = [1,-1;-1,2]$. The product rule gives $(AB)^{-1} = B^{-1}A^{-1}$, with the factors in reversed order. Multiplying $[1,-1;-1,2]$ by $[-1,1;2,-1]$ gives $[-3,2;5,-3]$; note $A^{-1}B^{-1} = [-2,3;3,-4]$ is different, so the order matters. The answer is (AB)^{-1} = [-3,2;5,-3]."
          - problem: "The inverse of an elementary matrix $E$ is $E^{-1} = \\begin{pmatrix}1&0\\\\-6&1\\end{pmatrix}$. Find $E$. Give the matrix as [a,b;c,d]."
            answer: "[1,0;6,1]"
            answer_contract: {"cols": 2, "kind": "matrix", "rows": 2}
            solution_sketch: "The matrix $E^{-1} = [1,0;-6,1]$ performs $R_2 \\to R_2 - 6R_1$. Therefore $E$ performs the undoing operation $R_2 \\to R_2 + 6R_1$, whose matrix has entry $6$ in the lower left. Check: $[1,0;6,1][1,0;-6,1] = [1,0;0,1]$. The answer is E = [1,0;6,1]."
        constraints: "symbolic identities plus 2x2 numeric checks"
    diagnostic_exemplar:
      problem: 'Write the $2 \times 2$ elementary matrix $E$ for $R_2 \to R_2 - 4R_1$ and its inverse, then use $E$ to decide for which $h$ the matrix $A = \begin{pmatrix}1&3\\4&h\end{pmatrix}$ fails to be invertible.'
      answer: '$E = \begin{pmatrix}1&0\\-4&1\end{pmatrix}$, $E^{-1} = \begin{pmatrix}1&0\\4&1\end{pmatrix}$; $A$ fails to be invertible when $h = 12$'
      answer_contract: {kind: none}
      solution_sketch: '$EA = \begin{pmatrix}1&3\\0&h - 12\end{pmatrix}$, which has a second pivot exactly when $h \ne 12$; the inverse operation is $R_2 \to R_2 + 4R_1$.'
    anki_seeds:
      - front: 'An elementary matrix is obtained by applying one row operation to...'
        back: 'the identity matrix $I$.'
        type: basic
      - front: '$(AB)^{-1} = $ ?'
        back: '$B^{-1}A^{-1}$ — the order reverses.'
        type: basic
      - front: 'An $n \times n$ matrix is invertible iff its RREF is {{c1::$I_n$}} (equivalently, it has $n$ pivots).'
        back: '$I_n$'
        type: cloze
