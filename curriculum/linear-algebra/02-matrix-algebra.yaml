        key: true
      - id: diagonal-triangular-matrices
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: Applying the formula
        key_prerequisites: [matrix-multiplication, identity-zero-matrices]
        exemplars:
          - problem: 'Find $A^{-1}$ for $A = \begin{pmatrix}2&1\\5&3\end{pmatrix}$.'
            answer: "[3,-1;-5,2]"
            answer_contract: {"cols":2,"kind":"matrix","rows":2}
            solution_sketch: '$ad - bc = 6 - 5 = 1$; swap the diagonal, negate the off-diagonal, divide by $1$. Check: $AA^{-1} = I$.'
          - problem: 'Find $A^{-1}$ for $A = \begin{pmatrix}1&1\\1&2\end{pmatrix}$.'
            answer: "[2,-1;-1,1]"
            answer_contract: {"cols":2,"kind":"matrix","rows":2}
            solution_sketch: '$ad - bc = 2 - 1 = 1$.'
        constraints: "prefer ad - bc = +-1 for integer inverses"
      - id: kp2
        name: Fractional and diagonal inverses
        key_prerequisites: [matrix-multiplication, diagonal-triangular-matrices]
        exemplars:
          - problem: 'Find $A^{-1}$ for $A = \begin{pmatrix}1&2\\3&4\end{pmatrix}$.'
            answer: "[-2,1;3/2,-1/2]"
            answer_contract: {"cols":2,"kind":"matrix","rows":2}
            solution_sketch: '$ad - bc = -2$; $A^{-1} = \frac{1}{-2}\begin{pmatrix}4&-2\\-3&1\end{pmatrix}$.'
          - problem: 'Find the inverse of the diagonal matrix $\begin{pmatrix}2&0\\0&5\end{pmatrix}$.'
            answer: "[1/2,0;0,1/5]"
            answer_contract: {"cols":2,"kind":"matrix","rows":2}
            solution_sketch: 'Invert each diagonal entry; verify the product is $I$.'
        constraints: "ad - bc in {-2, 2} for fraction practice; nonzero diagonal entries"
      - id: kp3
        name: Singularity via the determinant condition
        key_prerequisites: [matrix-multiplication]
        exemplars:
          - problem: 'Is $\begin{pmatrix}2&4\\1&2\end{pmatrix}$ invertible?'
            answer: "No"
            answer_contract: {"kind":"label","options":[["yes"],["no"]]}
            solution_sketch: '$ad - bc = 4 - 4 = 0$ (the rows are proportional), so no inverse exists.'
          - problem: 'For which $k$ is $\begin{pmatrix}1&k\\2&6\end{pmatrix}$ NOT invertible?'
            answer: "k = 3"
            solution_sketch: '$6 - 2k = 0$.'
        constraints: "singularity via proportional rows or ad - bc = 0; integer k answers"
    diagnostic_exemplar:
      problem: 'Find $A^{-1}$ for $A = \begin{pmatrix}4&2\\3&4\end{pmatrix}$, and state the value of $k$ for which $\begin{pmatrix}4&2\\3&k\end{pmatrix}$ would have no inverse.'
      answer: '$A^{-1} = \begin{pmatrix}2/5&-1/5\\-3/10&2/5\end{pmatrix}$; no inverse when $k = 3/2$'
      answer_contract: {kind: none}
      solution_sketch: '$\det A = 16 - 6 = 10$, so $A^{-1} = \frac{1}{10}\begin{pmatrix}4&-2\\-3&4\end{pmatrix}$; the determinant $4k - 6$ vanishes at $k = 3/2$.'
    anki_seeds:
      - front: 'Inverse of $\begin{pmatrix}a&b\\c&d\end{pmatrix}$ (when $ad - bc \neq 0$)?'
        back: '$\dfrac{1}{ad - bc}\begin{pmatrix}d&-b\\-c&a\end{pmatrix}$.'
        type: basic
      - front: 'A $2 \times 2$ matrix is invertible exactly when $ad - bc$ is...'
        back: 'nonzero'
        type: basic

  - id: matrix-inverses
    name: Matrix Inverses
    core: true
    difficulty: 0.65
    drill: false
    answer_kind: numeric
    expected_time_secs: 240
    prerequisites:
      - id: matrix-inverse-2x2-formula
        weight: 0.8
        key: true
      - id: row-reduction-echelon-forms
        weight: 0.6
        key: true
      - id: matrix-operations
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: Gauss-Jordan inversion via [A | I]
        key_prerequisites: [matrix-inverse-2x2-formula, row-reduction-echelon-forms]
        exemplars:
          - problem: 'Use the $[A \mid I]$ method to find $A^{-1}$ for $A = \begin{pmatrix}1&2\\1&3\end{pmatrix}$.'
            answer: "[3,-2;-1,1]"
            answer_contract: {"cols":2,"kind":"matrix","rows":2}
            solution_sketch: '$R_2 - R_1$ gives $[\,0\ 1 \mid -1\ 1\,]$; then $R_1 - 2R_2$ gives $[\,1\ 0 \mid 3\ -2\,]$.'
          - problem: 'Use the $[A \mid I]$ method to find $A^{-1}$ for $A = \begin{pmatrix}1&0\\2&1\end{pmatrix}$.'
            answer: "[1,0;-2,1]"
            answer_contract: {"cols":2,"kind":"matrix","rows":2}
            solution_sketch: 'One operation, $R_2 - 2R_1$, already turns the left block into $I$.'
          - problem: 'Find the inverse of $A = \begin{pmatrix}1&0&1\\0&1&0\\0&0&1\end{pmatrix}$ by row reducing $[A \mid I]$.'
            answer: "[1,0,-1;0,1,0;0,0,1]"
            answer_contract: {"cols":3,"kind":"matrix","rows":3}
            solution_sketch: '$R_1 - R_3$ finishes the reduction; verify $AA^{-1} = I_3$.'
        constraints: "matrices with determinant +-1 so the inverse is integer; 3x3 only when nearly triangular"
      - id: kp2
        name: Solving Ax = b with an inverse
        key_prerequisites: [matrix-inverse-2x2-formula, matrix-operations]
        exemplars:
          - problem: 'Using $A = \begin{pmatrix}2&1\\5&3\end{pmatrix}$ and $A^{-1} = \begin{pmatrix}3&-1\\-5&2\end{pmatrix}$, solve $A\mathbf{x} = (4, 11)$.'
            answer: "x = (1, 2)"
            solution_sketch: '$\mathbf{x} = A^{-1}\mathbf{b} = (12 - 11, -20 + 22) = (1, 2)$.'
          - problem: 'Using $A^{-1} = \begin{pmatrix}1&-1\\-2&3\end{pmatrix}$, solve $A\mathbf{x} = (3, 7)$.'
            answer: "x = (-4, 15)"
            solution_sketch: '$\mathbf{x} = A^{-1}\mathbf{b} = (3 - 7, -6 + 21)$.'
        constraints: "give the inverse or make it integer; solutions with integer coordinates"
      - id: kp3
        name: Non-invertibility and recovering A from its inverse
        key_prerequisites: [matrix-inverse-2x2-formula, row-reduction-echelon-forms]
        exemplars:
          - problem: 'Row reduce $[A \mid I]$ for $A = \begin{pmatrix}1&2\\2&4\end{pmatrix}$. What happens, and what does it mean?'
            answer: "R2 - 2R1 zeroes out the left half of row 2, so A is not invertible"
            answer_contract: {kind: none}
            solution_sketch: 'A zero row appears in the $A$-block, so the left block can never become $I$.'
          - problem: 'If $A^{-1} = \begin{pmatrix}2&1\\1&1\end{pmatrix}$, find $A$.'
            answer: "[1,-1;-1,2]"
            answer_contract: {"cols":2,"kind":"matrix","rows":2}
            solution_sketch: '$A = (A^{-1})^{-1}$; determinant $2 - 1 = 1$, so apply the formula to $A^{-1}$.'
        constraints: "singular examples have visibly proportional rows"
    diagnostic_exemplar:
      problem: 'Use the $[A \mid I]$ method to find $A^{-1}$ for $A = \begin{pmatrix}1&3\\2&7\end{pmatrix}$, then use it to solve $A\mathbf{x} = (4, 9)$.'
      answer: '$A^{-1} = \begin{pmatrix}7&-3\\-2&1\end{pmatrix}$; $\mathbf{x} = (1, 1)$'
      answer_contract: {kind: none}
      solution_sketch: 'Row reducing $[A \mid I]$ gives $A^{-1} = \begin{pmatrix}7&-3\\-2&1\end{pmatrix}$; then $\mathbf{x} = A^{-1}(4, 9) = (28 - 27, -8 + 9) = (1, 1)$.'
    anki_seeds:
      - front: 'How does the $[A \mid I]$ method compute $A^{-1}$?'
        back: 'Row reduce $[A \mid I]$ until the left block is $I$; the right block is then $A^{-1}$.'
        type: basic
      - front: 'During $[A \mid I]$ reduction a zero row appears in the $A$-block. Conclusion?'
        back: '$A$ is not invertible.'
        type: basic

  - id: matrix-equations
    name: Matrix Equations
    core: false                # application of the matrix inverse; terminal
    difficulty: 0.65
    drill: false
    answer_kind: numeric
    expected_time_secs: 180
    prerequisites:
      - id: matrix-inverses
        weight: 0.7
        key: true
      - id: matrix-operations
        weight: 0.5
        key: true
    knowledge_points:
      - id: kp1
        name: Linear matrix equations with addition and scalars
        key_prerequisites: [matrix-operations]
        exemplars:
          - problem: 'Solve $X + 2A = B$ for $X$, given $A = \begin{pmatrix}1&0\\2&1\end{pmatrix}$ and $B = \begin{pmatrix}3&4\\5&6\end{pmatrix}$.'
            answer: '$X = \begin{pmatrix}1&4\\1&4\end{pmatrix}$'
            answer_contract: {kind: none}
            solution_sketch: '$X = B - 2A = \begin{pmatrix}3-2&4-0\\5-4&6-2\end{pmatrix}$.'
          - problem: 'Solve $2X = \begin{pmatrix}4&6\\0&2\end{pmatrix}$.'
            answer: '$X = \begin{pmatrix}2&3\\0&1\end{pmatrix}$'
            answer_contract: {kind: none}
            solution_sketch: 'Multiply both sides by $\frac{1}{2}$ entrywise: $X = \begin{pmatrix}2&3\\0&1\end{pmatrix}$.'
        constraints: "entrywise algebra only; even entries where halving occurs"
      - id: kp2
        name: Solving AX = B with an inverse
        key_prerequisites: [matrix-inverses]
        exemplars:
          - problem: 'Using $A = \begin{pmatrix}2&1\\5&3\end{pmatrix}$ with $A^{-1} = \begin{pmatrix}3&-1\\-5&2\end{pmatrix}$, solve $AX = \begin{pmatrix}1&0\\1&1\end{pmatrix}$.'
            answer: '$X = \begin{pmatrix}2&-1\\-3&2\end{pmatrix}$'
            answer_contract: {kind: none}
            solution_sketch: '$X = A^{-1}B$: row 1 is $(3 - 1, 0 - 1)$, row 2 is $(-5 + 2, 0 + 2)$. Verify $AX = B$.'
          - problem: 'Solve $AX = B$ symbolically for invertible $A$.'
            answer: '$X = A^{-1}B$'
            solution_sketch: 'Left-multiply both sides by $A^{-1}$.'
        constraints: "provide the inverse; integer entries throughout"
      - id: kp3
        name: Order matters when isolating X
        key_prerequisites: [matrix-inverses, matrix-operations]
        exemplars:
          - problem: 'Solve $XA = B$ for $A = \begin{pmatrix}1&1\\0&1\end{pmatrix}$ (so $A^{-1} = \begin{pmatrix}1&-1\\0&1\end{pmatrix}$) and $B = \begin{pmatrix}2&3\\1&1\end{pmatrix}$.'
            answer: '$X = \begin{pmatrix}2&1\\1&0\end{pmatrix}$'
            answer_contract: {kind: none}
            solution_sketch: '$X = BA^{-1}$: row 1 is $(2, -2 + 3)$, row 2 is $(1, -1 + 1)$. Check $XA = B$.'
          - problem: 'Solve $ABX = C$ symbolically for invertible $A, B$.'
            answer: '$X = B^{-1}A^{-1}C$'
            solution_sketch: 'Peel off from the left: first $A^{-1}$, then $B^{-1}$.'
        constraints: "always state which side the inverse multiplies on"
    diagnostic_exemplar:
      problem: 'Given $A^{-1} = \begin{pmatrix}1&-2\\0&1\end{pmatrix}$, solve $XA = \begin{pmatrix}2&4\\1&3\end{pmatrix}$.'
      answer: '$X = \begin{pmatrix}2&0\\1&1\end{pmatrix}$'
      answer_contract: {kind: none}
      solution_sketch: '$A$ multiplies on the right, so multiply on the right: $X = BA^{-1} = \begin{pmatrix}2&4\\1&3\end{pmatrix}\begin{pmatrix}1&-2\\0&1\end{pmatrix} = \begin{pmatrix}2&0\\1&1\end{pmatrix}$.'
    anki_seeds:
      - front: 'Solution of $AX = B$ versus $XA = B$ (invertible $A$)?'
        back: '$X = A^{-1}B$ for $AX = B$; $X = BA^{-1}$ for $XA = B$ — the side matters.'
        type: basic

  - id: elementary-matrices-invertibility
    name: Elementary Matrices and Invertibility Criteria
    core: false                # characterisation theorem; nothing builds on it
    difficulty: 0.7
    drill: false
    answer_kind: numeric
    expected_time_secs: 180
    prerequisites:
      - id: matrix-inverses
        weight: 0.7
        key: true
      - id: row-reduction-echelon-forms
        weight: 0.6
        key: true
      - id: matrix-operations
        weight: 0.5
    knowledge_points:
      - id: kp1
        name: Elementary matrices as row operations
        key_prerequisites: [row-reduction-echelon-forms, matrix-operations]
        exemplars:
          - problem: 'Write the $2 \times 2$ elementary matrix $E$ that performs $R_2 \to R_2 + 3R_1$.'
            answer: "[1,0;3,1]"
            answer_contract: {"cols":2,"kind":"matrix","rows":2}
            solution_sketch: 'Apply the operation to $I$; left-multiplying by $E$ then performs it on any matrix.'
          - problem: 'Write the elementary matrix for swapping the two rows of a $2 \times 2$ matrix, and give its inverse.'
            answer: '$\begin{pmatrix}0&1\\1&0\end{pmatrix}$; it is its own inverse'
            answer_contract: {kind: none}
            solution_sketch: 'The swap matrix is the identity with its two rows exchanged; applying the swap twice returns the identity, so $E = E^{-1} = \begin{pmatrix}0&1\\1&0\end{pmatrix}$.'
        constraints: "2x2 or 3x3; one operation per matrix"
      - id: kp2
        name: Invertibility criteria
        key_prerequisites: [matrix-inverses, row-reduction-echelon-forms]
        exemplars:
          - problem: 'Is $\begin{pmatrix}1&2\\2&4\end{pmatrix}$ invertible? Answer using row reduction.'
            answer: "No"
            answer_contract: {"kind":"label","options":[["yes"],["no"]]}
            solution_sketch: '$R_2 - 2R_1$ zeroes out row 2, so the RREF is not $I$; only one pivot.'
          - problem: 'For which $h$ does $\begin{pmatrix}1&3\\2&h\end{pmatrix}$ fail to be invertible?'
            answer: "h = 6"
            solution_sketch: '$R_2 - 2R_1$ leaves $(0,\ h - 6)$; no second pivot exactly when $h = 6$.'
          - problem: 'If $A$ is $n \times n$ and $A\mathbf{x} = \mathbf{0}$ has a nonzero solution, is $A$ invertible?'
            answer: "No"
            answer_contract: {"kind":"label","options":[["yes"],["no"]]}
            solution_sketch: 'Invertibility forces the unique solution $\mathbf{x} = A^{-1}\mathbf{0} = \mathbf{0}$.'
        constraints: "criteria: RREF = I, n pivots, only trivial null vector; keep matrices 2x2 or 3x3"
      - id: kp3
        name: Inverses of products and of elementary matrices
        key_prerequisites: [matrix-inverses]
        exemplars:
          - problem: 'Give the inverse of the elementary matrix $\begin{pmatrix}1&0\\-2&1\end{pmatrix}$.'
            answer: "[1,0;2,1]"
            answer_contract: {"cols":2,"kind":"matrix","rows":2}
            solution_sketch: 'Undo $R_2 \to R_2 - 2R_1$ by adding $2R_1$ back.'
          - problem: 'If $A$ and $B$ are invertible, express $(AB)^{-1}$ in terms of $A^{-1}$ and $B^{-1}$.'
            answer: '$(AB)^{-1} = B^{-1}A^{-1}$'
            answer_contract: {kind: none}
            solution_sketch: '$(AB)(B^{-1}A^{-1}) = A(BB^{-1})A^{-1} = I$; note the reversed order.'
          - problem: 'Simplify $(A^{-1})^{-1}$ for an invertible matrix $A$.'
            answer: "A"
        constraints: "symbolic identities plus 2x2 numeric checks"
    diagnostic_exemplar:
      problem: 'Write the $2 \times 2$ elementary matrix $E$ for $R_2 \to R_2 - 4R_1$ and its inverse, then use $E$ to decide for which $h$ the matrix $A = \begin{pmatrix}1&3\\4&h\end{pmatrix}$ fails to be invertible.'
      answer: '$E = \begin{pmatrix}1&0\\-4&1\end{pmatrix}$, $E^{-1} = \begin{pmatrix}1&0\\4&1\end{pmatrix}$; $A$ fails to be invertible when $h = 12$'
      answer_contract: {kind: none}
      solution_sketch: '$EA = \begin{pmatrix}1&3\\0&h - 12\end{pmatrix}$, which has a second pivot exactly when $h \ne 12$; the inverse operation is $R_2 \to R_2 + 4R_1$.'
    anki_seeds:
      - front: 'An elementary matrix is obtained by applying one row operation to...'
        back: 'the identity matrix $I$.'
        type: basic
      - front: '$(AB)^{-1} = $ ?'
        back: '$B^{-1}A^{-1}$ — the order reverses.'
        type: basic
      - front: 'An $n \times n$ matrix is invertible iff its RREF is {{c1::$I_n$}} (equivalently, it has $n$ pivots).'
        back: '$I_n$'
        type: cloze
