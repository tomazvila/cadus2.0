unit: matrix-algebra
course: linear-algebra
module: "Matrix Algebra"
topics:
  - id: matrix-addition-scalar-multiplication
    name: Matrix Addition and Scalar Multiplication
    core: true
    difficulty: 0.5
    drill: false
    answer_kind: numeric
    expected_time_secs: 90
    prerequisites:
      - id: vector-arithmetic
        weight: 0.6
        key: true
      - id: augmented-matrix-representation
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: Entrywise addition and subtraction
        key_prerequisites: [vector-arithmetic]
        exemplars:
          - problem: 'Compute $\begin{pmatrix}3&-1\\2&5\end{pmatrix} + \begin{pmatrix}1&4\\-2&0\end{pmatrix}$.'
            answer: '[[4,3],[0,5]]'
            answer_contract: {"kind":"matrix","rows":2,"cols":2}
            solution_sketch: 'Both matrices have the same size, so the entries can be combined position by position. We add the entries in matching positions. Row 1, column 1: $3 + 1 = 4$. Row 1, column 2: $-1 + 4 = 3$. Row 2, column 1: $2 + (-2) = 0$. Row 2, column 2: $5 + 0 = 5$. The result is $\begin{pmatrix}4&3\\0&5\end{pmatrix}$.'
          - problem: 'Compute $\begin{pmatrix}4&0&-3\\1&6&2\end{pmatrix} - \begin{pmatrix}2&5&-1\\-3&1&4\end{pmatrix}$.'
            answer: '[[2,-5,-2],[4,5,-2]]'
            answer_contract: {"kind":"matrix","rows":2,"cols":3}
            solution_sketch: 'Both matrices have the same size, so the entries can be combined position by position. We subtract the entries in matching positions. Row 1, column 1: $4 - 2 = 2$. Row 1, column 2: $0 - 5 = -5$. Row 1, column 3: $-3 - (-1) = -2$. Row 2, column 1: $1 - (-3) = 4$. Row 2, column 2: $6 - 1 = 5$. Row 2, column 3: $2 - 4 = -2$. The result is $\begin{pmatrix}2&-5&-2\\4&5&-2\end{pmatrix}$.'
          - problem: 'In a weekend market, shop 1 (first row) and shop 2 (second row) sold shirts, hats and scarves (columns). The sales were $S = \begin{pmatrix}12&5&8\\9&7&3\end{pmatrix}$ on Saturday and $T = \begin{pmatrix}10&6&4\\11&2&5\end{pmatrix}$ on Sunday. Which matrix shows how many of each item each shop sold over the whole weekend?'
            answer: '[[22,11,12],[20,9,8]]'
            answer_contract: {"kind":"matrix","rows":2,"cols":3}
            solution_sketch: 'The weekend total is the Saturday sales plus the Sunday sales, so we add $S$ and $T$ entry by entry. Row 1, column 1: $12 + 10 = 22$. Row 1, column 2: $5 + 6 = 11$. Row 1, column 3: $8 + 4 = 12$. Row 2, column 1: $9 + 11 = 20$. Row 2, column 2: $7 + 2 = 9$. Row 2, column 3: $3 + 5 = 8$. The total matrix is $\begin{pmatrix}22&11&12\\20&9&8\end{pmatrix}$.'
          - problem: 'A warehouse holds $\begin{pmatrix}40&25\\30&60\end{pmatrix}$ units of two products (columns) in two sections (rows). A shipment takes out $\begin{pmatrix}15&5\\10&35\end{pmatrix}$. Which matrix shows the stock that remains?'
            answer: '[[25,20],[20,25]]'
            answer_contract: {"kind":"matrix","rows":2,"cols":2}
            solution_sketch: 'Stock that remains is the old stock minus the shipment, so we subtract the shipment matrix from the stock matrix entry by entry. Row 1, column 1: $40 - 15 = 25$. Row 1, column 2: $25 - 5 = 20$. Row 2, column 1: $30 - 10 = 20$. Row 2, column 2: $60 - 35 = 25$. The remaining stock is $\begin{pmatrix}25&20\\20&25\end{pmatrix}$.'
          - problem: 'Compute $\begin{pmatrix}1&-1\\2&0\end{pmatrix} + \begin{pmatrix}-3&4\\1&-2\end{pmatrix} + \begin{pmatrix}2&0\\-4&3\end{pmatrix}$.'
            answer: '[[0,3],[-1,1]]'
            answer_contract: {"kind":"matrix","rows":2,"cols":2}
            solution_sketch: 'We add the three matrices position by position. Row 1, column 1: $1 + (-3) + 2 = 0$. Row 1, column 2: $-1 + 4 + 0 = 3$. Row 2, column 1: $2 + 1 + (-4) = -1$. Row 2, column 2: $0 + (-2) + 3 = 1$. The sum is $\begin{pmatrix}0&3\\-1&1\end{pmatrix}$.'
          - problem: 'The matrix $L = \begin{pmatrix}52&18\\47&33\end{pmatrix}$ lists the numbers of two products (columns) sold in two shops (rows) last month, and $N = \begin{pmatrix}49&25\\47&30\end{pmatrix}$ lists the same sales this month. Which matrix shows how much each sales figure changed from last month to this month?'
            answer: '[[-3,7],[0,-3]]'
            answer_contract: {"kind":"matrix","rows":2,"cols":2}
            solution_sketch: 'A change is the new value minus the old value, so we subtract $L$ from $N$ entry by entry. Row 1, column 1: $49 - 52 = -3$. Row 1, column 2: $25 - 18 = 7$. Row 2, column 1: $47 - 47 = 0$. Row 2, column 2: $30 - 33 = -3$. A negative entry means a fall in sales. The change matrix is $\begin{pmatrix}-3&7\\0&-3\end{pmatrix}$.'
          - problem: 'Sam subtracts $\begin{pmatrix}3&-2\\4&1\end{pmatrix} - \begin{pmatrix}1&-5\\2&3\end{pmatrix}$ and gets $\begin{pmatrix}2&-7\\2&-2\end{pmatrix}$. What is the correct difference?'
            answer: '[[2,3],[2,-2]]'
            answer_contract: {"kind":"matrix","rows":2,"cols":2}
            solution_sketch: 'Sam made a sign error in the top-right entry, because $-2 - (-5) = 3$ and not $-7$. Row 1, column 1: $3 - 1 = 2$. Row 1, column 2: $-2 - (-5) = 3$. Row 2, column 1: $4 - 2 = 2$. Row 2, column 2: $1 - 3 = -2$. The correct difference is $\begin{pmatrix}2&3\\2&-2\end{pmatrix}$.'
          - problem: 'Let $A = \begin{pmatrix}7&-2&4\\0&5&-6\end{pmatrix}$ and $B = \begin{pmatrix}3&1&-2\\8&-4&1\end{pmatrix}$. What is the entry in row 2, column 3 of $A + B$?'
            answer: '-5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The entry in row 2, column 3 of the sum comes only from the entries in row 2, column 3 of $A$ and $B$. These are $-6$ and $1$, and their sum is $-5$.'
        constraints: "2x2 or 2x3 with integer entries in -5..5; in-context items use shop and stock tables"
      - id: kp2
        name: Scalar multiples and combinations
        key_prerequisites: [vector-arithmetic]
        exemplars:
          - problem: 'Compute $3\begin{pmatrix}2&-1\\0&4\end{pmatrix}$.'
            answer: '[[6,-3],[0,12]]'
            answer_contract: {"kind":"matrix","rows":2,"cols":2}
            solution_sketch: 'A scalar multiple multiplies every entry by the scalar. $3 \cdot 2 = 6$, $3 \cdot (-1) = -3$, $3 \cdot 0 = 0$, $3 \cdot 4 = 12$. The result is $\begin{pmatrix}6&-3\\0&12\end{pmatrix}$.'
          - problem: 'Compute $2\begin{pmatrix}4&-1\\0&3\end{pmatrix} - 3\begin{pmatrix}1&2\\-1&0\end{pmatrix}$.'
            answer: '[[5,-8],[3,6]]'
            answer_contract: {"kind":"matrix","rows":2,"cols":2}
            solution_sketch: 'Call the two matrices $A$ and $B$. We scale each matrix first and then subtract entry by entry. The scaled matrices are $2A$ with entries $2 \cdot 4 = 8$, $2 \cdot (-1) = -2$, $2 \cdot 0 = 0$, $2 \cdot 3 = 6$ and $3B$ with entries $3 \cdot 1 = 3$, $3 \cdot 2 = 6$, $3 \cdot (-1) = -3$, $3 \cdot 0 = 0$. Their difference is $\begin{pmatrix}5&-8\\3&6\end{pmatrix}$.'
          - problem: 'The matrix $R = \begin{pmatrix}200&50\\150&75\end{pmatrix}$ gives the grams of flour (first column) and sugar (second column) in two recipes (rows) for one batch. Which matrix gives the amounts needed for $3$ batches of each recipe?'
            answer: '[[600,150],[450,225]]'
            answer_contract: {"kind":"matrix","rows":2,"cols":2}
            solution_sketch: 'Three batches need three times every amount, so we multiply every entry of $R$ by $3$. $3 \cdot 200 = 600$, $3 \cdot 50 = 150$, $3 \cdot 150 = 450$, $3 \cdot 75 = 225$. The amounts for three batches are $\begin{pmatrix}600&150\\450&225\end{pmatrix}$.'
          - problem: 'Over $4$ weeks two branches (rows) of a cafe sold in total $T = \begin{pmatrix}48&120\\80&36\end{pmatrix}$ cups of tea (first column) and coffee (second column). Which matrix gives the average weekly sales of each drink in each branch?'
            answer: '[[12,30],[20,9]]'
            answer_contract: {"kind":"matrix","rows":2,"cols":2}
            solution_sketch: 'An average over $4$ weeks is the total divided by $4$, so we multiply every entry of $T$ by $\frac{1}{4}$. The entries are $48/4 = 12$, $120/4 = 30$, $80/4 = 20$ and $36/4 = 9$. The weekly averages are $\begin{pmatrix}12&30\\20&9\end{pmatrix}$.'
          - problem: 'The matrix $R = \begin{pmatrix}6&4\\10&2\end{pmatrix}$ lists the cups of rice (first column) and beans (second column) in two recipes (rows), and each recipe serves $4$ people. Which matrix lists the amounts when each recipe serves $6$ people?'
            answer: '[[9,6],[15,3]]'
            answer_contract: {"kind":"matrix","rows":2,"cols":2}
            solution_sketch: 'Each amount is scaled by the ratio of the new number of people to the old one, which is $\frac{6}{4} = \frac{3}{2}$. We multiply every entry of $R$ by $\frac{3}{2}$, so $6$ becomes $9$, $4$ becomes $6$, $10$ becomes $15$ and $2$ becomes $3$. The new amounts are $\begin{pmatrix}9&6\\15&3\end{pmatrix}$.'
          - problem: 'Compute $2\begin{pmatrix}1&1\\-1&0\end{pmatrix} + 3\begin{pmatrix}0&-1\\2&1\end{pmatrix}$.'
            answer: '[[2,-1],[4,3]]'
            answer_contract: {"kind":"matrix","rows":2,"cols":2}
            solution_sketch: 'Call the two matrices $A$ and $B$. We scale each matrix first and then add entry by entry. The scaled matrices are $2A$ with entries $2 \cdot 1 = 2$, $2 \cdot 1 = 2$, $2 \cdot (-1) = -2$, $2 \cdot 0 = 0$ and $3B$ with entries $3 \cdot 0 = 0$, $3 \cdot (-1) = -3$, $3 \cdot 2 = 6$, $3 \cdot 1 = 3$. Their sum is $\begin{pmatrix}2&-1\\4&3\end{pmatrix}$.'
          - problem: 'Compute $\frac{1}{2}\begin{pmatrix}6&-4&2\\10&0&-8\end{pmatrix}$.'
            answer: '[[3,-2,1],[5,0,-4]]'
            answer_contract: {"kind":"matrix","rows":2,"cols":3}
            solution_sketch: 'Multiplying by $\frac{1}{2}$ halves every entry. $\frac{1}{2} \cdot 6 = 3$, $\frac{1}{2} \cdot (-4) = -2$, $\frac{1}{2} \cdot 2 = 1$, $\frac{1}{2} \cdot 10 = 5$, $\frac{1}{2} \cdot 0 = 0$, $\frac{1}{2} \cdot (-8) = -4$. The result is $\begin{pmatrix}3&-2&1\\5&0&-4\end{pmatrix}$.'
          - problem: 'Compute $2\begin{pmatrix}1&0\\-1&2\end{pmatrix} + 3\begin{pmatrix}0&-1\\1&0\end{pmatrix} - \begin{pmatrix}1&1\\1&1\end{pmatrix}$.'
            answer: '[[1,-4],[0,3]]'
            answer_contract: {"kind":"matrix","rows":2,"cols":2}
            solution_sketch: 'Call the three matrices $A$, $B$ and $C$. We scale the first two matrices, then add and subtract entry by entry. The scaled matrices are $2A = \begin{pmatrix}2&0\\-2&4\end{pmatrix}$ and $3B = \begin{pmatrix}0&-3\\3&0\end{pmatrix}$. Subtracting $C$ gives $\begin{pmatrix}1&-4\\0&3\end{pmatrix}$.'
          - problem: 'Sam writes $-2\begin{pmatrix}1&3\\0&-4\end{pmatrix} = \begin{pmatrix}-2&-6\\0&-8\end{pmatrix}$. What is the correct product?'
            answer: '[[-2,-6],[0,8]]'
            answer_contract: {"kind":"matrix","rows":2,"cols":2}
            solution_sketch: 'Sam did not change the sign of the entry $-4$, because $-2 \cdot (-4) = 8$ and not $-8$. $-2 \cdot 1 = -2$, $-2 \cdot 3 = -6$, $-2 \cdot 0 = 0$, $-2 \cdot (-4) = 8$. The correct product is $\begin{pmatrix}-2&-6\\0&8\end{pmatrix}$.'
          - problem: 'For which number $c$ does $c\begin{pmatrix}1&-2\\3&4\end{pmatrix} = \begin{pmatrix}-3&6\\-9&-12\end{pmatrix}$ hold?'
            answer: '-3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Compare the top-left entries: $c \cdot 1 = -3$, so $c = -3$. The other entries agree, because $-3 \cdot (-2) = 6$, $-3 \cdot 3 = -9$ and $-3 \cdot 4 = -12$. The number is $c = -3$.'
        constraints: "scalars in -3..3 or simple fractions; integer entries in -5..5 (table entries up to 200); in-context items include one division"
      - id: kp3
        name: Size compatibility and solving for a matrix
        key_prerequisites: [vector-arithmetic]
        exemplars:
          - problem: 'Solve for $X$: $X + \begin{pmatrix}3&-1\\0&4\end{pmatrix} = \begin{pmatrix}5&2\\-3&4\end{pmatrix}$.'
            answer: '[[2,3],[-3,0]]'
            answer_contract: {"kind":"matrix","rows":2,"cols":2}
            solution_sketch: 'Call the known matrix on the left $A$ and the matrix on the right $B$. To remove $A$ from the left side we subtract it from both sides, so $X = B - A$. Row 1, column 1: $5 - 3 = 2$. Row 1, column 2: $2 - (-1) = 3$. Row 2, column 1: $-3 - 0 = -3$. Row 2, column 2: $4 - 4 = 0$. Hence $X = \begin{pmatrix}2&3\\-3&0\end{pmatrix}$.'
          - problem: 'Let $A$ be a $2\times 3$ matrix and $B$ a $3\times 2$ matrix. Is the sum $A + B$ defined?'
            answer: 'no'
            answer_contract: {"kind":"label","options":[["yes","it can be formed","it is defined","defined"],["no","it cannot be formed","it is not defined","not defined","undefined"]]}
            solution_sketch: 'The matrix $A$ has $2$ rows and $3$ columns, while $B$ has $3$ rows and $2$ columns. A sum needs the same number of rows and the same number of columns, and these sizes differ in both. So $A + B$ is not defined.'
          - problem: 'Before a delivery of $D = \begin{pmatrix}20&15\\10&30\end{pmatrix}$, a shop had some stock. After the delivery its stock was $S = \begin{pmatrix}65&40\\25&80\end{pmatrix}$ (two products in two sections). Which matrix shows the stock before the delivery?'
            answer: '[[45,25],[15,50]]'
            answer_contract: {"kind":"matrix","rows":2,"cols":2}
            solution_sketch: 'The stock after the delivery is the stock before plus $D$, so the stock before is $S - D$. Row 1, column 1: $65 - 20 = 45$. Row 1, column 2: $40 - 15 = 25$. Row 2, column 1: $25 - 10 = 15$. Row 2, column 2: $80 - 30 = 50$. The stock before the delivery was $\begin{pmatrix}45&25\\15&50\end{pmatrix}$.'
          - problem: 'Solve for $X$: $\begin{pmatrix}7&2\\1&6\end{pmatrix} - X = \begin{pmatrix}2&2\\1&1\end{pmatrix}$.'
            answer: '[[5,0],[0,5]]'
            answer_contract: {"kind":"matrix","rows":2,"cols":2}
            solution_sketch: 'Call the left matrix $A$ and the right matrix $B$. Here $X$ is subtracted, so we add $X$ to both sides and subtract $B$ from both sides, which gives $X = A - B$. Row 1, column 1: $7 - 2 = 5$. Row 1, column 2: $2 - 2 = 0$. Row 2, column 1: $1 - 1 = 0$. Row 2, column 2: $6 - 1 = 5$. Hence $X = \begin{pmatrix}5&0\\0&5\end{pmatrix}$.'
          - problem: 'A firm made sales of $T = \begin{pmatrix}120&95\\80&140\end{pmatrix}$ over a whole year (two products in two regions). Its sales in the first half of the year were $H = \begin{pmatrix}70&40\\55&60\end{pmatrix}$. Which matrix gives the sales in the second half of the year?'
            answer: '[[50,55],[25,80]]'
            answer_contract: {"kind":"matrix","rows":2,"cols":2}
            solution_sketch: 'The yearly total is the first half plus the second half, so the second half is $T - H$. Row 1, column 1: $120 - 70 = 50$. Row 1, column 2: $95 - 40 = 55$. Row 2, column 1: $80 - 55 = 25$. Row 2, column 2: $140 - 60 = 80$. The second-half sales are $\begin{pmatrix}50&55\\25&80\end{pmatrix}$.'
          - problem: 'Solve for $X$: $2X + \begin{pmatrix}3&1\\-2&0\end{pmatrix} = \begin{pmatrix}9&5\\4&-6\end{pmatrix}$.'
            answer: '[[3,2],[3,-3]]'
            answer_contract: {"kind":"matrix","rows":2,"cols":2}
            solution_sketch: 'Call the known matrix on the left $A$ and the matrix on the right $B$. First subtract $A$ from both sides to get $2X = B - A$, and then divide by $2$. We have $B - A = \begin{pmatrix}6&4\\6&-6\end{pmatrix}$, and halving every entry gives $X = \begin{pmatrix}3&2\\3&-3\end{pmatrix}$.'
          - problem: 'Let $P$ and $Q$ both be $3\times 4$ matrices. Is the difference $Q - P$ defined?'
            answer: 'yes'
            answer_contract: {"kind":"label","options":[["yes","it can be formed","it is defined","defined"],["no","it cannot be formed","it is not defined","not defined","undefined"]]}
            solution_sketch: 'Both matrices have $3$ rows and $4$ columns, so they have the same size. Entries in matching positions exist, so the difference can be formed entry by entry. So $Q - P$ is defined.'
          - problem: 'Solve for $X$: $X + \begin{pmatrix}2&1\\0&1\end{pmatrix} - \begin{pmatrix}1&1\\1&0\end{pmatrix} = \begin{pmatrix}3&2\\2&2\end{pmatrix}$.'
            answer: '[[2,2],[3,1]]'
            answer_contract: {"kind":"matrix","rows":2,"cols":2}
            solution_sketch: 'Call the matrices $A$, $C$ and $B$ in the order they appear. Add $C$ and subtract $A$ on both sides, so $X = B + C - A$. First $B + C = \begin{pmatrix}4&3\\3&2\end{pmatrix}$, and subtracting $A$ gives $X = \begin{pmatrix}2&2\\3&1\end{pmatrix}$.'
          - problem: 'Sam solves $X + \begin{pmatrix}1&4\\2&0\end{pmatrix} = \begin{pmatrix}3&1\\2&5\end{pmatrix}$ by adding and writes $X = \begin{pmatrix}4&5\\4&5\end{pmatrix}$. What is the correct matrix $X$?'
            answer: '[[2,-3],[0,5]]'
            answer_contract: {"kind":"matrix","rows":2,"cols":2}
            solution_sketch: 'Call the known matrix on the left $A$ and the matrix on the right $B$. Sam added $A$ to both sides, which doubles $A$ on the left instead of removing it. To remove $A$ we must subtract it from both sides, so $X = B - A$. Row 1, column 1: $3 - 1 = 2$. Row 1, column 2: $1 - 4 = -3$. Row 2, column 1: $2 - 2 = 0$. Row 2, column 2: $5 - 0 = 5$. The correct matrix is $X = \begin{pmatrix}2&-3\\0&5\end{pmatrix}$.'
        constraints: "solve-for-X problems use addition, subtraction and one scalar factor; size items ask whether a sum is defined"
    diagnostic_exemplar:
      problem: 'Solve for $X$: $2X + \begin{pmatrix}1&-1\\0&2\end{pmatrix} = \begin{pmatrix}5&3\\4&0\end{pmatrix}$.'
      answer: '$X = \begin{pmatrix}2&2\\2&-1\end{pmatrix}$'
      answer_contract: {kind: none}
      solution_sketch: '$2X = \begin{pmatrix}4&4\\4&-2\end{pmatrix}$ entrywise, then multiply by $\frac{1}{2}$.'
    anki_seeds:
      - front: 'How do matrices add?'
        back: 'Entrywise, and only when the two matrices have exactly the same size.'
        type: basic

  - id: matrix-multiplication
    name: Matrix Multiplication
    core: true
    difficulty: 0.55
    drill: false
    answer_kind: numeric
    expected_time_secs: 150
    prerequisites:
      - id: computing-matrix-vector-products
        weight: 0.7
        key: true
      - id: computing-dot-products
        weight: 0.5
        key: true
      - id: matrix-addition-scalar-multiplication
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: Multiplying 2x2 matrices
        key_prerequisites: [computing-dot-products, computing-matrix-vector-products]
        try_first:
          problem: 'On Saturday a bakery sold $12$ muffins at $3$ dollars each and $7$ cookies at $2$ dollars each. How many dollars did it take in?'
          answer_contract: {"kind":"unit","quantity":"dollar","unit":"dollar","allow_omitted":true}
          answer: '50'
          reveal: 'The takings are $12 \cdot 3 + 7 \cdot 2 = 50$ dollars: multiply matching quantities and add. Every entry of a matrix product is a sum of this kind, one row of the left matrix against one column of the right matrix.'
        exemplars:
          - problem: 'Compute $\begin{pmatrix}3&1\\2&-4\end{pmatrix}\begin{pmatrix}1&2\\5&-3\end{pmatrix}$.'
            answer: '[[8,3],[-18,16]]'
            answer_contract: {"kind":"matrix","rows":2,"cols":2}
            solution_sketch: 'Each entry of the product is a row of the first matrix dotted with a column of the second matrix. Row 1, column 1: $3 \cdot 1 + 1 \cdot 5 = 8$. Row 1, column 2: $3 \cdot 2 + 1 \cdot (-3) = 3$. Row 2, column 1: $2 \cdot 1 + (-4) \cdot 5 = -18$. Row 2, column 2: $2 \cdot 2 + (-4) \cdot (-3) = 16$. The product is $\begin{pmatrix}8&3\\-18&16\end{pmatrix}$.'
          - problem: 'Compute $\begin{pmatrix}0&3\\4&-2\end{pmatrix}\begin{pmatrix}2&-1\\1&5\end{pmatrix}$.'
            answer: '[[3,15],[6,-14]]'
            answer_contract: {"kind":"matrix","rows":2,"cols":2}
            solution_sketch: 'Each entry of the product is a row of the first matrix dotted with a column of the second matrix. Row 1, column 1: $0 \cdot 2 + 3 \cdot 1 = 3$. Row 1, column 2: $0 \cdot (-1) + 3 \cdot 5 = 15$. Row 2, column 1: $4 \cdot 2 + (-2) \cdot 1 = 6$. Row 2, column 2: $4 \cdot (-1) + (-2) \cdot 5 = -14$. The product is $\begin{pmatrix}3&15\\6&-14\end{pmatrix}$.'
          - problem: 'Compute $A^2$ for $A = \begin{pmatrix}1&2\\-1&3\end{pmatrix}$.'
            answer: '[[-1,8],[-4,7]]'
            answer_contract: {"kind":"matrix","rows":2,"cols":2}
            solution_sketch: 'The square $A^2$ is $A$ times $A$, so each entry is a row of $A$ dotted with a column of $A$. Row 1, column 1: $1 \cdot 1 + 2 \cdot (-1) = -1$. Row 1, column 2: $1 \cdot 2 + 2 \cdot 3 = 8$. Row 2, column 1: $(-1) \cdot 1 + 3 \cdot (-1) = -4$. Row 2, column 2: $(-1) \cdot 2 + 3 \cdot 3 = 7$. The square is $\begin{pmatrix}-1&8\\-4&7\end{pmatrix}$.'
          - problem: 'Let $A = \begin{pmatrix}2&-3\\1&4\end{pmatrix}$ and $B = \begin{pmatrix}5&1\\-2&3\end{pmatrix}$. What is the entry in row 2, column 2 of $AB$?'
            answer: '13'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The entry in row 2, column 2 of $AB$ is row 2 of $A$ dotted with column 2 of $B$, and the other entries are not needed. Row 2 of $A$ is $(1, 4)$ and column 2 of $B$ is $(1, 3)$, so the entry is $1 \cdot 1 + 4 \cdot 3 = 13$.'
          - problem: 'A bakery sold muffins and cookies on Saturday (first row) and on Sunday (second row): $Q = \begin{pmatrix}20&30\\10&40\end{pmatrix}$ with muffins in the first column and cookies in the second. A muffin sells for $3$ dollars and costs $1$ dollar to make, and a cookie sells for $2$ dollars and costs $1$ dollar to make, so $P = \begin{pmatrix}3&1\\2&1\end{pmatrix}$ lists price and cost in its columns. Compute $QP$, whose rows give the takings and the cost of each day.'
            answer: '[[120,50],[110,50]]'
            answer_contract: {"kind":"matrix","rows":2,"cols":2}
            solution_sketch: 'Each entry of $QP$ pairs a day in $Q$ with a column of $P$. Row 1, column 1: $20 \cdot 3 + 30 \cdot 2 = 120$. Row 1, column 2: $20 \cdot 1 + 30 \cdot 1 = 50$. Row 2, column 1: $10 \cdot 3 + 40 \cdot 2 = 110$. Row 2, column 2: $10 \cdot 1 + 40 \cdot 1 = 50$. So the takings and costs are $\begin{pmatrix}120&50\\110&50\end{pmatrix}$, with the takings in the first column and the costs in the second.'
          - problem: 'A school canteen bakes cakes of two kinds on Monday (first row) and Tuesday (second row), so $N = \begin{pmatrix}5&3\\2&6\end{pmatrix}$ with cake 1 in the first column and cake 2 in the second. One cake of each kind uses eggs and cups of flour as listed in $A = \begin{pmatrix}2&1\\3&4\end{pmatrix}$, with the eggs in the first column and the flour in the second, cake 1 in the first row. Which matrix has rows that give the eggs and the flour used on Monday and on Tuesday?'
            answer: '[[19,17],[22,26]]'
            answer_contract: {"kind":"matrix","rows":2,"cols":2}
            solution_sketch: 'The use on each day is the number of cakes of each kind times the use per cake, so each row of $N$ is dotted with each column of $A$. This is the product $NA$, not $AN$. Row 1, column 1: $5 \cdot 2 + 3 \cdot 3 = 19$. Row 1, column 2: $5 \cdot 1 + 3 \cdot 4 = 17$. Row 2, column 1: $2 \cdot 2 + 6 \cdot 3 = 22$. Row 2, column 2: $2 \cdot 1 + 6 \cdot 4 = 26$. The result is $\begin{pmatrix}19&17\\22&26\end{pmatrix}$.'
          - problem: 'Let $A = \begin{pmatrix}2&1\\3&x\end{pmatrix}$ and $B = \begin{pmatrix}4&0\\2&5\end{pmatrix}$. The entry in row 2, column 1 of $AB$ is $18$. Find $x$.'
            answer: '3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The entry in row 2, column 1 of $AB$ is $3 \cdot 4 + x \cdot 2 = 12 + 2x$. Setting $12 + 2x = 18$ gives $2x = 6$, so $x = 3$.'
          - problem: 'Sam multiplies $\begin{pmatrix}1&2\\3&4\end{pmatrix}\begin{pmatrix}5&6\\7&8\end{pmatrix}$ entry by entry and gets $\begin{pmatrix}5&12\\21&32\end{pmatrix}$. What is the correct product?'
            answer: '[[19,22],[43,50]]'
            answer_contract: {"kind":"matrix","rows":2,"cols":2}
            solution_sketch: 'Sam multiplied the entries in the same positions, but a product entry is a row dotted with a column. Row 1, column 1: $1 \cdot 5 + 2 \cdot 7 = 19$. Row 1, column 2: $1 \cdot 6 + 2 \cdot 8 = 22$. Row 2, column 1: $3 \cdot 5 + 4 \cdot 7 = 43$. Row 2, column 2: $3 \cdot 6 + 4 \cdot 8 = 50$. The correct product is $\begin{pmatrix}19&22\\43&50\end{pmatrix}$.'
          - problem: 'For $A = \begin{pmatrix}1&2\\0&1\end{pmatrix}$ and $B = \begin{pmatrix}1&0\\3&1\end{pmatrix}$, compute $BA$.'
            answer: '[[1,2],[3,7]]'
            answer_contract: {"kind":"matrix","rows":2,"cols":2}
            solution_sketch: 'The product $BA$ has $B$ on the left, so rows of $B$ are dotted with columns of $A$. Row 1, column 1: $1 \cdot 1 + 0 \cdot 0 = 1$. Row 1, column 2: $1 \cdot 2 + 0 \cdot 1 = 2$. Row 2, column 1: $3 \cdot 1 + 1 \cdot 0 = 3$. Row 2, column 2: $3 \cdot 2 + 1 \cdot 1 = 7$. So $BA = \begin{pmatrix}1&2\\3&7\end{pmatrix}$, which differs from $AB = \begin{pmatrix}7&2\\3&1\end{pmatrix}$.'
        constraints: "2x2 times 2x2; entries in -4..8; in-context items use sales and production tables"
      - id: kp2
        name: Rectangular products and sizes
        key_prerequisites: [computing-dot-products, computing-matrix-vector-products]
        exemplars:
          - problem: 'Compute $\begin{pmatrix}1&0&2\\0&1&1\end{pmatrix}\begin{pmatrix}1&2\\3&0\\1&1\end{pmatrix}$.'
            answer: '[[3,4],[4,1]]'
            answer_contract: {"kind":"matrix","rows":2,"cols":2}
            solution_sketch: 'Each entry of the product is a row of the first matrix dotted with a column of the second matrix. Row 1, column 1: $1 \cdot 1 + 0 \cdot 3 + 2 \cdot 1 = 3$. Row 1, column 2: $1 \cdot 2 + 0 \cdot 0 + 2 \cdot 1 = 4$. Row 2, column 1: $0 \cdot 1 + 1 \cdot 3 + 1 \cdot 1 = 4$. Row 2, column 2: $0 \cdot 2 + 1 \cdot 0 + 1 \cdot 1 = 1$. The product is $\begin{pmatrix}3&4\\4&1\end{pmatrix}$.'
          - problem: 'Compute $\begin{pmatrix}1&2\\0&-1\\3&1\end{pmatrix}\begin{pmatrix}2&0&1\\1&3&-1\end{pmatrix}$.'
            answer: '[[4,6,-1],[-1,-3,1],[7,3,2]]'
            answer_contract: {"kind":"matrix","rows":3,"cols":3}
            solution_sketch: 'A $3\times 2$ matrix times a $2\times 3$ matrix is defined, because the inner numbers $2$ and $2$ match, and it has size $3\times 3$. Row 1, column 1: $1 \cdot 2 + 2 \cdot 1 = 4$. Row 1, column 2: $1 \cdot 0 + 2 \cdot 3 = 6$. Row 1, column 3: $1 \cdot 1 + 2 \cdot (-1) = -1$. Row 2, column 1: $0 \cdot 2 + (-1) \cdot 1 = -1$. Row 2, column 2: $0 \cdot 0 + (-1) \cdot 3 = -3$. Row 2, column 3: $0 \cdot 1 + (-1) \cdot (-1) = 1$. Row 3, column 1: $3 \cdot 2 + 1 \cdot 1 = 7$. Row 3, column 2: $3 \cdot 0 + 1 \cdot 3 = 3$. Row 3, column 3: $3 \cdot 1 + 1 \cdot (-1) = 2$. The product is $\begin{pmatrix}4&6&-1\\-1&-3&1\\7&3&2\end{pmatrix}$.'
          - problem: 'Compute $\begin{pmatrix}2&1&0\\1&3&1\end{pmatrix}\begin{pmatrix}1\\2\\4\end{pmatrix}$.'
            answer: '[[4],[11]]'
            answer_contract: {"kind":"matrix","rows":2,"cols":1}
            solution_sketch: 'A $2\times 3$ matrix times a $3\times 1$ column is defined, and it is a $2\times 1$ column. Row 1, column 1: $2 \cdot 1 + 1 \cdot 2 + 0 \cdot 4 = 4$. Row 2, column 1: $1 \cdot 1 + 3 \cdot 2 + 1 \cdot 4 = 11$. The product is $\begin{pmatrix}4\\11\end{pmatrix}$.'
          - problem: 'Let $A$ be a $2\times 3$ matrix and $B$ a $3\times 4$ matrix. Is the product $BA$ defined?'
            answer: 'no'
            answer_contract: {"kind":"label","options":[["yes","it can be formed","it is defined","defined"],["no","it cannot be formed","it is not defined","not defined","undefined"]]}
            solution_sketch: 'The matrix $B$ has $4$ columns and $A$ has $2$ rows. A product is defined only when the number of columns of the left matrix equals the number of rows of the right matrix, and $4 \ne 2$. So $BA$ is not defined, although $AB$ is.'
          - problem: 'A market stall sold loaves (first column) and cakes (second column) on three days (rows): $S = \begin{pmatrix}12&5\\9&8\\15&3\end{pmatrix}$. A loaf costs $4$ dollars and a cake costs $7$ dollars, so the prices form the column $p = \begin{pmatrix}4\\7\end{pmatrix}$. Compute $Sp$, which gives the takings of each day.'
            answer: '[[83],[92],[81]]'
            answer_contract: {"kind":"matrix","rows":3,"cols":1}
            solution_sketch: 'Each day, the takings are loaves times the loaf price plus cakes times the cake price, so each row of $S$ is dotted with $p$. Row 1, column 1: $12 \cdot 4 + 5 \cdot 7 = 83$. Row 2, column 1: $9 \cdot 4 + 8 \cdot 7 = 92$. Row 3, column 1: $15 \cdot 4 + 3 \cdot 7 = 81$. The takings are $\begin{pmatrix}83\\92\\81\end{pmatrix}$.'
          - problem: 'A shop sold three products on two days (rows): $S = \begin{pmatrix}10&6&4\\8&9&5\end{pmatrix}$. The matrix $P = \begin{pmatrix}2&1\\3&1\\5&2\end{pmatrix}$ lists the selling price (first column) and the profit (second column) of each product in dollars. Compute $SP$, whose rows give the takings and the profit of each day.'
            answer: '[[58,24],[68,27]]'
            answer_contract: {"kind":"matrix","rows":2,"cols":2}
            solution_sketch: 'A $2\times 3$ matrix times a $3\times 2$ matrix is a $2\times 2$ matrix. Row 1, column 1: $10 \cdot 2 + 6 \cdot 3 + 4 \cdot 5 = 58$. Row 1, column 2: $10 \cdot 1 + 6 \cdot 1 + 4 \cdot 2 = 24$. Row 2, column 1: $8 \cdot 2 + 9 \cdot 3 + 5 \cdot 5 = 68$. Row 2, column 2: $8 \cdot 1 + 9 \cdot 1 + 5 \cdot 2 = 27$. So the takings and the profit are $\begin{pmatrix}58&24\\68&27\end{pmatrix}$.'
          - problem: 'Let $A$ be a $3\times 2$ matrix and $B$ a $2\times 5$ matrix. Is the product $AB$ defined?'
            answer: 'yes'
            answer_contract: {"kind":"label","options":[["yes","it can be formed","it is defined","defined"],["no","it cannot be formed","it is not defined","not defined","undefined"]]}
            solution_sketch: 'The matrix $A$ has $2$ columns and $B$ has $2$ rows, so the inner numbers match. The product has $3$ rows and $5$ columns. So $AB$ is defined.'
          - problem: 'The product $AB$ is defined and has $3$ rows and $5$ columns. The matrix $A$ has $3$ rows and $4$ columns. How many rows does $B$ have?'
            answer: '4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The number of columns of $A$ must equal the number of rows of $B$ for the product to be defined. The matrix $A$ has $4$ columns, so $B$ has $4$ rows. The $5$ columns of the product are the columns of $B$.'
          - problem: 'Let $A = \begin{pmatrix}2&-1\\1&0\\3&4\end{pmatrix}$ and $B = \begin{pmatrix}1&2&0\\-2&1&3\end{pmatrix}$. What is the entry in row 3, column 2 of $AB$?'
            answer: '10'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The entry in row 3, column 2 of $AB$ is row 3 of $A$ dotted with column 2 of $B$. Row 3 of $A$ is $(3, 4)$ and column 2 of $B$ is $(2, 1)$, so the entry is $3 \cdot 2 + 4 \cdot 1 = 10$.'
          - problem: 'The matrix $A$ is $4\times 2$ and the matrix $B$ is $2\times 3$. Write the size of $AB$ as the pair (rows, columns).'
            answer: '(4, 3)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'The product $AB$ is defined because $A$ has $2$ columns and $B$ has $2$ rows. It has as many rows as $A$ and as many columns as $B$, so its size is $4$ rows and $3$ columns, the pair $(4, 3)$.'
          - problem: 'The matrices $A$, $B$ and $C$ have sizes $5\times 3$, $3\times 2$ and $2\times 4$. Write the size of $ABC$ as the pair (rows, columns).'
            answer: '(5, 4)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'The product $AB$ has size $5\times 2$, because the inner numbers $3$ and $3$ match. Then $(AB)C$ is defined because the inner numbers $2$ and $2$ match, and its size is $5$ rows and $4$ columns, the pair $(5, 4)$.'
        constraints: "2x3 times 3x2, 3x2 times 2x3, matrix times a column; size questions up to 4x5; in-context items use sales tables"
      - id: kp3
        name: Columns of a product
        key_prerequisites: [computing-matrix-vector-products]
        exemplars:
          - problem: 'For $A = \begin{pmatrix}1&1\\0&2\end{pmatrix}$ and $B = \begin{pmatrix}2&0\\1&3\end{pmatrix}$, compute $AB$ by multiplying $A$ by each column of $B$.'
            answer: '[[3,3],[2,6]]'
            answer_contract: {"kind":"matrix","rows":2,"cols":2}
            solution_sketch: 'The first column of $AB$ is $A$ times the first column $(2, 1)$ of $B$, which is $(3, 2)$. The second column is $A$ times $(0, 3)$, which is $(3, 6)$. Putting the columns side by side gives $\begin{pmatrix}3&3\\2&6\end{pmatrix}$.'
          - problem: 'For $A = \begin{pmatrix}2&1\\3&0\end{pmatrix}$ and $B = \begin{pmatrix}1&4\\2&5\end{pmatrix}$, find the second column of $AB$ without computing the rest of the product.'
            answer: '(13, 12)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'The second column of $AB$ is $A$ times the second column of $B$. The column of $B$ is $(4, 5)$. Row 1 of $A$ gives $2 \cdot 4 + 1 \cdot 5 = 13$ and row 2 of $A$ gives $3 \cdot 4 + 0 \cdot 5 = 12$. The column is $(13, 12)$.'
          - problem: 'For $A = \begin{pmatrix}2&3\\1&4\end{pmatrix}$ and $B = \begin{pmatrix}1&2\\0&1\end{pmatrix}$, compute $AB$ by multiplying $A$ by each column of $B$.'
            answer: '[[2,7],[1,6]]'
            answer_contract: {"kind":"matrix","rows":2,"cols":2}
            solution_sketch: 'The first column of $AB$ is $A$ times $(1, 0)$, which is $(2, 1)$. The second column is $A$ times $(2, 1)$, which is $(7, 6)$. Putting the columns side by side gives $\begin{pmatrix}2&7\\1&6\end{pmatrix}$.'
          - problem: 'Shop 1 (first row) and shop 2 (second row) charge the prices in $A = \begin{pmatrix}3&2\\2&4\end{pmatrix}$ dollars per kilogram of apples (first column) and pears (second column). A customer buys $4$ kg of apples and $3$ kg of pears, which is the column $b = \begin{pmatrix}4\\3\end{pmatrix}$. How much does the basket cost at shop 1 and at shop 2?'
            answer: '(18, 20)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'The cost at each shop is the price per kilogram times the amount, added over the two fruits, which is $A$ times $b$. The basket is $(4, 3)$. Row 1 of $A$ gives $3 \cdot 4 + 2 \cdot 3 = 18$ and row 2 of $A$ gives $2 \cdot 4 + 4 \cdot 3 = 20$. The costs are $(18, 20)$.'
          - problem: 'The prices at two shops (rows) are $A = \begin{pmatrix}3&2\\2&4\end{pmatrix}$ dollars per kilogram of apples (first column) and pears (second column). The columns of $B = \begin{pmatrix}4&1\\3&5\end{pmatrix}$ are two baskets, given as kilograms of apples and pears. How many dollars does the second basket cost at shop 2?'
            answer: '22'
            answer_contract: {"kind":"unit","quantity":"dollar","unit":"dollar","allow_omitted":true}
            solution_sketch: 'The second basket is the second column $(1, 5)$ of $B$. The cost at shop 2 uses row 2 of $A$, so it is $2 \cdot 1 + 4 \cdot 5 = 22$ dollars.'
          - problem: 'What is $\begin{pmatrix}5&-2\\3&7\end{pmatrix}\begin{pmatrix}0\\1\end{pmatrix}$?'
            answer: '(-2, 7)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'The product of a matrix with the column $(0, 1)$ picks out the second column of the matrix, because $5 \cdot 0 + (-2) \cdot 1 = -2$ and $3 \cdot 0 + 7 \cdot 1 = 7$. The result is $(-2, 7)$.'
          - problem: 'Sam finds the first column of $AB$ for $A = \begin{pmatrix}3&1\\2&4\end{pmatrix}$ and $B = \begin{pmatrix}2&5\\1&3\end{pmatrix}$ as $\begin{pmatrix}6\\4\end{pmatrix}$, by multiplying the first entries together and the second entries together. What is the correct first column of $AB$?'
            answer: '(7, 8)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'The first column of $AB$ is $A$ times the first column $(2, 1)$ of $B$, a row-by-column product and not an entry-by-entry one. The column of $B$ is $(2, 1)$. Row 1 of $A$ gives $3 \cdot 2 + 1 \cdot 1 = 7$ and row 2 of $A$ gives $2 \cdot 2 + 4 \cdot 1 = 8$. The column is $(7, 8)$.'
          - problem: 'For $A = \begin{pmatrix}1&2\\3&4\end{pmatrix}$ and $B = \begin{pmatrix}0&1\\2&3\end{pmatrix}$, compute $AB$ column by column.'
            answer: '[[4,7],[8,15]]'
            answer_contract: {"kind":"matrix","rows":2,"cols":2}
            solution_sketch: 'The first column of $AB$ is $A$ times $(0, 2)$, which is $(4, 8)$. The second column is $A$ times $(1, 3)$, which is $(7, 15)$. Row 2 of $A$ is $(3, 4)$ and column 1 of $B$ is $(0, 2)$, so the entry in row 2, column 1 is $3 \cdot 0 + 4 \cdot 2 = 8$, as the row-column rule also gives. The product is $\begin{pmatrix}4&7\\8&15\end{pmatrix}$.'
          - problem: 'For $A = \begin{pmatrix}4&1\\2&3\end{pmatrix}$ and $B = \begin{pmatrix}1&2\\3&4\end{pmatrix}$, find the second column of $AB$.'
            answer: '(12, 16)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'The second column of $AB$ is $A$ times the second column of $B$. The column of $B$ is $(2, 4)$. Row 1 of $A$ gives $4 \cdot 2 + 1 \cdot 4 = 12$ and row 2 of $A$ gives $2 \cdot 2 + 3 \cdot 4 = 16$. The column is $(12, 16)$.'
        constraints: "verify the column view against the row-column rule on 2x2 matrices; in-context items use price tables"
    diagnostic_exemplar:
      problem: 'Compute $\begin{pmatrix}1&0&2\\3&1&0\end{pmatrix}\begin{pmatrix}2&1\\0&4\\1&3\end{pmatrix}$, and state the size of the product.'
      answer: '$\begin{pmatrix}4&7\\6&7\end{pmatrix}$, a $2 \times 2$ matrix'
      answer_contract: {kind: none}
      solution_sketch: 'Row $1$: $(2 + 0 + 2, 1 + 0 + 6) = (4, 7)$; row $2$: $(6 + 0 + 0, 3 + 4 + 0) = (6, 7)$. A $2\times3$ times a $3\times2$ is $2\times2$.'
    anki_seeds:
      - front: 'Entry $(i, j)$ of the product $AB$ is computed how?'
        back: 'Dot product of row $i$ of $A$ with column $j$ of $B$.'
        type: basic
      - front: '$AB$ is defined exactly when...'
        back: 'the number of columns of $A$ equals the number of rows of $B$.'
        type: basic

  - id: identity-zero-matrices
    name: Identity and Zero Matrices
    core: true
    difficulty: 0.55
    drill: false
    answer_kind: numeric
    expected_time_secs: 90
    prerequisites:
      - id: matrix-multiplication
        weight: 0.7
        key: true
      - id: matrix-addition-scalar-multiplication
        weight: 0.5
    knowledge_points:
      - id: kp1
        name: The identity matrix
        key_prerequisites: [matrix-multiplication]
        exemplars:
          - problem: 'Write the identity matrix $I_3$.'
            answer: '[[1,0,0],[0,1,0],[0,0,1]]'
            answer_contract: {"kind":"matrix","rows":3,"cols":3}
            solution_sketch: 'The identity matrix $I_3$ is the $3\times 3$ matrix with $1$ in every position of the main diagonal and $0$ in every other position. So row 1 is $(1, 0, 0)$, row 2 is $(0, 1, 0)$ and row 3 is $(0, 0, 1)$.'
          - problem: 'Compute $\begin{pmatrix}2&3\\1&4\end{pmatrix}I_2$.'
            answer: '[[2,3],[1,4]]'
            answer_contract: {"kind":"matrix","rows":2,"cols":2}
            solution_sketch: 'Multiplying by the identity matrix on the right leaves a matrix unchanged. Call the matrix $A$. Each column of $A I_2$ is $A$ times a column of $I_2$, and these columns pick out the columns $(2, 1)$ and $(3, 4)$ of $A$. The product is $\begin{pmatrix}2&3\\1&4\end{pmatrix}$.'
          - problem: 'Let $A = \begin{pmatrix}6&-2&5\\4&1&0\end{pmatrix}$. Compute $I_2 A$.'
            answer: '[[6,-2,5],[4,1,0]]'
            answer_contract: {"kind":"matrix","rows":2,"cols":3}
            solution_sketch: 'The identity matrix $I_2$ has $2$ rows, which matches the $2$ rows of $A$, so the product is defined. Multiplying by the identity on the left leaves $A$ unchanged. The product is $\begin{pmatrix}6&-2&5\\4&1&0\end{pmatrix}$.'
          - problem: 'Let $A = \begin{pmatrix}1&-3&2\\0&4&7\end{pmatrix}$. Compute $A I_3$.'
            answer: '[[1,-3,2],[0,4,7]]'
            answer_contract: {"kind":"matrix","rows":2,"cols":3}
            solution_sketch: 'The matrix $A$ has $3$ columns, so the product is defined with the identity $I_3$ on the right. Multiplying by the identity leaves $A$ unchanged. The product is $\begin{pmatrix}1&-3&2\\0&4&7\end{pmatrix}$.'
          - problem: 'A teacher stores the marks of three students on two tests in a $3\times 2$ matrix $T = \begin{pmatrix}78&85\\64&90\\71&69\end{pmatrix}$ (one row for each student). The teacher wants a matrix $R$ so that $RT$ lists the students in the same order as $T$. Which $3\times 3$ matrix $R$ satisfies $RT = T$ for every such table?'
            answer: '[[1,0,0],[0,1,0],[0,0,1]]'
            answer_contract: {"kind":"matrix","rows":3,"cols":3}
            solution_sketch: 'The matrix $R$ must leave every table unchanged, so it is the identity matrix $I_3$. Row $i$ of $I_3$ has a $1$ only in position $i$, so row $i$ of $RT$ is row $i$ of $T$. So $R = I_3$, with rows $(1, 0, 0)$, $(0, 1, 0)$ and $(0, 0, 1)$.'
          - problem: 'Let $A$ be a $3\times 2$ matrix. The product $I_n A$ is defined and equals $A$. What is $n$?'
            answer: '3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'For $I_n A$ to be defined, the number of columns $n$ of $I_n$ must equal the number of rows of $A$, which is $3$. So $n = 3$, and then $I_3 A = A$.'
          - problem: 'Let $A$ be a $3\times 2$ matrix. The product $A I_m$ is defined and equals $A$. What is $m$?'
            answer: '2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'For $A I_m$ to be defined, the number of rows $m$ of $I_m$ must equal the number of columns of $A$, which is $2$. So $m = 2$, and then $A I_2 = A$.'
          - problem: 'Let $A = \begin{pmatrix}3&-1\\2&5\end{pmatrix}$. Compute $(I_2 + I_2)A$.'
            answer: '[[6,-2],[4,10]]'
            answer_contract: {"kind":"matrix","rows":2,"cols":2}
            solution_sketch: 'First $I_2 + I_2 = 2I_2$, which has $2$ on the diagonal. Then $(2I_2)A = 2(I_2 A) = 2A$, which doubles every entry of $A$. The result is $\begin{pmatrix}6&-2\\4&10\end{pmatrix}$.'
          - problem: 'Let $A = \begin{pmatrix}5&3\\-1&4\end{pmatrix}$. Compute $A - 2I_2$.'
            answer: '[[3,3],[-1,2]]'
            answer_contract: {"kind":"matrix","rows":2,"cols":2}
            solution_sketch: 'The matrix $2I_2$ is $\begin{pmatrix}2&0\\0&2\end{pmatrix}$, so only the diagonal entries of $A$ change. The top-left entry is $5 - 2 = 3$ and the bottom-right entry is $4 - 2 = 2$, and the other entries stay $3$ and $-1$. The result is $\begin{pmatrix}3&3\\-1&2\end{pmatrix}$.'
          - problem: 'Sam computes $I_2\begin{pmatrix}4&1\\2&3\end{pmatrix}$ by multiplying the entries in the same positions and writes $\begin{pmatrix}4&0\\0&3\end{pmatrix}$. What is the correct product?'
            answer: '[[4,1],[2,3]]'
            answer_contract: {"kind":"matrix","rows":2,"cols":2}
            solution_sketch: 'Sam multiplied entry by entry, but a product entry is a row dotted with a column. The identity matrix leaves $A$ unchanged, so row 1 of the product is $1 \cdot (4, 1) + 0 \cdot (2, 3) = (4, 1)$ and row 2 is $(2, 3)$. The correct product is $\begin{pmatrix}4&1\\2&3\end{pmatrix}$.'
          - problem: 'A shop records the sales of three products on two days in the $2\times 3$ matrix $N = \begin{pmatrix}14&9&6\\11&12&8\end{pmatrix}$ (one row for each day). The owner multiplies $N$ on the right by a matrix $C$ and wants the result to be $N$ again. Which matrix $C$ does this for every such table?'
            answer: '[[1,0,0],[0,1,0],[0,0,1]]'
            answer_contract: {"kind":"matrix","rows":3,"cols":3}
            solution_sketch: 'The product $NC$ is defined only if $C$ has $3$ rows, and it has the same size as $N$ only if $C$ has $3$ columns. The matrix that leaves every table unchanged under right multiplication is the identity matrix $I_3$. So $C = I_3$, with rows $(1, 0, 0)$, $(0, 1, 0)$ and $(0, 0, 1)$.'
        constraints: "verify AI = IA = A on 2x2 and 2x3 matrices; identity sizes up to 3x3"
      - id: kp2
        name: The zero matrix
        key_prerequisites: [matrix-addition-scalar-multiplication, matrix-multiplication]
        exemplars:
          - problem: 'Compute $A + O$ for $A = \begin{pmatrix}1&-2\\4&3\end{pmatrix}$ and $O$ the $2\times 2$ zero matrix.'
            answer: '[[1,-2],[4,3]]'
            answer_contract: {"kind":"matrix","rows":2,"cols":2}
            solution_sketch: 'The zero matrix has $0$ in every position, so adding it changes no entry. The sum is $\begin{pmatrix}1&-2\\4&3\end{pmatrix}$.'
          - problem: 'Compute $\begin{pmatrix}1&2\\3&4\end{pmatrix}\begin{pmatrix}0&0\\0&0\end{pmatrix}$.'
            answer: '[[0,0],[0,0]]'
            answer_contract: {"kind":"matrix","rows":2,"cols":2}
            solution_sketch: 'Every entry of the product is a row of the left matrix dotted with a column of zeros, so it is $0$. The product is the $2\times 2$ zero matrix $\begin{pmatrix}0&0\\0&0\end{pmatrix}$.'
          - problem: 'No goods are delivered to a shop this week, so the delivery matrix is the zero matrix $O$. At the start of the week the stock of two products in two sections was $S = \begin{pmatrix}12&5\\8&20\end{pmatrix}$, and nothing was sold. Which matrix gives the stock at the end of the week?'
            answer: '[[12,5],[8,20]]'
            answer_contract: {"kind":"matrix","rows":2,"cols":2}
            solution_sketch: 'The stock at the end is the stock at the start plus the delivery, so it is $S + O$. Adding the zero matrix changes no entry. The stock is $\begin{pmatrix}12&5\\8&20\end{pmatrix}$.'
          - problem: 'A charity gives away all its goods, so every price is $0$ and the price column is $P = \begin{pmatrix}0\\0\\0\end{pmatrix}$. On two days (rows) it gave away three kinds of goods in the amounts $N = \begin{pmatrix}10&6&4\\8&9&5\end{pmatrix}$. Which matrix $NP$ gives the takings of each day?'
            answer: '[[0],[0]]'
            answer_contract: {"kind":"matrix","rows":2,"cols":1}
            solution_sketch: 'Each entry of $NP$ is a row of $N$ dotted with the column $P$, and every term has a factor $0$. So every day has takings $0$ and $NP = \begin{pmatrix}0\\0\end{pmatrix}$.'
          - problem: 'Compute $A(B + O)$ for $A = \begin{pmatrix}1&2\\3&4\end{pmatrix}$, $B = \begin{pmatrix}0&1\\1&0\end{pmatrix}$ and $O$ the $2\times 2$ zero matrix.'
            answer: '[[2,1],[4,3]]'
            answer_contract: {"kind":"matrix","rows":2,"cols":2}
            solution_sketch: 'First $B + O = B$, because the zero matrix changes no entry. Then we multiply: Row 1, column 1: $1 \cdot 0 + 2 \cdot 1 = 2$. Row 1, column 2: $1 \cdot 1 + 2 \cdot 0 = 1$. Row 2, column 1: $3 \cdot 0 + 4 \cdot 1 = 4$. Row 2, column 2: $3 \cdot 1 + 4 \cdot 0 = 3$. So $A(B + O) = \begin{pmatrix}2&1\\4&3\end{pmatrix}$.'
          - problem: 'Let $A = \begin{pmatrix}2&-3\\5&1\end{pmatrix}$. Which $2\times 2$ matrix $X$ satisfies $A + X = A$?'
            answer: '[[0,0],[0,0]]'
            answer_contract: {"kind":"matrix","rows":2,"cols":2}
            solution_sketch: 'Subtracting $A$ from both sides gives $X = A - A$, and every entry of $A - A$ is $0$. So $X$ is the zero matrix $\begin{pmatrix}0&0\\0&0\end{pmatrix}$.'
          - problem: 'Compute $(O + A)B$ for $A = \begin{pmatrix}2&0\\1&3\end{pmatrix}$, $B = \begin{pmatrix}1&-1\\2&4\end{pmatrix}$ and $O$ the $2\times 2$ zero matrix.'
            answer: '[[2,-2],[7,11]]'
            answer_contract: {"kind":"matrix","rows":2,"cols":2}
            solution_sketch: 'First $O + A = A$. Then we multiply $A$ by $B$: Row 1, column 1: $2 \cdot 1 + 0 \cdot 2 = 2$. Row 1, column 2: $2 \cdot (-1) + 0 \cdot 4 = -2$. Row 2, column 1: $1 \cdot 1 + 3 \cdot 2 = 7$. Row 2, column 2: $1 \cdot (-1) + 3 \cdot 4 = 11$. So $(O + A)B = \begin{pmatrix}2&-2\\7&11\end{pmatrix}$.'
          - problem: 'Let $A = \begin{pmatrix}1&0&2\\3&1&4\end{pmatrix}$ and let $O$ be the $3\times 2$ zero matrix. Compute $AO$.'
            answer: '[[0,0],[0,0]]'
            answer_contract: {"kind":"matrix","rows":2,"cols":2}
            solution_sketch: 'The matrix $A$ is $2\times 3$ and $O$ is $3\times 2$, so $AO$ is defined and has size $2\times 2$. Every entry is a row of $A$ dotted with a column of zeros, so it is $0$. The product is $\begin{pmatrix}0&0\\0&0\end{pmatrix}$.'
          - problem: 'For $A = \begin{pmatrix}2&-3\\5&1\end{pmatrix}$, compute $A + (-1)A$.'
            answer: '[[0,0],[0,0]]'
            answer_contract: {"kind":"matrix","rows":2,"cols":2}
            solution_sketch: 'The scalar multiple $(-1)A$ has the opposite of every entry of $A$, so $A + (-1)A$ has entries $2 + (-2) = 0$, $-3 + 3 = 0$, $5 + (-5) = 0$ and $1 + (-1) = 0$. The result is the zero matrix $\begin{pmatrix}0&0\\0&0\end{pmatrix}$.'
        constraints: "zero matrices of size 2x2 and 3x2; behavior under sums and products stated and verified; in-context items use stock and price tables"
      - id: kp3
        name: Zero products from nonzero factors
        key_prerequisites: [matrix-multiplication]
        try_first:
          problem: 'Let $A = \begin{pmatrix}1&0\\0&0\end{pmatrix}$ and $B = \begin{pmatrix}0&0\\0&1\end{pmatrix}$. Is $AB$ the zero matrix?'
          answer_contract: {"kind":"label","options":[["yes","it is the zero matrix","zero","zero matrix","the zero matrix","it is zero","equals zero","AB is zero"],["no","it is not the zero matrix","not zero","not the zero matrix","nonzero","it is not zero","not a zero matrix","AB is not zero"]]}
          answer: 'yes'
          reveal: 'Every entry of $AB$ is $0$, although neither $A$ nor $B$ is the zero matrix. With numbers a zero product forces a zero factor, but with matrices it does not.'
        exemplars:
          - problem: 'Compute $AB$ for $A = \begin{pmatrix}1&1\\1&1\end{pmatrix}$ and $B = \begin{pmatrix}1&-1\\-1&1\end{pmatrix}$.'
            answer: '[[0,0],[0,0]]'
            answer_contract: {"kind":"matrix","rows":2,"cols":2}
            solution_sketch: 'Each entry of $AB$ is a row of $A$ dotted with a column of $B$. Row 1, column 1: $1 \cdot 1 + 1 \cdot (-1) = 0$. Row 1, column 2: $1 \cdot (-1) + 1 \cdot 1 = 0$. Row 2, column 1: $1 \cdot 1 + 1 \cdot (-1) = 0$. Row 2, column 2: $1 \cdot (-1) + 1 \cdot 1 = 0$. So $AB = \begin{pmatrix}0&0\\0&0\end{pmatrix}$, the zero matrix, although neither $A$ nor $B$ is the zero matrix.'
          - problem: 'Sam says that if $AB = O$ for two $2\times 2$ matrices, then $A = O$ or $B = O$, just as for numbers. Is Sam always right?'
            answer: 'no'
            answer_contract: {"kind":"label","options":[["yes","it is always true","always true","true","always right","right","correct","Sam is always right"],["no","it is not always true","not always true","false","not always","wrong","incorrect","Sam is wrong"]]}
            solution_sketch: 'Sam is not always right. For example, $A$ with all entries $1$ and $B$ with first row $(1, -1)$ and second row $(-1, 1)$ are both nonzero, but every entry of $AB$ is $1 \cdot 1 + 1 \cdot (-1) = 0$. So a product of nonzero matrices can be the zero matrix.'
          - problem: 'For $A = \begin{pmatrix}0&1\\0&1\end{pmatrix}$ and $B = \begin{pmatrix}1&0\\0&0\end{pmatrix}$ the product $AB$ is the zero matrix, although $A$ and $B$ are not. Compute $BA$.'
            answer: '[[0,1],[0,0]]'
            answer_contract: {"kind":"matrix","rows":2,"cols":2}
            solution_sketch: 'The product $BA$ has $B$ on the left, so rows of $B$ are dotted with columns of $A$. Row 1, column 1: $1 \cdot 0 + 0 \cdot 0 = 0$. Row 1, column 2: $1 \cdot 1 + 0 \cdot 1 = 1$. Row 2, column 1: $0 \cdot 0 + 0 \cdot 0 = 0$. Row 2, column 2: $0 \cdot 1 + 0 \cdot 1 = 0$. So $BA = \begin{pmatrix}0&1\\0&0\end{pmatrix}$, which is not the zero matrix.'
          - problem: 'Let $E = \begin{pmatrix}0&0&0\\1&0&0\\0&1&0\end{pmatrix}$. What is the smallest positive integer $k$ for which $E^k$ is the zero matrix?'
            answer: '3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Here $E^2 = E E = \begin{pmatrix}0&0&0\\0&0&0\\1&0&0\end{pmatrix}$, which is not the zero matrix. Then $E^3 = E^2 E$ has every entry $0$, because the only nonzero entry of $E^2$ is in column 1 and the first row of $E$ is zero. So $k = 3$.'
          - problem: 'Let $A = \begin{pmatrix}2&4\\-1&-2\end{pmatrix}$. Compute $A^2$.'
            answer: '[[0,0],[0,0]]'
            answer_contract: {"kind":"matrix","rows":2,"cols":2}
            solution_sketch: 'We dot rows of $A$ with columns of $A$. Row 1, column 1: $2 \cdot 2 + 4 \cdot (-1) = 0$. Row 1, column 2: $2 \cdot 4 + 4 \cdot (-2) = 0$. Row 2, column 1: $(-1) \cdot 2 + (-2) \cdot (-1) = 0$. Row 2, column 2: $(-1) \cdot 4 + (-2) \cdot (-2) = 0$. So $A^2 = \begin{pmatrix}0&0\\0&0\end{pmatrix}$, the zero matrix, although $A$ is not the zero matrix.'
          - problem: 'Let $A = \begin{pmatrix}1&2\\2&4\end{pmatrix}$ and $B = \begin{pmatrix}2&x\\-1&1\end{pmatrix}$. For which $x$ is $AB$ the zero matrix?'
            answer: '-2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The product is $AB = \begin{pmatrix}2 - 2 & x + 2\\4 - 4 & 2x + 4\end{pmatrix}$. The entries $x + 2$ and $2x + 4$ both equal $0$ exactly when $x = -2$. So $x = -2$.'
          - problem: 'Let $A = \begin{pmatrix}2&-1\\4&-2\end{pmatrix}$ and $B = \begin{pmatrix}1&1\\2&2\end{pmatrix}$. Is $AB$ the zero matrix?'
            answer: 'yes'
            answer_contract: {"kind":"label","options":[["yes","it is the zero matrix","zero","zero matrix","the zero matrix","it is zero","equals zero","AB is zero"],["no","it is not the zero matrix","not zero","not the zero matrix","nonzero","it is not zero","not a zero matrix","AB is not zero"]]}
            solution_sketch: 'We dot rows of $A$ with columns of $B$. Row 1, column 1: $2 \cdot 1 + (-1) \cdot 2 = 0$. Row 1, column 2: $2 \cdot 1 + (-1) \cdot 2 = 0$. Row 2, column 1: $4 \cdot 1 + (-2) \cdot 2 = 0$. Row 2, column 2: $4 \cdot 1 + (-2) \cdot 2 = 0$. Every entry is $0$, so $AB = \begin{pmatrix}0&0\\0&0\end{pmatrix}$ is the zero matrix. So the answer is yes.'
          - problem: 'Let $A = \begin{pmatrix}1&-1\\-2&2\end{pmatrix}$ and $B = \begin{pmatrix}2&y\\2&3\end{pmatrix}$. For which $y$ is $AB$ the zero matrix?'
            answer: '3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The first column of $AB$ is $A(2, 2) = (2 - 2, -4 + 4) = (0, 0)$. The second column is $A(y, 3) = (y - 3, -2y + 6)$, and both entries equal $0$ exactly when $y = 3$. So $y = 3$.'
        constraints: "2x2 counterexamples with small integer entries; one 3x3 nilpotent matrix"
    diagnostic_exemplar:
      problem: 'Compute $AB$ for $A = \begin{pmatrix}1&0\\0&0\end{pmatrix}$ and $B = \begin{pmatrix}0&0\\3&1\end{pmatrix}$. What does the result show?'
      answer: '$AB = \begin{pmatrix}0&0\\0&0\end{pmatrix}$: a product of two nonzero matrices can be the zero matrix, so $AB = O$ does not force $A = O$ or $B = O$'
      answer_contract: {kind: none}
      solution_sketch: 'Each entry of $AB$ pairs a zero of $A$ with a nonzero of $B$ or vice versa, so every entry vanishes even though $A \ne O$ and $B \ne O$.'
    anki_seeds:
      - front: 'The identity matrix $I_n$ looks like...'
        back: '$1$s on the main diagonal, $0$s everywhere else; $AI = IA = A$.'
        type: basic
      - front: 'Does $AB = O$ force $A = O$ or $B = O$?'
        back: 'No; nonzero matrices can multiply to the zero matrix.'
        type: basic

  - id: diagonal-triangular-matrices
    name: Diagonal and Triangular Matrices
    core: true
    difficulty: 0.55
    drill: false
    answer_kind: numeric
    expected_time_secs: 90
    prerequisites:
      - id: matrix-multiplication
        weight: 0.7
        key: true
      - id: identity-zero-matrices
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: Recognizing diagonal and triangular matrices
        key_prerequisites: [identity-zero-matrices]
        exemplars:
          - problem: 'Classify the matrix $\begin{pmatrix}2&-1&4\\0&3&5\\0&0&-2\end{pmatrix}$ as diagonal, upper triangular, lower triangular, or none of these.'
            answer: 'upper triangular'
            answer_contract: {"kind":"label","options":[["diagonal","diagonal matrix"],["upper triangular","upper","upper triangular matrix"],["lower triangular","lower","lower triangular matrix"],["neither","none of these","none"]]}
            solution_sketch: 'The entries below the main diagonal are in positions $(2,1)$, $(3,1)$ and $(3,2)$, and all three are $0$. The entries above the diagonal are $-1$, $4$ and $5$, and they are not all $0$. So the matrix is upper triangular, and it is not diagonal.'
          - problem: 'Write the $3\times 3$ diagonal matrix whose diagonal entries are $2$, $-1$ and $5$.'
            answer: '[[2,0,0],[0,-1,0],[0,0,5]]'
            answer_contract: {"kind":"matrix","rows":3,"cols":3}
            solution_sketch: 'A diagonal matrix has $0$ in every position off the main diagonal. So the diagonal entries $2$, $-1$ and $5$ go in positions $(1,1)$, $(2,2)$ and $(3,3)$, and all other entries are $0$.'
          - problem: 'Classify the matrix $\begin{pmatrix}5&0&0\\-2&3&0\\4&0&-1\end{pmatrix}$ as diagonal, upper triangular, lower triangular, or none of these.'
            answer: 'lower triangular'
            answer_contract: {"kind":"label","options":[["diagonal","diagonal matrix"],["upper triangular","upper","upper triangular matrix"],["lower triangular","lower","lower triangular matrix"],["neither","none of these","none"]]}
            solution_sketch: 'The entries above the main diagonal are in positions $(1,2)$, $(1,3)$ and $(2,3)$, and all three are $0$. The entries $-2$ and $4$ below the diagonal are not $0$. So the matrix is lower triangular, and it is neither diagonal nor upper triangular.'
          - problem: 'For which value of $a$ is $\begin{pmatrix}1&2&a\\0&3&4\\2a-6&0&5\end{pmatrix}$ an upper triangular matrix?'
            answer: '3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'An upper triangular matrix has $0$ in every position below the main diagonal. The entries in positions $(2,1)$ and $(3,2)$ are already $0$, so the entry $2a - 6$ in position $(3,1)$ must be $0$. Then $2a = 6$, so $a = 3$.'
          - problem: 'A table lists the road distance between every two of $5$ towns. Each pair appears once, above the main diagonal of a $5\times 5$ matrix, and every other entry is $0$. How many distances does the table hold?'
            answer: '10'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The positions above the main diagonal are row 1 with $4$ positions, row 2 with $3$, row 3 with $2$ and row 4 with $1$. The count is $4 + 3 + 2 + 1 = 10$. This is also half of the $20$ off-diagonal positions, so the table holds $10$ distances.'
          - problem: 'A company records the cost of sending goods from warehouse $i$ to warehouse $j$ only when $i \le j$, and writes $0$ in every other position of its $4\times 4$ cost matrix. How many entries of the matrix are $0$ for this reason?'
            answer: '6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The positions with $i > j$ lie below the main diagonal. Row 2 has $1$ such position, row 3 has $2$ and row 4 has $3$, so there are $1 + 2 + 3 = 6$ positions. So $6$ entries are $0$ for this reason.'
          - problem: 'Write the $3\times 3$ upper triangular matrix in which every entry on or above the main diagonal is $1$.'
            answer: '[[1,1,1],[0,1,1],[0,0,1]]'
            answer_contract: {"kind":"matrix","rows":3,"cols":3}
            solution_sketch: 'In an upper triangular matrix the entries below the main diagonal are $0$. The entries on or above the diagonal are all $1$, so row 1 is $(1, 1, 1)$, row 2 is $(0, 1, 1)$ and row 3 is $(0, 0, 1)$.'
          - problem: 'A $6\times 6$ matrix is upper triangular. How many of its $36$ entries must be $0$?'
            answer: '15'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The entries below the main diagonal must be $0$. Row 2 has $1$ such entry, row 3 has $2$, row 4 has $3$, row 5 has $4$ and row 6 has $5$, so there are $1 + 2 + 3 + 4 + 5 = 15$ entries. So $15$ entries must be $0$.'
        constraints: "sizes 2x2 to 6x6; unambiguous classifications; in-context items use cost and distance tables"
      - id: kp2
        name: Products of diagonal matrices
        key_prerequisites: [matrix-multiplication]
        exemplars:
          - problem: 'Compute $\begin{pmatrix}2&0\\0&-3\end{pmatrix}\begin{pmatrix}5&0\\0&4\end{pmatrix}$.'
            answer: '[[10,0],[0,-12]]'
            answer_contract: {"kind":"matrix","rows":2,"cols":2}
            solution_sketch: 'Both matrices are diagonal, so the product is diagonal and each diagonal entry is the product of the matching diagonal entries. The entries are $2 \cdot 5 = 10$ and $-3 \cdot 4 = -12$, and the other entries are $0$. The product is $\begin{pmatrix}10&0\\0&-12\end{pmatrix}$.'
          - problem: 'Compute $\begin{pmatrix}2&0&0\\0&-1&0\\0&0&4\end{pmatrix}\begin{pmatrix}3&0&0\\0&5&0\\0&0&-2\end{pmatrix}$.'
            answer: '[[6,0,0],[0,-5,0],[0,0,-8]]'
            answer_contract: {"kind":"matrix","rows":3,"cols":3}
            solution_sketch: 'Both matrices are diagonal, so the product is diagonal. The diagonal entries are $2 \cdot 3 = 6$, $-1 \cdot 5 = -5$ and $4 \cdot (-2) = -8$. The product is $\begin{pmatrix}6&0&0\\0&-5&0\\0&0&-8\end{pmatrix}$.'
          - problem: 'Compute $\begin{pmatrix}2&0\\0&5\end{pmatrix}\begin{pmatrix}1&3\\4&6\end{pmatrix}$.'
            answer: '[[2,6],[20,30]]'
            answer_contract: {"kind":"matrix","rows":2,"cols":2}
            solution_sketch: 'A diagonal matrix on the left scales the rows. Row 1 is $2$ times $(1, 3)$ and row 2 is $5$ times $(4, 6)$. The product is $\begin{pmatrix}2&6\\20&30\end{pmatrix}$.'
          - problem: 'Compute $\begin{pmatrix}2&-1\\3&1\end{pmatrix}\begin{pmatrix}4&0\\0&-1\end{pmatrix}$.'
            answer: '[[8,1],[12,-1]]'
            answer_contract: {"kind":"matrix","rows":2,"cols":2}
            solution_sketch: 'A diagonal matrix on the right scales the columns. Column 1 is $4$ times $(2, 3)$ and column 2 is $-1$ times $(-1, 1)$. The product is $\begin{pmatrix}8&1\\12&-1\end{pmatrix}$.'
          - problem: 'Compute $\begin{pmatrix}5&0\\0&5\end{pmatrix}\begin{pmatrix}2&-1\\0&3\end{pmatrix}$.'
            answer: '[[10,-5],[0,15]]'
            answer_contract: {"kind":"matrix","rows":2,"cols":2}
            solution_sketch: 'The matrix $5I$ acts like the number $5$, so it multiplies every entry of the other matrix by $5$. The entries are $5 \cdot 2 = 10$, $5 \cdot (-1) = -5$, $5 \cdot 0 = 0$ and $5 \cdot 3 = 15$. The product is $\begin{pmatrix}10&-5\\0&15\end{pmatrix}$.'
          - problem: 'An order list $A = \begin{pmatrix}3&2\\1&6\end{pmatrix}$ gives the numbers of two items (columns) in two orders (rows). Item 1 costs $4$ dollars and item 2 costs $5$ dollars, so the prices form the diagonal matrix $D = \begin{pmatrix}4&0\\0&5\end{pmatrix}$. Compute $AD$, which gives the amount paid for each item in each order.'
            answer: '[[12,10],[4,30]]'
            answer_contract: {"kind":"matrix","rows":2,"cols":2}
            solution_sketch: 'A diagonal matrix on the right multiplies column 1 by $4$ and column 2 by $5$. Row 1, column 1: $3 \cdot 4 + 2 \cdot 0 = 12$. Row 1, column 2: $3 \cdot 0 + 2 \cdot 5 = 10$. Row 2, column 1: $1 \cdot 4 + 6 \cdot 0 = 4$. Row 2, column 2: $1 \cdot 0 + 6 \cdot 5 = 30$. The amounts are $\begin{pmatrix}12&10\\4&30\end{pmatrix}$.'
          - problem: 'The matrix $R = \begin{pmatrix}18&35\\6&20\end{pmatrix}$ gives the amount in dollars paid for item 1 (first column) and item 2 (second column) in two orders (rows). Item 1 costs $3$ dollars and item 2 costs $5$ dollars per unit. Which matrix gives the number of units of each item in each order?'
            answer: '[[6,7],[2,4]]'
            answer_contract: {"kind":"matrix","rows":2,"cols":2}
            solution_sketch: 'Each amount is the number of units times the price, so we divide column 1 of $R$ by $3$ and column 2 by $5$. Column 1 is $18/3 = 6$ and $6/3 = 2$. Column 2 is $35/5 = 7$ and $20/5 = 4$. The units are $\begin{pmatrix}6&7\\2&4\end{pmatrix}$.'
          - problem: 'A matrix $A$ satisfies $A\begin{pmatrix}4&0\\0&5\end{pmatrix} = \begin{pmatrix}8&15\\12&20\end{pmatrix}$. Find $A$.'
            answer: '[[2,3],[3,4]]'
            answer_contract: {"kind":"matrix","rows":2,"cols":2}
            solution_sketch: 'A diagonal matrix on the right scales the columns, so we divide each column of the product by the diagonal entry. Column 1: $8/4 = 2$ and $12/4 = 3$. Column 2: $15/5 = 3$ and $20/5 = 4$. So $A = \begin{pmatrix}2&3\\3&4\end{pmatrix}$.'
          - problem: 'Compute $D^3$ for $D = \begin{pmatrix}2&0\\0&-3\end{pmatrix}$.'
            answer: '[[8,0],[0,-27]]'
            answer_contract: {"kind":"matrix","rows":2,"cols":2}
            solution_sketch: 'The power of a diagonal matrix is found by taking the power of each diagonal entry. We have $2^3 = 8$ and $(-3)^3 = -27$, and the other entries stay $0$. So $D^3 = \begin{pmatrix}8&0\\0&-27\end{pmatrix}$.'
          - problem: 'Sam computes $\begin{pmatrix}2&0\\0&3\end{pmatrix}\begin{pmatrix}1&4\\5&6\end{pmatrix}$ by scaling the columns, and writes $\begin{pmatrix}2&12\\5&18\end{pmatrix}$. What is the correct product?'
            answer: '[[2,8],[15,18]]'
            answer_contract: {"kind":"matrix","rows":2,"cols":2}
            solution_sketch: 'A diagonal matrix on the left scales the rows, not the columns. Row 1 is $2$ times $(1, 4)$ and row 2 is $3$ times $(5, 6)$. The correct product is $\begin{pmatrix}2&8\\15&18\end{pmatrix}$.'
        constraints: "small integer diagonals, 2x2 and 3x3; include a scalar matrix; in-context items use order and price tables with one division"
      - id: kp3
        name: Products of triangular matrices
        key_prerequisites: [matrix-multiplication]
        exemplars:
          - problem: 'Compute $\begin{pmatrix}1&3\\0&2\end{pmatrix}\begin{pmatrix}2&-1\\0&4\end{pmatrix}$.'
            answer: '[[2,11],[0,8]]'
            answer_contract: {"kind":"matrix","rows":2,"cols":2}
            solution_sketch: 'We dot the rows of the first matrix with the columns of the second. Row 1, column 1: $1 \cdot 2 + 3 \cdot 0 = 2$. Row 1, column 2: $1 \cdot (-1) + 3 \cdot 4 = 11$. Row 2, column 1: $0 \cdot 2 + 2 \cdot 0 = 0$. Row 2, column 2: $0 \cdot (-1) + 2 \cdot 4 = 8$. The product is $\begin{pmatrix}2&11\\0&8\end{pmatrix}$, which is upper triangular again.'
          - problem: 'Compute $\begin{pmatrix}2&0\\3&-1\end{pmatrix}\begin{pmatrix}1&0\\4&5\end{pmatrix}$.'
            answer: '[[2,0],[-1,-5]]'
            answer_contract: {"kind":"matrix","rows":2,"cols":2}
            solution_sketch: 'We dot the rows of the first matrix with the columns of the second. Row 1, column 1: $2 \cdot 1 + 0 \cdot 4 = 2$. Row 1, column 2: $2 \cdot 0 + 0 \cdot 5 = 0$. Row 2, column 1: $3 \cdot 1 + (-1) \cdot 4 = -1$. Row 2, column 2: $3 \cdot 0 + (-1) \cdot 5 = -5$. The product is $\begin{pmatrix}2&0\\-1&-5\end{pmatrix}$, which is lower triangular again.'
          - problem: 'Let $D = \begin{pmatrix}3&0\\0&-2\end{pmatrix}$ be diagonal and $U = \begin{pmatrix}1&2\\0&4\end{pmatrix}$ be upper triangular. Compute $DU$.'
            answer: '[[3,6],[0,-8]]'
            answer_contract: {"kind":"matrix","rows":2,"cols":2}
            solution_sketch: 'A diagonal matrix on the left scales the rows of $U$. Row 1 is $3$ times $(1, 2)$ and row 2 is $-2$ times $(0, 4)$. So $DU = \begin{pmatrix}3&6\\0&-8\end{pmatrix}$.'
          - problem: 'Compute $\begin{pmatrix}1&2&0\\0&3&1\\0&0&2\end{pmatrix}\begin{pmatrix}2&0&1\\0&1&4\\0&0&-1\end{pmatrix}$.'
            answer: '[[2,2,9],[0,3,11],[0,0,-2]]'
            answer_contract: {"kind":"matrix","rows":3,"cols":3}
            solution_sketch: 'We dot the rows of the first matrix with the columns of the second. Row 1, column 1: $1 \cdot 2 + 2 \cdot 0 + 0 \cdot 0 = 2$. Row 1, column 2: $1 \cdot 0 + 2 \cdot 1 + 0 \cdot 0 = 2$. Row 1, column 3: $1 \cdot 1 + 2 \cdot 4 + 0 \cdot (-1) = 9$. Row 2, column 1: $0 \cdot 2 + 3 \cdot 0 + 1 \cdot 0 = 0$. Row 2, column 2: $0 \cdot 0 + 3 \cdot 1 + 1 \cdot 0 = 3$. Row 2, column 3: $0 \cdot 1 + 3 \cdot 4 + 1 \cdot (-1) = 11$. Row 3, column 1: $0 \cdot 2 + 0 \cdot 0 + 2 \cdot 0 = 0$. Row 3, column 2: $0 \cdot 0 + 0 \cdot 1 + 2 \cdot 0 = 0$. Row 3, column 3: $0 \cdot 1 + 0 \cdot 4 + 2 \cdot (-1) = -2$. The product is $\begin{pmatrix}2&2&9\\0&3&11\\0&0&-2\end{pmatrix}$, which is upper triangular again.'
          - problem: 'Let $A = \begin{pmatrix}2&1\\0&-3\end{pmatrix}$ and $B = \begin{pmatrix}4&2\\0&5\end{pmatrix}$. What is the entry in row 2, column 2 of $AB$?'
            answer: '-15'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The entry is row 2 of $A$ dotted with column 2 of $B$. Row 2 of $A$ is $(0, -3)$ and column 2 of $B$ is $(2, 5)$, so the entry is $0 \cdot 2 + (-3) \cdot 5 = -15$. This is also the product of the diagonal entries $-3$ and $5$.'
          - problem: 'Let $A = \begin{pmatrix}1&2\\0&3\end{pmatrix}$ and $B = \begin{pmatrix}4&-1\\0&2\end{pmatrix}$. What is the entry in row 1, column 2 of $AB$?'
            answer: '3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The entry is row 1 of $A$ dotted with column 2 of $B$. Row 1 of $A$ is $(1, 2)$ and column 2 of $B$ is $(-1, 2)$, so the entry is $1 \cdot (-1) + 2 \cdot 2 = 3$.'
          - problem: 'Let $A = \begin{pmatrix}3&1\\0&-3\end{pmatrix}$. Compute $A^2$.'
            answer: '[[9,0],[0,9]]'
            answer_contract: {"kind":"matrix","rows":2,"cols":2}
            solution_sketch: 'We dot the rows of $A$ with the columns of $A$. Row 1, column 1: $3 \cdot 3 + 1 \cdot 0 = 9$. Row 1, column 2: $3 \cdot 1 + 1 \cdot (-3) = 0$. Row 2, column 1: $0 \cdot 3 + (-3) \cdot 0 = 0$. Row 2, column 2: $0 \cdot 1 + (-3) \cdot (-3) = 9$. So $A^2 = \begin{pmatrix}9&0\\0&9\end{pmatrix}$, which is even diagonal.'
          - problem: 'Is the product $\begin{pmatrix}1&2\\0&3\end{pmatrix}\begin{pmatrix}2&0\\1&1\end{pmatrix}$ an upper triangular matrix?'
            answer: 'no'
            answer_contract: {"kind":"label","options":[["yes","it is upper triangular","upper triangular"],["no","it is not upper triangular","not upper triangular"]]}
            solution_sketch: 'We dot rows with columns. Row 1, column 1: $1 \cdot 2 + 2 \cdot 1 = 4$. Row 1, column 2: $1 \cdot 0 + 2 \cdot 1 = 2$. Row 2, column 1: $0 \cdot 2 + 3 \cdot 1 = 3$. Row 2, column 2: $0 \cdot 0 + 3 \cdot 1 = 3$. The product is $\begin{pmatrix}4&2\\3&3\end{pmatrix}$, and the entry in row 2, column 1 is $3$, which is not $0$. So the product is not upper triangular.'
          - problem: 'In a factory, raw materials 1 and 2 are made into parts 1 and 2 by $M_1 = \begin{pmatrix}1&0\\2&3\end{pmatrix}$, where column $j$ lists the parts made from one unit of raw material $j$. The parts are then assembled into products 1 and 2 by $M_2 = \begin{pmatrix}2&0\\1&4\end{pmatrix}$, with the same column rule. Which matrix lists the products made from one unit of each raw material?'
            answer: '[[2,0],[9,12]]'
            answer_contract: {"kind":"matrix","rows":2,"cols":2}
            solution_sketch: 'Raw material first goes through $M_1$ and then through $M_2$, so a column of raw material $\mathbf{x}$ becomes $M_2(M_1\mathbf{x})$. The combined matrix is $M_2 M_1$, with the matrix used last on the left. Row 1, column 1: $2 \cdot 1 + 0 \cdot 2 = 2$. Row 1, column 2: $2 \cdot 0 + 0 \cdot 3 = 0$. Row 2, column 1: $1 \cdot 1 + 4 \cdot 2 = 9$. Row 2, column 2: $1 \cdot 0 + 4 \cdot 3 = 12$. The combined matrix is $\begin{pmatrix}2&0\\9&12\end{pmatrix}$, which is lower triangular.'
          - problem: 'In a second factory, raw materials 1 and 2 are made into parts 1 and 2 by $M_1 = \begin{pmatrix}2&0\\1&3\end{pmatrix}$, where column $j$ lists the parts made from one unit of raw material $j$. The parts are then assembled into products 1 and 2 by $M_2 = \begin{pmatrix}1&0\\4&2\end{pmatrix}$, with the same column rule. How many units of product 2 are made from one unit of raw material 1?'
            answer: '10'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The combined matrix is $M_2 M_1$, with the matrix used last on the left. The units of product 2 from one unit of raw material 1 form its entry in row 2, column 1, which is row 2 of $M_2$ dotted with column 1 of $M_1$: $4 \cdot 2 + 2 \cdot 1 = 10$.'
        constraints: "2x2 upper and lower triangular matrices with entries in -4..4, one 3x3 product; in-context items use two-stage production"
    diagnostic_exemplar:
      problem: 'Compute $\begin{pmatrix}2&5\\0&3\end{pmatrix}\begin{pmatrix}4&1\\0&2\end{pmatrix}$, and classify the result as diagonal, upper triangular, or lower triangular.'
      answer: '$\begin{pmatrix}8&12\\0&6\end{pmatrix}$; upper triangular (not diagonal)'
      answer_contract: {kind: none}
      solution_sketch: 'The product of upper triangular matrices is upper triangular, with diagonal entries $2\cdot4 = 8$ and $3\cdot2 = 6$.'
    anki_seeds:
      - front: 'How do two diagonal matrices multiply?'
        back: 'Entrywise along the diagonal; the product is again diagonal.'
        type: basic
      - front: 'A scalar matrix $cI$ multiplies any matrix like...'
        back: 'the scalar $c$: $(cI)A = cA$.'
        type: basic

  - id: matrix-operations
    name: Matrix Operations
    core: true
    difficulty: 0.55
    drill: false
    answer_kind: numeric
    expected_time_secs: 150
    prerequisites:
      - id: matrix-multiplication
        weight: 0.8
        key: true
      - id: matrix-addition-scalar-multiplication
        weight: 0.6
        key: true
      - id: identity-zero-matrices
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: Combined matrix expressions
        key_prerequisites: [matrix-multiplication, matrix-addition-scalar-multiplication]
        exemplars:
          - problem: 'Compute $A(B + C)$ for $A = \begin{pmatrix}1&1\\0&1\end{pmatrix}$, $B = \begin{pmatrix}1&0\\2&1\end{pmatrix}$, $C = \begin{pmatrix}0&2\\1&0\end{pmatrix}$.'
            answer: '[[4,3],[3,1]]'
            answer_contract: {"kind": "matrix", "rows": 2, "cols": 2}
            solution_sketch: 'First add inside the parentheses: $B + C = \begin{pmatrix}1&2\\3&1\end{pmatrix}$. Then multiply $A$ by this sum, taking each row of $A$ against each column of $B + C$. The result is $\begin{pmatrix}4&3\\3&1\end{pmatrix}$.'
          - problem: 'Compute $2AB - C$ for $A = \begin{pmatrix}1&0\\2&1\end{pmatrix}$, $B = \begin{pmatrix}3&1\\0&2\end{pmatrix}$, $C = \begin{pmatrix}1&1\\1&1\end{pmatrix}$.'
            answer: '[[5,1],[11,7]]'
            answer_contract: {"kind": "matrix", "rows": 2, "cols": 2}
            solution_sketch: 'The product comes first: $AB = \begin{pmatrix}3&1\\6&4\end{pmatrix}$. Doubling gives $\begin{pmatrix}6&2\\12&8\end{pmatrix}$, and subtracting $C$ entry by entry gives $\begin{pmatrix}5&1\\11&7\end{pmatrix}$.'
          - problem: 'A bakery has two shops. In week 1 the numbers of loaves and rolls sold, in hundreds, are the rows of $W_1 = \begin{pmatrix}24&10\\16&8\end{pmatrix}$ (one row per shop). In week 2 they are $W_2 = \begin{pmatrix}20&6\\10&12\end{pmatrix}$. Find the matrix of the mean weekly sales over the two weeks.'
            answer: '[[22,8],[13,10]]'
            answer_contract: {"kind": "matrix", "rows": 2, "cols": 2}
            solution_sketch: 'The two-week total is $W_1 + W_2 = \begin{pmatrix}44&16\\26&20\end{pmatrix}$. A mean over two weeks divides the total by $2$, so every entry is halved. The result is $\begin{pmatrix}22&8\\13&10\end{pmatrix}$.'
          - problem: 'Compute $(A + B)C$ for $A = \begin{pmatrix}1&0\\2&1\end{pmatrix}$, $B = \begin{pmatrix}0&1\\1&0\end{pmatrix}$, $C = \begin{pmatrix}2&3\\1&1\end{pmatrix}$.'
            answer: '[[3,4],[7,10]]'
            answer_contract: {"kind": "matrix", "rows": 2, "cols": 2}
            solution_sketch: 'Add inside the parentheses first: $A + B = \begin{pmatrix}1&1\\3&1\end{pmatrix}$. Then multiply by $C$ on the right. The result is $\begin{pmatrix}3&4\\7&10\end{pmatrix}$.'
          - problem: 'Two cafes order cups and plates. The matrix $Q = \begin{pmatrix}3&2\\1&4\end{pmatrix}$ has one row per cafe; its columns give the numbers of cups and of plates ordered, in dozens. The column $P = \begin{pmatrix}5\\2\end{pmatrix}$ gives the price in dollars of one dozen cups and one dozen plates. Each cafe also pays a delivery fee, $F = \begin{pmatrix}6\\6\end{pmatrix}$. Find the matrix $QP + F$ of the total bills.'
            answer: '[[25],[19]]'
            answer_contract: {"kind": "matrix", "rows": 2, "cols": 1}
            solution_sketch: 'The product $QP = \begin{pmatrix}19\\13\end{pmatrix}$ gives the cost of the goods for each cafe. Adding the fees entry by entry gives the total bills $\begin{pmatrix}25\\19\end{pmatrix}$.'
          - problem: 'Sam computes $A(B + C)$ for $A = \begin{pmatrix}2&1\\0&3\end{pmatrix}$, $B = \begin{pmatrix}1&2\\1&0\end{pmatrix}$, $C = \begin{pmatrix}1&1\\2&0\end{pmatrix}$ as $AB + C$. What is the correct value of $A(B + C)$?'
            answer: '[[7,6],[9,0]]'
            answer_contract: {"kind": "matrix", "rows": 2, "cols": 2}
            solution_sketch: 'The factor $A$ multiplies both $B$ and $C$, so $A(B + C) = AB + AC$, not $AB + C$. Here $B + C = \begin{pmatrix}2&3\\3&0\end{pmatrix}$, and multiplying by $A$ gives $\begin{pmatrix}7&6\\9&0\end{pmatrix}$. Sam left $C$ unmultiplied and got $\begin{pmatrix}4&5\\5&0\end{pmatrix}$.'
          - problem: 'A pharmacy records the boxes of two medicines dispensed at two counters in each of three months: $J = \begin{pmatrix}9&3\\6&12\end{pmatrix}$, $K = \begin{pmatrix}3&6\\9&3\end{pmatrix}$ and $L = \begin{pmatrix}6&3\\3&9\end{pmatrix}$. Find the matrix of the mean monthly numbers.'
            answer: '[[6,4],[6,8]]'
            answer_contract: {"kind": "matrix", "rows": 2, "cols": 2}
            solution_sketch: 'The three-month total is $J + K + L = \begin{pmatrix}18&12\\18&24\end{pmatrix}$. A mean over three months divides the total by $3$, so every entry is divided by $3$. The result is $\begin{pmatrix}6&4\\6&8\end{pmatrix}$.'
          - problem: 'Compute $AB - 2C$ for $A = \begin{pmatrix}1&1\\2&0\end{pmatrix}$, $B = \begin{pmatrix}1&2\\3&1\end{pmatrix}$, $C = \begin{pmatrix}0&1\\1&0\end{pmatrix}$.'
            answer: '[[4,1],[0,4]]'
            answer_contract: {"kind": "matrix", "rows": 2, "cols": 2}
            solution_sketch: 'Multiply first: $AB = \begin{pmatrix}4&3\\2&4\end{pmatrix}$. Then $2C = \begin{pmatrix}0&2\\2&0\end{pmatrix}$, and subtracting entry by entry gives $\begin{pmatrix}4&1\\0&4\end{pmatrix}$.'
          - problem: 'Compute $AB + BC$ for $A = \begin{pmatrix}2&1\\1&3\end{pmatrix}$, $B = \begin{pmatrix}1&0\\2&1\end{pmatrix}$, $C = \begin{pmatrix}1&2\\0&1\end{pmatrix}$.'
            answer: '[[5,3],[9,8]]'
            answer_contract: {"kind": "matrix", "rows": 2, "cols": 2}
            solution_sketch: 'The two products are $AB = \begin{pmatrix}4&1\\7&3\end{pmatrix}$ and $BC = \begin{pmatrix}1&2\\2&5\end{pmatrix}$, each with its factors in the given order. Adding entry by entry gives $\begin{pmatrix}5&3\\9&8\end{pmatrix}$.'
        constraints: '2x2 matrices with small integer entries; at most three matrices per expression; contexts with a mean over weeks or months and a bill QP + F'
      - id: kp2
        name: Non-commutativity
        key_prerequisites: [matrix-multiplication]
        try_first:
          problem: 'Let $A = \begin{pmatrix}2&1\\0&1\end{pmatrix}$ and $B = \begin{pmatrix}1&1\\0&2\end{pmatrix}$. By how much does the entry in row 1, column 2 of $AB$ exceed the same entry of $BA$?'
          answer_contract: {"kind": "exact"}
          answer: '2'
          reveal: 'The two entries are $4$ and $2$, so the products $AB$ and $BA$ differ. Order matters in matrix multiplication, so a product of sums must be expanded with the factors kept in order.'
        exemplars:
          - problem: 'Let $A = \begin{pmatrix}1&1\\0&1\end{pmatrix}$ and $B = \begin{pmatrix}1&0\\1&1\end{pmatrix}$. Compute $AB - BA$.'
            answer: '[[1,0],[0,-1]]'
            answer_contract: {"kind": "matrix", "rows": 2, "cols": 2}
            solution_sketch: 'Multiplying in the two orders gives $AB = \begin{pmatrix}2&1\\1&1\end{pmatrix}$ and $BA = \begin{pmatrix}1&1\\1&2\end{pmatrix}$. The two products differ, and subtracting entry by entry gives $\begin{pmatrix}1&0\\0&-1\end{pmatrix}$.'
          - problem: 'Sam expands $(A + B)^2$ as $A^2 + 2AB + B^2$. Take $A = \begin{pmatrix}0&2\\0&0\end{pmatrix}$ and $B = \begin{pmatrix}0&0\\3&0\end{pmatrix}$. By what matrix does $(A + B)^2$ differ from Sam''s result, that is, what is $(A + B)^2 - (A^2 + 2AB + B^2)$?'
            answer: '[[-6,0],[0,6]]'
            answer_contract: {"kind": "matrix", "rows": 2, "cols": 2}
            solution_sketch: 'The correct expansion keeps the order: $(A + B)^2 = A^2 + AB + BA + B^2$. Here $AB = \begin{pmatrix}6&0\\0&0\end{pmatrix}$ and $BA = \begin{pmatrix}0&0\\0&6\end{pmatrix}$, so the difference from Sam''s result is $BA - AB = \begin{pmatrix}-6&0\\0&6\end{pmatrix}$.'
          - problem: 'Let $A = \begin{pmatrix}2&1\\0&2\end{pmatrix}$ and $B = \begin{pmatrix}3&4\\0&3\end{pmatrix}$. Is $AB = BA$?'
            answer: 'yes'
            answer_contract: {"kind": "label", "options": [["yes", "yes, they are equal", "they are equal", "equal", "yes, they commute", "they commute", "AB = BA"], ["no", "no, they are not equal", "they are not equal", "not equal", "no, they do not commute", "they do not commute", "AB is not BA"]]}
            solution_sketch: 'Compute both products: $AB = \begin{pmatrix}6&11\\0&6\end{pmatrix}$ and $BA = \begin{pmatrix}6&11\\0&6\end{pmatrix}$. The two matrices are equal, so these particular matrices commute. Most pairs of matrices do not commute, so this has to be checked entry by entry.'
          - problem: 'Let $P = \begin{pmatrix}0&1\\1&0\end{pmatrix}$ and $M = \begin{pmatrix}1&2\\3&4\end{pmatrix}$. Compute $PM$.'
            answer: '[[3,4],[1,2]]'
            answer_contract: {"kind": "matrix", "rows": 2, "cols": 2}
            solution_sketch: 'Multiplying $M$ on the left by $P$ swaps the rows of $M$, so $PM = \begin{pmatrix}3&4\\1&2\end{pmatrix}$. Multiplying on the right instead gives $MP = \begin{pmatrix}2&1\\4&3\end{pmatrix}$, which swaps the columns, so the order matters.'
          - problem: 'A drawing program moves the point $(2, 1)$ in two steps. It first applies the shear $S = \begin{pmatrix}1&1\\0&1\end{pmatrix}$ and then the reflection $R = \begin{pmatrix}0&1\\1&0\end{pmatrix}$, each acting on the column of coordinates. Where does the point end up?'
            answer: '(1, 3)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'After the shear the point is $S(2, 1) = (3, 1)$. The reflection swaps the coordinates, so the point ends at $(1, 3)$. The single matrix that does both steps is $RS = \begin{pmatrix}0&1\\1&1\end{pmatrix}$.'
          - problem: 'Using the same shear $S = \begin{pmatrix}1&1\\0&1\end{pmatrix}$ and reflection $R = \begin{pmatrix}0&1\\1&0\end{pmatrix}$, the program now applies $R$ first and then $S$ to the point $(2, 1)$. Where does the point end up?'
            answer: '(3, 2)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'After the reflection the point is $R(2, 1) = (1, 2)$. The shear then gives $S(1, 2) = (3, 2)$. This differs from the other order because $SR = \begin{pmatrix}1&1\\1&0\end{pmatrix}$ is not equal to $RS = \begin{pmatrix}0&1\\1&1\end{pmatrix}$.'
          - problem: 'Let $A = \begin{pmatrix}1&1\\1&1\end{pmatrix}$ and $B = \begin{pmatrix}1&1\\-1&-1\end{pmatrix}$. Neither matrix is the zero matrix, yet $AB$ is the zero matrix. Compute $BA$.'
            answer: '[[2,2],[-2,-2]]'
            answer_contract: {"kind": "matrix", "rows": 2, "cols": 2}
            solution_sketch: 'Every entry of $AB$ is $1 - 1 = 0$, so $AB$ is the zero matrix although neither factor is zero. In the other order, $BA = \begin{pmatrix}2&2\\-2&-2\end{pmatrix}$, which is not the zero matrix, so the order of the factors changes the result.'
          - problem: '$A$ and $B$ are square matrices with $AB \neq BA$. When $(A + B)^3 = (A + B)(A + B)(A + B)$ is expanded, each factor contributes either $A$ or $B$, and products with different orders such as $ABA$ and $AAB$ stay separate. How many products does the expansion contain?'
            answer: '8'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Each of the three factors contributes either $A$ or $B$, so there are $2 \cdot 2 \cdot 2 = 8$ ordered products. The products $A^3$, $AAB$, $ABA$, $ABB$, $BAA$, $BAB$, $BBA$ and $BBB$ stay separate when $AB \neq BA$.'
        constraints: '2x2 matrices with small integer entries; concrete counterexamples, point transformations applied in both orders, and one symbolic count of ordered products'
      - id: kp3
        name: Sizes and definedness in expressions
        key_prerequisites: [matrix-multiplication, matrix-addition-scalar-multiplication]
        exemplars:
          - problem: 'Let $A$ be a $4 \times 2$ matrix and $B$ a $2 \times 3$ matrix. The product $AB$ is an $m \times n$ matrix. What is the pair $(m, n)$?'
            answer: '(4, 3)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'The inner sizes are $2$ and $2$, so the product is defined. The product has the rows of $A$ and the columns of $B$, so $AB$ is $4 \times 3$ and $(m, n) = (4, 3)$.'
          - problem: 'Let $A$ and $B$ both be $3 \times 2$ matrices. Can the product $AB$ be formed?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "yes, it can", "it can be formed", "yes, it is defined", "yes, it is", "it is defined", "defined"], ["no", "no, it cannot", "it cannot be formed", "no, it is not defined", "no, it is not", "it is not defined", "not defined", "undefined"]]}
            solution_sketch: 'The product needs the number of columns of $A$ to equal the number of rows of $B$. Here $A$ has $2$ columns and $B$ has $3$ rows, so the product $AB$ is not defined.'
          - problem: 'Let $A$ be a $3 \times 4$ matrix. The product $AB$ is defined and is a $3 \times 5$ matrix. If $B$ is a $p \times q$ matrix, what is the pair $(p, q)$?'
            answer: '(4, 5)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'The inner sizes of a product must match, so the rows of $B$ equal the columns of $A$ and $p = 4$. The $5$ columns of $AB$ are the columns of $B$, so $q = 5$ and $(p, q) = (4, 5)$.'
          - problem: 'Let $A$ be $2 \times 3$, $B$ be $3 \times 4$ and $C$ be $4 \times 5$. The product $ABC$ is an $m \times n$ matrix. What is the pair $(m, n)$?'
            answer: '(2, 5)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'Work from the left. $AB$ is $2 \times 4$ and then $(AB)C$ is $2 \times 5$, because each inner pair of sizes matches. So $(m, n) = (2, 5)$.'
          - problem: 'A shop has $4$ stores and sells $3$ items. The matrix $S$ has one row per store and one column per item, so it is $4 \times 3$. The column $P$ gives the price of each item, so it is $3 \times 1$. The owner wants the total takings of every store. Is the product $SP$ defined?'
            answer: 'yes'
            answer_contract: {"kind": "label", "options": [["yes", "yes, it is defined", "yes, it is", "it is defined", "defined", "yes, it can be formed"], ["no", "no, it is not defined", "no, it is not", "it is not defined", "not defined", "undefined"]]}
            solution_sketch: 'The columns of $S$ number $3$ and the rows of $P$ number $3$, so the inner sizes match. The product $SP$ is defined and is $4 \times 1$, one total for each store.'
          - problem: 'A teacher stores the marks of $6$ students on $4$ tests in a matrix $G$ with one row per student. A column $w$ holds the weight of each test. How many numbers does the product $Gw$ contain?'
            answer: '6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The matrix $G$ is $6 \times 4$ and $w$ is $4 \times 1$, so the product is defined and is $6 \times 1$. It contains one weighted total for each student, which is $6$ numbers.'
          - problem: 'Let $A$ be a $2 \times 3$ matrix and $B$ a $3 \times 2$ matrix. How many entries does $BA$ have?'
            answer: '9'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The inner sizes of $BA$ are $2$ and $2$, so the product is defined. $B$ has $3$ rows and $A$ has $3$ columns, so $BA$ is $3 \times 3$ and has $9$ entries.'
          - problem: 'Let $A$ be a $3 \times 4$ matrix and $I$ the $4 \times 4$ identity matrix. How many columns does $AI$ have?'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The inner sizes $4$ and $4$ match. The product has the rows of $A$ and the columns of $I$, so $AI$ is $3 \times 4$ and has $4$ columns.'
          - problem: 'Let $A$ be a $4 \times 2$ matrix and $B$ a $2 \times 4$ matrix. How many more entries does $AB$ have than $BA$?'
            answer: '12'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The product $AB$ is $4 \times 4$, so it has $16$ entries. The product $BA$ is $2 \times 2$, so it has $4$ entries. The difference is $16 - 4 = 12$ entries.'
        constraints: 'sizes up to 6x5; the questions ask for one size pair (m, n), one count or one verdict'
    diagnostic_exemplar:
      problem: 'For $A = \begin{pmatrix}1&2\\0&1\end{pmatrix}$ and $B = \begin{pmatrix}2&0\\1&1\end{pmatrix}$, compute $AB - BA$.'
      answer: "[2,-2;0,-2]"
      answer_contract: {"cols":2,"kind":"matrix","rows":2}
      solution_sketch: '$AB = \begin{pmatrix}4&2\\1&1\end{pmatrix}$, $BA = \begin{pmatrix}2&4\\1&3\end{pmatrix}$; subtract entrywise.'
    anki_seeds:
      - front: 'Is matrix multiplication commutative?'
        back: 'No; $AB \neq BA$ in general (even when both are defined).'
        type: basic
      - front: 'Distributive law for matrices?'
        back: '$A(B + C) = AB + AC$ (and $(B + C)A = BA + CA$).'
        type: basic

  - id: matrix-powers
    name: Matrix Powers
    core: true
    difficulty: 0.6
    drill: false
    answer_kind: numeric
    expected_time_secs: 120
    prerequisites:
      - id: matrix-multiplication
        weight: 0.7
        key: true
      - id: matrix-operations
        weight: 0.4
      - id: diagonal-triangular-matrices
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: Squares and cubes
        key_prerequisites: [matrix-multiplication]
        exemplars:
          - problem: 'Compute $A^2$ for $A = \begin{pmatrix}2&1\\1&0\end{pmatrix}$.'
            answer: '[[5,2],[2,1]]'
            answer_contract: {"kind": "matrix", "rows": 2, "cols": 2}
            solution_sketch: 'The square is $A \cdot A$. Each entry is a row of the left factor times a column of the right factor: row 1 gives $(4 + 1, 2 + 0)$ and row 2 gives $(2 + 0, 1 + 0)$. So $A^2 = \begin{pmatrix}5&2\\2&1\end{pmatrix}$.'
          - problem: 'Compute $A^3$ for $A = \begin{pmatrix}1&1\\1&0\end{pmatrix}$.'
            answer: '[[3,2],[2,1]]'
            answer_contract: {"kind": "matrix", "rows": 2, "cols": 2}
            solution_sketch: 'First $A^2 = \begin{pmatrix}2&1\\1&1\end{pmatrix}$. Then $A^3 = A^2 A = \begin{pmatrix}3&2\\2&1\end{pmatrix}$, by multiplying each row of $A^2$ with each column of $A$.'
          - problem: 'Two towns are joined by one-way roads. The matrix $R = \begin{pmatrix}0&1\\1&1\end{pmatrix}$ has the entry $r_{ij}$ equal to the number of roads from town $i$ to town $j$. A trip uses two roads in a row, and the entry $(i, j)$ of $R^2$ counts such trips from town $i$ to town $j$. How many two-road trips are there from town $2$ back to town $2$?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The matrix $R^2 = \begin{pmatrix}1&1\\1&2\end{pmatrix}$ counts the trips with two roads. Its entry in row 2, column 2 is $1 \cdot 1 + 1 \cdot 1 = 2$.'
          - problem: 'A population has adults and juveniles. Each year the pair (adults, juveniles) is replaced by $L$ times the column of counts, where $L = \begin{pmatrix}1&1\\1&0\end{pmatrix}$. The population starts as $(1, 0)$, in thousands. What is the pair after $3$ years?'
            answer: '(3, 2)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'After one year the pair is $L(1, 0) = (1, 1)$. Three years apply $L$ three times, which is $L^3 = \begin{pmatrix}3&2\\2&1\end{pmatrix}$. So the pair is $L^3(1, 0) = (3, 2)$.'
          - problem: 'Sam squares the matrix $A = \begin{pmatrix}2&3\\1&4\end{pmatrix}$ by squaring each entry and writes $\begin{pmatrix}4&9\\1&16\end{pmatrix}$. What is the correct value of $A^2$?'
            answer: '[[7,18],[6,19]]'
            answer_contract: {"kind": "matrix", "rows": 2, "cols": 2}
            solution_sketch: 'The square $A^2$ means $A \cdot A$, which is a row-by-column product, not the squares of the entries. Row 1 gives $(2 \cdot 2 + 3 \cdot 1, 2 \cdot 3 + 3 \cdot 4)$ and row 2 gives $(1 \cdot 2 + 4 \cdot 1, 1 \cdot 3 + 4 \cdot 4)$. So $A^2 = \begin{pmatrix}7&18\\6&19\end{pmatrix}$.'
          - problem: 'Compute $A^2$ for $A = \begin{pmatrix}1&-2\\3&0\end{pmatrix}$.'
            answer: '[[-5,-2],[3,-6]]'
            answer_contract: {"kind": "matrix", "rows": 2, "cols": 2}
            solution_sketch: 'Multiply $A$ by itself. Row 1 gives $(1 - 6, -2 + 0)$ and row 2 gives $(3 + 0, -6 + 0)$. So $A^2 = \begin{pmatrix}-5&-2\\3&-6\end{pmatrix}$.'
          - problem: 'Compute $A^3$ for $A = \begin{pmatrix}2&1\\0&1\end{pmatrix}$.'
            answer: '[[8,7],[0,1]]'
            answer_contract: {"kind": "matrix", "rows": 2, "cols": 2}
            solution_sketch: 'First $A^2 = \begin{pmatrix}4&3\\0&1\end{pmatrix}$. Multiplying by $A$ once more gives $A^3 = \begin{pmatrix}8&7\\0&1\end{pmatrix}$.'
          - problem: 'Compute $A^2$ for $A = \begin{pmatrix}0&1&0\\0&0&1\\1&0&0\end{pmatrix}$.'
            answer: '[[0,0,1],[1,0,0],[0,1,0]]'
            answer_contract: {"kind": "matrix", "rows": 3, "cols": 3}
            solution_sketch: 'Row 1 of $A$ has its $1$ in column 2, so row 1 of $A^2$ is row 2 of $A$, which has its $1$ in column 3. The other rows follow in the same way, and the result is $A^2 = \begin{pmatrix}0&0&1\\1&0&0\\0&1&0\end{pmatrix}$.'
        constraints: '2x2 matrices with entries in -3..3, one 3x3 permutation matrix; powers up to 3; contexts with road counts and a population step'
      - id: kp2
        name: Powers of diagonal matrices
        key_prerequisites: [diagonal-triangular-matrices, matrix-multiplication]
        exemplars:
          - problem: 'Compute $D^3$ for $D = \begin{pmatrix}2&0\\0&3\end{pmatrix}$.'
            answer: '[[8,0],[0,27]]'
            answer_contract: {"kind": "matrix", "rows": 2, "cols": 2}
            solution_sketch: 'A power of a diagonal matrix raises each diagonal entry to that power and keeps the zeros off the diagonal. So $D^3$ has the entries $2^3 = 8$ and $3^3 = 27$, and $D^3 = \begin{pmatrix}8&0\\0&27\end{pmatrix}$.'
          - problem: 'Compute $D^4$ for $D = \begin{pmatrix}3&0\\0&-2\end{pmatrix}$.'
            answer: '[[81,0],[0,16]]'
            answer_contract: {"kind": "matrix", "rows": 2, "cols": 2}
            solution_sketch: 'The power of a diagonal matrix raises each diagonal entry to the power. Here $3^4 = 81$ and $(-2)^4 = 16$, since an even power removes the sign. So $D^4 = \begin{pmatrix}81&0\\0&16\end{pmatrix}$.'
          - problem: 'A transformation with matrix $D = \begin{pmatrix}2&0\\0&-1\end{pmatrix}$ is applied three times in a row to the point $(1, 5)$. Where does the point end up?'
            answer: '(8, -5)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'Applying $D$ three times is multiplying by $D^3 = \begin{pmatrix}8&0\\0&-1\end{pmatrix}$. Then $D^3(1, 5) = (8 \cdot 1, (-1) \cdot 5) = (8, -5)$.'
          - problem: 'Let $D = \begin{pmatrix}-2&0\\0&3\end{pmatrix}$. What is the entry in row 2, column 2 of $D^4$?'
            answer: '81'
            answer_contract: {"kind": "exact"}
            solution_sketch: '$D$ is diagonal, so $D^4 = \begin{pmatrix}16&0\\0&81\end{pmatrix}$. The entry in row 2, column 2 is $3^4 = 81$.'
          - problem: 'Sam computes $D^3$ for $D = \begin{pmatrix}2&0\\0&5\end{pmatrix}$ by multiplying each diagonal entry by $3$ and writes $\begin{pmatrix}6&0\\0&15\end{pmatrix}$. What is the correct value of $D^3$?'
            answer: '[[8,0],[0,125]]'
            answer_contract: {"kind": "matrix", "rows": 2, "cols": 2}
            solution_sketch: 'The exponent $3$ means three factors of $D$, so each diagonal entry is multiplied by itself three times, not by $3$. This gives $2^3 = 8$ and $5^3 = 125$, so $D^3 = \begin{pmatrix}8&0\\0&125\end{pmatrix}$.'
          - problem: 'Two bacterial cultures are counted each day as a pair $(x, y)$, and the pair of the next day is $D$ times the column of counts, where $D = \begin{pmatrix}2&0\\0&3\end{pmatrix}$. The pair on day $0$ is $(3, 1)$, in thousands. After how many days is the first count $96$ thousand?'
            answer: '5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'After $n$ days the pair is $D^n(3, 1) = (3 \cdot 2^n, 3^n)$, because $D$ is diagonal. Setting $3 \cdot 2^n = 96$ gives $2^n = 32$, so $n = 5$.'
          - problem: 'Let $D = \begin{pmatrix}-1&0\\0&1\end{pmatrix}$. Compute $D^4$.'
            answer: '[[1,0],[0,1]]'
            answer_contract: {"kind": "matrix", "rows": 2, "cols": 2}
            solution_sketch: 'The diagonal entries are raised to the power $4$: $(-1)^4 = 1$ and $1^4 = 1$. So $D^4$ is the identity matrix $\begin{pmatrix}1&0\\0&1\end{pmatrix}$.'
          - problem: 'Compute $D^3$ for $D = \begin{pmatrix}-1&0\\0&-3\end{pmatrix}$.'
            answer: '[[-1,0],[0,-27]]'
            answer_contract: {"kind": "matrix", "rows": 2, "cols": 2}
            solution_sketch: 'Each diagonal entry is cubed: $(-1)^3 = -1$ and $(-3)^3 = -27$, since an odd power keeps the sign. So $D^3 = \begin{pmatrix}-1&0\\0&-27\end{pmatrix}$.'
          - problem: 'Compute $D^3$ for $D = \begin{pmatrix}2&0&0\\0&-1&0\\0&0&3\end{pmatrix}$.'
            answer: '[[8,0,0],[0,-1,0],[0,0,27]]'
            answer_contract: {"kind": "matrix", "rows": 3, "cols": 3}
            solution_sketch: 'The matrix is diagonal, so $D^3$ cubes each diagonal entry: $2^3 = 8$, $(-1)^3 = -1$ and $3^3 = 27$. The off-diagonal entries stay $0$, so $D^3 = \begin{pmatrix}8&0&0\\0&-1&0\\0&0&27\end{pmatrix}$.'
        constraints: 'diagonal matrices of size 2x2 and 3x3 with entries in -3..3; exponents up to 5; contexts that apply a diagonal matrix repeatedly'
      - id: kp3
        name: Power patterns
        key_prerequisites: [matrix-multiplication, matrix-operations]
        try_first:
          problem: 'Let $A = \begin{pmatrix}1&4\\0&1\end{pmatrix}$. What is the entry in row 1, column 2 of $A^{10}$?'
          answer_contract: {"kind": "exact"}
          answer: '40'
          reveal: 'Each extra factor of $A$ adds $4$ to the top-right entry, so $A^n$ has the top-right entry $4n$. Writing the first two or three powers and reading off the pattern is faster than multiplying ten times.'
        exemplars:
          - problem: 'Let $A = \begin{pmatrix}1&3\\0&1\end{pmatrix}$. What is the entry in row 1, column 2 of $A^{10}$?'
            answer: '30'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Compute $A^2 = \begin{pmatrix}1&6\\0&1\end{pmatrix}$ and $A^3 = \begin{pmatrix}1&9\\0&1\end{pmatrix}$. Each extra factor of $A$ adds $3$ to the top-right entry and leaves the other entries unchanged, so $A^n$ has the top-right entry $3n$. For $n = 10$ this is $30$.'
          - problem: 'Let $B = \begin{pmatrix}0&1\\-1&0\end{pmatrix}$. Compute $B^6$.'
            answer: '[[-1,0],[0,-1]]'
            answer_contract: {"kind": "matrix", "rows": 2, "cols": 2}
            solution_sketch: 'Compute $B^2 = \begin{pmatrix}-1&0\\0&-1\end{pmatrix}$, which is $-I$. Then $B^6 = (B^2)^3 = (-I)^3 = -I$, so $B^6 = \begin{pmatrix}-1&0\\0&-1\end{pmatrix}$.'
          - problem: 'Let $P = \begin{pmatrix}1&1\\0&0\end{pmatrix}$. Compute $P^5$.'
            answer: '[[1,1],[0,0]]'
            answer_contract: {"kind": "matrix", "rows": 2, "cols": 2}
            solution_sketch: 'The square is $P^2 = \begin{pmatrix}1&1\\0&0\end{pmatrix}$, which equals $P$. Multiplying by $P$ again changes nothing, so every higher power equals $P$ and $P^5 = \begin{pmatrix}1&1\\0&0\end{pmatrix}$.'
          - problem: 'Let $N = \begin{pmatrix}0&1\\0&0\end{pmatrix}$. Compute $N^{10}$.'
            answer: '[[0,0],[0,0]]'
            answer_contract: {"kind": "matrix", "rows": 2, "cols": 2}
            solution_sketch: 'The square is $N^2 = \begin{pmatrix}0&0\\0&0\end{pmatrix}$, the zero matrix. Every higher power is the zero matrix times a product of $N$, which is zero again, so $N^{10} = \begin{pmatrix}0&0\\0&0\end{pmatrix}$.'
          - problem: 'Let $M = \begin{pmatrix}3&4\\4&-3\end{pmatrix}$. Compute $M^4$.'
            answer: '[[625,0],[0,625]]'
            answer_contract: {"kind": "matrix", "rows": 2, "cols": 2}
            solution_sketch: 'The square is $M^2 = \begin{pmatrix}25&0\\0&25\end{pmatrix}$, which is $25I$. Then $M^4 = (M^2)^2 = 625I$, so $M^4 = \begin{pmatrix}625&0\\0&625\end{pmatrix}$.'
          - problem: 'A machine swaps the two coordinates of a point: it replaces $(x, y)$ with $(y, x)$, which is multiplication by $S = \begin{pmatrix}0&1\\1&0\end{pmatrix}$. The point $(3, 8)$ goes through the machine $75$ times. Where is the point at the end?'
            answer: '(8, 3)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'The square is $S^2 = \begin{pmatrix}1&0\\0&1\end{pmatrix}$, the identity, so the powers of $S$ alternate between $S$ and $I$. An odd power equals $S$, so $S^{75} = S$ and the point is $(8, 3)$, the swap of $(3, 8)$.'
          - problem: 'A game turns a figure by a quarter turn each move, which is multiplication by $R = \begin{pmatrix}0&-1\\1&0\end{pmatrix}$. What is the smallest number of moves after which every point is back where it started?'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The powers are $R^2 = \begin{pmatrix}-1&0\\0&-1\end{pmatrix}$ and $R^3 = \begin{pmatrix}0&1\\-1&0\end{pmatrix}$, and neither is the identity. The fourth power is $R^4 = \begin{pmatrix}1&0\\0&1\end{pmatrix}$, the identity, so the smallest number of moves is $4$.'
          - problem: 'Let $A = \begin{pmatrix}1&2\\0&1\end{pmatrix}$. For which power $n$ does $A^n$ have $18$ in row 1, column 2?'
            answer: '9'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The powers are $A^2 = \begin{pmatrix}1&4\\0&1\end{pmatrix}$ and $A^3 = \begin{pmatrix}1&6\\0&1\end{pmatrix}$, so $A^n$ has the top-right entry $2n$. Solving $2n = 18$ gives $n = 9$.'
          - problem: 'Let $A = \begin{pmatrix}1&1\\0&1\end{pmatrix}$. Compute $A^5$.'
            answer: '[[1,5],[0,1]]'
            answer_contract: {"kind": "matrix", "rows": 2, "cols": 2}
            solution_sketch: 'Each extra factor of $A$ adds $1$ to the top-right entry, so the pattern is $A^n = \begin{pmatrix}1&n\\0&1\end{pmatrix}$. For $n = 5$ the result is $\begin{pmatrix}1&5\\0&1\end{pmatrix}$.'
        constraints: 'patterns that show after computing two or three powers: shears, quarter turns, swaps, idempotent and nilpotent matrices'
    diagnostic_exemplar:
      problem: 'For $A = \begin{pmatrix}1&2\\0&1\end{pmatrix}$, compute $A^2$ and $A^3$, then give a formula for $A^n$.'
      answer: '$A^2 = \begin{pmatrix}1&4\\0&1\end{pmatrix}$, $A^3 = \begin{pmatrix}1&6\\0&1\end{pmatrix}$, $A^n = \begin{pmatrix}1&2n\\0&1\end{pmatrix}$'
      answer_contract: {kind: none}
      solution_sketch: 'Each multiplication by $A$ adds $2$ to the top-right entry and leaves the rest fixed.'
    anki_seeds:
      - front: '$A^n$ makes sense only for what kind of matrix?'
        back: 'A square matrix (sizes must chain: $A \cdot A$ needs columns = rows).'
        type: basic
      - front: 'Powers of a diagonal matrix?'
        back: 'Raise each diagonal entry to that power.'
        type: basic

  - id: transpose-of-a-matrix
    name: The Transpose
    core: true
    difficulty: 0.55
    drill: false
    answer_kind: numeric
    expected_time_secs: 90
    prerequisites:
      - id: matrix-addition-scalar-multiplication
        weight: 0.7
        key: true
      - id: augmented-matrix-representation
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: Computing transposes
        key_prerequisites: [matrix-addition-scalar-multiplication]
        exemplars:
          - problem: 'Compute $A^T$ for $A = \begin{pmatrix}1&2&3\\4&5&6\end{pmatrix}$.'
            answer: '[[1,4],[2,5],[3,6]]'
            answer_contract: {"kind": "matrix", "rows": 3, "cols": 2}
            solution_sketch: 'The rows of $A$ become the columns of $A^T$. Row 1 $(1, 2, 3)$ becomes column 1 and row 2 $(4, 5, 6)$ becomes column 2, so $A^T = \begin{pmatrix}1&4\\2&5\\3&6\end{pmatrix}$, a $3 \times 2$ matrix.'
          - problem: 'Compute $A^T$ for $A = \begin{pmatrix}3&-2&5\\1&0&-4\\6&2&-1\end{pmatrix}$.'
            answer: '[[3,1,6],[-2,0,2],[5,-4,-1]]'
            answer_contract: {"kind": "matrix", "rows": 3, "cols": 3}
            solution_sketch: 'Each row of $A$ becomes a column: row 1 $(3, -2, 5)$ is column 1, row 2 $(1, 0, -4)$ is column 2 and row 3 $(6, 2, -1)$ is column 3. So $A^T = \begin{pmatrix}3&1&6\\-2&0&2\\5&-4&-1\end{pmatrix}$.'
          - problem: 'A teacher keeps the test marks of two students in the matrix $G = \begin{pmatrix}72&85&90\\64&78&81\end{pmatrix}$, with one row per student and one column per test. A spreadsheet needs the table with one row per test and one column per student. Write the new table as a matrix.'
            answer: '[[72,64],[85,78],[90,81]]'
            answer_contract: {"kind": "matrix", "rows": 3, "cols": 2}
            solution_sketch: 'The new table has the old columns as its rows, which is the transpose of $G$. Column 1 of $G$ is $(72, 64)$, so it becomes row 1, and the other columns follow. The result is $\begin{pmatrix}72&64\\85&78\\90&81\end{pmatrix}$.'
          - problem: 'The transpose of a matrix $A$ is $A^T = \begin{pmatrix}4&-5\\-1&6\end{pmatrix}$. Find $A$.'
            answer: '[[4,-1],[-5,6]]'
            answer_contract: {"kind": "matrix", "rows": 2, "cols": 2}
            solution_sketch: 'The columns of $A^T$ are the rows of $A$. Column 1 $(4, -1)$ is row 1 of $A$ and column 2 $(-5, 6)$ is row 2 of $A$. Transposing again restores $A = \begin{pmatrix}4&-1\\-5&6\end{pmatrix}$.'
          - problem: 'The matrix $C = \begin{pmatrix}4&1\\0&3\\2&5\end{pmatrix}$ gives the numbers of two products (columns) held in three shops (rows). What is the entry in row 2, column 3 of $C^T$?'
            answer: '5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Transposing moves the entry in row $i$, column $j$ to row $j$, column $i$. So the entry in row 2, column 3 of $C^T$ is the entry in row 3, column 2 of $C$, which is $5$. Indeed $C^T = \begin{pmatrix}4&0&2\\1&3&5\end{pmatrix}$.'
          - problem: 'Sam transposes $A = \begin{pmatrix}1&2\\3&4\end{pmatrix}$ by reversing each row and writes $\begin{pmatrix}2&1\\4&3\end{pmatrix}$. What is the correct $A^T$?'
            answer: '[[1,3],[2,4]]'
            answer_contract: {"kind": "matrix", "rows": 2, "cols": 2}
            solution_sketch: 'Reversing each row keeps the entries in their rows, but the transpose turns rows into columns. Row 1 $(1, 2)$ becomes column 1 and row 2 $(3, 4)$ becomes column 2, so $A^T = \begin{pmatrix}1&3\\2&4\end{pmatrix}$.'
          - problem: 'Compute $A^T$ for the row matrix $A = \begin{pmatrix}5&-3&2\end{pmatrix}$.'
            answer: '[[5],[-3],[2]]'
            answer_contract: {"kind": "matrix", "rows": 3, "cols": 1}
            solution_sketch: 'The single row $(5, -3, 2)$ becomes a single column. A $1 \times 3$ matrix has a $3 \times 1$ transpose, so $A^T = \begin{pmatrix}5\\-3\\2\end{pmatrix}$.'
          - problem: 'Compute $A^T$ for $A = \begin{pmatrix}6&-3\\0&5\\-2&1\end{pmatrix}$.'
            answer: '[[6,0,-2],[-3,5,1]]'
            answer_contract: {"kind": "matrix", "rows": 2, "cols": 3}
            solution_sketch: 'The rows $(6, -3)$, $(0, 5)$ and $(-2, 1)$ become the columns of $A^T$. A $3 \times 2$ matrix has a $2 \times 3$ transpose, namely $\begin{pmatrix}6&0&-2\\-3&5&1\end{pmatrix}$.'
        constraints: 'sizes up to 3x3; integer entries in -6..6 (marks up to 100 in the table context)'
      - id: kp2
        name: Transpose sizes and the double transpose
        key_prerequisites: [matrix-addition-scalar-multiplication]
        exemplars:
          - problem: 'If $A$ is a $3 \times 4$ matrix, then $A^T$ is an $m \times n$ matrix. What is the pair $(m, n)$?'
            answer: '(4, 3)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'Transposing turns the columns into rows and the rows into columns. $A$ has $4$ columns and $3$ rows, so $A^T$ is a $4 \times 3$ matrix and $(m, n) = (4, 3)$.'
          - problem: 'Compute $(A^T)^T$ for $A = \begin{pmatrix}5&0&-2\\3&1&4\end{pmatrix}$.'
            answer: '[[5,0,-2],[3,1,4]]'
            answer_contract: {"kind": "matrix", "rows": 2, "cols": 3}
            solution_sketch: 'The first transpose gives the $3 \times 2$ matrix $A^T = \begin{pmatrix}5&3\\0&1\\-2&4\end{pmatrix}$. The second transpose swaps rows and columns back, so $(A^T)^T = A = \begin{pmatrix}5&0&-2\\3&1&4\end{pmatrix}$.'
          - problem: 'The transpose $A^T$ is a $5 \times 2$ matrix. If $A$ is a $p \times q$ matrix, what is the pair $(p, q)$?'
            answer: '(2, 5)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'Transposing swaps the numbers of rows and columns. $A^T$ has $5$ rows and $2$ columns, so $A$ has $2$ rows and $5$ columns and $(p, q) = (2, 5)$.'
          - problem: 'A survey table $S$ has one row for each of $30$ people and one column for each of $8$ questions. A program needs the table the other way round, with one row for each question. How many columns does $S^T$ have?'
            answer: '30'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The transpose swaps rows and columns. $S$ is $30 \times 8$, so $S^T$ is $8 \times 30$ and has $30$ columns, one for each person.'
          - problem: 'Let $A$ be a $3 \times 5$ matrix. Is the product $AA^T$ defined?'
            answer: 'yes'
            answer_contract: {"kind": "label", "options": [["yes", "yes, it is defined", "yes, it is", "it is defined", "defined", "yes, it can be formed"], ["no", "no, it is not defined", "no, it is not", "it is not defined", "not defined", "undefined"]]}
            solution_sketch: 'The matrix $A^T$ is $5 \times 3$. In $AA^T$ the inner sizes are $5$ and $5$, so they match, and the product is defined. It is a $3 \times 3$ matrix.'
          - problem: 'Let $A$ be a $3 \times 5$ matrix. How many entries does $AA^T$ have?'
            answer: '9'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The product $AA^T$ is $(3 \times 5)(5 \times 3)$, so it is $3 \times 3$. A $3 \times 3$ matrix has $9$ entries.'
          - problem: 'Let $A$ be a $3 \times 5$ matrix. Can $A$ be added to $A^T$?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "yes, it can", "it can be added", "yes, it is defined", "yes, it is", "it is defined", "defined"], ["no", "no, it cannot", "it cannot be added", "no, it is not defined", "no, it is not", "it is not defined", "not defined", "undefined"]]}
            solution_sketch: 'A sum needs two matrices of the same size. $A$ is $3 \times 5$ and $A^T$ is $5 \times 3$, so the sizes differ and the sum is not defined.'
          - problem: 'Sam says that $(A^T)^T$ is the transpose of $A$, so for a $3 \times 6$ matrix $A$ it must be $6 \times 3$. How many rows does $(A^T)^T$ really have?'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Transposing twice undoes itself, so $(A^T)^T = A$. The matrix $A$ has $3$ rows, so $(A^T)^T$ has $3$ rows. Sam applied only one transpose.'
          - problem: 'The double transpose $(A^T)^T$ is a $1 \times 6$ matrix. If $A^T$ is an $m \times n$ matrix, what is the pair $(m, n)$?'
            answer: '(6, 1)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'The double transpose equals $A$, so $A$ is $1 \times 6$. Its transpose $A^T$ is $6 \times 1$, so $(m, n) = (6, 1)$.'
          - problem: 'A table $Y$ has one row for each of $12$ months and one column for each of $5$ products. A chart needs one row for each product. How many columns does the new table have?'
            answer: '12'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The new table is the transpose $Y^T$. Since $Y$ is $12 \times 5$, the transpose is $5 \times 12$, with $12$ columns, one for each month.'
        constraints: 'size questions up to 30x8; one size pair (m, n), one count or one verdict per question; double transposes of 2x3 matrices'
      - id: kp3
        name: Transpose of sums and scalar multiples
        key_prerequisites: [matrix-addition-scalar-multiplication]
        exemplars:
          - problem: 'Let $A = \begin{pmatrix}2&1\\0&3\end{pmatrix}$ and $B = \begin{pmatrix}1&4\\2&5\end{pmatrix}$. Compute $(A + B)^T$.'
            answer: '[[3,2],[5,8]]'
            answer_contract: {"kind": "matrix", "rows": 2, "cols": 2}
            solution_sketch: 'Add first: $A + B = \begin{pmatrix}3&5\\2&8\end{pmatrix}$. Swapping rows and columns gives $\begin{pmatrix}3&2\\5&8\end{pmatrix}$. The same matrix is $A^T + B^T$, because the transpose of a sum is the sum of the transposes.'
          - problem: 'Let $A = \begin{pmatrix}1&-2\\4&0\end{pmatrix}$. Compute $(3A)^T$.'
            answer: '[[3,12],[-6,0]]'
            answer_contract: {"kind": "matrix", "rows": 2, "cols": 2}
            solution_sketch: 'Scale first: $3A = \begin{pmatrix}3&-6\\12&0\end{pmatrix}$. Swapping rows and columns gives $\begin{pmatrix}3&12\\-6&0\end{pmatrix}$, which is $3A^T$, since a scalar factor passes through the transpose.'
          - problem: 'Two shops sell three products. The matrix $W_1 = \begin{pmatrix}12&5&7\\8&6&9\end{pmatrix}$ gives the numbers sold in week 1, with one row per shop, and $W_2 = \begin{pmatrix}10&4&6\\9&7&5\end{pmatrix}$ gives the numbers sold in week 2. The manager wants the two-week totals in a table with one row per product and one column per shop. Which matrix is this?'
            answer: '[[22,17],[9,13],[13,14]]'
            answer_contract: {"kind": "matrix", "rows": 3, "cols": 2}
            solution_sketch: 'The totals are $W_1 + W_2 = \begin{pmatrix}22&9&13\\17&13&14\end{pmatrix}$, with one row per shop. The wanted table has one row per product, so it is the transpose $\begin{pmatrix}22&17\\9&13\\13&14\end{pmatrix}$.'
          - problem: 'Let $A = \begin{pmatrix}5&2\\1&3\end{pmatrix}$ and $B = \begin{pmatrix}2&0\\4&1\end{pmatrix}$. Compute $(A - B)^T$.'
            answer: '[[3,-3],[2,2]]'
            answer_contract: {"kind": "matrix", "rows": 2, "cols": 2}
            solution_sketch: 'Subtract first: $A - B = \begin{pmatrix}3&2\\-3&2\end{pmatrix}$. Swapping rows and columns gives $\begin{pmatrix}3&-3\\2&2\end{pmatrix}$, which equals $A^T - B^T$.'
          - problem: 'The entry in row 2, column 1 of $(2A)^T$ is $8$. What is the entry in row 1, column 2 of $A$?'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Transposing swaps positions $(1, 2)$ and $(2, 1)$, so the entry in row 2, column 1 of $(2A)^T$ is the entry in row 1, column 2 of $2A$. That entry is twice the entry of $A$, so the entry of $A$ is $8 \div 2 = 4$.'
          - problem: 'A club records the points of two players in two tournaments. The matrices $A = \begin{pmatrix}6&2\\4&8\end{pmatrix}$ (season 1) and $B = \begin{pmatrix}2&4\\6&2\end{pmatrix}$ (season 2) have one row per player and one column per tournament. The mean of the two seasons is $\tfrac{1}{2}(A + B)$. The coach wants the table of means with one row per tournament and one column per player. Which matrix is this?'
            answer: '[[4,5],[3,5]]'
            answer_contract: {"kind": "matrix", "rows": 2, "cols": 2}
            solution_sketch: 'The sum is $A + B = \begin{pmatrix}8&6\\10&10\end{pmatrix}$ and half of it is $\begin{pmatrix}4&3\\5&5\end{pmatrix}$. The table the coach wants swaps rows and columns, so it is the transpose $\begin{pmatrix}4&5\\3&5\end{pmatrix}$.'
          - problem: 'Let $A = \begin{pmatrix}1&3\\2&0\end{pmatrix}$ and $B = \begin{pmatrix}0&1\\1&2\end{pmatrix}$. Compute $(A + 2B)^T$.'
            answer: '[[1,4],[5,4]]'
            answer_contract: {"kind": "matrix", "rows": 2, "cols": 2}
            solution_sketch: 'First $2B = \begin{pmatrix}0&2\\2&4\end{pmatrix}$, so $A + 2B = \begin{pmatrix}1&5\\4&4\end{pmatrix}$. Swapping rows and columns gives $\begin{pmatrix}1&4\\5&4\end{pmatrix}$.'
          - problem: 'Sam computes $(A - 2B)^T$ for $A = \begin{pmatrix}4&1\\0&2\end{pmatrix}$ and $B = \begin{pmatrix}1&3\\2&1\end{pmatrix}$ by transposing only $A$ and writing $A^T - 2B$. What is the correct value of $(A - 2B)^T$?'
            answer: '[[2,-4],[-5,0]]'
            answer_contract: {"kind": "matrix", "rows": 2, "cols": 2}
            solution_sketch: 'The transpose applies to the whole difference, so $(A - 2B)^T = A^T - 2B^T$. Here $A - 2B = \begin{pmatrix}2&-5\\-4&0\end{pmatrix}$, and its transpose is $\begin{pmatrix}2&-4\\-5&0\end{pmatrix}$.'
        constraints: '2x2 matrices with small integer entries, with 2x3 sales tables in the context items; compute one transpose of a sum, difference or scalar multiple'
    diagnostic_exemplar:
      problem: 'For $A = \begin{pmatrix}1&5&0\\-2&0&3\end{pmatrix}$ and $B = \begin{pmatrix}0&1&2\\1&0&-1\end{pmatrix}$, compute $(A + 2B)^T$ and state its size.'
      answer: '$\begin{pmatrix}1&0\\7&0\\4&1\end{pmatrix}$, a $3 \times 2$ matrix'
      answer_contract: {kind: none}
      solution_sketch: '$A + 2B = \begin{pmatrix}1&7&4\\0&0&1\end{pmatrix}$; transposing turns its $2\times3$ shape into $3\times2$ (equivalently $A^T + 2B^T$).'
    anki_seeds:
      - front: 'The transpose $A^T$ is formed by...'
        back: 'turning the rows of $A$ into columns (entry $(i,j)$ moves to $(j,i)$).'
        type: basic

  - id: transpose-symmetric-matrices
    name: Transpose and Symmetric Matrices
    core: true
    difficulty: 0.6
    drill: false
    answer_kind: numeric
    expected_time_secs: 120
    prerequisites:
      - id: transpose-of-a-matrix
        weight: 0.8
        key: true
      - id: matrix-multiplication
        weight: 0.5
        key: true
      - id: matrix-operations
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: Transpose of products
        key_prerequisites: [transpose-of-a-matrix, matrix-multiplication]
        exemplars:
          - problem: 'Let $A = \begin{pmatrix}1&2\\0&1\end{pmatrix}$ and $B = \begin{pmatrix}1&0\\3&1\end{pmatrix}$. Compute $(AB)^T$.'
            answer: '[[7,3],[2,1]]'
            answer_contract: {"kind": "matrix", "rows": 2, "cols": 2}
            solution_sketch: 'First $AB = \begin{pmatrix}7&2\\3&1\end{pmatrix}$. Swapping rows and columns gives $\begin{pmatrix}7&3\\2&1\end{pmatrix}$. The same matrix is $B^T A^T$, since the transpose of a product reverses the order of the factors.'
          - problem: 'Let $A = \begin{pmatrix}2&3\\1&4\end{pmatrix}$ and $B = \begin{pmatrix}1&2\\0&5\end{pmatrix}$. Compute $(AB)^T$.'
            answer: '[[2,1],[19,22]]'
            answer_contract: {"kind": "matrix", "rows": 2, "cols": 2}
            solution_sketch: 'The product is $AB = \begin{pmatrix}2&19\\1&22\end{pmatrix}$. Swapping rows and columns gives $\begin{pmatrix}2&1\\19&22\end{pmatrix}$, which is also $B^T A^T$.'
          - problem: 'Two cafes order three items. The matrix $Q = \begin{pmatrix}4&2&1\\3&0&5\end{pmatrix}$ has one row per cafe and one column per item, in dozens, and the column $P = \begin{pmatrix}2\\5\\1\end{pmatrix}$ gives the price of one dozen of each item in dollars. The bills are the entries of $QP$. The accountant wants them written as a row, $(QP)^T$. Which matrix is this?'
            answer: '[[19,11]]'
            answer_contract: {"kind": "matrix", "rows": 1, "cols": 2}
            solution_sketch: 'The bills are $QP = \begin{pmatrix}19\\11\end{pmatrix}$, one for each cafe. The transpose turns this column into the row $\begin{pmatrix}19&11\end{pmatrix}$. It also equals $P^T Q^T$, a $(1 \times 3)(3 \times 2)$ product.'
          - problem: 'Let $A = \begin{pmatrix}1&5\\2&3\end{pmatrix}$ and $B = \begin{pmatrix}2&0\\1&4\end{pmatrix}$. Compute $B^T A^T$.'
            answer: '[[7,7],[20,12]]'
            answer_contract: {"kind": "matrix", "rows": 2, "cols": 2}
            solution_sketch: 'The transposes are $B^T = \begin{pmatrix}2&1\\0&4\end{pmatrix}$ and $A^T = \begin{pmatrix}1&2\\5&3\end{pmatrix}$. Multiplying in this order gives $\begin{pmatrix}7&7\\20&12\end{pmatrix}$. This is $(AB)^T$, because $AB = \begin{pmatrix}7&20\\7&12\end{pmatrix}$.'
          - problem: 'Sam computes $(AB)^T$ as $A^T B^T$ for $A = \begin{pmatrix}1&1\\0&2\end{pmatrix}$ and $B = \begin{pmatrix}3&0\\1&1\end{pmatrix}$. What is the correct value of $(AB)^T$?'
            answer: '[[4,2],[1,2]]'
            answer_contract: {"kind": "matrix", "rows": 2, "cols": 2}
            solution_sketch: 'The order of the factors reverses under a transpose, so $(AB)^T = B^T A^T$. Here $AB = \begin{pmatrix}4&1\\2&2\end{pmatrix}$ and its transpose is $\begin{pmatrix}4&2\\1&2\end{pmatrix}$. Sam''s product $A^T B^T = \begin{pmatrix}3&1\\3&3\end{pmatrix}$ is a different matrix.'
          - problem: 'The matrix $M = \begin{pmatrix}1&0&2\\3&1&0\end{pmatrix}$ counts the roads from two towns (rows) to three villages (columns). The matrix $N = \begin{pmatrix}1&1\\0&2\\2&0\end{pmatrix}$ counts the roads from the villages (rows) to two cities (columns). The product $MN$ counts routes from the towns to the cities. A map needs the table with one row per city and one column per town. Which matrix is this?'
            answer: '[[5,3],[1,5]]'
            answer_contract: {"kind": "matrix", "rows": 2, "cols": 2}
            solution_sketch: 'The routes are $MN = \begin{pmatrix}5&1\\3&5\end{pmatrix}$, with one row per town. The map needs one row per city, so it is the transpose $(MN)^T = \begin{pmatrix}5&3\\1&5\end{pmatrix}$, which equals $N^T M^T$.'
          - problem: 'Compute $A^T A$ for $A = \begin{pmatrix}2&1\\4&3\end{pmatrix}$.'
            answer: '[[20,14],[14,10]]'
            answer_contract: {"kind": "matrix", "rows": 2, "cols": 2}
            solution_sketch: 'The transpose is $A^T = \begin{pmatrix}2&4\\1&3\end{pmatrix}$. Multiplying gives $A^T A = \begin{pmatrix}20&14\\14&10\end{pmatrix}$, and the entries $14$ and $14$ in the mirror positions are equal.'
          - problem: 'Let $A = \begin{pmatrix}1&0\\2&1\end{pmatrix}$, $B = \begin{pmatrix}1&1\\0&1\end{pmatrix}$ and $C = \begin{pmatrix}2&0\\1&3\end{pmatrix}$. Compute $C^T B^T A^T$.'
            answer: '[[3,7],[3,9]]'
            answer_contract: {"kind": "matrix", "rows": 2, "cols": 2}
            solution_sketch: 'First $C^T B^T = \begin{pmatrix}3&1\\3&3\end{pmatrix}$. Multiplying by $A^T = \begin{pmatrix}1&2\\0&1\end{pmatrix}$ gives $\begin{pmatrix}3&7\\3&9\end{pmatrix}$. This equals $(ABC)^T$, since the transpose reverses the order of three factors as well.'
        constraints: '2x2 matrices, with 2x3 times 3x1 and 2x3 times 3x2 products in the context items; verify the reversal rule numerically'
      - id: kp2
        name: Symmetric matrices
        key_prerequisites: [transpose-of-a-matrix]
        exemplars:
          - problem: 'For which value of $k$ is the matrix $\begin{pmatrix}1&k\\3&2\end{pmatrix}$ symmetric?'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A symmetric matrix equals its transpose, so the entries in mirror positions are equal. The $(1, 2)$ entry is $k$ and the $(2, 1)$ entry is $3$, so $k = 3$.'
          - problem: 'Find $k$ so that $\begin{pmatrix}0&k\\-7&3\end{pmatrix}$ is symmetric.'
            answer: '-7'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Symmetry means that each entry equals its mirror entry across the main diagonal. The $(1, 2)$ entry is $k$ and the $(2, 1)$ entry is $-7$, so $k = -7$.'
          - problem: 'The matrix $\begin{pmatrix}4&0&6\\0&-2&5\\k&5&1\end{pmatrix}$ is symmetric. What is $k$?'
            answer: '6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Check each pair of mirror entries. The pairs $(1, 2)$ and $(2, 1)$ both equal $0$, and $(2, 3)$ and $(3, 2)$ both equal $5$. The remaining pair is $(1, 3)$ and $(3, 1)$, which forces $k = 6$.'
          - problem: 'Compute $A^T A$ for $A = \begin{pmatrix}3&1\\2&4\end{pmatrix}$.'
            answer: '[[13,11],[11,17]]'
            answer_contract: {"kind": "matrix", "rows": 2, "cols": 2}
            solution_sketch: 'The transpose is $A^T = \begin{pmatrix}3&2\\1&4\end{pmatrix}$. The product is $A^T A = \begin{pmatrix}13&11\\11&17\end{pmatrix}$. Its mirror entries $11$ and $11$ agree, as they must, because $(A^T A)^T = A^T A$.'
          - problem: 'A table gives the road distances in kilometres between three towns, with the rows and the columns in the same order of towns: $\begin{pmatrix}0&12&7\\12&0&k\\7&9&0\end{pmatrix}$. The distance from the second town to the third town is $k$. What is $k$?'
            answer: '9'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The distance from town 2 to town 3 equals the distance from town 3 to town 2, so the table is symmetric. The $(2, 3)$ entry $k$ equals the $(3, 2)$ entry $9$, so $k = 9$ kilometres.'
          - problem: 'The matrix $\begin{pmatrix}6&1&2\\1&0&3\\2&b&5\end{pmatrix}$ is symmetric. What is $b$?'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A symmetric matrix equals its transpose, so each entry equals its mirror entry. The entry in row 3, column 2 is $b$ and its mirror entry in row 2, column 3 is $3$, so $b = 3$.'
          - problem: 'Compute $B^T B$ for $B = \begin{pmatrix}1&2&0\\0&1&3\\4&0&1\end{pmatrix}$.'
            answer: '[[17,2,4],[2,5,3],[4,3,10]]'
            answer_contract: {"kind": "matrix", "rows": 3, "cols": 3}
            solution_sketch: 'The transpose is $B^T = \begin{pmatrix}1&0&4\\2&1&0\\0&3&1\end{pmatrix}$. Multiplying rows of $B^T$ by columns of $B$ gives $B^T B = \begin{pmatrix}17&2&4\\2&5&3\\4&3&10\end{pmatrix}$. The mirror entries agree, since $(B^T B)^T = B^T B$.'
          - problem: 'Determine the value of $k$ that makes $\begin{pmatrix}2&2k - 1\\k + 3&7\end{pmatrix}$ symmetric.'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Symmetry requires the $(1, 2)$ entry to equal the $(2, 1)$ entry, so $2k - 1 = k + 3$. Subtracting $k$ and adding $1$ gives $k = 4$. Then both mirror entries equal $7$.'
          - problem: 'A shipping company charges the same price in both directions between its three depots. The table of prices in dollars, with the rows as the starting depots and the columns as the destinations, is $\begin{pmatrix}0&5&3\\p&0&8\\3&8&0\end{pmatrix}$. What is the price $p$ from the second depot to the first?'
            answer: '5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The price is the same in both directions, so the table is symmetric. The $(2, 1)$ entry $p$ equals the $(1, 2)$ entry $5$, so the price is $5$ dollars.'
          - problem: 'The matrices $A = \begin{pmatrix}1&2\\2&0\end{pmatrix}$ and $B = \begin{pmatrix}0&1\\1&1\end{pmatrix}$ are both symmetric. Is the product $AB$ symmetric?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "yes, it is symmetric", "yes, it is", "it is symmetric", "symmetric", "yes, AB is symmetric", "AB is symmetric"], ["no", "no, it is not symmetric", "no, it is not", "it is not symmetric", "not symmetric", "no, AB is not symmetric", "AB is not symmetric"]]}
            solution_sketch: 'The product is $AB = \begin{pmatrix}2&3\\0&2\end{pmatrix}$. The $(1, 2)$ entry is $3$ and the $(2, 1)$ entry is $2$, so $AB$ is not symmetric. The reason is that $(AB)^T = B^T A^T = BA$, which differs from $AB$ here.'
        constraints: '2x2 and 3x3; one unknown entry for solve-for-k problems; tables that are symmetric by their meaning'
      - id: kp3
        name: Building symmetric matrices
        key_prerequisites: [transpose-of-a-matrix, matrix-operations]
        exemplars:
          - problem: 'Compute $A + A^T$ for $A = \begin{pmatrix}1&4\\0&3\end{pmatrix}$.'
            answer: '[[2,4],[4,6]]'
            answer_contract: {"kind": "matrix", "rows": 2, "cols": 2}
            solution_sketch: 'The transpose is $A^T = \begin{pmatrix}1&0\\4&3\end{pmatrix}$. Adding entry by entry gives $\begin{pmatrix}2&4\\4&6\end{pmatrix}$. The off-diagonal entries are both $4$, so the sum equals its own transpose.'
          - problem: 'Compute $A + A^T$ for $A = \begin{pmatrix}1&2\\3&4\end{pmatrix}$.'
            answer: '[[2,5],[5,8]]'
            answer_contract: {"kind": "matrix", "rows": 2, "cols": 2}
            solution_sketch: 'The transpose is $A^T = \begin{pmatrix}1&3\\2&4\end{pmatrix}$. Adding entry by entry gives $\begin{pmatrix}2&5\\5&8\end{pmatrix}$, which is symmetric.'
          - problem: 'Compute $A^T A$ for $A = \begin{pmatrix}2&0\\1&3\end{pmatrix}$.'
            answer: '[[5,3],[3,9]]'
            answer_contract: {"kind": "matrix", "rows": 2, "cols": 2}
            solution_sketch: 'The transpose is $A^T = \begin{pmatrix}2&1\\0&3\end{pmatrix}$. Multiplying gives $A^T A = \begin{pmatrix}5&3\\3&9\end{pmatrix}$. The off-diagonal entries are both $3$, so the product is symmetric.'
          - problem: 'Compute $AA^T$ for $A = \begin{pmatrix}1&-1\\2&3\end{pmatrix}$.'
            answer: '[[2,-1],[-1,13]]'
            answer_contract: {"kind": "matrix", "rows": 2, "cols": 2}
            solution_sketch: 'The transpose is $A^T = \begin{pmatrix}1&2\\-1&3\end{pmatrix}$. Multiplying in the order $AA^T$ gives $\begin{pmatrix}2&-1\\-1&13\end{pmatrix}$. The off-diagonal entries are both $-1$, so the product equals its transpose.'
          - problem: 'A table $T = \begin{pmatrix}0&14\\20&0\end{pmatrix}$ gives the travel time in minutes between two stations, with the rows as the starting stations and the columns as the destinations. The two directions take different times. A timetable planner uses the mean of the two directions, the matrix $\tfrac{1}{2}(T + T^T)$. Compute this matrix.'
            answer: '[[0,17],[17,0]]'
            answer_contract: {"kind": "matrix", "rows": 2, "cols": 2}
            solution_sketch: 'The transpose is $T^T = \begin{pmatrix}0&20\\14&0\end{pmatrix}$, and $T + T^T = \begin{pmatrix}0&34\\34&0\end{pmatrix}$. Half of this is $\begin{pmatrix}0&17\\17&0\end{pmatrix}$, which is symmetric, with the mean time $17$ minutes in both directions.'
          - problem: 'Two customers rate three films, and the matrix $R = \begin{pmatrix}1&0&2\\3&1&1\end{pmatrix}$ has one row per customer and one column per film. The entry in row $i$, column $j$ of $R^T R$ is the sum, over the customers, of the products of their ratings of films $i$ and $j$. Compute $R^T R$.'
            answer: '[[10,3,5],[3,1,1],[5,1,5]]'
            answer_contract: {"kind": "matrix", "rows": 3, "cols": 3}
            solution_sketch: 'The transpose $R^T = \begin{pmatrix}1&3\\0&1\\2&1\end{pmatrix}$ is $3 \times 2$, so $R^T R$ is $3 \times 3$. It equals $\begin{pmatrix}10&3&5\\3&1&1\\5&1&5\end{pmatrix}$. It is symmetric, because the film $i$ and film $j$ entries are the same sum of products.'
          - problem: 'The matrix $\begin{pmatrix}4&k\\2k - 1&7\end{pmatrix}$ should be symmetric. What must $k$ be?'
            answer: '1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The $(1, 2)$ entry must equal the $(2, 1)$ entry, so $k = 2k - 1$. Subtracting $k$ gives $0 = k - 1$, so $k = 1$. The matrix then has the entries $1$ and $1$ in the mirror positions.'
          - problem: 'The matrix $A$ is upper triangular, so its entry below the diagonal is $0$, and $A + A^T = \begin{pmatrix}4&6\\6&10\end{pmatrix}$. Find $A$.'
            answer: '[[2,6],[0,5]]'
            answer_contract: {"kind": "matrix", "rows": 2, "cols": 2}
            solution_sketch: 'Below the diagonal $A$ has the entry $0$, so the $(1, 2)$ entry of $A + A^T$ is just the $(1, 2)$ entry of $A$, which is $6$. The diagonal entries of $A + A^T$ are twice those of $A$, so $A$ has the diagonal entries $2$ and $5$. Hence $A = \begin{pmatrix}2&6\\0&5\end{pmatrix}$.'
          - problem: 'A matrix $A$ is $4 \times 6$. How many entries does the product $A^T A$ have?'
            answer: '36'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The transpose $A^T$ is $6 \times 4$, so $A^T A$ is $(6 \times 4)(4 \times 6)$, which is $6 \times 6$. A $6 \times 6$ matrix has $36$ entries, and the matrix is symmetric.'
        constraints: '2x2 integer matrices, with 2x3 data tables in the context items; the result must visibly satisfy A = A^T'
    diagnostic_exemplar:
      problem: 'Compute $A^TA$ for $A = \begin{pmatrix}1&3\\0&2\end{pmatrix}$, and explain why the result had to be symmetric.'
      answer: '$A^TA = \begin{pmatrix}1&3\\3&13\end{pmatrix}$; it is symmetric because $(A^TA)^T = A^T(A^T)^T = A^TA$'
      answer_contract: {kind: none}
      solution_sketch: '$A^T = \begin{pmatrix}1&0\\3&2\end{pmatrix}$, so $A^TA = \begin{pmatrix}1&3\\3&13\end{pmatrix}$; the reversal rule $(XY)^T = Y^TX^T$ makes $A^TA$ its own transpose.'
    anki_seeds:
      - front: '$(AB)^T = $ ?'
        back: '$B^T A^T$ — the order reverses.'
        type: basic
      - front: 'A matrix $A$ is symmetric when...'
        back: '$A = A^T$ (it must be square).'
        type: basic

  - id: matrix-inverse-2x2-formula
    name: The 2x2 Inverse Formula
    core: true
    difficulty: 0.6
    drill: false
    answer_kind: numeric
    expected_time_secs: 120
    prerequisites:
      - id: matrix-multiplication
        weight: 0.7
        key: true
      - id: identity-zero-matrices
        weight: 0.5
        key: true
      - id: diagonal-triangular-matrices
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: Applying the formula
        key_prerequisites: [matrix-multiplication, identity-zero-matrices]
        try_first:
          problem: 'A program multiplies every $x$-coordinate by $4$ and leaves every $y$-coordinate alone. By what number must an $x$-coordinate be multiplied to undo this?'
          answer_contract: {"kind": "exact"}
          answer: '1/4'
          reveal: 'Undoing a multiplication by $4$ means multiplying by $\frac{1}{4}$. For a general matrix the undoing matrix is the inverse, and the $2 \times 2$ formula builds it.'
        exemplars:
          - problem: 'Find $A^{-1}$ for $A = \begin{pmatrix}2&1\\5&3\end{pmatrix}$.'
            answer: '[[3,-1],[-5,2]]'
            answer_contract: {"kind": "matrix", "rows": 2, "cols": 2}
            solution_sketch: 'The determinant is $2\cdot 3 - 1\cdot 5 = 1$. Swapping the diagonal entries and changing the signs of the other two entries gives $\begin{pmatrix}3&-1\\-5&2\end{pmatrix}$. Dividing by $1$ changes nothing, so $A^{-1} = \begin{pmatrix}3&-1\\-5&2\end{pmatrix}$.'
          - problem: 'Find $A^{-1}$ for $A = \begin{pmatrix}3&1\\2&1\end{pmatrix}$.'
            answer: '[[1,-1],[-2,3]]'
            answer_contract: {"kind": "matrix", "rows": 2, "cols": 2}
            solution_sketch: 'The determinant is $3\cdot 1 - 1\cdot 2 = 1$. Swapping the diagonal entries and changing the signs of the other two entries gives $\begin{pmatrix}1&-1\\-2&3\end{pmatrix}$. Dividing by $1$ changes nothing, so $A^{-1} = \begin{pmatrix}1&-1\\-2&3\end{pmatrix}$.'
          - problem: 'A drawing program moves every point $(x, y)$ to the point $(4x + 3y,\ 5x + 4y)$, which is the product of $\begin{pmatrix}4&3\\5&4\end{pmatrix}$ with the column $\begin{pmatrix}x\\y\end{pmatrix}$. Find the matrix that takes each new point back to the original point.'
            answer: '[[4,-3],[-5,4]]'
            answer_contract: {"kind": "matrix", "rows": 2, "cols": 2}
            solution_sketch: 'The move is multiplication by $A = \begin{pmatrix}4&3\\5&4\end{pmatrix}$, so the matrix that undoes it is $A^{-1}$. The determinant is $4\cdot 4 - 3\cdot 5 = 1$, and swapping the diagonal entries and changing the other two signs gives $A^{-1} = \begin{pmatrix}4&-3\\-5&4\end{pmatrix}$.'
          - problem: 'Sam writes $B^{-1} = \begin{pmatrix}3&-2\\-2&1\end{pmatrix}$ for $B = \begin{pmatrix}1&2\\2&3\end{pmatrix}$, but the product $BB^{-1}$ is not the identity. What is the correct inverse of $B$?'
            answer: '[[-3,2],[2,-1]]'
            answer_contract: {"kind": "matrix", "rows": 2, "cols": 2}
            solution_sketch: 'The determinant is $1\cdot 3 - 2\cdot 2 = -1$, which Sam left out. Swapping and changing signs gives $\begin{pmatrix}3&-2\\-2&1\end{pmatrix}$, and dividing by $-1$ changes every sign. So $B^{-1} = \begin{pmatrix}-3&2\\2&-1\end{pmatrix}$, and $BB^{-1} = I$.'
          - problem: 'The inverse of a matrix $A$ is $A^{-1} = \begin{pmatrix}5&-2\\-2&1\end{pmatrix}$. Find $A$.'
            answer: '[[1,2],[2,5]]'
            answer_contract: {"kind": "matrix", "rows": 2, "cols": 2}
            solution_sketch: 'Since $(A^{-1})^{-1} = A$, apply the formula to $A^{-1}$. Its determinant is $5\cdot 1 - (-2)\cdot(-2) = 1$, and swapping the diagonal entries $5$ and $1$ and changing the signs of $-2$ and $-2$ gives $A = \begin{pmatrix}1&2\\2&5\end{pmatrix}$.'
          - problem: 'A message is coded by replacing each pair $(p, q)$ with the pair $(p + q,\ p + 2q)$, that is, by multiplying the column $\begin{pmatrix}p\\q\end{pmatrix}$ by $\begin{pmatrix}1&1\\1&2\end{pmatrix}$. Find the matrix that turns a coded pair back into $(p, q)$.'
            answer: '[[2,-1],[-1,1]]'
            answer_contract: {"kind": "matrix", "rows": 2, "cols": 2}
            solution_sketch: 'Decoding means multiplying by the inverse of the coding matrix $C = \begin{pmatrix}1&1\\1&2\end{pmatrix}$. Its determinant is $1\cdot 2 - 1\cdot 1 = 1$, so swapping the diagonal entries and changing the other two signs gives $C^{-1} = \begin{pmatrix}2&-1\\-1&1\end{pmatrix}$.'
          - problem: 'Find $A^{-1}$ for $A = \begin{pmatrix}7&3\\2&1\end{pmatrix}$.'
            answer: '[[1,-3],[-2,7]]'
            answer_contract: {"kind": "matrix", "rows": 2, "cols": 2}
            solution_sketch: 'The determinant is $7\cdot 1 - 3\cdot 2 = 1$. Swapping the diagonal entries and changing the signs of the other two entries gives $\begin{pmatrix}1&-3\\-2&7\end{pmatrix}$. Dividing by $1$ changes nothing, so $A^{-1} = \begin{pmatrix}1&-3\\-2&7\end{pmatrix}$.'
        constraints: "prefer ad - bc = +-1 for integer inverses"
      - id: kp2
        name: Fractional and diagonal inverses
        key_prerequisites: [matrix-multiplication, diagonal-triangular-matrices]
        exemplars:
          - problem: 'Find $A^{-1}$ for $A = \begin{pmatrix}1&2\\3&4\end{pmatrix}$.'
            answer: '[[-2,1],[3/2,-1/2]]'
            answer_contract: {"kind": "matrix", "rows": 2, "cols": 2}
            solution_sketch: 'The determinant is $1\cdot 4 - 2\cdot 3 = -2$. Swapping the diagonal entries and changing the signs of the other two entries gives $\begin{pmatrix}4&-2\\-3&1\end{pmatrix}$. Dividing every entry by $-2$ gives $A^{-1} = \begin{pmatrix}-2&1\\\frac{3}{2}&-\frac{1}{2}\end{pmatrix}$.'
          - problem: 'Find the inverse of the diagonal matrix $\begin{pmatrix}2&0\\0&5\end{pmatrix}$.'
            answer: '[[1/2,0],[0,1/5]]'
            answer_contract: {"kind": "matrix", "rows": 2, "cols": 2}
            solution_sketch: 'A diagonal matrix is undone by undoing each diagonal entry separately. Here $2$ becomes $\frac{1}{2}$ and $5$ becomes $\frac{1}{5}$, so the inverse is $\begin{pmatrix}\frac{1}{2}&0\\0&\frac{1}{5}\end{pmatrix}$; the formula agrees, since the determinant is $10$ and the swapped matrix is $\begin{pmatrix}5&0\\0&2\end{pmatrix}$.'
          - problem: 'Find $A^{-1}$ for $A = \begin{pmatrix}2&3\\4&5\end{pmatrix}$.'
            answer: '[[-5/2,3/2],[2,-1]]'
            answer_contract: {"kind": "matrix", "rows": 2, "cols": 2}
            solution_sketch: 'The determinant is $2\cdot 5 - 3\cdot 4 = -2$. Swapping the diagonal entries and changing the signs of the other two entries gives $\begin{pmatrix}5&-3\\-4&2\end{pmatrix}$. Dividing every entry by $-2$ gives $A^{-1} = \begin{pmatrix}-\frac{5}{2}&\frac{3}{2}\\2&-1\end{pmatrix}$.'
          - problem: 'Find $A^{-1}$ for $A = \begin{pmatrix}4&3\\6&5\end{pmatrix}$.'
            answer: '[[5/2,-3/2],[-3,2]]'
            answer_contract: {"kind": "matrix", "rows": 2, "cols": 2}
            solution_sketch: 'The determinant is $4\cdot 5 - 3\cdot 6 = 2$. Swapping the diagonal entries and changing the signs of the other two entries gives $\begin{pmatrix}5&-3\\-6&4\end{pmatrix}$. Dividing every entry by $2$ gives $A^{-1} = \begin{pmatrix}\frac{5}{2}&-\frac{3}{2}\\-3&2\end{pmatrix}$.'
          - problem: 'A graphics program stretches a picture to $3$ times its width and $4$ times its height, which multiplies the point $(x, y)$ by $\begin{pmatrix}3&0\\0&4\end{pmatrix}$. Find the matrix that shrinks the stretched picture back to the original.'
            answer: '[[1/3,0],[0,1/4]]'
            answer_contract: {"kind": "matrix", "rows": 2, "cols": 2}
            solution_sketch: 'Undoing a stretch by $3$ means dividing by $3$, and undoing a stretch by $4$ means dividing by $4$. The matrix that does this is the inverse of the diagonal matrix, $\begin{pmatrix}\frac{1}{3}&0\\0&\frac{1}{4}\end{pmatrix}$, because $SS^{-1} = I$.'
          - problem: 'Find $A^{-1}$ for the upper triangular matrix $A = \begin{pmatrix}2&1\\0&1\end{pmatrix}$.'
            answer: '[[1/2,-1/2],[0,1]]'
            answer_contract: {"kind": "matrix", "rows": 2, "cols": 2}
            solution_sketch: 'The determinant is $2\cdot 1 - 1\cdot 0 = 2$. Swapping the diagonal entries and changing the signs of the other two entries gives $\begin{pmatrix}1&-1\\0&2\end{pmatrix}$. Dividing every entry by $2$ gives $A^{-1} = \begin{pmatrix}\frac{1}{2}&-\frac{1}{2}\\0&1\end{pmatrix}$.'
          - problem: 'A converter changes the pair $(x, y)$ into the pair $(2x + y,\ 4x + 3y)$, which is multiplication by $\begin{pmatrix}2&1\\4&3\end{pmatrix}$. Find the matrix that converts a changed pair back to $(x, y)$.'
            answer: '[[3/2,-1/2],[-2,1]]'
            answer_contract: {"kind": "matrix", "rows": 2, "cols": 2}
            solution_sketch: 'The converter has matrix $T = \begin{pmatrix}2&1\\4&3\end{pmatrix}$, and the undoing matrix is $T^{-1}$. The determinant is $2\cdot 3 - 1\cdot 4 = 2$, so $T^{-1} = \frac{1}{2}\begin{pmatrix}3&-1\\-4&2\end{pmatrix} = \begin{pmatrix}\frac{3}{2}&-\frac{1}{2}\\-2&1\end{pmatrix}$.'
        constraints: "ad - bc in {-2, 2} for fraction practice; nonzero diagonal entries"
      - id: kp3
        name: Singularity via the determinant condition
        key_prerequisites: [matrix-multiplication]
        exemplars:
          - problem: 'For which value of $k$ is $\begin{pmatrix}1&k\\2&6\end{pmatrix}$ not invertible?'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A $2\times 2$ matrix is not invertible exactly when $ad - bc = 0$. Here $ad - bc = 6 - 2k$, and $6 - 2k = 0$ gives $k = 3$. The rows $(1, 3)$ and $(2, 6)$ are then proportional.'
          - problem: 'Does the matrix $A = \begin{pmatrix}3&6\\2&4\end{pmatrix}$ have an inverse?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "it has an inverse", "it is invertible", "invertible", "A has an inverse", "A is invertible", "has an inverse", "is invertible"], ["no", "it has no inverse", "it is not invertible", "not invertible", "singular", "it is singular", "A has no inverse", "A is not invertible"]]}
            solution_sketch: 'Compute $ad - bc = 3\cdot 4 - 6\cdot 2 = 12 - 12 = 0$. The inverse formula divides by this number, so $A$ has no inverse. The rows $(3, 6)$ and $(2, 4)$ are proportional.'
          - problem: 'Find the value of $k$ for which the matrix $\begin{pmatrix}k&3\\4&2\end{pmatrix}$ has no inverse.'
            answer: '6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The determinant is $2k - 3\cdot 4 = 2k - 12$. The matrix has no inverse when the determinant is $0$, so $2k = 12$ and $k = 6$.'
          - problem: 'A scrambler turns the pair $(x, y)$ into the pair $(kx + 6y,\ 2x + 3y)$. For which value of $k$ is it impossible to recover $(x, y)$ from the scrambled pair?'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The scrambler is multiplication by $\begin{pmatrix}k&6\\2&3\end{pmatrix}$, and the pair can be recovered only if this matrix has an inverse. The determinant is $3k - 12$, which is $0$ when $k = 4$. Then both $(x, y)$ and some other pair give the same scrambled pair.'
          - problem: 'The matrix $\begin{pmatrix}5&b\\2&-4\end{pmatrix}$ is singular. Find the value of $b$.'
            answer: '-10'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A singular matrix has determinant $0$. Here the determinant is $5\cdot(-4) - 2b = -20 - 2b$, and $-20 - 2b = 0$ gives $b = -10$.'
          - problem: 'Find every value of $k$ for which the matrix $\begin{pmatrix}k&4\\4&k\end{pmatrix}$ has no inverse.'
            answer: '-4, 4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The determinant is $k\cdot k - 4\cdot 4 = k^2 - 16$. It is $0$ when $(k - 4)(k + 4) = 0$, so $k = 4$ or $k = -4$.'
          - problem: 'Does the matrix $A = \begin{pmatrix}3&5\\2&4\end{pmatrix}$ have an inverse?'
            answer: 'yes'
            answer_contract: {"kind": "label", "options": [["yes", "it has an inverse", "it is invertible", "invertible", "A has an inverse", "A is invertible", "has an inverse", "is invertible"], ["no", "it has no inverse", "it is not invertible", "not invertible", "singular", "it is singular", "A has no inverse", "A is not invertible"]]}
            solution_sketch: 'Compute $ad - bc = 3\cdot 4 - 5\cdot 2 = 12 - 10 = 2$. This is not $0$, so the inverse formula works and $A$ has an inverse.'
          - problem: 'A program moves the point $(x, y)$ to the point $(3x - 2y,\ kx + 4y)$. For which value of $k$ does it squash the whole plane onto a line, so that no matrix can undo the move?'
            answer: '-6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The move is multiplication by $\begin{pmatrix}3&-2\\k&4\end{pmatrix}$, and it can be undone only if this matrix has an inverse. The determinant is $3\cdot 4 - (-2)k = 12 + 2k$, which is $0$ when $k = -6$.'
        constraints: "singularity via proportional rows or ad - bc = 0; integer k answers"
