unit: abstract-vector-spaces
course: linear-algebra
module: "Abstract Vector Spaces"
topics:
  - id: vector-space-axioms
    name: Vector Spaces and Their Axioms
    core: true                 # the abstract-example and basis-over-a-field topics build on it, and abstract-algebra (field extensions) assumes it
    difficulty: 0.65
    drill: false
    answer_kind: numeric
    expected_time_secs: 210
    prerequisites:
      - id: subspace-test
        weight: 0.6
        key: true
      - id: vectors-in-rn
        weight: 0.5
        key: true
      - id: exponent-product-quotient-rules
        weight: 0.3
      - id: complex-numbers
        weight: 0
    knowledge_points:
      - id: kp1
        name: Scalar fields and the axiom list
        key_prerequisites: [vectors-in-rn]
        step_check:
          step: 'computing each side separately'
          question: 'Why do we compute the two sides of the axiom separately?'
          options:
            - 'The left side needs vector addition, but the right side needs no addition'
            - 'The two sides are different vectors, so we measure how far apart they are'
            - 'The axiom is an equation, so we find each side alone and then compare them'
            - 'Only the right side can be computed, so the left side is defined to match it'
          answer: 'The axiom is an equation, so we find each side alone and then compare them'
          why: 'An axiom states that two expressions are equal, so the check is to evaluate both and see that the same vector comes out.'
        exemplars:
          - problem: 'Each of the sets $\mathbb{Z}$, $\mathbb{Q}$, $\mathbb{R}$ and $\mathbb{C}$, with the usual addition and multiplication, is a candidate for the scalars of a vector space. Which one of them is not a field?'
            answer: 'the integers'
            answer_contract: {"kind":"label","options":[["the integers","integers","Z","the integer numbers","the integers are not a field","Z is not a field","the set of integers","ℤ"],["the rationals","rationals","Q","the rational numbers"],["the reals","reals","R","the real numbers"],["the complex numbers","complex numbers","C","the complexes"]]}
            solution_sketch: 'A field needs a multiplicative inverse for every nonzero element. In the integers the element $2$ has no inverse, because $1/2$ is not an integer, so the integers are not a field. The rationals, the reals and the complex numbers contain $1/a$ for every nonzero $a$ and pass the other requirements as well.'
          - problem: 'In $\mathbb{R}^2$ take $c = 2$, $\mathbf{u} = (1, -2)$ and $\mathbf{v} = (0, 1)$. Compute $c(\mathbf{u} + \mathbf{v})$, the left side of the axiom $c(\mathbf{u} + \mathbf{v}) = c\mathbf{u} + c\mathbf{v}$.'
            answer: '(2, -2)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'Add the vectors componentwise: $\mathbf{u} + \mathbf{v} = (1, -2) + (0, 1) = (1, -1)$. Then scale each entry by $2$, which gives $(2, -2)$.'
          - problem: 'Two spice blends, measured in grams of salt, pepper and paprika, are $\mathbf{u} = (2, 1, 0)$ and $\mathbf{v} = (1, 3, 2)$. A cook mixes one portion of each blend and then prepares three batches of the mixture. How many grams of salt, pepper and paprika does she use in total?'
            answer: '(9, 12, 6)'
            answer_contract: {"kind":"coordinates","arity":3}
            solution_sketch: 'One portion of the mixture is $\mathbf{u} + \mathbf{v} = (3, 4, 2)$. Three batches use $3(3, 4, 2) = (9, 12, 6)$ grams. The axiom $c(\mathbf{u} + \mathbf{v}) = c\mathbf{u} + c\mathbf{v}$ says that three batches of each blend, added together, give the same total.'
          - problem: 'The integers modulo $5$, with addition and multiplication taken modulo $5$, form a field. Find the multiplicative inverse of $3$ in this field.'
            answer: '2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The inverse of $3$ is the element $w$ with $3w$ leaving remainder $1$ on division by $5$. Since $3 \cdot 2 = 6$ and $6 = 5 + 1$, the element $2$ works. No other element of the field fits, so the inverse is $2$.'
          - problem: 'The nonnegative rational numbers, with the usual addition and multiplication, are proposed as the scalars of a vector space. Which field requirement fails for this set?'
            answer: 'additive inverses'
            answer_contract: {"kind":"label","options":[["additive inverses","additive inverse","negatives","existence of negatives","no additive inverses","the additive inverses","the additive inverse axiom"],["closure under addition","closure","closed under addition"],["multiplicative inverses","multiplicative inverse","reciprocals"],["commutativity of multiplication","commutativity","commutative law"]]}
            solution_sketch: 'Sums of nonnegative rationals stay nonnegative, each positive rational $q$ has the inverse $1/q$, and products commute. The requirement that fails is additive inverses: for $1$ there is no nonnegative $w$ with $1 + w = 0$. Hence the answer is additive inverses.'
          - problem: 'A crate is moved by the displacement $\mathbf{u} = (3, -1)$ metres. A first conveyor stretches every displacement by the factor $2$, and a second conveyor then stretches it by the factor $3$. What is the total displacement of the crate?'
            answer: '(18, -6)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'The first conveyor gives $2\mathbf{u} = (6, -2)$ and the second gives $3(6, -2) = (18, -6)$. The axiom $c(d\mathbf{u}) = (cd)\mathbf{u}$ says the same result comes from the single factor $6$, since $6(3, -1) = (18, -6)$.'
          - problem: 'In $\mathbb{R}^2$ the additive-inverse axiom says that every vector $\mathbf{u}$ has a vector $\mathbf{w}$ with $\mathbf{u} + \mathbf{w} = (0, 0)$. Find $\mathbf{w}$ for $\mathbf{u} = (3, -1)$.'
            answer: '(-3, 1)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'Solve componentwise: $3 + x = 0$ gives $x = -3$, and $-1 + y = 0$ gives $y = 1$. The required vector is $(-3, 1)$.'
          - problem: 'In $\mathbb{R}^2$ take $c = -1$, $d = 2$ and $\mathbf{u} = (-1, 0)$. Compute $c(d\mathbf{u})$, the left side of the axiom $c(d\mathbf{u}) = (cd)\mathbf{u}$.'
            answer: '(2, 0)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'First scale by the inner scalar: $d\mathbf{u} = 2(-1, 0) = (-2, 0)$. Then apply the outer scalar: $c(d\mathbf{u}) = -1 \cdot (-2, 0) = (2, 0)$.'
          - problem: 'A mixture of three ingredients has the quantities $\mathbf{u} = (6, 9, 12)$ grams. The mixture is divided into three equal portions. What are the quantities in one portion?'
            answer: '(2, 3, 4)'
            answer_contract: {"kind":"coordinates","arity":3}
            solution_sketch: 'Dividing into three equal portions means multiplying by the scalar $1/3$, which exists because the scalars form a field. So one portion is $\tfrac13(6, 9, 12) = (2, 3, 4)$ grams.'
        constraints: "field questions use Z, Q, R, C or the integers modulo 5; axiom checks in R^2 and R^3 with integer entries"
      - id: kp2
        name: Verifying and refuting the axioms in unfamiliar sets
        key_prerequisites: [subspace-test]
        step_check:
          step: 'pin it down with a concrete counterexample'
          question: 'Why is one concrete vector enough to show that the identity axiom fails?'
          options:
            - 'An axiom must hold for every vector, so one vector where it fails breaks it'
            - 'The axiom is only ever tested on one vector, so a single check settles it'
            - 'A counterexample also proves that the other axioms hold, so no more tests are needed'
            - 'The vector $(3, 5)$ is the only vector for which the axiom could fail'
          answer: 'An axiom must hold for every vector, so one vector where it fails breaks it'
          why: 'The axioms are demands for all vectors and all scalars, so one input that violates an axiom is a complete refutation.'
        exemplars:
          - problem: 'Let $V = \mathbb{R}^2$ with the usual addition but with the scalar multiplication $c \odot (x, y) = (cx, 0)$. Then $V$ is not a vector space. Which axiom fails?'
            answer: 'the axiom 1v = v'
            answer_contract: {"kind":"label","options":[["the axiom 1v = v","1v = v","1 times v equals v","identity axiom","the identity axiom","scalar identity","1·v = v","1 v = v"],["the distributive law c(u + w) = cu + cw","c(u + w) = cu + cw","distributive law","distributivity"],["commutativity of addition","u + w = w + u","commutative law","commutativity"],["associativity of addition","(u + w) + t = u + (w + t)","associative law","associativity"]]}
            solution_sketch: 'The addition is the usual one, so commutativity and associativity of addition hold. The distributive law holds too, because $c \odot ((x, y) + (u, v)) = (c(x + u), 0) = (cx, 0) + (cu, 0)$. For the identity axiom, $1 \odot (2, 3) = (2, 0)$, which differs from $(2, 3)$, so the axiom $1\mathbf{v} = \mathbf{v}$ fails.'
          - problem: 'Growth factors are positive numbers that combine by multiplication, so they form a vector space $V = \mathbb{R}^{>0}$ with $x \oplus y = xy$ and $c \odot x = x^c$. Two funds grow by the factors $3$ and $4$ per year, and both are held for $2$ years. What is the growth factor of the two funds held together over the two years, that is, $2 \odot (3 \oplus 4)$?'
            answer: '144'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'First $3 \oplus 4 = 3 \cdot 4 = 12$, the yearly factor of the two funds together. Then $2 \odot 12 = 12^2 = 144$. The distributive axiom gives the same value from $3^2 \cdot 4^2 = 9 \cdot 16 = 144$.'
          - problem: 'In $V = \mathbb{R}^{>0}$ with $x \oplus y = xy$ and $c \odot x = x^c$, which positive number is the zero vector?'
            answer: '1'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The zero vector $\mathbf{z}$ must satisfy $x \oplus \mathbf{z} = x$ for every $x$. That means $x \cdot \mathbf{z} = x$, so $\mathbf{z} = 1$.'
          - problem: 'Let $V = \mathbb{R}^2$ with the modified addition $(x, y) \oplus (u, v) = (x + u,\ y + v + 1)$. The zero vector is the element $\mathbf{z}$ with $(x, y) \oplus \mathbf{z} = (x, y)$ for every $(x, y)$. Find $\mathbf{z}$.'
            answer: '(0, -1)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'Write $\mathbf{z} = (a, b)$. Then $(x + a,\ y + b + 1) = (x, y)$ for every $(x, y)$, so $a = 0$ and $b = -1$. Check: $(x, y) \oplus (0, -1) = (x, y - 1 + 1) = (x, y)$.'
          - problem: 'In the vector space $V = \mathbb{R}^{>0}$ with $x \oplus y = xy$ and $c \odot x = x^c$, the additive inverse of $x$ is the element $y$ for which $x \oplus y$ is the zero vector, that is, no growth at all. A population grows by the factor $4$ in one year. By which factor must it change in the next year to return to its original size?'
            answer: '1/4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The zero vector of $V$ is $1$, so we need $4 \oplus y = 4y = 1$. Hence $y = 1/4$, a decrease to a quarter of the size. Dividing by $4$ undoes multiplying by $4$.'
          - problem: 'Let $V = \mathbb{R}^2$ with the modified addition $(x, y) \oplus (u, v) = (x + u - 3,\ y + v + 2)$. Find the additive inverse of $(1, 1)$ in $V$.'
            answer: '(5, -5)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'The zero vector $(a, b)$ satisfies $(x + a - 3,\ y + b + 2) = (x, y)$, so it is $(3, -2)$. The inverse $(p, q)$ of $(1, 1)$ satisfies $(1 + p - 3,\ 1 + q + 2) = (3, -2)$. Hence $p = 5$ and $q = -5$.'
          - problem: 'In $V = \mathbb{R}^{>0}$ with $x \oplus y = xy$ and $c \odot x = x^c$, consider the axiom $c \odot (x \oplus y) = (c \odot x) \oplus (c \odot y)$. Compute the left side for $c = 3$, $x = 2$ and $y = 5$.'
            answer: '1000'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'First $x \oplus y = 2 \cdot 5 = 10$. Then $c \odot 10 = 10^3 = 1000$. The right side gives $2^3 \cdot 5^3 = 8 \cdot 125 = 1000$ as well, so the axiom holds for these values.'
          - problem: 'In $V = \mathbb{R}^{>0}$ with $x \oplus y = xy$ and $c \odot x = x^c$, consider the axiom $(c + d) \odot x = (c \odot x) \oplus (d \odot x)$. Compute the right side for $c = 2$, $d = 3$ and $x = 2$.'
            answer: '32'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'We have $2 \odot 2 = 2^2 = 4$ and $3 \odot 2 = 2^3 = 8$. Their $\oplus$ sum is $4 \cdot 8 = 32$. The left side gives $5 \odot 2 = 2^5 = 32$ as well.'
          - problem: 'In $V = \mathbb{R}^{>0}$ with $x \oplus y = xy$ and $c \odot x = x^c$, find the additive inverse of a general element $x$.'
            answer: '1/x'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The zero vector is $1$, so the inverse $y$ of $x$ satisfies $x \oplus y = xy = 1$. Hence $y = 1/x$. Check: $x \cdot (1/x) = 1$ for every positive $x$.'
          - problem: 'Let $V = \mathbb{R}^2$ with the usual addition and the scalar multiplication $c \odot (x, y) = (cx, y)$. Then $V$ is not a vector space. Which axiom fails?'
            answer: 'the axiom (c + d)v = cv + dv'
            answer_contract: {"kind":"label","options":[["the axiom 1v = v","1v = v","identity axiom","the identity axiom"],["the axiom c(u + w) = cu + cw","c(u + w) = cu + cw","distributive law over vectors","distributivity over vectors"],["the axiom (c + d)v = cv + dv","(c + d)v = cv + dv","distributive law over scalars","distributivity over scalars"],["the axiom c(dv) = (cd)v","c(dv) = (cd)v","compatibility of scalars","compatibility axiom"]]}
            solution_sketch: 'We have $1 \odot (x, y) = (x, y)$, and $c \odot (d \odot (x, y)) = (cdx, y) = (cd) \odot (x, y)$. Also $c \odot ((x, y) + (u, v)) = (c(x + u), y + v)$ equals $c \odot (x, y) + c \odot (u, v)$. For the scalar sum, $(c + d) \odot (x, y) = ((c + d)x, y)$ but $c \odot (x, y) + d \odot (x, y) = ((c + d)x, 2y)$, which differs when $y \neq 0$, so $(c + d)v = cv + dv$ fails.'
        constraints: "modified operations on R^2 or R^>0 only; each failure pinned to one named axiom with a concrete counterexample"
      - id: kp3
        name: First consequences of the axioms
        key_prerequisites: [subspace-test]
        step_check:
          step: 'Distributivity of scalar addition over vectors'
          question: 'Why can $a\mathbf{v} + (-a)\mathbf{v}$ be rewritten as $(a + (-a))\mathbf{v}$?'
          options:
            - 'Scalar multiplication is commutative, so the two scalars may be swapped past $\mathbf{v}$'
            - 'Distributivity over scalar addition, read backwards, factors out the vector $\mathbf{v}$'
            - 'Vector addition is associative, so the brackets around the two terms can be moved'
            - 'The additive-inverse axiom says $(-a)\mathbf{v}$ cancels the term $a\mathbf{v}$ directly'
          answer: 'Distributivity over scalar addition, read backwards, factors out the vector $\mathbf{v}$'
          why: 'The law $(c + d)\mathbf{v} = c\mathbf{v} + d\mathbf{v}$ read from right to left collects two multiples of the same vector into one.'
        exemplars:
          - problem: 'Let $V$ be the set $\mathbb{R}$ with the operations $x \oplus y = x + y - 1$ and $c \odot x = cx - c + 1$. Find the zero vector of $V$.'
            answer: '1'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The zero vector $z$ satisfies $x \oplus z = x$ for every $x$, so $x + z - 1 = x$ and $z = 1$. As a check, $0 \odot x = 0 - 0 + 1 = 1$, so the scalar $0$ turns every vector into the zero vector, as the axioms require.'
          - problem: 'A robot arm moves its tool by the displacement $\mathbf{u} = (4, -7)$ millimetres. What displacement undoes this move?'
            answer: '(-4, 7)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'The move that undoes $\mathbf{u}$ is the additive inverse of $\mathbf{u}$. It equals $(-1)\mathbf{u} = (-4, 7)$, because $\mathbf{u} + (-1)\mathbf{u} = (1 + (-1))\mathbf{u} = 0\mathbf{u} = \mathbf{0}$.'
          - problem: 'Let $V$ be $\mathbb{R}$ with the operations $x \oplus y = x + y + 3$ and $c \odot x = cx + 3c - 3$. Find the additive inverse of $5$ in $V$.'
            answer: '-11'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The zero vector $z$ satisfies $x + z + 3 = x$, so $z = -3$. The inverse $w$ of $5$ satisfies $5 \oplus w = z$, that is $5 + w + 3 = -3$. Solving gives $w = -11$.'
          - problem: 'A depot holds a stock $\mathbf{x}$ of three materials, measured in tonnes. After three crates, each holding $\mathbf{u} = (1, 1, 0)$ tonnes, are added, the depot holds the same amount as two crates, each holding $\mathbf{v} = (3, 2, 1)$ tonnes. Solve $\mathbf{x} + 3\mathbf{u} = 2\mathbf{v}$ for the original stock $\mathbf{x}$.'
            answer: '(3, 1, 2)'
            answer_contract: {"kind":"coordinates","arity":3}
            solution_sketch: 'Add the inverse of $3\mathbf{u}$ to both sides, which gives $\mathbf{x} = 2\mathbf{v} - 3\mathbf{u}$. Then $2\mathbf{v} = (6, 4, 2)$ and $3\mathbf{u} = (3, 3, 0)$, so $\mathbf{x} = (3, 1, 2)$ tonnes.'
          - problem: 'Let $V$ be $\mathbb{R}^2$ with $(a, b) \oplus (c, d) = (a + c,\ b + d + 1)$ and $t \odot (a, b) = (ta,\ tb + t - 1)$. Find the zero vector of $V$.'
            answer: '(0, -1)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'Write the zero vector as $(p, q)$. The identity axiom gives $(a + p,\ b + q + 1) = (a, b)$, so $p = 0$ and $q = -1$. As a check, $0 \odot (a, b) = (0, -1)$, the same vector.'
          - problem: 'Let $V$ be $\mathbb{R}^2$ with $(a, b) \oplus (c, d) = (a + c,\ b + d + 1)$ and $t \odot (a, b) = (ta,\ tb + t - 1)$. Find the additive inverse of $(3, 4)$ in $V$.'
            answer: '(-3, -6)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'The zero vector of $V$ is $(0, -1)$. The inverse $(u, v)$ of $(3, 4)$ satisfies $(3 + u,\ 4 + v + 1) = (0, -1)$. Hence $u = -3$ and $v = -6$.'
          - problem: 'In a vector space, the vectors $\mathbf{u}$, $\mathbf{v}$ and $\mathbf{x}$ satisfy $\mathbf{x} + 2\mathbf{u} = 3\mathbf{v}$. Solve for $\mathbf{x}$ in terms of $\mathbf{u}$ and $\mathbf{v}$.'
            answer: '3v - 2u'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Add the additive inverse of $2\mathbf{u}$ to both sides. Associativity and the inverse axiom reduce the left side to $\mathbf{x}$, and the right side becomes $3\mathbf{v} - 2\mathbf{u}$. Hence $\mathbf{x} = 3\mathbf{v} - 2\mathbf{u}$.'
          - problem: 'The complex numbers form a vector space over $\mathbb{R}$, and in every vector space $(-1)\mathbf{z} = -\mathbf{z}$. Compute $(-1)z$ for $z = 4 - 7i$.'
            answer: '-4+7i'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Multiplying by the scalar $-1$ gives the additive inverse. Negating the real part and the imaginary part of $4 - 7i$ gives $-4 + 7i$.'
          - problem: 'Let $V$ be the set $\mathbb{R}$ with the operations $x \oplus y = x + y - 1$ and $c \odot x = cx - c + 1$. Compute $0 \odot 7$.'
            answer: '1'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'By the definition, $0 \odot 7 = 0 \cdot 7 - 0 + 1 = 1$. This is the zero vector of $V$, in agreement with the general fact that $0\mathbf{v} = \mathbf{0}$.'
        constraints: "axiom manipulations of two or three lines; modified operations on R or R^2; each step cites the axiom used"
    diagnostic_exemplar:
      problem: 'Let $V = \mathbb{R}^{>0}$ with $x \oplus y = xy$ and $c \odot x = x^c$. Identify the zero vector and the additive inverse of $x$, then verify the axiom $(c + d) \odot x = (c \odot x) \oplus (d \odot x)$.'
      answer: 'Zero vector $1$; the additive inverse of $x$ is $1/x$; and $(c + d) \odot x = x^{c+d} = x^c x^d = (c \odot x) \oplus (d \odot x)$'
      answer_contract: {kind: none}
      solution_sketch: 'The identity for $\oplus$ is $1$ since $x \cdot 1 = x$, and $x \oplus (1/x) = 1$; the axiom is exactly the exponent law $x^{c+d} = x^cx^d$.'
    anki_seeds:
      - front: 'The scalars of a vector space must come from a...'
        back: 'field: a number system where $+, -, \times$, and division by nonzero elements all work (e.g. $\mathbb{Q}$, $\mathbb{R}$, $\mathbb{C}$).'
        type: basic
      - front: 'Quickest axiom to test when a strange scalar multiplication is proposed?'
        back: 'The identity axiom $1\mathbf{v} = \mathbf{v}$ — it fails for most artificial definitions.'
        type: basic
      - front: 'In any vector space, $0\mathbf{v} = $ ?'
        back: '$\mathbf{0}$ (provable from the axioms: $0\mathbf{v} = (0+0)\mathbf{v}$, then cancel).'
        type: basic

  - id: polynomial-matrix-function-spaces
    name: Polynomial, Matrix, and Function Spaces
    core: true                 # supplies the worked non-R^n spaces that basis/dimension over a field computes in
    difficulty: 0.65
    drill: false
    answer_kind: numeric
    expected_time_secs: 210
    prerequisites:
      - {id: transpose-symmetric-matrices, weight: 0.4, key: false} # L1: kp2 ex3 asks whether symmetric matrices form a subspace; uses (A+B)^T
      - id: vector-space-axioms
        weight: 0.7
        key: true
      - id: matrix-addition-scalar-multiplication
        weight: 0.5
        key: true
      - id: polynomial-addition-subtraction
        weight: 0.4
      - id: evaluating-functions
        weight: 0.2
    knowledge_points:
      - id: kp1
        name: Vector arithmetic in P_n, matrix spaces, and function spaces
        key_prerequisites: [polynomial-addition-subtraction, matrix-addition-scalar-multiplication]
        step_check:
          step: 'combine coefficients power by power'
          question: 'Why do we combine the coefficients power by power?'
          options:
            - 'The powers of $x$ must be added together before any coefficient is changed'
            - 'Coefficients of different powers are always equal, so any pair can be combined'
            - 'Different powers of $x$ are different directions, so only equal powers combine'
            - 'The highest power of $x$ always cancels, so the lower powers are combined first'
          answer: 'Different powers of $x$ are different directions, so only equal powers combine'
          why: 'In $P_2$ the powers $1$, $x$ and $x^2$ play the role of coordinate directions, and vectors add direction by direction.'
        exemplars:
          - problem: 'In the polynomial space $P_2$, compute $2(x^2 + 3x) - 3(x - 1)$.'
            answer: '2x^2 + 3x + 3'
            answer_contract: {"kind":"required_form","form":"expanded_polynomial"}
            solution_sketch: 'Distribute the scalars: $2(x^2 + 3x) = 2x^2 + 6x$ and $3(x - 1) = 3x - 3$. Subtract and combine like powers: $2x^2 + (6x - 3x) + 3 = 2x^2 + 3x + 3$.'
          - problem: 'In the matrix space $M_{2 \times 2}$, compute $2\begin{pmatrix}1&0\\2&1\end{pmatrix} - \begin{pmatrix}0&1\\1&0\end{pmatrix}$.'
            answer: '[[2,-1],[3,2]]'
            answer_contract: {"kind":"matrix","rows":2,"cols":2}
            solution_sketch: 'Matrices in $M_{2 \times 2}$ combine entry by entry. The scalar multiple is $\begin{pmatrix}2&0\\4&2\end{pmatrix}$, and subtracting the second matrix gives $\begin{pmatrix}2&-1\\3&2\end{pmatrix}$.'
          - problem: 'A shop records its weekly sales of two products in two stores as the matrix $S = \begin{pmatrix}4&2\\1&5\end{pmatrix}$, where rows are products and columns are stores. The forecast for a holiday week is three times $S$, less the returns matrix $R = \begin{pmatrix}1&0\\2&1\end{pmatrix}$. Find the forecast matrix $3S - R$.'
            answer: '[[11,6],[1,14]]'
            answer_contract: {"kind":"matrix","rows":2,"cols":2}
            solution_sketch: 'Scale first: $3S = \begin{pmatrix}12&6\\3&15\end{pmatrix}$. Subtract $R$ entry by entry: $12 - 1 = 11$, $6 - 0 = 6$, $3 - 2 = 1$ and $15 - 1 = 14$. The forecast matrix is $\begin{pmatrix}11&6\\1&14\end{pmatrix}$.'
          - problem: 'The monthly cost, in thousands of dollars, of running for $x$ hundred hours is $C_A(x) = x^2 + 3x + 2$ at plant A and $C_B(x) = 2x + 5$ at plant B. Plant A runs two shifts, so its cost is doubled. Find the total cost function $2C_A + C_B$.'
            answer: '2x^2 + 8x + 9'
            answer_contract: {"kind":"required_form","form":"expanded_polynomial"}
            solution_sketch: 'Doubling gives $2C_A(x) = 2x^2 + 6x + 4$. Adding $C_B(x) = 2x + 5$ and combining like powers gives $2x^2 + 8x + 9$.'
          - problem: 'In the polynomial space $P_3$, compute $3(x^3 - x + 2) - 2(x^3 - 2x + 1)$.'
            answer: 'x^3 + x + 4'
            answer_contract: {"kind":"required_form","form":"expanded_polynomial"}
            solution_sketch: 'Distribute the scalars: $3(x^3 - x + 2) = 3x^3 - 3x + 6$ and $-2(x^3 - 2x + 1) = -2x^3 + 4x - 2$. Combine like powers: $3x^3 - 2x^3 = x^3$, $-3x + 4x = x$ and $6 - 2 = 4$.'
          - problem: 'In the matrix space $M_{2 \times 2}$, let $A = \begin{pmatrix}1&3\\1&0\end{pmatrix}$, $B = \begin{pmatrix}0&-1\\1&2\end{pmatrix}$ and $C = \begin{pmatrix}2&1\\-1&0\end{pmatrix}$. Compute $A + 2B - C$.'
            answer: '[[-1,0],[4,4]]'
            answer_contract: {"kind":"matrix","rows":2,"cols":2}
            solution_sketch: 'First $2B = \begin{pmatrix}0&-2\\2&4\end{pmatrix}$, so $A + 2B = \begin{pmatrix}1&1\\3&4\end{pmatrix}$. Subtracting $C$ entry by entry gives $\begin{pmatrix}-1&0\\4&4\end{pmatrix}$.'
          - problem: 'Two plants have the cost functions $C_A(x) = x^2 + 4x + 6$ and $C_B(x) = x^2 + 2x + 2$, in thousands of dollars. What is the average of the two cost functions?'
            answer: 'x^2 + 3x + 4'
            answer_contract: {"kind":"required_form","form":"expanded_polynomial"}
            solution_sketch: 'The sum is $C_A + C_B = 2x^2 + 6x + 8$. The average is half of the sum, so we divide each coefficient by $2$ and get $x^2 + 3x + 4$.'
          - problem: 'Let $V$ be the space of all real-valued functions with pointwise addition and scalar multiplication. For $f(x) = x^2 + x$ and $g(x) = x - 3$, compute $2f - g$.'
            answer: '2x^2 + x + 3'
            answer_contract: {"kind":"required_form","form":"expanded_polynomial"}
            solution_sketch: 'Operations in a function space act pointwise, so $(2f - g)(x) = 2(x^2 + x) - (x - 3)$. This equals $2x^2 + 2x - x + 3 = 2x^2 + x + 3$.'
          - problem: 'In the polynomial space $P_3$, consider $k(x^2 - 2x + 1) + (2x^2 - 4x + 2)$ for a scalar $k$. Find the value of $k$ for which the result is the zero polynomial.'
            answer: '-2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The zero polynomial has every coefficient equal to $0$. The $x^2$ coefficient gives $k + 2 = 0$, the $x$ coefficient gives $-2k - 4 = 0$ and the constant gives $k + 2 = 0$. All three agree on $k = -2$.'
        constraints: "P_n with n <= 3, 2x2 matrices and pointwise functions; integer coefficients in -6..6; contexts need a scalar multiple, a difference or an average"
      - id: kp2
        name: The subspace test in abstract spaces
        key_prerequisites: [vector-space-axioms]
        step_check:
          step: 'Then $(cp)(3) = c \cdot p(3) = c \cdot 0 = 0$'
          question: 'Why does $(cp)(3)$ equal $c \cdot p(3)$?'
          options:
            - 'The scalar $c$ is substituted for $x$, so $cp$ at $3$ becomes $c$ times $3$'
            - 'Evaluation at $3$ reverses the order of the product, so $c$ moves to the front'
            - 'Every polynomial in $S$ is zero at $3$, so $c$ can be chosen freely'
            - 'Polynomials are scaled value by value, so $cp$ at $3$ is $c$ times $p(3)$'
          answer: 'Polynomials are scaled value by value, so $cp$ at $3$ is $c$ times $p(3)$'
          why: 'The polynomial $cp$ is defined by $(cp)(x) = c \cdot p(x)$ for every $x$, and $x = 3$ is one such value.'
        exemplars:
          - problem: 'Let $W$ be the set of polynomials $p$ in $P_2$ with $p(1) = 0$. Is $W$ a subspace of $P_2$?'
            answer: 'yes'
            answer_contract: {"kind":"label","options":[["yes","it is a subspace","subspace","it is","yes it is a subspace","yes, it is a subspace","W is a subspace","yes, it is"],["no","it is not a subspace","not a subspace","it is not","no it is not a subspace","no, it is not a subspace","W is not a subspace","no, it is not"]]}
            solution_sketch: 'The zero polynomial has value $0$ at $1$, so it lies in $W$. If $p(1) = q(1) = 0$, then $(p + q)(1) = 0 + 0 = 0$ and $(cp)(1) = c \cdot 0 = 0$. Both closure laws hold, so $W$ is a subspace.'
          - problem: 'A lab accepts a calibration curve $p$ in $P_2$ only when its reading at $x = 0$ is the reference value $2$. The curves $p(x) = x^2 + 2$ and $q(x) = 4x + 2$ are accepted. What reading does the combined curve $p + q$ give at $x = 0$?'
            answer: '4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Curves are added value by value, so $(p + q)(0) = p(0) + q(0) = 2 + 2 = 4$. The reading $4$ is not the reference value $2$, so the sum of two accepted curves is not accepted.'
          - problem: 'Let $W$ be the set of polynomials in $P_2$ of degree exactly $2$. The polynomials $p(x) = x^2 + 3$ and $q(x) = -x^2 + 2x$ both belong to $W$. What is the degree of $p + q$?'
            answer: '1'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The sum is $p + q = (x^2 + 3) + (-x^2 + 2x) = 2x + 3$. Its degree is $1$, so $p + q$ is not in $W$ and $W$ is not closed under addition.'
          - problem: 'Let $W$ be the set of $2 \times 2$ matrices with determinant $0$. Is $W$ a subspace of $M_{2 \times 2}$?'
            answer: 'no'
            answer_contract: {"kind":"label","options":[["yes","it is a subspace","subspace","it is","yes it is a subspace","yes, it is a subspace","W is a subspace","yes, it is"],["no","it is not a subspace","not a subspace","it is not","no it is not a subspace","no, it is not a subspace","W is not a subspace","no, it is not"]]}
            solution_sketch: 'The matrices $\begin{pmatrix}1&0\\0&0\end{pmatrix}$ and $\begin{pmatrix}0&0\\0&2\end{pmatrix}$ both have determinant $0$. Their sum is $\begin{pmatrix}1&0\\0&2\end{pmatrix}$, which has determinant $2$. So addition is not closed and $W$ is not a subspace.'
          - problem: 'A tax schedule is a polynomial $T$ in $P_2$, where $T(x)$ is the tax on the income $x$ thousand dollars. A schedule is called balanced when $T(1) = 0$. The schedules $p(x) = x^2 - x$ and $q(x) = 3x - 3$ are balanced. What is $(2p - 5q)(1)$?'
            answer: '0'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Combinations are evaluated value by value, so $(2p - 5q)(1) = 2p(1) - 5q(1) = 2 \cdot 0 - 5 \cdot 0 = 0$. The new schedule is balanced again, which shows that balanced schedules are closed under linear combinations.'
          - problem: 'The matrices $A = \begin{pmatrix}1&2\\2&3\end{pmatrix}$ and $B = \begin{pmatrix}0&4\\4&-1\end{pmatrix}$ are symmetric. Compute $3A - B$.'
            answer: '[[3,2],[2,10]]'
            answer_contract: {"kind":"matrix","rows":2,"cols":2}
            solution_sketch: 'First $3A = \begin{pmatrix}3&6\\6&9\end{pmatrix}$. Subtracting $B$ entry by entry gives $\begin{pmatrix}3&2\\2&10\end{pmatrix}$. The result is symmetric again, as the identity $(3A - B)^T = 3A^T - B^T$ predicts.'
          - problem: 'Let $W$ be the set of polynomials $p$ in $P_2$ with $p(0) = 5$. The polynomials $p(x) = 2x + 5$ and $q(x) = x^2 + 5$ both belong to $W$. Compute $(p + q)(0)$.'
            answer: '10'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'We have $(p + q)(0) = p(0) + q(0) = 5 + 5 = 10$. The value $10$ is not $5$, so $p + q$ is not in $W$ and $W$ is not a subspace. The zero polynomial also fails, since it has value $0$ at $0$.'
          - problem: 'Let $A = \begin{pmatrix}1&1\\1&1\end{pmatrix}$ and $B = \begin{pmatrix}1&0\\0&0\end{pmatrix}$, two matrices of determinant $0$. Compute $\det(A + B)$.'
            answer: '1'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The sum is $A + B = \begin{pmatrix}2&1\\1&1\end{pmatrix}$. Its determinant is $2 \cdot 1 - 1 \cdot 1 = 1$, not $0$. So the matrices of determinant $0$ are not closed under addition.'
        constraints: "conditions on P_2 or 2x2 matrices; failures exhibited by one concrete counterexample; at most two verdict items"
      - id: kp3
        name: Linear combinations and span in abstract spaces
        key_prerequisites: [polynomial-addition-subtraction, vector-space-axioms]
        step_check:
          step: 'Match the $x$ coefficient'
          question: 'Why does matching the $x$ coefficient give $c_2$ directly?'
          options:
            - 'The $x$ coefficient of the target is always the second unknown, whatever $p_1$ is'
            - 'Only $p_2 = x + 2$ has an $x$ term, since $p_1 = x^2 + 1$ contains no $x$'
            - 'The value of $c_1$ is not known yet, so it cannot affect the $x$ coefficient'
            - 'Matching the $x$ coefficient is a fixed rule, and its order cannot be changed'
          answer: 'Only $p_2 = x + 2$ has an $x$ term, since $p_1 = x^2 + 1$ contains no $x$'
          why: 'The $x$ coefficient of $c_1 p_1 + c_2 p_2$ is $0 \cdot c_1 + 1 \cdot c_2$, so it equals $c_2$.'
        exemplars:
          - problem: 'In $P_2$, let $p_1 = x^2 + x$ and $p_2 = x - 2$. Find the scalars $c_1$ and $c_2$ such that $-x^2 + 2x - 6 = c_1 p_1 + c_2 p_2$.'
            answer: '(-1, 3)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'Expand $c_1(x^2 + x) + c_2(x - 2) = c_1 x^2 + (c_1 + c_2)x - 2c_2$. The $x^2$ term gives $c_1 = -1$. The $x$ term then gives $-1 + c_2 = 2$, so $c_2 = 3$, and the constant term agrees: $-2 \cdot 3 = -6$.'
          - problem: 'A firm builds quarterly budgets from two standard budgets, $B_1(x) = x^2 + 1$ and $B_2(x) = x + 3$, in thousands of dollars after $x$ quarters. A client''s budget is $4x^2 + 5x + 19$. Find the multipliers $c_1$ and $c_2$ with $4x^2 + 5x + 19 = c_1 B_1 + c_2 B_2$.'
            answer: '(4, 5)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'Expanding gives $c_1 x^2 + c_2 x + (c_1 + 3c_2)$. The $x^2$ term gives $c_1 = 4$ and the $x$ term gives $c_2 = 5$. The constant term checks: $4 + 3 \cdot 5 = 19$.'
          - problem: 'Let $A = \begin{pmatrix}1&0\\0&2\end{pmatrix}$, $B = \begin{pmatrix}0&1\\1&0\end{pmatrix}$ and $M = \begin{pmatrix}2&-3\\-3&4\end{pmatrix}$. Find $c_1$ and $c_2$ with $M = c_1 A + c_2 B$.'
            answer: '(2, -3)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'The combination is $c_1 A + c_2 B = \begin{pmatrix}c_1&c_2\\c_2&2c_1\end{pmatrix}$. The $(1,1)$ entry gives $c_1 = 2$ and the $(1,2)$ entry gives $c_2 = -3$. The $(2,2)$ entry checks: $2 \cdot 2 = 4$.'
          - problem: 'Do the polynomials $x + 1$ and $x - 1$ span $P_2$?'
            answer: 'no'
            answer_contract: {"kind":"label","options":[["yes","they span","they do span","span","yes, they span","yes they span","yes, they do"],["no","they do not span","they do not","do not span","no, they do not span","no they do not span","no, they do not"]]}
            solution_sketch: 'Any combination is $c_1(x + 1) + c_2(x - 1) = (c_1 + c_2)x + (c_1 - c_2)$, a polynomial of degree at most $1$. No combination produces $x^2$, so the two polynomials do not span $P_2$.'
          - problem: 'A caterer''s standard dish has the ingredient matrix $D = \begin{pmatrix}2&1\\3&4\end{pmatrix}$. The matrix for a tasting portion is $T = \begin{pmatrix}1&\frac{1}{2}\\\frac{3}{2}&2\end{pmatrix}$. By what scalar must $D$ be multiplied to give $T$?'
            answer: '1/2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'We need $T = cD$. The first entries give $2c = 1$, so $c = 1/2$. The other entries agree: $\tfrac12 \cdot 1 = \tfrac12$, $\tfrac12 \cdot 3 = \tfrac32$ and $\tfrac12 \cdot 4 = 2$.'
          - problem: 'In $P_2$, let $p_1 = x^2$ and $p_2 = x + 2$. The polynomial $w = x^2 + kx + 4$ lies in the span of $p_1$ and $p_2$ for exactly one integer $k$. Find $k$.'
            answer: '2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Set $c_1 x^2 + c_2(x + 2) = x^2 + kx + 4$. The $x^2$ coefficient gives $c_1 = 1$ and the constant term gives $2c_2 = 4$, so $c_2 = 2$. The $x$ coefficient gives $k = c_2 = 2$.'
          - problem: 'In the space of real functions, let $f_1 = e^{2x} + e^{x}$ and $f_2 = e^{x}$. Find $c_1$ and $c_2$ such that $3e^{2x} + e^{x} = c_1 f_1 + c_2 f_2$.'
            answer: '(3, -2)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'Expand $c_1(e^{2x} + e^{x}) + c_2 e^{x} = c_1 e^{2x} + (c_1 + c_2)e^{x}$. Matching $e^{2x}$ gives $c_1 = 3$. Matching $e^{x}$ gives $3 + c_2 = 1$, so $c_2 = -2$.'
          - problem: 'In $P_2$, let $p_1 = x^2 - x$ and $p_2 = x + 2$. Compute the linear combination $-2p_1 + 3p_2$.'
            answer: '-2x^2 + 5x + 6'
            answer_contract: {"kind":"required_form","form":"expanded_polynomial"}
            solution_sketch: 'Distribute the scalars: $-2(x^2 - x) = -2x^2 + 2x$ and $3(x + 2) = 3x + 6$. Combine like powers: $-2x^2 + (2x + 3x) + 6 = -2x^2 + 5x + 6$.'
        constraints: "2 spanning objects; coefficients found by matching one coefficient/entry at a time, with integer or simple fractional values in -4..5"
    diagnostic_exemplar:
      problem: 'Show that $W = \{p \in P_2 : p(1) = 0\}$ is a subspace of $P_2$, and write $x^2 + x - 2$ as a linear combination of $p_1 = x - 1$ and $p_2 = x^2 - 1$, both of which lie in $W$.'
      answer: 'W is a subspace (the zero polynomial satisfies p(1) = 0, and if p(1) = q(1) = 0 then (p + cq)(1) = 0); and x^2 + x - 2 = p_1 + p_2'
      answer_contract: {kind: none}
      solution_sketch: 'Evaluation at $1$ is linear, so its kernel is a subspace; matching coefficients in $a(x - 1) + b(x^2 - 1) = bx^2 + ax - (a + b)$ gives $a = b = 1$.'
    anki_seeds:
      - front: '$P_n$ denotes the vector space of...'
        back: 'polynomials of degree at most $n$ (with the zero polynomial).'
        type: basic
      - front: 'The subspace test transfers unchanged to polynomial/matrix/function spaces: check...'
        back: 'contains the zero vector; closed under addition; closed under scalar multiplication.'
        type: basic
      - front: 'The zero vector of a function space is...'
        back: 'the zero function (identically $0$), not the number $0$.'
        type: basic

  - id: basis-dimension-general-field
    name: Bases and Dimension over a Field
    core: true                 # the C-4 payload: field-extensions-degree (abstract-algebra) teaches bases over Q and will be wired here
    difficulty: 0.7
    drill: false
    answer_kind: numeric
    expected_time_secs: 240
    prerequisites:
      - id: polynomial-matrix-function-spaces
        weight: 0.7
        key: true
      - id: basis-dimension
        weight: 0.7
        key: true
      - id: linear-independence
        weight: 0.4
      - id: simplifying-radicals
        weight: 0.3
      - id: complex-numbers
        weight: 0.2
      - id: proof-by-contradiction
        weight: 0
    knowledge_points:
      - id: kp1
        name: Standard bases of polynomial and matrix spaces
        key_prerequisites: [polynomial-matrix-function-spaces, basis-dimension]
        step_check:
          step: 'Following the order $1, x, x^2$'
          question: 'Why is the coordinate vector $(-1, 4, -3)$ rather than $(-3, 4, -1)$?'
          options:
            - 'Coordinates are listed from the highest power down to the constant term'
            - 'Coordinates are sorted from the smallest coefficient to the largest one'
            - 'The order does not matter, since both lists describe the same polynomial'
            - 'Coordinates follow the basis order, so the constant term comes first'
          answer: 'Coordinates follow the basis order, so the constant term comes first'
          why: 'The coordinate list is read against the ordered basis $1, x, x^2$, so its first entry belongs to $1$ and its last entry to $x^2$.'
        exemplars:
          - problem: 'Find the coordinates of $2x^2 - x + 5$ relative to the basis $\{1, x, x^2\}$ of $P_2$.'
            answer: '(5, -1, 2)'
            answer_contract: {"kind":"coordinates","arity":3}
            solution_sketch: 'Read off the coefficients in the order of the basis: the constant term is $5$, the coefficient of $x$ is $-1$ and the coefficient of $x^2$ is $2$. The coordinates are $(5, -1, 2)$.'
          - problem: 'What is the dimension of the matrix space $M_{2 \times 3}$?'
            answer: '6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The standard basis has one matrix for each position, with a single entry $1$ in that position and $0$ elsewhere. A matrix with $2$ rows and $3$ columns has $2 \cdot 3 = 6$ positions, so the dimension is $6$.'
          - problem: 'A graphing app stores every polynomial in $P_3$ as its list of coordinates relative to the basis $\{1, x, x^2, x^3\}$. Which list does it store for $4x^3 - x + 2$?'
            answer: '(2, -1, 0, 4)'
            answer_contract: {"kind":"coordinates","arity":4}
            solution_sketch: 'The coordinates are the coefficients in the order $1, x, x^2, x^3$. The constant term is $2$, the coefficient of $x$ is $-1$, the coefficient of $x^2$ is $0$ because no such term appears, and the coefficient of $x^3$ is $4$.'
          - problem: 'A file format stores each matrix with $4$ rows as a list of numbers, one number for each matrix of the standard basis, and every such matrix uses exactly $20$ numbers. How many columns do these matrices have?'
            answer: '5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The standard basis of a matrix space with $4$ rows and $m$ columns has $4m$ matrices. Setting $4m = 20$ and dividing by $4$ gives $m = 5$ columns.'
          - problem: 'The standard basis of $M_{2 \times 2}$ consists of $E_{11}, E_{12}, E_{21}, E_{22}$, each with a single entry $1$ in the position named by its subscripts. Find the coordinates of $\begin{pmatrix}1&3\\0&-2\end{pmatrix}$ relative to this basis.'
            answer: '(1, 3, 0, -2)'
            answer_contract: {"kind":"coordinates","arity":4}
            solution_sketch: 'The matrix equals $1E_{11} + 3E_{12} + 0E_{21} + (-2)E_{22}$, so each entry is the coordinate of the basis matrix with the same position. The coordinates are $(1, 3, 0, -2)$.'
          - problem: 'The coordinates of a polynomial in $P_2$ relative to the basis $\{1, x, x^2\}$ are $(3, 0, -4)$. What is the polynomial?'
            answer: '3 - 4x^2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Coordinates $(c_1, c_2, c_3)$ mean the polynomial $c_1 + c_2 x + c_3 x^2$. Here that is $3 + 0 \cdot x + (-4)x^2 = 3 - 4x^2$.'
          - problem: 'The standard basis of $P_n$ consists of the monomials $1, x, x^2, \dots, x^n$. A certain space $P_n$ has a standard basis with $4$ vectors. Find $n$.'
            answer: '3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The basis $\{1, x, \dots, x^n\}$ contains $n + 1$ monomials. Setting $n + 1 = 4$ gives $n = 3$.'
          - problem: 'A sensor stores every polynomial of degree at most $7$ as its list of coordinates relative to the standard basis. How many numbers does one stored polynomial need?'
            answer: '8'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The standard basis of $P_7$ is $1, x, \dots, x^7$, which has $7 + 1 = 8$ vectors. The coordinate list has one entry per basis vector, so it holds $8$ numbers.'
        constraints: "P_n with n <= 7, matrix spaces up to 4 rows; coordinates are the coefficients, integers in -5..5; contexts count stored numbers"
      - id: kp2
        name: Nonstandard bases and independence in P_n
        key_prerequisites: [basis-dimension, polynomial-matrix-function-spaces]
        step_check:
          step: 'Match coefficients of each power'
          question: 'Why does the equation force every coefficient to be zero?'
          options:
            - 'A polynomial is the zero polynomial only if the coefficient of every power is zero'
            - 'The zero polynomial has the value $0$ for exactly one input, so all the unknowns vanish'
            - 'Setting $x = 0$ in a polynomial equation always makes every coefficient vanish'
            - 'The unknowns $a$, $b$ and $c$ are positive, so the sums of them cannot be zero'
          answer: 'A polynomial is the zero polynomial only if the coefficient of every power is zero'
          why: 'Two polynomials are equal exactly when their coefficients agree power by power, and here the right side has all coefficients equal to $0$.'
        exemplars:
          - problem: 'Find the coordinates of $3 + x$ relative to the basis $B = \{1 + x,\ 1 - x\}$ of $P_1$.'
            answer: '(2, 1)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'Write $3 + x = a(1 + x) + b(1 - x) = (a + b) + (a - b)x$. Matching coefficients gives $a + b = 3$ and $a - b = 1$, so $a = 2$ and $b = 1$.'
          - problem: 'A technician describes every linear trend $a + bx$ as a combination of two reference trends $r_1 = 1 + x$ and $r_2 = 1 - x$. Find the weights of $r_1$ and $r_2$ in the pure drift trend $x$.'
            answer: '(1/2, -1/2)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'Write $x = a(1 + x) + b(1 - x) = (a + b) + (a - b)x$. Matching coefficients gives $a + b = 0$ and $a - b = 1$. Adding the two equations gives $2a = 1$, so $a = 1/2$ and $b = -1/2$.'
          - problem: 'In $P_1$, consider $B = \{2 + x,\ 1 - 2x\}$. Find the coordinates of $7 + x$ relative to $B$.'
            answer: '(3, 1)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'Write $7 + x = a(2 + x) + b(1 - 2x) = (2a + b) + (a - 2b)x$. Matching coefficients gives $2a + b = 7$ and $a - 2b = 1$. Solving gives $a = 3$ and $b = 1$.'
          - problem: 'In $P_2$, consider $S = \{x^2 + kx,\ 1 + x,\ x^2 - 4\}$. Find the value of $k$ for which $S$ is linearly dependent.'
            answer: '4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Set $a(x^2 + kx) + b(1 + x) + c(x^2 - 4) = 0$. Matching coefficients gives $a + c = 0$, $ak + b = 0$ and $b - 4c = 0$. Then $a = -c$ and $b = 4c$, so $c(4 - k) = 0$. A nontrivial solution needs $c \neq 0$, so $k = 4$.'
          - problem: 'Is $\{1 + x,\ 1 - x,\ 3\}$ a basis of $P_2$?'
            answer: 'no'
            answer_contract: {"kind":"label","options":[["yes","it is a basis","a basis","it is","yes it is a basis","yes, it is a basis","yes, it is"],["no","it is not a basis","not a basis","it is not","no it is not a basis","no, it is not a basis","no, it is not"]]}
            solution_sketch: 'The dimension of $P_2$ is $3$, so a basis needs $3$ independent polynomials. But $3 = \tfrac32(1 + x) + \tfrac32(1 - x)$, so the third polynomial is a combination of the first two. The set is dependent and spans only the polynomials of degree at most $1$, so it is not a basis.'
          - problem: 'A lab has three reference curves $1 + x$, $2 + 2x$ and $3 + 3x$, and every curve it can build is a linear combination of them. What is the dimension of the space of curves it can build?'
            answer: '1'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'We have $2 + 2x = 2(1 + x)$ and $3 + 3x = 3(1 + x)$. Every combination is therefore a multiple of $1 + x$. The nonzero polynomial $1 + x$ is a basis of this space, so the dimension is $1$.'
          - problem: 'In $P_2$, consider $B = \{x^2 + 1,\ x^2 + x,\ x^2 - x\}$. Find the coordinates of $2x^2 + 3x - 1$ relative to $B$.'
            answer: '(-1, 3, 0)'
            answer_contract: {"kind":"coordinates","arity":3}
            solution_sketch: 'Write $2x^2 + 3x - 1 = a(x^2 + 1) + b(x^2 + x) + c(x^2 - x)$, which expands to $(a + b + c)x^2 + (b - c)x + a$. The constant term gives $a = -1$. Then $b - c = 3$ and $b + c = 3$, so $b = 3$ and $c = 0$.'
          - problem: 'In $P_2$, consider $S = \{x^2 + x,\ x^2 + 1,\ x\}$. Find the dimension of its span.'
            answer: '3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Set $a(x^2 + x) + b(x^2 + 1) + cx = 0$. Matching coefficients gives $a + b = 0$, $a + c = 0$ and $b = 0$. Hence $b = 0$, $a = 0$ and $c = 0$, so the three polynomials are independent and span a space of dimension $3$.'
        constraints: "candidate sets of 2-3 polynomials in P_1 or P_2; coefficient matching yields a 2x2 or 3x3 linear system with integer or simple fractional solutions"
      - id: kp3
        name: The base field matters
        key_prerequisites: [basis-dimension, simplifying-radicals]
        step_check:
          step: 'contradicting the fact that $\sqrt{3}$ is irrational'
          question: 'Why does the equation $\sqrt{3} = -a/b$ lead to a contradiction?'
          options:
            - 'Dividing by $b$ is not allowed, because $b$ is a rational number'
            - 'A quotient of rationals is rational, but $\sqrt{3}$ is not'
            - 'The number $\sqrt{3}$ is larger than every rational number $-a/b$'
            - 'The equation holds for $a = 0$ only, and then $b$ must vanish too'
          answer: 'A quotient of rationals is rational, but $\sqrt{3}$ is not'
          why: 'A quotient $-a/b$ of two rational numbers is rational, so it cannot equal the irrational number $\sqrt{3}$.'
        exemplars:
          - problem: 'The field $\mathbb{Q}(\sqrt{2}) = \{a + b\sqrt{2} : a, b \text{ rational}\}$ is a vector space over $\mathbb{Q}$ with the basis $\{1, \sqrt{2}\}$. Find the coordinates of $4 - 3\sqrt{2}$ relative to this basis.'
            answer: '(4, -3)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'Write $4 - 3\sqrt{2} = 4 \cdot 1 + (-3)\sqrt{2}$. The coefficients are rational and unique, so the coordinates are $(4, -3)$.'
          - problem: 'A computer algebra system stores every number $a + b\sqrt{2}$ with $a$ and $b$ rational as the pair $(a, b)$. What pair does it store for the product $(3 + \sqrt{2})(1 - \sqrt{2})$?'
            answer: '(1, -2)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'Expand the product using $\sqrt{2} \cdot \sqrt{2} = 2$: $(3 + \sqrt{2})(1 - \sqrt{2}) = 3 - 3\sqrt{2} + \sqrt{2} - 2$. The rational part is $3 - 2 = 1$ and the $\sqrt{2}$ part is $-3 + 1 = -2$. The stored pair is $(1, -2)$.'
          - problem: 'An engineer writes every complex impedance as $a + bi$ with $a$ and $b$ real, and treats the impedances as a vector space over $\mathbb{R}$ with the basis $\{1, i\}$. Find the coordinates of the impedance $4 + 7i$.'
            answer: '(4, 7)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'Write $4 + 7i = 4 \cdot 1 + 7 \cdot i$. The numbers $1$ and $i$ are independent over $\mathbb{R}$, because $i$ is not a real number, so the coordinates $(4, 7)$ are unique.'
          - problem: 'Let $F = \{a + b\sqrt{2} : a, b \text{ rational}\}$, regarded as a vector space over $\mathbb{Q}$. What is the dimension of $F$?'
            answer: '2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Every element of $F$ is $a \cdot 1 + b\sqrt{2}$, so $\{1, \sqrt{2}\}$ spans $F$. If $a + b\sqrt{2} = 0$ with $b \neq 0$, then $\sqrt{2} = -a/b$ would be rational, which is false. So the two numbers are independent, they form a basis, and the dimension is $2$.'
          - problem: 'Mia says that $\{1, i\}$ is also a basis of $\mathbb{C}$ when $\mathbb{C}$ is regarded as a vector space over $\mathbb{C}$ itself, so the dimension is $2$. What is the correct dimension of $\mathbb{C}$ over $\mathbb{C}$?'
            answer: '1'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Over $\mathbb{C}$ the scalar $i$ is allowed, so $i = i \cdot 1$ and the set $\{1, i\}$ is dependent. Every complex number $z$ equals $z \cdot 1$, so $\{1\}$ is a basis. The dimension is $1$.'
          - problem: 'In $\mathbb{Q}(\sqrt{2})$, find the coordinates of $\dfrac{1}{1 + \sqrt{2}}$ relative to the basis $\{1, \sqrt{2}\}$ over $\mathbb{Q}$.'
            answer: '(-1, 1)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'Multiply the numerator and the denominator by $1 - \sqrt{2}$: $\dfrac{1 - \sqrt{2}}{1 - 2} = \sqrt{2} - 1$. In the basis $\{1, \sqrt{2}\}$ this is $-1 \cdot 1 + 1 \cdot \sqrt{2}$, so the coordinates are $(-1, 1)$.'
          - problem: 'In $\mathbb{Q}(\sqrt{3})$ with the basis $\{1, \sqrt{3}\}$ over $\mathbb{Q}$, a vector has the coordinates $(2, -1)$. Which number is the vector?'
            answer: '2 - sqrt(3)'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The coordinates $(2, -1)$ mean $2 \cdot 1 + (-1)\sqrt{3}$. The vector is the number $2 - \sqrt{3}$.'
          - problem: 'Consider $\mathbb{Q}(\sqrt{5}) = \{a + b\sqrt{5} : a, b \text{ rational}\}$ as a vector space over $\mathbb{Q}$ with the basis $\{1, \sqrt{5}\}$. Find the coordinates of $5 - 2\sqrt{5}$.'
            answer: '(5, -2)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'Write $5 - 2\sqrt{5} = 5 \cdot 1 + (-2)\sqrt{5}$. The numbers $1$ and $\sqrt{5}$ are independent over $\mathbb{Q}$ because $\sqrt{5}$ is irrational, so the coordinates $(5, -2)$ are unique.'
          - problem: 'A circuit simulator stores each complex number as a list of real numbers, one for each vector of a basis of $\mathbb{C}$ over $\mathbb{R}$. How long is the list?'
            answer: '2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The set $\{1, i\}$ is a basis of $\mathbb{C}$ over $\mathbb{R}$, because every $a + bi$ is a real combination of $1$ and $i$ and the two are independent. So each number needs $2$ real entries.'
        constraints: "fields limited to Q, Q(sqrt(d)) for d in {2, 3, 5}, R, C; independence arguments reduce to irrationality of sqrt(d) or to i not being real"
    diagnostic_exemplar:
      problem: 'Show that $\{1 + \sqrt{2},\ 1 - \sqrt{2}\}$ is a basis of $\mathbb{Q}(\sqrt{2})$ as a vector space over $\mathbb{Q}$, and find the coordinates of $4 - 3\sqrt{2}$ relative to it.'
      answer: 'It is a basis (the space has dimension 2 over Q, and coefficient matching a + b = 0, a - b = 0 forces a = b = 0, so the two are independent over Q); coordinates (1/2, 7/2)'
      answer_contract: {kind: none}
      solution_sketch: '$a(1 + \sqrt2) + b(1 - \sqrt2) = (a + b) + (a - b)\sqrt2$; matching rational and irrational parts gives $a + b = 4$, $a - b = -3$, so $a = 1/2$, $b = 7/2$.'
    anki_seeds:
      - front: '$\dim P_n = $ ?'
        back: '$n + 1$ (standard basis $\{1, x, \dots, x^n\}$).'
        type: basic
      - front: 'The dimension of a vector space is always relative to...'
        back: 'the base field: $\mathbb{C}$ has dimension $2$ over $\mathbb{R}$ but dimension $1$ over $\mathbb{C}$.'
        type: basic
      - front: 'Basis and dimension of $\mathbb{Q}(\sqrt{2})$ over $\mathbb{Q}$?'
        back: 'Basis $\{1, \sqrt{2}\}$; dimension $2$.'
        type: basic

  - id: dual-spaces
    name: Dual Spaces and Linear Functionals
    core: false                # enrichment: nothing downstream consumes duals yet (requirements: keep supplemental until category-theory asks for it)
    difficulty: 0.75
    drill: false
    answer_kind: numeric
    expected_time_secs: 270
    prerequisites:
      - id: linear-transformations
        weight: 0.6
        key: true
      - id: vector-space-axioms
        weight: 0.5
        key: true
      - id: basis-dimension
        weight: 0.5
      - id: polynomial-matrix-function-spaces
        weight: 0.3
      - id: coordinates-relative-basis
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: Linear functionals
        key_prerequisites: [linear-transformations]
        step_check:
          step: 'Both properties hold, so $f$ is a linear functional'
          question: 'Why must both additivity and homogeneity be checked before $f$ is called a linear functional?'
          options:
            - 'The two properties are one statement, written once for sums and once for products'
            - 'A map can pass one test and fail the other, so one test does not prove linearity'
            - 'Homogeneity alone is enough, because a functional uses only the scalar operation'
            - 'Additivity alone already forces homogeneity, but the book lists both for completeness'
          answer: 'A map can pass one test and fail the other, so one test does not prove linearity'
          why: 'A linear functional must respect both operations, and neither test replaces the other. For example, $f(x, y) = \sqrt[3]{x^3 + y^3}$ satisfies $f(cu) = c\,f(u)$ but not additivity, since $f(1, 0) + f(0, 1) = 2$ and $f(1, 1) = \sqrt[3]{2}$.'
        exemplars:
          - problem: 'The map $f(x, y) = 3x - 4y$ is a linear functional on $\mathbb{R}^2$. Find $f(5, 2)$.'
            answer: '7'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'A linear functional is evaluated by substituting the input into its formula. Here $f(5, 2) = 3 \cdot 5 - 4 \cdot 2 = 15 - 8 = 7$.'
          - problem: 'Is the map $g(x, y) = xy$ a linear functional on $\mathbb{R}^2$?'
            answer: 'no'
            answer_contract: {"kind":"label","options":[["no","it is not","not a linear functional","not linear","it is not a linear functional","g is not a linear functional","no, it is not","no, it is not a linear functional"],["yes","it is","linear functional","it is a linear functional","g is a linear functional","yes, it is","yes, it is a linear functional"]]}
            solution_sketch: 'Homogeneity fails for $g$. For the vector $(1, 1)$ we have $g(2 \cdot (1, 1)) = g(2, 2) = 4$, but $2\,g(1, 1) = 2$. Since $4 \neq 2$, the map is not a linear functional.'
          - problem: 'On the space $P_2$ of polynomials of degree at most $2$, let $E_3(p) = p(3)$. Is $E_3$ a linear functional on $P_2$?'
            answer: 'yes'
            answer_contract: {"kind":"label","options":[["yes","it is","linear functional","it is a linear functional","E_3 is a linear functional","yes, it is","yes, it is a linear functional","yes, E_3 is a linear functional"],["no","it is not","not a linear functional","not linear","it is not a linear functional","no, it is not","no, it is not a linear functional"]]}
            solution_sketch: 'For two polynomials $p$ and $q$ we have $E_3(p + q) = (p + q)(3) = p(3) + q(3) = E_3(p) + E_3(q)$. For a scalar $c$ we have $E_3(cp) = c\,p(3) = c\,E_3(p)$. Both properties hold, so $E_3$ is a linear functional.'
          - problem: 'On $P_2$ let $E_3(p) = p(3)$. Find $E_3(x^2 - 2x)$.'
            answer: '3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Substitute $x = 3$ into the polynomial. This gives $E_3(x^2 - 2x) = 3^2 - 2 \cdot 3 = 9 - 6 = 3$.'
          - problem: 'A bakery charges $3$ euros for a loaf and $2$ euros for a roll. The cost of an order of $x$ loaves and $y$ rolls is the linear functional $C(x, y) = 3x + 2y$. What is the cost of an order of $5$ loaves and $4$ rolls?'
            answer: '23'
            answer_contract: {"kind":"unit","quantity":"euro","unit":"euro","allow_omitted":true}
            solution_sketch: 'The cost is the value of the functional at $(5, 4)$. We get $C(5, 4) = 3 \cdot 5 + 2 \cdot 4 = 15 + 8 = 23$ euros.'
          - problem: 'A taxi charges $2$ euros per kilometre and $5$ euros per hour of waiting, so a ride of $k$ kilometres with $h$ hours of waiting costs $F(k, h) = 2k + 5h$ euros. A ride with $3$ hours of waiting costs $31$ euros. How many kilometres was the ride?'
            answer: '8'
            answer_contract: {"kind":"unit","quantity":"length","unit":"km","allow_omitted":true}
            solution_sketch: 'The waiting part of the fare is $5 \cdot 3 = 15$ euros. The distance part is then $31 - 15 = 16$ euros. At $2$ euros per kilometre the ride was $16 / 2 = 8$ kilometres.'
          - problem: 'A linear functional $f$ on $\mathbb{R}^2$ satisfies $f(1, 0) = 3$ and $f(0, 1) = -2$. Find $f(4, 5)$.'
            answer: '2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Write $(4, 5) = 4(1, 0) + 5(0, 1)$. Linearity gives $f(4, 5) = 4 f(1, 0) + 5 f(0, 1) = 4 \cdot 3 + 5 \cdot (-2) = 12 - 10 = 2$.'
          - problem: 'On $P_2$ let $C(p)$ be the coefficient of $x^2$ in $p$. Find $C(6x^2 + x - 2)$.'
            answer: '6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The coefficient of $x^2$ in $6x^2 + x - 2$ is read off directly. So $C(6x^2 + x - 2) = 6$.'
          - problem: 'On $\mathbb{R}^3$ define the linear functional $f(x, y, z) = 2x - y + 4z$. Find $f(1, 2, 3)$.'
            answer: '12'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Substitute the three coordinates into the formula. Then $f(1, 2, 3) = 2 \cdot 1 - 2 + 4 \cdot 3 = 2 - 2 + 12 = 12$.'
        constraints: 'functionals on R^2, R^3, or P_2 given by a formula; nonlinear counterexamples fail on one concrete scaling or sum; contexts with a cost or fare formula where one value is unknown'
      - id: kp2
        name: The dual basis
        key_prerequisites: [coordinates-relative-basis, linear-transformations]
        try_first:
          problem: 'A linear functional $f$ on $\mathbb{R}^2$ satisfies $f(2, 0) = 1$ and $f(0, 2) = 0$. What is $f(1, 0)$?'
          answer_contract: {"kind":"exact"}
          answer: '1/2'
          reveal: 'Since $(1, 0) = \frac{1}{2}(2, 0)$, linearity gives $f(1, 0) = \frac{1}{2}$. A dual basis is built from exactly this kind of condition: value $1$ on one basis vector and value $0$ on the others.'
        step_check:
          step: 'the dual basis must satisfy $f_1(1,1) = 1$, $f_1(2,1) = 0$'
          question: 'Why does the dual basis require $f_1(2,1) = 0$ and not $f_1(2,1) = 1$?'
          options:
            - 'Every functional must give $0$ on every basis vector except the very first one'
            - 'A functional on $\mathbb{R}^2$ can take the value $1$ on only one vector of the plane'
            - 'Each $f_i$ must give $1$ on its basis vector $b_i$ and $0$ on every other one'
            - 'The value of $f_1$ on the second basis vector is always minus its value on the first'
          answer: 'Each $f_i$ must give $1$ on its basis vector $b_i$ and $0$ on every other one'
          why: 'The dual basis is defined by $f_i(b_j) = 1$ when $i = j$ and $0$ otherwise. So $f_1$ takes the value $1$ on $b_1 = (1, 1)$ and the value $0$ on $b_2 = (2, 1)$.'
        exemplars:
          - problem: 'The set $B = \{(3, 1), (2, 1)\}$ is a basis of $\mathbb{R}^2$. Find the first functional $f_1$ of its dual basis, that is, the linear functional with $f_1(3, 1) = 1$ and $f_1(2, 1) = 0$.'
            answer: 'x - 2y'
            answer_contract: {"kind":"function","vars":["x","y"]}
            solution_sketch: 'Write $f_1(x, y) = ax + by$. The two conditions give $3a + b = 1$ and $2a + b = 0$. Subtracting gives $a = 1$, and then $b = -2$, so $f_1(x, y) = x - 2y$.'
          - problem: 'Let $\{f_1, f_2\}$ be the dual basis of $B = \{(1, 1), (1, -1)\}$ in $\mathbb{R}^2$. Find $f_1(3, 1)$.'
            answer: '2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The functional $f_1$ gives the first coordinate of a vector relative to $B$. Since $(3, 1) = 2(1, 1) + 1(1, -1)$, we get $f_1(3, 1) = 2$.'
          - problem: 'A basis $B = \{b_1, b_2\}$ of $\mathbb{R}^2$ has the dual basis $f_1(x, y) = x + 2y$ and $f_2(x, y) = x + y$. Find $b_1$.'
            answer: '(-1, 1)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'The vector $b_1 = (x, y)$ must satisfy $f_1(b_1) = 1$ and $f_2(b_1) = 0$. So $x + 2y = 1$ and $x + y = 0$. Subtracting gives $y = 1$, and then $x = -1$, so $b_1 = (-1, 1)$.'
          - problem: 'Two feeds contain protein and fibre in the amounts $(2, 1)$ and $(1, 1)$ per kilogram. A mixture of the two feeds has the nutrient content $(7, 4)$. How many kilograms of the first feed does it contain?'
            answer: '3'
            answer_contract: {"kind":"unit","quantity":"mass","unit":"kg","allow_omitted":true}
            solution_sketch: 'Let the mixture hold $a$ kg of the first feed and $b$ kg of the second. Then $2a + b = 7$ and $a + b = 4$. Subtracting gives $a = 3$ and $b = 1$, so the mixture holds $3$ kg of the first feed.'
          - problem: 'Sam says that the dual basis of $\{(2, 0), (0, 2)\}$ starts with $f_1(x, y) = 2x$, because the first basis vector is $(2, 0)$. What is the correct $f_1(x, y)$?'
            answer: 'x/2'
            answer_contract: {"kind":"function","vars":["x","y"]}
            solution_sketch: 'The functional $f_1$ must satisfy $f_1(2, 0) = 1$ and $f_1(0, 2) = 0$. With $f_1(x, y) = ax + by$ we get $2a = 1$ and $2b = 0$. So $a = 1/2$ and $b = 0$, and $f_1(x, y) = x/2$.'
          - problem: 'Two syrups contain sugar and acid in the amounts $(1, 2)$ and $(1, 1)$ per litre. A blend of the two syrups has the content $(6, 8)$. How many litres of the second syrup does it contain?'
            answer: '4'
            answer_contract: {"kind":"unit","quantity":"volume","unit":"L","allow_omitted":true}
            solution_sketch: 'Let the blend hold $a$ litres of the first syrup and $b$ litres of the second. Then $a + b = 6$ and $2a + b = 8$. Subtracting gives $a = 2$, and then $b = 6 - 2 = 4$ litres of the second syrup.'
          - problem: 'Let $B = \{(2, 2), (1, 0)\}$ be a basis of $\mathbb{R}^2$ with dual basis $\{f_1, f_2\}$. Find $f_2$.'
            answer: 'x - y'
            answer_contract: {"kind":"function","vars":["x","y"]}
            solution_sketch: 'Write $f_2(x, y) = cx + dy$. The conditions $f_2(2, 2) = 0$ and $f_2(1, 0) = 1$ give $2c + 2d = 0$ and $c = 1$. So $d = -1$ and $f_2(x, y) = x - y$.'
          - problem: 'Let $B = \{(-2, 0), (2, 2)\}$ be a basis of $\mathbb{R}^2$ with dual basis $\{f_1, f_2\}$. Find the two values $f_1(3, 1)$ and $f_2(3, 1)$.'
            answer: '(-1, 1/2)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'These values are the coordinates of $(3, 1)$ relative to $B$. Write $(3, 1) = a(-2, 0) + b(2, 2)$, so $2b = 1$ and $-2a + 2b = 3$. Then $b = 1/2$ and $a = -1$, so the values are $-1$ and $1/2$.'
        constraints: 'bases of R^2 with entries in -2..3; each dual vector found by a 2x2 solve with integer or half-integer coefficients; mixture contexts that need the coordinates of a vector in a basis'
      - id: kp3
        name: Dimension of the dual and coordinates of functionals
        key_prerequisites: [basis-dimension, linear-transformations]
        step_check:
          step: 'The coefficient of $e_i^*$ is $f(e_i)$'
          question: 'Why is the coefficient of $e_i^*$ in $f$ equal to the value $f(e_i)$?'
          options:
            - 'Evaluating both sides at $e_i$ leaves one term, because $e_j^*(e_i) = 0$ when $j \neq i$'
            - 'Each dual vector $e_i^*$ is defined to have the value $f(e_i)$ at every point of the space'
            - 'The functional $f$ always equals the sum of its values on the basis vectors, with no dual basis needed'
            - 'The coefficients of $f$ are the entries of the point at which $f$ is evaluated'
          answer: 'Evaluating both sides at $e_i$ leaves one term, because $e_j^*(e_i) = 0$ when $j \neq i$'
          why: 'Write $f = c_1 e_1^* + \cdots + c_n e_n^*$ and evaluate at $e_i$. Every term except $c_i e_i^*(e_i) = c_i$ vanishes, so $c_i = f(e_i)$.'
        exemplars:
          - problem: 'What is the dimension of the dual space $(\mathbb{R}^3)^*$?'
            answer: '3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The dual space of a finite-dimensional space has the same dimension as the space. Since $\dim \mathbb{R}^3 = 3$, we get $\dim (\mathbb{R}^3)^* = 3$.'
          - problem: 'Let $V$ be the space of all $2 \times 3$ matrices. What is the dimension of its dual space $V^*$?'
            answer: '6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The space $V$ has dimension $2 \cdot 3 = 6$, because a matrix has six free entries. The dual space has the same dimension, so $\dim V^* = 6$.'
          - problem: 'Let $f(x, y) = 4x - 3y$ be a functional on $\mathbb{R}^2$, and let $e_1^*, e_2^*$ be the dual basis of the standard basis. Find the coordinates of $f$ relative to $e_1^*, e_2^*$.'
            answer: '(4, -3)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'The coordinates of $f$ are its values on the standard basis vectors. We get $f(1, 0) = 4$ and $f(0, 1) = -3$, so $f = 4e_1^* - 3e_2^*$ and the coordinates are $(4, -3)$.'
          - problem: 'Let $f(x, y) = 2x + y$ on $\mathbb{R}^2$, and let $b_1^*, b_2^*$ be the dual basis of $B = \{(1, 2), (3, 1)\}$. Find the coordinates of $f$ relative to $b_1^*, b_2^*$.'
            answer: '(4, 7)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'The coordinates of $f$ are its values on the basis vectors. We get $f(1, 2) = 2 + 2 = 4$ and $f(3, 1) = 6 + 1 = 7$, so the coordinates are $(4, 7)$.'
          - problem: 'On $P_2$ define the functional $f(p) = p(1) + p''(1)$. Find the coordinates of $f$ relative to the dual basis of $B = \{1, x, x^2\}$.'
            answer: '(1, 2, 3)'
            answer_contract: {"kind":"coordinates","arity":3}
            solution_sketch: 'The coordinates of $f$ are its values on the basis polynomials. We get $f(1) = 1 + 0 = 1$, $f(x) = 1 + 1 = 2$ and $f(x^2) = 1 + 2 = 3$, so the coordinates are $(1, 2, 3)$.'
          - problem: 'A functional $f$ on $\mathbb{R}^2$ has the coordinates $(5, -1)$ relative to the dual basis of $B = \{(1, 1), (2, 0)\}$. Find $f(3, 2)$.'
            answer: '19/2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Write $(3, 2) = a(1, 1) + b(2, 0)$, so $a = 2$ and $a + 2b = 3$ gives $b = 1/2$. Then $f(3, 2) = 5 \cdot 2 + (-1) \cdot (1/2) = 10 - 1/2 = 19/2$.'
          - problem: 'A linear functional $f$ on $\mathbb{R}^2$ satisfies $f(1, 1) = 7$ and $f(1, -1) = 3$. Find $f(1, 0)$.'
            answer: '5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Write $(1, 0) = \frac{1}{2}(1, 1) + \frac{1}{2}(1, -1)$. Linearity gives $f(1, 0) = \frac{1}{2} \cdot 7 + \frac{1}{2} \cdot 3 = 5$.'
          - problem: 'A shop''s daily revenue is the linear functional $R(x, y, z) = 2x + 3y + 5z$ euros of the numbers $x, y, z$ of apples, pears and plums sold. Find the coordinates of $R$ relative to the dual basis of the standard basis.'
            answer: '(2, 3, 5)'
            answer_contract: {"kind":"coordinates","arity":3}
            solution_sketch: 'The coordinates of $R$ are its values on the standard basis vectors. They are $R(1, 0, 0) = 2$, $R(0, 1, 0) = 3$ and $R(0, 0, 1) = 5$, the price of one fruit of each kind.'
          - problem: 'A pack $b_1$ holds $2$ apples and no pears, and a pack $b_2$ holds $2$ pears and no apples. The weight of a basket of $x$ apples and $y$ pears is a linear functional $w(x, y)$. One pack $b_1$ weighs $6$ kg and one pack $b_2$ weighs $4$ kg. How much does a basket of $1$ apple and $1$ pear weigh?'
            answer: '5'
            answer_contract: {"kind":"unit","quantity":"mass","unit":"kg","allow_omitted":true}
            solution_sketch: 'One apple weighs $6 / 2 = 3$ kg and one pear weighs $4 / 2 = 2$ kg, because $(1, 0) = \frac{1}{2} b_1$ and $(0, 1) = \frac{1}{2} b_2$. A basket with one of each weighs $3 + 2 = 5$ kg.'
        constraints: 'dimensions <= 6; functional coordinates read off as values on the basis vectors; contexts with prices and packs'
    diagnostic_exemplar:
      problem: 'Find the dual basis $\{f_1, f_2\}$ of $B = \{(1, 2), (1, 1)\}$ in $\mathbb{R}^2$, and write $f(x, y) = 3x + 5y$ in terms of it.'
      answer: 'f_1(x, y) = -x + y, f_2(x, y) = 2x - y; and f = 13 f_1 + 8 f_2'
      answer_contract: {kind: none}
      solution_sketch: '$f_i$ is the functional with $f_i(\mathbf{b}_j) = \delta_{ij}$; expanding a functional in the dual basis uses the coefficients $f(\mathbf{b}_1) = 13$ and $f(\mathbf{b}_2) = 8$.'
    anki_seeds:
      - front: 'The dual space $V^*$ is the space of all...'
        back: 'linear functionals on $V$: linear maps $V \to$ scalars.'
        type: basic
      - front: 'Defining property of the dual basis $\{v_1^*, \dots, v_n^*\}$?'
        back: '$v_i^*(v_j) = 1$ if $i = j$, else $0$ — each $v_i^*$ extracts the $i$-th coordinate.'
        type: basic
      - front: 'For finite-dimensional $V$: $\dim V^* = $ ?'
        back: '$\dim V$.'
        type: basic

  - id: matrix-representation-in-basis
    name: The Matrix of a Linear Map in a Basis
    core: true                 # re-audit R-38: representation machinery that similar-matrices (core) now builds on — the bridge between maps and matrices, not a destination
    difficulty: 0.75
    drill: false
    answer_kind: numeric
    expected_time_secs: 270
    prerequisites:
      - id: linear-transformations
        weight: 0.7
        key: true
      - id: change-of-basis
        weight: 0.7
        key: true
      - id: polynomial-matrix-function-spaces   # P_n arithmetic + coefficient-matching combinations for the polynomial-map KP (deliberately NOT basis-dimension-general-field: its w0 proof-by-contradiction edge would conscript the proofs logic run into similar-matrices' closure)
        weight: 0.5
      - id: coordinates-relative-basis
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: Computing the B-matrix of a map
        key_prerequisites: [linear-transformations, coordinates-relative-basis]
        step_check:
          step: 'Express $(2, 1)$ in the basis'
          question: 'Why must $T(\mathbf{b}_1) = (2, 1)$ be rewritten in the basis $B$ before it becomes a column of $[T]_B$?'
          options:
            - 'Rewriting makes the matrix act on standard vectors, so that $[T]_B$ equals the standard matrix of $T$'
            - 'The vector $(2, 1)$ is not in the plane until it is written with the basis vectors $b_1, b_2$'
            - 'The columns of $[T]_B$ hold coordinates relative to $B$, not the standard coordinates $(2, 1)$'
            - 'A matrix must contain only the entries $0$ and $1$ when the basis is not the standard basis'
          answer: 'The columns of $[T]_B$ hold coordinates relative to $B$, not the standard coordinates $(2, 1)$'
          why: 'The matrix $[T]_B$ takes $B$-coordinates in and gives $B$-coordinates out. So each column is the $B$-coordinate vector of an image, here $(1, 1)$ and not $(2, 1)$.'
        exemplars:
          - problem: 'Let $T(x, y) = (x - y, y)$ and $B = \{(1, 0), (1, 1)\}$. Find the matrix of $T$ relative to $B$.'
            answer: '[[1,-1],[0,1]]'
            answer_contract: {"kind":"matrix","rows":2,"cols":2}
            solution_sketch: 'We have $T(1, 0) = (1, 0) = 1\,b_1 + 0\,b_2$, so the first column is $(1, 0)$. We have $T(1, 1) = (0, 1) = -1\,b_1 + 1\,b_2$, so the second column is $(-1, 1)$. The matrix is $\begin{pmatrix} 1 & -1 \\ 0 & 1 \end{pmatrix}$.'
          - problem: 'Let $T(x, y) = (2x + y, x + 2y)$ and $B = \{(1, 0), (1, 1)\}$. Find the matrix of $T$ relative to $B$.'
            answer: '[[1,0],[1,3]]'
            answer_contract: {"kind":"matrix","rows":2,"cols":2}
            solution_sketch: 'We have $T(1, 0) = (2, 1) = 1\,b_1 + 1\,b_2$, so the first column is $(1, 1)$. We have $T(1, 1) = (3, 3) = 0\,b_1 + 3\,b_2$, so the second column is $(0, 3)$. The matrix is $\begin{pmatrix} 1 & 0 \\ 1 & 3 \end{pmatrix}$.'
          - problem: 'Let $T(x, y) = (x + y, x - y)$ and $B = \{(1, 1), (1, -1)\}$. Find the matrix of $T$ relative to $B$.'
            answer: '[[1,1],[1,-1]]'
            answer_contract: {"kind":"matrix","rows":2,"cols":2}
            solution_sketch: 'We have $T(1, 1) = (2, 0) = 1\,b_1 + 1\,b_2$, so the first column is $(1, 1)$. We have $T(1, -1) = (0, 2) = 1\,b_1 - 1\,b_2$, so the second column is $(1, -1)$. The matrix is $\begin{pmatrix} 1 & 1 \\ 1 & -1 \end{pmatrix}$.'
          - problem: 'The reflection of the plane in the $x$-axis is $T(x, y) = (x, -y)$. Find the matrix of $T$ relative to the basis $B = \{(1, 1), (1, -1)\}$.'
            answer: '[[0,1],[1,0]]'
            answer_contract: {"kind":"matrix","rows":2,"cols":2}
            solution_sketch: 'The reflection sends $(1, 1)$ to $(1, -1) = b_2$, so the first column is $(0, 1)$. It sends $(1, -1)$ to $(1, 1) = b_1$, so the second column is $(1, 0)$. The matrix is $\begin{pmatrix} 0 & 1 \\ 1 & 0 \end{pmatrix}$.'
          - problem: 'The projection of the plane onto the line $y = x$ is $T(x, y) = \left(\frac{x + y}{2}, \frac{x + y}{2}\right)$. Find the matrix of $T$ relative to the basis $B = \{(1, 1), (1, -1)\}$.'
            answer: '[[1,0],[0,0]]'
            answer_contract: {"kind":"matrix","rows":2,"cols":2}
            solution_sketch: 'The projection fixes $(1, 1) = b_1$, so the first column is $(1, 0)$. It sends $(1, -1)$ to $(0, 0)$, so the second column is $(0, 0)$. The matrix is $\begin{pmatrix} 1 & 0 \\ 0 & 0 \end{pmatrix}$.'
          - problem: 'A linear map $T$ sends $(1, 0)$ to $(3, 1)$ and $(0, 1)$ to $(1, 3)$. Find the matrix of $T$ relative to $B = \{(1, 1), (1, -1)\}$.'
            answer: '[[4,0],[0,2]]'
            answer_contract: {"kind":"matrix","rows":2,"cols":2}
            solution_sketch: 'We have $T(1, 1) = (4, 4) = 4\,b_1$ and $T(1, -1) = (2, -2) = 2\,b_2$. So the columns are $(4, 0)$ and $(0, 2)$, and the matrix is $\begin{pmatrix} 4 & 0 \\ 0 & 2 \end{pmatrix}$.'
          - problem: 'The rotation of the plane by $90^\circ$ counterclockwise is $T(x, y) = (-y, x)$. Find the matrix of $T$ relative to the basis $B = \{(1, 1), (1, -1)\}$.'
            answer: '[[0,1],[-1,0]]'
            answer_contract: {"kind":"matrix","rows":2,"cols":2}
            solution_sketch: 'We have $T(1, 1) = (-1, 1) = -b_2$, so the first column is $(0, -1)$. We have $T(1, -1) = (1, 1) = b_1$, so the second column is $(1, 0)$. The matrix is $\begin{pmatrix} 0 & 1 \\ -1 & 0 \end{pmatrix}$.'
          - problem: 'A metal plate is stretched by the factor $3$ along the direction $(1, 1)$ and by the factor $2$ along the direction $(1, -1)$, so the stretch $T$ has the matrix $\begin{pmatrix} 3 & 0 \\ 0 & 2 \end{pmatrix}$ relative to $B = \{(1, 1), (1, -1)\}$. Where does $T$ send the point $(1, 0)$?'
            answer: '(5/2, 1/2)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'Write $(1, 0) = \frac{1}{2}(1, 1) + \frac{1}{2}(1, -1)$. The stretch gives $T(1, 0) = \frac{3}{2}(1, 1) + \frac{2}{2}(1, -1) = \left(\frac{5}{2}, \frac{1}{2}\right)$.'
        constraints: 'maps on R^2 given by a formula, a geometric description or the images of the standard basis; bases {(1,1),(1,-1)} or with 0/1 entries; each T(b_j) has B-coordinates found by inspection or a 2x2 solve'
      - id: kp2
        name: Two bases give similar matrices
        key_prerequisites: [change-of-basis, linear-transformations]
        step_check:
          step: 'Compute $[T]_B = P_B^{-1} A P_B$ as two products'
          question: 'Why does the product $P_B^{-1} A P_B$ give the matrix of $T$ relative to $B$?'
          options:
            - 'The product is the only matrix with the same determinant as $A$, so it must represent the same map'
            - 'First $P_B$ converts $B$-coordinates to standard ones, then $A$ applies $T$, then $P_B^{-1}$ converts back'
            - 'First $P_B^{-1}$ converts $B$-coordinates to standard ones, then $A$ applies $T$, then $P_B$ converts back'
            - 'Multiplying by $P_B$ on both sides scales every entry of $A$ by the determinant of $P_B$'
          answer: 'First $P_B$ converts $B$-coordinates to standard ones, then $A$ applies $T$, then $P_B^{-1}$ converts back'
          why: 'The matrix $P_B$ turns $B$-coordinates into standard coordinates. Then $A$ applies $T$ in standard coordinates, and $P_B^{-1}$ returns the result to $B$-coordinates.'
        exemplars:
          - problem: 'Let $T$ be the linear map with standard matrix $A = \begin{pmatrix} 2 & 3 \\ 1 & 4 \end{pmatrix}$. Find the matrix of $T$ relative to $B = \{(1, 1), (1, -1)\}$.'
            answer: '[[5,-2],[0,1]]'
            answer_contract: {"kind":"matrix","rows":2,"cols":2}
            solution_sketch: 'With $P_B = \begin{pmatrix} 1 & 1 \\ 1 & -1 \end{pmatrix}$ we compute $[T]_B = P_B^{-1} A P_B$. The product $A P_B$ is $\begin{pmatrix} 5 & -1 \\ 5 & -3 \end{pmatrix}$. Multiplying by $P_B^{-1}$ gives $\begin{pmatrix} 5 & -2 \\ 0 & 1 \end{pmatrix}$.'
          - problem: 'Let $T$ have the matrix $\begin{pmatrix} 4 & 1 \\ 2 & 3 \end{pmatrix}$ in the standard basis. Find the matrix of $T$ relative to $C = \{(1, 0), (1, 2)\}$.'
            answer: '[[3,2],[1,4]]'
            answer_contract: {"kind":"matrix","rows":2,"cols":2}
            solution_sketch: 'With $P_C = \begin{pmatrix} 1 & 1 \\ 0 & 2 \end{pmatrix}$ we compute $[T]_C = P_C^{-1} A P_C$. The product $A P_C$ is $\begin{pmatrix} 4 & 6 \\ 2 & 8 \end{pmatrix}$. Multiplying by $P_C^{-1}$ gives $\begin{pmatrix} 3 & 2 \\ 1 & 4 \end{pmatrix}$.'
          - problem: 'Let $T$ have the standard matrix $A = \begin{pmatrix} 1 & 3 \\ 2 & 1 \end{pmatrix}$ and let $B = \{(1, 1), (1, -1)\}$. What is the entry in the first row and second column of $[T]_B$?'
            answer: '-1/2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'With $P_B = \begin{pmatrix} 1 & 1 \\ 1 & -1 \end{pmatrix}$ and $P_B^{-1} = \frac{1}{2}\begin{pmatrix} 1 & 1 \\ 1 & -1 \end{pmatrix}$ we find $[T]_B = \begin{pmatrix} 7/2 & -1/2 \\ 1/2 & -3/2 \end{pmatrix}$. The entry in the first row and second column is $-1/2$.'
          - problem: 'Let $T$ have the matrix $\begin{pmatrix} 3 & 1 \\ 2 & 4 \end{pmatrix}$ in the standard basis. Find the matrix of $T$ relative to $C = \{(1, 1), (1, -1)\}$.'
            answer: '[[5,0],[-1,2]]'
            answer_contract: {"kind":"matrix","rows":2,"cols":2}
            solution_sketch: 'With $P_C = \begin{pmatrix} 1 & 1 \\ 1 & -1 \end{pmatrix}$ we compute $[T]_C = P_C^{-1} A P_C$. The product $A P_C$ is $\begin{pmatrix} 4 & 2 \\ 6 & -2 \end{pmatrix}$. Multiplying by $P_C^{-1}$ gives $\begin{pmatrix} 5 & 0 \\ -1 & 2 \end{pmatrix}$.'
          - problem: 'Each year the amounts $(x, y)$ of two chemicals in a tank are replaced by $(2x + y,\; x + 2y)$. Find the matrix of this update relative to the basis $B = \{(1, 1), (1, -1)\}$.'
            answer: '[[3,0],[0,1]]'
            answer_contract: {"kind":"matrix","rows":2,"cols":2}
            solution_sketch: 'The update has the standard matrix $A = \begin{pmatrix} 2 & 1 \\ 1 & 2 \end{pmatrix}$. Then $A(1, 1) = (3, 3) = 3\,b_1$ and $A(1, -1) = (1, -1) = 1\,b_2$. So $[T]_B = \begin{pmatrix} 3 & 0 \\ 0 & 1 \end{pmatrix}$.'
          - problem: 'Let $T$ be the linear map with standard matrix $A = \begin{pmatrix} 1 & 2 \\ 0 & 3 \end{pmatrix}$. Find the matrix of $T$ relative to $B = \{(1, 2), (1, 0)\}$.'
            answer: '[[3,0],[2,1]]'
            answer_contract: {"kind":"matrix","rows":2,"cols":2}
            solution_sketch: 'With $P_B = \begin{pmatrix} 1 & 1 \\ 2 & 0 \end{pmatrix}$ we compute $[T]_B = P_B^{-1} A P_B$. The product $A P_B$ is $\begin{pmatrix} 5 & 1 \\ 6 & 0 \end{pmatrix}$. Multiplying by $P_B^{-1}$ gives $\begin{pmatrix} 3 & 0 \\ 2 & 1 \end{pmatrix}$.'
          - problem: 'A population model changes the pair $(x, y)$ by the standard matrix $A = \begin{pmatrix} 2 & 1 \\ 0 & 3 \end{pmatrix}$. Find the matrix of the model relative to the basis $B = \{(1, 0), (1, 1)\}$.'
            answer: '[[2,0],[0,3]]'
            answer_contract: {"kind":"matrix","rows":2,"cols":2}
            solution_sketch: 'We have $A(1, 0) = (2, 0) = 2\,b_1$ and $A(1, 1) = (3, 3) = 3\,b_2$. So the columns of $[T]_B$ are $(2, 0)$ and $(0, 3)$, and the matrix is $\begin{pmatrix} 2 & 0 \\ 0 & 3 \end{pmatrix}$.'
          - problem: 'Could $\begin{pmatrix} 1 & 2 \\ 3 & 4 \end{pmatrix}$ and $\begin{pmatrix} 2 & 0 \\ 0 & 3 \end{pmatrix}$ be the matrices of one linear map relative to two different bases?'
            answer: 'no'
            answer_contract: {"kind":"label","options":[["no","they could not","they cannot","no they could not","not the same map","no, they could not","no, they cannot"],["yes","they could","they can","yes they could","the same map","yes, they could","yes, they can"]]}
            solution_sketch: 'Matrices of one map in two bases are similar, so they have the same determinant. The first matrix has determinant $1 \cdot 4 - 2 \cdot 3 = -2$ and the second has determinant $2 \cdot 3 = 6$. Since $-2 \neq 6$, they cannot represent one map.'
          - problem: 'A linear map $T$ has the matrix $\begin{pmatrix} 3 & 3 \\ 0 & 2 \end{pmatrix}$ relative to a basis $B$. What is the determinant of its matrix relative to another basis $C$?'
            answer: '6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Matrices of one map in different bases are similar, and similar matrices have equal determinants. So the answer is the determinant of the given matrix, $3 \cdot 2 - 3 \cdot 0 = 6$.'
        constraints: '2x2 with basis vectors from {(1,1),(1,-1),(1,0),(0,1),(1,2)}; P_B inverse has half-integer entries at worst; conjugation done as two matrix products; one verdict on whether two matrices can represent one map (determinant test)'
      - id: kp3
        name: Matrices of maps on polynomial spaces
        key_prerequisites: [polynomial-matrix-function-spaces, linear-transformations]
        step_check:
          step: 'Subgoal: place these coordinate vectors as the columns of the matrix, in the order of the basis'
          question: 'Why are the coordinate vectors placed as columns and not as rows?'
          options:
            - 'Column $j$ must hold the coordinates of the image of the $j$-th basis vector'
            - 'Rows give the same matrix, because a matrix always equals its own transpose'
            - 'Images must be in columns, because polynomials are always written as columns of coefficients'
            - 'Columns are used so that the matrix is invertible whatever the map $T$ is'
          answer: 'Column $j$ must hold the coordinates of the image of the $j$-th basis vector'
          why: 'Multiplying the matrix by the coordinate vector of $b_j$ picks out column $j$. For this to give $T(b_j)$, column $j$ must hold the coordinates of $T(b_j)$.'
        exemplars:
          - problem: 'Let $T: P_1 \to P_1$ be the shift $T(p)(x) = p(x + 1)$. Find the matrix of $T$ relative to the basis $\{1, x\}$.'
            answer: '[[1,1],[0,1]]'
            answer_contract: {"kind":"matrix","rows":2,"cols":2}
            solution_sketch: 'We have $T(1) = 1$, with coordinates $(1, 0)$. We have $T(x) = x + 1$, with coordinates $(1, 1)$. These are the columns, so the matrix is $\begin{pmatrix} 1 & 1 \\ 0 & 1 \end{pmatrix}$.'
          - problem: 'Let $T: P_2 \to P_2$ be given by $T(p)(x) = p(2x)$. Find the matrix of $T$ relative to $\{1, x, x^2\}$.'
            answer: '[[1,0,0],[0,2,0],[0,0,4]]'
            answer_contract: {"kind":"matrix","rows":3,"cols":3}
            solution_sketch: 'We have $T(1) = 1$, $T(x) = 2x$ and $T(x^2) = 4x^2$. Their coordinate vectors $(1, 0, 0)$, $(0, 2, 0)$ and $(0, 0, 4)$ are the columns, so the matrix is $\begin{pmatrix} 1 & 0 & 0 \\ 0 & 2 & 0 \\ 0 & 0 & 4 \end{pmatrix}$.'
          - problem: 'The shift map $T(p)(x) = p(x + 1)$ on $P_1$ has the matrix $\begin{pmatrix} 1 & 1 \\ 0 & 1 \end{pmatrix}$ relative to the basis $\{1, x\}$. Use the matrix to find $T(3 + 2x)$.'
            answer: '5 + 2x'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The polynomial $3 + 2x$ has the coordinate vector $(3, 2)$. Multiplying gives $\begin{pmatrix} 1 & 1 \\ 0 & 1 \end{pmatrix}\begin{pmatrix} 3 \\ 2 \end{pmatrix} = \begin{pmatrix} 5 \\ 2 \end{pmatrix}$, so $T(3 + 2x) = 5 + 2x$.'
          - problem: 'Let $T: P_1 \to P_1$ be the shift $T(p)(x) = p(x - 1)$. Find the matrix of $T$ relative to the basis $\{1, x\}$.'
            answer: '[[1,-1],[0,1]]'
            answer_contract: {"kind":"matrix","rows":2,"cols":2}
            solution_sketch: 'We have $T(1) = 1$, with coordinates $(1, 0)$. We have $T(x) = x - 1$, with coordinates $(-1, 1)$. These are the columns, so the matrix is $\begin{pmatrix} 1 & -1 \\ 0 & 1 \end{pmatrix}$.'
          - problem: 'Let $T: P_1 \to P_1$ be the map $T(p)(x) = p(3x)$. Find the matrix of $T$ relative to the basis $\{1, x\}$.'
            answer: '[[1,0],[0,3]]'
            answer_contract: {"kind":"matrix","rows":2,"cols":2}
            solution_sketch: 'We have $T(1) = 1$, with coordinates $(1, 0)$. We have $T(x) = 3x$, with coordinates $(0, 3)$. These are the columns, so the matrix is $\begin{pmatrix} 1 & 0 \\ 0 & 3 \end{pmatrix}$.'
          - problem: 'Let $T: P_1 \to P_1$ be given by $T(a_0 + a_1 x) = (a_0 + a_1) + (a_1 - a_0)x$. Find the matrix of $T$ relative to the basis $\{1, x\}$.'
            answer: '[[1,1],[-1,1]]'
            answer_contract: {"kind":"matrix","rows":2,"cols":2}
            solution_sketch: 'We have $T(1) = 1 - x$, with coordinates $(1, -1)$. We have $T(x) = 1 + x$, with coordinates $(1, 1)$. These are the columns, so the matrix is $\begin{pmatrix} 1 & 1 \\ -1 & 1 \end{pmatrix}$.'
          - problem: 'Let $T: P_2 \to P_2$ be the shift $T(p)(x) = p(x + 1)$. Find the matrix of $T$ relative to the basis $\{1, x, x^2\}$.'
            answer: '[[1,1,1],[0,1,2],[0,0,1]]'
            answer_contract: {"kind":"matrix","rows":3,"cols":3}
            solution_sketch: 'We have $T(1) = 1$, $T(x) = 1 + x$ and $T(x^2) = 1 + 2x + x^2$. Their coordinate vectors $(1, 0, 0)$, $(1, 1, 0)$ and $(1, 2, 1)$ are the columns. The matrix is $\begin{pmatrix} 1 & 1 & 1 \\ 0 & 1 & 2 \\ 0 & 0 & 1 \end{pmatrix}$.'
          - problem: 'A distance is modelled by $p(t) = a_0 + a_1 t$ with $t$ in hours. The clock is restarted $3$ hours later, so the new model is $q(t) = p(t + 3)$. Find the matrix of the map $T(p) = q$ relative to the basis $\{1, t\}$.'
            answer: '[[1,3],[0,1]]'
            answer_contract: {"kind":"matrix","rows":2,"cols":2}
            solution_sketch: 'We have $T(1) = 1$, with coordinates $(1, 0)$. We have $T(t) = t + 3$, with coordinates $(3, 1)$. These are the columns, so the matrix is $\begin{pmatrix} 1 & 3 \\ 0 & 1 \end{pmatrix}$.'
          - problem: 'A temperature is modelled by $p(x) = a_0 + a_1 x$ with $x$ in hours. Measuring $x$ in half-hours instead gives the new model $q(x) = p(x/2)$. Find the matrix of the map $T(p) = q$ relative to the basis $\{1, x\}$.'
            answer: '[[1,0],[0,1/2]]'
            answer_contract: {"kind":"matrix","rows":2,"cols":2}
            solution_sketch: 'We have $T(1) = 1$, with coordinates $(1, 0)$. We have $T(x) = x/2$, with coordinates $(0, 1/2)$. These are the columns, so the matrix is $\begin{pmatrix} 1 & 0 \\ 0 & 1/2 \end{pmatrix}$.'
        constraints: 'maps on P_1 or P_2 built from shifts p(x+c), scalings p(cx) or p(x/2), or coefficient formulas with c in -2..3; no calculus; images expressed in the monomial basis'
    diagnostic_exemplar:
      problem: 'Let $T : P_1 \to P_1$ be the shift $T(p)(x) = p(x + 2)$. Find the matrix of $T$ relative to the basis $\{1, x\}$, and use the matrix to compute $T(3 + 2x)$.'
      answer: '$\begin{pmatrix}1&2\\0&1\end{pmatrix}$; $T(3 + 2x) = 7 + 2x$'
      answer_contract: {kind: none}
      solution_sketch: '$T(1) = 1$ and $T(x) = x + 2$ give the columns $(1, 0)$ and $(2, 1)$; applying the matrix to the coordinate vector $(3, 2)$ gives $(7, 2)$.'
    anki_seeds:
      - front: 'Column $j$ of $[T]_B$, the matrix of $T$ relative to basis $B$?'
        back: '$[T(\mathbf{b}_j)]_B$ — the image of the $j$-th basis vector, written in $B$-coordinates.'
        type: basic
      - front: 'Two matrices represent the same linear map in different bases exactly when they are...'
        back: 'similar: $[T]_C = P^{-1}[T]_B P$ with $P$ the change-of-coordinates matrix.'
        type: basic
      - front: 'To compute with a linear map on $P_n$ using matrices, replace each polynomial by...'
        back: 'its coordinate vector relative to $\{1, x, \dots, x^n\}$ — the coordinate isomorphism $P_n \cong \mathbb{R}^{n+1}$.'
        type: basic

  - id: inner-product-spaces
    name: Inner Product Spaces
    core: false                # re-audit R-39: terminal destination — nothing in the tree consumes it, and it sits atop the supplemental orthogonality run (orthogonality-gram-schmidt), which stays supplemental
    difficulty: 0.8
    drill: false
    answer_kind: numeric
    expected_time_secs: 300
    prerequisites:
      - id: orthogonality-gram-schmidt
        weight: 0.7
        key: true
      - id: polynomial-matrix-function-spaces
        weight: 0.6
        key: true
      - id: definite-integrals-ftc
        weight: 0.5
        key: true
      - id: dot-product-properties
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: The inner-product axioms and non-dot examples
        key_prerequisites: [dot-product-properties, definite-integrals-ftc]
        step_check:
          step: 'Each term is a positive weight times a square'
          question: 'Why is $3u_1^2 + 4u_2^2$ never negative?'
          options:
            - 'The weights $3$ and $4$ are positive, and a positive weight makes every product positive, whatever the factor'
            - 'A square is at least $0$ and the weights $3$ and $4$ are positive, so no term is negative'
            - 'Squaring a coordinate gives a positive number, even when that coordinate is $0$'
            - 'The sum of two numbers is never negative, whatever the two numbers are'
          answer: 'A square is at least $0$ and the weights $3$ and $4$ are positive, so no term is negative'
          why: 'A square is at least $0$, and multiplying it by the positive weight $3$ or $4$ keeps it at least $0$. A sum of such terms is at least $0$ too.'
        exemplars:
          - problem: 'On $\mathbb{R}^2$ let $\langle \mathbf{u}, \mathbf{v} \rangle = 3u_1v_1 + 4u_2v_2$. Find $\langle (1, 2), (2, -1) \rangle$.'
            answer: '-2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Substitute $u = (1, 2)$ and $v = (2, -1)$ into the formula. Then $\langle u, v \rangle = 3 \cdot 1 \cdot 2 + 4 \cdot 2 \cdot (-1) = 6 - 8 = -2$.'
          - problem: 'Is $\langle \mathbf{u}, \mathbf{v} \rangle = 2u_1v_1 + 3u_2v_2$ an inner product on $\mathbb{R}^2$?'
            answer: 'yes'
            answer_contract: {"kind":"label","options":[["yes","it is","it is an inner product","inner product","yes it is","yes, it is"],["no","it is not","not an inner product","it is not an inner product","no it is not","no, it is not"]]}
            solution_sketch: 'The formula is symmetric, because $2u_1v_1 + 3u_2v_2 = 2v_1u_1 + 3v_2u_2$. It is linear in each argument. It is positive, because $\langle u, u \rangle = 2u_1^2 + 3u_2^2$ is zero only for $u = 0$. All three axioms hold.'
          - problem: 'On $\mathbb{R}^2$ let $\langle \mathbf{u}, \mathbf{v} \rangle = u_1v_1 - u_2v_2$. This product is not an inner product. Which axiom fails: symmetry, linearity or positivity?'
            answer: 'positivity'
            answer_contract: {"kind":"label","options":[["positivity","positive-definiteness","positive definiteness","positive definite","positive","it fails positivity","positivity fails","the positivity axiom"],["symmetry","symmetric","it fails symmetry","symmetry fails"],["linearity","linear","it fails linearity","linearity fails"]]}
            solution_sketch: 'The formula is symmetric and linear in each argument, because each term is a product of coordinates with a constant weight. Positivity fails: for $u = (0, 1)$ we get $\langle u, u \rangle = 0 - 1 = -1$. A negative value contradicts $\langle u, u \rangle > 0$ for $u \neq 0$.'
          - problem: 'Let $\langle f, g \rangle = \int_{-1}^{1} f(x)g(x)\,dx$ on $P_2$. Find $\langle 1 + x, x \rangle$.'
            answer: '2/3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'We have $\langle 1 + x, x \rangle = \int_{-1}^{1} (x + x^2)\,dx$. The term $x$ integrates to $0$ over the symmetric interval, and $\int_{-1}^{1} x^2\,dx = 2/3$. So the value is $2/3$.'
          - problem: 'Two signals $f(t) = t^2$ and $g(t) = t + 3$ volts last for one second. Their overlap is $\langle f, g \rangle = \int_0^1 f(t)g(t)\,dt$. Find $\langle f, g \rangle$.'
            answer: '5/4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'We have $\langle f, g \rangle = \int_0^1 t^2(t + 3)\,dt = \int_0^1 (t^3 + 3t^2)\,dt$. This equals $\frac{1}{4} + 1 = \frac{5}{4}$.'
          - problem: 'On $\mathbb{R}^2$ let $\langle \mathbf{u}, \mathbf{v} \rangle = u_1v_1 + 4u_2v_1$. Ana finds that $\langle (1, 1), (2, 1) \rangle = 10$. What is $\langle (2, 1), (1, 1) \rangle$?'
            answer: '6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Substitute $u = (2, 1)$ and $v = (1, 1)$. Then $\langle u, v \rangle = 2 \cdot 1 + 4 \cdot 1 \cdot 1 = 6$. The two values $10$ and $6$ differ, so this product is not symmetric.'
          - problem: 'On $\mathbb{R}^2$ let $\langle \mathbf{u}, \mathbf{v} \rangle = u_1v_1 + w\,u_2v_2$ with a constant $w$. For which $w$ is $\langle (1, 1), (1, 1) \rangle = 7$?'
            answer: '6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Substitute $u = v = (1, 1)$. Then $\langle u, u \rangle = 1 \cdot 1 + w \cdot 1 \cdot 1 = 1 + w$. Setting $1 + w = 7$ gives $w = 6$.'
          - problem: 'On $\mathbb{R}^2$ let $\langle \mathbf{u}, \mathbf{v} \rangle = u_1v_1 - u_2v_2$. Find $\langle (0, 1), (0, 1) \rangle$.'
            answer: '-1'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Substitute $u = v = (0, 1)$. Then $\langle u, u \rangle = 0 \cdot 0 - 1 \cdot 1 = -1$.'
          - problem: 'On $P_2$ let $\langle f, g \rangle = \int_0^1 f(x)g(x)\,dx$. Find $\langle x, 2x + 1 \rangle$.'
            answer: '7/6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'We have $\langle x, 2x + 1 \rangle = \int_0^1 (2x^2 + x)\,dx = \frac{2}{3} + \frac{1}{2}$. This equals $\frac{7}{6}$.'
          - problem: 'A coach compares two athletes with the rating vectors $\mathbf{u} = (2, 1)$ and $\mathbf{v} = (1, 2)$ of speed and endurance, using $\langle \mathbf{u}, \mathbf{v} \rangle = 3u_1v_1 + 4u_2v_2$. Find $\langle \mathbf{u}, \mathbf{v} \rangle$.'
            answer: '14'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Speed counts with the weight $3$ and endurance with the weight $4$. Then $\langle u, v \rangle = 3 \cdot 2 \cdot 1 + 4 \cdot 1 \cdot 2 = 6 + 8 = 14$.'
        constraints: 'weighted inner products on R^2 with positive integer weights <= 4; failures pinned to one axiom with a concrete counterexample; integral inner products of polynomials of degree <= 2 over [0,1] or [-1,1]'
      - id: kp2
        name: Norms, orthogonality, and Cauchy-Schwarz abstractly
        key_prerequisites: [definite-integrals-ftc, dot-product-properties]
        step_check:
          step: 'Since $\langle x, x^2 \rangle = 0$, the functions $x$ and $x^2$ are orthogonal'
          question: 'Why does a zero value of the integral $\int_{-1}^{1} x^3\,dx$ mean that $x$ and $x^2$ are orthogonal?'
          options:
            - 'The graphs of $x$ and $x^2$ meet at a right angle at the origin, which the zero value confirms'
            - 'A zero integral means that one of the two functions is the zero function on the interval'
            - 'The norms of $x$ and $x^2$ are both equal to $0$, so the product of the norms is zero'
            - 'Orthogonal is defined as having inner product $0$ in any inner-product space'
          answer: 'Orthogonal is defined as having inner product $0$ in any inner-product space'
          why: 'Orthogonality in an inner-product space means $\langle f, g \rangle = 0$. The word does not refer to angles between graphs, and the zero integral is exactly this condition.'
        exemplars:
          - problem: 'With $\langle f, g \rangle = \int_0^1 f(x)g(x)\,dx$, find the norm $\|x\|$.'
            answer: '1/sqrt(3)'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The norm is $\|x\| = \sqrt{\langle x, x \rangle} = \sqrt{\int_0^1 x^2\,dx}$. Since $\int_0^1 x^2\,dx = 1/3$, the norm is $\sqrt{1/3} = 1/\sqrt{3}$.'
          - problem: 'Let $\langle f, g \rangle = \int_{-1}^{1} f(x)g(x)\,dx$ on $P_2$. Are the polynomials $1$ and $x$ orthogonal?'
            answer: 'yes'
            answer_contract: {"kind":"label","options":[["yes","they are","orthogonal","they are orthogonal","yes they are","yes, they are"],["no","they are not","not orthogonal","they are not orthogonal","no they are not","no, they are not"]]}
            solution_sketch: 'Two vectors are orthogonal when their inner product is $0$. Here $\langle 1, x \rangle = \int_{-1}^{1} x\,dx = 0$, because $x$ is an odd function on a symmetric interval. So $1$ and $x$ are orthogonal.'
          - problem: 'Let $\langle f, g \rangle = \int_0^1 f(x)g(x)\,dx$ on $P_2$. Are the polynomials $1$ and $x$ orthogonal?'
            answer: 'no'
            answer_contract: {"kind":"label","options":[["no","they are not","not orthogonal","they are not orthogonal","no they are not","no, they are not"],["yes","they are","orthogonal","they are orthogonal","yes they are","yes, they are"]]}
            solution_sketch: 'Two vectors are orthogonal when their inner product is $0$. Here $\langle 1, x \rangle = \int_0^1 x\,dx = 1/2$, which is not $0$. So $1$ and $x$ are not orthogonal on this interval.'
          - problem: 'With $\langle f, g \rangle = \int_{-1}^{1} f(x)g(x)\,dx$, find the norm $\|x^2\|$.'
            answer: 'sqrt(2/5)'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The norm is $\|x^2\| = \sqrt{\int_{-1}^{1} x^4\,dx}$. We have $\int_{-1}^{1} x^4\,dx = 2/5$, so $\|x^2\| = \sqrt{2/5}$.'
          - problem: 'With $\langle f, g \rangle = \int_0^1 f(x)g(x)\,dx$, for which constant $c$ is $x + c$ orthogonal to $1$?'
            answer: '-1/2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'We need $\langle x + c, 1 \rangle = \int_0^1 (x + c)\,dx = \frac{1}{2} + c = 0$. So $c = -1/2$.'
          - problem: 'With $\langle f, g \rangle = \int_0^1 f(x)g(x)\,dx$, Sam computes $\|x^2\| = 1/5$. What is the correct value of $\|x^2\|$?'
            answer: '1/sqrt(5)'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Sam forgot the square root. We have $\langle x^2, x^2 \rangle = \int_0^1 x^4\,dx = 1/5$, and the norm is the square root of this value. So $\|x^2\| = \sqrt{1/5} = 1/\sqrt{5}$.'
          - problem: 'With $\langle f, g \rangle = \int_0^1 f(x)g(x)\,dx$, the Cauchy-Schwarz inequality gives $|\langle x, x^2 \rangle| \leq \|x\|\,\|x^2\|$. Find the value of $\|x\|\,\|x^2\|$.'
            answer: '1/sqrt(15)'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'We have $\|x\| = \sqrt{1/3}$ and $\|x^2\| = \sqrt{1/5}$. The product is $\sqrt{1/15} = 1/\sqrt{15}$, which is about $0.258$ and lies above $\langle x, x^2 \rangle = 1/4$.'
          - problem: 'A voltage signal $f(t) = 3t$ volts lasts for $2$ seconds. Its energy is $\|f\|^2 = \int_0^2 f(t)^2\,dt$. Find the energy.'
            answer: '24'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'We have $\|f\|^2 = \int_0^2 9t^2\,dt = 3t^3 \Big|_0^2$. This equals $3 \cdot 8 = 24$.'
          - problem: 'A ramp signal $f(t) = t$ volts lasts for $1$ second. A gain $k > 0$ multiplies the signal so that the energy $\int_0^1 (k f(t))^2\,dt$ equals $1$. Find $k$.'
            answer: 'sqrt(3)'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'We have $\int_0^1 k^2 t^2\,dt = k^2/3$. Setting $k^2/3 = 1$ gives $k^2 = 3$, so $k = \sqrt{3}$ because $k > 0$.'
          - problem: 'With $\langle f, g \rangle = \int_{-1}^{1} f(x)g(x)\,dx$, the Cauchy-Schwarz inequality compares $|\langle x, 2x \rangle|$ with $\|x\|\,\|2x\|$. Find the ratio $|\langle x, 2x \rangle| \big/ \left(\|x\|\,\|2x\|\right)$.'
            answer: '1'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'We have $\langle x, 2x \rangle = \int_{-1}^{1} 2x^2\,dx = 4/3$, $\|x\|^2 = 2/3$ and $\|2x\|^2 = 8/3$. The product of the norms is $\sqrt{16/9} = 4/3$, so the ratio is $1$. The two sides are equal because $2x$ is a multiple of $x$.'
        constraints: 'polynomials of degree <= 2 over [0,1] or [-1,1]; norms are single square roots of small fractions; orthogonality decided by one integral; signal-energy contexts'
      - id: kp3
        name: Gram-Schmidt with a general inner product
        key_prerequisites: [orthogonality-gram-schmidt, definite-integrals-ftc]
        step_check:
          step: 'subtract the projection of $x$ onto $v_1$'
          question: 'Why is the projection of $x$ onto $v_1$ subtracted when $v_2$ is built?'
          options:
            - 'The subtraction makes $v_2$ the same length as $v_1$ in the inner product'
            - 'The subtraction makes $v_2$ a multiple of $v_1$, which keeps the span of the basis the same'
            - 'What remains is orthogonal to $v_1$, because the part of $x$ along $v_1$ has been removed'
            - 'The projection is the part of $x$ that is not needed for the span of the two vectors'
          answer: 'What remains is orthogonal to $v_1$, because the part of $x$ along $v_1$ has been removed'
          why: 'The projection is the part of $x$ that points along $v_1$. Removing it leaves a vector with inner product $0$ with $v_1$.'
        exemplars:
          - problem: 'Apply the Gram-Schmidt process to the basis $\{1, x\}$ of $P_1$ with $\langle f, g \rangle = \int_0^1 f(x)g(x)\,dx$, starting with $v_1 = 1$. Find $v_2$.'
            answer: 'x - 1/2'
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'We have $\langle x, 1 \rangle = \int_0^1 x\,dx = 1/2$ and $\langle 1, 1 \rangle = 1$. So $v_2 = x - \frac{1/2}{1} \cdot 1 = x - 1/2$.'
          - problem: 'Apply the Gram-Schmidt process to the basis $\{1, x, x^2\}$ of $P_2$ with $\langle f, g \rangle = \int_{-1}^{1} f(x)g(x)\,dx$, starting with $v_1 = 1$. Find $v_3$.'
            answer: 'x^2 - 1/3'
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'Here $v_2 = x$, because $\langle x, 1 \rangle = 0$. We have $\langle x^2, 1 \rangle = 2/3$, $\langle 1, 1 \rangle = 2$ and $\langle x^2, x \rangle = 0$. So $v_3 = x^2 - \frac{2/3}{2} \cdot 1 = x^2 - 1/3$.'
          - problem: 'Apply the Gram-Schmidt process to the basis $\{1, x\}$ of $P_1$ with $\langle f, g \rangle = \int_{-1}^{1} f(x)g(x)\,dx$, and let $v_2$ be the second vector. Find $\langle v_2, v_2 \rangle$.'
            answer: '2/3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Since $\langle x, 1 \rangle = \int_{-1}^{1} x\,dx = 0$, the second vector is $v_2 = x$. Then $\langle v_2, v_2 \rangle = \int_{-1}^{1} x^2\,dx = 2/3$.'
          - problem: 'Apply the Gram-Schmidt process to the basis $\{1, x, x^2\}$ of $P_2$ with $\langle f, g \rangle = \int_0^1 f(x)g(x)\,dx$, and let $v_2$ be the second vector. Find $\langle x^2, v_2 \rangle$.'
            answer: '1/12'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'We have $v_2 = x - 1/2$. Then $\langle x^2, v_2 \rangle = \int_0^1 x^2\left(x - \frac{1}{2}\right)dx = \frac{1}{4} - \frac{1}{6} = \frac{1}{12}$.'
          - problem: 'Apply the Gram-Schmidt process to the basis $\{1, x, x^2\}$ of $P_2$ with $\langle f, g \rangle = \int_{-1}^{1} f(x)g(x)\,dx$, and let $v_3$ be the third vector. Find $\langle v_3, v_3 \rangle$.'
            answer: '8/45'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'We have $v_3 = x^2 - 1/3$. Then $\langle v_3, v_3 \rangle = \int_{-1}^{1} \left(x^4 - \frac{2}{3}x^2 + \frac{1}{9}\right)dx = \frac{2}{5} - \frac{4}{9} + \frac{2}{9} = \frac{8}{45}$.'
          - problem: 'Apply the Gram-Schmidt process to the basis $\{1, x, x^2\}$ of $P_2$ with $\langle f, g \rangle = \int_0^1 f(x)g(x)\,dx$, starting with $v_1 = 1$. Find $v_3$.'
            answer: 'x^2 - x + 1/6'
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'We have $v_2 = x - 1/2$, $\langle x^2, 1 \rangle = 1/3$ and $\langle x^2, v_2 \rangle = 1/12$. Also $\langle v_2, v_2 \rangle = 1/12$. So $v_3 = x^2 - \frac{1}{3} - \left(x - \frac{1}{2}\right) = x^2 - x + \frac{1}{6}$.'
          - problem: 'A voltage ramp is $f(t) = t$ volts for $0 \leq t \leq 2$ seconds, and $\langle f, g \rangle = \int_0^2 f(t)g(t)\,dt$. Subtract a multiple of the constant signal $1$ from $f$ so that the remainder is orthogonal to $1$. What is the remainder?'
            answer: 't - 1'
            answer_contract: {"kind":"function","vars":["t"]}
            solution_sketch: 'We have $\langle t, 1 \rangle = \int_0^2 t\,dt = 2$ and $\langle 1, 1 \rangle = 2$. The multiple of $1$ to subtract is $2 / 2 = 1$, so the remainder is $t - 1$.'
          - problem: 'A drift signal is $g(t) = t$ for $0 \leq t \leq 3$ hours, and $\langle f, h \rangle = \int_0^3 f(t)h(t)\,dt$. A constant offset $c$ is subtracted so that $g - c$ is orthogonal to the constant signal $1$. Find $c$.'
            answer: '3/2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'We need $\langle t - c, 1 \rangle = \int_0^3 (t - c)\,dt = \frac{9}{2} - 3c = 0$. So $c = \frac{9/2}{3} = \frac{3}{2}$.'
          - problem: 'Apply the Gram-Schmidt process to the basis $\{1, x\}$ of $P_1$ with $\langle f, g \rangle = \int_{-1}^{1} f(x)g(x)\,dx$. Sam copies the answer $v_2 = x - 1/2$ from the interval $[0, 1]$. What is the correct $v_2$ here?'
            answer: 'x'
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'On $[-1, 1]$ we have $\langle x, 1 \rangle = \int_{-1}^{1} x\,dx = 0$. So no multiple of $v_1 = 1$ is subtracted, and $v_2 = x$. The value $1/2$ belongs to $[0, 1]$ only.'
        constraints: 'the sets {1, x} or {1, x, x^2}; intervals [0,1], [-1,1], [0,2] or [0,3]; projection coefficients are small fractions; verify orthogonality of the output by one integral'
    diagnostic_exemplar:
      problem: 'With $\langle f, g \rangle = \int_0^1 f(x)g(x)\,dx$ on $P_1$, apply Gram-Schmidt to $\{1, x\}$ and give the norm of the second vector you obtain.'
      answer: '$v_1 = 1$, $v_2 = x - \frac{1}{2}$; $\|v_2\| = \frac{1}{2\sqrt{3}}$'
      answer_contract: {kind: none}
      solution_sketch: '$\langle x, 1\rangle = 1/2$ and $\langle 1, 1\rangle = 1$, so $v_2 = x - 1/2$; then $\|v_2\|^2 = \int_0^1 (x - 1/2)^2dx = 1/12$.'
