      - id: kp2
        name: Rectangular matrix-vector products
        key_prerequisites: [computing-dot-products]
        exemplars:
          - problem: 'Compute $A\mathbf{x}$ for $A = \begin{pmatrix}2&0&1\\1&1&0\end{pmatrix}$, $\mathbf{x} = (1, 2, 3)$.'
            answer: "(5, 3)"
          - problem: 'Compute $A\mathbf{x}$ for $A = \begin{pmatrix}1&0\\2&1\\0&3\end{pmatrix}$, $\mathbf{x} = (2, 5)$.'
            answer: "(2, 9, 15)"
            solution_sketch: 'Rows: $2$; $4 + 5 = 9$; $15$.'
        constraints: "the vector length must match the number of columns; sizes 2x3 and 3x2"
      - id: kp3
        name: Ax as a combination of columns
        key_prerequisites: [computing-dot-products, vector-arithmetic]
        exemplars:
          - problem: 'Write $A\mathbf{x}$ as a combination of the columns $a_1, a_2$ of $A$ when $\mathbf{x} = (3, -1)$.'
            answer: '$3a_1 - a_2$'
            answer_contract: {kind: none}
            solution_sketch: '$A\mathbf{x} = x_1 a_1 + x_2 a_2 = 3a_1 + (-1)a_2 = 3a_1 - a_2$.'
          - problem: 'For $A = \begin{pmatrix}1&2\\0&1\end{pmatrix}$ and $\mathbf{x} = (2, 3)$, compute $A\mathbf{x}$ both row-by-row and as $2\mathbf{a}_1 + 3\mathbf{a}_2$.'
            answer: "(8, 3)"
            solution_sketch: '$2(1, 0) + 3(2, 1) = (8, 3)$; rows give $2 + 6 = 8$ and $3$.'
        constraints: "verify the column view numerically on 2x2 matrices"
    diagnostic_exemplar:
      problem: 'Compute $A\mathbf{x}$ for $A = \begin{pmatrix}2&1&0\\1&0&3\end{pmatrix}$ and $\mathbf{x} = (4, -1, 2)$, and check the result against $4\mathbf{a}_1 - \mathbf{a}_2 + 2\mathbf{a}_3$.'
      answer: '(7, 10)'
      solution_sketch: 'Row by row: $8 - 1 + 0 = 7$ and $4 + 0 + 6 = 10$. As columns: $4(2, 1) - (1, 0) + 2(0, 3) = (7, 10)$.'
    anki_seeds:
      - front: '$A\mathbf{x}$ equals which combination of the columns of $A$?'
        back: 'The linear combination of the columns with the entries of $\mathbf{x}$ as weights.'
        type: basic
      - front: 'For $A\mathbf{x}$ to be defined, the length of $\mathbf{x}$ must equal...'
        back: 'the number of columns of $A$.'
        type: basic

