unit: linear-systems
course: linear-algebra
module: "Linear Systems"
topics:
  - id: augmented-matrix-representation
    name: Augmented Matrices
    core: true
    difficulty: 0.5
    drill: false
    answer_kind: numeric
    expected_time_secs: 90
    prerequisites:
      - id: systems-elimination
        weight: 0.5
        key: true
      - id: translating-sentences-to-equations
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: From system to augmented matrix
        key_prerequisites: [systems-elimination]
        exemplars:
          - problem: 'Write the augmented matrix of the system $x + 2y = 5$, $3x + 4y = 11$.'
            answer: "[1,2,5;3,4,11]"
            answer_contract: {"cols":3,"kind":"matrix","rows":2}
          - problem: 'Write the augmented matrix of the system $2x - y = 3$, $y = 4$.'
            answer: "[2,-1,3;0,1,4]"
            answer_contract: {"cols":3,"kind":"matrix","rows":2}
            solution_sketch: 'A missing variable contributes a coefficient of $0$.'
          - problem: 'Write the augmented matrix of $x + y + z = 6$, $x - y + z = 2$, $2x + y - z = 1$.'
            answer: "[1,1,1,6;1,-1,1,2;2,1,-1,1]"
            answer_contract: {"cols":4,"kind":"matrix","rows":3}
          - problem: "Give the augmented matrix of $2x + 3y = 7$, $x - 4y = -1$ as [a,b;c,d]."
            answer: "[2,3,7;1,-4,-1]"
            answer_contract: {"cols": 3, "kind": "matrix", "rows": 2}
            solution_sketch: "The full system is $2x + 3y = 7$ and $x - 4y = -1$. Step 1 (variable order): list the variables as x, y. Step 2 (coefficient rule): row 1 gets 2, 3; row 2 gets 1, -4. Step 3 (augmented column rule): put the constants 7 and -1 in the last column. The augmented matrix is [2,3,7;1,-4,-1]."
          - problem: "Give the augmented matrix of $3x - 2y = 8$, $5x = -3$ as [a,b;c,d]."
            answer: "[3,-2,8;5,0,-3]"
            answer_contract: {"cols": 3, "kind": "matrix", "rows": 2}
            solution_sketch: "The full system is $3x - 2y = 8$ and $5x = -3$. Step 1 (variable order): list x, y even though y is missing. Step 2 (coefficient rule): row 1 gets 3, -2; row 2 gets 5, 0 because y is absent. Step 3 (augmented column rule): put 8 and -3 in the last column. The augmented matrix is [3,-2,8;5,0,-3]."
          - problem: "Give the augmented matrix of $2x + z = 7$, $x - y + 2z = 0$, $3y - z = 4$ as [a,b;c,d]."
            answer: "[2,0,1,7;1,-1,2,0;0,3,-1,4]"
            answer_contract: {"cols": 4, "kind": "matrix", "rows": 3}
            solution_sketch: "The full system is $2x + z = 7$, $x - y + 2z = 0$, and $3y - z = 4$. Step 1 (variable order): list x, y, z. Step 2 (coefficient rule): row 1 gets 2, 0, 1; row 2 gets 1, -1, 2; row 3 gets 0, 3, -1. Step 3 (augmented column rule): put constants 7, 0, 4 in the last column. The augmented matrix is [2,0,1,7;1,-1,2,0;0,3,-1,4]."
        constraints: "2 or 3 equations; integer coefficients in -5..5; include a missing-term system occasionally"
      - id: kp2
        name: From augmented matrix to system
        key_prerequisites: [systems-elimination]
        exemplars:
          - problem: 'Write out the system with augmented matrix $\begin{pmatrix}1&-3&2\\4&1&9\end{pmatrix}$ (variables $x, y$).'
            answer: "x - 3y = 2, 4x + y = 9"
            answer_contract: {kind: none}
            solution_sketch: 'Each row is one equation: the first row gives $x - 3y = 2$, the second gives $4x + y = 9$.'
          - problem: 'For the augmented matrix $\begin{pmatrix}2&0&1&7\\0&1&-1&3\end{pmatrix}$, state the coefficient matrix.'
            answer: "[2,0,1;0,1,-1]"
            answer_contract: {"cols":3,"kind":"matrix","rows":2}
            solution_sketch: 'Drop the constants column.'
        constraints: "sizes up to 3x4; integer entries in -9..9"
      - id: kp3
        name: Setting up augmented matrices from word problems
        key_prerequisites: [systems-elimination]
        exemplars:
          - problem: 'Adult tickets cost €8 and child tickets €5. In total $30$ tickets were sold for €195. Write the augmented matrix for the counts $a, c$.'
            answer: "[1,1,30;8,5,195]"
            answer_contract: {"cols":3,"kind":"matrix","rows":2}
            solution_sketch: 'Equations: $a + c = 30$ and $8a + 5c = 195$.'
          - problem: 'Two numbers have sum $20$ and difference $4$. Write the augmented matrix for the system in $x, y$.'
            answer: "[1,1,20;1,-1,4]"
            answer_contract: {"cols":3,"kind":"matrix","rows":2}
        constraints: "two-unknown word problems with small integer data; the matrix is the answer, not the solution"
    diagnostic_exemplar:
      problem: 'Adult tickets cost €9 and child tickets €4. In total $25$ tickets were sold for €160. Write the augmented matrix for the counts $a, c$.'
      answer: "[1,1,25;9,4,160]"
      answer_contract: {"cols":3,"kind":"matrix","rows":2}
      solution_sketch: 'The conditions are $a + c = 25$ and $9a + 4c = 160$; stack the coefficients and constants.'
    anki_seeds:
      - front: 'The augmented matrix of a linear system contains...'
        back: 'the coefficient matrix with the constants appended as a final column.'
        type: basic

  - id: elementary-row-operations
    name: Elementary Row Operations
    core: true
    difficulty: 0.5
    drill: false
    answer_kind: numeric
    expected_time_secs: 90
    prerequisites:
      - id: augmented-matrix-representation
        weight: 0.7
        key: true
      - id: systems-elimination
        weight: 0.5
        key: true
    knowledge_points:
      - id: kp1
        name: Row replacement
        key_prerequisites: [augmented-matrix-representation, systems-elimination]
        exemplars:
          - problem: 'Apply $R_2 \to R_2 - 2R_1$ to the augmented matrix $\begin{pmatrix}1&2&5\\2&3&8\end{pmatrix}$.'
            answer: "[1,2,5;0,-1,-2]"
            answer_contract: {"cols":3,"kind":"matrix","rows":2}
            solution_sketch: 'Row 2 becomes $(2-2, 3-4, 8-10)$.'
          - problem: 'Apply $R_2 \to R_2 + 3R_1$ to $\begin{pmatrix}1&-1&2\\-3&2&1\end{pmatrix}$.'
            answer: "[1,-1,2;0,-1,7]"
            answer_contract: {"cols":3,"kind":"matrix","rows":2}
            solution_sketch: 'Row 2 becomes $(-3+3, 2-3, 1+6)$.'
          - problem: "Apply R2 -> R2 - 2R1 to the augmented matrix [1,1,4;2,5,3]. Give the matrix as [a,b;c,d]."
            answer: "[1,1,4;0,3,-5]"
            answer_contract: {"cols": 3, "kind": "matrix", "rows": 2}
            solution_sketch: "The augmented matrix is [1,1,4;2,5,3]. Step 1: scaling row 1 by 2 gives 2R1 = (2,2,8). Step 2: the replacement R2 -> R2 - 2R1 changes row 2 to (2-2,5-2,3-8) = (0,3,-5). Row 1 is unchanged, so the final matrix is [1,1,4;0,3,-5]."
          - problem: "Apply R2 -> R2 + 3R1 to the augmented matrix [1,2,-1;-3,1,5]. Give the matrix as [a,b;c,d]."
            answer: "[1,2,-1;0,7,2]"
            answer_contract: {"cols": 3, "kind": "matrix", "rows": 2}
            solution_sketch: "The augmented matrix is [1,2,-1;-3,1,5]. Step 1: scaling row 1 by 3 gives 3R1 = (3,6,-3). Step 2: the replacement R2 -> R2 + 3R1 changes row 2 to (-3+3,1+6,5-3) = (0,7,2). Row 1 is unchanged, so the final matrix is [1,2,-1;0,7,2]."
          - problem: "Apply R3 -> R3 - 2R1 to the augmented matrix [1,1,2,3;0,1,4,2;2,3,1,5]. Give the matrix as [a,b;c,d]."
            answer: "[1,1,2,3;0,1,4,2;0,1,-3,-1]"
            answer_contract: {"cols": 4, "kind": "matrix", "rows": 3}
            solution_sketch: "The augmented matrix is [1,1,2,3;0,1,4,2;2,3,1,5]. Step 1: scaling row 1 by 2 gives 2R1 = (2,2,4,6). Step 2: the replacement R3 -> R3 - 2R1 changes row 3 to (2-2,3-2,1-4,5-6) = (0,1,-3,-1). Rows 1 and 2 stay the same, so the final matrix is [1,1,2,3;0,1,4,2;0,1,-3,-1]."
          - problem: "Apply R3 -> R3 + 2R1 to the augmented matrix [1,2,0,1;0,1,3,2;-2,0,1,4]. Give the matrix as [a,b;c,d]."
            answer: "[1,2,0,1;0,1,3,2;0,4,1,6]"
            answer_contract: {"cols": 4, "kind": "matrix", "rows": 3}
            solution_sketch: "The augmented matrix is [1,2,0,1;0,1,3,2;-2,0,1,4]. Step 1: scaling row 1 by 2 gives 2R1 = (2,4,0,2). Step 2: the replacement R3 -> R3 + 2R1 changes row 3 to (-2+2,0+4,1+0,4+2) = (0,4,1,6). Rows 1 and 2 stay the same, so the final matrix is [1,2,0,1;0,1,3,2;0,4,1,6]."
        constraints: "2x3 or 3x4 augmented matrices with integer entries; one replacement operation"
      - id: kp2
        name: Swaps and scaling
        key_prerequisites: [augmented-matrix-representation]
        exemplars:
          - problem: 'Apply $R_2 \to \frac{1}{2}R_2$ to $\begin{pmatrix}1&0&3\\0&2&8\end{pmatrix}$.'
            answer: "[1,0,3;0,1,4]"
            answer_contract: {"cols":3,"kind":"matrix","rows":2}
          - problem: "Apply R1 <-> R2, then R1 -> 1/3 R1, to the matrix [0,2;3,6]. Give the final matrix as [a,b;c,d]."
            answer: "[1,2;0,2]"
            answer_contract: {"cols": 2, "kind": "matrix", "rows": 2}
            solution_sketch: "Start with [0,2;3,6]. Swap R1 and R2: the matrix becomes [3,6;0,2]. Scale R1 by the reciprocal 1/3: [3,6] becomes [1,2], so the final matrix is [1,2;0,2]."
          - problem: "Apply R2 -> 1/4 R2 to the matrix [2,1;0,4]. Give the final matrix as [a,b;c,d]."
            answer: "[2,1;0,1]"
            answer_contract: {"cols": 2, "kind": "matrix", "rows": 2}
            solution_sketch: "Start with [2,1;0,4]. Scale R2 by the reciprocal 1/4: [0,4] becomes [0,1]. The final matrix is [2,1;0,1]."
          - problem: "Apply R2 <-> R1 to the matrix [0,3;1,2]. Give the final matrix as [a,b;c,d]."
            answer: "[1,2;0,3]"
            answer_contract: {"cols": 2, "kind": "matrix", "rows": 2}
            solution_sketch: "Start with [0,3;1,2]. Swap rows R1 and R2: the first row becomes [1,2] and the second row becomes [0,3]. The final matrix is [1,2;0,3]."
          - problem: "Apply R1 -> 1/2 R1, then R2 -> 1/5 R2, to the matrix [2,4;5,10]. Give the final matrix as [a,b;c,d]."
            answer: "[1,2;1,2]"
            answer_contract: {"cols": 2, "kind": "matrix", "rows": 2}
            solution_sketch: "Start with [2,4;5,10]. Scale R1 by the reciprocal 1/2: [2,4] becomes [1,2]. Scale R2 by the reciprocal 1/5: [5,10] becomes [1,2]. The final matrix is [1,2;1,2]."
          - problem: "Apply R1 -> 1/2 R1, then R1 <-> R2, to the matrix [2,4;0,3]. Give the final matrix as [a,b;c,d]."
            answer: "[0,3;1,2]"
            answer_contract: {"cols": 2, "kind": "matrix", "rows": 2}
            solution_sketch: "Start with [2,4;0,3]. Scale R1 by the reciprocal 1/2: [2,4] becomes [1,2]. Swap R1 and R2: the matrix becomes [0,3;1,2]. The final matrix is [0,3;1,2]."
        constraints: "scaling always by the reciprocal of an entry so results stay integer"
      - id: kp3
        name: Identifying operations and why they are safe
        key_prerequisites: [augmented-matrix-representation, systems-elimination]
        exemplars:
          - problem: "Matrices A = [1,2,5;3,4,11] and B = [1,2,5;0,-2,-4] differ by a single replacement operation of the form R2 -> R2 + k R1. Find the value of k."
            answer: "-3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: Write the original second row of A as (3, 4, 11). Step 2: The replacement R2 -> R2 + k R1 adds k times row 1 (1, 2, 5) to row 2, giving (3 + k, 4 + 2k, 11 + 5k). Step 3: Set the first entry to 0 to match B: 3 + k = 0, so k = -3. Step 4: Check the other entries: 4 + 2(-3) = -2 and 11 + 5(-3) = -4. The answer is -3."
          - problem: "The matrix [1,2;3,4;5,6] is changed to [5,6;3,4;1,2] by a single interchange of two rows. Which operation is it?"
            answer: "Swap R1 and R3"
            answer_contract: {"kind": "label", "options": [["Swap R1 and R3"], ["Swap R1 and R2"], ["Swap R2 and R3"], ["Swap R1 and R4"]]}
            solution_sketch: "Step 1: The original matrix has row 1 (1,2), row 2 (3,4), and row 3 (5,6). Step 2: The target matrix has row 1 (5,6), row 2 (3,4), and row 3 (1,2), so rows 1 and 3 were exchanged. Step 3: The operation is a swap of row 1 and row 3. The wrong option Swap R1 and R2 would put (3,4) in row 1, wrong. The wrong option Swap R2 and R3 would leave row 1 as (1,2), wrong. The wrong option Swap R1 and R4 is impossible because there is no row 4, wrong. The answer is Swap R1 and R3."
          - problem: "A single scaling operation R2 -> k R2 turns [1,2;4,8] into [1,2;1,2]. Find k."
            answer: "1/4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: Write the original second row of the first matrix as (4, 8). Step 2: The scaling R2 -> k R2 multiplies that row by k, giving (4k, 8k). Step 3: Match the target row (1, 2): 4k = 1, so k = 1/4. Step 4: Check the second entry: 8(1/4) = 2. The answer is 1/4."
          - problem: "A single replacement operation R2 -> R2 - 2 R1 is applied to the augmented matrix [1,2,3;2,5,8]. Does the solution set stay the same? If the original solution has y = 2, find x. Give the answer as verdict = ...; x = ..."
            answer: "verdict = preserved; x = -1"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["preserved"], ["changed"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "x"}]}
            solution_sketch: "Step 1: Write the original system from the augmented matrix [1,2,3;2,5,8] as x + 2y = 3 and 2x + 5y = 8. Step 2: The replacement R2 -> R2 - 2 R1 is reversible, so it preserves the solution set. Step 3: The new second row is (0, 1, 2), giving y = 2. Step 4: Substitute y = 2 into x + 2y = 3: x + 4 = 3, so x = -1. The answer is verdict = preserved; x = -1."
          - problem: "A single replacement operation R1 -> R1 + k R2 turns [1,1;2,3] into [5,7;2,3]. Find k."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: Write the original first row of the first matrix as (1, 1). Step 2: The replacement R1 -> R1 + k R2 adds k times row 2 (2, 3) to row 1, giving (1 + 2k, 1 + 3k). Step 3: Match the target row (5, 7): 1 + 2k = 5, so k = 2. Step 4: Check the second entry: 1 + 3(2) = 7. The answer is 2."
          - problem: "A single scaling operation R1 -> k R1 turns [3,6;1,2] into [1,2;1,2]. Find k."
            answer: "1/3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: Write the original first row of the first matrix as (3, 6). Step 2: The scaling R1 -> k R1 multiplies that row by k, giving (3k, 6k). Step 3: Match the target row (1, 2): 3k = 1, so k = 1/3. Step 4: Check the second entry: 6(1/3) = 2. The answer is 1/3."
        constraints: "identify-the-operation problems use a single replacement, swap, or scaling"
    diagnostic_exemplar:
      problem: 'Which two row operations, applied in order, turn $\begin{pmatrix}1&3&2\\4&5&1\end{pmatrix}$ into $\begin{pmatrix}1&3&2\\0&1&1\end{pmatrix}$?'
      answer: '$R_2 \to R_2 - 4R_1$, then $R_2 \to -\frac{1}{7}R_2$'
      answer_contract: {kind: none}
      solution_sketch: '$R_2 - 4R_1 = (0, -7, -7)$; scaling that row by $-\frac{1}{7}$ gives $(0, 1, 1)$.'
    anki_seeds:
      - front: 'The three elementary row operations?'
        back: 'Swap two rows; multiply a row by a nonzero scalar; add a multiple of one row to another.'
        type: basic
      - front: 'Why do row operations preserve the solution set?'
        back: 'Each operation is reversible, so the old and new systems have exactly the same solutions.'
        type: basic

  - id: back-substitution-triangular-systems
    name: Back Substitution
    core: true
    difficulty: 0.5
    drill: false
    answer_kind: numeric
    expected_time_secs: 120
    prerequisites:
      - id: multi-step-equations
        weight: 0.5
        key: true
      - id: systems-substitution
        weight: 0.5
        key: true
    knowledge_points:
      - id: kp1
        name: Triangular 2x2 systems
        key_prerequisites: [systems-substitution]
        exemplars:
          - problem: 'Solve: $x + 3y = 7$, $y = 2$.'
            answer: "x = 1, y = 2"
            answer_contract: {"kind":"list","member":{"kind":"exact"},"ordered":false}
            solution_sketch: 'Substitute $y = 2$ into the first equation: $x = 7 - 6$.'
          - problem: 'Solve the system with augmented matrix $\begin{pmatrix}1&3&7\\0&1&2\end{pmatrix}$.'
            answer: "x = 1, y = 2"
            answer_contract: {"kind":"list","member":{"kind":"exact"},"ordered":false}
        constraints: "second equation gives y directly; integer solutions in -5..5"
      - id: kp2
        name: Triangular 3x3 systems
        key_prerequisites: [systems-substitution, multi-step-equations]
        exemplars:
          - problem: 'Solve: $x + y + z = 6$, $y + 2z = 8$, $z = 3$.'
            answer: "x = 1, y = 2, z = 3"
            answer_contract: {"kind":"list","member":{"kind":"exact"},"ordered":false}
            solution_sketch: '$z = 3$; then $y = 8 - 6 = 2$; then $x = 6 - 2 - 3 = 1$.'
          - problem: 'Solve: $x - 2y + z = 0$, $y - z = 1$, $2z = 4$.'
            answer: "x = 4, y = 3, z = 2"
            answer_contract: {"kind":"list","member":{"kind":"exact"},"ordered":false}
            solution_sketch: '$z = 2$; $y = 1 + 2 = 3$; $x = 2y - z = 6 - 2 = 4$.'
        constraints: "strictly triangular; integer solutions in -5..5"
      - id: kp3
        name: Back substitution from echelon matrices
        key_prerequisites: [systems-substitution, multi-step-equations]
        exemplars:
          - problem: 'Solve the system with augmented matrix $\begin{pmatrix}1&1&1&6\\0&2&1&7\\0&0&3&9\end{pmatrix}$.'
            answer: "x = 1, y = 2, z = 3"
            answer_contract: {"kind":"list","member":{"kind":"exact"},"ordered":false}
            solution_sketch: '$3z = 9$ gives $z = 3$; $2y + 3 = 7$ gives $y = 2$; $x = 6 - 2 - 3 = 1$.'
          - problem: 'Solve the system with augmented matrix $\begin{pmatrix}1&0&2&5\\0&1&-1&0\\0&0&1&2\end{pmatrix}$.'
            answer: "x = 1, y = 2, z = 2"
            answer_contract: {"kind":"list","member":{"kind":"exact"},"ordered":false}
            solution_sketch: '$z = 2$; $y = z = 2$; $x = 5 - 4 = 1$.'
        constraints: "echelon matrices with pivots that divide their right-hand sides evenly"
    diagnostic_exemplar:
      problem: 'Solve the system with augmented matrix $\begin{pmatrix}1&2&1&7\\0&1&3&8\\0&0&2&4\end{pmatrix}$.'
      answer: 'x = 1, y = 2, z = 2'
      answer_contract: {"kind":"list","member":{"kind":"exact"},"ordered":false}
      solution_sketch: '$2z = 4$ gives $z = 2$; then $y + 6 = 8$ gives $y = 2$; then $x + 4 + 2 = 7$ gives $x = 1$.'
    anki_seeds:
      - front: 'Back substitution solves a triangular system in which order?'
        back: 'From the last pivot equation upward, substituting each value as you go.'
        type: basic

  - id: echelon-form-recognition
    name: Echelon Forms and Pivots
    core: true
    difficulty: 0.55
    drill: false
    answer_kind: numeric
    expected_time_secs: 120
    prerequisites:
      - id: elementary-row-operations
        weight: 0.7
        key: true
    knowledge_points:
      - id: kp1
        name: Recognizing echelon form
        key_prerequisites: [elementary-row-operations]
        exemplars:
          - problem: 'Is $\begin{pmatrix}1&2&3\\0&1&4\end{pmatrix}$ in echelon form?'
            answer: "Yes"
            answer_contract: {"kind":"label","options":[["yes"],["no"]]}
            solution_sketch: 'Each leading entry sits strictly to the right of the one above.'
          - problem: 'Is $\begin{pmatrix}0&1\\1&0\end{pmatrix}$ in echelon form?'
            answer: "No"
            answer_contract: {"kind":"label","options":[["yes"],["no"]]}
            solution_sketch: 'The second leading entry is to the LEFT of the first.'
          - problem: 'Is $\begin{pmatrix}1&5&2\\0&0&3\\0&0&0\end{pmatrix}$ in echelon form?'
            answer: "Yes"
            answer_contract: {"kind":"label","options":[["yes"],["no"]]}
            solution_sketch: 'Zero rows at the bottom are allowed.'
        constraints: "sizes up to 3x4; mix clear yes and no cases"
      - id: kp2
        name: REF versus RREF
        key_prerequisites: [elementary-row-operations]
        exemplars:
          - problem: 'Is $\begin{pmatrix}1&0&2\\0&1&3\end{pmatrix}$ in reduced row echelon form?'
            answer: "Yes"
            answer_contract: {"kind":"label","options":[["yes"],["no"]]}
            solution_sketch: 'Pivots are $1$ and are the only nonzero entries in their columns.'
          - problem: 'Is $\begin{pmatrix}1&2&3\\0&1&4\end{pmatrix}$ in RREF? If not, why not?'
            answer: "No: the entry above the second pivot is 2, not 0"
            answer_contract: {kind: none}
            solution_sketch: 'RREF needs a zero above every pivot; here the 2 sits above the second pivot, so it is not in RREF.'
          - problem: 'Is $\begin{pmatrix}2&0\\0&1\end{pmatrix}$ in RREF? If not, why not?'
            answer: "No: the first pivot is 2, not 1"
            answer_contract: {kind: none}
            solution_sketch: 'RREF requires every pivot to be 1, but the first pivot is 2.'
        constraints: "matrices in REF; the RREF failure must be a single named condition"
      - id: kp3
        name: Pivot positions and finishing the reduction
        key_prerequisites: [elementary-row-operations]
        exemplars:
          - problem: 'Bring $\begin{pmatrix}1&2&4\\0&1&3\end{pmatrix}$ to RREF.'
            answer: "[1,0,-2;0,1,3]"
            answer_contract: {"cols":3,"kind":"matrix","rows":2}
            solution_sketch: '$R_1 \to R_1 - 2R_2$ clears the entry above the second pivot.'
          - problem: "State the pivot columns of the matrix [1,2,0,4;0,0,1,3] as a list."
            answer: "1, 3"
            answer_contract: {"kind": "list", "member": {"kind": "exact"}, "ordered": true}
            solution_sketch: "The matrix is in echelon form. The leading 1 in row 1 is in column 1, and the leading 1 in row 2 is in column 3. The pivot columns are 1, 3."
          - problem: "Bring the matrix [1,3;0,1] to reduced row echelon form. Give the matrix as [a,b;c,d]."
            answer: "[1,0;0,1]"
            answer_contract: {"cols": 2, "kind": "matrix", "rows": 2}
            solution_sketch: "The matrix [1,3;0,1] is in echelon form. Use the row operation R1 -> R1 - 3R2 to clear the entry in row 1, column 2. The reduced row echelon form is [1,0;0,1]."
          - problem: "State the pivot columns of the matrix [0,1,2;0,0,1] as a list."
            answer: "2, 3"
            answer_contract: {"kind": "list", "member": {"kind": "exact"}, "ordered": true}
            solution_sketch: "The matrix is in echelon form. The first leading 1 is in column 2 and the second leading 1 is in column 3. The pivot columns are 2, 3."
          - problem: "How many pivot positions does the matrix [1,2,3;0,1,4;0,0,1] have?"
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The matrix is in echelon form. Each row has a leading 1, in columns 1, 2, and 3. The number of pivot positions is 3."
          - problem: "The matrix [1,4;0,1] is one row operation away from reduced row echelon form. Find the multiplier k in the row operation R1 -> R1 + k R2 that clears the entry in row 1, column 2."
            answer: "-4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The matrix is in echelon form with pivots in columns 1 and 2. To clear the entry 4 in row 1, column 2, use R1 -> R1 - 4R2, so k = -4. The multiplier is -4."
        constraints: "one clearing operation away from RREF; integer entries"
    diagnostic_exemplar:
      problem: 'Is $\begin{pmatrix}1&2&5\\0&1&3\end{pmatrix}$ in reduced row echelon form? If not, bring it to RREF.'
      answer: 'No (the entry above the second pivot is not $0$); the RREF is $\begin{pmatrix}1&0&-1\\0&1&3\end{pmatrix}$'
      answer_contract: {kind: none}
      solution_sketch: 'It is in echelon form with leading $1$s, but RREF also needs zeros above each pivot: $R_1 \to R_1 - 2R_2$ gives $(1, 0, -1)$.'
    anki_seeds:
      - front: 'What extra conditions does reduced row echelon form (RREF) add to echelon form?'
        back: 'Every pivot is 1 and is the only nonzero entry in its column.'
        type: basic
      - front: 'A pivot position of a matrix is...'
        back: 'the location of a leading entry in its echelon form.'
        type: basic

  - id: row-reduction-echelon-forms
    name: Row Reduction and Echelon Forms
    core: true
    difficulty: 0.55
    drill: false
    answer_kind: numeric
    expected_time_secs: 180
    prerequisites:
      - id: elementary-row-operations
        weight: 0.8
        key: true
      - id: echelon-form-recognition
        weight: 0.6
        key: true
      - id: back-substitution-triangular-systems
        weight: 0.5
    knowledge_points:
      - id: kp1
        name: Reducing a matrix to RREF
        key_prerequisites: [elementary-row-operations, echelon-form-recognition]
        exemplars:
          - problem: 'Row reduce $\begin{pmatrix}1&3&4\\2&4&6\end{pmatrix}$ to RREF.'
            answer: "[1,0,1;0,1,1]"
            answer_contract: {"cols":3,"kind":"matrix","rows":2}
            solution_sketch: '$R_2 - 2R_1$ gives $(0, -2, -2)$; scale by $-\frac{1}{2}$; then $R_1 - 3R_2$.'
          - problem: 'Row reduce $\begin{pmatrix}1&2&3\\2&6&10\end{pmatrix}$ to RREF.'
            answer: "[1,0,-1;0,1,2]"
            answer_contract: {"cols":3,"kind":"matrix","rows":2}
            solution_sketch: '$R_2 - 2R_1$ gives $(0, 2, 4)$; scale to $(0, 1, 2)$; then $R_1 - 2R_2$.'
        constraints: "2x3 augmented matrices whose RREF has integer entries"
      - id: kp2
        name: Solving 2x2 systems by row reduction
        key_prerequisites: [elementary-row-operations, back-substitution-triangular-systems]
        exemplars:
          - problem: 'Solve by row reduction: $x + 2y = 5$, $3x + 4y = 11$.'
            answer: "x = 1, y = 2"
            answer_contract: {"kind":"list","member":{"kind":"exact"},"ordered":false}
            solution_sketch: '$R_2 - 3R_1$ gives $-2y = -4$, so $y = 2$; back-substitute for $x = 1$.'
          - problem: 'Solve by row reduction: $2x + y = 4$, $4x + 3y = 10$.'
            answer: "x = 1, y = 2"
            answer_contract: {"kind":"list","member":{"kind":"exact"},"ordered":false}
            solution_sketch: '$R_2 - 2R_1$ gives $y = 2$; then $2x + 2 = 4$.'
        constraints: "unique integer solutions with coordinates in -5..5"
      - id: kp3
        name: Solving 3x3 systems by row reduction
        key_prerequisites: [elementary-row-operations, back-substitution-triangular-systems]
        exemplars:
          - problem: 'Solve: $x + y + z = 6$, $x - y + z = 2$, $2x + y - z = 1$.'
            answer: "x = 1, y = 2, z = 3"
            answer_contract: {"kind":"list","member":{"kind":"exact"},"ordered":false}
            solution_sketch: 'Subtracting the first two equations gives $2y = 4$, so $y = 2$; then $x + z = 4$ and $2x - z = -1$, so $x = 1$, $z = 3$.'
          - problem: 'Solve: $x + 2y + z = 1$, $2x - y + 3z = 8$, $x + y + 2z = 3$.'
            answer: "x = 2, y = -1, z = 1"
            answer_contract: {"kind":"list","member":{"kind":"exact"},"ordered":false}
            solution_sketch: '$R_2 - 2R_1$: $-5y + z = 6$; $R_3 - R_1$: $-y + z = 2$. Subtracting gives $-4y = 4$, so $y = -1$, $z = 1$, $x = 2$.'
        constraints: "unique integer solutions with coordinates in -3..3; coefficients in -3..3"
    diagnostic_exemplar:
      problem: 'Solve by row reduction: $x + y + z = 6$, $2x + y - z = 1$, $x - y + 2z = 5$.'
      answer: 'x = 1, y = 2, z = 3'
      answer_contract: {"kind":"list","member":{"kind":"exact"},"ordered":false}
      solution_sketch: 'Eliminating $x$ gives $-y - 3z = -11$ and $-2y + z = -1$; solving these gives $y = 2$, $z = 3$, hence $x = 1$.'
    anki_seeds:
      - front: 'Overall strategy of Gaussian elimination?'
        back: 'Row-reduce to echelon form, then back-substitute (or continue to RREF).'
        type: basic
      - front: 'Row reducing the augmented matrix of a system yields...'
        back: 'an equivalent system with the same solution set.'
        type: basic

  - id: consistency-of-linear-systems
    name: Consistent and Inconsistent Systems
    core: true
    difficulty: 0.55
    drill: false
    answer_kind: numeric
    expected_time_secs: 120
    prerequisites:
      - id: row-reduction-echelon-forms
        weight: 0.7
        key: true
      - id: systems-special-cases
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: Detecting inconsistency
        key_prerequisites: [row-reduction-echelon-forms]
        exemplars:
          - problem: "How many solutions does the system x + y = 2, 2x + 2y = 5 have? Give the answer as a number."
            answer: "0"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The system is x + y = 2 and 2x + 2y = 5. Use elimination: subtract twice the first equation from the second to get 0 = 1. This is a contradictory row, so the system has no solution. The answer is 0."
          - problem: "How many solutions does the system x + y = 3, x - y = 1 have? Give the answer as a number."
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The system is x + y = 3 and x - y = 1. Use elimination: add the equations to get 2x = 4, so x = 2. Substitute x = 2 into the first equation to get y = 1. The solution is unique, so the number of solutions is 1. The answer is 1."
          - problem: "The system 3x + y = 4, 6x + 2y = 9 is either inconsistent or has exactly one solution. Give the verdict and the number of solutions."
            answer: "verdict = inconsistent; solutions = 0"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["inconsistent"], ["consistent"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "solutions"}]}
            solution_sketch: "The system is 3x + y = 4 and 6x + 2y = 9. Use row reduction: the left side of the second row is twice the first, so subtract twice the first row from the second to get 0 = 1. This contradiction means the system is inconsistent, so there are no solutions. The option consistent is wrong because the contradictory row 0 = 1 cannot hold. verdict = inconsistent; solutions = 0."
          - problem: "The system x + y + z = 6, x - y + z = 2, 2x + y - z = 1 is either inconsistent or has exactly one solution. Give the verdict and the number of solutions."
            answer: "verdict = consistent; solutions = 1"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["inconsistent"], ["consistent"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "solutions"}]}
            solution_sketch: "The system is x + y + z = 6, x - y + z = 2, and 2x + y - z = 1. Use elimination: subtract the second equation from the first to get 2y = 4, so y = 2. Substitute y = 2 into the first and third equations to get x + z = 4 and 2x - z = -1. Solve these to get x = 1 and z = 3, so the solution (1,2,3) exists and the system is consistent. The option inconsistent is wrong because the solution (1,2,3) satisfies all three equations. verdict = consistent; solutions = 1."
          - problem: "How many solutions does the system x + y + z = 4, x - y = 1, 2x + 2y + 2z = 9 have? Give the answer as a number."
            answer: "0"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The system is x + y + z = 4, x - y = 1, and 2x + 2y + 2z = 9. Use row reduction: subtract twice the first equation from the third to get 0 = 1. This contradictory row is an obvious multiple of the first, so the system has no solution. The answer is 0."
          - problem: "How many solutions does the system 2x + y = 7, x - y = 2 have? Give the answer as a number."
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The system is 2x + y = 7 and x - y = 2. Use elimination: add the equations to get 3x = 9, so x = 3. Substitute x = 3 into the second equation to get y = 1. The solution is unique, so the number of solutions is 1. The answer is 1."
        constraints: "the contradictory row must be an obvious multiple; 2x2 or 3x3"
      - id: kp2
        name: Detecting infinitely many solutions
        key_prerequisites: [row-reduction-echelon-forms]
        exemplars:
          - problem: 'How many solutions does the system $x + y = 2$, $2x + 2y = 4$ have?'
            answer: "Infinitely many"
            answer_contract: {kind: none}
            solution_sketch: 'The second equation is twice the first; one equation, two unknowns.'
          - problem: 'How many solutions does the system with RREF $\begin{pmatrix}1&2&3\\0&0&0\end{pmatrix}$ have?'
            answer: "Infinitely many"
            answer_contract: {kind: none}
            solution_sketch: 'One pivot, two variables: the second variable is free.'
        constraints: "dependent rows are exact multiples; keep to 2x2 and 2x3"
      - id: kp3
        name: Consistency with a parameter
        key_prerequisites: [row-reduction-echelon-forms]
        exemplars:
          - problem: 'For which value of $h$ is the system $x + 2y = 3$, $2x + 4y = h$ consistent?'
            answer: "h = 6"
            solution_sketch: '$R_2 - 2R_1$ gives $0 = h - 6$; consistent only when $h = 6$.'
          - problem: 'For which $h$ is the system $x + 3y = 2$, $2x + hy = 5$ inconsistent?'
            answer: "h = 6"
            solution_sketch: '$R_2 - 2R_1$ gives $(h - 6)y = 1$; that is a contradiction exactly when $h = 6$ (any other $h$ gives a unique solution).'
          - problem: 'For which $h$ does $x + 2y = 3$, $2x + hy = 6$ have infinitely many solutions?'
            answer: "h = 4"
            solution_sketch: 'The second row is twice the first exactly when $h = 4$.'
          - problem: "For which value of h does the system $h x + 2y = 3$, $4x + 8y = 13$ have no solution? Find the value of h."
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Write the augmented matrix [h,2|3; 4,8|13]. The left coefficients are proportional only when h = 1, because h/4 equals 2/8. At h = 1 the row operation R2 - 4R1 gives 0 = 1, a contradiction. The value is 1."
          - problem: "For which value of k does the system $x + 3y = 5$, $3x + k y = 15$ have infinitely many solutions? Find the value of k."
            answer: "9"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Write the augmented matrix [1,3|5; 3,k|15]. Replace row 2 by R2 - 3R1; this gives (k - 9)y = 0. Infinitely many solutions occur when this row is 0 = 0, so k - 9 = 0. The value is 9."
          - problem: "For which value of a does the system $x + 4y = 7$, $3x + a y = 22$ have no solution? Find the value of a."
            answer: "12"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Write the augmented matrix [1,4|7; 3,a|22]. Replace row 2 by R2 - 3R1; this gives (a - 12)y = 1. A contradiction occurs when a - 12 = 0, because the right side is not 0. The value is 12."
        constraints: "parameter problems with a single integer answer"
    diagnostic_exemplar:
      problem: 'For which $h$ does the system $x + 2y = 3$, $2x + hy = 7$ have no solution, for which $h$ does it have exactly one solution, and for which $h$ does it have infinitely many?'
      answer: 'No solution when h = 4; exactly one solution for every h other than 4; infinitely many for no value of h'
      answer_contract: {kind: none}
      solution_sketch: 'For $h \ne 4$ the coefficient matrix has two pivots, so the solution is unique. For $h = 4$ row reduction gives $0 = 7 - 6 = 1$, which is inconsistent; the constants never match, so infinitely many solutions never occur.'
    anki_seeds:
      - front: 'An echelon row $(0\ \cdots\ 0 \mid b)$ with $b \neq 0$ means the system is...'
        back: 'inconsistent (no solutions).'
        type: basic
      - front: 'A consistent linear system has either...'
        back: 'exactly one solution or infinitely many.'
        type: basic

  - id: solution-sets-free-variables
    name: Solution Sets and Free Variables
    core: true
    difficulty: 0.6
    drill: false
    answer_kind: numeric
    expected_time_secs: 180
    prerequisites:
      - id: row-reduction-echelon-forms
        weight: 0.8
        key: true
      - id: consistency-of-linear-systems
        weight: 0.5
        key: true
      - id: evaluating-expressions
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: Pivot and free variables
        key_prerequisites: [row-reduction-echelon-forms]
        exemplars:
          - problem: 'The echelon form of an augmented matrix is $\begin{pmatrix}1&2&0&4\\0&0&1&3\end{pmatrix}$ with variables $x, y, z$. Which variables are basic and which are free?'
            answer: "x and z are basic; y is free"
            answer_contract: {kind: none}
            solution_sketch: 'Pivots sit in columns 1 and 3; column 2 has no pivot, so $y$ is free.'
          - problem: 'A $3 \times 5$ coefficient matrix has $3$ pivots. How many free variables does $A\mathbf{x} = \mathbf{0}$ have?'
            answer: "2"
            solution_sketch: '$5$ variables minus $3$ pivot variables.'
        constraints: "echelon matrices already reduced; sizes up to 3x5"
      - id: kp2
        name: Parametric descriptions with one free variable
        key_prerequisites: [row-reduction-echelon-forms]
        exemplars:
          - problem: 'Describe all solutions of $x + 2y = 4$ using a parameter $t$ for $y$.'
            answer: "x = 4 - 2t, y = t"
            answer_contract: {"kind":"list","member":{"kind":"exact"},"ordered":false}
          - problem: 'Solve the system $x + y + z = 4$, $y - z = 1$, taking $z = t$ as the free variable.'
            answer: "x = 3 - 2t, y = 1 + t, z = t"
            answer_contract: {"kind":"list","member":{"kind":"exact"},"ordered":false}
            solution_sketch: '$y = 1 + t$; then $x = 4 - (1 + t) - t = 3 - 2t$.'
        constraints: "exactly one free variable; integer coefficients in the parametric form"
      - id: kp3
        name: General solutions with two free variables
        key_prerequisites: [row-reduction-echelon-forms, consistency-of-linear-systems]
        exemplars:
          - problem: 'Describe all solutions of $x + 2y - z = 3$ with $y = s$ and $z = t$ free.'
            answer: "x = 3 - 2s + t, y = s, z = t"
            answer_contract: {"kind":"list","member":{"kind":"exact"},"ordered":false}
          - problem: 'The RREF of an augmented matrix is $\begin{pmatrix}1&2&0&3&4\\0&0&1&2&5\end{pmatrix}$ with variables $x_1, x_2, x_3, x_4$. Give the general solution with $x_2 = s$, $x_4 = t$.'
            answer: "x1 = 4 - 2s - 3t, x2 = s, x3 = 5 - 2t, x4 = t"
            answer_contract: {kind: none}
            solution_sketch: 'Row 1: $x_1 = 4 - 2x_2 - 3x_4$; row 2: $x_3 = 5 - 2x_4$.'
        constraints: "two free variables; every coefficient an integer in -4..5"
    diagnostic_exemplar:
      problem: 'The RREF of an augmented matrix is $\begin{pmatrix}1&3&0&2&5\\0&0&1&4&1\end{pmatrix}$ with variables $x_1, x_2, x_3, x_4$. Which variables are free, and what is the general solution with $x_2 = s$ and $x_4 = t$?'
      answer: 'x2 and x4 are free; x1 = 5 - 3s - 2t, x2 = s, x3 = 1 - 4t, x4 = t'
      answer_contract: {kind: none}
      solution_sketch: 'Pivots sit in columns $1$ and $3$, so $x_2, x_4$ are free; the rows read $x_1 = 5 - 3x_2 - 2x_4$ and $x_3 = 1 - 4x_4$.'
    anki_seeds:
      - front: 'A variable of a linear system is free when its column in echelon form...'
        back: 'contains no pivot.'
        type: basic
      - front: 'Number of free variables of a consistent system?'
        back: 'Number of variables minus number of pivot columns.'
        type: basic

