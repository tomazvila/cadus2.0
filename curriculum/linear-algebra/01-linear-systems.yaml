        name: Pivot and free variables
        key_prerequisites: [row-reduction-echelon-forms]
        exemplars:
          - problem: 'A $3 \times 5$ coefficient matrix has $3$ pivots. How many free variables does $A\mathbf{x} = \mathbf{0}$ have?'
            answer: "2"
            solution_sketch: '$5$ variables minus $3$ pivot variables.'
          - problem: "The echelon form of an augmented matrix is \\begin{pmatrix}1&2&0&4\\\\0&0&1&3\\end{pmatrix} with variables x, y, z. How many free variables does the system have?"
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "By the pivot-column rule, pivots sit in columns 1 and 3, so x and z are basic variables. Column 2 has no pivot, so y is free. The number of free variables is 1."
          - problem: "A 3 x 3 coefficient matrix is in echelon form and has 3 pivots. How many free variables does A x = 0 have?"
            answer: "0"
            answer_contract: {"kind": "exact"}
            solution_sketch: "By the pivot-column rule, a 3 x 3 matrix has 3 columns and all 3 contain pivots. Every variable is basic. With no non-pivot column, the number of free variables is 0."
          - problem: "The echelon form of an augmented matrix is \\begin{pmatrix}1&2&0&3&4\\\\0&0&1&5&6\\end{pmatrix} with variables x1, x2, x3, x4. Give the list of indices of the free variables in increasing order."
            answer: "2, 4"
            answer_contract: {"kind": "list", "member": {"kind": "exact"}, "ordered": true}
            solution_sketch: "By the pivot-column rule, the pivots are in columns 1 and 3, so x1 and x3 are basic variables. Columns 2 and 4 have no pivot, so x2 and x4 are free variables. In increasing order, the list of free variable indices is 2, 4."
          - problem: "The echelon form of an augmented matrix is \\begin{pmatrix}1&0&2&0&3\\\\0&1&4&0&5\\\\0&0&0&1&6\\end{pmatrix} with variables x, y, z, w. Which variable is free?"
            answer: "z"
            answer_contract: {"kind": "label", "options": [["x"], ["y"], ["z"], ["w"]]}
            solution_sketch: "By the pivot-column rule, pivots are in columns 1, 2, and 4, so x, y, and w are basic variables. The wrong option x is basic because its column has a pivot; y is basic because its column has a pivot; w is basic because its column has a pivot. Only column 3 has no pivot, so z is free. The free variable is z."
          - problem: "A 3 x 5 coefficient matrix in echelon form has a single pivot. How many free variables does A x = 0 have?"
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "By the free-variable count, a 3 x 5 matrix has 5 variables. A single pivot gives 1 basic variable. The number of free variables is 5 - 1 = 4."
        constraints: "echelon matrices already reduced; sizes up to 3x5"
      - id: kp2
        name: Parametric descriptions with one free variable
        key_prerequisites: [row-reduction-echelon-forms]
        exemplars:
          - problem: 'Describe all solutions of $x + 2y = 4$ using a parameter $t$ for $y$.'
            answer: "x = 4 - 2t, y = t"
            answer_contract: {"kind":"list","member":{"kind":"exact"},"ordered":false}
          - problem: 'Solve the system $x + y + z = 4$, $y - z = 1$, taking $z = t$ as the free variable.'
            answer: "x = 3 - 2t, y = 1 + t, z = t"
            answer_contract: {"kind":"list","member":{"kind":"exact"},"ordered":false}
            solution_sketch: '$y = 1 + t$; then $x = 4 - (1 + t) - t = 3 - 2t$.'
        constraints: "exactly one free variable; integer coefficients in the parametric form"
      - id: kp3
        name: General solutions with two free variables
        key_prerequisites: [row-reduction-echelon-forms, consistency-of-linear-systems]
        exemplars:
          - problem: 'Describe all solutions of $x + 2y - z = 3$ with $y = s$ and $z = t$ free.'
            answer: "x = 3 - 2s + t, y = s, z = t"
            answer_contract: {"kind":"list","member":{"kind":"exact"},"ordered":false}
          - problem: 'The RREF of an augmented matrix is $\begin{pmatrix}1&2&0&3&4\\0&0&1&2&5\end{pmatrix}$ with variables $x_1, x_2, x_3, x_4$. Give the general solution with $x_2 = s$, $x_4 = t$.'
            answer: "x1 = 4 - 2s - 3t, x2 = s, x3 = 5 - 2t, x4 = t"
            answer_contract: {kind: none}
            solution_sketch: 'Row 1: $x_1 = 4 - 2x_2 - 3x_4$; row 2: $x_3 = 5 - 2x_4$.'
        constraints: "two free variables; every coefficient an integer in -4..5"
    diagnostic_exemplar:
      problem: 'The RREF of an augmented matrix is $\begin{pmatrix}1&3&0&2&5\\0&0&1&4&1\end{pmatrix}$ with variables $x_1, x_2, x_3, x_4$. Which variables are free, and what is the general solution with $x_2 = s$ and $x_4 = t$?'
      answer: 'x2 and x4 are free; x1 = 5 - 3s - 2t, x2 = s, x3 = 1 - 4t, x4 = t'
      answer_contract: {kind: none}
      solution_sketch: 'Pivots sit in columns $1$ and $3$, so $x_2, x_4$ are free; the rows read $x_1 = 5 - 3x_2 - 2x_4$ and $x_3 = 1 - 4x_4$.'
    anki_seeds:
      - front: 'A variable of a linear system is free when its column in echelon form...'
        back: 'contains no pivot.'
        type: basic
      - front: 'Number of free variables of a consistent system?'
        back: 'Number of variables minus number of pivot columns.'
        type: basic

  - id: computing-matrix-vector-products
    name: Matrix-Vector Products
    core: true
    difficulty: 0.55
    drill: false
    answer_kind: expression
    expected_time_secs: 90
    prerequisites:
      - id: computing-dot-products
        weight: 0.6
        key: true
      - id: vector-arithmetic
        weight: 0.5
      - id: augmented-matrix-representation
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: Computing Ax for square matrices
        key_prerequisites: [computing-dot-products]
        exemplars:
          - problem: 'Compute $A\mathbf{x}$ for $A = \begin{pmatrix}1&2\\3&4\end{pmatrix}$, $\mathbf{x} = (5, 6)$.'
            answer: "(17, 39)"
            solution_sketch: 'Row by row: $1 \cdot 5 + 2 \cdot 6 = 17$; $3 \cdot 5 + 4 \cdot 6 = 39$.'
          - problem: 'Compute $A\mathbf{x}$ for $A = \begin{pmatrix}2&-1\\0&3\end{pmatrix}$, $\mathbf{x} = (1, 4)$.'
            answer: "(-2, 12)"
          - problem: "Compute A x for A = [[2,0,-1],[1,3,2],[0,4,1]] and x = (3, -1, 2). Give the answer as (a, b, c)."
            answer: "(4, 4, -2)"
            answer_contract: {"arity": 3, "kind": "coordinates"}
            solution_sketch: "Write the rows of A: r1 = (2,0,-1), r2 = (1,3,2), r3 = (0,4,1), and x = (3,-1,2). Dot product rule: r1 dot x = 2*3 + 0*(-1) + (-1)*2 = 4. r2 dot x = 1*3 + 3*(-1) + 2*2 = 4. r3 dot x = 0*3 + 4*(-1) + 1*2 = -2. The product is (4, 4, -2)."
          - problem: "For A = [[-2,3],[4,-1]] and x = (2,5), evaluate the product A x. Give the answer as (a, b)."
            answer: "(11, 3)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "Write A = [[-2,3],[4,-1]] and x = (2,5). Dot product rule: row1 dot x = -2*2 + 3*5 = 11. row2 dot x = 4*2 + (-1)*5 = 3. The product is (11, 3)."
          - problem: "A network has adjacency matrix A = [[1,-2,3],[0,4,-1],[2,1,0]] and a signal vector x = (2, -1, 3). Find the transformed signal A x. Give the answer as (a, b, c)."
            answer: "(13, -7, 3)"
            answer_contract: {"arity": 3, "kind": "coordinates"}
            solution_sketch: "Write the rows of A: r1 = (1,-2,3), r2 = (0,4,-1), r3 = (2,1,0), and x = (2,-1,3). Dot product rule: r1 dot x = 1*2 + (-2)*(-1) + 3*3 = 13. r2 dot x = 0*2 + 4*(-1) + (-1)*3 = -7. r3 dot x = 2*2 + 1*(-1) + 0*3 = 3. The product is (13, -7, 3)."
          - problem: "A transformation sends vector x = (-2, 4) to A x, where A = [[3,2],[-1,5]]. Find the transformed vector A x. Give the answer as (a, b)."
            answer: "(2, 22)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "Write A = [[3,2],[-1,5]] and x = (-2,4). Dot product rule: row1 dot x = 3*(-2) + 2*4 = 2. row2 dot x = -1*(-2) + 5*4 = 22. The product is (2, 22)."
        constraints: "integer entries in -5..6; sizes 2x2 and 3x3"
      - id: kp2
        name: Rectangular matrix-vector products
        key_prerequisites: [computing-dot-products]
        exemplars:
          - problem: 'Compute $A\mathbf{x}$ for $A = \begin{pmatrix}2&0&1\\1&1&0\end{pmatrix}$, $\mathbf{x} = (1, 2, 3)$.'
            answer: "(5, 3)"
          - problem: 'Compute $A\mathbf{x}$ for $A = \begin{pmatrix}1&0\\2&1\\0&3\end{pmatrix}$, $\mathbf{x} = (2, 5)$.'
            answer: "(2, 9, 15)"
            solution_sketch: 'Rows: $2$; $4 + 5 = 9$; $15$.'
          - problem: "Compute $A\\mathbf{x}$ for $A = \\begin{pmatrix}3&0&2\\\\1&4&-1\\end{pmatrix}$ and $\\mathbf{x} = (2, 1, 3)$, and give the answer as (x, y)."
            answer: "(12, 3)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "Full object: A = [[3,0,2],[1,4,-1]] and x = (2,1,3). Step 1: use the row-by-vector product rule on row 1: 3*2 + 0*1 + 2*3 = 12. Step 2: use the row-by-vector product rule on row 2: 1*2 + 4*1 + (-1)*3 = 3. The answer is (12, 3)."
          - problem: "Compute $A\\mathbf{x}$ for $A = \\begin{pmatrix}1&2\\\\0&3\\\\4&-1\\end{pmatrix}$ and $\\mathbf{x} = (5, 2)$, and give the answer as (x, y, z)."
            answer: "(9, 6, 18)"
            answer_contract: {"arity": 3, "kind": "coordinates"}
            solution_sketch: "Full object: A = [[1,2],[0,3],[4,-1]] and x = (5,2). Step 1: use the row-by-vector product rule on row 1: 1*5 + 2*2 = 9. Step 2: use the row-by-vector product rule on row 2: 0*5 + 3*2 = 6. Step 3: use the row-by-vector product rule on row 3: 4*5 + (-1)*2 = 18. The answer is (9, 6, 18)."
          - problem: "Find $A\\mathbf{x}$ for $A = \\begin{pmatrix}1&-2&0\\\\3&1&4\\end{pmatrix}$ and $\\mathbf{x} = (-1, 2, -3)$, and give the answer as (x, y)."
            answer: "(-5, -13)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "Full object: A = [[1,-2,0],[3,1,4]] and x = (-1,2,-3). Step 1: use the row-by-vector product rule on row 1: 1*(-1) + (-2)*2 + 0*(-3) = -5. Step 2: use the row-by-vector product rule on row 2: 3*(-1) + 1*2 + 4*(-3) = -13. The answer is (-5, -13)."
          - problem: "Evaluate $A\\mathbf{x}$ for $A = \\begin{pmatrix}2&-1\\\\1&3\\\\-2&0\\end{pmatrix}$ and $\\mathbf{x} = (3, -4)$, and give the answer as (x, y, z)."
            answer: "(10, -9, -6)"
            answer_contract: {"arity": 3, "kind": "coordinates"}
            solution_sketch: "Full object: A = [[2,-1],[1,3],[-2,0]] and x = (3,-4). Step 1: use the row-by-vector product rule on row 1: 2*3 + (-1)*(-4) = 10. Step 2: use the row-by-vector product rule on row 2: 1*3 + 3*(-4) = -9. Step 3: use the row-by-vector product rule on row 3: (-2)*3 + 0*(-4) = -6. The answer is (10, -9, -6)."
        constraints: "the vector length must match the number of columns; sizes 2x3 and 3x2"
      - id: kp3
        name: Ax as a combination of columns
        key_prerequisites: [computing-dot-products, vector-arithmetic]
        exemplars:
          - problem: "For A = [2,1;1,3] and x = (3,-1), compute Ax by forming 3a1 - a2 from the columns a1 and a2 of A. Give the answer as (u, v)."
            answer: "(5, 0)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "Step 1: Read the columns of A: a1 = (2,1) and a2 = (1,3). Step 2: Use the column combination rule Ax = x1 a1 + x2 a2, which gives 3a1 - a2. Step 3: Compute 3(2,1) - (1,3) = (6,3) - (1,3) = (5,0). The answer is (5, 0)."
          - problem: 'For $A = \begin{pmatrix}1&2\\0&1\end{pmatrix}$ and $\mathbf{x} = (2, 3)$, compute $A\mathbf{x}$ both row-by-row and as $2\mathbf{a}_1 + 3\mathbf{a}_2$.'
            answer: "(8, 3)"
            solution_sketch: '$2(1, 0) + 3(2, 1) = (8, 3)$; rows give $2 + 6 = 8$ and $3$.'
          - problem: "For A = [3,0;1,2] and x = (2,5), compute Ax by forming 2a1 + 5a2 from the columns a1 and a2. Give the answer as (u, v)."
            answer: "(6, 12)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "Step 1: The columns are a1 = (3,1) and a2 = (0,2). Step 2: Use Ax = x1 a1 + x2 a2, so Ax = 2a1 + 5a2. Step 3: 2(3,1) + 5(0,2) = (6,2) + (0,10) = (6,12). The answer is (6, 12)."
          - problem: "For A = [1,-1;2,4] and x = (-3,2), compute Ax by forming -3a1 + 2a2 from the columns a1 and a2. Give the answer as (u, v)."
            answer: "(-5, 2)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "Step 1: The columns are a1 = (1,2) and a2 = (-1,4). Step 2: Use the column combination rule Ax = x1 a1 + x2 a2, which is -3a1 + 2a2. Step 3: -3(1,2) + 2(-1,4) = (-3,-6) + (-2,8) = (-5,2). The answer is (-5, 2)."
          - problem: "Let A have columns a1 = (2,1) and a2 = (0,3). For x = (4,-2), compute Ax as 4a1 - 2a2. Give the answer as (u, v)."
            answer: "(8, -2)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "Step 1: The columns are a1 = (2,1) and a2 = (0,3). Step 2: Use the column view Ax = x1 a1 + x2 a2, so Ax = 4a1 - 2a2. Step 3: 4(2,1) - 2(0,3) = (8,4) - (0,6) = (8,-2). The answer is (8, -2)."
          - problem: "For A = [0,2;3,1] and x = (5,-4), compute Ax by forming 5a1 - 4a2 from the columns a1 and a2. Give the answer as (u, v)."
            answer: "(-8, 11)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "Step 1: The columns are a1 = (0,3) and a2 = (2,1). Step 2: Use the column combination rule Ax = x1 a1 + x2 a2, so Ax = 5a1 - 4a2. Step 3: 5(0,3) - 4(2,1) = (0,15) - (8,4) = (-8,11). The answer is (-8, 11)."
        constraints: "verify the column view numerically on 2x2 matrices"
    diagnostic_exemplar:
      problem: 'Compute $A\mathbf{x}$ for $A = \begin{pmatrix}2&1&0\\1&0&3\end{pmatrix}$ and $\mathbf{x} = (4, -1, 2)$, and check the result against $4\mathbf{a}_1 - \mathbf{a}_2 + 2\mathbf{a}_3$.'
      answer: '(7, 10)'
      solution_sketch: 'Row by row: $8 - 1 + 0 = 7$ and $4 + 0 + 6 = 10$. As columns: $4(2, 1) - (1, 0) + 2(0, 3) = (7, 10)$.'
    anki_seeds:
      - front: '$A\mathbf{x}$ equals which combination of the columns of $A$?'
        back: 'The linear combination of the columns with the entries of $\mathbf{x}$ as weights.'
        type: basic
      - front: 'For $A\mathbf{x}$ to be defined, the length of $\mathbf{x}$ must equal...'
        back: 'the number of columns of $A$.'
        type: basic

  - id: matrix-vector-equations
    name: Matrix and Vector Equations
    core: true
    difficulty: 0.6
    drill: false
    answer_kind: numeric
    expected_time_secs: 150
    prerequisites:
      - id: computing-matrix-vector-products
        weight: 0.7
        key: true
      - id: row-reduction-echelon-forms
        weight: 0.6
        key: true
      - id: linear-combinations-of-vectors
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: Systems as Ax = b and as vector equations
        key_prerequisites: [computing-matrix-vector-products, row-reduction-echelon-forms]
        exemplars:
          - problem: "Consider the system 2x + 3y = 7, x - y = 1. Give the coefficient matrix A as [a,b;c,d]."
            answer: "[2,3;1,-1]"
            answer_contract: {"cols": 2, "kind": "matrix", "rows": 2}
            solution_sketch: "Step 1 (matrix form): put x terms in the first column and y terms in the second column. Row 1 has coefficients 2 and 3; row 2 has coefficients 1 and -1. The coefficient matrix is [2,3;1,-1]."
          - problem: "Express b = (4, 5) as a linear combination of a1 = (1, 2) and a2 = (2, 1). Give the coefficients as (c1, c2)."
            answer: "(2, 1)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "Step 1 (linear combination): write c1(1, 2) + c2(2, 1) = (4, 5). Step 2 (elimination): the equations c1 + 2c2 = 4 and 2c1 + c2 = 5 give c2 = 1 and c1 = 2. The coefficients are (2, 1)."
          - problem: "The system x + 2y = 3, 4x + 5y = 6 is equivalent to x a1 + y a2 = b. Give a1 + a2 as (p, q)."
            answer: "(3, 9)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "Step 1 (vector equation): the columns of the coefficient matrix are a1 = (1, 4) and a2 = (2, 5). Step 2 (vector addition): add the corresponding components, 1 + 2 = 3 and 4 + 5 = 9. The sum a1 + a2 is (3, 9)."
          - problem: "The system 3x + y = 4, x + 2y = 5 is equivalent to x a1 + y a2 = b. Give a1 + a2 as (p, q)."
            answer: "(4, 3)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "Step 1 (vector equation): the columns of the coefficient matrix are a1 = (3, 1) and a2 = (1, 2). Step 2 (vector addition): add components, 3 + 1 = 4 and 1 + 2 = 3. The sum a1 + a2 is (4, 3)."
          - problem: "Express b = (3, -1) as a linear combination of a1 = (1, 1) and a2 = (1, -1). Give the coefficients as (c1, c2)."
            answer: "(1, 2)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "Step 1 (linear combination): set c1(1, 1) + c2(1, -1) = (3, -1). Step 2 (elimination): the equations c1 + c2 = 3 and c1 - c2 = -1 give c1 = 1 and c2 = 2. The coefficients are (1, 2)."
          - problem: "The vector equation x(2, 1) + y(1, 3) = (5, 7) is equivalent to A x = b. Give a1 - a2 as (p, q), where a1 and a2 are the columns of A."
            answer: "(1, -2)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "Step 1 (vector equation): the columns are a1 = (2, 1) and a2 = (1, 3). Step 2 (vector subtraction): subtract components, 2 - 1 = 1 and 1 - 3 = -2. The vector a1 - a2 is (1, -2)."
        constraints: "integer coefficient vectors; combination coefficients in -3..3"
      - id: kp2
        name: Membership in a span via a system
        key_prerequisites: [computing-matrix-vector-products, row-reduction-echelon-forms]
        exemplars:
          - problem: "Let a1 = (1, 0, 1) and a2 = (0, 1, 1). State whether b = (1, 2, 3) lies in the span of a1 and a2, and give the coefficient c1 of a1. Give the verdict and c1."
            answer: "verdict = in; c1 = 1"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["in"], ["out"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "c1"}]}
            solution_sketch: "Full equation: c1(1,0,1) + c2(0,1,1) = (1,2,3). Step 1: equate the first two coordinates; this forces c1 = 1 and c2 = 2. Step 2: check the third coordinate: 1 + 2 = 3, so the equation is consistent. The out option is wrong because the third coordinate matches. The answer is verdict = in; c1 = 1."
          - problem: "Let a1 = (1, 0, 1) and a2 = (0, 1, 1). State whether b = (2, 1, 4) lies in the span of a1 and a2, and give the coefficient c1 of a1. Give the verdict and c1."
            answer: "verdict = out; c1 = 2"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["in"], ["out"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "c1"}]}
            solution_sketch: "Full equation: c1(1,0,1) + c2(0,1,1) = (2,1,4). Step 1: equate the first two coordinates; this forces c1 = 2 and c2 = 1. Step 2: check the third coordinate: 2 + 1 = 3, which is not 4, so the system is inconsistent. The in option is wrong because the third coordinate does not match. The answer is verdict = out; c1 = 2."
          - problem: "Let a1 = (1, 0, 2) and a2 = (0, 1, 3). State whether b = (2, -1, 1) lies in the span of a1 and a2, and give the coefficient c2 of a2. Give the verdict and c2."
            answer: "verdict = in; c2 = -1"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["in"], ["out"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "c2"}]}
            solution_sketch: "Full equation: c1(1,0,2) + c2(0,1,3) = (2,-1,1). Step 1: equate the first two coordinates; this forces c1 = 2 and c2 = -1. Step 2: check the third coordinate: 2*2 + 3*(-1) = 1, so the equation is consistent. The out option is wrong because the third coordinate matches. The answer is verdict = in; c2 = -1."
          - problem: "Let a1 = (1, 0, -1) and a2 = (0, 1, 4). State whether b = (3, -2, 5) lies in the span of a1 and a2, and give the coefficient c1 of a1. Give the verdict and c1."
            answer: "verdict = out; c1 = 3"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["in"], ["out"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "c1"}]}
            solution_sketch: "Full equation: c1(1,0,-1) + c2(0,1,4) = (3,-2,5). Step 1: equate the first two coordinates; this forces c1 = 3 and c2 = -2. Step 2: check the third coordinate: -3 + 4*(-2) = -11, which is not 5, so the system is inconsistent. The in option is wrong because the third coordinate does not match. The answer is verdict = out; c1 = 3."
          - problem: "Let a1 = (1, 0, 4) and a2 = (0, 1, -1). The vector b = (3, 2, 10) lies in the span of a1 and a2. Find the coefficients c1 and c2 in c1 a1 + c2 a2 = b. Give the answer as (c1, c2)."
            answer: "(3, 2)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "Full equation: c1(1,0,4) + c2(0,1,-1) = (3,2,10). Step 1: equate the first two coordinates; this gives c1 = 3 and c2 = 2. Step 2: check the third coordinate: 4*3 + (-1)*2 = 10, so the coefficient pair is consistent. The answer is (3, 2)."
          - problem: "Let a1 = (1, 0, -2) and a2 = (0, 1, 5). The vector b = (4, -3, -23) lies in the span of a1 and a2. Find the coefficients c1 and c2 in c1 a1 + c2 a2 = b. Give the answer as (c1, c2)."
            answer: "(4, -3)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "Full equation: c1(1,0,-2) + c2(0,1,5) = (4,-3,-23). Step 1: equate the first two coordinates; this gives c1 = 4 and c2 = -3. Step 2: check the third coordinate: -2*4 + 5*(-3) = -23, so the coefficient pair is consistent. The answer is (4, -3)."
        constraints: "2 vectors in R^3 with the first two components forcing the coefficients; answer verifiable in one line"
      - id: kp3
        name: Solving Ax = b by row reduction
        key_prerequisites: [computing-matrix-vector-products, row-reduction-echelon-forms]
        exemplars:
          - problem: 'Solve $A\mathbf{x} = \mathbf{b}$ for $A = \begin{pmatrix}1&1\\1&-1\end{pmatrix}$, $\mathbf{b} = (4, 2)$.'
            answer: "x = (3, 1)"
            solution_sketch: '$x + y = 4$, $x - y = 2$; adding gives $2x = 6$.'
          - problem: 'Solve $\begin{pmatrix}1&2\\2&3\end{pmatrix}\mathbf{x} = (4, 7)$.'
            answer: "x = (2, 1)"
            solution_sketch: '$R_2 - 2R_1$ gives $-y = -1$; then $x = 4 - 2 = 2$.'
          - problem: "Solve the system 2x + y = 5, x + 3y = 10. Give the answer as (x, y)."
            answer: "(1, 3)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "The augmented matrix is [2,1,5; 1,3,10]. Row reduction: replace R1 by R1 - 2R2 to get [0,-5,-15; 1,3,10], so -5y = -15 and y = 3. Back-substitution: x + 3(3) = 10 gives x = 1. The solution is (1, 3)."
          - problem: "Solve the matrix equation A x = b with A = [[1,2],[3,-1]] and b = (6,-10). Give the answer as (x, y)."
            answer: "(-2, 4)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "The augmented matrix is [1,2,6; 3,-1,-10]. Row reduction: R2 - 3R1 gives [1,2,6; 0,-7,-28], so -7y = -28 and y = 4. Back-substitution: x + 2(4) = 6 gives x = -2. The solution is (-2, 4)."
          - problem: "Solve the system 3x + y = 11, 2x - 2y = 10. Give the answer as (x, y)."
            answer: "(4, -1)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "The augmented matrix is [3,1,11; 2,-2,10]. Row reduction: divide R2 by 2 to get [1,-1,5], then replace R1 by R1 - 3R2 to get [0,4,-4], so 4y = -4 and y = -1. Back-substitution: x - (-1) = 5 gives x = 4. The solution is (4, -1)."
          - problem: "Solve the system x + y + z = 2, 2x - y + z = 7, x + 2y - z = -6. Give the answer as (x, y, z)."
            answer: "(1, -2, 3)"
            answer_contract: {"arity": 3, "kind": "coordinates"}
            solution_sketch: "The augmented matrix is [1,1,1,2; 2,-1,1,7; 1,2,-1,-6]. Row reduction: R2 - 2R1 gives [0,-3,-1,3] and R3 - R1 gives [0,1,-2,-8]; swapping R2 and R3 gives [0,1,-2,-8], then R3 + 3R2 gives [0,0,-7,-21], so -7z = -21 and z = 3. Back-substitution: y - 2(3) = -8 gives y = -2, and x + (-2) + 3 = 2 gives x = 1. The solution is (1, -2, 3)."
        constraints: "unique integer solutions in -5..5"
    diagnostic_exemplar:
      problem: 'Express $\mathbf{b} = (3, 5)$ as a linear combination of $\mathbf{a}_1 = (1, 1)$ and $\mathbf{a}_2 = (1, -1)$.'
      answer: "b = 4a1 - 1a2 (c1 = 4, c2 = -1)"
      answer_contract: {kind: none}
      solution_sketch: '$c_1 + c_2 = 3$, $c_1 - c_2 = 5$; adding gives $c_1 = 4$, so $c_2 = -1$.'
    anki_seeds:
      - front: '$A\mathbf{x} = \mathbf{b}$ is consistent exactly when $\mathbf{b}$ lies in...'
        back: 'the span of the columns of $A$.'
        type: basic
      - front: 'The vector equation $c_1\mathbf{a}_1 + \cdots + c_n\mathbf{a}_n = \mathbf{b}$ has the same solutions as...'
        back: '$A\mathbf{x} = \mathbf{b}$ where the $\mathbf{a}_i$ are the columns of $A$.'
        type: basic

  - id: homogeneous-systems
    name: Homogeneous Systems
    core: true
    difficulty: 0.6
    drill: false
    answer_kind: numeric
    expected_time_secs: 150
    prerequisites:
      - id: solution-sets-free-variables
        weight: 0.7
        key: true
      - id: matrix-vector-equations
        weight: 0.5
    knowledge_points:
      - id: kp1
        name: The trivial solution
        key_prerequisites: [solution-sets-free-variables]
        exemplars:
          - problem: "Solve the homogeneous system 2x + y = 0, x - 3y = 0. Give the answer as (x, y)."
            answer: "(0,0)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "Rule: a homogeneous system always has the trivial solution x = 0, y = 0, since 0 always works. Row reduce: R2 - (1/2)R1 gives -(7/2)y = 0, so y = 0, and the first equation then gives x = 0. Check: 2(0) + 0 = 0 and 0 - 3(0) = 0. The solution is (0,0)."
          - problem: "The homogeneous system 5x + 2y = 0, x - y = 0 always has the trivial solution. Find the value of x in that solution."
            answer: "0"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Rule: the trivial solution x = 0, y = 0 works in every homogeneous system because each left side becomes 0. Check: 5(0) + 2(0) = 0 and 0 - 0 = 0. The value of x is 0."
          - problem: "A solution of a homogeneous 2x2 system is (0, 0). Which term names this solution?"
            answer: "trivial"
            answer_contract: {"kind": "label", "options": [["trivial"], ["nontrivial"], ["inconsistent"], ["free"]]}
            solution_sketch: "Rule: x = 0, y = 0 always satisfies every equation of a homogeneous system. Option 'nontrivial' is wrong because nontrivial means a solution other than (0, 0). Option 'inconsistent' is wrong because a homogeneous system always has at least one solution. Option 'free' is wrong because free describes a variable, not a solution. The correct option is trivial."
          - problem: "The homogeneous system 3x - y = 0, 2x + 4y = 0 has the trivial solution. How many solutions does the system have?"
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Rule: the trivial solution x = 0, y = 0 always works, so at least one solution exists. Row reduce: R2 + (2/3)R1 gives (10/3)y = 0, so y = 0 and then x = 0; there is no free variable. The solution set holds exactly one pair, so the system has 1 solution."
          - problem: "For the homogeneous system x + 7y = 0, 4x + y = 0, how many of the variables x and y equal 0 in the trivial solution?"
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Rule: the trivial solution sets every variable to 0, since 0 always works in a homogeneous system. Check: 0 + 7(0) = 0 and 4(0) + 0 = 0. Both variables equal 0, so the count is 2."
          - problem: "The homogeneous system 6x + y = 0, x + 5y = 0 has the trivial solution. Find the value of y in that solution."
            answer: "0"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Rule: the trivial solution of a homogeneous system is x = 0, y = 0, because 0 always works. Check: 6(0) + 0 = 0 and 0 + 5(0) = 0. The value of y is 0."
        constraints: "2x2 systems; emphasize that 0 always works"
      - id: kp2
        name: Nontrivial solutions in parametric form
        key_prerequisites: [solution-sets-free-variables]
        exemplars:
          - problem: 'Find all solutions of $x + 2y = 0$, $2x + 4y = 0$.'
            answer: "x = -2t, y = t"
            answer_contract: {"kind":"list","member":{"kind":"exact"},"ordered":false}
            solution_sketch: 'The second equation is redundant; set $y = t$.'
          - problem: 'Find all solutions of $x + y - z = 0$, $y + z = 0$, taking $z = t$.'
            answer: "x = 2t, y = -t, z = t"
            answer_contract: {"kind":"list","member":{"kind":"exact"},"ordered":false}
            solution_sketch: '$y = -t$; then $x = -y + z = t + t = 2t$.'
        constraints: "exactly one free variable; integer parametric coefficients"
      - id: kp3
        name: When nontrivial solutions exist
        key_prerequisites: [solution-sets-free-variables, matrix-vector-equations]
        exemplars:
          - problem: "A homogeneous system has 4 equations, 7 unknowns, and its coefficient matrix has 4 pivots. State whether it has a nonzero solution other than the trivial one, and give the number of free variables."
            answer: "verdict = yes; free = 3"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["yes"], ["no"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "free"}]}
            solution_sketch: "The system has 4 equations, 7 unknowns, and a coefficient matrix with 4 pivots. Use the pivot-count rule: free variables = unknowns - pivots = 7 - 4 = 3. Since 3 free variables exist, a nonzero solution is guaranteed. The answer is verdict = yes; free = 3."
          - problem: "A homogeneous system has 3 equations, 3 unknowns, and its coefficient matrix has 3 pivots. How many free variables does it have?"
            answer: "0"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The system has 3 equations, 3 unknowns, and the matrix has 3 pivots. Use the pivot-count rule: free variables = unknowns - pivots = 3 - 3 = 0. The number of free variables is 0."
          - problem: "A homogeneous system has 5 unknowns and its coefficient matrix has 2 pivots. How many free variables does it have?"
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The system has 5 unknowns and the matrix has 2 pivots. Use the pivot-count rule: free variables = unknowns - pivots = 5 - 2 = 3. The number of free variables is 3."
          - problem: "A homogeneous system has 4 equations and 6 unknowns. Find the minimum number of free variables."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The system has 4 equations and 6 unknowns. Use the pivot-count rule: at most 4 pivots, so free variables = 6 - pivots >= 6 - 4 = 2. The minimum number of free variables is 2."
          - problem: "A homogeneous system has 4 equations and 3 unknowns. State whether a nonzero solution is guaranteed, and give the minimum number of free variables."
            answer: "verdict = no; free = 0"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["yes"], ["no"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "free"}]}
            solution_sketch: "The system has 4 equations and 3 unknowns. Use the pivot-count rule: at most 3 pivots, so free variables = 3 - pivots can be 0 with 3 pivots. A nonzero solution is not guaranteed. The answer is verdict = no; free = 0."
          - problem: "A homogeneous system has 3 equations and 5 unknowns. State whether a nonzero solution is guaranteed, and give the minimum number of free variables."
            answer: "verdict = yes; free = 2"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["yes"], ["no"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "free"}]}
            solution_sketch: "The system has 3 equations and 5 unknowns. Use the pivot-count rule: at most 3 pivots, so free variables = 5 - pivots >= 5 - 3 = 2. At least 2 free variables guarantee a nonzero solution. The answer is verdict = yes; free = 2."
        constraints: "reason from pivot counts; no computation beyond counting"
    diagnostic_exemplar:
      problem: 'A homogeneous system in $x, y, z$ consists of the single equation $x + 3y - z = 0$. Must it have nonzero solutions? Give all solutions, taking $y = s$ and $z = t$.'
      answer: 'Yes (1 equation, 3 unknowns leaves free variables); x = -3s + t, y = s, z = t'
      answer_contract: {kind: none}
      solution_sketch: 'With more unknowns than equations there is at least one free variable, so nontrivial solutions exist; solving for the pivot variable gives $x = -3y + z$.'
    anki_seeds:
      - front: 'A homogeneous system $A\mathbf{x} = \mathbf{0}$ is always consistent because...'
        back: '$\mathbf{x} = \mathbf{0}$ (the trivial solution) always works.'
        type: basic
      - front: '$A\mathbf{x} = \mathbf{0}$ has nontrivial solutions exactly when...'
        back: 'the system has at least one free variable (fewer pivots than unknowns).'
        type: basic

  - id: polynomial-curve-fitting
    name: Fitting Curves with Linear Systems
    core: false                # applications leaf topic
    difficulty: 0.6
    drill: false
    answer_kind: numeric
    expected_time_secs: 180
    prerequisites:
      - id: row-reduction-echelon-forms
        weight: 0.7
        key: true
      - id: quadratic-graphs-vertex
        weight: 0.4
      - id: graphing-linear-equations
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: Lines through two points
        key_prerequisites: [row-reduction-echelon-forms, graphing-linear-equations]
        exemplars:
          - problem: 'Find the line $y = ax + b$ through $(1, 3)$ and $(2, 5)$.'
            answer: "y = 2x + 1"
            solution_sketch: '$a + b = 3$, $2a + b = 5$; subtracting gives $a = 2$, then $b = 1$.'
          - problem: 'Find the line $y = ax + b$ through $(1, 4)$ and $(3, 8)$.'
            answer: "y = 2x + 2"
            solution_sketch: '$a + b = 4$, $3a + b = 8$; subtracting gives $2a = 4$.'
          - problem: "Find the line y = ax + b through (1, 1) and (2, 4). Give the answer as an expression in x."
            answer: "3x-2"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "Form the linear system from y = ax + b: 1 = a + b and 4 = 2a + b. Solve by elimination: subtract to get 3 = a. Substitute a = 3 into 1 = a + b to get b = -2. The line is 3x-2."
          - problem: "Find the line y = ax + b through (0, 3) and (1, 1). Give the answer as (a, b)."
            answer: "(-2, 3)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "Form the linear system from y = ax + b: 3 = b and 1 = a + b. Solve by substitution: b = 3, so 1 = a + 3. Then a = -2, and the coefficient pair is (-2, 3)."
          - problem: "A line y = ax + b passes through (-1, 4) and (1, -2). Find the slope a."
            answer: "-3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Write the two point conditions for y = ax + b: 4 = -a + b and -2 = a + b. Solve by elimination: subtract to get -6 = 2a, so a = -3. The slope a is -3."
          - problem: "Find the line y = ax + b through (0, 1) and (1, 4). Give the answer as an expression in x."
            answer: "3x+1"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "Form the linear system from y = ax + b: 1 = b and 4 = a + b. Solve by substitution: b = 1, so 4 = a + 1. Then a = 3, and the line is 3x+1."
        constraints: "integer sample points; a and b integers in -3..3"
      - id: kp2
        name: Parabolas through three points
        key_prerequisites: [row-reduction-echelon-forms, quadratic-graphs-vertex]
        exemplars:
          - problem: 'Find the parabola $y = ax^2 + bx + c$ through $(0, 1)$, $(1, 2)$, $(2, 5)$.'
            answer: "y = x^2 + 1"
            solution_sketch: '$c = 1$; $a + b = 1$; $4a + 2b = 4$. Solving gives $a = 1$, $b = 0$.'
          - problem: 'Find the parabola $y = ax^2 + bx + c$ through $(1, 0)$, $(2, 3)$, $(3, 8)$.'
            answer: "y = x^2 - 1"
            solution_sketch: 'Differences of the three equations give $3a + b = 3$ and $5a + b = 5$, so $a = 1$, $b = 0$, $c = -1$.'
          - problem: "Find the parabola $y = ax^2 + bx + c$ through $(0, 2)$, $(1, 6)$, and $(2, 14)$. Give the answer as a polynomial in x."
            answer: "2x^2+2x+2"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "Step 1 (substitute points): the system is $c = 2$, $a + b + c = 6$, and $4a + 2b + c = 14$. Step 2 (eliminate c): subtract to get $a + b = 4$ and $2a + b = 6$. Step 3 (row reduce): subtract gives $a = 2$, then $b = 2$, and $c = 2$. The fitted polynomial is 2x^2+2x+2."
          - problem: "Find the parabola $y = ax^2 + bx + c$ through $(0, -1)$, $(1, 1)$, and $(2, 7)$. Give the answer as a polynomial in x."
            answer: "2x^2-1"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "Step 1 (substitute points): the system is $c = -1$, $a + b + c = 1$, and $4a + 2b + c = 7$. Step 2 (eliminate c): subtract to get $a + b = 2$ and $2a + b = 4$. Step 3 (row reduce): subtract gives $a = 2$, then $b = 0$, and $c = -1$. The fitted polynomial is 2x^2-1."
          - problem: "A projectile follows $y = ax^2 + bx + c$. It is at $(0, 1)$, $(1, 2)$, and $(2, 7)$. Find the polynomial that fits these points. Give the answer as a polynomial in x."
            answer: "2x^2-x+1"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "Step 1 (substitute data points): the system is $c = 1$, $a + b + c = 2$, and $4a + 2b + c = 7$. Step 2 (eliminate c): subtract to get $a + b = 1$ and $2a + b = 3$. Step 3 (row reduce): subtract gives $a = 2$, then $b = -1$, and $c = 1$. The fitted polynomial is 2x^2-x+1."
          - problem: "Find the parabola $y = ax^2 + bx + c$ through $(0, -2)$, $(1, -3)$, and $(2, -2)$. Give the answer as a polynomial in x."
            answer: "x^2-2x-2"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "Step 1 (substitute points): the system is $c = -2$, $a + b + c = -3$, and $4a + 2b + c = -2$. Step 2 (eliminate c): subtract to get $a + b = -1$ and $2a + b = 0$. Step 3 (row reduce): subtract gives $a = 1$, then $b = -2$, and $c = -2$. The fitted polynomial is x^2-2x-2."
        constraints: "integer sample points; coefficients a, b, c integers in -3..3; include x = 0 among the points when possible"
      - id: kp3
        name: Fitting from mixed conditions
        key_prerequisites: [row-reduction-echelon-forms, quadratic-graphs-vertex]
        exemplars:
          - problem: 'Find $y = ax^2 + bx + c$ with $y(0) = 1$, $y(1) = 0$, $y(-1) = 4$.'
            answer: "y = x^2 - 2x + 1"
            solution_sketch: '$c = 1$; $a + b = -1$; $a - b = 3$. So $a = 1$, $b = -2$.'
          - problem: 'Find $y = ax^2 + bx + c$ with $y(0) = 0$, $y(2) = 6$, $y(-1) = 3$.'
            answer: "y = 2x^2 - x"
            solution_sketch: '$c = 0$; $4a + 2b = 6$ and $a - b = 3$; so $2a + b = 3$ and $a - b = 3$, giving $a = 2$, $b = -1$.'
          - problem: "A quadratic y = ax^2 + bx + c has y(1) = 4, y(2) = 9 and y(3) = 18. Find the polynomial as an expression in x."
            answer: "2x^2-x+3"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "Write the model as y = ax^2 + bx + c. Substitution gives a+b+c=4, 4a+2b+c=9, and 9a+3b+c=18. Subtract the first two equations to get 3a+b=5, and the last two to get 5a+b=9; elimination gives a=2 and b=-1. Then c=3 from the first equation. The polynomial is 2x^2-x+3."
          - problem: "Find y = ax^2 + bx + c with y(0) = 5, y(2) = 3 and y(3) = 8. Give the polynomial as an expression in x."
            answer: "2x^2-5x+5"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "Write the model as y = ax^2 + bx + c. The condition y(0)=5 gives c=5. Substitute the other two values: 4a+2b+5=3 and 9a+3b+5=8, so 2a+b=-1 and 3a+b=1. Elimination gives a=2 and b=-5. The polynomial is 2x^2-5x+5."
          - problem: "Find the quadratic y = ax^2 + bx + c with y(1) = 0, y(-1) = 6 and y(2) = 0. Give the polynomial as an expression in x."
            answer: "x^2-3x+2"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "Write the model as y = ax^2 + bx + c. The conditions give a+b+c=0, a-b+c=6, and 4a+2b+c=0. Subtract the first two equations to get 2b=-6, so b=-3. The first and third equations then give a=1 and c=2 by elimination. The polynomial is x^2-3x+2."
          - problem: "A quadratic revenue model R = ax^2 + bx + c has R(0) = 0, R(1) = 40 and R(3) = 60. Find the revenue model as an expression in x."
            answer: "-10x^2+50x"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "Write the model as R = ax^2 + bx + c. The condition R(0)=0 gives c=0. The values R(1)=40 and R(3)=60 give a+b=40 and 9a+3b=60, which simplifies to 3a+b=20. Elimination gives a=-10 and b=50. The revenue model is -10x^2+50x."
        constraints: "conditions given as function values; integer coefficients"
    diagnostic_exemplar:
      problem: 'Find the parabola $y = ax^2 + bx + c$ through $(0, 3)$, $(1, 2)$, and $(2, 5)$.'
      answer: 'y = 2x^2 - 3x + 3'
      solution_sketch: '$c = 3$; then $a + b = -1$ and $4a + 2b = 2$, so $a = 2$ and $b = -3$.'
    anki_seeds:
      - front: 'Fitting a degree-$n$ polynomial exactly through $n + 1$ points with distinct $x$-values sets up how many linear equations?'
        back: '$n + 1$ (one per point), in the $n + 1$ coefficients.'
        type: basic

  - id: linear-systems-applications
    name: Applications of Linear Systems
    core: false                # applications leaf topic
    difficulty: 0.65
    drill: false
    answer_kind: numeric
    expected_time_secs: 240
    prerequisites:
      - id: solution-sets-free-variables
        weight: 0.6
        key: true
      - id: row-reduction-echelon-forms
        weight: 0.6
        key: true
      - id: systems-word-problems
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: Network flow
        key_prerequisites: [solution-sets-free-variables]
        exemplars:
          - problem: "At junction A, 120 cars/hour enter and split into flows x1 and x2. At junction B, flow x1 plus 40 cars/hour enter, and 90 cars/hour leave. Find x1 and x2 as (x1, x2)."
            answer: "(50, 70)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "The conservation equations are x1 + x2 = 120 and x1 + 40 = 90. From the second, x1 = 50; then the first gives x2 = 70. The flows are (50, 70)."
          - problem: "A network has conservation equations x1 + x2 = 80 and x2 + x3 = 50. If x3 = 20, find x1 and x2 as (x1, x2)."
            answer: "(50, 30)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "The conservation equations are x1 + x2 = 80 and x2 + x3 = 50 with x3 = 20. From the second, x2 = 30; then the first gives x1 = 50. The flows are (50, 30)."
          - problem: "At junction A, 150 liters/min enter and split into flows x1 and x2. At junction B, flow x1 plus y liters/min enter, and 100 liters/min leave. If x1 = 60 and x2 = 90, find y."
            answer: "40"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The conservation equations are x1 + x2 = 150 and x1 + y = 100 with x1 = 60, x2 = 90. The first checks 60 + 90 = 150; the second gives 60 + y = 100. Therefore y = 40."
          - problem: "At junction A, 100 liters/s enter and split into flows x1 and x2. At junction B, flow x1 plus 30 liters/s enter, and flow x3 leaves. At junction C, flows x2 and x3 enter, and 130 liters/s leave. If x1 = 40, find x2 and x3 as (x2, x3)."
            answer: "(60, 70)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "The conservation equations are x1 + x2 = 100, x3 = x1 + 30, and x2 + x3 = 130 with x1 = 40. The first gives x2 = 60; the second gives x3 = 70. Thus (x2, x3) = (60, 70)."
          - problem: "At a junction, 90 units/h enter and split into flows x1 and x2 with x2 = 2 x1. Find x1 and x2 as (x1, x2)."
            answer: "(30, 60)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "The conservation equation is x1 + x2 = 90 with x2 = 2 x1. Substitute to get 3 x1 = 90, so x1 = 30 and x2 = 60. The flows are (30, 60)."
          - problem: "At junction A, T cars/h enter and split into flows x1 and x2. At junction B, flow x1 plus 25 cars/h enter, and 75 cars/h leave. If x2 = 40, find T and x1 as (T, x1)."
            answer: "(90, 50)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "The conservation equations are T = x1 + x2 and x1 + 25 = 75 with x2 = 40. The second gives x1 = 50; the first gives T = 90. Thus (T, x1) = (90, 50)."
        constraints: "flow-in = flow-out at each node; totals in 20..200, integer solutions"
      - id: kp2
        name: Word problems with three unknowns
        key_prerequisites: [row-reduction-echelon-forms, systems-word-problems]
        exemplars:
          - problem: "A cinema sells adult tickets for 9 euros, student tickets for 6 euros, and child tickets for 3 euros. It sold 18 tickets for a total of 102 euros. It sold twice as many student tickets as child tickets. How many of each type were sold? Give the answer as (adult, student, child)."
            answer: "(3, 10, 5)"
            answer_contract: {"arity": 3, "kind": "coordinates"}
            solution_sketch: "Set up: let a, s, c be the numbers of adult, student, and child tickets. The total-count equation is a + s + c = 18, the value equation is 9a + 6s + 3c = 102, and the relation is s = 2c. Substitute s = 2c and a = 18 - 3c into the value equation: 9(18 - 3c) + 6(2c) + 3c = 102, which simplifies to 162 - 12c = 102. Solve to get c = 5, then s = 10 and a = 3. The ticket counts are (3, 10, 5)."
          - problem: 'Three numbers sum to $12$; the second is twice the first; the third exceeds the first by $4$. Find them.'
            answer: "2, 4, 6"
            solution_sketch: '$x + 2x + (x + 4) = 12$ gives $x = 2$.'
          - problem: "A collection of 14 coins consists of quarters, dimes, and nickels. The total value is 190 cents. There are twice as many dimes as quarters. How many of each coin are there? Give the answer as (quarters, dimes, nickels)."
            answer: "(4, 8, 2)"
            answer_contract: {"arity": 3, "kind": "coordinates"}
            solution_sketch: "Let q, d, n be quarters, dimes, and nickels. The equations are q + d + n = 14, 25q + 10d + 5n = 190, and d = 2q. Substitute d = 2q and n = 14 - 3q into the value equation: 25q + 20q + 5(14 - 3q) = 190, so 30q + 70 = 190. Solve q = 4, d = 8, n = 2. The coin counts are (4, 8, 2)."
          - problem: "A farm has chickens, ducks, and geese. There are 18 animals in all. The number of chickens is twice the number of geese, and the number of ducks is 2 more than the number of geese. How many of each animal are there? Give the answer as (chickens, ducks, geese)."
            answer: "(8, 6, 4)"
            answer_contract: {"arity": 3, "kind": "coordinates"}
            solution_sketch: "Let c, d, g be chickens, ducks, and geese. The equations are c + d + g = 18, c = 2g, and d = g + 2. Substitute: 2g + (g + 2) + g = 18, so 4g + 2 = 18. Solve g = 4, c = 8, d = 6. The animal counts are (8, 6, 4)."
          - problem: "Ana, Ben, and Cara are siblings. Their ages add to 30. Ben is twice as old as Ana, and Cara is 6 years older than Ana. How old is each? Give the answer as (Ana, Ben, Cara)."
            answer: "(6, 12, 12)"
            answer_contract: {"arity": 3, "kind": "coordinates"}
            solution_sketch: "Let a, b, c be Ana, Ben, and Cara's ages. The equations are a + b + c = 30, b = 2a, and c = a + 6. Substitute: a + 2a + (a + 6) = 30, so 4a + 6 = 30. Solve a = 6, b = 12, c = 12. The ages are (6, 12, 12)."
          - problem: "A team scored 44 points on 25 scoring shots: 2-point goals, 3-point goals, and 1-point free throws. It made twice as many free throws as 3-point goals. How many of each type did it make? Give the answer as (2-point, 3-point, free throws)."
            answer: "(7, 6, 12)"
            answer_contract: {"arity": 3, "kind": "coordinates"}
            solution_sketch: "Let x, y, z be 2-point goals, 3-point goals, and free throws. The equations are x + y + z = 25, 2x + 3y + z = 44, and z = 2y. Substitute: x = 25 - 3y, then 2(25 - 3y) + 3y + 2y = 44, so 50 - y = 44. Solve y = 6, x = 7, z = 12. The scoring counts are (7, 6, 12)."
        constraints: "3 unknowns, integer answers, quantities positive and small"
      - id: kp3
        name: Mixture and allocation problems
        key_prerequisites: [row-reduction-echelon-forms, systems-word-problems]
        exemplars:
          - problem: "A chemist needs 12 L of a 35% acid solution by mixing 10%, 30%, and 50% acid solutions. The amount of 50% solution used is twice the amount of 10% solution. Give the liters of the 10%, 30%, and 50% solutions in that order as (x, y, z)."
            answer: "(3, 3, 6)"
            answer_contract: {"arity": 3, "kind": "coordinates"}
            solution_sketch: "Step 1: Let x, y, z be the liters of 10%, 30%, and 50% solution. The volume equation gives x + y + z = 12, and the concentration equation gives 0.1x + 0.3y + 0.5z = 4.2 because 35% of 12 L is 4.2 L. Step 2: The relation z = 2x turns the system into x + y + 2x = 12 and 0.1x + 0.3y + 1.0x = 4.2; substituting y = 12 - 3x gives 3.6 + 0.2x = 4.2, so x = 3, y = 3, and z = 6. The solution is (3, 3, 6)."
          - problem: "An investor splits 5000 euros among three accounts that pay 2%, 3%, and 4% yearly interest. The amount in the 4% account equals the sum of the amounts in the other two accounts. After one year the total interest is 155 euros. Give the amounts in the 2%, 3%, and 4% accounts in euros as (x, y, z)."
            answer: "(2000, 500, 2500)"
            answer_contract: {"arity": 3, "kind": "coordinates"}
            solution_sketch: "Step 1: Let x, y, z be the euros in the 2%, 3%, and 4% accounts. The total equation is x + y + z = 5000, the interest equation is 0.02x + 0.03y + 0.04z = 155, and the relation is z = x + y. Step 2: The relation and the total equation give 2(x + y) = 5000, so z = 2500 and x + y = 2500. Substituting into the interest equation gives 0.02x + 0.03y + 100 = 155, or 2x + 3y = 5500 after multiplying by 100. With x = 2500 - y, this is 5000 + y = 5500, so y = 500 and x = 2000. The solution is (2000, 500, 2500)."
          - problem: "A juice maker blends three concentrates that are 20%, 30%, and 60% real fruit to make 20 L of a 40% real-fruit drink. The amount of 60% concentrate is twice the amount of 20% concentrate. Give the liters of the 20%, 30%, and 60% concentrates in that order as (x, y, z)."
            answer: "(4, 8, 8)"
            answer_contract: {"arity": 3, "kind": "coordinates"}
            solution_sketch: "Step 1: Let x, y, z be the liters of 20%, 30%, and 60% concentrate. The volume equation is x + y + z = 20, the concentration equation is 0.2x + 0.3y + 0.6z = 8, and the relation is z = 2x. Step 2: Using z = 2x, the volume equation gives y = 20 - 3x. The concentration equation becomes 0.2x + 0.3(20 - 3x) + 1.2x = 8, so 6 + 0.5x = 8 and x = 4; then y = 8 and z = 8. The solution is (4, 8, 8)."
          - problem: "A cinema sells adult tickets for 8 euros, student tickets for 5 euros, and child tickets for 3 euros. One evening 30 tickets were sold and the receipts were 175 euros. Twice as many child tickets as student tickets were sold. Give the numbers of adult, student, and child tickets as (x, y, z)."
            answer: "(15, 5, 10)"
            answer_contract: {"arity": 3, "kind": "coordinates"}
            solution_sketch: "Step 1: Let x, y, z be the numbers of adult, student, and child tickets. The ticket-count equation is x + y + z = 30, the receipts equation is 8x + 5y + 3z = 175, and the relation is z = 2y. Step 2: Substituting z = 2y gives x = 30 - 3y. The receipts equation becomes 8(30 - 3y) + 5y + 6y = 175, so 240 - 13y = 175 and y = 5; then z = 10 and x = 15. The solution is (15, 5, 10)."
          - problem: "A cash box contains 40 coins made of 10-cent, 20-cent, and 50-cent pieces. Their total value is 11.00 euros, and there are twice as many 20-cent coins as 10-cent coins. Give the numbers of 10-cent, 20-cent, and 50-cent coins as (x, y, z)."
            answer: "(9, 18, 13)"
            answer_contract: {"arity": 3, "kind": "coordinates"}
            solution_sketch: "Step 1: Let x, y, z be the numbers of 10-cent, 20-cent, and 50-cent coins. The coin-count equation is x + y + z = 40, the value equation is 0.1x + 0.2y + 0.5z = 11, and the relation is y = 2x. Step 2: Substituting y = 2x gives z = 40 - 3x. The value equation becomes 0.1x + 0.4x + 0.5(40 - 3x) = 11, so 20 - x = 11 and x = 9; then y = 18 and z = 13. The solution is (9, 18, 13)."
          - problem: "A lab mixes 5%, 15%, and 40% saline solutions to make 24 L of a 25% saline solution. The amount of 40% solution used equals the sum of the amounts of the other two solutions. Give the liters of the 5%, 15%, and 40% solutions in that order as (x, y, z)."
            answer: "(6, 6, 12)"
            answer_contract: {"arity": 3, "kind": "coordinates"}
            solution_sketch: "Step 1: Let x, y, z be the liters of 5%, 15%, and 40% saline solution. The volume equation is x + y + z = 24, the salt equation is 0.05x + 0.15y + 0.40z = 6, and the relation is z = x + y. Step 2: The relation gives z = 12 and x + y = 12. Then 0.05x + 0.15y + 4.8 = 6, so 0.05x + 0.15y = 1.2; with y = 12 - x this becomes 1.8 - 0.10x = 1.2, so x = 6 and y = 6. The solution is (6, 6, 12)."
        constraints: "3 unknowns; percentages in easy decimals; integer answers"
    diagnostic_exemplar:
      problem: 'Tickets cost €12 (adult), €7 (student), and €5 (child). $24$ tickets were sold for €244, and three times as many student tickets as child tickets were sold. How many of each were sold?'
      answer: '16 adult, 6 student, 2 child'
      answer_contract: {kind: none}
      solution_sketch: 'With $s = 3c$ and $a + s + c = 24$ we get $a = 24 - 4c$; then $12(24 - 4c) + 21c + 5c = 244$ gives $c = 2$, so $s = 6$ and $a = 16$.'
