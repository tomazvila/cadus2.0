unit: linear-systems
course: linear-algebra
module: "Linear Systems"
topics:
  - id: augmented-matrix-representation
    name: Augmented Matrices
    core: true
    difficulty: 0.5
    drill: false
    answer_kind: numeric
    expected_time_secs: 90
    prerequisites:
      - id: systems-elimination
        weight: 0.5
        key: true
      - id: translating-sentences-to-equations
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: From system to augmented matrix
        key_prerequisites: [systems-elimination]
        step_check:
          step: 'has no $z$ term, so its $z$-coefficient is $0$'
          question: 'Why is the $z$-coefficient of $x - y = 1$ written as $0$ in its row?'
          options:
            - 'A missing variable means the equation is false, so its row is filled with zeros'
            - 'Each row needs a $z$ entry, and $0z$ adds nothing to the equation'
            - 'The constant $1$ is moved into the $z$ column to keep every row the same length'
          answer: 'Each row needs a $z$ entry, and $0z$ adds nothing to the equation'
          why: 'Every row must have one entry per variable, and writing $x - y + 0z = 1$ keeps the equation unchanged.'
        exemplars:
          - problem: 'Write the augmented matrix of the system $x + 2y = 5$, $3x + 4y = 11$.'
            answer: '[[1,2,5],[3,4,11]]'
            answer_contract: {"kind":"matrix","rows":2,"cols":3}
            solution_sketch: 'Each equation gives one row: the coefficients of $x$ and $y$, then the constant. The first equation gives $1, 2, 5$ and the second gives $3, 4, 11$, so the augmented matrix has the rows $(1, 2, 5)$ and $(3, 4, 11)$.'
          - problem: 'Write the augmented matrix of the system $2x - y = 3$, $y = 4$.'
            answer: '[[2,-1,3],[0,1,4]]'
            answer_contract: {"kind":"matrix","rows":2,"cols":3}
            solution_sketch: 'The second equation has no $x$ term, so its $x$-coefficient is $0$. The rows are $(2, -1, 3)$ and $(0, 1, 4)$.'
          - problem: 'Write the augmented matrix of the system $x + y + z = 6$, $x - y + z = 2$, $2x + y - z = 1$.'
            answer: '[[1,1,1,6],[1,-1,1,2],[2,1,-1,1]]'
            answer_contract: {"kind":"matrix","rows":3,"cols":4}
            solution_sketch: 'Take the coefficients of $x$, $y$, $z$ in each equation, and then the constant. The rows are $(1, 1, 1, 6)$, $(1, -1, 1, 2)$ and $(2, 1, -1, 1)$.'
          - problem: 'Write the augmented matrix of the system $3y + x = 4$, $2x - y = 5$.'
            answer: '[[1,3,4],[2,-1,5]]'
            answer_contract: {"kind":"matrix","rows":2,"cols":3}
            solution_sketch: 'The columns follow the order $x$, $y$, even when an equation lists $y$ first. The first equation $3y + x = 4$ gives the row $(1, 3, 4)$, and the second gives $(2, -1, 5)$.'
          - problem: 'Write the augmented matrix of the system $3x - 2y = 8$, $5x = -3$.'
            answer: '[[3,-2,8],[5,0,-3]]'
            answer_contract: {"kind":"matrix","rows":2,"cols":3}
            solution_sketch: 'The second equation has no $y$ term, so its $y$-coefficient is $0$. The rows are $(3, -2, 8)$ and $(5, 0, -3)$.'
          - problem: 'Write the augmented matrix of the system $2x + z = 7$, $x - y + 2z = 0$, $3y - z = 4$.'
            answer: '[[2,0,1,7],[1,-1,2,0],[0,3,-1,4]]'
            answer_contract: {"kind":"matrix","rows":3,"cols":4}
            solution_sketch: 'Each equation misses one variable, and a missing variable has coefficient $0$. The rows are $(2, 0, 1, 7)$, $(1, -1, 2, 0)$ and $(0, 3, -1, 4)$.'
          - problem: 'Write the augmented matrix of the system in $u$ and $v$: $-u + 4v = 2$, $3u + v = 7$.'
            answer: '[[-1,4,2],[3,1,7]]'
            answer_contract: {"kind":"matrix","rows":2,"cols":3}
            solution_sketch: 'List the coefficients of $u$ and then $v$, and put the constants last. The rows are $(-1, 4, 2)$ and $(3, 1, 7)$.'
          - problem: 'Write the augmented matrix of the system $z + 2x = 4$, $y - z = 1$, $x + y + z = 6$.'
            answer: '[[2,0,1,4],[0,1,-1,1],[1,1,1,6]]'
            answer_contract: {"kind":"matrix","rows":3,"cols":4}
            solution_sketch: 'Use the order $x$, $y$, $z$ in every row. The first equation gives $(2, 0, 1, 4)$, the second gives $(0, 1, -1, 1)$ and the third gives $(1, 1, 1, 6)$.'
        constraints: "2 or 3 equations; integer coefficients in -5..5; include missing-term systems, terms written out of order, and variables other than x, y, z"
      - id: kp2
        name: From augmented matrix to system
        key_prerequisites: [systems-elimination]
        step_check:
          step: 'giving $0x + 4y - 2z = 8$'
          question: 'Why does the row with entries $0, 4, -2$ and constant $8$ give an equation with no $x$ term?'
          options:
            - 'A zero in the first column means the equation has already been solved for $x$'
            - 'The first entry only labels the row, so it is not a part of the equation itself'
            - 'The first entry is the $x$ coefficient, and $0 \cdot x = 0$, so $x$ drops out'
          answer: 'The first entry is the $x$ coefficient, and $0 \cdot x = 0$, so $x$ drops out'
          why: 'Each column belongs to one variable, so a $0$ in the $x$ column means the equation does not contain $x$.'
        exemplars:
          - problem: 'The augmented matrix $\begin{pmatrix}2&-1&5\\1&3&-4\end{pmatrix}$ stands for a system in $x$ and $y$. Write its second equation.'
            answer: 'x + 3y = -4'
            answer_contract: {"kind":"polynomial_relation"}
            solution_sketch: 'The second row is $(1, 3, -4)$. Its entries are the coefficients of $x$ and $y$ and then the constant, so the equation is $x + 3y = -4$.'
          - problem: 'State the coefficient matrix of the system whose augmented matrix is $\begin{pmatrix}2&0&1&7\\0&1&-1&3\end{pmatrix}$.'
            answer: '[[2,0,1],[0,1,-1]]'
            answer_contract: {"kind":"matrix","rows":2,"cols":3}
            solution_sketch: 'The coefficient matrix is the augmented matrix without its last column of constants. Dropping the constants $7$ and $3$ leaves the rows $(2, 0, 1)$ and $(0, 1, -1)$.'
          - problem: 'The augmented matrix $\begin{pmatrix}2&1&-1&3\\0&-4&2&8\end{pmatrix}$ represents a system in $x$, $y$, $z$. Find $x$ when $z = 2$.'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Row 1 gives $2x + y - z = 3$ and row 2 gives $-4y + 2z = 8$. With $z = 2$ the second equation is $-4y + 4 = 8$, so $y = -1$. Then $2x - 1 - 2 = 3$ gives $x = 3$.'
          - problem: 'The augmented matrix $\begin{pmatrix}1&2&-1&4\\0&1&3&-2\\2&0&1&5\end{pmatrix}$ represents a system in $x$, $y$, $z$. What is the coefficient of $y$ in the third equation?'
            answer: '0'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The third row is $(2, 0, 1, 5)$, so the third equation is $2x + 0y + z = 5$. The second column holds the $y$ coefficients, and its entry in row 3 is $0$.'
          - problem: 'Is $(1, 2)$ a solution of the system with augmented matrix $\begin{pmatrix}1&3&7\\2&-1&0\end{pmatrix}$, where the variables are $x$ and $y$?'
            answer: 'yes'
            answer_contract: {"kind":"label","options":[["yes","it is","it is a solution"],["no","it is not","it is not a solution"]]}
            solution_sketch: 'The rows give the equations $x + 3y = 7$ and $2x - y = 0$. With $x = 1$ and $y = 2$ the first is $1 + 6 = 7$ and the second is $2 - 2 = 0$, so both hold and $(1, 2)$ is a solution.'
          - problem: 'A theatre records its ticket sales in the augmented matrix $\begin{pmatrix}1&1&30\\8&5&195\end{pmatrix}$. The first column belongs to adult tickets, the second to child tickets, the first row counts tickets, and the second row counts euros. What does one child ticket cost?'
            answer: '5'
            answer_contract: {"kind":"unit","quantity":"euro","unit":"euro","allow_omitted":true}
            solution_sketch: 'The second row is $(8, 5, 195)$, so it says $8a + 5c = 195$ in euros. The entry in the child column is $5$, so one child ticket costs $5$ euros.'
          - problem: 'A bakery bakes $x$ loaves and $y$ rolls. The first row of $\begin{pmatrix}3&2&26\\1&4&22\end{pmatrix}$ describes the flour: a loaf takes $3$ units, a roll takes $2$ units, and $26$ units are available. If the bakery bakes $6$ loaves, how many rolls use up the rest of the flour?'
            answer: '4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The first row says $3x + 2y = 26$. With $x = 6$ this gives $18 + 2y = 26$, so $2y = 8$ and $y = 4$ rolls.'
          - problem: 'Sam reads the second row of the augmented matrix $\begin{pmatrix}1&2&-1&4\\0&4&-2&8\end{pmatrix}$, a system in $x$, $y$, $z$, as $4x - 2y = 8$. What is the correct second equation?'
            answer: '4y - 2z = 8'
            answer_contract: {"kind":"polynomial_relation"}
            solution_sketch: 'The second row is $(0, 4, -2, 8)$, so the $x$ column holds $0$, the $y$ column holds $4$ and the $z$ column holds $-2$. The equation is $4y - 2z = 8$, and Sam shifted every coefficient one variable to the left.'
        constraints: "sizes up to 3x4; integer entries in -9..9; read single rows, the coefficient matrix, a whole system, and matrices from a context"
      - id: kp3
        name: Setting up augmented matrices from word problems
        key_prerequisites: [systems-elimination]
        step_check:
          step: 'adults bring in $9a$ euros and children $6c$ euros'
          question: 'Why does the money sentence give the equation $9a + 6c = 285$ and not $a + c = 285$?'
          options:
            - 'Each kind brings in its price times its number, so prices multiply $a$ and $c$'
            - 'The total of $285$ is a count of tickets, so it replaces the total of $40$ tickets'
            - 'Every equation of a system must have coefficients larger than $1$ on its variables'
          answer: 'Each kind brings in its price times its number, so prices multiply $a$ and $c$'
          why: 'The money from adult tickets is $9$ euros times $a$, and from child tickets $6$ euros times $c$, so the prices are the coefficients.'
        exemplars:
          - problem: 'Adult tickets cost €8 and child tickets cost €5. In total $30$ tickets were sold for €195. Write the augmented matrix for the numbers $a$ and $c$ of adult and child tickets.'
            answer: '[[1,1,30],[8,5,195]]'
            answer_contract: {"kind":"matrix","rows":2,"cols":3}
            solution_sketch: 'The number of tickets gives $a + c = 30$, and the money taken gives $8a + 5c = 195$. The rows are $(1, 1, 30)$ and $(8, 5, 195)$.'
          - problem: 'Two numbers $x$ and $y$ have sum $20$, and $x$ exceeds $y$ by $4$. Write the augmented matrix of the system.'
            answer: '[[1,1,20],[1,-1,4]]'
            answer_contract: {"kind":"matrix","rows":2,"cols":3}
            solution_sketch: 'The sum gives $x + y = 20$ and the difference gives $x - y = 4$. The rows are $(1, 1, 20)$ and $(1, -1, 4)$.'
          - problem: 'A purse holds $12$ coins, some worth $5$ cents and some worth $10$ cents, and their total value is $95$ cents. Write the augmented matrix for the numbers $f$ and $t$ of $5$-cent and $10$-cent coins.'
            answer: '[[1,1,12],[5,10,95]]'
            answer_contract: {"kind":"matrix","rows":2,"cols":3}
            solution_sketch: 'The count gives $f + t = 12$, and the value in cents gives $5f + 10t = 95$. The rows are $(1, 1, 12)$ and $(5, 10, 95)$.'
          - problem: 'A father is $3$ times as old as his son. In $12$ years the father will be twice as old as the son. Write the augmented matrix for the present ages $f$ and $s$.'
            answer: '[[1,-3,0],[1,-2,12]]'
            answer_contract: {"kind":"matrix","rows":2,"cols":3}
            solution_sketch: 'The first sentence gives $f = 3s$, which is $f - 3s = 0$. In $12$ years the ages are $f + 12$ and $s + 12$, so $f + 12 = 2(s + 12)$, which is $f - 2s = 12$. The rows are $(1, -3, 0)$ and $(1, -2, 12)$.'
          - problem: 'A rectangle has perimeter $34$ cm, and its length $l$ is $3$ cm more than its width $w$. Write the augmented matrix for the system in $w$ and $l$.'
            answer: '[[2,2,34],[-1,1,3]]'
            answer_contract: {"kind":"matrix","rows":2,"cols":3}
            solution_sketch: 'The perimeter gives $2w + 2l = 34$, and the length condition gives $l - w = 3$, which is $-w + l = 3$. The rows are $(2, 2, 34)$ and $(-1, 1, 3)$.'
          - problem: 'A grocer mixes walnuts at $12$ dollars per kg with almonds at $7$ dollars per kg to make $9$ kg of a blend worth $10$ dollars per kg. Write the augmented matrix for the weights $x$ and $y$ of walnuts and almonds.'
            answer: '[[1,1,9],[12,7,90]]'
            answer_contract: {"kind":"matrix","rows":2,"cols":3}
            solution_sketch: 'The weights give $x + y = 9$. The blend of $9$ kg at $10$ dollars per kg is worth $90$ dollars, so $12x + 7y = 90$, and the rows are $(1, 1, 9)$ and $(12, 7, 90)$.'
          - problem: 'A cyclist rides for $5$ hours, partly at $20$ km/h and partly at $12$ km/h, and covers $84$ km. Write the augmented matrix for the times $h$ and $k$, in hours, spent at the two speeds.'
            answer: '[[1,1,5],[20,12,84]]'
            answer_contract: {"kind":"matrix","rows":2,"cols":3}
            solution_sketch: 'The times add up to $5$ hours, so $h + k = 5$. The distances add up to $84$ km, so $20h + 12k = 84$, and the rows are $(1, 1, 5)$ and $(20, 12, 84)$.'
        constraints: "two-unknown word problems with small integer data; the matrix is the answer, not the solution; equations are taken in the order of the sentences"
    diagnostic_exemplar:
      problem: 'Adult tickets cost €9 and child tickets €4. In total $25$ tickets were sold for €160. Write the augmented matrix for the counts $a, c$.'
      answer: "[1,1,25;9,4,160]"
      answer_contract: {"cols":3,"kind":"matrix","rows":2}
      solution_sketch: 'The conditions are $a + c = 25$ and $9a + 4c = 160$; stack the coefficients and constants.'
    anki_seeds:
      - front: 'The augmented matrix of a linear system contains...'
        back: 'the coefficient matrix with the constants appended as a final column.'
        type: basic

  - id: elementary-row-operations
    name: Elementary Row Operations
    core: true
    difficulty: 0.5
    drill: false
    answer_kind: numeric
    expected_time_secs: 90
    prerequisites:
      - id: augmented-matrix-representation
        weight: 0.7
        key: true
      - id: systems-elimination
        weight: 0.5
        key: true
    knowledge_points:
      - id: kp1
        name: Row replacement
        key_prerequisites: [augmented-matrix-representation, systems-elimination]
        step_check:
          step: 'Subtract 3 times each entry of row 1 from the matching entry of row 2'
          question: 'Why must every entry of row 2 be changed, and not only the first one?'
          options:
            - 'The other entries must change too, so that each row keeps the same sum as before'
            - 'Row 1 changes as well, so every column of the matrix is affected by the operation'
            - 'The whole row is replaced, so each entry gets the same multiple of row 1 added'
          answer: 'The whole row is replaced, so each entry gets the same multiple of row 1 added'
          why: 'The operation adds a multiple of the whole of row 1 to row 2, so each entry of row 2 changes, and the system stays equivalent.'
        exemplars:
          - problem: 'Apply $R_2 \to R_2 - 2R_1$ to the augmented matrix $\begin{pmatrix}1&2&5\\2&3&8\end{pmatrix}$.'
            answer: '[[1,2,5],[0,-1,-2]]'
            answer_contract: {"kind":"matrix","rows":2,"cols":3}
            solution_sketch: 'Row 2 changes entry by entry: $2 - 2(1) = 0$, $3 - 2(2) = -1$ and $8 - 2(5) = -2$. Row 1 stays $(1, 2, 5)$, so the new matrix has the rows $(1, 2, 5)$ and $(0, -1, -2)$.'
          - problem: 'Apply $R_2 \to R_2 + 3R_1$ to $\begin{pmatrix}1&-1&2\\-3&2&1\end{pmatrix}$.'
            answer: '[[1,-1,2],[0,-1,7]]'
            answer_contract: {"kind":"matrix","rows":2,"cols":3}
            solution_sketch: 'Row 2 changes entry by entry: $-3 + 3(1) = 0$, $2 + 3(-1) = -1$ and $1 + 3(2) = 7$. The new matrix has the rows $(1, -1, 2)$ and $(0, -1, 7)$.'
          - problem: 'Apply $R_3 \to R_3 - 2R_1$ to the augmented matrix $\begin{pmatrix}1&1&2&3\\0&1&4&2\\2&3&1&5\end{pmatrix}$.'
            answer: '[[1,1,2,3],[0,1,4,2],[0,1,-3,-1]]'
            answer_contract: {"kind":"matrix","rows":3,"cols":4}
            solution_sketch: 'Only row 3 changes: $2 - 2(1) = 0$, $3 - 2(1) = 1$, $1 - 2(2) = -3$ and $5 - 2(3) = -1$. The new matrix has the rows $(1, 1, 2, 3)$, $(0, 1, 4, 2)$ and $(0, 1, -3, -1)$.'
          - problem: 'Adult tickets cost €8 and child tickets cost €5, and $30$ tickets were sold for €195. The sale gives the augmented matrix $\begin{pmatrix}1&1&30\\8&5&195\end{pmatrix}$ for the numbers $a$ and $c$ of adult and child tickets. Apply $R_2 \to R_2 - 8R_1$ to this matrix.'
            answer: '[[1,1,30],[0,-3,-45]]'
            answer_contract: {"kind":"matrix","rows":2,"cols":3}
            solution_sketch: 'Row 2 changes entry by entry: $8 - 8(1) = 0$, $5 - 8(1) = -3$ and $195 - 8(30) = -45$. The new matrix has the rows $(1, 1, 30)$ and $(0, -3, -45)$.'
          - problem: 'To solve $x + 2y = 4$, $3x + 5y = 9$, Maya subtracts $3$ times the first equation from the second. Which equation does she get in place of the second?'
            answer: '-y = -3'
            answer_contract: {"kind":"polynomial_relation"}
            solution_sketch: 'Subtracting $3(x + 2y) = 3(4)$ from $3x + 5y = 9$ gives $5y - 6y = 9 - 12$. The new second equation is $-y = -3$, which is the row $(0, -1, -3)$.'
          - problem: 'For which number $k$ does $R_2 \to R_2 + kR_1$ turn the first entry of row 2 of $\begin{pmatrix}4&1&3\\2&5&1\end{pmatrix}$ into $0$?'
            answer: '-1/2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The new first entry of row 2 is $2 + k(4)$. Setting $2 + 4k = 0$ gives $4k = -2$, so $k = -\frac{1}{2}$, which is $-1/2$.'
          - problem: 'Apply $R_2 \to R_2 - \frac{1}{2}R_1$ to the augmented matrix $\begin{pmatrix}2&4&6\\1&3&5\end{pmatrix}$.'
            answer: '[[2,4,6],[0,1,2]]'
            answer_contract: {"kind":"matrix","rows":2,"cols":3}
            solution_sketch: 'Half of row 1 is $(1, 2, 3)$. Subtracting it from row 2 gives $(1 - 1, 3 - 2, 5 - 3) = (0, 1, 2)$, so the new matrix has the rows $(2, 4, 6)$ and $(0, 1, 2)$.'
          - problem: 'Sam applies $R_2 \to R_2 - 2R_1$ to $\begin{pmatrix}1&3&4\\2&5&9\end{pmatrix}$ and writes the new second row as $(0, -1, 9)$. What is the correct second row?'
            answer: '(0, -1, 1)'
            answer_contract: {"kind":"coordinates","arity":3}
            solution_sketch: 'Every entry of row 2 changes, including the last one: $9 - 2(4) = 1$. The correct second row is $(0, -1, 1)$, because $2 - 2(1) = 0$ and $5 - 2(3) = -1$ as well.'
          - problem: 'Apply $R_3 \to R_3 + 2R_1$ to the augmented matrix $\begin{pmatrix}1&2&0&1\\0&1&3&2\\-2&0&1&4\end{pmatrix}$.'
            answer: '[[1,2,0,1],[0,1,3,2],[0,4,1,6]]'
            answer_contract: {"kind":"matrix","rows":3,"cols":4}
            solution_sketch: 'Only row 3 changes: $-2 + 2(1) = 0$, $0 + 2(2) = 4$, $1 + 2(0) = 1$ and $4 + 2(1) = 6$. The new matrix has the rows $(1, 2, 0, 1)$, $(0, 1, 3, 2)$ and $(0, 4, 1, 6)$.'
        constraints: "2x3 or 3x4 augmented matrices with integer entries; one replacement operation, with integer or fractional multiplier; include contexts from systems and the choice of the multiplier"
      - id: kp2
        name: Swaps and scaling
        key_prerequisites: [augmented-matrix-representation]
        step_check:
          step: 'multiply row 2 by its reciprocal $\frac{1}{3}$'
          question: 'Why is row 2 scaled by $\frac{1}{3}$ and not by $3$?'
          options:
            - 'The leading entry $3$ times $\frac{1}{3}$ is $1$, but $3 \cdot 3$ is $9$'
            - 'Dividing a row by a number always turns the other entries of that row into zeros'
            - 'Multiplying by $3$ is not allowed, since a row may only be scaled by a fraction'
          answer: 'The leading entry $3$ times $\frac{1}{3}$ is $1$, but $3 \cdot 3$ is $9$'
          why: 'The aim is a leading entry of $1$, and only the reciprocal of the leading entry turns it into $1$.'
        exemplars:
          - problem: 'Apply $R_2 \to \frac{1}{2}R_2$ to the augmented matrix $\begin{pmatrix}1&0&3\\0&2&8\end{pmatrix}$.'
            answer: '[[1,0,3],[0,1,4]]'
            answer_contract: {"kind":"matrix","rows":2,"cols":3}
            solution_sketch: 'Scaling multiplies every entry of row 2 by $\frac{1}{2}$, so $(0, 2, 8)$ becomes $(0, 1, 4)$. Row 1 stays $(1, 0, 3)$.'
          - problem: 'Apply $R_1 \leftrightarrow R_2$ and then $R_1 \to \frac{1}{3}R_1$ to $\begin{pmatrix}0&2\\3&6\end{pmatrix}$.'
            answer: '[[1,2],[0,2]]'
            answer_contract: {"kind":"matrix","rows":2,"cols":2}
            solution_sketch: 'The swap gives the rows $(3, 6)$ and $(0, 2)$. Scaling row 1 by $\frac{1}{3}$ turns $(3, 6)$ into $(1, 2)$, so the final matrix has the rows $(1, 2)$ and $(0, 2)$.'
          - problem: 'Apply $R_1 \leftrightarrow R_3$ to the augmented matrix $\begin{pmatrix}0&1&3&2\\1&2&0&5\\4&0&2&6\end{pmatrix}$.'
            answer: '[[4,0,2,6],[1,2,0,5],[0,1,3,2]]'
            answer_contract: {"kind":"matrix","rows":3,"cols":4}
            solution_sketch: 'A swap exchanges two whole rows and leaves the others alone. Rows 1 and 3 trade places, so the matrix has the rows $(4, 0, 2, 6)$, $(1, 2, 0, 5)$ and $(0, 1, 3, 2)$.'
          - problem: 'Apply $R_2 \to -\frac{1}{2}R_2$ to the augmented matrix $\begin{pmatrix}1&2&0&3\\0&-2&4&6\\0&1&1&1\end{pmatrix}$.'
            answer: '[[1,2,0,3],[0,1,-2,-3],[0,1,1,1]]'
            answer_contract: {"kind":"matrix","rows":3,"cols":4}
            solution_sketch: 'Multiply every entry of row 2 by $-\frac{1}{2}$: $(0, -2, 4, 6)$ becomes $(0, 1, -2, -3)$. Rows 1 and 3 stay the same.'
          - problem: 'A student writes the system $2x + 4y = 10$, $x - y = 2$ as an augmented matrix and then divides the first equation by $2$. What is the new augmented matrix?'
            answer: '[[1,2,5],[1,-1,2]]'
            answer_contract: {"kind":"matrix","rows":2,"cols":3}
            solution_sketch: 'The matrix of the system has the rows $(2, 4, 10)$ and $(1, -1, 2)$. Dividing the first equation by $2$ is the operation $R_1 \to \frac{1}{2}R_1$, which gives the row $(1, 2, 5)$ and leaves $(1, -1, 2)$.'
          - problem: 'The second row $(0, 5, -15)$ of an augmented matrix stands for the equation $5y = -15$. After the operation $R_2 \to \frac{1}{5}R_2$ the row stands for $y = c$. Find $c$.'
            answer: '-3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Scaling by $\frac{1}{5}$ turns $(0, 5, -15)$ into $(0, 1, -3)$. The new equation is $y = -3$, so $c = -3$.'
          - problem: 'The augmented matrix $\begin{pmatrix}0&3&9\\3&1&6\end{pmatrix}$ has a $0$ where the first leading entry should be. Swap the rows, and then scale the new first row by $\frac{1}{3}$.'
            answer: '[[1,1/3,2],[0,3,9]]'
            answer_contract: {"kind":"matrix","rows":2,"cols":3}
            solution_sketch: 'The swap gives the rows $(3, 1, 6)$ and $(0, 3, 9)$. Scaling the first row by $\frac{1}{3}$ gives $(1, \frac{1}{3}, 2)$, so the final matrix is $(1, \frac{1}{3}, 2)$ over $(0, 3, 9)$.'
          - problem: 'Apply $R_1 \to \frac{1}{2}R_1$ and then $R_1 \leftrightarrow R_2$ to $\begin{pmatrix}2&4\\0&3\end{pmatrix}$.'
            answer: '[[0,3],[1,2]]'
            answer_contract: {"kind":"matrix","rows":2,"cols":2}
            solution_sketch: 'Scaling row 1 turns $(2, 4)$ into $(1, 2)$. Swapping rows 1 and 2 then gives the rows $(0, 3)$ and $(1, 2)$.'
          - problem: 'Sam applies $R_2 \to \frac{1}{4}R_2$ to $\begin{pmatrix}1&3&2\\0&4&8\end{pmatrix}$ and gets $(0, 1, 8)$ for the second row. What is the correct second row?'
            answer: '(0, 1, 2)'
            answer_contract: {"kind":"coordinates","arity":3}
            solution_sketch: 'Scaling multiplies every entry of row 2 by $\frac{1}{4}$, and Sam left the last entry unchanged. The correct row is $(0, 1, 2)$, because $\frac{1}{4}(8) = 2$.'
        constraints: "scaling by the reciprocal of a leading entry; entries of the result may be fractions; include swaps, combined operations and contexts"
      - id: kp3
        name: Identifying operations and why they are safe
        key_prerequisites: [augmented-matrix-representation, systems-elimination]
        step_check:
          step: 'its inverse is $R_2 \to R_2 + 2R_1$'
          question: 'Why does having an inverse operation show that the solution set stays the same?'
          options:
            - 'An inverse operation makes the new matrix equal to the old matrix in every entry'
            - 'The inverse undoes the step, so a solution of the new system solves the old one'
            - 'Having an inverse means the operation changes only one row of the matrix at a time'
          answer: 'The inverse undoes the step, so a solution of the new system solves the old one'
          why: 'A solution of the old system stays a solution after the step, and the inverse step shows the reverse, so no solution is gained or lost.'
        try_first:
          problem: 'The pair $(x, y) = (3, 2)$ solves $x + y = 5$ and $x - y = 1$. The second equation is replaced by the sum of the two equations. Is $(3, 2)$ still a solution of the new system?'
          answer_contract: {"kind":"label","options":[["yes","it is","it is still a solution"],["no","it is not","it is no longer a solution"]]}
          answer: 'yes'
          reveal: 'The new second equation is $2x = 6$, and $(3, 2)$ satisfies it. Adding equations never loses a solution, and the same idea makes every elementary row operation safe.'
        exemplars:
          - problem: 'A row replacement $R_2 \to R_2 + kR_1$ turns $\begin{pmatrix}1&2&5\\3&4&11\end{pmatrix}$ into $\begin{pmatrix}1&2&5\\0&-2&-4\end{pmatrix}$. Find $k$.'
            answer: '-3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The new row 2 is $(3 + k, 4 + 2k, 11 + 5k)$. The first entry must be $0$, so $3 + k = 0$ and $k = -3$, and the other entries $4 - 6 = -2$ and $11 - 15 = -4$ agree with the target.'
          - problem: 'One row interchange $R_1 \leftrightarrow R_k$ changes $\begin{pmatrix}1&2\\3&4\\5&6\end{pmatrix}$ into $\begin{pmatrix}5&6\\3&4\\1&2\end{pmatrix}$. Find $k$.'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Row 1 of the new matrix is $(5, 6)$, which was row $3$ of the old matrix. Row 2 is unchanged and the new row 3 is $(1, 2)$, so rows 1 and $3$ were swapped and $k = 3$.'
          - problem: 'A scaling $R_2 \to kR_2$ turns $\begin{pmatrix}1&2\\4&8\end{pmatrix}$ into $\begin{pmatrix}1&2\\1&2\end{pmatrix}$. Find $k$.'
            answer: '1/4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The new row 2 is $(4k, 8k)$, and it must equal $(1, 2)$. So $4k = 1$ and $k = \frac{1}{4}$, which also fits $8k = 2$.'
          - problem: 'A row replacement $R_1 \to R_1 + kR_2$ turns $\begin{pmatrix}1&1\\2&3\end{pmatrix}$ into $\begin{pmatrix}5&7\\2&3\end{pmatrix}$. Find $k$.'
            answer: '2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The new row 1 is $(1 + 2k, 1 + 3k)$, and it must equal $(5, 7)$. So $1 + 2k = 5$ gives $k = 2$, and $1 + 3(2) = 7$ agrees.'
          - problem: 'Sam replaces the second row of the augmented matrix $\begin{pmatrix}1&2&3\\2&5&8\end{pmatrix}$ by $0 \cdot R_2$, which gives the new second row $(0, 0, 0)$. Does the new system have the same solutions as the old one?'
            answer: 'no'
            answer_contract: {"kind":"label","options":[["yes","it does","same solutions","the same"],["no","it does not","different solutions","not the same"]]}
            solution_sketch: 'The old system $x + 2y = 3$, $2x + 5y = 8$ has the single solution $(-1, 2)$. The new second row says $0 = 0$, so the new system is only $x + 2y = 3$, which has infinitely many solutions. Multiplying a row by $0$ cannot be undone, so it is not an elementary operation.'
          - problem: 'The ticket sales of a theatre give the augmented matrix $\begin{pmatrix}1&1&30\\8&5&195\end{pmatrix}$ for the numbers of adult and child tickets. For which number $k$ does $R_2 \to R_2 + kR_1$ turn the first entry of row 2 into $0$?'
            answer: '-8'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The new first entry of row 2 is $8 + k(1)$. Setting $8 + k = 0$ gives $k = -8$.'
          - problem: 'The system $x + 2y = 3$, $2x + 5y = 8$ is changed by $R_2 \to R_2 - 2R_1$ into a system with the same solutions. Find $x$.'
            answer: '-1'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The new second row is $(0, 1, 2)$, so $y = 2$. Substituting into $x + 2y = 3$ gives $x + 4 = 3$, so $x = -1$, and $2(-1) + 5(2) = 8$ confirms the original second equation.'
          - problem: 'The second row of an augmented matrix is $(0, -3, -6)$, which stands for $-3y = -6$. The operation $R_2 \to kR_2$ turns it into $(0, 1, 2)$, which stands for $y = 2$. Find $k$.'
            answer: '-1/3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The new row is $(0, -3k, -6k)$. The leading entry must become $1$, so $-3k = 1$ and $k = -\frac{1}{3}$, and then $-6k = 2$ as required.'
          - problem: 'A scaling $R_1 \to kR_1$ turns $\begin{pmatrix}-4&8\\1&2\end{pmatrix}$ into $\begin{pmatrix}1&-2\\1&2\end{pmatrix}$. Find $k$.'
            answer: '-1/4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The new row 1 is $(-4k, 8k)$, and it must equal $(1, -2)$. So $-4k = 1$ gives $k = -\frac{1}{4}$, and $8(-\frac{1}{4}) = -2$ agrees.'
        constraints: "identify-the-operation problems use a single replacement, swap, or scaling; include safety questions and contexts from systems"
    diagnostic_exemplar:
      problem: 'Which two row operations, applied in order, turn $\begin{pmatrix}1&3&2\\4&5&1\end{pmatrix}$ into $\begin{pmatrix}1&3&2\\0&1&1\end{pmatrix}$?'
      answer: '$R_2 \to R_2 - 4R_1$, then $R_2 \to -\frac{1}{7}R_2$'
      answer_contract: {kind: none}
      solution_sketch: '$R_2 - 4R_1 = (0, -7, -7)$; scaling that row by $-\frac{1}{7}$ gives $(0, 1, 1)$.'
    anki_seeds:
      - front: 'The three elementary row operations?'
        back: 'Swap two rows; multiply a row by a nonzero scalar; add a multiple of one row to another.'
        type: basic
      - front: 'Why do row operations preserve the solution set?'
        back: 'Each operation is reversible, so the old and new systems have exactly the same solutions.'
        type: basic

  - id: back-substitution-triangular-systems
    name: Back Substitution
    core: true
    difficulty: 0.5
    drill: false
    answer_kind: numeric
    expected_time_secs: 120
    prerequisites:
      - id: multi-step-equations
        weight: 0.5
        key: true
      - id: systems-substitution
        weight: 0.5
        key: true
    knowledge_points:
      - id: kp1
        name: Triangular 2x2 systems
        key_prerequisites: [systems-substitution]
        step_check:
          step: 'so the value of $y$ is known with no work'
          question: 'Why does the solution start with the bottom equation?'
          options:
            - 'It is the last equation written, and the last equation is always the most reliable'
            - 'It has the largest coefficients, so it is the easiest equation to solve first'
            - 'It has only one unknown, so it gives that value without any other value'
          answer: 'It has only one unknown, so it gives that value without any other value'
          why: 'The bottom equation contains one unknown, so it can be solved at once, and then the other equations lose one unknown each.'
        try_first:
          problem: 'Two numbers $x$ and $y$ satisfy $x + 2y = 11$ and $y = 4$. What is $x$?'
          answer_contract: {"kind":"exact"}
          answer: '3'
          reveal: 'Because $y = 4$ is known, the first equation has only one unknown left: $x + 8 = 11$. Solving a system from the equation with one unknown upward is the idea of back substitution.'
        exemplars:
          - problem: 'Solve the system $x + 3y = 7$, $y = 2$.'
            answer: '(1, 2)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'The second equation gives $y = 2$ at once. Substituting into the first gives $x + 6 = 7$, so $x = 1$ and the solution is $(1, 2)$.'
          - problem: 'Solve the system with augmented matrix $\begin{pmatrix}2&-1&4\\0&3&6\end{pmatrix}$.'
            answer: '(3, 2)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'The second row says $3y = 6$, so $y = 2$. The first row says $2x - y = 4$, so $2x - 2 = 4$, which gives $2x = 6$ and $x = 3$.'
          - problem: 'Two pens and a notebook cost €7 together, and four notebooks cost €12. What does one pen cost?'
            answer: '2'
            answer_contract: {"kind":"unit","quantity":"euro","unit":"euro","allow_omitted":true}
            solution_sketch: 'Four notebooks cost €12, so one notebook costs $12 \div 4 = 3$ euros. Two pens cost $7 - 3 = 4$ euros, so one pen costs $4 \div 2 = 2$ euros.'
          - problem: 'Solve the system $2x + 5y = 1$, $y = -1$.'
            answer: '(3, -1)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'The second equation gives $y = -1$. Substituting into the first gives $2x - 5 = 1$, so $2x = 6$ and $x = 3$, and the solution is $(3, -1)$.'
          - problem: 'A taxi charges a starting fee of $x$ euros plus $y$ euros per kilometre. The charge per kilometre is $2$ euros, and a ride of $4$ km costs €13 in all. What is the starting fee?'
            answer: '5'
            answer_contract: {"kind":"unit","quantity":"euro","unit":"euro","allow_omitted":true}
            solution_sketch: 'The ride gives the equation $x + 4y = 13$, and $y = 2$. So $x + 8 = 13$ and the starting fee is $x = 5$ euros.'
          - problem: 'Sam solves $2x + y = 9$, $3y = 6$. He finds $y = 2$ and then writes $x = 9 - 2 = 7$. What is the correct value of $x$?'
            answer: '7/2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Substituting $y = 2$ into $2x + y = 9$ gives $2x + 2 = 9$, so $2x = 7$ and $x = \frac{7}{2}$. Sam forgot that $x$ is multiplied by $2$, so $7$ must be divided by $2$.'
          - problem: 'Solve the system $3x - y = 11$, $4y = -8$.'
            answer: '(3, -2)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'The second equation gives $y = -8 \div 4 = -2$. Substituting into the first gives $3x + 2 = 11$, so $3x = 9$ and $x = 3$, and the solution is $(3, -2)$.'
          - problem: 'Solve the system $5x + 2y = 3$, $4y = 12$.'
            answer: '(-3/5, 3)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'The second equation gives $y = 12 \div 4 = 3$. Substituting into the first gives $5x + 6 = 3$, so $5x = -3$ and $x = -\frac{3}{5}$, and the solution is $(-\frac{3}{5}, 3)$.'
        constraints: "second equation gives y directly or after one division; solutions in -5..5, possibly with a simple fraction; include contexts from prices and fees"
      - id: kp2
        name: Triangular 3x3 systems
        key_prerequisites: [systems-substitution, multi-step-equations]
        step_check:
          step: 'Substitute $z = 2$'
          question: 'Why can the middle equation be solved once $z = 2$ is known?'
          options:
            - 'It has only $y$ and $z$, so only $y$ is left once $z$ is replaced by $2$'
            - 'The value $z = 2$ makes the middle equation equal to zero on its left side'
            - 'It is solved for $y$ by dividing the constant by the value of $z$'
          answer: 'It has only $y$ and $z$, so only $y$ is left once $z$ is replaced by $2$'
          why: 'The middle equation has two unknowns, so one known value leaves a one-unknown equation, as in the first step.'
        exemplars:
          - problem: 'Solve the system $x + y + z = 6$, $y + 2z = 8$, $z = 3$.'
            answer: '(1, 2, 3)'
            answer_contract: {"kind":"coordinates","arity":3}
            solution_sketch: 'The last equation gives $z = 3$. Then $y + 6 = 8$ gives $y = 2$, and $x + 2 + 3 = 6$ gives $x = 1$, so the solution is $(1, 2, 3)$.'
          - problem: 'Solve the system $x - 2y + z = 0$, $y - z = 1$, $2z = 4$.'
            answer: '(4, 3, 2)'
            answer_contract: {"kind":"coordinates","arity":3}
            solution_sketch: 'The last equation gives $z = 2$. Then $y - 2 = 1$ gives $y = 3$, and $x - 6 + 2 = 0$ gives $x = 4$, so the solution is $(4, 3, 2)$.'
          - problem: 'At a snack bar a cookie costs €2. A drink and two cookies cost €7, and a sandwich, a drink and a cookie cost €12. What does the sandwich cost?'
            answer: '7'
            answer_contract: {"kind":"unit","quantity":"euro","unit":"euro","allow_omitted":true}
            solution_sketch: 'The cookie costs €2, so a drink costs $7 - 2(2) = 3$ euros. The sandwich costs $12 - 3 - 2 = 7$ euros.'
          - problem: 'Solve the system $x + 2y - z = 1$, $y + z = 5$, $3z = 6$.'
            answer: '(-3, 3, 2)'
            answer_contract: {"kind":"coordinates","arity":3}
            solution_sketch: 'The last equation gives $z = 6 \div 3 = 2$. Then $y + 2 = 5$ gives $y = 3$, and $x + 6 - 2 = 1$ gives $x = -3$, so the solution is $(-3, 3, 2)$.'
          - problem: 'Alex, Bea and Cy have $90$ stickers together. Bea''s stickers plus twice Cy''s make $75$, and three times Cy''s stickers make $45$. How many stickers does Alex have?'
            answer: '30'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Three times Cy''s stickers make $45$, so Cy has $45 \div 3 = 15$. Then Bea has $75 - 2(15) = 45$ stickers, and Alex has $90 - 45 - 15 = 30$.'
          - problem: 'Sam solves $x + y + z = 9$, $y - z = 1$, $2z = 6$. He writes $z = 12$ and goes on from there. What is the correct value of $x$?'
            answer: '2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The last equation gives $z = 6 \div 2 = 3$, and not $2 \cdot 6$. Then $y - 3 = 1$ gives $y = 4$, and $x + 4 + 3 = 9$ gives $x = 2$.'
          - problem: 'Solve the system $2x + y - z = 6$, $3y + z = 10$, $-z = -4$.'
            answer: '(4, 2, 4)'
            answer_contract: {"kind":"coordinates","arity":3}
            solution_sketch: 'The last equation gives $z = 4$. Then $3y + 4 = 10$ gives $y = 2$, and $2x + 2 - 4 = 6$ gives $x = 4$, so the solution is $(4, 2, 4)$.'
          - problem: 'Solve the system $x + 2z = 9$, $y - z = -1$, $3z = 12$.'
            answer: '(1, 3, 4)'
            answer_contract: {"kind":"coordinates","arity":3}
            solution_sketch: 'The last equation gives $z = 12 \div 3 = 4$. Then $y - 4 = -1$ gives $y = 3$, and $x + 8 = 9$ gives $x = 1$, so the solution is $(1, 3, 4)$.'
        constraints: "strictly triangular; integer solutions in -5..5, or whole-number amounts in a context; include contexts with a division in the last equation"
      - id: kp3
        name: Back substitution from echelon matrices
        key_prerequisites: [systems-substitution, multi-step-equations]
        step_check:
          step: 'it involves only $z$, so it is the starting point'
          question: 'Why is the bottom row of the matrix the place to start?'
          options:
            - 'It has the largest constant, so it gives the largest unknown first'
            - 'Two zeros leave only the $z$ unknown, so the row can be solved by itself'
            - 'It is the last equation, so the other two rows follow from it as consequences'
          answer: 'Two zeros leave only the $z$ unknown, so the row can be solved by itself'
          why: 'The zeros leave only the $z$ column, so the bottom row is a one-unknown equation, and each higher row then has one new unknown.'
        exemplars:
          - problem: 'Solve the system with augmented matrix $\begin{pmatrix}1&1&1&6\\0&2&1&7\\0&0&3&9\end{pmatrix}$.'
            answer: '(1, 2, 3)'
            answer_contract: {"kind":"coordinates","arity":3}
            solution_sketch: 'The last row says $3z = 9$, so $z = 3$. The second row says $2y + z = 7$, so $2y + 3 = 7$ and $y = 2$, and the first row gives $x + 2 + 3 = 6$, so $x = 1$.'
          - problem: 'Use back substitution to solve the system whose augmented matrix is $\begin{pmatrix}4&-1&10\\0&3&6\end{pmatrix}$.'
            answer: '(3, 2)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'The last row says $3y = 6$, so $y = 2$. The first row says $4x - y = 10$, so $4x - 2 = 10$, which gives $4x = 12$ and $x = 3$.'
          - problem: 'Row reduction of a system for the weights $x$, $y$, $z$, in kilograms, of three parcels ends with the augmented matrix $\begin{pmatrix}1&2&3&19\\0&1&2&8\\0&0&5&15\end{pmatrix}$. What is the total weight of the three parcels?'
            answer: '11'
            answer_contract: {"kind":"unit","quantity":"mass","unit":"kg","allow_omitted":true}
            solution_sketch: 'The last row says $5z = 15$, so $z = 3$. The second row gives $y + 6 = 8$, so $y = 2$, and the first row gives $x + 4 + 9 = 19$, so $x = 6$. The total is $6 + 2 + 3 = 11$ kg.'
          - problem: 'Find the solution of the system with augmented matrix $\begin{pmatrix}1&0&2&5\\0&1&-1&0\\0&0&1&2\end{pmatrix}$.'
            answer: '(1, 2, 2)'
            answer_contract: {"kind":"coordinates","arity":3}
            solution_sketch: 'The last row gives $z = 2$. The second row says $y - z = 0$, so $y = 2$, and the first row says $x + 2z = 5$, so $x + 4 = 5$ and $x = 1$.'
          - problem: 'For $x$ adult, $y$ student and $z$ child tickets sold, row reduction of the sales equations gives the augmented matrix $\begin{pmatrix}1&1&1&100\\0&2&1&80\\0&0&5&100\end{pmatrix}$. How many adult tickets were sold?'
            answer: '50'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The last row says $5z = 100$, so $z = 20$. The second row gives $2y + 20 = 80$, so $y = 30$, and the first row gives $x + 30 + 20 = 100$, so $x = 50$ adult tickets.'
          - problem: 'Solve the system with augmented matrix $\begin{pmatrix}1&-2&3&0\\0&-1&2&3\\0&0&-2&-6\end{pmatrix}$ by working from the bottom row up.'
            answer: '(-3, 3, 3)'
            answer_contract: {"kind":"coordinates","arity":3}
            solution_sketch: 'The last row says $-2z = -6$, so $z = 3$. The second row gives $-y + 6 = 3$, so $y = 3$, and the first row gives $x - 6 + 9 = 0$, so $x = -3$.'
          - problem: 'Determine the solution of the system with augmented matrix $\begin{pmatrix}2&1&-1&3\\0&3&2&8\\0&0&4&4\end{pmatrix}$.'
            answer: '(1, 2, 1)'
            answer_contract: {"kind":"coordinates","arity":3}
            solution_sketch: 'The last row says $4z = 4$, so $z = 1$. The second row gives $3y + 2 = 8$, so $y = 2$, and the first row gives $2x + 2 - 1 = 3$, so $2x = 2$ and $x = 1$.'
          - problem: 'Sam reads the last row of the augmented matrix $\begin{pmatrix}1&2&0&5\\0&3&1&7\\0&0&2&2\end{pmatrix}$ as $z = 4$ and goes on from there. What is the correct value of $x$?'
            answer: '1'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The last row says $2z = 2$, so $z = 1$ and not $4$. The second row gives $3y + 1 = 7$, so $y = 2$, and the first row gives $x + 4 = 5$, so $x = 1$.'
        constraints: "echelon matrices with pivots that divide their right-hand sides evenly; 2x3 and 3x4; include contexts that give the matrix and ask for one quantity"
    diagnostic_exemplar:
      problem: 'Solve the system with augmented matrix $\begin{pmatrix}1&2&1&7\\0&1&3&8\\0&0&2&4\end{pmatrix}$.'
      answer: 'x = 1, y = 2, z = 2'
      answer_contract: {"kind":"list","member":{"kind":"exact"},"ordered":false}
      solution_sketch: '$2z = 4$ gives $z = 2$; then $y + 6 = 8$ gives $y = 2$; then $x + 4 + 2 = 7$ gives $x = 1$.'
    anki_seeds:
      - front: 'Back substitution solves a triangular system in which order?'
        back: 'From the last pivot equation upward, substituting each value as you go.'
        type: basic

  - id: echelon-form-recognition
    name: Echelon Forms and Pivots
    core: true
    difficulty: 0.55
    drill: false
    answer_kind: numeric
    expected_time_secs: 120
    prerequisites:
      - id: elementary-row-operations
        weight: 0.7
        key: true
    knowledge_points:
      - id: kp1
        name: Recognizing echelon form
        key_prerequisites: [elementary-row-operations]
        step_check:
          step: 'the second leading entry is strictly to the right of the first'
          question: 'Why must each leading entry lie strictly to the right of the leading entry above it?'
          options:
            - 'The leading entries must be in different columns so that the matrix has the same number of rows as columns'
            - 'Each leading entry removes its unknown from the rows below, so the rows can be solved from the bottom up'
            - 'A leading entry to the left would be smaller, and the entries of a matrix must grow along the rows'
          answer: 'Each leading entry removes its unknown from the rows below, so the rows can be solved from the bottom up'
          why: 'When the leading entries step to the right, each row has fewer unknowns than the row above, which makes back substitution possible.'
        exemplars:
          - problem: 'Is $\begin{pmatrix}1&2&3\\0&1&4\end{pmatrix}$ in echelon form?'
            answer: 'yes'
            answer_contract: {"kind":"label","options":[["yes","it is","it is in echelon form","yes it is"],["no","it is not","it is not in echelon form","not in echelon form","no it is not"]]}
            solution_sketch: 'The leading entries are $1$ in column 1 of row 1 and $1$ in column 2 of row 2. Each leading entry lies strictly to the right of the one above, and there is no zero row, so the matrix is in echelon form.'
          - problem: 'For which value of $a$ is $\begin{pmatrix}1&2&3\\a&1&4\end{pmatrix}$ in echelon form?'
            answer: '0'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The leading entry of row 1 is in column 1, so the leading entry of row 2 must lie in column 2 or further right. This needs the entry $a$ below the first leading entry to be $0$, and then row 2 is $(0, 1, 4)$ with its leading entry in column 2.'
          - problem: 'Which two rows of $\begin{pmatrix}1&2&3\\0&0&0\\0&1&4\end{pmatrix}$ must be swapped to bring it into echelon form?'
            answer: '2, 3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Row 2 is a zero row, and a zero row must lie below every nonzero row. Swapping rows 2 and 3 gives the rows $(1, 2, 3)$, $(0, 1, 4)$ and $(0, 0, 0)$, whose leading entries are in columns 1 and 2, so the matrix is in echelon form.'
          - problem: 'Is $\begin{pmatrix}1&2&0\\0&1&3\\0&2&5\end{pmatrix}$ in echelon form?'
            answer: 'no'
            answer_contract: {"kind":"label","options":[["yes","it is","it is in echelon form","yes it is"],["no","it is not","it is not in echelon form","not in echelon form","no it is not"]]}
            solution_sketch: 'Row 2 has its leading entry in column 2, and row 3 also has its leading entry in column 2. The leading entry of row 3 must lie strictly to the right of the one above, so the matrix is not in echelon form.'
          - problem: 'Reading from the top, which row is the first one to break the rules of echelon form in $\begin{pmatrix}1&0&2\\3&0&1\\0&0&4\end{pmatrix}$?'
            answer: '2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Row 1 has its leading entry in column 1. Row 2 also has its leading entry in column 1 because of the $3$, and it is not strictly to the right, so the first row to break the rules is row 2.'
          - problem: 'The matrix $\begin{pmatrix}3&1&4&2\\0&0&5&7\\0&0&0&0\end{pmatrix}$ is in echelon form. In which column does the leading entry of row 2 lie?'
            answer: '3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The leading entry of a row is its first nonzero entry. Row 2 is $(0, 0, 5, 7)$, so its first nonzero entry is $5$, which is in column 3.'
          - problem: 'Ravi reduces a system and reaches $\begin{pmatrix}1&2&1&4\\0&0&3&6\\0&2&1&5\end{pmatrix}$, which is not in echelon form. He swaps rows $2$ and $3$. What is the leading entry of the new row 2?'
            answer: '2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'After the swap, row 2 is $(0, 2, 1, 5)$ and row 3 is $(0, 0, 3, 6)$. The leading entries are now in columns 1, 2 and 3, so the matrix is in echelon form, and the leading entry of row 2 is $2$.'
        constraints: "sizes up to 3x4; mix clear yes and no cases, zero rows, and a missing or misplaced entry; include a row swap after elimination"
      - id: kp2
        name: REF versus RREF
        key_prerequisites: [elementary-row-operations]
        step_check:
          step: 'but the entry above it in the first row is $3$, which is nonzero'
          question: 'Why must the entry above a pivot be zero in reduced row echelon form?'
          options:
            - 'So that the matrix has the same number of pivots as it has columns'
            - 'So that every row of the matrix begins with the digit $1$ in its first place'
            - 'So that each pivot unknown appears in one equation only and can be read off'
          answer: 'So that each pivot unknown appears in one equation only and can be read off'
          why: 'With zeros above and below each pivot, every pivot row states the value of its unknown without the other unknowns.'
        exemplars:
          - problem: 'Is $\begin{pmatrix}1&0&2\\0&1&3\end{pmatrix}$ in reduced row echelon form?'
            answer: 'yes'
            answer_contract: {"kind":"label","options":[["yes","it is","it is in reduced row echelon form","yes it is"],["no","it is not","it is not in reduced row echelon form","not in reduced row echelon form","no it is not"]]}
            solution_sketch: 'Both leading entries are $1$, and each is the only nonzero entry in its column: column 1 holds $(1, 0)$ and column 2 holds $(0, 1)$. The matrix is in echelon form with no zero row misplaced, so it is in reduced row echelon form.'
          - problem: 'Sam says that $\begin{pmatrix}1&2&3\\0&1&4\end{pmatrix}$ is in reduced row echelon form because both leading entries are $1$. In which row and column does the matrix break the rules of reduced row echelon form?'
            answer: '(1, 2)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'The leading entry of row 2 is the $1$ in column 2, and it must be the only nonzero entry in that column. Row 1 has a $2$ above it, so the entry in row 1, column 2 breaks the rule.'
          - problem: 'The matrix $\begin{pmatrix}2&0\\0&1\end{pmatrix}$ is in echelon form but not in reduced row echelon form. Which number is the leading entry that stops it from being in reduced row echelon form?'
            answer: '2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'In reduced row echelon form every leading entry equals $1$. The leading entries here are $2$ and $1$, so the $2$ in row 1, column 1 is the one that stops the matrix.'
          - problem: 'The matrix $\begin{pmatrix}1&0&0\\0&3&0\\0&0&1\end{pmatrix}$ is in echelon form but not in reduced row echelon form. In which row and column is the leading entry that stops it?'
            answer: '(2, 2)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'The leading entries are in positions $(1, 1)$, $(2, 2)$ and $(3, 3)$, and all columns are otherwise zero. Every leading entry in reduced form must be $1$, but the entry in row 2, column 2 is $3$, so the position is $(2, 2)$.'
          - problem: 'Is $\begin{pmatrix}1&5&0\\0&1&0\\0&0&0\end{pmatrix}$ in reduced row echelon form?'
            answer: 'no'
            answer_contract: {"kind":"label","options":[["yes","it is","it is in reduced row echelon form","yes it is"],["no","it is not","it is not in reduced row echelon form","not in reduced row echelon form","no it is not"]]}
            solution_sketch: 'The matrix is in echelon form with leading entries $1$ in columns 1 and 2, and the zero row is last. Column 2 holds the leading entry of row 2 and also a $5$ in row 1, so the leading entry is not alone in its column, and the matrix is not in reduced row echelon form.'
          - problem: 'Ana row-reduces a system in $x$ and $y$ and reaches $\begin{pmatrix}1&0&3\\0&1&-2\end{pmatrix}$. What is the solution of the system?'
            answer: '(3, -2)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'The matrix is in reduced row echelon form. Its first row says $x = 3$ and its second row says $y = -2$, so the solution is $(3, -2)$.'
          - problem: 'Two planks have lengths $x$ and $y$ in metres. Row reduction of the system for them ends with $\begin{pmatrix}1&0&3\\0&1&2\end{pmatrix}$. What is the total length of the two planks?'
            answer: '5'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'The reduced matrix says $x = 3$ and $y = 2$. The total length is $3 + 2 = 5$ metres.'
          - problem: 'For which value of $c$ is $\begin{pmatrix}1&c&3\\0&1&2\end{pmatrix}$ in reduced row echelon form?'
            answer: '0'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The leading entry of row 2 is the $1$ in column 2, and it must be the only nonzero entry in its column. So the entry $c$ above it must be $0$, and then the matrix has the rows $(1, 0, 3)$ and $(0, 1, 2)$.'
        constraints: "matrices in echelon form; the failure of reduced form is one named entry; include verdicts and reading a solution from a reduced matrix"
      - id: kp3
        name: Pivot positions and finishing the reduction
        key_prerequisites: [elementary-row-operations]
        step_check:
          step: 'Clear it with $R_1 \to R_1 - 3R_2$'
          question: 'Why is $3$ times row 2 subtracted from row 1?'
          options:
            - 'The entry above the pivot is $3$, so $3 - 3 \cdot 1 = 0$ clears it'
            - 'The last entry of row 1 is $5$, so the multiple is taken from the constants column'
            - 'Any multiple of row 2 clears the entry, and $3$ is only the smallest one that works'
          answer: 'The entry above the pivot is $3$, so $3 - 3 \cdot 1 = 0$ clears it'
          why: 'The pivot of row 2 is $1$, so subtracting $3$ times row 2 changes the entry $3$ above it to $0$ and leaves the pivot column otherwise unchanged.'
        exemplars:
          - problem: 'Bring $\begin{pmatrix}1&2&4\\0&1&3\end{pmatrix}$ to reduced row echelon form.'
            answer: '[[1,0,-2],[0,1,3]]'
            answer_contract: {"kind":"matrix","rows":2,"cols":3}
            solution_sketch: 'The matrix is in echelon form with pivots in columns 1 and 2. The operation $R_1 \to R_1 - 2R_2$ clears the $2$ above the second pivot and gives $(1, 0, 4 - 6) = (1, 0, -2)$, so the result has the rows $(1, 0, -2)$ and $(0, 1, 3)$.'
          - problem: 'Which columns of $\begin{pmatrix}1&2&0&4\\0&0&1&3\end{pmatrix}$ are pivot columns?'
            answer: '1, 3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'A pivot is the leading entry of a row. The leading entry of row 1 is in column 1, and the leading entry of row 2 is in column 3, so the pivot columns are 1 and 3.'
          - problem: 'Bring $\begin{pmatrix}1&2&1&9\\0&1&2&8\\0&0&1&3\end{pmatrix}$ to reduced row echelon form.'
            answer: '[[1,0,0,2],[0,1,0,2],[0,0,1,3]]'
            answer_contract: {"kind":"matrix","rows":3,"cols":4}
            solution_sketch: 'Work from the last pivot upward. $R_2 \to R_2 - 2R_3$ gives $(0, 1, 0, 2)$, and $R_1 \to R_1 - R_3$ gives $(1, 2, 0, 6)$. Then $R_1 \to R_1 - 2R_2$ gives $(1, 0, 0, 2)$, so the result has the rows $(1, 0, 0, 2)$, $(0, 1, 0, 2)$ and $(0, 0, 1, 3)$.'
          - problem: 'Which columns of $\begin{pmatrix}0&2&1&5\\0&0&0&3\\0&0&0&0\end{pmatrix}$ are pivot columns?'
            answer: '2, 4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The leading entry of row 1 is the $2$ in column 2, and the leading entry of row 2 is the $3$ in column 4. Row 3 is a zero row, so the pivot columns are 2 and 4.'
          - problem: 'How many pivot positions does $\begin{pmatrix}1&2&0&1&3\\0&0&1&4&2\\0&0&0&0&1\end{pmatrix}$ have?'
            answer: '3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The leading entries are in column 1 of row 1, column 3 of row 2 and column 5 of row 3. Each of the $3$ rows has one pivot position, so the matrix has $3$ pivot positions.'
          - problem: 'The matrix $\begin{pmatrix}1&4\\0&1\end{pmatrix}$ is one row operation away from reduced row echelon form. For which number $k$ does $R_1 \to R_1 + kR_2$ give it?'
            answer: '-4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The $4$ in row 1, column 2 lies above the pivot $1$ of row 2. The new entry is $4 + k(1)$, and $4 + k = 0$ gives $k = -4$.'
          - problem: 'Forward elimination on the ticket system $a + c = 30$, $8a + 5c = 195$ leaves the matrix $\begin{pmatrix}1&1&30\\0&1&15\end{pmatrix}$. Bring it to reduced row echelon form. How many adult tickets were sold?'
            answer: '15'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The operation $R_1 \to R_1 - R_2$ gives the rows $(1, 0, 15)$ and $(0, 1, 15)$. The first row says $a = 15$, so $15$ adult tickets were sold, and $8(15) + 5(15) = 195$ confirms it.'
          - problem: 'Elimination on the system $x + y = 7$, $x - y = 3$ leaves the matrix $\begin{pmatrix}1&1&7\\0&-2&-4\end{pmatrix}$. Bring it to reduced row echelon form.'
            answer: '[[1,0,5],[0,1,2]]'
            answer_contract: {"kind":"matrix","rows":2,"cols":3}
            solution_sketch: 'Scale row 2 by $-\frac{1}{2}$ to get $(0, 1, 2)$. Then $R_1 \to R_1 - R_2$ gives $(1, 0, 5)$, so the result has the rows $(1, 0, 5)$ and $(0, 1, 2)$.'
          - problem: 'Bring $\begin{pmatrix}2&4&10\\0&3&6\end{pmatrix}$ to reduced row echelon form.'
            answer: '[[1,0,1],[0,1,2]]'
            answer_contract: {"kind":"matrix","rows":2,"cols":3}
            solution_sketch: 'Scale row 2 by $\frac{1}{3}$ to get $(0, 1, 2)$, and scale row 1 by $\frac{1}{2}$ to get $(1, 2, 5)$. Then $R_1 \to R_1 - 2R_2$ gives $(1, 0, 1)$, so the result has the rows $(1, 0, 1)$ and $(0, 1, 2)$.'
        constraints: "one to three operations away from reduced row echelon form; integer entries; include pivot columns, pivot counts and contexts from systems"
    diagnostic_exemplar:
      problem: 'Is $\begin{pmatrix}1&2&5\\0&1&3\end{pmatrix}$ in reduced row echelon form? If not, bring it to RREF.'
      answer: 'No (the entry above the second pivot is not $0$); the RREF is $\begin{pmatrix}1&0&-1\\0&1&3\end{pmatrix}$'
      answer_contract: {kind: none}
      solution_sketch: 'It is in echelon form with leading $1$s, but RREF also needs zeros above each pivot: $R_1 \to R_1 - 2R_2$ gives $(1, 0, -1)$.'
    anki_seeds:
      - front: 'What extra conditions does reduced row echelon form (RREF) add to echelon form?'
        back: 'Every pivot is 1 and is the only nonzero entry in its column.'
        type: basic
      - front: 'A pivot position of a matrix is...'
        back: 'the location of a leading entry in its echelon form.'
        type: basic

  - id: row-reduction-echelon-forms
    name: Row Reduction and Echelon Forms
    core: true
    difficulty: 0.55
    drill: false
    answer_kind: numeric
    expected_time_secs: 180
    prerequisites:
      - id: elementary-row-operations
        weight: 0.8
        key: true
      - id: echelon-form-recognition
        weight: 0.6
        key: true
      - id: back-substitution-triangular-systems
        weight: 0.5
    knowledge_points:
      - id: kp1
        name: Reducing a matrix to RREF
        key_prerequisites: [elementary-row-operations, echelon-form-recognition]
        step_check:
          step: 'Clear below the first pivot: replace $R_2$ with $R_2 - 3R_1$'
          question: 'Why does the step use $R_2 - 3R_1$?'
          options:
            - 'The number $3$ makes the new second row equal to the first row, so one row is lost'
            - 'The number $3$ scales the pivot of row 2 so that it becomes a leading $1$ at once'
            - 'The number $3$ is the entry under the pivot, so that entry becomes zero'
            - 'The number $3$ is the count of columns, so every row is reduced in the same way'
          answer: 'The number $3$ is the entry under the pivot, so that entry becomes zero'
          why: 'Subtracting $3$ times the pivot row cancels the $3$ under the pivot, and a row operation keeps the solutions of the system.'
        exemplars:
          - problem: 'Reduce the matrix $\begin{pmatrix}1&3&7\\2&7&17\end{pmatrix}$ to reduced row echelon form.'
            answer: '[[1,0,-2],[0,1,3]]'
            answer_contract: {"kind":"matrix","rows":2,"cols":3}
            solution_sketch: 'The first entry is already a leading 1, so the first step clears the entry below it. Replace $R_2$ with $R_2 - 2R_1$: the matrix becomes $\begin{pmatrix}1&3&7\\0&1&3\end{pmatrix}$. Replace $R_1$ with $R_1 - 3R_2$: the matrix becomes $\begin{pmatrix}1&0&-2\\0&1&3\end{pmatrix}$. This matrix is in reduced row echelon form, so the answer is $\begin{pmatrix}1&0&-2\\0&1&3\end{pmatrix}$.'
          - problem: 'Use row operations to put the augmented matrix $\begin{pmatrix}1&-1&2\\3&-2&7\end{pmatrix}$ in reduced row echelon form.'
            answer: '[[1,0,3],[0,1,1]]'
            answer_contract: {"kind":"matrix","rows":2,"cols":3}
            solution_sketch: 'The leading 1 in row 1 needs a zero below it. Replace $R_2$ with $R_2 - 3R_1$: the matrix becomes $\begin{pmatrix}1&-1&2\\0&1&1\end{pmatrix}$. Replace $R_1$ with $R_1 + R_2$: the matrix becomes $\begin{pmatrix}1&0&3\\0&1&1\end{pmatrix}$. This matrix is in reduced row echelon form, so the answer is $\begin{pmatrix}1&0&3\\0&1&1\end{pmatrix}$.'
          - problem: 'Reduce $\begin{pmatrix}2&4&10\\0&3&9\end{pmatrix}$ to reduced row echelon form.'
            answer: '[[1,0,-1],[0,1,3]]'
            answer_contract: {"kind":"matrix","rows":2,"cols":3}
            solution_sketch: 'Each pivot must become a leading 1, so the rows are scaled first. Multiply $R_1$ by $\frac{1}{2}$: the matrix becomes $\begin{pmatrix}1&2&5\\0&3&9\end{pmatrix}$. Multiply $R_2$ by $\frac{1}{3}$: the matrix becomes $\begin{pmatrix}1&2&5\\0&1&3\end{pmatrix}$. Replace $R_1$ with $R_1 - 2R_2$: the matrix becomes $\begin{pmatrix}1&0&-1\\0&1&3\end{pmatrix}$. This matrix is in reduced row echelon form, so the answer is $\begin{pmatrix}1&0&-1\\0&1&3\end{pmatrix}$.'
          - problem: 'Find the reduced row echelon form of the augmented matrix $\begin{pmatrix}1&1&1&6\\2&1&-1&1\\1&-1&2&5\end{pmatrix}$.'
            answer: '[[1,0,0,1],[0,1,0,2],[0,0,1,3]]'
            answer_contract: {"kind":"matrix","rows":3,"cols":4}
            solution_sketch: 'Work down the columns to clear the entries below each pivot, then work up to clear the entries above each pivot. Replace $R_2$ with $R_2 - 2R_1$: the matrix becomes $\begin{pmatrix}1&1&1&6\\0&-1&-3&-11\\1&-1&2&5\end{pmatrix}$. Replace $R_3$ with $R_3 - R_1$: the matrix becomes $\begin{pmatrix}1&1&1&6\\0&-1&-3&-11\\0&-2&1&-1\end{pmatrix}$. Multiply $R_2$ by $-1$: the matrix becomes $\begin{pmatrix}1&1&1&6\\0&1&3&11\\0&-2&1&-1\end{pmatrix}$. Replace $R_3$ with $R_3 + 2R_2$: the matrix becomes $\begin{pmatrix}1&1&1&6\\0&1&3&11\\0&0&7&21\end{pmatrix}$. Multiply $R_3$ by $\frac{1}{7}$: the matrix becomes $\begin{pmatrix}1&1&1&6\\0&1&3&11\\0&0&1&3\end{pmatrix}$. Replace $R_2$ with $R_2 - 3R_3$: the matrix becomes $\begin{pmatrix}1&1&1&6\\0&1&0&2\\0&0&1&3\end{pmatrix}$. Replace $R_1$ with $R_1 - R_3$: the matrix becomes $\begin{pmatrix}1&1&0&3\\0&1&0&2\\0&0&1&3\end{pmatrix}$. Replace $R_1$ with $R_1 - R_2$: the matrix becomes $\begin{pmatrix}1&0&0&1\\0&1&0&2\\0&0&1&3\end{pmatrix}$. This matrix is in reduced row echelon form, so the answer is $\begin{pmatrix}1&0&0&1\\0&1&0&2\\0&0&1&3\end{pmatrix}$.'
          - problem: 'The second row of the matrix $\begin{pmatrix}1&2&3\\2&4&6\end{pmatrix}$ is a multiple of the first row. Find its reduced row echelon form.'
            answer: '[[1,2,3],[0,0,0]]'
            answer_contract: {"kind":"matrix","rows":2,"cols":3}
            solution_sketch: 'Row 2 is twice row 1, so subtracting twice row 1 leaves a row of zeros. Replace $R_2$ with $R_2 - 2R_1$: the matrix becomes $\begin{pmatrix}1&2&3\\0&0&0\end{pmatrix}$. This matrix is in reduced row echelon form, so the answer is $\begin{pmatrix}1&2&3\\0&0&0\end{pmatrix}$.'
          - problem: 'The matrix $\begin{pmatrix}0&2&8\\3&6&6\end{pmatrix}$ has a zero in the top left corner. Reduce it to reduced row echelon form.'
            answer: '[[1,0,-6],[0,1,4]]'
            answer_contract: {"kind":"matrix","rows":2,"cols":3}
            solution_sketch: 'A zero in the first pivot position means the rows must be swapped before anything else. Swap $R_1$ and $R_2$: the matrix becomes $\begin{pmatrix}3&6&6\\0&2&8\end{pmatrix}$. Multiply $R_1$ by $\frac{1}{3}$: the matrix becomes $\begin{pmatrix}1&2&2\\0&2&8\end{pmatrix}$. Multiply $R_2$ by $\frac{1}{2}$: the matrix becomes $\begin{pmatrix}1&2&2\\0&1&4\end{pmatrix}$. Replace $R_1$ with $R_1 - 2R_2$: the matrix becomes $\begin{pmatrix}1&0&-6\\0&1&4\end{pmatrix}$. This matrix is in reduced row echelon form, so the answer is $\begin{pmatrix}1&0&-6\\0&1&4\end{pmatrix}$.'
          - problem: 'At a cafe, one coffee and one muffin cost $5$ dollars together, and two coffees with three muffins cost $13$ dollars. With $c$ and $m$ for the two prices, Ana writes the system as the augmented matrix $\begin{pmatrix}1&1&5\\2&3&13\end{pmatrix}$. Reduce it to reduced row echelon form.'
            answer: '[[1,0,2],[0,1,3]]'
            answer_contract: {"kind":"matrix","rows":2,"cols":3}
            solution_sketch: 'The columns stand for $c$, $m$ and the total cost. Replace $R_2$ with $R_2 - 2R_1$: the matrix becomes $\begin{pmatrix}1&1&5\\0&1&3\end{pmatrix}$. Replace $R_1$ with $R_1 - R_2$: the matrix becomes $\begin{pmatrix}1&0&2\\0&1&3\end{pmatrix}$. This matrix is in reduced row echelon form, so the answer is $\begin{pmatrix}1&0&2\\0&1&3\end{pmatrix}$. The last column now reads $c = 2$ and $m = 3$.'
          - problem: 'A chemist mixes $x$ liters of $10\%$ acid with $y$ liters of $30\%$ acid to make $20$ liters of $16\%$ acid. The conditions are $x + y = 20$ and $0.1x + 0.3y = 3.2$. After multiplying the second equation by $10$, the augmented matrix is $\begin{pmatrix}1&1&20\\1&3&32\end{pmatrix}$. Reduce it to reduced row echelon form.'
            answer: '[[1,0,14],[0,1,6]]'
            answer_contract: {"kind":"matrix","rows":2,"cols":3}
            solution_sketch: 'The columns stand for $x$, $y$ and the right side. Replace $R_2$ with $R_2 - R_1$: the matrix becomes $\begin{pmatrix}1&1&20\\0&2&12\end{pmatrix}$. Multiply $R_2$ by $\frac{1}{2}$: the matrix becomes $\begin{pmatrix}1&1&20\\0&1&6\end{pmatrix}$. Replace $R_1$ with $R_1 - R_2$: the matrix becomes $\begin{pmatrix}1&0&14\\0&1&6\end{pmatrix}$. This matrix is in reduced row echelon form, so the answer is $\begin{pmatrix}1&0&14\\0&1&6\end{pmatrix}$. The last column gives $x = 14$ and $y = 6$.'
        constraints: 'augmented matrices with 2 or 3 rows whose reduced row echelon form has integer entries; some need a row swap or a scaling; two come from a word problem'
      - id: kp2
        name: Solving 2x2 systems by row reduction
        key_prerequisites: [elementary-row-operations, back-substitution-triangular-systems]
        step_check:
          step: 'Read off the last variable'
          question: 'Why does the second row give $y$ directly?'
          options:
            - 'After the elimination its $x$-entry is $0$, so the row has only $y$ left'
            - 'The second row holds the larger numbers, so it is the easiest one to solve'
            - 'The row was multiplied by $2$, and this multiplication removes the unknown $x$'
            - 'The unknown $y$ is always moved into the second row by a row operation'
          answer: 'After the elimination its $x$-entry is $0$, so the row has only $y$ left'
          why: 'The elimination made the $x$-entry of row 2 zero, so row 2 reads $y = 3$ and no other unknown remains.'
        exemplars:
          - problem: 'Solve the system by row reduction: $x + 2y = 5$, $3x + 4y = 11$.'
            answer: '(1, 2)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'Subtracting $3R_1$ from $R_2$ gives $-2y = -4$, so $y = 2$. Back-substituting into $x + 2y = 5$ gives $x = 1$, so the solution is $(1, 2)$.'
          - problem: 'Solve the system by row reduction: $3x - y = 7$, $x + 2y = 7$.'
            answer: '(3, 2)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'Swap the rows so that $x + 2y = 7$ comes first. Then $R_2 - 3R_1$ gives $-7y = -14$, so $y = 2$, and back-substitution gives $x = 3$. The solution is $(3, 2)$.'
          - problem: 'Solve the system by row reduction: $x - 2y = -7$, $2x + y = 1$.'
            answer: '(-1, 3)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'The operation $R_2 - 2R_1$ gives $5y = 15$, so $y = 3$. Then $x - 6 = -7$ gives $x = -1$, so the solution is $(-1, 3)$.'
          - problem: 'Solve the system by row reduction: $3x + 2y = 4$, $x - 2y = 0$.'
            answer: '(1, 1/2)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'Adding the two equations gives $4x = 4$, so $x = 1$. Then $1 - 2y = 0$ gives $y = \frac{1}{2}$, so the solution is $(1, 1/2)$.'
          - problem: 'Two adult tickets and one child ticket cost $23$ dollars. Three adult tickets and two child tickets cost $39$ dollars. How much does one child ticket cost?'
            answer: '9'
            answer_contract: {"kind":"unit","quantity":"dollar","unit":"dollar","allow_omitted":true}
            solution_sketch: 'With $a$ and $c$ for the two prices, the system is $2a + c = 23$ and $3a + 2c = 39$. Doubling the first equation and subtracting the second gives $a = 7$. Then $14 + c = 23$, so a child ticket costs $9$ dollars.'
          - problem: 'A bakery sold $50$ loaves for $170$ dollars. Some loaves cost $3$ dollars and the others cost $4$ dollars. How many of the $4$ dollar loaves were sold?'
            answer: '20'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Let $x$ be the number of $3$ dollar loaves and $y$ the number of $4$ dollar loaves, so $x + y = 50$ and $3x + 4y = 170$. Subtracting $3$ times the first equation from the second gives $y = 20$. So $20$ of the $4$ dollar loaves were sold.'
          - problem: 'A rectangle has perimeter $38$ cm, and its length is $5$ cm more than its width. What is its width?'
            answer: '7'
            answer_contract: {"kind":"unit","quantity":"length","unit":"cm","allow_omitted":true}
            solution_sketch: 'The perimeter gives $l + w = 19$, and the length condition gives $l - w = 5$. Subtracting the second equation from the first gives $2w = 14$. So the width is $7$ cm and the length is $12$ cm.'
          - problem: 'A boat travels $24$ km downstream in $2$ hours. It travels the same $24$ km back upstream in $3$ hours. What is the speed of the boat in still water?'
            answer: '10'
            answer_contract: {"kind":"unit","quantity":"speed","unit":"km/h","allow_omitted":true}
            solution_sketch: 'The speed downstream is $24 \div 2 = 12$ km/h and the speed upstream is $24 \div 3 = 8$ km/h. With $b$ for the boat and $c$ for the current, $b + c = 12$ and $b - c = 8$. Adding gives $2b = 20$, so the boat goes $10$ km/h in still water.'
        constraints: '2x2 systems with a unique solution (integer, or one simple fraction); four bare systems and four word problems, two of which need division to set up'
      - id: kp3
        name: Solving 3x3 systems by row reduction
        key_prerequisites: [elementary-row-operations, back-substitution-triangular-systems]
        step_check:
          step: 'Eliminate $x$ from $R_3$: compute $R_3 - R_1$'
          question: 'Why is $R_1$ subtracted from $R_3$ here?'
          options:
            - 'The subtraction makes the right side of the new row equal to $0$'
            - 'Both rows have $x$-coefficient $1$, so the $x$ terms cancel'
            - 'Subtracting always removes the variable $z$ from the row below'
            - 'Row 1 must be subtracted from every other row, whatever its entries'
          answer: 'Both rows have $x$-coefficient $1$, so the $x$ terms cancel'
          why: 'The new row has no $x$ term, so rows 2 and 3 form a smaller system in $y$ and $z$ only.'
        exemplars:
          - problem: 'Solve the system: $x + 2y + z = 1$, $2x - y + 3z = 8$, $x + y + 2z = 3$.'
            answer: '(2, -1, 1)'
            answer_contract: {"kind":"coordinates","arity":3}
            solution_sketch: 'Subtracting $2R_1$ from $R_2$ gives $-5y + z = 6$, and subtracting $R_1$ from $R_3$ gives $-y + z = 2$. Subtracting these two equations gives $-4y = 4$, so $y = -1$ and $z = 1$. Then $x - 2 + 1 = 1$ gives $x = 2$, so the solution is $(2, -1, 1)$.'
          - problem: 'Solve the system: $x + y + z = 6$, $x - y + z = 2$, $2x + y - z = 1$.'
            answer: '(1, 2, 3)'
            answer_contract: {"kind":"coordinates","arity":3}
            solution_sketch: 'Subtracting the second equation from the first gives $2y = 4$, so $y = 2$. The first and third equations become $x + z = 4$ and $2x - z = -1$. Adding them gives $3x = 3$, so $x = 1$ and $z = 3$, and the solution is $(1, 2, 3)$.'
          - problem: 'Solve the system: $x + y + z = 1$, $2x - y + z = 4$, $x + 2y - z = 5$.'
            answer: '(3, 0, -2)'
            answer_contract: {"kind":"coordinates","arity":3}
            solution_sketch: 'Adding the first and third equations gives $2x + 3y = 6$. Adding the second and third equations gives $3x + y = 9$. Solving these two gives $x = 3$ and $y = 0$, and then $z = 1 - 3 - 0 = -2$, so the solution is $(3, 0, -2)$.'
          - problem: 'Solve the system: $2x + y - z = 0$, $x - y + 2z = -1$, $3x + y + z = 3$.'
            answer: '(-1, 4, 2)'
            answer_contract: {"kind":"coordinates","arity":3}
            solution_sketch: 'Adding the first and second equations gives $3x + z = -1$. Adding the first and third equations gives $5x + 2y = 3$, and $R_1$ gives $y = z - 2x$. Substituting $z = -1 - 3x$ gives $y = -1 - 5x$, so $5x + 2(-1 - 5x) = 3$, which gives $x = -1$. Then $z = 2$ and $y = 4$, so the solution is $(-1, 4, 2)$.'
          - problem: 'A school buys pens, notebooks and folders. Order 1 is $2$ pens, $1$ notebook and $1$ folder for $9$ dollars. Order 2 is $1$ pen, $2$ notebooks and $1$ folder for $11$ dollars. Order 3 is $1$ pen, $1$ notebook and $2$ folders for $12$ dollars. How much does one folder cost?'
            answer: '4'
            answer_contract: {"kind":"unit","quantity":"dollar","unit":"dollar","allow_omitted":true}
            solution_sketch: 'With $p$, $n$ and $f$ for the prices, the orders give $2p + n + f = 9$, $p + 2n + f = 11$ and $p + n + 2f = 12$. Adding all three gives $4(p + n + f) = 32$, so $p + n + f = 8$. Subtracting this from the equation for order 3 gives $f = 4$, so a folder costs $4$ dollars.'
          - problem: 'A jar holds $20$ coins, all nickels, dimes and quarters, worth $2.50$ dollars in all. The jar holds as many dimes as quarters. How many nickels are in the jar?'
            answer: '8'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'With $n$, $d$ and $q$ for the numbers of coins, $n + d + q = 20$, $5n + 10d + 25q = 250$ and $d = q$. Replacing $q$ by $d$ gives $n + 2d = 20$ and $5n + 35d = 250$. Then $25d = 150$, so $d = 6$ and $n = 20 - 12 = 8$ nickels.'
          - problem: 'Three pumps A, B and C fill a tank. Pumps A and B together fill it in $4$ hours, pumps A and C together in $5$ hours, and pumps B and C together in $4$ hours. How long does pump A take to fill the tank alone?'
            answer: '10'
            answer_contract: {"kind":"unit","quantity":"time","unit":"hour","allow_omitted":true}
            solution_sketch: 'Write the rates in tanks per hour: $a + b = \frac{1}{4}$, $a + c = \frac{1}{5}$ and $b + c = \frac{1}{4}$. Subtracting the third equation from the first gives $a - c = 0$, so $a = c$, and then $2a = \frac{1}{5}$ gives $a = \frac{1}{10}$. Pump A fills $\frac{1}{10}$ of the tank per hour, so it takes $10$ hours.'
        constraints: '3x3 systems with a unique solution (integer entries, coordinates in -4..4); four bare systems and three word problems'
    diagnostic_exemplar:
      problem: 'Solve by row reduction: $x + y + z = 6$, $2x + y - z = 1$, $x - y + 2z = 5$.'
      answer: '(1, 2, 3)'
      answer_contract: {"kind":"coordinates","arity":3}
      solution_sketch: 'Eliminating $x$ gives $-y - 3z = -11$ and $-2y + z = -1$; solving these gives $y = 2$, $z = 3$, hence $x = 1$.'
    anki_seeds:
      - front: 'Overall strategy of Gaussian elimination?'
        back: 'Row-reduce to echelon form, then back-substitute (or continue to RREF).'
        type: basic
      - front: 'Row reducing the augmented matrix of a system yields...'
        back: 'an equivalent system with the same solution set.'
        type: basic

  - id: consistency-of-linear-systems
    name: Consistent and Inconsistent Systems
    core: true
    difficulty: 0.55
    drill: false
    answer_kind: numeric
    expected_time_secs: 120
    prerequisites:
      - id: row-reduction-echelon-forms
        weight: 0.7
        key: true
      - id: systems-special-cases
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: Detecting inconsistency
        key_prerequisites: [row-reduction-echelon-forms]
        step_check:
          step: 'Subtract 3 times the first equation from the second'
          question: 'Why is $3$ times the first equation subtracted?'
          options:
            - 'The multiple $3$ matches both coefficients, so the $x$ and $y$ terms cancel'
            - 'The multiple $3$ is the right side of the first equation, so the constants cancel'
            - 'Any multiple would do, because the result is always the same equation in the end'
            - 'The multiple $3$ is the number of equations, so the system is reduced one step'
          answer: 'The multiple $3$ matches both coefficients, so the $x$ and $y$ terms cancel'
          why: 'The left side of the second equation is $3$ times the left side of the first, so only the constants are left to compare.'
        try_first:
          problem: 'Can two numbers $x$ and $y$ satisfy both $x + y = 2$ and $x + y = 7$ at the same time?'
          answer_contract: {"kind":"label","options":[["no","they cannot","it is not possible"],["yes","they can","it is possible"]]}
          answer: 'no'
          reveal: 'The same sum $x + y$ cannot equal both $2$ and $7$, so no pair works. A system whose equations contradict each other has no solution, and it is called inconsistent.'
        exemplars:
          - problem: 'How many solutions does the system $x + y = 2$, $2x + 2y = 5$ have?'
            answer: '0'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Subtract twice the first equation from the second: $(2x + 2y) - 2(x + y) = 5 - 4$, which gives $0 = 1$. No pair $(x, y)$ satisfies a false statement, so the system has $0$ solutions.'
          - problem: 'How many solutions does the system $x + y = 3$, $x - y = 1$ have?'
            answer: '1'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Adding the two equations gives $2x = 4$, so $x = 2$. Then $2 + y = 3$ gives $y = 1$. The system has exactly one solution, so the count is $1$.'
          - problem: 'Is the system $3x + y = 4$, $6x + 2y = 9$ consistent?'
            answer: 'no'
            answer_contract: {"kind":"label","options":[["no","not consistent","inconsistent","it is inconsistent"],["yes","consistent","it is consistent"]]}
            solution_sketch: 'Subtract twice the first equation from the second: $(6x + 2y) - 2(3x + y) = 9 - 8$, so $0 = 1$. The equations contradict each other, so the system has no solution and is not consistent.'
          - problem: 'How many solutions does the system $x + y + z = 4$, $x - y = 1$, $2x + 2y + 2z = 9$ have?'
            answer: '0'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Subtract twice the first equation from the third: $(2x + 2y + 2z) - 2(x + y + z) = 9 - 8$, which gives $0 = 1$. This is a false statement, so the system has $0$ solutions.'
          - problem: 'Taxi company A charges a fee of $3$ dollars plus $2$ dollars per kilometer. Taxi company B charges a fee of $5$ dollars plus $1$ dollar per kilometer. For which distance do the two companies charge the same amount?'
            answer: '2'
            answer_contract: {"kind":"unit","quantity":"length","unit":"km","allow_omitted":true}
            solution_sketch: 'For a trip of $d$ kilometers the charges are $3 + 2d$ and $5 + d$. Setting them equal gives $d = 2$, so the two companies charge the same for a trip of $2$ kilometers.'
          - problem: 'Plan A costs $20$ dollars plus $0.10$ dollars per minute. Plan B costs $15$ dollars plus $0.12$ dollars per minute. After how many minutes do the two plans cost the same?'
            answer: '250'
            answer_contract: {"kind":"unit","quantity":"time","unit":"minute","allow_omitted":true}
            solution_sketch: 'Setting $20 + 0.10m = 15 + 0.12m$ gives $5 = 0.02m$, so $m = 250$. The plans cost the same at $250$ minutes.'
          - problem: 'Plan C costs $20$ dollars plus $0.10$ dollars per minute, and plan D costs $15$ dollars plus $0.10$ dollars per minute. For which numbers of minutes do the two plans cost the same?'
            answer: 'never'
            answer_contract: {"kind":"label","options":[["never","none","no number of minutes","at no time"],["once","exactly one number","one number","one"],["always","every number","all of them"]]}
            solution_sketch: 'Setting $20 + 0.10m = 15 + 0.10m$ and subtracting $0.10m$ from both sides gives $20 = 15$, which is false. The plans never cost the same, for any number of minutes.'
          - problem: 'At a shop every muffin has one price and every cookie has one price. Ana pays $6$ dollars for $2$ muffins and $2$ cookies. Ben buys $3$ muffins and $3$ cookies and is charged $10$ dollars. By how many dollars is Ben overcharged?'
            answer: '1'
            answer_contract: {"kind":"unit","quantity":"dollar","unit":"dollar","allow_omitted":true}
            solution_sketch: 'Ana pays $2m + 2c = 6$, so $m + c = 3$. Three muffins and three cookies cost $3(m + c) = 9$ dollars, so Ben is overcharged $1$ dollar. The two receipts contradict each other, so no prices fit both.'
          - problem: 'The augmented matrix of a system reduces to $\begin{pmatrix}1&2&0&5\\0&0&1&3\\0&0&0&4\end{pmatrix}$. How many solutions does the system have?'
            answer: '0'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The last row reads $0x + 0y + 0z = 4$, which is $0 = 4$. A false statement has no solution, so the system has $0$ solutions.'
        constraints: '2x2 and 3x3 systems and reduced matrices whose contradiction is a multiple of another row; counts 0 and 1; two yes-no verdicts; four word problems'
      - id: kp2
        name: Detecting infinitely many solutions
        key_prerequisites: [row-reduction-echelon-forms]
        step_check:
          step: 'the second row is an exact multiple of the first, so it carries no new information'
          question: 'Why does a row that is a multiple of another row lead to infinitely many solutions?'
          options:
            - 'It reduces the system to $0 = 0$, which is false for every pair $(x, y)$ of numbers'
            - 'Two equations always give two solutions, one for each row of the augmented matrix'
            - 'It adds no condition, so one equation in two unknowns is left and one is free'
            - 'It doubles every solution of the first row, so the number of solutions doubles in all'
          answer: 'It adds no condition, so one equation in two unknowns is left and one is free'
          why: 'A system with one equation and two unknowns has one free variable, so every value of that variable gives a solution.'
        exemplars:
          - problem: 'How many solutions does the system $x + 2y = 3$, $3x + 6y = 9$ have?'
            answer: 'infinitely many'
            answer_contract: {"kind":"label","options":[["no solution","none","0","zero","no solutions"],["exactly one","one","1","a unique solution","a single solution","unique"],["infinitely many","infinite","infinitely many solutions","an infinite number","many","∞"]]}
            solution_sketch: 'Subtracting $3R_1$ from $R_2$ gives $0 = 0$, so the second equation adds no new condition. One equation in two unknowns is left, so $y$ is free and there are infinitely many solutions.'
          - problem: 'The augmented matrix of a system in $x$ and $y$ reduces to $\begin{pmatrix}1&4&9\\0&0&0\end{pmatrix}$. Write $x$ in terms of $y$.'
            answer: 'x = 9 - 4y'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The first row reads $x + 4y = 9$ and the second row says nothing. The column of $y$ has no pivot, so $y$ is free, and solving the first row gives $x = 9 - 4y$.'
          - problem: 'For the system $2x + y = 7$, $4x + 2y = 14$, write $y$ in terms of $x$.'
            answer: 'y = 7 - 2x'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Subtracting $2R_1$ from $R_2$ gives $0 = 0$, so the system is the single equation $2x + y = 7$. Solving it for $y$ gives $y = 7 - 2x$.'
          - problem: 'The augmented matrix of a system in $x$ and $y$ reduces to $\begin{pmatrix}1&0&5\\0&0&0\end{pmatrix}$. How many free variables does the system have?'
            answer: '1'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The only pivot is in the column of $x$, which gives $x = 5$. The column of $y$ has no pivot, so exactly one variable is free, and the answer is $1$.'
          - problem: 'Find the solution of the system $x + 3y = 5$, $2x + 6y = 10$ that has $y = 2$.'
            answer: '(-1, 2)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'Subtracting $2R_1$ from $R_2$ gives $0 = 0$, so the system is the single equation $x + 3y = 5$. With $y = 2$ it reads $x + 6 = 5$, so $x = -1$ and the solution is $(-1, 2)$.'
          - problem: 'Solve the system $x + 4y = 8$, $3x + 12y = 24$ for $x$ in terms of $y$.'
            answer: 'x = 8 - 4y'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Subtracting $3R_1$ from $R_2$ gives $0 = 0$, since the second equation is $3$ times the first. The system is the single equation $x + 4y = 8$, so $x = 8 - 4y$.'
          - problem: 'Ana pays $12$ dollars for $3$ pens and $2$ pencils, and Ben pays $24$ dollars for $6$ pens and $4$ pencils at the same shop. A pencil costs $3$ dollars. What does a pen cost?'
            answer: '2'
            answer_contract: {"kind":"unit","quantity":"dollar","unit":"dollar","allow_omitted":true}
            solution_sketch: 'Ben bought exactly twice what Ana bought and paid exactly twice as much, so his receipt gives no new information. From the first receipt, $3p + 2 \cdot 3 = 12$, so $3p = 6$ and a pen costs $2$ dollars.'
          - problem: 'Two receipts from one theater show $2$ adult tickets and $3$ child tickets for $26$ dollars, and $4$ adult tickets and $6$ child tickets for $52$ dollars. A child ticket costs $6$ dollars. What does an adult ticket cost?'
            answer: '4'
            answer_contract: {"kind":"unit","quantity":"dollar","unit":"dollar","allow_omitted":true}
            solution_sketch: 'The second receipt is twice the first, so it adds no condition. From the first receipt, $2a + 3 \cdot 6 = 26$, so $2a = 8$ and an adult ticket costs $4$ dollars.'
          - problem: 'At a hardware store, $4$ bolts and $2$ nuts cost $10$ dollars, and $6$ bolts and $3$ nuts cost $15$ dollars. Can the price of one bolt be found from these two receipts alone?'
            answer: 'no'
            answer_contract: {"kind":"label","options":[["no","it cannot","not possible"],["yes","it can","possible"]]}
            solution_sketch: 'The second receipt is $\frac{3}{2}$ times the first, so the two receipts give only one equation, $4b + 2n = 10$. One equation with two unknowns has infinitely many solutions, so the price of a bolt cannot be found.'
        constraints: '2x2 systems and reduced matrices with one row that is a multiple of another; answers are a count, a free-variable count, one variable in terms of the other, or one solution with a named value; three word problems'
      - id: kp3
        name: Consistency with a parameter
        key_prerequisites: [row-reduction-echelon-forms]
        step_check:
          step: 'Subtract the doubled first equation from the second'
          question: 'Why is the first equation doubled before it is subtracted?'
          options:
            - 'Doubling makes the constant on the right equal to $6$ in both equations'
            - 'Doubling removes the unknown $h$ from the first equation, so $h$ is gone'
            - 'The first equation has to be larger than the second before a subtraction'
            - 'Both equations then have $2x$, so the $x$ terms cancel and $y$ is left'
          answer: 'Both equations then have $2x$, so the $x$ terms cancel and $y$ is left'
          why: 'After the $x$ terms cancel, the result is an equation in $y$ alone, and the coefficient $h - 8$ decides what happens.'
        exemplars:
          - problem: 'For which value of $h$ is the system $x + 2y = 3$, $2x + 4y = h$ consistent?'
            answer: '6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Subtracting $2R_1$ from $R_2$ gives $0 = h - 6$. The system is consistent only when $h - 6 = 0$, so $h = 6$.'
          - problem: 'For which value of $h$ is the system $x + 3y = 2$, $2x + hy = 5$ inconsistent?'
            answer: '6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Subtracting $2R_1$ from $R_2$ gives $(h - 6)y = 1$. This is a contradiction exactly when $h - 6 = 0$, so $h = 6$. Any other $h$ gives a unique solution.'
          - problem: 'For which value of $h$ does the system $x + 2y = 3$, $2x + hy = 6$ have infinitely many solutions?'
            answer: '4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The second equation is twice the first exactly when $h = 4$, because $2 \cdot 2 = 4$ and $2 \cdot 3 = 6$. For every other $h$ the solution is unique, so $h = 4$.'
          - problem: 'For which value of $h$ does the system $x + 3y = 1$, $4x + hy = 5$ not have a unique solution?'
            answer: '12'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Subtracting $4R_1$ from $R_2$ gives $(h - 12)y = 1$. If $h \ne 12$, this gives one value of $y$ and then one value of $x$, so the solution is unique. For $h = 12$ the row reads $0 = 1$ and there is no solution, so the answer is $h = 12$.'
          - problem: 'For which value of $h$ does the system $hx + 2y = 3$, $4x + 8y = 13$ have no solution?'
            answer: '1'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The left sides are proportional only when $\frac{h}{4} = \frac{2}{8}$, so $h = 1$. Then $R_2 - 4R_1$ gives $0 = 13 - 12 = 1$, a contradiction. For every other $h$ the solution is unique, so $h = 1$.'
          - problem: 'For which value of $k$ does the system $x + 3y = 5$, $3x + ky = 15$ have infinitely many solutions?'
            answer: '9'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Subtracting $3R_1$ from $R_2$ gives $(k - 9)y = 0$. The row is $0 = 0$ exactly when $k - 9 = 0$, so $k = 9$.'
          - problem: 'For which value of $a$ does the system $x + 4y = 7$, $3x + ay = 22$ have no solution?'
            answer: '12'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Subtracting $3R_1$ from $R_2$ gives $(a - 12)y = 1$. A contradiction occurs when $a - 12 = 0$, because the right side $1$ is not $0$, so $a = 12$.'
          - problem: 'Two receipts from one shop show $3$ muffins and $6$ cookies for $12$ dollars, and $5$ muffins and $k$ cookies for $21$ dollars. For which value of $k$ can no prices of a muffin and a cookie fit both receipts?'
            answer: '10'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'With $m$ and $c$ for the prices, the first receipt gives $m + 2c = 4$. Subtracting $\frac{5}{3}$ of the first receipt from the second gives $(k - 10)c = 1$. This is impossible exactly when $k - 10 = 0$, so $k = 10$.'
          - problem: 'A farmer mixes $a$ scoops of feed A with $b$ scoops of feed B. A scoop of A has $2$ g of protein and $3$ g of fiber, and a scoop of B has $4$ g of protein and $h$ g of fiber. The mix must have exactly $10$ g of protein and $15$ g of fiber. For which value of $h$ are there infinitely many possible mixes?'
            answer: '6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The equations are $2a + 4b = 10$ and $3a + hb = 15$. The second equation is $\frac{3}{2}$ times the first exactly when $h = 6$, and then both say the same thing, so $h = 6$.'
          - problem: 'For which value of $h$ do the lines $3x + hy = 5$ and $x + 2y = 4$ fail to meet in exactly one point?'
            answer: '6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The lines meet in exactly one point when the system has a unique solution. Subtracting $3R_2$ from $R_1$ gives $(h - 6)y = -7$, so the solution is unique unless $h = 6$. For $h = 6$ the lines are parallel and never meet, so $h = 6$.'
        constraints: 'systems with one parameter and a single integer answer; asked as consistent, inconsistent, no solution, infinitely many solutions or no unique solution; two word problems'
    diagnostic_exemplar:
      problem: 'For which $h$ does the system $x + 2y = 3$, $2x + hy = 7$ have no solution, for which $h$ does it have exactly one solution, and for which $h$ does it have infinitely many?'
      answer: 'No solution when h = 4; exactly one solution for every h other than 4; infinitely many for no value of h'
      answer_contract: {kind: none}
      solution_sketch: 'For $h \ne 4$ the coefficient matrix has two pivots, so the solution is unique. For $h = 4$ row reduction gives $0 = 7 - 6 = 1$, which is inconsistent; the constants never match, so infinitely many solutions never occur.'
    anki_seeds:
      - front: 'An echelon row $(0\ \cdots\ 0 \mid b)$ with $b \neq 0$ means the system is...'
        back: 'inconsistent (no solutions).'
        type: basic
      - front: 'A consistent linear system has either...'
        back: 'exactly one solution or infinitely many.'
        type: basic

  - id: solution-sets-free-variables
    name: Solution Sets and Free Variables
    core: true
    difficulty: 0.6
    drill: false
    answer_kind: numeric
    expected_time_secs: 180
    prerequisites:
      - id: row-reduction-echelon-forms
        weight: 0.8
        key: true
      - id: consistency-of-linear-systems
        weight: 0.5
        key: true
      - id: evaluating-expressions
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: Pivot and free variables
        key_prerequisites: [row-reduction-echelon-forms]
        step_check:
          step: 'The pivot columns are 1 and 3, so $x_1$ and $x_3$ are the basic variables'
          question: 'Why are $x_1$ and $x_3$ the basic variables?'
          options:
            - 'They are the variables with the largest coefficients in the matrix'
            - 'Each of their columns holds the first nonzero entry of a nonzero row'
            - 'They come first in the list, and the first variables are always basic'
            - 'Their columns hold only zeros, so their values are fixed at $0$'
          answer: 'Each of their columns holds the first nonzero entry of a nonzero row'
          why: 'A column with a pivot is solved for in terms of the later variables, and a column without a pivot leaves a free choice.'
        exemplars:
          - problem: 'A $3 \times 5$ coefficient matrix has $3$ pivots. How many free variables does $A\mathbf{x} = \mathbf{0}$ have?'
            answer: '2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The system has $5$ variables, and $3$ of them are basic because their columns hold pivots. The other $5 - 3 = 2$ variables are free.'
          - problem: 'The echelon form of an augmented matrix is $\begin{pmatrix}1&2&0&4\\0&0&1&3\end{pmatrix}$, with variables $x$, $y$, $z$. How many free variables does the system have?'
            answer: '1'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The pivots are in columns 1 and 3, so $x$ and $z$ are basic variables. Column 2 has no pivot, so $y$ is free, and the system has $1$ free variable.'
          - problem: 'The echelon form of an augmented matrix is $\begin{pmatrix}1&0&2&0&3\\0&1&4&0&5\\0&0&0&1&6\end{pmatrix}$, with variables $x$, $y$, $z$, $w$. Which variable is free?'
            answer: 'z'
            answer_contract: {"kind":"label","options":[["x","the variable x","x is free"],["y","the variable y","y is free"],["z","the variable z","z is free"],["w","the variable w","w is free"]]}
            solution_sketch: 'The pivots are in columns 1, 2 and 4, so $x$, $y$ and $w$ are basic variables. Only column 3 has no pivot, so the free variable is $z$.'
          - problem: 'The echelon form of an augmented matrix is $\begin{pmatrix}1&2&0&0&3\\0&0&1&0&4\\0&0&0&1&5\end{pmatrix}$, with variables $x$, $y$, $z$, $w$. Which variable is free?'
            answer: 'y'
            answer_contract: {"kind":"label","options":[["x","the variable x","x is free"],["y","the variable y","y is free"],["z","the variable z","z is free"],["w","the variable w","w is free"]]}
            solution_sketch: 'The pivots are in columns 1, 3 and 4, so $x$, $z$ and $w$ are basic variables. Only column 2 has no pivot, so the free variable is $y$.'
          - problem: 'A system of $4$ equations in $6$ unknowns has a coefficient matrix with $3$ pivots. How many free variables does the system have?'
            answer: '3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The $6$ unknowns split into basic variables, one for each pivot, and free variables. With $3$ pivots there are $6 - 3 = 3$ free variables. The number of equations does not matter, only the number of pivots.'
          - problem: 'A dietitian chooses the amounts of $5$ foods to meet $3$ nutrient targets. The $3$ equations are independent, so the coefficient matrix has $3$ pivots. How many of the amounts can be chosen freely?'
            answer: '2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'There are $5$ unknown amounts and $3$ pivots. The amounts in the pivot columns are fixed by the others, so $5 - 3 = 2$ amounts can be chosen freely.'
          - problem: 'A factory model has $8$ production quantities that must satisfy $4$ independent constraints, so the coefficient matrix has $4$ pivots. The manager picks values for the free variables. How many values does the manager pick?'
            answer: '4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The model has $8$ variables and $4$ pivots, so $8 - 4 = 4$ variables are free. The manager picks $4$ values, and the constraints then fix the other $4$ quantities.'
          - problem: 'The echelon form of an augmented matrix is $\begin{pmatrix}1&0&2&3&4\\0&1&5&6&7\end{pmatrix}$, with variables $x$, $y$, $z$, $w$ in the first four columns. Which columns belong to free variables?'
            answer: '3, 4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The pivots are in columns 1 and 2, so $x$ and $y$ are basic variables. Columns 3 and 4 have no pivot, so the free variables are $z$ and $w$, and the free columns are $3$ and $4$.'
        constraints: 'echelon matrices up to 3x5, or the pivot and unknown counts of a system; asked as a count or as the names of the free variables; two word problems'
      - id: kp2
        name: Parametric descriptions with one free variable
        key_prerequisites: [row-reduction-echelon-forms]
        step_check:
          step: 'Solve the second equation for $y$'
          question: 'Why is the second equation solved before the first?'
          options:
            - 'The second equation is shorter, so it must always be solved first'
            - 'The first equation cannot be used once the variable $z$ is named'
            - 'It has only $y$ and $z$, so after $z = t$ it gives $y$ at once'
            - 'Solving for $y$ first makes the parameter $t$ disappear from the answer'
          answer: 'It has only $y$ and $z$, so after $z = t$ it gives $y$ at once'
          why: 'Once $y$ is known in terms of $t$, the first equation has only $x$ left to find.'
        exemplars:
          - problem: 'Find all solutions $(x, y)$ of $x + 2y = 4$ by setting $y = t$.'
            answer: '(4 - 2t, t)'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Setting $y = t$ in $x + 2y = 4$ gives $x = 4 - 2t$. The solutions are $(4 - 2t, t)$ for every real number $t$.'
          - problem: 'Find all solutions $(x, y, z)$ of the system $x + y + z = 4$, $y - z = 1$, taking $z = t$.'
            answer: '(3 - 2t, 1 + t, t)'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The second equation gives $y = 1 + t$. Then the first equation gives $x = 4 - (1 + t) - t = 3 - 2t$, so the solutions are $(3 - 2t, 1 + t, t)$.'
          - problem: 'Find all solutions $(x, y, z)$ of the system $x + 3z = 4$, $y - z = 2$, taking $z = t$.'
            answer: '(4 - 3t, 2 + t, t)'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The first equation gives $x = 4 - 3t$ and the second gives $y = 2 + t$. The solutions are $(4 - 3t, 2 + t, t)$.'
          - problem: 'The augmented matrix of a system in $x$, $y$, $z$ reduces to $\begin{pmatrix}1&0&-2&3\\0&1&4&-1\end{pmatrix}$. Find all solutions $(x, y, z)$, taking $z = t$.'
            answer: '(3 + 2t, -1 - 4t, t)'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Row 1 reads $x - 2z = 3$, so $x = 3 + 2t$. Row 2 reads $y + 4z = -1$, so $y = -1 - 4t$. The solutions are $(3 + 2t, -1 - 4t, t)$.'
          - problem: 'A rectangular pen is fenced with $40$ meters of fence, so its sides $x$ and $y$, in meters, satisfy $2x + 2y = 40$. Find the general solution $(x, y)$, taking $y = t$.'
            answer: '(20 - t, t)'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Dividing by $2$ gives $x + y = 20$. With $y = t$ this gives $x = 20 - t$, so the pairs are $(20 - t, t)$.'
          - problem: 'A prize of $100$ dollars is shared among Xia, Yan and Zed. Yan receives $10$ dollars more than Zed. If Zed receives $t$ dollars, find $(x, y, z)$, the amounts for Xia, Yan and Zed.'
            answer: '(90 - 2t, 10 + t, t)'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Yan receives $y = 10 + t$ and Zed receives $z = t$. Since $x + y + z = 100$, Xia receives $x = 100 - (10 + t) - t = 90 - 2t$. The amounts are $(90 - 2t, 10 + t, t)$.'
          - problem: 'A hiker covers $60$ km by walking at $4$ km/h for $w$ hours and cycling at $12$ km/h for $c$ hours. Find the general solution $(w, c)$, taking $c = t$.'
            answer: '(15 - 3t, t)'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The distance is $4w + 12c = 60$. Dividing by $4$ gives $w + 3c = 15$, so with $c = t$ we get $w = 15 - 3t$. The pairs are $(15 - 3t, t)$.'
        constraints: 'exactly one free variable named in the question; integer coefficients in the parametric form; three word problems'
      - id: kp3
        name: General solutions with two free variables
        key_prerequisites: [row-reduction-echelon-forms, consistency-of-linear-systems]
        step_check:
          step: 'Solve row 1 for the pivot variable'
          question: 'Why is $x_1$ not given a parameter of its own?'
          options:
            - 'Row 1 fixes $x_1$ once $x_2$ and $x_4$ are chosen, so it depends on $s$ and $t$'
            - 'Only the first variable of a system is never free, whatever the matrix'
            - 'A parameter is needed only for a row that has a nonzero constant'
            - 'Parameters are named for the pivot variables, and the free variables are then solved for'
          answer: 'Row 1 fixes $x_1$ once $x_2$ and $x_4$ are chosen, so it depends on $s$ and $t$'
          why: 'The free variables carry the parameters, and each pivot variable is a formula in those parameters.'
        exemplars:
          - problem: 'Find all solutions $(x, y, z)$ of $x + 2y - z = 3$, taking $y = s$ and $z = t$.'
            answer: '(3 - 2s + t, s, t)'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Setting $y = s$ and $z = t$ in $x + 2y - z = 3$ gives $x = 3 - 2s + t$. The solutions are $(3 - 2s + t, s, t)$ for all real $s$ and $t$.'
          - problem: 'The augmented matrix of a system reduces to $\begin{pmatrix}1&2&0&3&4\\0&0&1&2&5\end{pmatrix}$, with variables $x_1, x_2, x_3, x_4$. Find all solutions $(x_1, x_2, x_3, x_4)$, taking $x_2 = s$ and $x_4 = t$.'
            answer: '(4 - 2s - 3t, s, 5 - 2t, t)'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Row 1 reads $x_1 + 2x_2 + 3x_4 = 4$, so $x_1 = 4 - 2s - 3t$. Row 2 reads $x_3 + 2x_4 = 5$, so $x_3 = 5 - 2t$. The solutions are $(4 - 2s - 3t, s, 5 - 2t, t)$.'
          - problem: 'The augmented matrix of a system reduces to $\begin{pmatrix}1&0&3&-1&2\\0&1&-2&4&6\end{pmatrix}$, with variables $x_1, x_2, x_3, x_4$. Find all solutions $(x_1, x_2, x_3, x_4)$, taking $x_3 = s$ and $x_4 = t$.'
            answer: '(2 - 3s + t, 6 + 2s - 4t, s, t)'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Row 1 reads $x_1 + 3x_3 - x_4 = 2$, so $x_1 = 2 - 3s + t$. Row 2 reads $x_2 - 2x_3 + 4x_4 = 6$, so $x_2 = 6 + 2s - 4t$. The solutions are $(2 - 3s + t, 6 + 2s - 4t, s, t)$.'
          - problem: 'Find all solutions $(x, y, z)$ of $x - 4y + z = 7$, taking $y = s$ and $z = t$.'
            answer: '(7 + 4s - t, s, t)'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Solving $x - 4y + z = 7$ for $x$ gives $x = 7 + 4y - z$. With $y = s$ and $z = t$ the solutions are $(7 + 4s - t, s, t)$.'
          - problem: 'A $12$ kg mixture is made from three powders, with $x$, $y$ and $z$ kilograms of each, so $x + y + z = 12$. Find the general solution $(x, y, z)$, taking $y = s$ and $z = t$.'
            answer: '(12 - s - t, s, t)'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Solving $x + y + z = 12$ for $x$ gives $x = 12 - y - z$. With $y = s$ and $z = t$ the possible mixtures are $(12 - s - t, s, t)$.'
          - problem: 'A depot allocates $20$ hours of machine time among four jobs, so the hours satisfy $x_1 + x_2 + x_3 + x_4 = 20$ and $x_2 - x_3 + x_4 = 2$. Find all solutions $(x_1, x_2, x_3, x_4)$, taking $x_3 = s$ and $x_4 = t$.'
            answer: '(18 - 2s, 2 + s - t, s, t)'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The second equation gives $x_2 = 2 + s - t$. The first then gives $x_1 = 20 - (2 + s - t) - s - t = 18 - 2s$. The solutions are $(18 - 2s, 2 + s - t, s, t)$.'
          - problem: 'Nuts cost $2$ dollars per cup, raisins $4$ dollars per cup and chocolate $6$ dollars per cup. A mix of $n$ cups of nuts, $r$ cups of raisins and $c$ cups of chocolate costs $24$ dollars in all. Find the general solution $(n, r, c)$, taking $r = s$ and $c = t$.'
            answer: '(12 - 2s - 3t, s, t)'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The cost gives $2n + 4r + 6c = 24$, so $n + 2r + 3c = 12$. With $r = s$ and $c = t$ this gives $n = 12 - 2s - 3t$, so the mixes are $(12 - 2s - 3t, s, t)$.'
        constraints: 'two free variables named in the question; every coefficient an integer; three word problems'
    diagnostic_exemplar:
      problem: 'The RREF of an augmented matrix is $\begin{pmatrix}1&3&0&2&5\\0&0&1&4&1\end{pmatrix}$ with variables $x_1, x_2, x_3, x_4$. Which variables are free, and what is the general solution with $x_2 = s$ and $x_4 = t$?'
      answer: 'x2 and x4 are free; x1 = 5 - 3s - 2t, x2 = s, x3 = 1 - 4t, x4 = t'
      answer_contract: {kind: none}
      solution_sketch: 'Pivots sit in columns $1$ and $3$, so $x_2, x_4$ are free; the rows read $x_1 = 5 - 3x_2 - 2x_4$ and $x_3 = 1 - 4x_4$.'
    anki_seeds:
      - front: 'A variable of a linear system is free when its column in echelon form...'
        back: 'contains no pivot.'
        type: basic
      - front: 'Number of free variables of a consistent system?'
        back: 'Number of variables minus number of pivot columns.'
        type: basic

  - id: computing-matrix-vector-products
    name: Matrix-Vector Products
    core: true
    difficulty: 0.55
    drill: false
    answer_kind: expression
    expected_time_secs: 90
    prerequisites:
      - id: computing-dot-products
        weight: 0.6
        key: true
      - id: vector-arithmetic
        weight: 0.5
      - id: augmented-matrix-representation
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: Computing Ax for square matrices
        key_prerequisites: [computing-dot-products]
        step_check:
          step: 'First entry (row 1)'
          question: 'Why is the first entry of $A\mathbf{x}$ computed from row 1 only?'
          options:
            - 'Row 1 is the only row that contains the first variable of the system'
            - 'The first entry is the sum of the first row of $A$ and the vector $\mathbf{x}$'
            - 'The rows are used in turn, and the order of the rows does not matter'
            - 'Entry $i$ of the product uses row $i$ of $A$, so row 1 gives entry 1'
          answer: 'Entry $i$ of the product uses row $i$ of $A$, so row 1 gives entry 1'
          why: 'Each row of $A$ produces exactly one entry of $A\mathbf{x}$, in the same order as the rows.'
        exemplars:
          - problem: 'Compute $A\mathbf{x}$ for $A = \begin{pmatrix}1&2\\3&4\end{pmatrix}$ and $\mathbf{x} = (5, 6)$.'
            answer: '(17, 39)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'Each entry is the dot product of a row of $A$ with $\mathbf{x}$: row 1 gives $1 \cdot 5 + 2 \cdot 6 = 17$; row 2 gives $3 \cdot 5 + 4 \cdot 6 = 39$. The product is $(17, 39)$.'
          - problem: 'Compute $A\mathbf{x}$ for $A = \begin{pmatrix}2&-1\\0&3\end{pmatrix}$ and $\mathbf{x} = (1, 4)$.'
            answer: '(-2, 12)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'Each entry is the dot product of a row of $A$ with $\mathbf{x}$: row 1 gives $2 \cdot 1 + (-1) \cdot 4 = -2$; row 2 gives $0 \cdot 1 + 3 \cdot 4 = 12$. The product is $(-2, 12)$.'
          - problem: 'Compute $A\mathbf{x}$ for $A = \begin{pmatrix}2&0&-1\\1&3&2\\0&4&1\end{pmatrix}$ and $\mathbf{x} = (3, -1, 2)$.'
            answer: '(4, 4, -2)'
            answer_contract: {"kind":"coordinates","arity":3}
            solution_sketch: 'Each entry is the dot product of a row of $A$ with $\mathbf{x}$: row 1 gives $2 \cdot 3 + 0 \cdot (-1) + (-1) \cdot 2 = 4$; row 2 gives $1 \cdot 3 + 3 \cdot (-1) + 2 \cdot 2 = 4$; row 3 gives $0 \cdot 3 + 4 \cdot (-1) + 1 \cdot 2 = -2$. The product is $(4, 4, -2)$.'
          - problem: 'The rows of $A = \begin{pmatrix}3&2&1\\1&4&2\\0&5&6\end{pmatrix}$ give the numbers of shirts, hats and scarves in the deliveries to three stores. A shirt is worth $12$ dollars, a hat $8$ dollars and a scarf $5$ dollars, so $\mathbf{x} = (12, 8, 5)$. Find $A\mathbf{x}$, the value of each delivery.'
            answer: '(57, 54, 70)'
            answer_contract: {"kind":"coordinates","arity":3}
            solution_sketch: 'Each entry is the value of one delivery, the dot product of a row of $A$ with the prices: row 1 gives $3 \cdot 12 + 2 \cdot 8 + 1 \cdot 5 = 57$; row 2 gives $1 \cdot 12 + 4 \cdot 8 + 2 \cdot 5 = 54$; row 3 gives $0 \cdot 12 + 5 \cdot 8 + 6 \cdot 5 = 70$. The values are $(57, 54, 70)$ dollars.'
          - problem: 'The rows of $A = \begin{pmatrix}2&1\\3&2\end{pmatrix}$ give the numbers of coffees and muffins in two orders at a cafe. A coffee costs $3$ dollars and a muffin costs $4$ dollars, so $\mathbf{x} = (3, 4)$. Find $A\mathbf{x}$, the cost of each order.'
            answer: '(10, 17)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'Each entry is the cost of one order: row 1 gives $2 \cdot 3 + 1 \cdot 4 = 10$; row 2 gives $3 \cdot 3 + 2 \cdot 4 = 17$. The costs are $(10, 17)$ dollars.'
          - problem: 'The matrix $A = \begin{pmatrix}3&2\\-1&5\end{pmatrix}$ sends every point $\mathbf{x}$ to the point $A\mathbf{x}$. Where does it send the point $(-2, 4)$?'
            answer: '(2, 22)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'The image of $(-2, 4)$ is $A\mathbf{x}$, found row by row: row 1 gives $3 \cdot (-2) + 2 \cdot 4 = 2$; row 2 gives $-1 \cdot (-2) + 5 \cdot 4 = 22$. The point goes to $(2, 22)$.'
          - problem: 'Compute $A\mathbf{x}$ for $A = \begin{pmatrix}-2&3\\4&-1\end{pmatrix}$ and $\mathbf{x} = (2, 5)$.'
            answer: '(11, 3)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'Each entry is the dot product of a row of $A$ with $\mathbf{x}$: row 1 gives $-2 \cdot 2 + 3 \cdot 5 = 11$; row 2 gives $4 \cdot 2 + (-1) \cdot 5 = 3$. The product is $(11, 3)$.'
        constraints: 'integer entries in -5..12; sizes 2x2 and 3x3; four bare products and three in-context products (cost tables and a transformation)'
      - id: kp2
        name: Rectangular matrix-vector products
        key_prerequisites: [computing-dot-products]
        step_check:
          step: 'Check the sizes'
          question: 'Why must $\mathbf{x}$ have as many entries as $A$ has columns?'
          options:
            - 'The result has one entry for each column of $A$, so the two counts must agree here'
            - 'Each row of $A$ is paired with $\mathbf{x}$ entry by entry, so the lengths agree'
            - 'A product is defined only when the matrix is square, so the sizes must match here'
            - 'The vector must be shorter than the rows so that no entry is paired twice over'
          answer: 'Each row of $A$ is paired with $\mathbf{x}$ entry by entry, so the lengths agree'
          why: 'A dot product pairs the entries one by one, so a row with $2$ entries needs a vector with $2$ entries.'
        exemplars:
          - problem: 'Compute $A\mathbf{x}$ for $A = \begin{pmatrix}2&0&1\\1&1&0\end{pmatrix}$ and $\mathbf{x} = (1, 2, 3)$.'
            answer: '(5, 3)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'The vector has as many entries as $A$ has columns, so the product is defined and has one entry per row of $A$: row 1 gives $2 \cdot 1 + 0 \cdot 2 + 1 \cdot 3 = 5$; row 2 gives $1 \cdot 1 + 1 \cdot 2 + 0 \cdot 3 = 3$. The product is $(5, 3)$.'
          - problem: 'Compute $A\mathbf{x}$ for $A = \begin{pmatrix}1&0\\2&1\\0&3\end{pmatrix}$ and $\mathbf{x} = (2, 5)$.'
            answer: '(2, 9, 15)'
            answer_contract: {"kind":"coordinates","arity":3}
            solution_sketch: 'The vector has as many entries as $A$ has columns, so the product is defined and has one entry per row of $A$: row 1 gives $1 \cdot 2 + 0 \cdot 5 = 2$; row 2 gives $2 \cdot 2 + 1 \cdot 5 = 9$; row 3 gives $0 \cdot 2 + 3 \cdot 5 = 15$. The product is $(2, 9, 15)$.'
          - problem: 'Compute $A\mathbf{x}$ for $A = \begin{pmatrix}3&0&2\\1&4&-1\end{pmatrix}$ and $\mathbf{x} = (2, 1, 3)$.'
            answer: '(12, 3)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'The vector has as many entries as $A$ has columns, so the product is defined and has one entry per row of $A$: row 1 gives $3 \cdot 2 + 0 \cdot 1 + 2 \cdot 3 = 12$; row 2 gives $1 \cdot 2 + 4 \cdot 1 + (-1) \cdot 3 = 3$. The product is $(12, 3)$.'
          - problem: 'Compute $A\mathbf{x}$ for $A = \begin{pmatrix}1&2\\0&3\\4&-1\end{pmatrix}$ and $\mathbf{x} = (5, 2)$.'
            answer: '(9, 6, 18)'
            answer_contract: {"kind":"coordinates","arity":3}
            solution_sketch: 'The vector has as many entries as $A$ has columns, so the product is defined and has one entry per row of $A$: row 1 gives $1 \cdot 5 + 2 \cdot 2 = 9$; row 2 gives $0 \cdot 5 + 3 \cdot 2 = 6$; row 3 gives $4 \cdot 5 + (-1) \cdot 2 = 18$. The product is $(9, 6, 18)$.'
          - problem: 'The matrix $A$ has $4$ rows and $3$ columns, and the vector $\mathbf{x}$ has $3$ entries. How many entries does $A\mathbf{x}$ have?'
            answer: '4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The $3$ entries of $\mathbf{x}$ match the $3$ columns of $A$, so the product is defined. Each of the $4$ rows of $A$ gives one entry, so $A\mathbf{x}$ has $4$ entries.'
          - problem: 'The matrix $A$ is $2 \times 3$ and $\mathbf{x} = (1, 2)$. Is the product $A\mathbf{x}$ defined?'
            answer: 'no'
            answer_contract: {"kind":"label","options":[["no","not defined","it is not defined","undefined"],["yes","defined","it is defined"]]}
            solution_sketch: 'Each row of $A$ has $3$ entries, so it must be paired with a vector of $3$ entries. The vector $\mathbf{x}$ has only $2$ entries, so the product is not defined.'
          - problem: 'The rows of $A = \begin{pmatrix}4&2&6\\1&5&2\end{pmatrix}$ give the grams of protein and of fat in one serving of each of three foods. A meal has $2$, $3$ and $1$ servings of the three foods, so $\mathbf{x} = (2, 3, 1)$. Find $A\mathbf{x}$, the protein and the fat in the meal.'
            answer: '(20, 19)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'Each entry is the total of one nutrient in the meal: row 1 gives $4 \cdot 2 + 2 \cdot 3 + 6 \cdot 1 = 20$; row 2 gives $1 \cdot 2 + 5 \cdot 3 + 2 \cdot 1 = 19$. The meal has $20$ g of protein and $19$ g of fat, so $A\mathbf{x} = (20, 19)$.'
          - problem: 'The rows of $A = \begin{pmatrix}10&20\\5&30\\0&12\end{pmatrix}$ give the numbers of hardcover and paperback books in the stock of three bookstores. A hardcover book costs $15$ dollars and a paperback costs $8$ dollars, so $\mathbf{x} = (15, 8)$. Find $A\mathbf{x}$, the value of the stock of each store.'
            answer: '(310, 315, 96)'
            answer_contract: {"kind":"coordinates","arity":3}
            solution_sketch: 'Each entry is the value of one store: row 1 gives $10 \cdot 15 + 20 \cdot 8 = 310$; row 2 gives $5 \cdot 15 + 30 \cdot 8 = 315$; row 3 gives $0 \cdot 15 + 12 \cdot 8 = 96$. The values are $(310, 315, 96)$ dollars.'
          - problem: 'Compute $A\mathbf{x}$ for $A = \begin{pmatrix}1&-2&0\\3&1&4\end{pmatrix}$ and $\mathbf{x} = (-1, 2, -3)$.'
            answer: '(-5, -13)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'The vector has $3$ entries and $A$ has $3$ columns, so the product has $2$ entries: row 1 gives $1 \cdot (-1) + (-2) \cdot 2 + 0 \cdot (-3) = -5$; row 2 gives $3 \cdot (-1) + 1 \cdot 2 + 4 \cdot (-3) = -13$. The product is $(-5, -13)$.'
        constraints: 'the vector length must match the number of columns; sizes 2x3 and 3x2; includes two items on size and whether the product is defined; two word problems'
      - id: kp3
        name: Ax as a combination of columns
        key_prerequisites: [computing-dot-products, vector-arithmetic]
        step_check:
          step: 'Scale each column'
          question: 'Why is the first column scaled by $4$ and the second by $2$?'
          options:
            - 'The weights are the entries of $\mathbf{x}$, taken in order'
            - 'The weights are the entries of the first row of $A$, taken in order'
            - 'The weights are chosen so that the two columns get the same length'
            - 'The weights are the sums of the entries in each column of $A$'
          answer: 'The weights are the entries of $\mathbf{x}$, taken in order'
          why: 'The product $A\mathbf{x}$ is the combination of the columns of $A$ whose weights are the entries of $\mathbf{x}$.'
        try_first:
          problem: 'A scoop of powder P holds $4$ g of protein and a scoop of powder Q holds $1$ g of protein. How many grams of protein are in $2$ scoops of P and $3$ scoops of Q?'
          answer_contract: {"kind":"exact"}
          answer: '11'
          reveal: 'Each scoop count multiplies the amount from its own powder, and the results add: $2 \cdot 4 + 3 \cdot 1 = 11$. A matrix-vector product adds weighted columns in just this way.'
        exemplars:
          - problem: 'For $A = \begin{pmatrix}2&1\\1&3\end{pmatrix}$ and $\mathbf{x} = (3, -1)$, write $A\mathbf{x}$ as a combination of the columns of $A$ and compute it.'
            answer: '(5, 0)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'The columns of $A$ are $\mathbf{a}_1 = (2, 1)$ and $\mathbf{a}_2 = (1, 3)$, and the entries of $\mathbf{x}$ are the weights. So $A\mathbf{x} = 3(2, 1) + (-1)(1, 3) = (6, 3) + (-1, -3) = (5, 0)$.'
          - problem: 'Compute $A\mathbf{x}$ for $A = \begin{pmatrix}1&2\\0&1\end{pmatrix}$ and $\mathbf{x} = (2, 3)$ by taking the columns of $A$ with weights $2$ and $3$.'
            answer: '(8, 3)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'The columns are $(1, 0)$ and $(2, 1)$. So $A\mathbf{x} = 2(1, 0) + 3(2, 1) = (2, 0) + (6, 3) = (8, 3)$.'
          - problem: 'Let $A$ be the matrix with columns $\mathbf{a}_1 = (2, 1)$ and $\mathbf{a}_2 = (0, 3)$. Find $A\mathbf{x}$ for $\mathbf{x} = (4, -2)$.'
            answer: '(8, -2)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'The entries of $\mathbf{x}$ weight the columns, so $A\mathbf{x} = 4(2, 1) + (-2)(0, 3) = (8, 4) + (0, -6) = (8, -2)$.'
          - problem: 'For $A = \begin{pmatrix}0&2\\3&1\end{pmatrix}$ and $\mathbf{x} = (5, -4)$, compute $A\mathbf{x}$ as $5\mathbf{a}_1 - 4\mathbf{a}_2$.'
            answer: '(-8, 11)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'The columns are $\mathbf{a}_1 = (0, 3)$ and $\mathbf{a}_2 = (2, 1)$. So $A\mathbf{x} = 5(0, 3) + (-4)(2, 1) = (0, 15) + (-8, -4) = (-8, 11)$.'
          - problem: 'What is $A\mathbf{x}$ for $A = \begin{pmatrix}3&5\\2&7\end{pmatrix}$ and $\mathbf{x} = (0, 1)$?'
            answer: '(5, 7)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'The weights $0$ and $1$ keep only the second column of $A$. So $A\mathbf{x} = 0(3, 2) + 1(5, 7) = (5, 7)$.'
          - problem: 'Compute $A\mathbf{x}$ for $A = \begin{pmatrix}1&0\\2&1\\0&3\end{pmatrix}$ and $\mathbf{x} = (2, -1)$ using the columns of $A$.'
            answer: '(2, 3, -3)'
            answer_contract: {"kind":"coordinates","arity":3}
            solution_sketch: 'The columns are $(1, 2, 0)$ and $(0, 1, 3)$. So $A\mathbf{x} = 2(1, 2, 0) + (-1)(0, 1, 3) = (2, 4, 0) + (0, -1, -3) = (2, 3, -3)$.'
          - problem: 'One serving of oats has $5$ g of protein and $2$ g of fiber, and one serving of lentils has $9$ g of protein and $4$ g of fiber. Dev eats $3$ servings of oats and $2$ servings of lentils. What are his totals of protein and fiber, written as the vector (protein, fiber)?'
            answer: '(33, 14)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'The two servings are the columns $(5, 2)$ and $(9, 4)$, weighted by $3$ and $2$. So the totals are $3(5, 2) + 2(9, 4) = (15, 6) + (18, 8) = (33, 14)$.'
          - problem: 'A truck trip to depot 1 uses $2$ liters of diesel and takes $3$ hours, and a trip to depot 2 uses $1$ liter and takes $2$ hours. In one week the truck makes $4$ trips to depot 1 and $3$ trips to depot 2. What are the totals of diesel and time, written as the vector (liters, hours)?'
            answer: '(11, 18)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'The trips are the columns $(2, 3)$ and $(1, 2)$, weighted by $4$ and $3$. So the totals are $4(2, 3) + 3(1, 2) = (8, 12) + (3, 6) = (11, 18)$.'
        constraints: '2x2 and 3x2 matrices; the column view and the row view give the same product; two word problems with two quantities per item'
    diagnostic_exemplar:
      problem: 'Compute $A\mathbf{x}$ for $A = \begin{pmatrix}2&1&0\\1&0&3\end{pmatrix}$ and $\mathbf{x} = (4, -1, 2)$.'
      answer: '(7, 10)'
      answer_contract: {"kind":"coordinates","arity":2}
      solution_sketch: 'Row by row: $8 - 1 + 0 = 7$ and $4 + 0 + 6 = 10$. As columns: $4(2, 1) - (1, 0) + 2(0, 3) = (7, 10)$.'
    anki_seeds:
      - front: '$A\mathbf{x}$ equals which combination of the columns of $A$?'
        back: 'The linear combination of the columns with the entries of $\mathbf{x}$ as weights.'
        type: basic
      - front: 'For $A\mathbf{x}$ to be defined, the length of $\mathbf{x}$ must equal...'
        back: 'the number of columns of $A$.'
        type: basic

  - id: matrix-vector-equations
    name: Matrix and Vector Equations
    core: true
    difficulty: 0.6
    drill: false
    answer_kind: numeric
    expected_time_secs: 150
    prerequisites:
      - id: computing-matrix-vector-products
        weight: 0.7
        key: true
      - id: row-reduction-echelon-forms
        weight: 0.6
        key: true
      - id: linear-combinations-of-vectors
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: Systems as Ax = b and as vector equations
        key_prerequisites: [computing-matrix-vector-products, row-reduction-echelon-forms]
        step_check:
          step: 'the equation reads $x\mathbf{a}_1 + y\mathbf{a}_2 = \mathbf{b}$'
          question: 'Why does $A\mathbf{x} = \mathbf{b}$ turn into $x\mathbf{a}_1 + y\mathbf{a}_2 = \mathbf{b}$?'
          options:
            - 'The product $A\mathbf{x}$ adds the rows of $A$, each one scaled by an entry of $\mathbf{x}$'
            - 'The product $A\mathbf{x}$ adds the columns of $A$, each scaled by an entry of $\mathbf{x}$'
            - 'The product $A\mathbf{x}$ multiplies the columns of $A$ together, entry by entry'
            - 'The unknowns $x$ and $y$ are moved from the right side to the left side'
          answer: 'The product $A\mathbf{x}$ adds the columns of $A$, each scaled by an entry of $\mathbf{x}$'
          why: 'Each unknown multiplies one column of $A$, so $A\mathbf{x}$ is the sum of the columns scaled by $x$ and $y$. Setting this sum equal to $\mathbf{b}$ gives the vector equation.'
        exemplars:
          - problem: 'Write the system $2x + 3y = 7$, $x - y = 1$ as a matrix equation $A\mathbf{x} = \mathbf{b}$. What is the coefficient matrix $A$?'
            answer: '[[2,3],[1,-1]]'
            answer_contract: {"kind":"matrix","rows":2,"cols":2}
            solution_sketch: 'The coefficients of $x$ form the first column of $A$ and the coefficients of $y$ form the second column. Row 1 holds $2$ and $3$, and row 2 holds $1$ and $-1$, so $A = \begin{pmatrix}2&3\\1&-1\end{pmatrix}$.'
          - problem: 'Find the scalars $c_1$ and $c_2$ for which $c_1(1, 2) + c_2(2, 1) = (4, 5)$.'
            answer: '(2, 1)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'Compare components: $c_1 + 2c_2 = 4$ and $2c_1 + c_2 = 5$. Subtracting twice the first equation from the second gives $-3c_2 = -3$, so $c_2 = 1$ and then $c_1 = 2$. Check: $2(1, 2) + 1(2, 1) = (4, 5)$.'
          - problem: 'Pump P adds $2$ L of water and $1$ L of salt per minute to a tank, and pump Q adds $1$ L of water and $3$ L of salt per minute. After some time the tank has received $7$ L of water and $11$ L of salt. For how many minutes did P and Q run?'
            answer: '(2, 3)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'Let P run for $x$ minutes and Q for $y$ minutes. Water gives $2x + y = 7$ and salt gives $x + 3y = 11$, which is the vector equation $x(2, 1) + y(1, 3) = (7, 11)$. Eliminating $x$ gives $-5y = -15$, so $y = 3$ and $x = 2$.'
          - problem: 'The vector equation $x\begin{pmatrix}1\\2\end{pmatrix} + y\begin{pmatrix}-1\\3\end{pmatrix} = \begin{pmatrix}4\\1\end{pmatrix}$ is written as $A\mathbf{x} = \mathbf{b}$. What is $A$?'
            answer: '[[1,-1],[2,3]]'
            answer_contract: {"kind":"matrix","rows":2,"cols":2}
            solution_sketch: 'The matrix $A$ has the vectors that multiply $x$ and $y$ as its columns. The first column is $(1, 2)$ and the second column is $(-1, 3)$, so $A = \begin{pmatrix}1&-1\\2&3\end{pmatrix}$.'
          - problem: 'A shop packs pens and pencils into small and large boxes. A small box holds $3$ pens and $2$ pencils, and a large box holds $5$ pens and $6$ pencils. The shop packs exactly $31$ pens and $26$ pencils with nothing left over. How many small and large boxes does it use?'
            answer: '(7, 2)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'Let $s$ be the number of small boxes and $l$ the number of large boxes. Pens give $3s + 5l = 31$ and pencils give $2s + 6l = 26$. From the second equation $s = 13 - 3l$, and then $39 - 9l + 5l = 31$ gives $l = 2$ and $s = 7$.'
          - problem: 'Write the system $x + 2z = 5$, $y - z = 1$, $3x + y = 4$ as a matrix equation $A\mathbf{x} = \mathbf{b}$. What is $A$?'
            answer: '[[1,0,2],[0,1,-1],[3,1,0]]'
            answer_contract: {"kind":"matrix","rows":3,"cols":3}
            solution_sketch: 'Use the unknowns in the order $x, y, z$ and write a $0$ where a variable is missing from an equation. The rows of $A$ are $(1, 0, 2)$, $(0, 1, -1)$ and $(3, 1, 0)$.'
          - problem: 'Sam writes the system $x + 4y = 3$, $2x + 5y = 6$ with the coefficient matrix $A = \begin{pmatrix}1&2\\4&5\end{pmatrix}$. What is the correct matrix $A$?'
            answer: '[[1,4],[2,5]]'
            answer_contract: {"kind":"matrix","rows":2,"cols":2}
            solution_sketch: 'Each row of $A$ holds the coefficients of one equation. Sam wrote the coefficients by columns instead of by rows. The first equation gives the row $(1, 4)$ and the second gives the row $(2, 5)$.'
        constraints: "integer coefficient vectors; combination coefficients in -7..7"
      - id: kp2
        name: Membership in a span via a system
        key_prerequisites: [computing-matrix-vector-products, row-reduction-echelon-forms]
        try_first:
          problem: 'Is $(1, 1, 1)$ a linear combination of $(1, 0, 0)$ and $(0, 1, 0)$?'
          answer_contract: {"kind":"label","options":[["yes","it is","yes, it is"],["no","it is not"]]}
          answer: 'no'
          reveal: 'Every combination $c_1(1, 0, 0) + c_2(0, 1, 0)$ has third component $0$, so $(1, 1, 1)$ cannot be reached. A vector is in the span only when all of its components can match at once.'
        step_check:
          step: 'Check the third component with these values'
          question: 'Why must the third component be checked after $c_1$ and $c_2$ come from the first two?'
          options:
            - 'The third component decides which of the two vectors gets the larger coefficient'
            - 'The first two components are not enough to compute both $c_1$ and $c_2$'
            - 'Two coefficients are already fixed, so the third equation must hold as well'
            - 'The check is optional, because two equations always have a solution'
          answer: 'Two coefficients are already fixed, so the third equation must hold as well'
          why: 'Three components give three equations for only two unknowns. If the third equation fails for the forced values of $c_1$ and $c_2$, the vector is not in the span.'
        exemplars:
          - problem: 'Find the scalars $c_1$ and $c_2$ for which $c_1(1, 0, 1) + c_2(0, 1, 1) = (1, 2, 3)$.'
            answer: '(1, 2)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'The first component gives $c_1 = 1$ and the second gives $c_2 = 2$. The third component then reads $1 + 2 = 3$, which matches, so the coefficients are $(1, 2)$.'
          - problem: 'Is $(2, 1, 4)$ in the span of $(1, 0, 2)$ and $(0, 1, 1)$?'
            answer: 'no'
            answer_contract: {"kind":"label","options":[["yes","it is","yes, it is","in the span"],["no","it is not","no, it is not","not in the span","out"]]}
            solution_sketch: 'The first two components force $c_1 = 2$ and $c_2 = 1$. The third component of $2(1, 0, 2) + 1(0, 1, 1)$ is $4 + 1 = 5$, which is not $4$, so the system is inconsistent and the vector is not in the span.'
          - problem: 'Is $(2, -1, 1)$ in the span of $(1, 0, 2)$ and $(0, 1, 3)$?'
            answer: 'yes'
            answer_contract: {"kind":"label","options":[["yes","it is","yes, it is","in the span","in"],["no","it is not","no, it is not","not in the span","out"]]}
            solution_sketch: 'The first two components force $c_1 = 2$ and $c_2 = -1$. The third component of $2(1, 0, 2) - 1(0, 1, 3)$ is $4 - 3 = 1$, which matches, so the vector is in the span.'
          - problem: 'Fertilizer A supplies $1$ kg of nitrogen, $0$ kg of phosphorus and $2$ kg of potassium per bag. Fertilizer B supplies $0$ kg, $1$ kg and $3$ kg per bag. A farmer needs exactly $4$ kg of nitrogen, $3$ kg of phosphorus and $17$ kg of potassium. How many bags of A and of B does the farmer use?'
            answer: '(4, 3)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'Let the farmer use $c_1$ bags of A and $c_2$ bags of B. Nitrogen gives $c_1 = 4$ and phosphorus gives $c_2 = 3$. Potassium then needs $2(4) + 3(3) = 17$, which matches, so the farmer uses $4$ bags of A and $3$ bags of B.'
          - problem: 'Pill P gives $1$ mg of vitamin A, $0$ mg of vitamin B and $1$ mg of vitamin C. Pill Q gives $0$ mg, $1$ mg and $1$ mg. A patient takes pills of these two types and needs exactly $4$ mg of A and $3$ mg of B. How many mg of C does the patient receive?'
            answer: '7'
            answer_contract: {"kind":"unit","quantity":"mass","unit":"mg","allow_omitted":true}
            solution_sketch: 'The amounts of A and B fix the pills: $4$ of P and $3$ of Q. Each pill of either type gives $1$ mg of C, so the patient receives $4 + 3 = 7$ mg of C.'
          - problem: 'For which value of $h$ is $(4, -3, h)$ in the span of $(1, 0, -2)$ and $(0, 1, 5)$?'
            answer: '-23'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The first two components force $c_1 = 4$ and $c_2 = -3$. The third component of the combination is $-2(4) + 5(-3) = -8 - 15 = -23$, so $h = -23$.'
          - problem: 'Let $\mathbf{a}_1 = (1, 0, 4)$, $\mathbf{a}_2 = (0, 1, -1)$ and $\mathbf{b} = (3, 2, 10)$. Find the scalars $c_1$ and $c_2$ with $c_1\mathbf{a}_1 + c_2\mathbf{a}_2 = \mathbf{b}$.'
            answer: '(3, 2)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'The first component gives $c_1 = 3$ and the second gives $c_2 = 2$. The third component checks: $4(3) - 2 = 10$. So the coefficients are $(3, 2)$.'
        constraints: "2 vectors in R^3 with the first two components forcing the coefficients; answer verifiable in one line"
      - id: kp3
        name: Solving Ax = b by row reduction
        key_prerequisites: [computing-matrix-vector-products, row-reduction-echelon-forms]
        step_check:
          step: 'replace $R_2$ with $R_2 - 3R_1$'
          question: 'Why does the row operation $R_2 - 3R_1$ use the multiplier $3$?'
          options:
            - 'It makes the first entry of row 2 zero, since $3 - 3 \cdot 1 = 0$'
            - 'It makes the second entry of row 2 equal to zero, below the second pivot'
            - 'It is the number of rows of the augmented matrix, used as a fixed multiplier'
            - 'It is the last number on the right side of the system, taken from $\mathbf{b}$'
          answer: 'It makes the first entry of row 2 zero, since $3 - 3 \cdot 1 = 0$'
          why: 'The first entry of row 2 is $3$ and the pivot in row 1 is $1$. Subtracting $3$ times row 1 turns that entry into $0$, which leaves an equation with one unknown.'
        exemplars:
          - problem: 'Solve $A\mathbf{x} = \mathbf{b}$ for $A = \begin{pmatrix}1&1\\1&-1\end{pmatrix}$ and $\mathbf{b} = (4, 2)$.'
            answer: '(3, 1)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'The equations are $x + y = 4$ and $x - y = 2$. Adding them gives $2x = 6$, so $x = 3$, and then $y = 4 - 3 = 1$.'
          - problem: 'Solve $\begin{pmatrix}1&2\\2&3\end{pmatrix}\mathbf{x} = (4, 7)$.'
            answer: '(2, 1)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'Replace $R_2$ by $R_2 - 2R_1$ to get $-y = -1$, so $y = 1$. Back-substitution into $x + 2y = 4$ gives $x = 4 - 2 = 2$.'
          - problem: 'Three notebooks and two pens cost $12$ euros. One notebook and four pens cost $14$ euros. What is the price of one notebook and of one pen?'
            answer: '(2, 3)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'Let a notebook cost $n$ euros and a pen $p$ euros, so $3n + 2p = 12$ and $n + 4p = 14$. The second equation gives $n = 14 - 4p$, and then $42 - 12p + 2p = 12$ gives $p = 3$. So $n = 14 - 12 = 2$.'
          - problem: 'A taxi charges a fixed fee plus a price for each kilometer. A trip of $6$ km costs $13$ euros and a trip of $10$ km costs $21$ euros. What are the fixed fee and the price per kilometer?'
            answer: '(1, 2)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'Let the fee be $f$ and the price per kilometer be $r$, so $f + 6r = 13$ and $f + 10r = 21$. Subtracting gives $4r = 8$, so $r = 2$. Then $f = 13 - 12 = 1$.'
          - problem: 'Sam solves $3x + y = 11$, $2x - 2y = 10$ and gets $(4, 1)$. Find the correct solution of the system.'
            answer: '(4, -1)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'Substituting Sam''s pair into the first equation gives $12 + 1 = 13$, not $11$, so it is wrong. Divide the second equation by $2$ to get $x - y = 5$, so $x = y + 5$. Then $3(y + 5) + y = 11$ gives $4y = -4$, so $y = -1$ and $x = 4$.'
          - problem: 'Solve the system $x + y + z = 2$, $2x - y + z = 7$, $x + 2y - z = -6$.'
            answer: '(1, -2, 3)'
            answer_contract: {"kind":"coordinates","arity":3}
            solution_sketch: 'Add the first and third equations to get $2x + 3y = -4$, and add the second and third to get $3x + y = 1$. From the second of these $y = 1 - 3x$, so $2x + 3 - 9x = -4$ gives $x = 1$ and $y = -2$. The first equation then gives $z = 3$.'
          - problem: 'Solve $A\mathbf{x} = \mathbf{b}$ for $A = \begin{pmatrix}1&0&1\\0&2&1\\1&1&0\end{pmatrix}$ and $\mathbf{b} = (4, 7, 3)$.'
            answer: '(1, 2, 3)'
            answer_contract: {"kind":"coordinates","arity":3}
            solution_sketch: 'The equations are $x + z = 4$, $2y + z = 7$ and $x + y = 3$. From the first and third, $z = 4 - x$ and $y = 3 - x$. Then $2(3 - x) + 4 - x = 7$ gives $-3x = -3$, so $x = 1$, $y = 2$ and $z = 3$.'
        constraints: "unique integer solutions in -5..5; prices and rates up to 20"
    diagnostic_exemplar:
      problem: 'Express $\mathbf{b} = (3, 5)$ as a linear combination of $\mathbf{a}_1 = (1, 1)$ and $\mathbf{a}_2 = (1, -1)$.'
      answer: "b = 4a1 - 1a2 (c1 = 4, c2 = -1)"
      answer_contract: {kind: none}
      solution_sketch: '$c_1 + c_2 = 3$, $c_1 - c_2 = 5$; adding gives $c_1 = 4$, so $c_2 = -1$.'
    anki_seeds:
      - front: '$A\mathbf{x} = \mathbf{b}$ is consistent exactly when $\mathbf{b}$ lies in...'
        back: 'the span of the columns of $A$.'
        type: basic
      - front: 'The vector equation $c_1\mathbf{a}_1 + \cdots + c_n\mathbf{a}_n = \mathbf{b}$ has the same solutions as...'
        back: '$A\mathbf{x} = \mathbf{b}$ where the $\mathbf{a}_i$ are the columns of $A$.'
        type: basic

  - id: homogeneous-systems
    name: Homogeneous Systems
    core: true
    difficulty: 0.6
    drill: false
    answer_kind: numeric
    expected_time_secs: 150
    prerequisites:
      - id: solution-sets-free-variables
        weight: 0.7
        key: true
      - id: matrix-vector-equations
        weight: 0.5
    knowledge_points:
      - id: kp1
        name: The trivial solution
        key_prerequisites: [solution-sets-free-variables]
        step_check:
          step: 'the system is consistent no matter what'
          question: 'Why is a homogeneous system consistent for every choice of coefficients?'
          options:
            - 'Every equation is a multiple of the first equation, so only one is needed'
            - 'There are always more unknowns than equations, so a solution must always exist'
            - 'Setting all unknowns to $0$ makes each left side $0$, equal to the right side'
            - 'The equations always cancel when they are added, and that leaves a solution'
          answer: 'Setting all unknowns to $0$ makes each left side $0$, equal to the right side'
          why: 'Each left side is a sum of coefficients times the unknowns. With all unknowns equal to $0$ every left side is $0$, and every right side is $0$ too, so the zero vector always satisfies the system.'
        exemplars:
          - problem: 'Solve the homogeneous system $2x + y = 0$, $x - 3y = 0$.'
            answer: '(0, 0)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'The zero pair always satisfies a homogeneous system. Subtracting twice the second equation from the first gives $7y = 0$, so $y = 0$, and then $x - 3(0) = 0$ gives $x = 0$. The only solution is $(0, 0)$.'
          - problem: 'Does the system $5x + 2y = 0$, $x - y = 0$ have a solution?'
            answer: 'yes'
            answer_contract: {"kind":"label","options":[["yes","it is","yes, it does","it does","there is a solution"],["no","it is not","no, it does not","it does not","there is no solution"]]}
            solution_sketch: 'Both right sides are $0$, so the system is homogeneous. The pair $x = 0$, $y = 0$ gives $5(0) + 2(0) = 0$ and $0 - 0 = 0$, so a solution exists.'
          - problem: 'Does the system $x + y = 0$, $x + y = 1$ have the solution $(0, 0)$?'
            answer: 'no'
            answer_contract: {"kind":"label","options":[["yes","it is","yes, it does","it does"],["no","it is not","no, it does not","it does not","it is not a solution"]]}
            solution_sketch: 'The second equation is not homogeneous, because its right side is $1$. Substituting $x = 0$, $y = 0$ gives $0 + 0 = 0$, which is not $1$, so $(0, 0)$ is not a solution.'
          - problem: 'A tank receives two solutions at the rates $x$ and $y$ litres per minute. The amount of salt in the tank changes at $3x - y$ grams per minute and the amount of sugar at $2x + 4y$ grams per minute, and both amounts stay constant. Find $x$ and $y$.'
            answer: '(0, 0)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'Both amounts stay constant, so $3x - y = 0$ and $2x + 4y = 0$. The first gives $y = 3x$, and substituting into the second gives $14x = 0$, so $x = 0$ and $y = 0$. The only solution is $(0, 0)$.'
          - problem: 'A circuit has no battery. The currents $I_1$ and $I_2$ in amperes satisfy Kirchhoff''s equations $6I_1 + I_2 = 0$ and $I_1 + 5I_2 = 0$. Find $I_1$ and $I_2$.'
            answer: '(0, 0)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'Both equations are homogeneous. Multiplying the first by $5$ gives $30I_1 + 5I_2 = 0$, and subtracting the second gives $29I_1 = 0$, so $I_1 = 0$ and then $I_2 = 0$. With no battery there is no current, so the solution is $(0, 0)$.'
          - problem: 'Sam says that the system $2x + y = 0$, $4x + 2y = 0$ has no solution except $(0, 0)$. Find a solution with $x = 1$.'
            answer: '(1, -2)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'The second equation is twice the first, so the system has only one independent equation. The first equation gives $y = -2x$, so with $x = 1$ we get $y = -2$. Then $4(1) + 2(-2) = 0$ also holds, so $(1, -2)$ is a solution.'
          - problem: 'Solve the homogeneous system $x + y + z = 0$, $2x - y = 0$, $y + 3z = 0$.'
            answer: '(0, 0, 0)'
            answer_contract: {"kind":"coordinates","arity":3}
            solution_sketch: 'From the second equation $y = 2x$, and from the third $z = -y/3 = -2x/3$. The first equation becomes $x + 2x - 2x/3 = 0$, which is $7x/3 = 0$, so $x = 0$. Then $y = 0$ and $z = 0$, and the only solution is $(0, 0, 0)$.'
        constraints: "2x2 systems and one 3x3 system; emphasize that 0 always works"
      - id: kp2
        name: Nontrivial solutions in parametric form
        key_prerequisites: [solution-sets-free-variables]
        try_first:
          problem: 'A homogeneous system has the solution $(1, 2)$. Is $(3, 6)$ also a solution of the same system?'
          answer_contract: {"kind":"label","options":[["yes","it is","yes, it is"],["no","it is not"]]}
          answer: 'yes'
          reveal: 'Tripling a solution of a homogeneous system triples every left side $0$, which is still $0$. So one nonzero solution brings a whole line of solutions, and the parameter $t$ names them all.'
        step_check:
          step: 'Choose $z = t$'
          question: 'Why can the free variable $z$ be given any value, called $t$?'
          options:
            - 'The other variables are fixed by $z$, so one value of $z$ gives only one solution'
            - 'No equation of the system involves $z$, so its value does not matter'
            - 'The value of $z$ is always $0$, and $t$ is only another name for $0$'
            - 'Every choice of $z$ allows $x$ and $y$ to be found, so each $t$ gives a solution'
          answer: 'Every choice of $z$ allows $x$ and $y$ to be found, so each $t$ gives a solution'
          why: 'The two equations fix $x$ and $y$ once $z$ is chosen. Because the right sides are $0$, every choice of $z$ works, and so the solutions form the family $t(-1, 1, 1)$.'
        exemplars:
          - problem: 'Find all solutions of $x + 2y = 0$, $2x + 4y = 0$, taking $y = t$.'
            answer: '(-2t, t)'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The second equation is twice the first, so only $x + 2y = 0$ remains. With $y = t$ it gives $x = -2t$. The solutions are $(x, y) = (-2t, t)$.'
          - problem: 'Find all solutions of $x + y - z = 0$, $y + z = 0$, taking $z = t$.'
            answer: '(2t, -t, t)'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The second equation gives $y = -z = -t$. The first then gives $x = -y + z = t + t = 2t$. The solutions are $(x, y, z) = (2t, -t, t)$.'
          - problem: 'Iron burns in oxygen to give iron(III) oxide: $a\,\mathrm{Fe} + b\,\mathrm{O_2} \to c\,\mathrm{Fe_2O_3}$. Find the smallest whole numbers $a$, $b$ and $c$ that balance the equation.'
            answer: '(4, 3, 2)'
            answer_contract: {"kind":"coordinates","arity":3}
            solution_sketch: 'Balancing iron gives $a = 2c$, and balancing oxygen gives $2b = 3c$. Taking $c = t$ gives $(a, b, c) = t(2, 3/2, 1)$. The smallest whole numbers come from $t = 2$, which gives $(4, 3, 2)$.'
          - problem: 'Find all solutions of $2x - 6y = 0$, $-x + 3y = 0$, taking $y = t$.'
            answer: '(3t, t)'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The first equation is $-2$ times the second, so only $x - 3y = 0$ remains. With $y = t$ it gives $x = 3t$. The solutions are $(x, y) = (3t, t)$.'
          - problem: 'Propane burns in oxygen: $a\,\mathrm{C_3H_8} + b\,\mathrm{O_2} \to c\,\mathrm{CO_2} + d\,\mathrm{H_2O}$. Find the smallest whole numbers $a$, $b$, $c$ and $d$ that balance the equation.'
            answer: '(1, 5, 3, 4)'
            answer_contract: {"kind":"coordinates","arity":4}
            solution_sketch: 'Balancing carbon gives $c = 3a$, hydrogen gives $2d = 8a$ so $d = 4a$, and oxygen gives $2b = 2c + d = 10a$ so $b = 5a$. Taking $a = 1$ gives the smallest whole numbers $(1, 5, 3, 4)$.'
          - problem: 'Find all solutions of $x - 2y + z = 0$, $y - 3z = 0$, taking $z = t$.'
            answer: '(5t, 3t, t)'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The second equation gives $y = 3z = 3t$. The first gives $x = 2y - z = 6t - t = 5t$. The solutions are $(x, y, z) = (5t, 3t, t)$.'
          - problem: 'Is $(-6, 3, -3)$ a solution of the system $x + y - z = 0$, $y + z = 0$?'
            answer: 'yes'
            answer_contract: {"kind":"label","options":[["yes","it is","yes, it is","it does","it is a solution","yes, it is a solution"],["no","it is not","no, it is not","it is not a solution","not a solution","no, it is not a solution"]]}
            solution_sketch: 'Substitute into both equations. The first gives $-6 + 3 - (-3) = 0$ and the second gives $3 + (-3) = 0$. Both hold, so the point is a solution; it is $-3$ times the solution $(2, -1, 1)$.'
          - problem: 'A solution of a homogeneous system is $(1, 2, -1)$. What is the solution of the same system with $x = 3$ that lies on the same line through the origin?'
            answer: '(3, 6, -3)'
            answer_contract: {"kind":"coordinates","arity":3}
            solution_sketch: 'Multiplying a solution of a homogeneous system by a number gives another solution. To change $x$ from $1$ to $3$, multiply by $3$, which gives $(3, 6, -3)$.'
        constraints: "exactly one free variable named in the question; integer parametric coefficients"
      - id: kp3
        name: When nontrivial solutions exist
        key_prerequisites: [solution-sets-free-variables, matrix-vector-equations]
        step_check:
          step: 'the row reduction can produce at most $4$ pivots'
          question: 'Why can a system with $4$ equations have at most $4$ pivots?'
          options:
            - 'A pivot can only stand in one of the first $4$ columns, however many unknowns there are'
            - 'Each pivot lies in its own row, and the coefficient matrix has only $4$ rows'
            - 'The number of pivots is always equal to the number of unknowns, which is $6$'
            - 'Each equation must have two pivots for the row reduction to work'
          answer: 'Each pivot lies in its own row, and the coefficient matrix has only $4$ rows'
          why: 'A row has at most one pivot, and each pivot is in a different column. So the number of pivots cannot be larger than the number of rows, which equals the number of equations.'
        exemplars:
          - problem: 'A homogeneous system has $4$ equations and $7$ unknowns, and its coefficient matrix has $4$ pivots. How many free variables does the system have?'
            answer: '3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Each unknown is either a pivot variable or a free variable. The free variables number $7 - 4 = 3$.'
          - problem: 'A homogeneous system has $3$ equations and $5$ unknowns. Must it have a solution other than the trivial solution?'
            answer: 'yes'
            answer_contract: {"kind":"label","options":[["yes","it is","yes, it must","it must","a nonzero solution exists"],["no","no, it need not","it need not","not necessarily","not always","not guaranteed","no, not necessarily","no, not guaranteed"]]}
            solution_sketch: 'There are at most $3$ pivots, so at least $5 - 3 = 2$ unknowns are free. A free variable can take any value, so nonzero solutions exist.'
          - problem: 'A homogeneous system has $4$ equations and $3$ unknowns. Must it have a solution other than the trivial solution?'
            answer: 'no'
            answer_contract: {"kind":"label","options":[["yes","it is","yes, it must","it must","a nonzero solution exists"],["no","no, it need not","it need not","not necessarily","not always","not guaranteed","no, not necessarily","no, not guaranteed"]]}
            solution_sketch: 'There are at most $3$ pivots, but all $3$ unknowns can be pivot variables. Then no variable is free, and only the trivial solution is left. So a nonzero solution is not guaranteed.'
          - problem: 'A homogeneous system of $3$ equations in $3$ unknowns has a coefficient matrix with $3$ pivots. How many solutions does the system have?'
            answer: '1'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'All $3$ unknowns are pivot variables, so there are $3 - 3 = 0$ free variables. Then only the trivial solution exists, so the system has exactly $1$ solution.'
          - problem: 'A chemist balances a reaction with $6$ compounds and $4$ elements. This gives a homogeneous system of $4$ equations in $6$ unknowns. At least how many of the unknowns are free variables?'
            answer: '2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The system has at most $4$ pivots. The number of free variables is $6$ minus the number of pivots, so it is at least $6 - 4 = 2$.'
          - problem: 'An engineer''s model of a frame gives a homogeneous system of $8$ equations in $10$ unknowns. Row reduction shows only $6$ pivots, because two equations repeat others. How many free variables does the system have?'
            answer: '4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The free variables are the unknowns that are not pivot variables. Their number is $10 - 6 = 4$, so the solutions need $4$ parameters.'
          - problem: 'A homogeneous system of $6$ equations in $6$ unknowns has only the trivial solution. How many pivots does its coefficient matrix have?'
            answer: '6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Only the trivial solution means that no unknown is free. Every one of the $6$ unknowns is then a pivot variable, so the matrix has $6$ pivots.'
        constraints: "reason from pivot counts; no computation beyond counting"
    diagnostic_exemplar:
      problem: 'A homogeneous system in $x, y, z$ consists of the single equation $x + 3y - z = 0$. Must it have nonzero solutions? Give all solutions, taking $y = s$ and $z = t$.'
      answer: 'Yes (1 equation, 3 unknowns leaves free variables); x = -3s + t, y = s, z = t'
      answer_contract: {kind: none}
      solution_sketch: 'With more unknowns than equations there is at least one free variable, so nontrivial solutions exist; solving for the pivot variable gives $x = -3y + z$.'
    anki_seeds:
      - front: 'A homogeneous system $A\mathbf{x} = \mathbf{0}$ is always consistent because...'
        back: '$\mathbf{x} = \mathbf{0}$ (the trivial solution) always works.'
        type: basic
      - front: '$A\mathbf{x} = \mathbf{0}$ has nontrivial solutions exactly when...'
        back: 'the system has at least one free variable (fewer pivots than unknowns).'
        type: basic

  - id: polynomial-curve-fitting
    name: Fitting Curves with Linear Systems
    core: false                # applications leaf topic
    difficulty: 0.6
    drill: false
    answer_kind: numeric
    expected_time_secs: 180
    prerequisites:
      - id: row-reduction-echelon-forms
        weight: 0.7
        key: true
      - id: quadratic-graphs-vertex
        weight: 0.4
      - id: graphing-linear-equations
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: Lines through two points
        key_prerequisites: [row-reduction-echelon-forms, graphing-linear-equations]
        try_first:
          problem: 'A line $y = ax + b$ passes through $(0, 2)$ and $(1, 5)$. What is the slope $a$?'
          answer_contract: {"kind":"exact"}
          answer: '3'
          reveal: 'Each point gives one equation in $a$ and $b$: the point $(0, 2)$ gives $b = 2$, and the point $(1, 5)$ gives $a + b = 5$. Two points make two equations for the two unknowns, which is a linear system.'
        step_check:
          step: 'Subtract the first equation from the second'
          question: 'Why does subtracting $a + b = 1$ from $3a + b = 7$ leave an equation with only $a$?'
          options:
            - 'The subtraction removes the right-hand sides $1$ and $7$ from both of the two equations'
            - 'Both equations have $b$ with the same coefficient, so $b$ cancels in the difference'
            - 'The subtraction always removes the unknown that is written second in each equation'
            - 'The two points have the same height, so the $b$ terms are equal in size'
          answer: 'Both equations have $b$ with the same coefficient, so $b$ cancels in the difference'
          why: 'Every equation $y = ax + b$ has $b$ with coefficient $1$, so $b - b = 0$ in the difference. That leaves $2a = 6$, an equation in $a$ alone.'
        exemplars:
          - problem: 'Find the equation of the line $y = ax + b$ through $(1, 3)$ and $(2, 5)$.'
            answer: 'y = 2x + 1'
            answer_contract: {"kind":"polynomial_relation"}
            solution_sketch: 'The points give $a + b = 3$ and $2a + b = 5$. Subtracting the first equation from the second gives $a = 2$, and then $b = 3 - 2 = 1$. The line is $y = 2x + 1$.'
          - problem: 'The graph of $y = ax + b$ passes through $(-2, -1)$ and $(1, 8)$. What is the equation of the graph?'
            answer: 'y = 3x + 5'
            answer_contract: {"kind":"polynomial_relation"}
            solution_sketch: 'The points give $-2a + b = -1$ and $a + b = 8$. Subtracting the first from the second gives $3a = 9$, so $a = 3$, and then $b = 8 - 3 = 5$. The equation is $y = 3x + 5$.'
          - problem: 'A line $y = ax + b$ passes through $(0, 3)$ and $(1, 1)$. What are $a$ and $b$?'
            answer: '(-2, 3)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'The point $(0, 3)$ gives $b = 3$ at once. The point $(1, 1)$ gives $a + b = 1$, so $a = 1 - 3 = -2$. So $(a, b) = (-2, 3)$.'
          - problem: 'A plumber charges a fixed call-out fee plus a fixed price for each hour of work. A job of $2$ hours costs $110$ euros and a job of $5$ hours costs $245$ euros. Find a formula for the cost $C$ in euros of a job of $h$ hours.'
            answer: 'C = 45h + 20'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Write $C = ah + b$. The two jobs give $2a + b = 110$ and $5a + b = 245$. Subtracting gives $3a = 135$, so the price per hour is $a = 45$, and then $b = 110 - 90 = 20$. The formula is $C = 45h + 20$.'
          - problem: 'A tank holds $80$ L of water $2$ hours after noon and $50$ L of water $5$ hours after noon. Water drains out at a constant rate. Find a formula for the volume $V$ in litres at time $t$ hours after noon.'
            answer: 'V = -10t + 100'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Write $V = at + b$. The two readings give $2a + b = 80$ and $5a + b = 50$. Subtracting gives $3a = -30$, so $a = -10$, and then $b = 80 + 20 = 100$. The formula is $V = -10t + 100$.'
          - problem: 'A line $y = ax + b$ passes through $(-1, 4)$ and $(1, -2)$. What is its slope $a$?'
            answer: '-3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The points give $-a + b = 4$ and $a + b = -2$. Subtracting the first from the second gives $2a = -6$, so $a = -3$.'
          - problem: 'A tank holds $80$ L of water $2$ hours after noon and $50$ L of water $5$ hours after noon, and it drains at a constant rate. How many hours after noon is the tank empty?'
            answer: '10'
            answer_contract: {"kind":"unit","quantity":"time","unit":"hour","allow_omitted":true}
            solution_sketch: 'The volume at $t$ hours after noon is $V = -10t + 100$, because the tank loses $30$ L in $3$ hours, which is $10$ L per hour. The tank is empty when $V = 0$, so $t = 100 / 10 = 10$ hours.'
          - problem: 'Sam finds the line $y = ax + b$ through $(1, 3)$ and $(3, 7)$ and writes $y = 2x + 3$. Find the equation of the correct line.'
            answer: 'y = 2x + 1'
            answer_contract: {"kind":"polynomial_relation"}
            solution_sketch: 'Sam''s line gives $2(1) + 3 = 5$ at $x = 1$, not $3$, so it misses the first point. The points give $a + b = 3$ and $3a + b = 7$, so $2a = 4$ and $a = 2$. Then $b = 3 - 2 = 1$.'
        constraints: "integer sample points; a and b integers (rates and fees up to 100 in word problems)"
      - id: kp2
        name: Parabolas through three points
        key_prerequisites: [row-reduction-echelon-forms, quadratic-graphs-vertex]
        step_check:
          step: 'From $(0, 2)$: $a(0)^2 + b(0) + c = 2$, so $c = 2$'
          question: 'Why does the point $(0, 2)$ give the value of $c$ at once?'
          options:
            - 'At $x = 0$ the terms $ax^2$ and $bx$ are both zero, and only $c$ is left'
            - 'The point $(0, 2)$ is the vertex, and the height of the vertex is equal to $c$'
            - 'Any point with $y = 2$ gives $c = 2$, whatever its $x$-coordinate is'
            - 'The $x$-coordinate $0$ is the coefficient of $c$ in the equation'
          answer: 'At $x = 0$ the terms $ax^2$ and $bx$ are both zero, and only $c$ is left'
          why: 'When $x = 0$ both $ax^2$ and $bx$ vanish, so the equation reduces to $y = c$. The height at $x = 0$ is $c$ for every parabola, not only when that point is the vertex.'
        exemplars:
          - problem: 'Find the equation of the parabola $y = ax^2 + bx + c$ through $(0, 1)$, $(1, 2)$ and $(2, 5)$.'
            answer: 'y = x^2 + 1'
            answer_contract: {"kind":"polynomial_relation"}
            solution_sketch: 'The point $(0, 1)$ gives $c = 1$. The other points give $a + b = 1$ and $4a + 2b = 4$, which is $2a + b = 2$. Subtracting gives $a = 1$, so $b = 0$. The parabola is $y = x^2 + 1$.'
          - problem: 'Find the equation of the parabola $y = ax^2 + bx + c$ through $(1, 0)$, $(2, 3)$ and $(3, 8)$.'
            answer: 'y = x^2 - 1'
            answer_contract: {"kind":"polynomial_relation"}
            solution_sketch: 'The points give $a + b + c = 0$, $4a + 2b + c = 3$ and $9a + 3b + c = 8$. Subtracting neighboring equations gives $3a + b = 3$ and $5a + b = 5$. So $a = 1$, $b = 0$ and $c = -1$.'
          - problem: 'A ball is thrown upward. Its height $h$ in meters at time $t$ seconds is $h = at^2 + bt + c$. The ball is at height $2$ at $t = 0$, at height $7$ at $t = 1$ and at height $8$ at $t = 2$. Find the formula for $h$.'
            answer: 'h = -2t^2 + 7t + 2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The reading at $t = 0$ gives $c = 2$. The other readings give $a + b = 5$ and $4a + 2b = 6$, which is $2a + b = 3$. Subtracting gives $a = -2$, so $b = 7$. The formula is $h = -2t^2 + 7t + 2$.'
          - problem: 'A cable hangs between two towers in the shape $y = ax^2 + bx + c$, where $x$ is the distance in meters from the left tower and $y$ is the height in meters. The cable is $6$ m high at $x = 0$, $2$ m high at $x = 2$ and $6$ m high at $x = 4$. Find the equation of the cable.'
            answer: 'y = x^2 - 4x + 6'
            answer_contract: {"kind":"polynomial_relation"}
            solution_sketch: 'The height at $x = 0$ gives $c = 6$. The other heights give $4a + 2b = -4$ and $16a + 4b = 0$. The second gives $b = -4a$, so $4a - 8a = -4$ and $a = 1$, $b = -4$. The cable is $y = x^2 - 4x + 6$.'
          - problem: 'Find the equation of the parabola $y = ax^2 + bx + c$ through $(-1, 6)$, $(1, 2)$ and $(2, 3)$.'
            answer: 'y = x^2 - 2x + 3'
            answer_contract: {"kind":"polynomial_relation"}
            solution_sketch: 'The points give $a - b + c = 6$, $a + b + c = 2$ and $4a + 2b + c = 3$. Subtracting the first two gives $2b = -4$, so $b = -2$. Then $a + c = 4$ and $4a + c = 7$, so $3a = 3$, $a = 1$ and $c = 3$.'
          - problem: 'Find the equation of the parabola $y = ax^2 + bx + c$ through $(0, 2)$, $(1, 6)$ and $(2, 14)$.'
            answer: 'y = 2x^2 + 2x + 2'
            answer_contract: {"kind":"polynomial_relation"}
            solution_sketch: 'The point $(0, 2)$ gives $c = 2$. The other points give $a + b = 4$ and $4a + 2b = 12$, which is $2a + b = 6$. Subtracting gives $a = 2$, and then $b = 2$. The parabola is $y = 2x^2 + 2x + 2$.'
          - problem: 'Sam fits $y = ax^2 + bx + c$ to the points $(0, 1)$, $(1, 3)$ and $(2, 7)$ and writes $y = x^2 + 2x + 1$. Find the equation of the correct parabola.'
            answer: 'y = x^2 + x + 1'
            answer_contract: {"kind":"polynomial_relation"}
            solution_sketch: 'Sam''s formula gives $1 + 2 + 1 = 4$ at $x = 1$, not $3$. The correct system has $c = 1$, $a + b = 2$ and $4a + 2b = 6$, so $2a + b = 3$. Subtracting gives $a = 1$ and $b = 1$.'
          - problem: 'A parabola $y = ax^2 + bx + c$ passes through $(0, -3)$, $(1, 0)$ and $(3, 12)$. What is its equation?'
            answer: 'y = x^2 + 2x - 3'
            answer_contract: {"kind":"polynomial_relation"}
            solution_sketch: 'The point $(0, -3)$ gives $c = -3$. The other points give $a + b = 3$ and $9a + 3b = 15$, which is $3a + b = 5$. Subtracting gives $2a = 2$, so $a = 1$ and $b = 2$.'
        constraints: "integer sample points; integer coefficients of modest size (-3..7); include x = 0 among the points when possible"
      - id: kp3
        name: Fitting from mixed conditions
        key_prerequisites: [row-reduction-echelon-forms, quadratic-graphs-vertex]
        step_check:
          step: 'add the equations $a + b = 3$ and $a - b = 1$ to get $2a = 4$'
          question: 'Why does adding $a + b = 3$ and $a - b = 1$ leave an equation with only $a$?'
          options:
            - 'Adding always removes whichever unknown is written second in the equations'
            - 'The right-hand sides $3$ and $1$ cancel each other when they are added'
            - 'The terms $b$ and $-b$ are opposites, so they add to zero'
            - 'The second equation has coefficient zero for $a$, so only $b$ changes'
          answer: 'The terms $b$ and $-b$ are opposites, so they add to zero'
          why: 'The unknown $b$ has coefficients $1$ and $-1$, so the sum has no $b$ term and leaves $2a = 4$. This is the reason to add here and to subtract when the coefficients are equal.'
        exemplars:
          - problem: 'Find $y = ax^2 + bx + c$ with $y(0) = 1$, $y(1) = 0$ and $y(-1) = 4$.'
            answer: 'y = x^2 - 2x + 1'
            answer_contract: {"kind":"polynomial_relation"}
            solution_sketch: 'The condition $y(0) = 1$ gives $c = 1$. The others give $a + b = -1$ and $a - b = 3$. Adding gives $2a = 2$, so $a = 1$ and $b = -2$.'
          - problem: 'Find $y = ax^2 + bx + c$ with $y(0) = 0$, $y(2) = 6$ and $y(-1) = 3$.'
            answer: 'y = 2x^2 - x'
            answer_contract: {"kind":"polynomial_relation"}
            solution_sketch: 'The condition $y(0) = 0$ gives $c = 0$. The others give $4a + 2b = 6$, which is $2a + b = 3$, and $a - b = 3$. Adding gives $3a = 6$, so $a = 2$ and $b = -1$.'
          - problem: 'A quadratic $y = ax^2 + bx + c$ has $y(1) = 4$, $y(2) = 9$ and $y(3) = 18$. Find its equation.'
            answer: 'y = 2x^2 - x + 3'
            answer_contract: {"kind":"polynomial_relation"}
            solution_sketch: 'The conditions give $a + b + c = 4$, $4a + 2b + c = 9$ and $9a + 3b + c = 18$. Subtracting neighboring equations gives $3a + b = 5$ and $5a + b = 9$, so $a = 2$ and $b = -1$. Then $c = 3$.'
          - problem: 'A shop models its revenue $R$ in thousands of euros at a price $x$ in euros by $R = ax^2 + bx + c$. It earns nothing at $x = 0$, $40$ at $x = 1$ and $60$ at $x = 3$. Find the revenue model.'
            answer: 'R = -10x^2 + 50x'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The condition at $x = 0$ gives $c = 0$. The other conditions give $a + b = 40$ and $9a + 3b = 60$, which is $3a + b = 20$. Subtracting gives $2a = -20$, so $a = -10$ and $b = 50$.'
          - problem: 'A parabola $y = ax^2 + bx + c$ crosses the $x$-axis at $x = 1$ and at $x = 2$, and it crosses the $y$-axis at $y = 6$. Find its equation.'
            answer: 'y = 3x^2 - 9x + 6'
            answer_contract: {"kind":"polynomial_relation"}
            solution_sketch: 'The crossing of the $y$-axis gives $c = 6$. The crossings of the $x$-axis give $a + b + 6 = 0$ and $4a + 2b + 6 = 0$, which is $2a + b = -3$ and $a + b = -6$. Subtracting gives $a = 3$ and then $b = -9$.'
          - problem: 'A stone is dropped from a cliff. Its height $h$ in meters is $80$ at $t = 0$ s, $75$ at $t = 1$ s and $60$ at $t = 2$ s, and it follows $h = at^2 + bt + c$. Find the formula for $h$.'
            answer: 'h = -5t^2 + 80'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The reading at $t = 0$ gives $c = 80$. The other readings give $a + b = -5$ and $4a + 2b = -20$, which is $2a + b = -10$. Subtracting gives $a = -5$ and then $b = 0$.'
          - problem: 'A stone is dropped from a cliff. Its height $h$ in meters is $80$ at $t = 0$ s, $75$ at $t = 1$ s and $60$ at $t = 2$ s, and it follows $h = at^2 + bt + c$. After how many seconds does the stone reach the ground, where $h = 0$?'
            answer: '4'
            answer_contract: {"kind":"unit","quantity":"time","unit":"second","allow_omitted":true}
            solution_sketch: 'The three readings give $h = -5t^2 + 80$. The stone reaches the ground when $-5t^2 + 80 = 0$, so $t^2 = 16$. The time cannot be negative, so $t = 4$ seconds.'
          - problem: 'A quadratic $y = ax^2 + bx + c$ has $y(-1) = 6$, $y(1) = 0$ and $y(2) = 0$. Find its equation.'
            answer: 'y = x^2 - 3x + 2'
            answer_contract: {"kind":"polynomial_relation"}
            solution_sketch: 'The conditions give $a - b + c = 6$, $a + b + c = 0$ and $4a + 2b + c = 0$. Subtracting the first two gives $2b = -6$, so $b = -3$. Then $a + c = 3$ and $4a + c = 6$, so $a = 1$ and $c = 2$.'
        constraints: "conditions given as function values, x-intercepts or table readings; integer coefficients of modest size"
    diagnostic_exemplar:
      problem: 'Find the parabola $y = ax^2 + bx + c$ through $(0, 3)$, $(1, 2)$, and $(2, 5)$.'
      answer: 'y = 2x^2 - 3x + 3'
      solution_sketch: '$c = 3$; then $a + b = -1$ and $4a + 2b = 2$, so $a = 2$ and $b = -3$.'
    anki_seeds:
      - front: 'Fitting a degree-$n$ polynomial exactly through $n + 1$ points with distinct $x$-values sets up how many linear equations?'
        back: '$n + 1$ (one per point), in the $n + 1$ coefficients.'
        type: basic

  - id: linear-systems-applications
    name: Applications of Linear Systems
    core: false                # applications leaf topic
    difficulty: 0.65
    drill: false
    answer_kind: numeric
    expected_time_secs: 240
    prerequisites:
      - id: solution-sets-free-variables
        weight: 0.6
        key: true
      - id: row-reduction-echelon-forms
        weight: 0.6
        key: true
      - id: systems-word-problems
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: Network flow
        key_prerequisites: [solution-sets-free-variables]
        step_check:
          step: 'write a conservation equation for each junction'
          question: 'Why does each junction give an equation that sets the flow in equal to the flow out?'
          options:
            - 'Every road at a junction must carry exactly the same flow as the others'
            - 'Cars do not pile up or vanish at a junction, so what enters must leave'
            - 'The flows that enter must be larger than the flows that leave, so traffic keeps moving'
            - 'The unknown flows are always whole numbers, and an equal sign keeps them whole'
          answer: 'Cars do not pile up or vanish at a junction, so what enters must leave'
          why: 'A junction stores nothing, so the total flow in equals the total flow out. Each junction therefore gives one linear equation in the unknown flows.'
        exemplars:
          - problem: 'At junction $A$, $120$ cars per hour enter and split into the flows $x_1$ and $x_2$. At junction $B$, the flow $x_1$ and $40$ more cars per hour enter, and $90$ cars per hour leave. Find $x_1$ and $x_2$.'
            answer: '(50, 70)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'Junction $A$ gives $x_1 + x_2 = 120$ and junction $B$ gives $x_1 + 40 = 90$. The second equation gives $x_1 = 50$, and then the first gives $x_2 = 120 - 50 = 70$.'
          - problem: 'In a pipe network the flows in litres per minute satisfy $x_1 + x_2 = 80$ and $x_2 + x_3 = 50$, where $x_3 = 20$. Find $x_1$ and $x_2$.'
            answer: '(50, 30)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'Substituting $x_3 = 20$ into the second equation gives $x_2 = 50 - 20 = 30$. The first equation then gives $x_1 = 80 - 30 = 50$.'
          - problem: 'At junction $A$, $150$ litres per minute enter and split into the flows $x_1 = 60$ and $x_2 = 90$. At junction $B$, the flow $x_1$ and $y$ more litres per minute enter, and $100$ litres per minute leave. Find $y$.'
            answer: '40'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Junction $B$ gives $x_1 + y = 100$. With $x_1 = 60$ this is $60 + y = 100$, so $y = 40$. Junction $A$ is consistent, since $60 + 90 = 150$.'
          - problem: 'At junction $A$, $100$ litres per second enter and split into the flows $x_1$ and $x_2$. At junction $B$, the flow $x_1$ and $30$ more litres per second enter, and the flow $x_3$ leaves. At junction $C$, the flows $x_2$ and $x_3$ enter, and $130$ litres per second leave. If $x_1 = 40$, find $x_2$ and $x_3$.'
            answer: '(60, 70)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'Junction $A$ gives $x_2 = 100 - 40 = 60$. Junction $B$ gives $x_3 = x_1 + 30 = 70$. Junction $C$ checks: $60 + 70 = 130$.'
          - problem: 'A junction receives $90$ cars per hour, and they leave on two roads. The road with the flow $x_2$ carries twice as many cars as the road with the flow $x_1$. Find $x_1$ and $x_2$.'
            answer: '(30, 60)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'Conservation gives $x_1 + x_2 = 90$, and the road condition gives $x_2 = 2x_1$. Substituting gives $3x_1 = 90$, so $x_1 = 30$ and $x_2 = 60$.'
          - problem: 'At junction $A$, $T$ cars per hour enter and split into the flows $x_1$ and $x_2$. At junction $B$, the flow $x_1$ and $25$ more cars per hour enter, and $75$ cars per hour leave. If $x_2 = 40$, find $T$ and $x_1$.'
            answer: '(90, 50)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'Junction $B$ gives $x_1 + 25 = 75$, so $x_1 = 50$. Junction $A$ gives $T = x_1 + x_2 = 50 + 40 = 90$.'
          - problem: 'In a pipe network the flows in litres per minute satisfy $x_1 + x_2 = 100$ and $x_2 + x_3 = 70$, and no flow can be negative. What is the smallest possible value of $x_1$?'
            answer: '30'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Subtracting the second equation from the first gives $x_1 - x_3 = 30$, so $x_1 = 30 + x_3$. The flow $x_3$ is not negative, so its smallest value is $0$, which gives $x_1 = 30$. Then $x_2 = 70$ is allowed too.'
        constraints: "flow in = flow out at each node; totals in 20..200, integer solutions"
      - id: kp2
        name: Word problems with three unknowns
        key_prerequisites: [row-reduction-echelon-forms, systems-word-problems]
        step_check:
          step: 'Substitute $s = 2c$ into the count equation'
          question: 'Why is the relationship $s = 2c$ substituted into the count equation?'
          options:
            - 'The relationship is the only one of the three equations that is actually true'
            - 'The substitution makes the total number of tickets sold equal to exactly $25$'
            - 'The count equation must always be used before the value equation is used'
            - 'It replaces $s$ by an expression in $c$, so the equation has fewer unknowns'
          answer: 'It replaces $s$ by an expression in $c$, so the equation has fewer unknowns'
          why: 'Each substitution removes one unknown. After $s = 2c$ the count equation has only $a$ and $c$, which leads to a single equation in $c$.'
        exemplars:
          - problem: 'A cinema sells adult tickets for $9$ euros, student tickets for $6$ euros and child tickets for $3$ euros. It sold $18$ tickets for $102$ euros, and twice as many student tickets as child tickets. How many adult, student and child tickets did it sell?'
            answer: '(3, 10, 5)'
            answer_contract: {"kind":"coordinates","arity":3}
            solution_sketch: 'Let $a$, $s$ and $c$ be the numbers of adult, student and child tickets. Then $a + s + c = 18$, $9a + 6s + 3c = 102$ and $s = 2c$. Substituting gives $a = 18 - 3c$ and $9(18 - 3c) + 12c + 3c = 102$, so $162 - 12c = 102$. Thus $c = 5$, $s = 10$ and $a = 3$.'
          - problem: 'Three numbers add up to $12$. The second is twice the first, and the third is $4$ more than the first. Find the three numbers.'
            answer: '(2, 4, 6)'
            answer_contract: {"kind":"coordinates","arity":3}
            solution_sketch: 'Call the first number $x$. The second is $2x$ and the third is $x + 4$, so $x + 2x + (x + 4) = 12$. This gives $4x = 8$, so $x = 2$, and the numbers are $2$, $4$ and $6$.'
          - problem: 'A collection of $14$ coins consists of quarters, dimes and nickels. The total value is $190$ cents, and there are twice as many dimes as quarters. How many quarters, dimes and nickels are there?'
            answer: '(4, 8, 2)'
            answer_contract: {"kind":"coordinates","arity":3}
            solution_sketch: 'Let $q$, $d$ and $n$ be the numbers of quarters, dimes and nickels. Then $q + d + n = 14$, $25q + 10d + 5n = 190$ and $d = 2q$. Substituting $d = 2q$ and $n = 14 - 3q$ gives $25q + 20q + 70 - 15q = 190$, so $30q = 120$. Thus $q = 4$, $d = 8$ and $n = 2$.'
          - problem: 'Three friends share $90$ euros. Bo gets half as much as Ana, and Cy gets $10$ euros more than Bo. How much does each of Ana, Bo and Cy get?'
            answer: '(40, 20, 30)'
            answer_contract: {"kind":"coordinates","arity":3}
            solution_sketch: 'Let Ana get $a$ euros. Bo gets $a / 2$ and Cy gets $a / 2 + 10$, so $a + a/2 + a/2 + 10 = 90$. This gives $2a = 80$, so $a = 40$. Then Bo gets $20$ euros and Cy gets $30$ euros.'
          - problem: 'Ana, Ben and Cara are siblings, and their ages add up to $30$. Ben is twice as old as Ana, and Cara is $6$ years older than Ana. How old are Ana, Ben and Cara?'
            answer: '(6, 12, 12)'
            answer_contract: {"kind":"coordinates","arity":3}
            solution_sketch: 'Let Ana be $a$ years old, so Ben is $2a$ and Cara is $a + 6$. Then $a + 2a + (a + 6) = 30$, which gives $4a = 24$ and $a = 6$. So Ben is $12$ and Cara is $12$.'
          - problem: 'A school hires minibuses with $8$ seats, coaches with $30$ seats and vans with $4$ seats. It hires $10$ vehicles with $152$ seats in all, and it hires twice as many vans as minibuses. How many minibuses, coaches and vans does it hire?'
            answer: '(2, 4, 4)'
            answer_contract: {"kind":"coordinates","arity":3}
            solution_sketch: 'Let $m$, $c$ and $v$ be the numbers of minibuses, coaches and vans. Then $m + c + v = 10$, $8m + 30c + 4v = 152$ and $v = 2m$. Substituting gives $c = 10 - 3m$ and $8m + 300 - 90m + 8m = 152$, so $74m = 148$. Thus $m = 2$, $v = 4$ and $c = 4$.'
          - problem: 'A farm packs $240$ eggs in boxes that hold $6$, $12$ and $18$ eggs. It uses $20$ boxes in all, and twice as many boxes of $12$ as boxes of $18$. How many boxes of $6$, of $12$ and of $18$ eggs does it use?'
            answer: '(5, 10, 5)'
            answer_contract: {"kind":"coordinates","arity":3}
            solution_sketch: 'Let $a$, $b$ and $c$ be the numbers of boxes of $6$, $12$ and $18$. Then $a + b + c = 20$, $6a + 12b + 18c = 240$ and $b = 2c$. Substituting gives $a = 20 - 3c$ and $120 - 18c + 24c + 18c = 240$, so $24c = 120$. Thus $c = 5$, $b = 10$ and $a = 5$.'
          - problem: 'A team scored $44$ points from $25$ scoring shots: goals worth $2$ points, goals worth $3$ points and free throws worth $1$ point. It made twice as many free throws as $3$-point goals. How many $2$-point goals, $3$-point goals and free throws did it make?'
            answer: '(7, 6, 12)'
            answer_contract: {"kind":"coordinates","arity":3}
            solution_sketch: 'Let $x$, $y$ and $z$ be the numbers of $2$-point goals, $3$-point goals and free throws. Then $x + y + z = 25$, $2x + 3y + z = 44$ and $z = 2y$. Substituting gives $x = 25 - 3y$ and $50 - 6y + 3y + 2y = 44$, so $y = 6$. Thus $x = 7$ and $z = 12$.'
        constraints: "3 unknowns, integer answers, quantities positive and small"
      - id: kp3
        name: Mixture and allocation problems
        key_prerequisites: [row-reduction-echelon-forms, systems-word-problems]
        step_check:
          step: 'the acid must be $0.48 \times 15 = 7.2$ L'
          question: 'Why is the amount of pure acid found as $48\%$ of $15$ L?'
          options:
            - 'The final mixture has $15$ L, and $48\%$ of this volume is acid'
            - 'Each of the three solutions contributes $48\%$ of its own volume'
            - 'The $48\%$ applies to the $60\%$ solution only, as the strongest one'
            - 'The acid amount is $48\%$ of the volume of any one ingredient'
          answer: 'The final mixture has $15$ L, and $48\%$ of this volume is acid'
          why: 'The concentration $48\%$ describes the whole mixture. The pure acid in $15$ L of the mixture is $0.48 \times 15 = 7.2$ L, and the three ingredients must supply exactly this amount.'
        exemplars:
          - problem: 'A chemist needs $12$ L of a $35\%$ acid solution. The chemist mixes $10\%$, $30\%$ and $50\%$ acid solutions, and uses twice as much of the $50\%$ solution as of the $10\%$ solution. How many liters of the $10\%$, $30\%$ and $50\%$ solutions are used?'
            answer: '(3, 3, 6)'
            answer_contract: {"kind":"coordinates","arity":3}
            solution_sketch: 'Let $x$, $y$ and $z$ be the liters of the three solutions. The volume gives $x + y + z = 12$, the acid gives $0.1x + 0.3y + 0.5z = 4.2$, and $z = 2x$. Substituting $y = 12 - 3x$ gives $3.6 + 0.2x = 4.2$, so $x = 3$, $y = 3$ and $z = 6$.'
          - problem: 'An investor splits $5000$ euros among three accounts that pay $2\%$, $3\%$ and $4\%$ interest a year. The amount in the $4\%$ account equals the sum of the amounts in the other two. The total interest after one year is $155$ euros. How much is in each account?'
            answer: '(2000, 500, 2500)'
            answer_contract: {"kind":"coordinates","arity":3}
            solution_sketch: 'Let $x$, $y$ and $z$ be the amounts in the $2\%$, $3\%$ and $4\%$ accounts. Then $x + y + z = 5000$, $0.02x + 0.03y + 0.04z = 155$ and $z = x + y$. The first and third give $z = 2500$ and $x + y = 2500$. The interest equation becomes $2x + 3y = 5500$, so $y = 500$ and $x = 2000$.'
          - problem: 'A juice maker blends concentrates that are $20\%$, $30\%$ and $60\%$ real fruit to make $20$ L of a drink that is $40\%$ real fruit. The amount of the $60\%$ concentrate is twice the amount of the $20\%$ concentrate. How many liters of each concentrate are used?'
            answer: '(4, 8, 8)'
            answer_contract: {"kind":"coordinates","arity":3}
            solution_sketch: 'Let $x$, $y$ and $z$ be the liters of the $20\%$, $30\%$ and $60\%$ concentrates. Then $x + y + z = 20$, $0.2x + 0.3y + 0.6z = 8$ and $z = 2x$. Substituting gives $y = 20 - 3x$ and $6 + 0.5x = 8$, so $x = 4$, $y = 8$ and $z = 8$.'
          - problem: 'A cash box holds $40$ coins: $10$-cent, $20$-cent and $50$-cent pieces. Their total value is $11.00$ euros, and there are twice as many $20$-cent coins as $10$-cent coins. How many coins of each kind are in the box?'
            answer: '(9, 18, 13)'
            answer_contract: {"kind":"coordinates","arity":3}
            solution_sketch: 'Let $x$, $y$ and $z$ be the numbers of $10$-cent, $20$-cent and $50$-cent coins. Then $x + y + z = 40$, $0.1x + 0.2y + 0.5z = 11$ and $y = 2x$. Substituting gives $z = 40 - 3x$ and $20 - x = 11$, so $x = 9$, $y = 18$ and $z = 13$.'
          - problem: 'A cafe blends coffee beans that cost $6$, $9$ and $15$ euros per kilogram to make $30$ kg of a blend worth $10$ euros per kilogram. It uses twice as much of the $9$-euro beans as of the $15$-euro beans. How many kilograms of each kind does it use?'
            answer: '(6, 16, 8)'
            answer_contract: {"kind":"coordinates","arity":3}
            solution_sketch: 'The blend is worth $30 \times 10 = 300$ euros. Let $x$, $y$ and $z$ be the kilograms of the $6$, $9$ and $15$ euro beans. Then $x + y + z = 30$, $6x + 9y + 15z = 300$ and $y = 2z$. Substituting gives $x = 30 - 3z$ and $180 + 15z = 300$, so $z = 8$, $y = 16$ and $x = 6$.'
          - problem: 'A dealer makes $40$ kg of an alloy that is $30\%$ copper from three alloys that are $10\%$, $20\%$ and $60\%$ copper. The amount of the $20\%$ alloy equals the sum of the amounts of the other two. How many kilograms of each alloy does the dealer use?'
            answer: '(8, 20, 12)'
            answer_contract: {"kind":"coordinates","arity":3}
            solution_sketch: 'Let $x$, $y$ and $z$ be the kilograms of the $10\%$, $20\%$ and $60\%$ alloys. Then $x + y + z = 40$, $0.1x + 0.2y + 0.6z = 12$ and $y = x + z$. The first and third give $y = 20$ and $x + z = 20$. The copper equation becomes $0.1x + 0.6z = 8$, so $z = 12$ and $x = 8$.'
          - problem: 'A lab mixes $5\%$, $15\%$ and $40\%$ saline solutions to make $24$ L of a $25\%$ solution. The amount of the $40\%$ solution equals the sum of the amounts of the other two. How many liters of each solution are used?'
            answer: '(6, 6, 12)'
            answer_contract: {"kind":"coordinates","arity":3}
            solution_sketch: 'Let $x$, $y$ and $z$ be the liters of the $5\%$, $15\%$ and $40\%$ solutions. Then $x + y + z = 24$, $0.05x + 0.15y + 0.40z = 6$ and $z = x + y$. This gives $z = 12$ and $x + y = 12$. The salt equation becomes $1.8 - 0.10x = 1.2$, so $x = 6$, $y = 6$ and $z = 12$.'
          - problem: 'A chemist mixes $10$ L of a $20\%$ acid solution with $30$ L of a $40\%$ acid solution. What is the percentage of acid in the mixture?'
            answer: '35%'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The mixture holds $0.20 \times 10 + 0.40 \times 30 = 2 + 12 = 14$ L of acid. The mixture has $10 + 30 = 40$ L in all, so the concentration is $14 / 40 = 0.35$, which is $35\%$.'
        constraints: "3 unknowns; percentages in easy decimals; integer answers; one concentration of a given mixture"
    diagnostic_exemplar:
      problem: 'Tickets cost €12 (adult), €7 (student), and €5 (child). $24$ tickets were sold for €244, and three times as many student tickets as child tickets were sold. How many of each were sold?'
      answer: '16 adult, 6 student, 2 child'
      answer_contract: {kind: none}
      solution_sketch: 'With $s = 3c$ and $a + s + c = 24$ we get $a = 24 - 4c$; then $12(24 - 4c) + 21c + 5c = 244$ gives $c = 2$, so $s = 6$ and $a = 16$.'
    anki_seeds:
      - front: 'The conservation law used at each node of a network-flow model?'
        back: 'Flow in equals flow out.'
        type: basic
      - front: 'In mixture problems, the amount of pure substance in a batch equals...'
        back: 'concentration times volume.'
        type: basic
