unit: vector-spaces
course: linear-algebra
module: "Vector Spaces & Transformations"
topics:
  - id: span-linear-combinations
    name: Linear Combinations and Span
    core: true
    difficulty: 0.55
    drill: false
    answer_kind: numeric
    expected_time_secs: 120
    prerequisites:
      - id: vectors-in-rn
        weight: 0.7
        key: true
      - id: matrix-vector-equations
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: Computing linear combinations
        key_prerequisites: [vectors-in-rn]
        exemplars:
          - problem: 'Compute $2(1, 3) + 3(2, -1)$.'
            answer: '(8, 3)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'Multiply each vector by its coefficient: $2(1, 3) = (2, 6)$ and $3(2, -1) = (6, -3)$. Then add the results component by component: $(2 + 6, 6 - 3) = (8, 3)$.'
          - problem: 'Compute $-2(1, 0, 3) + 3(2, -1, 1)$.'
            answer: '(4, -3, -3)'
            answer_contract: {"kind": "coordinates", "arity": 3}
            solution_sketch: 'Scale each vector first: $-2(1, 0, 3) = (-2, 0, -6)$ and $3(2, -1, 1) = (6, -3, 3)$. Then add component by component: $(-2 + 6, 0 - 3, -6 + 3) = (4, -3, -3)$.'
          - problem: 'A school buys $3$ packs and $2$ boxes of supplies. Each pack holds $(4, 1, 0)$ pens, pencils and erasers, and each box holds $(0, 10, 2)$. How many pens, pencils and erasers does the school get in all?'
            answer: '(12, 23, 4)'
            answer_contract: {"kind": "coordinates", "arity": 3}
            solution_sketch: 'The packs give $3(4, 1, 0) = (12, 3, 0)$ and the boxes give $2(0, 10, 2) = (0, 20, 4)$. Adding the two results component by component gives $(12, 23, 4)$ items.'
          - problem: 'One batch of dough uses $(3, 2)$ cups of flour and sugar. The batches a cook has made so far used $(12, 8)$ cups in all. How many batches did the cook make?'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Each batch uses $(3, 2)$ cups, so $n$ batches use $n(3, 2) = (3n, 2n)$ cups. Setting $(3n, 2n) = (12, 8)$ gives $n = 12 / 3 = 4$ and $n = 8 / 2 = 4$, so the cook made $4$ batches.'
          - problem: 'Suppose $a(1, 2) + 4(1, -1) = (7, 2)$. Find the value of $a$.'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Scale the known vector: $4(1, -1) = (4, -4)$. Subtract it from the target: $(7, 2) - (4, -4) = (3, 6)$. So $a(1, 2) = (3, 6)$, and both components give $a = 3$.'
          - problem: 'Find $a$ and $b$ such that $a(1, 2) + b(3, 1) = (5, 5)$.'
            answer: 'a = 2; b = 1'
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "a"}, {"contract": {"kind": "exact"}, "name": "b"}]}
            solution_sketch: 'The combination $a(1, 2) + b(3, 1)$ equals $(a + 3b, 2a + b)$, so $a + 3b = 5$ and $2a + b = 5$. From the first equation $a = 5 - 3b$; the second then gives $10 - 5b = 5$, so $b = 1$ and $a = 2$.'
          - problem: 'Let $u = (3, 1)$ and $v = (1, 4)$. Compute $2u - v$.'
            answer: '(5, -2)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'Scale $u$ by $2$ to get $(6, 2)$. Then subtract $v$ component by component: $(6 - 1, 2 - 4) = (5, -2)$.'
          - problem: 'A hiker walks the displacement $(3, 4)$ km twice, and then the displacement $(-1, 2)$ km three times. What is her total displacement?'
            answer: '(3, 14)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'Twice the first displacement is $2(3, 4) = (6, 8)$, and three times the second is $3(-1, 2) = (-3, 6)$. Adding gives the total $(6 - 3, 8 + 6) = (3, 14)$ km.'
        constraints: "2-3 vectors in R^2 or R^3; coefficients in -3..3"
      - id: kp2
        name: Membership in simple spans
        key_prerequisites: [vectors-in-rn, matrix-vector-equations]
        exemplars:
          - problem: 'Is $(6, -2)$ in $\mathrm{span}\{(3, -1)\}$?'
            answer: 'yes'
            answer_contract: {"kind": "label", "options": [["yes", "it is in the span", "in the span", "it is", "yes it is", "yes, it is"], ["no", "it is not in the span", "not in the span", "it is not", "no it is not", "no, it is not"]]}
            solution_sketch: 'A vector is in the span of $(3, -1)$ exactly when it is a scalar multiple of $(3, -1)$. Here $(6, -2) = 2(3, -1)$, so it is in the span.'
          - problem: 'Is $(2, 3)$ in $\mathrm{span}\{(1, 1)\}$?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "it is in the span", "in the span", "it is", "yes it is", "yes, it is"], ["no", "it is not in the span", "not in the span", "it is not", "no it is not", "no, it is not"]]}
            solution_sketch: 'Every multiple of $(1, 1)$ has two equal components. The vector $(2, 3)$ has $2 \neq 3$, so it is not in the span.'
          - problem: 'A blend always mixes orange juice and carrot juice in the proportions of the vector $(3, 2)$ litres. A cook has $12$ litres of orange juice. How many litres of carrot juice belong with it?'
            answer: '8'
            answer_contract: {"kind": "unit", "quantity": "volume", "unit": "L", "allow_omitted": true}
            solution_sketch: 'Every blend is a multiple $s(3, 2)$ of the vector $(3, 2)$. The orange part $3s = 12$ gives $s = 4$, so the carrot part is $2s = 8$ litres.'
          - problem: 'The vector $(5, 4)$ is written as $c_1(1, 2) + c_2(3, 0)$. What is $c_1$?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The second components give $2c_1 = 4$, so $c_1 = 2$. The first components then give $2 + 3c_2 = 5$, so $c_2 = 1$ and $(5, 4) = 2(1, 2) + 1(3, 0)$.'
          - problem: 'The vector $(9, k)$ lies in $\mathrm{span}\{(3, -2)\}$. Find $k$.'
            answer: '-6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Write $(9, k) = s(3, -2)$. The first components give $3s = 9$, so $s = 3$. Then $k = -2s = -6$.'
          - problem: 'Find $a$ and $b$ such that $(7, -3) = a(1, -1) + b(2, 0)$.'
            answer: 'a = 3; b = 2'
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "a"}, {"contract": {"kind": "exact"}, "name": "b"}]}
            solution_sketch: 'The second components give $-a = -3$, so $a = 3$. The first components then give $3 + 2b = 7$, so $b = 2$.'
          - problem: 'A gardener uses two fertilizers. One scoop of fertilizer A gives $(1, 3)$ units of nitrogen and potassium, and one scoop of fertilizer B gives $(2, 0)$ units. How many scoops of A (call it $a$) and of B (call it $b$) give exactly $(7, 9)$ units?'
            answer: 'a = 3; b = 2'
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "a"}, {"contract": {"kind": "exact"}, "name": "b"}]}
            solution_sketch: 'The potassium comes only from A, so $3a = 9$ and $a = 3$. The nitrogen gives $a + 2b = 7$, so $2b = 4$ and $b = 2$.'
        constraints: "single-vector spans decided by proportionality; two-vector cases have one coefficient forced immediately"
      - id: kp3
        name: Span as a geometric object
        key_prerequisites: [vectors-in-rn]
        try_first:
          problem: 'Can every point of the plane be reached by scaling the single vector $(1, 2)$?'
          answer_contract: {"kind": "label", "options": [["yes"], ["no"]]}
          answer: 'no'
          reveal: 'Scaling $(1, 2)$ only reaches points $(s, 2s)$ on one line. To reach the whole plane you need two vectors that point in different directions.'
        exemplars:
          - problem: 'Find the equation of the line $\mathrm{span}\{(2, 4)\}$ in the plane.'
            answer: 'y = 2x'
            answer_contract: {"kind": "polynomial_relation"}
            solution_sketch: 'The span is all points $s(2, 4) = (2s, 4s)$. Then $y = 4s = 2(2s) = 2x$, so the span is the line $y = 2x$ through the origin.'
          - problem: 'What is $\mathrm{span}\{(1, 0), (0, 1)\}$ in $\mathbb{R}^2$?'
            answer: 'all of R^2'
            answer_contract: {"kind": "label", "options": [["all of R^2", "R^2", "the whole plane", "the plane", "whole plane"], ["a line through the origin", "a line", "line"], ["only the origin", "the origin", "origin", "just the origin", "the zero vector"]]}
            solution_sketch: 'Every point $(x, y)$ equals $x(1, 0) + y(0, 1)$. So every point of the plane is a combination of the two vectors, and the span is all of $\mathbb{R}^2$.'
          - problem: 'A model train moves only along a straight track through its start $(0, 0)$ in the direction $(3, 1)$, so its position is always a multiple of $(3, 1)$. When the train is at $x = 12$, what is $y$?'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The position is $s(3, 1) = (3s, s)$. From $3s = 12$ we get $s = 4$, so $y = s = 4$.'
          - problem: 'Find the equation of the line $\mathrm{span}\{(2, -1), (-6, 3)\}$.'
            answer: 'y = -x/2'
            answer_contract: {"kind": "polynomial_relation"}
            solution_sketch: 'Since $(-6, 3) = -3(2, -1)$, both vectors lie on one line, and the span is all multiples of $(2, -1)$. A point $s(2, -1) = (2s, -s)$ has $y = -s = -x/2$, so the line is $y = -x/2$.'
          - problem: 'A straight road runs through the origin of a map in the direction $(5, 12)$. A village on the road is $36$ units north of the origin, so $y = 36$. How many units east of the origin is the village?'
            answer: '15'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Every point of the road is $s(5, 12) = (5s, 12s)$. From $12s = 36$ we get $s = 3$, so the village is $x = 5s = 15$ units east.'
          - problem: 'What is $\mathrm{span}\{(4, -2), (-6, 3)\}$ in $\mathbb{R}^2$?'
            answer: 'a line through the origin'
            answer_contract: {"kind": "label", "options": [["all of R^2", "R^2", "the whole plane", "the plane", "whole plane"], ["a line through the origin", "a line", "line"], ["only the origin", "the origin", "origin", "just the origin", "the zero vector"]]}
            solution_sketch: 'Since $(-6, 3) = -\tfrac{3}{2}(4, -2)$, the vectors are multiples of each other. So the span is only the line through the origin in the direction $(4, -2)$.'
          - problem: 'The line $y = -3x$ is the span of a vector $(1, k)$. Find $k$.'
            answer: '-3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The span of $(1, k)$ is all points $(s, ks)$, which lie on the line $y = kx$. Comparing with $y = -3x$ gives $k = -3$.'
          - problem: 'The vectors $(a, 6)$ and $(2, 3)$ span only a line in $\mathbb{R}^2$. Find $a$.'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The span is a line exactly when one vector is a multiple of the other. Since $6 = 2 \cdot 3$, we need $a = 2 \cdot 2 = 4$.'
        constraints: "spans of 1-2 vectors in R^2; equations of lines, points on lines and shape verdicts"
    diagnostic_exemplar:
      problem: 'Write $(4, 7)$ as a combination of $(1, 1)$ and $(1, 2)$.'
      answer: "(4, 7) = 1(1, 1) + 3(1, 2)"
      answer_contract: {kind: none}
      solution_sketch: '$c_1 + c_2 = 4$, $c_1 + 2c_2 = 7$: subtract to get $c_2 = 3$, then $c_1 = 1$.'
    anki_seeds:
      - front: '$\mathrm{span}\{\mathbf{v}_1, \dots, \mathbf{v}_k\}$ is the set of all...'
        back: 'linear combinations $c_1\mathbf{v}_1 + \cdots + c_k\mathbf{v}_k$.'
        type: basic
      - front: 'Geometrically, the span of one nonzero vector is...'
        back: 'the line through the origin in that direction.'
        type: basic

  - id: subspace-test
    name: The Subspace Test
    core: true
    difficulty: 0.6
    drill: false
    answer_kind: numeric
    expected_time_secs: 150
    prerequisites:
      - id: vectors-in-rn
        weight: 0.7
        key: true
    knowledge_points:
      - id: kp1
        name: The zero-vector check
        key_prerequisites: [vectors-in-rn]
        try_first:
          problem: 'Is the zero vector $(0, 0)$ a solution of the equation $4x - y = 7$?'
          answer_contract: {"kind": "label", "options": [["yes"], ["no"]]}
          answer: 'no'
          reveal: 'Put $(0, 0)$ into the equation: the left side is $0$, not $7$. A set that misses the zero vector cannot be a subspace.'
        exemplars:
          - problem: 'Does the set $W = \{(x, y) : 2x + 3y = 6\}$ contain the zero vector of $\mathbb{R}^2$?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "it contains the zero vector", "contains the zero vector"], ["no", "it does not contain the zero vector", "does not contain the zero vector"]]}
            solution_sketch: 'The zero vector is $(0, 0)$. At $(0, 0)$ the left side is $2(0) + 3(0) = 0$, but the condition needs $6$, so $(0, 0)$ is not in $W$.'
          - problem: 'For which value of $c$ does $W = \{(x, y) : 5x - y = c\}$ contain the zero vector?'
            answer: '0'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Put $(0, 0)$ into the condition: $5(0) - 0 = 0$. So $(0, 0)$ is in $W$ exactly when $c = 0$.'
          - problem: 'Does the set $W = \{(x, y) : y = 5x\}$ contain the zero vector of $\mathbb{R}^2$?'
            answer: 'yes'
            answer_contract: {"kind": "label", "options": [["yes", "it contains the zero vector", "contains the zero vector"], ["no", "it does not contain the zero vector", "does not contain the zero vector"]]}
            solution_sketch: 'At $(0, 0)$ we have $y = 0$ and $5x = 5(0) = 0$. The two sides are equal, so $(0, 0)$ is in $W$.'
          - problem: 'To test whether $W = \{(x, y, z) : z = 2x - y + 5\}$ contains the zero vector, substitute $(0, 0, 0)$. What value does the right side $2x - y + 5$ take there?'
            answer: '5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'At $(0, 0, 0)$ the right side is $2(0) - 0 + 5 = 5$. The left side $z$ is $0$, and $0 \neq 5$, so the zero vector is not in $W$.'
          - problem: 'A taxi charges $3$ dollars per kilometre plus a fixed fee, so a trip of $x$ kilometres costs $y = 3x + 4$ dollars. What value of $y$ does this line give at $x = 0$?'
            answer: '4'
            answer_contract: {"kind": "unit", "quantity": "dollar", "unit": "dollar", "allow_omitted": true}
            solution_sketch: 'At $x = 0$ the formula gives $y = 3(0) + 4 = 4$. So the point $(0, 0)$ is not on the line, which means the line does not contain the zero vector.'
          - problem: 'For which value of $k$ does the plane $x + 2y - 3z = k + 5$ contain the zero vector of $\mathbb{R}^3$?'
            answer: '-5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'At $(0, 0, 0)$ the left side is $0$. The zero vector is on the plane exactly when $0 = k + 5$, so $k = -5$.'
          - problem: 'Apples cost $2$ dollars each and pears cost $3$ dollars each. The purchases of $x$ apples and $y$ pears that cost exactly $c$ dollars satisfy $2x + 3y = c$. For which budget $c$ does this set contain the empty purchase $(0, 0)$?'
            answer: '0'
            answer_contract: {"kind": "unit", "quantity": "dollar", "unit": "dollar", "allow_omitted": true}
            solution_sketch: 'The empty purchase $(0, 0)$ costs $2(0) + 3(0) = 0$ dollars. So it belongs to the set exactly when the budget is $c = 0$.'
        constraints: "sets defined by one linear condition; the zero check settles or begins the argument"
      - id: kp2
        name: Closure checks and counterexamples
        key_prerequisites: [vectors-in-rn]
        exemplars:
          - problem: 'Is $W = \{(x, y) : x = 2y\}$ a subspace of $\mathbb{R}^2$?'
            answer: 'yes'
            answer_contract: {"kind": "label", "options": [["yes", "it is a subspace", "a subspace", "it is", "yes it is", "yes, it is"], ["no", "it is not a subspace", "not a subspace", "it is not", "no it is not", "no, it is not"]]}
            solution_sketch: 'The zero vector $(0, 0)$ satisfies $0 = 2 \cdot 0$. If $x_1 = 2y_1$ and $x_2 = 2y_2$, then $x_1 + x_2 = 2(y_1 + y_2)$, and $c x_1 = 2(c y_1)$. All three conditions hold, so $W$ is a subspace.'
          - problem: 'The vectors $u = (2, 0)$ and $v = (0, 3)$ both lie in $W = \{(x, y) : xy \leq 0\}$. What is the value of $xy$ for the vector $u + v$?'
            answer: '6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The sum is $u + v = (2, 3)$. Its product is $xy = 2 \cdot 3 = 6 > 0$, so $u + v$ is not in $W$ and $W$ is not closed under addition.'
          - problem: 'Let $W = \{(x, y) : x^2 + y^2 \leq 1\}$. The vectors $u = (1, 0)$ and $v = (0, 1)$ lie in $W$. What is the value of $x^2 + y^2$ at $u + v$?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The sum is $u + v = (1, 1)$. Then $x^2 + y^2 = 1 + 1 = 2 > 1$, so $u + v$ is outside $W$ and $W$ is not closed under addition.'
          - problem: 'The vector $u = (1, -5)$ lies in $W = \{(x, y) : y \leq 0\}$. What is $-2u$?'
            answer: '(-2, 10)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'Multiply each component of $u$ by $-2$: $-2(1, -5) = (-2, 10)$. The second component $10$ is positive, so $-2u$ is not in $W$.'
          - problem: 'Is $W = \{(x, y) : y \leq 0\}$ a subspace of $\mathbb{R}^2$?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "it is a subspace", "a subspace", "it is", "yes it is", "yes, it is"], ["no", "it is not a subspace", "not a subspace", "it is not", "no it is not", "no, it is not"]]}
            solution_sketch: 'The vector $(1, -5)$ is in $W$ because $-5 \leq 0$. But $-2(1, -5) = (-2, 10)$ has $y = 10 > 0$, so $W$ is not closed under scalar multiplication and is not a subspace.'
          - problem: 'For which value of $b$ is $W = \{(x, y) : y = 2x + b\}$ a subspace of $\mathbb{R}^2$?'
            answer: '0'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A subspace contains $(0, 0)$, which needs $0 = 2 \cdot 0 + b$, so $b = 0$. With $b = 0$ the set is the line $y = 2x$ through the origin, which is closed under sums and scalar multiples.'
          - problem: 'A warehouse holds stock levels $(x, y)$ of two products, and a level is allowed when $x + y \leq 10$. The levels $(6, 2)$ and $(1, 7)$ are both allowed. If the two stocks are merged, what is the value of $x + y$ for the merged stock?'
            answer: '16'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The merged stock is $(6, 2) + (1, 7) = (7, 9)$. Then $x + y = 7 + 9 = 16 > 10$, so the merged stock is not allowed and the allowed levels are not closed under addition.'
          - problem: 'A tank system has valid settings $(x, y)$ with $x = 3y$. The valid settings $(6, 2)$ and $(9, 3)$ are applied together by adding them. What setting results?'
            answer: '(15, 5)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'Add the settings component by component: $(6 + 9, 2 + 3) = (15, 5)$. Since $15 = 3 \cdot 5$, the result is again a valid setting.'
        constraints: "one linear or mildly nonlinear condition; failures shown by an explicit counterexample"
      - id: kp3
        name: Lines and planes through the origin
        key_prerequisites: [vectors-in-rn]
        exemplars:
          - problem: 'Is the line $y = x + 1$ a subspace of $\mathbb{R}^2$?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "it is a subspace", "a subspace", "it is", "yes it is", "yes, it is"], ["no", "it is not a subspace", "not a subspace", "it is not", "no it is not", "no, it is not"]]}
            solution_sketch: 'A subspace must contain $(0, 0)$. At $x = 0$ the line gives $y = 1$, so it misses the origin and is not a subspace.'
          - problem: 'For which value of $d$ is the plane $3x - 2y + z = 2d - 8$ a subspace of $\mathbb{R}^3$?'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A plane is a subspace exactly when it passes through the origin, so its constant term must be $0$. This gives $2d - 8 = 0$, so $d = 4$.'
          - problem: 'A chemist mixes three ingredients in amounts $(x, y, z)$, and a valid mix has $x$ equal to twice $y$ plus $z$, so $x = 2y + z$. Is the set of all valid mixes a subspace of $\mathbb{R}^3$?'
            answer: 'yes'
            answer_contract: {"kind": "label", "options": [["yes", "it is a subspace", "a subspace", "it is", "yes it is", "yes, it is"], ["no", "it is not a subspace", "not a subspace", "it is not", "no it is not", "no, it is not"]]}
            solution_sketch: 'Rewrite the rule as $x - 2y - z = 0$, an equation with constant term $0$. The zero vector satisfies it, and sums and scalar multiples of solutions are solutions, so the set is a subspace.'
          - problem: 'The plane $x - y + 2z = 5 - k$ is a subspace of $\mathbb{R}^3$. Find $k$.'
            answer: '5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A subspace plane passes through the origin, so the constant term must be $0$. This gives $5 - k = 0$, so $k = 5$.'
          - problem: 'A phone plan charges $y = 0.5x + c$ dollars for $x$ minutes, where $c$ dollars is a start fee. For which start fee is the set of points $(x, y)$ a subspace of $\mathbb{R}^2$?'
            answer: '0'
            answer_contract: {"kind": "unit", "quantity": "dollar", "unit": "dollar", "allow_omitted": true}
            solution_sketch: 'The line is a subspace only if it passes through $(0, 0)$. At $x = 0$ the plan costs $y = c$ dollars, so we need $c = 0$.'
          - problem: 'The line $6x + 2y = 3a - 9$ is a subspace of $\mathbb{R}^2$. Find $a$.'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A line is a subspace exactly when it passes through the origin, so the constant term is $0$. This gives $3a - 9 = 0$, so $a = 3$.'
        constraints: "lines/planes; subspace iff the equation is homogeneous (passes through the origin)"
    diagnostic_exemplar:
      problem: 'Is $W = \{(x, y) : x \ge 0\}$ a subspace of $\mathbb{R}^2$? Name the property that fails and give a counterexample.'
      answer: 'No: closure under scalar multiplication fails, since (1, 0) is in W but (-1)(1, 0) = (-1, 0) is not'
      answer_contract: {kind: none}
      solution_sketch: '$W$ contains $\mathbf{0}$ and is closed under addition, but a negative scalar pushes a point out of the half-plane.'
    anki_seeds:
      - front: 'The three conditions of the subspace test?'
        back: 'Contains $\mathbf{0}$; closed under addition; closed under scalar multiplication.'
        type: basic
      - front: 'Quickest way to show a set is NOT a subspace?'
        back: 'Exhibit one failure: the zero vector missing, or one sum/scalar multiple that leaves the set.'
        type: basic

  - id: subspaces-span
    name: Subspaces and Span
    core: true
    difficulty: 0.65
    drill: false
    answer_kind: numeric
    expected_time_secs: 180
    prerequisites:
      - id: span-linear-combinations
        weight: 0.7
        key: true
      - id: subspace-test
        weight: 0.6
        key: true
      - id: matrix-vector-equations
        weight: 0.4
      - id: solution-sets-free-variables
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: Spans are subspaces
        key_prerequisites: [span-linear-combinations, subspace-test]
        exemplars:
          - problem: 'Let $W = \mathrm{span}\{(1, 2), (0, 1)\}$, and let $u = 2(1, 2) + 3(0, 1)$ and $v = 1(1, 2) + 2(0, 1)$. The sum $u + v$ is again in $W$. Find $a$ and $b$ such that $u + v = a(1, 2) + b(0, 1)$.'
            answer: 'a = 3; b = 5'
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "a"}, {"contract": {"kind": "exact"}, "name": "b"}]}
            solution_sketch: 'Adding the coefficients of each spanning vector gives $u + v = (2 + 1)(1, 2) + (3 + 2)(0, 1)$. So $a = 3$ and $b = 5$, and $u + v = (3, 11)$ is again in $W$.'
          - problem: 'Is the set of all combinations $a(1, 2, 0) + b(0, 1, 3)$ a subspace of $\mathbb{R}^3$?'
            answer: 'yes'
            answer_contract: {"kind": "label", "options": [["yes", "it is a subspace", "a subspace", "it is", "yes it is", "yes, it is"], ["no", "it is not a subspace", "not a subspace", "it is not", "no it is not", "no, it is not"]]}
            solution_sketch: 'The set contains $0(1, 2, 0) + 0(0, 1, 3) = (0, 0, 0)$. A sum of two combinations, and a scalar multiple of a combination, is again a combination of the same two vectors, so the set is a subspace.'
          - problem: 'The set of all scalar multiples of $(2, 5)$ is $\mathrm{span}\{(2, 5)\}$. Let $u = 7(2, 5)$ and $v = -3(2, 5)$. Find the number $t$ with $u + v = t(2, 5)$.'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Add the coefficients: $u + v = (7 - 3)(2, 5) = 4(2, 5)$. So $t = 4$, and $u + v = (8, 20)$ is again a multiple of $(2, 5)$.'
          - problem: 'A box of type X holds $(2, 0, 1)$ units of cyan, magenta and yellow ink, and a box of type Y holds $(0, 3, 1)$. Two orders, each made of boxes of X and Y, are combined into one order that holds $(8, 9, 7)$ units of ink in all. How many boxes of X (call it $a$) and of Y (call it $b$) does the combined order contain?'
            answer: 'a = 4; b = 3'
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "a"}, {"contract": {"kind": "exact"}, "name": "b"}]}
            solution_sketch: 'The combined ink is $a(2, 0, 1) + b(0, 3, 1) = (2a, 3b, a + b)$. The first two components give $2a = 8$ and $3b = 9$, so $a = 4$ and $b = 3$, and the third component $4 + 3 = 7$ agrees.'
          - problem: 'For which value of $c$ is the line $y = 5x + c$ the span of a single vector in $\mathbb{R}^2$?'
            answer: '0'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Every span contains the zero vector, so the line must pass through $(0, 0)$. That needs $0 = 5 \cdot 0 + c$, so $c = 0$, and then the line is $\mathrm{span}\{(1, 5)\}$.'
          - problem: 'Let $W = \mathrm{span}\{(4, 1), (1, 2)\}$, and let $u = 2(4, 1) - 1(1, 2)$ and $w = 1(4, 1) + 3(1, 2)$. Write $2u - w$ as $a(4, 1) + b(1, 2)$. Find $a$ and $b$.'
            answer: 'a = 3; b = -5'
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "a"}, {"contract": {"kind": "exact"}, "name": "b"}]}
            solution_sketch: 'Here $2u = 4(4, 1) - 2(1, 2)$. Subtracting $w$ gives $(4 - 1)(4, 1) + (-2 - 3)(1, 2)$. So $a = 3$ and $b = -5$.'
          - problem: 'Is the set $\{(x, y, z) : z = 3x + 2y + 1\}$ a subspace of $\mathbb{R}^3$?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "it is a subspace", "a subspace", "it is", "yes it is", "yes, it is"], ["no", "it is not a subspace", "not a subspace", "it is not", "no it is not", "no, it is not"]]}
            solution_sketch: 'A subspace must contain $(0, 0, 0)$. At the origin the equation needs $0 = 3 \cdot 0 + 2 \cdot 0 + 1 = 1$, which is false, so the set is not a subspace and is not a span.'
          - problem: 'In $\mathbb{R}^3$, the set $W = \{(x, y, z) : z = 3x + 2y\}$ is a span of two vectors. Write $W = \mathrm{span}\{p, q\}$, where $p$ has second coordinate $0$ and $q$ has first coordinate $0$. Find $p$ and $q$.'
            answer: 'p = (1, 0, 3); q = (0, 1, 2)'
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "coordinates", "arity": 3}, "name": "p"}, {"contract": {"kind": "coordinates", "arity": 3}, "name": "q"}]}
            solution_sketch: 'A general element of $W$ is $(x, y, 3x + 2y) = x(1, 0, 3) + y(0, 1, 2)$. Setting $y = 0$ gives $p = (1, 0, 3)$, and setting $x = 0$ gives $q = (0, 1, 2)$.'
          - problem: 'A factory has two production lines. Line A makes $(2, 0, 1)$ units of products P, Q and R per hour, and line B makes $(0, 3, 1)$ units per hour. Monday output was $(10, 6, 7)$ and Tuesday output was $(2, 12, 5)$. To make both days of output in one run, how many hours of line A (call it $a$) and of line B (call it $b$) are needed?'
            answer: 'a = 6; b = 6'
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "a"}, {"contract": {"kind": "exact"}, "name": "b"}]}
            solution_sketch: 'The combined output is $(10, 6, 7) + (2, 12, 5) = (12, 18, 12)$. The first component gives $2a = 12$, so $a = 6$, and the second gives $3b = 18$, so $b = 6$. The third component $6 + 6 = 12$ agrees.'
        constraints: "1-2 spanning vectors; justify via the subspace test or the span-is-a-subspace theorem"
      - id: kp2
        name: Membership in a span
        key_prerequisites: [matrix-vector-equations, solution-sets-free-variables]
        exemplars:
          - problem: 'Is $(2, 7, 9)$ in $\mathrm{span}\{(1, 2, 0), (0, 1, 3)\}$?'
            answer: 'yes'
            answer_contract: {"kind": "label", "options": [["yes", "it is in the span", "in the span", "it is", "yes it is", "yes, it is"], ["no", "it is not in the span", "not in the span", "it is not", "no it is not", "no, it is not"]]}
            solution_sketch: 'Write $(2, 7, 9) = c_1(1, 2, 0) + c_2(0, 1, 3)$. The first component gives $c_1 = 2$, and the second gives $2c_1 + c_2 = 7$, so $c_2 = 3$. The third component is $3c_2 = 9$, which matches, so the vector is in the span.'
          - problem: 'Is $(4, 3, 5)$ in $\mathrm{span}\{(1, 2, 0), (0, 1, 2)\}$?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "it is in the span", "in the span", "it is", "yes it is", "yes, it is"], ["no", "it is not in the span", "not in the span", "it is not", "no it is not", "no, it is not"]]}
            solution_sketch: 'Write $(4, 3, 5) = c_1(1, 2, 0) + c_2(0, 1, 2)$. The first component gives $c_1 = 4$ and the second gives $2c_1 + c_2 = 3$, so $c_2 = -5$. The third component of the combination is $2c_2 = -10$, but the vector has $5$, so it is not in the span.'
          - problem: 'The vector $(5, k, 4)$ lies in $\mathrm{span}\{(1, 0, 2), (0, 3, 1)\}$. Find $k$.'
            answer: '-18'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Write $(5, k, 4) = c_1(1, 0, 2) + c_2(0, 3, 1)$. The first component gives $c_1 = 5$, and the third gives $2c_1 + c_2 = 4$, so $c_2 = -6$. Then $k = 3c_2 = -18$.'
          - problem: 'The vector $(3, 6, t)$ lies in $\mathrm{span}\{(2, 1, 0), (1, 0, 3)\}$. Find $t$.'
            answer: '-27'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Write $(3, 6, t) = c_1(2, 1, 0) + c_2(1, 0, 3)$. The second component gives $c_1 = 6$, and the first gives $12 + c_2 = 3$, so $c_2 = -9$. Then $t = 3c_2 = -27$.'
          - problem: 'The vector $(4, 7, 4)$ lies in $\mathrm{span}\{(2, 4, 2), (1, 1, 1)\}$. Find $a$ and $b$ such that $(4, 7, 4) = a(2, 4, 2) + b(1, 1, 1)$.'
            answer: 'a = 3/2; b = 1'
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "a"}, {"contract": {"kind": "exact"}, "name": "b"}]}
            solution_sketch: 'The first two components give $2a + b = 4$ and $4a + b = 7$. Subtracting gives $2a = 3$, so $a = 3/2$, and then $b = 4 - 3 = 1$. The third component $2a + b = 4$ agrees.'
          - problem: 'Find $a$ and $b$ such that $(3, 6, 2) = a(1, 2, 0) + b(2, 4, 1)$.'
            answer: 'a = -1; b = 2'
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "a"}, {"contract": {"kind": "exact"}, "name": "b"}]}
            solution_sketch: 'The third component gives $b = 2$. The first component then gives $a + 4 = 3$, so $a = -1$. The second component $2(-1) + 4(2) = 6$ agrees.'
          - problem: 'Three paint pigments are measured in units of red, yellow and blue. One litre of paint A contains $(2, 1, 0)$ units and one litre of paint B contains $(0, 1, 3)$ units. How many litres of A (call it $a$) and of B (call it $b$) make a mixture with exactly $(4, 5, 9)$ units?'
            answer: 'a = 2; b = 3'
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "a"}, {"contract": {"kind": "exact"}, "name": "b"}]}
            solution_sketch: 'The red pigment comes only from A, so $2a = 4$ and $a = 2$. The yellow component gives $a + b = 5$, so $b = 3$. The blue component $3b = 9$ agrees.'
          - problem: 'Food F gives $(1, 2, 0)$ grams of protein, carbohydrate and fat per serving, and food G gives $(0, 1, 2)$ grams per serving. A meal has $3$ servings of F and some servings of G, and it contains $10$ grams of fat. How many grams of carbohydrate does the meal contain?'
            answer: '11'
            answer_contract: {"kind": "unit", "quantity": "mass", "unit": "g", "allow_omitted": true}
            solution_sketch: 'Only G contains fat, so $2s = 10$ and the meal has $s = 5$ servings of G. The carbohydrate is $2 \cdot 3 + 1 \cdot 5 = 11$ grams.'
        constraints: "2 spanning vectors; membership decided by a 2x2 solve plus one check"
      - id: kp3
        name: Geometry of spans
        key_prerequisites: [span-linear-combinations]
        exemplars:
          - problem: 'Find the slope of the line $\mathrm{span}\{(2, 1)\}$ in $\mathbb{R}^2$.'
            answer: '1/2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Every point of the span is $s(2, 1) = (2s, s)$. The slope is $y / x = s / (2s) = 1/2$.'
          - problem: 'What is $\mathrm{span}\{(1, 3), (3, 1)\}$ in $\mathbb{R}^2$?'
            answer: 'all of R^2'
            answer_contract: {"kind": "label", "options": [["all of R^2", "R^2", "the whole plane", "the plane", "whole plane"], ["a line through the origin", "a line", "line"], ["only the origin", "the origin", "origin", "just the origin", "the zero vector"]]}
            solution_sketch: 'The determinant $1 \cdot 1 - 3 \cdot 3 = -8$ is not $0$, so the vectors are not multiples of each other. Two such vectors span all of $\mathbb{R}^2$.'
          - problem: 'Find the point of the line $\mathrm{span}\{(1, -2, 4)\}$ in $\mathbb{R}^3$ whose third coordinate is $8$.'
            answer: '(2, -4, 8)'
            answer_contract: {"kind": "coordinates", "arity": 3}
            solution_sketch: 'Every point of the span is $s(1, -2, 4) = (s, -2s, 4s)$. The third coordinate gives $4s = 8$, so $s = 2$ and the point is $(2, -4, 8)$.'
          - problem: 'Find an equation of the plane $\mathrm{span}\{(1, 0, 3), (0, 2, 1)\}$ in $\mathbb{R}^3$.'
            answer: '6x + y - 2z = 0'
            answer_contract: {"kind": "polynomial_relation"}
            solution_sketch: 'A point of the span is $s(1, 0, 3) + t(0, 2, 1) = (s, 2t, 3s + t)$. So $x = s$ and $y = 2t$, and $z = 3x + y/2$, which is the plane $6x + y - 2z = 0$.'
          - problem: 'What is $\mathrm{span}\{(2, -1, 0), (4, 5, 0)\}$ in $\mathbb{R}^3$?'
            answer: 'a plane through the origin'
            answer_contract: {"kind": "label", "options": [["a line through the origin", "a line", "line"], ["a plane through the origin", "a plane", "plane", "the xy-plane", "xy-plane", "the plane z = 0"], ["all of R^3", "R^3", "all of space", "whole space"], ["the origin alone", "the origin", "origin", "only the origin"]]}
            solution_sketch: 'The vector $(4, 5, 0)$ is not a multiple of $(2, -1, 0)$, so the two vectors give two directions. Two independent vectors span a plane through the origin, here the plane $z = 0$.'
          - problem: 'A drone moves in space by combining two thrusters, one along $(1, 0, 3)$ and one along $(0, 2, 1)$, so its position is $s(1, 0, 3) + t(0, 2, 1)$. When the drone is at $x = 4$ and $y = 6$, what is its height $z$?'
            answer: '15'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The position is $(s, 2t, 3s + t)$. From $x = s = 4$ and $y = 2t = 6$ we get $t = 3$, so $z = 3 \cdot 4 + 3 = 15$.'
          - problem: 'A straight rail line through the origin of a survey runs in the direction $(3, 4, 12)$. A station on the line has height $z = 60$. What are the coordinates of the station?'
            answer: '(15, 20, 60)'
            answer_contract: {"kind": "coordinates", "arity": 3}
            solution_sketch: 'Every point of the line is $s(3, 4, 12) = (3s, 4s, 12s)$. The height gives $12s = 60$, so $s = 5$ and the station is at $(15, 20, 60)$.'
          - problem: 'What is the dimension of $\mathrm{span}\{(1, 2, 1), (2, 4, 2)\}$?'
            answer: '1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Since $(2, 4, 2) = 2(1, 2, 1)$, the second vector adds no new direction. The span is the line through $(1, 2, 1)$, which has dimension $1$.'
        constraints: "spans of 1-2 vectors in R^2 or R^3; slopes, equations, points, dimensions and shape verdicts"
    diagnostic_exemplar:
      problem: 'Is $(1, 3, 1)$ in $\mathrm{span}\{(1, 1, 0), (0, 1, 1)\}$? Describe that span geometrically.'
      answer: 'No: matching components forces a = 1 and b = 1, but then the middle entry is 2, not 3; the span itself is a plane through the origin in R^3'
      answer_contract: {kind: none}
      solution_sketch: '$a(1,1,0) + b(0,1,1) = (a, a + b, b)$, so $a = 1$, $b = 1$ and $a + b = 2 \ne 3$. Two independent vectors span a plane through the origin.'
    anki_seeds:
      - front: 'Why is every span automatically a subspace?'
        back: 'It contains the zero combination, and sums/scalar multiples of linear combinations are linear combinations.'
        type: basic
      - front: 'Two non-proportional vectors in $\mathbb{R}^2$ span...'
        back: 'all of $\mathbb{R}^2$.'
        type: basic

  - id: linear-independence
    name: Linear Independence
    core: true
    difficulty: 0.65
    drill: false
    answer_kind: numeric
    expected_time_secs: 180
    prerequisites:
      - id: subspaces-span
        weight: 0.6
        key: true
      - id: row-reduction-echelon-forms
        weight: 0.5
        key: true
      - id: solution-sets-free-variables
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: Independence of two vectors
        key_prerequisites: [subspaces-span]
        try_first:
          problem: 'By what number must $(2, 3)$ be multiplied to give $(6, 9)$?'
          answer_contract: {"kind": "exact"}
          answer: '3'
          reveal: 'Both components are multiplied by $3$, so $(6, 9)$ is a scalar multiple of $(2, 3)$. Two vectors where one is a multiple of the other are linearly dependent.'
        exemplars:
          - problem: 'Decide whether $u = (2, 6)$ and $v = (8, 24)$ are linearly independent or linearly dependent.'
            answer: 'dependent'
            answer_contract: {"kind": "label", "options": [["independent", "linearly independent", "they are independent", "are independent"], ["dependent", "linearly dependent", "they are dependent", "are dependent"]]}
            solution_sketch: 'Here $v = 4u$, because $4 \cdot 2 = 8$ and $4 \cdot 6 = 24$. One vector is a scalar multiple of the other, so the pair is linearly dependent.'
          - problem: 'Decide whether $u = (3, 5)$ and $v = (4, 7)$ are linearly independent or linearly dependent.'
            answer: 'independent'
            answer_contract: {"kind": "label", "options": [["independent", "linearly independent", "they are independent", "are independent"], ["dependent", "linearly dependent", "they are dependent", "are dependent"]]}
            solution_sketch: 'If $(4, 7) = c(3, 5)$, then $c = 4/3$ from the first components and $c = 7/5$ from the second. The two values differ, so neither vector is a multiple of the other. The determinant $3 \cdot 7 - 5 \cdot 4 = 1$ is also not $0$, so the pair is independent.'
          - problem: 'The vectors $(3, 6)$ and $(k, 10)$ in $\mathbb{R}^2$ are linearly dependent. Find $k$.'
            answer: '5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Two vectors are dependent exactly when one is a scalar multiple of the other. Since $(3, 6)$ and $(k, 10)$ have second components in the ratio $10/6 = 5/3$, we need $k = 3 \cdot 5/3 = 5$.'
          - problem: 'The vectors $(2, -1, 3)$ and $(-4, 2, k)$ in $\mathbb{R}^3$ are linearly dependent. Find $k$.'
            answer: '-6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Write $(-4, 2, k) = c(2, -1, 3)$. The first components give $c = -2$, and the second components agree since $2 = -2 \cdot (-1)$. The third component then gives $k = -2 \cdot 3 = -6$.'
          - problem: 'In $\mathbb{R}^3$, the vector $w = (6, k, 9)$ is a scalar multiple of $u = (2, -1, 3)$. Find the scalar $c$ with $w = cu$ and the value of $k$.'
            answer: 'c = 3; k = -3'
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "c"}, {"contract": {"kind": "exact"}, "name": "k"}]}
            solution_sketch: 'Write $w = cu$ componentwise. The first components give $6 = 2c$, so $c = 3$. The second component gives $k = 3 \cdot (-1) = -3$, and the third component agrees since $3 \cdot 3 = 9$.'
          - problem: 'For which $t$ are the vectors $(1, 2, 1)$ and $(2, 4, t)$ linearly dependent?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The pair is dependent only if $(2, 4, t) = c(1, 2, 1)$. The first components force $c = 2$, and the second components agree since $4 = 2 \cdot 2$, so $t = 2 \cdot 1 = 2$.'
          - problem: 'A smoothie recipe uses $(2, 3)$ litres of oat milk and banana puree. A larger batch uses $(8, k)$ litres in exactly the same proportions, so the two recipe vectors are linearly dependent. Find $k$.'
            answer: '12'
            answer_contract: {"kind": "unit", "quantity": "volume", "unit": "L", "allow_omitted": true}
            solution_sketch: 'The larger batch is a multiple $s(2, 3)$ of the recipe. From $2s = 8$ we get $s = 4$, so $k = 3s = 12$ litres.'
          - problem: 'Two forces on a bolt have components $(6, -9)$ and $(-4, k)$ and act along the same line, so the force vectors are linearly dependent. Find $k$.'
            answer: '6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The second force is a multiple $s(6, -9)$ of the first. From $6s = -4$ we get $s = -2/3$, so $k = -9s = 6$.'
        constraints: "pairs in R^2 or R^3 with small integer entries"
      - id: kp2
        name: Independence via row reduction
        key_prerequisites: [row-reduction-echelon-forms, solution-sets-free-variables]
        exemplars:
          - problem: 'Decide whether the vectors $v_1 = (2, 1, 1)$, $v_2 = (1, 2, 3)$ and $v_3 = (3, 3, 4)$ are linearly independent or linearly dependent.'
            answer: 'dependent'
            answer_contract: {"kind": "label", "options": [["independent", "linearly independent", "they are independent", "are independent"], ["dependent", "linearly dependent", "they are dependent", "are dependent"]]}
            solution_sketch: 'Put the vectors in the columns of a matrix and row reduce it. The third column is the sum of the first two, so the echelon form has pivots in only two of the three columns. A column without a pivot gives the nontrivial relation $v_1 + v_2 - v_3 = 0$, so the vectors are dependent.'
          - problem: 'Decide whether the vectors $u = (1, 0, 2)$, $v = (0, 1, 3)$ and $w = (1, 1, 0)$ are linearly independent or linearly dependent.'
            answer: 'independent'
            answer_contract: {"kind": "label", "options": [["independent", "linearly independent", "they are independent", "are independent"], ["dependent", "linearly dependent", "they are dependent", "are dependent"]]}
            solution_sketch: 'Put the vectors in the columns of a matrix and row reduce it. The echelon form has a pivot in every column, so the only solution of $A\mathbf{x} = \mathbf{0}$ is $\mathbf{x} = \mathbf{0}$. The determinant is $-5$, not $0$, so the vectors are independent.'
          - problem: 'Find the rank of the matrix whose columns are $(1, 2, 3)$, $(2, 4, 6)$ and $(3, 6, 9)$.'
            answer: '1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The second and third columns are multiples of the first, since $(2, 4, 6) = 2(1, 2, 3)$ and $(3, 6, 9) = 3(1, 2, 3)$. Row reduction leaves only one pivot, so the rank is $1$.'
          - problem: 'How many pivot positions does the matrix with columns $(2, 1, 0)$, $(1, 3, 1)$ and $(1, 0, 2)$ have?'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Row reducing the matrix $\begin{pmatrix} 2 & 1 & 1 \\ 1 & 3 & 0 \\ 0 & 1 & 2 \end{pmatrix}$ gives a pivot in every column, because its determinant is $11$, not $0$. So the matrix has $3$ pivot positions.'
          - problem: 'How many nonzero rows does the row echelon form of the matrix with columns $(1, 0, 2)$, $(0, 1, 1)$ and $(1, 1, 3)$ have?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The third column is the sum of the first two, so one row becomes zero during row reduction. Only $2$ nonzero rows remain, so the echelon form has $2$ nonzero rows.'
          - problem: 'For which $k$ are the columns $(1, 2, 3)$, $(0, 1, 2)$ and $(1, 3, k)$ linearly dependent?'
            answer: '5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The columns are dependent exactly when the matrix has a column without a pivot, which happens when its determinant is $0$. The determinant is $k - 5$, so $k = 5$. Then $(1, 3, 5) = (1, 2, 3) + (0, 1, 2)$.'
          - problem: 'Three investment portfolios hold stocks, bonds and cash in the amounts $(2, 1, 0)$, $(1, 3, 1)$ and $(3, 4, 1)$. What is the rank of the matrix with these three portfolios as columns?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The third portfolio is the sum of the first two, since $(2, 1, 0) + (1, 3, 1) = (3, 4, 1)$. So the third column has no pivot, and the rank is $2$.'
          - problem: 'A shop sells three gift boxes holding fruit in the amounts $(1, 1, 0)$, $(0, 1, 1)$ and $(1, 0, 1)$ of apples, pears and plums. What is the rank of the matrix with these boxes as columns?'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Row reducing the matrix with these columns gives a pivot in every column, because its determinant is $2$, not $0$. So the rank is $3$, and no box is a combination of the other two.'
        constraints: "3 vectors in R^3; dependent cases have an easily spotted relation like v3 = v1 + v2"
      - id: kp3
        name: Dependence relations and parameters
        key_prerequisites: [subspaces-span, solution-sets-free-variables]
        exemplars:
          - problem: 'For which $h$ is $\{(1, 2), (h, 4)\}$ linearly dependent?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The set is dependent exactly when $(h, 4)$ is a multiple of $(1, 2)$. The second components give the multiplier $4/2 = 2$, so $h = 2 \cdot 1 = 2$.'
          - problem: 'Let $v_1 = (1, 0, 2)$, $v_2 = (1, 3, 0)$ and $v_3 = (1, -3, 4)$. The relation $c\,v_1 + d\,v_2 - v_3 = 0$ holds for some numbers $c$ and $d$. Find $c$ and $d$.'
            answer: 'c = 2; d = -1'
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "c"}, {"contract": {"kind": "exact"}, "name": "d"}]}
            solution_sketch: 'The relation says $c(1, 0, 2) + d(1, 3, 0) = (1, -3, 4)$. The second components give $3d = -3$, so $d = -1$, and the third give $2c = 4$, so $c = 2$. The first components agree since $2 - 1 = 1$.'
          - problem: 'Find $h$ so that $(3, 4)$ and $(h, 8)$ are linearly dependent.'
            answer: '6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Two vectors are dependent exactly when one is a scalar multiple of the other. Writing $(h, 8) = k(3, 4)$, the second components give $k = 2$, so $h = 2 \cdot 3 = 6$.'
          - problem: 'The vectors $u = (1, 1)$, $v = (2, 3)$ and $w = (5, 7)$ satisfy a relation $a\,u + b\,v - w = 0$. Find $a$ and $b$.'
            answer: 'a = 1; b = 2'
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "a"}, {"contract": {"kind": "exact"}, "name": "b"}]}
            solution_sketch: 'The relation reads $a(1, 1) + b(2, 3) = (5, 7)$, so $a + 2b = 5$ and $a + 3b = 7$. Subtracting the equations gives $b = 2$, and then $a = 5 - 2 \cdot 2 = 1$.'
          - problem: 'For which $h$ are the vectors $(1, 2, 1)$, $(2, 3, 1)$ and $(1, 1, h)$ linearly dependent?'
            answer: '0'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Notice that $(2, 3, 1) - (1, 2, 1) = (1, 1, 0)$. So the third vector $(1, 1, h)$ completes a dependence relation exactly when $h = 0$, and then $-v_1 + v_2 - v_3 = 0$.'
          - problem: 'Let $v_1 = (1, 2)$, $v_2 = (2, 4)$ and $v_3 = (1, 1)$ in $\mathbb{R}^2$. What is the largest number of linearly independent vectors that can be chosen from this set?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Since $v_2 = 2v_1$, the vectors $v_1$ and $v_2$ are dependent. In $\mathbb{R}^2$ at most $2$ vectors can be independent, and $v_1$ and $v_3$ are independent, so the largest number is $2$.'
          - problem: 'Alloy A holds $(3, 1)$ kilograms of gold and silver per batch, and alloy B holds $(1, 2)$. Alloy C holds $(7, 4)$ and is made by mixing $a$ batches of A with $b$ batches of B. Find $a$ and $b$.'
            answer: 'a = 2; b = 1'
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "a"}, {"contract": {"kind": "exact"}, "name": "b"}]}
            solution_sketch: 'The mix gives $a(3, 1) + b(1, 2) = (7, 4)$, so $3a + b = 7$ and $a + 2b = 4$. From the first equation $b = 7 - 3a$; the second then gives $a + 14 - 6a = 4$, so $a = 2$ and $b = 1$.'
          - problem: 'The monthly gain and risk of two funds are $(4, 10)$ and $(6, h)$. The two funds behave in exactly proportional ways, so the two vectors are linearly dependent. Find $h$.'
            answer: '15'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The second vector is a multiple $s(4, 10)$ of the first. From $4s = 6$ we get $s = 3/2$, so $h = 10s = 15$.'
        constraints: "solve-for-h with integer h; relations with coefficients in -2..2"
    diagnostic_exemplar:
      problem: 'Is $\{(1, 1, 2), (2, 0, 1), (3, 1, 3)\}$ linearly independent? If not, give a nontrivial dependence relation.'
      answer: 'No: v1 + v2 - v3 = 0'
      answer_contract: {kind: none}
      solution_sketch: 'Row reduction produces a zero row; concretely $(1,1,2) + (2,0,1) = (3,1,3)$, so the third vector is a combination of the first two.'
    anki_seeds:
      - front: 'Definition: $\{\mathbf{v}_1, \dots, \mathbf{v}_k\}$ is linearly independent when $c_1\mathbf{v}_1 + \cdots + c_k\mathbf{v}_k = \mathbf{0}$ implies...'
        back: '$c_1 = \cdots = c_k = 0$ (only the trivial combination).'
        type: basic
      - front: 'Quick test for two vectors to be linearly dependent?'
        back: 'One is a scalar multiple of the other.'
        type: basic

  - id: basis-dimension
    name: Basis and Dimension
    core: true
    difficulty: 0.7
    drill: false
    answer_kind: numeric
    expected_time_secs: 210
    prerequisites:
      - id: linear-independence
        weight: 0.7
        key: true
      - id: subspaces-span
        weight: 0.6
        key: true
    knowledge_points:
      - id: kp1
        name: Verifying a basis
        key_prerequisites: [linear-independence, subspaces-span]
        exemplars:
          - problem: 'Is $\{(1, 2), (2, 1)\}$ a basis of $\mathbb{R}^2$?'
            answer: 'yes'
            answer_contract: {"kind": "label", "options": [["yes", "it is a basis", "a basis", "basis"], ["no", "it is not a basis", "not a basis"]]}
            solution_sketch: 'The vectors are not multiples of each other, so they are linearly independent. The determinant of the matrix with these columns is $1 \cdot 1 - 2 \cdot 2 = -3$, which is not $0$, so the two vectors span $\mathbb{R}^2$ and form a basis.'
          - problem: 'The set $\{(2, 5), (t, 15)\}$ is a basis of $\mathbb{R}^2$ for every value of $t$ except one. Find that value of $t$.'
            answer: '6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The set fails to be a basis exactly when the determinant of the matrix with these columns is $0$. That determinant is $2 \cdot 15 - 5t = 30 - 5t$, which is $0$ when $t = 6$. Indeed $(6, 15) = 3(2, 5)$, so the second vector is a multiple of the first.'
          - problem: 'The set $\{(1, 0, 2), (0, 1, 1), (3, k, 10)\}$ is a basis of $\mathbb{R}^3$ for every value of $k$ except one. Find that value of $k$.'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The set is not a basis exactly when the determinant of the matrix with these columns is $0$. Expanding along the first row gives $1 \cdot (10 - k) - 0 + 3 \cdot (0 - 2) = 4 - k$, so $k = 4$. Then $(3, 4, 10) = 3(1, 0, 2) + 4(0, 1, 1)$ is a combination of the first two vectors.'
          - problem: 'A game piece moves on a plane. Move $A$ shifts it by $(3, 1)$ and move $B$ shifts it by $(6, 2)$. Each move may be used any real number of times, forwards or backwards. Can the piece reach every point of the plane?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "it can", "every point", "yes, it can"], ["no", "it cannot", "it can not", "no, it cannot", "no, not every point", "not every point", "it cannot reach every point", "the piece cannot reach every point"]]}
            solution_sketch: 'The shift $(6, 2)$ equals $2 \cdot (3, 1)$, so the two moves point along the same line. The determinant $3 \cdot 2 - 6 \cdot 1 = 0$ confirms that they are dependent, so the piece reaches only the points on one line and not the whole plane.'
          - problem: 'The set $S = \{(1, 2, 3), (2, 4, 6), (-1, -2, -3)\}$ is offered as a basis of $\mathbb{R}^3$. What is the dimension of the span of $S$?'
            answer: '1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Every vector in $S$ is a multiple of $(1, 2, 3)$, because $(2, 4, 6) = 2(1, 2, 3)$ and $(-1, -2, -3) = -1 \cdot (1, 2, 3)$. The span is therefore the line through $(1, 2, 3)$, which has dimension $1$, so $S$ is far from a basis of $\mathbb{R}^3$.'
          - problem: 'Sam says that $\{(1, 2, 3), (4, 5, 6), (7, 8, 9)\}$ is a basis of $\mathbb{R}^3$, because none of the three vectors is a multiple of another. What is the dimension of the span of these three vectors?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Sam compared only pairs of vectors, but a dependence can involve all three. Here $(7, 8, 9) = 2(4, 5, 6) - (1, 2, 3)$, so the third vector lies in the span of the first two. The first two vectors are independent, so the span has dimension $2$ and the set is not a basis.'
          - problem: 'A machine part has three adjustment screws. One turn of the first screw changes the part''s (length, width, height) by $(1, 2, 0)$ mm, one turn of the second changes it by $(0, 1, 1)$ mm and one turn of the third changes it by $(1, c, 1)$ mm, where $c$ depends on the part. Turns may be fractional or backwards. For which value of $c$ can the three screws not produce every change of (length, width, height)?'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The screws can produce every change exactly when the three vectors form a basis of $\mathbb{R}^3$, that is when the determinant is not $0$. The determinant of the matrix with these columns is $3 - c$. It is $0$ only for $c = 3$, and then $(1, 3, 1) = (1, 2, 0) + (0, 1, 1)$ is a combination of the other two vectors.'
          - problem: 'For which values of $c$ is $\{(1, c), (c, 4)\}$ not a basis of $\mathbb{R}^2$?'
            answer: '-2, 2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The set fails to be a basis exactly when the determinant $1 \cdot 4 - c \cdot c = 4 - c^2$ is $0$. This gives $c^2 = 4$, so $c = 2$ or $c = -2$.'
        constraints: "2 candidate vectors for R^2, 3 for R^3; small integer entries"
      - id: kp2
        name: Coordinates relative to a basis
        key_prerequisites: [linear-independence, subspaces-span]
        exemplars:
          - problem: 'Find the coordinates of $\mathbf{x} = (3, 1)$ relative to the basis $B = \{(1, 1), (1, -1)\}$.'
            answer: '(2, 1)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'We need $c_1(1, 1) + c_2(1, -1) = (3, 1)$, which gives $c_1 + c_2 = 3$ and $c_1 - c_2 = 1$. Adding the equations gives $2c_1 = 4$, so $c_1 = 2$ and $c_2 = 1$. Check: $2(1, 1) + (1, -1) = (3, 1)$.'
          - problem: 'Find the coordinates of $\mathbf{x} = (5, 4)$ relative to the basis $B = \{(1, 0), (1, 2)\}$.'
            answer: '(3, 2)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'We need $c_1(1, 0) + c_2(1, 2) = (5, 4)$. The second components give $2c_2 = 4$, so $c_2 = 2$. The first components give $c_1 + 2 = 5$, so $c_1 = 3$.'
          - problem: 'Find the coordinates of $\mathbf{x} = (7, -2)$ relative to the basis $B = \{(1, 1), (2, -1)\}$.'
            answer: '(1, 3)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'We need $c_1 + 2c_2 = 7$ and $c_1 - c_2 = -2$. Subtracting the second equation from the first gives $3c_2 = 9$, so $c_2 = 3$ and then $c_1 = 1$. Check: $(1, 1) + 3(2, -1) = (7, -2)$.'
          - problem: 'The coordinate vector of $\mathbf{x}$ relative to the ordered basis $B = \{(1, 2), (3, 1)\}$ is $(2, -1)$. Find $\mathbf{x}$.'
            answer: '(-1, 3)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'The coordinates are the coefficients of the basis vectors, so $\mathbf{x} = 2(1, 2) + (-1)(3, 1)$. Adding gives $(2, 4) + (-3, -1) = (-1, 3)$.'
          - problem: 'A mixture must contain $7$ kg of flour and $8$ kg of sugar. Bag $P$ holds $2$ kg of flour and $1$ kg of sugar, and bag $Q$ holds $1$ kg of flour and $2$ kg of sugar. The mixture is made from $a$ bags of $P$ and $b$ bags of $Q$. What is $(a, b)$?'
            answer: '(2, 3)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'The amounts add up as $a(2, 1) + b(1, 2) = (7, 8)$, so $2a + b = 7$ and $a + 2b = 8$. Doubling the first equation gives $4a + 2b = 14$, and subtracting the second equation gives $3a = 6$, so $a = 2$ and $b = 3$. Check: $2(2, 1) + 3(1, 2) = (7, 8)$.'
          - problem: 'The polynomials $1 + x$ and $1 - x$ form a basis of the polynomials of degree at most $1$. Find the coordinates of $1 + 3x$ in this basis.'
            answer: '(2, -1)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'Write $1 + 3x = c_1(1 + x) + c_2(1 - x)$. Matching constants gives $c_1 + c_2 = 1$, and matching the coefficients of $x$ gives $c_1 - c_2 = 3$. Adding the equations gives $c_1 = 2$, so $c_2 = -1$.'
          - problem: 'A drone has two thrusters. At setting $1$ the first thruster moves it at $(2, 0)$ m/s and the second thruster moves it at $(1, 3)$ m/s. A setting may be any real number, and a negative setting reverses the thruster. At which settings $(s_1, s_2)$ does the drone move at $(10, 6)$ m/s?'
            answer: '(4, 2)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'The velocity is $s_1(2, 0) + s_2(1, 3) = (10, 6)$. The second components give $3s_2 = 6$, so $s_2 = 2$. The first components give $2s_1 + 2 = 10$, so $s_1 = 4$.'
          - problem: 'Find the coordinates of $\mathbf{x} = (4, -9)$ relative to the basis $B = \{(2, 0), (0, 3)\}$.'
            answer: '(2, -3)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'We need $c_1(2, 0) + c_2(0, 3) = (4, -9)$, so $2c_1 = 4$ and $3c_2 = -9$. Dividing gives $c_1 = 2$ and $c_2 = -3$.'
        constraints: "2x2 solves with integer coordinates in -4..4"
      - id: kp3
        name: Dimension of subspaces
        key_prerequisites: [linear-independence, subspaces-span]
        exemplars:
          - problem: 'What is the dimension of $\operatorname{span}\{(1, 0, 1), (2, 0, 2), (0, 1, 0)\}$?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The second vector is $2(1, 0, 1)$, so it adds nothing to the span. The remaining vectors $(1, 0, 1)$ and $(0, 1, 0)$ are not multiples of each other, so they form a basis of the span, and the dimension is $2$.'
          - problem: 'The set $W$ of all $(x, y, z)$ in $\mathbb{R}^3$ with $x + y + z = 0$ and $y - z = 0$ is a subspace. What is $\dim W$?'
            answer: '1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The second equation gives $y = z$. Then the first equation gives $x = -2z$, so every solution is $z(-2, 1, 1)$. One free variable gives a basis with one vector, so $\dim W = 1$.'
          - problem: 'What is the dimension of $\operatorname{span}\{(1, 1, 0), (0, 1, 1), (1, 0, 1)\}$ in $\mathbb{R}^3$?'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The determinant of the matrix with these columns is $2$, which is not $0$, so the three vectors are independent. Three independent vectors in $\mathbb{R}^3$ span the whole space, so the dimension is $3$.'
          - problem: 'What is the dimension of $\operatorname{span}\{(1, 0, 0, 0), (1, 1, 0, 0), (1, 1, 1, 0), (1, 1, 1, 1)\}$ in $\mathbb{R}^4$?'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The matrix with these columns is triangular with $1$ on its diagonal, so its determinant is $1$ and the four vectors are independent. Four independent vectors in $\mathbb{R}^4$ span the whole space, so the dimension is $4$.'
          - problem: 'Three supplements contain vitamins A, B and C in the amounts $(2, 1, 3)$, $(4, 2, 6)$ and $(0, 1, 1)$ mg per tablet. Combinations of the tablets give a subspace of $\mathbb{R}^3$ of possible vitamin mixes. What is its dimension?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The second vector is $2(2, 1, 3)$, so it adds no new mix. The vectors $(2, 1, 3)$ and $(0, 1, 1)$ are not multiples of each other, so they form a basis of the subspace, and its dimension is $2$.'
          - problem: 'The solutions of $x + y + z + w = 0$ in $\mathbb{R}^4$ form a subspace. What is its dimension?'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Solve for $x = -y - z - w$. The variables $y$, $z$ and $w$ are free, so every solution is $y(-1, 1, 0, 0) + z(-1, 0, 1, 0) + w(-1, 0, 0, 1)$. These three vectors form a basis, so the dimension is $3$.'
          - problem: 'Ana says that $\{(1, 2), (3, 4), (5, 6)\}$ spans a subspace of dimension $3$, because it has three vectors. What is the dimension of the span?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The three vectors lie in $\mathbb{R}^2$, and a subspace of $\mathbb{R}^2$ has dimension at most $2$. The vectors $(1, 2)$ and $(3, 4)$ are independent, since $1 \cdot 4 - 3 \cdot 2 = -2 \neq 0$, so the span is all of $\mathbb{R}^2$ and its dimension is $2$.'
          - problem: 'Let $W$ be the span of the two vectors $(3, 6)$ and $(1, 2)$ in $\mathbb{R}^2$. What is the dimension of $W$?'
            answer: '1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Since $(3, 6) = 3(1, 2)$, the two vectors lie on one line through the origin. The span is that line, so its dimension is $1$.'
          - problem: 'A camera is restricted to positions $(x, y, z)$ with $x + 2y - z = 0$. What is the dimension of this set of positions?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Solve for $x = -2y + z$, with $y$ and $z$ free, so every position is $y(-2, 1, 0) + z(1, 0, 1)$. These two vectors are independent and span the set, so the dimension is $2$.'
        constraints: 'dimensions 0-4; redundant vectors are obvious multiples or sums; solution sets of one or two equations; contexts with possible mixes and positions'
    diagnostic_exemplar:
      problem: 'Find a basis for the subspace $W = \{(x, y, z) : x + 2y - z = 0\}$ of $\mathbb{R}^3$, give $\dim W$, and give the coordinates of $(0, 1, 2)$ relative to your basis.'
      answer: 'Basis {(-2, 1, 0), (1, 0, 1)} (any valid basis); dim W = 2; coordinates of (0, 1, 2) are (1, 2)'
      answer_contract: {kind: none}
      solution_sketch: 'Solving $x = -2y + z$ with $y = s$, $z = t$ gives $(-2, 1, 0)s + (1, 0, 1)t$; and $(0, 1, 2) = 1(-2, 1, 0) + 2(1, 0, 1)$.'
    anki_seeds:
      - front: 'A basis of a vector space is a set that is both...'
        back: 'linearly independent and spanning.'
        type: basic
      - front: 'The dimension of a vector space is the number of vectors in...'
        back: 'any basis (all bases have the same size).'
        type: basic

  - id: coordinates-relative-basis
    name: Coordinates Relative to a Basis
    core: true
    difficulty: 0.7
    drill: false
    answer_kind: numeric
    expected_time_secs: 210
    prerequisites:
      - id: basis-dimension
        weight: 0.7
        key: true
      - id: row-reduction-echelon-forms
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: From coordinates back to the vector
        key_prerequisites: [basis-dimension]
        try_first:
          problem: 'A cake mix uses $2$ scoops of ingredient A and $3$ scoops of ingredient B. One scoop of A holds $(1, 2)$ units of (sugar, fat), and one scoop of B holds $(1, 1)$ units. How many units of sugar are in the mix?'
          answer_contract: {"kind": "exact"}
          answer: '5'
          reveal: 'The sugar is $2 \cdot 1 + 3 \cdot 1 = 5$ units. The mix is the combination $2(1, 2) + 3(1, 1)$, so the numbers $2$ and $3$ act as the coordinates of the mix relative to the two scoops, which is the idea of this lesson.'
        exemplars:
          - problem: 'The coordinate vector of $\mathbf{x}$ relative to $B = \{(1, 1), (1, -1)\}$ is $[\mathbf{x}]_B = (2, 3)$. Find $\mathbf{x}$.'
            answer: '(5, -1)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'The coordinates are the coefficients of the basis vectors, so $\mathbf{x} = 2(1, 1) + 3(1, -1)$. Adding gives $(2, 2) + (3, -3) = (5, -1)$.'
          - problem: 'For the basis $B = \{(2, 0), (1, 3)\}$ a vector $\mathbf{x}$ has $[\mathbf{x}]_B = (1, -2)$. Find $\mathbf{x}$.'
            answer: '(0, -6)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'The coordinates are the coefficients of the basis vectors, so $\mathbf{x} = 1 \cdot (2, 0) + (-2)(1, 3)$. Adding gives $(2, 0) + (-2, -6) = (0, -6)$.'
          - problem: 'Relative to the basis $B = \{(1, 2), (2, 1)\}$ a vector $\mathbf{x}$ has coordinates $[\mathbf{x}]_B = (2, -3)$. Find $\mathbf{x}$.'
            answer: '(-4, 1)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'The coordinates are the coefficients of the basis vectors, so $\mathbf{x} = 2(1, 2) + (-3)(2, 1)$. Adding gives $(2, 4) + (-6, -3) = (-4, 1)$.'
          - problem: 'A robot has two drives. Running drive $1$ at level $1$ moves it at $(1, 0)$ m/s, and running drive $2$ at level $1$ moves it at $(1, 1)$ m/s. A negative level reverses the drive. The robot runs drive $1$ at level $3$ and drive $2$ at level $-2$. What is its velocity?'
            answer: '(1, -2)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'The velocity is the combination $3(1, 0) + (-2)(1, 1)$ of the two drive velocities. Adding gives $(3, 0) + (-2, -2) = (1, -2)$ m/s.'
          - problem: 'For the basis $B = \{(1, 0, 1), (0, 1, 1), (1, 1, 0)\}$ of $\mathbb{R}^3$ a vector $\mathbf{x}$ has $[\mathbf{x}]_B = (1, 2, -1)$. Find $\mathbf{x}$.'
            answer: '(0, 1, 3)'
            answer_contract: {"kind": "coordinates", "arity": 3}
            solution_sketch: 'The coordinates are the coefficients of the basis vectors, so $\mathbf{x} = 1(1, 0, 1) + 2(0, 1, 1) + (-1)(1, 1, 0)$. Adding gives $(1, 0, 1) + (0, 2, 2) + (-1, -1, 0) = (0, 1, 3)$.'
          - problem: 'A chemist mixes three stock solutions. One litre of the first contains $(1, 0, 1)$ g of (acid, base, salt), one litre of the second contains $(0, 1, 1)$ g, and one litre of the third contains $(1, 1, 0)$ g. She uses $2$ L of the first, $1$ L of the second and $3$ L of the third. How many grams of acid, base and salt does the mixture contain?'
            answer: '(5, 4, 3)'
            answer_contract: {"kind": "coordinates", "arity": 3}
            solution_sketch: 'The totals are given by the combination $2(1, 0, 1) + 1(0, 1, 1) + 3(1, 1, 0)$. Acid is $2 + 0 + 3 = 5$ g, base is $0 + 1 + 3 = 4$ g, and salt is $2 + 1 + 0 = 3$ g.'
          - problem: 'For the basis $B = \{(1, 3), (2, -1)\}$ the vector $\mathbf{x} = (7, 7)$ has $[\mathbf{x}]_B = (c, 2)$. Find $c$.'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The coordinates give $\mathbf{x} = c(1, 3) + 2(2, -1) = (c + 4, 3c - 2)$. The first component gives $c + 4 = 7$, so $c = 3$, and the second component agrees: $3 \cdot 3 - 2 = 7$.'
        constraints: "direct evaluation of the combination; entries in -6..6"
      - id: kp2
        name: Coordinates in R^2 bases
        key_prerequisites: [basis-dimension]
        exemplars:
          - problem: 'Find the coordinate vector $[\mathbf{x}]_B$ of $\mathbf{x} = (1, 5)$ relative to $B = \{(1, 1), (1, -1)\}$.'
            answer: '(3, -2)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'We need $c_1 + c_2 = 1$ and $c_1 - c_2 = 5$. Adding the equations gives $2c_1 = 6$, so $c_1 = 3$ and $c_2 = -2$. Check: $3(1, 1) - 2(1, -1) = (1, 5)$.'
          - problem: 'Find the coordinate vector $[\mathbf{x}]_B$ of $\mathbf{x} = (7, 4)$ relative to $B = \{(2, 1), (1, 1)\}$.'
            answer: '(3, 1)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'We need $2c_1 + c_2 = 7$ and $c_1 + c_2 = 4$. Subtracting the second equation from the first gives $c_1 = 3$, and then $c_2 = 1$.'
          - problem: 'Find the coordinate vector $[\mathbf{x}]_B$ of $\mathbf{x} = (-8, 6)$ relative to $B = \{(2, 0), (0, 3)\}$.'
            answer: '(-4, 2)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'We need $c_1(2, 0) + c_2(0, 3) = (-8, 6)$, so $2c_1 = -8$ and $3c_2 = 6$. Dividing gives $c_1 = -4$ and $c_2 = 2$.'
          - problem: 'Find the coordinate vector $[\mathbf{x}]_B$ of $\mathbf{x} = (5, 0)$ relative to $B = \{(1, 2), (3, 1)\}$.'
            answer: '(-1, 2)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'We need $c_1 + 3c_2 = 5$ and $2c_1 + c_2 = 0$. The second equation gives $c_2 = -2c_1$, so $c_1 - 6c_1 = 5$, which gives $c_1 = -1$ and $c_2 = 2$. Check: $-(1, 2) + 2(3, 1) = (5, 0)$.'
          - problem: 'Find the coordinate vector $[\mathbf{x}]_B$ of $\mathbf{x} = (-15, 10)$ relative to $B = \{(-1, 2), (3, -1)\}$.'
            answer: '(3, -4)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'We need $-c_1 + 3c_2 = -15$ and $2c_1 - c_2 = 10$. Doubling the first equation and adding the second gives $5c_2 = -20$, so $c_2 = -4$, and then $c_1 = 3$. Check: $3(-1, 2) - 4(3, -1) = (-15, 10)$.'
          - problem: 'A shop sells two fruit boxes. Box $P$ holds $2$ kg of apples and $1$ kg of pears, and box $Q$ holds $1$ kg of apples and $3$ kg of pears. A customer needs exactly $8$ kg of apples and $9$ kg of pears. How many boxes of $P$ and how many boxes of $Q$ does the order need?'
            answer: '(3, 2)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'With $a$ boxes of $P$ and $b$ boxes of $Q$ we need $2a + b = 8$ and $a + 3b = 9$. The first equation gives $b = 8 - 2a$, so $a + 24 - 6a = 9$, which gives $a = 3$ and $b = 2$.'
          - problem: 'A ship can sail only along two channels. In the first channel it travels at $(2, 1)$ km/h, and in the second channel it travels at $(-1, 1)$ km/h. It must reach the point $(1, 8)$ km from its start by sailing along each channel for some time. How many hours must it sail in the first channel and how many in the second?'
            answer: '(3, 5)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'With $c_1$ hours in the first channel and $c_2$ in the second, $2c_1 - c_2 = 1$ and $c_1 + c_2 = 8$. Adding the equations gives $3c_1 = 9$, so $c_1 = 3$ and $c_2 = 5$ hours.'
        constraints: "2x2 solves; coordinates are integers in -4..4, including negative coordinates"
      - id: kp3
        name: Coordinates in R^3 bases
        key_prerequisites: [basis-dimension, row-reduction-echelon-forms]
        exemplars:
          - problem: 'Find $[\mathbf{x}]_B$ for $\mathbf{x} = (3, 1, 4)$ and $B = \{(1, 0, 0), (1, 1, 0), (1, 1, 1)\}$.'
            answer: '(2, -3, 4)'
            answer_contract: {"kind": "coordinates", "arity": 3}
            solution_sketch: 'The components give $c_1 + c_2 + c_3 = 3$, $c_2 + c_3 = 1$ and $c_3 = 4$. The last equation gives $c_3 = 4$, then $c_2 = 1 - 4 = -3$, and $c_1 = 3 - (-3) - 4 = 2$.'
          - problem: 'Find $[\mathbf{x}]_B$ for $\mathbf{x} = (2, 3, 6)$ and $B = \{(1, 0, 1), (0, 1, 0), (0, 0, 2)\}$.'
            answer: '(2, 3, 2)'
            answer_contract: {"kind": "coordinates", "arity": 3}
            solution_sketch: 'The first components give $c_1 = 2$ and the second components give $c_2 = 3$. The third components give $c_1 + 2c_3 = 6$, so $2c_3 = 4$ and $c_3 = 2$.'
          - problem: 'The set $B = \{(1, 0, 0), (2, 1, 0), (0, 0, 3)\}$ is a basis of $\mathbb{R}^3$. Find the coordinates of $\mathbf{x} = (7, 3, 9)$ relative to $B$.'
            answer: '(1, 3, 3)'
            answer_contract: {"kind": "coordinates", "arity": 3}
            solution_sketch: 'The third components give $3c_3 = 9$, so $c_3 = 3$. The second components give $c_2 = 3$, and the first components give $c_1 + 2c_2 = 7$, so $c_1 = 1$.'
          - problem: 'Let $B = \{(1, 0, 0), (0, 1, 0), (2, 3, 1)\}$ and $\mathbf{x} = (5, 7, 4)$. Find the coordinates of $\mathbf{x}$ relative to $B$.'
            answer: '(-3, -5, 4)'
            answer_contract: {"kind": "coordinates", "arity": 3}
            solution_sketch: 'The third components give $c_3 = 4$. The second components give $c_2 + 3c_3 = 7$, so $c_2 = -5$, and the first components give $c_1 + 2c_3 = 5$, so $c_1 = -3$.'
          - problem: 'A chemist has three stock solutions. One litre of the first contains $(1, 0, 0)$ g of (acid, base, salt), one litre of the second contains $(1, 1, 0)$ g, and one litre of the third contains $(1, 1, 1)$ g. How many litres of each give a mixture with exactly $6$ g of acid, $3$ g of base and $2$ g of salt?'
            answer: '(3, 1, 2)'
            answer_contract: {"kind": "coordinates", "arity": 3}
            solution_sketch: 'With $c_1, c_2, c_3$ litres we need $c_1 + c_2 + c_3 = 6$, $c_2 + c_3 = 3$ and $c_3 = 2$. The salt equation gives $c_3 = 2$, then $c_2 = 3 - 2 = 1$ and $c_1 = 6 - 1 - 2 = 3$ litres.'
          - problem: 'A basis of $\mathbb{R}^3$ is $B = \{(2, 0, 0), (1, 3, 0), (0, 4, 5)\}$. Find the coordinates of $\mathbf{x} = (8, 10, 5)$ relative to $B$.'
            answer: '(3, 2, 1)'
            answer_contract: {"kind": "coordinates", "arity": 3}
            solution_sketch: 'The third components give $5c_3 = 5$, so $c_3 = 1$. The second components give $3c_2 + 4c_3 = 10$, so $c_2 = 2$, and the first components give $2c_1 + c_2 = 8$, so $c_1 = 3$.'
          - problem: 'A diet uses three foods. One serving of the first food has $(2, 0, 0)$ g of (protein, carbohydrate, fat), one serving of the second has $(1, 2, 0)$ g, and one serving of the third has $(1, 1, 3)$ g. How many servings of each food give $13$ g of protein, $7$ g of carbohydrate and $9$ g of fat?'
            answer: '(4, 2, 3)'
            answer_contract: {"kind": "coordinates", "arity": 3}
            solution_sketch: 'Servings $c_1, c_2, c_3$ must satisfy $2c_1 + c_2 + c_3 = 13$, $2c_2 + c_3 = 7$ and $3c_3 = 9$. The last equation gives $c_3 = 3$, then $2c_2 = 7 - 3 = 4$ so $c_2 = 2$, and $2c_1 = 13 - 2 - 3 = 8$ so $c_1 = 4$ servings.'
          - problem: 'Let $B = \{(1, 0, 0), (1, 2, 0), (1, 1, 3)\}$ and $\mathbf{x} = (7, 6, 12)$. What is the third coordinate of $\mathbf{x}$ relative to $B$?'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Only the third basis vector has a nonzero third component, so $3c_3 = 12$ and $c_3 = 4$. The other coordinates are $c_2 = 1$ and $c_1 = 2$, which check: $2(1, 0, 0) + (1, 2, 0) + 4(1, 1, 3) = (7, 6, 12)$.'
        constraints: "triangular-friendly bases so back-substitution works; integer coordinates"
    diagnostic_exemplar:
      problem: 'Find $[\mathbf{x}]_B$ for $\mathbf{x} = (4, 3, 5)$ and $B = \{(1, 0, 0), (1, 1, 0), (1, 1, 1)\}$.'
      answer: '(1, -2, 5)'
      solution_sketch: 'Reading from the last coordinate up: $c_3 = 5$, then $c_2 + c_3 = 3$ gives $c_2 = -2$, then $c_1 - 2 + 5 = 4$ gives $c_1 = 1$.'
    anki_seeds:
      - front: '$[\mathbf{x}]_B = (c_1, \dots, c_n)$ means...'
        back: '$\mathbf{x} = c_1\mathbf{b}_1 + \cdots + c_n\mathbf{b}_n$ for the basis vectors $\mathbf{b}_i$.'
        type: basic
      - front: 'Why are coordinates relative to a basis unique?'
        back: 'The basis is linearly independent, so two different coefficient lists cannot produce the same vector.'
        type: basic

  - id: change-of-basis
    name: Change of Basis
    core: true                 # re-audit R-38: the W8 "terminal technique" rationale dissolved — matrix-representation-in-basis (core, and through it similar-matrices) now builds on P_B / P_C^{-1}P_B
    difficulty: 0.75
    drill: false
    answer_kind: numeric
    expected_time_secs: 240
    prerequisites:
      - id: coordinates-relative-basis
        weight: 0.7
        key: true
      - id: matrix-inverses
        weight: 0.6
        key: true
    knowledge_points:
      - id: kp1
        name: The basis-to-standard matrix
        key_prerequisites: [coordinates-relative-basis]
        exemplars:
          - problem: 'For the basis $B = \{(2, 1), (1, 1)\}$ of $\mathbb{R}^2$, the vector $\mathbf{x}$ has $[\mathbf{x}]_B = (1, 1)$. Find $\mathbf{x}$.'
            answer: '(3, 2)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'Place the basis vectors as columns, so $P_B = \begin{pmatrix}2&1\\1&1\end{pmatrix}$, and multiply. Then $\mathbf{x} = P_B(1, 1) = 1(2, 1) + 1(1, 1) = (3, 2)$.'
          - problem: 'For the basis $B = \{(3, 1), (2, -1)\}$ of $\mathbb{R}^2$, write the matrix $P_B$ for which $\mathbf{x} = P_B[\mathbf{x}]_B$ holds for every $\mathbf{x}$.'
            answer: '[[3,2],[1,-1]]'
            answer_contract: {"kind": "matrix", "rows": 2, "cols": 2}
            solution_sketch: 'The columns of $P_B$ are the basis vectors in order, so column $1$ is $(3, 1)$ and column $2$ is $(2, -1)$. Reading row by row, the first row is $(3, 2)$ and the second row is $(1, -1)$.'
          - problem: 'For the basis $B = \{(4, 1), (1, 2)\}$ of $\mathbb{R}^2$, the vector $\mathbf{x}$ has $[\mathbf{x}]_B = (2, 1)$. Find $\mathbf{x}$.'
            answer: '(9, 4)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'The matrix $P_B$ has the columns $(4, 1)$ and $(1, 2)$, so $\mathbf{x} = P_B(2, 1) = 2(4, 1) + 1(1, 2)$. Adding gives $(8 + 1, 2 + 2) = (9, 4)$.'
          - problem: 'For the basis $B = \{(1, 0, 1), (0, 1, 1), (1, 1, 0)\}$ of $\mathbb{R}^3$, the vector $\mathbf{x}$ has $[\mathbf{x}]_B = (1, 2, 3)$. Find $\mathbf{x}$.'
            answer: '(4, 5, 3)'
            answer_contract: {"kind": "coordinates", "arity": 3}
            solution_sketch: 'The matrix $P_B$ has the basis vectors as columns, so $\mathbf{x} = 1(1, 0, 1) + 2(0, 1, 1) + 3(1, 1, 0)$. Adding componentwise gives $(1 + 0 + 3,\ 0 + 2 + 3,\ 1 + 2 + 0) = (4, 5, 3)$.'
          - problem: 'For the basis $B = \{(2, 0), (c, 1)\}$ of $\mathbb{R}^2$, a vector $\mathbf{x} = (8, 3)$ has $[\mathbf{x}]_B = (1, 3)$. Find $c$.'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Since $\mathbf{x} = P_B[\mathbf{x}]_B$, we have $(8, 3) = 1 \cdot (2, 0) + 3 \cdot (c, 1) = (2 + 3c, 3)$. The first component gives $2 + 3c = 8$, so $c = 2$, and the second component $3 = 3$ agrees.'
          - problem: 'For the basis $B = \{(1, 1, 0), (0, 1, 1), (1, 0, 1)\}$ of $\mathbb{R}^3$, write the matrix $P_B$ for which $\mathbf{x} = P_B[\mathbf{x}]_B$ holds for every $\mathbf{x}$.'
            answer: '[[1,0,1],[1,1,0],[0,1,1]]'
            answer_contract: {"kind": "matrix", "rows": 3, "cols": 3}
            solution_sketch: 'The columns of $P_B$ are the basis vectors in order: $(1, 1, 0)$, $(0, 1, 1)$ and $(1, 0, 1)$. Reading row by row, the first row is $(1, 0, 1)$, the second is $(1, 1, 0)$ and the third is $(0, 1, 1)$.'
          - problem: 'A sheared drawing grid has two axes. One step along the first axis moves a point by $(2, 1)$ cm, and one step along the second axis moves it by $(1, 3)$ cm. A point has grid coordinates $(3, 2)$, which means $3$ steps along the first axis and $2$ steps along the second. What is its position in centimeters?'
            answer: '(8, 9)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'The position is $P_B(3, 2)$ with $P_B = \begin{pmatrix}2&1\\1&3\end{pmatrix}$. This gives $3(2, 1) + 2(1, 3) = (6 + 2, 3 + 6) = (8, 9)$ cm.'
          - problem: 'In a city with diagonal avenues, one block north-east is the displacement $(1, 1)$ km and one block south-east is $(1, -1)$ km, where a displacement is written (east, north). A courier goes $4$ blocks north-east and then $3$ blocks south-east. What is the courier''s displacement?'
            answer: '(7, 1)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'The displacement is $P_B(4, 3)$, where $P_B$ has the columns $(1, 1)$ and $(1, -1)$. This gives $4(1, 1) + 3(1, -1) = (4 + 3, 4 - 3) = (7, 1)$ km.'
        constraints: 'columns of P_B are the basis vectors; one matrix-vector product; matrices up to 3x3 with integer entries; contexts with sheared axes'
      - id: kp2
        name: Standard-to-basis via the inverse
        key_prerequisites: [coordinates-relative-basis, matrix-inverses]
        exemplars:
          - problem: 'For $B = \{(1, 0), (1, 2)\}$, use $[\mathbf{x}]_B = P_B^{-1}\mathbf{x}$ to find the coordinates of $\mathbf{x} = (5, 4)$.'
            answer: '(3, 2)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'The matrix $P_B = \begin{pmatrix}1&1\\0&2\end{pmatrix}$ has determinant $2$, so $P_B^{-1} = \begin{pmatrix}1&-1/2\\0&1/2\end{pmatrix}$. Then $P_B^{-1}(5, 4) = (5 - 2, 2) = (3, 2)$.'
          - problem: 'For $B = \{(1, 1), (1, -1)\}$, use $[\mathbf{x}]_B = P_B^{-1}\mathbf{x}$ to find the coordinates of $\mathbf{x} = (7, 3)$.'
            answer: '(5, 2)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'The matrix $P_B = \begin{pmatrix}1&1\\1&-1\end{pmatrix}$ has determinant $-2$, and its inverse is $\frac{1}{2}\begin{pmatrix}1&1\\1&-1\end{pmatrix}$. Then $[\mathbf{x}]_B = \frac{1}{2}(7 + 3,\ 7 - 3) = (5, 2)$.'
          - problem: 'The vector $\mathbf{x} = (11, 19)$ is written in the basis $B = \{(1, 2), (3, 5)\}$. Find its coordinates $[\mathbf{x}]_B$ with the help of $P_B^{-1}$.'
            answer: '(2, 3)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'The matrix $P_B = \begin{pmatrix}1&3\\2&5\end{pmatrix}$ has determinant $5 - 6 = -1$, so $P_B^{-1} = \begin{pmatrix}-5&3\\2&-1\end{pmatrix}$. Then $P_B^{-1}(11, 19) = (-55 + 57,\ 22 - 19) = (2, 3)$.'
          - problem: 'Let $B = \{(1, 2), (2, 5)\}$ and $\mathbf{x} = (11, 26)$. What is the second coordinate of $[\mathbf{x}]_B$?'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The matrix $P_B = \begin{pmatrix}1&2\\2&5\end{pmatrix}$ has determinant $1$, so $P_B^{-1} = \begin{pmatrix}5&-2\\-2&1\end{pmatrix}$. Then $P_B^{-1}(11, 26) = (55 - 52,\ -22 + 26) = (3, 4)$, and the second coordinate is $4$.'
          - problem: 'For $B = \{(1, 3), (2, 4)\}$, find the matrix $P_B^{-1}$ that converts standard coordinates into $B$-coordinates.'
            answer: '[[-2,1],[3/2,-1/2]]'
            answer_contract: {"kind": "matrix", "rows": 2, "cols": 2}
            solution_sketch: 'The matrix $P_B = \begin{pmatrix}1&2\\3&4\end{pmatrix}$ has determinant $4 - 6 = -2$. The $2 \times 2$ inverse formula gives $P_B^{-1} = \frac{1}{-2}\begin{pmatrix}4&-2\\-3&1\end{pmatrix} = \begin{pmatrix}-2&1\\3/2&-1/2\end{pmatrix}$.'
          - problem: 'Sam says that $[\mathbf{x}]_B = (3, 2)$ for $\mathbf{x} = (9, 5)$ and $B = \{(2, 1), (1, 1)\}$. What are the correct coordinates?'
            answer: '(4, 1)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'Sam''s coordinates give $3(2, 1) + 2(1, 1) = (8, 5)$, which is not $(9, 5)$. The matrix $P_B = \begin{pmatrix}2&1\\1&1\end{pmatrix}$ has determinant $1$ and $P_B^{-1} = \begin{pmatrix}1&-1\\-1&2\end{pmatrix}$, so $[\mathbf{x}]_B = (9 - 5,\ -9 + 10) = (4, 1)$.'
          - problem: 'On a sheared grid the first axis step is $(2, 1)$ cm and the second axis step is $(1, 3)$ cm. A point lies at $(5, 10)$ cm. What are its grid coordinates?'
            answer: '(1, 3)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'The matrix $P_B = \begin{pmatrix}2&1\\1&3\end{pmatrix}$ has determinant $6 - 1 = 5$, so $P_B^{-1} = \frac{1}{5}\begin{pmatrix}3&-1\\-1&2\end{pmatrix}$. Then $P_B^{-1}(5, 10) = \frac{1}{5}(15 - 10,\ -5 + 20) = (1, 3)$.'
          - problem: 'In a city with diagonal avenues, one block north-east is $(1, 1)$ km and one block south-east is $(1, -1)$ km, where a displacement is written (east, north). A courier ends $7$ km east and $1$ km north of the start, after going some blocks north-east and then some blocks south-east. How many blocks did the north-east leg and the south-east leg have?'
            answer: '(4, 3)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'The matrix $P_B$ has the columns $(1, 1)$ and $(1, -1)$, and $P_B^{-1} = \frac{1}{2}\begin{pmatrix}1&1\\1&-1\end{pmatrix}$. Then $[\mathbf{x}]_B = \frac{1}{2}(7 + 1,\ 7 - 1) = (4, 3)$ blocks.'
        constraints: "2x2 bases with determinant +-1 or +-2 so the inverse is clean"
      - id: kp3
        name: Converting between two bases
        key_prerequisites: [coordinates-relative-basis, matrix-inverses]
        exemplars:
          - problem: 'Let $B = \{(1, 1), (1, -1)\}$ and $C = \{(1, 0), (1, 1)\}$. If $[\mathbf{x}]_B = (1, 2)$, find $[\mathbf{x}]_C$.'
            answer: '(4, -1)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'First $\mathbf{x} = 1(1, 1) + 2(1, -1) = (3, -1)$. Then $c_1(1, 0) + c_2(1, 1) = (3, -1)$ gives $c_2 = -1$ from the second components and $c_1 = 3 - (-1) = 4$ from the first.'
          - problem: 'Let $B = \{(1, 1), (1, -1)\}$ and $C = \{(1, 2), (1, 3)\}$. If $[\mathbf{x}]_B = (2, 1)$, find $[\mathbf{x}]_C$.'
            answer: '(8, -5)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'First $\mathbf{x} = 2(1, 1) + 1(1, -1) = (3, 1)$. Then $a(1, 2) + b(1, 3) = (3, 1)$ gives $a + b = 3$ and $2a + 3b = 1$. Subtracting twice the first equation from the second gives $b = -5$, and then $a = 8$.'
          - problem: 'Let $B = \{(1, 1), (1, -1)\}$ and $C = \{(1, 2), (1, 3)\}$. If $[\mathbf{x}]_C = (2, 1)$, find $[\mathbf{x}]_B$.'
            answer: '(5, -2)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'First $\mathbf{x} = 2(1, 2) + 1(1, 3) = (3, 7)$. Then $a(1, 1) + b(1, -1) = (3, 7)$ gives $a + b = 3$ and $a - b = 7$. Adding the equations gives $2a = 10$, so $a = 5$, and then $b = -2$.'
          - problem: 'For $B = \{(1, 1), (1, -1)\}$ and $C = \{(1, 2), (1, 3)\}$, find the matrix $P$ with $[\mathbf{x}]_C = P[\mathbf{x}]_B$ for every $\mathbf{x}$.'
            answer: '[[2,4],[-1,-3]]'
            answer_contract: {"kind": "matrix", "rows": 2, "cols": 2}
            solution_sketch: 'The matrix is $P = P_C^{-1}P_B$. Here $P_B = \begin{pmatrix}1&1\\1&-1\end{pmatrix}$ and $P_C^{-1} = \begin{pmatrix}3&-1\\-2&1\end{pmatrix}$, so $P = \begin{pmatrix}3 - 1&3 + 1\\-2 + 1&-2 - 1\end{pmatrix} = \begin{pmatrix}2&4\\-1&-3\end{pmatrix}$.'
          - problem: 'Let $B = \{(1, 1, 0), (0, 1, 1), (1, 0, 0)\}$ and $C = \{(1, 0, 0), (1, 1, 0), (1, 1, 1)\}$. If $[\mathbf{x}]_B = (1, 2, 3)$, find $[\mathbf{x}]_C$.'
            answer: '(1, 1, 2)'
            answer_contract: {"kind": "coordinates", "arity": 3}
            solution_sketch: 'First $\mathbf{x} = 1(1, 1, 0) + 2(0, 1, 1) + 3(1, 0, 0) = (4, 3, 2)$. Then $a(1, 0, 0) + b(1, 1, 0) + c(1, 1, 1) = (a + b + c,\ b + c,\ c)$, so $c = 2$, then $b = 3 - 2 = 1$, and $a = 4 - 1 - 2 = 1$.'
          - problem: 'Let $B = \{(1, 0), (2, 1)\}$ and $C = \{(1, 1), (1, 2)\}$. If $[\mathbf{x}]_B = (2, 1)$, find $[\mathbf{x}]_C$.'
            answer: '(7, -3)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'First $\mathbf{x} = 2(1, 0) + 1(2, 1) = (4, 1)$. Then $a(1, 1) + b(1, 2) = (4, 1)$ gives $a + b = 4$ and $a + 2b = 1$. Subtracting the first equation from the second gives $b = -3$, and then $a = 7$.'
          - problem: 'Shop $1$ packs fruit in boxes $P_1$ and $P_2$, where $P_1$ holds $(2, 1)$ kg and $P_2$ holds $(1, 1)$ kg of (apples, pears). Shop $2$ uses boxes $Q_1$ holding $(1, 0)$ kg and $Q_2$ holding $(1, 1)$ kg. An order for shop $1$ is $3$ boxes of $P_1$ and $2$ boxes of $P_2$. How many boxes of $Q_1$ and of $Q_2$ hold the same fruit?'
            answer: '(3, 5)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'The order contains $3(2, 1) + 2(1, 1) = (8, 5)$ kg of (apples, pears). In shop $2$ boxes, $c_1(1, 0) + c_2(1, 1) = (8, 5)$ gives $c_2 = 5$ from the pears and $c_1 = 8 - 5 = 3$ from the apples.'
          - problem: 'Two surveyors map a field with different axes. Surveyor $1$ measures in steps along $(1, 1)$ and $(1, -1)$ meters, and surveyor $2$ measures in steps along $(1, 2)$ and $(1, 3)$ meters. Surveyor $1$ marks a stake at coordinates $(3, 2)$. What coordinates does surveyor $2$ give the same stake?'
            answer: '(14, -9)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'The stake is at $3(1, 1) + 2(1, -1) = (5, 1)$ meters. Then $a(1, 2) + b(1, 3) = (5, 1)$ gives $a + b = 5$ and $2a + 3b = 1$, so $b = 1 - 10 = -9$ and $a = 5 + 9 = 14$.'
          - problem: 'Shop $1$ uses boxes $P_1$ holding $(2, 1)$ kg and $P_2$ holding $(1, 1)$ kg of (apples, pears), and shop $2$ uses boxes $Q_1$ holding $(1, 0)$ kg and $Q_2$ holding $(1, 1)$ kg. A customer of shop $2$ buys $4$ boxes of $Q_1$ and $6$ boxes of $Q_2$. How many boxes of $P_1$ and of $P_2$ hold the same fruit?'
            answer: '(4, 2)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'The order contains $4(1, 0) + 6(1, 1) = (10, 6)$ kg of (apples, pears). Then $a(2, 1) + b(1, 1) = (10, 6)$ gives $2a + b = 10$ and $a + b = 6$, so subtracting gives $a = 4$ and then $b = 2$.'
        constraints: "route through standard coordinates; all coordinates small integers"
    diagnostic_exemplar:
      problem: '$B = \{(1, 1), (1, -1)\}$ and $C = \{(1, 0), (1, 1)\}$. If $[\mathbf{x}]_B = (3, 1)$, find $[\mathbf{x}]_C$.'
      answer: '(2, 2)'
      solution_sketch: '$\mathbf{x} = P_B(3, 1) = 3(1,1) + (1,-1) = (4, 2)$; then $[\mathbf{x}]_C = P_C^{-1}\mathbf{x}$ solves $a(1,0) + b(1,1) = (4,2)$, giving $b = 2$, $a = 2$.'
    anki_seeds:
      - front: 'The change-of-coordinates matrix $P_B$ (basis $B$ to standard) has which columns?'
        back: 'The basis vectors of $B$ themselves.'
        type: basic
      - front: 'To convert coordinates from basis $B$ to basis $C$, multiply by...'
        back: '$P_C^{-1}P_B$ (through standard coordinates).'
        type: basic

  - id: null-column-space-rank
    name: Null Space, Column Space, and Rank
    core: true
    difficulty: 0.7
    drill: false
    answer_kind: numeric
    expected_time_secs: 240
    prerequisites:
      - id: basis-dimension
        weight: 0.6
        key: true
      - id: solution-sets-free-variables
        weight: 0.6
        key: true
      - id: matrix-vector-equations
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: Null space
        key_prerequisites: [solution-sets-free-variables]
        try_first:
          problem: 'Let $A = \begin{pmatrix}1&2\\3&6\end{pmatrix}$ and $\mathbf{x} = (2, -1)$. What is the first entry of $A\mathbf{x}$?'
          answer_contract: {"kind": "exact"}
          answer: '0'
          reveal: 'The first entry is $1 \cdot 2 + 2 \cdot (-1) = 0$, and the second entry is $3 \cdot 2 + 6 \cdot (-1) = 0$ as well. So $A\mathbf{x} = \mathbf{0}$, and a vector with this property belongs to the null space of $A$, the set this lesson describes.'
        exemplars:
          - problem: 'Find the vector in the null space of $A = \begin{pmatrix}1&2\\2&4\end{pmatrix}$ whose second entry is $1$.'
            answer: '(-2, 1)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'We need $A\mathbf{x} = \mathbf{0}$, and the second row is twice the first, so only $x_1 + 2x_2 = 0$ remains. With $x_2 = 1$ we get $x_1 = -2$, so the vector is $(-2, 1)$. Check: $1 \cdot (-2) + 2 \cdot 1 = 0$ and $2 \cdot (-2) + 4 \cdot 1 = 0$.'
          - problem: 'Find the vector in the null space of $A = \begin{pmatrix}3&-6\\-1&2\end{pmatrix}$ whose second entry is $1$.'
            answer: '(2, 1)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'The second row is $-\frac{1}{3}$ times the first row, so only $3x_1 - 6x_2 = 0$ remains, which gives $x_1 = 2x_2$. With $x_2 = 1$ the vector is $(2, 1)$.'
          - problem: 'Find the vector in the null space of $A = \begin{pmatrix}1&4&3\\3&12&7\end{pmatrix}$ whose second entry is $1$.'
            answer: '(-4, 1, 0)'
            answer_contract: {"kind": "coordinates", "arity": 3}
            solution_sketch: 'Subtracting $3$ times row $1$ from row $2$ gives $(0, 0, -2)$, so $x_3 = 0$. Row $1$ then gives $x_1 + 4x_2 = 0$, and with $x_2 = 1$ we get $x_1 = -4$. The vector is $(-4, 1, 0)$.'
          - problem: 'Is $\mathbf{v} = (2, 3)$ in the null space of $A = \begin{pmatrix}1&-1\\2&-2\end{pmatrix}$?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "it is", "it is in the null space", "in the null space"], ["no", "it is not", "it is not in the null space", "not in the null space"]]}
            solution_sketch: 'A vector is in the null space exactly when $A\mathbf{v} = \mathbf{0}$. Here $A\mathbf{v} = (1 \cdot 2 - 1 \cdot 3,\ 2 \cdot 2 - 2 \cdot 3) = (-1, -2)$, which is not the zero vector, so $\mathbf{v}$ is not in the null space.'
          - problem: 'What is the dimension of the null space of $A = \begin{pmatrix}1&4&2\\3&12&5\end{pmatrix}$?'
            answer: '1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Subtracting $3$ times row $1$ from row $2$ gives $(0, 0, -1)$, so columns $1$ and $3$ hold the pivots. There are $3$ columns and $2$ pivots, so there is $1$ free variable, and the null space has dimension $1$.'
          - problem: 'For which value of $t$ does the vector $(t, 1, 0)$ lie in the null space of $A = \begin{pmatrix}1&3&2\\2&6&5\end{pmatrix}$?'
            answer: '-3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The vector is in the null space exactly when $A(t, 1, 0) = (0, 0)$. The first row gives $t + 3 + 0 = 0$, so $t = -3$, and the second row gives $2t + 6 + 0 = 0$, which is the same equation. Both rows agree, so $t = -3$.'
          - problem: 'In the reaction $a\,\mathrm{H}_2 + b\,\mathrm{O}_2 \to c\,\mathrm{H}_2\mathrm{O}$ the hydrogen atoms and the oxygen atoms must balance, and this means $A\mathbf{v} = \mathbf{0}$ for $\mathbf{v} = (a, b, c)$ and $A = \begin{pmatrix}2&0&-2\\0&2&-1\end{pmatrix}$. Find the vector in the null space of $A$ with $c = 2$.'
            answer: '(2, 1, 2)'
            answer_contract: {"kind": "coordinates", "arity": 3}
            solution_sketch: 'The first row gives $2a - 2c = 0$, so $a = c$, and the second row gives $2b - c = 0$, so $b = c/2$. With $c = 2$ we get $a = 2$ and $b = 1$. These are the coefficients of $2\mathrm{H}_2 + \mathrm{O}_2 \to 2\mathrm{H}_2\mathrm{O}$.'
          - problem: 'Burning methane gives $a\,\mathrm{CH}_4 + b\,\mathrm{O}_2 \to c\,\mathrm{CO}_2 + d\,\mathrm{H}_2\mathrm{O}$. Balancing the carbon, hydrogen and oxygen atoms means $A\mathbf{v} = \mathbf{0}$ for $\mathbf{v} = (a, b, c, d)$ and $A = \begin{pmatrix}1&0&-1&0\\4&0&0&-2\\0&2&-2&-1\end{pmatrix}$. Find the vector in the null space of $A$ whose entries are the smallest positive whole numbers.'
            answer: '(1, 2, 1, 2)'
            answer_contract: {"kind": "coordinates", "arity": 4}
            solution_sketch: 'The first row gives $a = c$ and the second row gives $d = 2a$. The third row gives $2b = 2c + d = 4a$, so $b = 2a$. The smallest positive whole numbers come from $a = 1$, which gives $(1, 2, 1, 2)$.'
          - problem: 'Is $\mathbf{v} = (1, 1, -1)$ in the null space of $A = \begin{pmatrix}1&2&3\\2&4&6\end{pmatrix}$?'
            answer: 'yes'
            answer_contract: {"kind": "label", "options": [["yes", "it is", "it is in the null space", "in the null space"], ["no", "it is not", "it is not in the null space", "not in the null space"]]}
            solution_sketch: 'A vector is in the null space exactly when $A\mathbf{v} = \mathbf{0}$. Here $A\mathbf{v} = (1 + 2 - 3,\ 2 + 4 - 6) = (0, 0)$, so $\mathbf{v}$ is in the null space.'
        constraints: 'matrices up to 3x4; 1-dimensional null spaces ask for the vector with a stated entry; verdict items give Av; chemical balance items name the matrix'
      - id: kp2
        name: Column space and pivot columns
        key_prerequisites: [basis-dimension, matrix-vector-equations]
        exemplars:
          - problem: 'Which columns of $A = \begin{pmatrix}1&2&3\\2&4&8\end{pmatrix}$ form a basis for its column space?'
            answer: '1, 3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Subtracting $2$ times row $1$ from row $2$ gives $(0, 0, 2)$, so the pivots are in columns $1$ and $3$. The pivot columns of the original matrix form a basis for the column space, so the answer is columns $1$ and $3$.'
          - problem: 'What is the rank of $A = \begin{pmatrix}1&2\\2&4\end{pmatrix}$?'
            answer: '1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Subtracting $2$ times row $1$ from row $2$ gives the zero row, so the reduced matrix has only $1$ pivot. The rank is the number of pivots, so the rank is $1$.'
          - problem: 'Find the rank of $A = \begin{pmatrix}2&4&6\\1&2&5\end{pmatrix}$.'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Subtracting $\frac{1}{2}$ of row $1$ from row $2$ gives $(0, 0, 2)$. The matrix has pivots in columns $1$ and $3$, so its rank is $2$.'
          - problem: 'Which columns of $A = \begin{pmatrix}1&2&4\\2&5&7\end{pmatrix}$ are its pivot columns?'
            answer: '1, 2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Subtracting $2$ times row $1$ from row $2$ gives $(0, 1, -1)$. The pivots are in columns $1$ and $2$, so these are the pivot columns.'
          - problem: 'Is $\mathbf{b} = (5, 9)$ in the column space of $A = \begin{pmatrix}1&2&3\\2&4&7\end{pmatrix}$?'
            answer: 'yes'
            answer_contract: {"kind": "label", "options": [["yes", "it is", "it is in the column space", "in the column space"], ["no", "it is not", "it is not in the column space", "not in the column space"]]}
            solution_sketch: 'The vector $\mathbf{b}$ is in the column space when it is a combination of the columns of $A$. Here $8(1, 2) - (3, 7) = (5, 9)$, so $\mathbf{b}$ is a combination of columns $1$ and $3$, and it is in the column space.'
          - problem: 'Is $\mathbf{b} = (1, 3)$ in the column space of $A = \begin{pmatrix}1&2\\2&4\end{pmatrix}$?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "it is", "it is in the column space", "in the column space"], ["no", "it is not", "it is not in the column space", "not in the column space"]]}
            solution_sketch: 'Both columns of $A$ are multiples of $(1, 2)$, so every vector in the column space has the form $t(1, 2)$. The vector $(1, 3)$ would need $t = 1$ and $2t = 3$, which is impossible, so it is not in the column space.'
          - problem: 'A paint lab has three dyes. One drop of each dye adds $(1, 2)$, $(2, 4)$ and $(3, 6)$ units of (red, green). Mixtures are combinations of the dyes. What is the dimension of the set of all (red, green) amounts that the lab can mix?'
            answer: '1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The three dye vectors are the columns of $A = \begin{pmatrix}1&2&3\\2&4&6\end{pmatrix}$, and every column is a multiple of $(1, 2)$. The second row is twice the first row and reduces to zero, so $A$ has $1$ pivot, and the rank, which is the dimension of the column space, is $1$.'
          - problem: 'A teacher stores the marks of three students in a table with the columns Test $1$, Test $2$ and Total, where Total is the sum of the two tests. The table is $A = \begin{pmatrix}3&5&8\\4&2&6\\1&6&7\end{pmatrix}$. What is the rank of $A$?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The third column equals the sum of the first two, so it adds nothing to the column space. The first two columns are independent, so $A$ has $2$ pivots and the rank is $2$.'
          - problem: 'For which value of $k$ does $A = \begin{pmatrix}1&2\\3&k\end{pmatrix}$ have rank $1$?'
            answer: '6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The rank is $1$ exactly when the second row is a multiple of the first row. Since $3 = 3 \cdot 1$, we need $k = 3 \cdot 2 = 6$.'
        constraints: 'use the original columns, not the reduced ones, for a basis; matrices up to 3x3; rank at most 3; pivot columns are named by their numbers'
      - id: kp3
        name: The rank-nullity theorem
        key_prerequisites: [basis-dimension, solution-sets-free-variables]
        exemplars:
          - problem: '$A$ is a $3 \times 5$ matrix of rank $2$. What is the dimension of its null space?'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The rank-nullity theorem says that $\operatorname{rank}(A) + \operatorname{nullity}(A) = n$, where $n = 5$ is the number of columns. So the nullity is $5 - 2 = 3$.'
          - problem: '$A$ is a $4 \times 4$ matrix and the equation $A\mathbf{x} = \mathbf{0}$ has only the trivial solution. What is the rank of $A$?'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Only the trivial solution means that the null space has dimension $0$. The rank-nullity theorem then gives $\operatorname{rank}(A) = 4 - 0 = 4$.'
          - problem: '$A$ is a $2 \times 5$ matrix whose null space has dimension $4$. What is the rank of $A$?'
            answer: '1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The theorem says that $\operatorname{rank}(A) + \operatorname{nullity}(A)$ equals the number of columns, which is $5$ here. So $\operatorname{rank}(A) + 4 = 5$ and the rank is $1$.'
          - problem: 'A linear transformation $T: \mathbb{R}^5 \to \mathbb{R}^3$ has a kernel of dimension $3$. What is the rank of $T$?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The matrix of $T$ has $5$ columns, so the rank plus the dimension of the kernel is $5$. Since the kernel has dimension $3$, the rank is $5 - 3 = 2$.'
          - problem: 'A survey gives a consistent system of $6$ equations in $8$ unknown prices, and only $3$ of the equations are independent, so the coefficient matrix has rank $3$. How many of the prices can be chosen freely?'
            answer: '5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The coefficient matrix has $8$ columns and rank $3$. By the rank-nullity theorem, the number of free variables is $8 - 3 = 5$, and these are the prices that can be chosen freely.'
          - problem: 'The null space of a $5 \times 5$ matrix $A$ is a line through the origin. What is the rank of $A$?'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A line through the origin is a subspace of dimension $1$, so the nullity of $A$ is $1$. The matrix has $5$ columns, so the rank is $5 - 1 = 4$.'
          - problem: 'The atom-balance matrix of a chemical reaction has one column for each of its $5$ substances and has rank $3$. Every set of balancing coefficients is a vector in the null space of this matrix. What is the dimension of the space of balancing coefficients?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The dimension of the null space is the nullity of the matrix. By the rank-nullity theorem, the nullity is $5 - 3 = 2$, so there are $2$ independent ways to balance the reaction.'
          - problem: 'Can a $3 \times 5$ matrix have a null space of dimension $1$?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "it can", "possible"], ["no", "it cannot", "it can not", "impossible", "not possible", "no, it cannot", "no, it can not"]]}
            solution_sketch: 'A $3 \times 5$ matrix has only $3$ rows, so its rank is at most $3$. The nullity is $5$ minus the rank, so it is at least $2$, and a null space of dimension $1$ is impossible.'
          - problem: 'What is the smallest possible dimension of the null space of a $3 \times 5$ matrix?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The rank of a $3 \times 5$ matrix is at most $3$, and the nullity is $5$ minus the rank. The smallest nullity comes from the largest rank, which gives $5 - 3 = 2$.'
          - problem: '$A$ is a $6 \times 4$ matrix of rank $4$. What is the dimension of its null space?'
            answer: '0'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The matrix has $4$ columns, so the rank plus the nullity equals $4$. With rank $4$ the nullity is $4 - 4 = 0$, so the null space contains only the zero vector.'
        constraints: 'sizes up to 8 columns; ask for rank or nullity given the other; contexts with free variables and balance equations'
    diagnostic_exemplar:
      problem: 'For $A = \begin{pmatrix}1&2&3\\2&4&8\end{pmatrix}$, find the rank, a basis for the null space, and check the rank-nullity theorem.'
      answer: 'Rank 2; null space basis {(-2, 1, 0)}; rank + nullity = 2 + 1 = 3, the number of columns'
      answer_contract: {kind: none}
      solution_sketch: 'Row reduction gives pivots in columns $1$ and $3$, so the rank is $2$ and $x_2$ is free with $x_3 = 0$ and $x_1 = -2x_2$.'
    anki_seeds:
      - front: 'Rank-nullity theorem for an $m \times n$ matrix $A$?'
        back: '$\mathrm{rank}(A) + \dim \mathrm{Nul}(A) = n$ (the number of columns).'
        type: basic
      - front: 'A basis for $\mathrm{Col}(A)$ is given by which columns?'
        back: 'The pivot columns of the ORIGINAL matrix $A$.'
        type: basic

  - id: rank-nullity-applications
    name: Applying Rank and Nullity
    core: false                # applications leaf topic
    difficulty: 0.7
    drill: false
    answer_kind: numeric
    expected_time_secs: 180
    prerequisites:
      - id: null-column-space-rank
        weight: 0.8
        key: true
      - id: determinants-2x2
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: Reading rank and nullity from pivots
        key_prerequisites: [null-column-space-rank]
        exemplars:
          - problem: 'The echelon form of a $3 \times 5$ matrix $A$ has $2$ pivots. What is the nullity of $A$?'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The rank of $A$ equals the number of pivots, so $\operatorname{rank}(A) = 2$. The matrix has $5$ columns, and rank-nullity gives nullity $= 5 - 2 = 3$. The nullity of $A$ is $3$.'
          - problem: '$A$ is a $5 \times 3$ matrix, and its echelon form has a pivot in every column. What is the rank of $A$?'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Each of the $3$ columns holds one pivot, so the echelon form has $3$ pivots. The rank equals the number of pivots, so the rank of $A$ is $3$.'
          - problem: '$A$ is a $4 \times 5$ matrix with rank $3$. How many free variables does the system $A\mathbf{x} = \mathbf{0}$ have?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The free variables belong to the columns without a pivot. The matrix has $5$ columns and $3$ pivots, so $5 - 3 = 2$ columns have no pivot. The system has $2$ free variables.'
          - problem: '$A$ is a $5 \times 5$ matrix whose null space has dimension $4$. What is the rank of $A$?'
            answer: '1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Rank plus nullity equals the number of columns, which is $5$. The nullity is $4$, so the rank is $5 - 4 = 1$.'
          - problem: 'A chemist writes a system of $6$ equations in $9$ unknowns, with $0$ on the right side of every equation. After row reduction, $5$ rows have a pivot and the sixth row is zero. How many unknowns are free?'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The system has $9$ unknowns, and $5$ of them have a pivot. The unknowns without a pivot are free, so the number of free unknowns is $9 - 5 = 4$.'
          - problem: 'A traffic model gives a system $A\mathbf{x} = \mathbf{0}$ of $8$ equations in $6$ unknowns. Row reduction leaves $4$ nonzero rows. What is the dimension of the solution space?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The solution space of $A\mathbf{x} = \mathbf{0}$ is the null space of $A$. The $4$ nonzero rows give rank $4$, so the nullity is $6 - 4 = 2$.'
          - problem: 'Sam says that a $3 \times 6$ matrix with $2$ pivots has nullity $1$, because $3 - 2 = 1$. What is the correct nullity?'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Sam subtracted the pivots from the number of rows. The nullity counts the columns without a pivot, so it is the number of columns minus the rank: $6 - 2 = 4$.'
          - problem: 'A matrix has rank $3$ and nullity $2$. How many columns does it have?'
            answer: '5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Rank plus nullity equals the number of columns. The matrix has $3 + 2 = 5$ columns.'
        constraints: 'sizes up to 9 unknowns; one of rank, nullity, pivot count or free-variable count given; verdict-free numeric items'
      - id: kp2
        name: What the shape forces
        key_prerequisites: [null-column-space-rank]
        try_first:
          problem: 'A homogeneous system has $2$ equations and $3$ unknowns. Must it have a solution other than $x = y = z = 0$?'
          answer_contract: {"kind": "label", "options": [["yes", "it must", "must"], ["no", "it need not", "not necessarily"]]}
          answer: 'yes'
          reveal: 'The coefficient matrix has $2$ rows and $3$ columns, so its rank is at most $2$ and some column has no pivot. A free variable produces nonzero solutions, so a wide matrix always has a nonzero null space.'
        exemplars:
          - problem: '$A$ is a $2 \times 4$ matrix. What is the smallest possible nullity of $A$?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The rank of $A$ is at most the number of rows, so $\operatorname{rank}(A) \le 2$. The nullity is $4 - \operatorname{rank}(A)$, so it is at least $4 - 2 = 2$. The smallest possible nullity is $2$.'
          - problem: '$A$ is a $4 \times 3$ matrix. What is the largest possible dimension of the column space of $A$?'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The column space is spanned by the $3$ columns of $A$, so its dimension is at most $3$. Three independent columns reach this value. The largest possible dimension is $3$.'
          - problem: '$A$ is a $3 \times 7$ matrix with $\operatorname{rank}(A) = 3$. What is the nullity of $A$?'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Rank plus nullity equals the number of columns, which is $7$. The rank is $3$, so the nullity is $7 - 3 = 4$.'
          - problem: 'Can the columns of a $6 \times 4$ matrix span $\mathbb{R}^6$?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "they can", "can"], ["no", "they cannot", "cannot"]]}
            solution_sketch: 'The matrix has $4$ columns, so its rank is at most $4$. Spanning $\mathbb{R}^6$ needs rank $6$. Since $4 < 6$, the columns cannot span $\mathbb{R}^6$.'
          - problem: '$A$ is a $3 \times 3$ matrix whose columns are linearly dependent. What is the largest possible rank of $A$?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Dependent columns mean that one column is a combination of the others. The columns then span at most a $2$-dimensional space, so the rank is at most $2$. A matrix such as $\begin{pmatrix}1&0&1\\0&1&1\\0&0&0\end{pmatrix}$ has rank $2$, so the largest possible rank is $2$.'
          - problem: 'A network model has $10$ equations in $12$ unknowns, and every right side is $0$. What is the smallest possible number of free variables?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The coefficient matrix has $10$ rows and $12$ columns, so its rank is at most $10$. The number of free variables is $12 - \operatorname{rank}$, so it is at least $12 - 10 = 2$.'
          - problem: 'A lab records $9$ different readings, and each reading is a vector in $\mathbb{R}^5$. The readings are the columns of a matrix $A$. What is the smallest possible dimension of the null space of $A$?'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The matrix $A$ has $5$ rows and $9$ columns, so $\operatorname{rank}(A) \le 5$. The nullity is $9 - \operatorname{rank}(A)$, so it is at least $9 - 5 = 4$.'
          - problem: 'Can a $5 \times 3$ matrix have nullity $1$?'
            answer: 'yes'
            answer_contract: {"kind": "label", "options": [["yes", "it can", "can"], ["no", "it cannot", "cannot"]]}
            solution_sketch: 'Rank plus nullity equals $3$, so nullity $1$ needs rank $2$. A $5 \times 3$ matrix whose third column is the sum of two independent columns has rank $2$. So the answer is yes.'
        constraints: 'wide and tall matrices; conclusions forced by rank <= min(m, n); at most two yes/no items'
      - id: kp3
        name: Rank and invertibility
        key_prerequisites: [null-column-space-rank]
        exemplars:
          - problem: '$A$ is a $3 \times 3$ matrix with rank $2$. What is $\det A$?'
            answer: '0'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The rank $2$ is less than $3$, so $A$ is not invertible. A matrix that is not invertible has determinant $0$.'
          - problem: 'Is a $4 \times 4$ matrix of rank $4$ invertible?'
            answer: 'yes'
            answer_contract: {"kind": "label", "options": [["yes", "it is invertible", "invertible"], ["no", "it is not invertible", "not invertible", "singular"]]}
            solution_sketch: 'A $4 \times 4$ matrix of rank $4$ has a pivot in every column and every row. A square matrix with a pivot in every column is invertible, so the answer is yes.'
          - problem: '$A$ is a $5 \times 5$ matrix with $\det A = 7$. What is the nullity of $A$?'
            answer: '0'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A nonzero determinant means that $A$ is invertible, so the rank is $5$. The nullity is $5 - 5 = 0$.'
          - problem: '$A$ is a $3 \times 3$ matrix with nullity $1$. What is the rank of $A$?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Rank plus nullity equals the number of columns, which is $3$. The rank is $3 - 1 = 2$.'
          - problem: 'Let $A = \begin{pmatrix}2&4\\1&2\end{pmatrix}$. What is the rank of $A$?'
            answer: '1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The determinant is $2 \cdot 2 - 4 \cdot 1 = 0$, so the rank is less than $2$. The matrix is not the zero matrix, so the rank is at least $1$. The rank of $A$ is $1$.'
          - problem: 'Let $A = \begin{pmatrix}1&0&2\\0&1&3\\1&1&5\end{pmatrix}$. What is the nullity of $A$?'
            answer: '1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The third row is the sum of the first two rows, so the determinant is $0$ and the rank is below $3$. The first two rows are independent, so the rank is $2$. The nullity is $3 - 2 = 1$.'
          - problem: 'The coefficient matrix of the system $A\mathbf{x} = \mathbf{0}$ is a $5 \times 5$ matrix of rank $4$. How many free variables does the system have?'
            answer: '1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The number of free variables equals the nullity of the coefficient matrix. The nullity is $5 - 4 = 1$, so the system has $1$ free variable.'
          - problem: 'A circuit model gives the system $A\mathbf{x} = \mathbf{0}$ with a $6 \times 6$ matrix $A$. The determinant of $A$ is $0$, and the echelon form of $A$ has $4$ pivots. What is the dimension of the solution space?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The solution space is the null space of $A$, and its dimension is the nullity. The rank is $4$, so the nullity is $6 - 4 = 2$.'
          - problem: 'Sam says that a $4 \times 4$ matrix of rank $3$ has determinant $3$. What is the correct determinant?'
            answer: '0'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Sam copied the rank into the determinant. Rank $3$ is less than $4$, so the matrix is not invertible, and its determinant is $0$.'
          - problem: 'A calibration model is a square system $A\mathbf{x} = \mathbf{0}$ of $7$ equations in $7$ unknowns. Its solutions form a $3$-dimensional space. What is $\det A$?'
            answer: '0'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The solution space is the null space of $A$, so the nullity is $3$ and the rank is $7 - 3 = 4$. The rank is less than $7$, so $A$ is not invertible and $\det A = 0$.'
        constraints: 'square matrices; connect rank n to invertible, nonzero determinant and trivial null space; at most one yes/no item'
    diagnostic_exemplar:
      problem: '$A$ is $3 \times 3$ and its echelon form has $2$ pivots. Give the rank and nullity of $A$, say whether $A$ is invertible, and give $\det A$.'
      answer: 'Rank 2, nullity 1; not invertible; det A = 0'
      answer_contract: {kind: none}
      solution_sketch: 'Rank equals the pivot count and nullity is $3 - 2 = 1$; a nontrivial null space rules out invertibility, which forces $\det A = 0$.'
    anki_seeds:
      - front: 'For an $m \times n$ matrix, the rank is at most...'
        back: '$\min(m, n)$.'
        type: basic
      - front: 'A square $n \times n$ matrix is invertible iff its rank is...'
        back: '$n$ (equivalently, nullity $0$, determinant nonzero).'
        type: basic

  - id: linear-transformations
    name: Linear Transformations
    core: true
    difficulty: 0.7
    drill: false
    answer_kind: numeric
    expected_time_secs: 210
    prerequisites:
      - id: matrix-operations
        weight: 0.6
        key: true
      - id: matrix-vector-equations
        weight: 0.6
        key: true
      - id: vectors-in-rn
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: Evaluating and recognizing linear maps
        key_prerequisites: [matrix-vector-equations]
        exemplars:
          - problem: 'Let $T(\mathbf{x}) = A\mathbf{x}$ with $A = \begin{pmatrix}1&-1\\2&0\end{pmatrix}$. Compute $T(3, 1)$.'
            answer: '(2, 6)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'The first output entry is row 1 of $A$ times $(3, 1)$, which is $1 \cdot 3 + (-1) \cdot 1 = 2$. The second output entry is row 2 times $(3, 1)$, which is $2 \cdot 3 + 0 \cdot 1 = 6$. So $T(3, 1) = (2, 6)$.'
          - problem: 'Let $T$ be linear with $T(\mathbf{u}) = (1, 2)$ and $T(\mathbf{v}) = (3, 0)$. Compute $T(2\mathbf{u} + \mathbf{v})$.'
            answer: '(5, 4)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'A linear map respects sums and scalar multiples, so $T(2\mathbf{u} + \mathbf{v}) = 2T(\mathbf{u}) + T(\mathbf{v})$. This equals $(2, 4) + (3, 0) = (5, 4)$.'
          - problem: 'Is the map $T(x, y) = (x + 2,\ y - 1)$ linear?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "it is linear", "linear"], ["no", "it is not linear", "not linear"]]}
            solution_sketch: 'A linear map sends the zero vector to the zero vector. Here $T(0, 0) = (0 + 2, 0 - 1) = (2, -1)$, which is not $(0, 0)$, so $T$ is not linear.'
          - problem: 'Let $T$ be linear with $T(\mathbf{u}) = (2, -1)$ and $T(\mathbf{v}) = (4, 3)$. Compute $T(\mathbf{u} - 2\mathbf{v})$.'
            answer: '(-6, -7)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'By linearity, $T(\mathbf{u} - 2\mathbf{v}) = T(\mathbf{u}) - 2T(\mathbf{v})$. This equals $(2, -1) - 2(4, 3) = (2 - 8, -1 - 6) = (-6, -7)$.'
          - problem: 'A drug dose of $2$ units gives a linear response of $(10, 4)$ in two blood measurements. What response does a dose of $1$ unit give?'
            answer: '(5, 2)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'For a linear response, doubling the dose doubles the response. So the response to $1$ unit is half of $(10, 4)$, which is $(10/2, 4/2) = (5, 2)$.'
          - problem: 'Let $T$ be linear with $T(\mathbf{u}) = (1, 2)$, $T(\mathbf{v}) = (3, 0)$ and $T(\mathbf{w}) = (-1, 4)$. Compute $T(\mathbf{u} + 2\mathbf{v} - \mathbf{w})$.'
            answer: '(8, -2)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'By linearity, $T(\mathbf{u} + 2\mathbf{v} - \mathbf{w}) = T(\mathbf{u}) + 2T(\mathbf{v}) - T(\mathbf{w})$. This equals $(1, 2) + (6, 0) - (-1, 4) = (1 + 6 + 1,\ 2 + 0 - 4) = (8, -2)$.'
          - problem: 'A factory has two machines. In one hour, machine $1$ makes $3$ chairs and $1$ table, and machine $2$ makes $2$ chairs and $2$ tables. The output (chairs, tables) is a linear function of the hours $(h_1, h_2)$. What is the output for $(h_1, h_2) = (4, 5)$?'
            answer: '(22, 14)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'The output is $h_1 (3, 1) + h_2 (2, 2)$. For $(4, 5)$ this is $4(3, 1) + 5(2, 2) = (12 + 10,\ 4 + 10) = (22, 14)$, so the factory makes $22$ chairs and $14$ tables.'
          - problem: 'Is the map $T(x, y) = (2x - y,\ 3y)$ linear?'
            answer: 'yes'
            answer_contract: {"kind": "label", "options": [["yes", "it is linear", "linear"], ["no", "it is not linear", "not linear"]]}
            solution_sketch: 'Write $T(x, y) = x(2, 0) + y(-1, 3)$. Each output entry is a sum of constant multiples of $x$ and $y$, so $T$ respects sums and scalar multiples. So $T$ is linear.'
        constraints: '2x2 matrices and given images; linearity checks by T(0) or by the sum and scalar rules; at most two yes/no items'
      - id: kp2
        name: The standard matrix
        key_prerequisites: [matrix-vector-equations, vectors-in-rn]
        exemplars:
          - problem: '$T$ is linear with $T(\mathbf{e}_1) = (2, 1)$ and $T(\mathbf{e}_2) = (-1, 3)$. Find the standard matrix of $T$.'
            answer: '[[2,-1],[1,3]]'
            answer_contract: {"kind": "matrix", "rows": 2, "cols": 2}
            solution_sketch: 'The columns of the standard matrix are the images of the standard basis vectors. Column $1$ is $T(\mathbf{e}_1) = (2, 1)$ and column $2$ is $T(\mathbf{e}_2) = (-1, 3)$. The standard matrix has rows $(2, -1)$ and $(1, 3)$.'
          - problem: 'Find the standard matrix of the rotation of $\mathbb{R}^2$ by $90^\circ$ counterclockwise.'
            answer: '[[0,-1],[1,0]]'
            answer_contract: {"kind": "matrix", "rows": 2, "cols": 2}
            solution_sketch: 'The rotation sends $\mathbf{e}_1 = (1, 0)$ to $(0, 1)$ and $\mathbf{e}_2 = (0, 1)$ to $(-1, 0)$. These images are the columns, so the matrix has rows $(0, -1)$ and $(1, 0)$.'
          - problem: 'Find the standard matrix of the reflection of $\mathbb{R}^2$ across the $x$-axis.'
            answer: '[[1,0],[0,-1]]'
            answer_contract: {"kind": "matrix", "rows": 2, "cols": 2}
            solution_sketch: 'The reflection keeps $\mathbf{e}_1 = (1, 0)$ fixed and sends $\mathbf{e}_2 = (0, 1)$ to $(0, -1)$. These images are the columns, so the matrix has rows $(1, 0)$ and $(0, -1)$.'
          - problem: 'Find the standard matrix of the rotation of $\mathbb{R}^2$ by $180^\circ$ counterclockwise.'
            answer: '[[-1,0],[0,-1]]'
            answer_contract: {"kind": "matrix", "rows": 2, "cols": 2}
            solution_sketch: 'A rotation by $180^\circ$ sends $\mathbf{e}_1 = (1, 0)$ to $(-1, 0)$ and $\mathbf{e}_2 = (0, 1)$ to $(0, -1)$. These images are the columns, so the matrix has rows $(-1, 0)$ and $(0, -1)$.'
          - problem: '$T(x, y) = (3x - y,\ x + 4y)$ is a linear map. Find its standard matrix.'
            answer: '[[3,-1],[1,4]]'
            answer_contract: {"kind": "matrix", "rows": 2, "cols": 2}
            solution_sketch: 'The images of the basis vectors are $T(1, 0) = (3, 1)$ and $T(0, 1) = (-1, 4)$. These images are the columns, so the matrix has rows $(3, -1)$ and $(1, 4)$.'
          - problem: '$T: \mathbb{R}^2 \to \mathbb{R}^3$ is linear with $T(\mathbf{e}_1) = (1, 2, 3)$ and $T(\mathbf{e}_2) = (-2, 0, 5)$. Find the standard matrix of $T$.'
            answer: '[[1,-2],[2,0],[3,5]]'
            answer_contract: {"kind": "matrix", "rows": 3, "cols": 2}
            solution_sketch: 'The standard matrix has the images of the basis vectors as its columns. Column $1$ is $(1, 2, 3)$ and column $2$ is $(-2, 0, 5)$, so the matrix has $3$ rows and $2$ columns.'
          - problem: 'In one hour, machine $1$ makes $3$ chairs and $1$ table, and machine $2$ makes $2$ chairs and $2$ tables. Find the matrix that turns the hours $(h_1, h_2)$ into the output (chairs, tables).'
            answer: '[[3,2],[1,2]]'
            answer_contract: {"kind": "matrix", "rows": 2, "cols": 2}
            solution_sketch: 'One hour on machine $1$ gives $(3, 1)$, and this is the first column. One hour on machine $2$ gives $(2, 2)$, and this is the second column. The matrix has rows $(3, 2)$ and $(1, 2)$.'
          - problem: 'A liter of juice $P$ has $60$ mg of vitamin C and $4$ g of sugar. A liter of juice $Q$ has $20$ mg of vitamin C and $9$ g of sugar. Find the matrix that turns the liters $(p, q)$ into (vitamin C in mg, sugar in g).'
            answer: '[[60,20],[4,9]]'
            answer_contract: {"kind": "matrix", "rows": 2, "cols": 2}
            solution_sketch: 'The column for $P$ holds the content of one liter of $P$, which is $(60, 4)$. The column for $Q$ holds $(20, 9)$. The matrix has rows $(60, 20)$ and $(4, 9)$.'
          - problem: 'A linear map $T$ sends $(2, 0)$ to $(6, 2)$ and $(0, 3)$ to $(3, 12)$. Find the standard matrix of $T$.'
            answer: '[[3,1],[1,4]]'
            answer_contract: {"kind": "matrix", "rows": 2, "cols": 2}
            solution_sketch: 'Linearity gives $T(1, 0) = \frac{1}{2}(6, 2) = (3, 1)$ and $T(0, 1) = \frac{1}{3}(3, 12) = (1, 4)$. These images are the columns, so the matrix has rows $(3, 1)$ and $(1, 4)$.'
        constraints: 'images of e1, e2 given directly, by a formula, by a context, or by scaled basis vectors; standard geometric maps (rotations by multiples of 90 degrees, axis reflections, scalings)'
      - id: kp3
        name: Composition as matrix multiplication
        key_prerequisites: [matrix-operations, matrix-vector-equations]
        try_first:
          problem: 'Rotate the plane by $90^\circ$ counterclockwise and then reflect it across the $x$-axis. Is the result the same as reflecting across the $x$-axis first and then rotating by $90^\circ$?'
          answer_contract: {"kind": "label", "options": [["yes", "it is the same", "same"], ["no", "it is not the same", "different"]]}
          answer: 'no'
          reveal: 'The point $(1, 0)$ shows the difference: rotating first gives $(0, 1)$ and then $(0, -1)$, but reflecting first gives $(1, 0)$ and then $(0, 1)$. The order of the maps matters, so the order of the matrices matters.'
        exemplars:
          - problem: '$S$ has matrix $\begin{pmatrix}1&0\\0&-1\end{pmatrix}$ (reflect across the $x$-axis) and $T$ has matrix $\begin{pmatrix}0&-1\\1&0\end{pmatrix}$ (rotate by $90^\circ$). Find the matrix of $S \circ T$.'
            answer: '[[0,-1],[-1,0]]'
            answer_contract: {"kind": "matrix", "rows": 2, "cols": 2}
            solution_sketch: 'The matrix of $S \circ T$ is the matrix of $S$ times the matrix of $T$. The product has top row $1 \cdot 0 + 0 \cdot 1 = 0$ and $1 \cdot (-1) + 0 \cdot 0 = -1$, and bottom row $0 \cdot 0 + (-1) \cdot 1 = -1$ and $0 \cdot (-1) + (-1) \cdot 0 = 0$.'
          - problem: 'What single matrix performs the rotation by $90^\circ$ counterclockwise twice in a row?'
            answer: '[[-1,0],[0,-1]]'
            answer_contract: {"kind": "matrix", "rows": 2, "cols": 2}
            solution_sketch: 'Two rotations multiply the rotation matrix by itself. The square of $\begin{pmatrix}0&-1\\1&0\end{pmatrix}$ is $\begin{pmatrix}-1&0\\0&-1\end{pmatrix}$, which is the rotation by $180^\circ$.'
          - problem: '$S$ is the shear with matrix $\begin{pmatrix}1&2\\0&1\end{pmatrix}$ and $T$ is the rotation by $90^\circ$ with matrix $\begin{pmatrix}0&-1\\1&0\end{pmatrix}$. Find the matrix of $S \circ T$.'
            answer: '[[2,-1],[1,0]]'
            answer_contract: {"kind": "matrix", "rows": 2, "cols": 2}
            solution_sketch: 'The matrix of $S \circ T$ is the matrix of $S$ times the matrix of $T$. The top row is $1 \cdot 0 + 2 \cdot 1 = 2$ and $1 \cdot (-1) + 2 \cdot 0 = -1$. The bottom row is $0 \cdot 0 + 1 \cdot 1 = 1$ and $0 \cdot (-1) + 1 \cdot 0 = 0$.'
          - problem: '$S$ has matrix $\begin{pmatrix}2&0\\0&3\end{pmatrix}$ (scale $x$ by $2$ and $y$ by $3$) and $R$ has matrix $\begin{pmatrix}1&0\\0&-1\end{pmatrix}$ (reflect across the $x$-axis). Find the matrix of $R \circ S$.'
            answer: '[[2,0],[0,-3]]'
            answer_contract: {"kind": "matrix", "rows": 2, "cols": 2}
            solution_sketch: 'The matrix of $R \circ S$ is the matrix of $R$ times the matrix of $S$. The product has top row $1 \cdot 2 + 0 \cdot 0 = 2$ and $0$, and bottom row $0$ and $0 \cdot 0 + (-1) \cdot 3 = -3$.'
          - problem: '$T$ rotates the plane by $90^\circ$ counterclockwise. What single matrix performs this rotation three times in a row?'
            answer: '[[0,1],[-1,0]]'
            answer_contract: {"kind": "matrix", "rows": 2, "cols": 2}
            solution_sketch: 'Three rotations give the matrix $T^3$. We have $T^2 = -I$, so $T^3 = -T = \begin{pmatrix}0&1\\-1&0\end{pmatrix}$.'
          - problem: 'A graphics program first stretches every point by a factor of $2$ in the $x$-direction, with matrix $\begin{pmatrix}2&0\\0&1\end{pmatrix}$. It then rotates the picture by $90^\circ$ counterclockwise. Find the single matrix of the whole operation.'
            answer: '[[0,-1],[2,0]]'
            answer_contract: {"kind": "matrix", "rows": 2, "cols": 2}
            solution_sketch: 'The stretch happens first, so its matrix is on the right: the whole matrix is the rotation matrix times the stretch matrix. The product has top row $0 \cdot 2 + (-1) \cdot 0 = 0$ and $0 \cdot 0 + (-1) \cdot 1 = -1$, and bottom row $1 \cdot 2 = 2$ and $0$.'
          - problem: 'A picture is rotated by $90^\circ$ counterclockwise and then reflected across the $x$-axis. Where does the point $(3, 1)$ end up?'
            answer: '(-1, -3)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'The rotation sends $(3, 1)$ to $(-1, 3)$. The reflection across the $x$-axis changes the sign of the second coordinate, so the point ends at $(-1, -3)$.'
          - problem: 'First a map $T$ is applied, and then the reflection $S$ across the $x$-axis, which has matrix $\begin{pmatrix}1&0\\0&-1\end{pmatrix}$. The combined map $S \circ T$ has matrix $\begin{pmatrix}2&0\\0&-3\end{pmatrix}$. Find the matrix of $T$.'
            answer: '[[2,0],[0,3]]'
            answer_contract: {"kind": "matrix", "rows": 2, "cols": 2}
            solution_sketch: 'Since $[S][T] = \begin{pmatrix}2&0\\0&-3\end{pmatrix}$, we multiply both sides on the left by $[S]^{-1}$. The reflection undoes itself, so $[S]^{-1} = [S]$, and $[T] = [S]\begin{pmatrix}2&0\\0&-3\end{pmatrix} = \begin{pmatrix}2&0\\0&3\end{pmatrix}$.'
          - problem: 'Sam finds the matrix of $S \circ T$ for the scaling $S$ with matrix $\begin{pmatrix}2&0\\0&3\end{pmatrix}$ and the rotation $T$ with matrix $\begin{pmatrix}0&-1\\1&0\end{pmatrix}$ by multiplying $[T][S]$, and gets $\begin{pmatrix}0&-3\\2&0\end{pmatrix}$. What is the correct matrix of $S \circ T$?'
            answer: '[[0,-2],[3,0]]'
            answer_contract: {"kind": "matrix", "rows": 2, "cols": 2}
            solution_sketch: 'Sam multiplied in the wrong order. The map $T$ acts first, so its matrix goes on the right, and the matrix of $S \circ T$ is $[S][T]$. This product has rows $(0, -2)$ and $(3, 0)$.'
        constraints: 'compose two of: 90-degree rotations, axis reflections, integer scalings and shears; images of points; solving for one factor'
    diagnostic_exemplar:
      problem: '$S$ reflects $\mathbb{R}^2$ across the $x$-axis and $T$ rotates it by $90^\circ$ counterclockwise. Find the standard matrix of $S \circ T$ and compute $(S \circ T)(1, 2)$.'
      answer: '$\begin{pmatrix}0&-1\\-1&0\end{pmatrix}$; $(S \circ T)(1, 2) = (-2, -1)$'
      answer_contract: {kind: none}
      solution_sketch: '$S = \begin{pmatrix}1&0\\0&-1\end{pmatrix}$ and $T = \begin{pmatrix}0&-1\\1&0\end{pmatrix}$, so the composition has matrix $ST$; applying it to $(1,2)$ gives $(-2, -1)$.'
    anki_seeds:
      - front: 'The two defining properties of a linear transformation?'
        back: '$T(\mathbf{u} + \mathbf{v}) = T(\mathbf{u}) + T(\mathbf{v})$ and $T(c\mathbf{u}) = cT(\mathbf{u})$.'
        type: basic
      - front: 'Column $j$ of the standard matrix of a linear map $T$ is...'
        back: '$T(\mathbf{e}_j)$, the image of the $j$-th standard basis vector.'
        type: basic
      - front: 'Standard matrix of a $90^\circ$ counterclockwise rotation of $\mathbb{R}^2$?'
        back: '$\begin{pmatrix}0&-1\\1&0\end{pmatrix}$'
        type: basic

  - id: kernel-image-linear-maps
    name: Kernel and Image of a Linear Map
    core: true
    difficulty: 0.7
    drill: false
    answer_kind: numeric
    expected_time_secs: 210
    prerequisites:
      - id: linear-transformations
        weight: 0.7
        key: true
      - id: null-column-space-rank
        weight: 0.6
        key: true
    knowledge_points:
      - id: kp1
        name: Computing kernels
        key_prerequisites: [linear-transformations, null-column-space-rank]
        try_first:
          problem: 'The map $T(x, y) = (x - 2y,\ 3x - 6y)$ is linear. Does $T$ send the vector $(4, 2)$ to $(0, 0)$?'
          answer_contract: {"kind": "label", "options": [["yes", "it does", "does"], ["no", "it does not", "does not"]]}
          answer: 'yes'
          reveal: 'We get $T(4, 2) = (4 - 4,\ 12 - 12) = (0, 0)$. The set of all inputs that $T$ sends to $(0, 0)$ is the kernel of $T$.'
        exemplars:
          - problem: 'Let $T(\mathbf{x}) = A\mathbf{x}$ with $A = \begin{pmatrix}1&-3\\2&-6\end{pmatrix}$. The kernel of $T$ is a line through the origin. Find the vector of the kernel whose second coordinate is $1$.'
            answer: '(3, 1)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'The kernel is the solution set of $A\mathbf{x} = \mathbf{0}$. The rows give $x - 3y = 0$ and $2x - 6y = 0$, which are the same equation. So $x = 3y$, and $y = 1$ gives $x = 3$, which is the vector $(3, 1)$.'
          - problem: 'The map $T(x, y) = (x + y,\ 3x + 3y)$ sends a whole line of inputs to $(0, 0)$. Find the vector of this line with $x = 1$.'
            answer: '(1, -1)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'Set $T(x, y) = (0, 0)$. Both components give the single equation $x + y = 0$. For $x = 1$ we get $y = -1$, so the vector is $(1, -1)$.'
          - problem: 'For the map $T(x, y) = (2x - 3y,\ -4x + 6y)$, the kernel is a line. Find the vector of the kernel with $y = 2$.'
            answer: '(3, 2)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'The kernel equations are $2x - 3y = 0$ and $-4x + 6y = 0$. The second row is $-2$ times the first, so one equation remains: $2x = 3y$. For $y = 2$ we get $2x = 6$, so $x = 3$ and the vector is $(3, 2)$.'
          - problem: 'A linear map $T$ satisfies $T(1, 0) = (-3, -6)$ and $T(0, 1) = (1, 2)$. Its kernel is a line. Find the vector of the kernel with $x = 1$.'
            answer: '(1, 3)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'The columns of the standard matrix are $(-3, -6)$ and $(1, 2)$, so $T(x, y) = (-3x + y,\ -6x + 2y)$. Both components vanish when $y = 3x$. For $x = 1$ we get $y = 3$, so the vector is $(1, 3)$.'
          - problem: 'Let $T(\mathbf{x}) = A\mathbf{x}$ with $A = \begin{pmatrix}2&5\\4&10\end{pmatrix}$. Find the vector of the kernel of $T$ with $x = 5$.'
            answer: '(5, -2)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'The second row $(4, 10)$ is twice the first row $(2, 5)$, so the kernel has the single equation $2x + 5y = 0$. For $x = 5$ we get $5y = -10$, so $y = -2$ and the vector is $(5, -2)$.'
          - problem: 'Let $T(\mathbf{x}) = A\mathbf{x}$ with $A = \begin{pmatrix}1&2&-1\\0&1&1\\0&0&0\end{pmatrix}$. The kernel of $T$ is a line. Find the vector of the kernel with $z = 1$.'
            answer: '(3, -1, 1)'
            answer_contract: {"kind": "coordinates", "arity": 3}
            solution_sketch: 'The second row gives $y + z = 0$, so $y = -z$. The first row gives $x + 2y - z = 0$, so $x = z - 2y = 3z$. For $z = 1$ we get $y = -1$ and $x = 3$, so the vector is $(3, -1, 1)$.'
          - problem: 'A mixing machine takes the amounts $(x, y)$ of two inputs and produces the two signals $(x + 2y,\ 3x + 6y)$. Some inputs produce no signal at all. Which input with $x = 2$ produces the signal $(0, 0)$?'
            answer: '(2, -1)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'We need $x + 2y = 0$ and $3x + 6y = 0$, and these are the same equation. For $x = 2$ we get $2 + 2y = 0$, so $y = -1$. The input is $(2, -1)$.'
          - problem: 'A linear filter sends $(x, y)$ to $(4x - 2y,\ 6x - 3y)$, and the inputs sent to $(0, 0)$ are cancelled. Which input of the form $(2, y)$ is cancelled?'
            answer: '(2, 4)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'The input is cancelled when $4x - 2y = 0$ and $6x - 3y = 0$. Both equations say $y = 2x$. For $x = 2$ we get $y = 4$, so the cancelled input is $(2, 4)$.'
          - problem: 'Let $T(\mathbf{x}) = A\mathbf{x}$ with $A = \begin{pmatrix}1&2\\3&6\end{pmatrix}$. Is the vector $(6, -3)$ in the kernel of $T$?'
            answer: 'yes'
            answer_contract: {"kind": "label", "options": [["yes", "it is in the kernel", "in the kernel"], ["no", "it is not in the kernel", "not in the kernel"]]}
            solution_sketch: 'The vector is in the kernel when $A(6, -3) = (0, 0)$. We compute $(1 \cdot 6 + 2 \cdot (-3),\ 3 \cdot 6 + 6 \cdot (-3)) = (0, 0)$, so the vector is in the kernel.'
          - problem: 'Sam says that the kernel of $T(\mathbf{x}) = A\mathbf{x}$ with $A = \begin{pmatrix}2&1\\6&3\end{pmatrix}$ is spanned by $(2, 1)$, because $(2, 1)$ is the first row. Find the vector of the true kernel with $x = 1$.'
            answer: '(1, -2)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'Sam used a row of $A$, but the kernel vectors $\mathbf{x}$ satisfy $A\mathbf{x} = \mathbf{0}$. The first row gives $2x + y = 0$, and the second row is $3$ times it. For $x = 1$ we get $y = -2$, so the vector is $(1, -2)$.'
        constraints: '2x2 matrices with 1-dimensional kernels and one 3x3 matrix; integer kernel vectors with one coordinate fixed'
      - id: kp2
        name: Computing images
        key_prerequisites: [linear-transformations, null-column-space-rank]
        exemplars:
          - problem: 'Let $T(\mathbf{x}) = A\mathbf{x}$ with $A = \begin{pmatrix}2&5\\4&10\end{pmatrix}$. The image of $T$ is a line through the origin. What is the slope of this line?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The image is the column space of $A$. The columns $(2, 4)$ and $(5, 10)$ are proportional, so the image is the line through the origin and $(2, 4)$. The slope is $4/2 = 2$.'
          - problem: 'Let $T(\mathbf{x}) = A\mathbf{x}$ with $A = \begin{pmatrix}3&9\\4&12\end{pmatrix}$. The image of $T$ is a line through the origin, and the vector $(c, 8)$ lies on it. Find $c$.'
            answer: '6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The columns $(3, 4)$ and $(9, 12)$ are proportional, so every vector of the image has the form $t(3, 4)$. The second coordinate $4t = 8$ gives $t = 2$. Then $c = 3t = 6$.'
          - problem: 'Let $T(\mathbf{x}) = A\mathbf{x}$ with $A = \begin{pmatrix}2&1\\1&3\end{pmatrix}$. What is the dimension of the image of $T$?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The image is the column space of $A$. The columns $(2, 1)$ and $(1, 3)$ are not proportional, so they are independent and span all of $\mathbb{R}^2$. The dimension of the image is $2$.'
          - problem: 'Let $T(\mathbf{x}) = A\mathbf{x}$ with $A = \begin{pmatrix}2&6\\5&15\end{pmatrix}$. A vector in the image of $T$ has first coordinate $8$. What is its second coordinate?'
            answer: '20'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The columns $(2, 5)$ and $(6, 15)$ are proportional, so every vector of the image has the form $t(2, 5)$. The first coordinate $2t = 8$ gives $t = 4$. The second coordinate is $5t = 20$.'
          - problem: 'Let $T(x, y) = (x + y,\ 2x + 2y)$. The image of $T$ is a line through the origin. Find the equation of this line.'
            answer: 'y = 2x'
            answer_contract: {"kind": "polynomial_relation"}
            solution_sketch: 'Every output has the form $(x + y)(1, 2)$, so each output is a multiple of $(1, 2)$. The image is the line through the origin with direction $(1, 2)$, which has the equation $y = 2x$.'
          - problem: 'Let $T(\mathbf{x}) = A\mathbf{x}$ with $A = \begin{pmatrix}k&1\\2&3\end{pmatrix}$, where $k$ is a real number. For which value of $k$ is the image of $T$ a line?'
            answer: '2/3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The image is a line exactly when the columns $(k, 2)$ and $(1, 3)$ are proportional. This means $k \cdot 3 - 1 \cdot 2 = 0$, so $3k = 2$ and $k = 2/3$.'
          - problem: 'A factory turns the hours $(h_1, h_2)$ on two machines into the output $T(h_1, h_2) = (2h_1 + 4h_2,\ 3h_1 + 6h_2)$, measured as (chairs, tables). Can the factory make exactly $10$ chairs and $15$ tables?'
            answer: 'yes'
            answer_contract: {"kind": "label", "options": [["yes", "it can be made", "it can be produced", "possible"], ["no", "it cannot be made", "it cannot be produced", "not possible", "impossible"]]}
            solution_sketch: 'Every output has the form $(h_1 + 2h_2)(2, 3)$, so the outputs are the multiples of $(2, 3)$. Since $(10, 15) = 5(2, 3)$, this order can be made, for example with $h_1 + 2h_2 = 5$.'
          - problem: 'The same factory has $T(h_1, h_2) = (2h_1 + 4h_2,\ 3h_1 + 6h_2)$. An order asks for $18$ tables, and the order can be made. How many chairs does it ask for?'
            answer: '12'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Every output is a multiple $t(2, 3)$. Then $3t = 18$ gives $t = 6$. The number of chairs is $2t = 12$.'
          - problem: 'Let $T(x, y) = (x + 2y,\ 2x + 4y)$. Is the vector $(5, 5)$ in the image of $T$?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "it is in the image", "in the image"], ["no", "it is not in the image", "not in the image"]]}
            solution_sketch: 'Every output of $T$ is a multiple of $(1, 2)$, because $T(x, y) = (x + 2y)(1, 2)$. The vector $(5, 5)$ is not a multiple of $(1, 2)$, so it is not in the image.'
          - problem: 'Let $T(x, y, z) = (x + y,\ y + z,\ x + 2y + z)$. What is the dimension of the image of $T$?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The image is the column space of the matrix with columns $(1, 0, 1)$, $(1, 1, 2)$ and $(0, 1, 1)$. The second column is the sum of the other two, so only two columns are independent. The dimension is $2$.'
        constraints: 'images are lines or all of R^2 (one 3x3 rank count); membership and missing coordinates by proportionality; at most two yes/no items'
      - id: kp3
        name: Rank-nullity for maps
        key_prerequisites: [null-column-space-rank]
        exemplars:
          - problem: '$T: \mathbb{R}^5 \to \mathbb{R}^3$ is linear with $\dim \ker T = 3$. What is $\dim \operatorname{im} T$?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Rank-nullity for maps says $\dim \ker T + \dim \operatorname{im} T$ equals the dimension of the domain, which is $5$. So $\dim \operatorname{im} T = 5 - 3 = 2$.'
          - problem: '$T: \mathbb{R}^4 \to \mathbb{R}^4$ is linear, and its image is all of $\mathbb{R}^4$. What is $\dim \ker T$?'
            answer: '0'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The image has dimension $4$, and the domain has dimension $4$. So $\dim \ker T = 4 - 4 = 0$, and the kernel contains only the zero vector.'
          - problem: '$T: \mathbb{R}^5 \to \mathbb{R}^2$ is a linear map with $\dim \ker T = 4$. What is $\dim \operatorname{im} T$?'
            answer: '1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The dimension of the domain is $5$. Then $4 + \dim \operatorname{im} T = 5$, so $\dim \operatorname{im} T = 1$.'
          - problem: '$T: \mathbb{R}^2 \to \mathbb{R}^4$ is a linear map with $\dim \operatorname{im} T = 2$. What is $\dim \ker T$?'
            answer: '0'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The dimension of the domain is $2$. Then $\dim \ker T + 2 = 2$, so $\dim \ker T = 0$.'
          - problem: 'Let $T(\mathbf{x}) = A\mathbf{x}$ where $A$ is a $3 \times 5$ matrix of rank $2$. What is the dimension of the null space of $A$?'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The image of $T$ is the column space of $A$, so its dimension is $2$. The domain is $\mathbb{R}^5$, so the null space has dimension $5 - 2 = 3$.'
          - problem: 'A linear encoder $T$ turns $6$ settings $\mathbf{x} \in \mathbb{R}^6$ into $4$ readings in $\mathbb{R}^4$, and every possible reading can be produced. How many independent directions of settings produce the reading $(0, 0, 0, 0)$?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Every reading can be produced, so $\dim \operatorname{im} T = 4$. The settings that give the zero reading form the kernel, and $\dim \ker T = 6 - 4 = 2$.'
          - problem: 'Let $T: \mathbb{R}^n \to \mathbb{R}^3$ be a linear map whose image is all of $\mathbb{R}^3$ and whose kernel has dimension $4$. What is $n$?'
            answer: '7'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The image has dimension $3$ and the kernel has dimension $4$. Rank-nullity gives $n = 3 + 4 = 7$.'
          - problem: 'Sam says that a linear map $T: \mathbb{R}^6 \to \mathbb{R}^6$ with $\dim \ker T = 2$ has $\dim \operatorname{im} T = 6$, because the codomain is $\mathbb{R}^6$. What is the correct value of $\dim \operatorname{im} T$?'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The image is not the whole codomain unless the kernel is trivial. Rank-nullity uses the dimension of the domain $\mathbb{R}^6$, so $\dim \operatorname{im} T = 6 - 2 = 4$.'
          - problem: 'Can a linear map $T: \mathbb{R}^3 \to \mathbb{R}^5$ have an image equal to all of $\mathbb{R}^5$?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "it can", "can"], ["no", "it cannot", "cannot"]]}
            solution_sketch: 'The image has dimension $\dim \operatorname{im} T = 3 - \dim \ker T \le 3$. All of $\mathbb{R}^5$ has dimension $5$, and $3 < 5$, so the answer is no.'
          - problem: 'Is there a linear map $T: \mathbb{R}^5 \to \mathbb{R}^3$ that has an image equal to all of $\mathbb{R}^3$ and a kernel of dimension $2$?'
            answer: 'yes'
            answer_contract: {"kind": "label", "options": [["yes", "there is", "such a map exists"], ["no", "there is not", "no such map exists"]]}
            solution_sketch: 'The dimensions must satisfy $2 + 3 = 5$, which equals the dimension of the domain, so rank-nullity allows it. The map $T(x_1, \ldots, x_5) = (x_1, x_2, x_3)$ has image $\mathbb{R}^3$ and kernel of dimension $2$.'
          - problem: 'A linear model turns $5$ design parameters into $3$ measurements. Exactly $2$ independent directions of parameter changes leave every measurement unchanged. How many independent directions of measurements can the model reach?'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The directions that change no measurement form the kernel, so $\dim \ker T = 2$. The parameters form the domain, of dimension $5$, so $\dim \operatorname{im} T = 5 - 2 = 3$.'
        constraints: 'domain dimension up to 7; ask for kernel or image dimension given the other, or for the domain dimension; at most two yes/no items'
    diagnostic_exemplar:
      problem: 'For $T(\mathbf{x}) = A\mathbf{x}$ with $A = \begin{pmatrix}1&3\\2&6\end{pmatrix}$, find $\ker T$, describe $\mathrm{im}\,T$, and check that the two dimensions add to $2$.'
      answer: 'ker T = span{(-3, 1)}; im T = span{(1, 2)}, the line through the origin with direction (1, 2); 1 + 1 = 2'
      answer_contract: {kind: none}
      solution_sketch: '$x + 3y = 0$ gives the kernel; both columns are multiples of $(1, 2)$, so the image is that line; rank $1$ plus nullity $1$ equals the $2$ columns.'
    anki_seeds:
      - front: 'For $T(\mathbf{x}) = A\mathbf{x}$: kernel and image in matrix language?'
        back: '$\ker T = \mathrm{Nul}(A)$; $\mathrm{im}\, T = \mathrm{Col}(A)$.'
        type: basic
      - front: 'Rank-nullity for a linear map $T: \mathbb{R}^n \to \mathbb{R}^m$?'
        back: '$\dim \ker T + \dim \mathrm{im}\, T = n$ (the domain dimension).'
        type: basic

  - id: one-to-one-onto-linear-transformations
    name: One-to-One and Onto Linear Maps
    core: false                # classification of linear maps; terminal
    difficulty: 0.7
    drill: false
    answer_kind: numeric
    expected_time_secs: 180
    prerequisites:
      - id: kernel-image-linear-maps
        weight: 0.7
        key: true
      - id: row-reduction-echelon-forms
        weight: 0.4
      - id: determinants-2x2
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: One-to-one means trivial kernel
        key_prerequisites: [kernel-image-linear-maps]
        try_first:
          problem: 'For the linear map $T(x, y) = (x + y,\ 2x + 2y)$, do the two different inputs $(3, 0)$ and $(0, 3)$ have the same output?'
          answer_contract: {"kind": "label", "options": [["yes", "they do", "same"], ["no", "they do not", "different"]]}
          answer: 'yes'
          reveal: 'Both inputs give $(3, 6)$, so $T$ sends two different inputs to one output. The difference $(3, -3)$ is then sent to $(0, 0)$, so the kernel is not trivial.'
        exemplars:
          - problem: 'The matrix $A = \begin{pmatrix}1&3\\2&6\end{pmatrix}$ defines the map $T(\mathbf{x}) = A\mathbf{x}$ from $\mathbb{R}^2$ to $\mathbb{R}^2$. Is $T$ one-to-one?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "it is one-to-one", "one-to-one"], ["no", "it is not one-to-one", "not one-to-one"]]}
            solution_sketch: 'Row reduction gives $R_2 - 2R_1 = (0, 0)$, so $A$ has one pivot, in column $1$. Column $2$ has no pivot, so $x_2$ is free and the kernel is not trivial. So $T$ is not one-to-one.'
          - problem: 'The matrix $A = \begin{pmatrix}2&0\\1&1\\0&3\end{pmatrix}$ defines the map $T(\mathbf{x}) = A\mathbf{x}$ from $\mathbb{R}^2$ to $\mathbb{R}^3$. What is the dimension of the kernel of $T$?'
            answer: '0'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Row reduction gives the echelon form with rows $(2, 0)$, $(0, 1)$ and $(0, 0)$. There is a pivot in each of the $2$ columns, so no variable is free. The kernel has dimension $0$.'
          - problem: 'The matrix $A = \begin{pmatrix}1&2&3\\2&4&6\\1&3&5\end{pmatrix}$ defines the map $T(\mathbf{x}) = A\mathbf{x}$ from $\mathbb{R}^3$ to $\mathbb{R}^3$. What is the dimension of the kernel of $T$?'
            answer: '1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Row reduction gives $R_2 - 2R_1 = (0, 0, 0)$ and $R_3 - R_1 = (0, 1, 2)$. So the echelon form has $2$ pivots, in columns $1$ and $2$. Column $3$ has no pivot, so the kernel has dimension $3 - 2 = 1$.'
          - problem: 'The matrix $A = \begin{pmatrix}1&4\\2&8\end{pmatrix}$ defines the map $T(\mathbf{x}) = A\mathbf{x}$ from $\mathbb{R}^2$ to $\mathbb{R}^2$. Find the vector of the kernel of $T$ whose second entry is $1$.'
            answer: '(-4, 1)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'The second row is twice the first, so the system $A\mathbf{x} = \mathbf{0}$ reduces to the single equation $x + 4y = 0$. So $x = -4y$, and $y = 1$ gives $x = -4$. The vector is $(-4, 1)$.'
          - problem: 'The matrix $A = \begin{pmatrix}2&1&0\\1&3&1\\0&1&2\end{pmatrix}$ defines the map $T(\mathbf{x}) = A\mathbf{x}$ from $\mathbb{R}^3$ to $\mathbb{R}^3$. Is $T$ one-to-one?'
            answer: 'yes'
            answer_contract: {"kind": "label", "options": [["yes", "it is one-to-one", "one-to-one"], ["no", "it is not one-to-one", "not one-to-one"]]}
            solution_sketch: 'Row reduction gives the pivots $1$, $-5$ and $8/5$ on the diagonal after the row swap and the row operations. Each of the $3$ columns holds a pivot, so the kernel is trivial. So $T$ is one-to-one.'
          - problem: 'The matrix $A = \begin{pmatrix}1&3&2\\2&6&4\\4&12&8\end{pmatrix}$ defines the map $T(\mathbf{x}) = A\mathbf{x}$ from $\mathbb{R}^3$ to $\mathbb{R}^3$. How many free variables does the system $A\mathbf{x} = \mathbf{0}$ have?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Row reduction makes the second and third rows zero, since they are $2$ and $4$ times the first row. So there is one pivot, in column $1$. Columns $2$ and $3$ have no pivot, so there are $2$ free variables.'
          - problem: 'A compression map $T: \mathbb{R}^3 \to \mathbb{R}^2$ stores each color $(r, g, b)$ as two numbers. What is the smallest possible dimension of the kernel of $T$?'
            answer: '1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The standard matrix of $T$ has $2$ rows and $3$ columns, so its rank is at most $2$. The kernel has dimension $3 - \operatorname{rank}$, which is at least $3 - 2 = 1$. So the map always loses information.'
          - problem: 'A lab model turns the amounts $(x, y)$ of two ingredients into the pair (cost, weight) $= (2x + 4y,\ x + 2y)$. The input $(2, 0)$ gives the output $(4, 2)$. Find the number $b$ such that the input $(0, b)$ gives the same output.'
            answer: '1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'We need $(4b, 2b) = (4, 2)$, so $b = 1$. The inputs $(2, 0)$ and $(0, 1)$ give the same output, so the model is not one-to-one.'
          - problem: 'Sam says that $T(\mathbf{x}) = A\mathbf{x}$ with $A = \begin{pmatrix}1&2\\3&6\end{pmatrix}$ is one-to-one, because its first column is not zero. What is the dimension of the kernel of $T$?'
            answer: '1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Sam checked only one column. The second column is twice the first, so there is one pivot and column $2$ has none. The kernel has dimension $2 - 1 = 1$, so $T$ is not one-to-one.'
        constraints: 'decide via kernel or pivot-in-every-column; sizes up to 3x3; at most two yes/no items'
      - id: kp2
        name: Onto means full column space
        key_prerequisites: [kernel-image-linear-maps, row-reduction-echelon-forms]
        exemplars:
          - problem: 'The matrix $A = \begin{pmatrix}1&2&1\\2&4&5\end{pmatrix}$ defines the linear map $T: \mathbb{R}^3 \to \mathbb{R}^2$. Is $T$ onto?'
            answer: 'yes'
            answer_contract: {"kind": "label", "options": [["yes", "it is onto", "onto"], ["no", "it is not onto", "not onto"]]}
            solution_sketch: 'Row reduction gives $R_2 - 2R_1 = (0, 0, 3)$, so the echelon form has rows $(1, 2, 1)$ and $(0, 0, 3)$. Each of the $2$ rows has a pivot, so the rank is $2$. So $T$ is onto.'
          - problem: 'Can a linear map $T: \mathbb{R}^2 \to \mathbb{R}^3$ be onto?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "it can", "can"], ["no", "it cannot", "cannot"]]}
            solution_sketch: 'The standard matrix of $T$ has $3$ rows and $2$ columns. Its rank is at most $2$, so it cannot have a pivot in all $3$ rows. So $T$ is never onto.'
          - problem: 'The matrix $A = \begin{pmatrix}1&2&3&4\\0&1&2&3\\0&0&1&2\end{pmatrix}$ defines the linear map $T: \mathbb{R}^4 \to \mathbb{R}^3$. What is the dimension of the image of $T$?'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The matrix is already in echelon form, with pivots in columns $1$, $2$ and $3$. The rank is $3$, and the image is the column space, so its dimension is $3$. This equals the dimension of $\mathbb{R}^3$, so $T$ is onto.'
          - problem: 'The matrix $A = \begin{pmatrix}1&0&2\\0&1&3\\0&0&0\\0&0&0\end{pmatrix}$ defines the linear map $T: \mathbb{R}^3 \to \mathbb{R}^4$. By how many dimensions does the image of $T$ fall short of $\mathbb{R}^4$?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Rows $1$ and $2$ have pivots and rows $3$ and $4$ are zero, so the rank is $2$. The image has dimension $2$, while $\mathbb{R}^4$ has dimension $4$. The image falls short by $4 - 2 = 2$ dimensions.'
          - problem: 'Let $T(x, y) = (x + y,\ 2x + 2y)$. For which value of $c$ is the vector $(3, c)$ in the image of $T$?'
            answer: '6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Every output has the form $(x + y)(1, 2)$, so each output is a multiple of $(1, 2)$. The vector $(3, c)$ is $3(1, 2) = (3, 6)$, so $c = 6$. Other values of $c$ are not reached, so $T$ is not onto.'
          - problem: 'A linear map $T: \mathbb{R}^5 \to \mathbb{R}^3$ is onto. What is the dimension of its kernel?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Onto means that the image is $\mathbb{R}^3$, so $\dim \operatorname{im} T = 3$. Rank-nullity gives $\dim \ker T = 5 - 3 = 2$.'
          - problem: 'Three foods have the following protein and fat content per portion: food $1$ has $(1, 0)$ grams, food $2$ has $(2, 1)$ grams and food $3$ has $(1, 1)$ grams. Using no food $3$, which portions $(x_1, x_2, x_3)$ give $7$ grams of protein and $3$ grams of fat?'
            answer: '(1, 3, 0)'
            answer_contract: {"kind": "coordinates", "arity": 3}
            solution_sketch: 'With $x_3 = 0$ the fat gives $x_2 = 3$. The protein gives $x_1 + 2x_2 = 7$, so $x_1 = 7 - 6 = 1$. The portions are $(1, 3, 0)$, and such portions exist for every target because the map is onto.'
          - problem: 'A map $T(x, y) = (x,\ y,\ x + y)$ sends each point of a flat sheet to a point in space. What is the dimension of the set of all points that $T$ reaches?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The standard matrix has columns $(1, 0, 1)$ and $(0, 1, 1)$. They are independent, so the image has dimension $2$. The reached points form a plane inside $\mathbb{R}^3$, so they do not fill space.'
          - problem: 'Sam says that $T(\mathbf{x}) = A\mathbf{x}$ with $A = \begin{pmatrix}1&2&0\\0&0&1\end{pmatrix}$ is not onto, because $A$ has only $2$ pivots but $3$ columns. What is the dimension of the image of $T$?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Sam compared the pivots with the columns, but onto needs a pivot in every row. Both rows have a pivot, so the rank is $2$. The image has dimension $2$, so it is all of $\mathbb{R}^2$ and $T$ is onto.'
        constraints: 'wide and tall matrices; onto iff pivot in every row; the dimension of the image compared with the codomain; at most two yes/no items'
      - id: kp3
        name: The square case
        key_prerequisites: [kernel-image-linear-maps, determinants-2x2]
        exemplars:
          - problem: 'Let $T(\mathbf{x}) = A\mathbf{x}$ with $A = \begin{pmatrix}2&5\\1&3\end{pmatrix}$ be a map from $\mathbb{R}^2$ to $\mathbb{R}^2$. Is $T$ both one-to-one and onto?'
            answer: 'yes'
            answer_contract: {"kind": "label", "options": [["yes", "it is both", "both"], ["no", "it is not both", "not both", "neither"]]}
            solution_sketch: 'The determinant is $2 \cdot 3 - 5 \cdot 1 = 1$, which is not zero. For a square matrix, a nonzero determinant means that $T$ is both one-to-one and onto.'
          - problem: 'Let $T(\mathbf{x}) = A\mathbf{x}$ with $A = \begin{pmatrix}3&6\\1&2\end{pmatrix}$ be a map from $\mathbb{R}^2$ to $\mathbb{R}^2$. Is $T$ onto?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "it is onto", "onto"], ["no", "it is not onto", "not onto"]]}
            solution_sketch: 'The determinant is $3 \cdot 2 - 6 \cdot 1 = 0$. A square matrix with determinant $0$ gives a map that is neither one-to-one nor onto. So $T$ is not onto.'
          - problem: 'Let $T(\mathbf{x}) = A\mathbf{x}$ with $A = \begin{pmatrix}1&2\\3&k\end{pmatrix}$, where $k$ is a real number. For which value of $k$ is $T$ not one-to-one?'
            answer: '6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The map is not one-to-one exactly when $\det A = 0$. We have $\det A = 1 \cdot k - 2 \cdot 3 = k - 6$, so $k - 6 = 0$ gives $k = 6$.'
          - problem: 'The map $T: \mathbb{R}^2 \to \mathbb{R}^2$ is given by $T(x, y) = (4x + ky,\ x + y)$, where $k$ is a real number. For which value of $k$ is $T$ not onto?'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The standard matrix is $\begin{pmatrix}4&k\\1&1\end{pmatrix}$, and $T$ is not onto exactly when its determinant is $0$. We have $\det = 4 \cdot 1 - k \cdot 1 = 4 - k$, so $k = 4$.'
          - problem: 'Let $T(\mathbf{x}) = A\mathbf{x}$ with $A = \begin{pmatrix}a&3\\2&a\end{pmatrix}$, where $a$ is a positive real number. The map $T$ is not one-to-one. Find $a$.'
            answer: 'sqrt(6)'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The map is not one-to-one exactly when $\det A = 0$. We have $\det A = a \cdot a - 3 \cdot 2 = a^2 - 6$, so $a^2 = 6$. The positive solution is $a = \sqrt{6}$.'
          - problem: '$T: \mathbb{R}^3 \to \mathbb{R}^3$ is a one-to-one linear map. What is the dimension of its image?'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'One-to-one means that the kernel is $\{\mathbf{0}\}$, so $\dim \ker T = 0$. Rank-nullity gives $\dim \operatorname{im} T = 3 - 0 = 3$, so the image is all of $\mathbb{R}^3$ and $T$ is also onto.'
          - problem: 'A message $(x, y)$ is encoded as $T(x, y) = (3x + 2y,\ x + y)$. The receiver decodes by solving for $(x, y)$. Which message was encoded as $(8, 3)$?'
            answer: '(2, 1)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'The encoding matrix has determinant $3 \cdot 1 - 2 \cdot 1 = 1$, so $T$ is one-to-one and every code has exactly one message. From $x + y = 3$ and $3x + 2y = 8$ we get $x = 2$ and $y = 1$.'
          - problem: 'A market model turns the pair $(x, y)$ into $T(x, y) = (2x + ky,\ 3x + 4y)$. For which value of $k$ do two different pairs give the same output?'
            answer: '8/3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Two different pairs give the same output exactly when $T$ is not one-to-one, which means that $\det = 0$. We have $2 \cdot 4 - 3k = 8 - 3k$, so $3k = 8$ and $k = 8/3$.'
          - problem: 'Sam says that $T(\mathbf{x}) = A\mathbf{x}$ with $A = \begin{pmatrix}2&4\\1&2\end{pmatrix}$ is onto but not one-to-one. What is the dimension of the image of $T$?'
            answer: '1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Sam forgot that a square matrix gives both properties or neither. The determinant is $2 \cdot 2 - 4 \cdot 1 = 0$, so $T$ is not onto either. The rank is $1$, so the image has dimension $1$.'
        constraints: 'square 2x2 decided by the determinant; both-or-neither; one 3x3 dimension item; at most two yes/no items'
    diagnostic_exemplar:
      problem: '$A = \begin{pmatrix}2&4&1\\0&0&3\end{pmatrix}$ defines $T : \mathbb{R}^3 \to \mathbb{R}^2$. Is $T$ one-to-one? Is it onto? Justify from the pivots.'
      answer: 'Not one-to-one (3 columns but only 2 pivots, so the kernel is nontrivial); onto (2 pivots = the number of rows, so the columns span R^2)'
      answer_contract: {kind: none}
      solution_sketch: 'Pivots sit in columns $1$ and $3$; the free variable $x_2$ gives a nonzero kernel vector, while a pivot in every row makes the column space all of $\mathbb{R}^2$.'
    anki_seeds:
      - front: 'A linear map is one-to-one iff its kernel is...'
        back: '$\{\mathbf{0}\}$ (equivalently, a pivot in every column).'
        type: basic
      - front: '$T(\mathbf{x}) = A\mathbf{x}$ is onto $\mathbb{R}^m$ iff $A$ has...'
        back: 'a pivot in every row ($\mathrm{Col}(A) = \mathbb{R}^m$).'
        type: basic
      - front: 'For a SQUARE matrix, one-to-one and onto are...'
        back: 'equivalent (both hold iff the matrix is invertible).'
        type: basic

  - id: orthogonal-orthonormal-sets
    name: Orthogonal and Orthonormal Sets
    core: false                # head of the terminal orthogonality -> least-squares branch
    difficulty: 0.65
    drill: false
    answer_kind: numeric
    expected_time_secs: 180
    prerequisites:
      - id: dot-product
        weight: 0.7
        key: true
      - id: basis-dimension
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: Checking orthogonality and normalizing
        key_prerequisites: [dot-product]
        exemplars:
          - problem: 'The vectors $(3, 4)$ and $(-4, 3)$ are orthogonal. Normalize $(-4, 3)$ so that it can belong to an orthonormal set.'
            answer: '(-4/5, 3/5)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'The length of $(-4, 3)$ is $\sqrt{16 + 9} = 5$. Divide each entry by $5$ to get the unit vector $(-\frac{4}{5}, \frac{3}{5})$.'
          - problem: 'Is the set $\{(5, 12), (-12, 5)\}$ an orthogonal set?'
            answer: 'yes'
            answer_contract: {"kind": "label", "options": [["yes", "yes, it is", "it is", "true", "correct", "it is orthogonal", "orthogonal"], ["no", "no, it is not", "it is not", "false", "incorrect", "it is not orthogonal", "not orthogonal"]]}
            solution_sketch: 'The dot product of the two vectors is $5(-12) + 12(5) = -60 + 60 = 0$. A set of two vectors with dot product $0$ is orthogonal, so the answer is yes.'
          - problem: 'Two straight walkways on a plan run in the directions $(k, 5)$ and $(10, -4)$. The walkways meet at a right angle. Find $k$.'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Walkways at a right angle have directions with dot product $0$. So $10k + 5(-4) = 10k - 20 = 0$, which gives $k = 2$.'
          - problem: 'Sam says that the set $\{(4, 3), (-3, 4)\}$ is orthonormal because the dot product of its two vectors is $0$. What is the length of each vector in the set?'
            answer: '5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Sam checked orthogonality only. Each vector has length $\sqrt{16 + 9} = \sqrt{25} = 5$, which is not $1$, so the set is orthogonal but not orthonormal.'
          - problem: 'A game engine moves a character along two perpendicular tracks with directions $(1, 1)$ and $(-1, 1)$. The engine needs direction vectors of length $1$. What is the direction vector for the second track?'
            answer: '(-sqrt(2)/2, sqrt(2)/2)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'The second direction $(-1, 1)$ has length $\sqrt{1 + 1} = \sqrt{2}$. Divide each entry by $\sqrt{2}$ to get $\left(-\frac{\sqrt{2}}{2}, \frac{\sqrt{2}}{2}\right)$.'
          - problem: 'Is the set $\{(2, 3), (3, 2)\}$ an orthogonal set?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "yes, it is", "it is", "true", "correct", "it is orthogonal", "orthogonal"], ["no", "no, it is not", "it is not", "false", "incorrect", "it is not orthogonal", "not orthogonal"]]}
            solution_sketch: 'The dot product of the two vectors is $2(3) + 3(2) = 12$. The dot product is not $0$, so the set is not orthogonal.'
          - problem: 'The set $\{(2, 3, 6), (3, -6, 2), (6, 2, -3)\}$ is orthogonal. Normalize its third vector to get a vector of an orthonormal set.'
            answer: '(6/7, 2/7, -3/7)'
            answer_contract: {"kind": "coordinates", "arity": 3}
            solution_sketch: 'The length of $(6, 2, -3)$ is $\sqrt{36 + 4 + 9} = \sqrt{49} = 7$. Divide each entry by $7$ to get $(\frac{6}{7}, \frac{2}{7}, -\frac{3}{7})$.'
          - problem: 'By what number must $(3, 4)$ be multiplied to give a vector of length $1$?'
            answer: '1/5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The length of $(3, 4)$ is $\sqrt{9 + 16} = 5$. Multiplying by $c$ gives length $5c$, and $5c = 1$ gives $c = \frac{1}{5}$.'
        constraints: "pairs with dot product 0 for yes-cases; norms 5, sqrt(2), or 3 for clean normalization"
      - id: kp2
        name: Orthogonal sets in R^3 and independence
        key_prerequisites: [dot-product, basis-dimension]
        exemplars:
          - problem: 'Do the vectors $(1, 2, 2)$, $(2, 1, -2)$ and $(2, -2, 1)$ form a basis of $\mathbb{R}^3$?'
            answer: 'yes'
            answer_contract: {"kind": "label", "options": [["yes", "yes, it is", "it is", "true", "correct"], ["no", "no, it is not", "it is not", "false", "incorrect"]]}
            solution_sketch: 'The pairwise dot products are $2 + 2 - 4 = 0$, $2 - 4 + 2 = 0$ and $4 - 2 - 2 = 0$. So the vectors are orthogonal and nonzero, hence independent, and three independent vectors form a basis of $\mathbb{R}^3$.'
          - problem: 'The set $\{(1, 3, 2), (3, -1, 0), (1, 3, t)\}$ is orthogonal. Find $t$.'
            answer: '-5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The second vector is already orthogonal to the other two. The first and third need $1(1) + 3(3) + 2t = 10 + 2t = 0$, so $t = -5$.'
          - problem: 'A drone flies $3$ km east, then $4$ km north, then climbs $12$ km straight up. How far is the drone from its starting point?'
            answer: '13'
            answer_contract: {"kind": "unit", "quantity": "length", "unit": "km", "allow_omitted": true}
            solution_sketch: 'The three legs run in perpendicular directions, so the squares of their lengths add. The distance is $\sqrt{9 + 16 + 144} = \sqrt{169} = 13$ km.'
          - problem: 'Ana says that $\{(1, 1, 0), (1, -1, 0), (0, 0, 0)\}$ is a basis of $\mathbb{R}^3$ because every pair of vectors has dot product $0$. Is Ana right?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "yes, it is", "it is", "true", "correct"], ["no", "no, it is not", "it is not", "false", "incorrect"]]}
            solution_sketch: 'Every pair does have dot product $0$, but the set contains the zero vector. The span of the set has dimension $2$, not $3$, so the set is not a basis of $\mathbb{R}^3$.'
          - problem: 'Three edges of a rectangular box meet at one corner and run in the directions $(2, 3, 6)$, $(3, -6, 2)$ and $(6, 2, c)$. Find $c$.'
            answer: '-3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Edges of a rectangular box are pairwise perpendicular. So $(2, 3, 6)\cdot(6, 2, c) = 18 + 6c = 0$ gives $c = -3$. The edges $(3, -6, 2)$ and $(6, 2, -3)$ also check: $18 - 12 - 6 = 0$.'
          - problem: 'Let $S = \{(1, 0, 2), (0, 3, 0), (0, 0, 0)\}$. What is the dimension of the span of $S$?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The zero vector adds nothing to a span. The other two vectors are orthogonal and nonzero, so they are independent, and the span has dimension $2$.'
          - problem: 'Let $\mathbf{u}$ and $\mathbf{v}$ be orthogonal vectors of length $1$. Find the length of $3\mathbf{u} - 4\mathbf{v}$.'
            answer: '5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Because $\mathbf{u}$ and $\mathbf{v}$ are orthogonal, the squares of the lengths add. So $\|3\mathbf{u} - 4\mathbf{v}\|^2 = 9 + 16 = 25$, and the length is $5$.'
          - problem: 'An orthogonal set of $5$ nonzero vectors lies in $\mathbb{R}^5$. What is the dimension of its span?'
            answer: '5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Nonzero orthogonal vectors are linearly independent. So the $5$ vectors are independent and span a space of dimension $5$, which is all of $\mathbb{R}^5$.'
        constraints: '3 vectors in R^3 with all pairwise dot products checkable mentally; sets with a zero vector and orthogonal sets in R^n are allowed'
      - id: kp3
        name: Coordinates in an orthogonal basis
        key_prerequisites: [dot-product, basis-dimension]
        try_first:
          problem: 'Find numbers $a$ and $b$ so that $a(1, 2) + b(2, -1) = (8, 1)$. What is $a$?'
          answer_contract: {"kind": "exact"}
          answer: '2'
          reveal: 'The vectors $(1, 2)$ and $(2, -1)$ are orthogonal, so one dot product with $(1, 2)$ gives $a$ directly: $(8, 1)\cdot(1, 2) = 10$ and $(1, 2)\cdot(1, 2) = 5$, so $a = 2$.'
        exemplars:
          - problem: 'Find the coordinates of $(7, 1)$ relative to the orthogonal basis $\{(1, 1), (1, -1)\}$.'
            answer: '(4, 3)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'Each coordinate is $\frac{\mathbf{x}\cdot\mathbf{v}}{\mathbf{v}\cdot\mathbf{v}}$. So $\frac{7 + 1}{2} = 4$ for $(1, 1)$ and $\frac{7 - 1}{2} = 3$ for $(1, -1)$.'
          - problem: 'The vector $(3, 5, 1)$ is expanded in an orthogonal basis of $\mathbb{R}^3$ that contains $(1, 0, 1)$. Find the coefficient of $(1, 0, 1)$.'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The coefficient is $\frac{\mathbf{x}\cdot\mathbf{v}}{\mathbf{v}\cdot\mathbf{v}}$. Here $\mathbf{x}\cdot\mathbf{v} = 3 + 1 = 4$ and $\mathbf{v}\cdot\mathbf{v} = 1 + 1 = 2$, so the coefficient is $2$.'
          - problem: 'Find the coordinates of $(5, 3, 6)$ relative to the orthogonal basis $\{(1, 1, 0), (1, -1, 0), (0, 0, 1)\}$.'
            answer: '(4, 1, 6)'
            answer_contract: {"kind": "coordinates", "arity": 3}
            solution_sketch: 'The three dot products with $\mathbf{x}$ are $8$, $2$ and $6$. The three squared lengths are $2$, $2$ and $1$, so the coordinates are $\frac{8}{2} = 4$, $\frac{2}{2} = 1$ and $\frac{6}{1} = 6$.'
          - problem: 'A force of $(14, 2)$ newtons is resolved along two perpendicular rails with directions $(2, 1)$ and $(-1, 2)$, so that $F = a(2, 1) + b(-1, 2)$. Find $a$ and $b$.'
            answer: '(6, -2)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'The rails are orthogonal, so $a = \frac{F\cdot(2, 1)}{5} = \frac{30}{5} = 6$ and $b = \frac{F\cdot(-1, 2)}{5} = \frac{-10}{5} = -2$. Check: $6(2, 1) - 2(-1, 2) = (14, 2)$.'
          - problem: 'A boat moves with velocity $(10, 5)$ km/h in map coordinates. The river flows in the direction of the unit vector $(3/5, 4/5)$, and the unit vector $(-4/5, 3/5)$ points across the river. At what speed does the boat move along the river?'
            answer: '10'
            answer_contract: {"kind": "unit", "quantity": "speed", "unit": "km/h", "allow_omitted": true}
            solution_sketch: 'For a unit vector $u$ the denominator $u\cdot u$ is $1$. So the speed along the river is the dot product $(10, 5)\cdot(3/5, 4/5) = 6 + 4 = 10$ km/h.'
          - problem: 'In the orthogonal basis $\{(1, 0, 1), (0, 1, 0), (1, 0, -1)\}$ a vector has coordinates $(2, 3, 4)$. What is the vector?'
            answer: '(6, 3, -2)'
            answer_contract: {"kind": "coordinates", "arity": 3}
            solution_sketch: 'The vector is $2(1, 0, 1) + 3(0, 1, 0) + 4(1, 0, -1)$. The entries are $2 + 4 = 6$, $3$ and $2 - 4 = -2$, so the vector is $(6, 3, -2)$.'
          - problem: 'The vector $(3, 10, 2)$ is expanded in an orthogonal basis that contains $(1, 2, 2)$. Find the coefficient of $(1, 2, 2)$.'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Here $\mathbf{x}\cdot\mathbf{v} = 3 + 20 + 4 = 27$ and $\mathbf{v}\cdot\mathbf{v} = 1 + 4 + 4 = 9$. The coefficient is $\frac{27}{9} = 3$.'
          - problem: 'Sam expands $(6, 2)$ in the orthogonal basis $\{(1, 1), (1, -1)\}$ and reports the coordinates $(8, 4)$, the dot products with the basis vectors. What are the correct coordinates?'
            answer: '(4, 2)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'Sam forgot to divide by $\mathbf{v}\cdot\mathbf{v}$, which is $2$ for both basis vectors. The correct coordinates are $\frac{8}{2} = 4$ and $\frac{4}{2} = 2$.'
        constraints: "orthogonal bases only; coefficients are integers"
    diagnostic_exemplar:
      problem: 'Verify that $B = \{(2, 1), (-1, 2)\}$ is an orthogonal basis of $\mathbb{R}^2$, then use dot products to write $\mathbf{x} = (3, 4)$ in that basis.'
      answer: 'Orthogonal (dot product -2 + 2 = 0), hence a basis of R^2; x = 2(2, 1) + 1(-1, 2)'
      answer_contract: {kind: none}
      solution_sketch: 'Each coefficient is $\mathbf{x}\cdot\mathbf{b}_i / \|\mathbf{b}_i\|^2$: $10/5 = 2$ and $5/5 = 1$.'
    anki_seeds:
      - front: 'An orthonormal set is an orthogonal set whose vectors all have...'
        back: 'norm $1$.'
        type: basic
      - front: 'Coefficient of $\mathbf{v}_i$ when expanding $\mathbf{x}$ in an ORTHOGONAL basis?'
        back: '$c_i = \dfrac{\mathbf{x} \cdot \mathbf{v}_i}{\mathbf{v}_i \cdot \mathbf{v}_i}$ — no system solving needed.'
        type: basic
      - front: 'Orthogonal sets of nonzero vectors are automatically...'
        back: 'linearly independent.'
        type: basic

  - id: orthogonal-complements
    name: Orthogonal Complements
    core: false                # orthogonality branch; feeds only orthogonal projection
    difficulty: 0.7
    drill: false
    answer_kind: numeric
    expected_time_secs: 180
    prerequisites:
      - id: orthogonal-orthonormal-sets
        weight: 0.6
        key: true
      - id: null-column-space-rank
        weight: 0.5
    knowledge_points:
      - id: kp1
        name: Complements of lines
        key_prerequisites: [orthogonal-orthonormal-sets]
        exemplars:
          - problem: 'Find the vector in the orthogonal complement of $\operatorname{span}\{(2, 1, 2)\}$ in $\mathbb{R}^3$ whose first component is $1$ and whose third component is $0$.'
            answer: '(1, -2, 0)'
            answer_contract: {"kind": "coordinates", "arity": 3}
            solution_sketch: 'A vector $(1, y, 0)$ lies in the complement exactly when its dot product with $(2, 1, 2)$ is $0$. So $2 + y = 0$ gives $y = -2$, and the vector is $(1, -2, 0)$.'
          - problem: 'A line through the origin of $\mathbb{R}^2$ has direction $(3, 4)$. Find the unit vector in its orthogonal complement whose second component is positive.'
            answer: '(-4/5, 3/5)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'A vector $(a, b)$ is orthogonal to $(3, 4)$ when $3a + 4b = 0$, so $(-4, 3)$ is a direction of the complement. Its length is $5$, so the unit vector is $(-\frac{4}{5}, \frac{3}{5})$.'
          - problem: 'Does $(1, 4, 1)$ lie in the orthogonal complement of $\operatorname{span}\{(3, -2, 5)\}$ in $\mathbb{R}^3$?'
            answer: 'yes'
            answer_contract: {"kind": "label", "options": [["yes", "yes, it is", "it is", "true", "correct"], ["no", "no, it is not", "it is not", "false", "incorrect"]]}
            solution_sketch: 'A vector lies in the complement when its dot product with $(3, -2, 5)$ is $0$. Here $3(1) - 2(4) + 5(1) = 3 - 8 + 5 = 0$, so the answer is yes.'
          - problem: 'Find $t$ so that $(t, 1, -4)$ lies in the orthogonal complement of $\operatorname{span}\{(2, 3, 1)\}$ in $\mathbb{R}^3$.'
            answer: '1/2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The dot product with $(2, 3, 1)$ must be $0$. So $2t + 3 - 4 = 2t - 1 = 0$, which gives $t = \frac{1}{2}$.'
          - problem: 'A straight pipe runs in the direction $(2, 3, 6)$. A brace is perpendicular to the pipe and lies parallel to the floor, so its direction is $(3, b, 0)$. Find $b$.'
            answer: '-2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A brace perpendicular to the pipe has direction with dot product $0$ with $(2, 3, 6)$. So $6 + 3b + 0 = 0$, which gives $b = -2$.'
          - problem: 'A cart moves along the direction $(4, 3)$. A force $(F, 8)$ newtons does no work on the cart, which means that the force is perpendicular to the direction of motion. Find $F$.'
            answer: '-6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The work is the dot product of force and direction, and it must be $0$. So $4F + 24 = 0$, which gives $F = -6$.'
          - problem: 'A line through the origin of $\mathbb{R}^4$ is spanned by one nonzero vector. What is the dimension of its orthogonal complement?'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'For a subspace $W$ of $\mathbb{R}^n$ the dimensions satisfy $\dim W + \dim W^\perp = n$. Here $1 + \dim W^\perp = 4$, so the complement has dimension $3$.'
          - problem: 'Is $(2, -1, 3)$ in the orthogonal complement of $\operatorname{span}\{(1, 2, 1)\}$ in $\mathbb{R}^3$?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "yes, it is", "it is", "true", "correct"], ["no", "no, it is not", "it is not", "false", "incorrect"]]}
            solution_sketch: 'The dot product with $(1, 2, 1)$ is $2 - 2 + 3 = 3$. The dot product is not $0$, so the vector is not in the complement.'
          - problem: 'Find an equation of the orthogonal complement of $\operatorname{span}\{(1, -2, 3)\}$ in $\mathbb{R}^3$.'
            answer: 'x - 2y + 3z = 0'
            answer_contract: {"kind": "polynomial_relation"}
            solution_sketch: 'A vector $(x, y, z)$ lies in the complement when its dot product with $(1, -2, 3)$ is $0$. That condition is $x - 2y + 3z = 0$, the equation of a plane through the origin.'
          - problem: 'The orthogonal complement of a line through the origin of $\mathbb{R}^3$ is the plane $2x + y - 2z = 0$. Find the vector on the line whose first component is $4$.'
            answer: '(4, 2, -4)'
            answer_contract: {"kind": "coordinates", "arity": 3}
            solution_sketch: 'The line is the orthogonal complement of the plane, so it is spanned by the normal vector $(2, 1, -2)$ of the plane. Multiplying by $2$ makes the first component $4$, which gives $(4, 2, -4)$.'
        constraints: 'lines with small integer directions; complements described by one homogeneous equation; verdict, parameter and dimension items allowed'
      - id: kp2
        name: Complements of planes and dimensions
        key_prerequisites: [orthogonal-orthonormal-sets, null-column-space-rank]
        exemplars:
          - problem: 'Find the vector in the orthogonal complement of the plane $3x - y + 2z = 0$ whose first component is $6$.'
            answer: '(6, -2, 4)'
            answer_contract: {"kind": "coordinates", "arity": 3}
            solution_sketch: 'The complement of the plane is the line spanned by the normal vector $(3, -1, 2)$. Multiplying the normal vector by $2$ makes the first component $6$, which gives $(6, -2, 4)$.'
          - problem: 'A subspace $W$ of $\mathbb{R}^7$ has dimension $3$. What is the dimension of $W^\perp$?'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The dimensions satisfy $\dim W + \dim W^\perp = n$. So $3 + \dim W^\perp = 7$, and $\dim W^\perp = 4$.'
          - problem: 'A flat mirror through the origin is the plane $2x + 2y - z = 0$. A laser beam hits the mirror at the origin along the line perpendicular to it. Find a direction vector of the beam whose third component is $3$.'
            answer: '(-6, -6, 3)'
            answer_contract: {"kind": "coordinates", "arity": 3}
            solution_sketch: 'The line perpendicular to the plane is spanned by its normal vector $(2, 2, -1)$. Multiplying by $-3$ makes the third component $3$, which gives $(-6, -6, 3)$.'
          - problem: 'Is the line $\operatorname{span}\{(1, 2, -1)\}$ the orthogonal complement of the plane $x + 2y - z = 0$?'
            answer: 'yes'
            answer_contract: {"kind": "label", "options": [["yes", "yes, it is", "it is", "true", "correct"], ["no", "no, it is not", "it is not", "false", "incorrect"]]}
            solution_sketch: 'The plane has normal vector $(1, 2, -1)$, and a plane through the origin has the line spanned by its normal vector as its complement. So the answer is yes.'
          - problem: 'A plane through the origin in $\mathbb{R}^5$ is a $2$-dimensional subspace $W$. What is the dimension of $W^\perp$?'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A $2$-dimensional subspace of $\mathbb{R}^5$ satisfies $2 + \dim W^\perp = 5$. So the complement has dimension $3$.'
          - problem: 'The plane $W$ is spanned by $(1, 0, 1)$ and $(0, 1, 1)$. Find the vector in $W^\perp$ whose third component is $1$.'
            answer: '(-1, -1, 1)'
            answer_contract: {"kind": "coordinates", "arity": 3}
            solution_sketch: 'A vector $(a, b, c)$ is in $W^\perp$ when $a + c = 0$ and $b + c = 0$. With $c = 1$ this gives $a = -1$ and $b = -1$, so the vector is $(-1, -1, 1)$.'
          - problem: 'A measuring device records $8$ numbers per sample. The signal always lies in a $3$-dimensional subspace $W$ of $\mathbb{R}^8$. The noise directions are those orthogonal to every signal direction. How many independent noise directions are there?'
            answer: '5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The noise directions form the orthogonal complement $W^\perp$. Since $\dim W + \dim W^\perp = 8$, we get $3 + \dim W^\perp = 8$, so there are $5$ independent noise directions.'
          - problem: 'Is the line $\operatorname{span}\{(1, 2, 3)\}$ the orthogonal complement of the plane $3x + 2y + z = 0$?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "yes, it is", "it is", "true", "correct"], ["no", "no, it is not", "it is not", "false", "incorrect"]]}
            solution_sketch: 'The normal vector of the plane is $(3, 2, 1)$, so its complement is the line spanned by $(3, 2, 1)$. The vector $(1, 2, 3)$ is not a multiple of $(3, 2, 1)$, so the answer is no.'
        constraints: 'planes or lines given by one equation or two spanning vectors; dimension questions via dim W + dim W-perp = n; verdict items allowed'
      - id: kp3
        name: Null space and row space are perpendicular
        key_prerequisites: [null-column-space-rank, orthogonal-orthonormal-sets]
        exemplars:
          - problem: 'Let $A = \begin{pmatrix} 4 & -7 \end{pmatrix}$. Find the vector in $\operatorname{Nul}(A)$ whose first entry is $7$.'
            answer: '(7, 4)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'The equation $A\mathbf{x} = \mathbf{0}$ reads $4x_1 - 7x_2 = 0$, so $x_2 = \frac{4}{7}x_1$. With $x_1 = 7$ we get $x_2 = 4$, and the vector is $(7, 4)$.'
          - problem: 'Let $A = \begin{pmatrix} 1 & 2 & 0 \\ 0 & 1 & 1 \end{pmatrix}$. Find the vector in $\operatorname{Nul}(A)$ whose last entry is $1$.'
            answer: '(2, -1, 1)'
            answer_contract: {"kind": "coordinates", "arity": 3}
            solution_sketch: 'The equations are $x + 2y = 0$ and $y + z = 0$. With $z = 1$ the second gives $y = -1$, and then the first gives $x = 2$, so the vector is $(2, -1, 1)$.'
          - problem: 'Let $A = \begin{pmatrix} 2 & 4 \end{pmatrix}$. Does the vector $(3, -2)$ lie in $\operatorname{Nul}(A)$?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "yes, it is", "it is", "true", "correct"], ["no", "no, it is not", "it is not", "false", "incorrect"]]}
            solution_sketch: 'A vector lies in $\operatorname{Nul}(A)$ when its dot product with the row of $A$ is $0$. Here $2(3) + 4(-2) = -2$, which is not $0$, so the answer is no.'
          - problem: 'Sam says that $\operatorname{Nul}(A)$ for $A = \begin{pmatrix} 2 & 3 \end{pmatrix}$ is the line spanned by $(2, 3)$, the row of $A$. What is the vector in $\operatorname{Nul}(A)$ whose first entry is $3$?'
            answer: '(3, -2)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'Sam used the row itself, but the null space is orthogonal to the row. The equation $2x_1 + 3x_2 = 0$ with $x_1 = 3$ gives $x_2 = -2$, so the vector is $(3, -2)$.'
          - problem: 'Let $A = \begin{pmatrix} a & 2 & 0 \\ 1 & 1 & 1 \end{pmatrix}$. Find $a$ so that $(1, -2, 1)$ lies in $\operatorname{Nul}(A)$.'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The vector must be orthogonal to both rows. The second row gives $1 - 2 + 1 = 0$, and the first row gives $a - 4 = 0$, so $a = 4$.'
          - problem: 'A $2 \times 3$ matrix $A$ has rank $2$. What is the dimension of $(\operatorname{Row} A)^\perp$?'
            answer: '1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The row space is a $2$-dimensional subspace of $\mathbb{R}^3$. Its orthogonal complement has dimension $3 - 2 = 1$, and it equals $\operatorname{Nul}(A)$.'
          - problem: 'Two straight cables run from the origin in the directions $(1, 1, 0)$ and $(0, 1, 1)$. A rod from the origin is perpendicular to both cables. Find the direction of the rod whose first component is $1$.'
            answer: '(1, -1, 1)'
            answer_contract: {"kind": "coordinates", "arity": 3}
            solution_sketch: 'The rod direction $(x, y, z)$ must satisfy $x + y = 0$ and $y + z = 0$. With $x = 1$ we get $y = -1$ and then $z = 1$, so the direction is $(1, -1, 1)$.'
          - problem: 'A force $(a, b, 3)$ newtons does no work on a cart that moves along $(1, 2, 0)$ and also does no work when the cart moves along $(0, 1, 1)$. Find $a$.'
            answer: '6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Zero work means the force is perpendicular to both directions. So $a + 2b = 0$ and $b + 3 = 0$, which give $b = -3$ and $a = 6$.'
        constraints: '1x2 or 2x3 matrices; verification by one or two dot products; verdict, parameter and dimension items allowed'
    diagnostic_exemplar:
      problem: 'Find a basis for the orthogonal complement of the plane $x + 2y - z = 0$ in $\mathbb{R}^3$, give its dimension, and say how it is related to $A = \begin{pmatrix}1&2&-1\end{pmatrix}$.'
      answer: 'Basis {(1, 2, -1)} (any nonzero multiple); dimension 1; the plane is Nul(A) and its complement is Row(A)'
      answer_contract: {kind: none}
      solution_sketch: 'A plane through the origin is the null space of its coefficient row, and $(\mathrm{Nul}\,A)^\perp = \mathrm{Row}\,A$; the dimensions $2$ and $1$ sum to $3$.'
    anki_seeds:
      - front: '$W^\perp$ is defined as the set of vectors that are...'
        back: 'orthogonal to every vector of $W$.'
        type: basic
      - front: 'For a subspace $W \subseteq \mathbb{R}^n$: $\dim W + \dim W^\perp = $ ?'
        back: '$n$.'
        type: basic
      - front: '$(\mathrm{Row}\, A)^\perp = $ ?'
        back: '$\mathrm{Nul}(A)$.'
        type: basic

  - id: orthogonal-projection-subspace
    name: Orthogonal Projection onto a Subspace
    core: false                # orthogonality branch; feeds only least squares
    difficulty: 0.75
    drill: false
    answer_kind: numeric
    expected_time_secs: 240
    prerequisites:
      - id: orthogonal-orthonormal-sets
        weight: 0.7
        key: true
      - id: vector-projections
        weight: 0.6
        key: true
      - id: orthogonal-complements
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: Projecting with an orthogonal basis
        key_prerequisites: [orthogonal-orthonormal-sets, vector-projections]
        exemplars:
          - problem: 'Find the orthogonal projection of $(3, 1, 2)$ onto the plane $W = \operatorname{span}\{(1, 1, 0), (0, 0, 1)\}$.'
            answer: '(2, 2, 2)'
            answer_contract: {"kind": "coordinates", "arity": 3}
            solution_sketch: 'The basis vectors are orthogonal. The coefficients are $\frac{4}{2} = 2$ for $(1, 1, 0)$ and $\frac{2}{1} = 2$ for $(0, 0, 1)$, so the projection is $2(1, 1, 0) + 2(0, 0, 1) = (2, 2, 2)$.'
          - problem: 'Find the orthogonal projection of $(6, 5, 3)$ onto $W = \operatorname{span}\{(2, 0, 0), (0, 1, 1)\}$.'
            answer: '(6, 4, 4)'
            answer_contract: {"kind": "coordinates", "arity": 3}
            solution_sketch: 'The coefficients are $\frac{12}{4} = 3$ for $(2, 0, 0)$ and $\frac{8}{2} = 4$ for $(0, 1, 1)$. So the projection is $3(2, 0, 0) + 4(0, 1, 1) = (6, 4, 4)$.'
          - problem: 'Find the orthogonal projection of $(11, -2, 1)$ onto $W = \operatorname{span}\{(1, 2, 2), (2, 1, -2)\}$.'
            answer: '(5, 4, -2)'
            answer_contract: {"kind": "coordinates", "arity": 3}
            solution_sketch: 'The coefficients are $\frac{9}{9} = 1$ for $(1, 2, 2)$ and $\frac{18}{9} = 2$ for $(2, 1, -2)$. So the projection is $(1, 2, 2) + 2(2, 1, -2) = (5, 4, -2)$.'
          - problem: 'A solar panel lies in the plane $W = \operatorname{span}\{(1, 0, 1), (0, 1, 0)\}$. The tip of a pole is at the point $(2, 3, 4)$. Light falls perpendicular to the panel. Find the point of the panel where the shadow of the tip falls.'
            answer: '(3, 3, 3)'
            answer_contract: {"kind": "coordinates", "arity": 3}
            solution_sketch: 'The shadow is the orthogonal projection of $(2, 3, 4)$ onto $W$. The coefficients are $\frac{6}{2} = 3$ and $\frac{3}{1} = 3$, so the shadow is $3(1, 0, 1) + 3(0, 1, 0) = (3, 3, 3)$.'
          - problem: 'A particle must stay in the plane spanned by $(1, -1, 0)$ and $(1, 1, -2)$. A force $(6, 0, -3)$ newtons acts on it. Find the part of the force that acts along the plane.'
            answer: '(5, -1, -4)'
            answer_contract: {"kind": "coordinates", "arity": 3}
            solution_sketch: 'The part along the plane is the orthogonal projection of the force. The coefficients are $\frac{6}{2} = 3$ and $\frac{12}{6} = 2$, so the part is $3(1, -1, 0) + 2(1, 1, -2) = (5, -1, -4)$.'
          - problem: 'Let $W = \operatorname{span}\{(1, 0, 1), (1, 0, -1)\}$ and $\mathbf{x} = (4, 3, 8)$. Find $\mathbf{x} - \hat{\mathbf{x}}$, where $\hat{\mathbf{x}}$ is the orthogonal projection of $\mathbf{x}$ onto $W$.'
            answer: '(0, 3, 0)'
            answer_contract: {"kind": "coordinates", "arity": 3}
            solution_sketch: 'The coefficients are $\frac{12}{2} = 6$ and $\frac{-4}{2} = -2$, so $\hat{\mathbf{x}} = 6(1, 0, 1) - 2(1, 0, -1) = (4, 0, 8)$. Then $\mathbf{x} - \hat{\mathbf{x}} = (0, 3, 0)$.'
          - problem: 'Sam projects $(6, 2, 2)$ onto $W = \operatorname{span}\{(1, 1, 0), (1, -1, 0)\}$. He uses the dot products $8$ and $4$ directly as coefficients and gets $(12, 4, 0)$. What is the correct projection?'
            answer: '(6, 2, 0)'
            answer_contract: {"kind": "coordinates", "arity": 3}
            solution_sketch: 'Sam forgot to divide each dot product by $\mathbf{v}\cdot\mathbf{v}$, which is $2$ for both basis vectors. The coefficients are $\frac{8}{2} = 4$ and $\frac{4}{2} = 2$, so the projection is $4(1, 1, 0) + 2(1, -1, 0) = (6, 2, 0)$.'
          - problem: 'Find the orthogonal projection of $(1, 2, 3, 4)$ onto $W = \operatorname{span}\{(1, 1, 0, 0), (0, 0, 1, 1)\}$ in $\mathbb{R}^4$.'
            answer: '(3/2, 3/2, 7/2, 7/2)'
            answer_contract: {"kind": "coordinates", "arity": 4}
            solution_sketch: 'The coefficients are $\frac{3}{2}$ for $(1, 1, 0, 0)$ and $\frac{7}{2}$ for $(0, 0, 1, 1)$. So the projection is $\left(\frac{3}{2}, \frac{3}{2}, \frac{7}{2}, \frac{7}{2}\right)$.'
        constraints: 'orthogonal bases with 2 vectors in R^3 or R^4; projection coefficients are integers or halves; always check the residual'
      - id: kp2
        name: The orthogonal decomposition
        key_prerequisites: [orthogonal-orthonormal-sets, vector-projections, orthogonal-complements]
        exemplars:
          - problem: 'Write $\mathbf{x} = (15, 3)$ as the sum of a vector in $W = \operatorname{span}\{(2, 3)\}$ and a vector orthogonal to $W$. What is the vector in $W$?'
            answer: '(6, 9)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'The vector in $W$ is $\frac{\mathbf{x}\cdot\mathbf{u}}{\mathbf{u}\cdot\mathbf{u}}\mathbf{u}$. Here $\mathbf{x}\cdot\mathbf{u} = 39$ and $\mathbf{u}\cdot\mathbf{u} = 13$, so the vector is $3(2, 3) = (6, 9)$.'
          - problem: 'Write $\mathbf{x} = (13, 1, 4)$ as the sum of a vector in $W = \operatorname{span}\{(1, 1, 1)\}$ and a vector orthogonal to $W$. What is the vector orthogonal to $W$?'
            answer: '(7, -5, -2)'
            answer_contract: {"kind": "coordinates", "arity": 3}
            solution_sketch: 'The vector in $W$ is $\frac{18}{3}(1, 1, 1) = (6, 6, 6)$. The orthogonal part is $\mathbf{x} - (6, 6, 6) = (7, -5, -2)$, and its dot product with $(1, 1, 1)$ is $0$.'
          - problem: 'Find the orthogonal projection of $(7, -9)$ onto the line spanned by $(3, -1)$.'
            answer: '(9, -3)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'The dot products are $(7, -9)\cdot(3, -1) = 30$ and $(3, -1)\cdot(3, -1) = 10$. The projection is $\frac{30}{10}(3, -1) = (9, -3)$.'
          - problem: 'A box rests on a ramp that runs in the direction $(3, 4)$. Gravity pulls on the box with the force $(0, -50)$ newtons. Find the component of this force along the ramp.'
            answer: '(-24, -32)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'The component along the ramp is the projection onto $(3, 4)$. The dot products are $(0, -50)\cdot(3, 4) = -200$ and $(3, 4)\cdot(3, 4) = 25$, so the component is $-8(3, 4) = (-24, -32)$.'
          - problem: 'A wind with velocity $(7, 9, 4)$ km/h blows into a straight tunnel that runs in the direction $(2, 2, 1)$. Find the part of the wind velocity that points along the tunnel.'
            answer: '(8, 8, 4)'
            answer_contract: {"kind": "coordinates", "arity": 3}
            solution_sketch: 'The part along the tunnel is the projection onto $(2, 2, 1)$. The dot products are $36$ and $9$, so the part is $4(2, 2, 1) = (8, 8, 4)$.'
          - problem: 'Let $W = \operatorname{span}\{(1, 2)\}$ and $\mathbf{x} = (8, 6)$. Write $\mathbf{x} = \hat{\mathbf{x}} + \mathbf{z}$ with $\hat{\mathbf{x}}$ in $W$ and $\mathbf{z}$ orthogonal to $W$. What is $\mathbf{z}$?'
            answer: '(4, -2)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'The projection is $\hat{\mathbf{x}} = \frac{20}{5}(1, 2) = (4, 8)$. So $\mathbf{z} = \mathbf{x} - \hat{\mathbf{x}} = (8, 6) - (4, 8) = (4, -2)$.'
          - problem: 'A crate on a ramp with direction $(1, 3)$ is pulled by the force $(10, -30)$ newtons. Find the part of the force that is perpendicular to the ramp.'
            answer: '(18, -6)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'The part along the ramp is $\frac{-80}{10}(1, 3) = (-8, -24)$. The perpendicular part is $(10, -30) - (-8, -24) = (18, -6)$.'
          - problem: 'Sam finds the part of $(4, 2)$ that is orthogonal to $W = \operatorname{span}\{(1, 1)\}$ by subtracting $(1, 1)$ from $(4, 2)$ and gets $(3, 1)$. What is the correct vector?'
            answer: '(1, -1)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'Sam subtracted the basis vector, but he must subtract the projection. The projection is $\frac{6}{2}(1, 1) = (3, 3)$, and $(4, 2) - (3, 3) = (1, -1)$.'
          - problem: 'Write $(10, 5)$ as $\hat{\mathbf{x}} + \mathbf{z}$ with $\hat{\mathbf{x}}$ in $\operatorname{span}\{(2, 1)\}$ and $\mathbf{z}$ orthogonal to $(2, 1)$. Find the number $k$ with $\hat{\mathbf{x}} = k(2, 1)$.'
            answer: '5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The number is $k = \frac{(10, 5)\cdot(2, 1)}{(2, 1)\cdot(2, 1)} = \frac{25}{5} = 5$. So $\hat{\mathbf{x}} = (10, 5)$ and $\mathbf{z} = (0, 0)$, because $(10, 5)$ already lies in the line.'
        constraints: 'W is a line with an integer direction; the parts have integer entries; contexts with forces and ramps are allowed; verify z is orthogonal'
      - id: kp3
        name: Distance to a subspace
        key_prerequisites: [orthogonal-orthonormal-sets, vector-projections]
        try_first:
          problem: 'How far is the point $(5, 12)$ from the line $y = 0$?'
          answer_contract: {"kind": "exact"}
          answer: '12'
          reveal: 'The closest point of the line is $(5, 0)$, the projection of $(5, 12)$. The distance is the length of what is left over, the vector $(0, 12)$, which is $12$.'
        exemplars:
          - problem: 'Find the distance from the point $(3, 1)$ to the line $\operatorname{span}\{(1, 1)\}$.'
            answer: 'sqrt(2)'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The projection of $(3, 1)$ onto the line is $\frac{4}{2}(1, 1) = (2, 2)$. The residual is $(1, -1)$, and its length $\sqrt{2}$ is the distance.'
          - problem: 'Find the distance from the point $(1, 3, 2)$ to the line $\operatorname{span}\{(1, 1, 0)\}$ in $\mathbb{R}^3$.'
            answer: 'sqrt(6)'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The projection of $(1, 3, 2)$ is $\frac{4}{2}(1, 1, 0) = (2, 2, 0)$. The residual is $(-1, 1, 2)$, and its length is $\sqrt{1 + 1 + 4} = \sqrt{6}$.'
          - problem: 'Find the distance from the point $(1, 1, 3)$ to the plane $W = \operatorname{span}\{(1, 2, 0), (2, -1, 0)\}$.'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The plane $W$ is the plane $z = 0$, and its basis is orthogonal. The projection of $(1, 1, 3)$ is $(1, 1, 0)$, so the residual is $(0, 0, 3)$ and the distance is $3$.'
          - problem: 'A line through the origin of $\mathbb{R}^2$ has direction $(2, -1)$. Find the distance from the point $(5, 0)$ to this line.'
            answer: 'sqrt(5)'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The projection of $(5, 0)$ is $\frac{10}{5}(2, -1) = (4, -2)$. The residual is $(1, 2)$, and its length is $\sqrt{1 + 4} = \sqrt{5}$.'
          - problem: 'For $c > 0$, the distance from the point $(2, 4, c)$ to the line $\operatorname{span}\{(1, 1, 0)\}$ equals $\sqrt{3}$. Find $c$.'
            answer: '1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The projection of $(2, 4, c)$ is $3(1, 1, 0)$, so the residual is $(-1, 1, c)$. Its squared length $2 + c^2$ equals $3$, so $c^2 = 1$ and $c = 1$.'
          - problem: 'On a map in kilometres a straight road runs through the origin in the direction $(3, 4)$. A village is at the point $(5, 10)$. What is the shortest distance from the village to the road?'
            answer: '2'
            answer_contract: {"kind": "unit", "quantity": "length", "unit": "km", "allow_omitted": true}
            solution_sketch: 'The projection of $(5, 10)$ onto the road is $\frac{55}{25}(3, 4) = \left(\frac{33}{5}, \frac{44}{5}\right)$. The residual is $\left(-\frac{8}{5}, \frac{6}{5}\right)$, and its length is $\frac{10}{5} = 2$ km.'
          - problem: 'A cable runs from the origin in the direction $(2, 1, 2)$. A drone hovers at the point $(3, 3, 0)$, with coordinates in metres. What is the shortest distance from the drone to the cable?'
            answer: '3'
            answer_contract: {"kind": "unit", "quantity": "length", "unit": "m", "allow_omitted": true}
            solution_sketch: 'The projection of $(3, 3, 0)$ onto the cable is $\frac{9}{9}(2, 1, 2) = (2, 1, 2)$. The residual is $(1, 2, -2)$, and its length is $\sqrt{1 + 4 + 4} = 3$ m.'
          - problem: 'Sam says that the distance from $(3, 4)$ to the line $\operatorname{span}\{(1, 0)\}$ is $3$, the length of the projection. What is the distance?'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The projection of $(3, 4)$ onto the line is $(3, 0)$, and the distance is the length of the residual. The residual is $(0, 4)$, so the distance is $4$.'
          - problem: 'Find the point of the line $\operatorname{span}\{(1, 2)\}$ that is closest to $(4, 3)$.'
            answer: '(2, 4)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'The closest point is the orthogonal projection of $(4, 3)$ onto the line. It is $\frac{10}{5}(1, 2) = (2, 4)$.'
        constraints: 'distances are integers or single square roots; contexts with roads, cables and points on a map are allowed'
    diagnostic_exemplar:
      problem: 'Write $\mathbf{x} = (5, 1)$ as $\hat{\mathbf{x}} + \mathbf{z}$ with $\hat{\mathbf{x}}$ in $W = \mathrm{span}\{(1, 1)\}$ and $\mathbf{z} \perp W$, and give the distance from $\mathbf{x}$ to $W$.'
      answer: '$\hat{\mathbf{x}} = (3, 3)$, $\mathbf{z} = (2, -2)$; the distance is $2\sqrt{2}$'
      answer_contract: {kind: none}
      solution_sketch: '$\hat{\mathbf{x}} = \frac{5 + 1}{2}(1, 1) = (3, 3)$, so $\mathbf{z} = (2, -2)$ and the distance is $\|\mathbf{z}\| = 2\sqrt2$.'
    anki_seeds:
      - front: 'Projection of $\mathbf{x}$ onto a subspace with ORTHOGONAL basis $\{\mathbf{v}_1, \dots, \mathbf{v}_k\}$?'
        back: '$\hat{\mathbf{x}} = \sum_i \dfrac{\mathbf{x} \cdot \mathbf{v}_i}{\mathbf{v}_i \cdot \mathbf{v}_i}\mathbf{v}_i$.'
        type: basic
      - front: 'In the orthogonal decomposition $\mathbf{x} = \hat{\mathbf{x}} + \mathbf{z}$, the two parts satisfy...'
        back: '$\hat{\mathbf{x}} \in W$ and $\mathbf{z} \in W^\perp$; $\hat{\mathbf{x}}$ is the closest point of $W$ to $\mathbf{x}$.'
        type: basic
      - front: 'Distance from $\mathbf{x}$ to a subspace $W$?'
        back: '$\|\mathbf{x} - \hat{\mathbf{x}}\|$, the norm of the residual after projecting onto $W$.'
        type: basic

  - id: orthogonality-gram-schmidt
    name: Orthogonality and Gram-Schmidt
    core: false                # orthogonality branch; terminal
    difficulty: 0.75
    drill: false
    answer_kind: numeric
    expected_time_secs: 300
    prerequisites:
      - id: orthogonal-orthonormal-sets
        weight: 0.7
        key: true
      - id: vector-projections
        weight: 0.7
        key: true
      - id: basis-dimension
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: The Gram-Schmidt step
        key_prerequisites: [vector-projections, orthogonal-orthonormal-sets]
        try_first:
          problem: 'Find the number $c$ for which $(2, 3) - c(1, 1)$ is orthogonal to $(1, 1)$.'
          answer_contract: {"kind": "exact"}
          answer: '5/2'
          reveal: 'The dot product $(2 - c) + (3 - c) = 5 - 2c$ must be $0$, so $c = \frac{5}{2}$. This number is $\frac{\mathbf{x}\cdot\mathbf{v}}{\mathbf{v}\cdot\mathbf{v}}$, the coefficient of the Gram-Schmidt step.'
        exemplars:
          - problem: 'Apply the Gram-Schmidt process to $\mathbf{x}_1 = (1, 2)$ and $\mathbf{x}_2 = (4, 3)$ to get an orthogonal pair $\mathbf{v}_1, \mathbf{v}_2$. What is $\mathbf{v}_2$?'
            answer: '(2, -1)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'Keep $\mathbf{v}_1 = (1, 2)$. The coefficient is $\frac{\mathbf{x}_2\cdot\mathbf{v}_1}{\mathbf{v}_1\cdot\mathbf{v}_1} = \frac{10}{5} = 2$, so $\mathbf{v}_2 = (4, 3) - 2(1, 2) = (2, -1)$.'
          - problem: 'Apply the Gram-Schmidt process to $\mathbf{x}_1 = (1, 1, 2)$ and $\mathbf{x}_2 = (3, 1, 1)$, with $\mathbf{v}_1 = \mathbf{x}_1$. What is $\mathbf{v}_2$?'
            answer: '(2, 0, -1)'
            answer_contract: {"kind": "coordinates", "arity": 3}
            solution_sketch: 'The coefficient is $\frac{\mathbf{x}_2\cdot\mathbf{v}_1}{\mathbf{v}_1\cdot\mathbf{v}_1} = \frac{6}{6} = 1$. So $\mathbf{v}_2 = (3, 1, 1) - (1, 1, 2) = (2, 0, -1)$.'
          - problem: 'The Gram-Schmidt process starts with $\mathbf{x}_1 = (4, 2)$ and $\mathbf{x}_2 = (0, 5)$, and $\mathbf{v}_1 = \mathbf{x}_1$. Find the second vector $\mathbf{v}_2$.'
            answer: '(-2, 4)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'The coefficient is $\frac{10}{20} = \frac{1}{2}$. So $\mathbf{v}_2 = (0, 5) - \frac{1}{2}(4, 2) = (-2, 4)$.'
          - problem: 'A Gram-Schmidt step starts with $\mathbf{x}_1 = (2, 3)$ and an unknown vector $\mathbf{x}_2$, and $\mathbf{v}_1 = \mathbf{x}_1$. The step gives $\mathbf{v}_2 = (3, -2)$, and the projection coefficient $\frac{\mathbf{x}_2\cdot\mathbf{v}_1}{\mathbf{v}_1\cdot\mathbf{v}_1}$ equals $2$. Find $\mathbf{x}_2$.'
            answer: '(7, 4)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'The step says $\mathbf{v}_2 = \mathbf{x}_2 - 2\mathbf{v}_1$, so $\mathbf{x}_2 = \mathbf{v}_2 + 2\mathbf{v}_1$. This is $(3, -2) + 2(2, 3) = (7, 4)$.'
          - problem: 'Apply the Gram-Schmidt process to $\mathbf{x}_1 = (4, 2, 2)$ and $\mathbf{x}_2 = (1, 2, 2)$, with $\mathbf{v}_1 = \mathbf{x}_1$. What is $\mathbf{v}_2$?'
            answer: '(-1, 1, 1)'
            answer_contract: {"kind": "coordinates", "arity": 3}
            solution_sketch: 'The coefficient is $\frac{12}{24} = \frac{1}{2}$. So $\mathbf{v}_2 = (1, 2, 2) - \frac{1}{2}(4, 2, 2) = (-1, 1, 1)$.'
          - problem: 'A robot has a first axis along $(3, 4)$ and a second axis along $(1, 2)$. The two axes are not perpendicular. The controller keeps the first axis and replaces the second by a perpendicular axis in the same plane, using the Gram-Schmidt process. What is the new second axis?'
            answer: '(-8/25, 6/25)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'The coefficient is $\frac{(1, 2)\cdot(3, 4)}{(3, 4)\cdot(3, 4)} = \frac{11}{25}$. So the new axis is $(1, 2) - \frac{11}{25}(3, 4) = \left(-\frac{8}{25}, \frac{6}{25}\right)$.'
          - problem: 'Two sensor axes point along $(1, 2, 2)$ and $(3, 3, 0)$. A program keeps the first axis and makes the second one perpendicular to it with the Gram-Schmidt process. What is the new second axis?'
            answer: '(2, 1, -2)'
            answer_contract: {"kind": "coordinates", "arity": 3}
            solution_sketch: 'The coefficient is $\frac{(3, 3, 0)\cdot(1, 2, 2)}{(1, 2, 2)\cdot(1, 2, 2)} = \frac{9}{9} = 1$. So the new axis is $(3, 3, 0) - (1, 2, 2) = (2, 1, -2)$.'
          - problem: 'Sam applies the Gram-Schmidt step to $\mathbf{x}_1 = (3, 1)$ and $\mathbf{x}_2 = (1, 2)$. He subtracts $\mathbf{x}_1$ itself instead of the projection and gets $(-2, 1)$. What is the correct $\mathbf{v}_2$?'
            answer: '(-1/2, 3/2)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'Sam should subtract the projection of $\mathbf{x}_2$ onto $\mathbf{x}_1$, not $\mathbf{x}_1$. The coefficient is $\frac{5}{10} = \frac{1}{2}$, so $\mathbf{v}_2 = (1, 2) - \frac{1}{2}(3, 1) = \left(-\frac{1}{2}, \frac{3}{2}\right)$.'
          - problem: 'A Gram-Schmidt step takes $\mathbf{x}_1 = (2, 1)$ and $\mathbf{x}_2 = (1, 3)$ to $\mathbf{v}_1 = \mathbf{x}_1$ and $\mathbf{v}_2 = (-1, 2)$. Is the pair $\mathbf{v}_1, \mathbf{v}_2$ orthogonal?'
            answer: 'yes'
            answer_contract: {"kind": "label", "options": [["yes", "yes, it is", "it is", "true", "correct"], ["no", "no, it is not", "it is not", "false", "incorrect"]]}
            solution_sketch: 'The dot product is $2(-1) + 1(2) = -2 + 2 = 0$. So the pair is orthogonal and the answer is yes.'
        constraints: 'two input vectors in R^2 or R^3; coefficients are integers or simple fractions; always verify orthogonality; contexts with axes and sensors are allowed'
      - id: kp2
        name: Gram-Schmidt with three vectors
        key_prerequisites: [vector-projections, orthogonal-orthonormal-sets, basis-dimension]
        exemplars:
          - problem: 'Apply the Gram-Schmidt process to $\mathbf{x}_1 = (0, 1, 0)$, $\mathbf{x}_2 = (1, 1, 0)$ and $\mathbf{x}_3 = (1, 1, 1)$. What is $\mathbf{v}_3$?'
            answer: '(0, 0, 1)'
            answer_contract: {"kind": "coordinates", "arity": 3}
            solution_sketch: 'Here $\mathbf{v}_1 = (0, 1, 0)$ and $\mathbf{v}_2 = (1, 0, 0)$. Subtracting the projections of $\mathbf{x}_3$ onto them gives $(1, 1, 1) - (0, 1, 0) - (1, 0, 0) = (0, 0, 1)$.'
          - problem: 'Orthogonalize $(1, 1, 1)$, $(1, 1, 0)$, $(1, 0, 0)$ in this order with the Gram-Schmidt process. What is the third vector of the orthogonal set?'
            answer: '(1/2, -1/2, 0)'
            answer_contract: {"kind": "coordinates", "arity": 3}
            solution_sketch: 'The first two vectors are $\mathbf{v}_1 = (1, 1, 1)$ and $\mathbf{v}_2 = \left(\frac{1}{3}, \frac{1}{3}, -\frac{2}{3}\right)$. The coefficients for $(1, 0, 0)$ are $\frac{1}{3}$ and $\frac{1/3}{2/3} = \frac{1}{2}$, which give $\left(\frac{1}{2}, -\frac{1}{2}, 0\right)$.'
          - problem: 'Let $\mathbf{x}_1 = (1, 1, 0)$, $\mathbf{x}_2 = (0, 1, 1)$ and $\mathbf{x}_3 = (1, 0, 1)$. The Gram-Schmidt process gives an orthogonal set $\mathbf{v}_1, \mathbf{v}_2, \mathbf{v}_3$ with $\mathbf{v}_1 = \mathbf{x}_1$. Find $\mathbf{v}_3$.'
            answer: '(2/3, -2/3, 2/3)'
            answer_contract: {"kind": "coordinates", "arity": 3}
            solution_sketch: 'First $\mathbf{v}_2 = (0, 1, 1) - \frac{1}{2}(1, 1, 0) = \left(-\frac{1}{2}, \frac{1}{2}, 1\right)$. Then the coefficients for $\mathbf{x}_3$ are $\frac{1}{2}$ and $\frac{1/2}{3/2} = \frac{1}{3}$, which give $\mathbf{v}_3 = \left(\frac{2}{3}, -\frac{2}{3}, \frac{2}{3}\right)$.'
          - problem: 'The Gram-Schmidt process is applied to $\mathbf{x}_1 = (1, 0, 1)$, $\mathbf{x}_2 = (1, 1, 0)$ and $\mathbf{x}_3 = (0, 1, 1)$. The last step has the form $\mathbf{v}_3 = \mathbf{x}_3 - a\mathbf{v}_1 - b\mathbf{v}_2$. Find $a$ and $b$.'
            answer: '(1/2, 1/3)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'Here $\mathbf{v}_1 = (1, 0, 1)$ and $\mathbf{v}_2 = \left(\frac{1}{2}, 1, -\frac{1}{2}\right)$. Then $a = \frac{1}{2}$ and $b = \frac{1/2}{3/2} = \frac{1}{3}$.'
          - problem: 'A surveyor has three sight lines from one point along $(2, 1, 1)$, $(0, 3, 3)$ and $(2, 0, 3)$. A program replaces them by perpendicular lines with the Gram-Schmidt process, in this order. What is the direction of the third line?'
            answer: '(0, -3/2, 3/2)'
            answer_contract: {"kind": "coordinates", "arity": 3}
            solution_sketch: 'The second line is $(0, 3, 3) - \frac{6}{6}(2, 1, 1) = (-2, 2, 2)$. For $(2, 0, 3)$ the coefficients are $\frac{7}{6}$ and $\frac{2}{12} = \frac{1}{6}$, which give $\left(0, -\frac{3}{2}, \frac{3}{2}\right)$.'
          - problem: 'The Gram-Schmidt process is applied, in the order given, to $(1, 0, 0)$, $(0, 1, 1)$ and $(1, 1, 0)$. Find the vector that replaces $(1, 1, 0)$.'
            answer: '(0, 1/2, -1/2)'
            answer_contract: {"kind": "coordinates", "arity": 3}
            solution_sketch: 'The first two vectors are $(1, 0, 0)$ and $(0, 1, 1)$, which are orthogonal already. The projections of $(1, 1, 0)$ are $(1, 0, 0)$ and $\frac{1}{2}(0, 1, 1)$, so the new vector is $\left(0, \frac{1}{2}, -\frac{1}{2}\right)$.'
          - problem: 'Apply Gram-Schmidt to $\mathbf{x}_1 = (1, 1, 1)$, $\mathbf{x}_2 = (1, 1, 0)$, $\mathbf{x}_3 = (1, 0, 1)$ and find $\mathbf{v}_3\cdot\mathbf{v}_3$.'
            answer: '1/2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The first two vectors are $(1, 1, 1)$ and $\left(\frac{1}{3}, \frac{1}{3}, -\frac{2}{3}\right)$, and the third is $\mathbf{v}_3 = \left(\frac{1}{2}, -\frac{1}{2}, 0\right)$. So $\mathbf{v}_3\cdot\mathbf{v}_3 = \frac{1}{4} + \frac{1}{4} = \frac{1}{2}$.'
          - problem: 'A mounting frame has three struts along $(1, 1, 2)$, $(0, 0, 3)$ and $(2, 3, 3)$. A designer replaces them by perpendicular struts with the Gram-Schmidt process, in this order. What is the direction of the second strut?'
            answer: '(-1, -1, 1)'
            answer_contract: {"kind": "coordinates", "arity": 3}
            solution_sketch: 'The coefficient is $\frac{6}{6} = 1$. So the second strut is $(0, 0, 3) - (1, 1, 2) = (-1, -1, 1)$.'
          - problem: 'Apply the Gram-Schmidt step to $\mathbf{x}_1 = (1, 2, 2)$ and $\mathbf{x}_2 = (3, 6, 6)$. What is $\mathbf{v}_2$?'
            answer: '(0, 0, 0)'
            answer_contract: {"kind": "coordinates", "arity": 3}
            solution_sketch: 'The coefficient is $\frac{27}{9} = 3$. So $\mathbf{v}_2 = (3, 6, 6) - 3(1, 2, 2) = (0, 0, 0)$, which shows that $\mathbf{x}_2$ is a multiple of $\mathbf{x}_1$ and the two vectors are dependent.'
        constraints: 'two or three vectors in R^3 with small integer entries; fractions limited to halves and thirds; a dependent input vector that gives the zero vector is allowed; verify all pairwise dot products'
      - id: kp3
        name: Producing an orthonormal basis
        key_prerequisites: [orthogonal-orthonormal-sets, vector-projections]
        exemplars:
          - problem: 'Apply the Gram-Schmidt process to $(3, 4)$ and $(1, 0)$, and normalize the result. What is the second vector of the orthonormal basis?'
            answer: '(4/5, -3/5)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'The coefficient is $\frac{3}{25}$, so $\mathbf{v}_2 = (1, 0) - \frac{3}{25}(3, 4) = \left(\frac{16}{25}, -\frac{12}{25}\right)$. Its length is $\frac{20}{25} = \frac{4}{5}$, so the unit vector is $\left(\frac{4}{5}, -\frac{3}{5}\right)$.'
          - problem: 'Apply the Gram-Schmidt process to $(4, 3)$ and $(5, 0)$, and normalize the result. What is the second vector of the orthonormal basis?'
            answer: '(3/5, -4/5)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'The coefficient is $\frac{20}{25} = \frac{4}{5}$, so $\mathbf{v}_2 = (5, 0) - \frac{4}{5}(4, 3) = \left(\frac{9}{5}, -\frac{12}{5}\right)$. Its length is $3$, so the unit vector is $\left(\frac{3}{5}, -\frac{4}{5}\right)$.'
          - problem: 'A camera dolly runs along $(1, 1)$ and a crane arm along $(4, 3)$. The software keeps the dolly direction and replaces the arm direction by the unit vector that the Gram-Schmidt process gives. What is this unit vector?'
            answer: '(sqrt(2)/2, -sqrt(2)/2)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'The coefficient is $\frac{7}{2}$, so $\mathbf{v}_2 = (4, 3) - \frac{7}{2}(1, 1) = \left(\frac{1}{2}, -\frac{1}{2}\right)$. Its length is $\frac{\sqrt{2}}{2}$, so the unit vector is $\left(\frac{\sqrt{2}}{2}, -\frac{\sqrt{2}}{2}\right)$.'
          - problem: 'Apply the Gram-Schmidt process to $(4, 3)$ and $(0, 5)$, and normalize the result. What is the second vector of the orthonormal basis?'
            answer: '(-3/5, 4/5)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'The coefficient is $\frac{15}{25} = \frac{3}{5}$, so $\mathbf{v}_2 = (0, 5) - \frac{3}{5}(4, 3) = \left(-\frac{12}{5}, \frac{16}{5}\right)$. Its length is $4$, so the unit vector is $\left(-\frac{3}{5}, \frac{4}{5}\right)$.'
          - problem: 'Apply the Gram-Schmidt process to $(3, 4, 0)$, $(0, 5, 0)$ and $(0, 0, 5)$, and normalize the result. What is the second vector of the orthonormal basis?'
            answer: '(-4/5, 3/5, 0)'
            answer_contract: {"kind": "coordinates", "arity": 3}
            solution_sketch: 'The coefficient is $\frac{20}{25} = \frac{4}{5}$, so $\mathbf{v}_2 = (0, 5, 0) - \frac{4}{5}(3, 4, 0) = \left(-\frac{12}{5}, \frac{9}{5}, 0\right)$. Its length is $3$, so the unit vector is $\left(-\frac{4}{5}, \frac{3}{5}, 0\right)$.'
          - problem: 'A game engine is given the directions $(5, 12)$ and $(1, 5)$. It keeps the first direction and builds a perpendicular unit direction with the Gram-Schmidt process. What is this unit direction?'
            answer: '(-12/13, 5/13)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'The coefficient is $\frac{65}{169} = \frac{5}{13}$, so $\mathbf{v}_2 = (1, 5) - \frac{5}{13}(5, 12) = \left(-\frac{12}{13}, \frac{5}{13}\right)$. Its length is $\frac{\sqrt{144 + 25}}{13} = 1$, so it is already a unit vector.'
          - problem: 'The Gram-Schmidt process is applied to $(4, 3)$ and $(1, 1)$. What is the length of the second vector $\mathbf{v}_2$ before it is normalized?'
            answer: '1/5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The coefficient is $\frac{7}{25}$, so $\mathbf{v}_2 = (1, 1) - \frac{7}{25}(4, 3) = \left(-\frac{3}{25}, \frac{4}{25}\right)$. Its length is $\frac{\sqrt{9 + 16}}{25} = \frac{5}{25} = \frac{1}{5}$.'
          - problem: 'Ana applies the Gram-Schmidt process to $(3, 4)$ and $(1, 2)$ and normalizes. She gets the orthonormal basis $\{(3/5, 4/5), (-4/5, 3/5)\}$. Is her answer correct?'
            answer: 'yes'
            answer_contract: {"kind": "label", "options": [["yes", "yes, it is", "it is", "true", "correct"], ["no", "no, it is not", "it is not", "false", "incorrect"]]}
            solution_sketch: 'The first vector $(3, 4)$ has length $5$, which gives $\left(\frac{3}{5}, \frac{4}{5}\right)$. The second vector is $(1, 2) - \frac{11}{25}(3, 4) = \left(-\frac{8}{25}, \frac{6}{25}\right)$, and normalizing gives $\left(-\frac{4}{5}, \frac{3}{5}\right)$. So her answer is correct.'
        constraints: 'norms are 5, 13 or sqrt(2); rescale fraction vectors to integer directions before normalizing; ask for one vector of the basis at a time'
    diagnostic_exemplar:
      problem: 'Apply Gram-Schmidt to $\mathbf{x}_1 = (3, 4)$, $\mathbf{x}_2 = (1, 2)$, then normalize to an orthonormal basis of $\mathbb{R}^2$.'
      answer: '{(3/5, 4/5), (-4/5, 3/5)}'
      solution_sketch: '$\mathbf{v}_1 = (3,4)$ and $\mathbf{v}_2 = (1,2) - \frac{11}{25}(3,4) = \frac{2}{25}(-4, 3)$; dividing each by its norm gives the orthonormal pair.'
    anki_seeds:
      - front: 'Gram-Schmidt step: $\mathbf{v}_2 = \mathbf{x}_2 - {}$?'
        back: '$\dfrac{\mathbf{x}_2 \cdot \mathbf{v}_1}{\mathbf{v}_1 \cdot \mathbf{v}_1}\,\mathbf{v}_1$ (subtract the projection onto what is already built).'
        type: basic
      - front: 'General Gram-Schmidt step for $\mathbf{v}_k$?'
        back: '$\mathbf{x}_k$ minus its projections onto ALL previously built $\mathbf{v}_1, \dots, \mathbf{v}_{k-1}$.'
        type: basic
      - front: 'Gram-Schmidt turns any basis of a subspace into...'
        back: 'an orthogonal basis of the same subspace (orthonormal after normalizing).'
        type: basic

  - id: least-squares-approximation
    name: Least-Squares Approximation
    core: false                # applications capstone of the orthogonality branch
    difficulty: 0.75
    drill: false
    answer_kind: numeric
    expected_time_secs: 300
    prerequisites:
      - id: orthogonal-projection-subspace
        weight: 0.7
        key: true
      - id: transpose-symmetric-matrices
        weight: 0.5
        key: true
      - id: matrix-inverses
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: The normal equations
        key_prerequisites: [orthogonal-projection-subspace, transpose-symmetric-matrices]
        exemplars:
          - problem: 'Find the least-squares solution of $A\mathbf{x} = \mathbf{b}$, where $A = \begin{pmatrix} 1 & 1 \\ 1 & 0 \\ 0 & 1 \end{pmatrix}$ and $\mathbf{b} = (0, 2, 1)$.'
            answer: '(1, 0)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'The normal equations are $A^TA\hat{\mathbf{x}} = A^T\mathbf{b}$ with $A^TA = \begin{pmatrix} 2 & 1 \\ 1 & 2 \end{pmatrix}$ and $A^T\mathbf{b} = (2, 1)$. Solving $2x_1 + x_2 = 2$ and $x_1 + 2x_2 = 1$ gives $\hat{\mathbf{x}} = (1, 0)$.'
          - problem: 'The system $x_1 = 2$, $x_2 = 2$, $x_1 + x_2 = 1$ has no solution. Find its least-squares solution.'
            answer: '(1, 1)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'In matrix form $A = \begin{pmatrix} 1 & 0 \\ 0 & 1 \\ 1 & 1 \end{pmatrix}$ and $\mathbf{b} = (2, 2, 1)$. The normal equations are $2x_1 + x_2 = 3$ and $x_1 + 2x_2 = 3$, so $\hat{\mathbf{x}} = (1, 1)$.'
          - problem: 'Let $A = \begin{pmatrix} 1 & 0 \\ 1 & 1 \\ 0 & 1 \end{pmatrix}$ and $\mathbf{b} = (3, 3, 3)$. Solve the normal equations $A^TA\hat{\mathbf{x}} = A^T\mathbf{b}$.'
            answer: '(2, 2)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'Here $A^TA = \begin{pmatrix} 2 & 1 \\ 1 & 2 \end{pmatrix}$ and $A^T\mathbf{b} = (6, 6)$. The equations $2x_1 + x_2 = 6$ and $x_1 + 2x_2 = 6$ give $\hat{\mathbf{x}} = (2, 2)$.'
          - problem: 'Two parts are weighed on a scale. Part $A$ alone reads $5$ kg, part $B$ alone reads $4$ kg, and both together read $10$ kg. The readings cannot all be exact. Find the least-squares estimates of the masses of $A$ and $B$, in kilograms.'
            answer: '(16/3, 13/3)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'With $x_1, x_2$ the two masses, $A = \begin{pmatrix} 1 & 0 \\ 0 & 1 \\ 1 & 1 \end{pmatrix}$ and $\mathbf{b} = (5, 4, 10)$. The normal equations are $2x_1 + x_2 = 15$ and $x_1 + 2x_2 = 14$, so $\hat{\mathbf{x}} = \left(\frac{16}{3}, \frac{13}{3}\right)$.'
          - problem: 'A surveyor measures that hill $P$ is $3$ m above a benchmark, hill $Q$ is $5$ m above it, and $Q$ is $1$ m higher than $P$. The three measurements disagree. Find the least-squares estimates of the heights of $P$ and $Q$ above the benchmark.'
            answer: '(10/3, 14/3)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'With heights $x_1, x_2$ the equations are $x_1 = 3$, $x_2 = 5$ and $-x_1 + x_2 = 1$. The normal equations are $2x_1 - x_2 = 2$ and $-x_1 + 2x_2 = 6$, so $\hat{\mathbf{x}} = \left(\frac{10}{3}, \frac{14}{3}\right)$.'
          - problem: 'Let $A = \begin{pmatrix} 1 & 1 \\ 1 & 1 \\ 1 & 0 \end{pmatrix}$ and $\mathbf{b} = (4, t, 3)$. The vector $\hat{\mathbf{x}} = (3, 2)$ is the least-squares solution of $A\mathbf{x} = \mathbf{b}$. Find $t$.'
            answer: '6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The residual $\mathbf{b} - A\hat{\mathbf{x}} = (-1, t - 5, 0)$ must be orthogonal to both columns of $A$. The first column gives $-1 + t - 5 = 0$, so $t = 6$.'
          - problem: 'Does the system $x_1 + x_2 = 0$, $x_1 = 2$, $x_2 = 1$ have an exact solution?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "yes, it does", "it does", "it has a solution", "true"], ["no", "no, it does not", "it does not", "it has no solution", "false"]]}
            solution_sketch: 'The second and third equations force $x_1 = 2$ and $x_2 = 1$. These values give $x_1 + x_2 = 3$, not $0$, so the system is inconsistent and has no exact solution.'
          - problem: 'A line $y = a + bx$ is fitted to data at $x = 0, 1, 2$. The matrix of the system is $A = \begin{pmatrix} 1 & 0 \\ 1 & 1 \\ 1 & 2 \end{pmatrix}$. Find $A^TA$.'
            answer: '[[3,3],[3,5]]'
            answer_contract: {"kind": "matrix", "rows": 2, "cols": 2}
            solution_sketch: 'The entries of $A^TA$ are dot products of the columns $(1, 1, 1)$ and $(0, 1, 2)$. They are $3$, $0 + 1 + 2 = 3$ and $0 + 1 + 4 = 5$, so $A^TA = \begin{pmatrix} 3 & 3 \\ 3 & 5 \end{pmatrix}$.'
          - problem: 'Let $A = \begin{pmatrix} 1 & 1 \\ 0 & 1 \\ 1 & 0 \end{pmatrix}$ and $\mathbf{b} = (4, 4, 3)$. Find the vector in the column space of $A$ that is closest to $\mathbf{b}$.'
            answer: '(5, 3, 2)'
            answer_contract: {"kind": "coordinates", "arity": 3}
            solution_sketch: 'The closest vector is $A\hat{\mathbf{x}}$, where $\hat{\mathbf{x}}$ solves the normal equations $2x_1 + x_2 = 7$ and $x_1 + 2x_2 = 8$. This gives $\hat{\mathbf{x}} = (2, 3)$, so the closest vector is $A\hat{\mathbf{x}} = (2 + 3, 3, 2) = (5, 3, 2)$.'
        constraints: '3x2 matrices with small integer entries; A^T A is 2x2 with a solution of integers or thirds; word problems with measurements are allowed'
      - id: kp2
        name: Least-squares lines
        key_prerequisites: [orthogonal-projection-subspace, transpose-symmetric-matrices]
        exemplars:
          - problem: 'Find the least-squares line $y = a + bx$ through the points $(-1, 0)$, $(0, 4)$ and $(1, 2)$.'
            answer: 'y = 2 + x'
            answer_contract: {"kind": "polynomial_relation"}
            solution_sketch: 'The $x$-values $-1, 0, 1$ are symmetric, so $a$ is the mean of the $y$-values: $a = \frac{0 + 4 + 2}{3} = 2$. The slope is $b = \frac{(-1)(0) + 0(4) + 1(2)}{2} = 1$, so the line is $y = 2 + x$.'
          - problem: 'Find the least-squares line $y = a + bx$ through the points $(-1, 3)$, $(0, 1)$ and $(1, 5)$.'
            answer: 'y = 3 + x'
            answer_contract: {"kind": "polynomial_relation"}
            solution_sketch: 'The mean of the $y$-values is $a = \frac{3 + 1 + 5}{3} = 3$. The slope is $b = \frac{-3 + 0 + 5}{2} = 1$, so the line is $y = 3 + x$.'
          - problem: 'A spring has length $5$ cm without a load, $12$ cm under a load of $1$ kg and $13$ cm under a load of $2$ kg. Find the least-squares line $L = a + bw$ for the length $L$ in centimetres against the load $w$ in kilograms.'
            answer: 'L = 6 + 4w'
            answer_contract: {"kind": "polynomial_relation"}
            solution_sketch: 'For the loads $0, 1, 2$ the normal equations are $3a + 3b = 30$ and $3a + 5b = 38$. Subtracting gives $2b = 8$, so $b = 4$, and then $a = 10 - 4 = 6$.'
          - problem: 'A cyclist is $2$ km from a hut after $0$ hours, $9$ km after $1$ hour and $10$ km after $2$ hours. Use the least-squares line through these points to estimate the distance from the hut after $3$ hours.'
            answer: '15'
            answer_contract: {"kind": "unit", "quantity": "length", "unit": "km", "allow_omitted": true}
            solution_sketch: 'The normal equations for the times $0, 1, 2$ are $3a + 3b = 21$ and $3a + 5b = 29$. Subtracting gives $b = 4$ and $a = 7 - 4 = 3$, so the line is $d = 3 + 4t$ and $d(3) = 3 + 12 = 15$ km.'
          - problem: 'The least-squares line through the points $(-1, 2)$, $(0, 2)$ and $(1, c)$ has slope $3$. Find $c$.'
            answer: '8'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'For these $x$-values the slope is $b = \frac{(-1)(2) + 0(2) + 1(c)}{2} = \frac{c - 2}{2}$. Setting $\frac{c - 2}{2} = 3$ gives $c = 8$.'
          - problem: 'Find the slope of the least-squares line through $(-1, 0)$, $(0, 1)$ and $(1, 5)$.'
            answer: '5/2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'For the symmetric $x$-values $-1, 0, 1$ the normal equations separate. The slope is then $b = \frac{(-1)(0) + 0(1) + 1(5)}{2} = \frac{5}{2}$.'
          - problem: 'Find the least-squares line $y = a + bx$ through the points $(1, 2)$, $(2, 3)$ and $(3, 6)$.'
            answer: 'y = 2x - 1/3'
            answer_contract: {"kind": "polynomial_relation"}
            solution_sketch: 'The sums are $\sum x = 6$, $\sum x^2 = 14$, $\sum y = 11$ and $\sum xy = 26$. The normal equations $3a + 6b = 11$ and $6a + 14b = 26$ give $b = 2$ and $a = -\frac{1}{3}$.'
          - problem: 'A tank holds $3$ litres, $0$ litres and $6$ litres at the times $t = -1$, $0$ and $1$ hours measured from noon. Find the least-squares line $h = a + bt$ for these three measurements.'
            answer: 'h = 3 + 3t/2'
            answer_contract: {"kind": "polynomial_relation"}
            solution_sketch: 'The mean of the readings is $a = \frac{3 + 0 + 6}{3} = 3$. The slope is $b = \frac{-3 + 0 + 6}{2} = \frac{3}{2}$, so the line is $h = 3 + \frac{3t}{2}$.'
        constraints: '3 points; x-values -1, 0, 1 decouple the normal equations, and x-values 0, 1, 2 or 1, 2, 3 need the 2x2 system; a and b are integers, halves or thirds; contexts with measurements are allowed'
      - id: kp3
        name: The residual and its size
        key_prerequisites: [orthogonal-projection-subspace, matrix-inverses]
        exemplars:
          - problem: 'For $A = \begin{pmatrix} 1 & 2 \\ 1 & 0 \\ 2 & 1 \end{pmatrix}$, $\mathbf{b} = (6, 8, 1)$ and the least-squares solution $\hat{\mathbf{x}} = (2, 1)$, find the residual $\mathbf{b} - A\hat{\mathbf{x}}$.'
            answer: '(2, 6, -4)'
            answer_contract: {"kind": "coordinates", "arity": 3}
            solution_sketch: 'The product is $A\hat{\mathbf{x}} = (1\cdot 2 + 2\cdot 1,\ 2,\ 2\cdot 2 + 1) = (4, 2, 5)$. So the residual is $(6 - 4, 8 - 2, 1 - 5) = (2, 6, -4)$.'
          - problem: 'For $A = \begin{pmatrix} 1 & 0 \\ 1 & 1 \\ 0 & 1 \end{pmatrix}$, $\mathbf{b} = (3, 3, 3)$ and the least-squares solution $\hat{\mathbf{x}} = (2, 2)$, find the least-squares error $\|\mathbf{b} - A\hat{\mathbf{x}}\|$.'
            answer: 'sqrt(3)'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The product is $A\hat{\mathbf{x}} = (2, 4, 2)$, so the residual is $(1, -1, 1)$. Its length is $\sqrt{1 + 1 + 1} = \sqrt{3}$.'
          - problem: 'For $A = \begin{pmatrix} 1 & 0 \\ 1 & 1 \\ 2 & 1 \end{pmatrix}$, $\mathbf{b} = (3, 6, 6)$ and $\hat{\mathbf{x}} = (2, 3)$, find the residual $\mathbf{b} - A\hat{\mathbf{x}}$.'
            answer: '(1, 1, -1)'
            answer_contract: {"kind": "coordinates", "arity": 3}
            solution_sketch: 'The product is $A\hat{\mathbf{x}} = (2, 5, 7)$. So the residual is $(3 - 2, 6 - 5, 6 - 7) = (1, 1, -1)$.'
          - problem: 'For $A = \begin{pmatrix} 1 & 1 \\ 2 & 1 \\ 1 & 3 \end{pmatrix}$, $\mathbf{b} = (7, 1, 3)$ and $\hat{\mathbf{x}} = (1, 1)$, find the least-squares error $\|\mathbf{b} - A\hat{\mathbf{x}}\|$.'
            answer: 'sqrt(30)'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The product is $A\hat{\mathbf{x}} = (2, 3, 4)$, so the residual is $(5, -2, -1)$. Its length is $\sqrt{25 + 4 + 1} = \sqrt{30}$.'
          - problem: 'A technician fits the least-squares line $y = 1 + x$ to the points $(0, 2)$, $(1, 0)$ and $(2, 4)$. Find the least-squares error, which is the length of the vector of the three vertical gaps between the data and the line.'
            answer: 'sqrt(6)'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The line gives the values $1, 2, 3$ at the three points, so the gaps are $2 - 1 = 1$, $0 - 2 = -2$ and $4 - 3 = 1$. The error is $\sqrt{1 + 4 + 1} = \sqrt{6}$.'
          - problem: 'Two parts are weighed on a scale. Part $A$ alone reads $5$ kg, part $B$ alone reads $4$ kg, and both together read $10$ kg. The least-squares estimates of the masses are $\frac{16}{3}$ kg and $\frac{13}{3}$ kg. Find the least-squares error.'
            answer: 'sqrt(3)/3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The estimates predict the readings $\frac{16}{3}$, $\frac{13}{3}$ and $\frac{29}{3}$ kg. The gaps are $-\frac{1}{3}$, $-\frac{1}{3}$ and $\frac{1}{3}$, so the error is $\sqrt{\frac{3}{9}} = \frac{\sqrt{3}}{3}$.'
          - problem: 'For $A = \begin{pmatrix} 1 & 1 \\ 0 & 1 \\ 1 & 0 \end{pmatrix}$ and $\mathbf{b} = (4, 0, 1)$, which of the candidates $\mathbf{x}_1 = (1, 1)$ and $\mathbf{x}_2 = (0, 2)$ gives the smaller residual norm $\|\mathbf{b} - A\mathbf{x}\|$?'
            answer: 'the first'
            answer_contract: {"kind": "label", "options": [["the first", "x1", "x_1", "first", "(1, 1)", "the first one", "the first candidate", "x_1 = (1, 1)"], ["the second", "x2", "x_2", "second", "(0, 2)", "the second one", "the second candidate", "x_2 = (0, 2)"]]}
            solution_sketch: 'For $\mathbf{x}_1$ the residual is $(4, 0, 1) - (2, 1, 1) = (2, -1, 0)$, with norm $\sqrt{5}$. For $\mathbf{x}_2$ the residual is $(4, 0, 1) - (2, 2, 0) = (2, -2, 1)$, with norm $3$, so the first candidate is closer.'
          - problem: 'For $A = \begin{pmatrix} 1 & 0 \\ 0 & 1 \\ 1 & 1 \end{pmatrix}$ and $\mathbf{b} = (1, 2, 4)$, is $(1, 2)$ the least-squares solution of $A\mathbf{x} = \mathbf{b}$?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "yes, it is", "it is", "true", "correct"], ["no", "no, it is not", "it is not", "false", "incorrect"]]}
            solution_sketch: 'The residual is $\mathbf{b} - A(1, 2) = (1, 2, 4) - (1, 2, 3) = (0, 0, 1)$. For a least-squares solution the residual must be orthogonal to every column of $A$, but $(0, 0, 1)\cdot(1, 0, 1) = 1 \ne 0$, so the answer is no.'
        constraints: 'residual entries small integers; error a single square root or a simple fraction of one; candidate comparison and orthogonality verdicts allowed'
    diagnostic_exemplar:
      problem: 'Find the least-squares line $y = a + bx$ through $(-1, 0)$, $(0, 2)$, $(1, 1)$, and the least-squares error $\|\mathbf{b} - A\hat{\mathbf{x}}\|$.'
      answer: '$y = 1 + \frac{x}{2}$; the residual is $(-\frac{1}{2}, 1, -\frac{1}{2})$ and the error is $\frac{\sqrt{6}}{2}$'
      answer_contract: {kind: none}
      solution_sketch: 'The normal equations give $a = \bar y = 1$ and $b = \sum x_iy_i / \sum x_i^2 = 1/2$; the residuals $-\frac12, 1, -\frac12$ have norm $\sqrt{3/2} = \sqrt6/2$.'
    anki_seeds:
      - front: 'The least-squares solution of $A\mathbf{x} = \mathbf{b}$ solves which system?'
        back: 'The normal equations $A^TA\hat{\mathbf{x}} = A^T\mathbf{b}$.'
        type: basic
      - front: 'Geometric meaning of the least-squares solution: $A\hat{\mathbf{x}}$ is...'
        back: 'the orthogonal projection of $\mathbf{b}$ onto $\mathrm{Col}(A)$.'
        type: basic
      - front: 'The least-squares residual $\mathbf{b} - A\hat{\mathbf{x}}$ is orthogonal to...'
        back: 'every column of $A$ (it lies in $\mathrm{Col}(A)^\perp$).'
        type: basic
